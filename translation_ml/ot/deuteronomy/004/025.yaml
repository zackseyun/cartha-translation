id: DEU.4.25
reference: Deuteronomy 4:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּֽי תוֹלִ֤יד בָּנִים֙ וּ/בְנֵ֣י בָנִ֔ים וְ/נוֹשַׁנְתֶּ֖ם בָּ/אָ֑רֶץ וְ/הִשְׁחַתֶּ֗ם וַ/עֲשִׂ֤יתֶם פֶּ֨סֶל֙ תְּמ֣וּנַת כֹּ֔ל וַ/עֲשִׂיתֶ֥ם הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָֽה אֱלֹהֶ֖י/ךָ לְ/הַכְעִיסֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/025.yaml
  text: When you father children and grandchildren[a], and you have grown old in the land, and you act corruptly and make a carved image in the form of anything, and do what is evil in the eyes of Yahweh your God[c][b], provoking him to anger—
translation:
  language: ml
  text: നിങ്ങൾക്ക് മക്കളും പേരക്കുട്ടികളും ഉണ്ടായശേഷം[a], നിങ്ങൾ ആ ദേശത്ത് ഏറെക്കാലം കഴിഞ്ഞ് പഴക്കംചെല്ലുകയും[b], ദുഷിച്ചു പ്രവർത്തിച്ച് എന്തിന്റെയെങ്കിലും രൂപത്തിലുള്ള[c] ഒരു കൊത്തിയ പ്രതിമ ഉണ്ടാക്കുകയും, നിങ്ങളുടെ ദൈവമായ യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ തിന്മ പ്രവർത്തിച്ച് അവനെ കോപിപ്പിക്കുകയും ചെയ്താൽ—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘പുത്രന്മാരും പുത്രന്മാരുടെ പുത്രന്മാരും.’ ഇവിടെ പുരുഷലിംഗ സന്തതിപദങ്ങൾ തലമുറകളിലൂടെയുള്ള സന്തതികളെ പൊതുവായി സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം.'
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ ‘ആ ദേശത്ത് ഏറെക്കാലം കഴിഞ്ഞിരിക്കുമ്പോൾ.’ ഹീബ്രു ക്രിയയ്ക്ക് പഴക്കംചെല്ലുക എന്നതിനോടൊപ്പം ദീർഘകാലം അവിടെ സ്ഥിരപ്പെട്ടിരിക്കുക എന്ന ആശയവും ഉണ്ടാകാം.
    reason: lexical_alternative
  - marker: c
    text: അല്ലെങ്കിൽ ‘എന്തിന്റെയെങ്കിലും സാദൃശ്യത്തിലുള്ള’ അഥവാ ‘ഏതെങ്കിലും രൂപത്തിലുള്ള.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ചെയ്താൽ
  rationale: ഇവിടെ ഈ പദം ഒരു കാരണവാക്യമല്ല, തുടർന്നുള്ള വാക്യത്തിലെ ഫലത്തിലേക്കു നയിക്കുന്ന ഭാവിയിലെ സാഹചര്യമാണ് അവതരിപ്പിക്കുന്നത്. മലയാളത്തിൽ അപൂർണമായി തുടരുന്ന നിബന്ധനാവാക്യം സ്വാഭാവികമാക്കാൻ ‘ചെയ്താൽ—’ എന്നു നൽകി.
- source_word: תוֹלִיד
  choice: നിങ്ങൾക്ക് … ഉണ്ടായിട്ട്
  rationale: ഹീബ്രു രൂപത്തിന് അക്ഷരാർഥത്തിൽ ‘നിങ്ങൾ ജനിപ്പിച്ച്/പിതാവായി’ എന്ന causative അർഥമുണ്ടെങ്കിലും, മലയാളത്തിൽ പുരുഷനോട് ‘മക്കളെ ജനിപ്പിക്കുക’ എന്നു പറയുന്നത് തെറ്റിദ്ധരിപ്പിക്കും. സന്തതികൾ ഉണ്ടാകുന്നതെന്ന ആശയം സ്വാഭാവികമായി അറിയിച്ചു.
- source_word: בָּנִים וּבְנֵי בָנִים
  choice: മക്കളും മക്കളുടെ മക്കളും
  rationale: അക്ഷരാർഥം ‘പുത്രന്മാരും പുത്രന്മാരുടെ പുത്രന്മാരും’ എന്നാണ്; എന്നാൽ തലമുറകളിലൂടെയുള്ള സന്തതിയെ സൂചിപ്പിക്കുന്ന ഈ സന്ദർഭത്തിൽ പൊതുവായ അർഥം മലയാളത്തിൽ വ്യക്തമാക്കി.
- source_word: וְנוֹשַׁנְתֶּם בָּאָרֶץ
  choice: ആ ദേശത്ത് ഏറെക്കാലം പാർത്തു പഴക്കംചെല്ലുമ്പോൾ
  rationale: ക്രിയയിൽ പഴക്കംചെല്ലുക എന്ന ദൃശ്യവും ദീർഘകാലം ദേശത്തു സ്ഥിരവാസം ചെയ്യുക എന്ന ആശയവും ഒത്തുചേരുന്നു; വിവർത്തനം രണ്ടും നിലനിർത്തുന്നു.
- source_word: וְהִשְׁחַתֶּם
  choice: നിങ്ങൾ ദുഷിച്ചുപോകുകയും
  rationale: ഇവിടെ ക്രിയ ഉടമ്പടിയോടുള്ള അവിശ്വസ്തതയിലൂടെ ധാർമികമായി ദുഷിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘ദുഷിച്ചുപോകുക’ എന്നത് അനാവശ്യമായ വ്യക്തമായ reflexive അർഥം ചേർക്കാതെ അത് അറിയിക്കുന്നു.
- source_word: פֶּסֶל
  choice: ഒരു കൊത്തുപ്രതിമ
  rationale: പദം കൊത്തിയോ രൂപപ്പെടുത്തിയതോ ആയ പ്രതിമയെ സൂചിപ്പിക്കുന്നു. ‘വിഗ്രഹം’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക പദത്തിനു പകരം നിർമാണരീതിയോട് അടുത്ത രൂപം തിരഞ്ഞെടുത്തു.
- source_word: תְּמוּנַת כֹּל
  choice: എന്തിന്റെയെങ്കിലും രൂപത്തിലുള്ള
  rationale: ഏതൊരു വസ്തുവിന്റെയോ ജീവിയുടെയോ രൂപസാദൃശ്യം എന്ന സമഗ്രമായ നിരോധനം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הָרַע בְּעֵינֵי
  choice: ദൃഷ്ടിയിൽ തിന്മയായതു
  rationale: ഹീബ്രുവിലെ ‘കണ്ണുകളിൽ’ എന്ന വിലയിരുത്തൽപ്രയോഗം മലയാളത്തിലെ സ്വാഭാവികമായ ‘ദൃഷ്ടിയിൽ’ എന്ന പ്രയോഗത്തിലൂടെ സംരക്ഷിച്ചു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: לְהַכְעִיסוֹ
  choice: അവനെ കോപിപ്പിക്കുകയും
  rationale: കാരണാർഥകമായ ക്രിയ ദൈവത്തെ കോപത്തിലേക്കു പ്രകോപിപ്പിക്കുന്ന ഫലം/ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം ഒരു പൊതുപദവിയല്ല, ഇസ്രായേലിന്റെ ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ പരമ്പരാഗത പകരപ്പദമായ ‘കർത്താവ്’ ഉപയോഗിക്കാതെ നാമം ലിപ്യന്തരിച്ചു.
- issue: בָּנִים וּבְנֵי בָנִים എന്ന പുരുഷലിംഗ സന്തതിപദങ്ങൾ
  choice: മക്കളും മക്കളുടെ മക്കളും
  alternative: പുത്രന്മാരും പുത്രന്മാരുടെ പുത്രന്മാരും
  rationale: ഹീബ്രുവിലെ രൂപങ്ങൾ പുരുഷലിംഗമാണെങ്കിലും, ഉടമ്പടിമുന്നറിയിപ്പിൽ തുടർച്ചയായ തലമുറകളിലെ സന്തതികളെ പൊതുവായി സൂചിപ്പിക്കുന്നു. അതിനാൽ പുരുഷന്മാർക്കു മാത്രമായി അർഥം ചുരുക്കിയില്ല; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. ഹീബ്രുവിലെ ഏകവചന-ബഹുവചന അഭിസംബോധനമാറ്റം മലയാളത്തിലെ ‘നിങ്ങൾ’ എന്ന രൂപം സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു. വാക്യത്തിന്റെ ഫലം അടുത്ത വാക്യത്തിൽ വരുന്നതിനാൽ അവസാനത്തിലെ ദീർഘവിരാമചിഹ്നം നിലനിർത്തി.
