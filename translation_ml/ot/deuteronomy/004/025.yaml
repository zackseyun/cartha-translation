revisions:
- from: നിങ്ങൾക്ക് മക്കളും മക്കളുടെ മക്കളും ഉണ്ടായിട്ട്[a], ആ ദേശത്ത് ഏറെക്കാലം പാർത്തു പഴക്കംചെല്ലുമ്പോൾ[b], നിങ്ങൾ ദുഷിച്ചുപോകുകയും എന്തിന്റെയെങ്കിലും രൂപത്തിലുള്ള[c] ഒരു കൊത്തുപ്രതിമ ഉണ്ടാക്കുകയും നിങ്ങളുടെ ദൈവമായ യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ തിന്മയായതു ചെയ്ത് അവനെ കോപിപ്പിക്കുകയും ചെയ്താൽ—
  to: നിങ്ങൾക്ക് മക്കളും പേരക്കുട്ടികളും ഉണ്ടായശേഷം[a], നിങ്ങൾ ആ ദേശത്ത് ഏറെക്കാലം കഴിഞ്ഞ് പഴക്കംചെല്ലുകയും[b], ദുഷിച്ചു പ്രവർത്തിച്ച് എന്തിന്റെയെങ്കിലും രൂപത്തിലുള്ള[c] ഒരു കൊത്തിയ പ്രതിമ ഉണ്ടാക്കുകയും, നിങ്ങളുടെ ദൈവമായ യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ തിന്മ പ്രവർത്തിച്ച് അവനെ കോപിപ്പിക്കുകയും ചെയ്താൽ—
  rationale: The revision retains the verse’s unresolved continuation into the following verse, indicated by the dash, while making the entire warning a coherent Malayalam conditional sequence. It uses natural terms for grandchildren and a carved image, preserves the generic force of the Hebrew descendant language, and keeps all lexical alternatives and anchors intact.
