reference: Deuteronomy 4:46
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בְּ/עֵ֨בֶר הַ/יַּרְדֵּ֜ן בַּ/גַּ֗יְא מ֚וּל בֵּ֣ית פְּע֔וֹר בְּ/אֶ֗רֶץ סִיחֹן֙ מֶ֣לֶךְ הָֽ/אֱמֹרִ֔י אֲשֶׁ֥ר יוֹשֵׁ֖ב בְּ/חֶשְׁבּ֑וֹן אֲשֶׁ֨ר הִכָּ֤ה מֹשֶׁה֙ וּ/בְנֵֽי יִשְׂרָאֵ֔ל בְּ/צֵאתָ֖/ם מִ/מִּצְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/046.yaml
  text: beyond the Jordan[a], in the valley opposite Beth-peor, in the land of Sihon king of the Amorites, who lived in Heshbon, whom Moses and the sons of Israel struck down when they came out from Egypt.
translation:
  language: ml
  text: യോർദ്ദാന്റെ അക്കരെ[a], ബേത്ത്-പെയോരിന് എതിരെയുള്ള താഴ്‌വരയിൽ, ഹെശ്ബോനിൽ പാർത്തിരുന്ന അമോര്യരുടെ രാജാവായ സീഹോന്റെ ദേശത്തുവെച്ചായിരുന്നു ഇത്. ഈജിപ്തിൽനിന്ന് അവർ പുറപ്പെട്ടപ്പോൾ മോശെയും ഇസ്രായേൽമക്കളും[b] അവനെ അടിച്ചുതോൽപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യോർദ്ദാന്റെ അക്കരെ’ എന്നത് സംസാരിക്കുന്നവരുടെ ഭൂമിശാസ്ത്രപരമായ ദൃഷ്ടികോണത്തിൽ നദിക്കപ്പുറമുള്ള പ്രദേശത്തെ സൂചിപ്പിക്കുന്നു; ഇവിടെ അത് യോർദ്ദാന്റെ കിഴക്കുവശമാണ്.
    reason: ‘בְּעֵבֶר הַיַּרְדֵּן’ എന്ന പ്രയോഗത്തിന്റെ സ്ഥലപരവും ദൃഷ്ടികോണബന്ധിതവുമായ അർത്ഥം വ്യക്തമാക്കാൻ.
  - marker: b
    text: അല്ലെങ്കിൽ, ‘ഇസ്രായേല്യർ.’ ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്നാണ്.
    reason: בְּנֵי יִשְׂרָאֵל എന്ന കൂട്ടനാമത്തിന്റെ പദാനുസൃത രൂപവും സ്വാഭാവികമായ കൂട്ടജന-ബദലും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: യോർദ്ദാനക്കരെ
  rationale: עֵבֶר എന്നത് അതിർത്തിയുടെയോ നദിയുടെയോ അക്കരെയുള്ള പ്രദേശത്തെ സൂചിപ്പിക്കുന്നു. ഭൂമിശാസ്ത്രപരമായ കാഴ്ചപ്പാട് നിലനിർത്തുന്ന സ്വാഭാവികമായ മലയാളപ്രയോഗമാണിത്.
- source_word: בַּגַּיְא
  choice: താഴ്‌വരയിൽ
  rationale: גַּיְא താഴ്‌വരയെയോ ഇടുങ്ങിയ മലയിടുക്കിനെയോ സൂചിപ്പിക്കാം; ഈ ഭൂമിശാസ്ത്രവിവരണത്തിൽ ‘താഴ്‌വര’ സ്വാഭാവികവും മതിയായ കൃത്യതയുള്ളതുമാണ്.
- source_word: מוּל
  choice: എതിരെയുള്ള
  rationale: ഒരു സ്ഥലത്തിന്റെ നേരെ മറുവശത്തുള്ള സ്ഥാനം സൂചിപ്പിക്കുന്ന പദമാണ്; മലയാളത്തിൽ ഭൂമിശാസ്ത്രബന്ധം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: בֵּית פְּעוֹר
  choice: ബേത്ത്-പെയോർ
  rationale: സ്ഥലനാമമായതിനാൽ അർത്ഥപരിഭാഷ ചെയ്യാതെ ലിപ്യന്തരണം ചെയ്തു.
- source_word: בְּאֶרֶץ סִיחֹן
  choice: സീഹോന്റെ ദേശത്ത്
  rationale: אֶרֶץ ഇവിടെ രാജാവിന്റെ അധീനപ്രദേശത്തെ സൂചിപ്പിക്കുന്നു; ‘ദേശം’ ചരിത്ര-ഭൂമിശാസ്ത്രസന്ദർഭത്തിൽ സ്വാഭാവികമാണ്.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: അമോര്യരുടെ രാജാവായ
  rationale: ഹീബ്രു ഘടന സീഹോനെ അമോര്യരുടെ രാജാവായി തിരിച്ചറിയുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണഘടന ഉപയോഗിച്ചു.
- source_word: אֲשֶׁר יוֹשֵׁב בְּחֶשְׁבּוֹן
  choice: ഹെശ്ബോനിൽ പാർത്തിരുന്ന
  rationale: יוֹשֵׁב താമസസ്ഥിതിയെ സൂചിപ്പിക്കുന്നു. ‘പാർത്തിരുന്ന’ ഗൗരവമുള്ളതും നിലവിലെ മലയാളത്തിൽ ഗ്രഹിക്കാവുന്നതുമാണ്.
- source_word: אֲשֶׁר הִכָּה
  choice: അവനെ തോൽപ്പിച്ചു
  rationale: נכה യുദ്ധസന്ദർഭത്തിൽ അടിച്ചുവീഴ്ത്തുക അഥവാ പരാജയപ്പെടുത്തുക എന്നർത്ഥം നൽകുന്നു. ഇവിടെ ‘തോൽപ്പിച്ചു’ സൈനികഫലം വ്യക്തമായി നൽകുന്നു; കൊല്ലപ്പെട്ടു എന്ന് അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: മോശയും ഇസ്രായേൽമക്കളും
  rationale: בְּנֵי എന്ന പുരുഷലിംഗ ബഹുവചനരൂപം ‘മക്കൾ’ എന്ന പരമ്പരാഗത കൂട്ടനാമത്തിലൂടെ നിലനിർത്തി; ഇത് ജനസമൂഹത്തെയും സൂചിപ്പിക്കാം.
- source_word: בְּצֵאתָם מִמִּצְרָיִם
  choice: ഈജിപ്തിൽനിന്ന് പുറപ്പെട്ടപ്പോൾ
  rationale: ב ചേർന്ന infinitive construct കാലസാഹചര്യം സൂചിപ്പിക്കുന്നു; ‘പുറപ്പെട്ടപ്പോൾ’ പുറപ്പാടിന്റെ സംഭവസൂചന സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: וּבְנֵי יִשְׂרָאֵל എന്ന ഉടമ്പടിജനതയെ സൂചിപ്പിക്കുന്ന ലിംഗചിഹ്നിത കൂട്ടനാമം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: ഹീബ്രുവിലെ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന രൂപത്തോട് ‘ഇസ്രായേൽമക്കൾ’ അടുത്തുനിൽക്കുന്നു; അതേസമയം സന്ദർഭത്തിൽ മുഴുവൻ ഇസ്രായേൽജനത്തെയും സൂചിപ്പിക്കുന്ന കൂട്ടനാമമാണെന്ന സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ചരിത്രവിവരണശൈലി സ്വീകരിച്ചു. ഹീബ്രുവിലെ ദീർഘമായ ബന്ധവാക്യം മലയാളത്തിൽ വ്യക്തതയ്ക്കായി രണ്ട് വാക്യങ്ങളാക്കി; അർത്ഥബന്ധം നിലനിർത്തി. ‘ഇസ്രായേൽമക്കൾ’ എന്നത് ഉറവിടത്തിലെ രൂപവും അതിന്റെ കൂട്ടജനസൂചനയും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
