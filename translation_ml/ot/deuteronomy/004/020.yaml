  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶתְ/כֶם֙ לָקַ֣ח יְהוָ֔ה וַ/יּוֹצִ֥א אֶתְ/כֶ֛ם מִ/כּ֥וּר הַ/בַּרְזֶ֖ל מִ/מִּצְרָ֑יִם לִ/הְי֥וֹת ל֛/וֹ לְ/עַ֥ם נַחֲלָ֖ה כַּ/יּ֥וֹם הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/020.yaml
  text: But Yahweh took you and brought you out of the iron furnace[a], out of Egypt, to be for him a people of inheritance, as it is this day.
translation:
  language: ml
  text: എന്നാൽ യഹ്‌വേ നിങ്ങളെ എടുത്ത് ഇരുമ്പുചൂളയിൽനിന്ന്[a]—ഈജിപ്തിൽനിന്ന്—പുറത്തുകൊണ്ടുവന്നു; ഇന്നുള്ളതുപോലെ, തനിക്കുള്ള ഒരു അവകാശജനമായിരിക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇരുമ്പുരുക്കുന്ന ചൂളയിൽനിന്ന്.’ ഈ പ്രയോഗം ഈജിപ്തിനെ കഠിനമായ പീഡനസ്ഥലമായി ചിത്രീകരിക്കുന്നു.
    reason: രൂപകത്തിന്റെയും പദസൂക്ഷ്മതയുടെയും വിശദീകരണം
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമത്തെ പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, ഹീബ്രു നാമത്തിന്റെ മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: לָקַח
  choice: എടുത്ത്
  rationale: ക്രിയയുടെ അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിൽ തിരഞ്ഞെടുക്കുകയും സ്വന്തമാക്കുകയും ചെയ്തതിന്റെ സൂചന ഉണ്ടെങ്കിലും അത് വിവർത്തനത്തിൽ അധികമായി വിശദീകരിക്കുന്നില്ല.
- source_word: וַיּוֹצִא
  choice: പുറത്തുകൊണ്ടുവന്നു
  rationale: ഹിഫീൽ രൂപത്തിലെ കാരണാർത്ഥവും പുറപ്പാടിന്റെ ചലനവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: מִכּוּר הַבַּרְזֶל
  choice: ഇരുമ്പുചൂളയിൽനിന്ന്
  rationale: കഠിനമായ പീഡനസ്ഥലമായ ഈജിപ്തിനെ സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിലെ രൂപകം ചുരുക്കവും വ്യക്തവുമായി നിലനിർത്തുന്നു.
- source_word: מִמִּצְרָיִם
  choice: ഈജിപ്തിൽനിന്ന്
  rationale: ഈജിപ്ത് തന്നെയാണ് ‘ഇരുമ്പുചൂള’ എന്ന് വ്യക്തമാക്കുന്ന ഹീബ്രു സമാന്തരപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: לִהְיוֹת לוֹ לְעַם נַחֲלָה
  choice: നിങ്ങൾ തനിക്ക് അവകാശമായ ഒരു ജനമായിരിക്കേണ്ടതിന്
  rationale: ‘അവനുവേണ്ടി/അവന് ഒരു അവകാശജനം’ എന്ന ഘടനയും ഉടമസ്ഥതയുടെയും ഉടമ്പടിബന്ധത്തിന്റെയും ഭാവവും സംരക്ഷിക്കുന്നു; ‘സ്വന്തം ജനം’ എന്ന ലളിതീകരണത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: כַּיּוֹם הַזֶּה
  choice: ഇന്നുള്ളതുപോലെ
  rationale: ഇസ്രായേലിന്റെ ഇപ്പോഴത്തെ നിലയെ ചൂണ്ടിക്കാണിക്കുന്ന ഹീബ്രു പ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: לְעַם נַחֲלָה എന്നതിലെ ഉടമ്പടിപരമായ അവകാശഭാഷ
  choice: തനിക്ക് അവകാശമായ ഒരു ജനം
  alternative: തന്റെ സ്വന്തം ജനം; തന്റെ സമ്പത്തായ ജനം
  rationale: ‘അവകാശം’ എന്ന മൂലപദത്തിന്റെ പ്രത്യേക ഭാരം നിലനിർത്തുകയും, ഇസ്രായേൽ യഹ്‌വേക്കുള്ള ജനമാണെന്ന ബന്ധം വ്യക്തമാക്കുകയും ചെയ്യുന്നു; എന്നാൽ ‘നിക്ഷേപം’ അല്ലെങ്കിൽ ‘തിരഞ്ഞെടുത്ത ജനം’ പോലുള്ള ബന്ധപ്പെട്ട ആശയങ്ങൾ പാഠത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘ഇരുമ്പുചൂള’ എന്ന രൂപകവും ‘അവകാശമായ ഒരു ജനം’ എന്ന ഉദ്ദേശപൂർവമായ ഉടമസ്ഥതാഭാഷയും നിലനിർത്തിയിരിക്കുന്നു; ഡാഷുകൾ ‘ഇരുമ്പുചൂള’ എന്നത് ഈജിപ്തിനെ തന്നെയാണ് വിശേഷിപ്പിക്കുന്നതെന്ന് വ്യക്തമാക്കുന്നു.
