  revision_rationale: The revision replaces the interpretively narrower ‘observe/practice’ expression with the direct equivalent ‘to do,’ clarifies that the Ten Words are appositional to the covenant, and retains the established Malayalam theological and material terms. It preserves the English audit trail’s distinction between the literal ‘Ten Words’ in the text and the traditional ‘Ten Commandments’ in the footnote.
