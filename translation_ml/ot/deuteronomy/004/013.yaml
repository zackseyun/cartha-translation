source:
  edition: WLC
  text: וַ/יַּגֵּ֨ד לָ/כֶ֜ם אֶת בְּרִית֗/וֹ אֲשֶׁ֨ר צִוָּ֤ה אֶתְ/כֶם֙ לַ/עֲשׂ֔וֹת עֲשֶׂ֖רֶת הַ/דְּבָרִ֑ים וַֽ/יִּכְתְּבֵ֔/ם עַל שְׁנֵ֖י לֻח֥וֹת אֲבָנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/013.yaml
  text: And he declared to you his covenant[a], which he commanded you to do, the Ten Words; and he wrote them on two tablets of stone.
translation:
  language: ml
  text: നിങ്ങൾ ചെയ്യാൻ അവിടുന്ന് കല്പിച്ച തന്റെ ഉടമ്പടിയായ പത്തു വചനങ്ങൾ[a] അവിടുന്ന് നിങ്ങളോടു അറിയിച്ചു; അവ രണ്ടു കൽപ്പലകകളിൽ എഴുതി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ: ‘പത്തു വചനങ്ങൾ’; പരമ്പരാഗതമായി: ‘പത്തു കല്പനകൾ.’'
    reason: പരമ്പരാഗതമായ മറ്റൊരു പരിഭാഷ വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: അറിയിച്ചു
  rationale: נגד എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ ‘അറിയിക്കുക/വെളിപ്പെടുത്തുക’ എന്ന അർഥത്തിലാണ്. ‘അറിയിച്ചു’ എന്നത് സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഔപചാരിക ഭാവവും നിലനിർത്തുന്നു.
- source_word: בְּרִיתוֹ
  choice: തന്റെ ഉടമ്പടി
  rationale: בְּרִית ബന്ധപരവും ബാധ്യതയുള്ളതുമായ ദൈവിക ഉടമ്പടിയെ സൂചിപ്പിക്കുന്ന പതിവുപദമാണ്; ‘ഉടമ്പടി’ അതിനെ വ്യക്തമായി പകർന്നു നൽകുന്നു.
- source_word: אֲשֶׁר צִוָּה אֶתְכֶם לַעֲשׂוֹת
  choice: നിങ്ങൾ അനുഷ്ഠിക്കണമെന്ന് അവിടുന്ന് കല്പിച്ച
  rationale: לַעֲשׂוֹת അക്ഷരാർഥത്തിൽ ‘ചെയ്യാൻ’ എന്നാണ്. എന്നാൽ കല്പനകളുടെ സന്ദർഭത്തിൽ ‘അനുഷ്ഠിക്കുക’ മലയാളത്തിൽ പ്രവർത്തിച്ചു പാലിക്കുക എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു; വെറും മാനസിക സമ്മതമായി ചുരുക്കുന്നില്ല.
- source_word: עֲשֶׂרֶת הַדְּבָרִים
  choice: പത്തു വചനങ്ങൾ
  rationale: എബ്രായ പ്രയോഗം അക്ഷരാർഥത്തിൽ ‘പത്തു വാക്കുകൾ/വചനങ്ങൾ’ എന്നാണ്; പരമ്പരാഗതമായ ‘പത്തു കല്പനകൾ’ എന്ന വ്യാഖ്യാനപരമായ പേരിനേക്കാൾ മൂലപാഠത്തിന്റെ സ്വന്തം വിശേഷണം മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיִּכְתְּבֵם
  choice: അവ ... എഴുതുകയും ചെയ്തു
  rationale: כתב സാധാരണയായി ‘എഴുതുക’ എന്നാണ്. കല്ലിൽ കൊത്തിയെന്ന കൂടുതൽ പ്രത്യേക അർഥം ക്രിയയിൽനിന്ന് നിർബന്ധമായി വരാത്തതിനാൽ ‘എഴുതി’ എന്ന നേരിട്ടുള്ള പദം സ്വീകരിച്ചു.
- source_word: שְׁנֵי לֻחֹת אֲבָנִים
  choice: രണ്ടു കൽപ്പലകകളിൽ
  rationale: നിർമാണവസ്തു കല്ലാണെന്ന് വ്യക്തമാക്കുന്ന സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളപ്രയോഗമാണിത്.
theological_decisions:
- issue: עֲשֶׂרֶת הַדְּבָרִים എന്ന പ്രയോഗത്തിന്റെ പരിഭാഷ
  choice: പത്തു വചനങ്ങൾ
  alternative: പത്തു കല്പനകൾ
  rationale: മൂലപാഠം ഉടമ്പടിയുടെ ഉള്ളടക്കത്തെ ‘പത്തു വചനങ്ങൾ’ എന്നാണ് വിളിക്കുന്നത്. പരിചിതമായ ‘പത്തു കല്പനകൾ’ സാധുവായ പരമ്പരാഗത വിശേഷണമാണെങ്കിലും, അത് മുഖ്യവാചകത്തിനു പകരം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നത് മൂലഭാഷയുടെ മുൻഗണനയും വായനക്കാരന്റെ പരിചയവും ഒരുമിച്ച് മാനിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ദൈവത്തെ സൂചിപ്പിക്കാൻ ആദരസൂചകമായ ‘അവിടുന്ന്’ ഉപയോഗിച്ചു. apposition വ്യക്തമായി കാണിക്കാനും നീണ്ട ഉപവാക്യത്തിലെ ആശയബന്ധം വായനാസൗകര്യത്തോടെ നിലനിർത്താനും ദീർഘരേഖകൾ ഉപയോഗിച്ചു.
