revisions:
- from: അതുകൊണ്ട്, യഹോവ തന്നെയാണ് മീതെയുള്ള ആകാശങ്ങളിൽ ദൈവമെന്നും താഴെയുള്ള ഭൂമിയിലും അവൻ തന്നെയാണ് ദൈവമെന്നും, അവനല്ലാതെ മറ്റാരുമില്ലെന്നും ഇന്ന് അറിഞ്ഞ് ഹൃദയത്തിൽ ഉറപ്പിച്ചുകൊള്ളുക.[a][b]
  to: അതുകൊണ്ട്, ഇന്ന് അറിഞ്ഞ് നിന്റെ ഹൃദയത്തിൽ ഉറപ്പിച്ചുകൊള്ളുക:[a] മുകളിലെ ആകാശങ്ങളിലും താഴെയുള്ള ഭൂമിയിലും യഹോവ തന്നെയാണ് ദൈവം; വേറെയില്ല.[b]
  rationale: ആഹ്വാനരൂപമായ ‘അറിയുക’യും ഹൃദയത്തിൽ സ്വീകരിക്കുക എന്ന ഹീബ്രു ശൈലിയും നിലനിർത്തി. ‘യഹോവ തന്നെയാണ് ദൈവം’ എന്ന ഏക പ്രഖ്യാപനത്തിനു കീഴിൽ ആകാശവും ഭൂമിയും ചേർത്തു; ഇതിലൂടെ മൂലത്തിന്റെ ഘടനയും മലയാളത്തിന്റെ ഒഴുക്കും മെച്ചപ്പെടുന്നു. ‘വേറെയില്ല’ എന്ന രൂപം אֵין עוֹד-ന്റെ സന്ദർഭാർഥമായ പരമമായ അനന്യത അറിയിക്കുമ്പോൾ, അതിനെ ‘മറ്റാരും’ എന്ന വ്യക്തി-പരിമിത അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
