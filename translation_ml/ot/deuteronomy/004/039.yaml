id: DEU.4.39
reference: Deuteronomy 4:39
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/יָדַעְתָּ֣ הַ/יּ֗וֹם וַ/הֲשֵׁבֹתָ֮ אֶל לְבָבֶ/ךָ֒ כִּ֤י יְהוָה֙ ה֣וּא הָֽ/אֱלֹהִ֔ים בַּ/שָּׁמַ֣יִם מִ/מַּ֔עַל וְ/עַל הָ/אָ֖רֶץ מִ/תָּ֑חַת אֵ֖ין עֽוֹד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/039.yaml
  text: So know today[a], and take it to your heart, that Yahweh, he is God in the heavens above and on the earth beneath[b]; there is no other.
translation:
  language: ml
  text: അതുകൊണ്ട്, ഇന്ന് അറിഞ്ഞ് നിന്റെ ഹൃദയത്തിൽ ഉറപ്പിച്ചുകൊള്ളുക:[a] മുകളിലെ ആകാശങ്ങളിലും താഴെയുള്ള ഭൂമിയിലും യഹോവ തന്നെയാണ് ദൈവം; വേറെയില്ല.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: ‘അത് നിന്റെ ഹൃദയത്തിലേക്കു തിരികെ കൊണ്ടുവരുക’; സത്യമായതിനെ ഉള്ളിൽ അംഗീകരിച്ച് ദൃഢമായി സ്വീകരിക്കുക എന്നർഥമുള്ള ഹീബ്രു പ്രയോഗം.'
    reason: lexical_alternative
  - marker: b
    text: 'കൂടുതൽ ഔപചാരികമായി: ‘മറ്റൊന്നുമില്ല.’'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָדַעְתָּ הַיּוֹם
  choice: ഇന്ന് അറിഞ്ഞ്
  rationale: സന്ദർഭത്തിൽ וְיָדַעְתָּ ഉപദേശാത്മകമായ ആഹ്വാനത്തിന്റെ ശക്തിയുള്ളതാണ്; הַיּוֹם നൽകുന്ന അടിയന്തരതയും ‘ഇന്ന്’ നിലനിർത്തുന്നു.
- source_word: וַהֲשֵׁבֹתָ אֶל־לְבָבֶךָ
  choice: ഹൃദയത്തിൽ ഉറപ്പിച്ചുകൊള്ളുക
  rationale: അക്ഷരാർഥത്തിൽ ‘നിന്റെ ഹൃദയത്തിലേക്കു തിരികെ കൊണ്ടുവരുക’ എന്നായാലും, സത്യം ഉള്ളിൽ അംഗീകരിച്ച് ദൃഢമായി സ്വീകരിക്കുക എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘ഹൃദയം’ എന്ന ബൈബിളീയ ദൃശ്യവും നിലനിർത്തുന്നു.
- source_word: יְהוָה הוּא הָאֱלֹהִים
  choice: യഹോവ തന്നെയാണ് ... ദൈവം / അവൻ തന്നെയാണ് ദൈവം
  rationale: הוּא എന്ന ഊന്നൽ ‘തന്നെയാണ്’ എന്നു പ്രകടമാക്കുന്നു. മലയാളത്തിലെ സ്വാഭാവിക സമാന്തരവാക്യത്തിനായി രണ്ടാം ഖണ്ഡത്തിൽ ‘അവൻ’ ഉപയോഗിച്ചു.
- source_word: בַּשָּׁמַיִם מִמַּעַל
  choice: മീതെയുള്ള ആകാശങ്ങളിൽ
  rationale: שָׁמַיִם എന്ന ബഹുവചനരൂപവും מִמַּעַל എന്ന ‘മീതെ’ എന്ന സ്ഥലസൂചനയും സംരക്ഷിക്കുന്നു.
- source_word: וְעַל־הָאָרֶץ מִתָּחַת
  choice: താഴെയുള്ള ഭൂമിയിലും
  rationale: മീതെയുള്ള ആകാശങ്ങൾ / താഴെയുള്ള ഭൂമി എന്ന സമഗ്രമായ വൈരുധ്യസമാന്തരത നിലനിർത്തുന്നു.
- source_word: אֵין עוֹד
  choice: അവനല്ലാതെ മറ്റാരുമില്ല
  rationale: യഹോവയുടെ ഏകത്വവും അനന്യതയും വ്യക്തമായി പറയുന്നു; ഹീബ്രുവിന്റെ സംക്ഷിപ്തത മലയാളത്തിൽ വ്യക്തിപരമായ ദൈവസൂചനയോടെ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു പദവികൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പതിവുള്ള ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: אֵין עוֹד എന്ന ഏകദൈവവാദപരമായ പ്രഖ്യാപനം
  choice: അവനല്ലാതെ മറ്റാരുമില്ല
  alternative: വേറെ ആരുമില്ല / മറ്റൊന്നുമില്ല
  rationale: വാക്യം യഹോവ മാത്രമാണ് ദൈവമെന്നു പ്രഖ്യാപിക്കുന്നു. പിന്നീടുള്ള വ്യവസ്ഥാപിത ദൈവശാസ്ത്രഭാഷ ചേർക്കാതെ അതിന്റെ സമ്പൂർണ അനന്യത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ ഊന്നലും ആകാശം–ഭൂമി സമാന്തരതയും ദൈവത്തിന്റെ അനന്യതയും നിലനിർത്തിയിരിക്കുന്നു.
