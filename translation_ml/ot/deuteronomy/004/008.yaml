  yaml_path: translation/ot/deuteronomy/004/008.yaml
  text: And what great nation is there that has statutes and judgments as righteous as all this law that I am setting before you today?[a]
translation:
  language: ml
  text: ഞാൻ ഇന്ന് നിങ്ങളുടെ മുമ്പിൽ വെക്കുന്ന ഈ നിയമം മുഴുവനുംപോലെ നീതിയുള്ള ചട്ടങ്ങളും ന്യായനിയമങ്ങളും ഉള്ള ഏതു വലിയ ജനതയാണുള്ളത്?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“നിയമം” എന്നതിന് “പ്രബോധനം” എന്നും പരിഭാഷപ്പെടുത്താം (എബ്രായം: തോറാ); എന്നാൽ ഇവിടെ “ചട്ടങ്ങളും ന്യായനിയമങ്ങളും” എന്നു പറയുന്നതിനാൽ സന്ദർഭം പ്രത്യേകമായി നിയമപരമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִי גּוֹי גָּדוֹל
  choice: ഏതു മഹാജാതിയാണുള്ളത്?
  rationale: ഒരു താരതമ്യം ഉന്നയിക്കുന്ന അലങ്കാരപ്രശ്നത്തിന്റെ സ്വാഭാവികമായ മലയാളരൂപം; גּוֹי גָּדוֹל എന്നത് രാഷ്ട്രീയ-സാമൂഹിക അർഥത്തിൽ ‘മഹാജാതി’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: חֻקִּים
  choice: ചട്ടങ്ങൾ
  rationale: നിയമപരമായി നിശ്ചയിക്കപ്പെട്ട വ്യവസ്ഥകൾ എന്ന ആശയം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: וּמִשְׁפָּטִים
  choice: ന്യായവിധികൾ
  rationale: നീതിന്യായപരമായ തീരുമാനങ്ങളുടെയും നിയമവിധികളുടെയും ഭാവം നിലനിർത്തുകയും חֻקִּים എന്നതിൽനിന്നുള്ള വ്യത്യാസം സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: צַדִּיקִם
  choice: നീതിയുള്ള
  rationale: ധാർമികവും നിയമപരവുമായ ശരിതനിമ ഒരുമിച്ച് പ്രകടിപ്പിക്കുന്നു.
- source_word: כְּכֹל הַתּוֹרָה הַזֹּאת
  choice: ഈ നിയമം മുഴുവനുംപോലെ
  rationale: כְּכֹל എന്ന താരതമ്യവും നിയമസമാഹാരത്തിന്റെ സമഗ്രതയും നിലനിർത്തുന്നു; അടുത്തുള്ള ‘ചട്ടങ്ങളും ന്യായവിധികളും’ എന്ന നിയമപരമായ സന്ദർഭത്തിൽ תּוֹרָהയ്ക്ക് ‘നിയമം’ യോജിക്കുന്നു.
- source_word: נֹתֵן לִפְנֵיכֶם
  choice: നിങ്ങളുടെ മുമ്പിൽ വെക്കുന്ന
  rationale: അക്ഷരാർഥമായ ‘നൽകുക’ എന്നതിലുപരി, ജനത്തിനു നിയമം അവതരിപ്പിക്കുന്നു എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הַיּוֹם
  choice: ഇന്ന്
  rationale: കാലസൂചനയെ ലളിതവും ആധുനികവുമായ ഭാഷയിൽ കൃത്യമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: תּוֹרָה എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: നിയമം
  alternative: പ്രബോധനം / ഉപദേശം
  rationale: תּוֹרָהയ്ക്ക് വിശാലമായി ‘പ്രബോധനം’ അല്ലെങ്കിൽ ‘ഉപദേശം’ എന്നർഥമുണ്ടാകാമെങ്കിലും, ഇവിടെ ‘ചട്ടങ്ങളും ന്യായവിധികളും’ എന്നു വ്യക്തമായി പറയുന്ന നിയമപരമായ സന്ദർഭം ‘നിയമം’ എന്ന പരിഭാഷയെ പിന്തുണയ്ക്കുന്നു. വിശാലമായ പദാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. അലങ്കാരപ്രശ്നത്തിന്റെ ഊന്നൽ നിലനിർത്തി; നിയമപരമായ പദങ്ങൾ തമ്മിലുള്ള വ്യത്യാസവും തോറാ എന്ന പദത്തിന്റെ വിശാലമായ അർഥസാധ്യതയും സംരക്ഷിച്ചു.
