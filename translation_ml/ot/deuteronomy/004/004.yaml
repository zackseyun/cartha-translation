source:
  edition: WLC
  text: וְ/אַתֶּם֙ הַ/דְּבֵקִ֔ים בַּ/יהוָ֖ה אֱלֹהֵי/כֶ֑ם חַיִּ֥ים כֻּלְּ/כֶ֖ם הַ/יּֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/004.yaml
  text: But you who hold fast to Yahweh your God are all alive today[a].
translation:
  language: ml
  text: എന്നാൽ നിങ്ങളുടെ ദൈവമായ യഹ്‌വെയോടു ചേർന്നുനിൽക്കുന്ന നിങ്ങളെല്ലാവരും ഇന്ന് ജീവനോടെയിരിക്കുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദത്തിന് ‘പറ്റിച്ചേരുന്ന’ അല്ലെങ്കിൽ ‘മുറുകെ ചേർന്നുനിൽക്കുന്ന’ എന്നും പരിഭാഷപ്പെടുത്താം; യഹ്‌വെയോടുള്ള അടുത്ത, വിശ്വസ്തമായ ബന്ധത്തെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתֶּם
  choice: എന്നാൽ ... നിങ്ങൾ
  rationale: മുൻവാക്യത്തിൽ ബാൽ-പെയോരിനെ പിന്തുടർന്ന് നശിച്ചവരോടുള്ള വൈരുധ്യം സ്വതന്ത്ര സർവനാമത്തോടുകൂടിയ വാവ് സൂചിപ്പിക്കുന്നു; ആ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ ‘എന്നാൽ ... നിങ്ങൾ’ എന്നു നൽകുന്നു.
- source_word: הַ/דְּבֵקִים
  choice: ചേർന്നുനിൽക്കുന്ന
  rationale: דבק എന്ന ധാതുവിന്റെ അടുത്ത പറ്റിച്ചേരലും ഉറച്ച വിശ്വസ്തതയും സൂചിപ്പിക്കുന്നു. വർത്തമാന കൃദന്തരൂപം നിലനിൽക്കുന്ന ബന്ധത്തെ വിവരിക്കുന്നതിനാൽ ‘ചേർന്നുനിൽക്കുന്ന’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: בַּ/יהוָה
  choice: യഹ്‌വെയോടു
  rationale: בְ എന്ന ഉപസർഗം ഇവിടെ അടുപ്പത്തെയോ ചേർന്നുനിൽക്കലിനെയോ സൂചിപ്പിക്കുന്നു; ദൈവനാമമായ יהוה ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: אֱלֹהֵי/כֶם
  choice: നിങ്ങളുടെ ദൈവമായ
  rationale: രണ്ടാം പുരുഷ ബഹുവചന പ്രത്യയമുള്ള സംയുക്തരൂപം യഹ്‌വെയെ അഭിസംബോധിതരുടെ ദൈവമായി വ്യക്തമാക്കുന്നു; മലയാളത്തിലെ സ്വാഭാവിക സമാനാധികരണമായി നൽകി.
- source_word: חַיִּים
  choice: ജീവനോടെയിരിക്കുന്നു
  rationale: അവരുടെ ഇപ്പോഴത്തെ അവസ്ഥ സൂചിപ്പിക്കുന്ന വിധേയവിശേഷണം; മലയാളത്തിൽ സ്വാഭാവികമായ വിധേയപ്രയോഗം.
- source_word: כֻּלְּ/כֶם
  choice: നിങ്ങൾ എല്ലാവരും
  rationale: രക്ഷപ്പെട്ടവരുടെ സമഗ്രത ഊന്നിപ്പറയുന്ന രൂപം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: הַ/יּוֹם
  choice: ഇന്നും
  rationale: היום എന്നത് ‘ഇന്ന്’ എന്നാണ്; മുൻകാല സംഭവത്തെ അതിജീവിച്ച് ഇപ്പോഴും ജീവനോടെ എന്ന സന്ദർഭഭാവം മലയാളത്തിലെ ‘ഇന്നും’ സ്വാഭാവികമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ നിയമബന്ധപരമായ വ്യക്തിനാമം നേരിട്ട് ഉള്ളതിനാൽ അതിനെ പൊതുവായ പദവിയാക്കി മാറ്റാതെ ആധുനിക മലയാളത്തിൽ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
- issue: דבק സൂചിപ്പിക്കുന്ന ബന്ധത്തിന്റെ സ്വഭാവം
  choice: ചേർന്നുനിൽക്കുന്ന
  alternative: മുറുകെപ്പിടിക്കുന്ന / പറ്റിച്ചേരുന്ന
  rationale: ഈ പദം അടുത്ത ബന്ധവും വിശ്വസ്തമായ അനുസരണവും ഒരുമിച്ച് സൂചിപ്പിക്കാം. വ്യാഖ്യാനത്തിൽ നിയമബന്ധത്തെ മാത്രം തുറന്നുപറഞ്ഞ് അർത്ഥപരിധി ചുരുക്കാതെ അടിസ്ഥാനരൂപകം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. ‘ചേർന്നുനിൽക്കുന്ന’ എന്ന പ്രയോഗം മൂലത്തിലെ കൃദന്തരൂപവും ബന്ധത്തിന്റെ രൂപകവും നിലനിർത്തുന്നു; ‘ഇന്നും’ സന്ദർഭത്തിലെ തുടർച്ചാഭാവം സ്വാഭാവികമായി നൽകുന്നു.
