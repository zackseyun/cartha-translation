id: DEU.4.11
reference: Deuteronomy 4:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תִּקְרְב֥וּ/ן וַ/תַּֽעַמְד֖וּ/ן תַּ֣חַת הָ/הָ֑ר וְ/הָ/הָ֞ר בֹּעֵ֤ר בָּ/אֵשׁ֙ עַד לֵ֣ב הַ/שָּׁמַ֔יִם חֹ֖שֶׁךְ עָנָ֥ן וַ/עֲרָפֶֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/011.yaml
  text: And you came near and stood at the foot of the mountain[a], while the mountain was burning with fire up to the heart of the heavens—darkness, cloud[b], and thick gloom.
translation:
  language: ml
  text: നിങ്ങൾ അടുത്തുവന്ന് മലയുടെ അടിവാരത്തിൽ നിന്നു; മല ആകാശത്തിന്റെ ഹൃദയംവരെ[a] തീയിൽ കത്തിക്കൊണ്ടിരുന്നു—ഇരുട്ട്, മേഘം, കനത്ത അന്ധകാരം[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ആകാശത്തിന്റെ മധ്യംവരെ’ അല്ലെങ്കിൽ ‘ആകാശത്തിന്റെ ഉയരംവരെ.’ എബ്രായയിൽ അക്ഷരാർഥം ‘ആകാശത്തിന്റെ ഹൃദയംവരെ’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഗാഢാന്ധകാരം’ അല്ലെങ്കിൽ ‘കൂരിരുട്ട്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרְבוּן
  choice: നിങ്ങൾ അടുത്തുവന്നു
  rationale: קרב എന്ന ക്രിയയുടെ അടുത്തേക്കു നീങ്ങുക എന്ന ലളിതമായ അർഥവും രണ്ടാം പുരുഷ ബഹുവചനവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַתַּעַמְדוּן
  choice: നിന്നു
  rationale: עמד എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ നിൽക്കുക എന്നത് സംഭവക്രമത്തിന് അനുയോജ്യമായി നൽകുന്നു.
- source_word: תַּחַת הָהָר
  choice: മലയുടെ അടിവാരത്തിൽ
  rationale: תחת എന്നതിന് അക്ഷരാർഥത്തിൽ ‘കീഴിൽ’ എന്നുണ്ടെങ്കിലും മലയുടെ പശ്ചാത്തലത്തിൽ ഉദ്ദേശിക്കുന്ന സ്ഥലം അതിന്റെ അടിവാരമാണ്; ആ ഭൂപ്രകൃതിപരമായ അർഥം വ്യക്തമായി പറയുന്നു.
- source_word: בֹּעֵר בָּאֵשׁ
  choice: തീയിൽ കത്തിക്കൊണ്ടിരുന്നു
  rationale: പങ്കാളിക്രിയയായ בֹּעֵר സൂചിപ്പിക്കുന്ന തുടർച്ചയായ അവസ്ഥയും אֵשׁ എന്ന ‘തീ’യുടെ വ്യക്തമായ പരാമർശവും സംരക്ഷിക്കുന്നു.
- source_word: עַד לֵב הַשָּׁמַיִם
  choice: ആകാശത്തിന്റെ ഹൃദയംവരെ
  rationale: לֵב എന്ന ‘ഹൃദയം’ എന്ന എബ്രായ ദൃശ്യരൂപം നിലനിർത്തുന്നു; ഇവിടെ അത് ആകാശത്തിന്റെ മധ്യമോ ഉയരമോ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.
- source_word: חֹשֶׁךְ עָנָן וַעֲרָפֶל
  choice: ഇരുട്ടും മേഘവും കനത്ത അന്ധകാരവും
  rationale: ദൈവപ്രത്യക്ഷതയുടെ പശ്ചാത്തലത്തിലുള്ള മൂന്ന് വ്യത്യസ്ത ദൃശ്യഘടകങ്ങളും നിലനിർത്തുന്നു; അവസാന പദത്തിന്റെ സാന്ദ്രവും മറയ്ക്കുന്നതുമായ ഭാവം ‘കനത്ത അന്ധകാരം’ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: സീനായിലെ ദൈവപ്രത്യക്ഷതയുടെ ദൃശ്യാവിഷ്കാരം
  choice: തീ, ഇരുട്ട്, മേഘം, കനത്ത അന്ധകാരം എന്നീ മൂർത്തവും ഭയഭക്തി ജനിപ്പിക്കുന്നതുമായ ചിത്രങ്ങൾ അതേപടി നിലനിർത്തി.
  alternative: ഇവയെ പൊതുവായ കാലാവസ്ഥാ സാഹചര്യങ്ങളായി മൃദൂകരിച്ച് വിവർത്തനം ചെയ്യുക.
  rationale: വാക്യം വെറും കാലാവസ്ഥയെയല്ല, ദൈവപ്രത്യക്ഷതയുടെ ഗൗരവവും മറഞ്ഞ മഹിമയും ചിത്രീകരിക്കുന്നു; വ്യാഖ്യാനം കൂട്ടിച്ചേർക്കാതെ ആ പാളികളുള്ള ദൃശ്യഭാഷ സംരക്ഷിക്കണം.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ആകാശത്തിന്റെ ഹൃദയം’ എന്ന മൂലഭാഷാ ദൃശ്യരൂപം വായനാസഹായിയായ അടിക്കുറിപ്പോടെ നിലനിർത്തി; അവസാനത്തെ സമാനാർഥപദങ്ങൾ തമ്മിലുള്ള വ്യത്യാസവും സംരക്ഷിച്ചു.
