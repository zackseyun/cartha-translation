source:
  edition: WLC
  text: וַֽ/יהוָ֥ה הִתְאַנֶּף בִּ֖/י עַל דִּבְרֵי/כֶ֑ם וַ/יִּשָּׁבַ֗ע לְ/בִלְתִּ֤י עָבְרִ/י֙ אֶת הַ/יַּרְדֵּ֔ן וּ/לְ/בִלְתִּי בֹא֙ אֶל הָ/אָ֣רֶץ הַ/טּוֹבָ֔ה אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ נַחֲלָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/021.yaml
  text: And Yahweh was angry with me because of you[a], and he swore that I would not cross the Jordan and that I would not enter the good land that Yahweh your God is giving you as an inheritance.
translation:
  language: ml
  text: നിങ്ങളുടെ വാക്കുകൾ നിമിത്തം[a] യഹോവ എന്നോടു കോപിച്ചു. ഞാൻ യോർദ്ദാൻ കടക്കുകയില്ലെന്നും നിങ്ങളുടെ ദൈവമായ യഹോവ നിങ്ങൾക്ക് അവകാശമായി നൽകുന്ന ആ നല്ല ദേശത്തു പ്രവേശിക്കുകയില്ലെന്നും അവിടുന്ന് ശപഥം ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങൾ നിമിത്തം.” ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ “നിങ്ങളുടെ വാക്കുകൾ നിമിത്തം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമത്തെ മലയാളത്തിലെ പരിചിതമായ നാമരൂപത്തിൽ നിലനിർത്തുന്നു; പൊതുനാമമായ ‘കർത്താവ്’ എന്നു മാറ്റുന്നില്ല.
- source_word: הִתְאַנֶּף בִּי
  choice: എന്നോടു കോപിച്ചു
  rationale: കോപം സൂചിപ്പിക്കുന്ന ക്രിയയും അതോടൊപ്പമുള്ള ബന്ധപ്രയോഗവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: עַל דִּבְרֵיכֶם
  choice: നിങ്ങളുടെ വാക്കുകൾ നിമിത്തം
  rationale: ‘നിങ്ങളുടെ വാക്കുകൾ’ എന്ന ഹീബ്രു പദഘടന വ്യക്തമായി നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ‘നിങ്ങൾ നിമിത്തം’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וַיִּשָּׁבַע
  choice: ശപഥം ചെയ്തു
  rationale: ശപഥമെടുക്കുക എന്ന ക്രിയയുടെ നേരായതും മാന്യവുമായ മലയാളരൂപം.
- source_word: לְבִלְתִּי עָבְרִי אֶת הַיַּרְדֵּן
  choice: ഞാൻ യോർദ്ദാൻ കടക്കുകയില്ലെന്ന്
  rationale: ശപഥത്തിന്റെ ഉള്ളടക്കമായി മോശെ കടക്കുകയില്ലെന്ന നിഷേധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וּלְבִלְתִּי בֹא
  choice: പ്രവേശിക്കുകയില്ലെന്ന്
  rationale: ദേശത്തേക്കുള്ള പ്രവേശനത്തെ സമാന്തരവും സംക്ഷിപ്തവുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: הָאָרֶץ הַטּוֹבָה
  choice: ആ നല്ല ദേശം
  rationale: വിശേഷണത്തിന്റെ നേരായ അർഥവും ഉടമ്പടിസംബന്ധമായ മൂല്യനിർണയവും അതിരുകടക്കാതെ നിലനിർത്തുന്നു.
- source_word: נֹתֵן לְךָ
  choice: നിങ്ങൾക്ക് ... നൽകുന്ന
  rationale: ഹീബ്രു കർത്തൃവാചകത്തിന്റെ പുരോഗമന/സന്നിഹിത ദാനഭാവം മലയാളത്തിലെ സംബന്ധിക ക്രിയാരൂപത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: נַחֲלָה
  choice: അവകാശമായി
  rationale: വിഭജിച്ചു ലഭിക്കുന്ന പാരമ്പര്യസ്വത്തോ അവകാശമോ എന്ന ആശയം സംക്ഷിപ്തമായി നൽകുന്നു.
theological_decisions:
- issue: മോശെ ദേശത്തു പ്രവേശിക്കാതിരുന്നതും ഇസ്രായേലിന്റെ പ്രവൃത്തിയും തമ്മിലുള്ള ബന്ധം
  choice: നിങ്ങളുടെ വാക്കുകൾ നിമിത്തം
  alternative: നിങ്ങൾ നിമിത്തം
  rationale: മൂലപാഠം ‘നിങ്ങളുടെ വാക്കുകൾ’ എന്ന് വ്യക്തമായി പറയുന്നതിനാൽ അതു മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; കുറ്റത്തിന്റെ വ്യാപ്തിയെ വാക്യത്തിനപ്പുറം വ്യാഖ്യാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ദൈവനാമത്തിന് ‘യഹോവ’, Jordan-ന് പ്രചാരത്തിലുള്ള ‘യോർദ്ദാൻ’, inheritance-ന് സന്ദർഭോചിതമായ ‘അവകാശം’ എന്നിവ ഉപയോഗിച്ചു.
