language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כָל הָ֨/עֲרָבָ֜ה עֵ֤בֶר הַ/יַּרְדֵּן֙ מִזְרָ֔חָ/ה וְ/עַ֖ד יָ֣ם הָ/עֲרָבָ֑ה תַּ֖חַת אַשְׁדֹּ֥ת הַ/פִּסְגָּֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/049.yaml
  text: and all the Arabah beyond the Jordan eastward[a], as far as the Sea of the Arabah, below the slopes of Pisgah.
translation:
  language: ml
  text: യോർദാന്ന് അപ്പുറത്തുള്ള കിഴക്കൻ അരാബാ മുഴുവനും, അരാബാ കടൽവരെ[a], പിസ്ഗായുടെ മലഞ്ചരിവുകൾക്കു താഴെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അതായത്, സാധാരണയായി ചാവുകടൽ എന്നു തിരിച്ചറിയപ്പെടുന്ന ജലാശയം.
    reason: ‘അരാബാ കടൽ’ എന്ന മൂലഭാഷാപ്രയോഗത്തെ പരിചിതമായ ഭൂമിശാസ്ത്രനാമവുമായി ബന്ധിപ്പിക്കുന്നു.
lexical_decisions:
- source_word: הָעֲרָבָה
  choice: അരാബാ
  rationale: ഇവിടെ പൊതുവായ ‘സമതലം’ എന്നതിനേക്കാൾ യോർദാൻ ഭ്രംശതാഴ്‌വരയെ സൂചിപ്പിക്കുന്ന ഭൂമിശാസ്ത്രനാമമാണ്; അതിനാൽ പേരായി ലിപ്യന്തരിച്ചു.
- source_word: עֵבֶר הַיַּרְדֵּן מִזְרָחָה
  choice: യോർദാനക്കരെ കിഴക്കുള്ള
  rationale: യോർദാന്റെ മറുകരയിലെ കിഴക്കൻ പ്രദേശം എന്ന സ്ഥലബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יָם הָעֲרָבָה
  choice: അരാബാ കടൽ
  rationale: പിൽക്കാലത്ത് പ്രചാരത്തിലായ ‘ചാവുകടൽ’ എന്ന പേര് മുഖ്യപാഠത്തിൽ പകരാതെ എബ്രായപ്രയോഗം നേരിട്ട് നിലനിർത്തി; പൊതുവായ തിരിച്ചറിയൽ അടിക്കുറിപ്പിൽ നൽകി.
- source_word: תַּחַת
  choice: താഴെ
  rationale: ഭൂപ്രകൃതിയിലെ ഉയരവ്യത്യാസം സൂചിപ്പിക്കുന്ന സ്ഥലബന്ധം ലളിതമായും കൃത്യമായും നൽകുന്നു.
- source_word: אַשְׁדֹּת
  choice: മലഞ്ചരിവുകൾ
  rationale: ഈ ഭൂമിശാസ്ത്രസന്ദർഭത്തിൽ മലയുടെ ഇറക്കങ്ങളെയോ ചരിവുകളെയോ സൂചിപ്പിക്കുന്നു; ‘മലഞ്ചരിവുകൾ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: הַפִּסְגָּה
  choice: പിസ്ഗാ
  rationale: സ്ഥലനാമം മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരിച്ചു.
- source_word: וְכָל
  choice: മുഴുവനും
  rationale: വാക്യം മുൻപുള്ള പട്ടികയുടെ തുടർച്ചയായതിനാൽ സംയോജകഭാവവും പ്രദേശത്തിന്റെ സമഗ്രവ്യാപ്തിയും സന്ദർഭത്തിൽ നിലനിൽക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ഭൂമിശാസ്ത്രവിവരണം. ഈ വാക്യം മുൻവാക്യത്തിലെ പട്ടികയുടെ തുടർച്ചയായതിനാൽ മൂലപാഠത്തിലെ ഖണ്ഡവാക്യസ്വഭാവം നിലനിർത്തിയിരിക്കുന്നു. അടിക്കുറിപ്പിന്റെ ഉള്ളടക്കത്തോട് യോജിക്കാനായി [a] അടയാളം ‘അരാബാ കടൽ’ എന്നതിനുശേഷം വെച്ചിരിക്കുന്നു.
