  text: the form of any animal that is on the earth[a], the form of any winged bird that flies in the heavens[b],
translation:
  language: ml
  text: ഭൂമിയിലുള്ള ഏതെങ്കിലും മൃഗത്തിന്റെ രൂപമോ[a] ആകാശത്തിൽ പറക്കുന്ന ചിറകുള്ള ഏതെങ്കിലും പക്ഷിയുടെ രൂപമോ[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘രൂപം’ എന്നതിന് ‘സാദൃശ്യം’ എന്നോ ‘പ്രതിമ’ എന്നോ പരിഭാഷപ്പെടുത്താം. ആരാധനയ്ക്കായി ഉണ്ടാക്കുന്ന ഒരു പ്രതിരൂപത്തെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘ആകാശത്തിൽ’ എന്നതിന് ‘ആകാശങ്ങളിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം. മൂലഭാഷയിൽ ‘ആകാശങ്ങൾ’ എന്ന ബഹുവചനരൂപമാണ്; ഇവിടെ അത് ദൃശ്യമായ ആകാശത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּבְנִית
  choice: രൂപം
  rationale: ആരാധനയ്ക്കായി ഉണ്ടാക്കുന്ന ദൃശ്യപ്രതിരൂപത്തെക്കുറിച്ചുള്ള സന്ദർഭത്തിൽ, മൂലപദത്തിന്റെ രൂപം/സാദൃശ്യം/പ്രതിമ എന്ന അർത്ഥവ്യാപ്തി സ്വാഭാവികമായി നൽകുന്നു; ആവർത്തനം നിലനിർത്തുന്നു.
- source_word: כָּל
  choice: ഏതെങ്കിലും
  rationale: ഏകവചന വർഗനാമങ്ങളോടൊപ്പം നിരോധനത്തിന്റെ സർവവ്യാപകത ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: בְּהֵמָה
  choice: മൃഗം
  rationale: ഇവിടെ വളർത്തുമൃഗങ്ങൾക്കു മാത്രം പരിമിതമല്ലാത്ത കരയിലെ മൃഗവർഗത്തെ സൂചിപ്പിക്കുന്ന പൊതുപദം അനുയോജ്യം.
- source_word: אֲשֶׁר בָּאָרֶץ
  choice: ഭൂമിയിലുള്ള
  rationale: ആകാശത്തിലെ പക്ഷികളോടും ചുറ്റുപാടിലെ വാക്യത്തിലുള്ള ജലജീവികളോടുമുള്ള സ്ഥലപരമായ വ്യത്യാസം സംക്ഷിപ്തമായി കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: צִפּוֹר כָּנָף
  choice: ചിറകുള്ള ... പക്ഷി
  rationale: ചിറകിനെ പ്രത്യേകം പരാമർശിക്കുന്ന എബ്രായ ഘടനയുടെ വിവരണാത്മക ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: תָּעוּף
  choice: പറക്കുന്ന
  rationale: ഒരു ജീവിവർഗത്തിന്റെ പൊതുസ്വഭാവം സൂചിപ്പിക്കുന്ന relative clause സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: בַּשָּׁמָיִם
  choice: ആകാശത്തിൽ
  rationale: എബ്രായത്തിലെ ബഹുവചനരൂപം ദൃശ്യമായ ആകാശത്തെയും സൂചിപ്പിക്കാം; പക്ഷികൾ പറക്കുന്ന മേഖലയെന്ന തത്സന്ദർഭത്തിൽ ‘ആകാശത്തിൽ’ ഏറ്റവും സ്വാഭാവികമാണ്.
