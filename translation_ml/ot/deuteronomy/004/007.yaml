id: DEU.4.7
reference: Deuteronomy 4:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֚י מִי ג֣וֹי גָּד֔וֹל אֲשֶׁר ל֥/וֹ אֱלֹהִ֖ים קְרֹבִ֣ים אֵלָ֑י/ו כַּ/יהוָ֣ה אֱלֹהֵ֔י/נוּ בְּ/כָּל קָרְאֵ֖/נוּ אֵלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/007.yaml
  text: For what great nation is there that has gods so near to it as Yahweh our God is to us whenever we call on him?[a][b]
translation:
  language: ml
  text: എന്തെന്നാൽ, നമ്മുടെ ദൈവമായ യഹ്‌വെ നാം അവനെ വിളിച്ചപേക്ഷിക്കുമ്പോഴെല്ലാം നമുക്കു സമീപസ്ഥനായിരിക്കുന്നതുപോലെ, ദേവന്മാർ അതിനു സമീപസ്ഥരായിരിക്കുന്ന ഏതു മഹാജാതിയാണുള്ളത്?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രായയിൽ: “ദേവന്മാർ.” മറ്റു ജാതികളുടെ ദേവതകളെ ഇസ്രായേലിന്റെ ദൈവമായ യഹ്‌വെയോടു അലങ്കാരചോദ്യരൂപത്തിൽ താരതമ്യം ചെയ്യുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: 'അല്ലെങ്കിൽ: “നാം അവനോടു വിളിക്കുമ്പോഴെല്ലാം.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: എന്തെന്നാൽ
  rationale: മുൻസന്ദർഭത്തിലെ പ്രബോധനത്തിന് കാരണം നൽകുന്ന ബന്ധകത്തിന്റെ വാദാത്മക ശക്തി നിലനിർത്തുന്നു.
- source_word: מִי גוֹי גָּדוֹל
  choice: ഏതു മഹാജാതിയാണുള്ളത്?
  rationale: ഹീബ്രായയിലെ അലങ്കാരചോദ്യത്തെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: אֲשֶׁר לוֹ
  choice: തങ്ങൾക്കു ... ആയിരിക്കുന്ന
  rationale: ഒരു ജാതിക്കു ദേവന്മാർ ഉണ്ടായിരിക്കുക/ബന്ധപ്പെട്ടിരിക്കുക എന്ന ഹീബ്രായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: אֱלֹהִים קְרֹבִים
  choice: ദേവന്മാർ ... സമീപസ്ഥരായിരിക്കുന്ന
  rationale: ബഹുവചന വിശേഷണമായ קְרֹבִים കാരണം ഇവിടെ മറ്റു ജാതികളുടെ ദേവതകളെ സൂചിപ്പിക്കുന്ന ബഹുവചന അർഥം നിലനിർത്തുന്നു.
- source_word: כַּיהוָה אֱלֹהֵינוּ
  choice: നമ്മുടെ ദൈവമായ യഹ്‌വെ ... പോലെ
  rationale: താരതമ്യഘടനയും ഇസ്രായേലിന്റെ ദൈവത്തോടുള്ള ഉടമ്പടിബന്ധവും സംരക്ഷിക്കുന്നു; יהוה വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בְּכָל קָרְאֵנוּ אֵלָיו
  choice: നാം അവനെ വിളിച്ചപേക്ഷിക്കുമ്പോഴെല്ലാം
  rationale: ആവർത്തിത സാഹചര്യത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രായ ഘടനയും പ്രാർഥനാപരമായ വിളിയുടെ അർഥവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- issue: ആദ്യ ഉപവാക്യത്തിലെ אֱלֹהִים ഏകവചനമാണോ ബഹുവചനമാണോ
  choice: മറ്റു ജാതികളുടെ ദേവന്മാരെ സൂചിപ്പിക്കുന്ന ‘ദേവന്മാർ’
  alternative: ദൈവം / ദിവ്യജീവികൾ
  rationale: קְרֹבִים എന്ന ബഹുവചന വിശേഷണവും ‘നമ്മുടെ ദൈവമായ യഹ്‌വെ’യോടുള്ള താരതമ്യവും ബഹുവചന വായനയെ പിന്തുണയ്ക്കുന്നു; ദേവന്മാരുടെ യാഥാർഥ്യസ്ഥാനം സംബന്ധിച്ച തത്ത്വചിന്താപരമായ വിധി വാക്യത്തിലേക്ക് ചേർക്കുന്നില്ല.
- issue: קרא ... אל എന്ന പ്രയോഗത്തിന്റെ ഭാവം
  choice: അവനെ വിളിച്ചപേക്ഷിക്കുക
  alternative: അവനോടു വിളിക്കുക
  rationale: 'പ്രാർഥനയിലും സഹായാഭ്യർഥനയിലും ദൈവത്തെ വിളിക്കുന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു; പദശ: സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.'
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള പൊതുവായ വേദപുസ്തകശൈലി. ‘സമീപസ്ഥൻ’ എന്ന പദം ദൈവത്തിന്റെ ബന്ധപരമായ അടുപ്പം വ്യക്തമാക്കുന്നു; അലങ്കാരചോദ്യത്തിന്റെ താരതമ്യബലം നിലനിർത്തിയിരിക്കുന്നു.
