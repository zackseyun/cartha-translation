source:
  edition: WLC
  text: וּ/פֶן תִּשָּׂ֨א עֵינֶ֜י/ךָ הַ/שָּׁמַ֗יְמָ/ה וְֽ֠/רָאִיתָ אֶת הַ/שֶּׁ֨מֶשׁ וְ/אֶת הַ/יָּרֵ֜חַ וְ/אֶת הַ/כּֽוֹכָבִ֗ים כֹּ֚ל צְבָ֣א הַ/שָּׁמַ֔יִם וְ/נִדַּחְתָּ֛ וְ/הִשְׁתַּחֲוִ֥יתָ לָ/הֶ֖ם וַ/עֲבַדְתָּ֑/ם אֲשֶׁ֨ר חָלַ֜ק יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֹתָ֔/ם לְ/כֹל֙ הָֽ/עַמִּ֔ים תַּ֖חַת כָּל הַ/שָּׁמָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/019.yaml
  text: And beware lest you lift up your eyes to heaven[a], and when you see the sun and the moon and the stars—all the host of heaven—you be drawn away and bow down to them and serve them[b], which Yahweh your God has allotted to all the peoples under all the heavens.
translation:
  language: ml
  text: നീ ആകാശത്തേക്കു കണ്ണുകളുയർത്തി സൂര്യനെയും ചന്ദ്രനെയും നക്ഷത്രങ്ങളെയും—ആകാശത്തിലെ സകല സൈന്യത്തെയും—കാണുമ്പോൾ, വഴിതെറ്റിപ്പോയി അവയ്ക്കു വണങ്ങി അവയെ സേവിക്കാതിരിക്കാൻ സൂക്ഷിച്ചുകൊള്ളുക. നിന്റെ ദൈവമായ യഹോവ അവയെ സകല ജനതകൾക്കും വിഹിതമായി നൽകിയിരിക്കുന്നു[a], ആകാശത്തിനു കീഴിലെങ്ങുമുള്ളവർക്ക്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വിഹിതമായി നൽകിയിരിക്കുന്നു’ എന്നതിന് ‘നിയോഗിച്ചിരിക്കുന്നു,’ ‘പങ്കിട്ടുകൊടുത്തിരിക്കുന്നു,’ അല്ലെങ്കിൽ ‘വിഭജിച്ചുനൽകിയിരിക്കുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം. യഹോവ ഇവയെ സകല ജനതകൾക്കും വിഹിതമായി നൽകി എന്നാണ് എബ്രായപാഠം പറയുന്നത്; അവയെ ആരാധിക്കുന്നത് അവൻ അംഗീകരിച്ചുവെന്ന് ഈ വാക്കുകൾതന്നെ പറയുന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘സകല ആകാശങ്ങൾക്കും കീഴിൽ.’ ഈ എബ്രായപ്രയോഗം ‘ആകാശത്തിനു കീഴിലെങ്ങും’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפֶן
  choice: നീ ... ചെയ്യാതിരിക്കാൻ സൂക്ഷിച്ചുകൊള്ളുക
  rationale: פן നൽകുന്ന മുന്നറിയിപ്പിന്റെയും സാധ്യതയുള്ള അപകടത്തിന്റെയും ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: תִּשָּׂא עֵינֶיךָ הַשָּׁמַיְמָה
  choice: ആകാശത്തേക്കു കണ്ണുകളുയർത്തി
  rationale: മുകളിലേക്കു ദൃഷ്ടി തിരിക്കുന്ന എബ്രായ ശൈലി നിലനിർത്തുന്നു.
- source_word: כֹּל צְבָא הַשָּׁמַיִם
  choice: ആകാശത്തിലെ സകല സൈന്യത്തെയും
  rationale: צָבָא എന്നതിന്റെ ‘സൈന്യം/നിര’ എന്ന രൂപകം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് സൂര്യൻ, ചന്ദ്രൻ, നക്ഷത്രങ്ങൾ എന്നിവയടങ്ങുന്ന ആകാശഗോളങ്ങളുടെ സമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וְנִדַּחְתָּ
  choice: നീ വഴിതെറ്റി
  rationale: നിഫാൽ രൂപത്തിലെ വഴിതെറ്റിക്കപ്പെടുക/വശീകരിക്കപ്പെടുക എന്ന ആശയം അമിതമായ നിർബന്ധഭാവമില്ലാതെ നൽകുന്നു.
- source_word: וְהִשְׁתַּחֲוִיתָ לָהֶם
  choice: അവയ്ക്കു കുമ്പിട്ട്
  rationale: ശാരീരികമായി നമസ്കരിക്കുന്ന പ്രവൃത്തി നിലനിർത്തുന്നു; തുടർന്ന് വരുന്ന ‘സേവിക്കുക’ എന്നതോടൊപ്പം വിഗ്രഹാരാധനയുടെ പൂർണഭാവം വ്യക്തമാകുന്നു.
- source_word: וַעֲבַדְתָּם
  choice: അവയെ സേവിക്കുക
  rationale: ആരാധനാസന്ദർഭത്തിലെ עבד എന്ന ക്രിയയുടെ ‘സേവിക്കുക’ എന്ന അടിസ്ഥാനാർഥം സംരക്ഷിക്കുന്നു.
- source_word: אֲשֶׁר חָלַק
  choice: അവയെ ... പങ്കിട്ടുകൊടുത്തിരിക്കുന്നു
  rationale: വിഭജിക്കുക, പങ്കുവെക്കുക, ഓഹരിയായി നൽകുക എന്നീ חלק-ന്റെ വിതരണാർഥം നൽകുന്നു; അവയുടെ ആരാധന ദൈവം അംഗീകരിച്ചു എന്ന് കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: לְכֹל הָעַמִּים
  choice: സകല ജനതകൾക്കും
  rationale: עמים എന്ന ബഹുവചനത്തിന്റെ ജനസമൂഹങ്ങളെന്ന അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: תַּחַת כָּל הַשָּׁמָיִם
  choice: ആകാശങ്ങൾക്കെല്ലാം കീഴിലുള്ള
  rationale: എബ്രായത്തിലെ ബഹുവചനരൂപവും ‘എല്ലാ’ എന്ന വ്യാപ്തിയും മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; സ്വാഭാവിക മലയാള വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: യഹോവ ആകാശഗോളങ്ങളെ സകല ജനതകൾക്കും ‘പങ്കിട്ടുകൊടുത്തു’ എന്ന ഉപവാക്യത്തിന്റെ അർഥം
  choice: ആകാശഗോളങ്ങളെ ജനതകൾക്കു പങ്കിട്ടുകൊടുത്തുവെന്ന വാചകം വ്യാഖ്യാനവിസ്താരം കൂടാതെ നിലനിർത്തി.
  alternative: ദൈവം അവയെ ജനതകളുടെ പൊതുവായ ഉപയോഗത്തിനായി നിയമിച്ചു; അല്ലെങ്കിൽ ജനതകൾ അവയെ ആരാധിക്കാൻ ദൈവം അവരെ ഏല്പിച്ചുകൊടുത്തു.
  rationale: חלק എന്ന ക്രിയ പങ്കിടൽ/വിഹിതമായി നൽകൽ സൂചിപ്പിക്കുന്നു. എന്നാൽ ആരാധനയെ അംഗീകരിച്ചെന്നോ ന്യായവിധിയായി അതിന് ഏല്പിച്ചെന്നോ വാക്യം തുറന്നുപറയുന്നില്ല. അതിനാൽ ദൈവശാസ്ത്രപരമായ സംഘർഷവും അർഥസാധ്യതയും പരിഭാഷയിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനികവും മാന്യവും പൊതുവായ വായനക്കാർക്കു മനസ്സിലാകുന്നതുമായ മലയാളം. ഏകവചന ദ്വിതീയപുരുഷ അഭിസംബോധന നിലനിർത്തി. ദീർഘമായ എബ്രായ വാക്യത്തിന്റെ മുന്നറിയിപ്പുഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കുമ്പോഴും ക്രിയകളുടെ ക്രമം സംരക്ഷിച്ചു. അടിക്കുറിപ്പ് സൂചകങ്ങൾ അവ വിശദീകരിക്കുന്ന ‘പങ്കിട്ടുകൊടുത്തിരിക്കുന്നു’ എന്നതിനുശേഷം ചേർത്തിരിക്കുന്നു.
