revisions:
- from: ആകാശത്തേക്കു കണ്ണുകളുയർത്തി സൂര്യനെയും ചന്ദ്രനെയും നക്ഷത്രങ്ങളെയും—ആകാശത്തിലെ സകല സൈന്യത്തെയും—കാണുമ്പോൾ, നീ വഴിതെറ്റി അവയ്ക്കു കുമ്പിട്ട് അവയെ സേവിക്കാതിരിക്കാൻ സൂക്ഷിച്ചുകൊള്ളുക. നിന്റെ ദൈവമായ യഹോവ അവയെ ആകാശങ്ങൾക്കെല്ലാം കീഴിലുള്ള സകല ജനതകൾക്കും പങ്കിട്ടുകൊടുത്തിരിക്കുന്നു[a][b].
  to: നീ ആകാശത്തേക്കു കണ്ണുകളുയർത്തി സൂര്യനെയും ചന്ദ്രനെയും നക്ഷത്രങ്ങളെയും—ആകാശത്തിലെ സകല സൈന്യത്തെയും—കാണുമ്പോൾ, വഴിതെറ്റിപ്പോയി അവയ്ക്കു വണങ്ങി അവയെ സേവിക്കാതിരിക്കാൻ സൂക്ഷിച്ചുകൊള്ളുക. നിന്റെ ദൈവമായ യഹോവ അവയെ സകല ജനതകൾക്കും വിഹിതമായി നൽകിയിരിക്കുന്നു[a], ആകാശത്തിനു കീഴിലെങ്ങുമുള്ളവർക്ക്[b].
  rationale: The revision corrects footnote placement, makes the warning construction and the passive force of ‘be drawn away’ more natural in modern Malayalam, and replaces an awkward literal rendering of the final idiom with an idiomatic equivalent. It preserves the celestial ‘host’ metaphor and leaves the disputed theological implications of ‘allotted’ unresolved, as in the Hebrew.
