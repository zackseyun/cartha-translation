id: DEU.4.29
reference: Deuteronomy 4:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בִקַּשְׁתֶּ֥ם מִ/שָּׁ֛ם אֶת יְהוָ֥ה אֱלֹהֶ֖י/ךָ וּ/מָצָ֑אתָ כִּ֣י תִדְרְשֶׁ֔/נּוּ בְּ/כָל לְבָבְ/ךָ֖ וּ/בְ/כָל נַפְשֶֽׁ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/029.yaml
  text: But from there you will seek Yahweh your God[a], and you will find him[b], if you seek him with all your heart and with all your soul.
translation:
  language: ml
  text: എന്നാൽ അവിടെനിന്ന് നിങ്ങൾ നിന്റെ ദൈവമായ യഹ്‌വെയെ[a] അന്വേഷിക്കും; നിന്റെ പൂർണഹൃദയത്തോടും നിന്റെ പൂർണജീവനോടുംകൂടെ[b] അവനെ അന്വേഷിച്ചാൽ, നീ അവനെ കണ്ടെത്തും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യഹ്‌വെ’ എന്നത് എബ്രായത്തിലെ יְהוָה (YHWH) എന്ന ദൈവനാമത്തിന്റെ ലിപ്യന്തരണമാണ്.
    reason: divine_name
  - marker: b
    text: ‘ജീവൻ’ എന്നു വിവർത്തനം ചെയ്ത എബ്രായപദത്തിന് ‘പ്രാണൻ’, ‘സ്വയം’, ‘മുഴുവൻ സത്ത’ എന്നീ അർഥങ്ങളും വരാം. എബ്രായവാക്യം ആദ്യത്തിൽ ‘നിങ്ങൾ’ (ബഹുവചനം) എന്നു പറഞ്ഞശേഷം ‘നിന്റെ/നീ’ (ഏകവചനം) എന്നു മാറുന്നു; ഇത് ഇസ്രായേലിനെ ഒരു കൂട്ടായ ജനമായി അഭിസംബോധന ചെയ്യുന്ന പ്രയോഗമാണ്.
    reason: lexical_alternative_and_grammar
lexical_decisions:
- source_word: וּבִקַּשְׁתֶּם מִשָּׁם
  choice: എന്നാൽ അവിടെനിന്ന് നിങ്ങൾ ... അന്വേഷിക്കും
  rationale: മִשָּׁם എന്നത് ചിതറിപ്പോയിരിക്കുന്ന സ്ഥലത്തുനിന്നുള്ള അന്വേഷണത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അവിടെനിന്ന്’ എന്നു നൽകി. മുൻസന്ദർഭത്തിലെ മുന്നറിയിപ്പിനോടുള്ള വ്യത്യാസം വ്യക്തമാക്കാൻ വാവ് ‘എന്നാൽ’ എന്നു വിവർത്തനം ചെയ്തു; ക്രിയയുടെ സന്ദർഭോചിതമായ ഭാവികാല അർഥവും നിലനിർത്തി.
- source_word: אֶת־יְהוָה אֱלֹהֶיךָ
  choice: നിങ്ങളുടെ ദൈവമായ യഹ്‌വെയെ
  rationale: יְהוָה എന്ന ദൈവനാമം പദവിയായി മാറ്റാതെ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു. ‘നിങ്ങളുടെ ദൈവമായ’ എന്ന പ്രയോഗം മലയാളത്തിൽ ബന്ധം സ്വാഭാവികവും വ്യക്തവുമാക്കുന്നു.
- source_word: וּמָצָאתָ
  choice: അവനെ കണ്ടെത്തും
  rationale: എബ്രായത്തിൽ ‘കണ്ടെത്തും’ എന്ന ക്രിയയ്ക്കുശേഷം കർമസർവനാമം ആവർത്തിക്കുന്നില്ലെങ്കിലും, തൊട്ടുമുമ്പുള്ള യഹ്‌വെയാണ് ഉദ്ദേശ്യമെന്നത് സന്ദർഭത്തിൽ വ്യക്തമാണ്; മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി ‘അവനെ’ ചേർത്തു.
- source_word: כִּי
  choice: അന്വേഷിച്ചാൽ
  rationale: ഇവിടെ כִּי കണ്ടെത്തുന്നതിനുള്ള നിബന്ധന അവതരിപ്പിക്കുന്നു. അതിനാൽ ‘എങ്കിൽ/ചെയ്താൽ’ എന്ന വ്യവസ്ഥാർഥം ക്രിയാരൂപത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു; ‘എപ്പോൾ’ എന്നു നൽകി ഉറപ്പിനെ അധികരിപ്പിച്ചില്ല.
- source_word: תִדְרְשֶׁנּוּ
  choice: നിങ്ങൾ അവനെ ... അന്വേഷിച്ചാൽ
  rationale: ദൈവത്തെ ആത്മാർഥമായി തേടുക എന്ന ഉടമ്പടിസംബന്ധമായ അർഥം ‘അന്വേഷിക്കുക’ കൃത്യമായി നൽകുന്നു; സഫിക്സിലെ ‘അവനെ’ വ്യക്തമായി പ്രതിനിധീകരിച്ചു.
- source_word: בְּכָל־לְבָבְךָ
  choice: ഹൃദയം മുഴുവനോടും
  rationale: לֵבָב ചിന്ത, ഇച്ഛ, വികാരം എന്നിവ ഉൾപ്പെടുന്ന ആന്തരിക വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. ‘ഹൃദയം മുഴുവനോടും’ എന്നത് സമ്പൂർണ സമർപ്പണത്തെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: וּבְכָל־נַפְשֶׁךָ
  choice: ജീവൻ മുഴുവനോടുംകൂടെ
  rationale: נֶפֶשׁ ഇവിടെ വെറും ശരീരത്തിൽനിന്ന് വേറിട്ട ഒരു ഘടകമെന്നതിലുപരി ജീവൻ, സ്വയം, മുഴുവൻ വ്യക്തി എന്നീ അർഥപരിധിയുള്ളതാണ്. ‘ജീവൻ മുഴുവനോടുംകൂടെ’ സമ്പൂർണമായ സ്വയംസമർപ്പണം വ്യക്തമാക്കുകയും רוּחַ എന്നതിന് യോജിക്കുന്ന ‘ആത്മാവ്’ അനാവശ്യമായി ഇറക്കുമതി ചെയ്യാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ചതുരക്ഷര ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ഒരു പദവികൊണ്ട് പകരാതെ, സാധ്യതയേറിയ ഉച്ചാരണത്തെ മലയാളത്തിൽ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
- issue: נֶפֶשׁ എന്ന മാനവശാസ്ത്രപദം
  choice: ജീവൻ
  alternative: പ്രാണൻ / സത്ത / ആത്മാവ്
  rationale: ഈ ആവർത്തനനിയമസൂത്രത്തിൽ മുഴുവൻ ജീവിക്കുന്ന വ്യക്തിയോടുള്ള സമർപ്പണമാണ് പ്രധാനം. ‘ജീവൻ’ ആ വിശാലത നിലനിർത്തുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- issue: കണ്ടെത്തലും പൂർണഹൃദയത്തോടെയുള്ള അന്വേഷണവും തമ്മിലുള്ള ബന്ധം
  choice: വ്യവസ്ഥാർഥം—‘അന്വേഷിച്ചാൽ’
  alternative: കാലാർഥം—‘അന്വേഷിക്കുമ്പോൾ’; കാരണാർഥം—‘എന്തെന്നാൽ’
  rationale: כִּי ഇവിടെ കണ്ടെത്തലിന്റെ നിബന്ധനയായി വായിക്കുന്നത് വാക്യഘടനയ്ക്കും സന്ദർഭത്തിനും യോജിക്കുന്നു; അതേസമയം ദൈവത്തെ കണ്ടെത്തുന്നത് യാന്ത്രികമായ മനുഷ്യനേട്ടമാണെന്ന ആശയം വിവർത്തനത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘പൂർണഹൃദയം’ എന്ന ചേർത്തെഴുത്തിനുപകരം ‘ഹൃദയം മുഴുവനോടും’ എന്നു നൽകി സാധാരണ വായനക്കാർക്ക് അർഥം നേരിട്ട് ലഭ്യമാക്കി. മൂലത്തിലെ വ്യവസ്ഥാർഥവും കൂട്ടായ ഇസ്രായേലിനെ അഭിസംബോധന ചെയ്യുന്ന ഏകവചന–ബഹുവചന മാറ്റവും അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
