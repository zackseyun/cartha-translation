source:
  edition: WLC
  text: תַּבְנִ֕ית כָּל רֹמֵ֖שׂ בָּ/אֲדָמָ֑ה תַּבְנִ֛ית כָּל דָּגָ֥ה אֲשֶׁר בַּ/מַּ֖יִם מִ/תַּ֥חַת לָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/018.yaml
  text: the form of any creeping thing on the ground[b][a], the form of any fish that is in the waters under the earth.
translation:
  language: ml
  text: നിലത്ത് ഇഴയുന്ന ഏതൊരു ജീവിയുടെയും രൂപം[a], ഭൂമിക്കു താഴെയുള്ള വെള്ളത്തിൽ ഉള്ള[b] ഏതൊരു മത്സ്യത്തിന്റെയും രൂപം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘രൂപം’ എന്നതിന് ‘സാദൃശ്യം’ എന്നോ ‘പ്രതിരൂപം’ എന്നോ പരിഭാഷപ്പെടുത്താം (എബ്രായം: תַּבְנִית).'
    reason: lexical_alternative
  - marker: b
    text: ‘ഭൂമിക്കു താഴെയുള്ള വെള്ളം’ എന്നത് കരയ്ക്കു താഴെയുള്ള ജലത്തെക്കുറിച്ചുള്ള ബൈബിളിലെ സ്ഥിരപ്രയോഗത്തെ പ്രതിധ്വനിപ്പിക്കുന്നു; പുറപ്പാട് 20:4-ലെ പ്രതിമാനിരോധനത്തിന്റെ ഭാഷയുമായി താരതമ്യം ചെയ്യുക.
    reason: cross_reference
lexical_decisions:
- source_word: תַּבְנִית
  choice: രൂപം
  rationale: വിഗ്രഹാരാധന നിരോധിക്കുന്ന ഈ സന്ദർഭത്തിൽ ദൃശ്യമായി പകർത്താവുന്ന ആകൃതിയെയോ പ്രതിനിധാനത്തെയോ സൂചിപ്പിക്കുന്നു. ‘രൂപം’ എന്നത് കൊത്തിയ വിഗ്രഹം എന്ന ഒരൊറ്റ മാധ്യമത്തിലേക്ക് അർഥം ചുരുക്കാതെ ആവർത്തനഘടന നിലനിർത്തുന്നു.
- source_word: כָּל
  choice: ഏതൊരു
  rationale: ഏകവചനത്തിലുള്ള ജീവിവർഗങ്ങളോടൊപ്പം വരുന്ന വിതരണാർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: רֹמֵשׂ
  choice: ഇഴയുന്ന ജീവി
  rationale: നിലത്തിന്റെ ഉപരിതലത്തിലൂടെ ഇഴഞ്ഞോ ചെറുചലനങ്ങളോടെയോ സഞ്ചരിക്കുന്ന ജീവികളെ സൂചിപ്പിക്കുന്ന എബ്രായ വർഗനാമം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בָּאֲדָמָה
  choice: നിലത്ത്
  rationale: ഇവിടെ אֲדָמָה ജീവികൾ സഞ്ചരിക്കുന്ന മണ്ണിന്റെ അഥവാ കരയുടെ ഉപരിതലത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: דָּגָה
  choice: മത്സ്യം
  rationale: എബ്രായ പദം സമുച്ചയാർഥത്തിൽ ഉപയോഗിച്ചിട്ടുണ്ടെങ്കിലും ‘ഏതൊരു മത്സ്യം’ എന്ന പ്രയോഗം അതിന്റെ വിതരണാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: אֲשֶׁר בַּמַּיִם
  choice: വെള്ളത്തിലുള്ള
  rationale: ബന്ധവാക്യത്തിന്റെ അർഥം ചുരുക്കമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു; എബ്രായത്തിലെ രൂപപരമായ ബഹുവചനം മലയാളത്തിൽ അസ്വാഭാവികമായി നിർബന്ധിച്ചിട്ടില്ല.
- source_word: מִתַּחַת לָאָרֶץ
  choice: ഭൂമിക്കു കീഴെയുള്ള
  rationale: ഭൂമിക്കു കീഴെയുള്ള വെള്ളം എന്ന ബൈബിൾപരമായ സ്ഥിരപ്രയോഗവും പുറപ്പാട് 20:4-നോടുള്ള ശബ്ദബന്ധവും വ്യാഖ്യാനവിസ്താരം കൂടാതെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: വിഗ്രഹാരാധനയുടെ പശ്ചാത്തലത്തിൽ പ്രതിനിധാനവസ്തുവിനെ സൂചിപ്പിക്കുന്ന പദം
  choice: രൂപം
  alternative: സാദൃശ്യം; പ്രതിരൂപം; വിഗ്രഹം
  rationale: תַּבְנִית ദൃശ്യമായ രൂപത്തെയോ രൂപസാദൃശ്യത്തെയോ സൂചിപ്പിക്കുന്നു. ‘വിഗ്രഹം’ എന്ന് പരിഭാഷപ്പെടുത്തുന്നത് സന്ദർഭത്തിലെ നിരോധനത്തെ പദത്തിനുള്ളിലേക്കു കൊണ്ടുവന്ന് അർഥം അനാവശ്യമായി ചുരുക്കും; ‘രൂപം’ മൂലപാഠത്തിന്റെ വ്യാപ്തിയും സന്ദർഭത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. വാക്യം മുൻവാക്യങ്ങളിൽനിന്നു തുടരുന്ന പട്ടികാഭാഗമായതിനാൽ മൂലപാഠത്തിലെ ഖണ്ഡവാക്യസ്വഭാവം നിലനിർത്തി. ‘ഇഴജന്തു’ എന്ന സാങ്കേതികമോ പഴക്കമുള്ളതോ ആയ രൂപത്തിനു പകരം സാധാരണ വായനക്കാർക്കു വ്യക്തമായ ‘ഇഴയുന്ന ജീവി’ ഉപയോഗിച്ചു.
