source:
  edition: WLC
  text: מִן הַ/שָּׁמַ֛יִם הִשְׁמִֽיעֲ/ךָ֥ אֶת קֹל֖/וֹ לְ/יַסְּרֶ֑/ךָּ וְ/עַל הָ/אָ֗רֶץ הֶרְאֲ/ךָ֙ אֶת אִשּׁ֣/וֹ הַ/גְּדוֹלָ֔ה וּ/דְבָרָ֥י/ו שָׁמַ֖עְתָּ מִ/תּ֥וֹךְ הָ/אֵֽשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/036.yaml
  text: From heaven he made you hear his voice to discipline you[a], and on earth he showed you his great fire[b], and you heard his words from the midst of the fire.
translation:
  language: ml
  text: നിനക്കു ശിക്ഷണം നൽകാൻ[a] അവൻ ആകാശത്തുനിന്ന് തന്റെ ശബ്ദം നിന്നെ കേൾപ്പിച്ചു; ഭൂമിയിൽ തന്റെ മഹത്തായ അഗ്നി അവൻ നിനക്കു കാണിച്ചുതന്നു; അഗ്നിയുടെ നടുവിൽനിന്ന്[b] നീ അവന്റെ വാക്കുകൾ കേട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിന്നെ പഠിപ്പിക്കാൻ’ എന്നോ ‘നിന്നെ ശാസിക്കാൻ’ എന്നോ വിവർത്തനം ചെയ്യാം; എബ്രായക്രിയയ്ക്ക് തിരുത്തലും രൂപീകരണപരമായ പഠിപ്പിക്കലും ഉൾക്കൊള്ളാനാകും.
    reason: lexical_alternative
  - marker: b
    text: ‘അഗ്നിക്കുള്ളിൽനിന്ന്’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַשָּׁמַיִם
  choice: ആകാശത്തുനിന്ന്
  rationale: അടുത്ത ഭാഗത്തിലെ ‘ഭൂമിയിൽ’ എന്നതിനോടുള്ള സ്ഥലപരമായ വൈരുധ്യം വ്യക്തമായി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: הִשְׁמִיעֲךָ
  choice: നിന്നെ കേൾപ്പിച്ചു
  rationale: שׁמע എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലുള്ള കാരണാർത്ഥം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: קֹלוֹ
  choice: തന്റെ ശബ്ദം
  rationale: ദൈവത്തിന്റെ കേൾക്കാവുന്ന സ്വയംവെളിപ്പെടുത്തലിനെ സൂചിപ്പിക്കുന്ന קוֹל എന്ന പദത്തിന് ഇവിടെ ‘ശബ്ദം’ സ്വാഭാവികമായ തുല്യപദമാണ്.
- source_word: לְיַסְּרֶךָּ
  choice: നിനക്കു ശിക്ഷണം നൽകാൻ
  rationale: തിരുത്തലും പഠിപ്പിച്ചു രൂപപ്പെടുത്തലും ഉൾക്കൊള്ളാവുന്ന יסר എന്ന പദത്തിന്റെ വിശാലമായ അർഥപരിധി നിലനിർത്തുന്നു; ശിക്ഷ എന്ന ദണ്ഡനാർഥത്തിലേക്ക് മാത്രം ചുരുക്കുന്നില്ല.
- source_word: וְעַל הָאָרֶץ
  choice: ഭൂമിയിൽ
  rationale: ‘ആകാശത്തുനിന്ന്’ എന്നതിനോടുള്ള പ്രപഞ്ചപരമായ വൈരുധ്യം വ്യക്തവും സ്വാഭാവികവുമായി സംരക്ഷിക്കുന്നു.
- source_word: הֶרְאֲךָ
  choice: നിനക്കു കാണിച്ചുതന്നു
  rationale: ראה എന്ന ധാതുവിന്റെ കാരണാർത്ഥരൂപം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֶת אִשּׁוֹ הַגְּדוֹלָה
  choice: തന്റെ മഹത്തായ അഗ്നി
  rationale: മൂലത്തിലെ ഉടമസ്ഥതയും വിശേഷണവും ദൃശ്യതീവ്രതയും നിലനിർത്തുന്നു; ‘അഗ്നി’ ഗൗരവമുള്ളതും ഇന്നത്തെ വായനക്കാർക്ക് വ്യക്തവുമാണ്.
- source_word: וּדְבָרָיו
  choice: അവന്റെ വാക്കുകൾ
  rationale: എബ്രായത്തിലെ വ്യക്തമായ ബഹുവചനം സംരക്ഷിക്കുകയും അഗ്നിയിൽനിന്ന് കേട്ട ഉച്ചരിക്കപ്പെട്ട വചനങ്ങളെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: שָׁמַעְתָּ
  choice: നീ കേട്ടു
  rationale: ഇവിടെ യഥാർഥമായി കേട്ട സംഭവത്തെ സൂചിപ്പിക്കുന്ന കാൽ പൂർണകാലരൂപത്തിന്റെ നേരിട്ടുള്ള വിവർത്തനം.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: അഗ്നിയുടെ നടുവിൽനിന്ന്
  rationale: מִתּוֹךְ എന്നതിന്റെ ‘നടുവിൽനിന്ന്/ഉള്ളിൽനിന്ന്’ എന്ന സ്ഥലപരമായ ആശയം ദൃശ്യവും ഗൗരവമുള്ളതുമായ ഭാഷയിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: לְיַסְּרֶךָּ എന്നതിലെ ദൈവിക രൂപീകരണലക്ഷ്യം
  choice: നിനക്കു ശിക്ഷണം നൽകാൻ
  alternative: നിന്നെ പഠിപ്പിക്കാൻ; നിന്നെ ശാസിക്കാൻ; നിന്നെ തിരുത്താൻ
  rationale: ദൈവത്തിന്റെ വെളിപ്പെടുത്തൽ തിരുത്തുകയും പഠിപ്പിച്ചു രൂപപ്പെടുത്തുകയും ചെയ്യുന്നു എന്ന അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു; ശിക്ഷയിലേക്കോ കേവലബോധനത്തിലേക്കോ അർഥം ചുരുക്കുന്നില്ല.
- issue: ദൈവിക സ്വയംവെളിപ്പെടുത്തലിന്റെ മൂർത്തമായ ഭാഷ
  choice: തന്റെ ശബ്ദം … തന്റെ മഹത്തായ അഗ്നി … അവന്റെ വാക്കുകൾ
  alternative: ദൈവിക സന്ദേശം എന്ന അമൂർത്തമായ പരാവർത്തനം
  rationale: മൂലപാഠത്തിലെ ശബ്ദം, അഗ്നി, വാക്കുകൾ എന്നീ മൂർത്തമായ പ്രയോഗങ്ങളെ വിശദീകരിച്ചു മൃദൂകരിക്കാതെ അതേപടി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ മലയാളം ഉപയോഗിച്ചു. എബ്രായത്തിൽ ഇസ്രായേലിനെ ഏകവചനത്തിൽ അഭിസംബോധന ചെയ്യുന്നതിനാൽ ‘നീ/നിന്നെ/നിനക്കു’ എന്ന ഏകവചനം നിലനിർത്തി. ‘അഗ്നി’ എന്ന പദം വാക്യത്തിലെ രണ്ടു സ്ഥാനങ്ങളിലും ആവർത്തിച്ച് മൂലപാഠത്തിന്റെ പദബന്ധം സംരക്ഷിച്ചു.
