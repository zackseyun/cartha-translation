revisions:
- from: 'ഹോരേബിൽവെച്ച് നിന്റെ ദൈവമായ യഹോവയുടെ സന്നിധിയിൽ നീ നിന്ന ദിവസം ഓർക്കുക. അന്നു യഹോവ എന്നോടു പറഞ്ഞു: “ജനത്തെ എന്റെ അടുക്കൽ കൂട്ടിവരുത്തുക. ഞാൻ എന്റെ വചനങ്ങൾ അവരെ കേൾപ്പിക്കും. അങ്ങനെ, അവർ ഭൂമിയിൽ[a] ജീവിച്ചിരിക്കുന്ന കാലമത്രയും എന്നെ ഭയപ്പെടാൻ പഠിക്കുകയും തങ്ങളുടെ മക്കളെ പഠിപ്പിക്കുകയും ചെയ്യും.”'
  to: 'ഹോരേബിൽ നിന്റെ ദൈവമായ യഹോവയുടെ സന്നിധിയിൽ നീ നിന്ന ദിവസത്തെ—യഹോവ എന്നോടു പറഞ്ഞപ്പോൾ: “ജനത്തെ എന്റെ അടുക്കൽ കൂട്ടിവരുത്തുക; ഞാൻ എന്റെ വചനങ്ങൾ അവരെ കേൾപ്പിക്കും. അങ്ങനെ അവർ ഭൂമിയിൽ[a] ജീവിച്ചിരിക്കുന്ന കാലമത്രയും എന്നെ ഭയപ്പെടാൻ പഠിക്കുകയും തങ്ങളുടെ മക്കളെ പഠിപ്പിക്കുകയും ചെയ്യും.”'
  rationale: The revision removes the imperative imported from the preceding verse and preserves 4:10 as the Hebrew’s dependent temporal phrase. A dash marks its continuation from 4:9 in readable Malayalam. The rest of the translation and the lexical-alternative footnote are retained with only minor stylistic tightening.
