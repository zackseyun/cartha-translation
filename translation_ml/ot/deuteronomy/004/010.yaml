  text: י֗וֹם אֲשֶׁ֨ר עָמַ֜דְתָּ לִ/פְנֵ֨י יְהוָ֣ה אֱלֹהֶי/ךָ֮ בְּ/חֹרֵב֒ בֶּ/אֱמֹ֨ר יְהוָ֜ה אֵלַ֗/י הַקְהֶל לִ/י֙ אֶת הָ/עָ֔ם וְ/אַשְׁמִעֵ֖/ם אֶת דְּבָרָ֑/י אֲשֶׁ֨ר יִלְמְד֜וּ/ן לְ/יִרְאָ֣ה אֹתִ֗/י כָּל הַ/יָּמִים֙ אֲשֶׁ֨ר הֵ֤ם חַיִּים֙ עַל הָ֣/אֲדָמָ֔ה וְ/אֶת בְּנֵי/הֶ֖ם יְלַמֵּדֽוּ/ן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/010.yaml
  text: the day when you stood before Yahweh your God at Horeb[a], when Yahweh said to me, ‘Assemble the people to me, and I will let them hear my words, so that they may learn to fear me all the days that they live on the earth, and that they may teach their children.’
translation:
  language: ml
  text: 'ഹോരേബിൽ നിന്റെ ദൈവമായ യഹോവയുടെ സന്നിധിയിൽ നീ നിന്ന ദിവസത്തെ—യഹോവ എന്നോടു പറഞ്ഞപ്പോൾ: “ജനത്തെ എന്റെ അടുക്കൽ കൂട്ടിവരുത്തുക; ഞാൻ എന്റെ വചനങ്ങൾ അവരെ കേൾപ്പിക്കും. അങ്ങനെ അവർ ഭൂമിയിൽ[a] ജീവിച്ചിരിക്കുന്ന കാലമത്രയും എന്നെ ഭയപ്പെടാൻ പഠിക്കുകയും തങ്ങളുടെ മക്കളെ പഠിപ്പിക്കുകയും ചെയ്യും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദേശത്ത്.’ എബ്രായപദത്തിന് പൊതുവായി ‘ഭൂമി/നിലം’ എന്നും ഒരു പ്രത്യേക ‘ദേശം’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: י֗וֹם אֲשֶׁר
  choice: നീ നിന്ന ദിവസം
  rationale: സംഭവത്തെ ഓർമിപ്പിക്കുന്ന കാലസംബന്ധിയായ പ്രയോഗത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യഘടനയ്ക്കായി ‘ഓർക്കുക’ സന്ദർഭത്തിൽനിന്ന് പൂർത്തീകരിച്ചു.
- source_word: עָמַדְתָּ לִפְנֵי
  choice: സന്നിധിയിൽ നീ നിന്ന
  rationale: ദൈവത്തിന്റെ മുമ്പിൽ നിൽക്കുന്ന ഉടമ്പടിസന്ദർഭം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: പദവിയായ ‘കർത്താവ്’ കൊണ്ട് പകരാതെ ദൈവനാമമായ ചതുരക്ഷരനാമം മലയാളത്തിലെ പരിചിതരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: ഏകവചന അഭിസംബോധനയും ഉടമ്പടിബന്ധത്തിന്റെ വ്യക്തിപരമായ സ്വഭാവവും സൂക്ഷിക്കുന്നു.
- source_word: בְּחֹרֵב
  choice: ഹോരേബിൽവെച്ച്
  rationale: സ്ഥലസൂചന മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הַקְהֶל לִי אֶת הָעָם
  choice: ജനത്തെ എന്റെ അടുക്കൽ കൂട്ടിവരുത്തുക
  rationale: കാഹൽ എന്ന ക്രിയയുടെ ഹിഫീൽ കാരകഭാവവും לִי എന്നതിന്റെ ‘എന്റെ അടുക്കൽ’ എന്ന ദിശാഭാവവും നിലനിർത്തുന്നു.
- source_word: וְאַשְׁמִעֵם
  choice: ഞാൻ ... അവരെ കേൾപ്പിക്കും
  rationale: ശമാ എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപമായ ‘കേൾക്കാൻ ഇടയാക്കുക’ എന്ന കാരകഭാവം കൃത്യമായി നൽകുന്നു.
- source_word: דְּבָרַי
  choice: എന്റെ വചനങ്ങൾ
  rationale: ബഹുവചനം നിലനിർത്തുകയും ദൈവത്തിന്റെ ഉടമ്പടിവചനങ്ങളുടെ ഗൗരവം പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: אֲשֶׁר יִלְמְדוּן לְיִרְאָה אֹתִי
  choice: അവർ ... എന്നെ ഭയപ്പെടാൻ പഠിക്കുകയും
  rationale: ഉദ്ദേശ്യഫലബന്ധം ‘അങ്ങനെ’ എന്നതിലൂടെ വ്യക്തമാക്കുന്നു; യിരാ എന്നതിലെ ഭയം, ഭക്തി, അനുസരണം എന്നിവയുടെ സംഘർഷം ‘ഭയപ്പെടുക’ എന്ന പദത്തിൽ നിലനിർത്തുന്നു.
- source_word: כָּל־הַיָּמִים אֲשֶׁר הֵם חַיִּים
  choice: ജീവിച്ചിരിക്കുന്ന കാലമത്രയും
  rationale: ജീവിതകാലം മുഴുവൻ എന്ന എബ്രായ ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: עַל־הָאֲדָמָה
  choice: ഭൂമിയിൽ
  rationale: അദാമാ എന്നതിന് ഇവിടെ പൊതുവായ ‘ഭൂമി’യും പ്രത്യേകമായ ‘ദേശം’യും സാധ്യമാണ്; മുഖ്യപാഠത്തിൽ പൊതുവായ അർഥം സ്വീകരിച്ച് മറ്റേ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: בְּנֵיהֶם
  choice: തങ്ങളുടെ മക്കളെ
  rationale: വ്യാകരണപരമായി പുരുഷലിംഗ ബഹുവചനമായിരുന്നാലും സന്ദർഭത്തിൽ സന്തതികളെ പൊതുവായി സൂചിപ്പിക്കുന്നതിനാൽ ‘മക്കൾ’ യോജിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിലെ സ്ഥാപിതമായ ലിപ്യന്തരണത്തിൽ സൂക്ഷിക്കുന്നു.
- issue: ഉടമ്പടിസന്ദർഭത്തിലെ ירא
  choice: എന്നെ ഭയപ്പെടാൻ
  alternative: എന്നെ ഭക്തിയോടെ ആദരിക്കാൻ
  rationale: ഭയം, ഭക്ത്യാദരം, അനുസരണം എന്നിവ ഉൾക്കൊള്ളുന്ന മൂലപദത്തിന്റെ ദൈവശാസ്ത്രപരമായ തീവ്രത മൃദൂകരിക്കാതെ നിലനിർത്തുന്നു.
- issue: בנים എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: മക്കൾ
  alternative: പുത്രന്മാർ
  rationale: ഇവിടെ അടുത്ത തലമുറയെ പൊതുവായി ഉദ്ദേശിക്കുന്നതിനാൽ അനാവശ്യമായി പുരുഷന്മാരിലേക്കു മാത്രം അർഥം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. വാക്യം ഒറ്റ നീണ്ട ഘടനയായി വിടാതെ മലയാളത്തിലെ വ്യക്തതയ്ക്കായി വിഭജിച്ചു; ആദ്യഭാഗം മുൻവാക്യത്തിലെ ഓർമിക്കാനുള്ള ആഹ്വാനത്തോട് ബന്ധപ്പെട്ടിരിക്കുന്നതിനാൽ ‘ഓർക്കുക’ ചേർത്തു.
