id: DEU.4.44
reference: Deuteronomy 4:44
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/זֹ֖את הַ/תּוֹרָ֑ה אֲשֶׁר שָׂ֣ם מֹשֶׁ֔ה לִ/פְנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/044.yaml
  text: And this is the law that Moses set before the sons of Israel:[a]
translation:
  language: ml
  text: മോശെ ഇസ്രായേൽമക്കളുടെ മുമ്പിൽ വെച്ച ന്യായപ്രമാണം ഇതാണ്:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഇസ്രായേല്യർ,’ ‘ഇസ്രായേൽജനം’; അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേലിന്റെ മക്കൾ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת
  choice: ഇതാണ്
  rationale: സംയോജകവും സൂചകസർവനാമവും ചേർന്ന പ്രയോഗം അടുത്ത ഭാഗത്തെ പരിചയപ്പെടുത്തുന്നു. മലയാളത്തിൽ തലക്കെട്ടുസ്വഭാവമുള്ള ഈ വാക്യത്തിൽ ‘ഇതാണ്’ സ്വാഭാവികമായി ആ അവതരണബലം നിലനിർത്തുന്നു.
- source_word: הַתּוֹרָה
  choice: ന്യായപ്രമാണം
  rationale: ഇവിടെ תּוֹרָה മോശെ ജനത്തിനു മുന്നിൽ അവതരിപ്പിക്കുന്ന ഉടമ്പടിസംബന്ധമായ നിയമവും ഉപദേശവും സൂചിപ്പിക്കുന്നു. മലയാള ബൈബിൾഭാഷയിൽ പരിചിതവും സന്ദർഭോചിതവുമായ ‘ന്യായപ്രമാണം’ തിരഞ്ഞെടുത്തു.
- source_word: שָׂם ... לִפְנֵי
  choice: മുമ്പിൽ വെച്ച
  rationale: שׂוּם എന്ന ക്രിയയുടെ ‘വെക്കുക/സ്ഥാപിക്കുക’ എന്ന അടിസ്ഥാനാർഥവും לִפְנֵי എന്നതിന്റെ ‘മുമ്പിൽ’ എന്ന അർഥവും ലളിതവും സ്വാഭാവികവുമായി സംരക്ഷിക്കുന്നു; ഇവിടെ ജനത്തിനു നിയമം അവതരിപ്പിച്ചതാണ് ഉദ്ദേശ്യം.
- source_word: מֹשֶׁה
  choice: മോശെ
  rationale: പേരിന്റെ മലയാളത്തിലെ പ്രചാരത്തിലുള്ള രൂപം.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: എബ്രായത്തിലെ അക്ഷരാർഥമായ ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന ദേശീയ-ഉടമ്പടി സംജ്ഞയെ മലയാളത്തിലെ സ്വാഭാവികവും പരമ്പരാഗതവുമായ സംയുക്തരൂപത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ദേശീയവും ലിംഗസൂചനയുള്ളതുമായ സംജ്ഞ
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ / ഇസ്രായേൽജനം / ഇസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: ഈ പ്രയോഗം മുഴുവൻ ജനതയെയും കൂട്ടമായി സൂചിപ്പിക്കുന്നുവെങ്കിലും മൂലഭാഷയിൽ ‘മക്കൾ/പുത്രന്മാർ’ എന്ന രൂപമാണുള്ളത്. ‘ഇസ്രായേൽമക്കൾ’ ആ ഉറവിടരൂപം തിരിച്ചറിയാവുന്ന വിധത്തിൽ സൂക്ഷിക്കുകയും മലയാളത്തിൽ സ്ത്രീപുരുഷന്മാരടങ്ങിയ ജനതയെ സ്വാഭാവികമായി ഉൾക്കൊള്ളുകയും ചെയ്യുന്നു; ‘പുത്രന്മാർ’ ഇവിടെ അനാവശ്യമായി പുരുഷന്മാരിൽ മാത്രം അർഥം ചുരുക്കാൻ ഇടയുണ്ട്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘ന്യായപ്രമാണം’ എന്ന പരിചിതമായ ബൈബിൾപദം നിലനിർത്തിയെങ്കിലും വാക്യഘടന സ്വാഭാവികമാക്കി. വാക്യാന്ത്യത്തിലെ [a] അടിക്കുറിപ്പുചിഹ്നം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
