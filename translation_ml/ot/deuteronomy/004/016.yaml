  text: so that you do not act corruptly and make for yourselves a carved image[a], in the form of any figure, the likeness of male or female—
translation:
  language: ml
  text: നിങ്ങൾ ദുഷിച്ചുപ്രവർത്തിക്കാതെയും, ഏതെങ്കിലും രൂപത്തിന്റെ ആകൃതിയിലുള്ള, പുരുഷന്റെയോ സ്ത്രീയുടെയോ സാദൃശ്യമുള്ള ഒരു കൊത്തിയ പ്രതിമ നിങ്ങൾക്കുവേണ്ടി ഉണ്ടാക്കാതെയും ഇരിക്കേണ്ടതിന്[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നിങ്ങൾ നിങ്ങളെത്തന്നെ ദുഷിപ്പിക്കാതെയും, ഏതെങ്കിലും രൂപത്തിന്റെ ആകൃതിയിലുള്ള, പുരുഷന്റെയോ സ്ത്രീയുടെയോ സാദൃശ്യമുള്ള ഒരു കൊത്തിയ പ്രതിമ നിങ്ങൾക്കുവേണ്ടി ഉണ്ടാക്കാതെയും ഇരിക്കേണ്ടതിന്.”'
    reason: תַּשְׁחִתוּן എന്ന ക്രിയയ്ക്ക് “നിങ്ങളെത്തന്നെ ദുഷിപ്പിക്കുക” എന്ന പ്രതിഫലാർഥ സാധ്യതയും פֶּן എന്നതിന് “അങ്ങനെ സംഭവിക്കാതിരിക്കേണ്ടതിന്” എന്ന മുന്നറിയിപ്പുഭാവവും രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: פֶּן
  choice: ഉണ്ടാക്കാതിരിക്കാൻ
  rationale: അനഭിലഷണീയമായ ഫലത്തെക്കുറിച്ചുള്ള മുന്നറിയിപ്പ് സൂചിപ്പിക്കുന്നു; മുൻസന്ദർഭത്തോടു ചേർന്ന് മലയാളത്തിൽ സ്വാഭാവികമായി ഉദ്ദേശ്യ/ജാഗ്രതാഭാവം നൽകുന്നു.
- source_word: תַּשְׁחִתוּן
  choice: ദുഷിച്ചുപ്രവർത്തിച്ച്
  rationale: ശחת എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ ഉടമ്പടിലംഘനത്തിലെ നാശകരവും ധാർമികമായി ദുഷിച്ചതുമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; കർമണിയോ പൂർണ ആത്മനേപദമോ ആക്കാതെ സജീവഭാവം നിലനിർത്തുന്നു.
- source_word: וַעֲשִׂיתֶם לָכֶם
  choice: നിങ്ങൾക്കുവേണ്ടി ... ഉണ്ടാക്കുക
  rationale: לָכֶם എന്നതിലെ സ്വയംപ്രയോജനാർഥക ഭാവം നിലനിർത്തുന്നു.
- source_word: פֶּסֶל
  choice: കൊത്തിയ പ്രതിമ
  rationale: കൊത്തിയോ രൂപപ്പെടുത്തിയൊ ഉണ്ടാക്കുന്ന പ്രതിമയാണ് സൂചന; പൊതുവായ ‘വിഗ്രഹം’ എന്നതിനേക്കാൾ നിർമ്മാണരീതി വ്യക്തമാക്കുന്നു.
- source_word: תְּמוּנַת
  choice: ആകൃതിയിൽ
  rationale: രൂപം/ആകൃതി എന്ന നിർമാണബന്ധം സൂചിപ്പിക്കുകയും പിന്നീടുള്ള תַּבְנִית എന്ന പദത്തിൽനിന്ന് മലയാളത്തിൽ വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: כָּל סָמֶל
  choice: ഏതെങ്കിലും രൂപത്തിന്റെ
  rationale: സֶמֶל എന്നത് പ്രതിമയെയോ പ്രതിനിധാനരൂപത്തെയോ സൂചിപ്പിക്കാം; ഇവിടെ ‘രൂപം’ എന്ന് നൽകുന്നത് ആരാധനാവിഗ്രഹം എന്ന അർഥത്തിലേക്ക് അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: תַּבְנִית
  choice: സാദൃശ്യത്തിലുള്ള
  rationale: മാതൃക, രൂപഘടന, സാദൃശ്യം എന്നീ അർഥങ്ങളിൽ ഇവിടെ തുടർന്നുവരുന്ന പുരുഷൻ/സ്ത്രീ വിഭാഗങ്ങളോടു സ്വാഭാവികമായി ചേരുന്നു.
- source_word: זָכָר אֹו נְקֵבָה
  choice: പുരുഷന്റെയോ സ്ത്രീയുടെയോ
  rationale: മനുഷ്യരൂപത്തെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്; മൂലത്തിലെ ആൺ/പെൺ വ്യത്യാസം കാത്തുസൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: പ്രതിമാരാധനാവിരുദ്ധ പദാവലിയുടെ വിവർത്തനം
  choice: פֶּסֶל എന്നതിന് ‘കൊത്തിയ പ്രതിമ’ എന്നും סָמֶל എന്നതിന് ‘രൂപം’ എന്നും വേർതിരിക്കുക
  alternative: ഇരുവർക്കും ‘വിഗ്രഹം/പ്രതിമ’ എന്നു നൽകുക
  rationale: എബ്രായത്തിലെ പരസ്പരം മൂടിനിൽക്കുന്ന വിവിധ രൂപപദങ്ങളുടെ കൂട്ടിച്ചേർക്കൽ സംരക്ഷിക്കുന്നു. അതേസമയം סָמֶל എന്ന പദത്തെ നിർബന്ധമായി ആരാധനാവിഗ്രഹമായി മാത്രം വ്യാഖ്യാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. ‘കൊത്തിയ പ്രതിമ’, ‘രൂപം’, ‘സാദൃശ്യം’ എന്നീ വ്യത്യസ്ത പദങ്ങൾ ഉപയോഗിച്ച് മൂലത്തിലെ പ്രതിനിധാനപദങ്ങളുടെ അടുക്കൽ നിലനിർത്തി. വാക്യം മുൻവാക്യങ്ങളോട് തുടർച്ചയുള്ളതിനാൽ അവസാനത്തെ ദീർഘരേഖയും സംരക്ഷിച്ചു.
