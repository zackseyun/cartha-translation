  text: כִּ֣י שְׁאַל נָא֩ לְ/יָמִ֨ים רִֽאשֹׁנִ֜ים אֲשֶׁר הָי֣וּ לְ/פָנֶ֗י/ךָ לְ/מִן הַ/יּוֹם֙ אֲשֶׁר֩ בָּרָ֨א אֱלֹהִ֤ים אָדָם֙ עַל הָ/אָ֔רֶץ וּ/לְ/מִ/קְצֵ֥ה הַ/שָּׁמַ֖יִם וְ/עַד קְצֵ֣ה הַ/שָּׁמָ֑יִם הֲ/נִֽהְיָ֗ה כַּ/דָּבָ֤ר הַ/גָּדוֹל֙ הַ/זֶּ֔ה א֖וֹ הֲ/נִשְׁמַ֥ע כָּמֹֽ/הוּ־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/032.yaml
  text: 'For ask now about the former days that were before you[a], from the day when God created man on the earth, and from one end of the heavens to the other end of the heavens: has anything happened like this great thing, or has anything been heard like it?'
translation:
  language: ml
  text: 'നിനക്കുമുമ്പുണ്ടായിരുന്ന പണ്ടത്തെ നാളുകളെക്കുറിച്ച് ഇപ്പോൾ ചോദിച്ചറിയുക: ദൈവം ഭൂമിയിൽ മനുഷ്യനെ[a] സൃഷ്ടിച്ച നാൾമുതൽ, ആകാശത്തിന്റെ ഒരറ്റംമുതൽ മറ്റേ അറ്റംവരെ, ഇതുപോലൊരു മഹത്തായ കാര്യം എപ്പോഴെങ്കിലും സംഭവിച്ചിട്ടുണ്ടോ? അല്ലെങ്കിൽ ഇതുപോലൊന്ന് എപ്പോഴെങ്കിലും കേട്ടിട്ടുണ്ടോ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “മനുഷ്യവർഗത്തെ.” സൃഷ്ടിസന്ദർഭങ്ങളിൽ “മനുഷ്യൻ” (אָדָם) എന്ന ഹീബ്രായപദം മനുഷ്യരാശിയെ മുഴുവനായി പ്രതിനിധീകരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאַל נָא
  choice: ഇപ്പോൾ ചോദിച്ചറിയുക
  rationale: ആജ്ഞാരൂപത്തോടൊപ്പമുള്ള נָאയുടെ അഭ്യർഥനാത്മകവും ഊന്നലുള്ളതുമായ ഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לְיָמִים רִאשֹׁנִים
  choice: പണ്ടത്തെ നാളുകളെക്കുറിച്ച്
  rationale: വളരെ പഴയ കാലഘട്ടത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗം; സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ഗൗരവമുള്ളതുമാണ്.
- source_word: אֲשֶׁר הָיוּ לְפָנֶיךָ
  choice: നിനക്കുമുമ്പുണ്ടായിരുന്ന
  rationale: ശ്രോതാവിനോ അവന്റെ തലമുറയ്ക്കോ മുമ്പുള്ള കാലത്തെ സൂചിപ്പിക്കുന്ന സമയാർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: לְמִן הַיּוֹם אֲשֶׁר בָּרָא
  choice: സൃഷ്ടിച്ച നാൾമുതൽ
  rationale: ചരിത്രപരമായ അന്വേഷണത്തിന്റെ ആരംഭബിന്ദു കൃത്യമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ഈ സന്ദർഭത്തിൽ ഏക സ്രഷ്ടാവിനെ സൂചിപ്പിക്കുന്ന പതിവും യോജിച്ചതുമായ മലയാള പരിഭാഷ.
- source_word: אָדָם
  choice: മനുഷ്യനെ
  rationale: സൃഷ്ടിസന്ദർഭത്തിലെ ഏകവചന പ്രതിനിധിപദത്തിന്റെ രൂപം നിലനിർത്തുന്നു; ഇത് വ്യക്തിയായ ആദാമിനെയും മനുഷ്യവർഗത്തെയും സൂചിപ്പിക്കാവുന്നതിനാൽ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: עַל הָאָרֶץ
  choice: ഭൂമിയിൽ
  rationale: സ്ഥാനാർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וּלְמִקְצֵה הַשָּׁמַיִם וְעַד קְצֵה הַשָּׁמָיִם
  choice: ആകാശത്തിന്റെ ഒരറ്റംമുതൽ മറ്റേ അറ്റംവരെ
  rationale: സമഗ്രമായ വ്യാപ്തി സൂചിപ്പിക്കുന്ന മെരിസത്തെ മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; ഹീബ്രായത്തിലെ ആവർത്തനം ഭാഗികമായി നിലനിർത്തുന്നു.
- source_word: הֲנִהְיָה
  choice: എപ്പോഴെങ്കിലും സംഭവിച്ചിട്ടുണ്ടോ
  rationale: ഇത്തരം സംഭവം ഒരിക്കലെങ്കിലും ഉണ്ടായിട്ടുണ്ടോ എന്ന വാചാടോപചോദ്യത്തിന്റെ കാലവ്യാപ്തിയും ശക്തിയും വ്യക്തമാക്കുന്നു.
- source_word: כַּדָּבָר הַגָּדוֹל הַזֶּה
  choice: ഇതുപോലൊരു മഹത്തായ കാര്യം
  rationale: דבר എന്ന പദത്തിന്റെ കാര്യം/സംഭവം എന്ന വിശാലത നിലനിർത്തുകയും הַגָּדוֹל എന്ന ഊന്നൽ ‘മഹത്തായ’ എന്നു പകർന്നുനൽകുകയും ചെയ്യുന്നു.
- source_word: הֲנִשְׁמַע כָּמֹהוּ
  choice: ഇതുപോലൊന്ന് എപ്പോഴെങ്കിലും കേട്ടിട്ടുണ്ടോ
  rationale: നിഫാൽ രൂപത്തിന്റെ ‘കേൾക്കപ്പെട്ടിട്ടുണ്ടോ/വാർത്തയായിട്ടുണ്ടോ’ എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിലെ കർത്തരിപ്രയോഗത്തിലൂടെ പകർന്നുനൽകുന്നു.
theological_decisions:
- issue: സൃഷ്ടിസന്ദർഭത്തിലെ אָדָם എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മനുഷ്യനെ
  alternative: മനുഷ്യവർഗത്തെ; ആദാമിനെ
  rationale: ഹീബ്രായ പദം ഏകവചനത്തിലാണെങ്കിലും സൃഷ്ടിസന്ദർഭത്തിൽ മനുഷ്യരാശിയെ പ്രതിനിധീകരിക്കാം. ‘മനുഷ്യനെ’ എന്നത് ഏകവചനരൂപവും പ്രതിനിധ്യസാധ്യതയും ഒരുമിച്ച് നിലനിർത്തുന്നു; ‘മനുഷ്യവർഗം’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു. ‘ആദാം’ എന്നു മാത്രം നൽകിയാൽ സന്ദർഭത്തിലെ വിശാലമായ മനുഷ്യചരിത്രപരമായ സൂചന അനാവശ്യമായി ചുരുങ്ങാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘ചോദിച്ചറിയുക’ എന്നത് ചരിത്രത്തെക്കുറിച്ചുള്ള അന്വേഷണത്തിന്റെ ശക്തി നൽകുന്നു; രണ്ട് വാചാടോപചോദ്യങ്ങളും വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു.
