  register: ആധുനികവും മാന്യവും പൊതുവായ വായനക്കാർക്ക് വ്യക്തവുമായ നിയമവിവരണ ശൈലി. വാക്യം മുൻവാക്യത്തിലെ പട്ടണങ്ങളെ വേർതിരിച്ചതുമായി വ്യാകരണപരമായി ബന്ധപ്പെടുന്നതിനാൽ മലയാളത്തിൽ ‘അവയെ വേർതിരിച്ചത്’ വ്യക്തമാക്കി ചേർത്തിരിക്കുന്നു.
