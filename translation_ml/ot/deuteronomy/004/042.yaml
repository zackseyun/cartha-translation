  text: so that a manslayer who kills his neighbor unintentionally[a], without knowledge, and was not hating him previously[b], may flee there to one of these cities and live.
translation:
  language: ml
  text: അബദ്ധത്തിൽ[a] തന്റെ അയൽക്കാരനെ കൊല്ലുകയും മുമ്പ് അവനോട് വൈരമില്ലാതിരിക്കുകയും ചെയ്തവന് ഈ പട്ടണങ്ങളിലൊന്നിലേക്ക് ഓടിപ്പോയി ജീവിച്ചിരിക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘അറിവില്ലാതെ’; ഈ നിയമസന്ദർഭത്തിൽ അറിയാതെയോ മനഃപൂർവമല്ലാതെയോ എന്നാണ് അർഥം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָנֻס שָׁמָּה
  choice: അവിടേക്ക് ഓടിച്ചെന്ന് ... അഭയം പ്രാപിച്ചു
  rationale: לָനֻס എന്നത് അവിടേക്ക് ഓടിപ്പോകാനുള്ള ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു. അഭയനഗരങ്ങളുടെ നിയമസന്ദർഭത്തിൽ ലക്ഷ്യം വ്യക്തമാക്കാൻ ‘അഭയം പ്രാപിച്ചു’ ചേർത്തിരിക്കുന്നു.
- source_word: רוֹצֵחַ אֲשֶׁר יִרְצַח
  choice: കൊല്ലുന്നവൻ
  rationale: ഇവിടെ മനഃപൂർവ കൊലപാതകി എന്ന കുറ്റനിർണയം ഇല്ല; ഒരാളുടെ മരണത്തിന് കാരണമായ വ്യക്തിയെയാണ് നിയമപരമായി സൂചിപ്പിക്കുന്നത്. അതിനാൽ ‘കൊലപാതകി’ ഒഴിവാക്കി.
- source_word: רֵעֵהוּ
  choice: തന്റെ അയൽക്കാരനെ
  rationale: רֵעַ എന്ന ബന്ധപദത്തിന്റെ സാധാരണ അർഥം നിലനിർത്തുന്നു.
- source_word: בִּבְלִי דַעַת
  choice: അബദ്ധത്തിൽ
  rationale: അക്ഷരാർഥം ‘അറിവില്ലാതെ’; ഈ നിയമസന്ദർഭത്തിൽ അറിയാതെയോ മനഃപൂർവമല്ലാതെയോ സംഭവിച്ച കൊലയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וְהוּא לֹא שֹׂנֵא לוֹ מִתְּמוֹל שִׁלְשׁוֹם
  choice: മുമ്പ് അവനോടു വൈരമില്ലാതിരുന്നവൻ
  rationale: ശത്രുതയുടെ തുടർച്ചയായ അഭാവവും ‘ഇന്നലെയോ മിനിഞ്ഞാന്നോ മുതൽ’ എന്ന ഹീബ്രായ പ്രയോഗത്തിന്റെ ‘മുമ്പ്’ എന്ന സ്വാഭാവിക അർഥവും പ്രകടമാക്കുന്നു.
- source_word: אֶל אַחַת מִן הֶעָרִים הָאֵל
  choice: ഈ പട്ടണങ്ങളിലൊന്നിൽ
  rationale: ഹീബ്രായ സൂചകപദത്തിന്റെ സമീപസൂചന ‘ഈ’ എന്നായി നിലനിർത്തുന്നു.
- source_word: וָחָי
  choice: ജീവനോടിരിക്കേണ്ടതിന്
  rationale: വിജയകരമായി അഭയം തേടുന്നതിന്റെ ഫലമായി ജീവൻ സംരക്ഷിക്കപ്പെടുന്നതിനെ സ്വാഭാവിക മലയാളത്തിൽ പറയുന്നു.
