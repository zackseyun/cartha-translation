- from: അബദ്ധത്തിൽ[a] തന്റെ അയൽക്കാരനെ കൊല്ലുന്നവൻ—മുമ്പ് അവനോടു വൈരമില്ലാതിരുന്നവൻ[b]—അവിടേക്ക് ഓടിച്ചെന്ന് ഈ പട്ടണങ്ങളിലൊന്നിൽ അഭയം പ്രാപിച്ചു ജീവനോടിരിക്കേണ്ടതിനാണ് അവയെ വേർതിരിച്ചത്.
