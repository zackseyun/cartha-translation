reference: Deuteronomy 4:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹ֣א תֹסִ֗פוּ עַל הַ/דָּבָר֙ אֲשֶׁ֤ר אָנֹכִי֙ מְצַוֶּ֣ה אֶתְ/כֶ֔ם וְ/לֹ֥א תִגְרְע֖וּ מִמֶּ֑/נּוּ לִ/שְׁמֹ֗ר אֶת מִצְוֺת֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם אֲשֶׁ֥ר אָנֹכִ֖י מְצַוֶּ֥ה אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/002.yaml
  text: You shall not add to the word that I am commanding you[a], nor shall you take away from it, so that you may keep the commandments of Yahweh your God that I am commanding you.
translation:
  language: ml
  text: ഞാൻ നിങ്ങളോടു കല്പിക്കുന്ന വചനത്തോടു നിങ്ങൾ ഒന്നും കൂട്ടിച്ചേർക്കരുത്; അതിൽനിന്ന് ഒന്നും കുറയ്ക്കരുത്. ഞാൻ നിങ്ങളോടു കല്പിക്കുന്ന നിങ്ങളുടെ ദൈവമായ യാഹ്‌വെയുടെ[a] കല്പനകൾ നിങ്ങൾ പാലിക്കേണ്ടതിന് അങ്ങനെ ചെയ്യുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ YHWH; ഈ ദൈവനാമത്തിന്റെ പുനർനിർമിച്ച ഉച്ചാരണം ‘യാഹ്‌വെ’ എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: תֹסִפוּ עַל
  choice: കൂട്ടിച്ചേർക്കരുത്
  rationale: ഹിഫീൽ രൂപവും עַל എന്ന ബന്ധപദവും ചേർന്ന് ഒരു കാര്യത്തോട് അധികമായി ചേർക്കുക എന്ന അർഥം നൽകുന്നു. മലയാളത്തിൽ ‘കൂട്ടിച്ചേർക്കുക’ ഈ നിരോധനം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: הַדָּבָר
  choice: വചനം
  rationale: דבר ഇവിടെ മോശെയുടെ കല്പനയുടെ ഉള്ളടക്കത്തെ ഏകവചനത്തിൽ ഒരു സമഗ്രഘടകമായി സൂചിപ്പിക്കുന്നു. ‘വചനം’ അതിന്റെ വാചികവും അധികാരപരവുമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: מְצַוֶּה
  choice: കല്പിക്കുന്ന
  rationale: വർത്തമാന കൃദന്തരൂപം സംസാരിക്കുന്ന ഈ സന്ദർഭത്തിലെ തുടരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘കല്പിക്കുന്ന’ അത് മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: תִגְרְעוּ מִמֶּנּוּ
  choice: അതിൽനിന്ന് ഒന്നും കുറയ്ക്കരുത്
  rationale: גרע എന്നത് കുറയ്ക്കുക അഥവാ എടുത്തുകളയുക എന്നാണ്. ‘കുറയ്ക്കരുത്’ എന്നത് ‘കൂട്ടിച്ചേർക്കരുത്’ എന്നതിനോടുള്ള വിരുദ്ധസമാന്തരത വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: לִשְׁמֹר
  choice: അങ്ങനെ ... പാലിക്കണം
  rationale: ל സഹിതമുള്ള അനന്തക്രിയ ഇവിടെ ഉദ്ദേശ്യമോ ഫലമോ സൂചിപ്പിക്കുന്നു. ‘അങ്ങനെ’ ബന്ധം വ്യക്തമാക്കുമ്പോൾ ഉദ്ദേശ്യവും ഫലവും തമ്മിലുള്ള സാധ്യത പൂർണമായി അടച്ചുപൂട്ടുന്നില്ല.
- source_word: מִצְוֺת
  choice: കല്പനകൾ
  rationale: നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ സന്ദർഭത്തിൽ מצות എന്ന ബഹുവചനത്തിന് മലയാളത്തിലെ പതിവും ഗൗരവമുള്ളതുമായ തത്തുല്യം ‘കല്പനകൾ’ ആണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ ദൈവനാമമായ יהוה-യുടെ സുപരിചിതമായ ലിപ്യന്തരണം ‘യഹോവ’യാണ്; ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ വ്യക്തിനാമം നിലനിർത്തുന്നു.
- source_word: אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവം
  rationale: യഹോവയോടൊപ്പമുള്ള ഉടമ്പടി സൂത്രവാക്യത്തിൽ אֱלֹהִים ഏകവചന അർഥത്തിലാണ്; അതിനാൽ ‘നിങ്ങളുടെ ദൈവം’ യോജിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ; കർത്താവ്
  rationale: മൂലപാഠം ചതുരക്ഷര ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. മലയാളത്തിൽ പൊതുവേ പരിചിതമായ ‘യഹോവ’ വ്യക്തിനാമം നിലനിർത്തുന്നു; ‘കർത്താവ്’ എന്ന പദവി ഉപയോഗിച്ചിട്ടില്ല. ഉച്ചാരണത്തിന്റെ പുനർനിർമ്മാണമായി ‘യാഹ്‌വെ’യും സാധ്യമാണ്.
- issue: לִשְׁמֹר എന്നതിലെ ബന്ധം
  choice: അങ്ങനെ ... പാലിക്കണം
  alternative: പാലിക്കേണ്ടതിന്; പാലിക്കുവാൻ
  rationale: ഈ അനന്തക്രിയയെ ഉദ്ദേശ്യമായോ ഫലമായോ ഗ്രഹിക്കാം. ‘അങ്ങനെ’ ഈ ആശയബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും അമിതമായി നിർണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ കല്പനാശൈലി സ്വീകരിച്ചു. ബഹുവചന അഭിസംബോധന നിലനിർത്തി. മൂലത്തിലെ ഏകവചനമായ ‘വചനം’ സംരക്ഷിക്കുകയും കൂട്ടുക/കുറയ്ക്കുക എന്ന സമാന്തരത വ്യക്തമാക്കുകയും ചെയ്തു. ദൈവനാമത്തെക്കുറിച്ചുള്ള അടിക്കുറിപ്പ് [a] മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
