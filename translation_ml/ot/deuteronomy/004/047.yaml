base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/047.yaml
  text: and they took possession of his land[a], and the land of Og king of Bashan—the two kings of the Amorites who were beyond the Jordan[b], toward the sunrise.
translation:
  language: ml
  text: 'അവർ യോർദ്ദാനക്കരയിൽ[a], സൂര്യോദയദിക്കുള്ള[b] അമോര്യരുടെ രണ്ടു രാജാക്കന്മാരുടെ ദേശങ്ങൾ കൈവശപ്പെടുത്തി: അവന്റെ ദേശവും ബാശാൻ രാജാവായ ഓഗിന്റെ ദേശവും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “യോർദ്ദാന്റെ മറുകരയിൽ” അല്ലെങ്കിൽ “യോർദ്ദാനക്കപ്പുറം.” എബ്രായപ്രയോഗം ഭൂമിശാസ്ത്രപരമായ ഒരു പതിവുപ്രയോഗമാണ്; ഏത് വശത്തുനിന്നുള്ള കാഴ്ചപ്പാടാണ് എന്നതനുസരിച്ച് അതിന്റെ കൃത്യമായ സൂചന മാറാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ “സൂര്യോദയത്തിലേക്ക്”; അതായത്, കിഴക്കോട്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְשׁוּ
  choice: കൈവശപ്പെടുത്തി
  rationale: ജയിച്ചടക്കലിന്റെ പശ്ചാത്തലത്തിൽ ירשׁ എന്ന ക്രിയ ദേശം പിടിച്ചടക്കി അധീനമാക്കുക എന്ന അർഥം നൽകുന്നു; ‘കൈവശപ്പെടുത്തി’ ഈ ആശയം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אַרְצוֹ
  choice: അവന്റെ ദേശം
  rationale: മുൻസന്ദർഭത്തിലെ സീഹോനെയാണ് ഏകവചന പുരുഷലിംഗ പ്രത്യയം സൂചിപ്പിക്കുന്നത്; എബ്രായരൂപത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
- source_word: אֶרֶץ עוֹג מֶלֶךְ הַבָּשָׁן
  choice: ബാശാൻരാജാവായ ഓഗിന്റെ ദേശം
  rationale: എബ്രായ ഘടനയിലെ ബന്ധം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: שְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: അമോര്യരുടെ രണ്ടു രാജാക്കന്മാർ
  rationale: സീഹോനെയും ഓഗിനെയും അമോര്യരുടെ രാജാക്കന്മാരായി കൂട്ടായി തിരിച്ചറിയിക്കുന്ന എബ്രായ ഘടന സംരക്ഷിക്കുന്നു.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: യോർദ്ദാനക്കരെ
  rationale: നിരീക്ഷണസ്ഥാനത്തെ ആശ്രയിച്ച് ‘യോർദ്ദാന്റെ മറുകരയിൽ’ എന്ന അർഥം നൽകുന്ന പതിവ് ഭൂമിശാസ്ത്രപ്രയോഗത്തിന്റെ കാഴ്ചപ്പാട് അനാവശ്യമായി നിർണയിക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: מִזְרַח שָׁמֶשׁ
  choice: സൂര്യോദയദിക്കിലുള്ള
  rationale: കിഴക്കുദിക്കിനെ സൂചിപ്പിക്കുന്നതോടൊപ്പം എബ്രായത്തിലെ സൂര്യോദയത്തിന്റെ മൂർത്തമായ ദൃശ്യവും നിലനിർത്തുന്നു.
