revisions:
- from: അവർ അവന്റെ ദേശവും ബാശാൻരാജാവായ ഓഗിന്റെ ദേശവും കൈവശപ്പെടുത്തി. യോർദ്ദാനക്കരെ, സൂര്യോദയദിക്കിലുള്ള[a] അമോര്യരുടെ രണ്ടു രാജാക്കന്മാരുടെ ദേശങ്ങളായിരുന്നു അവ.
  to: 'അവർ യോർദ്ദാനക്കരയിൽ[a], സൂര്യോദയദിക്കുള്ള[b] അമോര്യരുടെ രണ്ടു രാജാക്കന്മാരുടെ ദേശങ്ങൾ കൈവശപ്പെടുത്തി: അവന്റെ ദേശവും ബാശാൻ രാജാവായ ഓഗിന്റെ ദേശവും.'
  rationale: 'The revision retains the Hebrew territorial-conquest sense and the contextual reference of ‘his’ to Sihon, while expressing the verse''s apposition in idiomatic Malayalam: the two named territories are the territories of the two Amorite kings. It also preserves the deliberate viewpoint ambiguity of בְּעֵבֶר הַיַּרְדֵּן and supplies properly anchored notes for both geographical expressions.'
