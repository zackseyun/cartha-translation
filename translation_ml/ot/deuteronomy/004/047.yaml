translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. നീണ്ട എബ്രായവാക്യം വായനാസൗകര്യത്തിനായി രണ്ടു വാക്യങ്ങളാക്കി; രണ്ടാമത്തെ വാക്യം ആദ്യത്തേതിലെ രണ്ടു ദേശങ്ങളെയും വിശദീകരിക്കുന്നു. യോർദ്ദാനുമായി ബന്ധപ്പെട്ട ഭൂമിശാസ്ത്രപ്രയോഗത്തിന്റെ ദൃഷ്ടികോണപരമായ അസ്പഷ്ടത ‘യോർദ്ദാനക്കരെ’ എന്നതിലൂടെ നിലനിർത്തി.
