id: DEU.28.53
reference: Deuteronomy 28:53
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אָכַלְתָּ֣ פְרִֽי בִטְנְ/ךָ֗ בְּשַׂ֤ר בָּנֶ֨י/ךָ֙ וּ/בְנֹתֶ֔י/ךָ אֲשֶׁ֥ר נָֽתַן לְ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ בְּ/מָצוֹר֙ וּ/בְ/מָצ֔וֹק אֲשֶׁר יָצִ֥יק לְ/ךָ֖ אֹיְבֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/053.yaml
  text: And you will eat the fruit of your womb[a], the flesh of your sons and daughters whom Yahweh your God has given you[b], in the siege and in the distress with which your enemy will oppress you.
translation:
  language: ml
  text: നിന്റെ ശത്രു നിന്നെ ഞെരുക്കുന്ന ഉപരോധത്തിലും ദുരിതത്തിലും[b], നിന്റെ ഉദരഫലമായ[a]—നിന്റെ ദൈവമായ യഹോവ നിനക്കു നൽകിയ പുത്രന്മാരുടെയും പുത്രിമാരുടെയും മാംസം—നീ തിന്നും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിന്റെ ശരീരത്തിൽനിന്നുള്ള സന്തതി.’ എബ്രായത്തിൽ അക്ഷരാർഥമായി ‘നിന്റെ ഉദരത്തിന്റെ ഫലം.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഞെരുക്കത്തിൽ’ അല്ലെങ്കിൽ ‘കഠിനവ്യാകുലതയിൽ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָכַלְתָּ
  choice: നീ തിന്നും
  rationale: ശാപപ്രഖ്യാപനത്തിന്റെ പശ്ചാത്തലത്തിൽ സംയോജകാക്ഷരത്തോടുകൂടിയ ഖാൽ പൂർണ്ണക്രിയ ഭാവിയെ സൂചിപ്പിക്കുന്നു; ആ പ്രവചനാത്മക ബലം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: פְרִי בִטְנְךָ
  choice: നിന്റെ ഉദരഫലം
  rationale: മക്കളെ സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം നിലനിർത്തുന്നു. തുടർന്നുള്ള ‘പുത്രന്മാരുടെയും പുത്രിമാരുടെയും മാംസം’ എന്ന സമാനാർഥപ്രയോഗം അതിന്റെ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: בְּשַׂר
  choice: മാംസം
  rationale: മനുഷ്യശരീരത്തിന്റെ മാംസത്തെക്കുറിച്ചുള്ള വാക്യത്തിന്റെ ഭയാനകവും നേരിട്ടുള്ളതുമായ അർഥം കൃത്യമായി നൽകുന്നു.
- source_word: בָּנֶיךָ וּבְנֹתֶיךָ
  choice: നിന്റെ പുത്രന്മാരുടെയും പുത്രിമാരുടെയും
  rationale: എബ്രായപാഠം ആൺമക്കളെയും പെൺമക്കളെയും പ്രത്യേകം പരാമർശിക്കുന്നതിനാൽ രണ്ടും നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר נָתַן לְךָ יְהוָה אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ യഹോവ നിനക്കു നൽകിയ
  rationale: മക്കൾ ദൈവം നൽകിയവരാണെന്ന ഉടമ്പടിസംബന്ധമായ ഓർമപ്പെടുത്തൽ നിലനിർത്തുകയും വിധിയുടെ ഭീകരത വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: എബ്രായ ദൈവനാമം ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ മലയാളത്തിലെ സുപരിചിതമായ ലിപ്യന്തരണത്തിൽ നൽകുന്നു.
- source_word: בְּמָצוֹר
  choice: ഉപരോധത്തിൽ
  rationale: ശത്രുസൈന്യം ഒരു സ്ഥലത്തെ വളഞ്ഞടയ്ക്കുന്ന അവസ്ഥയെ കൃത്യമായി സൂചിപ്പിക്കുന്നു.
- source_word: וּבְמָצוֹק
  choice: ദുരിതത്തിൽ
  rationale: ഉപരോധം സൃഷ്ടിക്കുന്ന കടുത്ത ഞെരുക്കത്തെയും കഷ്ടാവസ്ഥയെയും ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: אֲשֶׁר יָצִיק לְךָ אֹיְבֶךָ
  choice: നിന്റെ ശത്രു നിന്നെ ഞെരുക്കുന്ന
  rationale: ഹിഫിൽ ക്രിയയിലെ അമർത്തുക, ഇടുക്കത്തിലാക്കുക, പീഡിപ്പിക്കുക എന്നീ അർഥസാധ്യതകൾ ‘ഞെരുക്കുക’ എന്ന പദം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തമായി വരുന്ന ഉടമ്പടിനാമത്തെ ഒരു പദവിയാൽ പകരാതെ പേരായിത്തന്നെ നിലനിർത്തുന്നു.
- issue: ഉപരോധകാലത്തെ നരഭോജനത്തെ രൂപകമാക്കണോ എന്നത്
  choice: മക്കളുടെ മാംസം തിന്നും എന്ന നേരിട്ടുള്ള അർഥം
  alternative: അതിയായ ദാരിദ്ര്യത്തിനുള്ള പൊതുവായ രൂപകം
  rationale: בְּשַׂר എന്ന ‘മാംസം’ എന്ന പദവും പുത്രന്മാരെയും പുത്രിമാരെയും വ്യക്തമായി പറയുന്നതും അക്ഷരാർഥത്തിലുള്ള ഭീകരഫലത്തെയാണ് അവതരിപ്പിക്കുന്നത്; പാഠത്തിന്റെ കാഠിന്യം മയപ്പെടുത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള പ്രവചനശൈലി. എബ്രായത്തിലെ സമാനാർഥ apposition വ്യക്തമാക്കാൻ ദീർഘവിരാമങ്ങൾ ഉപയോഗിച്ചു. ‘ഉദരഫലം’ എന്ന മൂലരൂപകം നിലനിർത്തിയെങ്കിലും അടിക്കുറിപ്പിൽ കൂടുതൽ സുതാര്യമായ അർഥം നൽകി; വാക്യത്തിന്റെ ഞെട്ടിപ്പിക്കുന്ന കാഠിന്യം മയപ്പെടുത്തിയിട്ടില്ല.
