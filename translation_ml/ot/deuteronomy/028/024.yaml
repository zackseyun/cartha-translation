  variant: modern standard Malayalam
source:
  edition: WLC
  text: יִתֵּ֧ן יְהוָ֛ה אֶת מְטַ֥ר אַרְצְ/ךָ֖ אָבָ֣ק וְ/עָפָ֑ר מִן הַ/שָּׁמַ֨יִם֙ יֵרֵ֣ד עָלֶ֔י/ךָ עַ֖ד הִשָּׁמְדָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/024.yaml
  text: Yahweh will make the rain of your land dust and powder[a]; from the heavens it will come down on you until you are destroyed.
translation:
  language: ml
  text: യാഹ്‌വെ നിന്റെ ദേശത്തിനു മഴയായി പൊടിയും മൺതരിയും നൽകും; നീ നശിച്ചുപോകുന്നതുവരെ അത് ആകാശത്തുനിന്ന് നിന്റെമേൽ പെയ്തിറങ്ങും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ ഉടമ്പടിനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായി നിലനിർത്തുന്നു.
- source_word: יִתֵּן
  choice: ആക്കും
  rationale: പദത്തിന്റെ അടിസ്ഥാനാർഥം ‘കൊടുക്കും’ എന്നാണെങ്കിലും, ഇവിടെ മഴയ്ക്കുപകരം പൊടിയും മൺതരിയും ഉണ്ടാകുമെന്ന കാരണാത്മക ആശയം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: מְטַר אַרְצְךָ
  choice: നിന്റെ ദേശത്തെ മഴയെ
  rationale: ദേശവുമായി മഴയ്ക്കുള്ള ബന്ധം നിലനിർത്തുകയും തുടർന്നുള്ള ‘ആക്കും’ എന്ന ക്രിയയോട് സ്വാഭാവികമായി ചേരുകയും ചെയ്യുന്നു.
- source_word: אָבָק
  choice: പൊടി
  rationale: വരണ്ട സൂക്ഷ്മകണങ്ങളെ സൂചിപ്പിക്കുന്ന സാധാരണവും വ്യക്തവുമായ മലയാളപദം.
- source_word: וְעָפָר
  choice: മൺതരി
  rationale: אָבָק എന്ന ‘പൊടി’യിൽനിന്നുള്ള ചെറിയ വ്യത്യാസം നിലനിർത്തിക്കൊണ്ട് വരണ്ട മണ്ണിന്റെ കണങ്ങൾ എന്ന ദൃശ്യബിംബം നൽകുന്നു.
- source_word: מִן הַשָּׁמַיִם
  choice: ആകാശത്തുനിന്ന്
  rationale: എബ്രായത്തിലെ രൂപം ബഹുവചനമാണെങ്കിലും, ഈ സാഹചര്യത്തിൽ സ്വാഭാവികമായ ആധുനിക മലയാള സമാനപദം ‘ആകാശത്തുനിന്ന്’ ആണ്.
- source_word: יֵרֵד עָלֶיךָ
  choice: നിന്റെമേൽ പെയ്തിറങ്ങും
  rationale: മഴയ്ക്കുപകരമുള്ള പൊടിയും മൺതരിയും മുകളിൽനിന്ന് താഴേക്കു വരുന്നതെന്ന പരിഹാസാത്മക ദൃശ്യബിംബം മലയാളത്തിൽ സജീവമായി നിലനിർത്തുന്നു.
- source_word: עַד הִשָּׁמְדָךְ
  choice: നീ നശിച്ചുപോകുന്നതുവരെ
  rationale: എബ്രായത്തിലെ സംക്ഷിപ്തമായ അന്ത്യപരിധി വ്യക്തമാക്കുന്നു; പറയാത്ത കർത്താവിനെ അനാവശ്യമായി ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ഉടമ്പടിനാമമായ יְהוָהയുടെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ
  rationale: പേരിനെ ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരാക്കി മാറ്റാതെ സംരക്ഷിക്കുന്നു; മലയാള ബൈബിൾ വായനയിൽ സുപരിചിതമായ രൂപം ഉപയോഗിക്കുന്നു.
- issue: നാശത്തിന്റെ കർത്താവ്
  choice: നീ നശിച്ചുപോകുന്നതുവരെ
  alternative: അവൻ നിന്നെ നശിപ്പിക്കുന്നതുവരെ
  rationale: ഹീബ്രു പ്രയോഗം ഇവിടെ കർത്താവിനെ തുറന്നുപറയുന്നില്ല; അതിനാൽ കർമണ/അകർതൃസദൃശ രൂപം ഉപയോഗിച്ച് ഉറവിടത്തിലെ സംക്ഷിപ്തതയും തുറന്ന നിലയും കാത്തുസൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘പെയ്തിറങ്ങും’ എന്ന പ്രയോഗം മഴയുടെ വിപരീതദൃശ്യത്തെ നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
