  variant: modern standard Malayalam
source:
  edition: WLC
  text: יִפְתַּ֣ח יְהוָ֣ה לְ֠/ךָ אֶת אוֹצָר֨/וֹ הַ/טּ֜וֹב אֶת הַ/שָּׁמַ֗יִם לָ/תֵ֤ת מְטַֽר אַרְצְ/ךָ֙ בְּ/עִתּ֔/וֹ וּ/לְ/בָרֵ֕ךְ אֵ֖ת כָּל מַעֲשֵׂ֣ה יָדֶ֑/ךָ וְ/הִלְוִ֨יתָ֙ גּוֹיִ֣ם רַבִּ֔ים וְ/אַתָּ֖ה לֹ֥א תִלְוֶֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/012.yaml
  text: Yahweh will open to you his good storehouse[a], the heavens, to give the rain of your land in its season and to bless all the work of your hand. You will lend to many nations, but you will not borrow.
translation:
  language: ml
  text: യഹ്‌വേ നിനക്കുവേണ്ടി തന്റെ നല്ല ഭണ്ഡാരമായ ആകാശം[a] തുറന്ന്, നിന്റെ ദേശത്തിന് അതിന്റെ സമയത്ത് മഴ നൽകുകയും നിന്റെ കൈയുടെ സകല പ്രവൃത്തിയെയും അനുഗ്രഹിക്കുകയും ചെയ്യും. നീ അനേകം ജനതകൾക്ക് കടം കൊടുക്കും; എന്നാൽ നീ കടം വാങ്ങുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, «തന്റെ നല്ല കലവറ». ഹീബ്രു പദത്തിന് ഭണ്ഡാരം എന്നും കലവറ എന്നും അർഥമുണ്ടാകാം; മഴയുടെയും വിളവിന്റെയും പശ്ചാത്തലത്തിൽ «കലവറ» യോജിച്ച വായനയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവത്തിന്റെ ഉടമ്പടിനാമത്തെ പദവിയാക്കി മാറ്റാതെ, ഹീബ്രു നാമത്തിന്റെ അംഗീകൃത മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: יִפְתַּח
  choice: തുറന്ന് ... ചെയ്യും
  rationale: അനുഗ്രഹപ്രഖ്യാപനത്തിലെ ഭാവികാലബലം നിലനിർത്തുകയും കലവറ തുറക്കുന്നതെന്ന മൂർത്തമായ രൂപകം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: אוֹצָרוֹ הַטּוֹב אֶת הַשָּׁמַיִם
  choice: തന്റെ നല്ല കലവറയായ ആകാശത്തെ
  rationale: ആകാശം തന്നെയാണ് നല്ല കലവറയെന്ന് വ്യക്തമാക്കുന്ന ഹീബ്രു സമാനാധികരണബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; മഴയുടെ പശ്ചാത്തലത്തിൽ ‘കലവറ’ യോജിക്കുന്നു.
- source_word: לָתֵת מְטַר אַרְצְךָ בְּעִתּוֹ
  choice: നിന്റെ ദേശത്തിനുള്ള മഴ അതതിന്റെ കാലത്ത് നൽകുകയും
  rationale: മഴയും ദേശവും തമ്മിലുള്ള ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ഏകവചന പ്രത്യയം മഴയുടെ യുക്തമായ കാലത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: כָּל מַעֲשֵׂה יָדֶךָ
  choice: നിന്റെ കൈയുടെ സകല പ്രവൃത്തിയെയും
  rationale: ‘കൈയുടെ പ്രവൃത്തി’ എന്ന ഹീബ്രു പ്രയോഗവും ഏകവചനമായ ‘കൈ’യും ഔപചാരികമായി നിലനിർത്തുന്നു.
- source_word: וְהִלְוִיתָ גּוֹיִם רַבִּים
  choice: നീ അനേകം ജനതകൾക്ക് കടം കൊടുക്കും
  rationale: ഹിഫീൽ രൂപത്തിന്റെ ‘കടം കൊടുക്കുക’ എന്ന കാരകാർഥവും ദേശീയ പശ്ചാത്തലത്തിലെ גּוֹיִם എന്നതിന്റെ അർഥവും കൃത്യമായി നൽകുന്നു.
- source_word: וְאַתָּה לֹא תִלְוֶה
  choice: എന്നാൽ നീ കടം വാങ്ങുകയില്ല
  rationale: ഖാൽ രൂപത്തിന്റെ ‘കടം വാങ്ങുക’ എന്ന അർഥം നൽകുകയും മുൻവാക്യത്തോടുള്ള വൈരുധ്യം ‘എന്നാൽ’ വഴി സ്വാഭാവികമായി പ്രകടമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമം നേരിട്ട് സംരക്ഷിക്കുന്നു; അതിനെ ഒരു പദവിയാൽ പകരുകയോ പ്രത്യേക മതപരമ്പരയുടെ രൂപം നിർബന്ധിക്കുകയോ ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. മൂലത്തിലെ കാർഷിക രൂപകവും കടം കൊടുക്കുക/വാങ്ങുക എന്ന പ്രതിവിരുദ്ധ ഘടനയും നിലനിർത്തിയിരിക്കുന്നു. പ്രസക്തമായ അനിശ്ചിതത്വം പ്രധാനവാചകത്തിൽ നഷ്ടപ്പെടുന്നില്ലാത്തതിനാൽ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
