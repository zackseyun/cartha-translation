revisions:
- from: യഹ്‌വേ നിനക്കായി തന്റെ നല്ല കലവറയായ ആകാശത്തെ തുറന്ന്, നിന്റെ ദേശത്തിനുള്ള മഴ അതതിന്റെ കാലത്ത് നൽകുകയും നിന്റെ കൈയുടെ സകല പ്രവൃത്തിയെയും അനുഗ്രഹിക്കുകയും ചെയ്യും. നീ അനേകം ജനതകൾക്ക് കടം കൊടുക്കും; എന്നാൽ നീ കടം വാങ്ങുകയില്ല.
  to: യഹ്‌വേ നിനക്കുവേണ്ടി തന്റെ നല്ല ഭണ്ഡാരമായ ആകാശം[a] തുറന്ന്, നിന്റെ ദേശത്തിന് അതിന്റെ സമയത്ത് മഴ നൽകുകയും നിന്റെ കൈയുടെ സകല പ്രവൃത്തിയെയും അനുഗ്രഹിക്കുകയും ചെയ്യും. നീ അനേകം ജനതകൾക്ക് കടം കൊടുക്കും; എന്നാൽ നീ കടം വാങ്ങുകയില്ല.
  rationale: 'The revision retains the Hebrew imagery and syntax while improving Malayalam idiom: Yahweh opens the heavens, his good treasury/storehouse, in order to provide rain for the land at the rain''s proper time and to bless all labor. The footnote preserves the source term''s lexical range.'
