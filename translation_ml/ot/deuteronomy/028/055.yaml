source:
  edition: WLC
  text: מִ/תֵּ֣ת לְ/אַחַ֣ד מֵ/הֶ֗ם מִ/בְּשַׂ֤ר בָּנָי/ו֙ אֲשֶׁ֣ר יֹאכֵ֔ל מִ/בְּלִ֥י הִשְׁאִֽיר ל֖/וֹ כֹּ֑ל בְּ/מָצוֹר֙ וּ/בְ/מָצ֔וֹק אֲשֶׁ֨ר יָצִ֥יק לְ/ךָ֛ אֹיִבְ/ךָ֖ בְּ/כָל שְׁעָרֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/055.yaml
  text: so that he will not give to any of them any of the flesh of his sons that he is eating[a], because he has nothing left[b], in the siege and in the distress with which your enemy will oppress you within all your gates.
translation:
  language: ml
  text: താൻ തിന്നുകൊണ്ടിരിക്കുന്ന തന്റെ പുത്രന്മാരുടെ[a] മാംസത്തിൽനിന്ന് അവരിൽ ആർക്കും അവൻ ഒട്ടും കൊടുക്കുകയില്ല; നിന്റെ ശത്രു നിന്റെ എല്ലാ കവാടങ്ങളിലും[b] നിന്നെ ഞെരുക്കുന്ന ഉപരോധത്തിലും കഷ്ടതയിലും അവന് ഒന്നും ശേഷിക്കാത്തതിനാൽ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘പുത്രന്മാർ’ എന്നാണ്; പൊതുവായ ‘മക്കൾ’ എന്നല്ല, ഇവിടെ പദം വ്യക്തമായി പുരുഷലിംഗത്തിലാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘എല്ലാ പട്ടണങ്ങളിലും’ എന്നും അർഥമാക്കാം; ജനങ്ങൾ താമസിക്കുന്ന പട്ടണങ്ങളെ സൂചിപ്പിക്കാൻ എബ്രായത്തിൽ ‘കവാടങ്ങൾ’ എന്ന പദം ഉപയോഗിക്കാറുണ്ട്.
    reason: cultural_note
lexical_decisions:
- source_word: מִתֵּת לְאַחַד מֵהֶם
  choice: അവരിൽ ആർക്കും അവൻ ഒട്ടും കൊടുക്കുകയില്ല
  rationale: מִן ചേർന്ന infinitive construct ഇവിടെ മുൻവാക്യത്തിലെ വിവരണം തുടരുകയും പങ്കുവെക്കാതിരിക്കുന്നതിനെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു. ‘ആർക്കും ... കൊടുക്കുകയില്ല’ എന്നത് വിതരണാർഥവും നിരാകരണവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘ഒട്ടും’ മാംസത്തിൽനിന്ന് ഒന്നുപോലും നൽകാത്തതിന്റെ തീവ്രത വ്യക്തമാക്കുന്നു.
- source_word: מִבְּשַׂר בָּנָיו
  choice: തന്റെ പുത്രന്മാരുടെ മാംസത്തിൽനിന്ന്
  rationale: בָּשָׂר എന്ന മൂർത്തമായ ‘മാംസം’ ഭീകരമായ സന്ദർഭത്തെ മയപ്പെടുത്താതെ നിലനിർത്തുന്നു. בָּנָיו ഇവിടെ പൊതുവായ ‘മക്കൾ’ എന്നതല്ല, വ്യക്തമായി പുരുഷലിംഗമായ ‘പുത്രന്മാർ’ എന്നാണ്.
- source_word: אֲשֶׁר יֹאכֵל
  choice: താൻ തിന്നുകൊണ്ടിരിക്കുന്ന
  rationale: അപൂർണക്രിയാരൂപം ഉപരോധദൃശ്യത്തിൽ നടന്നുകൊണ്ടിരിക്കുന്ന പ്രവൃത്തിയെ സജീവമായി അവതരിപ്പിക്കുന്നു. മലയാളത്തിലെ തുടർപ്രവൃത്തി രൂപം ഈ ദൃശ്യത നിലനിർത്തുന്നു.
- source_word: מִבְּלִי הִשְׁאִיר לוֹ כֹּל
  choice: അവന് ഒന്നും ശേഷിച്ചിട്ടില്ല
  rationale: വാചകം സമ്പൂർണ അഭാവത്തെയാണ് സൂചിപ്പിക്കുന്നത്. സന്ദർഭത്തിൽ പങ്കിടാതിരിക്കുന്നതിന്റെ കാരണമായി ഇത് വരുന്നതിനാൽ ‘കാരണം’ ചേർത്ത് ബന്ധം സ്വാഭാവികമാക്കി.
- source_word: בְּמָצוֹר וּבְמָצוֹק
  choice: ഉപരോധത്തിലും കഷ്ടതയിലും
  rationale: מָצוֹר എന്നത് സൈനിക ഉപരോധവും מָצוֹק അതുമൂലമുള്ള കടുത്ത ഞെരുക്കമോ കഷ്ടതയുമാണ്. രണ്ടും വേർതിരിച്ച്, എന്നാൽ സ്വാഭാവികമായ കൂട്ടുപദങ്ങളായി നൽകിയിരിക്കുന്നു.
- source_word: אֲשֶׁר יָצִיק לְךָ אֹיִבְךָ
  choice: നിന്റെ ശത്രു ... നിന്നെ ഞെരുക്കുന്ന
  rationale: צוּק എന്ന ക്രിയയുടെ അമർത്തുക, കടുത്ത ദുരിതത്തിലാക്കുക എന്ന ശക്തി ‘ഞെരുക്കുന്ന’ നിലനിർത്തുന്നു; ഉപരോധസന്ദർഭത്തിൽ ഇത് ശാരീരികവും സാഹചര്യപരവുമായ സമ്മർദം ഉൾക്കൊള്ളുന്നു.
- source_word: בְּכָל שְׁעָרֶיךָ
  choice: നിന്റെ എല്ലാ കവാടങ്ങളിലും
  rationale: എബ്രായത്തിലെ ‘കവാടങ്ങൾ’ എന്ന പ്രതീകം മുഖ്യവാചകത്തിൽ നിലനിർത്തി. സന്ദർഭത്തിൽ അത് കവാടങ്ങളുള്ള പട്ടണങ്ങളെയോ നഗരങ്ങളെയോ പ്രതിനിധീകരിക്കാം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഉപരോധകാലത്തെ ഭീകരത മയപ്പെടുത്താതെ ‘മാംസം’, ‘തിന്നുകൊണ്ടിരിക്കുന്ന’ എന്നീ മൂർത്തപദങ്ങൾ നിലനിർത്തി. മൂലത്തിലെ നഗരകവാടങ്ങളുടെ ദൃശ്യപ്രതീകം മുഖ്യവാചകത്തിലും അതിന്റെ സ്ഥാനാർഥം അടിക്കുറിപ്പിലും നൽകിയിരിക്കുന്നു.
