  naturalness: നിലവിലെ വാചകം ഗ്രഹിക്കാവുന്നതാണ്. എന്നിരുന്നാലും, കാരണവാക്യത്തെ ‘...കഷ്ടതയിൽ അവന് ഒന്നും ശേഷിക്കാത്തതിനാൽ’ എന്ന് ക്രമപ്പെടുത്തുന്നത് മലയാളത്തിൽ കൂടുതൽ സുഗമവും ബന്ധസൂചകവുമാണ്.
