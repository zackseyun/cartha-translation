source:
  edition: WLC
  text: וְ֠/הָיָה כַּ/אֲשֶׁר שָׂ֨שׂ יְהוָ֜ה עֲלֵי/כֶ֗ם לְ/הֵיטִ֣יב אֶתְ/כֶם֮ וּ/לְ/הַרְבּ֣וֹת אֶתְ/כֶם֒ כֵּ֣ן יָשִׂ֤ישׂ יְהוָה֙ עֲלֵי/כֶ֔ם לְ/הַאֲבִ֥יד אֶתְ/כֶ֖ם וּ/לְ/הַשְׁמִ֣יד אֶתְ/כֶ֑ם וְ/נִסַּחְתֶּם֙ מֵ/עַ֣ל הָֽ/אֲדָמָ֔ה אֲשֶׁר אַתָּ֥ה בָא שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/063.yaml
  text: And it shall be that[a], just as Yahweh rejoiced over you to do you good and to multiply you, so Yahweh will rejoice over you to destroy you and to wipe you out[b]; and you will be torn away from upon the land that you are entering there to possess it.
translation:
  language: ml
  text: 'ഇങ്ങനെ സംഭവിക്കും: നിങ്ങൾക്കു നന്മ ചെയ്യാനും നിങ്ങളെ വർധിപ്പിക്കാനും യഹ്‌വെ നിങ്ങളെക്കുറിച്ചു സന്തോഷിച്ചതുപോലെതന്നെ, നിങ്ങളെ നശിപ്പിക്കാനും തുടച്ചുനീക്കാനും യഹ്‌വെ നിങ്ങളെക്കുറിച്ചു സന്തോഷിക്കും; നീ[b] കൈവശമാക്കാനായി അവിടേക്കു പ്രവേശിക്കുന്ന ആ ദേശത്തുനിന്ന് നിങ്ങൾ പറിച്ചെറിയപ്പെടും[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദേശത്തുനിന്ന് വേരോടെ പിഴുതുമാറ്റപ്പെടും.’
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘നീ’ എന്നത് ഏകവചനമാണ്; ഇസ്രായേലിനെ ഒരൊറ്റ ജനമായി അഭിസംബോധന ചെയ്യുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: വാക്യത്തിന്റെ ഭാവികാല ഫലം തുടർന്നുള്ള ക്രിയകളിലൂടെ സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു
  rationale: ഹീബ്രു ഫലസൂചകമായ തുടക്കം മലയാളത്തിൽ പ്രത്യേകം ‘അങ്ങനെ സംഭവിക്കും’ എന്നു ചേർക്കാതെ വാക്യത്തിന്റെ ഭാവികാല ഘടനയിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളാം.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: '...പോലെതന്നെ'
  rationale: അനുഗ്രഹത്തിലും ന്യായവിധിയിലും യഹ്‌വെയുടെ സന്തോഷത്തെ തമ്മിൽ ബന്ധിപ്പിക്കുന്ന ശക്തമായ താരതമ്യം നിലനിർത്തുന്നു.
- source_word: שָׂשׂ / יָשִׂישׂ
  choice: സന്തോഷിച്ചതുപോലെതന്നെ / സന്തോഷിക്കും
  rationale: രണ്ടു രൂപങ്ങൾക്കും ഒരേ മലയാള ധാതു ഉപയോഗിച്ച് ഹീബ്രുവിലെ ഉദ്ദേശപൂർവമായ സമാന്തരതയും അസ്വസ്ഥമാക്കുന്ന ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ നാല് അക്ഷര നാമത്തിന്റെ പദ്ധതിയനുസൃതമായ മലയാള ലിപ്യന്തരണം.
- source_word: לְהֵיטִיב אֶתְכֶם
  choice: നിങ്ങൾക്കു നന്മ ചെയ്യാൻ
  rationale: കേവലം ഭൗതിക സമൃദ്ധിയിലേക്ക് അർത്ഥം ചുരുക്കാതെ വിശാലമായ ഉടമ്പടിപരമായ നന്മയെ പ്രകടിപ്പിക്കുന്നു.
- source_word: וּלְהַרְבּוֹת אֶתְכֶם
  choice: നിങ്ങളെ വർധിപ്പിക്കാൻ
  rationale: ജനസംഖ്യയിൽ പെരുകുക എന്ന ഉടമ്പടി-അനുഗ്രഹ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לְהַאֲבִיד אֶתְכֶם
  choice: നിങ്ങളെ നശിപ്പിക്കാൻ
  rationale: കാരണരൂപത്തിലുള്ള אבד-ന്റെ ശക്തമായ ന്യായവിധി അർത്ഥം നേരിട്ട് നൽകുന്നു.
- source_word: וּלְהַשְׁמִיד אֶתְכֶם
  choice: തുടച്ചുനീക്കാൻ
  rationale: മുൻപുള്ള ‘നശിപ്പിക്കാൻ’ എന്നതിൽനിന്ന് വേർതിരിച്ചുകൊണ്ട് שׁמד-ന്റെ സമ്പൂർണ ഇല്ലായ്മയുടെ തീവ്രത ആധുനികവും വ്യക്തവുമായ ഭാഷയിൽ നിലനിർത്തുന്നു.
- source_word: וְנִסַּחְתֶּם
  choice: നിങ്ങൾ പറിച്ചെറിയപ്പെടും
  rationale: ബലപ്രയോഗത്തോടെയുള്ള നീക്കം എന്ന നിഫാൽ ക്രിയയുടെ ഭാവം നിലനിർത്തുന്നു; ‘വേരോടെ പിഴുതുമാറ്റപ്പെടും’ എന്ന സസ്യരൂപകം സാധ്യമായ മറ്റൊരു വായനയായി അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: מֵעַל הָאֲדָמָה
  choice: ആ ദേശത്തുനിന്ന്
  rationale: מֵעַל സൂചിപ്പിക്കുന്ന ദേശത്തിന്റെ മേൽനിന്നുള്ള നീക്കത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה לְרִשְׁתָּהּ
  choice: നീ കൈവശമാക്കാൻ പ്രവേശിക്കുന്ന ആ ദേശം
  rationale: അവസാന ഉപവാക്യത്തിലെ ഏകവചന അഭിസംബോധന ‘നീ’ എന്നു തുറന്നുകാട്ടുന്നു; שָׁמָּה-യുടെ ദിശാസൂചന ‘ആ ദേശം’ എന്ന ഘടനയിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
theological_decisions:
- issue: ന്യായവിധിയിൽ ദൈവം സന്തോഷിക്കുന്നു എന്ന പ്രസ്താവന
  choice: ‘നിങ്ങളെ നശിപ്പിക്കാനും തുടച്ചുനീക്കാനും യഹ്‌വെ നിങ്ങളിൽ സന്തോഷിക്കും’ എന്നു വ്യക്തമായി നിലനിർത്തി
  alternative: ‘യഹ്‌വെ നിങ്ങളെ നശിപ്പിക്കും’ എന്ന് മാത്രം പറഞ്ഞ് സന്തോഷത്തിന്റെ ആശയം മൃദൂകരിക്കുക
  rationale: ഹീബ്രു അനുഗ്രഹത്തിലെ സന്തോഷത്തെയും ന്യായവിധിയിലെ സന്തോഷത്തെയും ഒരേ ക്രിയയാൽ മനഃപൂർവം സമാന്തരമാക്കുന്നു. ഈ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെയും മൃദൂകരിക്കാതെയും നിലനിർത്തണം.
- issue: יְהוָה എന്ന ദൈവനാമം
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടി-നാമത്തെ പദവിയാൽ മാറ്റാതെ പദ്ധതിയുടെ സ്ഥിരമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: ബഹുവചനത്തിൽനിന്ന് ഏകവചനത്തിലേക്കുള്ള അഭിസംബോധനമാറ്റം
  choice: ആദ്യഭാഗത്ത് ‘നിങ്ങൾ’, അവസാന ഉപവാക്യത്തിൽ ‘നീ’
  alternative: മുഴുവൻ വാക്യത്തിലും ‘നിങ്ങൾ’
  rationale: ഹീബ്രു അവസാന ഉപവാക്യത്തിൽ ഇസ്രായേലിനെ ഒരൊറ്റ ജനമായി ഏകവചനത്തിൽ അഭിസംബോധന ചെയ്യുന്നു; മലയാളത്തിന് ഈ വ്യത്യാസം നേരിട്ട് പ്രകടിപ്പിക്കാനാകുന്നതിനാൽ അത് സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘സന്തോഷിച്ചു/സന്തോഷിക്കും’ എന്ന ആവർത്തനം ഹീബ്രുവിലെ വാചാടോപ സമാന്തരതയ്ക്കായി ഉദ്ദേശപൂർവം നിലനിർത്തി. ‘നിങ്ങൾ’ എന്ന ബഹുവചനത്തിൽനിന്ന് ‘നീ’ എന്ന ഏകവചനത്തിലേക്കുള്ള മൂലപാഠത്തിലെ മാറ്റവും ദൃശ്യമായി സംരക്ഷിച്ചു.
