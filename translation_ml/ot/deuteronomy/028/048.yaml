id: DEU.28.48
reference: Deuteronomy 28:48
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עָבַדְתָּ֣ אֶת אֹיְבֶ֗י/ךָ אֲשֶׁ֨ר יְשַׁלְּחֶ֤/נּוּ יְהוָה֙ בָּ֔/ךְ בְּ/רָעָ֧ב וּ/בְ/צָמָ֛א וּ/בְ/עֵירֹ֖ם וּ/בְ/חֹ֣סֶר כֹּ֑ל וְ/נָתַ֞ן עֹ֤ל בַּרְזֶל֙ עַל צַוָּארֶ֔/ךָ עַ֥ד הִשְׁמִיד֖/וֹ אֹתָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/048.yaml
  text: And you shall serve your enemies[a], whom Yahweh will send against you, in hunger and in thirst and in nakedness and in lack of everything[b]; and he will put an iron yoke on your neck until he has destroyed you.
translation:
  language: ml
  text: യഹോവ നിനക്കെതിരെ അയയ്ക്കുന്ന നിന്റെ ശത്രുക്കളെ നീ വിശപ്പിലും ദാഹത്തിലും നഗ്നതയിലും എല്ലാറ്റിന്റെയും അഭാവത്തിലും സേവിക്കും; അവൻ നിന്റെ കഴുത്തിന്മേൽ ഇരുമ്പുനുകം വെക്കും; നിന്നെ നശിപ്പിക്കുംവരെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മുഖ്യപാഠത്തിലെ “അവൻ” യഹോവയെ സൂചിപ്പിക്കുന്നതായി വായിക്കുന്നു. എങ്കിലും എബ്രായത്തിലെ തുടർന്നുള്ള ഏകവചനക്രിയകൾ, കൂട്ടായ ശത്രുശക്തിയെ ഉദ്ദേശിച്ച്, ശത്രുവിനെയും കർത്താവായി സൂചിപ്പിക്കാമെന്ന് ചിലർ മനസ്സിലാക്കുന്നു: “അവൻ നിന്റെ കഴുത്തിന്മേൽ ഇരുമ്പുനുകം വെക്കും; നിന്നെ നശിപ്പിക്കുംവരെ.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבַדְתָּ אֶת אֹיְבֶיךָ
  choice: നിന്റെ ശത്രുക്കളെ നീ ... സേവിക്കും
  rationale: עבד ഇവിടെ ആരാധനയെയല്ല, ശത്രുക്കൾക്കു കീഴിലുള്ള നിർബന്ധിത സേവനത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ഭാവികാലരൂപം ഉടമ്പടിശാപത്തിന്റെ പ്രവചനസ്വരം നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר יְשַׁלְּחֶנּוּ יְהוָה בָּךְ
  choice: യഹോവ നിനക്കെതിരെ അയയ്ക്കുന്ന
  rationale: בָּךְ എന്നത് ഇവിടെ വിരോധപരമായ ദിശ സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ‘നിനക്കെതിരെ’ എന്നു പരിഭാഷപ്പെടുത്തി; ദൈവനാമം യഹോവയായി ലിപ്യന്തരിച്ചു.
- source_word: בְּרָעָב וּבְצָמָא וּבְעֵירֹם
  choice: വിശപ്പോടും ദാഹത്തോടും നഗ്നതയോടും
  rationale: ഈ בְּ-പ്രയോഗങ്ങൾ സേവനം നടക്കുന്ന ദാരുണാവസ്ഥകളെ സൂചിപ്പിക്കുന്നു. ആവർത്തനവും ക്രമവും മലയാളത്തിൽ നിലനിർത്തി.
- source_word: וּבְחֹסֶר כֹּל
  choice: സകലത്തിന്റെയും കുറവോടുംകൂടെ
  rationale: חֹסֶר ‘കുറവ്/അഭാവം’ എന്നും כֹּל സമ്പൂർണത എന്നും സൂചിപ്പിക്കുന്നു; മൂലത്തിലെ സമഗ്രമായ ദാരിദ്ര്യബോധം സംരക്ഷിക്കുന്നു.
- source_word: עֹל בַּרְזֶל
  choice: ഇരുമ്പുനുകം
  rationale: ഇരുമ്പുകൊണ്ടുള്ള നുകം എന്ന കടുത്ത അടിമത്തത്തിന്റെ ദൃശ്യരൂപം ചുരുക്കവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עַד הִשְׁמִידוֹ אֹתָךְ
  choice: നിന്നെ നശിപ്പിക്കുന്നതുവരെ
  rationale: שׁמד എന്ന ഹിഫീൽ ക്രിയയുടെ ശക്തമായ ‘നശിപ്പിക്കുക’ എന്ന അർഥം അതിശയോക്തിയില്ലാതെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തമായി വരുന്ന ഉടമ്പടിനാമം പൊതുവായി പരിചിതമായ മലയാള ലിപ്യന്തരണമായ ‘യഹോവ’ എന്നു നൽകി.
- issue: וְנָתַן ... עַד הִשְׁמִידוֹ എന്നതിലെ കർത്താവ്
  choice: 'യഹോവ തന്നെയാണ് തുടർന്നുള്ള ക്രിയകളുടെയും കർത്താവ്: ‘അവൻ ... വെക്കും ... നശിപ്പിക്കുന്നതുവരെ.’'
  alternative: 'ശത്രുവാണ് കർത്താവ്: ‘ശത്രു ... വെക്കും ... നശിപ്പിക്കുന്നതുവരെ.’'
  rationale: അടുത്തായി വ്യക്തമായി പറഞ്ഞിരിക്കുന്ന ഏകവചന കർത്താവ് യഹോവയാണ്; തുടർന്നുള്ള ഏകവചന ക്രിയകൾ സ്വാഭാവികമായി അവനോടു ബന്ധിപ്പിക്കാം. എങ്കിലും വ്യാകരണപരമായി ശത്രുവിനെ കർത്താവായി ഗ്രഹിക്കാനുള്ള സാധ്യത ഉള്ളതിനാൽ അടിക്കുറിപ്പിൽ അത് സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. മൂലത്തിലെ ആവർത്തനാത്മകമായ ദുരിതപ്പട്ടികയും ഉടമ്പടിശാപത്തിന്റെ കഠിനസ്വരവും നിലനിർത്തി.
