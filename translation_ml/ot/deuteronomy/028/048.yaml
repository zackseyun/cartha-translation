revisions:
- from: യഹോവ നിനക്കെതിരെ അയയ്ക്കുന്ന നിന്റെ ശത്രുക്കളെ നീ വിശപ്പോടും ദാഹത്തോടും നഗ്നതയോടും സകലത്തിന്റെയും കുറവോടുംകൂടെ സേവിക്കും; അവൻ നിന്നെ നശിപ്പിക്കുന്നതുവരെ നിന്റെ കഴുത്തിൽ ഇരുമ്പുനുകം വെക്കും.[a]
  to: യഹോവ നിനക്കെതിരെ അയയ്ക്കുന്ന നിന്റെ ശത്രുക്കളെ നീ വിശപ്പിലും ദാഹത്തിലും നഗ്നതയിലും എല്ലാറ്റിന്റെയും അഭാവത്തിലും സേവിക്കും; അവൻ നിന്റെ കഴുത്തിന്മേൽ ഇരുമ്പുനുകം വെക്കും; നിന്നെ നശിപ്പിക്കുംവരെ.[a]
  rationale: ദുരിതപ്പട്ടികയിലെ മലയാളപ്രയോഗം സാഹചര്യാർഥം തെളിയുന്ന വിധം പരിഷ്കരിച്ചു. ‘വെക്കും; നിന്നെ നശിപ്പിക്കുംവരെ’ എന്ന ക്രിയാക്രമം മൂലത്തിലെ രണ്ട് ഏകവചനക്രിയകളെയും അവയുടെ സമയപരിധിയെയും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു. അടിക്കുറിപ്പ് മുഖ്യവായനയും വ്യാകരണപരമായി സാധ്യമായ ബദൽവായനയും നിഷ്പക്ഷമായി വ്യക്തമാക്കുന്നു.
