    rationale: വാക്യത്തിലെ ബ്-പ്രത്യയങ്ങളുടെ തുടർച്ച സേവനത്തിന്റെ സാഹചര്യങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘എല്ലാറ്റിന്റെയും അഭാവത്തിൽ’ എന്നത് അതേ സമഗ്രവഞ്ചനാഭാവം കൂടുതൽ സ്വാഭാവികമായി നൽകുന്നു.
