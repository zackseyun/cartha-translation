revisions:
- from: അവ നിനക്കും നിന്റെ സന്തതിക്കും എന്നേക്കും ഒരു അടയാളവും ഒരു അത്ഭുതവുമായി നിലനിൽക്കും[a][b].
  to: അവ നിന്റെമേലും നിന്റെ സന്തതിയുടെമേലും ഒരു അടയാളമായും ഒരു അത്ഭുതമായും എന്നേക്കും ഉണ്ടായിരിക്കും[a][b].
  rationale: The revision renders the repeated Hebrew preposition with ‘മേൽ,’ preserving the sense that the curses rest upon the addressee and posterity. It also replaces ‘നിലനിൽക്കും’ with the more direct ‘ഉണ്ടായിരിക്കും.’ The implicit referent remains implicit in the main text, and the note supplies the contextual identification without over-interpreting it.
