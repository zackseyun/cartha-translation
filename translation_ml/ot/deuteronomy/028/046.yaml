source:
  edition: WLC
  text: וְ/הָי֣וּ בְ/ךָ֔ לְ/א֖וֹת וּ/לְ/מוֹפֵ֑ת וּֽ/בְ/זַרְעֲ/ךָ֖ עַד עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/046.yaml
  text: And they will be on you and on your offspring as a sign and a wonder forever[a][b].
translation:
  language: ml
  text: അവ നിന്റെമേലും നിന്റെ സന്തതിയുടെമേലും ഒരു അടയാളമായും ഒരു അത്ഭുതമായും എന്നേക്കും ഉണ്ടായിരിക്കും[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിന്റെ പിൻതലമുറയുടെമേലും’; എബ്രായത്തിലെ ‘വിത്ത്’ എന്ന പദം ഒരാളുടെ സന്തതിയെയോ പിൻതലമുറയെയോ കൂട്ടമായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘അവ’ എന്നത് ചുറ്റുമുള്ള വാക്യങ്ങളിൽ വിവരിച്ചിരിക്കുന്ന ശാപങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: וְהָיוּ
  choice: നിലനിൽക്കും
  rationale: മുൻസന്ദർഭത്തിൽ വിവരിച്ച ശാപങ്ങളുടെ ഭാവിയിലെ തുടർച്ചയായ ഫലത്തെ സൂചിപ്പിക്കുന്നു. വെറും ‘ആയിരിക്കും’ എന്നതിനെക്കാൾ עַד עוֹלָם എന്ന ദൈർഘ്യപ്രയോഗത്തോടൊപ്പം ‘നിലനിൽക്കും’ സ്വാഭാവികമാണ്.
- source_word: בְךָ
  choice: നിനക്കും
  rationale: ശാപങ്ങൾ അഭിസംബോധിതനിൽ പതിഞ്ഞുനിൽക്കുന്നതാണ് ആശയം. മലയാളത്തിൽ ‘നിന്റെമേൽ’ സാധ്യമെങ്കിലും, തുടർന്നുള്ള ‘സന്തതിക്കും’ എന്ന സമാന്തരഘടനയിൽ ‘നിനക്കും’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: לְאוֹת
  choice: ഒരു അടയാളമായി
  rationale: אוֹת ഒരു അടയാളമോ സൂചനയോ എന്നർഥം നൽകുന്നു; ഇവിടെ സംഭവങ്ങളുടെ സൂചകസ്വഭാവം ‘അടയാളം’ നന്നായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וּלְמוֹפֵת
  choice: ഒരു അത്ഭുതമായി
  rationale: מוֹפֵת ‘അത്ഭുതം’, ‘വിസ്മയചിഹ്നം’, ‘ശകുനം’ എന്നീ അർഥങ്ങൾ വഹിക്കാം. അശുഭസൂചന എന്ന അർഥം അനാവശ്യമായി ചേർക്കാതെ പരമ്പരാഗത പദജോടി നിലനിർത്താൻ ‘അത്ഭുതം’ തെരഞ്ഞെടുത്തു.
- source_word: וּבְזַרְעֲךָ
  choice: നിന്റെ സന്തതിക്കും
  rationale: זֶרַע ഇവിടെ കൂട്ടമായ പിൻതലമുറയെ സൂചിപ്പിക്കുന്നു. ‘വിത്ത്’ അക്ഷരാർഥമെങ്കിലും ഈ സന്ദർഭത്തിൽ അസ്വാഭാവികം; ‘സന്തതി’ കൂട്ടാർഥം നിലനിർത്തുന്ന മാന്യവും വ്യക്തവുമായ പദമാണ്.
- source_word: עַד עוֹלָם
  choice: എന്നേക്കും
  rationale: ദീർഘമായി തുടരുന്ന കാലാവധിയെ സൂചിപ്പിക്കുന്ന സാധാരണ മലയാള സമാനപദം. ഈ വിവർത്തനം തത്ത്വചിന്താപരമായ അനന്തതയെ പ്രത്യേകം നിർവചിക്കുന്നില്ല.
theological_decisions:
- issue: ‘അവ’ എന്നതിന്റെ സൂചിതവിഷയം
  choice: മുൻസന്ദർഭത്തിൽ വിവരിച്ച ശാപങ്ങളെയാണ് ‘അവ’ സൂചിപ്പിക്കുന്നത്; പ്രധാനവാക്യത്തിൽ സർവനാമം നിലനിർത്തുന്നു.
  alternative: ‘ഈ ശാപങ്ങൾ’ എന്ന് പ്രധാനവാക്യത്തിൽ വ്യക്തമായി ചേർക്കുക.
  rationale: എബ്രായവാക്യത്തിൽ കർത്താവ് വ്യക്തമായി ആവർത്തിച്ചിട്ടില്ല. സന്ദർഭം ശാപങ്ങളിലേക്കാണ് വിരൽചൂണ്ടുന്നതെങ്കിലും അവയെ പ്രധാനവാക്യത്തിൽ നേരിട്ട് ചേർക്കുന്നത് മൂലത്തിലെ പരോക്ഷത പരിഹരിച്ചുകളയും.
- issue: עַד עוֹלָם എന്നതിന്റെ വ്യാപ്തി
  choice: ‘എന്നേക്കും’ എന്ന് വിവർത്തനം ചെയ്യുന്നു; അതിന്റെ ദൈർഘ്യത്തിന്റെ തത്ത്വചിന്താപരമായ സ്വഭാവം നിർവചിക്കുന്നില്ല.
  alternative: ‘തലമുറതലമുറയായി’ അല്ലെങ്കിൽ ‘എല്ലാക്കാലവും’.
  rationale: ഉടമ്പടിസംബന്ധമായ ന്യായവിധിയുടെ പശ്ചാത്തലത്തിൽ ഈ പ്രയോഗം ദീർഘവും തുടർച്ചയുമായ കാലത്തെ സൂചിപ്പിക്കുന്നു. മൂലപാഠത്തേക്കാൾ അധികമായ സിദ്ധാന്തനിഗമനം ചേർക്കാതെ സാധാരണ സമാനപദം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘അടയാളവും അത്ഭുതവുമായി’ എന്ന പദജോടി മൂലത്തിലെ אוֹת/מוֹפֵת സമാന്തരത നിലനിർത്തുന്നു; ‘സന്തതി’ സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായിരിക്കെ കൂട്ടാർഥവും സംരക്ഷിക്കുന്നു.
