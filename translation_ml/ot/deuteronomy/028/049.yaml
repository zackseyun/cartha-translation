source:
  edition: WLC
  text: יִשָּׂ֣א יְהוָה֩ עָלֶ֨י/ךָ גּ֤וֹי מֵ/רָחוֹק֙ מִ/קְצֵ֣ה הָ/אָ֔רֶץ כַּ/אֲשֶׁ֥ר יִדְאֶ֖ה הַ/נָּ֑שֶׁר גּ֕וֹי אֲשֶׁ֥ר לֹא תִשְׁמַ֖ע לְשֹׁנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/049.yaml
  text: Yahweh will raise up against you a nation from far away[a], from the end of the earth[b], as the eagle swoops down—a nation whose language you will not understand.
translation:
  language: ml
  text: യഹ്‌വെ നിനക്കെതിരെ ദൂരത്തുനിന്ന്, ഭൂമിയുടെ അറ്റത്തുനിന്ന്, കഴുകൻ കുതിച്ചിറങ്ങുന്നതുപോലെ ഒരു ജനതയെ വരുത്തും[a]. ആ ജനതയുടെ ഭാഷ നിനക്കു മനസ്സിലാകുകയില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഭൂമിയുടെ അറ്റത്തുനിന്ന്’ അത്യന്തം വിദൂരമായ സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. ‘ദേശത്തിന്റെ അറ്റത്തുനിന്ന്’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ ക്രിയ വേഗത്തിൽ പറക്കുന്നതിനെയോ പാഞ്ഞിറങ്ങുന്നതിനെയോ സൂചിപ്പിക്കുന്നു; ‘കഴുകൻ പറക്കുന്നതുപോലെ’ എന്നും പരിഭാഷപ്പെടുത്താം. ‘കഴുകൻ’ എന്ന പദം ചില സന്ദർഭങ്ങളിൽ ശവംതീനിക്കഴുകനെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘അതിന്റെ നാവ് നീ കേൾക്കുകയില്ല’; ഇവിടെ അർഥം ആ ജനതയുടെ ഭാഷ നിനക്കു മനസ്സിലാകുകയില്ല എന്നതാണ്.'
    reason: idiom
lexical_decisions:
- source_word: יִשָּׂא ... עָלֶיךָ
  choice: നിനക്കെതിരെ ... കൊണ്ടുവരും
  rationale: נשא എന്നതിന് അക്ഷരാർഥത്തിൽ ‘ഉയർത്തുക/വഹിക്കുക’ എന്നാണെങ്കിലും, על ചേർന്ന ഈ സന്ദർഭത്തിൽ ഒരു ജനതയെ ഒരാളുടെ നേരെ വരുത്തുക എന്ന ആശയമാണ്. ‘കൊണ്ടുവരും’ ദൈവിക പ്രവർത്തനവും ശത്രുതാപരമായ ദിശയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, അതിന്റെ പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: גּוֹי
  choice: ഒരു ജനത
  rationale: ഉടമ്പടിശാപത്തിന്റെ ഈ പശ്ചാത്തലത്തിൽ גוי അധിനിവേശത്തിനായി വരുന്ന ഒരു വിദേശ ദേശീയ ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: מֵרָחוֹק
  choice: വളരെ ദൂരത്തുനിന്ന്
  rationale: ആ ജനതയുടെ വിദൂരമായ ഉത്ഭവസ്ഥാനം വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: מִקְצֵה הָאָרֶץ
  choice: ഭൂമിയുടെ അറ്റത്തുനിന്ന്
  rationale: അത്യന്തം വിദൂരമായ സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യരൂപം നിലനിർത്തുന്നു; הָאָרֶץ എന്നതിന് ‘ദേശം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: כַּאֲשֶׁר יִדְאֶה הַנָּשֶׁר
  choice: കഴുകൻ അതിവേഗം കുതിച്ചിറങ്ങുന്നതുപോലെ
  rationale: דאה സൂചിപ്പിക്കുന്ന വേഗമേറിയ പറക്കലോ പാഞ്ഞിറങ്ങലോ ആക്രമണത്തിന്റെ വേഗവും ഭീഷണിയും പ്രകടമാക്കുന്നു. נשר-ന്റെ ജന്തുശാസ്ത്രപരമായ വ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: לֹא תִשְׁמַע לְשֹׁנוֹ
  choice: അവരുടെ ഭാഷ നിനക്കു മനസ്സിലാകുകയില്ല
  rationale: അക്ഷരാർഥം ‘അവരുടെ നാവ് നീ കേൾക്കുകയില്ല’ എന്നാണെങ്കിലും, ഭാഷയെക്കുറിച്ചുള്ള שמע ഇവിടെ കേട്ടു ഗ്രഹിക്കുക എന്ന അർഥത്തിലാണ്. മലയാളത്തിൽ ഉദ്ദേശ്യം വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ഒരു സ്ഥാനപ്പേരല്ല, ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ മലയാളത്തിൽ ആ നാമത്തിന്റെ ലിപ്യന്തരണം നിലനിർത്തി.
- issue: വിദേശ ജനതയെ വരുത്തുന്നതിലെ ദൈവിക പ്രവർത്തനം
  choice: യഹ്‌വെ ... കൊണ്ടുവരും
  alternative: ഒരു ജനത വരും
  rationale: יִשָּׂא എന്ന സകർമക ക്രിയയിൽ യഹ്‌വെയാണ് കർത്താവ്. അതിനാൽ ശാപന്യായത്തിൽ ദൈവത്തിന്റെ സജീവ പങ്ക് മായ്ച്ചുകളയാതെ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ദീർഘമായ എബ്രായ വാക്യം വായനാസൗകര്യത്തിനായി മൂന്ന് മലയാള വാക്യങ്ങളാക്കി; ഏകവചനമായ ‘ജനത’യെ തുടർന്ന് മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചന സർവനാമം ഉപയോഗിച്ചു. രൂപകവും ദൈവിക പ്രവർത്തനവും മൂലപാഠത്തിലെ അർഥവൈവിധ്യവും നിലനിർത്തി.
