source:
  edition: WLC
  text: אָר֥וּר פְּרִֽי בִטְנְ/ךָ֖ וּ/פְרִ֣י אַדְמָתֶ֑/ךָ שְׁגַ֥ר אֲלָפֶ֖י/ךָ וְ/עַשְׁתְּר֥וֹת צֹאנֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/018.yaml
  text: Cursed shall be the fruit of your womb[a], and the fruit of your ground[b], the offspring of your herds and the young of your flocks.
translation:
  language: ml
  text: നിന്റെ ഗർഭഫലവും[a] നിന്റെ നിലത്തിന്റെ ഫലവും നിന്റെ കന്നുകാലികളുടെ സന്തതിയും നിന്റെ ആട്ടിൻപറ്റങ്ങളുടെ കുഞ്ഞുങ്ങളും ശപിക്കപ്പെട്ടതായിരിക്കും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഗർഭഫലം” എന്നത് മക്കളെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്.
    reason: cultural_note
  - marker: b
    text: ഇവിടെയുള്ള എബ്രായ പ്രയോഗങ്ങൾ കന്നുകാലികളുടെയും ആടുകളുടെയും കുഞ്ഞുങ്ങളെയോ അവയുടെ വർധനയെയോ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: ശപിക്കപ്പെട്ടവയായിരിക്കും
  rationale: ഉടമ്പടിശാപത്തിന്റെ പ്രഖ്യാപനസ്വരം നിലനിർത്തുന്നു; വാക്യത്തിലെ ബഹുവിധ കർത്താക്കളോട് സ്വാഭാവികമായി യോജിക്കുന്ന വിധത്തിൽ അവസാനം ചേർത്തിരിക്കുന്നു.
- source_word: פְּרִי בִטְנְךָ
  choice: നിന്റെ ഗർഭഫലം
  rationale: മക്കളെ സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം അതേപടി നിലനിർത്തുന്ന, മലയാളത്തിൽ മനസ്സിലാകുന്ന പ്രയോഗം.
- source_word: וּפְרִי אַדְמָתֶךָ
  choice: നിന്റെ നിലത്തിന്റെ ഫലം
  rationale: אָדָמָה എന്നത് കൃഷിനിലം/മണ്ണ് എന്ന ആശയം നൽകുന്നു; മുൻപുള്ള ‘ഗർഭഫലം’ എന്ന പ്രയോഗത്തോടുള്ള പദസമാന്തര്യം സംരക്ഷിക്കുന്നു.
- source_word: שְׁגַר אֲלָפֶיךָ
  choice: നിന്റെ കന്നുകാലികളുടെ സന്തതി
  rationale: വലിയ വളർത്തുമൃഗങ്ങൾ, പ്രത്യേകിച്ച് ഗോവർഗം, പ്രസവിക്കുന്ന കുഞ്ഞുങ്ങളെയോ അവയുടെ വർധനയെയോ വ്യക്തമാക്കുന്നു.
- source_word: וְעַשְׁתְּרֹת צֹאנֶךָ
  choice: നിന്റെ ആട്ടിൻപറ്റങ്ങളുടെ കുഞ്ഞുങ്ങൾ
  rationale: ചെറുകന്നുകാലികളായ ചെമ്മരിയാടുകളുടെയും കോലാടുകളുടെയും കുഞ്ഞുങ്ങൾ/വർധന എന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ദേവതാനാമവുമായി തെറ്റായ ബന്ധം ഒഴിവാക്കുന്നു.
