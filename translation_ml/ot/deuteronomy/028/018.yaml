translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ ‘ഫലം’ എന്ന ആവർത്തനവും ഉടമ്പടിശാപത്തിന്റെ പ്രഖ്യാപനസ്വരവും നിലനിർത്തി.
