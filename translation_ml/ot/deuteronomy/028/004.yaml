  text: בָּר֧וּךְ פְּרִֽי בִטְנְ/ךָ֛ וּ/פְרִ֥י אַדְמָתְ/ךָ֖ וּ/פְרִ֣י בְהֶמְתֶּ֑/ךָ שְׁגַ֥ר אֲלָפֶ֖י/ךָ וְ/עַשְׁתְּר֥וֹת צֹאנֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/004.yaml
  text: Blessed shall be the fruit of your womb[a], and the fruit of your ground, and the fruit of your livestock—the offspring of your herds and the young of your flocks.
translation:
  language: ml
  text: നിന്റെ ഗർഭഫലവും നിന്റെ നിലത്തിന്റെ ഫലവും നിന്റെ കന്നുകാലികളുടെ ഫലവും—നിന്റെ കന്നുകാലിക്കൂട്ടങ്ങളുടെ സന്തതിയും നിന്റെ ആട്ടിൻകൂട്ടങ്ങളുടെ കുഞ്ഞുങ്ങളും—അനുഗൃഹീതമായിരിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിന്റെ കന്നുകാലിക്കൂട്ടങ്ങളുടെ വർധനയും നിന്റെ ആട്ടിൻകൂട്ടങ്ങളുടെ സന്തതിയും’ എന്നും പരിഭാഷപ്പെടുത്താം. שְׁגַר אֲלָפֶיךָ, עַשְׁתְּרֹת צֹאנֶךָ എന്നീ എബ്രായ പ്രയോഗങ്ങൾ കന്നുകാലികളുടെ പ്രജനനവർധനയെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗത പദപ്രയോഗങ്ങളാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: അനുഗ്രഹിക്കപ്പെടും
  rationale: ചുറ്റുമുള്ള ഉടമ്പടി-അനുഗ്രഹങ്ങളുടെ പശ്ചാത്തലത്തിൽ ഫലമായി വരാനിരിക്കുന്ന അനുഗ്രഹത്തെ സൂചിപ്പിക്കുന്ന വിധത്തിൽ ആശീർവാദസൂത്രത്തിന്റെ ഭാവം നൽകുന്നു.
- source_word: פְּרִי
  choice: ഫലം
  rationale: മൂന്നു പ്രാവശ്യമുള്ള ആവർത്തനം നിലനിർത്തി ഗർഭം, നിലം, കന്നുകാലികൾ എന്നീ മേഖലകളെ ഒരേ കാവ്യാത്മക സമാന്തരത്തിൽ ബന്ധിപ്പിക്കുന്നു.
- source_word: בִטְנְךָ
  choice: നിന്റെ ഗർഭം
  rationale: ഈ സന്ദർഭത്തിൽ മക്കളുടെ ഉറവിടമായ ഗർഭത്തെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ‘ഗർഭഫലം’ മലയാളത്തിലെ സ്വാഭാവികമായ അനുഗ്രഹപ്രയോഗമാണ്.
- source_word: אַדְמָתְךָ
  choice: നിന്റെ നിലം
  rationale: രാജ്യപ്രദേശം എന്ന വിശാല അർഥത്തേക്കാൾ കൃഷിയുമായി ബന്ധപ്പെട്ട മണ്ണിനെയും നിലത്തെയും സൂചിപ്പിക്കുന്നു.
- source_word: בְהֶמְתֶּךָ
  choice: നിന്റെ കന്നുകാലികൾ
  rationale: വളർത്തുമൃഗങ്ങളെ പൊതുവായി ഉൾക്കൊള്ളുന്ന പദത്തിന് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ സമഗ്രപ്രയോഗം.
- source_word: שְׁגַר אֲלָפֶיךָ
  choice: നിന്റെ കന്നുകാലിക്കൂട്ടങ്ങളുടെ സന്തതി
  rationale: വലിയ വളർത്തുമൃഗങ്ങളുടെ പ്രസവവർധനയെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗത മൃഗസംരക്ഷണപ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: עַשְׁתְּרֹת צֹאנֶךָ
  choice: നിന്റെ ആട്ടിൻപറ്റങ്ങളുടെ കുഞ്ഞുങ്ങൾ
  rationale: ചെറുകന്നുകാലികളുടെ കൂട്ടത്തിൽ ജനിക്കുന്ന കുഞ്ഞുങ്ങളെയോ അവയുടെ വർധനയെയോ സൂചിപ്പിക്കുന്ന സ്ഥിരപ്രയോഗം; ‘ആട്ടിൻപറ്റം’ ആടുകളെയും ചെമ്മരിയാടുകളെയും പൊതുവായി ഗ്രഹിക്കാവുന്ന രീതിയിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ ‘ഫലം’ എന്ന മൂന്നിരട്ടി ആവർത്തനം നിലനിർത്തി സമാന്തരഘടന സംരക്ഷിച്ചു; അപൂർവമായ മൃഗസംരക്ഷണപദങ്ങളുടെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
