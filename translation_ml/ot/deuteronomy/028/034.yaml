source:
  edition: WLC
  text: וְ/הָיִ֖יתָ מְשֻׁגָּ֑ע מִ/מַּרְאֵ֥ה עֵינֶ֖י/ךָ אֲשֶׁ֥ר תִּרְאֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/034.yaml
  text: And you will be driven mad by the sight your eyes see[a].
translation:
  language: ml
  text: നിന്റെ കണ്ണുകൾ കാണുന്ന കാഴ്ച നിമിത്തം നിനക്കു ഭ്രാന്തുപിടിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: “നീ കാണുന്ന നിന്റെ കണ്ണുകളുടെ കാഴ്ച നിമിത്തം നീ ഭ്രാന്തനായിത്തീരും.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיִיתָ
  choice: നിനക്കു ... പിടിക്കും
  rationale: ശാപങ്ങളുടെ ഭാവികാലക്രമത്തിൽ ഈ രൂപം വരാനിരിക്കുന്ന ഫലത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘പിടിക്കും’ എന്ന പ്രയോഗം ആ ഭാവികാലവും അവസ്ഥയിലാകുന്നതും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: מְשֻׁגָּע
  choice: ഭ്രാന്തുപിടിക്കും
  rationale: שׁגע എന്ന ധാതുവിൽനിന്നുള്ള രൂപം ഭ്രാന്തമായ അവസ്ഥയിലാക്കപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ഭ്രാന്തുപിടിക്കും’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികവും ഫലാവസ്ഥ വ്യക്തമാക്കുന്നതുമാണ്.
- source_word: מִמַּרְאֵה
  choice: കാഴ്ച നിമിത്തം
  rationale: ഇവിടെ מִן കാരണത്തെ സൂചിപ്പിക്കുന്നു. ‘നിമിത്തം’ എന്നത് കണ്ട കാഴ്ചയാണ് ഭ്രാന്തിന്റെ കാരണമെന്ന് വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: עֵינֶיךָ
  choice: നിന്റെ കണ്ണുകൾ
  rationale: എബ്രായത്തിലെ മൂർത്തമായ ഇന്ദ്രിയപരമായ ഊന്നൽ നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: אֲשֶׁר תִּרְאֶה
  choice: കാണുന്ന
  rationale: ആപേക്ഷിക ഉപവാക്യം കാഴ്ചയെ അഭിസംബോധിതൻ കാണുന്നതുമായി ബന്ധിപ്പിക്കുന്നു; ‘നിന്റെ കണ്ണുകൾ കാണുന്ന കാഴ്ച’ എന്ന ആവർത്തനം മൂലപാഠത്തിലെ רא־ബന്ധമുള്ള ദൃശ്യഭാഷ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായതും മാന്യവുമായ ശൈലി. മൂലപാഠത്തിലെ ‘കണ്ണുകൾ—കാണുക—കാഴ്ച’ എന്ന ദൃശ്യ ആവർത്തനം കഴിയുന്നത്ര നിലനിർത്തിയിരിക്കുന്നു; മുഖ്യവാക്യം സ്വാഭാവിക മലയാളത്തിനായി മിനുക്കിയിരിക്കുന്നു.
