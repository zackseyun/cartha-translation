source:
  edition: WLC
  text: יַדְבֵּ֧ק יְהוָ֛ה בְּ/ךָ֖ אֶת הַ/דָּ֑בֶר עַ֚ד כַּלֹּת֣/וֹ אֹֽתְ/ךָ֔ מֵ/עַל֙ הָֽ/אֲדָמָ֔ה אֲשֶׁר אַתָּ֥ה בָא שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/021.yaml
  text: Yahweh will make the plague cling to you until he has wiped you out from the land that you are entering to possess[a][b].
translation:
  language: ml
  text: യഹോവ മഹാമാരിയെ നിന്നോടു പറ്റിപ്പിടിപ്പിക്കും; നീ കൈവശമാക്കാൻ പ്രവേശിക്കുന്ന ദേശത്തുനിന്ന് അവൻ നിന്നെ തുടച്ചുനീക്കുന്നതുവരെ[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മാരകവ്യാധി.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം ന്യായവിധിയായി വരുന്ന മാരകമായ പകർച്ചവ്യാധിയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അതു നിന്നെ നശിപ്പിക്കുന്നതുവരെ’; ഈ ഉപവാക്യത്തിന്റെ അന്തർലീന കർത്താവായി ‘മഹാമാരി’യെ മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: יַדְבֵּק
  choice: പറ്റിപ്പിടിപ്പിക്കും
  rationale: דבק എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലുള്ള കാരണാർഥം (‘പറ്റിപ്പിടിക്കുമാറാക്കുക’) നിലനിർത്തുന്നു; ബാധ വിട്ടുമാറാതെ ചേർന്നുനിൽക്കുന്ന ദൃശ്യവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: הַדָּבֶר
  choice: മഹാമാരി
  rationale: ഉടമ്പടി-ശാപത്തിന്റെ പശ്ചാത്തലത്തിൽ ഈ പദം മാരകമായ പകർച്ചവ്യാധിയെയോ മഹാമാരിയെയോ സൂചിപ്പിക്കുന്നു; ആ അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: עַד כַּלֹּתוֹ אֹתְךָ
  choice: അവൻ നിന്നെ തുടച്ചുനീക്കുന്നതുവരെ
  rationale: כלה എന്നതിലെ പൂർണമായി അവസാനിപ്പിക്കുക/നശിപ്പിക്കുക എന്ന ശക്തി പ്രകടമാക്കുന്നു; മുൻവാക്യത്തിലെ യഹോവയെ അന്തർലീന കർത്താവായി സ്വീകരിക്കുന്നു.
- source_word: מֵעַל הָאֲדָמָה
  choice: ദേശത്തുനിന്ന്
  rationale: അക്ഷരാർഥത്തിൽ ‘നിലത്തിന്റെ മുകളിൽനിന്ന്’ എന്നായാലും, കൈവശപ്പെടുത്താൻ പോകുന്ന ദേശത്തെക്കുറിച്ചുള്ള ആവർത്തനപുസ്തകത്തിന്റെ പശ്ചാത്തലത്തിൽ ‘ദേശത്തുനിന്ന്’ സ്വാഭാവികവും പ്രസക്തവുമാണ്.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה
  choice: നീ ... പ്രവേശിക്കുന്ന
  rationale: בוא + שמה എന്ന എബ്രായ പ്രയോഗത്തെ ലക്ഷ്യദേശത്തേക്കുള്ള അടുത്ത പ്രവേശനമായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: לְרִשְׁתָּהּ
  choice: കൈവശമാക്കാൻ
  rationale: ירש എന്ന പദത്തിന്റെ ദേശം സ്വന്തമായി കൈവശപ്പെടുത്തുക എന്ന ഉടമ്പടി-സന്ദർഭാർഥം വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: ഉടമ്പടി-ശാപത്തിലെ דֶּבֶר എന്ന രോഗപദത്തിന്റെ വിവർത്തനം
  choice: മഹാമാരി
  alternative: മാരകവ്യാധി
  rationale: ദൈവവിധിയുടെ ഭാഗമായി വരുന്ന വ്യാപകവും മാരകവുമായ രോഗബാധയെ ‘മഹാമാരി’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി അറിയിക്കുന്നു; നിർദ്ദിഷ്ടമായ ഒരു രോഗമായി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- issue: כַּלֹּתוֹ എന്ന ക്രിയാരൂപത്തിന്റെ അന്തർലീന കർത്താവ്
  choice: അവൻ നിന്നെ തുടച്ചുനീക്കുന്നതുവരെ
  alternative: അതു നിന്നെ നശിപ്പിക്കുന്നതുവരെ
  rationale: മുഖ്യവാക്യത്തിന്റെ കർത്താവായ യഹോവയെ തുടർക്രിയയുടെയും കർത്താവായി സ്വീകരിക്കുന്നതാണ് സന്ദർഭത്തിൽ സ്വാഭാവികം. എങ്കിലും മഹാമാരിയെ കർത്താവാക്കുന്ന വ്യാകരണസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പറ്റിപ്പിടിപ്പിക്കും’ എന്നത് മൂലത്തിലെ കാരണാർഥവും ദൃശ്യവും നിലനിർത്തുന്നു; ഉടൻ ചേർത്ത ‘വിട്ടുമാറുകയില്ല’ സ്വാഭാവിക മലയാളത്തിൽ ആ ദൃശ്യത്തിന്റെ അർഥം വ്യക്തമാക്കുന്നു. ഏകവചനത്തിലുള്ള ‘നീ/നിന്നെ’ മൂലപാഠത്തിന്റെ രൂപം സംരക്ഷിക്കുന്നു.
