id: DEU.28.23
reference: Deuteronomy 28:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָי֥וּ שָׁמֶ֛י/ךָ אֲשֶׁ֥ר עַל רֹאשְׁ/ךָ֖ נְחֹ֑שֶׁת וְ/הָ/אָ֥רֶץ אֲשֶׁר תַּחְתֶּ֖י/ךָ בַּרְזֶֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/023.yaml
  text: And the heavens above your head shall be bronze[a], and the earth beneath you iron.
translation:
  language: ml
  text: നിന്റെ തലയ്ക്കുമീതെയുള്ള ആകാശം വെങ്കലവും[a] നിന്റെ കീഴിലുള്ള ഭൂമി ഇരുമ്പും ആയിത്തീരും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നിന്റെ തലയ്ക്കുമീതെയുള്ള ആകാശം ചെമ്പും നിന്റെ കീഴിലുള്ള നിലം ഇരുമ്പും ആയിത്തീരും.”'
    reason: נְחֹשֶׁת എന്നതിന് ‘ചെമ്പ്’ എന്നും ‘വെങ്കലം’ എന്നും, אֶרֶץ എന്നതിന് ഇവിടെ ‘ഭൂമി’ എന്നും ‘നിലം’ എന്നും അർഥമാകാവുന്നതിനാൽ പദപരമായ മറ്റൊരു വായന.
lexical_decisions:
- source_word: וְהָיוּ
  choice: ആയിത്തീരും
  rationale: ശാപപ്രഖ്യാപനത്തിന്റെ സന്ദർഭത്തിൽ ഭാവികാലഫലത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ പ്രവചനാത്മകമായ മാറ്റത്തിന്റെ ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: שָׁמֶיךָ אֲשֶׁר עַל רֹאשְׁךָ
  choice: നിന്റെ തലയ്ക്കുമീതെയുള്ള ആകാശം
  rationale: שָׁמַיִם എന്നത് ഇവിടെ കാലാവസ്ഥയുമായി ബന്ധപ്പെട്ട ആകാശമേഖലയെയാണ് സൂചിപ്പിക്കുന്നത്. ഏകവചനമായ ‘ആകാശം’ സ്വാഭാവിക മലയാളപ്രയോഗമാണ്; എബ്രായത്തിലെ ഉടമസ്ഥതയും സ്ഥാനബന്ധവും ചേർത്ത് വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: נְחֹשֶׁת
  choice: വെങ്കലം
  rationale: പദത്തിന് ചെമ്പ് എന്നും വെങ്കലം എന്നും അർഥമാകാം. ഇരുമ്പിനോടു ചേർന്നുള്ള കാഠിന്യത്തിന്റെയും വഴങ്ങാത്ത വരൾച്ചയുടെയും ദൃശ്യത്തിൽ ‘വെങ്കലം’ യോജിക്കുന്നു; മറ്റുവായന അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: וְהָאָרֶץ אֲשֶׁר תַּחְתֶּיךָ
  choice: നിന്റെ കീഴിലുള്ള ഭൂമി
  rationale: മുകളിലെ ആകാശത്തോടുള്ള ലംബസമാന്തര്യം നിലനിർത്തുന്നു. אֶרֶץ എന്നതിന് ദേശം/നിലം എന്നും അർഥമുണ്ടെങ്കിലും ഇവിടെ ആകാശം–ഭൂമി വൈരുധ്യം ‘ഭൂമി’യെ പിന്തുണയ്ക്കുന്നു.
- source_word: בַּרְזֶל
  choice: ഇരുമ്പ്
  rationale: ലോഹപദത്തിന്റെ നേരിട്ടുള്ള സാധാരണ വിവർത്തനം; കഠിനവും ഫലശൂന്യവുമായ ഭൂമിയുടെ ശാപദൃശ്യം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ശാപദൃശ്യത്തിന്റെ രൂപകാലങ്കാരശക്തി
  choice: ‘വെങ്കലം’, ‘ഇരുമ്പ്’ എന്നീ ലോഹദൃശ്യങ്ങൾ വിശദീകരിക്കാതെ മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
  alternative: ആകാശം മഴ നൽകാതെയും നിലം വരണ്ടുകട്ടിയായും തീരും എന്ന് വ്യാഖ്യാനപരമായി പരിഭാഷപ്പെടുത്തുക.
  rationale: എബ്രായപാഠം വരൾച്ചയെയും കാഠിന്യത്തെയും സൂചിപ്പിക്കുന്ന ശക്തമായ ഉടമ്പടി-ശാപദൃശ്യം നൽകുന്നു. അതിന്റെ സൂചനയെ മുഖ്യപാഠത്തിൽ പരാവർത്തനം ചെയ്ത് പരിമിതപ്പെടുത്താതെ അതേ സംഘർഷവും ദൃശ്യശക്തിയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘തലയ്ക്കുമീതെ/കീഴിൽ’ എന്ന സമാന്തര ഘടനയും ലോഹരൂപകവും സംരക്ഷിച്ചു; ‘ആയിത്തീരും’ ശാപത്തിന്റെ ഭാവിഫലവും ഗൗരവവും പ്രകടമാക്കുന്നു.
