  variant: modern standard Malayalam
source:
  edition: WLC
  text: בָּר֥וּךְ אַתָּ֖ה בָּ/עִ֑יר וּ/בָר֥וּךְ אַתָּ֖ה בַּ/שָּׂדֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/003.yaml
  text: Blessed shall you be in the city[a], and blessed shall you be in the field.
translation:
  language: ml
  text: നഗരത്തിൽ നീ അനുഗൃഹീതനായിരിക്കും[a]; വയലിലും നീ അനുഗൃഹീതനായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നഗരത്തിൽ നീ അനുഗൃഹീതനാണ്; വയലിലും നീ അനുഗൃഹീതനാണ്.”'
    reason: ഹീബ്രു വാക്യത്തിൽ പ്രസ്താവ്യക്രിയ ഇല്ലാത്തതിനാൽ, ഇത് ഭാവിസ്വഭാവമുള്ള വാഗ്ദാനമായോ നിലവിലെ അനുഗ്രഹപ്രഖ്യാപനമായോ മനസ്സിലാക്കാം.
lexical_decisions:
- source_word: בָּרוּךְ
  choice: അനുഗൃഹീതനായിരിക്കും
  rationale: ברך എന്ന ധാതുവിൽനിന്നുള്ള നിഷ്ക്രിയ കൃദന്തരൂപം ഉടമ്പടിയനുഗ്രഹത്തിന്റെ പശ്ചാത്തലത്തിലാണ്. ‘അനുഗൃഹീതൻ’ ദൈവിക അനുഗ്രഹത്തിന്റെ പ്രഖ്യാപനസ്വഭാവം നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ വാഗ്ദാനപരമായ ശക്തി ‘ആയിരിക്കും’ വ്യക്തമാക്കുന്നു.
- source_word: אַתָּה
  choice: നീ
  rationale: ഇസ്രായേലിനെ ഉടമ്പടിയുടെ ഏകവചന അഭിസംബോധിതനായി കാണുന്ന രണ്ടാംപുരുഷ പുല്ലിംഗ ഏകവചന സർവനാമമാണിത്. മലയാളത്തിലെ ‘നീ’ ഏകവചന അഭിസംബോധന സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: בָּעִיר
  choice: നഗരത്തിൽ
  rationale: ב എന്ന സ്ഥാനസൂചക ഉപസർഗവും עִיר എന്ന നാമവും ചേർന്ന രൂപം. വയലുമായുള്ള നഗര-ഗ്രാമ്യ വൈരുധ്യം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: וּבָרוּךְ
  choice: വയലിലും നീ അനുഗൃഹീതനായിരിക്കും
  rationale: ഹീബ്രുവിലെ ബന്ധകവും ആവർത്തിച്ച അനുഗ്രഹപ്രഖ്യാപനവും മലയാളത്തിൽ ‘-ഉം’ എന്ന ചേർക്കലിലൂടെയും പൂർണ വിധേയവാക്യത്തിന്റെ ആവർത്തനത്തിലൂടെയും നിലനിർത്തി.
- source_word: בַּשָּׂדֶה
  choice: വയലിൽ
  rationale: שָׂדֶה വയൽ, തുറന്ന നാട്ടിൻപ്രദേശം, കൃഷിഭൂമി എന്നിവ സൂചിപ്പിക്കാം. ‘വയൽ’ നഗരത്തോടുള്ള മൂർത്തമായ കാർഷിക വൈരുധ്യം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ക്രിയയില്ലാത്ത അനുഗ്രഹവാക്യത്തിന്റെ കാലഭാവം
  choice: അനുഗൃഹീതനായിരിക്കും
  alternative: അനുഗൃഹീതനാകുന്നു
  rationale: ഹീബ്രുവിൽ പ്രസ്താവ്യക്രിയ ഇല്ലാത്തതിനാൽ വർത്തമാന പ്രഖ്യാപനവും ഭാവിസ്വഭാവമുള്ള വാഗ്ദാനവും വ്യാകരണപരമായി സാധ്യമാണ്. ആവർത്തനം 28-ലെ ഉടമ്പടിയനുഗ്രഹങ്ങളുടെ സന്ദർഭം വാഗ്ദാനപരമായ വായനയ്ക്ക് മുൻതൂക്കം നൽകുന്നു; മറ്റൊരു സാധുവായ വായന അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഹീബ്രുവിലെ സമാന്തരഘടനയും ഏകവചന അഭിസംബോധനയും സംരക്ഷിച്ചു; ‘അനുഗൃഹീതൻ’ എന്ന പദം ഉടമ്പടിയനുഗ്രഹത്തിന്റെ ദൈവശാസ്ത്രഭാരം നിലനിർത്തുന്നു.
