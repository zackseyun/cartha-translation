source:
  edition: WLC
  text: וּֽ/בְ/שִׁלְיָתָ֞/הּ הַ/יּוֹצֵ֣ת מִ/בֵּ֣ין רַגְלֶ֗י/הָ וּ/בְ/בָנֶ֨י/הָ֙ אֲשֶׁ֣ר תֵּלֵ֔ד כִּֽי תֹאכְלֵ֥/ם בְּ/חֹֽסֶר כֹּ֖ל בַּ/סָּ֑תֶר בְּ/מָצוֹר֙ וּ/בְ/מָצ֔וֹק אֲשֶׁ֨ר יָצִ֥יק לְ/ךָ֛ אֹיִבְ/ךָ֖ בִּ/שְׁעָרֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/057.yaml
  text: and toward her afterbirth that comes out from between her legs[a], and toward her children whom she bears, because she will eat them secretly, in the lack of everything[c][b], during the siege and distress with which your enemy will oppress you within your gates.
translation:
  language: ml
  text: തന്റെ കാലുകൾക്കിടയിൽനിന്നു പുറത്തുവരുന്ന മറുപിള്ളയോടും[a] താൻ പ്രസവിക്കുന്ന മക്കളോടും അവൾ കരുണ കാണിക്കുകയില്ല; കാരണം, സകലത്തിന്റെയും അഭാവത്തിൽ[b], നിന്റെ ശത്രു നിന്റെ പട്ടണങ്ങളിൽ[c] നിന്നെ ഞെരുക്കുന്ന ഉപരോധത്തിന്റെയും ദുരിതത്തിന്റെയും സമയത്ത് അവൾ അവരെ രഹസ്യമായി തിന്നും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മറുപിള്ള’ എന്നത് പ്രസവശേഷം പുറത്തുവരുന്ന പ്ലാസെന്റയെയോ പ്രസവാനന്തര അവശിഷ്ടത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘എല്ലാറ്റിനും ക്ഷാമം നേരിടുന്നതിനാൽ.’ ഈ പ്രയോഗം ഉപരോധകാലത്തെ അത്യന്തമായ ദൗർലഭ്യത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥം ‘നിന്റെ കവാടങ്ങളിൽ.’ ഇവിടെ പട്ടണകവാടങ്ങളുടെ ഘടന മാത്രമല്ല, ഉപരോധിക്കപ്പെട്ട പട്ടണങ്ങളാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: שִׁלְיָתָהּ
  choice: അവളുടെ മറുപിള്ള
  rationale: പ്രസവശേഷം പുറത്തുവരുന്ന പ്ലാസെന്റയെയോ പ്രസവാനന്തര അവശിഷ്ടത്തെയോ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ മലയാളപദമാണ് ‘മറുപിള്ള’.
- source_word: הַיּוֹצֵת מִבֵּין רַגְלֶיהָ
  choice: തന്റെ കാലുകൾക്കിടയിൽനിന്നു പുറത്തുവരുന്ന
  rationale: പ്രസവത്തിന്റെ ശാരീരിക യാഥാർഥ്യം മറച്ചുവയ്ക്കാതെ എബ്രായത്തിലെ നേരിട്ടുള്ള വിവരണം നിലനിർത്തുന്നു.
- source_word: וּבְבָנֶיהָ אֲשֶׁר תֵּלֵד
  choice: താൻ പ്രസവിക്കുന്ന മക്കളോടും
  rationale: בנים ഇവിടെ ആൺമക്കളിൽ മാത്രം ഒതുങ്ങാതെ സന്തതികളെ പൊതുവായി സൂചിപ്പിക്കുന്നതിനാൽ ‘മക്കൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: כִּי תֹאכְלֵם
  choice: കാരണം ... അവൾ അവരെ ... തിന്നും
  rationale: כִּי കാരണബന്ധവും אכל എന്ന സാധാരണ ക്രിയയുടെ ഞെട്ടിക്കുന്ന നേർമ്മയും സംരക്ഷിക്കുന്നു.
- source_word: בְּחֹסֶר כֹּל
  choice: സകലത്തിന്റെയും അഭാവത്തിൽ
  rationale: ഉപരോധകാലത്തെ സമ്പൂർണ ദൗർലഭ്യം സൂചിപ്പിക്കുകയും എബ്രായത്തിലെ ‘എല്ലാറ്റിന്റെയും അഭാവം’ എന്ന ഘടനയോട് അടുത്തുനിൽക്കുകയും ചെയ്യുന്നു.
- source_word: בַּסָּתֶר
  choice: രഹസ്യമായി
  rationale: മറ്റുള്ളവരിൽനിന്നു മറച്ചുവെച്ച് ചെയ്യുന്ന പ്രവൃത്തിയെന്ന ക്രിയാവിശേഷണാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְּמָצוֹר וּבְמָצוֹק
  choice: ഉപരോധത്തിന്റെയും ദുരിതത്തിന്റെയും സമയത്ത്
  rationale: മָצוֹר എന്നത് നഗരത്തെ വളഞ്ഞുള്ള ഉപരോധത്തെയും מָצוֹק അതുണ്ടാക്കുന്ന കടുത്ത ഞെരുക്കത്തെയും സൂചിപ്പിക്കുന്നു; രണ്ട് പദങ്ങളുടെയും വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר יָצִיק לְךָ אֹיִבְךָ
  choice: നിന്റെ ശത്രു ... നിന്നെ ഞെരുക്കുന്ന
  rationale: צוּק എന്ന ക്രിയയിലെ സമ്മർദപ്പെടുത്തൽ, ഇടുക്കത്തിലാക്കൽ എന്നീ ശക്തമായ ഭാവങ്ങൾ ‘ഞെരുക്കുക’ പകർത്തുന്നു.
- source_word: בִּשְׁעָרֶיךָ
  choice: നിന്റെ പട്ടണങ്ങളിൽ
  rationale: അക്ഷരാർഥം ‘നിന്റെ കവാടങ്ങളിൽ’ എന്നാണെങ്കിലും, ഇവിടെ കവാടങ്ങളാൽ സംരക്ഷിക്കപ്പെട്ട പട്ടണങ്ങളെയാണ് പ്രയോഗം സൂചിപ്പിക്കുന്നത്; അർഥം മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കി, എബ്രായരൂപകം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
theological_decisions:
- issue: വാക്യം മുൻവാക്യത്തിലെ ‘കരുണ കാണിക്കുകയില്ല’ എന്ന ആശയത്തെ തുടരുമെന്ന വ്യാകരണബന്ധം
  choice: ‘അവൾ കരുണ കാണിക്കുകയില്ല’ എന്നു മുഖ്യവാക്യത്തിൽ പൂരിപ്പിച്ചു
  alternative: ‘... മറുപിള്ളയോടും ... മക്കളോടും’ എന്ന അപൂർണ തുടർച്ചയായി മാത്രം നൽകുക
  rationale: എബ്രായവാക്യം 56-ാം വാക്യത്തിലെ ക്രിയാഭാവത്തെ ആശ്രയിച്ചാണ് ആരംഭിക്കുന്നത്. മലയാളത്തിൽ ഒറ്റവാക്യമായി വായിക്കുമ്പോൾ ബന്ധം വ്യക്തമാക്കാൻ മുൻവാക്യത്തിലെ ആശയം പൂരിപ്പിക്കുന്നു; പുതിയ ദൈവശാസ്ത്രവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. മൂലത്തിലെ ഞെട്ടിക്കുന്ന ശാരീരിക വിവരണം മയപ്പെടുത്താതെ നിലനിർത്തിയിട്ടുണ്ട്. മുൻവാക്യത്തിൽനിന്നുള്ള ആശ്രിതഘടന ഒറ്റവാക്യവായനയ്ക്കായി വ്യക്തമായി പൂരിപ്പിച്ചിട്ടുണ്ട്.
