reference: Deuteronomy 28:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בָ֧אוּ עָלֶ֛י/ךָ כָּל הַ/בְּרָכ֥וֹת הָ/אֵ֖לֶּה וְ/הִשִּׂיגֻ֑/ךָ כִּ֣י תִשְׁמַ֔ע בְּ/ק֖וֹל יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/002.yaml
  text: And all these blessings will come upon you and overtake you[a], if you obey the voice of Yahweh your God.
translation:
  language: ml
  text: നിന്റെ ദൈവമായ യഹ്‌വേയുടെ സ്വരം നീ അനുസരിച്ചാൽ, ഈ അനുഗ്രഹങ്ങളെല്ലാം നിന്റെമേൽ വന്ന് നിന്നെ പിന്തുടർന്ന് പിടിച്ചെത്തും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നിന്റെ ദൈവമായ യഹ്‌വേയുടെ സ്വരം നീ ശ്രദ്ധിച്ചു കേട്ടാൽ.” “സ്വരം കേൾക്കുക” എന്ന ഹീബ്രു പ്രയോഗം സാധാരണയായി അനുസരണത്തോടെയുള്ള പ്രതികരണത്തെയും ഉൾക്കൊള്ളുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאוּ עָלֶיךָ
  choice: നിന്റെമേൽ വന്ന്
  rationale: וּבָאוּ ഭാവിയിലെ ഫലത്തെ സൂചിപ്പിക്കുന്നു; עָלֶיךָയിലെ ‘മേൽ’ എന്ന ദിശാഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: כָּל הַבְּרָכוֹת הָאֵלֶּה
  choice: ഈ അനുഗ്രഹങ്ങളെല്ലാം
  rationale: നിർദ്ദേശകവും സമഗ്രതയും ചേർന്ന ഹീബ്രു നാമപദസമുച്ചയം വ്യക്തവും സ്വാഭാവികവുമായി പകരുന്നു.
- source_word: וְהִשִּׂיגֻךָ
  choice: നിന്നെ പിന്തുടർന്നു പിടിക്കും
  rationale: נשׂג എന്ന ക്രിയയുടെ ‘പിന്നാലെ എത്തി പിടിക്കുക/മറികടന്ന് എത്തുക’ എന്ന സജീവ ദൃശ്യഭാവം ‘പിന്തുടർന്നു പിടിക്കും’ എന്ന പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: כִּי
  choice: എങ്കിൽ
  rationale: ഈ അനുഗ്രഹവാക്യത്തിന്റെ സന്ദർഭത്തിൽ ഉടമ്പടിസംബന്ധമായ നിബന്ധനയെ സൂചിപ്പിക്കുന്നതിനാൽ വ്യവസ്ഥാർഥം സ്വീകരിച്ചു.
- source_word: תִשְׁמַע בְּקוֹל
  choice: സ്വരം നീ അനുസരിച്ചാൽ
  rationale: ശബ്ദാർത്ഥത്തിൽ ‘സ്വരം കേൾക്കുക’ എന്നാണെങ്കിലും ഈ ഹീബ്രു പ്രയോഗം അനുസരണത്തോടെയുള്ള കേൾവിയെ സൂചിപ്പിക്കുന്നു; ‘സ്വരം’ നിലനിർത്തിക്കൊണ്ട് ‘അനുസരിക്കുക’ എന്ന അർഥം വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: രണ്ടാംപുരുഷ ഏകവചനത്തിലെ ഉടമ്പടിബന്ധം ‘നിന്റെ ദൈവം’ എന്ന ആശയത്തിലൂടെ നിലനിർത്തുന്നു; മലയാള വാക്യഘടനയ്ക്കായി ബന്ധക രൂപം ഉപയോഗിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് ഉള്ളതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ, സാധാരണ പണ്ഡിതോചിതമായ ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- issue: שׁמע בְּקוֹל എന്ന ഉടമ്പടിപ്രയോഗത്തിന്റെ ശക്തി
  choice: സ്വരം അനുസരിക്കുക
  alternative: സ്വരം കേൾക്കുക
  rationale: പ്രയോഗത്തിൽ വെറും ശ്രവണമല്ല, അനുസരണപരമായ പ്രതികരണവും ഉൾപ്പെടുന്നു. എന്നാൽ ‘സ്വരം’ എന്ന മൂലരൂപം നിലനിർത്തി പ്രയോഗത്തിന്റെ ദൃശ്യവും ബന്ധപരവുമായ ഭാവം സംരക്ഷിച്ചു.
- issue: כִּי എന്നതിന്റെ ബന്ധം
  choice: നിബന്ധനാർഥം—‘എങ്കിൽ’
  alternative: കാരണം; എപ്പോൾ
  rationale: 28:1-ലെ നിബന്ധനയും തുടർന്നുള്ള അനുഗ്രഹഫലവും പരിഗണിക്കുമ്പോൾ ഇവിടെ ‘എങ്കിൽ’ എന്നതാണ് ഏറ്റവും യോജിച്ചത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ‘പിന്തുടർന്നു പിടിക്കും’ എന്നത് അനുഗ്രഹങ്ങൾ പിന്നാലെയെത്തി കൈവരിക്കുന്നതിന്റെ സജീവ ഹീബ്രു ദൃശ്യഭാവം നിലനിർത്തുന്നു. ഏകവചന അഭിസംബോധനയായ ‘നീ/നിന്റെ/നിന്നെ’ സംരക്ഷിച്ചു.
