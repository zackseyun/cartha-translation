translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമേറിയ മലയാളം. ഉപരോധകാലത്തെ ഭീകരമായ സ്വഭാവമാറ്റം സൂചിപ്പിക്കുന്ന വാക്യത്തിന്റെ കടുപ്പവും അവസാനത്തെ തുടർച്ചാസൂചക രേഖയും നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട മുഖ്യപാഠഭാഗങ്ങളിൽ ചേർത്തിട്ടുണ്ട്.
