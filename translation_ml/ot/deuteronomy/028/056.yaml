  text: הָ/רַכָּ֨ה בְ/ךָ֜ וְ/הָ/עֲנֻגָּ֗ה אֲשֶׁ֨ר לֹא נִסְּתָ֤ה כַף רַגְלָ/הּ֙ הַצֵּ֣ג עַל הָ/אָ֔רֶץ מֵ/הִתְעַנֵּ֖ג וּ/מֵ/רֹ֑ךְ תֵּרַ֤ע עֵינָ/הּ֙ בְּ/אִ֣ישׁ חֵיקָ֔/הּ וּ/בִ/בְנָ֖/הּ וּ/בְ/בִתָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/056.yaml
  text: The tender and delicate woman among you[a], who has not ventured to set the sole of her foot on the ground because of delicacy and tenderness, her eye will be evil toward the husband of her embrace[b], and toward her son and her daughter—
translation:
  language: ml
  text: നിങ്ങളുടെ ഇടയിൽ മൃദുലയും സുഖലാളിതയുമായ സ്ത്രീ—സുഖലാളിത്യവും മൃദുത്വവും നിമിത്തം തന്റെ ഉള്ളങ്കാൽ നിലത്ത് വെക്കാൻപോലും ശ്രമിച്ചിട്ടില്ലാത്തവൾ—താൻ മാറോടു ചേർക്കുന്ന ഭർത്താവിനോടും[a] തന്റെ മകനോടും മകളോടും ദുഷ്ടനോട്ടത്തോടെ നോക്കും[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘അവളുടെ മാറിലെ പുരുഷൻ’; ഭർത്താവിനെ സൂചിപ്പിക്കുന്ന അടുപ്പമുള്ള ദാമ്പത്യപ്രയോഗം.
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രു പ്രയോഗം അക്ഷരാർഥത്തിൽ ‘അവളുടെ കണ്ണ് ദുഷ്ടമാകും’ എന്നാണ്; ശത്രുതയോടെ അല്ലെങ്കിൽ സ്വാർഥമായി എന്തെങ്കിലും നൽകാതെ വിലക്കിവെക്കുന്ന മനോഭാവത്തോടെ നോക്കുക എന്ന അർഥം വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרַכָּה
  choice: അത്യന്തം മൃദുലയും
  rationale: רך സൂചിപ്പിക്കുന്ന മൃദുത്വവും സുഖസൗകര്യങ്ങളിൽ വളർന്ന സ്വഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; തുടർന്നുള്ള വിവരണത്തിന്റെ തീവ്രത അറിയിക്കാൻ ‘അത്യന്തം’ ചേർത്തു.
- source_word: וְהָעֲנֻגָּה
  choice: സുഖലാളിതയുമായ
  rationale: ענג എന്ന പദത്തിലെ സുഖഭോഗത്താൽ ലാളിക്കപ്പെട്ട, അതിനാൽ അതിസൂക്ഷ്മയായ അവസ്ഥയെ ‘സുഖലാളിത’ സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר לֹא נִסְּתָה כַף רַגְלָהּ הַצֵּג עַל הָאָרֶץ
  choice: തന്റെ ഉള്ളങ്കാൽ നിലത്തു വെക്കാൻപോലും ശ്രമിച്ചിട്ടില്ലാത്തവൾ
  rationale: נִסְּתָה എന്നതിന്റെ ‘ശ്രമിക്കുക/തുനിയുക’ എന്ന സാധ്യതയിൽ ‘ശ്രമിച്ചിട്ടില്ല’ തിരഞ്ഞെടുത്തു; כף רגל എന്ന ശാരീരിക ദൃശ്യത്തെ ‘ഉള്ളങ്കാൽ’ എന്നു നിലനിർത്തി.
- source_word: מֵהִתְעַנֵּג וּמֵרֹךְ
  choice: മൃദുലതയും സുഖലാളിത്യവും നിമിത്തം
  rationale: מן ഘടകങ്ങളുടെ കാരണാർഥം ‘നിമിത്തം’ വഴി വ്യക്തമാക്കുകയും മുൻപുള്ള ഇരട്ട വിവരണത്തിന്റെ പ്രതിധ്വനി നിലനിർത്തുകയും ചെയ്തു.
- source_word: תֵּרַע עֵינָהּ
  choice: ദുഷ്ടദൃഷ്ടിയോടെ പെരുമാറും
  rationale: അക്ഷരാർഥമായ ‘അവളുടെ കണ്ണ് ദുഷ്ടമാകും’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ദൃശ്യഭാവം ‘ദുഷ്ടദൃഷ്ടി’യിൽ നിലനിർത്തുന്നു; ശത്രുതയോ സ്വാർഥമായി വിലക്കിവെക്കലോ എന്ന വ്യാപ്തി അടിക്കുറിപ്പിൽ വിശദീകരിക്കുന്നു.
- source_word: בְּאִישׁ חֵיקָהּ
  choice: താൻ മാറോടു ചേർക്കുന്ന ഭർത്താവിനോടും
  rationale: ‘അവളുടെ മടിയിലെ/മാറിലെ പുരുഷൻ’ എന്ന അടുപ്പമുള്ള ദാമ്പത്യപ്രയോഗം മലയാളത്തിൽ മനസ്സിലാകുന്ന വിധം പുനരാവിഷ്കരിക്കുന്നു; വെറും ‘ഭർത്താവ്’ എന്നു നിരപ്പാക്കുന്നില്ല.
- source_word: וּבִבְנָהּ וּבְבִתָּהּ
  choice: തന്റെ മകനോടും മകളോടും
  rationale: മകനെയും മകളെയും പ്രത്യേകം പറയുന്ന ഹീബ്രു രൂപം പൊതുവായ ‘മക്കൾ’ എന്നാക്കി മാറ്റാതെ നിലനിർത്തി.
