reference: Deuteronomy 28:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: יְקִֽימְ/ךָ֨ יְהוָ֥ה ל/וֹ֙ לְ/עַ֣ם קָד֔וֹשׁ כַּ/אֲשֶׁ֖ר נִֽשְׁבַּֽע לָ֑/ךְ כִּ֣י תִשְׁמֹ֗ר אֶת מִצְוֺת֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/הָלַכְתָּ֖ בִּ/דְרָכָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/009.yaml
  text: Yahweh will establish you for himself as a holy people[a], just as he swore to you, if you keep the commandments of Yahweh your God and walk in his ways.
translation:
  language: ml
  text: നീ നിന്റെ ദൈവമായ യഹോവയുടെ കല്പനകൾ അനുസരിക്കുകയും അവന്റെ വഴികളിൽ നടക്കുകയും ചെയ്താൽ, യഹോവ നിന്നോടു സത്യം ചെയ്തതുപോലെ നിന്നെ തനിക്കായി വിശുദ്ധജനമായി സ്ഥാപിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “നീ നിന്റെ ദൈവമായ യഹോവയുടെ കല്പനകൾ അനുസരിക്കുകയും അവന്റെ വഴികളിൽ നടക്കുകയും ചെയ്യുന്നതിനാൽ.” എബ്രായത്തിലെ ബന്ധകപദത്തിന് കാരണാർഥവും വരാം; എന്നാൽ ഇവിടെ സന്ദർഭം വ്യവസ്ഥാർഥത്തെ കൂടുതൽ അനുകൂലിക്കുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְקִימְךָ
  choice: നിന്നെ ... ഉറപ്പിച്ചുനിർത്തും
  rationale: קום എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ ശാരീരികമായി എഴുന്നേല്പിക്കുക എന്നതല്ല, ഉടമ്പടിപരമായ പദവിയിൽ സ്ഥാപിച്ച് നിലനിർത്തുക എന്ന അർഥത്തിലാണ്.
- source_word: לּוֹ
  choice: തനിക്കായി
  rationale: യഹോവയോടുള്ള ബന്ധവും അവന്റെ സ്വന്തജനമായുള്ള വേർതിരിവും ദാതൃ/ഉടമസ്ഥതാസൂചനയുള്ള സർവനാമം പ്രകടമാക്കുന്നു.
- source_word: לְעַם קָדוֹשׁ
  choice: വിശുദ്ധജനമായി
  rationale: ഫലമായി ലഭിക്കുന്ന ഉടമ്പടിപരമായ ജനപദവി സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: כַּאֲשֶׁר נִשְׁבַּע לָךְ
  choice: നിന്നോടു സത്യംചെയ്തതുപോലെ
  rationale: മുമ്പ് ചെയ്ത സത്യപ്രതിജ്ഞയോടുള്ള വാഗ്ദാനത്തിന്റെ പൊരുത്തം സംരക്ഷിക്കുന്നു.
- source_word: כִּי
  choice: ചെയ്താൽ
  rationale: ആശീർവാദ-ശാപ സന്ദർഭത്തിൽ അനുസരണത്തെ വ്യവസ്ഥയായി അവതരിപ്പിക്കുന്ന സാധ്യതയാണ് മുഖ്യവായന; മലയാളത്തിൽ സ്വാഭാവികമായ വ്യവസ്ഥാരൂപം ഉപയോഗിച്ചു.
- source_word: תִשְׁמֹר
  choice: അനുസരിക്കുകയും
  rationale: കല്പനകളോടൊപ്പം שׁמר എന്നത് അവയെ കാത്തുപാലിക്കുക/ആചരിക്കുക എന്ന അർഥം നൽകുന്നു; ആധുനിക മലയാളത്തിൽ ‘അനുസരിക്കുക’ വ്യക്തമാണ്.
- source_word: מִצְוֺת
  choice: കല്പനകൾ
  rationale: ഉടമ്പടിപരവും നിയമപരവുമായ ഔപചാരിക ഭാവം നിലനിർത്തുന്ന പതിവ് മലയാള പദം.
- source_word: וְהָלַכְתָּ בִּדְרָכָיו
  choice: അവന്റെ വഴികളിൽ നടക്കുകയും
  rationale: ദൈവത്തിന്റെ വെളിപ്പെടുത്തിയ ഇഷ്ടപ്രകാരമുള്ള ജീവിതത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം വിവർത്തനത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: വ്യക്തിപരവും ഉടമ്പടിപരവുമായ ‘നിന്റെ ദൈവം’ എന്ന ബന്ധസൂചന സ്വാഭാവിക മലയാളവാക്യഘടനയിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ആശീർവാദവാക്യത്തിലെ כִּי എന്ന ബന്ധകത്തിന്റെ വ്യവസ്ഥാർഥം
  choice: ‘അനുസരിക്കുകയും ... നടക്കുകയും ചെയ്താൽ’ എന്ന വ്യവസ്ഥാവായന
  alternative: ‘അനുസരിക്കുന്നതിനാൽ’ എന്ന കാരണവായന
  rationale: ആവർത്തനപുസ്തകത്തിലെ ആശീർവാദ-ശാപ ഘടനയും വാക്യഘടനയും യഥാർഥ വ്യവസ്ഥയെ അനുകൂലിക്കുന്നു; എങ്കിലും എബ്രായബന്ധകത്തിന് കാരണാർഥവും സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘വിശുദ്ധജനം’, ‘കല്പനകൾ’, ‘വഴികളിൽ നടക്കുക’ എന്നീ ഉടമ്പടിപരമായ മുഖ്യപ്രയോഗങ്ങൾ നിലനിർത്തി. വ്യവസ്ഥാവാക്യം മലയാളത്തിൽ ആദ്യം വെച്ചത് വ്യക്തതയ്ക്കായാണ്; ഇതിലൂടെ എബ്രായത്തിലെ അർഥബന്ധം മാറ്റുന്നില്ല.
