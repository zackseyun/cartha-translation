translation:
  language: ml
  text: കൂടാതെ, ഈ ന്യായപ്രമാണപുസ്തകത്തിൽ എഴുതിയിട്ടില്ലാത്ത സകല രോഗവും സകല ബാധയും[a] നീ നശിച്ചുപോകുന്നതുവരെ യഹ്‌വേ നിന്റെമേൽ വരുത്തും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ബാധ” എന്നതിന് “പ്രഹരം” അല്ലെങ്കിൽ “മഹാമാരി” എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദത്തിന് അടി, പ്രഹരം, മഹാമാരി, അല്ലെങ്കിൽ അടിച്ചേൽപ്പിക്കപ്പെടുന്ന ദുരന്തം എന്നീ അർഥങ്ങൾ ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: കൂടാതെ
  rationale: ശാപങ്ങളുടെ പട്ടികയിലേക്ക് മറ്റൊരു കാര്യംകൂടി ചേർക്കുന്ന പദത്തിന്റെ സങ്കലനാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: כָּל חֳלִי
  choice: സകല രോഗവും
  rationale: חֳלִי എന്നത് രോഗം, അസുഖം എന്നീ വിശാലാർഥങ്ങളിൽ വരുന്നു; ഇവിടെ ‘രോഗം’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וְכָל מַכָּה
  choice: സകല ബാധയും
  rationale: מַכָּה എന്നതിന് പ്രഹരം, മുറിവ്, മഹാമാരി, ദുരന്തബാധ എന്നീ അർഥങ്ങൾ വരാം. ‘ബാധ’ അതിനെ മഹാമാരിയിലേക്കു മാത്രം ചുരുക്കാതെ വിശാലത നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר לֹא כָתוּב
  choice: എഴുതിയിട്ടില്ലാത്ത
  rationale: എബ്രായത്തിലെ നിഷേധാത്മകമായ കർമണി വിശേഷണവാക്യത്തെ ചുരുക്കവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: בְּסֵפֶר הַתּוֹרָה הַזֹּאת
  choice: ഈ ന്യായപ്രമാണപുസ്തകത്തിൽ
  rationale: സֵפֶר എന്ന ഗ്രന്ഥസൂചനയും הַתּוֹרָה എന്ന നിയമ/ന്യായപ്രമാണ ആശയവും മലയാളത്തിലെ പരിചിതവും ഗൗരവമുള്ളതുമായ സംയുക്തപദത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: יַעְלֵם
  choice: വരുത്തും
  rationale: עלה എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ ഒരാളുടെമേൽ എന്തെങ്കിലും വരുത്തുക എന്ന കാരണാർഥത്തിലാണ്; മലയാളത്തിൽ ‘നിന്റെമേൽ വരുത്തും’ സ്വാഭാവികമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ ശബ്ദലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: עָלֶיךָ
  choice: നിന്റെമേൽ
  rationale: വിധിയായി ചുമത്തപ്പെടുന്ന രോഗങ്ങളും ബാധകളും വ്യക്തിയുടെമേൽ വരുന്നു എന്ന എബ്രായ പ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: עַד הִשָּׁמְדָךְ
  choice: നീ നശിച്ചുപോകുന്നതുവരെ
  rationale: വിധിയുടെ അന്തിമപരിധി സൂചിപ്പിക്കുന്ന infinitive construct-ന്റെ ശക്തി നിലനിർത്തുന്നു; ‘നശിച്ചുപോകുക’ കടുപ്പം കുറയ്ക്കാതെയും സമ്പൂർണ ഉന്മൂലനം എന്ന അധികവ്യാഖ്യാനം ചേർക്കാതെയും അർഥം നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ, ഒരു സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നു പകരാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സകല’യും ‘ന്യായപ്രമാണപുസ്തകം’യും നിയമ-ഉടമ്പടി പശ്ചാത്തലത്തിന് യോജിച്ച ഔപചാരികത നൽകുന്നു; വാക്യഘടന സാധാരണ വായനക്കാർക്കും ഗ്രഹിക്കാവുന്നവിധം ലളിതമാക്കി.
