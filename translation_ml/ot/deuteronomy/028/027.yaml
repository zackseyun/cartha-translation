revisions:
- from: യഹോവ നിന്നെ ഈജിപ്തിലെ പരുക്കൾകൊണ്ടും മുഴകൾകൊണ്ടും ചൊറിയുള്ള വ്രണങ്ങൾകൊണ്ടും കടുത്ത ചൊറിച്ചിൽകൊണ്ടും പ്രഹരിക്കും; അവയിൽനിന്ന് നിനക്കു സൗഖ്യം പ്രാപിക്കാൻ കഴിയുകയില്ല.[a]
  to: യാഹ്‌വേ നിന്നെ ഈജിപ്തിലെ പുണ്ണുകൾകൊണ്ടും മുഴകൾകൊണ്ടും ചിരങ്ങുകൾകൊണ്ടും ചൊറിച്ചിൽകൊണ്ടും അടിക്കും; അവയിൽനിന്ന് നിനക്കു സൗഖ്യം പ്രാപിക്കാനാവുകയില്ല.[a]
  rationale: The revision aligns the divine name with the project’s Yahweh policy, makes the first and third disease terms more faithful without imposing modern medical diagnoses, preserves the uncertain broad rendering of עפלים with its lexical-alternative footnote, and retains the force of the final incurability clause in natural modern Malayalam.
