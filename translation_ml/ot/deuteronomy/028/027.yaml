  variant: modern standard Malayalam
source:
  edition: WLC
  text: יַכְּ/כָ֨ה יְהוָ֜ה בִּ/שְׁחִ֤ין מִצְרַ֨יִם֙ ו/ב/עפלים וּ/בַ/גָּרָ֖ב וּ/בֶ/חָ֑רֶס אֲשֶׁ֥ר לֹא תוּכַ֖ל לְ/הֵרָפֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/027.yaml
  text: Yahweh will strike you with the boils of Egypt[a], and with tumors, and with scabs, and with itch, from which you cannot be healed.
translation:
  language: ml
  text: യാഹ്‌വേ നിന്നെ ഈജിപ്തിലെ പുണ്ണുകൾകൊണ്ടും മുഴകൾകൊണ്ടും ചിരങ്ങുകൾകൊണ്ടും ചൊറിച്ചിൽകൊണ്ടും അടിക്കും; അവയിൽനിന്ന് നിനക്കു സൗഖ്യം പ്രാപിക്കാനാവുകയില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മുഴകൾ’ എന്നതിന് ‘മൂലക്കുരുക്കൾ’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദത്തിന്റെ അർഥം അനിശ്ചിതമാണ്. അത് മലദ്വാരപ്രദേശത്തെ വീക്കങ്ങളെ കൂടുതൽ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַכְּכָה
  choice: നിന്നെ ... പ്രഹരിക്കും
  rationale: נכה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം നേരിട്ടുള്ള പ്രഹരണമോ ബാധിക്കലോ സൂചിപ്പിക്കുന്നു; ‘പ്രഹരിക്കും’ ദൈവിക നടപടിയുടെ ശക്തി നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകുന്നു.
- source_word: בִּשְׁחִין מִצְרַיִם
  choice: ഈജിപ്തിലെ പരുക്കൾകൊണ്ട്
  rationale: שְׁחִין വീക്കവും പഴുപ്പുമുള്ള ത്വഗ്രോഗത്തെയോ പരുവിനെയോ സൂചിപ്പിക്കുന്നു; രോഗവിഭാഗം സ്വാഭാവികമായി പ്രകടമാക്കാൻ മലയാളത്തിൽ ബഹുവചനം ഉപയോഗിക്കുന്നു; ഈജിപ്തുമായുള്ള ബന്ധവും നിലനിർത്തുന്നു.
- source_word: וּבְעפלים
  choice: മുഴകൾകൊണ്ട്
  rationale: עפלים എന്ന പദത്തിന്റെ കൃത്യമായ രോഗനിർണയം അനിശ്ചിതമാണ്; ‘മുഴകൾ’ എന്ന വിശാലമായ പദം അതിനെ അനാവശ്യമായി പ്രത്യേകീകരിക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: וּבַגָּרָב
  choice: ചൊറിയുള്ള വ്രണങ്ങൾകൊണ്ട്
  rationale: גָּרָב ചിരങ്ങോ പൊറ്റപിടിച്ച ത്വഗ്രോഗമോ സൂചിപ്പിക്കുന്നു; സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന വിധം രോഗലക്ഷണം വ്യക്തമാക്കുന്നു.
- source_word: וּבֶחָרֶס
  choice: കടുത്ത ചൊറിച്ചിൽകൊണ്ട്
  rationale: חֶרֶס ചൊറിച്ചിലുണ്ടാക്കുന്ന ത്വഗ്രോഗത്തെ സൂചിപ്പിക്കുന്നു; ആധുനികമായ ഒരു പ്രത്യേക രോഗനാമം അനിശ്ചിതമായി ചുമത്താതെ പ്രധാന ലക്ഷണം നൽകുന്നു.
- source_word: אֲשֶׁר לֹא תוּכַל לְהֵרָפֵא
  choice: അവയിൽനിന്ന് നിനക്കു സൗഖ്യം പ്രാപിക്കാൻ കഴിയുകയില്ല
  rationale: നിഫാൽ രൂപത്തിന്റെ സൗഖ്യം പ്രാപിക്കുക എന്ന അകർമക/കർമണി ഭാവവും രോഗങ്ങളുടെ ചികിത്സിക്കാനാവാത്ത അവസ്ഥയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: വാചകത്തിലുള്ള വ്യക്തിനാമത്തെ ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണരൂപം ഉപയോഗിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. രോഗപ്പട്ടികയുടെ ആവർത്തനഘടന നിലനിർത്തിയിട്ടുണ്ട്; അനിശ്ചിതമായ വൈദ്യശാസ്ത്രപരമായ തിരിച്ചറിയലുകൾ അമിതമായി നിർണയിച്ചിട്ടില്ല.
