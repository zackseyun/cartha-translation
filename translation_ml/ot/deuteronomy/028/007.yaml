language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: יִתֵּ֨ן יְהוָ֤ה אֶת אֹיְבֶ֨י/ךָ֙ הַ/קָּמִ֣ים עָלֶ֔י/ךָ נִגָּפִ֖ים לְ/פָנֶ֑י/ךָ בְּ/דֶ֤רֶךְ אֶחָד֙ יֵצְא֣וּ אֵלֶ֔י/ךָ וּ/בְ/שִׁבְעָ֥ה דְרָכִ֖ים יָנ֥וּסוּ לְ/פָנֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/007.yaml
  text: Yahweh will give your enemies who rise up against you defeated before you[a]. By one way they will come out against you[b], and by seven ways they will flee before you.
translation:
  language: ml
  text: നിനക്കെതിരെ എഴുന്നേൽക്കുന്ന നിന്റെ ശത്രുക്കളെ യാഹ്‌വേ നിന്റെ മുമ്പിൽ പരാജിതരായി ഏൽപ്പിക്കും.[a] ഒരു വഴിയിലൂടെ അവർ നിനക്കെതിരെ പുറപ്പെട്ടുവരും; ഏഴു വഴികളിലൂടെ അവർ നിന്റെ മുമ്പിൽ ഓടിപ്പോകും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നിനക്കെതിരെ എഴുന്നേൽക്കുന്ന നിന്റെ ശത്രുക്കളെ യാഹ്‌വേ നിന്റെ മുമ്പിൽ പരാജിതരായി കൈമാറും.”'
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം “ഒരു വഴിയിലൂടെ ... ഏഴു വഴികളിലൂടെ”; ശത്രുക്കൾ ഒറ്റക്കെട്ടായി വരുകയും പല ദിക്കുകളിലായി ചിതറിയോടുകയും ചെയ്യുന്ന ദൃശ്യമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: יִתֵּן
  choice: ഏൽപ്പിക്കും
  rationale: נתן എന്നതിന് അടിസ്ഥാനമായി ‘കൊടുക്കുക’ എന്നാണർഥം; ഇവിടെ സൈനികസന്ദർഭത്തിൽ ‘കൈയിൽ ഏൽപ്പിക്കുക’ എന്ന ആശയമാണ്. മലയാളത്തിൽ ‘ഏൽപ്പിക്കും’ എന്നത് ആ സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായ ‘യഹോവ’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: אֹיְבֶיךָ
  choice: നിന്റെ ശത്രുക്കളെ
  rationale: രണ്ടാംപുരുഷ ഏകവചന പ്രത്യയത്തോടുകൂടിയ ബഹുവചനം നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: הַקָּמִים עָלֶיךָ
  choice: നിനക്കെതിരെ എഴുന്നേൽക്കുന്ന
  rationale: קום + על എന്ന ശത്രുതാസൂചക പ്രയോഗത്തിന്റെ രൂപകത്വവും വൈരഭാവവും നിലനിർത്തുന്നു; ‘ആക്രമിക്കുന്ന’ എന്നു ചുരുക്കി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: נִגָּפִים
  choice: പരാജിതരായി
  rationale: നിഫാൽ പങ്കുപദം അടിയേറ്റ് തോൽക്കുകയോ പരാജിതരാകുകയോ ചെയ്യുന്ന അവസ്ഥ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ഈ വാക്യഘടനയോടൊപ്പം ‘പരാജിതരായി’ സ്വാഭാവികവും വിശാലാർഥമുള്ളതുമാണ്.
- source_word: לְפָנֶיךָ
  choice: നിന്റെ മുമ്പിൽ / നിന്റെ മുമ്പിൽനിന്ന്
  rationale: ആദ്യപ്രയോഗത്തിൽ പരാജയം സംഭവിക്കുന്ന ബന്ധപരമായ വേദിയെയും രണ്ടാമത്തേതിൽ പിൻവാങ്ങുന്ന ദിശയെയും സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കുന്നു.
- source_word: בְּדֶרֶךְ אֶחָד
  choice: ഒരു വഴിയിലൂടെ
  rationale: דרך എന്നതിന്റെ ‘വഴി’ എന്ന ദൃശ്യരൂപവും തുടർന്നുള്ള ‘ഏഴു വഴികൾ’ എന്ന പ്രതിവിരുദ്ധ സമാന്തരതയും സംരക്ഷിക്കുന്നു.
- source_word: יֵצְאוּ אֵלֶיךָ
  choice: നിനക്കെതിരെ പുറപ്പെട്ടുവരും
  rationale: യുദ്ധസന്ദർഭത്തിലെ יצא אל എന്ന പ്രയോഗത്തിന്റെ ‘എതിരെ പുറപ്പെടുക’ എന്ന വൈരാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וּבְשִׁבְעָה דְרָכִים
  choice: എന്നാൽ ഏഴു വഴികളിലൂടെ
  rationale: എബ്രായത്തിലെ സംഖ്യയും വഴികളുടെ ദൃശ്യരൂപവും നിലനിർത്തുന്നു; ‘എന്നാൽ’ ഏകീകൃത മുന്നേറ്റവും ചിതറിയോടലും തമ്മിലുള്ള വൈരുധ്യം വ്യക്തമാക്കുന്നു.
- source_word: יָנוּסוּ
  choice: ഓടിപ്പോകും
  rationale: נוס എന്ന ക്രിയയുടെ ഭയന്നോടുന്ന ശക്തി ‘പിൻവാങ്ങും’ എന്നതിനെക്കാൾ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമത്തെ ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരാൽ പകരാതെ സംരക്ഷിച്ചു. മലയാള ബൈബിൾഭാഷയിൽ സാധാരണ വായനക്കാർക്ക് സുപരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം തിരഞ്ഞെടുത്തു; ഉച്ചാരണപുനർനിർമ്മാണത്തെക്കുറിച്ചുള്ള അനിശ്ചിതത്വം കണക്കിലെടുത്ത് ‘യാഹ്‌വേ’യും സാധുവായ മറ്റൊരു ലിപ്യന്തരണമാണ്.
- issue: יִתֵּן ... נִגָּפִים എന്ന ഘടന
  choice: പരാജിതരായി ഏൽപ്പിക്കും
  alternative: പരാജയപ്പെടുത്തി നിന്റെ കൈയിൽ ഏൽപ്പിക്കും
  rationale: ശത്രുക്കളെ ‘കൊടുക്കുകയും’ അവർ ‘പരാജിതരായിരിക്കുകയും’ ചെയ്യുന്ന മൂലഘടന സംരക്ഷിക്കുന്നു. ദൈവം നേരിട്ട് പരാജയപ്പെടുത്തുന്നു എന്ന് ക്രിയാത്മകമായി വികസിപ്പിക്കുന്ന മറ്റുവായന സാധ്യമെങ്കിലും മൂലത്തിലെ വ്യാകരണപരമായ സംഘർഷം അത് ഭാഗികമായി പരിഹരിച്ചുകളയും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യം. ‘എഴുന്നേൽക്കുന്ന’, ‘ഒരു വഴി/ഏഴു വഴികൾ’ എന്നീ മൂലരൂപങ്ങൾ നിലനിർത്തിക്കൊണ്ട് സൈനികസന്ദർഭം വ്യക്തമായി വായിക്കാവുന്ന വിധത്തിൽ രൂപപ്പെടുത്തി.
