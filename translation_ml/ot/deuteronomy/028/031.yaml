id: DEU.28.31
reference: Deuteronomy 28:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: שׁוֹרְ/ךָ֞ טָב֣וּחַ לְ/עֵינֶ֗י/ךָ וְ/לֹ֣א תֹאכַל֮ מִמֶּ/נּוּ֒ חֲמֹֽרְ/ךָ֙ גָּז֣וּל מִ/לְּ/פָנֶ֔י/ךָ וְ/לֹ֥א יָשׁ֖וּב לָ֑/ךְ צֹֽאנְ/ךָ֙ נְתֻנ֣וֹת לְ/אֹיְבֶ֔י/ךָ וְ/אֵ֥ין לְ/ךָ֖ מוֹשִֽׁיעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/031.yaml
  text: Your ox will be slaughtered before your eyes[a], but you will not eat any of it; your donkey will be seized from before you and will not be returned to you; your flock will be given to your enemies[b], and there will be no one to save you.
translation:
  language: ml
  text: നിന്റെ കാളയെ നിന്റെ കൺമുന്നിൽ അറുക്കും; എന്നാൽ അതിൽനിന്ന് നീ ഒന്നും ഭക്ഷിക്കുകയില്ല. നിന്റെ കഴുതയെ നിന്റെ കൺമുന്നിൽനിന്ന് ബലമായി പിടിച്ചുകൊണ്ടുപോകും[a]; അത് നിന്റെ അടുക്കൽ തിരിച്ചുവരികയില്ല. നിന്റെ ആട്ടിൻപറ്റത്തെ നിന്റെ ശത്രുക്കൾക്ക് ഏല്പിച്ചുകൊടുക്കും; നിന്നെ രക്ഷിക്കാൻ ആരും ഉണ്ടാകുകയില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കവർന്നുകൊണ്ടുപോകും’; എബ്രായപദം ബലപ്രയോഗത്തോടെയുള്ള കവർച്ചയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘നിനക്ക് ഒരു രക്ഷകനും ഉണ്ടാകുകയില്ല’ അല്ലെങ്കിൽ ‘നിന്നെ വിടുവിക്കാൻ ആരും ഉണ്ടാകുകയില്ല.’
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹרְךָ
  choice: നിന്റെ കാള
  rationale: തൊഴിലിനായി ഉപയോഗിക്കുന്ന ഒറ്റ ഗോവിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സന്ദർഭോചിതവുമായ മലയാളപ്രയോഗം.
- source_word: טָבוּחַ
  choice: അറുക്കും
  rationale: മൃഗത്തെ ഭക്ഷണത്തിനായി അറുക്കുക എന്ന טבח-ന്റെ പ്രത്യേക അർഥം നിലനിർത്തുന്നു; ശാപവാക്യങ്ങളുടെ ഭാവികാലബലം മലയാളത്തിൽ ക്രിയയിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: לְעֵינֶיךָ
  choice: നിന്റെ കൺമുന്നിൽ
  rationale: സംഭവം ഉടമയുടെ സാന്നിധ്യത്തിൽ പരസ്യമായി നടക്കുന്നതും അതിലൂടെ ഉണ്ടാകുന്ന നിസ്സഹായതയും പ്രകടമാക്കുന്ന സ്വാഭാവിക മലയാളശൈലി.
- source_word: מִמֶּנּוּ
  choice: അതിൽനിന്ന് ... ഒന്നും
  rationale: അറുക്കപ്പെട്ട കാളയിൽനിന്ന് ഉടമയ്ക്ക് യാതൊരു ഭക്ഷണവും ലഭിക്കില്ലെന്ന പൂർണനിഷേധം വ്യക്തമായി നൽകുന്നു.
- source_word: חֲמֹרְךָ
  choice: നിന്റെ കഴുത
  rationale: ആധുനിക മലയാളത്തിലെ നേരിട്ടുള്ള സാധാരണ പദം.
- source_word: גָּזוּל
  choice: ബലമായി പിടിച്ചുകൊണ്ടുപോകും
  rationale: ഗזל എന്ന പദത്തിലെ ബലപ്രയോഗത്തോടെയുള്ള കവർച്ചയുടെ ഭാവം വെറും ‘മോഷ്ടിക്കും’ എന്നതിനെക്കാൾ വ്യക്തമായി സൂക്ഷിക്കുന്നു.
- source_word: מִלְּפָנֶיךָ
  choice: നിന്റെ കൺമുന്നിൽനിന്ന്
  rationale: ഉടമയുടെ സാന്നിധ്യത്തിൽനിന്നുതന്നെ മൃഗത്തെ അപഹരിക്കുന്ന ദൃശ്യതയും അപമാനവും നിലനിർത്തുന്നു.
- source_word: יָשׁוּב לָךְ
  choice: അത് നിന്റെ അടുക്കൽ തിരിച്ചുവരികയില്ല
  rationale: എബ്രായത്തിലെ സജീവക്രിയയായ ‘തിരിച്ചുവരിക’ നേരിട്ട് നിലനിർത്തുകയും ആരാണ് തിരികെ നൽകേണ്ടത് എന്നു അനാവശ്യമായി നിർണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: צֹאנְךָ
  choice: നിന്റെ ആട്ടിൻപറ്റം
  rationale: ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടാവുന്ന കൂട്ടത്തെ ഏകകമായി സൂചിപ്പിക്കുന്നു; ‘ചെമ്മരിയാടുകൾ’ എന്നു മാത്രം പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: נְתֻנוֹת
  choice: ഏല്പിച്ചുകൊടുക്കും
  rationale: ശത്രുക്കളുടെ കൈവശത്തിലേക്ക് വിട്ടുകൊടുക്കപ്പെടുക എന്ന ഭീഷണാർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לְאֹיְבֶיךָ
  choice: നിന്റെ ശത്രുക്കൾക്ക്
  rationale: ഉടമ്പടി-ശാപസന്ദർഭത്തിലെ אֹיֵב എന്ന പദത്തിന്റെ സാധാരണവും കൃത്യവുമായ തർജമ.
- source_word: וְאֵין לְךָ מוֹשִׁיעַ
  choice: നിന്നെ രക്ഷിക്കാൻ ആരും ഉണ്ടാകുകയില്ല
  rationale: מוֹשִׁיעַ എന്ന കർത്തൃനാമത്തിന്റെ വ്യക്തിപരമായ ‘രക്ഷിക്കുന്നവൻ’ എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: അവസാന ഉപവാക്യത്തിലെ രക്ഷാഭാഷ
  choice: നിന്നെ രക്ഷിക്കാൻ ആരും ഉണ്ടാകുകയില്ല
  alternative: നിനക്ക് ഒരു രക്ഷകനും ഉണ്ടാകുകയില്ല / നിന്നെ വിടുവിക്കാൻ ആരും ഉണ്ടാകുകയില്ല
  rationale: ישע ധാതുവിൽനിന്നുള്ള מוֹשִׁיעַ ഇവിടെ ശത്രുക്കളിൽനിന്നും നഷ്ടത്തിൽനിന്നുമുള്ള സാഹചര്യപരമായ രക്ഷയെ സൂചിപ്പിക്കുന്നു. ‘രക്ഷിക്കുക’ എന്ന നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; അതിനെ നിത്യരക്ഷയെക്കുറിച്ചുള്ള പ്രത്യേക സിദ്ധാന്തപ്രസ്താവനയായി വികസിപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഏകവചന രണ്ടാംപുരുഷസംബോധന തുടർച്ചയായി പാലിച്ചു. മൂലത്തിലെ ദൃശ്യമായ ആവർത്തനം (‘നിന്റെ കൺമുന്നിൽ’) സാധ്യമായത്ര നിലനിർത്തി. ഇംഗ്ലീഷ് consultation layer-ൽ [a], [b] അടയാളങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങളിൽനിന്ന് മാറിയിരുന്നതിനാൽ മലയാള മുഖ്യപാഠത്തിൽ യഥാക്രമം ‘ബലമായി പിടിച്ചുകൊണ്ടുപോകും’, ‘രക്ഷിക്കാൻ ആരും’ എന്നീ ബന്ധപ്പെട്ട സ്ഥാനങ്ങളിൽ ചേർത്തു.
