lexical_decisions:
- source_word: כָּל
  choice: സകല
  rationale: തുടർന്ന് പറയുന്ന വൃക്ഷങ്ങളെയും നിലത്തിലെ ഫലങ്ങളെയും സമഗ്രമായി ഉൾക്കൊള്ളുന്ന പരിമാണപദം.
- source_word: עֵצְךָ
  choice: നിന്റെ സകല വൃക്ഷങ്ങളെയും
  rationale: കാർഷികസന്ദർഭത്തിൽ עֵץ എന്നത് ‘വൃക്ഷം’ എന്നാണ്; כָּל ചേർന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചനരൂപം സ്വീകരിച്ചു.
- source_word: וּפְרִי אַדְמָתֶךָ
  choice: നിന്റെ നിലത്തിലെ ഫലങ്ങളെയും
  rationale: פְּרִי എന്നതിന്റെ ഫലം/വിളവ് എന്ന അർഥവും אַדָמָה എന്നതിന്റെ നിലം/മണ്ണ് എന്ന ദൃശ്യഭാവവും നിലനിർത്തുന്നു.
- source_word: יְיָרֵשׁ
  choice: കൈവശമാക്കും
  rationale: ירשׁ എന്ന ക്രിയയുടെ ‘കൈവശപ്പെടുത്തുക’ എന്ന അടിസ്ഥാനബലം സംരക്ഷിക്കുന്നു; കീടബാധമൂലമുള്ള നാശം സന്ദർഭത്തിൽ സൂചിതമാണെങ്കിലും ‘തിന്നുകളയും’ എന്ന് വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: הַצְּלָצַל
  choice: ചീവീട്
  rationale: കൃത്യമായി തിരിച്ചറിയാനാകാത്ത ഒരു പ്രത്യേക ശബ്ദമുണ്ടാക്കുന്ന കീടത്തെ സൂചിപ്പിക്കുന്ന പദം. ‘ചീവീട്’ സാദ്ധ്യമായ നിർദിഷ്ട വിവർത്തനമായി മുഖ്യപാഠത്തിൽ നൽകി, അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
