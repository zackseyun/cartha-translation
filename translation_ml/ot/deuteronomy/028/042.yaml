  text: നിന്റെ സകല വൃക്ഷങ്ങളെയും നിന്റെ നിലത്തിലെ ഫലങ്ങളെയും ചീവീട്[a] കൈവശമാക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വെട്ടുക്കിളി,’ ‘പുൽച്ചാടി,’ അല്ലെങ്കിൽ പൊതുവായി ‘മൂളുന്ന കീടം’; צְלָצַל എന്ന എബ്രായപദം സൂചിപ്പിക്കുന്ന കീടം ഏതാണെന്ന് ഉറപ്പില്ല.
