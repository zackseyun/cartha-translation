language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בָּנִ֥ים וּ/בָנ֖וֹת תּוֹלִ֑יד וְ/לֹא יִהְי֣וּ לָ֔/ךְ כִּ֥י יֵלְכ֖וּ בַּ/שֶּֽׁבִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/041.yaml
  text: You will father sons and daughters[a], but they will not remain yours[b], because they will go into captivity.
translation:
  language: ml
  text: നിനക്കു പുത്രന്മാരും പുത്രിമാരും ജനിക്കും; എന്നാൽ അവർ നിനക്കുള്ളവരായി തുടരുകയില്ല[a]. കാരണം അവർ തടവിലേക്കു പോകും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘അവർ നിനക്കുള്ളവരായിരിക്കുകയില്ല.’'
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘അവർ പ്രവാസത്തിലേക്കു പോകും.’ എബ്രായപദം പ്രത്യേകമായി തടവിനെയോ ബന്ദിതാവസ്ഥയെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנִים וּבָנוֹת
  choice: പുത്രന്മാരും പുത്രിമാരും
  rationale: എബ്രായം ആൺമക്കളെയും പെൺമക്കളെയും പ്രത്യേകം പരാമർശിക്കുന്നതിനാൽ പൊതുവായ ‘മക്കൾ’ എന്നതിനു പകരം ആ യുഗ്മം നിലനിർത്തുന്നു.
- source_word: תּוֹלִיד
  choice: നിനക്കു ... ജനിക്കും
  rationale: ഇത് ילד എന്ന ധാതുവിന്റെ ഹിഫീൽ, രണ്ടാം പുരുഷ ഏകവചന പുല്ലിംഗ രൂപമാണ്. ‘നീ ജനിപ്പിക്കും’ എന്നത് കൂടുതൽ അക്ഷരാർഥപരമാണെങ്കിലും ആധുനിക മലയാളത്തിൽ അസ്വാഭാവികമാകാം; ‘നിനക്കു ... ജനിക്കും’ എന്നത് സന്താനോൽപാദനത്തിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְלֹא יִהְיוּ לָךְ
  choice: എന്നാൽ അവർ നിനക്കുള്ളവരായി തുടരുകയില്ല
  rationale: അക്ഷരാർഥം ‘അവർ നിനക്കുള്ളവരായിരിക്കുകയില്ല’ എന്നാണ്. തുടർന്നുള്ള തടവിലേക്കുള്ള പോക്ക് മൂലമുണ്ടാകുന്ന വേർപാടും നഷ്ടവും ‘തുടരുകയില്ല’ വ്യക്തമാക്കുന്നു; ഉടമസ്ഥത മാത്രം സൂചിപ്പിക്കുന്ന ഭാഷ ഒഴിവാക്കുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: മക്കൾ നിനക്കുള്ളവരായി തുടരാത്തതിന്റെ കാരണം അവതരിപ്പിക്കുന്ന കാരണബന്ധകമായി ഇവിടെ പ്രവർത്തിക്കുന്നു.
- source_word: יֵלְכוּ
  choice: അവർ ... പോകും
  rationale: הלך എന്ന ക്രിയയുടെ സജീവരൂപം നേരിട്ട് നിലനിർത്തുന്നു. സാഹചര്യത്തിൽ ബലമായ നാടുകടത്തൽ ഉൾപ്പെട്ടാലും ‘കൊണ്ടുപോകപ്പെടും’ എന്ന കർമണിപ്രയോഗം മൂലപാഠത്തിൽ വ്യക്തമല്ല.
- source_word: בַּשֶּׁבִי
  choice: തടവിലേക്കു
  rationale: שֶׁבִי യുദ്ധത്തടവിനെയോ ബന്ദിതാവസ്ഥയെയോ സൂചിപ്പിക്കുന്നു. ‘തടവിലേക്കു പോകും’ എന്നത് എബ്രായപ്രയോഗത്തിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ മലയാളരൂപമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പുത്രന്മാരും പുത്രിമാരും’ എന്ന യുഗ്മം മൂലപാഠത്തിന്റെ വാചകപൂർണത നിലനിർത്തുന്നു; ഉടമസ്ഥതയുടെ കടുപ്പം കുറയ്ക്കാതെ ബന്ധവിയോഗത്തിന്റെ സന്ദർഭാർഥവും സംരക്ഷിക്കുന്നു.
