source:
  edition: WLC
  text: וּ/נְתָֽנְ/ךָ֨ יְהוָ֤ה לְ/רֹאשׁ֙ וְ/לֹ֣א לְ/זָנָ֔ב וְ/הָיִ֨יתָ֙ רַ֣ק לְ/מַ֔עְלָ/ה וְ/לֹ֥א תִהְיֶ֖ה לְ/מָ֑טָּה כִּֽי תִשְׁמַ֞ע אֶל מִצְוֺ֣ת יְהוָ֣ה אֱלֹהֶ֗י/ךָ אֲשֶׁ֨ר אָנֹכִ֧י מְצַוְּ/ךָ֛ הַ/יּ֖וֹם לִ/שְׁמֹ֥ר וְ/לַ/עֲשֽׂוֹת־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/013.yaml
  text: And Yahweh will make you the head and not the tail[a], and you will be only above, and you will not be beneath, if you listen to the commandments of Yahweh your God that I am commanding you today, to keep and to do them.
translation:
  language: ml
  text: യഹോവ നിന്നെ തലയാക്കും, വാലാക്കുകയില്ല; നീ മുകളിൽ മാത്രമായിരിക്കും, താഴെയായിരിക്കുകയുമില്ല—ഇന്നു ഞാൻ നിന്നോടു കല്പിക്കുന്ന നിന്റെ ദൈവമായ യഹോവയുടെ കല്പനകൾ കേൾക്കുകയും അവ പാലിക്കുകയും അനുഷ്ഠിക്കുകയും ചെയ്താൽ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּנְתָנְךָ יְהוָה
  choice: യഹോവ നിന്നെ ... ആക്കും
  rationale: נתן എന്നതിന് അടിസ്ഥാനമായി ‘കൊടുക്കുക/വെക്കുക’ എന്നാണെങ്കിലും, ‘തല, വാലല്ല’ എന്ന വിധേയപൂരകങ്ങളോടുകൂടിയ ഈ പ്രയോഗത്തിൽ ഒരാളെ ഒരു നിലയിലാക്കുക എന്ന കാരണാർഥമാണ്. സ്വാഭാവികമായ മലയാളത്തിൽ ‘ആക്കും’ അത് വ്യക്തമാക്കുന്നു.
- source_word: לְרֹאשׁ וְלֹא לְזָנָב
  choice: വാലല്ല, തലയാക്കും
  rationale: ‘തല’, ‘വാൽ’ എന്നീ എബ്രായ രൂപകങ്ങൾ മുൻനിരയിലെയും താഴ്ന്ന നിലയിലെയും സ്ഥാനം സൂചിപ്പിക്കുന്നു. അവയെ വിശദീകരിച്ച് പരത്താതെ അതേ രൂപകങ്ങളായി നിലനിർത്തുന്നു.
- source_word: וְהָיִיתָ רַק לְמַעְלָה וְלֹא תִהְיֶה לְמָטָּה
  choice: നീ താഴെയല്ല, മുകളിൽമാത്രമായിരിക്കും
  rationale: למעלה/למטה എന്ന സ്ഥാനരൂപകങ്ങളുടെ നേരിട്ടുള്ള വൈരുധ്യം ‘മുകളിൽ/താഴെ’ എന്ന് സൂക്ഷിക്കുന്നു; רק എന്ന ഊന്നൽ ‘മാത്രം’കൊണ്ട് പ്രകടമാക്കുന്നു.
- source_word: כִּי תִשְׁמַע אֶל
  choice: അനുസരിച്ചുകേൾക്കുകയും ... ചെയ്താൽ
  rationale: כי ഇവിടെ ഉടമ്പടിയനുഗ്രഹത്തിന്റെ നിബന്ധന അവതരിപ്പിക്കുന്നു. שמע אל അക്ഷരാർഥത്തിൽ ‘കേൾക്കുക’ ആണെങ്കിലും സന്ദർഭത്തിൽ അനുസരണയോടെയുള്ള കേൾവിയാണ്; ‘അനുസരിച്ചുകേൾക്കുക’ ഇരുവശവും സൂക്ഷിക്കുന്നു.
- source_word: מִצְוֺת
  choice: കല്പനകൾ
  rationale: מצוה എന്ന ഉടമ്പടിപദത്തിന് ആധുനികവും ഗൗരവമുള്ളതുമായ നേരിട്ടുള്ള മലയാളസമാനപദം.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പതിവുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: യഹോവയോടു ചേർന്നുള്ള ഉടമ്പടിസംബോധന സ്വാഭാവിക മലയാളത്തിൽ ‘നിന്റെ ദൈവമായ യഹോവ’ എന്നു നൽകുന്നു.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: ഞാൻ ഇന്നു നിന്നോടു കല്പിക്കുന്ന
  rationale: പങ്കാളിക്രിയയുടെ ഇപ്പോഴത്തെ, തുടരുന്ന പ്രസംഗബലം ‘കല്പിക്കുന്ന’ എന്നതിലും דברים ഗ്രന്ഥത്തിലെ പ്രാധാന്യമുള്ള ‘ഇന്നു’ എന്നതിലും നിലനിർത്തുന്നു.
- source_word: לִשְׁמֹר וְלַעֲשׂוֹת
  choice: പ്രമാണിച്ച് അനുഷ്ഠിക്കുകയും
  rationale: ശ്രദ്ധയോടെ പാലിക്കുക, പ്രവൃത്തിയിൽ നടപ്പാക്കുക എന്നീ രണ്ടു വ്യത്യസ്ത ക്രിയാഭാവങ്ങളും സ്വാഭാവിക മലയാളത്തിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: כִּי അവതരിപ്പിക്കുന്ന ഉടമ്പടിനിബന്ധന
  choice: '... ചെയ്താൽ'
  alternative: '... ചെയ്യുന്നതിനാൽ / കാരണം'
  rationale: അനുഗ്രഹപ്രഖ്യാപനത്തിന്റെ ഈ സന്ദർഭത്തിൽ כי നിബന്ധനയാണ് അവതരിപ്പിക്കുന്നത്. ‘ചെയ്താൽ’ എന്നത് വാക്യത്തിന്റെ ഉടമ്പടിസംബന്ധമായ തർക്കക്രമം വ്യക്തമാക്കുന്നു; വാചകം പറയുന്നതിലപ്പുറം യോഗ്യതയാലുള്ള പ്രതിഫലം എന്ന ആശയം ചേർക്കുന്നില്ല.
- issue: שמע אל എന്നതിലെ കേൾവിയും അനുസരണവും
  choice: അനുസരിച്ചുകേൾക്കുക
  alternative: അനുസരിക്കുക
  rationale: വെറും ശ്രവണത്തേക്കാൾ അനുസരണമാണ് ഉടമ്പടിസന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്നത്; അതേസമയം ‘കേൾക്കുക’ എന്ന മൂലപദത്തിന്റെ രൂപകവും പൂർണമായി ഇല്ലാതാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്കു വ്യക്തവുമായ ശൈലി. ‘തല/വാൽ’, ‘മുകളിൽ/താഴെ’ എന്നീ മൂലരൂപകങ്ങൾ സംരക്ഷിച്ചു. ദീർഘമായ നിബന്ധനാഭാഗം മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമപ്രകാരം ആദ്യം വെച്ചു; അതിനാൽ മൂലത്തിലെ പ്രഖ്യാപനക്രമം അടിക്കുറിപ്പിൽ നൽകി.
