language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בָּנֶ֨י/ךָ וּ/בְנֹתֶ֜י/ךָ נְתֻנִ֨ים לְ/עַ֤ם אַחֵר֙ וְ/עֵינֶ֣י/ךָ רֹא֔וֹת וְ/כָל֥וֹת אֲלֵי/הֶ֖ם כָּל הַ/יּ֑וֹם וְ/אֵ֥ין לְ/אֵ֖ל יָדֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/032.yaml
  text: Your sons and your daughters will be given to another people[a], while your eyes look on and fail with longing for them all day long, but your hand will be powerless.
translation:
  language: ml
  text: നിന്റെ പുത്രന്മാരും പുത്രിമാരും മറ്റൊരു ജനതയ്ക്ക് നൽകപ്പെടും. നിന്റെ കണ്ണുകൾ നോക്കിനിൽക്കും; അവർക്കായി വാഞ്ഛിച്ച് അവ ദിവസം മുഴുവൻ ക്ഷയിച്ചുപോകും. എന്നാൽ നിന്റെ കൈക്ക് ഒന്നും ചെയ്യാൻ ശക്തിയുണ്ടാകില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അതു നിന്റെ കഴിവിൽ ആയിരിക്കുകയില്ല.” എബ്രായ ശൈലിയുടെ അക്ഷരാർഥം നിന്റെ കൈയിൽ ശക്തിയില്ല എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנֶיךָ וּבְנֹתֶיךָ
  choice: നിന്റെ പുത്രന്മാരും പുത്രിമാരും
  rationale: എബ്രായപാഠം ആൺമക്കളെയും പെൺമക്കളെയും പ്രത്യേകം പരാമർശിക്കുന്നതിനാൽ പൊതുവായ ‘മക്കൾ’ എന്നതിനു പകരം ഇരുവിഭാഗവും നിലനിർത്തുന്നു.
- source_word: נְתֻנִים
  choice: നൽകപ്പെടും
  rationale: ശാപപ്രഖ്യാപനത്തിന്റെ ഭാവിസന്ദർഭത്തിൽ കർമണിപ്രയോഗത്തിലുള്ള കൃദന്തത്തെ സ്വാഭാവികമായ ഭാവികാല കർമണിരൂപത്തിൽ പരിഭാഷപ്പെടുത്തി; ‘കൈമാറപ്പെടും’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ രൂപം ഒഴിവാക്കി.
- source_word: לְעַם אַחֵר
  choice: മറ്റൊരു ജനതയ്ക്ക്
  rationale: עַם എന്നത് ‘ജനം/ജനത’ എന്നും אַחֵר എന്നത് ‘മറ്റൊരു’ എന്നും നേരിട്ട് സൂചിപ്പിക്കുന്നു; ‘വിദേശജനത’ എന്നു പറഞ്ഞ് പാഠത്തിലില്ലാത്ത ഊന്നൽ ചേർത്തിട്ടില്ല.
- source_word: וְעֵינֶיךָ רֹאוֹת
  choice: നിന്റെ കണ്ണുകൾ അതു കണ്ടുകൊണ്ടിരിക്കും
  rationale: മക്കൾ കൊണ്ടുപോകപ്പെടുന്നത് മാതാപിതാവ് നിസ്സഹായനായി നേരിൽ കാണുന്ന ദൃശ്യതയും തുടർച്ചയും നിലനിർത്തുന്നു.
- source_word: וְכָלוֹת אֲלֵיהֶם
  choice: അവരെ കാത്തുകാത്ത് ... നിന്റെ കണ്ണുകൾ ക്ഷയിച്ചുപോകും
  rationale: כלה ഇവിടെ തീർന്നുപോകുക, ക്ഷയിക്കുക എന്ന ആശയം നൽകുന്നു; אֲלֵיהֶם അവരിലേക്കുള്ള ഉറ്റുനോട്ടവും ആകാംക്ഷയും സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘കാത്തുകാത്ത്’ ആ ദീർഘമായ ആകാംക്ഷ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: כָּל הַיּוֹם
  choice: ദിവസം മുഴുവൻ
  rationale: മുഴുവൻ ദിവസവും തുടരുന്ന അവസ്ഥയെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: וְאֵין לְאֵל יָדֶךָ
  choice: എന്നാൽ നിന്റെ കൈക്ക് ഒന്നും ചെയ്യാൻ ശക്തിയുണ്ടാകില്ല
  rationale: കൈയിൽ ശക്തിയില്ല എന്ന എബ്രായ ശൈലി പ്രവർത്തിക്കാൻ കഴിവില്ലാത്ത നിസ്സഹായതയെ സൂചിപ്പിക്കുന്നു. കൈ എന്ന ദൃശ്യരൂപം നിലനിർത്തിക്കൊണ്ട് അർഥം വ്യക്തമായി പറയുന്നു.
theological_decisions:
- issue: וְאֵין לְאֵל יָדֶךָ എന്ന ശൈലിയുടെ അർഥം
  choice: എന്നാൽ നിന്റെ കൈക്ക് ഒന്നും ചെയ്യാൻ ശക്തിയുണ്ടാകില്ല
  alternative: അതു നിന്റെ കഴിവിൽ ആയിരിക്കുകയില്ല
  rationale: ഇവിടെയുള്ള אֵל ദൈവത്തെക്കുറിച്ചുള്ള പ്രസ്താവനയല്ല; ശക്തിയോ കഴിവോ ഇല്ലായ്മ സൂചിപ്പിക്കുന്ന ശൈലിപ്രയോഗമാണ്. അതിനാൽ ദൈവസൂചനയായി തെറ്റിദ്ധരിക്കാത്തവിധം, എന്നാൽ ‘കൈ’ എന്ന മൂലരൂപം നിലനിർത്തി പരിഭാഷപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ശാപവാക്യത്തിന്റെ ഗൗരവവും മാതാപിതാവിന്റെ നിസ്സഹായമായ കാഴ്ചയും നിലനിർത്തിയിരിക്കുന്നു. അടിക്കുറിപ്പിന്റെ സൂചകം അതു വിശദീകരിക്കുന്ന അവസാനത്തെ എബ്രായ ശൈലിയോടു ചേർത്തിരിക്കുന്നു.
