id: DEU.28.60
reference: Deuteronomy 28:60
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הֵשִׁ֣יב בְּ/ךָ֗ אֵ֚ת כָּל מַדְוֵ֣ה מִצְרַ֔יִם אֲשֶׁ֥ר יָגֹ֖רְתָּ מִ/פְּנֵי/הֶ֑ם וְ/דָבְק֖וּ בָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/060.yaml
  text: And he will bring back upon you all the diseases of Egypt that you dreaded[c][b][a], and they will cling to you.
translation:
  language: ml
  text: നീ ഭയപ്പെട്ടിരുന്ന ഈജിപ്തിലെ സകല രോഗങ്ങളും അവൻ വീണ്ടും നിന്റെമേൽ വരുത്തും; അവ നിന്നോടു പറ്റിച്ചേരും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵשִׁיב בְּךָ
  choice: അവൻ വീണ്ടും നിന്റെമേൽ വരുത്തും
  rationale: שׁוב എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ ‘തിരികെ കൊണ്ടുവരുക/വീണ്ടും വരുത്തുക’ എന്ന കാരകാർഥം നൽകുന്നു. രോഗങ്ങൾ തിരിച്ചുവരുന്നതും അവ വ്യക്തിയുടെമേൽ ചുമത്തപ്പെടുന്നതും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כָּל מַדְוֵה מִצְרַיִם
  choice: ഈജിപ്തിലെ സകല രോഗങ്ങളും
  rationale: מַדְוֶה എന്നത് രോഗം/അസുഖം എന്നർഥമുള്ളതിനാൽ, അതിനെ കൂടുതൽ പ്രത്യേകമായി വ്യാഖ്യാനിക്കാതെ നേരിട്ട് പരിഭാഷപ്പെടുത്തി. ‘സകല’ എന്നത് כָּל എന്ന പദത്തിന്റെ സമഗ്രത നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר יָגֹרְתָּ מִפְּנֵיהֶם
  choice: നീ ഭയപ്പെട്ടിരുന്ന
  rationale: יגר ഭയത്തെയോ ഭീതിയെയോ സൂചിപ്പിക്കുന്നു. രോഗങ്ങളെ ഭയപ്പെട്ടിരുന്നതായി മലയാളത്തിൽ സ്വാഭാവികമായി പറയുന്നു; അപൂർവമായ ‘ഭീതിപ്പെട്ട’ എന്നതിനേക്കാൾ സാധാരണ വായനക്കാർക്ക് ‘ഭയപ്പെട്ടിരുന്ന’ വ്യക്തമാണ്.
- source_word: וְדָבְקוּ בָּךְ
  choice: അവ നിന്നോടു പറ്റിച്ചേരും
  rationale: דבק എന്ന പദത്തിന്റെ പറ്റിനിൽക്കുക/ചേർന്നുനിൽക്കുക എന്ന സജീവ ദൃശ്യാർഥവും രോഗങ്ങളുടെ വിട്ടുമാറാത്ത സ്വഭാവവും ‘പറ്റിച്ചേരും’ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഏകവചന രണ്ടാംപുരുഷ അഭിസംബോധന നിലനിർത്തി; ദൈവത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു മൂന്നാംപുരുഷ സർവനാമം പാഠത്തിലുള്ളതുപോലെ ‘അവൻ’ എന്നു പരിഭാഷപ്പെടുത്തി.
