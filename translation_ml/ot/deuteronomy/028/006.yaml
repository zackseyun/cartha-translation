source:
  edition: WLC
  text: בָּר֥וּךְ אַתָּ֖ה בְּ/בֹאֶ֑/ךָ וּ/בָר֥וּךְ אַתָּ֖ה בְּ/צֵאתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/006.yaml
  text: Blessed shall you be when you come in[b][a], and blessed shall you be when you go out.
translation:
  language: ml
  text: നീ അകത്തു വരുമ്പോൾ അനുഗ്രഹിക്കപ്പെട്ടവനായിരിക്കും[a][b], നീ പുറത്തേക്കു പോകുമ്പോൾ അനുഗ്രഹിക്കപ്പെട്ടവനായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘നീ’ ഏകവചനമാണ്; യിസ്രായേൽജനത്തെ ഒരു സമൂഹമെന്ന നിലയിൽ ഏകവചനത്തിൽ അഭിസംബോധന ചെയ്യുന്നു.
    reason: cultural_note
  - marker: b
    text: അല്ലെങ്കിൽ, ‘നിന്റെ പ്രവേശനത്തിൽ ... നിന്റെ പുറപ്പെടലിൽ.’ ഈ ജോടി ജീവിതത്തിന്റെയും പ്രവർത്തനങ്ങളുടെയും എല്ലാ മേഖലകളെയും സൂചിപ്പിക്കുന്ന പ്രയോഗമായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: അനുഗ്രഹിക്കപ്പെട്ടവനായിരിക്കും
  rationale: ברך എന്ന ധാതുവിന്റെ നിഷ്ക്രിയ കൃദന്തരൂപം ഇവിടെ ഉടമ്പടിയനുഗ്രഹത്തിന്റെ പ്രഖ്യാപനമായി ആഖ്യാതസ്ഥാനത്ത് നിൽക്കുന്നു. ചുറ്റുപാടിലെ ഭാവിസ്വഭാവമുള്ള ഫലപ്രഖ്യാപനത്തിന് യോജിച്ച് ‘ആയിരിക്കും’ ഉപയോഗിച്ചു.
- source_word: אַתָּה
  choice: നീ
  rationale: രണ്ടാം പുരുഷ ഏകവചന പുല്ലിംഗ സർവനാമം. യിസ്രായേലിനെ സമൂഹമെന്ന നിലയിൽ ഏകവചനത്തിൽ അഭിസംബോധന ചെയ്യുന്ന എബ്രായരൂപം ‘നീ’ നിലനിർത്തുന്നു.
- source_word: בְּבֹאֶךָ
  choice: നീ അകത്തു വരുമ്പോൾ
  rationale: ב ഉപസർഗവും בוא എന്ന ക്രിയയുടെ infinitive construct രൂപവും രണ്ടാം പുരുഷ ഏകവചന പ്രത്യയവും ചേർന്ന പ്രയോഗം. ‘അകത്തു വരുമ്പോൾ’ ചലനത്തിന്റെ അക്ഷരാർഥവും സാഹചര്യാർഥവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: וּבָרוּךְ
  choice: അനുഗ്രഹിക്കപ്പെട്ടവനായിരിക്കും
  rationale: ബന്ധകത്തോടുകൂടി അനുഗ്രഹസൂത്രം ആവർത്തിക്കുന്നു. മലയാളത്തിൽ ‘പോകുമ്പോഴും’ എന്ന ബന്ധപ്രയോഗം ഉപയോഗിച്ച് സമാന്തരതയും ആവർത്തിച്ച പൂർണപ്രഖ്യാപനവും നിലനിർത്തി.
- source_word: בְּצֵאתֶךָ
  choice: നീ പുറത്തേക്കു പോകുമ്പോൾ
  rationale: ב ഉപസർഗവും יצא എന്ന ക്രിയയുടെ infinitive construct രൂപവും രണ്ടാം പുരുഷ ഏകവചന പ്രത്യയവും ചേർന്ന പ്രയോഗം. ‘പുറത്തേക്കു പോകുമ്പോൾ’ അക്ഷരാർഥ ചലനം നിലനിർത്തുന്നു; വരവ്–പോക്ക് എന്ന ജോടിയുടെ വിശാലമായ പ്രയോഗസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: യിസ്രായേലിനോടുള്ള പ്രതിനിധാനപരമായ ഏകവചന അഭിസംബോധന
  choice: ‘നീ’ എന്ന ഏകവചനം നിലനിർത്തി.
  alternative: ‘നിങ്ങൾ’ എന്ന ബഹുവചനം ഉപയോഗിക്കുക, അല്ലെങ്കിൽ ‘യിസ്രായേൽ’ എന്നു വ്യാഖ്യാനപരമായി വികസിപ്പിക്കുക.
  rationale: എബ്രായമൂലം യിസ്രായേലിനെ ഉടമ്പടിസമൂഹമായി ഏകവചനത്തിൽ അഭിസംബോധന ചെയ്യുന്നു. ഏകവചനം നിലനിർത്തുന്നത് ഈ രൂപഭാവം സംരക്ഷിക്കുകയും വ്യാഖ്യാനപരമായ വികസനം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- issue: ‘അകത്തു വരുക / പുറത്തേക്കു പോകുക’ എന്ന ജോടിയുടെ വ്യാപ്തി
  choice: മുഖ്യപാഠത്തിൽ അക്ഷരാർഥ ജോടി നിലനിർത്തി; ജീവിതത്തിന്റെയും പ്രവർത്തനങ്ങളുടെയും സമഗ്രതയെ സൂചിപ്പിക്കാമെന്നത് അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
  alternative: ‘നിന്റെ എല്ലാ ജീവിതപ്രവർത്തനങ്ങളിലും’ എന്നു മുഖ്യപാഠത്തിൽ വ്യാഖ്യാനിച്ച് പരിഭാഷപ്പെടുത്തുക.
  rationale: ഈ ജോടി സമഗ്രജീവിതത്തെ സൂചിപ്പിക്കുന്ന മെരിസമായി പ്രവർത്തിക്കാം; എങ്കിലും അക്ഷരാർഥ ചലനവും സാധുവാണ്. അതിനാൽ മൂലത്തിലെ ബഹുവ്യാപ്തി ചുരുക്കാതെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായ സമാന്തരത നിലനിർത്താൻ അനുഗ്രഹപ്രഖ്യാപനം രണ്ടു ഖണ്ഡങ്ങളിലും ആവർത്തിച്ചു. ‘വരുമ്പോൾ/പോകുമ്പോൾ’ സ്വാഭാവിക മലയാളം നൽകുമ്പോൾ അടിക്കുറിപ്പ് അക്ഷരാർഥ ഘടനയും സാധ്യതയുള്ള മെരിസവും സംരക്ഷിക്കുന്നു.
