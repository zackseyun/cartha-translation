    rationale: “നിന്റെ പ്രവേശനത്തിൽ ... നിന്റെ പുറപ്പെടലിൽ” is clearer modern Malayalam for the literal infinitive-construction alternative while retaining the main text’s accessible ‘വരുമ്പോൾ / പോകുമ്പോൾ.’
