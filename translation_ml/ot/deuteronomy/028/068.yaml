source:
  edition: WLC
  text: וֶֽ/הֱשִֽׁיבְ/ךָ֨ יְהוָ֥ה מִצְרַיִם֮ בָּ/אֳנִיּוֹת֒ בַּ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר אָמַ֣רְתִּֽי לְ/ךָ֔ לֹא תֹסִ֥יף ע֖וֹד לִ/רְאֹתָ֑/הּ וְ/הִתְמַכַּרְתֶּ֨ם שָׁ֧ם לְ/אֹיְבֶ֛י/ךָ לַ/עֲבָדִ֥ים וְ/לִ/שְׁפָח֖וֹת וְ/אֵ֥ין קֹנֶֽה׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/068.yaml
  text: And Yahweh will bring you back to Egypt in ships[a], by the way of which I said to you, ‘You shall never see it again.’ And there you will offer yourselves for sale to your enemies as male servants and female servants, but there will be no buyer.
translation:
  language: ml
  text: യഹ്‌വെ നിന്നെ കപ്പലുകളിൽ ഈജിപ്തിലേക്കു മടക്കിക്കൊണ്ടുപോകും—‘നീ ഇനി ഒരിക്കലും അതു കാണുകയില്ല’ എന്നു ഞാൻ നിന്നോടു പറഞ്ഞ ആ വഴിയിലൂടെതന്നെ. അവിടെ നിങ്ങൾ നിങ്ങളെത്തന്നെ നിങ്ങളുടെ ശത്രുക്കൾക്കു പുരുഷ അടിമകളായും സ്ത്രീ അടിമകളായും വിൽപ്പനയ്ക്കു വെക്കും[a]; എന്നാൽ വാങ്ങാൻ ആരുമുണ്ടാകില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവിടെ നിങ്ങൾ നിങ്ങളുടെ ശത്രുക്കൾക്കു പുരുഷ അടിമകളായും സ്ത്രീ അടിമകളായും വിൽക്കപ്പെടും.’ ഹീബ്രു ക്രിയയെ ‘സ്വയം വിൽപ്പനയ്ക്കു വെക്കുക’ എന്ന പ്രതിഫലന/മധ്യമാർത്ഥത്തിലോ, കൂടുതൽ പൊതുവായി അടിമത്തത്തിലേക്കു വിൽക്കപ്പെടുക എന്ന അർഥത്തിലോ മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶהֱשִׁיבְךָ
  choice: നിന്നെ ... മടക്കിക്കൊണ്ടുപോകും
  rationale: 'שׁוב എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലെ കാരണാർത്ഥം നിലനിർത്തുന്നു: യഹ്‌വെ ജനത്തെ തിരികെ കൊണ്ടുപോകുന്നു.'
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בָּאֳנִיּוֹת
  choice: കപ്പലുകളിൽ
  rationale: בְּ ഉപസർഗവും ‘കപ്പലുകൾ’ എന്ന നാമവും ചേർന്ന പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം; കടൽമാർഗമുള്ള ഗതാഗതം സൂചിപ്പിക്കുന്നു.
- source_word: בַּדֶּרֶךְ
  choice: ആ വഴിയിലൂടെതന്നെ
  rationale: ഇവിടെ דֶּרֶךְ മടങ്ങിപ്പോകുന്ന പാതയെ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള ബന്ധവാക്യവുമായി സ്വാഭാവികമായി ചേരുന്നു.
- source_word: לֹא תֹסִיף עוֹד לִרְאֹתָהּ
  choice: നീ ഇനി ഒരിക്കലും അതു കാണുകയില്ല
  rationale: יסף + עוד എന്ന ഹീബ്രു പ്രയോഗം ഒരു പ്രവൃത്തി വീണ്ടും സംഭവിക്കില്ലെന്ന ശക്തമായ അർത്ഥം നൽകുന്നു.
- source_word: וְהִתְמַכַּרְתֶּם
  choice: സ്വയം വിൽക്കാൻ ശ്രമിക്കും
  rationale: ഹിത്പയേൽ രൂപത്തിലെ പ്രതിഫലന/മധ്യമാർത്ഥം നിലനിർത്തുകയും, വാങ്ങുന്നവരില്ലെന്ന അടുത്ത വാക്യഭാഗത്തോട് പൊരുത്തപ്പെടുന്നവിധം പൂർത്തിയായ വിൽപ്പനയല്ല, സ്വയം വിൽപ്പനയ്ക്കു വെക്കലാണ് ഉദ്ദേശ്യമെന്ന് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: לַעֲבָדִים וְלִשְׁפָחוֹת
  choice: അടിമകളായും അടിമസ്ത്രീകളായും
  rationale: പുരുഷ-സ്ത്രീ അടിമകളെ വേർതിരിച്ചുകാണിക്കുന്ന ഹീബ്രു പദജോടി സംരക്ഷിക്കുന്നു; സാമൂഹിക യാഥാർഥ്യം മൃദൂകരിക്കുന്നില്ല.
- source_word: וְאֵין קֹנֶה
  choice: എന്നാൽ വാങ്ങാൻ ആരുമുണ്ടാകില്ല
  rationale: അക്ഷരാർഥമായ ‘വാങ്ങുന്നവനില്ല’ എന്ന സാമ്പത്തിക ദൃശ്യത്തെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ, അതിനെ ഒരു പദവികൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: וְהִתְמַכַּרְתֶּם എന്ന ക്രിയയുടെ പ്രതിഫലന/നിഷ്ക്രിയ സാധ്യത
  choice: സ്വയം വിൽക്കാൻ ശ്രമിക്കും
  alternative: നിങ്ങൾ അവിടെ ശത്രുക്കൾക്ക് വിൽക്കപ്പെടും
  rationale: ഹിത്പയേൽ രൂപത്തിലെ പ്രതിഫലനമോ മധ്യമാർത്ഥമോ മുഖ്യപാഠത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു; കൂടുതൽ പൊതുവായ നിഷ്ക്രിയ ഗ്രഹണം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഏകവചന അഭിസംബോധനയിൽനിന്ന് ബഹുവചനത്തിലേക്കുള്ള ഹീബ്രു മാറ്റം (‘നിന്നെ’ / ‘നിങ്ങൾ’) ഉദ്ദേശപൂർവം നിലനിർത്തിയിരിക്കുന്നു. ‘അടിമസ്ത്രീകൾ’ എന്ന പദം പുരുഷ-സ്ത്രീ പദജോടി വ്യക്തമായി സംരക്ഷിക്കുന്നു.
