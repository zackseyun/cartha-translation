  source_fidelity: മുഖ്യവാചകത്തിലെ ‘സ്വയം വിൽക്കാൻ ശ്രമിക്കും’ ഹീബ്രു ഹിത്പയേൽ രൂപം നൽകുന്ന സ്വയം വിൽപ്പനയ്ക്കു വെക്കൽ/വിൽപ്പനയ്ക്കായി സമർപ്പിക്കൽ എന്ന അർഥത്തെക്കാൾ ‘ശ്രമം’ എന്ന അധിക ആശയം ചേർക്കുന്നു. വാങ്ങുന്നവനില്ലെന്ന തുടർവാക്യവുമായി പൊരുത്തം നിലനിർത്തിക്കൊണ്ട് ആ അധികാർഥം ഒഴിവാക്കുന്നതാണ് ഉചിതം. ഏകവചനത്തിൽനിന്ന് ബഹുവചനത്തിലേക്കുള്ള അഭിസംബോധനാമാറ്റവും, കപ്പലുകളിലൂടെ ഈജിപ്തിലേക്കു മടക്കിക്കൊണ്ടുപോകുമെന്നതും ശരിയായി സംരക്ഷിച്ചിട്ടുണ്ട്.
  naturalness: ‘നിങ്ങളെത്തന്നെ ... വിൽപ്പനയ്ക്കു വെക്കും’ ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്; അത് പൂർത്തിയായ വിൽപ്പനയെ നിർബന്ധിക്കുന്നില്ല. ‘പുരുഷ അടിമകളായും സ്ത്രീ അടിമകളായും’ എന്ന ജോടി ‘അടിമകളായും അടിമസ്ത്രീകളായും’ എന്നതിനെക്കാൾ ലിംഗസമാന്തരത കൂടുതൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
  terminology: ‘യഹ്‌വെ’ ദൈവനാമത്തിന്റെ യോജിച്ച ലിപ്യന്തരണമാണ്. ‘പുരുഷ അടിമകൾ/സ്ത്രീ അടിമകൾ’ ഹീബ്രുവിലെ עֲבָדִים / שְׁפָחוֹת എന്ന സാമൂഹിക-ലിംഗഭേദജോടിയെ വ്യക്തമായി നിലനിർത്തുന്നു. അടിക്കുറിപ്പിലെ ബദൽവായനയും ഇതേ ജോടി കൃത്യമായി പ്രതിഫലിപ്പിക്കണം.
  issues:
