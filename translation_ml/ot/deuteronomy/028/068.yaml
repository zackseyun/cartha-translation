  to: യഹ്‌വെ നിന്നെ കപ്പലുകളിൽ ഈജിപ്തിലേക്കു മടക്കിക്കൊണ്ടുപോകും—‘നീ ഇനി ഒരിക്കലും അതു കാണുകയില്ല’ എന്നു ഞാൻ നിന്നോടു പറഞ്ഞ ആ വഴിയിലൂടെതന്നെ. അവിടെ നിങ്ങൾ നിങ്ങളെത്തന്നെ നിങ്ങളുടെ ശത്രുക്കൾക്കു പുരുഷ അടിമകളായും സ്ത്രീ അടിമകളായും വിൽപ്പനയ്ക്കു വെക്കും[a]; എന്നാൽ വാങ്ങാൻ ആരുമുണ്ടാകില്ല.
  rationale: പ്രതിഫലന/മധ്യമ ഹീബ്രു ക്രിയയുടെ അർഥം നിലനിർത്തിക്കൊണ്ട് മൂലത്തിൽ ഇല്ലാത്ത ‘ശ്രമം’ ഒഴിവാക്കി. പുരുഷ-സ്ത്രീ അടിമകളുടെ പദജോടി മുഖ്യവാചകത്തിലും അടിക്കുറിപ്പിലും കൂടുതൽ കൃത്യമായി വ്യക്തമാക്കി. അടിക്കുറിപ്പ് അടയാളം ശരിയായ സ്ഥാനത്തു തുടരും.
