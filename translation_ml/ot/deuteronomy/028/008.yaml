  text: יְצַ֨ו יְהוָ֤ה אִתְּ/ךָ֙ אֶת הַ/בְּרָכָ֔ה בַּ/אֲסָמֶ֕י/ךָ וּ/בְ/כֹ֖ל מִשְׁלַ֣ח יָדֶ֑/ךָ וּ/בֵ֣רַכְ/ךָ֔ בָּ/אָ֕רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֥ן לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/008.yaml
  text: Yahweh will command the blessing on you in your storehouses and in all the work of your hand[c][b][a], and he will bless you in the land that Yahweh your God is giving you.
translation:
  language: ml
  text: യഹോവ നിനക്കായി അനുഗ്രഹം നിന്റെ സംഭരണശാലകളിലും[a] നിന്റെ കൈയുടെ എല്ലാ പ്രവൃത്തികളിലും[b] കൽപ്പിക്കും. നിന്റെ ദൈവമായ യഹോവ നിനക്കു നൽകിക്കൊണ്ടിരിക്കുന്ന[c] ദേശത്ത് അവൻ നിന്നെ അനുഗ്രഹിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘നിന്റെ ധാന്യപ്പുരകളിൽ’ അല്ലെങ്കിൽ ‘നിന്റെ കളപ്പുരകളിൽ.’
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘നിന്റെ കൈയുടെ സകല അയച്ചുനീട്ടലിലും’; നിന്റെ എല്ലാ ജോലികളെയും ഉദ്യമങ്ങളെയും സൂചിപ്പിക്കുന്ന പ്രയോഗം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘നിനക്കു നൽകുന്ന’ അല്ലെങ്കിൽ ‘നിനക്കു നൽകാനിരിക്കുന്ന.’ ഇവിടെയുള്ള എബ്രായ കൃദന്തരൂപം ഒന്നിലധികം വിധത്തിൽ പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
lexical_decisions:
- source_word: יְצַו
  choice: കല്പിക്കും
  rationale: צוה എന്ന ക്രിയയുടെ പീയേൽ രൂപം സാധാരണയായി ‘കല്പിക്കുക’ എന്നാണ്. അനുഗ്രഹത്തെ യഹോവ കല്പിക്കുന്നു എന്ന എബ്രായഭാഷയിലെ സജീവമായ പ്രയോഗം ‘നൽകും’ എന്നു ലഘൂകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ ഉടമ്പടിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: אִתְּךָ אֶת־הַבְּרָכָה
  choice: നിന്റെമേൽ അനുഗ്രഹം
  rationale: צוה എന്ന ക്രിയയോടൊപ്പം വന്നിരിക്കുന്ന אֵת/אִתְּךָ ഇവിടെ അനുഗ്രഹം അഭിസംബോധിതന്റെമേൽ നിയോഗിക്കപ്പെടുന്നു എന്ന ഗുണഭോക്തൃസൂചന നൽകുന്നു.
- source_word: בַּאֲסָמֶיךָ
  choice: നിന്റെ സംഭരണശാലകളിൽ
  rationale: אָסָם ധാന്യപ്പുരയെയോ സാധനങ്ങൾ സൂക്ഷിക്കുന്ന സംഭരണശാലയെയോ സൂചിപ്പിക്കാം. ‘സംഭരണശാലകൾ’ അർഥവ്യാപ്തി അനാവശ്യമായി ചുരുക്കാതെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וּבְכֹל מִשְׁלַח יָדֶךָ
  choice: നിന്റെ കൈ ചെയ്യുന്ന സകല പ്രവൃത്തിയിലും
  rationale: അക്ഷരാർഥത്തിൽ ‘നിന്റെ കൈയുടെ സകല അയച്ചുനീട്ടലിലും’ എന്ന എബ്രായ പ്രയോഗം ഒരാളുടെ ജോലികളെയും ഉദ്യമങ്ങളെയും സൂചിപ്പിക്കുന്നു. കൈയുടെ ദൃശ്യരൂപം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന വിധം അവതരിപ്പിക്കുന്നു.
- source_word: וּבֵרַכְךָ
  choice: അവൻ നിന്നെ അനുഗ്രഹിക്കും
  rationale: മുൻക്രിയയിലെ ഭാവികാലധാര ഇവിടെ തുടരുന്നു; യഹോവ തന്നെയാണ് കർത്താവ് എന്നത് ‘അവൻ’ വ്യക്തമാക്കുന്നു.
- source_word: בָּאָרֶץ
  choice: ദേശത്ത്
  rationale: ആവർത്തനപുസ്തകത്തിലെ വാഗ്ദത്തദേശസംബന്ധമായ ഉടമ്പടിപശ്ചാത്തലം ‘ദേശം’ നിലനിർത്തുന്നു.
- source_word: נֹתֵן לָךְ
  choice: നിനക്കു നൽകിക്കൊണ്ടിരിക്കുന്ന
  rationale: നֹתֵן എന്ന കൃദന്തരൂപത്തിന്റെ നടന്നുകൊണ്ടിരിക്കുന്നതോ സമീപസ്ഥമായതോ ആയ പ്രവർത്തനഭാവം നിലനിർത്തുന്നു; ‘നൽകുന്നു’ എന്നും ‘നൽകും’ എന്നും പരിഭാഷപ്പെടുത്താവുന്ന സന്ദർഭസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: ഉടമ്പടിദൈവത്തിന്റെ വ്യക്തിനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിലെ പരിചിതമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: ‘ദേശം’ എന്ന പദത്തിന്റെ ഉടമ്പടിസൂചന
  choice: ദേശത്ത്
  alternative: നാട്ടിൽ
  rationale: ആവർത്തനപുസ്തകത്തിൽ വാഗ്ദത്തദേശത്തെ സൂചിപ്പിക്കുന്ന θεological resonance വ്യാഖ്യാനം കൂട്ടിച്ചേർക്കാതെ ‘ദേശം’ സംരക്ഷിക്കുന്നു.
- issue: נֹתֵן എന്ന കൃദന്തരൂപത്തിന്റെ കാലഭാവം
  choice: നൽകിക്കൊണ്ടിരിക്കുന്ന
  alternative: നൽകുന്ന / നൽകാനിരിക്കുന്ന
  rationale: ദൈവം ദേശം നൽകുന്ന പ്രവൃത്തി നടന്നുകൊണ്ടിരിക്കുന്നതായോ ആസന്നമായതായോ വായിക്കാവുന്ന എബ്രായരൂപത്തിന്റെ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അനുഗ്രഹം കല്പിക്കും’ എന്ന അസാധാരണമായെങ്കിലും മനസ്സിലാകുന്ന പ്രയോഗം മൂലപാഠത്തിലെ സജീവരൂപം നിലനിർത്തുന്നു. ആദ്യവാക്യം മലയാളത്തിൽ വ്യക്തതയ്ക്കായി രണ്ട് സമാന്തര ഖണ്ഡങ്ങളാക്കി; ‘അതു’ അനുഗ്രഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
