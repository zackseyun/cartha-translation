base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/015.yaml
  text: But if you do not listen to the voice of Yahweh your God[a], to keep and to do all his commandments and his statutes that I am commanding you today[b], then all these curses will come upon you and overtake you.
translation:
  language: ml
  text: എന്നാൽ നിന്റെ ദൈവമായ യഹ്‌വേയുടെ സ്വരം നീ കേൾക്കാതെയും[a], ഞാൻ ഇന്ന് നിന്നോടു കല്പിക്കുന്ന അവന്റെ സകല കല്പനകളും ചട്ടങ്ങളും പാലിക്കാതെയും അനുഷ്ഠിക്കാതെയും ഇരുന്നാൽ[b], ഈ ശാപങ്ങളെല്ലാം നിന്റെമേൽ വന്ന് നിന്നെ പിടികൂടും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “സ്വരം കേൾക്കുക.” ഈ പ്രയോഗത്തിൽ അനുസരണയോടെ കേൾക്കുക എന്ന അർഥവും ഉൾപ്പെടുന്നു; മറ്റൊരു പരിഭാഷ: “അനുസരിക്കുക.”'
    reason: lexical_alternative
  - marker: b
    text: 'മറ്റൊരു പരിഭാഷ: “അവന്റെ സകല കല്പനകളും ചട്ടങ്ങളും പാലിക്കാനും അനുഷ്ഠിക്കാനും.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם לֹא
  choice: എന്നാൽ ... ഇരുന്നാൽ
  rationale: മുൻപുള്ള അനുഗ്രഹവിഭാഗത്തോടുള്ള വൈരുധ്യവും ഇവിടെ തുടങ്ങുന്ന നിബന്ധനയും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: תִשְׁמַע בְּקוֹל
  choice: സ്വരം നീ കേൾക്കുക
  rationale: അനുസരണയോടെ കേൾക്കുക എന്ന ആശയം ഉൾക്കൊള്ളുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ശ്രവണരൂപകം നിലനിർത്തുന്നു; ‘അനുസരിക്കുക’ എന്നു മാത്രം ചുരുക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ ഉടമ്പടിനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: രണ്ടാം പുരുഷ ഏകവചനത്തിലുള്ള ഉടമ്പടിബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: കാത്ത് അനുഷ്ഠിക്കുക
  rationale: ‘കാത്തുസൂക്ഷിക്കുക/പാലിക്കുക’ എന്നും ‘ചെയ്യുക’ എന്നും ഉള്ള രണ്ടു ക്രിയാഭാവങ്ങളും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: כָּל מִצְוֺתָיו וְחֻקֹּתָיו
  choice: അവന്റെ സകല കല്പനകളും ചട്ടങ്ങളും
  rationale: מִצְוָה, חֹק എന്നീ നിയമപദങ്ങൾ തമ്മിലുള്ള വ്യത്യാസം ‘കല്പനകൾ’, ‘ചട്ടങ്ങൾ’ എന്നിങ്ങനെ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: ഞാൻ ഇന്ന് നിന്നോടു കല്പിക്കുന്ന
  rationale: പങ്കുപദത്തിന്റെ ഇപ്പോഴത്തെ പ്രസംഗസന്ദർഭവും ‘ഇന്ന്’ എന്ന സമയഊന്നലും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: וּבָאוּ עָלֶיךָ
  choice: നിന്റെമേൽ വന്ന്
  rationale: ശാപങ്ങൾ ഒരാളുടെമേൽ വന്നുചേരുന്ന എബ്രായ രൂപകം നേരായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְהִשִּׂיגוּךָ
  choice: നിന്നെ പിടികൂടും
  rationale: പിന്തുടർന്ന് എത്തിപ്പിടിക്കുന്ന സജീവ ദൃശ്യഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ഉടമ്പടിനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു ബിരുദമായി മാറ്റാതെ മലയാളവായനക്കാർക്ക് പരിചിതമായ ലിപ്യന്തരണത്തിൽ നിലനിർത്തുന്നു.
- issue: അനുസരണത്തെ സൂചിപ്പിക്കുന്ന ശ്രവണപ്രയോഗം
  choice: യഹോവയുടെ സ്വരം കേൾക്കുക
  alternative: യഹോവയെ അനുസരിക്കുക
  rationale: കേൾവിയും അനുസരണവും തമ്മിലുള്ള ഉടമ്പടിപരമായ ബന്ധം മൂലപാഠത്തിൽ ഉള്ളതുപോലെ തുറന്ന നിലയിൽ സൂക്ഷിക്കുന്നു.
- issue: לִשְׁמֹר לַעֲשׂוֹת എന്ന ഇരട്ടപ്രയോഗം
  choice: കാത്ത് അനുഷ്ഠിക്കുക
  alternative: ശ്രദ്ധാപൂർവം ചെയ്യുക
  rationale: മൂലത്തിൽ വ്യക്തമല്ലാത്ത ‘ശ്രദ്ധാപൂർവം’ എന്ന ആശയം ചേർക്കാതെ, കാത്തുപാലിക്കലും പ്രവർത്തിയിൽ വരുത്തലും എന്നീ രണ്ടു ഘടകങ്ങളും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. നിയമ-ഉടമ്പടി പദാവലിയായ ‘കല്പനകൾ’, ‘ചട്ടങ്ങൾ’, ‘ശാപങ്ങൾ’ എന്നിവ വേർതിരിച്ച് നിലനിർത്തി; ഏകവചന അഭിസംബോധനയായ ‘നീ/നിന്റെ/നിന്നെ’ സംരക്ഷിച്ചു.
