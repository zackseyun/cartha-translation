source:
  edition: WLC
  text: גּ֖וֹי עַ֣ז פָּנִ֑ים אֲשֶׁ֨ר לֹא יִשָּׂ֤א פָנִים֙ לְ/זָקֵ֔ן וְ/נַ֖עַר לֹ֥א יָחֹֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/050.yaml
  text: a fierce-faced nation[c][b][a], one that shows no regard for the old and shows no favor to the young.
translation:
  language: ml
  text: കഠിനമുഖമുള്ള ഒരു ജനത[a]—അത് വയോധികരോട് യാതൊരു ആദരവും കാണിക്കാതെയും[b] ഇളയവരോട് യാതൊരു കനിവും കാണിക്കാതെയും ഇരിക്കും[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘മുഖത്തിൽ കഠിനതയുള്ള ഒരു ജനത.’ ‘ക്രൂരമുഖമുള്ള ഒരു ജനത’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘വയോധികരെ മാനിക്കാത്തത്’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ പ്രയോഗത്തിന്റെ അക്ഷരാർഥം ‘വയോധികന്റെ മുഖം ഉയർത്തുന്നില്ല’ എന്നാണ്.
    reason: lexical_alternative
  - marker: c
    text: ‘ഇളയവരോട് യാതൊരു കൃപയും കാണിക്കാത്തത്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: גּוֹי
  choice: ജനത
  rationale: വിദേശത്തുനിന്നുള്ള ഒരു ജനവിഭാഗത്തെയോ രാജ്യജനതയെയോ സൂചിപ്പിക്കുന്ന ഗּוֹי എന്ന പദത്തിന് ഈ ശാപസന്ദർഭത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ പരിഭാഷ.
- source_word: עַז פָּנִים
  choice: മുഖം കഠിനമായ
  rationale: ‘മുഖത്തിൽ ശക്തമായ/കഠിനമായ’ എന്ന എബ്രായ ദൃശ്യഭാഷ നിലനിർത്തിക്കൊണ്ട് ആ ജനതയുടെ നിർദയവും വഴങ്ങാത്തതുമായ ഭാവം സൂചിപ്പിക്കുന്നു; ‘ക്രൂരമായ’ എന്നു മാത്രം പരിഭാഷപ്പെടുത്തി മുഖത്തിന്റെ പ്രതിച്ഛായ നഷ്ടപ്പെടുത്തുന്നില്ല.
- source_word: אֲשֶׁר
  choice: —…തുമായ ഒരു ജനത
  rationale: മുൻപറഞ്ഞ ജനതയെ വിശദീകരിക്കുന്ന ആപേക്ഷിക ഉപവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: לֹא יִשָּׂא פָנִים לְזָקֵן
  choice: വൃദ്ധരോട് യാതൊരു ആദരവും കാണിക്കാത്തത്
  rationale: അക്ഷരാർഥത്തിൽ ‘വൃദ്ധന്റെ മുഖം ഉയർത്തുകയില്ല’ എന്ന പ്രയോഗം ഇവിടെ പരിഗണനയോ ആദരമോ കാണിക്കാതിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. വയോധികരോടുള്ള സമീപനം എന്ന സന്ദർഭത്തിൽ ‘ആദരം’ സ്വാഭാവികമാണ്.
- source_word: זָקֵן
  choice: വൃദ്ധർ
  rationale: എബ്രായ ഏകവചനം ഒരു വിഭാഗത്തെ പൊതുവായി പ്രതിനിധീകരിക്കുന്നു; മലയാളത്തിൽ ബഹുവചനരൂപം ലിംഗം അനാവശ്യമായി പരിമിതപ്പെടുത്താതെ ആ അർഥം നൽകുന്നു.
- source_word: וְנַעַר
  choice: ഇളയവർ
  rationale: נַעַר എന്നതിന് കുട്ടി മുതൽ യുവാവ് വരെ അർഥവ്യാപ്തിയുണ്ട്. זָקֵן എന്നതിനോടുള്ള വൈരുധ്യം കണക്കിലെടുത്ത് പൊതുവായ പ്രായവിഭാഗമായി ‘ഇളയവർ’ തിരഞ്ഞെടുത്തു.
- source_word: לֹא יָחֹן
  choice: യാതൊരു കനിവും കാണിക്കാത്തത്
  rationale: חנן എന്ന ധാതുവിന് കൃപയോ അനുകൂലതയോ കാണിക്കുക എന്ന അർഥമുണ്ട്. ആക്രമണകാരിയായ ജനത ഇളയവരെയും ഒഴിവാക്കുകയില്ലെന്ന സന്ദർഭത്തിൽ ‘കനിവ് കാണിക്കുക’ സ്വാഭാവികമായി അർഥം പകരുന്നു.
