translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. എബ്രായത്തിലെ സമാന്തരഘടന ‘വൃദ്ധർ/ഇളയവർ’ എന്ന പ്രായവൈരുധ്യത്തിലൂടെ നിലനിർത്തി. ‘മുഖം കഠിനമായ’ എന്ന രൂപം അല്പം അസാധാരണമായിരുന്നാലും ഉറവിടത്തിലെ മുഖദൃശ്യഭാഷ ബോധപൂർവം സംരക്ഷിക്കുന്നു.
