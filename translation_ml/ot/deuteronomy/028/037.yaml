- from: യഹ്‌വെ നിന്നെ ഓടിച്ചുകളയുന്ന സകല ജനതകളുടെയും ഇടയിൽ നീ ഭീതിജനകമായ ഒരു കാഴ്ചയായും[a] പഴഞ്ചൊല്ലായും പരിഹാസവാക്കായും[b] തീരും.[c]
  to: യഹ്‌വെ നിന്നെ തുരത്തിക്കളയുന്ന[c] സകല ജനതകളുടെയും ഇടയിൽ നീ ഭീതിയുണർത്തുന്ന ഒന്നായും[a] പഴഞ്ചൊല്ലായും പരിഹാസവാക്കായും[b] തീരും.
  rationale: The revision makes the first predicate less visually restrictive, improves the compelled-exile verb, and places its footnote marker at the relevant word. It preserves the source's threefold public-disgrace sequence, the plural ‘peoples,’ the future consequence, and the stated lexical ambiguity of נהג.
