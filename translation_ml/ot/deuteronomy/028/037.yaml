reference: Deuteronomy 28:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָיִ֣יתָ לְ/שַׁמָּ֔ה לְ/מָשָׁ֖ל וְ/לִ/שְׁנִינָ֑ה בְּ/כֹל֙ הָֽ/עַמִּ֔ים אֲשֶׁר יְנַהֶגְ/ךָ֥ יְהוָ֖ה שָֽׁמָּ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/037.yaml
  text: And you shall become an object of horror[a], a proverb[c][b], and a taunt among all the peoples where Yahweh will drive you.
translation:
  language: ml
  text: യഹ്‌വെ നിന്നെ തുരത്തിക്കളയുന്ന[c] സകല ജനതകളുടെയും ഇടയിൽ നീ ഭീതിയുണർത്തുന്ന ഒന്നായും[a] പഴഞ്ചൊല്ലായും പരിഹാസവാക്കായും[b] തീരും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അമ്പരപ്പിക്കുന്ന ഒരു കാഴ്ച.’ എബ്രായപദം അത്രമേൽ നശിപ്പിക്കപ്പെട്ടതോ ഭയാനകമായതോ ആയതിനാൽ ഭീതിയോ അമ്പരപ്പോ ഉളവാക്കുന്ന ഒന്നിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘പഴഞ്ചൊല്ല്’ എന്നും ‘പരിഹാസവാക്ക്’ എന്നും നൽകിയിരിക്കുന്ന രണ്ടുപദങ്ങൾക്കും ‘നിന്ദാവിഷയമായ ഒരു ചൊല്ല്’ എന്നും പറയാം. പൊതുനിന്ദയെ സൂചിപ്പിക്കുന്ന, പരസ്പരം ബന്ധപ്പെട്ടെങ്കിലും വ്യത്യസ്തമായ രണ്ടു പദങ്ങളാണ് എബ്രായത്തിൽ ഉള്ളത്.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘യഹ്‌വെ നിന്നെ നയിച്ചുകൊണ്ടുപോകുന്ന.’ എബ്രായക്രിയയ്ക്ക് ‘നയിക്കുക’ എന്നും ‘തുരത്തുക’ എന്നും അർഥമാകാം; ശാപത്തിന്റെ ഭാഗമായി വരുന്ന നിർബന്ധിത പ്രവാസം കണക്കിലെടുത്താണ് ഇവിടെ ‘തുരത്തിക്കളയുക’ എന്നു നൽകിയിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיִיתָ
  choice: നീ ... തീരും
  rationale: ശാപപരമ്പരയിലെ ഫലമായി വരാനിരിക്കുന്ന അവസ്ഥയെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לְשַׁמָּה
  choice: ഭീതിജനകമായ ഒരു കാഴ്ച
  rationale: വിധിന്യായസന്ദർഭത്തിൽ ഭീതിയോ അമ്പരപ്പോ ഉളവാക്കുന്ന ഒന്നിനെ സൂചിപ്പിക്കുന്നു; വ്യക്തി മറ്റുള്ളവരുടെ പ്രതികരണത്തിന് കാരണമാകുന്നു എന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: לְמָשָׁל
  choice: പഴഞ്ചൊല്ല്
  rationale: מָשָׁל എന്നതിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; പ്രതികൂലഭാവം ചുറ്റുമുള്ള ശാപസന്ദർഭത്തിൽനിന്ന് വ്യക്തമാകുന്നു.
- source_word: וְלִשְׁנִינָה
  choice: പരിഹാസവാക്ക്
  rationale: മുറിപ്പെടുത്തുന്ന പരിഹാസപ്രയോഗമെന്ന ആശയം പ്രകടമാക്കുകയും മുൻപത്തെ מָשָׁל എന്ന പദവുമായി ലയിപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: בְּכֹל הָעַמִּים
  choice: സകല ജനതകളുടെയും ഇടയിൽ
  rationale: עַמִּים എന്ന ബഹുവചനത്തിന് അടുത്തുനിൽക്കുന്ന, സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: אֲשֶׁר יְנַהֶגְךָ
  choice: നിന്നെ ഓടിച്ചുകളയുന്ന
  rationale: נהג എന്നതിന് നയിക്കുക എന്നും ഓടിക്കുക എന്നും അർഥമാകാം; പ്രവാസശാപത്തിന്റെ നിർബന്ധിതസ്വഭാവം ഇവിടെ ‘ഓടിച്ചുകളയുക’ വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: שָׁמָּה
  choice: —ലേക്ക്/അവിടെ എന്ന ആശയം ബന്ധവാക്യത്തിൽ ഉൾപ്പെടുത്തി
  rationale: ‘യഹ്‌വെ നിന്നെ ഓടിച്ചുകളയുന്ന ... ഇടയിൽ’ എന്ന മലയാളഘടനയിൽ ലക്ഷ്യസ്ഥലത്തിന്റെ ആശയം സ്വാഭാവികമായി ഉൾപ്പെടുന്നതിനാൽ ‘അവിടെ’ ആവർത്തിച്ചിട്ടില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പദവിക്കു പകരം അതിന്റെ സാധാരണ പണ്ഡിതലിപ്യന്തരണത്തെ മലയാളത്തിൽ നൽകുന്നു.
- issue: נהג എന്ന ക്രിയയിലെ നിർബന്ധിതത്വം
  choice: ഓടിച്ചുകളയുക
  alternative: നയിക്കുക
  rationale: ക്രിയയ്ക്ക് രണ്ടർഥസാധ്യതയുണ്ടെങ്കിലും ഈ ശാപത്തിന്റെയും പ്രവാസത്തിന്റെയും സന്ദർഭം ബലപ്രയോഗത്തോടെയുള്ള നീക്കത്തെ ശക്തമായി സൂചിപ്പിക്കുന്നു; മറ്റർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വായനാസൗകര്യവും നിലനിർത്തി. ‘ഭീതിജനകമായ ഒരു കാഴ്ച’ സാധാരണ വായനക്കാരന് വ്യക്തമാണ്; ‘പഴഞ്ചൊല്ല്’ എന്നും ‘പരിഹാസവാക്ക്’ എന്നും നൽകി എബ്രായത്തിലെ രണ്ടു വ്യത്യസ്ത പൊതുനിന്ദാപദങ്ങൾ വേർതിരിച്ചു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
