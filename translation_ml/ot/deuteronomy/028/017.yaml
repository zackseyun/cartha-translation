  text: Cursed shall be your basket and your kneading bowl[a].
translation:
  language: ml
  text: നിന്റെ കൊട്ടയും മാവ് കുഴയ്ക്കുന്ന പാത്രവും ശപിക്കപ്പെട്ടതായിരിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മാവ് കുഴയ്ക്കുന്ന തൊട്ടി.” മാവ് കുഴയ്ക്കാൻ ഉപയോഗിച്ചിരുന്ന ഒരു പാത്രത്തെയാണ് ഹീബ്രു പദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: ശപിക്കപ്പെട്ടതായിരിക്കും
  rationale: ഹീബ്രു നിഷ്ക്രിയ കൃദന്തരൂപം ശാപവിധി പ്രഖ്യാപിക്കുന്നു. സന്ദർഭത്തിലെ ഉടമ്പടിശാപങ്ങളുടെ ഭാവാർഥവും മലയാളത്തിലെ സ്വാഭാവികമായ പ്രഖ്യാപനശൈലിയും നിലനിർത്താൻ ഈ രൂപം സ്വീകരിച്ചു.
- source_word: טַנְאֲךָ
  choice: നിന്റെ കൊട്ട
  rationale: ഈ പദം സാധാരണയായി വിളവുൾപ്പെടെയുള്ള സാധനങ്ങൾ വഹിക്കാനോ ശേഖരിക്കാനോ ഉപയോഗിക്കുന്ന കൊട്ടയെ സൂചിപ്പിക്കുന്നു. ഉള്ളടക്കം അനാവശ്യമായി നിർണ്ണയിക്കാതെ പൊതുവായ അർഥം നിലനിർത്തുന്നു.
- source_word: וּמִשְׁאַרְתֶּךָ
  choice: മാവ് കുഴയ്ക്കുന്ന പാത്രം
  rationale: മാവ് കുഴയ്ക്കാൻ ഉപയോഗിക്കുന്ന പാത്രത്തെയാണ് ഹീബ്രു പദം സൂചിപ്പിക്കുന്നത്. പുരാതന ഉപകരണത്തിന്റെ കൃത്യമായ ആകൃതി നിർണ്ണയിക്കാതെ അതിന്റെ ഉപയോഗം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു.
