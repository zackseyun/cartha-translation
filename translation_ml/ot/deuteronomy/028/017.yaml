  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രുവിലെ സംക്ഷിപ്തമായ ഉടമ്പടിശാപപ്രഖ്യാപനം സ്വാഭാവിക മലയാളത്തിൽ പുനരാവിഷ്കരിച്ചു; പുരാതന ഗൃഹോപകരണത്തിന്റെ അർഥം പ്രവർത്തനാധിഷ്ഠിതമായി വ്യക്തമാക്കി.
