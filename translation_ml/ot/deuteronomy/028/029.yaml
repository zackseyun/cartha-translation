id: DEU.28.29
reference: Deuteronomy 28:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָיִ֜יתָ מְמַשֵּׁ֣שׁ בַּֽ/צָּהֳרַ֗יִם כַּ/אֲשֶׁ֨ר יְמַשֵּׁ֤שׁ הָ/עִוֵּר֙ בָּ/אֲפֵלָ֔ה וְ/לֹ֥א תַצְלִ֖יחַ אֶת דְּרָכֶ֑י/ךָ וְ/הָיִ֜יתָ אַ֣ךְ עָשׁ֧וּק וְ/גָז֛וּל כָּל הַ/יָּמִ֖ים וְ/אֵ֥ין מוֹשִֽׁיעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/029.yaml
  text: And you will grope at noon as the blind gropes in the darkness[a], and you will not prosper in your ways; and you will be only oppressed and robbed all the days[c][b], with no one to save you.
translation:
  language: ml
  text: കുരുടൻ ഇരുട്ടിൽ തപ്പിനടക്കുന്നതുപോലെ നീ നട്ടുച്ചയ്ക്കും തപ്പിനടക്കും[a]. നിന്റെ വഴികളിലൊന്നിലും നീ വിജയിക്കുകയില്ല[b]. എല്ലായ്പോഴും നീ പീഡിപ്പിക്കപ്പെടുകയും കൊള്ളയടിക്കപ്പെടുകയും മാത്രം ചെയ്യും; നിന്നെ രക്ഷിക്കാൻ ആരും ഉണ്ടാകുകയില്ല[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കൈകൊണ്ട് തൊട്ടുതിരിയുന്നതുപോലെ’; കാണാൻ കഴിയാത്തതിനാൽ സ്പർശിച്ച് വഴി തേടുന്നതാണ് എബ്രായക്രിയയുടെ ആശയം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘നിന്റെ വഴികളിൽ നീ അഭിവൃദ്ധിപ്പെടുകയില്ല.’
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘നിന്നെ വിടുവിക്കാൻ ആരും ഉണ്ടാകുകയില്ല’ അല്ലെങ്കിൽ ‘ഒരു വിടുവിക്കുന്നവനും ഉണ്ടാകുകയില്ല.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מְמַשֵּׁשׁ / יְמַשֵּׁשׁ
  choice: തപ്പിനടക്കും / തപ്പിനടക്കുന്നതുപോലെ
  rationale: കാണാൻ കഴിയാത്തതിനാൽ കൈകൊണ്ട് തൊട്ടുതിരയുന്ന പ്രവൃത്തിയാണ് ക്രിയ സൂചിപ്പിക്കുന്നത്. ‘തപ്പിനടക്കുക’ ശാരീരികമായ തിരച്ചിലും ദിശാബോധമില്ലായ്മയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: בַּצָּהֳרַיִם
  choice: നട്ടുച്ചയ്ക്ക്
  rationale: ദിവസത്തിലെ ഏറ്റവും പ്രകാശമുള്ള സമയത്തെ സൂചിപ്പിക്കുന്നു; ഇരുട്ടുമായുള്ള വൈരുധ്യം ‘നട്ടുച്ചയ്ക്ക്’ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: הָעִוֵּר
  choice: കുരുടൻ
  rationale: എബ്രായത്തിലെ പുല്ലിംഗ ഏകവചന വിശേഷണം ഇവിടെ നാമമായി ഉപയോഗിച്ചിരിക്കുന്നു. അതിന്റെ ഏകവചന പ്രതിനിധാനരൂപം മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בָּאֲפֵלָה
  choice: ഇരുട്ടിൽ
  rationale: ‘ഇരുട്ട്’ അഥവാ ‘അന്ധകാരം’ എന്ന അർഥം; ‘ഇരുട്ടിൽ’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും നട്ടുച്ചയോടുള്ള വൈരുധ്യം വ്യക്തമാക്കുന്നതുമാണ്.
- source_word: תַצְלִיחַ
  choice: വിജയിക്കുകയില്ല
  rationale: ഹിഫീൽ രൂപം വിജയിക്കുക, അഭിവൃദ്ധിപ്പെടുക എന്നീ വിശാല അർഥങ്ങൾ വഹിക്കുന്നു. സന്ദർഭത്തിൽ ഒരാളുടെ ഉദ്യമങ്ങൾ സഫലമാകാതിരിക്കുന്നതു വ്യക്തമാക്കാൻ ‘വിജയിക്കുകയില്ല’ തിരഞ്ഞെടുത്തു.
- source_word: אֶת דְּרָכֶיךָ
  choice: നിന്റെ വഴികളിലൊന്നിലും
  rationale: അക്ഷരാർഥം ‘നിന്റെ വഴികൾ’; ജീവിതഗതിയും ഉദ്യമങ്ങളും ഉൾപ്പെടുന്ന രൂപകം നിലനിർത്തുന്നു. നിഷേധവാക്യത്തിലെ സ്വാഭാവിക മലയാളപ്രയോഗത്തിനായി ‘ഒന്നിലും’ ചേർത്തിരിക്കുന്നു.
- source_word: אַךְ
  choice: മാത്രം
  rationale: നിയന്ത്രണവും ഊന്നലും പ്രകടമാക്കുന്ന കണം; ആ അവസ്ഥയിലേക്കു മാത്രം ചുരുങ്ങുന്നതിനെ ‘മാത്രം’ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: עָשׁוּק
  choice: പീഡിപ്പിക്കപ്പെടുകയും
  rationale: അടിച്ചമർത്തൽ, ചൂഷണം, അന്യായം എന്നിവയ്ക്കു വിധേയമാകുന്ന നിഷ്ക്രിയാവസ്ഥയെ വിശാലമായി അറിയിക്കുന്നു.
- source_word: גָזוּל
  choice: കൊള്ളയടിക്കപ്പെടുകയും
  rationale: മോഷണംകൊണ്ടോ ബലമായ പിടിച്ചെടുക്കലുകൊണ്ടോ വസ്തുക്കൾ നഷ്ടപ്പെടുത്തുന്ന നിഷ്ക്രിയാവസ്ഥയെ ശക്തമായും സ്വാഭാവികമായും പ്രകടമാക്കുന്നു.
- source_word: כָּל הַיָּמִים
  choice: എല്ലായ്പ്പോഴും
  rationale: അക്ഷരാർഥം ‘എല്ലാ ദിവസങ്ങളും’; ഇവിടെ തുടരുന്ന അവസ്ഥയാണ് ഉദ്ദേശിക്കുന്നത്. ‘എല്ലായ്പ്പോഴും’ ആ ദൈർഘ്യം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְאֵין מוֹשִׁיעַ
  choice: നിന്നെ രക്ഷിക്കാൻ ആരും ഉണ്ടാകുകയില്ല
  rationale: ഒരു രക്ഷകനോ വിടുവിക്കുന്നവനോ ഇല്ലെന്ന വ്യക്തിപരമായ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഉടമ്പടി-ശാപത്തിന്റെ ഈ സന്ദർഭത്തിൽ מוֹשִׁיעַ എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: രക്ഷിക്കാൻ
  alternative: വിടുവിക്കാൻ / മോചിപ്പിക്കാൻ
  rationale: יָשַׁע എന്ന മൂലം പൊതുവായ അപകടവിമോചനത്തെയും രക്ഷയെയും സൂചിപ്പിക്കാം. ഇവിടെ പിൽക്കാല മിശിഹായിക പദവിയർഥം നിർബന്ധിക്കുന്നില്ല; അതിനാൽ സാധാരണ രക്ഷ എന്ന അർഥം മാത്രം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ ശൈലി. എബ്രായത്തിലെ നട്ടുച്ച/ഇരുട്ട് വൈരുധ്യവും തുടർച്ചയായ പീഡനത്തിന്റെ തീവ്രതയും നിലനിർത്തി; അസ്വാഭാവികമായ അക്ഷരാനുവാദം ഒഴിവാക്കി.
