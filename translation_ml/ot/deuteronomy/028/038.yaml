source:
  edition: WLC
  text: זֶ֥רַע רַ֖ב תּוֹצִ֣יא הַ/שָּׂדֶ֑ה וּ/מְעַ֣ט תֶּאֱסֹ֔ף כִּ֥י יַחְסְלֶ֖/נּוּ הָ/אַרְבֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/038.yaml
  text: You will carry much seed out to the field[a], but you will gather in little, because the locust will consume it.
translation:
  language: ml
  text: നീ ധാരാളം വിത്ത് വയലിലേക്കു കൊണ്ടുപോകും[a]; എന്നാൽ കുറച്ചേ ശേഖരിക്കുകയുള്ളൂ, കാരണം വെട്ടുക്കിളി അതു തിന്നുതീർക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘നീ വയലിൽ ധാരാളം വിത്ത് വിതയ്ക്കും; എന്നാൽ കുറച്ചേ വിളവെടുക്കുകയുള്ളൂ.’ എബ്രായപാഠം കൂടുതൽ അക്ഷരാർഥത്തിൽ ‘ധാരാളം വിത്ത് വയലിലേക്കു കൊണ്ടുപോകും’ എന്നും ‘കുറച്ചേ ശേഖരിക്കുകയുള്ളൂ’ എന്നും പറയുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶרַע רַב
  choice: ധാരാളം വിത്ത്
  rationale: זֶרַע വിത്തിനെയും വിതയ്ക്കാനുള്ള വിത്തിനെയും സൂചിപ്പിക്കുന്നു; רַב അളവിന്റെ കൂടുതലിനെ ഊന്നുന്നു. ‘ധാരാളം വിത്ത്’ മൂലപാഠത്തിലെ മൂർത്തമായ കാർഷികചിത്രവും അളവിലെ വൈരുധ്യവും നിലനിർത്തുന്നു.
- source_word: תּוֹצִיא
  choice: കൊണ്ടുപോകും
  rationale: יצא എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം അക്ഷരാർഥത്തിൽ ‘പുറത്തേക്കു കൊണ്ടുവരുക/കൊണ്ടുപോകുക’ എന്നാണ്. സന്ദർഭത്തിൽ വിതയ്ക്കാനായി വിത്ത് വയലിലേക്കു കൊണ്ടുപോകുന്നതാണ് ഉദ്ദേശ്യം; വ്യാഖ്യാനാത്മകമായ ‘വിതയ്ക്കും’ എന്നതിനു പകരം എബ്രായ ദൃശ്യഭാവം നിലനിർത്തുന്നു.
- source_word: הַשָּׂדֶה
  choice: വയലിലേക്കു
  rationale: שׂדה സാധാരണയായി വയൽ അല്ലെങ്കിൽ കൃഷിഭൂമി എന്നർഥം നൽകുന്നു. ദിശാസൂചകമായ സന്ദർഭത്തിന് മലയാളത്തിലെ ‘വയലിലേക്കു’ സ്വാഭാവികമാണ്.
- source_word: וּמְעַט תֶּאֱסֹף
  choice: എന്നാൽ കുറച്ചേ ശേഖരിക്കുകയുള്ളൂ
  rationale: אָסַף എന്നത് ശേഖരിക്കുക/കൂട്ടിച്ചേർക്കുക എന്നാണ്. കാർഷികസന്ദർഭത്തിൽ വിളവെടുപ്പിനെ സൂചിപ്പിക്കുമ്പോഴും മൂലക്രിയയുടെ വിശാലത നിലനിർത്താൻ ‘ശേഖരിക്കുക’ ഉപയോഗിച്ചു; ‘കുറച്ചേ’ എന്നത് ധാരാളം വിത്തുമായുള്ള ശക്തമായ വൈരുധ്യം വ്യക്തമാക്കുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: ഇവിടെ כִּי കുറഞ്ഞ വിളവിന്റെ കാരണം അവതരിപ്പിക്കുന്നു; ആ കാരണബന്ധം ആധുനിക മലയാളത്തിൽ ‘കാരണം’ വ്യക്തമായി നൽകുന്നു.
- source_word: יַחְסְלֶנּוּ
  choice: അതു തിന്നുതീർക്കും
  rationale: חסל പൂർണമായി ഭക്ഷിച്ചുകളയുക അല്ലെങ്കിൽ നശിപ്പിച്ചുതീർക്കുക എന്ന ശക്തമായ ആശയം നൽകുന്നു. ‘തിന്നുതീർക്കും’ വെട്ടുക്കിളിയുടെ പ്രവർത്തനവും സമ്പൂർണ നാശത്തിന്റെ തീവ്രതയും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: הָאַרְבֶּה
  choice: വെട്ടുക്കിളി
  rationale: אַרְבֶּה എന്നത് വെട്ടുക്കിളിക്കുള്ള സാധാരണ പദമാണ്. നിർദ്ദിഷ്ട ഏകവചനം കൂട്ടമായോ വർഗസൂചകമായോ ഗ്രഹിക്കാവുന്നതിനാൽ മൂലരൂപം പിന്തുടർന്ന് ‘വെട്ടുക്കിളി’ എന്നു നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. മൂലപാഠത്തിലെ ‘കൊണ്ടുപോകുക’–‘ശേഖരിക്കുക’ എന്ന കാർഷിക ദൃശ്യഭാവം മുഖ്യപാഠത്തിൽ നിലനിർത്തി; കൂടുതൽ സന്ദർഭാനുസൃതമായ ‘വിതയ്ക്കുക’–‘വിളവെടുക്കുക’ എന്ന വായന അടിക്കുറിപ്പിൽ നൽകി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
