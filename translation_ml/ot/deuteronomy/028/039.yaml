  yaml_path: translation/ot/deuteronomy/028/039.yaml
  text: You will plant vineyards and cultivate them[a], but you will not drink the wine or gather it, because the worm will eat it.
translation:
  language: ml
  text: നീ മുന്തിരിത്തോട്ടങ്ങൾ നട്ടുപിടിപ്പിച്ചു കൃഷിചെയ്യും; എന്നാൽ അവയിൽനിന്നുള്ള വീഞ്ഞു കുടിക്കുകയോ അതു ശേഖരിച്ചുവയ്ക്കുകയോ[a] ചെയ്യുകയില്ല; കാരണം പുഴു നിന്റെ മുന്തിരിത്തോട്ടങ്ങളെ തിന്നുകളയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അതു സംഭരിക്കുകയോ.’ എബ്രായ ക്രിയയ്ക്ക് ശേഖരിക്കുക, കൂട്ടിവയ്ക്കുക, സംഭരിക്കുക എന്നീ അർഥങ്ങളുണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּרָמִים תִּטַּע
  choice: മുന്തിരിത്തോട്ടങ്ങൾ നട്ടു
  rationale: כְּרָמִים എന്ന ബഹുവചന നാമവും נטע എന്ന ക്രിയയും കൃഷിസന്ദർഭത്തിൽ നേരിട്ട്, സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וְעָבָדְתָּ
  choice: പരിപാലിക്കും
  rationale: കൃഷിസന്ദർഭത്തിൽ עבד എന്നത് നിലമോ തോട്ടമോ അധ്വാനിച്ചു പരിപാലിക്കുക/കൃഷിചെയ്യുക എന്ന അർഥത്തിലാണ്; മുന്തിരിത്തോട്ടങ്ങൾക്ക് ‘പരിപാലിക്കുക’ സ്വാഭാവികമാണ്.
- source_word: יַיִן לֹא תִשְׁתֶּה
  choice: അവയിൽനിന്നുള്ള വീഞ്ഞു കുടിക്കുകയോ ... ചെയ്യുകയില്ല
  rationale: മുന്തിരിത്തോട്ടങ്ങളുടെ ഉൽപ്പന്നമായ വീഞ്ഞാണ് ഉദ്ദേശിക്കുന്നത്; ‘അവയിൽനിന്നുള്ള’ എന്നത് മലയാളത്തിൽ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וְלֹא תֶאֱגֹר
  choice: അതു ശേഖരിക്കുകയോ[a]
  rationale: אגר എന്ന ക്രിയയുടെ ‘ശേഖരിക്കുക/കൂട്ടിവയ്ക്കുക/സംഭരിക്കുക’ എന്ന അർഥവ്യാപ്തിയിൽ, സന്ദർഭത്തിന് യോജിച്ച പൊതുവായ പദമായി ‘ശേഖരിക്കുക’ തെരഞ്ഞെടുത്തു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: כִּי תֹאכְלֶנּוּ הַתֹּלָעַת
  choice: കാരണം പുഴു അതു തിന്നുകളയും
  rationale: כִּי കാരണത്തെ സൂചിപ്പിക്കുന്നു. תּוֹלָעַת ഏതു പ്രത്യേക ഇനമാണെന്ന് അതിയായി നിർണയിക്കാതെ, പുഴു/ലാർവ പോലുള്ള നശിപ്പിക്കുന്ന ജീവിയെ സൂചിപ്പിക്കുന്ന വിശാലമായ ‘പുഴു’ ഉപയോഗിച്ചു.
