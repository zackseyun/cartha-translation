translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഉടമ്പടിശാപങ്ങളുടെ ഭാവികാലക്രമം ‘ചെയ്യും/ചെയ്യുകയില്ല’ എന്ന രൂപത്തിൽ നിലനിർത്തി. മൂലത്തിലെ അർഥവ്യാപ്തി ചുരുക്കാതിരിക്കാൻ אגר എന്ന പദത്തിന്റെ വ്യത്യസ്ത സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
