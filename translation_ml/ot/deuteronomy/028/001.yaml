source:
  edition: WLC
  text: וְ/הָיָ֗ה אִם שָׁמ֤וֹעַ תִּשְׁמַע֙ בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לִ/שְׁמֹ֤ר לַ/עֲשׂוֹת֙ אֶת כָּל מִצְוֺתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם וּ/נְתָ֨נְ/ךָ֜ יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ עֶלְי֔וֹן עַ֖ל כָּל גּוֹיֵ֥י הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/001.yaml
  text: And it shall be[a], if you diligently obey the voice of Yahweh your God, being careful to do all his commandments that I am commanding you today, then Yahweh your God will set you high above all the nations of the earth.
translation:
  language: ml
  text: നിന്റെ ദൈവമായ യഹോവയുടെ വാക്ക് നീ ശ്രദ്ധയോടെ അനുസരിക്കുകയും, ഞാൻ ഇന്നു നിന്നോടു കല്പിക്കുന്ന അവന്റെ സകല കല്പനകളും ജാഗ്രതയോടെ പാലിച്ചു പ്രവർത്തിക്കുകയും ചെയ്താൽ, നിന്റെ ദൈവമായ യഹോവ നിന്നെ ഭൂമിയിലെ സകല ജനതകൾക്കും ഉപരിയായി ഉന്നതനാക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘കേൾക്കുക, നീ കേൾക്കുമെങ്കിൽ’ എന്ന ആവർത്തനപ്രയോഗമാണ്; ശ്രദ്ധാപൂർവം കേട്ട് അനുസരിക്കുക എന്നാണ് അതിന്റെ അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: …ചെയ്താൽ, … ഉന്നതനാക്കും
  rationale: ഹീബ്രായിലെ നിബന്ധന–ഫല ഘടന മലയാളത്തിൽ സ്വാഭാവികമായ ‘ചെയ്താൽ’ രൂപത്തിൽ അവതരിപ്പിക്കുന്നു; וְהָיָה എന്ന സൂത്രപ്രയോഗം വേറിട്ട് അക്ഷരാർഥമായി ചേർത്താൽ മലയാളത്തിൽ കൃത്രിമമാകും.
- source_word: שָׁמוֹעַ תִּשְׁמַע בְּקוֹל
  choice: വാക്ക് നീ ശ്രദ്ധയോടെ അനുസരിക്കുകയും
  rationale: ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ടും സമാപികക്രിയയും ചേർന്ന രൂപം പ്രവർത്തനത്തെ ഊന്നുന്നു. ‘ശ്രദ്ധയോടെ അനുസരിക്കുക’ എന്നത് കേൾക്കലും ഉടമ്പടിപരമായ അനുസരണവും ഉൾക്കൊള്ളുന്നു; בְּקוֹל എന്ന ‘ശബ്ദം/വാക്ക്’ പ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം പൊതുവേ പരിചിതമായ മലയാളരൂപത്തിൽ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: ജാഗ്രതയോടെ പാലിക്കുകയും
  rationale: ‘കാത്തുസൂക്ഷിക്കുക’ എന്നും ‘ചെയ്യുക’ എന്നും ഉള്ള ഇരട്ട ആശയം കല്പനകൾ ശ്രദ്ധാപൂർവം പ്രാവർത്തികമാക്കുക എന്ന സ്വാഭാവിക മലയാളപ്രയോഗത്തിൽ നൽകുന്നു.
- source_word: כָּל מִצְוֺתָיו
  choice: അവന്റെ സകല കല്പനകളും
  rationale: ഉടമ്പടി-നിയമപരമായ ഭാഷാഭാവം നിലനിർത്താൻ ‘കല്പനകൾ’ ഉപയോഗിക്കുന്നു; പ്രത്യയം സൂചിപ്പിക്കുന്ന ‘അവന്റെ’ സംരക്ഷിക്കുന്നു.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: ഞാൻ ഇന്നു നിന്നോടു കല്പിക്കുന്ന
  rationale: പങ്കാളിക്രിയയുടെ വർത്തമാന അഭിസംബോധനയും ‘ഇന്ന്’ എന്ന അടിയന്തരതയും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: וּנְתָנְךָ ... עֶלְיוֹן
  choice: നിന്നെ … മീതെ ഉന്നതനാക്കും
  rationale: ഇവിടെ נתן വെറും ‘നൽകുക’ എന്നതല്ല, ഉയർന്ന നിലയിൽ സ്ഥാപിക്കുക എന്ന അർഥത്തിലാണ്; עֶלְיוֹן സഹിതം ‘ഉന്നതനാക്കും’ അത് വ്യക്തമാക്കുന്നു.
- source_word: עַל כָּל גּוֹיֵי הָאָרֶץ
  choice: ഭൂമിയിലെ സകല ജനതകൾക്കും മീതെ
  rationale: സകല ജാതികളുമായുള്ള വ്യാപക താരതമ്യം ആയതിനാൽ הָאָרֶץ എന്നതിന് ‘ഭൂമി’ യോജിക്കുന്നു; גּוֹיִם എന്നത് ഇവിടെ രാഷ്ട്രീയ-ജനവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്ന ‘ജനതകൾ’ ആയി നൽകുന്നു.
theological_decisions:
- issue: ദൈവനാമം יְהוָה എങ്ങനെ നൽകണം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ഉടമ്പടിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പൊതുപദവിയായ ‘കർത്താവ്’ എന്നതിലേക്കു മാറ്റാതെ വ്യക്തിനാമം നിലനിർത്തുന്നു.
- issue: שָׁמוֹעַ תִּשְׁמַע בְּקוֹל എന്ന ഉടമ്പടിപരമായ കേൾവി–അനുസരണ പ്രയോഗം
  choice: വാക്ക് നീ ശ്രദ്ധയോടെ അനുസരിക്കുകയും
  alternative: ശബ്ദം നീ തീർച്ചയായും കേൾക്കുകയും
  rationale: ഇവിടെ വെറും ശ്രവണമല്ല, കേട്ടതു അനുസരിക്കലാണ് ആവശ്യപ്പെടുന്നത്. അതേസമയം ‘വാക്ക്’ നിലനിർത്തി മൂലത്തിലെ ‘ശബ്ദം/വാക്ക്’ ആശയം പൂർണമായി മായ്ച്ചിട്ടില്ല.
- issue: അനുസരണവും അനുഗ്രഹഫലവും തമ്മിലുള്ള നിബന്ധനാത്മക ബന്ധം
  choice: ചെയ്താൽ … ഉന്നതനാക്കും
  alternative: ചെയ്യുമ്പോൾ … ഉന്നതനാക്കും
  rationale: אִם വ്യക്തമായ നിബന്ധന സൂചിപ്പിക്കുന്നു. അതിനെ ദൈവശാസ്ത്രപരമായി മൃദൂകരിക്കാതെയും യാന്ത്രിക കാരണബന്ധമായി കടുപ്പിക്കാതെയും നിബന്ധന–വാഗ്ദത്ത ഘടനയായി നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ ശൈലി. ‘സകല’, ‘കല്പന’ തുടങ്ങിയ പദങ്ങൾ വാക്യത്തിന്റെ ഉടമ്പടി-നിയമപരമായ ഗൗരവം നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് സൂചകം ബന്ധപ്പെട്ട മുഴുവൻ പ്രസ്താവനയ്ക്കു ശേഷം നൽകിയിരിക്കുന്നു.
