source:
  edition: WLC
  text: בַּ/בֹּ֤קֶר תֹּאמַר֙ מִֽי יִתֵּ֣ן עֶ֔רֶב וּ/בָ/עֶ֥רֶב תֹּאמַ֖ר מִֽי יִתֵּ֣ן בֹּ֑קֶר מִ/פַּ֤חַד לְבָֽבְ/ךָ֙ אֲשֶׁ֣ר תִּפְחָ֔ד וּ/מִ/מַּרְאֵ֥ה עֵינֶ֖י/ךָ אֲשֶׁ֥ר תִּרְאֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/067.yaml
  text: In the morning you will say[a], “If only it were evening!” and in the evening you will say, “If only it were morning!” because of the dread of your heart that you will dread[b], and because of the sight your eyes will see.
translation:
  language: ml
  text: രാവിലെ നീ പറയും[a], “വൈകുന്നേരമായിരുന്നെങ്കിൽ!” വൈകുന്നേരം നീ പറയും, “രാവിലെയായിരുന്നെങ്കിൽ!”—നിന്റെ ഹൃദയത്തിലെ ഭയം നിമിത്തവും നിന്റെ കണ്ണുകൾ കാണുന്ന കാഴ്ച നിമിത്തവും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: ‘വൈകുന്നേരം ആർ തരും?’ ‘രാവിലെ ആർ തരും?’—ഇത് ശക്തമായ ആഗ്രഹം പ്രകടിപ്പിക്കുന്ന എബ്രായ ശൈലിയാണ്.'
    reason: lexical_alternative
  - marker: b
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘നിന്റെ ഹൃദയത്തിന്റെ, നീ ഭയപ്പെടുന്ന ഭയം നിമിത്തവും നിന്റെ കണ്ണുകൾ കാണുന്ന കാഴ്ച നിമിത്തവും.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּבֹּקֶר
  choice: രാവിലെ
  rationale: നിശ്ചിതമായ കാലസൂചന മലയാളത്തിലെ സ്വാഭാവികമായ ‘രാവിലെ’ എന്ന പ്രയോഗത്തിലൂടെ നൽകി.
- source_word: תֹּאמַר
  choice: നീ പറയും
  rationale: ശാപസന്ദർഭത്തിലെ Qal imperfect 2ms കല്പനയല്ല, ഭാവിപ്രവചനമാണ്.
- source_word: מִי יִתֵּן עֶרֶב
  choice: വൈകുന്നേരമായിരുന്നെങ്കിൽ!
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘ആർ തരും?’ എന്ന ചോദ്യമല്ല; ആഗ്രഹം പ്രകടിപ്പിക്കുന്ന എബ്രായ ശൈലിയാണ്.
- source_word: וּבָעֶרֶב ... מִי יִתֵּן בֹּקֶר
  choice: വൈകുന്നേരം ... നേരം പുലർന്നിരുന്നെങ്കിൽ!
  rationale: രാവും വൈകുന്നേരവും തമ്മിലുള്ള വിരുദ്ധസമാന്തരത നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ മലയാള ആഗ്രഹപ്രയോഗം ഉപയോഗിച്ചു.
- source_word: מִפַּחַד לְבָבְךָ אֲשֶׁר תִּפְחָד
  choice: നിന്റെ ഹൃദയത്തെ പിടികൂടുന്ന ഭയം നിമിത്തം
  rationale: פַּחַד/פחד എന്ന നാമ-ക്രിയ ആവർത്തനം മലയാളത്തിൽ കൃത്രിമമാകാതെ, ഹൃദയത്തിൽ അനുഭവപ്പെടുന്ന തീവ്രഭയമായി അർഥം വ്യക്തമാക്കി.
- source_word: וּמִמַּרְאֵה עֵינֶיךָ אֲשֶׁר תִּרְאֶה
  choice: നിന്റെ കണ്ണുകൾ കാണുന്ന കാഴ്ച നിമിത്തം
  rationale: ‘കണ്ണുകൾ’ എന്ന ദൃശ്യവൈഭവവും ‘കാഴ്ച/കാണുക’ എന്ന മൂലപാഠത്തിലെ ആവർത്തനവും നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. രാവിലെയും വൈകുന്നേരവും തമ്മിലുള്ള സമാന്തരഘടനയും ഭയം–കാഴ്ച എന്ന കാരണദ്വയവും സംരക്ഷിച്ചു; വാക്യാവസാനത്തിലെ ‘നീ ഇങ്ങനെ പറയും’ മലയാളത്തിൽ കാരണബന്ധം വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു.
