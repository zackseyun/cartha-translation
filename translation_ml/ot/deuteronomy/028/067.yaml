  to: രാവിലെ നീ പറയും[a], “വൈകുന്നേരമായിരുന്നെങ്കിൽ!” വൈകുന്നേരം നീ പറയും, “രാവിലെയായിരുന്നെങ്കിൽ!”—നിന്റെ ഹൃദയത്തിലെ ഭയം നിമിത്തവും നിന്റെ കണ്ണുകൾ കാണുന്ന കാഴ്ച നിമിത്തവും[b].
