source:
  edition: WLC
  text: יַכְּ/כָ֨ה יְהוָ֜ה בִּ/שְׁחִ֣ין רָ֗ע עַל הַ/בִּרְכַּ֨יִם֙ וְ/עַל הַ/שֹּׁקַ֔יִם אֲשֶׁ֥ר לֹא תוּכַ֖ל לְ/הֵרָפֵ֑א מִ/כַּ֥ף רַגְלְ/ךָ֖ וְ/עַ֥ד קָדְקֳדֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/035.yaml
  text: Yahweh will strike you with severe boils on the knees and on the legs[a], from which you cannot be healed, from the sole of your foot to the crown of your head.
translation:
  language: ml
  text: യാഹ്‌വേ നിന്റെ കാൽമുട്ടുകളിലും മുട്ടിനു താഴെയുള്ള കാലുകളുടെ ഭാഗങ്ങളിലും[a], നിന്റെ പാദതലംമുതൽ തലയുടെ നെറുകവരെ, ഭേദമാക്കാനാവാത്ത കഠിനമായ വ്രണങ്ങളാൽ നിന്നെ അടിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഷിന്നുകളിലും’; എബ്രായപദം മുട്ടിനു താഴെയുള്ള കാലിന്റെ ഭാഗത്തെ കൂടുതൽ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַכְּכָה
  choice: നിന്നെ ബാധിക്കും
  rationale: נכה എന്ന ക്രിയയ്ക്ക് ‘അടിക്കുക’ എന്ന അടിസ്ഥാനാർഥമുണ്ടെങ്കിലും രോഗംകൊണ്ടുള്ള ദൈവിക പ്രഹരത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘ബാധിക്കും’ എന്നു നൽകി.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ സുപരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: בִּשְׁחִין רָע
  choice: കഠിനമായ പരുക്കൾകൊണ്ട്
  rationale: שְׁחִין വീർത്തുപഴുക്കുന്ന ചർമവ്രണമോ പരുവോ സൂചിപ്പിക്കുന്നു; רָע അതിന്റെ കഠിനത വ്യക്തമാക്കുന്നു. ഏകവചനം ഇവിടെ കൂട്ടാർഥത്തിൽ മനസ്സിലാക്കി.
- source_word: עַל הַבִּרְכַּיִם
  choice: കാൽമുട്ടുകളിൽ
  rationale: ശരീരഭാഗത്തെ നേരിട്ടും സ്വാഭാവികമായും സൂചിപ്പിക്കുന്നു.
- source_word: וְעַל הַשֹּׁקַיִם
  choice: കണങ്കാലുകളിൽ
  rationale: שׁוֹק മുട്ടിനുതാഴെയുള്ള കാലിന്റെ ഭാഗത്തെ സൂചിപ്പിക്കുന്നു; കൃത്യമായ പരിധി സന്ദർഭാനുസരണം മാറാവുന്നതിനാൽ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: אֲשֶׁר לֹא תוּכַל לְהֵרָפֵא
  choice: ഭേദമാക്കാൻ കഴിയാത്ത
  rationale: രോഗാവസ്ഥയ്ക്ക് ചികിത്സയോ സൗഖ്യമോ ലഭിക്കാത്തതിനെ മലയാളത്തിൽ സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
- source_word: מִכַּף רַגְלְךָ
  choice: നിന്റെ ഉള്ളങ്കാൽമുതൽ
  rationale: כַּף רֶגֶל എന്ന പ്രയോഗം പാദത്തിന്റെ അടിഭാഗമായ ഉള്ളങ്കാലിനെ സൂചിപ്പിക്കുന്നു.
- source_word: וְעַד קָדְקֳדֶךָ
  choice: നെറുകവരെ
  rationale: קָדְקֹד തലയുടെ ഏറ്റവും മുകളിലുള്ള ഭാഗത്തെ സൂചിപ്പിക്കുന്നു; ‘നെറുക’ അതിന്റെ സ്വാഭാവിക മലയാളസമം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ
  rationale: പദവിയായ ‘കർത്താവ്’ എന്നു പകരാതെ വ്യക്തിനാമം നിലനിർത്തി; ആധുനിക മലയാള ബൈബിൾ വായനക്കാർക്ക് വ്യാപകമായി പരിചിതമായ രൂപം തെരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ മലയാളം. എബ്രായത്തിലെ ശരീരമൊട്ടാകെയുള്ള വ്യാപ്തി അവസാന വാക്യഭാഗത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കി.
