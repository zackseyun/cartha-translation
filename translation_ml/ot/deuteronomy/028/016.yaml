id: DEU.28.16
reference: Deuteronomy 28:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אָר֥וּר אַתָּ֖ה בָּ/עִ֑יר וְ/אָר֥וּר אַתָּ֖ה בַּ/שָּׂדֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/016.yaml
  text: Cursed are you in the city[a], and cursed are you in the field.
translation:
  language: ml
  text: നഗരത്തിൽ നീ ശപിക്കപ്പെട്ടവനാണ്[a]; വയലിൽ നീ ശപിക്കപ്പെട്ടവനാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ശാപത്തിന്റെ കീഴിലുള്ളവൻ.’
    reason: אָרוּר എന്ന പദത്തിന് പ്രഖ്യാപിതമായ ശാപാവസ്ഥയെ സൂചിപ്പിക്കുന്ന ഒരു പകരക്കാരാവിഷ്കാരം.
lexical_decisions:
- source_word: אָרוּר
  choice: ശപിക്കപ്പെട്ടവൻ
  rationale: നിയമപുസ്തകത്തിലെ ഉടമ്പടിശാപപ്രഖ്യാപനത്തിന്റെ നേരിട്ടുള്ള ശക്തി നിലനിർത്തുന്നു. ഭാവിപ്രവചനമോ ശാപാശംസയോ ആക്കാതെ, ഒരാളുടെ മേൽ പ്രഖ്യാപിക്കപ്പെട്ട ശാപാവസ്ഥയെ സൂചിപ്പിക്കുന്നു.
- source_word: אַתָּה
  choice: നീ
  rationale: എബ്രായത്തിലെ വ്യക്തമായി നൽകിയിരിക്കുന്ന രണ്ടാംപുരുഷ ഏകവചന സർവനാമം നിലനിർത്തുന്നു.
- source_word: בָּעִיר
  choice: പട്ടണത്തിൽ
  rationale: ב എന്ന സ്ഥലസൂചക ഉപസർഗവും עִיר എന്ന നഗരവാസമേഖലയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וְ
  choice: ; …യും
  rationale: സമാന്തരമായ രണ്ടു ശാപപ്രഖ്യാപനങ്ങളെ ബന്ധിപ്പിക്കുന്ന സഞ്ചിതബലം മലയാളത്തിൽ അർദ്ധവിരാമവും ‘യും’ എന്ന ബന്ധഘടകവും ചേർത്ത് സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: בַּשָּׂדֶה
  choice: വയലിലും
  rationale: നഗരജീവിതത്തിനു വിരുദ്ധമായി കൃഷിയിടമെന്ന മൂർത്തമായ ഗ്രാമീണമേഖലയെ സൂചിപ്പിക്കുന്നു; ‘പട്ടണം—വയൽ’ എന്ന സമഗ്രവ്യാപ്തിയും നിലനിൽക്കുന്നു.
theological_decisions:
- issue: ഉടമ്പടിശാപസൂത്രവും അതിന്റെ കാലഭാവവും
  choice: രണ്ടു ഖണ്ഡങ്ങളിലും നേരിട്ടുള്ള അവസ്ഥാപ്രഖ്യാപനമായി ‘നീ ശപിക്കപ്പെട്ടവൻ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘നീ ശപിക്കപ്പെടും’ അല്ലെങ്കിൽ ‘നീ ശപിക്കപ്പെടട്ടെ’
  rationale: എബ്രായത്തിൽ ഭാവികാലക്രിയയോ ആശംസാരൂപമോ ഇല്ല; ആവർത്തിക്കുന്ന കർമണി കൃദന്തരൂപവും സർവനാമവും ചേർന്ന നാമവാക്യമാണ്. അതിനാൽ വിധിപ്രഖ്യാപനത്തിന്റെ ശക്തിയും മൂലപാഠത്തിലെ കാലസംബന്ധിയായ തുറന്ന നിലയും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിന്റെ സമാന്തരഘടന നിലനിർത്തിക്കൊണ്ട്, മലയാളത്തിന്റെ സ്വാഭാവിക പദക്രമം ഉപയോഗിച്ചു. ‘പട്ടണം—വയൽ’ എന്ന വിരുദ്ധജോടി ജീവിതത്തിന്റെ എല്ലാ മേഖലകളെയും ഉൾക്കൊള്ളുന്ന സൂചനയായി മാറ്റമില്ലാതെ സൂക്ഷിച്ചു.
