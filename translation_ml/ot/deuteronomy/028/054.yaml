  variant: modern standard Malayalam
source:
  edition: WLC
  text: הָ/אִישׁ֙ הָ/רַ֣ךְ בְּ/ךָ֔ וְ/הֶ/עָנֹ֖ג מְאֹ֑ד תֵּרַ֨ע עֵינ֤/וֹ בְ/אָחִי/ו֙ וּ/בְ/אֵ֣שֶׁת חֵיק֔/וֹ וּ/בְ/יֶ֥תֶר בָּנָ֖י/ו אֲשֶׁ֥ר יוֹתִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/054.yaml
  text: The man who is tender among you and very delicate—his eye will be hostile toward his brother[a], toward the wife of his bosom[b], and toward the rest of his children whom he has left.
translation:
  language: ml
  text: നിങ്ങളുടെ ഇടയിലെ മൃദുവും അത്യന്തം സുഖശീലനുമായ പുരുഷൻപോലും തന്റെ സഹോദരനോടും, തന്റെ മാറോടു ചേർന്നിരിക്കുന്ന ഭാര്യയോടും, തനിക്കു ശേഷിക്കുന്ന[b] മക്കളോടും വൈരഭാവത്തോടെ നോക്കും[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “അവന്റെ കണ്ണ് ... നേരെ ദോഷമായിരിക്കും.” ശത്രുത, പിശുക്ക്, അല്ലെങ്കിൽ ഉള്ളത് പങ്കിടാൻ മനസ്സില്ലായ്മ എന്നിവ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണിത്.
    reason: lexical_alternative
  - marker: b
    text: “അവൻ ശേഷിപ്പിക്കുന്ന മക്കൾ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
lexical_decisions:
- source_word: הָאִישׁ
  choice: പുരുഷൻ
  rationale: തുടർന്നുള്ള വാക്യത്തിലെ സ്ത്രീയോടുള്ള സമാന്തരത കണക്കിലെടുത്ത് ഏകവചന പുല്ലിംഗസൂചന വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: הָרַךְ
  choice: മൃദുലൻ
  rationale: ശാരീരികമായോ ജീവിതശൈലിയിലോ ഉള്ള മൃദുത്വം സൂചിപ്പിക്കുന്ന മൂലപദത്തിന്റെ അർഥം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: וְהֶעָנֹג מְאֹד
  choice: അത്യന്തം സുഖലോലുപൻ
  rationale: സുഖസൗകര്യങ്ങളിൽ വളർന്ന് കഷ്ടപ്പാടുകൾ പരിചയമില്ലാത്ത അവസ്ഥയെ ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; ‘ലാളിച്ചു വളർത്തപ്പെട്ടവൻ’ എന്നത് കൂടുതൽ വ്യാഖ്യാനാത്മകമാണ്.
- source_word: תֵּרַע עֵינוֹ
  choice: ദുഷ്ടദൃഷ്ടിയോടെ നോക്കും
  rationale: ‘അവന്റെ കണ്ണ് ദുഷിക്കും’ എന്ന എബ്രായ പ്രയോഗത്തിലെ കണ്ണിന്റെ രൂപകം നിലനിർത്തിക്കൊണ്ട്, ശത്രുതയും പങ്കുവെക്കാൻ മനസ്സില്ലായ്മയും സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളം ഉപയോഗിക്കുന്നു.
- source_word: בְאָחִיו
  choice: തന്റെ സഹോദരനെ
  rationale: സാധാരണവും നേരിട്ടുമുള്ള അർഥം നിലനിർത്തുന്നു; വിശാലമായ ബന്ധുസൂചന സന്ദർഭത്തിൽ സാധ്യമെങ്കിലും ഇവിടെ അനിവാര്യമല്ല.
- source_word: אֵשֶׁת חֵיקוֹ
  choice: തന്റെ മാറോടു ചേർത്ത ഭാര്യയെ
  rationale: അടുപ്പവും സ്നേഹബന്ധവും പ്രകടിപ്പിക്കുന്ന ‘മാറിലെ ഭാര്യ’ എന്ന എബ്രായ രൂപകം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: יֶתֶר בָּנָיו
  choice: മക്കളെ
  rationale: בנים ഇവിടെ ആൺമക്കൾക്കു മാത്രമല്ല, സന്തതികളെ പൊതുവായി സൂചിപ്പിക്കാവുന്നതിനാൽ ഉൾക്കൊള്ളുന്ന ‘മക്കൾ’ യോജിക്കുന്നു.
- source_word: אֲשֶׁר יוֹתִיר
  choice: തനിക്കു ശേഷിക്കുന്ന
  rationale: ‘ബാക്കിയാകുക/ശേഷിപ്പിക്കുക’ എന്ന ക്രിയയുടെ സന്ദർഭോചിതമായ അർഥം നൽകുന്നു; ആരാണ് ശേഷിപ്പിക്കുന്നത് എന്ന വ്യാകരണസൂക്ഷ്മത അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
theological_decisions:
- issue: ദുഷ്ടമായ കണ്ണ് എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥവ്യാപ്തി
  choice: പ്രധാനവാചകത്തിൽ ‘ദുഷ്ടദൃഷ്ടിയോടെ നോക്കും’ എന്ന് രൂപകം നിലനിർത്തി, അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: ‘പങ്കുവെക്കാൻ വിസമ്മതിക്കും’ അല്ലെങ്കിൽ ‘അസൂയപ്പെടും’ എന്ന് നേരിട്ട് വ്യാഖ്യാനിക്കുക.
  rationale: ഉപരോധത്തിന്റെ സാഹചര്യത്തിൽ ഈ പ്രയോഗം ശത്രുത, പിശുക്ക്, പങ്കിടാനുള്ള മനസ്സില്ലായ്മ എന്നിവ ഒരുമിച്ച് സൂചിപ്പിക്കാം; ഒരൊറ്റ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കുന്നത് മൂലത്തിലെ ഉദ്ദേശ്യപൂർവമായ അർഥസാന്ദ്രത നഷ്ടപ്പെടുത്തും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗഹൃദവുമായ ശൈലി. ഉപരോധത്തിന്റെ ഭീകരതയിൽ സൗമ്യനും സുഖജീവിതം നയിച്ചവനുമായ ഒരാൾപോലും ക്രൂരനാകുന്ന വൈരുധ്യം പ്രകടമാക്കാൻ ‘പോലും’ ചേർത്തിരിക്കുന്നു. എബ്രായത്തിലെ കണ്ണിന്റെ രൂപകം പൂർണമായി പരാവർത്തനം ചെയ്യാതെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തിയിരിക്കുന്നു.
