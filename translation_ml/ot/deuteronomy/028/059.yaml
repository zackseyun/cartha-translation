  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הִפְלָ֤א יְהוָה֙ אֶת מַכֹּ֣תְ/ךָ֔ וְ/אֵ֖ת מַכּ֣וֹת זַרְעֶ֑/ךָ מַכּ֤וֹת גְּדֹלוֹת֙ וְ/נֶ֣אֱמָנ֔וֹת וָ/חֳלָיִ֥ם רָעִ֖ים וְ/נֶאֱמָנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/059.yaml
  text: then Yahweh will make your plagues and the plagues of your offspring extraordinary—great and lasting plagues[b][a], and severe and lasting sicknesses.
translation:
  language: ml
  text: അപ്പോൾ യാഹ്‌വെ നിന്റെ ബാധകളെയും നിന്റെ സന്തതിയുടെ ബാധകളെയും അസാധാരണമാക്കും[a]—വലുതും നീണ്ടുനിൽക്കുന്നതുമായ ബാധകളും[b], കഠിനവും നീണ്ടുനിൽക്കുന്നതുമായ രോഗങ്ങളും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അതിശയകരമാക്കും.’ എബ്രായ ക്രിയ എന്തെങ്കിലും അസാധാരണമോ ശ്രദ്ധേയമോ ആക്കുക എന്നു സൂചിപ്പിക്കാം; ഇവിടെ ന്യായവിധിയുടെ അസാധാരണമായ കാഠിന്യമാണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
  - marker: b
    text: ‘നീണ്ടുനിൽക്കുന്ന’ എന്നു വിവർത്തനം ചെയ്ത എബ്രായ പദത്തിന് ഉറച്ച, നിലനിൽക്കുന്ന, വിട്ടുമാറാത്ത എന്നീ അർഥങ്ങളുണ്ട്. ബാധകളെയും രോഗങ്ങളെയും വിശേഷിപ്പിക്കാൻ ഇതേ പദം ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִפְלָא
  choice: അസാധാരണമായ ... വരുത്തും
  rationale: ഹിഫീൽ രൂപത്തിലുള്ള פלא ഇവിടെ ബാധകളെ അസാധാരണമോ വിസ്മയകരമോ ആക്കുക എന്ന തീവ്രത സൂചിപ്പിക്കുന്നു. ന്യായവിധിയുടെ പശ്ചാത്തലത്തിൽ അനുകൂലമായ ‘അത്ഭുതകരം’ ഒഴിവാക്കി ‘അസാധാരണമായ’ എന്നു നൽകി.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായി നൽകി.
- source_word: מַכֹּתְךָ / מַכּוֹת
  choice: നിനക്കും ... ബാധകൾ / ബാധകൾ
  rationale: מכה എന്നത് പ്രഹരം, ബാധ, മഹാമാരി എന്നിവ സൂചിപ്പിക്കാം. നിയമശാപങ്ങളുടെ പശ്ചാത്തലത്തിലും രോഗങ്ങളോടുള്ള സമാന്തരതയിലും ‘ബാധകൾ’ സ്വാഭാവികവും വിശാലവുമാണ്.
- source_word: זַרְעֶךָ
  choice: നിന്റെ സന്തതി
  rationale: זרע-യുടെ കൂട്ടായ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കാൻ ‘സന്തതി’ ഉപയോഗിച്ചു.
- source_word: גְּדֹלוֹת
  choice: വലുതും
  rationale: അക്ഷരാർഥമായ ‘വലിയ’ എന്ന ആശയം നിലനിർത്തി; ഇവിടെ ബാധകളുടെ വ്യാപ്തിയെയോ കാഠിന്യത്തെയോ തീവ്രമാക്കുന്നു.
- source_word: נֶאֱמָנוֹת / נֶאֱמָנִים
  choice: നീണ്ടുനിൽക്കുന്നതുമായ
  rationale: אמן മൂലത്തിൽനിന്നുള്ള ഈ രൂപം ഇവിടെ ഉറച്ചുനിൽക്കുന്ന, നിലനിൽക്കുന്ന, വിട്ടുമാറാത്ത എന്ന ആശയമാണ് നൽകുന്നത്. രണ്ടു പ്രയോഗങ്ങളിലും ഒരേ വിവർത്തനം നൽകി എബ്രായ ആവർത്തനം സംരക്ഷിച്ചു.
- source_word: חֳלָיִם
  choice: രോഗങ്ങൾ
  rationale: രോഗം/അസുഖം എന്ന ബഹുവചന ആശയം സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: רָעִים
  choice: കഠിനവും
  rationale: രോഗങ്ങളെ വിശേഷിപ്പിക്കുമ്പോൾ ‘ചീത്ത’ എന്ന അക്ഷരാർഥത്തേക്കാൾ ദോഷകരവും ഗുരുതരവുമായ സ്വഭാവം ‘കഠിനം’ സ്വാഭാവികമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ഉടമ്പടിനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: വ്യക്തിനാമത്തെ ഒരു സ്ഥാനപ്പേരാൽ പകരാതെ മലയാള വായനക്കാർക്ക് പരിചിതമായ രൂപത്തിൽ സംരക്ഷിച്ചു.
- issue: ന്യായവിധിയുടെ പശ്ചാത്തലത്തിൽ פלא എന്ന ക്രിയയുടെ ഭാവം
  choice: അസാധാരണമായ ... വരുത്തും
  alternative: അതിശയിപ്പിക്കുന്നതാക്കും
  rationale: ക്രിയയുടെ അസാധാരണത്വം സൂക്ഷിക്കുമ്പോഴും അനുകൂലമായ ‘അത്ഭുതകരം’ എന്ന ധ്വനി ഒഴിവാക്കുന്നു; അസാധാരണത്വം കാഠിന്യമാത്രമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഏകവചന രണ്ടാംപുരുഷ അഭിസംബോധന നിലനിർത്തി. എബ്രായത്തിലെ ‘വലുതും നിലനിൽക്കുന്നതുമായ ബാധകൾ / കഠിനവും നിലനിൽക്കുന്നതുമായ രോഗങ്ങൾ’ എന്ന സമാന്തരഘടനയും ആവർത്തനവും പരമാവധി സംരക്ഷിച്ചു.
