  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: יוֹלֵ֨ךְ יְהוָ֜ה אֹֽתְ/ךָ֗ וְ/אֶֽת מַלְכְּ/ךָ֙ אֲשֶׁ֣ר תָּקִ֣ים עָלֶ֔י/ךָ אֶל גּ֕וֹי אֲשֶׁ֥ר לֹא יָדַ֖עְתָּ אַתָּ֣ה וַ/אֲבֹתֶ֑י/ךָ וְ/עָבַ֥דְתָּ שָּׁ֛ם אֱלֹהִ֥ים אֲחֵרִ֖ים עֵ֥ץ וָ/אָֽבֶן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/036.yaml
  text: Yahweh will bring you and the king whom you set over yourself to a nation that neither you nor your fathers have known[a], and there you will serve other gods[b], wood and stone.
translation:
  language: ml
  text: യാഹ്‌വേ നിന്നെയും നീ നിനക്കുമീതെ നിയമിക്കുന്ന രാജാവിനെയും നീയോ നിന്റെ പിതാക്കന്മാരോ അറിഞ്ഞിട്ടില്ലാത്ത ഒരു ജനതയിലേക്കു കൊണ്ടുപോകും; അവിടെ നീ മരവും കല്ലുമായ മറ്റു ദേവന്മാരെ സേവിക്കും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יוֹלֵךְ
  choice: കൊണ്ടുപോകും
  rationale: הלך എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ ഒരാളെ പോകാൻ ഇടയാക്കുക എന്ന കാരണാർഥത്തിലാണ്. ശാപത്തിന്റെയും നാടുകടത്തലിന്റെയും പശ്ചാത്തലത്തിൽ ‘കൊണ്ടുപോകും’ സ്വാഭാവികവും മൂലപാഠത്തോട് അടുത്തതുമാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: מַלְכְּךָ אֲשֶׁר תָּקִים עָלֶיךָ
  choice: നീ നിനക്കുമീതെ നിയമിക്കുന്ന രാജാവ്
  rationale: קום എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ ഭരണാധികാരിയായി സ്ഥാപിക്കുകയോ നിയമിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; עָלֶיךָ എന്ന ഘടന ‘നിനക്കുമീതെ’ എന്നു നിലനിർത്തി.
- source_word: גּוֹי
  choice: ഒരു ജനത
  rationale: גוי ഒരു ജനതയെയോ രാഷ്ട്രത്തെയോ സൂചിപ്പിക്കാം. ഇവിടെ പരിചയമില്ലാത്ത വിദേശജനസമൂഹമാണ് ഉദ്ദേശ്യം; ‘ജനത’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: אֲשֶׁר לֹא יָדַעְתָּ אַתָּה וַאֲבֹתֶיךָ
  choice: നീയോ നിന്റെ പിതാക്കന്മാരോ അറിഞ്ഞിട്ടില്ലാത്ത
  rationale: ഹീബ്രുവിലെ നിഷേധത്തിന്റെ സംയുക്ത വ്യാപ്തി മലയാളത്തിലെ ‘നീയോ ... പിതാക്കന്മാരോ ... ഇല്ലാത്ത’ എന്ന രൂപത്തിൽ വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്നു; ‘പിതാക്കന്മാർ’ എന്ന ലിംഗസൂചക ബന്ധപദം നിലനിർത്തുന്നു.
- source_word: וְעָבַדְתָּ שָׁם
  choice: അവിടെ നീ ... സേവിക്കും
  rationale: עבד എന്നതിന് അടിസ്ഥാനമായി ‘സേവിക്കുക’ എന്നാണ് അർഥം; ദേവന്മാരെ കർമവിഷയമാക്കുമ്പോൾ ആരാധനാപരമായ സേവനം ഉൾപ്പെടുന്നു. ആ അർഥവ്യാപ്തി ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: അന്യദേവന്മാർ
  rationale: നിയമസന്ദർഭത്തിലെ സ്ഥിരമായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി ‘അന്യദേവന്മാർ’ എന്നു നൽകുന്നു.
- source_word: עֵץ וָאָבֶן
  choice: മരവും കല്ലുമായ
  rationale: വിഗ്രഹങ്ങളുടെ വസ്തുസ്വഭാവം വ്യക്തമാക്കുന്ന ഹീബ്രു സമാനാധികരണത്തെ മലയാളത്തിൽ ‘മരവും കല്ലുമായ’ എന്നു സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരായി പകരാതെ നിലനിർത്തുന്നു. മലയാള ബൈബിൾ ഉപയോഗത്തിൽ വ്യാപകവും വായനക്കാർക്ക് പരിചിതവുമായ ലിപ്യന്തരണം ‘യഹോവ’യാണ്; സ്വരീകരണം ചരിത്രപരമായി അനിശ്ചിതമാണെന്ന കാര്യം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- issue: וַאֲבֹתֶיךָ എന്ന ബന്ധപദം
  choice: നിന്റെ പിതാക്കന്മാർ
  alternative: നിന്റെ പൂർവികർ
  rationale: മൂലഭാഷയിലെ വ്യക്തമായ പുൽലിംഗ ബഹുവചനബന്ധപദം പൊതുവൽക്കരിക്കാതെ നിലനിർത്തുന്നു.
- issue: עבד എന്ന ക്രിയയുടെ ആരാധനാപരമായ അർഥം
  choice: സേവിക്കും
  alternative: ആരാധിക്കും
  rationale: ദേവന്മാരോടുള്ള ബന്ധത്തിൽ ‘ആരാധിക്കുക’ എന്ന അർഥം ഉൾക്കൊള്ളുന്നുവെങ്കിലും, ക്രിയയുടെ അടിസ്ഥാനമായ ‘സേവിക്കുക’ എന്ന അർഥം നിലനിർത്തി യഥാർത്ഥ അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്നതുമായ ശൈലി. ഏകവചന ‘നീ’ എന്ന അഭിസംബോധനയും ‘നിനക്കുമീതെ’ എന്ന മൂലഘടനയും നിലനിർത്തി; വാക്യത്തിന്റെ രണ്ടാം ഭാഗത്ത് മലയാളത്തിലെ സ്വാഭാവിക പദക്രമം ഉപയോഗിച്ചു.
