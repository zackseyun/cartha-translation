- from: യഹോവ നിന്നെയും നീ നിനക്കുമീതെ നിയമിക്കുന്ന രാജാവിനെയും നീയോ നിന്റെ പിതാക്കന്മാരോ അറിഞ്ഞിട്ടില്ലാത്ത ഒരു ജനതയിലേക്കു കൊണ്ടുപോകും; അവിടെ നീ മരവും കല്ലുമായ അന്യദേവന്മാരെ സേവിക്കും.[a]
  to: യാഹ്‌വേ നിന്നെയും നീ നിനക്കുമീതെ നിയമിക്കുന്ന രാജാവിനെയും നീയോ നിന്റെ പിതാക്കന്മാരോ അറിഞ്ഞിട്ടില്ലാത്ത ഒരു ജനതയിലേക്കു കൊണ്ടുപോകും; അവിടെ നീ മരവും കല്ലുമായ മറ്റു ദേവന്മാരെ സേവിക്കും.
  rationale: പദ്ധതിയുടെ ദൈവനാമനയത്തോടു ചേർത്ത് ‘യാഹ്‌വേ’ എന്നു തിരുത്തി; ‘other gods’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥവ്യാപ്തി സംരക്ഷിക്കാൻ ‘മറ്റു ദേവന്മാർ’ എന്നു നൽകി. മൂലപാഠത്തിൽനിന്ന് ആവശ്യപ്പെടാത്തതും തിരുത്തിയ നാമരൂപവുമായി പൊരുത്തമില്ലാത്തതുമായ അടിക്കുറിപ്പ് നീക്കി. ‘മരവും കല്ലുമായ’ ഹീബ്രുവിലെ ‘wood and stone’ എന്ന അപഹാസ്യസമാനാധികരണത്തെ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
