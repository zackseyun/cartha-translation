  yaml_path: translation/ot/deuteronomy/028/047.yaml
  text: because you did not serve Yahweh your God with joy and with gladness of heart[a], because of the abundance of all things[b],
translation:
  language: ml
  text: സകലവും ധാരാളമായി ലഭിച്ചിരിക്കെ[b], നീ നിന്റെ ദൈവമായ യഹ്‌വെയെ സന്തോഷത്തോടും ഹൃദയത്തിന്റെ നന്മയോടും[a] കൂടി സേവിക്കാതിരുന്നതുകൊണ്ട്,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഹൃദയാനന്ദത്തോടെ” അല്ലെങ്കിൽ “ഹൃദയത്തിലെ പ്രസന്നതയോടെ.” എബ്രായപ്രയോഗം അക്ഷരാർഥത്തിൽ ‘ഹൃദയത്തിന്റെ നന്മ’ എന്നു പറയുന്നു; ഉള്ളന്തരമായ പ്രസന്നതയും ഇതിൽ ഉൾപ്പെടാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “എല്ലാറ്റിന്റെയും സമൃദ്ധിയിൽനിന്ന്” അല്ലെങ്കിൽ “എല്ലാം സമൃദ്ധമായി ഉണ്ടായിരുന്നപ്പോൾ.” സമൃദ്ധമായ പരിപാലനം ലഭിച്ചിട്ടും യഹ്‌വെയെ സേവിക്കാതിരുന്നതിലേക്കാണ് എബ്രായപ്രയോഗം വിരൽചൂണ്ടുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת אֲשֶׁר
  choice: സേവിക്കാതിരുന്നതുകൊണ്ട്
  rationale: ശാപത്തിനുള്ള കാരണം അവതരിപ്പിക്കുന്ന ഈ സന്ദർഭത്തിൽ ഈ പ്രയോഗം കാരണാർഥകമാണ്; മലയാളത്തിൽ വാക്യാന്തത്തിലെ ‘-കൊണ്ട്’ സ്വാഭാവികമായി ആ ബന്ധം അറിയിക്കുന്നു.
- source_word: עָבַדְתָּ
  choice: സേവിക്കുക
  rationale: ദൈവത്തോടുള്ള ഉടമ്പടിപരമായ അനുസരണവും ആരാധനയും ഉൾക്കൊള്ളുന്ന വിശാലമായ അർഥം നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായത്തിലെ ദൈവനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: രണ്ടാംപുരുഷ ഏകവചന അഭിസംബോധന കൃത്യമായി നിലനിർത്തുന്നു; മലയാള വാക്യഘടനയിൽ ദൈവനാമത്തോടു സ്വാഭാവികമായി ചേരുന്നു.
- source_word: בְּשִׂמְחָה
  choice: സന്തോഷത്തോടെ
  rationale: സേവനത്തിന്റെ രീതി സൂചിപ്പിക്കുന്ന പ്രയോഗത്തെ സ്വാഭാവികവും നേരിട്ടുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וּבְטוּב לֵבָב
  choice: ഹൃദയാനന്ദത്തോടെ
  rationale: അക്ഷരാർഥമായ ‘ഹൃദയത്തിന്റെ നന്മ’ എന്നതിനെക്കാൾ ഈ സന്ദർഭത്തിലെ ഉള്ളന്തരമായ പ്രസന്നത മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; എങ്കിലും മൂലത്തിലെ പദാർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: מֵרֹב כֹּל
  choice: എല്ലാം സമൃദ്ധമായി ഉണ്ടായിരുന്നിട്ടും
  rationale: സമൃദ്ധമായ അനുഗ്രഹം ലഭിച്ച സാഹചര്യത്തിലും സേവിക്കാതിരുന്നുവെന്ന ആശയം വ്യക്തമാക്കുന്നു; ‘സമൃദ്ധി കാരണം’ എന്ന തെറ്റായ കാരണബന്ധം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമത്തെ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി സംരക്ഷിക്കുന്നു.
- issue: עבד എന്ന പദത്തിലെ ഉടമ്പടിസേവനത്തിന്റെ വ്യാപ്തി
  choice: സേവിക്കുക
  alternative: ആരാധിക്കുക
  rationale: ‘ആരാധിക്കുക’ എന്നതിലൊതുങ്ങാതെ ആരാധനാപരമായ ഭക്തിയും പ്രായോഗിക അനുസരണവും ഉൾക്കൊള്ളുന്നു.
- issue: מֵרֹב כֹּל എന്നതിന്റെ ബന്ധം
  choice: സമൃദ്ധി ഉണ്ടായിരുന്നിട്ടും
  alternative: എല്ലാറ്റിന്റെയും സമൃദ്ധി നിമിത്തം
  rationale: ഇസ്രായേലിന്റെ പരാജയം സമൃദ്ധമായ പരിപാലനത്തിനിടയിലാണ് സംഭവിച്ചതെന്ന ആശയം നൽകുന്നു; സമൃദ്ധിയെത്തന്നെ അവിശ്വസ്തതയുടെ നേരിട്ടുള്ള കാരണമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. തുടർന്നുവരുന്ന ശാപവാക്യവുമായി ബന്ധിപ്പിക്കാൻ വാക്യാവസാനത്തിലെ കോമ നിലനിർത്തി. ‘നീ’ എന്ന ഏകവചനരൂപം ഉടമ്പടിസമൂഹമായ ഇസ്രായേലിനോടുള്ള എബ്രായ ഏകവചന അഭിസംബോധന സംരക്ഷിക്കുന്നു.
