review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the foreign people, the agricultural yield, and the continuing oppression. However, തിന്നുകളയും adds an unexpressed completive/force (‘eat up’), whereas יֹאכַל is the ordinary ‘will eat.’ The rendering ‘നിന്റെ അധ്വാനത്തിന്റെ ഫലമെല്ലാം’ is defensible contextually but slightly narrows the Hebrew’s productive ambiguity between ‘labor/toil’ and its yield.
  naturalness: The Malayalam is clear and suitably grave. ‘നിന്റെ എല്ലാ അധ്വാനഫലവും’ is more idiomatic than ‘നിന്റെ അധ്വാനത്തിന്റെ ഫലമെല്ലാം’ and avoids the repeated sequence ‘ഫലവും ... ഫലമെല്ലാം.’ ‘തകർക്കപ്പെട്ടവനും’ more explicitly reflects the passive sense of ‘crushed.’
  terminology: ‘ഒരു ജനം,’ ‘നിലത്തിന്റെ ഫലം,’ and ‘പീഡിതൻ’ are appropriate modern-standard Malayalam choices. The footnotes appropriately retain lexical alternatives and do not introduce theological interpretation.
  issues:
  - severity: low
    issue: ‘തിന്നുകളയും’ is stronger than the source verb.
    rationale: The Hebrew יֹאכַל is the ordinary verb ‘will eat’; ‘തിന്നും’ preserves this without adding a completive nuance.
  - severity: low
    issue: The main text over-specifies יְגִיעֲךָ as the product of labor.
    rationale: The noun can denote labor/toil as well as what labor produces. ‘അധ്വാനഫലം’ remains natural with ‘eat’ while allowing the footnote to preserve the more literal alternative.
  - severity: low
    issue: ‘തകർന്നവൻ’ can sound intransitive or resultative without clearly marking the passive force.
    rationale: ‘തകർക്കപ്പെട്ടവൻ’ more directly conveys רָצוּץ, ‘crushed/broken down,’ alongside ‘പീഡിതൻ.’
  revised_text: നിനക്കു പരിചയമില്ലാത്ത ഒരു ജനം നിന്റെ നിലത്തിന്റെ ഫലവും[a] നിന്റെ എല്ലാ അധ്വാനഫലവും[b] തിന്നും; നീ എല്ലാ ദിവസവും പീഡിതനും തകർക്കപ്പെട്ടവനും മാത്രമായിരിക്കും.
