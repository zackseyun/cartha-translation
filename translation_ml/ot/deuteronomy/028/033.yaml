source:
  edition: WLC
  text: פְּרִ֤י אַדְמָֽתְ/ךָ֙ וְ/כָל יְגִ֣יעֲ/ךָ֔ יֹאכַ֥ל עַ֖ם אֲשֶׁ֣ר לֹא יָדָ֑עְתָּ וְ/הָיִ֗יתָ רַ֛ק עָשׁ֥וּק וְ/רָצ֖וּץ כָּל הַ/יָּמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/033.yaml
  text: A people whom you have not known will eat the fruit of your land and all your labor[b][a], and you will be only oppressed and crushed all your days.
translation:
  language: ml
  text: നിനക്കു പരിചയമില്ലാത്ത ഒരു ജനം നിന്റെ നിലത്തിന്റെ ഫലവും[a] നിന്റെ എല്ലാ അധ്വാനഫലവും[b] തിന്നും; നീ എല്ലാ ദിവസവും പീഡിതനും തകർക്കപ്പെട്ടവനും മാത്രമായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിന്റെ നിലത്തിലെ വിളവും.’
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘നിന്റെ എല്ലാ അധ്വാനവും.’ ഇവിടെ അധ്വാനത്തിലൂടെ ലഭിച്ചതിനെയും ഈ പദം സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּרִי אַדְמָתְךָ
  choice: നിന്റെ നിലത്തിന്റെ ഫലം
  rationale: കൃഷിഭൂമിയിൽനിന്നുള്ള ഫലം അഥവാ വിളവ് എന്ന മൂർത്തമായ കാർഷികചിത്രം നിലനിർത്തുന്നു.
- source_word: יְגִיעֲךָ
  choice: നിന്റെ അധ്വാനത്തിന്റെ ഫലം
  rationale: ഈ നാമത്തിന് അധ്വാനം എന്നും അധ്വാനത്തിലൂടെ ലഭിച്ചത് എന്നും അർഥമാകാം. ‘തിന്നുകളയും’ എന്ന ക്രിയയോടൊപ്പം സ്വാഭാവികമായ മലയാളത്തിനായി അധ്വാനത്തിലൂടെ ലഭിച്ച ഫലം എന്ന സൂചന വ്യക്തമാക്കിയിരിക്കുന്നു; കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള രൂപം അടിക്കുറിപ്പിൽ നൽകിയിട്ടുണ്ട്.
- source_word: יֹאכַל
  choice: തിന്നുകളയും
  rationale: സാധാരണയായ ‘തിന്നുക’ എന്ന അർഥം നിലനിർത്തിക്കൊണ്ട്, മറ്റൊരു ജനം വിളവും അധ്വാനഫലവും കൈവശപ്പെടുത്തി ഉപഭോഗം ചെയ്യുമെന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: עַם אֲשֶׁר לֹא יָדָעְתָּ
  choice: നിനക്കു പരിചയമില്ലാത്ത ഒരു ജനം
  rationale: മുമ്പ് അറിയാത്ത ഒരു ജനവിഭാഗം എന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ‘ജനം’ എന്ന ഏകവചന കൂട്ടനാമവും നിലനിർത്തുന്നു.
- source_word: רַק עָשׁוּק וְרָצוּץ
  choice: പീഡിതനും തകർന്നവനും മാത്രമായിരിക്കും
  rationale: רַק സൂചിപ്പിക്കുന്ന ഒഴിവില്ലാത്ത അവസ്ഥ ‘മാത്രം’കൊണ്ട് നിലനിർത്തുന്നു. രണ്ട് പദങ്ങളുടെയും പീഡനവും തകർച്ചയും സൂചിപ്പിക്കുന്ന ശക്തി വേർതിരിച്ചും സംക്ഷിപ്തമായും നൽകുന്നു.
- source_word: כָּל הַיָּמִים
  choice: എല്ലാ ദിവസവും
  rationale: തുടർച്ചയായ, വിടവില്ലാത്ത ദൈർഘ്യം വ്യക്തമാക്കുന്ന ഹീബ്രു പ്രയോഗത്തെ നേരിട്ടും സ്വാഭാവികമായും പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ഏകവചന അഭിസംബോധനയായ ‘നീ/നിന്റെ’ നിലനിർത്തി. കാർഷികചിത്രവും നിരന്തരമായ പീഡനത്തിന്റെ ശക്തിയും സംരക്ഷിച്ചിട്ടുണ്ട്.
