id: DEU.28.28
reference: Deuteronomy 28:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: יַכְּ/כָ֣ה יְהוָ֔ה בְּ/שִׁגָּע֖וֹן וּ/בְ/עִוָּר֑וֹן וּ/בְ/תִמְה֖וֹן לֵבָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/028.yaml
  text: Yahweh will strike you with madness and blindness and confusion of heart[a].
translation:
  language: ml
  text: യഹ്‌വെ നിന്നെ ഭ്രാന്തുകൊണ്ടും അന്ധതകൊണ്ടും ഹൃദയത്തിന്റെ ആശയക്കുഴപ്പത്താലും[a] പ്രഹരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഹൃദയത്തിന്റെ അമ്പരപ്പിനാൽ’ അല്ലെങ്കിൽ ‘ഹൃദയത്തിന്റെ പരിഭ്രാന്തിയാൽ.’
    reason: תִמְהוֹן എന്ന പദത്തിന്റെ അർഥവ്യാപ്തിയിൽ ആശയക്കുഴപ്പം, അമ്പരപ്പ്, പരിഭ്രാന്തി എന്നിവ ഉൾപ്പെടുന്നതിനാൽ സാധ്യമായ പരിഭാഷകൾ രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: יַכְּכָה
  choice: നിന്നെ … പ്രഹരിക്കും
  rationale: נכה എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം അടിക്കുകയോ ശിക്ഷയായി ബാധിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പ്രഹരിക്കും’ ഉടമ്പടിശാപത്തിന്റെ ശക്തി നിലനിർത്തുന്ന, ഗൗരവമുള്ള ആധുനിക മലയാളപ്രയോഗമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി യഹൂദപാരമ്പര്യത്തിലെ പകരപ്പദവിയാൽ മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരിച്ചു.
- source_word: בְּשִׁגָּעוֹן
  choice: ഭ്രാന്തുകൊണ്ട്
  rationale: שִׁגָּעוֹן മാനസിക വിഭ്രാന്തിയെയോ ഭ്രാന്തിനെയോ നേരിട്ട് സൂചിപ്പിക്കുന്നു; ശാപസന്ദർഭത്തിൽ ‘ഭ്രാന്ത്’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וּבְעִוָּרוֹן
  choice: അന്ധതകൊണ്ട്
  rationale: עִוָּרוֹן എന്നത് അക്ഷരാർഥത്തിൽ അന്ധതയാണ്. ‘മാനസിക അന്ധത’ എന്ന വ്യാഖ്യാനവികാസം ചേർക്കാതെ മൂലപദത്തിന്റെ വ്യാപ്തി സംരക്ഷിച്ചു.
- source_word: וּבְתִמְהוֹן לֵבָב
  choice: ഹൃദയത്തിന്റെ ആശയക്കുഴപ്പത്താൽ
  rationale: תִמְהוֹן ആശയക്കുഴപ്പം, അമ്പരപ്പ്, പരിഭ്രാന്തി എന്നീ അർഥങ്ങൾ വഹിക്കുന്നു; לֵבָב ഹൃദയത്തെയും ആന്തരിക മനസ്സിനെയും സൂചിപ്പിക്കാം. ‘ഹൃദയത്തിന്റെ ആശയക്കുഴപ്പം’ എബ്രായ ദൃശ്യരൂപം നിലനിർത്തുന്നു.
- source_word: לֵבָב
  choice: ഹൃദയം
  rationale: ഈ പദത്തിന് മനസ്സ്, ഇച്ഛ, ആന്തരിക വ്യക്തിത്വം എന്നീ അർഥവ്യാപ്തിയുണ്ടെങ്കിലും ‘ഹൃദയം’ മൂലഭാഷയുടെ മനുഷ്യശാസ്ത്രപരമായ രൂപകം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: വാക്യത്തിൽ ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ അതിനെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ശൈലി. എബ്രായത്തിലെ മൂന്ന് בְּ ഘടകങ്ങളുടെ സമാന്തരഘടന ‘കൊണ്ടും…കൊണ്ടും…ത്താലും’ എന്ന ക്രമത്തിൽ നിലനിർത്തി; അവസാനത്തെ ‘ഹൃദയം’ എന്ന രൂപകം വ്യാഖ്യാനിച്ച് ‘മനസ്സ്’ എന്നു മാറ്റിയിട്ടില്ല.
