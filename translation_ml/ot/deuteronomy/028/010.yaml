id: DEU.28.10
reference: Deuteronomy 28:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/רָאוּ֙ כָּל עַמֵּ֣י הָ/אָ֔רֶץ כִּ֛י שֵׁ֥ם יְהוָ֖ה נִקְרָ֣א עָלֶ֑י/ךָ וְ/יָֽרְא֖וּ מִמֶּֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/010.yaml
  text: Then all the peoples of the earth will see that the name of Yahweh is called upon you[a], and they will fear you.
translation:
  language: ml
  text: അപ്പോൾ ഭൂമിയിലെ സകല ജനതകളും യഹ്‌വേയുടെ നാമം നിന്റെമേൽ വിളിക്കപ്പെട്ടിരിക്കുന്നുവെന്ന് കാണുകയും നിന്നെ ഭയപ്പെടുകയും ചെയ്യും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְרָאוּ
  choice: അപ്പോൾ ... കാണും
  rationale: അനുഗ്രഹവാഗ്ദാനങ്ങളുടെ തുടർച്ചയിൽ ഫലസൂചനയുള്ള ഭാവികാലമായി സ്വാഭാവികമായി വായിക്കാം; വാവിന്റെ ബന്ധവും സന്ദർഭത്തിലെ ഫലപ്രവാഹവും ‘അപ്പോൾ’ വ്യക്തമാക്കുന്നു.
- source_word: כָּל עַמֵּי הָאָרֶץ
  choice: ഭൂമിയിലെ സകല ജനതകളും
  rationale: עַמֵּי എന്ന ബഹുവചനം വിവിധ ജനസമൂഹങ്ങളെ സൂചിപ്പിക്കുന്നു; അന്തർദേശീയമായ ഈ സന്ദർഭത്തിൽ הָאָרֶץ എന്നത് ‘ദേശം’ എന്നതിനെക്കാൾ ‘ഭൂമി’ എന്നാണ് യോജിക്കുന്നത്.
- source_word: כִּי
  choice: എന്നു
  rationale: ജനതകൾ കാണുന്നതിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നതിനാൽ മലയാളത്തിലെ ഉദ്ധരണിപൂരകമായ ‘എന്നു’ സ്വാഭാവികമാണ്.
- source_word: שֵׁם יְהוָה
  choice: യഹ്‌വേയുടെ നാമം
  rationale: എബ്രായ സംയുക്തപ്രയോഗത്തിന്റെ അർഥം നിലനിർത്തുകയും יהוה എന്ന ഉടമ്പടിനാമം ‘യഹ്‌വേ’യായി ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: נִקְרָא עָלֶיךָ
  choice: നിന്റെമേൽ വിളിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: ദൈവനാമം ഒരാളുടെമേൽ വിളിക്കപ്പെടുന്നു എന്ന എബ്രായ രൂപകവും നിഷ്ക്രിയക്രിയയും עַל എന്നതിന്റെ ദിശാസൂചനയും സംരക്ഷിക്കുന്നു; ഇത് ഉടമ്പടിപരമായ തിരിച്ചറിയലും അവകാശബന്ധവും സൂചിപ്പിക്കുന്നു.
- source_word: וְיָרְאוּ מִמֶּךָּ
  choice: നിന്നെ ഭയപ്പെടും
  rationale: ഇവിടെ ירא യഹ്‌വേയുടെ അനുഗ്രഹവും അധികാരവും ഇസ്രായേലിന്മേൽ പ്രകടമാകുന്നതോടുള്ള ഭയത്തെ സൂചിപ്പിക്കുന്നു; ‘ഭയപ്പെടുക’ ഭീതിയും ആദരപൂർവമായ ഭയവും തമ്മിലുള്ള അർഥവ്യാപ്തി ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം ഒരു പൊതുപദവിയായി മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- issue: נִקְרָא עָלֶיךָ എന്ന പ്രയോഗത്തിന്റെ അർഥശക്തി
  choice: യഹ്‌വേയുടെ നാമം നിന്റെമേൽ വിളിക്കപ്പെട്ടിരിക്കുന്നു
  alternative: നീ യഹ്‌വേയുടെ നാമത്താൽ വിളിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: ഇസ്രായേൽ യഹ്‌വേയുടേതായി പരസ്യമായി അടയാളപ്പെടുത്തപ്പെടുന്നു എന്ന ആശയം ഉൾക്കൊള്ളുമ്പോഴും, മൂലത്തിലെ ‘നാമം ... നിന്റെമേൽ’ എന്ന രൂപകവും അതിലെ യഥാർഥ അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സകല’യും ‘നാമം’യും വേദപാഠത്തിന് യോജിച്ച ഔപചാരികത നൽകുന്നു; അപരിചിതമായ എബ്രായ പ്രയോഗം മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ച് അടിക്കുറിപ്പിൽ വിശദീകരിച്ചിരിക്കുന്നു.
