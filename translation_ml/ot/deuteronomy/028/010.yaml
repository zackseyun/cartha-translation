revisions:
- from: അപ്പോൾ ഭൂമിയിലെ സകല ജനതകളും യഹ്‌വേയുടെ നാമം നിന്റെമേൽ വിളിക്കപ്പെട്ടിരിക്കുന്നു[a] എന്നു കാണുകയും നിന്നെ ഭയപ്പെടുകയും ചെയ്യും.
