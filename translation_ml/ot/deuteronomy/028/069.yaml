  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֵלֶּה֩ דִבְרֵ֨י הַ/בְּרִ֜ית אֲֽשֶׁר צִוָּ֧ה יְהוָ֣ה אֶת מֹשֶׁ֗ה לִ/כְרֹ֛ת אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל בְּ/אֶ֣רֶץ מוֹאָ֑ב מִ/לְּ/בַ֣ד הַ/בְּרִ֔ית אֲשֶׁר כָּרַ֥ת אִתָּ֖/ם בְּ/חֹרֵֽב־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/069.yaml
  text: These are the words of the covenant that Yahweh commanded Moses to make with the sons of Israel in the land of Moab[a], besides the covenant that he made with them at Horeb.
translation:
  language: ml
  text: ഹോരേബിൽ അവരോടു അവൻ ചെയ്ത ഉടമ്പടിക്കു പുറമേ, മോവാബ് ദേശത്ത് ഇസ്രായേൽമക്കളോടു ഉടമ്പടി ചെയ്യാൻ യാഹ്‌വേ മോശയോടു കൽപ്പിച്ച ഉടമ്പടിയുടെ വചനങ്ങൾ ഇവയാണ്[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഉടമ്പടി ചെയ്യുക’ എന്നതിന്റെ എബ്രായപ്രയോഗം അക്ഷരാർഥത്തിൽ ‘ഉടമ്പടി മുറിക്കുക’ എന്നാണ്; വാക്യത്തിന്റെ അവസാനഭാഗത്തും ഇതേ പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה דִבְרֵי הַבְּרִית
  choice: ഉടമ്പടിയുടെ വചനങ്ങൾ ഇവയാണ്
  rationale: എബ്രായത്തിലെ ശീർഷകസ്വഭാവമുള്ള പ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു; דִבְרֵי എന്നത് ഉടമ്പടിയുടെ വാചിക ഉള്ളടക്കത്തെയും വ്യവസ്ഥകളെയും സൂചിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പദവികൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ നാമരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: לִכְרֹת ... הַבְּרִית / כָּרַת
  choice: ഉടമ്പടി ചെയ്യാൻ / ചെയ്ത ഉടമ്പടി
  rationale: അക്ഷരാർഥത്തിൽ ‘മുറിക്കുക’ എന്നാണെങ്കിലും ഇത് ഉടമ്പടി സ്ഥാപിക്കുന്നതിനുള്ള സ്ഥിരമായ എബ്രായ ശൈലിയാണ്; മലയാളത്തിൽ ‘ഉടമ്പടി ചെയ്യുക’ സ്വാഭാവികമാണ്. അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന ഉറവിടരൂപത്തിന്റെ കുടുംബപരവും സമൂഹപരവുമായ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּאֶרֶץ מוֹאָב
  choice: മോവാബ് ദേശത്തുവെച്ച്
  rationale: ഭൂമിശാസ്ത്രപരമായ ഔപചാരികതയും ഉടമ്പടി നടന്ന സ്ഥലസൂചനയും സംരക്ഷിക്കുന്നു.
- source_word: מִלְּבַד
  choice: പുറമേ
  rationale: ഹോരേബിലെ ഉടമ്പടിയിൽനിന്ന് വ്യത്യസ്തമായ മറ്റൊരു ഉടമ്പടിയാണെന്ന താരതമ്യബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: בְּחֹרֵב
  choice: ഹോരേബിൽവെച്ച്
  rationale: ഹോരേബ് എന്ന എബ്രായ സ്ഥലനാമം സീനായി എന്നാക്കി സമന്വയിപ്പിക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ബְּנֵי יִשְׂרָאֵל എന്ന സമൂഹസൂചക പ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ / ഇസ്രായേൽജനം
  rationale: മൂലത്തിലെ ‘മക്കൾ/പുത്രന്മാർ’ എന്ന രൂപം കാണാവുന്നവിധം സൂക്ഷിക്കുമ്പോഴും സാധാരണ മലയാളത്തിൽ സ്വാഭാവികവും സമൂഹത്തെ മുഴുവനായി സൂചിപ്പിക്കുന്നതുമാണ്.
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ അവതരണം
  choice: യഹോവ
  alternative: യാഹ്‌വേ / കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമത്തെ ഒരു പദവിയാക്കി മാറ്റാതെ സംരക്ഷിക്കുന്നു; ‘യഹോവ’ ആധുനിക മലയാള ബൈബിൾ വായനക്കാർക്ക് വ്യാപകമായി തിരിച്ചറിയാവുന്ന രൂപമാണ്.
- issue: മോവാബിലെ ഉടമ്പടിയും ഹോരേബിലെ ഉടമ്പടിയും തമ്മിലുള്ള ബന്ധം
  choice: ഹോരേബിൽവെച്ച് അവരുമായി ചെയ്ത ഉടമ്പടിക്കു പുറമേയായിരുന്നു ഇത്
  alternative: ഹോരേബിൽ ചെയ്ത ഉടമ്പടിയിൽനിന്ന് വേറിട്ടതായിരുന്നു ഇത്
  rationale: מִלְּבַד എന്നത് ‘പുറമേ/കൂടാതെ’ എന്ന ബന്ധം വ്യക്തമാക്കുന്നു; രണ്ട് ഉടമ്പടികളുടെ ദൈവശാസ്ത്രപരമായ ബന്ധം കൂടുതൽ വിശദീകരിക്കാതെ മൂലത്തിലെ പ്രസ്താവന മാത്രം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും പൊതുവായ വായനയ്ക്ക് സുലഭവുമായ മലയാളം. മൂലത്തിലെ ശീർഷകഘടന നിലനിർത്തുന്നതിനൊപ്പം രണ്ടാം വാക്യത്തിൽ സൂചകസർവനാമം ചേർത്ത് മലയാളത്തിലെ ബന്ധം വ്യക്തമാക്കിയിരിക്കുന്നു.
