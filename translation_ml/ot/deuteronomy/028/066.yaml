translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. ‘തൂങ്ങിയാടിക്കൊണ്ടിരിക്കും’ എന്ന ദൃശ്യാത്മക പ്രയോഗം മൂലപാഠത്തിലെ രൂപകവും അപകടാവസ്ഥയും സംരക്ഷിക്കുന്നു; അവസാന ഭാഗം അതിജീവനത്തെക്കുറിച്ചുള്ള ഉറപ്പില്ലായ്മയെന്ന സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു.
