review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the three clauses and preserves the Hebrew order ‘night and day.’ However, ‘തൂങ്ങിയാടിക്കൊണ്ടിരിക്കും’ suggests swinging/swaying, which adds motion not present in the passive participle תְּלֻאִים (‘hanging/suspended’) and is less fitting for the image of precarious survival.
  naturalness: The verse is generally clear and appropriately solemn in modern standard Malayalam. ‘തൂങ്ങിക്കിടക്കും’ is more idiomatic and precise here than ‘തൂങ്ങിയാടിക്കൊണ്ടിരിക്കും.’ The final clause is natural and faithfully conveys lack of confidence in continued survival.
  terminology: ‘ജീവൻ,’ ‘മുമ്പിൽ,’ ‘ഭയപ്പെടും,’ and ‘ഉറപ്പുണ്ടാകുകയില്ല’ are suitable. No theological terminology issue arises. The footnote accurately explains the metaphor, but its alternative should match the revised wording.
  issues:
  - severity: medium
    issue: ‘തൂങ്ങിയാടിക്കൊണ്ടിരിക്കും’ over-specifies the image.
    rationale: The Hebrew תְּלֻאִים is ‘hanging/suspended’; it does not inherently denote swaying. Malayalam ‘തൂങ്ങിയാടുക’ evokes dangling or swinging, adding an unnecessary nuance. ‘തൂങ്ങിക്കിടക്കും’ retains the image and precarious uncertainty without expansion.
  revised_text: നിന്റെ ജീവൻ നിന്റെ മുമ്പിൽ തൂങ്ങിക്കിടക്കും[a]; രാവും പകലും നീ ഭയപ്പെടും; നിന്റെ ജീവൻ നിലനിൽക്കുമെന്ന് നിനക്ക് ഉറപ്പുണ്ടാകുകയില്ല.
