source:
  edition: WLC
  text: וְ/הָי֣וּ חַיֶּ֔י/ךָ תְּלֻאִ֥ים לְ/ךָ֖ מִ/נֶּ֑גֶד וּ/פָֽחַדְתָּ֙ לַ֣יְלָה וְ/יוֹמָ֔ם וְ/לֹ֥א תַאֲמִ֖ין בְּ/חַיֶּֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/066.yaml
  text: Your life will hang in doubt before you[a]; you will fear night and day[b], and you will have no assurance of your life.
translation:
  language: ml
  text: നിന്റെ ജീവൻ നിന്റെ മുമ്പിൽ തൂങ്ങിക്കിടക്കും[a]; രാവും പകലും നീ ഭയപ്പെടും; നിന്റെ ജീവൻ നിലനിൽക്കുമെന്ന് നിനക്ക് ഉറപ്പുണ്ടാകുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിന്റെ ജീവൻ നിന്റെ മുമ്പിൽ തൂങ്ങിക്കിടക്കും.’ എബ്രായത്തിലെ ദൃശ്യരൂപം ജീവൻ അപകടകരമായി തൂങ്ങിനിൽക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; അതിലൂടെ അതിജീവനത്തെക്കുറിച്ചുള്ള നിരന്തരമായ അനിശ്ചിതത്വം പ്രകടമാകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיֶּיךָ
  choice: നിന്റെ ജീവൻ
  rationale: രൂപത്തിൽ ബഹുവചനമാണെങ്കിലും, ഇവിടെ ഒരാളുടെ ജീവനും തുടർന്നുള്ള നിലനിൽപ്പുമാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ഏകവചനം സ്വാഭാവികമാണ്.
- source_word: תְּלֻאִים
  choice: തൂങ്ങിയാടിക്കൊണ്ടിരിക്കും
  rationale: תלה എന്ന ‘തൂക്കുക’ എന്ന ധാതുവിൽനിന്നുള്ള പദത്തിന്റെ ദൃശ്യരൂപം നിലനിർത്തുന്നു; ജീവൻ അപകടകരമായി തൂങ്ങിനിൽക്കുന്നതും അതിലൂടെ നിരന്തരമായ അനിശ്ചിതത്വവും സൂചിപ്പിക്കുന്നു.
- source_word: לְךָ מִנֶּגֶד
  choice: നിന്റെ മുമ്പിൽ
  rationale: ‘നിന്റെ മുമ്പിൽ/എതിർവശത്ത്’ എന്ന സ്ഥലസൂചന നേരിട്ട് നിലനിർത്തുകയും ജീവന്റെ ഭീഷണി എപ്പോഴും കൺമുന്നിലുണ്ടെന്ന ആശയം നൽകുകയും ചെയ്യുന്നു.
- source_word: וּפָחַדְתָּ
  choice: നീ ഭയപ്പെടും
  rationale: פחד എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לַיְלָה וְיוֹמָם
  choice: രാവും പകലും
  rationale: എബ്രായത്തിലെ ‘രാത്രിയും പകലും’ എന്ന ക്രമവും നിരന്തരതയും മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: לֹא תַאֲמִין בְּחַיֶּיךָ
  choice: നിന്റെ ജീവൻ നിലനിൽക്കുമെന്ന് നിനക്ക് ഉറപ്പുണ്ടാകുകയുമില്ല
  rationale: אמן എന്ന ക്രിയയുടെ ഇവിടെ പ്രസക്തമായ ‘ഉറപ്പുണ്ടായിരിക്കുക/വിശ്വാസമുണ്ടായിരിക്കുക’ എന്ന അർഥം, സ്വന്തം തുടർജീവിതത്തെക്കുറിച്ചുള്ള ഉറപ്പില്ലായ്മയായി വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
