id: DEU.28.11
reference: Deuteronomy 28:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הוֹתִֽרְ/ךָ֤ יְהוָה֙ לְ/טוֹבָ֔ה בִּ/פְרִ֧י בִטְנְ/ךָ֛ וּ/בִ/פְרִ֥י בְהַמְתְּ/ךָ֖ וּ/בִ/פְרִ֣י אַדְמָתֶ֑/ךָ עַ֚ל הָ/אֲדָמָ֔ה אֲשֶׁ֨ר נִשְׁבַּ֧ע יְהוָ֛ה לַ/אֲבֹתֶ֖י/ךָ לָ֥/תֶת לָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/011.yaml
  text: And Yahweh will make you abound in prosperity[a], in the fruit of your womb, in the fruit of your livestock, and in the fruit of your ground[c][b], on the land that Yahweh swore to your fathers to give you.
translation:
  language: ml
  text: യഹ്‌വെ നിനക്കു നന്മയ്ക്കായി[a] സമൃദ്ധി നൽകും—നിന്റെ ഗർഭഫലത്തിലും[b] നിന്റെ കന്നുകാലികളുടെ സന്തതിയിലും നിന്റെ നിലത്തിന്റെ വിളവിലും[c]—നിനക്കു തരാമെന്ന് യഹ്‌വെ നിന്റെ പിതാക്കന്മാരോടു സത്യംചെയ്ത ദേശത്ത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘നന്മയിലേക്കായി’ അല്ലെങ്കിൽ ‘ക്ഷേമത്തിനായി.’
    reason: lexical_alternative
  - marker: b
    text: ‘ഗർഭഫലം’ എന്ന എബ്രായ പ്രയോഗം മക്കളെയോ സന്തതിയെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘നിന്റെ മണ്ണിന്റെ ഉൽപ്പാദനത്തിൽ’ അല്ലെങ്കിൽ ‘നിന്റെ നിലത്തിന്റെ വിളവെടുപ്പിൽ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹתִרְךָ
  choice: നിനക്കു ... സമൃദ്ധി നൽകും
  rationale: יתר എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലുള്ള കാരകഭാവവും സമൃദ്ധി അഥവാ മിച്ചം ഉണ്ടാക്കുക എന്ന ആശയവും സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: לְטוֹבָה
  choice: നന്മയ്ക്കായി
  rationale: അക്ഷരാർഥമായ ‘നന്മയ്ക്കായി’ എന്ന അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ക്ഷേമകരമായ സമൃദ്ധിയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ ഉടമ്പടിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בִּפְרִי בִטְנְךָ
  choice: നിന്റെ ഗർഭഫലത്തിൽ
  rationale: മക്കളെയോ സന്തതിയെയോ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം നിലനിർത്തുകയും വാക്യത്തിലെ ‘ഫലം’ എന്ന ആവർത്തനഘടന സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: וּבִפְרִי בְהֶמְתְּךָ
  choice: നിന്റെ കന്നുകാലികളുടെ സന്തതിയിൽ
  rationale: മൃഗങ്ങളുടെ ‘ഫലം’ എന്ന അക്ഷരാർഥത്തെ സ്വാഭാവിക മലയാളത്തിൽ അവയുടെ സന്തതി എന്നു വ്യക്തമാക്കുന്നു.
- source_word: וּבִפְרִי אַדְמָתֶךָ
  choice: നിന്റെ നിലത്തിന്റെ വിളവിൽ
  rationale: കൃഷിചെയ്യുന്ന മണ്ണിൽനിന്നുള്ള ഉൽപ്പാദനം എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: עַל הָאֲדָמָה
  choice: ദേശത്ത്
  rationale: ഇവിടെ അനുഗ്രഹങ്ങൾ അനുഭവിക്കപ്പെടുന്ന വാഗ്ദത്തദേശം ഉദ്ദേശിക്കപ്പെടുന്നതിനാൽ ‘ദേശത്ത്’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה לַאֲבֹתֶיךָ לָתֶת לָךְ
  choice: നിനക്കു തരാമെന്ന് യഹ്‌വെ നിന്റെ പിതാക്കന്മാരോടു സത്യംചെയ്ത
  rationale: ശപഥം പിതാക്കന്മാരോടും ദേശം ലഭിക്കുന്നത് ഇപ്പോഴത്തെ അഭിസംബോധിതനുമാണെന്ന എബ്രായ വാക്യഘടനയിലെ വ്യത്യാസം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ഉടമ്പടിനാമമായ יְהוָה എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ സ്ഥാനപ്പേരിനു പകരം ആ നാമത്തിന്റെ ലിപ്യന്തരണം നൽകി.
- issue: ‘ഗർഭഫലം’ എന്ന പ്രയോഗം വ്യാഖ്യാനിച്ച് ‘മക്കൾ’ എന്നു നൽകണമോ
  choice: ഗർഭഫലം എന്ന പ്രയോഗം നിലനിർത്തി
  alternative: മക്കൾ; സന്തതി
  rationale: ഇത് മനസ്സിലാക്കാവുന്ന പ്രയോഗമാണ്; മനുഷ്യർ, മൃഗങ്ങൾ, നിലം എന്നീ മൂന്നു മേഖലകളെയും ഫലസമൃദ്ധിയിലൂടെ ബന്ധിപ്പിക്കുന്ന മൂലപാഠത്തിന്റെ ദൃശ്യവും ഘടനയും ഇതിലൂടെ നിലനിൽക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഏകവചന അഭിസംബോധന നിലനിർത്തി. എബ്രായത്തിലെ അനുഗ്രഹപ്പട്ടിക വ്യക്തമാക്കാൻ ദീർഘവിരാമങ്ങൾ ഉപയോഗിച്ചു; അക്ഷരാർഥപരമായ ആവർത്തനവും മലയാളത്തിലെ സ്വാഭാവികതയും തമ്മിൽ സമതുലനം പാലിച്ചു.
