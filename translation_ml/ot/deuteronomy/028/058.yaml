source:
  edition: WLC
  text: אִם לֹ֨א תִשְׁמֹ֜ר לַ/עֲשׂ֗וֹת אֶת כָּל דִּבְרֵי֙ הַ/תּוֹרָ֣ה הַ/זֹּ֔את הַ/כְּתוּבִ֖ים בַּ/סֵּ֣פֶר הַ/זֶּ֑ה לְ֠/יִרְאָה אֶת הַ/שֵּׁ֞ם הַ/נִּכְבָּ֤ד וְ/הַ/נּוֹרָא֙ הַ/זֶּ֔ה אֵ֖ת יְהוָ֥ה אֱלֹהֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/058.yaml
  text: If you are not careful to do all the words of this law that are written in this book[c][b][a], to fear this glorious and awesome name—Yahweh your God—
translation:
  language: ml
  text: ഈ പുസ്തകത്തിൽ[a] എഴുതിയിരിക്കുന്ന ഈ ന്യായപ്രമാണത്തിലെ എല്ലാ വാക്കുകളും അനുസരിക്കാനും, മഹത്ത്വമേറിയതും ഭയജനകവുമായ ഈ നാമത്തെ—നിന്റെ ദൈവമായ യാഹ്‌വെയെ[c]—ഭയപ്പെടാനും[b] നീ ശ്രദ്ധിക്കാതിരുന്നാൽ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘ചുരുളിൽ.’'
    reason: lexical_alternative
  - marker: b
    text: ‘ഭയപ്പെടുക’ എന്ന എബ്രായപദത്തിൽ ഭയത്തോടുകൂടിയ ഭക്ത്യാദരം എന്ന അർഥവും ഉൾപ്പെടാം.
    reason: lexical_alternative
  - marker: c
    text: 'എബ്രായത്തിൽ: ‘YHWH’; പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു വിവർത്തനം ചെയ്തിട്ടുണ്ട്.'
    reason: alternative_reading
lexical_decisions:
- source_word: תִשְׁמֹר לַעֲשׂוֹת
  choice: ശ്രദ്ധയോടെ അനുസരിക്കുകയും ... ചെയ്യാതിരുന്നാൽ
  rationale: ശמר + עשׂה എന്ന ഉടമ്പടിപരമായ പ്രയോഗത്തിലെ ശ്രദ്ധാപൂർവമായ കാത്തുപാലിക്കലും പ്രായോഗിക അനുസരണവും സ്വാഭാവിക മലയാളത്തിൽ ഒരുമിച്ചു പ്രകടിപ്പിക്കുന്നു.
- source_word: כָּל דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: ഈ ന്യായപ്രമാണത്തിലെ വാക്കുകളെല്ലാം
  rationale: דברים എന്നതിന്റെ ‘വാക്കുകൾ’ എന്ന രൂപവും, ആവർത്തനപുസ്തകത്തിലെ ഉടമ്പടി-നിയമസന്ദർഭത്തിൽ תורה എന്നതിന്റെ നിയമപരമായ അർഥവും നിലനിർത്തുന്നു.
- source_word: הַכְּתוּבִים בַּסֵּפֶר הַזֶּה
  choice: ഈ പുസ്തകത്തിൽ എഴുതിയിരിക്കുന്ന
  rationale: എഴുതപ്പെട്ട ഉടമ്പടിവചനങ്ങളെ സൂചിപ്പിക്കുന്ന നിഷ്ക്രിയ പങ്കുപദത്തിന്റെ അർഥം നേരിട്ട് നൽകുന്നു; ספר എന്നതിന് ‘പുസ്തകം’ സ്വാഭാവികമാണ്, ‘ചുരുൾ’ ഒരു സാധ്യതയായി അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: לְיִרְאָה
  choice: ഭയപ്പെടുകയും
  rationale: ദൈവത്തോടുള്ള ഭക്ത്യാദരവും ഭയവും ഉൾക്കൊള്ളുന്ന ירא എന്ന ഉടമ്പടിപദത്തിന്റെ ശക്തി മയപ്പെടുത്താതെ സൂക്ഷിക്കുന്നു.
- source_word: הַשֵּׁם
  choice: ഈ നാമത്തെ
  rationale: ദൈവത്തിന്റെ വെളിപ്പെടുത്തപ്പെട്ട വ്യക്തിത്വത്തെയും കീർത്തിയെയും സൂചിപ്പിക്കുന്ന ‘നാമം’ എന്ന പരോക്ഷഭാഷ അതേപടി നിലനിർത്തുന്നു.
- source_word: הַנִּכְבָּד וְהַנּוֹרָא
  choice: മഹത്ത്വമേറിയതും ഭയജനകവുമായ
  rationale: נכבד എന്നതിലെ മഹിമ/ബഹുമാനം, נורא എന്നതിലെ ഭയവും വിസ്മയവും ഉണർത്തുന്ന ശക്തി എന്നിവ വ്യക്തവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ടെട്രാഗ്രാമറ്റൺ ഒരു പദവികൊണ്ട് പകരാതെ ദൈവനാമമായി മലയാളത്തിലെ പ്രചാരമുള്ള ലിപ്യന്തരണത്തിൽ നൽകുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: രണ്ടാം പുരുഷ ഏകവചന പ്രത്യയം നിലനിർത്തുകയും യഹോവയുമായുള്ള ഉടമ്പടിബന്ധം വ്യക്തമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: യാഹ്‌വെ; കർത്താവ്
  rationale: മൂലപാഠം ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ ഒരു പദവിയായ ‘കർത്താവ്’ എന്ന് പകരുന്നില്ല. മലയാള വായനക്കാർക്ക് പരിചിതമായ ‘യഹോവ’ മുഖ്യപാഠത്തിൽ സ്വീകരിക്കുന്നു.
- issue: ירא എന്നത് ഭക്ത്യാദരമായി മയപ്പെടുത്തണമോ
  choice: ഭയപ്പെടുക
  alternative: ഭക്ത്യാദരത്തോടെ വണങ്ങുക
  rationale: ഈ പദത്തിൽ ഭക്ത്യാദരവും യഥാർഥ ഭയവും തമ്മിലുള്ള ഉദ്ദേശ്യപൂർവമായ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിൽക്കുന്നു; അതിനാൽ ‘ഭയം’ മുഖ്യപാഠത്തിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വായനാസൗകര്യവും നിലനിർത്തി. വാക്യം അടുത്ത വാക്യത്തിൽ തുടരുന്ന വ്യവസ്ഥാവാക്യമായതിനാൽ അവസാനം പൂർണ്ണവിരാമത്തിനുപകരം കോമ ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
