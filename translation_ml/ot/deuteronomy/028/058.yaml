  source_fidelity: The conditional structure, written-law reference, covenantal obedience, fear of the name, and second-person singular possessive are substantially represented. However, יְהוָה should be rendered consistently with the supplied POB audit trail as ‘യാഹ്‌വെ,’ rather than ‘യഹോവ.’
