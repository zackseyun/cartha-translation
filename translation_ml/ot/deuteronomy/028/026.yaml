  source_fidelity: 'മൂല എബ്രായവാക്യത്തിന്റെ എല്ലാ പ്രധാന ഘടകങ്ങളും കൃത്യമായി പ്രതിഫലിക്കുന്നു: നിന്റെ ശവം ഭക്ഷണമായിത്തീരുക, ആകാശത്തിലെ പക്ഷികളും ഭൂമിയിലെ മൃഗങ്ങളും, അവയെ അകറ്റാൻ ആരുമില്ല എന്ന ആശയം. ‘അവയെ’ എന്ന സൂചിത കർമം സന്ദർഭാനുസൃതമായി വ്യക്തമായി ചേർത്തിരിക്കുന്നു; അർഥവ്യതിയാനമില്ല.'
