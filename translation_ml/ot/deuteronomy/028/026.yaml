translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ ശാപപ്രഖ്യാപനത്തിന്റെ കഠിനതയും ഗൗരവവും നിലനിർത്തുന്ന ഭാഷ. ‘ശവം’ എന്ന പദം മൂലപാഠത്തിലെ അപമാനഭാവം മൃദൂകരിക്കാതെ നൽകുന്നു; ‘സകല’ എന്നത് വാക്യത്തിന്റെ തിരുവെഴുത്തുസംബന്ധിയായ ഗൗരവഭാവത്തോട് യോജിക്കുന്നു.
