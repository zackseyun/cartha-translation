source:
  edition: WLC
  text: וְ/הָיְתָ֤ה נִבְלָֽתְ/ךָ֙ לְ/מַאֲכָ֔ל לְ/כָל ע֥וֹף הַ/שָּׁמַ֖יִם וּ/לְ/בֶהֱמַ֣ת הָ/אָ֑רֶץ וְ/אֵ֖ין מַחֲרִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/026.yaml
  text: Your carcass will become food for every bird of the sky and for the beasts of the earth[c][b][a], and there will be no one to frighten them away.
translation:
  language: ml
  text: നിന്റെ ശവം ആകാശത്തിലെ സകല പക്ഷികൾക്കും ഭൂമിയിലെ മൃഗങ്ങൾക്കും ആഹാരമായിത്തീരും[a][b]; അവയെ ഭയപ്പെടുത്തി ഓടിക്കാൻ ആരും ഉണ്ടാകുകയില്ല.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിന്റെ മൃതശരീരം’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദത്തിന് ഈ ന്യായവിധിസന്ദർഭത്തിൽ അപമാനകരമായ ഭാവമുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘ആകാശത്തിലെ പക്ഷി’ എന്നും ‘ഭൂമിയിലെ മൃഗങ്ങൾ’ എന്നും. ആകാശം–ഭൂമി എന്ന ഈ പതിവുജോടി ശവം പൂർണമായും അനാഥമായും അപമാനകരമായും ഉപേക്ഷിക്കപ്പെടുന്നതിന് ഊന്നൽ നൽകുന്നു.
    reason: cultural_note
  - marker: c
    text: അതായത്, ശവം തിന്നുന്ന പക്ഷികളെയും മൃഗങ്ങളെയും ഭയപ്പെടുത്തി അകറ്റാൻ ആരും ഉണ്ടാകുകയില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: ആയിത്തീരും
  rationale: ശാപങ്ങളുടെ ഭാവിഫലത്തെ സൂചിപ്പിക്കുന്ന സന്ദർഭത്തിൽ ഈ ക്രിയാരൂപം ഭാവികാലമായി സ്വാഭാവികമായി മനസ്സിലാക്കാം; לְמַאֲכָל എന്ന പദത്തോടൊപ്പം ‘ആഹാരമായിത്തീരും’ എന്നത് ഫലാവസ്ഥ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: נִבְלָתְךָ
  choice: നിന്റെ ശവം
  rationale: നְבֵלָה മരിച്ച ശരീരത്തെ സൂചിപ്പിക്കുകയും ഈ ന്യായവിധിസന്ദർഭത്തിൽ അപമാനത്തിന്റെ കഠിനഭാവം വഹിക്കുകയും ചെയ്യുന്നു. ആധുനിക മലയാളത്തിൽ ‘ശവം’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: לְמַאֲכָל
  choice: ആഹാരമായി
  rationale: ഈ നാമം ഭക്ഷിക്കപ്പെടുന്ന വസ്തുവിനെയോ ആഹാരത്തെയോ സൂചിപ്പിക്കുന്നു; ഫലസൂചകമായ לְ സ്വാഭാവികമായി ‘ആഹാരമായി’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: לְכָל עוֹף הַשָּׁמַיִם
  choice: ആകാശത്തിലെ സകല പക്ഷികൾക്കും
  rationale: עוֹף സമൂഹവാചകമായി പറക്കുന്ന ജീവികളെ സൂചിപ്പിക്കാമെങ്കിലും ഇവിടെ ‘പക്ഷികൾ’ എന്നത് വ്യക്തവും സ്വാഭാവികവുമാണ്; הַשָּׁמַיִם ഇവിടെ ദൃശ്യമായ ആകാശത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: וּלְבֶהֱמַת הָאָרֶץ
  choice: ഭൂമിയിലെ മൃഗങ്ങൾക്കും
  rationale: בְּהֵמָה ഇവിടെ കരയിലെ മൃഗങ്ങളെ സമൂഹവാചകമായി സൂചിപ്പിക്കുന്നു. ‘ഭൂമിയിലെ മൃഗങ്ങൾ’ ആകാശം–ഭൂമി എന്ന എബ്രായ സമാന്തരത നിലനിർത്തുന്നു.
- source_word: וְאֵין מַחֲרִיד
  choice: അവയെ ഭയപ്പെടുത്തി ഓടിക്കാൻ ആരും ഉണ്ടാകുകയില്ല
  rationale: חרד എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഭയപ്പെടുത്തുക എന്ന ആശയം നൽകുന്നു. ശവം തിന്നുന്ന പക്ഷികളെയും മൃഗങ്ങളെയും അകറ്റുന്നതാണ് സന്ദർഭത്തിൽ സൂചിതമായിരിക്കുന്നത്; മലയാളത്തിൽ അർഥവ്യക്തതയ്ക്കായി ‘അവയെ’ ചേർത്തു.
