revisions:
- from: യഹോവ നിന്നെ ഭൂമിയുടെ ഒരറ്റംമുതൽ മറ്റേ അറ്റംവരെ സകല ജനതകളുടെയും ഇടയിൽ ചിതറിക്കും.[a] അവിടെ നീയോ നിന്റെ പിതാക്കന്മാരോ അറിഞ്ഞിട്ടില്ലാത്ത അന്യദേവന്മാരെ—മരത്തെയും കല്ലിനെയും[b]—നീ സേവിക്കും.
  to: യഹ്‌വേ നിന്നെ ഭൂമിയുടെ[a] ഒരറ്റംമുതൽ മറ്റേ അറ്റംവരെ സകല ജനതകളുടെയും ഇടയിൽ ചിതറിക്കും. അവിടെ നീയോ നിന്റെ പിതാക്കന്മാരോ അറിഞ്ഞിട്ടില്ലാത്ത മരവും കല്ലുമായ അന്യദേവന്മാരെ നീ സേവിക്കും.[b]
  rationale: The revision aligns the Malayalam divine-name form with the supplied Yahweh audit decision, corrects the Hebrew apposition ‘wood and stone’ so that it modifies ‘other gods,’ and relocates the lexical-alternative note to its actual anchor. No interpretive or doctrinal expansion has been added.
