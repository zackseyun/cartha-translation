source:
  edition: WLC
  text: וֶ/הֱפִֽיצְ/ךָ֤ יְהוָה֙ בְּ/כָל הָ֣/עַמִּ֔ים מִ/קְצֵ֥ה הָ/אָ֖רֶץ וְ/עַד קְצֵ֣ה הָ/אָ֑רֶץ וְ/עָבַ֨דְתָּ שָּׁ֜ם אֱלֹהִ֣ים אֲחֵרִ֗ים אֲשֶׁ֧ר לֹא יָדַ֛עְתָּ אַתָּ֥ה וַ/אֲבֹתֶ֖י/ךָ עֵ֥ץ וָ/אָֽבֶן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/064.yaml
  text: And Yahweh will scatter you among all the peoples[a], from one end of the earth to the other end of the earth[b], and there you will serve other gods that neither you nor your fathers have known—wood and stone.
translation:
  language: ml
  text: യഹ്‌വേ നിന്നെ ഭൂമിയുടെ[a] ഒരറ്റംമുതൽ മറ്റേ അറ്റംവരെ സകല ജനതകളുടെയും ഇടയിൽ ചിതറിക്കും. അവിടെ നീയോ നിന്റെ പിതാക്കന്മാരോ അറിഞ്ഞിട്ടില്ലാത്ത മരവും കല്ലുമായ അന്യദേവന്മാരെ നീ സേവിക്കും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിലെ אֶרֶץ എന്ന പദത്തിന് ‘ദേശം’ എന്നും ‘ഭൂമി’ എന്നും അർത്ഥമാകാം. അതിനാൽ ‘ദേശത്തിന്റെ ഒരറ്റംമുതൽ മറ്റേ അറ്റംവരെ’ എന്നും പരിഭാഷപ്പെടുത്താം; എന്നാൽ സകല ജനതകളുടെയും ഇടയിലെ ചിതറിപ്പോകലാണ് സന്ദർഭം എന്നതിനാൽ ഇവിടെ ‘ഭൂമി’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘മരവും കല്ലും’ എന്നത് ഈ വസ്തുക്കളാൽ നിർമിച്ച വിഗ്രഹങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: וֶהֱפִיצְךָ
  choice: നിന്നെ ചിതറിക്കും
  rationale: פוץ എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഒരാളെ ചിതറിപ്പിക്കുക എന്ന കാരണാർത്ഥം നൽകുന്നു; ഉടമ്പടിശാപത്തിന്റെ സന്ദർഭത്തിൽ ഈ പ്രയോഗം സ്വാഭാവികമാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവികൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണമായി നിലനിർത്തുന്നു.
- source_word: בְּכָל הָעַמִּים
  choice: സകല ജനതകളുടെയും ഇടയിൽ
  rationale: עַמִּים എന്ന ബഹുവചനം രാഷ്ട്രീയ രാഷ്ട്രങ്ങളെക്കാൾ ജനസമൂഹങ്ങളെ സൂചിപ്പിക്കുന്നു; 'ജനതകൾ' ആ അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מִקְצֵה הָאָרֶץ וְעַד קְצֵה הָאָרֶץ
  choice: ഭൂമിയുടെ ഒരറ്റംമുതൽ മറ്റേ അറ്റംവരെ
  rationale: ആവർത്തനത്തിന്റെ വ്യാപ്തി നിലനിർത്തിക്കൊണ്ട് സമഗ്രമായ ഭൂമിശാസ്ത്രപരിധി സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְעָבַדְתָּ
  choice: നീ സേവിക്കും
  rationale: עבד എന്ന ക്രിയ ദേവന്മാരോടു ചേർന്നുവരുമ്പോൾ ആരാധനാപരമായ വിധേയത്വം ഉൾക്കൊള്ളുന്നു; 'സേവിക്കും' എന്നത് മൂലക്രിയയുടെ വിശാലത നിലനിർത്തുന്നു.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: അന്യദേവന്മാരെ
  rationale: യഹോവയല്ലാത്ത ദേവന്മാരെ സൂചിപ്പിക്കുന്ന ഉടമ്പടിപരമായ പ്രയോഗത്തിന് സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: אֲשֶׁר לֹא יָדַעְתָּ אַתָּה וַאֲבֹתֶיךָ
  choice: നീയോ നിന്റെ പിതാക്കന്മാരോ അറിഞ്ഞിട്ടില്ലാത്ത
  rationale: ידע എന്ന ക്രിയയെ അമിതമായി വ്യാഖ്യാനിക്കാതെ 'അറിഞ്ഞിട്ടില്ലാത്ത' എന്നു നേരിട്ട് നൽകുകയും, אַתָּה എന്ന ഊന്നൽ 'നീയോ' എന്നതിലൂടെ സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: עֵץ וָאָבֶן
  choice: മരത്തെയും കല്ലിനെയും
  rationale: മറ്റു ദേവന്മാരെ അവയുടെ വിഗ്രഹവസ്തുക്കൾകൊണ്ട് വിശേഷിപ്പിക്കുന്ന സമസ്ഥാനപ്രയോഗം; ഡാഷുകൾ ബന്ധം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമത്തെ ഒരു പദവിയായി മാറ്റാതെ മലയാളത്തിൽ പരക്കെ പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: הָאָרֶץ എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: ഭൂമി
  alternative: ദേശം
  rationale: '''സകല ജനതകളുടെയും ഇടയിൽ'' എന്ന അടുത്ത സന്ദർഭം വിശാലമായ ഭൂമിശാസ്ത്രവ്യാപ്തിയെ അനുകൂലിക്കുന്നു; എങ്കിലും എബ്രായപദത്തിന് ''ദേശം'' എന്നും അർത്ഥമാകാമെന്ന സത്യസന്ധമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.'
- issue: അന്യദേവന്മാരെ 'സേവിക്കുക' എന്നതിന്റെ സ്വഭാവം
  choice: സേവിക്കും
  alternative: ആരാധിക്കും
  rationale: മൂലക്രിയയുടെ നേരിട്ടുള്ള അർത്ഥം നിലനിർത്തുന്നു; ദേവന്മാർ എന്ന കർമം ആരാധനാപരമായ അർത്ഥം സന്ദർഭത്തിൽ വ്യക്തമാക്കുന്നു, അതിനെ പരിഭാഷയിൽ കൂടുതൽ ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. എബ്രായവാക്യത്തിന്റെ ഭാവികാലശാപരൂപവും സമാന്തരഘടനയും സംരക്ഷിച്ചു. ദൈവനാമത്തിന് മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ ഉപയോഗിച്ചു; കർത്തൃവാചകവും കർമവും വ്യക്തമായി നിലനിർത്താൻ രണ്ടാം വാക്യത്തിൽ ‘നീ’ ആവർത്തിച്ചു.
