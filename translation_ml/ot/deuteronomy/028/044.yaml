id: DEU.28.44
reference: Deuteronomy 28:44
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: ה֣וּא יַלְוְ/ךָ֔ וְ/אַתָּ֖ה לֹ֣א תַלְוֶ֑/נּוּ ה֚וּא יִהְיֶ֣ה לְ/רֹ֔אשׁ וְ/אַתָּ֖ה תִּֽהְיֶ֥ה לְ/זָנָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/044.yaml
  text: He will lend to you[a], but you will not lend to him; he will be the head[b], and you will be the tail.
translation:
  language: ml
  text: അവൻ നിനക്കു കടം കൊടുക്കും[a]; എന്നാൽ നീ അവനു കടം കൊടുക്കുകയില്ല. അവൻ തലയായിരിക്കും; നീ വാലായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അതായത്, മുൻവാക്യത്തിൽ പറഞ്ഞിരിക്കുന്ന പരദേശി.
    reason: cross_reference
lexical_decisions:
- source_word: יַלְוְךָ / תַלְוֶנּוּ (לוה, Hiphil)
  choice: നിനക്കു കടം കൊടുക്കും / അവനു കടം കൊടുക്കുകയില്ല
  rationale: ഈ സന്ദർഭത്തിൽ ഹിഫ്ഇൽ രൂപം ‘കടം കൊടുക്കുക’ എന്ന അർഥമാണ് നൽകുന്നത്. ഇതിലൂടെ കടം നൽകുന്നവനും ആശ്രിതനായ കടക്കാരനും തമ്മിലുള്ള സാമ്പത്തിക അസമത്വം വ്യക്തമായി നിലനിൽക്കുന്നു.
- source_word: הוּא
  choice: അവൻ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞിരിക്കുന്ന ഏകവചന പുൽലിംഗമായ പരദേശിയെ സൂചിപ്പിക്കുന്ന സർവനാമമാണിത്; അതിനാൽ ഉറവിടത്തിലെ ഏകവചനം നിലനിർത്തി.
- source_word: לְרֹאשׁ
  choice: തല
  rationale: പ്രാമുഖ്യത്തെയും മേൽസ്ഥാനത്തെയും സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: לְזָנָב
  choice: വാൽ
  rationale: ‘തല’ എന്നതിനോടുള്ള ദൃശ്യമായ വിരുദ്ധരൂപകം സംരക്ഷിച്ച് കീഴ്സ്ഥാനം വ്യക്തമാക്കുന്നു.
- source_word: יִהְיֶה / תִּהְיֶה
  choice: ആയിരിക്കും
  rationale: ഉടമ്പടിശാപത്തിന്റെ ഫലമായ ഭാവിസ്ഥിതിയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וְאַתָּה
  choice: എന്നാൽ നീ / നീ
  rationale: ആദ്യഘട്ടത്തിലെ ശക്തമായ വൈരുധ്യം ‘എന്നാൽ’ കൊണ്ടും രണ്ടാമത്തെ സമാന്തര വൈരുധ്യം വാക്യക്രമം കൊണ്ടും പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ഏകവചന പുൽലിംഗ പരാമർശം
  choice: ‘അവൻ’, ‘നീ’ എന്നീ ഏകവചന രൂപങ്ങൾ ഉപയോഗിക്കുക
  alternative: ‘അവർ’ എന്ന ബഹുവചനരൂപം ഉപയോഗിക്കുക, അല്ലെങ്കിൽ പ്രധാനവാചകത്തിൽ ‘പരദേശി’ എന്നു ആവർത്തിക്കുക
  rationale: എബ്രായപാഠം വ്യാകരണപരമായി പുൽലിംഗ ഏകവചനമാണ്; മുൻവാക്യത്തിലെ പരദേശിയെ പ്രതിനിധിപരമായി സൂചിപ്പിക്കുന്നു. അതിനാൽ ബഹുവചനമാക്കി നിഷ്പക്ഷമാക്കാതെ ഉറവിടരൂപം നിലനിർത്തുന്നു.
- issue: തല–വാൽ രൂപകത്തിന്റെ വ്യാഖ്യാനം
  choice: രൂപകം അതേപടി നിലനിർത്തുക
  alternative: ‘മേൽസ്ഥാനത്തായിരിക്കും / കീഴ്സ്ഥാനത്തായിരിക്കും’ എന്നു അർഥം തുറന്നുപറയുക
  rationale: മൂലപാഠത്തിലെ സജീവമായ രൂപകവും ഈ അധ്യായത്തിലെ അനുഗ്രഹ–ശാപ വിപരീതതയും സംരക്ഷിക്കാൻ നേരിട്ടുള്ള രൂപങ്ങൾ ഉപയോഗിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കടം കൊടുക്കുക’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ സാമ്പത്തിക പ്രയോഗമാണ്. മൂലപാഠത്തിലെ സമാന്തരഘടനയും തല–വാൽ രൂപകവും സംരക്ഷിച്ചു. ഇംഗ്ലീഷ് ഉപദേശപാഠത്തിലെ [b] അടിക്കുറിപ്പ് തെറ്റായ സ്ഥാനത്തും ഉള്ളടക്കത്തിലും നൽകിയതായി തോന്നുന്നതിനാൽ അത് പകർത്തിയില്ല; എബ്രായത്തിലെ വായ്പാസംബന്ധിയായ പദത്തിന്റെ അർഥം പ്രധാനവാചകത്തിൽ തന്നെ വ്യക്തമാണ്.
