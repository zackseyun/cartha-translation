source:
  edition: WLC
  text: יְשַׁלַּ֣ח יְהוָ֣ה בְּ֠/ךָ אֶת הַ/מְּאֵרָ֤ה אֶת הַ/מְּהוּמָה֙ וְ/אֶת הַ/מִּגְעֶ֔רֶת בְּ/כָל מִשְׁלַ֥ח יָדְ/ךָ֖ אֲשֶׁ֣ר תַּעֲשֶׂ֑ה עַ֣ד הִשָּֽׁמֶדְ/ךָ֤ וְ/עַד אֲבָדְ/ךָ֙ מַהֵ֔ר מִ/פְּנֵ֛י רֹ֥עַ מַֽעֲלָלֶ֖י/ךָ אֲשֶׁ֥ר עֲזַבְתָּֽ/נִי׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/020.yaml
  text: Yahweh will send on you the curse[a], the confusion, and the rebuke in every undertaking of your hand that you do, until you are destroyed and until you perish quickly, because of the evil of your deeds by which you have forsaken me.
translation:
  language: ml
  text: നീ കൈവെച്ച് ചെയ്യുന്ന എല്ലാ കാര്യങ്ങളിലും[a] യഹോവ നിന്റെമേൽ ശാപവും കലക്കവും ശാസനയും അയയ്ക്കും; നീ നശിച്ചുപോകുകയും വേഗത്തിൽ ഇല്ലാതാകുകയും ചെയ്യുന്നതുവരെ. നീ എന്നെ ഉപേക്ഷിച്ച നിന്റെ പ്രവൃത്തികളുടെ ദോഷം നിമിത്തമാണ് ഇത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ: “നിന്റെ കൈയുടെ എല്ലാ നീട്ടിവിടലിലും”; അഥവാ, നീ ചെയ്യാൻ കൈവെക്കുന്ന എല്ലാ കാര്യങ്ങളിലും.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשַׁלַּח
  choice: അയയ്ക്കും
  rationale: പിയേൽ രൂപം യഹോവ ഉടമ്പടിശിക്ഷകൾ സജീവമായി വരുത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘അയയ്ക്കും’ സ്വാഭാവികവും ശക്തവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ ദീർഘകാലമായി പരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: בְּךָ
  choice: നിന്റെമേൽ
  rationale: ‘അയയ്ക്കും’ എന്ന ക്രിയയോടൊപ്പം ശാപങ്ങളുടെ ലക്ഷ്യത്തെ വ്യക്തമാക്കുന്നു.
- source_word: הַמְּאֵרָה
  choice: ശാപം
  rationale: ഉടമ്പടിലംഘനത്തിന് വരുന്ന നിർദിഷ്ട ശിക്ഷയെ സൂചിപ്പിക്കുന്ന ഏകവചന നാമം.
- source_word: הַמְּהוּמָה
  choice: പരിഭ്രാന്തി
  rationale: ഈ പദത്തിന് കലക്കം, ഭീതി, പരിഭ്രാന്തി എന്നീ അർഥവ്യാപ്തിയുണ്ട്; പ്രവർത്തനങ്ങളെ തകിടംമറിക്കുന്ന വിധത്തിലുള്ള മാനസികവും സാമൂഹികവുമായ കലക്കം ‘പരിഭ്രാന്തി’ വ്യക്തമാക്കുന്നു.
- source_word: הַמִּגְעֶרֶת
  choice: ശാസന
  rationale: גער എന്ന ധാതുവിൽനിന്നുള്ള ഈ പദം ശക്തമായ ദൈവിക ശാസനയെയോ ഭർത്സനയെയോ സൂചിപ്പിക്കുന്നു; ‘ശാസന’ അതിന്റെ ന്യായവിധിപരമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: בְּכָל מִשְׁלַח יָדְךָ אֲשֶׁר תַּעֲשֶׂה
  choice: നീ കൈവെച്ചു ചെയ്യുന്ന സകല കാര്യങ്ങളിലും
  rationale: ‘കൈ നീട്ടിവിടുക’ എന്ന എബ്രായ ദൃശ്യരൂപം മലയാളത്തിലെ സ്വാഭാവികമായ ‘കൈവെച്ചു ചെയ്യുക’ എന്ന പ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: עַד הִשָּׁמֶדְךָ וְעַד אֲבָדְךָ מַהֵר
  choice: നീ നശിച്ചുപോകുകയും വേഗത്തിൽ ഇല്ലാതാകുകയും ചെയ്യുന്നതുവരെ
  rationale: സമാന്തരമായ രണ്ടു ക്രിയകളുടെ തീവ്രത നിലനിർത്തുകയും מַהֵר എന്ന ക്രിയാവിശേഷണം രണ്ടാമത്തെ ഘടകത്തോട് സ്വാഭാവികമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: מִפְּנֵי רֹעַ מַעֲלָלֶיךָ אֲשֶׁר עֲזַבְתָּנִי
  choice: നീ എന്നെ ഉപേക്ഷിച്ചതിലൂടെ ചെയ്ത ദുഷ്പ്രവൃത്തികൾനിമിത്തം
  rationale: വിധിയുടെ കാരണം ദുഷ്പ്രവൃത്തികളാണെന്നും അവയുടെ സ്വഭാവം യഹോവയെ ഉപേക്ഷിച്ചതാണെന്നും വാക്യം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു ബിരുദംകൊണ്ട് മാറ്റുന്നില്ല. ആധുനിക മലയാളവായനക്കാർക്ക് വ്യാപകമായി പരിചിതമായ ലിപ്യന്തരണം സ്വീകരിക്കുന്നു; സ്വരവത്കരണത്തിൽ വ്യത്യസ്ത പാരമ്പര്യങ്ങളുണ്ടെന്നത് അംഗീകരിക്കുന്നു.
- issue: ഉടമ്പടിശിക്ഷയിലെ ദൈവിക പ്രവർത്തകത്വം
  choice: യഹോവ ... അയയ്ക്കും
  alternative: ശാപം സ്വയം വന്നുചേരും
  rationale: എബ്രായവാക്യത്തിൽ യഹോവ തന്നെയാണ് ക്രിയയുടെ വ്യക്തമായ കർത്താവ്; അതിനാൽ ദൈവിക പ്രവർത്തകത്വം മയപ്പെടുത്താതെ നിലനിർത്തുന്നു.
- issue: അവസാന കാരണവാക്യത്തിന്റെ ബന്ധം
  choice: യഹോവയെ ഉപേക്ഷിച്ചതിലൂടെ പ്രകടമായ ദുഷ്പ്രവൃത്തികൾ
  alternative: ദുഷ്പ്രവൃത്തികളും യഹോവയെ ഉപേക്ഷിച്ചതും വേറിട്ട രണ്ടു കാരണങ്ങൾ
  rationale: אֲשֶׁר എന്ന ബന്ധപദം മുൻപുള്ള ‘പ്രവൃത്തികൾ’ എന്ന ആശയത്തെ വിശദീകരിക്കുന്നതായി സ്വാഭാവികമായി വായിക്കാം; ഉപേക്ഷിക്കൽ ആ പ്രവൃത്തികളുടെ മുഖ്യസ്വഭാവമായി പരിഭാഷയിൽ അവതരിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ ശൈലി. എബ്രായത്തിലെ രണ്ടാംപുരുഷ ഏകവചനരൂപങ്ങൾ ‘നീ/നിന്റെ’ ആയി നിലനിർത്തി. കാവ്യാത്മക സമാന്തരത പൂർണമായും ചുരുക്കാതെ, മലയാളത്തിൽ അനാവശ്യമായ കഠിനത ഒഴിവാക്കി.
