source:
  edition: WLC
  text: וְ֠/אָכַל פְּרִ֨י בְהֶמְתְּ/ךָ֥ וּ/פְרִֽי אַדְמָתְ/ךָ֮ עַ֣ד הִשָּֽׁמְדָ/ךְ֒ אֲשֶׁ֨ר לֹֽא יַשְׁאִ֜יר לְ/ךָ֗ דָּגָן֙ תִּיר֣וֹשׁ וְ/יִצְהָ֔ר שְׁגַ֥ר אֲלָפֶ֖י/ךָ וְ/עַשְׁתְּרֹ֣ת צֹאנֶ֑/ךָ עַ֥ד הַאֲבִיד֖/וֹ אֹתָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/051.yaml
  text: It will consume the offspring of your livestock and the produce of your land until you are destroyed; it will leave you no grain[a], new wine, or oil, no calves of your herd or lambs of your flock, until it has destroyed you.
translation:
  language: ml
  text: അത് നിന്റെ കന്നുകാലികളുടെ സന്തതിയെയും നിന്റെ നിലത്തിലെ വിളവിനെയും നീ നശിച്ചുപോകുന്നതുവരെ തിന്നുകളയും. നിന്നെ നശിപ്പിക്കുന്നതുവരെ ധാന്യമോ പുതുവീഞ്ഞോ എണ്ണയോ, നിന്റെ മാട്ടിൻകൂട്ടത്തിലെ കിടാക്കളോ ആട്ടിൻപറ്റത്തിലെ കുഞ്ഞുങ്ങളോ[a] ഒന്നും നിനക്കായി ശേഷിപ്പിക്കുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്റെ ആട്ടിൻപറ്റത്തിന്റെ വർധന.” עַשְׁתְּרֹת צֹאנֶךָ എന്ന എബ്രായ പ്രയോഗം ആട്ടിൻപറ്റത്തിന്റെ പ്രജനനഫലത്തെയോ വർധനയെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָכַל
  choice: തിന്നുകളയും
  rationale: അക്ഷരാർഥമായ ‘തിന്നുക’ എന്ന ആശയവും ശത്രുരാഷ്ട്രം വിഭവങ്ങൾ പൂർണമായി ഇല്ലാതാക്കുന്ന ശാപസന്ദർഭത്തിലെ ശക്തിയും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: פְּרִי בְהֶמְתְּךָ
  choice: നിന്റെ കന്നുകാലികളുടെ സന്തതി
  rationale: മൃഗങ്ങളോടൊപ്പം ഉപയോഗിച്ചിരിക്കുന്ന פְּרִי അവയുടെ കുഞ്ഞുങ്ങളെയോ വംശവർധനയെയോ സൂചിപ്പിക്കുന്നു; בְהֵמָה വളർത്തുമൃഗങ്ങളെ പൊതുവായി ഉൾക്കൊള്ളുന്നു.
- source_word: וּפְרִי אַדְמָתְךָ
  choice: നിന്റെ നിലത്തിലെ വിളവ്
  rationale: കൃഷിഭൂമിയിൽനിന്നുള്ള ഉൽപ്പന്നം എന്ന ആശയം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: עַד הִשָּׁמְדָךְ
  choice: നീ നശിച്ചുപോകുന്നതുവരെ
  rationale: ക്രിയയുടെ അവസാനപരിധി സൂചിപ്പിക്കുന്ന എബ്രായ നിർമാണം വ്യക്തമായ മലയാള ഉപവാക്യമായി പരിഭാഷപ്പെടുത്തി.
- source_word: אֲשֶׁר לֹא יַשְׁאִיר לְךָ
  choice: ഒന്നും നിനക്കായി ശേഷിപ്പിക്കുകയില്ല
  rationale: സമ്പൂർണമായ വിഭവനഷ്ടം ഊന്നിപ്പറയുന്ന ബന്ധവാക്യത്തിന്റെ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി പുനഃക്രമീകരിക്കുന്നു.
- source_word: דָּגָן
  choice: ധാന്യം
  rationale: ഒരു പ്രത്യേക ധാന്യവർഗത്തിലേക്ക് അർഥം ചുരുക്കാതെ പൊതുവായ ധാന്യവിളയെ സൂചിപ്പിക്കുന്നു.
- source_word: תִּירוֹשׁ
  choice: പുതുവീഞ്ഞ്
  rationale: പുതുതായി ഉൽപ്പാദിപ്പിച്ച വീഞ്ഞ് അഥവാ മുന്തിരിനീര് എന്ന പദത്തിന്റെ പ്രത്യേക ഭാവം നിലനിർത്തുന്നു.
- source_word: יִצְהָר
  choice: എണ്ണ
  rationale: ധാന്യം, പുതുവീഞ്ഞ്, എണ്ണ എന്ന പരമ്പരയിൽ ഒലിവെണ്ണയാണ് സാംസ്കാരികമായി ഉദ്ദേശ്യമെങ്കിലും മൂലപാഠത്തിന്റെ സംക്ഷിപ്തത നിലനിർത്തുന്നു.
- source_word: שְׁגַר אֲלָפֶיךָ
  choice: നിന്റെ മാട്ടിൻകൂട്ടത്തിലെ കിടാക്കൾ
  rationale: കന്നുകാലിക്കൂട്ടത്തിന്റെ സന്തതി എന്ന ആശയം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וְעַשְׁתְּרֹת צֹאנֶךָ
  choice: ആട്ടിൻപറ്റത്തിലെ കുഞ്ഞുങ്ങൾ[a]
  rationale: പറ്റത്തിന്റെ പ്രജനനഫലമോ വർധനയോ സൂചിപ്പിക്കുന്ന അപൂർവ പ്രയോഗം സന്ദർഭാനുസൃതമായി കുഞ്ഞുങ്ങൾ എന്നു നൽകി, വിശാലമായ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: עַד הַאֲבִידוֹ אֹתָךְ
  choice: നിന്നെ നശിപ്പിക്കുന്നതുവരെ
  rationale: אבד എന്ന ക്രിയയുടെ കാരണക ഹിഫീൽ രൂപത്തിന്റെ ‘നശിപ്പിക്കുക’ എന്ന ശക്തിയും പ്രവർത്തനത്തിന്റെ അവസാനപരിധിയും നിലനിർത്തുന്നു.
