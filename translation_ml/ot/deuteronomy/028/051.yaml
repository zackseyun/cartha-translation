translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം ഉപയോഗിച്ചു. ശാപവാക്യത്തിന്റെ കാഠിന്യം മയപ്പെടുത്താതെ സൂക്ഷിക്കുകയും, മൃഗസന്തതിയെ സൂചിപ്പിക്കുന്ന അപൂർവ എബ്രായ പ്രയോഗത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്തു.
