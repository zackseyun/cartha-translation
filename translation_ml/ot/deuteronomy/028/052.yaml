  to: നിന്റെ എല്ലാ കവാടങ്ങളിലും അവൻ നിന്നെ ഉപരോധിക്കും; നിന്റെ ദേശത്തെങ്ങും നീ ആശ്രയിക്കുന്ന ഉയരവും ഉറപ്പുമുള്ള നിന്റെ മതിലുകൾ ഇടിഞ്ഞുവീഴുന്നതുവരെ അവൻ അങ്ങനെ ചെയ്യും. നിന്റെ ദൈവമായ യഹ്‌വെ നിനക്കു നൽകിയ നിന്റെ ദേശത്തെങ്ങുമുള്ള നിന്റെ എല്ലാ കവാടങ്ങളിലും അവൻ നിന്നെ ഉപരോധിക്കും.
