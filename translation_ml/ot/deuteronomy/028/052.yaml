source:
  edition: WLC
  text: וְ/הֵצַ֨ר לְ/ךָ֜ בְּ/כָל שְׁעָרֶ֗י/ךָ עַ֣ד רֶ֤דֶת חֹמֹתֶ֨י/ךָ֙ הַ/גְּבֹה֣וֹת וְ/הַ/בְּצֻר֔וֹת אֲשֶׁ֥ר אַתָּ֛ה בֹּטֵ֥חַ בָּ/הֵ֖ן בְּ/כָל אַרְצֶ֑/ךָ וְ/הֵצַ֤ר לְ/ךָ֙ בְּ/כָל שְׁעָרֶ֔י/ךָ בְּ/כָ֨ל אַרְצְ/ךָ֔ אֲשֶׁ֥ר נָתַ֛ן יְהוָ֥ה אֱלֹהֶ֖י/ךָ לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/052.yaml
  text: And he will besiege you in all your gates until your high and fortified walls, in which you trust, come down throughout all your land; and he will besiege you in all your gates throughout all your land that Yahweh your God has given you.
translation:
  language: ml
  text: നിന്റെ എല്ലാ കവാടങ്ങളിലും അവൻ നിന്നെ ഉപരോധിക്കും; നിന്റെ ദേശത്തെങ്ങും നീ ആശ്രയിക്കുന്ന ഉയരവും ഉറപ്പുമുള്ള നിന്റെ മതിലുകൾ ഇടിഞ്ഞുവീഴുന്നതുവരെ അവൻ അങ്ങനെ ചെയ്യും. നിന്റെ ദൈവമായ യഹ്‌വെ നിനക്കു നൽകിയ നിന്റെ ദേശത്തെങ്ങുമുള്ള നിന്റെ എല്ലാ കവാടങ്ങളിലും അവൻ നിന്നെ ഉപരോധിക്കും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵצַר
  choice: അവൻ ... ഉപരോധിക്കും
  rationale: צור എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ കവാടങ്ങളും മതിലുകളും ഉൾപ്പെടുന്ന സൈനികസന്ദർഭത്തിലാണ്; അതിനാൽ പൊതുവായ ‘ഞെരുക്കും’ എന്നതിനു പകരം ‘ഉപരോധിക്കും’ എന്നു നൽകി. ആവർത്തനം ആശയപരമായി നിലനിർത്തി.
- source_word: שְׁעָרֶיךָ
  choice: നിന്റെ എല്ലാ കവാടങ്ങളിലും
  rationale: അക്ഷരാർഥമായ ‘കവാടങ്ങൾ’ നിലനിർത്തുന്നത് ഉപരോധത്തിന്റെ ദൃശ്യഭാവം സംരക്ഷിക്കുന്നു. നഗരങ്ങളെയോ പട്ടണങ്ങളെയോ സൂചിപ്പിക്കുന്ന ലക്ഷണപ്രയോഗമായിരിക്കാമെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- source_word: עַד רֶדֶת
  choice: നിലംപതിക്കുന്നതുവരെ
  rationale: ירד എന്ന ക്രിയയുടെ അടിസ്ഥാനചിത്രം ‘താഴേക്ക് ഇറങ്ങുക’ എന്നതാണ്. മതിലുകളുടെ കാര്യത്തിൽ സ്വാഭാവികമായ മലയാളത്തിൽ തകർച്ചയും താഴേക്കുള്ള വീഴ്ചയും ഒരുമിച്ചു സൂചിപ്പിക്കാൻ ‘നിലംപതിക്കുക’ ഉപയോഗിച്ചു.
- source_word: חֹמֹתֶיךָ הַגְּבֹהוֹת וְהַבְּצֻרוֹת
  choice: ഉയരമുള്ളതും കോട്ടകെട്ടി ബലപ്പെടുത്തിയതുമായ നിന്റെ മതിലുകൾ
  rationale: ‘ഉയർന്ന’ എന്നും ‘കോട്ടകെട്ടി ഉറപ്പിച്ച/സംരക്ഷിച്ച’ എന്നും ഉള്ള രണ്ട് വിശേഷണങ്ങളും വ്യക്തമായി നിലനിർത്തി.
- source_word: אֲשֶׁר אַתָּה בֹּטֵחַ בָּהֵן
  choice: നീ ആശ്രയിക്കുന്ന
  rationale: בטח + ב പ്രതിരോധസംവിധാനങ്ങളിൽ വെച്ചിരിക്കുന്ന വിശ്വാസമോ ആശ്രയമോ സൂചിപ്പിക്കുന്നു; ‘ആശ്രയിക്കുന്ന’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികവും അർഥസൂക്ഷ്മത നിലനിർത്തുന്നതുമാണ്.
- source_word: בְּכָל אַרְצֶךָ
  choice: നിന്റെ ദേശത്തെങ്ങും
  rationale: בְּכָל എന്നതിന്റെ വിതരണാത്മകമായ സമഗ്രവ്യാപ്തി സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായ ചതുരക്ഷര ദൈവനാമം ഒരു പദവികൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം നിലനിർത്താനും അതിനെ ഒരു പദവിയായി മാറ്റാതിരിക്കാനും ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
- issue: കവാടങ്ങൾ എന്നതിന്റെ ലക്ഷണപ്രയോഗം
  choice: മുഖ്യപാഠത്തിൽ ‘കവാടങ്ങൾ’ നിലനിർത്തി
  alternative: പട്ടണങ്ങൾ; നഗരങ്ങൾ
  rationale: കവാടങ്ങൾ നഗരങ്ങളെ പ്രതിനിധീകരിക്കാമെങ്കിലും, മൂലപാഠത്തിലെ ഉപരോധചിത്രം നഷ്ടപ്പെടാതിരിക്കാൻ അക്ഷരാർഥം മുഖ്യപാഠത്തിൽ സൂക്ഷിച്ച് സാധ്യതയുള്ള വിപുലാർഥം അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. സൈനിക ഉപരോധത്തിന്റെ ദൃശ്യഭാവവും എബ്രായത്തിലെ ആവർത്തനവും നിലനിർത്തി; ആവർത്തനത്തിന്റെ ആദ്യഭാഗം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘ഉപരോധം തുടരും’ എന്നു രൂപപ്പെടുത്തി.
