  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בָ֨אוּ עָלֶ֜י/ךָ כָּל הַ/קְּלָל֣וֹת הָ/אֵ֗לֶּה וּ/רְדָפ֨וּ/ךָ֙ וְ/הִשִּׂיג֔וּ/ךָ עַ֖ד הִשָּֽׁמְדָ֑/ךְ כִּי לֹ֣א שָׁמַ֗עְתָּ בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לִ/שְׁמֹ֛ר מִצְוֺתָ֥י/ו וְ/חֻקֹּתָ֖י/ו אֲשֶׁ֥ר צִוָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/045.yaml
  text: And all these curses will come upon you and pursue you and overtake you[a], until you are destroyed, because you did not listen to the voice of Yahweh your God, to keep his commandments and his statutes that he commanded you.
translation:
  language: ml
  text: ഈ ശാപങ്ങളെല്ലാം നിന്റെമേൽ വരും; അവ നിന്നെ പിന്തുടരുകയും എത്തിപ്പിടിക്കുകയും ചെയ്യും, നീ നശിച്ചുപോകുന്നതുവരെ. നിന്റെ ദൈവമായ യഹ്‌വേയുടെ വാക്കു കേട്ടനുസരിക്കാതിരുന്നതിനാലും, അവൻ നിന്നോടു കല്പിച്ച അവന്റെ കല്പനകളും ചട്ടങ്ങളും പാലിക്കാതിരുന്നതിനാലും അങ്ങനെയാകും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבָאוּ עָלֶיךָ כָּל הַקְּלָלוֹת הָאֵלֶּה
  choice: ഈ ശാപങ്ങളെല്ലാം നിന്റെമേൽ വരും
  rationale: ഉടമ്പടി മുന്നറിയിപ്പിന്റെ പശ്ചാത്തലത്തിൽ ക്രിയ ഭാവിയിലെ അനന്തരഫലത്തെ സൂചിപ്പിക്കുന്നു; עַל എന്നതിന്റെ ദിശാത്മക ശക്തി ‘നിന്റെമേൽ’ നിലനിർത്തുന്നു.
- source_word: וּרְדָפוּךָ וְהִשִּׂיגוּךָ
  choice: അവ നിന്നെ പിന്തുടർന്ന് പിടികൂടും
  rationale: ‘പിന്തുടരുക—എത്തിപ്പിടിക്കുക’ എന്ന എബ്രായ ക്രമവും വേട്ടയാടുന്ന ശാപങ്ങളുടെ ദൃശ്യവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: עַד הִשָּׁמְדָךְ
  choice: നീ നശിച്ചുപോകുന്നതുവരെ
  rationale: עַד സഹിതമുള്ള infinitive construct അന്തിമഫലം സൂചിപ്പിക്കുന്നു; കർത്താവിനെ അനാവശ്യമായി വ്യക്തമാക്കാതെ ഫലാത്മക അർഥം നിലനിർത്തുന്നു.
- source_word: כִּי לֹא שָׁמַעְתָּ בְּקוֹל
  choice: കാരണം ... ശബ്ദം നീ കേട്ടനുസരിച്ചില്ല
  rationale: שׁמע בקול അനുസരണത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും ‘ശബ്ദം കേൾക്കുക’ എന്ന ശ്രാവ്യരൂപകം നഷ്ടപ്പെടാതിരിക്കാൻ ‘കേട്ടനുസരിക്കുക’ ഉപയോഗിച്ചു.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ യഹ്‌വേ
  rationale: ദൈവനാമമായ יהוה ശീർഷകമായി മാറ്റാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു; ഉടമ്പടിസംബന്ധിയായ വ്യക്തിനാമം നിലനിർത്തുന്നു.
- source_word: לִשְׁמֹר מִצְוֺתָיו וְחֻקֹּתָיו
  choice: അവന്റെ കല്പനകളും ചട്ടങ്ങളും നീ പാലിച്ചില്ല
  rationale: לִשְׁמֹר അനുസരണത്തിന്റെ പ്രായോഗിക ഉള്ളടക്കം വ്യക്തമാക്കുന്നു. מצוה, חק എന്നീ വ്യത്യസ്ത നിയമപദങ്ങൾ ‘കല്പനകൾ’, ‘ചട്ടങ്ങൾ’ എന്നിങ്ങനെ വേർതിരിച്ചു.
- source_word: אֲשֶׁר צִוָּךְ
  choice: അവൻ നിന്നോടു കല്പിച്ച
  rationale: ബന്ധവാക്യം സ്വാഭാവിക മലയാളക്രമത്തിൽ നൽകി, നിയമങ്ങളുടെ ദൈവിക ഉറവിടം വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം പൊതുവായ ശീർഷകമാക്കി മാറ്റാതെ നേരിട്ട് പ്രതിനിധീകരിക്കുന്നു.
- issue: שׁמע בקול എന്ന പ്രയോഗം ‘അനുസരിക്കുക’ എന്നോ ‘ശബ്ദം കേൾക്കുക’ എന്നോ നൽകുന്നത്
  choice: ശബ്ദം കേട്ടനുസരിച്ചില്ല
  alternative: അനുസരിച്ചില്ല / ശബ്ദം കേട്ടില്ല
  rationale: അനുസരണത്തിന്റെ ആശയവും എബ്രായത്തിലെ ശ്രാവ്യരൂപകവും ഒരുമിച്ച് നിലനിർത്തുന്നു; ഒന്നിനെ മാത്രം തിരഞ്ഞെടുത്ത് പാഠത്തിലെ അർഥസാന്ദ്രത ചുരുക്കുന്നില്ല.
- issue: לִשְׁמֹר എന്ന infinitive-ന്റെ ബന്ധം
  choice: പ്രധാനവാക്യത്തിന്റെ അനുസരണപരമായ ഉള്ളടക്കമായി ‘പാലിച്ചില്ല’
  alternative: ‘പാലിക്കാൻ’ എന്ന ഉദ്ദേശ്യരൂപം
  rationale: ഇവിടെ കല്പനകളും ചട്ടങ്ങളും പാലിക്കൽ യഹ്‌വേയുടെ ശബ്ദം കേട്ടനുസരിക്കുന്നതിന്റെ പ്രായോഗിക ഉള്ളടക്കമാണ്. മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി സമാന്തര നിഷേധവാക്യമായി നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഏകവചന രണ്ടാംപുരുഷനായ ‘നീ/നിന്റെ’ നിലനിർത്തി. ദീർഘമായ എബ്രായവാക്യം വായനാസൗകര്യത്തിനായി മൂന്ന് വാക്യങ്ങളാക്കിയെങ്കിലും കാരണബന്ധവും ശാപങ്ങളുടെ അനിവാര്യമായ പുരോഗതിയും സംരക്ഷിച്ചു.
