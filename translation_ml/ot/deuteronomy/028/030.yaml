source:
  edition: WLC
  text: אִשָּׁ֣ה תְאָרֵ֗שׂ וְ/אִ֤ישׁ אַחֵר֙ ישגל/נה בַּ֥יִת תִּבְנֶ֖ה וְ/לֹא תֵשֵׁ֣ב בּ֑/וֹ כֶּ֥רֶם תִּטַּ֖ע וְ/לֹ֥א תְחַלְּלֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/030.yaml
  text: You will become engaged to a wife[a], but another man will lie with her; you will build a house, but you will not live in it; you will plant a vineyard[c][b], but you will not begin to use its fruit.
translation:
  language: ml
  text: നീ ഒരു സ്ത്രീയുമായി വിവാഹനിശ്ചയം നടത്തും; എന്നാൽ മറ്റൊരാൾ അവളുമായി ലൈംഗികബന്ധത്തിൽ ഏർപ്പെടും.[a] നീ ഒരു വീടു പണിയും; എന്നാൽ അതിൽ താമസിക്കുകയില്ല. നീ ഒരു മുന്തിരിത്തോട്ടം നട്ടുപിടിപ്പിക്കും; എന്നാൽ അതിന്റെ ഫലം സാധാരണ ഉപഭോഗത്തിനായി ഉപയോഗിച്ചുതുടങ്ങുകയില്ല.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെയുള്ള എബ്രായക്രിയ പരുഷമായ ഒരു ലൈംഗികപദമാണ്. ചില പരിഭാഷകൾ ‘അവളെ ബലാത്സംഗം ചെയ്യും’ എന്നിങ്ങനെ കൂടുതൽ ശക്തമായി നൽകുന്നു; എന്നാൽ ഈ ക്രിയാരൂപം മാത്രം ബലപ്രയോഗം വ്യക്തമായി സൂചിപ്പിക്കുന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘അതിനെ സാധാരണമാക്കുകയില്ല.’ മുന്തിരിത്തോട്ടത്തിന്റെ ഫലം സാധാരണ ഉപഭോഗത്തിനായി ഉപയോഗിച്ചുതുടങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְאָרֵשׂ אִשָּׁה
  choice: ഒരു സ്ത്രീയെ വിവാഹനിശ്ചയം ചെയ്യും
  rationale: ארשׂ വിവാഹത്തിലേക്കുള്ള നിയമപരമായ നിശ്ചയത്തെ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ ‘വിവാഹനിശ്ചയം ചെയ്യും’ സ്വാഭാവികവും വ്യക്തവുമാണ്; אִשָּׁהയെ ഇവിടെ ഭാവിവധു എന്ന സന്ദർഭം വ്യക്തമാകുന്ന വിധത്തിൽ ‘ഒരു സ്ത്രീ’ എന്നു നിലനിർത്തുന്നു.
- source_word: אִישׁ אַחֵר
  choice: മറ്റൊരാൾ
  rationale: അഭിസംബോധന ചെയ്യപ്പെടുന്ന പുരുഷനിൽനിന്നു വ്യത്യസ്തനായ മറ്റൊരു പുരുഷനെ സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ישגלנה
  choice: അവളുമായി ലൈംഗികബന്ധത്തിൽ ഏർപ്പെടും
  rationale: שׁגל പരുഷമായ ലൈംഗികപദമാണ്. മലയാളപരിഭാഷ ലൈംഗികക്രിയയെ വ്യക്തമായി പറയുന്നു; എന്നാൽ ഈ ക്രിയാരൂപം മാത്രം നിർബന്ധമോ ബലപ്രയോഗമോ വ്യക്തമായി അടയാളപ്പെടുത്താത്തതിനാൽ അത് കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: תֵשֵׁב בּוֹ
  choice: അതിൽ താമസിക്കുകയില്ല
  rationale: വീടിന്റെ സന്ദർഭത്തിൽ ישב എന്നത് അതിൽ വസിക്കുക അഥവാ താമസിക്കുക എന്നാണ്.
- source_word: כֶּרֶם
  choice: മുന്തിരിത്തോട്ടം
  rationale: כרם എന്ന പദത്തിന്റെ സാധാരണവും കൃത്യവുമായ മലയാളസമാനപദം.
- source_word: תְחַלְּלֶּנּוּ
  choice: അതിന്റെ ഫലം സാധാരണമായി ഉപയോഗിച്ചുതുടങ്ങുകയില്ല
  rationale: മുന്തിരിത്തോട്ടത്തെ സംബന്ധിച്ച חלל പിയേൽ രൂപം, അതിന്റെ വിളവ് പൊതുവായ ഉപഭോഗത്തിനായി ഉപയോഗിച്ചുതുടങ്ങുക എന്ന സാങ്കേതിക ആശയം വഹിക്കുന്നു; ‘അശുദ്ധമാക്കുക’ എന്ന അക്ഷരാർഥം ഇവിടെ തെറ്റിദ്ധരിപ്പിക്കും.
theological_decisions:
- issue: ישגלנה എന്ന ക്രിയ ബലപ്രയോഗം സൂചിപ്പിക്കുന്നുവോ
  choice: ലൈംഗികക്രിയ വ്യക്തമായി പരിഭാഷപ്പെടുത്തി; ബലപ്രയോഗം മുഖ്യവാചകത്തിൽ ചേർത്തില്ല
  alternative: ‘അവളെ ബലാത്സംഗം ചെയ്യും’
  rationale: പദം പരുഷമാണെങ്കിലും ഈ രൂപം തന്നെ നിർബന്ധം വ്യക്തമായി കോഡ് ചെയ്യുന്നില്ല. അതിനാൽ ദുരന്തത്തിന്റെ ഗൗരവം മറച്ചുവയ്ക്കാതെയും ഉറവിടത്തെക്കാൾ അർഥം നിർണ്ണയിക്കാതെയും പരിഭാഷപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. സമാന്തരമായ മൂന്ന് ദുരന്തവാക്യങ്ങളുടെ താളം നിലനിർത്തി. ലൈംഗികപദത്തിന്റെ പരുഷത പൂർണമായി മൃദൂകരിക്കാതിരിക്കാനും, അതേസമയം ഉറവിടത്തിൽ വ്യക്തമായി ഇല്ലാത്ത ബലപ്രയോഗം ചേർക്കാതിരിക്കാനും ‘ലൈംഗികബന്ധത്തിൽ ഏർപ്പെടും’ തെരഞ്ഞെടുത്തു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
