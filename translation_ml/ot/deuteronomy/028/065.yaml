  text: וּ/בַ/גּוֹיִ֤ם הָ/הֵם֙ לֹ֣א תַרְגִּ֔יעַ וְ/לֹא יִהְיֶ֥ה מָנ֖וֹחַ לְ/כַף רַגְלֶ֑/ךָ וְ/נָתַן֩ יְהוָ֨ה לְ/ךָ֥ שָׁם֙ לֵ֣ב רַגָּ֔ז וְ/כִלְי֥וֹן עֵינַ֖יִם וְ/דַֽאֲב֥וֹן נָֽפֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/065.yaml
  text: And among those nations you will find no rest[a], and there will be no resting place for the sole of your foot; and there Yahweh will give you a trembling heart, failing eyes[c][b], and anguish of soul.
translation:
  language: ml
  text: ആ ജനതകളുടെ ഇടയിൽ നിനക്കു സ്വസ്ഥത ലഭിക്കുകയില്ല[a]; നിന്റെ ഉള്ളങ്കാലിന് വിശ്രമസ്ഥലമൊന്നും ഉണ്ടാകുകയില്ല. അവിടെ യഹ്‌വേ നിനക്കു വിറയ്ക്കുന്ന ഹൃദയവും ക്ഷയിച്ചുപോകുന്ന കണ്ണുകളും[b] ഉള്ളത്തിന്റെ വ്യഥയും[c] നൽകും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിനക്കു ആശ്വാസമുണ്ടാകുകയില്ല.”
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “ക്ഷയിച്ചുപോകുന്ന കണ്ണുകൾ.”
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “ഉള്ളത്തിന്റെ ദുഃഖം” അല്ലെങ്കിൽ “ഉള്ളത്തിന്റെ വേദന.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תַרְגִּיעַ
  choice: നിനക്കു സ്വസ്ഥത ലഭിക്കുകയില്ല
  rationale: ഹിഫീൽ രൂപം ഇവിടെ സ്വയം അടങ്ങിനിൽക്കുക, വിശ്രമം കണ്ടെത്തുക, സ്വസ്ഥനായിരിക്കുക എന്നീ ആശയങ്ങൾ നൽകുന്നു. ‘സ്വസ്ഥത ലഭിക്കുകയില്ല’ എന്നത് പ്രവാസശാപത്തിന്റെ സാഹചര്യത്തിൽ സ്വാഭാവികവും അർത്ഥസമ്പന്നവുമാണ്.
- source_word: מָנוֹחַ
  choice: വിശ്രമിക്കാൻ ഒരിടം
  rationale: ഈ നാമം വിശ്രമത്തെയോ വിശ്രമസ്ഥാനത്തെയോ സൂചിപ്പിക്കാം. ‘ഉള്ളങ്കാലിന്’ എന്ന പ്രയോഗത്തോടൊപ്പം സ്ഥലസൂചനയുള്ള വിവർത്തനമാണ് മലയാളത്തിൽ വ്യക്തം.
- source_word: לְכַף רַגְלֶךָ
  choice: നിന്റെ ഉള്ളങ്കാലിന്
  rationale: כַּף רֶגֶל എന്നത് കാലിന്റെ അടിവശമായ ഉള്ളങ്കാലിനെ കൃത്യമായി സൂചിപ്പിക്കുന്നു.
- source_word: וְנָתַן יְהוָה לְךָ שָׁם
  choice: അവിടെ യഹോവ നിനക്കു … നൽകും
  rationale: സ്ഥലത്തെ ഊന്നിപ്പറയുന്ന ‘അവിടെ’ നിലനിർത്തുകയും ദൈവനാമമായ יהוה ‘യഹോവ’ എന്നു ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്തു.
- source_word: לֵב רַגָּז
  choice: വിറയ്ക്കുന്ന ഹൃദയം
  rationale: ഭയം, അസ്വസ്ഥത, ആന്തരിക ചഞ്ചലത എന്നിവ ഉൾക്കൊള്ളുന്ന ദൃശ്യബിംബം നിലനിർത്തുന്നു.
- source_word: כִּלְיוֹן עֵינַיִם
  choice: മങ്ങിപ്പോകുന്ന കണ്ണുകൾ
  rationale: כִּלְיוֹן ക്ഷയത്തെയോ നശിച്ചുപോകലിനെയോ സൂചിപ്പിക്കുന്നു. ‘മങ്ങിപ്പോകുന്ന കണ്ണുകൾ’ പ്രത്യാശയറ്റ കാത്തിരിപ്പിന്റെയും ക്ഷയത്തിന്റെയും ചിത്രം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; കൂടുതൽ പദാനുപദമായ രൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: דַּאֲבוֹן נָפֶשׁ
  choice: ഉള്ളത്തിന്റെ വ്യഥ
  rationale: דַּאֲבוֹן വേദന, ദുഃഖം, വ്യഥ എന്നീ അർത്ഥങ്ങളും נֶפֶשׁ വ്യക്തിയുടെ ആന്തരിക ജീവൻ/ഉള്ളം എന്ന ആശയവും വഹിക്കുന്നു. ‘ഉള്ളത്തിന്റെ വ്യഥ’ തീവ്രത നിലനിർത്തുകയും ‘ആത്മാവ്’ എന്ന പ്രത്യേക സാങ്കേതിക അർത്ഥം അനാവശ്യമായി ചുമത്താതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരി നേരിട്ട് വരുന്നതിനാൽ ഒരു സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നതിനു പകരം മലയാളത്തിൽ പ്രചാരമുള്ള ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- issue: נֶפֶשׁ എന്ന പദത്തിന്റെ അർത്ഥവ്യാപ്തി
  choice: ഉള്ളം
  alternative: ആത്മാവ് / പ്രാണൻ
  rationale: ഇവിടെ പദം മനുഷ്യന്റെ ആന്തരിക ജീവനും അനുഭവിക്കുന്ന വ്യക്തിയെയും സൂചിപ്പിക്കുന്നു. ശരീരം–ആത്മാവ് എന്ന പ്രത്യേക ദ്വൈതവായന ഉറപ്പിക്കാതെ ‘ഉള്ളം’ എന്ന വിവർത്തനം വാക്യത്തിന്റെ മാനസികവും അസ്തിത്വപരവുമായ വേദന നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ഹീബ്രുവിലെ സമാന്തര ഘടനയും ശരീര-മനസ് ബിംബങ്ങളും നിലനിർത്തി; അസ്വാഭാവികമായ പദാനുപദരൂപങ്ങൾ ആവശ്യമായിടത്ത് അടിക്കുറിപ്പിലേക്കു മാറ്റി.
