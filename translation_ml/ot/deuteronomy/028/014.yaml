  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לֹ֣א תָס֗וּר מִ/כָּל הַ/דְּבָרִים֙ אֲשֶׁ֨ר אָנֹכִ֜י מְצַוֶּ֥ה אֶתְ/כֶ֛ם הַ/יּ֖וֹם יָמִ֣ין וּ/שְׂמֹ֑אול לָ/לֶ֗כֶת אַחֲרֵ֛י אֱלֹהִ֥ים אֲחֵרִ֖ים לְ/עָבְדָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/014.yaml
  text: And do not turn aside from any of the words that I am commanding you today[a], to the right or to the left[b], to go after other gods to serve them.
translation:
  language: ml
  text: ഞാൻ ഇന്ന് നിങ്ങളോടു കൽപ്പിക്കുന്ന വചനങ്ങളിൽ ഒന്നിൽനിന്നുപോലും വലത്തോട്ടോ ഇടത്തോട്ടോ വ്യതിചലിക്കരുത്; മറ്റു ദേവന്മാരുടെ പിന്നാലെ പോയി[a] അവരെ സേവിക്കരുത്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മറ്റു ദേവന്മാരെ പിന്തുടർന്ന്.’ എബ്രായ പ്രയോഗത്തിന്റെ അക്ഷരാർഥം ‘പിന്നാലെ പോകുക’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവരെ ആരാധിക്കരുത്.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ക്രിയയ്ക്ക് ഒരു ദേവനോടു ചെയ്യുന്ന സേവനത്തെയും അതിനാൽ ആരാധനയെയും സൂചിപ്പിക്കാനാകും.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָסוּר
  choice: മാറി ... അരുത്
  rationale: സוּר എന്ന പദത്തിന്റെ ‘വഴിമാറുക, വ്യതിചലിക്കുക’ എന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; തുടർന്നുള്ള ക്രിയകളെയും നിഷേധത്തിന്റെ പരിധിയിൽ ഉൾപ്പെടുത്തുന്നു.
- source_word: מִכָּל הַדְּבָרִים
  choice: വചനങ്ങളിലൊന്നിൽനിന്നുപോലും
  rationale: നിഷേധവാക്യത്തിലെ מִכָּל എന്ന പ്രയോഗം കല്പിച്ച വചനങ്ങളിൽ യാതൊന്നിൽനിന്നും മാറരുത് എന്ന ഊന്നൽ നൽകുന്നു. דְּבָרִים എന്നതിനെ ‘കല്പനകൾ’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ ‘വചനങ്ങൾ’ എന്നു നിലനിർത്തുന്നു.
- source_word: מְצַוֶּה
  choice: കല്പിക്കുന്ന
  rationale: പങ്കാളിക്രിയയുടെ ഇപ്പോഴത്തെ, തുടർന്നുകൊണ്ടിരിക്കുന്ന പ്രബോധനഭാവം മലയാളത്തിലെ വർത്തമാനരൂപം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הַיּוֹם
  choice: ഇന്നു
  rationale: മോശെയുടെ അന്നത്തെ ഉടൻപ്രാബല്യമുള്ള അഭിസംബോധന ലളിതവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: יָמִין וּשְׂמֹאול
  choice: വലത്തോട്ടോ ഇടത്തോട്ടോ
  rationale: ഏതു ദിശയിലേക്കും വ്യതിചലിക്കരുത് എന്ന സ്ഥിരമായ എബ്രായ ദൃശ്യപ്രയോഗം അതിന്റെ സ്ഥാനരൂപകത്തോടുകൂടെ നിലനിർത്തുന്നു.
- source_word: לָלֶכֶת אַחֲרֵי
  choice: പിന്നാലെ ചെന്ന്
  rationale: ‘പിന്നാലെ പോകുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ചലനദൃശ്യം നിലനിർത്തുകയും മറ്റു ദേവന്മാരോടുള്ള അനുസരണയെയും ചേർച്ചയെയും സന്ദർഭത്തിൽ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: മറ്റു ദേവന്മാർ
  rationale: ‘അന്യദേവന്മാർ’ അല്ലെങ്കിൽ ‘വിദേശദേവന്മാർ’ എന്ന അധിക വ്യാഖ്യാനമില്ലാതെ എബ്രായത്തിന്റെ നേരായ അർഥം നൽകുന്നു.
- source_word: לְעָבְדָם
  choice: അവരെ സേവിക്കുക
  rationale: עבד എന്ന പദത്തിന്റെ അടിസ്ഥാനമായ ‘സേവിക്കുക’ എന്ന അർഥവും ദേവന്മാരെ സംബന്ധിച്ച ആരാധനാപരമായ സേവനത്തിന്റെ വിശാലഭാവവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ഉടമ്പടി മുന്നറിയിപ്പിൽ മറ്റു ദേവന്മാരെക്കുറിച്ചുള്ള പരാമർശം
  choice: മറ്റു ദേവന്മാർ
  alternative: അന്യദേവന്മാർ / വിദേശദേവന്മാർ
  rationale: വാക്യം മറ്റു ദേവന്മാരുടെ സത്തയെക്കുറിച്ചുള്ള തത്ത്വചിന്താപരമായ ചോദ്യം വിശദീകരിക്കുന്നില്ല. അതിനാൽ ആവർത്തനപുസ്തകത്തിലെ മുന്നറിയിപ്പിന്റെ ഭാഷ അതേപടി നിലനിർത്തി, വാക്യം തീർപ്പാക്കാത്ത ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഭാഷയിൽ തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വാക്യഘടനയാണ് ഉപയോഗിച്ചത്. ‘വചനങ്ങളിലൊന്നിൽനിന്നുപോലും’ എന്ന രൂപം സമ്പൂർണ അനുസരണത്തിന്റെ ഊന്നൽ വ്യക്തമാക്കുന്നു. മൂലത്തിലെ നീണ്ട ഏകവാക്യം നിലനിർത്തിയെങ്കിലും മലയാളത്തിൽ നിഷേധത്തിന്റെ വ്യാപ്തി വ്യക്തമായി വായിക്കാവുന്നവിധം ക്രിയാക്രമം ക്രമപ്പെടുത്തി.
