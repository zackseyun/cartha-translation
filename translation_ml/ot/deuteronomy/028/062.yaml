source:
  edition: WLC
  text: וְ/נִשְׁאַרְתֶּם֙ בִּ/מְתֵ֣י מְעָ֔ט תַּ֚חַת אֲשֶׁ֣ר הֱיִיתֶ֔ם כְּ/כוֹכְבֵ֥י הַ/שָּׁמַ֖יִם לָ/רֹ֑ב כִּי לֹ֣א שָׁמַ֔עְתָּ בְּ/ק֖וֹל יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/062.yaml
  text: And you will be left few in number[a], though you had become as numerous as the stars of the heavens[c][b], because you did not listen to the voice of Yahweh your God.
translation:
  language: ml
  text: നിങ്ങൾ ആകാശത്തിലെ നക്ഷത്രങ്ങളെപ്പോലെ അനേകരായിരുന്നെങ്കിലും[b], എണ്ണത്തിൽ വളരെ കുറച്ചുപേർ മാത്രമായി ശേഷിക്കും[a]; കാരണം, നിങ്ങളുടെ ദൈവമായ യഹ്‌വേയുടെ ശബ്ദം നിങ്ങൾ കേട്ടില്ല[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘എണ്ണത്തിൽ കുറച്ചുപേർ’; അക്ഷരാർഥത്തിൽ ‘കുറവിന്റെ ആളുകൾ.’ വളരെ കുറച്ചുപേർ മാത്രം ശേഷിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ഒരു പ്രയോഗമാണിത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ആകാശത്തിലെ നക്ഷത്രങ്ങളെപ്പോലെ അനേകരായിരുന്ന നിങ്ങൾ ...’ മുൻകാലത്തെ പെരുപ്പവും വരാനിരിക്കുന്ന ചുരുക്കവും തമ്മിലുള്ള വൈരുധ്യമാണ് എബ്രായപ്രയോഗം ഊന്നിപ്പറയുന്നത്.
    reason: alternative_reading
  - marker: c
    text: എബ്രായത്തിൽ ‘നിങ്ങളുടെ ദൈവമായ യഹ്‌വേയുടെ ശബ്ദം നിങ്ങൾ കേട്ടില്ല.’ ഉടമ്പടിയുടെ പശ്ചാത്തലത്തിൽ ‘കേൾക്കുക’ എന്നതിന് ‘ശ്രദ്ധിച്ചു കേട്ട് അനുസരിക്കുക’ എന്ന അർഥവും ഉൾപ്പെടാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁאַרְתֶּם
  choice: നിങ്ങൾ ... ശേഷിക്കും
  rationale: ശאר് എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം നഷ്ടത്തിനോ ന്യായവിധിക്കോ ശേഷം ശേഷിച്ചിരിക്കുകയെന്ന ഫലാവസ്ഥയെ സൂചിപ്പിക്കുന്നു. ‘ശേഷിക്കും’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികമായി ആ അർഥം നൽകുന്നു.
- source_word: בִּמְתֵי מְעָט
  choice: എണ്ണത്തിൽ വളരെ കുറച്ചുപേർ മാത്രം
  rationale: മതേ മെഅത് എന്ന എബ്രായ പ്രയോഗം പുരുഷന്മാരെ മാത്രം സൂചിപ്പിക്കുന്നതല്ല; ജനസംഖ്യ വളരെ ചുരുങ്ങുന്നതാണ് ആശയം. അതിനാൽ ലിംഗപരമായി അനാവശ്യമായി പരിമിതപ്പെടുത്താത്ത സ്വാഭാവിക മലയാളം ഉപയോഗിച്ചു.
- source_word: תַּחַת אֲשֶׁר
  choice: '... ആയിരുന്നെങ്കിലും'
  rationale: മുൻകാലത്തെ പെരുപ്പവും വരാനിരിക്കുന്ന ചുരുക്കവും തമ്മിലുള്ള വൈരുധ്യം ഇവിടെ പ്രധാനമാണ്. concessive അർഥം സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ ‘ആയിരുന്നെങ്കിലും’ ഉപയോഗിച്ചു.
- source_word: הֱיִיתֶם ... כְּכוֹכְבֵי הַשָּׁמַיִם לָרֹב
  choice: ആകാശത്തിലെ നക്ഷത്രങ്ങളെപ്പോലെ അസംഖ്യരായിരുന്ന
  rationale: നക്ഷത്രങ്ങളോടുള്ള ഉടമ്പടിസംബന്ധിയായ ഉപമ നിലനിർത്തിക്കൊണ്ട് לָרֹב സൂചിപ്പിക്കുന്ന അതിവലിയ സംഖ്യ ‘അസംഖ്യർ’ എന്ന സ്വാഭാവിക പ്രയോഗത്തിലൂടെ അറിയിച്ചു.
- source_word: כִּי לֹא שָׁמַעְתָּ בְּקוֹל
  choice: കാരണം ... ശബ്ദം നിങ്ങൾ കേട്ടില്ല
  rationale: ‘ശബ്ദം കേൾക്കുക’ എന്ന എബ്രായ ഉടമ്പടിപ്രയോഗത്തിന്റെ ദൃശ്യരൂപം നിലനിർത്തി; അതിൽ അനുസരണത്തിന്റെ അർഥവും ഉൾപ്പെടാമെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: אֱלֹהֶיךָ
  choice: നിങ്ങളുടെ ദൈവം
  rationale: എബ്രായത്തിലെ ഏകവചന സമൂഹസംബോധന മലയാളത്തിൽ ആദരസൂചകവും സമൂഹസംബോധനയ്ക്കും യോജിച്ചതുമായ ‘നിങ്ങളുടെ’ എന്ന രൂപത്തിൽ സ്വാഭാവികമായി നിലനിർത്തി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം തന്നെയായതിനാൽ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ ഉപയോഗിക്കാതെ ദൈവനാമം ലിപ്യന്തരിച്ചു.
- issue: വാക്യത്തിനുള്ളിലെ ബഹുവചനത്തിൽനിന്ന് ഏകവചനത്തിലേക്കുള്ള മാറ്റം
  choice: മലയാളത്തിലെ ‘നിങ്ങൾ’ ഉപയോഗിച്ച് സമൂഹസംബോധനം നിലനിർത്തുക
  alternative: വ്യക്തമായ ഏകവചനരൂപത്തിലേക്ക് മാറ്റുക
  rationale: എബ്രായത്തിൽ ആദ്യഭാഗം ബഹുവചനവും അവസാനത്തെ שָׁמַעְתָּ ഏകവചനവുമാണ്; ഇത് ഇസ്രായേലിനെ ഒരൊറ്റ സമൂഹമായി അഭിസംബോധന ചെയ്യുന്ന ആവർത്തനപുസ്തകത്തിലെ സാധാരണ സവിശേഷതയാണ്. മലയാളത്തിലെ ‘നിങ്ങൾ’ ഈ മാറ്റത്തെ അനാവശ്യമായി വ്യാഖ്യാനിച്ചു തീർക്കാതെ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- issue: שׁמע בְּקוֹל എന്ന ഉടമ്പടിപ്രയോഗം
  choice: ശബ്ദം കേട്ടില്ല
  alternative: അനുസരിച്ചില്ല
  rationale: ‘കേൾക്കുക’ എന്ന മൂലരൂപം നിലനിർത്തി, അതിനുള്ളിലെ അനുസരണസൂചന അടിക്കുറിപ്പിൽ അറിയിച്ചു; അങ്ങനെ പദചിത്രവും ദൈവശാസ്ത്രപരമായ വ്യാപ്തിയും രണ്ടും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായതും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അസംഖ്യർ,’ ‘ശേഷിക്കും’ എന്നിവ മൂലപാഠത്തിന്റെ സംഖ്യാത്മക വൈരുധ്യം സംക്ഷിപ്തമായി നൽകുന്നു. വായനാസൗകര്യത്തിനായി concessive ഉപവാക്യം ആദ്യം വച്ചെങ്കിലും മൂലവാക്യത്തിലെ കാരണം–ഫലം ബന്ധവും ദൈവനാമവും ഉടമ്പടിപ്രയോഗവും സംരക്ഷിച്ചിട്ടുണ്ട്.
