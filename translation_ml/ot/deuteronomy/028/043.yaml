  variant: modern standard Malayalam
source:
  edition: WLC
  text: הַ/גֵּר֙ אֲשֶׁ֣ר בְּ/קִרְבְּ/ךָ֔ יַעֲלֶ֥ה עָלֶ֖י/ךָ מַ֣עְלָ/ה מָּ֑עְלָ/ה וְ/אַתָּ֥ה תֵרֵ֖ד מַ֥טָּה מָּֽטָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/043.yaml
  text: The foreigner who is among you will rise higher and higher above you[a], and you will go down lower and lower.
translation:
  language: ml
  text: നിന്റെ ഇടയിൽ പാർക്കുന്ന പരദേശി നിനക്കുമീതെ ഉയർന്നുയർന്ന് വരും[a]; നീയോ താഴ്ന്നുതാഴ്ന്നു പോകും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിന്റെ ഇടയിൽ വസിക്കുന്ന അന്യദേശക്കാരൻ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രുവിലെ גֵּר എന്ന പദം ഇസ്രായേലിന്റെ ഇടയിൽ പാർക്കുന്ന സ്വദേശിയല്ലാത്ത ഒരാളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגֵּר
  choice: പരദേശി
  rationale: ഇസ്രായേലിന്റെ ഇടയിൽ സ്ഥിരമായി പാർക്കുന്ന സ്വദേശിയല്ലാത്ത ഒരാളെ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭത്തിന് യോജിച്ചതുമായ പദമാണ് ‘പരദേശി’; താൽക്കാലിക യാത്രക്കാരൻ എന്ന അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: אֲשֶׁר בְּקִרְבְּךָ
  choice: നിന്റെ ഇടയിൽ പാർക്കുന്ന
  rationale: ആ വ്യക്തി സമൂഹത്തിനകത്ത് താമസിക്കുന്നവനാണെന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: יַעֲלֶה עָלֶיךָ
  choice: നിനക്കുമീതെ ഉയർന്നുയർന്ന് വരും
  rationale: עלה ... על എന്ന പ്രയോഗത്തിലെ താരതമ്യപരമായ മേൽക്കൈയും ഉയർച്ചയുടെ രൂപകവും നിലനിർത്തുന്നു; അതിനെ സാമ്പത്തികമോ രാഷ്ട്രീയമോ ആയ ഒരൊറ്റ മേഖലയിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: מַעְלָה מָּעְלָה
  choice: ഉയർന്നുയർന്ന്
  rationale: ആവർത്തനം സൂചിപ്പിക്കുന്ന ക്രമാനുഗതവും തീവ്രവുമായ ഉയർച്ച മലയാളത്തിലെ പദാവർത്തനത്തിലൂടെ സംരക്ഷിക്കുന്നു.
- source_word: וְאַתָּה
  choice: നീയോ
  rationale: ഹീബ്രുവിലെ ബന്ധകത്തോടൊപ്പം സന്ദർഭത്തിൽ ശക്തമായി അനുഭവപ്പെടുന്ന വൈരുധ്യം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: תֵרֵד
  choice: താഴ്ന്നു പോകും
  rationale: עלה എന്ന ഉയർച്ചയുടെ വിപരീതമായ ירד-ന്റെ ഇറക്കമോ അധഃപതനമോ സൂചിപ്പിക്കുന്ന രൂപകം നേരായ ഭാഷയിൽ നൽകുന്നു.
- source_word: מַטָּה מָּטָּה
  choice: താഴ്ന്നുതാഴ്ന്നു
  rationale: മൂലപാഠത്തിലെ ആവർത്തനവും ക്രമാനുഗതമായ അധഃപതനവും ഉയർച്ചയോടുള്ള സമാന്തര വൈരുധ്യവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ശാപസന്ദർഭത്തിലെ സാമൂഹിക-ഉടമ്പടിപരമായ സ്ഥാനവിപരീതം
  choice: ഇസ്രായേലിന്റെ ഇടയിൽ പാർക്കുന്ന സ്വദേശിയല്ലാത്തവൻ അവർക്കുമീതെ ഉയരുകയും ഇസ്രായേൽ താഴുകയും ചെയ്യുന്ന വിശാലമായ സ്ഥാനവിപരീതമായി പരിഭാഷപ്പെടുത്തി.
  alternative: ഇത് സാമ്പത്തിക ഉയർച്ചയും താഴ്ചയും മാത്രമായോ രാഷ്ട്രീയ ആധിപത്യം മാത്രമായോ ചുരുക്കി പരിഭാഷപ്പെടുത്തുക.
  rationale: ഉയരുക, താഴുക എന്നീ ഹീബ്രു രൂപകങ്ങൾ മനപ്പൂർവം വിശാലമാണ്. അതിനാൽ മൂലപാഠം വ്യക്തമാക്കാത്ത ഒരു പ്രത്യേക മേഖലയിലേക്ക് അർഥം പരിമിതപ്പെടുത്തിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. ഉയർച്ച–താഴ്ച രൂപകവും ഹീബ്രുവിലെ ആവർത്തനത്തിന്റെ തീവ്രതയും സംരക്ഷിച്ചു; ‘നീയോ’ എന്ന പ്രയോഗത്തിലൂടെ വൈരുധ്യം സ്വാഭാവികമായി പ്രകടമാക്കി.
