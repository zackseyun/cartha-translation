source:
  edition: WLC
  text: זֵיתִ֛ים יִהְי֥וּ לְ/ךָ֖ בְּ/כָל גְּבוּלֶ֑/ךָ וְ/שֶׁ֨מֶן֙ לֹ֣א תָס֔וּךְ כִּ֥י יִשַּׁ֖ל זֵיתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/040.yaml
  text: You will have olive trees throughout all your territory[a], but you will not anoint yourself with oil, because your olives will fall off.
translation:
  language: ml
  text: നിന്റെ ദേശമെങ്ങും നിനക്കു ഒലിവുമരങ്ങൾ ഉണ്ടായിരിക്കും; എന്നാൽ നീ എണ്ണ ശരീരത്തിൽ പുരട്ടുകയില്ല, കാരണം നിന്റെ ഒലിവുകായ്കൾ[a] കൊഴിഞ്ഞുപോകും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിന്റെ ഒലിവുവിളവ് കൊഴിഞ്ഞുപോകും’ അല്ലെങ്കിൽ ‘നിന്റെ ഒലിവുമരം അതിന്റെ കായ്കൾ പൊഴിച്ചുകളയും.’ എബ്രായത്തിൽ ‘നിന്റെ ഒലിവ്’ എന്ന ഏകവചനം സമൂഹവാചകമായി ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֵיתִים
  choice: ഒലിവുമരങ്ങൾ
  rationale: സന്ദർഭത്തിൽ ദേശമെങ്ങുമുള്ള വൃക്ഷങ്ങളെയാണ് ബഹുവചനം സൂചിപ്പിക്കുന്നത്; അതിനാൽ ഫലങ്ങളെക്കാൾ ‘ഒലിവുമരങ്ങൾ’ യോജിക്കുന്നു.
- source_word: יִהְיוּ לְךָ
  choice: ഉണ്ടായിരിക്കും
  rationale: ഉടമസ്ഥതയെയോ ലഭ്യതയെയോ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ ഇങ്ങനെ നൽകിയിരിക്കുന്നു.
- source_word: בְּכָל גְּבוּלֶךָ
  choice: നിന്റെ ദേശമെങ്ങും
  rationale: גְּבוּל ഇവിടെ അതിർത്തിരേഖയെക്കാൾ അതിനുള്ളിലെ മുഴുവൻ പ്രദേശത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: וְשֶׁמֶן לֹא תָסוּךְ
  choice: എന്നാൽ അവയുടെ എണ്ണ നീ ശരീരത്തിൽ പുരട്ടുകയില്ല
  rationale: שֶׁמֶן എന്നത് ലളിതമായി ‘എണ്ണ’ എന്നാണ്; סוך ശരീരത്തിൽ എണ്ണ പുരട്ടുന്ന പതിവിനെ സൂചിപ്പിക്കുന്നു. ‘അവയുടെ’ എന്നത് സന്ദർഭത്തിലെ ഒലിവുമരങ്ങളുമായുള്ള ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: എണ്ണ പുരട്ടാൻ കഴിയാത്തതിന്റെ കാരണം അവതരിപ്പിക്കുന്നു.
- source_word: יִשַּׁל זֵיתֶךָ
  choice: നിന്റെ ഒലിവുകായ്കൾ കൊഴിഞ്ഞുപോകും
  rationale: נשל എന്ന ക്രിയ വൃക്ഷത്തിൽനിന്ന് ഫലം കൊഴിയുന്നതിനെ സൂചിപ്പിക്കുന്നു; ഏകവചനമായ זֵיתֶךָ ഇവിടെ സമൂഹവാചകമായി വിളവിനെയോ കായ്കളെയോ സൂചിപ്പിക്കാം.
