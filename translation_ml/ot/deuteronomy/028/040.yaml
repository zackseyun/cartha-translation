translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ശരീരത്തിൽ എണ്ണ പുരട്ടുന്ന പുരാതന ദൈനംദിന പതിവാണെന്ന് വ്യക്തമാക്കാൻ ‘ശരീരത്തിൽ പുരട്ടുക’ ഉപയോഗിച്ചു; മതചടങ്ങ് മാത്രം സൂചിപ്പിക്കാവുന്ന ‘അഭിഷേകം ചെയ്യുക’ ഒഴിവാക്കി. പ്രധാനവാചകത്തിൽ [a] അടയാളം ചേർത്തിരിക്കുന്നു.
