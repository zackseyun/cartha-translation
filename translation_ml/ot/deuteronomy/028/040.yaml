revisions:
- from: നിന്റെ ദേശമെങ്ങും ഒലിവുമരങ്ങൾ ഉണ്ടായിരിക്കും; എന്നാൽ അവയുടെ എണ്ണ നീ ശരീരത്തിൽ പുരട്ടുകയില്ല; കാരണം നിന്റെ ഒലിവുകായ്കൾ കൊഴിഞ്ഞുപോകും.[a]
