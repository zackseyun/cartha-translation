source:
  edition: WLC
  text: יַכְּ/כָ֣ה יְ֠הוָה בַּ/שַּׁחֶ֨פֶת וּ/בַ/קַּדַּ֜חַת וּ/בַ/דַּלֶּ֗קֶת וּ/בַֽ/חַרְחֻר֙ וּ/בַ/חֶ֔רֶב וּ/בַ/שִּׁדָּפ֖וֹן וּ/בַ/יֵּרָק֑וֹן וּ/רְדָפ֖וּ/ךָ עַ֥ד אָבְדֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/022.yaml
  text: Yahweh will strike you with wasting disease[a], with fever, with inflammation, with burning heat, with the sword, with blight, and with mildew[b]; and they will pursue you until you perish.
translation:
  language: ml
  text: യഹ്‌വേ നിന്നെ ശരീരം ക്ഷയിപ്പിക്കുന്ന രോഗം[a], പനി, പ്രദാഹം, പൊള്ളുന്ന ചൂട്, വാൾ, വിളക്കരിച്ചിൽ, പൂപ്പൽ എന്നിവകൊണ്ട് പ്രഹരിക്കും; നീ നശിച്ചുപോകുന്നതുവരെ ഇവ നിന്നെ പിന്തുടരും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ക്ഷയബാധ’; എബ്രായപദം ശരീരത്തെ ദുർബലമാക്കി ക്ഷയിപ്പിക്കുന്ന രോഗത്തെ സൂചിപ്പിക്കുന്നു, എന്നാൽ ഒരു പ്രത്യേക ആധുനിക രോഗനിർണയം നിർബന്ധമാക്കുന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ‘പിന്തുടരും’ എന്ന ക്രിയ ബഹുവചനമാണ്; മുമ്പ് പറഞ്ഞ രോഗങ്ങളെയും ദുരന്തങ്ങളെയും അത് സൂചിപ്പിക്കുന്നു.
    reason: grammatical_clarification
lexical_decisions:
- source_word: יַכְּכָה
  choice: നിന്നെ പ്രഹരിക്കും
  rationale: נכה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം നേരിട്ടുള്ള ശിക്ഷാപരമായ ‘പ്രഹരിക്കുക’ എന്ന അർഥം നൽകുന്നു; ഏകവചന അഭിസംബോധനയും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: שַׁחֶפֶת
  choice: ശരീരം ക്ഷയിപ്പിക്കുന്ന രോഗം
  rationale: ദേഹത്തെ ദുർബലമാക്കി ക്ഷയിപ്പിക്കുന്ന രോഗമാണ് ഉദ്ദേശ്യം; ‘ക്ഷയരോഗം’ എന്നു മാത്രം പറഞ്ഞാൽ ആധുനിക വൈദ്യശാസ്ത്രത്തിലെ ട്യൂബർക്കുലോസിസായി അനാവശ്യമായി പരിമിതപ്പെടാം.
- source_word: קַּדַּחַת
  choice: പനി
  rationale: പനിപിടിച്ച രോഗാവസ്ഥയെ സൂചിപ്പിക്കുന്നതിനുള്ള വ്യക്തവും സ്വാഭാവികവുമായ മലയാളപദം.
- source_word: דַּלֶּקֶת
  choice: വീക്കം
  rationale: കത്തുന്നതോ ജ്വലിക്കുന്നതോ ആയ രോഗാവസ്ഥയുമായി ബന്ധപ്പെട്ട inflammation എന്ന ആശയം സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നൽകുന്നു.
- source_word: חַרְחֻר
  choice: പൊള്ളുന്ന ചൂട്
  rationale: അപൂർവമായ ഈ പദം കടുത്ത ചൂടിനെയോ കത്തുന്ന പനിയെയോ സൂചിപ്പിക്കാം; ഉറവിടത്തിലെ പരിധി അതിയായി ചുരുക്കാതെ ചൂടിന്റെ തീവ്രത നിലനിർത്തുന്നു.
- source_word: חֶרֶב
  choice: വാൾ
  rationale: പദത്തിന്റെ സാധാരണ നേരർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ യുദ്ധമോ അക്രമമരണമോ ഉൾക്കൊള്ളാമെങ്കിലും അത് വിശദീകരിച്ച് ചേർത്തിട്ടില്ല.
- source_word: שִׁדָּפוֹן
  choice: വിളക്കരിച്ചിൽ
  rationale: ചൂടോ വരണ്ട കാറ്റോ മൂലം വിളകൾ കരിഞ്ഞു നശിക്കുന്ന ബാധയെ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള കാർഷികബാധയിൽനിന്നും വേർതിരിക്കുന്നു.
- source_word: יֵרָקוֹן
  choice: പൂപ്പൽ
  rationale: കാർഷികസന്ദർഭത്തിൽ സസ്യങ്ങളെ ബാധിക്കുന്ന മഞ്ഞളിപ്പിനെയോ പൂപ്പൽബാധയെയോ സൂചിപ്പിക്കുന്ന പരമ്പരാഗത സന്ദർഭോചിത തർജമ.
- source_word: וּרְדָפוּךָ
  choice: ഇവ നിന്നെ പിന്തുടരും
  rationale: എബ്രായക്രിയ ബഹുവചനമായതിനാൽ മുമ്പ് പറഞ്ഞ രോഗങ്ങളെയും ദുരന്തങ്ങളെയും കൂട്ടമായി സൂചിപ്പിക്കുന്ന ‘ഇവ’ എന്ന ബഹുവചനസൂചന ഉപയോഗിച്ചു.
- source_word: עַד אָבְדֶךָ
  choice: നീ നശിച്ചുപോകുന്നതുവരെ
  rationale: אבד സൂചിപ്പിക്കുന്ന നാശത്തിലേക്കോ അന്ത്യത്തിലേക്കോ എത്തുന്നതെന്ന ആശയവും നേരിട്ടുള്ള വ്യക്തിപരമായ അഭിസംബോധനയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്
  rationale: ഉറവിടപാഠം സ്ഥാനപ്പേരല്ല, ചതുരക്ഷര ദൈവനാമമാണ് ഉപയോഗിക്കുന്നത്; അതിനാൽ വ്യക്തിനാമം മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- issue: ശാപങ്ങൾ പിന്തുടരുന്നതിന്റെ വ്യാകരണബന്ധം
  choice: മുമ്പ് പട്ടികപ്പെടുത്തിയ ബാധകൾ ബഹുവചനമായി പിന്തുടരുന്നു
  alternative: ഒരൊറ്റ സമാഹാരശാപം പിന്തുടരുന്നു
  rationale: וּרְדָפוּךָ എന്ന ക്രിയ ബഹുവചനമാണ്; അതിനാൽ രോഗങ്ങളും ദുരന്തങ്ങളും തന്നെയാണ് പിന്തുടരുന്നതെന്ന വ്യാകരണസൂചന നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. രോഗ-കാർഷിക പദങ്ങളിൽ അനാവശ്യ വൈദ്യശാസ്ത്രപരമോ സസ്യരോഗശാസ്ത്രപരമോ ആയ കൃത്യത ഒഴിവാക്കി; ഏകവചനമായ ‘നീ/നിന്നെ’ എന്ന നേരിട്ടുള്ള അഭിസംബോധന നിലനിർത്തി.
