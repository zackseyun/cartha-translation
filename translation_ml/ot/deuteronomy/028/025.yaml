  edition: WLC
  text: יִתֶּנְ/ךָ֨ יְהוָ֥ה נִגָּף֮ לִ/פְנֵ֣י אֹיְבֶי/ךָ֒ בְּ/דֶ֤רֶךְ אֶחָד֙ תֵּצֵ֣א אֵלָ֔י/ו וּ/בְ/שִׁבְעָ֥ה דְרָכִ֖ים תָּנ֣וּס לְ/פָנָ֑י/ו וְ/הָיִ֣יתָ לְ/זַעֲוָ֔ה לְ/כֹ֖ל מַמְלְכ֥וֹת הָ/אָֽרֶץ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/025.yaml
  text: Yahweh will give you over as defeated before your enemies. You will go out against them by one way[a], and by seven ways you will flee before them, and you will become a horror to all the kingdoms of the earth.
translation:
  language: ml
  text: യഹ്‌വെ നിന്നെ നിന്റെ ശത്രുക്കളുടെ മുമ്പിൽ പരാജിതനായി ഏല്പിച്ചുകൊടുക്കും. ഒരൊറ്റ വഴിയിലൂടെ നീ അവർക്കെതിരെ പുറപ്പെടും; എന്നാൽ ഏഴു വഴികളിലൂടെ നീ അവരുടെ മുമ്പിൽനിന്ന് പലായനം ചെയ്യും. ഭൂമിയിലെ സകല രാജ്യങ്ങൾക്കും നീ ഭീതിയുടെ വിഷയമായിത്തീരും[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഭീതിജനകമായ ഒന്നായിത്തീരും.” എബ്രായപദത്തിന് ഭീതിയോ നടുക്കമോ ഉളവാക്കുന്ന ഒന്നിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתֶּנְךָ נִגָּף
  choice: നിന്നെ ... പരാജയത്തിന് ഏല്പിക്കും
  rationale: ‘കൊടുക്കുക’ എന്ന נתן എന്ന ക്രിയയുടെ ശക്തി നിലനിർത്തിക്കൊണ്ട്, נִגָּף സൂചിപ്പിക്കുന്ന യുദ്ധപരാജയത്തിന്റെ ഫലം സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേര് ഉപയോഗിച്ച് മാറ്റാതെ, മലയാളത്തിൽ അതിന്റെ ഉച്ചാരണരൂപമായി ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: לִפְנֵי אֹיְבֶיךָ
  choice: നിന്റെ ശത്രുക്കളുടെ മുമ്പിൽ
  rationale: എബ്രായപ്രയോഗത്തിന്റെ യുദ്ധസന്ദർഭവും ‘അവരുടെ മുമ്പിൽ പരാജയപ്പെടുക’ എന്ന ആശയവും നിലനിർത്തുന്നു.
- source_word: בְּדֶרֶךְ אֶחָד
  choice: ഒരൊറ്റ വഴിയിലൂടെ
  rationale: ഏകീകൃതമായി യുദ്ധത്തിനു പുറപ്പെടുന്നതും പിന്നീടുള്ള ‘ഏഴു വഴികൾ’ എന്ന വിരുദ്ധസമാന്തരവും വ്യക്തമാക്കുന്നു.
- source_word: תֵּצֵא אֵלָיו
  choice: നീ അവർക്കെതിരെ പുറപ്പെടും
  rationale: യുദ്ധസന്ദർഭത്തിൽ יצא + אל എന്നത് എതിരാളിക്കെതിരെ പുറപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു. എബ്രായത്തിലെ ഏകവചനപ്രത്യയം കൂട്ടായ ശത്രുസമൂഹത്തെ പരാമർശിക്കുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചനം ഉപയോഗിച്ചു.
- source_word: וּבְשִׁבְעָה דְרָכִים
  choice: ഏഴു വഴികളിലൂടെ
  rationale: സമ്പൂർണമായി ചിതറിയോടുന്ന ആശയം ഉൾക്കൊള്ളാവുന്ന വിധത്തിൽ എബ്രായത്തിലെ വ്യക്തമായ സംഖ്യാചിത്രം അതേപടി സൂക്ഷിക്കുന്നു.
- source_word: תָּנוּס לְפָנָיו
  choice: നീ അവരുടെ മുമ്പിൽനിന്ന് ഓടിപ്പോകും
  rationale: נוס എന്നതിന്റെ ‘ഓടിപ്പോകുക/പലായനം ചെയ്യുക’ എന്ന അർഥവും ശത്രുവിന്റെ മുമ്പിൽനിന്നുള്ള പിന്മാറ്റവും വ്യക്തമായി നൽകുന്നു.
- source_word: וְהָיִיתָ לְזַעֲוָה
  choice: നീ ഭീതിജനകമായ ഒന്നായിത്തീരും
  rationale: זַעֲוָה എന്ന പദത്തിലെ ഭീതി, നടുക്കം, കണ്ട് ഞെട്ടിക്കുന്ന അവസ്ഥ എന്നീ സാധ്യതകൾ ഒറ്റ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לְכֹל מַמְלְכוֹת הָאָרֶץ
  choice: ഭൂമിയിലെ സകല രാജ്യങ്ങൾക്കും
  rationale: നിയമാവർത്തനത്തിലെ വിശാലമായ അന്തർദേശീയ വ്യാപ്തി നിലനിർത്തുന്നു; הָאָרֶץ എന്നതിനെ ഇവിടെ ഒരു പ്രത്യേക ദേശമായി പരിമിതപ്പെടുത്തുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം ദൈവനാമം ലിപ്യന്തരം ചെയ്തു.
- issue: לְזַעֲוָה എന്ന ശാപചിത്രത്തിന്റെ ശക്തി
  choice: ഭീതിജനകമായ ഒന്നായിത്തീരും
  alternative: ഭീതിയുടെ വിഷയമായിത്തീരും; നടുക്കമായിത്തീരും
  rationale: ഇസ്രായേൽ മറ്റു രാജ്യങ്ങൾക്ക് ഭീതിയും ഞെട്ടലും ഉളവാക്കുന്ന ഒന്നാകുന്നു എന്ന പൊതുസ്വഭാവം നിലനിർത്തുന്നു; പദത്തെ ‘ഭീകരത’ എന്ന സജീവ ഭീഷണിയിലേക്ക് മാത്രം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘ഒരൊറ്റ വഴി/ഏഴു വഴികൾ’ എന്ന എബ്രായ സമാന്തരചിത്രം സംരക്ഷിച്ചു. അടിക്കുറിപ്പ് യഥാർഥത്തിൽ വിശദീകരിക്കുന്ന לְזַעֲוָה എന്ന പദത്തോടാണ് [a] ചേർത്തിരിക്കുന്നത്.
