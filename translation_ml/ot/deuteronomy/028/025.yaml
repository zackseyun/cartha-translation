  to: യഹ്‌വെ നിന്നെ നിന്റെ ശത്രുക്കളുടെ മുമ്പിൽ പരാജിതനായി ഏല്പിച്ചുകൊടുക്കും. ഒരൊറ്റ വഴിയിലൂടെ നീ അവർക്കെതിരെ പുറപ്പെടും; എന്നാൽ ഏഴു വഴികളിലൂടെ നീ അവരുടെ മുമ്പിൽനിന്ന് പലായനം ചെയ്യും. ഭൂമിയിലെ സകല രാജ്യങ്ങൾക്കും നീ ഭീതിയുടെ വിഷയമായിത്തീരും[a].
