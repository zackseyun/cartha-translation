  text: בָּר֥וּךְ טַנְאֲ/ךָ֖ וּ/מִשְׁאַרְתֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/005.yaml
  text: Blessed shall be your basket and your kneading bowl[a].
translation:
  language: ml
  text: നിന്റെ കൊട്ടയും മാവ് കുഴയ്ക്കുന്ന പാത്രവും അനുഗ്രഹിക്കപ്പെടും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മാവ് കുഴയ്ക്കുന്ന തൊട്ടി.” മാവ് തയ്യാറാക്കാൻ ഉപയോഗിച്ചിരുന്ന ഒരു പാത്രത്തെയാണ് എബ്രായപദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: അനുഗ്രഹിക്കപ്പെടും
  rationale: ברך എന്ന ക്രിയയുടെ നിഷ്ക്രിയ കൃദന്തരൂപം ഇവിടെ ഉടമ്പടിയനുഗ്രഹങ്ങളുടെ പരമ്പരയിലെ വിധേയപ്രയോഗമാണ്. ആശംസയെന്നതിലുപരി പ്രഖ്യാപനസ്വഭാവം പ്രകടമാക്കാൻ മലയാളത്തിൽ ഭാവികാല നിഷ്ക്രിയരൂപം ഉപയോഗിച്ചു.
- source_word: טַנְאֲךָ
  choice: നിന്റെ കൊട്ട
  rationale: טֶנֶא വിളവുപോലുള്ള സാധനങ്ങൾ വഹിക്കാനുള്ള കൊട്ടയെ സൂചിപ്പിക്കുന്നു. എബ്രായത്തിൽ വ്യക്തമാക്കിയതിലധികം പ്രത്യേകത ചേർക്കാതെ സ്വാഭാവികവും പൊതുവുമായ ‘കൊട്ട’ തിരഞ്ഞെടുത്തു.
- source_word: וּמִשְׁאַרְתֶּךָ
  choice: നിന്റെ മാവ് കുഴയ്ക്കുന്ന പാത്രം
  rationale: מִשְׁאֶרֶת മാവ് തയ്യാറാക്കുമ്പോൾ കുഴയ്ക്കാൻ ഉപയോഗിക്കുന്ന പാത്രമാണ്. ആധുനിക മലയാളവായനക്കാർക്ക് ഉപയോഗം വ്യക്തമായി മനസ്സിലാകുന്ന വിധത്തിൽ ‘മാവ് കുഴയ്ക്കുന്ന പാത്രം’ എന്നു നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ പ്രഖ്യാപനശൈലി നിലനിർത്തി. ഇരട്ട ‘നിന്റെ’ പ്രയോഗം ഒഴിവാക്കി സ്വാഭാവികമായ ഏകോപിത വാക്യഘടന ഉപയോഗിച്ചെങ്കിലും ഇരു നാമങ്ങൾക്കും ഉടമസ്ഥത വ്യക്തമാണ്.
