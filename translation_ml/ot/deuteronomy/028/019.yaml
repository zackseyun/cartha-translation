id: DEU.28.19
reference: Deuteronomy 28:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אָר֥וּר אַתָּ֖ה בְּ/בֹאֶ֑/ךָ וְ/אָר֥וּר אַתָּ֖ה בְּ/צֵאתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/019.yaml
  text: Cursed shall you be when you come in[a], and cursed shall you be when you go out.
translation:
  language: ml
  text: നീ അകത്തു വരുമ്പോൾ ശപിക്കപ്പെട്ടവനായിരിക്കും[a]; നീ പുറത്തേക്കു പോകുമ്പോഴും ശപിക്കപ്പെട്ടവനായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “നിന്റെ അകത്തുവരവിൽ ... നിന്റെ പുറത്തുപോകലിൽ.” അകത്തു വരുന്നതും പുറത്തേക്കു പോകുന്നതും ചേർന്ന ഈ എബ്രായ പ്രയോഗം ദൈനംദിന ജീവിതത്തിന്റെ മുഴുവൻ ഗതിയെയും ഉൾക്കൊള്ളുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: אָרוּר
  choice: ശപിക്കപ്പെട്ടവനായിരിക്കും
  rationale: ശാപത്തിന് വിധേയനായിരിക്കുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്ന നിഷ്ക്രിയ പങ്കാളിത്തരൂപം. നിയമവാക്യത്തിന്റെ ഭാവിസൂചനയും ഗൗരവവും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കാൻ ഈ രൂപം യോജിക്കുന്നു.
- source_word: אַתָּה
  choice: നീ
  rationale: രണ്ടാം പുരുഷ ഏകവചന പുരുഷലിംഗ സർവനാമം. ഇസ്രായേലിനെ ഉടമ്പടിസമൂഹമായി ഏകവചനത്തിൽ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്ന എബ്രായരൂപം ‘നീ’ സംരക്ഷിക്കുന്നു.
- source_word: בְּבֹאֶךָ
  choice: നീ അകത്തു വരുമ്പോൾ
  rationale: ב പ്രയോഗവും בוא എന്ന ക്രിയയുടെ infinitive construct രൂപവും ചേർന്ന് അക്ഷരാർഥത്തിൽ ‘നിന്റെ അകത്തുവരവിൽ’ എന്നാണ്. ‘അകത്തു വരുമ്പോൾ’ ആ അർഥവും സമാന്തര ഘടനയും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְ
  choice: ; ... -ഉം
  rationale: രണ്ടു സമാന്തര ശാപവാക്യങ്ങളെ ബന്ധിപ്പിക്കുന്ന ലളിത സംയോജകം. മലയാളത്തിൽ അർധവിരാമവും ‘-ഉം’ എന്ന ചേർക്കലും ബന്ധവും ഊന്നലും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּצֵאתֶךָ
  choice: നീ പുറത്തേക്കു പോകുമ്പോൾ
  rationale: ב പ്രയോഗവും יצא എന്ന ക്രിയയുടെ infinitive construct രൂപവും ചേർന്ന് അക്ഷരാർഥത്തിൽ ‘നിന്റെ പുറത്തുപോകലിൽ’ എന്നാണ്. ആദ്യ പാദത്തോടുള്ള വിരുദ്ധസമാന്തരത്വം ഈ പരിഭാഷ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഉടമ്പടിശാപ സൂത്രവാക്യത്തിന്റെ ഊന്നലും ഗൗരവവും നിലനിർത്തൽ
  choice: നീ ... ശപിക്കപ്പെട്ടവനായിരിക്കും
  alternative: ശപിക്കപ്പെട്ടവനായിരിക്കും നീ
  rationale: എബ്രായത്തിൽ ‘ശപിക്കപ്പെട്ട’ എന്ന പദം മുന്നിൽവന്ന് ഊന്നൽ നേടുന്നു. എന്നാൽ മലയാളത്തിൽ അതേ പദക്രമം കൃത്രിമമായി കേൾക്കാം; ആവർത്തിച്ച പൂർണ്ണവാക്യവും ‘ശപിക്കപ്പെട്ടവനായിരിക്കും’ എന്ന വിധിനിർണ്ണയഭാവവും ഉപയോഗിച്ച് ഗൗരവവും ഊന്നലും നിലനിർത്തുന്നു.
- issue: ‘അകത്തു വരുക / പുറത്തേക്കു പോകുക’ എന്ന ദ്വന്ദപ്രയോഗത്തിന്റെ വ്യാപ്തി
  choice: പ്രയോഗം മുഖ്യവാചകത്തിൽ അക്ഷരസമീപമായി നിലനിർത്തി അതിന്റെ വ്യാപക അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുക
  alternative: നിന്റെ എല്ലാ ദൈനംദിന പ്രവർത്തനങ്ങളിലും
  rationale: ഈ വിരുദ്ധപദജോടി ദൈനംദിന ജീവിതത്തിന്റെ മുഴുവൻ ഗതിയെയും ഉൾക്കൊള്ളുന്ന ഒരു merism ആയിരിക്കാം. വ്യാഖ്യാനാർഥം മുഖ്യവാചകത്തിൽ പകരാതെ രൂപകത്തിന്റെ ഭാഷയും വ്യാപക സൂചനയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ഉടമ്പടിശാപത്തിന്റെ ഗൗരവത്തിന് യോജിച്ചതുമായ ഭാഷ. ഏകവചനമായ ‘നീ’ നിലനിർത്തിയിരിക്കുന്നു; പഴഞ്ചൻ പദക്രമം ഒഴിവാക്കി സമാന്തര ആവർത്തനത്തിലൂടെ മൂലത്തിലെ ഔപചാരിക ഊന്നൽ പ്രകടമാക്കി.
