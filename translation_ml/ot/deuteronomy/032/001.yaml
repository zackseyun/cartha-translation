source:
  edition: WLC
  text: הַאֲזִ֥ינוּ הַ/שָּׁמַ֖יִם וַ/אֲדַבֵּ֑רָה וְ/תִשְׁמַ֥ע הָ/אָ֖רֶץ אִמְרֵי פִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/001.yaml
  text: Give ear[a], O heavens, and I will speak; and let the earth hear the words of my mouth.
translation:
  language: ml
  text: ആകാശങ്ങളേ, ശ്രദ്ധിച്ചുകേൾക്കുവിൻ[a]; ഞാൻ സംസാരിക്കട്ടെ. ഭൂമി എന്റെ വായിലെ വാക്കുകൾ കേൾക്കട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ആകാശങ്ങളേ, ചെവികൊടുക്കുവിൻ ... ഭൂമി കേൾക്കുമാറാകട്ടെ.” ഹീബ്രുവിൽ ഉന്നതമായ കാവ്യശൈലിയിലുള്ള ആജ്ഞയും അഭ്യർഥനയും ഉപയോഗിച്ചിരിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֲזִינוּ
  choice: ശ്രദ്ധിച്ചുകേൾക്കുവിൻ
  rationale: ഹിഫ്ഇൽ ആജ്ഞാരൂപം വെറും കേൾവിയല്ല, ശ്രദ്ധാപൂർവമായ ശ്രവണമാണ് ആവശ്യപ്പെടുന്നത്. ‘ശ്രദ്ധിച്ചുകേൾക്കുവിൻ’ ആ അർഥവും കാവ്യാത്മകമായ ഗൗരവവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַשָּׁמַיִם
  choice: ആകാശങ്ങളേ
  rationale: കാവ്യാത്മകമായ നേരിട്ടുള്ള അഭിസംബോധനയും ഹീബ്രു ബഹുവചനരൂപവും ‘ആകാശങ്ങളേ’ വ്യക്തമാക്കുന്നു.
- source_word: וַאֲדַבֵּרָה
  choice: ഞാൻ സംസാരിക്കട്ടെ
  rationale: കോഹോർട്ടേറ്റീവ് രൂപത്തിലെ ഇച്ഛയോ ഉദ്ദേശ്യമോ ‘സംസാരിക്കട്ടെ’ കാത്തുസൂക്ഷിക്കുന്നു; നിർവ്യാജ ഭാവികാലമായി മാത്രം ചുരുക്കുന്നില്ല.
- source_word: וְתִשְׁמַע
  choice: ഭൂമി ... കേൾക്കട്ടെ
  rationale: ഇംപർഫെക്റ്റ്/ജസ്സീവ് രൂപം മുൻവരിയിലെ ആജ്ഞയോടു സമാന്തരമായ അഭ്യർഥനയായി പ്രവർത്തിക്കുന്നു. ‘കേൾക്കട്ടെ’ അതിന്റെ സങ്കൽപ്പാത്മക-ആഹ്വാനാത്മക ഭാവം നിലനിർത്തുന്നു.
- source_word: הָאָרֶץ
  choice: ഭൂമി
  rationale: ആകാശം–ഭൂമി എന്ന സർവലൗകിക ജോടിയിൽ ‘ദേശം’ എന്നതിനെക്കാൾ ‘ഭൂമി’ യോജിക്കുന്നു.
- source_word: אִמְרֵי
  choice: വാക്കുകൾ
  rationale: സംസാരിച്ച ഉച്ചാരണങ്ങളെ സൂചിപ്പിക്കുന്ന പദത്തിന് സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളസമം ‘വാക്കുകൾ’ ആണ്.
- source_word: פִי
  choice: എന്റെ വായിലെ
  rationale: ‘എന്റെ വായിലെ വാക്കുകൾ’ എന്ന ദൃശ്യസാന്ദ്രമായ ഹീബ്രു ഘടന പരാവർത്തനം ചെയ്യാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ആകാശത്തെയും ഭൂമിയെയും അഭിസംബോധന ചെയ്യുന്നതിന്റെ വ്യാപ്തി
  choice: സാക്ഷികളെന്നോണം സകലസൃഷ്ടിയെയും വിളിച്ചുവരുത്തുന്ന കാവ്യാത്മക ആഹ്വാനം
  alternative: എല്ലാ ശ്രോതാക്കളോടുമുള്ള വെറും അലങ്കാരപരമായ ആഹ്വാനം
  rationale: ആകാശവും ഭൂമിയും ചേർന്നുള്ള ഔപചാരിക കാവ്യഘടന നിയമപരവും പ്രവാചകീയവുമായ സാക്ഷ്യഭാവം സൂചിപ്പിക്കുന്നു. എന്നാൽ മുഖ്യപാഠം അതിനെ വിശദീകരിച്ച് പരിധിനിർണയിക്കാതെ ഗൗരവമുള്ള അഭിസംബോധനയായി മാത്രം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കാവ്യഭാഷ ഉപയോഗിച്ചു. ‘ശ്രദ്ധിച്ചുകേൾക്കുവിൻ’ എന്ന രൂപം സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്നതോടൊപ്പം ഔപചാരിക അഭിസംബോധനയുടെ ഉയർന്ന രജിസ്റ്ററും നിലനിർത്തുന്നു; ‘സംസാരിക്കട്ടെ’, ‘കേൾക്കട്ടെ’ എന്നിവ മൂലപാഠത്തിലെ ഇച്ഛാ/അഭ്യർഥനാഭാവം സംരക്ഷിക്കുന്നു.
