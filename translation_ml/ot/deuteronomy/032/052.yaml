  text: כִּ֥י מִ/נֶּ֖גֶד תִּרְאֶ֣ה אֶת הָ/אָ֑רֶץ וְ/שָׁ֨מָּ/ה֙ לֹ֣א תָב֔וֹא אֶל הָ/אָ֕רֶץ אֲשֶׁר אֲנִ֥י נֹתֵ֖ן לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/052.yaml
  text: For you shall see the land from a distance[a], but you shall not go there[b], into the land that I am giving to the sons of Israel.
translation:
  language: ml
  text: എന്തെന്നാൽ, നീ ആ ദേശത്തെ അകലെനിന്നു കാണും[a]; എന്നാൽ ഞാൻ ഇസ്രായേൽമക്കൾക്കു കൊടുക്കുന്ന ആ ദേശത്തേക്കു നീ കടക്കുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “എതിർവശത്തുനിന്ന്” അല്ലെങ്കിൽ “ദൂരത്തുനിന്ന്” എന്നും പരിഭാഷപ്പെടുത്താം. മോശെ ദേശം കാണുമെങ്കിലും അതിൽ പ്രവേശിക്കുകയില്ല എന്നതാണ് ഹീബ്രു പ്രയോഗത്തിന്റെ ആശയം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ ദൈവപ്രഖ്യാപനത്തിന്റെ കാരണം അല്ലെങ്കിൽ വിശദീകരണം അവതരിപ്പിക്കുന്ന ബന്ധപദമായി സ്വാഭാവികമായി പ്രവർത്തിക്കുന്നു.
- source_word: מִנֶּגֶד
  choice: അകലെനിന്നു
  rationale: ദേശത്തിന് എതിർവശത്തുനിന്നോ ദൂരത്തുനിന്നോ നോക്കുന്നതെന്ന ആശയം സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കുന്നു; പ്രവേശിക്കാതെ കാണുക എന്ന വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: תִּרְאֶה
  choice: നീ ... കാണും
  rationale: രണ്ടാം പുരുഷ ഏകവചനത്തിലെ അപൂർണക്രിയ ഇവിടെ ഭാവിയിലെ ഉറച്ച ദൈവപ്രഖ്യാപനമാണ്.
- source_word: הָאָרֶץ
  choice: ആ ദേശം
  rationale: സന്ദർഭത്തിൽ വാഗ്ദത്തദേശം തന്നെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ നിർദിഷ്ടത വ്യക്തമാക്കാൻ ‘ആ’ ചേർത്തു.
- source_word: וְשָׁמָּה לֹא תָבֹא אֶל־הָאָרֶץ
  choice: എന്നാൽ ... ആ ദേശത്തേക്കു നീ കടക്കുകയില്ല
  rationale: בוא എന്ന ചലനക്രിയയും אֶל എന്ന ദിശാസൂചനയും ചേർന്ന് ദേശത്തിനകത്തേക്കുള്ള പ്രവേശനം നിഷേധിക്കുന്നതിനാൽ ‘കടക്കുക’ സ്വാഭാവികവും സന്ദർഭസൂചകവുമാണ്. ‘അവിടേക്ക്’ എന്ന ആശയം മലയാളവാക്യത്തിൽ ‘ആ ദേശത്തേക്ക്’ എന്നതിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: אֲשֶׁר אֲנִי נֹתֵן
  choice: ഞാൻ ... കൊടുക്കുന്ന
  rationale: ഹീബ്രു കർത്തൃവാചകത്തിന്റെ തുടരുന്ന/സമീപസ്ഥമായ ദാനപ്രവൃത്തിയെ മലയാളത്തിലെ വർത്തമാന സംബന്ധക രൂപം സംരക്ഷിക്കുന്നു.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾക്കു
  rationale: ദേശീയ-ഉടമ്പടിസംബന്ധമായ സ്ഥിരപ്രയോഗത്തെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ഇത് യാക്കോബായ ഇസ്രായേലിന്റെ സന്തതികളായ മുഴുവൻ ജനസമൂഹത്തെയും സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל എന്ന ഉടമ്പടിസംബന്ധമായ ജനനാമത്തിന്റെ ലിംഗരൂപം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേലിന്റെ പുത്രന്മാർ / ഇസ്രായേൽജനം
  rationale: ഹീബ്രു പ്രയോഗം രൂപത്തിൽ പുല്ലിംഗ ബഹുവചനമാണെങ്കിലും ഒരു ജനതയുടെ പരമ്പരാഗത സമഗ്രനാമമാണ്. ‘ഇസ്രായേൽമക്കൾ’ മൂലത്തിലെ വംശബന്ധം നിലനിർത്തുകയും മലയാളത്തിൽ സ്ത്രീപുരുഷന്മാർ ഉൾപ്പെടുന്ന മുഴുവൻ ജനത്തെയും സ്വാഭാവികമായി സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- issue: മോശെ ദേശം കാണുമെങ്കിലും പ്രവേശിക്കില്ല എന്ന ദൈവപ്രഖ്യാപനം
  choice: കാണും; എന്നാൽ ... കടക്കുകയില്ല
  alternative: കാണാം; എന്നാൽ ... പോകുകയില്ല
  rationale: രണ്ടു ക്രിയകളും സാധ്യതയല്ല, ഉറച്ച ഭാവിപ്രഖ്യാപനമാണ്. കാണലും പ്രവേശനനിഷേധവും തമ്മിലുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷം ‘എന്നാൽ’ എന്ന വിരുദ്ധബന്ധത്തിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ദൈവപ്രഖ്യാപനത്തിന്റെ ഉറപ്പും, ദേശം കാണുന്നതും അതിൽ പ്രവേശിക്കാത്തതും തമ്മിലുള്ള വൈരുധ്യവും നിലനിർത്തി. മുഖ്യപാഠത്തിലെ [a] അടിക്കുറിപ്പുമായി കൃത്യമായി പൊരുത്തപ്പെടുന്നു.
