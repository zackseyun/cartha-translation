  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: רְא֣וּ עַתָּ֗ה כִּ֣י אֲנִ֤י אֲנִי֙ ה֔וּא וְ/אֵ֥ין אֱלֹהִ֖ים עִמָּ/דִ֑י אֲנִ֧י אָמִ֣ית וַ/אֲחַיֶּ֗ה מָחַ֨צְתִּי֙ וַ/אֲנִ֣י אֶרְפָּ֔א וְ/אֵ֥ין מִ/יָּדִ֖/י מַצִּֽיל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/039.yaml
  text: See now that I[a], even I, am he, and there is no god beside me. I put to death and I make alive; I have wounded, and I will heal[e][d][c][b]; and there is no one who can deliver from my hand.
translation:
  language: ml
  text: 'ഇപ്പോൾ കാണുക: ഞാൻ—ഞാൻ തന്നെയാണ് അവൻ.[a] എനിക്കു പുറമേ ഒരു ദൈവവുമില്ല.[b] ഞാൻ മരണത്തിനിരയാക്കുന്നു, ഞാൻ ജീവിപ്പിക്കുന്നു; ഞാൻ മുറിവേൽപ്പിച്ചു, ഞാൻ സൗഖ്യമാക്കും.[c][d] എന്റെ കൈയിൽനിന്ന് വിടുവിക്കാൻ ആരുമില്ല.[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ ഊന്നലോടെ അക്ഷരാർഥം: ‘ഞാൻ, ഞാൻ തന്നെയാണ് അവൻ.’'
    reason: source_form
  - marker: b
    text: 'അല്ലെങ്കിൽ: ‘എന്നോടൊപ്പം ഒരു ദൈവവുമില്ല.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ ബന്ധപദത്തിന് ‘കൂടെ’ എന്നും ‘അരികെ/പുറമേ’ എന്നും അർഥമാകാം.'
    reason: lexical_alternative
  - marker: c
    text: 'അല്ലെങ്കിൽ: ‘ഞാൻ കൊല്ലുന്നു, ഞാൻ ജീവിപ്പിക്കുന്നു.’'
    reason: lexical_alternative
  - marker: d
    text: 'അല്ലെങ്കിൽ: ‘ഞാൻ തകർത്തു, ഞാൻ സൗഖ്യമാക്കും.’ ‘മുറിവേൽപ്പിച്ചു’ എന്നു പരിഭാഷപ്പെടുത്തിയ ക്രിയയ്ക്ക് ചതയ്ക്കുക, തകർക്കുക എന്ന ശക്തമായ അർഥവും ഉണ്ടാകാം.'
    reason: lexical_alternative
  - marker: e
    text: ‘എന്റെ കൈയിൽനിന്ന്’ എന്നത് ഒരാളുടെ ശക്തിയിൽനിന്നോ നിയന്ത്രണത്തിൽനിന്നോ രക്ഷപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: רְאוּ עַתָּה
  choice: ഇപ്പോൾ കാണുക
  rationale: ബഹുവചന ആജ്ഞാരൂപം ഒരു സത്യം തിരിച്ചറിയാനുള്ള നേരിട്ടുള്ള ആഹ്വാനമാണ്. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ രൂപം തിരഞ്ഞെടുത്തു.
- source_word: כִּי אֲנִי אֲנִי הוּא
  choice: ഞാൻ—ഞാൻ തന്നെയാണ് അവൻ
  rationale: ഇരട്ടിച്ചിരിക്കുന്ന אֲנִי നൽകുന്ന ഊന്നൽ നിലനിർത്തുന്നു; ‘ഞാൻ മാത്രമാണ്’ എന്ന വ്യാഖ്യാനവാക്ക് കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: וְאֵין אֱלֹהִים עִמָּדִי
  choice: എനിക്കു പുറമേ ഒരു ദൈവവുമില്ല
  rationale: עִם എന്നതിന് അക്ഷരാർഥത്തിൽ ‘കൂടെ’ എന്നാണെങ്കിലും, ഇവിടെ മറ്റൊരു ദൈവം ദൈവത്തോടൊപ്പം ഇല്ലെന്ന അനന്യതയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്. ‘എനിക്കു പുറമേ’ അത് സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: אֲנִי אָמִית
  choice: ഞാൻ മരണത്തിനിരയാക്കുന്നു
  rationale: מות എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലെ മരണത്തിനു കാരണമാകുന്ന അർഥം വ്യക്തമായി സൂക്ഷിക്കുന്നു; ‘കൊല്ലുന്നു’ എന്നതിനെക്കാൾ കവിതയുടെ ഗൗരവമുള്ള ഭാവത്തിനും ചേരുന്നു.
- source_word: וַאֲחַיֶּה
  choice: ഞാൻ ജീവിപ്പിക്കുന്നു
  rationale: ദൈവിക പ്രവർത്തനം നേരിട്ട് പ്രകടമാക്കുകയും ‘മരണത്തിനിരയാക്കുന്നു’ എന്നതിനോടുള്ള സമാന്തരവിരുദ്ധത നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: מָחַצְתִּי
  choice: ഞാൻ മുറിവേൽപ്പിച്ചു
  rationale: ഈ ക്രിയയ്ക്ക് തകർക്കുക, ചതയ്ക്കുക എന്നീ ശക്തമായ അർഥങ്ങളും ഉണ്ടെങ്കിലും, പിന്നാലെയുള്ള ‘സൗഖ്യമാക്കും’ എന്നതിനോടുള്ള വിരുദ്ധസമാന്തരത ‘മുറിവേൽപ്പിച്ചു’ വ്യക്തമായി നൽകുന്നു.
- source_word: וַאֲנִי אֶרְפָּא
  choice: ഞാൻ സൗഖ്യമാക്കും
  rationale: അപൂർണക്രിയാരൂപത്തിന്റെ ഭാവികാലസാധ്യത നിലനിർത്തുകയും മുൻപുള്ള പൂർത്തിയായ പ്രവൃത്തിയിൽനിന്ന് പുനഃസ്ഥാപനത്തിലേക്കുള്ള നീക്കം പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: וְאֵין מִיָּדִי מַצִּיל
  choice: എന്റെ കൈയിൽനിന്ന് വിടുവിക്കാൻ ആരുമില്ല
  rationale: מַצִּיל എന്ന പങ്കാളിത്തരൂപത്തിന്റെ രക്ഷിക്കുക/വിടുവിക്കുക എന്ന അർഥവും ‘കൈ’ എന്ന എബ്രായ അധികാരരൂപകവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: മറ്റു ദൈവങ്ങളോടുള്ള ബന്ധത്തിൽ ദൈവത്തിന്റെ അനന്യത
  choice: ‘എനിക്കു പുറമേ ഒരു ദൈവവുമില്ല’ എന്ന സമ്പൂർണ അനന്യതാവാദമായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘എന്നോടൊപ്പം ഒരു ദൈവവുമില്ല’—ദൈവത്തിന് കൂട്ടാളിയോ സഹകാരിയോ ആയ മറ്റൊരു ദൈവമില്ല എന്ന അർഥം.
  rationale: സമീപസന്ദർഭവും പദപ്രയോഗവും ശക്തമായ അനന്യതയെ പിന്തുണയ്ക്കുന്നു. എന്നാൽ അക്ഷരാർഥത്തിലെ ‘കൂടെ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചിട്ടുണ്ട്.
- issue: ‘ഞാൻ തന്നെയാണ് അവൻ’ എന്ന പ്രയോഗത്തിന്റെ ദൈവശാസ്ത്രപരമായ പ്രതിധ്വനി
  choice: ‘ഞാൻ—ഞാൻ തന്നെയാണ് അവൻ’ എന്ന ലളിതവും ഊന്നലുള്ളതുമായ രൂപം നിലനിർത്തി.
  alternative: ‘ഞാൻ മാത്രമാണ് അവൻ’ അല്ലെങ്കിൽ ‘ഞാനാണ് ആ ഒരുവൻ’.
  rationale: ഈ പ്രയോഗത്തിന്റെ വിശാലമായ വേദപുസ്തകപ്രതിധ്വനി അംഗീകരിക്കുമ്പോഴും, എബ്രായത്തിൽ നേരിട്ട് ഇല്ലാത്ത സിദ്ധാന്തപരമായ വികാസം മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
- issue: മരണവും ജീവനും മുറിവും സൗഖ്യവും ദൈവത്തിന്റെ പ്രവർത്തനമായി പറയുന്നത്
  choice: രണ്ട് വിരുദ്ധജോടികളിലുമുള്ള ദൈവിക കർത്തൃത്വം നേരിട്ട് നിലനിർത്തി.
  alternative: ദൈവം ഇവയെ അനുവദിക്കുന്നു എന്ന മൃദൂകരിച്ച വ്യാഖ്യാനം.
  rationale: എബ്രായ ക്രിയകൾ ദൈവത്തെ നേരിട്ടുള്ള കർത്താവായി അവതരിപ്പിക്കുന്നു; ദൈവിക കർത്തൃത്വവും മനുഷ്യ ഉത്തരവാദിത്വവും തമ്മിലുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഭാഷയിൽ മൃദൂകരിക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ ശൈലി ഉപയോഗിച്ചു. കവിതയിലെ സമാന്തരഘടനയും ദൈവത്തിന്റെ നേരിട്ടുള്ള ഒന്നാംപുരുഷ പ്രഖ്യാപനവും നിലനിർത്തി; അമിതമായി പുരാതനമായ ആജ്ഞാരൂപങ്ങളും വിഭാഗീയ ദൈവശാസ്ത്രപദങ്ങളും ഒഴിവാക്കി.
