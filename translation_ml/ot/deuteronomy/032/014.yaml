  text: curds from the herd[a], and milk from the flock, with the fat of lambs, and rams, the offspring of Bashan, and goats, with the choicest wheat; and you drank foaming wine[b], the blood of grapes.
translation:
  language: ml
  text: കന്നുകാലികളിൽനിന്നുള്ള തൈരും ആട്ടിൻപറ്റത്തിൽനിന്നുള്ള പാലും, കുഞ്ഞാടുകളുടെയും ബാശാനിൽ വളർന്ന ആട്ടുകൊറ്റന്മാരുടെയും കോലാട്ടുകൊറ്റന്മാരുടെയും കൊഴുപ്പും, ഏറ്റവും മേന്മയുള്ള ഗോതമ്പും[a]; മുന്തിരിയുടെ രക്തമായ പതയുന്ന വീഞ്ഞും[b] നീ കുടിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘ഗോതമ്പിന്റെ വൃക്കകളിലെ കൊഴുപ്പ്.’ ഏറ്റവും മികച്ചതോ സമൃദ്ധമായതോ ആയ ഗോതമ്പിനെ സൂചിപ്പിക്കുന്ന ശൈലീപ്രയോഗമാണിത്.'
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘ചുവന്ന വീഞ്ഞ്.’ എബ്രായപദം നന്നായി പുളിച്ച, പതയുന്ന വീഞ്ഞിനെയോ ചുവന്ന വീഞ്ഞിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶמְאַת בָּקָר
  choice: കന്നുകാലികളിൽനിന്നുള്ള തൈര്
  rationale: חֶמְאָה ഇവിടെ വെണ്ണയെക്കാൾ കട്ടിയുള്ളതോ പുളിപ്പിച്ചതോ ആയ പാൽവിഭവത്തെ സൂചിപ്പിക്കാൻ സാധ്യതയുണ്ട്. സാധാരണ മലയാളത്തിൽ സ്വാഭാവികവും ഇടയജീവിതത്തിന്റെ ദൃശ്യത്തിന് യോജിച്ചതുമായ പദമാണ് ‘തൈര്’.
- source_word: חֲלֵב צֹאן
  choice: ആട്ടിൻപറ്റത്തിൽനിന്നുള്ള പാൽ
  rationale: צֹאן ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടാവുന്ന ചെറുകന്നുകാലികളുടെ കൂട്ടനാമമാണ്. ‘ആട്ടിൻപറ്റം’ കൂട്ടമായുള്ള അർഥവും സമാന്തര ഘടനയും നിലനിർത്തുന്നു.
- source_word: חֵלֶב כָּרִים וְאֵילִים בְּנֵי־בָשָׁן וְעַתּוּדִים
  choice: കുഞ്ഞാടുകളുടെയും ബാശാനിൽ വളർന്ന ആട്ടുകൊറ്റന്മാരുടെയും കോലാട്ടുകൊറ്റന്മാരുടെയും കൊഴുപ്പ്
  rationale: חֵלֶב എന്നതിന്റെ മൂർത്തമായ ‘കൊഴുപ്പ്’ എന്ന ദൃശ്യത്തെ നിലനിർത്തുന്നു. בְּנֵי־בָשָׁן എന്നത് ബാശാൻ പ്രദേശത്ത് വളർന്ന മൃഗങ്ങളെ സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ അങ്ങനെ വ്യക്തമാക്കി. עַתּוּדִים ആൺകോലാടുകളെ സൂചിപ്പിക്കുന്നതിനാൽ ലിംഗവിവരം നിലനിർത്തി.
- source_word: חֵלֶב כִּלְיֹות חִטָּה
  choice: ഏറ്റവും മേന്മയുള്ള ഗോതമ്പ്
  rationale: അക്ഷരാർഥത്തിൽ ‘ഗോതമ്പിന്റെ വൃക്കകളിലെ കൊഴുപ്പ്’ എന്ന കാവ്യപ്രയോഗം ഏറ്റവും സമൃദ്ധവും മികച്ചതുമായ ധാന്യത്തെ സൂചിപ്പിക്കുന്നു. മുഖ്യവാചകത്തിൽ അർഥം വ്യക്തമായി നൽകി, മൂലരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: דַם עֵנָב
  choice: മുന്തിരിയുടെ രക്തം
  rationale: വീഞ്ഞിനെ സൂചിപ്പിക്കുന്ന ശക്തമായ കാവ്യരൂപകം മലയാളത്തിലും വ്യക്തവും സ്വാഭാവികവുമാകയാൽ അതേപടി നിലനിർത്തി.
- source_word: תִּשְׁתֶּה חָמֶר
  choice: പതയുന്ന വീഞ്ഞ് നീ കുടിച്ചു
  rationale: തുടർന്നുകൊണ്ടിരിക്കുന്ന വിവരണത്തിൽ imperfect രൂപം ഭൂതകാലമായി സ്വാഭാവികമായി വായിക്കാം. חָמֶר സമൃദ്ധമായി പുളിച്ചോ പതയുന്നതോ ആയ വീഞ്ഞിനെ സൂചിപ്പിക്കാം; എന്നാൽ ‘ചുവന്ന വീഞ്ഞ്’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
theological_decisions:
- issue: സമൃദ്ധിയുടെ കാവ്യചിത്രങ്ങളെ വ്യാഖ്യാനാത്മകമായി ആത്മീയവൽക്കരിക്കണമോ എന്നത്
  choice: മൃഗസംരക്ഷണവും കൃഷിയും സംബന്ധിച്ച മൂർത്തമായ ഭക്ഷണചിത്രങ്ങൾ നിലനിർത്തി.
  alternative: ഇവയെ ‘സമൃദ്ധി’, ‘ഉടമ്പടി അനുഗ്രഹം’ തുടങ്ങിയ അമൂർത്തമായ ദൈവശാസ്ത്രപദങ്ങളാക്കി മാറ്റുക.
  rationale: വാക്യം ദൈവിക പരിപാലനത്തെ ഭക്ഷണപാനീയങ്ങളുടെ മൂർത്തമായ പട്ടികയിലൂടെ ചിത്രീകരിക്കുന്നു. മൂലത്തിൽ ഇല്ലാത്ത ദൈവശാസ്ത്രവ്യാഖ്യാനം വിവർത്തനത്തിലേക്ക് ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. ആവർത്തിച്ചുള്ള ‘-ഉം’ ഘടന എബ്രായ കവിതയിലെ സമൃദ്ധമായ പട്ടികയുടെ താളം നിലനിർത്തുന്നു; അപരിചിതമായ ‘ഗോതമ്പിന്റെ വൃക്കകൾ’ മുഖ്യവാചകത്തിൽ ഒഴിവാക്കി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
