source:
  edition: WLC
  text: יַקְנִאֻ֖/הוּ בְּ/זָרִ֑ים בְּ/תוֹעֵבֹ֖ת יַכְעִיסֻֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/016.yaml
  text: They made him jealous with strangers[a]; with abominations they provoked him to anger.
translation:
  language: ml
  text: അന്യന്മാരാൽ അവർ അവനിൽ അസൂയ ജനിപ്പിച്ചു; അറപ്പുളവാക്കുന്ന കാര്യങ്ങളാൽ അവർ അവനെ കോപിപ്പിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അന്യദേവന്മാരാൽ’ അല്ലെങ്കിൽ ‘വിദേശദേവന്മാരാൽ’; എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ ‘അന്യന്മാരാൽ/വിദേശികളാൽ’ എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: יַקְנִאֻהוּ
  choice: അവർ അവനെ അസൂയപ്പെടുത്തി
  rationale: קנא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം, മൂന്നാംപുരുഷ ഏകവചന കർമത്തോടുകൂടെ, അവനിൽ അസൂയ ഉളവാക്കുക എന്ന കാരണാർഥം നൽകുന്നു. ഉടമ്പടിബന്ധത്തിലെ മാനുഷികഭാവാരോപണം വിശദീകരിച്ചു നീക്കാതെ നിലനിർത്തുന്നു.
- source_word: בְּזָרִים
  choice: അന്യരാൽ
  rationale: זָרִים എന്ന പദത്തിന്റെ അടിസ്ഥാനാർഥം ‘അന്യർ/പരദേശീയർ’ എന്നാണ്. ഈ വാക്യത്തിൽ ‘ദേവന്മാർ’ എന്ന നാമം തുറന്നുപറയാത്തതിനാൽ മുഖ്യപാഠം അതു കൂട്ടിച്ചേർക്കുന്നില്ല; വിഗ്രഹാരാധനാസന്ദർഭത്തിലുള്ള സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: בְּתוֹעֵבֹת
  choice: മ്ലേച്ഛകാര്യങ്ങളാൽ
  rationale: תּוֹעֵבָה ദൈവത്തിന് അറപ്പുളവാക്കുന്ന, വെറുക്കത്തക്ക കാര്യത്തെ സൂചിപ്പിക്കുന്നു; ഇവിടെ ബഹുവചനവും വിഗ്രഹാരാധനാസന്ദർഭവും സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
- source_word: יַכְעִיסֻהוּ
  choice: അവർ അവനെ കോപിപ്പിച്ചു
  rationale: כעס എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള ‘കോപം ഉളവാക്കുക’ എന്ന കാരണാർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു; ആദ്യ പാദത്തോടുള്ള സമാന്തരതയും കാക്കുന്നു.
theological_decisions:
- issue: זָרִים എന്നതിൽ സൂചിതമായ വിഗ്രഹാരാധനയുടെ കർമം വ്യക്തമാക്കണമോ
  choice: മുഖ്യപാഠത്തിൽ ‘അന്യർ’ എന്ന പദത്തിന്റെ അടിസ്ഥാനാർഥം നിലനിർത്തുക
  alternative: ‘അന്യദേവന്മാർ’ അല്ലെങ്കിൽ ‘പരദേവന്മാർ’
  rationale: സന്ദർഭം അന്യദേവാരാധനയാണെങ്കിലും ഈ വാക്യത്തിലെ എബ്രായപാഠം ‘ദേവന്മാർ’ എന്നു നേരിട്ട് പറയുന്നില്ല. അതിനാൽ യഥാർഥമായ അവ്യക്തത മുഖ്യപാഠത്തിൽ സൂക്ഷിച്ച് സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. മൂലപാഠത്തിലെ രണ്ടു സമാന്തര കാരണാർഥ ക്രിയകളും ദൈവത്തെക്കുറിച്ചുള്ള അസൂയ–കോപ ഭാഷയും നിലനിർത്തി.
