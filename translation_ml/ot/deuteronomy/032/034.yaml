  text: Is it not laid up with me[b][a], sealed in my storehouses?
translation:
  language: ml
  text: അത് എന്റെ പക്കൽ സൂക്ഷിച്ചുവെച്ചതും എന്റെ കലവറകളിൽ മുദ്രയിട്ടതും അല്ലയോ[a][b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്റെ പക്കൽ മറച്ചുവെച്ചതും.”
