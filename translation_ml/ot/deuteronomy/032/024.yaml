source:
  edition: WLC
  text: מְזֵ֥י רָעָ֛ב וּ/לְחֻ֥מֵי רֶ֖שֶׁף וְ/קֶ֣טֶב מְרִירִ֑י וְ/שֶׁן בְּהֵמוֹת֙ אֲשַׁלַּח בָּ֔/ם עִם חֲמַ֖ת זֹחֲלֵ֥י עָפָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/024.yaml
  text: wasted by famine[a], consumed by plague and bitter destruction; I will send against them the fangs of beasts[c][b], with the venom of things that crawl in the dust.
translation:
  language: ml
  text: പട്ടിണിയാൽ ക്ഷയിച്ച്, മഹാമാരിയാൽ[a] വിഴുങ്ങപ്പെട്ട്, കൊടിയ നാശത്തിന് ഇരയായി അവർ തീരും. മൃഗങ്ങളുടെ ദംഷ്ട്രകൾ[b] ഞാൻ അവരുടെ നേരെ അയയ്ക്കും; മണ്ണിൽ ഇഴയുന്ന ജീവികളുടെ[c] വിഷവും അതോടൊപ്പം അയയ്ക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കത്തുന്ന പനി.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം പുരാതന സമീപപൂർവദേശത്ത് മഹാമാരിയുമായി ബന്ധപ്പെട്ട ‘റെശെഫ്’ എന്ന ദേവനാമത്തിന്റെ പ്രതിധ്വനിയുമായിരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘മൃഗങ്ങളുടെ പല്ലുകൾ.’
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘മണ്ണിലെ സർപ്പങ്ങൾ.’ എന്നാൽ എബ്രായപ്രയോഗം കൂടുതൽ വിശാലമാണ്; നിലത്തുകൂടി ഇഴയുന്ന ജീവികളെയാണ് അത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְזֵי רָעָב
  choice: പട്ടിണിയാൽ ക്ഷയിച്ച്
  rationale: מְזֵי എന്ന പദം ശരീരം ക്ഷയിച്ച് മെലിഞ്ഞുപോകുന്നതിനെ സൂചിപ്പിക്കുന്നു; ന്യായവിധിയുടെ പശ്ചാത്തലത്തിൽ רָעָב വെറും വിശപ്പിനെക്കാൾ വ്യാപകമായ പട്ടിണിയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: לְחֻמֵי רֶשֶׁף
  choice: മഹാമാരിയാൽ വിഴുങ്ങപ്പെട്ട്
  rationale: അപൂർവമായ לְחֻמֵי എന്ന രൂപത്തിലെ തിന്നുതീർക്കപ്പെടുന്ന ദൃശ്യഭാവം ‘വിഴുങ്ങപ്പെട്ട്’ നിലനിർത്തുന്നു. רֶשֶׁף ഇവിടെ വിനാശകരമായ മഹാമാരിയായി വിവർത്തനം ചെയ്തു; അതിന്റെ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: קֶטֶב מְרִירִי
  choice: കൊടിയ നാശത്തിന് ഇരയായി
  rationale: קֶטֶב വിനാശകരമായ ബാധയെയോ നാശത്തെയോ സൂചിപ്പിക്കുന്നു; מְרִירִי അതിന്റെ കാഠിന്യം ശക്തിപ്പെടുത്തുന്നു. മലയാളത്തിൽ സ്വാഭാവികവും ആവർത്തനമില്ലാത്തതുമായ പ്രയോഗമാണ് ‘കൊടിയ നാശം’.
- source_word: שֶׁן בְּהֵמוֹת
  choice: മൃഗങ്ങളുടെ ദംഷ്ട്രകൾ
  rationale: שֶׁן അക്ഷരാർഥത്തിൽ പല്ല്/പല്ലുകൾ എന്നാണെങ്കിലും, ആക്രമിക്കുന്ന മൃഗങ്ങളുടെ ഭീഷണി ‘ദംഷ്ട്രകൾ’ വ്യക്തമായി പകർന്നു നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: אֲשַׁלַּח בָּם
  choice: ഞാൻ അവരുടെ നേരെ അയയ്ക്കും
  rationale: בָּם ഇവിടെ ശിക്ഷയായി അവരുടെമേൽ അഥവാ അവർക്കെതിരായി അയയ്ക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘അവരുടെ നേരെ’ ശത്രുതാപരമായ ദിശ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: חֲמַת זֹחֲלֵי עָפָר
  choice: മണ്ണിൽ ഇഴയുന്ന ജീവികളുടെ വിഷം
  rationale: ഇഴജന്തുക്കളുടെ സന്ദർഭത്തിൽ חֲמַת ‘ക്രോധം’ എന്നതിലുപരി വിഷത്തെ സൂചിപ്പിക്കുന്നു. זֹחֲלֵי עָפָר സർപ്പങ്ങളിൽ മാത്രം ഒതുങ്ങാത്ത വിശാലമായ പ്രയോഗമായതിനാൽ അതിന്റെ വ്യാപ്തി നിലനിർത്തി.
theological_decisions:
- issue: רֶשֶׁף എന്ന പദത്തിന്റെ സാധ്യതയുള്ള പുരാണപശ്ചാത്തലം
  choice: പ്രധാന പാഠത്തിൽ പൊതുനാമമായ ‘മഹാമാരി’
  alternative: പുരാതന സമീപപൂർവദേശത്ത് മഹാമാരിയുമായി ബന്ധപ്പെട്ടിരുന്ന ‘റെശെഫ്’ എന്ന ദേവനാമം; അല്ലെങ്കിൽ ‘കത്തുന്ന പനി’
  rationale: ഉടമ്പടി-ശാപങ്ങളുടെ കാവ്യാത്മക പട്ടികയിൽ ഈ പദം ഒരു വിനാശകരമായ ബാധയായി പ്രവർത്തിക്കുന്നു. അതിനാൽ ദേവനാമം പ്രധാന പാഠത്തിലേക്ക് കൊണ്ടുവരാതെ, യഥാർഥമായ ശാബ്ദിക-ചരിത്രപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കാവ്യഗദ്യം. ആദ്യ പാദത്തിലെ എബ്രായ പങ്ക്തിരൂപങ്ങൾ മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ‘അവർ തീരും’ എന്നതോടെ പൂർത്തിയാക്കി. സമാന്തര ദുരന്തപ്പട്ടികയുടെ താളവും ദൈവിക ന്യായവിധിയുടെ ശക്തിയും നിലനിർത്തിയിരിക്കുന്നു.
