source:
  edition: WLC
  text: יַעֲרֹ֤ף כַּ/מָּטָר֙ לִקְחִ֔/י תִּזַּ֥ל כַּ/טַּ֖ל אִמְרָתִ֑/י כִּ/שְׂעִירִ֣ם עֲלֵי דֶ֔שֶׁא וְ/כִ/רְבִיבִ֖ים עֲלֵי עֵֽשֶׂב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/002.yaml
  text: May my teaching fall like the rain[a]; may my speech drip like the dew, like showers upon the tender grass[b], and like abundant rain upon the green plants.
translation:
  language: ml
  text: എന്റെ ഉപദേശം മഴപോലെ വീഴട്ടെ[a]; എന്റെ വചനം മഞ്ഞുപോലെ ഇറ്റുവീഴട്ടെ; പുല്ലിന്മേൽ ചാറ്റൽമഴപോലെയും[b] സസ്യങ്ങളിന്മേൽ സമൃദ്ധമായ മഴപോലെയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “തുള്ളികളായി വീഴട്ടെ” എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായ ക്രിയ ഉപദേശം മഴപോലെ താഴേക്കു പതിക്കുന്നതായി ചിത്രീകരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “ചാറ്റൽമഴ” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന അപൂർവ എബ്രായപദം നേർത്ത മഴയെയോ മഴത്തുള്ളികളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲרֹף
  choice: പെയ്തിറങ്ങട്ടെ
  rationale: മഴത്തുള്ളികളായി താഴേക്കു പതിക്കുന്ന ദൃശ്യം ഈ കാവ്യസന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; സാങ്കേതികമോ പഴഞ്ചനോ ആയ പ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: לִקְחִי
  choice: എന്റെ ഉപദേശം
  rationale: സ്വീകരിക്കുകയോ നൽകുകയോ ചെയ്യുന്ന ബോധനത്തെ സൂചിപ്പിക്കുന്നു; മോശെയുടെ പ്രഭാഷണസന്ദർഭത്തിനും സമാന്തരഘടനയ്ക്കും യോജിക്കുന്നു.
- source_word: תִּזַּל
  choice: തുള്ളിവീഴട്ടെ
  rationale: ഒഴുകുക, ഇറ്റിവീഴുക എന്നീ അർഥസാധ്യതകളിൽ മഞ്ഞിന്റെ സൗമ്യമായ പതനദൃശ്യം നിലനിർത്തുന്നു.
- source_word: אִמְרָתִי
  choice: എന്റെ വാക്കുകൾ
  rationale: വചനം, ഉച്ചാരണം, സംസാരം എന്ന അർഥവ്യാപ്തിയുള്ള പദം; മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചനപ്രയോഗം സമഗ്രമായ സംസാരത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: שְׂעִירִם
  choice: ചാറ്റൽമഴ
  rationale: അപൂർവവും അർഥവിവാദമുള്ളതുമായ പദത്തിന് ഈ സന്ദർഭത്തിൽ നേർത്ത മഴയെയോ മഴത്തുള്ളികളെയോ സൂചിപ്പിക്കുന്ന വ്യക്തവും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: דֶשֶׁא
  choice: ഇളംപുല്ല്
  rationale: പുതുതായി മുളച്ച സസ്യവളർച്ചയെയോ ഇളംപുല്ലിനെയോ സൂചിപ്പിക്കുന്നതിനാൽ അതിന്റെ മൃദുവായ വളർച്ചാഭാവം നിലനിർത്തുന്നു.
- source_word: רְבִיבִים
  choice: സമൃദ്ധമായ മഴ
  rationale: ധാരാളമായ മഴയെയോ ശക്തമായ മഴച്ചൊരിച്ചിലുകളെയോ സൂചിപ്പിക്കുന്നു; നേർത്ത ചാറ്റൽമഴയിൽനിന്ന് കൂടുതൽ സമൃദ്ധമായ മഴയിലേക്കുള്ള കാവ്യപുരോഗതി നിലനിർത്തുന്നു.
- source_word: עֵשֶׂב
  choice: പച്ചച്ചെടികൾ
  rationale: പുല്ലിൽ മാത്രം ഒതുങ്ങാത്ത സസ്യങ്ങളെയോ പച്ചിലച്ചെടികളെയോ സൂചിപ്പിക്കുന്നു; മുൻപുള്ള דֶשֶׁאയിൽനിന്നുള്ള വ്യത്യാസവും വായനാസൗകര്യവും നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കാവ്യഭാഷ ഉപയോഗിച്ചു. മഴ, മഞ്ഞ്, ചാറ്റൽമഴ, സമൃദ്ധമായ മഴ എന്നീ ദൃശ്യങ്ങളുടെ സമാന്തരതയും തീവ്രതയിലെ പുരോഗതിയും സംരക്ഷിച്ചു; അപൂർവപദത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
