source:
  edition: WLC
  text: זְכֹר֙ יְמ֣וֹת עוֹלָ֔ם בִּ֖ינוּ שְׁנ֣וֹת דּוֹר וָ/ד֑וֹר שְׁאַ֤ל אָבִ֨י/ךָ֙ וְ/יַגֵּ֔דְ/ךָ זְקֵנֶ֖י/ךָ וְ/יֹ֥אמְרוּ לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/007.yaml
  text: Remember the days of old[a]; consider the years of generation after generation. Ask your father, and he will tell you, your elders[b], and they will say to you.
translation:
  language: ml
  text: പുരാതനകാലത്തെ നാളുകൾ ഓർക്കുക; തലമുറതലമുറകളുടെ വർഷങ്ങളെക്കുറിച്ചു ചിന്തിക്കുക.[a] നിന്റെ പിതാവിനോടു ചോദിക്കുക; അവൻ നിനക്കു പറഞ്ഞുതരും; നിന്റെ മൂപ്പന്മാരോടും—അവർ നിന്നോടു പറയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രുവിൽ അക്ഷരാർഥം: “തലമുറയുടെയും തലമുറയുടെയും വർഷങ്ങൾ”; തുടർച്ചയായി വന്ന തലമുറകളെ സൂചിപ്പിക്കുന്ന പ്രയോഗം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: ഓർക്കുക
  rationale: זכר എന്ന ധാതുവിന്റെ ഖാൽ ആജ്ഞാരൂപം; കഴിഞ്ഞകാലത്തെ മനസ്സിലേക്കു കൊണ്ടുവരാനുള്ള നേരിട്ടുള്ള ആഹ്വാനം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יְמוֹת עוֹלָם
  choice: പുരാതനകാലത്തെ നാളുകൾ
  rationale: ദീർഘമായ ഭൂതകാലത്തെയോ പ്രാചീനകാലത്തെയോ സൂചിപ്പിക്കുന്ന ഹീബ്രു സംയുക്തപ്രയോഗത്തിന്റെ അർഥവും ഗൗരവവും നിലനിർത്തുന്നു.
- source_word: בִּינוּ
  choice: ചിന്തിക്കുക
  rationale: בין ഇവിടെ വെറും ബൗദ്ധികമായി ‘മനസ്സിലാക്കുക’ എന്ന ഫലത്തേക്കാൾ, ചരിത്രത്തെ വിവേചനത്തോടെ പരിഗണിക്കാനുള്ള ആഹ്വാനമാണ്; ‘ചിന്തിക്കുക’ മലയാളത്തിൽ ഈ പ്രവൃത്തിയെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: שְׁנוֹת דּוֹר וָדֹר
  choice: തലമുറതലമുറകളിലെ വർഷങ്ങൾ
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘തലമുറയും തലമുറയും’ എന്ന വിതരണാത്മക ഹീബ്രു പ്രയോഗത്തെ മലയാളത്തിലെ സ്വാഭാവിക ആവർത്തനരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: שְׁאַל
  choice: ചോദിക്കുക
  rationale: שאל എന്ന ലളിതമായ ആജ്ഞാരൂപത്തിന് നേരിട്ടും സാധാരണവുമായ തുല്യപദം.
- source_word: אָבִיךָ
  choice: നിന്റെ പിതാവ്
  rationale: രണ്ടാംപുരുഷ ഏകവചന പ്രത്യയത്തോടുകൂടിയ ഈ നാമത്തിന്റെ പ്രാഥമിക അർഥം ‘നിന്റെ പിതാവ്’ എന്നതാണ്; വിശാലമായ പൂർവികാർഥം മുഖ്യവാചകത്തിൽ നിർബന്ധിച്ചിട്ടില്ല.
- source_word: וְיַגֵּדְךָ
  choice: അവൻ നിനക്കു പറഞ്ഞുതരും
  rationale: נגד എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം അറിയിക്കുകയോ പറഞ്ഞുകൊടുക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; ഭാവിസ്വഭാവവും സ്വാഭാവിക മലയാളവും ഈ രൂപം കൈവരിക്കുന്നു.
- source_word: זְקֵנֶיךָ
  choice: നിന്റെ മൂപ്പന്മാർ
  rationale: കേവലം പ്രായമായ പുരുഷന്മാരെയല്ല, സമൂഹത്തിലെ പ്രായവും പരിചയവുമുള്ള മുതിർന്നവരെയും സൂചിപ്പിക്കുന്നതിനാൽ ‘മൂപ്പന്മാർ’ യോജിക്കുന്നു.
- source_word: וְיֹאמְרוּ לָךְ
  choice: അവർ നിന്നോടു പറയും
  rationale: אמר എന്ന സാധാരണ ‘പറയുക’ എന്ന ക്രിയയെ മുൻവരിയിലെ נגד-യിൽനിന്ന് വേർതിരിച്ചുനിർത്തി ഹീബ്രു സമാന്തരഘടനയിലെ ചെറിയ പദവ്യത്യാസം സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്കു വ്യക്തവുമായ ശൈലി. ഏകവചന അഭിസംബോധനയായ ‘നിന്റെ/നിനക്കു’ നിലനിർത്തി. ഹീബ്രുവിലെ സമാന്തരഘടനയും ആജ്ഞാരൂപങ്ങളുടെ ഊന്നലും പരമാവധി സംരക്ഷിച്ചു.
