language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הֵ֚ם קִנְא֣וּ/נִי בְ/לֹא אֵ֔ל כִּעֲס֖וּ/נִי בְּ/הַבְלֵי/הֶ֑ם וַ/אֲנִי֙ אַקְנִיאֵ֣/ם בְּ/לֹא עָ֔ם בְּ/ג֥וֹי נָבָ֖ל אַכְעִיסֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/021.yaml
  text: They made me jealous with what is not a god[a]; they provoked me to anger with their idols. So I will make them jealous with those who are not a people[c][b]; I will provoke them to anger with a foolish nation.
translation:
  language: ml
  text: ദൈവമല്ലാത്തതിനെക്കൊണ്ട് അവർ എന്നെ അസൂയപ്പെടുത്തി; അവരുടെ വിഗ്രഹങ്ങളാൽ[a] അവർ എന്നെ കോപിപ്പിച്ചു. ഞാനോ ജനമല്ലാത്ത ഒരു ജനത്തെക്കൊണ്ട്[b] അവരെ അസൂയപ്പെടുത്തും; മൂഢമായ ഒരു ജനതയെക്കൊണ്ട്[c] അവരെ കോപിപ്പിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവരുടെ വ്യർഥവസ്തുക്കളാൽ’ അല്ലെങ്കിൽ ‘അവരുടെ മായകളാൽ’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദം ശൂന്യതയെയും വ്യർഥതയെയും സൂചിപ്പിക്കുകയും ഈ സന്ദർഭത്തിൽ വിഗ്രഹങ്ങളെ ഉദ്ദേശിക്കുകയും ചെയ്യുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തോട് അടുത്തതായി ‘ജനമല്ലാത്ത ഒരു ജനത്തെക്കൊണ്ട്’; ഇത് ‘ദൈവമല്ലാത്തത്’ എന്ന മുൻപ്രയോഗത്തോടുള്ള മനപ്പൂർവമായ സമാന്തരമാണ്.
    reason: lexical_alternative
  - marker: c
    text: ഇവിടെ ‘മൂഢമായ’ എന്നത് വെറും ബുദ്ധിക്കുറവല്ല, ധാർമികവും ആത്മീയവുമായ മൂഢതയാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: קִנְאוּנִי
  choice: അവർ എന്നെ അസൂയപ്പെടുത്തി
  rationale: കנא എന്ന ക്രിയയുടെ അസൂയ/തീക്ഷ്ണത ഉണർത്തുക എന്ന കാരകഭാവം നിലനിർത്തുന്നു; പിന്നീടുള്ള אַקְנִיאֵם എന്ന പ്രയോഗവുമായുള്ള പ്രതികാരാത്മക സമാന്തരതയും സംരക്ഷിക്കുന്നു.
- source_word: בְּלֹא אֵל
  choice: ദൈവമല്ലാത്തതുകൊണ്ട്
  rationale: യഥാർഥ ദൈവത്തോടുള്ള കുത്തുള്ള വൈരുധ്യം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; ഒരു പ്രത്യേക വ്യാജദൈവത്തെ നിർവചിക്കുന്നില്ല.
- source_word: כִּעֲסוּנִי
  choice: അവർ എന്നെ കോപിപ്പിച്ചു
  rationale: ഹിഫീൽ രൂപത്തിലെ ‘കോപത്തിന് ഇടയാക്കുക’ എന്ന കാരകഭാവം ലളിതവും നേരിട്ടുമുള്ള മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: בְּהַבְלֵיהֶם
  choice: അവരുടെ വ്യർഥവിഗ്രഹങ്ങളാൽ
  rationale: הבל എന്നതിലെ വ്യർഥത/ശൂന്യത എന്ന മൂല്യനിർണയവും സന്ദർഭത്തിലെ വിഗ്രഹസൂചനയും ഒരുമിച്ചു പ്രകടമാക്കുന്നു; പദത്തിന്റെ രൂപകപരമായ വ്യാപ്തി അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: אַקְנִיאֵם
  choice: ഞാൻ അവരെ അസൂയപ്പെടുത്തും
  rationale: ആദ്യപാദത്തിലെ അതേ ധാതുവുമായുള്ള മനപ്പൂർവമായ സമാന്തരതയും ദൈവിക പ്രതിഫലനത്തിന്റെ ഘടനയും നിലനിർത്തുന്നു.
- source_word: בְּלֹא עָם
  choice: ജനമല്ലാത്തവരെക്കൊണ്ട്
  rationale: ‘ദൈവമല്ലാത്തത്’ എന്ന മുൻപ്രയോഗത്തോടുള്ള ഉദ്ദേശ്യപൂർവമായ സമാന്തരത മലയാളത്തിൽ വായനാസൗകര്യത്തോടെ സംരക്ഷിക്കുന്നു.
- source_word: בְּגוֹי נָבָל
  choice: വിവേകമില്ലാത്ത ഒരു ജനതയെക്കൊണ്ട്
  rationale: נבל സൂചിപ്പിക്കുന്ന ധാർമിക-ആത്മീയ മൂഢതയെ വെറും ബുദ്ധിക്കുറവായി ചുരുക്കാതെ പ്രകടമാക്കുന്നു.
- source_word: אַכְעִיסֵם
  choice: ഞാൻ അവരെ കോപിപ്പിക്കും
  rationale: മുൻപത്തെ כִּעֲסוּנִי എന്ന കാരകക്രിയയോടുള്ള പരസ്പരസമാന്തരത കൃത്യമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘ജനമല്ലാത്തവർ’, ‘വിവേകമില്ലാത്ത ജനത’ എന്നിവയുടെ ചരിത്രപരമായ സൂചിതർ
  choice: പ്രധാനപാഠത്തിൽ പൊതുവായ പ്രയോഗമായി നിലനിർത്തി.
  alternative: ഒരു പ്രത്യേക ജാതി, ജാതികൾ പൊതുവിൽ, അല്ലെങ്കിൽ നിന്ദ്യമായ ഒരു ജനത എന്നിങ്ങനെ തിരിച്ചറിയുക.
  rationale: എബ്രായപാഠം ഒരു പ്രത്യേക ജനതയെ പേരെടുത്ത് പറയുന്നില്ല; അതിനാൽ പിന്നീടുള്ള വ്യാഖ്യാനം വിവർത്തനത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതെ വാചകത്തിലെ അനിശ്ചിതത്വവും ന്യായവിധിയുടെ ശക്തിയും നിലനിർത്തുന്നു.
- issue: נָבָל എന്നതിലെ ‘മൂഢത’യുടെ സ്വഭാവം
  choice: ‘വിവേകമില്ലാത്ത’ എന്ന് നൽകി ധാർമിക-ആത്മീയ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: ‘മൂഢമായ’ അല്ലെങ്കിൽ ‘നിന്ദ്യമായ’.
  rationale: ഇത് കേവല ബുദ്ധിശേഷിക്കുറവെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുകയും മൂലത്തിലെ ധാർമിക വിലയിരുത്തൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. രണ്ട് കാരകക്രിയാജോടികളിലെയും പ്രതികാരാത്മക സമാന്തരത സൂക്ഷിച്ചു. ‘വ്യർഥവിഗ്രഹങ്ങൾ’ എന്ന സംയുക്തപ്രയോഗം മൂലപദത്തിന്റെ വിലയിരുത്തലും സന്ദർഭത്തിലെ സൂചിതവസ്തുവും ഒരുമിച്ചു നൽകുന്നു.
