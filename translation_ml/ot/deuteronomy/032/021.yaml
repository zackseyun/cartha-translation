revisions:
- from: ദൈവമല്ലാത്തതുകൊണ്ട് അവർ എന്നെ അസൂയപ്പെടുത്തി; അവരുടെ വ്യർഥവിഗ്രഹങ്ങളാൽ[a] അവർ എന്നെ കോപിപ്പിച്ചു. അതുകൊണ്ട് ജനമല്ലാത്തവരെക്കൊണ്ട്[b] ഞാൻ അവരെ അസൂയപ്പെടുത്തും; വിവേകമില്ലാത്ത ഒരു ജനതയെക്കൊണ്ട്[c] ഞാൻ അവരെ കോപിപ്പിക്കും.
  to: ദൈവമല്ലാത്തതിനെക്കൊണ്ട് അവർ എന്നെ അസൂയപ്പെടുത്തി; അവരുടെ വിഗ്രഹങ്ങളാൽ[a] അവർ എന്നെ കോപിപ്പിച്ചു. ഞാനോ ജനമല്ലാത്ത ഒരു ജനത്തെക്കൊണ്ട്[b] അവരെ അസൂയപ്പെടുത്തും; മൂഢമായ ഒരു ജനതയെക്കൊണ്ട്[c] അവരെ കോപിപ്പിക്കും.
  rationale: The revision corrects the instrumental sense of בְּלֹא אֵל, retains the reciprocal verbal pattern, and renders the singular rhetorical expression בְּלֹא עָם more closely. It also strengthens the translation of נָבָל to retain its moral-spiritual force, without specifying any historical referent for the nation.
