  source_fidelity: 'The Malayalam accurately represents both Hebrew cola: ‘അനർഥങ്ങൾ കുന്നുകൂട്ടും’ conveys the Hiphil accumulation idiom of אַסְפֶּה ... רָעוֹת, and ‘എന്റെ അമ്പുകൾ അവർക്കെതിരെ പ്രയോഗിച്ചുതീർക്കും’ preserves the metaphor and exhaustive force of חִצַּי אֲכַלֶּה בָּם. ‘അനർഥങ്ങൾ’ appropriately denotes harmful calamities rather than moral evil.'
