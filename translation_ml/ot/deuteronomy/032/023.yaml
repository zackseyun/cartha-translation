id: DEU.32.23
reference: Deuteronomy 32:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אַסְפֶּ֥ה עָלֵ֖י/מוֹ רָע֑וֹת חִצַּ֖/י אֲכַלֶּה בָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/023.yaml
  text: I will heap disasters upon them[b][a]; I will use up my arrows against them.
translation:
  language: ml
  text: അവരുടെമേൽ ഞാൻ അനർഥങ്ങൾ കുന്നുകൂട്ടും[a]; എന്റെ അമ്പുകൾ അവർക്കെതിരെ പ്രയോഗിച്ചുതീർക്കും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദുരന്തങ്ങൾ’; അക്ഷരാർഥത്തിൽ ‘തിന്മകൾ’—ഇവിടെ ധാർമിക തിന്മയല്ല, ദോഷകരമായ ന്യായവിധികളാണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘എന്റെ അമ്പുകൾ അവരുടെമേൽ ചെലവഴിച്ചുതീർക്കും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אַסְפֶּה
  choice: കുന്നുകൂട്ടും
  rationale: ഹിഫീൽ രൂപം ഇവിടെ അനർഥങ്ങൾ അവരുടെമേൽ ഒന്നിനുമേൽ ഒന്നായി വരുത്തുന്ന സഞ്ചയഭാവം നൽകുന്നു. ‘കുന്നുകൂട്ടും’ ആ ശക്തമായ കാവ്യചിത്രം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עָלֵימוֹ
  choice: അവരുടെമേൽ
  rationale: עַל എന്ന പൂർവപ്രത്യയം അനർഥങ്ങൾ ജനത്തിന്മേൽ പതിക്കുന്ന സ്ഥലപരവും രൂപകപരവുമായ ആശയം നൽകുന്നു.
- source_word: רָעוֹת
  choice: അനർഥങ്ങൾ
  rationale: ന്യായവിധിയുടെ ഈ സന്ദർഭത്തിൽ പദം ധാർമിക തിന്മയെക്കാൾ ദോഷകരമായ സംഭവങ്ങളെയോ വിപത്തുകളെയോ സൂചിപ്പിക്കുന്നു. ‘അനർഥങ്ങൾ’ അതിന്റെ വ്യാപ്തിയും ഗൗരവവും നിലനിർത്തുന്നു.
- source_word: חִצַּי
  choice: എന്റെ അമ്പുകൾ
  rationale: ആദ്യപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയത്തോടുകൂടിയ ബഹുവചനനാമത്തിന്റെ യുദ്ധരൂപകം അക്ഷരാർഥത്തിൽ നിലനിർത്തി.
- source_word: אֲכַלֶּה
  choice: പ്രയോഗിച്ചുതീർക്കും
  rationale: പീയേൽ ക്രിയ ഇവിടെ മുഴുവനായി ചെലവഴിക്കുക, ശേഷിക്കാത്തവിധം ഉപയോഗിക്കുക എന്ന അർഥം നൽകുന്നു. അമ്പുകളോടൊപ്പം ‘പ്രയോഗിച്ചുതീർക്കും’ എന്നത് ഈ സമ്പൂർണത സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: בָּם
  choice: അവർക്കെതിരെ
  rationale: בְּ ഇവിടെ അമ്പുകളുടെ ലക്ഷ്യത്തെയോ ശത്രുതാപരമായ ദിശയെയോ സൂചിപ്പിക്കുന്നു; ‘അവർക്കെതിരെ’ യുദ്ധചിത്രം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ദൈവിക ന്യായവിധിയുടെ സന്ദർഭത്തിൽ רָעוֹת എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: അനർഥങ്ങൾ
  alternative: തിന്മകൾ / ദുരന്തങ്ങൾ
  rationale: എബ്രായപദത്തിന് വിശാലമായി ‘തിന്മകൾ’ എന്ന അർഥമുണ്ടെങ്കിലും ഇവിടെ അത് ദൈവം വരുത്തുന്ന ദോഷകരമായ ന്യായവിധികളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘അനർഥങ്ങൾ’ എന്ന പരിഭാഷ ദൈവം ധാർമിക തിന്മ ചെയ്യുന്നു എന്ന അനാവശ്യ സൂചന ഒഴിവാക്കുകയും മൂലപാഠത്തിലെ വിധിയുടെ കാഠിന്യം നിലനിർത്തുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കാവ്യഭാഷയാണ് ഉപയോഗിച്ചത്. ‘കുന്നുകൂട്ടും’ എന്നത് സഞ്ചയത്തിന്റെ ദൃശ്യശക്തിയും ‘പ്രയോഗിച്ചുതീർക്കും’ എന്നത് അമ്പുകൾ പൂർണമായി ചെലവാകുന്ന ആശയവും സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
