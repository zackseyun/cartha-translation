source:
  edition: WLC
  text: וַ/יְדַבֵּ֤ר יְהוָה֙ אֶל מֹשֶׁ֔ה בְּ/עֶ֛צֶם הַ/יּ֥וֹם הַ/זֶּ֖ה לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/048.yaml
  text: And Yahweh spoke to Moses on that very day[a], saying,
translation:
  language: ml
  text: 'ആ ദിവസംതന്നെ യഹ്‌വെ[a] മോശയോട് ഇപ്രകാരം പറഞ്ഞു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായം: YHWH (יהוה); പരമ്പരാഗതമായി “കർത്താവ്” എന്നു പരിഭാഷപ്പെടുത്തുന്നു. “യഹോവ” എന്ന രൂപവും ഉപയോഗത്തിലുണ്ട്.'
    reason: ദൈവനാമത്തിന്റെ മൂലരൂപവും പ്രചാരത്തിലുള്ള മറ്റു അവതരണങ്ങളും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: പറഞ്ഞു
  rationale: കഥാവിവരണത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്ന സാധാരണ സംസാരക്രിയയായി പരിഭാഷപ്പെടുത്തി. തുടർന്നുള്ള לֵאמֹר-നോടു ചേർത്ത് ‘ഇപ്രകാരം പറഞ്ഞു’ എന്ന സ്വാഭാവിക മലയാള പ്രയോഗമാക്കി.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ, സാധാരണയായി പുനർനിർമിക്കപ്പെടുന്ന ഉച്ചാരണത്തിന് അനുയോജ്യമായി മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: אֶל־מֹשֶׁה
  choice: മോശയോട്
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും ആധുനികവുമായ മലയാള രൂപം.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: ആ ദിവസംതന്നെ
  rationale: പദശഃ ‘ഈ ദിവസത്തിന്റെ സത്തയിൽ’ എന്നതല്ല, കൃത്യമായ അതേ ദിവസത്തെ ഊന്നിപ്പറയുന്ന എബ്രായ ശൈലിയാണ്. മലയാള കഥാവിവരണത്തിൽ ‘ആ ദിവസംതന്നെ’ ഈ ഊന്നൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לֵאמֹר
  choice: ഇപ്രകാരം
  rationale: തുടരാനിരിക്കുന്ന നേരിട്ടുള്ള വാക്കുകളെ പരിചയപ്പെടുത്തുന്ന എബ്രായ സൂത്രവാക്യം. ‘പറഞ്ഞു’ എന്ന ക്രിയയോടു ചേർന്ന് ‘ഇപ്രകാരം പറഞ്ഞു:’ എന്നു നൽകുന്നത് മലയാളത്തിൽ സ്വാഭാവികമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ഒരു സ്ഥാനപ്പേരല്ല, YHWH എന്ന വ്യക്തിനാമമാണ് ഉള്ളത്. അതിനാൽ ആ പേര് നിലനിർത്തി; പരമ്പരാഗതവും മറ്റൊരു ലിപ്യന്തരണവുമായ രൂപങ്ങൾ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളം. ‘ആ ദിവസംതന്നെ’ സമയത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു; തുടർന്നുള്ള നേരിട്ടുള്ള വാക്കുകൾക്കായി വാക്യം ദ്വിബിന്ദുവിൽ അവസാനിപ്പിക്കുന്നു.
