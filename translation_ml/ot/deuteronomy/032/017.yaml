language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: יִזְבְּח֗וּ לַ/שֵּׁדִים֙ לֹ֣א אֱלֹ֔הַ אֱלֹהִ֖ים לֹ֣א יְדָע֑וּ/ם חֲדָשִׁים֙ מִ/קָּרֹ֣ב בָּ֔אוּ לֹ֥א שְׂעָר֖וּ/ם אֲבֹתֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/017.yaml
  text: They sacrificed to demons[a], not God, to gods they had not known, new ones that had recently come[c][b], whom your fathers had not feared.
translation:
  language: ml
  text: അവർ ഭൂതങ്ങൾക്കു ബലിയർപ്പിച്ചു, ദൈവത്തിനല്ല[a]—അവർ അറിയാതിരുന്ന ദേവന്മാർക്കു, അടുത്തിടെ വന്ന പുതിയ ദേവന്മാർക്കു[b], നിങ്ങളുടെ പിതാക്കന്മാർ ഭയപ്പെട്ടിട്ടില്ലാത്തവർക്കു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരു ദൈവത്തിനല്ല.’ ഈ സത്തകൾ യഥാർഥത്തിൽ ദൈവങ്ങളല്ലെന്ന് എബ്രായപ്രയോഗം നിഷേധിക്കുന്നതായി വായിക്കാം; എന്നാൽ സന്ദർഭത്തിൽ അവ ഇസ്രായേലിന്റെ സത്യദൈവത്തോടാണ് പ്രത്യേകമായി വിരുദ്ധമായി നിർത്തപ്പെടുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘പുതിയവർ; സമീപത്തുനിന്ന് അവർ വന്നു.’ അതായത്, അടുത്തിടെ വന്നതോ പുതുതായി പരിചയപ്പെടുത്തിയതോ ആയ ദേവന്മാർ.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘ആരുടെ മുമ്പിൽ നിങ്ങളുടെ പിതാക്കന്മാർ വിറച്ചിട്ടില്ലയോ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזְבְּחוּ
  choice: ബലിയർപ്പിച്ചു
  rationale: זבח എന്ന ക്രിയയുടെ യാഗാർപ്പണസംബന്ധമായ അർഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לַשֵּׁדִים
  choice: ഭൂതങ്ങൾക്ക്
  rationale: שֵׁדִים സൂചിപ്പിക്കുന്ന ദുഷ്ടാത്മീയ സത്തകൾക്ക് ആധുനിക മലയാളത്തിൽ സാധാരണ വായനക്കാർക്കു വ്യക്തമായ തത്തുല്യപദം.
- source_word: לֹא אֱלֹהַ
  choice: ദൈവത്തിനല്ല
  rationale: ബലി സ്വീകരിച്ച ഭൂതങ്ങളെ ഇസ്രായേലിന്റെ സത്യദൈവത്തോടു വിരുദ്ധമായി നിർത്തുന്ന എബ്രായ വാക്യത്തിന്റെ പ്രഹരശക്തി നിലനിർത്തുന്നു; അനിശ്ചിതമായ ‘ഒരു ദൈവമല്ല’ എന്ന വായന അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: אֱלֹהִים
  choice: ദേവന്മാർക്ക്
  rationale: മുമ്പുള്ള ‘ഭൂതങ്ങൾ’ എന്നതിനെ വിശദീകരിക്കുന്ന ബഹുവചനപ്രയോഗം നിലനിർത്തുകയും വ്യാജാരാധനയുടെ ലക്ഷ്യങ്ങളെ ദേവന്മാർ എന്നു വിളിക്കുന്ന മൂലപാഠത്തിലെ സംഘർഷം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: לֹא יְדָעוּם
  choice: അവർ അറിയാത്ത
  rationale: ידע എന്ന ക്രിയയുടെ അടിസ്ഥാനമായ ‘അറിയുക’ എന്ന അർഥവും മുൻകാലത്തെ പരിചയമില്ലായ്മയും മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: חֲדָשִׁים
  choice: പുതിയ ദേവന്മാർക്ക്
  rationale: നാമവൽക്കരിച്ച വിശേഷണത്തിന്റെ സൂചന മുൻപുള്ള ‘ദേവന്മാർ’ ചേർത്ത് മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാക്കുന്നു.
- source_word: מִקָּרֹב בָּאוּ
  choice: അടുത്തകാലത്തു വന്ന
  rationale: ഇവിടെ സ്ഥലപരമായ സമീപ്യതയെക്കാൾ അടുത്തിടെ വന്നതെന്ന കാലസൂചനയാണ് പ്രസക്തം.
- source_word: לֹא שְׂעָרוּם
  choice: ഭയപ്പെട്ടിട്ടില്ലാത്തവർക്ക്
  rationale: ഈ സന്ദർഭത്തിൽ שער/שׂער ഭയഭക്തിയെയോ വിറയലിനെയോ സൂചിപ്പിക്കുന്നു; ‘ഭയപ്പെട്ടിട്ടില്ലാത്ത’ എന്നത് വ്യാഖ്യാനഭാരം കൂട്ടാതെ സ്വാഭാവികമായി അർഥം നൽകുന്നു.
- source_word: אֲבֹתֵיכֶם
  choice: നിങ്ങളുടെ പിതാക്കന്മാർ
  rationale: മൂലപാഠത്തിലെ വ്യക്തമായ പുല്ലിംഗ ബഹുവചനത്തെ പൊതുവായ ‘പൂർവികർ’ എന്നു നിഷ്പക്ഷമാക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘ഭൂതങ്ങൾ’ എന്നും ‘ദേവന്മാർ’ എന്നും വിളിക്കപ്പെടുന്നവ തമ്മിലുള്ള ബന്ധം
  choice: രണ്ടു പദങ്ങളും അനുക്രമമായി നിലനിർത്തി, ‘ഭൂതങ്ങൾക്കാണു… ദേവന്മാർക്ക്’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ആവർത്തനം ഒഴിവാക്കി ‘ഭൂതങ്ങളായ ദേവന്മാർക്ക്’ എന്നു മാത്രം നൽകുക.
  rationale: മൂലപാഠം שֵׁדִים, אֱלֹהִים എന്നീ പദങ്ങൾ മനപ്പൂർവം അടുക്കിവയ്ക്കുകയും അതോടൊപ്പം അവ ദൈവമല്ലെന്നു നിഷേധിക്കുകയും ചെയ്യുന്നു. രണ്ടും നിലനിർത്തുന്നത് ആ ദൈവശാസ്ത്രപരമായ സംഘർഷത്തെ വിശദീകരിച്ചുതീർക്കാതെ സംരക്ഷിക്കുന്നു.
- issue: לֹא אֱלֹהַ എന്നതിലെ ദൈവസൂചന
  choice: ‘ദൈവത്തിനല്ല’ എന്നു നൽകി സത്യദൈവത്തോടുള്ള വിരോധം പ്രകടമാക്കി.
  alternative: ‘ഒരു ദൈവത്തിനല്ല’ അല്ലെങ്കിൽ ‘ദൈവമല്ലാത്തവയ്ക്ക്’ എന്നു നൽകുക.
  rationale: സന്ദർഭം ഇസ്രായേലിന്റെ ദൈവത്തെയും അന്യാരാധനയുടെ ലക്ഷ്യങ്ങളെയും തമ്മിൽ നേരിട്ട് വിരുദ്ധമായി നിർത്തുന്നു. എങ്കിലും എബ്രായത്തിന്റെ അനിശ്ചിത വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘ഭൂതങ്ങൾ,’ ‘ദൈവം,’ ‘ദേവന്മാർ’ എന്നീ വ്യത്യസ്ത മൂലപദങ്ങൾ നിലനിർത്തിയിട്ടുണ്ട്. ദീർഘവാക്യത്തിലെ അപോസിഷൻ വ്യക്തമാക്കാൻ ദീർഘവിരാമചിഹ്നം ഉപയോഗിച്ചെങ്കിലും എബ്രായത്തിലെ ആവർത്തനവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും ലഘൂകരിച്ചിട്ടില്ല.
