source:
  edition: WLC
  text: כִּֽי אֶשָּׂ֥א אֶל שָׁמַ֖יִם יָדִ֑/י וְ/אָמַ֕רְתִּי חַ֥י אָנֹכִ֖י לְ/עֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/040.yaml
  text: For I lift up my hand to heaven and say[a], ‘As I live forever,’
translation:
  language: ml
  text: 'എന്തെന്നാൽ, ഞാൻ എന്റെ കൈ ആകാശത്തേക്ക് ഉയർത്തി ഇങ്ങനെ പറയുന്നു: ‘ഞാൻ എന്നേക്കും ജീവിക്കുന്നു എന്നാണേ,’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: എന്തെന്നാൽ
  rationale: മുൻപ്രഖ്യാപനത്തിന്റെ ഗൗരവമുള്ള അടിസ്ഥാനത്തെ പരിചയപ്പെടുത്തുന്ന കാരണസൂചക ബന്ധം നിലനിർത്തുന്നു.
- source_word: אֶשָּׂא
  choice: ഞാൻ ... ഉയർത്തി
  rationale: ശപഥം ചെയ്യുമ്പോൾ കൈ ഉയർത്തുന്ന മൂർത്തമായ ആംഗ്യം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֶל שָׁמַיִם
  choice: ആകാശത്തേക്ക്
  rationale: മുകളിലേക്കുള്ള ദിശ വ്യക്തമാക്കുകയും മലയാളത്തിലെ സ്വാഭാവിക ഏകവചനപ്രയോഗം സ്വീകരിക്കുകയും ചെയ്യുന്നു.
- source_word: יָדִי
  choice: എന്റെ കൈ
  rationale: എബ്രായത്തിലെ ഏകവചനം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וְאָמַרְתִּי
  choice: ഇങ്ങനെ പറയുന്നു
  rationale: രൂപപരമായി പൂർണകാലരൂപമാണെങ്കിലും ഇവിടെ ശപഥത്തിന്റെ നിർവഹണാത്മക തുടർച്ചയാണ്; വർത്തമാനകാല മലയാളം ആ ശക്തി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: חַי אָנֹכִי
  choice: ജീവിക്കുന്ന എന്നാണേ
  rationale: വെറും ജീവസ്ഥിതിയുടെ പ്രസ്താവനയായി ചുരുക്കാതെ, മലയാളത്തിലെ ‘ആണേ’ എന്ന ശപഥരൂപത്തിലൂടെ ദൈവിക സ്വശപഥത്തിന്റെ ശക്തി പകരുന്നു.
- source_word: לְעֹלָם
  choice: എന്നേക്കും
  rationale: അവസാനമില്ലാത്ത ദൈർഘ്യം സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ദൈവിക സ്വശപഥസൂത്രത്തിന്റെ ശക്തി ദുർബലമാക്കാതെ പരിഭാഷപ്പെടുത്തൽ
  choice: ‘എന്നേക്കും ജീവിക്കുന്ന എന്നാണേ’ എന്ന ശപഥരൂപം
  alternative: ‘ഞാൻ എന്നേക്കും ജീവിക്കുന്നു’
  rationale: എബ്രായം അക്ഷരാർഥത്തിൽ ജീവിച്ചിരിക്കുന്നതിനെ പ്രസ്താവിച്ചാലും സന്ദർഭത്തിൽ അത് സ്വശപഥമാണ്. തെരഞ്ഞെടുത്ത മലയാളരൂപം ‘ജീവിക്കുന്നു’ എന്ന സത്യവും ശപഥത്തിന്റെ ഗൗരവവും നിലനിർത്തുന്നു; അധിക സിദ്ധാന്തഭാഷ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കാവ്യ-ശപഥഭാഷ. ‘ജീവിക്കുന്ന എന്നാണേ’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ശപഥത്തിന്റെ പ്രവർത്തനശക്തി നൽകുന്നു; അടിക്കുറിപ്പ് പദാനുപദരൂപം സംരക്ഷിക്കുന്നു.
