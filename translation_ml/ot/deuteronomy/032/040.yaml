- from: 'എന്തെന്നാൽ, ഞാൻ എന്റെ കൈ ആകാശത്തേക്ക് ഉയർത്തി ഇങ്ങനെ പറയുന്നു: [a] ‘എന്നേക്കും ജീവിക്കുന്ന എന്നാണേ,’'
