reference: Deuteronomy 32:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּֽי יָדִ֤ין יְהוָה֙ עַמּ֔/וֹ וְ/עַל עֲבָדָ֖י/ו יִתְנֶחָ֑ם כִּ֤י יִרְאֶה֙ כִּי אָ֣זְלַת יָ֔ד וְ/אֶ֖פֶס עָצ֥וּר וְ/עָזֽוּב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/036.yaml
  text: For Yahweh will vindicate his people and will have compassion on his servants[a], when he sees that their strength is gone, and there is none left[d][c][b], bond or free.
translation:
  language: ml
  text: യഹോവ തന്റെ ജനത്തിനുവേണ്ടി നീതി നടത്തും[a]; തന്റെ ദാസന്മാരോടു കരുണ കാണിക്കും[b]. അവരുടെ ശക്തി തീർന്നുപോയിരിക്കുന്നതും[c], ബന്ധിതനോ സ്വതന്ത്രനോ ആരും ശേഷിക്കുന്നില്ലെന്നതും[d] അവൻ കാണുമ്പോൾ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തന്റെ ജനത്തെ വിധിക്കും.” ഇവിടെ സന്ദർഭം യഹോവ തന്റെ ജനത്തിനുവേണ്ടി പ്രവർത്തിക്കുന്നതിലേക്കാണ് വിരൽചൂണ്ടുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “തന്റെ ദാസന്മാരെക്കുറിച്ച് മനസ്സുമാറ്റും” അല്ലെങ്കിൽ “അവരെക്കുറിച്ചുള്ള നടപടിയിൽനിന്ന് പിന്മാറും.” എബ്രായ ക്രിയയ്ക്ക് അനുകമ്പ തോന്നുക, മനസ്സുമാറ്റുക എന്നീ ഭാവങ്ങളുണ്ട്.
    reason: lexical_alternative
  - marker: c
    text: 'അക്ഷരാർഥം: “കൈ തീർന്നുപോയി” അല്ലെങ്കിൽ “കൈ ഇല്ലാതായി.” ശക്തിയോ അധികാരമോ പൂർണമായി ക്ഷയിച്ചതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.'
    reason: lexical_alternative
  - marker: d
    text: എബ്രായം അക്ഷരാർഥത്തിൽ “തടഞ്ഞുവെക്കപ്പെട്ടവനും ഉപേക്ഷിക്കപ്പെട്ടവനും.” ഈ ദുഷ്കരമായ പദജോടി “ബന്ധിതനും സ്വതന്ത്രനും” എന്നോ, ലളിതമായി “ആരും ശേഷിച്ചില്ല” എന്നോ അർഥമാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: יָדִין
  choice: തന്റെ ജനത്തിനുവേണ്ടി നീതി നടത്തും
  rationale: דין എന്ന പദത്തിന്റെ ന്യായവിധി നടത്തുക/നീതി സ്ഥാപിക്കുക എന്ന നിയമപരമായ ഭാവം നിലനിർത്തിക്കൊണ്ട്, സന്ദർഭത്തിൽ നടപടി ജനത്തിന് അനുകൂലമാണെന്നത് വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു പദവിയാൽ പകരംവയ്ക്കാതെ മലയാളത്തിൽ സുപരിചിതമായ ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: וְעַל עֲבָדָיו יִתְנֶחָם
  choice: തന്റെ ദാസന്മാരോടു കരുണ തോന്നും
  rationale: נחם രൂപത്തിന് ഇവിടെ അനുകമ്പ തോന്നുക എന്നും തീരുമാനം മാറ്റുക/പിന്മാറുക എന്നും അർഥസാധ്യതയുണ്ട്; മുഖ്യവാചകം സന്ദർഭോചിതമായ അനുകമ്പാഭാവം നൽകുന്നു, മറ്റേ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: כִּי יִרְאֶה
  choice: അവൻ കാണുമ്പോൾ
  rationale: כִּי യുടെ കാലസൂചകവും കാരണസൂചകവുമായ ഭാവങ്ങൾക്കിടയിലെ ബന്ധം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: אָזְלַת יָד
  choice: അവരുടെ ശക്തി ക്ഷയിച്ചെന്ന്
  rationale: അക്ഷരാർഥത്തിൽ ‘കൈ ഇല്ലാതായി’ എന്ന എബ്രായ പ്രയോഗം ശക്തിയോ കഴിവോ പൂർണമായി തീർന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു.
- source_word: עָצוּר וְעָזוּב
  choice: ബന്ധിതനോ സ്വതന്ത്രനോ ആയി ആരും ശേഷിച്ചിട്ടില്ലെന്ന്
  rationale: ദുഷ്കരമായ ഈ പദജോടിയുടെ അക്ഷരാർഥ ചിത്രത്തെ ഭാഗികമായി നിലനിർത്തുകയും, എല്ലാവരെയും ഉൾക്കൊള്ളുന്ന വിരുദ്ധജോടി എന്ന സാധ്യത വായനക്കാരന് ഗ്രഹിക്കാവുന്ന രീതിയിൽ നൽകുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: യഹോവ തന്റെ ജനത്തെ ‘വിധിക്കുന്നു’ എന്നതിന്റെ ദിശ
  choice: ജനത്തിനുവേണ്ടി നീതി നടത്തി അവരെ ന്യായീകരിക്കുന്ന അനുകൂല നടപടി
  alternative: ജനത്തെ കുറ്റം വിധിക്കുകയോ ശിക്ഷിക്കുകയോ ചെയ്യുന്നു
  rationale: തുടർന്നുവരുന്ന ദാസന്മാരോടുള്ള അനുകമ്പയും അവരുടെ പൂർണ നിസ്സഹായതയും, ഇവിടെ דין ജനത്തിനുവേണ്ടിയുള്ള നീതിപ്രവർത്തനമാണെന്ന വായനയെ പിന്തുണയ്ക്കുന്നു; എങ്കിലും പൊതുവായ ‘വിധിക്കുക’ എന്ന അർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: יִתְנֶחָם എന്നതിലെ ദൈവിക പ്രതികരണം
  choice: ദാസന്മാരോടു കരുണ തോന്നും
  alternative: ദാസന്മാരെക്കുറിച്ച് മനസ്സുമാറ്റും/തന്റെ നടപടിയിൽനിന്ന് പിന്മാറും
  rationale: പദം അനുകമ്പയെയും മുൻനടപടിയിൽനിന്നുള്ള പിന്മാറ്റത്തെയും സൂചിപ്പിക്കാം. മുഖ്യവാചകത്തിൽ സന്ദർഭത്തിലെ കരുണ മുൻനിർത്തുന്നു; ആശയത്തിലെ ദൈവിക പിന്മാറ്റസാധ്യത അടിക്കുറിപ്പിൽ തുറന്നുവയ്ക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. നിയമപരമായ דין എന്ന ഭാവത്തിന് ‘നീതി നടത്തും’ ഉപയോഗിച്ചു; ദുഷ്കരമായ അവസാന പദജോടിയുടെ അനിശ്ചിതത്വം മുഖ്യവാചകത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
