id: DEU.32.3
reference: Deuteronomy 32:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֛י שֵׁ֥ם יְהוָ֖ה אֶקְרָ֑א הָב֥וּ גֹ֖דֶל לֵ/אלֹהֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/003.yaml
  text: For I will proclaim the name of Yahweh[a]; ascribe greatness to our God.
translation:
  language: ml
  text: എന്തെന്നാൽ, ഞാൻ യഹ്‌വേയുടെ[a] നാമം പ്രഘോഷിക്കും; നമ്മുടെ ദൈവത്തിന് മഹത്ത്വം നൽകുവിൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ: ‘YHWH’ (יהוה); പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്ന് വിവർത്തനം ചെയ്യാറുണ്ട്. ‘യഹോവ’ ഒരു പരമ്പരാഗത രൂപമാണ്; ‘യഹ്‌വേ’ ഈ ദൈവനാമത്തിന്റെ പുനർനിർമിത ഉച്ചാരണത്തെ പ്രതിനിധീകരിക്കുന്നു.'
    reason: ദൈവനാമത്തിന്റെ എബ്രായരൂപവും പ്രധാന പരിഭാഷാപാരമ്പര്യങ്ങളും അറിയിക്കുകയും, കൃത്യമായ പുരാതന ഉച്ചാരണം അനിശ്ചിതമാണെന്നത് സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
lexical_decisions:
- source_word: כִּי
  choice: ഞാൻ ... പ്രഘോഷിക്കും
  rationale: ഈ കണിക ഇവിടെ ഗാനത്തിന്റെ തുടർച്ചയിൽ കാരണമോ ഉറപ്പോ സൂചിപ്പിക്കാം. ഒറ്റപ്പെട്ട വാക്യത്തിൽ ‘എന്തെന്നാൽ’ എന്നത് അസ്വാഭാവികമായി തൂങ്ങിനിൽക്കുന്നതിനാൽ മലയാളത്തിലെ ഭാവികാലപ്രസ്താവനയിൽ അതിന്റെ ഉറപ്പുനിറം സ്വാഭാവികമായി ഉൾക്കൊള്ളിച്ചു.
- source_word: שֵׁם
  choice: നാമം
  rationale: വെളിപ്പെടുത്തപ്പെട്ട വ്യക്തിത്വത്തെയും കീർത്തിയെയും സൂചിപ്പിക്കാവുന്ന മൂലരൂപകം പരാവർത്തനം ചെയ്യാതെ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֶקְרָא
  choice: പ്രഘോഷിക്കും
  rationale: קרא എന്ന ക്രിയയുടെ പൊതുവായി പ്രഖ്യാപിക്കുക എന്ന സന്ദർഭാർത്ഥം ഗാനത്തിന്റെ പശ്ചാത്തലത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הָבוּ
  choice: അംഗീകരിക്കുവിൻ
  rationale: ബഹുവചന ആജ്ഞ സംരക്ഷിക്കുകയും മനുഷ്യർ ദൈവത്തിന് യഥാർത്ഥത്തിൽ മഹത്ത്വം നൽകിച്ചേർക്കുന്നു എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കി അവിടുത്തെ മഹത്ത്വം പ്രഖ്യാപിച്ചു സമ്മതിക്കുന്ന ആശയം നൽകുകയും ചെയ്യുന്നു.
- source_word: גֹדֶל
  choice: മഹത്ത്വം
  rationale: വലുപ്പം, ഔന്നത്യം, മഹിമ എന്നീ അർത്ഥപരിധിയുള്ള നാമത്തിന് സ്തുതിസന്ദർഭത്തിൽ സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ മലയാളപദം.
- source_word: לֵאלֹהֵינוּ
  choice: നമ്മുടെ ദൈവത്തിന്റെ
  rationale: ‘നമ്മുടെ ദൈവത്തിന് മഹത്ത്വം ചാർത്തുവിൻ’ എന്നതിനെക്കാൾ സ്വാഭാവികമായ മലയാളരൂപത്തിൽ ബന്ധവും ഒന്നാംപുരുഷ ബഹുവചന പ്രത്യയവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: എബ്രായപാഠം വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരാതെ പേര് ലിപ്യന്തരണം ചെയ്തു; ഉച്ചാരണത്തിന്റെ പുനർനിർമാണസ്വഭാവം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: ദൈവത്തിന് ‘മഹത്ത്വം നൽകുക’ എന്ന പ്രയോഗം
  choice: മഹത്ത്വം അംഗീകരിക്കുവിൻ
  alternative: മഹത്ത്വം നൽകുവിൻ / മഹത്ത്വം ചാർത്തുവിൻ
  rationale: ഹീബ്രു ആജ്ഞയുടെ ഉദ്ദേശ്യം ദൈവത്തിൽ ഇല്ലാത്ത മഹത്ത്വം മനുഷ്യർ സൃഷ്ടിക്കുന്നു എന്നതല്ല, അവിടുത്തെ മഹത്ത്വം സമ്മതിച്ച് പ്രഖ്യാപിക്കുകയാണ്; അതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ഈ അർത്ഥം നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ബഹുവചന ആജ്ഞയ്ക്ക് ‘-വിൻ’ രൂപം ഉപയോഗിച്ചു; കാവ്യഗൗരവം നിലനിർത്തിക്കൊണ്ട് അത്യന്തം പുരാതനമായ പദക്രമം ഒഴിവാക്കി.
