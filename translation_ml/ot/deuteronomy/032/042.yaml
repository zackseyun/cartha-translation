  text: אַשְׁכִּ֤יר חִצַּ/י֙ מִ/דָּ֔ם וְ/חַרְבִּ֖/י תֹּאכַ֣ל בָּשָׂ֑ר מִ/דַּ֤ם חָלָל֙ וְ/שִׁבְיָ֔ה מֵ/רֹ֖אשׁ פַּרְע֥וֹת אוֹיֵֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/042.yaml
  text: I will make my arrows drunk with blood[a], and my sword will devour flesh— with the blood of the slain and the captives, from the heads of the enemy leaders.
translation:
  language: ml
  text: 'എന്റെ അമ്പുകളെ ഞാൻ രക്തംകൊണ്ട് മത്തരാക്കും;


    എന്റെ വാൾ മാംസം വിഴുങ്ങും—


    കൊല്ലപ്പെട്ടവരുടെയും തടവുകാരുടെയും രക്തംകൊണ്ട്,


    അഴിഞ്ഞ മുടിയുള്ള ശത്രുക്കളുടെ തലകളിൽനിന്ന്.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ശത്രുനേതാക്കളുടെ തലകളിൽനിന്ന്,” അതുമല്ലെങ്കിൽ, “ശത്രുവിന്റെ പടയാളികളുടെ തലകളിൽനിന്ന്.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന פַּרְעוֹת (പെറാഓത്ത്) എന്ന അപൂർവ എബ്രായപദത്തിന്റെ അർഥം അനിശ്ചിതമാണ്; അത് അഴിഞ്ഞതോ നീണ്ടതോ ആയ മുടിയെ, അല്ലെങ്കിൽ നേതാക്കളെയോ പടയാളികളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁכִּיר
  choice: രക്തം കുടിച്ചു മത്തരാക്കും
  rationale: שׁכר എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം അക്ഷരാർഥത്തിൽ ‘മത്തരാക്കുക’ എന്നാണ്. അമ്പുകളെ രക്തം കുടിക്കുന്നവയായി സങ്കൽപ്പിക്കുന്ന ശക്തമായ കാവ്യരൂപകം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്താൻ ‘രക്തം കുടിച്ചു മത്തരാക്കും’ എന്നു നൽകി.
- source_word: חִצַּי
  choice: എന്റെ അമ്പുകളെ
  rationale: חֵץ എന്നതിന്റെ ബഹുവചനവും ഒന്നാംപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയവും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്ന സാധാരണ മലയാളപ്രയോഗം.
- source_word: מִדָּם
  choice: രക്തം കുടിച്ചു
  rationale: ‘മത്തരാക്കും’ എന്ന ക്രിയയോടു ചേർന്ന מן രക്തമാണ് മത്തുണ്ടാക്കുന്നതെന്ന ആശയം നൽകുന്നു. മലയാളത്തിൽ രൂപകം വ്യക്തവും സ്വാഭാവികവുമാക്കാൻ ‘രക്തം കുടിച്ചു’ എന്നു പ്രകടമാക്കി.
- source_word: וְחַרְבִּי
  choice: എന്റെ വാൾ
  rationale: ഉടമസ്ഥബന്ധം നേരിട്ട് നിലനിർത്തി.
- source_word: תֹּאכַל בָּשָׂר
  choice: മാംസം വിഴുങ്ങും
  rationale: അക്ഷരാർഥമായ ‘മാംസം തിന്നും’ എന്ന രൂപകത്തിന്റെ അക്രമതീവ്രതയും കാവ്യഭാവവും ‘വിഴുങ്ങും’ സ്വാഭാവികമായി പകരുന്നു.
- source_word: מִדַּם חָלָל
  choice: കൊല്ലപ്പെട്ടവരുടെ രക്തംകൊണ്ട്
  rationale: חָלָל ഇവിടെ യുദ്ധത്തിൽ കൊല്ലപ്പെട്ടവരെ സൂചിപ്പിക്കുന്നു; מן സന്ദർഭത്തിൽ വാൾ തൃപ്തിയാകുന്ന/രക്തത്തിൽ കുതിർക്കുന്ന ഉറവിടമോ മാധ്യമമോ സൂചിപ്പിക്കുന്നു.
- source_word: וְשִׁבְיָה
  choice: തടവുകാരുടെയും
  rationale: שִׁבְיָה എന്നത് തടവോ തടവിലാക്കപ്പെട്ടവരുടെ കൂട്ടമോ ആകാം. കൊല്ലപ്പെട്ടവരോടൊപ്പം വരുന്ന വ്യക്തിവാചക സമാന്തരത കണക്കിലെടുത്ത് ‘തടവുകാർ’ തിരഞ്ഞെടുത്തു.
- source_word: מֵרֹאשׁ
  choice: തലകളിൽനിന്ന്
  rationale: רֹאשׁ എന്നതിന്റെ ദൃശ്യമായ അർഥം നിലനിർത്തി; പിന്നാലെയുള്ള കൂട്ടവാചകത്തോടു ചേർന്ന് മലയാളത്തിൽ ബഹുവചനമാക്കി.
- source_word: פַּרְעוֹת
  choice: അഴിഞ്ഞ മുടിയുള്ള
  rationale: അപൂർവവും വിവാദവിധേയവുമായ പദത്തിന് ‘അഴിഞ്ഞ/നീണ്ട മുടിയുള്ളവർ’ എന്ന സാധ്യതയുണ്ട്. വ്യാഖ്യാനാത്മകമായ ‘നേതാക്കൾ’ പ്രധാനപാഠത്തിൽ നിർബന്ധിക്കാതെ, മൂലത്തിലെ ദൃശ്യരൂപവും അനിശ്ചിതത്വവും പരമാവധി സൂക്ഷിച്ചു.
- source_word: אוֹיֵב
  choice: ശത്രുവിന്റെ
  rationale: കൂട്ടാർത്ഥമുള്ള ഏകവചനം മലയാളത്തിൽ ‘ശത്രുവിന്റെ’ എന്നതിലൂടെ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: מֵרֹאשׁ פַּרְעוֹת אוֹיֵב എന്ന ദുഷ്കരമായ പദസമുച്ചയത്തിന്റെ വിവർത്തനം
  choice: ശത്രുവിന്റെ അഴിഞ്ഞ മുടിയുള്ള തലകളിൽനിന്ന്
  alternative: ശത്രുനേതാക്കളുടെ തലകളിൽനിന്ന്; ശത്രുവിന്റെ പടയാളികളുടെ തലകളിൽനിന്ന്
  rationale: ഇത് മുഖ്യമായി പദാർത്ഥ-വാക്യഘടനാപരമായ അനിശ്ചിതത്വമാണ്. פַּרְעוֹת എന്ന അപൂർവപദത്തെ ‘നേതാക്കൾ’ എന്നു തീർച്ചപ്പെടുത്തുന്നത് മൂലത്തിലെ യഥാർഥ അസ്പഷ്ടത മറയ്ക്കാം. അതിനാൽ സാധ്യമായ മൂർത്തമായ അർഥം പ്രധാനപാഠത്തിൽ നൽകി, വ്യാഖ്യാനപരമായ വായനകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കാവ്യശൈലി സ്വീകരിച്ചു. യുദ്ധഗീതത്തിലെ ശക്തമായ മനുഷ്യവൽക്കരണരൂപകങ്ങൾ നിലനിർത്തിയെങ്കിലും അസ്വാഭാവികമായ പദാനുപദക്രമം ഒഴിവാക്കി. ദുഷ്കരമായ അവസാനവാക്യത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിലൂടെ തുറന്നുവെച്ചു.
