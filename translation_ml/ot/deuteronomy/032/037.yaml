id: DEU.32.37
reference: Deuteronomy 32:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אָמַ֖ר אֵ֣י אֱלֹהֵ֑י/מוֹ צ֖וּר חָסָ֥יוּ בֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/037.yaml
  text: And he will say[a], ‘Where are their gods, the rock in which they took refuge?’
translation:
  language: ml
  text: 'അവൻ പറയും: “അവരുടെ ദേവന്മാർ—അവർ അഭയം തേടിയ പാറ[a]—എവിടെയുണ്ട്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രുവിൽ ‘പാറ’ ഏകവചനമാണ്: “അവരുടെ ദേവന്മാർ, അവർ അതിൽ അഭയം തേടിയ പാറ, എവിടെ?” ‘പാറ’ ഇവിടെ ‘അവരുടെ ദേവന്മാർ’ എന്നതിനെ വിശദീകരിക്കുന്ന രൂപകമാണ്; ‘അതിൽ’ എന്നതും ഏകവചനമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַר
  choice: അവൻ പറയും
  rationale: കാവ്യസന്ദർഭത്തിൽ മുൻപോട്ടു നീങ്ങുന്ന കർത്താവിന്റെ പ്രഖ്യാപിത വാക്കിനെ ഭാവികാലത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു. വാക്യാരംഭത്തിലെ മലയാളരൂപം ഹീബ്രു സംയോജകത്തിന്റെ തുടർച്ചാഭാവവും ഉൾക്കൊള്ളുന്നു.
- source_word: אֵי
  choice: എവിടെ?
  rationale: സ്ഥാനം ചോദിക്കുന്ന അവ്യയം. മലയാളത്തിൽ ഏകവചന-ബഹുവചന വ്യത്യാസമില്ലാതെ ഇതേ ചോദ്യം സ്വാഭാവികമാണ്.
- source_word: אֱלֹהֵימוֹ
  choice: അവരുടെ ദേവന്മാർ
  rationale: ബഹുവചന നിർമാണവും മൂന്നാംപുരുഷ ബഹുവചന ഉടമസ്ഥപ്രത്യയവും വ്യക്തമായി നിലനിർത്തുന്നു; ആശ്രയിച്ചിരുന്ന വ്യാജദേവന്മാരെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
- source_word: צוּר
  choice: പാറ
  rationale: സംരക്ഷണത്തിന്റെയും അഭയത്തിന്റെയും രൂപകം നേരിട്ട് നിലനിർത്തുന്നു. ഇവിടെ ഇത് കർത്താവിന്റെ വിശേഷനാമമല്ല, ‘അവരുടെ ദേവന്മാർ’ എന്നതിനെ വിശദീകരിക്കുന്ന ഏകവചന രൂപകമായതിനാൽ സാധാരണ നാമമായി നൽകുന്നു.
- source_word: חָסָיוּ
  choice: അവർ അഭയം തേടിയ
  rationale: חסה എന്ന ക്രിയയിലെ ‘അഭയം തേടുക’ എന്ന സജീവവും ദൃശ്യവുമായ അർഥം നിലനിർത്തുന്നു; ‘ആശ്രയിച്ച’ എന്നതിനെക്കാൾ പാറയുടെ രൂപകവുമായി നേരിട്ട് ചേരുന്നു.
- source_word: בּוֹ
  choice: അതിൽ
  rationale: മൂന്നാംപുരുഷ ഏകവചന പ്രത്യയം മുൻപുള്ള ഏകവചനമായ ‘പാറ’യിലേക്കാണ് മടങ്ങുന്നത്. മുഖ്യവാക്യത്തിൽ മലയാളത്തിന്റെ സ്വാഭാവികതയ്ക്കായി ‘അവർ അഭയം തേടിയ പാറ’ എന്നു ബന്ധവാക്യരൂപത്തിൽ നൽകി; അക്ഷരാർഥ ഘടന അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: സംസാരിക്കുന്നവനും ക്രിയയുടെ കാലബലവും
  choice: കർത്താവിനെ സൂചിപ്പിക്കുന്ന ‘അവൻ പറയും’ എന്ന ഭാവികാല വായന
  alternative: ‘അവൻ പറഞ്ഞു’ അല്ലെങ്കിൽ ‘അപ്പോൾ ഒരാൾ പറയും’
  rationale: ആവർത്തനം 32:36–38-ൽ കർത്താവ് തന്റെ ജനത്തെ വിധിക്കുകയും അവർ ആശ്രയിച്ച ദേവന്മാരുടെ അശക്തി വെളിപ്പെടുത്തുകയും ചെയ്യുന്ന പ്രസംഗം തുടരുന്നതാണ് ഏറ്റവും സ്വാഭാവികമായ വായന. കാവ്യത്തിലെ ഹീബ്രു ക്രിയാരൂപം സന്ദർഭാനുസൃതമായ ഈ ഭാവികാലബലം അനുവദിക്കുന്നു.
- issue: ‘പാറ’യുടെ ദൈവശാസ്ത്രപരമായ സൂചന
  choice: കർത്താവിന്റെ നാമപദവിയായി അല്ലാതെ സാധാരണ നാമമായ ‘പാറ’
  alternative: കർത്താവിനെ സൂചിപ്പിക്കുന്ന വിശേഷനാമമായി ‘പാറ’
  rationale: ഈ വാക്യത്തിൽ צוּר എന്നത് ഉടൻ മുൻപുള്ള ‘അവരുടെ ദേവന്മാർ’ എന്നതിനെ ഏകവചന രൂപകമായി വിശദീകരിക്കുന്നു. അതിനെ കർത്താവിന്റെ വിശേഷനാമമാക്കുന്നത് വാക്യത്തിലെ പരിഹാസാത്മക വൈരുധ്യം മങ്ങിച്ചുകളയും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ കാവ്യപ്രസംഗശൈലി. ഹീബ്രുവിലെ ഏകവചന ‘പാറ’യും ബഹുവചന ‘ദേവന്മാർ’യും തമ്മിലുള്ള ഉദ്ദേശ്യപൂർവമായ വ്യാകരണ-രൂപക സംഘർഷം അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചിരിക്കുന്നു.
