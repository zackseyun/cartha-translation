revisions:
- from: സീൻ മരുഭൂമിയിലെ കാദേശിലെ മെരീബാ വെള്ളത്തിനരികെ, ഇസ്രായേൽമക്കളുടെ മധ്യേ നിങ്ങൾ എന്നോടു അവിശ്വസ്തമായി പെരുമാറിയതിനാലും ഇസ്രായേൽമക്കളുടെ മധ്യേ എന്റെ വിശുദ്ധിയെ മാനിക്കാതിരുന്നതിനാലുമാണിത്.[a][b]
  to: കാരണം, സീൻ മരുഭൂമിയിലെ മെരീബത്ത്-കാദേശ് വെള്ളങ്ങളിൽ ഇസ്രായേൽമക്കളുടെ മധ്യേ നിങ്ങൾ എന്നോടു വിശ്വാസദ്രോഹം ചെയ്തു; ഇസ്രായേൽമക്കളുടെ മധ്യേ എന്നെ വിശുദ്ധനായി മാനിച്ചുമില്ല.[a][b]
  rationale: The revision corrects the locative sense of ‘waters,’ presents Meribath-kadesh as a coherent place name, and restores God as the direct object of the final accusation. It also uses an idiomatic Malayalam causal construction while preserving the Hebrew parallelism and repeated ‘among the children of Israel.’
