  variant: modern standard Malayalam
source:
  edition: WLC
  text: עַל֩ אֲשֶׁ֨ר מְעַלְתֶּ֜ם בִּ֗/י בְּ/תוֹךְ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל בְּ/מֵֽי מְרִיבַ֥ת קָדֵ֖שׁ מִדְבַּר צִ֑ן עַ֣ל אֲשֶׁ֤ר לֹֽא קִדַּשְׁתֶּם֙ אוֹתִ֔/י בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/051.yaml
  text: because you acted unfaithfully against me among the sons of Israel at the waters of Meribath-kadesh[a], in the wilderness of Zin[c][b], because you did not treat me as holy among the sons of Israel.
translation:
  language: ml
  text: കാരണം, സീൻ മരുഭൂമിയിലെ മെരീബത്ത്-കാദേശ് വെള്ളങ്ങളിൽ ഇസ്രായേൽമക്കളുടെ മധ്യേ നിങ്ങൾ എന്നോടു വിശ്വാസദ്രോഹം ചെയ്തു; ഇസ്രായേൽമക്കളുടെ മധ്യേ എന്നെ വിശുദ്ധനായി മാനിച്ചുമില്ല.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “മെരീബത്ത്-കാദേശ്” എന്നത് “കാദേശിലെ മെരീബാ” അഥവാ കൂടുതൽ അക്ഷരാർഥത്തിൽ “കാദേശിലെ കലഹത്തിന്റെ വെള്ളങ്ങൾ” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: “എന്നെ വിശുദ്ധനായി മാനിച്ചില്ല” എന്നതിന് “എന്നെ വിശുദ്ധനായി പ്രകടമാക്കിയില്ല” അഥവാ കൂടുതൽ അക്ഷരാർഥത്തിൽ “എന്നെ വിശുദ്ധീകരിച്ചില്ല” എന്നും പറയാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַלְתֶּם בִּי
  choice: നിങ്ങൾ എന്നോടു അവിശ്വസ്തമായി പെരുമാറി
  rationale: מעל എന്ന ക്രിയ വിശ്വാസബന്ധത്തിന്റെ ലംഘനത്തെയും ദ്രോഹപരമായ അവിശ്വസ്തതയെയും സൂചിപ്പിക്കുന്നു; בִּי ഇവിടെ ലംഘനത്തിന് ഇരയായ ദൈവത്തെ അടയാളപ്പെടുത്തുന്നു.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ മധ്യേ
  rationale: ബെനേ യിസ്രായേൽ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപവും വാക്യത്തിലെ ആവർത്തനവും കാത്തുസൂക്ഷിക്കുന്ന, മലയാള ബൈബിൾ ശൈലിയിൽ സ്വാഭാവികമായ രൂപം.
- source_word: בְּמֵי מְרִיבַת קָדֵשׁ
  choice: കാദേശിലെ മെരീബാ വെള്ളത്തിനരികെ
  rationale: സ്ഥലനാമസ്വഭാവം നിലനിർത്തിക്കൊണ്ട്, construct ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; מֵי എന്നത് വെള്ളം/ജലസ്ഥലം സൂചിപ്പിക്കുന്നു.
- source_word: מִדְבַּר צִן
  choice: സീൻ മരുഭൂമി
  rationale: ഭൂമിശാസ്ത്രപരമായ സ്ഥലനാമവും מִדְבָּר എന്ന പദത്തിന്റെ സാധാരണ അർത്ഥവും നേരിട്ട് നൽകുന്നു.
- source_word: לֹא קִדַּשְׁתֶּם אֹתִי
  choice: എന്റെ വിശുദ്ധിയെ മാനിച്ചില്ല
  rationale: പീയേൽ രൂപം ഇവിടെ ദൈവത്തെ വിശുദ്ധനായി അംഗീകരിക്കുകയും ജനമധ്യേ അവന്റെ വിശുദ്ധി ഉയർത്തിപ്പിടിക്കുകയും ചെയ്യുക എന്ന പൊതുവായ അർത്ഥത്തിലാണ്; ദൈവത്തെ വിശുദ്ധനാക്കുക എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: קִדַּשְׁתֶּם אֹתִי എന്നതിന്റെ ദൈവശാസ്ത്രപരമായ ഭാവം
  choice: എന്റെ വിശുദ്ധിയെ മാനിച്ചില്ല
  alternative: എന്നെ വിശുദ്ധീകരിച്ചില്ല; എന്നെ വിശുദ്ധനായി പ്രകടമാക്കിയില്ല
  rationale: ദൈവത്തിന്റെ സ്വഭാവത്തിൽ വിശുദ്ധിയുടെ കുറവുണ്ടെന്നല്ല, മോശയും അഹരോനും ജനസമക്ഷം ദൈവത്തിന്റെ വിശുദ്ധിയെ യഥോചിതം ഉയർത്തിപ്പിടിച്ചില്ലെന്നതാണ് സന്ദർഭം. തിരഞ്ഞെടുത്ത രൂപം ഇതു വ്യക്തമാക്കുന്നു, എന്നാൽ പൊതുവായ ആദരിക്കൽ/വിശുദ്ധനായി കണക്കാക്കൽ എന്ന അർത്ഥവ്യാപ്തി നിലനിർത്തുന്നു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ജനനാമം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ; ഇസ്രായേൽജനം
  rationale: മൂലത്തിലെ ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന രൂപവും രണ്ടുതവണയുള്ള ആവർത്തനവും നിലനിർത്തുന്നു; മലയാളത്തിൽ പരിചിതവും ഉൾക്കൊള്ളാവുന്നതുമായ ജനനാമപ്രയോഗമാണിത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ മലയാളം. മൂലത്തിലെ കാരണവാക്യങ്ങളുടെ സമാന്തരതയും ‘ഇസ്രായേൽമക്കളുടെ മധ്യേ’ എന്ന ആവർത്തനവും സൂക്ഷിച്ചിട്ടുണ്ട്. പ്രധാന പാഠത്തിലെ [a], [b] അടയാളങ്ങൾ അനുബന്ധ അടിക്കുറിപ്പുകളോട് പൊരുത്തപ്പെടുന്നു.
