translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കാവ്യഭാഷ ഉപയോഗിച്ചു. പുറം–അകം, യുവാവ്–കന്യക, മുലകുടിക്കുന്ന കുഞ്ഞ്–നരച്ചവൻ എന്നീ എബ്രായ സമാന്തരവൈരുധ്യങ്ങൾ നിലനിർത്തി. ‘ഭീതി നിറയും’ എന്ന ക്രിയാപൂരണം മൂലപാഠത്തിൽ നാമവാക്യമായി നിൽക്കുന്ന אֵימָהയെ സ്വാഭാവിക മലയാളമാക്കുന്നു; അർഥം അനാവശ്യമായി വിശദീകരിക്കുന്നില്ല.
