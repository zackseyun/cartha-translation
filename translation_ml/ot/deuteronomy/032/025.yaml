  yaml_path: translation/ot/deuteronomy/032/025.yaml
  text: Outside[a], the sword will bereave; and in the inner rooms, terror—both young man and virgin[b], nursing child together with gray-haired man.
translation:
  language: ml
  text: 'പുറത്ത്[a] വാൾ ജീവനെടുക്കും;


    അകത്തെ മുറികളിൽ ഭീതി—


    യുവാവിനെയും കന്യകയെയും[b],


    മുലകുടിക്കുന്ന കുഞ്ഞിനെയും നരച്ചമുടിയുള്ള വൃദ്ധനെയും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പുറത്തുനിന്ന് വാൾ; മുറികളിൽനിന്ന് ഭീതി.” പുറത്തെ അപകടത്തെയും അകത്തെ ഭീതിയെയും എബ്രായം പരസ്പരം എതിർനിർത്തുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “കന്യക” എന്നത് എബ്രായത്തിലെ ബെത്തൂലാ എന്ന പദത്തിന്റെ പരിഭാഷയാണ്. സാധാരണയായി ഇത് വിവാഹിതയല്ലാത്ത യുവതിയെ സൂചിപ്പിക്കുന്നു; കന്യകാത്വത്തിന്റെ സൂചനയും പലപ്പോഴും ഇതിലുണ്ട്. “യുവതി” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִחוּץ
  choice: പുറത്ത്
  rationale: തുടർന്നുള്ള അകത്തെ മുറികളോടുള്ള സ്ഥലപരമായ വൈരുധ്യം ചുരുക്കമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: תְּשַׁכֶּל
  choice: മക്കളെ നഷ്ടപ്പെടുത്തും
  rationale: שׁכל എന്ന ക്രിയയുടെ പീയേൽ രൂപം മക്കളില്ലാതാക്കുക അഥവാ മക്കളെ നഷ്ടപ്പെടുത്തുക എന്ന ആശയം നൽകുന്നു; വാളിനെ പ്രവർത്തകശക്തിയായി നിലനിർത്തുകയും മലയാളത്തിൽ അർഥം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: חֶרֶב
  choice: വാൾ
  rationale: യുദ്ധമരണത്തിന്റെ വ്യക്തിവൽക്കരിക്കപ്പെട്ട പ്രവർത്തകനെന്ന എബ്രായ കാവ്യചിത്രം സംരക്ഷിക്കുന്നു.
- source_word: וּמֵחֲדָרִים
  choice: അകത്തെ മുറികളിൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘മുറികളിൽനിന്ന്’ എന്നായിരിക്കാമെങ്കിലും, പുറത്തെ അപകടത്തിന് എതിരായുള്ള വീടിനകത്തെ ഭീതിസ്ഥലം എന്ന കാവ്യവൈരുധ്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֵימָה
  choice: ഭീതി
  rationale: അതിശക്തമായ പേടിയെ സൂചിപ്പിക്കുന്നതും വരിയുടെ കടുത്ത കാവ്യഭാവത്തിന് യോജിക്കുന്നതുമായ പദം.
- source_word: גַּם בָּחוּר גַּם בְּתוּלָה
  choice: യുവാവിനെയും കന്യകയെയും
  rationale: യുവപുരുഷനും വിവാഹിതയല്ലാത്ത യുവതിയും എന്ന എബ്രായ ജോടിയുടെ വ്യത്യാസവും בְּתוּלָה എന്ന പദത്തിന്റെ സവിശേഷതയും സംരക്ഷിക്കുന്നു.
- source_word: יוֹנֵק
  choice: മുലകുടിക്കുന്ന കുഞ്ഞ്
  rationale: ‘കുടിക്കുന്നവൻ’ എന്ന പങ്കാളിത്തരൂപത്തിന്റെ ജീവന്തമായ ചിത്രം പൊതുവായ ‘ശിശു’ എന്നതിനെക്കാൾ കൃത്യമായി നൽകുന്നു.
- source_word: עִם אִישׁ שֵׂיבָה
  choice: നരച്ചവൻ
  rationale: നരച്ച മുടിയുള്ള വൃദ്ധപുരുഷൻ എന്ന മൂലഭാഷയിലെ ദൃശ്യചിത്രം ചുരുക്കമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
