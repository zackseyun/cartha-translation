id: DEU.32.33
reference: Deuteronomy 32:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: חֲמַ֥ת תַּנִּינִ֖ם יֵינָ֑/ם וְ/רֹ֥אשׁ פְּתָנִ֖ים אַכְזָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/033.yaml
  text: Their wine is the venom of serpents[b][a], the cruel poison of cobras.
translation:
  language: ml
  text: അവരുടെ വീഞ്ഞ് സർപ്പങ്ങളുടെ വിഷം[b]; മൂർഖൻപാമ്പുകളുടെ[a] ക്രൂരമായ വിഷം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘അണലികളുടെ വിഷം’; മാരകവിഷമുള്ള ഒരു പാമ്പിനെയാണ് ഹീബ്രുപദം സൂചിപ്പിക്കുന്നത്. പരമ്പരാഗതമായി ഇതിനെ ‘ആസ്പ്’ അല്ലെങ്കിൽ ‘ആഡർ’ എന്നും പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: ‘സർപ്പങ്ങൾ’ എന്ന പദം മറ്റു സന്ദർഭങ്ങളിൽ ‘വ്യാളികൾ’ എന്നോ വലിയ ഉരഗങ്ങൾ എന്നോ പരിഭാഷപ്പെടുത്താം; എന്നാൽ ഇവിടെ വിഷപ്പാമ്പുകളോടുള്ള സമാന്തരത സർപ്പസംബന്ധമായ അർഥത്തെ അനുകൂലിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמַת
  choice: വിഷം
  rationale: സർപ്പങ്ങളെ സൂചിപ്പിക്കുന്ന സമാന്തര പ്രയോഗത്തിൽ ഈ പദം ‘ക്രോധം’ അല്ലെങ്കിൽ ‘ചൂട്’ എന്നതിലുപരി സർപ്പവിഷത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: תַּנִּינִם
  choice: സർപ്പങ്ങൾ
  rationale: മറ്റു സന്ദർഭങ്ങളിൽ വലിയ ഉരഗങ്ങളെയോ സമുദ്രജീവികളെയോ സൂചിപ്പിക്കാമെങ്കിലും, ഇവിടെ വിഷപ്പാമ്പുകളോടുള്ള സമാന്തരത സർപ്പസംബന്ധമായ അർഥത്തെയാണ് അനുകൂലിക്കുന്നത്.
- source_word: יֵינָם
  choice: അവരുടെ വീഞ്ഞ്
  rationale: ഹീബ്രുവിലെ ഉടമസ്ഥതാസൂചക രൂപത്തിന്റെ നേരായ പരിഭാഷ; വീഞ്ഞിനെ മാരകവിഷത്തോടു രൂപകമായി സമീകരിക്കുന്നു.
- source_word: וְרֹאשׁ
  choice: വിഷം
  rationale: ഇവിടെ അക്ഷരാർഥമായ ‘തല’ അല്ല, കയ്പുള്ളതോ വിഷമുള്ളതോ ആയ വസ്തുവാണ് ഉദ്ദേശ്യം. മലയാളത്തിൽ ‘വിഷം’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: פְּתָנִים
  choice: മൂർഖൻപാമ്പുകൾ
  rationale: മാരകവിഷമുള്ള ഒരു പാമ്പിനെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ‘മൂർഖൻപാമ്പ്’ ആ ചിത്രം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു, എന്നാൽ കൃത്യമായ ഇനനിർണയം അനിശ്ചിതമായതിനാൽ അടിക്കുറിപ്പ് ചേർത്തിരിക്കുന്നു.
- source_word: אַכְזָר
  choice: ക്രൂരമായ
  rationale: വിഷത്തിന്റെ ദയാരഹിതവും മാരകവുമായ ഫലത്തെ വ്യക്തിവൽക്കരിക്കുന്ന ഹീബ്രു ഭാവം സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കാവ്യാത്മക ശൈലി. ഹീബ്രു സമാന്തരഘടന നിലനിർത്തി; രണ്ടിടത്തുമുള്ള വിഷസങ്കൽപ്പം മലയാളത്തിൽ വ്യക്തമായി അവതരിപ്പിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
