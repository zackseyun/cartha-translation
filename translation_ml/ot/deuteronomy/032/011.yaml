  source_fidelity: 'മുഖ്യ ആശയവും ക്രിയാക്രമവും എബ്രായപാഠത്തോട് വിശ്വസ്തമാണ്: കൂടിനെ ഉണർത്തൽ/ഇളക്കൽ, കുഞ്ഞുങ്ങൾക്കുമീതെ തൂങ്ങിനിൽക്കൽ, ചിറകു വിരിത്തൽ, ഏകവചന കർമത്തെ എടുക്കലും വഹിക്കലും എല്ലാം സൂക്ഷിച്ചിട്ടുണ്ട്. נֶשֶׁר-ന്റെ പക്ഷിവർഗ അനിശ്ചിതത്വവും אֶבְרָה-യുടെ പ്രത്യേക ചിറകുതൂവൽ അർഥവും അടിക്കുറിപ്പുകളിൽ നിലനിർത്തിയിട്ടുണ്ട്.'
  naturalness: ‘ചിറകടിച്ചുനിൽക്കുക’ മനസ്സിലാക്കാവുന്നതാണെങ്കിലും, רחף-ന്റെ വായുവിൽ തൂങ്ങിനിൽക്കുന്ന/പാറിനിൽക്കുന്ന ചലനത്തിന് ‘പാറിനിൽക്കുക’ കൂടുതൽ സ്വാഭാവികവും കൃത്യവുമാണ്. ‘ചിറകിലെ പുറംതൂവലുകളിൽ’ എന്ന രൂപം നിലവിലെ ‘ചിറകുകളുടെ പുറംതൂവലുകളിൽ’ എന്നതിനെക്കാൾ ഒഴുക്കുള്ളതാണ്.
  terminology: ‘കഴുകൻ’ മുഖ്യവിവർത്തനമായി സ്വീകാര്യമാണ്; ശവംതീനി വലിയ പക്ഷി എന്ന ബദൽ അടിക്കുറിപ്പിൽ നൽകണം. ‘കൂട്,’ ‘കുഞ്ഞുങ്ങൾ,’ ‘ചിറക്,’ ‘വഹിക്കുന്നു’ എന്നിവ ആധുനിക നിലവാരമലയാളത്തിനും കാവ്യഗൗരവത്തിനും യോജിക്കുന്നു. എബ്രായത്തിലെ പുല്ലിംഗ ഏകവചന കർമപ്രത്യയത്തിന് ‘അവനെ’ നിലനിർത്താം; സന്ദർഭം അതിനെ തുറന്നുവയ്ക്കുന്നു.
