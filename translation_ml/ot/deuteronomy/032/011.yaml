  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כְּ/נֶ֨שֶׁר֙ יָעִ֣יר קִנּ֔/וֹ עַל גּוֹזָלָ֖י/ו יְרַחֵ֑ף יִפְרֹ֤שׂ כְּנָפָי/ו֙ יִקָּחֵ֔/הוּ יִשָּׂאֵ֖/הוּ עַל אֶבְרָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/011.yaml
  text: Like an eagle that stirs up its nest[a], that hovers over its young, he spreads out his wings, takes him[c][b], and carries him on his pinions.
translation:
  language: ml
  text: 'കഴുകൻ[a] തന്റെ കൂടിനെ ഇളക്കിവിടുകയും

    കുഞ്ഞുങ്ങൾക്കുമീതെ പാറിനിൽക്കുകയും ചെയ്യുന്നതുപോലെ,


    അവൻ തന്റെ ചിറകുകൾ വിരിച്ച് അവനെ എടുക്കുന്നു;

    തന്റെ ചിറകിലെ പുറംതൂവലുകളിൽ[c] അവനെ വഹിക്കുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കഴുകൻ’ എന്നതിനുപകരം ‘വലിയ ശവംതീനി പക്ഷി’ എന്നും വിവർത്തനം ചെയ്യാം; എബ്രായത്തിലെ נֶשֶׁר വലിയ കഴുകുവർഗ ഇരപിടിയൻ പക്ഷിയെയോ ശവംതീനി പക്ഷിയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: ‘ചിറകിലെ പുറംതൂവലുകൾ’ എന്നത് പറക്കാൻ പ്രധാനമായ നീണ്ട ചിറകുതൂവലുകളെ സൂചിപ്പിക്കുന്നു; കൂടുതൽ പൊതുവായി ‘ചിറകുകളിൽ’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּנֶשֶׁר
  choice: കഴുകൻ … ചെയ്യുന്നതുപോലെ
  rationale: נֶשֶׁר ഒരു വലിയ ഇരപിടിയൻ പക്ഷിയെയോ ശവംതീനി പക്ഷിയെയോ സൂചിപ്പിക്കാം. മലയാള ബൈബിൾഭാഷയിലും പൊതുപ്രയോഗത്തിലും പരിചിതമായ ‘കഴുകൻ’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ച് ജന്തുശാസ്ത്രപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: יָעִיר קִנּוֹ
  choice: തന്റെ കൂടിനെ ഇളക്കിവിടുകയും
  rationale: עור എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഉണർത്തുക, ഇളക്കുക, പ്രവർത്തനത്തിലേക്കു പ്രേരിപ്പിക്കുക എന്ന ആശയം നൽകുന്നു. പക്ഷി കൂടിനെ ഉണർത്തുന്ന കാവ്യചിത്രത്തിന് ‘ഇളക്കിവിടുക’ സ്വാഭാവികവും സജീവവുമാണ്.
- source_word: עַל גּוֹזָלָיו יְרַחֵף
  choice: കുഞ്ഞുങ്ങൾക്കുമീതെ ചിറകടിച്ചുനിൽക്കുകയും
  rationale: רחף ചിറകടിച്ചുകൊണ്ട് മീതെ നിലകൊള്ളുകയോ പാറിനിൽക്കുകയോ ചെയ്യുന്ന ചലനത്തെ സൂചിപ്പിക്കുന്നു. ‘ചിറകടിച്ചുനിൽക്കുക’ സംരക്ഷണചിത്രം അമിതമായി വ്യാഖ്യാനിക്കാതെ ചലനം പ്രകടമാക്കുന്നു.
- source_word: יִפְרֹשׂ כְּנָפָיו
  choice: തന്റെ ചിറകുകൾ വിരിച്ച്
  rationale: פרשׂ എന്ന ക്രിയയുടെ വിരിക്കുക, നീട്ടുക എന്ന നേരിട്ടുള്ള അർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יִקָּחֵהוּ
  choice: അവനെ എടുക്കുന്നു
  rationale: לקח എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘എടുക്കുക’ സംരക്ഷിച്ചു. ഏകവചന പുല്ലിംഗ കർമപ്രത്യയം ‘അവനെ’ എന്നു നൽകി; അത് ഒരു കുഞ്ഞിനെയോ ഉപമയുടെ പ്രയോഗത്തിൽ ഇസ്രായേലിനെയോ സൂചിപ്പിക്കാവുന്ന വിധത്തിൽ തുറന്നുവെച്ചു.
- source_word: יִשָּׂאֵהוּ
  choice: അവനെ വഹിക്കുന്നു
  rationale: נשא ഇവിടെ ഭാരം ചുമന്ന് കൊണ്ടുപോകുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘വഹിക്കുന്നു’ കാവ്യഗൗരവവും ശാരീരികമായി ചുമക്കുന്ന ആശയവും ഒരുമിച്ച് നൽകുന്നു.
- source_word: עַל אֶבְרָתוֹ
  choice: തന്റെ ചിറകുകളുടെ പുറംതൂവലുകളിൽ
  rationale: אֶבְרָה ചിറകിലെ ശക്തമായ പുറംതൂവലുകളെയോ ചിറകിനെയോ സൂചിപ്പിക്കുന്നു. മുമ്പുള്ള כָּנָף എന്ന പൊതുവായ ‘ചിറക്’ എന്ന പദത്തിൽനിന്നുള്ള പദവ്യത്യാസം കഴിയുന്നത്ര നിലനിർത്താൻ ഈ പ്രയോഗം തെരഞ്ഞെടുത്തു.
theological_decisions:
- issue: ഉപമയിലെ പക്ഷിയിൽനിന്ന് ദൈവിക പരാമർശത്തിലേക്കുള്ള സർവനാമചലനം
  choice: അവസാന ഭാഗത്ത് ‘അവൻ/തന്റെ’ എന്നും ഏകവചന കർമത്തെ ‘അവനെ’ എന്നും നിലനിർത്തി
  alternative: മുഴുവൻ വാക്യവും പക്ഷിയെ മാത്രം സൂചിപ്പിക്കുന്ന വിധത്തിൽ ‘അത്/അതിന്റെ’ എന്നു നൽകുക
  rationale: എബ്രായത്തിൽ ക്രിയകൾ പുല്ലിംഗ ഏകവചനത്തിലാണ്; സമീപസന്ദർഭത്തിൽ കഴുകന്റെ ചിത്രം യഹോവ ഇസ്രായേലിനെ പരിപാലിക്കുന്നതിനെ വിവരിക്കുന്നു. ‘അവൻ’ എന്നു നൽകുന്നത് ദൈവനാമം പാഠത്തിൽ ചേർക്കാതെ ഉപമയിൽനിന്ന് അതിന്റെ പരാമർശത്തിലേക്കുള്ള കാവ്യചലനം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കാവ്യഗദ്യം ഉപയോഗിച്ചു. സമാന്തരമായ മൂന്ന് വരികൾ എബ്രായ കവിതയുടെ ചലനം വ്യക്തമാക്കുന്നു. ‘കഴുകൻ,’ ‘കൂട്,’ ‘ചിറക്,’ ‘വഹിക്കുക’ തുടങ്ങിയ സാധാരണ പദങ്ങൾ വായനാസൗകര്യം നൽകുമ്പോൾ ‘ചിറകുകളുടെ പുറംതൂവലുകൾ’ മൂലപാഠത്തിലെ പദവ്യത്യാസം സംരക്ഷിക്കുന്നു.
