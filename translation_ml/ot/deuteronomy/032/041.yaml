source:
  edition: WLC
  text: אִם שַׁנּוֹתִי֙ בְּרַ֣ק חַרְבִּ֔/י וְ/תֹאחֵ֥ז בְּ/מִשְׁפָּ֖ט יָדִ֑/י אָשִׁ֤יב נָקָם֙ לְ/צָרָ֔/י וְ/לִ/מְשַׂנְאַ֖/י אֲשַׁלֵּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/041.yaml
  text: when I sharpen the lightning of my sword, and my hand takes hold of judgment, I will return vengeance on my adversaries, and I will repay those who hate me.
translation:
  language: ml
  text: 'എന്റെ വാളിന്റെ മിന്നൽ ഞാൻ മൂർച്ചകൂട്ടുമ്പോൾ,


    എന്റെ കൈ ന്യായവിധി കൈയിലെടുക്കുമ്പോൾ,


    ഞാൻ എന്റെ വൈരികളോടു പ്രതികാരം ചെയ്യും;


    എന്നെ വെറുക്കുന്നവർക്കു ഞാൻ പകരം നൽകും.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: എപ്പോൾ / -മ്പോൾ
  rationale: ഇവിടെ אִם സാധാരണ വ്യവസ്ഥാസൂചകമായ ‘എങ്കിൽ’ എന്നതിലുപരി, തുടർന്നുള്ള ഉറപ്പുള്ള ദൈവിക നടപടിയുടെ സമയസാഹചര്യം അവതരിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം. അതിനാൽ സ്വാഭാവികമായ മലയാളത്തിൽ ‘-മ്പോൾ’ ഉപയോഗിച്ചു; സ്രോതസ്സിലെ ഘടനയുടെ ഗൗരവം നിലനിർത്തുന്നു.
- source_word: שַׁנּוֹתִי
  choice: ഞാൻ മൂർച്ചകൂട്ടുമ്പോൾ
  rationale: שנן എന്ന ധാതുവിന്റെ പിയേൽ രൂപം ‘മൂർച്ചകൂട്ടുക’ എന്നാണ്; ആയുധം യുദ്ധത്തിനായി ഒരുക്കുന്നതിന്റെ ദൃശ്യബിംബം നേരിട്ട് സൂക്ഷിച്ചു.
- source_word: בְּרַק חַרְבִּי
  choice: എന്റെ വാളിന്റെ മിന്നൽ
  rationale: ശാബ്ദികമായി ‘എന്റെ വാളിന്റെ മിന്നൽ’; വാളിന്റെ മിന്നുന്ന ധാരയെ സൂചിപ്പിക്കുന്ന ശക്തമായ കാവ്യരൂപകം വിശദീകരിക്കാതെ സംരക്ഷിച്ചു.
- source_word: וְתֹאחֵז בְּמִשְׁפָּט יָדִי
  choice: എന്റെ കൈ ന്യായവിധി കൈക്കൊള്ളുമ്പോൾ
  rationale: אחז ב എന്നത് ‘പിടിക്കുക/കൈക്കൊള്ളുക’; מִשְׁפָּט ഇവിടെ നീതിന്യായപരമായ വിധിയും അതിന്റെ നടപ്പാക്കലും ഉൾക്കൊള്ളുന്നു. ‘ന്യായവിധി കൈക്കൊള്ളുക’ എന്നത് ഉദ്ദേശപൂർവം അല്പം കാവ്യാത്മകമായി നിലനിർത്തി.
- source_word: אָשִׁיב נָקָם
  choice: ഞാൻ ... പ്രതികാരം ചെയ്യും
  rationale: ശാബ്ദിക ആശയം ‘പ്രതികാരം തിരികെ നൽകുക’ എന്നതാണ്. സാധാരണ മലയാളത്തിൽ സ്വാഭാവികവും അർത്ഥസമ്പൂർണ്ണവുമായ ‘പ്രതികാരം ചെയ്യും’ തെരഞ്ഞെടുത്തു.
- source_word: אֲשַׁלֵּם
  choice: ഞാൻ പകരം നൽകും
  rationale: שלם എന്ന രൂപം ചെയ്തതിനൊത്ത പ്രതിഫലം നൽകുക, തിരിച്ചടയ്ക്കുക എന്ന ആശയം വഹിക്കുന്നു. ‘പകരം നൽകും’ പ്രതികാരപരമായ നീതിയുടെ സന്ദർഭം സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: ദൈവിക പ്രതികാരവും ന്യായവിധിയും തമ്മിലുള്ള ബന്ധം
  choice: ‘ന്യായവിധി’, ‘പ്രതികാരം’, ‘പകരം നൽകും’ എന്നീ നേരിട്ടുള്ള പദങ്ങൾ നിലനിർത്തി.
  alternative: ഭാഷ മൃദുവാക്കി ‘നീതി നടപ്പാക്കും’ എന്നു പൊതുവാക്കുക.
  rationale: മൂലപാഠം ദൈവത്തിന്റെ ന്യായവിധിയെയും ശത്രുക്കൾക്കുള്ള പ്രതികാരപരമായ പ്രതിഫലത്തെയും വ്യക്തമായി ചേർക്കുന്നു. അതിലെ സംഘർഷം മൃദൂകരിക്കാതെ സംരക്ഷിച്ചു.
- issue: אִם എന്നതിന്റെ വ്യവസ്ഥാസൂചകമോ സമയസൂചകമോ ആയ വായന
  choice: ‘-മ്പോൾ’ എന്ന സമയസൂചക വായന
  alternative: ‘എങ്കിൽ’ എന്ന വ്യവസ്ഥാസൂചക വായന
  rationale: കാവ്യസന്ദർഭത്തിൽ വരാനിരിക്കുന്ന നടപടി സംശയാസ്പദമായ നിബന്ധനയായി അല്ല, ഉറപ്പുള്ള സംഭവക്രമമായി അവതരിപ്പിക്കപ്പെടുന്നു. എന്നിരുന്നാലും ഹീബ്രു പദത്തിന് വ്യവസ്ഥാസൂചക സാധ്യതയുണ്ടെന്നത് അംഗീകരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമേറിയ മലയാളം. ഹീബ്രു കാവ്യത്തിന്റെ സമാന്തരഘടന നാല് വരികളായി സൂക്ഷിച്ചു. അസ്വാഭാവികമായ അതിശാബ്ദികത ഒഴിവാക്കിയെങ്കിലും ‘വാളിന്റെ മിന്നൽ’, ‘ന്യായവിധി കൈക്കൊള്ളുക’ എന്നീ മുഖ്യരൂപകങ്ങൾ നിലനിർത്തി.
