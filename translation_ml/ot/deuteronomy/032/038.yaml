id: DEU.32.38
reference: Deuteronomy 32:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֲשֶׁ֨ר חֵ֤לֶב זְבָחֵ֨י/מוֹ֙ יֹאכֵ֔לוּ יִשְׁתּ֖וּ יֵ֣ין נְסִיכָ֑/ם יָק֨וּמוּ֙ וְ/יַעְזְרֻ/כֶ֔ם יְהִ֥י עֲלֵי/כֶ֖ם סִתְרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/038.yaml
  text: who ate the fat of their sacrifices and drank the wine of their drink offerings—let them rise up and help you; let them be your shelter.
translation:
  language: ml
  text: അവരുടെ ബലികളുടെ മേദസ്സ് തിന്നുകയും അവരുടെ പാനീയയാഗങ്ങളുടെ വീഞ്ഞ് കുടിക്കുകയും ചെയ്തവർ അവർ എഴുന്നേറ്റ് നിങ്ങളെ സഹായിക്കട്ടെ; അവർ നിങ്ങൾക്കു മറയായിരിക്കട്ടെ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֵלֶב זְבָחֵימוֹ
  choice: അവരുടെ ബലികളുടെ മേദസ്സ്
  rationale: חֵלֶב എന്നത് യാഗമൃഗങ്ങളുടെ ‘മേദസ്സ്’ എന്ന നിർദിഷ്ട അർഥത്തിൽ നിലനിർത്തി; זְבָחִים എന്നത് സ്വാഭാവികമായി ‘ബലികൾ’ എന്നു നൽകി.
- source_word: יֵין נְסִיכָם
  choice: അവരുടെ പാനീയയാഗങ്ങളുടെ വീഞ്ഞ്
  rationale: נֶסֶךְ ഇവിടെ ഒഴിച്ചർപ്പിക്കുന്ന പാനീയയാഗത്തെ സൂചിപ്പിക്കുന്നു; അതിലെ വീഞ്ഞ് എന്ന ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: סִתְרָה
  choice: മറ
  rationale: സתר ധാതുവിന്റെ മറയ്ക്കുക/ഒളിപ്പിക്കുക എന്ന ആശയം സൂക്ഷിക്കുന്ന ‘മറ’ തിരഞ്ഞെടുത്തു; ‘അഭയം’ എന്ന വ്യാഖ്യാനപരമായ വിപുലീകരണം ഒഴിവാക്കി.
theological_decisions:
- issue: വിഗ്രഹദേവന്മാരോടുള്ള പരിഹാസാത്മക വെല്ലുവിളി
  choice: ‘അവർ എവിടെ?’ എന്ന മുൻവാക്യത്തിന്റെ തുടർച്ചയായി, ‘അവർ എഴുന്നേറ്റു... സഹായിക്കട്ടെ’ എന്ന വെല്ലുവിളി നിലനിർത്തി.
  alternative: ദേവന്മാരെ നേരിട്ട് പേരെടുത്ത് പറയുക
  rationale: എബ്രായത്തിൽ ഈ വാക്യത്തിൽ കർത്താവ് സർവനാമത്തിലൂടെ തുടരുന്നു; പേരെടുത്ത് ചേർക്കുന്നത് മൂലപാഠത്തിലില്ലാത്ത വിശദീകരണമാകും.
- issue: יְהִי עֲלֵיכֶם סִתְרָה എന്ന വാക്യത്തിന്റെ ഭാവം
  choice: ‘അവർ നിങ്ങൾക്കു മറയായിരിക്കട്ടെ’
  alternative: ‘അത് നിങ്ങൾക്കു മറയായിരിക്കട്ടെ’ അല്ലെങ്കിൽ ‘അവൻ നിങ്ങൾക്കു മറയായിരിക്കട്ടെ’
  rationale: ക്രിയ ഏകവചനമായിരുന്നാലും സമുച്ചയവിഷയത്തോടുള്ള ഏകവചന ക്രിയ എബ്രായത്തിൽ സാധ്യമാണ്; മുൻപുള്ള ബഹുവചന ആജ്ഞകളോടുള്ള ബന്ധം സ്വാഭാവികമായി നിലനിർത്തി, അനിശ്ചിതത്വം വ്യാഖ്യാനിച്ച് മാറ്റിയില്ല.
translation_notes:
  register: ആധുനിക പ്രമാണ മലയാളത്തിൽ ഗൗരവവും വായനാസൗകര്യവും നിലനിർത്തി. മുൻവാക്യത്തിൽ ആരംഭിക്കുന്ന ചോദ്യത്തിന്റെ തുടർച്ചയായതിനാൽ മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി ‘എവിടെ?’ ചേർത്തു. ‘പാനീയയാഗം’, ‘മേദസ്സ്’ എന്നീ ആരാധനാസംബന്ധിയായ പദങ്ങൾ കൃത്യതയ്ക്കായി ഉപയോഗിച്ചു.
