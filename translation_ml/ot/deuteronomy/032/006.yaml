id: DEU.32.6
reference: Deuteronomy 32:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הֲ לַ/יְהוָה֙ תִּגְמְלוּ זֹ֔את עַ֥ם נָבָ֖ל וְ/לֹ֣א חָכָ֑ם הֲ/לוֹא הוּא֙ אָבִ֣י/ךָ קָּנֶ֔/ךָ ה֥וּא עָֽשְׂ/ךָ֖ וַֽ/יְכֹנְנֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/006.yaml
  text: Is this how you repay Yahweh[a], O foolish and unwise people? Is he not your Father, who created you? He made you and established you.
translation:
  language: ml
  text: മൂഢരും വിവേകമില്ലാത്തവരുമായ ജനമേ, നിങ്ങൾ യാഹ്‌വേക്കു ഇങ്ങനെ തിരിച്ചടയ്ക്കുന്നുവോ? നിങ്ങളെ സ്വന്തമാക്കിയവൻ നിങ്ങളുടെ പിതാവല്ലയോ?[a] അവിടുന്ന് നിങ്ങളെ ഉണ്ടാക്കുകയും സ്ഥാപിക്കുകയും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «നിങ്ങളെ സ്വന്തമാക്കിയവൻ» എന്നതിന് «നിങ്ങളെ സൃഷ്ടിച്ചവൻ» അല്ലെങ്കിൽ «നിങ്ങളെ വാങ്ങിയവൻ» എന്നും അർത്ഥമാക്കാം. ഹീബ്രു ക്രിയയ്ക്ക് സ്വന്തമാക്കുക, കൈവശമാക്കുക, വാങ്ങുക, ചില സന്ദർഭങ്ങളിൽ സൃഷ്ടിക്കുക എന്നീ അർത്ഥങ്ങളുണ്ട്.
    reason: കָנֶךָ എന്ന ഹീബ്രു പദത്തിന്റെ പ്രസക്തമായ അർത്ഥസാധ്യതകൾ നിലനിർത്താൻ.
lexical_decisions:
- source_word: תִּגְמְלוּ
  choice: പ്രതിഫലം ചെയ്യുന്നത്
  rationale: ഗമൽ എന്ന ക്രിയ ഇവിടെ ഒരാളുടെ പ്രവൃത്തിക്കനുസരിച്ച് തിരികെ പെരുമാറുന്നതിനെ സൂചിപ്പിക്കുന്നു. ശാസനാരൂപമായ ചോദ്യത്തിൽ ‘പ്രതിഫലം ചെയ്യുക’ എന്നത് ആ തിരിച്ചുനൽകൽഭാവം നിലനിർത്തുന്നു.
- source_word: זֹאת
  choice: ഇങ്ങനെ
  rationale: മുമ്പ് വിവരിച്ച ഇസ്രായേലിന്റെ പെരുമാറ്റരീതിയിലേക്കാണ് സൂചകപദം വിരൽചൂണ്ടുന്നത്; മലയാളത്തിൽ ‘ഇങ്ങനെയാണോ’ സ്വാഭാവികമായി ആ രീതിഭാവം നൽകുന്നു.
- source_word: עַם נָבָל וְלֹא חָכָם
  choice: മൂഢരും വിവേകമില്ലാത്തവരുമായ ജനമേ
  rationale: נָבָל വെറും ബുദ്ധിക്കുറവല്ല, ധാർമികമായ മൂഢത്വവും അപമാനകരമായ പെരുമാറ്റവും സൂചിപ്പിക്കുന്നു. לֹא חָכָם എന്ന നിഷേധം ‘വിവേകമില്ലാത്തവർ’ എന്ന് സ്വാഭാവികമായി നൽകിയിരിക്കുന്നു; ‘ജനമേ’ സംബോധനാഭാവം വ്യക്തമാക്കുന്നു.
- source_word: הֲלוֹא
  choice: അവിടുന്നല്ലയോ?
  rationale: അനുകൂലമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന ആലങ്കാരിക ചോദ്യം മലയാളത്തിലെ ‘അല്ലയോ’ ഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: אָבִיךָ
  choice: നിങ്ങളുടെ പിതാവ്
  rationale: ദൈവവും ഇസ്രായേലും തമ്മിലുള്ള പിതൃബന്ധം വാചകം നേരിട്ട് പ്രസ്താവിക്കുന്നു; ബഹുമാനപൂർവമായ ദൈവസർവനാമത്തോടൊപ്പം സ്വാഭാവികമായ മലയാളം ഉപയോഗിച്ചു.
- source_word: קָּנֶךָ
  choice: നിങ്ങളെ സ്വന്തമാക്കിയ
  rationale: קנה എന്നതിന് സമ്പാദിക്കുക, സ്വന്തമാക്കുക, വാങ്ങുക, ചില സന്ദർഭങ്ങളിൽ സൃഷ്ടിക്കുക എന്നീ അർത്ഥങ്ങളുണ്ട്. പിന്നാലെ ‘ഉണ്ടാക്കി’, ‘സ്ഥാപിച്ചു’ എന്നീ വേറിട്ട ക്രിയകൾ വരുന്നതിനാൽ ‘സ്വന്തമാക്കിയ’ എന്നത് പദവ്യത്യാസവും ഉടമസ്ഥത/ബന്ധഭാവവും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: עָשְׂךָ
  choice: നിങ്ങളെ ഉണ്ടാക്കുകയും
  rationale: ഈ സന്ദർഭത്തിൽ עשה ദൈവം ഇസ്രായേലിനെ ഉണ്ടാക്കിയതിനെ സൂചിപ്പിക്കുന്നു; ‘ഉണ്ടാക്കുക’ നേരിട്ടും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമാണ്.
- source_word: וַיְכֹנְנֶךָ
  choice: സ്ഥാപിക്കുകയും ചെയ്തു
  rationale: כון ഇവിടെ ഉറപ്പിക്കുക, നിലനിറുത്തുക, ക്രമപ്പെടുത്തി സ്ഥാപിക്കുക എന്ന ആശയം നൽകുന്നു. ‘സ്ഥാപിച്ചു’ എന്നത് ‘ഉണ്ടാക്കി’ എന്നതിൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാൽ മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
theological_decisions:
- issue: ദൈവവും ഇസ്രായേലും സംബന്ധിച്ച് קנה എന്ന ക്രിയയുടെ അർത്ഥം
  choice: നിങ്ങളെ സ്വന്തമാക്കിയ
  alternative: നിങ്ങളെ സൃഷ്ടിച്ച; നിങ്ങളെ വിലയ്ക്കു വാങ്ങിയ
  rationale: മൂലക്രിയയ്ക്ക് പല അർത്ഥസാധ്യതകളുണ്ട്. തുടർന്നുള്ള ‘ഉണ്ടാക്കി’, ‘സ്ഥാപിച്ചു’ എന്നീ സൃഷ്ടി/രൂപീകരണ പദങ്ങളിൽ നിന്ന് വ്യത്യാസം കാത്തുസൂക്ഷിക്കാൻ ‘സ്വന്തമാക്കിയ’ തിരഞ്ഞെടുത്തു. യഥാർത്ഥ ബഹുവ്യാഖ്യത അന്തർലീനമായി നിലനിൽക്കുന്നു.
- issue: ദൈവത്തിന്റെ പിതൃത്വഭാഷ
  choice: നിങ്ങളുടെ പിതാവ്
  alternative: നിങ്ങളുടെ അപ്പൻ
  rationale: വാചകം യാഹ്‌വേയെ ഇസ്രായേലിന്റെ പിതാവായി നേരിട്ട് വിശേഷിപ്പിക്കുന്നു. ആധുനികവും ഗൗരവമുള്ളതുമായ രജിസ്റ്ററിനായി ‘പിതാവ്’ ഉപയോഗിച്ചു; അധികമായ സിദ്ധാന്തവ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളെങ്കിലും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ശൈലി. ഹീബ്രുവിലെ ഏകവചനസംബോധനയ്ക്ക് മലയാളത്തിൽ സമൂഹത്തോടുള്ള ആദര/ബഹുവചനരൂപമായ ‘നിങ്ങൾ’ ഉപയോഗിച്ചു. കാവ്യാത്മകമായ ശാസനാഭാവവും രണ്ട് ആലങ്കാരിക ചോദ്യങ്ങളും നിലനിർത്തി.
