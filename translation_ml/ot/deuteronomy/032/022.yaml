reference: Deuteronomy 32:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּי אֵשׁ֙ קָדְחָ֣ה בְ/אַפִּ֔/י וַ/תִּיקַ֖ד עַד שְׁא֣וֹל תַּחְתִּ֑ית וַ/תֹּ֤אכַל אֶ֨רֶץ֙ וִֽ/יבֻלָ֔/הּ וַ/תְּלַהֵ֖ט מוֹסְדֵ֥י הָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/022.yaml
  text: For a fire has been kindled in my anger[a], and it burns to the depths of Sheol; it devours the earth and its produce, and sets ablaze the foundations of the mountains.
translation:
  language: ml
  text: എന്തെന്നാൽ, എന്റെ കോപത്തിൽ ഒരു തീ ജ്വലിച്ചിരിക്കുന്നു; അത് അധോലോകത്തിന്റെ ആഴങ്ങളോളം കത്തുന്നു[a]. അത് ഭൂമിയെയും അതിന്റെ വിളവിനെയും വിഴുങ്ങുന്നു; പർവതങ്ങളുടെ അടിസ്ഥാനങ്ങളെ തീപിടിപ്പിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രുവിൽ: ‘ഷെയോൽ, ഏറ്റവും താഴെയുള്ളത്/ആഴത്തിലുള്ളത്.’ ‘ഷെയോലിന്റെ ആഴങ്ങളോളം’ എന്നും പരിഭാഷപ്പെടുത്താം.'
    reason: תַּחְתִּית എന്ന പദത്തിന്റെ ‘ഏറ്റവും താഴെയുള്ള/ആഴത്തിലുള്ള’ എന്ന അർഥവും שְׁאוֹל എന്ന പദത്തിന്റെ പേരുരൂപവും സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: כִּי
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ ന്യായവിധിയുടെ വിശദീകരണമോ കാരണമോ അവതരിപ്പിക്കുന്ന ബന്ധകശക്തി നിലനിർത്തുന്നു.
- source_word: אֵשׁ קָדְחָה
  choice: ഒരു തീ ജ്വലിച്ചിരിക്കുന്നു
  rationale: തീ കത്തിത്തുടങ്ങിയതും ഇപ്പോഴും അതിന്റെ ഫലം നിലനിൽക്കുന്നതുമായ പൂർണ്ണക്രിയയുടെ ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְאַפִּי
  choice: എന്റെ കോപത്തിൽ
  rationale: אַף എന്നതിന്റെ അക്ഷരാർഥമായ ‘മൂക്ക്’ എന്നതിനുപകരം ഇവിടെ വ്യക്തമായിരിക്കുന്ന കോപം എന്ന ഹീബ്രു പ്രയോഗാർഥം നൽകുന്നു.
- source_word: וַתִּיקַד
  choice: അത് ... കത്തുന്നു
  rationale: തീയുടെ തുടർച്ചയായ ജ്വലനം നേരായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: עַד שְׁאוֹל תַּחְתִּית
  choice: അധോലോകത്തിന്റെ ആഴങ്ങളോളം
  rationale: שְׁאוֹל സൂചിപ്പിക്കുന്ന മരിച്ചവരുടെ ലോകത്തെ ‘നരകം’ എന്നു സിദ്ധാന്തപരമായി ചുരുക്കാതെ, תַּחְתִּית നൽകുന്ന ഏറ്റവും താഴെയുള്ള/ആഴത്തിലുള്ള എന്ന ശക്തിയും സംരക്ഷിക്കുന്നു.
- source_word: וַתֹּאכַל
  choice: വിഴുങ്ങുന്നു
  rationale: തീ ‘തിന്നുന്നു’ എന്ന സജീവ രൂപകം സ്വാഭാവിക മലയാളത്തിൽ ശക്തമായി നിലനിർത്തുന്നു.
- source_word: אֶרֶץ
  choice: ഭൂമി
  rationale: അധോലോകം, പർവതങ്ങളുടെ അടിസ്ഥാനങ്ങൾ എന്നിവയോടൊപ്പമുള്ള വിശാലമായ പ്രാപഞ്ചിക പശ്ചാത്തലത്തിന് യോജിക്കുന്നു; ‘ദേശം’ എന്ന പ്രാദേശിക അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: יְבֻלָהּ
  choice: അതിന്റെ വിളവ്
  rationale: ഭൂമി ഉൽപ്പാദിപ്പിക്കുന്നതിനെ പൊതുവായും വ്യക്തമായും സൂചിപ്പിക്കുന്നു.
- source_word: וַתְּלַהֵט
  choice: തീപിടിപ്പിക്കുന്നു
  rationale: ക്രിയയുടെ ശക്തമായ കാരണാർത്ഥവും അഗ്നിചിത്രവും മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מוֹסְדֵי הָרִים
  choice: പർവതങ്ങളുടെ അടിസ്ഥാനങ്ങൾ
  rationale: പർവതങ്ങളുടെ ഏറ്റവും ആഴത്തിലുള്ള ഘടനാഭാഗങ്ങളെ സൂചിപ്പിക്കുന്ന മൂലചിത്രം നിലനിർത്തുന്നു.
theological_decisions:
- issue: שְׁאוֹל എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: അധോലോകം
  alternative: ശവക്കുഴി; ഷെയോൽ; നരകം
  rationale: ഈ ഹീബ്രു പദം മരിച്ചവരുടെ ലോകത്തെ സൂചിപ്പിക്കുന്നു. ‘നരകം’ എന്നു നൽകിയാൽ പിൽക്കാല സിദ്ധാന്തസങ്കൽപ്പം വാക്യത്തിലേക്ക് ഇറക്കുമതി ചെയ്യപ്പെടും; ‘ശവക്കുഴി’ എന്നു നൽകിയാൽ അർഥവ്യാപ്തി ചുരുങ്ങും. ‘അധോലോകം’ പഴയനിയമത്തിലെ ആശയപരിസരം വ്യക്തവും സ്വാഭാവികവുമായി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കാവ്യഭാഷ. അപൂർവമായ ലിപ്യന്തരണം മുഖ്യവാക്യത്തിൽ ഒഴിവാക്കി ‘അധോലോകം’ ഉപയോഗിച്ചു; ‘ഷെയോൽ’ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു. തീയുടെ സജീവ രൂപകങ്ങളും വാക്യത്തിന്റെ പ്രാപഞ്ചിക വ്യാപ്തിയും നിലനിർത്തി.
