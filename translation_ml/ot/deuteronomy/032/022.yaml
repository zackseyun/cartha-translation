  naturalness: വാക്യം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ള കാവ്യരജിസ്റ്ററിനൊത്തതുമാണ്. ‘വിഴുങ്ങുന്നു,’ ‘തീപിടിപ്പിക്കുന്നു’ എന്നിവ അഗ്നിയുടെ സജീവരൂപകത്തിന് യോജിക്കുന്നു.
  terminology: ‘കോപം,’ ‘അധോലോകം,’ ‘ഭൂമി,’ ‘വിളവ്,’ ‘പർവതങ്ങളുടെ അടിസ്ഥാനങ്ങൾ’ എന്നിവ സുസ്ഥിരവും സന്ദർഭോചിതവുമാണ്. എന്നാൽ അടിക്കുറിപ്പിലെ ‘അക്ഷരാർഥത്തിൽ’ എന്ന പ്രസ്താവന ഹീബ്രു പദമായ שְׁאוֹל-നെ ‘അധോലോകം’ എന്നു വ്യാഖ്യാനപരമായി മാറ്റിക്കൊണ്ടാണ് അവതരിപ്പിക്കുന്നത്; അതിനാൽ അത് തിരുത്തണം.
