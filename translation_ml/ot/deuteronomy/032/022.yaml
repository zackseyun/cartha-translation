    rationale: ഹീബ്രുവിൽ שְׁאוֹל എന്ന പദമാണ് ഉള്ളത്; ‘അധോലോകം’ അതിന്റെ യോജ്യമായ വിവർത്തനമാണ്, അക്ഷരാർഥപരമായ രൂപമല്ല. ‘ഏറ്റവും താഴെയുള്ളത്/ആഴത്തിലുള്ളത്’ എന്ന വിശേഷണം תַּחְתִּית-നോടാണ് ബന്ധപ്പെട്ടിരിക്കുന്നത്. അതിനാൽ അക്ഷരാർഥ സൂചനയിൽ ‘ഷെയോൽ’ നിലനിർത്തണം.
  revised_text: എന്തെന്നാൽ, എന്റെ കോപത്തിൽ ഒരു തീ ജ്വലിച്ചിരിക്കുന്നു; അത് അധോലോകത്തിന്റെ ആഴങ്ങളോളം കത്തുന്നു[a]. അത് ഭൂമിയെയും അതിന്റെ വിളവിനെയും വിഴുങ്ങുന്നു; പർവതങ്ങളുടെ അടിസ്ഥാനങ്ങളെ തീപിടിപ്പിക്കുന്നു.
  revised_footnotes:
