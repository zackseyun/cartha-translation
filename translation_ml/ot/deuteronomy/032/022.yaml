  to: എന്തെന്നാൽ, എന്റെ കോപത്തിൽ ഒരു തീ ജ്വലിച്ചിരിക്കുന്നു; അത് അധോലോകത്തിന്റെ ആഴങ്ങളോളം കത്തുന്നു[a]. അത് ഭൂമിയെയും അതിന്റെ വിളവിനെയും വിഴുങ്ങുന്നു; പർവതങ്ങളുടെ അടിസ്ഥാനങ്ങളെ തീപിടിപ്പിക്കുന്നു.
  rationale: 'മുഖ്യവാക്യത്തിൽ സുരക്ഷിതമായ തിരുത്തൽ ആവശ്യമില്ല. എന്നാൽ അടിക്കുറിപ്പിലെ അക്ഷരാർഥ അവകാശവാദം ശുദ്ധീകരിച്ചു: שְׁאוֹל-ന്റെ വിവർത്തനമായ ‘അധോലോകം’ അക്ഷരാർഥമായി അവതരിപ്പിക്കാതെ, ഹീബ്രു രൂപമായ ‘ഷെയോൽ’ നിലനിർത്തുന്നു. ഇതിലൂടെ മൂലപാഠത്തിന്റെ പദപരവും ആശയപരവുമായ അനിശ്ചിതത്വം സംരക്ഷിക്കപ്പെടുന്നു.'
