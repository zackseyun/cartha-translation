  revised_text: അവരുടെ മുന്തിരിവള്ളി സൊദോമിലെ മുന്തിരിവള്ളിയിൽനിന്നുള്ളതും ഗൊമോറയുടെ വയലുകളിൽനിന്നുള്ളതുമാകുന്നു; അവരുടെ മുന്തിരിപ്പഴങ്ങൾ വിഷമുള്ള മുന്തിരിപ്പഴങ്ങളും അവരുടെ കുലകൾ അവർക്കു കയ്പുള്ളവയും ആകുന്നു.
