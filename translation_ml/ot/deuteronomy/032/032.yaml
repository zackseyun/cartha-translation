id: DEU.32.32
reference: Deuteronomy 32:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּֽי מִ/גֶּ֤פֶן סְדֹם֙ גַּפְנָ֔/ם וּ/מִ/שַּׁדְמֹ֖ת עֲמֹרָ֑ה עֲנָבֵ֨/מוֹ֙ עִנְּבֵי ר֔וֹשׁ אַשְׁכְּלֹ֥ת מְרֹרֹ֖ת לָֽ/מוֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/032.yaml
  text: For their vine is from the vine of Sodom, and from the fields of Gomorrah; their grapes are grapes of poison, their clusters are bitter to them.
translation:
  language: ml
  text: അവരുടെ മുന്തിരിവള്ളി സൊദോമിലെ മുന്തിരിവള്ളിയിൽനിന്നുള്ളതും ഗൊമോറയുടെ വയലുകളിൽനിന്നുള്ളതുമാകുന്നു; അവരുടെ മുന്തിരിപ്പഴങ്ങൾ വിഷമുള്ള മുന്തിരിപ്പഴങ്ങളും അവരുടെ കുലകൾ അവർക്കു കയ്പുള്ളവയും ആകുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גֶּפֶן / גַּפְנָם
  choice: മുന്തിരിവള്ളി / അവരുടെ മുന്തിരിവള്ളി
  rationale: ഒരേ എബ്രായ പദത്തിന്റെ ആവർത്തനം നിലനിർത്തുകയും മുന്തിരിവള്ളിയുടെ ഉറവിടത്തെക്കുറിച്ചുള്ള രൂപകം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: שַׁדְמוֹת
  choice: വയലുകൾ
  rationale: കൃഷിഭൂമിയെയോ വയൽപ്രദേശങ്ങളെയോ സൂചിപ്പിക്കുന്ന പൊതുവായ അർഥം; സന്ദർഭത്തിൽ ലളിതവും കൃത്യവും.
- source_word: עִנְּבֵי רוֹשׁ
  choice: വിഷക്കനികൾ
  rationale: רֹאשׁ ഇവിടെ വിഷമുള്ളതോ മാരകമായതോ ആയ സസ്യവസ്തുവിനെ സൂചിപ്പിക്കുന്നു. പ്രത്യേക സസ്യം അനിശ്ചിതമായതിനാൽ അതിനെ നിർണ്ണയിക്കാതെ വിഷസ്വഭാവം വ്യക്തമാക്കുന്നു.
- source_word: אַשְׁכְּלֹת מְרֹרֹת
  choice: കയ്പുള്ള കുലകൾ
  rationale: മുന്തിരിക്കുലകളെയും അവയുടെ കയ്പിനെയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: לָמוֹ
  choice: അവർക്കു
  rationale: മസോററ്റിക് പാഠത്തിലെ സർവനാമപ്രയോഗം ഒഴിവാക്കാതെ വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: സൊദോമിന്റെയും ഗൊമോറയുടെയും പരാമർശത്തിന്റെ രൂപകസ്വഭാവം
  choice: ഉറവിടത്തെ സൂചിപ്പിക്കുന്ന രൂപകമായി നേരിട്ട് നിലനിർത്തി
  alternative: അവരുടെ ദുഷ്ടത സൊദോമിനെയും ഗൊമോറയെയും പോലെയാണ് എന്ന് വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കുക
  rationale: മൂലപാഠം മുന്തിരിവള്ളിയുടെയും വയലുകളുടെയും ദൃശ്യരൂപം ഉപയോഗിക്കുന്നു; അതിന്റെ നൈതിക-ദൈവശാസ്ത്ര സൂചന വിവർത്തനത്തിൽ വിശദീകരിച്ച് ചുരുക്കിയിട്ടില്ല.
- issue: לָמוֹ എന്നതിന്റെ പ്രകടനം
  choice: അവർക്കു കയ്പുള്ളവ
  alternative: കയ്പുള്ളവ മാത്രം
  rationale: മൂലപാഠത്തിലെ ദാതൃസർവനാമം സംരക്ഷിക്കുകയും ഇംഗ്ലീഷ് പരിശോധനാപാളിയിലെ ഏറ്റവും പുതിയ പരിഷ്കാരവുമായി യോജിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എബ്രായ സമാന്തരഘടനയും ദൃശ്യരൂപവും കഴിയുന്നത്ര നിലനിർത്തിയിരിക്കുന്നു.
