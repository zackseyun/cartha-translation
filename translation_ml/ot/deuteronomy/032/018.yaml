id: DEU.32.18
reference: Deuteronomy 32:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: צ֥וּר יְלָדְ/ךָ֖ תֶּ֑שִׁי וַ/תִּשְׁכַּ֖ח אֵ֥ל מְחֹלְלֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/018.yaml
  text: You neglected the Rock who fathered you[c][b][a], and forgot the God who gave you birth.
translation:
  language: ml
  text: നിന്നെ ജനിപ്പിച്ച പാറയെ നീ അവഗണിച്ചു[a]; നിന്നെ പ്രസവിച്ച ദൈവത്തെ നീ മറന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവഗണിച്ചു’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന എബ്രായക്രിയയുടെ അർഥം ദുഷ്കരമാണ്; ‘മറന്നു’ എന്നോ ‘ഓർക്കാതിരുന്നു’ എന്നോ പരിഭാഷപ്പെടുത്താനും കഴിയും.
    reason: lexical_alternative
  - marker: b
    text: ‘നിന്നെ പ്രസവിച്ച ദൈവം’ എന്നതിന് ‘നിന്നെ പുറപ്പെടുവിച്ച ദൈവം’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായത്തിൽ പ്രസവത്തിന്റെ രൂപകമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: צוּר
  choice: പാറ
  rationale: ഇവിടെ പദത്തിന്റെ അക്ഷരാർഥമായ ‘പാറ’ ദൈവത്തെ സൂചിപ്പിക്കുന്ന ഗാഢമായ ഒരു വിശേഷണനാമമാണ്; രൂപകം അതേപടി നിലനിർത്തുന്നു.
- source_word: יְלָדְךָ
  choice: നിന്നെ ജനിപ്പിച്ച
  rationale: Qal രൂപത്തിലുള്ള ילד ഇവിടെ ജനിപ്പിക്കുക/പിതാവാകുക എന്ന ആശയം നൽകുന്നു. ‘ജനിപ്പിച്ച’ എന്നത് പിതൃസൂചന നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: תֶּשִׁי
  choice: നീ അവഗണിച്ചു
  rationale: ക്രിയയുടെ അർഥം ദുഷ്കരമാണ്. തുടർന്നുള്ള ‘മറന്നു’ എന്ന സമാന്തരപ്രയോഗത്തിന്റെ വെളിച്ചത്തിൽ, കുറ്റകരമായ അനാസ്ഥയെ സൂചിപ്പിക്കുന്ന ‘അവഗണിച്ചു’ യോജിക്കുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וַתִּשְׁכַּח
  choice: നീ മറന്നു
  rationale: രണ്ടാം പുരുഷ ഏകവചനത്തിലുള്ള കുറ്റാരോപണം നേരിട്ട് തുടരുകയും കവിതയിലെ സമാന്തരത നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: אֵל
  choice: ദൈവം
  rationale: ഇവിടെ אֵל ഇസ്രായേലിന്റെ ദൈവത്തെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘ദൈവം’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: מְחֹלְלֶךָ
  choice: നിന്നെ പ്രസവിച്ച
  rationale: חול എന്ന ധാതുവിന്റെ ഈ രൂപം പ്രസവവേദനയെയും പ്രസവിച്ച് പുറപ്പെടുവിക്കുന്നതിനെയും സൂചിപ്പിക്കാം. ‘പ്രസവിച്ച’ എന്നത് ജനനരൂപകം വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദൈവത്തെക്കുറിച്ചുള്ള പിതൃ-മാതൃ ജനനരൂപകങ്ങൾ
  choice: ‘നിന്നെ ജനിപ്പിച്ച’ എന്നും ‘നിന്നെ പ്രസവിച്ച’ എന്നും ഉള്ള വ്യത്യസ്ത ജനനരൂപകങ്ങൾ മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
  alternative: ‘നിന്നെ സൃഷ്ടിച്ച’ അല്ലെങ്കിൽ ‘നിന്നെ രൂപപ്പെടുത്തിയ’ എന്ന പൊതുവായ സൃഷ്ടിഭാഷ ഉപയോഗിക്കുക.
  rationale: എബ്രായപാഠം ജനിപ്പിക്കൽ എന്ന പിതൃസൂചനയും പ്രസവം എന്ന മാതൃസൂചനയും ഉദ്ദേശപൂർവം ചേർത്തുനിർത്തുന്നു. പൊതുവായ സൃഷ്ടിഭാഷയാക്കി മാറ്റുന്നത് ഈ കാവ്യാത്മകവും ദൈവശാസ്ത്രപരവുമായ സംഘർഷം മായ്ച്ചുകളയും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കാവ്യഭാഷ. ‘പാറ’ എന്ന ദൈവിക വിശേഷണം അക്ഷരാർഥരൂപകമായി നിലനിർത്തി; ‘ജനിപ്പിച്ച/പ്രസവിച്ച’ എന്ന സമാന്തരതയിലൂടെ മൂലപാഠത്തിലെ വ്യത്യസ്ത മാതാപിതൃചിത്രങ്ങൾ സംരക്ഷിച്ചു.
