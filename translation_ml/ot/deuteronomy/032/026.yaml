source:
  edition: WLC
  text: אָמַ֖רְתִּי אַפְאֵי/הֶ֑ם אַשְׁבִּ֥יתָה מֵ/אֱנ֖וֹשׁ זִכְרָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/026.yaml
  text: I said[a], ‘I would scatter them[b]; I would make their memory cease from mankind,’
translation:
  language: ml
  text: 'ഞാൻ പറഞ്ഞു: “ഞാൻ അവരെ ചിതറിച്ചുകളയും[a]; മനുഷ്യരുടെ ഇടയിൽനിന്ന്[b] അവരുടെ ഓർമ ഇല്ലാതാക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അവരെ ഊതിപ്പറത്തും / പിരിച്ചുവിടും.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ ക്രിയ അത്യപൂർവവും അർഥനിർണയം ദുഷ്കരവുമാണ്. അവരെ കോണുകളിലേക്കു നീക്കുക എന്നോ കാഴ്ചയിൽനിന്ന് അകറ്റുക എന്നോ ചിലർ മനസ്സിലാക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “മനുഷ്യനിൽനിന്ന്” അല്ലെങ്കിൽ “മർത്യരിൽനിന്ന്.” എബ്രായത്തിൽ മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്ന ഒരു ഏകവചന സമൂഹനാമമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: ഞാൻ പറഞ്ഞു
  rationale: אמר എന്ന ക്രിയയുടെ കാൽ സമാപ്തരൂപം, ഒന്നാംപുരുഷ ഏകവചനം. ദൈവത്തിന്റെ പ്രസ്താവിത ഉദ്ദേശ്യം അവതരിപ്പിക്കുന്നതിനാൽ നേരിട്ടുള്ള ഈ പരിഭാഷ യോജിക്കുന്നു.
- source_word: אַפְאֵיהֶם
  choice: ഞാൻ അവരെ ചിതറിച്ചുകളയുമായിരുന്നു
  rationale: അത്യപൂർവവും അർഥനിർണയം ദുഷ്കരവുമായ രൂപമാണിത്; ചിതറിക്കുക, ഊതിപ്പറത്തുക, കോണുകളിലേക്കു നീക്കുക എന്നീ ധാരണകൾ നിർദേശിക്കപ്പെട്ടിട്ടുണ്ട്. തുടർന്നുള്ള ഓർമ ഇല്ലാതാക്കൽ എന്ന ആശയത്തോട് ചേർന്ന്, വിധിയുടെ ഭീഷണി വ്യക്തമായി അറിയിക്കാൻ ‘ചിതറിച്ചുകളയുക’ തിരഞ്ഞെടുത്തു; അപൂർവ പദത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: אַשְׁבִּיתָה
  choice: ഇല്ലാതാക്കുമായിരുന്നു
  rationale: שבת എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ‘നിലച്ചുപോകാൻ ഇടയാക്കുക’ എന്നാണ്. ‘ഓർമ’ കർമമായതിനാൽ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ ‘ഓർമ ഇല്ലാതാക്കുക’ മൂലാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: מֵאֱנוֹשׁ
  choice: മനുഷ്യരുടെ ഇടയിൽനിന്ന്
  rationale: אֱנוֹשׁ ഇവിടെ മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്ന ഏകവചന സമൂഹനാമമാണ്; മനുഷ്യരുടെ ലോകത്തിൽനിന്ന് അവരുടെ ഓർമ മായുന്നതെന്ന ആശയം ഈ പ്രയോഗം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: זִכְרָם
  choice: അവരുടെ ഓർമ
  rationale: זֵכֶר ഓർമയെയോ സ്മരണയെയോ സൂചിപ്പിക്കുന്നു. ‘അവരുടെ ഓർമ’ സംക്ഷിപ്തവും സ്വാഭാവികവും ആകുന്നു; ‘പേര്’ എന്ന് വ്യാഖ്യാനിച്ച് അർഥം ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: കാവ്യഭാഷയിലെ ദൈവവചനവും ഭീഷണിയായ ന്യായവിധിയും
  choice: തുടർന്നുള്ള വാക്യം ഈ ഉദ്ദേശ്യത്തിന്റെ നടപ്പാക്കലിനെ നിയന്ത്രിക്കുന്ന പശ്ചാത്തലത്തിൽ, പ്രസ്താവിത ഉദ്ദേശ്യം ‘ചെയ്യുമായിരുന്നു’ എന്ന രൂപത്തിൽ നൽകി.
  alternative: ‘ഞാൻ അവരെ ചിതറിച്ചുകളയും; അവരുടെ ഓർമ ഇല്ലാതാക്കും’ എന്ന ലളിത ഭാവികാലം.
  rationale: എബ്രായ രൂപങ്ങൾ ഉറച്ച ഉദ്ദേശ്യം പ്രകടിപ്പിക്കുന്നുവെങ്കിലും അടുത്ത വാക്യം അതിന്റെ നടപ്പാക്കലിനെക്കുറിച്ച് ഒരു നിയന്ത്രണം അവതരിപ്പിക്കുന്നു. ‘ചെയ്യുമായിരുന്നു’ എന്ന രൂപം ആ കാവ്യസന്ദർഭത്തിലെ സംഘർഷം മുൻകൂട്ടി പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കത്തക്കവണ്ണം, എന്നാൽ കാവ്യാത്മക ഗൗരവം നിലനിർത്തി പരിഭാഷപ്പെടുത്തി. അപൂർവ ക്രിയയുടെ യഥാർഥ അനിശ്ചിതത്വവും അടുത്ത വാക്യത്തിലേക്കു നീളുന്ന ദൈവിക ന്യായവിധിയുടെ സംഘർഷവും അടിക്കുറിപ്പിലും ക്രിയാരൂപത്തിലും സംരക്ഷിച്ചു.
