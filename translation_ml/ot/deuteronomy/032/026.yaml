    issue: Counterfactual-sounding verb forms in the direct divine speech
    rationale: ‘...ചെയ്യുമായിരുന്നു’ ordinarily means ‘would have done’ or conveys a hypothetical/contrary-to-fact nuance in Malayalam. This is not required by the Hebrew, and it may prematurely frame the stated resolve as counterfactual. ‘...ചെയ്യും’ preserves the declaration; verse 27 can then qualify its execution in context.
