reference: Deuteronomy 32:49
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: עֲלֵ֡ה אֶל הַר֩ הָ/עֲבָרִ֨ים הַ/זֶּ֜ה הַר נְב֗וֹ אֲשֶׁר֙ בְּ/אֶ֣רֶץ מוֹאָ֔ב אֲשֶׁ֖ר עַל פְּנֵ֣י יְרֵח֑וֹ וּ/רְאֵה֙ אֶת אֶ֣רֶץ כְּנַ֔עַן אֲשֶׁ֨ר אֲנִ֥י נֹתֵ֛ן לִ/בְנֵ֥י יִשְׂרָאֵ֖ל לַ/אֲחֻזָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/049.yaml
  text: Go up to this mountain of the Abarim[a], Mount Nebo, which is in the land of Moab, opposite Jericho, and see the land of Canaan[c][b], which I am giving to the sons of Israel as a possession.
translation:
  language: ml
  text: മോവാബ് ദേശത്ത്, യെരീഹോവിന് എതിർവശത്തുള്ള അബാരീം പർവതത്തിലെ ഈ നെബോ പർവതത്തിലേക്കു കയറുക. ഞാൻ ഇസ്രായേൽമക്കൾക്ക് സ്വത്തായി നൽകുന്ന കനാൻദേശം കാണുക.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സ്വത്തായി” എന്നതിന് “അവകാശമായി” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം സ്ഥിരമായി കൈവശംവെക്കുന്ന ഭൂസ്വത്തിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלֵה
  choice: കയറുക
  rationale: עלה എന്ന ക്രിയയുടെ പുരുഷ ഏകവചന ആജ്ഞാരൂപം ഉയരത്തിലേക്കുള്ള നീക്കം വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ ‘കയറുക’ സ്വാഭാവികവും നേരിട്ടുള്ളതുമാണ്.
- source_word: הַר הָעֲבָרִים הַזֶּה הַר נְבוֹ
  choice: അബാരീം മലനിരകളിലെ ഈ പർവതമായ നെബോ പർവതം
  rationale: അബാരീം ഭൂമിശാസ്ത്രപരമായ പേരായി ലിപ്യന്തരണം ചെയ്തു. നെബോയെ സമാനാധികരണമായി തിരിച്ചറിയിക്കുന്ന എബ്രായ ഘടന മലയാളത്തിൽ വ്യക്തമായി അവതരിപ്പിക്കുന്നു; ‘മലനിരകൾ’ ഈ ഭൂമിശാസ്ത്രനാമത്തിന്റെ പ്രദേശപരമായ സ്വഭാവം വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר בְּאֶרֶץ מוֹאָב
  choice: മോവാബ് ദേശത്ത്
  rationale: സ്ഥലനിർദേശം സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകി.
- source_word: אֲשֶׁר עַל פְּנֵי יְרֵחוֹ
  choice: യെരീഹോവിന് എതിർവശത്തുള്ള
  rationale: ഭൂമിശാസ്ത്രസന്ദർഭത്തിലെ עַל־פְּנֵי എന്ന പ്രയോഗം ‘എതിർവശത്ത്’ എന്ന അർഥം നൽകുന്നു.
- source_word: וּרְאֵה
  choice: നോക്കിക്കാണുക
  rationale: ראה എന്ന ആജ്ഞയുടെ ഉദ്ദേശപൂർവമായ ദർശനഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֶת אֶרֶץ כְּנַעַן
  choice: കനാൻദേശം
  rationale: സ്ഥിരപ്രയോഗമായ ഭൂമിശാസ്ത്രനാമം മലയാളത്തിൽ പതിവുള്ള രൂപത്തിൽ നൽകി.
- source_word: אֲשֶׁר אֲנִי נֹתֵן
  choice: ഞാൻ ... കൊടുക്കുന്ന
  rationale: ഒന്നാംപുരുഷ സർവനാമത്തോടുകൂടിയ കർത്തൃവാചകത്തെ ഇപ്പോഴത്തെ ദൈവിക ദാനപ്രവൃത്തിയായി നിലനിർത്തുന്നു.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾക്ക്
  rationale: എബ്രായത്തിലെ ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന പരമ്പരാഗത ജനവിഭാഗനാമം മലയാളത്തിൽ സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
- source_word: לַאֲחֻזָּה
  choice: കൈവശമായി
  rationale: אֲחֻזָּה ഭൂമിയുടെ സ്ഥിരമായ ഉടമസ്ഥാവകാശം അഥവാ കൈവശം സൂചിപ്പിക്കുന്നു; ‘കൈവശമായി’ വാക്യത്തിൽ സ്വാഭാവികമാണ്.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ഉടമ്പടിജനനാമത്തിന്റെ പരിഭാഷ
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ / ഇസ്രായേൽജനം
  rationale: മൂലത്തിലെ ബന്ധപ്രയോഗവും പരമ്പരാഗത ജനനാമവും സംരക്ഷിക്കുമ്പോഴും ആധുനിക മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന രൂപമാണിത്.
- issue: אֲחֻזָּה എന്ന ഭൂമിദാനപദത്തിന്റെ അർഥം
  choice: കൈവശം
  alternative: അവകാശം / പൈതൃകസ്വത്ത്
  rationale: മൂലപദം ഭൂമിയുടെ കൈവശാവകാശത്തെയാണ് നേരിട്ട് സൂചിപ്പിക്കുന്നത്; ‘പൈതൃകസ്വത്ത്’ എന്നു പറഞ്ഞാൽ ഇവിടെ നിർബന്ധമല്ലാത്ത പാരമ്പര്യാനന്തരാവകാശനിറം ചേർന്നേക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. സ്ഥലനാമങ്ങൾ മലയാള ബൈബിൾ പ്രയോഗങ്ങളോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു; ദീർഘമായ എബ്രായ വാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് മലയാളവാക്യങ്ങളാക്കി.
