id: DEU.32.30
reference: Deuteronomy 32:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֵיכָ֞ה יִרְדֹּ֤ף אֶחָד֙ אֶ֔לֶף וּ/שְׁנַ֖יִם יָנִ֣יסוּ רְבָבָ֑ה אִם לֹא֙ כִּי צוּרָ֣/ם מְכָרָ֔/ם וַֽ/יהוָ֖ה הִסְגִּירָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/030.yaml
  text: How could one pursue a thousand[a], and two put ten thousand to flight, unless their Rock had sold them, and Yahweh had given them up?
translation:
  language: ml
  text: അവരുടെ പാറ അവരെ വിറ്റുകളയുകയും യഹ്‌വെ അവരെ ഏൽപ്പിച്ചുകൊടുക്കുകയും ചെയ്തില്ലായിരുന്നെങ്കിൽ, ഒരാൾ ആയിരം പേരെ പിന്തുടരാനും രണ്ടുപേർ പതിനായിരം പേരെ ഓടിക്കാനും എങ്ങനെ കഴിയും?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵיכָה
  choice: എങ്ങനെ?
  rationale: ആശ്ചര്യവും അവിശ്വാസവും പ്രകടമാക്കുന്ന അലങ്കാരചോദ്യത്തിന്റെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יִרְדֹּף
  choice: പിന്തുടരുക
  rationale: യുദ്ധസന്ദർഭത്തിലെ വേട്ടയാടൽ/പിന്തുടരൽ എന്ന സാധാരണ അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: אֶחָד אֶלֶף
  choice: ഒരാൾ ആയിരം പേരെ
  rationale: ഒരാളും ആയിരം പേരും തമ്മിലുള്ള അതിശയകരമായ സൈനിക അനുപാതം പരാവർത്തനം ചെയ്യാതെ സൂക്ഷിക്കുന്നു.
- source_word: וּשְׁנַיִם
  choice: രണ്ടുപേർ
  rationale: സമാന്തരവാക്യത്തിലെ സംഖ്യാവിരുദ്ധത ലളിതമായി നിലനിർത്തുന്നു.
- source_word: יָנִיסוּ
  choice: ഓടിച്ചുകളയുക
  rationale: נוּס എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള ‘ഓടിപ്പിക്കുക’ എന്ന കാരകാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: רְבָבָה
  choice: പതിനായിരം പേരെ
  rationale: ഇവിടെ വ്യക്തമായ സംഖ്യാർഥമാണ്; ആധുനിക വായനക്കാർക്ക് നേരിട്ട് മനസ്സിലാകുന്ന രൂപം.
- source_word: אִם לֹא כִּי
  choice: ചെയ്തിട്ടല്ലാതെ
  rationale: ഇത്ര അസാധാരണമായ പരാജയത്തിന് ഏക വിശദീകരണം അവതരിപ്പിക്കുന്ന വ്യവസ്ഥാപരമായ അർഥം നൽകുന്നു.
- source_word: צוּרָם
  choice: അവരുടെ പാറ
  rationale: ആവർത്തനപുസ്തകം 32-ൽ ദൈവത്തെ സൂചിപ്പിക്കുന്ന രൂപകാത്മക വിശേഷണം; മലയാളത്തിൽ വലിയക്ഷര വ്യത്യാസമില്ലാത്തതിനാൽ സന്ദർഭം തന്നെയാണ് ദൈവിക സൂചന വ്യക്തമാക്കുന്നത്.
- source_word: מְכָרָם
  choice: അവരെ വിറ്റുകളയുക
  rationale: ഉടമ്പടി-ന്യായവിധി സന്ദർഭത്തിൽ ശത്രുക്കളുടെ അധികാരത്തിലേക്ക് കൈമാറുന്നതിനെ സൂചിപ്പിക്കുന്ന ‘വിൽക്കുക’ എന്ന മൂലരൂപകം സംരക്ഷിക്കുന്നു.
- source_word: וַיהוָה
  choice: യഹോവ
  rationale: മൂലപാഠത്തിലെ ദൈവനാമമായ יהוה ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ പതിവുള്ള ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: הִסְגִּירָם
  choice: അവരെ ഏല്പിച്ചുകൊടുക്കുക
  rationale: മറ്റൊരാളുടെ അധികാരത്തിലേക്ക് കൈമാറുക എന്ന ഹിഫീൽ അർഥം വിധിസന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: വാക്യം ഉടമ്പടിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പൊതുപദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം ദൈവനാമം ലിപ്യന്തരിച്ചു.
- issue: צוּר എന്ന ദൈവിക രൂപകം
  choice: അവരുടെ പാറ
  alternative: അവരുടെ ദൈവമായ പാറ
  rationale: മോശെയുടെ പാട്ടിൽ ‘പാറ’ ദൈവത്തെ സൂചിപ്പിക്കുന്ന രൂപകമാണ്. വ്യക്തതയ്ക്കായി ‘ദൈവമായ’ എന്നു ചേർക്കാതെ മൂലത്തിലെ സംക്ഷിപ്തതയും രൂപകാത്മക സംഘർഷവും നിലനിർത്തി.
- issue: מכר എന്ന ന്യായവിധി-രൂപകം
  choice: വിറ്റുകളയുക
  alternative: ശത്രുക്കൾക്ക് കൈമാറുക
  rationale: ദൈവം അവരെ ശത്രുക്കളുടെ അധികാരത്തിന് വിട്ടുകൊടുത്തുവെന്ന അർഥമുണ്ടെങ്കിലും, മൂലത്തിലെ ശക്തമായ ‘വിൽക്കുക’ എന്ന രൂപകം മൃദൂകരിക്കാതെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. വാക്യത്തെ അലങ്കാരചോദ്യമായി നിലനിർത്തി; അവസാനത്തിലെ ‘ചെയ്തിട്ടല്ലാതെ’ അതിന്റെ ഉദ്ദേശിച്ച നിഷേധാത്മക ഉത്തരത്തെ വ്യക്തമാക്കുന്നു. മൂലത്തിലെ രണ്ടു സമാന്തര പ്രവൃത്തികളും ദൈവിക ന്യായവിധിയുടെ രൂപകങ്ങളും സംരക്ഷിച്ചിട്ടുണ്ട്.
