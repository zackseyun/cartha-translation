language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֥רְא יְהוָ֖ה וַ/יִּנְאָ֑ץ מִ/כַּ֥עַס בָּנָ֖י/ו וּ/בְנֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/019.yaml
  text: And Yahweh saw and rejected them, provoked to anger by his sons and daughters[a].
translation:
  language: ml
  text: യഹോവ കണ്ടു; തന്റെ പുത്രന്മാരുടെയും പുത്രിമാരുടെയും പ്രകോപനം നിമിത്തം അവിടുന്ന് അവരെ അവജ്ഞയോടെ തള്ളിക്കളഞ്ഞു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരെ നിരസിച്ചു” അല്ലെങ്കിൽ “അവരെ നിന്ദയോടെ തള്ളിക്കളഞ്ഞു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ ഉടമ്പടിനാമം പരിചിതമായ മലയാള ബൈബിൾരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיַּרְא
  choice: കണ്ടു
  rationale: ראה എന്ന ക്രിയയുടെ ലളിതവും നേരിട്ടുള്ളതുമായ അർഥം; ജനത്തിന്റെ പ്രവൃത്തിയോടുള്ള യഹോവയുടെ പ്രതികരണം അവതരിപ്പിക്കുന്നു.
- source_word: וַיִּנְאָץ
  choice: അവരെ തള്ളിക്കളഞ്ഞു
  rationale: נאץ സൂചിപ്പിക്കുന്ന നിരസിക്കൽ/അവജ്ഞയോടെ ഉപേക്ഷിക്കൽ എന്ന ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; എബ്രായത്തിൽ സൂചിതമായ കർമം സന്ദർഭത്തിൽനിന്ന് ‘അവരെ’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: מִכַּעַס
  choice: കോപിപ്പിച്ചതിനാൽ
  rationale: כעס എന്ന നാമത്തിന്റെ പ്രകോപനം, കോപമുണർത്തൽ എന്നീ ആശയങ്ങളും מִן എന്നതിന്റെ കാരണാർഥവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בָּנָיו וּבְנֹתָיו
  choice: തന്റെ പുത്രന്മാരും പുത്രിമാരും
  rationale: മൂലപാഠം ആൺ-പെൺ സന്തതികളെ പ്രത്യേകം പരാമർശിക്കുന്നതിനാൽ ഇരുവിഭാഗവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: וַיִּנְאָץ എന്ന ക്രിയയുടെ സൂചിത കർമം
  choice: സന്ദർഭത്തിലെ യിസ്രായേൽജനത്തെ സൂചിപ്പിച്ച് ‘അവരെ’ എന്നു ചേർത്തു.
  alternative: കർമം വ്യക്തമാക്കാതെ ‘അവിടുന്ന് തള്ളിക്കളഞ്ഞു’ എന്നു നൽകുക.
  rationale: മലയാളത്തിൽ ഈ ക്രിയയ്ക്ക് കർമം വ്യക്തമാക്കുന്നത് സ്വാഭാവികമാണ്; സന്ദർഭം അതിനെ ജനമായി തിരിച്ചറിയുന്നതിനാൽ പുതിയ ദൈവശാസ്ത്രവാദം ചേർക്കുന്നില്ല.
- issue: ദൈവിക അപ്രീതിയുടെ തീവ്രത
  choice: ‘കോപിപ്പിച്ചതിനാൽ’ എന്നും ‘തള്ളിക്കളഞ്ഞു’ എന്നും നൽകി.
  alternative: ‘വെറുത്തു’ അല്ലെങ്കിൽ ‘നിന്ദിച്ചു’ എന്നു കൂടുതൽ തീവ്രമായി നൽകുക.
  rationale: ഉടമ്പടിവിശ്വാസവഞ്ചനയോടുള്ള യഥാർഥ ദൈവിക ന്യായവിധിയുടെ ഗൗരവം നിലനിർത്തുമ്പോഴും പദത്തിന്റെ തെളിവിനെക്കാൾ അർഥം അതിരുകടത്തി ശക്തിപ്പെടുത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘അവിടുന്ന്’ എന്ന ആദരസൂചക സർവനാമം യഹോവയെ സൂചിപ്പിക്കുന്നു; മൂലത്തിലെ കാരണബന്ധവും പുത്രന്മാർ/പുത്രിമാർ എന്ന വ്യക്തമായ വിഭജനവും സംരക്ഷിച്ചിട്ടുണ്ട്.
