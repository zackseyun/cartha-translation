    reason: lexical_alternative
  revision_rationale: The revision retains the divine name, the implicit object “them,” and the Hebrew causal relation while rendering כעס as the abstract noun “പ്രകോപനം,” rather than converting it into an explicit clause. “അവജ്ഞയോടെ തള്ളിക്കളഞ്ഞു” more fully conveys the scornful rejection expressed by נאץ. The footnote remains anchored to the main verb and offers valid lexical alternatives.
