source:
  edition: WLC
  text: וַ/יְכַ֣ל מֹשֶׁ֗ה לְ/דַבֵּ֛ר אֶת כָּל הַ/דְּבָרִ֥ים הָ/אֵ֖לֶּה אֶל כָּל יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/045.yaml
  text: When Moses finished speaking all these words to all Israel,
translation:
  language: ml
  text: മോശെ ഈ വാക്കുകളെല്ലാം ഇസ്രായേൽ മുഴുവനോടും പറഞ്ഞുതീർന്നപ്പോൾ,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְכַל
  choice: പറഞ്ഞുതീർന്നപ്പോൾ
  rationale: כלה എന്ന ക്രിയയുടെ wayyiqtol രൂപം പ്രവൃത്തി പൂർത്തിയായതിനെ സൂചിപ്പിക്കുന്നു. לְדַבֵּר എന്നതിനോടു ചേർന്നുള്ള എബ്രായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി ‘പറഞ്ഞുതീർന്നപ്പോൾ’ എന്നു നൽകുന്നു.
- source_word: לְדַבֵּר
  choice: പറഞ്ഞു
  rationale: כלה എന്ന ക്രിയയോടു ചേർന്ന infinitive construct ആയതിനാൽ ‘പറഞ്ഞുതീർന്നു’ എന്ന സംയുക്തപ്രയോഗത്തിൽ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നിലനിൽക്കുന്നു.
- source_word: אֶת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: ഈ വാക്കുകളെല്ലാം
  rationale: דברים ഇവിടെ മുമ്പുള്ള പ്രഭാഷണത്തെയോ ഗാനത്തിലെ വചനങ്ങളെയോ സൂചിപ്പിക്കുന്നു. ‘കാര്യങ്ങൾ’ എന്ന വിശാലമായ പദത്തേക്കാൾ ‘വാക്കുകൾ’ മൂലപാഠത്തിന്റെ രൂപഭാവം നിലനിർത്തുന്നു.
- source_word: אֶל כָּל יִשְׂרָאֵל
  choice: ഇസ്രായേൽ മുഴുവനോടും
  rationale: ‘എല്ലാ ഇസ്രായേലിനോടും’ എന്ന അക്ഷരാർഥരൂപത്തേക്കാൾ സ്വാഭാവികമായ മലയാളമാണിത്; അതേസമയം ഇസ്രായേലിനെ ഒരു ഉടമ്പടി-സമൂഹമായി കാണിക്കുന്ന കൂട്ടായ സംജ്ഞ നിലനിർത്തുന്നു.
- source_word: מֹשֶׁה
  choice: മോശെ
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ സുപരിചിതവും മാനകവുമായ വ്യക്തിനാമരൂപം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. വാക്യം അടുത്ത വാക്യത്തിലേക്കു നീളുന്ന ആശ്രിതഘടനയായതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തിയിരിക്കുന്നു.
