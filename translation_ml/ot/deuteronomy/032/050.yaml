source:
  edition: WLC
  text: וּ/מֻ֗ת בָּ/הָר֙ אֲשֶׁ֤ר אַתָּה֙ עֹלֶ֣ה שָׁ֔מָּ/ה וְ/הֵאָסֵ֖ף אֶל עַמֶּ֑י/ךָ כַּֽ/אֲשֶׁר מֵ֞ת אַהֲרֹ֤ן אָחִ֨י/ךָ֙ בְּ/הֹ֣ר הָ/הָ֔ר וַ/יֵּאָ֖סֶף אֶל עַמָּֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/050.yaml
  text: and die on the mountain that you are ascending[a], and be gathered to your people, just as Aaron your brother died on Mount Hor and was gathered to his people.
translation:
  language: ml
  text: നീ കയറുന്ന ആ മലയിൽവെച്ച് മരിക്കുകയും നിന്റെ ജനത്തോടു ചേർക്കപ്പെടുകയും ചെയ്യുക[a]; നിന്റെ സഹോദരനായ അഹരോൻ ഹോർ മലയിൽവെച്ച് മരിച്ച് തന്റെ ജനത്തോടു ചേർക്കപ്പെട്ടതുപോലെതന്നെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിന്റെ ജനത്തോടു ചേർക്കപ്പെടുക’ എന്നതിന് ‘നിന്റെ പൂർവികരോടു ചേർക്കപ്പെടുക’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ ഭാഷാശൈലിയുടെ അക്ഷരാർഥം ‘നിന്റെ ജനത്തോടു ചേർക്കപ്പെടുക’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֻת
  choice: മരിക്കുകയും ... ചെയ്യുക
  rationale: מות എന്ന ധാതുവിന്റെ കാൽ ആജ്ഞാർഥ/ഇച്ഛാർഥ രൂപമാണ്; മോശെയോടുള്ള ദൈവിക കല്പനയുടെ നേരിട്ടുള്ള ഭാവം നിലനിർത്തുന്നു.
- source_word: בָּהָר אֲשֶׁר אַתָּה עֹלֶה שָׁמָּה
  choice: നീ കയറുന്ന ആ മലയിൽവെച്ചു
  rationale: עלה എന്നതിലെ മുകളിലേക്കുള്ള ചലനം ‘കയറുന്ന’ എന്നു സ്വാഭാവികമായി നൽകുന്നു; שָׁמָּה സൂചിപ്പിക്കുന്ന ലക്ഷ്യസ്ഥാനം മലയാളത്തിലെ ‘ആ മല’ എന്ന പ്രയോഗത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: וְהֵאָסֵף אֶל עַמֶּיךָ
  choice: നിന്റെ ജനത്തോടു ചേർക്കപ്പെടുകയും ചെയ്യുക
  rationale: മരണത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ഭാഷാശൈലിയുടെ രൂപകാത്മകതയും ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും സംരക്ഷിക്കുന്നു; ‘പൂർവികർ’ എന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ അടിച്ചേൽപ്പിക്കുന്നില്ല.
- source_word: כַּאֲשֶׁר
  choice: പോലെതന്നെ
  rationale: അഹരോന്റെ മരണത്തോടുള്ള ശക്തമായ താരതമ്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אַהֲרֹן אָחִיךָ
  choice: നിന്റെ സഹോദരനായ അഹരോൻ
  rationale: എബ്രായ പദക്രമത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְּהֹר הָהָר
  choice: ഹോർ മലയിൽവെച്ചു
  rationale: സ്ഥലനാമമായ ഹോറിനെയും മലമുകളിലെ സംഭവസ്ഥലത്തെയും വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: וַיֵּאָסֶף אֶל עַמָּיו
  choice: തന്റെ ജനത്തോടു ചേർക്കപ്പെട്ടു
  rationale: മോശെയെക്കുറിച്ചുള്ള അതേ മരണഭാഷാശൈലി അഹരോനെക്കുറിച്ചും ഏകീകൃതമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: אסף אל־עמיו എന്ന മരണഭാഷാശൈലിയുടെ വിവർത്തനം
  choice: ‘നിന്റെ/തന്റെ ജനത്തോടു ചേർക്കപ്പെടുക’ എന്ന ഭാഷാശൈലി മുഖ്യപാഠത്തിൽ നിലനിർത്തുക
  alternative: ‘നിന്റെ/തന്റെ പൂർവികരോടു ചേർക്കപ്പെടുക’ അല്ലെങ്കിൽ ‘സ്വജനത്തോടൊപ്പം മരണത്തിൽ ചേരുക’
  rationale: ഈ പ്രയോഗം മരണവുമായി ബന്ധപ്പെട്ട പതിവ് എബ്രായ ഭാഷാശൈലിയാണെങ്കിലും ശവസംസ്കാരമോ പൂർവികരോടുള്ള ചേരലോ മാത്രമായി അതിനെ ചുരുക്കേണ്ടതില്ല. അതിനാൽ മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ചേർക്കപ്പെടുക’ എന്ന ബൈബിൾഭാഷാശൈലി ഉദ്ദേശപൂർവം നിലനിർത്തി; വാക്യത്തിന്റെ ആജ്ഞാർഥഭാവവും അഹരോനോടുള്ള താരതമ്യവും വ്യക്തമായി സൂക്ഷിച്ചു.
