  terminology: ‘യഹ്‌വെ’ consistently renders the Tetragrammaton as a personal name. ‘പ്രകോപനം,’ ‘വൈരികൾ,’ and ‘കൈ ഉയർന്നിരിക്കുന്നു’ maintain an appropriately formal biblical register while remaining intelligible. The literal metaphor is helpfully retained.
