id: DEU.32.27
reference: Deuteronomy 32:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לוּלֵ֗י כַּ֤עַס אוֹיֵב֙ אָג֔וּר פֶּֽן יְנַכְּר֖וּ צָרֵ֑י/מוֹ פֶּן יֹֽאמְרוּ֙ יָדֵ֣י/נוּ רָ֔מָה וְ/לֹ֥א יְהוָ֖ה פָּעַ֥ל כָּל זֹֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/027.yaml
  text: Were it not that I feared the provocation of the enemy[a], lest their adversaries should misunderstand, lest they should say, ‘Our hand is exalted[c][b], and Yahweh has not done all this.’
translation:
  language: ml
  text: ശത്രുവിന്റെ പ്രകോപനം ഞാൻ ഭയപ്പെട്ടിരുന്നില്ലെങ്കിൽ[a]—അവരുടെ വൈരികൾ സംഭവത്തെ തെറ്റായി മനസ്സിലാക്കി[b], ‘ഞങ്ങളുടെ കൈ ഉയർന്നിരിക്കുന്നു[c]; ഇതെല്ലാം ചെയ്തത് യഹ്‌വെയല്ല’ എന്നു പറഞ്ഞേക്കുമെന്നതിനാൽ—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘ശത്രുവിന്റെ പ്രകോപനം ഞാൻ ഭയന്നിരുന്നില്ലെങ്കിൽ.’'
    reason: മൂലത്തിലെ സോപാധിക പ്രയോഗത്തിന്റെയും ‘ഭയപ്പെടുക/ഭയക്കുക’ എന്ന ക്രിയയുടെയും മറ്റൊരു സ്വാഭാവിക രൂപം.
  - marker: b
    text: ‘തെറ്റായി മനസ്സിലാക്കി’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന എബ്രായ ക്രിയ ദുഷ്കരമാണ്; ‘തെറ്റായി വിലയിരുത്തി’ എന്നോ ഇസ്രായേലിന്റെ വീഴ്ചയുടെ യഥാർഥ കാരണം ‘തിരിച്ചറിയാതെ’ എന്നോ അർഥമാകാം.
    reason: יְנַכְּרוּ എന്ന രൂപത്തിന്റെ യഥാർഥ സന്ദർഭാർഥം സംബന്ധിച്ച പദാർഥപരമായ അനിശ്ചിതത്വം.
  - marker: c
    text: 'അക്ഷരാർഥം: ‘ഞങ്ങളുടെ കൈ ഉയർന്നിരിക്കുന്നു’; അഥവാ, ‘ഞങ്ങൾ മേൽക്കൈ നേടിയിരിക്കുന്നു.’'
    reason: എബ്രായ വിജയരൂപകം വ്യക്തമാക്കുന്ന പദാർഥപരമായ കുറിപ്പ്.
lexical_decisions:
- source_word: לוּלֵי
  choice: ഭയപ്പെട്ടിരുന്നില്ലെങ്കിൽ
  rationale: לוּלֵיയുടെ നിഷേധാത്മക സോപാധിക-അപവാദ അർഥം തുടർന്നുള്ള אָגוּר എന്ന ക്രിയയോടു ചേർത്ത് സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: כַּעַס אוֹיֵב
  choice: ശത്രുവിന്റെ പ്രകോപനം
  rationale: כַּעַס ഇവിടെ ശത്രുവിന്റെ ധിക്കാരപൂർവമായ പ്രതികരണത്തെയോ ദൈവത്തെ പ്രകോപിപ്പിക്കുന്ന അവകാശവാദത്തെയോ സൂചിപ്പിക്കാം; ‘പ്രകോപനം’ ഈ സന്ദർഭപരമായ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: אָגוּר
  choice: ഞാൻ ഭയപ്പെട്ടിരുന്നില്ലെങ്കിൽ
  rationale: ആദ്യപുരുഷത്തിലുള്ള ‘ഭയപ്പെടുക/ഭയക്കുക’ എന്ന മാനുഷികഭാവാരോപിത ഭാഷയെ മയപ്പെടുത്താതെ സൂക്ഷിക്കുന്നു; സന്ദർഭം ഇത് ശക്തിയില്ലായ്മയുടെ ഭയമല്ലെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: יְנַכְּרוּ
  choice: സംഭവത്തെ തെറ്റായി മനസ്സിലാക്കി
  rationale: ദുഷ്കരമായ പീയേൽ രൂപം ഇവിടെ ഇസ്രായേലിന്റെ വീഴ്ചയുടെ യഥാർഥ കാരണം തെറ്റായി ഗ്രഹിക്കുക എന്ന സന്ദർഭാർഥത്തിൽ വിവർത്തനം ചെയ്യുന്നു; പാഠത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: צָרֵימוֹ
  choice: അവരുടെ വൈരികൾ
  rationale: ശത്രുതയുള്ള എതിരാളികളെ സൂചിപ്പിക്കുന്ന ബഹുവചന ആശയം നിലനിർത്തുന്നു; മുൻപുള്ള ഏകവചന ‘ശത്രു’ സമൂഹവാചകമാണ്.
- source_word: יָדֵינוּ רָמָה
  choice: ഞങ്ങളുടെ കൈ ഉയർന്നിരിക്കുന്നു
  rationale: ‘കൈ ഉയർന്നിരിക്കുന്നു’ എന്ന എബ്രായ രൂപകം അതേപടി നിലനിർത്തി വിജയം, മേൽക്കൈ, സ്വയംപുകഴ്ച എന്നീ സൂചനകൾ തുറന്നുവയ്ക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പദവിയാൽ പകരാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: פָּעַל כָּל זֹאת
  choice: ഇതെല്ലാം ചെയ്തത് ... അല്ല
  rationale: ദൈവമാണ് ഈ സംഭവങ്ങൾ വരുത്തിയതെന്ന കാര്യം ശത്രുക്കൾ നിഷേധിക്കുന്ന നേരിട്ടുള്ള പ്രസ്താവന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമത്തെ പദവിയാക്കി മാറ്റാതെ സുതാര്യമായി നിലനിർത്തുന്നു.
- issue: ‘ഞാൻ ഭയപ്പെട്ടു’ എന്ന മാനുഷികഭാവാരോപിത പ്രയോഗം
  choice: ഞാൻ ഭയപ്പെട്ടിരുന്നില്ലെങ്കിൽ
  alternative: ഞാൻ ആശങ്കപ്പെട്ടിരുന്നില്ലെങ്കിൽ / ഞാൻ പരിഗണിച്ചിരുന്നില്ലെങ്കിൽ
  rationale: മൂലത്തിലെ ഭയപ്പെടുക/ഭയക്കുക എന്ന ക്രിയയെ വ്യാഖ്യാനിച്ച് മയപ്പെടുത്താതെ സൂക്ഷിക്കുന്നു; ദൈവത്തിന്റെ ദൗർബല്യം എന്നു നിർബന്ധിച്ച് വായിക്കാതെ ശത്രുവിന്റെ തെറ്റായ വ്യാഖ്യാനത്തെക്കുറിച്ചുള്ള പരിഗണന എന്ന സന്ദർഭവും നിലനിൽക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. ദീർഘമായ എബ്രായ സോപാധിക വാക്യത്തിന്റെ പൂർത്തിയാകാത്ത സ്വഭാവം മുൻസന്ദർഭവുമായി ബന്ധപ്പെട്ടു നിൽക്കുന്നതിനാൽ അവസാനത്തിൽ ദീർഘവിരാമചിഹ്നം ഉപയോഗിച്ചു. ‘വൈരികൾ’, ‘പ്രകോപനം’ എന്നിവ സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായിരിക്കെ കാവ്യഗൗരവവും നിലനിർത്തുന്നു.
