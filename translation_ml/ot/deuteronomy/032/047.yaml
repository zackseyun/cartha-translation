source:
  edition: WLC
  text: כִּ֠י לֹֽא דָבָ֨ר רֵ֥ק הוּא֙ מִ/כֶּ֔ם כִּי ה֖וּא חַיֵּי/כֶ֑ם וּ/בַ/דָּבָ֣ר הַ/זֶּ֗ה תַּאֲרִ֤יכוּ יָמִים֙ עַל הָ֣/אֲדָמָ֔ה אֲשֶׁ֨ר אַתֶּ֜ם עֹבְרִ֧ים אֶת הַ/יַּרְדֵּ֛ן שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/047.yaml
  text: For it is not an empty word for you[a], but it is your life[c][b], and by this word you will prolong your days on the land that you are crossing the Jordan to possess.
translation:
  language: ml
  text: കാരണം, ഇത് നിങ്ങൾക്ക് അർഥശൂന്യമായ വചനമല്ല[a]; ഇതാണ് നിങ്ങളുടെ ജീവൻ[b]. ഈ വചനത്താൽ, യോർദ്ദാൻ കടന്ന് അത് കൈവശമാക്കാൻ നിങ്ങൾ പോകുന്ന ദേശത്ത് നിങ്ങൾ ദീർഘകാലം ജീവിക്കും[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഇത് നിങ്ങൾക്ക് നിസ്സാരമായ കാര്യമല്ല’ അല്ലെങ്കിൽ ‘വ്യർഥമായ കാര്യമല്ല.’
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘നിങ്ങളുടെ ജീവനുകൾ’; ബഹുവചനരൂപം ഇവിടെ ‘ജീവൻ’ എന്ന ഭാവനാമമായി ഉപയോഗിച്ചിരിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥം ‘നിങ്ങൾ നിങ്ങളുടെ നാളുകൾ ദീർഘമാക്കും.’ അവസാനഭാഗം ‘അത് അവകാശമാക്കാൻ നിങ്ങൾ യോർദ്ദാൻ കടന്ന് പോകുന്ന ദേശത്ത്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: דָבָר רֵק
  choice: അർഥശൂന്യമായ വചനം
  rationale: דָבָר ഇവിടെ ഇപ്പോൾ പ്രസ്താവിച്ച ഉടമ്പടിപരമായ ഉപദേശത്തെയോ ഗാനത്തെയോ സൂചിപ്പിക്കുന്നു; רֵק ശൂന്യത, വ്യർഥത, പ്രയോജനമില്ലായ്മ എന്നിവ സൂചിപ്പിക്കുന്നു. ‘അർഥശൂന്യമായ വചനം’ എന്നത് വചനത്തിന്റെ ഗൗരവവും പ്രായോഗിക പ്രസക്തിയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מִכֶּם
  choice: നിങ്ങൾക്ക്
  rationale: ഇവിടെ מן വേർപാടിനെക്കാൾ ഇസ്രായേലിനോടുള്ള ബന്ധത്തിൽ ‘നിങ്ങൾക്ക്/നിങ്ങളെ സംബന്ധിച്ചിടത്തോളം’ എന്ന വ്യവഹാരാർഥത്തിലാണ്.
- source_word: חַיֵּיכֶם
  choice: നിങ്ങളുടെ ജീവൻ
  rationale: രൂപപരമായി ബഹുവചനമാണെങ്കിലും חַיִּים പലപ്പോഴും ‘ജീവൻ’ എന്ന ഏകവചന ഭാവനാമമായി പ്രവർത്തിക്കുന്നു. ഉടമ്പടിജനത്തിന്റെ ജീവൻ എന്ന സമൂഹാർഥവും ഇതിൽ നിലനിൽക്കുന്നു.
- source_word: וּבַדָּבָר הַזֶּה
  choice: ഈ വചനത്താൽ
  rationale: 'בְּ ഇവിടെ ഉപകരണാർഥമാണ്: ഈ വചനം മുഖാന്തരം അവരുടെ നാളുകൾ ദീർഘമാകും. മുമ്പുള്ള דָבָר-നോടുള്ള പദബന്ധവും ‘വചനം’ നിലനിർത്തുന്നു.'
- source_word: תַּאֲרִיכוּ יָמִים
  choice: ദീർഘകാലം ജീവിക്കും
  rationale: ‘നിങ്ങളുടെ നാളുകൾ ദീർഘമാക്കും’ എന്ന എബ്രായ ദൃശ്യഭാഷയുടെ സ്വാഭാവിക മലയാള അർഥം ഇതാണ്. അസ്വാഭാവികമായ പദാനുപദരൂപം ഒഴിവാക്കി അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: עַל הָאֲדָמָה
  choice: ദേശത്ത്
  rationale: ആവർത്തനപുസ്തകത്തിലെ സന്ദർഭത്തിൽ אֲדָמָה വാഗ്ദത്തദേശത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ദേശത്ത്’ എന്നത് പ്രദേശപരമായ ഉടമ്പടി ഊന്നൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: עֹבְרִים אֶת־הַיַּרְדֵּן
  choice: യോർദ്ദാൻ കടന്നുചെല്ലുന്ന
  rationale: വർത്തമാന കൃതന്തം മോശെയുടെ കാഴ്ചപ്പാടിൽ ആസന്നമായ കടന്നുപോകലിനെ അവതരിപ്പിക്കുന്നു. ‘കടന്നുചെല്ലുന്ന’ ലക്ഷ്യദേശത്തേക്കുള്ള ഗതിയും സൂചിപ്പിക്കുന്നു.
- source_word: שָׁמָּה לְרִשְׁתָּהּ
  choice: കൈവശമാക്കാൻ
  rationale: ירשׁ ഇവിടെ ദേശം അവകാശമായി പ്രാപിച്ചു കൈവശപ്പെടുത്തുക എന്ന അർഥം വഹിക്കുന്നു. മുഖ്യപാഠത്തിൽ ‘കൈവശമാക്കാൻ’ വ്യക്തവും സംക്ഷിപ്തവുമാണ്; ‘അവകാശമാക്കാൻ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: അനുസരണവും ജീവനും തമ്മിലുള്ള ഉടമ്പടിബന്ധം
  choice: ദൈവം അരുളിയ വചനം ഇസ്രായേലിന്റെ ജീവനും ദേശത്തിലെ ദീർഘവാസത്തിനുള്ള മാർഗവുമായി വാക്യം അവതരിപ്പിക്കുന്നു.
  alternative: നിയമത്തിന്റെ പ്രാധാന്യത്തെക്കുറിച്ചുള്ള ആലങ്കാരിക പ്രശംസ മാത്രമായി വായിക്കുക.
  rationale: ‘ഇതുതന്നെയാണ് നിങ്ങളുടെ ജീവൻ’, ‘ഈ വചനത്താൽ ... ദീർഘകാലം ജീവിക്കും’ എന്നീ സമാന്തരപ്രസ്താവനകൾ ഉടമ്പടിപരമായ ഫലത്തെ വ്യക്തമാക്കുന്നു. പിന്നീട് രൂപപ്പെട്ട സിദ്ധാന്തവിഭാഗങ്ങൾ ചേർക്കാതെ ആ ബന്ധം പരിഭാഷയിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വചനം’, ‘ജീവൻ’, ‘ദേശം’ എന്നീ ആവർത്തനപുസ്തകത്തിന്റെ ഉടമ്പടിപരമായ മുഖ്യപദങ്ങൾ നിലനിർത്തി; ‘ദീർഘകാലം ജീവിക്കും’ എന്ന് നൽകി എബ്രായ പ്രയോഗത്തിന്റെ അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി.
