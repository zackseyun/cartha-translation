  yaml_path: translation/ot/deuteronomy/032/031.yaml
  text: For their rock is not like our Rock[a], and our enemies are judges.
translation:
  language: ml
  text: കാരണം, നമ്മുടെ പാറയെപ്പോലെ അവരുടെ പാറയല്ല; നമ്മുടെ ശത്രുക്കൾ വിധികർത്താക്കളാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അവരുടെ പാറ നമ്മുടെ പാറയെപ്പോലെയല്ല; നമ്മുടെ ശത്രുക്കൾതന്നെ വിധികർത്താക്കളാണ്.” פְּלִילִים എന്ന എബ്രായ നാമത്തിന്റെ അക്ഷരാർഥം “വിധികർത്താക്കൾ” അല്ലെങ്കിൽ “തീർപ്പുകാർ” എന്നാണ്; അതിനാൽ ഈ വാക്യത്തിന് ന്യായവിധിസംബന്ധമായ ഭാവമുണ്ട്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ പ്രസ്താവനയ്ക്കുള്ള അടിസ്ഥാനമോ വിശദീകരണമോ അവതരിപ്പിക്കുന്ന ബന്ധകമായി സ്വാഭാവികമായി പ്രവർത്തിക്കുന്നു.
- source_word: כְצוּרֵנוּ צוּרָם
  choice: അവരുടെ പാറ നമ്മുടെ പാറപോലെയല്ല
  rationale: צוּר എന്ന ഒരേ രൂപകം ഇരുവശത്തും നിലനിർത്തി, ഇസ്രായേലിന്റെ ദൈവത്തെയും ജനതകളുടെ ആശ്രയത്തെയും തമ്മിൽ താരതമ്യം ചെയ്യുന്ന എബ്രായ പദപ്രയോഗം സംരക്ഷിക്കുന്നു. മലയാളത്തിൽ വലിയക്ഷരംകൊണ്ട് ദൈവിക ശീർഷകം വേർതിരിക്കാനാകാത്തതിനാൽ സന്ദർഭമാണ് വ്യത്യാസം വ്യക്തമാക്കുന്നത്.
- source_word: וְאֹיְבֵינוּ
  choice: നമ്മുടെ ശത്രുക്കൾ
  rationale: വാക്യത്തിലെ പുതിയ കർത്താവിനെ നേരിട്ട് നൽകുന്നു; וְ എന്ന ബന്ധകത്തിന്റെ ലളിതമായ തുടർച്ച അർദ്ധവിരാമത്തിലൂടെ സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: פְּלִילִים
  choice: വിധികർത്താക്കളാണ്
  rationale: ‘വിധികർത്താക്കൾ/മധ്യസ്ഥർ’ എന്ന നാമരൂപവും ന്യായവിധിസംബന്ധമായ ഭാവവും നിലനിർത്തുന്നു; ‘സാക്ഷ്യം പറയുന്നു’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക അർഥം മുഖ്യവാക്യത്തിൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: צוּר എന്ന ദൈവരൂപകം വിശദീകരണപദംകൊണ്ട് മാറ്റണമോ
  choice: ഇരുവട്ടവും ‘പാറ’ എന്ന രൂപകം നിലനിർത്തുക
  alternative: അഭയസ്ഥാനം / സംരക്ഷകൻ / ശക്തി
  rationale: മൂലപാഠം ഒരേ നാമം ഉപയോഗിച്ച് ഇസ്രായേലിന്റെ ദൈവത്തെയും മറ്റു ജനതകളുടെ ആശ്രയത്തെയും ഉദ്ദേശപൂർവം താരതമ്യം ചെയ്യുന്നു. രൂപകം നിലനിർത്തുന്നത് അതിന്റെ സാഹിത്യപരവും ദൈവശാസ്ത്രപരവുമായ സംഘർഷം സംരക്ഷിക്കുന്നു.
- issue: וְאֹיְבֵינוּ פְּלִילִים എന്നതിന്റെ ബന്ധവും പ്രവർത്തനവും
  choice: ‘നമ്മുടെ ശത്രുക്കൾ വിധികർത്താക്കളാണ്’ എന്ന നാമവാക്യമായി നിലനിർത്തുക
  alternative: ‘നമ്മുടെ ശത്രുക്കൾതന്നെ വിധിച്ചാലും’ / ‘നമ്മുടെ ശത്രുക്കൾതന്നെ ഇതു സമ്മതിക്കുന്നു’
  rationale: ശത്രുക്കൾ ഈ താരതമ്യത്തെ അംഗീകരിക്കുന്നുവെന്ന ആശയം സന്ദർഭത്തിൽ സാധ്യതയുള്ളതാണെങ്കിലും, എബ്രായം നേരിട്ട് ‘സമ്മതിക്കുന്നു’ എന്നു പറയുന്നില്ല. അതിനാൽ കൂടുതൽ വ്യാഖ്യാനാത്മക വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പാറ’ എന്ന ആവർത്തനം മനപ്പൂർവം നിലനിർത്തിയിരിക്കുന്നു. ദൈവത്തെ സൂചിപ്പിക്കുന്ന ഇംഗ്ലീഷ് വലിയക്ഷര വ്യത്യാസത്തിന് മലയാളത്തിൽ സമാനരീതി ഇല്ലാത്തതിനാൽ സന്ദർഭപരമായ തിരിച്ചറിവ് ആശ്രയിക്കുന്നു.
