reference: Deuteronomy 32:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אַסְתִּ֤ירָה פָנַ/י֙ מֵ/הֶ֔ם אֶרְאֶ֖ה מָ֣ה אַחֲרִיתָ֑/ם כִּ֣י ד֤וֹר תַּהְפֻּכֹת֙ הֵ֔מָּה בָּנִ֖ים לֹא אֵמֻ֥ן בָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/020.yaml
  text: And he said[a], “I will hide my face from them; I will see what their end will be, for they are a perverse generation[b], children in whom there is no faithfulness.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “ഞാൻ അവരിൽനിന്ന് എന്റെ മുഖം മറയ്ക്കും; അവരുടെ അന്ത്യം എന്തായിരിക്കുമെന്ന് ഞാൻ കാണും; കാരണം, അവർ വക്രത നിറഞ്ഞ ഒരു തലമുറയാണ്[a], അവരിൽ വിശ്വസ്തതയില്ലാത്ത മക്കളാണ്[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ “വക്രതകളുടെ ഒരു തലമുറ”; “വക്രമായ ഒരു തലമുറ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: “അവരിൽ ആശ്രയയോഗ്യതയില്ലാത്ത മക്കൾ” അല്ലെങ്കിൽ “കൂറില്ലാത്ത മക്കൾ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַסְתִּירָה פָנַי מֵהֶם
  choice: ഞാൻ അവരിൽനിന്ന് എന്റെ മുഖം മറയ്ക്കും
  rationale: ‘മുഖം മറയ്ക്കുക’ എന്ന എബ്രായ ഉടമ്പടി-പ്രയോഗം ദൈവിക പ്രസാദമോ സാന്നിധ്യമോ പിൻവലിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. അതിന്റെ ദൈവശാസ്ത്രപരമായ ഭാരം ചുരുക്കാതെ മലയാളത്തിലും ‘മുഖം’ നിലനിർത്തുന്നു.
- source_word: אֶרְאֶה מָה אַחֲרִיתָם
  choice: അവരുടെ അന്ത്യം എന്തായിരിക്കുമെന്ന് ഞാൻ കാണും
  rationale: אַחֲרִית എന്നതിന് അന്ത്യം, പരിണതി, അന്തിമഫലം എന്നീ അർഥസാധ്യതകളുണ്ട്. ‘അന്ത്യം’ മൂലത്തിന്റെ ഗൗരവവും സംക്ഷിപ്തതയും നിലനിർത്തുന്നു.
- source_word: דּוֹר תַּהְפֻּכֹת
  choice: വക്രത നിറഞ്ഞ ഒരു തലമുറ
  rationale: תַּהְפֻּכֹת എന്ന ബഹുവചന നാമം ധാർമികമായ വളച്ചൊടിക്കലുകളെയോ വക്രതകളെയോ സൂചിപ്പിക്കുന്നു. അക്ഷരാർഥത്തിലുള്ള ‘വക്രതകളുടെ തലമുറ’ മലയാളത്തിൽ കൃത്രിമമായതിനാൽ സ്വാഭാവികവും ശക്തവുമായ ‘വക്രത നിറഞ്ഞ ഒരു തലമുറ’ തെരഞ്ഞെടുത്തു.
- source_word: בָּנִים
  choice: മക്കൾ
  rationale: ഇവിടെ പദം ജനത്തെ ദൈവത്തിന്റെ സന്തതികളായി പൊതുവായി സൂചിപ്പിക്കുന്നു; ‘മക്കൾ’ ലിംഗപരമായി അനാവശ്യമായി പരിമിതപ്പെടുത്താതെ ബന്ധപരമായ അർഥം നൽകുന്നു.
- source_word: לֹא אֵמֻן בָּם
  choice: അവരിൽ വിശ്വസ്തതയില്ലാത്ത
  rationale: אֵמֻן വിശ്വസ്തത, ആശ്രയയോഗ്യത, കൂറ് എന്നിവയെ സൂചിപ്പിക്കുന്നു. ഈ ഉടമ്പടി-സന്ദർഭത്തിൽ ‘വിശ്വസ്തത’ ബന്ധപരവും ധാർമികവുമായ കുറ്റാരോപണം ഏറ്റവും നന്നായി നൽകുന്നു.
theological_decisions:
- issue: ദൈവം തന്റെ ‘മുഖം മറയ്ക്കുന്നു’ എന്ന മാനവരൂപക ഉടമ്പടി-പ്രയോഗം
  choice: ‘ഞാൻ അവരിൽനിന്ന് എന്റെ മുഖം മറയ്ക്കും’ എന്നു നിലനിർത്തി
  alternative: ‘ഞാൻ അവരിൽനിന്ന് തിരിഞ്ഞുകളയും’ / ‘ഞാൻ അവരെ അവഗണിക്കും’
  rationale: മൂലത്തിലെ ‘മുഖം’ ദൈവിക പ്രസാദവും സാന്നിധ്യവും പിൻവലിക്കുന്നതിന്റെ ഉടമ്പടി-ഭാരം വഹിക്കുന്നു. അതിനെ പൊതുവായ അവഗണനയായി വ്യാഖ്യാനിച്ച് ചുരുക്കിയിട്ടില്ല.
- issue: אֵמֻן എന്ന പദത്തിന്റെ അർഥം
  choice: വിശ്വസ്തത
  alternative: ആശ്രയയോഗ്യത / കൂറ്
  rationale: ഇവിടെ വിഷയം വെറും ബൗദ്ധിക വിശ്വാസമല്ല, ബന്ധത്തിലും ഉടമ്പടിയിലും കാണിക്കേണ്ട സ്ഥിരതയും വിശ്വസ്തതയുമാണ്. മറ്റു അർഥസാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മുഖം മറയ്ക്കും’, ‘അന്ത്യം’, ‘വിശ്വസ്തത’ എന്നീ മുഖ്യപ്രയോഗങ്ങൾ മൂലത്തിലെ ഉടമ്പടി-ഭാരവും അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു. ലഭിച്ച ഇംഗ്ലീഷ് മാതൃകയിൽ [a] അടയാളം ‘said’ എന്നതിന് ശേഷമുണ്ടായിരുന്നുവെങ്കിലും അതിന്റെ അടിക്കുറിപ്പ് דּוֹר תַּהְפֻּכֹת എന്ന പ്രയോഗത്തെക്കുറിച്ചായതിനാൽ മലയാളത്തിൽ ബന്ധപ്പെട്ട വാക്കിനുശേഷം അടയാളം സ്ഥാപിച്ചു.
