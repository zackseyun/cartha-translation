id: DEU.32.28
reference: Deuteronomy 32:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּי ג֛וֹי אֹבַ֥ד עֵצ֖וֹת הֵ֑מָּה וְ/אֵ֥ין בָּ/הֶ֖ם תְּבוּנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/028.yaml
  text: For they are a nation devoid of counsel, and there is no understanding in them.
translation:
  language: ml
  text: 'എന്തെന്നാൽ, അവർ ആലോചന നഷ്ടപ്പെട്ട ഒരു ജനതയാണ്;

    അവരിൽ വിവേകമില്ല.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: '[പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല]'
  rationale: ഇവിടെ כִּי മുൻവാക്യത്തിന്റെ വിശദീകരണമോ കാരണമോ അവതരിപ്പിക്കുന്നു. ഒറ്റവാക്യം മാത്രമായി നൽകിയിരിക്കുന്ന സാഹചര്യത്തിൽ ‘എന്തെന്നാൽ’ എന്നു ചേർക്കുന്നത് മലയാളത്തിൽ അപൂർണവും കൃത്രിമവുമായി തോന്നാം; ആശയബന്ധം വാക്യത്തിന്റെ പ്രസ്താവനാസ്വഭാവത്തിൽ നിലനിൽക്കുന്നു.
- source_word: גּוֹי
  choice: ജനത
  rationale: ഒരു ജനസമൂഹത്തെ ഏകവചന കൂട്ടനാമമായി സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘ജനത’ സ്വാഭാവികവും മാന്യവുമാണ്.
- source_word: אֹבַד עֵצוֹת
  choice: ആലോചനയില്ലാത്ത
  rationale: പദസമുച്ചയം നല്ല ഉപദേശമോ വിവേകപൂർവമായ പദ്ധതിയോ നഷ്ടപ്പെട്ട അവസ്ഥയെ സൂചിപ്പിക്കുന്നു. ‘ആലോചനയില്ലാത്ത’ എന്നത് അർഥം സ്വാഭാവികമായി നൽകുന്നു; ‘നശിക്കുന്ന ആലോചനകൾ’ എന്ന അതിപദാനുപദ രൂപം ഒഴിവാക്കുന്നു.
- source_word: הֵמָּה
  choice: അവർ ... ആണ്
  rationale: സ്വതന്ത്ര സർവനാമത്തിന്റെ ഊന്നൽ നിലനിർത്തുകയും മലയാള നാമികവാക്യത്തിന് ആവശ്യമായ വിധേയരൂപം നൽകുകയും ചെയ്യുന്നു.
- source_word: וְאֵין
  choice: '...വുമില്ല'
  rationale: നിഷേധാത്മക അസ്തിത്വപ്രയോഗവും മുൻഖണ്ഡത്തോടുള്ള ബന്ധവും മലയാളത്തിലെ ‘-വുമില്ല’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בָּהֶם
  choice: അവരിൽ
  rationale: ജനതയ്ക്കുള്ളിൽ ഈ ഗുണം ഇല്ലെന്ന ആശയം നേരിട്ട് നൽകുന്നു.
- source_word: תְּבוּנָה
  choice: വിവേകം
  rationale: തിരിച്ചറിയാനും ശരിയായി ഗ്രഹിക്കാനുമുള്ള കഴിവിനെ സൂചിപ്പിക്കുന്ന ജ്ഞാനസാഹിത്യ പദമാണ്; ‘ആലോചന’യോടൊപ്പം അർഥവ്യത്യാസവും നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. എബ്രായ കവിതയിലെ സമാന്തര ഘടന രണ്ട് വരികളായി നിലനിർത്തി. സന്ദർഭബന്ധം വ്യക്തമാക്കുന്ന כִּי ഒറ്റവാക്യ പ്രസിദ്ധീകരണത്തിൽ കൃത്രിമമായ ബന്ധകമാകാതിരിക്കാനായി പ്രത്യേകം പദമാക്കിയിട്ടില്ല.
