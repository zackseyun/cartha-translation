source:
  edition: WLC
  text: כִּ֛י חֵ֥לֶק יְהֹוָ֖ה עַמּ֑/וֹ יַעֲקֹ֖ב חֶ֥בֶל נַחֲלָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/009.yaml
  text: For Yahweh’s portion is his people[a], Jacob the share of his inheritance.
translation:
  language: ml
  text: കാരണം, യഹോവയുടെ ഓഹരി അവിടുത്തെ ജനമാണ്; യാക്കോബ് അവിടുത്തെ അവകാശത്തിന്റെ വിഹിതം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “യാക്കോബ് അവിടുത്തെ അവകാശത്തിന്റെ അളവുകയർ” അല്ലെങ്കിൽ “യാക്കോബ് അവിടുത്തെ അവകാശമായി നറുക്കിട്ട പങ്ക്.” എബ്രായത്തിലെ חֶבֶל എന്ന പദത്തിന് അക്ഷരാർഥത്തിൽ ‘അളവുകയർ’ എന്നും, വിപുലാർഥത്തിൽ അളന്നുനൽകിയ വിഹിതം എന്നും അർഥമാകാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞതിന്റെ അടിസ്ഥാനമോ വിശദീകരണമോ അവതരിപ്പിക്കുന്ന ബന്ധകശക്തി നിലനിർത്തുന്നു.
- source_word: חֵלֶק
  choice: ഓഹരി
  rationale: ഒരാൾക്കു ലഭിക്കുന്ന പങ്ക് എന്ന അർഥം സ്വാഭാവികമായി നൽകുകയും തുടർന്നുള്ള അവകാശവിഹിതത്തിന്റെ ദൃശ്യവുമായി യോജിക്കുകയും ചെയ്യുന്നു.
- source_word: יְהֹוָה
  choice: യഹോവ
  rationale: എബ്രായപാഠത്തിലുള്ള ദൈവനാമത്തെ പൊതുവായി പരിചിതമായ മലയാളരൂപത്തിൽ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: עַמּוֹ
  choice: അവിടുത്തെ ജനം
  rationale: ഉടമ്പടിബന്ധം സൂചിപ്പിക്കുന്ന עַם എന്ന പദത്തിന് ‘ജനം’ സ്വാഭാവികവും ബന്ധപരവുമായ പരിഭാഷയാണ്.
- source_word: יַעֲקֹב
  choice: യാക്കോബ്
  rationale: ഇസ്രായേലിനെ സമൂഹമായി സൂചിപ്പിക്കുന്നുവെങ്കിലും മൂലപാഠത്തിലെ പിതൃനാമവും കാവ്യസമാന്തരതയും നിലനിർത്തുന്നു.
- source_word: חֶבֶל
  choice: വിഹിതം
  rationale: അളവുകയർ എന്ന അക്ഷരാർഥത്തിൽനിന്ന് വികസിച്ച, അളന്നുനൽകപ്പെട്ട പങ്ക് എന്ന സന്ദർഭാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: נַחֲלָתוֹ
  choice: അവിടുത്തെ അവകാശം
  rationale: പാരമ്പര്യമായി ലഭിക്കുന്ന സ്വത്തോ കൈവശമോ എന്ന അവകാശദൃശ്യത്തെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ നേരിട്ട് വന്നിരിക്കുന്ന ഉടമ്പടിനാമത്തെ പദവിയാക്കി മാറ്റാതെ സംരക്ഷിക്കുന്നു.
- issue: יַעֲקֹב എന്നത് വ്യാഖ്യാനപരമായി ‘ഇസ്രായേൽ’ ആക്കണമോ
  choice: യാക്കോബ്
  alternative: ഇസ്രായേൽ
  rationale: കാവ്യത്തിൽ ഉപയോഗിച്ചിരിക്കുന്ന പിതൃനാമവും അതിന്റെ സമൂഹസൂചനയും വ്യാഖ്യാനിച്ച് മാറ്റാതെ നിലനിർത്തുന്നു.
- issue: חֶבֶל എന്ന പദത്തിന്റെ രൂപകാത്മക അർഥം
  choice: വിഹിതം
  alternative: അളവുകയർ
  rationale: സമാന്തരമായ ‘ഓഹരി’, ‘അവകാശം’ എന്നീ പദങ്ങളോടു ചേർന്ന് ഇവിടെ അനുവദിച്ചുകിട്ടിയ പങ്ക് എന്ന അർഥം മുൻനിൽക്കുന്നു; എങ്കിലും അക്ഷരാർഥത്തിലെ ദൃശ്യസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കാവ്യഗദ്യം. ദൈവത്തെ സൂചിപ്പിക്കുന്ന സർവനാമത്തിൽ ആദരസൂചകമായ ‘അവിടുത്തെ’ ഉപയോഗിച്ചു; രണ്ടു സമാന്തര പാദങ്ങളുടെയും സംക്ഷിപ്തഘടന നിലനിർത്തി.
