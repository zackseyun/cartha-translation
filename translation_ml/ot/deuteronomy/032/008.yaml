revisions:
- from: അത്യുന്നതൻ ജനതകൾക്ക് അവരുടെ അവകാശം നൽകിയപ്പോൾ[a], അവൻ മനുഷ്യപുത്രന്മാരെ വേർതിരിച്ചപ്പോൾ[b], ഇസ്രായേൽപുത്രന്മാരുടെ എണ്ണമനുസരിച്ച് ജനവിഭാഗങ്ങളുടെ അതിരുകൾ നിശ്ചയിച്ചു.
  to: അത്യുന്നതൻ ജനതകൾക്ക് അവകാശവിഹിതം വിഭജിച്ചുകൊടുത്തപ്പോൾ, അവൻ മനുഷ്യരെ വേർതിരിച്ചപ്പോൾ[b], ഇസ്രായേൽപുത്രന്മാരുടെ എണ്ണത്തിനൊത്തവണ്ണം ജനവിഭാഗങ്ങളുടെ അതിരുകൾ സ്ഥാപിച്ചു[a].
  rationale: WLC മുഖ്യവായന മാറ്റിയിട്ടില്ല. പാഠഭേദക്കുറിപ്പിന്റെ അടയാളം അതു ബാധിക്കുന്ന അവസാന പദസമുച്ചയത്തിലേക്കു മാറ്റി. ബְּנֵי אָדָם-നുള്ള പരിഭാഷ ആധുനിക മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികമാക്കുകയും അതിന്റെ വിശാലമായ മനുഷ്യസൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്തു. ‘വിഭജിച്ചുകൊടുത്തപ്പോൾ’ നחל-ന്റെ വിതരണം/അവകാശവിഹിതം നൽകൽ എന്ന സന്ദർഭാർഥം സംരക്ഷിക്കുന്നു.
