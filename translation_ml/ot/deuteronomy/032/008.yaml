reference: Deuteronomy 32:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בְּ/הַנְחֵ֤ל עֶלְיוֹן֙ גּוֹיִ֔ם בְּ/הַפְרִיד֖/וֹ בְּנֵ֣י אָדָ֑ם יַצֵּב֙ גְּבֻלֹ֣ת עַמִּ֔ים לְ/מִסְפַּ֖ר בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/008.yaml
  text: When the Most High gave the nations their inheritance[a], when he separated the sons of man[b], he fixed the boundaries of the peoples according to the number of the sons of Israel.
translation:
  language: ml
  text: അത്യുന്നതൻ ജനതകൾക്ക് അവകാശവിഹിതം വിഭജിച്ചുകൊടുത്തപ്പോൾ, അവൻ മനുഷ്യരെ വേർതിരിച്ചപ്പോൾ[b], ഇസ്രായേൽപുത്രന്മാരുടെ എണ്ണത്തിനൊത്തവണ്ണം ജനവിഭാഗങ്ങളുടെ അതിരുകൾ സ്ഥാപിച്ചു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചാവുകടൽ ചുരുളുകളിലെ ഒരു പാഠസാക്ഷ്യത്തിൽ “ദൈവപുത്രന്മാർ” എന്നും സെപ്റ്റുവജിന്റിൽ “ദൈവദൂതന്മാർ” എന്നും വായിക്കുന്നു; മസോരറ്റിക് പാഠത്തിൽ “ഇസ്രായേൽപുത്രന്മാർ” എന്നാണ്.
    reason: textual_variant
  - marker: b
    text: “മനുഷ്യർ” എന്നത് മനുഷ്യരെയോ മനുഷ്യരാശിയെയോ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ വിവർത്തനമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/הַנְחֵל
  choice: അവകാശം നൽകിയപ്പോൾ
  rationale: നחל എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ ജനതകൾക്ക് അവരുടെ ഓഹരി അഥവാ അവകാശം നിശ്ചയിച്ചുകൊടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; בְּ എന്ന ഉപസർഗം കാലസൂചക ഉപവാക്യം രൂപപ്പെടുത്തുന്നു.
- source_word: עֶלְיוֹן
  choice: അത്യുന്നതൻ
  rationale: ഇവിടെ ദൈവിക സ്ഥാനനാമമാണ്; മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ രൂപം.
- source_word: גּוֹיִם
  choice: ജനതകൾ
  rationale: പിന്നീടുള്ള യഹൂദ-ജാതീയ വേർതിരിവിലെ ‘വിജാതീയർ’ എന്ന അർഥമല്ല, ലോകത്തിലെ വിവിധ ജനതകളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: בְּ/הַפְרִיד/וֹ
  choice: അവൻ ... വേർതിരിച്ചപ്പോൾ
  rationale: കാലസൂചകമായ മറ്റൊരു ക്രിയാരൂപം; മൂന്നാംപുരുഷ ഏകവചന പ്രത്യയം അത്യുന്നതനെ സൂചിപ്പിക്കുന്നു.
- source_word: בְּנֵי אָדָם
  choice: മനുഷ്യപുത്രന്മാർ
  rationale: എബ്രായത്തിലെ പുല്ലിംഗ ബഹുവചനവും കാവ്യാത്മക രൂപവും നിലനിർത്തുന്നു; പ്രയോഗം മനുഷ്യരാശിയെ പൊതുവായി സൂചിപ്പിക്കുന്നുവെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: יַצֵּב
  choice: നിശ്ചയിച്ചു
  rationale: ഉറപ്പായി സ്ഥാപിക്കുക, ക്രമപ്പെടുത്തുക എന്ന ഹിഫീൽ അർഥം അതിരുകളുടെ സന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: גְּבֻלֹת עַמִּים
  choice: ജനവിഭാഗങ്ങളുടെ അതിരുകൾ
  rationale: עמים എന്നത് വംശീയമോ രാഷ്ട്രീയമോ ആയ ജനവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്നു; ‘ജനതകൾ’ എന്ന മുൻപത്തെ പദത്തിന്റെ അനാവശ്യ ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: לְ/מִסְפַּר
  choice: എണ്ണമനുസരിച്ച്
  rationale: അളവിനോടോ എണ്ണത്തോടോ ഉള്ള പൊരുത്തം സൂചിപ്പിക്കുന്ന ഉപസർഗപ്രയോഗം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽപുത്രന്മാർ
  rationale: നൽകിയിരിക്കുന്ന മസോരറ്റിക് പാഠത്തിലെ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന വായന സുതാര്യമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: അവസാന വാക്യഭാഗത്തിലെ പാഠഭേദം
  choice: ഇസ്രായേൽപുത്രന്മാർ
  alternative: ദൈവപുത്രന്മാർ / ദൈവദൂതന്മാർ
  rationale: നൽകിയിരിക്കുന്ന WLC മസോരറ്റിക് പാഠം בני ישראל എന്നാണ് വായിക്കുന്നത്; അതിനാൽ മുഖ്യപാഠം അതിനെ പിന്തുടരുന്നു. എന്നാൽ ചാവുകടൽ ചുരുളുകളിലെയും സെപ്റ്റുവജിന്റിലെയും പ്രധാന പാഠസാക്ഷ്യം വ്യത്യസ്തമായ ദൈവിക-സഭാ വായന സംരക്ഷിക്കുന്നതിനാൽ, വ്യാഖ്യാനത്തെ ഗണ്യമായി ബാധിക്കുന്ന ആ പാഠഭേദം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: בני אדם എന്ന മനുഷ്യശാസ്ത്രപരമായ പ്രയോഗം
  choice: മനുഷ്യപുത്രന്മാർ
  alternative: മനുഷ്യർ / മനുഷ്യരാശി
  rationale: എബ്രായത്തിലെ പ്രതിനിധിപരമായ പുല്ലിംഗരൂപവും കാവ്യഭാവവും മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; അതിന്റെ വിശാലമായ മാനവിക സൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ കാവ്യാത്മക ഗൗരവം നിലനിർത്തുന്ന ശൈലി. സമാന്തരമായ രണ്ടു കാലസൂചക ഉപവാക്യങ്ങളും മുഖ്യക്രിയയായ ‘നിശ്ചയിച്ചു’ എന്നതിലേക്കുള്ള ഘടനയും സംരക്ഷിച്ചിട്ടുണ്ട്.
