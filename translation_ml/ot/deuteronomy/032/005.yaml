id: DEU.32.5
reference: Deuteronomy 32:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: שִׁחֵ֥ת ל֛/וֹ לֹ֖א בָּנָ֣י/ו מוּמָ֑/ם דּ֥וֹר עִקֵּ֖שׁ וּ/פְתַלְתֹּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/005.yaml
  text: They have acted corruptly toward him[a]; they are not his children, because of their defect[b]. They are a crooked and twisted generation.
translation:
  language: ml
  text: അവർ അവനോടു ദുഷിച്ചു പെരുമാറി[a]; തങ്ങളുടെ കളങ്കം നിമിത്തം അവർ അവന്റെ മക്കളല്ല[b]. അവർ വക്രവും വികൃതവുമായ ഒരു തലമുറയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠം ദുഷ്കരവും അത്യന്തം സങ്കുചിതവുമാണ്. ആദ്യഭാഗം ‘അവർ തങ്ങളെത്തന്നെ ദുഷിപ്പിച്ചു’ എന്നും ഗ്രഹിക്കാം; തുടർന്നുള്ള പദസമുച്ചയം ‘അവരുടെ കളങ്കം’ അല്ലെങ്കിൽ ‘അവരുടെ കുറ്റം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
  - marker: b
    text: വാക്യത്തിലെ പദബന്ധം സങ്കുചിതമായതിനാൽ ‘തങ്ങളുടെ കളങ്കം നിമിത്തം’ എന്ന ബന്ധം വ്യാഖ്യാനാത്മകമായി നൽകിയതാണ്; ‘കളങ്കം അവരുടേതാണ്’ എന്നും ഗ്രഹിക്കാം.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: שִׁחֵת
  choice: ദുഷിച്ചുപെരുമാറി
  rationale: പിയേൽ രൂപം ദുഷിച്ച പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. വ്യഞ്ജനപാഠത്തിൽ വ്യക്തമായി ഇല്ലാത്ത ആത്മവാചക അർഥം നിർബന്ധിക്കാതെ ക്രിയയുടെ ശക്തി നിലനിർത്തുന്നു.
- source_word: לוֹ
  choice: അവനോടു
  rationale: പ്രത്യയത്തോടുകൂടിയ ל എന്ന ബന്ധസൂചകം ഇവിടെ സങ്കുചിതവും ദുഷ്കരവുമാണ്. ‘അവനുവേണ്ടി’ എന്നോ ‘അവനെതിരെ’ എന്നോ അതിരുകടന്ന് നിർവചിക്കാതെ ദൈവത്തോടുള്ള ബന്ധം ‘അവനോടു’ സംരക്ഷിക്കുന്നു.
- source_word: לֹא בָּנָיו
  choice: അവർ അവന്റെ മക്കളല്ല
  rationale: ക്രിയയില്ലാത്ത ഹ്രസ്വവാക്യം സ്വാഭാവിക മലയാളത്തിൽ പൂർണ്ണവാക്യമായി നൽകിയിരിക്കുന്നു. എബ്രായത്തിൽ ഇല്ലാത്ത ‘ഇനി’ എന്ന കാലസൂചന ചേർത്തിട്ടില്ല.
- source_word: מוּמָם
  choice: തങ്ങളുടെ കളങ്കം നിമിത്തം
  rationale: מוּם എന്നത് സാധാരണയായി ന്യൂനതയെയോ കളങ്കത്തെയോ സൂചിപ്പിക്കുന്നു. ഇവിടെ ധാർമികരൂപകം നിലനിർത്താൻ ‘കളങ്കം’ തെരഞ്ഞെടുത്തു; വാക്യഘടനയിലെ സങ്കുചിതബന്ധം വ്യക്തമാക്കാൻ ‘നിമിത്തം’ ചേർത്തു.
- source_word: דּוֹר
  choice: തലമുറ
  rationale: കാവ്യപരവും ഉടമ്പടിസംബന്ധവുമായ സന്ദർഭത്തിൽ കൃത്യവും സ്വാഭാവികവുമായ സാധാരണ മലയാളപദം.
- source_word: עִקֵּשׁ
  choice: വക്രം
  rationale: വളഞ്ഞതോ ധാർമികമായി വഴിതെറ്റിയതോ എന്ന ദൃശ്യരൂപകം നിലനിർത്തുന്നു; തുടർന്നുള്ള അപൂർവവിശേഷണത്തിൽനിന്ന് വേർതിരിച്ചും കാണിക്കുന്നു.
- source_word: וּפְתַלְתֹּל
  choice: വളഞ്ഞത്
  rationale: തലമുറയുടെ ധാർമികവികൃതിയെ തീവ്രമാക്കുന്ന അപൂർവവിശേഷണം. ‘വക്രം’ എന്ന മുൻപദത്തോടൊപ്പം ദൃശ്യരൂപവും കാവ്യസമാന്തരതയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: לֹא בָּנָיו എന്നത് ഉടമ്പടിപരമായ പുത്രത്വനഷ്ടമാണോ, മക്കൾക്കൊത്ത സ്വഭാവത്തിന്റെ നിഷേധമാണോ
  choice: അവർ അവന്റെ മക്കളല്ല
  alternative: അവർ ഇനി അവന്റെ മക്കളല്ല; അവർ അവനു മക്കളല്ല
  rationale: കാലസൂചനയില്ലാതെ എബ്രായം നിഷേധം തീക്ഷ്ണമായി പ്രസ്താവിക്കുന്നു. അതിനാൽ വാക്യത്തിന്റെ ഗൗരവം നിലനിർത്തുകയും ഉടമ്പടിസ്ഥിതിയെക്കുറിച്ചുള്ള വികസിതമായ ദൈവശാസ്ത്രനിഗമനം പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതിരിക്കുകയും ചെയ്തു.
- issue: ആദ്യ കാവ്യപാദത്തിന്റെ സങ്കുചിത വാക്യഘടന എങ്ങനെ ഗ്രഹിക്കണം
  choice: അവർ അവനോടു ദുഷിച്ചുപെരുമാറി; തങ്ങളുടെ കളങ്കം നിമിത്തം അവർ അവന്റെ മക്കളല്ല
  alternative: അവർ തങ്ങളെത്തന്നെ ദുഷിപ്പിച്ചു; അവർ അവന്റെ മക്കളല്ല; കളങ്കം അവരുടേതാണ്
  rationale: മസോററ്റിക് സ്വരചിഹ്നങ്ങൾക്കൊത്ത സാധാരണ ഗ്രഹണം പിന്തുടർന്ന് അർഥവത്തായ മലയാളം നൽകിയിരിക്കുന്നു. എന്നാൽ യഥാർഥമായ വാക്യഘടനാപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കാവ്യഭാഷ ഉപയോഗിച്ചു. ‘വക്രവും വളഞ്ഞതുമായ’ എന്ന ഇരട്ടപ്രയോഗം എബ്രായത്തിലെ രണ്ടു വ്യത്യസ്ത വിശേഷണങ്ങളുടെയും ദൃശ്യരൂപവും ശക്തിവർധനവും നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
