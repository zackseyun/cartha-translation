  rationale: 'പാഠത്തിന്റെ ദുഷ്കരമായ വാക്യഘടനയെയോ ദൈവശാസ്ത്രപരമായ തുറന്നുനിൽപ്പിനെയോ മാറ്റാതെ, രണ്ട് ചെറിയ ഭാഷാപരിഷ്കാരങ്ങൾ മാത്രം വരുത്തി: ക്രിയയുടെ സ്വാഭാവിക എഴുത്തുരീതിയും അവസാനത്തെ ഇരട്ടവിശേഷണങ്ങളുടെ കൂടുതൽ വ്യക്തമായ വ്യത്യാസവും. മുഖ്യപാഠത്തിലെ അടിക്കുറിപ്പു-ആങ്കറുകൾക്കും അടിക്കുറിപ്പുകളിലെ യഥാർഥ ബദൽവായനകൾക്കും മാറ്റമില്ല.'
