source:
  edition: WLC
  text: יִמְצָאֵ֨/הוּ֙ בְּ/אֶ֣רֶץ מִדְבָּ֔ר וּ/בְ/תֹ֖הוּ יְלֵ֣ל יְשִׁמֹ֑ן יְסֹֽבְבֶ֨/נְהוּ֙ יְב֣וֹנְנֵ֔/הוּ יִצְּרֶ֖/נְהוּ כְּ/אִישׁ֥וֹן עֵינֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/010.yaml
  text: He found him in a desert land[a], and in the howling waste of the wilderness; he surrounded him, he cared for him[b], he guarded him like the pupil of his eye.
translation:
  language: ml
  text: മരുഭൂമിയായ ഒരു ദേശത്തും ഓരിയിടുന്ന വിജനമായ മരുഭൂമിയിലും അവിടുന്ന് അവനെ കണ്ടെത്തി; അവനെ ചുറ്റിനിന്നു, അവനെ ശ്രദ്ധയോടെ പരിഗണിച്ചു[a], തന്റെ കണ്ണിലെ കൃഷ്ണമണിപോലെ[b] അവനെ കാത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ശ്രദ്ധയോടെ പരിഗണിച്ചു” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന എബ്രായ ക്രിയയ്ക്ക് “അവന് വിവേകം നൽകി” അല്ലെങ്കിൽ “അവനെ ശ്രദ്ധാപൂർവം നിരീക്ഷിച്ചു” എന്നും അർഥമാകാം.
    reason: alternative_reading
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “തന്റെ കണ്ണിലെ കൃഷ്ണമണിപോലെ”; പരമ്പരാഗത പ്രയോഗത്തിൽ, “തന്റെ കണ്ണിലെ മണിപോലെ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמְצָאֵהוּ
  choice: അവിടുന്ന് അവനെ കണ്ടെത്തി
  rationale: מצא എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘കണ്ടെത്തുക’ നിലനിർത്തുന്നു; കാവ്യത്തിലെ ഭൂതകാലസ്മരണയ്ക്കനുസരിച്ച് ഭൂതകാലം ഉപയോഗിച്ചു.
- source_word: בְּאֶרֶץ מִדְבָּר
  choice: മരുഭൂമിയായ ഒരു ദേശത്ത്
  rationale: אֶרֶץ എന്ന ‘ദേശം’, מִדְבָּר എന്ന ‘മരുഭൂമി/വിജനപ്രദേശം’ എന്നീ ഘടകങ്ങൾ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וּבְתֹהוּ יְלֵל יְשִׁמֹן
  choice: വിജനമായ മരുപ്പറമ്പിന്റെ ഓരിയിടലിനിടയിൽ
  rationale: תֹהוּയിലെ വിജനതയും יְלֵל എന്ന ഓരിയിടലും יְשִׁמֹן എന്ന വരണ്ട മരുപ്പറമ്പും ഒതുക്കമുള്ള കാവ്യഭാഷയിൽ പ്രതിഫലിപ്പിക്കുന്നു; ‘കലാപം’ പോലുള്ള സൃഷ്ടിവിവരണസംബന്ധിയായ അർഥം ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: יְסֹבְבֶנְהוּ
  choice: അവനെ ചുറ്റിനിന്നു
  rationale: סבב എന്നതിലെ ചുറ്റുക/വലയംചെയ്യുക എന്ന മൂർത്തദൃശ്യം സൂക്ഷിക്കുന്നു; സംരക്ഷണം എന്ന ആശയം നേരിട്ട് വ്യാഖ്യാനിച്ച് ചേർക്കുന്നില്ല.
- source_word: יְבֹונְנֵהוּ
  choice: അവനെ കരുതലോടെ പരിഗണിച്ചു
  rationale: בין/בונן എന്ന ക്രിയയിലെ ശ്രദ്ധാപൂർവം പരിഗണിക്കുക എന്ന അർഥവും സന്ദർഭത്തിലെ പരിപാലനഭാവവും ഒരുമിച്ച് നൽകുന്നു; ‘അവന് വിവേകം നൽകി’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: יִצְּרֶנְהוּ
  choice: അവനെ കാത്തു
  rationale: נצר എന്ന ക്രിയയുടെ കാക്കുക/സൂക്ഷിക്കുക എന്ന സംരക്ഷണാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כְּאִישׁוֹן עֵינוֹ
  choice: തന്റെ കണ്ണിലെ കൃഷ്ണമണിപോലെ
  rationale: אִישׁוֹן സൂചിപ്പിക്കുന്ന കണ്ണിന്റെ pupil എന്ന ദൃശ്യം മലയാളത്തിലെ വ്യക്തവും പരിചിതവുമായ ‘കൃഷ്ണമണി’കൊണ്ട് നൽകുന്നു.
theological_decisions:
- issue: പുരുഷ ഏകവചന സർവനാമങ്ങളുടെ സൂചിതവ്യക്തി
  choice: ഇസ്രായേൽ/യാക്കോബിനെ സമൂഹത്തെ പ്രതിനിധീകരിക്കുന്ന ഏകവചനമായി കണ്ട് ‘അവനെ’ നിലനിർത്തി.
  alternative: ബഹുവചനമായ ‘അവരെ’ എന്നു വ്യക്തമാക്കുക, അല്ലെങ്കിൽ വ്യക്തിയായ യാക്കോബിനെ മാത്രം സൂചിപ്പിക്കുന്നതായി വായിക്കുക.
  rationale: വിശാലസന്ദർഭം ജനത്തെ ഏകവചനത്തിൽ വ്യക്തിവൽക്കരിക്കുന്നു; മൂലഭാഷയുടെ വ്യാകരണവും കാവ്യരൂപവും മാറ്റാതെ സൂക്ഷിക്കുന്നു.
- issue: יְבֹונְנֵהוּ എന്ന ദൈവിക പ്രവർത്തിയുടെ സൂക്ഷ്മാർഥം
  choice: ‘കരുതലോടെ പരിഗണിച്ചു’ എന്ന ശ്രദ്ധയും പരിപാലനവും ഉൾക്കൊള്ളുന്ന വിവർത്തനം.
  alternative: ‘അവന് വിവേകം നൽകി’ അല്ലെങ്കിൽ ‘അവനെ ഉപദേശിച്ചു’.
  rationale: ക്രിയയ്ക്ക് മനസ്സിലാക്കുക, ശ്രദ്ധിക്കുക, വിവേകം നൽകുക എന്നീ സാധ്യതകളുണ്ട്. ചുറ്റിനിൽക്കുകയും കാക്കുകയും ചെയ്യുന്ന ക്രിയകളുടെ നിരയിൽ ശ്രദ്ധാപൂർവമായ കരുതൽ യോജിക്കുന്നു; എങ്കിലും ബൗദ്ധിക അർഥസാധ്യത അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കാവ്യഗദ്യം. ദൈവത്തെ സൂചിപ്പിക്കാൻ ആദരസൂചകമായ ‘അവിടുന്ന്’ ഉപയോഗിച്ചു; ഇസ്രായേൽ/യാക്കോബിന്റെ സമൂഹവ്യക്തിവൽക്കരണം ‘അവനെ’ എന്ന ഏകവചനത്തിൽ നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടുണ്ട്.
