- from: പ്രതികാരം എനിക്കുള്ളത്[a]; പ്രതിഫലം നൽകുന്നതും എനിക്കുള്ളത്. അവരുടെ കാൽ വഴുതുന്ന സമയത്ത് അതു സംഭവിക്കും[b]. അവരുടെ ദുരന്തദിവസം അടുത്തിരിക്കുന്നു; അവർക്കായി ഒരുക്കിയിരിക്കുന്നവ വേഗത്തിൽ വന്നെത്തുന്നു[c][d].
  to: പ്രതികാരവും പ്രതിഫലവും എനിക്കുള്ളതാണ്; അവരുടെ കാൽ വഴുതുന്ന സമയത്ത്. അവരുടെ ദുരന്തത്തിന്റെ ദിവസം അടുത്തിരിക്കുന്നു; അവർക്കായി ഒരുക്കിയിരിക്കുന്നവ വേഗത്തിൽ വരുന്നു[c][d].
