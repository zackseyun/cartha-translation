id: DEU.32.35
reference: Deuteronomy 32:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לִ֤/י נָקָם֙ וְ/שִׁלֵּ֔ם לְ/עֵ֖ת תָּמ֣וּט רַגְלָ֑/ם כִּ֤י קָרוֹב֙ י֣וֹם אֵידָ֔/ם וְ/חָ֖שׁ עֲתִדֹ֥ת לָֽ/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/035.yaml
  text: Vengeance is mine[a], and recompense, at the time when their foot slips; for the day of their disaster is near[d][c][b], and what is prepared for them hastens.
translation:
  language: ml
  text: പ്രതികാരവും പ്രതിഫലവും എനിക്കുള്ളതാണ്; അവരുടെ കാൽ വഴുതുന്ന സമയത്ത്. അവരുടെ ദുരന്തത്തിന്റെ ദിവസം അടുത്തിരിക്കുന്നു; അവർക്കായി ഒരുക്കിയിരിക്കുന്നവ വേഗത്തിൽ വരുന്നു[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: അഥവാ, ‘അവർക്കു നിശ്ചയിച്ചിരിക്കുന്ന കാര്യങ്ങൾ വേഗത്തിൽ അടുത്തുവരുന്നു.’ എബ്രായപ്രയോഗം സംക്ഷിപ്തമാണ്.
    reason: lexical_alternative
  - marker: d
    text: ഈ വാക്യത്തിന്റെ ആദ്യഭാഗം റോമർ 12:19-ൽ ഉദ്ധരിക്കപ്പെടുകയും എബ്രായർ 10:30-ൽ പ്രതിധ്വനിക്കുകയും ചെയ്യുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: לִי נָקָם וְשִׁלֵּם
  choice: പ്രതികാരം എനിക്കുള്ളത്; പ്രതിഫലം നൽകുന്നതും എനിക്കുള്ളത്
  rationale: לִי എന്നത് ഇരു സമാന്തര നാമപ്രയോഗങ്ങളോടും ബന്ധപ്പെടുത്തി ദൈവത്തിന്റെ ന്യായവിധിക്കുള്ള അവകാശം വ്യക്തമാക്കുന്നു. נָקָם എന്നതിന് ഗൗരവമുള്ള ‘പ്രതികാരം’ എന്നും, שִׁלֵּם എന്ന നാമപ്രയോഗത്തിന് സ്വാഭാവികമായ ‘പ്രതിഫലം നൽകുന്നത്’ എന്നും നൽകി.
- source_word: לְעֵת תָּמוּט רַגְלָם
  choice: അവരുടെ കാൽ വഴുതുന്ന സമയത്ത്
  rationale: ഏകവചനമായ ‘കാൽ’ ഉൾപ്പെടുന്ന എബ്രായ കൂട്ടായ രൂപകവും വീഴ്ച അടുത്തിരിക്കുന്നുവെന്ന ദൃശ്യവും നിലനിർത്തുന്നു.
- source_word: כִּי קָרוֹב יוֹם אֵידָם
  choice: അവരുടെ ദുരന്തദിവസം അടുത്തിരിക്കുന്നു
  rationale: אֵיד എന്നത് വിനാശകരമായ ദുരന്തത്തെ സൂചിപ്പിക്കുന്നു; ‘ദുരന്തദിവസം’ ലളിതവും കവിതാത്മകവുമാണ്.
- source_word: וְחָשׁ עֲתִדֹת לָמוֹ
  choice: അവർക്കായി ഒരുക്കിയിരിക്കുന്നവ വേഗത്തിൽ വന്നെത്തുന്നു
  rationale: എബ്രായത്തിലെ സംക്ഷിപ്തമായ ബഹുവചനപ്രയോഗം നിലനിർത്തിക്കൊണ്ട്, അതിനെ ‘വിധി’ അല്ലെങ്കിൽ ‘നാശം’ എന്ന് അമിതമായി നിർവചിക്കാതെ സമീപിച്ചുകൊണ്ടിരിക്കുന്നതിന്റെ അർഥം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ദൈവിക പ്രതികാരത്തിന്റെ സ്വഭാവം
  choice: ‘പ്രതികാരം എനിക്കുള്ളത്’ എന്ന ദൈവിക അവകാശവാദം നിലനിർത്തി
  alternative: ‘നീതി എനിക്കുള്ളത്’ / ‘ഞാൻ പകവീട്ടും’
  rationale: മൂലപാഠം ന്യായവിധിയിലെ ദൈവത്തിന്റെ പ്രത്യേക അവകാശത്തെ പ്രസ്താവിക്കുന്നു. ‘പ്രതികാരം’ അതിന്റെ ഭാരം നിലനിർത്തുന്നു; ‘പകവീട്ടൽ’ എന്ന വ്യക്തിപരമായ വൈരഭാവം ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: עֲתִדֹת לָמוֹ എന്ന സംക്ഷിപ്ത പ്രയോഗം
  choice: ‘അവർക്കായി ഒരുക്കിയിരിക്കുന്നവ’
  alternative: ‘അവരുടെ അന്തിമവിധി’ / ‘അവർക്കു വരാനിരിക്കുന്ന കാര്യങ്ങൾ’
  rationale: എന്താണ് ഒരുക്കിയിരിക്കുന്നത് എന്നതിനെ മൂലപാഠം തുറന്നുവിടുന്നു. അതിനാൽ അമൂർത്തമായ ‘വിധി’ എന്നു നിർണ്ണയിക്കാതെ യഥാർഥ അനിശ്ചിതത്വം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ഗൗരവമുള്ള കവിതാത്മക ശൈലി. സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പദങ്ങൾ ഉപയോഗിച്ചു; എബ്രായ സമാന്തരതയും സംക്ഷിപ്തതയും കഴിയുന്നത്ര നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
