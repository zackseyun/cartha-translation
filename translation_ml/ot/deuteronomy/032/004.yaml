source:
  edition: WLC
  text: הַ/צּוּר֙ תָּמִ֣ים פָּעֳל֔/וֹ כִּ֥י כָל דְּרָכָ֖י/ו מִשְׁפָּ֑ט אֵ֤ל אֱמוּנָה֙ וְ/אֵ֣ין עָ֔וֶל צַדִּ֥יק וְ/יָשָׁ֖ר הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/004.yaml
  text: The Rock—his work is perfect[a], for all his ways are justice. He is a God of faithfulness and without injustice[c][b], righteous and upright is he.
translation:
  language: ml
  text: പാറയായവൻ—അവന്റെ പ്രവൃത്തി തികവുറ്റത്; എന്തെന്നാൽ, അവന്റെ എല്ലാ വഴികളും നീതിയാണ്.[a] അവൻ വിശ്വസ്തനായ ദൈവം;[b] അനീതിയില്ലാത്തവൻ.[c] നീതിമാനും നേരുള്ളവനും ആകുന്നു അവൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അവന്റെ എല്ലാ വഴികളും ന്യായവിധിയാണ്.” എബ്രായത്തിലെ מִשְׁפָּט എന്ന പദത്തിന് ‘നീതി,’ ‘ന്യായവിധി,’ ‘ന്യായമായത്’ എന്നീ അർഥങ്ങൾ വരാം.'
    reason: lexical_alternative
  - marker: b
    text: “വിശ്വസ്തനായ ദൈവം” എന്നതിന് “വിശ്വസ്തതയുടെ ദൈവം” എന്നും, ഈ സന്ദർഭത്തിൽ സാധ്യത കുറവാണെങ്കിലും, “സത്യത്തിന്റെ ദൈവം” എന്നും മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: c
    text: 'അഥവാ: “അവനിൽ തെറ്റൊന്നുമില്ല” / “അവനിൽ അകൃത്യമില്ല.” എബ്രായത്തിലെ עָוֶל ധാർമ്മികമായ തെറ്റ്, അനീതി, അകൃത്യം എന്നിവയെ സൂചിപ്പിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצּוּר
  choice: പാറയായവൻ
  rationale: ഇവിടെ צוּר ദൈവത്തെ സൂചിപ്പിക്കുന്ന രൂപകാത്മകമായ വിശേഷണപ്പേരാണ്. മലയാളത്തിൽ വെറും ‘പാറ’ എന്നതിനെക്കാൾ ‘പാറയായവൻ’ വ്യക്തിസൂചനയും രൂപകവും ഒരുമിച്ച് സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: תָּמִים
  choice: തികവുറ്റത്
  rationale: ദൈവത്തിന്റെ പ്രവൃത്തിയുടെ സമ്പൂർണതയും കുറ്റമറ്റ അഖണ്ഡതയും സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘തികവുറ്റത്’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: פָּעֳלוֹ
  choice: അവന്റെ പ്രവൃത്തി
  rationale: ഏകവചന നാമരൂപം നിലനിർത്തിക്കൊണ്ട് ദൈവത്തിന്റെ പ്രവർത്തനത്തെ സമാഹാരപരമായി സൂചിപ്പിക്കുന്നു.
- source_word: כִּי
  choice: ;
  rationale: ഹീബ്രുവിൽ ഇത് മുമ്പത്തെ പ്രസ്താവനയുടെ കാരണം വിശദീകരിക്കുന്നു. മലയാള കവിതാഭാവത്തിൽ അർദ്ധവിരാമം ആ ബന്ധം സ്വാഭാവികമായി വഹിക്കുന്നു; ആശയം വേർപെടുത്തുന്നില്ല.
- source_word: כָל־דְּרָכָיו
  choice: അവന്റെ വഴികളെല്ലാം
  rationale: പ്രവർത്തനരീതിയെ സൂചിപ്പിക്കുന്ന ഹീബ്രു രൂപകം ‘വഴികൾ’ എന്ന പദത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: מִשְׁפָּט
  choice: നീതി
  rationale: ഇവിടെ ദൈവത്തിന്റെ എല്ലാ വഴികളുടെയും ന്യായസമ്മത സ്വഭാവമാണ് പ്രതിപാദ്യം. ‘നീതി’ ധാർമ്മികവും ന്യായവിധിസംബന്ധവുമായ അർത്ഥവ്യാപ്തി സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: אֵל אֱמוּנָה
  choice: വിശ്വസ്തതയുടെ ദൈവം
  rationale: നാമഘടനയും אֱמוּנָהയുടെ വിശ്വാസയോഗ്യത/സ്ഥിരത എന്ന സ്വഭാവവും നിലനിർത്തുന്നു; ‘വിശ്വസ്തനായ ദൈവം’ എന്ന ഗുണവിശേഷണ വായനയും അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וְאֵין עָוֶל
  choice: അനീതിയില്ലാത്തവൻ
  rationale: ദൈവത്തിൽ ധാർമ്മികമായ തെറ്റോ അന്യായമോ ഇല്ലെന്ന നിഷേധം മലയാളത്തിൽ സംക്ഷിപ്തവും വ്യക്തവുമായി നൽകുന്നു.
- source_word: צַדִּיק
  choice: നീതിമാൻ
  rationale: ദൈവത്തിന്റെ നീതിയുള്ള സ്വഭാവം സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാള പദം.
- source_word: וְיָשָׁר
  choice: നേരുള്ളവൻ
  rationale: ധാർമ്മികമായ നേരും അഖണ്ഡതയും സൂചിപ്പിക്കുകയും ‘നീതിമാൻ’ എന്നതിനോട് കവിതാപരമായി ചേരുകയും ചെയ്യുന്നു.
- source_word: הוּא
  choice: ആകുന്നു അവൻ
  rationale: ഹീബ്രുവിലെ വാക്യാന്ത്യ ഊന്നൽ കഴിയുന്നത്ര നിലനിർത്താൻ മലയാളത്തിലും സർവനാമം അവസാനം വെക്കുന്നു.
theological_decisions:
- issue: הַצּוּר എന്ന ദൈവിക രൂപകത്തിന്റെ വിവർത്തനം
  choice: പാറയായവൻ
  alternative: പാറ
  rationale: ദൈവത്തെ പാറയോട് ഉപമിക്കുന്ന മൂലരൂപകം സംരക്ഷിക്കുകയും മലയാളത്തിൽ അത് വ്യക്തിയെ സൂചിപ്പിക്കുന്ന വിശേഷണപ്പേരാണെന്ന് വ്യക്തമാക്കുകയും ചെയ്യുന്നു; അധികമായ സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: אֱמוּנָה എന്ന ദൈവിക ഗുണം
  choice: വിശ്വസ്തത
  alternative: സത്യം / വിശ്വാസ്യത
  rationale: സന്ദർഭത്തിൽ ദൈവത്തിന്റെ ആശ്രയയോഗ്യതയും സ്ഥിരമായ വിശ്വസ്തതയുമാണ് മുൻനിൽക്കുന്നത്. ‘സത്യം’ എന്നത് അർത്ഥത്തെ ആശയസത്യത്തിലേക്ക് അനാവശ്യമായി ചുരുക്കാം; എങ്കിലും വ്യാകരണപരമായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമേറിയ മലയാളം. മോശെയുടെ പാട്ടിന്റെ കവിതാഭാവം നിലനിർത്താൻ സമാന്തര ഘടനയും വാക്യാന്ത്യ ഊന്നലും ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട മുഖ്യപാഠഭാഗങ്ങളിൽ ചേർത്തിരിക്കുന്നു.
