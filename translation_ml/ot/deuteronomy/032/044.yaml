  naturalness: ‘ജനങ്ങൾ കേൾക്കെ’ സ്വാഭാവികവും പൊതുസമ്മുഖത്തിലുള്ള വാചികപ്രഖ്യാപനത്തിന്റെ ആശയം നൽകുന്നതുമാണ്. വിഷയങ്ങളെ തുടക്കത്തിൽ ഒരുമിച്ച് ചേർക്കുന്നതു ആധുനിക നിലവാരമലയാളത്തിൽ കൂടുതൽ ഒഴുക്കും വ്യക്തതയും നൽകും.
