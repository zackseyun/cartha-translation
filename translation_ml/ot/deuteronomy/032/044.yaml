source:
  edition: WLC
  text: וַ/יָּבֹ֣א מֹשֶׁ֗ה וַ/יְדַבֵּ֛ר אֶת כָּל דִּבְרֵ֥י הַ/שִּׁירָֽה הַ/זֹּ֖את בְּ/אָזְנֵ֣י הָ/עָ֑ם ה֖וּא וְ/הוֹשֵׁ֥עַ בִּן נֽוּן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/044.yaml
  text: Then Moses came and spoke all the words of this song in the hearing of the people[a], he and Hoshea son of Nun.
translation:
  language: ml
  text: പിന്നെ മോശയും നൂന്റെ മകനായ ഹോശേയയും വന്ന് ഈ പാട്ടിലെ എല്ലാ വാക്കുകളും ജനങ്ങൾ കേൾക്കെ സംസാരിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ ‘ഹോശേയ’; മറ്റിടങ്ങളിൽ ഈ വ്യക്തി സാധാരണയായി ‘യോശുവ’ എന്നു വിളിക്കപ്പെടുന്നു (സംഖ്യ 13:16 കാണുക).
    reason: മൂലപാഠത്തിലെ പേരുരൂപം കൂടുതൽ പരിചിതമായ ‘യോശുവ’ എന്ന പേരിൽനിന്ന് വ്യത്യസ്തമാണെന്ന് വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: വന്ന്
  rationale: בוא എന്ന ക്രിയയുടെ ആഖ്യാനരൂപം ഇവിടെ വരുക/എത്തുക എന്ന സാധാരണ അർഥം നൽകുന്നു. സന്ദർഭത്തിൽ അനാവശ്യമായ ദിശാസൂചന ചേർക്കാതെ ‘വന്ന്’ സ്വാഭാവികമായി ആഖ്യാനത്തിന്റെ നീക്കം നിലനിർത്തുന്നു.
- source_word: וַיְדַבֵּר
  choice: സംസാരിച്ചു
  rationale: പീയേൽ രൂപത്തിലുള്ള דבר എന്നതിന് ഇവിടെ പൊതുവായ അർഥം ‘സംസാരിക്കുക’ എന്നതാണ്. ‘പ്രഖ്യാപിച്ചു’ പോലുള്ള അധിക വാഗ്മിത്വബലം ചേർക്കാതെ നേരിട്ടുള്ള പ്രവർത്തനം ഇത് പ്രകടിപ്പിക്കുന്നു.
- source_word: אֶת כָּל דִּבְרֵי
  choice: വാക്കുകളെല്ലാം
  rationale: ‘എല്ലാ വാക്കുകളും’ എന്ന സമഗ്രത നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായ സംയുക്തപ്രയോഗം നൽകുകയും ചെയ്യുന്നു.
- source_word: הַשִּׁירָה הַזֹּאת
  choice: ഈ പാട്ടിലെ
  rationale: שירה ഇവിടെ മോശയുടെ പാട്ടിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പാട്ട്’ യോജിക്കുന്നു; ‘കവിത’ എന്നതിനെക്കാൾ സമീപസന്ദർഭത്തിലെ പേരിടലുമായി ഇത് കൂടുതൽ പൊരുത്തപ്പെടുന്നു.
- source_word: בְּאָזְנֵי הָעָם
  choice: ജനങ്ങൾ കേൾക്കെ
  rationale: അക്ഷരാർഥമായ ‘ജനങ്ങളുടെ ചെവികളിൽ’ എന്ന എബ്രായ ഭാഷാശൈലിയുടെ പൊതുവായ വാചികവും പരസ്യവുമായ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הָעָם
  choice: ജനങ്ങൾ
  rationale: עם ഇവിടെ ഒരുമിച്ചുകൂടിയ ഉടമ്പടിസമൂഹത്തെ പൊതുവായി സൂചിപ്പിക്കുന്നു; ‘ജനങ്ങൾ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: הוּא
  choice: അവനും
  rationale: സ്വതന്ത്ര സർവനാമമായ הוּא വാക്യാവസാനത്തിലെ അനുബന്ധ ഊന്നൽ നിലനിർത്തുന്നു. അതിനെ ഒഴിവാക്കാതെ ‘അവനും’ എന്ന് പരിഭാഷപ്പെടുത്തി.
- source_word: וְהוֹשֵׁעַ
  choice: ഹോശേയയും
  rationale: മൂലപാഠത്തിൽ ഇവിടെ യോശുവ എന്നല്ല, הוֹשֵׁעַ എന്ന പേരാണ്. അതിനാൽ പേരിനെ സമന്വയിപ്പിക്കാതെ ‘ഹോശേയ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
- source_word: בִּן נוּן
  choice: നൂന്റെ മകനായ
  rationale: സാധാരണ പിതൃനാമഘടന മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: മോശയുടെ കൂട്ടാളിയുടെ പേര് ‘ഹോശേയ’ എന്നോ കൂടുതൽ പരിചിതമായ ‘യോശുവ’ എന്നോ നൽകുക
  choice: ഹോശേയ
  alternative: യോശുവ
  rationale: ഈ വാക്യത്തിലെ എബ്രായ പാഠം വ്യക്തമായി הוֹשֵׁעַ എന്നാണ് വായിക്കുന്നത്. അതിനാൽ കൂടുതൽ പരിചിതമായ പിന്നീടുള്ള പേരിലേക്കു സമന്വയിപ്പിക്കാതെ മൂലപാഠത്തിലെ രൂപം നിലനിർത്തി; വായനക്കാരന്റെ വ്യക്തതയ്ക്കായി അടിക്കുറിപ്പിൽ ബന്ധം അറിയിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘ജനങ്ങൾ കേൾക്കെ’ എന്ന പ്രയോഗം എബ്രായ ഭാഷാശൈലിയുടെ പൊതുവായ വാചികസ്വഭാവം നിലനിർത്തുന്നു. വാക്യാവസാനത്തിലെ ‘അവനും ... ഹോശേയയും’ എന്ന ഘടന മൂലത്തിലെ അല്പം അസാധാരണമായ അനുബന്ധവിഷയഘടനയും അതിലെ ഊന്നലും മിനുക്കിനീക്കാതെ സൂക്ഷിക്കുന്നു.
