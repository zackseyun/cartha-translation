  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ שִׂ֣ימוּ לְבַבְ/כֶ֔ם לְ/כָל הַ/דְּבָרִ֔ים אֲשֶׁ֧ר אָנֹכִ֛י מֵעִ֥יד בָּ/כֶ֖ם הַ/יּ֑וֹם אֲשֶׁ֤ר תְּצַוֻּ/ם֙ אֶת בְּנֵי/כֶ֔ם לִ/שְׁמֹ֣ר לַ/עֲשׂ֔וֹת אֶת כָּל דִּבְרֵ֖י הַ/תּוֹרָ֥ה הַ/זֹּֽאת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/046.yaml
  text: And he said to them[a], “Set your heart on all the words that I am testifying to you today, which you shall command your sons to keep[b], to do all the words of this law.”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “ഇന്നു ഞാൻ നിങ്ങളോടു സാക്ഷ്യപ്പെടുത്തുന്ന സകല വചനങ്ങളും ഹൃദയത്തിൽ ഉറപ്പിക്കുവിൻ.[a] ഈ ന്യായപ്രമാണത്തിലെ സകല വചനങ്ങളും പാലിക്കാനും അനുഷ്ഠിക്കാനും നിങ്ങൾ നിങ്ങളുടെ പുത്രന്മാരോടു കല്പിക്കണം.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇന്നു ഞാൻ നിങ്ങൾക്കു മുന്നറിയിപ്പു നൽകുന്ന” എന്നും “ഇന്നു ഞാൻ നിങ്ങൾക്കെതിരായി സാക്ഷ്യമായി വിളിച്ചുപറയുന്ന” എന്നും പരിഭാഷപ്പെടുത്താം. ഉടമ്പടിസന്ദർഭങ്ങളിൽ എബ്രായ ക്രിയയ്ക്ക് സാക്ഷ്യം, മുന്നറിയിപ്പ്, ന്യായവ്യവഹാരപരമായ ഭാവം എന്നിവ ഉണ്ടാകാം.
    reason: alternative_reading
  - marker: b
    text: എബ്രായത്തിൽ “നിങ്ങളുടെ പുത്രന്മാർ”; ഇത് അടുത്ത തലമുറയെ കൂടുതൽ വിശാലമായി പ്രതിനിധീകരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂימוּ לְבַבְכֶם
  choice: ഹൃദയത്തിൽ ഉറപ്പിക്കുവിൻ
  rationale: ഹൃദയത്തിൽ വെക്കുക എന്ന എബ്രായ ദൃശ്യഭാവം നിലനിർത്തിക്കൊണ്ട് ശ്രദ്ധ, മനസ്സുറപ്പ്, പ്രതിബദ്ധത എന്നിവ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: הַדְּבָרִים / דִּבְרֵי
  choice: വചനങ്ങൾ
  rationale: ഇവിടെ דָּבָר ഉടമ്പടിസംബന്ധമായ ഉച്ചരിക്കപ്പെട്ട വാക്കുകളെയും നിർദേശങ്ങളെയും സൂചിപ്പിക്കുന്നു; ആവർത്തനവും നിലനിർത്തുന്നു.
- source_word: מֵעִיד בָּכֶם הַיּוֹם
  choice: ഇന്നു ഞാൻ നിങ്ങളുടെ മുമ്പാകെ സാക്ഷ്യപ്പെടുത്തുന്ന
  rationale: עוּד എന്ന ക്രിയയുടെ ഔപചാരിക സാക്ഷ്യാർഥം നിലനിർത്തുന്നു. בָּכֶם എന്നതിനെ പൊതുസമൂഹത്തിന്റെ മുമ്പാകെയുള്ള സാക്ഷ്യമായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; മുന്നറിയിപ്പ്/ന്യായവ്യവഹാരപരമായ ശക്തി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: אֲשֶׁר תְּצַוֻּם
  choice: നിങ്ങൾ ... കല്പിക്കണം
  rationale: ബന്ധവാചകവും അപൂർണ്ണക്രിയയും ഇവിടെ മുന്നോട്ടു കൈമാറേണ്ട ഉത്തരവാദിത്വം പ്രകടിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ കല്പനാത്മക ഭാവം ഉപയോഗിച്ചു.
- source_word: בְּנֵיכֶם
  choice: നിങ്ങളുടെ പുത്രന്മാർ
  rationale: എബ്രായത്തിലെ വ്യക്തമായ പുല്ലിംഗ ബഹുവചനം പ്രധാനപാഠത്തിൽ നിലനിർത്തുന്നു; അടുത്ത തലമുറയെ വിശാലമായി പ്രതിനിധീകരിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: ശ്രദ്ധയോടെ അനുസരിക്കാനും പ്രാവർത്തികമാക്കാനും
  rationale: ശ്രദ്ധാപൂർവമായ പാലനവും യഥാർഥ നിർവഹണവും എന്ന ഇരട്ട ഊന്നൽ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: ഈ ന്യായപ്രമാണം
  rationale: תּוֹרָהയ്ക്ക് ഉപദേശം എന്ന വിശാല അർഥമുണ്ടെങ്കിലും ആവർത്തനപുസ്തകത്തിലെ ഉടമ്പടിപരമായ സന്ദർഭത്തിൽ ‘ന്യായപ്രമാണം’ വ്യക്തവും സ്ഥാപിതവുമായ പ്രയോഗമാണ്.
theological_decisions:
- issue: מֵעִיד בָּכֶם എന്നതിലെ സാക്ഷ്യ/മുന്നറിയിപ്പ്/ന്യായവ്യവഹാര ഭാവങ്ങൾ
  choice: നിങ്ങളുടെ മുമ്പാകെ സാക്ഷ്യപ്പെടുത്തുന്ന
  alternative: നിങ്ങൾക്കു മുന്നറിയിപ്പു നൽകുന്ന; നിങ്ങൾക്കെതിരായി സാക്ഷ്യം വിളിച്ചുപറയുന്ന
  rationale: പ്രധാനപാഠം സാക്ഷ്യത്തിന്റെ ഔപചാരിക ഭാവം നിലനിർത്തുന്നു; എന്നാൽ ഉടമ്പടിസന്ദർഭത്തിലെ മുന്നറിയിപ്പും ന്യായവ്യവഹാരപരമായ ശക്തിയും അടിക്കുറിപ്പിലൂടെ നഷ്ടപ്പെടാതെ സൂക്ഷിക്കുന്നു.
- issue: בְּנֵיכֶם എന്നതിലെ ലിംഗസൂചന
  choice: നിങ്ങളുടെ പുത്രന്മാർ
  alternative: നിങ്ങളുടെ മക്കൾ
  rationale: മൂലപദത്തിലെ പുല്ലിംഗ ബഹുവചനം പ്രധാനപാഠത്തിൽ സംരക്ഷിക്കുന്നു; അത് അടുത്ത തലമുറയെ പൊതുവായി പ്രതിനിധീകരിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്നതുമായ ശൈലി. ‘ഹൃദയത്തിൽ ഉറപ്പിക്കുവിൻ’ എന്നത് എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യഭാവം നിലനിർത്തുന്നു; ‘ശ്രദ്ധയോടെ അനുസരിക്കാനും പ്രാവർത്തികമാക്കാനും’ എന്നത് ഇരട്ട ക്രിയാഭാവം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
