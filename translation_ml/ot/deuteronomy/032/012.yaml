source:
  edition: WLC
  text: יְהוָ֖ה בָּדָ֣ד יַנְחֶ֑/נּוּ וְ/אֵ֥ין עִמּ֖/וֹ אֵ֥ל נֵכָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/012.yaml
  text: Yahweh alone led him[a], and no foreign god was with him.
translation:
  language: ml
  text: യഹ്‌വെ മാത്രം അവനെ നയിച്ചു[a]; ഒരു അന്യദേവനും അവനോടുകൂടെ ഉണ്ടായിരുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വഴിനടത്തി.’ എബ്രായ ക്രിയയ്ക്ക് നയിക്കുക, വഴിനടത്തുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ, മലയാളത്തിൽ സ്വാഭാവികമായ ലിപ്യന്തരണമായി നിലനിർത്തുന്നു.
- source_word: בָּדָד
  choice: മാത്രം
  rationale: ഇവിടെ യഹ്‌വെ മറ്റാരുടെയും സഹായമോ പങ്കാളിത്തമോ ഇല്ലാതെ പ്രവർത്തിച്ചു എന്ന ക്രിയാവിശേഷണാർഥം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: יַנְחֶנּוּ
  choice: അവനെ നയിച്ചു
  rationale: נחה എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഈ സന്ദർഭത്തിൽ നയിക്കുക/വഴിനടത്തുക എന്നാണ്. ഏകവചന പുൽലിംഗ പ്രത്യയം ചുറ്റുപാടിൽ ഏകവചനമായി വ്യക്തിവൽക്കരിക്കപ്പെട്ട യിസ്രായേൽ/യാക്കോബിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അവനെ’ നിലനിർത്തുന്നു.
- source_word: וְאֵין
  choice: ഉണ്ടായിരുന്നില്ല
  rationale: അസ്തിത്വനിഷേധം മലയാളത്തിലെ സ്വാഭാവിക ഭൂതകാല വാക്യഘടനയിൽ പ്രകടമാക്കുന്നു.
- source_word: עִמּוֹ
  choice: അവനോടുകൂടെ
  rationale: עִם എന്ന പദവും ഏകവചന പുൽലിംഗ പ്രത്യയവും സഹവർത്തിത്വം സൂചിപ്പിക്കുന്നു; അതിനാൽ ‘അവനോടുകൂടെ’ എന്ന രൂപം യോജിക്കുന്നു.
- source_word: אֵל נֵכָר
  choice: അന്യദേവൻ
  rationale: യിസ്രായേലിന്റെ ദൈവമല്ലാത്ത, അന്യമായ ദേവനെ സൂചിപ്പിക്കുന്ന പ്രയോഗത്തിന്റെ വിഗ്രഹാരാധനാവിരുദ്ധ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘അവനെ നയിച്ചു’ / ‘അവനോടുകൂടെ’ എന്നതിലെ ഏകവചന സർവനാമത്തിന്റെ സൂചിതൻ
  choice: എബ്രായത്തിലെ ഏകവചന പുൽലിംഗ രൂപം നിലനിർത്തി ‘അവനെ/അവനോടുകൂടെ’ എന്ന് പരിഭാഷപ്പെടുത്തി; സമീപസന്ദർഭത്തിൽ ഇത് സമൂഹരൂപത്തിലുള്ള യിസ്രായേൽ/യാക്കോബിനെ സൂചിപ്പിക്കുന്നു.
  alternative: ജനതയെ സമൂഹമായി വ്യക്തമാക്കാൻ ‘അവരെ/അവരോടുകൂടെ’ എന്ന് നൽകുക.
  rationale: മൂലപാഠം യിസ്രായേൽ/യാക്കോബിനെ ഏകവചന വ്യക്തിയായി അവതരിപ്പിക്കുന്നതിനാൽ, അതിലെ വ്യാകരണരൂപവും കാവ്യാത്മക വ്യക്തിവൽക്കരണവും ബഹുവചനമാക്കി സമതലപ്പെടുത്താതെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. കാവ്യവാക്യത്തിന്റെ സമാന്തരഘടനയും യഹ്‌വെയുടെ ഏക പ്രവർത്തകത്വവും വ്യക്തമായി സൂക്ഷിച്ചിരിക്കുന്നു.
