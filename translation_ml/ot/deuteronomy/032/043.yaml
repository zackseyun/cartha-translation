id: DEU.32.43
reference: Deuteronomy 32:43
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הַרְנִ֤ינוּ גוֹיִם֙ עַמּ֔/וֹ כִּ֥י דַם עֲבָדָ֖י/ו יִקּ֑וֹם וְ/נָקָם֙ יָשִׁ֣יב לְ/צָרָ֔י/ו וְ/כִפֶּ֥ר אַדְמָת֖/וֹ עַמּֽ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/043.yaml
  text: Rejoice[a], O nations, with his people, for he will avenge the blood of his servants; he will repay vengeance on his adversaries[d][c][b], and he will make atonement for his land and his people.
translation:
  language: ml
  text: ജനതകളേ, അവിടുത്തെ ജനത്തോടൊപ്പം ആനന്ദഘോഷം മുഴക്കുവിൻ[a]; അവിടുന്ന് തന്റെ ദാസന്മാരുടെ രക്തത്തിന് പ്രതികാരം ചെയ്യും; തന്റെ എതിരാളികൾക്ക് പ്രതികാരം തിരിച്ചുനൽകും; തന്റെ ദേശത്തിനും തന്റെ ജനത്തിനും പ്രായശ്ചിത്തം നിർവഹിക്കും[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘ആനന്ദത്തോടെ പാടുവിൻ’ അല്ലെങ്കിൽ ‘ആനന്ദത്തോടെ ആർപ്പിടുവിൻ.’ എബ്രായ ആജ്ഞാരൂപത്തിന് ഉല്ലാസപൂർവമായ ഘോഷമോ ഗാനമോ എന്ന അർഥമുണ്ടാകാം.'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: ‘തന്റെ ദേശത്തെയും തന്റെ ജനത്തെയും ശുദ്ധീകരിക്കും’ അല്ലെങ്കിൽ ‘അവരെ മലിനതയിൽനിന്ന് ശുദ്ധീകരിക്കും.’ എബ്രായ ക്രിയയ്ക്ക് പ്രായശ്ചിത്തത്തിന്റെയും ശുദ്ധീകരണത്തിന്റെയും ഭാവങ്ങളുണ്ട്.'
    reason: lexical_alternative
  - marker: c
    text: ഗ്രീക്ക് സെപ്റ്റുവജിന്റും ഒരു ചാവുകടൽ ചുരുളും ഈ വാക്യത്തിന്റെ ദീർഘരൂപം സംരക്ഷിക്കുന്നു. അതിൽ ആകാശവും ദിവ്യജീവികളും ആനന്ദിക്കണമെന്നതും ജനതകൾ അവനെ നമസ്കരിക്കണമെന്നതും ഉൾപ്പെടെയുള്ള അധിക ആഹ്വാനങ്ങളുണ്ട്. മുഖ്യപാഠം ഇവിടെ മസോറെറ്റിക് എബ്രായത്തെ പിന്തുടരുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: הַרְנִינוּ
  choice: ആനന്ദഘോഷം മുഴക്കുവിൻ
  rationale: רנן എന്ന ക്രിയയുടെ ബഹുവചന ആജ്ഞാരൂപം ആഹ്ലാദപൂർവമായ ഘോഷമോ ഗാനമോ സൂചിപ്പിക്കുന്നു. ‘ആനന്ദഘോഷം മുഴക്കുക’ അതിന്റെ ശ്രാവ്യവും ഉല്ലാസപൂർണവുമായ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: גוֹיִם
  choice: ജനതകളേ
  rationale: ഇവിടെ ഇസ്രായേലിനു പുറത്തുള്ള ജനസമൂഹങ്ങളെ കൂട്ടമായി അഭിസംബോധന ചെയ്യുന്നു. ‘വിജാതീയർ’ എന്നത് അനാവശ്യമായ പിൽക്കാല മതപരമായ നിറം നൽകാം; ‘ജനതകൾ’ കൂടുതൽ നിഷ്പക്ഷമാണ്.
- source_word: עַמּוֹ
  choice: അവിടുത്തെ ജനത്തോടൊപ്പം
  rationale: മസോറെറ്റിക് പാഠത്തിലെ ഘടന സംക്ഷിപ്തമാണ്. ജനതകൾ ദൈവജനത്തോടൊപ്പം ആനന്ദിക്കണമെന്ന ഏറ്റവും സാദ്ധ്യമായ ബന്ധം വ്യക്തമാക്കാൻ ‘ഒപ്പം’ ചേർത്തിരിക്കുന്നു.
- source_word: דַם עֲבָדָיו
  choice: തന്റെ ദാസന്മാരുടെ രക്തം
  rationale: עבד എന്നതിന് ദാസൻ എന്നും അടിമ എന്നും അർഥമാകാം. ഇവിടെ ദൈവത്തോടുള്ള ബന്ധവും അന്യായമായി ചൊരിയപ്പെട്ട രക്തവുമാണ് പ്രധാനം; അതിനാൽ ‘ദാസന്മാർ’ അനുയോജ്യം.
- source_word: יִקּוֹם
  choice: പ്രതികാരം ചെയ്യും
  rationale: ചൊരിയപ്പെട്ട രക്തത്തിനുവേണ്ടി നീതി നടപ്പാക്കുന്ന അർഥത്തിലുള്ള נקם ആണ്; ‘പ്രതികാരം ചെയ്യും’ മലയാളത്തിൽ നേരിട്ടും സ്വാഭാവികവുമാണ്.
- source_word: וְנָקָם יָשִׁיב לְצָרָיו
  choice: തന്റെ എതിരാളികൾക്ക് പ്രതികാരം തിരികെ നൽകും
  rationale: ישׁיב എന്ന ‘തിരികെ നൽകുക’ എന്ന ക്രിയാബലം നിലനിർത്തിക്കൊണ്ട് נקם എന്ന പ്രതികാരാത്മക നീതിയുടെ ആശയവും പ്രകടമാക്കുന്നു; എതിരാളികളെ നേരിട്ടുള്ള കർമമായി മാറ്റുന്നില്ല.
- source_word: וְכִפֶּר
  choice: പ്രായശ്ചിത്തം വരുത്തും
  rationale: כפר എന്ന പദത്തിന്റെ പ്രായശ്ചിത്തപരവും ശുദ്ധീകരണപരവുമായ വ്യാപ്തിയിൽ, മുഖ്യപാഠം അതിന്റെ ദൈവശാസ്ത്രപരമായ ഭാരം നിലനിർത്തുന്നു. ശുദ്ധീകരണം എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: אַדְמָתוֹ עַמּוֹ
  choice: തന്റെ ദേശത്തിനും തന്റെ ജനത്തിനും
  rationale: അവസാനത്തെ രണ്ടു നാമങ്ങളെയും സമാന്തരമായി നിലനിർത്തുന്നു. אדמה ഇവിടെ ദേശീയ-ഉടമ്പടി പശ്ചാത്തലത്തിൽ ‘ദേശം’ എന്നാണ് സ്വാഭാവികം.
theological_decisions:
- issue: ആരംഭവാക്യത്തിൽ ജനതകളും ദൈവജനവും തമ്മിലുള്ള ബന്ധം
  choice: ജനതകൾ ദൈവജനത്തോടൊപ്പം ആനന്ദഘോഷം മുഴക്കാൻ വിളിക്കപ്പെടുന്നു.
  alternative: ജനതകൾ ദൈവജനത്തെ പുകഴ്ത്താൻ വിളിക്കപ്പെടുന്നു; അല്ലെങ്കിൽ ദീർഘമായ ഗ്രീക്ക്/ചാവുകടൽ ചുരുൾ പാഠം പിന്തുടരാം.
  rationale: മസോറെറ്റിക് എബ്രായം അത്യന്തം സംക്ഷിപ്തമാണ്. ‘ഒപ്പം’ എന്നത് സാദ്ധ്യമായ വാക്യബന്ധം വ്യക്തമാക്കുന്നു; ദീർഘപാഠത്തിലെ അധിക ഉള്ളടക്കം മുഖ്യപാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: അവസാനവാക്യത്തിലെ כפר എന്ന ക്രിയയുടെ അർഥം
  choice: ദൈവം തന്റെ ദേശത്തിനും ജനത്തിനും പ്രായശ്ചിത്തം വരുത്തുന്നു.
  alternative: ദൈവം തന്റെ ദേശത്തെയും ജനത്തെയും ശുദ്ധീകരിക്കുന്നു/മലിനത നീക്കുന്നു.
  rationale: പ്രായശ്ചിത്തവും ശുദ്ധീകരണവും എന്ന രണ്ടു ഭാവങ്ങളും ഇവിടെ സാദ്ധ്യമാണ്. മുഖ്യപാഠത്തിൽ പ്രായശ്ചിത്തപരമായ ഭാരം നിലനിർത്തുകയും മറ്റേ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കാവ്യാത്മക ശൈലി. ദൈവത്തെ സൂചിപ്പിക്കാൻ ആദരസൂചകമായ ‘അവിടുന്ന്/അവിടുത്തെ’ ഉപയോഗിച്ചു. വാക്യത്തിന്റെ പ്രതികാരവും പ്രായശ്ചിത്തവും സംബന്ധിച്ച ദൈവശാസ്ത്രപരമായ സംഘർഷം മൃദൂകരിക്കാതെ നിലനിർത്തി.
