revisions:
- from: ജനതകളേ, അവിടുത്തെ ജനത്തോടൊപ്പം ആനന്ദഘോഷം മുഴക്കുവിൻ[a]; അവിടുന്ന് തന്റെ ദാസന്മാരുടെ രക്തത്തിന് പ്രതികാരം ചെയ്യും; തന്റെ എതിരാളികൾക്ക് പ്രതികാരം തിരികെ നൽകും; തന്റെ ദേശത്തിനും തന്റെ ജനത്തിനും പ്രായശ്ചിത്തം വരുത്തും[b][c].
  to: ജനതകളേ, അവിടുത്തെ ജനത്തോടൊപ്പം ആനന്ദഘോഷം മുഴക്കുവിൻ[a]; അവിടുന്ന് തന്റെ ദാസന്മാരുടെ രക്തത്തിന് പ്രതികാരം ചെയ്യും; തന്റെ എതിരാളികൾക്ക് പ്രതികാരം തിരിച്ചുനൽകും; തന്റെ ദേശത്തിനും തന്റെ ജനത്തിനും പ്രായശ്ചിത്തം നിർവഹിക്കും[b][c].
  rationale: The revision makes only safe idiomatic improvements. It replaces the potentially causative-sounding ‘പ്രായശ്ചിത്തം വരുത്തും’ with ‘പ്രായശ്ചിത്തം നിർവഹിക്കും,’ retaining the source’s expiatory force, and clarifies the cleansing alternative in the corresponding footnote. All other wording and the MT-based handling of the opening ambiguity are retained.
