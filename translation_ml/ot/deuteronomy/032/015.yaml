source:
  edition: WLC
  text: וַ/יִּשְׁמַ֤ן יְשֻׁרוּן֙ וַ/יִּבְעָ֔ט שָׁמַ֖נְתָּ עָבִ֣יתָ כָּשִׂ֑יתָ וַ/יִּטֹּשׁ֙ אֱל֣וֹהַ עָשָׂ֔/הוּ וַ/יְנַבֵּ֖ל צ֥וּר יְשֻׁעָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/015.yaml
  text: But Jeshurun grew fat and kicked; you grew fat[a], thick, and sleek. Then he forsook God who made him and treated with contempt the Rock of his salvation.
translation:
  language: ml
  text: എന്നാൽ യെശുരൂൻ തടിച്ചുകൊഴുത്ത് തൊഴിച്ചു; നീ തടിച്ചുകൊഴുത്തു, തടിച്ചുരുണ്ടു, കൊഴുപ്പു മൂടിയവനായി[a]. പിന്നെ അവൻ അവനെ സൃഷ്ടിച്ച ദൈവത്തെ ഉപേക്ഷിക്കുകയും തന്റെ രക്ഷയുടെ പാറയെ നിന്ദിക്കുകയും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നീ മിനുസമുള്ളവനായി’ അല്ലെങ്കിൽ ‘നീ വീർത്തു.’ എബ്രായപദം അപൂർവമായതിനാൽ അതിന്റെ കൃത്യമായ സൂക്ഷ്മാർഥം അനിശ്ചിതമാണ്; എങ്കിലും അമിതമായി തീറ്റകിട്ടി കൊഴുത്ത അവസ്ഥയാണ് ഉദ്ദേശ്യമെന്നത് വ്യക്തമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשֻׁרוּן
  choice: യെശുരൂൻ
  rationale: ഇസ്രായേലിനെ സൂചിപ്പിക്കുന്ന കാവ്യാത്മകമായ പേരോ വിശേഷണനാമമോ ആയതിനാൽ അർത്ഥം മുൻകൂട്ടി ചുരുക്കാതെ ലിപ്യന്തരിച്ചു.
- source_word: וַיִּשְׁמַן
  choice: തടിച്ചുകൊഴുത്ത്
  rationale: സമൃദ്ധിമൂലമുള്ള ആത്മതൃപ്തിയെ സൂചിപ്പിക്കുന്നുണ്ടെങ്കിലും, മൂലപാഠത്തിലെ ശരീരരൂപകം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וַיִּבְעָט
  choice: തൊഴിച്ചു
  rationale: നന്നായി തീറ്റകിട്ടിയ മൃഗം അനുസരണക്കേടോടെ തൊഴിക്കുന്ന ദൃശ്യരൂപം നിലനിർത്തുന്നു; ‘മത്സരിച്ചു’ എന്ന വിശദീകരണത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: שָׁמַנְתָּ
  choice: നീ തടിച്ചുകൊഴുത്തു
  rationale: മൂന്നാം പുരുഷനിൽനിന്ന് രണ്ടാം പുരുഷനിലേക്കുള്ള കാവ്യാത്മക അഭിസംബോധന കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: עָבִיתָ
  choice: തടിച്ചുരുണ്ടു
  rationale: അമിതമായി പോഷിക്കപ്പെട്ട് സ്ഥൂലനായെന്ന ഭൗതികചിത്രം സ്വാഭാവികമായ മലയാളത്തിൽ ശക്തിപ്പെടുത്തുന്നു.
- source_word: כָּשִׂיתָ
  choice: കൊഴുപ്പുമൂടി
  rationale: അപൂർവമായ ഈ പദത്തിന്റെ കൃത്യമായ സൂക്ഷ്മാർഥം അനിശ്ചിതമാണ്; അമിതകൊഴുപ്പിന്റെ ചിത്രം നിലനിർത്തുന്ന സാധ്യതയുള്ള വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു, മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകി.
- source_word: וַיִּטֹּשׁ
  choice: ഉപേക്ഷിക്കുകയും ചെയ്തു
  rationale: ബന്ധപരവും ഉടമ്പടിപരവുമായ വിശ്വാസവഞ്ചന വ്യക്തമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: אֱלוֹהַ עָשָׂהוּ
  choice: തന്നെ സൃഷ്ടിച്ച ദൈവത്തെ
  rationale: ദൈവം ഇസ്രായേലിന്റെ സ്രഷ്ടാവാണെന്ന ബന്ധം സ്വാഭാവികമായ മലയാള വാക്യഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: וַיְנַבֵּל
  choice: നിന്ദിക്കുകയും ചെയ്തു
  rationale: അവജ്ഞയോടെ അപമാനിക്കുക എന്ന സജീവമായ അർത്ഥം സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: צוּר
  choice: പാറയെ
  rationale: ആവർത്തിച്ചു വരുന്ന ദൈവിക രൂപകം വിവർത്തനം ചെയ്ത് നിലനിർത്തുന്നു; മലയാളത്തിൽ വലിയക്ഷരവ്യത്യാസമില്ലാത്തതിനാൽ സന്ദർഭം അതിന്റെ വിശേഷണനാമസ്വഭാവം വ്യക്തമാക്കുന്നു.
- source_word: יְשׁוּעָתוֹ
  choice: തന്റെ രക്ഷയുടെ
  rationale: ദൈവം നൽകുന്ന വിടുതലിന്റെയും രക്ഷയുടെയും ദൈവശാസ്ത്രപരമായ ഭാരം നിലനിർത്തുന്നു.
theological_decisions:
- issue: മൂന്നാം പുരുഷ വിവരണത്തിൽനിന്ന് രണ്ടാം പുരുഷ അഭിസംബോധനയിലേക്കും വീണ്ടും മൂന്നാം പുരുഷനിലേക്കുമുള്ള മാറ്റം
  choice: ‘യെശുരൂൻ ... തൊഴിച്ചു; നീ ...; പിന്നെ അവൻ ...’ എന്ന വ്യക്തിമാറ്റം നിലനിർത്തി.
  alternative: എല്ലാ ഘടകങ്ങളും മൂന്നാം പുരുഷനാക്കി ഏകീകരിക്കുക.
  rationale: ഈ വ്യക്തിമാറ്റം വിവരണത്തിൽനിന്ന് നേരിട്ടുള്ള കുറ്റാരോപണത്തിലേക്കും പിന്നെ വീണ്ടും വിവരണത്തിലേക്കും നീങ്ങുന്ന എബ്രായ കവിതയുടെ വാഗ്‌ശക്തി വഹിക്കുന്നു.
- issue: צוּר എന്ന ദൈവിക രൂപകം
  choice: ‘തന്റെ രക്ഷയുടെ പാറ’
  alternative: ‘തന്റെ രക്ഷകനായ ദൈവം’ എന്ന വ്യാഖ്യാനാത്മക രൂപം
  rationale: ആവർത്തിച്ചു വരുന്ന ‘പാറ’ എന്ന ദൈവിക രൂപകം വിശദീകരിച്ച് ഇല്ലാതാക്കാതെ അതേപടി സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള കാവ്യഭാവം നിലനിർത്തി. ‘തൊഴിച്ചു,’ ‘പാറ’ എന്നീ മൂർത്തരൂപകങ്ങൾ വ്യാഖ്യാനിച്ച് മൃദൂകരിക്കാതെ സംരക്ഷിച്ചു; യെശുരൂൻ എന്ന പേര് ലിപ്യന്തരിച്ചു.
