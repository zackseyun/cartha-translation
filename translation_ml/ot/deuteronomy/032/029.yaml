id: DEU.32.29
reference: Deuteronomy 32:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: ל֥וּ חָכְמ֖וּ יַשְׂכִּ֣ילוּ זֹ֑את יָבִ֖ינוּ לְ/אַחֲרִיתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/029.yaml
  text: If only they were wise[a], they would understand this; they would discern their end.
translation:
  language: ml
  text: അവർ ജ്ഞാനികളായിരുന്നെങ്കിൽ! അവർ ഇതു ഗ്രഹിക്കുകയും തങ്ങളുടെ അന്ത്യം[a] തിരിച്ചറിയുകയും ചെയ്യുമായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “തങ്ങളുടെ ഭാവി” എന്നും “ഒടുവിൽ തങ്ങൾക്ക് സംഭവിക്കാനുള്ളത്” എന്നും. എബ്രായപദം ഒരാളുടെ അന്തിമഫലത്തെയോ പിന്നീട് സംഭവിക്കുന്നതിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ל֥וּ
  choice: ആയിരുന്നെങ്കിൽ!
  rationale: ലളിതമായ ഒരു വ്യവസ്ഥയേക്കാൾ ആഗ്രഹവും വിലാപവും സൂചിപ്പിക്കുന്ന ആശംസാർഥക ഭാവം ആശ്ചര്യചിഹ്നത്തോടുകൂടിയ ഈ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: חָכְמ֖וּ
  choice: അവർ ജ്ഞാനികളായിരുന്നെങ്കിൽ
  rationale: חכם ഇവിടെ ജ്ഞാനം ഉണ്ടായിരിക്കുക അല്ലെങ്കിൽ ജ്ഞാനത്തോടെ പെരുമാറുക എന്ന ആശയം നൽകുന്നു; ആശംസാർഥക ל֥וּ-വിനോടൊപ്പം ഈ രൂപം സ്വാഭാവികമാണ്.
- source_word: יַשְׂכִּ֣ילוּ
  choice: അവർ ഇതു ഗ്രഹിക്കുകയും
  rationale: שׂכל എന്ന ധാതുവിന്റെ ഹിഫിൽ രൂപത്തിന് ഉൾക്കാഴ്ച നേടുക, വിവേകത്തോടെ പ്രവർത്തിക്കുക എന്നീ അർഥങ്ങളുണ്ടാകാം; സമാന്തരമായ അടുത്ത ക്രിയയോടൊപ്പം ഇവിടെ ബൗദ്ധികമായ ‘ഗ്രഹിക്കുക’ യോജിക്കുന്നു.
- source_word: זֹ֑את
  choice: ഇതു
  rationale: എബ്രായത്തിലെ ഏകവചന സൂചകസർവനാമം നിലനിർത്തുകയും തൊട്ടുമുമ്പുള്ള യാഥാർഥ്യത്തിലേക്കോ പാഠത്തിലേക്കോ വിരൽചൂണ്ടുകയും ചെയ്യുന്നു.
- source_word: יָבִ֖ינוּ
  choice: തിരിച്ചറിയുകയും
  rationale: בין എന്ന ധാതുവിന്റെ സൂക്ഷ്മമായി മനസ്സിലാക്കുക, വിവേചിച്ചറിയുക എന്ന ഭാവം നൽകുന്നു; മുൻക്രിയയായ ‘ഗ്രഹിക്കുക’ എന്നതിൽനിന്ന് പദവൈവിധ്യം നിലനിർത്തുന്നു.
- source_word: לְאַחֲרִיתָם
  choice: തങ്ങളുടെ അന്ത്യം
  rationale: אַחֲרִית ഇവിടെ ഒടുവിലെ ഫലം, അന്ത്യം, അല്ലെങ്കിൽ വരാനിരിക്കുന്ന അവസ്ഥ എന്നിവ സൂചിപ്പിക്കാം; ‘തങ്ങളുടെ അന്ത്യം’ സന്ദർഭത്തിലെ മുന്നറിയിപ്പിന്റെ ശക്തി സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: אַחֲרִיתָם എന്നതിന്റെ സന്ദർഭാർഥം
  choice: തങ്ങളുടെ അന്ത്യം
  alternative: തങ്ങളുടെ ഭാവി / ഒടുവിൽ തങ്ങൾക്ക് സംഭവിക്കാനുള്ളത്
  rationale: ഈ ഗീതത്തിലെ ന്യായവിധിസംബന്ധമായ മുന്നറിയിപ്പും അന്തിമഫലവും ‘അന്ത്യം’ നിലനിർത്തുന്നു; എന്നാൽ പദം മരണം മാത്രം നിർബന്ധമായി സൂചിപ്പിക്കുന്നില്ലെന്നതിനാൽ മറ്റർഥസാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ കാവ്യഭാഷ ഉപയോഗിച്ചു. ആദ്യവാക്യത്തിലെ ആശ്ചര്യചിഹ്നം ל֥וּ നൽകുന്ന ആശംസയും വിലാപവും പ്രകടമാക്കുന്നു; തുടർന്നുള്ള രണ്ടു ക്രിയകൾ എബ്രായ കവിതയിലെ സമാന്തരത നിലനിർത്തുന്നു.
