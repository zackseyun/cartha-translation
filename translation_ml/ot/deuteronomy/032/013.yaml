id: DEU.32.13
reference: Deuteronomy 32:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: יַרְכִּבֵ֨/הוּ֙ עַל במותי אָ֔רֶץ וַ/יֹּאכַ֖ל תְּנוּבֹ֣ת שָׂדָ֑י וַ/יֵּנִקֵ֤/הֽוּ דְבַשׁ֙ מִ/סֶּ֔לַע וְ/שֶׁ֖מֶן מֵ/חַלְמִ֥ישׁ צֽוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/013.yaml
  text: He made him ride on the heights of the land[a], and he ate the produce of the field; he made him suck honey from the rock[c][b], and oil from the flinty rock.
translation:
  language: ml
  text: അവൻ അവനെ ദേശത്തിന്റെ ഉയരങ്ങളിൽ സവാരി ചെയ്യാൻ ഇടയാക്കി[a]; അവൻ വയലിലെ വിളവ് ഭക്ഷിച്ചു[b]. പാറയിൽനിന്നുള്ള തേൻ അവൻ അവനെ കുടിപ്പിച്ചു[c]; തീക്കല്ലുപോലെ കഠിനമായ പാറയിൽനിന്നുള്ള എണ്ണയും അവനെ കുടിപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഭൂമിയുടെ ഉന്നതസ്ഥാനങ്ങളിൽ.’ ഇവിടെ ഈ പ്രയോഗം ആരാധനയുമായി ബന്ധപ്പെട്ട ‘ഉന്നതസ്ഥാനങ്ങളെ’ക്കാൾ ഉയർന്നതും ഫലഭൂയിഷ്ഠവുമായ ഭൂപ്രദേശത്തെയായിരിക്കാം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘വയലിലെ ഉൽപ്പന്നം.’
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘പാറയിൽനിന്നുള്ള തേൻ അവൻ അവനെ മുലകുടിപ്പിച്ചു.’ എബ്രായ ക്രിയ അക്ഷരാർഥത്തിൽ ‘മുലകുടിക്കാൻ ഇടയാക്കി’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַרְכִּבֵהוּ
  choice: അവൻ അവനെ ... സഞ്ചരിപ്പിച്ചു
  rationale: רכב എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലുള്ള കാരണാർഥം നിലനിർത്തുന്നു. മലയാളത്തിൽ ‘കയറ്റി ഓടിച്ചു’ എന്നത് അനാവശ്യമായി വാഹനം സൂചിപ്പിക്കാം; ‘സഞ്ചരിപ്പിച്ചു’ ഉയരങ്ങളിലൂടെ വിജയകരമായി നീങ്ങുന്ന കാവ്യചിത്രം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: עַל במותי אָרֶץ
  choice: ദേശത്തിന്റെ ഉയരങ്ങളിൽ
  rationale: במות എന്നതിന്റെ ഭൂപ്രകൃതിസംബന്ധമായ ‘ഉയരങ്ങൾ’ എന്ന അർഥം നൽകുന്നു; വിഗ്രഹാരാധനയുമായി ബന്ധപ്പെട്ട ‘പൂജാഗിരികൾ’ എന്ന ആശയം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: וַיֹּאכַל
  choice: അവൻ ... ഭക്ഷിച്ചു
  rationale: אכל എന്ന ക്രിയയുടെ ലളിതവും മൂർത്തവുമായ അർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: תְּנוּבֹת שָׂדָי
  choice: വയലിലെ വിളവ്
  rationale: תנובות എന്നതിന്റെ ഉൽപ്പാദനം/വിളവ് എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും שָׂדָי എന്ന ഏകവചന സമാഹാരപ്രയോഗം ‘വയൽ’ ആയി പ്രതിഫലിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: וַיֵּנִקֵהוּ
  choice: അവൻ അവനെ കുടിപ്പിച്ചു
  rationale: ינק എന്ന ഹിഫീൽ ക്രിയയുടെ ‘കുടിക്കാൻ ഇടയാക്കുക/കുടിപ്പിക്കുക’ എന്ന കാരണാർഥം സംരക്ഷിക്കുന്നു. ‘മുലകുടിപ്പിച്ചു’ മൂലത്തിലെ പോഷണചിത്രം കൂടുതൽ അക്ഷരാർഥത്തിൽ നൽകുമെങ്കിലും പാറയിൽനിന്നുള്ള തേൻ എന്ന സാഹചര്യത്തിൽ മലയാളത്തിൽ അനാവശ്യമായ ശാരീരിക ദൃശ്യം സൃഷ്ടിക്കാം; അത് അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: דְבַשׁ מִסֶּלַע
  choice: പാറയിൽനിന്നുള്ള തേൻ
  rationale: സാധ്യതയില്ലെന്നു തോന്നുന്ന ഉറവിടത്തിൽനിന്നുള്ള സമൃദ്ധിയുടെ വ്യക്തമായ കാവ്യചിത്രം നിലനിർത്തുന്നു.
- source_word: וְשֶׁמֶן
  choice: എണ്ണയും
  rationale: എബ്രായം ഒലിവ് എന്ന് വ്യക്തമാക്കാത്തതിനാൽ പൊതുവായ ‘എണ്ണ’ എന്ന പദം നിലനിർത്തുന്നു.
- source_word: מֵחַלְמִישׁ צוּר
  choice: തീക്കല്ലുപോലെ കടുപ്പമുള്ള പാറയിൽനിന്നുള്ള
  rationale: חלמיש എന്നതിലെ തീക്കല്ല്/അത്യന്തം കഠിനമായ കല്ല് എന്ന ആശയവും צור എന്ന ‘പാറ’യും സ്വാഭാവിക മലയാളത്തിൽ ഒരുമിച്ചു നൽകുന്നു; കഠിനമായ പാറയിൽനിന്നുപോലും എണ്ണ ലഭിക്കുന്ന സമൃദ്ധിയുടെ വൈരുധ്യം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: വാക്യത്തിലുടനീളമുള്ള മൂന്നാംപുരുഷ ഏകവചന സർവനാമങ്ങളുടെ സൂചിതർ
  choice: കർത്താവിനെയും കർമത്തെയും യഥാക്രമം ദൈവം, യിസ്രായേൽ/യാക്കോബ് എന്നു മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കാതെ ‘അവൻ’, ‘അവനെ’ എന്ന എബ്രായ സർവനാമക്രമം നിലനിർത്തി.
  alternative: കർത്താവിനെ ‘യഹോവ’ എന്നും കർമത്തെ ‘യിസ്രായേൽ’ അല്ലെങ്കിൽ ‘യാക്കോബ്’ എന്നും വ്യക്തമായി ചേർക്കുക.
  rationale: സമീപസന്ദർഭം സൂചിതരെ വ്യക്തമാക്കുന്നുവെങ്കിലും ഈ വാക്യം തന്നെ സർവനാമങ്ങളാണ് ഉപയോഗിക്കുന്നത്. അവ നിലനിർത്തുന്നത് എബ്രായ പ്രഭാഷണപ്രവാഹവും വാക്യത്തിലെ പരാമർശരീതിയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. കാവ്യാത്മകമായ സമാന്തരഘടനയും എബ്രായത്തിലെ കാരണാർഥ ക്രിയകളും കഴിയുന്നത്ര സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടുണ്ട്.
