  to: അവൻ അവനെ ദേശത്തിന്റെ ഉയരങ്ങളിൽ സവാരി ചെയ്യാൻ ഇടയാക്കി[a]; അവൻ വയലിലെ വിളവ് ഭക്ഷിച്ചു[b]. പാറയിൽനിന്നുള്ള തേൻ അവൻ അവനെ കുടിപ്പിച്ചു[c]; തീക്കല്ലുപോലെ കഠിനമായ പാറയിൽനിന്നുള്ള എണ്ണയും അവനെ കുടിപ്പിച്ചു.
  rationale: റכב-ന്റെ കാരണാർഥമായ സവാരിച്ചിത്രം കൂടുതൽ വ്യക്തമായി പുനഃസ്ഥാപിച്ചു; എണ്ണയ്ക്കും അതേ പോഷണക്രിയ ബാധകമാണെന്നത് മലയാളത്തിൽ പ്രകടമാക്കി; ‘חלמיש’ന് സ്വാഭാവികമായ ‘കഠിനമായ’ പ്രയോഗം ഉപയോഗിച്ചു; അടിക്കുറിപ്പ് a-യിലെ അസ്വാഭാവികമായ പദപ്രയോഗം തിരുത്തി. സർവനാമങ്ങളുടെ സൂചിതർ മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കാതെ തന്നെ നിലനിർത്തിയിരിക്കുന്നു.
