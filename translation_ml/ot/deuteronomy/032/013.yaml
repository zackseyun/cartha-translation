  source_fidelity: ഹീബ്രായത്തിലെ കാരണാർഥ ക്രിയകളും സർവനാമങ്ങളിലെ അവ്യക്തതയും പൊതുവേ നന്നായി നിലനിർത്തിയിട്ടുണ്ട്. എന്നാൽ יַרְכִּיבֵהוּ എന്നതിന് നൽകിയിരിക്കുന്ന ‘സഞ്ചരിപ്പിച്ചു’ എന്നത് ‘സവാരി/കയറിച്ചെല്ലൽ നടത്തിച്ചു’ എന്ന റכב-ന്റെ പ്രത്യേക ചിത്രത്തെ മങ്ങിക്കുന്നു. അവസാനത്തെ ‘എണ്ണയും’ എന്ന അപൂർണ ഘടനയിലും ഹീബ്രായത്തിൽ ആദ്യത്തെ ക്രിയ ഇരുവസ്തുക്കളെയും നിയന്ത്രിക്കുന്നതിനെ മലയാളത്തിൽ വ്യക്തമായി ആവർത്തിക്കുന്നതാണ് ഉചിതം.
  naturalness: വാചകം പൊതുവേ ആധുനിക മലയാളത്തിൽ വായിക്കാവുന്നതാണ്. ‘തീക്കല്ലുപോലെ കടുപ്പമുള്ള’ എന്നതിനേക്കാൾ ‘തീക്കല്ലുപോലെ കഠിനമായ’ സ്വാഭാവികമാണ്. അടിക്കുറിപ്പിലെ ‘പൂജാഗിരികൾ’ സാധാരണ പ്രയോഗമല്ല; ‘ആരാധനയുമായി ബന്ധപ്പെട്ട ഉന്നതസ്ഥാനങ്ങൾ’ കൂടുതൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
  terminology: ‘വിളവ്,’ ‘പാറ,’ ‘തേൻ,’ ‘എണ്ണ’ എന്നിവ യോജിച്ചവയാണ്. ‘കുടിപ്പിച്ചു’ മുഖ്യവാചകത്തിൽ ഹീബ്രായത്തിലെ ‘കുടിച്ചുമുലകുടിക്കുക’ എന്ന പോഷണരൂപകത്തെ യുക്തമായി ഉൾക്കൊള്ളുന്നു; അടിക്കുറിപ്പിൽ അതിന്റെ കൂടുതൽ കൃത്യമായ അക്ഷരാർഥം വ്യക്തമാക്കണം.
