revisions:
- from: 'യാഹ്‌വെ അവനോടു പറഞ്ഞു: “അബ്രാഹാമിനോടും യിസ്ഹാക്കിനോടും യാക്കോബിനോടും, ‘ഞാൻ ഇത് നിന്റെ സന്തതിക്കു[a] കൊടുക്കും’ എന്നു പറഞ്ഞ് ഞാൻ സത്യംചെയ്ത ദേശം ഇതാണ്. നിന്റെ സ്വന്തം കണ്ണുകളാൽ അതു കാണാൻ ഞാൻ നിന്നെ അനുവദിച്ചിരിക്കുന്നു; എന്നാൽ നീ അവിടേക്കു കടന്നുപോകുകയില്ല.”'
  to: 'യാഹ്‌വെ അവനോടു പറഞ്ഞു: “അബ്രാഹാമിനോടും യിസ്ഹാക്കിനോടും യാക്കോബിനോടും, ‘ഞാൻ ഇത് നിന്റെ സന്തതിക്കു[a] കൊടുക്കും’ എന്നു പറഞ്ഞ് ഞാൻ ശപഥംചെയ്ത ദേശം ഇതാണ്. നിന്റെ സ്വന്തം കണ്ണുകളാൽ അത് കാണിച്ചുതന്നിരിക്കുന്നു; എന്നാൽ നീ ആ ദേശത്തേക്കു കടന്നുചെല്ലുകയില്ല.”'
  rationale: The revision makes the oath sense explicit, renders the causative sight expression in idiomatic Malayalam, and clarifies that Moses will not cross over into the indicated land. It retains the collective singular “സന്തതി,” the direct divine name, the three patriarchal recipients, and the footnote anchor and content.
