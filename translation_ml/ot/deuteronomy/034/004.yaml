  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלָ֗י/ו זֹ֤את הָ/אָ֨רֶץ֙ אֲשֶׁ֣ר נִ֠שְׁבַּעְתִּי לְ/אַבְרָהָ֨ם לְ/יִצְחָ֤ק וּֽ/לְ/יַעֲקֹב֙ לֵ/אמֹ֔ר לְ/זַרְעֲ/ךָ֖ אֶתְּנֶ֑נָּ/ה הֶרְאִיתִ֣י/ךָ בְ/עֵינֶ֔י/ךָ וְ/שָׁ֖מָּ/ה לֹ֥א תַעֲבֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/004.yaml
  text: And Yahweh said to him[a], “This is the land that I swore to Abraham, to Isaac, and to Jacob, saying, ‘I will give it to your offspring.’ I have let you see it with your own eyes, but you will not cross over there.”
translation:
  language: ml
  text: 'യാഹ്‌വെ അവനോടു പറഞ്ഞു: “അബ്രാഹാമിനോടും യിസ്ഹാക്കിനോടും യാക്കോബിനോടും, ‘ഞാൻ ഇത് നിന്റെ സന്തതിക്കു[a] കൊടുക്കും’ എന്നു പറഞ്ഞ് ഞാൻ ശപഥംചെയ്ത ദേശം ഇതാണ്. നിന്റെ സ്വന്തം കണ്ണുകളാൽ അത് കാണിച്ചുതന്നിരിക്കുന്നു; എന്നാൽ നീ ആ ദേശത്തേക്കു കടന്നുചെല്ലുകയില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നിന്റെ വിത്തിന്.” ഹീബ്രുവിൽ ഏകവചനരൂപത്തിലുള്ള ഒരു സമൂഹവാചക നാമമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരിയെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, അതിന്റെ സാധാരണ പണ്ഡിതോചിത ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: זֹאת הָאָרֶץ
  choice: ദേശം ഇതാണ്
  rationale: ഉടമ്പടി-വാഗ്ദാനത്തിന്റെ പശ്ചാത്തലത്തിൽ הָאָרֶץ നിർദിഷ്ടമായ വാഗ്ദത്തദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: נִשְׁבַּעְתִּי
  choice: ഞാൻ സത്യംചെയ്ത
  rationale: വെറും വാഗ്ദാനത്തേക്കാൾ ശക്തമായ ശപഥത്തിന്റെ അർഥം നിലനിർത്തുന്നു.
- source_word: לְזַרְעֲךָ
  choice: നിന്റെ സന്തതിക്കു
  rationale: זֶרַע ഏകവചനരൂപത്തിലുള്ള സമൂഹവാചകമാണ്; ‘സന്തതി’ അതിന്റെ കൂട്ടായതും വ്യാകരണപരമായി ഏകവചനവുമായ സ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הֶרְאִיתִיךָ
  choice: കാണാൻ ഞാൻ നിന്നെ അനുവദിച്ചിരിക്കുന്നു
  rationale: ראה എന്ന ക്രിയയുടെ ഹിഫീൽ കാരകഭാവം പ്രകടമാക്കുന്നു; ദൈവം മോശെയെ ദേശം കാണാൻ ഇടയാക്കിയെന്ന സൂക്ഷ്മത നിലനിർത്തുന്നു.
- source_word: בְעֵינֶיךָ
  choice: നിന്റെ സ്വന്തം കണ്ണുകളാൽ
  rationale: നേരിട്ടുള്ള വ്യക്തിപരമായ കാഴ്ചയെ ഊന്നുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ശക്തി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְשָׁמָּה לֹא תַעֲבֹר
  choice: എന്നാൽ നീ അവിടേക്കു കടന്നുപോകുകയില്ല
  rationale: עבר എന്നതിലെ അതിർത്തി കടക്കുന്നതിന്റെ സ്ഥലചിത്രം നിലനിർത്തുകയും, മുൻവാക്യത്തോടുള്ള വൈരുധ്യം ‘എന്നാൽ’കൊണ്ട് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം നേരിട്ട് നിലനിർത്തുന്നു; ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കുകയോ ‘Jehovah’ എന്ന പിൽക്കാല സംയുക്തരൂപം സ്വീകരിക്കുകയോ ചെയ്യുന്നില്ല.
- issue: പിതാക്കന്മാർക്കുള്ള വാഗ്ദാനത്തിലെ זֶרַע
  choice: സന്തതി
  alternative: വിത്ത്; സന്തതികൾ
  rationale: ഹീബ്രുവിലെ ഏകവചന സമൂഹനാമത്തിന്റെ തുറന്ന അർഥപരിധി നിലനിർത്തുന്നു; പ്രധാനപാഠത്തിൽ നിർബന്ധമായി ബഹുവചനമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായിക്കാൻ എളുപ്പമുള്ളതുമായ ശൈലി. പിതാക്കന്മാരുടെ പേരുകൾ മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപത്തിൽ നൽകിയിരിക്കുന്നു. ഹീബ്രുവിലെ ആവർത്തിച്ചുള്ള ‘לְ’ മലയാളത്തിലെ ‘-നോടും’ എന്ന സമാന്തര ഘടനയിലൂടെ സൂക്ഷിച്ചിരിക്കുന്നു; കാഴ്ചയും കടന്നുപോകലും തമ്മിലുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷം വ്യാഖ്യാനിച്ച് മൃദൂകരിച്ചിട്ടില്ല.
