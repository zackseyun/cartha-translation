source:
  edition: WLC
  text: וַ/יִּקְבֹּ֨ר אֹת֤/וֹ בַ/גַּיְ֙ בְּ/אֶ֣רֶץ מוֹאָ֔ב מ֖וּל בֵּ֣ית פְּע֑וֹר וְ/לֹֽא יָדַ֥ע אִישׁ֙ אֶת קְבֻ֣רָת֔/וֹ עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/006.yaml
  text: And he buried him in the valley in the land of Moab[a], opposite Beth-peor[b], and no one knows his burial place to this day.
translation:
  language: ml
  text: മോവാബ് ദേശത്തിലെ താഴ്വരയിൽ, ബേത്ത്-പെയോരിന് എതിർവശത്ത്, അവൻ അവനെ അടക്കം ചെയ്തു[a]; അവന്റെ അടക്കസ്ഥലം ഇന്നുവരെ ആരും അറിയുന്നില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അടക്കം ചെയ്തു’ എന്ന ക്രിയയുടെ കർത്താവിനെ ഈ വാക്യത്തിൽ പേരെടുത്തു പറയുന്നില്ല; മുൻസന്ദർഭം യഹോവയിലേക്കാണ് വിരൽചൂണ്ടുന്നത്.
    reason: alternative_reading
  - marker: b
    text: 'അക്ഷരാർഥത്തിൽ: ‘ഒരു മനുഷ്യനും അറിയുന്നില്ല.’ ഇവിടെ അതിന്റെ അർഥം ‘ആരും അറിയുന്നില്ല’ എന്നാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּר אֹתוֹ
  choice: അവൻ അവനെ അടക്കം ചെയ്തു
  rationale: ക്രിയ സജീവരൂപത്തിലുള്ള മൂന്നാംപുരുഷ ഏകവചന പുല്ലിംഗമാണ്; ഈ വാക്യത്തിൽ കർത്താവിന്റെ പേര് പറയാത്തതിനാൽ ‘അവൻ’ എന്നു നിലനിർത്തി. ‘അവനെ’ മോശെയെ സൂചിപ്പിക്കുന്നു.
- source_word: בַגַּיְ
  choice: താഴ്വരയിൽ
  rationale: גַּיְ എന്നത് താഴ്വരയെയോ മലയിടുക്കിനെയോ സൂചിപ്പിക്കാം; പൊതുവായും സ്വാഭാവികമായും മനസ്സിലാകുന്ന ‘താഴ്വര’ തിരഞ്ഞെടുത്തു.
- source_word: בְּאֶרֶץ מוֹאָב
  choice: മോവാബ് ദേശത്തിലെ
  rationale: ‘മോവാബ് ദേശം’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ഭൂമിശാസ്ത്രപരമായ വ്യക്തത നിലനിർത്തുന്നു.
- source_word: מוּל
  choice: എതിർവശത്ത്
  rationale: ഒരു സ്ഥലത്തിന് അഭിമുഖമായോ നേരെ മറുവശത്തായോ ഉള്ള സ്ഥാനം സൂചിപ്പിക്കുന്ന പദം.
- source_word: בֵּית פְּעוֹר
  choice: ബേത്ത്-പെയോർ
  rationale: സ്ഥലനാമം പരിഭാഷപ്പെടുത്താതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: וְלֹא יָדַע אִישׁ
  choice: ആരും അറിയുന്നില്ല
  rationale: אִישׁ രൂപത്തിൽ പുല്ലിംഗ ഏകവചനമാണെങ്കിലും ഇവിടെ പൊതുവായ നിഷേധാർഥത്തിൽ ‘ആരും’ എന്ന അർഥമാണ്; ആധുനിക മലയാളത്തിൽ ഇത് സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: קְבֻרָתוֹ
  choice: അവന്റെ അടക്കസ്ഥലം
  rationale: സന്ദർഭത്തിൽ അടക്കിയ പ്രവൃത്തിയേക്കാൾ മോശെയെ അടക്കിയ സ്ഥലം ഉദ്ദേശിക്കുന്നതിനാൽ ‘അടക്കസ്ഥലം’ എന്നു വ്യക്തമാക്കി.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ഇന്നുവരെ
  rationale: ആഖ്യാതാവിന്റെ കാലംവരെ തുടരുന്ന അവസ്ഥയെ സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘അവൻ അവനെ അടക്കം ചെയ്തു’ എന്നതിലെ കർത്താവിന്റെ തിരിച്ചറിയൽ
  choice: പ്രധാനപാഠത്തിൽ ‘അവൻ’ എന്നു മാത്രം നൽകി കർത്താവിനെ പേരെടുത്ത് തിരിച്ചറിയാതിരിക്കുക.
  alternative: മുൻവാക്യത്തിന്റെ അടിസ്ഥാനത്തിൽ ‘യഹോവ അവനെ അടക്കം ചെയ്തു’ എന്നു വ്യക്തമാക്കുക; അല്ലെങ്കിൽ ‘അവൻ അടക്കപ്പെട്ടു’ എന്ന കർമണിരൂപം ഉപയോഗിക്കുക.
  rationale: മുൻസന്ദർഭം യഹോവയിലേക്കു ശക്തമായി വിരൽചൂണ്ടുന്നുവെങ്കിലും ഈ വാക്യത്തിലെ ക്രിയയുടെ കർത്താവ് പേരെടുത്ത് പറഞ്ഞിട്ടില്ല. അതിനാൽ മൂലപാഠത്തിലെ വ്യാകരണപരമായ അപൂർണവ്യക്തത നിലനിർത്തി.
- issue: אִישׁ എന്ന പൊതുവായ പുല്ലിംഗപദം
  choice: സ്വാഭാവികമായ പൊതുവായ അർഥത്തിൽ ‘ആരും അറിയുന്നില്ല’ എന്നു പരിഭാഷപ്പെടുത്തുക.
  alternative: രൂപപരമായി അടുത്ത ‘ഒരു മനുഷ്യനും അറിയുന്നില്ല’ എന്നു നൽകുക.
  rationale: ഇവിടെ ലിംഗവ്യത്യാസം പ്രസക്തമല്ല; മുഴുവൻ മനുഷ്യരെയും ഉൾക്കൊള്ളുന്ന നിഷേധമാണ്. ‘ആരും’ ആധുനിക മലയാളത്തിൽ അർഥം കൃത്യമായി നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. പേരിടാത്ത കർത്താവിനെ ‘അവൻ’ എന്നു നിലനിർത്തി മൂലപാഠത്തിലെ അവ്യക്തത സംരക്ഷിച്ചു; പൊതുവായ നിഷേധത്തിന് ‘ആരും’ ഉപയോഗിച്ചു.
