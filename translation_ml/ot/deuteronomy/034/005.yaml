id: DEU.34.5
reference: Deuteronomy 34:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֨מָת שָׁ֜ם מֹשֶׁ֧ה עֶֽבֶד יְהוָ֛ה בְּ/אֶ֥רֶץ מוֹאָ֖ב עַל פִּ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/005.yaml
  text: So Moses the servant of Yahweh died there in the land of Moab[a], according to the word of Yahweh.
translation:
  language: ml
  text: അങ്ങനെ യഹ്‌വേയുടെ ദാസനായ മോശെ അവിടെ മോവാബ് ദേശത്തുവെച്ച് യഹ്‌വേയുടെ വചനപ്രകാരം[a] മരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘യഹ്‌വേയുടെ വായ് പ്രകാരം’; ഈ ഹീബ്രു പ്രയോഗം ‘യഹ്‌വേയുടെ കല്പനപ്രകാരം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: അങ്ങനെ ... മരിച്ചു
  rationale: വയ്യക്ഷോൽ രൂപം ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തെ സൂചിപ്പിക്കുന്നു; ‘അങ്ങനെ’ സംഭവക്രമം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു, ‘മരിച്ചു’ എന്നത് മുഖ്യാർഥം നിലനിർത്തുന്നു.
- source_word: שָׁם
  choice: അവിടെ
  rationale: മുൻസന്ദർഭത്തിൽ പറഞ്ഞ സ്ഥലത്തെ ചൂണ്ടിക്കാണിക്കുന്ന സ്ഥലക്രിയാവിശേഷണം.
- source_word: מֹשֶׁה
  choice: മോശെ
  rationale: മലയാളത്തിൽ പ്രചാരത്തിലുള്ള വ്യക്തിനാമരൂപം.
- source_word: עֶבֶד יְהוָה
  choice: യഹ്‌വേയുടെ ദാസനായ
  rationale: עֶבֶד അടിമയെയോ ദാസനെയോ സൂചിപ്പിക്കാമെങ്കിലും ഇവിടെ മോശെയുടെ ബഹുമാനസൂചകമായ ഉടമ്പടിബന്ധ പദവിയാണ്; ‘ദാസൻ’ അതിന് യോജിച്ച സ്വാഭാവിക മലയാളമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בְּאֶרֶץ מוֹאָב
  choice: മോവാബ് ദേശത്തുവെച്ച്
  rationale: ‘മോവാബ് ദേശത്തിൽ’ എന്ന ഭൂമിശാസ്ത്രപരമായ ആശയം നിലനിർത്തിക്കൊണ്ട്, മരണം സംഭവിച്ച സ്ഥലം മലയാളത്തിൽ സ്വാഭാവികമായി പറയുന്നു.
- source_word: עַל פִּי יְהוָה
  choice: യഹ്‌വേയുടെ വചനപ്രകാരം
  rationale: അക്ഷരാർഥത്തിൽ ‘യഹ്‌വേയുടെ വായിന്മേൽ’ എന്ന പ്രയോഗം അവന്റെ വാക്കിനോ കല്പനയ്ക്കോ അനുസരിച്ച് എന്നർഥമുള്ള ഹീബ്രു ശൈലിയാണ്. പ്രധാനപാഠം അർഥം സ്വാഭാവികമായി നൽകുന്നു; അക്ഷരചിത്രവും മറ്റൊരു സാധുവായ വിവർത്തനവും അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമമായ יהוה നേരിട്ട് ഉപയോഗിക്കുന്നു. ‘യഹ്‌വേ’ എന്ന ലിപ്യന്തരണം ആ ഉടമ്പടിനാമത്തെ ഒരു സ്ഥാനപ്പേരാൽ പകരാതെ നിലനിർത്തുന്നു.
- issue: മോശെയെക്കുറിച്ചുള്ള עֶבֶד എന്ന പദത്തിന്റെ ഭാവം
  choice: ദാസൻ
  alternative: അടിമ
  rationale: പദത്തിന് ‘അടിമ’ എന്ന അർഥം ഉണ്ടാകാമെങ്കിലും, ഈ സന്ദർഭത്തിൽ അത് മോശെയുടെ ബഹുമാനസൂചകമായ ദൈവബന്ധവും നിയോഗവും എടുത്തുകാട്ടുന്ന പദവിയാണ്; ‘അടിമ’ എന്നു പറഞ്ഞാൽ ഇവിടെ മുൻനിർത്താത്ത ബന്ധിതാവസ്ഥയ്ക്ക് അമിത ഊന്നൽ ലഭിക്കും.
- issue: עַל פִּי יְהוָה എന്ന പ്രയോഗത്തിന്റെ വ്യാഖ്യാനം
  choice: യഹ്‌വേയുടെ വചനപ്രകാരം
  alternative: യഹ്‌വേയുടെ കല്പനപ്രകാരം
  rationale: ഹീബ്രു പ്രയോഗം വാക്കിനനുസരിച്ചോ കല്പനപ്രകാരമോ എന്ന രണ്ടു അടുത്ത ഭാവങ്ങൾ അനുവദിക്കുന്നു. പ്രധാനപാഠത്തിൽ ‘വചനം’ ഉപയോഗിച്ച് പ്രയോഗത്തിന്റെ ഭാഷാപരമായ ബന്ധം സംരക്ഷിക്കുകയും ‘കല്പന’ അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ദേശത്തുവെച്ച്’ സ്ഥലം വ്യക്തമാക്കുന്നു; ദൈവനാമം ‘യഹ്‌വേ’ എന്നും മോശെയുടെ ബഹുമാനപദവി ‘ദാസൻ’ എന്നും നൽകിയിരിക്കുന്നു.
