source:
  edition: WLC
  text: לְ/כָל הָ֨/אֹת֜וֹת וְ/הַ/מּוֹפְתִ֗ים אֲשֶׁ֤ר שְׁלָח/וֹ֙ יְהוָ֔ה לַ/עֲשׂ֖וֹת בְּ/אֶ֣רֶץ מִצְרָ֑יִם לְ/פַרְעֹ֥ה וּ/לְ/כָל עֲבָדָ֖י/ו וּ/לְ/כָל אַרְצֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/011.yaml
  text: for all the signs and the wonders that Yahweh sent him to do in the land of Egypt[a], to Pharaoh and to all his servants and to all his land,
translation:
  language: ml
  text: ഈജിപ്തുദേശത്ത് ഫറവോനോടും അവന്റെ സകല ദാസന്മാരോടും അവന്റെ ദേശം മുഴുവനോടും[a] ചെയ്യാൻ യാഹ്‌വെ മോശയെ അയച്ച സകല അടയാളങ്ങളുടെയും അത്ഭുതങ്ങളുടെയും കാര്യത്തിലും,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അവസാന ഭാഗം ‘അവന്റെ ദേശം മുഴുവനും എതിരായി’ എന്നും ‘അവന്റെ ദേശത്താകമാനം’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രു ബന്ധസൂചകം വ്യത്യസ്ത ബന്ധാർഥങ്ങൾ വഹിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכָל הָאֹתוֹת וְהַמּוֹפְתִים
  choice: സകല അടയാളങ്ങളുടെയും അത്ഭുതങ്ങളുടെയും കാര്യത്തിലും
  rationale: മുൻവാക്യത്തെ ആശ്രയിച്ചുനിൽക്കുന്ന לְכָל എന്ന ഘടനയെ ‘കാര്യത്തിലും’ എന്നു നൽകി നിലനിർത്തുന്നു. אוֹת–מוֹפֵת എന്ന പരമ്പരാഗത യുഗ്മത്തിന് സ്വാഭാവികമായ ‘അടയാളങ്ങളും അത്ഭുതങ്ങളും’ ഉപയോഗിച്ചു.
- source_word: אֲשֶׁר שְׁלָחוֹ יְהוָה לַעֲשׂוֹת
  choice: പ്രവർത്തിക്കാൻ യാഹ്‌വെ മോശയെ അയച്ച
  rationale: שׁלח എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘അയച്ചു’ നിലനിർത്തുന്നു. മലയാളത്തിൽ സർവനാമത്തിന്റെ സൂചന അവ്യക്തമാകാതിരിക്കാൻ ‘അവനെ’ എന്നതിനുപകരം ‘മോശയെ’ എന്നു വ്യക്തമാക്കി; עשה ഇവിടെ അടയാളങ്ങളും അത്ഭുതങ്ങളും നിർവഹിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പ്രവർത്തിക്കാൻ’ സ്വാഭാവികമാണ്.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: ഈജിപ്തുദേശത്ത്
  rationale: ‘ഈജിപ്തിന്റെ ദേശത്ത്’ എന്ന ഹീബ്രു രൂപം സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: לְפַרְעֹה וּלְכָל עֲבָדָיו וּלְכָל אַרְצוֹ
  choice: ഫറവോനോടും അവന്റെ സകല ദാസന്മാരോടും അവന്റെ ദേശം മുഴുവനോടും ബന്ധപ്പെട്ട്
  rationale: ആവർത്തിക്കുന്ന לְ എന്ന ബന്ധസൂചകത്തിന്റെ വ്യാപ്തി ‘ബന്ധപ്പെട്ട്’ എന്നു നൽകി നിലനിർത്തുന്നു; ‘എതിരെ’ എന്ന പ്രതികൂല അർഥമോ ‘ദേശത്താകമാനം’ എന്ന സ്ഥലവ്യാപ്തിയോ മുഖ്യവാചകത്തിൽ നിർബന്ധമായി തീരുമാനിക്കുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: യഹോവ / കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനെ ഒരു ബിരുദമാക്കി മാറ്റാതെ, സാധാരണ പണ്ഡിതോചിതമായ ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- issue: ഫറവോനോടും അവന്റെ ദേശത്തോടുമുള്ള അടയാളങ്ങളുടെ ബന്ധം
  choice: ബന്ധപ്പെട്ട്
  alternative: എതിരെ / ദേശത്താകമാനം
  rationale: לְ എന്ന മുൻപ്രത്യയം ഇവിടെ ലക്ഷ്യം, പ്രതികൂല ദിശ, അല്ലെങ്കിൽ വ്യാപ്തി സൂചിപ്പിക്കാം. സന്ദർഭം ശിക്ഷാത്മകമായ അർഥം പിന്തുണയ്ക്കുന്നുവെങ്കിലും മുഖ്യവാചകം ആ അർഥം മാത്രം നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. ഈ വാക്യം മുൻവാക്യത്തിൽ ആരംഭിച്ച താരതമ്യത്തിന്റെ തുടർച്ചയായതിനാൽ അവസാനത്തിൽ പൂർണ്ണവിരാമത്തിനു പകരം കോമ നിലനിർത്തി. ‘ദാസന്മാർ’ എന്നത് രാജസേവകരെയും ഉദ്യോഗസ്ഥരെയും ഉൾക്കൊള്ളാവുന്ന വിശാല പദമായി ഉപയോഗിച്ചു.
