source:
  edition: WLC
  text: וְ/אֶת הַ/נֶּ֗גֶב וְֽ/אֶת הַ/כִּכָּ֞ר בִּקְעַ֧ת יְרֵח֛וֹ עִ֥יר הַ/תְּמָרִ֖ים עַד צֹֽעַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/003.yaml
  text: and the Negev[a], and the plain, the valley of Jericho, the city of palm trees[b], as far as Zoar.
translation:
  language: ml
  text: നെഗെബും[a] സമതലവും, ഈന്തപ്പനകളുടെ നഗരമായ യെരീഹോയുടെ താഴ്‌വരയും[b], സോവാർവരെയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “തെക്കും.” എബ്രായപദം ഒരു പ്രദേശനാമമായോ ദിശയെയോ തെക്കൻ ഭൂവിഭാഗത്തെയോ സൂചിപ്പിക്കുന്ന വിവരണമായോ ഉപയോഗിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, “യെരീഹോയുടെ സമതലവും.” എബ്രായപദം വിശാലമായ താഴ്‌വരയെയോ സമതലത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֶּגֶב
  choice: നെഗെബ്
  rationale: ഭൂവിഭാഗങ്ങളുടെ പട്ടികയിൽ ഇത് തെക്കൻ പ്രദേശത്തിന്റെ സ്ഥിരമായ സ്ഥലനാമമായി പ്രവർത്തിക്കുന്നതിനാൽ ലിപ്യന്തരണം ചെയ്തു; പൊതുവായ ദിശാസൂചനയായ ‘തെക്ക്’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: הַכִּכָּר
  choice: സമതലം
  rationale: ഭൂമിശാസ്ത്രപരമായി യോർദ്ദാൻ താഴ്‌വരയിലെ വിശാലമായ സമതലപ്രദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘വൃത്തം’ എന്ന അക്ഷരാർഥം ഇവിടെ സ്വാഭാവികമല്ല.
- source_word: בִּקְעַת יְרֵחוֹ
  choice: യെരീഹോയുടെ താഴ്‌വര
  rationale: בִּקְעָה വിശാലമായ താഴ്‌വരയെയോ സമതലത്തെയോ സൂചിപ്പിക്കാം. മുൻപുള്ള הַכִּכָּר ‘സമതലം’ എന്നു നൽകിയതിനാൽ ഭൂപ്രകൃതിയിലെ വ്യത്യാസം വ്യക്തമാക്കുന്ന സ്വാഭാവികമായ മലയാളരൂപം തെരഞ്ഞെടുത്തു.
- source_word: עִיר הַתְּמָרִים
  choice: ഈന്തപ്പനകളുടെ നഗരം
  rationale: യെരീഹോയെ വിശേഷിപ്പിക്കുന്ന നിർമ്മിതിപദസമുച്ചയത്തിന്റെ ദൃശ്യബിംബവും വ്യാകരണബന്ധവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: עַד צֹעַר
  choice: സോവാർവരെ
  rationale: עַד സൂചിപ്പിക്കുന്ന വ്യാപ്തിയുടെ അതിർത്തി മലയാളത്തിലെ ‘വരെ’ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וְאֶת ... וְאֶת
  choice: …ഉം …ഉം
  rationale: ആവർത്തിക്കുന്ന സംയോജകവും കർമചിഹ്നവും സൃഷ്ടിക്കുന്ന സഞ്ചിത പട്ടികാശൈലി മലയാളത്തിലെ സമുച്ചയപ്രത്യയത്തിലൂടെ സ്വാഭാവികമായി നിലനിർത്തി.
