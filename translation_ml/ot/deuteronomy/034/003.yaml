  source_fidelity: 'മൂല എബ്രായത്തിലെ ഭൂമിശാസ്ത്രപ്പട്ടിക വിശ്വസ്തമായി കൈമാറിയിരിക്കുന്നു: נֶגֶב സ്ഥലനാമമായി ‘നെഗെബ്’ എന്നും, הַכִּכָּר ‘സമതലം’ എന്നും, בִּקְעַת יְרֵחוֹ ‘യെരീഹോയുടെ താഴ്‌വര’ എന്നും നൽകിയിരിക്കുന്നു. ‘ഈന്തപ്പനകളുടെ നഗരമായ’ എന്ന പ്രയോഗം עִיר הַתְּמָרִים എന്ന യെരീഹോ-വിശേഷണത്തെ ശരിയായി ബന്ധിപ്പിക്കുന്നു; ‘സോവാർവരെയും’ עַד צֹעַר-ന്റെ അതിർത്തി/വ്യാപ്തിഭാവം നിലനിർത്തുന്നു.'
