translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ഭൂമിശാസ്ത്രപട്ടികാശൈലി ഉപയോഗിച്ചു. മൂലത്തിലെ ബന്ധഘടന അനുസരിച്ച് ‘ഈന്തപ്പനകളുടെ നഗരമായ’ എന്നത് യെരീഹോയെ വിശേഷിപ്പിക്കുന്നതായി വ്യക്തമാക്കി; യഥാർഥമായ പദാർഥവൈകല്യങ്ങൾ അടിക്കുറിപ്പുകളിൽ സൂക്ഷിച്ചു.
