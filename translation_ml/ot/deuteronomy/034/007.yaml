id: DEU.34.7
reference: Deuteronomy 34:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מֹשֶׁ֗ה בֶּן מֵאָ֧ה וְ/עֶשְׂרִ֛ים שָׁנָ֖ה בְּ/מֹת֑/וֹ לֹֽא כָהֲתָ֥ה עֵינ֖/וֹ וְ/לֹא נָ֥ס לֵחֹֽ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/007.yaml
  text: Moses was one hundred twenty years old when he died[a]; his eye had not grown dim[b], and his vigor had not fled.
translation:
  language: ml
  text: മോശെ മരിക്കുമ്പോൾ നൂറ്റിയിരുപത് വയസ്സായിരുന്നു. അദ്ദേഹത്തിന്റെ കണ്ണ് മങ്ങിയിരുന്നില്ല[a]; ശാരീരിക ഓജസ്സ് ക്ഷയിച്ചിരുന്നുമില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അദ്ദേഹത്തിന്റെ കാഴ്ചശക്തി ക്ഷയിച്ചിരുന്നില്ല.’ എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘അദ്ദേഹത്തിന്റെ കണ്ണ് മങ്ങിയിരുന്നില്ല’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അദ്ദേഹത്തിന്റെ സജീവത കുറഞ്ഞിരുന്നില്ല’ അല്ലെങ്കിൽ ‘സ്വാഭാവിക ശക്തി ക്ഷയിച്ചിരുന്നില്ല.’ എബ്രായപ്രയോഗം ശരീരത്തിന്റെ പുതുമയോ ഓജസ്സോ നിലനിന്നിരുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֹשֶׁה
  choice: മോശെ
  rationale: വാക്യാരംഭത്തിലെ וְ ആഖ്യാനത്തെ മുൻസന്ദർഭത്തോടു ബന്ധിപ്പിക്കുന്നു; മലയാളത്തിൽ കൃത്രിമമായ ഒരു ബന്ധപദം ചേർക്കാതെ സ്വാഭാവികമായ തുടർച്ചയായി അവതരിപ്പിച്ചു.
- source_word: בֶּן מֵאָה וְעֶשְׂרִים שָׁנָה
  choice: നൂറ്റിയിരുപത് വയസ്സായിരുന്നു
  rationale: ‘നൂറ്റിയിരുപത് വയസ്സിന്റെ മകൻ’ എന്ന എബ്രായ പ്രായപ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള അർഥം നൽകി.
- source_word: בְּמֹתוֹ
  choice: മരിക്കുമ്പോൾ
  rationale: മരണസമയത്തെ സൂചിപ്പിക്കുന്ന കാലികപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: לֹא כָהֲתָה עֵינוֹ
  choice: അദ്ദേഹത്തിന്റെ കണ്ണ് മങ്ങിയിരുന്നില്ല
  rationale: എബ്രായത്തിലെ ഏകവചനമായ ‘കണ്ണ്’ നിലനിർത്തുകയും כָּהָה എന്ന ക്രിയയുടെ ‘മങ്ങുക/ദുർബലമാകുക’ എന്ന ആശയം പ്രകടിപ്പിക്കുകയും ചെയ്തു; ഇവിടെ ‘കണ്ണ്’ കാഴ്ചശക്തിയെ സൂചിപ്പിക്കുന്നു.
- source_word: וְלֹא נָס לֵחֹה
  choice: ശാരീരിക ഓജസ്സ് ക്ഷയിച്ചിരുന്നുമില്ല
  rationale: לֵחֹה ശരീരത്തിന്റെ പുതുമ, സജീവത, ഓജസ്സ് എന്നിവയെ സൂചിപ്പിക്കുന്ന അപൂർവ പദമാണ്. נָס എന്ന ‘വിട്ടുപോകുക’ എന്ന രൂപകം അക്ഷരാർഥത്തിൽ പകർത്തുന്നത് മലയാളത്തിൽ അസ്വാഭാവികമാകുന്നതിനാൽ അതിന്റെ ഫലമായ ‘ക്ഷയിച്ചിരുന്നില്ല’ എന്നു നൽകി.
theological_decisions:
- issue: ലֵחֹה എന്ന അപൂർവപദത്തിന്റെ അർഥപരിധി
  choice: ശാരീരിക ഓജസ്സ്
  alternative: സജീവത / സ്വാഭാവിക ശക്തി / ശരീരത്തിന്റെ പുതുമ
  rationale: ശരീരശക്തിയും ജീവചൈതന്യവും നിലനിന്നിരുന്നു എന്ന അർഥം വ്യക്തമാക്കുന്നു; വൃദ്ധാവസ്ഥയെക്കുറിച്ച് മൂലപാഠം പറയുന്നതിലധികം പ്രത്യേകമായ വൈദ്യശാസ്ത്രപരമോ സിദ്ധാന്തപരമോ ആയ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അദ്ദേഹത്തിന്റെ’ എന്ന ആദരസൂചക സർവനാമം മലയാള വായനയിൽ സ്വാഭാവികമാണ്. അർഥവ്യക്തതയ്ക്കായി രണ്ടാം അർധത്തിൽ ‘ശാരീരിക’ ചേർത്തു; അപൂർവമായ എബ്രായപദത്തിന്റെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ നിലനിർത്തി.
