  yaml_path: translation/ot/deuteronomy/034/012.yaml
  text: and for all the mighty hand and for all the great awe that Moses did before the eyes of all Israel[a][b][c][d].
translation:
  language: ml
  text: ശക്തമായ കൈകൊണ്ട് ചെയ്ത എല്ലാ പ്രവൃത്തികളിലും[a][b], മോശെ ഇസ്രായേൽ മുഴുവൻ കാൺകെ ചെയ്ത മഹാഭയം ഉളവാക്കിയ എല്ലാ പ്രവൃത്തികളിലും[c][d] അവനു തുല്യനായ ഒരാളും ഉണ്ടായിട്ടില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘ശക്തമായ കൈ’.
    reason: lexical_alternative
  - marker: b
    text: ‘ശക്തമായ കരത്താൽ ചെയ്ത എല്ലാ കാര്യങ്ങളിലും’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: ‘വലിയ ഭയത്തിന്റെ എല്ലാ പ്രകടനങ്ങളിലും,’ ‘മഹാഭീകരതയുടെ എല്ലാ പ്രകടനങ്ങളിലും,’ അല്ലെങ്കിൽ ‘ഭയഭക്തിയുണർത്തുന്ന എല്ലാ പ്രവൃത്തികളിലും’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: d
    text: ‘ഇസ്രായേൽ മുഴുവൻ കാൺകെ’ എന്നത് ജനതയുടെ പരസ്യവും നേരിട്ടുള്ളതുമായ കാഴ്ചയിൽ എന്നർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְכֹל
  choice: സകല ... പ്രവൃത്തികളിലും
  rationale: മുൻവാക്യത്തിലെ സമാപനപ്രസ്താവനയോടു ചേർന്നുനിൽക്കുന്ന ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി തുടരുന്നു; כֹל എന്ന പദത്തിന്റെ സമഗ്രതയും לְ എന്ന ബന്ധസൂചനയും നിലനിർത്തുന്നു.
- source_word: הַיָּד הַחֲזָקָה
  choice: ശക്തമായ കൈകൊണ്ടുള്ള സകല പ്രവൃത്തികൾ
  rationale: ‘ശക്തമായ കൈ’ എന്ന മൂർത്തരൂപകം നിലനിർത്തിക്കൊണ്ട്, അത് ശക്തിയാൽ ചെയ്ത പ്രവൃത്തികളെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗമാണെന്ന അർഥം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַמּוֹרָא הַגָּדוֹל
  choice: ഭയമുളവാക്കുന്ന സകല മഹാപ്രവൃത്തികൾ
  rationale: מוֹרָא എന്ന പദത്തിലെ ഭയം, ഭയഭക്തി, ഭയങ്കരത എന്നീ അർഥസാധ്യതകൾ പൂർണമായി ‘ഭീകരത’യായി ചുരുക്കാതെ, വിസ്മയവും ഭയവും ഉളവാക്കുന്ന പ്രകടമായ പ്രവൃത്തികളായി അവതരിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר עָשָׂה
  choice: മോശെ ... ചെയ്ത
  rationale: עָשָׂה എന്ന സാധാരണ ക്രിയയുടെ നേരിട്ടുള്ള അർഥം സ്വീകരിക്കുന്നു; പ്രവൃത്തികളെ കർമമായി നൽകിയതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: מֹשֶׁה
  choice: മോശെ
  rationale: മലയാളത്തിലെ പ്രചാരത്തിലുള്ള വ്യക്തിനാമരൂപം.
- source_word: לְעֵינֵי
  choice: കൺമുമ്പിൽ
  rationale: ‘കണ്ണുകളുടെ മുമ്പിൽ’ എന്ന മൂർത്തഭാവം സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗത്തിൽ നിലനിർത്തുന്നു; പരസ്യമായും നേരിട്ടും കണ്ടതെന്ന ആശയം നൽകുന്നു.
- source_word: כָּל יִשְׂרָאֵל
  choice: ഇസ്രായേൽ മുഴുവൻ
  rationale: ജനതയെ ഒരു സമഗ്രസമൂഹമായി സൂചിപ്പിക്കുന്ന കൂട്ടായ അർഥം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: മോശെയുടെ പ്രവൃത്തികളെക്കുറിച്ചുള്ള അന്തിമ പ്രശംസയുടെ സ്വഭാവം
  choice: ഇസ്രായേൽ മുഴുവൻ കണ്ട മോശെയുടെ ശക്തവും ഭയമുളവാക്കുന്നതുമായ പ്രവൃത്തികളുടെ സംഗ്രഹമായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ശക്തമായ കൈ’, ‘മഹാഭീകരത’ എന്നിവ വാക്കുതോറും കർമങ്ങളായി ബന്ധിപ്പിക്കാതെ നൽകുക.
  rationale: ഹീബ്രുവിലെ ഗാംഭീര്യവും ദൃശ്യരൂപകവും സംരക്ഷിക്കുമ്പോൾതന്നെ, പിന്നീടുള്ള പ്രത്യേക ദൈവശാസ്ത്രവ്യാഖ്യാനങ്ങളൊന്നും വാക്യത്തിൽ ചേർക്കുന്നില്ല. മുൻവാക്യത്തിൽ ആരംഭിച്ച ‘അവനു തുല്യനായ പ്രവാചകൻ ഉണ്ടായിട്ടില്ല’ എന്ന താരതമ്യഘടന മലയാളവാക്യത്തിന്റെ പൂർണതയ്ക്കായി ഇവിടെ ആവർത്തിച്ചിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായും ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഹീബ്രുവിലെ ‘ശക്തമായ കൈ’ എന്ന രൂപകം പ്രധാനപാഠത്തിൽ സൂക്ഷിച്ചിരിക്കുന്നു. വാക്യം 10–12-ലെ ദീർഘമായ താരതമ്യഘടനയുടെ അവസാനഘടകമായതിനാൽ, മലയാളത്തിൽ സ്വതന്ത്രമായി വായിക്കാവുന്ന വിധം മുൻപ്രസ്താവനയിലെ വിധേയം ആവർത്തിച്ചു.
