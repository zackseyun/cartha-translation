id: DEU.34.1
reference: Deuteronomy 34:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֨עַל מֹשֶׁ֜ה מֵֽ/עַרְבֹ֤ת מוֹאָב֙ אֶל הַ֣ר נְב֔וֹ רֹ֚אשׁ הַ/פִּסְגָּ֔ה אֲשֶׁ֖ר עַל פְּנֵ֣י יְרֵח֑וֹ וַ/יַּרְאֵ֨/הוּ יְהוָ֧ה אֶת כָּל הָ/אָ֛רֶץ אֶת הַ/גִּלְעָ֖ד עַד דָּֽן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/001.yaml
  text: 'Then Moses went up from the plains of Moab to Mount Nebo[a], to the top of Pisgah, which is opposite Jericho. And Yahweh showed him all the land: Gilead as far as Dan.'
translation:
  language: ml
  text: 'പിന്നെ മോശെ മോവാബ് സമതലങ്ങളിൽ നിന്ന് നെബോ പർവതത്തിലേക്ക്, യെരീഹോയ്ക്കു എതിരെയുള്ള പിസ്ഗയുടെ കൊടുമുടിയിലേക്ക് കയറിച്ചെന്നു. യഹോവ അവന് ദേശമൊക്കെയും കാണിച്ചുകൊടുത്തു[a]: ഗിലെയാദ് മുതൽ ദാൻ വരെ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹോവ അവനെ ദേശമൊക്കെയും കാണാൻ ഇടയാക്കി.”
    reason: ראה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള കാരകാർഥം കൂടുതൽ അക്ഷരാർഥത്തിൽ നൽകുന്ന മറ്റൊരു പരിഭാഷ.
lexical_decisions:
- source_word: וַיַּעַל
  choice: കയറിച്ചെന്നു
  rationale: עלה മുകളിലേക്കുള്ള സഞ്ചാരത്തെ സൂചിപ്പിക്കുന്നു. ‘കയറിച്ചെന്നു’ എന്നത് ദിശാബോധം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണ്.
- source_word: מֵעַרְבֹת מוֹאָב
  choice: മോവാബ് സമതലങ്ങളിൽനിന്ന്
  rationale: עַרְבוֹת ഇവിടെ മോവാബിലെ സമതല/പുൽമേടുപ്രദേശത്തെ സൂചിപ്പിക്കുന്നു; ഭൂമിശാസ്ത്രപരമായി വ്യക്തമായ മലയാളരൂപം തിരഞ്ഞെടുത്തു.
- source_word: הַר נְבוֹ
  choice: നെബോ പർവതത്തിലേക്ക്
  rationale: הַר എന്ന ഭൂമിശാസ്ത്രപദത്തിന് സ്വാഭാവികമായ മലയാളസമാനപദം ‘പർവതം’ ആണ്.
- source_word: רֹאשׁ הַפִּסְגָּה
  choice: പിസ്ഗയുടെ കൊടുമുടിയിലേക്ക്
  rationale: רֹאשׁ അക്ഷരാർഥത്തിൽ ‘തല’ എങ്കിലും ഇവിടെ പർവതത്തിന്റെ മുകൾഭാഗം അഥവാ കൊടുമുടി എന്നാണ് അർഥം.
- source_word: אֲשֶׁר עַל־פְּנֵי יְרֵחוֹ
  choice: യെരീഹോയ്ക്ക് അഭിമുഖമായുള്ള
  rationale: ഭൂമിശാസ്ത്രവിവരണത്തിൽ עַל־פְּנֵי ‘എതിർവശത്തുള്ള/അഭിമുഖമായുള്ള’ എന്ന അർഥം നൽകുന്നു. ‘അഭിമുഖമായുള്ള’ സ്ഥലം യെരീഹോയെ നോക്കിനിൽക്കുന്നു എന്ന ഭാവവും നിലനിർത്തുന്നു.
- source_word: וַיַּרְאֵהוּ
  choice: അവന് … കാണിച്ചുകൊടുത്തു
  rationale: ראה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ‘കാണുമാറാക്കുക, കാണിക്കുക’ എന്ന കാരകാർഥം നൽകുന്നു. മലയാളത്തിൽ ‘കാണിച്ചുകൊടുത്തു’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: തിരുവെഴുത്തിലെ ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപത്തിൽ നൽകിയിരിക്കുന്നു.
- source_word: כָּל הָאָרֶץ
  choice: ദേശമൊക്കെയും
  rationale: הָאָרֶץ ഇവിടെ ഭൂമി മുഴുവനെയല്ല, മോശെയെ കാണിച്ച വാഗ്ദത്തദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אֶת הַגִּלְעָד עַד דָּן
  choice: ഗിലെയാദ് മുതൽ ദാൻ വരെ
  rationale: עַד അതിർത്തിയോ വ്യാപ്തിയോ സൂചിപ്പിക്കുന്നതിനാൽ ‘വരെ’ ഉപയോഗിച്ചു; ഈ വാക്യഭാഗം മുമ്പുള്ള ‘ദേശമൊക്കെയും’ എന്നതിന്റെ ഭൂമിശാസ്ത്രവ്യാപ്തി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ഒരു സ്ഥാനപ്പേരല്ല, ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ ആ വ്യത്യാസം നിലനിർത്താൻ മലയാളത്തിൽ പ്രചാരമുള്ള ‘യഹോവ’ എന്ന നാമരൂപം സ്വീകരിച്ചു.
- issue: וַיַּרְאֵהוּ എന്ന കാരകക്രിയയുടെ അർഥം
  choice: യഹോവ അവന് … കാണിച്ചുകൊടുത്തു
  alternative: യഹോവ അവൻ … കാണാൻ ഇടയാക്കി
  rationale: രണ്ടു രൂപങ്ങളും ഹിഫീൽ കാരകാർഥം പ്രകടിപ്പിക്കുന്നു. മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായ ‘കാണിച്ചുകൊടുത്തു’ സ്വീകരിക്കുകയും കൂടുതൽ അക്ഷരാർഥപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി ഉപയോഗിച്ചു. ഭൂമിശാസ്ത്രനാമങ്ങൾ മലയാളത്തിൽ പരിചിതമായ രൂപങ്ങളിൽ നൽകി. മൂലപാഠത്തിലെ ക്രമവും ‘ദേശമൊക്കെയും’ എന്നതിനു പിന്നാലെയുള്ള വിശദീകരണസ്വഭാവവും കോളൺ ഉപയോഗിച്ച് നിലനിർത്തി.
