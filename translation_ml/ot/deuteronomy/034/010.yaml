source:
  edition: WLC
  text: וְ/לֹֽא קָ֨ם נָבִ֥יא ע֛וֹד בְּ/יִשְׂרָאֵ֖ל כְּ/מֹשֶׁ֑ה אֲשֶׁר֙ יְדָע֣/וֹ יְהוָ֔ה פָּנִ֖ים אֶל פָּנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/010.yaml
  text: And no prophet has arisen again in Israel like Moses[a], whom Yahweh knew face to face.
translation:
  language: ml
  text: യഹ്‌വെ മുഖാമുഖമായി അറിഞ്ഞ മോശെയെപ്പോലെ, ഇസ്രായേലിൽ ഒരു പ്രവാചകനും ഇനിയും ഉയർന്നുവന്നിട്ടില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഇതുവരെ’ എന്നും പരിഭാഷപ്പെടുത്താം; മോശെയെപ്പോലൊരു പ്രവാചകൻ ഇസ്രായേലിൽ ഇതുവരെ ഉയർന്നുവന്നിട്ടില്ലെന്ന് എബ്രായ ക്രിയാവിശേഷണം സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: ഉയർന്നുവന്നിട്ടില്ല
  rationale: വാക്യത്തിന്റെ സമാപനാത്മകമായ തുടർച്ച മലയാളത്തിലെ നിഷേധക്രിയയിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; പ്രത്യേകം ‘എന്നും’ ചേർക്കുന്നത് മലയാളത്തിൽ അനാവശ്യമാണ്.
- source_word: קָם
  choice: ഉയർന്നുവന്നിട്ടില്ല
  rationale: ഒരു പ്രവാചകൻ രംഗത്തുവരുകയോ പ്രത്യക്ഷപ്പെടുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന קום എന്ന ക്രിയയുടെ ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: נָבִיא
  choice: പ്രവാചകൻ
  rationale: ഈ എബ്രായ പദത്തിന്റെ പ്രമാണികവും സന്ദർഭോചിതവുമായ മലയാളപരിഭാഷ.
- source_word: עוֹד
  choice: പിന്നീട്[a]
  rationale: മോശയ്ക്കുശേഷം അത്തരമൊരു പ്രവാചകൻ ഉണ്ടായിട്ടില്ലെന്ന കാലസൂചന വ്യക്തമാക്കുന്നു; ‘ഇതുവരെ’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: בְּיִשְׂרָאֵל
  choice: ഇസ്രായേലിൽ
  rationale: താരതമ്യപ്പെടുത്തുന്ന പ്രവാചകൻ ഉയർന്നുവരാത്ത സമൂഹമേഖലയെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: כְּמֹשֶׁה
  choice: മോശെയെപ്പോലൊരു
  rationale: כְ എന്ന താരതമ്യഘടകത്തെ മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר יְדָעוֹ
  choice: യഹ്‌വെ ... അറിഞ്ഞ
  rationale: ബന്ധവാക്യത്തിൽ മോശയാണ് ידע എന്ന ക്രിയയുടെ കർമം; ഈ ബന്ധം അർഥവ്യാഖ്യാനം കൂട്ടാതെ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: פָּנִים אֶל פָּנִים
  choice: മുഖാമുഖം
  rationale: നേരിട്ടുള്ള വ്യക്തിപരമായ സമ്പർക്കത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ദൃശ്യരൂപവും മറ്റു വേദഭാഗങ്ങളുമായുള്ള പ്രതിധ്വനിയും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: മോശയുമായുള്ള യഹ്‌വെയുടെ ബന്ധത്തെക്കുറിച്ചുള്ള മനുഷ്യരൂപക ഭാഷ
  choice: ‘മുഖാമുഖം’ എന്ന പ്രയോഗം മാറ്റമില്ലാതെ നിലനിർത്തി
  alternative: ‘നേരിട്ട് അറിഞ്ഞ’ അല്ലെങ്കിൽ ‘വ്യക്തിപരമായി അറിഞ്ഞ’
  rationale: എബ്രായത്തിലെ സജീവമായ ബന്ധഭാഷയെ അമൂർത്തമാക്കാതെ സംരക്ഷിക്കുന്നു. ദൈവത്തിന് ശരീരമുണ്ടോ എന്ന ചോദ്യം പരിഭാഷയിൽ തീർപ്പാക്കാതെയും വെളിപ്പാടിന്റെ സവിശേഷമായ നേരിട്ടുള്ള സ്വഭാവം നിലനിർത്തിയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഉയർന്നുവന്നിട്ടില്ല’ എന്നത് പ്രവാചകന്റെ ഉദയത്തെ സൂചിപ്പിക്കുമ്പോൾ ‘എഴുന്നേറ്റിട്ടില്ല’ എന്ന അക്ഷരാർഥപരമായെങ്കിലും അസ്വാഭാവികമായ രൂപം ഒഴിവാക്കുന്നു. വാക്യക്രമം മലയാളവായനയ്ക്ക് സ്വാഭാവികമാക്കിയിട്ടും യഹ്‌വെയാണ് അറിയുന്നവനും മോശയാണ് അറിയപ്പെടുന്നവനും എന്ന എബ്രായ വ്യാകരണബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
