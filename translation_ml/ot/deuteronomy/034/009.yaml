source:
  edition: WLC
  text: וִֽ/יהוֹשֻׁ֣עַ בִּן נ֗וּן מָלֵא֙ ר֣וּחַ חָכְמָ֔ה כִּֽי סָמַ֥ךְ מֹשֶׁ֛ה אֶת יָדָ֖י/ו עָלָ֑י/ו וַ/יִּשְׁמְע֨וּ אֵלָ֤י/ו בְּנֵֽי יִשְׂרָאֵל֙ וַֽ/יַּעֲשׂ֔וּ כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/009.yaml
  text: And Joshua son of Nun was full of the spirit of wisdom[a], because Moses had laid his hands on him[b]. So the sons of Israel listened to him and did as Yahweh had commanded Moses.
translation:
  language: ml
  text: നൂന്റെ മകനായ യോശുവ ജ്ഞാനത്തിന്റെ ആത്മാവു നിറഞ്ഞവനായിരുന്നു[a]; കാരണം മോശെ തന്റെ കൈകൾ അവന്റെമേൽ വെച്ചിരുന്നു. അതുകൊണ്ട് ഇസ്രായേൽമക്കൾ[b] അവന്റെ വാക്കു കേൾക്കുകയും യഹോവ മോശെയോടു കല്പിച്ചതുപോലെ ചെയ്യുകയും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ജ്ഞാനത്തിന്റെ ആത്മാവിനാൽ നിറഞ്ഞവനായിരുന്നു.’ ഇവിടെ ‘ആത്മാവ്’ എന്നത് പൊതുവായി ജ്ഞാനമുള്ള മനോഭാവത്തെയോ കൂടുതൽ പ്രത്യേകമായി ദൈവം നൽകിയ ശക്തീകരണത്തെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
  - marker: b
    text: 'അഥവാ, ‘ഇസ്രായേല്യർ.’ അക്ഷരാർഥം: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָלֵא רוּחַ חָכְמָה
  choice: ജ്ഞാനത്തിന്റെ ആത്മാവിനാൽ നിറഞ്ഞവനായിരുന്നു
  rationale: മָלֵא എന്ന വിശേഷണപ്രയോഗത്തിന്റെ ‘നിറഞ്ഞവൻ’ എന്ന അർഥവും רוּחַ חָכְמָה എന്ന എബ്രായ ഘടനയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ഇത് പരിശുദ്ധാത്മാവിനെത്തന്നെ വ്യക്തമായി സൂചിപ്പിക്കുന്നുവോ ദൈവദത്തമായ ജ്ഞാനശക്തിയെയോ എന്നത് തീർപ്പാക്കുന്നില്ല.
- source_word: רוּחַ
  choice: ആത്മാവ്
  rationale: ഇവിടെ ഈ പദം ജ്ഞാനവുമായി ബന്ധപ്പെട്ട ജീവിപ്പിക്കുന്നതോ ശക്തിപ്പെടുത്തുന്നതോ ആയ ആത്മാവിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ അക്ഷരവലിപ്പംകൊണ്ട് ദൈവികത വേർതിരിക്കാനാകാത്തതിനാൽ, വ്യാഖ്യാനത്തിലെ സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: סָמַךְ ... אֶת יָדָיו עָלָיו
  choice: തന്റെ കൈകൾ അവന്റെമേൽ വെച്ചിരുന്നു
  rationale: നിയോഗമോ അധികാരമേൽപ്പിക്കലോ സൂചിപ്പിക്കുന്ന കൈവെക്കൽപ്രവൃത്തിയെ നേരിട്ടും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു; ബഹുവചനമായ ‘കൈകൾ’ നിലനിർത്തുന്നു.
- source_word: וַיִּשְׁמְעוּ אֵלָיו
  choice: അവന്റെ വാക്കു കേട്ട്
  rationale: ശ്രദ്ധിച്ചു കേൾക്കുക എന്ന അടിസ്ഥാനാർഥത്തോടൊപ്പം അനുസരണത്തിന്റെ സൂചനയും നൽകുന്നു; തുടർന്നുള്ള ‘ചെയ്തു’ എന്ന ക്രിയ ആ അനുസരണം വ്യക്തമാക്കുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: അക്ഷരാർഥത്തിലുള്ള കുടുംബ-ഉടമ്പടി ഭാഷ നിലനിർത്തിക്കൊണ്ട്, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സമഗ്രസമൂഹത്തെ സൂചിപ്പിക്കുന്നതുമായ രൂപം ഉപയോഗിക്കുന്നു.
- source_word: וַיַּעֲשׂוּ כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: യഹോവ മോശെയോടു കല്പിച്ചതുപോലെ ചെയ്തു
  rationale: ഇസ്രായേലിന്റെ പ്രവൃത്തി മോശെയോടുള്ള യഹോവയുടെ മുൻകല്പനയ്ക്കനുസൃതമായിരുന്നു എന്ന ബന്ധം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമത്തെ ഒരു സ്ഥാനപദംകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ദീർഘകാലമായി പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: רוּחַ חָכְמָה എന്നത് പരിശുദ്ധാത്മാവിനെ നേരിട്ട് സൂചിപ്പിക്കുന്നതായി വിവർത്തനം ചെയ്യണമോ
  choice: പ്രധാനപാഠത്തിൽ ‘ജ്ഞാനത്തിന്റെ ആത്മാവ്’ എന്നു നൽകി തിരിച്ചറിയൽ തുറന്നുവെക്കുന്നു
  alternative: ‘ജ്ഞാനം നൽകുന്ന ദൈവാത്മാവ്’ അല്ലെങ്കിൽ പരിശുദ്ധാത്മാവിനെ വ്യക്തമായി സൂചിപ്പിക്കുന്ന വിവർത്തനം
  rationale: യോശുവയ്ക്ക് ലഭിച്ചത് ദൈവികമായ ശക്തീകരണമാണെന്ന സന്ദർഭസൂചന ശക്തമാണെങ്കിലും, എബ്രായപ്രയോഗം പരിശുദ്ധാത്മാവെന്ന തിരിച്ചറിയൽ നിർബന്ധമാക്കുന്നില്ല. അതിനാൽ യഥാർഥമായ ദൈവശാസ്ത്രപരമായ സംഘർഷം സംരക്ഷിക്കുന്നു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന പുരുഷലിംഗ കുടുംബപ്രയോഗത്തിന്റെ വിവർത്തനം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: മൂലത്തിലെ കുടുംബ-ഉടമ്പടി ഭാവം ‘മക്കൾ’ നിലനിർത്തുന്നു; അതേസമയം മലയാളത്തിൽ ഈ പദം മുഴുവൻ ജനസമൂഹത്തെയും സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പമുള്ള, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. ‘കല്പിച്ചു’, ‘അവന്റെമേൽ’ തുടങ്ങിയ രൂപങ്ങൾ തിരുവെഴുത്തിന് യോജിച്ച ഔപചാരികത നൽകുന്നു; അപരിചിതമായ പുരാതന പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
