revisions:
- from: നൂന്റെ മകനായ യോശുവ ജ്ഞാനത്തിന്റെ ആത്മാവിനാൽ നിറഞ്ഞവനായിരുന്നു[a]; കാരണം മോശെ തന്റെ കൈകൾ അവന്റെമേൽ വെച്ചിരുന്നു. അതുകൊണ്ട് ഇസ്രായേൽമക്കൾ[b] അവന്റെ വാക്കു കേട്ട്, യഹോവ മോശെയോടു കല്പിച്ചതുപോലെ ചെയ്തു.
  to: നൂന്റെ മകനായ യോശുവ ജ്ഞാനത്തിന്റെ ആത്മാവു നിറഞ്ഞവനായിരുന്നു[a]; കാരണം മോശെ തന്റെ കൈകൾ അവന്റെമേൽ വെച്ചിരുന്നു. അതുകൊണ്ട് ഇസ്രായേൽമക്കൾ[b] അവന്റെ വാക്കു കേൾക്കുകയും യഹോവ മോശെയോടു കല്പിച്ചതുപോലെ ചെയ്യുകയും ചെയ്തു.
