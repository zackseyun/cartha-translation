  text: וְ/אֵת֙ כָּל נַפְתָּלִ֔י וְ/אֶת אֶ֥רֶץ אֶפְרַ֖יִם וּ/מְנַשֶּׁ֑ה וְ/אֵת֙ כָּל אֶ֣רֶץ יְהוּדָ֔ה עַ֖ד הַ/יָּ֥ם הָ/אַחֲרֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/002.yaml
  text: and all Naphtali[a], and the land of Ephraim and Manasseh, and all the land of Judah as far as the western sea,
translation:
  language: ml
  text: നഫ്താലിയുടെ പ്രദേശം മുഴുവനും, എഫ്രയീമിന്റെയും മനശ്ശെയുടെയും ദേശവും, യെഹൂദാദേശം മുഴുവനും പടിഞ്ഞാറൻ കടൽവരെ[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘അവസാനത്തെ കടൽ’ അല്ലെങ്കിൽ ‘പിന്നിലെ കടൽ.’ പടിഞ്ഞാറുള്ള കടലിനെ—അതായത്, മെഡിറ്ററേനിയൻ കടലിനെ—സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל נַפְתָּלִי
  choice: നഫ്താലിയുടെ പ്രദേശം മുഴുവനും
  rationale: ഭൂവിഭാഗങ്ങളുടെ ഈ പട്ടികയിൽ ഗോത്രനാമം അതിന്റെ പ്രദേശത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ അർഥം വ്യക്തവും സ്വാഭാവികവുമാക്കാൻ ‘പ്രദേശം’ ചേർത്തു; כָּל എന്നതിന്റെ പൂർണവ്യാപ്തി ‘മുഴുവനും’ നിലനിർത്തുന്നു.
- source_word: אֶרֶץ אֶפְרַיִם וּמְנַשֶּׁה
  choice: എഫ്രയീമിന്റെയും മനശ്ശെയുടെയും ദേശവും
  rationale: אֶרֶץ എന്നത് ദേശം/ഭൂപ്രദേശം എന്നാണ്. രണ്ടു ഗോത്രനാമങ്ങളെയും ബന്ധിപ്പിച്ചുള്ള എബ്രായ ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി ഇരട്ട സംബന്ധികരൂപത്തിൽ അവതരിപ്പിച്ചു.
- source_word: כָּל אֶרֶץ יְהוּדָה
  choice: യെഹൂദാദേശം മുഴുവനും
  rationale: അടിസ്ഥാനപാഠത്തിലെ אֶרֶץ എന്ന ഭൂമിശാസ്ത്രപരമായ ആശയം ‘ദേശം’ വഴി വ്യക്തമായി നിലനിർത്തുകയും כָּל എന്നത് ‘മുഴുവനും’ എന്നു പരിഭാഷപ്പെടുത്തുകയും ചെയ്തു.
- source_word: עַד
  choice: വരെ
  rationale: കാഴ്ചയുടെയോ പ്രദേശത്തിന്റെയോ വ്യാപ്തിയുടെ അതിർത്തി സൂചിപ്പിക്കുന്ന עַד എന്ന പദത്തിന് മലയാളത്തിലെ സ്വാഭാവികമായ തുല്യം ‘വരെ’ ആണ്.
- source_word: הַיָּם הָאַחֲרוֹן
  choice: പടിഞ്ഞാറൻ കടൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘അവസാനത്തെ/പിന്നിലെ കടൽ’ എന്നാണെങ്കിലും, കിഴക്കോട്ടു മുഖംതിരിച്ചുള്ള എബ്രായ ദിശാസങ്കൽപ്പത്തിൽ ഇത് പടിഞ്ഞാറുള്ള കടലിനെ സൂചിപ്പിക്കുന്നു. അതിനാൽ അർഥം വ്യക്തമായി നൽകുകയും അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഭൂമിശാസ്ത്രവിവരണശൈലി ഉപയോഗിച്ചു. വാക്യം അടുത്ത വാക്യഭാഗവുമായി തുടരുന്നതിനാൽ അവസാനത്തിൽ പൂർണവിരാമത്തിനു പകരം അൽപവിരാമം നിലനിർത്തി. ഇംഗ്ലീഷ് ഉപദേശപാഠത്തിൽ അടിക്കുറിപ്പ് ചിഹ്നം ‘നഫ്താലി’ക്കു ശേഷം വന്നിരുന്നെങ്കിലും, അടിക്കുറിപ്പിന്റെ ഉള്ളടക്കവും എബ്രായ സ്രോതസ്സും അനുസരിച്ച് അത് ‘പടിഞ്ഞാറൻ കടൽ’ക്കു ശേഷമാണ് ചേർത്തത്.
