source:
  edition: WLC
  text: וַ/יִּבְכּוּ֩ בְנֵ֨י יִשְׂרָאֵ֧ל אֶת מֹשֶׁ֛ה בְּ/עַֽרְבֹ֥ת מוֹאָ֖ב שְׁלֹשִׁ֣ים י֑וֹם וַֽ/יִּתְּמ֔וּ יְמֵ֥י בְכִ֖י אֵ֥בֶל מֹשֶֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/008.yaml
  text: And the sons of Israel wept for Moses in the plains of Moab thirty days; then the days of weeping[a] for the mourning of Moses were completed.
translation:
  language: ml
  text: ഇസ്രായേൽമക്കൾ മോശെയെച്ചൊല്ലി മോവാബ് സമതലങ്ങളിൽ മുപ്പതു ദിവസം കരഞ്ഞു. അങ്ങനെ മോശെയെച്ചൊല്ലിയുള്ള കരച്ചിലിന്റെയും വിലാപത്തിന്റെയും ദിവസങ്ങൾ[a] പൂർത്തിയായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘മോശെയുടെ വിലാപത്തിന്റെ കരച്ചിൽദിവസങ്ങൾ’; ഇതിന്റെ അർഥം മോശെയെച്ചൊല്ലിയുള്ള കരച്ചിലിന്റെയും വിലാപത്തിന്റെയും കാലയളവ് എന്നാണ്.
    reason: എബ്രായത്തിലെ സാന്ദ്രമായ construct-ശൃംഖല സൂചിപ്പിക്കുമ്പോൾ, പ്രധാനവാചകത്തിൽ സ്വാഭാവികമായ മലയാള അർഥം നിലനിർത്തുന്നു.
lexical_decisions:
- source_word: וַיִּבְכּוּ
  choice: കരഞ്ഞു
  rationale: בכה എന്ന ക്രിയ കണ്ണീരൊഴുക്കി കരയുന്നതിനെ സൂചിപ്പിക്കുന്നു. പിന്നാലെ വരുന്ന വിശാലമായ വിലാപധാരണയിൽനിന്ന് കരച്ചിലിനെ വേർതിരിക്കാനും സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കാനുമാണ് ‘കരഞ്ഞു’ തെരഞ്ഞെടുത്തത്.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ/മക്കൾ.’ മലയാള ബൈബിൾഭാഷയിൽ പരിചിതവും ഒരു ജനസമൂഹത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നതുമായ ‘ഇസ്രായേൽമക്കൾ’ മൂലപ്രയോഗത്തിന്റെ രൂപം നിലനിർത്തുന്നു.
- source_word: אֶת מֹשֶׁה
  choice: മോശെയെച്ചൊല്ലി
  rationale: בכה എന്ന ക്രിയയോടൊപ്പം אֶת കരയപ്പെടുന്ന വ്യക്തിയെ അടയാളപ്പെടുത്തുന്നു. മലയാളത്തിൽ ‘മോശെയെച്ചൊല്ലി കരഞ്ഞു’ എന്നത് ആ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: മോവാബ് സമതലങ്ങളിൽ
  rationale: עֲרָבוֹת സമതലമോ പുൽമേടുപോലുള്ള തുറന്ന പ്രദേശമോ സൂചിപ്പിക്കുന്നു. ഭൂമിശാസ്ത്രപരമായ അർഥവും ബഹുവചനവും ‘സമതലങ്ങളിൽ’ നിലനിർത്തുന്നു.
- source_word: שְׁלֹשִׁים יוֹם
  choice: മുപ്പതു ദിവസം
  rationale: സംഖ്യയും കാലയളവും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: וַיִּתְּמוּ
  choice: തികഞ്ഞു
  rationale: תם ഇവിടെ ഒരു നിശ്ചിത കാലഘട്ടം പൂർത്തിയായി എന്ന ഫലാവസ്ഥയെ സൂചിപ്പിക്കുന്നു. ‘തികഞ്ഞു’ ആ പൂർത്തീകരണഭാവം നിലനിർത്തുന്നു; കൂടുതൽ വ്യവഹാരികമായ ‘അവസാനിച്ചു’ എന്നതിനെ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: יְמֵי בְכִי
  choice: കരച്ചിൽദിവസങ്ങൾ
  rationale: ‘കരച്ചിലിന്റെ ദിവസങ്ങൾ’ എന്ന ഘടനയെ സംക്ഷിപ്തമായും വ്യക്തമായും പ്രതിഫലിപ്പിക്കുന്നു; ആദ്യ ക്രിയയായ ‘കരഞ്ഞു’വുമായുള്ള പദബന്ധവും നിലനിർത്തുന്നു.
- source_word: אֵבֶל מֹשֶׁה
  choice: മോശെയെച്ചൊല്ലിയുള്ള വിലാപം
  rationale: ഈ construct chain മോശെയുടെ മരണത്തെച്ചൊല്ലിയുള്ള വിലാപത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘മോശെയുടെ വിലാപം’ എന്നു പറഞ്ഞാൽ മോശെ തന്നെയാണ് വിലപിക്കുന്നതെന്ന തെറ്റിദ്ധാരണ വരാം; അതിനാൽ ബന്ധം വ്യക്തമായി പ്രകടിപ്പിച്ചു.
