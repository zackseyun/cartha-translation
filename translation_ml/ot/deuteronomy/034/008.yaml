  source_fidelity: 'ആദ്യവാക്യം എബ്രായവാചകത്തോട് വിശ്വസ്തമാണ്: ഇസ്രായേൽമക്കൾ മോശെയെച്ചൊല്ലി മോവാബ് സമതലങ്ങളിൽ മുപ്പതു ദിവസം കരഞ്ഞു. എന്നാൽ നിലവിലെ രണ്ടാംവാക്യത്തിലെ ‘വിലാപത്തിന്റെ കരച്ചിൽദിവസങ്ങൾ’ എന്ന പ്രയോഗം യְמֵי בְכִי אֵבֶל מֹשֶׁה എന്ന ഘടനയെ മലയാളത്തിൽ അസ്വാഭാവികമായും ബന്ധം മറിച്ചുവച്ചതുപോലെയും കേൾപ്പിക്കുന്നു. ഇവിടെ മോശെയെച്ചൊല്ലിയുള്ള കരച്ചിലും വിലാപവും നടന്ന ദിവസങ്ങളാണ് ഉദ്ദേശ്യം.'
  naturalness: ‘കരച്ചിൽദിവസങ്ങൾ’ ചേർത്തെഴുതിയ രൂപവും ‘വിലാപത്തിന്റെ കരച്ചിൽദിവസങ്ങൾ’ എന്ന പദബന്ധവും ആധുനിക നിലവാരമലയാളത്തിൽ സുഗമമല്ല. ‘മോശെയെച്ചൊല്ലിയുള്ള കരച്ചിലിന്റെയും വിലാപത്തിന്റെയും ദിവസങ്ങൾ’ എന്നത് വ്യക്തവും സ്വാഭാവികവും ആണ്. וַיִּתַּמּוּ-വിന്റെ പൂർത്തീകരണഭാവത്തിന് ‘പൂർത്തിയായി’ യോജിക്കുന്നു.
  terminology: ‘ഇസ്രായേൽമക്കൾ,’ ‘മോശെയെച്ചൊല്ലി,’ ‘മോവാബ് സമതലങ്ങളിൽ’ എന്നിവ ഉചിതമാണ്. ‘വിലാപം’ אֵבֶל-ന്റെ സന്ദർഭോചിതമായ പരിഭാഷയാണ്; ‘മോശെയെച്ചൊല്ലിയുള്ള’ എന്നു പറയുന്നത് മോശെ വിലപിച്ചു എന്ന തെറ്റായ വായന ഒഴിവാക്കുന്നു.
