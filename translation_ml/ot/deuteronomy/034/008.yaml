translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഇസ്രായേൽമക്കൾ’ പോലുള്ള പരിചിതമായ വേദപദപ്രയോഗം നിലനിർത്തിയപ്പോൾ, ‘മോശെയെച്ചൊല്ലി’ എന്ന രൂപം ആധുനിക വായനക്കാരന് ബന്ധം വ്യക്തമാക്കുന്നു. പ്രധാനവാക്യം എബ്രായത്തിലെ കരച്ചിൽ/വിലാപ വ്യത്യാസവും പൂർത്തീകരണഭാവവും പരമാവധി സംരക്ഷിക്കുന്നു.
