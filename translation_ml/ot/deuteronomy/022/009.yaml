  source_fidelity: 'The draft accurately preserves the prohibition against sowing a vineyard with two kinds of seed and identifies both affected components: the sown seed and the vineyard’s produce. Its rendering of תִּקְדַּשׁ as loss of ordinary use is a defensible contextual interpretation, provided the literal consecration language remains in a note.'
