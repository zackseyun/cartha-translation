source:
  edition: WLC
  text: לֹא תִזְרַ֥ע כַּרְמְ/ךָ֖ כִּלְאָ֑יִם פֶּן תִּקְדַּ֗שׁ הַֽ/מְלֵאָ֤ה הַ/זֶּ֨רַע֙ אֲשֶׁ֣ר תִּזְרָ֔ע וּ/תְבוּאַ֖ת הַ/כָּֽרֶם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/009.yaml
  text: You shall not sow your vineyard with two kinds of seed[a], lest the whole yield be forfeited—the seed that you sow and the produce of the vineyard.
translation:
  language: ml
  text: നിന്റെ മുന്തിരിത്തോട്ടത്തിൽ രണ്ടുതരം വിത്തുകൾ വിതയ്ക്കരുത്; അങ്ങനെ ചെയ്താൽ, മുഴുവൻ ഉൽപ്പാദനവും—നീ വിതയ്ക്കുന്ന വിത്തും മുന്തിരിത്തോട്ടത്തിലെ വിളവും—സാധാരണ ഉപയോഗത്തിൽനിന്ന് വേർതിരിക്കപ്പെടും[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “മുഴുവൻ ഉൽപ്പാദനവും വിശുദ്ധമായിത്തീരും” അഥവാ “സമർപ്പിതമായിത്തീരും”; അതായത്, സാധാരണ ഉപയോഗത്തിനായി ഇനി ലഭ്യമാകില്ല.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִזְרַע
  choice: വിതയ്ക്കരുത്
  rationale: זרע എന്ന ക്രിയയുടെ കൃത്യമായ കാർഷിക അർഥം ‘വിത്തു വിതയ്ക്കുക’ എന്നതാണ്; ‘നടുക’ എന്നതിനെക്കാൾ ഈ നിയമസന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: כַּרְמְךָ
  choice: നിന്റെ മുന്തിരിത്തോട്ടത്തിൽ
  rationale: כרם എന്നത് മുന്തിരിവള്ളികൾ കൃഷിചെയ്യുന്ന തോട്ടത്തെ സൂചിപ്പിക്കുന്ന പതിവുപദമാണ്.
- source_word: כִּלְאָיִם
  choice: രണ്ടുതരം വിത്തുകൾ
  rationale: כלאים വിലക്കപ്പെട്ട ഇനക്കലർപ്പിനെ സൂചിപ്പിക്കുന്നു. ഈ വിത്തുവിതയ്ക്കൽസന്ദർഭത്തിൽ ‘രണ്ടുതരം വിത്തുകൾ’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: פֶּן
  choice: അങ്ങനെ ചെയ്താൽ
  rationale: פן ഒഴിവാക്കേണ്ട പ്രതികൂലഫലം അവതരിപ്പിക്കുന്നു. മലയാളത്തിലെ നിയമപരമായ മുന്നറിയിപ്പിൽ ഈ പ്രയോഗം സ്വാഭാവികമായി ആ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: תִּקְדַּשׁ
  choice: സാധാരണ ഉപയോഗത്തിന് വിലക്കപ്പെട്ടതായിത്തീരും
  rationale: קדש എന്ന ക്രിയ അക്ഷരാർഥത്തിൽ ‘വിശുദ്ധമായിത്തീരുക/വേർതിരിക്കപ്പെടുക’ എന്നാണ്. ഇവിടെ ഫലം സാധാരണ ഉപയോഗത്തിൽനിന്ന് മാറ്റിവെക്കപ്പെടുന്നതാണെന്ന് സന്ദർഭം സൂചിപ്പിക്കുന്നതിനാൽ, നിയമപരമായ പ്രത്യാഘാതം മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കുകയും അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്തു.
- source_word: הַמְלֵאָה
  choice: വിളവു മുഴുവനും
  rationale: המלאה പൂർണമായ ഉൽപ്പാദനത്തെയോ വിളവിനെയോ സൂചിപ്പിക്കുന്നു.
- source_word: הַזֶּרַע אֲשֶׁר תִּזְרָע
  choice: നീ വിതയ്ക്കുന്ന വിത്തും
  rationale: ബാധിക്കപ്പെടുന്ന വിളവിന്റെ ഒരു ഘടകത്തെ വ്യക്തമാക്കുന്ന മൂലഭാഷയിലെ അനുബന്ധവാക്യം നിലനിർത്തുന്നു.
- source_word: וּתְבוּאַת הַכָּרֶם
  choice: മുന്തിരിത്തോട്ടത്തിലെ വിളവും
  rationale: תבואה ഉൽപ്പന്നത്തെയോ വിളവിനെയോ സൂചിപ്പിക്കുന്നു; കാർഷികസന്ദർഭത്തിൽ ‘വിളവ്’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
theological_decisions:
- issue: ശുദ്ധി/വിശുദ്ധി സംബന്ധമായ നിയമസന്ദർഭത്തിൽ תִּקְדַּשׁ എന്നതിന്റെ അർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘സാധാരണ ഉപയോഗത്തിന് വിലക്കപ്പെട്ടതായിത്തീരും’ എന്നു നൽകി.
  alternative: ‘വിശുദ്ധമായിത്തീരും’ അല്ലെങ്കിൽ ‘വിശുദ്ധമായി വേർതിരിക്കപ്പെടും’.
  rationale: ഇവിടെ ‘വിശുദ്ധം’ എന്നത് അനുകൂലമായ ആത്മീയ പ്രശംസയായി തെറ്റിദ്ധരിക്കപ്പെടാം. മൂലപദത്തിന്റെ ‘വേർതിരിക്കപ്പെടുക’ എന്ന ആശയവും സാധാരണ ഉപയോഗം നഷ്ടമാകുന്ന നിയമപരമായ ഫലവും ഒരുമിച്ച് അറിയിക്കാൻ വ്യാഖ്യാനാത്മകമായ മുഖ്യപരിഭാഷയും അക്ഷരാർഥം രേഖപ്പെടുത്തുന്ന അടിക്കുറിപ്പും ഉപയോഗിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമശൈലി സ്വീകരിച്ചു. മൂലവാക്യത്തിലെ വിളവിന്റെ രണ്ടു ഘടകങ്ങളും നിലനിർത്തി; ദുഷ്കരമായ תִּקְדַּשׁ എന്ന പദത്തിന്റെ നിയമപരമായ ഫലം മുഖ്യപാഠത്തിലും അതിന്റെ അക്ഷരാർഥം അടിക്കുറിപ്പിലും നൽകി.
