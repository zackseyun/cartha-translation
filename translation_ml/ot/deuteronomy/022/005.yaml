source:
  edition: WLC
  text: לֹא יִהְיֶ֤ה כְלִי גֶ֨בֶר֙ עַל אִשָּׁ֔ה וְ/לֹא יִלְבַּ֥שׁ גֶּ֖בֶר שִׂמְלַ֣ת אִשָּׁ֑ה כִּ֧י תוֹעֲבַ֛ת יְהוָ֥ה אֱלֹהֶ֖י/ךָ כָּל עֹ֥שֵׂה אֵֽלֶּה־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/005.yaml
  text: A woman shall not wear a man's article[a], and a man shall not put on a woman's garment, for everyone who does these things is an abomination to Yahweh your God.
translation:
  language: ml
  text: പുരുഷന്റേതായ സാമഗ്രികളൊന്നും സ്ത്രീ ധരിക്കരുത്; പുരുഷൻ സ്ത്രീയുടെ വസ്ത്രം ധരിക്കരുത്. ഇത്തരം കാര്യങ്ങൾ ചെയ്യുന്ന ഏവനും നിന്റെ ദൈവമായ യഹോവയ്ക്ക് അറപ്പാണ്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְלִי גֶבֶר
  choice: പുരുഷന്റേതായ സാമഗ്രി
  rationale: כְלִי എന്ന പദം വസ്ത്രത്തെക്കാൾ വിശാലമായി വസ്തു, ഉപകരണം, സജ്ജീകരണം എന്നിവയെ സൂചിപ്പിക്കാം. രണ്ടാം ഉപവാക്യത്തിലെ שִׂמְלָה എന്ന നിർദിഷ്ട വസ്ത്രപദത്തിൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്താൻ ‘സാമഗ്രി’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: עַל אִשָּׁה
  choice: സ്ത്രീ ധരിക്കരുത്
  rationale: അക്ഷരാർഥത്തിൽ ‘സ്ത്രീയുടെമേൽ ഉണ്ടായിരിക്കരുത്’ എന്നാണെങ്കിലും, വസ്ത്രമോ സാമഗ്രിയോ ഒരാളുടെമേൽ ഉണ്ടാകുക എന്ന പ്രയോഗം ധരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. സ്വാഭാവികമായ മലയാളത്തിനായി ‘ധരിക്കരുത്’ എന്നു നൽകി.
- source_word: יִלְבַּשׁ
  choice: ധരിക്കരുത്
  rationale: വസ്ത്രം അണിയുക അഥവാ ധരിക്കുക എന്ന അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: שִׂמְלַת אִשָּׁה
  choice: സ്ത്രീയുടെ വസ്ത്രം
  rationale: שִׂמְלָה സാധാരണയായി വസ്ത്രമോ പുറംവസ്ത്രമോ സൂചിപ്പിക്കുന്നു; പ്രത്യേക ഇനം വസ്ത്രമെന്നു ചുരുക്കാതെ ‘വസ്ത്രം’ എന്നു നൽകി.
- source_word: גֶּבֶר / אִשָּׁה
  choice: പുരുഷൻ / സ്ത്രീ
  rationale: എബ്രായത്തിലെ വ്യക്തമായ ലിംഗവ്യത്യാസം ആധുനികവും സാധാരണവുമായ മലയാളപദങ്ങളിലൂടെ നിലനിർത്തുന്നു.
- source_word: תוֹעֲבַת יְהוָה
  choice: യഹോവയ്ക്ക് അറപ്പാണ്
  rationale: תוֹעֵבָה ദൈവസന്നിധിയിൽ അത്യന്തം വെറുപ്പുളവാക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ശക്തമായ ഉടമ്പടിപദമാണ്. ‘അറപ്പ്’ അതിന്റെ തീവ്രത സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: כָּל עֹשֵׂה אֵלֶּה
  choice: ഇവ ചെയ്യുന്ന ഏവനും
  rationale: പങ്കാളിക്രിയയോടുകൂടിയ כָּל എന്ന പൊതുവ്യാപക പ്രയോഗത്തിന്റെ വിതരണാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ആദ്യ നിരോധനത്തിന്റെ വ്യാപ്തി (כְלִי גֶבֶר)
  choice: വസ്ത്രത്തിലേക്ക് മാത്രം ചുരുക്കാതെ ‘പുരുഷന്റേതായ സാമഗ്രി’ എന്നു വിശാലമായി നൽകി.
  alternative: ‘പുരുഷന്റെ വസ്ത്രം’ അല്ലെങ്കിൽ ‘പുരുഷന്റെ ആയുധം/സജ്ജീകരണം’
  rationale: ആദ്യ ഉപവാക്യത്തിൽ വിശാലാർഥമുള്ള כְלִי എന്നും രണ്ടാമത്തേതിൽ വസ്ത്രത്തിനുള്ള നിർദിഷ്ടപദമായ שִׂמְלָה എന്നും വരുന്നു. അതിനാൽ ഇത് വസ്ത്രം മാത്രമാണോ മറ്റു പുരുഷബന്ധിത ഉപകരണങ്ങളും ഉൾപ്പെടുന്നുവോ എന്ന അവ്യക്തത പരിഭാഷയിൽ നിർബന്ധമായി തീർപ്പാക്കിയിട്ടില്ല.
- issue: ലിംഗസൂചക ഭാഷ
  choice: ‘സ്ത്രീ’, ‘പുരുഷൻ’ എന്നീ പദങ്ങൾ നിലനിർത്തി.
  alternative: ലിംഗനിരപേക്ഷമായ ‘വ്യക്തി’ തുടങ്ങിയ പദങ്ങൾ
  rationale: മൂലപാഠം സ്ത്രീയെയും പുരുഷനെയും വ്യക്തമായി വിപരീതമായി നിരത്തുന്നതിനാൽ ആ വ്യത്യാസം പരിഭാഷയിലും സംരക്ഷിച്ചു.
- issue: תוֹעֵבָה വ്യക്തിയെയോ പ്രവൃത്തിയെയോ വിശേഷിപ്പിക്കുന്ന വിധം
  choice: ‘ഇവ ചെയ്യുന്ന ഏവനും ... അറപ്പാണ്’ എന്ന മൂലപാഠത്തിന്റെ വ്യാകരണബന്ധം നിലനിർത്തി.
  alternative: ‘ഈ പ്രവൃത്തി യഹോവയ്ക്ക് അറപ്പാണ്’
  rationale: എബ്രായത്തിൽ ‘ഇവ ചെയ്യുന്ന ഏവനും’ എന്ന കർത്താവിനോടാണ് ‘യഹോവയ്ക്ക് അറപ്പ്’ നേരിട്ട് ബന്ധിപ്പിച്ചിരിക്കുന്നത്; അതിനെ പ്രവൃത്തിയിലേക്കു മാത്രം മാറ്റിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘സാമഗ്രി’ എന്നത് അല്പം വിശാലമായ പദമാണെങ്കിലും മൂലത്തിലെ യഥാർഥ ലെക്സിക്കൽ അവ്യക്തതയും രണ്ട് ഉപവാക്യങ്ങളിലെ പദവ്യത്യാസവും സംരക്ഷിക്കുന്നു. ദൈവനാമം יהוה ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
