revisions:
- from: എന്നാൽ ആ യുവതിയോട് ഒന്നും ചെയ്യരുത്; മരണശിക്ഷയ്ക്ക് അർഹമായ പാപം ആ യുവതി ചെയ്തിട്ടില്ല. ഒരാൾ തന്റെ കൂട്ടുകാരനെ ആക്രമിച്ച് കൊലപ്പെടുത്തുന്നതുപോലെയാണ് ഈ സംഭവം.[a]
  to: എന്നാൽ ആ യുവതിയോട് ഒന്നും ചെയ്യരുത്; മരണശിക്ഷ അർഹിക്കുന്ന കുറ്റം യുവതിക്കില്ല. കാരണം, ഒരുവൻ തന്റെ കൂട്ടുകാരനെതിരെ എഴുന്നേറ്റ് അവനെ കൊലപ്പെടുത്തുന്നതുപോലെതന്നെയാണ് ഈ കാര്യവും.
