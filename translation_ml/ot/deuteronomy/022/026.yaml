source:
  edition: WLC
  text: ו/ל/נער לֹא תַעֲשֶׂ֣ה דָבָ֔ר אֵ֥ין ל/נער חֵ֣טְא מָ֑וֶת כִּ֡י כַּ/אֲשֶׁר֩ יָק֨וּם אִ֤ישׁ עַל רֵעֵ֨/הוּ֙ וּ/רְצָח֣/וֹ נֶ֔פֶשׁ כֵּ֖ן הַ/דָּבָ֥ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/026.yaml
  text: But to the young woman you shall do nothing[a]; the young woman has committed no sin deserving death[b]. For this case is like when a man rises against his neighbor and murders him.
translation:
  language: ml
  text: എന്നാൽ ആ യുവതിയോട് ഒന്നും ചെയ്യരുത്; മരണശിക്ഷ അർഹിക്കുന്ന കുറ്റം യുവതിക്കില്ല. കാരണം, ഒരുവൻ തന്റെ കൂട്ടുകാരനെതിരെ എഴുന്നേറ്റ് അവനെ കൊലപ്പെടുത്തുന്നതുപോലെതന്നെയാണ് ഈ കാര്യവും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלַנַּעַר
  choice: എന്നാൽ ആ യുവതിയോട്
  rationale: മുൻവാക്യത്തിൽ പുരുഷനു വിധിച്ച ശിക്ഷയോടുള്ള വൈരുധ്യം וְ സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ എന്നു നൽകി. നിയമസന്ദർഭത്തിലെ נַעַר ഇവിടെ മുമ്പ് പറഞ്ഞ യുവതിയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: לֹא תַעֲשֶׂה דָבָר
  choice: ഒന്നും ചെയ്യരുത്
  rationale: അവൾക്കെതിരെ യാതൊരു ശിക്ഷാനടപടിയും എടുക്കരുതെന്ന സമ്പൂർണ നിയമവിലക്ക് സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֵין לַנַּעַר חֵטְא מָוֶת
  choice: മരണശിക്ഷയ്ക്ക് അർഹമായ പാപം ആ യുവതി ചെയ്തിട്ടില്ല
  rationale: അക്ഷരാർഥത്തിൽ ‘യുവതിക്ക് മരണത്തിന്റെ പാപമില്ല’ എന്ന നിയമപ്രയോഗം, മരണശിക്ഷ അർഹിക്കുന്ന കുറ്റബാധ്യത അവൾക്കില്ലെന്ന് വ്യക്തമാക്കുന്നു; അതേസമയം חֵטְא എന്ന പദത്തിന്റെ ‘പാപം’ എന്ന അർഥവും സൂക്ഷിക്കുന്നു.
- source_word: כַּאֲשֶׁר יָקוּם אִישׁ עַל רֵעֵהוּ
  choice: ഒരാൾ തന്റെ കൂട്ടുകാരനെ ആക്രമിച്ച്
  rationale: ‘എതിരായി എഴുന്നേൽക്കുക’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ഇവിടെ ഉദ്ദേശിക്കുന്ന അക്രമാക്രമണാർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: וּרְצָחוֹ נֶפֶשׁ
  choice: കൊലപ്പെടുത്തുന്നതുപോലെ
  rationale: רצח നിയമവിരുദ്ധമായ കൊലയെ സൂചിപ്പിക്കുന്നു. ക്രിയയിലെ പ്രത്യയം ഇരയായ കൂട്ടുകാരനെ സൂചിപ്പിക്കുന്നതിനാൽ അത് മുൻവാക്യഘടകത്തോടു ചേർത്തു.
- source_word: כֵּן הַדָּבָר הַזֶּה
  choice: ഈ സംഭവം ... പോലെയാണ്
  rationale: നിയമപരമായ ഈ കേസിനും ആക്രമിച്ചുള്ള കൊലയ്ക്കുമിടയിലെ താരതമ്യം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: യുവതിയുടെ നിരപരാധിത്വത്തിന്റെ വ്യാപ്തി
  choice: ഈ കേസിൽ മരണശിക്ഷയ്ക്ക് അർഹമായ പാപം അവൾ ചെയ്തിട്ടില്ലെന്ന് നിയമപരമായി പ്രസ്താവിക്കുന്നു.
  alternative: എല്ലാ അർഥത്തിലും അവൾ സമ്പൂർണ ധാർമിക നിരപരാധിയാണെന്ന് പ്രസ്താവിക്കുന്നു.
  rationale: חֵטְא מָוֶת എന്ന പ്രയോഗം ഈ നിയമവിധിയിലെ മരണശിക്ഷാർഹമായ കുറ്റബാധ്യതയിലാണ് ശ്രദ്ധ കേന്ദ്രീകരിക്കുന്നത്; വാക്യം പറയുന്നതിലപ്പുറം വിശാലമായ ധാർമിക അവകാശവാദം പരിഭാഷയിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ‘യുവതി’, ‘മരണശിക്ഷയ്ക്ക് അർഹമായ പാപം’, ‘ആക്രമിച്ച് കൊലപ്പെടുത്തുക’ എന്നീ പ്രയോഗങ്ങൾ മൂലപാഠത്തിന്റെ നിയമപരമായ ഊന്നൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
