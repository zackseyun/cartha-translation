source:
  edition: WLC
  text: וְ/הוֹצֵאתֶ֨ם אֶת שְׁנֵי/הֶ֜ם אֶל שַׁ֣עַר הָ/עִ֣יר הַ/הִ֗וא וּ/סְקַלְתֶּ֨ם אֹתָ֥/ם בָּ/אֲבָנִים֮ וָ/מֵתוּ֒ אֶת ה/נער עַל דְּבַר֙ אֲשֶׁ֣ר לֹא צָעֲקָ֣ה בָ/עִ֔יר וְ/אֶ֨ת הָ/אִ֔ישׁ עַל דְּבַ֥ר אֲשֶׁר עִנָּ֖ה אֶת אֵ֣שֶׁת רֵעֵ֑/הוּ וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ־־׀־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/024.yaml
  text: 'then you shall bring both of them out to the gate of that city[a], and you shall stone them with stones, and they shall die: the young woman because she did not cry out in the city, and the man because he violated his neighbor’s wife[c][b]. So you shall purge the evil from your midst.'
translation:
  language: ml
  text: 'അപ്പോൾ നിങ്ങൾ ആ രണ്ടുപേരെയും ആ പട്ടണത്തിന്റെ കവാടത്തിലേക്ക്[a] കൊണ്ടുവന്ന് കല്ലുകൾ എറിഞ്ഞ് കൊല്ലണം: പട്ടണത്തിൽ നിലവിളിക്കാതിരുന്നതിനാൽ യുവതിയെയും, തന്റെ അയൽക്കാരന്റെ ഭാര്യയെ ലൈംഗികമായി ലംഘിച്ചതിനാൽ[b] പുരുഷനെയും. ഇങ്ങനെ നിന്റെ ഇടയിൽനിന്ന് തിന്മ നീക്കിക്കളയണം.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പുരാതന ഇസ്രായേലിൽ പട്ടണകവാടം പൊതുവായ നിയമനടപടികളും ന്യായവിധിയും നടന്നിരുന്ന പതിവുസ്ഥലമായിരുന്നു.
    reason: cultural_note
  - marker: b
    text: എബ്രായ ക്രിയയ്ക്ക് ഈ സന്ദർഭത്തിൽ ലൈംഗികമായി ലംഘിക്കുക, അപമാനിക്കുക എന്നീ അർഥങ്ങളുണ്ട്; ‘ലൈംഗികമായി പീഡിപ്പിച്ചു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצֵאתֶם
  choice: കൊണ്ടുവന്ന്
  rationale: יצא എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം അവരെ പുറത്തേക്കു കൊണ്ടുവരുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സന്ദർഭാനുസൃതമായി സ്വാഭാവികമായ പ്രയോഗം.
- source_word: שְׁנֵיהֶם
  choice: ആ രണ്ടുപേരെയും
  rationale: സംഭവത്തിൽ ഉൾപ്പെട്ട ഇരുവരെയും വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: שַׁעַר הָעִיר הַהִוא
  choice: ആ പട്ടണത്തിന്റെ കവാടത്തിങ്കൽ
  rationale: പുരാതന പട്ടണങ്ങളിൽ ന്യായവിധിയും പൊതുകാര്യങ്ങളും നടന്നിരുന്ന കവാടത്തെ മൂലപാഠത്തോട് ചേർന്ന് അവതരിപ്പിക്കുന്നു.
- source_word: וּסְקַלְתֶּם אֹתָם בָּאֲבָנִים וָמֵתוּ
  choice: കല്ലെറിഞ്ഞു കൊല്ലണം
  rationale: കല്ലെറിയലും അതിന്റെ മരണഫലവും മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി സംയോജിപ്പിക്കുന്നു.
- source_word: הנער
  choice: യുവതി
  rationale: വ്യഞ്ജനപാഠത്തിലെ രൂപം അപൂർണ സ്ത്രീലിംഗലിപിയാണെങ്കിലും തുടർന്നുള്ള צָעֲקָה സ്ത്രീലിംഗമാണെന്ന് വ്യക്തമാക്കുന്നു; പ്രായം അനാവശ്യമായി ചുരുക്കാതെ 'യുവതി' എന്നു നൽകുന്നു.
- source_word: עַל דְּבַר אֲשֶׁר לֹא צָעֲקָה בָעִיר
  choice: പട്ടണത്തിലായിരുന്നിട്ടും നിലവിളിക്കാതിരുന്നതിനാൽ
  rationale: വിധിക്കുള്ള കാരണമായി പട്ടണത്തിൽവെച്ച് അവൾ നിലവിളിക്കാതിരുന്നതാണ് പാഠം പറയുന്നത്; നഗരസാഹചര്യത്തിന്റെ വിരുദ്ധാഭാസം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: עִנָּה
  choice: മാനഭംഗപ്പെടുത്തി
  rationale: ലൈംഗിക-നിയമസന്ദർഭത്തിലെ പീഡനവും അപമാനവും ഉൾക്കൊള്ളുന്ന പദം; 'ബലാത്സംഗം ചെയ്തു' എന്ന ആധുനിക നിയമപദത്തേക്കാൾ മൂലത്തിലെ അർത്ഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: אֵשֶׁת רֵעֵהוּ
  choice: തന്റെ അയൽക്കാരന്റെ ഭാര്യയെ
  rationale: ഹീബ്രു ബന്ധഘടനയെ സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: ഇങ്ങനെ നിന്റെ ഇടയിൽനിന്ന് തിന്മ നീക്കിക്കളയണം
  rationale: ആവർത്തിക്കുന്ന നിയമസൂത്രത്തിന്റെ ശുദ്ധീകരണബലം 'നീക്കിക്കളയണം' എന്ന പ്രയോഗത്തിൽ നിലനിർത്തുന്നു; ഏകവചന അഭിസംബോധനയും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യുവതിക്കെതിരായ വിധിയുടെ കാരണവിവരണം
  choice: പട്ടണത്തിലായിരുന്നിട്ടും നിലവിളിക്കാതിരുന്നതിനാൽ
  alternative: പട്ടണത്തിൽ സഹായത്തിനായി വിളിക്കാതിരുന്നതിനാൽ
  rationale: പാഠം പ്രസ്താവിക്കുന്ന നിയമപരമായ കാരണം അതേപടി സൂക്ഷിക്കുന്നു; സമ്മതത്തെക്കുറിച്ചോ വിശാലമായ നൈതിക നിഗമനങ്ങളെക്കുറിച്ചോ വിവർത്തനം അധികമായി വിധിക്കുന്നില്ല.
- issue: ലൈംഗിക-നിയമസന്ദർഭത്തിലെ עִנָּה
  choice: മാനഭംഗപ്പെടുത്തി
  alternative: പീഡിപ്പിച്ചു; ബലാത്സംഗം ചെയ്തു
  rationale: ക്രിയയിലെ ലൈംഗിക ലംഘനത്തിന്റെയും അപമാനത്തിന്റെയും ഗൗരവം നിലനിർത്തുന്നു; ആധുനിക നിയമവിഭാഗം മൂലപദത്തിൽക്കാൾ കൃത്യമായി അടിച്ചേൽപ്പിക്കുന്നത് ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമശൈലി. ബഹുവചന അധികാരികളോടുള്ള ‘നിങ്ങൾ’ എന്നതിൽനിന്ന് നിയമസൂത്രത്തിലെ ഏകവചന ‘നിന്റെ’ എന്ന മൂലപാഠമാറ്റം സംരക്ഷിച്ചിരിക്കുന്നു. പ്രധാനപാഠത്തിലെ എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും അനുബന്ധ കുറിപ്പുകളുമായി പൊരുത്തപ്പെടുന്നു.
