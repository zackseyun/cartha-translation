  to: ഭർത്താവുള്ള ഒരു സ്ത്രീയോടുകൂടെ ഒരു പുരുഷൻ ശയിക്കുന്നതായി കണ്ടെത്തിയാൽ[a], ഇരുവരും മരിക്കണം—ആ സ്ത്രീയോടുകൂടെ ശയിച്ച പുരുഷനും ആ സ്ത്രീയും[b]. ഇങ്ങനെ നീ തിന്മയെ ഇസ്രായേലിൽനിന്ന് നീക്കിക്കളയണം.
