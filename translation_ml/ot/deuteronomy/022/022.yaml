source:
  edition: WLC
  text: כִּֽי יִמָּצֵ֨א אִ֜ישׁ שֹׁכֵ֣ב עִם אִשָּׁ֣ה בְעֻֽלַת בַּ֗עַל וּ/מֵ֨תוּ֙ גַּם שְׁנֵי/הֶ֔ם הָ/אִ֛ישׁ הַ/שֹּׁכֵ֥ב עִם הָ/אִשָּׁ֖ה וְ/הָ/אִשָּׁ֑ה וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/יִּשְׂרָאֵֽל־׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/022.yaml
  text: If a man is found lying with a woman married to a husband[a], then both of them shall die—the man who lay with the woman, and the woman[b]. So you shall purge the evil from Israel.
translation:
  language: ml
  text: ഭർത്താവുള്ള ഒരു സ്ത്രീയോടുകൂടെ ഒരു പുരുഷൻ ശയിക്കുന്നതായി കണ്ടെത്തിയാൽ[a], ഇരുവരും മരിക്കണം—ആ സ്ത്രീയോടുകൂടെ ശയിച്ച പുരുഷനും ആ സ്ത്രീയും[b]. ഇങ്ങനെ നീ തിന്മയെ ഇസ്രായേലിൽനിന്ന് നീക്കിക്കളയണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘ഒരു ഭർത്താവുമായി വിവാഹബന്ധത്തിലുള്ള ഒരു സ്ത്രീ.’ കൂടുതൽ ലളിതമായി, ‘വിവാഹിതയായ ഒരു സ്ത്രീ.’
    reason: lexical_alternative
  - marker: b
    text: ‘മരിക്കണം’ എന്നത് ഇവിടെ നിയമം വിധിക്കുന്ന മരണശിക്ഷയെ സൂചിപ്പിക്കുന്നു; ചില വിവർത്തനങ്ങൾ ഇത് ‘വധിക്കപ്പെടണം’ എന്നു വ്യക്തമാക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: יִמָּצֵא
  choice: കണ്ടെത്തിയാൽ
  rationale: നിഫാൽ രൂപം ഇവിടെ സംഭവം വെളിപ്പെടുകയോ കണ്ടെത്തപ്പെടുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ നിയമവാക്യത്തിൽ ‘കണ്ടെത്തിയാൽ’ സ്വാഭാവികവും നേരിട്ടുള്ളതുമാണ്.
- source_word: שֹׁכֵב עִם
  choice: യോടുകൂടെ ശയിക്കുന്നതായി
  rationale: ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലി നിലനിർത്തുന്നു; അതേസമയം അമിതമായ സംസാരഭാഷയോ വിശദീകരണപരമായ പുനർവാക്യമോ ഒഴിവാക്കുന്നു.
- source_word: בְעֻלַת בַּעַל
  choice: മറ്റൊരു പുരുഷനുമായി വിവാഹബന്ധത്തിലുള്ള ഒരു സ്ത്രീ
  rationale: അക്ഷരാർഥത്തിലുള്ള ഭർത്തൃബന്ധവും വിവാഹബന്ധത്തിന്റെ ബാധ്യതയും വ്യക്തമാക്കുന്നു. ‘മറ്റൊരു’ എന്നത് ഈ നിയമവാക്യത്തിലെ പുരുഷൻ അവളുടെ ഭർത്താവല്ലെന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וּמֵתוּ גַּם שְׁנֵיהֶם
  choice: അവരിരുവരും മരിക്കണം
  rationale: നിയമപരമായ നിർദേശശക്തി ‘മരിക്കണം’ എന്നതിലൂടെ നൽകുന്നു; മൂലപാഠത്തിൽ നേരിട്ട് ഇല്ലാത്ത ‘കൊല്ലപ്പെടണം’ എന്ന കർമ്മണിപ്രയോഗം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: הָאִישׁ הַשֹּׁכֵב עִם הָאִשָּׁה וְהָאִשָּׁה
  choice: ആ സ്ത്രീയോടുകൂടെ ശയിച്ച പുരുഷനും ആ സ്ത്രീയും
  rationale: ഇരുവരെയും വീണ്ടും പ്രത്യേകം പറയുന്ന എബ്രായ നിയമവാക്യത്തിന്റെ വ്യക്തതയും ഊന്നലും നിലനിർത്തുന്നു.
- source_word: וּבִעַרְתָּ הָרָע
  choice: ഇങ്ങനെ നീ ... തിന്മ നീക്കിക്കളയണം
  rationale: ആവർത്തിക്കുന്ന ആവർത്തനപുസ്തക നിയമസൂത്രത്തിലെ ദുഷ്ടതയെ സമൂഹത്തിൽനിന്ന് പൂർണമായി നീക്കുക എന്ന ശക്തി ‘നീക്കിക്കളയണം’ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מִיִּשְׂרָאֵל
  choice: ഇസ്രായേലിൽനിന്ന്
  rationale: ഉടമ്പടി സമൂഹത്തിൽനിന്നുള്ള നീക്കം എന്ന ആശയം ചുരുക്കമായും മൂലപാഠത്തോട് ചേർന്നും നൽകുന്നു.
theological_decisions:
- issue: בְעֻלַת בַּעַל എന്ന വിവാഹസ്ഥിതി സൂചിപ്പിക്കുന്ന പ്രയോഗം
  choice: മറ്റൊരു പുരുഷനുമായി വിവാഹബന്ധത്തിലുള്ള ഒരു സ്ത്രീ
  alternative: വിവാഹിതയായ ഒരു സ്ത്രീ
  rationale: മൂലപാഠം ഭർത്താവുമായുള്ള നിലവിലുള്ള വിവാഹബന്ധത്തെ പ്രത്യേകം മുന്നോട്ടുവയ്ക്കുന്നു. മുഖ്യവിവർത്തനം ആ ബന്ധം ദൃശ്യമാക്കുന്നു; ഉടമസ്ഥതയുടെ ധ്വനി അനാവശ്യമായി ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: നിയമശിക്ഷയെ വധശിക്ഷയായി വിശദമാക്കണമോ എന്നത്
  choice: മരിക്കണം
  alternative: കൊല്ലപ്പെടണം / വധിക്കപ്പെടണം
  rationale: നിയമസന്ദർഭം വധശിക്ഷയെ സൂചിപ്പിച്ചാലും എബ്രായവാചകം നേരിട്ട് ‘മരിക്കണം’ എന്നാണ് പറയുന്നത്. അതിനാൽ മുഖ്യപാഠം ആ രൂപം നിലനിർത്തുകയും അടിക്കുറിപ്പ് നിയമപരമായ അർഥം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിലെ ഗൗരവമുള്ള നിയമശൈലി സ്വീകരിച്ചു. ‘ശയിക്കുക’ എന്നത് എബ്രായ ലൈംഗികപ്രയോഗത്തിന്റെ മിതത്വവും ഔപചാരികതയും നിലനിർത്തുന്നു. ആവർത്തനം നിയമപരമായ വ്യക്തതയ്ക്കായി സംരക്ഷിച്ചു; മുഖ്യപാഠത്തിലെ രണ്ട് അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും അനുബന്ധ അടിക്കുറിപ്പുകളുമായി പൊരുത്തപ്പെടുന്നു.
