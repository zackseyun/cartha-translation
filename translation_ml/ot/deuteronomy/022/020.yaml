id: DEU.22.20
reference: Deuteronomy 22:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִם אֱמֶ֣ת הָיָ֔ה הַ/דָּבָ֖ר הַ/זֶּ֑ה לֹא נִמְצְא֥וּ בְתוּלִ֖ים ל/נער־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/020.yaml
  text: But if this matter is true[a], and evidence of virginity was not found for the young woman,
translation:
  language: ml
  text: എന്നാൽ ഈ കാര്യം സത്യമാകുകയും ആ യുവതിക്കു കന്യകാത്വത്തിന്റെ തെളിവുകൾ കണ്ടെത്തപ്പെടാതിരിക്കുകയും ചെയ്താൽ,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: എന്നാൽ ... ആണെങ്കിൽ
  rationale: മുൻവാക്യത്തിലെ സാഹചര്യത്തോടുള്ള വൈരുധ്യം സൂചിപ്പിക്കുന്ന സംയോജനവും വ്യവസ്ഥയും സ്വാഭാവിക മലയാളത്തിൽ ഇങ്ങനെ പ്രകടമാകുന്നു.
- source_word: אֱמֶת הָיָה הַדָּבָר הַזֶּה
  choice: ഈ കാര്യം സത്യമാണെങ്കിൽ
  rationale: നിയമപരമായ ആരോപണത്തെ അതിരുകടന്ന് നിർവചിക്കാതെ הַדָּבָר הַזֶּה എന്നത് ‘ഈ കാര്യം’ എന്നും, പ്രവചനാർഥത്തിലുള്ള אֱמֶת എന്നത് ‘സത്യം’ എന്നും നൽകി.
- source_word: לֹא נִמְצְאוּ
  choice: കണ്ടെത്തിയില്ലെങ്കിൽ
  rationale: എബ്രായത്തിലെ ബഹുവചന ക്രിയ തുടർന്നുള്ള ബഹുവചനാർഥമുള്ള ‘തെളിവുകൾ’ എന്നതിനോട് യോജിക്കുന്നു; വ്യവസ്ഥാപരമായ വാക്യഘടന മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: בְּתוּלִים
  choice: കന്യകാത്വത്തിന്റെ തെളിവുകൾ
  rationale: പദത്തിന് ‘കന്യകാത്വം’ എന്നും സന്ദർഭത്തിൽ അതിന്റെ അടയാളങ്ങൾ/തെളിവുകൾ എന്നും അർഥമാകാം; പുരാതന നിയമസന്ദർഭം ആധുനിക വായനക്കാരന് വ്യക്തമാക്കാൻ ‘തെളിവുകൾ’ ഉപയോഗിച്ചു, എന്നാൽ പദത്തിന്റെ സാധ്യതാവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: לַנַּעֲרָ
  choice: ആ യുവതിക്കു
  rationale: വിവാഹപ്രായത്തിലുള്ള സ്ത്രീയെ സൂചിപ്പിക്കുന്ന נַעֲרָהയ്ക്ക് മാന്യവും സ്വാഭാവികവുമായ ‘യുവതി’ ഉപയോഗിച്ചു; ל എന്ന ബന്ധം ‘-ക്കു’ വഴി നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും നിയമസന്ദർഭത്തിന് അനുയോജ്യവുമായ ശൈലി. ഈ വാക്യം അടുത്ത വാക്യത്തിൽ പൂർത്തിയാകുന്ന വ്യവസ്ഥാവാക്യമായതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തി.
