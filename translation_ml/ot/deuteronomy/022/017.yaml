translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമവ്യവഹാരശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ തെളിവ്/അടയാളം എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും വസ്ത്രത്തിന്റെ സ്വഭാവം മുഖ്യവാചകത്തിൽ അതിയായി നിർവചിക്കാതിരിക്കുകയും ചെയ്തു.
