  text: and look[a], he has charged her with slanderous words, saying, “I did not find your daughter a virgin.” But these are the proofs of my daughter’s virginity[c][b]. And they shall spread out the garment before the elders of the city.
translation:
  language: ml
  text: “ഇതാ, ‘നിന്റെ മകളിൽ കന്യകാത്വത്തിന്റെ അടയാളങ്ങൾ ഞാൻ കണ്ടില്ല’ എന്നു പറഞ്ഞ് അവൻ അവൾക്കെതിരെ അപവാദകരമായ ആരോപണങ്ങൾ ഉന്നയിച്ചിരിക്കുന്നു. എന്നാൽ ഇവയാണ് എന്റെ മകളുടെ കന്യകാത്വത്തിന്റെ തെളിവുകൾ[a].” പിന്നെ അവർ ആ വസ്ത്രം[b] പട്ടണത്തിലെ മൂപ്പന്മാരുടെ മുമ്പിൽ വിരിക്കുകണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്റെ മകളുടെ കന്യകാത്വത്തിന്റെ അടയാളങ്ങൾ.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ ബഹുവചനം അടയാളങ്ങളെയോ തെളിവുകളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ഈ കേസിൽ നിയമപരമായ തെളിവായി ഹാജരാക്കിയ തുണിയെയാണ് ഇവിടെ “വസ്ത്രം” എന്നു വിളിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന എബ്രായ വ്യവഹാരസൂചകത്തിന്റെ പ്രകടനശക്തി സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: שָׂם עֲלִילֹת דְּבָרִים
  choice: അവൾക്കെതിരെ അപവാദകരമായ ആരോപണങ്ങൾ ഉന്നയിച്ചിരിക്കുന്നു
  rationale: ‘വാക്കുകൾ വെച്ചു’ എന്ന അക്ഷരാർഥത്തെക്കാൾ, നിയമപരമായ കുറ്റാരോപണവും അപകീർത്തികരമായ ഉള്ളടക്കവും ചേർന്ന പ്രയോഗാർഥം വ്യക്തമാക്കുന്നു; ‘അവൾക്കെതിരെ’ എന്നത് സന്ദർഭത്തിൽനിന്ന് പൂരിപ്പിച്ചതാണ്.
- source_word: לֹא מָצָאתִי לְבִתְּךָ בְּתוּלִים
  choice: നിന്റെ മകളിൽ കന്യകാത്വത്തിന്റെ അടയാളങ്ങൾ ഞാൻ കണ്ടില്ല
  rationale: എബ്രായത്തിലെ ബഹുവചനപ്രയോഗം ഈ നിയമസന്ദർഭത്തിൽ കന്യകാത്വത്തിന്റെ അടയാളങ്ങളെയോ തെളിവിനെയോ സൂചിപ്പിക്കാം; ആരോപണത്തിന്റെ അവകാശവാദം അമിതമായി വ്യാഖ്യാനിക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְאֵלֶּה בְּתוּלֵי בִתִּי
  choice: എന്നാൽ ഇവയാണ് എന്റെ മകളുടെ കന്യകാത്വത്തിന്റെ തെളിവുകൾ
  rationale: മുമ്പത്തെ ആരോപണത്തോടുള്ള സന്ദർഭപരമായ വിരോധം ‘എന്നാൽ’ വ്യക്തമാക്കുന്നു; ബഹുവചനമായ בְּתוּלִים ഇവിടെ ഹാജരാക്കുന്ന തെളിവുകളെ സൂചിപ്പിക്കുന്നതായി പരിഭാഷപ്പെടുത്തി.
- source_word: וּפָרְשׂוּ הַשִּׂמְלָה
  choice: പിന്നെ അവർ ആ വസ്ത്രം വിരിച്ചുകാണിക്കണം
  rationale: തുടർന്നുള്ള നിയമനടപടിയുടെ നിർദേശസ്വഭാവം ‘വിരിച്ചുകാണിക്കണം’ എന്നതിലൂടെ വ്യക്തമാക്കുന്നു; വസ്ത്രത്തിന്റെ കൃത്യരൂപം അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: לִפְנֵי זִקְנֵי הָעִיר
  choice: പട്ടണത്തിലെ മൂപ്പന്മാരുടെ മുമ്പിൽ
  rationale: നഗരസമൂഹത്തിലെ ന്യായാധികാരികളുടെ സന്നിധിയിൽ തെളിവ് അവതരിപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന പതിവ് ന്യായവ്യവഹാരപ്രയോഗം നിലനിർത്തുന്നു.
