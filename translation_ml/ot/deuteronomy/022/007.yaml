  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: שַׁלֵּ֤חַ תְּשַׁלַּח֙ אֶת הָ/אֵ֔ם וְ/אֶת הַ/בָּנִ֖ים תִּֽקַּֽח לָ֑/ךְ לְמַ֨עַן֙ יִ֣יטַב לָ֔/ךְ וְ/הַאֲרַכְתָּ֖ יָמִֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/007.yaml
  text: You must surely let the mother go[a], but you may take the young for yourself[c][b], so that it may go well for you and you may prolong your days.
translation:
  language: ml
  text: അമ്മയെ തീർച്ചയായും വിട്ടയയ്ക്കണം[a]; എന്നാൽ കുഞ്ഞുങ്ങളെ നിനക്കായി എടുക്കാം[b], അങ്ങനെ നിനക്കു നന്മ വരികയും നീ ദീർഘകാലം ജീവിക്കുകയും ചെയ്യും[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായയിൽ, ‘അമ്മയെ വിട്ടയച്ചുതന്നെ വിടണം’; ഒരേ ക്രിയയുടെ രണ്ട് രൂപങ്ങൾ ചേർന്ന പ്രയോഗം കല്പനയ്ക്ക് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായയിൽ അക്ഷരാർഥം ‘മക്കൾ’ അല്ലെങ്കിൽ ‘പുത്രന്മാർ’; പക്ഷിക്കൂടിന്റെ പശ്ചാത്തലത്തിൽ ഇത് കുഞ്ഞുങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: എബ്രായയിൽ കൂടുതൽ അക്ഷരാർഥമായി, ‘നീ നാളുകളെ ദീർഘമാക്കും’; ഇത് ദീർഘകാലം ജീവിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁלֵּחַ תְּשַׁלַּח
  choice: വിട്ടയയ്ക്കുകതന്നെ വേണം
  rationale: ക്രിയയുടെ infinitive absolute-ഉം finite രൂപവും ചേർന്നുള്ള എബ്രായ പ്രയോഗം കല്പനയ്ക്ക് ശക്തമായ ഊന്നൽ നൽകുന്നു. ‘-തന്നെ വേണം’ ആ നിർബന്ധവും ഊന്നലും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הָאֵם
  choice: അമ്മപ്പക്ഷി
  rationale: പദത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘അമ്മ’ എന്നാണ്; മുൻവാക്യത്തിലെ പക്ഷിക്കൂടിന്റെ പശ്ചാത്തലം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി സൂചിപ്പിക്കാൻ ‘പ്പക്ഷി’ ചേർത്തിരിക്കുന്നു.
- source_word: הַבָּנִים
  choice: കുഞ്ഞുങ്ങൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘മക്കൾ/പുത്രന്മാർ’ എന്നാണെങ്കിലും പക്ഷിക്കൂടിന്റെ പശ്ചാത്തലത്തിൽ സന്തതികളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘കുഞ്ഞുങ്ങൾ’ സ്വാഭാവികവും അമിതമായി പരിമിതപ്പെടുത്താത്തതുമാണ്.
- source_word: תִּקַּח לָךְ
  choice: നിനക്കായി എടുത്തുകൊള്ളാം
  rationale: അമ്മപ്പക്ഷിയെ വിട്ടയയ്ക്കണമെന്ന കല്പനയ്ക്കുശേഷം കുഞ്ഞുങ്ങളെ എടുക്കാനുള്ള അനുവാദമാണ് സന്ദർഭത്തിൽ പ്രകടമാകുന്നത്. ‘നിനക്കായി’ לָךְ എന്ന ഘടകത്തെ നിലനിർത്തുന്നു.
- source_word: לְמַעַן יִיטַב לָךְ
  choice: അങ്ങനെ നിനക്കു നന്മ വരുകയും
  rationale: ഉദ്ദേശ്യം/ഫലം സൂചിപ്പിക്കുന്ന ഉടമ്പടിപരമായ അനുഗ്രഹപ്രയോഗത്തെ ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וְהַאֲרַכְתָּ יָמִים
  choice: നിന്റെ ആയുസ്സ് ദീർഘമാകുകയും ചെയ്യും
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘നാളുകൾ ദീർഘമാക്കുക’ എന്ന എബ്രായ ശൈലിയുടെ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; മൂലരൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: വാഗ്ദത്ത ഫലത്തിന്റെ സ്വഭാവം
  choice: അനുസരണത്തോടു ബന്ധിപ്പിച്ച അനുഗ്രഹം/ഫലം എന്ന നിലയിൽ ‘നിനക്കു നന്മ വരുകയും നിന്റെ ആയുസ്സ് ദീർഘമാകുകയും ചെയ്യും’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ഓരോ വ്യക്തിക്കും എല്ലാ സാഹചര്യങ്ങളിലും ദീർഘായുസ്സ് ലഭിക്കുമെന്ന യാന്ത്രികവും ഉപാധിയില്ലാത്തതുമായ ഉറപ്പ്.
  rationale: לְמַעַן എന്ന ഉദ്ദേശ്യ/ഫലസൂചക പ്രയോഗത്തോടു ചേർന്ന അനുഗ്രഹവാക്യം അതിന്റെ ശക്തിയോടെ നിലനിർത്തുന്നു; എന്നാൽ മൂലപാഠം പറയുന്നതിലപ്പുറം ഒരു ലളിതമായ യാന്ത്രിക ഉറപ്പ് പരിഭാഷയിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ഏകവചന രണ്ടാംപുരുഷരൂപം (‘നിനക്കു’) എബ്രായ വ്യാകരണത്തോട് ഒത്തിരിക്കുന്നു. നിർബന്ധം, അനുവാദം, അനുഗ്രഹഫലം എന്നീ മൂന്നു ഘടകങ്ങളും വ്യക്തമായി വേർതിരിച്ചിരിക്കുന്നു.
