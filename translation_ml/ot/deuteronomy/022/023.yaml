id: DEU.22.23
reference: Deuteronomy 22:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֤י יִהְיֶה֙ נער בְתוּלָ֔ה מְאֹרָשָׂ֖ה לְ/אִ֑ישׁ וּ/מְצָאָ֥/הּ אִ֛ישׁ בָּ/עִ֖יר וְ/שָׁכַ֥ב עִמָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/023.yaml
  text: If there is a young woman[a], a virgin, pledged to a man, and another man finds her in the city and lies with her,
translation:
  language: ml
  text: കന്യകയായ ഒരു യുവതി ഒരു പുരുഷനുമായി വിവാഹനിശ്ചയം കഴിഞ്ഞവളായിരിക്കെ[a], നഗരത്തിൽവെച്ച് മറ്റൊരു പുരുഷൻ അവളെ കണ്ടുമുട്ടി അവളോടുകൂടെ ശയിച്ചാൽ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടത്തെ ‘വിവാഹനിശ്ചയം’ ഔപചാരികവും നിയമപരമായി ബന്ധനമുള്ളതുമായ വിവാഹനിശ്ചയത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִהְיֶה
  choice: …ആയിരിക്കെ … ചെയ്താൽ
  rationale: സാങ്കൽപ്പികമായ ഒരു നിയമസാഹചര്യം അവതരിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ വ്യവസ്ഥാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: נַעֲרָ
  choice: യുവതി
  rationale: വിവാഹപ്രായത്തിലുള്ള സ്ത്രീയെ സൂചിപ്പിക്കുന്നതിനാൽ, പ്രായം അനാവശ്യമായി കുറച്ചുകാണിക്കാത്ത ആധുനികവും മാന്യവുമായ പദം തിരഞ്ഞെടുത്തു.
- source_word: בְתוּלָה
  choice: കന്യകയായ
  rationale: മൂലപദം കന്യകാത്വം വ്യക്തമായി സൂചിപ്പിക്കുന്നു; നിയമസന്ദർഭത്തിലെ അതിന്റെ പ്രസക്തി നിലനിർത്തുന്നു.
- source_word: מְאֹרָשָׂה לְאִישׁ
  choice: ഒരു പുരുഷനുമായി വിവാഹനിശ്ചയം കഴിഞ്ഞവൾ
  rationale: ഇത് ആധുനികകാലത്തെ അനൗപചാരിക വിവാഹവാഗ്ദാനത്തേക്കാൾ നിയമപരമായി ബന്ധനമുള്ള നിശ്ചയത്തെ സൂചിപ്പിക്കുന്നു; മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായ പ്രയോഗവും അടിക്കുറിപ്പിൽ അതിന്റെ ശക്തിയും വ്യക്തമാക്കുന്നു.
- source_word: וּמְצָאָהּ אִישׁ
  choice: മറ്റൊരു പുരുഷൻ അവളെ കണ്ടുമുട്ടി
  rationale: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘ഒരു പുരുഷൻ’ എന്നാണെങ്കിലും, നേരത്തേ പറഞ്ഞ പുരുഷനിൽനിന്ന് ഇയാളെ വേർതിരിച്ചറിയാൻ സന്ദർഭാനുസൃതമായി ‘മറ്റൊരു’ ചേർത്തു. מָצָא എന്നത് ഇവിടെ സംഭവിച്ചുകാണുക/കണ്ടുമുട്ടുക എന്ന വിശാലാർഥത്തിൽ എടുത്തു.
- source_word: בָּעִיר
  choice: നഗരത്തിൽവെച്ച്
  rationale: തുടർന്നുള്ള നിയമവിധിക്ക് സ്ഥലം പ്രസക്തമായതിനാൽ അതു വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וְשָׁכַב עִמָּהּ
  choice: അവളോടുകൂടെ ശയിച്ചാൽ
  rationale: ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന മൂലത്തിലെ പരോക്ഷവും നിയമപരവുമായ ശൈലി നിലനിർത്തുന്നു; കൂടുതൽ തുറന്ന പരാവർത്തനം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: ഈ വാക്യത്തിലെ ലൈംഗികബന്ധം ബലപ്രയോഗമാണെന്ന് വിവർത്തനത്തിൽ വ്യക്തമാക്കണമോ
  choice: ‘അവളോടുകൂടെ ശയിച്ചാൽ’ എന്ന് നിഷ്പക്ഷമായി വിവർത്തനം ചെയ്തു
  alternative: ‘അവളെ ബലാത്സംഗം ചെയ്താൽ’ / ‘അവളെ ബലമായി കീഴ്പ്പെടുത്തിയാൽ’
  rationale: ഈ വാക്യത്തിലെ ക്രിയാപദം മാത്രം ബലപ്രയോഗം വ്യക്തമാക്കുന്നില്ല. ചുറ്റുപാടുള്ള നിയമവാക്യങ്ങളിലെ സ്ഥലവും പ്രതികരണവും സംബന്ധിച്ച വ്യത്യാസം മുൻകൂട്ടി തീർപ്പാക്കാതെ, മൂലപാഠത്തിന്റെ അസ്പഷ്ടത നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. നിയമസാഹചര്യത്തിന്റെ വ്യവസ്ഥാർഥവും മൂലത്തിലെ പരോക്ഷ ലൈംഗികപ്രയോഗവും സംരക്ഷിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം അത് വിശദീകരിക്കുന്ന ‘വിവാഹനിശ്ചയം’ എന്ന പ്രയോഗത്തിനരികെ ചേർത്തു.
