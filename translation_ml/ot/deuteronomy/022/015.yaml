  yaml_path: translation/ot/deuteronomy/022/015.yaml
  text: then the young woman’s father and her mother shall take and bring out the evidence of the young woman’s virginity to the elders of the city at the gate[a].
translation:
  language: ml
  text: അപ്പോൾ ആ യുവതിയുടെ അപ്പനും അമ്മയും അവളുടെ കന്യകാത്വത്തിന്റെ തെളിവ് എടുത്ത് നഗരവാതിൽക്കൽ നഗരത്തിലെ മൂപ്പന്മാരുടെ മുമ്പാകെ ഹാജരാക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘യുവതിയുടെ കന്യകാത്വങ്ങൾ’; യുവതിയുടെ കന്യകാത്വം തെളിയിക്കാൻ ഹാജരാക്കുന്ന അടയാളങ്ങളെയോ തെളിവുകളെയോ സൂചിപ്പിക്കുന്ന ഒരു പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: എടുത്ത്
  rationale: നിയമനടപടികളുടെ തുടർച്ചയിൽ ഈ ക്രിയയ്ക്ക് നിർദേശാത്മകമായ ഭാവിയർഥമുണ്ട്; തുടർന്നുള്ള ‘കൊണ്ടുവരണം’ എന്ന ക്രിയയോടു ചേർത്ത് മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: אֲבִי הַנַּעַר וְאִמָּהּ
  choice: ആ യുവതിയുടെ അപ്പനും അമ്മയും
  rationale: נַעֲרָה വിവാഹപ്രായത്തിലുള്ള യുവതിയെ സൂചിപ്പിക്കുന്നു. ‘യുവതി’ ആധുനികവും സ്വാഭാവികവുമാണ്; ‘പെൺകുട്ടി’ എന്നതിലെ ബാല്യസൂചനയും ‘കന്യക’ എന്ന മുൻകൂർ വ്യാഖ്യാനവും ഒഴിവാക്കുന്നു.
- source_word: וְהוֹצִיאוּ
  choice: കൊണ്ടുവരണം
  rationale: יצא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ പുറത്തുകൊണ്ടുവന്ന് അധികാരികളുടെ മുമ്പിൽ ഹാജരാക്കുക എന്ന അർഥത്തിലാണ്; ലക്ഷ്യസ്ഥാനത്തോടു ചേർന്ന് ‘കൊണ്ടുവരണം’ സ്വാഭാവികമായ നടപടിഭാഷ നൽകുന്നു.
- source_word: אֶת בְּתוּלֵי הַנַּעַר
  choice: അവളുടെ കന്യകാത്വത്തിന്റെ തെളിവ്
  rationale: അക്ഷരാർഥത്തിൽ ബഹുവചനമായ ‘യുവതിയുടെ കന്യകാത്വങ്ങൾ’ എന്നത് ഈ നിയമസന്ദർഭത്തിൽ കന്യകാത്വം തെളിയിക്കാൻ ഹാജരാക്കുന്ന അടയാളങ്ങളെയോ തെളിവിനെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. ‘തെളിവ്’ ആ അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: אֶל זִקְנֵי הָעִיר
  choice: നഗരത്തിലെ മൂപ്പന്മാരുടെ അടുക്കൽ
  rationale: אֶל ദിശയെയോ ലക്ഷ്യത്തെയോ സൂചിപ്പിക്കുന്നു; ഇവിടെ നീതിന്യായ ചുമതലയുള്ള നഗരമൂപ്പന്മാരുടെ മുമ്പിലേക്കുള്ള ഹാജരാക്കലാണ് ഉദ്ദേശ്യം.
- source_word: הַשַּׁעְרָה
  choice: നഗരവാതിൽക്കൽ
  rationale: ദിശാസൂചകമായ അവസാനപ്രത്യയം അക്ഷരാർഥത്തിൽ ‘വാതിലിലേക്കു’ എന്നു വരാമെങ്കിലും, മൂപ്പന്മാർ ന്യായവിധിക്കായി കൂടുന്ന സ്ഥലത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘നഗരവാതിൽക്കൽ’ പ്രസക്തിയും സ്വാഭാവികതയും നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. നിയമപരമായ നിർദേശഭാവം ‘കൊണ്ടുവരണം’ എന്നതിലൂടെ നിലനിർത്തി; മൂലത്തിലെ ശാരീരിക തെളിവിനെക്കുറിച്ചുള്ള പരോക്ഷപ്രയോഗം വിശദീകരിക്കുന്ന അടിക്കുറിപ്പ് ചേർത്തു.
