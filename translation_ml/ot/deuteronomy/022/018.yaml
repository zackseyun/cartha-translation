  text: וְ/לָֽקְח֛וּ זִקְנֵ֥י הָֽ/עִיר הַ/הִ֖וא אֶת הָ/אִ֑ישׁ וְ/יִסְּר֖וּ אֹתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/018.yaml
  text: Then the elders of that city shall take the man and discipline him,[a]
translation:
  language: ml
  text: അപ്പോൾ ആ പട്ടണത്തിലെ മൂപ്പന്മാർ ആ മനുഷ്യനെ കൂട്ടിക്കൊണ്ടുപോയി ശാസിക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അച്ചടക്കപ്പെടുത്തണം,’ ‘ശിക്ഷിക്കണം,’ അല്ലെങ്കിൽ ഒരുപക്ഷേ ‘ചാട്ടവാറുകൊണ്ട് അടിക്കണം’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ ക്രിയ ശിക്ഷണപരമായ തിരുത്തലിനെ വിശാലമായി സൂചിപ്പിക്കുന്നു; ഈ ക്രിയ മാത്രം ശിക്ഷയുടെ കൃത്യമായ രൂപം വ്യക്തമാക്കുന്നില്ല. ചുറ്റുമുള്ള നിയമസന്ദർഭത്തിൽനിന്നാണ് അത് മനസ്സിലാക്കേണ്ടത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: പിടിച്ചു
  rationale: לקח എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘എടുക്കുക’ എന്നാണെങ്കിലും, ഈ നിയമനടപടിയുടെ പശ്ചാത്തലത്തിൽ അധികാരികൾ ഒരാളെ കസ്റ്റഡിയിലെടുക്കുന്നതിനെ സ്വാഭാവികമായി സൂചിപ്പിക്കാൻ ‘പിടിച്ചു’ യോജിക്കുന്നു; ‘ബലമായി പിടികൂടുക’ എന്ന അധികവിവരം ചേർക്കുന്നില്ല.
- source_word: זִקְנֵי
  choice: മൂപ്പന്മാർ
  rationale: ഇവിടെ זקנים പ്രായമേറിയ പുരുഷന്മാരെ മാത്രമല്ല, പട്ടണത്തിലെ അംഗീകൃത സാമൂഹിക-ന്യായാധികാരികളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘മൂപ്പന്മാർ’ ഈ സ്ഥാപനപരമായ പങ്ക് നിലനിർത്തുന്നു.
- source_word: הָעִיר הַהִוא
  choice: ആ പട്ടണത്തിലെ
  rationale: עיר പ്രാദേശിക വാസകേന്ദ്രത്തെയും അതിന്റെ അധികാരപരിധിയെയും സൂചിപ്പിക്കുന്നു. ‘ആ പട്ടണം’ എന്നത് നിർദ്ദേശകത്തിന്റെ വ്യക്തതയും നിയമപരമായ പ്രാദേശിക പശ്ചാത്തലവും നിലനിർത്തുന്നു.
- source_word: הָאִישׁ
  choice: ആ മനുഷ്യനെ
  rationale: איש എന്നതിന്റെ നേരിട്ടുള്ള അർഥം ‘മനുഷ്യൻ/പുരുഷൻ’ എന്നാണ്. മുൻസന്ദർഭത്തിൽ ഭർത്താവിനെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിലും, ഇവിടെ എബ്രായപദം ‘ഭർത്താവ്’ എന്ന് വ്യക്തമാക്കാത്തതിനാൽ ‘ആ മനുഷ്യനെ’ എന്നു നൽകി സന്ദർഭപരമായ നിർദ്ദേശം നിലനിർത്തുന്നു.
- source_word: וְיִסְּרוּ אֹתוֹ
  choice: ശിക്ഷിക്കണം
  rationale: יסר ശിക്ഷണപരമായ തിരുത്തൽ, ശാസനം, ശിക്ഷ എന്നിവ ഉൾക്കൊള്ളുന്ന വിശാലമായ പദമാണ്. ആധുനിക മലയാളത്തിൽ നിയമപരമായ നടപടിയെ സ്വാഭാവികമായി അറിയിക്കാൻ ‘ശിക്ഷിക്കണം’ ഉപയോഗിച്ചു; ശിക്ഷയുടെ കൃത്യരൂപം പദംതന്നെ വ്യക്തമാക്കുന്നില്ലെന്നത് അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ‘മൂപ്പന്മാർ’ എന്ന പരമ്പരാഗതവും ഇന്നും ഗ്രഹിക്കാവുന്നതുമായ പദം സാമൂഹിക-ന്യായാധികാരികളുടെ സ്ഥാപനപരമായ അർഥത്തിൽ നിലനിർത്തി. ക്രിയയുടെ യഥാർഥ വിശാലത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
