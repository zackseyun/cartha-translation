id: DEU.22.1
reference: Deuteronomy 22:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹֽא תִרְאֶה֩ אֶת שׁ֨וֹר אָחִ֜י/ךָ א֤וֹ אֶת שֵׂי/וֹ֙ נִדָּחִ֔ים וְ/הִתְעַלַּמְתָּ֖ מֵ/הֶ֑ם הָשֵׁ֥ב תְּשִׁיבֵ֖/ם לְ/אָחִֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/001.yaml
  text: You shall not see your brother’s ox or his sheep driven away and ignore them; you must certainly return them to your brother.
translation:
  language: ml
  text: നിന്റെ സഹോദരന്റെ കാളയെയോ അവന്റെ ആടിനെയോ അകന്നുപോയിരിക്കുന്നതായി കാണുമ്പോൾ, അവയെ അവഗണിക്കരുത്; അവയെ നിന്റെ സഹോദരന് തീർച്ചയായും തിരിച്ചുനൽകണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָחִיךָ
  choice: നിന്റെ സഹോദരൻ
  rationale: ബന്ധുസമൂഹത്തിലെ സഹാംഗത്തെ സൂചിപ്പിക്കുന്ന പുരുഷ ഏകവചന രൂപം; മൂലപാഠത്തിന്റെ ബന്ധഭാഷ നിലനിർത്തുന്നു.
- source_word: שֵׂיוֹ
  choice: അവന്റെ ആട്
  rationale: שֶׂה എന്ന പദത്തിന് ചെമ്മരിയാടിനെയോ കോലാടിനെയോ സൂചിപ്പിക്കാം; പൊതുവായ മലയാളപദമായ ‘ആട്’ മൂലത്തിലെ വിശാലത നിലനിർത്തുന്നു.
- source_word: נִדָּחִים
  choice: വഴിതെറ്റിപ്പോകുന്നത്
  rationale: നിദ്ദാഹീം എന്ന നിഷ്ക്രിയ രൂപം തെറ്റിപ്പോയതോ അകറ്റപ്പെട്ടതോ ആയ അവസ്ഥ സൂചിപ്പിക്കുന്നു. ഇവിടെ കാണാതായ വളർത്തുമൃഗങ്ങളുടെ സാഹചര്യത്തിൽ സ്വാഭാവികവും അർത്ഥവ്യാപ്തി സംരക്ഷിക്കുന്നതുമായ പ്രയോഗമാണിത്.
- source_word: וְהִתְעַלַּמְתָּ מֵהֶם
  choice: അവയെ കണ്ടില്ലെന്നു നടിക്കരുത്
  rationale: ഹിത്പയേൽ രൂപം മനപ്പൂർവം ശ്രദ്ധിക്കാതിരിക്കുക, ഒഴിഞ്ഞുമാറുക എന്ന ആശയം നൽകുന്നു; മലയാളത്തിൽ ഈ നൈതിക ഉദ്ദേശ്യം വ്യക്തമായി പകരുന്നു.
- source_word: הָשֵׁב תְּשִׁיבֵם
  choice: അവയെ ... തീർച്ചയായും തിരികെ എത്തിക്കണം
  rationale: ക്രിയയുടെ സമ്പൂർണരൂപവും അപൂർണരൂപവും ചേർന്ന ഊന്നൽ മലയാളത്തിൽ ‘തീർച്ചയായും’ എന്നും നിർബന്ധസൂചകമായ ‘എത്തിക്കണം’ എന്നും നൽകി പകരുന്നു.
theological_decisions:
- issue: ‘സഹോദരൻ’ എന്ന നിയമപരമായ ബന്ധപദത്തിന്റെ പരിധി
  choice: സഹോദരൻ
  alternative: സഹജനായ ഇസ്രായേല്യൻ / കൂട്ടുകാരൻ
  rationale: മൂലത്തിലെ אָח പദം അതേപടി ബന്ധഭാഷയായി നിലനിർത്തുന്നു; അതിന്റെ സാമൂഹിക-നിയമപരമായ പരിധി വിവർത്തനത്തിൽ അനാവശ്യമായി ചുരുക്കുകയോ വികസിപ്പിക്കുകയോ ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും മാന്യവുമായ നിയമോപദേശ ശൈലി. ‘കണ്ടില്ലെന്നു നടിക്കുക’ എന്ന സ്വാഭാവിക പ്രയോഗം മനപ്പൂർവമായ അവഗണനയെ വ്യക്തമാക്കുന്നു; ഹീബ്രു ഊന്നൽ ‘തീർച്ചയായും’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
