revisions:
- from: നിന്റെ സഹോദരന്റെ കാളയോ ആടോ വഴിതെറ്റിപ്പോകുന്നതു കണ്ടാൽ നീ അവയെ കണ്ടില്ലെന്നു നടിക്കരുത്; അവയെ നിന്റെ സഹോദരന്റെ അടുക്കൽ തീർച്ചയായും തിരികെ എത്തിക്കണം.
  to: നിന്റെ സഹോദരന്റെ കാളയെയോ അവന്റെ ആടിനെയോ അകന്നുപോയിരിക്കുന്നതായി കാണുമ്പോൾ, അവയെ അവഗണിക്കരുത്; അവയെ നിന്റെ സഹോദരന് തീർച്ചയായും തിരിച്ചുനൽകണം.
