review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the conditional, chance encounter, the alternate nest locations, the young or eggs, the mother positioned on them, and the prohibition against taking mother and offspring together. “പിടിക്കരുത്” is a contextually sound rendering of the legal verb “take.”
  naturalness: The sentence is generally clear, but “അമ്മപ്പക്ഷി” is more idiomatic and broadly standard in modern Malayalam than “തള്ളപ്പക്ഷി.” “കണ്ടുകിട്ടിയാൽ” more naturally expresses the incidental encounter than “നിന്റെ മുമ്പിൽ വന്നുപെട്ടാൽ.”
  terminology: “അമ്മപ്പക്ഷി,” “കുഞ്ഞുങ്ങൾ,” “മുട്ടകൾ,” and “പിടിക്കരുത്” maintain an appropriately plain legal register. The revision does not over-specify the species or the meaning of the mother’s posture.
  issues:
