reference: Deuteronomy 22:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֣י יִקָּרֵ֣א קַן צִפּ֣וֹר לְ/פָנֶ֡י/ךָ בַּ/דֶּ֜רֶךְ בְּ/כָל עֵ֣ץ א֣וֹ עַל הָ/אָ֗רֶץ אֶפְרֹחִים֙ א֣וֹ בֵיצִ֔ים וְ/הָ/אֵ֤ם רֹבֶ֨צֶת֙ עַל הָֽ/אֶפְרֹחִ֔ים א֖וֹ עַל הַ/בֵּיצִ֑ים לֹא תִקַּ֥ח הָ/אֵ֖ם עַל הַ/בָּנִֽים־׀־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/006.yaml
  text: If a bird’s nest happens to be before you on the way[a], in any tree or on the ground, with young ones or eggs, and the mother is sitting on the young ones or on the eggs[b], you shall not take the mother along with the young.
translation:
  language: ml
  text: വഴിയിൽ, ഏതെങ്കിലും മരത്തിലോ നിലത്തോ, കുഞ്ഞുങ്ങളോ മുട്ടകളോ ഉള്ള ഒരു പക്ഷിക്കൂട് നിന്റെ മുമ്പിൽ യാദൃച്ഛികമായി കണ്ടുകിട്ടിയാൽ[a], അമ്മപ്പക്ഷി ആ കുഞ്ഞുങ്ങളുടെമേലോ മുട്ടകളുടെമേലോ ഇരിക്കുന്നുവെങ്കിൽ, കുഞ്ഞുങ്ങളോടൊപ്പം അമ്മപ്പക്ഷിയെ പിടിക്കരുത്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഒരു പക്ഷിക്കൂട് നിന്റെ മുമ്പിൽ കണ്ടുകിട്ടിയാൽ.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രായ ക്രിയ മനഃപൂർവം അന്വേഷിക്കുന്നതിനേക്കാൾ യാദൃച്ഛികമായി കണ്ടെത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: “കുഞ്ഞുങ്ങളുടെമേൽ അമ്മയെ.” ഈ സന്ദർഭത്തിൽ ഈ പ്രയോഗം അമ്മപ്പക്ഷിയെ അതിന്റെ കുഞ്ഞുങ്ങളോടൊപ്പം പിടിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִקָּרֵא
  choice: യാദൃച്ഛികമായി ... വന്നുപെട്ടാൽ
  rationale: כִּי വ്യവസ്ഥാപരമായ നിയമസന്ദർഭം അവതരിപ്പിക്കുന്നു; יִקָּרֵא എന്ന നിഫാൽ രൂപം മനഃപൂർവമായ തിരച്ചിലല്ല, അപ്രതീക്ഷിതമായി കണ്ടുമുട്ടുന്നതാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: קַן צִפּוֹר
  choice: ഒരു പക്ഷിക്കൂട്
  rationale: ഹീബ്രായ സംയുക്തപദത്തിന്റെ അർഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: לְפָנֶיךָ בַּדֶּרֶךְ
  choice: വഴിയിൽ ... നിന്റെ മുമ്പിൽ
  rationale: യാത്രാമാർഗത്തിൽ ഒരാളുടെ മുന്നിൽ വന്നുപെടുന്ന സ്ഥിതിയെ മൂലപാഠത്തോട് അടുത്തുനിന്ന് മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: בְּכָל עֵץ אוֹ עַל הָאָרֶץ
  choice: ഏതെങ്കിലും മരത്തിലോ നിലത്തോ
  rationale: הָאָרֶץ ഇവിടെ വിശാലമായ 'ദേശം' എന്നതിലുപരി കൂടിന്റെ സ്ഥാനം സൂചിപ്പിക്കുന്ന 'നിലം' എന്നാണ് സന്ദർഭാർഥം.
- source_word: אֶפְרֹחִים אוֹ בֵיצִים
  choice: കുഞ്ഞുങ്ങളോ മുട്ടകളോ
  rationale: אֶפְרֹחִים പക്ഷിക്കുഞ്ഞുങ്ങളെ സൂചിപ്പിക്കുന്ന പൊതുപദമാണ്; ഇനമോ വളർച്ചാഘട്ടമോ അനാവശ്യമായി നിർണ്ണയിക്കാതെ 'കുഞ്ഞുങ്ങൾ' എന്ന് നൽകി.
- source_word: וְהָאֵם רֹבֶצֶת
  choice: തള്ളപ്പക്ഷി ... ഇരിക്കുന്നുവെങ്കിൽ
  rationale: רֹבֶצֶת കൂടിന്മേൽ സ്ഥിതിചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; 'അടയിരിക്കുക' മുട്ടകൾക്ക് യോജിച്ചാലും കുഞ്ഞുങ്ങൾക്കും മുട്ടകൾക്കും ഒരുപോലെ ചേരുന്ന പൊതുവായ രൂപം 'ഇരിക്കുക' ആണ്.
- source_word: לֹא תִקַּח
  choice: പിടിക്കരുത്
  rationale: പക്ഷിയെ കൈവശമാക്കരുതെന്ന നിയമനിരോധനം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: הָאֵם עַל הַבָּנִים
  choice: കുഞ്ഞുങ്ങളോടൊപ്പം തള്ളപ്പക്ഷിയെ
  rationale: ഈ പ്രയോഗത്തിലെ עַל വെറും സ്ഥാനബന്ധത്തേക്കാൾ അമ്മയെയും സന്തതിയെയും ഒരുമിച്ച് എടുക്കുന്നതാണ് സൂചിപ്പിക്കുന്നത്; בָּנִים സന്ദർഭത്തിൽ പക്ഷിയുടെ കുഞ്ഞുങ്ങളാണ്.
