translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിയമവാക്യത്തിന്റെ വ്യവസ്ഥാപര സ്വഭാവം നിലനിർത്തി; പക്ഷിയെപ്പറ്റിയുള്ള സന്ദർഭത്തിൽ സ്വാഭാവികമായ 'തള്ളപ്പക്ഷി', 'പിടിക്കരുത്' എന്നീ പദങ്ങൾ ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
