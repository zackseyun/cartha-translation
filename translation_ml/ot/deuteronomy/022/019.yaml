source:
  edition: WLC
  text: וְ/עָנְשׁ֨וּ אֹת֜/וֹ מֵ֣אָה כֶ֗סֶף וְ/נָתְנוּ֙ לַ/אֲבִ֣י הַֽ/נַּעֲרָ֔ה כִּ֤י הוֹצִיא֙ שֵׁ֣ם רָ֔ע עַ֖ל בְּתוּלַ֣ת יִשְׂרָאֵ֑ל וְ/לֽ/וֹ תִהְיֶ֣ה לְ/אִשָּׁ֔ה לֹא יוּכַ֥ל לְ/שַּׁלְּחָ֖/הּ כָּל יָמָֽי/ו־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/019.yaml
  text: Then they shall fine him one hundred shekels of silver and give them to the father of the young woman[a], because he has brought a bad name upon a virgin of Israel. And she shall be his wife; he may not send her away all his days.
translation:
  language: ml
  text: പിന്നെ അവർ അവന് നൂറു ശേക്കെൽ വെള്ളി പിഴ ചുമത്തുകയും ആ വെള്ളി യുവതിയുടെ പിതാവിന് കൊടുക്കുകയും വേണം. കാരണം, അവൻ ഇസ്രായേലിലെ ഒരു കന്യകയ്ക്കു ദുഷ്പേര് വരുത്തിയിരിക്കുന്നു. അവൾ അവന്റെ ഭാര്യയായിരിക്കണം; അവൻ ജീവിച്ചിരിക്കുന്ന കാലമത്രയും അവളെ വിട്ടയയ്ക്കാൻ[a] അവന് അനുവാദമില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവളെ വിവാഹമോചനം ചെയ്യാൻ.” എബ്രായയിൽ അക്ഷരാർഥം “അവളെ വിട്ടയയ്ക്കാൻ” എന്നാണ്; വിവാഹനിയമസന്ദർഭങ്ങളിൽ വിവാഹബന്ധം അവസാനിപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കാൻ ഈ പ്രയോഗം ഉപയോഗിക്കാറുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָנְשׁוּ
  choice: പിഴ ചുമത്തി
  rationale: ഈ നിയമസന്ദർഭത്തിൽ ക്രിയ പൊതുവായ ശിക്ഷയെയല്ല, പണമായി ഈടാക്കുന്ന പിഴയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: מֵאָה כֶסֶף
  choice: നൂറു ശേക്കെൽ വെള്ളി
  rationale: എബ്രായയിൽ അക്ഷരാർഥം ‘നൂറു വെള്ളി’ എന്നാണ്; നിയമപരവും സാമ്പത്തികവുമായ സന്ദർഭം തൂക്കയൂണിറ്റായ ശേക്കെലിനെ സൂചിപ്പിക്കുന്നതിനാൽ അത് വ്യക്തമാക്കിയിരിക്കുന്നു.
- source_word: לַאֲבִי הַנַּעֲרָה
  choice: യുവതിയുടെ പിതാവിനു
  rationale: נַעֲרָה വിവാഹപ്രായത്തിലുള്ള യുവതിയെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗമാണിത്.
- source_word: כִּי הוֹצִיא שֵׁם רָע
  choice: ദുഷ്പേര് വരുത്തിയിരിക്കുന്നു
  rationale: ‘ചീത്ത പേര് പുറത്തുകൊണ്ടുവരുക/വരുത്തുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപകം നിലനിർത്തിക്കൊണ്ട് അപകീർത്തിപ്പെടുത്തിയെന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: עַל בְּתוּלַת יִשְׂרָאֵל
  choice: ഇസ്രായേലിലെ ഒരു കന്യകയ്ക്കു
  rationale: നിയമപരമായ ആരോപണത്തിന്റെ സന്ദർഭത്തിൽ בְּתוּלָה ‘കന്യക’ എന്നാണ്; ‘ഇസ്രായേലിലെ’ എന്നത് ഉടമ്പടിസമൂഹവുമായി ബന്ധപ്പെട്ട ഘടന നിലനിർത്തുന്നു.
- source_word: וְלוֹ תִהְיֶה לְאִשָּׁה
  choice: അവൾ അവന്റെ ഭാര്യയായിരിക്കണം
  rationale: തുടർന്നുനിൽക്കേണ്ട നിയമപരമായ വിവാഹബന്ധത്തെ മലയാളത്തിലെ നിയമനിർദേശശൈലിയിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: לֹא יוּכַל
  choice: അവന് അനുവാദമില്ല
  rationale: ഇവിടെ ശാരീരികമായ കഴിവില്ലായ്മയല്ല, നിയമപരമായ വിലക്കാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: לְשַׁלְּחָהּ
  choice: അവളെ വിട്ടയയ്ക്കാൻ
  rationale: ‘അയച്ചുകളയുക/വിട്ടയയ്ക്കുക’ എന്ന ഉറവിടഭാഷയിലെ പ്രയോഗം നിലനിർത്തുന്നു; വിവാഹനിയമസന്ദർഭത്തിൽ ഇത് വിവാഹമോചനത്തെ സൂചിപ്പിക്കാം, അതിനാൽ ആ വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: כָּל יָמָיו
  choice: അവൻ ജീവിച്ചിരിക്കുന്ന കാലമത്രയും
  rationale: അക്ഷരാർഥമായ ‘അവന്റെ എല്ലാ ദിവസങ്ങളും’ എന്ന പ്രയോഗത്തിന്റെ ആജീവനാന്ത ദൈർഘ്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: വിവാഹബന്ധം അവസാനിപ്പിക്കുന്നതിനുള്ള നിയമപ്രയോഗം
  choice: അവളെ വിട്ടയയ്ക്കാൻ
  alternative: അവളെ വിവാഹമോചനം ചെയ്യാൻ
  rationale: എബ്രായപ്രയോഗം അക്ഷരാർഥത്തിൽ ‘വിട്ടയയ്ക്കുക’ എന്നാണ്; വിവാഹനിയമസന്ദർഭത്തിൽ അതിന് വിവാഹമോചനം എന്ന സാങ്കേതിക അർഥമുണ്ടാകാം. മുഖ്യപാഠം ഉറവിടത്തിലെ പ്രയോഗം നിലനിർത്തുകയും വ്യക്തമായ നിയമാർഥം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമശൈലി സ്വീകരിച്ചു. ‘പിഴ ചുമത്തുക,’ ‘അനുവാദമില്ല’ എന്നീ പ്രയോഗങ്ങൾ നിയമപരമായ ശക്തി വ്യക്തമാക്കുന്നു; ‘ദുഷ്പേര് വരുത്തുക,’ ‘വിട്ടയയ്ക്കുക’ എന്നിവ ഉറവിടത്തിലെ രൂപകവും യഥാർഥ അവ്യക്തതയും നിലനിർത്തുന്നു.
