source:
  edition: WLC
  text: כִּֽי יִקַּ֥ח אִ֖ישׁ אִשָּׁ֑ה וּ/בָ֥א אֵלֶ֖י/הָ וּ/שְׂנֵאָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/013.yaml
  text: If a man takes a wife and goes in to her[a], and then hates her,
translation:
  language: ml
  text: ഒരു പുരുഷൻ ഒരു സ്ത്രീയെ വിവാഹം കഴിച്ച് അവളുടെ അടുക്കൽ ചെല്ലുകയും[a] പിന്നീട് അവളെ വെറുക്കുകയും ചെയ്താൽ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ വ്യക്തമായി, ‘അവളുമായി ലൈംഗികബന്ധത്തിൽ ഏർപ്പെടുകയും.’ ‘അവളുടെ അടുക്കൽ ചെല്ലുക’ എന്ന എബ്രായ സൗമ്യപ്രയോഗം ദാമ്പത്യ ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ചെയ്താൽ
  rationale: ഇത് ഒരു വ്യവസ്ഥാധിഷ്ഠിത നിയമസാഹചര്യം അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ വാക്യാവസാനത്തിലെ ‘ചെയ്താൽ’ സ്വാഭാവികമായി ആ വ്യവസ്ഥ വ്യക്തമാക്കുന്നു.
- source_word: יִקַּח אִישׁ אִשָּׁה
  choice: ഒരു പുരുഷൻ ഒരു സ്ത്രീയെ വിവാഹം കഴിച്ച്
  rationale: לקח എന്നതിന്റെ അക്ഷരാർഥം ‘എടുക്കുക’ എന്നാണെങ്കിലും ഈ വിവാഹസന്ദർഭത്തിൽ ‘വിവാഹം കഴിക്കുക’ എന്നതാണ് സ്വാഭാവികവും കൃത്യവും. אִשָּׁה ഇവിടെ ഭാര്യയായി സ്വീകരിക്കുന്ന സ്ത്രീയെ സൂചിപ്പിക്കുന്നു; ‘ഒരു സ്ത്രീയെ വിവാഹം കഴിച്ച്’ എന്ന പ്രയോഗം മലയാളത്തിൽ ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: וּבָא אֵלֶיהָ
  choice: അവളുടെ അടുക്കൽ ചെല്ലുകയും
  rationale: ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ സൗമ്യപ്രയോഗത്തിന്റെ പരോക്ഷവും മാന്യവുമായ ഭാവം ഇത് നിലനിർത്തുന്നു; അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: וּשְׂנֵאָהּ
  choice: പിന്നീട് അവളെ വെറുക്കുകയും
  rationale: שׂנא എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥമായ ‘വെറുക്കുക’ നിലനിർത്തുന്നു. സംഭവക്രമം വ്യക്തമാക്കാൻ ‘പിന്നീട്’ ചേർത്തിരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവിക നിയമവാക്യഘടന ഉപയോഗിച്ചു. മൂലത്തിലെ ദാമ്പത്യബന്ധത്തെക്കുറിച്ചുള്ള സൗമ്യപ്രയോഗം പ്രധാനവാചകത്തിൽ സംരക്ഷിച്ച് അതിന്റെ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
