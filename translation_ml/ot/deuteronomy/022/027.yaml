source:
  edition: WLC
  text: כִּ֥י בַ/שָּׂדֶ֖ה מְצָאָ֑/הּ צָעֲקָ֗ה ה/נער הַ/מְאֹ֣רָשָׂ֔ה וְ/אֵ֥ין מוֹשִׁ֖יעַ לָֽ/הּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/027.yaml
  text: For he found her in the field[a]; the betrothed young woman cried out[b], but there was no one to rescue her.
translation:
  language: ml
  text: കാരണം, അവൻ അവളെ വയലിൽ കണ്ടുമുട്ടിയതുകൊണ്ടാണ്[a]; വിവാഹത്തിനു വാഗ്ദത്തം ചെയ്യപ്പെട്ട ആ യുവതി നിലവിളിച്ചു, എന്നാൽ അവളെ രക്ഷിക്കാൻ ആരും ഉണ്ടായിരുന്നില്ല.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തുറസ്സായ നാട്ടിൻപുറത്ത്.’ എബ്രായപ്രയോഗം സഹായം ലഭിക്കാൻ സാധ്യത കുറവായ ഒറ്റപ്പെട്ട ഗ്രാമീണ സ്ഥലത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവളെ വിടുവിക്കാൻ ആരും ഉണ്ടായിരുന്നില്ല.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ നിയമവിധിക്കുള്ള വിശദീകരണമാണ് ഈ പദം അവതരിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘കാരണം’ ആ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: בַשָּׂדֶה
  choice: വയലിൽവെച്ച്
  rationale: ഒറ്റപ്പെട്ട തുറസ്സായ ഗ്രാമപ്രദേശത്തെ സൂചിപ്പിക്കുന്ന മൂലപദത്തിന് നേരിട്ടുള്ള പരിഭാഷ; നിയമവിധിയുടെ സാഹചര്യവും നിലനിർത്തുന്നു.
- source_word: מְצָאָהּ
  choice: അവൻ അവളെ ... കണ്ടത്
  rationale: מצא എന്ന ക്രിയയുടെ സാധാരണ അർഥമായ ‘കണ്ടെത്തുക/കാണുക’ ഇവിടെ സ്വാഭാവികമായ മലയാളവാക്യഘടനയിൽ നൽകിയിരിക്കുന്നു.
- source_word: צָעֲקָה
  choice: നിലവിളിച്ചു
  rationale: സഹായത്തിനായുള്ള ഉച്ചത്തിലുള്ള ദുരിതവിളി സൂചിപ്പിക്കുന്ന צעק എന്ന ക്രിയയുടെ സന്ദർഭോചിതവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: הַנַּעַר
  choice: യുവതി
  rationale: വ്യഞ്ജനരൂപം മാത്രം നോക്കുമ്പോൾ രൂപപരമായ അനിശ്ചിതത്വമുണ്ടെങ്കിലും സന്ദർഭവും സ്ത്രീലിംഗസൂചനകളും സ്ത്രീയെയാണ് വ്യക്തമാക്കുന്നത്.
- source_word: הַמְאֹרָשָׂה
  choice: വിവാഹനിശ്ചയം കഴിഞ്ഞ
  rationale: വിവാഹത്തിനായി ഔപചാരികമായി വാഗ്ദത്തം ചെയ്യപ്പെട്ട നിയമ-സാമൂഹിക നില ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: וְאֵין מוֹשִׁיעַ לָהּ
  choice: എന്നാൽ അവളെ രക്ഷിക്കാൻ ആരും ഉണ്ടായിരുന്നില്ല
  rationale: രക്ഷയ്ക്കെത്താൻ ഒരാളുമില്ലായിരുന്നുവെന്ന സാഹചര്യാർഥം വ്യക്തമായി നൽകുന്നു; וְ എന്ന ബന്ധകത്തിന്റെ സന്ദർഭപരമായ വിരുദ്ധഭാവം ‘എന്നാൽ’ എന്നതിലൂടെ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: הַמְאֹרָשָׂה സൂചിപ്പിക്കുന്ന നിയമ-സാമൂഹിക നില
  choice: വിവാഹനിശ്ചയം കഴിഞ്ഞ
  alternative: വിവാഹത്തിന് വാഗ്ദത്തം ചെയ്യപ്പെട്ട
  rationale: പുരാതന ഇസ്രായേലിലെ ഔപചാരിക വിവാഹബന്ധത്തിന്റെ ഗൗരവം നിലനിർത്തിക്കൊണ്ട്, ആധുനിക വായനക്കാർക്ക് ഉടൻ മനസ്സിലാകുന്ന പ്രയോഗം തിരഞ്ഞെടുത്തു; ആധുനിക വിവാഹനിശ്ചയവുമായി പൂർണസമത്വമുണ്ടെന്ന് സൂചിപ്പിക്കുന്നില്ല.
- issue: הַנַּעַר എന്ന രൂപത്തിന്റെ ലിംഗസൂചന
  choice: യുവതി
  alternative: യുവാവ്/യുവവ്യക്തി എന്ന രൂപപരമായ അക്ഷരാനുസൃതത
  rationale: സന്ദർഭവും הַמְאֹרָשָׂה എന്ന സ്ത്രീലിംഗരൂപവും പരാമർശിക്കപ്പെടുന്നത് സ്ത്രീയെയാണെന്ന് വ്യക്തമാക്കുന്നതിനാൽ ലിംഗസൂക്ഷ്മമായ പരിഭാഷ നൽകി.
- issue: מוֹשִׁיעַ എന്ന പദത്തിന്റെ സന്ദർഭാർഥം
  choice: രക്ഷിക്കാൻ
  alternative: വിടുവിക്കാൻ
  rationale: ഇവിടെ പദം അടിയന്തരമായ ശാരീരിക സഹായത്തെയും മോചനത്തെയും സൂചിപ്പിക്കുന്നു; പ്രത്യേക സoteriological അർഥം അനാവശ്യമായി ചുമത്താതെ സാധാരണ സാഹചര്യാർഥം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നിയമസന്ദർഭത്തിന്റെ വിശദീകരണഭാവം നിലനിർത്തുന്നു. [a], [b] എന്നീ എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
