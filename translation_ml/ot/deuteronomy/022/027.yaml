  terminology: “വിവാഹനിശ്ചയം കഴിഞ്ഞ” is understandable but can suggest a modern engagement. “വിവാഹത്തിനു വാഗ്ദത്തം ചെയ്യപ്പെട്ട” better retains the formal legal sense of the Hebrew participle while remaining natural. “രക്ഷിക്കാൻ” appropriately renders the immediate contextual sense of מושיע.
