  text: כִּֽי יִמְצָ֣א אִ֗ישׁ נער בְתוּלָה֙ אֲשֶׁ֣ר לֹא אֹרָ֔שָׂה וּ/תְפָשָׂ֖/הּ וְ/שָׁכַ֣ב עִמָּ֑/הּ וְ/נִמְצָֽאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/028.yaml
  text: If a man finds a young woman[a], a virgin who is not engaged, and seizes her and lies with her, and they are discovered[b],
translation:
  language: ml
  text: ഒരു പുരുഷൻ വിവാഹത്തിന് നിശ്ചയിക്കപ്പെട്ടിട്ടില്ലാത്ത[a] കന്യകയായ ഒരു യുവതിയെ കണ്ടെത്തി, അവളെ പിടിച്ച് അവളുമായി ശയിച്ച് അവർ കണ്ടെത്തപ്പെടുകയും ചെയ്താൽ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘വിവാഹവാഗ്ദാനം ചെയ്യപ്പെട്ടിട്ടില്ലാത്ത.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ചെയ്താൽ
  rationale: സാഹചര്യാധിഷ്ഠിതമായ നിയമവ്യവസ്ഥയെ പരിചയപ്പെടുത്തുന്നതിനാൽ മലയാളത്തിലെ സോപാധിക പ്രയോഗമായ ‘ചെയ്താൽ’ ഉപയോഗിച്ചു.
- source_word: יִמְצָא
  choice: കണ്ടെത്തി
  rationale: ‘കണ്ടെത്തുക’ എന്ന അടിസ്ഥാന അർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: אִישׁ
  choice: ഒരു പുരുഷൻ
  rationale: മൂലത്തിലെ ലിംഗനിർദിഷ്ട ഏകവചന നാമത്തെ കൃത്യമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: נער בְתוּלָה
  choice: കന്യകയായ ഒരു യുവതി
  rationale: യൗവനത്തെയും കന്യകാത്വത്തെയും സൂചിപ്പിക്കുന്ന രണ്ടു ഘടകങ്ങളും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר לֹא אֹרָשָׂה
  choice: വിവാഹത്തിന് നിശ്ചയിക്കപ്പെട്ടിട്ടില്ലാത്ത
  rationale: നിയമപരമായി വിവാഹബന്ധത്തിനായി വാഗ്ദാനം ചെയ്യപ്പെട്ടിട്ടില്ലാത്ത അവസ്ഥ വ്യക്തമാക്കുന്നു; ആധുനിക വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഭാഷയാണ്.
- source_word: וּתְפָשָׂהּ
  choice: അവളെ പിടിച്ചടക്കി
  rationale: ക്രിയയുടെ ‘പിടിക്കുക, മുറുകെപ്പിടിക്കുക, കൈവശപ്പെടുത്തുക’ എന്ന ശക്തമായ ശാരീരിക ഭാവം മയപ്പെടുത്താതെ നൽകുന്നു; അതേസമയം മുഖ്യപാഠത്തിൽ ‘ബലാത്സംഗം’ എന്ന കൂടുതൽ നിർദിഷ്ടമായ നിയമവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: וְשָׁכַב עִמָּהּ
  choice: അവളോടുകൂടെ ശയിക്കുകയും
  rationale: ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയോട് ഔപചാരികമായി ചേർന്നുനിൽക്കുന്ന, മലയാള ബൈബിൾഭാഷയിൽ മനസ്സിലാകുന്ന പ്രയോഗം.
- source_word: וְנִמְצָאוּ
  choice: അവർ കണ്ടെത്തപ്പെടുകയും
  rationale: മൂലത്തിലെ കർമണിപ്രയോഗവും ബഹുവചനവും സംരക്ഷിക്കുന്നു; സംഭവം വെളിപ്പെടുന്നതാണ് സൂചന, എന്നാൽ ‘പിടിക്കപ്പെടുക’ എന്ന അധിക അർഥം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ഈ പ്രവൃത്തിയെ മുഖ്യപാഠത്തിൽ നേരിട്ട് ‘ബലാത്സംഗം’ എന്നു വിവർത്തനം ചെയ്യണമോ
  choice: ‘അവളെ പിടിച്ചടക്കി അവളോടുകൂടെ ശയിക്കുകയും’ എന്ന മൂലപദങ്ങളോടടുത്ത രൂപം നിലനിർത്തി.
  alternative: ‘അവളെ ബലാത്സംഗം ചെയ്യുകയും’ അല്ലെങ്കിൽ ‘അവളെ കൈക്കൊള്ളുകയും’
  rationale: תפשׂ എന്ന ക്രിയയിൽ ശാരീരികമായി പിടിച്ചെടുക്കുന്ന ശക്തി ഉണ്ടെങ്കിലും, ഈ വാക്യത്തിന്റെ കൃത്യമായ നിയമപരമായ വർഗീകരണം സമീപസന്ദർഭവുമായി ബന്ധപ്പെടുത്തി വ്യത്യസ്തമായി വ്യാഖ്യാനിക്കപ്പെടുന്നു. അതിനാൽ അതിനെ മയപ്പെടുത്താതെയും ഒരൊറ്റ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതെയും മൂലത്തിലെ സംഘർഷം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമശൈലി ഉപയോഗിച്ചു. ‘കന്യകയായ ഒരു യുവതി’ എന്നത് പ്രായത്തെയും കന്യകാത്വത്തെയും നിലനിർത്തുന്നു. ‘പിടിച്ചടക്കി’ എന്നത് ക്രിയയുടെ ശക്തി സംരക്ഷിക്കുന്നു; ‘അവർ കണ്ടെത്തപ്പെടുകയും’ എന്നത് അല്പം ഔപചാരികമായിരുന്നാലും എബ്രായത്തിലെ കർമണിബഹുവചനം അനാവശ്യ വ്യാഖ്യാനമില്ലാതെ നിലനിർത്തുന്നു.
