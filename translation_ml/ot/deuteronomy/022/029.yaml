id: DEU.22.29
reference: Deuteronomy 22:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ֠/נָתַן הָ/אִ֨ישׁ הַ/שֹּׁכֵ֥ב עִמָּ֛/הּ לַ/אֲבִ֥י ה/נער חֲמִשִּׁ֣ים כָּ֑סֶף וְ/לֽ/וֹ תִהְיֶ֣ה לְ/אִשָּׁ֗ה תַּ֚חַת אֲשֶׁ֣ר עִנָּ֔/הּ לֹא יוּכַ֥ל שַׁלְּחָ֖/ה כָּל יָמָֽי/ו־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/029.yaml
  text: Then the man who lay with her shall give fifty shekels of silver to the young woman's father[a], and she shall become his wife because he has violated her[b]. He may not send her away all his days.
translation:
  language: ml
  text: അപ്പോൾ അവളോടുകൂടെ ശയിച്ച പുരുഷൻ യുവതിയുടെ പിതാവിന് വെള്ളിയുടെ അമ്പത് ശേക്കൽ കൊടുക്കണം; അവൻ അവളെ ലൈംഗികമായി ലംഘിച്ചതിനാൽ[a] അവൾ അവന്റെ ഭാര്യയായിരിക്കണം. അവന്റെ ജീവിതകാലം മുഴുവൻ അവളെ പറഞ്ഞയയ്ക്കാൻ[b] അവന് അനുവാദമില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “അവളെ താഴ്ത്തിയതിനാൽ” അല്ലെങ്കിൽ “അധഃപതിപ്പിച്ചതിനാൽ.” ഈ സന്ദർഭത്തിൽ എബ്രായക്രിയ ലൈംഗികമായ ലംഘനത്തെയും അപമാനത്തെയും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “പറഞ്ഞയയ്ക്കുക” എന്നത് ഇവിടെ ഭാര്യയെ തള്ളിക്കളയുക, അതായത് വിവാഹമോചനം ചെയ്യുക, എന്ന അർഥത്തിലാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: അപ്പോൾ ... കൊടുക്കണം
  rationale: നിയമനിർദേശത്തിലെ തുടർച്ചയും നിർബന്ധസ്വഭാവവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַשֹּׁכֵב עִמָּהּ
  choice: അവളോടുകൂടെ ശയിച്ച
  rationale: ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം മാന്യവും നിയമശൈലിക്ക് യോജിച്ചതുമായ ഭാഷയിൽ നിലനിർത്തുന്നു.
- source_word: לַאֲבִי הַנַּעֲרָ
  choice: ആ യുവതിയുടെ അപ്പന്
  rationale: נַעֲרָה വിവാഹപ്രായത്തിലുള്ള പെൺകുട്ടിയെയോ യുവതിയെയോ സൂചിപ്പിക്കുന്നു; ‘യുവതി’ പ്രായപൂർത്തിയാകാത്ത കുട്ടിയെന്ന അനാവശ്യ ധാരണ ഒഴിവാക്കുന്നു.
- source_word: חֲמִשִּׁים כָּסֶף
  choice: അമ്പത് ശേക്കൽ വെള്ളി
  rationale: മൂലത്തിൽ ‘അമ്പത് വെള്ളി’ എന്നാണെങ്കിലും നിയമ-സാമ്പത്തിക സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്ന ഭാരമാനം വ്യക്തമായി നൽകുന്നു.
- source_word: וְלוֹ תִהְיֶה לְאִשָּׁה
  choice: അവൾ അവന്റെ ഭാര്യയായിരിക്കണം
  rationale: ഫലമായി നിലവിൽ വരുന്ന വിവാഹബന്ധവും നിയമപരമായ നിർബന്ധവും നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: תַּחַת אֲשֶׁר עִנָּהּ
  choice: അവൻ അവളെ അപമാനിച്ചതിനാൽ
  rationale: ענה എന്ന ക്രിയയുടെ പീയേൽ രൂപം ഇവിടെ ലൈംഗികസന്ദർഭത്തിലുള്ള അപമാനിക്കൽ, അധഃപതിപ്പിക്കൽ, ലംഘനം എന്നിവയുടെ ഗൗരവം വഹിക്കുന്നു; ‘അപമാനിച്ചു’ മൂലത്തിലെ അർത്ഥവ്യാപ്തി അമിതമായി ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: לֹא יוּכַל שַׁלְּחָהּ
  choice: അവളെ ഉപേക്ഷിക്കാൻ അവന് അനുവാദമില്ല
  rationale: അക്ഷരാർഥത്തിലെ ‘അയച്ചുകളയുക’ വിവാഹസന്ദർഭത്തിൽ ഭാര്യയെ തള്ളിക്കളയുകയോ വിവാഹമോചനം ചെയ്യുകയോ എന്നർഥം നൽകുന്നു; മലയാളത്തിൽ ‘ഉപേക്ഷിക്കുക’ അത് സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: כָּל יָמָיו
  choice: അവന്റെ ജീവിതകാലം മുഴുവൻ
  rationale: ‘അവന്റെ എല്ലാ ദിവസങ്ങളിലും’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ആജീവനാന്ത അർഥം വ്യക്തമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ענה എന്ന ലൈംഗിക-ലംഘന പദത്തിന്റെ പരിഭാഷ
  choice: അവളെ അപമാനിച്ചതിനാൽ
  alternative: അവളെ ലൈംഗികമായി ലംഘിച്ചതിനാൽ / അവളെ അധഃപതിപ്പിച്ചതിനാൽ
  rationale: ഈ വാക്യം ബലപ്രയോഗം എന്ന ഘടകം പ്രത്യേകം ആവർത്തിക്കുന്നില്ലെങ്കിലും സന്ദർഭം ഗുരുതരമായ ലൈംഗിക അതിക്രമമാണ്. ‘അപമാനിച്ചു’ മൂലപദത്തിന്റെ താഴ്ത്തുക/അധഃപതിപ്പിക്കുക എന്ന അർഥം കാത്തുസൂക്ഷിക്കുന്നു; അടിക്കുറിപ്പ് സന്ദർഭത്തിലെ ലൈംഗിക ലംഘനം വ്യക്തമാക്കുന്നു, എന്നാൽ വാക്യം മാത്രം അടിസ്ഥാനമാക്കി അതിലധികം നിർണ്ണയിക്കുന്നില്ല.
- issue: שַׁלְּחָהּ എന്നതിന്റെ വിവാഹനിയമപരമായ അർഥം
  choice: ഉപേക്ഷിക്കാൻ
  alternative: വിവാഹമോചനം ചെയ്യാൻ / പറഞ്ഞയയ്ക്കാൻ
  rationale: വിവാഹബന്ധത്തിൽ ഈ ക്രിയ ഭാര്യയെ പറഞ്ഞയയ്ക്കൽ അഥവാ വിവാഹമോചനം സൂചിപ്പിക്കുന്നു. മുഖ്യപാഠം വിശാലമായ പ്രയോഗം നിലനിർത്തുകയും അടിക്കുറിപ്പ് നിയമപരമായ അർഥം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യമായ നിയമശൈലി. ലൈംഗികകൃത്യത്തെ വർണിക്കുന്നതിൽ നിയന്ത്രിത ഭാഷ ഉപയോഗിച്ചു; അതിക്രമത്തിന്റെ ഗൗരവം മങ്ങിക്കാതെയും മൂലപാഠം പറയുന്നതിലധികം നിർണ്ണയിക്കാതെയും അർഥം നൽകി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
