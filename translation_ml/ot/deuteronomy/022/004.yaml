translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമശൈലി. ‘കണ്ടില്ലെന്നു നടിക്കരുത്’ എന്ന വ്യവഹാരപ്രയോഗം മനപ്പൂർവമായ അവഗണന വ്യക്തമാക്കുന്നു; ഊന്നൽ ‘തീർച്ചയായും’ എന്നതിലൂടെ പ്രകടിപ്പിച്ചു. അടിക്കുറിപ്പുസൂചിക പ്രധാനവാക്യത്തിൽ ചേർത്തിട്ടുണ്ട്.
