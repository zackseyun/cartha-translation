review_pass:
  verdict: revise
  source_fidelity: The draft accurately identifies the animals, their fallen condition, deliberate disregard, emphatic obligation, and cooperative action with the owner. However, “സഹായിക്കണം” introduces an auxiliary ‘help’ construction where the Hebrew directly and emphatically commands raising the animals ‘with him.’ A direct Malayalam imperative better preserves both הָקֵם תָּקִים and עִמּוֹ.
  naturalness: “അവയെ അവഗണിക്കരുത്” is a natural modern-standard Malayalam expression for the idiom ‘hide oneself from/ignore them.’ The revised wording also retains the legal-register force without the somewhat more interpretive ‘pretend not to have seen.’
  terminology: “സഹോദരന്റെ,” “കഴുത,” and “കാള” are suitable. “അവനോടൊപ്പം” correctly retains the singular owner-oriented sense of עִמּוֹ, while “അവയെ” appropriately reflects the plural animals.
  issues:
  - severity: medium
    issue: The final command uses “എഴുന്നേൽപ്പിക്കാൻ ... സഹായിക്കണം.”
    rationale: This makes ‘helping’ the governing command, whereas the Hebrew uses an intensified direct command, ‘you shall surely raise [them],’ followed by ‘with him.’ Rendering the direct action explicitly avoids an unnecessary interpretive shift.
  - severity: low
    issue: “കണ്ടില്ലെന്നു നടിക്കരുത്” is more idiomatic-expansive than necessary.
    rationale: It conveys deliberate disregard well, but “അവഗണിക്കരുത്” is more concise and closely matches the Hebrew idiom without adding the specific notion of pretending.
  revised_text: നിന്റെ സഹോദരന്റെ കഴുതയോ കാളയോ വഴിയിൽ വീണുകിടക്കുന്നതു നീ കണ്ട് അവയെ അവഗണിക്കരുത്; അവനോടൊപ്പം അവയെ തീർച്ചയായും എഴുന്നേൽപ്പിക്കണം.[a]
