  edition: WLC
  text: לֹא תִרְאֶה֩ אֶת חֲמ֨וֹר אָחִ֜י/ךָ א֤וֹ שׁוֹר/וֹ֙ נֹפְלִ֣ים בַּ/דֶּ֔רֶךְ וְ/הִתְעַלַּמְתָּ֖ מֵ/הֶ֑ם הָקֵ֥ם תָּקִ֖ים עִמּֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/004.yaml
  text: You shall not see your brother’s donkey or his ox fallen on the road and ignore them[a]; you must surely lift them up with him.
translation:
  language: ml
  text: നിന്റെ സഹോദരന്റെ കഴുതയോ കാളയോ വഴിയിൽ വീണുകിടക്കുന്നതു നീ കണ്ട് അവയെ അവഗണിക്കരുത്; അവനോടൊപ്പം അവയെ തീർച്ചയായും എഴുന്നേൽപ്പിക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പദശഃ, “അവനോടൊപ്പം അവയെ തീർച്ചയായും എഴുന്നേൽപ്പിക്കണം.” മൃഗങ്ങളുടെ ഉടമയെ സഹായിക്കാതെ വിട്ടുകളയരുതെന്നും അവനുമായി ചേർന്ന് പ്രവർത്തിക്കണമെന്നും ഇത് ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָחִיךָ
  choice: നിന്റെ സഹോദരന്റെ
  rationale: പദശഃ ‘നിന്റെ സഹോദരന്റെ’ എന്നാണ്. ആവർത്തനപുസ്തകത്തിലെ ഉടമ്പടിനിയമസന്ദർഭത്തിൽ ഇത് സമൂഹത്തിലെ സഹഅംഗത്തെയും സൂചിപ്പിക്കാം; ഉറവിടത്തിലെ കുടുംബാത്മക-സാമൂഹിക ഭാവം നിലനിർത്താൻ ‘സഹോദരന്റെ’ എന്നു നൽകി.
- source_word: חֲמוֹר
  choice: കഴുത
  rationale: ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ സാധാരണ പദം.
- source_word: שׁוֹרוֹ
  choice: കാള
  rationale: ജോലിക്കുപയോഗിക്കുന്ന കന്നുകാലിയെ സൂചിപ്പിക്കുന്ന നിയമസന്ദർഭത്തിൽ שׁוֹר എന്നതിന്റെ സ്വാഭാവിക മലയാളപരിഭാഷ.
- source_word: נֹפְלִים
  choice: വീണുകിടക്കുന്നതു
  rationale: മൃഗങ്ങൾ വീണ നിലയിലാണെന്നു വർത്തമാനകൃദന്തം സൂചിപ്പിക്കുന്നു; ‘വീണുകിടക്കുന്നു’ എന്നത് മലയാളത്തിൽ ആ നില വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בַּדֶּרֶךְ
  choice: വഴിയിൽ
  rationale: സ്ഥലസൂചനയെ ലളിതവും നേരിട്ടുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וְהִתְעַלַּמְתָּ מֵהֶם
  choice: അവയെ കണ്ടില്ലെന്നു നടിക്കരുത്
  rationale: ഇവിടത്തെ התעלם മനപ്പൂർവം അവഗണിക്കുക, ശ്രദ്ധിക്കാത്തതായി നടിക്കുക എന്ന വ്യവഹാരാർഥത്തിലാണ്. എബ്രായത്തിലെ ബഹുവചനസർവനാമത്തെ ‘അവയെ’ എന്നു നിലനിർത്തി.
- source_word: הָקֵם תָּקִים
  choice: എഴുന്നേൽപ്പിക്കാൻ നീ തീർച്ചയായും സഹായിക്കണം
  rationale: ക്രിയാനാമത്തിന്റെ സമ്പൂർണരൂപവും പരിമിതക്രിയയും ചേർന്ന പ്രയോഗം കല്പനയ്ക്ക് ഊന്നൽ നൽകുന്നു. עִמּוֹ സഹകരണത്തെ സൂചിപ്പിക്കുന്നതിനാൽ, മലയാളത്തിൽ ‘അവനോടൊപ്പം ... സഹായിക്കണം’ എന്നു സ്വാഭാവികമായി നൽകി.
- source_word: עִמּוֹ
  choice: അവനോടൊപ്പം
  rationale: പദശഃ ‘അവനോടൊപ്പം’; ഉടമയെ ഒറ്റയ്ക്കാക്കാതെ അവനുമായി ചേർന്ന് പ്രവർത്തിക്കണമെന്ന ആശയം സംരക്ഷിക്കുന്നു.
