source:
  edition: WLC
  text: כִּ֤י תִבְנֶה֙ בַּ֣יִת חָדָ֔שׁ וְ/עָשִׂ֥יתָ מַעֲקֶ֖ה לְ/גַגֶּ֑/ךָ וְ/לֹֽא תָשִׂ֤ים דָּמִים֙ בְּ/בֵיתֶ֔/ךָ כִּֽי יִפֹּ֥ל הַ/נֹּפֵ֖ל מִמֶּֽ/נּוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/008.yaml
  text: When you build a new house[a], you shall make a parapet for your roof, so that you do not bring bloodguilt on your house if someone falls from it.
translation:
  language: ml
  text: നീ പുതിയൊരു വീട് പണിയുമ്പോൾ, നിന്റെ മേൽക്കൂരയ്ക്കു ചുറ്റും ഒരു സംരക്ഷണഭിത്തി[a] പണിയണം; ആരെങ്കിലും മേൽക്കൂരയിൽനിന്ന് വീണാൽ നിന്റെ വീട്ടിന്മേൽ രക്തക്കുറ്റം വരാതിരിക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കൈവരി’ അല്ലെങ്കിൽ ‘സുരക്ഷാവേലി.’ എബ്രായപദം പരന്ന മേൽക്കൂരയുടെ അരികിൽ പണിയുന്ന സംരക്ഷണതടസ്സത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: പണിയുമ്പോൾ
  rationale: ഇവിടെ כִּי ഒരു കാരണവാക്യമല്ല, സംഭവസാധ്യത മുൻനിർത്തിയുള്ള നിയമസാഹചര്യമാണ് അവതരിപ്പിക്കുന്നത്. മലയാളത്തിൽ ‘പണിയുമ്പോൾ’ സ്വാഭാവികമായി അതു പ്രകടമാക്കുന്നു.
- source_word: תִבְנֶה בַּיִת חָדָשׁ
  choice: നീ ഒരു പുതിയ വീട് പണിയുമ്പോൾ
  rationale: ക്രിയയും കർമവും വിശേഷണവും നേരായും സ്വാഭാവികമായും പുനരാവിഷ്കരിക്കുന്നു.
- source_word: וְעָשִׂיתָ
  choice: പണിയണം
  rationale: നിയമപരമായ നിർദേശത്തിന്റെ നിർബന്ധസ്വഭാവം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: מַעֲקֶה
  choice: സംരക്ഷണഭിത്തി
  rationale: പരന്ന മേൽക്കൂരയുടെ അരികിൽ വീഴ്ച തടയാൻ പണിയുന്ന തടസ്സത്തെയാണ് പദം സൂചിപ്പിക്കുന്നത്. സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന മലയാളപദം തെരഞ്ഞെടുത്തു; മറ്റു രൂപങ്ങൾ അടിക്കുറിപ്പിൽ നൽകി.
- source_word: לְגַגֶּךָ
  choice: അതിന്റെ മേൽക്കൂരയ്ക്കു ചുറ്റും
  rationale: ലക്ഷ്യസ്ഥാനമായ മേൽക്കൂരയെയും തടസ്സത്തിന്റെ പ്രായോഗിക സ്ഥാനത്തെയും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְלֹא תָשִׂים דָּמִים בְּבֵיתֶךָ
  choice: രക്തപാതകത്തിന്റെ കുറ്റം നിന്റെ വീടിന്മേൽ വരും
  rationale: ‘രക്തങ്ങൾ വെക്കുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ നിയമപരവും ധാർമികവുമായ കുറ്റബാധ്യത മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; വീടിന്മേൽ ബാധ്യത വരുന്നതെന്ന രൂപകവും നിലനിർത്തുന്നു.
- source_word: כִּי יִפֹּל הַנֹּפֵל
  choice: ആരെങ്കിലും അവിടെനിന്നു വീണാൽ
  rationale: വീഴാനിടയുള്ള നിർദിഷ്ടമല്ലാത്ത വ്യക്തിയെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം ആവർത്തനഭാരം കൂടാതെ മലയാളത്തിൽ നൽകുന്നു.
- source_word: מִמֶּנּוּ
  choice: അവിടെനിന്നു
  rationale: സന്ദർഭത്തിൽ മേൽക്കൂരയോ വീട്ടിന്റെ ഉയർന്ന ഘടനയോ ആണ് സൂചന. അവ്യക്തത അനാവശ്യമായി തീർക്കാതെ സമീപസ്ഥലത്തെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: നിയമസന്ദർഭത്തിലെ דָּמִים എന്നതിന്റെ അർഥം
  choice: രക്തപാതകത്തിന്റെ കുറ്റം
  alternative: രക്തച്ചൊരിച്ചിൽ; രക്തത്തിനു കാരണമായ കുറ്റം
  rationale: ഇവിടെ ഉദ്ദേശിക്കുന്നത് ശാരീരികമായ രക്തച്ചൊരിച്ചിൽ മാത്രം അല്ല, തടയാമായിരുന്ന മരണത്തിനുള്ള നിയമപരവും ധാർമികവുമായ ഉത്തരവാദിത്വമാണ്. തിരഞ്ഞെടുത്ത രൂപം ഈ അർഥം മതവിഭാഗപരമായ വ്യാഖ്യാനം ചേർക്കാതെ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിയമത്തിന്റെ നിർദേശസ്വരം ‘പണിയണം’ എന്നതിലൂടെ നിലനിർത്തി. പുരാതന പരന്ന മേൽക്കൂരയുടെ പശ്ചാത്തലം അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കി.
