lexical_decisions:
- source_word: לֹא תִלְבַּשׁ
  choice: ധരിക്കരുത്
  rationale: നിയമസന്ദർഭത്തിലെ നിഷേധത്തോടുകൂടിയ രണ്ടാംപുരുഷ ഏകവചന ക്രിയയെ ആധുനിക മലയാളത്തിലെ സ്വാഭാവികമായ നിരോധനരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: שַׁעַטְנֵז
  choice: ശാഅത്‌നേസ് വസ്ത്രം
  rationale: അപൂർവവും അർഥം പൂർണമായി ഉറപ്പില്ലാത്തതുമായ സാങ്കേതിക പദം ലിപ്യന്തരണം ചെയ്ത് നിലനിർത്തുന്നു; പിന്നാലെയുള്ള പദങ്ങൾ അതിന്റെ വസ്തുസംയോജനം വ്യക്തമാക്കുന്നു.
- source_word: צֶמֶר
  choice: കമ്പിളിനൂൽ
  rationale: വസ്ത്രനിർമാണസന്ദർഭത്തിൽ കമ്പിളി എന്ന വസ്തുവിനെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: וּפִשְׁתִּים
  choice: ചണനൂൽ
  rationale: പദത്തിന് ചണച്ചെടിയെയോ അതിൽനിന്നുള്ള നാരിനെയോ വസ്ത്രത്തെയോ സൂചിപ്പിക്കാം; നൂൽസങ്കലനസന്ദർഭത്തിൽ ‘ചണനൂൽ’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: יַחְדָּו
  choice: ഒരുമിച്ചു ചേർത്തുണ്ടാക്കിയ
  rationale: രണ്ടു വസ്തുക്കളും ഒരേ വസ്ത്രത്തിൽ സംയോജിപ്പിച്ചിരിക്കുന്നുവെന്ന ആശയം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
