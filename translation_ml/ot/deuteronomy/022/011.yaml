    rationale: צֶמֶר and פִּשְׁתִּים denote wool and flax/linen as materials. The revised wording preserves that scope and reduces potential lexical confusion.
  revised_text: കമ്പിളിയും ചണവും ചേർന്ന ശാഅത്‌നേസ് വസ്ത്രം ധരിക്കരുത്.[a]
