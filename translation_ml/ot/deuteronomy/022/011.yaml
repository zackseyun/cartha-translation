translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമഭാഷ ഉപയോഗിച്ചു. അപൂർവമായ മൂലപദം ഇല്ലാതാക്കാതെ ലിപ്യന്തരണം ചെയ്തു; വാക്യവും അടിക്കുറിപ്പും അതിന്റെ സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു.
