  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ശാഅത്‌നേസ്” അപൂർവമായ ഒരു എബ്രായപദമാണ്. ഇവിടെ കമ്പിളിയും ചണവും (ചണനാരിൽനിന്നുള്ള ലിനനും) ചേർന്ന തുണിയെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്.
