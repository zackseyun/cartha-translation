  yaml_path: translation/ot/deuteronomy/022/003.yaml
  text: And so you shall do with his donkey[a], and so you shall do with his cloak, and so you shall do with any lost thing of your brother that is lost from him and you find it; you may not ignore it.
translation:
  language: ml
  text: അവന്റെ കഴുതയുടെ കാര്യത്തിലും അങ്ങനെതന്നെ ചെയ്യണം; അവന്റെ മേലങ്കിയുടെ കാര്യത്തിലും അങ്ങനെതന്നെ ചെയ്യണം. നിന്റെ സഹോദരന്റെ പക്കൽനിന്ന് നഷ്ടപ്പെട്ടിട്ട് നീ കണ്ടെത്തുന്ന ഏതൊരു വസ്തുവിന്റെ കാര്യത്തിലും അങ്ങനെതന്നെ ചെയ്യണം. നീ അത് അവഗണിക്കരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തോട് കൂടുതൽ ചേർന്ന്: “അതിൽനിന്ന് ഒഴിഞ്ഞുമാറാൻ നിനക്കാവില്ല”; അഥവാ, അത് കണ്ടില്ലെന്നു നടിക്കരുത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֵן
  choice: അങ്ങനെതന്നെ
  rationale: മുൻവാക്യത്തിലെ നിർദേശം തുടരുന്നതും നിയമശൈലിയിലെ ആവർത്തനവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: תַּעֲשֶׂה
  choice: ചെയ്യണം
  rationale: നിയമസന്ദർഭത്തിലെ നിർദേശകബലം വ്യക്തമായി നൽകുന്ന ആധുനികവും ഗൗരവമുള്ളതുമായ പ്രയോഗം.
- source_word: לַחֲמֹרוֹ
  choice: അവന്റെ കഴുതയുടെ കാര്യത്തിൽ
  rationale: മുൻസന്ദർഭത്തിലെ നഷ്ടപ്പെട്ട മൃഗത്തെ സൂചിപ്പിക്കുന്നു; לְ എന്ന ബന്ധത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לְשִׂמְלָתוֹ
  choice: അവന്റെ മേലങ്കിയുടെ കാര്യത്തിൽ
  rationale: שִׂמְלָה സാധാരണയായി പുറമേ ധരിക്കുന്ന വസ്ത്രത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘മേലങ്കി’ വ്യക്തവും മൂർത്തവുമായ പരിഭാഷയാണ്.
- source_word: לְכָל אֲבֵדַת
  choice: നഷ്ടപ്പെട്ട ഏതൊരു വസ്തുവിന്റെ കാര്യത്തിലും
  rationale: പേരെടുത്ത വസ്തുക്കളിൽനിന്ന് എല്ലാ നഷ്ടവസ്തുക്കളിലേക്കും നിയമം വ്യാപിപ്പിക്കുന്ന പൊതുവൽക്കരണം സംരക്ഷിക്കുന്നു.
- source_word: אָחִיךָ
  choice: നിന്റെ സഹോദരൻ
  rationale: എബ്രായത്തിലെ ഏകവചന പുല്ലിംഗ ബന്ധപദം നിലനിർത്തുന്നു; ഉടമ്പടിസമൂഹത്തിലെ സഹാംഗത്തെ സൂചിപ്പിക്കാമെങ്കിലും മുഖ്യപാഠത്തിൽ പൊതുവൽക്കരിക്കുന്നില്ല.
- source_word: אֲשֶׁר תֹּאבַד מִמֶּנּוּ
  choice: അവന്റെ പക്കൽനിന്ന് നഷ്ടപ്പെട്ടിട്ട്
  rationale: നഷ്ടത്തിന്റെ കർത്താവിനെ അധികമായി നിർണ്ണയിക്കാതെ, എബ്രായത്തിലെ ‘അവനിൽനിന്ന് നഷ്ടപ്പെടുക’ എന്ന രൂപഭാവം സംരക്ഷിക്കുന്നു.
- source_word: וּמְצָאתָהּ
  choice: നീ കണ്ടെത്തുന്ന
  rationale: നഷ്ടവസ്തു അഭിസംബോധിതൻ കണ്ടെത്തുന്ന തുടർച്ചയായ സംഭവത്തെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: לֹא תוּכַל לְהִתְעַלֵּם
  choice: നീ അത് കണ്ടില്ലെന്നു നടിക്കരുത്
  rationale: നിയമപരമായ വിലക്കിനെയും സ്വയം മറച്ചൊഴിയുക/ശ്രദ്ധിക്കാത്തതായി നടിക്കുക എന്ന ഹിത്പയേൽ ക്രിയയുടെ ദൃശ്യഭാവത്തെയും മലയാളത്തിൽ ഒരുമിച്ച് എത്തിക്കുന്നു.
theological_decisions:
- issue: ഉടമ്പടിനിയമസന്ദർഭത്തിലെ אָחִיךָ എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: നിന്റെ സഹോദരൻ
  alternative: നിന്റെ സഹയിസ്രായേല്യൻ / നിന്റെ ബന്ധു
  rationale: പദത്തിന്റെ സാമൂഹിക-ദൈവശാസ്ത്രപരമായ ബന്ധഭാവം വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ എബ്രായത്തിലെ ബന്ധപദം നിലനിർത്തുന്നു.
- issue: לֹא תוּכַל לְהִתְעַלֵּם എന്ന പ്രയോഗത്തിന്റെ ബലം
  choice: നീ അത് കണ്ടില്ലെന്നു നടിക്കരുത്
  alternative: നിനക്ക് സ്വയം മറച്ചുകളയാനാവില്ല / നീ അത് അവഗണിക്കരുത്
  rationale: ഇത് ശാരീരികമായ അസമർഥതയല്ല, ഉത്തരവാദിത്വത്തിൽനിന്ന് ഒഴിഞ്ഞുമാറുന്നതിനെതിരായ നിയമവിലക്കാണ്. തിരഞ്ഞെടുത്ത രൂപം പ്രായോഗിക അർഥവും മൂലപ്രയോഗത്തിന്റെ രൂപകഭാവവും സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള നിയമശൈലി ഉപയോഗിച്ചു. വാക്യത്തിന്റെ ആവർത്തനഘടന സാധ്യമായത്ര നിലനിർത്തി; അവസാനത്തെ എബ്രായ ശൈലിപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകി, അതിന്റെ കൂടുതൽ അക്ഷരാർഥപരമായ രൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
