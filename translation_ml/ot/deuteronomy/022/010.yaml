id: DEU.22.10
reference: Deuteronomy 22:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹֽא תַחֲרֹ֥שׁ בְּ/שׁוֹר וּ/בַ/חֲמֹ֖ר יַחְדָּֽו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/010.yaml
  text: You shall not plow with an ox and a donkey together[a].
translation:
  language: ml
  text: കാളയെയും കഴുതയെയും ഒരുമിച്ചു പൂട്ടി ഉഴരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കാളയെയും കഴുതയെയും ചേർത്ത് ഉഴരുത്.”
    reason: ‘ഒരുമിച്ചു’ എന്നതും ഉപാധിസൂചകമായ בְ ബന്ധവും കൂടുതൽ സംക്ഷിപ്തമായി വിവർത്തനം ചെയ്യാവുന്ന മറ്റൊരു സ്വാഭാവിക രീതി.
lexical_decisions:
- source_word: לֹא תַחֲרֹשׁ
  choice: ഉഴരുത്
  rationale: നിഷേധപദത്തോടുകൂടിയ ഖാൽ അപൂർണക്രിയ നിയമസന്ദർഭത്തിൽ നേരിട്ടുള്ള വിലക്കാണ്; ആധുനിക മലയാളത്തിൽ ‘ഉഴരുത്’ അതിന്റെ ബലം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּשׁוֹר
  choice: കാളയെ ... പൂട്ടി
  rationale: ശׁוֹר ഇവിടെ ഉഴവിനുപയോഗിക്കുന്ന ഗോവർഗത്തിലെ വലിവുമൃഗത്തെ സൂചിപ്പിക്കുന്നു; മലയാള കാർഷികസന്ദർഭത്തിൽ ‘കാള’ യോജിച്ചതാണ്. בְ എന്ന ഉപാധിസൂചക ബന്ധം ‘പൂട്ടി’ എന്നു സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וּבַחֲמֹר
  choice: കഴുതയെയും
  rationale: חֲמוֹר എന്ന സാധാരണ മൃഗനാമത്തിന് വ്യക്തവും നിലവിലുള്ളതുമായ മലയാളപദം ‘കഴുത’ ആണ്.
- source_word: יַחְדָּו
  choice: ഒരുമിച്ചു
  rationale: രണ്ടു മൃഗങ്ങളെയും ഒരേ ഉഴവുജോലിയിൽ ചേർക്കുന്നതാണ് ക്രിയാവിശേഷണം സൂചിപ്പിക്കുന്നത്; ‘ഒരുമിച്ചു’ അർത്ഥം നേരിട്ട് നൽകുന്നു.
theological_decisions:
- issue: ഉടമ്പടിനിയമത്തിലെ വിലക്കിന്റെ ഭാവം
  choice: ‘ഉഴരുത്’ എന്ന നേരിട്ടുള്ള നിയമവിലക്ക്
  alternative: ‘ഉഴാൻ പാടില്ല’
  rationale: ഹീബ്രു രൂപം നേരിട്ടുള്ള വിലക്കാണ്. ‘ഉഴരുത്’ ആ നിയമബലം നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു; വാക്യത്തിൽ പ്രത്യേക മതവിഭാഗപരമായ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ നിയമഭാഷ. ‘പൂട്ടി’ എന്ന പദം മൂലത്തിൽ സൂചിതമായിരിക്കുന്ന, രണ്ടു മൃഗങ്ങളെയും ഒരേ ഉഴവുപണിയിൽ ചേർക്കുന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
