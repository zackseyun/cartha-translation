source:
  edition: WLC
  text: וְֽ/אִם בַּ/שָּׂדֶ֞ה יִמְצָ֣א הָ/אִ֗ישׁ אֶת ה/נער הַ/מְאֹ֣רָשָׂ֔ה וְ/הֶחֱזִֽיק בָּ֥/הּ הָ/אִ֖ישׁ וְ/שָׁכַ֣ב עִמָּ֑/הּ וּ/מֵ֗ת הָ/אִ֛ישׁ אֲשֶׁר שָׁכַ֥ב עִמָּ֖/הּ לְ/בַדּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/025.yaml
  text: But if in the open field the man finds the young woman who is betrothed[a], and the man seizes her and lies with her, then only the man who lay with her shall die.
translation:
  language: ml
  text: എന്നാൽ തുറസ്സായ വയലിൽവെച്ച് ഒരാൾ വിവാഹവാഗ്ദത്തയായ ഒരു യുവതിയെ കണ്ടെത്തി, അവളെ ബലമായി പിടിച്ച്[a] അവളോടുകൂടെ ശയിച്ചാൽ, അവളോടുകൂടെ ശയിച്ച ആ പുരുഷൻ മാത്രം മരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവളെ കീഴ്പ്പെടുത്തി’ അല്ലെങ്കിൽ ‘അവളെ ബലാത്സംഗം ചെയ്തു’ എന്നും അർഥമാക്കാം. എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ ‘അവളെ ബലമായി പിടിച്ചു’ എന്നാണ്; ചുറ്റുമുള്ള നിയമസന്ദർഭം ഇത് അവളുടെ സമ്മതമില്ലാതെ നടന്ന പ്രവൃത്തിയാണെന്ന് വ്യക്തമാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: എന്നാൽ ... എങ്കിൽ/ചെയ്താൽ
  rationale: മുൻപത്തെ നിയമസാഹചര്യത്തോടുള്ള വൈരുധ്യം സൂചിപ്പിക്കുന്ന നിബന്ധനയായി സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
- source_word: בַּשָּׂדֶה
  choice: തുറസ്സായ വയലിൽവെച്ച്
  rationale: ശׂדה എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘വയൽ’ നിലനിർത്തിക്കൊണ്ട്, ചുറ്റുമുള്ള നിയമത്തിൽ പ്രസക്തമായ ഒറ്റപ്പെട്ട തുറസ്സായ സ്ഥലം വ്യക്തമാക്കുന്നു.
- source_word: יִמְצָא
  choice: കണ്ടെത്തി
  rationale: מצא എന്ന സാധാരണ ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു.
- source_word: הַנַּעַר הַמְאֹרָשָׂה
  choice: വിവാഹനിശ്ചയം കഴിഞ്ഞ ഒരു യുവതിയെ
  rationale: നിയമപരമായി വിവാഹത്തിന് വാഗ്ദാനം ചെയ്യപ്പെട്ട യുവതിയെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ വ്യക്തവും മാന്യവുമായ പ്രയോഗം.
- source_word: וְהֶחֱזִיק בָּהּ
  choice: അവളെ ബലമായി പിടിച്ച്
  rationale: חזק എന്ന ക്രിയയിലെ ബലപ്രയോഗത്തിന്റെ ഭാവം വ്യക്തമാക്കുകയും, അതിനെ പ്രത്യേകമായി ‘ബലാത്സംഗം ചെയ്തു’ എന്നു പകരാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: וְשָׁכַב עִמָּהּ
  choice: അവളോടുകൂടെ ശയിച്ചാൽ
  rationale: ലൈംഗികബന്ധത്തിനുള്ള എബ്രായ ശൈലി മാന്യവും ഉറവിടത്തോട് അടുത്തതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וּמֵת
  choice: മരിക്കണം
  rationale: നിയമപരമായ ശിക്ഷാവിധിയുടെ നിർദേശാത്മക ശക്തി സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: לְבַדּוֹ
  choice: മാത്രം
  rationale: ശിക്ഷ പുരുഷനു മാത്രം ബാധകമാണെന്ന ഏകാന്തത/ഒഴിവാക്കൽ അർഥം വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: ലൈംഗിക അതിക്രമം മുഖ്യവാചകത്തിൽ എത്രത്തോളം വ്യക്തമാക്കണം
  choice: ‘അവളെ ബലമായി പിടിച്ച്’ എന്ന് നൽകി חזק എന്ന ക്രിയയിലെ നിർബന്ധം പ്രകടിപ്പിച്ചു; ‘ബലാത്സംഗം ചെയ്തു’ എന്ന് മുഖ്യവാചകത്തിൽ ചേർത്തില്ല.
  alternative: ‘അവളെ കീഴ്പ്പെടുത്തി’ അല്ലെങ്കിൽ ‘അവളെ ബലാത്സംഗം ചെയ്തു’
  rationale: സന്ദർഭം പ്രവൃത്തി സമ്മതമില്ലാത്തതാണെന്ന് വ്യക്തമാക്കുന്നു; എങ്കിലും ഉപയോഗിച്ചിരിക്കുന്ന പ്രത്യേക എബ്രായ ക്രിയ ‘പിടിക്കുക/കീഴ്പ്പെടുത്തുക’ എന്നതാണ്, നേരിട്ട് ‘ബലാത്സംഗം ചെയ്യുക’ എന്നല്ല. അതിനാൽ ഉറവിടത്തിന്റെ പദപ്രയോഗവും സന്ദർഭത്തിലെ നിർബന്ധവും ഒരുപോലെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യമായ നിയമശൈലി. ‘ശയിക്കുക’ എന്ന പരമ്പരാഗതവും ഇപ്പോഴും മനസ്സിലാകുന്നതുമായ ശൈലി ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കാൻ ഉപയോഗിച്ചു; അതിക്രമത്തിന്റെ സ്വഭാവം മറയാതിരിക്കാൻ ‘ബലമായി’ ചേർത്തു.
