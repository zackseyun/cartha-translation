id: DEU.22.21
reference: Deuteronomy 22:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הוֹצִ֨יאוּ אֶת ה/נער אֶל פֶּ֣תַח בֵּית אָבִ֗י/הָ וּ/סְקָלוּ/הָ֩ אַנְשֵׁ֨י עִירָ֤/הּ בָּ/אֲבָנִים֙ וָ/מֵ֔תָה כִּֽי עָשְׂתָ֤ה נְבָלָה֙ בְּ/יִשְׂרָאֵ֔ל לִ/זְנ֖וֹת בֵּ֣ית אָבִ֑י/הָ וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/021.yaml
  text: Then they shall bring out the young woman to the entrance of her father's house[a], and the men of her city shall stone her with stones, and she shall die, because she has committed an outrageous act in Israel by prostituting herself in her father's house[c][b]. So you shall purge the evil from your midst.
translation:
  language: ml
  text: അപ്പോൾ അവർ ആ യുവതിയെ[a] അവളുടെ അപ്പന്റെ വീടിന്റെ വാതിൽക്കലേക്കു പുറത്തുകൊണ്ടുവരണം; അവളുടെ പട്ടണത്തിലെ പുരുഷന്മാർ അവളെ കല്ലുകൾകൊണ്ട് എറിഞ്ഞ് കൊല്ലണം. അവളുടെ അപ്പന്റെ വീട്ടിൽ വേശ്യാവൃത്തി ചെയ്ത്[c] ഇസ്രായേലിൽ നിന്ദ്യമായ ഒരു പ്രവൃത്തി[b] ചെയ്തതിനാൽ അവൾ മരിക്കണം. അങ്ങനെ നിന്റെ മധ്യേനിന്ന് തിന്മ നീക്കിക്കളയണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പെൺകുട്ടി’ എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രായിലെ נַעַר എന്ന പദം സന്ദർഭമനുസരിച്ച് ഒരു യുവസ്ത്രീയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘ലജ്ജാകരമായ കാര്യം’ അല്ലെങ്കിൽ ‘ഹീനമായ പ്രവൃത്തി’ എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രായിലെ נְבָלָה ധാർമികമായി ഞെട്ടിക്കുന്ന നിന്ദ്യമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: ‘ലൈംഗിക ദുർന്നടപ്പിൽ ഏർപ്പെട്ട്’ എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രായിലെ זנה എന്ന ക്രിയ അക്ഷരാർഥത്തിൽ വേശ്യാവൃത്തിയെ ഓർമിപ്പിക്കുന്നതാണെങ്കിലും, കൂടുതൽ വിശാലമായി വിലക്കപ്പെട്ട ലൈംഗിക പെരുമാറ്റത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעַר
  choice: യുവതി
  rationale: സന്ദർഭം ഒരു യുവസ്ത്രീയെ സൂചിപ്പിക്കുന്നു. ‘യുവതി’ എന്നത് ആ അർഥം സ്വാഭാവികവും മാന്യവുമായി നൽകുന്നു; ഹീബ്രായരൂപത്തിന്റെ ‘പെൺകുട്ടി’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: פֶּתַח
  choice: പ്രവേശനം
  rationale: വീടിന്റെ തുറവിനെയോ പ്രവേശനസ്ഥാനത്തെയോ സൂചിപ്പിക്കുന്ന പദമാണിത്. നിയമപരമായ ഈ സന്ദർഭത്തിൽ ‘പ്രവേശനം’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: בֵּית אָבִיהָ
  choice: അവളുടെ അപ്പന്റെ വീട്
  rationale: ഹീബ്രായിലെ മൂർത്തമായ ‘അപ്പന്റെ വീട്’ എന്ന പ്രയോഗം സംരക്ഷിക്കുന്നു; ‘കുടുംബം’ എന്ന അർഥത്തിലേക്ക് വാചകത്തെ ചുരുക്കുന്നില്ല.
- source_word: וּסְקָלוּהָ ... בָּאֲבָנִים
  choice: അവളെ കല്ലുകൾകൊണ്ട് എറിഞ്ഞുകൊല്ലണം
  rationale: ക്രിയയോടൊപ്പം ‘കല്ലുകൾകൊണ്ട്’ എന്നും ഉറവിടം വ്യക്തമാക്കുന്നതിനാൽ ആ നിയമസൂത്രത്തിന്റെ ഊന്നൽ മലയാളത്തിലും നിലനിർത്തുന്നു.
- source_word: אַנְשֵׁי עִירָהּ
  choice: അവളുടെ പട്ടണത്തിലെ പുരുഷന്മാർ
  rationale: ഹീബ്രായിലെ ലിംഗനിർദ്ദിഷ്ടമായ ‘പുരുഷന്മാർ’ എന്ന പ്രയോഗം നിഷ്പക്ഷമായ ‘ആളുകൾ’ എന്നു മാറ്റാതെ സംരക്ഷിക്കുന്നു.
- source_word: נְבָלָה
  choice: കൊടുംനീചകൃത്യം
  rationale: ബുദ്ധിഹീനതയല്ല, സമൂഹത്തെ ഞെട്ടിക്കുന്ന ധാർമിക അപമാനവും അതിക്രമവുമാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്. ‘കൊടുംനീചകൃത്യം’ അതിന്റെ ശക്തമായ നിയമ-ധാർമിക ഭാവം നൽകുന്നു.
- source_word: לִזְנוֹת
  choice: വേശ്യാവൃത്തിയിൽ ഏർപ്പെട്ട്
  rationale: זנה എന്ന ക്രിയയിലെ വേശ്യാവൃത്തി/വ്യഭിചാരവുമായി ബന്ധപ്പെട്ട ശക്തമായ ദൃശ്യഭാവം സംരക്ഷിക്കുന്നു; പണം വാങ്ങിയുള്ള തൊഴിൽ മാത്രമാണ് ഉദ്ദേശ്യമെന്നു നിർബന്ധിക്കുന്നില്ലെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: അങ്ങനെ നിന്റെ മധ്യേനിന്ന് തിന്മ നീക്കിക്കളയണം
  rationale: ആവർത്തിച്ചുവരുന്ന ആവർത്തനപുസ്തക നിയമസൂത്രത്തിന്റെ സമൂഹത്തിൽനിന്നുള്ള തിന്മയുടെ നീക്കത്തെ വ്യക്തമായി നൽകുകയും ഏകവചന അഭിസംബോധനയായ ‘നിന്റെ’ എന്ന രൂപം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ലൈംഗിക-നിയമപരമായ പദപ്രയോഗത്തിന്റെ ശക്തി മയപ്പെടുത്താതെയും അതിരുകടന്ന് നിർവചിക്കാതെയും നൽകുക
  choice: ‘കൊടുംനീചകൃത്യം’, ‘വേശ്യാവൃത്തിയിൽ ഏർപ്പെട്ട്’ എന്നീ ശക്തമായ പ്രയോഗങ്ങൾ ഉപയോഗിച്ചു; രണ്ടാമത്തേതിന്റെ വിശാലമായ ലൈംഗിക അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
  alternative: ‘ലൈംഗിക അധാർമികത ചെയ്തു’ എന്ന വിശാല പ്രയോഗം മാത്രം ഉപയോഗിക്കുക, അല്ലെങ്കിൽ ‘അനുചിതമായി പെരുമാറി’ എന്ന മൃദുവായ ഭാഷ സ്വീകരിക്കുക.
  rationale: ഉറവിടത്തിലെ ധാർമിക-നിയമപരമായ ഗൗരവം മയപ്പെടുത്തരുത്; അതേസമയം വാചകത്തിൽ ഇല്ലാത്ത പിൽക്കാല സിദ്ധാന്തവിഭാഗങ്ങൾ അതിലേക്ക് ചേർക്കുകയും അരുത്.
- issue: നിയമനടപടി ചെയ്യുന്നവരുടെ ലിംഗനിർദ്ദിഷ്ട ഭാഷ
  choice: ‘അവളുടെ പട്ടണത്തിലെ പുരുഷന്മാർ’ എന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘അവളുടെ പട്ടണത്തിലെ ആളുകൾ’ അല്ലെങ്കിൽ ‘പട്ടണവാസികൾ’ എന്ന് ലിംഗനിഷ്പക്ഷമായി നൽകുക.
  rationale: ഹീബ്രായിലെ אַנְשֵׁי എന്ന പദം ഇവിടെ പുരുഷന്മാരെ വ്യക്തമായി പറയുന്നു; സന്ദർഭം അതിനെ പൊതുവായ ജനസമൂഹമായി മാറ്റാൻ നിർബന്ധിക്കുന്നില്ല.
- issue: വാക്യത്തിലെ ദൈവശാസ്ത്ര-നിയമപരമായ സമൂഹശുദ്ധീകരണ സൂത്രം
  choice: ‘നിന്റെ മധ്യേനിന്ന് തിന്മ നീക്കിക്കളയണം’ എന്ന ഏകവചന സമൂഹാഭിസംബോധന നിലനിർത്തി.
  alternative: ‘നിങ്ങളുടെ ഇടയിൽനിന്ന് ദുഷ്ടനെ നീക്കണം’ എന്ന് വ്യക്തിയെ സൂചിപ്പിക്കുന്നതായി പരിഭാഷപ്പെടുത്തുക.
  rationale: הָרָע എന്നത് ഇവിടെ ‘തിന്മ’ എന്നും ‘ദുഷ്ടൻ/ദുഷ്ടവസ്തു’ എന്നും ഗ്രഹിക്കാവുന്നെങ്കിലും, ഉറവിടത്തിന്റെ അമൂർത്തവും സവിശേഷവുമായ നിയമസൂത്രം ‘തിന്മ’ എന്ന വിവർത്തനം കൂടുതൽ നേരിട്ട് സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. നിയമഭാഷയുടെ ഗൗരവം നിലനിർത്തുന്നു. ‘അപ്പൻ’, ‘യുവതി’, ‘പട്ടണം’, ‘മധ്യേനിന്ന്’ എന്നീ പദങ്ങൾ സ്വാഭാവികതയും ഔപചാരികതയും സമതുലിതമാക്കുന്നു; കല്ലെറിയൽ, ലൈംഗിക കുറ്റാരോപണം, മരണശിക്ഷ എന്നിവയുടെ കാഠിന്യം മൃദൂകരിച്ചിട്ടില്ല.
