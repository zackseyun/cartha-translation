revisions:
- from: അപ്പോൾ ആ യുവതിയെ[a] അവളുടെ അപ്പന്റെ വീടിന്റെ പ്രവേശനത്തിങ്കലേക്കു കൊണ്ടുവരണം. അവളുടെ പട്ടണത്തിലെ പുരുഷന്മാർ അവളെ കല്ലുകൾകൊണ്ട് എറിഞ്ഞുകൊല്ലണം. തന്റെ അപ്പന്റെ വീട്ടിൽവെച്ച് വേശ്യാവൃത്തിയിൽ ഏർപ്പെട്ട്[c] ഇസ്രായേലിൽ ഒരു കൊടുംനീചകൃത്യം[b] ചെയ്തതിനാലാണ് അവൾ മരിക്കേണ്ടത്. അങ്ങനെ നിന്റെ മധ്യേനിന്ന് തിന്മ നീക്കിക്കളയണം.
  to: അപ്പോൾ അവർ ആ യുവതിയെ[a] അവളുടെ അപ്പന്റെ വീടിന്റെ വാതിൽക്കലേക്കു പുറത്തുകൊണ്ടുവരണം; അവളുടെ പട്ടണത്തിലെ പുരുഷന്മാർ അവളെ കല്ലുകൾകൊണ്ട് എറിഞ്ഞ് കൊല്ലണം. അവളുടെ അപ്പന്റെ വീട്ടിൽ വേശ്യാവൃത്തി ചെയ്ത്[c] ഇസ്രായേലിൽ നിന്ദ്യമായ ഒരു പ്രവൃത്തി[b] ചെയ്തതിനാൽ അവൾ മരിക്കണം. അങ്ങനെ നിന്റെ മധ്യേനിന്ന് തിന്മ നീക്കിക്കളയണം.
  rationale: The revision makes the doorway concrete, restores the direct legal consequence of death, and replaces an awkward, overly violent-sounding rendering of נְבָלָה with a natural equivalent. It retains the source’s gendered civic language and the strong harlotry imagery of זנה, with the latter’s broader semantic range preserved in a properly anchored footnote.
