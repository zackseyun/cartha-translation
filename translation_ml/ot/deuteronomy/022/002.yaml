base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/002.yaml
  text: But if your brother is not near you[a], and you do not know him, then you shall bring it into your house, and it shall remain with you until your brother seeks it[c][b]; then you shall restore it to him.
translation:
  language: ml
  text: എന്നാൽ നിന്റെ സഹോദരൻ നിന്റെ അടുത്തല്ലെങ്കിൽ[a], നിനക്ക് അവനെ അറിയില്ലെങ്കിൽ[b], അതിനെ നിന്റെ വീട്ടിലേക്കു കൊണ്ടുവരണം. നിന്റെ സഹോദരൻ അതിനെ അന്വേഷിക്കുന്നതുവരെ അതു നിന്റെ പക്കൽ സൂക്ഷിച്ചുവെക്കണം; പിന്നെ അതു അവനു മടക്കിക്കൊടുക്കണം.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘നിന്റെ സഹോദരൻ’ എന്നത് സ്വന്തം സഹോദരനെ മാത്രം അല്ല, ഉടമ്പടിസമൂഹത്തിലെ ഒരു സഹഅംഗത്തെയും വിശാലമായി സൂചിപ്പിക്കാം.
    reason: cultural_note
  - marker: b
    text: 'അക്ഷരാർഥം: ‘നീ അവനെ അറിയുന്നില്ലെങ്കിൽ’; സന്ദർഭത്തിൽ, നഷ്ടപ്പെട്ട വസ്തുവിന്റെ ഉടമ ആരാണെന്ന് അറിയാത്തതാണു സൂചന.'
    reason: lexical_alternative
  - marker: c
    text: 'മറ്റൊരു പരിഭാഷ: ‘അതു അവനു തിരികെ കൊടുക്കണം.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָחִיךָ
  choice: നിന്റെ സഹോദരൻ
  rationale: എബ്രായത്തിലെ ബന്ധുത്വഭാഷ നേരിട്ട് നിലനിർത്തുന്നു; ഈ നിയമസന്ദർഭത്തിൽ ഇത് ജൈവസഹോദരനെ മാത്രം അല്ല, ഉടമ്പടിസമൂഹത്തിലെ സഹഅംഗത്തെയും വിശാലമായി സൂചിപ്പിക്കാം.
- source_word: קָרוֹב אֵלֶיךָ
  choice: നിന്റെ അടുത്തല്ലെങ്കിൽ
  rationale: ഭൗതികസാമീപ്യം സൂചിപ്പിക്കുന്ന പ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְלֹא יְדַעְתּוֹ
  choice: അവൻ ആരാണെന്ന് നിനക്കറിയില്ലെങ്കിൽ
  rationale: അക്ഷരാർഥത്തിലെ പുരുഷ ഏകവചനമായ ‘അവനെ അറിയുന്നില്ല’ എന്നതിന്റെ വ്യാകരണബന്ധം ഉടമയോടാണ്; മലയാളത്തിൽ ഉദ്ദേശ്യം വ്യക്തമാക്കുമ്പോഴും ആ ബന്ധം നിലനിർത്തുന്നു.
- source_word: וַאֲסַפְתּוֹ אֶל־תּוֹךְ בֵּיתֶךָ
  choice: അതിനെ നിന്റെ വീട്ടിലേക്കു കൊണ്ടുവരണം
  rationale: നഷ്ടപ്പെട്ട മൃഗത്തെയോ വസ്തുവെയോ വീട്ടിനകത്തേക്ക് ഏറ്റെടുക്കുന്ന പ്രവൃത്തിയെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: וְהָיָה עִמְּךָ
  choice: അതു നിന്റെ പക്കൽ ഇരിക്കട്ടെ
  rationale: ഒരു കാലയളവോളം സംരക്ഷണത്തിൽ തുടരുക എന്ന സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു.
- source_word: עַד דְּרֹשׁ אָחִיךָ אֹתוֹ
  choice: നിന്റെ സഹോദരൻ അതിനെ അന്വേഷിക്കുന്നതുവരെ
  rationale: דרש എന്ന ക്രിയയുടെ അന്വേഷിക്കുക, അന്വേഷിച്ചുവരുക, അവകാശപ്പെടുക എന്നീ സാധ്യതകളിൽ അടിസ്ഥാനമായ ‘അന്വേഷിക്കുക’ നിലനിർത്തുന്നു.
- source_word: וַהֲשֵׁבֹתוֹ לוֹ
  choice: അതു അവനു തിരികെ കൊടുക്കണം
  rationale: ഹിഫിൽ രൂപത്തിന്റെ ‘തിരികെ എത്തിക്കുക/മടക്കിക്കൊടുക്കുക’ എന്ന നിയമപരമായ അർഥം സാധാരണ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ‘സഹോദരൻ’ എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: മുഖ്യവാചകത്തിൽ ‘നിന്റെ സഹോദരൻ’ നിലനിർത്തി, വിശാലമായ സാമൂഹിക അർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
  alternative: ‘നിന്റെ സഹഇസ്രായേല്യൻ’ എന്ന് വ്യാഖ്യാനപരമായി വിവർത്തനം ചെയ്യുക.
  rationale: മൂലത്തിലെ ബന്ധുത്വരൂപകം മായ്ച്ചുകളയാതെ അതിന്റെ നിയമസന്ദർഭത്തിലെ വിശാല പ്രയോഗം വായനക്കാരനെ അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമനിർദേശശൈലി. ഏകവചന രണ്ടാംപുരുഷരൂപവും മൂലത്തിലെ ‘സഹോദരൻ’ എന്ന ബന്ധുത്വഭാഷയും നിലനിർത്തി; അവ്യക്തത ആവശ്യമായിടത്ത് അടിക്കുറിപ്പിലൂടെ വിശദീകരിച്ചു.
