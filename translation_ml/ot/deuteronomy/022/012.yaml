  yaml_path: translation/ot/deuteronomy/022/012.yaml
  text: You shall make tassels for yourself on the four corners of your covering with which you cover yourself[a][b].
translation:
  language: ml
  text: നീ നിന്നെത്തന്നെ മൂടുന്ന നിന്റെ വസ്ത്രത്തിന്റെ നാലു കോണുകളിലും നിനക്കായി തൊങ്ങലുകൾ ഉണ്ടാക്കണം.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തൊങ്ങലുകൾ’ എന്നതിന് ‘പിരിച്ച ചരടുകൾ’ അല്ലെങ്കിൽ ‘അരികുനൂലുകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ‘നിന്റെ മൂടുവസ്ത്രം’; ‘നിന്റെ വസ്ത്രം’ അല്ലെങ്കിൽ ‘നിന്റെ മേലങ്കി’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּדִלִים
  choice: തൂങ്ങുനൂലുകൾ
  rationale: വസ്ത്രത്തിന്റെ കോണുകളിൽ ഘടിപ്പിക്കുന്ന തൂങ്ങിക്കിടക്കുന്ന നൂൽക്കൂട്ടങ്ങളെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്. ആധുനിക മലയാളത്തിൽ അർഥം സ്വാഭാവികമായി അറിയിക്കുന്നതിനായി ‘തൂങ്ങുനൂലുകൾ’ തിരഞ്ഞെടുത്തു; പിരിച്ച നൂൽക്കൂട്ടങ്ങൾ, അരികുനൂലുകൾ എന്നിവയും സാധ്യതകളാണ്.
- source_word: תַּעֲשֶׂה לָּךְ
  choice: നീ ... ഉണ്ടാക്കണം
  rationale: നിയമപരമായ നിർദേശം സൂചിപ്പിക്കുന്ന രണ്ടാംപുരുഷ ഏകവചന രൂപം മലയാളത്തിൽ ‘ഉണ്ടാക്കണം’ എന്നു സ്വാഭാവികമായി വരുന്നു. לָּךְ എന്നത് ഉദ്ദേശ്യവ്യക്തിയെ ഊന്നുന്നുവെങ്കിലും, ഉടമസ്ഥസൂചനയും നേരിട്ടുള്ള കല്പനയും ചേർന്ന് മലയാളവാക്യത്തിൽ ആ ആശയം മതിയായ വിധം നൽകുന്നു.
- source_word: עַל אַרְבַּע כַּנְפוֹת
  choice: നാലു കോണുകളിലും
  rationale: כָּנָף എന്നതിന് അക്ഷരാർഥത്തിൽ ‘ചിറക്’ എന്നും പൊതുവായി ‘അറ്റം’ എന്നും വരാമെങ്കിലും, വസ്ത്രസന്ദർഭത്തിൽ അതിന്റെ നാലു കോണുകളാണ് ഉദ്ദേശ്യം. עַל എന്ന സ്ഥലബന്ധം മലയാളത്തിലെ ‘-കളിലും’ എന്ന രൂപത്തിൽ സ്വാഭാവികമായി ഉൾപ്പെടുത്തി.
- source_word: כְּסוּתְךָ
  choice: നിന്റെ മേലങ്കി
  rationale: മൂടാനുപയോഗിക്കുന്ന വസ്ത്രമോ പുതപ്പോ മേലങ്കിയോ സൂചിപ്പിക്കുന്ന പദമാണിത്. ഈ സന്ദർഭത്തിൽ ശരീരത്തെ മൂടുന്ന വസ്ത്രം എന്ന ആശയം സ്വാഭാവികമായി നൽകാൻ ‘മേലങ്കി’ ഉപയോഗിച്ചു; മൂലപദത്തിന്റെ വിശാലത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: אֲשֶׁר תְּכַסֶּה בָּהּ
  choice: നിന്നെത്തന്നെ മൂടുന്ന
  rationale: כסה എന്ന ക്രിയയുടെ ‘മൂടുക’ എന്ന അടിസ്ഥാനാർഥവും, בָּהּ സൂചിപ്പിക്കുന്ന ആ വസ്ത്രംകൊണ്ടുള്ള പ്രവർത്തനവും സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
