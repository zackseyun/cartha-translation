  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമനിർദേശ ശൈലി. വസ്ത്രത്തിന്റെ കൃത്യമായ ഇനം മൂലത്തിൽ നിർണയിക്കപ്പെടാത്തതിനാൽ പ്രധാനപാഠം സ്വാഭാവികമായി വായിക്കാവുന്ന വിധം നൽകിയതോടൊപ്പം മറ്റ് സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
