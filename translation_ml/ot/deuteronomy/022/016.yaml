source:
  edition: WLC
  text: וְ/אָמַ֛ר אֲבִ֥י ה/נער אֶל הַ/זְּקֵנִ֑ים אֶת בִּתִּ֗/י נָתַ֜תִּי לָ/אִ֥ישׁ הַ/זֶּ֛ה לְ/אִשָּׁ֖ה וַ/יִּשְׂנָאֶֽ/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/016.yaml
  text: And the young woman’s father shall say to the elders[a], ‘I gave my daughter to this man as a wife, and he hates her.’
translation:
  language: ml
  text: 'യുവതിയുടെ പിതാവ് മൂപ്പന്മാരോടു പറയണം: “ഞാൻ എന്റെ മകളെ ഈ പുരുഷനു ഭാര്യയായി കൊടുത്തു; അവൻ അവളെ വെറുക്കുന്നു.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൻ അവളെ വെറുത്തുതുടങ്ങിയിരിക്കുന്നു.” ഹീബ്രു ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘വെറുക്കുക’ എന്നാണ്; അത് ഇപ്പോഴുള്ള മനോഭാവമായോ രൂപപ്പെട്ടുവന്ന മനോഭാവമായോ ഇവിടെ മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַר
  choice: അപ്പോൾ ... പറയണം
  rationale: നിയമപരമായ നടപടിക്രമത്തിന്റെ പശ്ചാത്തലത്തിൽ ഈ ക്രിയാരൂപം ഒരു കേസുണ്ടാകുമ്പോൾ ചെയ്യേണ്ട കാര്യം നിർദേശിക്കുന്നു; അതിനാൽ സാധാരണ ഭൂതകാലത്തിനുപകരം ‘പറയണം’ എന്നു നൽകി.
- source_word: אֲבִי הַנַּעַר
  choice: ആ യുവതിയുടെ പിതാവ്
  rationale: വിവാഹപ്രായത്തിലുള്ള സ്ത്രീയെ സൂചിപ്പിക്കുന്ന സന്ദർഭത്തിൽ ‘യുവതി’ ആധുനികവും സ്വാഭാവികവുമാണ്; ‘പിതാവ്’ ഗൗരവമുള്ള നിയമഭാഷയ്ക്കു യോജിക്കുന്നു.
- source_word: הַזְּקֵנִים
  choice: മൂപ്പന്മാർ
  rationale: ഇവിടെ വെറും പ്രായംചെന്ന പുരുഷന്മാരെയല്ല, അംഗീകൃത സാമൂഹിക-ന്യായനിർവഹണ നേതാക്കളെയാണ് പദം സൂചിപ്പിക്കുന്നത്.
- source_word: אֶת בִּתִּי
  choice: എന്റെ മകളെ
  rationale: നേരിട്ടുള്ള കർമസൂചകം മലയാളത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്തേണ്ടതില്ല; בִּתִּי എന്നത് നേരിട്ട് ‘എന്റെ മകൾ’ എന്നാണ്.
- source_word: נָתַתִּי
  choice: കൊടുത്തു
  rationale: വിവാഹക്രമീകരണത്തിൽ മകളെ വിവാഹത്തിനു നൽകുക എന്ന പതിവാർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: לָאִישׁ הַזֶּה
  choice: ഈ പുരുഷനു
  rationale: אִישׁ എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘പുരുഷൻ’ നിലനിർത്തുന്നു; തുടർന്നുള്ള ‘ഭാര്യയായി’ എന്ന പ്രയോഗം വിവാഹബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: לְאִשָּׁה
  choice: ഭാര്യയായി
  rationale: വിവാഹബന്ധത്തെ സൂചിപ്പിക്കുന്ന ഈ ഹീബ്രു പ്രയോഗത്തിന് സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: וַיִּשְׂנָאֶהָ
  choice: എന്നാൽ അവൻ അവളെ വെറുക്കുന്നു
  rationale: שָׂנֵא എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥമായ ‘വെറുക്കുക’ സംരക്ഷിക്കുന്നു. സന്ദർഭത്തിലെ വൈരുധ്യം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘എന്നാൽ’ ഉപയോഗിച്ചു; ക്രിയയെ ഇപ്പോഴുള്ള മനോഭാവമായി അവതരിപ്പിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, നിയമപരമായ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ രൂപം. നേരിട്ടുള്ള പ്രസ്താവനയ്ക്ക് സ്വാഭാവികമായ മലയാള വാക്യക്രമം ഉപയോഗിച്ചു.
