source:
  edition: WLC
  text: וְ/שָׂ֥ם לָ/הּ֙ עֲלִילֹ֣ת דְּבָרִ֔ים וְ/הוֹצִ֥יא עָלֶ֖י/הָ שֵׁ֣ם רָ֑ע וְ/אָמַ֗ר אֶת הָ/אִשָּׁ֤ה הַ/זֹּאת֙ לָקַ֔חְתִּי וָ/אֶקְרַ֣ב אֵלֶ֔י/הָ וְ/לֹא מָצָ֥אתִי לָ֖/הּ בְּתוּלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/014.yaml
  text: and he charges her with false accusations and brings a bad name upon her[a], saying, ‘I took this woman, and when I came near to her[d][c][b], I did not find evidence of virginity in her.’
translation:
  language: ml
  text: 'അവളുടെമേൽ അപകീർത്തികരമായ ആരോപണങ്ങൾ ചുമത്തി[a], അവൾക്കു ദുഷ്പേരു വരുത്തിക്കൊണ്ട്[b] അവൻ ഇങ്ങനെ പറഞ്ഞാൽ: “ഞാൻ ഈ സ്ത്രീയെ വിവാഹം കഴിച്ചു; എന്നാൽ ഞാൻ അവളോടു ചേർന്നപ്പോൾ[c], അവളിൽ കന്യകാത്വത്തിന്റെ തെളിവ് കണ്ടില്ല[d].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അവളുടെമേൽ വ്യാജാരോപണങ്ങൾ ചുമത്തി.” എബ്രായപ്രയോഗം അപകീർത്തിപ്പെടുത്തുന്ന കുറ്റാരോപണങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ “അവൾക്കെതിരെ ഒരു ചീത്ത പേര് പുറപ്പെടുവിച്ച്”; അതായത്, അവളെ അപകീർത്തിപ്പെടുത്തി.
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ “ഞാൻ അവളുടെ അടുത്തു ചെന്നപ്പോൾ.” ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ സൗമ്യോക്തിയാണിത്.
    reason: lexical_alternative
  - marker: d
    text: അക്ഷരാർഥത്തിൽ “അവൾക്കു കന്യകാത്വം കണ്ടില്ല.” തുടർന്നുള്ള വാക്യങ്ങൾ വ്യക്തമാക്കുന്നതുപോലെ, ഇവിടെ കന്യകാത്വത്തിന്റെ അടയാളങ്ങളെയോ തെളിവിനെയോ ഉദ്ദേശിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: וְשָׂם לָהּ עֲלִילֹת דְּבָרִים
  choice: അവളുടെമേൽ അപകീർത്തികരമായ ആരോപണങ്ങൾ ചുമത്തി
  rationale: ശׂים + לְ എന്ന പ്രയോഗം ഒരാളുടെമേൽ കുറ്റാരോപണം ചുമത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. עֲלִילֹת דְּבָרִים എന്ന അപൂർവ പ്രയോഗത്തിന്റെ അപകീർത്തിപ്പെടുത്തുന്ന നിയമപരമായ ഭാവം ‘അപകീർത്തികരമായ ആരോപണങ്ങൾ’ സ്വാഭാവികമായി അറിയിക്കുന്നു; ‘വ്യാജം’ എന്നു മുഖ്യപാഠത്തിൽ ചേർത്ത് സ്രോതസ്സിലെ സൂചനയെ അതിവ്യക്തമാക്കുന്നില്ല.
- source_word: וְהוֹצִיא עָלֶיהָ שֵׁם רָע
  choice: അവൾക്കു ദുഷ്പേരു വരുത്തിക്കൊണ്ട്
  rationale: ‘ചീത്ത പേര് പുറപ്പെടുവിക്കുക’ എന്ന എബ്രായ രൂപകത്തെ മലയാളത്തിലെ സ്വാഭാവികമായ ‘ദുഷ്പേരു വരുത്തുക’ എന്ന പ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: הָאִשָּׁה הַזֹּאת לָקַחְתִּי
  choice: ഞാൻ ഈ സ്ത്രീയെ വിവാഹം കഴിച്ചു
  rationale: ലָקַחְתִּי എന്നത് വിവാഹസന്ദർഭത്തിൽ ‘ഭാര്യയായി സ്വീകരിച്ചു/വിവാഹം കഴിച്ചു’ എന്നാണ്. ‘ഈ സ്ത്രീ’ എന്ന അകലം സൂചിപ്പിക്കുന്ന പ്രകടനം നിലനിർത്തിക്കൊണ്ട്, മലയാളത്തിൽ ‘എടുത്തു’ എന്ന അസ്വാഭാവികവും തെറ്റിദ്ധരിപ്പിക്കാവുന്നതുമായ പദത്തിന് പകരം വിവാഹാർഥം വ്യക്തമാക്കുന്നു.
- source_word: וָאֶקְרַב אֵלֶיהָ
  choice: ഞാൻ അവളോടു ചേർന്നപ്പോൾ
  rationale: ലൈംഗികബന്ധത്തിനുള്ള മാന്യമായ എബ്രായ സൗമ്യോക്തിയെ മലയാളത്തിലെ സ്വാഭാവികവും അതേവിധം പരോക്ഷവുമായ പ്രയോഗത്തിലൂടെ പകരുന്നു.
- source_word: וְלֹא מָצָאתִי לָהּ בְּתוּלִים
  choice: അവളിൽ കന്യകാത്വത്തിന്റെ തെളിവ് കണ്ടില്ല
  rationale: തുടർന്നുള്ള വാക്യങ്ങൾ വ്യക്തമാക്കുന്ന നിയമപരമായ സാഹചര്യത്തിൽ ബְּתוּלִים എന്ന ബഹുവചനം കന്യകാത്വത്തിന്റെ അടയാളങ്ങളെയോ തെളിവിനെയോ സൂചിപ്പിക്കുന്നു. ‘തെളിവ്’ ഈ അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: עֲלִילֹת דְּבָרִים എന്ന പ്രയോഗത്തിൽ ആരോപണങ്ങൾ ‘വ്യാജം’ ആണെന്ന് മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കണമോ
  choice: ‘അപകീർത്തികരമായ ആരോപണങ്ങൾ’ എന്ന് പരിഭാഷപ്പെടുത്തി വ്യാജത്വം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു
  alternative: ‘വ്യാജ ആരോപണങ്ങൾ’
  rationale: നിയമസന്ദർഭം ആരോപണങ്ങളുടെ വ്യാജത്വം സൂചിപ്പിക്കുന്നുണ്ടെങ്കിലും, ഈ അപൂർവ എബ്രായ പ്രയോഗം അതിനെ എത്രമാത്രം നേരിട്ട് പറയുന്നു എന്നതിൽ വ്യാഖ്യാനസാധ്യതയുണ്ട്. അതിനാൽ സന്ദർഭത്തിന്റെ അപകീർത്തികരമായ സ്വഭാവം മുഖ്യപാഠത്തിൽ നൽകി, കൂടുതൽ നിർണ്ണായകമായ ‘വ്യാജം’ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും നിയമസന്ദർഭത്തിന് യോജിച്ചതുമായ ശൈലി സ്വീകരിച്ചു. ലൈംഗികബന്ധത്തെക്കുറിച്ചുള്ള സ്രോതസ്സിലെ സൗമ്യോക്തി നിലനിർത്തി; അപൂർവമായ ആരോപണപ്രയോഗത്തിലെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
