  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/שָֽׁלְחוּ֙ זִקְנֵ֣י עִיר֔/וֹ וְ/לָקְח֥וּ אֹת֖/וֹ מִ/שָּׁ֑ם וְ/נָתְנ֣וּ אֹת֗/וֹ בְּ/יַ֛ד גֹּאֵ֥ל הַ/דָּ֖ם וָ/מֵֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/012.yaml
  text: then the elders of his city shall send and take him from there and hand him over to the avenger of blood[a], and he shall die.
translation:
  language: ml
  text: അപ്പോൾ അവന്റെ നഗരത്തിലെ മൂപ്പന്മാർ ആളയച്ച് അവനെ അവിടെനിന്ന് കൊണ്ടുവന്ന് രക്തപ്രതികാരകന്റെ[a] കൈയിൽ ഏൽപ്പിക്കണം; അവൻ മരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “രക്തത്തിന് പ്രതികാരം ചെയ്യുന്നവൻ.” എബ്രായയിലെ גֹּאֵל הַדָּם എന്നത് രക്തച്ചൊരിച്ചിലിന് പ്രതികാരം ചെയ്യാനുള്ള ഉത്തരവാദിത്വമുള്ള വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക നിയമപ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁלְחוּ
  choice: ആളയച്ച്
  rationale: നിയമനിർദേശത്തിന്റെ പശ്ചാത്തലത്തിൽ മൂപ്പന്മാർ ഒരാളെ അയച്ച് നടപടി നടത്തുന്നതാണ് സൂചന. മലയാളത്തിൽ ‘ആളയച്ച്’ സ്വാഭാവികമായി ഈ അർഥം നൽകുന്നു.
- source_word: זִקְנֵי עִירוֹ
  choice: അവന്റെ നഗരത്തിലെ മൂപ്പന്മാർ
  rationale: זִקְנֵי എന്നത് അംഗീകൃത നഗരനേതാക്കളെയും עִיר നഗരം/പട്ടണം എന്ന ഭരണസമൂഹത്തെയും സൂചിപ്പിക്കുന്നു; പതിവായ ബൈബിൾ-നിയമപ്രയോഗമായി ‘നഗരത്തിലെ മൂപ്പന്മാർ’ നിലനിർത്തി.
- source_word: וְלָקְחוּ אֹתוֹ מִשָּׁם
  choice: അവനെ അവിടെനിന്ന് കൊണ്ടുവന്ന്
  rationale: לקח എന്ന പൊതുവായ ‘എടുക്കുക/കൊണ്ടുവരുക’ എന്ന അർഥം നിലനിർത്തുന്നു; ബലംപ്രയോഗിച്ചുള്ള പിടിച്ചെടുക്കൽ എന്ന് മൂലപാഠത്തിൽ ഇല്ലാത്ത വിശദീകരണം ചേർക്കുന്നില്ല.
- source_word: וְנָתְנוּ אֹתוֹ בְּיַד
  choice: കൈയിൽ ഏൽപ്പിക്കണം
  rationale: נתן ביד എന്ന പ്രയോഗം ഒരാളെ മറ്റൊരാളുടെ അധികാരത്തിൽ ഏൽപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘കൈയിൽ ഏൽപ്പിക്കുക’ എന്നത് മൂലരൂപവും നിയമപരമായ കൈമാറ്റവും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
- source_word: גֹּאֵל הַדָּם
  choice: രക്തപ്രതികാരകൻ
  rationale: രക്തച്ചൊരിച്ചിലിന് പ്രതികാരം ചെയ്യാനുള്ള ഉത്തരവാദിത്വമുള്ള വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക നിയമപദമാണിത്. ‘രക്തപ്രതികാരകൻ’ സംക്ഷിപ്തവും സുതാര്യവുമായ മലയാളസമാനപദമാണ്.
- source_word: וָמֵת
  choice: അവൻ മരിക്കണം
  rationale: തുടർച്ചയായ നിയമനിർദേശത്തിന്റെ നിർബന്ധസ്വഭാവവും കൈമാറ്റത്തെ തുടർന്നുള്ള മരണഫലവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമശൈലി. വാക്യത്തിന്റെ ഹ്രസ്വവും നിർദേശാത്മകവുമായ സ്വഭാവം നിലനിർത്തി; മൂലപാഠത്തിൽ വ്യക്തമാക്കാത്ത ബലപ്രയോഗമോ ബന്ധുത്വമോ മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
