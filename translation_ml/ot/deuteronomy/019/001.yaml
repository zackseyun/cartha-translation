reference: Deuteronomy 19:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּֽי יַכְרִ֞ית יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֶת הַ/גּוֹיִ֔ם אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ אֶת אַרְצָ֑/ם וִֽ/ירִשְׁתָּ֕/ם וְ/יָשַׁבְתָּ֥ בְ/עָרֵי/הֶ֖ם וּ/בְ/בָתֵּי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/001.yaml
  text: When Yahweh your God cuts off the nations whose land Yahweh your God is giving you[a], and you dispossess them and dwell in their cities and houses,
translation:
  language: ml
  text: നിന്റെ ദൈവമായ യഹോവ അവരുടെ ദേശം നിനക്കു നൽകുന്ന ആ ജനതകളെ വെട്ടിമാറ്റുമ്പോൾ[a], നീ അവരെ നീക്കിക്കളഞ്ഞ് അവരുടെ പട്ടണങ്ങളിലും വീടുകളിലും താമസിക്കുമ്പോൾ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നശിപ്പിക്കുമ്പോൾ” അല്ലെങ്കിൽ “നീക്കിക്കളയുമ്പോൾ”; എബ്രായത്തിൽ അക്ഷരാർഥം “വെട്ടിമാറ്റുമ്പോൾ.”
    reason: יַכְרִית എന്ന പദത്തിന്റെ മൂർത്തമായ എബ്രായ പ്രയോഗവും സന്ദർഭാനുസൃത അർഥവികല്പങ്ങളും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: כִּי
  choice: …ചെയ്യുമ്പോൾ
  rationale: തുടർന്നുവരുന്ന കല്പനകൾ പ്രാബല്യത്തിൽ വരുന്ന, പ്രതീക്ഷിക്കപ്പെടുന്ന ഭാവിസാഹചര്യത്തെ ഇവിടെ സൂചിപ്പിക്കുന്നതിനാൽ സോപാധികമായ ‘എങ്കിൽ’ എന്നതിനെക്കാൾ കാലസൂചകമായ ‘ചെയ്യുമ്പോൾ’ യോജിക്കുന്നു.
- source_word: יַכְרִית
  choice: ഛേദിച്ചുകളയുന്നു
  rationale: ഹിഫീൽ രൂപം ജനതകളെ നീക്കിക്കളയുക/നശിപ്പിക്കുക എന്നർഥം നൽകുന്നു. ‘ഛേദിച്ചുകളയുക’ എബ്രായത്തിലെ മൂർത്തമായ പ്രയോഗവും നിയമ-ഉടമ്പടി ഭാവവും നിലനിർത്തുന്നു; സ്വാഭാവിക മലയാളത്തിനായി അടിക്കുറിപ്പിൽ അർഥവികല്പങ്ങൾ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരിയെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായ ‘യഹോവ’ എന്നു നൽകുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: രണ്ടാംപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയം കൃത്യമായി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: הַגּוֹיִם
  choice: ജനതകളെ
  rationale: ഗോയ് എന്ന പദത്തിന്റെ ദേശീയ-ജനവിഭാഗ അർഥം നിലനിർത്തുന്നു; പിൽക്കാലത്തെ ‘ജാതികൾ/Gentiles’ എന്ന പ്രത്യേക മതസൂചന ഒഴിവാക്കുന്നു.
- source_word: נֹתֵן לְךָ
  choice: നിനക്കു നൽകുന്ന
  rationale: വർത്തമാന കൃതന്തത്തിന്റെ പുരോഗമിക്കുന്നതും ഉറപ്പുള്ളതുമായ ദാനഭാവം മലയാളത്തിലെ വിശേഷണപ്രയോഗത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: אֶת אַרְצָם
  choice: ദേശത്തിലെ
  rationale: എബ്രായത്തിൽ അക്ഷരാർഥം ‘അവരുടെ ദേശം’ എന്നാണ്. മലയാളത്തിൽ ബന്ധവാക്യം സ്വാഭാവികമാക്കാൻ ‘നിനക്കു നൽകുന്ന ദേശത്തിലെ ജനതകൾ’ എന്നു പുനഃക്രമീകരിച്ചെങ്കിലും ദേശം അവരുടേതായിരുന്നുവെന്ന ബന്ധം സന്ദർഭത്തിൽ നിലനിൽക്കുന്നു.
- source_word: וִירִשְׁתָּם
  choice: നീ അവരെ നീക്കിക്കളഞ്ഞ്
  rationale: വ്യക്തികളെ സൂചിപ്പിക്കുന്ന കർമപ്രത്യയം ഉള്ളതിനാൽ ഇവിടെ അർഥം അവരെ അവകാശമാക്കുക എന്നതല്ല, അവരുടെ സ്ഥാനത്തുനിന്ന് പുറത്താക്കുക എന്നതാണ്.
- source_word: וְיָשַׁבְתָּ
  choice: താമസിക്കുമ്പോൾ
  rationale: പാർക്കുക/കുടിയേറിപ്പാർക്കുക എന്ന ആശയം സാധാരണ വായനക്കാർക്കു വ്യക്തമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְעָרֵיהֶם וּבְבָתֵּיהֶם
  choice: അവരുടെ പട്ടണങ്ങളിലും വീടുകളിലും
  rationale: രണ്ടു നാമങ്ങളോടുമുള്ള സ്ഥലസൂചകവും മൂന്നാംപുരുഷ ബഹുവചന ഉടമസ്ഥതയും വ്യക്തമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വേ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരംവയ്ക്കാതെ നിലനിർത്തുന്നു. മലയാള ബൈബിൾ വായനയിൽ പരിചിതവും മാന്യവുമായ ‘യഹോവ’ ഉപയോഗിച്ചു; ഉച്ചാരണപുനർനിർമാണത്തിലെ അനിശ്ചിതത്വത്തെക്കുറിച്ച് ഈ വാക്യത്തിൽ അനാവശ്യമായി തീർപ്പുകൽപ്പിക്കുന്നില്ല.
- issue: ദേശത്തിലെ ജനതകളെ നീക്കുന്നതിൽ ദൈവിക പ്രവർത്തനവും ഇസ്രായേലിന്റെ പ്രവർത്തനവും
  choice: യഹോവ ‘ഛേദിച്ചുകളയുന്നു’; ഇസ്രായേൽ ‘അവരെ നീക്കിക്കളയുന്നു’
  alternative: രണ്ടു ക്രിയകളെയും പൊതുവായി ‘നശിപ്പിക്കുന്നു’ എന്നു പരിഭാഷപ്പെടുത്തുക
  rationale: മൂലപാഠം ദൈവത്തിന്റെ പ്രവർത്തനത്തിനും ഇസ്രായേലിന്റെ തുടർപ്രവർത്തനത്തിനും വ്യത്യസ്ത ക്രിയകൾ ഉപയോഗിക്കുന്നു. ആ സംഘർഷവും പ്രവർത്തകഭേദവും സമതലപ്പെടുത്താതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായിക്കാൻ എളുപ്പമുള്ളതുമായ നിയമ-വിവരണ ശൈലി. വാക്യം അടുത്ത കല്പനയിലേക്കു തുടരുമെന്നതിനാൽ അവസാനം കോമ നിലനിർത്തി. രണ്ടാംപുരുഷ ഏകവചനം മുഴുവൻ സംരക്ഷിച്ചു.
