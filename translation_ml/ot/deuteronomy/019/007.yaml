  text: עַל כֵּ֛ן אָנֹכִ֥י מְצַוְּ/ךָ֖ לֵ/אמֹ֑ר שָׁלֹ֥שׁ עָרִ֖ים תַּבְדִּ֥יל לָֽ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/007.yaml
  text: Therefore I am commanding you[a], saying, ‘You shall set apart three cities for yourself.’
translation:
  language: ml
  text: 'അതുകൊണ്ട് ഞാൻ നിന്നോടു ഇപ്രകാരം കൽപ്പിക്കുന്നു: ‘നിനക്കായി മൂന്നു പട്ടണങ്ങൾ വേർതിരിച്ചുവെക്കണം[a].’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിനക്കായി മൂന്നു പട്ടണങ്ങൾ നിയോഗിക്കണം.’ എബ്രായ ക്രിയയ്ക്ക് ‘വേർതിരിക്കുക,’ ‘വേർതിരിച്ചുവെക്കുക,’ അല്ലെങ്കിൽ ഈ സന്ദർഭത്തിൽ ‘നിയോഗിക്കുക’ എന്നിങ്ങനെ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: അതുകൊണ്ട്
  rationale: മുൻസന്ദർഭത്തിൽനിന്നുള്ള നിഗമനത്തെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: אָנֹכִי מְצַוְּךָ לֵאמֹר
  choice: ഞാൻ നിന്നോടു കല്പിക്കുന്നത് ഇതാണ്
  rationale: സ്വതന്ത്ര സർവനാമത്തിന്റെ ലഘുവായ ഊന്നലും കല്പനയുടെ ഇപ്പോഴത്തെ നേരിട്ടുള്ള സ്വഭാവവും നിലനിർത്തുന്നു; לֵאמֹר എന്ന ഉദ്ധരണി-ആമുഖം മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഇതാണ്’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: שָׁלֹשׁ עָרִים
  choice: മൂന്നു പട്ടണങ്ങൾ
  rationale: സംഖ്യയും നാമവും നേരിട്ട്, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: תַּבְדִּיל
  choice: വേർതിരിച്ചുവെക്കണം
  rationale: בדל എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള ‘വേർതിരിക്കുക/പ്രത്യേകമായി മാറ്റിവെക്കുക’ എന്ന അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ ഔദ്യോഗിക നിയോഗവും സൂചിപ്പിക്കുന്നു.
- source_word: לָךְ
  choice: നിനക്കായി
  rationale: രണ്ടാം പുരുഷ ഏകവചന പ്രത്യയത്തോടുകൂടിയ മുൻവാക്ക്, അഭിസംബോധിതന്റെ ഉപയോഗത്തിനോ പ്രയോജനത്തിനോ വേണ്ടിയുള്ള നടപടി എന്ന നിലയിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ഉടമ്പടി നിയമത്തിലെ രണ്ടാം പുരുഷ പുല്ലിംഗ ഏകവചന അഭിസംബോധന
  choice: ‘നിന്നോടു’, ‘നിനക്കായി’ എന്നീ ഏകവചന രൂപങ്ങൾ നിലനിർത്തി.
  alternative: കൂട്ടായ അഭിസംബോധന വ്യക്തമാക്കാൻ ‘നിങ്ങൾ’ എന്ന ബഹുവചനം ഉപയോഗിക്കുക, അല്ലെങ്കിൽ കർമണിപ്രയോഗമാക്കുക.
  rationale: എബ്രായ ഉടമ്പടി നിയമത്തിൽ ഇസ്രായേലിനെ പലപ്പോഴും ഏകവചനത്തിൽ അഭിസംബോധന ചെയ്യുന്നു. ഏകവചനം നിലനിർത്തുന്നത് മൂലപാഠത്തിന്റെ വാഗ്‌രൂപം സംരക്ഷിക്കുകയും വ്യാഖ്യാനപരമായ വികസനം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നിയമഭാഷയുടെ നേരിട്ടുള്ള സ്വഭാവം സൂക്ഷിച്ചുകൊണ്ട് വാക്കുതോറുമുള്ള അസ്വാഭാവിക ഘടന ഒഴിവാക്കി.
