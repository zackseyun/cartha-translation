  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עָמְד֧וּ שְׁנֵֽי הָ/אֲנָשִׁ֛ים אֲשֶׁר לָ/הֶ֥ם הָ/רִ֖יב לִ/פְנֵ֣י יְהוָ֑ה לִ/פְנֵ֤י הַ/כֹּֽהֲנִים֙ וְ/הַ/שֹּׁ֣פְטִ֔ים אֲשֶׁ֥ר יִהְי֖וּ בַּ/יָּמִ֥ים הָ/הֵֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/017.yaml
  text: then the two men who have the dispute shall stand before Yahweh[b][a], before the priests and the judges who are in office in those days.
translation:
  language: ml
  text: അപ്പോൾ തർക്കമുള്ള ആ രണ്ടു പുരുഷന്മാരും[a] യഹ്‌വേയുടെ സന്നിധിയിൽ, ആ കാലത്ത് സേവനത്തിലിരിക്കുന്ന[b] പുരോഹിതന്മാരുടെയും ന്യായാധിപന്മാരുടെയും മുമ്പാകെ നിൽക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘തർക്കം അവർക്കുള്ള’; ‘വ്യവഹാരമുള്ള’ അല്ലെങ്കിൽ ‘ആർക്കിടയിലാണോ തർക്കം’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ ‘ആ കാലത്തുള്ള’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָמְדוּ
  choice: അപ്പോൾ ... നിൽക്കണം
  rationale: വാവ് ചേർന്ന ക്രിയ നിയമനടപടിയിലെ അടുത്ത ഘട്ടം സൂചിപ്പിക്കുന്നു. ‘അപ്പോൾ’ ആ ക്രമം സ്വാഭാവികമായി അറിയിക്കുകയും ‘നിൽക്കണം’ നിയമപരമായ നിർബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: שְׁנֵי הָאֲנָשִׁים
  choice: ആ രണ്ടു പുരുഷന്മാരും
  rationale: എബ്രായപദം സംഖ്യയോടുകൂടിയ വ്യക്തമായ പുല്ലിംഗ ബഹുവചനമാണ്. നിയമസന്ദർഭം വ്യക്തമാണെങ്കിലും കൂടുതൽ വ്യാഖ്യാനാത്മകമായ ‘കക്ഷികൾ’ എന്നതിനുപകരം മൂലരൂപത്തോട് അടുത്ത വിവർത്തനം സ്വീകരിച്ചു.
- source_word: אֲשֶׁר לָהֶם הָרִיב
  choice: തർക്കമുള്ള
  rationale: רִיב എന്നത് തർക്കം, വ്യവഹാരം, നിയമക്കേസ് എന്നിവയെ സൂചിപ്പിക്കാം. ‘തർക്കമുള്ള’ എന്നത് ഈ അർത്ഥവ്യാപ്തിയുടെ കേന്ദ്രം ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു; നിയമക്കേസ് എന്ന അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വേയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי എന്നത് ഇവിടെ ദൈവത്തിന്റെ സന്നിധിയിൽ ഹാജരാകുന്ന ന്യായപരമായ ആശയം നൽകുന്നു. ദൈവനാമമായ יהוה ശബ്ദലിപ്യന്തരണമായി ‘യഹ്‌വേ’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: לִפְנֵי הַכֹּהֲנִים וְהַשֹּׁפְטִים
  choice: പുരോഹിതന്മാരുടെയും ന്യായാധിപന്മാരുടെയും മുമ്പാകെ
  rationale: അംഗീകൃത മത-ന്യായ അധികാരികളുടെ മുമ്പാകെ ഹാജരാകുന്നതാണ് മൂലവാക്യം സൂചിപ്പിക്കുന്നത്. മലയാളത്തിലെ ബന്ധകസംയോജനം രണ്ടു വിഭാഗങ്ങളെയും വ്യക്തമായി ഉൾക്കൊള്ളുന്നു.
- source_word: אֲשֶׁר יִהְיוּ בַּיָּמִים הָהֵם
  choice: ആ കാലത്ത് സേവനത്തിലിരിക്കുന്ന
  rationale: അന്നത്തെ ചുമതല വഹിക്കുന്ന പുരോഹിതന്മാരെയും ന്യായാധിപന്മാരെയും ഈ ഉപവാക്യം തിരിച്ചറിയിക്കുന്നു. ‘സേവനത്തിലിരിക്കുന്ന’ ഔദ്യോഗിക പ്രവർത്തനം വ്യക്തമാക്കുന്നു; കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ചതുരക്ഷര ദൈവനാമം നേരിട്ട് വരുന്നതിനാൽ ഉടമ്പടിനാമം മറയ്ക്കാതെ ആധുനിക മലയാളത്തിൽ പരിചിതമായ ‘യഹ്‌വേ’ എന്ന ശബ്ദലിപ്യന്തരണം സ്വീകരിച്ചു.
- issue: ‘യഹ്‌വേയുടെ സന്നിധിയിൽ’ എന്ന ന്യായപരമായ പ്രയോഗം
  choice: ദൈവസന്നിധിയിലെ ഹാജരാകൽ എന്ന അർത്ഥം തുറന്നുവെക്കുന്നു
  alternative: പുരോഹിതന്മാരുടെയും ന്യായാധിപന്മാരുടെയും മുമ്പാകെ നിൽക്കുന്നതു മാത്രമായി വ്യാഖ്യാനിക്കുക
  rationale: വാക്യം לִפְנֵי എന്ന പദം യഹ്‌വേയോടും അധികാരികളോടും ബന്ധപ്പെടുത്തി ഉപയോഗിക്കുന്നു. അതിനാൽ ദൈവസന്നിധിയും മനുഷ്യ ന്യായാധികാരികളുടെ മുമ്പാകെയുള്ള ഹാജരാകലും തമ്മിലുള്ള ദൈവശാസ്ത്രപരമായ ബന്ധം പരിഹരിക്കാതെ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമഭാഷയാണ് ഉപയോഗിച്ചത്. ‘കക്ഷികൾ’ പോലുള്ള കൂടുതൽ സാങ്കേതിക പദത്തിനുപകരം മൂലത്തിലെ ‘രണ്ടു പുരുഷന്മാർ’ നിലനിർത്തി; എന്നാൽ ദുഷ്കരമായ എബ്രായബന്ധവാക്യങ്ങൾ വായനാസൗകര്യത്തിനായി സ്വാഭാവിക മലയാളഘടനയിൽ നൽകി.
