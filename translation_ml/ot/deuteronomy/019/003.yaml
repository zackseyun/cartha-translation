revisions:
- from: നീ വഴി ഒരുക്കണം; നിന്റെ ദൈവമായ യഹ്‌വെ നിനക്ക് അവകാശമായി നൽകുന്ന ദേശത്തിന്റെ വിസ്തൃതി മൂന്നായി വിഭജിക്കണം. അങ്ങനെ, ആളെ കൊന്ന ഏവനും[a] അവിടേക്ക് ഓടിപ്പോകാൻ കഴിയണം.[b]
  to: നീ വഴി ഒരുക്കണം; നിന്റെ ദൈവമായ യഹ്‌വെ നിനക്കു അവകാശമായി നൽകുന്ന ദേശത്തിന്റെ വിസ്തൃതി മൂന്നായി വിഭജിക്കണം. അങ്ങനെ, ആളെ കൊന്ന ഏവനും[a] അവിടേക്ക് ഓടിപ്പോകാൻ സാധിക്കേണ്ടതിന്.[b]
  rationale: A small revision replaces the potentially deontic «കഴിയണം» with the purposive «സാധിക്കേണ്ടതിന്», more closely reflecting the Hebrew infinitival construction and the verse’s stated aim. All other wording is retained because it is source-faithful, idiomatic modern Malayalam, and appropriately cautious regarding the legal scope of רֹצֵחַ.
