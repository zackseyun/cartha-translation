language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: תָּכִ֣ין לְ/ךָ֮ הַ/דֶּרֶךְ֒ וְ/שִׁלַּשְׁתָּ֙ אֶת גְּב֣וּל אַרְצְ/ךָ֔ אֲשֶׁ֥ר יַנְחִֽילְ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/הָיָ֕ה לָ/נ֥וּס שָׁ֖מָּ/ה כָּל רֹצֵֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/003.yaml
  text: You shall prepare the road for yourself[a], and you shall divide into three parts the territory of your land that Yahweh your God is giving you as an inheritance[b], so that every manslayer may flee there.
translation:
  language: ml
  text: നീ വഴി ഒരുക്കണം; നിന്റെ ദൈവമായ യഹ്‌വെ നിനക്കു അവകാശമായി നൽകുന്ന ദേശത്തിന്റെ വിസ്തൃതി മൂന്നായി വിഭജിക്കണം. അങ്ങനെ, ആളെ കൊന്ന ഏവനും[a] അവിടേക്ക് ഓടിപ്പോകാൻ സാധിക്കേണ്ടതിന്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കൊന്നവൻ’. ഇവിടെ എബ്രായപദം ‘കൊലയാളി’ എന്നതിനെക്കാൾ വിശാലമാണ്; അഭയനഗരങ്ങളുടെ ഈ പശ്ചാത്തലത്തിൽ അബദ്ധത്തിൽ ആളെ കൊന്നവനെയും അത് ഉൾക്കൊള്ളാം.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥത്തിൽ: ‘അവിടേക്ക് ഓടിപ്പോകാനായി അത് ഉണ്ടായിരിക്കണം.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּכִין לְךָ הַדֶּרֶךְ
  choice: നീ വഴി ഒരുക്കണം
  rationale: כון എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ വഴി സജ്ജമാക്കുക എന്ന പ്രായോഗിക അർഥത്തിലാണ്. לְךָ എന്നത് പ്രതിഫലകസ്വഭാവമുള്ള പ്രയോഗമായതിനാൽ അസ്വാഭാവികമായ ‘നിനക്കായി’ ചേർക്കാതെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: וְשִׁלַּשְׁתָּ
  choice: മൂന്നായി വിഭജിക്കണം
  rationale: שלש എന്ന ക്രിയയുടെ പിയേൽ രൂപം മൂന്നു ഭാഗങ്ങളാക്കുക എന്ന അർഥം നൽകുന്നു.
- source_word: גְּבוּל אַרְצְךָ
  choice: നിന്റെ ദേശത്തിന്റെ വിസ്തൃതി
  rationale: גְּבוּל എന്നത് അതിർത്തിരേഖയെ മാത്രമല്ല, അതിർത്തിക്കുള്ളിലുള്ള ഭൂപ്രദേശത്തിന്റെ വ്യാപ്തിയെയും സൂചിപ്പിക്കാം. ഇവിടെ അഭയനഗരങ്ങളിലേക്കുള്ള പ്രവേശനം ക്രമീകരിക്കാൻ ദേശത്തെ മൂന്നാക്കുന്നതാണ് സന്ദർഭം.
- source_word: יַנְחִילְךָ
  choice: നിനക്ക് അവകാശമായി നൽകുന്ന
  rationale: נחל എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലെ ‘അവകാശമാക്കിക്കൊടുക്കുക’ എന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ യഹ്‌വെ
  rationale: ദൈവനാമമായ יהוה പൊതുപദവിയാക്കി മാറ്റാതെ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു; ഉടമസ്ഥബന്ധമുള്ള എബ്രായ പ്രയോഗം സ്വാഭാവിക മലയാളക്രമത്തിൽ നൽകി.
- source_word: וְהָיָה לָנוּס שָׁמָּה
  choice: അവിടേക്ക് ഓടിപ്പോകാൻ കഴിയണം
  rationale: അക്ഷരാർഥത്തിൽ ‘അവിടേക്ക് ഓടിപ്പോകുന്നതിനായി അത് ഉണ്ടായിരിക്കണം’ എന്ന ചുരുക്കപ്രയോഗത്തിന്റെ ഉദ്ദേശ്യാർഥം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകി.
- source_word: כָּל רֹצֵחַ
  choice: ആളെ കൊന്ന ഏവനും
  rationale: അഭയനഗരങ്ങളുടെ പശ്ചാത്തലത്തിൽ רֹצֵחַ മനഃപൂർവമായ കൊലപാതകിയെ മാത്രം സൂചിപ്പിക്കുന്നില്ല. ‘കൊലയാളി’ എന്ന പദം കുറ്റവിധി മുൻകൂട്ടി ചുമത്താൻ ഇടയുള്ളതിനാൽ, വിശാലമായ നിയമവിഭാഗം നിലനിർത്തുന്ന പ്രയോഗം തിരഞ്ഞെടുത്തു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമം ഒരു പൊതുപദവിയാൽ പകരാതെ നേരിട്ട് ലിപ്യന്തരിച്ചു.
- issue: רֹצֵחַ എന്ന പദം മനഃപൂർവ കൊലപാതകം മാത്രമാണോ സൂചിപ്പിക്കുന്നത്
  choice: ആളെ കൊന്ന ഏവനും
  alternative: കൊലയാളി
  rationale: തുടർന്നുള്ള വാക്യങ്ങൾ അബദ്ധത്തിൽ ആളെ കൊന്നവനെയും ഉൾപ്പെടുത്തുന്നതിനാൽ, ഈ വാക്യത്തിൽ കുറ്റത്തിന്റെ സ്വഭാവം മുൻകൂട്ടി തീർപ്പാക്കാത്ത വിശാലമായ ഭാഷ ഉപയോഗിച്ചു.
- issue: וְהָיָה לָנוּס שָׁמָּה എന്ന ഘടനയുടെ ബന്ധം
  choice: ഫല-ഉദ്ദേശ്യബന്ധമായി ‘അങ്ങനെ ... കഴിയണം’
  alternative: അക്ഷരാർഥത്തിൽ ‘അവിടേക്ക് ഓടിപ്പോകുന്നതിനായി അത് ഉണ്ടായിരിക്കണം’
  rationale: എബ്രായത്തിലെ ചുരുക്കഘടന നിലനിർത്തുന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിച്ചു; ‘അത്’ എന്തിനെ സൂചിപ്പിക്കുന്നു എന്നത് അനാവശ്യമായി നിർണ്ണയിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമനിർദേശ ശൈലി സ്വീകരിച്ചു. ഏകവചനത്തിലുള്ള അഭിസംബോധനയും നിർദേശത്തിന്റെ ഗൗരവവും നിലനിർത്താൻ ‘നീ ...ണം’ ഘടന ഉപയോഗിച്ചു. കുറ്റബോധം മുൻകൂട്ടി വിധിക്കുന്ന ‘കൊലയാളി’ ഒഴിവാക്കി.
