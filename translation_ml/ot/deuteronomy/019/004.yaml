  revised_text: 'ഒരാളുടെ മരണത്തിന് ഇടയായവൻ അവിടെ ഓടിപ്പോയി ജീവനോടെ കഴിയേണ്ടതിനെക്കുറിച്ചുള്ള വ്യവസ്ഥ ഇതാണ്: തന്റെ അയൽക്കാരനെ അറിവില്ലാതെ പ്രഹരിക്കുകയും, മുമ്പുമുതൽ അവനോട് വെറുപ്പില്ലാതിരിക്കുകയും ചെയ്തവൻ.'
