id: DEU.19.4
reference: Deuteronomy 19:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/זֶה֙ דְּבַ֣ר הָ/רֹצֵ֔חַ אֲשֶׁר יָנ֥וּס שָׁ֖מָּ/ה וָ/חָ֑י אֲשֶׁ֨ר יַכֶּ֤ה אֶת רֵעֵ֨/הוּ֙ בִּ/בְלִי דַ֔עַת וְ/ה֛וּא לֹא שֹׂנֵ֥א ל֖/וֹ מִ/תְּמֹ֥ל שִׁלְשֹֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/004.yaml
  text: 'This is the provision for the manslayer who may flee there and live: when he strikes his neighbor without intent[a], and he did not hate him in times past.'
translation:
  language: ml
  text: 'ഒരാളുടെ മരണത്തിന് ഇടയായവൻ അവിടെ ഓടിപ്പോയി ജീവനോടെ കഴിയേണ്ടതിനെക്കുറിച്ചുള്ള വ്യവസ്ഥ ഇതാണ്: തന്റെ അയൽക്കാരനെ അറിവില്ലാതെ പ്രഹരിക്കുകയും, മുമ്പുമുതൽ അവനോട് വെറുപ്പില്ലാതിരിക്കുകയും ചെയ്തവൻ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דְּבַר
  choice: വ്യവസ്ഥ
  rationale: നിയമസന്ദർഭത്തിൽ ഒരു കേസിനെ നിയന്ത്രിക്കുന്ന ചട്ടം അഥവാ വ്യവസ്ഥയാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്.
- source_word: הָרֹצֵחַ
  choice: കൊലയാളി
  rationale: മലയാളത്തിൽ സ്വാഭാവികമായ നിയമപരമായ പദം; ഇവിടെ കുറ്റകരമായ കൊലപാതകം നിർബന്ധമായി സൂചിപ്പിക്കാതെ, മരണത്തിന് കാരണമായ വ്യക്തിയെ സന്ദർഭം നിർവചിക്കുന്നു.
- source_word: יָנוּס שָׁמָּה וָחָי
  choice: അവിടെ ഓടിച്ചെന്ന് ജീവൻ രക്ഷിക്കാൻ കഴിയുന്ന
  rationale: അഭയനഗരത്തിലേക്കുള്ള പലായനത്തിന്റെ അനുവദനീയതയും അതിലൂടെ ജീവനോടെ തുടരുന്ന ഫലവും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: יַכֶּה אֶת רֵעֵהוּ
  choice: തന്റെ അയൽക്കാരനെ ... പ്രഹരിച്ചാൽ
  rationale: נכה എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘പ്രഹരിക്കുക’ നിലനിർത്തുന്നു; മരണഫലം വിശാലസന്ദർഭത്തിൽനിന്ന് വ്യക്തമാകുന്നു.
- source_word: בִּבְלִי דַעַת
  choice: അറിവില്ലാതെ
  rationale: എബ്രായത്തിലെ ‘അറിവില്ലാതെ’ എന്ന രൂപം നിലനിർത്തി, മനഃപൂർവമല്ലാത്ത പ്രവൃത്തിയെന്ന നിയമപരമായ അർഥം തുറന്നുവെക്കുന്നു.
- source_word: לֹא שֹׂנֵא לוֹ מִתְּמֹל שִׁלְשֹׁם
  choice: മുൻവൈരമില്ലാതെ
  rationale: മുമ്പുമുതൽ വെറുപ്പ് ഉണ്ടായിരുന്നില്ല എന്ന ആശയം ചുരുക്കവും സ്വാഭാവികവുമായി നൽകുന്നു; പദശഃ പ്രയോഗം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: അബദ്ധവധവും കൊലപാതകവും തമ്മിലുള്ള നിയമപരമായ വ്യത്യാസം
  choice: ‘കൊലയാളി’ എന്ന പൊതുപദം ഉപയോഗിച്ച്, ‘അറിവില്ലാതെ’, ‘മുൻവൈരമില്ലാതെ’ എന്നീ യോഗ്യതകൾ വാക്യത്തിൽ വ്യക്തമാക്കുക
  alternative: ‘കൊലപാതകി’ അല്ലെങ്കിൽ ‘അബദ്ധവധം ചെയ്തവൻ’
  rationale: ‘കൊലപാതകി’ മുൻകൂട്ടി കുറ്റബോധം വിധിക്കാം; ‘അബദ്ധവധം ചെയ്തവൻ’ വാക്യത്തിൽ തുടർന്നുവരുന്ന മാനദണ്ഡത്തെ മുൻകൂട്ടി വ്യാഖ്യാനിക്കും. ഉറവിടത്തിലെ നിയമപരമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിയമപരമായ ഭാവം നിലനിർത്തിയെങ്കിലും അതിപുരാതന പദാവലി ഒഴിവാക്കി.
