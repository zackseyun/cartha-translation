  to: എന്നാൽ ഒരാൾ വിറകു വെട്ടാൻ തന്റെ കൂട്ടുകാരനോടൊപ്പം കാട്ടിൽ പോകുകയും, മരം വെട്ടിവീഴ്ത്താൻ കോടാലി വീശുമ്പോൾ കോടാലിയുടെ ഇരുമ്പുതല മരപ്പിടിയിൽനിന്ന് ഊരിവന്ന്[a] കൂട്ടുകാരനെ തട്ടുകയും അയാൾ മരിക്കുകയും ചെയ്താൽ, ആ മനുഷ്യന് ഈ പട്ടണങ്ങളിലൊന്നിലേക്ക് ഓടിപ്പോയി ജീവൻ രക്ഷിക്കാം.
