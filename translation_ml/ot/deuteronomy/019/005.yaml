  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/אֲשֶׁר֩ יָבֹ֨א אֶת רֵעֵ֥/הוּ בַ/יַּעַר֮ לַ/חְטֹ֣ב עֵצִים֒ וְ/נִדְּחָ֨ה יָד֤/וֹ בַ/גַּרְזֶן֙ לִ/כְרֹ֣ת הָ/עֵ֔ץ וְ/נָשַׁ֤ל הַ/בַּרְזֶל֙ מִן הָ/עֵ֔ץ וּ/מָצָ֥א אֶת רֵעֵ֖/הוּ וָ/מֵ֑ת ה֗וּא יָנ֛וּס אֶל אַחַ֥ת הֶ/עָרִים הָ/אֵ֖לֶּה וָ/חָֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/005.yaml
  text: But if a man goes with his neighbor into the forest to cut wood[a], and his hand swings the axe to cut down the tree, and the iron head slips from the handle and strikes his neighbor so that he dies, he may flee to one of these cities and live.
translation:
  language: ml
  text: എന്നാൽ ഒരാൾ വിറകു വെട്ടാൻ തന്റെ കൂട്ടുകാരനോടൊപ്പം കാട്ടിൽ പോകുകയും, മരം വെട്ടിവീഴ്ത്താൻ കോടാലി വീശുമ്പോൾ കോടാലിയുടെ ഇരുമ്പുതല മരപ്പിടിയിൽനിന്ന് ഊരിവന്ന്[a] കൂട്ടുകാരനെ തട്ടുകയും അയാൾ മരിക്കുകയും ചെയ്താൽ, ആ മനുഷ്യന് ഈ പട്ടണങ്ങളിലൊന്നിലേക്ക് ഓടിപ്പോയി ജീവൻ രക്ഷിക്കാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “ഇരുമ്പ് മരത്തിൽനിന്ന് ഊരുന്നു.” ഇവിടെ “ഇരുമ്പ്” കോടാലിയുടെ ഇരുമ്പുതലയെയും “മരം” അതിന്റെ മരപ്പിടിയെയും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: എന്നാൽ ഒരാൾ ... ചെയ്താൽ
  rationale: മുൻനിയമത്തിന്റെ തുടർച്ചയായ സോപാധിക നിയമോദാഹരണം സ്വാഭാവികമായ മലയാള വാക്യഘടനയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: רֵעֵהוּ
  choice: തന്റെ കൂട്ടുകാരൻ / കൂട്ടുകാരന്റെ
  rationale: നിയമസന്ദർഭത്തിൽ അടുത്ത സുഹൃത്ത് എന്നതിലുപരി കൂടെയുള്ള സഹമനുഷ്യനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘കൂട്ടുകാരൻ’ ഈ സംഭവസന്ദർഭത്തിൽ സ്വാഭാവികമാണ്.
- source_word: בַיַּעַר
  choice: കാട്ടിൽ
  rationale: മരങ്ങൾ നിറഞ്ഞ പ്രദേശം എന്ന അർഥം ലളിതവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לַחְטֹב עֵצִים
  choice: വിറകു വെട്ടാൻ
  rationale: മരംവെട്ടൽ പ്രവൃത്തിയെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള ഏകവചനമായ ‘മരം’ എന്ന പരാമർശത്തോടും യോജിക്കുന്നു.
- source_word: וְנִדְּחָה יָדוֹ בַגַּרְזֶן
  choice: കോടാലി വീശുമ്പോൾ
  rationale: കൈയുടെ ചലനം അക്ഷരാർഥത്തിൽ അസ്വാഭാവികമായി പറയാതെ, കോടാലി ഉപയോഗിക്കുന്ന പ്രവൃത്തിയെ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: לִכְרֹת הָעֵץ
  choice: മരം വെട്ടിവീഴ്ത്താൻ
  rationale: כרת ഇവിടെ മരം മുറിച്ചുവീഴ്ത്തുന്നതാണ്; വെറും മുറിക്കൽ എന്നതിലുപരി സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു.
- source_word: וְנָשַׁל הַבַּרְזֶל מִן הָעֵץ
  choice: കോടാലിയുടെ ഇരുമ്പുതല മരപ്പിടിയിൽനിന്ന് ഊരിത്തെറിച്ച്
  rationale: ‘ഇരുമ്പ് മരത്തിൽനിന്ന് ഊരുന്നു’ എന്ന മൂലരൂപത്തിലെ സൂചിത വസ്തുക്കൾ—ഇരുമ്പുതലയും മരപ്പിടിയും—വ്യക്തമാക്കുന്നു; അപകടകരമായ വേർപെടലും ചലനവും ‘ഊരിത്തെറിച്ച്’ പകർത്തുന്നു.
- source_word: וּמָצָא אֶת רֵעֵהוּ
  choice: കൂട്ടുകാരന്റെ മേൽ പതിക്കുകയും
  rationale: מצא ഇവിടെ പറന്നുപോയ ഇരുമ്പുതല ആ വ്യക്തിയെ എത്തി തട്ടുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘മേൽ പതിക്കുക’ ഈ സംഭവത്തിന് സ്വാഭാവികമാണ്.
- source_word: הוּא יָנוּס ... וָחָי
  choice: ആ മനുഷ്യന് ... ഓടിപ്പോയി ജീവൻ രക്ഷിക്കാം
  rationale: അഭയനഗരത്തിലേക്ക് പോകാനുള്ള സംരക്ഷിത അനുമതിയും അതിലൂടെ ജീവിച്ചിരിക്കാനുള്ള ഫലവും വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: הוּא יָנוּס എന്ന നിയമപ്രയോഗത്തിന്റെ ഭാവം
  choice: ഓടിപ്പോയി ... രക്ഷിക്കാം
  alternative: ഓടിപ്പോകണം / ഓടിപ്പോകും
  rationale: ഇവിടെ നിർബന്ധമോ വെറും ഭാവികാലമോ മാത്രം അല്ല, മനഃപൂർവമല്ലാതെ കൊന്നവന് ലഭിക്കുന്ന അഭയാവകാശമാണ് പ്രധാനമായും സൂചിപ്പിക്കുന്നത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമവിവരണ ശൈലി. ദീർഘമായ എബ്രായ സോപാധിക വാക്യത്തിന്റെ ബന്ധം നിലനിർത്തിക്കൊണ്ട്, കർത്താവിലെ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ അവസാനത്തിൽ ‘ആ മനുഷ്യന്’ എന്നു വ്യക്തമാക്കിയിരിക്കുന്നു.
