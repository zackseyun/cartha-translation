  yaml_path: translation/ot/deuteronomy/019/008.yaml
  text: And if Yahweh your God enlarges your territory[a], as he swore to your fathers, and gives you all the land that he promised to give to your fathers,
translation:
  language: ml
  text: നിന്റെ ദൈവമായ യാഹ്‌വേ നിന്റെ അതിർത്തി വിപുലമാക്കുകയും[a], നിന്റെ പിതാക്കന്മാരോടു സത്യം ചെയ്തതുപോലെ, നിന്റെ പിതാക്കന്മാർക്കു നൽകാമെന്ന് പറഞ്ഞ ദേശം മുഴുവനും നിനക്കു നൽകുകയും ചെയ്താൽ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിന്റെ പ്രദേശം വിപുലമാക്കുകയും’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ എബ്രായപദം അതിർത്തിയെയോ അതിനുള്ളിലെ പ്രദേശത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: ചെയ്താൽ
  rationale: മുൻവാക്യത്തിലെ നിയമനിർദേശത്തിന്റെ തുടർച്ചയായ നിബന്ധനയാണിത്. മലയാളത്തിൽ രണ്ടു ക്രിയകളെയും ചേർത്ത് അവസാനം ‘ചെയ്താൽ’ എന്നു നൽകുന്നത് സ്വാഭാവികമാണ്.
- source_word: יַרְחִיב
  choice: വിശാലമാക്കുകയും
  rationale: רחב എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ‘വീതികൂട്ടുക/വിശാലമാക്കുക’ എന്നാണ്; പ്രദേശവ്യാപനത്തെ സൂചിപ്പിക്കാൻ ‘വിശാലമാക്കുക’ യോജിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായി നൽകിയിരിക്കുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: രണ്ടാംപുരുഷ ഏകവചന പ്രത്യയം കൃത്യമായി നിലനിർത്തുകയും അടുത്തുള്ള ദൈവനാമത്തോടു സ്വാഭാവികമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: גְּבֻלְךָ
  choice: നിന്റെ അതിർത്തി
  rationale: גְּבוּל അതിർത്തിയെയോ അതിനുള്ളിലെ പ്രദേശത്തെയോ സൂചിപ്പിക്കാം. ‘അതിർത്തി വിശാലമാക്കുക’ എന്ന പ്രയോഗം ഭൂവിസ്തൃതി വർധിപ്പിക്കുന്ന അർഥം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כַּאֲשֶׁר נִשְׁבַּע
  choice: സത്യം ചെയ്തതുപോലെ
  rationale: പിതാക്കന്മാരോടു ചെയ്ത ദൈവിക ശപഥത്തെ ഔപചാരികവും നേരിട്ടുമായ ഭാഷയിൽ നിലനിർത്തുന്നു.
- source_word: לַאֲבֹתֶיךָ
  choice: നിന്റെ പിതാക്കന്മാരോട് / അവർക്കു
  rationale: ആദ്യ occurrence-ൽ എബ്രായത്തിലെ പിതൃപുരുഷസൂചന നിലനിർത്തി; ആവർത്തനത്തിൽ മലയാളത്തിന്റെ സ്വാഭാവികതയ്ക്കായി സർവനാമം ഉപയോഗിച്ചു.
- source_word: וְנָתַן לְךָ
  choice: നിനക്കു നൽകുകയും ചെയ്താൽ
  rationale: വാവ്-പെർഫെക്റ്റ് ഭാവിനിബന്ധനയുടെ ഭാഗമാണ്. മലയാളത്തിൽ ഏകീകൃത നിബന്ധനാവാക്യമായി ഇത് സ്വാഭാവികമായി പ്രതിഫലിക്കുന്നു.
- source_word: כָּל הָאָרֶץ
  choice: ദേശം മുഴുവനും
  rationale: ഇവിടെ אֶרֶץ ഭൂഗോളം അല്ല, വാഗ്ദത്തദേശമാണ്; ‘ദേശം മുഴുവനും’ അതു വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: אֲשֶׁר דִּבֶּר לָתֵת
  choice: നൽകാമെന്ന് അരുളിച്ചെയ്ത
  rationale: പദശഃ ‘നൽകാൻ പറഞ്ഞ’ എന്നതിന്റെ ദൈവിക പ്രതിജ്ഞാബലം നിലനിർത്തിക്കൊണ്ട്, ‘അരുളിച്ചെയ്ത’ ദൈവത്തിന്റെ വാക്കിനെ dignified ആയി സൂചിപ്പിക്കുന്നു; ‘വാഗ്ദാനം ചെയ്ത’ എന്നതിനെക്കാൾ דִּבֶּר എന്ന ‘സംസാരിക്കുക’ ഘടകവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരാൽ പകരാതെ ലിപ്യന്തരിച്ചു. ആധുനിക മലയാളത്തിൽ വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്ന രൂപമാണ് ‘യഹോവ’; ഉച്ചാരണപുനർനിർമാണമായ ‘യാഹ്‌വേ’ മറ്റൊരു സാധ്യതയാണ്.
- issue: אבות എന്നതിന്റെ അർഥം
  choice: പിതാക്കന്മാർ
  alternative: പൂർവികർ
  rationale: മൂലപാഠത്തിലെ പുരുഷലിംഗ കുടുംബപദവും ഇസ്രായേലിന്റെ പിതൃപുരുഷന്മാരിലേക്കുള്ള ഉടമ്പടിസൂചനയും മുഖ്യപാഠത്തിൽ നിലനിർത്തി; സന്ദർഭപരമായി ‘പൂർവികർ’ എന്നും മനസ്സിലാക്കാം.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ മലയാളം. ഈ വാക്യം അടുത്ത വാക്യത്തിലേക്കു നീളുന്ന നിബന്ധനയായതിനാൽ അവസാനം കോമ നിലനിർത്തി. ഏകവചന ‘നിന്റെ/നിനക്കു’ എന്ന അഭിസംബോധനയും മൂലത്തിലെ ആവർത്തനാർഥവും സംരക്ഷിച്ചു; അനാവശ്യമായ സഭാപാരമ്പര്യ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
