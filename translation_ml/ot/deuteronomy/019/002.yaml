    rationale: תַּבְדִּיל ഹിഫീൽ രൂപം വേർതിരിക്കുക എന്നതിനൊപ്പം പ്രത്യേക ഉദ്ദേശ്യത്തിനായി മാറ്റിവെക്കുക/നിയോഗിക്കുക എന്ന അർഥവും വഹിക്കുന്നു. ‘വേർതിരിച്ചു നിർത്തണം’ ഈ സൂചന സ്വാഭാവികമായി നൽകുന്നു.
