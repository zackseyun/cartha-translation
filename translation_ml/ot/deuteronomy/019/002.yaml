source:
  edition: WLC
  text: שָׁל֥וֹשׁ עָרִ֖ים תַּבְדִּ֣יל לָ֑/ךְ בְּ/ת֣וֹךְ אַרְצְ/ךָ֔ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ לְ/רִשְׁתָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/002.yaml
  text: You shall set apart three cities for yourself within your land that Yahweh your God is giving you to possess[a].
translation:
  language: ml
  text: നിന്റെ ദൈവമായ യഹ്‌വെ നിനക്കു കൈവശമാക്കാൻ തരുന്ന നിന്റെ ദേശത്തിനുള്ളിൽ നിനക്കായി മൂന്ന് നഗരങ്ങൾ വേർതിരിച്ചു നിർത്തണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവകാശമായി നേടാൻ.” ഭൂമി ദാനമായി ലഭിക്കുന്ന സന്ദർഭങ്ങളിൽ ഹീബ്രു ക്രിയയ്ക്ക് “കൈവശമാക്കുക” എന്നും “അവകാശമായി നേടുക” എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלֹשׁ עָרִים
  choice: മൂന്നു പട്ടണങ്ങൾ
  rationale: עִיר എന്നത് പട്ടണമോ നഗരമോ സൂചിപ്പിക്കാം. അഭയനഗരങ്ങളുടെ നിയമസന്ദർഭത്തിൽ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വിശാലവുമായ പദം ‘പട്ടണങ്ങൾ’ ആണ്.
- source_word: תַּבְדִּיל
  choice: വേർതിരിക്കണം
  rationale: בדל എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം വേർതിരിക്കുക, പ്രത്യേക ഉദ്ദേശ്യത്തിനായി മാറ്റിവയ്ക്കുക എന്നർഥം നൽകുന്നു; ഇവിടെ നിയമപരമായ നിയോഗവും വേർതിരിവും നിലനിർത്തുന്നു.
- source_word: לָךְ
  choice: നിനക്കായി
  rationale: പ്രയോജനസൂചകമായ ദാതൃഭാവം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: בְּתוֹךְ אַרְצְךָ
  choice: നിന്റെ ദേശത്തിനുള്ളിൽ
  rationale: בְּתוֹךְ എന്നതിന്റെ അകത്ത്/മധ്യേ എന്ന സ്ഥലസൂചന സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ഹീബ്രു ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാൽ മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: രണ്ടാംപുരുഷ ഏകവചന ഉടമസ്ഥബന്ധം നിലനിർത്തുകയും പിന്നാലെയുള്ള ദൈവനാമവുമായി മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: נֹתֵן לְךָ
  choice: നിനക്കു ... തരുന്ന
  rationale: വർത്തമാന കൃദന്തരൂപത്തിന്റെ നടന്നുകൊണ്ടിരിക്കുന്നതോ ഉറപ്പോടെ സമീപിച്ചിരിക്കുന്നതോ ആയ ദാനഭാവം സംരക്ഷിക്കുന്നു.
- source_word: לְרִשְׁתָּהּ
  choice: കൈവശമാക്കാൻ
  rationale: ירשׁ ഭൂദാനസന്ദർഭത്തിൽ കൈവശമാക്കുക എന്നും അവകാശമായി നേടുക എന്നും അർഥമാക്കാം; പ്രധാനപാഠത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ ‘കൈവശമാക്കാൻ’ ഉപയോഗിച്ച് മറ്റർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം തന്നെയായതിനാൽ ഒരു ബിരുദം പകരംവയ്ക്കാതെ ആ നാമം മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: ירשׁ എന്ന ഭൂദാനപദത്തിന്റെ അർഥവ്യാപ്തി
  choice: കൈവശമാക്കാൻ
  alternative: അവകാശമായി നേടാൻ
  rationale: വാക്യം ദൈവം നൽകുന്ന ദേശത്തെ കൈവശപ്പെടുത്തുന്നതിനെക്കുറിച്ചാണ്; എന്നാൽ അവകാശലഭ്യതയുടെ സൂചനയും സാദ്ധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമശൈലി. രണ്ടാംപുരുഷ ഏകവചനത്തെ മൂലപാഠപ്രകാരം നിലനിർത്തിയിരിക്കുന്നു; പദക്രമം മലയാളത്തിന്റെ സ്വാഭാവികതയ്ക്കായി ക്രമീകരിച്ചു.
