    rationale: עִיר പട്ടണമോ നഗരമോ ആകാം; എന്നാൽ നിയമത്തിൽ പ്രത്യേകം നിശ്ചയിക്കുന്ന നഗരങ്ങളെ സൂചിപ്പിക്കുന്ന ഈ പശ്ചാത്തലത്തിൽ ‘നഗരങ്ങൾ’ കൂടുതൽ പരമ്പരാഗതവും വ്യക്തവുമായ മലയാള പ്രയോഗമാണ്.
