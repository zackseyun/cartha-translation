id: DEU.19.18
reference: Deuteronomy 19:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/דָרְשׁ֥וּ הַ/שֹּׁפְטִ֖ים הֵיטֵ֑ב וְ/הִנֵּ֤ה עֵֽד שֶׁ֨קֶר֙ הָ/עֵ֔ד שֶׁ֖קֶר עָנָ֥ה בְ/אָחִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/018.yaml
  text: And the judges shall investigate thoroughly, and if the witness is a false witness and has testified falsely against his brother,
translation:
  language: ml
  text: ന്യായാധിപന്മാർ സൂക്ഷ്മമായി അന്വേഷിക്കണം. ആ സാക്ഷി കള്ളസാക്ഷിയാണെന്നും തന്റെ സഹോദരനെതിരെ കള്ളസാക്ഷ്യം പറഞ്ഞതാണെന്നും തെളിഞ്ഞാൽ,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְדָרְשׁוּ ... הֵיטֵב
  choice: കാര്യമായി അന്വേഷിക്കണം
  rationale: ദാതാവിനൊപ്പം വരുന്ന ക്രിയാപ്രയോഗം സൂക്ഷ്മവും സമഗ്രവുമായ അന്വേഷണം സൂചിപ്പിക്കുന്നു; സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അതിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: וְהִנֵּה
  choice: തെളിഞ്ഞാൽ
  rationale: അന്വേഷണത്തിന്റെ ഫലം കണ്ടെത്തുന്നതായി ഇവിടെ ഈ അവതാരകപ്രയോഗം പ്രവർത്തിക്കുന്നു; വ്യവസ്ഥാസൂചകമായ സന്ദർഭം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: עֵד שֶׁקֶר
  choice: കള്ളസാക്ഷി
  rationale: വ്യാജമായി സാക്ഷ്യം പറയുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും വ്യക്തവുമായ മലയാള നിയമപ്രയോഗം.
- source_word: שֶׁקֶר עָנָה
  choice: കള്ളസാക്ഷ്യം പറഞ്ഞു
  rationale: വാക്കുതോറുമുള്ള 'കള്ളം ഉത്തരം പറഞ്ഞു' എന്നതിനേക്കാൾ സാക്ഷ്യത്തിന്റെ നിയമസന്ദർഭം കൃത്യവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: בְאָחִיו
  choice: തന്റെ സഹോദരനെതിരെ
  rationale: നിയമപരമായ സമൂഹസന്ദർഭത്തിൽ 'സഹോദരൻ' എന്ന മൂലരൂപം നിലനിർത്തുകയും בְ എന്നതിന്റെ പ്രതികൂലബന്ധം 'എതിരെ' എന്ന് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: וְהִנֵּה എന്നതിന്റെ അവതരണരീതി
  choice: അന്വേഷണത്തിനു ശേഷം കാര്യം തെളിയുന്ന വ്യവസ്ഥയായി ‘തെളിഞ്ഞാൽ’
  alternative: ‘ഇതാ’ എന്ന നേരിട്ടുള്ള അവതാരകപദം
  rationale: വാക്യത്തിന്റെ നിയമപരമായ വ്യവസ്ഥാസ്വഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; സാക്ഷി കള്ളനാണെന്ന് മുൻകൂട്ടി വിധിക്കുന്നില്ല.
- issue: אָחִיו എന്ന ബന്ധപദം
  choice: തന്റെ സഹോദരൻ
  alternative: സഹജനായ ഇസ്രായേല്യൻ / കൂട്ടുകാരൻ
  rationale: മൂലപാഠത്തിലെ ബന്ധരൂപം സംരക്ഷിക്കുന്നു; പ്രത്യേക വ്യാഖ്യാനപരമായ പരിധി പാഠത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. തുടർന്നുള്ള വാക്യവുമായി ബന്ധിപ്പിക്കുന്നതിനാൽ അവസാനം അർധവിരാമസ്വഭാവമുള്ള കോമ നിലനിർത്തി.
