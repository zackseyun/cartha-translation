- from: ന്യായാധിപന്മാർ കാര്യമായി അന്വേഷിക്കണം. ആ സാക്ഷി കള്ളസാക്ഷിയാണെന്നും തന്റെ സഹോദരനെതിരെ കള്ളസാക്ഷ്യം പറഞ്ഞെന്നും തെളിഞ്ഞാൽ,
