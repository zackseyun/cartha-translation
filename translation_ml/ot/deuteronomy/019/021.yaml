source:
  edition: WLC
  text: וְ/לֹ֥א תָח֖וֹס עֵינֶ֑/ךָ נֶ֣פֶשׁ בְּ/נֶ֗פֶשׁ עַ֤יִן בְּ/עַ֨יִן֙ שֵׁ֣ן בְּ/שֵׁ֔ן יָ֥ד בְּ/יָ֖ד רֶ֥גֶל בְּ/רָֽגֶל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/021.yaml
  text: 'Your eye shall not pity: life for life[a], eye for eye, tooth for tooth, hand for hand[b], foot for foot.'
translation:
  language: ml
  text: 'നിന്റെ കണ്ണ് കരുണ കാണിക്കരുത്[a]: ജീവനു പകരം ജീവൻ[b], കണ്ണിനു പകരം കണ്ണ്, പല്ലിനു പകരം പല്ല്, കൈയ്ക്കു പകരം കൈ, കാലിനു പകരം കാൽ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വെറുതെ വിടരുത്’ അല്ലെങ്കിൽ ‘ദയ കാണിക്കരുത്’.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ എബ്രായപദമായ נֶפֶשׁ ‘ജീവൻ’ എന്നാണർഥം; പിൽക്കാല ദൈവശാസ്ത്രപരമായ പ്രത്യേക അർഥത്തിലുള്ള ‘ആത്മാവ്’ എന്നല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָחוֹס
  choice: കരുണ കാണിക്കരുത്
  rationale: חוס എന്ന ക്രിയയ്ക്ക് ‘കരുണ കാണിക്കുക’, ‘ഒഴിവാക്കിവിടുക/വെറുതെ വിടുക’ എന്നീ അർഥങ്ങളുണ്ട്. നിയമസന്ദർഭത്തിലെ കർശനമായ വിലക്ക് സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുമ്പോഴും കരുണയുടെ ആശയം നിലനിർത്തുന്നു.
- source_word: עֵינֶךָ
  choice: നിന്റെ കണ്ണ്
  rationale: എബ്രായത്തിലെ മൂർത്തമായ ‘നിന്റെ കണ്ണ്’ എന്ന പ്രയോഗം ഒഴിവാക്കി വെറും ‘നീ’ എന്നു പരിഭാഷപ്പെടുത്താതെ, കരുണ കാണിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ഉറവിടഭാഷയിലെ ദൃശ്യബിംബം നിലനിർത്തുന്നു.
- source_word: נֶפֶשׁ
  choice: ജീവൻ
  rationale: נֶפֶשׁ בְּנֶפֶשׁ എന്ന നിയമസൂത്രത്തിൽ ഉദ്ദേശിക്കുന്നത് ജീവനു തുല്യമായി ജീവൻ എന്നതാണ്; പിൽക്കാല തത്ത്വചിന്താപരമായ അർഥത്തിലുള്ള ‘ആത്മാവ്’ എന്നല്ല.
- source_word: בְּ
  choice: പകരം
  rationale: ഓരോ ദ്വയത്തിലും בְּ തുല്യതയെയോ പ്രതിഫലത്തെയോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘പകരം’ നിയമപരമായ തുല്യപ്രതികാരസൂത്രം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: עַיִן
  choice: കണ്ണ്
  rationale: നിയമസൂത്രത്തിലെ ശരീരാവയവത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്ന പദം.
- source_word: שֵׁן
  choice: പല്ല്
  rationale: നിയമസൂത്രത്തിലെ ശരീരാവയവത്തെ കൃത്യമായി സൂചിപ്പിക്കുന്ന സാധാരണ മലയാളപദം.
- source_word: יָד
  choice: കൈ
  rationale: എബ്രായ ശരീരാവയവപദത്തിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: רֶגֶל
  choice: കാൽ
  rationale: ഈ ശരീരാവയവക്രമത്തിൽ רֶגֶל എന്നതിന് യോജിച്ച സ്വാഭാവിക മലയാളപരിഭാഷ.
theological_decisions:
- issue: പ്രതികാരനിയമത്തിന്റെ മൂർത്തമായ സൂത്രം നിലനിർത്തണമോ, അതിനെ ആനുപാതിക നീതിയുടെ പൊതുതത്ത്വമായി മയപ്പെടുത്തണമോ
  choice: ‘ജീവനു പകരം ജീവൻ, കണ്ണിനു പകരം കണ്ണ്’ എന്ന മൂർത്തമായ നിയമസൂത്രം നിലനിർത്തി.
  alternative: ‘കുറ്റത്തിന് അനുസരിച്ചായിരിക്കണം ശിക്ഷ’ എന്ന പൊതുതത്ത്വമായി സ്വതന്ത്രമായി പരിഭാഷപ്പെടുത്തുക.
  rationale: എബ്രായപാഠം സ്ഥിരമായ ഒരു നിയമസൂത്രം തന്നെയാണ് നൽകുന്നത്. അതിന്റെ മൂർത്തമായ ഭാഷ മയപ്പെടുത്തുന്നത് വാക്യത്തിന്റെ ശക്തിയും തോറായിലെ സമാന്തരഭാഗങ്ങളുമായുള്ള ബന്ധവും മറയ്ക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള നിയമശൈലി ഉപയോഗിച്ചു. ‘നിന്റെ കണ്ണ്’ എന്ന എബ്രായഭാഷാശൈലിയും ആവർത്തനാത്മകമായ തുല്യപ്രതികാരസൂത്രവും മനപ്പൂർവം നിലനിർത്തി.
