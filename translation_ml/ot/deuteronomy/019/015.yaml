source:
  edition: WLC
  text: לֹֽא יָקוּם֩ עֵ֨ד אֶחָ֜ד בְּ/אִ֗ישׁ לְ/כָל עָוֺן֙ וּ/לְ/כָל חַטָּ֔את בְּ/כָל חֵ֖טְא אֲשֶׁ֣ר יֶֽחֱטָ֑א עַל פִּ֣י שְׁנֵ֣י עֵדִ֗ים א֛וֹ עַל פִּ֥י שְׁלֹשָֽׁה עֵדִ֖ים יָק֥וּם דָּבָֽר־־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/015.yaml
  text: A single witness shall not stand against a man for any iniquity or for any sin[a], in connection with any sin that he commits[c][b]; on the testimony of two witnesses or on the testimony of three witnesses a matter shall stand.
translation:
  language: ml
  text: ഒരു മനുഷ്യനെതിരെ[a] ഏതൊരു അകൃത്യത്തിനോ ഏതൊരു പാപത്തിനോ—അയാൾ ചെയ്യുന്ന ഏത് പാപത്തിനായാലും—ഒരൊറ്റ സാക്ഷി നിലനിൽക്കുകയില്ല. രണ്ടു സാക്ഷികളുടെ മൊഴിയുടെ അടിസ്ഥാനത്തിലോ[b] മൂന്നു സാക്ഷികളുടെ മൊഴിയുടെ അടിസ്ഥാനത്തിലോ ഒരു കാര്യം നിലനിൽക്കും.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ആർക്കെങ്കിലും എതിരെ’ / ‘ഒരു വ്യക്തിക്കെതിരെ.’ എബ്രായത്തിൽ പുരുഷ ഏകവചനമായ ‘ഒരു മനുഷ്യൻ’ എന്ന പ്രയോഗം പ്രതിനിധിപരമായ നിയമാർഥത്തിൽ ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘രണ്ടു സാക്ഷികളുടെ വായിന്മേലോ മൂന്നു സാക്ഷികളുടെ വായിന്മേലോ.’'
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘ഒരു കേസ് സ്ഥിരീകരിക്കപ്പെടും.’ വാക്യത്തിന്റെ ആദ്യഭാഗത്തും ഇവിടെയും എബ്രായത്തിൽ ഒരേ ക്രിയയാണ് (‘നിലനിൽക്കുക’) ഉപയോഗിച്ചിരിക്കുന്നത്; ഇതിലൂടെ നിയമപരമായ സമാന്തരത സൃഷ്ടിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָקוּם ... יָקוּם
  choice: നിലനിൽക്കുകയില്ല ... നിലനിൽക്കും
  rationale: קום എന്ന ക്രിയയുടെ ‘നിൽക്കുക/നിലനിൽക്കുക’ എന്ന ദൃശ്യഭാവവും നിയമപരമായി സാധുവാകുക എന്ന അർഥവും നിലനിർത്തുന്നു; വാക്യത്തിന്റെ രണ്ടു ഭാഗങ്ങളിലുമുള്ള ആവർത്തനവും സംരക്ഷിക്കുന്നു.
- source_word: עֵד אֶחָד
  choice: ഒരൊറ്റ സാക്ഷി
  rationale: ഏക സാക്ഷിയുടെ അപര്യാപ്തത സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഊന്നിപ്പറയുന്നു.
- source_word: בְּאִישׁ
  choice: ഒരു മനുഷ്യനെതിരെ
  rationale: നിയമസന്ദർഭത്തിൽ בְּ എന്നത് ഒരാൾക്കെതിരെ സാക്ഷ്യം ഉന്നയിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; אִישׁ എന്ന പുരുഷ ഏകവചനത്തിന്റെ പ്രതിനിധിപരമായ രൂപം ‘ഒരു മനുഷ്യൻ’ എന്നു നിലനിർത്തുന്നു.
- source_word: לְכָל עָוֺן
  choice: ഏതൊരു അകൃത്യത്തിന്റെയും കാര്യത്തിൽ
  rationale: עָוֺן എന്നതിന്റെ ധാർമികവും നിയമപരവുമായ ഭാരവും തുടർന്നുള്ള പാപപദങ്ങളിൽനിന്നുള്ള വ്യത്യാസവും ‘അകൃത്യം’ നിലനിർത്തുന്നു.
- source_word: וּלְכָל חַטָּאת
  choice: ഏതൊരു പാപത്തിന്റെയും കാര്യത്തിൽ
  rationale: חַטָּאת ഇവിടെ പൊതുവായി ‘പാപം’ എന്നാണ്; എബ്രായത്തിലെ പദസഞ്ചയം ഒറ്റ നിയമപദമായി ചുരുക്കുന്നില്ല.
- source_word: בְּכָל חֵטְא אֲשֶׁר יֶחֱטָא
  choice: അയാൾ ചെയ്യുന്ന ഏതൊരു പാപത്തിന്റെ കാര്യത്തിലും
  rationale: മൂലത്തിലെ cognate ആവർത്തനം മലയാളത്തിൽ പൂർണമായി അനുകരിക്കുന്നത് അസ്വാഭാവികമാകുമെങ്കിലും, ‘പാപം’ വീണ്ടും ഉപയോഗിച്ച് സമഗ്രതയും ആവർത്തനവും പരമാവധി നിലനിർത്തുന്നു.
- source_word: עַל פִּי
  choice: മൊഴിയാൽ
  rationale: അക്ഷരാർഥം ‘വായിന്മേൽ/വായാൽ’ എന്നാണെങ്കിലും നിയമസന്ദർഭത്തിൽ സാക്ഷിമൊഴിയെ അടിസ്ഥാനമാക്കുക എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: שְׁנֵי עֵדִים ... שְׁלֹשָׁה עֵדִים
  choice: രണ്ടു സാക്ഷികൾ ... മൂന്നു സാക്ഷികൾ
  rationale: സംഖ്യാപരമായ നിയമനിബന്ധനയും സമാന്തരഘടനയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: דָּבָר
  choice: ഒരു കാര്യം
  rationale: דָּבָר നിയമപരമായി പരിഗണിക്കപ്പെടുന്ന വിഷയത്തെയോ കേസിനെയോ സൂചിപ്പിക്കാം; ‘കാര്യം’ ഈ പരിധി ചുരുക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: אִישׁ എന്ന പദത്തിലെ പുരുഷലിംഗ പ്രതിനിധിപ്രയോഗം
  choice: ഒരു മനുഷ്യൻ
  alternative: ആരെങ്കിലും / ഒരു വ്യക്തി
  rationale: നിയമം പൊതുവായി ബാധകമാണെങ്കിലും മൂലപാഠത്തിലെ പുരുഷ ഏകവചനരൂപം ഇല്ലാതാക്കാതെ നിലനിർത്തുന്നു.
- issue: קום എന്ന ക്രിയയുടെ നിയമപരമായ അർഥവും ആവർത്തനവും
  choice: നിലനിൽക്കുകയില്ല ... നിലനിൽക്കും
  alternative: സ്വീകാര്യമാകുകയില്ല ... സ്ഥിരീകരിക്കപ്പെടും
  rationale: നിയമപരമായ സാധുത സൂചിപ്പിക്കുമ്പോഴും മൂലത്തിലെ ഒരേ ക്രിയ രണ്ടിടത്തും വരുന്നതും അതിലെ ‘നിൽക്കുക’ എന്ന രൂപകവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമശൈലി. മൂലത്തിലെ പാപപദങ്ങളുടെ കൂട്ടിച്ചേർക്കലും ആവർത്തനവും സാധ്യമായത്ര നിലനിർത്തിയിട്ടുണ്ട്; എന്നാൽ മലയാളവാക്യം വായനാസൗകര്യത്തിനായി ചിഹ്നവിന്യാസത്തോടെ ക്രമപ്പെടുത്തി.
