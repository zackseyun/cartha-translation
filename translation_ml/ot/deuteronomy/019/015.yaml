  to: ഒരു മനുഷ്യനെതിരെ[a] ഏതൊരു അകൃത്യത്തിനോ ഏതൊരു പാപത്തിനോ—അയാൾ ചെയ്യുന്ന ഏത് പാപത്തിനായാലും—ഒരൊറ്റ സാക്ഷി നിലനിൽക്കുകയില്ല. രണ്ടു സാക്ഷികളുടെ മൊഴിയുടെ അടിസ്ഥാനത്തിലോ[b] മൂന്നു സാക്ഷികളുടെ മൊഴിയുടെ അടിസ്ഥാനത്തിലോ ഒരു കാര്യം നിലനിൽക്കും.[c]
