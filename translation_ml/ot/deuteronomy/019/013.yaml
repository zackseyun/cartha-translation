  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹא תָח֥וֹס עֵֽינְ/ךָ֖ עָלָ֑י/ו וּ/בִֽעַרְתָּ֧ דַֽם הַ/נָּקִ֛י מִ/יִּשְׂרָאֵ֖ל וְ/ט֥וֹב לָֽ/ךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/013.yaml
  text: Your eye shall not pity him[a], but you shall purge the innocent blood from Israel[b], and it shall go well with you.
translation:
  language: ml
  text: നിന്റെ കണ്ണ് അവനോട് കനിവ് കാണിക്കരുത്[a]. നിരപരാധിയുടെ രക്തത്തിന്റെ രക്തക്കുറ്റം ഇസ്രായേലിൽനിന്ന് നീക്കിക്കളയണം[b]; അപ്പോൾ നിനക്കു നന്നായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “നിന്റെ കണ്ണ് അവനെ ഒഴിവാക്കിവിടരുത്.” കനിവിന്റെയോ അനുകമ്പയുടെയോ ആസ്ഥാനമായി കണ്ണിനെ പറയുന്ന ഒരു എബ്രായ ശൈലിയാണിത്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “നിരപരാധിയുടെ രക്തം.” നിരപരാധിയുടെ രക്തം ചൊരിഞ്ഞതുമൂലം ഇസ്രായേൽ സമൂഹത്തിനുമേൽ വന്ന രക്തക്കുറ്റത്തെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָחוֹס עֵינְךָ עָלָיו
  choice: നിന്റെ കണ്ണ് അവനോടു കനിവു കാണിക്കരുത്
  rationale: ‘കണ്ണ്’ എന്ന എബ്രായ ദൃശ്യരൂപം നിലനിർത്തിക്കൊണ്ട്, חוס സൂചിപ്പിക്കുന്ന കനിവുകാട്ടുക/ഒഴിവാക്കിവിടുക എന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു. ‘കനിവ്’ ഇവിടെ നീതിനടപടിയെ തടയുന്ന അനർഹമായ അനുകമ്പയെ സൂചിപ്പിക്കുന്നു.
- source_word: וּבִעַרְתָּ
  choice: നീക്കിക്കളയണം
  rationale: ആവർത്തനപുസ്തകത്തിലെ നിയമസന്ദർഭങ്ങളിൽ בער സാധാരണയായി സമൂഹത്തിൽനിന്ന് ദോഷമോ രക്തക്കുറ്റമോ പൂർണമായി നീക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; അക്ഷരാർഥത്തിലുള്ള ‘ചുട്ടുകളയുക’ ഇവിടെ ഉദ്ദേശ്യമല്ല.
- source_word: דַם הַנָּקִי
  choice: നിരപരാധരക്തം
  rationale: ഉറവിടത്തിലെ സംക്ഷിപ്തമായ നിയമപ്രയോഗം നിലനിർത്തുന്നു. ഇത് നിരപരാധിയുടെ രക്തച്ചൊരിച്ചിലാൽ സമൂഹത്തിനുമേൽ വന്ന രക്തക്കുറ്റത്തെ ഉൾക്കൊള്ളുന്നുവെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: מִיִּשְׂרָאֵל
  choice: ഇസ്രായേലിൽനിന്ന്
  rationale: מן സൂചിപ്പിക്കുന്ന നീക്കംചെയ്യലിന്റെ സാമൂഹിക പരിധി നേരിട്ടും സംക്ഷിപ്തമായും നൽകുന്നു.
- source_word: וְטוֹב לָךְ
  choice: അപ്പോൾ നിനക്കു നന്മയുണ്ടാകും
  rationale: അനുസരണത്തിന്റെ ഗുണകരമായ ഫലം സൂചിപ്പിക്കുന്ന ആവർത്തനപുസ്തകത്തിലെ ഉടമ്പടി-സൂത്രവാക്യം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘അപ്പോൾ’ ഫലബന്ധം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: കൊലപാതകിക്കെതിരായ കല്പനയുടെ സ്വഭാവം
  choice: നിയമാനുസൃതമായ സമൂഹനീതിയിൽ തെറ്റായ കനിവ് തടസ്സമാകരുതെന്നും നിരപരാധരക്തത്തിന്റെ കുറ്റം സമൂഹത്തിൽനിന്ന് നീക്കണമെന്നും കല്പിക്കുന്നതായി പരിഭാഷപ്പെടുത്തി.
  alternative: സ്വകാര്യ പ്രതികാരത്തിനുള്ള അനുമതിയായി വായിക്കുക.
  rationale: ആവർത്തനപുസ്തകം 19:11–12-ലെ സന്ദർഭം മനഃപൂർവ കൊലപാതകിയുടെ ഔദ്യോഗിക ന്യായവിധിയാണ്, വ്യക്തിപരമായ പ്രതികാരമല്ല. ഈ വിശദീകരണം മുഖ്യവാക്യത്തിൽ ചേർക്കാതെ നിയമപരമായ ഉറവിടഭാഷ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ നിയമശൈലി ഉപയോഗിച്ചു. ‘നിന്റെ കണ്ണ്’ എന്ന ഉറവിടദൃശ്യരൂപവും ‘നിരപരാധരക്തം’ എന്ന നിയമപ്രയോഗവും നിലനിർത്തി; അവയുടെ അർഥപരിധി അടിക്കുറിപ്പുകളിൽ വ്യക്തമാക്കി.
