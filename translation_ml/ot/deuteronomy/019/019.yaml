source:
  edition: WLC
  text: וַ/עֲשִׂ֣יתֶם ל֔/וֹ כַּ/אֲשֶׁ֥ר זָמַ֖ם לַ/עֲשׂ֣וֹת לְ/אָחִ֑י/ו וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/019.yaml
  text: Then you shall do to him just as he intended to do to his brother[a]. So you shall purge the evil from your midst.
translation:
  language: ml
  text: അപ്പോൾ, അവൻ തന്റെ സഹോദരനോടു ചെയ്യാൻ ഉദ്ദേശിച്ചതുപോലെതന്നെ നിങ്ങൾ അവനോടും ചെയ്യണം.[a] അങ്ങനെ നിങ്ങളുടെ ഇടയിൽനിന്ന് തിന്മ നീക്കിക്കളയണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “തന്റെ സഹസമൂഹാംഗത്തോട്.” ഹീബ്രുവിൽ “തന്റെ സഹോദരനോട്”; ഈ നിയമസന്ദർഭത്തിൽ ഇത് ഉടമ്പടിസമൂഹത്തിലെ മറ്റൊരു അംഗത്തെ സൂചിപ്പിക്കുന്ന പദമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: നിങ്ങൾ ... ചെയ്യണം
  rationale: സമൂഹത്തെയോ ന്യായാധിപന്മാരെയോ അഭിസംബോധന ചെയ്യുന്ന നിയമനിർദേശത്തിന്റെ ബലം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; വാവിന്റെ തുടർച്ചാസൂചന ‘അപ്പോൾ’ എന്നതിലൂടെ പ്രകടമാക്കി.
- source_word: לוֹ
  choice: അവനോട്
  rationale: സന്ദർഭത്തിലെ കള്ളസാക്ഷിയെ സൂചിപ്പിക്കുന്ന ദത്തിവ് സർവനാമത്തിന്റെ നേരിട്ടുള്ള മലയാളരൂപം.
- source_word: כַּאֲשֶׁר
  choice: ഉദ്ദേശിച്ചതുപോലെതന്നെ
  rationale: ശിക്ഷ കുറ്റകരമായ ഉദ്ദേശ്യത്തോട് കൃത്യമായി ഒത്തിരിക്കണമെന്ന അളവിനൊത്ത പ്രത്യുപകാരബന്ധം ‘പോലെതന്നെ’ വ്യക്തമാക്കുന്നു.
- source_word: זָמַם
  choice: ഉദ്ദേശിച്ചു
  rationale: ശത്രുതാപരമായ പദ്ധതി എന്ന അർഥസാധ്യത നിലനിൽക്കുന്നുവെങ്കിലും, കള്ളസാക്ഷ്യത്തിന്റെ സന്ദർഭം ദുഷ്ടലക്ഷ്യം വ്യക്തമാക്കുന്നതിനാൽ അധിക നിറം ചേർക്കാതെ ഉദ്ദേശ്യത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: לַעֲשׂוֹת
  choice: ചെയ്യാൻ
  rationale: זָמַם എന്ന ക്രിയയുടെ പൂരകമായ infinitive-ന്റെ ലളിതവും കൃത്യവുമായ പരിഭാഷ.
- source_word: לְאָחִיו
  choice: തന്റെ സഹോദരനോട്
  rationale: ഹീബ്രു אָח എന്ന പദത്തിന്റെ ‘സഹോദരൻ’ എന്ന രൂപം നിലനിർത്തുന്നു; നിയമപരമായ ഉടമ്പടിസമൂഹസന്ദർഭത്തിൽ ഇതിന് സഹസമൂഹാംഗം എന്ന വിശാല അർഥമുണ്ടാകാമെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: וּבִעַרְתָּ
  choice: അങ്ങനെ ... നീക്കിക്കളയണം
  rationale: ഇവിടെ അക്ഷരാർഥത്തിലുള്ള കത്തിക്കൽ അല്ല, സമൂഹത്തിൽനിന്നുള്ള തിന്മയുടെ നിർമാർജനമാണ് ദ്വിതീയോപദേശത്തിലെ നിയമസൂത്രം സൂചിപ്പിക്കുന്നത്. ‘നീക്കിക്കളയണം’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും ശക്തവുമാണ്.
- source_word: הָרָע
  choice: തിന്മ
  rationale: നിയമലംഘനത്തെ മാത്രം ചുരുക്കാതെ മൂലപാഠത്തിലെ ധാർമികവും സൂത്രവാക്യപരവുമായ ഭാരം നിലനിർത്തുന്നു.
- source_word: מִקִּרְבֶּךָ
  choice: നിങ്ങളുടെ ഇടയിൽനിന്ന്
  rationale: ഇസ്രായേൽസമൂഹത്തിന്റെ ഉള്ളിൽനിന്ന് തിന്മ നീക്കുന്നതെന്ന സമൂഹാത്മക ദൃശ്യത്തെ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: നിയമസന്ദർഭത്തിലെ ലിംഗസൂചക ഉടമ്പടിസമൂഹപദമായ אָחִיו
  choice: തന്റെ സഹോദരനോട്
  alternative: തന്റെ സഹസമൂഹാംഗത്തോട് / തന്റെ കൂട്ടുകാരനോട്
  rationale: മൂലപാഠത്തിലെ പുല്ലിംഗ ഏകവചനരൂപം പ്രധാനവാചകത്തിൽ സംരക്ഷിക്കുന്നു. അതേസമയം, ഈ നിയമസന്ദർഭത്തിൽ ‘സഹോദരൻ’ എന്നത് ഉടമ്പടിസമൂഹത്തിലെ മറ്റൊരു അംഗത്തെ പ്രതിനിധീകരിക്കാമെന്ന വിശാലത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമനിർദേശശൈലി. ‘ചെയ്യണം’, ‘നീക്കിക്കളയണം’ എന്നീ രൂപങ്ങൾ നിർബന്ധത്തിന്റെ ബലം വ്യക്തമാക്കുന്നു; ‘തിന്മ’ ദ്വിതീയോപദേശത്തിലെ ആവർത്തിത നിയമസൂത്രത്തിന്റെ ധാർമിക ഭാരം നിലനിർത്തുന്നു.
