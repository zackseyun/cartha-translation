source:
  edition: WLC
  text: וְ/לֹ֤א יִשָּׁפֵךְ֙ דָּ֣ם נָקִ֔י בְּ/קֶ֣רֶב אַרְצְ/ךָ֔ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ נַחֲלָ֑ה וְ/הָיָ֥ה עָלֶ֖י/ךָ דָּמִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/010.yaml
  text: so that innocent blood may not be shed in the midst of your land that Yahweh your God is giving you as an inheritance[a], and bloodguilt would be upon you.
translation:
  language: ml
  text: നിന്റെ ദൈവമായ യഹ്‌വെ നിനക്കു അവകാശമായി നൽകുന്ന ദേശത്തിനകത്ത് നിരപരാധിയുടെ രക്തം ചൊരിയപ്പെടാതിരിക്കാനും, അങ്ങനെ രക്തപാതകക്കുറ്റം നിന്റെമേൽ വരാതിരിക്കാനും വേണ്ടിയാണ് ഇത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “രക്തം നിന്റെമേൽ ഉണ്ടായിരിക്കും.” ഇവിടെ എബ്രായപ്രയോഗം നിരപരാധിയുടെ രക്തം ചൊരിഞ്ഞതിനുള്ള നിയമപരമായ കുറ്റബാധ്യതയെ, അതായത് രക്തപാതകക്കുറ്റത്തെ, സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׁפֵךְ
  choice: ചൊരിയപ്പെടുക
  rationale: ശפך എന്ന ക്രിയയുടെ നിഫാൽ രൂപം ഇവിടെ രക്തം ‘ചൊരിയപ്പെടുക’ എന്ന കർമണിപ്രയോഗമാണ് സൂചിപ്പിക്കുന്നത്; കൊലപാതകവുമായി ബന്ധപ്പെട്ട നിയമസന്ദർഭത്തിൽ ഇത് സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: דָּם נָקִי
  choice: നിരപരാധിയുടെ രക്തം
  rationale: മരണശിക്ഷയ്ക്ക് അർഹനല്ലാത്ത ഒരാളുടെ രക്തത്തെ സൂചിപ്പിക്കുന്ന നിയമപരവും ധാർമികവുമായ പ്രയോഗമാണിത്. അക്ഷരാർഥത്തിലുള്ള ‘നിരപരാധമായ രക്തം’ എന്നതിനെക്കാൾ മലയാളത്തിൽ ‘നിരപരാധിയുടെ രക്തം’ സ്വാഭാവികമാണ്.
- source_word: בְּקֶרֶב אַרְצְךָ
  choice: നിന്റെ ദേശത്തിനകത്ത്
  rationale: קֶרֶב എന്ന പദത്തിന്റെ ‘ഉള്ളിൽ/മധ്യത്തിൽ’ എന്ന സ്ഥലസൂചന നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായ ദൈവനാമമായ יהוה ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, അതിന്റെ സാധാരണ പണ്ഡിതോചിത ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: נֹתֵן לְךָ נַחֲלָה
  choice: നിനക്ക് അവകാശമായി തരുന്ന
  rationale: നֹתֵן എന്ന കൃന്ദന്തരൂപത്തിന്റെ തുടരുന്ന/വർത്തമാന സ്വഭാവവും נַחֲלָה എന്ന പദത്തിന്റെ പാരമ്പര്യസ്വത്തായ അവകാശം എന്ന ആശയവും നിലനിർത്തുന്നു.
- source_word: וְהָיָה עָלֶיךָ דָּמִים
  choice: രക്തപാതകത്തിന്റെ കുറ്റം നിന്റെമേൽ വരുക
  rationale: നിയമസന്ദർഭത്തിലെ ബഹുവചനമായ דָּמִים രക്തച്ചൊരിച്ചിലിനുള്ള കുറ്റബാധ്യതയെ സൂചിപ്പിക്കുന്നു; עַל എന്ന ഘടനയിലെ ‘മേൽ’ എന്ന രൂപകവും മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ ഒരു സ്ഥാനപ്പേര് പകരംവയ്ക്കാതെ ലിപ്യന്തരണം ചെയ്തു; ‘യഹോവ’യെക്കാൾ യഹ്‌വെ എബ്രായനാമത്തിന്റെ പണ്ഡിതലോകത്ത് പൊതുവായി അംഗീകരിക്കപ്പെട്ട ഉച്ചാരണത്തോട് അടുത്തതാണ്.
- issue: דָּמִים എന്നതിന്റെ നിയമപരമായ അർഥം
  choice: രക്തപാതകത്തിന്റെ കുറ്റം
  alternative: രക്തം
  rationale: ഇവിടെ ആശയം വെറും രക്തമല്ല, തടയാമായിരുന്ന നിരപരാധരക്തച്ചൊരിച്ചിലിനുള്ള സമൂഹത്തിന്റെ ബാധ്യതയാണ്. എന്നിരുന്നാലും അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ച് എബ്രായ പ്രയോഗത്തിന്റെ തീവ്രത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ഹേതുവാചകമായ לֹאയും തുടർന്നുള്ള ഫലവാക്യവും മലയാളത്തിൽ ‘-ാതിരിക്കാനും’ എന്ന സമാന്തരഘടനയിൽ ചേർത്തു. അടിക്കുറിപ്പ് ചൂണ്ടിക്കാണിക്കുന്ന [a] പ്രധാനവാചകത്തിൽ വ്യക്തമായി ഉൾപ്പെടുത്തി.
