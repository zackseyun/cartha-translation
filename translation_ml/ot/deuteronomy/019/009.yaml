source:
  edition: WLC
  text: כִּֽי תִשְׁמֹר֩ אֶת כָּל הַ/מִּצְוָ֨ה הַ/זֹּ֜את לַ/עֲשֹׂתָ֗/הּ אֲשֶׁ֨ר אָנֹכִ֣י מְצַוְּ/ךָ֮ הַ/יּוֹם֒ לְ/אַהֲבָ֞ה אֶת יְהוָ֧ה אֱלֹהֶ֛י/ךָ וְ/לָ/לֶ֥כֶת בִּ/דְרָכָ֖י/ו כָּל הַ/יָּמִ֑ים וְ/יָסַפְתָּ֨ לְ/ךָ֥ עוֹד֙ שָׁלֹ֣שׁ עָרִ֔ים עַ֖ל הַ/שָּׁלֹ֥שׁ הָ/אֵֽלֶּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/009.yaml
  text: if you keep all this commandment by doing it[a], which I am commanding you today—to love Yahweh your God and to walk in his ways all your days—then you shall add for yourself three more cities besides these three,
translation:
  language: ml
  text: ഇന്നു ഞാൻ നിന്നോടു കല്പിക്കുന്ന ഈ കല്പന മുഴുവനും[a] പാലിച്ചു അനുഷ്ഠിക്കാനും നിന്റെ ദൈവമായ യഹ്‌വെയെ സ്നേഹിക്കാനും എല്ലാക്കാലവും അവന്റെ വഴികളിൽ നടക്കാനും നീ ശ്രദ്ധിക്കുമെങ്കിൽ, ഈ മൂന്നു പട്ടണങ്ങൾക്കു പുറമേ മൂന്നു പട്ടണങ്ങൾകൂടി നിനക്കായി ചേർക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായമൂലത്തിൽ ‘ഈ കല്പന മുഴുവനും’ ഏകവചനത്തിലാണ്.
    reason: മൂലപാഠത്തിലെ ഏകവചനരൂപം പ്രധാനപാഠത്തിലും നിലനിർത്തിയിരിക്കുന്നു.
lexical_decisions:
- source_word: כִּי תִשְׁמֹר
  choice: നീ പാലിച്ച് … എങ്കിൽ
  rationale: כִּי ഇവിടെ നിബന്ധന അവതരിപ്പിക്കുന്നു; שׁמר കല്പനയോടുള്ള ഉടമ്പടിപരമായ അനുസരണത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പാലിക്കുക’ സ്വാഭാവികമാണ്.
- source_word: כָּל הַמִּצְוָה הַזֹּאת
  choice: ഈ കല്പന മുഴുവനും
  rationale: മൂലപാഠത്തിലെ ഏകവചനം നിലനിർത്തിക്കൊണ്ട് כָּל എന്നതിന്റെ സമഗ്രത മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לַעֲשֹׂתָהּ
  choice: അനുഷ്ഠിച്ച്
  rationale: കല്പന പ്രായോഗികമായി നടപ്പാക്കുന്നതാണ് ഉദ്ദേശ്യം; ‘പാലിച്ച് അനുഷ്ഠിക്കുക’ എന്ന പ്രയോഗം שׁמר-עשה ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: ഞാൻ ഇന്നു നിന്നോടു കല്പിക്കുന്ന
  rationale: പങ്കാളിക്രിയയുടെ തുടരുന്ന വചനപ്രവർത്തനഭാവം ‘കല്പിക്കുന്ന’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, ‘Yahweh’ എന്ന ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: וְלָלֶכֶת בִּדְרָכָיו
  choice: അവന്റെ വഴികളിൽ നടക്കുകയും
  rationale: ഉടമ്പടിപരമായ ജീവിതത്തെ സൂചിപ്പിക്കുന്ന ‘വഴികളിൽ നടക്കുക’ എന്ന മൂലരൂപകം സംരക്ഷിക്കുന്നു.
- source_word: כָּל הַיָּמִים
  choice: ജീവിതകാലം മുഴുവൻ
  rationale: അക്ഷരാർഥമായ ‘എല്ലാ ദിവസങ്ങളും’ എന്നതിന്റെ ആജീവനാന്ത വ്യാപ്തി സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: וְיָסַפְתָּ לְךָ עוֹד שָׁלֹשׁ עָרִים
  choice: മൂന്നു പട്ടണങ്ങൾകൂടി നിനക്കായി ചേർക്കണം
  rationale: יסף എന്നതിന്റെ കൂട്ടിച്ചേർക്കൽഭാവവും לְךָ എന്നതും നിലനിർത്തി നിയമനിർദേശത്തിന് അനുയോജ്യമായ മലയാളരൂപം നൽകുന്നു.
- source_word: עַל הַשָּׁלֹשׁ הָאֵלֶּה
  choice: ഈ മൂന്നു പട്ടണങ്ങൾക്കു പുറമേ
  rationale: עַל ഇവിടെ കൂട്ടിച്ചേർക്കലിന്റെ അർഥത്തിലാണ്; ‘പുറമേ’ അത് വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം വ്യക്തിപരമായ ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ ഉപയോഗിച്ചില്ല; ‘യഹ്‌വെ’ എന്നത് Yahweh-യുടെ നേരിട്ടുള്ള മലയാള ലിപ്യന്തരണമാണ്.
- issue: സ്നേഹിക്കലും വഴികളിൽ നടക്കലും കല്പനയോടുള്ള ബന്ധം
  choice: ഡാഷുകൾക്കുള്ളിൽ നിബന്ധനയുടെ ഉള്ളടക്കമായി നിലനിർത്തി
  alternative: ‘അതായത്’ ചേർത്ത് വ്യക്തമായ സമീകരണം നൽകുക
  rationale: ഹീബ്രു ഇൻഫിനിറ്റീവുകൾ ഉദ്ദേശ്യം, ഉള്ളടക്കം, അല്ലെങ്കിൽ വിശദീകരണം എന്നിങ്ങനെ ബന്ധിപ്പിക്കാവുന്നതിനാൽ, ‘അതായത്’ ചേർത്ത് ബന്ധം ഒറ്റവിധം തീർപ്പാക്കാതെ മൂലത്തിലെ തുറന്ന ബന്ധം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. നിയമപരവും ഉടമ്പടിപരവുമായ ഭാവം നിലനിർത്തിയപ്പോൾ അനാവശ്യമായ പഴഞ്ചൊല്ലുകളും വിഭാഗീയ പദപ്രയോഗങ്ങളും ഒഴിവാക്കി.
