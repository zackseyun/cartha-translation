revisions:
- from: ഞാൻ ഇന്നു നിന്നോടു കല്പിക്കുന്ന ഈ കല്പന മുഴുവനും[a] നീ പാലിച്ച് അനുഷ്ഠിക്കുമെങ്കിൽ—നിന്റെ ദൈവമായ യഹ്‌വെയെ സ്നേഹിക്കുകയും ജീവിതകാലം മുഴുവൻ അവന്റെ വഴികളിൽ നടക്കുകയും ചെയ്താൽ—ഈ മൂന്നു പട്ടണങ്ങൾക്കു പുറമേ മൂന്നു പട്ടണങ്ങൾകൂടി നിനക്കായി ചേർക്കണം.
  to: ഇന്നു ഞാൻ നിന്നോടു കല്പിക്കുന്ന ഈ കല്പന മുഴുവനും[a] പാലിച്ചു അനുഷ്ഠിക്കാനും നിന്റെ ദൈവമായ യഹ്‌വെയെ സ്നേഹിക്കാനും എല്ലാക്കാലവും അവന്റെ വഴികളിൽ നടക്കാനും നീ ശ്രദ്ധിക്കുമെങ്കിൽ, ഈ മൂന്നു പട്ടണങ്ങൾക്കു പുറമേ മൂന്നു പട്ടണങ്ങൾകൂടി നിനക്കായി ചേർക്കണം.
  rationale: The revision removes the unwarranted second conditional and places ‘to do it,’ ‘to love,’ and ‘to walk’ in a single coordinated infinitival construction under the verse’s sole condition. It retains the singular commandment, Yahweh’s name, the covenantal walking metaphor, and the addition of three cities.
