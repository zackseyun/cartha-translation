id: DEU.19.14
reference: Deuteronomy 19:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹ֤א תַסִּיג֙ גְּב֣וּל רֵֽעֲ/ךָ֔ אֲשֶׁ֥ר גָּבְל֖וּ רִאשֹׁנִ֑ים בְּ/נַחֲלָֽתְ/ךָ֙ אֲשֶׁ֣ר תִּנְחַ֔ל בָּ/אָ֕רֶץ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ לְ/רִשְׁתָּֽ/הּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/014.yaml
  text: You shall not move your neighbor’s boundary marker[a], which the former generations set, in your inheritance that you will inherit in the land that Yahweh your God is giving you to possess.
translation:
  language: ml
  text: നിന്റെ ദൈവമായ യഹ്‌വെ നിനക്കു കൈവശമാക്കേണ്ടതിന് തരുന്ന ദേശത്ത്, നിനക്കു അവകാശമായി ലഭിക്കാനിരിക്കുന്ന ഭൂമിയിൽ, മുൻതലമുറക്കാർ നിശ്ചയിച്ച നിന്റെ അയൽക്കാരന്റെ അതിർത്തിയടയാളം[a] നീ മാറ്റരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അതിർത്തിക്കല്ല്’ അല്ലെങ്കിൽ ‘അതിർത്തിചിഹ്നം’. എബ്രായപദം അടയാളംകൊണ്ട് നിശ്ചയിച്ച ഭൂമിയുടെ അതിർത്തിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַסִּיג
  choice: മാറ്റരുത്
  rationale: ഹിഫ്ഇൽ രൂപം അതിർത്തി പിന്നോട്ടു നീക്കി അന്യന്റെ ഭൂമിയിൽ കടന്നുകയറുന്നതിനെ സൂചിപ്പിക്കുന്നു. ദിശ അനാവശ്യമായി വ്യക്തമാക്കാതെ നിയമനിരോധനം സ്വാഭാവികമായി അറിയിക്കാൻ ‘മാറ്റരുത്’ ഉപയോഗിച്ചു.
- source_word: גְּבוּל
  choice: അതിർത്തിക്കല്ല്
  rationale: ഈ സ്വത്തവകാശസന്ദർഭത്തിൽ അടയാളംകൊണ്ട് ഉറപ്പിച്ച ഭൂഅതിർത്തിയാണ് ഉദ്ദേശ്യം. മലയാളത്തിൽ നീക്കാവുന്ന ഭൗതിക അടയാളത്തെ വ്യക്തമായി സൂചിപ്പിക്കാൻ ‘അതിർത്തിക്കല്ല്’ അനുയോജ്യം; വിശാലമായ അർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: רֵעֲךָ
  choice: നിന്റെ അയൽക്കാരന്റെ
  rationale: നിയമപരവും സമൂഹപരവുമായ ഈ സന്ദർഭത്തിൽ സഹസമൂഹാംഗത്തെയോ സമീപസ്ഥ ഭൂവുടമയെയോ സൂചിപ്പിക്കുന്നു; ‘അയൽക്കാരൻ’ സ്വാഭാവികവും പ്രസക്തവുമാണ്.
- source_word: גָּבְלוּ
  choice: സ്ഥാപിച്ച
  rationale: അതിർത്തി നിശ്ചയിക്കുകയോ അടയാളപ്പെടുത്തുകയോ ചെയ്ത പൂർത്തിയായ പ്രവൃത്തിയെ സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: רִאשֹׁנִים
  choice: മുൻതലമുറക്കാർ
  rationale: ഇപ്പോഴുള്ളവർക്കു മുമ്പ് ഭൂവിഭാഗങ്ങളുടെ അതിർത്തി നിശ്ചയിച്ചവരെയാണ് ബഹുവചന വിശേഷണം സൂചിപ്പിക്കുന്നത്.
- source_word: בְּנַחֲלָתְךָ
  choice: നീ അവകാശമായി പ്രാപിക്കാനിരിക്കുന്ന സ്ഥലത്ത്
  rationale: נַחֲלָהയുടെ പാരമ്പര്യമായി ലഭിക്കുന്ന ഭൂവിഹിതം എന്ന നിയമപരവും ഉടമ്പടിപരവുമായ ആശയം ‘അവകാശമായി’ നിലനിർത്തുന്നു; മലയാളത്തിലെ അനാവശ്യ പദാവർത്തനം ഒഴിവാക്കാൻ ഉപവാക്യവുമായി സ്വാഭാവികമായി ചേർത്തു.
- source_word: תִּנְחַל
  choice: പ്രാപിക്കാനിരിക്കുന്ന
  rationale: ഇസ്രായേൽ ഭാവിയിൽ അവകാശമായി സ്വീകരിക്കുന്ന ഭൂമിയെന്ന ഭാവിമുഖത നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ നേരിട്ട് ലിപ്യന്തരിച്ചു.
- source_word: נֹתֵן לְךָ
  choice: നിനക്കു ... തരുന്ന
  rationale: എബ്രായ പങ്കാളിക്രിയയുടെ തുടർച്ചയുള്ള/സവിശേഷമായ ദാനപ്രവൃത്തി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: לְרִשְׁתָּהּ
  choice: കൈവശമാക്കാൻ
  rationale: ദേശത്തെ ഏറ്റെടുത്തു കൈവശം വയ്ക്കുക എന്ന ירשׁയുടെ അർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു; ഇതിലൂടെ ഉടമ്പടിനാമം നിലനിൽക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നിയമനിരോധനത്തിന്റെ നേരിട്ടുള്ള ഭാവം നിലനിർത്തി. ‘അവകാശം/കൈവശം’ എന്നീ പദങ്ങൾ ഭൂദാനത്തിന്റെ ഉടമ്പടിപരവും നിയമപരവുമായ വ്യത്യസ്ത വശങ്ങൾ സംരക്ഷിക്കുന്നു.
