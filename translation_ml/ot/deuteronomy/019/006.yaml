revisions:
- from: അല്ലെങ്കിൽ, രക്തപ്രതികാരകൻ കോപം ജ്വലിച്ച്[a] നരഹത്യ ചെയ്തവനെ പിന്തുടരുകയും, ദൂരം കൂടുതലായതിനാൽ അവനെ പിടികൂടി കൊന്നുകളയുകയും ചെയ്തേക്കാം. എന്നാൽ മുമ്പ് അവനോട് വൈരമില്ലാതിരുന്നതിനാൽ[b] അയാൾ മരണശിക്ഷയ്ക്ക് അർഹനായിരുന്നില്ല.
  to: അങ്ങനെയല്ലെങ്കിൽ, രക്തപ്രതികാരകൻ തന്റെ ഹൃദയത്തിൽ കോപം ജ്വലിച്ചതിനാൽ[a] നരഹത്യ ചെയ്തവനെ പിന്തുടരുകയും, ദൂരം കൂടുതലായതിനാൽ അവനെ പിടികൂടി കൊന്നുകളയുകയും ചെയ്തേക്കാം; എന്നാൽ നരഹത്യ ചെയ്തവൻ മുമ്പ്[b] അവനോട് ശത്രുത പുലർത്തിയിരുന്നില്ലാത്തതിനാൽ മരണശിക്ഷയ്ക്ക് വിധേയനായിരുന്നില്ല.
  rationale: The revision retains the draft’s established terminology and its non-prejudicial legal distinction, while clarifying that the avenger’s anger motivates the pursuit and that the manslayer—not the avenger—had no prior hostility toward the victim. It also places the temporal-idiom footnote at its precise anchor and uses a more juridically focused expression for the absence of a death judgment.
