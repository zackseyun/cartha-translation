source:
  edition: WLC
  text: פֶּן יִרְדֹּף֩ גֹּאֵ֨ל הַ/דָּ֜ם אַחֲרֵ֣י הָ/רֹצֵ֗חַ כִּי יֵחַם֮ לְבָב/וֹ֒ וְ/הִשִּׂיג֛/וֹ כִּֽי יִרְבֶּ֥ה הַ/דֶּ֖רֶךְ וְ/הִכָּ֣ה/וּ נָ֑פֶשׁ וְ/ל/וֹ֙ אֵ֣ין מִשְׁפַּט מָ֔וֶת כִּ֠י לֹ֣א שֹׂנֵ֥א ה֛וּא ל֖/וֹ מִ/תְּמ֥וֹל שִׁלְשֽׁוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/006.yaml
  text: otherwise the avenger of blood may pursue the manslayer[a], because his heart is hot, and overtake him because the way is long, and strike him dead, though he did not deserve the death penalty[b], since he had not hated him previously.
translation:
  language: ml
  text: അങ്ങനെയല്ലെങ്കിൽ, രക്തപ്രതികാരകൻ തന്റെ ഹൃദയത്തിൽ കോപം ജ്വലിച്ചതിനാൽ[a] നരഹത്യ ചെയ്തവനെ പിന്തുടരുകയും, ദൂരം കൂടുതലായതിനാൽ അവനെ പിടികൂടി കൊന്നുകളയുകയും ചെയ്തേക്കാം; എന്നാൽ നരഹത്യ ചെയ്തവൻ മുമ്പ്[b] അവനോട് ശത്രുത പുലർത്തിയിരുന്നില്ലാത്തതിനാൽ മരണശിക്ഷയ്ക്ക് വിധേയനായിരുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘അവന്റെ ഹൃദയം ചൂടായതിനാൽ.’ ഈ എബ്രായ ശൈലി ആളിക്കത്തുന്ന കോപത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘ഇന്നലെയോ അതിനു മുമ്പോ മുതൽ’; മുമ്പത്തെ കാലത്തെ സൂചിപ്പിക്കുന്ന ഒരു എബ്രായ ശൈലി.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: അല്ലെങ്കിൽ
  rationale: അഭയനഗരങ്ങൾ അടുത്തായിരിക്കേണ്ടതിന്റെ പ്രതിരോധപരമായ കാരണം സ്വാഭാവിക മലയാളത്തിൽ മുന്നറിയിപ്പായി അവതരിപ്പിക്കുന്നു.
- source_word: גֹּאֵל הַדָּם
  choice: രക്തപ്രതികാരകൻ
  rationale: കൊല്ലപ്പെട്ടയാളുടെ രക്തത്തിന് പ്രതികാരം ചെയ്യുന്ന അടുത്ത ബന്ധുവിന്റെ നിയമപരമായ പങ്ക് സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: הָרֹצֵחַ
  choice: നരഹത്യ ചെയ്തവൻ
  rationale: മുൻവൈരമില്ലാതെ ഒരാളെ കൊന്ന വ്യക്തിയെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; ‘കൊലപാതകി’ എന്നു പറഞ്ഞാൽ മനഃപൂർവമായ കൊല എന്ന അർഥം അനാവശ്യമായി വരാം.
- source_word: כִּי יֵחַם לְבָבוֹ
  choice: കോപം ജ്വലിച്ച്
  rationale: ‘ഹൃദയം ചൂടാകുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ഉഗ്രകോപം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וְהִשִּׂיגוֹ
  choice: അവനെ പിടികൂടി
  rationale: പിന്തുടർന്ന് എത്തിപ്പിടിക്കുക എന്ന സന്ദർഭാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: כִּי יִרְבֶּה הַדֶּרֶךְ
  choice: ദൂരം കൂടുതലായതിനാൽ
  rationale: വഴി ദീർഘമായിരിക്കുക എന്ന മൂലപാഠത്തിന്റെ ആശയം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പറയുന്നു.
- source_word: וְהִכָּהוּ נָפֶשׁ
  choice: കൊന്നുകളയുകയും
  rationale: ജീവൻ പോകത്തക്കവിധം പ്രഹരിക്കുക എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ഫലം വ്യക്തമായി നൽകുന്നു.
- source_word: וְלוֹ אֵין מִשְׁפַּט מָוֶת
  choice: അയാൾ മരണശിക്ഷയ്ക്ക് അർഹനായിരുന്നില്ല
  rationale: ആ വ്യക്തിക്കെതിരെ മരണവിധിക്ക് നിയമപരമായ അടിസ്ഥാനം ഇല്ലെന്ന ആശയം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: כִּי לֹא שֹׂנֵא הוּא לוֹ
  choice: അവനോട് വൈരമില്ലാതിരുന്നതിനാൽ
  rationale: മുൻവൈരത്തിന്റെ അഭാവമാണ് മരണശിക്ഷ ബാധകമല്ലാത്തതിന്റെ കാരണം എന്ന് വ്യക്തമാക്കുന്നു.
- source_word: מִתְּמוֹל שִׁלְשׁוֹם
  choice: മുമ്പ്
  rationale: ‘ഇന്നലെയോ അതിനു മുമ്പോ മുതൽ’ എന്ന എബ്രായ കാലസൂചക ശൈലിയുടെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; അക്ഷരരൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: മനഃപൂർവ കൊലയും മുൻവൈരമില്ലാത്ത നരഹത്യയും തമ്മിലുള്ള നിയമപരമായ വ്യത്യാസം
  choice: ‘നരഹത്യ ചെയ്തവൻ’, ‘മരണശിക്ഷയ്ക്ക് അർഹനായിരുന്നില്ല’
  alternative: ‘കൊലപാതകി’, ‘മരണവിധി ഇല്ലായിരുന്നു’
  rationale: വാക്യം തന്നെ മുൻവൈരമില്ലായ്മ ചൂണ്ടിക്കാണിക്കുന്നതിനാൽ മനഃപൂർവ കൊല എന്ന വിധി വിവർത്തനം മുൻകൂട്ടി ചുമത്തുന്നില്ല; അതേസമയം നിയമപരമായ മരണശിക്ഷാ ബാധ്യതയുടെ അഭാവം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമ-ആഖ്യാന ശൈലി. ‘രക്തപ്രതികാരകൻ’ എന്ന സാങ്കേതിക പദം മൂലപാഠത്തിലെ ബന്ധുത്വ-നിയമപരമായ പങ്ക് സംരക്ഷിക്കുന്നു; അപൂർവമായ എബ്രായ പ്രയോഗങ്ങൾ മുഖ്യവാചകത്തിൽ സ്വാഭാവികമാക്കി അടിക്കുറിപ്പുകളിൽ അക്ഷരാർഥം നൽകിയിരിക്കുന്നു.
