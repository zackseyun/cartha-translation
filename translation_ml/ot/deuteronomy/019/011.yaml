source:
  edition: WLC
  text: וְ/כִֽי יִהְיֶ֥ה אִישׁ֙ שֹׂנֵ֣א לְ/רֵעֵ֔/הוּ וְ/אָ֤רַב ל/וֹ֙ וְ/קָ֣ם עָלָ֔י/ו וְ/הִכָּ֥ה/וּ נֶ֖פֶשׁ וָ/מֵ֑ת וְ/נָ֕ס אֶל אַחַ֖ת הֶ/עָרִ֥ים הָ/אֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/011.yaml
  text: But if there is a man who hates his neighbor[a], and lies in wait for him, and rises up against him, and strikes him so that he dies, and he flees to one of these cities,
translation:
  language: ml
  text: എന്നാൽ, തന്റെ അയൽക്കാരനെ വെറുക്കുന്ന ഒരുവൻ അവനുവേണ്ടി പതിയിരുന്ന്, അവന്റെ നേരെ എഴുന്നേറ്റ്, അവനെ മാരകമായി അടിക്കുകയും[a], അവൻ മരിക്കുകയും, ഈ നഗരങ്ങളിലൊന്നിലേക്ക് ഓടിപ്പോകുകയും ചെയ്താൽ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അവൻ മരിക്കത്തക്കവിധം അവനെ അടിക്കുകയും” എന്നും വിവർത്തനം ചെയ്യാം. എബ്രായ പ്രയോഗത്തിന്റെ അക്ഷരാർഥം “അവനെ ജീവൻ/പ്രാണൻ [സംബന്ധിച്ച്] അടിക്കുക” എന്നാണ്; മരണകരമായ പ്രഹരം ഏൽപ്പിക്കുക എന്ന അർഥമുള്ള ഒരു പ്രയോഗമാണിത്.
    reason: וְהִכָּהוּ נֶפֶשׁ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അക്ഷരാർഥം മലയാളത്തിൽ അസ്വാഭാവികമായതിനാൽ, അതിന്റെ പ്രയോഗാർഥവും ഒരു വിവർത്തനസാധ്യതയും വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: וְכִי
  choice: എന്നാൽ, … ചെയ്താൽ
  rationale: മുൻവാക്യത്തിലെ അബദ്ധവധത്തിന്റെ സാഹചര്യത്തിന് വിപരീതമായ ഒരു സോപാധിക കേസ് അവതരിപ്പിക്കുന്നതിനാൽ, വൈരുധ്യവും നിബന്ധനയും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: יִהְיֶה אִישׁ
  choice: ഒരുവൻ
  rationale: പ്രതിനിധിയായ നിയമകേസിൽ വരുന്ന വ്യാകരണപരമായി പുല്ലിംഗമായ אִישׁ എന്ന പദത്തെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: שֹׂנֵא לְרֵעֵהוּ
  choice: തന്റെ അയൽക്കാരനെ വെറുത്ത്
  rationale: שֹׂנֵא എന്നതിന്റെ നേരായ അർഥമായ ‘വെറുക്കുക’ നിലനിർത്തുന്നു; നിയമസന്ദർഭത്തിലെ רֵעַ എന്നതിന് ‘അയൽക്കാരൻ’ യോജിക്കുന്നു.
- source_word: וְאָרַב לוֹ
  choice: അവനുവേണ്ടി പതിയിരുന്ന്
  rationale: മുൻകൂട്ടിയുള്ള ആക്രമണോദ്ദേശത്തോടെ പതിയിരിക്കുന്ന പ്രവൃത്തിയെ വ്യക്തമാക്കുന്നു.
- source_word: וְקָם עָלָיו
  choice: അവന്റെ നേരെ എഴുന്നേറ്റ്
  rationale: ശത്രുതാപരമായി ഒരാളുടെ നേരെ എഴുന്നേൽക്കുക എന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപവും അർഥവും നിലനിർത്തുന്നു.
- source_word: וְהִכָּהוּ נֶפֶשׁ
  choice: അവന്റെ ജീവൻ പോകത്തക്കവിധം അവനെ അടിക്കുകയും[a]
  rationale: נֶפֶשׁ ഉൾപ്പെട്ട അപൂർവമായ പ്രയോഗത്തെ മലയാളത്തിൽ മനസ്സിലാകുന്ന വിധം മരണകരമായ പ്രഹരമായി അവതരിപ്പിക്കുന്നു; അടിക്കുറിപ്പിൽ അക്ഷരാർഥവും മറ്റു സാധ്യതകളും രേഖപ്പെടുത്തുന്നു.
- source_word: וָמֵת
  choice: അവൻ മരിക്കുകയും
  rationale: പ്രഹരത്തിനു പിന്നാലെയുള്ള മരണത്തെ എബ്രായ വാക്യക്രമപ്രകാരം പ്രത്യേക ഘടകമായി നിലനിർത്തുന്നു.
- source_word: וְנָס
  choice: അയാൾ … ഓടിപ്പോകുകയും
  rationale: ഇവിടെ ഓടിപ്പോകുന്നത് അക്രമിയാണെന്ന് സർവനാമം വ്യക്തമാക്കി, נוּס എന്ന ക്രിയയുടെ ‘ഓടിപ്പോകുക/പലായനം ചെയ്യുക’ എന്ന അർഥം നൽകുന്നു.
- source_word: אֶל אַחַת הֶעָרִים הָאֵל
  choice: ഈ പട്ടണങ്ങളിലൊന്നിലേക്ക്
  rationale: തൊട്ടുമുമ്പ് നിർദേശിച്ച അഭയനഗരങ്ങളിലൊന്നിനെ സൂചിപ്പിക്കുന്ന സമീപസൂചകവും ബഹുവചനവും കൃത്യമായി പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: മനഃപൂർവമായ കൊലപാതകവും അബദ്ധവധവും തമ്മിലുള്ള നിയമപരമായ വ്യത്യാസം
  choice: ‘വെറുത്ത് … പതിയിരുന്ന് … നേരെ എഴുന്നേറ്റ് … ജീവൻ പോകത്തക്കവിധം അടിക്കുകയും’ എന്ന പ്രവർത്തനക്രമം നിലനിർത്തി.
  alternative: ‘അവനെ കൊലപ്പെടുത്തിയാൽ’ എന്ന സംക്ഷിപ്ത വിവർത്തനം.
  rationale: സന്ദർഭം മനഃപൂർവമായ കൊലപാതകമാണെന്ന് വ്യക്തമാണെങ്കിലും, മൂലപാഠം അതിനെ ഒറ്റ വ്യാഖ്യാനപദത്തിൽ ചുരുക്കാതെ ഉദ്ദേശ്യവും പ്രവർത്തനങ്ങളും ക്രമമായി വിവരിക്കുന്നു. ആ നിയമപരവും ദൈവശാസ്ത്രപരവുമായ സൂക്ഷ്മത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ നിയമവിവരണ ശൈലി. മൂലപാഠത്തിലെ നീണ്ട സോപാധിക വാക്യഘടനയും അടുത്ത വാക്യത്തിലേക്കുള്ള തുടർച്ച സൂചിപ്പിക്കുന്ന അവസാന കോമയും നിലനിർത്തിയിരിക്കുന്നു.
