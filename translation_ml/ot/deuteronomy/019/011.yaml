revisions:
- from: എന്നാൽ, ഒരുവൻ തന്റെ അയൽക്കാരനെ വെറുത്ത്, അവനുവേണ്ടി പതിയിരുന്ന്, അവന്റെ നേരെ എഴുന്നേറ്റ്, അവന്റെ ജീവൻ പോകത്തക്കവിധം അവനെ അടിക്കുകയും[a], അവൻ മരിക്കുകയും, അയാൾ ഈ പട്ടണങ്ങളിലൊന്നിലേക്ക് ഓടിപ്പോകുകയും ചെയ്താൽ,
  to: എന്നാൽ, തന്റെ അയൽക്കാരനെ വെറുക്കുന്ന ഒരുവൻ അവനുവേണ്ടി പതിയിരുന്ന്, അവന്റെ നേരെ എഴുന്നേറ്റ്, അവനെ മാരകമായി അടിക്കുകയും[a], അവൻ മരിക്കുകയും, ഈ നഗരങ്ങളിലൊന്നിലേക്ക് ഓടിപ്പോകുകയും ചെയ്താൽ,
  rationale: The revision renders the Hebrew lethal-blow idiom naturally as ‘മാരകമായി അടിക്കുക’ and retains the following clause ‘അവൻ മരിക്കുകയും’ as the stated outcome. It also standardizes the reference to the refuge locations as ‘നഗരങ്ങൾ.’ No doctrinal interpretation has been added.
