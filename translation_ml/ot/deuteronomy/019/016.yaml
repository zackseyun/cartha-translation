source:
  edition: WLC
  text: כִּֽי יָק֥וּם עֵד חָמָ֖ס בְּ/אִ֑ישׁ לַ/עֲנ֥וֹת בּ֖/וֹ סָרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/016.yaml
  text: If a malicious witness rises up against a man to testify against him of rebellion[b][a],
translation:
  language: ml
  text: ഒരു മനുഷ്യനെതിരെ ദുഷ്ടോദ്ദേശ്യമുള്ള ഒരു സാക്ഷി എഴുന്നേറ്റ്, അവനെതിരെ ധിക്കാരപരമായ ഒരു കുറ്റം ആരോപിച്ച് സാക്ഷ്യം പറയാൻ വന്നാൽ,[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരു കള്ളസാക്ഷി.’ എബ്രായപ്രയോഗത്തിന്റെ അക്ഷരാർഥം ‘അക്രമത്തിന്റെ/അന്യായത്തിന്റെ സാക്ഷി’ എന്നാണ്; കോടതിയിൽ ദുഷ്ടോദ്ദേശ്യത്തോടെ അല്ലെങ്കിൽ കള്ളമായി കുറ്റം ചുമത്തുന്ന ഒരാളെ അത് സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘ധിക്കാരപരമായ ഒരു കുറ്റം’ എന്നതിന് ‘കലാപം,’ ‘വ്യതിചലനം,’ അല്ലെങ്കിൽ ചില സന്ദർഭങ്ങളിൽ ‘മതത്യാഗം’ എന്നും വിവർത്തനം ചെയ്യാം. ഇവിടെ ആരോപിക്കപ്പെടുന്ന കുറ്റത്തിന്റെ കൃത്യസ്വഭാവം വ്യക്തമല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: എങ്കിൽ / പറഞ്ഞാൽ
  rationale: നിയമപരമായ സോപാധിക സാഹചര്യം അവതരിപ്പിക്കുന്നതിനാൽ, മലയാളത്തിൽ സ്വാഭാവികമായ ‘...പറഞ്ഞാൽ’ എന്ന വ്യവസ്ഥാരൂപം ഉപയോഗിച്ചു.
- source_word: יָקוּם
  choice: എഴുന്നേറ്റ്
  rationale: സാക്ഷിയായി മുന്നോട്ടുവരുക അഥവാ നിലകൊള്ളുക എന്ന നിയമസന്ദർഭത്തിലെ അർഥവും മൂലപദത്തിന്റെ ദൃശ്യഭാവവും നിലനിർത്തുന്നു.
- source_word: עֵד חָמָס
  choice: ദ്രോഹബുദ്ധിയുള്ള ഒരു സാക്ഷി
  rationale: അക്ഷരാർഥത്തിൽ ‘അക്രമത്തിന്റെ/അന്യായത്തിന്റെ സാക്ഷി’; കോടതിസന്ദർഭത്തിൽ ദോഷകരമായ ഉദ്ദേശ്യത്തോടെ ആരോപണം ഉന്നയിക്കുന്ന സാക്ഷിയെ സൂചിപ്പിക്കുന്നു.
- source_word: בְּאִישׁ
  choice: ഒരു മനുഷ്യനെതിരെ
  rationale: בְּ ഇവിടെ സാക്ഷിമൊഴിയുടെ ലക്ഷ്യത്തെ സൂചിപ്പിക്കുന്നു; אִישׁ എന്ന ഏകവചന പുല്ലിംഗരൂപം പ്രതിനിധാനപരമായ നിയമഭാഷയായി നിലനിർത്തി.
- source_word: לַעֲנוֹת
  choice: സാക്ഷ്യം പറഞ്ഞാൽ
  rationale: ענה എന്ന ക്രിയയ്ക്ക് ‘ഉത്തരം പറയുക’ എന്ന അടിസ്ഥാനാർഥമുണ്ടെങ്കിലും, ഈ നിയമസന്ദർഭത്തിൽ സാക്ഷിമൊഴി നൽകുക എന്നാണ്.
- source_word: בּוֹ
  choice: അവൻ ... എന്ന്
  rationale: ആ വ്യക്തിയെക്കുറിച്ചുള്ള പ്രതികൂല സാക്ഷിമൊഴിയെന്ന ബന്ധം മലയാളത്തിലെ പരോക്ഷവാക്യഘടനയിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: סָרָה
  choice: വഴിതെറ്റിയെന്ന്
  rationale: ‘തിരിഞ്ഞുമാറൽ, വ്യതിചലനം, ധിക്കാരപരമായ തെറ്റ്’ എന്നീ അർഥസാധ്യതകൾ സംരക്ഷിക്കുന്നു; ‘മതത്യാഗം’ എന്ന പ്രത്യേക മതപരമായ അർഥം അനാവശ്യമായി ചുമത്തുന്നില്ല.
theological_decisions:
- issue: നിയമവാക്യത്തിലെ പ്രതിനിധാനപരമായ പുല്ലിംഗഭാഷ
  choice: ഒരു മനുഷ്യനെതിരെ
  alternative: ഒരാൾക്കെതിരെ
  rationale: മൂലപാഠത്തിലെ אִישׁ ഏകവചന പുല്ലിംഗമാണ്. അതിനെ ലിംഗനിഷ്പക്ഷമാക്കാതെ, നിയമസൂത്രവാക്യത്തിലെ പ്രതിനിധാനപരമായ പ്രയോഗമായി നിലനിർത്തി.
- issue: סָרָה എന്ന പദത്തിന്റെ അർഥപരിധി
  choice: വഴിതെറ്റിയെന്ന്
  alternative: കലാപം നടത്തിയെന്ന് / മതത്യാഗം ചെയ്തെന്ന് / തെറ്റ് ചെയ്തെന്ന്
  rationale: പദത്തിന് ഗുരുതരമായ വ്യതിചലനം, ധിക്കാരം, ചില സന്ദർഭങ്ങളിൽ മതത്യാഗം എന്നിവ സൂചിപ്പിക്കാം. ഈ ന്യായവ്യവഹാരസന്ദർഭത്തിൽ ആരോപണത്തിന്റെ കൃത്യസ്വഭാവം വ്യക്തമല്ലാത്തതിനാൽ വിശാലതയും അർഥഗൗരവവും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ നിയമശൈലി. ‘ദ്രോഹബുദ്ധിയുള്ള’ എന്നത് עֵד חָמָס എന്ന പ്രയോഗത്തിലെ അന്യായവും വൈരപരവുമായ ഉദ്ദേശ്യം പ്രകടമാക്കുന്നു; അടിക്കുറിപ്പുകൾ മൂലപാഠത്തിന്റെ യഥാർഥ അർഥവൈവിധ്യം സംരക്ഷിക്കുന്നു.
