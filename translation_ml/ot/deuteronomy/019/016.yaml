- from: ഒരു മനുഷ്യനെതിരെ ദ്രോഹബുദ്ധിയുള്ള ഒരു സാക്ഷി എഴുന്നേറ്റ് അവൻ വഴിതെറ്റിയെന്ന് സാക്ഷ്യം പറഞ്ഞാൽ,[a][b]
