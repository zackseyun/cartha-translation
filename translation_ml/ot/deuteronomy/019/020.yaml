  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הַ/נִּשְׁאָרִ֖ים יִשְׁמְע֣וּ וְ/יִרָ֑אוּ וְ/לֹֽא יֹסִ֨פוּ לַ/עֲשׂ֜וֹת ע֗וֹד כַּ/דָּבָ֥ר הָ/רָ֛ע הַ/זֶּ֖ה בְּ/קִרְבֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/020.yaml
  text: And those who remain shall hear and fear[c][b][a], and shall never again do such an evil thing in your midst.
translation:
  language: ml
  text: ശേഷിക്കുന്നവർ കേട്ട് ഭയപ്പെടും; നിന്റെ മധ്യത്തിൽ ഇത്തരത്തിലുള്ള ദുഷ്‌കാര്യം അവർ ഇനിയൊരിക്കലും ചെയ്യുകയില്ല.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിന്റെ’ എന്നത് എബ്രായത്തിൽ ഏകവചനമാണ്; ഇസ്രായേൽജനത്തെ ഒരു സമൂഹമെന്ന നിലയിൽ അഭിസംബോധന ചെയ്യുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘ഈ ദുഷ്‌കാര്യംപോലെ’; അതായത്, ഇത്തരത്തിലുള്ള ഒരു ദുഷ്‌കാര്യം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּשְׁאָרִים
  choice: ശേഷിക്കുന്നവർ
  rationale: നിഫാൽ കൃദന്തരൂപം ന്യായവിധിക്കുശേഷം ശേഷിക്കുന്ന ജനങ്ങളെ സൂചിപ്പിക്കുന്നു; ‘ശേഷിക്കുന്നവർ’ സ്വാഭാവികവും മൂലപദത്തോട് അടുത്തതുമാണ്.
- source_word: יִשְׁמְעוּ
  choice: അതു കേട്ട്
  rationale: שמע എന്നതിന്റെ അടിസ്ഥാന അർഥം ‘കേൾക്കുക’ എന്നാണ്. സന്ദർഭം ശിക്ഷാവിവരം കേൾക്കുന്നതിനെ സൂചിപ്പിക്കുന്നതിനാൽ, മലയാളത്തിലെ സ്വാഭാവിക ബന്ധത്തിനായി ‘അതു’ ചേർത്തിരിക്കുന്നു.
- source_word: וְיִרָאוּ
  choice: ഭയപ്പെടും
  rationale: ശിക്ഷ മറ്റുള്ളവരെ പിന്തിരിപ്പിക്കുന്ന ഭയം ഉളവാക്കുമെന്ന നിയമപരമായ ആശയം ലളിതമായി നിലനിർത്തുന്നു.
- source_word: וְלֹא יֹסִפוּ לַעֲשׂוֹת עוֹד
  choice: ഇനിയൊരിക്കലും ചെയ്യുകയുമില്ല
  rationale: יסף + ക്രിയാനാമം, കൂടാതെ עוֹד, വീണ്ടും അങ്ങനെ ചെയ്യാതിരിക്കുകയെന്ന അർഥം നൽകുന്നു; മലയാളത്തിൽ ആവർത്തനനിഷേധം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: כַּדָּבָר הָרָע הַזֶּה
  choice: ഇത്തരത്തിലുള്ള ദുഷ്‌പ്രവൃത്തി
  rationale: כְּ എന്ന താരതമ്യഘടകം ‘ഇത്തരത്തിലുള്ള’ എന്നു പ്രതിഫലിപ്പിക്കുന്നു; ഇവിടെ דָּבָר മുൻസന്ദർഭത്തിലെ ദുഷ്‌കൃത്യത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ദുഷ്‌പ്രവൃത്തി’ സ്വാഭാവികമാണ്.
- source_word: בְּקִרְבֶּךָ
  choice: നിന്റെ മധ്യത്തിൽ
  rationale: രണ്ടാം പുരുഷ ഏകവചന പ്രത്യയം ഇസ്രായേലിനെ ഒരു സമൂഹമെന്ന നിലയിൽ അഭിസംബോധന ചെയ്യുന്നു; ആ രൂപവും നിയമപരമായ ഗൗരവവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: בְּקִרְבֶּךָ എന്നതിലെ ഏകവചന അഭിസംബോധന
  choice: ‘നിന്റെ മധ്യത്തിൽ’ എന്ന ഏകവചനം നിലനിർത്തി
  alternative: ‘നിങ്ങളുടെ ഇടയിൽ’ എന്ന് ബഹുവചനമായി സ്വാഭാവികവൽക്കരിക്കുക
  rationale: എബ്രായപാഠം ഇസ്രായേലിനെ ഒരു ഏകീകൃത സമൂഹമായി രണ്ടാം പുരുഷ ഏകവചനത്തിൽ അഭിസംബോധന ചെയ്യുന്നു. വ്യാഖ്യാനപരമായ വികസനം കൂടാതെ ആ കൂട്ടായ അഭിസംബോധന സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമഭാഷ ഉപയോഗിച്ചു. മൂലത്തിലെ കേൾക്കുക–ഭയപ്പെടുക–വീണ്ടും ചെയ്യാതിരിക്കുക എന്ന പ്രതിരോധക്രമം നിലനിർത്തി.
