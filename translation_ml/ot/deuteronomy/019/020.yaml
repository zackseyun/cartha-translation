  to: ശേഷിക്കുന്നവർ കേട്ട് ഭയപ്പെടും; നിന്റെ മധ്യത്തിൽ ഇത്തരത്തിലുള്ള ദുഷ്‌കാര്യം അവർ ഇനിയൊരിക്കലും ചെയ്യുകയില്ല.[a][b]
