  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֶֽת הַ/בְּרָכָ֑ה אֲשֶׁ֣ר תִּשְׁמְע֗וּ אֶל מִצְוֺת֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם אֲשֶׁ֧ר אָנֹכִ֛י מְצַוֶּ֥ה אֶתְ/כֶ֖ם הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/027.yaml
  text: the blessing[a], if you listen to the commandments of Yahweh your God[b], which I am commanding you today.
translation:
  language: ml
  text: ഇന്ന് ഞാൻ നിങ്ങളോടു കല്പിക്കുന്ന നിങ്ങളുടെ ദൈവമായ യഹോവയുടെ കല്പനകൾ നിങ്ങൾ ശ്രദ്ധയോടെ കേൾക്കുന്നെങ്കിൽ[b], അനുഗ്രഹം[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘നിങ്ങളുടെ ദൈവമായ യഹോവയുടെ കല്പനകൾ അനുസരിക്കുമ്പോൾ ലഭിക്കുന്ന അനുഗ്രഹം.’ എബ്രായത്തിലെ ബന്ധസൂചകപദം ഇവിടെ വ്യവസ്ഥാസൂചകമായ അർഥത്തിലാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.'
    reason: lexical_alternative
  - marker: b
    text: ‘ശ്രദ്ധയോടെ കേൾക്കുക’ എന്നത് ‘അനുസരിക്കുക’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായത്തിൽ ഈ ക്രിയ പലപ്പോഴും കേൾക്കുകയും അതനുസരിച്ച് പ്രവർത്തിക്കുകയും ചെയ്യുക എന്ന അർഥം വഹിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת הַבְּרָכָה
  choice: അനുഗ്രഹം
  rationale: മുൻവാക്യത്തിൽ ആരംഭിച്ച ‘അനുഗ്രഹവും ശാപവും നിങ്ങളുടെ മുമ്പിൽ വെക്കുന്നു’ എന്ന അപൂർണ വാക്യഘടനയുടെ കർമപദമായി ഇതിനെ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר
  choice: എങ്കിൽ
  rationale: രൂപത്തിൽ ബന്ധസൂചകമാണെങ്കിലും ഇവിടെ അനുഗ്രഹം ലഭിക്കുന്നതിനുള്ള വ്യവസ്ഥയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: תִּשְׁמְעוּ אֶל
  choice: ശ്രദ്ധിച്ചു കേൾക്കുന്നെങ്കിൽ
  rationale: ശ്രവിക്കുന്നതോടൊപ്പം അനുസരണപരമായ പ്രതികരണവും സൂചിപ്പിക്കുന്ന שׁמע എന്ന ക്രിയയുടെ അടിസ്ഥാന ദൃശ്യത്തെ നിലനിർത്തുന്നു; ‘അനുസരിക്കുക’ എന്ന അർഥവും അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: מִצְוֺת
  choice: കല്പനകൾ
  rationale: ഉടമ്പടി-നിയമ പശ്ചാത്തലത്തിലെ ദൈവിക ആജ്ഞകളെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയാൽ പകരാതെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവമായ
  rationale: രണ്ടാം പുരുഷ ബഹുവചന ഉടമസ്ഥപ്രത്യയത്തെ വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם
  choice: ഇന്ന് ഞാൻ നിങ്ങളോടു കല്പിക്കുന്ന
  rationale: מְצַוֶּה എന്ന കൃദന്തരൂപത്തിന്റെ ഇപ്പോഴത്തെ പ്രസംഗക്രിയാഭാവവും הַיּוֹם എന്നതിന്റെ ഉടമ്പടി-കാലിക അടിയന്തരതയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വേ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം പദവിയായി മാറ്റാതെ നൽകുന്നു. മലയാളത്തിലെ സാധാരണ വായനക്കാർക്ക് പരിചിതവും ഗൗരവമുള്ളതുമായ ‘യഹോവ’ തിരഞ്ഞെടുത്തു; ഉച്ചാരണത്തിന്റെ കൃത്യമായ പുനർനിർമ്മാണത്തെക്കുറിച്ചുള്ള അനിശ്ചിതത്വം വാക്യം തന്നെ പരിഹരിക്കുന്നില്ല.
- issue: שׁמע എന്നതിലെ കേൾവിയും അനുസരണവും
  choice: ശ്രദ്ധിച്ചു കേൾക്കുക
  alternative: അനുസരിക്കുക
  rationale: മൂലക്രിയയുടെ ശ്രവണാർഥം നിലനിർത്തിക്കൊണ്ട് ഉടമ്പടി സാഹചര്യത്തിൽ സൂചിതമായ അനുസരണം അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുന്നു; രണ്ടിൽ ഒന്നിനെ മാത്രം നിർബന്ധിച്ച് അർഥവ്യാപ്തി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. വാക്യം 26-ാം വാക്യത്തിലെ ഘടന തുടരുന്നതിനാൽ ‘അനുഗ്രഹം’ അവസാനം വെച്ച് മലയാളത്തിൽ വ്യവസ്ഥയും ഫലവും വ്യക്തമായി അവതരിപ്പിച്ചു. രണ്ട് അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
