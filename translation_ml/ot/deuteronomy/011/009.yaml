source:
  edition: WLC
  text: וּ/לְמַ֨עַן תַּאֲרִ֤יכוּ יָמִים֙ עַל הָ֣/אֲדָמָ֔ה אֲשֶׁר֩ נִשְׁבַּ֨ע יְהוָ֧ה לַ/אֲבֹתֵי/כֶ֛ם לָ/תֵ֥ת לָ/הֶ֖ם וּ/לְ/זַרְעָ֑/ם אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/009.yaml
  text: so that you may live long on the land that Yahweh swore to your fathers to give to them and to their offspring[b][a], a land flowing with milk and honey.
translation:
  language: ml
  text: നിങ്ങളുടെ പിതാക്കന്മാരോടു[a], അവർക്കും അവരുടെ സന്തതിക്കും[b] നൽകുമെന്ന് യഹോവ ശപഥം ചെയ്ത, പാലും തേനും ഒഴുകുന്ന ആ ദേശത്ത് നിങ്ങൾ ദീർഘകാലം ജീവിക്കേണ്ടതിനും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘നിങ്ങളുടെ പൂർവികരോടു.’ എബ്രായത്തിൽ അക്ഷരാർഥം ‘നിങ്ങളുടെ പിതാക്കന്മാരോടു’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘അവരുടെ വിത്തിനും’ അല്ലെങ്കിൽ ‘അവരുടെ പിൻതലമുറക്കാർക്കും.’ എബ്രായപദത്തിന് സന്തതിയെ കൂട്ടമായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְמַעַן
  choice: ജീവിക്കേണ്ടതിനും
  rationale: ഉദ്ദേശ്യത്തെ സൂചിപ്പിക്കുന്ന לְמַעַן എന്നതും മുൻവാക്യത്തോടു ബന്ധിപ്പിക്കുന്ന וּ എന്നതും മലയാളത്തിലെ ‘-േണ്ടതിനും’ എന്ന ഘടനയിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: תַּאֲרִיכוּ יָמִים
  choice: നിങ്ങൾ ദീർഘകാലം ജീവിക്കുക
  rationale: അക്ഷരാർഥത്തിൽ ‘ദിവസങ്ങൾ ദീർഘമാക്കുക’ എന്ന എബ്രായ പ്രയോഗം ദീർഘായുസ്സിനെ സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഇങ്ങനെ നൽകി.
- source_word: עַל הָאֲדָמָה
  choice: ആ ദേശത്ത്
  rationale: ആവർത്തനപുസ്തകത്തിലെ സന്ദർഭത്തിൽ אֲדָמָה വെറും മണ്ണിനെയല്ല, വാഗ്ദത്തപ്രദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്; עַל മലയാളത്തിൽ ഇവിടെ ‘ദേശത്ത്’ എന്നു സ്വാഭാവികമായി വരുന്നു.
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה
  choice: യഹോവ സത്യം ചെയ്ത
  rationale: ഉടമ്പടിസംബന്ധമായ ശപഥത്തിന്റെ ഗൗരവം വ്യാഖ്യാനിച്ച് ലഘൂകരിക്കാതെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: എബ്രായത്തിലെ ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നേരിട്ട് പ്രതിനിധീകരിക്കുന്നു.
- source_word: לַאֲבֹתֵיכֶם
  choice: നിങ്ങളുടെ പിതാക്കന്മാരോട്
  rationale: אָבוֹת എന്നതിന്റെ പുരുഷലിംഗസൂചന നിലനിർത്തുന്നു; ‘പൂർവികർ’ എന്ന വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: לָתֵת לָהֶם וּלְזַרְעָם
  choice: അവർക്കും അവരുടെ സന്തതിക്കും കൊടുക്കുമെന്ന്
  rationale: לָהֶם എന്ന സർവനാമവും זֶרַע എന്ന ഏകവചന കൂട്ടനാമത്തിന്റെ വംശപരമ്പരാസൂചനയും നിലനിർത്തുന്നു.
- source_word: זָבַת חָלָב וּדְבָשׁ
  choice: പാലും തേനും ഒഴുകുന്ന
  rationale: സമൃദ്ധിയും ഫലഭൂയിഷ്ഠതയും സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം മലയാളത്തിൽ വ്യക്തവും പരമ്പരാഗതവുമായ രീതിയിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം പൊതുവായ സ്ഥാനപ്പേരല്ല, ഉടമ്പടിനാമം തന്നെയാണ് ഉപയോഗിക്കുന്നത്; അതിനാൽ ദൈവനാമം മറയ്ക്കാതെ ലിപ്യന്തരണം ചെയ്തു.
- issue: זֶרַע എന്ന കൂട്ടനാമത്തിന്റെ വ്യാപ്തി
  choice: സന്തതി
  alternative: വിത്ത്; പിൻതലമുറക്കാർ
  rationale: ‘സന്തതി’ ഏകവചന കൂട്ടനാമത്തിന്റെ രൂപവും ഒരാളെയോ കൂട്ടമായ പിൻതലമുറയെയോ സൂചിപ്പിക്കാവുന്ന അർഥവ്യാപ്തിയും അനാവശ്യമായി ചുരുക്കാതെ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായ വായനയ്ക്ക് അനുയോജ്യവുമായ ശൈലി. വാക്യം മുൻസന്ദർഭത്തോടു ബന്ധപ്പെടുന്ന ഉദ്ദേശ്യഘടകമായതിനാൽ അവസാനത്തിൽ ‘-തിനും’ നിലനിർത്തി; എബ്രായത്തിലെ ശപഥഭാഷയും ‘പാലും തേനും ഒഴുകുന്ന’ എന്ന രൂപകവും സംരക്ഷിച്ചു.
