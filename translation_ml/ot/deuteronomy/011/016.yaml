source:
  edition: WLC
  text: הִשָּֽׁמְר֣וּ לָ/כֶ֔ם פֶּ֥ן יִפְתֶּ֖ה לְבַבְ/כֶ֑ם וְ/סַרְתֶּ֗ם וַ/עֲבַדְתֶּם֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וְ/הִשְׁתַּחֲוִיתֶ֖ם לָ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/016.yaml
  text: Be careful lest your heart be deceived and you turn aside and serve other gods and bow down to them[a].
translation:
  language: ml
  text: നിങ്ങളുടെ ഹൃദയം വഞ്ചിക്കപ്പെടുകയും[a] നിങ്ങൾ വഴിതെറ്റി മറ്റു ദേവന്മാരെ സേവിക്കുകയും അവർക്കു നമസ്കരിക്കുകയും ചെയ്യാതിരിക്കാൻ സൂക്ഷിച്ചുകൊള്ളുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘നിങ്ങളുടെ ഹൃദയം വശീകരിക്കപ്പെടുകയും.’ എബ്രായക്രിയയ്ക്ക് പ്രേരിപ്പിക്കപ്പെടുക, വശീകരിക്കപ്പെടുക, വഞ്ചിക്കപ്പെടുക എന്നീ അർത്ഥങ്ങൾ വരാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמְרוּ לָכֶם
  choice: സൂക്ഷിച്ചുകൊള്ളുക
  rationale: നിഫാൽ ആജ്ഞാരൂപവും לָכֶם എന്ന ആത്മസംബന്ധ സൂചനയും ചേർന്ന മുന്നറിയിപ്പ് മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: פֶּן
  choice: ചെയ്യാതിരിക്കാൻ
  rationale: അപകടസാധ്യതയെക്കുറിച്ചുള്ള നിഷേധാത്മക മുന്നറിയിപ്പ് മലയാളത്തിലെ സ്വാഭാവിക ഉദ്ദേശ്യ-മുന്നറിയിപ്പ് ഘടനയിൽ പ്രകടമാക്കുന്നു.
- source_word: יִפְתֶּה
  choice: വഞ്ചിക്കപ്പെടുകയും
  rationale: ഈ ക്രിയയ്ക്ക് വശീകരിക്കുക, പ്രേരിപ്പിക്കുക, വഞ്ചിക്കുക എന്നീ അർത്ഥസാധ്യതകളുണ്ട്; ഹൃദയം വ്യാമോഹിപ്പിക്കപ്പെടുന്ന അപകടം വ്യക്തമാക്കാൻ ഈ രൂപം അനുയോജ്യം. മറ്റൊരു സാധുവായ സൂക്ഷ്മാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: לְבַבְכֶם
  choice: നിങ്ങളുടെ ഹൃദയം
  rationale: ഇച്ഛ, ചിന്ത, ആന്തരിക വ്യക്തിത്വം എന്നിവ ഉൾക്കൊള്ളുന്ന എബ്രായ പ്രയോഗത്തിന്റെ പരമ്പരാഗതവും സന്ദർഭോചിതവുമായ തുല്യപദം.
- source_word: וְסַרְתֶּם
  choice: നിങ്ങൾ വഴിതെറ്റി
  rationale: ശരിയായ വഴിയിൽനിന്നോ ഉടമ്പടിവിശ്വസ്തതയിൽനിന്നോ മാറിപ്പോകുന്നതിനെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: וַעֲבַדְתֶּם
  choice: സേവിക്കുകയും
  rationale: ദേവന്മാരോടുള്ള മതപരമായ വിധേയത്വം സൂചിപ്പിക്കുന്ന עבד എന്ന ക്രിയയെ നേരിട്ട് നിലനിർത്തുന്നു; തുടർന്നുള്ള ക്രിയ ആരാധനയുടെ ദൃശ്യപ്രവൃത്തി പ്രത്യേകം പറയുന്നു.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: അന്യദേവന്മാരെ
  rationale: ‘മറ്റു ദേവന്മാർ’ എന്ന അർത്ഥം സംക്ഷിപ്തവും സാധാരണ ബൈബിൾ മലയാളത്തിൽ വ്യക്തവുമായ രീതിയിൽ നൽകുന്നു; ‘വിദേശദേവന്മാർ’ എന്ന അധിക വ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
- source_word: וְהִשְׁתַּחֲוִיתֶם לָהֶם
  choice: അവരെ നമസ്കരിക്കുകയും
  rationale: വണങ്ങുക അഥവാ സാഷ്ടാംഗം ചെയ്യുക എന്ന ദൃശ്യപ്രവൃത്തിയും അതിന്റെ ആരാധനാസന്ദർഭവും സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: വിശ്വാസത്യാഗത്തിനെതിരായ മുന്നറിയിപ്പിന്റെ സ്വഭാവം
  choice: ഹൃദയത്തിന്റെ വഞ്ചനയിൽനിന്ന് വഴിതെറ്റലിലേക്കും അന്യദേവന്മാരെ സേവിച്ച് നമസ്കരിക്കുന്നതിലേക്കും നീങ്ങുന്ന ക്രമം നിലനിർത്തി.
  alternative: ‘വിഗ്രഹാരാധനയിലേക്കു വശീകരിക്കപ്പെടുക’ എന്ന് മുഴുവൻ ആശയവും ഒറ്റ വ്യാഖ്യാനവാക്യമായി ചുരുക്കാം.
  rationale: എബ്രായവാക്യം ആന്തരിക വഞ്ചന, വഴിമാറ്റം, സേവനം, നമസ്കാരം എന്നീ ഘട്ടങ്ങളെ വേർതിരിക്കുന്നു. പിന്നീടുള്ള സിദ്ധാന്തഭാഷ ചേർക്കാതെ ആ ഉദ്ദേശപൂർവമായ പുരോഗതി പരിഭാഷ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മുന്നറിയിപ്പ് ശൈലി. ഏകവചനമായ ‘ഹൃദയം’ എന്ന എബ്രായരൂപവും ബഹുവചന അഭിസംബോധനയും നിലനിർത്തിയിരിക്കുന്നു.
