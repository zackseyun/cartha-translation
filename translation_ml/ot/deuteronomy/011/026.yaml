source:
  edition: WLC
  text: רְאֵ֗ה אָנֹכִ֛י נֹתֵ֥ן לִ/פְנֵי/כֶ֖ם הַ/יּ֑וֹם בְּרָכָ֖ה וּ/קְלָלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/026.yaml
  text: See[a], today I am setting before you a blessing and a curse.
translation:
  language: ml
  text: നോക്കൂ, ഇന്ന് ഞാൻ നിങ്ങളുടെ മുമ്പിൽ അനുഗ്രഹവും ശാപവും വെക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഇന്ന് ഞാൻ നിങ്ങളുടെ മുമ്പിൽ അനുഗ്രഹവും ശാപവും നൽകുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ ക്രിയയ്ക്ക് ‘നൽകുക’ എന്നും ‘വെക്കുക’ എന്നും അർഥമാകാം; ഇവിടെ ‘നിങ്ങളുടെ മുമ്പിൽ വെക്കുന്നു’ എന്നത് മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: നോക്കൂ
  rationale: ഏകവചന ആജ്ഞാരൂപം ശ്രദ്ധ ക്ഷണിക്കുന്ന പ്രയോഗമാണ്. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായി അതിന്റെ ആഹ്വാനശക്തി നിലനിർത്തുന്നു.
- source_word: אָנֹכִי
  choice: ഞാൻ
  rationale: സ്വതന്ത്ര സർവനാമം കർത്താവിന് ഊന്നൽ നൽകുന്നു; മലയാളത്തിലെ വ്യക്തമായ ‘ഞാൻ’ അതിനെ അതിരുകടക്കാതെ സൂചിപ്പിക്കുന്നു.
- source_word: נֹתֵן
  choice: വെക്കുന്നു
  rationale: נתן എന്നതിന് ‘കൊടുക്കുക/വെക്കുക’ എന്നീ അർഥങ്ങളുണ്ട്. ‘നിങ്ങളുടെ മുമ്പിൽ’ എന്ന ഘടനയിൽ തിരഞ്ഞെടുപ്പുകൾ മുന്നിൽ അവതരിപ്പിക്കുന്ന ആശയം ‘വെക്കുന്നു’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לִפְנֵיכֶם
  choice: നിങ്ങളുടെ മുമ്പിൽ
  rationale: ബഹുവചന അഭിസംബോധന നിലനിർത്തിക്കൊണ്ട് ‘മുമ്പിൽ/സന്നിധിയിൽ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളസമാനമാണ്.
- source_word: הַיּוֹם
  choice: ഇന്ന്
  rationale: കാലസൂചകത്തിന്റെ ലളിതവും ആധുനികവുമായ നേരിട്ടുള്ള പരിഭാഷ.
- source_word: בְּרָכָה
  choice: അനുഗ്രഹം
  rationale: ശാപത്തോടു ചേർന്ന വിരുദ്ധജോടിയിലെ ആദ്യ നാമം; മലയാളത്തിൽ അനിശ്ചിത ഉപപദം ആവശ്യമില്ല.
- source_word: וּקְלָלָה
  choice: ശാപവും
  rationale: וּ എന്ന സംയോജകത്തെ ‘-വും’കൊണ്ട് പ്രകടിപ്പിച്ച് അനുഗ്രഹം–ശാപം എന്ന സമാന്തര വിരുദ്ധജോടി സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: അനുഗ്രഹവും ശാപവും എന്ന രൂപീകരണത്തിന്റെ സ്വഭാവം
  choice: നിയമബന്ധത്തിന്റെ പശ്ചാത്തലത്തിൽ മുന്നിൽ വെക്കുന്ന രണ്ട് ഫലങ്ങളായി വ്യാഖ്യാനവികാസമില്ലാതെ പരിഭാഷപ്പെടുത്തി.
  alternative: പ്രതിഫലവും ശിക്ഷയും സംബന്ധിച്ച പൊതുവായ ധാർമികതത്ത്വമായി തുറന്നു വ്യാഖ്യാനിക്കുക.
  rationale: വാക്യം നിയമബന്ധപരമായ അനുഗ്രഹവും ശാപവും അവതരിപ്പിക്കുന്നുവെങ്കിലും ഈ വാക്യത്തിൽ അതിന്റെ ദൈവശാസ്ത്രപരമായ വിശദീകരണം വികസിപ്പിക്കുന്നില്ല; അതിനാൽ മൂലത്തിലെ ഔപചാരികമായ വിരുദ്ധജോടി മാത്രം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നോക്കൂ’ ശ്രദ്ധ ക്ഷണിക്കുന്ന ആജ്ഞ നിലനിർത്തുന്നു; ‘നിങ്ങളുടെ’ എന്ന രൂപം എബ്രായത്തിലെ ബഹുവചന അഭിസംബോധന വ്യക്തമാക്കുന്നു. അടിക്കുറിപ്പ് സൂചിക പ്രധാനവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
