  text: לֹא יִתְיַצֵּ֥ב אִ֖ישׁ בִּ/פְנֵי/כֶ֑ם פַּחְדְּ/כֶ֨ם וּ/מֽוֹרַאֲ/כֶ֜ם יִתֵּ֣ן יְהוָ֣ה אֱלֹֽהֵי/כֶ֗ם עַל פְּנֵ֤י כָל הָ/אָ֨רֶץ֙ אֲשֶׁ֣ר תִּדְרְכוּ בָ֔/הּ כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר לָ/כֶֽם־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/025.yaml
  text: No man will stand before you[a]. Yahweh your God will put the fear and dread of you on the face of all the land on which you tread[b], just as he spoke to you.
translation:
  language: ml
  text: ഒരു മനുഷ്യനും നിങ്ങളുടെ മുമ്പിൽ നിലകൊള്ളുകയില്ല[a]. നിങ്ങൾ ചവിട്ടുന്ന സകല ദേശത്തിന്മേലും നിങ്ങളെക്കുറിച്ചുള്ള ഭയവും ഭീതിയും നിങ്ങളുടെ ദൈവമായ യാഹ്‌വെ വരുത്തും—അവൻ നിങ്ങളോടു പറഞ്ഞതുപോലെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങളെ എതിർത്തുനിൽക്കാൻ ആർക്കും കഴിയുകയില്ല.” ‘മുമ്പിൽ നിലകൊള്ളുക’ എന്ന എബ്രായ പ്രയോഗത്തിന് ചെറുത്തുനിൽക്കുക അഥവാ വിജയകരമായി എതിർക്കുക എന്നർഥമുണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְיַצֵּב אִישׁ בִּפְנֵיכֶם
  choice: ഒരു മനുഷ്യനും നിങ്ങളുടെ മുമ്പിൽ നിലകൊള്ളുകയില്ല
  rationale: ‘മുമ്പിൽ നിലകൊള്ളുക’ എന്ന എബ്രായ ദൃശ്യഭാഷ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അത് എതിർത്തുനിൽക്കുക അഥവാ ചെറുത്തുനിൽക്കുക എന്ന ആശയം വഹിക്കുന്നു.
- source_word: פַּחְדְּכֶם וּמוֹרַאֲכֶם
  choice: നിങ്ങളോടുള്ള പേടിയും ഭീതിയും
  rationale: പരസ്പരം അടുത്ത അർഥമുള്ള രണ്ടു നാമങ്ങളുടെ തീവ്രത നിലനിർത്താൻ വ്യത്യസ്തമായെങ്കിലും സ്വാഭാവികമായ രണ്ടു മലയാളപദങ്ങൾ ഉപയോഗിച്ചു; ഇവിടെ ഇസ്രായേലിനെക്കണ്ട് മറ്റുള്ളവർ അനുഭവിക്കുന്ന പേടിയാണ് ഉദ്ദേശ്യം.
- source_word: יִתֵּן
  choice: വരുത്തും
  rationale: נתן എന്നതിന് അടിസ്ഥാനമായി ‘കൊടുക്കുക/വെക്കുക’ എന്നർഥമുണ്ടെങ്കിലും, ഒരു ദേശമെങ്ങും പേടിയും ഭീതിയും ഉണ്ടാകുന്നതിനെ മലയാളത്തിൽ ‘വരുത്തും’ എന്നു പറയുന്നത് സ്വാഭാവികമാണ്.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവമായ യാഹ്‌വെ
  rationale: ദൈവനാമമായ יהוה പേരായിത്തന്നെ ‘യാഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു; אֱלֹהֵיכֶם എന്ന ബന്ധവും നേരിട്ട് നിലനിർത്തി.
- source_word: עַל־פְּנֵי כָל־הָאָרֶץ
  choice: ദേശമൊട്ടാകെ
  rationale: അക്ഷരാർഥം ‘ദേശത്തിന്റെ മുഖമെല്ലാം’ എന്നാണ്. തുടർന്നുള്ള ഉപവാക്യം ഇസ്രായേൽ ചവിട്ടുന്ന പ്രദേശത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഭൂമി മുഴുവൻ’ എന്നതിനെക്കാൾ ‘ദേശമൊട്ടാകെ’ സന്ദർഭോചിതവും സ്വാഭാവികവുമാണ്.
- source_word: אֲשֶׁר תִּדְרְכוּ בָהּ
  choice: നിങ്ങൾ ചവിട്ടുന്ന
  rationale: דרך എന്ന ക്രിയയുടെ ‘ചവിട്ടുക/കാലെടുത്തുവെക്കുക’ എന്ന മൂർത്തമായ ദൃശ്യഭാഷ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: כַּאֲשֶׁר דִּבֶּר לָכֶם
  choice: അവൻ നിങ്ങളോടു അരുളിച്ചെയ്തതുപോലെതന്നെ
  rationale: דבר എന്നത് ‘പറയുക/സംസാരിക്കുക’ എന്നാണ്; ‘വാഗ്ദാനം ചെയ്തു’ എന്നു കൂടുതൽ പ്രത്യേകമാക്കാതെ, ദൈവത്തിന്റെ വാക്കിനെ സൂചിപ്പിക്കുന്ന മാന്യവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗം തിരഞ്ഞെടുത്തു.
theological_decisions:
- issue: ദൈവനാമമായ יהוהയുടെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വന്നതിനാൽ അതിനെ പദവിയാക്കി മാറ്റാതെ, സാധാരണ അംഗീകരിക്കപ്പെടുന്ന ഉച്ചാരണത്തോട് അടുത്ത രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- issue: പ്രതിനിധാനപരമായ പുരുഷലിംഗ ഏകവചനം אִישׁ
  choice: ഒരു മനുഷ്യനും
  alternative: ആരും
  rationale: മൂലത്തിലെ ഏകവചനമായ אִישׁ ദൃശ്യമായി നിലനിർത്തുന്നു; നിഷേധവാക്യത്തിൽ ഇത് യാതൊരാളും എതിർത്തുനിൽക്കില്ല എന്ന പൊതുവായ അർഥം നൽകുന്നു.
- issue: ‘മുമ്പിൽ നിലകൊള്ളുക’ എന്ന പ്രയോഗത്തിന്റെ ആശയം
  choice: ദൃശ്യഭാഷ മുഖ്യപാഠത്തിൽ നിലനിർത്തി
  alternative: നിങ്ങളെ എതിർത്തുനിൽക്കാൻ ആർക്കും കഴിയുകയില്ല
  rationale: എബ്രായ പ്രയോഗം അക്ഷരാർഥത്തിൽ നിലകൊള്ളലിനെയും സന്ദർഭത്തിൽ വിജയകരമായി എതിർക്കലിനെയും സൂചിപ്പിക്കാം; മുഖ്യപാഠം ചിത്രം നിലനിർത്തുകയും അടിക്കുറിപ്പ് പ്രയോഗാർഥം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും ലാളിത്യവും ഒരുമിപ്പിച്ചു. ‘അരുളിച്ചെയ്തു’ ദൈവത്തിന്റെ വാക്കിനനുയോജ്യമായ മാന്യപ്രയോഗമായി ഉപയോഗിച്ചെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് എളുപ്പമാക്കി. ബഹുവചനമായ ‘നിങ്ങൾ’ മുഴുവൻ വാക്യത്തിലും നിലനിർത്തി.
