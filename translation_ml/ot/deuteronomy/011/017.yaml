  terminology: ‘യഹ്‌വേ’, ‘കോപം ... ജ്വലിക്കും’, ‘നിലം’, ‘വിളവ്’, and ‘ദേശം’ are suitable and preserve the important distinction between arable ground (אַדָמָה) and the covenant land (אֶרֶץ).
