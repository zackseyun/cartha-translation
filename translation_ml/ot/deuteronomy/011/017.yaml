reference: Deuteronomy 11:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/חָרָ֨ה אַף יְהוָ֜ה בָּ/כֶ֗ם וְ/עָצַ֤ר אֶת הַ/שָּׁמַ֨יִם֙ וְ/לֹֽא יִהְיֶ֣ה מָטָ֔ר וְ/הָ֣/אֲדָמָ֔ה לֹ֥א תִתֵּ֖ן אֶת יְבוּלָ֑/הּ וַ/אֲבַדְתֶּ֣ם מְהֵרָ֗ה מֵ/עַל֙ הָ/אָ֣רֶץ הַ/טֹּבָ֔ה אֲשֶׁ֥ר יְהוָ֖ה נֹתֵ֥ן לָ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/017.yaml
  text: Then Yahweh’s anger will burn against you[a], and he will shut up the heavens so that there will be no rain, and the ground will not yield its produce; and you will perish quickly from the good land that Yahweh is giving you.
translation:
  language: ml
  text: അപ്പോൾ യഹ്‌വേയുടെ കോപം നിങ്ങൾക്കെതിരെ ജ്വലിക്കും[a]; അവൻ ആകാശം അടച്ചുകളയും; മഴ പെയ്യുകയില്ല, നിലം അതിന്റെ വിളവ് നൽകുകയുമില്ല; യഹ്‌വേ നിങ്ങൾക്കു തരുന്ന ആ നല്ല ദേശത്തുനിന്ന് നിങ്ങൾ വേഗത്തിൽ നശിച്ചുപോകും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ, ‘യഹ്‌വേയുടെ മൂക്ക് (അതായത് കോപം) നിങ്ങൾക്കെതിരെ കത്തും’; അതിതീവ്രമായ കോപം സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലി.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָרָה אַף יְהוָה בָכֶם
  choice: അപ്പോൾ യഹ്‌വേയുടെ കോപം നിങ്ങൾക്കെതിരെ ജ്വലിക്കും
  rationale: חָרָה אַף എന്ന എബ്രായ ശൈലി കോപം കത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘കോപം ... ജ്വലിക്കും’ എന്നത് മൂലരൂപകം നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളം നൽകുന്നു; ആരംഭത്തിലെ waw മുൻവാക്യത്തിന്റെ അനന്തരഫലം സൂചിപ്പിക്കുന്നതിനാൽ ‘അപ്പോൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: וְעָצַר אֶת הַשָּׁמַיִם
  choice: അവിടന്ന് ആകാശം അടച്ചുകളയും
  rationale: മഴ തടയുന്നതിനായി ആകാശം അടയ്ക്കുന്ന മൂലദൃശ്യരൂപം സംരക്ഷിക്കുന്നു. ഏകവചന കർത്താവിനെ ആദരസൂചകമായി ‘അവിടന്ന്’ എന്നു വ്യക്തമാക്കി.
- source_word: וְלֹא יִהְיֶה מָטָר
  choice: മഴ പെയ്യുകയില്ല
  rationale: അക്ഷരാർഥത്തിലെ ‘മഴ ഉണ്ടാകുകയില്ല’ എന്നതിനെക്കാൾ മലയാളത്തിൽ സ്വാഭാവികമായ കാലാവസ്ഥാപ്രയോഗം; ഫലബന്ധം മുൻവാക്യത്തിലെ അർദ്ധവിരാമം വ്യക്തമാക്കുന്നു.
- source_word: וְהָאֲדָמָה לֹא תִתֵּן אֶת יְבוּלָהּ
  choice: നിലം അതിന്റെ വിളവ് നൽകുകയുമില്ല
  rationale: אֲדָמָה എന്ന കൃഷിയോഗ്യമായ മണ്ണ്/നിലം എന്ന അർഥത്തെ ‘നിലം’ എന്നു നൽകി, പിന്നീടുള്ള הָאָרֶץ (‘ദേശം’) എന്നതിൽനിന്നുള്ള പദവ്യത്യാസം നിലനിർത്തി. יְבוּלָהּ എന്നത് ‘അതിന്റെ വിളവ്’ എന്നു നേരിട്ട് നൽകി.
- source_word: וַאֲבַדְתֶּם מְהֵרָה
  choice: നിങ്ങൾ വേഗത്തിൽ നശിച്ചുപോകും
  rationale: אבד ഇവിടെ ഉടമ്പടിന്യായവിധിയുടെ ഫലമായ ഇല്ലായ്മയെയോ ദേശത്തുനിന്നുള്ള നീക്കത്തെയോ വിശാലമായി സൂചിപ്പിക്കുന്നു. ‘നശിച്ചുപോകും’ അതിന്റെ തീവ്രത നിലനിർത്തുന്നു; ‘വേഗത്തിൽ’ מְהֵרָהയുടെ ഗതി വ്യക്തമാക്കുന്നു.
- source_word: מֵעַל הָאָרֶץ הַטֹּבָה
  choice: ആ നല്ല ദേശത്തുനിന്ന്
  rationale: מֵעַל ദേശത്തിന്റെ മുകളിൽനിന്നുള്ള നീക്കം സൂചിപ്പിക്കുന്നുവെങ്കിലും മലയാളത്തിൽ ‘ദേശത്തുനിന്ന്’ സ്വാഭാവികമായി അതേ വേർപാട് അറിയിക്കുന്നു; הָאָרֶץ ഇവിടെ ഉടമ്പടിദേശമായതിനാൽ ‘ദേശം’ ഉപയോഗിച്ചു.
- source_word: אֲשֶׁר יְהוָה נֹתֵן לָכֶם
  choice: യഹ്‌വേ നിങ്ങൾക്കു തരുന്ന
  rationale: നֹתֵן എന്ന വർത്തമാന കൃദന്തരൂപത്തിന്റെ പുരോഗമിക്കുന്ന/സമീപസ്ഥമായ ദാനഭാവം ‘തരുന്ന’ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനാൽ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ ഉപയോഗിക്കാതെ, സാധ്യതയുള്ള ഉച്ചാരണത്തെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു.
- issue: ദൈവകോപത്തിന്റെ ശരീരരൂപക ശൈലി
  choice: യഹ്‌വേയുടെ കോപം നിങ്ങൾക്കെതിരെ ജ്വലിക്കും
  alternative: യഹ്‌വേ നിങ്ങളോടു കോപിക്കും
  rationale: മൂലത്തിലെ חָרָה אַף എന്ന ‘മൂക്ക്/കോപം കത്തുക’ എന്ന ശൈലിയിലെ കത്തുന്ന രൂപകം സംരക്ഷിക്കുന്നു; അതേസമയം അക്ഷരാർഥത്തിലുള്ള ‘മൂക്ക്’ മലയാളവായനക്കാരനെ തെറ്റിദ്ധരിപ്പിക്കാതിരിക്കാൻ അടിക്കുറിപ്പിൽ മാത്രം വിശദീകരിച്ചു.
- issue: וַאֲבַדְתֶּם സൂചിപ്പിക്കുന്ന ന്യായവിധിയുടെ സ്വഭാവം
  choice: നശിച്ചുപോകും
  alternative: ദേശത്തുനിന്ന് നീക്കപ്പെടും / മരിച്ചുപോകും
  rationale: ക്രിയ മരണം, നാശം, ദേശനഷ്ടം എന്നിവയിൽ ഒന്നിനെ മാത്രം വ്യക്തമായി നിർണ്ണയിക്കുന്നില്ല. അതിനാൽ ഒരു പ്രത്യേക സംവിധാനത്തിലേക്ക് അർഥം ചുരുക്കാതെ മൂലപാഠത്തിന്റെ തീവ്രതയും വ്യാപ്തിയും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ബൈബിൾഭാഷ ഉപയോഗിച്ചു. ‘നിലം’ എന്നും ‘ദേശം’ എന്നും വേർതിരിച്ച് אֲדָמָה/הָאָרֶץ പദവ്യത്യാസം സംരക്ഷിച്ചു. വായനാസൗകര്യത്തിനായി നീണ്ട എബ്രായ സംയുക്തവാക്യം മൂന്ന് മലയാളവാക്യങ്ങളാക്കി; കാരണ-ഫലക്രമവും ആവർത്തിത നിഷേധങ്ങളും നിലനിർത്തി.
