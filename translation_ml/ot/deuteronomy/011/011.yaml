id: DEU.11.11
reference: Deuteronomy 11:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָ/אָ֗רֶץ אֲשֶׁ֨ר אַתֶּ֜ם עֹבְרִ֥ים שָׁ֨מָּ/ה֙ לְ/רִשְׁתָּ֔/הּ אֶ֥רֶץ הָרִ֖ים וּ/בְקָעֹ֑ת לִ/מְטַ֥ר הַ/שָּׁמַ֖יִם תִּשְׁתֶּה מָּֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/011.yaml
  text: But the land that you are crossing over to possess is a land of mountains and valleys[b][a]; it drinks water from the rain of heaven.
translation:
  language: ml
  text: എന്നാൽ നിങ്ങൾ കൈവശമാക്കാൻ കടന്നുചെല്ലുന്ന ദേശം മലകളും താഴ്‌വരകളും ഉള്ള ദേശമാണ്; ആകാശത്തുനിന്നുള്ള മഴവെള്ളം അതു കുടിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവകാശമായി നേടാൻ.’ എബ്രായ ക്രിയയ്ക്ക് ഉടമ്പടിസന്ദർഭങ്ങളിൽ കൈവശപ്പെടുത്തുക, അവകാശമായി നേടുക എന്നീ രണ്ടു ഭാവങ്ങളും ഉണ്ടായേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאָרֶץ
  choice: എന്നാൽ ... ദേശം
  rationale: മുൻവാക്യത്തിലെ ഈജിപ്തുമായുള്ള വ്യത്യാസം ഇവിടെ വാവ് സൂചിപ്പിക്കുന്നതിനാൽ, സ്വാഭാവികമായ മലയാളത്തിൽ ‘എന്നാൽ’ എന്നു നൽകി.
- source_word: עֹבְרִים שָׁמָּה
  choice: കടന്നുചെല്ലുന്ന
  rationale: ദേശത്തേക്കുള്ള ഇസ്രായേലിന്റെ സജീവമായ കടന്നുപോകലും ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള നീക്കവും സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לְרִשְׁתָּהּ
  choice: കൈവശമാക്കാൻ
  rationale: യാരഷ് എന്ന ക്രിയ ഇവിടെ സജീവമായി ദേശം കൈവശപ്പെടുത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു; ഉടമ്പടിസംബന്ധമായ അവകാശലഭ്യതയുടെ ഭാവവും ഇതിനുണ്ട്, അതിനാൽ ബദൽ അർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אֶרֶץ הָרִים וּבְקָעֹת
  choice: മലകളും താഴ്‌വരകളും ഉള്ള ദേശം
  rationale: ഭൂപ്രകൃതിയുടെ വൈരുധ്യം സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പകർന്നു നൽകുന്നു.
- source_word: לִמְטַר הַשָּׁמַיִם
  choice: ആകാശത്തുനിന്നുള്ള മഴവെള്ളം
  rationale: മഴയുടെ ഉറവിടം/മാർഗം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ശമയിം എന്ന രൂപത്തിന്റെ സന്ദർഭോചിതമായ അർഥം ‘ആകാശം’ ആണ്.
- source_word: תִּשְׁתֶּה מָּיִם
  choice: അതു കുടിക്കുന്നു
  rationale: ദേശം വെള്ളം കുടിക്കുന്നു എന്ന എബ്രായ വ്യക്തിവൽക്കരണം പരത്തിക്കളയാതെ നിലനിർത്തുന്നു; ‘മഴവെള്ളം’ എന്നു ചേർത്തത് മലയാളത്തിലെ സ്വാഭാവിക ബന്ധം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יָרַשׁ എന്ന ക്രിയയിലെ കൈവശപ്പെടുത്തൽ–അവകാശലഭ്യത അർഥവ്യാപ്തി
  choice: പ്രധാന പാഠത്തിൽ ‘കൈവശമാക്കാൻ’
  alternative: ‘അവകാശമായി നേടാൻ’
  rationale: സന്ദർഭത്തിലെ സജീവമായ ദേശപ്രവേശനത്തെ ‘കൈവശമാക്കാൻ’ കൂടുതൽ നേരിട്ട് പകർത്തുന്നു; എന്നാൽ ഉടമ്പടിപരമായ അവകാശത്തിന്റെ സാധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഭൂമി ‘കുടിക്കുന്നു’ എന്ന മൂലഭാഷയിലെ സജീവ ദൃശ്യരൂപം നിലനിർത്തി. ‘ആകാശം’ എന്നത് മലയാളത്തിൽ മഴയുടെ ഉറവിടം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നതിനാൽ പ്രത്യേകം അടിക്കുറിപ്പ് ആവശ്യമില്ല.
