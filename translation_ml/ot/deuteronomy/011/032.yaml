  edition: WLC
  text: וּ/שְׁמַרְתֶּ֣ם לַ/עֲשׂ֔וֹת אֵ֥ת כָּל הַֽ/חֻקִּ֖ים וְ/אֶת הַ/מִּשְׁפָּטִ֑ים אֲשֶׁ֧ר אָנֹכִ֛י נֹתֵ֥ן לִ/פְנֵי/כֶ֖ם הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/032.yaml
  text: And you shall be careful to do all the statutes and the judgments that I am setting before you today[a].
translation:
  language: ml
  text: ഞാൻ ഇന്ന് നിങ്ങളുടെ മുമ്പിൽ വെക്കുന്ന എല്ലാ ചട്ടങ്ങളും ന്യായവിധികളും നിങ്ങൾ ശ്രദ്ധയോടെ അനുഷ്ഠിക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘ഞാൻ ഇന്ന് നിങ്ങളുടെ മുമ്പിൽ നൽകുന്ന.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം ‘നിങ്ങളുടെ മുമ്പിൽ വെക്കുന്ന’ എന്നാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁמַרְתֶּם לַ/עֲשׂוֹת
  choice: ശ്രദ്ധയോടെ അനുഷ്ഠിക്കണം
  rationale: שׁמר എന്ന ക്രിയയ്ക്ക് പിന്നാലെ לַעֲשׂוֹת വരുന്നതിനാൽ, വെറുതെ ‘പാലിക്കുക’ എന്നതിലുപരി ശ്രദ്ധാപൂർവം നിർവഹിക്കണമെന്ന ആജ്ഞാഭാവമാണ്. ആധുനിക മലയാളത്തിൽ ‘ശ്രദ്ധയോടെ അനുഷ്ഠിക്കണം’ അത് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כָּל
  choice: എല്ലാ
  rationale: ആവശ്യത്തിന്റെ സമഗ്രതയും ഒന്നും ഒഴിവാക്കരുതെന്ന ഊന്നലും നിലനിർത്തുന്നു.
- source_word: הַ/חֻקִּים
  choice: ചട്ടങ്ങൾ
  rationale: חֻקִּים നിർദേശിക്കപ്പെട്ട നിയമവ്യവസ്ഥകളെ സൂചിപ്പിക്കുന്നു. ‘ചട്ടങ്ങൾ’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന നിയമപരമായ പദമാണ്; തുടർന്നുള്ള מִשְׁפָּטִים എന്നതിൽനിന്നും വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: הַ/מִּשְׁפָּטִים
  choice: ന്യായവിധികൾ
  rationale: מִשְׁפָּטִים എന്ന പദത്തിന്റെ വിധി, നീതിനിർണയം, നിയമനിർദേശം എന്നീ അർഥസാധ്യതകൾ തുറന്നുവെക്കുകയും חֻקִּים എന്നതുമായ പദവ്യത്യാസം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: אֲשֶׁר אָנֹכִי נֹתֵן לִ/פְנֵי/כֶם
  choice: ഞാൻ നിങ്ങളുടെ മുമ്പിൽ വെക്കുന്ന
  rationale: נתן എന്നതിന്റെ അക്ഷരാർഥം ‘നൽകുക’ ആണെങ്കിലും לִפְנֵי എന്നതിനോടൊപ്പം ഇവിടെ ‘മുമ്പിൽ വെക്കുക/അവതരിപ്പിക്കുക’ എന്ന ഹീബ്രു പ്രയോഗമാണ്. വർത്തമാന പ്രവർത്തിയുടെ ഭാവവും നിലനിർത്തുന്നു.
- source_word: הַ/יּוֹם
  choice: ഇന്ന്
  rationale: ഉടമ്പടി പ്രസംഗത്തിന്റെ കാലിക അടിയന്തരത ആധുനികവും നേരിട്ടുമായ ഭാഷയിൽ പ്രകടമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിയമ-ഉടമ്പടി ഭാവം നിലനിർത്തിക്കൊണ്ട് അത്യന്തം പുരാതനമായ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി. ബഹുവചന അഭിസംബോധന മലയാളത്തിൽ സ്വാഭാവികമായി ക്രിയാരൂപത്തിൽ ഉൾക്കൊള്ളുന്നു.
