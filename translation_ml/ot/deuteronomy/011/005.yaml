id: DEU.11.5
reference: Deuteronomy 11:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/אֲשֶׁ֥ר עָשָׂ֛ה לָ/כֶ֖ם בַּ/מִּדְבָּ֑ר עַד בֹּאֲ/כֶ֖ם עַד הַ/מָּק֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/005.yaml
  text: and what he did for you in the wilderness until you came to this place—
translation:
  language: ml
  text: നിങ്ങൾ ഈ സ്ഥലത്ത് എത്തുന്നതുവരെ മരുഭൂമിയിൽ അവൻ നിങ്ങൾക്കുവേണ്ടി ചെയ്തതും—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: ചെയ്തതും
  rationale: മുൻവാക്യങ്ങളിൽ തുടരുന്ന ദൈവിക പ്രവൃത്തികളുടെ പട്ടികയോട് ഈ ഘടകം ബന്ധിപ്പിക്കുന്നു. മലയാളത്തിൽ ക്രിയാനാമരൂപത്തോടുള്ള ‘-ഉം’ ആ ബന്ധവും ‘എന്ത്’ എന്ന ആപേക്ഷിക അർഥവും സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: עָשָׂה
  choice: അവൻ ... ചെയ്ത
  rationale: עשה എന്ന സാധാരണ ‘ചെയ്യുക’ എന്ന ക്രിയയെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; കർത്താവിനെ സൂചിപ്പിക്കുന്ന കർത്താവ് സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാകുന്നു.
- source_word: לָכֶם
  choice: നിങ്ങൾക്കുവേണ്ടി
  rationale: ഇവിടെ ל ദൈവം ഇസ്രായേലിനുവേണ്ടി പ്രവർത്തിച്ചതിനെ സൂചിപ്പിക്കുന്നു; ‘നിങ്ങളോട്’ എന്നതിനെക്കാൾ സന്ദർഭോചിതമാണ്.
- source_word: בַּמִּדְבָּר
  choice: മരുഭൂമിയിൽ
  rationale: ഇസ്രായേലിന്റെ യാത്ര നടന്ന ജനവാസം കുറഞ്ഞ വരണ്ട പ്രദേശത്തെ സൂചിപ്പിക്കുന്ന മִדְבָּר എന്ന പദത്തിന്റെ സാധാരണയും പരിചിതവുമായ മലയാളരൂപം.
- source_word: עַד בֹּאֲכֶם
  choice: നിങ്ങൾ ... എത്തുന്നതുവരെ
  rationale: ആദ്യ עַד കാലപരമായ പരിധി സൂചിപ്പിക്കുന്നു. בוא എന്നതിനെ സ്ഥലത്ത് ‘എത്തുക’ എന്നു നൽകുന്നത് പിന്നാലെയുള്ള ലക്ഷ്യസ്ഥാനവുമായി സ്വാഭാവികമായി ചേരുന്നു.
- source_word: עַד הַמָּקוֹם הַזֶּה
  choice: ഈ സ്ഥലത്ത്
  rationale: രണ്ടാമത്തെ עַד ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള സ്ഥലപരമായ പരിധി സൂചിപ്പിക്കുന്നു. ‘എത്തുക’ എന്ന ക്രിയയോടൊപ്പം അധികമായ ‘വരെ’ ആവർത്തിക്കാതെ അതിന്റെ അർഥം മലയാളത്തിൽ വ്യക്തമായി നിലനിൽക്കുന്നു.
theological_decisions:
- issue: ‘ചെയ്തു’ എന്ന ക്രിയയുടെ പരോക്ഷ കർത്താവ്
  choice: ‘അവൻ’ എന്നു വ്യക്തമാക്കി; ഇത് ചുറ്റുപാടിലുള്ള സന്ദർഭപ്രകാരം യഹോവയെ സൂചിപ്പിക്കുന്നു.
  alternative: ‘യഹോവ’ എന്നു പേര് ആവർത്തിക്കുക, അല്ലെങ്കിൽ കർത്താവിനെ ഒഴിവാക്കി ക്രിയാനാമരൂപം മാത്രം ഉപയോഗിക്കുക.
  rationale: എബ്രായത്തിൽ കർത്താവ് ക്രിയാരൂപത്തിൽ ഉൾപ്പെട്ടിട്ടുണ്ടെങ്കിലും മുൻസന്ദർഭത്തിൽ നിന്നാണ് തിരിച്ചറിയുന്നത്. ‘അവൻ’ എന്നത് ബന്ധം നിലനിർത്തുകയും മൂലത്തിൽ ഇല്ലാത്ത ദൈവനാമം ഇവിടെ ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഈ വാക്യം മുൻപും പിന്നാലെയും തുടരുന്ന പട്ടികയുടെ ഭാഗമായതിനാൽ തുടക്കത്തിൽ സ്വതന്ത്രമായ ‘എന്ത്’ ചേർക്കാതെ ‘ചെയ്തതും’ എന്ന സംയോജക ക്രിയാനാമരൂപവും അവസാനം ദീർഘവിരാമചിഹ്നവും നിലനിർത്തി.
