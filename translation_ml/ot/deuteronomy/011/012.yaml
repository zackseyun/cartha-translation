source:
  edition: WLC
  text: אֶ֕רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ דֹּרֵ֣שׁ אֹתָ֑/הּ תָּמִ֗יד עֵינֵ֨י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בָּ֔/הּ מֵֽ/רֵשִׁית֙ הַ/שָּׁנָ֔ה וְ/עַ֖ד אַחֲרִ֥ית שָׁנָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/012.yaml
  text: a land that Yahweh your God cares for; the eyes of Yahweh your God are continually on it[a], from the beginning of the year to the end of the year.
translation:
  language: ml
  text: നിന്റെ ദൈവമായ യഹോവ പരിപാലിക്കുന്ന[a] ദേശമാണത്; വർഷത്തിന്റെ ആരംഭം മുതൽ വർഷാവസാനം വരെ നിന്റെ ദൈവമായ യഹോവയുടെ കണ്ണുകൾ നിരന്തരം അതിന്മേലുണ്ട്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പരിപാലിക്കുന്ന’ എന്നതിന് ‘അന്വേഷിക്കുന്ന’ അല്ലെങ്കിൽ ‘ശ്രദ്ധയോടെ നോക്കുന്ന’ എന്നും വിവർത്തനം ചെയ്യാം. എബ്രായക്രിയയ്ക്ക് തേടുക, അന്വേഷിക്കുക, പരിപാലിക്കുക എന്നീ അർഥങ്ങളുണ്ട്; ഇവിടെ ദേശത്തോടുള്ള യഹോവയുടെ സജീവമായ കരുതലാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ
  choice: ദേശം
  rationale: ആവർത്തനപുസ്തകത്തിലെ സന്ദർഭത്തിൽ വാഗ്ദത്തഭൂമിയായ ഭൂപ്രദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ദേശം’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: രണ്ടാംപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയം കൃത്യമായി നിലനിർത്തുകയും മലയാളവാക്യത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: דֹּרֵשׁ אֹתָהּ
  choice: പരിപാലിക്കുന്ന
  rationale: דרש എന്ന ക്രിയയ്ക്ക് അന്വേഷിക്കുക, തേടുക, ശ്രദ്ധയോടെ നോക്കുക എന്നീ അർഥസാധ്യതകളുണ്ട്; ഭൂമിയെ കർമമായി സ്വീകരിക്കുന്ന ഇവിടെ ദൈവത്തിന്റെ സജീവമായ കരുതലും മേൽനോട്ടവും ‘പരിപാലിക്കുന്ന’ എന്നത് സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: תָּמִיד
  choice: നിരന്തരം
  rationale: തുടർച്ചയായ ശ്രദ്ധയെ സൂചിപ്പിക്കുന്നു; ഗൗരവമുള്ളതും ആധുനിക വായനക്കാർക്ക് വ്യക്തവുമായ പദമാണ്.
- source_word: עֵינֵי יְהוָה אֱלֹהֶיךָ בָּהּ
  choice: നിന്റെ ദൈവമായ യഹോവയുടെ കണ്ണുകൾ അതിന്മേലുണ്ട്
  rationale: ദൈവത്തിന്റെ ജാഗ്രതയുള്ള ശ്രദ്ധയെ പ്രകടമാക്കുന്ന എബ്രായത്തിലെ മാനവരൂപക ചിത്രം പരാവർത്തനം ചെയ്യാതെ നിലനിർത്തുന്നു.
- source_word: מֵרֵשִׁית הַשָּׁנָה וְעַד אַחֲרִית שָׁנָה
  choice: വർഷത്തിന്റെ ആരംഭംമുതൽ വർഷാവസാനംവരെ
  rationale: മുഴുവൻ വർഷത്തെയും ഉൾക്കൊള്ളുന്ന കാലപരിധി വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ ഒരു സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്ന രൂപം നിലനിർത്തി.
- issue: ദൈവത്തിന്റെ ‘കണ്ണുകൾ’ എന്ന മാനവരൂപക പ്രയോഗം
  choice: കണ്ണുകൾ ... അതിന്മേലുണ്ട്
  alternative: ദൈവം അതിനെ എപ്പോഴും ശ്രദ്ധിക്കുന്നു
  rationale: മൂലപാഠത്തിന്റെ ദൃശ്യരൂപവും അതിലുള്ള ജാഗ്രതയുള്ള ദൈവിക ശ്രദ്ധയും നിലനിർത്താൻ ചിത്രം നേരിട്ട് സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വായനാസൗകര്യവും സംയോജിപ്പിച്ചു. രണ്ടാംപുരുഷ ഏകവചനം നിലനിർത്തി; എബ്രായത്തിലെ ദൈവിക ‘കണ്ണുകൾ’ എന്ന ചിത്രം സംരക്ഷിച്ചു. അടിക്കുറിപ്പ് സൂചകം ബന്ധപ്പെട്ട ആശയത്തിന് പിന്നാലെ മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
