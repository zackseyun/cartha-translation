  yaml_path: translation/ot/deuteronomy/011/022.yaml
  text: For if you carefully keep all this commandment that I am commanding you to do—to love Yahweh your God[a], to walk in all his ways[c][b], and to cling to him—
translation:
  language: ml
  text: എന്തെന്നാൽ, ഞാൻ നിങ്ങളോടു അനുഷ്ഠിക്കാൻ കൽപ്പിക്കുന്ന ഈ കൽപ്പന മുഴുവനും നിങ്ങൾ ശ്രദ്ധാപൂർവം പാലിക്കുകയും[a][b], നിങ്ങളുടെ ദൈവമായ യഹ്‌വെയെ സ്നേഹിക്കുകയും, അവന്റെ എല്ലാ വഴികളിലും നടക്കുകയും, അവനോടു പറ്റിച്ചേരുകയും[c] ചെയ്താൽ—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വളരെ ജാഗ്രതയോടെ പാലിച്ച്.’ എബ്രായത്തിൽ ഒരേ ക്രിയയുടെ ഊന്നൽരൂപവും സാധാരണ ക്രിയാരൂപവും ചേർത്തുപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ‘ഈ കൽപ്പന മുഴുവനും’ എന്നത് ഏകവചനത്തിലാണ്; ഉടമ്പടിയുടെ സമഗ്രമായ നിർദേശം ഒന്നായി സൂചിപ്പിക്കുന്ന പ്രയോഗമായിരിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘അവനെ മുറുകെപ്പിടിക്കുകയും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: എന്തെന്നാൽ, ... ചെയ്താൽ
  rationale: മുൻവാക്യത്തോടുള്ള ബന്ധവും വ്യവസ്ഥാസ്വഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: שָׁמֹר תִּשְׁמְרוּן
  choice: ശ്രദ്ധാപൂർവം പാലിച്ച്
  rationale: ക്രിയയുടെ infinitive absolute രൂപവും finite verb-ഉം ചേർന്നുള്ള ഊന്നൽ ശ്രദ്ധയോടെയുള്ള അനുസരണമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: כָּל הַמִּצְוָה הַזֹּאת
  choice: ഈ കല്പന മുഴുവനും
  rationale: എബ്രായത്തിലെ ഏകവചനവും ഉടമ്പടിനിർദേശത്തെ സമഗ്രമായി സൂചിപ്പിക്കുന്ന collective ഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם לַעֲשֹׂתָהּ
  choice: നിങ്ങൾ അനുഷ്ഠിക്കേണ്ടതിന് ഞാൻ നിങ്ങളോടു കല്പിക്കുന്ന
  rationale: നിലവിലെ പ്രസംഗത്തിൽ നൽകപ്പെടുന്ന കല്പനയും അതു പ്രാവർത്തികമാക്കേണ്ടതുമെന്ന ആശയവും സ്വാഭാവികമായി ചേർക്കുന്നു; സമീപസന്ദർഭത്തിലെ ‘ഇന്ന്’ ഇവിടെ ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: לְאַהֲבָה אֶת יְהוָה אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവമായ യഹ്‌വെയെ സ്നേഹിക്കുകയും
  rationale: സ്നേഹം അനുസരണത്തിന്റെ ഉള്ളടക്കമായി നിലനിർത്തുകയും ദൈവനാമമായ יהוה-യെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: לָלֶכֶת בְּכָל דְּרָכָיו
  choice: അവന്റെ എല്ലാ വഴികളിലും നടക്കുകയും
  rationale: ജീവിതനടപ്പിനെ സൂചിപ്പിക്കുന്ന എബ്രായ ഉടമ്പടിരൂപകം വ്യാഖ്യാനിച്ച് പരത്താതെ സംരക്ഷിക്കുന്നു.
- source_word: וּלְדָבְקָה בוֹ
  choice: അവനോടു പറ്റിച്ചേരുകയും
  rationale: דבק എന്ന പദത്തിലെ അടുത്ത ബന്ധവും ഉറച്ച ചേർച്ചയും ആധുനിക മലയാളത്തിൽ ദൃശ്യമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമത്തെ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, Yahweh എന്ന ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: ‘വഴികളിൽ നടക്കുക’, ‘പറ്റിച്ചേരുക’ എന്നീ ഉടമ്പടിരൂപകങ്ങൾ
  choice: രൂപകങ്ങൾ മുഖ്യപാഠത്തിൽ നിലനിർത്തുക
  alternative: ‘അവന്റെ ഇഷ്ടപ്രകാരം ജീവിക്കുക’, ‘അവനോടു വിശ്വസ്തരായിരിക്കുക’ എന്നിങ്ങനെ വ്യാഖ്യാനിക്കുക
  rationale: മൂലത്തിലെ ബന്ധപരവും പ്രബോധനാത്മകവുമായ ശക്തി സംരക്ഷിക്കുകയും ഒരു പ്രത്യേക ദൈവശാസ്ത്രവ്യാഖ്യാനം ചുമത്താതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. വാക്യം അടുത്ത വാക്യത്തിൽ പൂർത്തിയാകുന്ന വ്യവസ്ഥാവാക്യമായതിനാൽ അവസാനത്തിൽ ദീർഘവിരാമചിഹ്നം നിലനിർത്തി. ‘യഹ്‌വെ’ ദൈവനാമത്തിന്റെ ലിപ്യന്തരണമാണ്; ‘നടക്കുക’, ‘പറ്റിച്ചേരുക’ എന്നീ മൂലരൂപകങ്ങൾ ഉദ്ദേശപൂർവം സംരക്ഷിച്ചു.
