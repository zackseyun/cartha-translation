reference: Deuteronomy 11:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לִמַּדְתֶּ֥ם אֹתָ֛/ם אֶת בְּנֵי/כֶ֖ם לְ/דַבֵּ֣ר בָּ֑/ם בְּ/שִׁבְתְּ/ךָ֤ בְּ/בֵיתֶ֨/ךָ֙ וּ/בְ/לֶכְתְּ/ךָ֣ בַ/דֶּ֔רֶךְ וּֽ/בְ/שָׁכְבְּ/ךָ֖ וּ/בְ/קוּמֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/019.yaml
  text: You shall teach them to your children[a], speaking of them when you sit in your house, and when you walk on the road, and when you lie down, and when you rise up.
translation:
  language: ml
  text: നിങ്ങൾ അവ നിങ്ങളുടെ മക്കൾക്കു പഠിപ്പിക്കണം[a]. നിങ്ങൾ വീട്ടിൽ ഇരിക്കുമ്പോഴും വഴിയിൽ നടക്കുമ്പോഴും കിടക്കുമ്പോഴും എഴുന്നേൽക്കുമ്പോഴും അവയെക്കുറിച്ച് സംസാരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘നിങ്ങളുടെ പുത്രന്മാരെ.’ എബ്രായത്തിൽ പുല്ലിംഗ ബഹുവചനരൂപമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; അത് ഒരാളുടെ മക്കളെ പൊതുവായി പ്രതിനിധാനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִמַּדְתֶּם
  choice: പഠിപ്പിക്കണം
  rationale: למד എന്ന ധാതുവിന്റെ പീയേൽ രൂപം സാധാരണയായി ‘പഠിപ്പിക്കുക’ എന്നാണ്. ആരംഭത്തിലെ וְ സന്ദർഭബന്ധം സൂചിപ്പിക്കുന്നുവെങ്കിലും സ്വാഭാവിക മലയാളത്തിൽ പ്രത്യേകം ‘കൂടാതെ’ എന്നു ചേർക്കേണ്ടതില്ല.
- source_word: אֹתָם
  choice: അവ
  rationale: മൂന്നാം പുരുഷ ബഹുവചന കർമസർവനാമം മുൻസന്ദർഭത്തിലെ വചനങ്ങളെയോ കല്പനകളെയോ സൂചിപ്പിക്കുന്നു. മൂലപാഠത്തിലെ പരാമർശസ്വഭാവം നിലനിർത്താൻ ‘അവ’ എന്നു നൽകി.
- source_word: אֶת־בְּנֵיכֶם
  choice: നിങ്ങളുടെ മക്കളെ
  rationale: בנים എന്നത് സങ്കുചിതമായി ‘പുത്രന്മാർ’ എന്നും പ്രതിനിധാനപരമായി സന്താനങ്ങളെ പൊതുവെ സൂചിപ്പിക്കുന്ന ‘മക്കൾ’ എന്നും വരാം. ഉടമ്പടി പ്രബോധനത്തിന്റെ ഈ സന്ദർഭത്തിൽ സ്വാഭാവികവും ഉൾക്കൊള്ളുന്നതുമായ ‘മക്കൾ’ യോജിക്കുന്നു.
- source_word: לְדַבֵּר בָּם
  choice: അവയെക്കുറിച്ചു സംസാരിക്കണം
  rationale: בָּם ഇവിടെ ആ വചനങ്ങളെയോ കല്പനകളെയോ സംസാരവിഷയമായി സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘അവയെക്കുറിച്ചു സംസാരിക്കുക’ അർത്ഥം വ്യക്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: בְּשִׁבְתְּךָ בְּבֵיתֶךָ
  choice: നിങ്ങൾ വീട്ടിൽ ഇരിക്കുമ്പോഴും
  rationale: 'בְ + infinitive construct കാലസാഹചര്യം സൂചിപ്പിക്കുന്നു: ‘ഇരിക്കുമ്പോൾ.’ ‘വീട്ടിൽ’ എന്നത് בְּבֵיתֶךָയുടെ സ്വാഭാവിക മലയാളരൂപമാണ്.'
- source_word: וּבְלֶכְתְּךָ בַדֶּרֶךְ
  choice: വഴിയിൽ നടക്കുമ്പോഴും
  rationale: הלך എന്ന സാധാരണ ക്രിയയുടെ ‘നടക്കുക/പോകുക’ എന്ന അർത്ഥവും בַדֶּרֶךְ എന്നതിന്റെ ‘വഴിയിൽ’ എന്ന സ്ഥലസൂചനയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וּבְשָׁכְבְּךָ
  choice: കിടക്കുമ്പോഴും
  rationale: שכב എന്നതിന്റെ അടിസ്ഥാന അർത്ഥമായ ‘കിടക്കുക’ നിലനിർത്തുന്നു; ബְ ചേർന്ന infinitive construct കാലസാഹചര്യം വ്യക്തമാക്കുന്നു.
- source_word: וּבְקוּמֶךָ
  choice: എഴുന്നേൽക്കുമ്പോഴും
  rationale: קום ഇവിടെ കിടപ്പിൽനിന്നോ വിശ്രമത്തിൽനിന്നോ എഴുന്നേൽക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘കിടക്കുമ്പോഴും—എഴുന്നേൽക്കുമ്പോഴും’ എന്ന സ്വാഭാവിക ജോടി എബ്രായത്തിലെ താളം നിലനിർത്തുന്നു.
theological_decisions:
- issue: בְּנֵיכֶם എന്നതിലെ ലിംഗസൂചന
  choice: നിങ്ങളുടെ മക്കളെ
  alternative: നിങ്ങളുടെ പുത്രന്മാരെ
  rationale: എബ്രായത്തിലെ പുല്ലിംഗ ബഹുവചനം ഈ സന്ദർഭത്തിൽ സന്താനങ്ങളെ പ്രതിനിധാനപരമായി പൊതുവെ സൂചിപ്പിക്കാം. പെൺമക്കളെ ഒഴിവാക്കുന്നു എന്ന് അനാവശ്യമായി ധരിപ്പിക്കാതെ ഈ വ്യാപ്തി ‘മക്കൾ’ വ്യക്തമാക്കുന്നു; ‘പുത്രന്മാർ’ എന്ന ശാബ്ദിക സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ആവർത്തിക്കുന്ന നാല് കാലസാഹചര്യങ്ങളെ ‘-പ്പോഴും’ എന്ന സമാന്തരഘടനയിൽ ചേർത്ത് എബ്രായത്തിലെ താളം നിലനിർത്തി. ബഹുവചന അഭിസംബോധന വ്യക്തമാക്കാൻ ‘നിങ്ങളുടെ/നിങ്ങൾ’ ഉപയോഗിച്ചു.
