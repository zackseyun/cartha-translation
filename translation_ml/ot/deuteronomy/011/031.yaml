id: DEU.11.31
reference: Deuteronomy 11:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֤י אַתֶּם֙ עֹבְרִ֣ים אֶת הַ/יַּרְדֵּ֔ן לָ/בֹא֙ לָ/רֶ֣שֶׁת אֶת הָ/אָ֔רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֵי/כֶ֖ם נֹתֵ֣ן לָ/כֶ֑ם וִֽ/ירִשְׁתֶּ֥ם אֹתָ֖/הּ וִֽ/ישַׁבְתֶּם בָּֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/031.yaml
  text: For you are crossing the Jordan to go in to take possession of the land that Yahweh your God is giving you[a], and you will take possession of it and live in it.
translation:
  language: ml
  text: കാരണം, നിങ്ങളുടെ ദൈവമായ യാഹ്‌വേ നിങ്ങൾക്കു നൽകുന്ന ദേശത്തു പ്രവേശിച്ചു അതു കൈവശമാക്കാൻ നിങ്ങൾ യോർദ്ദാൻ കടക്കുകയാണ്; നിങ്ങൾ അതു കൈവശമാക്കുകയും അതിൽ വസിക്കുകയും ചെയ്യും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായം: ‘YHWH’; ഇവിടെ ‘യാഹ്‌വേ’ എന്നു ലിപ്യന്തരണം ചെയ്തിരിക്കുന്നു; പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്താറുണ്ട്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ ആഹ്വാനത്തിന്റെ അടിസ്ഥാനം സൂചിപ്പിക്കുന്ന ബന്ധകമായി സ്വാഭാവികമായ മലയാളം.
- source_word: עֹבְרִים אֶת־הַיַּרְדֵּן
  choice: നിങ്ങൾ യോർദ്ദാൻ കടക്കുകയാണ്
  rationale: വർത്തമാന കൃദന്തരൂപത്തിലെ പുരോഗമനപരവും ആസന്നവുമായ പ്രവർത്തനഭാവം നിലനിർത്തുന്നു.
- source_word: לָבוֹא לָרֶשֶׁת
  choice: പ്രവേശിച്ച് അതു കൈവശമാക്കേണ്ടതിന്
  rationale: ദേശത്തിലേക്കുള്ള പ്രവേശനവും അതിനെ കൈവശപ്പെടുത്തലും എന്ന രണ്ടു ഘട്ടങ്ങളുള്ള എബ്രായ ക്രിയാക്രമം സ്വാഭാവിക മലയാളത്തിൽ സൂക്ഷിക്കുന്നു.
- source_word: הָאָרֶץ
  choice: ദേശം
  rationale: ആവർത്തനപുസ്തകത്തിലെ വാഗ്ദത്തഭൂമിയെ സൂചിപ്പിക്കുന്ന പതിവും പ്രസക്തവുമായ പദം.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പദവിയാൽ പകരാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവമായ
  rationale: രണ്ടാം പുരുഷ ബഹുവചന ഉടമസ്ഥബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: נֹתֵן לָכֶם
  choice: നിങ്ങൾക്കു നൽകുന്ന
  rationale: ദൈവത്തിന്റെ ദാനം ഇപ്പോൾ പുരോഗമിക്കുന്നതും ഉറപ്പുള്ളതുമായതായി അവതരിപ്പിക്കുന്ന കൃദന്തരൂപം നിലനിർത്തുന്നു.
- source_word: וִירִשְׁתֶּם אֹתָהּ
  choice: നിങ്ങൾ അതു കൈവശമാക്കി
  rationale: ירשׁ എന്ന പദത്തിന്റെ ഭൂമി സ്വന്തനിയന്ത്രണത്തിലാക്കുക എന്ന ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: וִישַׁבְתֶּם בָּהּ
  choice: അവിടെ വസിക്കും
  rationale: ישׁב എന്നതിന്റെ താമസിക്കുക/വസിക്കുക എന്ന അർഥം dignified ആയ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഉപയോഗിക്കുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരാതെ ദൈവനാമം ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: ദേശം ദൈവത്തിന്റെ ദാനവും ഇസ്രായേലിന്റെ കൈവശപ്പെടുത്തലും ആകുന്നു എന്ന ഇരട്ടവീക്ഷണം
  choice: ‘നൽകുന്ന’ എന്നും ‘കൈവശമാക്കി’ എന്നും രണ്ടും നിലനിർത്തി
  alternative: ഒന്നിനെ മറ്റൊന്നിൽ ലയിപ്പിക്കുക
  rationale: ദൈവിക ദാനവും മനുഷ്യരുടെ പ്രവേശന-കൈവശപ്പെടുത്തൽ പ്രവർത്തനവും തമ്മിലുള്ള പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം പരിഹരിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന വിധം, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവത്തോടെ. ‘കൈവശമാക്കുക’ എന്ന പദം ירשׁയുടെ പ്രസക്തമായ അർഥം വ്യക്തമാക്കുന്നു; ‘വസിക്കും’ എന്നത് അത്യന്തം പുരാതനമല്ലാത്ത ഔപചാരിക ഭാവം നൽകുന്നു.
