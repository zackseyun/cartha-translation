revisions:
- from: 'ഇന്നു നിങ്ങൾ മനസ്സിലാക്കണം: ഞാൻ പറയുന്നത് നിങ്ങളുടെ മക്കളോടല്ല[a]—അവർ നിങ്ങളുടെ ദൈവമായ യഹോവയുടെ ശിക്ഷണവും അവിടുത്തെ മഹത്ത്വവും ശക്തമായ കരവും[b] നീട്ടിയ ഭുജവും അറിഞ്ഞിട്ടില്ല, കണ്ടിട്ടുമില്ല—'
  to: 'ഇന്നു നിങ്ങൾ അറിയുക: ഞാൻ സംസാരിക്കുന്നത് നിങ്ങളുടെ മക്കളോടല്ല[a]—അവർ നിങ്ങളുടെ ദൈവമായ യഹോവയുടെ ശിക്ഷണവും അവിടുത്തെ മഹത്ത്വവും ശക്തമായ കൈയും[b] നീട്ടിയ ഭുജവും അറിയുകയോ കാണുകയോ ചെയ്തിട്ടില്ല—'
  rationale: ‘മനസ്സിലാക്കണം’ എന്നതിനു പകരം ‘അറിയുക’ ഉപയോഗിച്ച് וִידַעְתֶּם എന്ന ശ്രദ്ധക്ഷണിക്കുന്ന ആഹ്വാനത്തിന്റെ നേരിട്ടുള്ള സ്വഭാവം നിലനിർത്തി. സൂചിതക്രിയയെ ‘ഞാൻ സംസാരിക്കുന്നത്’ എന്ന് പരിമിതമായി മാത്രം ചേർത്തതിനാൽ മൂലത്തിലെ എലിപ്സിസിന്റെ വ്യാഖ്യാനപരമായ വികസനം കുറയുന്നു. അവസാനത്തെ ‘അറിയുകയോ കാണുകയോ ചെയ്തിട്ടില്ല’ മുഴുവൻ പട്ടികയെയും വ്യക്തമായി നിയന്ത്രിക്കുന്നു.
