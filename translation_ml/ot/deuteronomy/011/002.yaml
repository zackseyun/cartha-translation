source:
  edition: WLC
  text: וִֽ/ידַעְתֶּם֮ הַ/יּוֹם֒ כִּ֣י לֹ֣א אֶת בְּנֵי/כֶ֗ם אֲשֶׁ֤ר לֹֽא יָדְעוּ֙ וַ/אֲשֶׁ֣ר לֹא רָא֔וּ אֶת מוּסַ֖ר יְהוָ֣ה אֱלֹהֵי/כֶ֑ם אֶת גָּדְל֕/וֹ אֶת יָד/וֹ֙ הַ/חֲזָקָ֔ה וּ/זְרֹע֖/וֹ הַ/נְּטוּיָֽה׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/002.yaml
  text: And know today that that I am not speaking to your children, who have not known and who have not seen the discipline of Yahweh your God[a], his greatness, his strong hand[b], and his outstretched arm—
translation:
  language: ml
  text: 'ഇന്നു നിങ്ങൾ അറിയുക: ഞാൻ സംസാരിക്കുന്നത് നിങ്ങളുടെ മക്കളോടല്ല[a]—അവർ നിങ്ങളുടെ ദൈവമായ യഹോവയുടെ ശിക്ഷണവും അവിടുത്തെ മഹത്ത്വവും ശക്തമായ കൈയും[b] നീട്ടിയ ഭുജവും അറിയുകയോ കാണുകയോ ചെയ്തിട്ടില്ല—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായവാക്യം ഇവിടെ അപൂർണ്ണമാണ്; അക്ഷരാർഥത്തിൽ, ‘നിങ്ങളുടെ മക്കളല്ല—അവർ അറിഞ്ഞിട്ടില്ല, കണ്ടിട്ടുമില്ല...’ എന്നാണ്. യഹോവയുടെ പ്രവൃത്തികൾ നേരിട്ട് കണ്ട ഇപ്പോഴത്തെ ശ്രോതാക്കളോടാണ് മോശ സംസാരിക്കുന്നത്, അവരുടെ മക്കളോടല്ല എന്നതാണ് സന്ദർഭാർഥം.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, ‘കരുത്തുറ്റ കൈ’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִידַעְתֶּם הַיּוֹם
  choice: ഇന്നു നിങ്ങൾ മനസ്സിലാക്കണം
  rationale: സന്ദർഭത്തിൽ ശ്രദ്ധ ക്ഷണിക്കുന്ന ആഹ്വാനമായി പ്രവർത്തിക്കുന്ന ക്രിയാരൂപവും ‘ഇന്ന്’ എന്ന കാലസൂചനയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: כִּי לֹא אֶת־בְּנֵיכֶם
  choice: ഞാൻ പറയുന്നത് നിങ്ങളുടെ മക്കളോടല്ല
  rationale: എബ്രായത്തിൽ ക്രിയ വിട്ടുകളഞ്ഞ ദീർഘവാക്യഘടനയാണ്. മോശയുടെ ഇപ്പോഴത്തെ ശ്രോതാക്കളെയും അനുഭവമില്ലാത്ത അവരുടെ മക്കളെയും തമ്മിൽ വേർതിരിക്കുന്ന സന്ദർഭാർഥം വ്യക്തമാക്കാൻ സൂചിതമായ ക്രിയ ചേർത്തു.
- source_word: אֲשֶׁר לֹא יָדְעוּ וַאֲשֶׁר לֹא רָאוּ
  choice: അവർ ... അറിഞ്ഞിട്ടില്ല, കണ്ടിട്ടുമില്ല
  rationale: അനുഭവത്തിലൂടെ അറിയുക, നേരിട്ട് കാണുക എന്നീ സമാന്തര ആശയങ്ങൾ മലയാളത്തിലെ സ്വാഭാവിക ക്രമത്തിൽ നിലനിർത്തുന്നു.
- source_word: מוּסַר
  choice: ശിക്ഷണം
  rationale: തിരുത്തലും പരിശീലനപരമായ ഉപദേശവും ഉൾക്കൊള്ളുന്ന പദം; വെറും ശിക്ഷയായി അർഥം ചുരുക്കുന്നില്ല.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവമായ യഹോവ
  rationale: ദൈവനാമം ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ ‘യഹോവ’ എന്നു നൽകുകയും ഉടമ്പടിബന്ധമുള്ള ‘നിങ്ങളുടെ ദൈവം’ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: גָּדְלוֹ
  choice: അവിടുത്തെ മഹത്ത്വം
  rationale: ദൈവത്തിന്റെ പ്രദർശിതമായ വലിപ്പവും ശ്രേഷ്ഠതയും സൂചിപ്പിക്കുന്ന ഗൗരവമുള്ള സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: יָדוֹ הַחֲזָקָה
  choice: ശക്തമായ കരം
  rationale: חזק എന്ന വിശേഷണത്തിന്റെ നേരിട്ടുള്ള അർഥവും ദൈവിക ശക്തിയുടെ പ്രയോഗം സൂചിപ്പിക്കുന്ന എബ്രായ ദൃശ്യരൂപവും നിലനിർത്തുന്നു.
- source_word: וּזְרֹעוֹ הַנְּטוּיָה
  choice: നീട്ടിയ ഭുജം
  rationale: പ്രവർത്തനനിരതമായ ദൈവിക ശക്തിയെ സൂചിപ്പിക്കുന്ന എബ്രായ ദൃശ്യരൂപം വാക്കുതലത്തിൽ വ്യക്തമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ‘നിങ്ങളുടെ മക്കളോടല്ല’ എന്ന അപൂർണ്ണ എബ്രായ ഘടന
  choice: ‘ഞാൻ പറയുന്നത്’ എന്നു സന്ദർഭത്തിൽ സൂചിതമായ ക്രിയ ചേർത്തു; ചേർക്കൽ അടിക്കുറിപ്പിൽ അറിയിച്ചു.
  alternative: ‘നിങ്ങളുടെ മക്കളല്ല...’ എന്നു ക്രിയ ചേർക്കാതെ നൽകുക.
  rationale: മലയാളത്തിൽ വാക്യം ഗ്രഹിക്കാവുന്നതാക്കുന്നതിനൊപ്പം, മോശ നേരിട്ടു അഭിസംബോധന ചെയ്യുന്ന സാക്ഷിതലമുറയും അവരുടെ മക്കളും തമ്മിലുള്ള വ്യത്യാസം വ്യക്തമാക്കുന്നു; മൂലത്തിലെ അപൂർണ്ണത മറച്ചുവയ്ക്കാതെ അടിക്കുറിപ്പ് നൽകുന്നു.
- issue: מוּסַר എന്ന പദത്തിന്റെ പരിധി
  choice: ശിക്ഷണം
  alternative: ശിക്ഷ / പ്രബോധനം / തിരുത്തൽ
  rationale: യഹോവയുടെ പ്രവൃത്തികളിലുള്ള തിരുത്തൽപരവും രൂപപ്പെടുത്തുന്നതുമായ വശങ്ങൾ ഒരുമിച്ച് നിലനിർത്തി, അതിനെ ശിക്ഷയിലേക്കോ ഉപദേശത്തിലേക്കോ മാത്രം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ദൈവത്തെ സൂചിപ്പിക്കാൻ ആദരസൂചകമായ ‘അവിടുത്തെ’ ഉപയോഗിച്ചു. അടുത്ത വാക്യത്തിലേക്ക് വ്യാകരണപരമായി നീളുന്ന പട്ടികയായതിനാൽ അവസാനം ദീർഘവിരാമചിഹ്നം നിലനിർത്തി.
