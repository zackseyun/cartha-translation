source:
  edition: WLC
  text: וְ/אָ֣הַבְתָּ֔ אֵ֖ת יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/שָׁמַרְתָּ֣ מִשְׁמַרְתּ֗/וֹ וְ/חֻקֹּתָ֧י/ו וּ/מִשְׁפָּטָ֛י/ו וּ/מִצְוֺתָ֖י/ו כָּל הַ/יָּמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/001.yaml
  text: Therefore you shall love Yahweh your God and keep his charge[a], his statutes, his judgments[b], and his commandments all your days.
translation:
  language: ml
  text: അതിനാൽ[a] നീ നിന്റെ ദൈവമായ യഹ്‌വേയെ സ്നേഹിക്കുകയും, അവൻ ഏല്പിച്ച ചുമതലയും അവന്റെ ചട്ടങ്ങളും വിധികളും കൽപ്പനകളും നിന്റെ ആയുഷ്കാലമെല്ലാം പാലിക്കുകയും വേണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: വാക്യാരംഭത്തിലെ എബ്രായ ബന്ധകപദം ലളിതമായി ‘കൂടാതെ’ അല്ലെങ്കിൽ ‘എന്നും’ എന്നും പരിഭാഷപ്പെടുത്താം; ഇവിടെ മുൻസന്ദർഭത്തിൽനിന്നുള്ള നിഗമനം സൂചിപ്പിക്കുന്നതായി എടുത്തിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אָהַבְתָּ
  choice: അതിനാൽ ... സ്നേഹിക്കുകയും വേണം
  rationale: אָהַב എന്നതിന് ‘സ്നേഹിക്കുക’ എന്നാണ് അർഥം. വാക്യാരംഭത്തിലെ וְ മുൻസന്ദർഭത്തിൽനിന്നുള്ള നിഗമനബന്ധം സൂചിപ്പിക്കുന്നതായി എടുത്ത് സ്വാഭാവിക മലയാളത്തിൽ ‘അതിനാൽ’ എന്നു പരിഭാഷപ്പെടുത്തി; ‘എന്നും/കൂടാതെ’ എന്ന വായന അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ ഉച്ചാരണസൗകര്യമുള്ള വിധത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: രണ്ടാം പുരുഷ ഏകവചന പ്രത്യയം ഉൾക്കൊള്ളുന്ന ‘നിന്റെ ദൈവം’ എന്ന ഉടമ്പടിബന്ധം സ്വാഭാവികമായ മലയാള വാക്യഘടനയിൽ പ്രകടമാക്കുന്നു.
- source_word: וְ/שָׁמַרְתָּ
  choice: പാലിക്കുകയും വേണം
  rationale: שׁמר എന്നതിന് ഈ നിയമപരവും ഉടമ്പടിപരവുമായ സന്ദർഭത്തിൽ ‘പാലിക്കുക’ എന്നത് സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: מִשְׁמַרְתּוֹ
  choice: അവൻ ഏല്പിച്ച കടമ
  rationale: ഈ പദം കാത്തുസൂക്ഷിക്കേണ്ട ചുമതല, ഏല്പിക്കപ്പെട്ട കടമ, ബാധ്യത എന്നിവ സൂചിപ്പിക്കുന്നു. ‘അവന്റെ ചുമതല’ എന്നു പറഞ്ഞാൽ മലയാളത്തിൽ ദൈവത്തിനുള്ള ഉത്തരവാദിത്വം എന്ന തെറ്റിദ്ധാരണ വരാവുന്നതിനാൽ ‘അവൻ ഏല്പിച്ച കടമ’ എന്നു വ്യക്തമാക്കി.
- source_word: חֻקֹּתָיו
  choice: അവന്റെ ചട്ടങ്ങൾ
  rationale: നിയമപരമായ חֻקָּה എന്ന പദത്തെ സമീപപദങ്ങളിൽനിന്ന് വേർതിരിച്ചുകൊണ്ട് ‘ചട്ടങ്ങൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: וּמִשְׁפָּטָיו
  choice: വിധികളും
  rationale: מִשְׁפָּט എന്ന പദത്തിന്റെ വിധി/നിയമവിധി എന്ന അർഥം നിലനിർത്തുകയും ‘ചട്ടങ്ങൾ’, ‘കല്പനകൾ’ എന്നിവയിൽനിന്നുള്ള പദവ്യത്യാസം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: וּמִצְוֺתָיו
  choice: കല്പനകളും
  rationale: מִצְוָה എന്ന സാധാരണ നിയമപദത്തിന് മലയാളത്തിലെ സ്ഥാപിതവും വ്യക്തവുമായ തുല്യപദം ‘കല്പന’ ആണ്.
- source_word: כָּל הַיָּמִים
  choice: നിന്റെ ആയുഷ്കാലമെല്ലാം
  rationale: അക്ഷരാർഥത്തിൽ ‘എല്ലാ ദിവസങ്ങളും.’ വാക്യത്തിലെ രണ്ടാം പുരുഷ ഏകവചന അഭിസംബോധനയോടൊപ്പം അതിന്റെ തുടർച്ചയായ ജീവിതകാലവ്യാപ്തി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: എബ്രായപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നത് മൂലപാഠത്തിലെ ഉടമ്പടിനാമത്തെ സംരക്ഷിക്കുന്നു.
- issue: מִשְׁפָּטָיו എന്ന നിയമപദത്തിന്റെ സൂക്ഷ്മാർഥം
  choice: അവന്റെ വിധികൾ
  alternative: അവന്റെ നിയമനിർദേശങ്ങൾ
  rationale: ‘വിധികൾ’ എന്നത് എബ്രായപദത്തോട് അടുത്തുനിൽക്കുകയും ഈ വാക്യത്തിലെ ചട്ടങ്ങൾ, വിധികൾ, കല്പനകൾ എന്നീ വ്യത്യസ്ത നിയമവിഭാഗങ്ങളെ ഒരൊറ്റ പൊതുപദത്തിലേക്ക് ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. നിയമപദങ്ങളുടെ പരസ്പരവ്യത്യാസം കഴിയുന്നത്ര നിലനിർത്തി; എന്നാൽ ‘അവന്റെ ചുമതല’ സൃഷ്ടിക്കാവുന്ന അർഥഭ്രമം ഒഴിവാക്കാൻ מִשְׁמַרְתּוֹയെ ‘അവൻ ഏല്പിച്ച കടമ’ എന്നു വ്യക്തമാക്കി. ഏകവചന അഭിസംബോധന ‘നിന്റെ’ എന്ന രൂപത്തിൽ സംരക്ഷിച്ചു.
