- from: നിങ്ങളുടെയും നിങ്ങളുടെ പുത്രന്മാരുടെയും ആയുസ്സ്, യഹോവ നിങ്ങളുടെ പിതാക്കന്മാർക്കു കൊടുക്കുമെന്ന് സത്യംചെയ്ത ദേശത്ത്, ഭൂമിക്കുമീതെ ആകാശം നിലനിൽക്കുന്ന കാലത്തോളം[a] ദീർഘമാകേണ്ടതിനാണിത്.[b]
