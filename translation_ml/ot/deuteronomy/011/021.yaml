  yaml_path: translation/ot/deuteronomy/011/021.yaml
  text: so that your days and the days of your sons may be multiplied on the land that Yahweh swore to your fathers to give them[b][a], as the days of the heavens above the earth.
translation:
  language: ml
  text: യഹോവ നിങ്ങളുടെ പിതാക്കന്മാർക്കു നൽകുമെന്ന് സത്യംചെയ്ത ദേശത്ത്, ഭൂമിക്കുമീതെ ആകാശം നിലനിൽക്കുന്ന നാളുകളോളം[a] നിങ്ങളുടെയും നിങ്ങളുടെ പുത്രന്മാരുടെയും[b] ദിവസങ്ങൾ വർധിക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “ഭൂമിക്കുമീതെയുള്ള ആകാശത്തിന്റെ ദിവസങ്ങൾപോലെ.”'
    reason: lexical_alternative
  - marker: b
    text: “പുത്രന്മാർ” എന്നതിന് “മക്കൾ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: ആകേണ്ടതിനാണിത്
  rationale: മുൻകല്പനകളുടെ ഉദ്ദേശ്യവും ഫലവും സൂചിപ്പിക്കുന്നതിനായി മലയാളത്തിൽ സ്വാഭാവികമായ ഉദ്ദേശ്യപ്രയോഗം ഉപയോഗിച്ചു.
- source_word: יִרְבּוּ יְמֵיכֶם וִימֵי בְנֵיכֶם
  choice: നിങ്ങളുടെയും നിങ്ങളുടെ പുത്രന്മാരുടെയും ആയുസ്സ് ... ദീർഘമാകുക
  rationale: ‘ദിവസങ്ങൾ പെരുകുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം ദീർഘായുസ്സാണ്; വാക്കുപ്രതി അസ്വാഭാവികത ഒഴിവാക്കി അർഥം വ്യക്തമായി നൽകി.
- source_word: בְנֵיכֶם
  choice: നിങ്ങളുടെ പുത്രന്മാർ
  rationale: എബ്രായത്തിലെ വ്യാകരണപരമായി പുല്ലിംഗ ബഹുവചനമായ ‘പുത്രന്മാർ’ എന്ന രൂപം നിലനിർത്തി; വിശാലമായ ‘മക്കൾ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
- source_word: עַל הָאֲדָמָה
  choice: ദേശത്ത്
  rationale: ആവർത്തനപുസ്തകത്തിലെ വാഗ്ദത്തദേശസന്ദർഭത്തിൽ אֲדָמָה ഭൂമിയെയോ മണ്ണിനെയോക്കാൾ ‘ദേശം’ എന്നർഥത്തിലാണ്; മലയാളത്തിലെ സ്ഥിതിസൂചനയ്ക്ക് ‘-ത്ത്’ സ്വാഭാവികം.
- source_word: נִשְׁבַּע יְהוָה
  choice: യഹോവ ... സത്യംചെയ്ത
  rationale: ദൈവനാമം ലിപ്യന്തരണം ചെയ്തു; ഉടമ്പടി-ശപഥത്തിന്റെ ശക്തി ‘സത്യംചെയ്ത’ എന്നതിലൂടെ നിലനിർത്തി.
- source_word: לַאֲבֹתֵיכֶם
  choice: നിങ്ങളുടെ പിതാക്കന്മാർക്ക്
  rationale: കുടുംബപരവും ഉടമ്പടിപരവുമായ മൂലപദത്തിന്റെ പ്രത്യേകത നിലനിർത്തുന്നു.
- source_word: לָתֵת לָהֶם
  choice: അവർക്കു കൊടുക്കുമെന്ന്
  rationale: മലയാളത്തിലെ പരോക്ഷവചനഘടനയിൽ ശപഥത്തിന്റെ ഉള്ളടക്കം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ‘അവർക്ക്’ എന്ന സർവനാമം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: כִּימֵי הַשָּׁמַיִם עַל הָאָרֶץ
  choice: ഭൂമിക്കുമീതെ ആകാശം നിലനിൽക്കുന്ന കാലത്തോളം
  rationale: പദാനുപദമായ ‘ആകാശത്തിന്റെ ദിവസങ്ങൾപോലെ’ എന്ന അസ്വാഭാവികത ഒഴിവാക്കി, ദീർഘസ്ഥായിത്വം സൂചിപ്പിക്കുന്ന എബ്രായ ഉപമയും ആകാശം-ഭൂമി ദൃശ്യവും സംരക്ഷിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- issue: בְנֵיכֶם എന്ന പദത്തിലെ ലിംഗസൂചന
  choice: നിങ്ങളുടെ പുത്രന്മാർ
  alternative: നിങ്ങളുടെ മക്കൾ
  rationale: മൂലപാഠത്തിലെ വ്യക്തമായ പുല്ലിംഗരൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തി; സന്ദർഭത്തിൽ സന്തതികളെ പൊതുവായി സൂചിപ്പിക്കാവുന്ന സാധ്യത അടിക്കുറിപ്പിൽ അറിയിച്ചു.
- issue: כִּימֵי הַשָּׁמַיִם עַל הָאָרֶץ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: ഭൂമിക്കുമീതെ ആകാശം നിലനിൽക്കുന്ന കാലത്തോളം
  alternative: ഭൂമിക്കുമീതെയുള്ള ആകാശത്തിന്റെ ദിവസങ്ങൾപോലെ
  rationale: ഇത് ദീർഘകാലസ്ഥായിത്വം സൂചിപ്പിക്കുന്ന ഉപമയായിരിക്കാം; അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകി, കൂടുതൽ രൂപപരമായ വായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. വാക്യത്തിന്റെ ദീർഘഘടന വായനാസൗകര്യത്തിനായി പുനഃക്രമീകരിച്ചെങ്കിലും ഉദ്ദേശ്യം, വാഗ്ദത്തദേശം, ശപഥം, പിതാക്കന്മാർ, സന്തതി, ദീർഘസ്ഥായിത്വം എന്നീ ഘടകങ്ങൾ എല്ലാം നിലനിർത്തി.
