  yaml_path: translation/ot/deuteronomy/011/020.yaml
  text: And you shall write them on the doorposts of your house and on your gates[a][b].
translation:
  language: ml
  text: അവയെ നിന്റെ വീടിന്റെ വാതിൽക്കട്ടിളകളിന്മേലും നിന്റെ കവാടങ്ങളിന്മേലും എഴുതണം.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വാതിൽച്ചട്ടങ്ങളിന്മേൽ.’ എബ്രായപദം വാതിലിന്റെ ഇരുവശത്തുമുള്ള കട്ടിളകളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘നിന്റെ കവാടങ്ങളുടെ സമീപത്തും.’ എബ്രായപ്രയോഗം കവാടങ്ങളെത്തന്നെയോ അവയോടു ചേർന്ന പ്രവേശനസ്ഥലത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְתַבְתָּם
  choice: അവയെ ... എഴുതണം
  rationale: സംയോജകപ്രത്യയത്തോടുകൂടിയ ഖാൽ പൂർണക്രിയ ഇവിടെ മുമ്പുള്ള ഉടമ്പടികല്പനകളുടെ തുടർച്ചയായി നിർദേശാത്മക ബലം വഹിക്കുന്നു. മൂന്നാം പുരുഷ ബഹുവചന കർമപ്രത്യയം മുമ്പ് പറഞ്ഞ വചനങ്ങളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അവയെ’ എന്നു നിലനിർത്തി.
- source_word: עַל
  choice: മേൽ
  rationale: ഒരു ഉപരിതലത്തിൽ എഴുതിവെക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ലളിതവും സ്വാഭാവികവുമായ സമാനപദം.
- source_word: מְזוּזוֹת
  choice: വാതിൽക്കട്ടിളകൾ
  rationale: പ്രവേശനവാതിലിന്റെ ഇരുവശത്തുമുള്ള കട്ടിളകളെയാണ് എബ്രായ നാമം സൂചിപ്പിക്കുന്നത്. പിൽക്കാല യഹൂദ ആചാരവുമായി ബന്ധപ്പെട്ട ലിപ്യന്തരണം ഒഴിവാക്കി സാധാരണ അർഥം നേരിട്ട് നൽകി.
- source_word: בֵּיתֶךָ
  choice: നിന്റെ വീടിന്റെ
  rationale: בַּיִת എന്ന പദത്തിന്റെ മൂർത്തമായ ‘വീട്’ എന്ന അർഥവും കുടുംബ-ഉടമ്പടി പശ്ചാത്തലവും സംരക്ഷിക്കുന്നു.
- source_word: וּבִשְׁעָרֶיךָ
  choice: നിന്റെ പടിവാതിലുകളിന്മേലും
  rationale: שַׁעַר സാധാരണയായി സ്വത്തിന്റെയോ പാർപ്പിടകേന്ദ്രത്തിന്റെയോ പ്രവേശനകവാടത്തെ സൂചിപ്പിക്കുന്നു. ബഹുവചനവും ആവർത്തിച്ച സ്ഥാനസൂചനയും വിവർത്തനത്തിൽ നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കല്പനാശൈലി ഉപയോഗിച്ചു. ‘എഴുതണം’ എന്ന രൂപം നിർദേശാത്മക ബലം വ്യക്തമാക്കുന്നു; മൂലത്തിലെ ഏകവചന അഭിസംബോധന ‘നിന്റെ’ എന്നതിലൂടെ സംരക്ഷിച്ചു. യഥാർഥമായ സ്ഥാനസംബന്ധമായ അർഥവ്യാപ്തി അടിക്കുറിപ്പുകളിൽ നിലനിർത്തി.
