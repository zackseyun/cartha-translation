language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶת אֹֽתֹתָי/ו֙ וְ/אֶֽת מַעֲשָׂ֔י/ו אֲשֶׁ֥ר עָשָׂ֖ה בְּ/ת֣וֹךְ מִצְרָ֑יִם לְ/פַרְעֹ֥ה מֶֽלֶךְ מִצְרַ֖יִם וּ/לְ/כָל אַרְצֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/003.yaml
  text: and his signs and his deeds that he did in the midst of Egypt[c][b][a], to Pharaoh king of Egypt and to all his land—
translation:
  language: ml
  text: അവിടുന്ന് ഈജിപ്തിന്റെ നടുവിൽവെച്ച് ഈജിപ്തിലെ രാജാവായ ഫറവോനോടും അവന്റെ ദേശമാകെയോടും ചെയ്ത തന്റെ അടയാളങ്ങളും പ്രവൃത്തികളും—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹתֹתָיו
  choice: തന്റെ അടയാളങ്ങൾ
  rationale: אוֹת എന്ന പദത്തിന്റെ അടിസ്ഥാനാർഥമായ അടയാളം/ചിഹ്നം നിലനിർത്തുന്നു; അത്ഭുതസ്വഭാവം സന്ദർഭത്തിൽ വ്യക്തമായതിനാൽ ‘അത്ഭുതങ്ങൾ’ എന്ന് വ്യാഖ്യാനിച്ചു ചുരുക്കുന്നില്ല.
- source_word: מַעֲשָׂיו
  choice: തന്റെ പ്രവൃത്തികൾ
  rationale: מַעֲשֶׂה എന്നത് ചെയ്ത കാര്യം, പ്രവൃത്തി എന്നീ അർഥങ്ങളിലാണ്; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ രൂപം.
- source_word: אֲשֶׁר עָשָׂה
  choice: അവിടന്ന് ചെയ്ത
  rationale: ബന്ധവാക്യം അടയാളങ്ങളെയും പ്രവൃത്തികളെയും വിശേഷിപ്പിക്കുന്നു. ദൈവത്തെ സൂചിപ്പിക്കുന്ന കർത്താവിന് ആദരസൂചകമായ ‘അവിടന്ന്’ ഉപയോഗിച്ചു.
- source_word: בְּתוֹךְ מִצְרַיִם
  choice: ഈജിപ്തിന്റെ നടുവിൽവെച്ച്
  rationale: בְּתוֹךְ എന്നതിലെ ‘നടുവിൽ/ഉള്ളിൽ’ എന്ന സ്ഥലപരമായ ഊന്നൽ സാധാരണ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לְפַרְעֹה
  choice: ഫറവോനോട്
  rationale: לְ എന്നതിന്റെ വിശാലമായ ലക്ഷ്യ/ബന്ധ അർഥം ഔപചാരികമായി നിലനിർത്തുന്നു; ന്യായവിധിയുടെ പശ്ചാത്തലം ഉണ്ടായാലും ‘എതിരായി’ എന്ന് പാഠത്തിൽ ചേർത്ത് വ്യാഖ്യാനം ഉറപ്പിക്കുന്നില്ല.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: ഈജിപ്തുരാജാവ്
  rationale: ഹീബ്രായ നിർമിതബന്ധത്തിന്റെ നേരിട്ടുള്ള, മലയാളത്തിൽ സ്വാഭാവികമായ പരിഭാഷ.
- source_word: וּלְכָל אַרְצוֹ
  choice: അവന്റെ ദേശം മുഴുവനോടും
  rationale: אֶרֶץ എന്നതിന്റെ വിശാലമായ ഭൂപ്രദേശാർഥം ‘ദേശം’ നിലനിർത്തുന്നു; כָּל എന്ന സമഗ്രത ‘മുഴുവൻ’ വ്യക്തമാക്കുന്നു.
- source_word: וְאֶת ... וְאֶת
  choice: '... അടയാളങ്ങളും പ്രവൃത്തികളും'
  rationale: אֵת മലയാളത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്താനാവില്ല; രണ്ടു കർമങ്ങളുടെയും ഏകോപനം ‘-കളും ... -കളും’ എന്ന ഘടനയിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: לְ എന്ന ഉപസർഗം ഫറവോനോടും ദേശത്തോടും ദൈവിക പ്രവൃത്തികളുടെ ബന്ധം എങ്ങനെ സൂചിപ്പിക്കുന്നു
  choice: ഫറവോനോടും ... ദേശം മുഴുവനോടും
  alternative: ഫറവോനും ... ദേശം മുഴുവനും എതിരായി
  rationale: സന്ദർഭം ന്യായവിധിയുടേതാണെങ്കിലും ഹീബ്രായ לְ അക്ഷരാർഥത്തിൽ വിശാലമാണ്. മുഖ്യപാഠം ഈ തുറന്ന സ്വഭാവം കാത്തുസൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഇത് മുൻവാക്യത്തിലെ കർമനിരയുടെ തുടർച്ചയായതിനാൽ വാക്യാവസാനത്തിൽ ദീർഘവിരാമചിഹ്നം നിലനിർത്തി. ‘അവിടന്ന്’ ദൈവത്തെ ആദരപൂർവം പരാമർശിക്കുമ്പോഴും പാഠത്തിൽ ഇല്ലാത്ത ദൈവനാമം ചേർക്കുന്നില്ല.
