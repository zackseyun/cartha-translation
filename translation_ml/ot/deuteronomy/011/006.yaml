base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/006.yaml
  text: and what he did to Dathan and Abiram[a], sons of Eliab son of Reuben—how the earth opened its mouth and swallowed them, their households, their tents, and every living thing at their feet[b], in the midst of all Israel.
translation:
  language: ml
  text: രൂബേന്റെ മകനായ എലീയാബിന്റെ പുത്രന്മാരായ ദാഥാനോടും അബീരാമിനോടും അവൻ ചെയ്തതും—ഭൂമി തന്റെ വായ് തുറന്ന് അവരെയും അവരുടെ വീടുകളെയും[a] അവരുടെ കൂടാരങ്ങളെയും അവരുടെ കാൽക്കൽ ഉണ്ടായിരുന്ന സകലത്തെയും[b] മുഴുവൻ യിസ്രായേലിന്റെ മധ്യത്തിൽവെച്ച് വിഴുങ്ങിയതും—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പദശഃ ‘അവരുടെ വീടുകൾ.’ എബ്രായപദം ഭൗതികമായ വീടുകളെയോ, കൂടുതൽ വിശാലമായി അവരുടെ കുടുംബങ്ങളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: പദശഃ ‘അവരുടെ കാൽക്കൽ ഉണ്ടായിരുന്ന സകല യെകൂമും.’ ഈ അപൂർവ എബ്രായപദപ്രയോഗം അവരോടൊപ്പമുണ്ടായിരുന്നതോ അവരുടേതായിരുന്നതോ ആയ ആളുകൾ, ജീവജാലങ്ങൾ, വസ്തുവകകൾ എന്നിവയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשָׂה
  choice: ചെയ്തത്
  rationale: സന്ദർഭത്തിലെ ദൈവിക പ്രവൃത്തിയെ വ്യാഖ്യാനിച്ച് വിപുലീകരിക്കാതെ, സാധാരണവും നേരിട്ടുള്ളതുമായ അർഥം നിലനിർത്തുന്നു.
- source_word: בְּנֵי אֱלִיאָב בֶּן רְאוּבֵן
  choice: രൂബേന്റെ മകനായ എലീയാബിന്റെ പുത്രന്മാർ
  rationale: എബ്രായത്തിലെ വംശാവലിക്രമം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: פָּצְתָה הָאָרֶץ אֶת־פִּיהָ
  choice: ഭൂമി വായ് പിളർന്ന്
  rationale: ഭൂമി വായ് തുറക്കുന്നു എന്ന സജീവമായ രൂപകം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു; ‘പിളർന്ന്’ സംഭവത്തിന്റെ ശക്തിയും വ്യക്തമാക്കുന്നു.
- source_word: וַתִּבְלָעֵם
  choice: അവരെ വിഴുങ്ങി
  rationale: בלע എന്ന ക്രിയയുടെ ദൃശ്യവും മൂർത്തവുമായ അടിസ്ഥാനാർഥം കൃത്യമായി നൽകുന്നു.
- source_word: בָּתֵּיהֶם
  choice: അവരുടെ കുടുംബങ്ങൾ
  rationale: പദശഃ ‘വീടുകൾ’ എന്നാകാമെങ്കിലും, പിന്നാലെ കൂടാരങ്ങൾ വേർതിരിച്ച് പറയുന്നതിനാൽ ഇവിടെ കുടുംബാംഗങ്ങളെയോ ഗൃഹജനങ്ങളെയോ സൂചിപ്പിക്കാനുള്ള സാധ്യത കൂടുതലാണ്.
- source_word: אָהֳלֵיהֶם
  choice: അവരുടെ കൂടാരങ്ങൾ
  rationale: മരുഭൂമിസന്ദർഭത്തിന് യോജിക്കുന്ന നേരിട്ടുള്ള പരിഭാഷ.
- source_word: כָּל־הַיְקוּם
  choice: സകല സമ്പത്തും
  rationale: יְקוּם എന്ന അപൂർവ നാമം ഇവിടെ അവരോടൊപ്പമുണ്ടായിരുന്ന ആളുകളെയും ജീവജാലങ്ങളെയും വസ്തുവകകളെയും ഉൾക്കൊള്ളാവുന്നതാണ്; ‘സമ്പത്ത്’ ഉടമസ്ഥതയിലുള്ളതെല്ലാം എന്ന വിശാലാർഥത്തിൽ ഉപയോഗിക്കുന്നു, എന്നാൽ പദത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר בְּרַגְלֵיהֶם
  choice: അവരുടെ കാൽക്കലുണ്ടായിരുന്ന
  rationale: ‘അവരുടെ കാലുകളിൽ/കാൽക്കൽ’ എന്ന എബ്രായപ്രയോഗത്തിന്റെ ദൃശ്യരൂപം നിലനിർത്തി, അവരോടൊപ്പം ഉണ്ടായിരുന്നതോ അവർക്കു കീഴിലുള്ളതോ എന്ന സാധ്യത തുറന്നുവയ്ക്കുന്നു.
- source_word: בְּקֶרֶב כָּל־יִשְׂרָאֵל
  choice: മുഴുവൻ യിസ്രായേലിന്റെയും മധ്യത്തിൽവെച്ച്
  rationale: സംഭവം സമൂഹത്തിന്റെ നടുവിൽ പരസ്യമായി നടന്നുവെന്ന സ്ഥലപരമായ ആശയം അടുത്തായി സംരക്ഷിക്കുന്നു.
