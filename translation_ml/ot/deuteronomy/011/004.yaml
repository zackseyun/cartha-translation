source:
  edition: WLC
  text: וַ/אֲשֶׁ֣ר עָשָׂה֩ לְ/חֵ֨יל מִצְרַ֜יִם לְ/סוּסָ֣י/ו וּ/לְ/רִכְבּ֗/וֹ אֲשֶׁ֨ר הֵצִ֜יף אֶת מֵ֤י יַם סוּף֙ עַל פְּנֵי/הֶ֔ם בְּ/רָדְפָ֖/ם אַחֲרֵי/כֶ֑ם וַ/יְאַבְּדֵ֣/ם יְהוָ֔ה עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/004.yaml
  text: and what he did to the army of Egypt[a], to its horses and its chariots, when he made the waters of the Red Sea overflow over them as they pursued you, and Yahweh destroyed them to this day,
translation:
  language: ml
  text: ഈജിപ്തിന്റെ സൈന്യത്തോടും അതിന്റെ കുതിരകളോടും രഥങ്ങളോടും അവൻ ചെയ്തതും, അവർ നിങ്ങളെ പിന്തുടർന്നപ്പോൾ ചെങ്കടലിലെ[a] വെള്ളം അവരുടെമേൽ കവിഞ്ഞൊഴുകാൻ ഇടയാക്കിയതും, യഹ്‌വെ അവരെ ഇന്നുവരെ ഇല്ലാതാക്കിക്കളഞ്ഞിരിക്കുന്നതും,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു: “ഞാങ്ങണക്കടൽ.” പരമ്പരാഗതമായി “ചെങ്കടൽ” എന്നു പരിഭാഷപ്പെടുത്തുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵיל מִצְרַיִם
  choice: ഈജിപ്തിന്റെ സൈന്യം
  rationale: കുതിരകളും രഥങ്ങളും പരാമർശിക്കുന്ന സൈനികസന്ദർഭത്തിൽ חֵיל എന്നത് സമ്പത്ത് എന്നതിലുപരി സൈന്യം അഥവാ സൈനികശക്തി എന്ന അർഥത്തിലാണ്.
- source_word: לְסוּסָיו וּלְרִכְבּוֹ
  choice: അതിന്റെ കുതിരകളോടും രഥങ്ങളോടും
  rationale: പ്രത്യയങ്ങൾ ഈജിപ്തിനെ ഒരു ദേശീയ ഘടകമായി സൂചിപ്പിക്കുന്നു. רֶכֶב ഏകവചനരൂപത്തിലാണെങ്കിലും ഇവിടെ രഥസേനയെ കൂട്ടമായി സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവികമായ മലയാള ബഹുവചനം ഉപയോഗിച്ചു.
- source_word: הֵצִיף
  choice: കവിഞ്ഞൊഴുകുമാറാക്കി
  rationale: ഹിഫീൽ രൂപത്തിലെ കാരണാർത്ഥം നിലനിർത്തിക്കൊണ്ട് വെള്ളം അവരുടെമേൽ കയറിവരാൻ ദൈവം ഇടയാക്കി എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מֵי יַם סוּף
  choice: ചെങ്കടലിലെ വെള്ളം
  rationale: പരമ്പരാഗതവും മലയാളത്തിൽ സുപരിചിതവുമായ ഭൂമിശാസ്ത്രനാമം മുഖ്യപാഠത്തിൽ നിലനിർത്തി; סוּף എന്ന പദത്തിന്റെ ഞാങ്ങണയുമായുള്ള ബന്ധം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- source_word: עַל־פְּנֵיהֶם
  choice: അവരുടെമേൽ
  rationale: ജലം അവരെ മൂടിക്കൊണ്ട് വന്നതിനെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സന്ദർഭോചിതവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: בְּרָדְפָם אַחֲרֵיכֶם
  choice: അവർ നിങ്ങളെ പിന്തുടർന്നപ്പോൾ
  rationale: בְּ ചേർന്ന ക്രിയാനാമം ഒരേസമയം നടക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ബഹുവചനമായ നിങ്ങളെ എന്ന രൂപവും സംരക്ഷിച്ചു.
- source_word: וַיְאַבְּדֵם
  choice: അവരെ നശിപ്പിച്ച് ... ഇല്ലാതാക്കി
  rationale: אבד എന്ന കാരണാർത്ഥക ക്രിയ അവരെ നാശത്തിലേക്കു കൊണ്ടുവന്നതായി സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള ‘ഇന്നുവരെ’ എന്ന പ്രയോഗം തുടർച്ചയായ നശിപ്പിക്കൽ എന്നു തെറ്റിദ്ധരിക്കാതിരിക്കാൻ ഫലത്തിന്റെ നിലനിൽപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ഹീബ്രു ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ഇന്നുവരെ
  rationale: വിവരണത്തിന്റെ കാലബിന്ദുവരെ നിലനിൽക്കുന്ന ഫലത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരിച്ചു.
- issue: יַם סוּף എന്ന സ്ഥലനാമം
  choice: ചെങ്കടൽ
  alternative: ഞാങ്ങണകളുടെ കടൽ
  rationale: മലയാളത്തിൽ സുപരിചിതമായ പരമ്പരാഗത നാമം മുഖ്യപാഠത്തിൽ ഉപയോഗിച്ചു; ഹീബ്രു പദത്തിന്റെ സുതാര്യമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: עַד הַיּוֹם הַזֶּה നാശക്രിയയോടുള്ള ബന്ധം
  choice: നാശത്തിന്റെ ഫലം ഇന്നുവരെയും നിലനിൽക്കുന്നതായി വ്യക്തമാക്കി
  alternative: യഹ്‌വെ അവരെ ഇന്നുവരെ നശിപ്പിച്ചു
  rationale: അക്ഷരാർഥപരമായ മറ്റൊരു രൂപം ദൈവം അവരെ തുടർച്ചയായി നശിപ്പിച്ചുകൊണ്ടിരുന്നു എന്ന അനാവശ്യ ധാരണ ഉളവാക്കാം; ഹീബ്രു പ്രയോഗത്തിന്റെ സ്ഥിരഫലസൂചനയാണ് ഇവിടെ സ്വാഭാവികം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. വാക്യം ചുറ്റുമുള്ള വാക്യഘടനയുടെ തുടർച്ചയായതിനാൽ ആദ്യത്തിൽ ‘ഈജിപ്തിന്റെ’ എന്നും അവസാനത്തിൽ കോമയും നിലനിർത്തി. ‘നശിപ്പിച്ച് ഇന്നുവരെ ഇല്ലാതാക്കിയതും’ എന്ന രൂപം മൂലത്തിലെ സ്ഥിരഫലസൂചന വ്യക്തമാക്കുമ്പോഴും മലയാളത്തിൽ തുടരുന്ന നാശപ്രവൃത്തി എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
