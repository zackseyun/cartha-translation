source:
  edition: WLC
  text: וְ/נָתַתִּ֧י מְטַֽר אַרְצְ/כֶ֛ם בְּ/עִתּ֖/וֹ יוֹרֶ֣ה וּ/מַלְק֑וֹשׁ וְ/אָסַפְתָּ֣ דְגָנֶ֔/ךָ וְ/תִֽירֹשְׁ/ךָ֖ וְ/יִצְהָרֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/014.yaml
  text: then I will give the rain for your land in its season[a], the early rain and the late rain, and you will gather in your grain, your new wine[c][b], and your oil.
translation:
  language: ml
  text: അപ്പോൾ ഞാൻ നിങ്ങളുടെ ദേശത്തിന് അതിന്റെ സമയത്ത് മഴ നൽകും—മുൻമഴയും പിൻമഴയും[a]. നീ നിന്റെ ധാന്യവും പുതുവീഞ്ഞും[b] ഒലിവെണ്ണയും[c] ശേഖരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആദ്യമഴയും അവസാനമഴയും”; സാധാരണയായി കൃഷിക്കാലത്തിന്റെ തുടക്കത്തിലും അവസാനഘട്ടത്തിലും ലഭിക്കുന്ന മഴകൾ.
    reason: lexical_alternative
  - marker: b
    text: അതായത്, പുതുതായി ഉത്പാദിപ്പിച്ച വീഞ്ഞ്; അല്ലെങ്കിൽ, “വീഞ്ഞ്.”
    reason: lexical_alternative
  - marker: c
    text: ഹീബ്രുവിൽ “എണ്ണ”; ഇവിടെ ഉദ്ദേശിക്കുന്നത് ഒലിവെണ്ണയാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: അപ്പോൾ ഞാൻ നൽകും
  rationale: മുൻവാക്യത്തിലെ നിബന്ധനയ്ക്കു പിന്നാലെയുള്ള ദൈവിക വാഗ്ദാനത്തിന്റെ ഫലക്രമം വ്യക്തമാക്കുന്നു; ഒന്നാംപുരുഷ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: מְטַר אַרְצְכֶם בְּעִתּוֹ
  choice: നിങ്ങളുടെ ദേശത്തിന് അതതു കാലത്ത് മഴ
  rationale: കൃഷിക്കാവശ്യമായ മഴ യോജിച്ച സമയത്ത് ലഭിക്കുന്നതെന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: יוֹרֶה וּמַלְקוֹשׁ
  choice: മുൻമഴയും പിൻമഴയും
  rationale: കൃഷിവർഷത്തിന്റെ ആരംഭത്തിലും അവസാനത്തിലും ലഭിക്കുന്ന രണ്ടു കാലമഴകളുടെ സമയവ്യത്യാസം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: וְאָסַפְתָּ
  choice: അങ്ങനെ നീ ... ശേഖരിക്കും
  rationale: കൃഷിവിളകൾ കൂട്ടിച്ചേർക്കുക എന്ന അടിസ്ഥാന അർഥം സംരക്ഷിക്കുന്നു; ഏകവചന അഭിസംബോധനയും നിലനിർത്തുന്നു.
- source_word: דְגָנֶךָ
  choice: നിന്റെ ധാന്യം
  rationale: വിവിധ ധാന്യവിളകളെ ഉൾക്കൊള്ളുന്ന പൊതുവായതും ആധുനികവുമായ പദം.
- source_word: וְתִירֹשְׁךָ
  choice: പുതുവീഞ്ഞ്
  rationale: തിറോഷ് സാധാരണയായി പുതുതായി ഉത്പാദിപ്പിച്ച വീഞ്ഞിനെ സൂചിപ്പിക്കുന്നു; വെറും ‘വീഞ്ഞ്’ എന്നതിനെക്കാൾ കൃഷിഫലത്തിന്റെ പ്രത്യേകത നിലനിർത്തുന്നു.
- source_word: וְיִצְהָרֶךָ
  choice: എണ്ണ
  rationale: ധാന്യം–വീഞ്ഞ്–എണ്ണ എന്ന പതിവ് കൃഷിഫലത്രയത്തിൽ ഒലിവെണ്ണയാണ് ഉദ്ദേശ്യം; മുഖ്യവാചകത്തിൽ ഹീബ്രുവിന്റെ സംക്ഷിപ്തത നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഉടമ്പടിയുടെ പശ്ചാത്തലത്തിലുള്ള കൃഷിസമൃദ്ധിയുടെ വാഗ്ദാനം
  choice: കാലാനുസൃതമായ മഴയും വിളവുകളും സംബന്ധിച്ച മൂർത്തമായ വാഗ്ദാനമായി പരിഭാഷപ്പെടുത്തി.
  alternative: മഴയെ പ്രധാനമായും ആത്മീയമോ പ്രതീകാത്മകമോ ആയ അനുഗ്രഹമായി വ്യാഖ്യാനിക്കുക.
  rationale: ഹീബ്രു വാചകം ഇസ്രായേലിന് ദേശത്ത് ലഭിക്കുന്ന കൃഷിസംബന്ധമായ അനുഗ്രഹത്തെ നേരിട്ട് വിവരിക്കുന്നു; പിന്നീടുള്ള ദൈവശാസ്ത്രപരമായ അർഥങ്ങൾ മുഖ്യവാചകത്തിൽ ഇറക്കുമതി ചെയ്യരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രുവിലെ ‘നിങ്ങളുടെ ദേശം’ എന്ന ബഹുവചനവും തുടർന്ന് വരുന്ന ‘നീ’ എന്ന സമൂഹത്തെ ഏകവചനമായി അഭിസംബോധന ചെയ്യുന്ന രൂപവും സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
