source:
  edition: WLC
  text: כָּל הַ/מָּק֗וֹם אֲשֶׁ֨ר תִּדְרֹ֧ךְ כַּֽף רַגְלְ/כֶ֛ם בּ֖/וֹ לָ/כֶ֣ם יִהְיֶ֑ה מִן הַ/מִּדְבָּ֨ר וְ/הַ/לְּבָנ֜וֹן מִן הַ/נָּהָ֣ר נְהַר פְּרָ֗ת וְ/עַד֙ הַ/יָּ֣ם הָֽ/אַחֲר֔וֹן יִהְיֶ֖ה גְּבֻלְ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/024.yaml
  text: Every place where the sole of your foot treads will be yours; from the wilderness and Lebanon[a], from the River, the Euphrates River, as far as the western sea, will be your border.
translation:
  language: ml
  text: നിങ്ങളുടെ കാലടിപതിയുന്ന ഓരോ സ്ഥലവും നിങ്ങളുടേതായിരിക്കും; മരുഭൂമി മുതൽ ലെബാനോൻ വരെ, മഹാനദിയായ യൂഫ്രട്ടീസ് മുതൽ പടിഞ്ഞാറൻ കടൽ വരെ[a] നിങ്ങളുടെ അതിരായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘പിന്നിലുള്ള കടൽ’ അഥവാ ‘അവസാനത്തെ കടൽ’; പരമ്പരാഗതമായി മധ്യധരണ്യക്കടൽ എന്നു മനസ്സിലാക്കപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַמָּקוֹם
  choice: ഓരോ സ്ഥലവും
  rationale: വിതരണാർഥത്തിലുള്ള എബ്രായ പ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ ‘ഓരോ സ്ഥലവും’ എന്നു നൽകി.
- source_word: אֲשֶׁר תִּדְרֹךְ כַּף רַגְלְכֶם בּוֹ
  choice: നിങ്ങളുടെ ഉള്ളങ്കാൽ ചവിട്ടുന്ന
  rationale: כַּף רֶגֶל എന്നത് കാലിന്റെ അടിഭാഗത്തെ സൂചിപ്പിക്കുന്നു; דרך എന്ന ക്രിയയുടെ ചവിട്ടുക/കാലുകുത്തുക എന്ന ദൃശ്യഭാവം നിലനിർത്തുന്നു.
- source_word: לָכֶם יִהְיֶה
  choice: നിങ്ങളുടേതായിരിക്കും
  rationale: ഉടമസ്ഥതയെ സൂചിപ്പിക്കുന്ന വാഗ്ദാനസൂത്രം ചുരുക്കവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: מִן הַמִּדְבָּר וְהַלְּבָנוֹן
  choice: മരുഭൂമിമുതൽ ലെബാനോൻവരെയും
  rationale: അതിരുകളുടെ ഭൂമിശാസ്ത്രപരമായ വ്യാപ്തി വ്യക്തമാക്കാൻ എബ്രായത്തിലെ സംയോജിത അതിർത്തിസൂചനയെ മലയാളത്തിൽ സ്വാഭാവികമായ ‘മുതൽ…വരെ’ ഘടനയിൽ നൽകി.
- source_word: מִן הַנָּהָר נְהַר פְּרָת
  choice: നദിയായ യൂഫ്രട്ടീസ് നദിമുതൽ
  rationale: ‘നദി’ എന്ന പൊതുപദത്തെയും അതിനെ തിരിച്ചറിയിക്കുന്ന ‘യൂഫ്രട്ടീസ് നദി’ എന്ന സമാനാധികരണത്തെയും കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: וְעַד הַיָּם הָאַחֲרוֹן
  choice: പടിഞ്ഞാറൻ കടൽവരെയും
  rationale: אַחֲרוֹן അക്ഷരാർഥത്തിൽ ‘പിന്നിലുള്ള/അവസാനത്തെ’ എന്നാണെങ്കിലും കിഴക്കോട്ടു മുഖംതിരിക്കുന്ന എബ്രായ ഭൂമിശാസ്ത്രദിശാബോധത്തിൽ പടിഞ്ഞാറുള്ള കടലിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: יִהְיֶה גְּבֻלְכֶם
  choice: നിങ്ങളുടെ അതിരായിരിക്കും
  rationale: גְּבוּל എന്നതിന്റെ അതിർത്തി/പരിധി എന്ന ഭൂമിശാസ്ത്രാർഥം നേരിട്ട് നൽകുന്നു.
theological_decisions:
- issue: ഭൂവിഭാഗത്തെക്കുറിച്ചുള്ള വാഗ്ദാനഭാഷ
  choice: വാക്യത്തെ ഭൂമിശാസ്ത്രപരമായ അതിർത്തിവാഗ്ദാനമായി നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: ഇത് ആദർശാത്മകമായ അതിർത്തികളാണെന്നോ നിത്യവും നിബന്ധനരഹിതവുമായ കൈവശാവകാശമാണെന്നോ വ്യാഖ്യാനിച്ച് പരിഭാഷപ്പെടുത്തുക.
  rationale: വാക്യം അതിർത്തിവ്യാപ്തി പ്രസ്താവിക്കുന്നു; അതിന്റെ നിവൃത്തിയെയോ പ്രതിരൂപാർഥത്തെയോ കുറിച്ചുള്ള പിന്നീടുള്ള ദൈവശാസ്ത്രവാദങ്ങൾ മൂലപാഠം ഇവിടെ തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ആദ്യ വാഗ്ദാനപ്രസ്താവനയും തുടർന്നുള്ള അതിർത്തിവിവരണവും വേർതിരിക്കാൻ അർധവിരാമം ഉപയോഗിച്ചു.
