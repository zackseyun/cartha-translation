  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הוֹרִ֧ישׁ יְהוָ֛ה אֶת כָּל הַ/גּוֹיִ֥ם הָ/אֵ֖לֶּה מִ/לִּ/פְנֵי/כֶ֑ם וִֽ/ירִשְׁתֶּ֣ם גּוֹיִ֔ם גְּדֹלִ֥ים וַ/עֲצֻמִ֖ים מִ/כֶּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/023.yaml
  text: then Yahweh will drive out all these nations before you, and you will dispossess nations greater and mightier than you.
translation:
  language: ml
  text: അപ്പോൾ യഹ്‌വെ ഈ ജനതകളെയെല്ലാം നിങ്ങളുടെ മുമ്പിൽനിന്ന് പുറത്താക്കും; നിങ്ങളെക്കാൾ വലിയവരും ശക്തരുമായ ജനതകളുടെ അവകാശം നിങ്ങൾ ഇല്ലാതാക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ജനതകളുടെ അവകാശം നിങ്ങൾ ഇല്ലാതാക്കും” എന്നതിന് “ജനതകളെ നിങ്ങൾ കീഴടക്കും” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: וִירִשְׁתֶּם എന്ന ക്രിയയ്ക്ക് ‘കൈവശമാക്കുക’ എന്നും, കർമം ജനതകളാകുമ്പോൾ ‘അവരുടെ കൈവശാവകാശം നഷ്ടപ്പെടുത്തുക’ എന്നും അർഥമുണ്ട്. മലയാളത്തിലെ പ്രധാനപാഠം ജനതകളെ നേരിട്ട് കർമമാക്കുന്ന ഈ സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു; ബദൽ അതിന്റെ സംക്ഷിപ്തമായ സന്ദർഭപരമായ രൂപമാണ്.
lexical_decisions:
- source_word: וְהוֹרִישׁ
  choice: ഓടിച്ചുകളയും
  rationale: ירשׁ എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ കൈവശത്തിൽനിന്ന് നീക്കുക, പുറത്താക്കുക എന്ന കാരണാർഥം നൽകുന്നു. ജയിച്ചടക്കലിന്റെ സന്ദർഭത്തിൽ ‘ഓടിച്ചുകളയും’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേര് കൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ അതിന്റെ പ്രചാരത്തിലുള്ള ശബ്ദലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: כָּל הַגּוֹיִם הָאֵלֶּה
  choice: ഈ ജനതകളെയെല്ലാം
  rationale: גּוֹיִם ഇവിടെ ദേശജയത്തിന്റെ രാഷ്ട്രീയ-ജനവിഭാഗീയ സന്ദർഭത്തിലുള്ള ജനതകളെ സൂചിപ്പിക്കുന്നു.
- source_word: מִלִּפְנֵיכֶם
  choice: നിങ്ങളുടെ മുമ്പിൽനിന്ന്
  rationale: ‘നിങ്ങളുടെ സന്നിധിയിൽനിന്ന്/മുഖത്തുനിന്ന്’ എന്ന അക്ഷരാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി സൂക്ഷിക്കുന്നു.
- source_word: וִירִשְׁתֶּם
  choice: നീക്കി അവരുടെ സ്ഥാനം കൈവശമാക്കും
  rationale: കാലിന്റെ രൂപമായ ירשׁ-ന് കൈവശമാക്കുക എന്നും കൈവശക്കാരെ നീക്കുക എന്നും അർഥസാധ്യതകളുണ്ട്. കർമം ‘ജനതകൾ’ ആയതിനാൽ അവരെ നീക്കുന്നതും അവരുടെ സ്ഥാനം കൈവശമാക്കുന്നതും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: גְּדֹלִים וַעֲצֻמִים מִכֶּם
  choice: നിങ്ങളെക്കാൾ വലിയവരും ശക്തരുമായ
  rationale: מִכֶּם താരതമ്യം വ്യക്തമാക്കുന്നു; גְּדֹלִים വലിപ്പമോ പ്രാധാന്യമോ, עֲצֻמִים ശക്തിയോ പ്രാബല്യമോ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: ഹീബ്രു പാഠം വ്യക്തിനാമം തന്നെയാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്ന് പകരംവയ്ക്കാതെ നാമം ശബ്ദലിപ്യന്തരണം ചെയ്യുന്നു; ‘യഹ്‌വെ’ എന്ന രൂപം സാധ്യതയുള്ള പുരാതന ഉച്ചാരണത്തോട് കൂടുതൽ അടുത്തതാണ്.
- issue: וִירִשְׁתֶּם എന്നതിലെ കൈവശമാക്കൽ/നീക്കൽ അർഥവ്യാപ്തി
  choice: നീക്കി അവരുടെ സ്ഥാനം കൈവശമാക്കും
  alternative: ജനതകളെ പുറത്താക്കും; ജനതകളെ കൈവശമാക്കും
  rationale: വാക്യത്തിലെ കർമം ദേശമല്ല, ജനതകളാണ്. എങ്കിലും ധാതുവിന് കൈവശമാക്കൽ എന്ന അർഥവും ഉള്ളതിനാൽ, ഇരുവശവും ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളരൂപം തെരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ഓടിച്ചുകളയും’ ജയിച്ചടക്കലിന്റെ ശക്തമായ പ്രവർത്തി വ്യക്തമാക്കുന്നു; രണ്ടാം ക്രിയയിൽ ആവർത്തനം ഒഴിവാക്കിക്കൊണ്ട് ഹീബ്രുവിലെ അർഥവ്യാപ്തി സംരക്ഷിച്ചിരിക്കുന്നു.
