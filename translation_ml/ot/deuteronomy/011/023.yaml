    rationale: ‘പുറത്താക്കും’ ഹിഫീൽ രൂപത്തിന്റെ ‘കൈവശം നഷ്ടപ്പെടുത്തിക്കുക/നീക്കുക’ എന്ന അർഥം കൂടുതൽ നിഷ്പക്ഷവും ഔപചാരികവുമായ രീതിയിൽ നൽകുന്നു.
  revised_text: അപ്പോൾ യഹ്‌വെ ഈ ജനതകളെയെല്ലാം നിങ്ങളുടെ മുമ്പിൽനിന്ന് പുറത്താക്കും; നിങ്ങളെക്കാൾ വലിയവരും ശക്തരുമായ ജനതകളുടെ അവകാശം നിങ്ങൾ ഇല്ലാതാക്കും.[a]
  revised_footnotes:
