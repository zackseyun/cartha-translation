  to: അപ്പോൾ യഹ്‌വെ ഈ ജനതകളെയെല്ലാം നിങ്ങളുടെ മുമ്പിൽനിന്ന് പുറത്താക്കും; നിങ്ങളെക്കാൾ വലിയവരും ശക്തരുമായ ജനതകളുടെ അവകാശം നിങ്ങൾ ഇല്ലാതാക്കും.[a]
  rationale: 'പ്രധാനപാഠം ഹീബ്രുവിലെ രണ്ടു ബന്ധപ്പെട്ട ירשׁ-ക്രിയകളുടെ വ്യത്യസ്ത പ്രയോഗം നിലനിർത്തുന്നു: യഹ്‌വെ ജനതകളെ ഇസ്രായേലിന്റെ മുമ്പിൽനിന്ന് പുറത്താക്കുന്നു; ഇസ്രായേൽ ആ ജനതകളുടെ കൈവശാവകാശം ഇല്ലാതാക്കുന്നു. ഇതിലൂടെ ‘അവരുടെ സ്ഥാനം’ എന്ന ചേർത്തുവായന ഒഴിവാക്കുകയും വിവാദമില്ലാത്ത അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുകയും ചെയ്യുന്നു.'
