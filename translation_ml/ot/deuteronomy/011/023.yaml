  source_fidelity: ആദ്യക്രിയയായ וְהוֹרִישׁ ഹിഫീൽ രൂപത്തിന്റെ ‘പുറത്താക്കുക/കൈവശം നഷ്ടപ്പെടുത്തിക്കുക’ എന്ന അർഥവും, രണ്ടാം ക്രിയയായ וִירִשְׁתֶּם ജനതകളെ കർമമാക്കുന്ന ‘കൈവശം നഷ്ടപ്പെടുത്തുക/അവകാശം ഇല്ലാതാക്കുക’ എന്ന അർഥവും വേർതിരിച്ചു നിലനിർത്തണം. നിലവിലെ ‘നീക്കി അവരുടെ സ്ഥാനം കൈവശമാക്കും’ എന്നത് ഹീബ്രുവിൽ ഇല്ലാത്ത ‘അവരുടെ സ്ഥാനം’ ചേർക്കുകയും രണ്ടു ആശയങ്ങളെ ഒരു വിപുലീകരണമായി മാറ്റുകയും ചെയ്യുന്നു.
  naturalness: ‘നിങ്ങളെക്കാൾ വലിയവരും ശക്തരുമായ ജനതകളുടെ അവകാശം നിങ്ങൾ ഇല്ലാതാക്കും’ ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്. ‘ഓടിച്ചുകളയും’ എന്നതിനേക്കാൾ ‘പുറത്താക്കും’ ഇവിടെ ഔപചാരികവും ഹിഫീൽ ക്രിയയുടെ കൈവശം നഷ്ടപ്പെടുത്തിക്കുന്ന ആശയത്തോട് കൂടുതൽ നേരിട്ടുമാണ്.
  terminology: യഹ്‌വെ എന്ന നാമലിപ്യന്തരണം ഉചിതമാണ്. גּוֹיִם-ന് ‘ജനതകൾ’, גְּדֹלִים-ന് ‘വലിയവർ’, עֲצֻמִים-ന് ‘ശക്തർ’ എന്നിവ യോജിച്ചിരിക്കുന്നു.
  issues:
  - severity: medium
    issue: രണ്ടാം ക്രിയയുടെ വിവർത്തനം ഹീബ്രുവിൽ ഇല്ലാത്ത ‘അവരുടെ സ്ഥാനം’ ചേർക്കുന്നു.
