source:
  edition: WLC
  text: כִּ֤י עֵֽינֵי/כֶם֙ הָֽ/רֹאֹ֔ת אֶת כָּל מַעֲשֵׂ֥ה יְהוָ֖ה הַ/גָּדֹ֑ל אֲשֶׁ֖ר עָשָֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/007.yaml
  text: For your own eyes have seen all the great work of Yahweh that he did[a].
translation:
  language: ml
  text: കാരണം, യഹ്‌വെ ചെയ്ത മഹത്തായ പ്രവൃത്തിയൊക്കെയും നിങ്ങളുടെ കണ്ണുകൾതന്നെ കണ്ടിരിക്കുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘നിങ്ങളുടെ കണ്ണുകൾ—കാണുന്നവ’; അവർ നേരിട്ടു കണ്ട ദൃക്‌സാക്ഷികളാണെന്നതിന് ഊന്നൽ നൽകുന്ന പ്രയോഗം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ ആഹ്വാനത്തിന് അടിസ്ഥാനമോ വിശദീകരണമോ നൽകുന്ന ബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: עֵינֵיכֶם הָרֹאֹת
  choice: കണ്ടത് നിങ്ങളുടെ സ്വന്തം കണ്ണുകളാണ്
  rationale: ‘നിങ്ങളുടെ കണ്ണുകൾ—കാണുന്നവ’ എന്ന അടയാളപ്പെടുത്തിയ എബ്രായ ഘടനയുടെ ദൃക്‌സാക്ഷി ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായ കേന്ദ്രീകരണവാക്യത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: אֶת כָּל מַעֲשֵׂה
  choice: പ്രവൃത്തിയെല്ലാം
  rationale: ഏകവചനമായ ‘പ്രവൃത്തി’ ദൈവം ചെയ്തതിന്റെ സമഗ്രതയെ സൂചിപ്പിക്കുന്നു; ‘എല്ലാം’ എന്ന ആശയം ചേർത്ത് ആ കൂട്ടായ അർഥം നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ശീർഷകം പകരംവയ്ക്കാതെ ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: הַגָּדֹל
  choice: മഹത്തായ
  rationale: പ്രവൃത്തിയുടെ വലിപ്പവും പ്രാധാന്യവും നേരിട്ട് സൂചിപ്പിക്കുന്നു; ‘ശക്തമായ’ എന്ന വ്യാഖ്യാനാത്മക അർഥം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: אֲשֶׁר עָשָׂה
  choice: ചെയ്ത
  rationale: എബ്രായത്തിലെ ലളിതമായ ബന്ധവാക്യവും പൂർത്തിയായ പ്രവർത്തിയും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ ശീർഷകമായ ‘കർത്താവ്’ കൊണ്ട് പകരംവയ്ക്കാതെ ദൈവനാമം ലിപ്യന്തരണം ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ദൃക്‌സാക്ഷിത്വത്തിന്റെ ഊന്നൽ നിലനിർത്താൻ ‘കണ്ടത് നിങ്ങളുടെ സ്വന്തം കണ്ണുകളാണ്’ എന്ന കേന്ദ്രീകരണഘടന ഉപയോഗിച്ചു.
