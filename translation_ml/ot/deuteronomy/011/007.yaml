  to: കാരണം, യഹ്‌വെ ചെയ്ത മഹത്തായ പ്രവൃത്തിയൊക്കെയും നിങ്ങളുടെ കണ്ണുകൾതന്നെ കണ്ടിരിക്കുന്നു[a].
