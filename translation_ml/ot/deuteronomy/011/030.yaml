id: DEU.11.30
reference: Deuteronomy 11:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הֲ/לֹא הֵ֜מָּה בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֗ן אַֽחֲרֵי֙ דֶּ֚רֶךְ מְב֣וֹא הַ/שֶּׁ֔מֶשׁ בְּ/אֶ֨רֶץ֙ הַֽ/כְּנַעֲנִ֔י הַ/יֹּשֵׁ֖ב בָּ/עֲרָבָ֑ה מ֚וּל הַ/גִּלְגָּ֔ל אֵ֖צֶל אֵלוֹנֵ֥י מֹרֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/030.yaml
  text: Are they not beyond the Jordan[a], behind the way of the setting sun, in the land of the Canaanites who dwell in the Arabah, opposite Gilgal[c][b], beside the oaks of Moreh?
translation:
  language: ml
  text: അവ യോർദാനക്കരെ[a], സൂര്യൻ അസ്തമിക്കുന്ന ദിക്കിലേക്കുള്ള വഴിക്കപ്പുറം[b], അരാബയിൽ വസിക്കുന്ന കനാന്യരുടെ ദേശത്ത്, ഗിൽഗാലിന് എതിർവശത്ത്, മോരെയിലെ കരുവേലകങ്ങളുടെ[c] സമീപത്തല്ലയോ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യോർദാന്റെ മറുകരയിൽ.’ എബ്രായത്തിലെ ഈ ഭൂമിശാസ്ത്രപ്രയോഗത്തിന്റെ കൃത്യമായ ദിശാഭാവം സംസാരിക്കുന്നയാളുടെ കാഴ്ചസ്ഥാനത്തെ ആശ്രയിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘സൂര്യൻ പ്രവേശിക്കുന്നതിന്റെ വഴിക്കു പിന്നിൽ’; അതായത്, പടിഞ്ഞാറോട്ട്.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘മോരെയിലെ ടെരിബിന്ത് വൃക്ഷങ്ങളുടെ.’ എബ്രായപദം കരുവേലകത്തെയോ ടെരിബിന്ത് വൃക്ഷത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא הֵמָּה
  choice: അവ ... അല്ലയോ?
  rationale: മുൻവാക്യത്തിലെ രണ്ടു പർവതങ്ങളെ സൂചിപ്പിക്കുന്ന ബഹുവചന സർവനാമവും സമ്മതാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്ന അലങ്കാരചോദ്യവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: യോർദാനക്കരെ
  rationale: കാഴ്ചസ്ഥാനത്തെ ആശ്രയിച്ച് ‘യോർദാന്റെ അപ്പുറം/മറുകരയിൽ’ എന്നർഥമാകാവുന്ന എബ്രായ ഭൂമിശാസ്ത്രപ്രയോഗം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: אַחֲרֵי דֶּרֶךְ מְבוֹא הַשֶּׁמֶשׁ
  choice: സൂര്യൻ അസ്തമിക്കുന്ന ദിക്കിലേക്കുള്ള വഴിക്കപ്പുറം
  rationale: ‘സൂര്യന്റെ പ്രവേശനം’ എന്ന അസ്തമയസൂചനയും דֶּרֶךְ എന്ന ‘വഴി’യും നിലനിർത്തിക്കൊണ്ട് പടിഞ്ഞാറോട്ടുള്ള ദിശാബോധം സ്വാഭാവികമായി നൽകുന്നു; കൃത്യബന്ധത്തിലെ അസ്പഷ്ടത അതിയായി പരിഹരിക്കുന്നില്ല.
- source_word: בְּאֶרֶץ הַכְּנַעֲנִי
  choice: കനാന്യരുടെ ദേശത്ത്
  rationale: എബ്രായത്തിലെ സമൂഹവാചക ഏകവചന ജനനാമം മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചനമായി നൽകുന്നു.
- source_word: הַיֹּשֵׁב בָּעֲרָבָה
  choice: അരാബയിൽ വസിക്കുന്ന
  rationale: അരാബയെ പൊതുവായ ‘സമതലം’ എന്നു മാറ്റാതെ ഭൂമിശാസ്ത്രനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: מוּל הַגִּלְגָּל
  choice: ഗിൽഗാലിന് എതിർവശത്ത്
  rationale: നേരിട്ടുള്ള സ്ഥാനബന്ധം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: אֵצֶל אֵלוֹנֵי מֹרֶה
  choice: മോരെയിലെ കരുവേലകങ്ങളുടെ സമീപത്ത്
  rationale: സാമീപ്യം വ്യക്തമാക്കുന്നു; אֵלוֹן എന്ന വൃക്ഷനാമത്തിന്റെ സസ്യശാസ്ത്രപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. സ്ഥലനാമങ്ങൾ യോർദാൻ, അരാബ, ഗിൽഗാൽ, മോരെ എന്നിങ്ങനെ ലിപ്യന്തരിച്ചു. മൂലത്തിലെ അലങ്കാരചോദ്യവും ഭൂമിശാസ്ത്രപരവും സസ്യശാസ്ത്രപരവുമായ അനിശ്ചിതത്വങ്ങളും നിലനിർത്തി.
