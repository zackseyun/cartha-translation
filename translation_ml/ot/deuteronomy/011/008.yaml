reference: Deuteronomy 11:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּם֙ אֶת כָּל הַ/מִּצְוָ֔ה אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם לְמַ֣עַן תֶּחֶזְק֗וּ וּ/בָאתֶם֙ וִֽ/ירִשְׁתֶּ֣ם אֶת הָ/אָ֔רֶץ אֲשֶׁ֥ר אַתֶּ֛ם עֹבְרִ֥ים שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/008.yaml
  text: So keep every commandment that I am commanding you today[c][b][a], so that you may be strong and go in and possess the land that you are crossing over to possess.
translation:
  language: ml
  text: അതുകൊണ്ട്, ഇന്ന് ഞാൻ നിങ്ങളോടു കൽപ്പിക്കുന്ന എല്ലാ കൽപ്പനകളും നിങ്ങൾ പാലിക്കണം; അങ്ങനെ നിങ്ങൾ ശക്തരാകാനും, നിങ്ങൾ അതു കൈവശമാക്കാൻ കടന്നുചെല്ലുന്ന ദേശത്തു പ്രവേശിച്ച് അതു കൈവശമാക്കാനും കഴിയും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: അതുകൊണ്ട് ... നിങ്ങൾ പ്രമാണിക്കണം
  rationale: നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ പശ്ചാത്തലത്തിൽ שׁמר എന്നതിന് ‘പ്രമാണിക്കുക/അനുസരിക്കുക’ എന്ന അർഥമാണ്. മുൻസന്ദർഭത്തിൽനിന്നുള്ള നിഗമനബന്ധം וּ־യ്ക്ക് ‘അതുകൊണ്ട്’ എന്നു നൽകി.
- source_word: כָּל הַמִּצְוָה
  choice: സകല കല്പനകളും
  rationale: എബ്രായത്തിലെ ഏകവചനമായ ‘കല്പന’ ഇവിടെ കല്പനകളുടെ സമഗ്രതയെ സൂചിപ്പിക്കുന്ന സമൂഹവാചകമാണ്; സ്വാഭാവിക മലയാളത്തിൽ ബഹുവചനമായി നൽകി.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: ഞാൻ ഇന്ന് നിങ്ങളോടു കല്പിക്കുന്ന
  rationale: വർത്തമാനകാല പങ്കാളിവിനയുടെ സജീവമായ ഇപ്പോഴത്തെ ബലം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു. ഏകവചന പ്രത്യയം ജനമായ ഇസ്രായേലിനെ സമൂഹമായി അഭിസംബോധന ചെയ്യുന്നു.
- source_word: לְמַעַן
  choice: അങ്ങനെ
  rationale: ഉദ്ദേശ്യം/ഫലം രണ്ടിനും ഇടം നൽകുന്ന സ്വാഭാവിക ബന്ധപദം.
- source_word: תֶּחֶזְקוּ
  choice: നിങ്ങൾ ശക്തരായിത്തീരുകയും
  rationale: חזק എന്ന ക്രിയ ഇവിടെ ശക്തരാകുക എന്ന ആശയം നൽകുന്നു; ശക്തി ലഭിക്കുന്നതെന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: וּבָאתֶם
  choice: പ്രവേശിച്ച്
  rationale: ദേശപ്രവേശനസന്ദർഭത്തിൽ בוא എന്നതിന് ‘പ്രവേശിക്കുക’ എന്നത് സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: וִירִשְׁתֶּם / לְרִשְׁתָּהּ
  choice: കൈവശമാക്കുകയും / കൈവശമാക്കാൻ
  rationale: ירשׁ എന്ന ക്രിയയുടെ ആവർത്തനം മലയാളത്തിലും ഒരേ പദത്തിലൂടെ സൂക്ഷിച്ചു; ദേശത്തെ സ്വന്തമായി കൈവശപ്പെടുത്തുന്ന സന്ദർഭത്തിന് ഇത് യോജിക്കുന്നു.
- source_word: הָאָרֶץ
  choice: ദേശം
  rationale: ആവർത്തനപുസ്തകത്തിലെ വാഗ്ദത്തഭൂമിയുടെ ഭൂമിശാസ്ത്രപരവും ഉടമ്പടിസംബന്ധവുമായ ആശയം ‘ദേശം’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֲשֶׁר אַתֶּם עֹבְרִים שָׁמָּה
  choice: നിങ്ങൾ കൈവശമാക്കാൻ കടന്നുചെല്ലുന്ന
  rationale: യോർദ്ദാൻ കടന്ന് ദേശത്തേക്കു പോകുന്നതിന്റെ ദിശാസൂചന മലയാളത്തിൽ ‘കടന്നുചെല്ലുന്ന’ എന്ന പ്രയോഗത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
theological_decisions:
- issue: ഉടമ്പടിയിലെ സമൂഹാഭിസംബോധനയിൽ ഏകവചനവും ബഹുവചനവും കലരുന്നത്
  choice: മലയാളത്തിൽ ആദരബഹുവചനമായ ‘നിങ്ങൾ’ ഉപയോഗിച്ച് സമൂഹാഭിസംബോധന നിലനിർത്തി
  alternative: ഏകവചന-ബഹുവചന വ്യത്യാസം കൃത്രിമമായി അടയാളപ്പെടുത്തുക
  rationale: എബ്രായത്തിൽ ‘ഞാൻ നിന്നോടു കല്പിക്കുന്നു’ എന്ന ഏകവചനരൂപവും തുടർന്ന് ബഹുവചനക്രിയകളും ഉണ്ട്. മലയാളത്തിലെ ‘നിങ്ങൾ’ വായനാസൗകര്യത്തോടെ ജനസമൂഹത്തോടുള്ള അഭിസംബോധന നിലനിർത്തുന്നു.
- issue: לְמַעַן സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യം-ഫലം ബന്ധം
  choice: ‘അങ്ങനെ ... ചെയ്യും’ എന്നു നൽകി
  alternative: ‘... ചെയ്യേണ്ടതിന്’ എന്ന കർശന ഉദ്ദേശ്യപ്രയോഗം
  rationale: എബ്രായബന്ധപദം ഉദ്ദേശ്യവും പ്രതീക്ഷിതഫലവും ഉൾക്കൊള്ളാം; വിവർത്തനം ഈ ഇരട്ടസാധ്യതയെ അനാവശ്യമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പ്രമാണിക്കുക’, ‘കല്പന’, ‘ദേശം’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന സ്വാഭാവികമാക്കി.
