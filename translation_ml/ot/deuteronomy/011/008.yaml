- from: അതുകൊണ്ട്, ഞാൻ ഇന്ന് നിങ്ങളോടു കല്പിക്കുന്ന സകല കല്പനകളും[a] നിങ്ങൾ പ്രമാണിക്കണം; അങ്ങനെ നിങ്ങൾ ശക്തരായിത്തീരുകയും[b], നിങ്ങൾ കൈവശമാക്കാൻ കടന്നുചെല്ലുന്ന ദേശത്തു പ്രവേശിച്ച് അതു കൈവശമാക്കുകയും[c] ചെയ്യും.
  to: അതുകൊണ്ട്, ഇന്ന് ഞാൻ നിങ്ങളോടു കൽപ്പിക്കുന്ന എല്ലാ കൽപ്പനകളും നിങ്ങൾ പാലിക്കണം; അങ്ങനെ നിങ്ങൾ ശക്തരാകാനും, നിങ്ങൾ അതു കൈവശമാക്കാൻ കടന്നുചെല്ലുന്ന ദേശത്തു പ്രവേശിച്ച് അതു കൈവശമാക്കാനും കഴിയും.
  rationale: The revision restores the purpose force of לְמַעַן through ‘... ആകാനും ... ആക്കാനും കഴിയും,’ while preserving the sequence ‘be strong—enter—possess.’ It also uses the idiomatic collocation ‘കൽപ്പനകൾ പാലിക്കുക.’ Footnote markers may remain attached respectively to ‘കൽപ്പനകളും,’ ‘ശക്തരാകാനും,’ and the first occurrence of ‘കൈവശമാക്കാൻ’ in typesetting.
