source:
  edition: WLC
  text: וְ/שַׂמְתֶּם֙ אֶת דְּבָרַ֣/י אֵ֔לֶּה עַל לְבַבְ/כֶ֖ם וְ/עַֽל נַפְשְׁ/כֶ֑ם וּ/קְשַׁרְתֶּ֨ם אֹתָ֤/ם לְ/אוֹת֙ עַל יֶדְ/כֶ֔ם וְ/הָי֥וּ לְ/טוֹטָפֹ֖ת בֵּ֥ין עֵינֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/018.yaml
  text: So you shall place these words of mine on your heart and on your soul[a], and you shall bind them as a sign on your hand, and they shall be as frontlets between your eyes.
translation:
  language: ml
  text: അതുകൊണ്ട്, എന്റെ ഈ വചനങ്ങൾ നിങ്ങളുടെ ഹൃദയത്തിലും പ്രാണനിലും പതിപ്പിക്കണം. അവയെ നിങ്ങളുടെ കൈമേൽ ഒരു അടയാളമായി കെട്ടണം; അവ നിങ്ങളുടെ കണ്ണുകൾക്കിടയിൽ നെറ്റിപ്പട്ടങ്ങളായി[a] ഇരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഫിലാക്ടറികളായി.’ പിൽക്കാല യഹൂദാചാരത്തിൽ തിരുവെഴുത്തുഭാഗങ്ങൾ സൂക്ഷിച്ച് ധരിച്ചിരുന്ന ചെറിയ പെട്ടികളെയാണ് ഈ പേര് സൂചിപ്പിക്കുന്നത്. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം അപൂർവമായതിനാൽ അതിന്റെ കൃത്യമായ അർഥസൂക്ഷ്മത അനിശ്ചിതമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתֶּם
  choice: അതുകൊണ്ട് ... പതിപ്പിക്കണം
  rationale: שׂים എന്നത് അടിസ്ഥാനമായി ‘വെക്കുക, സ്ഥാപിക്കുക’ എന്നാണ്. ഹൃദയത്തിലും പ്രാണനിലും വചനങ്ങൾ വെക്കുന്നതെന്ന എബ്രായ രൂപകം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്താൻ ‘പതിപ്പിക്കണം’ എന്നു നൽകി; וְ എന്ന തുടർച്ചാസൂചകം മുൻസന്ദർഭവുമായി ബന്ധിപ്പിച്ച് ‘അതുകൊണ്ട്’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: דְּבָרַי אֵלֶּה
  choice: എന്റെ ഈ വചനങ്ങൾ
  rationale: ഒന്നാംപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയം വ്യക്തമായി നിലനിർത്തുന്നു. ‘വചനങ്ങൾ’ ആധുനികവും ഗൗരവമുള്ളതുമായ ബൈബിൾ ഭാഷാപ്രയോഗമാണ്.
- source_word: עַל לְבַבְכֶם וְעַל נַפְשְׁכֶם
  choice: നിങ്ങളുടെ ഹൃദയത്തിലും പ്രാണനിലും
  rationale: ‘ഹൃദയം’ എന്നും ‘പ്രാണൻ’ എന്നും നൽകി രണ്ട് വ്യത്യസ്ത എബ്രായ പദങ്ങളും അവയുടെ മാനവശാസ്ത്രപരമായ വ്യാപ്തിയും നിലനിർത്തി. മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗത്തിനായി עַל എന്നത് സ്ഥാനസൂചകമായ ‘-ിൽ’ കൊണ്ട് അവതരിപ്പിച്ചു.
- source_word: וּקְשַׁרְתֶּם אֹתָם
  choice: അവയെ ... കെട്ടണം
  rationale: קשׁר എന്ന പദത്തിന്റെ മൂർത്തമായ ‘കെട്ടുക/ബന്ധിക്കുക’ എന്ന അർഥം നിലനിർത്തുന്നു; കല്പന രൂപകമാണോ അക്ഷരാർഥമാണോ എന്ന് പരിഭാഷ തീരുമാനിക്കുന്നില്ല.
- source_word: לְאוֹת
  choice: ഒരു അടയാളമായി
  rationale: אוֹת എന്നതിന്റെ ‘അടയാളം, ചിഹ്നം’ എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: עַל יֶדְכֶם
  choice: നിങ്ങളുടെ കൈമേൽ
  rationale: יָד എന്നതിന്റെ സാധാരണ അർഥമായ ‘കൈ’ നിലനിർത്തുകയും עַל എന്നതിന്റെ മൂർത്തമായ സ്ഥാനബന്ധം ‘കൈമേൽ’ എന്നു പ്രകടിപ്പിക്കുകയും ചെയ്തു.
- source_word: לְטוֹטָפֹת
  choice: നെറ്റിപ്പട്ടങ്ങളായി
  rationale: അപൂർവമായ טוֹטָפֹת കണ്ണുകൾക്കിടയിൽ അണിയുന്ന ഒന്നിനെ സൂചിപ്പിക്കുന്നതായി പരമ്പരാഗതമായി മനസ്സിലാക്കപ്പെടുന്നു. ‘നെറ്റിപ്പട്ടങ്ങൾ’ പിന്നീട് രൂപപ്പെട്ട പ്രത്യേക ആചാരപദം മുഖ്യവാചകത്തിൽ ഇറക്കുമതി ചെയ്യാതെ ദൃശ്യരൂപവും പദത്തിന്റെ അനിശ്ചിതത്വവും നിലനിർത്തുന്നു.
- source_word: בֵּין עֵינֵיכֶם
  choice: നിങ്ങളുടെ കണ്ണുകൾക്കിടയിൽ
  rationale: എബ്രായത്തിലെ അക്ഷരാർഥമായ സ്ഥാനപ്രയോഗം നിലനിർത്തി; വ്യാഖ്യാനാത്മകമായ ‘നെറ്റിയിൽ’ എന്നു മാറ്റിയില്ല.
theological_decisions:
- issue: വചനങ്ങൾ കൈമേൽ കെട്ടുകയും കണ്ണുകൾക്കിടയിൽ വയ്ക്കുകയും ചെയ്യുന്നതിന്റെ അക്ഷരാർഥവും രൂപകാർഥവും
  choice: മൂർത്തമായ ഭാഷ അതേപടി നിലനിർത്തി; ഇത് രൂപകമാണോ അക്ഷരാർഥത്തിലുള്ള ആചാരനിർദേശമാണോ രണ്ടുമാണോ എന്ന് തീരുമാനിച്ചില്ല.
  alternative: കല്പനകൾ ചിന്തയിലും പ്രവൃത്തിയിലും എപ്പോഴും സൂക്ഷിക്കണമെന്ന പൂർണമായ രൂപകവായന; അല്ലെങ്കിൽ ഫിലാക്ടറികൾ ധരിക്കാനുള്ള പൂർണമായ അക്ഷരാർഥ ആചാരവായന.
  rationale: എബ്രായ വാചകം മൂർത്തമായ ദൃശ്യഭാഷ ഉപയോഗിക്കുന്നുവെങ്കിലും ഈ വാക്യം മാത്രം ഒരു വ്യാഖ്യാനം നിർബന്ധിക്കുന്നില്ല. അതിനാൽ ദൈവശാസ്ത്രപരമായ സംഘർഷവും വ്യാഖ്യാനസാധ്യതകളും തുറന്നുവച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന, ഗൗരവമുള്ള കല്പനാശൈലി ഉപയോഗിച്ചു. ബഹുവചന അഭിസംബോധന ‘നിങ്ങളുടെ’ എന്ന രൂപത്തിൽ നിലനിർത്തി. മുഖ്യവാചകത്തിലെ മൂർത്തമായ ശരീരദൃശ്യങ്ങൾ വ്യാഖ്യാനിച്ച് മൃദൂകരിച്ചില്ല.
