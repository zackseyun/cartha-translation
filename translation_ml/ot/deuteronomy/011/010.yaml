  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֣י הָ/אָ֗רֶץ אֲשֶׁ֨ר אַתָּ֤ה בָא שָׁ֨מָּ/ה֙ לְ/רִשְׁתָּ֔/הּ לֹ֣א כְ/אֶ֤רֶץ מִצְרַ֨יִם֙ הִ֔וא אֲשֶׁ֥ר יְצָאתֶ֖ם מִ/שָּׁ֑ם אֲשֶׁ֤ר תִּזְרַע֙ אֶֽת זַרְעֲ/ךָ֔ וְ/הִשְׁקִ֥יתָ בְ/רַגְלְ/ךָ֖ כְּ/גַ֥ן הַ/יָּרָֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/010.yaml
  text: For the land that you are entering to possess is not like the land of Egypt[a], from which you came out, where you sowed your seed and watered it with your foot[b], like a vegetable garden.
translation:
  language: ml
  text: കാരണം, നീ കൈവശമാക്കാൻ പ്രവേശിക്കുന്ന ദേശം, നിങ്ങൾ അവിടെനിന്ന് പുറപ്പെട്ടുവന്ന ഈജിപ്തുദേശംപോലെയല്ല; അവിടെ നീ നിന്റെ വിത്ത് വിതയ്ക്കുകയും, ഒരു പച്ചക്കറിത്തോട്ടംപോലെ നിന്റെ കാൽ കൊണ്ട് ജലസേചനം നടത്തുകയും ചെയ്തിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിന്റെ കാൽ കൊണ്ട്’ എന്നത് കാൽ ഉപയോഗിച്ച് പ്രവർത്തിപ്പിച്ച ജലസേചനരീതിയെയോ, കാൽ കൊണ്ട് ചെറുചാലുകളിലെ വെള്ളം തിരിച്ചുവിട്ടിരുന്നതിനെയോ സൂചിപ്പിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: കാരണം സൂചിപ്പിക്കുന്ന ബന്ധം വാക്യഘടനയിലൂടെ നിലനിർത്തി
  rationale: മുൻവാക്യത്തിലെ പ്രബോധനത്തിന് വിശദീകരണം നൽകുന്നു; ഒറ്റവാക്യമായ മലയാള വിവർത്തനത്തിൽ നിർബന്ധമായി ‘എന്തെന്നാൽ’ ചേർക്കാതെ ബന്ധം സ്വാഭാവികമായി പ്രകടമാക്കാം.
- source_word: הָאָרֶץ
  choice: ദേശം
  rationale: ആവർത്തനപുസ്തകത്തിലെ ഭൂമിശാസ്ത്രപരവും ഉടമ്പടിസംബന്ധവുമായ പ്രമേയം നിലനിർത്തുന്ന പതിവായ മലയാളപ്രയോഗം.
- source_word: בָא שָׁמָּה לְרִשְׁתָּהּ
  choice: കൈവശമാക്കാൻ പ്രവേശിക്കുന്ന
  rationale: പ്രവേശനം ആസന്നമാണെന്ന പങ്കാളിത്തരൂപത്തിന്റെ ഭാവവും ירשׁ എന്ന ക്രിയയുടെ കൈവശപ്പെടുത്തൽ അർഥവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֲשֶׁר יְצָאתֶם מִשָּׁם
  choice: നിങ്ങൾ പുറപ്പെട്ടുപോന്ന
  rationale: പുറപ്പാടിന്റെ മൂലപാഠപ്രയോഗം നിലനിർത്തുകയും ബഹുവചന അഭിസംബോധന കൃത്യമായി സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: אֲשֶׁר תִּזְרַע אֶת זַרְעֲךָ
  choice: അവിടെ നീ വിത്തു വിതച്ച്
  rationale: എബ്രായത്തിലെ ഏകവചന അഭിസംബോധനയും ‘വിത്ത്’ എന്ന സാക്ഷാൽ പദവും നിലനിർത്തുന്നു; അപൂർണ്ണക്രിയയുടെ പതിവുഭാവം സന്ദർഭത്തിൽ സ്വാഭാവികമായി ഗ്രഹിക്കാം.
- source_word: וְהִשְׁקִיתָ בְרַגְלְךָ
  choice: നിന്റെ കാൽകൊണ്ട് വെള്ളം നനച്ചിരുന്നു
  rationale: ‘കാൽകൊണ്ട്’ എന്ന ദൃശ്യരൂപം വ്യാഖ്യാനിച്ച് ഇല്ലാതാക്കാതെ നിലനിർത്തുന്നു; കൃഷിസന്ദർഭം വ്യക്തമാക്കാൻ വെള്ളം എന്ന ആശയം സ്വാഭാവികമായി പറയുന്നു.
- source_word: כְּגַן הַיָּרָק
  choice: ഒരു പച്ചക്കറിത്തോട്ടംപോലെ
  rationale: ചെറിയതും തീവ്രമായി ജലസേചനം ചെയ്യുന്നതുമായ തോട്ടത്തിന്റെ സാധാരണ ആധുനിക മലയാളരൂപം.
theological_decisions:
- issue: പുറപ്പാടിനെ സൂചിപ്പിക്കുന്ന ഉടമ്പടിസന്ദർഭത്തിലെ പ്രയോഗം
  choice: നിങ്ങൾ പുറപ്പെട്ടുപോന്ന
  alternative: നിങ്ങൾ വിട്ടുപോന്ന
  rationale: ഇസ്രായേലിന്റെ ഈജിപ്തിൽനിന്നുള്ള പുറപ്പാടുമായുള്ള അന്തർഗ്രന്ഥബന്ധം നിലനിർത്തുന്നു; അധികമായ ദൈവശാസ്ത്രവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: ഈജിപ്തിലെ ജലസേചനരീതിയുടെ കൃത്യസ്വഭാവം
  choice: നിന്റെ കാൽകൊണ്ട്
  alternative: കാൽ പ്രവർത്തിപ്പിക്കുന്ന ജലസേചനയന്ത്രംകൊണ്ട്
  rationale: മൂലപാഠം രീതി വ്യക്തമാക്കുന്നില്ല; സാധ്യതകളിലൊന്ന് മുഖ്യവാചകത്തിൽ ഉറപ്പിക്കാതെ യഥാർഥമായ അനിശ്ചിതത്വം സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. എബ്രായത്തിൽ സമൂഹത്തെ ഏകകമായി കാണിക്കുന്ന ‘നീ’ എന്ന ഏകവചനവും ഇടയ്ക്കുള്ള ‘നിങ്ങൾ’ എന്ന ബഹുവചനവും മാറ്റാതെ സൂക്ഷിച്ചു. സാങ്കേതികമായ ‘ജലസേചനം ചെയ്തു’ എന്നതിനു പകരം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ ‘വെള്ളം നനച്ചു’ ഉപയോഗിച്ചു.
