source:
  edition: WLC
  text: וְ/נָתַתִּ֛י עֵ֥שֶׂב בְּ/שָׂדְ/ךָ֖ לִ/בְהֶמְתֶּ֑/ךָ וְ/אָכַלְתָּ֖ וְ/שָׂבָֽעְתָּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/015.yaml
  text: And I will give grass in your field for your livestock[b][a], and you will eat and be satisfied.
translation:
  language: ml
  text: നിന്റെ കന്നുകാലികൾക്കായി നിന്റെ വയലിൽ ഞാൻ പുല്ല്[a] നൽകും; നീ ഭക്ഷിച്ചു തൃപ്തനാകും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘പച്ചച്ചെടികൾ’ അല്ലെങ്കിൽ ‘സസ്യങ്ങൾ’; എബ്രായപദം സസ്യവളർച്ചയെ വിശാലമായി സൂചിപ്പിക്കാമെങ്കിലും ഇവിടെ കന്നുകാലികൾക്കുള്ള തീറ്റയായിരിക്കാനാണ് സാധ്യത.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘വയറുനിറയും’; എബ്രായക്രിയ ഭക്ഷിച്ചശേഷം നിറയുകയോ തൃപ്തിയടയുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: ഞാൻ ... മുളപ്പിക്കും
  rationale: അക്ഷരാർഥത്തിൽ ‘ഞാൻ നൽകും’ എന്നാണ്. എന്നാൽ വയലിൽ കാലിത്തീറ്റ നൽകുന്നതിനെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘മുളപ്പിക്കും’ എന്നു പറയാം; ദൈവമാണ് അതു നൽകുന്നതെന്ന കർത്തൃബന്ധവും നിലനിൽക്കുന്നു.
- source_word: עֵשֶׂב
  choice: പുല്ല്
  rationale: പദത്തിന് സസ്യവളർച്ച, പച്ചച്ചെടി, പുല്ല് തുടങ്ങിയ വിശാല അർഥങ്ങളുണ്ടെങ്കിലും, കന്നുകാലികൾക്കുള്ള തീറ്റയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
- source_word: בְּשָׂדְךָ
  choice: നിന്റെ വയലിൽ
  rationale: ഏകവചനത്തിലുള്ള കൃഷിസ്ഥലസൂചനയും അഭിസംബോധനയുടെ ഏകവചനരൂപവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: לִבְהֶמְתֶּךָ
  choice: നിന്റെ കന്നുകാലികൾക്കായി
  rationale: ഇവിടെ പദം വളർത്തുമൃഗങ്ങളെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു; ആധുനിക കാർഷികസന്ദർഭത്തിൽ ‘കന്നുകാലികൾ’ സ്വാഭാവികമാണ്.
- source_word: וְאָכַלְתָּ
  choice: നീ ഭക്ഷിച്ചു
  rationale: ഇസ്രായേലിനെ പ്രതിനിധീകരിക്കുന്ന രണ്ടാംപുരുഷ ഏകവചനത്തെ നിലനിർത്തുന്നു; തുടർന്നുള്ള ഫലവുമായി ബന്ധപ്പെടുന്ന മലയാള ക്രിയാരൂപമാണിത്.
- source_word: וְשָׂבָעְתָּ
  choice: തൃപ്തനാകും
  rationale: ഭക്ഷിച്ച് വയറുനിറയുകയും തൃപ്തിയടയുകയും ചെയ്യുന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ഇസ്രായേലിനോടുള്ള പ്രതിനിധാനപരമായ ഏകവചന അഭിസംബോധന
  choice: ‘നിന്റെ’, ‘നീ’, ‘തൃപ്തനാകും’ എന്നീ ഏകവചനരൂപങ്ങൾ നിലനിർത്തി.
  alternative: വായനക്കാരെ കൂട്ടമായി കാണിച്ച് ബഹുവചനരൂപങ്ങൾ ഉപയോഗിക്കുക.
  rationale: എബ്രായപാഠം ഉടനീളം രണ്ടാംപുരുഷ പുല്ലിംഗ ഏകവചനമാണ് ഉപയോഗിക്കുന്നത്; ഉടമ്പടിസംബന്ധമായ അഭിസംബോധനയുടെ വാഗ്മിത്വം അതിലൂടെ സംരക്ഷിക്കപ്പെടുന്നു.
- issue: വാഗ്ദത്ത അനുഗ്രഹത്തിന്റെ സ്വഭാവം
  choice: കന്നുകാലികൾക്കുള്ള തീറ്റയും മനുഷ്യന് ഭക്ഷിച്ചു തൃപ്തനാകാനുള്ള വകയും നൽകുന്ന സാധാരണ കാർഷിക അനുഗ്രഹമായി വിവർത്തനം ചെയ്തു.
  alternative: സമൃദ്ധിയെയോ ഐശ്വര്യത്തെയോ കുറിച്ചുള്ള വിപുലമായ ദൈവശാസ്ത്രപ്രഖ്യാപനമായി വിശദീകരിക്കുക.
  rationale: മൂലപാഠം പറയുന്നതിലധികമായ സമൃദ്ധിദൈവശാസ്ത്ര ആശയങ്ങൾ ചേർക്കാതെ കാർഷിക കരുതലിന്റെ വ്യക്തമായ അർഥം മാത്രം അവതരിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കാർഷിക പദാവലി ഉപയോഗിച്ചു. എബ്രായത്തിലെ പ്രതിനിധാനപരമായ ഏകവചന അഭിസംബോധന നിലനിർത്തി. മുഖ്യവാക്യത്തിൽ ഇരു അടിക്കുറിപ്പുസൂചകങ്ങളും ബന്ധപ്പെട്ട പദങ്ങൾക്ക് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
