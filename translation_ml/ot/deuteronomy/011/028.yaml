  text: and the curse[a], if you do not listen to the commandments of Yahweh your God, and turn aside from the way that I am commanding you today, to go after other gods that you have not known.
translation:
  language: ml
  text: നിങ്ങളുടെ ദൈവമായ യഹ്‌വേയുടെ കൽപ്പനകൾ നിങ്ങൾ ചെവിക്കൊള്ളാതിരിക്കുകയും[a], ഇന്നു ഞാൻ നിങ്ങളോടു കൽപ്പിക്കുന്ന വഴിയിൽനിന്ന് മാറി, നിങ്ങൾ അറിഞ്ഞിട്ടില്ലാത്ത മറ്റു ദൈവങ്ങളുടെ പിന്നാലെ പോകുകയും ചെയ്താൽ, ശാപം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “കൽപ്പനകൾ അനുസരിക്കാതിരിക്കുകയും.” എബ്രായത്തിലെ ‘കേൾക്കുക’ എന്ന ക്രിയ ഉടമ്പടിസന്ദർഭങ്ങളിൽ പലപ്പോഴും അനുസരണത്തോടെയുള്ള കേൾവിയെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַקְּלָלָה
  choice: ശാപവും വരും
  rationale: മുൻവാക്യത്തിലെ അനുഗ്രഹത്തോടുള്ള സമാന്തരത നിലനിർത്തുന്നു. മലയാളത്തിൽ നിബന്ധനാവാക്യത്തോടൊപ്പം സ്വാഭാവികമായ പൂർണവാക്യം ഉണ്ടാക്കാൻ സന്ദർഭത്തിൽ സൂചിതമായ ‘വരും’ ചേർത്തു.
- source_word: אִם לֹא תִשְׁמְעוּ אֶל
  choice: നിങ്ങൾ കേട്ടനുസരിക്കാതിരിക്കുകയും
  rationale: שׁמע എന്നതിലെ ‘കേൾക്കുക’ എന്ന അടിസ്ഥാനാർഥവും ഉടമ്പടിസന്ദർഭത്തിലെ അനുസരണാർഥവും ഒരുമിച്ച് സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; അടിക്കുറിപ്പിൽ ലളിതമായ പകരം നൽകുന്നു.
- source_word: מִצְוֺת
  choice: കല്പനകൾ
  rationale: ഉടമ്പടിസംബന്ധമായ ആജ്ഞകൾക്കുള്ള ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് പരിചിതവുമായ മലയാളപദം.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവമായ യഹ്‌വേ
  rationale: ദൈവനാമമായ יהוה ശബ്ദാന്തരപ്പെടുത്തി; എബ്രായ ഉടമസ്ഥബന്ധം സ്വാഭാവിക മലയാളക്രമത്തിൽ നൽകി.
- source_word: וְסַרְתֶּם מִן הַדֶּרֶךְ
  choice: വഴിയിൽനിന്നു മാറി
  rationale: നിർദേശിക്കപ്പെട്ട പാതയിൽനിന്നുള്ള വ്യതിചലനം എന്ന രൂപകം നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם
  choice: ഇന്നു ഞാൻ നിങ്ങളോടു കല്പിക്കുന്ന
  rationale: മോശെയുടെ ഇപ്പോഴത്തെ അഭിസംബോധനയുടെ തൽക്ഷണതയും വാക്യത്തിന്റെ വിശേഷണഘടനയും സൂക്ഷിക്കുന്നു.
- source_word: לָלֶכֶת אַחֲרֵי
  choice: പിന്തുടരുകയും
  rationale: ‘പിന്നാലെ പോകുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ആശയം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: അന്യദേവന്മാർ
  rationale: ഇസ്രായേലിന്റെ ദൈവമല്ലാത്ത മറ്റു ദേവന്മാരെ സൂചിപ്പിക്കുന്ന സ്ഥിരവും സംക്ഷിപ്തവുമായ മലയാളപ്രയോഗം.
- source_word: אֲשֶׁר לֹא יְדַעְתֶּם
  choice: നിങ്ങൾ അറിഞ്ഞിട്ടില്ലാത്ത
  rationale: എബ്രായ പൂർണ്ണക്രിയയുടെ ഇപ്പോഴും പ്രസക്തമായ നിഷേധാർഥം നിലനിർത്തുന്നു; ‘അറിയുക’ എന്ന ബന്ധപരമായ സാധ്യതയെ ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം പൊതുപദവിയായി മാറ്റാതെ മലയാളത്തിൽ ശബ്ദാന്തരപ്പെടുത്തി.
- issue: שׁמע എന്ന ക്രിയയിൽ കേൾവിയും അനുസരണവും തമ്മിലുള്ള ബന്ധം
  choice: കേട്ടനുസരിക്കുക
  alternative: കേൾക്കുക / അനുസരിക്കുക
  rationale: മൂലക്രിയയുടെ ശ്രവണഘടകവും ഉടമ്പടിസന്ദർഭത്തിലെ അനുസരണസൂചനയും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു; ഒരു അർഥം മാത്രം തിരഞ്ഞെടുത്ത് മറ്റേതിനെ ഇല്ലാതാക്കുന്നില്ല.
- issue: അന്യദേവന്മാരെ ‘അറിയാതിരിക്കുക’ എന്ന പ്രയോഗം
  choice: അറിഞ്ഞിട്ടില്ലാത്ത
  alternative: പരിചയമില്ലാത്ത
  rationale: ידע എന്ന ക്രിയയുടെ വിശാലവും ബന്ധപരവുമായ അർഥസാധ്യത നിലനിർത്താൻ ‘അറിയുക’ ഉപയോഗിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. എബ്രായത്തിലെ വഴിരൂപകവും ദൈവനാമവും നിലനിർത്തി; നിബന്ധനയുടെ ഫലം മലയാളത്തിൽ വ്യക്തവും പൂർണവുമാക്കാൻ ‘വരും’ സന്ദർഭാനുസൃതമായി ചേർത്തു.
