source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּ֤י יְבִֽיאֲ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ אֶל הָ/אָ֕רֶץ אֲשֶׁר אַתָּ֥ה בָא שָׁ֖מָּ/ה לְ/רִשְׁתָּ֑/הּ וְ/נָתַתָּ֤ה אֶת הַ/בְּרָכָה֙ עַל הַ֣ר גְּרִזִ֔ים וְ/אֶת הַ/קְּלָלָ֖ה עַל הַ֥ר עֵיבָֽל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/029.yaml
  text: And when Yahweh your God brings you into the land that you are entering to possess[a], you shall set the blessing on Mount Gerizim and the curse on Mount Ebal.
translation:
  language: ml
  text: നിന്റെ ദൈവമായ യാഹ്‌വെ, നീ കൈവശമാക്കാൻ പ്രവേശിക്കുന്ന ദേശത്തേക്കു നിന്നെ കൊണ്ടുവരുമ്പോൾ, നീ അനുഗ്രഹം ഗെരിസീം മലമേലും ശാപം ഏബാൽ മലമേലും വെക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഗെരിസീം മലമേൽ അനുഗ്രഹവും ഏബാൽ മലമേൽ ശാപവും പ്രഖ്യാപിക്കണം.” എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ “വെക്കുക/കൊടുക്കുക” എന്നാണ്; ചടങ്ങിന്റെ കൃത്യമായ നടപടി ചുറ്റുമുള്ള ഭാഗം വിശദീകരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: കൊണ്ടുവരുമ്പോൾ
  rationale: ഭാവിയിൽ സംഭവിക്കാനിരിക്കുന്ന സാഹചര്യത്തെ പരിചയപ്പെടുത്തുന്ന എബ്രായ പ്രയോഗത്തിന്റെ കാലസൂചന മലയാളത്തിൽ സ്വാഭാവികമായ ‘-ുമ്പോൾ’ രൂപത്തിൽ നൽകി.
- source_word: יְבִיאֲךָ
  choice: നിന്നെ കൊണ്ടുവരുമ്പോൾ
  rationale: בוא എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിന് ‘അകത്തേക്കു കൊണ്ടുവരുക’ എന്ന കാരണാർഥമുണ്ട്; ദേശത്തേക്കുള്ള പ്രവേശനം സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: രണ്ടാംപുരുഷ ഏകവചന പ്രത്യയം പ്രകടിപ്പിക്കുന്ന ഉടമ്പടിബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: הָאָרֶץ
  choice: ദേശം
  rationale: ആവർത്തനപുസ്തകത്തിലെ വാഗ്ദത്തദേശസന്ദർഭത്തിന് യോജിക്കുന്ന സാധാരണ മലയാളപദം.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה לְרִשְׁתָּהּ
  choice: നീ കൈവശമാക്കാൻ പ്രവേശിക്കുന്ന
  rationale: בָא എന്ന പങ്കാളിത്തരൂപത്തിന്റെ ആസന്നമായ പ്രവേശനവും ירשׁ എന്നതിന്റെ കൈവശപ്പെടുത്തൽഭാവവും സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וְנָתַתָּה
  choice: വെക്കണം
  rationale: נתן എന്നതിന്റെ ‘കൊടുക്കുക/വെക്കുക/സ്ഥാപിക്കുക’ എന്ന മൂർത്തമായ ഭാഷ സംരക്ഷിക്കുന്നു; ചടങ്ങിന്റെ കൃത്യമായ പ്രവർത്തനം മുഖ്യവാചകത്തിൽ അതിരുകടന്ന് വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: הַבְּרָכָה
  choice: അനുഗ്രഹം
  rationale: നിശ്ചിതമായ ഉടമ്പടി-അനുഗ്രഹത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക സമാനപദം.
- source_word: עַל הַר גְּרִזִים
  choice: ഗെരിസീം മലമേൽ
  rationale: עַל എന്ന സ്ഥലബന്ധവും സ്ഥലനാമവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: הַקְּלָלָה
  choice: ശാപം
  rationale: അനുഗ്രഹത്തിന് സമാന്തരമായ നിശ്ചിത ഉടമ്പടി-ശാപത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: עַל הַר עֵיבָל
  choice: ഏബാൽ മലമേൽ
  rationale: ഗെരിസീം മലയുടെ സമാന്തര ഘടനയും സ്ഥലബന്ധവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ, അതിനെ ഒരു ബിരുദമാക്കി മാറ്റാതെ ലിപ്യന്തരിച്ചു.
- issue: അനുഗ്രഹവും ശാപവും സംബന്ധിച്ച ഉടമ്പടി-പ്രവർത്തനത്തിന്റെ സ്വഭാവം
  choice: അനുഗ്രഹം ... ശാപം ... വെക്കണം
  alternative: അനുഗ്രഹം ... ശാപം ... പ്രഖ്യാപിക്കണം
  rationale: മൂലത്തിലെ נתן എന്ന ക്രിയയുടെ മൂർത്തവും വിശാലവുമായ അർഥം മുഖ്യവാചകത്തിൽ നിലനിർത്തി; ചടങ്ങ് വാചികപ്രഖ്യാപനമാണെന്ന വ്യാഖ്യാനം സാധ്യതയായി അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായവാക്യത്തിന്റെ ഭാവികാല-നിബന്ധനാസ്വഭാവം സ്വാഭാവികമായ ‘കൊണ്ടുവരുമ്പോൾ’ ഘടനയിൽ നൽകി; അനാവശ്യ മതവിഭാഗീയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
