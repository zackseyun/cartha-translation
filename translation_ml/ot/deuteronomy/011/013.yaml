id: DEU.11.13
reference: Deuteronomy 11:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָיָ֗ה אִם שָׁמֹ֤עַ תִּשְׁמְעוּ֙ אֶל מִצְוֺתַ֔/י אֲשֶׁ֧ר אָנֹכִ֛י מְצַוֶּ֥ה אֶתְ/כֶ֖ם הַ/יּ֑וֹם לְ/אַהֲבָ֞ה אֶת יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ וּ/לְ/עָבְד֔/וֹ בְּ/כָל לְבַבְ/כֶ֖ם וּ/בְ/כָל נַפְשְׁ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/013.yaml
  text: And if you indeed listen to my commandments that I am commanding you today[a], to love Yahweh your God and to serve him with all your heart and with all your soul[c][b],
translation:
  language: ml
  text: നിങ്ങളുടെ ദൈവമായ യാഹ്‌വേയെ സ്നേഹിക്കാനും മുഴുവൻ ഹൃദയത്തോടും മുഴുവൻ ആത്മാവോടുംകൂടെ അവനെ സേവിക്കാനുമായി ഞാൻ ഇന്ന് നിങ്ങളോടു കൽപ്പിക്കുന്ന എന്റെ കൽപ്പനകൾ നിങ്ങൾ ശ്രദ്ധയോടെ കേട്ടാൽ,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: ചെയ്താൽ
  rationale: തുടർന്നുള്ള വാക്യത്തിലേക്കു നീളുന്ന വ്യവസ്ഥയുടെ പൂർവപക്ഷം സ്വാഭാവിക മലയാളത്തിൽ വാക്യാവസാനത്തിലെ ‘ചെയ്താൽ’ എന്ന രൂപത്തിൽ അവതരിപ്പിക്കുന്നു; וְהָיָהയുടെ പ്രഭാഷണബന്ധകശക്തി വേറൊരു കൃത്രിമ ക്രിയയായി ആവർത്തിക്കുന്നില്ല.
- source_word: שָׁמֹעַ תִּשְׁמְעוּ
  choice: ശ്രദ്ധയോടെ കേട്ടനുസരിച്ച്
  rationale: ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ട് + അപൂർണക്രിയ നൽകുന്ന ഊന്നൽ ‘ശ്രദ്ധയോടെ’ എന്നതിലൂടെ സൂചിപ്പിക്കുന്നു. שמעയുടെ കേൾവിയും അനുസരണവും ഉൾക്കൊള്ളുന്ന നിയമസന്ദർഭാർത്ഥം ‘കേട്ടനുസരിച്ച്’ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: אֶל מִצְוֺתַי
  choice: എന്റെ കല്പനകൾ
  rationale: ഉടമ്പടിസന്ദർഭത്തിലെ നിർബന്ധകമായ ആജ്ഞകളെ സൂചിപ്പിക്കുന്ന സാധാരണവും ഗൗരവമുള്ളതുമായ മലയാളപദം.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם
  choice: ഞാൻ ഇന്ന് നിങ്ങളോടു കല്പിക്കുന്ന
  rationale: מְצַוֶּהയുടെ ഇപ്പോഴത്തെ, തുടരുന്ന പ്രസംഗപ്രവർത്തനം ‘കല്പിക്കുന്ന’ എന്നു നിലനിർത്തുന്നു; הַיּוֹם ഉടമ്പടിപരമായ സമയസൂചനയായി സംരക്ഷിക്കുന്നു.
- source_word: לְאַהֲבָה אֶת יְהוָה אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവമായ യഹോവയെ സ്നേഹിക്കുകയും
  rationale: ഹീബ്രു ഉദ്ദേശ്യ/പ്രതികരണ ഘടന മലയാളത്തിലെ ഏകോപിത ക്രിയാരൂപത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ദൈവനാമം വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וּלְעָבְדוֹ
  choice: അവനെ സേവിക്കുകയും
  rationale: עבד ആരാധനയും അനുസരണവും ഉൾപ്പെടുന്ന സമർപ്പിത സേവനത്തെ സൂചിപ്പിക്കുന്നതിനാൽ, അർത്ഥം ‘ആരാധിക്കുക’ എന്നതിലേക്കു ചുരുക്കാതെ ‘സേവിക്കുക’ എന്നു നൽകുന്നു.
- source_word: בְּכָל לְבַבְכֶם
  choice: പൂർണഹൃദയത്തോടും
  rationale: לֵבָב ചിന്ത, ഇച്ഛ, വികാരം എന്നിവയടങ്ങുന്ന ആന്തരിക വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; ‘പൂർണഹൃദയത്തോടെ’ മലയാളത്തിൽ സ്വാഭാവികവും സ്ഥാപിതവുമായ പ്രയോഗമാണ്.
- source_word: וּבְכָל נַפְשְׁכֶם
  choice: പൂർണമനസ്സോടും
  rationale: נֶפֶשׁ ഇവിടെ മുഴുവൻ ജീവൻ/സ്വയം/അസ്തിത്വം എന്ന വിശാല അർത്ഥം വഹിക്കുന്നു. മലയാളത്തിലെ ‘മനസ്സ്’ ഈ കൂട്ടുപ്രയോഗത്തിൽ വായനാസൗകര്യം നൽകുന്നു; വിശാലമായ അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ
  rationale: മലയാള ബൈബിൾഭാഷയിൽ വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്ന വ്യക്തിനാമരൂപം ഉപയോഗിക്കുന്നു; ‘കർത്താവ്’ എന്ന പദവിയാക്കി മാറ്റുന്നില്ല. ഹീബ്രു ഉച്ചാരണത്തിന്റെ പണ്ഡിതലോകത്ത് സാധാരണമായ പുനർനിർമാണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: שָׁמֹעַ תִּשְׁמְעוּ എന്നതിന്റെ അർത്ഥശക്തി
  choice: ശ്രദ്ധയോടെ കേട്ടനുസരിച്ച്
  alternative: തീർച്ചയായും കേട്ടാൽ
  rationale: ഹീബ്രു പ്രയോഗത്തിലെ ഊന്നലും שמעയുടെ കേൾവി-അനുസരണ ദ്വയാർത്ഥവും ഒരുമിച്ച് നിലനിർത്തുന്നു; വെറും ശ്രവണമായോ വെറും അനുസരണമായോ അർത്ഥം ചുരുക്കുന്നില്ല.
- issue: נֶפֶשׁ എന്നതിന്റെ മനുഷ്യശാസ്ത്രപരമായ വ്യാപ്തി
  choice: മനസ്സ്
  alternative: ജീവൻ / സർവസ്വം / ആത്മാവ്
  rationale: ഒരു പ്രത്യേക ശരീരം-ആത്മാവ് വിഭജനസിദ്ധാന്തം പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതെ, മുഴുവൻ വ്യക്തിയെയും സൂചിപ്പിക്കുന്ന അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്കു വ്യക്തവുമായ ശൈലി. വ്യവസ്ഥാപൂർവപക്ഷമായതിനാൽ അടുത്ത വാക്യത്തിലേക്കുള്ള തുടർച്ച സൂചിപ്പിക്കാൻ അവസാനം കോമ നിലനിർത്തി. ‘പൂർണഹൃദയം/പൂർണമനസ്സ്’ എന്ന സമാന്തരരൂപം ഹീബ്രു സമഗ്രതാഭാവം സ്വാഭാവികമായി കൈമാറുന്നു.
