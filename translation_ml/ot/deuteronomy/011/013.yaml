revisions:
- from: ഞാൻ ഇന്ന് നിങ്ങളോടു കല്പിക്കുന്ന എന്റെ കല്പനകൾ നിങ്ങൾ ശ്രദ്ധയോടെ കേട്ടനുസരിച്ച്[a], നിങ്ങളുടെ ദൈവമായ യഹോവയെ[b] സ്നേഹിക്കുകയും പൂർണഹൃദയത്തോടും പൂർണമനസ്സോടും[c] കൂടെ അവനെ സേവിക്കുകയും ചെയ്താൽ,
  to: നിങ്ങളുടെ ദൈവമായ യാഹ്‌വേയെ സ്നേഹിക്കാനും മുഴുവൻ ഹൃദയത്തോടും മുഴുവൻ ആത്മാവോടുംകൂടെ അവനെ സേവിക്കാനുമായി ഞാൻ ഇന്ന് നിങ്ങളോടു കൽപ്പിക്കുന്ന എന്റെ കൽപ്പനകൾ നിങ്ങൾ ശ്രദ്ധയോടെ കേട്ടാൽ,
  rationale: The revision retains the verse’s unfinished conditional form and all principal source elements. It avoids placing the interpretive ‘obey’ in the main text, aligns the divine-name rendering with the POB policy, and preserves the distinct heart–nephesh pairing without imposing a narrow ‘mind’ reading. Footnote markers remain attached respectively to the emphatic hearing expression, the divine name, and ‘soul.’
