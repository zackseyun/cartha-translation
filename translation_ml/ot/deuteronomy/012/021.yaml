revisions:
- from: നിന്റെ ദൈവമായ യഹ്‌വേ തന്റെ നാമം അവിടെ സ്ഥാപിക്കാൻ തിരഞ്ഞെടുക്കുന്ന സ്ഥലം നിന്നിൽനിന്ന് ഏറെ അകലെയാണെങ്കിൽ, യഹ്‌വേ നിനക്കു തന്നിരിക്കുന്ന നിന്റെ കന്നുകാലികളിൽനിന്നും ആടുമാടുകളിൽനിന്നും, ഞാൻ നിന്നോടു കല്പിച്ചതുപോലെ, അറുക്കാം. നിന്റെ കവാടങ്ങൾക്കുള്ളിൽവെച്ച്[a] നിന്റെ ഉള്ളം ആഗ്രഹിക്കുന്നതുപോലെ[b] നിനക്ക് ഭക്ഷിക്കാം.
  to: നിന്റെ ദൈവമായ യഹ്‌വേ തന്റെ നാമം അവിടെ വെക്കാൻ തിരഞ്ഞെടുക്കുന്ന സ്ഥലം നിന്നിൽനിന്ന് ഏറെ അകലെയാണെങ്കിൽ, യഹ്‌വേ നിനക്കു തന്നിരിക്കുന്ന നിന്റെ കന്നുകാലികളിൽനിന്നും നിന്റെ ആട്ടിൻകൂട്ടത്തിൽനിന്നും, ഞാൻ നിന്നോടു കൽപ്പിച്ചതുപോലെ, നീ അറുക്കാം; നിന്റെ കവാടങ്ങൾക്കുള്ളിൽ[a] നിന്റെ മനസ്സിന് ഇഷ്ടമുള്ളതുപോലെ[b] നിനക്കു ഭക്ഷിക്കാം.
