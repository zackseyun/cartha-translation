id: DEU.12.21
reference: Deuteronomy 12:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּֽי יִרְחַ֨ק מִמְּ/ךָ֜ הַ/מָּק֗וֹם אֲשֶׁ֨ר יִבְחַ֜ר יְהוָ֣ה אֱלֹהֶי/ךָ֮ לָ/שׂ֣וּם שְׁמ֣/וֹ שָׁם֒ וְ/זָבַחְתָּ֞ מִ/בְּקָרְ/ךָ֣ וּ/מִ/צֹּֽאנְ/ךָ֗ אֲשֶׁ֨ר נָתַ֤ן יְהוָה֙ לְ/ךָ֔ כַּ/אֲשֶׁ֖ר צִוִּיתִ֑/ךָ וְ/אָֽכַלְתָּ֙ בִּ/שְׁעָרֶ֔י/ךָ בְּ/כֹ֖ל אַוַּ֥ת נַפְשֶֽׁ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/021.yaml
  text: If the place that Yahweh your God chooses to put his name there is too far from you[a], then you may slaughter from your herd and from your flock that Yahweh has given you, as I have commanded you[b], and you may eat within your gates according to all the desire of your soul.
translation:
  language: ml
  text: നിന്റെ ദൈവമായ യഹ്‌വേ തന്റെ നാമം അവിടെ വെക്കാൻ തിരഞ്ഞെടുക്കുന്ന സ്ഥലം നിന്നിൽനിന്ന് ഏറെ അകലെയാണെങ്കിൽ, യഹ്‌വേ നിനക്കു തന്നിരിക്കുന്ന നിന്റെ കന്നുകാലികളിൽനിന്നും നിന്റെ ആട്ടിൻകൂട്ടത്തിൽനിന്നും, ഞാൻ നിന്നോടു കൽപ്പിച്ചതുപോലെ, നീ അറുക്കാം; നിന്റെ കവാടങ്ങൾക്കുള്ളിൽ[a] നിന്റെ മനസ്സിന് ഇഷ്ടമുള്ളതുപോലെ[b] നിനക്കു ഭക്ഷിക്കാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്റെ പട്ടണങ്ങളിൽ.” എബ്രായത്തിൽ അക്ഷരാർഥം “നിന്റെ കവാടങ്ങൾക്കുള്ളിൽ.”
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം, “നിന്റെ പ്രാണന്റെ എല്ലാ ആഗ്രഹത്തിനൊത്തവണ്ണം”; അഥവാ, “നിന്റെ വിശപ്പിനൊത്തവണ്ണം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִרְחַק מִמְּךָ
  choice: നിന്നിൽനിന്ന് ഏറെ അകലെയാണെങ്കിൽ
  rationale: כִּי ഇവിടെ നിയമപരമായ ഒരു നിബന്ധന അവതരിപ്പിക്കുന്നു; רחק സ്ഥലത്തിന്റെ പ്രായോഗികമായ അകലം സൂചിപ്പിക്കുന്നു. ‘ഏറെ അകലെയാണെങ്കിൽ’ എന്നത് അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, ‘Yahweh’ എന്ന ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: לָשׂוּם שְׁמוֹ שָׁם
  choice: തന്റെ നാമം അവിടെ സ്ഥാപിക്കാൻ
  rationale: שׂים എന്ന ക്രിയയുടെ ‘വെക്കുക/സ്ഥാപിക്കുക’ എന്ന നേരിട്ടുള്ള അർഥവും ആവർത്തിക്കുന്ന വിശുദ്ധസ്ഥാന-സൂത്രവാക്യവും സംരക്ഷിക്കുന്നു.
- source_word: וְזָבַחְתָּ
  choice: അറുക്കാം
  rationale: ഈ സന്ദർഭത്തിൽ കേന്ദ്രവിശുദ്ധസ്ഥാനം ദൂരെയായതിനാൽ സാധാരണ ഭക്ഷണത്തിനായി മൃഗത്തെ പ്രാദേശികമായി അറുക്കാനുള്ള അനുമതിയാണ്. അതിനാൽ ബലിയർപ്പിക്കൽ എന്ന അർഥം അനാവശ്യമായി ചേർക്കാതെ അനുമതിസ്വരം നിലനിർത്തുന്നു.
- source_word: מִבְּקָרְךָ וּמִצֹּאנְךָ
  choice: നിന്റെ കന്നുകാലികളിൽനിന്നും ആടുമാടുകളിൽനിന്നും
  rationale: בקר വലിയ വളർത്തുമൃഗങ്ങളെയും צאן ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടുന്ന ചെറിയ കന്നുകാലിക്കൂട്ടത്തെയും സൂചിപ്പിക്കുന്ന സമൂഹനാമങ്ങളാണ്.
- source_word: כַּאֲשֶׁר צִוִּיתִךָ
  choice: ഞാൻ നിന്നോടു കല്പിച്ചതുപോലെ
  rationale: എബ്രായത്തിലെ ഒന്നാംപുരുഷ ഏകവചനപ്രഭാഷകനെയും മുമ്പ് നൽകിയ നിർദേശത്തോടുള്ള ബന്ധത്തെയും അതേപടി നിലനിർത്തുന്നു.
- source_word: בִּשְׁעָרֶיךָ
  choice: നിന്റെ കവാടങ്ങൾക്കുള്ളിൽവെച്ച്
  rationale: ‘കവാടങ്ങൾ’ എന്ന എബ്രായ രൂപകം നിലനിർത്തുന്നു; ഇവിടെ അത് ഒരാളുടെ പട്ടണങ്ങളെയോ വാസസ്ഥലങ്ങളെയോ സൂചിപ്പിക്കുന്നു.
- source_word: בְּכֹל אַוַּת נַפְשֶׁךָ
  choice: നിന്റെ ഉള്ളം ആഗ്രഹിക്കുന്നതുപോലെ
  rationale: נפש എന്നത് ഇവിടെ വ്യക്തിയുടെ ഉള്ളം/സ്വയം എന്നും אַוָּה ആഗ്രഹം അല്ലെങ്കിൽ വിശപ്പ് എന്നും സൂചിപ്പിക്കുന്നു. സ്വാഭാവിക മലയാളത്തിൽ ആശയം നൽകിക്കൊണ്ട് അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമാണ് ഉള്ളത്. അതിനെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെയും ‘Jehovah’ രൂപം സ്വീകരിക്കാതെയും ‘Yahweh’ എന്നതിന്റെ മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- issue: וְזָבַחְתָּ എന്നതിന്റെ ബലിസംബന്ധമായ സാധ്യത
  choice: അറുക്കാം
  alternative: ബലിയർപ്പിക്കണം
  rationale: ആവർത്തനം 12-ലെ സന്ദർഭം വിശുദ്ധസ്ഥാനത്തിനു പുറത്തുള്ള സാധാരണ മാംസഭക്ഷണത്തിന് അനുമതി നൽകുന്നതാണ്. അതിനാൽ പ്രാദേശിക ബലിയർപ്പിക്കൽ സൂചിപ്പിക്കാത്ത പദം തിരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. നിയമവാക്യത്തിന്റെ അനുമതിസ്വരം ‘അറുക്കാം’, ‘ഭക്ഷിക്കാം’ എന്നിവകൊണ്ട് വ്യക്തമാക്കി. ‘കവാടങ്ങൾ’ എന്ന ബൈബിള്‍ രൂപകം മുഖ്യപാഠത്തിൽ നിലനിർത്തി, അതിന്റെ പട്ടണം എന്ന അർഥം അടിക്കുറിപ്പിൽ നൽകി. ഇംഗ്ലീഷ് ഉപദേശപാഠത്തിലെ അടിക്കുറിപ്പ് സൂചകങ്ങളുടെ സ്ഥാനം ഉള്ളടക്കവുമായി പൊരുത്തപ്പെടാത്തതിനാൽ, [a] ‘കവാടങ്ങൾ’ എന്നതിനും [b] ‘ഉള്ളം ആഗ്രഹിക്കുന്നതുപോലെ’ എന്നതിനും പിന്നാലെ ശരിയായി ചേർത്തു.
