id: DEU.12.10
reference: Deuteronomy 12:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/עֲבַרְתֶּם֮ אֶת הַ/יַּרְדֵּן֒ וִֽ/ישַׁבְתֶּ֣ם בָּ/אָ֔רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֵי/כֶ֖ם מַנְחִ֣יל אֶתְ/כֶ֑ם וְ/הֵנִ֨יחַ לָ/כֶ֧ם מִ/כָּל אֹיְבֵי/כֶ֛ם מִ/סָּבִ֖יב וִֽ/ישַׁבְתֶּם בֶּֽטַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/010.yaml
  text: But when you cross the Jordan and live in the land that Yahweh your God is giving you to inherit[a], and he gives you rest from all your enemies around you, then you will live in safety.
translation:
  language: ml
  text: എന്നാൽ നിങ്ങൾ യോർദാൻ കടന്ന്, നിങ്ങളുടെ ദൈവമായ യഹോവ നിങ്ങൾക്ക് അവകാശമായി നൽകുന്ന ദേശത്തു വസിക്കുമ്പോൾ, ചുറ്റുമുള്ള നിങ്ങളുടെ എല്ലാ ശത്രുക്കളിൽനിന്നും അവൻ നിങ്ങൾക്കു വിശ്രമം നൽകും; അപ്പോൾ നിങ്ങൾ സുരക്ഷിതമായി വസിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിർഭയമായി പാർക്കും.”
    reason: בֶּטַח എന്ന പദം സുരക്ഷിതത്വത്തോടൊപ്പം ഭയമില്ലാത്ത ആത്മവിശ്വാസമുള്ള വാസത്തെയും സൂചിപ്പിക്കാം.
lexical_decisions:
- source_word: וַעֲבַרְתֶּם אֶת־הַיַּרְדֵּן
  choice: നിങ്ങൾ യോർദാൻ കടന്ന്
  rationale: ഭാവികാല സംഭവക്രമത്തിലുള്ള വാവ്-പ്രത്യയ ക്രിയയെ മലയാളത്തിൽ സ്വാഭാവികമായ കാലസൂചനയോടെ അവതരിപ്പിക്കുന്നു; നദിയുടെ പേരായ ‘യോർദാൻ’ മാത്രം ഉപയോഗിച്ചാലും അർഥം വ്യക്തമാണ്.
- source_word: וִישַׁבְתֶּם בָּאָרֶץ
  choice: ദേശത്തു വസിക്കുമ്പോൾ
  rationale: ישׁב എന്നത് ഇവിടെ സ്ഥിരതാമസത്തെ സൂചിപ്പിക്കുന്നു. ‘വസിക്കുക’ ആ അർഥം മാന്യവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവമായ യഹോവ
  rationale: ദൈവത്തിന്റെ ഉടമ്പടിനാമമായ יהוה ‘യഹോവ’ എന്നു ലിപ്യന്തരണം ചെയ്യുകയും ‘നിങ്ങളുടെ ദൈവം’ എന്ന ബന്ധസൂചന നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: מַנְחִיל אֶתְכֶם
  choice: നിങ്ങൾക്ക് അവകാശമായി നൽകുന്ന
  rationale: נחל എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള ‘അവകാശമാക്കിക്കൊടുക്കുക’ എന്ന ദൈവിക പ്രവർത്തനവും അവകാശത്തിന്റെ ആശയവും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: וְהֵנִיחַ לָכֶם
  choice: അവൻ നിങ്ങൾക്കു വിശ്രമം നൽകും
  rationale: ഹിഫീൽ രൂപം വിശ്രമം അഥവാ ആശ്വാസം നൽകുന്നതിനെ സൂചിപ്പിക്കുന്നു; ദേശത്തിലെ ‘വിശ്രമം’ എന്ന പ്രമേയവും നിലനിർത്തുന്നു.
- source_word: מִכָּל־אֹיְבֵיכֶם מִסָּבִיב
  choice: ചുറ്റുമുള്ള നിങ്ങളുടെ എല്ലാ ശത്രുക്കളിൽനിന്നും
  rationale: ശത്രുക്കളുടെ സമഗ്രതയും ചുറ്റുപാടെന്ന സ്ഥലപരമായ ആശയവും രണ്ടും വ്യക്തമാക്കുന്നു.
- source_word: וִישַׁבְתֶּם בֶּטַח
  choice: നിങ്ങൾ സുരക്ഷിതമായി വസിക്കും
  rationale: בטח സൂചിപ്പിക്കുന്ന സുരക്ഷയെയും ישׁב സൂചിപ്പിക്കുന്ന സ്ഥിരവാസത്തെയും ചുരുക്കവും വ്യക്തവുമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമത്തെ ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിലെ പരിചിതമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: מַנְחִיל എന്നതിലെ അവകാശസങ്കൽപ്പം
  choice: അവകാശമായി നൽകുന്ന
  alternative: കൈവശമാക്കിത്തരുന്ന
  rationale: ദൈവത്തിന്റെ ദാനവും ഇസ്രായേലിന്റെ അവകാശവും ഒരുമിച്ചു സൂക്ഷിക്കുന്നു; വെറും ഭൂമി കൈവശപ്പെടുത്തൽ എന്ന അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- issue: נוּחַ എന്ന വിശ്രമപ്രമേയം
  choice: വിശ്രമം നൽകും
  alternative: ആശ്വാസം നൽകും
  rationale: ശത്രുക്കളിൽനിന്നുള്ള മോചനത്തോടൊപ്പം ആവർത്തനപുസ്തകത്തിലെ ദേശവിശ്രമത്തിന്റെ ദൈവശാസ്ത്രപരമായ പ്രതിധ്വനിയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായതും തിരുവെഴുത്തിന് യോജിച്ച മാന്യതയുള്ളതുമായ ശൈലി. ദീർഘമായ എബ്രായ സംഭവക്രമം മലയാളത്തിൽ വായനാസൗകര്യത്തിനായി കാലവാക്യവും അർദ്ധവിരാമവും ഉപയോഗിച്ച് ക്രമപ്പെടുത്തി; ആശയഘടകങ്ങൾ ഒഴിവാക്കിയിട്ടില്ല.
