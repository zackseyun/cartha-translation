revisions:
- from: നിന്റെ ദൈവമായ യഹോവ നിനക്കു വാഗ്ദാനം ചെയ്തതുപോലെ നിന്റെ അതിർത്തി വിശാലമാക്കുമ്പോൾ, മാംസം തിന്നാൻ നിനക്കു കൊതി തോന്നിയിട്ട്, “എനിക്കു മാംസം തിന്നണം” എന്നു നീ പറഞ്ഞാൽ, നിന്റെ മനസ്സിലെ ആഗ്രഹംപോലെ മാംസം തിന്നാം.
