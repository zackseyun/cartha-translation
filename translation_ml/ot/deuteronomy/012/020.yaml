source:
  edition: WLC
  text: כִּֽי יַרְחִיב֩ יְהוָ֨ה אֱלֹהֶ֥י/ךָ אֶֽת גְּבֽוּלְ/ךָ֮ כַּ/אֲשֶׁ֣ר דִּבֶּר לָ/ךְ֒ וְ/אָמַרְתָּ֙ אֹכְלָ֣ה בָשָׂ֔ר כִּֽי תְאַוֶּ֥ה נַפְשְׁ/ךָ֖ לֶ/אֱכֹ֣ל בָּשָׂ֑ר בְּ/כָל אַוַּ֥ת נַפְשְׁ/ךָ֖ תֹּאכַ֥ל בָּשָֽׂר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/020.yaml
  text: When the LORD your God enlarges your territory, as he has promised you, and you say, “I want to eat meat,” because you crave to eat meat, you may eat meat according to all the desire of your soul.
translation:
  language: ml
  text: നിന്റെ ദൈവമായ യഹോവ, അവൻ നിന്നോടു അരുളിച്ചെയ്തതുപോലെ, നിന്റെ അതിർത്തി വിശാലമാക്കുമ്പോൾ, “എനിക്കു മാംസം തിന്നണം” എന്നു നീ പറയുകയും, മാംസം തിന്നാൻ നിനക്കു ആഗ്രഹം തോന്നുകയും ചെയ്താൽ, നിന്റെ ഹൃദയം ആഗ്രഹിക്കുന്നതുപോലെ മാംസം തിന്നാം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַרְחִיב ... אֶת־גְּבוּלְךָ
  choice: നിന്റെ അതിർത്തി വിശാലമാക്കുമ്പോൾ
  rationale: ഹിഫ്ഈൽ ക്രിയയുടെ കാരകഭാവവും גְּבוּל എന്ന പദത്തിന്റെ ഭൂപ്രദേശപരമായ അർഥവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְאָמַרְתָּ אֹכְלָה בָשָׂר
  choice: “എനിക്കു മാംസം തിന്നണം” എന്നു നീ പറഞ്ഞാൽ
  rationale: ആഗ്രഹം പ്രകടിപ്പിക്കുന്ന ഹീബ്രു കോഹോർട്ടേറ്റീവ് രൂപം മലയാളത്തിലെ സ്വാഭാവിക ഇച്ഛാപ്രകടനമായി നൽകുന്നു.
- source_word: תְאַוֶּה נַפְשְׁךָ
  choice: നിനക്കു കൊതി തോന്നിയിട്ട്
  rationale: נפש ഇവിടെ വേറിട്ട ആത്മഘടകത്തേക്കാൾ വ്യക്തിയുടെ ആഗ്രഹത്തെ സൂചിപ്പിക്കുന്നു; ആവർത്തനം അസ്വാഭാവികമാകാതെ തീവ്രമായ ആഗ്രഹം വ്യക്തമാക്കുന്നു.
- source_word: בְּכָל־אַוַּת נַפְשְׁךָ
  choice: നിന്റെ മനസ്സിലെ ആഗ്രഹംപോലെ
  rationale: അക്ഷരാർഥമായ ‘നിന്റെ പ്രാണന്റെ സകല ആഗ്രഹപ്രകാരം’ എന്നതിന്റെ ആശയം വ്യക്തവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ പകരുന്നു.
theological_decisions:
- issue: ദൈവനാമം יהוה
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമത്തെ മലയാളത്തിൽ വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്ന ലിപ്യന്തരണത്തിലൂടെ തുറന്നുവെക്കുന്നു; ഒരു പദവിയാൽ പകരുന്നില്ല.
- issue: മാംസം ഭക്ഷിക്കാനുള്ള അനുമതിയുടെ വ്യാപ്തി
  choice: നിന്റെ മനസ്സിലെ ആഗ്രഹംപോലെ മാംസം തിന്നാം
  alternative: ഇഷ്ടമുള്ളത്ര മാംസം തിന്നാം
  rationale: ‘ഇഷ്ടമുള്ളത്ര’ അളവിന് നിയന്ത്രണമില്ലെന്ന അധിക സൂചന നൽകാം; മൂലത്തിലെ ആഗ്രഹാനുസൃതമായ അനുമതി മാത്രം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള മലയാളം. ഏകവചന അഭിസംബോധനയായ ‘നിന്റെ/നീ’ നിലനിർത്തിയിരിക്കുന്നു.
