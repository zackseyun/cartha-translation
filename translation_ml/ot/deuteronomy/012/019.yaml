source:
  edition: WLC
  text: הִשָּׁ֣מֶר לְ/ךָ֔ פֶּֽן תַּעֲזֹ֖ב אֶת הַ/לֵּוִ֑י כָּל יָמֶ֖י/ךָ עַל אַדְמָתֶֽ/ךָ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/019.yaml
  text: Be careful that you do not forsake the Levite all your days on your land[a][b].
translation:
  language: ml
  text: നിന്റെ ദേശത്ത് നീ ജീവിക്കുന്ന കാലമൊക്കെയും ലേവ്യനെ ഉപേക്ഷിക്കാതിരിക്കാൻ സൂക്ഷിച്ചുകൊള്ളുക.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ലേവ്യരെ’; എബ്രായത്തിൽ ‘ലേവ്യൻ’ എന്ന ഏകവചനമാണുള്ളത്. അത് ലേവ്യവിഭാഗത്തെ പ്രതിനിധീകരിക്കുന്ന ഏകവചനമായിരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘നിന്റെ ദേശത്തിന്മേൽ.’ എബ്രായത്തിൽ അക്ഷരാർഥം ‘നിന്റെ മണ്ണിന്മേൽ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: സൂക്ഷിച്ചുകൊള്ളുക
  rationale: നിഫാൽ ആജ്ഞാരൂപവും לְךָയും ചേർന്ന ഈ പ്രയോഗം സ്വയം ജാഗ്രത പാലിക്കണമെന്ന മുന്നറിയിപ്പാണ്; ആ ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഈ രൂപം നൽകുന്നു.
- source_word: פֶּן
  choice: ഉപേക്ഷിക്കാതിരിക്കാൻ
  rationale: פֶּן നിഷേധാത്മക മുന്നറിയിപ്പ് അവതരിപ്പിക്കുന്നു. മലയാളത്തിലെ നിഷേധാത്മക ക്രിയാനാമരൂപം ആശയം വ്യക്തമായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: תַּעֲזֹב
  choice: ഉപേക്ഷിക്കുക
  rationale: עזב എന്നതിന് വിട്ടുകളയുക, ഉപേക്ഷിക്കുക എന്ന അർഥങ്ങളുണ്ട്. ലേവ്യനോടുള്ള സാമൂഹിക-ഉടമ്പടിപരമായ ഉത്തരവാദിത്വം കൈവിടരുതെന്ന ധാർമ്മിക ഭാരം ‘ഉപേക്ഷിക്കുക’ നിലനിർത്തുന്നു.
- source_word: אֶת הַלֵּוִי
  choice: ലേവ്യനെ
  rationale: എബ്രായത്തിൽ നിർദിഷ്ട ഏകവചനമാണ്. ഒരു വിഭാഗത്തെ പ്രതിനിധീകരിക്കുന്ന ഏകവചനമായിരിക്കാമെന്ന സാധ്യത നിലനിർത്താൻ മലയാളത്തിലും ഏകവചനം ഉപയോഗിച്ചു.
- source_word: כָּל יָמֶיךָ
  choice: നീ ജീവിക്കുന്ന കാലമൊക്കെയും
  rationale: അക്ഷരാർഥം ‘നിന്റെ എല്ലാ ദിവസങ്ങളും’ എന്നാണ്. എന്നാൽ ഉദ്ദേശിക്കുന്ന ജീവിതകാലമുഴുവൻ എന്ന ആശയം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും വ്യക്തവുമായി നൽകാൻ ഈ പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: עַל אַדְמָתֶךָ
  choice: നിന്റെ ദേശത്ത്
  rationale: אדמה ഇവിടെ മണ്ണിനെയല്ല, ഒരാൾ വസിക്കുന്ന ദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്. עַל അക്ഷരാർഥത്തിൽ ‘മേൽ’ എന്നായാലും മലയാളത്തിൽ ദേശസംബന്ധമായ ഈ സാഹചര്യത്തിൽ ‘ദേശത്ത്’ എന്നതാണ് സ്വാഭാവികം.
theological_decisions:
- issue: ലേവ്യനെ സൂചിപ്പിക്കുന്ന പ്രതിനിധി ഏകവചനം
  choice: ലേവ്യനെ
  alternative: ലേവ്യരെ
  rationale: മൂലപാഠം നിർദിഷ്ട ഏകവചനം ഉപയോഗിക്കുന്നു; അത് ലേവ്യവിഭാഗത്തിലെ ഏതു വ്യക്തിയെയും അല്ലെങ്കിൽ ആ വിഭാഗത്തെ മുഴുവനായും പ്രതിനിധീകരിക്കാം. ഏകവചനം നിലനിർത്തുന്നത് ഈ രൂപപരവും അർഥപരവുമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മുന്നറിയിപ്പിന്റെ ശക്തി നിലനിർത്തിയിട്ടുണ്ട്; പ്രതിനിധി ഏകവചനവും עַל എന്ന പദത്തിന്റെ അക്ഷരാർഥസാധ്യതയും അടിക്കുറിപ്പുകളിൽ രേഖപ്പെടുത്തി.
