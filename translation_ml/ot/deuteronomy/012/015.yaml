id: DEU.12.15
reference: Deuteronomy 12:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: רַק֩ בְּ/כָל אַוַּ֨ת נַפְשְׁ/ךָ֜ תִּזְבַּ֣ח וְ/אָכַלְתָּ֣ בָשָׂ֗ר כְּ/בִרְכַּ֨ת יְהוָ֧ה אֱלֹהֶ֛י/ךָ אֲשֶׁ֥ר נָֽתַן לְ/ךָ֖ בְּ/כָל שְׁעָרֶ֑י/ךָ הַ/טָּמֵ֤א וְ/הַ/טָּהוֹר֙ יֹאכְלֶ֔/נּוּ כַּ/צְּבִ֖י וְ/כָ/אַיָּֽל־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/015.yaml
  text: But whenever your soul desires[a], you may slaughter and eat meat, according to the blessing of Yahweh your God that he has given you, within all your gates. The unclean and the clean alike may eat it[b], as they would the gazelle or the deer.
translation:
  language: ml
  text: എന്നാൽ, നിന്റെ മനസ്സ് ആഗ്രഹിക്കുമ്പോഴെല്ലാം[a], നിന്റെ ദൈവമായ യഹ്‌വെ നിനക്കു നൽകിയ അനുഗ്രഹത്തിനനുസരിച്ച് നിന്റെ പട്ടണങ്ങളിലെല്ലാം[b] അറുത്ത് മാംസം ഭക്ഷിക്കാം. അശുദ്ധനായവനും ശുദ്ധനായവനും ഒരുപോലെ അതു ഭക്ഷിക്കാം—കലമാനിന്റെയോ മാനിന്റെയോ മാംസം ഭക്ഷിക്കുന്നതുപോലെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘നിന്റെ ജീവന്റെ സകല ആഗ്രഹത്തിലും’; അതായത്, നിനക്ക് ആഗ്രഹം തോന്നുമ്പോഴെല്ലാം.'
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘നിന്റെ എല്ലാ കവാടങ്ങളിലും.’ ഇവിടെ ‘കവാടങ്ങൾ’ എന്നത് പട്ടണങ്ങളെയോ പാർപ്പിടകേന്ദ്രങ്ങളെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.'
    reason: cultural_note
lexical_decisions:
- source_word: רַק
  choice: എന്നാൽ
  rationale: മുൻകല്പനയ്ക്കു പിന്നാലെ വരുന്ന അനുമതിയും നിയന്ത്രിതമായ വ്യത്യാസവും സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: בְּכָל אַוַּת נַפְשְׁךָ
  choice: നിന്റെ മനസ്സ് ആഗ്രഹിക്കുമ്പോഴെല്ലാം
  rationale: അക്ഷരാർഥം ‘നിന്റെ ജീവന്റെ/മനസ്സിന്റെ സകല ആഗ്രഹത്തിലും’ എന്നാണ്; ഇവിടെ נֶפֶשׁ ആഗ്രഹിക്കുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ ഈ പ്രയോഗം തിരഞ്ഞെടുത്തു, അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: תִּזְבַּח וְאָכַלְתָּ בָשָׂר
  choice: അറുത്ത് മാംസം ഭക്ഷിക്കാം
  rationale: സന്ദർഭത്തിൽ ഇത് യാഗാർപ്പണത്തിനുള്ള കല്പനയല്ല, ഭക്ഷണത്തിനായി മൃഗത്തെ അറുക്കാനുള്ള അനുമതിയാണ്. അതിനാൽ അനുമതിസൂചകമായ ‘ഭക്ഷിക്കാം’ ഉപയോഗിച്ചു.
- source_word: כְּבִרְכַּת יְהוָה אֱלֹהֶיךָ אֲשֶׁר נָתַן לְךָ
  choice: നിന്റെ ദൈവമായ യഹ്‌വെ നിനക്കു നൽകിയ അനുഗ്രഹത്തിനനുസരിച്ച്
  rationale: כְּ എന്ന താരതമ്യ/അനുപാത സൂചനയും ‘അനുഗ്രഹം’ എന്ന നാമരൂപവും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ചതുർക്ഷര ദൈവനാമത്തെ ഒരു പൊതുപദവിയായി മാറ്റാതെ മലയാളത്തിൽ ശബ്ദാന്തരം ചെയ്തു.
- source_word: בְּכָל שְׁעָרֶיךָ
  choice: നിന്റെ പട്ടണങ്ങളിലെല്ലാം
  rationale: ‘നിന്റെ എല്ലാ കവാടങ്ങളിലും’ എന്ന എബ്രായ പ്രയോഗം പട്ടണങ്ങളെയോ പാർപ്പിടകേന്ദ്രങ്ങളെയോ സൂചിപ്പിക്കുന്നു; മുഖ്യവാചകത്തിൽ അർഥം സ്വാഭാവികമായി നൽകി, രൂപകം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: הַטָּמֵא וְהַטָּהוֹר
  choice: അശുദ്ധനായവനും ശുദ്ധനായവനും ഒരുപോലെ
  rationale: ഇവിടെ ധാർമിക സ്വഭാവമല്ല, ആചാരപരമായ നിലയാണ് ഉദ്ദേശിക്കുന്നത്. ഇരുകൂട്ടർക്കും ഒരേ അനുമതിയുണ്ടെന്നത് ‘ഒരുപോലെ’ വ്യക്തമാക്കുന്നു.
- source_word: כַּצְּבִי וְכָאַיָּל
  choice: കലമാനിന്റെയോ മാനിന്റെയോ മാംസം ഭക്ഷിക്കുന്നതുപോലെ
  rationale: കാട്ടുമൃഗങ്ങളുടെ മാംസം ഭക്ഷിക്കുന്നതുമായുള്ള താരതമ്യമാണ് ഉദ്ദേശ്യം. മലയാളത്തിൽ താരതമ്യം തെറ്റിദ്ധരിക്കാതിരിക്കാൻ ‘മാംസം ഭക്ഷിക്കുന്ന’ എന്നത് വ്യക്തമായി ചേർത്തു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ഉടമ്പടിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ പൊതുപദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ ശബ്ദാന്തരം ചെയ്തു; ‘യഹോവ’ എന്ന പരമ്പരാഗത രൂപത്തേക്കാൾ എബ്രായനാമത്തിന്റെ സാധാരണ പുനർനിർമിത ഉച്ചാരണത്തോട് ‘യഹ്‌വെ’ അടുത്തുനിൽക്കുന്നു.
- issue: ‘അശുദ്ധൻ’ എന്നും ‘ശുദ്ധൻ’ എന്നും പറയുന്നതിന്റെ സ്വഭാവം
  choice: ആചാരപരമായ നിലയെ സൂചിപ്പിക്കുന്ന പദങ്ങൾ മാറ്റമില്ലാതെ നിലനിർത്തി
  alternative: ആചാരപരമായി അശുദ്ധനായവനും ശുദ്ധനായവനും
  rationale: സന്ദർഭം ആചാരശുദ്ധിയുടേതാണെങ്കിലും ‘ആചാരപരമായി’ എന്നു മുഖ്യവാചകത്തിൽ ചേർക്കുന്നത് മൂലപാഠത്തേക്കാൾ വിശദീകരണപരമാകും. അതിനാൽ പാഠത്തിലെ സംക്ഷിപ്തതയും വ്യത്യാസവും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായ വായനയ്ക്ക് എളുപ്പവുമായ ശൈലി. എബ്രായ വാക്യത്തിന്റെ അനുമതിസ്വഭാവം, ദൈവിക അനുഗ്രഹത്തിന്റെ അനുപാതം, ആചാരശുദ്ധിയിലെ ഇരുകൂട്ടർക്കുമുള്ള സമാനാവകാശം എന്നിവ നിലനിർത്തി; അർഥമറിവിന് തടസ്സമായ എബ്രായ ഭാഷാശൈലികൾ അടിക്കുറിപ്പുകളിലൂടെ സംരക്ഷിച്ചു.
