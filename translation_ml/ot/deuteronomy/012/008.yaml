id: DEU.12.8
reference: Deuteronomy 12:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹ֣א תַעֲשׂ֔וּ/ן כְּ֠/כֹל אֲשֶׁ֨ר אֲנַ֧חְנוּ עֹשִׂ֛ים פֹּ֖ה הַ/יּ֑וֹם אִ֖ישׁ כָּל הַ/יָּשָׁ֥ר בְּ/עֵינָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/008.yaml
  text: You shall not do as we are doing here today[a], each man whatever is right in his own eyes.
translation:
  language: ml
  text: നാം ഇന്ന് ഇവിടെ ചെയ്യുന്നതുപോലെ നിങ്ങൾ ചെയ്യരുത്; ഇപ്പോൾ ഓരോരുത്തനും[a] തന്റെ കാഴ്ചയിൽ ശരിയെന്നു തോന്നുന്നതെല്ലാം ചെയ്യുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘ഓരോ പുരുഷനും’; ഇവിടെ പ്രയോഗം വിതരണാർഥത്തിലുള്ളതാണ്—ഓരോ വ്യക്തിയും സ്വന്തം വിലയിരുത്തലനുസരിച്ച് പ്രവർത്തിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תַעֲשׂוּן
  choice: നിങ്ങൾ ചെയ്യരുത്
  rationale: നിഷേധത്തോടുകൂടിയ രണ്ടാംപുരുഷ ബഹുവചന അപൂർണക്രിയ ഇവിടെ നിരോധനാത്മക നിർദേശം നൽകുന്നു; മലയാളത്തിലെ ‘ചെയ്യരുത്’ അതിന്റെ നിയമപരമായ ബലം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: כְּכֹל אֲשֶׁר
  choice: ചെയ്യുന്നതുപോലെ
  rationale: താരതമ്യപ്രയോഗം ഇപ്പോഴത്തെ പ്രവർത്തനരീതിയെയാണ് സൂചിപ്പിക്കുന്നത്; ‘പോലെ’ അതിനെ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עֹשִׂים פֹּה הַיּוֹם
  choice: നാം ഇന്ന് ഇവിടെ ചെയ്യുന്നതു
  rationale: വർത്തമാന കൃതന്തവും സ്ഥലകാലപദങ്ങളും ഇപ്പോൾ നടന്നുകൊണ്ടിരിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു.
- source_word: אִישׁ
  choice: ഓരോരുത്തനും
  rationale: ഏകവചന പുരുഷലിംഗരൂപം ഇവിടെ വിതരണാർഥത്തിലാണ്. ആ കൂട്ടത്തിലെ ഓരോ വ്യക്തിയെയും സൂചിപ്പിക്കുന്ന ‘ഓരോരുത്തനും’ ആ അർഥം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: כָּל הַיָּשָׁר
  choice: ശരിയായതെല്ലാം
  rationale: യָשָׁר എന്ന പദത്തിന്റെ ‘നേര്/ശരി’ എന്ന മൂലാർഥം നിലനിർത്തുന്നു; ‘ശരിയെന്നു തോന്നുന്നതെല്ലാം’ എന്നത് വ്യക്തിപരമായ തോന്നൽ കൂടുതൽ വ്യാഖ്യാനാത്മകമായി മുൻനിർത്തും.
- source_word: בְּעֵינָיו
  choice: അവനവന്റെ കണ്ണിൽ
  rationale: വ്യക്തിയുടെ സ്വന്തം വിലയിരുത്തലിനെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലി മലയാളത്തിലും ഗ്രഹിക്കാവുന്ന രൂപത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: אִישׁ ... בְּעֵינָיו എന്ന വിതരണാർഥമുള്ള പുരുഷലിംഗ ഏകവചനപ്രയോഗം
  choice: ഓരോരുത്തനും ... അവനവന്റെ കണ്ണിൽ
  alternative: എല്ലാവരും ... താന്താങ്ങളുടെ കാഴ്ചയിൽ
  rationale: മൂലപാഠത്തിലെ ഏകവചന വിതരണഘടന നിലനിർത്തിക്കൊണ്ട്, ഇത് ഓരോ വ്യക്തിയെയും പ്രതിനിധിയായി ഉൾക്കൊള്ളുന്നുവെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു; അങ്ങനെ ലിംഗത്തെക്കുറിച്ചുള്ള അനാവശ്യ സിദ്ധാന്തപരമായ നിഗമനം ഒഴിവാക്കുന്നു.
- issue: വാക്യത്തിന്റെ അവസാനഭാഗം ആദ്യ നിരോധനത്തിന്റെ വിശദീകരണമോ സ്വതന്ത്രമായ മറ്റൊരു നിരോധനമോ എന്ന ഘടനാപരമായ ബന്ധം
  choice: ദീർഘവിരാമചിഹ്നത്തോടെ വിശദീകരണാത്മകമായി ബന്ധിപ്പിക്കുകയും ‘ചെയ്യരുത്’ ആവർത്തിക്കുകയും ചെയ്തു
  alternative: നാം ഇന്ന് ഇവിടെ ചെയ്യുന്നതുപോലെ, ഓരോരുത്തനും അവനവന്റെ കണ്ണിൽ ശരിയായതെല്ലാം നിങ്ങൾ ചെയ്യരുത്
  rationale: എബ്രായത്തിൽ ഒരേയൊരു പ്രധാന ക്രിയയാണ് ഉള്ളത്; എന്നാൽ പദക്രമം മലയാളത്തിൽ അതേപടി നൽകിയാൽ അവ്യക്തമാകും. ക്രിയ ആവർത്തിക്കുന്നത് പുതിയ കല്പന ചേർക്കാതെ, വ്യക്തിഗത സ്വമേധാപ്രവർത്തനമാണ് മുമ്പത്തെ രീതിയുടെ വിശദീകരണമെന്ന് വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിർദേശഭാഷ ഉപയോഗിച്ചു. ‘അവനവന്റെ കണ്ണിൽ’ എന്ന എബ്രായ ശൈലി അർഥം മനസ്സിലാകുന്ന വിധത്തിൽ നിലനിർത്തി; വാക്യഘടന വ്യക്തമാക്കാൻ നിരോധനക്രിയ ആവർത്തിച്ചു.
