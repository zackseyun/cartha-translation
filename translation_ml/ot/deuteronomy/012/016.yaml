id: DEU.12.16
reference: Deuteronomy 12:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: רַ֥ק הַ/דָּ֖ם לֹ֣א תֹאכֵ֑לוּ עַל הָ/אָ֥רֶץ תִּשְׁפְּכֶ֖/נּוּ כַּ/מָּֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/016.yaml
  text: Only, you shall not eat the blood; you shall pour it out on the ground like water.
translation:
  language: ml
  text: എന്നാൽ, രക്തം നിങ്ങൾ ഭക്ഷിക്കരുത്; അത് വെള്ളംപോലെ നിലത്ത് ഒഴിക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിൽ നൽകിയ അനുമതിക്ക് ഒരു നിയന്ത്രണം ഏർപ്പെടുത്തുന്നു. മലയാളത്തിൽ ‘എന്നാൽ’ ഈ വൈരുധ്യ-നിയന്ത്രണബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: הַדָּם
  choice: രക്തം
  rationale: എബ്രായത്തിൽ നിർദേശക ആർട്ടിക്കിൾ ഉണ്ടെങ്കിലും, ഇവിടെ അറുക്കപ്പെട്ട മൃഗത്തിന്റെ രക്തമാണ് ഉദ്ദേശ്യമെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നതിനാൽ മലയാളത്തിൽ ആർട്ടിക്കിൾ പ്രത്യേകം പ്രകടിപ്പിക്കേണ്ടതില്ല.
- source_word: לֹא תֹאכֵלוּ
  choice: നിങ്ങൾ ഭക്ഷിക്കരുത്
  rationale: നിഷേധത്തോടുകൂടിയ അപൂർണ്ണക്രിയ നിയമപരമായ വിലക്കാണ്; ‘ഭക്ഷിക്കരുത്’ അതിന്റെ നേരിട്ടുള്ള ആജ്ഞാസ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עַל הָאָרֶץ
  choice: നിലത്ത്
  rationale: ഈ ഭൗതിക പ്രവൃത്തിയുടെ സന്ദർഭത്തിൽ אֶרֶץ ‘ഭൂമി/ദേശം’ എന്നതിലുപരി രക്തം ഒഴിക്കേണ്ട നിലത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: תִּשְׁפְּכֶנּוּ
  choice: അത് ... ഒഴിച്ചുകളയണം
  rationale: ക്രിയയുടെ അർഥം ഒഴിക്കുക/ചൊരിയുക എന്നതാണ്; പ്രത്യയം രക്തത്തെ സൂചിപ്പിക്കുന്നു. ‘ഒഴിച്ചുകളയണം’ നിർദേശിക്കപ്പെട്ട ഉപേക്ഷണവും നിയമപരമായ ബാധ്യതയും വ്യക്തമാക്കുന്നു.
- source_word: כַּמָּיִם
  choice: വെള്ളംപോലെ
  rationale: താരതമ്യപ്രയോഗത്തിന്റെ ലളിതമായ അർഥം സ്വാഭാവിക ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഭക്ഷണനിയമത്തിൽ രക്തത്തോടുള്ള സമീപനം
  choice: രക്തം ഭക്ഷിക്കരുതെന്നും അത് നിലത്ത് വെള്ളംപോലെ ഒഴിച്ചുകളയണമെന്നും നേരിട്ടുള്ള നിയമനിർദേശമായി പരിഭാഷപ്പെടുത്തി.
  alternative: രക്തത്തിന് പിന്നീടുള്ള ദൈവശാസ്ത്രപരമായ പ്രതീകാർഥങ്ങൾ പരിഭാഷയിൽ വിശദീകരിക്കുക.
  rationale: വാക്യം വ്യക്തമായ പ്രായോഗിക വിലക്കും നിർദേശവുമാണ് നൽകുന്നത്; പാഠം തന്നിൽ പറയാത്ത പിൽക്കാല വ്യാഖ്യാനങ്ങൾ പരിഭാഷയിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. നിയമനിർദേശത്തിന്റെ നേരിട്ടുള്ള ഭാവം സൂക്ഷിച്ചുകൊണ്ട് വാക്യക്രമം മലയാളത്തിന് സ്വാഭാവികമാക്കി.
