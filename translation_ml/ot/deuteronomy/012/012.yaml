reference: Deuteronomy 12:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/שְׂמַחְתֶּ֗ם לִ/פְנֵי֮ יְהוָ֣ה אֱלֹֽהֵי/כֶם֒ אַתֶּ֗ם וּ/בְנֵי/כֶם֙ וּ/בְנֹ֣תֵי/כֶ֔ם וְ/עַבְדֵי/כֶ֖ם וְ/אַמְהֹתֵי/כֶ֑ם וְ/הַ/לֵּוִי֙ אֲשֶׁ֣ר בְּ/שַֽׁעֲרֵי/כֶ֔ם כִּ֣י אֵ֥ין ל֛/וֹ חֵ֥לֶק וְ/נַחֲלָ֖ה אִתְּ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/012.yaml
  text: And you shall rejoice before Yahweh your God—you and your sons and your daughters[a], and your male servants and your female servants, and the Levite who is within your gates, because he has no portion or inheritance with you.
translation:
  language: ml
  text: നിങ്ങളും നിങ്ങളുടെ പുത്രന്മാരും പുത്രിമാരും നിങ്ങളുടെ പുരുഷ അടിമകളും സ്ത്രീ അടിമകളും നിങ്ങളുടെ കവാടങ്ങൾക്കുള്ളിൽ ഉള്ള[a] ലേവ്യനും നിങ്ങളുടെ ദൈവമായ യാഹ്‌വെയുടെ സന്നിധിയിൽ സന്തോഷിക്കണം. കാരണം, നിങ്ങളോടൊപ്പം അവന് ഓഹരിയോ അവകാശമോ ഇല്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങളുടെ പട്ടണങ്ങളിലുള്ള’; അക്ഷരാർഥം, ‘നിങ്ങളുടെ കവാടങ്ങൾക്കുള്ളിലുള്ള.’
    reason: ‘കവാടങ്ങൾ’ എന്ന പദം പട്ടണങ്ങളെയോ പ്രാദേശിക സമൂഹങ്ങളെയോ ലക്ഷണാർഥത്തിൽ സൂചിപ്പിക്കാം.
lexical_decisions:
- source_word: וּשְׂמַחְתֶּם
  choice: സന്തോഷിക്കണം
  rationale: നിർദേശപരമായ സന്ദർഭത്തിലെ ക്രിയയുടെ ബാധ്യതാഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ആരാധനാസംബന്ധമായ സന്തോഷത്തിന്റെ അർഥവും നിലനിർത്തുന്നു.
- source_word: לִפְנֵי יְהוָה אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവമായ യാഹ്‌വെയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי എന്നത് ഇവിടെ സാന്നിധ്യത്തെ സൂചിപ്പിക്കുന്നു; ദൈവനാമം ഒരു പദവികൊണ്ട് മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וּבְנֵיכֶם וּבְנֹתֵיכֶם
  choice: നിങ്ങളുടെ പുത്രന്മാരും പുത്രിമാരും
  rationale: എബ്രായത്തിലെ പുരുഷ-സ്ത്രീ ജോടിയെ പൊതുവായ ‘മക്കൾ’ എന്നാക്കി ലയിപ്പിക്കാതെ നിലനിർത്തുന്നു.
- source_word: וְעַבְדֵיכֶם וְאַמְהֹתֵיכֶם
  choice: നിങ്ങളുടെ പുരുഷ അടിമകളും സ്ത്രീ അടിമകളും
  rationale: ഗൃഹത്തിലെ ബന്ധിത സാമൂഹികപദവി മറച്ചുവയ്ക്കാതെ, മൂലപാഠത്തിലെ ലിംഗവ്യത്യാസവും വ്യക്തമാക്കുന്നു.
- source_word: וְהַלֵּוִי
  choice: ലേവ്യൻ
  rationale: ലേവി ഗോത്രത്തിലെ അംഗത്തെ സൂചിപ്പിക്കുന്ന പതിവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: אֲשֶׁר בְּשַׁעֲרֵיכֶם
  choice: നിങ്ങളുടെ കവാടങ്ങൾക്കുള്ളിലുള്ള
  rationale: ‘കവാടങ്ങൾ’ എന്ന മൂലരൂപവും അതിന്റെ നിയമപരമായ പ്രാദേശിക പ്രതിധ്വനിയും മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; പട്ടണങ്ങൾ എന്ന ലക്ഷണാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: חֵלֶק וְנַחֲלָה
  choice: ഓഹരിയോ അവകാശമോ
  rationale: ലേവ്യന് ലഭിക്കാത്ത ഭൂവിഹിതവും പാരമ്പര്യാവകാശവും എന്ന ബന്ധപ്പെട്ട ആശയങ്ങളെ വേർതിരിച്ചു നിലനിർത്തുന്നു.
- source_word: אִתְּכֶם
  choice: നിങ്ങളോടൊപ്പം
  rationale: മൂലത്തിലെ ‘കൂടെ/ഒപ്പം’ എന്ന ബന്ധം അടുത്തായി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമത്തെ ഒരു പദവികൊണ്ട് പകരാതെ, സാധാരണ അംഗീകരിക്കപ്പെടുന്ന ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: עֶבֶד / אָמָה പദങ്ങളിലെ സാമൂഹികപദവി
  choice: പുരുഷ അടിമകളും സ്ത്രീ അടിമകളും
  alternative: ദാസന്മാരും ദാസിമാരും
  rationale: ഈ നിയമ-ഗൃഹസാമൂഹിക പട്ടികയിൽ ബന്ധിതപദവി പ്രസക്തമായതിനാൽ മൃദൂകരിക്കാതെ വ്യക്തമാക്കുന്നു; അതോടൊപ്പം മൂലത്തിലെ പുരുഷ-സ്ത്രീ വ്യത്യാസവും സംരക്ഷിക്കുന്നു.
- issue: ലേവ്യന് ഓഹരിയും അവകാശവും ഇല്ലെന്ന പ്രസ്താവന
  choice: അവന് ഓഹരിയോ അവകാശമോ ഇല്ല
  alternative: അവന് ഭൂവിഹിതമായ അവകാശമില്ല
  rationale: രണ്ടു മൂലപദങ്ങളെയും ഒന്നാക്കി വ്യാഖ്യാനിക്കാതെ നിലനിർത്തുകയും, ലേവ്യരുടെ പ്രത്യേക അവകാശത്തെക്കുറിച്ചുള്ള വിപുലമായ ദൈവശാസ്ത്ര നിഗമനം വാക്യത്തിലേക്ക് ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ബഹുവചന അഭിസംബോധനയും പട്ടികയുടെ ഉൾക്കൊള്ളുന്ന ഘടനയും നിലനിർത്തി; നീണ്ട വാക്യം കാരണംവാക്യത്തിന് മുമ്പിൽ വിഭജിച്ച് വായനാസൗകര്യം വർധിപ്പിച്ചു.
