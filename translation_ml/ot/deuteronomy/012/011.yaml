id: DEU.12.11
reference: Deuteronomy 12:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָיָ֣ה הַ/מָּק֗וֹם אֲשֶׁר יִבְחַר֩ יְהוָ֨ה אֱלֹהֵי/כֶ֥ם בּ/וֹ֙ לְ/שַׁכֵּ֤ן שְׁמ/וֹ֙ שָׁ֔ם שָׁ֣מָּ/ה תָבִ֔יאוּ אֵ֛ת כָּל אֲשֶׁ֥ר אָנֹכִ֖י מְצַוֶּ֣ה אֶתְ/כֶ֑ם עוֹלֹתֵי/כֶ֣ם וְ/זִבְחֵי/כֶ֗ם מַעְשְׂרֹֽתֵי/כֶם֙ וּ/תְרֻמַ֣ת יֶדְ/כֶ֔ם וְ/כֹל֙ מִבְחַ֣ר נִדְרֵי/כֶ֔ם אֲשֶׁ֥ר תִּדְּר֖וּ לַֽ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/011.yaml
  text: 'Then the place that Yahweh your God will choose for his name to dwell there—to that place you shall bring all that I am commanding you: your burnt offerings[a], your sacrifices, your tithes, the contribution of your hand, and all the choicest of your vows that you vow to Yahweh.'
translation:
  language: ml
  text: 'അപ്പോൾ, തന്റെ നാമം അവിടെ വസിപ്പിക്കാനായി നിങ്ങളുടെ ദൈവമായ യഹ്‌വെ തിരഞ്ഞെടുക്കുന്ന സ്ഥലത്തേക്ക് ഞാൻ നിങ്ങളോടു കല്പിക്കുന്നതെല്ലാം നിങ്ങൾ കൊണ്ടുവരണം: നിങ്ങളുടെ ഹോമയാഗങ്ങൾ, ബലികൾ, ദശാംശങ്ങൾ, നിങ്ങളുടെ കൈയിൽനിന്നുള്ള സംഭാവന, യഹ്‌വെയ്ക്കു നിങ്ങൾ നേരുന്ന നേർച്ചകളിൽ ഏറ്റവും വിശിഷ്ടമായവയെല്ലാം.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה
  choice: അപ്പോൾ
  rationale: മുൻനിർദേശങ്ങളുടെ ഭാവിഫലത്തിലേക്കുള്ള പ്രഭാഷണപുരോഗതി സ്വാഭാവികമായ മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: הַמָּקוֹם אֲשֶׁר יִבְחַר
  choice: തിരഞ്ഞെടുക്കുന്ന സ്ഥലത്തേക്ക്
  rationale: ആരാധനയ്ക്കായി ദൈവം തിരഞ്ഞെടുക്കുന്ന നിർദിഷ്ട സ്ഥലമെന്ന ആവർത്തിത ആശയം വ്യക്തമായി നിലനിർത്തുന്നു; മലയാളത്തിലെ വർത്തമാനരൂപം സന്ദർഭത്തിൽ ഭാവിസൂചന നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: തന്റെ നാമം അവിടെ വസിക്കാനായി
  rationale: ആവർത്തനപുസ്തകത്തിലെ ‘നാമം വസിക്കുക’ എന്ന ദൃശ്യവും ദൈവസാന്നിധ്യത്തെക്കുറിച്ചുള്ള സൂക്ഷ്മതയും നിലനിർത്തുന്നു; ഹിഫ്ഇൽ കാരകഭാവം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: תָבִיאוּ
  choice: നിങ്ങൾ കൊണ്ടുവരണം
  rationale: കൽപ്പനയുടെ നിർബന്ധസ്വഭാവം ആധുനികവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: כָּל אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם
  choice: ഞാൻ നിങ്ങളോടു കല്പിക്കുന്നതെല്ലാം
  rationale: പങ്കാളിക്രിയയുടെ തുടരുന്ന കല്പനാഭാവവും ‘എല്ലാം’ എന്ന സമഗ്രതയും സൂക്ഷിക്കുന്നു.
- source_word: עוֹלֹתֵיכֶם
  choice: നിങ്ങളുടെ ഹോമയാഗങ്ങൾ
  rationale: മുഴുവനായി ദഹിപ്പിക്കുന്ന യാഗത്തിനുള്ള പ്രചാരത്തിലുള്ള കൃത്യമായ മലയാള പദം.
- source_word: זִבְחֵיכֶם
  choice: ബലികൾ
  rationale: ഒരു പ്രത്യേക ഉപവിഭാഗത്തിലേക്ക് ചുരുക്കാതെ വിശാലമായ യാഗപദം നിലനിർത്തുന്നു.
- source_word: מַעְשְׂרֹתֵיכֶם
  choice: ദശാംശങ്ങൾ
  rationale: പത്തിലൊന്ന് അർപ്പണങ്ങൾക്കുള്ള സ്ഥിരവും വ്യക്തവുമായ പദം.
- source_word: תְרֻמַת יֶדְכֶם
  choice: നിങ്ങളുടെ കൈയിൽനിന്നുള്ള സംഭാവന
  rationale: ‘കൈ’ എന്ന എബ്രായ ദൃശ്യത്തെ നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ അർഥഗ്രാഹ്യമായി അവതരിപ്പിക്കുന്നു.
- source_word: כֹל מִבְחַר נִדְרֵיכֶם
  choice: നേർച്ചകളിലെ ഏറ്റവും വിശിഷ്ടമായവയെല്ലാം
  rationale: മൂലത്തിലെ ‘തിരഞ്ഞെടുത്തത്/ഏറ്റവും നല്ലത്’ എന്ന ആശയം സൂക്ഷിക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘അർപ്പണങ്ങൾ’ എന്ന നാമം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: പാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, സീനായിൽ വെളിപ്പെടുത്തിയ ഉടമ്പടിനാമം ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: לְשַׁכֵּן שְׁמוֹ שָׁם എന്ന ‘നാമം വസിക്കുക’ പ്രയോഗം
  choice: തന്റെ നാമം അവിടെ വസിക്കാനായി
  alternative: തന്റെ നാമത്തെ അവിടെ വസിപ്പിക്കാനായി; തന്റെ നാമം അവിടെ സ്ഥാപിക്കാനായി
  rationale: ദൈവത്തെ ഒരു സ്ഥലത്തിനുള്ളിൽ പരിമിതപ്പെടുത്താതെ അവന്റെ നാമം അവിടെ വസിക്കുന്നു എന്ന ആവർത്തനപുസ്തകത്തിന്റെ ഭാഷയും ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും നിലനിർത്തുന്നു; കാരകവായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. യാഗസംബന്ധിയായ സ്ഥിരപദങ്ങൾ ആവശ്യമായിടത്ത് നിലനിർത്തുകയും, ദുഷ്കരമായ എബ്രായ പ്രയോഗങ്ങൾ സ്വാഭാവികമാക്കുമ്പോൾ അവയുടെ ദൃശ്യവും ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും സംരക്ഷിക്കുകയും ചെയ്തു.
