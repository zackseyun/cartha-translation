id: DEU.12.9
reference: Deuteronomy 12:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֥י לֹא בָּאתֶ֖ם עַד עָ֑תָּה אֶל הַ/מְּנוּחָה֙ וְ/אֶל הַֽ/נַּחֲלָ֔ה אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֥ן לָֽ/ךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/009.yaml
  text: For you have not yet come to the resting place and to the inheritance that Yahweh your God is giving you[a].
translation:
  language: ml
  text: കാരണം, നിങ്ങളുടെ ദൈവമായ യഹ്‌വെ നിങ്ങൾക്കു നൽകുന്ന വിശ്രമസ്ഥാനത്തേക്കും അവകാശഭൂമിയിലേക്കും നിങ്ങൾ ഇതുവരെ എത്തിയിട്ടില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വിശ്രമത്തിലേക്കും.” מְנוּחָה എന്ന ഹീബ്രായപദത്തിന് ‘വിശ്രമം’ എന്ന അവസ്ഥയെയോ ‘വിശ്രമസ്ഥാനം’ എന്ന സ്ഥലത്തെയോ സൂചിപ്പിക്കാം; ഇവിടെ ദേശത്തെക്കുറിച്ചുള്ള സന്ദർഭം രണ്ടാമത്തെ അർഥത്തെ കൂടുതൽ പിന്തുണയ്ക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ നിർദേശത്തിന് വിശദീകരണകാരണം നൽകുന്നു; ഹീബ്രായിയുടെ കാരണസൂചകബലം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: בָּאתֶם
  choice: എത്തിയിട്ടില്ല
  rationale: בוא എന്ന ക്രിയയുടെ ‘വരുക/എത്തുക’ എന്ന വിശാല അർഥം ലക്ഷ്യസ്ഥാനങ്ങളെ സൂചിപ്പിക്കുന്ന തുടർപ്രയോഗങ്ങളോടൊപ്പം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: עַד עָתָּה
  choice: ഇതുവരെ
  rationale: നിഷേധത്തോടൊപ്പം ചേർന്ന് ഇപ്പോഴത്തെ സമയംവരെ സംഭവം നടന്നിട്ടില്ലെന്ന കാലസൂചന കൃത്യമായി നൽകുന്നു.
- source_word: הַמְּנוּחָה
  choice: വിശ്രമസ്ഥാനം
  rationale: മൂലപദത്തിന് ‘വിശ്രമം’ എന്നും ‘വിശ്രമസ്ഥാനം’ എന്നും അർഥമാകാം; ദേശപ്രവേശനസന്ദർഭം ഒരു ലക്ഷ്യസ്ഥാനത്തെ മുൻനിർത്തുന്നതിനാൽ concrete അർഥം മുഖ്യവാചകത്തിൽ സ്വീകരിച്ചു.
- source_word: הַנַּחֲלָה
  choice: അവകാശഭൂമി
  rationale: ദൈവം നൽകുന്ന ദേശമെന്ന സന്ദർഭത്തിൽ, പാരമ്പര്യാവകാശവും ഭൂമിയെന്ന വ്യക്തമായ സൂചനയും ഒരുമിച്ച് പ്രകടിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ പൊതുവായി പരിചിതമായ മലയാളരൂപത്തിൽ നേരിട്ട് നൽകുന്നു.
- source_word: נֹתֵן
  choice: നൽകുന്ന
  rationale: ഹീബ്രായ പങ്കാളിക്രിയയുടെ നടന്നുകൊണ്ടിരിക്കുന്നതോ അടുത്തുതന്നെ സാക്ഷാത്കരിക്കപ്പെടുന്നതോ ആയ ഭാവം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ദൈവനാമം നേരിട്ട് ഉള്ളതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരാതെ പേരിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം ഉപയോഗിച്ചു.
- issue: מְנוּחָה എന്നതിന്റെ സ്ഥലം/അവസ്ഥ എന്ന അർഥസാധ്യത
  choice: വിശ്രമസ്ഥാനം
  alternative: വിശ്രമം
  rationale: ദേശപ്രവേശനസന്ദർഭം സ്ഥലസൂചനയെ പിന്തുണയ്ക്കുന്നു; എങ്കിലും അമൂർത്തമായ ‘വിശ്രമം’ എന്ന യഥാർഥ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അവകാശഭൂമി’ സാധാരണ വായനക്കാർക്ക് ദേശസന്ദർഭം വ്യക്തമാക്കുകയും נַחֲלָהയുടെ അവകാശധ്വനി നിലനിർത്തുകയും ചെയ്യുന്നു. അടിക്കുറിപ്പ് സൂചകം മുഖ്യവാചകത്തിൽ [a] ആയി ചേർത്തിരിക്കുന്നു.
