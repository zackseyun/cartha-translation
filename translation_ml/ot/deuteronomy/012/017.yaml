id: DEU.12.17
reference: Deuteronomy 12:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹֽא תוּכַ֞ל לֶ/אֱכֹ֣ל בִּ/שְׁעָרֶ֗י/ךָ מַעְשַׂ֤ר דְּגָֽנְ/ךָ֙ וְ/תִֽירֹשְׁ/ךָ֣ וְ/יִצְהָרֶ֔/ךָ וּ/בְכֹרֹ֥ת בְּקָרְ/ךָ֖ וְ/צֹאנֶ֑/ךָ וְ/כָל נְדָרֶ֨י/ךָ֙ אֲשֶׁ֣ר תִּדֹּ֔ר וְ/נִדְבֹתֶ֖י/ךָ וּ/תְרוּמַ֥ת יָדֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/017.yaml
  text: You may not eat within your gates the tithe of your grain[a], your new wine, or your oil, or the firstborn of your herd or your flock, or any of your vows that you vow, or your freewill offerings[c][b], or the contribution of your hand.
translation:
  language: ml
  text: നിന്റെ ധാന്യത്തിന്റെയും പുതുവീഞ്ഞിന്റെയും എണ്ണയുടെയും ദശാംശം, നിന്റെ കന്നുകാലികളുടെയും ആട്ടിൻപറ്റത്തിന്റെയും കടിഞ്ഞൂലുകൾ, നീ നേർന്ന നേർച്ചകളെല്ലാം[b], നിന്റെ സ്വമേധാർപ്പണങ്ങൾ, നിന്റെ കൈയുടെ അർപ്പണം[c] എന്നിവ നിന്റെ പട്ടണങ്ങളിൽവെച്ച്[a] ഭക്ഷിക്കാൻ പാടില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “നിന്റെ കവാടങ്ങൾക്കുള്ളിൽ.” പട്ടണങ്ങളെയോ പ്രാദേശിക വാസസ്ഥലങ്ങളെയോ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം.'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: “നിന്റെ നേർച്ചയാർപ്പണങ്ങൾ.” ഇവിടെ വാചികമായ നേർച്ചകൾ മാത്രമല്ല, അവയോടനുബന്ധിച്ച അർപ്പണങ്ങളായിരിക്കാം ഉദ്ദേശ്യം.'
    reason: lexical_alternative
  - marker: c
    text: 'അഥവാ: “നിന്റെ കൈയിൽനിന്നുള്ള അർപ്പണം”; പരമ്പരാഗതമായി, “നിന്റെ കൈയുടെ ഉയർത്തർപ്പണം.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תוּכַל לֶאֱכֹל
  choice: ഭക്ഷിക്കാൻ പാടില്ല
  rationale: יכל + infinitive എന്ന പ്രയോഗം ഇവിടെ കഴിവില്ലായ്മയല്ല, നിയമപരമായ വിലക്കാണ് സൂചിപ്പിക്കുന്നത്; ആ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בִּשְׁעָרֶיךָ
  choice: നിന്റെ പട്ടണങ്ങളിൽ[a]വെച്ചു
  rationale: അക്ഷരാർഥം ‘നിന്റെ കവാടങ്ങൾക്കുള്ളിൽ’ എന്നാണെങ്കിലും, ഇവിടെ പ്രാദേശിക വാസസ്ഥലങ്ങളെയോ പട്ടണങ്ങളെയോ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണിത്.
- source_word: מַעְשַׂר
  choice: ദശാംശം
  rationale: വിളവിൽനിന്നു വേർതിരിക്കുന്ന പത്തിലൊന്ന് എന്ന ആരാധനാസംബന്ധമായ സാങ്കേതിക അർഥം കൃത്യമായി നൽകുന്നു.
- source_word: תִּירֹשְׁךָ
  choice: പുതുവീഞ്ഞ്
  rationale: תירוש സാധാരണയായി പുതിയതോ പുതുതായി ഉത്പാദിപ്പിച്ചതോ ആയ വീഞ്ഞിനെ സൂചിപ്പിക്കുന്നു; മറ്റു വീഞ്ഞുപദങ്ങളിൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: יִצְהָרֶךָ
  choice: എണ്ണ
  rationale: പ്രധാനമായും ഒലിവെണ്ണയെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിലും, മൂലപദത്തിന്റെ പൊതുവായ രൂപം കാത്തുസൂക്ഷിക്കാൻ ‘എണ്ണ’ എന്നു നൽകി.
- source_word: בְכֹרֹת בְּקָרְךָ וְצֹאנֶךָ
  choice: നിന്റെ കന്നുകാലികളുടെയും ആട്ടിൻപറ്റത്തിന്റെയും കടിഞ്ഞൂലുകൾ
  rationale: בכור ആദ്യമായി ജനിച്ച സന്തതിയെ സൂചിപ്പിക്കുന്നു; ‘കടിഞ്ഞൂൽ’ ആരാധനാ-നിയമപരമായ സന്ദർഭത്തിൽ പരിചിതവും സംക്ഷിപ്തവുമായ മലയാളപദമാണ്.
- source_word: כָל נְדָרֶיךָ אֲשֶׁר תִּדֹּר
  choice: നീ നേർന്ന നേർച്ചകളെല്ലാം[b]
  rationale: എബ്രായത്തിലെ ആവർത്തനം മലയാളത്തിൽ സ്വാഭാവികമായി ‘നീ നേർന്ന നേർച്ചകൾ’ എന്നു നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ നേർച്ചയോടനുബന്ധിച്ച അർപ്പണങ്ങളാണ് ഉദ്ദേശ്യമാകാമെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: נִדְבֹתֶיךָ
  choice: നിന്റെ സ്വമേധാദാനങ്ങൾ
  rationale: നിർബന്ധത്താലോ നേർച്ചയാലോ അല്ലാതെ സ്വമേധയാ നൽകുന്ന ആരാധനാസംബന്ധമായ അർപ്പണങ്ങളെ വേർതിരിച്ചു കാണിക്കുന്നു.
- source_word: תְּרוּמַת יָדֶךָ
  choice: നിന്റെ കൈയുടെ അർപ്പണം[c]
  rationale: മൂലത്തിലെ ‘കൈ’ എന്ന ദൃശ്യപ്രയോഗവും תרומהയുടെ അർപ്പണം/വേർതിരിച്ച സംഭാവന എന്ന അർഥവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: നേർച്ചകളെ വാചിക വാഗ്ദാനങ്ങളായോ അവയോടനുബന്ധിച്ച അർപ്പണങ്ങളായോ വിവർത്തനം ചെയ്യുക
  choice: പ്രധാനപാഠത്തിൽ ‘നീ നേർന്ന നേർച്ചകൾ’ എന്നു നൽകി സന്ദർഭപരമായ അർപ്പണാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
  alternative: ‘നേർച്ചയാർപ്പണങ്ങൾ’ എന്നു പ്രധാനപാഠത്തിൽ വ്യക്തമായി നൽകുക.
  rationale: נדר എന്ന പദം നേരിട്ട് ‘നേർച്ച’ എന്നാണ്; എന്നാൽ ഭക്ഷിക്കാവുന്ന വിശുദ്ധ വസ്തുക്കളുടെ പട്ടികയിൽ വരുന്നതിനാൽ നേർച്ചയോടനുബന്ധിച്ച അർപ്പണങ്ങൾ ഉദ്ദേശ്യമാകാം. പ്രധാനപാഠം പദത്തിന്റെ വ്യാപ്തി ചുരുക്കാതെ ഈ സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ആരാധനാസംബന്ധമായ വിവിധ അർപ്പണവിഭാഗങ്ങളുടെ വ്യത്യാസം
  choice: ‘നേർച്ചകൾ,’ ‘സ്വമേധാദാനങ്ങൾ,’ ‘കൈയുടെ അർപ്പണം’ എന്നിങ്ങനെ വ്യത്യസ്ത പദങ്ങൾ നിലനിർത്തി.
  alternative: എല്ലാം പൊതുവായി ‘കാഴ്ചകൾ’ അല്ലെങ്കിൽ ‘ദാനങ്ങൾ’ എന്നു നൽകുക.
  rationale: വാക്യം വേർതിരിച്ചു പറയുന്ന വിശുദ്ധ ദാനവിഭാഗങ്ങളെ ഒന്നാക്കി ചുരുക്കാതിരിക്കാൻ പദവ്യത്യാസം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമഭാഷ ഉപയോഗിച്ചു. നീണ്ട എബ്രായ പട്ടികയുടെ ഘടന നിലനിർത്തിയെങ്കിലും മലയാളവായനയ്ക്ക് അനുയോജ്യമായി ബന്ധകങ്ങളും വിഭക്തികളും ക്രമപ്പെടുത്തി. ‘കടിഞ്ഞൂൽ,’ ‘ദശാംശം,’ ‘നേർച്ച’ തുടങ്ങിയ പരിചിതമായ ബൈബിൾ-ആരാധനാപദങ്ങൾ നിലനിർത്തി; അപരിചിതമായ സാങ്കേതിക പദങ്ങൾ പ്രധാനപാഠത്തിൽ ഒഴിവാക്കി.
