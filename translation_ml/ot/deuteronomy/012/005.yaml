source:
  edition: WLC
  text: כִּ֠י אִֽם אֶל הַ/מָּק֞וֹם אֲשֶׁר יִבְחַ֨ר יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ מִ/כָּל שִׁבְטֵי/כֶ֔ם לָ/שׂ֥וּם אֶת שְׁמ֖/וֹ שָׁ֑ם לְ/שִׁכְנ֥/וֹ תִדְרְשׁ֖וּ וּ/בָ֥אתָ שָֽׁמָּ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/005.yaml
  text: But to the place that Yahweh your God will choose from all your tribes to put his name there[a], for his dwelling, you shall seek, and there you shall go.
translation:
  language: ml
  text: എന്നാൽ നിങ്ങളുടെ ദൈവമായ യഹോവ നിങ്ങളുടെ എല്ലാ ഗോത്രങ്ങളിൽനിന്നും അവിടെ തന്റെ നാമം സ്ഥാപിക്കാനും തന്റെ വാസത്തിനുമായി തിരഞ്ഞെടുക്കുന്ന സ്ഥലത്തെ[a] നിങ്ങൾ അന്വേഷിക്കണം; അവിടേക്കു നിങ്ങൾ പോകണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവിടെ തന്റെ നാമം സ്ഥാപിക്കാൻ, തന്റെ വാസസ്ഥാനമായി.” ഈ ഭാഗത്തെ എബ്രായ പ്രയോഗം സംക്ഷിപ്തമാണ്; ദൈവത്തിന്റെ വാസമാണോ, ആ സ്ഥലം അവന്റെ വാസസ്ഥാനമാണോ, രണ്ടും കൂടിയാണോ ഊന്നിപ്പറയുന്നത് എന്നതിൽ വിവർത്തനങ്ങൾ വ്യത്യാസപ്പെടുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי אִם
  choice: എന്നാൽ
  rationale: മുൻപുള്ള നിരോധനത്തിന് വിപരീതമായി ശരിയായ ആരാധനാസ്ഥലം അവതരിപ്പിക്കുന്ന പ്രയോഗം; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ വൈരുധ്യസൂചകം.
- source_word: הַמָּקוֹם
  choice: സ്ഥലം
  rationale: തിരഞ്ഞെടുക്കപ്പെടാനിരിക്കുന്ന, എന്നാൽ ഇവിടെ വ്യക്തമാക്കാത്ത ഭൗതിക ഇടത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: יִבְחַר
  choice: തിരഞ്ഞെടുക്കുന്ന
  rationale: യഹോവ തിരഞ്ഞെടുക്കാനിരിക്കുന്ന സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന അപൂർണ്ണക്രിയ; മലയാളത്തിലെ ആപേക്ഷിക നിർമാണത്തിൽ ഭാവിസന്ദർഭം സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവികൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവമായ
  rationale: യഹോവയോടു ചേർന്നുള്ള ഉടമസ്ഥബന്ധവും ഉടമ്പടിസംബന്ധമായ അഭിസംബോധനയും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מִכָּל שִׁבְטֵיכֶם
  choice: നിങ്ങളുടെ എല്ലാ ഗോത്രങ്ങളിൽനിന്നും
  rationale: ഇസ്രായേലിന്റെ ഗോത്രങ്ങളുടെ ഇടയിൽനിന്നുള്ള തിരഞ്ഞെടുപ്പ് എന്ന ഉറവിടബന്ധം നിലനിർത്തുന്നു.
- source_word: לָשׂוּם אֶת־שְׁמוֹ שָׁם
  choice: തന്റെ നാമം അവിടെ സ്ഥാപിക്കാൻ
  rationale: ശׂוּם എന്ന ക്രിയയുടെ ‘വയ്ക്കുക/സ്ഥാപിക്കുക’ എന്ന അർഥം സൂക്ഷിക്കുമ്പോൾ ദൈവിക നാമവും അംഗീകൃത ആരാധനാസ്ഥലവും തമ്മിലുള്ള ബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: לְשִׁכְנוֹ
  choice: തന്റെ വാസസ്ഥാനമായി
  rationale: അത്യന്തം സംക്ഷിപ്തവും വ്യാകരണപരമായി ദുഷ്കരവുമായ എബ്രായ പ്രയോഗത്തിന്റെ വാസസ്ഥലമെന്ന ആശയം നിലനിർത്തുന്നു; കൃത്യബന്ധത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: תִדְרְשׁוּ
  choice: നിങ്ങൾ അന്വേഷിക്കണം
  rationale: ശരിയായ ആരാധനാസ്ഥലം തേടിച്ചെല്ലുക എന്ന സന്ദർഭാർഥവും നിർദേശത്തിന്റെ ബലവും നൽകുന്നു.
- source_word: וּבָאתָ שָׁמָּה
  choice: അവിടേക്കു നിങ്ങൾ പോകണം
  rationale: בוא എന്നതിന്റെ ചലനാർഥം ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള യാത്രയായി സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും שָׁמָּה എന്ന ദിശാസൂചന നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ദൈവനാമവും ഏക ആരാധനാസ്ഥലത്തിലെ ദൈവവാസവും
  choice: യഹോവ ... തന്റെ നാമം അവിടെ സ്ഥാപിക്കാൻ ... തന്റെ വാസസ്ഥാനമായി
  alternative: യഹോവ ... തന്റെ വാസത്തിനായി തന്റെ നാമം അവിടെ സ്ഥാപിക്കാൻ
  rationale: വാക്യം ദൈവത്തിന്റെ നാമവും വാസവും തിരഞ്ഞെടുക്കപ്പെട്ട ആരാധനാസ്ഥലവുമായി ബന്ധിപ്പിക്കുന്നു. എന്നാൽ ഇവയുടെ വ്യാകരണബന്ധം സംക്ഷിപ്തമായതിനാൽ പിന്നീടുള്ള ദേവാലയശാസ്ത്രം ഇറക്കുമതി ചെയ്യാതെയും ഒരു വ്യാഖ്യാനം നിർബന്ധിക്കാതെയും രണ്ട് ആശയങ്ങളും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, പൊതുവായ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. ദൈവനാമമായി ‘യഹോവ’ നിലനിർത്തിയിരിക്കുന്നു. ദുഷ്കരമായ לְשִׁכְנוֹ എന്ന പ്രയോഗത്തിന്റെ യഥാർഥ അനിശ്ചിതത്വം മുഖ്യവാക്യത്തിലെ വിരാമവും അടിക്കുറിപ്പും വഴി സംരക്ഷിച്ചിരിക്കുന്നു.
