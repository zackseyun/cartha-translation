    rationale: כִּי תַעֲשֶׂה is a causal/grounding clause with an imperfect verb, not an imperative. “ചെയ്യണം” adds a direct command and obscures the source’s stated rationale/expected future action.
  - severity: low
    issue: The existing footnote documents the altered imperative rendering rather than a lexical ambiguity in the translated wording.
    rationale: Once the main clause is rendered faithfully as a causal future statement, that explanatory note is no longer applicable. A note on “മക്കൾ” better preserves the explicit lexical alternative noted in the audit trail.
