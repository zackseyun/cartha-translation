language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹ֖א תֹּאכְלֶ֑/נּוּ לְמַ֨עַן יִיטַ֤ב לְ/ךָ֙ וּ/לְ/בָנֶ֣י/ךָ אַחֲרֶ֔י/ךָ כִּֽי תַעֲשֶׂ֥ה הַ/יָּשָׁ֖ר בְּ/עֵינֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/025.yaml
  text: You shall not eat it[a], so that it may go well with you and with your children after you, because you will do what is right in the eyes of Yahweh.
translation:
  language: ml
  text: നീ അത് തിന്നരുത്; നിനക്കും നിനക്കുശേഷം നിന്റെ മക്കൾക്കും നന്മ ഉണ്ടാകേണ്ടതിന്, കാരണം യഹ്‌വേയുടെ ദൃഷ്ടിയിൽ ശരിയായത് നീ ചെയ്യും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “നിനക്കുശേഷമുള്ള നിന്റെ പുത്രന്മാർ”; വിശാലമായ അർഥത്തിൽ, “നിന്റെ സന്തതി.”
    reason: ഹീബ്രു בָנֶיךָ എന്നതിന് സന്ദർഭമനുസരിച്ച് ‘പുത്രന്മാർ,’ ‘മക്കൾ,’ അല്ലെങ്കിൽ പിൽക്കാല ‘സന്തതി’ എന്ന അർഥസാദ്ധ്യതയുണ്ട്.
lexical_decisions:
- source_word: תֹּאכְלֶנּוּ
  choice: നീ അത് തിന്നരുത്
  rationale: אָכַל എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘തിന്നുക’ എന്നാണ്; ഏകവചന കർമപ്രത്യയം മുൻസന്ദർഭത്തിലെ രക്തത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: לְמַעַן יִיטַב לְךָ
  choice: നിനക്ക് നന്മ വരേണ്ടതിന്
  rationale: ലക്ഷ്യവും ഫലവും സൂചിപ്പിക്കുന്ന לְמַעַן എന്നതിനെയും ‘നന്നായിരിക്കുക/നന്മ വരുക’ എന്ന ആവർത്തനപുസ്തകത്തിലെ ഉടമ്പടി പ്രയോഗത്തെയും സ്വാഭാവികമായി നിലനിർത്തുന്നു; ഭൗതിക സമൃദ്ധിയിലേക്കു മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: וּלְבָנֶיךָ אַחֲרֶיךָ
  choice: നിനക്കുശേഷം നിന്റെ മക്കൾക്കും
  rationale: בָּנִים എന്നത് പുത്രന്മാരെ പ്രത്യേകമായും മക്കളെയോ സന്തതിയെയോ വിശാലമായും സൂചിപ്പിക്കാം. ഇവിടെ കുടുംബപരമ്പരയെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്ന ‘മക്കൾ’ തിരഞ്ഞെടുത്തു.
- source_word: כִּי תַעֲשֶׂה
  choice: നീ ചെയ്യണം
  rationale: כִּי തുടർന്നുള്ള അനുസരണത്തെ ക്ഷേമത്തിന്റെ അടിസ്ഥാനമായി അവതരിപ്പിക്കുന്നു. ഹീബ്രു അപൂർണക്രിയയുടെ പ്രതീക്ഷിത/നിർദ്ദേശാത്മക ഭാവം മലയാളത്തിൽ ‘ചെയ്യണം’ എന്നു സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הַיָּשָׁר
  choice: ശരിയായതു
  rationale: יָשָׁר എന്നതിന്റെ നേരായ, നീതിയായ, ശരിയായ എന്ന നൈതിക അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: בְּעֵינֵי יְהוָה
  choice: യഹ്‌വേയുടെ ദൃഷ്ടിയിൽ
  rationale: ദൈവിക വിലയിരുത്തലിനെ സൂചിപ്പിക്കുന്ന ഹീബ്രു ‘കണ്ണുകളിൽ’ എന്ന പ്രയോഗത്തിന്റെ അർഥവും രൂപകത്തിന്റെ സ്വഭാവവും മലയാളത്തിൽ സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് ഉള്ളതിനാൽ അതിനെ പദവിയാക്കി മാറ്റാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരം ചെയ്തു.
- issue: בָנֶיךָ എന്നതിന്റെ പരിധി
  choice: മക്കൾ
  alternative: പുത്രന്മാർ; സന്തതി
  rationale: രൂപം വ്യാകരണപരമായി പുല്ലിംഗ ബഹുവചനമാണെങ്കിലും ഉടമ്പടി സന്ദർഭത്തിൽ ഒരാളുടെ പിൽക്കാല സന്തതിയെ പ്രതിനിധാനപരമായി ഉൾക്കൊള്ളാം. ‘മക്കൾ’ കുടുംബബന്ധം നിലനിർത്തുകയും പുരുഷന്മാരിലേക്കു മാത്രം അർഥം അനാവശ്യമായി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: כִּי תַעֲשֶׂה എന്നതിലെ ബന്ധം
  choice: ക്ഷേമവുമായി ബന്ധപ്പെട്ട അനുസരണത്തിന്റെ അടിസ്ഥാനം/വ്യവസ്ഥയായി അവതരിപ്പിക്കൽ
  alternative: ‘കാരണം നീ ചെയ്യും’ എന്ന കർശന ഭാവികാല പ്രസ്താവന
  rationale: സന്ദർഭത്തിൽ ക്ഷേമവും ശരിയായതു ചെയ്യുന്നതും തമ്മിലുള്ള ബന്ധമാണ് പ്രധാനം. മലയാളത്തിലെ ‘ചെയ്യണം’ നിർദ്ദേശാത്മക-വ്യവസ്ഥാത്മക അർഥം സ്വാഭാവികമായി നൽകുന്നു; [a]യിൽ കൂടുതൽ അക്ഷരാർഥസാദ്ധ്യത രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഏകവചന അഭിസംബോധന നിലനിർത്തി. ദൈവനാമം ‘യഹ്‌വേ’ എന്നു നൽകിയിരിക്കുന്നു; ഉടമ്പടി ക്ഷേമത്തെ ‘നന്മ വരുക’ എന്നു വിശാലമായി അവതരിപ്പിച്ചിരിക്കുന്നു.
