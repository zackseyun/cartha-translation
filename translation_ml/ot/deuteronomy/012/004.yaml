  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹֽא תַעֲשׂ֣וּ/ן כֵּ֔ן לַ/יהוָ֖ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/004.yaml
  text: You shall not do so to Yahweh your God[a][b].
translation:
  language: ml
  text: നിങ്ങളുടെ ദൈവമായ യാഹ്‌വേയോടു നിങ്ങൾ അങ്ങനെ ചെയ്യരുത്.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അങ്ങനെ’ എന്നത് മുൻപുള്ള കല്പനകളിൽ ജനതകളുടെ ആരാധനാസ്ഥലങ്ങളോടു ചെയ്യാൻ പറഞ്ഞ കാര്യങ്ങളിലേക്കു ചൂണ്ടുന്നു; യാഹ്‌വേയോടു നിങ്ങൾ അങ്ങനെ ചെയ്യരുത്.
    reason: cross_reference
  - marker: b
    text: 'ഹീബ്രു: YHWH. ‘യാഹ്‌വേ’ എന്നത് വ്യാപകമായി ഉപയോഗിക്കുന്ന പണ്ഡിതോചിത പുനർനിർമാണമാണ്; യഥാർത്ഥ പുരാതന ഉച്ചാരണം പൂർണമായി ഉറപ്പില്ല. ‘യഹോവ’ ഒരു പരമ്പരാഗത രൂപമാണ്; പരമ്പരാഗത പരിഭാഷയിൽ ‘കർത്താവ്’ എന്നും നൽകാറുണ്ട്.'
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא תַעֲשׂוּן
  choice: നിങ്ങൾ ചെയ്യരുത്
  rationale: לֹאയോടുകൂടിയ ഖാൽ അപൂർണക്രിയ രണ്ടാം പുരുഷ ബഹുവചനം നിയമസന്ദർഭത്തിൽ നേരിട്ടുള്ള നിരോധനം അറിയിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘ചെയ്യരുത്’ അതിനെ സ്വാഭാവികമായും കൃത്യമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: כֵּן
  choice: അങ്ങനെ
  rationale: മുൻവാക്യങ്ങളിൽ പറഞ്ഞ പ്രവൃത്തിരീതിയിലേക്കു പിന്നോട്ടു ചൂണ്ടുന്ന പദമാണ്; ‘അങ്ങനെ’ അതിന്റെ സംക്ഷിപ്തമായ അനാഫോറിക സ്വഭാവം നിലനിർത്തുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയോട്
  rationale: לְ ഇവിടെ ബന്ധമോ ഒരാളോടുള്ള പെരുമാറ്റത്തിന്റെ ദിശയോ സൂചിപ്പിക്കുന്നു. ‘യഹോവയോട്’ എന്നത് ദൈവത്തെ ആ രീതിയിൽ പരിഗണിക്കരുതെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവമായ
  rationale: രണ്ടാം പുരുഷ ബഹുവചന പ്രത്യയമുള്ള രൂപം ഉടമ്പടിബന്ധത്തെ വ്യക്തമാക്കുന്നു. മലയാളത്തിൽ ദൈവനാമത്തോടു ചേർത്ത് ‘നിങ്ങളുടെ ദൈവമായ യഹോവ’ എന്നു പറയുന്നത് വ്യക്തവും സ്വാഭാവികവുമാണ്.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വേ
  rationale: ഹീബ്രു പാഠത്തിലെ വ്യക്തിനാമം മറയ്ക്കാതെ മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ ഉപയോഗിച്ചു; ഉച്ചാരണത്തെക്കുറിച്ചുള്ള അനിശ്ചിതത്വവും പരമ്പരാഗത പകരംവിവർത്തനവും അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- issue: നിരോധനത്തിന്റെ സന്ദർഭപരമായ വ്യാപ്തി
  choice: മുൻവിവരിച്ച രീതിയിൽ യഹോവയോട് പ്രവർത്തിക്കരുതെന്ന സംക്ഷിപ്ത നിരോധനം
  alternative: യഹോവയുടെ ആരാധനാസ്ഥലങ്ങളും വസ്തുക്കളും നശിപ്പിക്കരുതെന്ന വിശദീകരിച്ച രൂപം
  rationale: כֵּן എന്ന പദം മുൻസന്ദർഭത്തെ ആശ്രയിക്കുന്നതിനാൽ മുഖ്യപാഠത്തിൽ ഹീബ്രുവിന്റെ സംക്ഷിപ്തതയും തുറന്ന നിലയും സൂക്ഷിച്ചു; സന്ദർഭബന്ധം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ നിയമനിർദേശ ശൈലി. ഹീബ്രുവിലെ സംക്ഷിപ്തത നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ സ്വാഭാവിക പദക്രമം ഉപയോഗിച്ചു; എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
