reference: Deuteronomy 12:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הִשָּׁ֣מֶר לְ/ךָ֗ פֶּן תִּנָּקֵשׁ֙ אַחֲרֵי/הֶ֔ם אַחֲרֵ֖י הִשָּׁמְדָ֣/ם מִ/פָּנֶ֑י/ךָ וּ/פֶן תִּדְרֹ֨שׁ לֵֽ/אלֹהֵי/הֶ֜ם לֵ/אמֹ֨ר אֵיכָ֨ה יַעַבְד֜וּ הַ/גּוֹיִ֤ם הָ/אֵ֨לֶּה֙ אֶת אֱלֹ֣הֵי/הֶ֔ם וְ/אֶעֱשֶׂה כֵּ֖ן גַּם אָֽנִי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/030.yaml
  text: Be careful for yourself, lest you be ensnared after them, after they have been destroyed from before you, and lest you inquire about their gods, saying, “How did these nations serve their gods, so that I too may do the same?”
translation:
  language: ml
  text: അവർ നിന്റെ മുമ്പിൽനിന്ന് നശിപ്പിക്കപ്പെട്ടശേഷം, അവരുടെ പിന്നാലെ പോയി നീ കെണിയിൽപ്പെടാതിരിക്കാനും, “ഈ ജനതകൾ തങ്ങളുടെ ദേവന്മാരെ എങ്ങനെയാണ് ആരാധിച്ചിരുന്നത്? ഞാനും അങ്ങനെതന്നെ ചെയ്യും” എന്നു പറഞ്ഞ് അവരുടെ ദേവന്മാരെക്കുറിച്ച് അന്വേഷിക്കാതിരിക്കാനും നീ സൂക്ഷിച്ചുകൊള്ളുക.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: നീ സൂക്ഷിച്ചുകൊള്ളുക
  rationale: ആത്മപ്രയോജനസൂചകമായ לְךָ ഉൾക്കൊള്ളുന്ന ശക്തമായ സ്വയംജാഗ്രതാ മുന്നറിയിപ്പ് സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: תִּנָּקֵשׁ אַחֲרֵיהֶם
  choice: അവരുടെ പിന്നാലെ പോയി നീ കെണിയിൽപ്പെടുക
  rationale: נקש എന്ന കെണിയിൽ അകപ്പെടുക എന്ന രൂപകവും אַחֲרֵיהֶם എന്ന ‘അവരുടെ പിന്നാലെ’ എന്ന ആശയവും നിലനിർത്തുന്നു; പശ്ചാത്തലത്തിൽ അവരുടെ ആചാരങ്ങളെ പിന്തുടരുന്നതാണ് സൂചന.
- source_word: הִשָּׁמְדָם מִפָּנֶיךָ
  choice: അവർ നിന്റെ മുമ്പിൽനിന്ന് നശിപ്പിക്കപ്പെട്ടശേഷം
  rationale: ഹിഫിൽ പാസീവ് ഇൻഫിനിറ്റീവിന്റെ നശിപ്പിക്കപ്പെടുക എന്ന കാരണക-കർമ്മണി ഭാവവും מִפָּנֶיךָയുടെ സ്ഥലബന്ധവും സംരക്ഷിക്കുന്നു.
- source_word: תִדְרֹשׁ לֵאלֹהֵיהֶם
  choice: അവരുടെ ദേവന്മാരെക്കുറിച്ച് അന്വേഷിക്കുക
  rationale: דרשׁ ഇവിടെ ആരാധനാരീതികൾ അറിയാൻ തിരക്കുക/അന്വേഷിക്കുക എന്ന അർത്ഥത്തിലാണ്; ‘ദേവന്മാരെ തേടുക’ എന്ന മറ്റൊരു സാധ്യതയേക്കാൾ തുടർന്നുള്ള നേരിട്ടുള്ള ചോദ്യവുമായി ഇത് സ്വാഭാവികമായി ചേരുന്നു.
- source_word: יַעַבְדוּ
  choice: ആരാധിച്ചിരുന്നത്
  rationale: עבד അടിസ്ഥാനത്തിൽ ‘സേവിക്കുക’ എന്നാണ്; ദേവന്മാരോടുള്ള ബന്ധത്തിൽ മലയാളത്തിലെ സ്വാഭാവിക മതപരമായ പ്രയോഗമായ ‘ആരാധിക്കുക’ സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു.
- source_word: וְאֶעֱשֶׂה כֵּן גַּם אָנִי
  choice: ഞാനും അങ്ങനെതന്നെ ചെയ്യട്ടെ
  rationale: ആദ്യപുരുഷ ഇംപർഫെക്റ്റിന്റെ സാഹചര്യജന്യ ഉദ്ദേശ/ആഗ്രഹഭാവം നൽകുന്നു; അന്യജനതകളുടെ ആരാധനാരീതി അനുകരിക്കാനുള്ള ലക്ഷ്യം നിലനിർത്തുന്നു.
theological_decisions:
- issue: നിരോധിക്കപ്പെടുന്ന അന്വേഷണത്തിന്റെ സ്വഭാവം
  choice: അനുകരിക്കാനുള്ള ഉദ്ദേശത്തോടെ ദേവന്മാരുടെ ആരാധനാരീതികളെക്കുറിച്ച് അന്വേഷിക്കൽ എന്ന നിലയിൽ വാക്യഘടന നിലനിർത്തി
  alternative: ദേവന്മാരെ ഏതു തരത്തിലും അന്വേഷിക്കുന്നതെല്ലാം എന്ന വിപുലീകരണം
  rationale: ഹീബ്രു വാക്യത്തിൽ അന്വേഷണത്തെ തുടർന്നുള്ള ഉദ്ധരണി ‘ഞാനും അങ്ങനെതന്നെ ചെയ്യട്ടെ’ എന്ന അനുകരണലക്ഷ്യം വ്യക്തമാക്കുന്നു; പാഠത്തിൽ ഇല്ലാത്ത വ്യാപ്തി ചേർത്തിട്ടില്ല.
- issue: ദൈവിക പ്രവർത്തകന്റെ പരോക്ഷത
  choice: ‘നശിപ്പിക്കപ്പെട്ടശേഷം’ എന്ന കർമ്മണി രൂപം നിലനിർത്തി
  alternative: ‘യഹോവ അവരെ നശിപ്പിച്ചശേഷം’ എന്ന് പ്രവർത്തകനെ വ്യക്തമാക്കുക
  rationale: സന്ദർഭത്തിൽ ദൈവിക പ്രവർത്തനം സൂചിപ്പിക്കപ്പെടാമെങ്കിലും ഈ വാക്യഖണ്ഡം പ്രവർത്തകനെ പേരെടുത്തുപറയുന്നില്ല; അതിനാൽ ഉറവിടത്തിലെ പരോക്ഷത സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ദീർഘമായ ഹീബ്രു മുന്നറിയിപ്പ്-വാക്യം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ആശ്രിതഖണ്ഡങ്ങൾ മുന്നിലും മുഖ്യകല്പന അവസാനത്തും ക്രമപ്പെടുത്തി; രൂപകവും ഉദ്ദേശഭാവവും നിലനിർത്തി.
