  naturalness: പരിഷ്കൃത വാക്യം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികമായ ബന്ധവാക്യക്രമം ഉപയോഗിക്കുന്നു. ‘തഴച്ചുവളരുന്ന എല്ലാ വൃക്ഷങ്ങളുടെയും’ എന്ന രൂപത്തിനു പകരം ‘ഓരോ പച്ചപ്പാർന്ന വൃക്ഷത്തിന്റെയും’ എന്നത് എബ്രായത്തിലെ വിതരണാർഥമുള്ള ‘ഓരോ’യെ കൂടുതൽ വ്യക്തമായി നൽകുന്നു.
