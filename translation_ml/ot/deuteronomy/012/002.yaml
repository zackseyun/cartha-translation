source:
  edition: WLC
  text: אַבֵּ֣ד תְּ֠אַבְּדוּ/ן אֶֽת כָּל הַ/מְּקֹמ֞וֹת אֲשֶׁ֧ר עָֽבְדוּ שָׁ֣ם הַ/גּוֹיִ֗ם אֲשֶׁ֥ר אַתֶּ֛ם יֹרְשִׁ֥ים אֹתָ֖/ם אֶת אֱלֹהֵי/הֶ֑ם עַל הֶ/הָרִ֤ים הָֽ/רָמִים֙ וְ/עַל הַ/גְּבָע֔וֹת וְ/תַ֖חַת כָּל עֵ֥ץ רַעֲנָן־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/002.yaml
  text: You must surely destroy all the places where the nations whom you are dispossessing served their gods[a], on the high mountains, on the hills, and under every green tree.
translation:
  language: ml
  text: നിങ്ങൾ പുറത്താക്കാനിരിക്കുന്ന ജനതകൾ തങ്ങളുടെ ദേവന്മാരെ സേവിച്ചിരുന്ന എല്ലാ സ്ഥലങ്ങളും—ഉയർന്ന മലകളിലും കുന്നുകളിലും ഓരോ പച്ചപ്പാർന്ന വൃക്ഷത്തിന്റെയും കീഴിലുമുള്ളവ—നിങ്ങൾ നിശ്ശേഷം നശിപ്പിക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “തങ്ങളുടെ ദേവന്മാരെ ആരാധിച്ചിരുന്ന.” എബ്രായ ക്രിയയ്ക്ക് മതപരമായ അർഥത്തിൽ ‘സേവിക്കുക’ എന്നും ‘ആരാധിക്കുക’ എന്നും അർഥമാകാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַבֵּד תְּאַבְּדוּן
  choice: നിങ്ങൾ നിർബന്ധമായും നശിപ്പിക്കണം
  rationale: ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ടും ഫൈനിറ്റ് ക്രിയയും ചേർന്ന പ്രയോഗം കല്പനയ്ക്ക് ശക്തമായ ഊന്നൽ നൽകുന്നു. ‘നിർബന്ധമായും’ ആ ഊന്നൽ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: כָּל הַמְּקֹמוֹת
  choice: സ്ഥലങ്ങളെല്ലാം
  rationale: ഇവിടെ מָקוֹם പൊതുവായ സ്ഥലം എന്നതിലുപരി ആരാധനയുമായി ബന്ധപ്പെട്ട നിർദിഷ്ട ഇടങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; എന്നാൽ മൂലപാഠത്തിലെ ലളിതമായ ‘സ്ഥലങ്ങൾ’ എന്ന രൂപം നിലനിർത്തുന്നു.
- source_word: עָבְדוּ שָׁם ... אֶת אֱלֹהֵיהֶם
  choice: തങ്ങളുടെ ദേവന്മാരെ സേവിച്ചിരുന്ന
  rationale: עבד ദേവന്മാരെ സംബന്ധിച്ച് മതപരമായ സേവനത്തെയോ ആരാധനയെയോ സൂചിപ്പിക്കാം. ‘സേവിച്ചിരുന്ന’ എന്നത് മൂലക്രിയയോട് അടുത്തുനിൽക്കുകയും മതപരമായ അർഥം സന്ദർഭത്തിൽ വ്യക്തമാകുകയും ചെയ്യുന്നു.
- source_word: הַגּוֹיִם
  choice: ജനതകൾ
  rationale: ദേശത്ത് പാർത്തിരുന്ന ഇസ്രായേലേതര ജനവിഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ജനതകൾ’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും പിൽക്കാല മതസാങ്കേതിക അർഥങ്ങൾ ഒഴിവാക്കുന്നതുമാണ്.
- source_word: אֲשֶׁר אַתֶּם יֹרְשִׁים אֹתָם
  choice: നിങ്ങൾ കൈവശമാക്കാൻ പോകുന്ന ജനതകൾ
  rationale: ירשׁ കീഴടക്കൽസന്ദർഭത്തിൽ മുൻനിവാസികളെ നീക്കി കൈവശപ്പെടുത്തുക എന്ന അർഥം വഹിക്കുന്നു. മലയാളത്തിൽ വ്യക്തികളായ ജനതകളെ നേരിട്ട് ‘കൈവശമാക്കുക’ എന്നു പറയുന്നത് അല്പം അസ്വാഭാവികമാണെങ്കിലും, ഈ രൂപം മൂലത്തിലെ നേരിട്ടുള്ള കർമബന്ധവും കൈവശപ്പെടുത്തലിന്റെ ആശയവും നിലനിർത്തുന്നു.
- source_word: עַל הֶהָרִים הָרָמִים
  choice: ഉയർന്ന മലകളിലും
  rationale: നാമവും അതിനെ വിശേഷിപ്പിക്കുന്ന പദവും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്ന സ്വാഭാവിക വിവർത്തനം.
- source_word: וְעַל הַגְּבָעוֹת
  choice: കുന്നുകളിലും
  rationale: גְּבָעוֹת എന്നതിന്റെ നേരിട്ടും സാധാരണവുമായ മലയാളരൂപം.
- source_word: וְתַחַת כָּל עֵץ רַעֲנָן
  choice: തഴച്ചുവളരുന്ന എല്ലാ വൃക്ഷങ്ങളുടെയും കീഴിലും
  rationale: רַעֲנָן പച്ചപ്പും ഇലസമൃദ്ധിയും സജീവവളർച്ചയും സൂചിപ്പിക്കുന്നു. ‘തഴച്ചുവളരുന്ന’ എന്നത് ‘പച്ച’ എന്ന നിറസൂചനയെക്കാൾ ഈ ഗുണം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: നശിപ്പിക്കേണ്ടതിന്റെ സ്വഭാവം
  choice: മറ്റു ജനതകളുടെ ദേവാരാധന നടന്നിരുന്ന നിർദിഷ്ട സ്ഥലങ്ങളെയാണ് കല്പനയുടെ നേരിട്ടുള്ള കർമമായി നിലനിർത്തിയത്.
  alternative: വിഗ്രഹാരാധനാരീതികളെ പൊതുവായി ഇല്ലാതാക്കുക എന്ന വിപുലമായ പരാവർത്തനം.
  rationale: എബ്രായപാഠത്തിലെ നേരിട്ടുള്ള കർമം ‘സ്ഥലങ്ങളെല്ലാം’ എന്നതാണ്; ആരാധനാരീതികൾ എന്ന വിപുലമായ ആശയം സന്ദർഭത്തിൽ ഉൾക്കൊള്ളാമെങ്കിലും അത് വിവർത്തനത്തിൽ ചേർത്തിട്ടില്ല.
- issue: עבד എന്ന ക്രിയയുടെ മതപരമായ അർഥം
  choice: ‘സേവിച്ചിരുന്ന’ എന്ന് വിവർത്തനം ചെയ്ത് ആരാധന/സേവനം എന്ന അർഥവ്യാപ്തി നിലനിർത്തി.
  alternative: ‘ആരാധിച്ചിരുന്ന’ എന്ന് വ്യക്തമായി നൽകുക.
  rationale: ദേവന്മാരോടുള്ള ബന്ധത്തിൽ ക്രിയയ്ക്ക് ആരാധനയുടെ അർഥമുണ്ടെങ്കിലും ‘സേവിക്കുക’ മൂലപദത്തിന്റെ വിശാലതയും ദൈവിക അധികാരത്തിന് കീഴടങ്ങിയുള്ള സേവനത്തിന്റെ ഭാവവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. കല്പനയിലെ ഊന്നൽ ‘നിർബന്ധമായും’ എന്നതിലൂടെ പ്രകടമാക്കി. വാക്യത്തിലെ ദീർഘമായ ബന്ധവാക്യം വായനാസൗകര്യത്തിനായി ഡാഷുകൾക്കിടയിൽ ഭൂമിശാസ്ത്രപരമായ പട്ടികയായി ക്രമപ്പെടുത്തി.
