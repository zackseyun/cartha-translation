- from: നിങ്ങൾ കൈവശമാക്കാൻ പോകുന്ന ജനതകൾ തങ്ങളുടെ ദേവന്മാരെ സേവിച്ചിരുന്ന സ്ഥലങ്ങളെല്ലാം—ഉയർന്ന മലകളിലും കുന്നുകളിലും തഴച്ചുവളരുന്ന എല്ലാ വൃക്ഷങ്ങളുടെയും കീഴിലുമുള്ളവ—നിങ്ങൾ നിർബന്ധമായും നശിപ്പിക്കണം.[a]
  to: നിങ്ങൾ പുറത്താക്കാനിരിക്കുന്ന ജനതകൾ തങ്ങളുടെ ദേവന്മാരെ സേവിച്ചിരുന്ന എല്ലാ സ്ഥലങ്ങളും—ഉയർന്ന മലകളിലും കുന്നുകളിലും ഓരോ പച്ചപ്പാർന്ന വൃക്ഷത്തിന്റെയും കീഴിലുമുള്ളവ—നിങ്ങൾ നിശ്ശേഷം നശിപ്പിക്കണം.[a]
  rationale: ‘കൈവശമാക്കാൻ പോകുന്ന ജനതകൾ’ എന്ന അസ്വാഭാവികവും അർഥം ചുരുക്കുന്നതുമായ പ്രയോഗം ‘പുറത്താക്കാനിരിക്കുന്ന ജനതകൾ’ എന്ന് തിരുത്തി, ഈ കീഴടക്കസന്ദർഭത്തിലെ יָרַשׁ-ന്റെ അർഥം പുനഃസ്ഥാപിച്ചു. ‘നിശ്ശേഷം’ കല്പനയുടെ ഊന്നൽ വ്യക്തമാക്കുന്നു. ‘ഓരോ പച്ചപ്പാർന്ന വൃക്ഷത്തിന്റെയും’ എന്നത് כָּל עֵץ-ന്റെ വിതരണാർഥവും רַעֲנָן-ന്റെ പച്ചപ്പാർന്ന/ഇലസമൃദ്ധമായ ഭാവവും സ്വാഭാവികമായി നൽകുന്നു.
