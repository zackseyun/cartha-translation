  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּֽי יַכְרִית֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ אֶת הַ/גּוֹיִ֗ם אֲשֶׁ֨ר אַתָּ֥ה בָא שָׁ֛מָּ/ה לָ/רֶ֥שֶׁת אוֹתָ֖/ם מִ/פָּנֶ֑י/ךָ וְ/יָרַשְׁתָּ֣ אֹתָ֔/ם וְ/יָשַׁבְתָּ֖ בְּ/אַרְצָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/029.yaml
  text: When Yahweh your God cuts off the nations before you, which you are going in there to dispossess, and you dispossess them and dwell in their land,
translation:
  language: ml
  text: നിന്റെ ദൈവമായ യഹോവ, അവരെ സ്ഥാനഭ്രഷ്ടരാക്കാൻ നീ അവിടേക്കു പോകുന്ന ജനതകളെ നിന്റെ മുമ്പിൽനിന്ന് നീക്കിക്കളയുകയും, നീ അവരെ സ്ഥാനഭ്രഷ്ടരാക്കി അവരുടെ ദേശത്ത് പാർക്കുകയും ചെയ്യുമ്പോൾ,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: ചെയ്യുമ്പോൾ
  rationale: തുടർന്നുവരുന്ന മുന്നറിയിപ്പിന്റെ ഭാവികാല സാഹചര്യം അവതരിപ്പിക്കുന്ന കാലസൂചക പ്രയോഗമായതിനാൽ ‘ചെയ്യുമ്പോൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: יַכְרִית
  choice: ഛേദിച്ചുകളയുകയും
  rationale: ഹിഫിൽ രൂപം ജനതകളെ ഇസ്രായേലിന്റെ മുമ്പിൽനിന്ന് നീക്കിക്കളയുന്നതിനെ സൂചിപ്പിക്കുന്നു; സമ്പൂർണ ഉന്മൂലനം എന്നു അധികമായി നിർവചിക്കാതെ כרת എന്നതിന്റെ രൂപകം നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: രണ്ടാംപുരുഷ ഏകവചന പ്രത്യയമുള്ള രൂപം; മലയാളത്തിൽ ദൈവനാമത്തോടു സ്വാഭാവികമായി ചേരുന്ന വിധത്തിൽ വിവർത്തനം ചെയ്തു.
- source_word: הַגּוֹיִם
  choice: ജനതകളെ
  rationale: ദേശത്തിലെ വിവിധ ജനസമൂഹങ്ങളെ സൂചിപ്പിക്കുന്ന גוים എന്ന പദത്തിന്റെ സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ മലയാളരൂപം.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה לָרֶשֶׁת אֹתָם
  choice: നീ കൈവശപ്പെടുത്താൻ പ്രവേശിക്കുന്ന ജനതകളെ
  rationale: ‘അവിടേക്ക് വരുക/പോകുക’ എന്ന ഹീബ്രായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി ‘പ്രവേശിക്കുക’ എന്നും, ירש-ന്റെ കൈവശമാക്കൽ/സ്ഥാനഭ്രഷ്ടരാക്കൽ അർഥവ്യാപ്തി ‘കൈവശപ്പെടുത്തുക’ എന്നും നൽകി.
- source_word: מִפָּנֶיךָ
  choice: നിന്റെ മുമ്പിൽനിന്ന്
  rationale: ഇസ്രായേലിന്റെ സാന്നിധ്യത്തിൽനിന്നോ വഴിയിൽനിന്നോ നീക്കം ചെയ്യപ്പെടുന്നു എന്ന ഹീബ്രായ പ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וְיָרַשְׁתָּ אֹתָם
  choice: നീ അവരെ കൈവശപ്പെടുത്തി
  rationale: വ്യക്തികളെ സ്വത്തായി കൈവശമാക്കുന്നു എന്നല്ല, ദേശവാസികളായ അവരുടെ സ്ഥാനം ഏറ്റെടുക്കുന്നു എന്ന സന്ദർഭാർഥം; മൂലത്തിലെ ആവർത്തനം നിലനിർത്തി.
- source_word: וְיָשַׁבְתָּ בְּאַרְצָם
  choice: അവരുടെ ദേശത്ത് പാർക്കുകയും
  rationale: ישב എന്നതിന്റെ വസിക്കുക/താമസിക്കുക എന്ന അർഥവും ഉടമ്പടിസംബന്ധമായ ഗൗരവമുള്ള ശൈലിയും ‘പാർക്കുക’ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അത് ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിലെ സ്ഥാപിത ലിപ്യന്തരണം സ്വീകരിച്ചു.
- issue: ירש എന്ന പദത്തിന്റെ കൈവശമാക്കൽ—സ്ഥാനഭ്രഷ്ടരാക്കൽ അർഥവ്യാപ്തി
  choice: കൈവശപ്പെടുത്തുക
  alternative: പുറത്താക്കി കൈവശമാക്കുക
  rationale: മൂലപദം സന്ദർഭത്തിൽ നിലവിലെ വാസികളെ സ്ഥാനഭ്രഷ്ടരാക്കി കൈവശമാക്കുന്നതിനെ സൂചിപ്പിക്കാമെങ്കിലും, ക്രിയയിൽ ഇല്ലാത്ത രണ്ടു പ്രവർത്തനങ്ങൾ വിശദമായി ചേർക്കാതെ അതിന്റെ സംക്ഷിപ്തതയും അർഥതുറപ്പും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായെങ്കിലും നിയമാവർത്തനത്തിന്റെ ഗൗരവമുള്ള ഉടമ്പടിശൈലി നിലനിർത്തുന്ന ഭാഷ. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനത്തിൽ അർധവിരാമമല്ല, കോമയാണ് ഉപയോഗിച്ചത്.
