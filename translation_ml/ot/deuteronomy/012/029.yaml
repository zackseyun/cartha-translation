revisions:
- from: നിന്റെ ദൈവമായ യഹോവ നിന്റെ മുമ്പിൽനിന്ന്, നീ കൈവശപ്പെടുത്താൻ പ്രവേശിക്കുന്ന ജനതകളെ ഛേദിച്ചുകളയുകയും നീ അവരെ കൈവശപ്പെടുത്തി അവരുടെ ദേശത്ത് പാർക്കുകയും ചെയ്യുമ്പോൾ,
  to: നിന്റെ ദൈവമായ യഹോവ, അവരെ സ്ഥാനഭ്രഷ്ടരാക്കാൻ നീ അവിടേക്കു പോകുന്ന ജനതകളെ നിന്റെ മുമ്പിൽനിന്ന് നീക്കിക്കളയുകയും, നീ അവരെ സ്ഥാനഭ്രഷ്ടരാക്കി അവരുടെ ദേശത്ത് പാർക്കുകയും ചെയ്യുമ്പോൾ,
  rationale: 'The revision preserves the verse''s temporal, incomplete sentence structure and its sequence: Yahweh removes the nations; Israel goes there to dispossess them; Israel dispossesses them and lives in their land. It replaces potentially misleading or unnatural Malayalam with contextually precise modern wording, while retaining the source''s restrained description rather than elaborating the historical action.'
