source:
  edition: WLC
  text: רַ֧ק קָֽדָשֶׁ֛י/ךָ אֲשֶׁר יִהְי֥וּ לְ/ךָ֖ וּ/נְדָרֶ֑י/ךָ תִּשָּׂ֣א וּ/בָ֔אתָ אֶל הַ/מָּק֖וֹם אֲשֶׁר יִבְחַ֥ר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/026.yaml
  text: But only your holy things that belong to you[a], and your vow offerings, you shall carry and come to the place that Yahweh will choose.
translation:
  language: ml
  text: എന്നാൽ നിനക്കുള്ള വിശുദ്ധവസ്തുക്കളും നിന്റെ നേർച്ചകളും[a] മാത്രം നീ ചുമന്നുകൊണ്ട് യഹ്‌വെ തിരഞ്ഞെടുക്കുന്ന സ്ഥലത്തേക്കു ചെല്ലണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നേർച്ചവഴിപാടുകളും.” ഹീബ്രു പദം നേർച്ചകളെത്തന്നെയോ, ഈ യാഗസന്ദർഭത്തിൽ ആ നേർച്ചകൾ നിറവേറ്റുന്നതിനായി കൊണ്ടുവരുന്ന വഴിപാടുകളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: എന്നാൽ ... മാത്രം
  rationale: മുൻവാക്യങ്ങളിലെ പ്രാദേശിക അറുപ്പിനും ഭക്ഷണത്തിനുമുള്ള അനുമതിയോട് ഒരു നിയന്ത്രണവും വ്യത്യാസവും സൂചിപ്പിക്കുന്നതിനാൽ, വിരുദ്ധഭാവവും പരിമിതിപ്പെടുത്തുന്ന അർഥവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: קָדָשֶׁיךָ
  choice: നിന്റെ വിശുദ്ധവസ്തുക്കൾ
  rationale: ഒരു പ്രത്യേക യാഗവിഭാഗം മാത്രമായി ചുരുക്കാതെ, വിശുദ്ധമായി വേർതിരിക്കപ്പെട്ട വസ്തുക്കൾ എന്ന പദത്തിന്റെ വിശാലമായ ആരാധനാസംബന്ധിയായ അർഥം നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר יִהְיוּ לְךָ
  choice: നിനക്കുള്ള
  rationale: ഈ വിശുദ്ധവസ്തുക്കൾ ആരാധകന്റെ കൈവശമുള്ളതോ അവൻ സമർപ്പിക്കേണ്ടതോ ആണെന്ന ഉടമസ്ഥതാസംബന്ധിയായ ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וּנְדָרֶיךָ
  choice: നിന്റെ നേർച്ചകൾ
  rationale: ഹീബ്രു പദത്തിന്റെ നേരിട്ടുള്ള അർഥമായ ‘നേർച്ചകൾ’ നിലനിർത്തുന്നു; യാഗസന്ദർഭത്തിൽ നേർച്ച നിറവേറ്റാൻ കൊണ്ടുവരുന്ന വഴിപാടുകളെയും ഇത് സൂചിപ്പിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: תִּשָּׂא
  choice: ചുമന്നുകൊണ്ട്
  rationale: വിശുദ്ധവസ്തുക്കൾ തിരഞ്ഞെടുത്ത സ്ഥലത്തേക്കു കൊണ്ടുപോകുന്ന മൂർത്തമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന ‘വഹിക്കുക/ചുമക്കുക’ എന്ന ക്രിയയുടെ അർഥം സംരക്ഷിക്കുന്നു.
- source_word: וּבָאתָ
  choice: ചെല്ലണം
  rationale: ലക്ഷ്യസ്ഥാനത്തേക്കു വരിക/പ്രവേശിക്കുക എന്ന ക്രിയയെ മലയാള ലക്ഷ്യസ്ഥാനപ്രയോഗത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; കൊണ്ടുപോകുന്നതും അവിടെ എത്തുന്നതും എന്ന ക്രമം നിലനിർത്തുന്നു.
- source_word: הַמָּקוֹם
  choice: സ്ഥലം
  rationale: ആവർത്തിച്ചു വരുന്ന ആവർത്തനപുസ്തകത്തിലെ കേന്ദ്രാരാധനാസ്ഥലത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗം അതിനെ അനാവശ്യമായി ‘ആലയസ്ഥലം’ എന്നു വ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר יִבְחַר יְהוָה
  choice: യഹ്‌വെ തിരഞ്ഞെടുക്കുന്ന
  rationale: യഹ്‌വെ നിശ്ചയിക്കുന്ന സ്ഥലത്തെക്കുറിച്ചുള്ള ആവർത്തനപുസ്തകത്തിലെ സൂത്രപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; യിക്തോൽ രൂപത്തിന്റെ ഭാവിനിർദ്ദേശം സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്നു.
theological_decisions:
- issue: ദൈവനാമമായ יְהוָהയുടെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: ഹീബ്രു മൂലപാഠത്തിലെ ചതുർവ്യഞ്ജന ദൈവനാമത്തെ ഒരു പദവിയായി മാറ്റാതെ വ്യക്തിനാമമായി അവതരിപ്പിക്കുകയും ‘Yahweh’ എന്ന ഉച്ചാരണരൂപത്തെ മലയാളത്തിൽ അടുത്തായി ലിപ്യന്തരം ചെയ്യുകയും ചെയ്യുന്നു.
- issue: וּנְדָרֶיךָ എന്നതിന്റെ നേർച്ചയോ നേർച്ചവഴിപാടോ എന്ന അർഥം
  choice: പ്രധാനപാഠത്തിൽ ‘നേർച്ചകൾ’; വഴിപാടുകളെന്ന സാധ്യത അടിക്കുറിപ്പിൽ
  alternative: നേർച്ചവഴിപാടുകൾ
  rationale: മൂലപദത്തിന്റെ നേരിട്ടുള്ള അർഥം സംരക്ഷിക്കുമ്പോൾ, യാഗസന്ദർഭം സൂചിപ്പിക്കുന്ന മൂർത്തമായ വഴിപാടുകളെന്ന വായനയും മറച്ചുവയ്ക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായെങ്കിലും ഗൗരവമുള്ള മലയാളം. ഏകവചന അഭിസംബോധനയായ ‘നീ/നിന്റെ’ നിലനിർത്തി. ‘എന്നാൽ ... മാത്രം’ എന്ന ഘടന നിയന്ത്രണഭാവം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ‘ചുമന്നുകൊണ്ട് ... ചെല്ലണം’ എന്നത് ഹീബ്രുവിലെ രണ്ടു ക്രിയകളെയും വേർതിരിച്ചു സൂക്ഷിക്കുന്നു.
