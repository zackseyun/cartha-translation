id: DEU.12.14
reference: Deuteronomy 12:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֣י אִם בַּ/מָּק֞וֹם אֲשֶׁר יִבְחַ֤ר יְהוָה֙ בְּ/אַחַ֣ד שְׁבָטֶ֔י/ךָ שָׁ֖ם תַּעֲלֶ֣ה עֹלֹתֶ֑י/ךָ וְ/שָׁ֣ם תַּעֲשֶׂ֔ה כֹּ֛ל אֲשֶׁ֥ר אָנֹכִ֖י מְצַוֶּֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/014.yaml
  text: but only at the place that Yahweh will choose in one of your tribes—there you shall offer up your burnt offerings[b][a], and there you shall do all that I am commanding you.
translation:
  language: ml
  text: എന്നാൽ യഹ്‌വെ നിങ്ങളുടെ ഗോത്രങ്ങളിലൊന്നിൽ[a] തിരഞ്ഞെടുക്കുന്ന സ്ഥലത്തു മാത്രം നിങ്ങളുടെ ഹോമയാഗങ്ങൾ അർപ്പിക്കണം; അവിടെ ഞാൻ നിങ്ങളോടു കൽപ്പിക്കുന്നതെല്ലാം ചെയ്യണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “നിങ്ങളുടെ ഗോത്രങ്ങളിലൊന്നിൽ”; അതായത്, ഇസ്രായേലിന്റെ ഏതെങ്കിലും ഒരു ഗോത്രത്തിന്റെ പ്രദേശത്തിനുള്ളിൽ.'
    reason: cultural_note
lexical_decisions:
- source_word: כִּי אִם
  choice: എന്നാൽ ... മാത്രമേ / മാത്രമാണ്
  rationale: മുൻവാക്യത്തിലെ നിരോധനത്തിന് പിന്നാലെ ഏക അനുവദനീയമായ സ്ഥലം സൂചിപ്പിക്കുന്ന നിയന്ത്രണാത്മക വൈരുധ്യം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: בַּמָּקוֹם
  choice: സ്ഥലത്ത്
  rationale: ദൈവം തിരഞ്ഞെടുക്കുന്ന നിർദിഷ്ട ആരാധനാസ്ഥലത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר יִבְחַר יְהוָה
  choice: യഹ്‌വെ ... തിരഞ്ഞെടുക്കുന്ന
  rationale: ഹീബ്രു yiqtol-ന്റെ ഭാവിസൂചന സന്ദർഭത്തിൽ വ്യക്തമാണ്; മലയാളത്തിലെ ബന്ധവാക്യരൂപം സ്വാഭാവികവും അർഥസൂക്ഷ്മത നിലനിർത്തുന്നതുമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം പദവിയായി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בְּאַחַד שְׁבָטֶיךָ
  choice: നിങ്ങളുടെ ഗോത്രങ്ങളിലൊന്നിൽ
  rationale: ഹീബ്രുവിന്റെ രൂപം അടുത്തായി നിലനിർത്തുന്നു; ഉദ്ദേശ്യം ഒരു ഗോത്രത്തിന്റെ പ്രദേശത്തിനുള്ളിൽ എന്നാണെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: שָׁם ... וְשָׁם
  choice: അവിടെ ... അവിടെവെച്ചുതന്നെ
  rationale: സ്ഥലത്തിന്റെ ഏകത്വം ഊന്നുന്ന ആവർത്തനം മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: תַּעֲלֶה עֹלֹתֶיךָ
  choice: നിങ്ങളുടെ ഹോമയാഗങ്ങൾ അർപ്പിക്കണം
  rationale: עלה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഹോമയാഗസന്ദർഭത്തിൽ ‘അർപ്പിക്കുക’ എന്ന യാഗപരമായ അർഥം നൽകുന്നു; עֹלָהയ്ക്ക് പ്രചാരത്തിലുള്ള കൃത്യമായ പദം ‘ഹോമയാഗം’ ആണ്.
- source_word: כֹּל אֲשֶׁר אָנֹכִי מְצַוֶּךָּ
  choice: ഞാൻ നിങ്ങളോടു കല്പിക്കുന്നതെല്ലാം
  rationale: വർത്തമാനകാല കൃതന്തത്തിന്റെ തുടരുന്ന കല്പനാസ്വഭാവവും ‘എല്ലാം’ എന്ന സമഗ്രതയും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അത് പദവിയായി മാറ്റാതെ ആധുനിക മലയാള ലിപ്യന്തരണത്തിൽ നൽകുന്നു.
- issue: തിരഞ്ഞെടുക്കപ്പെട്ട ആരാധനാസ്ഥലത്തിന്റെ ഏകത്വം
  choice: ‘സ്ഥലത്തുമാത്രം’ എന്നും ആവർത്തിച്ച ‘അവിടെ’ എന്നും നിലനിർത്തി
  alternative: പൊതുവായി ‘തിരഞ്ഞെടുത്ത സ്ഥലത്ത്’ എന്നു മാത്രം പറയുക
  rationale: വാക്യം മുൻവാക്യത്തിലെ നിരോധനത്തിന് ഏക അപവാദം നിർദേശിക്കുന്നു; അതിനാൽ നിയന്ത്രണാത്മക ഊന്നൽ ദുർബലമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായിക്കാൻ എളുപ്പവുമായ ശൈലി. നിയമപരമായ നിർദേശത്തിന്റെ ബലം ‘അർപ്പിക്കണം’, ‘ചെയ്യണം’ എന്നീ രൂപങ്ങളിൽ നിലനിർത്തി. പ്രധാനപാഠത്തിലെ [a] അടയാളം ബന്ധപ്പെട്ട അടിക്കുറിപ്പുമായി പൊരുത്തപ്പെടുന്നു.
