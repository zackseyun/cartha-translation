source:
  edition: WLC
  text: שְׁמֹ֣ר וְ/שָׁמַעְתָּ֗ אֵ֚ת כָּל הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה אֲשֶׁ֥ר אָנֹכִ֖י מְצַוֶּ֑/ךָּ לְמַעַן֩ יִיטַ֨ב לְ/ךָ֜ וּ/לְ/בָנֶ֤י/ךָ אַחֲרֶ֨י/ךָ֙ עַד עוֹלָ֔ם כִּ֤י תַעֲשֶׂה֙ הַ/טּ֣וֹב וְ/הַ/יָּשָׁ֔ר בְּ/עֵינֵ֖י יְהוָ֥ה אֱלֹהֶֽי/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/028.yaml
  text: Be careful to listen to all these words that I am commanding you[a], so that it may go well with you and with your children after you forever[b], because you will do what is good and right in the eyes of Yahweh your God.
translation:
  language: ml
  text: ഞാൻ നിന്നോടു കൽപിക്കുന്ന ഈ വചനങ്ങളെല്ലാം ശ്രദ്ധാപൂർവം കേട്ടു പാലിക്കുക[a]. അങ്ങനെ നിനക്കും നിനക്കുശേഷം നിന്റെ മക്കൾക്കും എന്നേക്കും നന്മയുണ്ടാകും[b]; കാരണം, നിന്റെ ദൈവമായ യാഹ്‌വെയുടെ ദൃഷ്ടിയിൽ നല്ലതും ശരിയായതും നീ ചെയ്യും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “ഈ വചനങ്ങളെല്ലാം കാത്തുസൂക്ഷിക്കുകയും കേൾക്കുകയും ചെയ്യുക.” ശ്രദ്ധയോടെ പാലിക്കുന്നതും കേൾക്കുന്നതുമായ ആശയങ്ങൾ എബ്രായത്തിൽ ചേർന്നുവരുന്നു; സന്ദർഭം അനുസരണത്തെയും ഉൾക്കൊള്ളുന്നു.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ “പുത്രന്മാർ”; ഇവിടെ പിൻതലമുറയെയോ സന്തതിയെയോ വിശാലമായി സൂചിപ്പിക്കുന്നതിനാൽ “മക്കൾ” എന്നു പരിഭാഷപ്പെടുത്തി.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמֹר וְשָׁמַעְתָּ
  choice: ശ്രദ്ധാപൂർവം കേട്ടു പാലിക്കുക
  rationale: ശ്രദ്ധയോടെ കാത്തുപാലിക്കുക, കേൾക്കുക എന്നീ രണ്ടു ക്രിയകളുടെയും സംയുക്തബലം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; സന്ദർഭത്തിൽ കേൾവി അനുസരണത്തിലേക്കു നയിക്കുന്നു.
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: ഈ വചനങ്ങളെല്ലാം
  rationale: דברים എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘വാക്കുകൾ/വചനങ്ങൾ’ നിലനിർത്തുകയും മോശെയുടെ കല്പനാവചനങ്ങളെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: מְצַוֶּךָּ
  choice: ഞാൻ നിന്നോടു കല്പിക്കുന്ന
  rationale: വർത്തമാനകാല പങ്കാളിക്രിയയുടെ ഇപ്പോഴത്തെ, തുടരുന്ന കല്പനാഭാവം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לְמַעַן יִיטַב לְךָ
  choice: അങ്ങനെ നിനക്ക് നന്മയുണ്ടാകും
  rationale: ആവർത്തനപുസ്തകത്തിലെ ഉടമ്പടിസംബന്ധമായ ക്ഷേമപ്രയോഗത്തെ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וּלְבָנֶיךָ אַחֲרֶיךָ
  choice: നിനക്കുശേഷം നിന്റെ മക്കൾക്കും
  rationale: בנים രൂപപരമായി ‘പുത്രന്മാർ’ എന്നാണെങ്കിലും ഇവിടെ കുടുംബപരമ്പരയെയും സന്തതിയെയും വിശാലമായി സൂചിപ്പിക്കുന്നു.
- source_word: עַד עוֹלָם
  choice: എന്നേക്കും
  rationale: ഭാവിയിലേക്കു നീളുന്ന സ്ഥിരമായ കാലദൈർഘ്യം സംക്ഷിപ്തമായി അറിയിക്കുന്നു.
- source_word: כִּי תַעֲשֶׂה
  choice: കാരണം ... നീ ചെയ്യും
  rationale: כִּי-യുടെ കാരണസൂചകബലവും അപൂർണക്രിയയുടെ ഭാവി/ഫലഭാവവും നിലനിർത്തുന്നു; ‘എപ്പോൾ’ അല്ലെങ്കിൽ ‘എങ്കിൽ’ എന്നു വ്യാഖ്യാനിച്ച് ബന്ധം അനാവശ്യമായി തീർപ്പാക്കുന്നില്ല.
- source_word: הַטּוֹב וְהַיָּשָׁר
  choice: നല്ലതും നേരായതുമായത്
  rationale: നാമരൂപത്തിൽ പ്രവർത്തിക്കുന്ന രണ്ടു വിശേഷണങ്ങളുടെയും ധാർമികമായ അർഥജോടി നിലനിർത്തുന്നു.
- source_word: בְּעֵינֵי יְהוָה
  choice: യാഹ്‌വെയുടെ ദൃഷ്ടിയിൽ
  rationale: ദൈവിക വിലയിരുത്തലിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യരൂപകം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: തിരുവെഴുത്തിലെ ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, YHWH-ന്റെ സാധാരണ പണ്ഡിതോചിത ഉച്ചാരണരൂപം മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം സ്ഥാനപ്പേരല്ല, ഉടമ്പടിനാമമായ ചതുരക്ഷരനാമം തന്നെയാണ് ഉപയോഗിക്കുന്നത്; അതിനാൽ വ്യക്തിനാമം നിലനിർത്തുന്നു.
- issue: בָנֶיךָ എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: മക്കൾ
  alternative: പുത്രന്മാർ; സന്തതി
  rationale: രൂപപരമായി പുല്ലിംഗ ബഹുവചനമാണെങ്കിലും ഉടമ്പടിവാഗ്ദാനത്തിന്റെ പശ്ചാത്തലത്തിൽ പിൻതലമുറയെ കുടുംബപരമായി പ്രതിനിധീകരിക്കുന്നു; പുരുഷന്മാർക്കു മാത്രമായി അർഥം ചുരുക്കേണ്ടതില്ല.
- issue: כִּי תַעֲשֶׂה എന്നതിലെ ബന്ധം
  choice: കാരണം ... നീ ചെയ്യും
  alternative: നീ ചെയ്യുമ്പോൾ; നീ ചെയ്താൽ
  rationale: כִּי ഇവിടെ വാഗ്ദത്തനന്മയുടെ അടിസ്ഥാനമോ വിശദീകരണമോ നൽകുന്നതായി വായിക്കാം. വ്യവസ്ഥാപരമായ ‘എങ്കിൽ’ എന്ന അർഥം പാഠത്തിൽ നിർബന്ധമായി ചേർക്കാതെ കാരണബന്ധം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഏകവചന അഭിസംബോധനയായ ‘നിന്നോട്/നിനക്ക്’ നിലനിർത്തി. ‘ദൃഷ്ടിയിൽ’ എന്ന പരിചിതമായ തിരുവെഴുത്തുശൈലി എബ്രായ രൂപകവും സാധാരണ വായനാസൗകര്യവും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
