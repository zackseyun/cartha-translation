revisions:
- from: അവിടേക്ക് നിങ്ങളുടെ ഹോമയാഗങ്ങളും ബലികളും ദശാംശങ്ങളും നിങ്ങളുടെ കൈയുടെ സംഭാവനയും[a] നേർച്ചയാഗങ്ങളും[b] സ്വമേധായാഗങ്ങളും നിങ്ങളുടെ കന്നുകാലികളിലും ആട്ടിൻപറ്റങ്ങളിലും ഉള്ള കടിഞ്ഞൂലുകളെയും കൊണ്ടുവരണം.
  to: അവിടേക്ക് നിങ്ങളുടെ ഹോമയാഗങ്ങളും ബലികളും ദശാംശങ്ങളും നിങ്ങളുടെ കൈകൊണ്ടുള്ള സംഭാവനയും[a] നേർച്ചാർപ്പണങ്ങളും[b] സ്വമേധാർപ്പണങ്ങളും നിങ്ങളുടെ കന്നുകാലികളുടെയും ആട്ടിൻപറ്റങ്ങളുടെയും കടിഞ്ഞൂലുകളെയും കൊണ്ടുവരണം.
