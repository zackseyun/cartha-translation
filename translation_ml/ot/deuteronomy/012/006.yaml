source:
  edition: WLC
  text: וַ/הֲבֵאתֶ֣ם שָׁ֗מָּ/ה עֹלֹֽתֵי/כֶם֙ וְ/זִבְחֵי/כֶ֔ם וְ/אֵת֙ מַעְשְׂרֹ֣תֵי/כֶ֔ם וְ/אֵ֖ת תְּרוּמַ֣ת יֶדְ/כֶ֑ם וְ/נִדְרֵי/כֶם֙ וְ/נִדְבֹ֣תֵי/כֶ֔ם וּ/בְכֹרֹ֥ת בְּקַרְ/כֶ֖ם וְ/צֹאנְ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/006.yaml
  text: And there you shall bring your burnt offerings[a], your sacrifices, your tithes, the contribution of your hand, your vow offerings, your freewill offerings[b], and the firstborn of your herd and of your flock.
translation:
  language: ml
  text: അവിടേക്ക് നിങ്ങളുടെ ഹോമയാഗങ്ങളും ബലികളും ദശാംശങ്ങളും നിങ്ങളുടെ കൈകൊണ്ടുള്ള സംഭാവനയും[a] നേർച്ചാർപ്പണങ്ങളും[b] സ്വമേധാർപ്പണങ്ങളും നിങ്ങളുടെ കന്നുകാലികളുടെയും ആട്ടിൻപറ്റങ്ങളുടെയും കടിഞ്ഞൂലുകളെയും കൊണ്ടുവരണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങളുടെ അർപ്പണം’ / ‘നിങ്ങളുടെ കൈയിൽനിന്നുള്ള സംഭാവന.’ എബ്രായ പ്രയോഗത്തിൽ ‘കൈ’ എന്ന പദം അക്ഷരാർഥത്തിൽ ഉൾപ്പെടുന്നു; വ്യക്തിപരമായി സമർപ്പിക്കുന്നതിനെ അത് ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നിങ്ങളുടെ നേർച്ചകൾ.’ ഈ സന്ദർഭത്തിൽ നേർച്ചകളോടു ബന്ധപ്പെട്ട അർപ്പണങ്ങളായിരിക്കാനാണ് കൂടുതൽ സാധ്യത.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲבֵאתֶם
  choice: കൊണ്ടുവരണം
  rationale: בוא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ നിർദേശാത്മകമായ നിയമസന്ദർഭത്തിൽ ‘കൊണ്ടുവരുക’ എന്ന അർഥം നൽകുന്നു; മലയാളത്തിലെ ‘-ണം’ ബാധ്യത സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: שָׁמָּה
  choice: അവിടേക്ക്
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞിരിക്കുന്ന ആരാധനാസ്ഥലത്തേക്കുള്ള ദിശാസൂചന മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: עֹלֹתֵיכֶם
  choice: നിങ്ങളുടെ ഹോമയാഗങ്ങൾ
  rationale: עוֹלָה പൂർണമായി ദഹിപ്പിക്കുന്ന യാഗത്തെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക പദമാണ്; ‘ഹോമയാഗം’ മലയാളത്തിൽ പരിചിതവും കൃത്യവുമാണ്.
- source_word: זִבְחֵיכֶם
  choice: നിങ്ങളുടെ ബലികൾ
  rationale: זֶבַח അറുത്തർപ്പിക്കുന്ന യാഗങ്ങളുടെ വിശാലവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു; ഹോമയാഗത്തിൽനിന്നുള്ള വ്യത്യാസം ‘ബലികൾ’ നിലനിർത്തുന്നു.
- source_word: מַעְשְׂרֹתֵיכֶם
  choice: നിങ്ങളുടെ ദശാംശങ്ങൾ
  rationale: പത്തിലൊന്ന് എന്ന അർഥമുള്ള ആരാധനാപരമായ അർപ്പണത്തെ ‘ദശാംശം’ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: תְּרוּמַת יֶדְכֶם
  choice: നിങ്ങളുടെ കൈയുടെ സംഭാവന
  rationale: תְּרוּמָה എന്നത് വേർതിരിച്ചുനൽകുന്ന സംഭാവനയാണ്; יָד (‘കൈ’) എന്ന മൂലരൂപകവും വ്യക്തിപരമായി സമർപ്പിക്കുന്ന ഭാവവും വിവർത്തനം സംരക്ഷിക്കുന്നു.
- source_word: נִדְרֵיכֶם
  choice: നിങ്ങളുടെ നേർച്ചയാഗങ്ങൾ
  rationale: യാഗവസ്തുക്കളുടെ പട്ടികയിൽ ഈ പദം പറഞ്ഞ നേർച്ചകൾ മാത്രമല്ല, അവ നിറവേറ്റാൻ കൊണ്ടുവരുന്ന അർപ്പണങ്ങളെയും സൂചിപ്പിക്കാം; ‘നേർച്ചയാഗങ്ങൾ’ സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു.
- source_word: נִדְבֹתֵיכֶם
  choice: നിങ്ങളുടെ സ്വമേധായാഗങ്ങൾ
  rationale: നേർച്ചയുടെ ബാധ്യതയില്ലാതെ മനസ്സോടെ നൽകുന്ന അർപ്പണങ്ങളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘സ്വമേധായാഗങ്ങൾ’ യോജിക്കുന്നു.
- source_word: בְכֹרֹת בְּקַרְכֶם וְצֹאנְכֶם
  choice: നിങ്ങളുടെ കന്നുകാലികളിലും ആട്ടിൻപറ്റങ്ങളിലും ഉള്ള കടിഞ്ഞൂലുകൾ
  rationale: בָּקָר വലിയ വളർത്തുമൃഗങ്ങളെയും צֹאן ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടുന്ന ആട്ടിൻപറ്റങ്ങളെയും സൂചിപ്പിക്കുന്നു; בְּכוֹרֹת ആദ്യമായി ജനിച്ച മൃഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: נִדְרֵיכֶם എന്നതിന്റെ അർഥപരിധി
  choice: നേർച്ചയാഗങ്ങൾ
  alternative: നേർച്ചകൾ
  rationale: യാഗങ്ങളും അർപ്പണങ്ങളും എണ്ണിപ്പറയുന്ന ഈ സന്ദർഭത്തിൽ നേർച്ച നിറവേറ്റുന്നതിനുള്ള അർപ്പണമാണ് സാധ്യതയേറിയ അർഥം; എന്നാൽ മൂലപദത്തിന് ‘നേർച്ചകൾ’ എന്ന നേരിട്ടുള്ള അർഥവും ഉള്ളതിനാൽ അത് അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: 'ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളമാണ് ഉപയോഗിച്ചത്. ആരാധനാസംബന്ധമായ സാങ്കേതിക വ്യത്യാസങ്ങൾ നിലനിർത്താൻ ‘ഹോമയാഗം,’ ‘ബലി,’ ‘നേർച്ചയാഗം,’ ‘സ്വമേധായാഗം’ എന്നീ പദങ്ങൾ വേർതിരിച്ചു. ഇംഗ്ലീഷ് consultation layer-ലുണ്ടായിരുന്ന അടിക്കുറിപ്പ്-ചിഹ്നങ്ങളുടെ സ്ഥാനവൈരുധ്യം മൂലപദങ്ങളോട് പൊരുത്തപ്പെടുത്തി തിരുത്തി: [a] תְּרוּמַת יֶדְכֶם-നും [b] נִדְרֵיכֶם-നും ചേർത്തു.'
