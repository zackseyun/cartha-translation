id: DEU.12.13
reference: Deuteronomy 12:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הִשָּׁ֣מֶר לְ/ךָ֔ פֶּֽן תַּעֲלֶ֖ה עֹלֹתֶ֑י/ךָ בְּ/כָל מָק֖וֹם אֲשֶׁ֥ר תִּרְאֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/013.yaml
  text: Be careful lest you offer up your burnt offerings in any place that you see;[a]
translation:
  language: ml
  text: നിന്റെ ഹോമയാഗങ്ങൾ നിനക്കു കാണുന്ന ഏതെങ്കിലും സ്ഥലത്ത് അർപ്പിക്കാതിരിക്കാൻ സൂക്ഷിച്ചുകൊള്ളുക;[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘നിനക്കു കാണുന്ന എല്ലാ സ്ഥലങ്ങളിലും നിന്റെ ഹോമയാഗങ്ങൾ അർപ്പിക്കാതിരിക്കാൻ സൂക്ഷിച്ചുകൊള്ളുക.’'
    reason: בְּכָל מָקוֹם എന്നതിന് ‘ഏതെങ്കിലും സ്ഥലത്ത്’ എന്നും ‘എല്ലാ സ്ഥലങ്ങളിലും’ എന്നും സന്ദർഭാനുസൃതമായി പരിഭാഷപ്പെടുത്താം.
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: സൂക്ഷിച്ചുകൊള്ളുക
  rationale: ശ്രദ്ധയോടെ കാത്തുകൊള്ളുക എന്ന മുന്നറിയിപ്പിന്റെ ആജ്ഞാഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: פֶּן
  choice: അർപ്പിക്കാതിരിക്കാൻ
  rationale: സംഭവിക്കരുതെന്ന പ്രതിരോധാത്മക മുന്നറിയിപ്പ് മലയാളത്തിലെ നിഷേധാത്മക ഉദ്ദേശ്യഘടനയിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: תַּעֲלֶה
  choice: അർപ്പിക്കുക
  rationale: ഹിഫിൽ രൂപത്തിന്റെ യാഗാർപ്പണസംബന്ധിയായ പ്രയോഗാർഥം നൽകുന്നു; പദശഃ ‘കയറ്റുക’ എന്നത് മലയാളത്തിൽ ഇവിടെ അസ്വാഭാവികമാണ്.
- source_word: עֹלֹתֶיךָ
  choice: നിന്റെ ഹോമയാഗങ്ങൾ
  rationale: പൂർണമായി ദഹിപ്പിക്കുന്ന യാഗത്തെ സൂചിപ്പിക്കുന്ന עֹלָה എന്ന സാങ്കേതിക യാഗപദത്തിന് മലയാളത്തിൽ പരിചിതവും കൃത്യവുമായ സമാനപദമാണ് ‘ഹോമയാഗം’.
- source_word: בְּכָל מָקוֹם
  choice: ഏതെങ്കിലും സ്ഥലത്ത്
  rationale: כָּל എന്നതിന്റെ ‘എല്ലാ/ഏതെങ്കിലും’ സാധ്യതകളിൽ, നിഷേധാത്മക മുന്നറിയിപ്പിനുള്ളിൽ സ്വമേധയാ തിരഞ്ഞെടുത്ത യാതൊരു സ്ഥലത്തും അർപ്പിക്കരുത് എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֲשֶׁר תִּרְאֶה
  choice: നിനക്കു കാണുന്ന
  rationale: ‘നീ കാണുന്ന’ എന്ന എബ്രായ ദൃശ്യപ്രയോഗം നിലനിർത്തുകയും സ്വന്തം കാഴ്ചപ്രകാരം സ്ഥലം തിരഞ്ഞെടുക്കുന്നതിന്റെ സൂചന അതിരുകടന്ന് വ്യാഖ്യാനിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ആരാധനാകേന്ദ്രത്തിന്റെ ഏകീകരണം
  choice: സ്വയം കാണുന്ന ഏതെങ്കിലും സ്ഥലത്ത് ഹോമയാഗങ്ങൾ അർപ്പിക്കരുതെന്ന നേരിട്ടുള്ള വിലക്കായി പരിഭാഷപ്പെടുത്തി.
  alternative: കേന്ദ്രവിശുദ്ധമന്ദിരത്തിനു പുറത്തുള്ള എല്ലാ ആരാധനയും നിരോധിക്കുന്ന വിപുലമായ പ്രസ്താവനയായി പരിഭാഷപ്പെടുത്തുക.
  rationale: സന്ദർഭത്തിൽ ഏകീകൃത ആരാധനാകേന്ദ്രം പ്രധാനമാണെങ്കിലും, ഈ വാക്യത്തിന്റെ വ്യക്തമായ പദങ്ങൾ ഹോമയാഗങ്ങളെയും ഇഷ്ടാനുസൃതമായി കാണുന്ന സ്ഥലങ്ങളെയും കുറിച്ചാണ്. അതിനാൽ വാക്യം പറയുന്നതിലപ്പുറം സിദ്ധാന്തപരമായി വികസിപ്പിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ‘സൂക്ഷിച്ചുകൊള്ളുക’ മുന്നറിയിപ്പിന്റെ ശക്തി നിലനിർത്തുന്നു; ‘ഹോമയാഗം’ യാഗസാങ്കേതികത വ്യക്തമാക്കുന്നു. മൂലത്തിലെ ‘കാണുന്ന’ എന്ന concrete expression സംരക്ഷിച്ചു.
