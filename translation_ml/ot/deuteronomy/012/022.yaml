source:
  edition: WLC
  text: אַ֗ךְ כַּ/אֲשֶׁ֨ר יֵאָכֵ֤ל אֶֽת הַ/צְּבִי֙ וְ/אֶת הָ֣/אַיָּ֔ל כֵּ֖ן תֹּאכְלֶ֑/נּוּ הַ/טָּמֵא֙ וְ/הַ/טָּה֔וֹר יַחְדָּ֖ו יֹאכְלֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/022.yaml
  text: But just as the gazelle and the deer are eaten[a], so you may eat it[b]; the unclean and the clean alike may eat it.
translation:
  language: ml
  text: എന്നാൽ ഗസലിനെയും മാനിനെയും തിന്നുന്നതുപോലെ, അതിനെയും നിങ്ങൾക്ക് തിന്നാം; ആചാരപരമായി അശുദ്ധനായവനും ശുദ്ധനായവനും ഒരുപോലെ അതിനെ തിന്നാം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: എന്നാൽ
  rationale: മുൻ നിർദേശത്തെ നിയന്ത്രിക്കുന്ന ഭാവം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: തിന്നുന്നതുപോലെ ... തിന്നാം
  rationale: ഹീബ്രായത്തിലെ താരതമ്യഘടന മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: הַצְּבִי
  choice: മാൻപേട
  rationale: ചെറുതും വേഗമേറിയതുമായ gazelle-വർഗത്തിലെ കാട്ടുമൃഗത്തെ സൂചിപ്പിക്കുന്ന പരിചിതമായ മലയാളപദം.
- source_word: הָאַיָּל
  choice: കലമാൻ
  rationale: വലിയ deer/stag വർഗത്തെ മാൻപേടയിൽനിന്ന് വേർതിരിച്ചുകാണിക്കുന്ന സ്വാഭാവിക പദം.
- source_word: תֹּאכְלֶנּוּ / יֹאכְלֶנּוּ
  choice: അതിനെ തിന്നാം
  rationale: നിയമസന്ദർഭത്തിലെ imperfect അനുമതിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘തിന്നാം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: הַטָּמֵא ... הַטָּהוֹר
  choice: ആചാരപരമായി അശുദ്ധനായവനും ശുദ്ധനായവനും
  rationale: ഇവിടെ ധാർമിക സ്വഭാവമല്ല, ആചാരപരമായ നിലയാണ് ഉദ്ദേശ്യമെന്നത് സാധാരണ വായനക്കാരന് വ്യക്തമാക്കുന്നു.
- source_word: יַחְדָּו
  choice: ഒരുപോലെ
  rationale: ഒരുമിച്ച് ഭക്ഷിക്കുന്നു എന്നതിലുപരി ഇരുവിഭാഗത്തിനും തുല്യമായ അനുമതിയുണ്ടെന്ന അർഥം നൽകുന്നു.
theological_decisions:
- issue: ശുദ്ധി–അശുദ്ധി പദാവലി
  choice: ആചാരപരമായി അശുദ്ധനായവനും ശുദ്ധനായവനും
  alternative: അശുദ്ധനും ശുദ്ധനും
  rationale: ഈ വാക്യത്തിൽ പറയുന്നത് ധാർമിക ദുഷ്ടതയോ നന്മയോ അല്ല, ആചാരപരമായ സ്ഥിതിയാണ്; അതിനാൽ തെറ്റായ ധാർമിക അർഥം ഒഴിവാക്കാൻ ‘ആചാരപരമായി’ ചേർത്തു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലത്തിലെ അനുമതിഭാവവും താരതമ്യവും വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു.
