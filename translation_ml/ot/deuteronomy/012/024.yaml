  text: You shall not eat it[a]; you shall pour it out on the ground like water.
translation:
  language: ml
  text: നീ അത് ഭക്ഷിക്കരുത്[a]; വെള്ളംപോലെ അതിനെ നിലത്ത് ഒഴിച്ചുകളയണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അതായത്, ചുറ്റുപാടിൽ വ്യക്തമാക്കിയിരിക്കുന്നതുപോലെ, അറുക്കപ്പെട്ട മൃഗത്തിന്റെ രക്തം.
    reason: cross_reference
lexical_decisions:
- source_word: לֹא תֹּאכְלֶנּוּ
  choice: നീ അത് ഭക്ഷിക്കരുത്
  rationale: നിഷേധത്തോടുകൂടിയ ഖാൽ അപൂർണക്രിയ ഇവിടെ നിയമപരമായ വിലക്കാണ്. മൂന്നാം പുരുഷ ഏകവചന പ്രത്യയം ആവർത്തിക്കാതെ ‘അത്’ എന്നു നിലനിർത്തുന്നു.
- source_word: עַל הָאָרֶץ
  choice: നിലത്ത്
  rationale: ഈ മൂർത്തമായ ആചാരനിർദേശത്തിൽ אֶרֶץ ഭൂമിയുടെ ഉപരിതലത്തെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘നിലത്ത്’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: תִּשְׁפְּכֶנּוּ
  choice: ഒഴിച്ചുകളയണം
  rationale: שׁפך ഇവിടെ രക്തം ഒഴിച്ച് നിർമാർജനം ചെയ്യേണ്ട പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘ഒഴിച്ചുകളയണം’ നിർബന്ധവും പ്രവൃത്തിയുടെ പൂർത്തീകരണവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: כַּמָּיִם
  choice: വെള്ളംപോലെ
  rationale: താരതമ്യരൂപം നിലനിർത്തി, ഒഴിക്കേണ്ട രീതിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
theological_decisions:
- issue: പ്രത്യയങ്ങൾ സൂചിപ്പിക്കുന്ന വസ്തു
  choice: പ്രധാനവാക്യത്തിൽ ‘അത്’ എന്നു നിലനിർത്തി, അടിക്കുറിപ്പിൽ ചുറ്റുപാടനുസരിച്ച് രക്തമാണെന്ന് വ്യക്തമാക്കുന്നു.
  alternative: വ്യക്തതയ്ക്കായി പ്രധാനവാക്യത്തിൽ ‘രക്തം’ എന്നു നേരിട്ട് ചേർക്കുക.
  rationale: എബ്രായപാഠം നാമം ആവർത്തിക്കാതെ പ്രത്യയങ്ങളാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ ഉറവിടഘടന സംരക്ഷിക്കുകയും സന്ദർഭവിവരം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമനിർദേശശൈലി. ‘ഭക്ഷിക്കരുത്’ വിലക്കിനെയും ‘ഒഴിച്ചുകളയണം’ നിർബന്ധിത നടപടിയെയും വ്യക്തമായി വേർതിരിക്കുന്നു.
