- from: അവിടെ നിങ്ങളുടെ ദൈവമായ യഹോവയുടെ സന്നിധിയിൽവെച്ച് നിങ്ങൾ ഭക്ഷിക്കുകയും, നിങ്ങളുടെ കൈകളുടെ സകല പ്രയത്നങ്ങളിലും[a]—നിങ്ങളും നിങ്ങളുടെ കുടുംബങ്ങളും—സന്തോഷിക്കുകയും വേണം; അവയാൽ നിങ്ങളുടെ ദൈവമായ യഹോവ നിങ്ങളെ അനുഗ്രഹിച്ചിരിക്കുന്നു.
  to: അവിടെ, നിങ്ങളുടെ ദൈവമായ യഹ്വേയുടെ സന്നിധിയിൽ നിങ്ങൾ ഭക്ഷിക്കണം; നിങ്ങളുടെ ദൈവമായ യഹ്വേ നിങ്ങളെ അനുഗ്രഹിച്ചിരിക്കുന്ന നിങ്ങളുടെ കൈകളുടെ സകല പ്രവൃത്തികളിലും നിങ്ങളും നിങ്ങളുടെ കുടുംബാംഗങ്ങളും സന്തോഷിക്കണം.[a]
  rationale: ദൈവനാമം ഇംഗ്ലീഷ് POB-യുടെ ‘Yahweh’ തീരുമാനത്തോട് ചേർത്ത് യഹ്വേ എന്നു തിരുത്തി. അവസാനബന്ധവാക്യം യഹ്വേ അനുഗ്രഹിക്കുന്ന വ്യക്തികളെയും അവരുടെ കൈകളുടെ പ്രവൃത്തികളുടെ മണ്ഡലത്തെയും സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്ന വിധം പുനഃക്രമീകരിച്ചു. ബഹുവചന അഭിസംബോധന മലയാളത്തിൽ നിലനിർത്തിയിരിക്കുന്നു; അവസാന എബ്രായ ഏകവചനപ്രത്യയം ആവർത്തനപുസ്തകത്തിലെ കോർപ്പറേറ്റ് അഭിസംബോധനയായതിനാൽ മലയാളത്തിലെ ആദര/സമൂഹസൂചക ‘നിങ്ങളെ’ വഴി അനാവശ്യ വ്യാഖ്യാനമില്ലാതെ കൈമാറുന്നു.
