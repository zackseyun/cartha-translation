reference: Deuteronomy 12:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/אֲכַלְתֶּם שָׁ֗ם לִ/פְנֵי֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וּ/שְׂמַחְתֶּ֗ם בְּ/כֹל֙ מִשְׁלַ֣ח יֶדְ/כֶ֔ם אַתֶּ֖ם וּ/בָתֵּי/כֶ֑ם אֲשֶׁ֥ר בֵּֽרַכְ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/007.yaml
  text: And there you shall eat before Yahweh your God[a], and you shall rejoice in all the work of your hand, you and your households, with which Yahweh your God has blessed you.
translation:
  language: ml
  text: അവിടെ, നിങ്ങളുടെ ദൈവമായ യഹ്വേയുടെ സന്നിധിയിൽ നിങ്ങൾ ഭക്ഷിക്കണം; നിങ്ങളുടെ ദൈവമായ യഹ്വേ നിങ്ങളെ അനുഗ്രഹിച്ചിരിക്കുന്ന നിങ്ങളുടെ കൈകളുടെ സകല പ്രവൃത്തികളിലും നിങ്ങളും നിങ്ങളുടെ കുടുംബാംഗങ്ങളും സന്തോഷിക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങളുടെ എല്ലാ ഉദ്യമങ്ങളിലും” അല്ലെങ്കിൽ “നിങ്ങൾ കൈവയ്ക്കുന്ന എല്ലാറ്റിലും.” എബ്രായ പ്രയോഗത്തിന്റെ അക്ഷരാർഥം “നിങ്ങളുടെ കൈയുടെ എല്ലാ നീട്ടിവിടലിലും” എന്നാണ്.
    reason: മִשְׁלַח יָד എന്ന എബ്രായ പ്രയോഗത്തിന് കൈയുടെ പ്രവൃത്തി, ഒരാൾ ഏറ്റെടുക്കുന്ന ഉദ്യമം, അല്ലെങ്കിൽ അധ്വാനത്തിന്റെ ഫലം എന്നീ പരസ്പരബന്ധമുള്ള അർഥസാധ്യതകളുണ്ട്.
lexical_decisions:
- source_word: וַאֲכַלְתֶּם
  choice: നിങ്ങൾ ഭക്ഷിക്കുകയും വേണം
  rationale: നിയമപരമായ നിർദേശസന്ദർഭത്തിൽ വാവ് ചേർന്ന ഖാൽ പൂർണരൂപത്തിന് നിർദേശാത്മകമായ ഭാവിബലം ഉണ്ട്; മലയാളത്തിൽ ‘വേണം’ ഉപയോഗിച്ച് അത് സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
- source_word: שָׁם
  choice: അവിടെ
  rationale: ചുറ്റുപാടിൽ യഹോവ തിരഞ്ഞെടുക്കുന്ന സ്ഥലത്തേക്കുള്ള സൂചന വികസിപ്പിക്കാതെ നിലനിർത്തുന്നു.
- source_word: לִפְנֵי יְהוָה אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവമായ യഹോവയുടെ സന്നിധിയിൽവെച്ച്
  rationale: לִפְנֵי എന്നത് ആരാധനയിലും ദൈവസാന്നിധ്യത്തിലുമുള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘സന്നിധിയിൽവെച്ച്’ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി ഒരു സ്ഥാനപ്പേര് കൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായി നൽകി.
- source_word: וּשְׂמַחְתֶּם
  choice: സന്തോഷിക്കുകയും വേണം
  rationale: ഭക്ഷിക്കുക എന്ന നിർദേശത്തോടുള്ള സമാന്തര നിർദേശബലവും ഉടമ്പടിപരമായ ആനന്ദവും നിലനിർത്തുന്നു.
- source_word: בְּכֹל מִשְׁלַח יֶדְכֶם
  choice: നിങ്ങളുടെ കൈകളുടെ സകല പ്രയത്നങ്ങളിലും
  rationale: ‘കൈ നീട്ടിവിടൽ’ എന്ന എബ്രായ ശൈലി ഒരാൾ ഏറ്റെടുക്കുന്ന പ്രവൃത്തികളെയോ അധ്വാനഫലത്തെയോ സൂചിപ്പിക്കുന്നു; കൈ എന്ന ദൃശ്യബിംബം ഭാഗികമായി നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന രൂപം തെരഞ്ഞെടുത്തു.
- source_word: אַתֶּם וּבָתֵּיכֶם
  choice: നിങ്ങളും നിങ്ങളുടെ കുടുംബങ്ങളും
  rationale: בָּתִּים ഇവിടെ കെട്ടിടങ്ങളെയല്ല, കുടുംബഘടകങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אֲשֶׁר בֵּרַכְךָ יְהוָה אֱלֹהֶיךָ
  choice: അവയാൽ നിങ്ങളുടെ ദൈവമായ യഹോവ നിങ്ങളെ അനുഗ്രഹിച്ചിരിക്കുന്നു
  rationale: ബന്ധവാക്യം മുൻപുള്ള പ്രയത്നങ്ങളുമായി ബന്ധിപ്പിക്കുന്നു. അവസാനത്തെ ഏകവചന അഭിസംബോധന മലയാളത്തിലെ ‘നിങ്ങളെ’ എന്ന രൂപത്തിൽ ബഹുമാന ഏകവചനമോ സമൂഹബോധമുള്ള ബഹുവചനമോ ആയി കേൾക്കാവുന്നതിനാൽ മൂലത്തിലെ കൂട്ടായ ഏകവചന-ബഹുവചന സംഘർഷം അനാവശ്യമായി തീർപ്പാക്കിയില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ചതുരക്ഷരിയായ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ ഒരു ബിരുദപദം പകരംവയ്ക്കാതെ ദൈവനാമം ലിപ്യന്തരിച്ചു.
- issue: അഭിസംബോധനയിലെ ബഹുവചനത്തിൽനിന്ന് ഏകവചനത്തിലേക്കുള്ള മാറ്റം
  choice: മലയാളത്തിലെ ‘നിങ്ങൾ/നിങ്ങളെ’ രൂപങ്ങൾ ഉപയോഗിച്ച് സമൂഹപരമായ അഭിസംബോധന നിലനിർത്തുക
  alternative: എല്ലായിടത്തും വ്യക്തമായി ‘നിങ്ങളെല്ലാവരും’ എന്നു ബഹുവചനമാക്കുക, അല്ലെങ്കിൽ എല്ലാം ഏകവചനമാക്കുക
  rationale: ആവർത്തനപുസ്തകത്തിൽ ഇസ്രായേലിനെ ഒരേസമയം സമൂഹമായും ഏകകമായും അഭിസംബോധന ചെയ്യുന്ന രീതി കാണാം. മലയാളത്തിലെ രൂപങ്ങൾ ഈ സംഘർഷം ഒരു പരിധിവരെ സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
- issue: אֲשֶׁר എന്ന ബന്ധവാക്യത്തിന്റെ ബന്ധം
  choice: പ്രയത്നങ്ങളോടു ബന്ധപ്പെടുത്തി ‘അവയാൽ ... അനുഗ്രഹിച്ചിരിക്കുന്നു’
  alternative: ‘യഹോവ നിങ്ങളെ അനുഗ്രഹിച്ചതുകൊണ്ട്’ എന്ന കാരണവാക്യം
  rationale: ബന്ധസർവനാമം മുൻപുള്ള കൈകളുടെ പ്രയത്നത്തെ സൂചിപ്പിക്കുന്നതായി വായിക്കാം; എന്നാൽ കാരണാർഥവും സാധ്യതയുള്ളതിനാൽ പ്രധാനവാചകത്തിൽ ഒറ്റ വ്യാഖ്യാനം അതിയായി വികസിപ്പിക്കാതെ സംക്ഷിപ്തമായി നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ആരാധനാപാഠത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ‘സന്നിധിയിൽവെച്ച്’, ‘പ്രയത്നം’ എന്നീ പദങ്ങൾ മൂലത്തിലെ സാന്നിധ്യവും കൈയുടെ പ്രവൃത്തിയെന്ന ദൃശ്യബിംബവും സ്വാഭാവികമായി കൈമാറുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം പ്രധാനവാചകത്തിൽ [a] ആയി ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
