  source_fidelity: തിരുത്തൽ ആവശ്യമാണ്. യഹോവ എന്ന രൂപം ഇംഗ്ലീഷ് POB-യുടെ ഉറവിടനിഷ്ഠമായ ‘Yahweh’ തീരുമാനത്തോടു പൊരുത്തപ്പെടുന്നില്ല; മലയാളത്തിൽ യഹ്വേ എന്ന ലിപ്യന്തരണം അതിനെ കൂടുതൽ കൃത്യമായി പ്രതിനിധീകരിക്കുന്നു. കൂടാതെ, ‘അവയാൽ ... അനുഗ്രഹിച്ചിരിക്കുന്നു’ എന്നത് എബ്രായ ബന്ധവാക്യത്തിന്റെ ‘യഹ്വേ നിങ്ങളെ അനുഗ്രഹിച്ചിരിക്കുന്ന/അനുഗ്രഹിച്ച’ എന്ന ബന്ധം അസ്വാഭാവികമായി മറിച്ചുവയ്ക്കുന്നു.
  naturalness: ‘കൈകളുടെ സകല പ്രയത്നങ്ങളിലും’ എന്നത് ഗ്രഹിക്കാവുന്നതാണെങ്കിലും ഈ സന്ദർഭത്തിൽ ‘നിങ്ങളുടെ കൈകളുടെ സകല പ്രവൃത്തികളിലും’ എന്ന പ്രയോഗം കൂടുതൽ സ്വാഭാവികവും, מִשְׁלַח יָד എന്ന പ്രയോഗത്തിന്റെ പ്രവർത്തി/ഉദ്യമം എന്ന വ്യാപ്തി നിലനിർത്തുന്നതുമാണ്. വാക്യഘടനയും യഹ്വേയുടെ അനുഗ്രഹം പ്രവൃത്തികളുടെ മണ്ഡലത്തിൽ അനുഭവിക്കുന്നതാണെന്ന് വ്യക്തമായി കാണിക്കണം.
  terminology: יְהוָהയ്ക്ക് യഹ്വേ ഉപയോഗിച്ചു. לִפְנֵיയ്ക്ക് ‘സന്നിധിയിൽ’ സ്വാഭാവികമാണ്. בָּתֵּיכֶם സന്ദർഭത്തിൽ കുടുംബഘടകങ്ങളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘കുടുംബാംഗങ്ങളും’ അനുയോജ്യമാണ്.
  issues:
  - severity: medium
    issue: יְהוָה ‘യഹോവ’ എന്നു നൽകിയിരിക്കുന്നു.
    rationale: നൽകപ്പെട്ട ഇംഗ്ലീഷ് POB തീരുമാനത്തിൽ ദൈവനാമം ‘Yahweh’ എന്നാണുള്ളത്. ‘യഹോവ’ സാധാരണയായി Jehovah-യോട് യോജിക്കുന്ന രൂപമാണ്; അതിനാൽ യഹ്വേ എന്നു തിരുത്തണം.
  - severity: medium
    issue: ‘അവയാൽ നിങ്ങളുടെ ദൈവമായ യഹോവ നിങ്ങളെ അനുഗ്രഹിച്ചിരിക്കുന്നു’ എന്ന അവസാനവാക്യം അസ്വാഭാവികവും ബന്ധവാക്യത്തിന്റെ അർഥബന്ധം അവ്യക്തവുമാണ്.
    rationale: אֲשֶׁר בֵּרַכְךָ യഹ്വേ നിങ്ങളെ അനുഗ്രഹിച്ചതിനെ മുൻപറഞ്ഞ കൈയുടെ പ്രവൃത്തികളുടെ/ഉദ്യമങ്ങളുടെ മണ്ഡലവുമായി ബന്ധിപ്പിക്കുന്നു; ‘അവയാൽ’ ദൈവം ഉപകരണം ഉപയോഗിച്ച് അനുഗ്രഹിച്ചെന്ന അനാവശ്യമായ അർഥം സൃഷ്ടിക്കുന്നു.
  revised_text: അവിടെ, നിങ്ങളുടെ ദൈവമായ യഹ്വേയുടെ സന്നിധിയിൽ നിങ്ങൾ ഭക്ഷിക്കണം; നിങ്ങളുടെ ദൈവമായ യഹ്വേ നിങ്ങളെ അനുഗ്രഹിച്ചിരിക്കുന്ന നിങ്ങളുടെ കൈകളുടെ സകല പ്രവൃത്തികളിലും നിങ്ങളും നിങ്ങളുടെ കുടുംബാംഗങ്ങളും സന്തോഷിക്കണം.[a]
  revised_footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങളുടെ എല്ലാ ഉദ്യമങ്ങളിലും” അല്ലെങ്കിൽ “നിങ്ങൾ കൈവയ്ക്കുന്ന എല്ലാറ്റിലും.” എബ്രായ പ്രയോഗത്തിന്റെ അക്ഷരാർഥം “നിങ്ങളുടെ കൈയുടെ എല്ലാ നീട്ടിവിടലിലും” എന്നാണ്.
    reason: മִשְׁלַח יָד എന്ന എബ്രായ പ്രയോഗത്തിന് കൈയുടെ പ്രവൃത്തി, ഒരാൾ ഏറ്റെടുക്കുന്ന ഉദ്യമം, അല്ലെങ്കിൽ അധ്വാനത്തിന്റെ ഫലം എന്നീ പരസ്പരബന്ധമുള്ള അർഥസാധ്യതകളുണ്ട്.
  revision_rationale: ദൈവനാമം ഇംഗ്ലീഷ് POB-യുടെ ‘Yahweh’ തീരുമാനത്തോട് ചേർത്ത് യഹ്വേ എന്നു തിരുത്തി. അവസാനബന്ധവാക്യം യഹ്വേ അനുഗ്രഹിക്കുന്ന വ്യക്തികളെയും അവരുടെ കൈകളുടെ പ്രവൃത്തികളുടെ മണ്ഡലത്തെയും സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്ന വിധം പുനഃക്രമീകരിച്ചു. ബഹുവചന അഭിസംബോധന മലയാളത്തിൽ നിലനിർത്തിയിരിക്കുന്നു; അവസാന എബ്രായ ഏകവചനപ്രത്യയം ആവർത്തനപുസ്തകത്തിലെ കോർപ്പറേറ്റ് അഭിസംബോധനയായതിനാൽ മലയാളത്തിലെ ആദര/സമൂഹസൂചക ‘നിങ്ങളെ’ വഴി അനാവശ്യ വ്യാഖ്യാനമില്ലാതെ കൈമാറുന്നു.
