id: DEU.12.31
reference: Deuteronomy 12:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹא תַעֲשֶׂ֣ה כֵ֔ן לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ כִּי֩ כָּל תּוֹעֲבַ֨ת יְהוָ֜ה אֲשֶׁ֣ר שָׂנֵ֗א עָשׂוּ֙ לֵ/אלֹ֣הֵי/הֶ֔ם כִּ֣י גַ֤ם אֶת בְּנֵי/הֶם֙ וְ/אֶת בְּנֹ֣תֵי/הֶ֔ם יִשְׂרְפ֥וּ בָ/אֵ֖שׁ לֵֽ/אלֹהֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/031.yaml
  text: You shall not do so to Yahweh your God[a], for they have done for their gods every abomination of Yahweh that he hates, for they even burn their sons and their daughters in the fire for their gods.
translation:
  language: ml
  text: നിന്റെ ദൈവമായ യഹ്‌വേക്കു നീ അങ്ങനെ ചെയ്യരുത്. കാരണം, യഹ്‌വെ വെറുക്കുന്ന സകല അറപ്പുളവാക്കുന്ന പ്രവൃത്തികളും അവർ തങ്ങളുടെ ദേവന്മാർക്കുവേണ്ടി ചെയ്തിട്ടുണ്ട്; തങ്ങളുടെ പുത്രന്മാരെയും പുത്രിമാരെയുംപോലും അവർ തങ്ങളുടെ ദേവന്മാർക്കുവേണ്ടി തീയിൽ ചുട്ടുകളയുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַעֲשֶׂה כֵן
  choice: നീ അങ്ങനെ ചെയ്യരുത്
  rationale: രണ്ടാം പുരുഷ ഏകവചനത്തിലുള്ള നേരിട്ടുള്ള വിലക്ക് നിലനിർത്തുകയും മുൻസന്ദർഭത്തിൽ പറഞ്ഞ ആരാധനാരീതിയിലേക്കുള്ള സൂചന സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ യഹ്‌വേക്കു
  rationale: ל എന്ന ഉപസർഗത്തിന്റെ ബന്ധ/ദിശാഭാവവും אֱלֹהֶיךָ എന്ന ഉടമ്പടിസംബോധനയും നിലനിർത്തുന്നു; ദൈവനാമം യഹ്‌വെ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: כָּל תּוֹעֲבַת יְהוָה אֲשֶׁר שָׂנֵא
  choice: യഹ്‌വെ വെറുക്കുന്ന സകല മ്ലേച്ഛതകളും
  rationale: തּוֹעֵבָהയുടെ ശക്തമായ ധാർമിക-ആരാധനാപരമായ വെറുപ്പാർന്ന അർഥം ‘മ്ലേച്ഛത’യിലൂടെ സൂക്ഷിക്കുന്നു. മലയാളത്തിൽ അസ്വാഭാവികമാകാവുന്ന പദാനുപദബന്ധത്തിനു പകരം אֲשֶׁר שָׂנֵא എന്ന വ്യക്തമായ ബന്ധവാക്യത്തെ ചേർത്ത് സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: עָשׂוּ לֵאלֹהֵיהֶם
  choice: അവർ തങ്ങളുടെ ദേവന്മാർക്കുവേണ്ടി ചെയ്തിട്ടുണ്ട്
  rationale: പൂർണക്രിയയുടെ മുൻകാലവും ഇപ്പോഴത്തെ പ്രസക്തിയും ‘ചെയ്തിട്ടുണ്ട്’ എന്നതിലൂടെ നൽകുന്നു; ל ആരാധനാപരമായ ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നതിനാൽ ‘ദേവന്മാർക്കുവേണ്ടി’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: כִּי גַם
  choice: '...പോലും'
  rationale: ഭയാനകമായ ഉദാഹരണത്തെ ഊന്നിപ്പറയുന്ന גַם എന്നതിന്റെ ശക്തി മലയാളത്തിലെ ‘പോലും’ സ്വാഭാവികമായി വഹിക്കുന്നു; ആദ്യത്തെ ‘കാരണം’ כִּיയുടെ വിശദീകരണസ്വഭാവം നൽകുന്നു.
- source_word: אֶת בְּנֵיהֶם וְאֶת בְּנֹתֵיהֶם
  choice: തങ്ങളുടെ പുത്രന്മാരെയും പുത്രിമാരെയും
  rationale: ആൺമക്കളെയും പെൺമക്കളെയും പ്രത്യേകം പറയുന്ന എബ്രായരൂപം ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: יִשְׂרְפוּ בָאֵשׁ
  choice: തീയിൽ ചുട്ടുകളയുന്നു
  rationale: ആചാരപരമായ യഥാർഥ ദഹനത്തിന്റെ ഭീകരത വ്യക്തമായി നിലനിർത്തുന്നു; അപൂർണക്രിയയെ ജനതകളുടെ പതിവുപ്രവൃത്തിയായി വർത്തമാനകാലത്തിൽ നൽകുന്നു.
- source_word: לֵאלֹהֵיהֶם
  choice: തങ്ങളുടെ ദേവന്മാർക്കുവേണ്ടി
  rationale: കുട്ടികളെ ദേവന്മാരോടു ബന്ധപ്പെട്ട ആരാധനാർപ്പണമായി ദഹിപ്പിച്ചുവെന്ന ആരാധനാപരമായ ലക്ഷ്യം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള നാലക്ഷര ദൈവനാമത്തെ ഒരു പദവിയായി മാറ്റാതെ, പൊതുവായി അംഗീകരിക്കപ്പെട്ട ഉച്ചാരണത്തെ ആധാരമാക്കി മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: תּוֹעֵבָה, שָׂנֵא എന്നിവയിലെ ദൈവിക ധാർമിക വിലയിരുത്തലിന്റെ ശക്തി
  choice: മ്ലേച്ഛത; വെറുക്കുന്ന
  alternative: അറപ്പുളവാക്കുന്ന കാര്യം; ഇഷ്ടപ്പെടാത്ത
  rationale: മൂലപാഠത്തിലെ കഠിനമായ ധാർമികവും ആരാധനാപരവുമായ വിലയിരുത്തൽ മയപ്പെടുത്താതെ നിലനിർത്തുന്നു.
- issue: תּוֹעֲבַת יְהוָה എന്ന നിർമാണബന്ധത്തിന്റെ അവതരണം
  choice: യഹ്‌വെ വെറുക്കുന്ന സകല മ്ലേച്ഛതകളും
  alternative: യഹ്‌വെയുടെ സകല മ്ലേച്ഛതകളും
  rationale: എബ്രായ നിർമാണബന്ധത്തിന് ‘യഹ്‌വെയ്ക്ക് മ്ലേച്ഛമായ’ എന്ന ബന്ധാർഥം ഉണ്ടാകാം. പിന്നാലെയുള്ള ‘അവൻ വെറുക്കുന്ന’ എന്ന ബന്ധവാക്യം ആ അർഥം വ്യക്തമാക്കുന്നതിനാൽ, മലയാളത്തിൽ ദൈവത്തിന്റേതായ മ്ലേച്ഛതകൾ എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കി സ്വാഭാവികമായി ചേർത്തു പരിഭാഷപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള, പൊതുവായ വായനാശൈലി. ഏകവചന ഉടമ്പടിസംബോധനയായ ‘നീ/നിന്റെ’ നിലനിർത്തിയിരിക്കുന്നു. ‘മ്ലേച്ഛത’ ശക്തമായെങ്കിലും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന ബൈബിൾ-ഗൗരവമുള്ള പദമാണ്. ഈ കരടിൽ അടിക്കുറിപ്പുകളില്ല; അതിനാൽ മുഖ്യപാഠത്തിൽ അടിക്കുറിപ്പ് ചിഹ്നവും ആവശ്യമില്ല.
