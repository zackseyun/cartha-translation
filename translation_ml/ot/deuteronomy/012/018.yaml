source:
  edition: WLC
  text: כִּ֡י אִם לִ/פְנֵי֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ תֹּאכְלֶ֗/נּוּ בַּ/מָּקוֹם֙ אֲשֶׁ֨ר יִבְחַ֜ר יְהוָ֣ה אֱלֹהֶי/ךָ֮ בּ/וֹ֒ אַתָּ֨ה וּ/בִנְ/ךָ֤ וּ/בִתֶּ֨/ךָ֙ וְ/עַבְדְּ/ךָ֣ וַ/אֲמָתֶ֔/ךָ וְ/הַ/לֵּוִ֖י אֲשֶׁ֣ר בִּ/שְׁעָרֶ֑י/ךָ וְ/שָׂמַחְתָּ֗ לִ/פְנֵי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כֹ֖ל מִשְׁלַ֥ח יָדֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/018.yaml
  text: Instead[b][a], you shall eat it before Yahweh your God in the place that Yahweh your God will choose—you and your son and your daughter and your male servant and your female servant and the Levite who is within your gates—and you shall rejoice before Yahweh your God in all to which you put your hand.
translation:
  language: ml
  text: പകരം, നിന്റെ ദൈവമായ യഹോവ തിരഞ്ഞെടുക്കുന്ന സ്ഥലത്ത്, അവിടുത്തെ സന്നിധിയിൽവെച്ചു നീ അതു ഭക്ഷിക്കണം—നീയും നിന്റെ മകനും മകളും നിന്റെ ദാസനും ദാസിയും നിന്റെ പട്ടണങ്ങളിൽ താമസിക്കുന്ന ലേവ്യനും[a] ചേർന്ന്. നിന്റെ ദൈവമായ യഹോവയുടെ സന്നിധിയിൽ, നീ കൈവയ്ക്കുന്ന എല്ലാ കാര്യങ്ങളിലും[b] നീ സന്തോഷിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘നിന്റെ കവാടങ്ങൾക്കുള്ളിലുള്ള ലേവ്യൻ’; സ്വന്തം പട്ടണത്തിലോ പ്രാദേശിക സമൂഹത്തിലോ താമസിക്കുന്നവരെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം.
    reason: cultural_note
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘നിന്റെ കൈ അയയ്ക്കപ്പെടുന്ന സകലത്തിലും’; അതായത്, നീ ചെയ്യുന്നോ ഏറ്റെടുക്കുന്നോ ആയ എല്ലാ കാര്യങ്ങളിലും.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: പകരം
  rationale: മുൻവാക്യത്തിലെ നിരോധനത്തിനു വിപരീതമായി അനുവദിക്കപ്പെട്ട ഏക മാർഗം അവതരിപ്പിക്കുന്ന നിയന്ത്രണാത്മക പ്രയോഗമാണിത്. ‘പകരം’ ആ വൈരുധ്യം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ യഹോവയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי എന്നതിന്റെ ‘മുമ്പിൽ/സന്നിധിയിൽ’ എന്ന അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുകയും ദൈവനാമം നേരിട്ട് നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: תֹּאכְלֶנּוּ
  choice: നീ അതു ഭക്ഷിക്കണം
  rationale: രണ്ടാംപുരുഷ ഏകവചന നിർദേശഭാവവും മുമ്പ് പറഞ്ഞ വിശുദ്ധ വിഹിതത്തെ സൂചിപ്പിക്കുന്ന ഏകവചന കർമപ്രത്യയവും നിലനിർത്തുന്നു.
- source_word: וְעַבְדְּךָ וַאֲמָתֶךָ
  choice: നിന്റെ ദാസനും ദാസിയും
  rationale: പുരുഷ-സ്ത്രീ ഗൃഹസേവകരെ വേർതിരിച്ചുകാണിക്കുന്ന എബ്രായ പദജോടി ചുരുക്കമായും പരമ്പരാഗതമായും വ്യക്തമാക്കുന്നു.
- source_word: וְהַלֵּוִי אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: നിന്റെ പട്ടണങ്ങളിൽ താമസിക്കുന്ന ലേവ്യനും
  rationale: ‘നിന്റെ കവാടങ്ങൾക്കുള്ളിൽ’ എന്ന എബ്രായ പൗരസമൂഹപ്രയോഗത്തിന്റെ ഉദ്ദേശ്യം സാധാരണ മലയാളവായനക്കാർക്ക് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וְשָׂמַחְתָּ
  choice: നീ സന്തോഷിക്കണം
  rationale: ആരാധനയോടു ബന്ധപ്പെട്ട സജീവമായ ആനന്ദത്തിന്റെ നിർദേശഭാവം ലളിതവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְּכֹל מִשְׁלַח יָדֶךָ
  choice: നീ കൈവയ്ക്കുന്ന എല്ലാ കാര്യങ്ങളിലും
  rationale: കൈ അയയ്ക്കപ്പെടുന്ന പ്രവൃത്തി എന്ന എബ്രായ ദൃശ്യഭാഷ ഭാഗികമായി നിലനിർത്തിക്കൊണ്ട് ‘നീ ചെയ്യുന്നോ ഏറ്റെടുക്കുന്നോ ആയ എല്ലാം’ എന്ന ആശയം സ്വാഭാവികമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: വാക്യത്തിൽ വന്നിരിക്കുന്ന ചതുർവ്യഞ്ജന ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ലിപ്യന്തരണരൂപത്തിൽ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിർദേശശൈലി ഉപയോഗിച്ചു. മൂലത്തിലെ രണ്ടാംപുരുഷ ഏകവചന അഭിസംബോധന നിലനിർത്തി; നീണ്ട പട്ടിക വായനാസൗകര്യത്തിനായി ഡാഷും പുതിയ വാക്യവും ഉപയോഗിച്ച് ക്രമപ്പെടുത്തി.
