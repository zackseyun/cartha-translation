source:
  edition: WLC
  text: אֵ֠לֶּה הַֽ/חֻקִּ֣ים וְ/הַ/מִּשְׁפָּטִים֮ אֲשֶׁ֣ר תִּשְׁמְר֣וּ/ן לַ/עֲשׂוֹת֒ בָּ/אָ֕רֶץ אֲשֶׁר֩ נָתַ֨ן יְהוָ֜ה אֱלֹהֵ֧י אֲבֹתֶ֛י/ךָ לְ/ךָ֖ לְ/רִשְׁתָּ֑/הּ כָּל הַ/יָּמִ֔ים אֲשֶׁר אַתֶּ֥ם חַיִּ֖ים עַל הָ/אֲדָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/001.yaml
  text: These are the statutes and the judgments that you shall be careful to do in the land that Yahweh[a], the God of your fathers, has given you to possess[c][b], all the days that you are living on the earth.
translation:
  language: ml
  text: നിന്റെ പിതാക്കന്മാരുടെ ദൈവമായ യഹ്‌വേ നിനക്കു കൈവശമാക്കാൻ[b] നൽകിയ ദേശത്ത്, നിങ്ങൾ ഭൂമിയിൽ[c] ജീവിക്കുന്ന കാലമൊക്കെയും ശ്രദ്ധയോടെ അനുഷ്ഠിക്കേണ്ട ചട്ടങ്ങളും ന്യായവിധികളും[a] ഇവയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ന്യായവിധികൾ’ എന്നതിന് ‘നിയമവിധികൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘കൈവശമാക്കാൻ’ എന്നതിന് ‘അവകാശമായി ലഭിക്കാൻ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: ഹീബ്രുവിൽ ‘ഭൂമിയിൽ’; ചിലർ ഇത് കൂടുതൽ പരിമിതമായ അർഥത്തിൽ ‘ദേശത്ത്’ എന്നു മനസ്സിലാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֻקִּים
  choice: ചട്ടങ്ങൾ
  rationale: നിയമപരമായ സ്ഥിരനിർദേശങ്ങൾ എന്ന ആശയം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; തുടർന്നുള്ള מִשְׁפָּטִים എന്ന പദത്തിൽനിന്നുള്ള വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: וְהַמִּשְׁפָּטִים
  choice: ന്യായവിധികൾ
  rationale: നിയമവിധികൾ അല്ലെങ്കിൽ നീതിനിയമങ്ങൾ എന്ന അർഥവ്യാപ്തി സൂക്ഷിക്കുകയും חֻקִּים എന്ന പദവുമായി കലരാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: אֲשֶׁר תִּשְׁמְרוּן לַעֲשׂוֹת
  choice: ശ്രദ്ധയോടെ അനുഷ്ഠിക്കേണ്ട
  rationale: שׁמר എന്നതിലെ സൂക്ഷ്മശ്രദ്ധയും עשה എന്നതിലെ പ്രവൃത്തിപരമായ അനുസരണവും സ്വാഭാവിക മലയാളത്തിൽ ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: בָּאָרֶץ
  choice: ദേശത്ത്
  rationale: സന്ദർഭത്തിൽ വാഗ്ദത്തഭൂമിയെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ പൊതുവായ ‘ഭൂമിയിൽ’ എന്നതിനെക്കാൾ ‘ദേശത്ത്’ കൃത്യമാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: אֱלֹהֵי אֲבֹתֶיךָ
  choice: നിന്റെ പിതാക്കന്മാരുടെ ദൈവം
  rationale: ഉടമ്പടിസൂത്രവാക്യത്തിന്റെ പിതൃസംബന്ധമായ ഭാഷയും ഹീബ്രുവിലെ ഏകവചന അഭിസംബോധനയും സംരക്ഷിക്കുന്നു.
- source_word: לְרִשְׁתָּהּ
  choice: കൈവശമാക്കാൻ
  rationale: ആ ദേശം ഏറ്റെടുത്തു കൈവശം വയ്ക്കുക എന്ന ആവർത്തനപുസ്തകസന്ദർഭത്തിലെ സജീവമായ അർഥം നൽകുന്നു; ‘അവകാശമായി ലഭിക്കാൻ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: כָּל הַיָּמִים אֲשֶׁר אַתֶּם חַיִּים
  choice: നിങ്ങൾ ... ജീവിക്കുന്ന കാലമൊക്കെയും
  rationale: കാലത്തിന്റെ സമഗ്രതയും തുടർച്ചയും നിലനിർത്തുന്നു; ഇവിടെ ഹീബ്രുവിലുള്ള ബഹുവചന അഭിസംബോധനയും പ്രകടമാക്കുന്നു.
- source_word: עַל הָאֲדָמָה
  choice: ഭൂമിയിൽ
  rationale: മുമ്പത്തെ בָּאָרֶץ എന്ന ‘ദേശത്ത്’ എന്ന പ്രയോഗത്തിൽനിന്ന് വേർതിരിച്ച്, ജീവിച്ചിരിക്കുന്ന മുഴുവൻ കാലത്തെയും സൂചിപ്പിക്കുന്ന വിശാലമായ അർഥം നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ ഒരു സ്ഥാനപ്പേര് പകരംവയ്ക്കാതെ അതിനെ ലിപ്യന്തരണം ചെയ്തു.
- issue: ഏകവചനത്തിൽനിന്ന് ബഹുവചനത്തിലേക്കുള്ള അഭിസംബോധനമാറ്റം
  choice: ‘നിന്റെ/നിനക്കു’ എന്ന ഏകവചനവും ‘നിങ്ങൾ’ എന്ന ബഹുവചനവും നിലനിർത്തി
  alternative: വാക്യമെങ്ങും ‘നിങ്ങളുടെ/നിങ്ങൾക്ക്/നിങ്ങൾ’ എന്ന് ഏകീകരിക്കുക
  rationale: אֲבֹתֶיךָ, לְךָ എന്നിവ ഏകവചനവും אַתֶּם חַיִּים ബഹുവചനവുമാണ്. ഈ ആവർത്തനപുസ്തകസവിശേഷമായ മാറ്റം വ്യാഖ്യാനിച്ച് ഇല്ലാതാക്കാതെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമഭാഷയാണ് ഉപയോഗിച്ചത്. വാക്യഘടന വായനാസൗകര്യത്തിനായി മലയാളക്രമത്തിലാക്കിയെങ്കിലും, ദേശം/ഭൂമി എന്ന പദവ്യത്യാസവും ഏകവചന-ബഹുവചന അഭിസംബോധനമാറ്റവും മൂലപാഠാനുസൃതമായി സൂക്ഷിച്ചു.
