reference: Deuteronomy 12:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/נִתַּצְתֶּ֣ם אֶת מִזְבּחֹתָ֗/ם וְ/שִׁבַּרְתֶּם֙ אֶת מַצֵּ֣בֹתָ֔/ם וַ/אֲשֵֽׁרֵי/הֶם֙ תִּשְׂרְפ֣וּ/ן בָּ/אֵ֔שׁ וּ/פְסִילֵ֥י אֱלֹֽהֵי/הֶ֖ם תְּגַדֵּע֑וּ/ן וְ/אִבַּדְתֶּ֣ם אֶת שְׁמָ֔/ם מִן הַ/מָּק֖וֹם הַ/הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/003.yaml
  text: You shall tear down their altars[a], shatter their sacred pillars, burn their Asherah poles with fire, cut down the carved images of their gods[c][b], and destroy their name from that place.
translation:
  language: ml
  text: അവരുടെ ബലിപീഠങ്ങൾ നിങ്ങൾ ഇടിച്ചുകളയണം; അവരുടെ പൂജാസ്തംഭങ്ങൾ തകർക്കണം; അവരുടെ അശേരാപ്രതീകങ്ങൾ[a] തീയിൽ ചുട്ടുകളയണം; അവരുടെ ദേവന്മാരുടെ കൊത്തുപ്രതിമകൾ[b] വെട്ടിവീഴ്ത്തണം; ആ സ്ഥലത്തുനിന്ന് അവരുടെ പേര് ഇല്ലാതാക്കണം.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അവരുടെ അശേരകൾ’ അല്ലെങ്കിൽ ‘അവരുടെ അശേരാസ്തംഭങ്ങൾ.’ എബ്രായപദം അശേരയുമായി ബന്ധപ്പെട്ട ആരാധനാവസ്തുക്കളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘അവരുടെ വിഗ്രഹങ്ങൾ.’ ‘കൊത്തുപ്രതിമകൾ’ എന്ന എബ്രായപ്രയോഗം ഈ ആരാധനാവസ്തുക്കൾ മനുഷ്യർ നിർമ്മിച്ചവയാണെന്ന വശം ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
  - marker: c
    text: ‘അവരുടെ പേര് ഇല്ലാതാക്കുക’ എന്നത് ആ ആരാധനാസ്ഥലത്തുനിന്ന് അവരുടെ സ്മരണയും ആരാധനാപരമായ സാന്നിധ്യവും നീക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: נִתַּצְתֶּם אֶת מִזְבּחֹתָם
  choice: അവരുടെ ബലിപീഠങ്ങൾ നിങ്ങൾ ഇടിച്ചുകളയണം
  rationale: נתץ നിർമിതികളെ പൊളിച്ചുകളയുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ഇടിച്ചുകളയണം’ ബലിപീഠങ്ങൾക്കു യോജിക്കുന്ന സ്വാഭാവികവും ശക്തവുമായ ആധുനിക മലയാളമാണ്.
- source_word: וְשִׁבַּרְתֶּם אֶת מַצֵּבֹתָם
  choice: അവരുടെ പൂജാസ്തംഭങ്ങൾ തകർക്കണം
  rationale: מַצֵּבָה ആരാധനയുമായി ബന്ധപ്പെട്ടുനിർത്തിയ കല്ലിനെയോ സ്തംഭത്തെയോ സൂചിപ്പിക്കുന്നു. ‘പൂജാസ്തംഭങ്ങൾ’ വസ്തുവിനെയും അതിന്റെ മതപരമായ ഉപയോഗത്തെയും സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
- source_word: וַאֲשֵׁרֵיהֶם תִּשְׂרְפוּן בָּאֵשׁ
  choice: അവരുടെ അശേരാപ്രതീകങ്ങൾ തീയിൽ ചുട്ടുകളയണം
  rationale: אֲשֵׁרִים എന്നത് അശേരയുമായി ബന്ധപ്പെട്ട ആരാധനാവസ്തുക്കളെ സൂചിപ്പിക്കുന്നു; അവയുടെ കൃത്യരൂപത്തെക്കുറിച്ചുള്ള അനിശ്ചിതത്വം ‘അശേരാപ്രതീകങ്ങൾ’ നിലനിർത്തുന്നു. ‘തീയിൽ’ എന്നത് בָּאֵשׁ എന്ന പദപ്രയോഗത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וּפְסִילֵי אֱלֹהֵיהֶם תְּגַדֵּעוּן
  choice: അവരുടെ ദേവന്മാരുടെ കൊത്തുപ്രതിമകൾ വെട്ടിവീഴ്ത്തണം
  rationale: פֶּסֶל നിർമ്മിച്ചോ കൊത്തിയെടുത്തോ ഉള്ള ആരാധനാപ്രതിമയാണ്; ‘കൊത്തുപ്രതിമകൾ’ അതിന്റെ നിർമ്മിതസ്വഭാവം നിലനിർത്തുന്നു. גדע എന്ന ക്രിയയുടെ വെട്ടിയകറ്റുക/വെട്ടിവീഴ്ത്തുക എന്ന ശക്തമായ അർഥം ഇവിടെ സൂക്ഷിച്ചിരിക്കുന്നു.
- source_word: וְאִבַּדְתֶּם אֶת שְׁמָם מִן הַמָּקוֹם הַהוּא
  choice: ആ സ്ഥലത്തുനിന്ന് അവരുടെ പേര് ഇല്ലാതാക്കണം
  rationale: ‘പേര് ഇല്ലാതാക്കുക’ എന്ന എബ്രായ പ്രയോഗം വിശദീകരിച്ച് ചുരുക്കാതെ മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; ഇവിടെ അത് ആ ആരാധനാസ്ഥലത്തുനിന്നുള്ള സ്മരണയുടെയും അംഗീകൃത സാന്നിധ്യത്തിന്റെയും നീക്കത്തെ സൂചിപ്പിക്കാം.
theological_decisions:
- issue: אֲשֵׁרֵיהֶם എന്ന പദത്തിന്റെ രൂപപരവും മതപരവുമായ സൂചന
  choice: അശേരാപ്രതീകങ്ങൾ
  alternative: അശേരാസ്തംഭങ്ങൾ; അശേരകൾ; വിശുദ്ധ പൂജാക്കോലുകൾ
  rationale: ഈ പദം അശേരയുമായി ബന്ധപ്പെട്ട ആരാധനാവസ്തുക്കളെ സൂചിപ്പിക്കുന്നുവെങ്കിലും അവ എല്ലായിടത്തും ഒരേ രൂപത്തിലുള്ള മരക്കോലുകളായിരുന്നു എന്ന് പാഠം നിർബന്ധിക്കുന്നില്ല. അതിനാൽ പ്രത്യേകതയും യഥാർഥ അനിശ്ചിതത്വവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- issue: פְסִילֵי אֱלֹהֵיהֶם എന്നതിന്റെ വിവർത്തനം
  choice: അവരുടെ ദേവന്മാരുടെ കൊത്തുപ്രതിമകൾ
  alternative: അവരുടെ വിഗ്രഹങ്ങൾ; അവരുടെ ദേവന്മാരുടെ കൊത്തിയ രൂപങ്ങൾ
  rationale: ‘വിഗ്രഹങ്ങൾ’ മതശാസ്ത്രപരമായി വ്യക്തമായിരിക്കുമെങ്കിലും, എബ്രായപദം ഊന്നുന്ന കൊത്തിയുണ്ടാക്കിയ വസ്തുസ്വഭാവം ‘കൊത്തുപ്രതിമകൾ’ കൂടുതൽ നേരിട്ട് നൽകുന്നു.
- issue: ‘അവരുടെ പേര് ഇല്ലാതാക്കണം’ എന്ന പ്രയോഗത്തിന്റെ പരിധി
  choice: എബ്രായത്തിലെ സംക്ഷിപ്തമായ നാമപ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തുക
  alternative: അവരുടെ ആരാധനാസ്മരണം മായിച്ചുകളയണം; അവരുടെ ദേവന്മാരുടെ പേരുകൾ നീക്കണം
  rationale: ‘പേര്’ എന്നത് വെറും എഴുത്തിലുള്ള നാമമോ പ്രശസ്തിയോ മാത്രമാണെന്ന് പരിമിതപ്പെടുത്താതെ, ആ സ്ഥലത്തെ സ്മരണ, വിളിച്ചപേക്ഷിക്കൽ, ആരാധനാപരമായ സാന്നിധ്യം എന്നിവ ഉൾക്കൊള്ളാവുന്ന പ്രയോഗമായി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ നിർദേശശൈലി ഉപയോഗിച്ചു. എബ്രായത്തിലെ രണ്ടാംപുരുഷ ബഹുവചനം ആദ്യ ക്രിയയിൽ ‘നിങ്ങൾ’ എന്നു വ്യക്തമാക്കി; തുടർന്നുള്ള സമാന്തര ക്രിയകളിൽ മലയാളത്തിന്റെ സ്വാഭാവികതയ്ക്കായി അത് ആവർത്തിച്ചിട്ടില്ല. എല്ലാ അടിക്കുറിപ്പുകുറികളും ബന്ധപ്പെട്ട പദപ്രയോഗങ്ങൾക്കരികിൽ ചേർത്തിരിക്കുന്നു.
