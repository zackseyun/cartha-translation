source:
  edition: WLC
  text: רַ֣ק חֲזַ֗ק לְ/בִלְתִּי֙ אֲכֹ֣ל הַ/דָּ֔ם כִּ֥י הַ/דָּ֖ם ה֣וּא הַ/נָּ֑פֶשׁ וְ/לֹא תֹאכַ֥ל הַ/נֶּ֖פֶשׁ עִם הַ/בָּשָֽׂר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/023.yaml
  text: Only be sure not to eat the blood[a], because the blood is the life, and you shall not eat the life with the flesh.
translation:
  language: ml
  text: എന്നാൽ രക്തം ഭക്ഷിക്കാതിരിക്കാൻ പ്രത്യേകം ശ്രദ്ധിക്കണം[a]; കാരണം രക്തം ജീവൻ തന്നെയാണ്. മാംസത്തോടൊപ്പം ജീവനെ ഭക്ഷിക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിലെ נֶפֶשׁ എന്ന പദത്തിന് ഇവിടെ രണ്ടിടത്തും ‘ജീവൻ’ എന്നതിനുപകരം ‘പ്രാണൻ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഈ സന്ദർഭത്തിൽ അത് ജീവിയുടെ സജീവജീവനെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: മാത്രം
  rationale: മുമ്പ് നൽകിയ അനുമതിക്കുള്ള ശക്തമായ നിയന്ത്രണം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ അപവാദഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: חֲזַק
  choice: ദൃഢനിശ്ചയമുള്ളവനായിരിക്കുക
  rationale: പദശഃ ‘ശക്തനായിരിക്കുക’ എന്നാണെങ്കിലും, לְבִלְתִּי എന്ന ഘടനയോടൊപ്പം ഒരു കാര്യം ചെയ്യാതിരിക്കാൻ ഉറച്ചുനിൽക്കണമെന്ന ശക്തമായ ആഹ്വാനമാണ്.
- source_word: לְבִלְתִּי אֲכֹל
  choice: ഭക്ഷിക്കാതിരിക്കാൻ
  rationale: ഭക്ഷിക്കാതിരിക്കാനുള്ള ഉറച്ച ജാഗ്രതയെയോ ലക്ഷ്യത്തെയോ ഈ ഘടന വ്യക്തമാക്കുന്നു.
- source_word: הַדָּם
  choice: രക്തം
  rationale: നേരിട്ടുള്ള മലയാള പരിഭാഷ; വാക്യത്തിലെ ആവർത്തനവും നിലനിർത്തുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: നിരോധനത്തിനുള്ള കാരണം അവതരിപ്പിക്കുന്ന കാരണാർഥക ബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: הַנָּפֶשׁ
  choice: ജീവൻ
  rationale: ഈ ഭക്ഷണനിയമസന്ദർഭത്തിൽ נֶפֶשׁ ജീവിയുടെ പ്രാണജീവനെയാണ് സൂചിപ്പിക്കുന്നത്; ദേഹത്തിൽനിന്നു വേറിട്ട ആത്മാവ് എന്ന പിൽക്കാല ദാർശനിക അർഥം നിർബന്ധിക്കുന്നില്ല.
- source_word: וְלֹא תֹאכַל
  choice: നീ ഭക്ഷിക്കരുത്
  rationale: നിയമോപദേശത്തിലെ നിരോധനശക്തി സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: הַנֶּפֶשׁ עִם הַבָּשָׂר
  choice: മാംസത്തോടൊപ്പം ജീവനെ
  rationale: രക്തവും ജീവനും തമ്മിലുള്ള മുൻവാക്യത്തിലെ ബന്ധം നിലനിർത്തുകയും בשר എന്നതിനെ ഭക്ഷ്യസന്ദർഭത്തിൽ സ്വാഭാവികമായ ‘മാംസം’ എന്നു പരിഭാഷപ്പെടുത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ഭക്ഷണനിയമസന്ദർഭത്തിലെ נֶפֶשׁ എന്ന പദത്തിന്റെ അർഥം
  choice: ജീവൻ
  alternative: പ്രാണൻ / ആത്മാവ്
  rationale: ഇവിടെ വാക്യം രക്തനിരോധനത്തെ ജീവിയുടെ ജീവൻ രക്തത്തിലാണെന്ന ആശയത്തിലൂടെ വിശദീകരിക്കുന്നു. ‘ആത്മാവ്’ എന്നു നൽകിയാൽ മൂലപാഠം ആവശ്യപ്പെടാത്ത ശരീരം–ആത്മാവ് ദ്വൈതവാദം വായനക്കാരൻ ഉൾക്കൊള്ളാൻ ഇടയുണ്ട്; ‘ജീവൻ’ സന്ദർഭത്തിന്റെ യുക്തിയും യഥാർഥമായ അർഥപരിധിയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമോപദേശശൈലി. ‘ദൃഢനിശ്ചയമുള്ളവനായിരിക്കുക’ എന്ന പ്രയോഗം എബ്രായത്തിലെ ശക്തമായ ആഹ്വാനം നിലനിർത്തുന്നു; ‘ജീവൻ’ എന്ന ആവർത്തനം മൂലപാഠത്തിലെ ആശയബന്ധം സംരക്ഷിക്കുന്നു.
