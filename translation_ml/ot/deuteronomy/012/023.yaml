revisions:
- from: രക്തം ഭക്ഷിക്കാതിരിക്കാൻ മാത്രം ദൃഢനിശ്ചയമുള്ളവനായിരിക്കുക[a]; കാരണം രക്തം ജീവൻ തന്നെയാണ്. മാംസത്തോടൊപ്പം ജീവനെ നീ ഭക്ഷിക്കരുത്.
  to: എന്നാൽ രക്തം ഭക്ഷിക്കാതിരിക്കാൻ പ്രത്യേകം ശ്രദ്ധിക്കണം[a]; കാരണം രക്തം ജീവൻ തന്നെയാണ്. മാംസത്തോടൊപ്പം ജീവനെ ഭക്ഷിക്കരുത്.
