revisions:
- from: നിന്റെ ദൈവമായ യഹ്‌വെയുടെ യാഗപീഠത്തിന്മേൽ നിന്റെ ഹോമയാഗങ്ങൾ—മാംസവും രക്തവും—നീ അർപ്പിക്കണം. നിന്റെ യാഗങ്ങളുടെ രക്തം നിന്റെ ദൈവമായ യഹ്‌വെയുടെ യാഗപീഠത്തിന്മേൽ ഒഴിക്കണം; മാംസം നീ ഭക്ഷിക്കണം.[a]
  to: നിന്റെ ദൈവമായ യഹ്‌വെയുടെ യാഗപീഠത്തിന്മേൽ നിന്റെ ഹോമയാഗങ്ങൾ, മാംസവും രക്തവും, നീ അർപ്പിക്കണം. നിന്റെ യാഗങ്ങളുടെ രക്തം നിന്റെ ദൈവമായ യഹ്‌വെയുടെ യാഗപീഠത്തിന്മേൽ ഒഴിക്കപ്പെടും; മാംസം നീ ഭക്ഷിക്കണം.[a]
  rationale: രണ്ടാമത്തെ വാക്യത്തിലെ יִשָּׁפֵךְ എന്ന നിഫാൽ രൂപത്തിന്റെ കർമണിഭാവം ‘ഒഴിക്കപ്പെടും’ എന്നു പുനഃസ്ഥാപിച്ചു. ആദ്യവാക്യത്തിലെ ദീർഘവരകൾ കോമകളാക്കി, അർപ്പണത്തിന്റെ ഘടകങ്ങളായ മാംസവും രക്തവും വ്യക്തമായി ചേർത്തു. അവസാന ഉപവാക്യത്തിന്റെ ഔപചാരിക നിർദേശവായനയും അതിന്റെ സാദ്ധ്യമായ അനുമതിവായനയും യഥാക്രമം മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും നിലനിർത്തി.
