source:
  edition: WLC
  text: וְ/עָשִׂ֤יתָ עֹלֹתֶ֨י/ךָ֙ הַ/בָּשָׂ֣ר וְ/הַ/דָּ֔ם עַל מִזְבַּ֖ח יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/דַם זְבָחֶ֗י/ךָ יִשָּׁפֵךְ֙ עַל מִזְבַּח֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/הַ/בָּשָׂ֖ר תֹּאכֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/027.yaml
  text: And you shall offer your burnt offerings[a], the flesh and the blood, on the altar of Yahweh your God; and the blood of your sacrifices shall be poured out on the altar of Yahweh your God, and you shall eat the flesh.
translation:
  language: ml
  text: നിന്റെ ദൈവമായ യഹ്‌വെയുടെ യാഗപീഠത്തിന്മേൽ നിന്റെ ഹോമയാഗങ്ങൾ, മാംസവും രക്തവും, നീ അർപ്പിക്കണം. നിന്റെ യാഗങ്ങളുടെ രക്തം നിന്റെ ദൈവമായ യഹ്‌വെയുടെ യാഗപീഠത്തിന്മേൽ ഒഴിക്കപ്പെടും; മാംസം നീ ഭക്ഷിക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “എന്നാൽ മാംസം നിനക്കു ഭക്ഷിക്കാം.” സന്ദർഭത്തിൽ ഈ വാക്കുകൾ മാംസം ഭക്ഷിക്കാനുള്ള അനുമതിയായി മനസ്സിലാക്കാം.'
    reason: വ്യാകരണരൂപം നിർദേശമായി പരിഭാഷപ്പെടുത്താമെങ്കിലും, യാഗനിയമസന്ദർഭം അനുമതിയെന്ന അർഥവും അനുവദിക്കുന്നു.
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: നീ അർപ്പിക്കണം
  rationale: ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘ചെയ്യുക/ഉണ്ടാക്കുക’ എന്നാണെങ്കിലും, עֹלֹתֶיךָ എന്ന യാഗപദത്തോടൊപ്പം ഇവിടെ യാഗം അർപ്പിക്കുന്ന കർമത്തെ സൂചിപ്പിക്കുന്നു. ‘അർപ്പിക്കണം’ മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭസൂചകവുമാണ്.
- source_word: עֹלֹתֶיךָ
  choice: നിന്റെ ഹോമയാഗങ്ങൾ
  rationale: עֹלָה യാഗപീഠത്തിൽ പൂർണമായി ദഹിപ്പിക്കുന്ന യാഗത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ ആരാധനാപദമാണ്. മലയാളത്തിൽ ‘ഹോമയാഗം’ വ്യക്തവും പരിചിതവുമായ തുല്യപദമാണ്.
- source_word: הַבָּשָׂר וְהַדָּם
  choice: മാംസവും രക്തവും
  rationale: ബലിയുടെ ഭൗതിക ഘടകങ്ങളായ മാംസത്തെയും രക്തത്തെയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: עַל מִזְבַּח יְהוָה אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ യഹ്‌വെയുടെ യാഗപീഠത്തിന്മേൽ
  rationale: עַל എന്നതിന്റെ സ്ഥാനാർഥവും ദൈവനാമവും ദൈവവുമായുള്ള ബന്ധവും വ്യക്തമായി സൂക്ഷിക്കുന്ന സ്വാഭാവിക മലയാളഘടന.
- source_word: וְדַם זְבָחֶיךָ
  choice: നിന്റെ യാഗങ്ങളുടെ രക്തം
  rationale: זֶבַח അറുത്തർപ്പിക്കുന്ന വിവിധ യാഗങ്ങളെ ഉൾക്കൊള്ളുന്ന വിശാലപദമാണ്; ‘യാഗങ്ങൾ’ അനാവശ്യമായി പ്രത്യേകത ചുമത്താതെ അർഥം നൽകുന്നു.
- source_word: יִשָּׁפֵךְ
  choice: ഒഴിക്കണം
  rationale: നിഫാൽ രൂപം അക്ഷരാർഥത്തിൽ ‘ഒഴിക്കപ്പെടണം’ എന്നു നൽകാമെങ്കിലും, മലയാളത്തിലെ യാഗനിയമഭാഷയിൽ കർമത്തെ നേരിട്ട് പറയുന്ന ‘ഒഴിക്കണം’ കൂടുതൽ സ്വാഭാവികമാണ്; രക്തം യാഗപീഠത്തിൽ ഒഴിക്കുന്ന ആചാരപ്രവൃത്തി വ്യക്തമാകുന്നു.
- source_word: וְהַבָּשָׂר תֹּאכֵל
  choice: മാംസം നീ ഭക്ഷിക്കണം
  rationale: വാവ് സംയോജനവും നിർദേശാത്മക അപൂർണക്രിയയും ഔപചാരികമായി നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ ഇത് അനുമതിയായി മനസ്സിലാക്കാവുന്നതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: ഹീബ്രു പാഠത്തിലുള്ള വ്യക്തിനാമമായ ടെട്രഗ്രാമറ്റൺ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, സാധാരണ പണ്ഡിതോചിതമായ ‘Yahweh’ എന്ന ഉച്ചാരണത്തിന് സമീപമുള്ള മലയാളരൂപത്തിൽ നൽകിയിരിക്കുന്നു.
- issue: וְהַבָּשָׂר תֹּאכֵל എന്ന അവസാന ഉപവാക്യത്തിന്റെ വിധി
  choice: മാംസം നീ ഭക്ഷിക്കണം
  alternative: എന്നാൽ മാംസം നിനക്കു ഭക്ഷിക്കാം
  rationale: ഹീബ്രുവിലെ ‘കൂടാതെ/എന്നിട്ട്’ എന്ന സംയോജനവും നിർദേശരൂപവും മുഖ്യപാഠത്തിൽ അടുപ്പമായി സൂക്ഷിച്ചു. എന്നാൽ രക്തത്തിന്റെ നിർബന്ധിത കൈകാര്യം മാംസം ഭക്ഷിക്കാനുള്ള അനുമതിയുമായി വ്യത്യാസപ്പെടുത്തുന്നതായി സന്ദർഭം വായിക്കാനാകുന്നതിനാൽ ആ വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമനിർദേശ ശൈലി സ്വീകരിച്ചു. ‘ഹോമയാഗം’, ‘യാഗപീഠം’ തുടങ്ങിയ പരിചിത ആരാധനാപദങ്ങൾ ഉപയോഗിച്ചു; വാക്യത്തിന്റെ ഭാരമേറിയ ഹീബ്രു ഘടന വ്യക്തമാക്കാൻ ആദ്യ ഉപവാക്യത്തിൽ ദീർഘവരകൾ ഉപയോഗിച്ചു.
