source:
  edition: WLC
  text: כִּֽי תָבֹ֣א אֶל הָ/אָ֗רֶץ אֲשֶׁ֨ר יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ נֹתֵ֣ן לָ֔/ךְ וִֽ/ירִשְׁתָּ֖/הּ וְ/יָשַׁ֣בְתָּה בָּ֑/הּ וְ/אָמַרְתָּ֗ אָשִׂ֤ימָה עָלַ/י֙ מֶ֔לֶךְ כְּ/כָל הַ/גּוֹיִ֖ם אֲשֶׁ֥ר סְבִיבֹתָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/014.yaml
  text: When you come into the land that Yahweh your God is giving you[a], and you take possession of it and live in it, and you say, “I will set a king over myself, like all the nations that are around me,”
translation:
  language: ml
  text: നിന്റെ ദൈവമായ യഹ്‌വെ നിനക്കു നൽകുന്ന ദേശത്തേക്കു നീ പ്രവേശിച്ച്, അതു കൈവശമാക്കി അതിൽ പാർക്കുമ്പോൾ, “എനിക്കു ചുറ്റുമുള്ള എല്ലാ ജനതകളെ പോലെ ഞാൻ എന്റെമേൽ ഒരു രാജാവിനെ നിയമിക്കും[a],” എന്നു നീ പറയുമ്പോൾ—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “ഞാൻ എന്റെമേൽ ഒരു രാജാവിനെ വെക്കും.” എബ്രായഭാഷയിൽ അക്ഷരാർഥം: “ഞാൻ എന്റെമേൽ ഒരു രാജാവിനെ വെക്കും.”'
    reason: שׂים എന്ന ക്രിയയ്ക്ക് ‘വെക്കുക/സ്ഥാപിക്കുക’ എന്ന കൂടുതൽ അക്ഷരാർഥമുള്ള പര്യായം നൽകുന്നു; עָלַי എന്ന ‘എന്റെമേൽ’ ഘടകം രണ്ടിടത്തും നിലനിർത്തുന്നു.
lexical_decisions:
- source_word: כִּי תָבֹא
  choice: പ്രവേശിക്കുമ്പോൾ
  rationale: כִּי ഇവിടെ ഭാവിയിൽ പ്രതീക്ഷിക്കപ്പെടുന്ന സാഹചര്യത്തെ അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘പ്രവേശിക്കുമ്പോൾ’ സമയപരവും വ്യവസ്ഥാപരവുമായ ഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: הָאָרֶץ
  choice: ദേശം
  rationale: ആവർത്തനപുസ്തകത്തിന്റെ പശ്ചാത്തലത്തിൽ ഇത് യഹ്‌വെ ഇസ്രായേലിനു നൽകുന്ന വാഗ്ദത്തദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ദേശം’ ആ അർഥത്തിന് സ്വാഭാവികമായ മലയാളരൂപമാണ്.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുർക്ഷരനാമം ഒരു പദവികൊണ്ട് പകരാതെ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു; ഏകവചന അഭിസംബോധനയും നിലനിർത്തി.
- source_word: נֹתֵן לָךְ
  choice: നിനക്കു നൽകുന്ന
  rationale: എബ്രായ വർത്തമാന കൃദന്തരൂപം ദൈവത്തിന്റെ നടന്നുകൊണ്ടിരിക്കുന്നതോ ഉറപ്പുള്ളതോ ആയ ദാനപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘നൽകുന്ന’ അത് ചുരുക്കമായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: וִירִשְׁתָּהּ
  choice: അതു കൈവശമാക്കി
  rationale: ירשׁ ദേശസന്ദർഭത്തിൽ അവകാശമായി ലഭിക്കുക എന്നതോടൊപ്പം യാഥാർഥ്യമായി കൈവശപ്പെടുത്തുക എന്ന ആശയവും വഹിക്കുന്നു; ‘കൈവശമാക്കി’ ആ സജീവ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: וְיָשַׁבְתָּה בָּהּ
  choice: അവിടെ പാർക്കുമ്പോൾ
  rationale: ישׁב ഇവിടെ സ്ഥിരമായി വസിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പാർക്കുക’ ആധുനികവും മാന്യവുമായ പ്രയോഗമാണ്.
- source_word: אָמַרְתָּ
  choice: എന്നു നീ പറഞ്ഞാൽ
  rationale: നിയമവാക്യത്തിലെ ഭാവിസാഹചര്യത്തിന്റെ തുടർച്ച മലയാളത്തിൽ വ്യവസ്ഥാപരമായി അവതരിപ്പിക്കുന്നു; പിന്നാലെയുള്ള വാക്യവുമായി ബന്ധിപ്പിക്കാൻ ‘പറഞ്ഞാൽ’ യോജിക്കുന്നു.
- source_word: אָשִׂימָה עָלַי מֶלֶךְ
  choice: ഞാനും എന്റെമേൽ ഒരു രാജാവിനെ നിയമിക്കും
  rationale: שׂים എന്നതിന്റെ ‘വെക്കുക/നിയമിക്കുക’ എന്ന അർഥവും עָלַי എന്ന ‘എന്റെമേൽ’ എന്ന ഘടകവും നിലനിർത്തി. cohortative രൂപത്തിലെ സ്വമേധയുള്ള തീരുമാനം ‘നിയമിക്കും’ എന്നു പ്രകടിപ്പിക്കുന്നു.
- source_word: כְּכָל הַגּוֹיִם אֲשֶׁר סְבִיבֹתָי
  choice: എനിക്കു ചുറ്റുമുള്ള എല്ലാ ജനതകളെയുംപോലെ
  rationale: גּוֹיִם ഇവിടെ അയൽജനതകളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ജനതകൾ’ പിൽക്കാലത്തെ പ്രത്യേക മതശാസ്ത്രപരമായ അർഥങ്ങൾ ഇറക്കുമതി ചെയ്യാതെ താരതമ്യം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരാതെ ദൈവനാമം ലിപ്യന്തരിച്ചു. ‘യഹ്‌വെ’ എന്ന രൂപം സാധാരണ പണ്ഡിതപരമായ പുനർനിർമാണത്തോട് ചേർന്നുനിൽക്കുന്നു.
- issue: രാജാവിനെ സ്ഥാപിക്കാനുള്ള വാക്കിന്റെ ഭാവം
  choice: ഞാനും എന്റെമേൽ ഒരു രാജാവിനെ നിയമിക്കും
  alternative: എനിക്കും ഒരു രാജാവിനെ നിയമിക്കണം / എന്റെമേൽ ഒരു രാജാവിനെ സ്ഥാപിക്കട്ടെ
  rationale: മൂലത്തിലെ cohortative രൂപം ആഗ്രഹവും തീരുമാനവും തമ്മിലുള്ള ഭാവം വഹിക്കാം. പ്രധാനപാഠം ഉറച്ച സ്വമേധയുള്ള തീരുമാനമായി അവതരിപ്പിക്കുമ്പോഴും ‘എന്റെമേൽ’ എന്ന അസൗകര്യമുള്ളെങ്കിലും പ്രാധാന്യമുള്ള ഘടകം ഒഴിവാക്കിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായിക്കാൻ എളുപ്പവുമായ ശൈലി സ്വീകരിച്ചു. ഏകവചനമായ ‘നീ/നിന്റെ’ അഭിസംബോധനയും വാക്യത്തിന്റെ നിയമപരമായ ഭാവിസാഹചര്യവും നിലനിർത്തി. അടുത്ത വാക്യത്തിലേക്കുള്ള വ്യാകരണബന്ധം സൂചിപ്പിക്കാൻ അവസാനം ദീർഘരേഖ ഉപയോഗിച്ചു.
