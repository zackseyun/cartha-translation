- from: അത് അവന്റെ പക്കൽ ഉണ്ടായിരിക്കണം; അവൻ തന്റെ ആയുഷ്കാലമൊക്കെയും അതിൽ വായിക്കണം.[a] അങ്ങനെ അവൻ തന്റെ ദൈവമായ യഹോവയെ ഭയപ്പെടാനും[b] ഈ നിയമത്തിലെ സകല വചനങ്ങളും ഈ ചട്ടങ്ങളും പാലിച്ച് അനുഷ്ഠിക്കാനും പഠിക്കും.
