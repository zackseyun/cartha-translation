  yaml_path: translation/ot/deuteronomy/017/019.yaml
  text: And it shall be with him[a], and he shall read in it all the days of his life, so that he may learn to fear Yahweh his God, to keep all the words of this law and these statutes[c][b], to do them.
translation:
  language: ml
  text: അത് അവന്റെ പക്കൽ ഉണ്ടായിരിക്കണം; അവൻ തന്റെ ജീവിതകാലം മുഴുവൻ അതിൽ വായിക്കണം.[a] അങ്ങനെ, തന്റെ ദൈവമായ യഹോവയെ ഭയപ്പെടാനും ഈ നിയമത്തിലെ സകല വചനങ്ങളും ഈ ചട്ടങ്ങളും പാലിക്കാനും അവയെ അനുഷ്ഠിക്കാനും അവൻ പഠിക്കും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അതിൽനിന്ന് വായിക്കണം’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായഭാഷയിൽ അക്ഷരാർഥം ‘അതിൽ വായിക്കണം’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘ഭക്ത്യാദരവോടെ ബഹുമാനിക്കാൻ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה עִמּוֹ
  choice: അത് അവന്റെ പക്കൽ ഉണ്ടായിരിക്കണം
  rationale: മുൻവാക്യത്തിലെ നിയമത്തിന്റെ പകർപ്പിനെയാണ് സ്ത്രീലിംഗ ഏകവചനം സൂചിപ്പിക്കുന്നത്. עִמּוֹ എന്നത് തുടർച്ചയായ കൈവശവും ലഭ്യതയും വ്യക്തമാക്കുന്നതിനാൽ സ്വാഭാവികമായ മലയാളത്തിൽ ‘അവന്റെ പക്കൽ’ എന്നു നൽകി.
- source_word: וְקָרָא בוֹ
  choice: അവൻ അതിൽ വായിക്കണം
  rationale: בּוֹ എന്ന മുൻപ്രത്യയത്തിന്റെ അക്ഷരാർഥമായ ‘അതിൽ’ നിലനിർത്തുന്നു; എഴുതപ്പെട്ട പകർപ്പ് തുറന്ന് അതിലെ ഉള്ളടക്കം വായിക്കുന്ന ആശയം മലയാളത്തിലും ഗ്രഹിക്കാവുന്നതാണ്.
- source_word: כָּל יְמֵי חַיָּיו
  choice: തന്റെ ആയുഷ്കാലമൊക്കെയും
  rationale: ജീവിതകാലം മുഴുവനുമുള്ള തുടർച്ചയെ ഊന്നുന്ന എബ്രായ പ്രയോഗം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: לְמַעַן יִלְמַד
  choice: അങ്ങനെ ... പഠിക്കും
  rationale: לְמַעַן എന്നതിന്റെ ഉദ്ദേശ്യഫലം വ്യക്തമാക്കുന്നു. നിർദേശത്തിന്റെ ഫലമായി രാജാവ് പഠിക്കുമെന്ന എബ്രായ ക്രിയാഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לְיִרְאָה אֶת יְהוָה אֱלֹהָיו
  choice: തന്റെ ദൈവമായ യഹോവയെ ഭയപ്പെടാൻ
  rationale: ירא ഉൾക്കൊള്ളുന്ന ഭയം, ഭക്ത്യാദരം, അനുസരണപരമായ വിസ്മയം എന്നിവയിലെ വേദപാഠപരമായ സംഘർഷം ‘ഭയപ്പെടുക’ നിലനിർത്തുന്നു; ദിവ്യനാമം യഹോവ എന്നു ലിപ്യന്തരണം ചെയ്തു.
- source_word: לִשְׁמֹר
  choice: പാലിച്ച്
  rationale: നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ സന്ദർഭത്തിൽ שׁמר എന്നത് കല്പനകൾ സൂക്ഷ്മമായി പാലിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: כָּל דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: ഈ നിയമത്തിലെ സകല വചനങ്ങളും
  rationale: ഈ സന്ദർഭത്തിൽ תּוֹרָה നിർദിഷ്ടമായ ഉടമ്പടി-നിയമത്തെ സൂചിപ്പിക്കുന്നു; דִּבְרֵי എന്നതിന്റെ ബഹുവചന സ്വഭാവം ‘വചനങ്ങൾ’ എന്നു നിലനിർത്തി.
- source_word: הַחֻקִּים הָאֵלֶּה
  choice: ഈ ചട്ടങ്ങളും
  rationale: חֻקִּים എന്ന നിയമസാങ്കേതിക പദത്തിന് സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ഔപചാരികവുമായ ‘ചട്ടങ്ങൾ’ തിരഞ്ഞെടുത്തു.
- source_word: לַעֲשֹׂתָם
  choice: അനുഷ്ഠിക്കാൻ
  rationale: അക്ഷരാർഥം ‘അവയെ ചെയ്യുക’ എന്നാണെങ്കിലും നിയമങ്ങളും ചട്ടങ്ങളും സംബന്ധിച്ച് ‘അനുഷ്ഠിക്കുക’ എന്നത് പ്രവർത്തിയിലാക്കുന്ന ആശയം കൃത്യവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദിവ്യനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള നിയമനാമത്തെ ഒരു പദവിയാക്കി മാറ്റാതെ, മലയാളത്തിൽ വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്ന ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: ഉടമ്പടി സന്ദർഭത്തിലെ ירא എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി
  choice: ഭയപ്പെടുക
  alternative: ഭക്ത്യാദരവോടെ ബഹുമാനിക്കുക
  rationale: ‘ഭയപ്പെടുക’ എന്നത് ഭയം, വിസ്മയം, ഭക്ത്യാദരം, അനുസരണം എന്നിവയുടെ യഥാർഥ പാഠപരമായ വ്യാപ്തിയും സംഘർഷവും ചുരുക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എബ്രായവാക്യത്തിന്റെ ഉദ്ദേശ്യക്രമം നിലനിർത്തിക്കൊണ്ട് അത്യന്തം കൃത്രിമമായ പദക്രമം ഒഴിവാക്കി. ‘നിയമം’, ‘ചട്ടങ്ങൾ’, ‘പാലിക്കുക’, ‘അനുഷ്ഠിക്കുക’ എന്നീ പദങ്ങൾ നിയമ-ഉടമ്പടി ഭാവം സംരക്ഷിക്കുന്നു.
