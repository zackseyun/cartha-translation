source:
  edition: WLC
  text: יַ֣ד הָ/עֵדִ֞ים תִּֽהְיֶה בּ֤/וֹ בָ/רִאשֹׁנָה֙ לַ/הֲמִית֔/וֹ וְ/יַ֥ד כָּל הָ/עָ֖ם בָּ/אַחֲרֹנָ֑ה וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/007.yaml
  text: The hand of the witnesses shall be first against him to put him to death[a], and afterward the hand of all the people[b]. So you shall purge the evil from your midst.
translation:
  language: ml
  text: അവനെ വധിക്കാൻ ആദ്യം സാക്ഷികളുടെ കൈ അവന്റെമേൽ പതിക്കണം; അതിനുശേഷം സകലജനത്തിന്റെയും കൈ അവന്റെമേൽ പതിക്കണം.[a] ഇങ്ങനെ നിന്റെ മധ്യത്തിൽനിന്ന് തിന്മ നീക്കിക്കളയണം.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സാക്ഷികളുടെ കൈ … സകലജനത്തിന്റെയും കൈ’ എന്നത് ശിക്ഷ നടപ്പാക്കുന്നതിൽ സാക്ഷികൾ ആദ്യം ഉത്തരവാദിത്വം ഏറ്റെടുക്കണമെന്നു സൂചിപ്പിക്കുന്ന എബ്രായ നിയമപ്രയോഗമാണ്.
    reason: cultural_note
  - marker: b
    text: അഥവാ, ‘നിന്റെ ഇടയിൽനിന്ന്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יַד
  choice: കൈ
  rationale: എബ്രായത്തിലെ ഏകവചനരൂപവും ശിക്ഷ നടപ്പാക്കുന്നതിലെ ഉത്തരവാദിത്വത്തെയും പങ്കാളിത്തത്തെയും സൂചിപ്പിക്കുന്ന നിയമപ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: הָעֵדִים
  choice: സാക്ഷികൾ
  rationale: ഇത് വെറും കുറ്റാരോപകരെയല്ല, നിയമപരമായി സാക്ഷ്യം പറയുന്നവരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: בּוֹ
  choice: അവന്റെമേൽ
  rationale: ‘കൈ’ എന്ന പദത്തോടൊപ്പം ശിക്ഷാപരമായ നടപടി ആ വ്യക്തിക്കെതിരെ ആദ്യം ആരംഭിക്കണമെന്ന അർഥം നൽകുന്നു.
- source_word: בָרִאשֹׁנָה
  choice: ആദ്യം
  rationale: ശിക്ഷ നടപ്പാക്കുന്നതിൽ സാക്ഷികൾക്കുള്ള പ്രവർത്തനമുൻഗണന വ്യക്തമാക്കുന്നു.
- source_word: לַהֲמִיתוֹ
  choice: അവനെ വധിക്കാൻ
  rationale: מות എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ‘മരണത്തിന് ഇടയാക്കുക’ എന്നാണ്; ന്യായവിധിയുടെ പശ്ചാത്തലത്തിൽ ‘വധിക്കുക’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: וְיַד כָּל הָעָם
  choice: അതിനു ശേഷം സകലജനത്തിന്റെയും കൈ
  rationale: സാക്ഷികൾക്കു പിന്നാലെ സമൂഹവും ശിക്ഷ നടപ്പാക്കുന്നതിൽ പങ്കുചേരുന്നു എന്ന എബ്രായഘടനയും ഏകവചനമായ ‘കൈ’യും നിലനിർത്തുന്നു.
- source_word: בָּאַחֲרֹנָה
  choice: അതിനു ശേഷം
  rationale: ‘ആദ്യം’ എന്നതിനോടുള്ള ക്രമാനുസൃതമായ പ്രതിപദമായി പ്രവർത്തിക്കുന്നു.
- source_word: וּבִעַרְתָּ
  choice: നീക്കിക്കളയണം
  rationale: ആവർത്തനപുസ്തകത്തിലെ നിയമസൂത്രവാക്യങ്ങളിൽ בער അക്ഷരാർഥത്തിൽ കത്തിക്കുകയല്ല, സമൂഹത്തിൽനിന്ന് ദോഷം പൂർണമായി അകറ്റുന്നതാണ്.
- source_word: הָרָע
  choice: തിന്മ
  rationale: കുറ്റവാളിയെ മാത്രം നിർദേശിക്കാതെ കുറ്റവും അതിന്റെ ദോഷകരമായ സാന്നിധ്യവും ഉൾക്കൊള്ളുന്ന സൂത്രവാക്യത്തിന്റെ വിശാലത സംരക്ഷിക്കുന്നു.
- source_word: מִקִּרְבֶּךָ
  choice: നിന്റെ മധ്യത്തിൽനിന്ന്
  rationale: ഉടമ്പടിസമൂഹത്തിന്റെ ഉള്ളിൽനിന്ന് എന്ന എബ്രായപ്രയോഗത്തിന്റെ സാമുദായിക ഭാവം നിലനിർത്തുന്നു.
theological_decisions:
- issue: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ എന്ന ആവർത്തനപുസ്തകത്തിലെ നിയമസൂത്രവാക്യത്തിന്റെ പരിഭാഷ
  choice: ഇങ്ങനെ നിന്റെ മധ്യത്തിൽനിന്ന് തിന്മ നീക്കിക്കളയണം
  alternative: ഇങ്ങനെ നിന്റെ ഇടയിൽനിന്ന് ദുഷ്ടനെ നീക്കിക്കളയണം
  rationale: എബ്രായം കുറ്റവാളിയെ മാത്രമായി വ്യക്തമാക്കാതെ ‘തിന്മ’ എന്നു പറയുന്നു. അതിനാൽ നീതിപൂർവമായ വിധിയിലൂടെ സമൂഹത്തിൽനിന്ന് തിന്മ അകറ്റുക എന്ന നിയമപരവും ദൈവശാസ്ത്രപരവുമായ വിശാലത സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള നിയമശൈലി ഉപയോഗിച്ചു. ‘കൈ’ എന്ന എബ്രായ രൂപകം പ്രധാനവാക്യത്തിൽ നിലനിർത്തി അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു. ഏകവചന അഭിസംബോധനയായ ‘നിന്റെ’ എന്ന രൂപവും ‘തിന്മ’ എന്ന സൂത്രപദത്തിന്റെ ഉദ്ദേശപൂർവമായ വിശാലതയും സംരക്ഷിച്ചു.
