reference: Deuteronomy 17:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עָשִׂ֗יתָ עַל פִּ֤י הַ/דָּבָר֙ אֲשֶׁ֣ר יַגִּ֣ידֽוּ לְ/ךָ֔ מִן הַ/מָּק֣וֹם הַ/ה֔וּא אֲשֶׁ֖ר יִבְחַ֣ר יְהוָ֑ה וְ/שָׁמַרְתָּ֣ לַ/עֲשׂ֔וֹת כְּ/כֹ֖ל אֲשֶׁ֥ר יוֹרֽוּ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/010.yaml
  text: You shall act according to the word that they declare to you from that place which Yahweh will choose[a], and you shall be careful to do according to all that they instruct you.
translation:
  language: ml
  text: യഹോവ തിരഞ്ഞെടുക്കുന്ന ആ സ്ഥലത്തുനിന്ന് അവർ നിന്നോടു പ്രഖ്യാപിക്കുന്ന വാക്കനുസരിച്ച്[a] നീ പ്രവർത്തിക്കണം; അവർ നിന്നെ നിർദേശിക്കുന്ന എല്ലാറ്റിനും അനുസരിച്ച് പ്രവർത്തിക്കാൻ നീ ശ്രദ്ധിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘അവർ നിന്നോടു പ്രഖ്യാപിക്കുന്ന തീരുമാനമനുസരിച്ച്.’ എബ്രായപദമായ דָּבָר എന്നതിന് ‘വാക്ക്,’ ‘കാര്യം,’ ‘തീരുമാനം’ എന്നീ അർഥങ്ങൾ വരാം; ഇവിടെ ന്യായവിധിയുടെ സന്ദർഭമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: നീ പ്രവർത്തിക്കണം
  rationale: עשה എന്ന ക്രിയയ്ക്ക് ‘ചെയ്യുക, പ്രവർത്തിക്കുക’ എന്നീ വിശാല അർഥങ്ങളുണ്ട്. ഇവിടെ അധികാരപൂർവമായ വിധിക്കനുസരിച്ചുള്ള നടപടിയാണ് ഉദ്ദേശിക്കുന്നത്; അതിനാൽ ‘പ്രവർത്തിക്കണം’ സ്വാഭാവികവും നിയമസന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: עַל פִּי הַדָּבָר
  choice: വാക്കനുസരിച്ച്
  rationale: עַל־פִּי എന്നത് ‘അനുസരിച്ച്/അധികാരപ്രകാരം’ എന്നും דָּבָר ‘വാക്ക്, കാര്യം, തീരുമാനം’ എന്നും അർഥമാക്കാം. ‘വാക്കനുസരിച്ച്’ എബ്രായ പ്രയോഗത്തിന്റെ രൂപം നിലനിർത്തുന്നു; ന്യായസന്ദർഭത്തിലെ ‘തീരുമാനം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: יַגִּידוּ לְךָ
  choice: അവർ നിന്നോടു പ്രഖ്യാപിക്കുന്ന
  rationale: נגד എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഔപചാരികമായി ‘അറിയിക്കുക, പ്രഖ്യാപിക്കുക’ എന്നാണ്. മുൻസന്ദർഭത്തിലെ പുരോഹിതന്മാരുടെയും ന്യായാധിപന്റെയും അധികാരപൂർവമായ അറിയിപ്പിന് ‘പ്രഖ്യാപിക്കുക’ യോജിക്കുന്നു.
- source_word: מִן הַמָּקוֹם הַהוּא אֲשֶׁר יִבְחַר יְהוָה
  choice: യഹോവ തിരഞ്ഞെടുക്കുന്ന ആ സ്ഥലത്തുനിന്ന്
  rationale: കേന്ദ്രവിശുദ്ധസ്ഥലത്തെ സൂചിപ്പിക്കുന്ന ‘ആ സ്ഥലം’ നിലനിർത്തുന്നു. ആവർത്തനപുസ്തകത്തിലെ ഭാവിമുഖമായ ആശയം മലയാളത്തിലെ സ്വാഭാവിക ആപേക്ഷിക വർത്തമാനരൂപമായ ‘തിരഞ്ഞെടുക്കുന്ന’ വഴി വ്യക്തമാകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ സുപരിചിതമായ ലിപ്യന്തരണമായ ‘യഹോവ’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: וְשָׁמַרְתָּ לַעֲשׂוֹת
  choice: ശ്രദ്ധയോടെ അനുസരിക്കണം
  rationale: שׁמר + ക്രിയാനാമം സൂക്ഷ്മമായ അനുഷ്ഠാനത്തെയും ജാഗ്രതയോടെയുള്ള അനുസരണത്തെയും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ശ്രദ്ധയോടെ അനുസരിക്കണം’ ഈ നിയമബാധ്യത സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: כְּכֹל אֲשֶׁר יוֹרוּךָ
  choice: അവർ നിന്നെ ഉപദേശിക്കുന്നതെല്ലാം
  rationale: כְּכֹל אֲשֶׁר സമഗ്രമായ അനുസരണം സൂചിപ്പിക്കുന്നു. ירה ഹിഫീൽ നിയമപരമായി ‘പഠിപ്പിക്കുക, നിർദേശിക്കുക, ഉപദേശിക്കുക’ എന്നർഥമുള്ളതിനാൽ ‘ഉപദേശിക്കുന്നതെല്ലാം’ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ഒരു പദവിയല്ല, ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ മലയാളത്തിൽ നിലവിലുള്ള വ്യക്തിനാമരൂപമായ ‘യഹോവ’ സ്വീകരിച്ചു.
- issue: דָּבָר എന്ന പദത്തിന്റെ ന്യായസന്ദർഭാർത്ഥം
  choice: വാക്ക്
  alternative: തീരുമാനം
  rationale: ‘വാക്ക്’ മൂലപദത്തിന്റെ വിശാലതയും എബ്രായ പ്രയോഗചിത്രവും നിലനിർത്തുന്നു; എന്നാൽ സന്ദർഭത്തിൽ അത് അധികാരപൂർവമായ ന്യായതീരുമാനത്തെ സൂചിപ്പിക്കാം. ഈ യഥാർഥ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ഏകവചന രണ്ടാംപുരുഷപ്രയോഗം നിലനിർത്തി. മൂലത്തിലെ സമഗ്ര അനുസരണവും അധികാരപൂർവമായ നിർദേശവും വ്യക്തമായി പ്രകടിപ്പിച്ചു.
