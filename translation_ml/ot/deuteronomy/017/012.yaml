id: DEU.17.12
reference: Deuteronomy 17:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָ/אִ֞ישׁ אֲשֶׁר יַעֲשֶׂ֣ה בְ/זָד֗וֹן לְ/בִלְתִּ֨י שְׁמֹ֤עַ אֶל הַ/כֹּהֵן֙ הָ/עֹמֵ֞ד לְ/שָׁ֤רֶת שָׁם֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ א֖וֹ אֶל הַ/שֹּׁפֵ֑ט וּ/מֵת֙ הָ/אִ֣ישׁ הַ/ה֔וּא וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/יִּשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/012.yaml
  text: But the man who acts presumptuously by not listening to the priest who stands there to minister before Yahweh your God[a], or to the judge—that man shall die[c][b]. So you shall purge the evil from Israel.
translation:
  language: ml
  text: എന്നാൽ, അവിടെ നിന്റെ ദൈവമായ യഹ്‌വെയെ ശുശ്രൂഷിക്കാൻ നിൽക്കുന്ന പുരോഹിതനെയോ ന്യായാധിപനെയോ അനുസരിക്കാതെ[a] ധിക്കാരപൂർവം പ്രവർത്തിക്കുന്ന മനുഷ്യൻ മരണശിക്ഷ അനുഭവിക്കണം. അങ്ങനെ നീ ഇസ്രായേലിൽനിന്ന് തിന്മ നീക്കിക്കളയണം.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പദശഃ ‘കേൾക്കാതെ.’ ഈ നിയമസന്ദർഭത്തിൽ കേട്ട് അനുസരിക്കാൻ വിസമ്മതിക്കുക എന്ന അർഥമാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘തിന്മ’ എന്നത് ദുഷ്പ്രവൃത്തിയെയോ അതു ചെയ്യുന്ന ദുഷ്ടനെയോ സൂചിപ്പിക്കാം; ഇവിടെ ശിക്ഷിക്കപ്പെട്ട കുറ്റവാളിയെ സമൂഹത്തിൽനിന്ന് നീക്കുന്നതാണ് സന്ദർഭത്തിലെ ആശയം.
    reason: genuine_ambiguity
lexical_decisions:
- source_word: וְהָאִישׁ
  choice: എന്നാൽ, … മനുഷ്യൻ
  rationale: മുൻവാക്യത്തിലെ നിയമനിർദേശത്തോടുള്ള തുടർച്ചയും അതിനെ ലംഘിക്കുന്നയാളിലേക്കുള്ള വിരുദ്ധമാറ്റവും ‘എന്നാൽ’ സ്വാഭാവികമായി അറിയിക്കുന്നു. אִישׁ എന്ന ഏകവചന പുല്ലിംഗരൂപത്തിന് ‘മനുഷ്യൻ’ ഉപയോഗിച്ചു.
- source_word: יַעֲשֶׂה בְזָדוֹן
  choice: ധിക്കാരപൂർവം പ്രവർത്തിക്കുന്ന
  rationale: בְזָדוֹן ആകസ്മിക വീഴ്ചയല്ല, അറിഞ്ഞുകൊണ്ടുള്ള അഹങ്കാരപരവും വെല്ലുവിളിപരവുമായ പ്രവൃത്തിയാണ് സൂചിപ്പിക്കുന്നത്; ‘ധിക്കാരപൂർവം’ അതിന്റെ നിയമപരവും ധാർമികവുമായ ഭാരം നിലനിർത്തുന്നു.
- source_word: לְבִלְתִּי שְׁמֹעַ
  choice: അനുസരിക്കാതെ
  rationale: שׁמע എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘കേൾക്കുക’ ആണെങ്കിലും, ഈ നിയമസന്ദർഭത്തിൽ അധികാരപ്പെട്ട വിധി കേട്ട് അനുസരിക്കാൻ വിസമ്മതിക്കുന്നതാണ് ഉദ്ദേശ്യം. മലയാളത്തിൽ ‘അനുസരിക്കാതെ’ ആ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു; പദശഃ സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: אֶל הַכֹּהֵן
  choice: പുരോഹിതനെ
  rationale: כֹּהֵן എന്ന ഔദ്യോഗിക ആരാധനാപദവിക്ക് സാധാരണവും കൃത്യവുമായ മലയാളപദം ‘പുരോഹിതൻ’ ആണ്.
- source_word: הָעֹמֵד לְשָׁרֶת שָׁם
  choice: അവിടെ … ശുശ്രൂഷിക്കാൻ നിൽക്കുന്ന
  rationale: നിൽക്കുക എന്ന കൃതന്തവും ആരാധനാസേവനത്തെ സൂചിപ്പിക്കുന്ന שׁרת എന്ന ക്രിയയും שָׁם എന്ന ‘അവിടെ’യും നിലനിർത്തുന്നു.
- source_word: אֶת יְהוָה אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ യഹ്‌വെയെ
  rationale: שרת എന്ന ക്രിയയുടെ നേരിട്ടുള്ള കർമമായ ദൈവനാമം മലയാളത്തിൽ സ്വാഭാവികമായി ‘യഹ്‌വെയെ ശുശ്രൂഷിക്കാൻ’ എന്നു നൽകി; אֱלֹהֶיךָയിലെ ഏകവചന അഭിസംബോധന ‘നിന്റെ ദൈവമായ’ എന്നു സംരക്ഷിച്ചു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പൊതുപദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ, വ്യക്തിനാമമായി മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: אוֹ אֶל הַשֹּׁפֵט
  choice: ന്യായാധിപനെയോ
  rationale: ശാസനപരമായ വിധി പ്രസ്താവിക്കുന്ന അധികാരിയെ സൂചിപ്പിക്കുന്ന שֹׁפֵט എന്നതിന് ‘ന്യായാധിപൻ’ കൃത്യവും മാന്യവുമായ പദമാണ്.
- source_word: וּמֵת הָאִישׁ הַהוּא
  choice: ആ മനുഷ്യൻ മരണശിക്ഷ അനുഭവിക്കണം
  rationale: നിയമസന്ദർഭത്തിലെ וּמֵת വെറും സ്വാഭാവിക മരണപ്രവചനമല്ല, നിർദേശിക്കപ്പെട്ട വധശിക്ഷയാണ്. ‘മരണശിക്ഷ അനുഭവിക്കണം’ ഈ നിയമപരമായ ഫലം മലയാളത്തിൽ അസന്ദിഗ്ധമായി നൽകുന്നു.
- source_word: וּבִעַרְתָּ הָרָע מִיִּשְׂרָאֵל
  choice: അങ്ങനെ നീ ഇസ്രായേലിൽനിന്ന് തിന്മ നീക്കിക്കളയണം
  rationale: ആവർത്തിക്കുന്ന നിയമസൂത്രവാക്യത്തിൽ בער സമൂഹത്തിൽനിന്നുള്ള പൂർണമായ നീക്കം സൂചിപ്പിക്കുന്നു. ‘നീ’ ഏകവചന അഭിസംബോധനയും ‘ഇസ്രായേലിൽനിന്ന്’ എന്ന ഉറവിടബന്ധവും നിലനിർത്തി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ ചതുരക്ഷരം നേരിട്ട് വരുന്നതിനാൽ അതിനെ പദവിയായി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു. ഉച്ചാരണത്തിന്റെ പുനർനിർമാണം പൂർണമായി ഉറപ്പില്ലെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: നിയമലംഘകനെ സൂചിപ്പിക്കുന്ന ഏകവചന പുല്ലിംഗം
  choice: മനുഷ്യൻ
  alternative: വ്യക്തി / ആരെങ്കിലും
  rationale: אִישׁ എന്ന മൂലരൂപത്തിന്റെ ഏകവചനവും പുല്ലിംഗസൂചനയും നിലനിർത്തി; അതേസമയം മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ രൂപം തെരഞ്ഞെടുത്തു.
- issue: וּמֵת എന്ന ശിക്ഷാവാക്യത്തിന്റെ സ്വഭാവം
  choice: മരണശിക്ഷ അനുഭവിക്കണം
  alternative: മരിക്കണം
  rationale: അധികാരവിധി മനഃപൂർവം നിരസിക്കുന്നവനു നിയമം നിർദേശിക്കുന്ന ദണ്ഡമാണ് സന്ദർഭം. ‘മരിക്കണം’ എന്ന രൂപത്തിലുള്ള സ്വാഭാവികമരണസാധ്യത ഒഴിവാക്കി നിയമപരമായ അർഥം വ്യക്തമാക്കി; ശിക്ഷ നടപ്പാക്കുന്ന വിധം പാഠത്തിൽ ഇല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമശൈലി ഉപയോഗിച്ചു. അത്യന്തം സംസ്കൃതഭാരമുള്ള പ്രയോഗങ്ങൾ ഒഴിവാക്കിയെങ്കിലും ‘പുരോഹിതൻ,’ ‘ന്യായാധിപൻ,’ ‘മരണശിക്ഷ’ എന്നീ പൊതുവായി മനസ്സിലാകുന്ന ഔദ്യോഗിക പദങ്ങൾ നിലനിർത്തി. വാക്യഘടന വായനാസൗകര്യത്തിനായി മലയാളക്രമത്തിലാക്കി; മൂലത്തിലെ ഏകവചന അഭിസംബോധനയും നിയമപരമായ ഗൗരവവും സംരക്ഷിച്ചു.
