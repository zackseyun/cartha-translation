id: DEU.17.11
reference: Deuteronomy 17:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: עַל פִּ֨י הַ/תּוֹרָ֜ה אֲשֶׁ֣ר יוֹר֗וּ/ךָ וְ/עַל הַ/מִּשְׁפָּ֛ט אֲשֶׁר יֹאמְר֥וּ לְ/ךָ֖ תַּעֲשֶׂ֑ה לֹ֣א תָס֗וּר מִן הַ/דָּבָ֛ר אֲשֶׁר יַגִּ֥ידֽוּ לְ/ךָ֖ יָמִ֥ין וּ/שְׂמֹֽאל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/011.yaml
  text: According to the instruction that they give you[a], and according to the judgment that they tell you, you shall do; you shall not turn aside from the word that they declare to you[b], to the right or to the left.
translation:
  language: ml
  text: അവർ നിനക്കു നൽകുന്ന ഉപദേശമനുസരിച്ചും[a] അവർ നിന്നോടു പറയുന്ന ന്യായവിധിയനുസരിച്ചും നീ പ്രവർത്തിക്കണം; അവർ നിനക്കു അറിയിക്കുന്ന വചനത്തിൽനിന്ന്[b] വലത്തോട്ടോ ഇടത്തോട്ടോ നീ വ്യതിചലിക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘ഉപദേശം’ എന്നതിന് ‘നിയമം’ അല്ലെങ്കിൽ ‘പഠിപ്പിക്കൽ’ എന്നും പരിഭാഷപ്പെടുത്താം (എബ്രായം: തോറാ).'
    reason: lexical_alternative
  - marker: b
    text: ‘വചനം’ എന്നതിന് ‘കാര്യം’ അല്ലെങ്കിൽ ‘തീർപ്പ്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּי
  choice: പ്രകാരം
  rationale: ഈ എബ്രായ പ്രയോഗം അക്ഷരാർഥത്തിൽ ‘വായിന്മേൽ’ എന്നല്ല, ഒരു നിർദേശത്തിനോ വിധിക്കോ അനുസൃതമായി പ്രവർത്തിക്കുക എന്നാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: הַתּוֹרָה
  choice: ഉപദേശം
  rationale: תּוֹרָה എന്നത് നിയമം എന്ന അർഥം ഉൾക്കൊള്ളാമെങ്കിലും അടിസ്ഥാനപരമായി ഉപദേശം/പഠിപ്പിക്കൽ എന്ന വിശാല അർഥമുള്ളതാണ്; ഇവിടെ പുരോഹിതന്മാരോ ന്യായാധിപന്മാരോ നൽകുന്ന അധികാരപൂർവമായ നിർദേശമാണ് ഉദ്ദേശ്യം.
- source_word: אֲשֶׁר יוֹרוּךָ
  choice: അവർ നിനക്കു നൽകുന്ന
  rationale: ירה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം പഠിപ്പിക്കുക, നിർദേശിക്കുക, വഴി കാണിക്കുക എന്നീ അർഥങ്ങൾ നൽകുന്നു. ‘ഉപദേശം നൽകുന്ന’ എന്ന മലയാളപ്രയോഗം സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: הַמִּשְׁפָּט
  choice: ന്യായവിധി
  rationale: ഈ നിയമസന്ദർഭത്തിൽ מִשְׁפָּט ഒരു ന്യായപരമായ തീരുമാനം അഥവാ വിധിയെ സൂചിപ്പിക്കുന്നു; ‘ന്യായവിധി’ ഔപചാരിക ഭാവം നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר יֹאמְרוּ לְךָ
  choice: അവർ നിന്നോടു പറയുന്ന
  rationale: אָמַר എന്ന സാധാരണ ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘പറയുക’ എന്നാണ്; വിധി അറിയിക്കുന്ന പ്രവൃത്തിയെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: תַּעֲשֶׂה
  choice: നീ പ്രവർത്തിക്കണം
  rationale: ഇവിടെയുള്ള അപൂർണക്രിയ നിർബന്ധത്തെ സൂചിപ്പിക്കുന്നു. ‘പ്രവർത്തിക്കണം’ നിയമപരമായ ബാധ്യത വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: לֹא תָסוּר
  choice: നീ മാറരുത്
  rationale: סוּר എന്നത് മാറുക, വഴിതെറ്റുക, വിട്ടുപോകുക എന്നീ അർഥങ്ങളുള്ളതാണ്; തുടർന്നുള്ള വലത്-ഇടത് ദിശാരൂപകവുമായി ‘മാറരുത്’ സ്വാഭാവികമായി ചേരുന്നു.
- source_word: הַדָּבָר
  choice: വചനം
  rationale: דָּבָר എന്നതിന് വാക്ക്, കാര്യം, പ്രസ്താവന എന്നിവ അർഥങ്ങളാകാം. ഇവിടെ അധികാരപൂർവം അറിയിച്ച പ്രസ്താവനയെ സൂചിപ്പിക്കുന്ന ഏകവചനരൂപം ‘വചനം’ സംരക്ഷിക്കുന്നു; നിയമസന്ദർഭം അതിന്റെ സ്വഭാവം വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר יַגִּידוּ לְךָ
  choice: അവർ നിന്നെ അറിയിക്കുന്ന
  rationale: נגד എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം അറിയിക്കുക, പ്രഖ്യാപിക്കുക, വെളിപ്പെടുത്തുക എന്നർഥം നൽകുന്നു. ‘അറിയിക്കുന്ന’ ഔപചാരികതയും വ്യക്തതയും ഒരുമിച്ച് നൽകുന്നു.
- source_word: יָמִין וּשְׂמֹאל
  choice: വലത്തോട്ടോ ഇടത്തോട്ടോ
  rationale: ഏതു ദിശയിലേക്കും വ്യതിചലിക്കരുത് എന്ന സ്ഥിരരൂപകത്തെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: പുരോഹിത-ന്യായാധിപ അധികാരത്തോടുള്ള അനുസരണത്തിന്റെ വ്യാപ്തി
  choice: പരിഗണനയിലുള്ള കേസിൽ അധികാരപൂർവം നൽകുന്ന ഉപദേശവും ന്യായവിധിയും അനുസരിക്കാനുള്ള കല്പനയായി പരിഭാഷപ്പെടുത്തി.
  alternative: ഈ വാക്യം പിൽക്കാല മതസ്ഥാപനങ്ങൾക്ക് പരിധിയില്ലാത്തതോ തെറ്റുപറ്റാത്തതോ ആയ അധികാരം നൽകുന്നു എന്ന വിശാല വ്യാഖ്യാനം.
  rationale: വാക്യം ഇസ്രായേലിന്റെ ഉടമ്പടി-ന്യായവ്യവസ്ഥയിലെ ഒരു പ്രത്യേക നടപടിക്രമത്തെക്കുറിച്ചാണ്. എബ്രായപാഠത്തിൽ ഇല്ലാത്ത പിൽക്കാല സഭാശാസ്ത്ര അവകാശവാദങ്ങൾ ചേർക്കാതെ, സന്ദർഭത്തിലുള്ള അനുസരണത്തിന്റെ ശക്തി പരിഭാഷ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള നിയമഭാവം നിലനിർത്തി. ‘നീ’ എന്ന ഏകവചന അഭിസംബോധനയും വലത്-ഇടത് ദിശാരൂപകവും മൂലപാഠത്തിനനുസരിച്ച് സംരക്ഷിച്ചു; സാങ്കേതികമോ വിഭാഗീയമോ ആയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
