id: DEU.17.13
reference: Deuteronomy 17:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כָל הָ/עָ֖ם יִשְׁמְע֣וּ וְ/יִרָ֑אוּ וְ/לֹ֥א יְזִיד֖וּ/ן עֽוֹד־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/013.yaml
  text: And all the people shall hear and fear[a], and shall not act presumptuously again.
translation:
  language: ml
  text: ജനമെല്ലാം കേൾക്കുകയും ഭയപ്പെടുകയും ചെയ്യും; ഇനി അവർ ധിക്കാരത്തോടെ പ്രവർത്തിക്കുകയുമില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇനി അഹങ്കാരപൂർവം പ്രവർത്തിക്കുകയില്ല” അല്ലെങ്കിൽ “ഇനി ധാർഷ്ട്യത്തോടെ പ്രവർത്തിക്കുകയില്ല.” എബ്രായക്രിയ മനഃപൂർവവും ധിക്കാരപരവുമായ പ്രവർത്തിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הָעָם
  choice: ജനമെല്ലാം
  rationale: എബ്രായപാഠത്തിൽ ‘ജനമെല്ലാം’ എന്നാണുള്ളത്; ഈ വാക്യത്തിൽ ‘ഇസ്രായേൽ’ എന്നു വ്യക്തമായി ചേർത്തിട്ടില്ല.
- source_word: יִשְׁמְעוּ
  choice: അതു കേട്ടു
  rationale: שׁמע എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘കേൾക്കുക’ നിലനിർത്തുന്നു. മലയാളത്തിൽ സന്ദർഭം സ്വാഭാവികമാക്കാൻ മുമ്പുള്ള ന്യായവിധിയെ സൂചിപ്പിക്കുന്ന ‘അതു’ ചേർത്തിരിക്കുന്നു.
- source_word: וְיִרָאוּ
  choice: ഭയപ്പെടും
  rationale: ഭയത്തിന്റെ കാരണം ദൈവമാണോ ശിക്ഷയാണോ രണ്ടുമാണോ എന്ന് വ്യക്തമാക്കാതെ, കർമമില്ലാത്ത എബ്രായപ്രയോഗത്തിന്റെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: וְלֹא יְזִידוּן
  choice: ധിക്കാരത്തോടെ പ്രവർത്തിക്കുകയുമില്ല
  rationale: זיד എന്ന ക്രിയ ഇവിടെ മനഃപൂർവവും അഹങ്കാരപൂർവവുമായ ധിക്കാരപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; വെറും അഭിമാനമെന്നതിലേക്കു ചുരുക്കാതെ പ്രവർത്തനപരമായ അർഥം നൽകുന്നു.
- source_word: עוֹד
  choice: പിന്നെ
  rationale: ഇനിമുതൽ അത്തരം പ്രവൃത്തി ആവർത്തിക്കുകയില്ല എന്ന עוֹד-ന്റെ കാലപരവും ആവർത്തനനിരോധകവുമായ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ന്യായവിധി ഉളവാക്കുന്ന ഭയത്തിന്റെ സ്വഭാവം
  choice: ‘ഭയപ്പെടും’ എന്നു മാത്രം നൽകി ഭയത്തിന്റെ കർമം വ്യക്തമാക്കുന്നില്ല
  alternative: ‘യഹോവയെ ഭയപ്പെടും’ അല്ലെങ്കിൽ ‘ശിക്ഷയെ ഭയപ്പെടും’
  rationale: എബ്രായപാഠത്തിൽ ഭയത്തിന്റെ കർമം പറഞ്ഞിട്ടില്ല. അതിനാൽ അത് ദൈവഭയമാണോ ശിക്ഷാഭയമാണോ രണ്ടുമാണോ എന്നു പരിഭാഷയിൽ തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമഭാഷ. ചെറുവാക്യത്തിന്റെ ഔപചാരിക ശക്തി നിലനിർത്തിക്കൊണ്ട്, അപൂർവമായ ‘ധാർഷ്ട്യം’ എന്നതിനുപകരം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ‘ധിക്കാരത്തോടെ’ തിരഞ്ഞെടുത്തു.
