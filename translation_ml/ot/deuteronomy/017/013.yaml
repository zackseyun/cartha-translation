revisions:
- from: ജനമെല്ലാം അതു കേട്ടു ഭയപ്പെടും; പിന്നെ അവർ ധിക്കാരത്തോടെ പ്രവർത്തിക്കുകയുമില്ല.[a]
  to: ജനമെല്ലാം കേൾക്കുകയും ഭയപ്പെടുകയും ചെയ്യും; ഇനി അവർ ധിക്കാരത്തോടെ പ്രവർത്തിക്കുകയുമില്ല.[a]
  rationale: The revision avoids supplying an explicit object for ‘hear,’ renders the coordinated Hebrew verbs transparently, and uses “ഇനി” to preserve the ‘again/any longer’ force of עוֹד. It retains the source’s unstated object of fear and its legal sense of defiant conduct.
