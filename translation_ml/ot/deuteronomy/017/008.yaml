  revision_rationale: സുരക്ഷിതമായ തിരുത്തൽ ആവശ്യമായ സ്രോതസ്സിനോടുള്ള വ്യതിയാനമോ ഭാഷാപരമായ തടസ്സമോ കണ്ടെത്തിയില്ല. നിലവിലെ പാഠവും അടിക്കുറിപ്പുകളും മൂലത്തിലെ നിയമപരവും സാംസ്കാരികവുമായ സൂക്ഷ്മതകൾ മതിയായവിധം പ്രതിഫലിപ്പിക്കുന്നു.
