reference: Deuteronomy 17:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֣י יִפָּלֵא֩ מִמְּ/ךָ֨ דָבָ֜ר לַ/מִּשְׁפָּ֗ט בֵּֽין דָּ֨ם לְ/דָ֜ם בֵּֽין דִּ֣ין לְ/דִ֗ין וּ/בֵ֥ין נֶ֨גַע֙ לָ/נֶ֔גַע דִּבְרֵ֥י רִיבֹ֖ת בִּ/שְׁעָרֶ֑י/ךָ וְ/קַמְתָּ֣ וְ/עָלִ֔יתָ אֶל הַ/מָּק֔וֹם אֲשֶׁ֥ר יִבְחַ֛ר יְהוָ֥ה אֱלֹהֶ֖י/ךָ בּֽ/וֹ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/008.yaml
  text: If a matter for judgment is too difficult for you—between bloodshed and bloodshed[a], between one legal claim and another, and between one injury and another[d][c][b], matters of dispute within your gates—then you shall arise and go up to the place that Yahweh your God will choose.
translation:
  language: ml
  text: ന്യായവിധിക്കുള്ള ഒരു കാര്യം നിനക്കു തീർപ്പാക്കാൻ കഴിയാത്തവിധം പ്രയാസമുള്ളതായാൽ—ഒരു രക്തച്ചൊരിച്ചിൽ കേസും മറ്റൊന്നും തമ്മിലോ[a], ഒരു നിയമവാദവും മറ്റൊന്നും തമ്മിലോ[b], ഒരു പരിക്കും മറ്റൊന്നും തമ്മിലോ[c]—നിന്റെ പട്ടണവാതിലുകൾക്കുള്ളിൽ[d] ഇത്തരം തർക്കവിഷയങ്ങൾ ഉണ്ടായാൽ, നീ എഴുന്നേറ്റ് നിന്റെ ദൈവമായ യഹ്‌വെ തിരഞ്ഞെടുക്കുന്ന സ്ഥലത്തേക്കു കയറിപ്പോകണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘രക്തത്തിനും രക്തത്തിനും മധ്യേ.’ കൊലപാതകമോ രക്തപാതകക്കുറ്റമോ ഉൾപ്പെടാവുന്ന ഒരു രക്തച്ചൊരിച്ചിൽ കേസ് മറ്റൊന്നിൽനിന്നു വേർതിരിച്ചറിയുന്നതാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: ‘ഒരു നിയമകേസും മറ്റൊന്നും തമ്മിൽ’ അല്ലെങ്കിൽ ‘ഒരു വിധിയും മറ്റൊന്നും തമ്മിൽ.’'
    reason: lexical_alternative
  - marker: c
    text: 'അഥവാ: ‘ഒരു ബാധയും മറ്റൊന്നും തമ്മിൽ,’ ‘ഒരു വ്യാധിയും മറ്റൊന്നും തമ്മിൽ,’ അല്ലെങ്കിൽ ‘ഒരു പ്രഹരവും മറ്റൊന്നും തമ്മിൽ.’'
    reason: lexical_alternative
  - marker: d
    text: പട്ടണവാതിലുകൾ സാധാരണയായി ന്യായവിധി നടത്തിയിരുന്ന ഇടങ്ങളായിരുന്നതിനാൽ, ‘നിന്റെ പട്ടണവാതിലുകൾക്കുള്ളിൽ’ എന്നത് പ്രാദേശിക പട്ടണകോടതികളെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: יִפָּלֵא
  choice: തീർപ്പാക്കാൻ കഴിയാത്തവിധം പ്രയാസമുള്ളതായാൽ
  rationale: നിഫാൽ രൂപം ഇവിടെ ന്യായാധിപന് തീരുമാനിക്കാൻ കഴിയാത്തത്ര ദുഷ്കരമായ അവസ്ഥയെ സൂചിപ്പിക്കുന്നു; ‘അത്ഭുതകരം’ എന്ന അക്ഷരാർഥം നിയമസന്ദർഭത്തിൽ തെറ്റിദ്ധരിപ്പിക്കും.
- source_word: דָבָר לַמִּשְׁפָּט
  choice: ന്യായവിധിക്കുള്ള ഒരു കാര്യം
  rationale: דָבָר എന്നതിന്റെ വിശാലത നിലനിർത്തിക്കൊണ്ട് לַמִּשְׁפָּט നൽകുന്ന നിയമപരമായ പശ്ചാത്തലം വ്യക്തമാക്കുന്നു.
- source_word: בֵּין דָּם לְדָם
  choice: ഒരു രക്തച്ചൊരിച്ചിൽ കേസും മറ്റൊന്നും തമ്മിൽ
  rationale: ‘രക്തത്തിനും രക്തത്തിനും മധ്യേ’ എന്ന എബ്രായ പ്രയോഗത്തിലെ ദൃശ്യഭാവം ഭാഗികമായി നിലനിർത്തുകയും രക്തപാതകം അല്ലെങ്കിൽ രക്തപാതകക്കുറ്റം സംബന്ധിച്ച കേസുകളാണ് ഉദ്ദേശ്യമെന്ന് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: בֵּין דִּין לְדִין
  choice: ഒരു നിയമവാദവും മറ്റൊന്നും തമ്മിൽ
  rationale: דִּין എന്നതിന് വാദം, കേസ്, വിധി എന്നീ അർഥസാധ്യതകളുണ്ട്; ഇവിടെ തർക്കത്തിലുള്ള നിയമവാദം എന്ന അർഥം സന്ദർഭത്തിന് യോജിക്കുന്നു, എന്നാൽ അടിക്കുറിപ്പിൽ മറ്റൊരു സാധ്യതയും നിലനിർത്തുന്നു.
- source_word: וּבֵין נֶגַע לָנֶגַע
  choice: ഒരു പരിക്കും മറ്റൊന്നും തമ്മിൽ
  rationale: നിയമപരമായ പട്ടികയിൽ נֶגַע എന്നത് ശാരീരിക ക്ഷതം സൂചിപ്പിക്കാമെന്നതിനാൽ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ ‘പരിക്ക്’ തിരഞ്ഞെടുത്തു; ബാധയോ വ്യാധിയോ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: דִּבְרֵי רִיבֹת
  choice: ഇത്തരം തർക്കവിഷയങ്ങൾ
  rationale: പ്രസ്താവിച്ച കേസുകളുടെ തർക്കസ്വഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: בִּשְׁעָרֶיךָ
  choice: നിന്റെ പട്ടണവാതിലുകൾക്കുള്ളിൽ
  rationale: ‘വാതിലുകൾ’ എന്ന സാംസ്കാരിക-നിയമപരമായ ചിത്രം നിലനിർത്തുന്നു; അത് പ്രാദേശിക ന്യായവിധിസ്ഥലത്തെ സൂചിപ്പിക്കുന്നുവെന്ന് അടിക്കുറിപ്പ് വിശദീകരിക്കുന്നു.
- source_word: וְקַמְתָּ וְעָלִיתָ
  choice: നീ എഴുന്നേറ്റ് ... കയറിപ്പോകണം
  rationale: തീരുമാനപൂർവമായ പുറപ്പെടലും കേന്ദ്രസ്ഥാനത്തേക്കുള്ള കയറ്റവും സൂചിപ്പിക്കുന്ന രണ്ടു ക്രിയകളുടെയും ഭാവം നിലനിർത്തുന്നു.
- source_word: הַמָּקוֹם אֲשֶׁר יִבְחַר
  choice: തിരഞ്ഞെടുക്കുന്ന സ്ഥലം
  rationale: yiqtol രൂപത്തിന്റെ ഭാവിമുഖത മലയാളത്തിലെ സന്ദർഭാനുസൃത വർത്തമാനരൂപംകൊണ്ട് സ്വാഭാവികമായി പ്രകടമാകുന്നു; ഇനിയും ദൈവം നിശ്ചയിക്കാനിരിക്കുന്ന സ്ഥലമാണ് ഉദ്ദേശ്യം.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, ‘Yahweh’ എന്ന ഉച്ചാരണത്തിന് ചേർന്ന മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം പേരിനെ ലിപ്യന്തരിച്ചു; ‘യഹോവ’യെക്കാൾ ‘യഹ്‌വെ’ എന്നത് Yahweh എന്ന രൂപത്തോട് അടുത്തതാണ്.
- issue: נֶגַע എന്ന പദത്തിന്റെ നിയമപരമായ അർഥം
  choice: പരിക്ക്
  alternative: ബാധ; വ്യാധി; പ്രഹരം
  rationale: ശാരീരിക ക്ഷതത്തെപ്പറ്റിയുള്ള തർക്കങ്ങൾ ഈ ന്യായവ്യവഹാരപ്പട്ടികയ്ക്ക് നന്നായി ചേരുന്നു. എങ്കിലും പദത്തിന്റെ ബാധ/വ്യാധി എന്ന സാധ്യത ഉറപ്പിച്ചു നീക്കാതെ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമഭാഷ ഉപയോഗിച്ചു. മൂലത്തിലെ ദീർഘമായ വ്യവസ്ഥാവാക്യഘടന ഡാഷുകൾകൊണ്ട് വായനാസൗകര്യത്തോടെ നിലനിർത്തി. സാങ്കേതികമായ ‘ക്ഷതം’ എന്നതിനുപകരം പൊതുവായ ‘പരിക്ക്’ ഉപയോഗിച്ചെങ്കിലും മൂലപദത്തിന്റെ വിപുലമായ അർഥപരിധി അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
