id: DEU.17.17
reference: Deuteronomy 17:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לֹ֤א יַרְבֶּה לּ/וֹ֙ נָשִׁ֔ים וְ/לֹ֥א יָס֖וּר לְבָב֑/וֹ וְ/כֶ֣סֶף וְ/זָהָ֔ב לֹ֥א יַרְבֶּה לּ֖/וֹ מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/017.yaml
  text: And he shall not multiply wives for himself[a], lest his heart turn away; and he shall not greatly multiply silver and gold for himself.
translation:
  language: ml
  text: അവൻ തനിക്കായി ഭാര്യമാരെ പെരുക്കരുത്[a], അവന്റെ ഹൃദയം വഴിതെറ്റിപ്പോകാതിരിക്കാൻ; തനിക്കായി വെള്ളിയും പൊന്നും അതിയായി പെരുക്കുകയും അരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അവന്റെ ഹൃദയം വഴിതെറ്റിപ്പോകരുത്.” ഹീബ്രുവിൽ ഈ വാക്യഭാഗത്തെ ഉദ്ദേശ്യം/ഫലം സൂചിപ്പിക്കുന്നതായി മാത്രമല്ല, അതിനോടു സമാന്തരമായ മറ്റൊരു നിരോധനമായും വായിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: יַרְבֶּה
  choice: പെരുക്കുക
  rationale: ഹിഫീൽ രൂപം എണ്ണത്തിലോ അളവിലോ വർധിപ്പിക്കുകയും അമിതമായി ശേഖരിക്കുകയും ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. വാക്യത്തിലെ രണ്ടു പ്രയോഗങ്ങൾക്കുമിടയിലെ ആവർത്തനബന്ധം നിലനിർത്താൻ രണ്ടിടത്തും ‘പെരുക്കുക’ ഉപയോഗിച്ചു.
- source_word: נָשִׁים
  choice: ഭാര്യമാർ
  rationale: രാജാവിനെക്കുറിച്ചുള്ള ഈ നിയമസന്ദർഭത്തിൽ പദം പൊതുവായി സ്ത്രീകളെയല്ല, വിവാഹബന്ധത്തിലുള്ള ഭാര്യമാരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: יָסוּר
  choice: വഴിതെറ്റിപ്പോകുക
  rationale: סור എന്ന ക്രിയയുടെ ‘വിട്ടുമാറുക/തിരിഞ്ഞുപോകുക’ എന്ന രൂപകം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; എന്തിൽനിന്നാണ് ഹൃദയം മാറുന്നതെന്ന് മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ അത് കൂട്ടിച്ചേർത്തിട്ടില്ല.
- source_word: לְבָבוֹ
  choice: അവന്റെ ഹൃദയം
  rationale: മനസ്സ്, ഇച്ഛ, ആന്തരിക പ്രവണത എന്നിവ ഉൾക്കൊള്ളുന്ന ബൈബിൾപരമായ രൂപകവും ദൈവശാസ്ത്രപരമായ അനുരണനവും നിലനിർത്തുന്നു.
- source_word: כֶּסֶף וְזָהָב
  choice: വെള്ളിയും പൊന്നും
  rationale: രണ്ടു മൂർത്തമായ സമ്പത്തുപദങ്ങളെയും അവയുടെ പരമ്പരാഗത കൂട്ടുചേരലിനെയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: מְאֹד
  choice: അതിയായി
  rationale: ശേഖരണത്തിന്റെ അമിതത്വം വ്യക്തമാക്കുന്ന ശക്തിവർധകമായി സ്വാഭാവികവും നിയമശൈലിക്ക് യോജിച്ചതുമാണ്.
- source_word: וְלֹא ... וְלֹא ... לֹא
  choice: പെരുക്കരുത് ... വഴിതെറ്റിപ്പോകാതിരിക്കാൻ ... പെരുക്കുകയും അരുത്
  rationale: നിഷേധാത്മക നിയമശൈലി നിലനിർത്തുന്നതിനൊപ്പം മധ്യവാക്യത്തെ ആദ്യ നിരോധനത്തിന്റെ ഉദ്ദേശ്യം/മുന്നറിയിപ്പ് എന്ന പ്രധാന വായനയിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഭാര്യമാരെ പെരുക്കുന്നതും ഹൃദയം വഴിതെറ്റുന്നതും തമ്മിലുള്ള ബന്ധം
  choice: മധ്യവാക്യം ആദ്യ നിരോധനത്തിന്റെ ഉദ്ദേശ്യം അല്ലെങ്കിൽ ഒഴിവാക്കേണ്ട ഫലം എന്ന നിലയിൽ ‘അവന്റെ ഹൃദയം വഴിതെറ്റിപ്പോകാതിരിക്കാൻ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘അവന്റെ ഹൃദയം വഴിതെറ്റിപ്പോകരുത്’ എന്ന സമാന്തര നിരോധനം.
  rationale: ഹീബ്രു വാക്യഘടന രണ്ടുവായനകൾക്കും ഇടനൽകുന്നു. സന്ദർഭത്തിൽ ഉദ്ദേശ്യ/ഫലവായന സ്വാഭാവികമായതിനാൽ അത് മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; എന്നാൽ യഥാർഥമായ വ്യാകരണദ്വയാർഥത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു. ‘യഹോവയിൽനിന്ന്’ എന്നതുപോലുള്ള വ്യക്തമാക്കൽ മൂലപാഠത്തിൽ ഇല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമശൈലി സ്വീകരിച്ചു. ‘പെരുക്കുക’ എന്ന ആവർത്തനം ഹീബ്രു പദാവർത്തനം സംരക്ഷിക്കുന്നു; ‘ഹൃദയം’ എന്ന ബൈബിൾരൂപകം വിശദീകരിച്ചു മാറ്റാതെ നിലനിർത്തുന്നു.
