revisions:
- from: പോയി അന്യദേവന്മാരെ സേവിക്കുകയും അവയ്ക്കു മുമ്പിൽ കുമ്പിടുകയും, അല്ലെങ്കിൽ സൂര്യന്റെയോ ചന്ദ്രന്റെയോ ആകാശത്തിലെ സകല സൈന്യത്തിന്റെയോ[a] മുമ്പിൽ കുമ്പിടുകയും ചെയ്താൽ—അതു ഞാൻ കല്പിച്ചിട്ടില്ലാത്തതാണ്[b]—
  to: പോയി മറ്റുദേവന്മാരെ സേവിക്കയും അവരെ വണങ്ങുകയും, അല്ലെങ്കിൽ സൂര്യനെയോ ചന്ദ്രനെയോ ഞാൻ കല്പിച്ചിട്ടില്ലാത്ത ആകാശത്തിലെ സകല സൈന്യത്തെയോ വണങ്ങുകയും ചെയ്താൽ—
  rationale: The revised wording retains the Hebrew sequence and the distinction between serving and bowing. It uses direct Malayalam objects for the bowing verb. Placing “ഞാൻ കല്പിച്ചിട്ടില്ലാത്ത” immediately before “ആകാശത്തിലെ സകല സൈന്യം” reflects the most immediate Hebrew syntactic attachment while the footnote explicitly preserves the broader contextual scope. No doctrinal interpretation is added.
