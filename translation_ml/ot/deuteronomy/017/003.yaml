source:
  edition: WLC
  text: וַ/יֵּ֗לֶךְ וַֽ/יַּעֲבֹד֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וַ/יִּשְׁתַּ֖חוּ לָ/הֶ֑ם וְ/לַ/שֶּׁ֣מֶשׁ א֣וֹ לַ/יָּרֵ֗חַ א֛וֹ לְ/כָל צְבָ֥א הַ/שָּׁמַ֖יִם אֲשֶׁ֥ר לֹא צִוִּֽיתִי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/003.yaml
  text: and goes and serves other gods and bows down to them[a], or to the sun or to the moon or to all the host of heaven, which I have not commanded[b],
translation:
  language: ml
  text: പോയി മറ്റുദേവന്മാരെ സേവിക്കയും അവരെ വണങ്ങുകയും, അല്ലെങ്കിൽ സൂര്യനെയോ ചന്ദ്രനെയോ ഞാൻ കല്പിച്ചിട്ടില്ലാത്ത ആകാശത്തിലെ സകല സൈന്യത്തെയോ വണങ്ങുകയും ചെയ്താൽ—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: പോയി
  rationale: നിയമപരമായ നിബന്ധനയുടെ തുടർച്ചയായ പ്രവൃത്തിയെ സൂചിപ്പിക്കാൻ സ്വാഭാവികമായ മലയാളപ്രയോഗം; മുൻവാക്യത്തിലെ ‘എങ്കിൽ’ എന്ന ആശയവുമായി ചേർന്ന് വായിക്കപ്പെടുന്നു.
- source_word: וַיַּעֲבֹד
  choice: സേവിക്കുകയും
  rationale: ദേവന്മാരോടുള്ള ആരാധനാപരമായ സേവനം എന്ന עבד-ന്റെ അർഥം നിലനിർത്തുന്നു; തുടർന്നുള്ള കുമ്പിടൽ എന്ന ശാരീരിക ആരാധനാഭാവത്തിൽനിന്ന് ഇതിനെ വേർതിരിച്ചും കാണിക്കുന്നു.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: അന്യദേവന്മാരെ
  rationale: ‘മറ്റു ദേവന്മാർ’ എന്ന നേരിട്ടുള്ള അർഥം; ‘വിദേശദേവന്മാർ’ എന്ന വംശീയമോ ഭൂമിശാസ്ത്രപരമോ ആയ അധികനിറം ചേർക്കുന്നില്ല.
- source_word: וַיִּשְׁתַּחוּ לָהֶם
  choice: അവയ്ക്കു മുമ്പിൽ കുമ്പിടുകയും
  rationale: ഹീബ്രു ക്രിയയിലെ കുനിഞ്ഞ് വണങ്ങുന്ന ശാരീരിക പ്രവൃത്തി വ്യക്തമാക്കുന്നു; അതിനെ പൊതുവായ ‘ആരാധിക്കുക’ എന്ന പദത്തിൽ ലയിപ്പിക്കുന്നില്ല.
- source_word: וְלַשֶּׁמֶשׁ א֣וֹ לַיָּרֵחַ
  choice: അല്ലെങ്കിൽ സൂര്യന്റെയോ ചന്ദ്രന്റെയോ മുമ്പിൽ
  rationale: തുടർന്നുള്ള אוֹ...אוֹ എന്ന വികല്പക്രമത്തിന്റെ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לְכָל צְבָא הַשָּׁמָיִם
  choice: ആകാശത്തിലെ സകല സൈന്യത്തിന്റെയും മുമ്പിൽ
  rationale: צבא എന്ന കൂട്ടായ പദത്തിന്റെ രൂപകം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ആകാശഗോളങ്ങളാണ് മുൻനിര അർഥമെങ്കിലും സ്വർഗീയ സത്തകളെ പൂർണമായി ഒഴിവാക്കുന്നില്ല.
- source_word: אֲשֶׁר לֹא צִוִּיתִי
  choice: അതു ഞാൻ കല്പിച്ചിട്ടില്ലാത്തതാണ്
  rationale: ‘നിരോധിച്ചു’ എന്ന് വ്യാഖ്യാനിച്ചു ചേർക്കാതെ, ദൈവം കല്പിച്ചിട്ടില്ല എന്ന ഹീബ്രുവിന്റെ നേരിട്ടുള്ള പ്രസ്താവന നിലനിർത്തുന്നു.
theological_decisions:
- issue: അവസാനത്തെ אֲשֶׁר לֹא צִוִּיתִי എന്ന ആപേക്ഷികവാക്യത്തിന്റെ വ്യാപ്തി
  choice: ‘അതു ഞാൻ കല്പിച്ചിട്ടില്ലാത്തതാണ്’ എന്നു പൊതുവായി നൽകി, തൊട്ടുമുമ്പുള്ള ആകാശസൈന്യത്തെയോ വിവരിച്ച മുഴുവൻ വിഗ്രഹാരാധനാപ്രവൃത്തിയെയോ സൂചിപ്പിക്കാവുന്ന വിധം തുറന്നുവെച്ചു.
  alternative: ഇത് ‘ആകാശത്തിലെ സകല സൈന്യം’ എന്നതിന് മാത്രം ചേർത്തു വിവർത്തനം ചെയ്യാം.
  rationale: ഹീബ്രു വ്യാകരണത്തിൽ ഏറ്റവും അടുത്തുള്ള നാമപ്രയോഗത്തോടു ബന്ധിപ്പിക്കാമെങ്കിലും, സന്ദർഭത്തിൽ മുഴുവൻ അന്യാരാധനയെയും ദൈവം നിരാകരിക്കുന്ന സംഗ്രഹവാക്യമായും കേൾക്കാം; വിവർത്തനം ഈ ഉദ്ദേശ്യപൂർവമായ വ്യാപ്ത്യസന്ദിഗ്ധത പരിഹരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള നിയമഭാഷ നിലനിർത്തി. വാക്യം മുൻപത്തെ നിബന്ധനാവാക്യത്തിന്റെ തുടർച്ചയായതിനാൽ ‘പോയി’ എന്ന തുടക്കം സംരക്ഷിച്ചു. ‘കുമ്പിടുക’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ശാരീരിക വണക്കം സൂചിപ്പിക്കുന്നതുമാണ്; ‘ആകാശത്തിലെ സകല സൈന്യം’ മൂലഭാഷയിലെ കൂട്ടായ രൂപകം സംരക്ഷിക്കുന്നു.
