id: DEU.17.15
reference: Deuteronomy 17:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: שׂ֣וֹם תָּשִׂ֤ים עָלֶ֨י/ךָ֙ מֶ֔לֶךְ אֲשֶׁ֥ר יִבְחַ֛ר יְהוָ֥ה אֱלֹהֶ֖י/ךָ בּ֑/וֹ מִ/קֶּ֣רֶב אַחֶ֗י/ךָ תָּשִׂ֤ים עָלֶ֨י/ךָ֙ מֶ֔לֶךְ לֹ֣א תוּכַ֗ל לָ/תֵ֤ת עָלֶ֨י/ךָ֙ אִ֣ישׁ נָכְרִ֔י אֲשֶׁ֥ר לֹֽא אָחִ֖י/ךָ הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/015.yaml
  text: You shall surely set over yourself a king whom Yahweh your God chooses[a]. From among your brothers you shall set a king over yourself; you may not put over yourself a foreigner[b], one who is not your brother.
translation:
  language: ml
  text: നിന്റെ ദൈവമായ യഹ്‌വെ തിരഞ്ഞെടുക്കുന്ന രാജാവിനെ നീ നിശ്ചയമായും നിനക്കുമേൽ നിയമിക്കണം. നിന്റെ സഹോദരന്മാരുടെ ഇടയിൽനിന്ന്[a] ഒരു രാജാവിനെ നീ നിനക്കുമേൽ നിയമിക്കണം; നിന്റെ സഹോദരനല്ലാത്ത ഒരു അന്യദേശക്കാരനെ[b] നിനക്കുമേൽ നിയമിക്കാൻ നിനക്കു പാടില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സഹോദരന്മാർ’ എന്ന എബ്രായ ബന്ധുത്വപദം ഇവിടെ ഇസ്രായേൽജനത്തിലെ സഹാംഗങ്ങളെ, അതായത് സ്വന്തം ജനത്തിൽപ്പെട്ടവരെ, സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘അന്യനായ ഒരു പുരുഷൻ’; തുടർന്നുള്ള വാക്കുകൾ അതിനെ ‘നിന്റെ സഹോദരനല്ലാത്തവൻ’ എന്നു വിശദീകരിക്കുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: שׂוֹם תָּשִׂים
  choice: നിശ്ചയമായും ... നിയമിക്കണം
  rationale: ക്രിയാധാതുരൂപവും അപൂർണക്രിയയും ചേർന്ന എബ്രായ പ്രയോഗത്തിന്റെ ഊന്നൽ ‘നിശ്ചയമായും’ എന്നതിലൂടെ നിലനിർത്തുന്നു; നിയമസന്ദർഭത്തിലെ ആജ്ഞ ‘നിയമിക്കണം’ എന്നു സ്വാഭാവികമായി നൽകുന്നു.
- source_word: עָלֶיךָ
  choice: നിന്റെമേൽ
  rationale: ജനത്തെ ഏകവചനത്തിൽ അഭിസംബോധന ചെയ്യുന്ന മൂലപാഠവും ഒരാളെ തങ്ങളുടെമേൽ ഭരണാധികാരിയായി നിയമിക്കുന്ന ആശയവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: מֶלֶךְ
  choice: രാജാവ്
  rationale: രാജകീയ ഭരണാധികാരിയെ സൂചിപ്പിക്കുന്ന പതിവും നേരിട്ടുള്ളതുമായ മലയാളപദം.
- source_word: אֲשֶׁר יִבְחַר יְהוָה אֱלֹהֶיךָ בּוֹ
  choice: നിന്റെ ദൈവമായ യഹ്‌വെ തിരഞ്ഞെടുക്കുന്ന
  rationale: നിയമനിർദേശത്തിലെ പൊതുവായ ഭാവം നിലനിർത്താൻ വർത്തമാനകാലരൂപം ഉപയോഗിക്കുകയും ദൈവനാമം ശീർഷകമാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: מִקֶּרֶב אַחֶיךָ
  choice: നിന്റെ സഹോദരന്മാരുടെ ഇടയിൽനിന്ന്
  rationale: ‘നടുവിൽനിന്ന്/ഇടയിൽനിന്ന്’ എന്ന ആശയവും ഉടമ്പടിസമൂഹത്തിലെ ബന്ധുത്വഭാഷയും സംരക്ഷിക്കുന്നു; കുറിപ്പ് ഇതിന്റെ സമൂഹപരമായ സൂചന വ്യക്തമാക്കുന്നു.
- source_word: לֹא תוּכַל לָתֵת
  choice: നിയമിക്കാൻ നിനക്കു പാടില്ല
  rationale: അക്ഷരാർഥം ‘നിയമിക്കാൻ നിനക്കു കഴിയുകയില്ല’ എന്നാണെങ്കിലും നിയമസന്ദർഭത്തിൽ ഇത് നിരോധനം പ്രകടിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘പാടില്ല’ ആ നിയമബലം വ്യക്തമായി നൽകുന്നു.
- source_word: אִישׁ נָכְרִי
  choice: ഒരു അന്യദേശക്കാരനെ
  rationale: സ്വന്തം ഉടമ്പടിസമൂഹത്തിൽപ്പെടാത്ത പുരുഷനെ സൂചിപ്പിക്കുന്ന വ്യത്യാസം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘രാജാവ്’ എന്ന പദം സ്ഥാനാർത്ഥിയുടെ പുരുഷലിംഗം ഇതിനകം വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר לֹא אָחִיךָ הוּא
  choice: നിന്റെ സഹോദരനല്ലാത്ത
  rationale: ‘അന്യദേശക്കാരൻ’ എന്നതിനെ വിശദീകരിക്കുന്ന എബ്രായ ബന്ധുത്വഭാഷ നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ഉടമ്പടിനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ ദൈവത്തിന്റെ വ്യക്തിനാമം ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: אַחֶיךָ / אָחִיךָ എന്ന ലിംഗനിർദ്ദിഷ്ട ബന്ധുത്വഭാഷ
  choice: സഹോദരന്മാർ / സഹോദരൻ
  alternative: സ്വജനങ്ങൾ / സഹഇസ്രായേല്യർ
  rationale: മൂലപാഠത്തിലെ പുരുഷലിംഗ ബന്ധുത്വപദങ്ങൾ രാജസ്ഥാനത്തേക്കുള്ള പുരുഷസ്ഥാനാർത്ഥിയെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ നിലനിർത്തുന്നു; ‘സഹോദരന്മാർ’ ഇവിടെ ഇസ്രായേൽജനത്തിലെ സഹാംഗങ്ങളെ സൂചിപ്പിക്കുന്നുവെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- issue: לֹא תוּכַל എന്ന രൂപത്തിന്റെ നിയമപരമായ ബലം
  choice: നിനക്കു പാടില്ല
  alternative: നിനക്കു കഴിയുകയില്ല
  rationale: കഴിവില്ലായ്മയെന്ന അക്ഷരാർഥവും നിരോധനമെന്ന നിയമസന്ദർഭാർഥവും തമ്മിലുള്ള വ്യത്യാസത്തിൽ, മലയാളത്തിൽ ആജ്ഞയുടെ യഥാർഥ പ്രവർത്തനം വ്യക്തമാക്കുന്ന നിരോധനരൂപം സ്വീകരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്കു വ്യക്തവുമായ നിയമനിർദേശശൈലി. ആവർത്തിച്ചുള്ള ‘നിന്റെമേൽ ... രാജാവായി നിയമിക്കുക’ എന്ന ഘടന മൂലപാഠത്തിന്റെ ഊന്നലും സമാന്തരതയും നിലനിർത്തുന്നു.
