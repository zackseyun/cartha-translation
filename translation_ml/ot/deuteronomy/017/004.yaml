source:
  edition: WLC
  text: וְ/הֻֽגַּד לְ/ךָ֖ וְ/שָׁמָ֑עְתָּ וְ/דָרַשְׁתָּ֣ הֵיטֵ֔ב וְ/הִנֵּ֤ה אֱמֶת֙ נָכ֣וֹן הַ/דָּבָ֔ר נֶעֶשְׂתָ֛ה הַ/תּוֹעֵבָ֥ה הַ/זֹּ֖את בְּ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/004.yaml
  text: and it is reported to you[a], and you hear of it, and you investigate thoroughly, and behold, it is true and certain that this abomination has been done in Israel,
translation:
  language: ml
  text: ഇക്കാര്യം നിനക്കു അറിയിക്കപ്പെടുകയും നീ അതിനെക്കുറിച്ചു കേൾക്കുകയും ചെയ്താൽ, നീ നന്നായി അന്വേഷിക്കണം. ഇതാ, ആ കാര്യം സത്യവും ഉറപ്പുള്ളതുമാണ് എന്നു തെളിയുകയും,[a] അറപ്പുളവാക്കുന്ന ഈ പ്രവൃത്തി ഇസ്രായേലിൽ നടന്നിട്ടുണ്ടെന്നും തെളിയുകയും ചെയ്താൽ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആ കാര്യം സത്യവും സ്ഥിരീകരിക്കപ്പെട്ടതുമാണ്.”
    reason: אֱמֶת נָכוֹן הַדָּבָר എന്ന നിയമപരമായ സ്ഥിരീകരണസൂത്രത്തിന് കൂടുതൽ രൂപസമീപമായ മറ്റൊരു വിവർത്തനം.
lexical_decisions:
- source_word: וְהֻגַּד לְךָ
  choice: അതു നിന്നെ അറിയിക്കുകയും
  rationale: נגד എന്ന ധാതുവിന്റെ ഹൊഫാൽ രൂപത്തിലുള്ള നിഷ്ക്രിയ അർഥം നിലനിർത്തുന്നു; റിപ്പോർട്ട് അഭിസംബോധിതനോട് അറിയിക്കപ്പെടുന്നു.
- source_word: וְשָׁמָעְתָּ
  choice: നീ അതിനെക്കുറിച്ചു കേൾക്കുകയും ചെയ്താൽ
  rationale: മുൻവാക്യത്തിലെ കാര്യം തന്നെയാണ് പരോക്ഷ കർമമെന്നത് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; സന്ദർഭത്തിലെ നിബന്ധനാഭാവവും പ്രകടമാക്കുന്നു.
- source_word: וְדָרַשְׁתָּ הֵיטֵב
  choice: നീ അതു നന്നായി അന്വേഷിക്കണം
  rationale: ന്യായവിധിസന്ദർഭത്തിൽ דרש സൂക്ഷ്മമായ അന്വേഷണം സൂചിപ്പിക്കുന്നു; הֵיטֵב അന്വേഷണത്തിന്റെ സമഗ്രത ഊന്നിപ്പറയുന്നു.
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: അന്വേഷണഫലത്തിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു വ്യവഹാരചിഹ്നത്തിന്റെ ഗൗരവവും ഊന്നലും നിലനിർത്തുന്നു.
- source_word: אֱמֶת נָכוֹן הַדָּבָר
  choice: ആ കാര്യം സത്യവും ഉറപ്പുള്ളതുമാണെന്നും ... തെളിഞ്ഞാൽ
  rationale: നിയമപരമായ സ്ഥിരീകരണസൂത്രത്തിലെ ‘സത്യം’, ‘സ്ഥിരീകരിക്കപ്പെട്ടത്/ഉറപ്പുള്ളത്’ എന്നീ രണ്ടു ഘടകങ്ങളും വേർതിരിച്ചു നിലനിർത്തുന്നു; മലയാളവാക്യത്തിൽ അന്വേഷണഫലമായി തെളിയുന്നുവെന്ന ബന്ധം സ്വാഭാവികമാക്കുന്നു.
- source_word: נֶעֶשְׂתָה
  choice: നടന്നിട്ടുണ്ടെന്നും
  rationale: പൂർത്തിയായ പ്രവൃത്തി അന്വേഷണത്തിലൂടെ ഇപ്പോൾ സ്ഥിരീകരിക്കപ്പെടുന്നു എന്ന ഭാവം മലയാളത്തിലെ പൂർണ്ണക്രിയാരൂപം നൽകുന്നു.
- source_word: הַתּוֹעֵבָה הַזֹּאת
  choice: ഈ മ്ലേച്ഛകൃത്യം
  rationale: תועבהയുടെ ശക്തമായ ധാർമിക-ഉടമ്പടിപരമായ അപലപനം നിലനിർത്തുകയും ഇത് ഒരു ചെയ്ത പ്രവൃത്തിയാണെന്ന സന്ദർഭം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: בְּיִשְׂרָאֵל
  choice: ഇസ്രായേലിൽ
  rationale: കുറ്റകൃത്യം ഉടമ്പടിസമൂഹത്തിനുള്ളിൽ നടന്നുവെന്ന സ്ഥല-സാമൂഹിക അർഥം നേരിട്ട് നൽകുന്നു.
theological_decisions:
- issue: אֱמֶת נָכוֹן הַדָּבָר എന്ന നിയമപരമായ സ്ഥിരീകരണസൂത്രത്തിന്റെ വിവർത്തനം
  choice: ആ കാര്യം സത്യവും ഉറപ്പുള്ളതുമാണെന്നും ... തെളിഞ്ഞാൽ
  alternative: ആ കാര്യം സത്യവും സ്ഥിരീകരിക്കപ്പെട്ടതുമാണെങ്കിൽ
  rationale: പരിശോധിച്ചുറപ്പിച്ച വസ്തുതയെന്ന നിയമസന്ദർഭം പ്രകടമാക്കുമ്പോഴും אֱמֶת, נָכוֹן എന്നീ ഇരട്ട ഊന്നലുകൾ ചുരുക്കുന്നില്ല.
- issue: תּוֹעֵבָה എന്ന പദത്തിന്റെ ശക്തി
  choice: മ്ലേച്ഛകൃത്യം
  alternative: അറപ്പുളവാക്കുന്ന പ്രവൃത്തി
  rationale: വാചകത്തിന്റെ ശക്തമായ ധാർമിക വിലയിരുത്തൽ മയപ്പെടുത്താതെ, ആധുനിക മലയാളത്തിൽ ഒരു പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന ഗൗരവമുള്ള പദം ഉപയോഗിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമഭാഷയാണ് ഉപയോഗിച്ചത്. ഹീബ്രുവിലെ നിരന്തര വാവ്-ക്രിയകളെ മലയാളത്തിൽ സ്വാഭാവികമായ നിബന്ധനാ-അന്വേഷണക്രമമായി അവതരിപ്പിച്ചു. ‘ഇതാ’ എന്നത് മൂലത്തിലെ ശ്രദ്ധാകർഷകമായ വ്യവഹാരചിഹ്നം സംരക്ഷിക്കുന്നു; പാദക്കുറിപ്പ് ചിഹ്നം മുഖ്യവാചകത്തിൽ [a] ആയി നൽകിയിരിക്കുന്നു.
