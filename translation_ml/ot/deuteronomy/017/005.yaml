  text: וְ/הֽוֹצֵאתָ֣ אֶת הָ/אִ֣ישׁ הַ/ה֡וּא אוֹ֩ אֶת הָ/אִשָּׁ֨ה הַ/הִ֜וא אֲשֶׁ֣ר עָ֠שׂוּ אֶת הַ/דָּבָ֨ר הָ/רָ֤ע הַ/זֶּה֙ אֶל שְׁעָרֶ֔י/ךָ אֶת הָ/אִ֕ישׁ א֖וֹ אֶת הָ/אִשָּׁ֑ה וּ/סְקַלְתָּ֥/ם בָּ/אֲבָנִ֖ים וָ/מֵֽתוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/005.yaml
  text: then you shall bring out to your gates that man or that woman who did this evil thing[a], that man or that woman, and you shall stone them with stones[b], and they shall die.
translation:
  language: ml
  text: അപ്പോൾ ഈ ദുഷ്ടകാര്യം[a] ചെയ്ത ആ പുരുഷനെയോ ആ സ്ത്രീയെയോ നിന്റെ കവാടങ്ങളിലേക്കു[b] കൊണ്ടുവരണം. ആ പുരുഷനെയോ ആ സ്ത്രീയെയോ കല്ലെറിയണം; അവർ മരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കാര്യം’ എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപദത്തിന് ഈ നിയമസന്ദർഭത്തിൽ ‘സംഭവം’ അല്ലെങ്കിൽ ‘വിഷയം’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: ‘നിന്റെ കവാടങ്ങൾ’ എന്നത് പട്ടണകവാടങ്ങളെ സൂചിപ്പിക്കുന്നു; പുരാതന ഇസ്രായേലിൽ അവ പൊതുന്യായവിധിയും നിയമനടപടികളും നടന്നിരുന്ന പതിവുസ്ഥലമായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וְהוֹצֵאתָ
  choice: അപ്പോൾ ... കൊണ്ടുവരണം
  rationale: നിയമനിർദേശത്തിലെ വാവ് ചേർന്ന ക്രിയ മുൻവാക്യത്തിനു തുടർന്നുള്ള നടപടിയെ സൂചിപ്പിക്കുന്നു; ‘അപ്പോൾ’ ആ ക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הָאִישׁ ... הָאִשָּׁה
  choice: ആ പുരുഷനെയോ ആ സ്ത്രീയെയോ
  rationale: എബ്രായത്തിലെ നിർദിഷ്ടതയും പുരുഷൻ–സ്ത്രീ എന്ന വ്യക്തമായ ദ്വയപ്രയോഗവും ലിംഗനിരപേക്ഷമായി ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר עָשׂוּ
  choice: ചെയ്ത
  rationale: ബന്ധവാക്യത്തെ ലളിതവും നേരിട്ടുമുള്ള മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ‘കുറ്റം ചെയ്ത’ എന്നു ചേർത്ത് മൂലത്തിൽ ഇല്ലാത്ത നിയമപരമായ പദം ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: הַדָּבָר הָרָע הַזֶּה
  choice: ഈ ദുഷ്ടകാര്യം
  rationale: דָּבָר എന്ന പദത്തിന്റെ ‘കാര്യം/സംഭവം’ എന്ന നിയമസന്ദർഭാർഥവും רָע എന്നതിന്റെ നൈതിക ദോഷാർഥവും പ്രകടമാക്കുന്നു; പദത്തിന്റെ പരിധി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: אֶל שְׁעָרֶיךָ
  choice: നിന്റെ കവാടങ്ങളിലേക്കു
  rationale: എബ്രായത്തിലെ ബഹുവചനവും ദൃശ്യമായ ‘കവാടങ്ങൾ’ എന്ന പ്രയോഗവും നിലനിർത്തുന്നു; പുരാതന ന്യായനടപടികളിലെ അതിന്റെ സാംസ്കാരിക പ്രാധാന്യം അടിക്കുറിപ്പിലാക്കുന്നു.
- source_word: וּסְקַלְתָּם בָּאֲבָנִים
  choice: അവരെ കല്ലുകൾകൊണ്ട് എറിയണം
  rationale: ‘കല്ലുകൾകൊണ്ട്’ എന്ന മൂലത്തിലെ വ്യക്തമായ ഉപാധി ഒഴിവാക്കാതെ, നിയമനിർദേശത്തിന്റെ നിർബന്ധസ്വഭാവം മലയാളത്തിലെ ‘വേണം’ രൂപത്തിൽ നൽകുന്നു.
- source_word: וָמֵתוּ
  choice: അവർ മരിക്കണം
  rationale: ശിക്ഷയുടെ ഫലം ഗൗരവമുള്ള നിയമഭാഷയിൽ അടുത്തായി അവതരിപ്പിക്കുന്നു; കാരണബന്ധം മൂലത്തേക്കാൾ അധികമായി വിശദീകരിക്കുന്നില്ല.
theological_decisions:
- issue: ലിംഗം വ്യക്തമാക്കുന്ന നിയമരൂപം
  choice: ആ പുരുഷനെയോ ആ സ്ത്രീയെയോ
  alternative: ആ വ്യക്തിയെ
  rationale: മൂലം പുരുഷനെയും സ്ത്രീയെയും പ്രത്യേകം പരാമർശിക്കുന്നതിനാൽ ആ വ്യത്യാസം പൊതുവായ ‘വ്യക്തി’ എന്ന പദത്തിൽ ലയിപ്പിച്ചിട്ടില്ല.
- issue: ന്യായവിധിയുടെ സ്ഥലം
  choice: നിന്റെ കവാടങ്ങളിലേക്കു
  alternative: പൊതുന്യായവിധിസ്ഥലത്തേക്കു
  rationale: മൂലത്തിലെ സാക്ഷാൽ ‘കവാടങ്ങൾ’ എന്ന രൂപം നിലനിർത്തി, അതിന്റെ സാമൂഹിക-ന്യായപരമായ പ്രവർത്തനം വ്യാഖ്യാനമായി മുഖ്യവാചകത്തിൽ ചേർക്കാതെ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ബഹുവചന സർവനാമം
  choice: അവരെ ... അവർ
  alternative: അയാളെ ... അയാൾ
  rationale: പുരുഷനോ സ്ത്രീയോ എന്ന വികൽപത്തെത്തുടർന്ന് മൂലത്തിൽ വരുന്ന ബഹുവചന പ്രത്യയവും ക്രിയയും നിലനിർത്തുന്നു; ഒരേസമയം ഇരുവരെയും ശിക്ഷിക്കണമെന്ന അനാവശ്യ നിർവചനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമശൈലി ഉപയോഗിച്ചു. ആവർത്തനം മൂലത്തിലെ ഔപചാരിക ഊന്നൽ നിലനിർത്തുന്നതിനായി സൂക്ഷിച്ചു; അപരിചിതമായ സാംസ്കാരിക വിവരം മുഖ്യവാചകത്തിൽ വികസിപ്പിക്കാതെ അടിക്കുറിപ്പിൽ നൽകി.
