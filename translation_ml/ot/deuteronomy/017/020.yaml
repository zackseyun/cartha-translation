base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/020.yaml
  text: so that his heart may not be lifted up above his brothers[a], and so that he may not turn aside from the commandment to the right or to the left, in order that he may prolong his days in his kingdom, he and his sons, in the midst of Israel.
translation:
  language: ml
  text: അവന്റെ ഹൃദയം തന്റെ സഹോദരന്മാരെക്കാൾ ഉയരാതിരിക്കാനും[a] കൽപ്പനയിൽനിന്ന് വലത്തോട്ടോ ഇടത്തോട്ടോ വ്യതിചലിക്കാതിരിക്കാനും, അവനും അവന്റെ പുത്രന്മാരും ഇസ്രായേലിന്റെ മധ്യേ അവന്റെ രാജത്വത്തിൽ ദീർഘകാലം വാഴേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തന്റെ സഹഇസ്രായേല്യരെക്കാൾ.’ എബ്രായപാഠത്തിൽ ‘തന്റെ സഹോദരന്മാരെക്കാൾ’ എന്നാണ്; ഇത് ഉടമ്പടി-ബന്ധുത്വത്തെ സൂചിപ്പിക്കുന്ന ഭാഷയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבִלְתִּי
  choice: '...ആതിരിക്കാനും'
  rationale: നിഷേധാത്മക ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന എബ്രായ infinitive ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി ഉദ്ദേശ്യബന്ധത്തോടെ അവതരിപ്പിക്കുന്നു.
- source_word: רוּם לְבָבוֹ
  choice: അവന്റെ ഹൃദയം ... ഉയർന്നുപോകുക
  rationale: അഹങ്കാരത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ഹൃദയരൂപകം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: מֵאֶחָיו
  choice: തന്റെ സഹോദരന്മാരെക്കാൾ
  rationale: ഉടമ്പടി-ബന്ധുത്വ ഭാഷയായ ‘സഹോദരന്മാർ’ നിലനിർത്തുകയും താരതമ്യാർഥമുള്ള മുൻപ്രത്യയത്തെ ‘-ക്കാൾ’ എന്നു നൽകുകയും ചെയ്യുന്നു.
- source_word: סוּר מִן הַמִּצְוָה
  choice: കല്പനയിൽനിന്ന് ... വ്യതിചലിക്കുക
  rationale: കല്പിത അനുസരണത്തിൽനിന്നുള്ള മാറിപ്പോകലിനെ സൂചിപ്പിക്കുന്ന ഉടമ്പടി പ്രയോഗം വ്യക്തമായി നൽകുന്നു.
- source_word: יָמִין וּשְׂמֹאול
  choice: വലത്തോട്ടോ ഇടത്തോട്ടോ
  rationale: ഏതു ദിശയിലേക്കുമുള്ള വ്യതിചലനം സൂചിപ്പിക്കുന്ന ഉറവിടരൂപകം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: יַאֲרִיךְ יָמִים עַל מַמְלַכְתּוֹ
  choice: അവന്റെ രാജത്വത്തിൽ ദീർഘകാലം വാഴും
  rationale: വാക്കുതോറുമുള്ള ‘ദിവസങ്ങൾ ദീർഘമാക്കുക’ എന്നതിനു പകരം, രാജഭരണത്തിന്റെ ദൈർഘ്യമെന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; עַל מַמְלַכְתּוֹ രാജസ്ഥാനത്തെ/രാജവാഴ്ചയെ സംബന്ധിക്കുന്നതായി ഗ്രഹിക്കുന്നു.
- source_word: הוּא וּבָנָיו
  choice: അവനും അവന്റെ പുത്രന്മാരും
  rationale: രാജവംശാവകാശത്തിന്റെ പ്രത്യേകത സൂചിപ്പിക്കുന്ന ‘പുത്രന്മാർ’ എന്ന പദം പൊതുവായ ‘സന്തതി’യായി വിപുലീകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: בְּקֶרֶב יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ മധ്യേ
  rationale: ഉടമ്പടി സമൂഹത്തിന്റെ നടുവിൽ എന്ന എബ്രായ സ്ഥാനരൂപകം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: രാജാവിനോടുള്ള നിയമത്തിലെ ലിംഗസൂചക ബന്ധുത്വഭാഷ
  choice: സഹോദരന്മാർ
  alternative: സഹഇസ്രായേല്യർ
  rationale: ഉറവിടത്തിലെ אֶחָיו എന്ന പദം അക്ഷരാർഥത്തിൽ ‘അവന്റെ സഹോദരന്മാർ’ എന്നാണ്; അതിന്റെ ഉടമ്പടി-ബന്ധുത്വഭാവം മുഖ്യവാചകത്തിൽ നിലനിർത്തി വിശാലമായ സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: രാജവംശപരമായ തുടർച്ച
  choice: അവനും അവന്റെ പുത്രന്മാരും
  alternative: അവനും അവന്റെ സന്തതിയും
  rationale: ഉറവിടം വ്യക്തമായി ‘പുത്രന്മാർ’ എന്നു പറയുന്നു; ‘സന്തതി’ എന്നു പൊതുവാക്കുന്നത് വ്യാഖ്യാനാത്മക വിപുലീകരണമാകും.
- issue: יַאֲרִיךְ יָמִים എന്നതിലെ ഉദ്ദേശ്യം/ഫലം
  choice: അങ്ങനെ ... ദീർഘകാലം വാഴും
  alternative: അവൻ തന്റെ ദിവസങ്ങൾ ദീർഘമാക്കേണ്ടതിന്
  rationale: לְמַעַן ഉദ്ദേശ്യമോ പ്രതീക്ഷിത ഫലമോ സൂചിപ്പിക്കാം. മലയാളത്തിൽ ഫലബന്ധം സ്വാഭാവികമായി നൽകിയെങ്കിലും ഉറവിടത്തിന്റെ ഉറപ്പിനെ അതിരുകടന്ന് ഒരു നിബന്ധനാരഹിത വാഗ്ദാനമാക്കി മാറ്റുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ഹൃദയം ഉയരുക,’ ‘വലത്തോട്ടോ ഇടത്തോട്ടോ’ എന്നീ ഉറവിടരൂപകങ്ങൾ നിലനിർത്തി; രാജഭരണത്തിന്റെ ദൈർഘ്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കി.
