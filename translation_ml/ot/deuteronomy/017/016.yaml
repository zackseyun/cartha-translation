id: DEU.17.16
reference: Deuteronomy 17:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: רַק֮ לֹא יַרְבֶּה לּ֣/וֹ סוּסִים֒ וְ/לֹֽא יָשִׁ֤יב אֶת הָ/עָם֙ מִצְרַ֔יְמָ/ה לְמַ֖עַן הַרְבּ֣וֹת ס֑וּס וַֽ/יהוָה֙ אָמַ֣ר לָ/כֶ֔ם לֹ֣א תֹסִפ֗וּ/ן לָ/שׁ֛וּב בַּ/דֶּ֥רֶךְ הַ/זֶּ֖ה עֽוֹד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/016.yaml
  text: Only[a], he must not multiply horses for himself, nor cause the people to return to Egypt in order to multiply horses, since Yahweh has said to you[c][b], ‘You must never return again by this way.’
translation:
  language: ml
  text: 'എന്നാൽ രാജാവ് തനിക്കുവേണ്ടി കുതിരകളെ പെരുക്കരുത്[a]. കുതിരകളെ പെരുക്കുന്നതിനായി ജനത്തെ ഈജിപ്തിലേക്കു മടക്കിക്കൊണ്ടുപോകരുത്[b]. കാരണം യഹോവ നിങ്ങളോടു പറഞ്ഞിരിക്കുന്നു: “ഈ വഴിയിലൂടെ നിങ്ങൾ ഇനി ഒരിക്കലും മടങ്ങിപ്പോകരുത്.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തനിക്കുവേണ്ടി ധാരാളം കുതിരകളെ സമ്പാദിക്കരുത്.” ഹീബ്രു ക്രിയയ്ക്ക് ‘പെരുക്കുക’ അല്ലെങ്കിൽ ‘വർധിപ്പിക്കുക’ എന്നർഥമുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തോട് അടുത്ത്, “ജനത്തെ ഈജിപ്തിലേക്കു മടങ്ങാൻ ഇടയാക്കരുത്.” ഇവിടെ ക്രിയ കാരകപ്രയോഗത്തിലാണ്.
    reason: lexical_alternative
  - marker: c
    text: 'അക്ഷരാർഥം: “ഈ വഴിയിലൂടെ വീണ്ടും മടങ്ങുന്നതു നിങ്ങൾ തുടരരുത്.” ഇത് “ഇനി ഒരിക്കലും മടങ്ങിപ്പോകരുത്” എന്നർഥമുള്ള ഹീബ്രു പ്രയോഗമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: എന്നാൽ
  rationale: രാജാവിന്റെ അധികാരത്തിന്മേലുള്ള നിയന്ത്രണം അവതരിപ്പിക്കുന്ന വിപരീത-പരിമിതീകരണ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יַרְבֶּה לּוֹ סוּסִים
  choice: തനിക്കുവേണ്ടി കുതിരകളെ പെരുക്കരുത്
  rationale: רבה എന്ന ക്രിയയുടെ ‘വർധിപ്പിക്കുക/പെരുക്കുക’ എന്ന അർഥവും לּוֹയിലെ സ്വലാഭസൂചനയും നിലനിർത്തുന്നു.
- source_word: וְלֹא יָשִׁיב אֶת הָעָם מִצְרַיְמָה
  choice: ജനത്തെ ഈജിപ്തിലേക്കു മടക്കിക്കൊണ്ടുപോകരുത്
  rationale: שוב എന്ന ക്രിയയുടെ കാരകപ്രയോഗം രാജാവ് ജനത്തിന്റെ മടങ്ങിപ്പോക്കിന് കാരണമാകരുതെന്ന വിലക്ക് ആയി പ്രകടമാക്കുന്നു.
- source_word: לְמַעַן הַרְבּוֹת סוּס
  choice: കുതിരകളെ പെരുക്കുന്നതിനായി
  rationale: ഉദ്ദേശ്യം വ്യക്തമാക്കുകയും മുമ്പത്തെ רבה എന്ന മൂലപദവുമായുള്ള ആവർത്തനബന്ധം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: וַיהוָה
  choice: യഹോവ
  rationale: ഹീബ്രു പാഠത്തിലെ ദൈവനാമമായ יהוהയെ പേരായി നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: לֹא תֹסִפוּן לָשׁוּב ... עוֹד
  choice: ഇനി ഒരിക്കലും മടങ്ങിപ്പോകരുത്
  rationale: ‘വീണ്ടും മടങ്ങാൻ കൂട്ടരുത്’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ശക്തമായ ആവർത്തനനിഷേധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בַּדֶּרֶךְ הַזֶּה
  choice: ഈ വഴിയിലൂടെ
  rationale: דֶּרֶךְ എന്നതിന്റെ വഴി/മാർഗം എന്ന അർഥവും בְּ എന്നതിന്റെ മാർഗസൂചനയും വ്യക്തമായി സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം പൊതുവായ സ്ഥാനനാമമല്ല, നിയമബന്ധത്തിലെ ദൈവനാമം തന്നെയാണ് ഉപയോഗിക്കുന്നത്; അതിനാൽ പേരിന്റെ സ്വഭാവം നിലനിർത്തുന്നു.
- issue: ഈജിപ്തിലേക്കുള്ള മടക്കത്തിന്റെ കാരകത്വം
  choice: രാജാവ് ജനത്തെ മടക്കിക്കൊണ്ടുപോകരുത്
  alternative: ജനം ഈജിപ്തിലേക്കു മടങ്ങരുത്
  rationale: הֵשִׁיב എന്ന ഹിഫീൽ രൂപം രാജാവിന്മേൽ ചുമത്തുന്ന കാരകവിലക്ക് സംരക്ഷിക്കുന്നു; പൊതുവായ വിലക്കായി മാറ്റുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, പൊതുവായ വായനക്കാർക്കു മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. ‘കുതിരകളെ പെരുക്കുക’ എന്ന ആവർത്തനം മൂലപാഠത്തിലെ പദബന്ധം നിലനിർത്താനായി ഉദ്ദേശപൂർവം സംരക്ഷിച്ചു; കാരകക്രിയയുടെ അർഥം മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും വ്യക്തമാക്കി.
