  to: നിന്റെ ഇടയിൽ, നിന്റെ ദൈവമായ യഹോവ നിനക്കു തരുന്ന നിന്റെ കവാടങ്ങളിലൊന്നിൽ[a], നിന്റെ ദൈവമായ യഹോവയുടെ ദൃഷ്ടിയിൽ തിന്മ പ്രവർത്തിച്ചുകൊണ്ട് അവന്റെ ഉടമ്പടി ലംഘിക്കുന്ന ഒരു പുരുഷനെയോ സ്ത്രീയെയോ കണ്ടെത്തിയാൽ,
  rationale: എബ്രായത്തിലെ സ്ഥലസൂചകമായ ‘കവാടങ്ങളിലൊന്നിൽ’ മുഖ്യപാഠത്തിൽ പുനഃസ്ഥാപിച്ചു; അതിന്റെ പട്ടണം/നഗരം എന്ന സന്ദർഭാനുസൃത ബദൽ അർഥം അടിക്കുറിപ്പിൽ നൽകി. ‘യഹോവ, നിന്റെ ദൈവം’ എന്ന പൂർണ പ്രയോഗം ദൃഷ്ടി-വാക്യത്തിലും പുനഃസ്ഥാപിച്ചു. ലംഘനത്തെ പൊതുവായ ഉടമ്പടിലംഘനമായി തന്നെ നിലനിർത്തുന്നു; പ്രത്യേക കുറ്റമോ ദൈവശാസ്ത്രവ്യാഖ്യാനമോ ചേർത്തിട്ടില്ല.
