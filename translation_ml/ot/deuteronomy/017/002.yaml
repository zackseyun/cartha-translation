source:
  edition: WLC
  text: כִּֽי יִמָּצֵ֤א בְ/קִרְבְּ/ךָ֙ בְּ/אַחַ֣ד שְׁעָרֶ֔י/ךָ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֣ן לָ֑/ךְ אִ֣ישׁ אוֹ אִשָּׁ֗ה אֲשֶׁ֨ר יַעֲשֶׂ֧ה אֶת הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָֽה אֱלֹהֶ֖י/ךָ לַ/עֲבֹ֥ר בְּרִיתֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/002.yaml
  text: If there is found among you[a], within one of your gates that Yahweh your God is giving you, a man or a woman who does what is evil in the eyes of Yahweh your God by transgressing his covenant[b],
translation:
  language: ml
  text: നിന്റെ ഇടയിൽ, നിന്റെ ദൈവമായ യഹോവ നിനക്കു തരുന്ന നിന്റെ കവാടങ്ങളിലൊന്നിൽ[a], നിന്റെ ദൈവമായ യഹോവയുടെ ദൃഷ്ടിയിൽ തിന്മ പ്രവർത്തിച്ചുകൊണ്ട് അവന്റെ ഉടമ്പടി ലംഘിക്കുന്ന ഒരു പുരുഷനെയോ സ്ത്രീയെയോ കണ്ടെത്തിയാൽ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, ‘നിന്റെ പട്ടണങ്ങളിലൊന്നിൽ’ അല്ലെങ്കിൽ ‘നിന്റെ നഗരങ്ങളിലൊന്നിൽ’; അക്ഷരാർഥം: ‘നിന്റെ കവാടങ്ങളിലൊന്നിൽ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: —എങ്കിൽ / കണ്ടെത്തിയാൽ
  rationale: ഇവിടെ നിയമപരമായ ഒരു വ്യവസ്ഥയുടെ പൂർവപക്ഷമാണ് അവതരിപ്പിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികമായി വാക്യാവസാനത്തിലെ ‘കണ്ടെത്തിയാൽ’ അത് പ്രകടമാക്കുന്നു.
- source_word: יִמָּצֵא
  choice: കണ്ടെത്തിയാൽ
  rationale: מצא എന്ന ധാതുവിന്റെ നിഫാൽ രൂപത്തിലുള്ള നിഷ്ക്രിയ ആശയം മലയാളത്തിലെ നിയമശൈലിക്ക് സ്വാഭാവികമായ വ്യവസ്ഥാരൂപത്തിൽ നൽകുന്നു.
- source_word: בְּקִרְבְּךָ
  choice: നിന്റെ ഇടയിൽ
  rationale: ഉടമ്പടിസമൂഹത്തിനുള്ളിലെ സാന്നിധ്യമാണ് സൂചിപ്പിക്കുന്നത്; ഏകവചന അഭിസംബോധനയും നിലനിർത്തുന്നു.
- source_word: בְּאַחַד שְׁעָרֶיךָ
  choice: പട്ടണങ്ങളിലൊന്നിൽ
  rationale: അക്ഷരാർഥം ‘നിന്റെ കവാടങ്ങളിലൊന്നിൽ’ എന്നാണ്; ആവർത്തനപുസ്തകത്തിൽ ‘കവാടങ്ങൾ’ പട്ടണത്തെയോ അതിന്റെ അധികാരപരിധിയെയോ സൂചിപ്പിക്കുന്ന ലക്ഷണപ്രയോഗമായതിനാൽ മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായ അർഥം നൽകി, അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ
  choice: നിന്റെ ദൈവമായ യഹോവ നിനക്കു തരുന്ന
  rationale: നിലവിലുള്ള ദാനപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന കർത്തൃവാചകത്തിന്റെ ശക്തിയും ഉടമ്പടിസൂത്രവും നിലനിർത്തുന്നു.
- source_word: אִישׁ אוֹ אִשָּׁה
  choice: ഒരു പുരുഷനെയോ സ്ത്രീയെയോ
  rationale: എബ്രായത്തിലെ ലിംഗവ്യക്തമായ ജോടിയെ പൊതുവായ ‘ഒരാളെ’ എന്നാക്കി ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: אֲשֶׁר יַעֲשֶׂה אֶת־הָרַע
  choice: തിന്മയായതു ചെയ്തുകൊണ്ട്
  rationale: ‘തിന്മ ചെയ്യുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ധാർമിക ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְּעֵינֵי יְהוָה אֱלֹהֶיךָ
  choice: യഹോവയുടെ ദൃഷ്ടിയിൽ
  rationale: ‘യഹോവയുടെ കണ്ണുകളിൽ’ എന്ന എബ്രായ മൂലരൂപത്തിലെ വിലയിരുത്തൽപ്രയോഗം മലയാളത്തിലെ പതിവായ ‘ദൃഷ്ടിയിൽ’ എന്ന രൂപത്തിൽ നൽകുന്നു.
- source_word: לַעֲבֹר בְּרִיתוֹ
  choice: അവന്റെ ഉടമ്പടി ലംഘിക്കുന്ന
  rationale: ഉടമ്പടിക്കെതിരായ അതിക്രമം സൂചിപ്പിക്കുന്ന עבר എന്ന പദത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; അടുത്ത വാക്യത്തിലെ പ്രത്യേക കുറ്റം മുൻകൂട്ടി ചേർക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റണിനെ ഒരു പദവിയായി മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: ഉടമ്പടിലംഘനത്തിന്റെ സ്വഭാവം
  choice: ‘അവന്റെ ഉടമ്പടി ലംഘിക്കുന്ന’ എന്നു പൊതുവായി നിലനിർത്തി.
  alternative: ‘അവന്റെ ഉടമ്പടി തകർക്കുന്ന’ അല്ലെങ്കിൽ ‘അവന്റെ ഉടമ്പടി ലംഘിക്കേണ്ടതിന്’
  rationale: ഈ വാക്യം ഉടമ്പടിലംഘനത്തെ പൊതുവായി പ്രസ്താവിക്കുകയും തുടർന്നുള്ള വാക്യം പ്രത്യേക കുറ്റം വ്യക്തമാക്കുകയും ചെയ്യുന്നു. അതിനാൽ ഇവിടെ ഒരു പ്രത്യേക കല്പനയെയോ വ്യവസ്ഥിത ദൈവശാസ്ത്ര വ്യാഖ്യാനത്തെയോ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിയമപരമായ വ്യവസ്ഥ സൂചിപ്പിക്കാൻ വാക്യം ‘കണ്ടെത്തിയാൽ’ എന്നു അവസാനിപ്പിക്കുന്നു; വാക്യം അടുത്ത ഭാഗത്തേക്ക് തുടരുന്നതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തി. ‘നീ/നിന്റെ’ എന്ന ഏകവചന ഉടമ്പടി അഭിസംബോധന സംരക്ഷിച്ചു.
