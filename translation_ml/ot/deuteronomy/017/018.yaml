source:
  edition: WLC
  text: וְ/הָיָ֣ה כְ/שִׁבְתּ֔/וֹ עַ֖ל כִּסֵּ֣א מַמְלַכְתּ֑/וֹ וְ/כָ֨תַב ל֜/וֹ אֶת מִשְׁנֵ֨ה הַ/תּוֹרָ֤ה הַ/זֹּאת֙ עַל סֵ֔פֶר מִ/לִּ/פְנֵ֥י הַ/כֹּהֲנִ֖ים הַ/לְוִיִּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/018.yaml
  text: And when he sits on the throne of his kingdom[a], he shall write for himself in a book a copy of this law[b], from before the Levitical priests.
translation:
  language: ml
  text: അവൻ തന്റെ രാജ്യത്തിന്റെ സിംഹാസനത്തിൽ ഇരിക്കുമ്പോൾ, ലേവ്യരായ പുരോഹിതന്മാരുടെ[b] മുമ്പിൽനിന്ന്[a] ഈ നിയമത്തിന്റെ ഒരു പകർപ്പ് ഒരു ഗ്രന്ഥച്ചുരുളിൽ തനിക്കായി എഴുതണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘ലേവ്യരായ പുരോഹിതന്മാരുടെ മുമ്പിൽനിന്ന്.’ പുരോഹിതരുടെ സംരക്ഷണത്തിൽ ഉണ്ടായിരുന്ന അംഗീകൃത മാതൃകയിൽനിന്ന് പകർപ്പെടുക്കണമെന്നായിരിക്കാം അർഥം.
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രായിയിൽ ‘പുരോഹിതന്മാർ, ലേവ്യർ’; ‘ലേവ്യരായ പുരോഹിതന്മാർ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כְשִׁבְתּוֹ
  choice: അവൻ ... ഇരിക്കുമ്പോൾ
  rationale: വാക്യാരംഭത്തിലെ നിയമപരമായ സാഹചര്യവാക്യത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ കാലസൂചക ഘടനയായി അവതരിപ്പിക്കുന്നു.
- source_word: עַל כִּסֵּא מַמְלַכְתּוֹ
  choice: തന്റെ രാജ്യത്തിന്റെ സിംഹാസനത്തിൽ
  rationale: ‘സിംഹാസനം’ എന്ന ദൃശ്യമായ രാജകീയ രൂപകവും ‘തന്റെ രാജ്യം’ എന്ന ബന്ധവും നിലനിർത്തുന്നു.
- source_word: וְכָתַב לוֹ
  choice: തനിക്കായി എഴുതണം
  rationale: לוֹ എന്നത് രാജാവിന്റെ സ്വന്തം ഉപയോഗത്തിനായുള്ള എഴുത്തിനെ സൂചിപ്പിക്കുന്നു; നിയമപരമായ ബാധ്യത ‘എഴുതണം’ എന്നു സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: מִשְׁנֵה
  choice: ഒരു പകർപ്പ്
  rationale: സന്ദർഭത്തിൽ ഇത് ആവർത്തനം എന്ന അമൂർത്ത ആശയത്തേക്കാൾ ഒരു പ്രതി അഥവാ പകർപ്പിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: ഈ നിയമം
  rationale: രാജാവിനുള്ള ഈ നിയമനിർദേശത്തിന്റെ ഉടൻസന്ദർഭത്തിൽ תּוֹרָה നിയമബോധനസമുച്ചയത്തെ സൂചിപ്പിക്കുന്നു; ‘നിയമം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും വിഭാഗീയ സൂചനകളില്ലാത്തതുമാണ്.
- source_word: עַל סֵפֶר
  choice: ഒരു ഗ്രന്ഥച്ചുരുളിൽ
  rationale: סֵפֶר എഴുതപ്പെട്ട രേഖയെയോ ഗ്രന്ഥത്തെയോ സൂചിപ്പിക്കുന്നു; പുരാതന ഭൗതികരൂപം വ്യക്തമാക്കാൻ ‘ഗ്രന്ഥച്ചുരുൾ’ ഉപയോഗിക്കുന്നു.
- source_word: מִלִּפְנֵי
  choice: പക്കലുള്ള മാതൃകയിൽനിന്ന്
  rationale: അക്ഷരാർഥം ‘മുമ്പിൽനിന്ന്/സന്നിധിയിൽനിന്ന്’ എന്നാണ്; ഇവിടെ പുരോഹിതരുടെ മുമ്പിലോ സംരക്ഷണത്തിലോ ഉണ്ടായിരുന്ന മാതൃകയിൽനിന്ന് പകർപ്പെടുക്കുക എന്ന സാധ്യതയേറിയ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു, എന്നാൽ വ്യാഖ്യാനഘടകം അടിക്കുറിപ്പിൽ തുറന്നുപറയുന്നു.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: ലേവ്യരായ പുരോഹിതന്മാർ
  rationale: ഹീബ്രായിയിലെ അനുബന്ധപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ വിശേഷണഘടനയായി നൽകുന്നു; കൂടുതൽ അക്ഷരാർഥമായ രൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: രാജാവു പകർപ്പെടുക്കേണ്ട תּוֹרָהയുടെ വ്യാപ്തി
  choice: ഈ നിയമം
  alternative: ഈ പ്രബോധനം; ഈ തോറാ
  rationale: ഉടൻസന്ദർഭം ഉടമ്പടിസംബന്ധമായ നിയമബോധനമാണ്. ‘നിയമം’ അതിനെ വ്യക്തമാക്കുന്നു; എന്നാൽ വാക്യം പറയുന്നതിലുപരി ഒരു വിശാല കാനോനിക അവകാശവാദം ചേർക്കുന്നില്ല.
- issue: പുരോഹിതരുടെ മുമ്പിൽനിന്ന് എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: പുരോഹിതരുടെ പക്കലുള്ള മാതൃകയിൽനിന്ന്
  alternative: പുരോഹിതരുടെ മുമ്പിൽനിന്ന്; പുരോഹിതരുടെ സന്നിധിയിൽവെച്ച്
  rationale: മൂലപാഠം സ്ഥലം, സാന്നിധ്യം, സംരക്ഷണം എന്നിവയ്ക്കിടയിൽ ഒരു പരിധിവരെ തുറന്നിരിക്കുന്നു. സന്ദർഭത്തിൽ പുരോഹിതരുടെ പക്കലുള്ള അംഗീകൃത മാതൃകയിൽനിന്ന് പകർപ്പെടുക്കുന്നതാണ് സാധ്യതയേറിയത്; ഈ വ്യാഖ്യാനം അടിക്കുറിപ്പിലൂടെ സുതാര്യമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമനിർദേശ ശൈലി. ‘ഗ്രന്ഥച്ചുരുൾ’ പുരാതന എഴുത്തുമാധ്യമം വ്യക്തമാക്കുന്നു. മുഖ്യപാഠം വായനാസൗകര്യം മുൻനിർത്തുമ്പോഴും מִלִּפְנֵי എന്നതിലെ യഥാർഥ വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
