- from: അവൻ തന്റെ രാജ്യത്തിന്റെ സിംഹാസനത്തിൽ ഇരിക്കുമ്പോൾ, ലേവ്യരായ പുരോഹിതന്മാരുടെ[b] പക്കലുള്ള മാതൃകയിൽനിന്ന്[a] ഈ നിയമത്തിന്റെ ഒരു പകർപ്പ് ഒരു ഗ്രന്ഥച്ചുരുളിൽ തനിക്കായി എഴുതണം.
