source:
  edition: WLC
  text: וּ/בָאתָ֗ אֶל הַ/כֹּהֲנִים֙ הַ/לְוִיִּ֔ם וְ/אֶל הַ/שֹּׁפֵ֔ט אֲשֶׁ֥ר יִהְיֶ֖ה בַּ/יָּמִ֣ים הָ/הֵ֑ם וְ/דָרַשְׁתָּ֙ וְ/הִגִּ֣ידוּ לְ/ךָ֔ אֵ֖ת דְּבַ֥ר הַ/מִּשְׁפָּֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/009.yaml
  text: And you shall come to the Levitical priests and to the judge who is in office in those days[a], and you shall inquire, and they shall declare to you the decision in the case.
translation:
  language: ml
  text: നീ ലേവ്യരായ പുരോഹിതന്മാരുടെയും അക്കാലത്ത് പദവിയിലിരിക്കുന്ന ന്യായാധിപന്റെയും അടുക്കൽ ചെന്നു ചോദിച്ചറിയണം; അവർ നിനക്കു കേസിലെ വിധി[a] അറിയിച്ചുതരും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, “ന്യായവിധിയുടെ വാക്ക്.” അധികാരപൂർവമായ ന്യായതീർപ്പിനെയാണ് ഈ എബ്രായപ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתָ
  choice: അടുക്കൽ ചെന്നു
  rationale: നിയമനിർദേശത്തിലെ ഈ ക്രിയയ്ക്ക് ആജ്ഞാത്മകമായ ഭാവിയർഥമുണ്ട്; അധികാരപ്പെട്ട ന്യായവേദിയുടെ അടുക്കലേക്കുള്ള സഞ്ചാരം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: ലേവ്യരായ പുരോഹിതന്മാർ
  rationale: പുരോഹിതന്മാർ ലേവി ഗോത്രത്തിൽപ്പെട്ടവരാണെന്ന വിശേഷണബന്ധം നിലനിർത്തുന്നു; എല്ലാ ലേവ്യരും പുരോഹിതന്മാരാണെന്ന ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: הַשֹּׁפֵט
  choice: ന്യായാധിപൻ
  rationale: നിയമപരമായ ഔദ്യോഗികനെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള, മാന്യമായ ആധുനിക മലയാളപദം.
- source_word: אֲשֶׁר יִהְיֶה בַּיָּמִים הָהֵם
  choice: അക്കാലത്ത് പദവിയിലിരിക്കുന്ന
  rationale: ഒരു പ്രത്യേക വ്യക്തിയെക്കാൾ അന്നത്തെ ഔദ്യോഗിക പദവിവാഹകനെ സൂചിപ്പിക്കുന്ന സ്ഥാപനപരമായ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: וְדָרַשְׁתָּ
  choice: ചോദിച്ചറിയണം
  rationale: ഈ ന്യായപരിസരത്തിൽ അധികാരപൂർവമായ നിർദേശമോ വിധിയോ തേടുന്നതിനെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וְהִגִּידוּ לְךָ
  choice: അവർ നിനക്കു … അറിയിച്ചുതരും
  rationale: ഔദ്യോഗിക തീരുമാനം വ്യക്തമായി അറിയിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ബഹുവചന കർത്താവും നിലനിർത്തുന്നു.
- source_word: דְּבַר הַמִּשְׁפָּט
  choice: കേസിലെ വിധി
  rationale: അക്ഷരാർഥത്തിലെ ‘ന്യായവിധിയുടെ വാക്ക്/കാര്യം’ എന്ന പ്രയോഗത്തിന്റെ സന്ദർഭോചിതമായ അർഥം ആധുനിക നിയമഭാഷയിൽ നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വ്യക്തവുമായ നിയമശൈലി ഉപയോഗിച്ചു. എബ്രായത്തിലെ ഏകവചന അഭിസംബോധന ‘നീ/നിനക്കു’ എന്നും വിധി അറിയിക്കുന്നവരുടെ ബഹുവചനം ‘അവർ’ എന്നും നിലനിർത്തി. അടിക്കുറിപ്പ് സൂചകം അതു വിശദീകരിക്കുന്ന ‘വിധി’ എന്ന പദത്തിനുശേഷം വെച്ചു.
