id: DEU.17.1
reference: Deuteronomy 17:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹא תִזְבַּח֩ לַ/יהוָ֨ה אֱלֹהֶ֜י/ךָ שׁ֣וֹר וָ/שֶׂ֗ה אֲשֶׁ֨ר יִהְיֶ֥ה ב/וֹ֙ מ֔וּם כֹּ֖ל דָּבָ֣ר רָ֑ע כִּ֧י תוֹעֲבַ֛ת יְהוָ֥ה אֱלֹהֶ֖י/ךָ הֽוּא־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/001.yaml
  text: You shall not sacrifice to Yahweh your God an ox or a sheep that has in it a blemish[a], any bad thing, for that is an abomination to Yahweh your God.
translation:
  language: ml
  text: നിന്റെ ദൈവമായ യഹോവയ്ക്ക്, ഊനമോ മറ്റേതെങ്കിലും ദോഷമോ ഉള്ള ഒരു കാളയെയോ ചെമ്മരിയാടിനെയോ[a] നീ ബലിയർപ്പിക്കരുത്; അത് നിന്റെ ദൈവമായ യഹോവയ്ക്ക് വെറുപ്പുളവാക്കുന്നതാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെയുള്ള ഹീബ്രു പദം ചെമ്മരിയാടിനെയോ കോലാടിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִזְבַּח
  choice: ബലിയർപ്പിക്കരുത്
  rationale: യാഗസന്ദർഭത്തിൽ זבח മൃഗത്തെ വെറുതെ കൊല്ലുന്നതല്ല, ദൈവത്തിന് ബലിയായി അർപ്പിക്കുന്നതിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്ക്
  rationale: ഹീബ്രു ദൈവനാമമായ יְהוָה വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- source_word: שׁוֹר
  choice: കാള
  rationale: യാഗമൃഗത്തെ സൂചിപ്പിക്കുന്ന ഏകവചനമായ שׁוֹר എന്ന പദത്തിന് സ്വാഭാവികവും അതിയായി ലിംഗവിശദീകരണം നടത്താത്തതുമായ മലയാളരൂപം.
- source_word: שֶׂה
  choice: ചെമ്മരിയാട്
  rationale: വായനാസൗകര്യത്തിനായി പരിചിതമായ മൃഗനാമം ഉപയോഗിച്ചു; ഹീബ്രു പദത്തിന് ചെമ്മരിയാടിനെയും കോലാടിനെയും ഉൾക്കൊള്ളാവുന്ന വിശാലമായ അർഥമുണ്ടെന്നത് അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: מוּם
  choice: ഊനം
  rationale: യാഗത്തിന് അയോഗ്യമാക്കുന്ന ശാരീരിക ന്യൂനതയെ സംക്ഷിപ്തമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: כֹּל דָּבָר רָע
  choice: മറ്റേതെങ്കിലും ദോഷം
  rationale: ‘ഏതെങ്കിലും മോശമായ കാര്യം’ എന്ന വിശാലമായ ഹീബ്രു പ്രയോഗത്തെ, മുൻപുള്ള ‘ഊനം’ എന്നതിനെ വിശദീകരിക്കുന്ന സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: תוֹעֲבַת
  choice: വെറുപ്പുളവാക്കുന്നത്
  rationale: ദൈവത്തിന് അസഹ്യവും അംഗീകരിക്കാനാവാത്തതുമായ കാര്യം എന്ന പദത്തിന്റെ ശക്തി, ആധുനിക വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഭാഷയിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള വ്യക്തിനാമരൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: תוֹעֵבָה എന്ന പദത്തിന്റെ ആചാരപരവും ധാർമ്മികവുമായ ശക്തി
  choice: വെറുപ്പുളവാക്കുന്നത്
  alternative: മ്ലേച്ഛത / അറപ്പായ കാര്യം
  rationale: ഈ സന്ദർഭത്തിൽ നിരോധിത യാഗം ദൈവത്തിന് തീർത്തും അസ്വീകാര്യമാണെന്ന ശക്തി നിലനിർത്തുന്നു; എന്നാൽ പദത്തെ ധാർമ്മിക അർഥത്തിൽ മാത്രം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, നിയമവാക്യത്തിന് യോജിച്ച ഗൗരവവും വ്യക്തതയും പാലിച്ചു. ‘ഊനമോ മറ്റേതെങ്കിലും ദോഷമോ’ എന്ന ഘടന മൂലപാഠത്തിലെ വിശദീകരണസ്വഭാവം സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
