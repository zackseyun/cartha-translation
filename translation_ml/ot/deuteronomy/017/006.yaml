  terminology: ‘സാക്ഷിമൊഴി,’ ‘വധിക്കപ്പെടണം,’ ‘വധിക്കരുത്’ എന്നിവ നിയമസന്ദർഭത്തിനു യോജിക്കുന്നു. ‘മരിക്കേണ്ടവൻ’ മൂലപാഠത്തിന്റെ എലിപ്റ്റിക്കൽ പ്രയോഗം സംരക്ഷിക്കുകയും അന്തിമ കുറ്റവിധി അല്ലെങ്കിൽ ധാർമിക അർഹത മുൻകൂട്ടി സ്ഥാപിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
