  to: രണ്ടു സാക്ഷികളുടെയോ മൂന്നു സാക്ഷികളുടെയോ സാക്ഷിമൊഴിപ്രകാരം[a], മരിക്കേണ്ടവൻ[b] വധിക്കപ്പെടണം. ഒരു സാക്ഷിയുടെ മൊഴിപ്രകാരം അവൻ വധിക്കപ്പെടരുത്.
