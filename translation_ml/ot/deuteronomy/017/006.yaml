id: DEU.17.6
reference: Deuteronomy 17:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: עַל פִּ֣י שְׁנַ֣יִם עֵדִ֗ים א֛וֹ שְׁלֹשָׁ֥ה עֵדִ֖ים יוּמַ֣ת הַ/מֵּ֑ת לֹ֣א יוּמַ֔ת עַל פִּ֖י עֵ֥ד אֶחָֽד־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/006.yaml
  text: On the testimony of two witnesses or three witnesses[a], the one to die shall be put to death[b]; he shall not be put to death on the testimony of one witness.
translation:
  language: ml
  text: രണ്ടു സാക്ഷികളുടെയോ മൂന്നു സാക്ഷികളുടെയോ സാക്ഷിമൊഴിപ്രകാരം[a], മരിക്കേണ്ടവൻ[b] വധിക്കപ്പെടണം. ഒരു സാക്ഷിയുടെ മൊഴിപ്രകാരം അവൻ വധിക്കപ്പെടരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘രണ്ടു സാക്ഷികളുടെ വായിന്മേലോ മൂന്നു സാക്ഷികളുടെ വായിന്മേലോ.’ ഈ ഹീബ്രു ശൈലി നിയമപരമായ സാക്ഷിമൊഴിയോ തെളിവോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘മരണത്തിന് അർഹനായവൻ’ എന്നും പരിഭാഷപ്പെടുത്താം; അതായത്, വധശിക്ഷയ്ക്കു ബാധ്യസ്ഥനായ വ്യക്തി.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל־פִּי
  choice: സാക്ഷ്യം അനുസരിച്ച്
  rationale: അക്ഷരാർഥത്തിൽ ‘വായിന്മേൽ’ എന്നാണെങ്കിലും, നിയമപരമായ സന്ദർഭത്തിൽ സാക്ഷിമൊഴി അഥവാ തെളിവ് എന്ന ഹീബ്രു പ്രയോഗാർത്ഥമാണ്. മലയാളത്തിൽ ‘സാക്ഷ്യം അനുസരിച്ച്’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: שְׁנַיִם עֵדִים ... שְׁלֹשָׁה עֵדִים
  choice: രണ്ടു സാക്ഷികളുടെ സാക്ഷ്യമോ മൂന്നു സാക്ഷികളുടെ സാക്ഷ്യമോ
  rationale: രണ്ടു സംഖ്യകൾക്കു ശേഷവും ‘സാക്ഷികൾ’ ആവർത്തിക്കുന്ന മൂലപാഠത്തിന്റെ ഔപചാരിക നിയമശൈലിയും രണ്ടു ബദൽ സാക്ഷ്യനിലകളും നിലനിർത്തുന്നു.
- source_word: יוּמַת
  choice: വധിക്കണം
  rationale: מות എന്ന ക്രിയയുടെ ഹോഫാൽ രൂപം വെറും ‘മരിക്കുക’ എന്നല്ല, കാരണവാചക-കർമണി അർഥത്തിൽ ‘മരണത്തിന് വിധേയനാക്കുക/വധിക്കുക’ എന്നാണ്. നിയമപരമായ വധശിക്ഷ ഇവിടെ വ്യക്തമാകുന്നു.
- source_word: הַמֵּת
  choice: മരണത്തിന് അർഹനായവൻ
  rationale: നിർദ്ദിഷ്ട ആർട്ടിക്കിളോടുകൂടിയ കൃദന്തരൂപം സന്ദർഭത്തിൽ വധശിക്ഷയ്ക്കു ബാധ്യസ്ഥനായ വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; ഇതിനകം മരിച്ച ഒരാളെ അല്ല. ‘ശിക്ഷിക്കപ്പെട്ടവൻ’ എന്ന് പറയുന്നത് അന്തിമ വിധി മൂലപാഠത്തേക്കാൾ വ്യക്തമായി മുൻകൂട്ടി നിശ്ചയിക്കുന്നതിനാൽ ഒഴിവാക്കി.
- source_word: לֹא יוּמַת
  choice: വധിക്കരുത്
  rationale: അതേ ക്രിയയോടുള്ള നിഷേധം നിയമപരമായ വിലക്ക് അറിയിക്കുന്നു. മലയാളത്തിലെ ‘അരുത്’ നിർബന്ധാത്മക നിരോധനം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: עֵד אֶחָד
  choice: ഒരു സാക്ഷി
  rationale: ഏകവചന പ്രയോഗത്തിന്റെ നേരിട്ടുള്ള പരിഭാഷയാണ്; മുമ്പുള്ള രണ്ടു/മൂന്നു സാക്ഷികളോടുള്ള സമാന്തരതയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: വധശിക്ഷാസംബന്ധിയായ നിയമത്തിൽ הַמֵּת എന്നതിന്റെ സൂചനയും അർഥബലവും
  choice: വധശിക്ഷയ്ക്കു ബാധ്യസ്ഥനായ പ്രതിയെ സൂചിപ്പിക്കുന്ന ‘മരണത്തിന് അർഹനായവൻ’
  alternative: ‘മരണത്തിന് വിധിക്കപ്പെട്ടവൻ’ അല്ലെങ്കിൽ അക്ഷരാർഥമായി തെറ്റിദ്ധരിക്കാവുന്ന ‘മരിച്ചവൻ’
  rationale: ഈ വാക്യം വധശിക്ഷ നടപ്പാക്കാനുള്ള സാക്ഷ്യനിലവാരം നിയന്ത്രിക്കുന്നു. ‘മരിച്ചവൻ’ സന്ദർഭത്തിനു ചേരുന്നില്ല; ‘മരണത്തിന് വിധിക്കപ്പെട്ടവൻ’ അന്തിമ നിയമവിധി ഇതിനകം ഉണ്ടായെന്ന ആശയം കൂടുതൽ ശക്തമായി ചേർക്കുന്നു. തിരഞ്ഞെടുത്ത പ്രയോഗം ബാധ്യത വ്യക്തമാക്കുമ്പോഴും മൂലത്തിലെ സംക്ഷിപ്തതയും നിയമപരമായ പിരിമുറുക്കവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണമായ മലയാള നിയമശൈലി ഉപയോഗിച്ചു. ‘വധിക്കണം/വധിക്കരുത്’ എന്ന സമാന്തരത മൂലപാഠത്തിലെ ആവർത്തനവും നിർദേശ-നിരോധന ഘടനയും നിലനിർത്തുന്നു. സാക്ഷികളുടെ ആവർത്തനം ചുരുക്കാതെ ഔപചാരികത സംരക്ഷിച്ചു.
