id: DEU.31.12
reference: Deuteronomy 31:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הַקְהֵ֣ל אֶת הָ/עָ֗ם הָֽ/אֲנָשִׁ֤ים וְ/הַ/נָּשִׁים֙ וְ/הַ/טַּ֔ף וְ/גֵרְ/ךָ֖ אֲשֶׁ֣ר בִּ/שְׁעָרֶ֑י/ךָ לְמַ֨עַן יִשְׁמְע֜וּ וּ/לְמַ֣עַן יִלְמְד֗וּ וְ/יָֽרְאוּ֙ אֶת יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וְ/שָֽׁמְר֣וּ לַ/עֲשׂ֔וֹת אֶת כָּל דִּבְרֵ֖י הַ/תּוֹרָ֥ה הַ/זֹּֽאת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/012.yaml
  text: Assemble the people—the men[a], the women, the little children, and the sojourner within your gates—so that they may hear, and so that they may learn and fear Yahweh your God[d][c][b], and be careful to do all the words of this law.
translation:
  language: ml
  text: ജനത്തെ—പുരുഷന്മാരെയും സ്ത്രീകളെയും കുഞ്ഞുങ്ങളെയും നിന്റെ പട്ടണങ്ങളിൽ താമസിക്കുന്ന പരദേശിയെയും[a][b]—അവർ കേൾക്കാനും പഠിക്കാനും നിങ്ങളുടെ ദൈവമായ യഹ്‌വെയെ ഭയപ്പെടാനും[c], ഈ നിയമത്തിലെ[d] സകല വചനങ്ങളും പാലിക്കാൻ ശ്രദ്ധിക്കാനും വേണ്ടി ഒരുമിച്ചുകൂട്ടുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘താമസിക്കുന്ന വിദേശി’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം ഇസ്രായേലിന്റെ ഇടയിൽ പാർക്കുന്ന സ്വദേശിയല്ലാത്ത താമസക്കാരനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘നിന്റെ കവാടങ്ങൾക്കുള്ളിലുള്ളവൻ’; ഇവിടെ ‘കവാടങ്ങൾ’ പട്ടണങ്ങളെയോ പ്രാദേശിക സമൂഹത്തെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.
    reason: cultural_note
  - marker: c
    text: ‘നിങ്ങളുടെ ദൈവമായ യഹ്‌വെയെ ഭക്ത്യാദരത്തോടെ ഭയപ്പെടാനും’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായക്രിയയിൽ ഭയം, ആദരവ്, അനുസരണയോടുകൂടിയ ഭക്തി എന്നിവ ഉൾപ്പെടുന്നു.
    reason: lexical_alternative
  - marker: d
    text: ‘ഈ ഉപദേശത്തിലെ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിലെ തോറാ എന്ന പദത്തിന് ‘നിയമം’ എന്നും ‘ഉപദേശം’ എന്നും അർത്ഥമാകാം; ഇവിടെ ഉടമ്പടി പശ്ചാത്തലത്തിൽ ‘നിയമം’ എന്നു നൽകി.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְהֵל
  choice: ഒരുമിച്ചുകൂട്ടുക
  rationale: קהל എന്ന ധാതുവിന്റെ ഹിഫീൽ ആജ്ഞാരൂപം ജനത്തെ ഒരു സഭയായി കൂട്ടിച്ചേർക്കാൻ ആവശ്യപ്പെടുന്നു. ‘ഒരുമിച്ചുകൂട്ടുക’ ആ ആഹ്വാനത്തിന്റെ ഔപചാരികതയും കാരകഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הָעָם
  choice: ജനത്തെ
  rationale: עָם ഇവിടെ ഉടമ്പടിസമൂഹത്തെ മുഴുവനായി സൂചിപ്പിക്കുന്നു; ‘ജനം’ അതിന്റെ ലളിതവും പ്രസക്തവുമായ മലയാളരൂപമാണ്.
- source_word: הָאֲנָשִׁים וְהַנָּשִׁים וְהַטַּף
  choice: പുരുഷന്മാരെയും സ്ത്രീകളെയും കുഞ്ഞുങ്ങളെയും
  rationale: എബ്രായപാഠം വിഭാഗങ്ങളെ വ്യക്തമായി എണ്ണിപ്പറയുന്നു. טַף സാധാരണയായി ചെറിയ കുട്ടികളെയോ ആശ്രിതരായ കുഞ്ഞുങ്ങളെയോ സൂചിപ്പിക്കുന്നതിനാൽ ‘കുഞ്ഞുങ്ങൾ’ എന്നു നൽകി.
- source_word: וְגֵרְךָ
  choice: പരദേശിയെയും
  rationale: גֵר ഇസ്രായേലിന്റെ ഇടയിൽ സ്ഥിരമായി പാർക്കുന്ന സ്വദേശിയല്ലാത്ത വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. ‘പരദേശി’ നിയമ-ഉടമ്പടി പശ്ചാത്തലത്തിന് യോജിക്കുന്ന മലയാളപദമാണ്; അതിന്റെ താമസക്കാരൻ എന്ന പ്രത്യേക അർത്ഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- source_word: אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: നിന്റെ പട്ടണങ്ങളിൽ താമസിക്കുന്ന
  rationale: ‘നിന്റെ കവാടങ്ങൾക്കുള്ളിൽ’ എന്ന എബ്രായ പ്രയോഗം ആവർത്തനപുസ്തകത്തിൽ സാധാരണയായി പട്ടണങ്ങളെയോ പ്രാദേശിക സമൂഹത്തെയോ സൂചിപ്പിക്കുന്നു. അർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകി, പദശഃ രൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: לְמַעַן יִשְׁמְעוּ וּלְמַעַן יִלְמְדוּ
  choice: അവർ കേൾക്കാനും പഠിക്കാനും
  rationale: രണ്ട് ഉദ്ദേശ്യവാക്യങ്ങളിലെ കേൾക്കുക, പഠിക്കുക എന്നീ വ്യത്യസ്ത ഘട്ടങ്ങൾ നിലനിർത്തുന്നു.
- source_word: וְיָרְאוּ אֶת יְהוָה אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവമായ യഹ്‌വെയെ ഭയപ്പെടാനും
  rationale: ירא എന്നത് ഭയവും ഭക്ത്യാദരവും അനുസരണയോടുകൂടിയ വിസ്മയവും ഉൾക്കൊള്ളുന്നു. നേരിട്ടുള്ള ‘ഭയപ്പെടുക’ മുഖ്യപാഠത്തിൽ നൽകി, അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പദവികൊണ്ട് മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരിച്ചു.
- source_word: וְשָׁמְרוּ לַעֲשׂוֹת
  choice: അനുസരിച്ചു പ്രവർത്തിക്കാൻ ശ്രദ്ധിക്കാനും
  rationale: שמר + ക്രിയാനാമം ശ്രദ്ധാപൂർവമായ പാലനവും പ്രവൃത്തിയിലാക്കലും സൂചിപ്പിക്കുന്നു. ഈ രണ്ടു ഘടകങ്ങളും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: כָּל דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: ഈ നിയമത്തിലെ സകല വചനങ്ങളും
  rationale: דִּבְרֵי എന്നതിന്റെ ‘വചനങ്ങൾ/വാക്കുകൾ’ എന്ന വ്യക്തത നിലനിർത്തുന്നു. תּוֹרָהയ്ക്ക് ‘ഉപദേശം’ എന്നും അർത്ഥമുണ്ടെങ്കിലും ഇവിടെ ഉടമ്പടി-നിയമരേഖയുടെ പശ്ചാത്തലത്തിൽ ‘നിയമം’ യോജിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു; ഉച്ചാരണരൂപത്തിലെ പരമ്പരാഗത വ്യത്യാസങ്ങൾ അംഗീകരിക്കുന്നു.
- issue: ירא എന്ന ഉടമ്പടിപദത്തിന്റെ അർത്ഥവ്യാപ്തി
  choice: ഭയപ്പെടുക
  alternative: ഭക്ത്യാദരത്തോടെ ഭയപ്പെടുക / ആദരിക്കുക
  rationale: മൂലക്രിയയിലെ യഥാർഥ ‘ഭയം’ എന്ന ഘടകം മായ്ച്ചുകളയാതെ നിലനിർത്തി; എന്നാൽ അത് വെറും ഭീതിയല്ല, ഭക്ത്യാദരവും അനുസരണവും ഉൾക്കൊള്ളുന്നുവെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- issue: സഭയിലെ വിഭാഗങ്ങളുടെ ലിംഗ-പ്രായ വ്യക്തത
  choice: പുരുഷന്മാർ, സ്ത്രീകൾ, കുഞ്ഞുങ്ങൾ
  alternative: എല്ലാ ജനവും
  rationale: എബ്രായപാഠം ഈ വിഭാഗങ്ങളെ പ്രത്യേകം എണ്ണിപ്പറയുന്നതിനാൽ അവയെ പൊതുവായ ഒരു സമാഹാരപദത്തിൽ ലയിപ്പിച്ചില്ല.
- issue: תּוֹרָה എന്ന പദത്തിന്റെ പരിധി
  choice: നിയമം
  alternative: ഉപദേശം
  rationale: പദത്തിന് ‘ഉപദേശം’ എന്ന വിശാല അർത്ഥമുണ്ടെങ്കിലും ഈ ഭാഗത്തെ ഉടമ്പടി-നിയമ പശ്ചാത്തലം ‘നിയമം’ എന്ന മുഖ്യരൂപത്തെ പിന്തുണയ്ക്കുന്നു; മറ്റർത്ഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘സകല വചനങ്ങളും’ എന്ന പ്രയോഗം മൂലത്തിലെ ഔപചാരിക ഉടമ്പടി സ്വരം നിലനിർത്തുന്നു. ഏകവചനമായ ‘നിന്റെ പട്ടണങ്ങളിൽ’ എന്നും ബഹുവചനമായ ‘നിങ്ങളുടെ ദൈവം’ എന്നും മൂലപാഠത്തിലെ അഭിസംബോധനമാറ്റം സംരക്ഷിച്ചു.
