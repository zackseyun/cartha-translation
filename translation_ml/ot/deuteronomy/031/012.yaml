- from: ജനത്തെ—പുരുഷന്മാരെയും സ്ത്രീകളെയും കുഞ്ഞുങ്ങളെയും നിന്റെ പട്ടണങ്ങളിൽ താമസിക്കുന്ന പരദേശിയെയും[a][b]—ഒരുമിച്ചുകൂട്ടുക. അവർ കേൾക്കാനും പഠിക്കാനും നിങ്ങളുടെ ദൈവമായ യഹ്‌വെയെ ഭയപ്പെടാനും[c], ഈ നിയമത്തിലെ[d] സകല വചനങ്ങളും അനുസരിച്ചു പ്രവർത്തിക്കാൻ ശ്രദ്ധിക്കാനും വേണ്ടിയാണിത്.
  to: ജനത്തെ—പുരുഷന്മാരെയും സ്ത്രീകളെയും കുഞ്ഞുങ്ങളെയും നിന്റെ പട്ടണങ്ങളിൽ താമസിക്കുന്ന പരദേശിയെയും[a][b]—അവർ കേൾക്കാനും പഠിക്കാനും നിങ്ങളുടെ ദൈവമായ യഹ്‌വെയെ ഭയപ്പെടാനും[c], ഈ നിയമത്തിലെ[d] സകല വചനങ്ങളും പാലിക്കാൻ ശ്രദ്ധിക്കാനും വേണ്ടി ഒരുമിച്ചുകൂട്ടുക.
