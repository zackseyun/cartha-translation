source:
  edition: WLC
  text: וַ/יִּקְרָ֨א מֹשֶׁ֜ה לִֽ/יהוֹשֻׁ֗עַ וַ/יֹּ֨אמֶר אֵלָ֜י/ו לְ/עֵינֵ֣י כָל יִשְׂרָאֵ֘ל חֲזַ֣ק וֶ/אֱמָץ֒ כִּ֣י אַתָּ֗ה תָּבוֹא֙ אֶת הָ/עָ֣ם הַ/זֶּ֔ה אֶל הָ/אָ֕רֶץ אֲשֶׁ֨ר נִשְׁבַּ֧ע יְהוָ֛ה לַ/אֲבֹתָ֖/ם לָ/תֵ֣ת לָ/הֶ֑ם וְ/אַתָּ֖ה תַּנְחִילֶ֥/נָּה אוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/007.yaml
  text: Then Moses called Joshua and said to him in the sight of all Israel[a], “Be strong and courageous, because you will go with this people into the land that Yahweh swore to their fathers to give them[b], and you will give it to them as an inheritance.”
translation:
  language: ml
  text: 'പിന്നെ മോശെ യോശുവയെ വിളിച്ച് എല്ലാ ഇസ്രായേലും കാൺകെ അവനോടു പറഞ്ഞു: “ശക്തനും ധൈര്യവാനുമായിരിക്കുക. കാരണം, യാഹ്‌വെ അവരുടെ പിതാക്കന്മാർക്കു നൽകുമെന്നു സത്യംചെയ്ത ദേശത്തേക്ക് നീ ഈ ജനത്തോടൊപ്പം[a] പ്രവേശിക്കും; നീ അത് അവർക്ക് അവകാശമായി നൽകും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നീ ഈ ജനത്തെ ദേശത്തേക്ക് കൊണ്ടുപോകും.” യോശുവ ജനത്തോടൊപ്പം പ്രവേശിക്കുന്നതായോ അവരെ നയിച്ചു പ്രവേശിപ്പിക്കുന്നതായോ എബ്രായപ്രയോഗം മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: വിളിച്ച്
  rationale: ഈ ആഖ്യാനസന്ദർഭത്തിൽ קרא എന്ന ക്രിയയുടെ സ്വാഭാവിക അർഥം ‘വിളിക്കുക’ എന്നാണ്; ഔദ്യോഗികമായി വിളിച്ചുകൂട്ടുക എന്ന അധികഭാവം ചേർക്കുന്നില്ല.
- source_word: לְעֵינֵי כָל־יִשְׂרָאֵל
  choice: എല്ലാ ഇസ്രായേലും കാൺകെ
  rationale: ‘എല്ലാ ഇസ്രായേലിന്റെയും കണ്ണുകൾക്കു മുമ്പിൽ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ പരസ്യവും ദൃശ്യവുമായ സ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: חֲזַק וֶאֱמָץ
  choice: ശക്തനും ധൈര്യവാനുമായിരിക്കുക
  rationale: നേതൃത്വത്തിനായി നൽകുന്ന ശക്തിയുടെയും ധൈര്യത്തിന്റെയും ആഹ്വാനം ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: תָּבוֹא אֶת־הָעָם הַזֶּה
  choice: നീ ഈ ജനത്തോടൊപ്പം പ്രവേശിക്കും
  rationale: בוא എന്ന ക്രിയയോടുകൂടിയ ഈ നിർമാണം യോശുവ ജനത്തോടൊപ്പം പ്രവേശിക്കുന്നതായി മനസ്സിലാക്കാം. ‘അവരെ പ്രവേശിപ്പിക്കും’ എന്ന കാരകാർഥം മുഖ്യപാഠത്തിൽ നിർബന്ധിച്ച് ചേർക്കാതെ യഥാർഥ അവ്യക്തത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: הָאָרֶץ
  choice: ദേശം
  rationale: വാഗ്ദത്തഭൂമിയെ സൂചിപ്പിക്കുന്ന ഉടമ്പടിസന്ദർഭത്തിന് അനുയോജ്യവും മലയാളത്തിൽ സ്വാഭാവികവുമായ പദം.
- source_word: נִשְׁבַּע
  choice: സത്യംചെയ്ത
  rationale: ശപഥം ചെയ്ത് ഉറപ്പുനൽകുക എന്ന ക്രിയയുടെ അർഥം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ഉച്ചാരണസമീപമായി ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: לַאֲבֹתָם
  choice: അവരുടെ പിതാക്കന്മാർക്ക്
  rationale: ഉറവിടത്തിലെ വ്യക്തമായ പുരുഷബന്ധപദത്തെ ലിംഗനിരപേക്ഷമായ ‘പൂർവികർ’ എന്നു മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: תַּנְחִילֶנָּה אוֹתָם
  choice: നീ അത് അവർക്ക് അവകാശമായി നൽകും
  rationale: נחל എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള ‘അവകാശമാക്കിക്കൊടുക്കുക’ എന്ന ആശയം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ ലിപ്യന്തരം ചെയ്യുന്നു; ‘യഹോവ’ എന്ന പരമ്പരാഗത രൂപത്തേക്കാൾ ‘യാഹ്‌വെ’ എബ്രായനാമത്തിന്റെ സാധാരണ പുനർനിർമിത ഉച്ചാരണത്തോട് അടുത്തതാണ്.
- issue: תָּבוֹא אֶת־הָעָם എന്നതിൽ യോശുവയുടെ പങ്ക്
  choice: ജനത്തോടൊപ്പം പ്രവേശിക്കും
  alternative: ഈ ജനത്തെ ദേശത്തേക്ക് കൊണ്ടുപോകും
  rationale: ഈ വാക്യത്തിലെ നിർമാണം യോശുവ ജനത്തോടൊപ്പം പ്രവേശിക്കുന്നതായോ അവരെ നയിച്ചുകൊണ്ടുപോകുന്നതായോ ഗ്രഹിക്കാം. മുഖ്യപാഠം ആദ്യത്തെ സാധ്യത സ്വീകരിക്കുമ്പോൾ മറ്റേ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു; പിന്നാലെയുള്ള ക്രിയ അവർക്കു ദേശം അവകാശമായി നൽകുന്നതിൽ യോശുവയുടെ സജീവപങ്ക് വ്യക്തമാക്കുന്നു.
- issue: אֲבֹתָם എന്ന ബന്ധപദത്തിന്റെ പരിഭാഷ
  choice: അവരുടെ പിതാക്കന്മാർ
  alternative: അവരുടെ പൂർവികർ
  rationale: എബ്രായപാഠത്തിലെ പുരുഷബന്ധപദം അതേവിധം നിലനിർത്തുന്നു; കൂടുതൽ പൊതുവായ അർഥസാധ്യത അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘എല്ലാ ഇസ്രായേലും കാൺകെ’ എന്ന പ്രയോഗം പൊതുസാക്ഷ്യത്തിന്റെ ഭാവം നിലനിർത്തുന്നു. ദൈവനാമം ‘യാഹ്‌വെ’ എന്നു ലിപ്യന്തരം ചെയ്തു; ഉടമ്പടി-അവകാശ ആശയം ‘അവകാശമായി നൽകും’ എന്ന സ്വാഭാവിക പ്രയോഗത്തിലൂടെ സംരക്ഷിച്ചു.
