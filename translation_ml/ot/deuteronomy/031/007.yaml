revisions:
- from: 'പിന്നെ മോശ യോശുവയെ വിളിച്ച് എല്ലാ ഇസ്രായേലും കാൺകെ അവനോടു പറഞ്ഞു: “ശക്തനും ധൈര്യവാനുമായിരിക്കുക. കാരണം, യാഹ്‌വെ അവരുടെ പിതാക്കന്മാർക്ക്[b] കൊടുക്കുമെന്ന് സത്യംചെയ്ത ദേശത്തേക്ക് നീ ഈ ജനത്തോടൊപ്പം[a] പ്രവേശിക്കും; നീ അത് അവർക്ക് അവകാശമായി നൽകും.”'
  to: 'പിന്നെ മോശെ യോശുവയെ വിളിച്ച് എല്ലാ ഇസ്രായേലും കാൺകെ അവനോടു പറഞ്ഞു: “ശക്തനും ധൈര്യവാനുമായിരിക്കുക. കാരണം, യാഹ്‌വെ അവരുടെ പിതാക്കന്മാർക്കു നൽകുമെന്നു സത്യംചെയ്ത ദേശത്തേക്ക് നീ ഈ ജനത്തോടൊപ്പം[a] പ്രവേശിക്കും; നീ അത് അവർക്ക് അവകാശമായി നൽകും.”'
