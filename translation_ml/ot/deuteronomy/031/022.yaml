  yaml_path: translation/ot/deuteronomy/031/022.yaml
  text: So Moses wrote this song on that day and taught it to the sons of Israel[a].
translation:
  language: ml
  text: മോശെ ആ ദിവസം ഈ ഗാനം എഴുതി ഇസ്രായേൽപുത്രന്മാർക്ക് അത് പഠിപ്പിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഇസ്രായേൽമക്കൾ’ എന്നോ ‘ഇസ്രായേല്യർ’ എന്നോ പരിഭാഷപ്പെടുത്താം. എബ്രായയിൽ അക്ഷരാർഥം ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്നാണ്; ഇസ്രായേൽജനത്തെ സൂചിപ്പിക്കുന്ന പതിവ് പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: എഴുതി
  rationale: כתב എന്ന ധാതുവിന്റെ ഖാൽ ആഖ്യാനരൂപം നേരിട്ട് ‘എഴുതി’ എന്നർഥം നൽകുന്നു; സംഭവക്രമവും ലളിതമായി നിലനിർത്തുന്നു.
- source_word: הַשִּׁירָה הַזֹּאת
  choice: ഈ ഗാനം
  rationale: שִׁירָה എന്നത് ഇവിടെ തുടർന്നുവരുന്ന കാവ്യാത്മകവും ഉടമ്പടിസംബന്ധവുമായ രചനയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഗാനം’ യോജിക്കുന്നു.
- source_word: בַּיּוֹם הַהוּא
  choice: അന്നുതന്നെ
  rationale: കാലസൂചന സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു. ‘തന്നെ’ ആ ദിവസത്തെ പ്രത്യേകമായി ചൂണ്ടിക്കാണിക്കുന്നു, എന്നാൽ അതിൽ കൂടുതൽ സമയവിവരം ചേർക്കുന്നില്ല.
- source_word: וַיְלַמְּדָהּ
  choice: അത് … പഠിപ്പിച്ചു
  rationale: למד എന്ന ധാതുവിന്റെ പീയേൽ രൂപം ‘പഠിപ്പിച്ചു’ എന്നാണ്; സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം മുമ്പുള്ള ‘ഗാനം’ എന്ന പദത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അത്’ വ്യക്തമാക്കി.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽപുത്രന്മാർ
  rationale: എബ്രായയിലെ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന പുരുഷലിംഗ ബഹുവചന ഉടമ്പടിനാമം രൂപപരമായി സംരക്ഷിക്കുന്നു; സമൂഹമായ ഇസ്രായേൽജനത്തെയാണ് ഇത് സൂചിപ്പിക്കുന്നതെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ലിംഗസൂചകമായ സമൂഹനാമം
  choice: ഇസ്രായേൽപുത്രന്മാർ
  alternative: ഇസ്രായേൽമക്കൾ; ഇസ്രായേല്യർ
  rationale: മൂലപാഠത്തിലെ ‘പുത്രന്മാർ’ എന്ന വ്യക്തമായ പുരുഷലിംഗ രൂപം പ്രധാനപാഠത്തിൽ നിലനിർത്തി. അതേസമയം ഇത് ഇസ്രായേൽജനത്തെ സമൂഹമായി സൂചിപ്പിക്കുന്ന പതിവ് ഉടമ്പടിപദമാണെന്ന അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ലളിതവും മാന്യവുമായ ആധുനിക നിലവാരമലയാളം ഉപയോഗിച്ചു. ‘അങ്ങനെ’ ആഖ്യാനത്തിലെ തുടർച്ച സൂചിപ്പിക്കുന്നു. ‘ഇസ്രായേൽപുത്രന്മാർ’ എന്നത് സാധാരണ സംസാരഭാഷയെക്കാൾ ഔപചാരികമാണെങ്കിലും മൂലപാഠത്തിന്റെ രൂപവും ഉടമ്പടിസ്വഭാവവും സംരക്ഷിക്കുന്നു; സ്വാഭാവികമായ മറ്റു വായനകൾ അടിക്കുറിപ്പിൽ നൽകിയിട്ടുണ്ട്.
