    issue: Footnote b is anchored at the end of the sentence rather than to «അവന്റെ മുമ്പാകെ», which is the expression it explains.
    rationale: A footnote marker should immediately follow the word or phrase to which its alternative interpretation applies.
  - severity: medium
    issue: Footnote d is anchored to «എനിക്കറിയാം» although it explains the added completion «നൽകുമെന്ന്» in the land/oath clause.
    rationale: The marker must be moved to «സത്യം ചെയ്ത» (or the full oath phrase), so readers can identify the supplied element under discussion.
  - severity: low
    issue: «സത്യംചെയ്ത» should be spaced as «സത്യം ചെയ്ത» in standard modern Malayalam orthography.
    rationale: The separated form is clearer and more standard in contemporary prose.
