source:
  edition: WLC
  text: וְ֠/הָיָה כִּֽי תִמְצֶ֨אןָ אֹת֜/וֹ רָע֣וֹת רַבּוֹת֮ וְ/צָרוֹת֒ וְ֠/עָנְתָה הַ/שִּׁירָ֨ה הַ/זֹּ֤את לְ/פָנָי/ו֙ לְ/עֵ֔ד כִּ֛י לֹ֥א תִשָּׁכַ֖ח מִ/פִּ֣י זַרְע֑/וֹ כִּ֧י יָדַ֣עְתִּי אֶת יִצְר֗/וֹ אֲשֶׁ֨ר ה֤וּא עֹשֶׂה֙ הַ/יּ֔וֹם בְּ/טֶ֣רֶם אֲבִיאֶ֔/נּוּ אֶל הָ/אָ֖רֶץ אֲשֶׁ֥ר נִשְׁבָּֽעְתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/021.yaml
  text: And when many evils and troubles come upon him[a], this song will answer before him as a witness, for it will not be forgotten from the mouth of his offspring; for I know his inclination, what he is doing today[d][c][b], before I bring him into the land that I swore to give.
translation:
  language: ml
  text: അനേകം അനർഥങ്ങളും കഷ്ടതകളും അവനെ വന്നുമൂടുമ്പോൾ[a], ഈ ഗാനം അവന്റെ മുമ്പാകെ[b] സാക്ഷിയായി മറുപടി പറയും. കാരണം, അവന്റെ സന്തതിയുടെ വായിൽനിന്ന് ഇത് മറന്നുപോകുകയില്ല. നൽകുമെന്ന് ഞാൻ സത്യം ചെയ്ത[d] ദേശത്തിലേക്ക് അവനെ കൊണ്ടുവരുന്നതിനു മുമ്പുതന്നെ, അവന്റെ ഉള്ളിലെ ചായ്‌വും[c] അവൻ ഇന്ന് ചെയ്യുന്നതും എനിക്കറിയാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അവനെ കണ്ടെത്തുമ്പോൾ” എന്നോ “അവനെ പിടികൂടുമ്പോൾ” എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: “അവന്റെ മുമ്പാകെ” എന്നത് ഈ ഗാനം സാക്ഷിയായി പ്രവർത്തിക്കുന്നതിനാൽ സന്ദർഭത്തിൽ “അവനെതിരായി” എന്ന ശക്തമായ അർഥത്തിലും മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: c
    text: ഹീബ്രുവിൽ “അവന്റെ ചായ്‌വ്”; അവന്റെ ഉള്ളിലെ പ്രവണത, ഉദ്ദേശ്യം, അല്ലെങ്കിൽ മനോഭാവം എന്ന അർഥം വരാം.
    reason: lexical_alternative
  - marker: d
    text: ഹീബ്രുവിൽ അക്ഷരാർഥമായി “ഞാൻ സത്യം ചെയ്ത” എന്നുമാത്രം; “നൽകുമെന്ന്” എന്നത് സന്ദർഭവും സമാനമായ ഉടമ്പടി-പ്രയോഗങ്ങളും സൂചിപ്പിക്കുന്നതാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: വന്നുമൂടുമ്പോൾ
  rationale: ഭാവിയിൽ സംഭവിക്കാനിരിക്കുന്ന സാഹചര്യത്തെ സ്വാഭാവികമായ മലയാള കാലവാക്യമായി അവതരിപ്പിക്കുന്നു.
- source_word: תִמְצֶאןָ אֹתוֹ
  choice: അവനെ വന്നുമൂടുമ്പോൾ
  rationale: ദോഷകരമായ സംഭവങ്ങൾ ഒരാളെ കണ്ടെത്തുക, പിടികൂടുക, വന്നുഭവിക്കുക എന്നീ അർഥങ്ങളുള്ള പ്രയോഗത്തിന്റെ സന്ദർഭബലം നിലനിർത്തുന്നു.
- source_word: רָעוֹת רַבּוֹת וְצָרוֹת
  choice: അനേകം അനർഥങ്ങളും കഷ്ടതകളും
  rationale: רָעוֹת ഇവിടെ ധാർമിക തിന്മയെക്കാൾ ദോഷകരമായ സംഭവങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; 'അനർഥങ്ങൾ' അതു വ്യക്തമാക്കുന്നു.
- source_word: וְעָנְתָה
  choice: മറുപടി പറയും
  rationale: ענה എന്ന ക്രിയയുടെ അടിസ്ഥാനമായ 'മറുപടി പറയുക/പ്രതികരിക്കുക' എന്ന ദൃശ്യരൂപം നിലനിർത്തുന്നു; സാക്ഷ്യത്തിന്റെ പങ്ക് തുടർന്നുള്ള വാക്കുകൾ വ്യക്തമാക്കുന്നു.
- source_word: לְפָנָיו לְעֵד
  choice: അവന്റെ മുമ്പാകെ സാക്ഷിയായി
  rationale: לְפָנָיו എന്നതിന്റെ 'മുമ്പാകെ' എന്ന അർഥം സംരക്ഷിക്കുകയും לְעֵד സൂചിപ്പിക്കുന്ന തെളിവുനൽകുന്ന പങ്ക് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: לֹא תִשָּׁכַח מִפִּי זַרְעוֹ
  choice: അവന്റെ സന്തതിയുടെ വായിൽനിന്ന് ഇത് മറന്നുപോകുകയില്ല
  rationale: ഗാനം വായ്മൊഴിയായി തലമുറകളിൽ നിലനിൽക്കുമെന്ന ഹീബ്രു രൂപകം സംരക്ഷിക്കുന്നു.
- source_word: יִצְרוֹ
  choice: അവന്റെ മനസ്സിന്റെ ചായ്‌വ്
  rationale: രൂപപ്പെടുത്തപ്പെട്ട ഉള്ളിലെ പ്രവണത, ഉദ്ദേശ്യം, ചായ്‌വ് എന്നിവ ഉൾക്കൊള്ളുന്ന പദത്തെ സാങ്കേതിക മതശാസ്ത്രപദമാക്കാതെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר הוּא עֹשֶׂה הַיּוֹם
  choice: അവൻ ഇന്ന് ചെയ്യുന്നതും
  rationale: ഇസ്രായേലിന്റെ ഇപ്പോഴത്തെ പ്രവൃത്തിയെയോ പെരുമാറ്റഗതിയെയോ സൂചിപ്പിക്കുന്ന വർത്തമാനസ്വഭാവം നേരിട്ട് നൽകുന്നു.
- source_word: אֲשֶׁר נִשְׁבָּעְתִּי
  choice: നൽകുമെന്ന് ഞാൻ സത്യംചെയ്ത
  rationale: മൂലത്തിൽ 'ഞാൻ സത്യംചെയ്ത' എന്നുമാത്രമാണെങ്കിലും, ദേശം നൽകുമെന്ന ഉടമ്പടി-ശപഥത്തിന്റെ സന്ദർഭത്തിൽ മലയാളത്തിൽ ആവശ്യമായ പൂർത്തീകരണം ചേർക്കുന്നു; അതു അടിക്കുറിപ്പിൽ തുറന്നുപറയുന്നു.
theological_decisions:
- issue: ദൈവത്തിന്റെ മുൻജ്ഞാനവും മനുഷ്യന്റെ ഉള്ളിലെ ധാർമിക ചായ്‌വും
  choice: അവന്റെ മനസ്സിന്റെ ചായ്‌വ്
  alternative: അവന്റെ ഭാവന / അവന്റെ ഉദ്ദേശ്യം
  rationale: ഇസ്രായേലിന്റെ ഉള്ളിലെ പ്രവണതയെ വാക്യം ഗൗരവത്തോടെ അവതരിപ്പിക്കുന്നുവെങ്കിലും, അതിനെ പിന്നീടുള്ള ഏതെങ്കിലും പ്രത്യേക പാപശാസ്ത്രസിദ്ധാന്തമായി നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. കൂട്ടായ ഇസ്രായേലിനെ ഏകവചനത്തിൽ പരാമർശിക്കുന്ന മൂലപാഠത്തിന്റെ രൂപം 'അവൻ/അവന്റെ' എന്നതിലൂടെ നിലനിർത്തിയിരിക്കുന്നു. വായ്മൊഴി സ്മരണയെ സൂചിപ്പിക്കുന്ന 'വായിൽനിന്ന്' എന്ന രൂപകവും ഉദ്ദേശപൂർവം സംരക്ഷിച്ചിട്ടുണ്ട്.
