id: DEU.31.24
reference: Deuteronomy 31:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֣י כְּ/כַלּ֣וֹת מֹשֶׁ֗ה לִ/כְתֹּ֛ב אֶת דִּבְרֵ֥י הַ/תּוֹרָֽה הַ/זֹּ֖את עַל סֵ֑פֶר עַ֖ד תֻּמָּֽ/ם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/024.yaml
  text: And when Moses had finished writing the words of this law in a book[a], until they were complete,
translation:
  language: ml
  text: മോശെ ഈ ന്യായപ്രമാണത്തിലെ വചനങ്ങൾ ഒരു ഗ്രന്ഥത്തിൽ[a] പൂർണമായി എഴുതി തീർന്നപ്പോൾ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഒരു ഗ്രന്ഥച്ചുരുളിൽ’; എബ്രായപദം എഴുതപ്പെട്ട രേഖയെയോ ചുരുളിനെയോ സൂചിപ്പിക്കാം; ആധുനികരീതിയിൽ തുന്നിക്കെട്ടിയ പുസ്തകം എന്നർഥം നിർബന്ധമല്ല.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת
  choice: എഴുതി തീർന്നപ്പോൾ
  rationale: כְּ ചേർന്ന infinitive construct ഇവിടെ സമയബന്ധം സൂചിപ്പിക്കുന്നു; כלה പ്രവൃത്തി പൂർത്തിയായതിനെ ഊന്നുന്നു. മലയാളത്തിൽ ‘തീർന്നപ്പോൾ’ സ്വാഭാവികമായി ഈ അർഥം നൽകുന്നു.
- source_word: מֹשֶׁה
  choice: മോശെ
  rationale: മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ സുപരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: דִּבְרֵי
  choice: വചനങ്ങൾ
  rationale: എഴുതപ്പെട്ട നിയമവാക്യങ്ങളെയാണ് דברי ഇവിടെ സൂചിപ്പിക്കുന്നത്; ‘വചനങ്ങൾ’ ഔപചാരികവും വ്യക്തവുമായ പരിഭാഷയാണ്.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: ഈ ന്യായപ്രമാണത്തിലെ
  rationale: ആവർത്തനപുസ്തകത്തിലെ ഉടമ്പടി-നിയമസന്ദർഭത്തിൽ תורה എന്നതിന് ‘ന്യായപ്രമാണം’ വ്യക്തവും പാരമ്പര്യപരമായി പരിചിതവുമാണ്; demonstrative-ന്റെ അർഥം ‘ഈ’ നിലനിർത്തുന്നു.
- source_word: עַל סֵפֶר
  choice: ഒരു ഗ്രന്ഥത്തിൽ[a]
  rationale: ספר എഴുതപ്പെട്ട രേഖയെയോ ചുരുളിനെയോ സൂചിപ്പിക്കാം. മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായ ‘ഗ്രന്ഥം’ ഉപയോഗിച്ച്, പുരാതന ഭൗതികരൂപത്തെക്കുറിച്ചുള്ള അവ്യക്തത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: עַד תֻּמָּם
  choice: പൂർണമായി
  rationale: ഈ പ്രയോഗം വചനങ്ങളുടെ എഴുത്ത് മുഴുവനായി പൂർത്തിയായതിനെ സൂചിപ്പിക്കുന്നു. ‘പൂർണമായി എഴുതി തീർന്നപ്പോൾ’ എന്നത് ആവർത്തനം കൂടാതെ സ്വാഭാവിക മലയാളത്തിൽ ആ പൂർത്തീകരണബോധം നൽകുന്നു.
theological_decisions:
- issue: תורה എന്ന പദത്തിന്റെ പരിധി
  choice: ന്യായപ്രമാണം
  alternative: ഉപദേശം / തോറാ
  rationale: תורה എന്നതിന് വിശാലമായി ‘ഉപദേശം’ എന്നർഥമുണ്ടെങ്കിലും, ഇവിടെ എഴുതിവെക്കുന്ന ഉടമ്പടി-നിയമത്തിന്റെ സന്ദർഭം ‘ന്യായപ്രമാണം’ എന്ന പരിഭാഷയെ പിന്തുണയ്ക്കുന്നു. ഇതിലൂടെ പിന്നീട് രൂപപ്പെട്ട പ്രത്യേക മതശാസ്ത്രപരമായ വ്യാഖ്യാനം വാചകത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. അടുത്ത വാക്യവുമായി വ്യാകരണപരമായി ചേരുന്ന സമയവാക്യമായതിനാൽ അവസാനം അർധവിരാമമല്ല, അല്പവിരാമം നിലനിർത്തി.
