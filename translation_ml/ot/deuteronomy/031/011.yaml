  terminology: ‘യഹ്‌വേ,’ ‘ന്യായപ്രമാണം,’ and ‘സന്നിധിയിൽ പ്രത്യക്ഷപ്പെടാൻ’ are suitable modern-standard Malayalam Bible register. The footnote should be anchored directly to the idiomatic expression it explains, rather than to ‘വരുമ്പോൾ.’
