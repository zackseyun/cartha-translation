id: DEU.31.11
reference: Deuteronomy 31:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בְּ/ב֣וֹא כָל יִשְׂרָאֵ֗ל לֵ/רָאוֹת֙ אֶת פְּנֵי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בַּ/מָּק֖וֹם אֲשֶׁ֣ר יִבְחָ֑ר תִּקְרָ֞א אֶת הַ/תּוֹרָ֥ה הַ/זֹּ֛את נֶ֥גֶד כָּל יִשְׂרָאֵ֖ל בְּ/אָזְנֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/011.yaml
  text: when all Israel comes to appear before Yahweh your God at the place that he will choose[a], you shall read this law before all Israel in their hearing.
translation:
  language: ml
  text: യിസ്രായേൽ മുഴുവനും നിന്റെ ദൈവമായ യഹ്‌വേയുടെ സന്നിധിയിൽ പ്രത്യക്ഷപ്പെടാൻ[a] അവൻ തിരഞ്ഞെടുക്കുന്ന സ്ഥലത്ത് വരുമ്പോൾ, നീ ഈ ന്യായപ്രമാണം എല്ലാ യിസ്രായേലിന്റെയും മുമ്പാകെ അവർ കേൾക്കെ വായിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ: ‘നിന്റെ ദൈവമായ യഹ്‌വേയുടെ മുഖം കാണാൻ.’ അവന്റെ സന്നിധിയിൽ ഹാജരാകുക എന്ന അർഥമുള്ള പ്രയോഗമാണിത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבוֹא כָל יִשְׂרָאֵל
  choice: യിസ്രായേൽ മുഴുവനും ... വരുമ്പോൾ
  rationale: בְּ + infinitive construct സമയസൂചക ഉപവാക്യം അവതരിപ്പിക്കുന്നു. ‘വരുമ്പോൾ’ എന്നത് എബ്രായത്തിന്റെ സമയബലം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לֵרָאוֹת אֶת־פְּנֵי
  choice: സന്നിധിയിൽ പ്രത്യക്ഷപ്പെടാൻ
  rationale: അക്ഷരാർഥത്തിൽ ‘മുഖം കാണാൻ’ എന്നാണെങ്കിലും തീർഥാടനം/ആരാധനാസന്ദർഭത്തിൽ ദൈവസന്നിധിയിൽ ഹാജരാകുക എന്നതാണ് പ്രയോഗാർഥം. ‘പ്രത്യക്ഷപ്പെടാൻ’ ആ അർഥം തെറ്റിദ്ധാരണ കൂടാതെ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: രണ്ടാം പുരുഷ ഏകവചന പ്രത്യയം മോശെയിലൂടെ യിസ്രായേലിനെ ഏകീകൃത ഉടമ്പടിസമൂഹമായി അഭിസംബോധന ചെയ്യുന്നു; മലയാളത്തിൽ ‘നിന്റെ’ അത് നേരിട്ട് സൂക്ഷിക്കുന്നു.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחָר
  choice: അവൻ തിരഞ്ഞെടുക്കുന്ന സ്ഥലത്തു
  rationale: ദൈവം തിരഞ്ഞെടുക്കുന്ന ആരാധനാസ്ഥലം എന്ന ആവർത്തിത ദ്വിതീയോപദേശ പ്രമേയം നിലനിർത്തുന്നു. അപൂർണക്രിയയുടെ ഭാവിസൂചന മലയാളത്തിലെ സന്ദർഭാധിഷ്ഠിത വർത്തമാനരൂപത്തിൽ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: תִּקְרָא
  choice: വായിക്കണം
  rationale: ഈ സന്ദർഭത്തിൽ קרא, תּוֹרָהയെ കർമമായി സ്വീകരിച്ച് പൊതുവായി ശബ്ദമുയർത്തി വായിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘വായിക്കണം’ നിർദേശബലവും പ്രവൃത്തിയും വ്യക്തമായി നൽകുന്നു.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: ഈ ന്യായപ്രമാണം
  rationale: ഇവിടെ תּוֹרָה ഉടമ്പടിസംബന്ധമായ നിയമബോധനസമുച്ചയത്തെ സൂചിപ്പിക്കുന്നു. ‘ന്യായപ്രമാണം’ മലയാള ബൈബിൾഭാഷയിൽ പരിചിതവും ഈ സന്ദർഭത്തിൽ വ്യക്തവുമാണ്.
- source_word: נֶגֶד כָּל־יִשְׂרָאֵל
  choice: യിസ്രായേൽ മുഴുവന്റെയും മുമ്പാകെ
  rationale: ഒത്തുകൂടിയ ജനത്തിന്റെ സാന്നിധ്യത്തിലുള്ള പൊതുവായ അവതരണം എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּאָזְנֵיהֶם
  choice: അവർ കേൾക്കെ
  rationale: അക്ഷരാർഥത്തിലെ ‘അവരുടെ ചെവികളിൽ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം, എല്ലാവരും കേൾക്കുന്ന വിധത്തിലുള്ള പരസ്യവായനയായി സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് ഉള്ളതിനാൽ ഒരു ബിരുദമായ ‘കർത്താവ്’ എന്നു പകരാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരണം ചെയ്തു. ‘യഹോവ’ എന്ന പരമ്പരാഗത രൂപത്തിനുപകരം ഹീബ്രു ഉച്ചാരണത്തിന്റെ സാധാരണ പണ്ഡിതപുനർനിർമാണത്തോട് അടുത്ത രൂപം സ്വീകരിച്ചു.
- issue: לֵרָאוֹת אֶת־פְּנֵי എന്ന പ്രയോഗം
  choice: സന്നിധിയിൽ പ്രത്യക്ഷപ്പെടാൻ
  alternative: മുഖം കാണാൻ
  rationale: ദൈവത്തിന്റെ മുഖം ദൃശ്യമായി കാണുന്നു എന്ന നിലയിൽ വാചകത്തെ തീർപ്പാക്കാതെ, ആരാധനയ്ക്കായി അവന്റെ സാന്നിധ്യത്തിൽ ഹാജരാകുക എന്ന സന്ദർഭപ്രയോഗം മുഖ്യപാഠത്തിൽ നൽകി; അക്ഷരരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, പൊതുവായ വായനയ്ക്കു യോജിച്ച ഗൗരവമുള്ള ശൈലി. ‘യിസ്രായേൽ,’ ‘ന്യായപ്രമാണം’ എന്നീ പരിചിത ബൈബിൾപദങ്ങൾ നിലനിർത്തിയപ്പോൾ വാക്യഘടന സ്വാഭാവികമാക്കി. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട പ്രയോഗത്തിന് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
