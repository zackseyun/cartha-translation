  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. വാക്യം അടുത്ത വാക്യത്തിലേക്കു തുടരുന്നതിനാൽ അവസാനത്തിൽ പൂർണവിരാമം നൽകിയിട്ടില്ല. യഥാർഥത്തിൽ സഹായകരമായ പരമ്പരാഗത നാമഭേദത്തിനായി മാത്രം അടിക്കുറിപ്പ് ചേർത്തിരിക്കുന്നു.
