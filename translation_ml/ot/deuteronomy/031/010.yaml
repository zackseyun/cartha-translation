  text: And Moses commanded them[a], saying, “At the end of every seven years, at the appointed time of the year of release[c][b], at the Feast of Booths,”
translation:
  language: ml
  text: 'മോശ അവരോടു കല്പിച്ചു: “ഓരോ ഏഴു വർഷത്തിന്റെയും അവസാനം, വിടുതൽ വർഷത്തിന്റെ നിശ്ചിത സമയത്ത്, കൂടാരപ്പെരുന്നാളിൽ[a],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പരമ്പരാഗതമായി “കൂടാരത്തിരുനാൾ” എന്നും പറയുന്നു. “കൂടാരങ്ങൾ” എന്നത് എബ്രായത്തിലെ סֻכּוֹת എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: കല്പിച്ചു
  rationale: צוה എന്ന ക്രിയയുടെ ആജ്ഞാപരമായ ശക്തി സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אוֹתָם
  choice: അവരോടു
  rationale: എബ്രായത്തിലെ പുല്ലിംഗ ബഹുവചന കർമസർവനാമത്തിന്റെ സന്ദർഭോചിതമായ മലയാളപ്രയോഗം; ആരെയെന്നത് മുൻവാക്യങ്ങളിൽനിന്നു വ്യക്തമാകുന്നു.
- source_word: לֵאמֹר
  choice: 'കല്പിച്ചു:'
  rationale: നേരിട്ടുള്ള ഉദ്ധരണി ആരംഭിക്കുന്ന എബ്രായ പ്രയോഗം മലയാളത്തിൽ കോളൺകൊണ്ട് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; വേറിട്ട് ‘പറഞ്ഞുകൊണ്ട്’ എന്നു ചേർക്കുന്നത് അനാവശ്യമായ ആവർത്തനമാകും.
- source_word: מִקֵּץ שֶׁבַע שָׁנִים
  choice: ഓരോ ഏഴു വർഷത്തിന്റെയും അവസാനം
  rationale: מִקֵּץ എന്നതിന്റെ ‘അവസാനത്തിൽ’ എന്ന അർഥവും നിയമത്തിലെ ആവർത്തിത ഏഴുവർഷചക്രവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: בְּמוֹעֵד
  choice: നിശ്ചിതസമയത്ത്
  rationale: מוֹעֵד സൂചിപ്പിക്കുന്ന നിശ്ചയിക്കപ്പെട്ട സമയം അഥവാ അവസരം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: שְׁנַת הַשְּׁמִטָּה
  choice: വിടുതൽവർഷം
  rationale: שְׁמִטָּהയുടെ വിടുക, ഇളവുനൽകുക എന്ന അടിസ്ഥാനാശയം നേരിട്ട് പ്രകടിപ്പിക്കുന്നു; പരമ്പരാഗത സാങ്കേതികപദം മുഖ്യപാഠത്തിൽ അടിച്ചേൽപ്പിക്കുന്നില്ല.
- source_word: בְּחַג הַסֻּכּוֹת
  choice: കൂടാരപ്പെരുന്നാളിൽ
  rationale: חַג എന്ന ഉത്സവത്തെയും סֻכּוֹת എന്ന താൽക്കാലിക കൂടാരങ്ങളെയും ആധുനിക മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന വിധം നൽകുന്നു.
