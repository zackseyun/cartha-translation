  text: Then Moses went and spoke these words to all Israel[a].
translation:
  language: ml
  text: അപ്പോൾ മോശെ പോയി ഈ വാക്കുകൾ ഇസ്രായേൽ മുഴുവനോടും പറഞ്ഞു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ആരംഭത്തിലെ എബ്രായ സംയോജകം ‘കൂടാതെ’ അല്ലെങ്കിൽ ‘അങ്ങനെ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: പോയി
  rationale: הלך എന്ന ക്രിയയുടെ സാധാരണ അർഥമായ ‘പോകുക’ നിലനിർത്തുന്നു. ലക്ഷ്യസ്ഥാനം പറയാത്തതിനാൽ ‘തുടർന്നു’ എന്ന വ്യാഖ്യാനപരമായ അർഥം ചേർത്തിട്ടില്ല.
- source_word: מֹשֶׁה
  choice: മോശ
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: וַיְדַבֵּר
  choice: സംസാരിച്ചു
  rationale: പീയേൽ രൂപത്തിലുള്ള דבר ഇവിടെ ‘സംസാരിക്കുക’ എന്നാണ്; തുടർന്നുള്ള ‘ഈ വാക്കുകൾ’ എന്ന കർമവുമായി സ്വാഭാവികമായി ചേരുന്നു.
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  choice: ഈ വാക്കുകൾ
  rationale: എബ്രായപ്രയോഗത്തിന്റെ വ്യക്തമായ പദാർഥം സംരക്ഷിക്കുകയും പറയപ്പെടുന്ന പ്രസംഗത്തിലേക്ക് വിരൽചൂണ്ടുകയും ചെയ്യുന്നു.
- source_word: אֶל
  choice: -ഓടും
  rationale: അഭിസംബോധന ചെയ്യപ്പെടുന്ന ശ്രോതാക്കളെ സൂചിപ്പിക്കുന്ന אֶל എന്ന പൂർവപ്രത്യയത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: כָּל יִשְׂרָאֵל
  choice: ഇസ്രായേൽ മുഴുവൻ
  rationale: ദേശസമൂഹത്തെ ഏകകമായി സൂചിപ്പിക്കുന്ന കൂട്ടായ അർഥം നിലനിർത്തുന്നു; വ്യക്തികളായി പിരിച്ചുകാണിക്കുന്ന ‘എല്ലാ ഇസ്രായേല്യരും’ എന്ന രൂപം ഒഴിവാക്കുന്നു.
- source_word: וַ
  choice: അപ്പോൾ
  rationale: കഥാഖ്യാനത്തെ മുന്നോട്ടു നീക്കുന്ന പ്രാരംഭ വാവ് മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; കൂടുതൽ രൂപപരമായ ‘പിന്നെ/കൂടാതെ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
