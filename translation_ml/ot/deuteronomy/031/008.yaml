reference: Deuteronomy 31:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יהוָ֞ה ה֣וּא הַ/הֹלֵ֣ךְ לְ/פָנֶ֗י/ךָ ה֚וּא יִהְיֶ֣ה עִמָּ֔/ךְ לֹ֥א יַרְפְּ/ךָ֖ וְ/לֹ֣א יַֽעַזְבֶ֑/ךָּ לֹ֥א תִירָ֖א וְ/לֹ֥א תֵחָֽת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/008.yaml
  text: And Yahweh himself is the one going before you[a]. He himself will be with you; he will not fail you or forsake you. Do not fear or be dismayed.
translation:
  language: ml
  text: യഹ്‌വേ തന്നെയാണ് നിനക്കു മുമ്പായി പോകുന്നത്. അവിടുന്ന് തന്നേ നിന്നോടുകൂടെ ഉണ്ടായിരിക്കും; അവിടുന്ന് നിന്നെ കൈവിടുകയോ ഉപേക്ഷിക്കുകയോ ഇല്ല. ഭയപ്പെടരുത്; പരിഭ്രമിക്കരുത്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ ഉടമ്പടിനാമമായ יהוה ശീർഷകമാക്കി മാറ്റാതെ മലയാളത്തിൽ സാധാരണമായ ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: הוּא
  choice: തന്നെയാണ് / അവിടുന്നുതന്നെ
  rationale: ആവർത്തിക്കുന്ന സ്വതന്ത്ര സർവനാമത്തിന്റെ ഊന്നൽ മലയാളത്തിൽ ‘തന്നെ’ ഉപയോഗിച്ച് നിലനിർത്തി.
- source_word: הַהֹלֵךְ לְפָנֶיךָ
  choice: നിനക്കു മുമ്പായി പോകുന്നത്
  rationale: വർത്തമാന കൃതന്തത്തിന്റെ തുടരുന്ന പ്രവർത്തനഭാവവും, യോശുവയ്ക്കു മുമ്പേ വഴി നടത്തുകയും സംരക്ഷിക്കുകയും ചെയ്യുന്ന സന്ദർഭാർഥവും സംരക്ഷിക്കുന്നു.
- source_word: יִהְיֶה עִמָּךְ
  choice: നിന്നോടുകൂടെ ഉണ്ടായിരിക്കും
  rationale: ദൈവസാന്നിധ്യത്തെക്കുറിച്ചുള്ള ലളിതമായ ഉടമ്പടിഭാഷ അധിക വ്യാഖ്യാനമില്ലാതെ പകർന്നു.
- source_word: לֹא יַרְפְּךָ
  choice: നിന്നെ കൈവിടുകയില്ല
  rationale: רפה എന്ന ക്രിയയുടെ ‘പിടി അയയ്ക്കുക, തളരാൻ വിടുക, പരാജയപ്പെടുത്തുക’ എന്ന അർഥവ്യാപ്തി സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; പിന്നാലെയുള്ള ‘ഉപേക്ഷിക്കുക’ എന്നതിൽനിന്ന് കഴിയുന്നത്ര വേർതിരിച്ചിരിക്കുന്നു.
- source_word: וְלֹא יַעַזְבֶךָּ
  choice: ഉപേക്ഷിക്കുകയോ ഇല്ല
  rationale: עזב എന്നതിന്റെ വിട്ടുപോകുക/പരിത്യജിക്കുക എന്ന ഗൗരവമുള്ള ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: לֹא תִירָא
  choice: ഭയപ്പെടരുത്
  rationale: ഈ സന്ദർഭത്തിലെ നിരോധനാത്മക പ്രോത്സാഹനം സ്വാഭാവികവും നേരിട്ടുമായ മലയാളത്തിൽ നൽകി.
- source_word: וְלֹא תֵחָת
  choice: പരിഭ്രമിക്കരുത്
  rationale: חתת എന്നതിലെ തകർന്നുപോകുക, നിരാശപ്പെടുക, ഭീതിയാൽ കുഴങ്ങുക എന്നീ ആശയങ്ങളെ ‘ഭയപ്പെടരുത്’ എന്നതുമായി അനാവശ്യമായി ആവർത്തിക്കാതെ പകർന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ഉടമ്പടിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ രൂപത്തിൽ നിലനിർത്തി.
- issue: ദൈവത്തെ സൂചിപ്പിക്കുന്ന സർവനാമത്തിന്റെ ഭാഷാതലം
  choice: അവിടുന്ന്
  alternative: അവൻ
  rationale: മൂലത്തിലെ പുരുഷ ഏകവചന സൂചന നിലനിർത്തിക്കൊണ്ട് ആധുനിക മാനക മലയാളത്തിലെ ദൈവത്തെക്കുറിച്ചുള്ള മാന്യവും സ്വാഭാവികവുമായ പ്രയോഗം തിരഞ്ഞെടുത്തു; ‘തന്നെ’ മൂലത്തിലെ ഊന്നൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ അഭിസംബോധന. ‘നിനക്ക്/നിന്നെ’ എന്ന ഏകവചനം യോശുവയോടുള്ള മൂലപാഠത്തിലെ ഏകവചന അഭിസംബോധന സംരക്ഷിക്കുന്നു. സമാന്തര വാക്യഘടനയും ആവർത്തിച്ച ഊന്നലും നിലനിർത്തിയിട്ടുണ്ട്.
