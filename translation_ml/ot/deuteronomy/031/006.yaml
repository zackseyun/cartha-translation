id: DEU.31.6
reference: Deuteronomy 31:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: חִזְק֣וּ וְ/אִמְצ֔וּ אַל תִּֽירְא֥וּ וְ/אַל תַּעַרְצ֖וּ מִ/פְּנֵי/הֶ֑ם כִּ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ ה֚וּא הַ/הֹלֵ֣ךְ עִמָּ֔/ךְ לֹ֥א יַרְפְּ/ךָ֖ וְ/לֹ֥א יַעַזְבֶֽ/ךָּ־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/006.yaml
  text: Be strong and courageous[a]. Do not fear or be terrified because of them, for Yahweh your God is the one who goes with you[b]; he will not fail you or forsake you.
translation:
  language: ml
  text: ശക്തരായിരിക്കുവിൻ; ധൈര്യം കൈക്കൊള്ളുവിൻ. അവരെ ഭയപ്പെടരുത്; അവരെക്കണ്ട് ഭയന്നുനടുങ്ങുകയും അരുത്.[a] നിന്റെ ദൈവമായ യഹ്‌വെ തന്നെയാണ് നിന്നോടുകൂടെ പോകുന്നത്. അവൻ നിന്നെ കൈവിടുകയില്ല[b]; നിന്നെ ഉപേക്ഷിക്കുകയുമില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: രണ്ടാമത്തെ എബ്രായക്രിയ സാധാരണ ‘ഭയപ്പെടുക’ എന്നതിനെക്കാൾ ശക്തമാണ്; ‘ഭീതിയാൽ നടുങ്ങുക’ അല്ലെങ്കിൽ ‘ഭയംകൊണ്ട് തകർന്നുപോകുക’ എന്ന ഭാവവും അതിനുണ്ടാകാം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘അവൻ നിന്നെ വിട്ടുകളയുകയില്ല’ അല്ലെങ്കിൽ ‘നിന്നെ താഴെ വീഴാൻ വിടുകയില്ല’ എന്ന ഭാവം; യഹ്‌വെ നിന്നെ താങ്ങുന്നതിൽ വീഴ്ചവരുത്തുകയില്ല എന്നതാണ് ആശയം.
    reason: lexical_alternative
lexical_decisions:
- source_word: חִזְקוּ וְאִמְצוּ
  choice: ശക്തരായിരിക്കുവിൻ; ധൈര്യം കൈക്കൊള്ളുവിൻ
  rationale: രണ്ട് ബഹുവചന കല്പനകളെയും വേർതിരിച്ചു നിലനിർത്തുന്നു; ആദ്യത്തേത് ശക്തിയോ ഉറപ്പോ, രണ്ടാമത്തേത് ധൈര്യമോ ദൃഢനിശ്ചയമോ ആവശ്യപ്പെടുന്നു. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രയോഗമാണിത്.
- source_word: אַל תִּירְאוּ וְאַל תַּעַרְצוּ מִפְּנֵיהֶם
  choice: അവരെ ഭയപ്പെടുകയോ അവരെക്കണ്ട് നടുങ്ങിപ്പോകുകയോ അരുത്
  rationale: יִרְאוּ എന്ന സാധാരണ ‘ഭയപ്പെടുക’ എന്ന അർഥത്തെയും, അതിനെക്കാൾ ശക്തമായ תַּעַרְצוּ എന്ന ഭീതിയാൽ വിറയ്ക്കുക/തകർന്നുപോകുക എന്ന ആശയത്തെയും വ്യത്യസ്തമായി പ്രകടിപ്പിക്കുന്നു. מִפְּנֵיהֶם എന്നത് സന്ദർഭാനുസൃതമായി ‘അവരെക്കണ്ട്’ എന്നു സ്വാഭാവികമാക്കി.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: നിങ്ങളുടെ ദൈവമായ യഹ്‌വെ
  rationale: ദൈവനാമമായ יהוה ഒരു പദവിയാൽ മാറ്റാതെ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു. എബ്രായത്തിലെ ഏകവചന ഉടമസ്ഥപ്രത്യയം സമൂഹമായ ഇസ്രായേലിനെ അഭിസംബോധന ചെയ്യുന്നതായതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ സമൂഹസംബോധനയായ ‘നിങ്ങളുടെ’ ഉപയോഗിച്ചു.
- source_word: הוּא הַהֹלֵךְ עִמָּךְ
  choice: തന്നെയാണ് നിങ്ങളോടുകൂടെ പോകുന്നത്
  rationale: הוּא എന്ന ഊന്നൽ ‘തന്നെയാണ്’ എന്നതിലൂടെ നിലനിർത്തി; കർത്തൃവാചകവും വർത്തമാന പങ്കാളിത്തത്തിന്റെ തുടരുന്ന ഭാവവും സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിച്ചു.
- source_word: לֹא יַרְפְּךָ
  choice: അവൻ നിങ്ങളെ കൈവിടുകയില്ല
  rationale: רפה എന്ന ക്രിയയുടെ അടിസ്ഥാനഭാവമായ പിടി അയയ്ക്കുക, താങ്ങാതെ വിടുക എന്നത് ‘കൈവിടുക’ എന്ന മലയാളപ്രയോഗം നേരിട്ട് സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള ‘ഉപേക്ഷിക്കുക’ എന്ന ക്രിയയിൽനിന്നും വ്യത്യാസവും നിലനിൽക്കുന്നു.
- source_word: וְלֹא יַעַזְבֶךָ
  choice: നിങ്ങളെ ഉപേക്ഷിക്കുകയുമില്ല
  rationale: עזב എന്നതിന്റെ വിടുക/പരിത്യജിക്കുക എന്ന ഗൗരവമുള്ള അർഥം ‘ഉപേക്ഷിക്കുക’ വ്യക്തമായി നൽകുന്നു; ഇരട്ട ഉറപ്പിന്റെ സമാന്തരഘടനയും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം തന്നെയുള്ളതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരാതെ, Yahweh എന്ന ഉച്ചാരണത്തെ മലയാളത്തിൽ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു. ‘യഹോവ’ എന്ന പരമ്പരാഗത രൂപത്തിന്റെ വ്യത്യസ്ത സ്വരവൽക്കരണവും ഒഴിവാക്കുന്നു.
- issue: יַרְפְּךָ, יַעַזְבֶךָ എന്നീ രണ്ട് ഉറപ്പുവചനങ്ങളുടെ വ്യത്യാസം
  choice: കൈവിടുകയില്ല; ഉപേക്ഷിക്കുകയുമില്ല
  alternative: പരാജയപ്പെടുത്തുകയില്ല; ഉപേക്ഷിക്കുകയുമില്ല
  rationale: ആദ്യക്രിയയിലെ പിടി അയയ്ക്കുക/താങ്ങാതിരിക്കുക എന്ന ദൃശ്യഭാവം ‘കൈവിടുക’ സൂക്ഷിക്കുന്നു; രണ്ടാമത്തേതിലെ പരിത്യാഗഭാവം ‘ഉപേക്ഷിക്കുക’ നൽകുന്നു. അങ്ങനെ രണ്ട് ക്രിയകളും ഒരേ പര്യായമായി ചുരുങ്ങുന്നില്ല.
- issue: ബഹുവചന കല്പനകൾക്കു പിന്നാലെയുള്ള ഏകവചന എബ്രായ സർവനാമപ്രത്യയങ്ങൾ
  choice: മലയാളത്തിൽ സമൂഹത്തെ അഭിസംബോധന ചെയ്യുന്ന ‘നിങ്ങളുടെ/നിങ്ങളെ/നിങ്ങളോടുകൂടെ’
  alternative: ‘നിന്റെ/നിന്നെ/നിന്നോടുകൂടെ’ എന്ന വ്യാകരണപരമായ ഏകവചനം
  rationale: എബ്രായം ആദ്യം ജനത്തെ ബഹുവചനത്തിൽ അഭിസംബോധന ചെയ്തശേഷം ഇസ്രായേലിനെ ഒരു സമൂഹമായി ഏകവചനത്തിൽ കാണുന്നു. മലയാളത്തിൽ പെട്ടെന്നുള്ള ഏകവചനമാറ്റം വ്യക്തിയിലേക്കുള്ള അഭിസംബോധനയായി തെറ്റിദ്ധരിക്കപ്പെടാൻ സാധ്യതയുള്ളതിനാൽ സമൂഹസംബോധന ഉപയോഗിച്ചു; ദൈവവാഗ്ദാനത്തിന്റെ സമൂഹപരമായ പരിധി മാറ്റിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. ‘ആയിരിക്കുവിൻ/അരുത്’ എന്നീ രൂപങ്ങൾ തിരുവെഴുത്തിന്റെ പൊതുവായ ഗൗരവം നിലനിർത്തുന്നു; അപൂർവമായ പഴഞ്ചൻ പദങ്ങൾ ഒഴിവാക്കി. എബ്രായത്തിലെ ഊന്നലും രണ്ടു കല്പനകളുടെയും രണ്ടു ഉറപ്പുവചനങ്ങളുടെയും വ്യത്യാസവും വ്യക്തമായി സൂക്ഷിച്ചു.
