reference: Deuteronomy 31:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּֽי אֲבִיאֶ֜/נּוּ אֶֽל הָ/אֲדָמָ֣ה אֲשֶׁר נִשְׁבַּ֣עְתִּי לַ/אֲבֹתָ֗י/ו זָבַ֤ת חָלָב֙ וּ/דְבַ֔שׁ וְ/אָכַ֥ל וְ/שָׂבַ֖ע וְ/דָשֵׁ֑ן וּ/פָנָ֞ה אֶל אֱלֹהִ֤ים אֲחֵרִים֙ וַ/עֲבָד֔וּ/ם וְ/נִ֣אֲצ֔וּ/נִי וְ/הֵפֵ֖ר אֶת בְּרִיתִֽ/י־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/020.yaml
  text: For when I bring him into the land that I swore to his fathers[a], a land flowing with milk and honey, and he eats and is satisfied and grows fat, then he will turn to other gods and serve them[b], and spurn me and break my covenant.
translation:
  language: ml
  text: കാരണം, ഞാൻ അവന്റെ പിതാക്കന്മാരോടു സത്യം ചെയ്ത, പാലും തേനും ഒഴുകുന്ന ദേശത്തേക്ക് അവനെ[a] കൊണ്ടുവരുമ്പോൾ, അവൻ തിന്നു തൃപ്തനായി കൊഴുക്കും; പിന്നെ അവൻ മറ്റു ദേവന്മാരിലേക്കു തിരിയും; അവർ ആ ദേവന്മാരെ സേവിച്ച് എന്നെ അവഹേളിക്കും[b]; അവൻ എന്റെ ഉടമ്പടി ലംഘിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠം ഇസ്രായേലിനെ ആദ്യം ഏകവചനത്തിൽ (‘അവനെ … അവൻ’), തുടർന്ന് ബഹുവചനത്തിൽ (‘അവർ സേവിക്കും … അവഹേളിക്കും’), ഒടുവിൽ വീണ്ടും ഏകവചനത്തിൽ (‘അവൻ ലംഘിക്കും’) പരാമർശിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘അവഹേളിക്കും’ എന്നതിന് ‘നിന്ദിക്കും’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: കാരണം, ... കൊണ്ടുവരുമ്പോൾ
  rationale: മുൻപുള്ള മുന്നറിയിപ്പിന്റെ കാരണവും തുടർന്നുള്ള സംഭവത്തിന്റെ കാലസൂചനയും ഒരുമിച്ച് പ്രകടിപ്പിക്കുന്നു.
- source_word: אֲבִיאֶנּוּ
  choice: അവനെ കൊണ്ടുവരുമ്പോൾ
  rationale: ഹിഫിൽ രൂപത്തിലെ ഒന്നാംപുരുഷ ഏകവചന കർത്താവിനെയും മൂന്നാംപുരുഷ പുല്ലിംഗ ഏകവചന കർമത്തെയും നിലനിർത്തുന്നു; ‘അവൻ’ എന്നത് ഇസ്രായേലിനെ ഏകജനമായി സൂചിപ്പിക്കുന്നു.
- source_word: הָאֲדָמָה
  choice: ദേശം
  rationale: ഇവിടെ മണ്ണല്ല, വാഗ്ദത്തദേശം തന്നെയാണ് സന്ദർഭോചിതമായ അർഥം.
- source_word: נִשְׁבַּעְתִּי לַאֲבֹתָיו
  choice: ഞാൻ അവന്റെ പിതാക്കന്മാരോടു സത്യംചെയ്ത
  rationale: എബ്രായത്തിലെ ‘അവന്റെ പിതാക്കന്മാർ’ എന്ന ഏകവചന-സാമൂഹിക പരാമർശവും ഉടമ്പടി ഭാഷയും സൂക്ഷിക്കുന്നു.
- source_word: זָבַת חָלָב וּדְבַשׁ
  choice: പാലും തേനും ഒഴുകുന്ന
  rationale: സമൃദ്ധിയെ സൂചിപ്പിക്കുന്ന മൂലഭാഷയിലെ സജീവ രൂപകം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְאָכַל וְשָׂבַע וְדָשֵׁן
  choice: അവൻ തിന്നു തൃപ്തനായി കൊഴുക്കും
  rationale: ഭക്ഷണം, തൃപ്തി, സമൃദ്ധിമൂലമുള്ള കൊഴുപ്പ് എന്നീ ക്രമവും ദൃശ്യരൂപകവും സംരക്ഷിക്കുന്നു.
- source_word: וּפָנָה אֶל אֱלֹהִים אֲחֵרִים
  choice: അവൻ മറ്റു ദേവന്മാരിലേക്കു തിരിയും
  rationale: വിഗ്രഹാരാധന എന്ന വ്യാഖ്യാനപദം ചേർക്കാതെ, ദിശമാറ്റത്തെ സൂചിപ്പിക്കുന്ന മൂലക്രിയയും ‘മറ്റു ദേവന്മാർ’ എന്ന അർഥവും നൽകുന്നു.
- source_word: וַעֲבָדוּם
  choice: അവർ ആ ദേവന്മാരെ സേവിക്കുകയും
  rationale: മസോററ്റിക് പാഠത്തിലെ ബഹുവചന കർത്താവിനെ നിലനിർത്തുകയും עבד എന്ന ക്രിയയുടെ സേവനം/ആരാധന എന്ന ഉടമ്പടിസംബന്ധിയായ വ്യാപ്തിയിൽ ‘സേവിക്കുക’ തിരഞ്ഞെടുക്കുകയും ചെയ്യുന്നു.
- source_word: וְנִאֲצוּנִי
  choice: എന്നെ അവഹേളിക്കുകയും
  rationale: നിന്ദയോടും അവജ്ഞയോടും പെരുമാറുക എന്ന ക്രിയയുടെ ശക്തി നൽകുന്നു; ബഹുവചന കർത്താവ് മുൻക്രിയയോടൊപ്പം വ്യക്തമാകുന്നു.
- source_word: וְהֵפֵר אֶת־בְּרִיתִי
  choice: അവൻ എന്റെ ഉടമ്പടി ലംഘിക്കും
  rationale: ക്രിയ വീണ്ടും ഏകവചനത്തിലേക്കു മാറുന്നതു സൂക്ഷിക്കുകയും ഉടമ്പടി അസാധുവാക്കുന്ന പ്രവൃത്തിയെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ഇസ്രായേലിനെ സൂചിപ്പിക്കുന്ന ഏകവചന-ബഹുവചന മാറ്റങ്ങൾ
  choice: ‘അവനെ/അവൻ’ എന്ന ഏകവചനത്തിൽ തുടങ്ങി ‘അവർ’ എന്ന ബഹുവചനത്തിലേക്കു മാറി അവസാനം വീണ്ടും ‘അവൻ’ എന്നു നൽകുന്നു.
  alternative: എല്ലാ പരാമർശങ്ങളും ‘അവർ’ എന്ന ബഹുവചനത്തിലോ ‘അവൻ’ എന്ന ഏകവചനത്തിലോ ഏകീകരിക്കുക.
  rationale: എബ്രായ പാഠം ഇസ്രായേലിനെ ഒരു ജനമായി ഏകവചനത്തിലും ആ ജനത്തിലെ വ്യക്തികളെ ബഹുവചനത്തിലും അവതരിപ്പിക്കുന്ന യഥാർഥ വ്യാകരണപരമായ സംഘർഷം വിവർത്തനം മിനുക്കി നീക്കരുത്.
- issue: ഉടമ്പടിയോടുള്ള അവിശ്വസ്തതയുടെ ഭാഷ
  choice: ‘മറ്റു ദേവന്മാരിലേക്കു തിരിയും ... സേവിക്കും’ എന്നു പ്രവൃത്തികളെ നേരിട്ട് വിവരിക്കുന്നു.
  alternative: ‘വിഗ്രഹാരാധന നടത്തും’ അല്ലെങ്കിൽ ‘വിശ്വാസത്യാഗം ചെയ്യും’ എന്ന വ്യാഖ്യാനപരമായ സംഗ്രഹം നൽകുക.
  rationale: മൂലപാഠം ഉപയോഗിക്കുന്ന പ്രവൃത്തിഭാഷ നിലനിർത്തി, അതിൽ അടങ്ങിയ ദൈവശാസ്ത്രപരമായ വിലയിരുത്തൽ വായനക്കാരനുവേണ്ടി അധികപദങ്ങളാൽ നിർണയിക്കുന്നതു ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഉടമ്പടി,’ ‘പാലും തേനും ഒഴുകുന്ന ദേശം’ എന്നീ പരിചിതമായ ബൈബിൾ പ്രയോഗങ്ങൾ നിലനിർത്തിയിട്ടുണ്ട്; എന്നാൽ പഴഞ്ചൻ ക്രിയാരൂപങ്ങൾ ഒഴിവാക്കി. മൂലപാഠത്തിലെ അസാധാരണമായ വചനമാറ്റങ്ങൾ അടിക്കുറിപ്പോടെ ദൃശ്യമായി സൂക്ഷിച്ചിരിക്കുന്നു.
