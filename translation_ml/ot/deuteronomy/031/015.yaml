source:
  edition: WLC
  text: וַ/יֵּרָ֧א יְהוָ֛ה בָּ/אֹ֖הֶל בְּ/עַמּ֣וּד עָנָ֑ן וַ/יַּעֲמֹ֛ד עַמּ֥וּד הֶ/עָנָ֖ן עַל פֶּ֥תַח הָ/אֹֽהֶל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/015.yaml
  text: And Yahweh appeared in the tent in a pillar of cloud[b][a], and the pillar of cloud stood at the entrance of the tent.
translation:
  language: ml
  text: യാഹ്‌വെ കൂടാരത്തിൽ[a] ഒരു മേഘസ്തംഭത്തിൽ പ്രത്യക്ഷനായി; മേഘസ്തംഭം കൂടാരത്തിന്റെ പ്രവേശനകവാടത്ത്[b] നിന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സമാഗമകൂടാരത്തിൽ’; എബ്രായപാഠത്തിൽ ഇവിടെ ‘കൂടാരം’ എന്നു മാത്രമാണെങ്കിലും സന്ദർഭം സമാഗമകൂടാരത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘കൂടാരത്തിന്റെ പ്രവേശനകവാടത്തിനുമുകളിൽ’; എബ്രായ ഉപസർഗത്തിന് ‘മേൽ/മുകളിൽ’ എന്നും അർത്ഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: പ്രത്യക്ഷനായി
  rationale: ראה എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം ഇവിടെ ദൃശ്യമായ ദൈവിക പ്രത്യക്ഷതയെ സൂചിപ്പിക്കുന്നു. പ്രത്യക്ഷനായി എന്നത് വെളിപ്പാടിന്റെ രീതി കൂടുതൽ വിശദീകരിക്കാതെ ഈ അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בָּאֹהֶל
  choice: കൂടാരത്തിൽ
  rationale: אֹהֶל എന്നതിന്റെ നേരിട്ടുള്ള അർത്ഥം കൂടാരം എന്നാണ്. സന്ദർഭത്തിൽ ഇത് സമാഗമകൂടാരത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും മൂലപാഠം ഇവിടെ കൂടാരം എന്നു മാത്രമേ പറയുന്നുള്ളൂ.
- source_word: בְּעַמּוּד עָנָן
  choice: ഒരു മേഘസ്തംഭത്തിൽ
  rationale: בְ എന്ന ഉപസർഗം പ്രത്യക്ഷതയുടെ മാധ്യമമോ രൂപപരമായ സാഹചര്യവുമോ സൂചിപ്പിക്കുന്നതായി നിലനിർത്തുന്നു. നിർദേശകപ്രത്യയം ഇല്ലാത്തതിനാൽ മലയാളത്തിൽ ഒരു എന്നു ചേർക്കുന്നത് ആദ്യ പരാമർശം സ്വാഭാവികമാക്കുന്നു.
- source_word: וַיַּעֲמֹד
  choice: നിന്നു
  rationale: עמד എന്ന ക്രിയയുടെ സാക്ഷാൽ സ്ഥലപരമായ ദൃശ്യഭാവം ലളിതവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: עַמּוּד הֶעָנָן
  choice: മേഘസ്തംഭം
  rationale: ആദ്യം പറഞ്ഞ മേഘസ്തംഭത്തെ നിർദിഷ്ടമായി വീണ്ടും പരാമർശിക്കുന്നു; മലയാളത്തിൽ ആവർത്തിച്ച നാമം തന്നെ ഈ നിർദിഷ്ടത വ്യക്തമാക്കുന്നു.
- source_word: עַל פֶּתַח הָאֹהֶל
  choice: കൂടാരത്തിന്റെ പ്രവേശനകവാടത്തിനരികിൽ
  rationale: ഈ സ്ഥലസന്ദർഭത്തിൽ עַל എന്നത് കവാടത്തിങ്കൽ അല്ലെങ്കിൽ അതിനരികിൽ എന്ന സ്ഥാനബന്ധം സ്വാഭാവികമായി നൽകാം. മുകളിൽ എന്ന കൂടുതൽ സാക്ഷാൽ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: യിസ്രായേലിന്റെ ഉടമ്പടിദൈവത്തിന്റെ വ്യക്തിനാമം ഒരു പദവികൊണ്ട് പകരാതെ സംരക്ഷിക്കുന്നു.
- issue: ദൈവിക പ്രത്യക്ഷതയുടെ വിവരണം
  choice: കൂടാരത്തിൽ ഒരു മേഘസ്തംഭത്തിൽ പ്രത്യക്ഷനായി
  alternative: കൂടാരത്തിനരികിൽ മേഘസ്തംഭമായി പ്രത്യക്ഷനായി; മേഘസ്തംഭത്തിലൂടെ പ്രത്യക്ഷനായി
  rationale: ദൈവം മേഘസ്തംഭത്തിൽ പ്രത്യക്ഷപ്പെട്ടുവെന്ന മൂലപാഠത്തിന്റെ സാക്ഷാൽ ചിത്രണം നിലനിർത്തുകയും, ദൈവവും മേഘസ്തംഭവും പൂർണമായി ഒന്നാണെന്നോ അത് വെറും ഉപകരണമാണെന്നോ തീർപ്പുകൽപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പ്രവേശനകവാടം’ വ്യക്തതയ്ക്കായി ഉപയോഗിച്ചു; ആവർത്തനവും ദൃശ്യഭാവവും മൂലപാഠത്തിന് അനുസൃതമായി നിലനിർത്തി.
