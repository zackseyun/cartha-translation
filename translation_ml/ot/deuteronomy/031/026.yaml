reference: Deuteronomy 31:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לָקֹ֗חַ אֵ֣ת סֵ֤פֶר הַ/תּוֹרָה֙ הַ/זֶּ֔ה וְ/שַׂמְתֶּ֣ם אֹת֔/וֹ מִ/צַּ֛ד אֲר֥וֹן בְּרִית יְהוָ֖ה אֱלֹהֵי/כֶ֑ם וְ/הָֽיָה שָׁ֥ם בְּ/ךָ֖ לְ/עֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/026.yaml
  text: Take this Book of the Law and place it beside the ark of the covenant of Yahweh your God[b][a], and let it remain there as a witness against you.
translation:
  language: ml
  text: ന്യായപ്രമാണത്തിന്റെ ഈ പുസ്തകം[a] എടുത്ത് നിങ്ങളുടെ ദൈവമായ യഹ്‌വെയുടെ ഉടമ്പടിപ്പെട്ടകത്തിന്റെ അരികിൽ വെക്കുവിൻ. അത് അവിടെ നിങ്ങൾക്കെതിരായ സാക്ഷിയായിരിക്കും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ന്യായപ്രമാണത്തിന്റെ ഈ ചുരുൾ.’ ഹീബ്രായത്തിലെ סֵפֶר എന്ന പദം ചുരുളിനെയോ മറ്റൊരു എഴുത്തുരേഖയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അതായത്, നിങ്ങൾ ഉടമ്പടി ലംഘിച്ചാൽ, അത് നിങ്ങൾക്കെതിരായി സാക്ഷ്യം വഹിക്കും.
    reason: cultural_note
lexical_decisions:
- source_word: לָקֹחַ
  choice: എടുത്ത്
  rationale: ഇവിടെ ക്രിയാനാമരൂപം ആജ്ഞയുടെ ശക്തിയോടെയാണ് ഉപയോഗിച്ചിരിക്കുന്നത്. തുടർന്നുള്ള ‘വെക്കുക’ എന്ന ആജ്ഞയുമായി ചേർത്ത ‘എടുത്ത്’ മലയാളത്തിൽ സ്വാഭാവികമായി അതേ നിർദേശം നൽകുന്നു.
- source_word: סֵפֶר הַתּוֹרָה הַזֶּה
  choice: ഈ ന്യായപ്രമാണപുസ്തകം
  rationale: סֵפֶר എന്നത് പുസ്തകമോ ചുരുളോ ആയ എഴുത്തുരേഖയെ സൂചിപ്പിക്കാം; תּוֹרָה ഇവിടെ ഉടമ്പടിയോടു ബന്ധപ്പെട്ട നിയമോപദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ന്യായപ്രമാണപുസ്തകം’ ഈ പ്രത്യേക അർഥം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וְשַׂמְתֶּם אֹתוֹ
  choice: വെക്കുക
  rationale: שׂוּם എന്നതിന്റെ ‘വെക്കുക/സ്ഥാപിക്കുക’ എന്ന മൂർത്തമായ പ്രവർത്തനം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: מִצַּד
  choice: അരികിൽ
  rationale: പെട്ടകത്തിനുള്ളിലല്ല, അതിന്റെ വശത്തോ സമീപത്തോ വെക്കണമെന്ന സ്ഥലബന്ധം കൃത്യമായി സൂചിപ്പിക്കുന്നു.
- source_word: אֲרוֹן בְּרִית
  choice: ഉടമ്പടിപ്പെട്ടകം
  rationale: ഹീബ്രായ സംയുക്തപദത്തിന്റെ അർഥം ചുരുക്കമായും മലയാള ബൈബിൾഭാഷയിൽ തിരിച്ചറിയാവുന്ന വിധത്തിലും നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവികൊണ്ട് മാറ്റാതെ, അതിന്റെ സാധാരണ പണ്ഡിതോചിത ഉച്ചാരണമായ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവമായ
  rationale: ബഹുവചന അഭിസംബോധനയും യഹ്‌വെയുമായുള്ള സമപ്രയോഗബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְהָיָה שָׁם
  choice: അത് അവിടെ ... നിലകൊള്ളട്ടെ
  rationale: വെച്ചതിനുശേഷം അവിടെ തുടരുന്ന ഉദ്ദേശിതാവസ്ഥയെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּךָ
  choice: നിങ്ങൾക്കെതിരായ
  rationale: לְעֵד בְּ എന്ന ഉടമ്പടി-ന്യായവ്യവഹാരപ്രയോഗത്തിൽ സാക്ഷ്യം ജനത്തിനെതിരെ നിൽക്കുന്നതാണ്. ‘നിങ്ങൾ’ ഇസ്രായേലിനെ സമൂഹമായി അഭിസംബോധന ചെയ്യുന്നതിനെ നിലനിർത്തുന്നു.
- source_word: לְעֵד
  choice: സാക്ഷിയായി
  rationale: עֵד എന്നതിന്റെ അടിസ്ഥാനമായ ന്യായവ്യവഹാര അർഥമായ ‘സാക്ഷി’ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: പുസ്തകത്തിന്റെ സാക്ഷ്യധർമ്മം
  choice: ഉടമ്പടി ലംഘിക്കുമ്പോൾ ഇസ്രായേലിനെതിരെ നിൽക്കുന്ന സാക്ഷി
  alternative: കുറ്റാരോപണസ്വഭാവമില്ലാത്ത ഒരു സ്മാരകമോ നിഷ്പക്ഷ സാക്ഷ്യമോ
  rationale: ആവർത്തനപുസ്തകത്തിലെ ഉടമ്പടി-ന്യായവ്യവഹാര പശ്ചാത്തലത്തിൽ לְעֵד בְּךָ എന്ന പ്രയോഗം ജനത്തിനെതിരായ സാക്ഷ്യത്തെയാണ് സൂചിപ്പിക്കുന്നത്. പാഠത്തിൽ ‘നിങ്ങൾക്കെതിരായ’ എന്നു നൽകുകയും അതിന്റെ സാന്ദർഭിക അർഥം അടിക്കുറിപ്പിൽ വിശദീകരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘യഹ്‌വെ’ എന്ന വ്യക്തിനാമം നിലനിർത്തി; ‘ഉടമ്പടിപ്പെട്ടകം,’ ‘സാക്ഷി’ എന്നീ പദങ്ങൾ ഉടമ്പടി-ന്യായവ്യവഹാര പശ്ചാത്തലം വ്യക്തമാക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും അവ വിശദീകരിക്കുന്ന വാക്യഭാഗങ്ങൾക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
