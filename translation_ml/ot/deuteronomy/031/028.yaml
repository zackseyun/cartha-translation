source:
  edition: WLC
  text: הַקְהִ֧ילוּ אֵלַ֛/י אֶת כָּל זִקְנֵ֥י שִׁבְטֵי/כֶ֖ם וְ/שֹׁטְרֵי/כֶ֑ם וַ/אֲדַבְּרָ֣ה בְ/אָזְנֵי/הֶ֗ם אֵ֚ת הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה וְ/אָעִ֣ידָה בָּ֔/ם אֶת הַ/שָּׁמַ֖יִם וְ/אֶת הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/028.yaml
  text: Gather to me all the elders of your tribes and your officers[a], that I may speak these words in their hearing and call heaven and earth to witness against them.
translation:
  language: ml
  text: നിങ്ങളുടെ ഗോത്രങ്ങളിലെ എല്ലാ മൂപ്പന്മാരെയും ഉദ്യോഗസ്ഥരെയും എന്റെ അടുക്കൽ കൂട്ടിവരുത്തുക; ഞാൻ ഈ വാക്കുകൾ അവരുടെ കേൾവിയിൽ പറയാനും ആകാശത്തെയും ഭൂമിയെയും[a] അവർക്കെതിരെ സാക്ഷികളായി വിളിച്ചുനിർത്താനും വേണ്ടി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ആകാശങ്ങളെയും ഭൂമിയെയും.’ ആവർത്തനപുസ്തകത്തിൽ ഇത് ആകാശത്തെയും ഭൂമിയെയും ഉടമ്പടിയുടെ സാക്ഷികളായി വിളിച്ചുനിർത്തുന്ന പതിവുപ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְהִילוּ
  choice: കൂട്ടിവരുത്തുക
  rationale: קהל എന്ന ധാതുവിന്റെ ഹിഫീൽ ബഹുവചന ആജ്ഞാരൂപം മറ്റുള്ളവരെ ഒരുമിച്ചുകൂട്ടാൻ കല്പിക്കുന്ന കാരണാർത്ഥം വഹിക്കുന്നു. ‘കൂട്ടിവരുത്തുക’ ആ ഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: אֵלַי
  choice: എന്റെ അടുക്കൽ
  rationale: ഒന്നാംപുരുഷ പ്രത്യയത്തോടുകൂടിയ ഈ ഉപസർഗത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘എന്റെ അടുക്കൽ’ എന്നാണ്.
- source_word: זִקְנֵי שִׁבְטֵיכֶם
  choice: നിങ്ങളുടെ ഗോത്രങ്ങളിലെ എല്ലാ മൂപ്പന്മാരെയും
  rationale: ഗോത്രങ്ങളോടു ബന്ധപ്പെട്ട മൂപ്പന്മാരെ സൂചിപ്പിക്കുന്ന സംയുക്തപദബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു; כָּל എന്ന ‘എല്ലാ’യും തുറന്നുപറയുന്നു.
- source_word: שֹׁטְרֵיכֶם
  choice: നിങ്ങളുടെ ഉദ്യോഗസ്ഥരെയും
  rationale: ആവർത്തനപുസ്തകത്തിലെ ഭരണപരമായ സന്ദർഭത്തിൽ ഈ പദം കീഴ്ത്തലത്തിലുള്ള നേതാക്കളെയോ ഔദ്യോഗിക ചുമതലയുള്ളവരെയോ സൂചിപ്പിക്കുന്നു. ‘എഴുത്തുകാർ’ എന്നത് ഇവിടെ അനാവശ്യമായി ഇടുങ്ങിയതാണ്.
- source_word: וַאֲדַבְּרָה
  choice: ഞാൻ ... പറയുകയും ... ചെയ്യട്ടെ
  rationale: കോഹോർട്ടേറ്റീവ് രൂപം കൂട്ടിവരുത്തലിനെ തുടർന്നുള്ള മോശെയുടെ ഉദ്ദേശിച്ച പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘ചെയ്യട്ടെ’ ഉദ്ദേശഭാവം നിലനിർത്തുന്നു.
- source_word: בְּאָזְנֵיהֶם
  choice: അവർ കേൾക്കെ
  rationale: അക്ഷരാർഥത്തിൽ ‘അവരുടെ ചെവികളിൽ’ എന്ന എബ്രായ പ്രയോഗം അവർക്ക് കേൾക്കത്തക്കവിധം പറയുക എന്നതാണ്; ‘അവർ കേൾക്കെ’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: אֵת הַדְּבָרִים הָאֵלֶּה
  choice: ഈ വാക്കുകൾ
  rationale: തുടർന്ന് ഉച്ചരിക്കപ്പെടുന്ന പ്രസംഗത്തെയാണ് דְּבָרִים ഇവിടെ സൂചിപ്പിക്കുന്നത്; അതിനാൽ ‘വാക്കുകൾ’ അനുയോജ്യം.
- source_word: וְאָעִידָה בָּם
  choice: അവർക്കെതിരെ സാക്ഷികളാക്കുകയും ചെയ്യട്ടെ
  rationale: עוּד എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപവും בָּם എന്ന ബന്ധവും ചേർന്ന് ഉടമ്പടിസംബന്ധമായ നിയമപശ്ചാത്തലത്തിൽ സാക്ഷികളെ അവർക്കെതിരെ വിളിച്ചുനിർത്തുന്ന ഭാവം നൽകുന്നു.
- source_word: אֶת הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: ആകാശത്തെയും ഭൂമിയെയും
  rationale: ആവർത്തനപുസ്തകത്തിലെ പതിവായ ഉടമ്പടി-സാക്ഷി പ്രയോഗമാണിത്. മലയാളത്തിൽ ‘ആകാശവും ഭൂമിയും’ സ്വാഭാവികമായ സമഗ്രപ്രയോഗമാണ്; എബ്രായത്തിലെ രൂപപരമായ ബഹുവചനം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഉടമ്പടിയിലെ സാക്ഷികളെ വിളിച്ചുനിർത്തുന്ന പ്രയോഗം
  choice: ആകാശത്തെയും ഭൂമിയെയും അവർക്കെതിരെ സാക്ഷികളാക്കുക
  alternative: ആകാശവും ഭൂമിയും മുഖാന്തരം അവർക്കെതിരെ സാക്ഷ്യം പറയുക
  rationale: ഇവിടെ ആകാശവും ഭൂമിയും ഇസ്രായേലിന്റെ ഉത്തരവാദിത്വത്തിനെതിരായ സാക്ഷികളായി വ്യക്തിവൽക്കരിക്കപ്പെടുന്നു. തിരഞ്ഞെടുത്ത രൂപം ആ നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ ഭാവം വിശദീകരിച്ചുതീർക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലപാഠത്തിലെ ആജ്ഞയും തുടർന്നുള്ള കോഹോർട്ടേറ്റീവ് ഉദ്ദേശഭാവവും വേർതിരിക്കാൻ രണ്ടു വാക്യങ്ങൾ ഉപയോഗിച്ചു. നൽകിയ ഇംഗ്ലീഷ് പാഠത്തിൽ [a] ഉദ്യോഗസ്ഥർക്ക് പിന്നാലെയുണ്ടെങ്കിലും അടിക്കുറിപ്പിന്റെ ഉള്ളടക്കം ശമയിം–എരെറ്റ്‌സ് പ്രയോഗത്തെക്കുറിച്ചായതിനാൽ പ്രസക്തമായ ‘ആകാശത്തെയും ഭൂമിയെയും’ എന്നതിന് പിന്നാലെ അടയാളം സ്ഥാപിച്ചു.
