source:
  edition: WLC
  text: וְ/אָנֹכִ֗י הַסְתֵּ֨ר אַסְתִּ֤יר פָּנַ/י֙ בַּ/יּ֣וֹם הַ/ה֔וּא עַ֥ל כָּל הָ/רָעָ֖ה אֲשֶׁ֣ר עָשָׂ֑ה כִּ֣י פָנָ֔ה אֶל אֱלֹהִ֖ים אֲחֵרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/018.yaml
  text: And I myself will surely hide my face on that day because of all the evil that he has done[a], because he has turned to other gods.
translation:
  language: ml
  text: ഞാൻ തന്നെ, അവൻ ചെയ്ത സകല തിന്മയും നിമിത്തം ആ നാളിൽ എന്റെ മുഖം തീർച്ചയായും മറയ്ക്കും[a]; കാരണം, അവൻ അന്യദൈവങ്ങളിലേക്കു തിരിഞ്ഞിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘എന്റെ സാന്നിധ്യം’; എബ്രായത്തിൽ അക്ഷരാർഥം ‘എന്റെ മുഖം’ എന്നാണ്. ദൈവം തന്റെ പ്രസാദമോ സാന്നിധ്യമോ പിൻവലിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ശൈലിയാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: ഞാൻ തന്നെയാകട്ടെ
  rationale: സ്വതന്ത്രമായ ഒന്നാംപുരുഷ സർവനാമമായ אָנֹכִי നൽകുന്ന ഊന്നൽ ‘ഞാൻ തന്നെ’ എന്ന പ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു; വാക്യബന്ധവും സന്ദർഭത്തിലെ നേരിയ വൈരുധ്യവും ‘-ആകട്ടെ’ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: הַסְתֵּר אַסְתִּיר
  choice: തീർച്ചയായും മറയ്ക്കും
  rationale: ക്രിയാനാമരൂപവും സമാപികാക്രിയയും ചേർന്നുള്ള എബ്രായ ഊന്നൽ മലയാളത്തിൽ ‘തീർച്ചയായും’ എന്ന പദംകൊണ്ട് വ്യക്തമാക്കുന്നു.
- source_word: פָּנַי
  choice: എന്റെ മുഖം
  rationale: മൂലത്തിലെ ദൃശ്യവും മനുഷ്യരൂപകവുമായ പ്രയോഗം വ്യാഖ്യാനിച്ച് ലഘൂകരിക്കാതെ അക്ഷരാർഥത്തിൽ നിലനിർത്തുന്നു.
- source_word: בַּיּוֹם הַהוּא
  choice: ആ നാളിൽ
  rationale: കാലസൂചനയും നിർദേശകഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: עַל כָּל הָרָעָה
  choice: സകല തിന്മയും നിമിത്തം
  rationale: עַל ഇവിടെ കാരണത്തെ സൂചിപ്പിക്കുന്നു; הָרָעָה ഈ സന്ദർഭത്തിൽ ദുരന്തമല്ല, ധാർമിക തിന്മയാണ്.
- source_word: אֲשֶׁר עָשָׂה
  choice: അവൻ ചെയ്ത
  rationale: ഇസ്രായേലിനെ ഏകവചന വ്യക്തിയായി അവതരിപ്പിക്കുന്ന 3-ാം പുരുഷ പുല്ലിംഗ ഏകവചനരൂപം ‘അവൻ’ എന്നു നിലനിർത്തുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: തുടർന്നുവരുന്ന വാക്യഭാഗം ദൈവിക പ്രതികരണത്തിനുള്ള കാരണം വിശദീകരിക്കുന്നതായി വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: פָנָה אֶל
  choice: തിരിഞ്ഞിരിക്കുന്നു
  rationale: ദിശമാറ്റത്തിനൊപ്പം കൂറിലോ ആരാധനയിലോ വന്ന മാറ്റവും ഉൾക്കൊള്ളാൻ കഴിയുന്ന സ്വാഭാവിക പ്രയോഗമാണിത്; അർഥം അമിതമായി വിശദീകരിക്കുന്നില്ല.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: അന്യദൈവങ്ങൾ
  rationale: യഹോവയല്ലാത്ത ദേവന്മാരെ സൂചിപ്പിക്കുന്ന പതിവ് എബ്രായപ്രയോഗത്തിന് സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളരൂപം.
theological_decisions:
- issue: ദൈവം തന്റെ മുഖം മറയ്ക്കുന്നു എന്ന മനുഷ്യരൂപകപ്രയോഗം
  choice: പ്രധാനപാഠത്തിൽ ‘എന്റെ മുഖം ... മറയ്ക്കും’ എന്നു നിലനിർത്തുക
  alternative: ‘എന്റെ സാന്നിധ്യം പിൻവലിക്കും’ എന്നു വ്യാഖ്യാനിച്ച് പരിഭാഷപ്പെടുത്തുക
  rationale: എബ്രായത്തിലെ സാക്ഷാൽ ദൃശ്യപ്രയോഗം ദൈവിക പ്രസാദമോ സാന്നിധ്യമോ പിൻവലിക്കുന്നതായി മനസ്സിലാക്കാമെങ്കിലും, ആ വ്യാഖ്യാനം പ്രധാനപാഠത്തിൽ നിർബന്ധിക്കാതെ പാഠത്തിന്റെ ദൈവശാസ്ത്രപരമായ സംഘർഷം സംരക്ഷിക്കുന്നു.
- issue: ഇസ്രായേലിനെ സൂചിപ്പിക്കുന്ന ഏകവചനരൂപം
  choice: ‘അവൻ ചെയ്ത ... അവൻ ... തിരിഞ്ഞിരിക്കുന്നു’ എന്ന ഏകവചനം നിലനിർത്തുക
  alternative: ‘അവർ ചെയ്ത ... അവർ തിരിഞ്ഞിരിക്കുന്നു’ എന്ന ബഹുവചനം ഉപയോഗിക്കുക
  rationale: എബ്രായക്രിയകൾ പുല്ലിംഗ ഏകവചനത്തിലാണ്; ഇസ്രായേലിനെ ഒരു കൂട്ടായ വ്യക്തിയായി അവതരിപ്പിക്കുന്ന മൂലപാഠത്തിന്റെ രൂപം മാറ്റുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘സകല’, ‘നിമിത്തം’, ‘അന്യദൈവങ്ങൾ’ എന്നീ പദങ്ങൾ തിരുവെഴുത്തിന്റെ ഗൗരവം നിലനിർത്തുമ്പോഴും വാക്യഘടന ലളിതമായി സൂക്ഷിച്ചിട്ടുണ്ട്.
