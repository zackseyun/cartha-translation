  text: כִּ֣י אָנֹכִ֤י יָדַ֨עְתִּי֙ אֶֽת מֶרְיְ/ךָ֔ וְ/אֶֽת עָרְפְּ/ךָ֖ הַ/קָּשֶׁ֑ה הֵ֣ן בְּ/עוֹדֶ/נִּי֩ חַ֨י עִמָּ/כֶ֜ם הַ/יּ֗וֹם מַמְרִ֤ים הֱיִתֶם֙ עִם יְהֹוָ֔ה וְ/אַ֖ף כִּי אַחֲרֵ֥י מוֹתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/027.yaml
  text: For I know your rebellion and your stiff neck[a]. Look, while I am still alive with you today, you have been rebellious against Yahweh[b]; and how much more after my death!
translation:
  language: ml
  text: നിങ്ങളുടെ ധിക്കാരവും നിങ്ങളുടെ ശാഠ്യമുള്ള കഴുത്തും[a] എനിക്കറിയാം. ഇതാ, ഇന്നു ഞാൻ നിങ്ങളോടുകൂടെ ഇപ്പോഴും ജീവിച്ചിരിക്കുമ്പോൾത്തന്നെ നിങ്ങൾ യാഹ്‌വേയ്‌ക്കെതിരെ മത്സരിച്ചുകൊണ്ടിരിക്കുന്നു[b]; എന്റെ മരണശേഷം എത്രയധികം!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘നിങ്ങളുടെ ശാഠ്യമുള്ള കഴുത്ത്’; ദുശ്ശാഠ്യത്തെയോ വഴങ്ങാത്ത മനോഭാവത്തെയോ സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകമാണിത്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘യാഹ്‌വേയോടുകൂടെ’; ഇവിടെ മത്സരത്തിന്റെ സന്ദർഭത്തിൽ യാഹ്‌വേയ്‌ക്കെതിരായ എതിർപ്പാണ് അർത്ഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶרְיְךָ
  choice: നിന്റെ മത്സരം
  rationale: ഉടമ്പടിയോടുള്ള എതിർപ്പും ധിക്കാരവും സൂചിപ്പിക്കുന്ന നാമരൂപം നിലനിർത്തുന്നു.
- source_word: עָרְפְּךָ הַקָּשֶׁה
  choice: നിന്റെ കടുത്ത കഴുത്ത്
  rationale: ദുശ്ശാഠ്യത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം വിവർത്തനത്തിൽ നിലനിർത്തുന്നു; അർത്ഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: הֵן
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന വ്യവഹാരകണത്തിന്റെ ഊന്നൽ സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְּעוֹדֶנִּי חַי
  choice: ഞാൻ ഇന്നും ... ജീവനോടിരിക്കുമ്പോൾത്തന്നെ
  rationale: മോശെ ഇപ്പോഴും ജീവനോടെയും ജനത്തോടൊപ്പവും ഉള്ള കാലത്തെ ഊന്നിപ്പറയുന്നു.
- source_word: מַמְרִים הֱיִתֶם
  choice: നിങ്ങൾ ... മത്സരിച്ചുപോന്നു
  rationale: היה സഹിതമുള്ള കൃദന്തരൂപത്തിന്റെ തുടർച്ചയുള്ള, പതിവായ നില മലയാളത്തിലെ ‘-ച്ചുപോന്നു’ വഴി പ്രകടമാക്കുന്നു.
- source_word: עִם יְהוָה
  choice: യഹോവയോടു
  rationale: עִם എന്നതിന്റെ ഉപരിതല അർത്ഥമായ ‘കൂടെ/യോടു’ നിലനിർത്തുമ്പോഴും ‘മത്സരിക്കുക’ എന്ന ക്രിയ പ്രസക്തിയിൽ എതിർപ്പിന്റെ അർത്ഥം വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുർവ്യഞ്ജനത്തെ മലയാളത്തിൽ പ്രചാരമുള്ള വ്യക്തിനാമരൂപമായി നേരിട്ട് നൽകുന്നു; ഒരു സ്ഥാനപ്പേര് ഉപയോഗിക്കുന്നില്ല.
- source_word: וְאַף כִּי
  choice: എത്രയധികം
  rationale: ഇപ്പോഴത്തെ മത്സരത്തിൽനിന്ന് മോശെയുടെ മരണശേഷമുള്ള കൂടുതൽ വലിയ സാധ്യതയിലേക്കുള്ള വാഗ്വൈഭവപരമായ ഉയർച്ച സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: אַחֲרֵי מוֹתִי
  choice: എന്റെ മരണശേഷം
  rationale: എബ്രായത്തിലെ നാമപദഘടനയും കാലബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമം ഉപയോഗിക്കുന്നതിനാൽ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നതിനു പകരം മലയാളത്തിൽ പരിചിതമായ ദൈവനാമരൂപം നിലനിർത്തുന്നു.
- issue: עִם יְהוָה എന്നതിലെ ബന്ധസൂചന
  choice: യഹോവയോടു മത്സരിക്കുക
  alternative: യഹോവയ്ക്കെതിരെ മത്സരിക്കുക
  rationale: עִם എന്നതിന്റെ ‘യോടു/കൂടെ’ എന്ന രൂപം സംരക്ഷിക്കുകയും ‘മത്സരിക്കുക’ എന്ന ക്രിയയിലൂടെ എതിർപ്പിന്റെ പ്രസക്ത്യർത്ഥം വ്യക്തമാക്കുകയും ചെയ്യുന്നു; അടിക്കുറിപ്പിൽ മറ്റൊരു സ്വാഭാവിക രൂപം രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ ശൈലി. ‘കടുത്ത കഴുത്ത്’ എന്ന മൂലരൂപകം ഉദ്ദേശപൂർവം നിലനിർത്തി അടിക്കുറിപ്പിലൂടെ വിശദീകരിച്ചു. ഏകവചനമായ ‘നിന്റെ’ ജനത്തെ സമഷ്ടിയായി അഭിസംബോധന ചെയ്യുന്നതും തുടർന്ന് ബഹുവചനമായ ‘നിങ്ങൾ’ വരുന്നതുമായ എബ്രായത്തിലെ സംഖ്യാമാറ്റം സംരക്ഷിച്ചു.
