source:
  edition: WLC
  text: וּ/בְנֵי/הֶ֞ם אֲשֶׁ֣ר לֹֽא יָדְע֗וּ יִשְׁמְעוּ֙ וְ/לָ֣מְד֔וּ לְ/יִרְאָ֖ה אֶת יְהוָ֣ה אֱלֹהֵי/כֶ֑ם כָּל הַ/יָּמִ֗ים אֲשֶׁ֨ר אַתֶּ֤ם חַיִּים֙ עַל הָ֣/אֲדָמָ֔ה אֲשֶׁ֨ר אַתֶּ֜ם עֹבְרִ֧ים אֶת הַ/יַּרְדֵּ֛ן שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/013.yaml
  text: And their children[a], who have not known[c][b], shall hear and learn to fear Yahweh your God all the days that you live on the land that you are crossing the Jordan to possess.
translation:
  language: ml
  text: നിങ്ങൾ യോർദ്ദാൻ കടന്ന് കൈവശമാക്കാനായി[c] ചെല്ലുന്ന ദേശത്ത് നിങ്ങൾ ജീവിക്കുന്ന എല്ലാ ദിവസവും, അറിയാത്ത അവരുടെ മക്കൾ[a] കേൾക്കുകയും നിങ്ങളുടെ ദൈവമായ യാഹ്‌വേയെ[b] ഭയപ്പെടാൻ പഠിക്കുകയും ചെയ്യും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവരുടെ പുത്രന്മാർ.’ ഹീബ്രു പദം പ്രത്യേകമായി പുത്രന്മാരെയോ വിശാലമായി മക്കളെയോ സന്തതിയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: 'ഹീബ്രു: ‘YHWH’; പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്താറുണ്ട്.'
    reason: alternative_reading
  - marker: c
    text: അഥവാ, ‘അവകാശമാക്കാനായി’ അല്ലെങ്കിൽ ‘സ്വന്തമാക്കാനായി.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵיהֶם
  choice: അവരുടെ മക്കൾ
  rationale: בנים എന്ന പദത്തിന് ‘പുത്രന്മാർ’ എന്നും വിശാലമായി ‘മക്കൾ/സന്തതി’ എന്നും അർഥമാകാം. അടുത്ത തലമുറയുടെ ഉടമ്പടി-പഠനമാണ് സന്ദർഭം; അതിനാൽ ‘മക്കൾ’ സ്വാഭാവികവും സന്ദർഭോചിതവും ആണ്.
- source_word: אֲשֶׁר לֹא יָדְעוּ
  choice: ഒന്നും അറിഞ്ഞിട്ടില്ലാത്ത
  rationale: ידע എന്ന ക്രിയയുടെ സമ്പൂർണരൂപം മുൻപരിചയമോ മുൻഅറിവോ ഇല്ലെന്ന ആശയം നൽകുന്നു. മലയാളത്തിൽ ഈ കാലഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: יִשְׁמְעוּ וְלָמְדוּ
  choice: അതു കേട്ട് ... പഠിക്കണം
  rationale: കേൾക്കുകയും അതിലൂടെ പഠിക്കുകയും ചെയ്യുന്ന ക്രമം നിലനിർത്തുന്നു. ഇവിടെ അപൂർണക്രിയകൾ പ്രതീക്ഷിക്കപ്പെടുന്ന ഫലത്തോടൊപ്പം നിർദേശാത്മക ഉദ്ദേശവും വഹിക്കുന്നതിനാൽ ‘പഠിക്കണം’ യോജിക്കുന്നു.
- source_word: לְיִרְאָה
  choice: ഭയപ്പെടാൻ
  rationale: ירא ദൈവത്തോടുള്ള ഉടമ്പടിപരമായ ഭയഭക്തിയെ സൂചിപ്പിക്കുന്നു. ‘ഭയപ്പെടുക’ എന്നത് അതിന്റെ ഗൗരവവും അടിസ്ഥാന രൂപകവും സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ഹീബ്രു ദൈവനാമമായ יהוה ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിലെ പ്രചാരത്തിലുള്ള നാമരൂപത്തിൽ നൽകുന്നു.
- source_word: כָּל־הַיָּמִים אֲשֶׁר אַתֶּם חַיִּים עַל־הָאֲדָמָה
  choice: ദേശത്ത് ജീവിക്കുന്ന കാലമൊക്കെയും
  rationale: ‘നിങ്ങൾ ജീവിക്കുന്ന എല്ലാ ദിവസങ്ങളിലും’ എന്ന ഹീബ്രു ദൈർഘ്യപ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; אֲדָמָה ഇവിടെ മണ്ണിനേക്കാൾ ദേശഭൂമിയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אֲשֶׁר אַתֶּם עֹבְרִים אֶת־הַיַּרְדֵּן שָׁמָּה לְרִשְׁתָּהּ
  choice: നിങ്ങൾ കൈവശമാക്കേണ്ടതിന് യോർദ്ദാൻ കടന്നുചെല്ലുന്ന ദേശം
  rationale: שמהയുടെ ലക്ഷ്യദിശയും ירשׁയുടെ കൈവശപ്പെടുത്തൽ അർഥവും സംരക്ഷിക്കുന്നു. ‘കടന്നുചെല്ലുന്ന’ എന്നത് നദി കടന്ന് ആ ദേശത്തേക്കുള്ള നീക്കം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമമായ ചതുരക്ഷര ദൈവനാമം ഉപയോഗിക്കുന്നു. അതിനെ ഒരു പദവിയാൽ പകരാതെ മലയാള വായനക്കാർക്ക് പരിചിതമായ ലിപ്യന്തരണരൂപം നിലനിർത്തി.
- issue: בנים എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: മക്കൾ
  alternative: പുത്രന്മാർ
  rationale: ഇവിടെ പഠിപ്പിക്കപ്പെടേണ്ട അടുത്ത തലമുറയെ മൊത്തമായി സൂചിപ്പിക്കുന്നതിനാൽ ആൺമക്കളിലേക്ക് മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- issue: ירא എന്നതിലെ ഭയവും ഭക്തിയും
  choice: ഭയപ്പെടാൻ
  alternative: ഭക്തിയോടെ ആദരിക്കാൻ
  rationale: വിശദീകരണാത്മകമായ മൃദൂകരണം ഒഴിവാക്കി ഹീബ്രുവിലെ യഥാർഥ ദൈവഭയത്തിന്റെ ഭാഷയും അതിലുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഹീബ്രുവിലെ ദീർഘവാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി; ആവർത്തനസൂചനയായ ‘അങ്ങനെ’ മുൻവാക്യത്തിലെ കേൾക്കൽ, പഠിക്കൽ, ദൈവഭയം എന്നിവയെ തിരിച്ചുചൂണ്ടുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
