revisions:
- from: 'ഇപ്പോൾ നിങ്ങൾക്കായി ഈ പാട്ട് എഴുതുകയും അത് ഇസ്രായേൽമക്കളെ[a] പഠിപ്പിക്കുകയും ചെയ്യുവിൻ; അത് അവരുടെ വായിൽ വെക്കുവിൻ. അങ്ങനെ ഈ പാട്ട് ഇസ്രായേൽമക്കൾക്കെതിരെ[b] എനിക്കൊരു സാക്ഷിയായിരിക്കട്ടെ.


