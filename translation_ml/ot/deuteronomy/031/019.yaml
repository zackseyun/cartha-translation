reference: Deuteronomy 31:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עַתָּ֗ה כִּתְב֤וּ לָ/כֶם֙ אֶת הַ/שִּׁירָ֣ה הַ/זֹּ֔את וְ/לַמְּדָ֥/הּ אֶת בְּנֵי יִשְׂרָאֵ֖ל שִׂימָ֣/הּ בְּ/פִי/הֶ֑ם לְמַ֨עַן תִּהְיֶה לִּ֜/י הַ/שִּׁירָ֥ה הַ/זֹּ֛את לְ/עֵ֖ד בִּ/בְנֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/019.yaml
  text: And now[a], write this song for yourselves, and teach it to the sons of Israel; put it in their mouths[b], so that this song may be a witness for me against the sons of Israel.
translation:
  language: ml
  text: 'ഇപ്പോൾ, നിങ്ങൾക്കുവേണ്ടി ഈ പാട്ട് എഴുതുവിൻ; അത് ഇസ്രായേൽമക്കൾക്കു[a] പഠിപ്പിക്കുവിൻ; അവരുടെ വായിൽ അതു വെക്കുവിൻ. അങ്ങനെ ഈ പാട്ട് ഇസ്രായേൽമക്കൾക്കെതിരെ[b] എനിക്കുവേണ്ടി സാക്ഷിയായിരിക്കേണ്ടതിന്.


    [a] അഥവാ, “ഇസ്രായേൽജനം.” ഈ വാക്യത്തിൽ രണ്ടിടത്തും എബ്രായപാഠം അക്ഷരാർഥത്തിൽ “ഇസ്രായേലിന്റെ പുത്രന്മാർ” എന്നാണ്.


    [b] അഥവാ, “ഇസ്രായേൽമക്കളുടെ ഇടയിൽ.” എബ്രായത്തിലെ ഉപസർഗം അക്ഷരാർഥത്തിൽ “ഇൽ/ഇടയിൽ” എന്നു മനസ്സിലാക്കാം; എന്നാൽ ഇവിടെ ഈ പാട്ട് അവർക്കെതിരായ സാക്ഷിയായി നിൽക്കുന്നതാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇസ്രായേൽജനം.” ഈ വാക്യത്തിൽ രണ്ടിടത്തും എബ്രായപാഠം അക്ഷരാർഥത്തിൽ “ഇസ്രായേലിന്റെ പുത്രന്മാർ” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ഇസ്രായേൽമക്കളുടെ ഇടയിൽ.” എബ്രായത്തിലെ ഉപസർഗം അക്ഷരാർഥത്തിൽ “ഇൽ/ഇടയിൽ” എന്നു മനസ്സിലാക്കാം; എന്നാൽ ഇവിടെ ഈ പാട്ട് അവർക്കെതിരായ സാക്ഷിയായി നിൽക്കുന്നതാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: വാക്യത്തിലെ മാറ്റവും അടിയന്തരതയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു; മുൻവാക്യബന്ധം സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: כִּתְבוּ לָכֶם
  choice: നിങ്ങൾക്കായി ... എഴുതുകയും ... ചെയ്യുവിൻ
  rationale: ബഹുവചന ആജ്ഞയും לָכֶם എന്ന ദത്ത/പ്രതിഫലന ഭാവവും നിലനിർത്തുന്നു.
- source_word: הַשִּׁירָה הַזֹּאת
  choice: ഈ പാട്ട്
  rationale: שִׁירָה എന്നതിന്റെ നേരിട്ടും സന്ദർഭോചിതവുമായ അർഥം ‘പാട്ട്’ ആണ്.
- source_word: וְלַמְּדָהּ אֶת בְּנֵי יִשְׂרָאֵל
  choice: അത് ഇസ്രായേൽമക്കളെ പഠിപ്പിക്കുകയും ചെയ്യുവിൻ
  rationale: സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം ‘പാട്ട്’ എന്ന നാമത്തെ സൂചിപ്പിക്കുന്നു; ‘ഇസ്രായേൽമക്കൾ’ മൂലപാഠത്തിലെ ബന്ധപരമായ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: שִׂימָהּ בְּפִיהֶם
  choice: അത് അവരുടെ വായിൽ വെക്കുവിൻ
  rationale: മനഃപാഠമാക്കി ചൊല്ലിക്കൊടുക്കുക എന്ന ആശയം സൂചിപ്പിക്കുന്ന എബ്രായ ദൃശ്യരൂപം വ്യാഖ്യാനിച്ച് മിനുക്കാതെ നിലനിർത്തുന്നു.
- source_word: לְמַעַן תִּהְיֶה לִּי ... לְעֵד
  choice: അങ്ങനെ ... എനിക്കൊരു സാക്ഷിയായിരിക്കട്ടെ
  rationale: ഉദ്ദേശ്യഫലത്തെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും עֵד എന്നത് ‘സാക്ഷി’യായി നേരിട്ട് പരിഭാഷപ്പെടുത്തുകയും ചെയ്യുന്നു.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾക്കെതിരെ
  rationale: ഉടമ്പടി-ന്യായവ്യവഹാര സന്ദർഭത്തിൽ בְּ എന്ന ഉപസർഗത്തിന് വിരുദ്ധാർഥക ബലം ഉണ്ടെന്ന് സമീപസന്ദർഭം സൂചിപ്പിക്കുന്നു; കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള വായന അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന പ്രയോഗത്തിന്റെ പരിഭാഷ
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേൽജനം; അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’
  rationale: മലയാളത്തിലെ ‘ഇസ്രായേൽമക്കൾ’ എന്ന സ്ഥാപിതവും ഉൾക്കൊള്ളുന്നതുമായ ജനസമൂഹപ്രയോഗം മൂലത്തിലെ വംശപരവും ഉടമ്പടിപരവുമായ തിരിച്ചറിയൽ നിലനിർത്തുന്നു; അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: സാക്ഷിവാക്യത്തിലെ בְּ എന്ന ഉപസർഗത്തിന്റെ ബലം
  choice: ഇസ്രായേൽമക്കൾക്കെതിരെ
  alternative: ഇസ്രായേൽമക്കളുടെ ഇടയിൽ
  rationale: തുടർന്നുള്ള പാട്ട് ഇസ്രായേലിന്റെ ഉടമ്പടിലംഘനത്തെ സാക്ഷ്യപ്പെടുത്തുമെന്ന സന്ദർഭം വിരുദ്ധാർഥക വായനയെ പിന്തുണയ്ക്കുന്നു; സ്ഥലാർഥത്തിലുള്ള യഥാർഥ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘വായിൽ വെക്കുക’ എന്ന മൂലഭാഷാദൃശ്യരൂപം ഉദ്ദേശപൂർവം നിലനിർത്തി; ‘ചൊല്ലിപ്പഠിപ്പിക്കുക’ എന്ന വിശദീകരണപരമായ മിനുക്കൽ ഒഴിവാക്കി. ആജ്ഞാരൂപത്തിൽ ബഹുമാനസൂചകമല്ലാത്ത ബഹുവചനം വ്യക്തമായി സൂക്ഷിച്ചു.
