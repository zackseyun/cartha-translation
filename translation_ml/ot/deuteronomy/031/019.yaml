    [a] അഥവാ, “ഇസ്രായേൽജനം.” ഈ വാക്യത്തിൽ രണ്ടിടത്തും എബ്രായപാഠം അക്ഷരാർഥത്തിൽ “ഇസ്രായേലിന്റെ പുത്രന്മാർ” എന്നാണ്.


