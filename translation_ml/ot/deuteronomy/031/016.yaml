revisions:
- from: 'യഹോവ മോശയോടു പറഞ്ഞു: “ഇതാ, നീ നിന്റെ പിതാക്കന്മാരോടുകൂടെ നിദ്രകൊള്ളാൻ പോകുന്നു. അതിനുശേഷം ഈ ജനം എഴുന്നേറ്റ്, തങ്ങൾ പ്രവേശിക്കുന്ന ദേശത്തിലെ അന്യദേവന്മാരുടെ പിന്നാലെ പരസംഗം ചെയ്യും[a]. അവർ എന്നെ ഉപേക്ഷിക്കുകയും ഞാൻ അവരോടു ചെയ്ത ഉടമ്പടി ലംഘിക്കുകയും ചെയ്യും[b].”'
  to: 'യാഹ്‌വേ മോശയോടു പറഞ്ഞു: “ഇതാ, നീ നിന്റെ പിതാക്കന്മാരോടുകൂടെ നിദ്രകൊള്ളാൻ പോകുന്നു. അതിനുശേഷം ഈ ജനം എഴുന്നേറ്റ്, തങ്ങൾ പ്രവേശിക്കുന്ന ദേശത്തിലെ അന്യദേവന്മാരുടെ പിന്നാലെ പരസംഗം ചെയ്യും[a]. അവർ എന്നെ ഉപേക്ഷിക്കുകയും, ഞാൻ അവരോടു ചെയ്ത ഉടമ്പടി അവർ ലംഘിക്കുകയും ചെയ്യും[b].”'
  rationale: ദൈവനാമം ഇംഗ്ലീഷ് POB-യുടെ Yahweh തീരുമാനത്തോടു യോജിപ്പിച്ച് ‘യാഹ്‌വേ’ എന്നു തിരുത്തി. ബഹുവചന കർത്താവും അന്തിമക്രിയയും കൂടുതൽ വ്യക്തമായി ചേർത്തു. സമൂഹ-ഏകവചനങ്ങളെക്കുറിച്ചുള്ള അടിക്കുറിപ്പ് മൂലപാഠത്തിലെ എല്ലാ പ്രസക്ത ഏകവചനരൂപങ്ങളെയും കൃത്യമായി വിവരിക്കുന്നവിധം വികസിപ്പിക്കുകയും അതിന്റെ അടയാളം പ്രവേശനവാക്യത്തിൽ സ്ഥാപിക്കുകയും ചെയ്തു. അർത്ഥത്തിൽ മാറ്റമില്ല.
