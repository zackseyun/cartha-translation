id: DEU.31.16
reference: Deuteronomy 31:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה הִנְּ/ךָ֥ שֹׁכֵ֖ב עִם אֲבֹתֶ֑י/ךָ וְ/קָם֩ הָ/עָ֨ם הַ/זֶּ֜ה וְ/זָנָ֣ה אַחֲרֵ֣י אֱלֹהֵ֣י נֵֽכַר הָ/אָ֗רֶץ אֲשֶׁ֨ר ה֤וּא בָא שָׁ֨מָּ/ה֙ בְּ/קִרְבּ֔/וֹ וַ/עֲזָבַ֕/נִי וְ/הֵפֵר֙ אֶת בְּרִיתִ֔/י אֲשֶׁ֥ר כָּרַ֖תִּי אִתּֽ/וֹ־־׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/016.yaml
  text: And Yahweh said to Moses[a], “Behold, you are about to lie down with your fathers. Then this people will rise up and prostitute themselves after the foreign gods of the land into whose midst they are entering[b]. They will forsake me and break my covenant that I made with them.”
translation:
  language: ml
  text: 'യാഹ്‌വേ മോശയോടു പറഞ്ഞു: “ഇതാ, നീ നിന്റെ പിതാക്കന്മാരോടുകൂടെ നിദ്രകൊള്ളാൻ പോകുന്നു. അതിനുശേഷം ഈ ജനം എഴുന്നേറ്റ്, തങ്ങൾ പ്രവേശിക്കുന്ന ദേശത്തിലെ അന്യദേവന്മാരുടെ പിന്നാലെ പരസംഗം ചെയ്യും[a]. അവർ എന്നെ ഉപേക്ഷിക്കുകയും, ഞാൻ അവരോടു ചെയ്ത ഉടമ്പടി അവർ ലംഘിക്കുകയും ചെയ്യും[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “അന്യദേവന്മാരുടെ പിന്നാലെ പരസംഗം ചെയ്യും.” വിഗ്രഹാരാധനയിലൂടെ ഉടമ്പടിയോട് അവിശ്വസ്തരാകുന്നതിനെ ലൈംഗിക അവിശ്വസ്തതയുടെ രൂപകത്തിൽ പറയുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: “അവൻ പ്രവേശിക്കുന്നു,” “അതിന്റെ/അവന്റെ മധ്യത്തിലേക്ക്,” “അവനോടു” എന്നിങ്ങനെ എബ്രായത്തിൽ ഏകവചനരൂപങ്ങളാണ്. ഇവ ‘ഈ ജനം’ എന്ന ഇസ്രായേൽജനത്തെ സമൂഹമായി സൂചിപ്പിക്കുന്ന ഏകവചനങ്ങളാണ്; വ്യക്തതയ്ക്കായി മലയാളത്തിൽ ബഹുവചനം ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ, മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: הִנְּךָ שֹׁכֵב עִם אֲבֹתֶיךָ
  choice: ഇതാ, നീ നിന്റെ പിതാക്കന്മാരോടുകൂടെ നിദ്രകൊള്ളാൻ പോകുന്നു
  rationale: മരണത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം നിലനിർത്തുകയും הִנְּךָ നൽകുന്ന ആസന്നത സ്വാഭാവികമായി അറിയിക്കുകയും ചെയ്തു.
- source_word: וְקָם
  choice: അതിനു ശേഷം ഈ ജനം എഴുന്നേറ്റ്
  rationale: മോശയുടെ മരണത്തിനു പിന്നാലെയുള്ള പ്രവചനക്രമം വ്യക്തമാക്കുമ്പോഴും ‘എഴുന്നേൽക്കുക’ എന്ന ക്രിയയുടെ തുറന്ന അർത്ഥം നിലനിർത്തി.
- source_word: וְזָנָה אַחֲרֵי
  choice: പിന്നാലെ പരസംഗം ചെയ്യും
  rationale: വിഗ്രഹാരാധനയെ വിവാഹ/ഉടമ്പടി അവിശ്വസ്തതയായി ചിത്രീകരിക്കുന്ന ശക്തമായ ലൈംഗിക രൂപകം മൃദൂകരിക്കാതെ നിലനിർത്തി.
- source_word: אֱלֹהֵי נֵכַר הָאָרֶץ
  choice: ദേശത്തിലെ അന്യദേവന്മാർ
  rationale: പ്രവേശിക്കാനിരിക്കുന്ന ദേശവുമായി ബന്ധപ്പെട്ട അന്യദേവന്മാരെയാണ് വാക്യഘടന സൂചിപ്പിക്കുന്നത്.
- source_word: וַעֲזָבַנִי
  choice: അവർ എന്നെ ഉപേക്ഷിക്കും
  rationale: ഉടമ്പടിബന്ധത്തിലെ ഗുരുതരമായ കൈവിടലിനെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ അവതരിപ്പിച്ചു.
- source_word: וְהֵפֵר אֶת בְּרִיתִי
  choice: എന്റെ ഉടമ്പടി ലംഘിക്കും
  rationale: הפר എന്ന ക്രിയയുടെ covenant-context അർത്ഥം ‘ലംഘിക്കുക’ വ്യക്തമായി പകരുന്നു.
- source_word: אֲשֶׁר כָּרַתִּי אִתּוֹ
  choice: ഞാൻ അവരോടു ചെയ്ത
  rationale: כרת ברית എന്ന എബ്രായ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ ‘ഉടമ്പടി ചെയ്യുക’ എന്നു നൽകി; ഏകവചന രൂപം ജനത്തെ സമൂഹമായി സൂചിപ്പിക്കുന്നതിനാൽ ബഹുവചനം ഉപയോഗിച്ചു.
theological_decisions:
- issue: വിഗ്രഹാരാധനയെ ലൈംഗിക രൂപകത്തിലൂടെ വിവരിക്കൽ
  choice: ‘പരസംഗം ചെയ്യും’ എന്ന ശക്തമായ രൂപകം നിലനിർത്തി.
  alternative: ‘അവിശ്വസ്തരാകും’ അല്ലെങ്കിൽ ‘ആത്മീയ വ്യഭിചാരം ചെയ്യും’
  rationale: മൂലത്തിലെ זנה മനപ്പൂർവം ഞെട്ടിക്കുന്ന ഉടമ്പടി-അവിശ്വസ്തതയുടെ ഭാഷയാണ്; പൊതുവായ ‘അവിശ്വസ്തത’ അതിന്റെ ശക്തി കുറയ്ക്കും, ‘ആത്മീയ’ എന്നത് മൂലത്തിൽ ഇല്ലാത്ത വ്യാഖ്യാനപദമാണ്.
- issue: ഇസ്രായേലിനെ സൂചിപ്പിക്കുന്ന സമൂഹ ഏകവചനം
  choice: മലയാളത്തിൽ ‘അവർ/അവരോട്’ എന്ന ബഹുവചനം ഉപയോഗിച്ചു.
  alternative: ‘അവൻ/അവനോട്’ എന്ന മൂലരൂപം അതേപടി നിലനിർത്തുക
  rationale: എബ്രായ ഏകവചനം ‘ഈ ജനം’ എന്ന സമൂഹത്തെ ഒന്നായി കാണുന്നു; മലയാളത്തിൽ ബഹുവചനം ഉപയോഗിക്കുന്നത് ഉദ്ദേശ്യസൂചന വ്യക്തമാക്കുകയും അർത്ഥം മാറ്റാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വേദപുസ്തക ശൈലി. മരണത്തെക്കുറിച്ചുള്ള എബ്രായ പ്രയോഗവും വിഗ്രഹാരാധനയുടെ ശക്തമായ ലൈംഗിക രൂപകവും സംരക്ഷിച്ചു; സമൂഹ ഏകവചനം വായനാസ്പഷ്ടതയ്ക്കായി ബഹുവചനമാക്കി. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
