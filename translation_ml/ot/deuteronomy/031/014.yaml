reference: Deuteronomy 31:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה הֵ֣ן קָרְב֣וּ יָמֶי/ךָ֮ לָ/מוּת֒ קְרָ֣א אֶת יְהוֹשֻׁ֗עַ וְ/הִֽתְיַצְּב֛וּ בְּ/אֹ֥הֶל מוֹעֵ֖ד וַ/אֲצַוֶּ֑/נּוּ וַ/יֵּ֤לֶךְ מֹשֶׁה֙ וִֽ/יהוֹשֻׁ֔עַ וַ/יִּֽתְיַצְּב֖וּ בְּ/אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/014.yaml
  text: And Yahweh said to Moses[a], “Behold, your days are drawing near for you to die. Call Joshua, and present yourselves in the tent of meeting, that I may command him.” So Moses and Joshua went and presented themselves in the tent of meeting.
translation:
  language: ml
  text: 'യഹ്‌വേ മോശയോടു പറഞ്ഞു: “ഇതാ, നീ മരിക്കാനുള്ള സമയം അടുത്തിരിക്കുന്നു. യോശുവയെ വിളിക്കുക; നിങ്ങൾ രണ്ടുപേരും സമാഗമകൂടാരത്തിൽ ഹാജരാകുക, അവനു ഞാൻ ആജ്ഞ നൽകേണ്ടതിന്.” അങ്ങനെ മോശയും യോശുവയും പോയി സമാഗമകൂടാരത്തിൽ ഹാജരായി.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ സ്വാഭാവികമായി ഉച്ചരിക്കാവുന്ന ലിപ്യന്തരണമായി നൽകി.
- source_word: הֵן
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന എബ്രായ നിപാതത്തിന്റെ ഊന്നൽ, ആധുനികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: קָרְבוּ יָמֶיךָ לָמוּת
  choice: നീ മരിക്കാനുള്ള സമയം അടുത്തിരിക്കുന്നു
  rationale: ‘നിന്റെ ദിവസങ്ങൾ അടുത്തിരിക്കുന്നു’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; മരണം അടുത്തുവന്നിരിക്കുന്നു എന്ന ആശയം വ്യക്തമാക്കുന്നു.
- source_word: קְרָא אֶת יְהוֹשֻׁעַ
  choice: യോശുവയെ വിളിക്കുക
  rationale: ലളിതമായ ആജ്ഞാരൂപത്തെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וְהִתְיַצְּבוּ / וַיִּתְיַצְּבוּ
  choice: നിങ്ങൾ രണ്ടുപേരും … ഹാജരാകുക / ഹാജരായി
  rationale: ദൈവസന്നിധിയിൽ നിശ്ചിത സ്ഥാനത്ത് ഔപചാരികമായി പ്രത്യക്ഷപ്പെടുക എന്ന ഹിത്പഅേൽ രൂപത്തിന്റെ സന്ദർഭാർഥം നൽകുന്നു; ആജ്ഞയിലും നിർവഹണത്തിലും ഒരേ പദബന്ധം നിലനിർത്തുന്നു.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിൽ
  rationale: ഇസ്രായേലിന്റെ വിശുദ്ധകൂടാരത്തിനുള്ള സ്ഥിരമായ പേരും בְ എന്ന സ്ഥലസൂചക അവ്യയവും സംരക്ഷിക്കുന്നു.
- source_word: וַאֲצַוֶּנּוּ
  choice: ഞാൻ അവനെ ചുമതലപ്പെടുത്തും
  rationale: צוה എന്ന ക്രിയയുടെ ആജ്ഞ നൽകുക, ഔദ്യോഗിക ചുമതല ഏൽപ്പിക്കുക എന്നീ സാധ്യതകളിൽ, യോശുവയുടെ നിയമനസന്ദർഭത്തിന് യോജിക്കുന്ന അർഥം മുഖ്യവാചകത്തിൽ നൽകി; പകരങ്ങൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: וַיֵּלֶךְ מֹשֶׁה וִיהוֹשֻׁעַ
  choice: അങ്ങനെ മോശയും യോശുവയും പോയി
  rationale: ആജ്ഞയ്ക്കുള്ള അനുസരണമായി കഥ മുന്നോട്ടുപോകുന്നതിനെ സ്വാഭാവിക മലയാളത്തിൽ ബന്ധിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു ബിരുദംകൊണ്ട് പകരാതെ നിലനിർത്തുന്നു; മലയാളത്തിൽ വ്യാപകമായി മനസ്സിലാക്കാവുന്ന ശബ്ദരൂപം ഉപയോഗിക്കുന്നു.
- issue: യോശുവയോടുള്ള צוה എന്ന ക്രിയയുടെ സന്ദർഭാർഥം
  choice: ചുമതലപ്പെടുത്തും
  alternative: ആജ്ഞ നൽകും; നിയോഗിക്കും
  rationale: മോശയുടെ മരണത്തിനു മുമ്പുള്ള നേതൃത്വമാറ്റത്തിന്റെ ഔപചാരികത അറിയിക്കുന്നു; അതേസമയം ക്രിയയുടെ വിശാലമായ അർഥപരിധി അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി. ‘നിങ്ങൾ രണ്ടുപേരും’ എന്നത് എബ്രായത്തിലെ ബഹുവചന ആജ്ഞ വ്യക്തമാക്കുന്നു. പദാനുപദമായി അസ്വാഭാവികമാകുന്ന ‘നിന്റെ ദിവസങ്ങൾ മരിക്കാനായി അടുത്തിരിക്കുന്നു’ എന്ന ഘടനയ്ക്ക് പകരം അതിന്റെ അർഥം സ്വാഭാവികമായി നൽകി.
