revisions:
- from: 'യഹ്‌വെ മോശയോടു പറഞ്ഞു: “ഇതാ, നീ മരിക്കാനുള്ള സമയം അടുത്തിരിക്കുന്നു. യോശുവയെ വിളിക്കുക. നിങ്ങൾ രണ്ടുപേരും സമാഗമകൂടാരത്തിൽ ഹാജരാകുക; ഞാൻ അവനെ ചുമതലപ്പെടുത്തും.[a]” അങ്ങനെ മോശയും യോശുവയും പോയി സമാഗമകൂടാരത്തിൽ ഹാജരായി.'
  to: 'യഹ്‌വേ മോശയോടു പറഞ്ഞു: “ഇതാ, നീ മരിക്കാനുള്ള സമയം അടുത്തിരിക്കുന്നു. യോശുവയെ വിളിക്കുക; നിങ്ങൾ രണ്ടുപേരും സമാഗമകൂടാരത്തിൽ ഹാജരാകുക, അവനു ഞാൻ ആജ്ഞ നൽകേണ്ടതിന്.” അങ്ങനെ മോശയും യോശുവയും പോയി സമാഗമകൂടാരത്തിൽ ഹാജരായി.'
  rationale: The revision preserves the Hebrew clause’s purpose relation and its basic sense of commanding Joshua, while the footnote retains the contextually plausible nuance of a formal charge or commissioning. It also standardizes the Malayalam transliteration of Yahweh. The footnote marker is not placed in the revised text because the alternative applies to the full purpose clause; it should be anchored after ‘ആജ്ഞ നൽകേണ്ടതിന്’ when inline markers are rendered.
