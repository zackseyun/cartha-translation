  yaml_path: translation/ot/deuteronomy/031/030.yaml
  text: Then Moses spoke the words of this song in the hearing of all the assembly of Israel[a], until they were finished.
translation:
  language: ml
  text: പിന്നെ മോശെ ഇസ്രായേൽസഭ മുഴുവനും കേൾക്കെ ഈ പാട്ടിന്റെ വാക്കുകൾ മുഴുവൻ പൂർത്തിയാകുന്നതുവരെ പറഞ്ഞു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൻ അവ പറഞ്ഞുതീർക്കുന്നതുവരെ”—അതായത്, മോശെ പാട്ടിന്റെ വാക്കുകൾ പറഞ്ഞുപൂർത്തിയാക്കുന്നതുവരെ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: പിന്നെ മോശ ... സംസാരിച്ചു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘പിന്നെ’ സംഭവക്രമം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു, ‘സംസാരിച്ചു’ എന്നത് דבר എന്ന ക്രിയയുടെ ലളിതമായ അർഥം നിലനിർത്തുന്നു.
- source_word: בְּאָזְנֵי
  choice: കേൾക്കെ
  rationale: അക്ഷരാർഥത്തിൽ ‘ചെവികളിൽ’ എന്നായിരുന്നാലും, സന്നിഹിതരായ എല്ലാവരും കേൾക്കുന്നവിധം പറഞ്ഞുവെന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: כָּל קְהַל יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ സർവസഭയും
  rationale: קהל കൂടിവന്ന സമൂഹത്തെയോ സഭയെയോ സൂചിപ്പിക്കുന്നു. ‘സർവസഭയും’ כָּל എന്ന സമഗ്രതയും സമൂഹത്തിന്റെ ഏകോപിത സ്വഭാവവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: אֶת דִּבְרֵי הַשִּׁירָה הַזֹּאת
  choice: ഈ പാട്ടിന്റെ വാക്കുകൾ
  rationale: മൂലപാഠത്തിൽ ‘ഈ പാട്ട്’ എന്നു മാത്രം അല്ല, ‘ഈ പാട്ടിന്റെ വാക്കുകൾ’ എന്നു വ്യക്തമായി ഉള്ളതിനാൽ ആ രൂപം സംരക്ഷിക്കുന്നു.
- source_word: עַד תֻּמָּם
  choice: അവ തീരുന്നതുവരെ
  rationale: മൂന്നാം പുരുഷ ബഹുവചന പ്രത്യയം അടുത്തുള്ള ‘വാക്കുകൾ’ എന്നതിനെ സൂചിപ്പിക്കുന്നതായി സ്വാഭാവികമായി വായിക്കാം. അതേസമയം ക്രിയാരൂപത്തിലെ കർത്തൃസംബന്ധമായ അവ്യക്തത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
