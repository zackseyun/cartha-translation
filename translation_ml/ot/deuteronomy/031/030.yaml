  to: പിന്നെ മോശെ ഇസ്രായേൽസഭ മുഴുവനും കേൾക്കെ ഈ പാട്ടിന്റെ വാക്കുകൾ മുഴുവൻ പൂർത്തിയാകുന്നതുവരെ പറഞ്ഞു.[a]
