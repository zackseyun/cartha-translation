translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കേൾക്കെ’ എന്നത് ബൈബിൾഗൗരവം നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്കും വ്യക്തമായ പ്രയോഗമാണ്; ‘സർവസഭ’ gathered assembly എന്ന കൂട്ടായ അർഥം നൽകുന്നു.
