language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְצַ֞ו אֶת יְהוֹשֻׁ֣עַ בִּן נ֗וּן וַ/יֹּאמֶר֮ חֲזַ֣ק וֶֽ/אֱמָץ֒ כִּ֣י אַתָּ֗ה תָּבִיא֙ אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל אֶל הָ/אָ֖רֶץ אֲשֶׁר נִשְׁבַּ֣עְתִּי לָ/הֶ֑ם וְ/אָנֹכִ֖י אֶֽהְיֶ֥ה עִמָּֽ/ךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/023.yaml
  text: And he commanded Joshua son of Nun and said[a], “Be strong and courageous, for you will bring the sons of Israel into the land that I swore to them, and I will be with you.”
translation:
  language: ml
  text: 'അവൻ നൂന്റെ മകനായ യോശുവയോടു കല്പിച്ചുകൊണ്ട് പറഞ്ഞു: “ശക്തനും ധൈര്യവാനും ആയിരിക്കുക; കാരണം, ഞാൻ അവരോടു സത്യംചെയ്ത ദേശത്തേക്ക് ഇസ്രായേലിന്റെ പുത്രന്മാരെ[a] നീ കൊണ്ടുചെല്ലും; ഞാൻ നിന്നോടുകൂടെ ഉണ്ടായിരിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഇസ്രായേല്യരെ” അല്ലെങ്കിൽ “ഇസ്രായേൽ ജനത്തെ.” എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ “ഇസ്രായേലിന്റെ പുത്രന്മാരെ” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו ... וַיֹּאמֶר
  choice: ഇങ്ങനെ കല്പിച്ചു
  rationale: צוה എന്ന പീയേൽ രൂപത്തിന്റെ ‘കല്പിക്കുക/ചുമതലപ്പെടുത്തുക’ എന്ന അർഥം നിലനിർത്തുന്നു. തുടർന്നുള്ള ‘പറഞ്ഞു’ എന്ന ക്രിയയുടെ പ്രവർത്തനം മലയാളത്തിലെ സ്വാഭാവികമായ നേരിട്ടുള്ള ഉദ്ധരണിഘടനയിൽ ‘ഇങ്ങനെ’ ഉൾക്കൊള്ളുന്നു.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: നൂന്റെ മകനായ യോശുവ
  rationale: പിതൃനാമബന്ധം വ്യക്തമായും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
- source_word: חֲזַק וֶאֱמָץ
  choice: ബലവും ധൈര്യവും ഉള്ളവനായിരിക്കുക
  rationale: ആദ്യ പദത്തിലെ ശക്തിയും രണ്ടാമത്തേതിലെ ഉറച്ച ധൈര്യവും വേർതിരിച്ചും പരസ്പരപൂരകമായും പ്രകടമാക്കുന്നു.
- source_word: כִּי
  choice: ;
  rationale: ഇവിടെ כִּי പ്രോത്സാഹനത്തിനുള്ള അടിസ്ഥാനത്തെ പരിചയപ്പെടുത്തുന്നു. മലയാളത്തിൽ അർധവിരാമത്തിനു പിന്നാലെയുള്ള പ്രഖ്യാപനം ഈ ബന്ധം സ്വാഭാവികമായി വഹിക്കുന്നു; ‘എന്തെന്നാൽ’ ചേർത്താൽ വാക്യം അനാവശ്യമായി ഭാരമുള്ളതാകും.
- source_word: תָּבִיא
  choice: നീ കൊണ്ടുചെല്ലും
  rationale: בוא എന്ന ധാതുവിന്റെ ഹിഫീൽ കാരകഭാവമായ ‘അകത്തേക്കു കൊണ്ടുവരുക/കൊണ്ടുചെല്ലുക’ എന്ന അർഥം നിലനിർത്തുന്നു; ‘നയിക്കും’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക രൂപം ഒഴിവാക്കുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: എബ്രായത്തിലെ കുടുംബബന്ധസൂചകവും വ്യാകരണപരമായി പുല്ലിംഗവുമായ പ്രയോഗം പ്രധാന പാഠത്തിൽ നിലനിർത്തുന്നു; സ്വാഭാവികമായ സമൂഹവാചകങ്ങൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: הָאָרֶץ
  choice: ദേശം
  rationale: നിയമാവർത്തനത്തിലെ വാഗ്ദത്തഭൂമിയുടെ ആശയം സൂചിപ്പിക്കുന്ന הארץ എന്ന പദത്തിന് മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ രൂപം.
- source_word: אֲשֶׁר נִשְׁבַּעְתִּי לָהֶם
  choice: ഞാൻ അവരോടു സത്യംചെയ്ത
  rationale: ‘കൊടുക്കുമെന്ന്’ എന്ന മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്ത പദങ്ങൾ ചേർക്കാതെ സത്യപ്രതിജ്ഞയുടെ ചുരുക്കരൂപം സംരക്ഷിക്കുന്നു.
- source_word: וְאָנֹכִי אֶהְיֶה עִמָּךְ
  choice: ഞാൻ നിന്നോടുകൂടെ ഉണ്ടായിരിക്കും
  rationale: ദൈവസാന്നിധ്യത്തിന്റെ പരിചിതമായ വാഗ്ദാനസൂത്രം നിലനിർത്തുന്നു; സ്വതന്ത്ര സർവനാമമായ אָנֹכִי നൽകുന്ന ഊന്നൽ മലയാളത്തിലെ തുറന്ന ‘ഞാൻ’ എന്ന പ്രയോഗത്തിലൂടെ പ്രകടമാകുന്നു.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്നതിന്റെ പരിഭാഷ
  choice: ഇസ്രായേലിന്റെ പുത്രന്മാർ
  alternative: ഇസ്രായേല്യർ; ഇസ്രായേൽജനം
  rationale: മൂലത്തിലെ കുടുംബപരവും പുല്ലിംഗവുമായ രൂപം പ്രധാന പാഠത്തിൽ സംരക്ഷിക്കുന്നു; അത് സമൂഹത്തെ മുഴുവനായി സൂചിപ്പിക്കാമെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: וַיְצַו / וַיֹּאמֶר എന്നീ ക്രിയകളുടെ പരോക്ഷ കർത്താവ്
  choice: അവൻ
  alternative: യഹോവ
  rationale: എബ്രായവാക്യത്തിൽ കർത്താവ് മൂന്നാംപുരുഷ ഏകവചനമായി പരോക്ഷമാണ്. സന്ദർഭം ആരെ സൂചിപ്പിക്കുന്നുവെന്ന് വ്യക്തമാക്കുന്നുണ്ടെങ്കിലും ഈ വാക്യത്തിൽ ഇല്ലാത്ത ദൈവനാമം പ്രധാന പാഠത്തിൽ ചേർക്കുന്നില്ല.
- issue: אֲשֶׁר נִשְׁבַּעְתִּי לָהֶם എന്ന സത്യപ്രതിജ്ഞാവാക്യം
  choice: ഞാൻ അവരോടു സത്യംചെയ്ത ദേശം
  alternative: അവർക്കു കൊടുക്കുമെന്ന് ഞാൻ സത്യംചെയ്ത ദേശം
  rationale: ദേശദാനമാണ് സന്ദർഭത്തിൽ ഉദ്ദേശ്യമെങ്കിലും ‘കൊടുക്കുക’ എന്ന ക്രിയ ഈ ഉപവാക്യത്തിൽ പ്രകടമല്ല. അതിനാൽ സന്ദർഭാർഥം നിശ്ശബ്ദമായി പാഠത്തിൽ ചേർക്കാതെ മൂലത്തിലെ സംക്ഷിപ്തത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. നേരിട്ടുള്ള ഉദ്ധരണിയും ദൈവസാന്നിധ്യവാഗ്ദാനവും ലളിതമായി നിലനിർത്തി; അനാവശ്യമായ പഴയകാല ക്രിയാരൂപങ്ങളും വിഭാഗീയ പദപ്രയോഗങ്ങളും ഒഴിവാക്കി.
