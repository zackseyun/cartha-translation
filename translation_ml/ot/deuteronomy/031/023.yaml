revisions:
- from: 'അവൻ നൂന്റെ മകനായ യോശുവയോട് ഇങ്ങനെ കല്പിച്ചു: “ബലവും ധൈര്യവും ഉള്ളവനായിരിക്കുക; ഞാൻ അവരോടു സത്യംചെയ്ത ദേശത്തേക്ക് ഇസ്രായേലിന്റെ പുത്രന്മാരെ[a] നീ കൊണ്ടുചെല്ലും. ഞാൻ നിന്നോടുകൂടെ ഉണ്ടായിരിക്കും.”'
  to: 'അവൻ നൂന്റെ മകനായ യോശുവയോടു കല്പിച്ചുകൊണ്ട് പറഞ്ഞു: “ശക്തനും ധൈര്യവാനും ആയിരിക്കുക; കാരണം, ഞാൻ അവരോടു സത്യംചെയ്ത ദേശത്തേക്ക് ഇസ്രായേലിന്റെ പുത്രന്മാരെ[a] നീ കൊണ്ടുചെല്ലും; ഞാൻ നിന്നോടുകൂടെ ഉണ്ടായിരിക്കും.”'
  rationale: The revision explicitly renders the causal כִּי as ‘കാരണം,’ represents both ‘commanded’ and ‘said,’ and improves the exhortation’s modern Malayalam fluency. It does not add the implied gift of the land to the oath clause, and it preserves the source’s familial designation for Israel’s sons with alternatives footnoted.
