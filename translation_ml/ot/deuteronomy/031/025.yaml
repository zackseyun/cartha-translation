  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְצַ֤ו מֹשֶׁה֙ אֶת הַ/לְוִיִּ֔ם נֹ֥שְׂאֵ֛י אֲר֥וֹן בְּרִית יְהוָ֖ה לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/025.yaml
  text: Moses commanded the Levites who carried the ark of the covenant of Yahweh[a], saying,
translation:
  language: ml
  text: 'മോശ യഹ്‌വേയുടെ ഉടമ്പടിയുടെ പെട്ടകം വഹിച്ചിരുന്ന ലേവ്യരോടു കല്പിച്ചു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: കല്പിച്ചു
  rationale: צוה എന്ന ക്രിയ ഇവിടെ അധികാരപൂർവമായ നിർദേശം നൽകുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘കല്പിച്ചു’ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളമാണ്.
- source_word: הַלְוִיִּם
  choice: ലേവ്യരോട്
  rationale: ലേവി ഗോത്രവുമായി ബന്ധപ്പെട്ടവരെ സൂചിപ്പിക്കുന്ന ബഹുവചന നാമത്തിന്റെ പതിവും വ്യക്തവുമായ മലയാളരൂപം.
- source_word: נֹשְׂאֵי
  choice: വഹിച്ചിരുന്ന
  rationale: ഈ വർത്തമാന കൃദന്തരൂപം ലേവ്യരെ പെട്ടകം വഹിക്കുന്നവരായി വിശേഷിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ അവരുടെ ചുമതല സൂചിപ്പിക്കാൻ ‘വഹിച്ചിരുന്ന’ സ്വാഭാവികമാണ്.
- source_word: אֲרוֹן
  choice: പെട്ടകം
  rationale: ഉടമ്പടി-തിരുനിവാസസന്ദർഭത്തിലെ വിശുദ്ധ പെട്ടകത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതമായ മലയാള ബൈബിൾപദം.
- source_word: בְּרִית
  choice: ഉടമ്പടിയുടെ
  rationale: אֲרוֹן എന്ന പദവുമായുള്ള construct ബന്ധം ‘ഉടമ്പടിയുടെ പെട്ടകം’ എന്നായി കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേയുടെ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: לֵאמֹר
  choice: 'തുടർന്നുവരുന്ന ഉദ്ധരണി അവതരിപ്പിക്കുന്ന വിരാമചിഹ്നം (: )'
  rationale: ഹീബ്രു സൂത്രവാക്യം അടുത്ത വാക്യത്തിലെ നേരിട്ടുള്ള വാക്കുകളെ അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ഇപ്രകാരം’ എന്നതിനെക്കാൾ കോളൺ സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ / കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തമായി വരുന്ന ഉടമ്പടിനാമത്തെ ഒരു പദവിയാൽ പകരാതെ, സാധ്യതയേറിയ ഉച്ചാരണത്തെ ആധാരമാക്കി മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് സുഗ്രാഹ്യവുമായ മലയാളം. ഹീബ്രുവിലെ participial വിശേഷണം സ്വാഭാവികമായ relative-clause രൂപത്തിൽ നൽകി; לֵאמֹר അടുത്ത വാക്യത്തിലെ നേരിട്ടുള്ള പ്രസംഗം ആരംഭിക്കുന്നതിനാൽ കോളൺ ഉപയോഗിച്ചു.
