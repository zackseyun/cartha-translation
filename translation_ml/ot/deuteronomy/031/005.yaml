revisions:
- from: യഹോവ അവരെ നിങ്ങളുടെ കയ്യിൽ ഏല്പിക്കും; ഞാൻ നിങ്ങളോടു കല്പിച്ചിട്ടുള്ള സകലകല്പനയും അനുസരിച്ച് നിങ്ങൾ അവരോടു ചെയ്യണം.
  to: യഹോവ അവരെ നിങ്ങൾക്ക് ഏല്പിച്ചുതരും; ഞാൻ നിങ്ങളോടു കൽപ്പിച്ചിരിക്കുന്ന സകല കൽപ്പനയും അനുസരിച്ച് നിങ്ങൾ അവരോടു ചെയ്യണം.
  rationale: The revision removes the added ‘hand’ metaphor while retaining the source’s sense that YHWH delivers the opponents into Israel’s power. It preserves the open-ended wording of the command to act toward them according to the whole command previously given by Moses, and regularizes Malayalam spelling and phrasing.
