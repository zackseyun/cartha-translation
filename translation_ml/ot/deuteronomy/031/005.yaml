id: DEU.31.5
reference: Deuteronomy 31:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/נְתָנָ֥/ם יְהוָ֖ה לִ/פְנֵי/כֶ֑ם וַ/עֲשִׂיתֶ֣ם לָ/הֶ֔ם כְּ/כָל הַ/מִּצְוָ֔ה אֲשֶׁ֥ר צִוִּ֖יתִי אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/005.yaml
  text: And the LORD will give them over to you, and you shall do to them according to all the commandment that I have commanded you.
translation:
  language: ml
  text: യഹോവ അവരെ നിങ്ങൾക്ക് ഏല്പിച്ചുതരും; ഞാൻ നിങ്ങളോടു കൽപ്പിച്ചിരിക്കുന്ന സകല കൽപ്പനയും അനുസരിച്ച് നിങ്ങൾ അവരോടു ചെയ്യണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּנְתָנָם ... לִפְנֵיכֶם
  choice: അവരെ നിങ്ങളുടെ കയ്യിൽ ഏല്പിക്കും
  rationale: പദാനുപദമായി ‘നിങ്ങളുടെ മുമ്പിൽ വെക്കും/തരും’ എന്നാണെങ്കിലും, ശത്രുക്കളെ ഇസ്രായേലിന്റെ അധികാരത്തിൽ ഏല്പിക്കുന്നതെന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; വിജയത്തിനുശേഷം എന്തു ചെയ്യണമെന്ന അടുത്ത വാക്യഭാഗത്തോടും യോജിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു പൊതുപദവിയായി മാറ്റാതെ, മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: כְּכָל הַמִּצְוָה
  choice: സകലകല്പനയും അനുസരിച്ച്
  rationale: כְּ എന്ന അനുസൃതതാസൂചകവും ഏകവചനത്തിലുള്ള സമാഹാരാർഥമുള്ള ‘കല്പന’യും സംരക്ഷിക്കുന്നു.
- source_word: צִוִּיתִי אֶתְכֶם
  choice: ഞാൻ നിങ്ങളോടു കല്പിച്ചിട്ടുള്ള
  rationale: മോശെയാണ് സംസാരിക്കുന്നതെന്ന ഒന്നാംപുരുഷരൂപവും, മുമ്പ് നൽകിയ കല്പനയുടെ പ്രസക്തിയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: യുദ്ധസന്ദർഭത്തിലെ ദൈവിക ഏല്പിക്കൽ
  choice: യഹോവ അവരെ നിങ്ങളുടെ കയ്യിൽ ഏല്പിക്കും
  alternative: യഹോവ അവരെ നിങ്ങളുടെ മുമ്പിൽ തരും
  rationale: വിജയം യഹോവയുടെ പ്രവൃത്തിയായി അവതരിപ്പിക്കുന്ന മൂലപാഠത്തിന്റെ ദൈവശാസ്ത്രപരമായ ഊന്നൽ നിലനിർത്തുന്നു; എന്നാൽ മൂലപാഠത്തിൽ ഇല്ലാത്ത നാശമോ വധമോ പ്രത്യേകം ചേർക്കുന്നില്ല.
- issue: ‘സകലകല്പന’ എന്ന സമാഹാര ഏകവചനം
  choice: സകലകല്പനയും
  alternative: എല്ലാ കല്പനകളും
  rationale: הַמִּצְוָה എന്ന ഏകവചനത്തെ നിലനിർത്തി, കല്പിക്കപ്പെട്ട നിർദേശത്തിന്റെ സമഗ്രത പ്രകടമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘ഏല്പിക്കും’ എന്നത് സന്ദർഭസൂചിതമായ അധികാരത്തിലാക്കൽ പ്രകടമാക്കുന്നു; ‘ചെയ്യണം’ കല്പനാത്മക ബാധ്യത സ്വാഭാവികമായി അറിയിക്കുന്നു.
