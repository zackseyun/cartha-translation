reference: Deuteronomy 31:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: יְהוָ֨ה אֱלֹהֶ֜י/ךָ ה֣וּא עֹבֵ֣ר לְ/פָנֶ֗י/ךָ הֽוּא יַשְׁמִ֞יד אֶת הַ/גּוֹיִ֥ם הָ/אֵ֛לֶּה מִ/לְּ/פָנֶ֖י/ךָ וִֽ/ירִשְׁתָּ֑/ם יְהוֹשֻׁ֗עַ ה֚וּא עֹבֵ֣ר לְ/פָנֶ֔י/ךָ כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/003.yaml
  text: Yahweh your God himself is crossing over before you[a]. He himself will destroy these nations from before you, and you will dispossess them. Joshua himself is crossing over before you[b], just as Yahweh has spoken.
translation:
  language: ml
  text: നിന്റെ ദൈവമായ യഹ്‌വെ തന്നെയാണ് നിനക്കു മുമ്പായി കടന്നുപോകുന്നത്.[a] അവിടുന്ന് തന്നേ ഈ ജനതകളെ നിന്റെ മുമ്പിൽനിന്ന് നശിപ്പിക്കും; നീ അവരെ കൈവശമാക്കും.[b] യഹ്‌വെ പറഞ്ഞതുപോലെ, യോശുവ തന്നെയാണ് നിനക്കു മുമ്പായി കടന്നുപോകുന്നത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിനക്കു മുമ്പായി പോകുന്നു’ / ‘നിനക്കു മുമ്പായി കടന്നുപോകും.’ എബ്രായ കൃദ്‌രൂപത്തിന് നടന്നുകൊണ്ടിരിക്കുന്നതോ ആസന്നമോ ഉറപ്പുള്ള ഭാവിയിലെതോ ആയ പ്രവർത്തനം സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നീ അവരെ പുറത്താക്കി അവരുടെ ദേശം കൈവശമാക്കും.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ ക്രിയയ്ക്ക് മുൻവാസികളെ നീക്കി കൈവശപ്പെടുത്തുക എന്ന അർഥവും ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ ലിപ്യന്തരണമായി നിലനിർത്തുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: രണ്ടാംപുരുഷ ഏകവചന പ്രത്യയമുള്ള ഉടമ്പടിസംബോധന മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הוּא
  choice: തന്നെയാണ് / തന്നെയാണ്
  rationale: യഹ്‌വെയെയും യോശുവയെയും സംബന്ധിച്ച ആവർത്തിത ഊന്നൽ നിലനിർത്തുന്നു; ദൈവിക പ്രവർത്തനവും മനുഷ്യനേതൃത്വവും തമ്മിലുള്ള വാചകത്തിലെ ബന്ധം സമതലപ്പെടുത്തുന്നില്ല.
- source_word: עֹבֵר לְפָנֶיךָ
  choice: നിനക്കു മുമ്പായി കടന്നുപോകുന്നത്
  rationale: പങ്കാളിക്രിയയുടെ ഇപ്പോഴാരംഭിക്കുന്നതോ ആസന്നമോ ഉറപ്പുള്ള ഭാവിയോ ആയ അർഥവ്യാപ്തിയും യോർദ്ദാൻ കടക്കലിന്റെ ദൃശ്യവും നിലനിർത്തുന്നു.
- source_word: יַשְׁמִיד
  choice: നശിപ്പിക്കും
  rationale: ഹിഫീൽ രൂപത്തിന്റെ കാരണാത്മകമായ ശക്തമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; മൂലത്തിൽക്കാൾ അധികമായി സമ്പൂർണ ഉന്മൂലനം വ്യക്തമാക്കുന്നില്ല.
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: ഈ ജനതകളെ
  rationale: കനാനിലെ ജനവിഭാഗങ്ങളെ രാഷ്ട്രീയ-വംശീയ കൂട്ടങ്ങളായി സൂചിപ്പിക്കുന്ന גּוֹיִם എന്ന പദത്തിന് ആധുനിക മലയാളത്തിൽ യോജിച്ച രൂപം.
- source_word: מִלְּפָנֶיךָ
  choice: നിന്റെ മുമ്പിൽനിന്ന്
  rationale: ഇസ്രായേലിന്റെ വഴിയിൽനിന്നുള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്ന സ്ഥലപരമായ അർഥം സംരക്ഷിക്കുന്നു.
- source_word: וִירִשְׁתָּם
  choice: നീ അവരെ കൈവശമാക്കും
  rationale: നേരിട്ടുള്ള ബഹുവചന കർമപ്രത്യയം നിലനിർത്തുകയും ירשׁ എന്ന ക്രിയയുടെ കൈവശപ്പെടുത്തൽ/മുൻവാസികളെ നീക്കി അവകാശമാക്കൽ എന്ന അർഥവ്യാപ്തി തുറന്നുവയ്ക്കുകയും ചെയ്യുന്നു.
- source_word: יְהוֹשֻׁעַ
  choice: യോശുവ
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ സുപരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: യഹ്‌വെ അരുളിച്ചെയ്തതുപോലെ
  rationale: ദൈവം പറഞ്ഞ പൂർത്തിയായ വചനത്തെ മാന്യവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു; ‘വാഗ്ദാനം ചെയ്തു’ എന്ന അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമം ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- issue: യഹ്‌വെയുടെയും യോശുവയുടെയും പ്രവർത്തനാധികാരത്തിലുള്ള ഊന്നൽ
  choice: ഇരുസന്ദർഭങ്ങളിലും הוּא എന്ന ഊന്നൽ ‘തന്നെയാണ്’ എന്നു നിലനിർത്തുന്നു
  alternative: ഊന്നലില്ലാതെ ‘അവിടുന്ന്/അവൻ’ എന്നു നൽകുക
  rationale: യഹ്‌വെ വ്യക്തിപരമായി മുമ്പിൽ പോകുന്നതും അവന്റെ നിയോഗപ്രകാരം യോശുവ മുമ്പിൽ പോകുന്നതുമായ വാചകത്തിലെ ദൈവിക-മാനുഷിക പ്രവർത്തനബന്ധം പരിഹരിക്കാതെ സംരക്ഷിക്കുന്നു.
- issue: וִירִשְׁתָּם എന്നതിലെ കൈവശപ്പെടുത്തലും പുറത്താക്കലും
  choice: പ്രധാനപാഠത്തിൽ ‘അവരെ കൈവശമാക്കും’; അടിക്കുറിപ്പിൽ അർഥവ്യാപ്തി വ്യക്തമാക്കുന്നു
  alternative: ‘അവരെ പുറത്താക്കി അവരുടെ ദേശം കൈവശമാക്കും’
  rationale: ക്രിയയുടെ അധീനപ്പെടുത്തൽ അർഥം സംരക്ഷിക്കുമ്പോൾ, മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്ത ‘അവരുടെ ദേശം’ പ്രധാനപാഠത്തിലേക്ക് ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അവിടുന്ന്’ ദൈവത്തെ സൂചിപ്പിക്കുന്ന ബഹുമാനരൂപമായി ഉപയോഗിച്ചു. ആവർത്തിതമായ ‘തന്നെയാണ്’ മൂലത്തിലെ ഊന്നൽ നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
