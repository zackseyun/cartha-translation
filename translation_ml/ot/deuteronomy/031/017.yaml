revisions:
- from: 'അന്ന് അവർക്കെതിരെ എന്റെ കോപം ജ്വലിക്കും. ഞാൻ അവരെ ഉപേക്ഷിക്കുകയും അവരിൽനിന്ന് എന്റെ മുഖം മറയ്ക്കുകയും ചെയ്യും. അവർ വിഴുങ്ങപ്പെടാനുള്ളവരായിത്തീരും[a]; അനേകം അനർത്ഥങ്ങളും കഷ്ടതകളും അവരെ തേടിയെത്തും. അന്ന് അവൻ പറയും[b]: ‘എന്റെ ദൈവം എന്റെ മധ്യേ ഇല്ലാത്തതുകൊണ്ടല്ലയോ ഈ അനർത്ഥങ്ങൾ എന്നെ തേടിയെത്തിയത്?’'
  to: 'അന്ന് അവർക്കെതിരെ എന്റെ കോപം ജ്വലിക്കും. ഞാൻ അവരെ ഉപേക്ഷിക്കുകയും അവരിൽനിന്ന് എന്റെ മുഖം മറയ്ക്കുകയും ചെയ്യും. അവർ ഇരയായിത്തീരും[a]; അനേകം അനർത്ഥങ്ങളും കഷ്ടതകളും അവരെ തേടിയെത്തും. അന്ന് അവൻ പറയും[b]: ‘എന്റെ ദൈവം എന്റെ മധ്യേ ഇല്ലാത്തതുകൊണ്ടല്ലയോ ഈ അനർത്ഥങ്ങൾ എന്നെ തേടിയെത്തിയത്?’'
  rationale: Only the ambiguous consumption expression and its explanatory note are revised. ‘അവർ ഇരയായിത്തീരും’ is natural Malayalam and avoids making the Hebrew's compressed phrase more explicit than it is, while footnote a now gives a more accurate literal gloss. All other source-sensitive wording, including the hidden-face idiom and Israel's singular self-speech, is retained.
