reference: Deuteronomy 31:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/חָרָ֣ה אַפִּ֣/י ב֣/וֹ בַ/יּוֹם הַ֠/הוּא וַ/עֲזַבְתִּ֞י/ם וְ/הִסְתַּרְתִּ֨י פָנַ֤/י מֵ/הֶם֙ וְ/הָיָ֣ה לֶֽ/אֱכֹ֔ל וּ/מְצָאֻ֛/הוּ רָע֥וֹת רַבּ֖וֹת וְ/צָר֑וֹת וְ/אָמַר֙ בַּ/יּ֣וֹם הַ/ה֔וּא הֲ/לֹ֗א עַ֣ל כִּֽי אֵ֤ין אֱלֹהַ/י֙ בְּ/קִרְבִּ֔/י מְצָא֖וּ/נִי הָ/רָע֥וֹת הָ/אֵֽלֶּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/017.yaml
  text: Then my anger will burn against them on that day[a], and I will forsake them and hide my face from them, and they will be devoured, and many evils and troubles will find them. And he will say on that day[b], ‘Is it not because my God is not among me that these evils have found me?’
translation:
  language: ml
  text: 'അന്ന് അവർക്കെതിരെ എന്റെ കോപം ജ്വലിക്കും. ഞാൻ അവരെ ഉപേക്ഷിക്കുകയും അവരിൽനിന്ന് എന്റെ മുഖം മറയ്ക്കുകയും ചെയ്യും. അവർ ഇരയായിത്തീരും[a]; അനേകം അനർത്ഥങ്ങളും കഷ്ടതകളും അവരെ തേടിയെത്തും. അന്ന് അവൻ പറയും[b]: ‘എന്റെ ദൈവം എന്റെ മധ്യേ ഇല്ലാത്തതുകൊണ്ടല്ലയോ ഈ അനർത്ഥങ്ങൾ എന്നെ തേടിയെത്തിയത്?’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘അവൻ/അത് ഭക്ഷണത്തിനായിത്തീരും.’ എബ്രായപ്രയോഗം സംക്ഷിപ്തമാണ്; നശിപ്പിക്കപ്പെടാൻ തുറന്നുകൊടുക്കപ്പെടുന്ന അവസ്ഥയെയാകാം ഇതു സൂചിപ്പിക്കുന്നത്. ‘അവർ വിഴുങ്ങപ്പെടും’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ‘അവൻ പറയും’ എന്നും ‘എന്റെ ദൈവം എന്റെ മധ്യേ ഇല്ല’ എന്നും ഏകവചനമാണ്. ഇവിടെ യിസ്രായേൽജനത്തെ ഒരൊറ്റ വ്യക്തിയായി അവതരിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָרָה אַפִּי
  choice: എന്റെ കോപം ജ്വലിക്കും
  rationale: കോപം തീപോലെ കത്തുന്നതെന്ന എബ്രായ രൂപകം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בּוֹ
  choice: അവർക്കെതിരെ
  rationale: രൂപം ഏകവചനമാണെങ്കിലും, സന്ദർഭത്തിൽ യിസ്രായേൽജനത്തെ ഒരു സമൂഹമായി സൂചിപ്പിക്കുന്നു; വിവരണഭാഗത്ത് മലയാളത്തിലെ സ്വാഭാവിക ബഹുവചനം ഉപയോഗിച്ചു.
- source_word: וַעֲזַבְתִּים
  choice: ഞാൻ അവരെ ഉപേക്ഷിക്കുകയും
  rationale: ദൈവത്തിന്റെ ഉടമ്പടിസംബന്ധമായ പിന്മാറ്റത്തിന്റെ ഗൗരവം കൂട്ടിച്ചേർക്കാതെ നേരിട്ട് അറിയിക്കുന്നു.
- source_word: וְהִסְתַּרְתִּי פָנַי מֵהֶם
  choice: അവരിൽനിന്ന് എന്റെ മുഖം മറയ്ക്കുകയും ചെയ്യും
  rationale: ദൈവിക ന്യായവിധിയെയും ബന്ധപരമായ പിന്മാറ്റത്തെയും ഒരുമിച്ച് സൂചിപ്പിക്കുന്ന മൂലഭാഷയിലെ പ്രധാന രൂപകം വ്യാഖ്യാനിച്ച് ലഘൂകരിക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: וְהָיָה לֶאֱכֹל
  choice: അവർ വിഴുങ്ങപ്പെടാനുള്ളവരായിത്തീരും
  rationale: അക്ഷരാർഥത്തിൽ ‘തിന്നപ്പെടാനുള്ളവനായിത്തീരും’ എന്ന സംക്ഷിപ്ത പ്രയോഗം. നാശത്തിന് തുറന്നുകൊടുക്കപ്പെടുന്ന അവസ്ഥയെ മലയാളത്തിൽ വ്യക്തമാക്കുമ്പോഴും കർത്താവിനെയോ നാശത്തിന്റെ മാർഗത്തെയോ അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: וּמְצָאֻהוּ
  choice: അവരെ തേടിയെത്തും
  rationale: ‘കണ്ടെത്തും’ എന്ന അടിസ്ഥാനചിത്രം നിലനിർത്തിക്കൊണ്ട്, ദുരന്തങ്ങൾ ഒരാളെ ബാധിക്കുന്നതിനെ മലയാളത്തിൽ സ്വാഭാവികമായി പറയുന്നു.
- source_word: רָעוֹת רַבּוֹת וְצָרוֹת
  choice: അനേകം അനർത്ഥങ്ങളും കഷ്ടതകളും
  rationale: רָעוֹת എന്നതിന്റെ ദുരന്തം/ദോഷം എന്ന സന്ദർഭാർഥവും צָרוֹת എന്നതിന്റെ കഷ്ടത/ഞെരുക്കം എന്ന അർഥവും വേർതിരിച്ച് സൂക്ഷിക്കുന്നു.
- source_word: וְאָמַר
  choice: അവൻ പറയും
  rationale: യിസ്രായേലിനെ ഏകവചനത്തിലുള്ള ഒരാളായി അവതരിപ്പിക്കുന്ന മൂലഭാഷയുടെ വ്യക്തിവൽക്കരണം ഉദ്ധരണിയിൽ നിലനിർത്തുന്നു.
- source_word: הֲלֹא עַל כִּי
  choice: ഇല്ലാത്തതുകൊണ്ടല്ലയോ
  rationale: കാരണത്തെക്കുറിച്ചുള്ള മൂലഭാഷയിലെ ആലങ്കാരിക ചോദ്യം സ്വാഭാവിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: אֵין אֱלֹהַי בְּקִרְבִּי
  choice: എന്റെ ദൈവം എന്റെ മധ്യേ ഇല്ലാത്തത്
  rationale: ‘എന്റെ ഉള്ളിൽ’ എന്ന വ്യക്തിപരമായ അർഥത്തിലേക്ക് ചുരുക്കാതെ, ഏകവചനത്തിൽ വ്യക്തിവൽക്കരിക്കപ്പെട്ട ജനസമൂഹത്തിന്റെ ‘മധ്യേ’ എന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: מְצָאוּנִי
  choice: എന്നെ തേടിയെത്തിയത്
  rationale: മുമ്പത്തെ וּמְצָאֻהוּ എന്ന ക്രിയയുമായുള്ള പദബന്ധം നിലനിർത്തുകയും ഫലം ഇപ്പോൾ അനുഭവപ്പെടുന്ന പൂർണ്ണക്രിയയുടെ ഭാവം നൽകുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: യിസ്രായേലിനെ സമൂഹമായും ഏകവചന വ്യക്തിയായും അവതരിപ്പിക്കൽ
  choice: ദൈവത്തിന്റെ പ്രവൃത്തികളെ വിവരിക്കുന്ന ഭാഗത്ത് ബഹുവചനം (‘അവർ/അവരെ’), യിസ്രായേലിന്റെ സ്വവാക്കിൽ ഏകവചനം (‘അവൻ/എന്റെ/എന്നെ’) ഉപയോഗിച്ചു.
  alternative: വാക്യം മുഴുവൻ ഏകവചനത്തിലോ മുഴുവൻ ബഹുവചനത്തിലോ പരിഭാഷപ്പെടുത്തുക.
  rationale: ഇത് മലയാളത്തിലെ വിവരണത്തെ സ്വാഭാവികമാക്കുകയും ഉദ്ധരണിയിലെ ശ്രദ്ധേയമായ സമൂഹ-വ്യക്തിവൽക്കരണം മായ്ച്ചുകളയാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: ദൈവം മുഖം മറയ്ക്കുന്നതിന്റെ അർഥം
  choice: ‘എന്റെ മുഖം മറയ്ക്കും’ എന്ന രൂപകം അതേപടി സൂക്ഷിച്ചു.
  alternative: ‘അവരിൽനിന്ന് സാന്നിധ്യം പിൻവലിക്കും’ അല്ലെങ്കിൽ ‘അവരോട് പ്രസാദമില്ലാതാകും’ എന്നു വ്യാഖ്യാനിക്കുക.
  rationale: മൂലരൂപകം ന്യായവിധി, ദൈവിക മറവ്, ബന്ധപരമായ പിന്മാറ്റം എന്നിവയ്ക്കിടയിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം നിലനിർത്തുന്നു; ഒരു വ്യാഖ്യാനം മാത്രം നിർബന്ധിക്കുന്നില്ല.
- issue: וְהָיָה לֶאֱכֹל എന്ന സംക്ഷിപ്ത പ്രയോഗത്തിന്റെ കർത്താവും വിധവും
  choice: ‘വിഴുങ്ങപ്പെടാനുള്ളവരായിത്തീരും’ എന്ന് നൽകി, നാശത്തിന് ഇരയാകുന്ന അവസ്ഥ മുൻനിർത്തി.
  alternative: ‘അവർ ഇരയായിത്തീരും’ അല്ലെങ്കിൽ ‘അവർ വിഴുങ്ങപ്പെടും’.
  rationale: ആരാണ് അല്ലെങ്കിൽ എന്താണ് വിഴുങ്ങുന്നത് എന്ന് മൂലവാക്യം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ കർത്താവിനെ കൂട്ടിച്ചേർക്കാതെ യഥാർഥ അനിശ്ചിതത്വം സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘മുഖം മറയ്ക്കുക’, ‘കോപം ജ്വലിക്കുക’ എന്നീ ഉറവിടരൂപങ്ങൾ നിലനിർത്തി; അപൂർവമോ മതവിഭാഗ-വിശേഷമോ ആയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
