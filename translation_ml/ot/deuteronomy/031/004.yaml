revisions:
- from: യഹോവ അവരോടും അമോര്യരാജാക്കന്മാരായ സീഹോനോടും ഓഗിനോടും അവരുടെ ദേശത്തോടും ചെയ്തതുപോലെതന്നെ ചെയ്യും; അവൻ അവരെ നശിപ്പിച്ചല്ലോ.
  to: യഹോവ അവരോട്, താൻ നശിപ്പിച്ച അമോര്യരുടെ രാജാക്കന്മാരായ സീഹോനോടും ഓഗിനോടും അവരുടെ ദേശത്തോടും ചെയ്തതുപോലെതന്നെ ചെയ്യും.
  rationale: The revision retains the comparison, the divine name, the named kings, and their land, while rendering the final Hebrew relative clause as a natural Malayalam modifier. It avoids adding the draft's emphatic -അല്ലോ and makes the antecedent of 'them' explicit without introducing an interpretive footnote.
