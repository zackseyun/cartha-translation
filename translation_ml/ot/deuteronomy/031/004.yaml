source:
  edition: WLC
  text: וְ/עָשָׂ֤ה יְהוָה֙ לָ/הֶ֔ם כַּ/אֲשֶׁ֣ר עָשָׂ֗ה לְ/סִיח֥וֹן וּ/לְ/ע֛וֹג מַלְכֵ֥י הָ/אֱמֹרִ֖י וּ/לְ/אַרְצָ֑/ם אֲשֶׁ֥ר הִשְׁמִ֖יד אֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/004.yaml
  text: And the LORD will do to them just as he did to Sihon and Og, the kings of the Amorites, and to their land, when he destroyed them.
translation:
  language: ml
  text: യഹോവ അവരോട്, താൻ നശിപ്പിച്ച അമോര്യരുടെ രാജാക്കന്മാരായ സീഹോനോടും ഓഗിനോടും അവരുടെ ദേശത്തോടും ചെയ്തതുപോലെതന്നെ ചെയ്യും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റൺ മലയാളത്തിൽ പരിചിതവും നേരിട്ടുള്ളതുമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: ചെയ്തതുപോലെതന്നെ
  rationale: താരതമ്യത്തിന്റെ ഊന്നൽ സ്വാഭാവികമായ മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: הִשְׁמִיד
  choice: നശിപ്പിച്ചു
  rationale: ഹിഫീൽ ക്രിയയുടെ സമൂലനാശം വരുത്തുക എന്ന ശക്തമായ അർഥം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: അവസാനത്തെ אֲשֶׁר ഉപവാക്യത്തിന്റെ ബന്ധം
  choice: അവൻ അവരെ നശിപ്പിച്ചല്ലോ
  alternative: അവൻ നശിപ്പിച്ച അവരുടെ ദേശം
  rationale: ഹീബ്രുവിലെ പുരുഷ ബഹുവചന കർമപ്രത്യയം אֹתָם സീഹോനെയും ഓഗിനെയും സൂചിപ്പിക്കുന്നതിനാൽ, ദേശത്തെ അല്ല വ്യക്തികളെ നശിപ്പിച്ചതായി വ്യക്തമാക്കുന്നു; പ്രസംഗസന്ദർഭത്തിൽ മുൻകാല സംഭവത്തെ ഓർമ്മിപ്പിക്കുന്ന ഭാവവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഹീബ്രു വാക്യക്രമത്തിന്റെ അർഥബന്ധം സംരക്ഷിച്ചുകൊണ്ട് അസ്വാഭാവികമായ പദാനുപദഘടന ഒഴിവാക്കി.
