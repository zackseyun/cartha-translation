source:
  edition: WLC
  text: וַ/יִּכְתֹּ֣ב מֹשֶׁה֮ אֶת הַ/תּוֹרָ֣ה הַ/זֹּאת֒ וַֽ/יִּתְּנָ֗/הּ אֶל הַ/כֹּהֲנִים֙ בְּנֵ֣י לֵוִ֔י הַ/נֹּ֣שְׂאִ֔ים אֶת אֲר֖וֹן בְּרִ֣ית יְהוָ֑ה וְ/אֶל כָּל זִקְנֵ֖י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/009.yaml
  text: So Moses wrote this law and gave it to the priests[a], the sons of Levi, who carry the ark of the covenant of Yahweh[c][b], and to all the elders of Israel.
translation:
  language: ml
  text: അങ്ങനെ മോശെ ഈ ന്യായപ്രമാണം[a] എഴുതി, യാഹ്‌വേയുടെ[c] ഉടമ്പടിപ്പെട്ടകം ചുമക്കുന്ന ലേവിയുടെ പുത്രന്മാരായ[b] പുരോഹിതന്മാർക്കും ഇസ്രായേലിലെ എല്ലാ മൂപ്പന്മാർക്കും അതു കൊടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഈ ഉപദേശം’ എന്നോ ‘ഈ തോറാ’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ ‘ലേവിയുടെ പുത്രന്മാർ’; ‘ലേവ്യർ’ എന്നും ചുരുക്കി പറയാം.
    reason: lexical_alternative
  - marker: c
    text: എബ്രായത്തിൽ YHWH; പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: എഴുതി
  rationale: כתב എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: ഈ ന്യായപ്രമാണം
  rationale: ഇവിടെ എഴുതിവെക്കുന്ന ഉടമ്പടിസംബന്ധമായ നിയമബോധനത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ന്യായപ്രമാണം’ അനുയോജ്യം; ‘ഉപദേശം’, ‘തോറാ’ എന്നീ സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וַיִּתְּנָהּ
  choice: അതു കൊടുത്തു
  rationale: സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം תּוֹרָהയിലേക്കാണ് മടങ്ങുന്നത്; ലളിതമായ ആഖ്യാനപ്രവർത്തനം നേരിട്ട് നൽകുന്നു.
- source_word: הַכֹּהֲנִים
  choice: പുരോഹിതന്മാർ
  rationale: כהנים എന്ന പദത്തിന്റെ പതിവും കൃത്യവുമായ മലയാള സമാനപദം.
- source_word: בְּנֵי לֵוִי
  choice: ലേവിയുടെ പുത്രന്മാരായ
  rationale: ‘ലേവ്യർ’ എന്നു ചുരുക്കാതെ എബ്രായത്തിലെ ‘ലേവിയുടെ പുത്രന്മാർ’ എന്ന പ്രയോഗവും പുരോഹിതന്മാരോടുള്ള സമാനാധികരണബന്ധവും സംരക്ഷിക്കുന്നു.
- source_word: הַנֹּשְׂאִים
  choice: ചുമക്കുന്ന
  rationale: പെട്ടകം വഹിക്കുന്ന പ്രവൃത്തിയെ വ്യക്തവും സ്വാഭാവികവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: യഹോവയുടെ ഉടമ്പടിപ്പെട്ടകം
  rationale: എബ്രായ സംയുക്തപ്രയോഗത്തിന്റെ ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: כָּל זִקְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിലെ എല്ലാ മൂപ്പന്മാർ
  rationale: ഇസ്രായേലിന്റെ നേതൃത്വസന്ദർഭത്തിലുള്ള זקנים എന്ന പദത്തെ പതിവായ ‘മൂപ്പന്മാർ’ എന്നു നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നതിനു പകരം പേര് നിലനിർത്തുന്നു; പരമ്പരാഗത പകരംവായന അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- issue: ഈ സന്ദർഭത്തിലെ תּוֹרָהയുടെ വ്യാപ്തി
  choice: ന്യായപ്രമാണം
  alternative: ഉപദേശം / തോറാ
  rationale: മോശെ എഴുതി ഏൽപ്പിക്കുന്ന ഉടമ്പടിസംബന്ധമായ നിയമബോധനമാണ് സന്ദർഭത്തിലെ സൂചന. പദത്തിന്റെ വിശാലമായ ‘ഉപദേശം’ എന്ന അർഥവും ലിപ്യന്തരണവും അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഉടമ്പടിപ്പെട്ടകം’, ‘പുരോഹിതന്മാർ’, ‘മൂപ്പന്മാർ’ എന്നീ സഭാപരിചിത പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ഉപയോഗിച്ചു; എബ്രായത്തിലെ ഘടനയും പ്രധാന പദവ്യത്യാസങ്ങളും കഴിയുന്നത്ര സംരക്ഷിച്ചു.
