source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם בֶּן מֵאָה֩ וְ/עֶשְׂרִ֨ים שָׁנָ֤ה אָנֹכִי֙ הַ/יּ֔וֹם לֹא אוּכַ֥ל ע֖וֹד לָ/צֵ֣את וְ/לָ/ב֑וֹא וַֽ/יהוָה֙ אָמַ֣ר אֵלַ֔/י לֹ֥א תַעֲבֹ֖ר אֶת הַ/יַּרְדֵּ֥ן הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/002.yaml
  text: And he said to them[a], “I am one hundred twenty years old today. I can no longer go out and come in, and Yahweh has said to me, ‘You shall not cross this Jordan.’”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “എനിക്ക് ഇന്ന് നൂറ്റിയിരുപത് വയസ്സുണ്ട്. ഇനി പുറത്തുപോകാനും അകത്തുവരാനും എനിക്കു കഴിയില്ല[a]. യഹ്‌വേ എന്നോടു, ‘നീ ഈ യോർദ്ദാൻ കടക്കുകയില്ല’ എന്നു പറഞ്ഞിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പുറത്തുപോകാനും അകത്തുവരാനും” എന്നത് ഒരു ഹീബ്രു ശൈലിപ്രയോഗമാണ്; ഇത് സാധാരണ പ്രവർത്തനങ്ങളെയോ ജനത്തെ നയിക്കുന്നതിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: അവൻ അവരോടു പറഞ്ഞു
  rationale: വയ്യക്ഷരമായ ഹീബ്രു ആഖ്യാനതുടർച്ച മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ വ്യക്തമായ കർത്താവിനെ അനാവശ്യമായി പേരെടുത്തു ചേർക്കുന്നില്ല.
- source_word: בֶּן מֵאָה וְעֶשְׂרִים שָׁנָה אָנֹכִי הַיּוֹם
  choice: ഇന്ന് എനിക്ക് നൂറ്റിയിരുപത് വയസ്സായി
  rationale: ‘നൂറ്റിയിരുപത് വർഷങ്ങളുടെ മകൻ’ എന്ന ഹീബ്രു പ്രായപ്രയോഗത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുകയും הַיּוֹם എന്ന കാലസൂചനയുടെ ഊന്നൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: לֹא אוּכַל עוֹד
  choice: ഇനി ... എനിക്കു കഴിയില്ല
  rationale: יכל സൂചിപ്പിക്കുന്ന കഴിവും עוֹד നൽകുന്ന ‘ഇനി/ഇനിമേൽ’ എന്ന അർത്ഥവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: לָצֵאת וְלָבוֹא
  choice: പുറത്തുപോകാനും അകത്തുവരാനും
  rationale: സാധാരണ പ്രവർത്തനത്തെയോ ജനത്തെ നയിക്കുന്ന ചുമതലയെയോ സൂചിപ്പിക്കാവുന്ന ഹീബ്രു ശൈലിപ്രയോഗം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ മുഖ്യവാചകത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: וַיהוָה
  choice: യഹ്‌വേ
  rationale: മൂലപാഠത്തിലുള്ള ദൈവനാമമായ יהוהയെ ഒരു സ്ഥാനനാമത്തിലൂടെ മാറ്റാതെ മലയാളത്തിൽ നേരിട്ട് ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: אָמַר אֵלַי
  choice: എന്നോട് ... എന്നു പറഞ്ഞിരിക്കുന്നു
  rationale: മുൻപ് അരുളിച്ചെയ്ത വാക്കിന്റെ ഇപ്പോഴത്തെ പ്രസക്തി മലയാളത്തിലെ പൂർത്തിക്രിയാരൂപത്തിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: לֹא תַעֲבֹר
  choice: നീ ... കടക്കുകയില്ല
  rationale: ദൈവിക വിലക്കായും ഉറച്ച പ്രഖ്യാപനമായും കേൾക്കാവുന്ന രൂപത്തെ വെറും അനുമതിനിഷേധമാക്കി ചുരുക്കാതെ പ്രഖ്യാപനശക്തിയോടെ നൽകുന്നു.
- source_word: אֶת הַיַּרְדֵּן הַזֶּה
  choice: ഈ യോർദ്ദാൻ
  rationale: הַזֶּה എന്ന സമീപസൂചകത്തിന്റെ അർത്ഥം നിലനിർത്തുന്നു; മൂലത്തിൽ പ്രത്യേകം ഇല്ലാത്ത ‘നദി’ എന്ന പദം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: വാക്യം ചതുരക്ഷര ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ പദവിയാക്കി മാറ്റാതെ, സാധാരണ പണ്ഡിതലോകത്ത് അംഗീകരിക്കപ്പെട്ട ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരം ഉപയോഗിക്കുന്നു.
- issue: לֹא תַעֲבֹר എന്നതിന്റെ നിർദേശം–പ്രഖ്യാപനം തമ്മിലുള്ള ഭാവം
  choice: കടക്കുകയില്ല
  alternative: കടക്കരുത്
  rationale: രൂപം വിലക്കായോ ഭാവിയെക്കുറിച്ചുള്ള ഉറച്ച ദൈവിക പ്രഖ്യാപനമായോ ഗ്രഹിക്കാം. സന്ദർഭത്തിൽ മോശെയുടെ ഭാവിയെക്കുറിച്ചുള്ള ദൈവനിർണ്ണയമാണ് മുൻനിൽക്കുന്നത്; അതിനാൽ പ്രഖ്യാപനരൂപം സ്വീകരിച്ചു, എന്നാൽ അതിന്റെ അധികാരഭാവം നഷ്ടപ്പെടുത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രു ശൈലിപ്രയോഗം മുഖ്യവാചകത്തിൽ സൂക്ഷിച്ച് അതിന്റെ അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കിയിരിക്കുന്നു.
