source:
  edition: WLC
  text: כִּ֣י יָדַ֗עְתִּי אַחֲרֵ֤י מוֹתִ/י֙ כִּֽי הַשְׁחֵ֣ת תַּשְׁחִת֔וּ/ן וְ/סַרְתֶּ֣ם מִן הַ/דֶּ֔רֶךְ אֲשֶׁ֥ר צִוִּ֖יתִי אֶתְ/כֶ֑ם וְ/קָרָ֨את אֶתְ/כֶ֤ם הָֽ/רָעָה֙ בְּ/אַחֲרִ֣ית הַ/יָּמִ֔ים כִּֽי תַעֲשׂ֤וּ אֶת הָ/רַע֙ בְּ/עֵינֵ֣י יְהוָ֔ה לְ/הַכְעִיס֖/וֹ בְּ/מַעֲשֵׂ֥ה יְדֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/029.yaml
  text: For I know that after my death you will surely act corruptly and turn aside from the way that I commanded you[a], and evil will befall you in the latter days, because you will do what is evil in the eyes of Yahweh[c][b], provoking him to anger by the work of your hands.
translation:
  language: ml
  text: എന്റെ മരണശേഷം നിങ്ങൾ തീർച്ചയായും ദുഷിച്ചുപോകുകയും ഞാൻ നിങ്ങളോടു കല്പിച്ച വഴിയിൽനിന്ന് വ്യതിചലിക്കുകയും ചെയ്യുമെന്ന് എനിക്കറിയാം.[a] വരാനിരിക്കുന്ന നാളുകളിൽ[c] അനർഥം[b] നിങ്ങളെ ബാധിക്കും; കാരണം, നിങ്ങൾ യഹോവയുടെ ദൃഷ്ടിയിൽ തിന്മയായതു ചെയ്യുകയും നിങ്ങളുടെ കൈകളുടെ പ്രവൃത്തികളാൽ അവിടുത്തെ കോപിപ്പിക്കുകയും ചെയ്യും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ദുഷിച്ചുപോകും” എന്നതിന് “നിങ്ങളെത്തന്നെ ദുഷിപ്പിക്കും” അല്ലെങ്കിൽ “ദുഷ്ടമായി പ്രവർത്തിക്കും” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിൽ ക്രിയയ്ക്ക് ശക്തമായ ഊന്നലുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: “അനർഥം” എന്നതിന് “ദുരന്തം,” “ആപത്ത്,” അല്ലെങ്കിൽ സന്ദർഭാനുസരണം “തിന്മ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: “വരാനിരിക്കുന്ന നാളുകളിൽ” എന്നതിന് അക്ഷരാർഥത്തോട് കൂടുതൽ അടുത്ത് “നാളുകളുടെ അന്ത്യത്തിൽ” അല്ലെങ്കിൽ പരമ്പരാഗതമായി “അന്ത്യനാളുകളിൽ” എന്നും പറയാം. ഈ പ്രയോഗം വരാനിരിക്കുന്ന കാലത്തെ സൂചിപ്പിക്കുന്നു; സന്ദർഭമനുസരിച്ച് അന്ത്യകാലപരമായ ഭാരം ഉണ്ടായേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יָדַעְתִּי
  choice: എനിക്കറിയാം
  rationale: മുൻവാക്യത്തിലെ മുന്നറിയിപ്പിന്റെ കാരണം അവതരിപ്പിക്കുകയും മോശയുടെ ഉറച്ച അറിവ് സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: אַחֲרֵי מוֹתִי
  choice: എന്റെ മരണശേഷം
  rationale: എബ്രായ നാമപ്രയോഗത്തിന്റെ രൂപവും അർഥവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: הַשְׁחֵת תַּשְׁחִתוּן
  choice: നിങ്ങൾ തീർച്ചയായും ദുഷിച്ചുപോകും
  rationale: ക്രിയയുടെ തീവ്രത സൂചിപ്പിക്കുന്ന infinitive absolute നിർമാണം ‘തീർച്ചയായും’ എന്നു പ്രകടിപ്പിക്കുന്നു; കർമമില്ലാത്ത സന്ദർഭത്തിൽ സ്വയം ദുഷിക്കുക/ദുഷിച്ചുപോകുക എന്ന അർഥം തുറന്നുവെക്കുന്നു.
- source_word: וְסַרְתֶּם מִן־הַדֶּרֶךְ
  choice: വഴിയിൽനിന്നു വ്യതിചലിക്കും
  rationale: കല്പിക്കപ്പെട്ട ജീവിതരീതിയിൽനിന്നുള്ള ഉടമ്പടിപരമായ വ്യതിയാനം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: אֲשֶׁר צִוִּיתִי אֶתְכֶם
  choice: ഞാൻ നിങ്ങളോടു കല്പിച്ച
  rationale: പ്രസംഗകനായ മോശ തന്നെയാണ് കല്പിച്ചതെന്ന വാക്യഘടന നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וְקָרָאת אֶתְכֶם הָרָעָה
  choice: അനർഥം നിങ്ങൾക്കു സംഭവിക്കും
  rationale: קרא എന്ന ക്രിയയും רָעָה എന്ന നാമവും ചേർന്ന പ്രയോഗത്തിലെ പ്രതികൂലസംഭവം വന്നുചേരുക എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: ഭാവികാലത്ത്
  rationale: ഭാവിയിലേക്കു ദൃഷ്ടി തിരിക്കുന്ന പ്രയോഗം നിലനിർത്തുന്നു; നിർബന്ധിതമായ ഒരു അന്ത്യകാല വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: כִּי תַעֲשׂוּ אֶת־הָרַע
  choice: തിന്മയായതു നിങ്ങൾ ചെയ്യും
  rationale: ധാർമികമായി തിന്മയെന്ന വിലയിരുത്തൽ വ്യക്തമായി സൂക്ഷിക്കുന്നു.
- source_word: בְּעֵינֵי יְהוָה
  choice: യഹോവയുടെ ദൃഷ്ടിയിൽ
  rationale: ദൈവത്തിന്റെ വിലയിരുത്തലനുസരിച്ച് എന്ന എബ്രായ പ്രയോഗം മലയാളത്തിലെ സ്വാഭാവിക ബൈബിൾ ശൈലിയിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി ഒരു പദവിയാൽ പകരാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: לְהַכְעִיסוֹ
  choice: അവിടുത്തെ കോപിപ്പിച്ചുകൊണ്ട്
  rationale: ഹിഫീൽ കാരണാർഥവും പ്രവൃത്തികളുടെ ഫലമായി ദൈവകോപം ഉണർത്തുന്നതും വ്യക്തമാക്കുന്നു.
- source_word: בְּמַעֲשֵׂה יְדֵיכֶם
  choice: നിങ്ങളുടെ കൈകളുടെ പ്രവൃത്തികളാൽ
  rationale: എബ്രായത്തിലെ ദൃശ്യരൂപം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ വിഗ്രഹങ്ങളെയോ മനുഷ്യർ നിർമിച്ച വസ്തുക്കളെയോ സൂചിപ്പിക്കാമെങ്കിലും അത് മുഖ്യവാചകത്തിൽ പരിമിതപ്പെടുത്തുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമം ഉപയോഗിക്കുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരാതെ മലയാളത്തിൽ പരിചിതമായ ദൈവനാമരൂപം നിലനിർത്തുന്നു.
- issue: בְּאַחֲרִית הַיָּמִים എന്ന പ്രയോഗത്തിന്റെ കാലസൂചന
  choice: ഭാവികാലത്ത്
  alternative: അന്ത്യനാളുകളിൽ
  rationale: പ്രയോഗത്തിന്റെ ഭാവിമുഖത നിലനിർത്തുകയും ഈ സന്ദർഭം നിർബന്ധമായും അന്തിമ അന്ത്യകാലത്തെ മാത്രം സൂചിപ്പിക്കുന്നു എന്നു തീർപ്പാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: ‘നിങ്ങളുടെ കൈകളുടെ പ്രവൃത്തികൾ’ എന്നതിന്റെ സൂചന
  choice: രൂപകം അതേപടി നിലനിർത്തി
  alternative: നിങ്ങൾ നിർമിച്ച വിഗ്രഹങ്ങളാൽ
  rationale: സന്ദർഭത്തിൽ വിഗ്രഹാരാധന സൂചിതമായിരിക്കാമെങ്കിലും മൂലപാഠം പൊതുവായ പ്രയോഗമാണ് ഉപയോഗിക്കുന്നത്; അതിനാൽ വ്യാഖ്യാനം മുഖ്യവാചകത്തിലേക്ക് ഇറക്കുമതി ചെയ്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘വഴി,’ ‘കൈകളുടെ പ്രവൃത്തികൾ,’ ‘ദൃഷ്ടിയിൽ’ തുടങ്ങിയ പ്രധാന എബ്രായ രൂപകങ്ങൾ നിലനിർത്തി; അസ്വാഭാവികമായ പദാനുപദക്രമം ഒഴിവാക്കി. ബഹുമാനസൂചകമായി യഹോവയെ തുടർന്ന് ‘അവിടുത്തെ’ ഉപയോഗിച്ചു.
