revisions:
- from: എന്നാൽ യഹ്‌വെ നിങ്ങളെ സ്നേഹിച്ചതുകൊണ്ടും നിങ്ങളുടെ പിതാക്കന്മാരോടു ചെയ്ത സത്യം പാലിച്ചതുകൊണ്ടും യഹ്‌വെ ശക്തമായ കൈകൊണ്ട് നിങ്ങളെ പുറപ്പെടുവിച്ചു; അടിമകളുടെ ഭവനത്തിൽനിന്ന്[a], ഈജിപ്തുരാജാവായ ഫറവോന്റെ കൈയിൽനിന്ന്, നിങ്ങളെ വീണ്ടെടുത്തു.
  to: എന്നാൽ, യഹ്‌വെ നിങ്ങളെ സ്നേഹിക്കുന്നതിനാലും നിങ്ങളുടെ പിതാക്കന്മാരോടു താൻ ചെയ്ത ശപഥം പാലിക്കുന്നതിനാലും, യഹ്‌വെ ശക്തമായ കൈകൊണ്ട് നിങ്ങളെ പുറത്തുകൊണ്ടുവന്നു; അടിമകളുടെ ഭവനത്തിൽനിന്ന്[a], ഈജിപ്തിലെ രാജാവായ ഫറവോന്റെ കൈയിൽനിന്ന്, അവൻ നിങ്ങളെ വീണ്ടെടുത്തു.
  rationale: The revision replaces the inaccurate “ചെയ്ത സത്യം” with “താൻ ചെയ്ത ശപഥം,” explicitly representing both the oath and the fact that Yahweh swore it to the fathers. It uses an ongoing causal form for Yahweh’s keeping of the oath, while retaining the source’s imagery, sequence, names, and ambiguity-free syntax. The existing footnote anchor remains correctly attached to “അടിമകളുടെ ഭവനത്തിൽനിന്ന്.”
