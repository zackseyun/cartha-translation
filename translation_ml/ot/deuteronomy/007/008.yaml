base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/008.yaml
  text: but because Yahweh loves you and because he is keeping the oath that he swore to your fathers[a], Yahweh brought you out with a mighty hand and redeemed you from the house of servants[b], from the hand of Pharaoh king of Egypt.
translation:
  language: ml
  text: എന്നാൽ, യഹ്‌വെ നിങ്ങളെ സ്നേഹിക്കുന്നതിനാലും നിങ്ങളുടെ പിതാക്കന്മാരോടു താൻ ചെയ്ത ശപഥം പാലിക്കുന്നതിനാലും, യഹ്‌വെ ശക്തമായ കൈകൊണ്ട് നിങ്ങളെ പുറത്തുകൊണ്ടുവന്നു; അടിമകളുടെ ഭവനത്തിൽനിന്ന്[a], ഈജിപ്തിലെ രാജാവായ ഫറവോന്റെ കൈയിൽനിന്ന്, അവൻ നിങ്ങളെ വീണ്ടെടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പരമ്പരാഗതമായി, “അടിമത്തത്തിന്റെ ഭവനത്തിൽനിന്ന്” എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രായത്തിൽ അക്ഷരാർഥം “അടിമകളുടെ ഭവനത്തിൽനിന്ന്” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: എന്നാൽ ... കൊണ്ടും
  rationale: മുൻവാക്യത്തിലെ നിഷേധത്തോടുള്ള വൈരുധ്യവും ഈ വാക്യത്തിലെ കാരണവിവരണവും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു.
- source_word: מֵאַהֲבַת יְהוָה אֶתְכֶם
  choice: യഹ്‌വെ നിങ്ങളെ സ്നേഹിച്ചതുകൊണ്ടും
  rationale: ഹീബ്രായ കാരണപ്രയോഗത്തെ സ്വാഭാവികമായ മലയാള ക്രിയാരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וּמִשָּׁמְרוֹ אֶת הַשְּׁבֻעָה
  choice: ചെയ്ത സത്യം പാലിച്ചതുകൊണ്ടും
  rationale: ശപഥം വിശ്വസ്തമായി കാത്തുപാലിക്കുന്നതെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; പൂർത്തിയായ പുറപ്പാടിന്റെ കാരണമായി സമാന്തര ഘടന നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר נִשְׁבַּע לַאֲבֹתֵיכֶם
  choice: നിങ്ങളുടെ പിതാക്കന്മാരോടു ചെയ്ത
  rationale: ഉടമ്പടി-ചരിത്രപരമായ പിതൃപുരുഷന്മാരെ സൂചിപ്പിക്കുന്ന പുരുഷലിംഗ ബഹുവചനത്തിന്റെ പ്രത്യേകത നിലനിർത്തുന്നു.
- source_word: בְּיָד חֲזָקָה
  choice: ശക്തമായ കൈകൊണ്ട്
  rationale: ദൈവത്തിന്റെ പ്രബലമായ വിടുതൽപ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രായ കൈ-രൂപകം നിലനിർത്തുന്നു.
- source_word: וַיִּפְדְּךָ
  choice: നിങ്ങളെ വീണ്ടെടുത്തു
  rationale: അടിമത്തത്തിൽനിന്നുള്ള മോചനവും വിലകൊടുത്തു വിടുവിക്കലുമായി ബന്ധപ്പെട്ട פדה എന്ന പദത്തിന്റെ ഭാരമുള്ള അർഥം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: מִבֵּית עֲבָדִים
  choice: അടിമകളുടെ ഭവനത്തിൽനിന്ന്
  rationale: അക്ഷരാർഥമായ 'അടിമകളുടെ ഭവനം' എന്ന സജീവ രൂപകം നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ അടിമത്തം മൃദൂകരിക്കുന്നില്ല.
- source_word: מִיַּד פַּרְעֹה
  choice: ഫറവോന്റെ കൈയിൽനിന്ന്
  rationale: ഫറവോന്റെ അധികാരത്തിൽനിന്നുള്ള മോചനം സൂചിപ്പിക്കുന്ന ആവർത്തിത കൈ-രൂപകം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ സംരക്ഷിക്കുന്നു.
- issue: אֲבֹתֵיכֶם എന്ന ഉടമ്പടി-പൂർവിക പദം
  choice: നിങ്ങളുടെ പിതാക്കന്മാർ
  alternative: നിങ്ങളുടെ പൂർവികർ
  rationale: സന്ദർഭം പിതൃപുരുഷന്മാരെ ലക്ഷ്യമിടുന്നതിനാൽ മൂലത്തിലെ പുരുഷലിംഗവും ചരിത്രപരമായ പ്രത്യേകതയും നിലനിർത്തുന്നു.
- issue: עֲבָדִים എന്ന ബന്ധനപദം
  choice: അടിമകൾ
  alternative: ദാസന്മാർ
  rationale: ഈജിപ്തിലെ നിർബന്ധിത അടിമത്തം കേന്ദ്രമായതിനാൽ അതിന്റെ കഠിനത വ്യക്തമാക്കുന്ന പദം ഉപയോഗിക്കുന്നു.
- issue: וּמִשָּׁמְרוֹ എന്ന രൂപത്തിന്റെ കാലഭാവം
  choice: പാലിച്ചതുകൊണ്ടും
  alternative: പാലിച്ചുകൊണ്ടിരിക്കുന്നതുകൊണ്ടും
  rationale: ഹീബ്രായ ഇൻഫിനിറ്റീവ് ഘടന കാരണം കർത്താവിന്റെ സത്യം കാത്തുസൂക്ഷിക്കൽ തന്നെയാണ് പ്രധാനം; മലയാളത്തിൽ പൂർത്തിയായ പുറപ്പാടിന്റെ കാരണമായി ഭൂതകാലരൂപം സ്വാഭാവികമാണ്, എങ്കിലും തുടർച്ചയായ വിശ്വസ്തത എന്ന ഭാവം പൂർണമായി നിഷേധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഹീബ്രായത്തിലെ 'കൈ' എന്ന ആവർത്തിത രൂപകവും 'അടിമകളുടെ ഭവനം' എന്ന ദൃശ്യപ്രയോഗവും നിലനിർത്തിയിരിക്കുന്നു.
