revisions:
- from: അതിനാൽ, നിന്റെ ദൈവമായ യഹോവതന്നെയാണ് ദൈവം എന്ന് നീ അറിഞ്ഞുകൊള്ളുക[a]. അവിടുന്ന് വിശ്വസ്തനായ ദൈവമാണ്; തന്നെ സ്നേഹിക്കുകയും തന്റെ കല്പനകൾ പാലിക്കുകയും ചെയ്യുന്നവർക്കുവേണ്ടി ആയിരം തലമുറവരെ[c][d] ഉടമ്പടിയും അചഞ്ചലസ്നേഹവും[b] കാത്തുപാലിക്കുന്നവൻ.
  to: അതുകൊണ്ട്, നിന്റെ ദൈവമായ യഹോവ തന്നെയാണ് ദൈവം എന്നു നീ അറിഞ്ഞുകൊള്ളുക[a]. അവിടുന്ന് വിശ്വസ്തനായ ദൈവമാണ്; അവിടുത്തെ സ്നേഹിക്കുന്നവർക്കും അവിടുത്തെ കൽപ്പനകൾ പാലിക്കുന്നവർക്കും വേണ്ടി, ആയിരം തലമുറവരെ[c][d], അവിടുന്ന് ഉടമ്പടിയും അചഞ്ചല സ്നേഹവും[b] കാത്തുപാലിക്കുന്നു.
  rationale: The revision preserves the draft’s meaning and all footnote anchors. It renders the two parallel recipient expressions separately, clarifies that ‘a thousand generations’ modifies God’s enduring covenant-keeping, and uses standard spacing in ‘അചഞ്ചല സ്നേഹം.’
