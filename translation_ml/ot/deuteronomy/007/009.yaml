id: DEU.7.9
reference: Deuteronomy 7:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/יָ֣דַעְתָּ֔ כִּֽי יְהוָ֥ה אֱלֹהֶ֖י/ךָ ה֣וּא הָֽ/אֱלֹהִ֑ים הָ/אֵל֙ הַֽ/נֶּאֱמָ֔ן שֹׁמֵ֧ר הַ/בְּרִ֣ית וְ/הַ/חֶ֗סֶד לְ/אֹהֲבָ֛י/ו וּ/לְ/שֹׁמְרֵ֥י מצות/ו לְ/אֶ֥לֶף דּֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/009.yaml
  text: Know[a], therefore, that Yahweh your God, he is God, the faithful God, keeping the covenant and the steadfast love for those who love him and for those who keep his commandments[d][c][b], to a thousand generations.
translation:
  language: ml
  text: അതുകൊണ്ട്, നിന്റെ ദൈവമായ യഹോവ തന്നെയാണ് ദൈവം എന്നു നീ അറിഞ്ഞുകൊള്ളുക[a]. അവിടുന്ന് വിശ്വസ്തനായ ദൈവമാണ്; അവിടുത്തെ സ്നേഹിക്കുന്നവർക്കും അവിടുത്തെ കൽപ്പനകൾ പാലിക്കുന്നവർക്കും വേണ്ടി, ആയിരം തലമുറവരെ[c][d], അവിടുന്ന് ഉടമ്പടിയും അചഞ്ചല സ്നേഹവും[b] കാത്തുപാലിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നീ അറിഞ്ഞുകൊള്ളുക’ എന്നതിന് ‘അറിഞ്ഞുകൊൾക’ എന്നും പരിഭാഷപ്പെടുത്താം; തുടക്കത്തിലെ ഹീബ്രു സംയോജകത്തെ ‘അതിനാൽ’, ‘അങ്ങനെ’, അല്ലെങ്കിൽ ‘കൂടാതെ’ എന്നു സന്ദർഭാനുസരണം മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: 'ഹീബ്രു: חֶסֶד (ഖെസെദ്); ‘ഉടമ്പടിവിശ്വസ്തത’, ‘കരുണ’, ‘വിശ്വസ്തസ്നേഹം’ എന്നീ അർഥഭാവങ്ങളും ഇതിലുണ്ട്.'
    reason: lexical_alternative
  - marker: c
    text: ‘ആയിരം തലമുറകൾക്കായി’ എന്നും പരിഭാഷപ്പെടുത്താം. അതിവിപുലമായ കാലയളവിലുടനീളമുള്ള ഉടമ്പടിവിശ്വസ്തതയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: d
    text: 'മറ്റൊരു ഘടന: ‘അവിടുത്തെ സ്നേഹിക്കുന്നവർക്കും അവിടുത്തെ കൽപ്പനകൾ പാലിക്കുന്നവർക്കും വേണ്ടി, ആയിരം തലമുറവരെ’. ‘ആയിരം തലമുറവരെ’ എന്നത് ദൈവത്തിന്റെ ഉടമ്പടിയും അചഞ്ചല സ്നേഹവും കാത്തുപാലിക്കുന്നതിന്റെ ദൈർഘ്യത്തെ സൂചിപ്പിക്കുന്നു.'
    reason: previous_rendering
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: അതിനാൽ ... നീ അറിഞ്ഞുകൊള്ളുക
  rationale: സന്ദർഭത്തിലെ നിഗമനസ്വഭാവം ‘അതിനാൽ’കൊണ്ടും നിർദേശാത്മകമായി പ്രവർത്തിക്കുന്ന ഖാൽ പെർഫെക്റ്റ് ‘അറിഞ്ഞുകൊള്ളുക’കൊണ്ടും പ്രകടമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമത്തിന്റെ പരമ്പരാഗതവും തിരിച്ചറിയാവുന്നതുമായ മലയാളരൂപം നിലനിർത്തുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: രണ്ടാം പുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: הוּא הָאֱלֹהִים
  choice: തന്നെയാണ് ദൈവം
  rationale: הוּא നൽകുന്ന ഊന്നലും ദൈവത്തിന്റെ അനന്യതയും ‘തന്നെയാണ്’ എന്ന രൂപത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: הָאֵל הַנֶּאֱמָן
  choice: വിശ്വസ്തനായ ദൈവം
  rationale: ദൃഢത, ആശ്രയയോഗ്യത, ഉടമ്പടിയോടുള്ള വിശ്വസ്തത എന്നിവ ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക പദപ്രയോഗം.
- source_word: שֹׁמֵר
  choice: കാത്തുപാലിക്കുന്നവൻ
  rationale: തുടർച്ചയായ പ്രവർത്തനം സൂചിപ്പിക്കുന്ന കർത്തൃവാചക രൂപത്തെയും ഉടമ്പടി സൂക്ഷിച്ചുനിറവേറ്റുന്ന ആശയത്തെയും വ്യക്തമാക്കുന്നു.
- source_word: הַבְּרִית
  choice: ഉടമ്പടി
  rationale: ബൈബിൾപരവും പൊതുവേ ഗ്രഹിക്കാവുന്നതുമായ സ്ഥിരമായ തത്തുല്യപദം.
- source_word: וְהַחֶסֶד
  choice: അചഞ്ചലസ്നേഹം
  rationale: חֶסֶד എന്ന പദത്തിലെ നിലനിൽക്കുന്ന സ്നേഹവും ഉടമ്പടിപരമായ വിശ്വസ്തതയും സംക്ഷിപ്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: לְאֹהֲבָיו
  choice: തന്നെ സ്നേഹിക്കുന്നവർക്കുവേണ്ടി
  rationale: ലാമെദ് സൂചിപ്പിക്കുന്ന ഗുണഭോക്തൃബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: וּלְשֹׁמְרֵי מִצְוֹתָו
  choice: തന്റെ കല്പനകൾ പാലിക്കുന്നവർക്കുവേണ്ടി
  rationale: സ്നേഹിക്കുന്നവരോടുള്ള സമാന്തരഘടനയും കല്പനാനുസരണത്തിന്റെ ഉടമ്പടിപരമായ ഭാവവും നിലനിർത്തുന്നു.
- source_word: לְאֶלֶף דּוֹר
  choice: ആയിരം തലമുറവരെ
  rationale: അപരിമിതമായി ദീർഘിക്കുന്ന ഉടമ്പടിവിശ്വസ്തതയെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗം അടുത്തും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: ദൈവത്തിന്റെ ഉടമ്പടിവിശ്വസ്തതയും മനുഷ്യരുടെ സ്നേഹവും അനുസരണവും തമ്മിലുള്ള ബന്ധം
  choice: ദൈവത്തെ സ്നേഹിക്കുകയും അവന്റെ കല്പനകൾ പാലിക്കുകയും ചെയ്യുന്നവർക്കുവേണ്ടി അവൻ ഉടമ്പടിയും അചഞ്ചലസ്നേഹവും കാത്തുപാലിക്കുന്നു
  alternative: ദൈവം അവരെ വ്യവസ്ഥകളില്ലാതെ സ്നേഹിക്കുന്നു എന്ന പൊതുവായ പ്രസ്താവന
  rationale: വാക്യം ദൈവത്തിന്റെ വിശ്വസ്തതയെ മനുഷ്യരുടെ ഉടമ്പടിസ്നേഹത്തോടും അനുസരണത്തോടും നേരിട്ട് ബന്ധിപ്പിക്കുന്നു; ഈ പാഠത്തിലെ വ്യവസ്ഥാപരമായ സംഘർഷം മൃദൂകരിക്കാതെ നിലനിർത്തുന്നു.
- issue: הוּא הָאֱלֹהִים എന്നതിലെ ഊന്നലും അനന്യതയും
  choice: യഹോവതന്നെയാണ് ദൈവം
  alternative: യഹോവ ഒരു ദൈവമാണ്
  rationale: ഹീബ്രു നിർദ്ദിഷ്ടരൂപവും ഊന്നൽസർവനാമവും യഹോവയുടെ അനന്യത പ്രഖ്യാപിക്കുന്നു; ബഹുദൈവസാദ്ധ്യത ഉണർത്തുന്ന വിവർത്തനം ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ദൈവത്തെ സൂചിപ്പിക്കാൻ ആദരസൂചക ഏകവചനമായ ‘അവിടുന്ന്’ ഉപയോഗിച്ചു; എന്നാൽ ഹീബ്രുവിലെ രണ്ടാം പുരുഷ ഏകവചനത്തെ ‘നിന്റെ/നീ’യായി നിലനിർത്തി. പാഠത്തിലെ എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
