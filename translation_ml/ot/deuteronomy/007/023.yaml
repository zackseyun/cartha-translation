id: DEU.7.23
reference: Deuteronomy 7:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/נְתָנָ֛/ם יְהוָ֥ה אֱלֹהֶ֖י/ךָ לְ/פָנֶ֑י/ךָ וְ/הָמָ/ם֙ מְהוּמָ֣ה גְדֹלָ֔ה עַ֖ד הִשָּׁמְדָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/023.yaml
  text: But Yahweh your God will give them over to you and throw them into great confusion until they are destroyed[a][b].
translation:
  language: ml
  text: എന്നാൽ നിങ്ങളുടെ ദൈവമായ യഹ്വേ അവരെ നിങ്ങളുടെ കൈയിൽ ഏല്പിക്കുകയും അവർ നശിച്ചുപോകുന്നതുവരെ അവരെ വലിയ പരിഭ്രാന്തിയിലാക്കുകയും ചെയ്യും.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പദാനുപദമായി, ‘നിങ്ങളുടെ മുമ്പിൽ’. ഇവിടെ ശത്രുക്കളെ നിങ്ങളുടെ അധികാരത്തിൽ ഏല്പിക്കുക എന്നാണ് പ്രയോഗത്തിന്റെ അർഥം.
    reason: lexical_alternative
  - marker: b
    text: ‘വലിയ സംഭ്രമത്തിലാക്കും’ അല്ലെങ്കിൽ ‘വലിയ കലക്കത്തിലാക്കും’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתָנָם ... לְפָנֶיךָ
  choice: അവരെ നിങ്ങളുടെ കൈയിൽ ഏല്പിക്കുകയും
  rationale: പദാനുപദമായി ‘അവരെ നിങ്ങളുടെ മുമ്പിൽ നൽകും’ എന്നാണ്; എന്നാൽ യുദ്ധസന്ദർഭത്തിൽ נתן + לְפָנֶיךָ ശത്രുക്കളെ ഒരാളുടെ അധികാരത്തിലാക്കുക എന്ന ആശയം നൽകുന്നു. ‘നിങ്ങളുടെ കൈയിൽ ഏല്പിക്കുക’ സ്വാഭാവികമായി ആ സൈനിക അർഥം വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്വേ
  rationale: ഹീബ്രു ദൈവനാമമായ ചതുരക്ഷരി יהוה ഒരു പദവിയാൽ മാറ്റിസ്ഥാപിക്കാതെ വ്യക്തിനാമമായി ലിപ്യന്തരിച്ചു.
- source_word: אֱלֹהֶיךָ
  choice: നിങ്ങളുടെ ദൈവമായ
  rationale: രണ്ടാം പുരുഷ ഏകവചന പ്രത്യയം ഉൾപ്പെട്ട രൂപത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘നിന്റെ ദൈവം’ എന്നാണ്; മോശെ സമൂഹത്തോട് സംസാരിക്കുന്ന മലയാളസന്ദർഭത്തിൽ ആദരസൂചക ബഹുവചനമായ ‘നിങ്ങളുടെ’ സ്വാഭാവികമാണ്.
- source_word: וְהָמָם מְהוּמָה גְדֹלָה
  choice: അവരെ വലിയ പരിഭ്രാന്തിയിലാക്കുകയും
  rationale: המם എന്ന ക്രിയ യുദ്ധത്തിൽ ഭീതി, ആശയക്കുഴപ്പം, ചിതറിപ്പോക്ക് എന്നിവ ഉണ്ടാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; מְהוּמָה גְדֹלָה അതിന്റെ തീവ്രത വ്യക്തമാക്കുന്നു. ‘വലിയ പരിഭ്രാന്തി’ ഭീതിയുടെയും കലക്കത്തിന്റെയും സംയുക്തഭാവം നിലനിർത്തുന്നു.
- source_word: עַד הִשָּׁמְדָם
  choice: അവർ നശിച്ചുപോകുന്നതുവരെ
  rationale: עַד സഹിതമുള്ള שׁמד ക്രിയയുടെ infinitive construct പ്രവർത്തിയുടെ അന്തിമപരിധി സൂചിപ്പിക്കുന്നു. ഈ പരിഭാഷ ഫലസൂചകമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തമായ ദൈവനാമം തന്നെയാണുള്ളത്. അതിനാൽ ഒരു പദവിയായ ‘കർത്താവ്’ ഉപയോഗിക്കാതെ, സാധാരണ പണ്ഡിതലിപ്യന്തരണത്തോട് ചേർന്ന ‘യഹ്വേ’ ഉപയോഗിച്ചു.
translation_notes:
  register: ആധുനികവും മാന്യവും പൊതുവായ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഏകവചന ഹീബ്രു അഭിസംബോധനയ്ക്ക് മലയാളത്തിലെ സ്വാഭാവിക ആദരസൂചക രൂപമായ ‘നിങ്ങളുടെ’ ഉപയോഗിച്ചു. മുഖ്യവാചകത്തിൽ സൈനികസന്ദർഭം സ്വാഭാവികമായി വ്യക്തമാക്കി; പദാനുപദ രൂപവും മְהוּמָהയുടെ അർഥവ്യാപ്തിയും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
