source:
  edition: WLC
  text: וְ/גַם֙ אֶת הַ/צִּרְעָ֔ה יְשַׁלַּ֛ח יְהוָ֥ה אֱלֹהֶ֖י/ךָ בָּ֑/ם עַד אֲבֹ֗ד הַ/נִּשְׁאָרִ֛ים וְ/הַ/נִּסְתָּרִ֖ים מִ/פָּנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/020.yaml
  text: Moreover[b][a], Yahweh your God will send the hornet among them until even those who remain and those who hide themselves from before you perish.
translation:
  language: ml
  text: കൂടാതെ[b], നിന്റെ ദൈവമായ യഹോവ അവരുടെ ഇടയിൽ കടന്നലിനെ[a] അയച്ചുകൊണ്ടിരിക്കും; നിന്റെ മുമ്പിൽനിന്ന് ശേഷിച്ചവരും ഒളിച്ചിരിക്കുന്നവരും നശിച്ചുപോകുന്നതുവരെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ഒരുപക്ഷേ, ‘ഭീതി’ അല്ലെങ്കിൽ ‘പരിഭ്രാന്തി’; ചിലർ ‘കടന്നൽ’ എന്നത് യഥാർഥ കീടത്തെയല്ല, ദൈവം അയയ്ക്കുന്ന ഭീതിയെ രൂപകമായി സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അതുകൂടാതെ’.
    reason: previous_rendering
lexical_decisions:
- source_word: וְגַם
  choice: കൂടാതെ
  rationale: മുൻവാക്യത്തിലെ വാഗ്ദാനത്തോട് മറ്റൊരു ദൈവിക നടപടി കൂട്ടിച്ചേർക്കുന്ന സംയോജകവും ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: הַצִּרְעָה
  choice: കടന്നലിനെ
  rationale: നിശ്ചയാർഥക ഏകവചന നാമത്തിന്റെ പ്രാഥമികമായ കീടാർഥം നിലനിർത്തുന്നു; ഇവിടെ അത് വർഗത്തെയോ കൂട്ടത്തെയോ സൂചിപ്പിക്കാം.
- source_word: יְשַׁלַּח
  choice: അയക്കും
  rationale: യഹോവ ഈ ഉപാധിയെ ശത്രുക്കളുടെ ഇടയിലേക്ക് സജീവമായി അയയ്ക്കുന്നതിനെ നേരിട്ട് അവതരിപ്പിക്കുന്നു.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ യഹോവ
  rationale: ദൈവനാമവും രണ്ടാംപുരുഷ ഏകവചന ഉടമസ്ഥബന്ധവും വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: בָּם
  choice: അവരുടെ ഇടയിൽ
  rationale: ശത്രുക്കളുടെ നടുവിലേക്ക് അയയ്ക്കപ്പെടുന്നു എന്ന സ്ഥലസംബന്ധിയായ അർഥം നൽകുന്നു.
- source_word: עַד אֲבֹד
  choice: നശിച്ചുപോകുന്നതുവരെ
  rationale: പ്രവർത്തനത്തിന്റെ അന്തിമപരിധി സൂചിപ്പിക്കുന്ന ഘടനയെ സ്വാഭാവിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: הַנִּשְׁאָרִים
  choice: ശേഷിച്ചവർ
  rationale: മുൻവിധികൾക്കുശേഷം ബാക്കിയായവരെ സൂചിപ്പിക്കുന്നു; സാങ്കേതികമായ ‘ശേഷിപ്പ്’ എന്ന ദൈവശാസ്ത്രപദം അനാവശ്യമായി ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: וְהַנִּסְתָּרִים
  choice: ഒളിച്ചിരിക്കുന്നവർ
  rationale: രൂപം നിഫാൽ പങ്കാളിയായിരുന്നാലും സന്ദർഭത്തിൽ ഇസ്രായേലിൽനിന്ന് മറഞ്ഞിരിക്കുന്ന ശത്രുക്കളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: מִפָּנֶיךָ
  choice: നിന്റെ മുമ്പിൽനിന്ന്
  rationale: ‘നിന്റെ മുഖം/സാന്നിധ്യം മുമ്പിൽനിന്ന്’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്ഥലപരവും സാന്നിധ്യപരവുമായ ഭാവം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം പൊതുവായ ബിരുദമാക്കി മാറ്റാതെ മലയാളത്തിൽ പരമ്പരാഗതമായി തിരിച്ചറിയപ്പെടുന്ന രൂപത്തിൽ നൽകുന്നു.
- issue: הַצִּרְעָה അക്ഷരാർഥത്തിലോ രൂപകാർഥത്തിലോ വായിക്കണമോ
  choice: പ്രധാനപാഠത്തിൽ ‘കടന്നൽ’ എന്ന അക്ഷരാർഥം
  alternative: ദൈവം അയയ്ക്കുന്ന ഭീതി/പരിഭ്രാന്തി എന്ന രൂപകാർഥം
  rationale: പദത്തിന്റെ പ്രാഥമിക നിഘണ്ടുവാർഥം കീടമാണ്; രൂപകവായന സാധ്യമെങ്കിലും അത് നിർബന്ധമായി തീർപ്പാക്കാതെ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘അതു തുടരും’ എന്നത് കടന്നലിനെ അയയ്ക്കുന്ന പ്രവർത്തനം ‘നശിച്ചുപോകുന്നതുവരെ’ നീളുന്നു എന്ന എബ്രായ ഘടന മലയാളത്തിൽ അസന്ദിഗ്ധമാക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
