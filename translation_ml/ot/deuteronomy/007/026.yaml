  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לֹא תָבִ֤יא תֽוֹעֵבָה֙ אֶל בֵּיתֶ֔/ךָ וְ/הָיִ֥יתָ חֵ֖רֶם כָּמֹ֑/הוּ שַׁקֵּ֧ץ תְּשַׁקְּצֶ֛/נּוּ וְ/תַעֵ֥ב תְּֽתַעֲבֶ֖/נּוּ כִּי חֵ֥רֶם הֽוּא־־׀׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/026.yaml
  text: And you shall not bring an abomination into your house[a], or you will become devoted to destruction like it. You shall utterly detest it and utterly abhor it, for it is devoted to destruction.
translation:
  language: ml
  text: അറപ്പുളവാക്കുന്ന ഒരു വസ്തുവും നിന്റെ വീട്ടിലേക്ക് കൊണ്ടുവരരുത്; അല്ലെങ്കിൽ അതിനെപ്പോലെ നീയും നാശത്തിനായി വേർതിരിക്കപ്പെട്ടവനായിത്തീരും[a]. അതിനെ തീർത്തും അറപ്പായി കരുതണം; തീർത്തും വെറുക്കണം; കാരണം അത് നാശത്തിനായി വേർതിരിക്കപ്പെട്ടതാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിരോധനത്തിനുകീഴിലുള്ളവൻ’; പരമ്പരാഗതമായി, ‘ശപിക്കപ്പെട്ടവൻ.’ എബ്രായപദം ദൈവിക ന്യായവിധിയാൽ നാശത്തിനായി വേർതിരിക്കപ്പെട്ട ഒന്നിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָבִיא
  choice: കൊണ്ടുവരരുത്
  rationale: בוא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ ഒരു വസ്തുവിനെ വീട്ടിനകത്തേക്കു വരുത്തുക എന്ന അർഥത്തിലാണ്. ‘കൊണ്ടുവരുക’ വിലക്കിന്റെ നേരിട്ടുള്ള സ്വഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: תּוֹעֵבָה
  choice: അറപ്പുളവാക്കുന്ന യാതൊന്നും
  rationale: നിയമാവർത്തനത്തിൽ ഈ പദം, വിശേഷിച്ച് വിഗ്രഹാരാധനയുമായി ബന്ധപ്പെട്ട്, മതപരമായും ധാർമികമായും വെറുക്കപ്പെടേണ്ട വസ്തുവിനെ സൂചിപ്പിക്കുന്നു. ‘അറപ്പുളവാക്കുന്ന’ എന്നത് അതിന്റെ ശക്തമായ നിഷേധാത്മക ഭാവം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നൽകുന്നു.
- source_word: בֵּיתֶךָ
  choice: നിന്റെ വീട്ടിലേക്ക്
  rationale: എബ്രായപദത്തിന്റെ മൂർത്തമായ അർഥം ‘നിന്റെ വീട്’ എന്നാണ്. ഇവിടെ നിരോധിത വസ്തു കൊണ്ടുവരരുതാത്ത ഗാർഹിക ഇടത്തെയാണ് അത് സൂചിപ്പിക്കുന്നത്.
- source_word: וְהָיִיתָ חֵרֶם כָּמֹהוּ
  choice: അല്ലെങ്കിൽ അതിനെപ്പോലെ നീയും നാശത്തിനായി സമർപ്പിക്കപ്പെട്ടവനായിത്തീരും
  rationale: വാവ് ഇവിടെ വിലക്ക് ലംഘിക്കുന്നതിന്റെ അനന്തരഫലം അറിയിക്കുന്നതായി സ്വാഭാവിക മലയാളത്തിൽ ‘അല്ലെങ്കിൽ’ എന്നു നൽകി. חֵרֶם ദൈവിക ന്യായവിധിയിൽ നശിപ്പിക്കപ്പെടാൻ വേർതിരിക്കപ്പെട്ട അവസ്ഥയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘നാശത്തിനായി സമർപ്പിക്കപ്പെട്ട’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: חֵרֶם
  choice: നാശത്തിനായി സമർപ്പിക്കപ്പെട്ടത്
  rationale: വെറും ശാപം എന്നതിനേക്കാൾ, ദൈവിക ന്യായവിധിപ്രകാരം നാശത്തിനായി വേർതിരിക്കപ്പെട്ടതെന്ന നിയമാവർത്തനത്തിലെ സവിശേഷ ആശയം ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: שַׁקֵּץ תְּשַׁקְּצֶנּוּ
  choice: അതിനെ തീർത്തും വെറുക്കുകയും
  rationale: ക്രിയാനാമത്തിന്റെ പരമരൂപവും സമാപികക്രിയയും ചേർന്നുള്ള എബ്രായ ഘടന കല്പനയ്ക്ക് ഊന്നൽ നൽകുന്നു. ‘തീർത്തും’ ആ ഊന്നൽ സ്വാഭാവികമായി പകരുന്നു.
- source_word: וְתַעֵב תְּתַעֲבֶנּוּ
  choice: തീർത്തും അറയ്ക്കുകയും വേണം
  rationale: ഇവിടെയും ആവർത്തിത ക്രിയാഘടന ശക്തമായ ഊന്നൽ നൽകുന്നു. ‘വെറുക്കുക’ എന്ന ആദ്യ ക്രിയയിൽനിന്നുള്ള പദവ്യത്യാസം നിലനിർത്താൻ ‘അറയ്ക്കുക’ ഉപയോഗിച്ചു.
- source_word: כִּי חֵרֶם הוּא
  choice: കാരണം അത് നാശത്തിനായി സമർപ്പിക്കപ്പെട്ടതാണ്
  rationale: കാരണവാക്യം ആ വസ്തുവിനെ എന്തുകൊണ്ട് പൂർണമായി നിരസിക്കണമെന്നു വിശദീകരിക്കുന്നു. മുൻപത്തെ חֵרֶם എന്ന പദവുമായുള്ള ബന്ധം ഒരേ പരിഭാഷ ആവർത്തിച്ച് നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഉടമ്പടി-ന്യായവിധിയുടെ പശ്ചാത്തലത്തിൽ חֵרֶם എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: നാശത്തിനായി സമർപ്പിക്കപ്പെട്ടത്
  alternative: നിരോധനത്തിനുകീഴിലുള്ളത്; ശപിക്കപ്പെട്ടത്
  rationale: വിഗ്രഹാരാധനയുമായി ബന്ധപ്പെട്ട വസ്തു ദൈവിക ന്യായവിധിയിൽ നാശത്തിനായി വേർതിരിക്കപ്പെട്ടതാണെന്നും അതിനെ വീട്ടിൽ കൊണ്ടുവരുന്നവനും അതേ നിലയിൽപ്പെടുമെന്നും വാക്യം പറയുന്നു. ‘ശപിക്കപ്പെട്ടത്’ എന്നത് ആശയത്തിന്റെ ഒരു ഭാഗം മാത്രം നൽകുന്നു; ‘നിരോധനത്തിനുകീഴിലുള്ളത്’ ആധുനിക വായനക്കാർക്ക് അവ്യക്തമാകാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ഏകവചന ദ്വിതീയപുരുഷസംബോധന നിലനിർത്തി. എബ്രായത്തിലെ രണ്ടു വ്യത്യസ്ത വെറുപ്പ്-ക്രിയകളും അവയുടെ ഊന്നലും ‘തീർത്തും വെറുക്കുക/തീർത്തും അറയ്ക്കുക’ എന്ന സമാന്തരപ്രയോഗത്തിലൂടെ സംരക്ഷിച്ചു.
