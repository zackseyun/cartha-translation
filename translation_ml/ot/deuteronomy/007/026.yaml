revisions:
- from: അറപ്പുളവാക്കുന്ന യാതൊന്നും നിന്റെ വീട്ടിലേക്കു കൊണ്ടുവരരുത്; അല്ലെങ്കിൽ അതിനെപ്പോലെ നീയും നാശത്തിനായി സമർപ്പിക്കപ്പെട്ടവനായിത്തീരും.[a] അതിനെ തീർത്തും വെറുക്കുകയും തീർത്തും അറയ്ക്കുകയും വേണം; കാരണം അത് നാശത്തിനായി സമർപ്പിക്കപ്പെട്ടതാണ്.
  to: അറപ്പുളവാക്കുന്ന ഒരു വസ്തുവും നിന്റെ വീട്ടിലേക്ക് കൊണ്ടുവരരുത്; അല്ലെങ്കിൽ അതിനെപ്പോലെ നീയും നാശത്തിനായി വേർതിരിക്കപ്പെട്ടവനായിത്തീരും[a]. അതിനെ തീർത്തും അറപ്പായി കരുതണം; തീർത്തും വെറുക്കണം; കാരണം അത് നാശത്തിനായി വേർതിരിക്കപ്പെട്ടതാണ്.
  rationale: The revision corrects the erroneous ‘അറയ്ക്കുക,’ preserves the two emphatic Hebrew rejection verbs through natural parallel Malayalam commands, and renders חֵרֶם consistently as being set apart for destruction. The note is retained with its anchor placed at the first occurrence of the term it explains.
