  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹ֣א מֵֽ/רֻבְּ/כֶ֞ם מִ/כָּל הָֽ/עַמִּ֗ים חָשַׁ֧ק יְהוָ֛ה בָּ/כֶ֖ם וַ/יִּבְחַ֣ר בָּ/כֶ֑ם כִּֽי אַתֶּ֥ם הַ/מְעַ֖ט מִ/כָּל הָ/עַמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/007.yaml
  text: It was not because you were more numerous than all the peoples that Yahweh set his affection on you and chose you[a], for you were the fewest of all the peoples.
translation:
  language: ml
  text: നിങ്ങൾ മറ്റെല്ലാ ജനതകളെക്കാളും എണ്ണത്തിൽ കൂടുതലായിരുന്നതുകൊണ്ടല്ല യഹ്വേ തന്റെ സ്നേഹം നിങ്ങളിൽ വെക്കുകയും നിങ്ങളെ തിരഞ്ഞെടുത്തുകയും ചെയ്തത്[a]; കാരണം, സകല ജനതകളിലുംവെച്ച് നിങ്ങൾ എണ്ണത്തിൽ ഏറ്റവും കുറവായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങളോടു ആഴമായ അടുപ്പം കാണിച്ചു.” എബ്രായ ക്രിയ ശക്തമായ അടുപ്പത്തെയോ വാത്സല്യത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרֻבְּכֶם מִכָּל הָעַמִּים
  choice: നിങ്ങൾ മറ്റെല്ലാ ജനതകളെക്കാളും എണ്ണത്തിൽ കൂടുതലായിരുന്നതുകൊണ്ട്
  rationale: മִן ചേർന്ന താരതമ്യവും സംഖ്യാബാഹുല്യവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: חָשַׁק
  choice: പ്രിയം തോന്നി
  rationale: ഈ ക്രിയ സൂചിപ്പിക്കുന്ന ശക്തമായ അടുപ്പവും വാത്സല്യവും ലളിതവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു; ‘സ്നേഹം വെച്ചു’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: וַיִּבְחַר בָּכֶם
  choice: നിങ്ങളെ തിരഞ്ഞെടുത്തത്
  rationale: בחר എന്ന ക്രിയയുടെ തിരഞ്ഞെടുപ്പ് എന്ന അടിസ്ഥാന അർഥവും ഉടമ്പടിസന്ദർഭത്തിലെ ദൈവിക തിരഞ്ഞെടുപ്പും അധിക വ്യാഖ്യാനം ചേർക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: כִּי
  choice: വാസ്തവത്തിൽ
  rationale: മുൻനിഷേധത്തെ പിന്തുണയ്ക്കുന്ന വിശദീകരണബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: הַמְעַט מִכָּל הָעַמִּים
  choice: സകല ജനതകളിലുംവെച്ച് നിങ്ങൾ എണ്ണത്തിൽ ഏറ്റവും കുറവായിരുന്നു
  rationale: ആദ്യഭാഗത്തിലെ സംഖ്യാതാരതമ്യത്തോട് ഒത്തുപോകുന്ന വിധത്തിൽ ഇസ്രായേലിന്റെ ആപേക്ഷികമായ സംഖ്യാകുറവ് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു പദവിയായി മാറ്റാതെ സംരക്ഷിക്കുന്നു; ‘യഹോവ’ മലയാളത്തിൽ തിരിച്ചറിയപ്പെടുന്ന ലിപ്യന്തരരൂപമാണ്.
- issue: ദൈവിക തിരഞ്ഞെടുപ്പിനെ സിദ്ധാന്തപരമായി അതിവ്യാഖ്യാനിക്കാനുള്ള സാധ്യത
  choice: നിങ്ങളെ തിരഞ്ഞെടുത്തത്
  alternative: നിങ്ങളെ സ്വന്തജനമായി തിരഞ്ഞെടുത്തത്
  rationale: വാക്യം പറയുന്ന തിരഞ്ഞെടുപ്പ് നേരിട്ട് നിലനിർത്തുന്നു; ഈ വാക്യത്തിൽ വ്യക്തമാക്കാത്ത ലക്ഷ്യമോ പിന്നീടുള്ള സിദ്ധാന്തവിഭാഗങ്ങളോ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ജനതകൾ’ എന്നത് עַמִּים എന്ന പദത്തിന്റെ വംശീയ-സാമൂഹിക കൂട്ടങ്ങൾ എന്ന ഭാവം സൂക്ഷിക്കുന്നു. സംഖ്യാതാരതമ്യം വ്യക്തമാക്കാൻ രണ്ടു ഭാഗങ്ങളിലും ‘എണ്ണത്തിൽ’ ഉപയോഗിച്ചു.
