    text: അഥവാ, “നിങ്ങളോടു ആഴമായ അടുപ്പം കാണിച്ചു.” എബ്രായ ക്രിയ ശക്തമായ അടുപ്പത്തെയോ വാത്സല്യത്തെയോ സൂചിപ്പിക്കുന്നു.
