revisions:
- from: നിങ്ങൾ മറ്റെല്ലാ ജനതകളെക്കാളും എണ്ണത്തിൽ കൂടുതലായിരുന്നതുകൊണ്ടല്ല യഹോവ നിങ്ങളോടു പ്രിയം തോന്നി നിങ്ങളെ തിരഞ്ഞെടുത്തത്[a]; വാസ്തവത്തിൽ, സകല ജനതകളിലുംവെച്ച് നിങ്ങൾ എണ്ണത്തിൽ ഏറ്റവും കുറവായിരുന്നു.
  to: നിങ്ങൾ മറ്റെല്ലാ ജനതകളെക്കാളും എണ്ണത്തിൽ കൂടുതലായിരുന്നതുകൊണ്ടല്ല യഹ്വേ തന്റെ സ്നേഹം നിങ്ങളിൽ വെക്കുകയും നിങ്ങളെ തിരഞ്ഞെടുത്തുകയും ചെയ്തത്[a]; കാരണം, സകല ജനതകളിലുംവെച്ച് നിങ്ങൾ എണ്ണത്തിൽ ഏറ്റവും കുറവായിരുന്നു.
  rationale: The revision renders חָשַׁק with an intentional expression of covenantal attachment, retains the direct explanatory force of כִּי, and aligns the divine-name transliteration with the project policy. It preserves the source’s numerical comparison and its unembellished statement of divine choice.
