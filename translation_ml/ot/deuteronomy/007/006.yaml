source:
  edition: WLC
  text: כִּ֣י עַ֤ם קָדוֹשׁ֙ אַתָּ֔ה לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ בְּ/ךָ֞ בָּחַ֣ר יְהוָ֣ה אֱלֹהֶ֗י/ךָ לִ/הְי֥וֹת ל/וֹ֙ לְ/עַ֣ם סְגֻלָּ֔ה מִ/כֹּל֙ הָֽ/עַמִּ֔ים אֲשֶׁ֖ר עַל פְּנֵ֥י הָ/אֲדָמָֽה׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/006.yaml
  text: For you are a holy people to Yahweh your God. Yahweh your God has chosen you to be a treasured people for himself[a], from all the peoples who are on the face of the earth.
translation:
  language: ml
  text: കാരണം, നീ നിന്റെ ദൈവമായ യഹ്‌വേയ്ക്കു വിശുദ്ധജനമാണ്. ഭൂമുഖത്തുള്ള സകല ജനതകളിൽനിന്നും നിന്റെ ദൈവമായ യഹ്‌വേ നിന്നെ തനിക്കുള്ള അമൂല്യസ്വത്തായ ഒരു ജനമായി തീരാൻ തിരഞ്ഞെടുത്തിരിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തനിക്കുള്ള അമൂല്യജനമായി.” എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ, “പ്രത്യേക വിലയുള്ള സ്വത്തായ ഒരു ജനം” എന്നാണ്; ഇതിൽ ‘ജനം’ എന്ന ആശയവും പ്രത്യേകം വിലമതിക്കപ്പെടുന്ന സ്വത്ത് എന്ന ആശയവും ഒരുമിച്ചുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ആയതിനാൽ/എന്തെന്നാൽ എന്ന ബന്ധാർഥം വാക്യക്രമത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിച്ചു
  rationale: മുൻകല്പനയ്ക്കുള്ള കാരണം അവതരിപ്പിക്കുന്ന കണികയാണ്; ഒറ്റവാക്യമായി ഉദ്ധരിക്കുമ്പോൾ കൃത്രിമമായ തുടക്കബന്ധകം ചേർക്കാതെ വിശദീകരണസ്വരം നിലനിർത്തുന്നു.
- source_word: עַם קָדוֹשׁ
  choice: വിശുദ്ധജനം
  rationale: ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ട ജനമെന്ന ഉടമ്പടിസംബന്ധമായ അർഥവും ‘വിശുദ്ധ’ എന്ന ദൈവശാസ്ത്രഭാരവും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ യഹ്‌വേയ്ക്കു
  rationale: ל സൂചിപ്പിക്കുന്ന ബന്ധം/ഉടമസ്ഥത മലയാളത്തിൽ സ്വാഭാവികമായ ദത്തിവിഭക്തിയിലൂടെ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ഹീബ്രു ദൈവനാമം പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ പേരായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בְּךָ בָּחַר
  choice: നിന്നെ ... തിരഞ്ഞെടുത്തിരിക്കുന്നു
  rationale: בחר എന്ന തിരഞ്ഞെടുപ്പിന്റെ അർഥവും അതിന്റെ ഇപ്പോഴും നിലനിൽക്കുന്ന ഫലവും വ്യക്തമാക്കുന്നു.
- source_word: לִהְיוֹת לוֹ לְעַם סְגֻלָּה
  choice: തനിക്കായി അമൂല്യസ്വത്തായ ഒരു ജനമാകാൻ
  rationale: עַם എന്ന ‘ജനം’ എന്ന ഘടകവും סְגֻלָּה എന്ന പ്രത്യേകം വിലമതിക്കപ്പെടുന്ന സ്വകാര്യസ്വത്തിന്റെ ആശയവും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
- source_word: מִכֹּל הָעַמִּים
  choice: സകല ജനതകളിൽനിന്നും
  rationale: മറ്റു ജനതകളെക്കാൾ അന്തർലീനമായ ശ്രേഷ്ഠതയെന്ന് കൂട്ടിച്ചേർക്കാതെ, അവരിൽനിന്നുള്ള തിരഞ്ഞെടുപ്പ് സൂചിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר עַל פְּנֵי הָאֲדָמָה
  choice: ഭൂമുഖത്തുള്ള
  rationale: ഹീബ്രു ദൃശ്യരൂപം സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമത്തെ ഒരു പദവിയാക്കി മാറ്റാതെ പേരായി നിലനിർത്തുന്നു.
- issue: מִכֹּל הָעַמִּים എന്നതിലെ തിരഞ്ഞെടുപ്പിന്റെ ആശയം
  choice: സകല ജനതകളിൽനിന്നും
  alternative: സകല ജനതകളെക്കാളും
  rationale: ഹീബ്രു ഇവിടെ ജനതകളുടെ ഇടയിൽനിന്നുള്ള തിരഞ്ഞെടുപ്പാണ് നേരിട്ട് പറയുന്നത്; സ്വാഭാവിക ശ്രേഷ്ഠതയുടെ താരതമ്യം പരിഭാഷയിൽ ചേർക്കുന്നില്ല.
- issue: סְגֻלָּה എന്ന പദത്തിലെ ജനവും സ്വത്തും തമ്മിലുള്ള സംയുക്ത ആശയം
  choice: അമൂല്യസ്വത്തായ ഒരു ജനം
  alternative: അമൂല്യജനം; പ്രത്യേക സമ്പത്ത്
  rationale: ദൈവം പ്രത്യേകം വിലമതിക്കുന്ന ഉടമസ്ഥസ്വത്ത് എന്ന അർഥവും עַם എന്ന വ്യക്തമായ ‘ജനം’ എന്ന നാമവും ഒരുമിച്ച് നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘വിശുദ്ധജനം,’ ‘അമൂല്യസ്വത്ത്,’ ‘ഭൂമുഖം’ എന്നീ പദങ്ങൾ ഉറവിടത്തിന്റെ ഉടമ്പടി-ഭാഷയും ദൃശ്യരൂപവും നിലനിർത്തുന്നു.
