  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בָּר֥וּךְ תִּֽהְיֶ֖ה מִ/כָּל הָ/עַמִּ֑ים לֹא יִהְיֶ֥ה בְ/ךָ֛ עָקָ֥ר וַֽ/עֲקָרָ֖ה וּ/בִ/בְהֶמְתֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/014.yaml
  text: You will be blessed above all peoples[a]; there will not be among you a barren man or woman[b], or among your livestock.
translation:
  language: ml
  text: സകല ജനതകളെക്കാളും നീ അനുഗ്രഹിക്കപ്പെട്ടവനായിരിക്കും[a]. നിന്റെ ഇടയിൽ സന്താനശേഷിയില്ലാത്ത പുരുഷനോ സ്ത്രീയോ ഉണ്ടാകുകയില്ല[b]; നിന്റെ കന്നുകാലികളിലും വന്ധ്യമായതൊന്നും ഉണ്ടാകുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സകല ജനതകളിലും അധികമായി.” ഇവിടെ എബ്രായ മുൻപ്രത്യയം താരതമ്യം സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ സന്താനശേഷിയില്ലാത്ത പുരുഷനെയും സ്ത്രീയെയും സൂചിപ്പിക്കുന്ന പുല്ലിംഗ-സ്ത്രീലിംഗ രൂപങ്ങൾ രണ്ടും പ്രത്യേകം ഉണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ תִּהְיֶה
  choice: നീ അനുഗൃഹീതനായിരിക്കും
  rationale: ברך എന്ന ധാതുവിൽനിന്നുള്ള നിഷ്ക്രിയ വിശേഷണരൂപവും היהയുടെ ഭാവിസൂചക അപൂർണക്രിയയും ചേർന്ന് അനുഗ്രഹിക്കപ്പെട്ട നിലയെ സൂചിപ്പിക്കുന്നു. ഏകവചന അഭിസംബോധന നിലനിർത്തുന്നു.
- source_word: מִכָּל הָעַמִּים
  choice: സകല ജനതകളെക്കാളും
  rationale: מן ഇവിടെ താരതമ്യാർഥത്തിലാണ്. മലയാളത്തിൽ ‘-യെക്കാളും’ ആ താരതമ്യം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: לֹא יִהְיֶה בְךָ
  choice: നിന്റെ ഇടയിൽ ... ഉണ്ടാകുകയില്ല
  rationale: היה + בְּ എന്ന അസ്തിത്വനിഷേധ ഘടന സമൂഹത്തിനുള്ളിലെ അഭാവത്തെ സൂചിപ്പിക്കുന്നു; ‘നിന്റെ ഇടയിൽ’ ഇസ്രായേലിനെ ഏകവചനത്തിൽ കൂട്ടായ്മയായി അഭിസംബോധന ചെയ്യുന്നതും നിലനിർത്തുന്നു.
- source_word: עָקָר וַעֲקָרָה
  choice: സന്താനശേഷിയില്ലാത്ത പുരുഷനോ സ്ത്രീയോ
  rationale: എബ്രായത്തിലെ പുല്ലിംഗ-സ്ത്രീലിംഗ രൂപങ്ങൾ രണ്ടും തുറന്നുപറയുന്നു. ‘സന്താനശേഷിയില്ലാത്ത’ എന്നത് അർഥം വ്യക്തമായി നൽകുകയും അതിവൈദ്യശാസ്ത്രപരമായ പദപ്രയോഗം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: וּבִבְהֶמְתֶּךָ
  choice: നിന്റെ കന്നുകാലികളുടെ ഇടയിലും
  rationale: בְּהֵמָה വളർത്തുമൃഗങ്ങളെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘കന്നുകാലികൾ’ ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമായ പൊതുപദമാണ്; മുൻപത്തെ വന്ധ്യതാസൂചന ഇവിടെ ആശയപരമായി തുടരുന്നു.
theological_decisions:
- issue: ഉടമ്പടി അനുഗ്രഹത്തിന്റെ പശ്ചാത്തലത്തിലുള്ള പുരുഷ-സ്ത്രീ സന്താനശേഷിയില്ലായ്മ
  choice: ‘സന്താനശേഷിയില്ലാത്ത പുരുഷനോ സ്ത്രീയോ’ എന്ന് രണ്ടു ലിംഗരൂപങ്ങളും വ്യക്തമായി പരിഭാഷപ്പെടുത്തി
  alternative: ‘വന്ധ്യരായ ആരും’ എന്ന പൊതുവായ പ്രയോഗം
  rationale: മൂലപാഠം പുല്ലിംഗവും സ്ത്രീലിംഗവും പ്രത്യേകം ഉപയോഗിക്കുന്നതിനാൽ ആ വ്യത്യാസം മായ്ച്ചുകളയാതെ നിലനിർത്തുന്നു.
- issue: ഇസ്രായേലിനോടുള്ള കൂട്ടായ ഏകവചന അഭിസംബോധന
  choice: ‘നീ/നിന്റെ’ എന്ന ഏകവചനം നിലനിർത്തി
  alternative: ‘നിങ്ങൾ/നിങ്ങളുടെ’ എന്ന ബഹുവചനം
  rationale: എബ്രായം ഇസ്രായേലിനെ ഒരു ഉടമ്പടി ജനമായി ഏകവചനത്തിൽ അഭിസംബോധന ചെയ്യുന്നു; വ്യാഖ്യാനപരമായ ബഹുവചനവത്കരണം ഒഴിവാക്കി.
- issue: מן എന്ന മുൻപ്രത്യയത്തിന്റെ താരതമ്യാർഥം
  choice: ‘സകല ജനതകളെക്കാളും’
  alternative: ‘സകല ജനതകളിൽനിന്നും’
  rationale: ഇവിടെ അനുഗ്രഹത്തിന്റെ താരതമ്യമാണ് സന്ദർഭോചിതം; വേർതിരിവ് എന്ന അർഥമല്ല. ‘എല്ലാ ജനതകളിലും അധികമായി’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അനുഗൃഹീതനായിരിക്കും’ ഉടമ്പടി-അനുഗ്രഹഭാവം നിലനിർത്തുന്നു. അവസാന ഭാഗത്തിലെ എബ്രായ സമാന്തരഘടന മലയാളത്തിൽ അപൂർണ്ണമാകാതിരിക്കാനായി ‘അങ്ങനെ ആരും ഉണ്ടാകുകയില്ല’ ചേർത്തു; ഇത് പുതിയ ആശയം ചേർക്കാതെ മുൻപത്തെ സന്താനശേഷിയില്ലായ്മ കന്നുകാലികളിലേക്കും വ്യാപിപ്പിക്കുന്നു.
