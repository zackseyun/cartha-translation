revisions:
- from: നിന്റെ ദൈവമായ യഹോവ നിനക്കു ഏല്പിച്ചുതരുന്ന സകല ജനതകളെയും നീ വിഴുങ്ങിക്കളയണം[a]. നിന്റെ കണ്ണ് അവരോട് കനിവു കാണിക്കരുത്[b]. അവരുടെ ദേവന്മാരെ നീ സേവിക്കരുത്; കാരണം, അത് നിനക്കൊരു കെണിയാണ്[c].
  to: നിന്റെ ദൈവമായ യഹോവ നിനക്കു നൽകുന്ന സകല ജനതകളെയും നീ വിഴുങ്ങിക്കളയണം[a]. നിന്റെ കണ്ണ് അവരോടു കരുണ കാണിക്കരുത്[b]. അവരുടെ ദേവന്മാരെ നീ സേവിക്കരുത്; കാരണം, അത് നിനക്കൊരു കെണിയാണ്[c].
  rationale: The revision replaces an over-specific Malayalam rendering of ‘giving’ with the direct equivalent, corrects the inaccurate explanation of the Hebrew ‘eye shall not spare’ idiom, and makes minor wording adjustments for natural modern Malayalam. The ambiguous antecedent of ‘it’ remains unresolved in the main text and is documented in the footnote.
