reference: Deuteronomy 7:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אָכַלְתָּ֣ אֶת כָּל הָֽ/עַמִּ֗ים אֲשֶׁ֨ר יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ נֹתֵ֣ן לָ֔/ךְ לֹא תָחֹ֥ס עֵֽינְ/ךָ֖ עֲלֵי/הֶ֑ם וְ/לֹ֤א תַעֲבֹד֙ אֶת אֱלֹ֣הֵי/הֶ֔ם כִּֽי מוֹקֵ֥שׁ ה֖וּא לָֽ/ךְ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/016.yaml
  text: And you shall consume all the peoples whom Yahweh your God is giving to you[a]. Your eye shall not spare them, and you shall not serve their gods[c][b], for that would be a snare to you.
translation:
  language: ml
  text: നിന്റെ ദൈവമായ യഹോവ നിനക്കു നൽകുന്ന സകല ജനതകളെയും നീ വിഴുങ്ങിക്കളയണം[a]. നിന്റെ കണ്ണ് അവരോടു കരുണ കാണിക്കരുത്[b]. അവരുടെ ദേവന്മാരെ നീ സേവിക്കരുത്; കാരണം, അത് നിനക്കൊരു കെണിയാണ്[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തിന്നുകളയണം’ അല്ലെങ്കിൽ ‘നശിപ്പിക്കണം.’ എബ്രായ ക്രിയയുടെ അക്ഷരാർഥം ‘തിന്നുക/വിഴുങ്ങുക’ എന്നാണ്; ഇവിടെ അത് പൂർണമായ നശിപ്പിക്കലിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നീ അവരോടു കരുണ കാണിക്കരുത്.’ അക്ഷരാർഥത്തിൽ, ‘നിന്റെ കണ്ണ് അവരെ ഒഴിവാക്കരുത്’ അഥവാ ‘അവരോടു ദയ കാണിക്കരുത്.’
    reason: lexical_alternative
  - marker: c
    text: ‘അത്’ ഏറ്റവും അടുത്ത അർഥത്തിൽ അവരുടെ ദേവന്മാരെ സേവിക്കുന്നതിനെ സൂചിപ്പിക്കാം; ദേവന്മാരെയോ വിഗ്രഹാരാധനയുമായി ബന്ധപ്പെട്ട മുഴുവൻ സാഹചര്യത്തെയോ സൂചിപ്പിക്കുന്നതായും മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָכַלְתָּ
  choice: നീ വിഴുങ്ങിക്കളയണം
  rationale: אכל എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘തിന്നുക/വിഴുങ്ങുക’ എന്ന രൂപകം നിലനിർത്തിക്കൊണ്ട്, യുദ്ധസന്ദർഭത്തിലെ പൂർണ പരാജയപ്പെടുത്തൽ അഥവാ നശിപ്പിക്കൽ എന്ന പ്രയോഗാർഥം അറിയിക്കുന്നു.
- source_word: כָּל הָעַמִּים
  choice: സകല ജനതകളെയും
  rationale: עַמִּים വ്യത്യസ്ത ജനവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്ന ബഹുവചനമായതിനാൽ ‘ജനതകൾ’ യോജിക്കുന്നു; כָּל എന്ന സമഗ്രതയും ‘സകല’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ
  choice: നിന്റെ ദൈവമായ യഹോവ നിനക്കു ഏല്പിച്ചുതരുന്ന
  rationale: נֹתֵן എന്ന വർത്തമാനകൃദന്തത്തിന്റെ നടന്നുകൊണ്ടിരിക്കുന്നതോ ആസന്നമായതോ ആയ ഭാവം ‘ഏല്പിച്ചുതരുന്ന’ പ്രകടമാക്കുന്നു. יְהוָה വ്യക്തിനാമമായി ‘യഹോവ’ എന്നു ലിപ്യന്തരം ചെയ്തു.
- source_word: לֹא תָחֹס עֵינְךָ עֲלֵיהֶם
  choice: നിന്റെ കണ്ണ് അവരോട് കനിവു കാണിക്കരുത്
  rationale: ‘നിന്റെ കണ്ണ് അവരെ വെറുതെവിടരുത്/കരുണിക്കരുത്’ എന്ന എബ്രായ ദൃശ്യപ്രയോഗം മലയാളത്തിൽ മനസ്സിലാകുന്ന വിധത്തിൽ അതിന്റെ ‘കണ്ണ്’ എന്ന പ്രതിച്ഛായ നിലനിർത്തി.
- source_word: וְלֹא תַעֲבֹד אֶת אֱלֹהֵיהֶם
  choice: അവരുടെ ദേവന്മാരെ നീ സേവിക്കരുത്
  rationale: עבד എന്നത് ദേവന്മാരോടുള്ള ആരാധനാപരമായ വിധേയത്വത്തെ സൂചിപ്പിക്കുന്നു. ‘സേവിക്കുക’ മൂലപദത്തോട് അടുത്തതും ‘ആരാധിക്കുക’ എന്നതിനെക്കാൾ വിശാലമായ ഉടമ്പടിപരമായ അർഥം നിലനിർത്തുന്നതുമാണ്.
- source_word: כִּי מוֹקֵשׁ הוּא לָךְ
  choice: കാരണം, അത് നിനക്കൊരു കെണിയാണ്
  rationale: מוֹקֵשׁ എന്നത് കെണി/കുരുക്ക് എന്നാണ്. הוּא എന്ന സർവനാമത്തിന്റെ സൂചനാവിഷയം വിശദീകരിച്ച് തീർക്കാതെ ‘അത്’ എന്നു നിലനിർത്തി, മൂലത്തിലെ സാധ്യതയുള്ള അവ്യക്തത സംരക്ഷിച്ചു.
theological_decisions:
- issue: כִּי מוֹקֵשׁ הוּא לָךְ എന്നതിലെ הוּא (‘അത്’) എന്തിനെ സൂചിപ്പിക്കുന്നു
  choice: ‘അത് നിനക്കൊരു കെണിയാണ്’ എന്ന അവ്യക്തമായ രൂപം നിലനിർത്തി.
  alternative: ‘അവരുടെ ദേവന്മാരെ സേവിക്കുന്നത് നിനക്കൊരു കെണിയായിരിക്കും’ എന്ന് വ്യക്തമായി വ്യാഖ്യാനിക്കാം; അല്ലെങ്കിൽ ദേവന്മാരെയോ വിശാലമായ വിഗ്രഹാരാധനാസാഹചര്യത്തെയോ സൂചിപ്പിക്കുന്നതായി ഗ്രഹിക്കാം.
  rationale: തൊട്ടുമുമ്പുള്ള ദേവസേവനനിരോധനമാണ് ഏറ്റവും അടുത്ത ആശയം. എങ്കിലും എബ്രായ സർവനാമം അതിന്റെ സൂചനാവിഷയം തുറന്നുവെക്കുന്നതിനാൽ മലയാള മുഖ്യപാഠവും ആ അർഥസാധ്യതകൾ അനാവശ്യമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ‘വിഴുങ്ങിക്കളയണം’ യുദ്ധസന്ദർഭത്തിലെ ശക്തമായ എബ്രായ രൂപകം നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് അതിന്റെ പ്രയോഗാർഥം വ്യക്തമാക്കുന്നു. ‘നിന്റെ കണ്ണ്’ എന്ന സെമിറ്റിക് ദൃശ്യപ്രയോഗം ഉദ്ദേശപൂർവം സംരക്ഷിച്ചിരിക്കുന്നു.
