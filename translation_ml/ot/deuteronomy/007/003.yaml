id: DEU.7.3
reference: Deuteronomy 7:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לֹ֥א תִתְחַתֵּ֖ן בָּ֑/ם בִּתְּ/ךָ֙ לֹא תִתֵּ֣ן לִ/בְנ֔/וֹ וּ/בִתּ֖/וֹ לֹא תִקַּ֥ח לִ/בְנֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/003.yaml
  text: 'And you shall not intermarry with them: you shall not give your daughter to his son[a], and you shall not take his daughter for your son.'
translation:
  language: ml
  text: അവരുമായി വിവാഹബന്ധത്തിൽ ഏർപ്പെടരുത്.[a] നിന്റെ മകളെ അവന്റെ മകനു കൊടുക്കരുത്; അവന്റെ മകളെ നിന്റെ മകനുവേണ്ടി എടുക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, കൂടുതൽ ഔപചാരികമായി: “അവരുമായി വിവാഹബന്ധങ്ങൾ സ്ഥാപിക്കരുത്.”'
    reason: תִתְחַתֵּן എന്ന പരസ്പരാർഥമുള്ള ക്രിയയുടെ കൂടുതൽ രൂപസമീപമായ പരിഭാഷ നൽകുന്നു.
lexical_decisions:
- source_word: תִתְחַתֵּן
  choice: വിവാഹബന്ധത്തിൽ ഏർപ്പെടുക
  rationale: חתן എന്ന ധാതുവിന്റെ ഹിത്പയേൽ രൂപം പരസ്പരമായ വിവാഹബന്ധമോ വിവാഹസഖ്യമോ സ്ഥാപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘വിവാഹബന്ധത്തിൽ ഏർപ്പെടുക’ എന്നത് ഈ സാമൂഹികവും പരസ്പരവുമായ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בָּם
  choice: അവരുമായി
  rationale: മുൻസന്ദർഭത്തിൽ പറഞ്ഞ ജനവിഭാഗങ്ങളിലേക്കാണ് മൂന്നാം പുരുഷ ബഹുവചന പ്രത്യയം വിരൽചൂണ്ടുന്നത്. വിവാഹബന്ധത്തിന്റെ പശ്ചാത്തലത്തിൽ ‘അവരുമായി’ സ്വാഭാവികമാണ്.
- source_word: בִּתְּךָ
  choice: നിന്റെ മകളെ
  rationale: രണ്ടാം പുരുഷ ഏകവചന പ്രത്യയത്തോടുകൂടിയ സ്ത്രീലിംഗ ഏകവചന ബന്ധപദത്തിന്റെ നേരിട്ടുള്ള പരിഭാഷ.
- source_word: תִתֵּן
  choice: കൊടുക്കരുത്
  rationale: എബ്രായ ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘കൊടുക്കുക’ നിലനിർത്തുന്നു; വിവാഹസന്ദർഭം അർഥം വ്യക്തമാക്കുന്നതിനാൽ മുഖ്യപാഠത്തിൽ അധിക വിശദീകരണം ചേർത്തിട്ടില്ല.
- source_word: לִבְנוֹ
  choice: അവന്റെ മകനു
  rationale: ലാമെദ് പരോക്ഷ കർമത്തെ അടയാളപ്പെടുത്തുന്നു; ‘അവന്റെ മകനു’ അതിനെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וּבִתּוֹ
  choice: അവന്റെ മകളെ
  rationale: മൂന്നാം പുരുഷ പുല്ലിംഗ ഏകവചന പ്രത്യയത്തോടുകൂടിയ നാമത്തിന്റെ നേരിട്ടുള്ള പരിഭാഷ.
- source_word: תִקַּח
  choice: എടുക്കുക
  rationale: എബ്രായ ക്രിയയുടെ അടിസ്ഥാന പദചിത്രമായ ‘എടുക്കുക’ നിലനിർത്തുന്നു. ഇവിടെ വിവാഹത്തിനായി സ്വീകരിക്കുക എന്ന അർഥം സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാകുന്നു.
- source_word: לִבְנֶךָ
  choice: നിന്റെ മകനുവേണ്ടി
  rationale: ലാമെദ് സൂചിപ്പിക്കുന്ന ബന്ധം മലയാളത്തിലെ ഈ വിവാഹസന്ദർഭത്തിൽ ‘നിന്റെ മകനുവേണ്ടി’ എന്നു സ്വാഭാവികമായി നൽകാം.
theological_decisions:
- issue: നിരോധനത്തിന്റെ വ്യാപ്തി
  choice: മുൻസന്ദർഭത്തിൽ പരാമർശിച്ച ജനവിഭാഗങ്ങളുമായുള്ള വിവാഹബന്ധമാണ് ‘അവരുമായി’ എന്നതിലൂടെ നിരോധിക്കപ്പെടുന്നതായി പാഠം നിലനിർത്തുന്നു.
  alternative: എല്ലാ വിദേശികളുമായുള്ള വിവാഹത്തിനുമുള്ള പൊതുനിരോധനമായി വ്യാഖ്യാനിക്കുക.
  rationale: ഈ വാക്യം തന്നെ ‘അവർ’ എന്നു മുൻപ് പേരെടുത്ത ജനങ്ങളെ സൂചിപ്പിക്കുന്നു. അടുത്ത വാക്യത്തിലെ കാരണമോ കൂടുതൽ വിശാലമായ ദൈവശാസ്ത്ര നിഗമനമോ ഇവിടെ ചേർത്തിട്ടില്ല.
- issue: ലിംഗസൂചക കുടുംബപദങ്ങൾ
  choice: എബ്രായത്തിലെ ഏകവചനമായ ‘മകൾ’, ‘മകൻ’ എന്നീ പദങ്ങൾ അതേപടി നിലനിർത്തുന്നു.
  alternative: ‘മക്കൾ’ പോലുള്ള ലിംഗനിരപേക്ഷ കൂട്ടുപദം ഉപയോഗിക്കുക.
  rationale: പ്രതിനിധാനപരമായ നിയമരൂപീകരണമാണെങ്കിലും മൂലപാഠം ലിംഗസൂചക ഏകവചന ബന്ധപദങ്ങളാണ് ഉപയോഗിക്കുന്നത്; അവയെ നിഷ്പക്ഷമാക്കുന്നത് ഉറവിടത്തിലെ രൂപം നഷ്ടപ്പെടുത്തും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമനിർദേശ ശൈലി ഉപയോഗിച്ചു. ‘വിവാഹബന്ധത്തിൽ ഏർപ്പെടുക’ സ്വാഭാവികത ഉറപ്പാക്കുമ്പോൾ, ‘കൊടുക്കുക’, ‘എടുക്കുക’ എന്നീ ക്രിയകൾ മൂലപാഠത്തിന്റെ സമാന്തര ഘടനയും പദചിത്രവും നിലനിർത്തുന്നു.
