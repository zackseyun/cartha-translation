id: DEU.7.10
reference: Deuteronomy 7:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מְשַׁלֵּ֧ם לְ/שֹׂנְאָ֛י/ו אֶל פָּנָ֖י/ו לְ/הַאֲבִיד֑/וֹ לֹ֤א יְאַחֵר֙ לְ/שֹׂ֣נְא֔/וֹ אֶל פָּנָ֖י/ו יְשַׁלֶּם לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/010.yaml
  text: and repays those who hate him to their face[a], to destroy them. He does not delay with the one who hates him; he will repay him to his face.
translation:
  language: ml
  text: തന്നെ വെറുക്കുന്നവർക്ക് അവിടുന്ന് അവരോടു നേരിട്ടുതന്നെ[a] പ്രതിഫലം നൽകുന്നു, അവരെ നശിപ്പിക്കാനായി. തന്നെ വെറുക്കുന്നവന്റെ കാര്യത്തിൽ അവിടുന്ന് വൈകിക്കുകയില്ല; അവനോടു നേരിട്ടുതന്നെ പ്രതിഫലം നൽകും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘അവന്റെ മുഖത്തേക്ക്’ (സന്ദർഭത്തിൽ, ‘അവരുടെ മുഖത്തേക്ക്’ എന്നും മനസ്സിലാക്കാം); ഈ പ്രയോഗത്തിന് ‘അവന്റെ/അവരുടെ മുമ്പിൽ’ അല്ലെങ്കിൽ ‘അവന്റെ/അവരുടെ സാന്നിധ്യത്തിൽ’ എന്ന അർഥവും ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְשַׁלֵּם
  choice: പ്രതിഫലം നൽകുന്നു
  rationale: പീയേൽ രൂപം ചെയ്തതിനൊത്ത തിരികെ നൽകൽ അഥവാ പ്രതികാരപരമായ പ്രതിഫലം നൽകൽ സൂചിപ്പിക്കുന്നു. ‘പ്രതിഫലം നൽകുന്നു’ ന്യായവിധിയുടെ പരസ്പരാനുപാതം നിലനിർത്തുന്നു.
- source_word: לְשֹׂנְאָיו
  choice: തന്നെ വെറുക്കുന്നവരെ
  rationale: ശത്രുക്കൾ എന്ന വിശാലമായ അർഥത്തേക്കാൾ, പങ്കാളികരൂപത്തിലുള്ള ‘വെറുക്കുന്നവർ’ എന്ന നേരിട്ടുള്ള ആശയം സംരക്ഷിക്കുന്നു.
- source_word: אֶל־פָּנָיו
  choice: അവരുടെ മുഖത്തുനോക്കിത്തന്നെ
  rationale: അക്ഷരാർഥത്തിലെ ‘മുഖത്തേക്ക്/മുഖത്തിനു മുമ്പിൽ’ എന്ന പ്രയോഗത്തിന്റെ നേരിട്ടും വ്യക്തിപരവുമായ സ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: לְהַאֲבִידוֹ
  choice: നശിപ്പിക്കേണ്ടതിന്
  rationale: അבד എന്ന ക്രിയയുടെ ഹിഫീൽ ധാതുരൂപവും ഉദ്ദേശ്യം/ഫലം സൂചിപ്പിക്കുന്ന അനന്തക്രിയയും അടുത്തായി സംരക്ഷിക്കുന്നു.
- source_word: לֹא יְאַחֵר
  choice: താമസം വരുത്തുകയില്ല
  rationale: വിധിനടപ്പാക്കൽ വൈകിക്കുകയോ നീട്ടിവെക്കുകയോ ഇല്ലെന്ന അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: לְשֹׂנְאוֹ
  choice: തന്നെ വെറുക്കുന്നവനോടു
  rationale: ഏകവചനത്തിലുള്ള വ്യക്തിയിലേക്കുള്ള ബന്ധം സൂചിപ്പിക്കുന്ന ലാമെദ് സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: יְשַׁלֶּם לוֹ
  choice: അവന് പ്രതിഫലം നൽകും
  rationale: ആദ്യ ക്രിയയുമായുള്ള പദബന്ധം നിലനിർത്തുകയും രണ്ടാം വാക്യഭാഗത്തിലെ ഏകവചന ഊന്നൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ദൈവിക ന്യായവിധിയുടെ ഭാഷ
  choice: ദൈവം തന്നെ വെറുക്കുന്നവർക്ക് നേരിട്ട് പ്രതിഫലം നൽകി അവരെ നശിപ്പിക്കുന്നു
  alternative: അവരുടെ പ്രവൃത്തികളുടെ പൊതുവായതോ വ്യക്തിത്വരഹിതമായതോ ആയ പരിണതഫലം
  rationale: എബ്രായപാഠത്തിൽ പ്രതിഫലം നൽകുകയും നശിപ്പിക്കുകയും ചെയ്യുന്ന നേരിട്ടുള്ള കർത്താവ് ദൈവമാണ്. ഈ വ്യക്തിപരമായ ദൈവിക പ്രവർത്തനം മയപ്പെടുത്താതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ദൈവത്തെ സൂചിപ്പിക്കാൻ ആദരസൂചക ഏകവചനമായ ‘അവിടുന്ന്’ ഉപയോഗിച്ചു. ആദ്യ ഭാഗത്തിലെ ബഹുവചനവും രണ്ടാം ഭാഗത്തിലെ ഏകവചനത്തിലേക്കുള്ള മാറ്റവും മൂലപാഠംപോലെ നിലനിർത്തി.
