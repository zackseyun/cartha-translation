id: DEU.7.25
reference: Deuteronomy 7:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: פְּסִילֵ֥י אֱלֹהֵי/הֶ֖ם תִּשְׂרְפ֣וּ/ן בָּ/אֵ֑שׁ לֹֽא תַחְמֹד֩ כֶּ֨סֶף וְ/זָהָ֤ב עֲלֵי/הֶם֙ וְ/לָקַחְתָּ֣ לָ֔/ךְ פֶּ֚ן תִּוָּקֵ֣שׁ בּ֔/וֹ כִּ֧י תוֹעֲבַ֛ת יְהוָ֥ה אֱלֹהֶ֖י/ךָ הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/025.yaml
  text: You shall burn the carved images of their gods with fire[a]. You shall not covet the silver or gold that is on them and take it for yourself, lest you be ensnared by it[b], for it is an abomination to Yahweh your God.
translation:
  language: ml
  text: അവരുടെ ദേവന്മാരുടെ കൊത്തിയ വിഗ്രഹങ്ങൾ നിങ്ങൾ തീയിൽ ചുട്ടുകളയണം. അവയുടെ മേലുള്ള വെള്ളിയോ പൊന്നോ മോഹിച്ച് നിങ്ങൾക്കായി എടുത്തുകൊള്ളരുത്[a]; അങ്ങനെ ചെയ്താൽ അതുമൂലം നിങ്ങൾ കെണിയിൽ അകപ്പെടും[b]. കാരണം, അത് നിങ്ങളുടെ ദൈവമായ യഹ്‌വെക്ക് അറപ്പുളവാക്കുന്ന വസ്തുവാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവയുടെ മേലുള്ള വെള്ളിയും പൊന്നും.’ എബ്രായത്തിൽ സാധാരണ സംയോജകമായ ‘ഉം’ ആണ് ഉള്ളത്; നിഷേധവാക്യത്തിൽ ‘വെള്ളിയോ പൊന്നോ’ എന്ന പ്രയോഗം ഓരോന്നിനെയും ഉൾപ്പെടുത്തി സ്വാഭാവികമായി ആശയം നൽകുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അങ്ങനെ ചെയ്താൽ അതിൽ കുടുങ്ങിപ്പോകും.’ എബ്രായ ക്രിയയ്ക്ക് കെണിയിൽ പിടിക്കപ്പെടുക എന്ന ദൃശ്യാർഥമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּסִילֵי
  choice: കൊത്തിയുണ്ടാക്കിയ വിഗ്രഹങ്ങൾ
  rationale: പദത്തിന്റെ കൊത്തിയോ ചെത്തിയോ ഉണ്ടാക്കിയ രൂപം എന്ന മൂർത്തമായ അർഥം നിലനിർത്തുന്നു; കേവലം ‘വിഗ്രഹങ്ങൾ’ എന്നതിനെക്കാൾ നിർമ്മാണരീതി വ്യക്തമാക്കുന്നു.
- source_word: אֱלֹהֵיהֶם
  choice: അവരുടെ ദേവന്മാരുടെ
  rationale: ബഹുവചന സംയുക്തരൂപവും മൂന്നാംപുരുഷ ബഹുവചന പ്രത്യയവും സ്വാഭാവികമായ മലയാളത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: תִּשְׂרְפוּן בָּאֵשׁ
  choice: തീയിൽ ചുട്ടുകളയണം
  rationale: കത്തിച്ചുകളയാനുള്ള കല്പനയും തീ എന്ന ഉപാധിയും വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: לֹא תַחְמֹד
  choice: മോഹിച്ച് … അരുത്
  rationale: വിലപിടിപ്പുള്ള വസ്തുവിനോടുള്ള ആഗ്രഹം എന്ന חמד-ന്റെ അർഥം സന്ദർഭോചിതമായി അറിയിക്കുന്നു.
- source_word: כֶּסֶף וְזָהָב עֲלֵיהֶם
  choice: അവയുടെ മേലുള്ള വെള്ളിയോ പൊന്നോ
  rationale: ലോഹങ്ങൾ വിഗ്രഹങ്ങളിൽ പതിപ്പിച്ചിരിക്കുകയോ അവയെ പൊതിഞ്ഞിരിക്കുകയോ ചെയ്യുന്നതെന്ന ബന്ധം വ്യക്തമാക്കുന്നു. നിഷേധവാക്യത്തിൽ ഓരോന്നിനെയും ഉൾക്കൊള്ളാൻ മലയാളത്തിലെ ‘-യോ … -യോ’ സ്വാഭാവികമാണ്; എബ്രായത്തിലെ സാധാരണ സംയോജകം അടിക്കുറിപ്പിൽ ചൂണ്ടിക്കാണിക്കുന്നു.
- source_word: וְלָקַחְתָּ לָךְ
  choice: സ്വന്തമാക്കരുത്
  rationale: സ്വന്തം പ്രയോജനത്തിനായി എടുത്തുവെക്കുക എന്ന ആശയം ചുരുക്കവും സ്വാഭാവികവുമായി നൽകുന്നു; മുൻപുള്ള നിഷേധം ഈ ക്രിയയിലേക്കും വ്യാപിപ്പിക്കുന്നു.
- source_word: פֶּן תִּוָּקֵשׁ בּוֹ
  choice: അതുമൂലം നിങ്ങൾ കെണിയിൽപ്പെടരുത്
  rationale: נפעל രൂപത്തിലുള്ള ‘കെണിയിൽ അകപ്പെടുക’ എന്ന ദൃശ്യരൂപം നിലനിർത്തുന്നു; സർവനാമത്തിന്റെ കൃത്യമായ സൂചന അതിയായി നിർവചിക്കുന്നില്ല.
- source_word: תּוֹעֲבַת
  choice: അറപ്പുളവാക്കുന്നത്
  rationale: ദൈവസന്നിധിയിൽ അത്യന്തം വെറുപ്പുളവാക്കുന്നതും അംഗീകരിക്കാനാവാത്തതുമായ കാര്യം എന്ന ശക്തമായ അർഥം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഭാഷയിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായ ദൈവനാമത്തെ ഒരു പദവികൊണ്ട് മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: അവസാനത്തെ הוּא എന്ന സർവനാമത്തിന്റെ സൂചന
  choice: ‘അത്’ എന്ന് വിവർത്തനം ചെയ്ത് സൂചന തുറന്നുവെക്കുന്നു.
  alternative: കൊത്തിയുണ്ടാക്കിയ വിഗ്രഹം, അതിലെ വിലയേറിയ ലോഹം, അല്ലെങ്കിൽ അത് സ്വന്തമാക്കുന്ന പ്രവൃത്തി എന്നിവയിൽ ഒന്നിനെ വ്യക്തമായി സൂചിപ്പിക്കുക.
  rationale: സമീപസന്ദർഭത്തിൽ വെള്ളിയും പൊന്നും സ്വന്തമാക്കുന്നതാണ് മുന്നറിയിപ്പിന്റെ വിഷയം; എങ്കിലും മുഴുവൻ വിഗ്രഹസംബന്ധമായ വസ്തുസമുച്ചയവും ദൃഷ്ടിയിലുണ്ട്. ‘അത്’ എന്നത് മൂലപാഠത്തിലെ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കല്പനാശൈലി ഉപയോഗിച്ചു. ദൈവനാമം ‘യഹ്‌വെ’ എന്ന് നിലനിർത്തി. ആദ്യ ക്രിയയിലെ ബഹുവചനവും തുടർന്നുള്ള എബ്രായ ഏകവചന അഭിസംബോധനയും മലയാളത്തിലെ ‘നിങ്ങൾ’ എന്ന സമൂഹാഭിസംബോധനയിലൂടെ സ്വാഭാവികമായി കൈകാര്യം ചെയ്തു.
