id: DEU.7.21
reference: Deuteronomy 7:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹ֥א תַעֲרֹ֖ץ מִ/פְּנֵי/הֶ֑ם כִּֽי יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בְּ/קִרְבֶּ֔/ךָ אֵ֥ל גָּד֖וֹל וְ/נוֹרָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/021.yaml
  text: Do not dread them[a], for Yahweh your God is in your midst[c][b], a great and fearsome God.
translation:
  language: ml
  text: നീ അവരെ ഭയന്ന് വിറയ്ക്കരുത്[a]. കാരണം, നിന്റെ ദൈവമായ യഹ്‌വെ നിന്റെ മധ്യേ[b] ഉണ്ട്; അവിടുന്ന് മഹാനും ഭയഭക്തി ഉണർത്തുന്നവനുമായ[c] ദൈവമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘അവരെ നിമിത്തം ഭയന്നുവിറയ്ക്കരുത്.’'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: ‘നിങ്ങളുടെ ഇടയിൽ.’ ഇവിടെ ഏകവചനമായ ‘നീ’ ഇസ്രായേൽജനത്തെ സമൂഹമായി അഭിസംബോധന ചെയ്യുന്നു.'
    reason: lexical_alternative
  - marker: c
    text: 'അഥവാ: ‘ഭയപ്പെടേണ്ടവനായ’ അഥവാ ‘ഭയങ്കരനായ’; എബ്രായപദം ഭയവും ആദരപൂർവമായ വിസ്മയവും ഉണർത്തുന്നവനെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַעֲרֹץ מִפְּנֵיהֶם
  choice: അവരെക്കണ്ട് ഭയന്നുവിറയ്ക്കരുത്
  rationale: ערץ എന്ന ക്രിയയുടെ ശക്തമായ ഭയം അഥവാ നടുക്കം എന്ന ആശയം ‘ഭയന്നുവിറയ്ക്കുക’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു. מִפְּנֵיהֶם എന്ന പ്രയോഗത്തിന്റെ ‘അവരുടെ സന്നിധിയിൽ/അവരെ നിമിത്തം’ എന്ന ഭാവം ‘അവരെക്കണ്ട്’ എന്നതിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: രണ്ടാംപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയം നിലനിർത്തുകയും യഹ്‌വെയുമായുള്ള സമാനാധികരണബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: בְּקִרְבְּךָ
  choice: നിന്റെ മധ്യേ
  rationale: ഇസ്രായേൽ സമൂഹത്തിന്റെ നടുവിലുള്ള ദൈവസാന്നിധ്യമാണ് സൂചിപ്പിക്കുന്നത്; വ്യക്തിയുടെ ഉള്ളിലുള്ള അനുഭവമെന്ന തെറ്റായ ധാരണ ഒഴിവാക്കുന്നു.
- source_word: אֵל גָּדוֹל
  choice: മഹാനായ ദൈവം
  rationale: אֵל എന്നത് ‘ദൈവം’ എന്നും גָּדוֹל എന്നത് ‘മഹാൻ’ എന്നും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וְנוֹרָא
  choice: ഭയഭക്തി ഉണർത്തുന്നവൻ
  rationale: ഈ രൂപം ഭയവും വിസ്മയാദരവും ജനിപ്പിക്കുന്നവൻ എന്ന ആശയം വഹിക്കുന്നു. ‘ഭയങ്കരൻ’ എന്ന പദത്തിന് ആധുനിക മലയാളത്തിൽ ഉണ്ടാകാവുന്ന ദോഷാത്മകമോ ലഘുവായോ ആയ അർഥച്ചായകൾ ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമം ഒരു ബിരുദംകൊണ്ട് പകരാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- issue: וְנוֹרָא ദൈവത്തെക്കുറിച്ച് സൂചിപ്പിക്കുന്ന ഭയത്തിന്റെ സ്വഭാവം
  choice: ഭയഭക്തി ഉണർത്തുന്നവൻ
  alternative: ഭയങ്കരൻ; വിസ്മയകരൻ
  rationale: മൂലപദത്തിലെ ഭയം ഉണർത്തുന്ന ശക്തിയും ആദരപൂർവമായ വിസ്മയവും ഒരുമിച്ച് നിലനിർത്തുന്നു; ദൈവത്തെ വെറും ഭീതിജനകനായോ പദത്തെ വെറും അതിശയകരം എന്നായോ ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും വായിക്കാൻ എളുപ്പവുമായ മലയാളം. മൂലത്തിലെ രണ്ടാംപുരുഷ ഏകവചനം ‘നീ/നിന്റെ’ എന്നു നിലനിർത്തിയിരിക്കുന്നു; ഇത് ഇസ്രായേലിനെ ഒരു സമൂഹമായി അഭിസംബോധന ചെയ്യുന്നതാണ്. വാക്യത്തിലെ കാരണം–ഫലം ബന്ധം വ്യക്തമാക്കാൻ ‘കാരണം’ ഉപയോഗിച്ചു.
