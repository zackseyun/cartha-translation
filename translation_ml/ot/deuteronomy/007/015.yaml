reference: Deuteronomy 7:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הֵסִ֧יר יְהוָ֛ה מִמְּ/ךָ֖ כָּל חֹ֑לִי וְ/כָל מַדְוֵי֩ מִצְרַ֨יִם הָ/רָעִ֜ים אֲשֶׁ֣ר יָדַ֗עְתָּ לֹ֤א יְשִׂימָ/ם֙ בָּ֔/ךְ וּ/נְתָנָ֖/ם בְּ/כָל שֹׂנְאֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/015.yaml
  text: And Yahweh will remove from you all sickness[a], and none of the evil diseases of Egypt that you have known[b] will he put on you; instead, he will put them on all who hate you.
translation:
  language: ml
  text: യാഹ്‌വേ നിന്നിൽനിന്ന് സകല രോഗവും നീക്കിക്കളയും. നീ അറിഞ്ഞിട്ടുള്ള[b] ഈജിപ്തിലെ ദോഷകരമായ[a] രോഗങ്ങളിലൊന്നും അവൻ നിന്റെമേൽ വരുത്തുകയില്ല; പകരം, നിന്നെ വെറുക്കുന്ന എല്ലാവരുടെയും മേൽ അവ വരുത്തും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദോഷകരമായ’ എന്നതിന് ‘മോശമായ’ അല്ലെങ്കിൽ ‘കഠിനമായ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ വിശേഷണത്തിന് ഈ അർഥവ്യാപ്തിയുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘നീ അനുഭവിച്ചിട്ടുള്ള’. ഇവിടെ ‘അറിയുക’ എന്ന എബ്രായ ക്രിയയ്ക്ക് അനുഭവിച്ചറിയുക എന്ന ഭാവം ഉണ്ടായേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵסִיר
  choice: നീക്കിക്കളയും
  rationale: סור എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ‘നീങ്ങിപ്പോകാൻ ഇടയാക്കുക, നീക്കംചെയ്യുക’ എന്ന കാരണാർഥം നൽകുന്നു. ‘നീക്കിക്കളയും’ ആ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി יהוה ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ശബ്ദലിപ്യന്തരണം ചെയ്തു.
- source_word: מִמְּךָ
  choice: നിന്നിൽനിന്ന്
  rationale: מן എന്ന വേർപാടുസൂചക ഉപസർഗവും ഏകവചന ദ്വിതീയപുരുഷ പ്രത്യയവും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: כָּל חֹלִי
  choice: സകല രോഗവും
  rationale: חֹלִי രോഗം/അസുഖം എന്ന കൂട്ടാർഥത്തിൽ വരുന്നു. ‘സകല രോഗവും’ സമഗ്രത നിലനിർത്തുന്നു.
- source_word: מַדְוֵי מִצְרַיִם הָרָעִים
  choice: ഈജിപ്തിലെ ദോഷകരമായ രോഗങ്ങൾ
  rationale: מַדְוֶה രോഗത്തെയോ രോഗബാധയെയോ സൂചിപ്പിക്കുന്നു; הָרָעִים എന്നതിന് മോശമായ, ദോഷകരമായ, കഠിനമായ എന്നീ അർഥസാധ്യതകളുണ്ട്. സന്ദർഭത്തിൽ ‘ദോഷകരമായ’ സ്വാഭാവികവും അർഥസമ്പന്നവുമാണ്; മറ്റ് സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: אֲשֶׁר יָדַעְתָּ
  choice: നീ അറിഞ്ഞിട്ടുള്ള
  rationale: ידע എന്ന ക്രിയയുടെ ‘അറിയുക’ എന്ന അടിസ്ഥാനരൂപം നിലനിർത്തുന്നു; ഇവിടെ അനുഭവിച്ചറിയുക എന്ന ഭാവം ഉണ്ടായേക്കാമെന്നത് അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: לֹא יְשִׂימָם בָּךְ
  choice: അവൻ നിന്റെമേൽ വരുത്തുകയില്ല
  rationale: שים + ב രോഗം ഒരാളുടെമേൽ വെക്കുക/ചുമത്തുക എന്ന ആശയം നൽകുന്നു. രോഗസന്ദർഭത്തിൽ ‘നിന്റെമേൽ വരുത്തുകയില്ല’ സ്വാഭാവികമായ മലയാളമാണ്.
- source_word: וּנְתָנָם
  choice: പകരം ... അവ വരുത്തും
  rationale: נתן അടിസ്ഥാനപരമായി ‘കൊടുക്കുക/വെക്കുക’ എന്നാണ്; രോഗങ്ങളെ ആളുകളുടെമേൽ ഏൽപ്പിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘വരുത്തും’ യോജിക്കുന്നു. മുൻവാക്യത്തോടുള്ള ശക്തമായ വൈരുധ്യം ‘പകരം’ വ്യക്തമാക്കുന്നു.
- source_word: בְּכָל שֹׂנְאֶיךָ
  choice: നിന്നെ വെറുക്കുന്ന എല്ലാവരുടെയും മേൽ
  rationale: പങ്കാളിക്രിയാരൂപം ‘നിന്നെ വെറുക്കുന്നവർ’ എന്ന് കൃത്യമായി വിവർത്തനം ചെയ്തു; പൊതുവായ ‘ശത്രുക്കൾ’ എന്നതിനെക്കാൾ ഇത് മൂലപദത്തോട് അടുത്തതാണ്.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം തന്നെയാണ് ഉള്ളത്. അതിനെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ശബ്ദലിപ്യന്തരണം ചെയ്യുന്നത് പാഠത്തിന്റെ ഉടമ്പടിസംബന്ധമായ സ്വഭാവം സംരക്ഷിക്കുന്നു.
- issue: ഈജിപ്തിലെ രോഗങ്ങളെക്കുറിച്ചുള്ള വാഗ്ദാനത്തിന്റെ വ്യാപ്തി
  choice: ഉടമ്പടിസന്ദർഭത്തിലെ യഥാർഥ രോഗങ്ങളിൽനിന്നുള്ള സംരക്ഷണവാഗ്ദാനമായി വിവർത്തനം ചെയ്തു
  alternative: എല്ലാ കാലത്തും ഓരോ വ്യക്തിക്കും രോഗമുക്തി ഉറപ്പുനൽകുന്ന സർവസാധാരണ വാഗ്ദാനം; ഭൗതികമല്ലാത്ത കഷ്ടതകളുടെ രൂപകം മാത്രം
  rationale: വാക്യം രോഗത്തെയും ഈജിപ്തിലെ രോഗബാധകളെയും മൂർത്തമായി പരാമർശിക്കുന്നു. എന്നാൽ ഈ ഒറ്റവാക്യം പറയുന്നതിനെക്കാൾ വിപുലമായ ആരോഗ്യസിദ്ധാന്തം പരിഭാഷയിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഏകവചന അഭിസംബോധന നിലനിർത്തി. രോഗം ഒരാളുടെമേൽ ‘വെക്കുക’ എന്ന എബ്രായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘വരുത്തുക’ ഉപയോഗിച്ചു; മൂലപാഠത്തിലെ വൈരുധ്യം ‘പകരം’ കൊണ്ട് വ്യക്തമാക്കി.
