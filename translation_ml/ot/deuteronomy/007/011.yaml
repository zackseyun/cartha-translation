base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/011.yaml
  text: So you shall keep the commandment and the statutes and the judgments that I am commanding you today[b][a], to do them.
translation:
  language: ml
  text: അതുകൊണ്ട്, ഞാൻ ഇന്നു നിന്നോടു കല്പിക്കുന്ന കല്പനയും ചട്ടങ്ങളും ന്യായവിധികളും നീ പാലിക്കുകയും അവ അനുഷ്ഠിക്കുകയും വേണം.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അതുകൊണ്ട്’ എന്നതിന് പകരം ‘അങ്ങനെ’ എന്നോ നൽകാം; എബ്രായ സംയോജകപദം മുൻവാക്യങ്ങളോടുള്ള സാധാരണ ബന്ധമോ അവയിൽനിന്നുള്ള നിഗമനമോ സൂചിപ്പിക്കാം. അതിനെ പ്രത്യേകം വിവർത്തനം ചെയ്യാതെയും നൽകാം.
    reason: lexical_alternative
  - marker: b
    text: ‘ന്യായവിധികൾ’ എന്നത് ‘നിയമവിധികൾ’ എന്നോ ‘നിയമങ്ങൾ’ എന്നോ പരിഭാഷപ്പെടുത്താം; എബ്രായപദം നിയമപരമായ തീരുമാനങ്ങളെയോ നിർദേശിക്കപ്പെട്ട ചട്ടങ്ങളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַרְתָּ
  choice: അതുകൊണ്ട് ... നീ പാലിക്കുകയും ... വേണം
  rationale: ശמר എന്ന ക്രിയയുടെ ഉടമ്പടി-നിയമസന്ദർഭത്തിലെ ‘പാലിക്കുക’ എന്ന അർഥം നിലനിർത്തുന്നു. ആരംഭത്തിലെ וְ മുൻവാക്യങ്ങളിൽനിന്നുള്ള നിഗമനം സൂചിപ്പിക്കാവുന്നതിനാൽ ‘അതുകൊണ്ട്’ എന്നു നൽകി; അതിന്റെ സാധ്യതാഭേദം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: הַמִּצְוָה
  choice: കല്പന
  rationale: എബ്രായത്തിലെ ഏകവചനം നിലനിർത്തുകയും തുടർന്നുള്ള ബഹുവചന നിയമപദങ്ങളിൽനിന്ന് വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: הַחֻקִּים
  choice: ചട്ടങ്ങൾ
  rationale: നിയമപരമായി നിശ്ചയിക്കപ്പെട്ട വ്യവസ്ഥകൾ എന്ന ആശയം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הַמִּשְׁפָּטִים
  choice: ന്യായവിധികൾ
  rationale: നിയമവിധികൾ, ന്യായനിർണയങ്ങൾ, നിർദേശിക്കപ്പെട്ട നിയമങ്ങൾ എന്നിവ സൂചിപ്പിക്കാവുന്ന പദത്തിന്റെ ഔപചാരിക നിയമഭാവം സംരക്ഷിക്കുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: ഞാൻ ഇന്നു നിന്നോടു കല്പിക്കുന്ന
  rationale: പങ്കാളിക്രിയയുടെ ഇപ്പോഴത്തെ/തൽസമയ കല്പനാഭാവവും ആവർത്തനപുസ്തകത്തിലെ ‘ഇന്നു’ എന്ന ഉടമ്പടി-ഊന്നലും നിലനിർത്തുന്നു.
- source_word: לַעֲשׂוֹתָם
  choice: അവ അനുഷ്ഠിക്കുകയും
  rationale: ‘അവ ചെയ്യുക’ എന്ന മൂർത്തമായ അനുസരണഭാവം സ്വാഭാവിക മലയാളത്തിൽ ‘അനുഷ്ഠിക്കുക’ എന്നു നൽകുന്നു; മുൻപത്തെ ‘പാലിക്കുക’ എന്ന ക്രിയയുമായി ലയിപ്പിക്കാതെ വേർതിരിക്കുന്നു.
theological_decisions:
- issue: ഉടമ്പടി-നിയമത്തെ സൂചിപ്പിക്കുന്ന മൂന്നു പദങ്ങളുടെ വ്യത്യാസം
  choice: കല്പനയും ചട്ടങ്ങളും ന്യായവിധികളും
  alternative: കല്പനയും നിയമങ്ങളും ചട്ടങ്ങളും
  rationale: പരസ്പരം അർഥവ്യാപ്തിയുള്ള മൂന്നു എബ്രായ നിയമപദങ്ങളും വാക്യത്തിലെ സഞ്ചിതമായ ഉടമ്പടി-നിയമശക്തിയും വേർതിരിച്ച പദങ്ങളിലൂടെ സംരക്ഷിക്കുന്നു; അവയെ ഒറ്റ പൊതുപദത്തിലേക്ക് ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ നിയമ-ഉടമ്പടി ശൈലി. ഏകവചനമായ ‘കല്പന’യും ബഹുവചനങ്ങളായ ‘ചട്ടങ്ങൾ’, ‘ന്യായവിധികൾ’ എന്നിവയും സൂക്ഷിച്ചു. മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിനായി ‘പാലിക്കുക’ എന്നും ‘അനുഷ്ഠിക്കുക’ എന്നും ബന്ധിപ്പിച്ചു.
