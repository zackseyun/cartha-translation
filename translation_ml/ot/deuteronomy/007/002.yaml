base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/002.yaml
  text: And when Yahweh your God gives them over to you before you[a], and you strike them down, you shall utterly devote them to destruction[b]. You shall make no covenant with them and show them no favor.
translation:
  language: ml
  text: നിന്റെ ദൈവമായ യഹോവ അവരെ നിന്റെ മുമ്പിൽ ഏൽപ്പിക്കുകയും നീ അവരെ അടിച്ചുവീഴ്ത്തുകയും ചെയ്യുമ്പോൾ, നീ അവരെ നാശത്തിനായി പൂർണമായി അർപ്പിക്കണം.[a] അവരുമായി ഉടമ്പടി ചെയ്യരുത്; അവരോട് കൃപ കാണിക്കുകയുമരുത്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരെ തീർത്തും നശിപ്പിക്കണം” അല്ലെങ്കിൽ “അവരെ നിരോധനത്തിൻ കീഴിൽ വയ്ക്കണം.” എബ്രായത്തിൽ חרם എന്ന ക്രിയ തീവ്രത സൂചിപ്പിക്കുന്ന ആവർത്തനഘടനയിൽ വന്നിരിക്കുന്നു; നാശത്തിനായി പൂർണമായി അർപ്പിക്കുന്നതിനെ അതു സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അവരോട് ദയ കാണിക്കരുത്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתָנָם
  choice: അവരെ നിന്റെ മുമ്പിൽ ഏല്പിക്കുകയും
  rationale: സൈനികസന്ദർഭത്തിൽ נתן എന്നത് എതിരാളികളെ ഒരാളുടെ അധികാരത്തിന് ഏല്പിക്കുക എന്ന അർഥം നൽകുന്നു. മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘കൈയിൽ’ എന്ന രൂപകം ചേർക്കാതെ ദൈവിക പ്രവർത്തനം വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: לְפָנֶיךָ
  choice: നിന്റെ മുമ്പിൽ
  rationale: എബ്രായ പ്രയോഗത്തിന്റെ നേരായ അർഥവും, ജയിക്കേണ്ട ജനതകളെ ഇസ്രായേലിന്റെ മുമ്പിൽ കൊണ്ടുവരുന്നു എന്ന സന്ദർഭാർഥവും നിലനിർത്തുന്നു.
- source_word: וְהִכִּיתָם
  choice: നീ അവരെ അടിച്ചുവീഴ്ത്തുകയും
  rationale: נכה എന്ന ക്രിയയുടെ സൈനികവും ഹിംസാത്മകവുമായ ശക്തി ‘തോൽപ്പിക്കുക’ എന്നതിനെക്കാൾ വ്യക്തമായി സൂക്ഷിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്.
- source_word: הַחֲרֵם תַּחֲרִים אֹתָם
  choice: നീ അവരെ നാശത്തിനായി പൂർണമായി അർപ്പിക്കണം
  rationale: ക്രിയാനാമവും സമാപികാക്രിയയും ചേർന്ന തീവ്രതയും חרם എന്ന പദത്തിലെ സമ്പൂർണ നാശാർപ്പണത്തിന്റെ ആരാധനാത്മക-ദൈവശാസ്ത്രപരമായ ഭാവവും വെറും ‘നശിപ്പിക്കുക’ എന്നു ചുരുക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: לֹא תִכְרֹת לָהֶם בְּרִית
  choice: അവരുമായി ഉടമ്പടി ചെയ്യരുത്
  rationale: כרת ברית എന്ന എബ്രായ ശൈലിയുടെ സ്വാഭാവിക മലയാള തുല്യപ്രയോഗമാണിത്; ‘സന്ധി’ എന്നതിനെക്കാൾ വിശാലമായ ബന്ധപരമായ അർഥം ‘ഉടമ്പടി’ നിലനിർത്തുന്നു.
- source_word: וְלֹא תְחָנֵּם
  choice: അവരോട് കൃപ കാണിക്കുകയുമരുത്
  rationale: חנן എന്ന പദത്തിന്റെ കൃപയോ പ്രീതിയോ കാണിക്കുക എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ സാധ്യമായ ‘ദയ കാണിക്കുക’ എന്ന വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: വിശുദ്ധയുദ്ധസന്ദർഭത്തിലെ חרם എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: നാശത്തിനായി പൂർണമായി അർപ്പിക്കണം
  alternative: തീർത്തും നശിപ്പിക്കണം; ശാപാർപ്പിതരാക്കണം
  rationale: ഇത് സാധാരണ സൈനികനശീകരണം മാത്രമെന്നവിധം പദത്തെ ലഘൂകരിക്കാതെ, സമ്പൂർണതയും ദൈവത്തിനായി നാശത്തിന് വേർതിരിക്കുന്ന ആരാധനാത്മക ഭാവവും ഒരുമിച്ച് സൂക്ഷിക്കുന്നു.
- issue: תְחָנֵּם എന്ന പദത്തിന്റെ അർഥപരിധി
  choice: കൃപ കാണിക്കരുത്
  alternative: ദയ കാണിക്കരുത്
  rationale: മൂലപദം കൃപയോ പ്രീതിയോ കാണിക്കുന്നതുമായി ബന്ധപ്പെട്ടതാണ്. ‘ദയ’ സന്ദർഭസാധ്യമായ അർഥമാണെങ്കിലും അതിനെ മാത്രം മുഖ്യപാഠത്തിൽ ഉറപ്പിക്കാതെ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. പഴഞ്ചൻ ക്രിയാരൂപങ്ങൾ ഒഴിവാക്കി; എന്നാൽ ‘ഉടമ്പടി’, ‘കൃപ’, ‘അർപ്പിക്കുക’ എന്നീ പദങ്ങളിലൂടെ മൂലപാഠത്തിന്റെ ഔപചാരികവും ദൈവശാസ്ത്രപരവുമായ ഭാരം നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദപ്രയോഗങ്ങൾക്കു പിന്നാലെ തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
