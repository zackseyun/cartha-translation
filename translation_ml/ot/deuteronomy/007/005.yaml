reference: Deuteronomy 7:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּֽי אִם כֹּ֤ה תַעֲשׂוּ֙ לָ/הֶ֔ם מִזְבְּחֹתֵי/הֶ֣ם תִּתֹּ֔צוּ וּ/מַצֵּבֹתָ֖/ם תְּשַׁבֵּ֑רוּ וַ/אֲשֵֽׁירֵ/הֶם֙ תְּגַדֵּע֔וּ/ן וּ/פְסִילֵי/הֶ֖ם תִּשְׂרְפ֥וּ/ן בָּ/אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/005.yaml
  text: 'But this is what you shall do to them: you shall tear down their altars[a], shatter their pillars, cut down their Asherah poles[c][b], and burn their carved images with fire.'
translation:
  language: ml
  text: 'എന്നാൽ നിങ്ങൾ അവരോടു ചെയ്യേണ്ടത് ഇതാണ്: അവരുടെ ബലിപീഠങ്ങൾ ഇടിച്ചുകളയണം; അവരുടെ ആരാധനാസ്തംഭങ്ങൾ[a] തകർത്തുകളയണം; അവരുടെ അശേരാപ്രതീകങ്ങൾ[b] വെട്ടിമാറ്റണം; അവരുടെ കൊത്തിയുണ്ടാക്കിയ വിഗ്രഹങ്ങൾ[c] തീയിൽ ചുട്ടുകളയണം.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവരുടെ വിശുദ്ധസ്തംഭങ്ങൾ’ അല്ലെങ്കിൽ ‘നാട്ടിനിർത്തിയ കൽത്തൂണുകൾ’.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ‘അശേരീം’; അശേരാദേവിയുമായി ബന്ധപ്പെട്ട, മിക്കവാറും മരത്തിൽ നിർമിച്ചിരുന്ന ആരാധനാവസ്തുക്കൾ.
    reason: cultural_note
  - marker: c
    text: അഥവാ, ‘അവരുടെ വിഗ്രഹങ്ങൾ’; എബ്രായപദം കൂടുതൽ കൃത്യമായി കൊത്തിയുണ്ടാക്കിയ രൂപങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם כֹּה תַעֲשׂוּ לָהֶם
  choice: എന്നാൽ നിങ്ങൾ അവരോടു ചെയ്യേണ്ടത് ഇതാണ്
  rationale: כִּי אִם എന്ന ശക്തമായ വൈരുധ്യവും כֹּה എന്ന മുന്നോട്ടു ചൂണ്ടുന്ന പ്രയോഗവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു; നിയമപരമായ നിർദേശത്തിന്റെ ബലവും സംരക്ഷിക്കുന്നു.
- source_word: מִזְבְּחֹתֵיהֶם תִּתֹּצוּ
  choice: അവരുടെ ബലിപീഠങ്ങൾ ഇടിച്ചുകളയണം
  rationale: נתץ ഒരു നിർമാണത്തെ ഇടിച്ചുനിരത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘ഇടിച്ചുകളയണം’ ബലിപീഠങ്ങളോടു ചേർന്ന് വ്യക്തവും ശക്തവുമാണ്.
- source_word: מַצֵּבֹתָם תְּשַׁבֵּרוּ
  choice: അവരുടെ പൂജാസ്തംഭങ്ങൾ തകർത്തുകളയണം
  rationale: מַצֵּבָה ആരാധനയുമായി ബന്ധപ്പെട്ട് നാട്ടിനിർത്തിയ കല്ലിനെയോ സ്തംഭത്തെയോ സൂചിപ്പിക്കുന്നു. ‘പൂജാസ്തംഭങ്ങൾ’ സന്ദർഭത്തിലെ മതപരമായ അർഥം വ്യക്തമാക്കുന്നു; പീയേൽ ക്രിയയുടെ ശക്തി ‘തകർത്തുകളയണം’ നിലനിർത്തുന്നു.
- source_word: אֲשֵׁירֵהֶם תְּגַדֵּעוּן
  choice: അവരുടെ അശേരാത്തൂണുകൾ വെട്ടിവീഴ്ത്തണം
  rationale: אֲשֵׁרִים അശേരയുമായി ബന്ധപ്പെട്ട, സാധാരണയായി മരത്തിൽ നിർമിച്ചിരുന്ന ആരാധനാവസ്തുക്കളാണ്. ‘അശേരാത്തൂണുകൾ’ പ്രത്യേക ചരിത്ര-മതപരമായ സൂചന നിലനിർത്തുന്നു; גדע എന്നതിന്റെ മരം വെട്ടുന്ന ഭാവം ‘വെട്ടിവീഴ്ത്തണം’ നൽകുന്നു.
- source_word: פְסִילֵיהֶם תִּשְׂרְפוּן בָּאֵשׁ
  choice: അവരുടെ കൊത്തുവിഗ്രഹങ്ങൾ തീയിൽ ചുട്ടുകളയണം
  rationale: פֶּסֶל എന്നത് കൊത്തിയുണ്ടാക്കിയ ആരാധനാചിത്രമോ വിഗ്രഹമോ ആണ്; ‘കൊത്തുവിഗ്രഹങ്ങൾ’ അതിന്റെ നിർമാണരീതി സംരക്ഷിക്കുന്നു. בָּאֵשׁ എന്ന വ്യക്തമായ അഗ്നിസൂചന ‘തീയിൽ’ എന്നു നിലനിർത്തുന്നു.
theological_decisions:
- issue: אֲשֵׁרִים എന്നത് പ്രത്യേക ആരാധനാവസ്തുവായോ പൊതുവായ വിഗ്രഹമായോ പരിഭാഷപ്പെടുത്തൽ
  choice: അശേരാത്തൂണുകൾ
  alternative: അശേരാപ്രതീകങ്ങൾ; അശേരീം
  rationale: വാക്യം കനാന്യ ആരാധനയിലെ വ്യത്യസ്ത വസ്തുക്കളെ വേർതിരിച്ചു പറയുന്നു. പൊതുവായ ‘വിഗ്രഹങ്ങൾ’ എന്ന പദം ഈ പ്രത്യേകത ഇല്ലാതാക്കും; ‘അശേരാത്തൂണുകൾ’ സാധ്യതയുള്ള ചരിത്രപരമായ സൂചന നിലനിർത്തുന്നു, വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ആരാധനാസ്ഥലങ്ങളും വസ്തുക്കളും നശിപ്പിക്കാനുള്ള കല്പനയുടെ ശക്തി
  choice: ഇടിച്ചുകളയണം, തകർത്തുകളയണം, വെട്ടിവീഴ്ത്തണം, ചുട്ടുകളയണം എന്നീ നേരിട്ടുള്ള ശക്തമായ ക്രിയകൾ
  alternative: നീക്കിക്കളയണം പോലുള്ള മൃദുവായ പൊതുപ്രയോഗം
  rationale: എബ്രായത്തിലെ ക്രിയകൾ വ്യക്തവും ശക്തവുമായ നിർദേശങ്ങളാണ്. പാഠത്തിന് പുറത്തുള്ള ന്യായീകരണം ചേർക്കാതെയും അതിന്റെ തീവ്രത മൃദൂകരിക്കാതെയും അവ പരിഭാഷപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു വ്യക്തമായെങ്കിലും ഗൗരവമുള്ള മലയാളം. സമാന്തര കല്പനകളിലെ ആവർത്തനഘടനയും ശക്തമായ പ്രവർത്തനക്രിയകളും സംരക്ഷിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങൾക്ക് പിന്നാലെ ക്രമത്തിൽ ചേർത്തു.
