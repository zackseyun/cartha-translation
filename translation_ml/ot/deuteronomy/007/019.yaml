base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/019.yaml
  text: the great trials that your eyes saw[a], and the signs, and the wonders, and the mighty hand[b], and the outstretched arm by which Yahweh your God brought you out—so Yahweh your God will do to all the peoples of whom you are afraid.
translation:
  language: ml
  text: നിന്റെ കണ്ണുകൾ കണ്ട ആ വലിയ പരീക്ഷണങ്ങളും[a] അടയാളങ്ങളും അത്ഭുതങ്ങളും, ശക്തമായ കൈയും നീട്ടിയ ഭുജവുംകൊണ്ട് നിന്റെ ദൈവമായ യാഹ്‌വെ നിന്നെ പുറത്തേക്കു കൊണ്ടുവന്നതുപോലെ, നീ ഭയപ്പെടുന്ന എല്ലാ ജനതകളോടും നിന്റെ ദൈവമായ യാഹ്‌വെ അങ്ങനെതന്നെ ചെയ്യും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വലിയ പരിശോധനകൾ.’ എബ്രായപദത്തിന് കഠിനമായ പരീക്ഷണങ്ങളെയോ പരിശോധനകളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּסֹּת הַגְּדֹלֹת
  choice: ആ വലിയ പരീക്ഷണങ്ങൾ
  rationale: מַסּוֹת എന്ന പദം കഠിനമായ പരീക്ഷണങ്ങളെയോ പരിശോധനകളെയോ സൂചിപ്പിക്കാം. സന്ദർഭത്തിൽ ഈജിപ്തിൽ നേരിൽ കണ്ട ദൈവിക പ്രവൃത്തികളാണ് ഉദ്ദേശിക്കുന്നത്; ‘പരീക്ഷണങ്ങൾ’ ഈ അർത്ഥവ്യാപ്തി സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: רָאוּ עֵינֶיךָ
  choice: നിന്റെ കണ്ണുകൾ കണ്ട
  rationale: എബ്രായത്തിലെ ‘നിന്റെ കണ്ണുകൾ’ എന്ന ഊന്നൽ നിലനിർത്തി, നേരിട്ടുള്ള ദൃക്സാക്ഷ്യത്തിന്റെ സജീവത സംരക്ഷിക്കുന്നു.
- source_word: הָאֹתֹת
  choice: അടയാളങ്ങൾ
  rationale: אוֹת എന്നതിന്റെ സാധാരണവും വ്യക്തവുമായ തത്തുല്യപദം.
- source_word: הַמֹּפְתִים
  choice: അത്ഭുതങ്ങൾ
  rationale: ‘അടയാളങ്ങൾ’ എന്നതിനോടൊപ്പം വരുന്ന מוֹפְתִים വിസ്മയം ഉളവാക്കുന്ന അസാധാരണ പ്രവൃത്തികളെ സൂചിപ്പിക്കുന്നു; ‘അത്ഭുതങ്ങൾ’ അതിനെ അനാവശ്യമായി കൂടുതൽ നിർവചിക്കാതെ പ്രകടിപ്പിക്കുന്നു.
- source_word: הַיָּד הַחֲזָקָה
  choice: ബലമുള്ള കൈ
  rationale: ദൈവത്തിന്റെ ശക്തമായ പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം നേരിട്ടും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: הַזְּרֹעַ הַנְּטוּיָה
  choice: നീട്ടിയ ഭുജം
  rationale: വിടുതലിലും ന്യായവിധിയിലും ദൈവത്തിന്റെ സജീവ ശക്തിയെ സൂചിപ്പിക്കുന്ന സ്ഥിരപ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: אֲשֶׁר הוֹצִאֲךָ
  choice: കൊണ്ട് ... നിന്നെ പുറത്തുകൊണ്ടുവന്നതുപോലെ
  rationale: ബന്ധവാക്യം കൈയെയും ഭുജത്തെയും ദൈവിക വിടുതലിന്റെ ഉപാധികളായി ബന്ധിപ്പിക്കുന്നു; ഹിഫിൽ രൂപത്തിന്റെ പുറപ്പെടുവിക്കൽ അർത്ഥവും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റൺ ഒരു സ്ഥാനപ്പേരാൽ മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: כֵּן יַעֲשֶׂה
  choice: അങ്ങനെതന്നെ ചെയ്യും
  rationale: മുമ്പ് വിവരിച്ച വിടുതൽപ്രവൃത്തികളോടുള്ള താരതമ്യവും ഭാവിയിലെ ഉറപ്പും വ്യക്തമായി നൽകുന്നു.
- source_word: לְכָל הָעַמִּים
  choice: സകല ജനതകളോടും
  rationale: עַמִּים എന്ന ബഹുവചനം വിവിധ ജനസമൂഹങ്ങളെ സൂചിപ്പിക്കുന്നു; לְ ഇവിടെ ദൈവിക പ്രവർത്തനത്തിന്റെ ബാധിതരായ ലക്ഷ്യത്തെ അടയാളപ്പെടുത്തുന്നു.
- source_word: אֲשֶׁר אַתָּה יָרֵא מִפְּנֵיהֶם
  choice: നീ ഭയപ്പെടുന്ന
  rationale: ‘അവരുടെ മുമ്പിൽനിന്ന്’ എന്ന എബ്രായ ഭയപ്രയോഗം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി ‘നീ ഭയപ്പെടുന്ന’ എന്നു നൽകുന്നു; ഭയത്തിന്റെ ലക്ഷ്യം വ്യക്തമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം വ്യക്തിപരമായ ഉടമ്പടിനാമം ഉപയോഗിക്കുന്നതിനാൽ, ഒരു പദവിയാൽ പകരാതെ ‘യാഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
- issue: ഈജിപ്തിലെ പ്രവൃത്തികളെ ‘പരീക്ഷണങ്ങൾ’ എന്നു വിളിക്കുന്നതിലെ അർത്ഥവ്യാപ്തി
  choice: പരീക്ഷണങ്ങൾ
  alternative: പരിശോധനകൾ; കഠിന അനുഭവങ്ങൾ
  rationale: മൂലപദത്തിന് പരീക്ഷണം, പരിശോധന എന്നീ ബന്ധമുള്ള അർത്ഥങ്ങൾ ഉണ്ടായതിനാൽ ഒരു പ്രത്യേക ദൈവശാസ്ത്ര വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതെ മുഖ്യപദവും അടിക്കുറിപ്പിൽ മറ്റൊരു സാധ്യതയും നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിലെ ദൃശ്യരൂപങ്ങളായ ‘കണ്ണുകൾ,’ ‘കൈ,’ ‘ഭുജം’ എന്നിവ നിലനിർത്തി; ദൈർഘ്യമേറിയ മൂലവാക്യം മലയാളത്തിൽ വ്യക്തമായ താരതമ്യഘടനയായി ക്രമപ്പെടുത്തി.
