id: DEU.7.1
reference: Deuteronomy 7:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֤י יְבִֽיאֲ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ אֶל הָ/אָ֕רֶץ אֲשֶׁר אַתָּ֥ה בָא שָׁ֖מָּ/ה לְ/רִשְׁתָּ֑/הּ וְ/נָשַׁ֣ל גּֽוֹיִם רַבִּ֣ים מִ/פָּנֶ֡י/ךָ הַֽ/חִתִּי֩ וְ/הַ/גִּרְגָּשִׁ֨י וְ/הָ/אֱמֹרִ֜י וְ/הַ/כְּנַעֲנִ֣י וְ/הַ/פְּרִזִּ֗י וְ/הַֽ/חִוִּי֙ וְ/הַ/יְבוּסִ֔י שִׁבְעָ֣ה גוֹיִ֔ם רַבִּ֥ים וַ/עֲצוּמִ֖ים מִמֶּֽ/ךָּ־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/001.yaml
  text: When Yahweh your God brings you into the land that you are entering to possess[a], and drives out before you many nations—the Hittites, the Girgashites, the Amorites, the Canaanites, the Perizzites, the Hivites, and the Jebusites—seven nations greater and mightier than you[b],
translation:
  language: ml
  text: നിന്റെ ദൈവമായ യഹ്‌വെ, നീ കൈവശമാക്കാൻ പ്രവേശിക്കുന്ന ദേശത്തേക്കു നിന്നെ കൊണ്ടുവരികയും നിന്റെ മുമ്പിൽനിന്ന് അനേകം ജനതകളെ തുരത്തിക്കളയുകയും[a] ചെയ്യുമ്പോൾ—ഹിത്യർ, ഗിർഗാശ്യർ, അമോര്യർ, കനാന്യർ, പെരിസ്യർ, ഹിവ്യർ, യെബൂസ്യർ എന്നിങ്ങനെ നിന്നെക്കാൾ വലിയവരും ശക്തരുമായ ഏഴു ജനതകളെ[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്റെ മുമ്പിൽനിന്ന് അനേകം ജനതകളെ അവകാശഭ്രഷ്ടരാക്കുകയും.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “നിന്നെക്കാൾ എണ്ണത്തിൽ കൂടുതലും ശക്തരുമായ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ചെയ്യുമ്പോൾ
  rationale: തുടർന്നുവരുന്ന കല്പനകൾക്കുള്ള സാഹചര്യത്തെ ഈ പദം ഇവിടെ അവതരിപ്പിക്കുന്നു; അതിനാൽ കാരണസൂചകമോ നിബന്ധനാസൂചകമോ ആയ വിവർത്തനത്തേക്കാൾ കാലസൂചകമായ പ്രയോഗം യോജിക്കുന്നു.
- source_word: יְבִיאֲךָ
  choice: നിന്നെ കൊണ്ടുവരികയും
  rationale: בוא എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലെ കാരണാർത്ഥം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായത്തിലെ ദൈവനാമം പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: രണ്ടാംപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയം നിലനിർത്തി, മലയാള വാക്യഘടനയ്ക്ക് യോജിച്ച വിധത്തിൽ ദൈവനാമവുമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: הָאָרֶץ
  choice: ദേശം
  rationale: ആവർത്തനപുസ്തകത്തിലെ വാഗ്ദത്തഭൂമിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ദേശം’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה
  choice: നീ ... പ്രവേശിക്കുന്ന
  rationale: ഇസ്രായേലിന്റെ ആസന്നമായ പ്രവേശനം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; എബ്രായത്തിലെ ‘അവിടേക്ക്’ എന്ന ആശയം ‘ദേശത്തേക്കു’ എന്നതിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: לְרִשְׁתָּהּ
  choice: കൈവശമാക്കാൻ
  rationale: ירשׁ എന്ന പദത്തിലെ സജീവമായ കൈവശപ്പെടുത്തൽ എന്ന അർഥം നിലനിർത്തുന്നു; ‘അവകാശമാക്കാൻ’ എന്നതിനെക്കാൾ ഈ അധിനിവേശസന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: וְנָשַׁל
  choice: തുരത്തിക്കളയുകയും
  rationale: ജനതകളെ അവരുടെ സ്ഥാനത്തുനിന്ന് നീക്കുക എന്ന ക്രിയയുടെ ആശയം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി നൽകുന്നു; ‘അവകാശഭ്രഷ്ടരാക്കുക’ എന്ന സാദ്ധ്യമായ കൂടുതൽ സാങ്കേതിക അർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: גּוֹיִם רַבִּים
  choice: അനേകം ജനതകളെ
  rationale: കനാനിൽ വസിച്ചിരുന്ന വ്യത്യസ്ത ജനവിഭാഗങ്ങളെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ‘ജനതകൾ’ ദേശീയ-വംശീയ കൂട്ടങ്ങളെ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: מִפָּנֶיךָ
  choice: നിന്റെ മുമ്പിൽനിന്ന്
  rationale: ഒരാളുടെ സന്നിധിയിൽനിന്ന് നീക്കുക എന്ന എബ്രായ ശൈലിയുടെ രൂപവും അർഥവും നിലനിർത്തുന്നു.
- source_word: הַחִתִּי ... הַיְבוּסִי
  choice: ഹിത്യർ, ഗിർഗാശ്യർ, അമോര്യർ, കനാന്യർ, പെരിസ്യർ, ഹിവ്യർ, യെബൂസ്യർ
  rationale: ഏകവചന കൂട്ടനാമങ്ങളായ എബ്രായ ജനനാമങ്ങളെ മലയാളത്തിൽ ജനവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്ന ബഹുവചനരൂപങ്ങളിൽ നൽകുന്നു.
- source_word: שִׁבְעָה גוֹיִם
  choice: ഏഴു ജനതകളെ
  rationale: മുമ്പ് പട്ടികപ്പെടുത്തിയ കൂട്ടങ്ങളുടെ സംഗ്രഹമായി വരുന്ന പ്രയോഗം; ‘ജനതകൾ’ എന്ന പദം മുൻപ്രയോഗവുമായി ഏകീകരിക്കുന്നു.
- source_word: רַבִּים וַעֲצוּמִים מִמֶּךָּ
  choice: നിന്നെക്കാൾ വലിയവരും ശക്തരുമായ
  rationale: രണ്ടു വിശേഷണങ്ങളുടെയും താരതമ്യസ്വഭാവം നിലനിർത്തുന്നു; רַבִּים എന്നതിലെ സംഖ്യാബോധമുള്ള മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ചതുർവ്യഞ്ജന ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: ദേശത്തിലെ ജനതകളെ നീക്കുന്നതിൽ പ്രവർത്തകന്റെ തിരിച്ചറിയൽ
  choice: യഹ്‌വെ തന്നെയാണ് അവരെ തുരത്തുന്നതെന്ന് വ്യാകരണപരമായി വ്യക്തമാക്കി
  alternative: ഇസ്രായേൽ അവരെ തുരത്തുന്നതായി പരോക്ഷമായി വായിക്കുക
  rationale: וְנָשַׁל എന്ന ക്രിയയുടെ വ്യാകരണകർത്താവ് മുൻവാക്യത്തിലെ യഹ്‌വെയാണ്; പാഠത്തിലെ ദൈവിക പ്രവർത്തനം മങ്ങിക്കാതിരിക്കാൻ അതേ വാക്യഘടന നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. വാക്യം അടുത്ത വാക്യങ്ങളിലേക്കു വ്യാകരണപരമായി തുടരുന്നതിനാൽ അവസാനത്തിൽ പൂർണവിരാമം ചേർത്തിട്ടില്ല. ജനനാമങ്ങൾക്ക് മലയാള ബൈബിൾ വായനയിൽ പരിചിതമായ ലിപ്യന്തരണരൂപങ്ങൾ ഉപയോഗിച്ചു; അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട പദപ്രയോഗങ്ങൾക്ക് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
