id: DEU.7.18
reference: Deuteronomy 7:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹ֥א תִירָ֖א מֵ/הֶ֑ם זָכֹ֣ר תִּזְכֹּ֗ר אֵ֤ת אֲשֶׁר עָשָׂה֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לְ/פַרְעֹ֖ה וּ/לְ/כָל מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/018.yaml
  text: You shall not fear them[a]; you shall surely remember what Yahweh your God did to Pharaoh and to all Egypt.
translation:
  language: ml
  text: നീ അവരെ ഭയപ്പെടരുത്; നിന്റെ ദൈവമായ യഹ്‌വെ ഫറവോനോടും ഈജിപ്ത് മുഴുവനോടും ചെയ്തത് നീ തീർച്ചയായും ഓർക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “ഓർക്കുക, നീ ഓർക്കണം.” ആവർത്തനസ്വഭാവമുള്ള ഈ ഹീബ്രു ക്രിയാഘടന ശക്തമായ ഊന്നൽ നൽകുന്നു; അതിന്റെ അർഥം “തീർച്ചയായും ഓർക്കണം” അല്ലെങ്കിൽ “നന്നായി ഓർക്കണം” എന്നാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תִירָא מֵהֶם
  choice: നീ അവരെ ഭയപ്പെടരുത്
  rationale: ഈ സന്ദർഭത്തിൽ לֹא ചേർന്ന അപൂർണക്രിയ നിരോധനാത്മകമായ ആഹ്വാനമാണ്. מִן ഭയത്തിന്റെ കർമത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അവരെ ഭയപ്പെടരുത്’ എന്നത് സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: זָכֹר תִּזְכֹּר
  choice: നീ തീർച്ചയായും ഓർക്കണം
  rationale: ക്രിയയുടെ infinitive absolute രൂപവും അപൂർണക്രിയയും ചേർന്ന ഈ ഹീബ്രു ഘടന ശക്തമായ ഊന്നൽ നൽകുന്നു. ‘തീർച്ചയായും’ ആ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֵת אֲשֶׁר עָשָׂה
  choice: ചെയ്തത്
  rationale: പൂർത്തിയായ ചരിത്രസംഭവത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു perfect രൂപം മലയാളത്തിൽ ‘ചെയ്തത്’ എന്നു സ്വാഭാവികമായി വരുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, Yahweh എന്ന ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: രണ്ടാംപുരുഷ ഏകവചന പ്രത്യയം ‘നിന്റെ’ എന്നു പരിഭാഷപ്പെടുത്തി; തുടർന്നുവരുന്ന ദൈവനാമവുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ ‘ദൈവമായ’ എന്നു നൽകി.
- source_word: לְפַרְעֹה וּלְכָל מִצְרָיִם
  choice: ഫറവോനോടും ഈജിപ്ത് മുഴുവനോടും
  rationale: לְ ഇവിടെ പ്രവൃത്തിയാൽ ബാധിക്കപ്പെട്ടവരെയോ ബാധിക്കപ്പെട്ട സമഗ്രദേശത്തെയോ സൂചിപ്പിക്കുന്നു. ‘ഈജിപ്ത് മുഴുവൻ’ എന്നത് ജനങ്ങളെ മാത്രം വ്യക്തമാക്കാതെ മൂലപാഠത്തിലെ രാജ്യസംബന്ധിയായ കൂട്ടായ അർഥം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ഒരു സ്ഥാനപ്പേരാൽ പകരാതെ Yahweh എന്നതിന്റെ മലയാള ലിപ്യന്തരണം നൽകുന്നത് പാഠത്തിലെ ഉടമ്പടിനാമം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഏകവചന അഭിസംബോധന ‘നീ/നിന്റെ’ എന്നു നിലനിർത്തി. ഹീബ്രുവിലെ ഊന്നൽ മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
