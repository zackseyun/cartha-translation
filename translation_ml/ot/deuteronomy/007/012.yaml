source:
  edition: WLC
  text: וְ/הָיָ֣ה עֵ֣קֶב תִּשְׁמְע֗וּ/ן אֵ֤ת הַ/מִּשְׁפָּטִים֙ הָ/אֵ֔לֶּה וּ/שְׁמַרְתֶּ֥ם וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם וְ/שָׁמַר֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ לְ/ךָ֗ אֶֽת הַ/בְּרִית֙ וְ/אֶת הַ/חֶ֔סֶד אֲשֶׁ֥ר נִשְׁבַּ֖ע לַ/אֲבֹתֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/012.yaml
  text: And because you listen to these judgments[a], and keep and do them[c][b], Yahweh your God will keep for you the covenant and the steadfast love that he swore to your fathers.
translation:
  language: ml
  text: ഈ നിയമവിധികൾ[a] നിങ്ങൾ കേട്ട് അവ പാലിക്കുകയും അനുഷ്ഠിക്കുകയും ചെയ്താൽ, നിങ്ങളുടെ ദൈവമായ യഹോവ നിങ്ങളുടെ പിതാക്കന്മാരോടു[c] സത്യം ചെയ്ത ഉടമ്പടിയും അചഞ്ചലമായ സ്നേഹവും[b] നിങ്ങൾക്കായി പാലിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഈ വിധികൾ’ അല്ലെങ്കിൽ ‘ഈ ചട്ടങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘അചഞ്ചലമായ സ്നേഹം’ എന്നത് ഹീബ്രുവിലെ ഹെസെദ് എന്ന പദത്തിന്റെ പരിഭാഷയാണ്. ഉടമ്പടിയോടുള്ള വിശ്വസ്തത നിറഞ്ഞ സ്നേഹത്തെ ഈ പദം പലപ്പോഴും സൂചിപ്പിക്കുന്നു; ‘ഉടമ്പടിവിശ്വസ്തത’ അല്ലെങ്കിൽ ‘അചഞ്ചലദയ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: ‘നിങ്ങളുടെ പൂർവികരോടു’ എന്നും പരിഭാഷപ്പെടുത്താം; ഹീബ്രുവിൽ അക്ഷരാർഥമായി ‘നിങ്ങളുടെ പിതാക്കന്മാരോടു’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה עֵקֶב
  choice: ചെയ്താൽ
  rationale: ഈ പ്രയോഗം തുടർന്നുവരുന്ന അനുസരണത്തെ അടിസ്ഥാനമാക്കിയുള്ള ഫലം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ സോപാധികരൂപം കാരണ-ഫലബന്ധം സ്വാഭാവികമായും വ്യക്തമായും നൽകുന്നു.
- source_word: תִּשְׁמְעוּן
  choice: കേട്ട്
  rationale: שׁמע എന്ന പദത്തിലെ കേൾവിയുടെയും പ്രതികരണപരമായ അനുസരണത്തിന്റെയും ഭാവം നിലനിർത്തുന്നു; തുടർന്ന് ‘പാലിക്കുകയും അനുഷ്ഠിക്കുകയും’ എന്നു വരുന്നതിനാൽ ‘അനുസരിക്കുക’ എന്ന് ആവർത്തിക്കുന്നില്ല.
- source_word: הַמִּשְׁפָּטִים הָאֵלֶּה
  choice: ഈ വിധികൾ
  rationale: നിയമപരമായ വിധികൾ, ചട്ടങ്ങൾ, കൽപ്പനകൾ എന്നീ അർഥപരിധിയുള്ള מִשְׁפָּטִים എന്ന പദത്തിന്റെ ഔപചാരിക നിയമഭാവം ‘വിധികൾ’ നിലനിർത്തുന്നു.
- source_word: וּשְׁמַרְתֶּם וַעֲשִׂיתֶם אֹתָם
  choice: അവ പാലിക്കുകയും അനുഷ്ഠിക്കുകയും
  rationale: ‘പാലിക്കുക’, ‘ചെയ്യുക’ എന്നീ രണ്ട് ഉടമ്പടിസംബന്ധമായ ക്രിയകളെയും വേർതിരിച്ച് നിലനിർത്തുന്നു.
- source_word: וְשָׁמַר
  choice: പാലിക്കും
  rationale: ജനത്തിന്റെ വിധികൾ ‘പാലിക്കൽ’ എന്നതിനും യഹോവയുടെ ഉടമ്പടി ‘പാലിക്കൽ’ എന്നതിനുമിടയിലെ ശബ്ദബന്ധം മലയാളത്തിലും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണത്തിൽ നൽകുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിങ്ങളുടെ ദൈവമായ
  rationale: ദൈവവും അഭിസംബോധിതരായ ജനവും തമ്മിലുള്ള ഉടമ്പടിബന്ധം സൂചിപ്പിക്കുന്ന സ്വാമിത്വരൂപം നിലനിർത്തുന്നു.
- source_word: לְךָ
  choice: നിങ്ങൾക്കായി
  rationale: യഹോവയുടെ ഉടമ്പടിപാലനത്തിന്റെ ഗുണഭോക്താക്കളെ സൂചിപ്പിക്കുന്ന ഹീബ്രു ദത്തിവ് ഭാവം വ്യക്തമാക്കുന്നു.
- source_word: הַבְּרִית
  choice: ഉടമ്പടി
  rationale: בְּרִית എന്ന കേന്ദ്ര ഉടമ്പടിപദത്തിന് മലയാളത്തിൽ സ്ഥിരവും സ്വാഭാവികവുമായ തുല്യപദം.
- source_word: הַחֶסֶד
  choice: അചഞ്ചലമായ സ്നേഹം
  rationale: חֶסֶד ഉൾക്കൊള്ളുന്ന വിശ്വസ്തത, സ്ഥിരത, കൃപാപൂർണ സ്നേഹം എന്നീ ബന്ധപരവും ഉടമ്പടിപരവുമായ ഭാവങ്ങൾ ഒന്നിച്ചുനിർത്തുന്നു.
- source_word: אֲשֶׁר נִשְׁבַּע
  choice: സത്യം ചെയ്ത
  rationale: ശപഥം ചെയ്യുക എന്ന ക്രിയയുടെ അർഥം ചുരുക്കമായും കൃത്യമായും നൽകുന്നു.
- source_word: לַאֲבֹתֶיךָ
  choice: നിങ്ങളുടെ പിതാക്കന്മാരോടു
  rationale: മൂലത്തിലെ വ്യക്തമായ പുരുഷലിംഗ ബഹുവചനവും ഗോത്രപിതാക്കന്മാരിലേക്കുള്ള സൂചനയും പൊതുവായ ‘പൂർവികർ’ എന്നതാക്കി മാറ്റാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഉടമ്പടിപശ്ചാത്തലത്തിലെ חֶסֶד എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: അചഞ്ചലമായ സ്നേഹം
  alternative: ഉടമ്പടിവിശ്വസ്തത; ദയ; അചഞ്ചലദയ
  rationale: ഈ പദത്തിലെ വിശ്വസ്തമായ പ്രതിബദ്ധതയും കൃപാപൂർണമായ സ്നേഹവും തമ്മിലുള്ള സമൃദ്ധമായ പിരിമുറുക്കം നിലനിർത്തുന്നു; അതിനെ നിയമപരമായ വിശ്വസ്തതയിലേക്കോ വികാരത്തിലേക്കോ മാത്രം ചുരുക്കുന്നില്ല.
- issue: לַאֲבֹתֶיךָ എന്നതിലെ ലിംഗസൂചന
  choice: നിങ്ങളുടെ പിതാക്കന്മാരോടു
  alternative: നിങ്ങളുടെ പൂർവികരോടു
  rationale: മൂലപാഠം പ്രത്യേകമായി പിതാക്കന്മാരെ സൂചിപ്പിക്കുന്നതിനാൽ അതിലെ പുരുഷലിംഗസൂചന നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. നിയമ-ഉടമ്പടി പദങ്ങൾ വ്യക്തമായി നിലനിർത്തിയിട്ടുണ്ട്. ബഹുവചനമായ ‘നിങ്ങൾ’ സമൂഹമായ ഇസ്രായേലിനോടുള്ള അഭിസംബോധന വ്യക്തമാക്കുന്നു; ഹീബ്രുവിലെ ക്രിയാപുനരാവർത്തനം കഴിയുന്നത്ര സംരക്ഷിച്ചിട്ടുണ്ട്.
