base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/013.yaml
  text: He will love you[a], bless you, and multiply you. He will bless the fruit of your womb and the fruit of your ground—your grain, your new wine, and your oil, the offspring of your herds and the young of your flock—in the land that he swore to your fathers to give you.
translation:
  language: ml
  text: അവൻ നിന്നെ സ്നേഹിക്കുകയും അനുഗ്രഹിക്കുകയും വർധിപ്പിക്കുകയും ചെയ്യും. നിനക്കു തരാമെന്ന് നിന്റെ പിതാക്കന്മാരോട്[a] അവൻ സത്യം ചെയ്ത ദേശത്ത്, നിന്റെ ഗർഭഫലത്തെയും നിന്റെ നിലത്തിന്റെ ഫലത്തെയും—നിന്റെ ധാന്യത്തെയും പുതുവീഞ്ഞിനെയും എണ്ണയെയും—നിന്റെ കന്നുകാലിക്കൂട്ടങ്ങളുടെ സന്തതിയെയും നിന്റെ ആട്ടിൻപറ്റത്തിന്റെ കുഞ്ഞുങ്ങളെയും അവൻ അനുഗ്രഹിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്റെ പൂർവികരോട്.” എബ്രായമൂലത്തിൽ “നിന്റെ പിതാക്കന്മാരോട്” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲהֵבְךָ
  choice: അവൻ നിന്നെ സ്നേഹിക്കുകയും … ചെയ്യും
  rationale: സന്ദർഭത്തിലെ ഉടമ്പടി-അനുഗ്രഹങ്ങളുടെ ഭാവികാലപരമ്പര പിന്തുടരുന്നു; ‘സ്നേഹിക്കുക’ എന്നത് മൂലപദത്തിന്റെ നേരിട്ടുള്ള അർഥവും ഉടമ്പടിപരമായ വാത്സല്യവും നിലനിർത്തുന്നു.
- source_word: וּבֵרַכְךָ וְהִרְבֶּךָ
  choice: അനുഗ്രഹിക്കുകയും വർധിപ്പിക്കുകയും ചെയ്യും
  rationale: രണ്ടു ക്രിയകളുടെയും ‘നിന്നെ’ എന്ന ഏകവചനസംബോധന നിലനിർത്തിക്കൊണ്ട് അനുഗ്രഹവും ജനവർധനയും നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: פְּרִי בִטְנְךָ וּפְרִי אַדְמָתֶךָ
  choice: നിന്റെ ഉദരഫലത്തെയും നിന്റെ നിലത്തിന്റെ ഫലത്തെയും
  rationale: രണ്ടിടത്തുമുള്ള פְּרִי എന്ന പദത്തിന്റെ ആവർത്തനവും സന്താനോൽപത്തിയുടെയും കാർഷികസമൃദ്ധിയുടെയും ദൃശ്യരൂപകവും സംരക്ഷിക്കുന്നു.
- source_word: דְּגָנְךָ וְתִירֹשְׁךָ וְיִצְהָרֶךָ
  choice: നിന്റെ ധാന്യത്തെയും പുതുവീഞ്ഞിനെയും എണ്ണയെയും
  rationale: പ്രധാന കാർഷികോൽപ്പന്നങ്ങളെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വേർതിരിക്കുന്നു; תִּירוֹשׁ എന്നതിന്റെ പുതുതായി ഉൽപ്പാദിപ്പിച്ച വീഞ്ഞ് എന്ന പ്രത്യേകത ‘പുതുവീഞ്ഞ്’ സൂചിപ്പിക്കുന്നു.
- source_word: שְׁגַר אֲלָפֶיךָ
  choice: നിന്റെ കന്നുകാലിക്കൂട്ടങ്ങളുടെ സന്തതിയെ
  rationale: אֲלָפֶיךָ എന്ന ബഹുവചനരൂപവും കന്നുകാലികൾ പ്രസവിച്ച കുഞ്ഞുങ്ങൾ എന്ന പ്രയോഗാർത്ഥവും വ്യക്തമാക്കുന്നു.
- source_word: עַשְׁתְּרֹת צֹאנֶךָ
  choice: നിന്റെ ആട്ടിൻപറ്റത്തിന്റെ കുഞ്ഞുങ്ങളെ
  rationale: അപൂർവമായ עַשְׁתְּרֹת എന്ന പദത്തെ ഈ കൂട്ടുപ്രയോഗത്തിൽ ചെറുകന്നുകാലികളുടെ കുഞ്ഞുങ്ങൾ എന്ന അർഥത്തിൽ അവതരിപ്പിക്കുന്നു; അതിനെ ദേവനാമമായി തെറ്റായി ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: עַל הָאֲדָמָה
  choice: ദേശത്ത്
  rationale: ഇവിടെ അനുഗ്രഹങ്ങൾ സംഭവിക്കുന്ന വാഗ്ദത്തപ്രദേശം ഉദ്ദേശിക്കുന്നതിനാൽ സ്ഥലസൂചനയായി ‘ദേശത്ത്’ സ്വാഭാവികമാണ്.
- source_word: אֲשֶׁר נִשְׁבַּע לַאֲבֹתֶיךָ לָתֶת לָךְ
  choice: നിനക്കു തരാമെന്ന് നിന്റെ പിതാക്കന്മാരോട് അവൻ സത്യംചെയ്ത
  rationale: ദൈവികശപഥത്തിന്റെ ഘടനയും ‘നിനക്ക്’ എന്ന ഏകവചനസംബോധനയും നിലനിർത്തുന്നു; אָבוֹת എന്ന പുരുഷലിംഗ ബഹുവചനം ‘പിതാക്കന്മാർ’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു.
theological_decisions:
- issue: לַאֲבֹתֶיךָ എന്നതിന്റെ പരിഭാഷ
  choice: നിന്റെ പിതാക്കന്മാരോട്
  alternative: നിന്റെ പൂർവികരോട്
  rationale: എബ്രായപദം വ്യക്തമായി ‘പിതാക്കന്മാർ’ എന്ന പുരുഷലിംഗ ബഹുവചനമാണ്. മൂലരൂപം പ്രധാനപാഠത്തിൽ നിലനിർത്തുകയും കൂടുതൽ പൊതുവായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഏകവചനമായ ‘നീ/നിന്റെ’ അഭിസംബോധനയും അനുഗ്രഹങ്ങളുടെ കാവ്യാത്മക പട്ടികയും നിലനിർത്തി. ദീർഘമായ എബ്രായവാക്യം മലയാളത്തിൽ വായനാസൗകര്യത്തിനായി രണ്ടു വാക്യങ്ങളാക്കി; രണ്ടാമത്തെ വാക്യത്തിൽ ദേശസൂചന ആദ്യം വെച്ചെങ്കിലും അർഥബന്ധം മാറ്റിയിട്ടില്ല.
