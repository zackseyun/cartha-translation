id: DEU.7.17
reference: Deuteronomy 7:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֤י תֹאמַר֙ בִּ/לְבָ֣בְ/ךָ֔ רַבִּ֛ים הַ/גּוֹיִ֥ם הָ/אֵ֖לֶּה מִמֶּ֑/נִּי אֵיכָ֥ה אוּכַ֖ל לְ/הוֹרִישָֽׁ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/017.yaml
  text: If you say in your heart[a], ‘These nations are more numerous than I; how can I dispossess them?’
translation:
  language: ml
  text: നിന്റെ ഹൃദയത്തിൽ[a], ‘ഈ ജനതകൾ എന്നെക്കാൾ എണ്ണത്തിൽ കൂടുതലാണ്; എനിക്ക് എങ്ങനെ അവരെ അവരുടെ ദേശത്തുനിന്ന് ഒഴിപ്പിക്കാൻ കഴിയും?’ എന്ന് നീ പറഞ്ഞാൽ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരെ ദേശത്തുനിന്ന് ഓടിച്ചുകളയാൻ.” എബ്രായ ക്രിയയ്ക്ക് അവരെ ദേശത്തിന്റെ കൈവശം നഷ്ടപ്പെടുമാറാക്കുക എന്ന അർഥവുമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: എന്ന് നീ പറഞ്ഞാൽ
  rationale: ഇവിടെ כִּי അടുത്ത വാക്യത്തിലെ ആശ്വാസത്തിലേക്കു നയിക്കുന്ന സോപാധിക സാഹചര്യം അവതരിപ്പിക്കുന്നു; അതിനാൽ ‘പറഞ്ഞാൽ’ സ്വാഭാവികമാണ്.
- source_word: בִּלְבָבְךָ
  choice: നിന്റെ ഹൃദയത്തിൽ
  rationale: ആന്തരിക ചിന്തയെയോ സ്വയം പറയുന്നതിനെയോ സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം നിലനിർത്തുന്നു; മലയാളത്തിലും മനസ്സിലാകുന്ന ബൈബിൾഭാഷയാണ്.
- source_word: רַבִּים ... מִמֶּנִּי
  choice: എന്നെക്കാൾ എണ്ണത്തിൽ കൂടുതലാണ്
  rationale: מִן താരതമ്യം സൂചിപ്പിക്കുന്നു; ‘എണ്ണത്തിൽ’ ചേർക്കുന്നത് രַבִּים എന്നതിന്റെ സംഖ്യാപരമായ അർഥം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു. ഏകവചന അഭിസംബോധനയും നിലനിർത്തുന്നു.
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: ഈ ജനതകൾ
  rationale: ദേശത്തുള്ള വ്യത്യസ്ത ജനവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്ന גּוֹיִם എന്ന പദത്തിന് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ തുല്യപദം.
- source_word: אֵיכָה אוּכַל
  choice: എനിക്ക് എങ്ങനെ ... കഴിയും?
  rationale: സാധ്യതയെയും കഴിവിനെയും ചോദ്യം ചെയ്യുന്ന എബ്രായ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: לְהוֹרִישָׁם
  choice: അവരെ അവരുടെ ദേശത്തുനിന്ന് നീക്കിക്കളയാൻ
  rationale: ירש എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ അവരെ ഭൂമിയുടെ കൈവശാവകാശം നഷ്ടപ്പെടുത്തുക എന്ന ആശയം വഹിക്കുന്നു. ‘ദേശത്തുനിന്ന്’ എന്നത് ഭൂമികൈവശത്തിന്റെ സന്ദർഭം വ്യക്തമാക്കുന്നു; ‘നീക്കിക്കളയുക’ വായനാസൗകര്യം നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഏകവചനമായ ‘നീ’ എന്ന അഭിസംബോധനയും ‘ഹൃദയത്തിൽ’ എന്ന ഉറവിടരൂപകവും സംരക്ഷിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം വാക്യാവസാനത്ത് ചേർത്തിരിക്കുന്നു.
