language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/נָשַׁל֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ אֶת הַ/גּוֹיִ֥ם הָ/אֵ֛ל מִ/פָּנֶ֖י/ךָ מְעַ֣ט מְעָ֑ט לֹ֤א תוּכַל֙ כַּלֹּתָ֣/ם מַהֵ֔ר פֶּן תִּרְבֶּ֥ה עָלֶ֖י/ךָ חַיַּ֥ת הַ/שָּׂדֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/022.yaml
  text: And Yahweh your God will drive out these nations before you little by little[a]. You will not be able to finish them off quickly[b], lest the wild animals become too numerous against you.
translation:
  language: ml
  text: നിന്റെ ദൈവമായ യാഹ്‌വെ ഈ ജനതകളെ നിന്റെ മുമ്പിൽനിന്ന് കുറേശ്ശെക്കുറേശ്ശെയായി നീക്കിക്കളയും.[a] അവരെ വേഗത്തിൽ പൂർണമായി നശിപ്പിക്കാൻ നിനക്കു കഴിയുകയില്ല; അല്ലെങ്കിൽ വന്യമൃഗങ്ങൾ നിനക്കെതിരെ പെരുകും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഈ ജനതകളെ നിന്റെ മുമ്പിൽനിന്ന് കുറേശ്ശെക്കുറേശ്ശെയായി പുറത്താക്കും.”
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: “വയലിലെ മൃഗങ്ങൾ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשַׁל
  choice: നീക്കിക്കളയും
  rationale: ദേശത്തുനിന്ന് ജനതകളെ ഒഴിപ്പിക്കുന്ന കാരണകക്രിയാഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; പുറത്താക്കുക/അവകാശം നീക്കുക എന്നീ അർത്ഥസാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ ചതുരക്ഷര ദൈവനാമത്തെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: הַגּוֹיִם הָאֵל
  choice: ഈ ജനതകളെ
  rationale: പ്രദർശകസർവനാമവും കനാന്യ ജനവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്ന രാഷ്ട്രീയ-ജനതാത്മക അർത്ഥവും സംരക്ഷിക്കുന്നു.
- source_word: מִפָּנֶיךָ
  choice: നിന്റെ മുമ്പിൽനിന്ന്
  rationale: എബ്രായ സ്ഥലസൂചക പ്രയോഗത്തിലെ ‘നിന്റെ സന്നിധിയിൽ/വഴിയിൽനിന്ന്’ എന്ന നീക്കത്തിന്റെ ഭാവം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: מְעַט מְעָט
  choice: കുറേശ്ശെ കുറേശ്ശെയായി
  rationale: ആവർത്തനത്തിലൂടെ പ്രകടമാകുന്ന ക്രമികത മലയാളത്തിലും ആവർത്തനംകൊണ്ട് സംരക്ഷിക്കുന്നു.
- source_word: לֹא תוּכַל כַּלֹּתָם מַהֵר
  choice: അവരെ വേഗത്തിൽ പൂർണമായി ഇല്ലാതാക്കാൻ നിനക്കു കഴിയുകയില്ല
  rationale: כלה എന്ന ക്രിയയുടെ സമ്പൂർണാന്ത്യത്തിലെത്തിക്കൽ എന്ന ശക്തിയും לֹא תוּכַל എന്ന അസമർഥതയും വ്യക്തമായി നൽകുന്നു.
- source_word: פֶּן
  choice: അങ്ങനെ ചെയ്താൽ
  rationale: മുൻപ്രവൃത്തിയിൽനിന്നുണ്ടാകാവുന്ന അനിഷ്ടഫലം മുന്നറിയിപ്പായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: תִּרְבֶּה עָלֶיךָ
  choice: നിനക്കെതിരായി പെരുകിപ്പോകും
  rationale: എണ്ണത്തിൽ വർധിക്കുന്നതും ആ വർധന ഇസ്രായേലിന് ഭീഷണിയാകുന്നതുമായ സന്ദർഭഭാവം സംരക്ഷിക്കുന്നു.
- source_word: חַיַּת הַשָּׂדֶה
  choice: കാട്ടുമൃഗങ്ങൾ
  rationale: അക്ഷരാർഥമായ ‘വയലിലെ മൃഗങ്ങൾ’ എന്നതിനു പകരം വളർത്തുമൃഗങ്ങളിൽനിന്ന് വ്യത്യസ്തമായ വന്യമൃഗങ്ങളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളം ഉപയോഗിക്കുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം തന്നെയായതിനാൽ ഒരു പദവികൊണ്ട് പകരംവയ്ക്കാതെ മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ രൂപം ഉപയോഗിച്ചു; കൃത്യമായ പുരാതന ഉച്ചാരണം നിർണായകമായി അറിയപ്പെടാത്തതിനാൽ യാഹ്‌വെ എന്ന ലിപ്യന്തരണവും സാധ്യമാണ്.
- issue: כַּלֹּתָם എന്നതിന്റെ വ്യാപ്തി
  choice: പൂർണമായി ഇല്ലാതാക്കാൻ
  alternative: അവസാനിപ്പിക്കാൻ; നശിപ്പിക്കാൻ
  rationale: ക്രിയയിലെ സമ്പൂർണതയുടെ ഭാവം നിലനിർത്തുന്നു; ഇതിനെ സാങ്കേതികമായ ഒരു ദൈവശാസ്ത്രപരമായ സംഹാരസൂത്രമായി വികസിപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഏകവചന അഭിസംബോധനയായ ‘നിന്റെ/നിനക്കു’ നിലനിർത്തി. എബ്രായത്തിന്റെ ക്രമികത സൂചിപ്പിക്കുന്ന ആവർത്തനം സ്വാഭാവിക മലയാളരൂപത്തിൽ സംരക്ഷിച്ചു; ശിക്ഷാസംബന്ധമോ സമ്പൂർണസംഹാരമോ സംബന്ധിച്ച അധിക വിഭാഗീയ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
