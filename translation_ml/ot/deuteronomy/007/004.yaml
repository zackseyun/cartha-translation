  source_fidelity: 'തിരുത്തൽ ആവശ്യമാണ്: יָסִיר എന്ന ക്രിയ ഇവിടെ സ്ത്രീലിംഗ ഏകവചനമാണ്; മുൻവാക്യത്തിൽ പരാമർശിച്ച വിദേശസ്ത്രീയെയാണ് കർത്താവായി സൂചിപ്പിക്കുന്നത്. കരടിലെ “അവൻ” മൂലപാഠത്തിന്റെ ലിംഗത്തോട് പൊരുത്തപ്പെടുന്നില്ല. “അവൾ” ആക്കണം. ഏകവചനമായ “നിന്റെ മകനെ,” തുടർന്നുള്ള ബഹുവചനമായ “അവർ സേവിക്കും,” പിന്നീടുള്ള “നിങ്ങൾക്കെതിരെ/നിന്നെ” എന്ന സംഖ്യാമാറ്റം യഥാവിധി സംരക്ഷിച്ചിട്ടുണ്ട്.'
  naturalness: “അവൾ നിന്റെ മകനെ എന്നെ അനുഗമിക്കുന്നതിൽനിന്ന് പിന്തിരിപ്പിക്കും” ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്. “അന്യദേവന്മാരെ സേവിക്കും,” “യഹ്‌വെയുടെ കോപം നിങ്ങൾക്കെതിരെ ജ്വലിക്കും,” “വേഗത്തിൽ നശിപ്പിക്കും” എന്നിവ ഗൗരവമുള്ള തിരുവെഴുത്തു-രജിസ്റ്ററിൽ സ്വാഭാവികമാണ്.
  terminology: “യഹ്‌വെ” യഹോവയുടെ പേരിന്റെ ശബ്ദാന്തരമായി സ്ഥിരതയുള്ളതാണ്. “അന്യദേവന്മാർ,” “കോപം ജ്വലിക്കും,” “നശിപ്പിക്കും” എന്നിവ മൂലപാഠത്തിന്റെ അർഥവും ശക്തിയും മതിയായവിധം നൽകുന്നു.
