id: DEU.7.4
reference: Deuteronomy 7:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּֽי יָסִ֤יר אֶת בִּנְ/ךָ֙ מֵֽ/אַחֲרַ֔/י וְ/עָבְד֖וּ אֱלֹהִ֣ים אֲחֵרִ֑ים וְ/חָרָ֤ה אַף יְהוָה֙ בָּ/כֶ֔ם וְ/הִשְׁמִידְ/ךָ֖ מַהֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/004.yaml
  text: For he will turn your son away from following me[a], and they will serve other gods; then the anger of Yahweh will burn against you[c][b], and he will quickly destroy you.
translation:
  language: ml
  text: കാരണം, അവൾ നിന്റെ മകനെ എന്നെ അനുഗമിക്കുന്നതിൽനിന്ന് പിന്തിരിപ്പിക്കും[a]; അവർ അന്യദേവന്മാരെ സേവിക്കും[b]. അപ്പോൾ യഹ്‌വെയുടെ[c] കോപം നിങ്ങൾക്കെതിരെ ജ്വലിക്കും; അവൻ നിന്നെ വേഗത്തിൽ നശിപ്പിക്കും[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “എന്റെ പിന്നാലെനിന്ന്”; ഇവിടെ അർഥം “എന്നെ അനുഗമിക്കുന്നതിൽനിന്ന്.”'
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായം “നിന്റെ മകൻ” എന്ന ഏകവചനത്തിൽനിന്ന് “അവർ സേവിക്കും” എന്ന ബഹുവചനത്തിലേക്ക് മാറുന്നു. ഇത് കുടുംബത്തിലേക്കോ സമൂഹത്തിലേക്കോ വ്യാപിക്കുന്ന ഫലത്തെ സൂചിപ്പിക്കാം. മറ്റൊരു വായന: “അവൻ അന്യദേവന്മാരെ സേവിക്കും.”'
    reason: alternative_reading
  - marker: c
    text: “യഹ്‌വെ” എന്നത് എബ്രായത്തിലെ ദൈവനാമമായ יהוה (YHWH) യുടെ ശബ്ദാന്തരമാണ്; പരമ്പരാഗതമായി “കർത്താവ്” എന്നും പരിഭാഷപ്പെടുത്താറുണ്ട്.
    reason: alternative_reading
  - marker: d
    text: ഇവിടെ എബ്രായം “നിങ്ങൾക്കെതിരെ” എന്ന ബഹുവചനത്തിൽനിന്ന് “നിന്നെ” എന്ന ഏകവചനത്തിലേക്ക് മാറി, ജനത്തെ ഒരു സമൂഹമായും ഏകീകൃത ഘടകമായും അഭിസംബോധന ചെയ്യുന്നു.
    reason: grammar
lexical_decisions:
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ മിശ്രവിവാഹനിരോധനത്തിന്റെ കാരണം അവതരിപ്പിക്കുന്ന ബന്ധപദമായി എടുത്തു.
- source_word: יָסִיר
  choice: പിന്തിരിപ്പിക്കും
  rationale: סור എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലുള്ള കാരണാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בִּנְךָ
  choice: നിന്റെ മകനെ
  rationale: എബ്രായത്തിലെ ഏകവചന പുല്ലിംഗരൂപവും മുൻവാക്യത്തിലെ ‘നിന്റെ മകൻ’ എന്ന വ്യക്തമായ പരാമർശവും നിലനിർത്തുന്നു.
- source_word: מֵאַחֲרַי
  choice: എന്നെ അനുഗമിക്കുന്നതിൽനിന്ന്
  rationale: അക്ഷരാർഥമായ ‘എന്റെ പിന്നാലെനിന്ന്’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ഉടമ്പടിപരമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְעָבְדוּ
  choice: അവർ ... സേവിക്കും
  rationale: ‘നിന്റെ മകൻ’ എന്ന ഏകവചനത്തിനുശേഷം മൂലപാഠത്തിലുള്ള ബഹുവചന ക്രിയ അതേപടി സൂക്ഷിക്കുന്നു; അതിന്റെ പരിധി വിവർത്തനം നിർബന്ധിച്ച് ചുരുക്കുന്നില്ല.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: അന്യദേവന്മാരെ
  rationale: യഹ്‌വെയോടുള്ള ഏകഭക്തിക്ക് വിരുദ്ധമായ മറ്റു ദേവന്മാരെ സൂചിപ്പിക്കുന്ന പതിവും വ്യക്തവുമായ മലയാളപ്രയോഗം.
- source_word: וְחָרָה אַף יְהוָה
  choice: അപ്പോൾ യഹ്‌വെയുടെ കോപം ... ജ്വലിക്കും
  rationale: കോപം ജ്വലിക്കുന്നു എന്ന എബ്രായ രൂപകം നിലനിർത്തുകയും സംഭവഫലബന്ധം ‘അപ്പോൾ’കൊണ്ട് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: בָּכֶם
  choice: നിങ്ങൾക്കെതിരെ
  rationale: חרה אף എന്ന പ്രയോഗത്തോടൊപ്പം വരുന്ന മുൻപ്രത്യയം ദൈവകോപത്തിന്റെ ലക്ഷ്യത്തെ സൂചിപ്പിക്കുന്നു; ബഹുവചനവും നിലനിർത്തുന്നു.
- source_word: וְהִשְׁמִידְךָ מַהֵר
  choice: അവൻ നിന്നെ വേഗത്തിൽ നശിപ്പിക്കും
  rationale: ശക്തമായ ന്യായവിധിയും അതിന്റെ ദ്രുതതയും വ്യക്തമായി നൽകുന്നു; അഭിസംബോധനയുടെ ഏകവചനരൂപം സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: മുന്നറിയിപ്പിലെ ഏകവചനത്തിൽനിന്നുള്ള ബഹുവചനമാറ്റം
  choice: ‘നിന്റെ മകനെ’ എന്ന ഏകവചനത്തിനുശേഷം ‘അവർ സേവിക്കും’ എന്ന ബഹുവചനം നിലനിർത്തി.
  alternative: ‘അവൻ അന്യദേവന്മാരെ സേവിക്കും’ എന്നു ഏകവചനമാക്കി ഒത്താക്കുക.
  rationale: മൂലപാഠം ആരെയെല്ലാം ഉൾക്കൊള്ളുന്നു എന്നതിൽ ഒരു വിശാലമായ കുടുംബപരമോ സമൂഹപരമോ ആയ ഫലം സൂചിപ്പിക്കാമെങ്കിലും അത് നിർണ്ണായകമായി തീർപ്പാക്കുന്നില്ല; അതിനാൽ സംഖ്യാമാറ്റം സംരക്ഷിച്ചു.
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: ഒരു സ്ഥാനപ്പേര് പകരംവയ്ക്കാതെ എബ്രായത്തിലെ വ്യക്തിനാമത്തെ മലയാളത്തിൽ ശബ്ദാന്തരം ചെയ്തു; ‘യഹോവ’ എന്ന പരമ്പരാഗത രൂപത്തേക്കാൾ ‘യഹ്‌വെ’ മൂലരൂപത്തോട് അടുത്തതാണ്.
- issue: അഭിസംബോധനയിലെ ബഹുവചന-ഏകവചനമാറ്റം
  choice: ‘നിങ്ങൾക്കെതിരെ’ എന്നും തുടർന്ന് ‘നിന്നെ’ എന്നും മൂലപാഠത്തിലെ മാറ്റം നിലനിർത്തി.
  alternative: രണ്ടും ബഹുവചനമോ രണ്ടും ഏകവചനമോ ആക്കി മിനുക്കുക.
  rationale: ഇസ്രായേലിനെ സമൂഹമായും ഏകീകൃത ജനമായും അഭിസംബോധന ചെയ്യുന്ന എബ്രായ വാചകത്തിന്റെ രൂപപരമായ പിരിമുറുക്ക് ഇല്ലാതാക്കാതിരിക്കാൻ.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘പിന്തിരിപ്പിക്കും,’ ‘കോപം ജ്വലിക്കും,’ ‘നശിപ്പിക്കും’ എന്നീ പ്രയോഗങ്ങൾ മൂലപാഠത്തിന്റെ കാരണാർഥവും ശക്തമായ രൂപകവും വിധിയുടെ ഗൗരവവും നിലനിർത്തുന്നു.
