id: DEU.7.24
reference: Deuteronomy 7:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/נָתַ֤ן מַלְכֵי/הֶם֙ בְּ/יָדֶ֔/ךָ וְ/הַאֲבַדְתָּ֣ אֶת שְׁמָ֔/ם מִ/תַּ֖חַת הַ/שָּׁמָ֑יִם לֹֽא יִתְיַצֵּ֥ב אִישׁ֙ בְּ/פָנֶ֔י/ךָ עַ֥ד הִשְׁמִֽדְ/ךָ֖ אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/024.yaml
  text: And he will give their kings into your hand[a], and you shall make their name perish from under heaven. No man will stand before you until you have destroyed them.
translation:
  language: ml
  text: അവരുടെ രാജാക്കന്മാരെ അവൻ നിന്റെ കൈയിൽ ഏല്പിക്കും; ആകാശത്തിൻ കീഴിൽനിന്ന് അവരുടെ പേര് നീ ഇല്ലാതാക്കും. നീ അവരെ നശിപ്പിച്ചുതീർക്കുന്നതുവരെ ഒരുവനും[a] നിന്റെ മുമ്പിൽ ഉറച്ചുനിൽക്കുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആരും.” ഇവിടെ എബ്രായത്തിലെ “ഒരുവൻ” (אִישׁ) എന്ന പദം പ്രതിനിധിപരമായ ഏകവചനമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: അവൻ ... ഏല്പിക്കും
  rationale: സന്ദർഭത്തിൽ കർത്താവ് യഹോവയാണ്; പ്രവചനാത്മക വാഗ്ദാനത്തിന്റെ തുടർച്ചയായതിനാൽ ഭാവികാലം ഉപയോഗിച്ചു.
- source_word: מַלְכֵיהֶם בְּיָדֶךָ
  choice: അവരുടെ രാജാക്കന്മാരെ ... നിന്റെ കൈയിൽ ഏല്പിക്കും
  rationale: ‘കൈയിൽ കൊടുക്കുക’ എന്ന എബ്രായ പ്രയോഗം അധികാരത്തിന് ഏല്പിക്കുക എന്നർഥം വഹിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി ‘ഏല്പിക്കും’ ഉപയോഗിച്ചും ‘കൈയിൽ’ എന്ന ദൃശ്യരൂപം നിലനിർത്തിയും വിവർത്തനം ചെയ്തു.
- source_word: וְהַאֲבַדְתָּ אֶת שְׁמָם
  choice: അവരുടെ പേര് നീ ഇല്ലാതാക്കും
  rationale: אבד എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലെ കാരണാർഥവും ഏകവചനത്തിലുള്ള ‘പേര്’ എന്ന സമാഹാരപ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: ആകാശത്തിൻ കീഴിൽനിന്ന്
  rationale: മനുഷ്യലോകത്തിൽനിന്നുള്ള സമ്പൂർണ നീക്കത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപകൽപ്പന നിലനിർത്തുന്നു.
- source_word: לֹא יִתְיַצֵּב אִישׁ
  choice: ഒരുവനും ... ഉറച്ചുനിൽക്കുകയില്ല
  rationale: יִתְיַצֵּב എന്നത് എതിർത്ത് നിലയുറപ്പിക്കുക എന്ന സൈനികസന്ദർഭാർഥം നൽകുന്നതിനാൽ ‘ഉറച്ചുനിൽക്കുക’ എന്നു വിവർത്തനം ചെയ്തു; אִישׁ എന്ന പുല്ലിംഗ ഏകവചനം ‘ഒരുവൻ’ ആയി സൂക്ഷിച്ചു.
- source_word: בְּפָנֶיךָ
  choice: നിന്റെ മുമ്പിൽ
  rationale: അക്ഷരാർഥമായ ദൃശ്യരൂപം നിലനിർത്തുമ്പോഴും ഈ സന്ദർഭത്തിൽ ‘നിനക്കെതിരെ’ എന്ന പ്രതിരോധാർഥം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: עַד הִשְׁמִדְךָ אֹתָם
  choice: നീ അവരെ നശിപ്പിച്ചുതീർക്കുന്നതുവരെ
  rationale: עַד തുടർന്നുള്ള ക്രിയാരൂപം പ്രവർത്തിയുടെ അന്തിമപരിധി സൂചിപ്പിക്കുന്നു; שׁמד-ന്റെ സമ്പൂർണ നാശത്തിന്റെ ശക്തി ‘നശിപ്പിച്ചുതീർക്കുക’ എന്നതിലൂടെ നിലനിർത്തി.
theological_decisions:
- issue: אִישׁ എന്ന പുല്ലിംഗ ഏകവചനത്തിന്റെ പ്രതിനിധിപരമായ പ്രയോഗം
  choice: ഒരുവനും നിന്റെ മുമ്പിൽ ഉറച്ചുനിൽക്കുകയില്ല
  alternative: ആരും നിന്റെ മുമ്പിൽ ഉറച്ചുനിൽക്കുകയില്ല
  rationale: മൂലപാഠത്തിലെ പുല്ലിംഗ ഏകവചനരൂപം പ്രധാനപാഠത്തിൽ സൂക്ഷിച്ചു; എന്നാൽ സന്ദർഭത്തിൽ അത് പൊതുവായി ‘ആരും’ എന്ന അർഥമുള്ളതാണെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നിന്റെ കൈയിൽ,’ ‘ആകാശത്തിൻ കീഴിൽ,’ ‘നിന്റെ മുമ്പിൽ’ എന്നീ എബ്രായ ദൃശ്യപ്രയോഗങ്ങൾ നിലനിർത്തി; സൈനികസന്ദർഭത്തിലെ ശക്തി വ്യക്തമാക്കാൻ ‘ഉറച്ചുനിൽക്കുക,’ ‘നശിപ്പിച്ചുതീർക്കുക’ എന്നിവ തിരഞ്ഞെടുത്തു.
