lexical_decisions:
- source_word: וְ/לֹא
  choice: …രുത്
  rationale: വാവ് ഈ കല്പനയെ മുമ്പുള്ള കല്പനകളുടെ നിരയോട് ബന്ധിപ്പിക്കുന്നു. മലയാളത്തിൽ ഓരോ നിരോധനകല്പനയും സ്വാഭാവികമായി സംക്ഷിപ്തമായി അവതരിപ്പിക്കുമ്പോൾ ഈ ബന്ധം പ്രത്യേകമായി ‘കൂടാതെ’ എന്നു ചേർക്കാതെതന്നെ ക്രമത്തിലൂടെ വ്യക്തമാകുന്നു; לֹאയുടെ നിരോധനബലം ‘രുത്’ നിലനിർത്തുന്നു.
- source_word: תִּגְנֹב
  choice: മോഷ്ടിക്കരുത്
  rationale: Qal imperfect രണ്ടാംപുരുഷ ഏകവചനരൂപം ഇവിടെ നിരോധനകല്പനയായി പ്രവർത്തിക്കുന്നു. ക്രിയയ്ക്ക് ചില സന്ദർഭങ്ങളിൽ ഒരാളെ മോഷ്ടിക്കുക, അഥവാ തട്ടിക്കൊണ്ടുപോകുക, എന്ന അർഥമുണ്ടെങ്കിലും ഈ വാക്യം കർമം വ്യക്തമാക്കാതെ പൊതുവായി കല്പിക്കുന്നതിനാൽ ‘മോഷ്ടിക്കുക’ എന്ന വിശാലമായ അർഥം ഉചിതമാണ്.
