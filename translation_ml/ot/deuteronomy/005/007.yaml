source:
  edition: WLC
  text: לֹא יִהְיֶ֥ה לְ/ךָ֛ אֱלֹהִ֥ים אֲחֵרִ֖ים עַל פָּנָֽ/יַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/007.yaml
  text: You shall have no other gods before me[a].
translation:
  language: ml
  text: എന്റെ മുമ്പാകെ നിനക്ക് അന്യദൈവങ്ങൾ ഉണ്ടാകരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എന്നെയല്ലാതെ.’ എബ്രായത്തിൽ അക്ഷരാർഥം ‘എന്റെ മുഖത്തിനു മുമ്പിൽ’ എന്നാണ്; ഈ പ്രയോഗത്തിന് സാന്നിധ്യവും മറ്റുദൈവങ്ങളെ ഒഴിവാക്കുന്ന അർഥവും സൂചിപ്പിക്കാനാകും.
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא
  choice: ഉണ്ടാകരുത്
  rationale: നിരോധനം സൂചിപ്പിക്കുന്ന നിഷേധം; മലയാളത്തിൽ ക്രിയയോടു ചേർന്ന ‘-രുത്’ രൂപം സ്വാഭാവികമായി കല്പനയുടെ നിരോധനശക്തി നൽകുന്നു.
- source_word: יִהְיֶה לְךָ
  choice: നിനക്ക് ... ഉണ്ടാകരുത്
  rationale: ‘നിനക്കായി/നിനക്കു ഉണ്ടായിരിക്കുക’ എന്ന എബ്രായ അസ്തിത്വ-ബന്ധഘടനയെ മലയാളത്തിൽ സ്വാഭാവികമായ ഉടമസ്ഥതാ/ബന്ധപ്രയോഗമായി അവതരിപ്പിക്കുന്നു; ഏകവചന അഭിസംബോധനയും നിലനിർത്തുന്നു.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: അന്യദൈവങ്ങൾ
  rationale: ഇവിടെ ബഹുവചനപദം യഹോവയിൽനിന്നു വ്യത്യസ്തമായ മത്സരദേവതകളെ സൂചിപ്പിക്കുന്നു. ‘അന്യദൈവങ്ങൾ’ നേരിട്ടും പ്രചാരത്തിലുള്ളതുമായ മലയാളപ്രയോഗമാണ്; ‘വിദേശദൈവങ്ങൾ’ എന്നു പറഞ്ഞാൽ മൂലത്തിൽ നിർബന്ധമില്ലാത്ത ദേശീയതാസൂചന വരാം.
- source_word: עַל פָּנָי
  choice: എന്റെ മുമ്പാകെ
  rationale: അക്ഷരാർഥത്തിൽ ‘എന്റെ മുഖത്തിനു മുമ്പിൽ/എന്റെ സന്നിധിയിൽ.’ ‘എന്റെ മുമ്പാകെ’ എന്നത് സാന്നിധ്യത്തിന്റെയും നേരിട്ടുള്ള ബന്ധത്തിന്റെയും അർഥം നിലനിർത്തുന്നു; ‘എന്നെയല്ലാതെ’ എന്ന പ്രത്യേകതാവായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: עַל פָּנָי എന്ന അന്തിമപ്രയോഗത്തിന്റെ അർഥം
  choice: എന്റെ മുമ്പാകെ
  alternative: എന്നെയല്ലാതെ / എന്റെ സന്നിധിയിൽ
  rationale: എബ്രായപ്രയോഗത്തിന് സ്ഥലപരമായ സാന്നിധ്യവും നിരോധനസന്ദർഭത്തിൽ പ്രത്യേകതയും സൂചിപ്പിക്കാനാകും. മുഖ്യപാഠം കൂടുതൽ രൂപസുതാര്യമായ വായന നിലനിർത്തുകയും, സാധുവായ പ്രത്യേകതാവായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ കല്പനാശൈലി. ‘എന്റെ മുമ്പാകെ’ എന്ന പ്രയോഗം മൂലരൂപത്തോടുള്ള സുതാര്യതയും സ്വാഭാവികമായ ബൈബിൾഭാഷാ ഗൗരവവും ഒരുമിച്ചു നിലനിർത്തുന്നു.
