source:
  edition: WLC
  text: וַ/יִּשְׁמַ֤ע יְהוָה֙ אֶת ק֣וֹל דִּבְרֵי/כֶ֔ם בְּ/דַבֶּרְ/כֶ֖ם אֵלָ֑/י וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י שָׁ֠מַעְתִּי אֶת ק֨וֹל דִּבְרֵ֜י הָ/עָ֤ם הַ/זֶּה֙ אֲשֶׁ֣ר דִּבְּר֣וּ אֵלֶ֔י/ךָ הֵיטִ֖יבוּ כָּל אֲשֶׁ֥ר דִּבֵּֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/028.yaml
  text: And Yahweh heard the sound of your words when you spoke to me[a], and Yahweh said to me, “I have heard the sound of the words of this people, which they have spoken to you[b]; they have spoken well in all that they have said.”
translation:
  language: ml
  text: 'നിങ്ങൾ എന്നോടു സംസാരിച്ചപ്പോൾ നിങ്ങളുടെ വാക്കുകളുടെ ശബ്ദം യഹോവ കേട്ടു.[a] യഹോവ എന്നോടു പറഞ്ഞു: “ഈ ജനം നിന്നോടു പറഞ്ഞ വാക്കുകളുടെ ശബ്ദം ഞാൻ കേട്ടിരിക്കുന്നു. അവർ പറഞ്ഞതെല്ലാം നന്നായി പറഞ്ഞിരിക്കുന്നു.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘നിങ്ങളുടെ വാക്കുകളുടെ സ്വരം’; എബ്രായത്തിൽ ഇത് ഒരു ശ്രവണാധിഷ്ഠിത പ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘അവർ പറഞ്ഞതെല്ലാം നന്നായി ചെയ്തിരിക്കുന്നു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ പകരപ്പദം ഉപയോഗിക്കാതെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: וַיִּשְׁמַע / שָׁמַעְתִּי
  choice: കേട്ടു / ഞാൻ കേട്ടിരിക്കുന്നു
  rationale: സംസാരിക്കപ്പെട്ടതു കേൾക്കുക എന്ന സാധാരണ അർഥം നിലനിർത്തുന്നു; നേരിട്ടുള്ള വചനത്തിലെ പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ പ്രസക്തി ‘കേട്ടിരിക്കുന്നു’ എന്നതിലൂടെ വ്യക്തമാകുന്നു.
- source_word: קוֹל דִּבְרֵיכֶם / קוֹל דִּבְרֵי
  choice: നിങ്ങളുടെ വാക്കുകളുടെ ശബ്ദം / വാക്കുകളുടെ ശബ്ദം
  rationale: എബ്രായത്തിലെ ശ്രവണാധിഷ്ഠിത പ്രയോഗം നിലനിർത്തുകയും ‘ശബ്ദം’ എന്ന സ്വാഭാവിക മലയാളപദം ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: בְּדַבֶּרְכֶם אֵלַי
  choice: നിങ്ങൾ എന്നോടു സംസാരിച്ചപ്പോൾ
  rationale: בְּ ചേർന്ന infinitive construct സൂചിപ്പിക്കുന്ന സമകാലിക/കാലസംബന്ധമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הָעָם הַזֶּה
  choice: ഈ ജനം
  rationale: ഏകവചന സമൂഹനാമവും നിർദ്ദേശകപദവും ഔപചാരികവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר דִּבְּרוּ אֵלֶיךָ
  choice: നിന്നോടു പറഞ്ഞ
  rationale: ബന്ധവാക്യം മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുമ്പോഴും സംസാരക്രിയയും അഭിസംബോധിതനായ മോശെയും നിലനിർത്തുന്നു.
- source_word: הֵיטִיבוּ כָּל אֲשֶׁר דִּבֵּרוּ
  choice: അവർ പറഞ്ഞതെല്ലാം നന്നായി പറഞ്ഞിരിക്കുന്നു
  rationale: הֵיטִיבוּ എന്നതിന്റെ ‘നന്നായി ചെയ്തു/ശരിയായി ചെയ്തു’ എന്ന അർഥത്തെ ഉടനെയുള്ള സംസാരസന്ദർഭവുമായി ബന്ധിപ്പിക്കുന്നു; പാഠത്തിലെ സാധ്യതാ ദ്വയാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ
  rationale: പാഠത്തിലുള്ള വ്യക്തിനാമം ‘കർത്താവ്’ എന്ന സ്ഥാനപദമാക്കി മാറ്റാതെ, ആധുനിക മലയാളത്തിൽ വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്ന രൂപത്തിൽ നൽകുന്നു.
- issue: ജനത്തിന്റെ വാക്കുകളെ ദൈവം അംഗീകരിക്കുന്നതിന്റെ സ്വഭാവം
  choice: അവർ പറഞ്ഞതെല്ലാം നന്നായി പറഞ്ഞിരിക്കുന്നു
  alternative: അവർ പറഞ്ഞതെല്ലാം നന്നായി ചെയ്തിരിക്കുന്നു
  rationale: സന്ദർഭം അവരുടെ സംസാരത്തെ വിലയിരുത്തുന്നതിനാൽ പ്രധാനപാഠത്തിൽ സംസാരാധിഷ്ഠിത അർഥം സ്വീകരിക്കുന്നു; എങ്കിലും הֵיטִיבוּ എന്ന ക്രിയയിലെ ‘നന്നായി ചെയ്തു’ എന്ന കൂടുതൽ പൊതുവായ അർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായിക്കാൻ എളുപ്പവുമായ ശൈലി. എബ്രായവാക്യത്തിലെ ആവർത്തനവും ശ്രവണരൂപകവും പരമാവധി നിലനിർത്തിയിട്ടുണ്ട്; നേരിട്ടുള്ള വചനത്തിൽ സ്വാഭാവികമായ മലയാള പദക്രമം ഉപയോഗിച്ചു.
