id: DEU.5.30
reference: Deuteronomy 5:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֵ֖ךְ אֱמֹ֣ר לָ/הֶ֑ם שׁ֥וּבוּ לָ/כֶ֖ם לְ/אָהֳלֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/030.yaml
  text: Go[a], say to them, ‘Return to your tents.’
translation:
  language: ml
  text: 'പോയി അവരോടു പറയുക: ‘നിങ്ങളുടെ കൂടാരങ്ങളിലേക്കു മടങ്ങിപ്പോകുക.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵךְ
  choice: പോയി
  rationale: הלך എന്ന ക്രിയയുടെ ഏകവചന ആജ്ഞാരൂപം. അടുത്ത ആജ്ഞയായ ‘പറയുക’ എന്നതിനോടു ചേർന്ന്, സന്ദേശം അറിയിക്കാനായി പോകാനുള്ള നേരിട്ടുള്ള കല്പനയെ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: אֱמֹר
  choice: പറയുക
  rationale: אמר എന്ന ക്രിയയുടെ ഏകവചന ആജ്ഞാരൂപം; തുടർന്നുവരുന്ന നേരിട്ടുള്ള വാക്കുകളെ പരിചയപ്പെടുത്തുന്നു.
- source_word: לָהֶם
  choice: അവരോടു
  rationale: לְ എന്ന ഉപസർഗവും മൂന്നാം പുരുഷ ബഹുവചന പ്രത്യയവും ചേർന്ന് സംസാരത്തിന്റെ പരോക്ഷ കർമത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘അവരോടു’ സ്വാഭാവികമാണ്.
- source_word: שׁוּבוּ
  choice: മടങ്ങിപ്പോകുക
  rationale: שוב എന്ന ക്രിയയുടെ ബഹുവചന ആജ്ഞാരൂപം. ജനങ്ങൾ മുമ്പുണ്ടായിരുന്ന താമസസ്ഥലത്തേക്കു തിരികെ പോകുന്നതാണ് സന്ദർഭം; ‘മടങ്ങിപ്പോകുക’ ദിശയും മടങ്ങിവരവിന്റെ ആശയവും വ്യക്തമായി നൽകുന്നു.
- source_word: לָכֶם
  choice: നിങ്ങളുടെ
  rationale: രണ്ടാം പുരുഷ ബഹുവചന പ്രത്യയമുള്ള ഉപസർഗം സ്വന്തം ഇടത്തേക്കുള്ള മടക്കത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ കൂടാരങ്ങളോടു ചേർന്ന ‘നിങ്ങളുടെ’ എന്ന ഉടമസ്ഥരൂപം ഈ പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לְאָהֳלֵיכֶם
  choice: കൂടാരങ്ങളിലേക്കു
  rationale: പദശഃ ‘നിങ്ങളുടെ കൂടാരങ്ങളിലേക്കു.’ മരുഭൂമിയിലെ യിസ്രായേലിന്റെ ചരിത്രപരമായ പശ്ചാത്തലം നിലനിർത്താൻ ‘വീടുകളിലേക്ക്’ എന്നതിനു പകരം ‘കൂടാരങ്ങളിലേക്കു’ സ്വീകരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആജ്ഞാശൈലി. ഹീബ്രുവിലെ തുടർച്ചയായ രണ്ടു ആജ്ഞകൾ സ്വാഭാവിക മലയാളവാക്യമായി ചേർത്തു. ഇംഗ്ലീഷ് കുറിപ്പിലെ ‘Go back to your tents’ എന്ന സാധ്യത ഹീബ്രുവിലെ ആദ്യത്തെ לֵךְ-നെയും പിന്നീടുള്ള שׁוּבוּ-നെയും ഒരൊറ്റ പ്രയോഗമായി ചേർക്കാൻ ഇടയാക്കുന്നു; എന്നാൽ മൂലപാഠത്തിലെ രണ്ടു വ്യത്യസ്ത ആജ്ഞകൾ വ്യക്തമായി നിലനിർത്തിയതിനാൽ പ്രത്യേക പാദക്കുറിപ്പ് ആവശ്യമില്ല.
