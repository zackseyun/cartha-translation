  yaml_path: translation/ot/deuteronomy/005/010.yaml
  text: but showing steadfast love to thousands[a], to those who love me and keep my commandments.
translation:
  language: ml
  text: എന്നാൽ ആയിരങ്ങൾക്കും എന്നെ സ്നേഹിക്കുകയും അവന്റെ കല്പനകൾ പാലിക്കുകയും ചെയ്യുന്നവർക്കും അചഞ്ചലമായ സ്നേഹം കാണിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളും പരിഭാഷകളും ‘എന്റെ കല്പനകൾ’ എന്നു വായിക്കുന്നു; ചുറ്റുമുള്ള ഒന്നാംപുരുഷ വചനത്തോട് അതാണ് യോജിക്കുന്നത്. ഇവിടെ നൽകിയിരിക്കുന്ന എബ്രായപാഠം ‘അവന്റെ കല്പനകൾ’ എന്നാണ് വായിക്കുന്നത്.
    reason: textual_variant
lexical_decisions:
- source_word: וְעֹשֶׂה
  choice: എന്നാൽ ... കാണിക്കുന്നു
  rationale: മുൻവാക്യത്തിലെ ശിക്ഷയോടുള്ള വൈരുധ്യം സന്ദർഭത്തിൽ വ്യക്തമാക്കാൻ וְ എന്ന ബന്ധകത്തെ ‘എന്നാൽ’ എന്നു നൽകി; കർത്തൃവാചകമായ participle-ന്റെ തുടരുന്ന പ്രവർത്തനഭാവം ‘കാണിക്കുന്നു’ സംരക്ഷിക്കുന്നു.
- source_word: חֶסֶד
  choice: അചഞ്ചലസ്നേഹം
  rationale: חֶסֶד സൂചിപ്പിക്കുന്ന ഉറച്ച സ്നേഹവും വിശ്വസ്തതയും സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ രീതിയിൽ നൽകുന്നു; വെറും വികാരമോ കരുണയോ ആയി അർഥം ചുരുക്കുന്നില്ല.
- source_word: לַאֲלָפִים
  choice: ആയിരങ്ങളോട്
  rationale: എബ്രായത്തിൽ ‘തലമുറകൾ’ എന്ന നാമം ഇല്ലാത്തതിനാൽ അത് ചേർക്കാതെ, ബഹുവചനമായ ‘ആയിരങ്ങൾ’ അതേ തുറന്ന നിലയിൽ നിലനിർത്തുന്നു.
- source_word: לְאֹהֲבַי
  choice: എന്നെ സ്നേഹിക്കുകയും
  rationale: ഒന്നാംപുരുഷ പ്രത്യയമുള്ള participle സ്വാഭാവിക മലയാളത്തിൽ ബന്ധവാക്യമായി നൽകി, തുടരുന്ന ബന്ധപരമായ പ്രവൃത്തിഭാവം സംരക്ഷിക്കുന്നു.
- source_word: וּלְשֹׁמְרֵי
  choice: പാലിക്കുകയും ചെയ്യുന്ന
  rationale: שמר എന്നതിന്റെ ‘കാത്തുസൂക്ഷിക്കുക/ആചരിക്കുക’ എന്ന അർഥം കല്പനകളോടൊപ്പം മലയാളത്തിൽ സ്വാഭാവികമായി ‘പാലിക്കുക’ എന്നു പ്രകടമാകുന്നു.
- source_word: מצות/ו
  choice: അവന്റെ കല്പനകൾ
  rationale: നൽകിയിരിക്കുന്ന എബ്രായരൂപത്തിലെ മൂന്നാംപുരുഷ ഏകവചന പുരുഷലിംഗ പ്രത്യയം അതേപടി പരിഭാഷപ്പെടുത്തി; സന്ദർഭത്തിനനുസരിച്ച് പ്രതീക്ഷിക്കാവുന്ന ഒന്നാംപുരുഷ രൂപത്തിലേക്ക് നിശ്ശബ്ദമായി ഒത്തുചേർത്തിട്ടില്ല.
theological_decisions:
- issue: ‘കല്പനകൾ’ എന്ന പദത്തോടു ചേർന്ന സർവനാമം
  choice: അവന്റെ കല്പനകൾ
  alternative: എന്റെ കല്പനകൾ
  rationale: നൽകിയ WLC പാഠത്തിലെ מצות/ו എന്ന രൂപം ‘അവന്റെ കല്പനകൾ’ എന്നാണ്. ചുറ്റുമുള്ള ഒന്നാംപുരുഷ ദൈവവചനത്തോട് ‘എന്റെ കല്പനകൾ’ കൂടുതൽ യോജിക്കുന്നതിനാൽ ആ പ്രധാന പാഠവ്യത്യാസം അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു; മുഖ്യപാഠം നൽകിയ എബ്രായരൂപത്തെ പിന്തുടരുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ആയിരങ്ങളോട്’ എന്നത് എബ്രായത്തിലെ തുറന്ന ബഹുവചനത്തെ നിലനിർത്തുന്നു; ‘തലമുറകൾ’ എന്ന വിശദീകരണം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല. [a] മുഖ്യപാഠത്തിൽ നിർബന്ധമായി ചേർത്തിരിക്കുന്നു.
