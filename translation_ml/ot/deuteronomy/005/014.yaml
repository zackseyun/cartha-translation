source:
  edition: WLC
  text: וְ/י֨וֹם֙ הַ/שְּׁבִיעִ֔י שַׁבָּ֖ת לַ/יהוָ֣ה אֱלֹהֶ֑י/ךָ לֹ֣א תַעֲשֶׂ֣ה כָל מְלָאכָ֡ה אַתָּ֣ה וּ/בִנְ/ךָֽ וּ/בִתֶּ֣/ךָ וְ/עַבְדְּ/ךָֽ וַ֠/אֲמָתֶ/ךָ וְ/שׁוֹרְ/ךָ֨ וַ/חֲמֹֽרְ/ךָ֜ וְ/כָל בְּהֶמְתֶּ֗/ךָ וְ/גֵֽרְ/ךָ֙ אֲשֶׁ֣ר בִּ/שְׁעָרֶ֔י/ךָ לְמַ֗עַן יָנ֛וּחַ עַבְדְּ/ךָ֥ וַ/אֲמָתְ/ךָ֖ כָּמֽוֹ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/014.yaml
  text: But the seventh day is a Sabbath to Yahweh your God[a]. You shall not do any work—you, or your son, or your daughter, or your male servant, or your female servant, or your ox, or your donkey, or any of your livestock[b], or the sojourner who is within your gates—so that your male servant and your female servant may rest as you do.
translation:
  language: ml
  text: എന്നാൽ ഏഴാം ദിവസം നിന്റെ ദൈവമായ യഹ്‌വെക്കുള്ള ശബ്ബത്താണ്. നീ യാതൊരു വേലയും ചെയ്യരുത്—നീയോ നിന്റെ മകനോ മകളോ നിന്റെ പുരുഷ അടിമയോ സ്ത്രീ അടിമയോ കാളയോ കഴുതയോ നിന്റെ മറ്റേതെങ്കിലും കന്നുകാലിയോ നിന്റെ കവാടങ്ങൾക്കുള്ളിൽ[b] താമസിക്കുന്ന പരദേശിയോ[a] വേല ചെയ്യരുത്—നിന്റെ പുരുഷ അടിമയും സ്ത്രീ അടിമയും നിന്നെപ്പോലെ വിശ്രമിക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പരദേശി’ എന്നത് ഇവിടെ വെറും യാത്രക്കാരനെയല്ല, സമൂഹത്തിനുള്ളിൽ താമസിക്കുന്ന സ്വദേശിയല്ലാത്ത വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘നിന്റെ കവാടങ്ങൾക്കുള്ളിൽ’; ഒരാളുടെ പട്ടണത്തിലോ സമൂഹപരിധിക്കുള്ളിലോ താമസിക്കുന്നവരെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണിത്.
    reason: cultural_note
lexical_decisions:
- source_word: שַׁבָּת
  choice: ശബ്ബത്ത്
  rationale: ഒരു പൊതുവായ ‘വിശ്രമദിവസം’ എന്നതിലുപരി, നിയമബന്ധത്തിൽ സ്ഥാപിതമായ വിശുദ്ധദിവസത്തിന്റെ പ്രത്യേക നാമം നിലനിർത്തുന്നു.
- source_word: לַיהוָה / יְהוָה
  choice: യഹ്‌വെയ്ക്കുള്ള / യഹ്‌വെ
  rationale: לְ എന്ന ഉപസർഗത്തിന്റെ സമർപ്പണം/ബന്ധം എന്ന ആശയം ‘യ്ക്കുള്ള’ എന്നു നൽകുകയും ദൈവനാമം മലയാളത്തിൽ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്തു.
- source_word: מְלָאכָה
  choice: വേല
  rationale: ശബ്ബത്ത് നിയമത്തിൽ നിരോധിക്കപ്പെടുന്ന പ്രവർത്തനങ്ങളുടെ വിശാല വിഭാഗം അതിയായി നിർവചിക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: עַבְדְּךָ / אֲמָתֶךָ
  choice: നിന്റെ പുരുഷ അടിമ / സ്ത്രീ അടിമ
  rationale: മൂലപാഠം ലിംഗവ്യത്യാസത്തോടെ പറയുന്ന ബന്ധിത ഗൃഹാംഗങ്ങളുടെ അടിമസ്ഥിതി മറച്ചുവയ്ക്കാതെ വ്യക്തമാക്കുന്നു.
- source_word: שׁוֹר / חֲמוֹר
  choice: കാള / കഴുത
  rationale: നിയമപരമായ ഈ ഗൃഹമൃഗപ്പട്ടികയ്ക്ക് കൃത്യവും സാധാരണവുമായ മലയാള പദങ്ങൾ.
- source_word: בְּהֵמָה
  choice: കന്നുകാലികൾ
  rationale: സന്ദർഭത്തിൽ വീട്ടുടമസ്ഥതയിലുള്ള വളർത്തുമൃഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; പൊതുവായ ‘മൃഗങ്ങൾ’ എന്നതിനെക്കാൾ കൃത്യം.
- source_word: גֵּר
  choice: പരദേശി
  rationale: ഇസ്രായേൽ സമൂഹത്തിനുള്ളിൽ താമസിക്കുന്ന സ്വദേശിയല്ലാത്ത വ്യക്തിയെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗതവും മനസ്സിലാകുന്നതുമായ മലയാള പദം; താമസസ്ഥിതി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: בִּשְׁעָרֶיךָ
  choice: നിന്റെ കവാടങ്ങൾക്കുള്ളിൽ
  rationale: നഗരത്തിലോ സമൂഹപരിധിക്കുള്ളിലോ താമസിക്കുക എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യരൂപവും നിയമപരമായ പ്രാദേശിക ഭാവവും നിലനിർത്തുന്നു.
- source_word: לְמַעַן יָנוּחַ
  choice: വിശ്രമിക്കേണ്ടതിനാണിത്
  rationale: ലക്ഷ്യം സൂചിപ്പിക്കുന്ന ഘടന സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള നിയമബന്ധനാമം ഒരു ബിരുദപ്പേരാക്കി മാറ്റാതെ നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: עבד/אמה സൂചിപ്പിക്കുന്ന സാമൂഹിക സ്ഥിതി
  choice: പുരുഷ അടിമ / സ്ത്രീ അടിമ
  alternative: ദാസൻ / ദാസി; വേലക്കാരൻ / വേലക്കാരി
  rationale: ഈ നിയമം അടിമസ്ഥിതിയിലുള്ള ഗൃഹാംഗങ്ങൾക്കും ശബ്ബത്ത് വിശ്രമം ഉറപ്പാക്കുന്നു; അതിനാൽ അവരുടെ ബന്ധിത സ്ഥിതി മൃദൂകരിക്കാതെ, മൂലപാഠത്തിലെ ലിംഗവ്യത്യാസവും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. കല്പനയുടെ പട്ടിക വായനാസൗകര്യത്തിനായി ദീർഘവിരാമങ്ങൾക്കിടയിൽ നൽകിയിരിക്കുന്നു. അടിമസ്ഥിതിയും ദൈവനാമവും മൃദൂകരിക്കാതെ മൂലപാഠത്തിന്റെ സാമൂഹികവും നിയമബന്ധപരവുമായ ഭാരം നിലനിർത്തിയിരിക്കുന്നു.
