source:
  edition: WLC
  text: כִּ֣י מִ֣י כָל בָּשָׂ֡ר אֲשֶׁ֣ר שָׁמַ֣ע קוֹל֩ אֱלֹהִ֨ים חַיִּ֜ים מְדַבֵּ֧ר מִ/תּוֹךְ הָ/אֵ֛שׁ כָּמֹ֖/נוּ וַ/יֶּֽחִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/026.yaml
  text: For who of all flesh has heard the voice of the living God speaking from the midst of the fire[a], as we have, and lived?
translation:
  language: ml
  text: എന്തെന്നാൽ, തീയുടെ നടുവിൽനിന്ന് സംസാരിക്കുന്ന ജീവനുള്ള ദൈവത്തിന്റെ ശബ്ദം നമ്മെപ്പോലെ കേട്ടു ജീവിച്ചിട്ടുള്ളവൻ സകല ജഡത്തിലും[a] ആരുണ്ട്?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സകല ജഡം” എന്നത് മർത്യരായ മനുഷ്യരെയെല്ലാം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: എന്തെന്നാൽ
  rationale: മുൻസന്ദർഭത്തിലെ ജനത്തിന്റെ ഭയത്തിനും അപേക്ഷയ്ക്കും കാരണം അവതരിപ്പിക്കുന്ന ബന്ധകമായി പരിഭാഷപ്പെടുത്തി.
- source_word: כָל בָּשָׂר
  choice: സകല ജഡത്തിലും
  rationale: മനുഷ്യരാശിയെയും അതിന്റെ മർത്യമായ സൃഷ്ടസ്വഭാവത്തെയും സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപകഭാവം നിലനിർത്തുന്നു; അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: קוֹל
  choice: ശബ്ദം
  rationale: സംസാരിക്കുന്ന ദൈവത്തിന്റെ കേൾക്കാവുന്ന ശബ്ദത്തെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
- source_word: אֱלֹהִים חַיִּים
  choice: ജീവനുള്ള ദൈവം
  rationale: രൂപപരമായി ബഹുവചനഘടകങ്ങളുള്ള എബ്രായ വിശേഷണം സന്ദർഭത്തിൽ യിസ്രായേലിന്റെ ഏകദൈവത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരപ്രയോഗമാണ്.
- source_word: מְדַבֵּר מִתּוֹךְ הָאֵשׁ
  choice: തീയുടെ നടുവിൽനിന്നു സംസാരിക്കുന്ന
  rationale: സംസാരം തീയ്ക്കുള്ളിൽനിന്നാണ് വരുന്നതെന്ന എബ്രായ ദൃശ്യഭാവം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: כָמֹנוּ
  choice: നമ്മെപ്പോലെ
  rationale: യിസ്രായേലിന്റെ സ്വന്തം അനുഭവത്തോടുള്ള താരതമ്യം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: וַיֶּחִי
  choice: എന്നിട്ടും ജീവനോടെയിരിക്കുകയും ചെയ്ത
  rationale: അക്ഷരാർഥമായ ‘ജീവിച്ചു’ എന്ന ആശയം നിലനിർത്തിക്കൊണ്ട്, ദൈവശബ്ദം കേട്ടശേഷവും മരിക്കാതിരുന്നതിലെ വിസ്മയകരമായ വൈരുധ്യം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: כָל בָּשָׂר എന്ന മനുഷ്യശാസ്ത്രപരമായ പ്രയോഗം
  choice: സകല ജഡത്തിലും
  alternative: ഏതെങ്കിലും മനുഷ്യരിൽ
  rationale: പ്രയോഗത്തെ വെറും ‘മനുഷ്യൻ’ എന്നു സമതലപ്പെടുത്താതെ, ജീവനുള്ള ദൈവത്തിന്റെ മുമ്പിലുള്ള മനുഷ്യന്റെ മർത്യവും സൃഷ്ടവുമായ നിലയെ സൂചിപ്പിക്കുന്ന ഉറവിടഭാഷയുടെ രൂപകഭാവം സംരക്ഷിക്കുന്നു.
- issue: אֱלֹהִים חַיִּים എന്നതിന്റെ വചനവും അർഥവും
  choice: ജീവനുള്ള ദൈവം
  alternative: ജീവനുള്ള ദൈവങ്ങൾ
  rationale: ബഹുവചനരൂപമുണ്ടെങ്കിലും ഉടൻസന്ദർഭത്തിലും എബ്രായ പ്രയോഗത്തിലും ഇത് യിസ്രായേലിന്റെ ഏകദൈവത്തെ സൂചിപ്പിക്കുന്ന ഏകവചന ബിരുദമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും വായനാസൗകര്യമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘സകല ജഡം’ എന്ന അപരിചിതമാകാവുന്ന ഉറവിടഭാഷാപ്രയോഗം ദൈവസന്നിധിയിലെ മനുഷ്യന്റെ മർത്യസ്വഭാവം നിലനിർത്തുന്നതിനായി സൂക്ഷിക്കുകയും അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുകയും ചെയ്തു.
