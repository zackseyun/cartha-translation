base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/015.yaml
  text: And remember that you were a servant in the land of Egypt[a], and Yahweh your God brought you out from there with a strong hand and an outstretched arm[b]; therefore Yahweh your God commanded you to observe the Sabbath day.
translation:
  language: ml
  text: നീ ഈജിപ്ത് ദേശത്ത് അടിമയായിരുന്നുവെന്നും, നിന്റെ ദൈവമായ യഹ്‌വെ ബലമുള്ള കൈകൊണ്ടും[a] നീട്ടിയ ഭുജംകൊണ്ടും നിന്നെ അവിടെനിന്ന് പുറത്തുകൊണ്ടുവന്നുവെന്നും ഓർക്കുക. അതുകൊണ്ട്, ശബ്ബത്ത് ദിവസം ആചരിക്കാൻ നിന്റെ ദൈവമായ യഹ്‌വെ നിന്നോടു കല്പിച്ചു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ശക്തമായ കൈകൊണ്ട്’ എന്നും പരിഭാഷപ്പെടുത്താം. ദൈവം തന്റെ ശക്തിയാൽ വിടുവിച്ചതിനെയാണ് ഈ എബ്രായ പ്രയോഗം ഊന്നിപ്പറയുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘ശബ്ബത്ത് ദിവസം ചെയ്യാൻ’; ഇവിടെ അതിന്റെ അർഥം ശബ്ബത്ത് ദിവസം ആചരിക്കുകയോ പാലിക്കുകയോ ചെയ്യുക എന്നാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: ഓർക്കുക
  rationale: കല്പനാസന്ദർഭത്തിലെ ആഹ്വാനസ്വഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; മുൻവാക്യങ്ങളോടുള്ള ബന്ധം വാക്യക്രമത്തിലൂടെ നിലനിൽക്കുന്നു.
- source_word: עֶבֶד
  choice: അടിമ
  rationale: ഈജിപ്‌തിലെ നിർബന്ധിതവും ബന്ധിതവുമായ അവസ്ഥയുടെ ഗൗരവം ‘ദാസൻ’ എന്നതിനെക്കാൾ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: ഈജിപ്‌ത്‌ദേശത്ത്
  rationale: ‘ഈജിപ്‌ത് ദേശത്തിൽ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യത നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: וַיֹּצִאֲךָ
  choice: നിന്നെ അവിടെനിന്ന് പുറപ്പെടുവിച്ചു
  rationale: ഹിഫീൽ രൂപത്തിലെ കാരണാർഥവും പുറപ്പാടിന്റെ വിടുതൽസന്ദർഭവും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ചതുർക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളലിപിയിൽ പ്രതിനിധീകരിക്കുന്നു.
- source_word: בְּיָד חֲזָקָה
  choice: ബലമുള്ള കൈകൊണ്ട്
  rationale: חֲזָקָה എന്നതിന്റെ അടിസ്ഥാനാർഥം നിലനിർത്തുകയും ദൈവത്തിന്റെ ശക്തമായ വിടുതൽപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലി സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: וּבִזְרֹעַ נְטוּיָה
  choice: നീട്ടിയ ഭുജംകൊണ്ട്
  rationale: പ്രകടമായ ദൈവിക ശക്തിയെ സൂചിപ്പിക്കുന്ന ഉറവിടരൂപകം അതേപടി നിലനിർത്തുന്നു.
- source_word: עַל כֵּן
  choice: അതുകൊണ്ടാണ്
  rationale: വിടുതലും ശബ്ബത്ത് കല്പനയും തമ്മിലുള്ള നിഗമനബന്ധം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לַעֲשׂוֹת אֶת יוֹם הַשַׁבָּת
  choice: ശബ്ബത്തുദിവസം ആചരിക്കാൻ
  rationale: അക്ഷരാർഥമായ ‘ശബ്ബത്തുദിവസം ചെയ്യുക’ എന്ന എബ്രായ ശൈലിയുടെ സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമം മറയ്ക്കാതെ, സാധാരണയായി പുനർനിർമിക്കപ്പെടുന്ന ഉച്ചാരണത്തെ മലയാളത്തിൽ നൽകുന്നു.
- issue: עֶבֶד എന്ന പദം ഈജിപ്‌തിലെ ഇസ്രായേലിന്റെ അവസ്ഥയിൽ
  choice: അടിമ
  alternative: ദാസൻ
  rationale: ശബ്ബത്തിനെക്കുറിച്ചുള്ള കല്പനയ്ക്ക് അടിസ്ഥാനമായ അടിമത്തത്തിന്റെയും മോചനത്തിന്റെയും ദൈവശാസ്ത്രപരമായ ഭാരം വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- issue: ശബ്ബത്തുദിവസം ‘ചെയ്യുക’ എന്ന ഉറവിടശൈലി
  choice: ആചരിക്കുക
  alternative: പാലിക്കുക; അക്ഷരാർഥമായി ‘ചെയ്യുക’
  rationale: לַעֲשׂוֹת എന്നതിന്റെ അസാധാരണമായ അക്ഷരരൂപം അടിക്കുറിപ്പിൽ അറിയിച്ചുകൊണ്ട്, പ്രധാനപാഠത്തിൽ ഉദ്ദേശിച്ച അനുസരണത്തെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക സാധാരണ മലയാളത്തിൽ വായിക്കാവുന്നതും അതേസമയം തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ളതുമായ ശൈലി. ഏകവചന രണ്ടാംപുരുഷരൂപങ്ങൾ മൂലപാഠത്തിലെ ഇസ്രായേലിനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധന സംരക്ഷിക്കുന്നു.
