revisions:
- from: അവയുടെ മുമ്പിൽ കുമ്പിടുകയോ അവയെ സേവിക്കുകയോ അരുത്[a]. കാരണം, നിന്റെ ദൈവമായ യഹോവയായ ഞാൻ അസൂയയുള്ള ദൈവമാണ്; എന്നെ വെറുക്കുന്നവരുടെ ഇടയിൽ പിതാക്കന്മാരുടെ അകൃത്യത്തിന് മക്കളോട് മൂന്നാമത്തെയും നാലാമത്തെയും തലമുറവരെ[c] കണക്കു ചോദിക്കുന്നവനാണ്[b].
  to: അവയുടെ മുമ്പിൽ കുമ്പിടുകയോ അവയെ സേവിക്കുകയോ അരുത്[a]. കാരണം, നിന്റെ ദൈവമായ യാഹ്‌വേയായ ഞാൻ അസൂയയുള്ള ദൈവമാണ്; എന്നെ വെറുക്കുന്നവരുടെ കാര്യത്തിൽ, പിതാക്കന്മാരുടെ അകൃത്യം മക്കളുടെമേലും മൂന്നാമത്തെയും നാലാമത്തെയും തലമുറകളുടെമേലും കണക്കാക്കുന്നവനാണ്[b][c].
  rationale: The correction makes the judicial object and the persons upon whom it is reckoned explicit in idiomatic Malayalam, retains the source’s repeated preposition, and expresses the final ‘those who hate me’ phrase as a scope-setting phrase without imposing a contested theological account of intergenerational judgment. Footnote anchors are placed beside their respective expressions, and the supplied-word note now agrees with the plural wording in the translation.
