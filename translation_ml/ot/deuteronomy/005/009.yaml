  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹא תִשְׁתַּחֲוֶ֥ה לָ/הֶ֖ם וְ/לֹ֣א תָעָבְדֵ֑/ם כִּ֣י אָנֹכִ֞י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֵ֣ל קַנָּ֔א פֹּ֠קֵד עֲוֺ֨ן אָב֧וֹת עַל בָּנִ֛ים וְ/עַל שִׁלֵּשִׁ֥ים וְ/עַל רִבֵּעִ֖ים לְ/שֹׂנְאָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/009.yaml
  text: You shall not bow down to them or serve them[a], for I, Yahweh your God, am a jealous God, visiting the iniquity of fathers on children, and on the third and on the fourth generations of those who hate me[c][b],
translation:
  language: ml
  text: അവയുടെ മുമ്പിൽ കുമ്പിടുകയോ അവയെ സേവിക്കുകയോ അരുത്[a]. കാരണം, നിന്റെ ദൈവമായ യാഹ്‌വേയായ ഞാൻ അസൂയയുള്ള ദൈവമാണ്; എന്നെ വെറുക്കുന്നവരുടെ കാര്യത്തിൽ, പിതാക്കന്മാരുടെ അകൃത്യം മക്കളുടെമേലും മൂന്നാമത്തെയും നാലാമത്തെയും തലമുറകളുടെമേലും കണക്കാക്കുന്നവനാണ്[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവയുടെ മുമ്പിൽ സാഷ്ടാംഗം വീഴുകയോ.’ എബ്രായക്രിയ ആദരവോടെ കുനിയുകയോ നിലംപതിക്കുകയോ ചെയ്യുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ശിക്ഷിക്കുന്നവൻ’ അല്ലെങ്കിൽ ‘ഉത്തരവാദിത്വം ചുമത്തുന്നവൻ.’ എബ്രായത്തിൽ അക്ഷരാർഥം ‘സന്ദർശിക്കുന്നവൻ’ എന്നാണ്; ഇവിടെ അത് കണക്കെടുപ്പും ശിക്ഷയും ഉൾക്കൊള്ളാവുന്ന നീതിന്യായപ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥം, ‘മൂന്നാമത്തെയും നാലാമത്തെയും’; ‘തലമുറകൾ’ എന്ന പദം വ്യക്തതയ്ക്കായി ചേർത്തിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׁתַּחֲוֶה
  choice: മുമ്പിൽ കുമ്പിടുക
  rationale: ആദരവോ ആരാധനയോ പ്രകടിപ്പിച്ച് ശാരീരികമായി കുനിയുക എന്ന മൂർത്തമായ പ്രവൃത്തിയെ ഇത് നിലനിർത്തുന്നു; തുടർന്നുള്ള ‘സേവിക്കുക’ എന്ന ക്രിയയുമായി ലയിപ്പിക്കുന്നില്ല.
- source_word: תָעָבְדֵם
  choice: അവയെ സേവിക്കുക
  rationale: വിഗ്രഹങ്ങൾക്കോ ദേവന്മാർക്കോ ആരാധനാപരമായ സേവനം അർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആദ്യ ക്രിയയിൽനിന്നുള്ള പദവ്യത്യാസം സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: എബ്രായ ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണരൂപത്തിൽ നൽകുന്നു.
- source_word: אֵל קַנָּא
  choice: അസൂയയുള്ള ദൈവം
  rationale: ഉടമ്പടിബന്ധത്തിൽ മറ്റാർക്കും പങ്കിടാനാവാത്ത ആരാധന ദൈവം അവകാശപ്പെടുന്നതും എതിരാളി ആരാധന സഹിക്കാത്തതും ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു; മനുഷ്യരുടെ ദോഷകരമായ അസൂയയുമായി ഇത് തുല്യമല്ല.
- source_word: פֹּקֵד
  choice: കണക്കു ചോദിക്കുന്നവൻ
  rationale: നീതിന്യായപരമായി ശ്രദ്ധയിൽപ്പെടുത്തി ഉത്തരവാദിത്വം ചുമത്തുക എന്ന അർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ശിക്ഷിക്കുക എന്നു മാത്രം പറഞ്ഞ് അർത്ഥവ്യാപ്തി ചുരുക്കുന്നില്ല.
- source_word: עֲוֺן
  choice: അകൃത്യം
  rationale: തെറ്റായ പ്രവൃത്തിയുടെയും അതിൽനിന്നുള്ള കുറ്റബാധ്യതയുടെയും ധാർമിക ഗൗരവം സൂക്ഷിക്കുന്നു.
- source_word: אָבוֹת
  choice: പിതാക്കന്മാർ
  rationale: എബ്രായത്തിലെ വ്യക്തമായ പുല്ലിംഗ ബഹുവചനം നിലനിർത്തുന്നു.
- source_word: עַל בָּנִים
  choice: മക്കളോട്
  rationale: തലമുറാസന്ദർഭത്തിൽ בנים സന്തതികളെ ഉൾക്കൊള്ളുന്നതിനാൽ സ്വാഭാവികവും ഉൾക്കൊള്ളുന്നതുമായ മലയാളപ്രയോഗമാണിത്.
- source_word: שִׁלֵּשִׁים וְעַל רִבֵּעִים
  choice: മൂന്നാമത്തെയും നാലാമത്തെയും തലമുറവരെ
  rationale: എബ്രായം അക്ഷരാർഥത്തിൽ ‘മൂന്നാമത്തിലും നാലാമത്തിലും’ എന്നാണ്; മലയാളത്തിലെ വ്യക്തതയ്ക്കായി ‘തലമുറ’ ചേർത്ത്, വ്യാപ്തി സൂചിപ്പിക്കാൻ ‘വരെ’ ഉപയോഗിക്കുന്നു.
- source_word: לְשֹׂנְאָי
  choice: എന്നെ വെറുക്കുന്നവരുടെ ഇടയിൽ
  rationale: അവസാന എബ്രായപ്രയോഗത്തിന്റെ ന്യായവിധിസംബന്ധിയായ പരിധി വ്യക്തമാക്കുന്നു; അതേ സമയം സന്തതികളുടെ വ്യക്തിപരമായ നിലപാടിനെക്കുറിച്ച് മൂലവാക്യം പറയുന്നതിലധികം നിർണ്ണയിക്കുന്നില്ല.
theological_decisions:
- issue: ദൈവത്തിന്റെ קַנָּא എന്ന ഗുണം എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: അസൂയയുള്ള ദൈവം
  alternative: തീക്ഷ്ണതയുള്ള ദൈവം
  rationale: സന്ദർഭം അനന്യമായ ഉടമ്പടി ആരാധനയെക്കുറിച്ചാണ്. ‘അസൂയയുള്ള’ എന്നത് ദൈവത്തിന്റെ അനന്യാവകാശവും എതിരാളി ആരാധനയോടുള്ള അസഹിഷ്ണുതയും നിലനിർത്തുന്നു; ‘തീക്ഷ്ണതയുള്ള’ എന്നത് ബന്ധപരമായ ഈ ശക്തി മങ്ങിച്ചേക്കാം.
- issue: പൂർവികരുടെ അകൃത്യം സന്തതികളിൽ യാന്ത്രികമായി ശിക്ഷിക്കപ്പെടുന്നു എന്നു വാക്യം പഠിപ്പിക്കുന്നുണ്ടോ
  choice: ‘എന്നെ വെറുക്കുന്നവരുടെ ഇടയിൽ’ എന്ന പരിധി നിലനിർത്തി, തലമുറകളിലെ ധാർമിക തുടർച്ചയെക്കുറിച്ചുള്ള വാക്യത്തിന്റെ സംഘർഷം തുറന്നുവെക്കുന്നു.
  alternative: സന്തതികളുടെ സ്വന്തം നിലപാടുമായി ബന്ധമില്ലാതെ പൂർവികരുടെ പാപത്തിന് അവർ ശിക്ഷിക്കപ്പെടുന്നു എന്നു വ്യക്തമാക്കുക.
  rationale: לְשֹׂנְאָי വാക്യത്തിന്റെ അവസാനം ന്യായവിധിവിവരണത്തെ പരിമിതപ്പെടുത്തുന്നു; എന്നാൽ അത് കൃത്യമായി ഏതു ഘടകത്തെ വ്യാകരണപരമായി വിശേഷിപ്പിക്കുന്നു എന്നത് വിവർത്തനത്തിൽ അതിരുകടന്ന് തീർപ്പാക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘കുമ്പിടുക/സേവിക്കുക’ എന്നീ വ്യത്യസ്ത ക്രിയകൾ നിലനിർത്തി. ‘സന്ദർശിക്കുക’ എന്ന അക്ഷരാനുവാദം മലയാളത്തിൽ സൗഹൃദസന്ദർശനമായി തെറ്റിദ്ധരിക്കാവുന്നതിനാൽ മുഖ്യവാചകത്തിൽ ‘കണക്കു ചോദിക്കുക’ ഉപയോഗിച്ച് അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
