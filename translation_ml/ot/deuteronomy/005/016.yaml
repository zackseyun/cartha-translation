  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כַּבֵּ֤ד אֶת אָבִ֨י/ךָ֙ וְ/אֶת אִמֶּ֔/ךָ כַּ/אֲשֶׁ֥ר צִוְּ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ לְמַ֣עַן יַאֲרִיכֻ֣/ן יָמֶ֗י/ךָ וּ/לְמַ֨עַן֙ יִ֣יטַב לָ֔/ךְ עַ֚ל הָֽ/אֲדָמָ֔ה אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֥ן לָֽ/ךְ־־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/016.yaml
  text: Honor your father and your mother[a], as Yahweh your God commanded you[b], so that your days may be long and so that it may go well for you on the land that Yahweh your God is giving you.
translation:
  language: ml
  text: നിന്റെ പിതാവിനെയും നിന്റെ മാതാവിനെയും ബഹുമാനിക്കുക; നിന്റെ ദൈവമായ യഹ്‌വെ നിന്നോടു കല്പിച്ചതുപോലെ, നിന്റെ ദൈവമായ യഹ്‌വെ നിനക്കു നൽകുന്ന ദേശത്ത് നിന്റെ ആയുസ്സ് ദീർഘമാകേണ്ടതിനും നിനക്കു നന്നായി ഭവിക്കേണ്ടതിനും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּבֵּד
  choice: ബഹുമാനിക്കുക
  rationale: כבד എന്ന പീയേൽ ആജ്ഞാരൂപം ഈ ബന്ധസന്ദർഭത്തിൽ ഒരാളെ ഗൗരവത്തോടെ ആദരിക്കുക എന്നർഥം നൽകുന്നു. ‘ബഹുമാനിക്കുക’ എന്നത് രൂപകത്തെ അമിതമായി അക്ഷരാർഥമാക്കാതെ കല്പനയുടെ നൈതിക ബലം നിലനിർത്തുന്നു.
- source_word: אָבִיךָ ... אִמֶּךָ
  choice: നിന്റെ പിതാവിനെയും നിന്റെ മാതാവിനെയും
  rationale: എബ്രായത്തിൽ രണ്ടു നാമങ്ങൾക്കും മുമ്പിൽ നേരിട്ടുള്ള കർമസൂചകം ആവർത്തിക്കുന്നതിനാൽ മാതാപിതാക്കൾ ഇരുവർക്കും തുല്യമായ ഊന്നലുണ്ട്; മലയാളത്തിലും ‘നിന്റെ’ എന്നത് ആവർത്തിച്ച് ആ സമതുലിതത്വം നിലനിർത്തി.
- source_word: כַּאֲשֶׁר צִוְּךָ
  choice: നിന്നോടു കല്പിച്ചതുപോലെ
  rationale: כַּאֲשֶׁר മുൻപ് നൽകിയ ദൈവിക കല്പനയോടുള്ള അനുരൂപത സൂചിപ്പിക്കുന്നു. ഈ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി അതു പ്രകടിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരിച്ചു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: രണ്ടാം പുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയം സൂചിപ്പിക്കുന്ന ഉടമ്പടി ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: לְמַעַן
  choice: അങ്ങനെ ... ചെയ്യും
  rationale: ലക്ഷ്യം അല്ലെങ്കിൽ ഫലം സൂചിപ്പിക്കുന്ന לְמַעַן രണ്ടുതവണ വരുന്നതിനെ മലയാളത്തിലെ സ്വാഭാവിക ഫലവാക്യഘടനയിലൂടെ അറിയിച്ചു; രണ്ടു വാഗ്ദത്തഫലങ്ങളെയും ‘-ുകയും’ എന്ന സമാന്തരരൂപത്തിൽ ചേർത്തു.
- source_word: יַאֲרִיכֻן יָמֶיךָ
  choice: നിന്റെ ആയുസ്സ് ദീർഘമാകുകയും
  rationale: അക്ഷരാർഥത്തിൽ ‘നിന്റെ ദിവസങ്ങൾ ദീർഘമാകുക’ എന്ന ആശയം സ്വാഭാവിക ആധുനിക മലയാളത്തിൽ ‘ആയുസ്സ് ദീർഘമാകുക’ എന്നു നൽകി.
- source_word: וּלְמַעַן יִיטַב לָךְ
  choice: നിനക്കു നന്മ വരുകയും
  rationale: ייטב לך ക്ഷേമം, നന്നായി ഭവിക്കൽ എന്നീ അർഥങ്ങളുള്ള പ്രയോഗമാണ്. ‘നിനക്കു നന്മ വരുക’ വ്യക്തിപരമായ ക്ഷേമത്തിന്റെ ആശയം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളമാണ്.
- source_word: עַל הָאֲדָמָה
  choice: ദേശത്ത്
  rationale: אֲדָמָה ഇവിടെ സാധാരണ മണ്ണിനെയല്ല, ദൈവം നൽകുന്ന ഭൂദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ പ്രദേശിക അർഥത്തിന് ‘ദേശത്ത്’ സ്വാഭാവികമാണ്.
- source_word: נֹתֵן לָךְ
  choice: നിനക്കു നൽകുന്ന
  rationale: വർത്തമാന കൃദന്തരൂപം നടന്നുകൊണ്ടിരിക്കുന്നതോ ഉറപ്പുള്ള സമീപകാല പ്രവൃത്തിയോ സൂചിപ്പിക്കാം; ‘നൽകുന്ന’ അതിന്റെ കാലപരമായ തുറന്ന സ്വഭാവം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം തന്നെയാണ് ഉള്ളത്. അതിനെ ഒരു ബിരുദംകൊണ്ട് പകരാതെ മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- issue: മാതാപിതാക്കളെ ബഹുമാനിക്കുന്നതിനോടു ചേർന്ന വാഗ്ദത്തത്തിന്റെ സ്വഭാവം
  choice: ദേശത്തിലെ ദീർഘായുസ്സും ക്ഷേമവും സംബന്ധിച്ച ഉടമ്പടിവാഗ്ദത്തം അതേ തുറന്ന രൂപത്തിൽ നിലനിർത്തുക
  alternative: ഓരോ വ്യക്തിക്കും നിർബന്ധമായ ദീർഘായുസ്സിന്റെ ഉറപ്പ്; അല്ലെങ്കിൽ വ്യക്തിപരമായ പ്രസക്തിയില്ലാത്ത ദേശീയ വാഗ്ദത്തം മാത്രം
  rationale: വാക്യം അനുസരണത്തോടു ബന്ധപ്പെടുത്തി യഥാർഥമായ വാഗ്ദത്തം നൽകുന്നു; എന്നാൽ അത് പൂർണമായും വ്യക്തിഗതമോ പൂർണമായും സമൂഹപരമോ എന്ന് ഇവിടെ നിർണയിക്കുന്നില്ല. അതിനാൽ ആ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഭാഷയിൽ പരിഹരിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘പിതാവ്/മാതാവ്’ എന്നത് ഗൗരവമുള്ള പൊതുവായ രജിസ്റ്റർ നിലനിർത്തുന്നു; വാക്യത്തിന്റെ ദൈർഘ്യം നിയന്ത്രിക്കാനും കല്പന വ്യക്തമാക്കാനും ‘ചെയ്യുക’ എന്ന പൂരകവാക്യം ഉപയോഗിച്ചു. ദൈവനാമം ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
