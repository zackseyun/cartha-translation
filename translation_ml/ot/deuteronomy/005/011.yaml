revisions:
- from: നിന്റെ ദൈവമായ യഹ്‌വേയുടെ നാമം വ്യർത്ഥമായി ഉപയോഗിക്കരുത്[a]. തന്റെ നാമം വ്യർത്ഥമായി ഉപയോഗിക്കുന്നവനെ യഹ്‌വേ ശിക്ഷിക്കാതെ വിടുകയില്ല[b].
  to: നിന്റെ ദൈവമായ യഹ്‌വേയുടെ നാമം വ്യർഥമായി ഉപയോഗിക്കരുത്[a]. കാരണം, തന്റെ നാമം വ്യർഥമായി ഉപയോഗിക്കുന്നവനെ യഹ്‌വേ ശിക്ഷിക്കാതെ വിടുകയില്ല[b].
  rationale: 'The revision explicitly translates כִּי as “കാരണം,” preserving the source’s causal justification. It retains the draft’s appropriately broad Malayalam rendering of the idiom involving the divine name and improves footnote a’s lexical precision and fluency. Footnote anchors remain correctly placed: a after the prohibition and b after the judicial warning.'
