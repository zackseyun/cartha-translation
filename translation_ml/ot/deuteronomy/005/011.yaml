id: DEU.5.11
reference: Deuteronomy 5:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹ֥א תִשָּׂ֛א אֶת שֵֽׁם יְהוָ֥ה אֱלֹהֶ֖י/ךָ לַ/שָּׁ֑וְא כִּ֣י לֹ֤א יְנַקֶּה֙ יְהוָ֔ה אֵ֛ת אֲשֶׁר יִשָּׂ֥א אֶת שְׁמ֖/וֹ לַ/שָּֽׁוְא־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/011.yaml
  text: You shall not take the name of Yahweh your God in vain[b][a], for Yahweh will not leave unpunished the one who takes his name in vain.
translation:
  language: ml
  text: നിന്റെ ദൈവമായ യഹ്‌വേയുടെ നാമം വ്യർഥമായി ഉപയോഗിക്കരുത്[a]. കാരണം, തന്റെ നാമം വ്യർഥമായി ഉപയോഗിക്കുന്നവനെ യഹ്‌വേ ശിക്ഷിക്കാതെ വിടുകയില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വ്യാജമായി,’ ‘അന്യായമായി,’ അല്ലെങ്കിൽ ‘ശൂന്യമായി’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദത്തിൽ യഹ്‌വേയുടെ നാമം വ്യാജമായോ ശൂന്യമായോ ഉപയോഗിക്കുന്നതിന്റെ ആശയവും ഉൾപ്പെടാം; അത് ഒരു പ്രത്യേകതരം ദുരുപയോഗത്തിൽ മാത്രം ഒതുങ്ങുന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: ‘കുറ്റമില്ലാത്തവനായി കണക്കാക്കുകയില്ല’ അല്ലെങ്കിൽ ‘വെറുതെ വിടുകയില്ല’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשָּׂא / יִשָּׂא (נשא)
  choice: ഉപയോഗിക്കുക
  rationale: നשא എന്ന ക്രിയയ്ക്ക് ‘എടുക്കുക, ഉയർത്തുക, വഹിക്കുക’ എന്ന വിശാലമായ അർഥപരിധിയുണ്ട്. എന്നാൽ മലയാളത്തിൽ ‘നാമം എടുക്കുക’ ഈ സന്ദർഭത്തിൽ അസ്വാഭാവികവും അവ്യക്തവുമാകാം; ‘ഉപയോഗിക്കുക’ എന്നത് ദൈവനാമത്തിന്റെ വ്യാജമോ ശൂന്യമോ അനുചിതമോ ആയ പ്രയോഗങ്ങളെ മുൻകൂട്ടി ഒരൊറ്റ വിഭാഗത്തിലേക്ക് ചുരുക്കാതെ കല്പനയുടെ ആശയം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: שֵׁם / שְׁמוֹ
  choice: നാമം / തന്റെ നാമം
  rationale: മൂലപദത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു. ‘നാമം’ വ്യക്തിത്വം, അധികാരം, പ്രശസ്തി എന്നിവയുമായി ബന്ധപ്പെട്ട വിശാല സൂചനകൾ വഹിക്കാമെങ്കിലും അവയെ വ്യാഖ്യാനമായി മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: രണ്ടാം പുരുഷ ഏകവചനത്തിലുള്ള ഉടമ്പടിസംബോധന മലയാളത്തിൽ നേരിട്ടും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: לַשָּׁוְא
  choice: വ്യർത്ഥമായി
  rationale: שָׁוְא എന്ന പദത്തിലെ ശൂന്യത, വ്യാജം, വിലകെട്ടത്വം, അനുചിതത്വം എന്നീ അർഥസാധ്യതകളെ ഒരു പ്രത്യേക ദുരുപയോഗത്തിലേക്ക് ചുരുക്കാതെ സൂക്ഷിക്കുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: כִּי
  choice: വാക്യക്രമത്തിലൂടെ കാരണബന്ധം
  rationale: രണ്ടാമത്തെ വാക്യം കല്പനയ്ക്കുള്ള കാരണം വ്യക്തമാക്കുന്നു. മലയാളത്തിൽ നിർബന്ധമായി ‘കാരണം’ ചേർക്കാതെയും ഈ ബന്ധം വ്യക്തമാണ്; ഇതിലൂടെ വാക്യം കൂടുതൽ സ്വാഭാവികമാകുന്നു.
- source_word: יְנַקֶּה (נקה)
  choice: ശിക്ഷിക്കാതെ വിടുകയില്ല
  rationale: ഈ രൂപം കുറ്റത്തിൽനിന്നോ അതിന്റെ ശിക്ഷയിൽനിന്നോ വെറുതെ വിടുകയില്ല എന്ന ന്യായവിധിസംബന്ധമായ ആശയം നൽകുന്നു. ആധുനിക മലയാളത്തിൽ വ്യക്തമായ പ്രയോഗമാണിത്; ‘കുറ്റമില്ലാത്തവനായി കണക്കാക്കുകയില്ല’ എന്ന അടുത്ത സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר
  choice: ഉപയോഗിക്കുന്നവനെ
  rationale: കുറ്റം ചെയ്യുന്ന ഏതൊരാളെയും പൊതുവായി സൂചിപ്പിക്കുന്ന എബ്രായ ആപേക്ഷികഘടനയെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: YHWH എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലവാചകത്തിൽ വ്യക്തിനാമമായ יהוה തന്നെയാണ് ഉള്ളത്. അതിനെ ഒരു പദവികൊണ്ട് പകരാതെ ലിപ്യന്തരണം ചെയ്യുന്നത് സീനായിൽ വെളിപ്പെടുത്തിയ ഉടമ്പടിനാമത്തെ നിലനിർത്തുന്നു.
- issue: കല്പന നിരോധിക്കുന്ന ദുരുപയോഗത്തിന്റെ വ്യാപ്തി
  choice: ‘നാമം വ്യർത്ഥമായി ഉപയോഗിക്കുക’ എന്ന വിശാല പ്രയോഗം
  alternative: വ്യാജശപഥത്തിൽ നാമം വിളിക്കുക; നാമം അനുചിതമായി ഉച്ചരിക്കുക; നാമം വ്യാജമായി വഹിക്കുക
  rationale: വാചകം വ്യാജശപഥം, ശൂന്യമായ ആഹ്വാനം, അനുചിതമായ ഉപയോഗം, ദൈവനാമത്തെ വ്യാജമായി പ്രതിനിധീകരിക്കൽ എന്നിവയിൽ ഏതെങ്കിലും ഒന്നിൽ മാത്രം നിർബന്ധമായി ചുരുങ്ങുന്നില്ല. അതിനാൽ മുഖ്യവാചകം അർഥവ്യാപ്തി നിലനിർത്തുകയും അടിക്കുറിപ്പ് സാധ്യതകൾ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- issue: נקה എന്ന ക്രിയയുടെ ന്യായവിധിസംബന്ധമായ അർഥം
  choice: ശിക്ഷിക്കാതെ വിടുകയില്ല
  alternative: കുറ്റമില്ലാത്തവനായി കണക്കാക്കുകയില്ല; വെറുതെ വിടുകയില്ല
  rationale: ദൈവം കുറ്റക്കാരനെ കുറ്റമോചിതനായി പ്രഖ്യാപിക്കുകയില്ല എന്ന അർഥവും ശിക്ഷയിൽനിന്ന് ഒഴിവാക്കുകയില്ല എന്ന അർഥവും ഇവിടെ തമ്മിൽ ബന്ധപ്പെട്ടിരിക്കുന്നു. മുഖ്യവാചകം ഫലം വ്യക്തമായി പറയുന്നു; അടുത്ത നിയമപരമായ രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ കല്പനാശൈലി ഉപയോഗിച്ചു. ‘നാമം എടുക്കുക’ എന്ന പദാനുപദരൂപം മലയാളത്തിൽ തെറ്റിദ്ധാരണയ്ക്കിടയാക്കുന്നതിനാൽ ‘നാമം ഉപയോഗിക്കുക’ എന്നു നൽകി; എന്നാൽ വ്യാജശപഥം, ശൂന്യമായ ഉച്ചാരണം, വിശാലമായ ദുരുപയോഗം എന്നിവയിൽ ഒന്നിനെ മാത്രം നിർണായകമായി സ്വീകരിച്ചിട്ടില്ല. രണ്ടാംപുരുഷ ഏകവചനമായ ‘നിന്റെ’ നിലനിർത്തിയിരിക്കുന്നു.
