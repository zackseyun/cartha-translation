id: DEU.5.4
reference: Deuteronomy 5:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: פָּנִ֣ים בְּ/פָנִ֗ים דִּבֶּ֨ר יְהוָ֧ה עִמָּ/כֶ֛ם בָּ/הָ֖ר מִ/תּ֥וֹךְ הָ/אֵֽשׁ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/004.yaml
  text: Yahweh spoke with you face to face on the mountain[a], from the midst of the fire.
translation:
  language: ml
  text: യഹോവ പർവതത്തിൽ തീയുടെ നടുവിൽനിന്ന് നിങ്ങളോടു മുഖാമുഖം സംസാരിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פָּנִים בְּפָנִים
  choice: മുഖാമുഖം
  rationale: എബ്രായ പ്രയോഗത്തിന്റെ അക്ഷരാർഥവും നേരിട്ടുള്ള വ്യക്തിപരമായ അഭിസംബോധന എന്ന ആശയവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: דִּבֶּר
  choice: സംസാരിച്ചു
  rationale: ക്രിയയുടെ സാധാരണ അർഥം കാത്തുസൂക്ഷിക്കുന്നു; עִמָּכֶם എന്നതിനോടൊപ്പം ‘നിങ്ങളോടു ... സംസാരിച്ചു’ എന്നു സ്വാഭാവികമായി ചേരുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: പദവിക്ക് പകരം ദൈവനാമമായ ചതുരക്ഷരനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: עִמָּכֶם
  choice: നിങ്ങളോടു
  rationale: עִם സൂചിപ്പിക്കുന്ന ബന്ധപരമായ ‘കൂടെ/ഒപ്പം’ എന്ന ഭാവം മലയാളത്തിലെ സംസാരക്രിയയോടു ചേരുന്ന ‘നിങ്ങളോടു’ എന്ന രൂപത്തിൽ നൽകുന്നു.
- source_word: בָּהָר
  choice: പർവതത്തിൽ
  rationale: ഇവിടെയുള്ള ב സ്ഥലസൂചകമാണ്; സീനായ് സംഭവത്തിന്റെ സ്ഥലം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: തീയുടെ നടുവിൽനിന്ന്
  rationale: ലളിതമായ ‘തീയിൽനിന്ന്’ എന്നതിലുപരി, തീയുടെ അകത്തുനിന്നുള്ള ശബ്ദം എന്ന מִתּוֹךְ-ന്റെ ദൃശ്യസാന്ദ്രത നിലനിർത്തുന്നു.
theological_decisions:
- issue: സീനായിലെ ദൈവപ്രത്യക്ഷതയുടെ വിവരണത്തോടൊപ്പമുള്ള ‘മുഖാമുഖം’ എന്ന മനുഷ്യരൂപക പ്രയോഗം
  choice: നേരിട്ടുള്ള ഉടമ്പടി-അഭിസംബോധന സൂചിപ്പിക്കുന്ന ‘മുഖാമുഖം’ എന്ന പ്രയോഗം നിലനിർത്തി.
  alternative: ‘നേരിട്ട്’ അല്ലെങ്കിൽ ‘വ്യക്തിപരമായി’ എന്നു വ്യാഖ്യാനപരമായി പരിഭാഷപ്പെടുത്തുക.
  rationale: ആവർത്തനം 4:12, 15 പ്രകാരം ജനം ശബ്ദം കേട്ടെങ്കിലും രൂപം കണ്ടില്ല. അതിനാൽ ഇത് അക്ഷരാർഥത്തിലുള്ള ദർശനമായി വിശദീകരിക്കാതെയും പ്രയോഗത്തിന്റെ ശക്തി ഇല്ലാതാക്കാതെയും മൂലപാഠത്തിലെ ഉദ്ദേശ്യപൂർവമായ പിരിമുറുക്കം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘മുഖാമുഖം’ എന്ന പരമ്പരാഗതവും സുതാര്യവുമായ പ്രയോഗം നിലനിർത്തി; വാക്യാവസാനഭാഗത്തിന്റെ ഉറവിടഭാവം വ്യക്തമാക്കാൻ ദീർഘവിരാമം ഉപയോഗിച്ചു.
