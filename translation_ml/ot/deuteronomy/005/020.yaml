source:
  edition: WLC
  text: וְ/לֹֽא תַעֲנֶ֥ה בְ/רֵֽעֲ/ךָ֖ עֵ֥ד שָֽׁוְא־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/020.yaml
  text: You shall not bear false witness against your neighbor[a].
translation:
  language: ml
  text: നിന്റെ അയൽക്കാരനെതിരെ കള്ളസാക്ഷ്യം പറയരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിന്റെ അയൽക്കാരനെതിരെ വ്യാജമായി സാക്ഷ്യം പറയരുത്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: അരുത്
  rationale: നിരോധനകല്പനയെ സ്വാഭാവികവും നേരിട്ടുമായ മലയാള കല്പനാരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: תַעֲנֶה
  choice: പറയുക
  rationale: עֵד എന്ന പദത്തോടൊപ്പം ഇത് നിയമസന്ദർഭത്തിൽ സാക്ഷ്യം നൽകുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘സാക്ഷ്യം പറയുക’ എന്നത് മലയാളത്തിലെ സ്വാഭാവിക നിയമപ്രയോഗമാണ്.
- source_word: בְרֵעֲךָ
  choice: നിന്റെ അയൽക്കാരനെതിരെ
  rationale: רֵעַ സഹജീവി, കൂട്ടാളി, അയൽക്കാരൻ എന്നീ അർഥങ്ങൾ വഹിക്കുന്നു; സാക്ഷ്യത്തിന്റെ നിയമസന്ദർഭത്തിൽ בְ എന്ന ബന്ധത്തെ ‘എതിരെ’ എന്നു നൽകുന്നത് സ്വാഭാവികമാണ്.
- source_word: עֵד
  choice: സാക്ഷ്യം
  rationale: ഇവിടെ പദം സാക്ഷിയെയോ സാക്ഷിമൊഴിയെയോ സൂചിപ്പിക്കാം; ക്രിയയോടുചേർന്ന ‘സാക്ഷ്യം പറയുക’ എന്ന മലയാളപ്രയോഗം നിയമപരമായ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: שָׁוְא
  choice: കള്ള
  rationale: ശൂന്യത, വ്യാജത, വഞ്ചന എന്നീ അർഥസാധ്യതകളിൽ, കോടതിസാക്ഷ്യത്തിന്റെ സന്ദർഭത്തിൽ ‘കള്ള’ എന്നത് സംക്ഷിപ്തവും കൃത്യവും സ്വാഭാവികവുമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, ഗൗരവമുള്ള നിയമകല്പനാശൈലി. ‘കള്ളസാക്ഷ്യം പറയുക’ എന്ന സ്ഥാപിത മലയാളപ്രയോഗം നിലനിർത്തിയിരിക്കുന്നു; മൂലത്തിലെ ക്രിയാപരമായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
