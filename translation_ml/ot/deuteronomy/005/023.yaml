id: DEU.5.23
reference: Deuteronomy 5:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֗י כְּ/שָׁמְעֲ/כֶ֤ם אֶת הַ/קּוֹל֙ מִ/תּ֣וֹךְ הַ/חֹ֔שֶׁךְ וְ/הָ/הָ֖ר בֹּעֵ֣ר בָּ/אֵ֑שׁ וַ/תִּקְרְב֣וּ/ן אֵלַ֔/י כָּל רָאשֵׁ֥י שִׁבְטֵי/כֶ֖ם וְ/זִקְנֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/023.yaml
  text: And when you heard the voice from the midst of the darkness[a], while the mountain was burning with fire, you came near to me—all the heads of your tribes and your elders—
translation:
  language: ml
  text: നിങ്ങൾ ഇരുട്ടിന്റെ നടുവിൽനിന്നുള്ള ശബ്ദം[a] കേട്ടപ്പോൾ, പർവതം തീയിൽ കത്തിക്കൊണ്ടിരിക്കെ, നിങ്ങളുടെ ഗോത്രത്തലവന്മാരും മൂപ്പന്മാരും എല്ലാവരും എന്റെ അടുക്കൽ വന്നു—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സ്വരം’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായത്തിലെ കോൽ എന്ന പദത്തിന് ‘ശബ്ദം’, ‘സ്വരം’ എന്നീ രണ്ടർഥങ്ങളും വരാം. ഇവിടെ ഇരുട്ടിൽനിന്ന് ദൈവം സംസാരിക്കുന്നതാണ് സന്ദർഭം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּשָׁמְעֲכֶם
  choice: നിങ്ങൾ ... കേട്ടപ്പോൾ
  rationale: היה എന്ന ക്രിയയോടുകൂടിയ കാലസൂചക ഘടനയെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘കേട്ടപ്പോൾ’ എന്നു നൽകി; പ്രത്യേകമായി ‘സംഭവിച്ചു’ എന്നു ചേർക്കേണ്ടതില്ല.
- source_word: הַקּוֹל
  choice: ശബ്ദം
  rationale: קוֹל എന്നതിന് ‘ശബ്ദം’, ‘സ്വരം’ എന്നീ അർഥങ്ങൾ സാധ്യമാണ്. ദൈവത്തിന്റെ സംസാരമാണ് സന്ദർഭമെങ്കിലും, മലയാളത്തിൽ ‘ശബ്ദം’ വ്യക്തിയുടെ സംസാരശബ്ദത്തെയും സൂചിപ്പിക്കാനും മൂലപദത്തിന്റെ അർഥവ്യാപ്തി നിലനിർത്താനും കഴിയും.
- source_word: מִתּוֹךְ הַחֹשֶׁךְ
  choice: ഇരുട്ടിന്റെ നടുവിൽനിന്നുള്ള
  rationale: תּוֹךְ സൂചിപ്പിക്കുന്ന ‘നടുവിൽ’ എന്ന ദൃശ്യഭാവം ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: וְהָהָר בֹּעֵר בָּאֵשׁ
  choice: പർവതം തീയിൽ കത്തിക്കൊണ്ടിരിക്കെ
  rationale: വാവ് ഇവിടെ പശ്ചാത്തലസാഹചര്യം സൂചിപ്പിക്കുന്നതായി എടുത്തു; participle-ന്റെ തുടരുന്ന പ്രവൃത്തിയെ ‘കത്തിക്കൊണ്ടിരിക്കെ’ വ്യക്തമാക്കുന്നു.
- source_word: וַתִּקְרְבוּן אֵלַי
  choice: എന്റെ അടുക്കൽ വന്നു
  rationale: קרב + אֶל സൂചിപ്പിക്കുന്ന മോശെയിലേക്കുള്ള സമീപനം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: כָּל רָאשֵׁי שִׁבְטֵיכֶם
  choice: നിങ്ങളുടെ ഗോത്രത്തലവന്മാർ ... എല്ലാവരും
  rationale: רָאשֵׁי എന്ന നേതൃത്വാർഥം ‘തലവന്മാർ’ എന്ന നിലവാരമുള്ള മലയാളപദത്തിൽ നിലനിർത്തുന്നു; כָּל-ന്റെ വ്യാപ്തി ‘എല്ലാവരും’ വ്യക്തമാക്കുന്നു.
- source_word: וְזִקְנֵיכֶם
  choice: മൂപ്പന്മാരും
  rationale: זְקֵנִים ഇവിടെ പ്രായംചെന്നവരെ മാത്രമല്ല, അംഗീകൃത സമൂഹനേതാക്കളെയും സൂചിപ്പിക്കുന്നു; ‘മൂപ്പന്മാർ’ അതിന് പതിവും യോജിച്ചതുമായ പദമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനം ദീർഘവിരാമചിഹ്നം നിലനിർത്തിയിരിക്കുന്നു.
