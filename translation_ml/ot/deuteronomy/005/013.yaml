id: DEU.5.13
reference: Deuteronomy 5:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: שֵׁ֤שֶׁת יָמִים֙ תַּֽעֲבֹ֔ד וְ/עָשִׂ֖יתָ כָּל מְלַאכְתֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/013.yaml
  text: Six days you shall labor and do all your work,[a]
translation:
  language: ml
  text: ആറു ദിവസം നീ അധ്വാനിക്കുകയും നിന്റെ എല്ലാ ജോലിയും ചെയ്യുകയും വേണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ആറു ദിവസം നീ അധ്വാനിക്കുകയും നിന്റെ എല്ലാ ജോലിയും ചെയ്യുകയും ചെയ്യാം.” ഈ നിയമസന്ദർഭത്തിൽ എബ്രായ അപൂർണക്രിയയെ നിർദേശമായോ അനുവാദമായോ മനസ്സിലാക്കാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: ആറു ദിവസം
  rationale: മുൻപിൽ ഉപസർഗം ചേർക്കാതെ കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: תַּעֲבֹד
  choice: നീ അധ്വാനിക്കുകയും ... വേണം
  rationale: עבד ഇവിടെ സാധാരണ അധ്വാനത്തെ സൂചിപ്പിക്കുന്നു. ‘അധ്വാനിക്കുക’ എന്നത് തുടർന്നുള്ള עשה (‘ചെയ്യുക’) എന്ന ക്രിയയിൽനിന്നുള്ള വ്യത്യാസവും നിലനിർത്തുന്നു; ‘വേണം’ നിയമപരമായ നിർദേശസ്വരം നൽകുന്നു.
- source_word: וְעָשִׂיתָ
  choice: ചെയ്യുകയും
  rationale: עשה എന്ന വിശാലാർഥമുള്ള ക്രിയയെ ‘ജോലി’ എന്ന കർമത്തോടൊപ്പം സ്വാഭാവികമായി ചേരുന്ന ‘ചെയ്യുക’ എന്നു പരിഭാഷപ്പെടുത്തി; എബ്രായത്തിലെ ഏകോപനവും നിലനിർത്തി.
- source_word: כָּל
  choice: എല്ലാ
  rationale: ചെയ്യേണ്ട ജോലിയുടെ സമഗ്രത സൂചിപ്പിക്കുന്ന כָּל എന്ന പദത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: מְלַאכְתֶּךָ
  choice: നിന്റെ ... ജോലിയും
  rationale: ശബ്ബത്ത് പശ്ചാത്തലത്തിൽ מְלָאכָה ജോലി, തൊഴിൽ, പ്രവൃത്തി എന്നിവയെ സൂചിപ്പിക്കാം; ‘നിന്റെ എല്ലാ ജോലിയും’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമാണ്.
theological_decisions:
- issue: ശബ്ബത്ത് നിയമത്തിനുള്ളിലെ ക്രിയകളുടെ നിർദേശാത്മകമോ അനുവദനീയമോ ആയ ഭാവം
  choice: ‘അധ്വാനിക്കുകയും ... ചെയ്യുകയും വേണം’ എന്ന നിർദേശാത്മക വായന
  alternative: ‘അധ്വാനിക്കുകയും ... ചെയ്യുകയും ചെയ്യാം’ എന്ന അനുവദനീയ വായന
  rationale: ഉടമ്പടി-നിയമത്തിന്റെ പശ്ചാത്തലത്തിൽ എബ്രായ അപൂർണക്രിയകൾക്ക് നിർദേശാത്മക ബലം ഉണ്ടാകാം. മുഖ്യവാചകത്തിൽ അത് നിലനിർത്തിയെങ്കിലും, ഈ നിയമസന്ദർഭത്തിൽ അനുവദനീയ അർഥവും വ്യാകരണപരമായി സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമ-നിർദേശസ്വരം ഉപയോഗിച്ചു. ‘അധ്വാനിക്കുക’ എന്നും ‘ജോലി ചെയ്യുക’ എന്നും നൽകി രണ്ട് വ്യത്യസ്ത എബ്രായ ക്രിയകളുടെ ഭേദം പരമാവധി നിലനിർത്തി.
