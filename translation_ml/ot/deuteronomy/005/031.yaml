source:
  edition: WLC
  text: וְ/אַתָּ֗ה פֹּה֮ עֲמֹ֣ד עִמָּדִ/י֒ וַ/אֲדַבְּרָ֣ה אֵלֶ֗י/ךָ אֵ֧ת כָּל הַ/מִּצְוָ֛ה וְ/הַ/חֻקִּ֥ים וְ/הַ/מִּשְׁפָּטִ֖ים אֲשֶׁ֣ר תְּלַמְּדֵ֑/ם וְ/עָשׂ֣וּ בָ/אָ֔רֶץ אֲשֶׁ֧ר אָנֹכִ֛י נֹתֵ֥ן לָ/הֶ֖ם לְ/רִשְׁתָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/031.yaml
  text: But you[a], stand here with me, and I will speak to you all the commandment and the statutes and the judgments that you shall teach them[b], so that they may do them in the land that I am giving them to possess.
translation:
  language: ml
  text: എന്നാൽ നീ ഇവിടെ എന്നോടുകൂടെ നിൽക്കുക; ഞാൻ നിന്നോടു കല്പന മുഴുവനും[a], ചട്ടങ്ങളും വിധികളും—നീ അവ അവർക്കു പഠിപ്പിക്കേണ്ടവ—പറയും; ഞാൻ അവർക്കു കൈവശമാക്കാൻ[b] കൊടുക്കുന്ന ദേശത്ത് അവർ അവ അനുഷ്ഠിക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സകല കല്പനയും.’ ഇവിടെ ഹീബ്രുവിൽ ഏകവചനനാമമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; അതിനു പിന്നാലെ ‘ചട്ടങ്ങൾ’, ‘വിധികൾ’ എന്നീ ബഹുവചനപദങ്ങൾ വരുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവകാശമായി നേടാൻ’ അല്ലെങ്കിൽ ‘അധീനമാക്കാൻ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: פֹּה עֲמֹד עִמָּדִי
  choice: ഇവിടെ എന്നോടുകൂടെ നിൽക്കുക
  rationale: עָמַד എന്ന ക്രിയയുടെ ‘നിൽക്കുക’ എന്ന മൂർത്തമായ അർഥവും ദൈവസന്നിധിയിൽ മോശെ തുടരണമെന്ന ഗൗരവമുള്ള ആജ്ഞയും സംരക്ഷിക്കുന്നു.
- source_word: וַאֲדַבְּרָה אֵלֶיךָ
  choice: ഞാൻ നിന്നോട് ... പറയും
  rationale: ആജ്ഞയ്ക്കു പിന്നാലെയുള്ള cohortative രൂപത്തിന്റെ ഭാവി-ഇച്ഛാഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֵת כָּל הַמִּצְוָה
  choice: കല്പന മുഴുവനും
  rationale: מִצְוָה എന്ന ഏകവചനവും כָּל സൂചിപ്പിക്കുന്ന സമഗ്രതയും മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: הַחֻקִּים
  choice: ചട്ടങ്ങൾ
  rationale: നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ חֻקִּים എന്ന പദത്തെ തുടർന്നുവരുന്ന מִשְׁפָּטִים എന്നതിൽനിന്ന് വേർതിരിച്ചു കാണിക്കുന്നു.
- source_word: הַמִּשְׁפָּטִים
  choice: വിധികൾ
  rationale: ന്യായവിധിയുടെയും നിയമനിർണയത്തിന്റെയും പദബന്ധം നിലനിർത്തുന്ന പരിചിതമായ മലയാളപദമാണ്.
- source_word: אֲשֶׁר תְּלַמְּדֵם
  choice: നീ അവ അവർക്കു പഠിപ്പിക്കണം
  rationale: മോശെയോടുള്ള നേരിട്ടുള്ള അധ്യാപനനിയോഗം വ്യക്തമാക്കുകയും നിയമോപദേശങ്ങളെയാണ് ‘അവ’ സൂചിപ്പിക്കുന്നതെന്ന് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: וְעָשׂוּ
  choice: അവർ അവ അനുഷ്ഠിക്കേണ്ടതിന്
  rationale: പഠിപ്പിക്കലിന്റെ ഉദ്ദേശ്യം പ്രായോഗിക അനുസരണമാണെന്ന ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר אָנֹכִי נֹתֵן לָהֶם
  choice: ഞാൻ അവർക്കു ... കൊടുക്കുന്ന
  rationale: נֹתֵן എന്ന participle സൂചിപ്പിക്കുന്ന നടന്നുകൊണ്ടിരിക്കുന്നതോ ആസന്നമായതോ ആയ ദൈവിക ദാനം വർത്തമാനരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: לְרִשְׁתָּהּ
  choice: കൈവശമാക്കാൻ
  rationale: ദേശവാഗ്ദാനത്തിന്റെ പശ്ചാത്തലത്തിൽ യാഥാർഥ്യമായ ഉടമസ്ഥതയിലേക്കുള്ള പ്രവേശനം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: מִצְוָה / חֻקִּים / מִשְׁפָּטִים എന്ന നിയമപരമായ ത്രയം
  choice: ‘കല്പന’, ‘ചട്ടങ്ങൾ’, ‘വിധികൾ’ എന്നിങ്ങനെ വേർതിരിച്ച പദങ്ങൾ നിലനിർത്തി.
  alternative: ‘നിയമങ്ങളും ചട്ടങ്ങളും’ എന്ന പൊതുവായ സംഗ്രഹപ്രയോഗം.
  rationale: ദൈവത്തിന്റെ ഉടമ്പടി-ഉപദേശത്തിലെ പദവ്യത്യാസവും നിയമപരമായ ഘടനയും വ്യാഖ്യാനത്തിലൂടെ സമതലപ്പെടുത്താതെ സംരക്ഷിക്കുന്നു.
- issue: ഏകവചനമായ מִצְוָה
  choice: ‘കല്പന മുഴുവനും’ എന്ന ഏകവചനപ്രയോഗം.
  alternative: ‘സകല കല്പനകളും’ എന്ന ബഹുവചനം.
  rationale: ഇവിടെ പദം സമാഹാരാർഥത്തിൽ വരാമെങ്കിലും ഹീബ്രുവിലെ യഥാർഥ ഏകവചനം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. നിയമപരമായ മൂന്നു പദങ്ങളുടെ വ്യത്യാസം സൂക്ഷിക്കുകയും, ഹീബ്രുവിലെ ഏകവചനമായ ‘കല്പന’ ബഹുവചനമാക്കാതിരിക്കുകയും ചെയ്തു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും അവ വിശദീകരിക്കുന്ന പദങ്ങൾക്കു പിന്നാലെ തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
