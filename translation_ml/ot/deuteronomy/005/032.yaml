id: DEU.5.32
reference: Deuteronomy 5:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּ֣ם לַ/עֲשׂ֔וֹת כַּ/אֲשֶׁ֥ר צִוָּ֛ה יְהוָ֥ה אֱלֹהֵי/כֶ֖ם אֶתְ/כֶ֑ם לֹ֥א תָסֻ֖רוּ יָמִ֥ין וּ/שְׂמֹֽאל׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/032.yaml
  text: So be careful to do just as Yahweh your God has commanded you[a]; do not turn aside to the right or to the left.
translation:
  language: ml
  text: നിങ്ങളുടെ ദൈവമായ യാഹ്‌വേ നിങ്ങളോടു കൽപിച്ചതുപോലെതന്നെ ചെയ്യുന്നതിൽ ശ്രദ്ധിക്കുവിൻ; വലത്തോട്ടോ ഇടത്തോട്ടോ മാറരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വലത്തോട്ടോ ഇടത്തോട്ടോ മാറരുത്” എന്നത് ദൈവം കൽപിച്ചതിൽനിന്ന് ഒരു ദിശയിലേക്കും വ്യതിചലിക്കരുത് എന്നർഥമുള്ള എബ്രായ ശൈലിയാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/שְׁמַרְתֶּם
  choice: ശ്രദ്ധിക്കണം
  rationale: שׁמר എന്ന ക്രിയയ്ക്ക് ഇവിടെ לַעֲשׂוֹת എന്ന ഉദ്ദേശ്യസൂചക രൂപത്തോടൊപ്പം, വെറുതെ കാത്തുസൂക്ഷിക്കുക എന്നതിലുപരി ജാഗ്രതയോടെ അനുസരിക്കുക എന്ന അർഥമാണ്.
- source_word: לַ/עֲשׂוֹת
  choice: ചെയ്യാൻ
  rationale: עשה കല്പിക്കപ്പെട്ട കാര്യങ്ങൾ പ്രാവർത്തികമാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ലളിതമായ എബ്രായ പ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാള തുല്യം.
- source_word: כַּ/אֲשֶׁר
  choice: കല്പിച്ചതുപോലെ തന്നേ
  rationale: ദൈവകല്പനയോടുള്ള കൃത്യമായ അനുരൂപത ഊന്നിപ്പറയാൻ ‘പോലെ തന്നേ’ ഉപയോഗിച്ചു.
- source_word: צִוָּה
  choice: കല്പിച്ചതുപോലെ
  rationale: പൂർത്തിയായ കല്പനയും ഇപ്പോഴും നിലനിൽക്കുന്ന അതിന്റെ ബാധ്യതയും സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാൽ മാറ്റാതെ മലയാളത്തിൽ പതിവുള്ള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: אֱלֹהֵי/כֶם
  choice: നിങ്ങളുടെ ദൈവമായ
  rationale: രണ്ടാം പുരുഷ ബഹുവചന ഉടമസ്ഥപ്രത്യയം സൂചിപ്പിക്കുന്ന ഉടമ്പടിബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לֹא תָסֻרוּ
  choice: മാറരുത്
  rationale: കല്പിക്കപ്പെട്ട വഴിയിൽനിന്ന് വ്യതിചലിക്കുക എന്ന രൂപകാലങ്കാരപരമായ അർഥം ദിശാസൂചക പദങ്ങളോടൊപ്പം വ്യക്തമായി നൽകുന്നു.
- source_word: יָמִין וּ/שְׂמֹאל
  choice: വലത്തോട്ടോ ഇടത്തോട്ടോ
  rationale: ഏതു ദിശയിലേക്കും വ്യതിചലിക്കരുതെന്ന ആശയം മൂലപാഠത്തിലെ വഴിദൃശ്യത്തോടൊപ്പം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ ഒരു സ്ഥാനപ്പേര് പകരംവയ്ക്കാതെ മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ എന്ന രൂപം സ്വീകരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവും പ്രബോധനാത്മകവുമായ ശൈലി. മൂലപാഠത്തിലെ അനുസരണത്തിനുള്ള ആഹ്വാനവും വഴിയിൽനിന്ന് മാറുന്ന ദൃശ്യരൂപവും നിലനിർത്തി.
