source:
  edition: WLC
  text: אָ֠נֹכִי עֹמֵ֨ד בֵּין יְהוָ֤ה וּ/בֵֽינֵי/כֶם֙ בָּ/עֵ֣ת הַ/הִ֔וא לְ/הַגִּ֥יד לָ/כֶ֖ם אֶת דְּבַ֣ר יְהוָ֑ה כִּ֤י יְרֵאתֶם֙ מִ/פְּנֵ֣י הָ/אֵ֔שׁ וְ/לֹֽא עֲלִיתֶ֥ם בָּ/הָ֖ר לֵ/אמֹֽר־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/005.yaml
  text: I was standing between Yahweh and you at that time[a], to declare to you the word of Yahweh, because you were afraid because of the fire and did not go up the mountain, saying,
translation:
  language: ml
  text: 'ആ സമയത്ത്, നിങ്ങൾ തീ നിമിത്തം[a] ഭയപ്പെടുകയും മലയിൽ കയറാതിരിക്കുകയും ചെയ്തതുകൊണ്ട്, യഹ്‌വെയുടെ വചനം നിങ്ങളോടു അറിയിക്കാൻ ഞാൻ യഹ്‌വെയ്ക്കും നിങ്ങൾക്കും ഇടയിൽ നിന്നുകൊണ്ടിരുന്നു—ഇപ്രകാരം:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “തീയുടെ മുഖത്തുനിന്ന്/സന്നിധിയിൽനിന്ന്”; തീ നിമിത്തമുള്ള ഭയത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנֹכִי עֹמֵד
  choice: ഞാൻ ... നിന്നുകൊണ്ട് ... അറിയിക്കുകയായിരുന്നു
  rationale: ഊന്നലുള്ള സ്വതന്ത്ര സർവനാമത്തെയും ഭൂതകാല വിവരണസന്ദർഭത്തിലെ നിലനിൽക്കുന്ന പങ്കിനെ സൂചിപ്പിക്കുന്ന ഖാൽ കർത്തൃവാചകത്തെയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: בֵּין יְהוָה וּבֵינֵיכֶם
  choice: യഹ്‌വെയ്ക്കും നിങ്ങൾക്കും മധ്യേ
  rationale: മോശയുടെ മധ്യസ്ഥസ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന ഇരുപക്ഷബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ഹീബ്രു ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പൊതുപദവിയാൽ പകരംവയ്ക്കാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: לְהַגִּיד לָכֶם אֶת דְּבַר יְהוָה
  choice: യഹ്‌വെയുടെ വചനം നിങ്ങളെ അറിയിക്കുകയായിരുന്നു
  rationale: נגד എന്ന ഹിഫീൽ ക്രിയയുടെ അറിയിക്കുക/പ്രഖ്യാപിക്കുക എന്ന ആശയവും ദൈവിക സന്ദേശമെന്ന דָּבָר എന്ന പദത്തിന്റെ പരമ്പരാഗത ‘വചനം’ എന്ന ഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: מִפְּנֵי הָאֵשׁ
  choice: തീയുടെ സന്നിധിയിൽനിന്ന്
  rationale: ‘തീയുടെ മുഖം/സന്നിധി നിമിത്തം’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ദൃശ്യതയും കാരണസൂചനയും സംരക്ഷിക്കാൻ താരതമ്യേന ഔപചാരികമായ രൂപം സ്വീകരിച്ചു.
- source_word: וְלֹא עֲלִיתֶם בָּהָר
  choice: മലയിൽ കയറിയില്ല
  rationale: മലയിലേക്കുള്ള ആരോഹണത്തെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പറയുന്നു.
- source_word: לֵאמֹר
  choice: 'അവൻ പറഞ്ഞു:'
  rationale: അടുത്ത വാക്യത്തിൽ ആരംഭിക്കുന്ന യഹ്‌വെയുടെ നേരിട്ടുള്ള വാക്കുകളെ മലയാളത്തിൽ വ്യക്തമായി പരിചയപ്പെടുത്തുന്നു; ഹീബ്രുവിലെ പ്രസംഗപരിചയ സൂചകത്തിന്റെ പ്രവർത്തനം പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമത്തെ പൊതുപദവിയാക്കാതെ നിലനിർത്തുന്നു; പ്രത്യേക ഉച്ചാരണപരമ്പരയെ നിർബന്ധിക്കുന്നില്ല.
- issue: മോശയുടെ മധ്യസ്ഥപങ്ക്
  choice: ‘യഹ്‌വെയ്ക്കും നിങ്ങൾക്കും മധ്യേ’ എന്ന സ്ഥാനവിവരണം അതേപടി നിലനിർത്തി
  alternative: ‘നിങ്ങളുടെ മധ്യസ്ഥനായി’ എന്ന വ്യാഖ്യാനാത്മക പരിഭാഷ
  rationale: വാക്യം സൂചിപ്പിക്കുന്ന മധ്യസ്ഥതയെ അംഗീകരിക്കുമ്പോഴും മൂലത്തിൽ ഇല്ലാത്ത സാങ്കേതിക ദൈവശാസ്ത്രപദം ചേർക്കുന്നില്ല.
- issue: לֵאמֹר എന്നതിന്റെ കർത്താവ്
  choice: സന്ദർഭപ്രകാരം യഹ്‌വെയെ സൂചിപ്പിക്കുന്ന ‘അവൻ പറഞ്ഞു:’
  alternative: ‘ഇപ്രകാരം:’ / ‘പറഞ്ഞുകൊണ്ട്,’
  rationale: ഹീബ്രുവിൽ കർത്താവ് തുറന്നുപറയാത്തതിനാൽ ചെറിയ വ്യാഖ്യാനഘടകം ഉണ്ടെങ്കിലും, 5:6-ലെ ദൈവിക നേരിട്ടുള്ള പ്രസംഗത്തിലേക്കുള്ള ബന്ധം മലയാളവായനക്കാരന് വ്യക്തവും സ്വാഭാവികവുമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും പൊതുവായ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ ശൈലി. വാക്യം അടുത്ത വാക്യത്തിലെ ദൈവവചനത്തിലേക്ക് തുറക്കുന്നതിനാൽ അവസാനം ദ്വിബിന്ദു ഉപയോഗിച്ചു.
