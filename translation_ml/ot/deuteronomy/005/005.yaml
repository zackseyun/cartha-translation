revisions:
- from: 'ആ സമയത്ത് ഞാൻ യഹ്‌വെയ്ക്കും നിങ്ങൾക്കും മധ്യേ നിന്നുകൊണ്ട്, യഹ്‌വെയുടെ വചനം നിങ്ങളെ അറിയിക്കുകയായിരുന്നു; തീയുടെ സന്നിധിയിൽനിന്ന്[a] നിങ്ങൾ ഭയപ്പെട്ടു, മലയിൽ കയറിയില്ല. അവൻ പറഞ്ഞു:'
  to: 'ആ സമയത്ത്, നിങ്ങൾ തീ നിമിത്തം[a] ഭയപ്പെടുകയും മലയിൽ കയറാതിരിക്കുകയും ചെയ്തതുകൊണ്ട്, യഹ്‌വെയുടെ വചനം നിങ്ങളോടു അറിയിക്കാൻ ഞാൻ യഹ്‌വെയ്ക്കും നിങ്ങൾക്കും ഇടയിൽ നിന്നുകൊണ്ടിരുന്നു—ഇപ്രകാരം:'
  rationale: The revision corrects the Malayalam recipient construction, renders the causal fire idiom naturally in the main text while preserving its literal sense in the footnote, and translates לֵאמֹר without adding an unstated subject. It retains the participial, ongoing sense of Moses’ standing and leaves the sentence open to the quotation in the next verse.
