lexical_decisions:
- source_word: אָֽנֹכִי
  choice: ഞാനാണ്
  rationale: ക്രിയയില്ലാത്ത സ്വതന്ത്ര ഒന്നാംപുരുഷ സർവനാമത്തിന്റെ ഊന്നലും ഗൗരവമുള്ള സ്വയംവെളിപ്പെടുത്തലും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ഒരു സ്ഥാനപ്പേര് പകരംവയ്ക്കാതെ ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവം
  rationale: രണ്ടാംപുരുഷ ഏകവചന പ്രത്യയവും ഉടമ്പടിസന്ദർഭത്തിൽ സത്യദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നതെന്ന അർഥവും നേരിട്ട് നൽകുന്നു.
- source_word: הוֹצֵאתִיךָ
  choice: നിന്നെ പുറത്തുകൊണ്ടുവന്നവൻ
  rationale: יצא എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലുള്ള ‘പുറത്തേക്കു വരുത്തുക/പുറത്തുകൊണ്ടുവരുക’ എന്ന കാരകാർഥം സംരക്ഷിക്കുന്നു.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: ഈജിപ്തുദേശത്തുനിന്ന്
  rationale: מִן സൂചിപ്പിക്കുന്ന പുറപ്പെടൽസ്ഥാനത്തെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: מִבֵּית עֲבָדִים
  choice: അടിമകളുടെ ഭവനത്തിൽനിന്ന്
  rationale: עֲבָדִים എന്ന ബഹുവചന നാമത്തിന്റെ മൂർത്തമായ ‘അടിമകൾ’ എന്ന അർഥം നിലനിർത്തിക്കൊണ്ട് ‘ഭവനം’ എന്ന രൂപകം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: എബ്രായപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വന്നിരിക്കുന്നതിനാൽ അതിനെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്തു.
- issue: עֲבָדִים എന്ന പദത്തിന്റെ പുറപ്പാട്-സന്ദർഭത്തിലെ അർഥം
  choice: അടിമകൾ
  alternative: ദാസന്മാർ; അടിമത്തം
  rationale: ഈ വിമോചനസന്ദർഭത്തിൽ നിർബന്ധിത അടിമസ്ഥിതിയാണ് പ്രധാനമായതിനാൽ മൃദുവായ ‘ദാസന്മാർ’ എന്നതിനു പകരം ‘അടിമകൾ’ തിരഞ്ഞെടുത്തു; ബഹുവചന നാമത്തിന്റെ മൂർത്തതയും നിലനിർത്തി.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ മലയാളം. ‘ഞാനാണ്’ എന്ന ആരംഭം എബ്രായത്തിലെ ഊന്നൽ പ്രകടമാക്കുന്നു. ദീർഘവാക്യം മലയാളത്തിൽ വ്യക്തമായി വായിക്കാനായി വിശദീകരണബന്ധം ദീർഘവിരാമചിഹ്നംകൊണ്ട് സൂചിപ്പിച്ചു.
