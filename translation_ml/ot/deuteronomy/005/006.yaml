  text: אָֽנֹכִי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ אֲשֶׁ֧ר הוֹצֵאתִ֛י/ךָ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/006.yaml
  text: I am Yahweh your God[a], who brought you from the land of Egypt, from the house of servants.
translation:
  language: ml
  text: ഞാനാണ് നിന്റെ ദൈവമായ യഹ്‌വേ—ഈജിപ്തുദേശത്തുനിന്ന്, അടിമത്തത്തിന്റെ വീട്ടിൽനിന്ന്[a], നിന്നെ പുറത്തുകൊണ്ടുവന്നവൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘അടിമകളുടെ ഭവനം’; ‘അടിമത്തത്തിന്റെ ഭവനം’ എന്നും പരിഭാഷപ്പെടുത്താം.
