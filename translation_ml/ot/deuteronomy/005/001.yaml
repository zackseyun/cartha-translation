source:
  edition: WLC
  text: וַ/יִּקְרָ֣א מֹשֶׁה֮ אֶל כָּל יִשְׂרָאֵל֒ וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם שְׁמַ֤ע יִשְׂרָאֵל֙ אֶת הַ/חֻקִּ֣ים וְ/אֶת הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֧ר אָנֹכִ֛י דֹּבֵ֥ר בְּ/אָזְנֵי/כֶ֖ם הַ/יּ֑וֹם וּ/לְמַדְתֶּ֣ם אֹתָ֔/ם וּ/שְׁמַרְתֶּ֖ם לַ/עֲשֹׂתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/001.yaml
  text: And Moses called all Israel and said to them[a], “Hear, Israel, the statutes and the judgments that I am speaking in your hearing today; learn them and keep them[b], to do them.”
translation:
  language: ml
  text: 'ആവർത്തനപുസ്തകം 5:1


    മോശെ എല്ലാ ഇസ്രായേലിനെയും വിളിച്ച് അവരോടു പറഞ്ഞു: “ഇസ്രായേലേ, കേൾക്കുക[a]! ഇന്നു നിങ്ങൾ കേൾക്കെ ഞാൻ പറയുന്ന ചട്ടങ്ങളും വിധികളും[b] പഠിക്കുക; അവ പാലിച്ചു പ്രവർത്തിക്കുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ശ്രദ്ധിച്ചു കേൾക്കുക” എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രായ ആജ്ഞ വെറും ശബ്ദം കേൾക്കുന്നതിലുപരി, അനുസരണത്തിലേക്കു നയിക്കുന്ന ശ്രദ്ധാപൂർവമായ കേൾവിയെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “വിധികൾ” എന്നത് “നിയമവിധികൾ” എന്നോ “നിയമങ്ങൾ” എന്നോ പരിഭാഷപ്പെടുത്താം. ഹീബ്രായപദം നിയമപരമായ തീരുമാനങ്ങളെയോ നിശ്ചയിക്കപ്പെട്ട മാനദണ്ഡങ്ങളെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: വിളിച്ചുകൂട്ടി
  rationale: സഭയായി അഭിസംബോധന ചെയ്യുന്നതിനായി ജനത്തെ വിളിച്ചുചേർത്തുവെന്ന ആഖ്യാനസന്ദർഭത്തിലെ קרא എന്ന ക്രിയയുടെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כָּל יִשְׂרָאֵל
  choice: ഇസ്രായേൽജനത്തെ മുഴുവനും
  rationale: ജനതയെ ഒന്നാകെ സൂചിപ്പിക്കുന്ന ഉടമ്പടിപരമായ കൂട്ടായ സംജ്ഞ നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കാവുന്ന രൂപം.
- source_word: שְׁמַע יִשְׂרָאֵל
  choice: ഇസ്രായേലേ, കേൾക്കുക
  rationale: വെറും ശബ്ദഗ്രഹണമല്ല, ശ്രദ്ധാപൂർവം കേട്ട് അനുസരിക്കുന്നതിലേക്കു നയിക്കുന്ന ഉടമ്പടിപരമായ ആഹ്വാനത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു.
- source_word: הַחֻקִּים
  choice: ചട്ടങ്ങൾ
  rationale: നിർദേശിച്ചു നിശ്ചയിച്ച നിയമവ്യവസ്ഥകളെ സൂചിപ്പിക്കുകയും സമീപപദമായ משפטים എന്നതിൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: הַמִּשְׁפָּטִים
  choice: വിധികൾ
  rationale: നിയമപരമായ വിധികളെയോ നിർദേശിത മാനദണ്ഡങ്ങളെയോ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ ന്യായിക ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: דֹּבֵר
  choice: പറയുന്ന
  rationale: ഇപ്പോൾ നടന്നുകൊണ്ടിരിക്കുന്ന പ്രസംഗപ്രവൃത്തിയെ മലയാളത്തിലെ വർത്തമാന സംബന്ധക രൂപത്തിൽ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: בְּאָזְנֵיכֶם
  choice: നിങ്ങൾ കേൾക്കെ
  rationale: അക്ഷരാർഥമായ ‘നിങ്ങളുടെ ചെവികളിൽ’ എന്ന ഹീബ്രായ പ്രയോഗത്തെ നേരിട്ടുള്ള ശ്രാവ്യ അഭിസംബോധന എന്ന അർഥത്തിൽ സ്വാഭാവിക മലയാളത്തിലാക്കുന്നു.
- source_word: וּלְמַדְתֶּם אֹתָם
  choice: പഠിക്കുക
  rationale: നിയമങ്ങൾ ഗ്രഹിക്കുകയും മനസ്സിലാക്കുകയും ചെയ്യാനുള്ള ആഹ്വാനം നേരിട്ട് പ്രകടിപ്പിക്കുന്നു; കർമം മുൻവാക്യത്തിൽ വ്യക്തമായതിനാൽ മലയാളത്തിൽ ആവർത്തിച്ചിട്ടില്ല.
- source_word: וּשְׁמַרְתֶּם לַעֲשֹׂתָם
  choice: അവ പാലിച്ചു നടപ്പാക്കുക
  rationale: שׁמר എന്നതിലെ സൂക്ഷിച്ചു പാലിക്കൽ എന്ന ആശയവും עשׂה എന്നതിലെ പ്രവൃത്തിയാക്കൽ എന്ന ആശയവും വേർതിരിച്ചറിയാവുന്ന വിധത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: חקים / משפטים എന്നീ ഉടമ്പടി-നിയമ പദങ്ങളുടെ വ്യത്യാസം
  choice: ചട്ടങ്ങളും വിധികളും
  alternative: കല്പനകളും നിയമങ്ങളും; ചട്ടങ്ങളും നിയമവിധികളും
  rationale: ബന്ധപ്പെട്ടെങ്കിലും വ്യത്യസ്തമായ രണ്ടു ഹീബ്രായ നിയമപദങ്ങളെയും ഒരു പൊതുപദത്തിൽ ലയിപ്പിക്കാതെ അവയുടെ പദഭേദവും നിയമപരമായ ഭാവവും നിലനിർത്തുന്നു.
- issue: שׁמע എന്ന ഉടമ്പടിപരമായ ആഹ്വാനത്തിന്റെ ശക്തി
  choice: കേൾക്കുക
  alternative: ശ്രദ്ധിക്കുക; ചെവിക്കൊള്ളുക
  rationale: കേട്ട് ഗ്രഹിക്കുന്നതിനൊപ്പം അനുസരണത്തിലേക്കു നയിക്കുന്ന അർഥസാധ്യത നിലനിർത്തുന്നു; ആ അനുസരണഭാവം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു, എന്നാൽ മുഖ്യപാഠത്തിൽ അധികവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. നിയമപരമായ പദജോടിയുടെ വ്യത്യാസം സൂക്ഷിച്ചിരിക്കുന്നു. ‘നിങ്ങൾ കേൾക്കെ’ എന്ന പ്രയോഗം ഹീബ്രായ ഭാഷാശൈലിയുടെ അർഥം നിലനിർത്തുമ്പോഴും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാണ്; അവസാനത്തെ ആജ്ഞകൾ മലയാളത്തിലെ സ്വാഭാവിക ക്രമത്തിൽ സംക്ഷിപ്തമായി നൽകിയിരിക്കുന്നു.
