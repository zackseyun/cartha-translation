source:
  edition: WLC
  text: אֶֽת הַ/דְּבָרִ֣ים הָ/אֵ֡לֶּה דִּבֶּר֩ יְהוָ֨ה אֶל כָּל קְהַלְ/כֶ֜ם בָּ/הָ֗ר מִ/תּ֤וֹךְ הָ/אֵשׁ֙ הֶֽ/עָנָ֣ן וְ/הָֽ/עֲרָפֶ֔ל ק֥וֹל גָּד֖וֹל וְ/לֹ֣א יָסָ֑ף וַֽ/יִּכְתְּבֵ֗/ם עַל שְׁנֵי֙ לֻחֹ֣ת אֲבָנִ֔ים וַֽ/יִּתְּנֵ֖/ם אֵלָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/022.yaml
  text: These words Yahweh spoke to all your assembly on the mountain[a], out of the midst of the fire, the cloud, and the thick darkness, with a loud voice, and he added no more. And he wrote them on two tablets of stone and gave them to me.
translation:
  language: ml
  text: ഈ വചനങ്ങൾ യഹ്‌വെ പർവതത്തിൽ നിങ്ങളുടെ മുഴുവൻ സഭയോടും തീയുടെയും മേഘത്തിന്റെയും കൂരിരുട്ടിന്റെയും നടുവിൽനിന്ന് ഉച്ചത്തിലുള്ള ശബ്ദത്തിൽ പറഞ്ഞു; അവിടന്ന് കൂടുതലൊന്നും പറഞ്ഞില്ല.[a] പിന്നെ അവിടന്ന് അവയെ രണ്ടു കൽപ്പലകകളിൽ എഴുതി എനിക്കു തന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവിടന്ന് സംസാരിക്കുന്നത് തുടർന്നില്ല.” എബ്രായപ്രയോഗത്തിന് “കൂടുതലൊന്നും പറഞ്ഞില്ല” എന്നും “സംസാരിക്കുന്നത് തുടർന്നില്ല” എന്നും അർഥമാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരിച്ചു.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ഈ വചനങ്ങൾ
  rationale: ‘വാക്കുകൾ/കാര്യങ്ങൾ’ എന്ന അടിസ്ഥാന അർഥവും ഇവിടെ പറഞ്ഞ ഉടമ്പടിവചനങ്ങളുമായുള്ള ബന്ധവും നിലനിർത്തുന്നു; ‘കല്പനകൾ’ എന്ന് വ്യാഖ്യാനം ചുരുക്കുന്നില്ല.
- source_word: כָּל קְהַלְכֶם
  choice: നിങ്ങളുടെ സഭ മുഴുവനോടും
  rationale: ഒന്നിച്ചുകൂടിയ സമൂഹത്തെ സൂചിപ്പിക്കുന്ന קָהָל എന്ന പദത്തിന്റെ സാമൂഹിക അർഥം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: מִתּוֹךְ הָאֵשׁ הֶעָנָן וְהָעֲרָפֶל
  choice: തീയുടെയും മേഘത്തിന്റെയും കൂരിരുട്ടിന്റെയും നടുവിൽനിന്ന്
  rationale: מִתּוֹךְ എന്നതിലെ ‘നടുവിൽനിന്ന്’ എന്ന ദൃശ്യതീവ്രതയും עֲרָפֶל എന്നതിലെ കനത്ത ഇരുട്ടിന്റെ ആശയവും സംരക്ഷിക്കുന്നു.
- source_word: קוֹל גָּדוֹל
  choice: ഉച്ചത്തിലുള്ള ശബ്ദത്തിൽ
  rationale: അക്ഷരാർഥത്തിലെ ‘വലിയ ശബ്ദം’ എന്ന ആശയം സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְלֹא יָסָף
  choice: അവിടന്ന് കൂടുതലൊന്നും പറഞ്ഞില്ല
  rationale: മുൻപുള്ള ‘വചനങ്ങൾ’ എന്ന ആശയവുമായി ബന്ധപ്പെടുത്തി, പ്രസ്തുത അരുളപ്പാടിൽ പിന്നെ ഒന്നും കൂട്ടിച്ചേർത്തില്ല എന്ന പ്രധാന സാധ്യത വ്യക്തമാക്കുന്നു; മറ്റൊരു സാധുവായ ഗ്രഹണം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: שְׁנֵי לֻחֹת אֲבָנִים
  choice: രണ്ടു കൽപ്പലകകൾ
  rationale: കല്ലുകൊണ്ടുള്ള രണ്ടു എഴുത്തുപലകകൾ എന്ന അർഥം ചുരുക്കവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיִּתְּנֵם אֵלָי
  choice: എനിക്കു തന്നു
  rationale: വിവരണത്തിന്റെ തുടർച്ചയും മോശെയിലേക്കുള്ള കൈമാറ്റവും ലളിതമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമത്തെ പദവിനാമംകൊണ്ട് പകരാതെ നിലനിർത്തുകയും ഒരു പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ രൂപം നിർബന്ധിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: וְלֹא יָסָף എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: അവിടന്ന് കൂടുതലൊന്നും പറഞ്ഞില്ല
  alternative: അവിടന്ന് സംസാരിക്കുന്നത് തുടർന്നില്ല
  rationale: ഈ വചനങ്ങൾ പ്രസ്താവിച്ചതിനു പിന്നാലെ അവ എഴുതിയെന്ന സന്ദർഭത്തിൽ ‘കൂടുതൽ കൂട്ടിച്ചേർത്തില്ല’ എന്ന ഗ്രഹണം യോജിക്കുന്നു. എന്നാൽ എബ്രായപ്രയോഗം സംസാരത്തിന്റെ തുടർച്ചയില്ലായ്മയായും ഗ്രഹിക്കാവുന്നതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ദൈവത്തെ സൂചിപ്പിക്കാൻ ആദരസൂചകമായ ‘അവിടന്ന്’ ഉപയോഗിച്ചു. അടിക്കുറിപ്പിന്റെ സൂചകം അത് വിശദീകരിക്കുന്ന സംശയാർഥമുള്ള വാക്യഭാഗത്തിനു പിന്നാലെ തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
