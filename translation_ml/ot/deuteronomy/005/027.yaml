source:
  edition: WLC
  text: קְרַ֤ב אַתָּה֙ וּֽ/שֲׁמָ֔ע אֵ֛ת כָּל אֲשֶׁ֥ר יֹאמַ֖ר יְהוָ֣ה אֱלֹהֵ֑י/נוּ וְ/אַ֣תְּ תְּדַבֵּ֣ר אֵלֵ֗י/נוּ אֵת֩ כָּל אֲשֶׁ֨ר יְדַבֵּ֜ר יְהוָ֧ה אֱלֹהֵ֛י/נוּ אֵלֶ֖י/ךָ וְ/שָׁמַ֥עְנוּ וְ/עָשִֽׂינוּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/027.yaml
  text: You go near and hear all that the LORD our God says, and you shall tell us all that the LORD our God speaks to you; and we will hear and do it.
translation:
  language: ml
  text: നീ അടുത്തുചെന്ന് നമ്മുടെ ദൈവമായ യഹോവ പറയുന്നതെല്ലാം കേൾക്കുക. നമ്മുടെ ദൈവമായ യഹോവ നിന്നോടു സംസാരിക്കുന്നതെല്ലാം നീ ഞങ്ങളോടു പറയണം. ഞങ്ങൾ കേൾക്കുകയും അതു ചെയ്യുകയും ചെയ്യും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קְרַב אַתָּה
  choice: നീ അടുത്തുചെന്ന്
  rationale: ആജ്ഞയുടെ ഊന്നൽ നിലനിർത്തിക്കൊണ്ട്, ദൈവസന്നിധിയിലേക്കു പ്രതിനിധിയായി സമീപിക്കുന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: മൂലപാഠത്തിലെ ദൈവനാമത്തെ പൊതുവായി പരിചിതമായ മലയാളരൂപത്തിൽ നേരിട്ട് പ്രതിനിധീകരിക്കുന്നു.
- source_word: וְשָׁמַעְנוּ וְעָשִׂינוּ
  choice: ഞങ്ങൾ അതു കേട്ട് അനുസരിക്കും
  rationale: ഹീബ്രുവിലെ അക്ഷരാർഥമായ ‘കേൾക്കുകയും ചെയ്യുകയും ചെയ്യും’ എന്നത് ഇവിടെ കേട്ട വചനം അനുസരിച്ചു പ്രവർത്തിക്കുമെന്ന അർഥത്തിലാണ്; മലയാളത്തിൽ സ്വാഭാവികമായി അതു വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ജനത്തിനും ദൈവത്തിനും ഇടയിൽ മോശെയുടെ പ്രതിനിധിത്വം
  choice: പ്രതിനിധിയായി സമീപിച്ചു കേൾക്കാനും അറിയിക്കാനും ഉള്ള അഭ്യർഥനയായി മാത്രം വിവർത്തനം ചെയ്തു
  alternative: ഒരു സ്ഥിരമായ പുരോഹിത-മധ്യസ്ഥ സിദ്ധാന്തം സൂചിപ്പിക്കുന്ന പദങ്ങൾ ചേർക്കുക
  rationale: വാക്യം മോശെയോട് അടുത്തുചെന്ന് കേട്ട് അറിയിക്കാൻ ആവശ്യപ്പെടുന്നു; അതിനപ്പുറമുള്ള സമ്പ്രദായപരമായ നിഗമനങ്ങൾ പാഠത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഹീബ്രു വാക്യഘടനയുടെ ആവർത്തനം കഴിയുന്നത്ര നിലനിർത്തിയെങ്കിലും അവസാനത്തെ ‘കേൾക്കുകയും ചെയ്യുകയും ചെയ്യും’ സ്വാഭാവിക മലയാളത്തിൽ ‘കേട്ട് അനുസരിക്കും’ എന്നു നൽകി.
