  text: You shall not murder[a].
translation:
  language: ml
  text: കൊല ചെയ്യരുത്[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, പരമ്പരാഗതമായി: ‘കൊല്ലരുത്.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രു ക്രിയ കൂടുതൽ പ്രത്യേകമായി കൊലയെയോ നിയമവിരുദ്ധമായ മനുഷ്യഹത്യയെയോ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: അരുത്
  rationale: ഹീബ്രു നിഷേധകണമായ לֹא, അപൂർണക്രിയാരൂപത്തോടൊപ്പം ഇവിടെ ഉറച്ച വിലക്ക് പ്രകടിപ്പിക്കുന്നു. മലയാളത്തിൽ കല്പനാത്മക നിരോധനം സ്വാഭാവികമായി ‘അരുത്’ എന്ന രൂപത്തിൽ വരുന്നു.
- source_word: תִּרְצָח
  choice: കൊല ചെയ്യുക
  rationale: רָצַח എന്ന ക്രിയ സാധാരണയായി നിയമവിരുദ്ധമായോ കുറ്റകരമായോ ഉള്ള മനുഷ്യഹത്യയെ സൂചിപ്പിക്കുന്നു; എല്ലാ വിധ ജീവഹരണത്തെയും പൊതുവായി വിലക്കുന്ന വിപുലമായ പദമല്ല. ‘കൊല ചെയ്യുക’ ഈ ധാർമിക-നിയമപരമായ അർത്ഥം ആധുനിക മലയാളത്തിൽ നേരിട്ട് നൽകുന്നു.
theological_decisions:
- issue: ആറാം കല്പനയിലെ വിലക്കിന്റെ വ്യാപ്തി
  choice: കുറ്റകരമായ മനുഷ്യഹത്യയെ വിലക്കുന്ന വിധത്തിൽ ‘കൊല ചെയ്യരുത്’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘കൊല്ലരുത്.’
  rationale: മൂലപാഠത്തിലെ רָצַח, കൊല്ലുന്നതിനെ സൂചിപ്പിക്കുന്ന ഏറ്റവും പൊതുവായ ഹീബ്രു ക്രിയയല്ല; നിയമവിരുദ്ധമായ മനുഷ്യഹത്യ എന്ന കൂടുതൽ നിർദിഷ്ടമായ അർത്ഥമാണ് ഇതിന് സാധാരണയായി ഉള്ളത്. അതിനാൽ എല്ലാ സാഹചര്യങ്ങളിലുമുള്ള ജീവഹരണത്തെ വിലക്കുന്നതായി അർത്ഥം വിപുലീകരിക്കാതെ മൂലത്തിന്റെ ധാർമിക-നിയമപരമായ കൃത്യത നിലനിർത്തി.
translation_notes:
  register: സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ ആധുനിക നിലവാര മലയാളം. പരമ്പരാഗതമായ ‘കൊല്ലരുത്’ അടിക്കുറിപ്പിൽ നിലനിർത്തിക്കൊണ്ട്, മൂലഹീബ്രുവിന്റെ കൂടുതൽ നിർദിഷ്ടമായ അർത്ഥം മുഖ്യപാഠത്തിൽ നൽകി.
