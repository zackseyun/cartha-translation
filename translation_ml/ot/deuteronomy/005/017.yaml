  source_fidelity: മുഖ്യപാഠത്തിലെ “കൊല ചെയ്യരുത്” ഹീബ്രു לֹא תִּרְצָח എന്ന സംക്ഷിപ്ത നിരോധനത്തെ വിശ്വസ്തമായി പ്രതിനിധീകരിക്കുന്നു. רָצַח എന്ന ക്രിയയുടെ സാധാരണമായ ‘കൊലപാതകം/നിയമവിരുദ്ധമായ മനുഷ്യഹത്യ’ എന്ന പരിമിത അർഥം ‘കൊല’ വഴി യുക്തമായി സൂചിപ്പിക്കുന്നു; എല്ലാ തരത്തിലുള്ള ജീവഹരണത്തിനുമുള്ള സമ്പൂർണ നിരോധനം മുഖ്യപാഠം അനാവശ്യമായി അടിച്ചേൽപ്പിക്കുന്നില്ല.
  naturalness: “കൊല ചെയ്യരുത്” ആധുനിക നിലവാര മലയാളത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവും കല്പനയുടെ ഗൗരവത്തിനൊത്തതുമാണ്. വാക്യത്തിന്റെ ചുരുക്കം മൂലപാഠത്തിന്റെ ശൈലിയോടും ചേരുന്നു.
  terminology: ‘കൊല’ ഇവിടെ ‘murder’ എന്നതിന് ഉപയോഗിക്കാവുന്ന സ്വാഭാവിക മലയാളപദമാണ്. അടിക്കുറിപ്പിലെ ‘കൊല്ലരുത്’ പരമ്പരാഗതവും വിശാലാർഥവുമായ ബദൽ വായനയെ വ്യക്തമായി രേഖപ്പെടുത്തുന്നു. ‘നിയമവിരുദ്ധമായ മനുഷ്യഹത്യ’ എന്ന വിശദീകരണം ലെക്സിക്കൽ വ്യത്യാസം ആവശ്യത്തിന് വ്യക്തമാക്കുന്നു.
