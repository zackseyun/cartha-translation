language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: מִֽי יִתֵּ֡ן וְ/הָיָה֩ לְבָבָ֨/ם זֶ֜ה לָ/הֶ֗ם לְ/יִרְאָ֥ה אֹתִ֛/י וְ/לִ/שְׁמֹ֥ר אֶת כָּל מִצְוֺתַ֖/י כָּל הַ/יָּמִ֑ים לְמַ֨עַן יִיטַ֥ב לָ/הֶ֛ם וְ/לִ/בְנֵי/הֶ֖ם לְ/עֹלָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/029.yaml
  text: Oh[a], that they had such a heart as this always—to fear me and to keep all my commandments all their days—so that it might go well with them and with their children forever!
translation:
  language: ml
  text: അവർക്ക് എന്നെ ഭയപ്പെടാനും എന്റെ സകല കല്പനകളും ജീവിതകാലം മുഴുവൻ പാലിക്കാനും ഇങ്ങനെയുള്ള ഒരു ഹൃദയം എപ്പോഴും ഉണ്ടായിരുന്നെങ്കിൽ![a] അങ്ങനെ അവർക്കും അവരുടെ മക്കൾക്കും എന്നേക്കും നന്മയുണ്ടാകേണ്ടതിന്!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “അവർക്ക് ഇങ്ങനെയുള്ള ഒരു ഹൃദയം ഉണ്ടായിരുന്നെങ്കിൽ മാത്രം!” എബ്രായത്തിലെ ആരംഭപ്രയോഗം ശക്തമായ ആഗ്രഹം പ്രകടിപ്പിക്കുന്ന ശൈലിയാണ്; അക്ഷരാർഥം: “ആർ തരും...?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: ഉണ്ടായിരുന്നെങ്കിൽ!
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘ആർ തരും?’ എന്ന ചോദ്യമല്ല, ശക്തമായ ആഗ്രഹം പ്രകടിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്; മലയാളത്തിൽ ആശംസാഭാവമുള്ള നിബന്ധനാരൂപം സ്വാഭാവികമായി അതിന്റെ വികാരശക്തി നൽകുന്നു.
- source_word: לְבָבָם זֶה לָהֶם
  choice: അവർക്ക് ഇങ്ങനെയുള്ള ഒരു ഹൃദയം
  rationale: ‘ഹൃദയം’ മനുഷ്യന്റെ ആന്തരിക മനോഭാവം, ഇച്ഛ, ചിന്ത എന്നിവ ഉൾക്കൊള്ളുന്ന ബൈബിൾസംബന്ധിയായ രൂപകം നിലനിർത്തുന്നു; זֶה ഇവിടെ ഹൃദയത്തിന്റെ സ്വഭാവത്തെ ചൂണ്ടുന്നതിനാൽ ‘ഇങ്ങനെയുള്ള’ എന്നു നൽകി.
- source_word: לְיִרְאָה אֹתִי
  choice: എന്നെ ഭയപ്പെടാനും
  rationale: ദൈവത്തോടുള്ള ഭക്തിപൂർവമായ ഭയവും അനുസരണബോധവും ഉൾക്കൊള്ളുന്ന ഉടമ്പടിപദത്തിന്റെ ശക്തി ‘ഭയപ്പെടുക’ നിലനിർത്തുന്നു.
- source_word: וְלִשְׁמֹר אֶת כָּל מִצְוֺתַי
  choice: എന്റെ സകല കല്പനകളും ... പാലിക്കാനും
  rationale: കല്പനകളോടൊപ്പം שׁמר അനുസരണയോടെ ആചരിക്കുക എന്നർഥം നൽകുന്നു; ‘പാലിക്കുക’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: כָּל הַיָּמִים
  choice: ജീവിതകാലം മുഴുവൻ
  rationale: ‘എല്ലാ ദിവസങ്ങളും’ എന്ന അക്ഷരാർഥം ഇവിടെ അവരുടെ ജീവിതമൊട്ടാകെയുള്ള തുടർച്ചയെ സൂചിപ്പിക്കുന്നു.
- source_word: לְמַעַן יִיטַב לָהֶם
  choice: അപ്പോൾ അവർക്കും ... നന്മയുണ്ടാകും
  rationale: ലക്ഷ്യവും ഫലവും ബന്ധിപ്പിക്കുന്ന לְמַעַן എന്ന പദവും ഉടമ്പടിയിലെ സമഗ്ര ക്ഷേമത്തെ സൂചിപ്പിക്കുന്ന יִיטַב എന്ന ക്രിയയും സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ഭൗതിക സമൃദ്ധി മാത്രം എന്നു ചുരുക്കുന്നില്ല.
- source_word: וְלִבְנֵיהֶם לְעֹלָם
  choice: അവരുടെ മക്കൾക്കും എന്നേക്കും
  rationale: בנים ഇവിടെ സന്തതിയെ പൊതുവായി സൂചിപ്പിക്കുന്നതിനാൽ ‘മക്കൾ’ യോജിക്കുന്നു; לְעֹלָם എന്നതിന്റെ കാലവ്യാപ്തി ‘എന്നേക്കും’ നിലനിർത്തുന്നു.
theological_decisions:
- issue: לְבָבָם എന്ന മനുഷ്യശാസ്ത്രപരമായ ഭാഷ
  choice: ഹൃദയം
  alternative: മനസ്സ് / ആന്തരിക മനോഭാവം
  rationale: വെറും ബൗദ്ധിക പ്രവർത്തനമല്ല, ദൈവത്തോടുള്ള ആന്തരിക ഇച്ഛയും നൈതിക-ആത്മീയ നിലപാടും ഉൾക്കൊള്ളുന്ന മൂലഭാഷയിലെ രൂപകം സംരക്ഷിക്കുന്നു.
- issue: וְלִבְנֵיהֶם എന്നതിലെ വ്യാകരണലിംഗം
  choice: അവരുടെ മക്കൾ
  alternative: അവരുടെ പുത്രന്മാർ
  rationale: ഉടമ്പടിസന്ദർഭത്തിൽ ഈ പദം ആൺമക്കളെ മാത്രം അല്ല, സന്തതിയെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
- issue: לְמַעַן എന്നതിലെ ഉദ്ദേശ്യം/ഫലം ബന്ധം
  choice: അപ്പോൾ ... നന്മയുണ്ടാകും
  alternative: അങ്ങനെ ... നന്മയുണ്ടാകേണ്ടതിന്
  rationale: ഉദ്ദേശ്യവും പ്രതീക്ഷിത ഫലവും തമ്മിലുള്ള മൂലവാക്യത്തിലെ ബന്ധം തുറന്നുവെച്ചുകൊണ്ട് സ്വാഭാവിക മലയാളം ഉപയോഗിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. ‘ഹൃദയം,’ ‘ഭയപ്പെടുക,’ ‘കല്പനകൾ’ എന്നീ പ്രധാന ബൈബിൾ പദങ്ങൾ നിലനിർത്തി; വാക്യഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കി.
