lexical_decisions:
- source_word: וְ/לֹא
  choice: ചെയ്യരുത്
  rationale: לֹא സഹിതമുള്ള അപൂർണക്രിയ ഇവിടെ നിയമപരമായ വിലക്ക് അറിയിക്കുന്നു. വാക്യാരംഭത്തിലെ וְ ചുറ്റുമുള്ള കല്പനകളോടുള്ള തുടർച്ച സൂചിപ്പിക്കുന്നുവെങ്കിലും, മലയാളത്തിലെ സ്വാഭാവിക കല്പനാശൈലിയിൽ പ്രത്യേകമായി ‘കൂടാതെ’ എന്നു ചേർക്കാതെ ആ ബന്ധം നിലനിർത്താം; അതിന്റെ സാന്നിധ്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: תִּנְאָף
  choice: വ്യഭിചാരം ചെയ്യരുത്
  rationale: נאף എന്ന ക്രിയയുടെ ലൈംഗികവും വിവാഹവിശ്വസ്തത ലംഘിക്കുന്നതുമായ അർഥം ആധുനിക മലയാളത്തിൽ കൃത്യമായും മാന്യമായും ‘വ്യഭിചാരം ചെയ്യുക’ എന്നു പ്രകടമാകുന്നു. രണ്ടാം പുരുഷ ഏകവചന അഭിസംബോധന മലയാളത്തിലെ വിലക്കുരൂപത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
theological_decisions:
- issue: ഉടമ്പടി നിയമത്തിലെ രണ്ടാം പുരുഷ ഏകവചന വിലക്ക്
  choice: വ്യഭിചാരം ചെയ്യരുത്.
  alternative: വ്യഭിചാരം ചെയ്യുകയില്ല.
  rationale: ഹീബ്രു രൂപം നേരിട്ടുള്ള നിയമവിലക്കാണ്. മലയാളത്തിൽ ‘ചെയ്യരുത്’ അതിന്റെ നിർബന്ധസ്വഭാവവും നേരിട്ടുള്ള അഭിസംബോധനയും വ്യക്തമായി നൽകുന്നു; ‘ചെയ്യുകയില്ല’ ഭാവികാല പ്രസ്താവനയായി തെറ്റിദ്ധരിക്കപ്പെടാം.
- issue: കല്പനയുടെ ആരംഭത്തിലുള്ള וְ എന്ന സംയോജകം
  choice: പ്രധാനവാക്യത്തിൽ പ്രത്യേകം വിവർത്തനം ചെയ്യാതെ, അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുക
  alternative: വ്യഭിചാരം ചെയ്യുകയും അരുത്.
  rationale: וְ കല്പനകളുടെ അനുക്രമബന്ധം സൂചിപ്പിക്കുന്നു. എന്നാൽ ‘ചെയ്യുകയും അരുത്’ ആധുനിക മലയാളത്തിൽ അസ്വാഭാവികമാണ്; ‘കൂടാതെ’ ചേർത്താൽ മൂലത്തിൽ ഇല്ലാത്ത അധിക ഊന്നൽ ഉണ്ടാകാം. അതിനാൽ സ്വാഭാവിക പ്രധാനവാക്യത്തോടൊപ്പം രൂപപരമായ വിവരം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ നിയമകല്പനാശൈലി സ്വീകരിച്ചു. ‘വ്യഭിചാരം’ സാധാരണ വായനക്കാർക്ക് പരിചിതവും മൂലക്രിയയുടെ വിവാഹ-ലൈംഗിക അവിശ്വസ്തതാസൂചന നിലനിർത്തുന്നതുമായ പദമാണ്.
