  text: വ്യഭിചാരം ചെയ്യരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിൽ ഈ കല്പനയുടെ ആരംഭത്തിൽ ‘എന്ന’ അർഥമുള്ള ഒരു സംയോജകം ഉണ്ട്; അത് ഇതിനെ ചുറ്റുമുള്ള കല്പനകളുടെ നിരയോടു ബന്ധിപ്പിക്കുന്നു.
