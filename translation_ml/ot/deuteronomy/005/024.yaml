language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֹּאמְר֗וּ הֵ֣ן הֶרְאָ֜/נוּ יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ אֶת כְּבֹד֣/וֹ וְ/אֶת גָּדְל֔/וֹ וְ/אֶת קֹל֥/וֹ שָׁמַ֖עְנוּ מִ/תּ֣וֹךְ הָ/אֵ֑שׁ הַ/יּ֤וֹם הַ/זֶּה֙ רָאִ֔ינוּ כִּֽי יְדַבֵּ֧ר אֱלֹהִ֛ים אֶת הָֽ/אָדָ֖ם וָ/חָֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/024.yaml
  text: And you said, ‘Look, the LORD our God has shown us his glory and his greatness, and we have heard his voice from the midst of the fire. This day we have seen that God may speak with man, and he still lives.’
translation:
  language: ml
  text: 'നിങ്ങൾ പറഞ്ഞു: ‘ഇതാ, നമ്മുടെ ദൈവമായ യഹോവ തന്റെ മഹിമയും മഹത്വവും നമുക്കു കാണിച്ചുതന്നിരിക്കുന്നു; തീയുടെ നടുവിൽനിന്ന് അവിടുത്തെ ശബ്ദം നാം കേട്ടിരിക്കുന്നു. ദൈവം മനുഷ്യനോടു സംസാരിച്ചിട്ടും മനുഷ്യൻ ജീവനോടെ ഇരിക്കാമെന്ന് ഇന്ന് നാം കണ്ടിരിക്കുന്നു.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമത്തെ ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ സുപരിചിതമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: כְּבוֹדוֹ
  choice: തന്റെ മഹത്ത്വം
  rationale: כבוד എന്ന പദത്തിന്റെ തേജസ്സും ബഹുമാനവും മഹിമയും ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: גָּדְלוֹ
  choice: മഹത്വം
  rationale: גדל ഇവിടെ ദൈവത്തിന്റെ വലിപ്പത്തെയല്ല, അവിടുത്തെ മഹനീയതയെയും ഉന്നതതയെയും സൂചിപ്പിക്കുന്നു; മുൻപുള്ള ‘മഹത്ത്വം’ എന്നതിൽനിന്ന് വേർതിരിച്ചും സമാന്തരത നിലനിർത്തിയും പരിഭാഷപ്പെടുത്തി.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: തീയുടെ നടുവിൽനിന്ന്
  rationale: ഹീബ്രു സ്ഥലബന്ധം നേരിട്ടും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: יְדַבֵּר אֱלֹהִים אֶת־הָאָדָם וָחָי
  choice: ദൈവം മനുഷ്യനോടു സംസാരിച്ചിട്ടും മനുഷ്യൻ ജീവനോടിരിക്കാം
  rationale: സംഭവം തെളിയിച്ച പൊതുസാധ്യതയാണ് വാക്യം പ്രസ്താവിക്കുന്നത്. וָחָי എന്നതിലെ വ്യക്തമായ കർത്താവ് ആവർത്തിക്കാതെ വന്നതിനാൽ മലയാളത്തിൽ ‘മനുഷ്യൻ’ ആവർത്തിച്ച് അർത്ഥം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ദൈവം മനുഷ്യനോടു സംസാരിക്കുന്നതിന്റെ സ്വഭാവം
  choice: ‘സംസാരിച്ചിട്ടും ... ജീവനോടിരിക്കാം’ എന്ന പൊതുസാധ്യത
  alternative: ‘സംസാരിക്കുന്നു, അവൻ ജീവിക്കുന്നു’ എന്ന ഒറ്റ സംഭവത്തിന്റെ നേരിട്ടുള്ള പ്രസ്താവന
  rationale: כִּי + അപൂർണ്ണക്രിയയും തുടർന്ന് וָחָי എന്ന രൂപവും ചേർന്ന്, ദൈവവചനം നേരിട്ടു കേട്ടശേഷവും മനുഷ്യൻ ജീവിച്ചിരിക്കാമെന്ന അത്ഭുതകരമായ സാധ്യതയാണ് സന്ദർഭത്തിൽ പ്രകടമാക്കുന്നത്; അതിനെ സ്ഥിരനിയമമായോ വെറും ഭൂതകാലവിവരണമായോ കടുപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനയ്ക്ക് സുഗമവുമായ മലയാളം. ‘ഇതാ’ പ്രസംഗത്തിലെ വിസ്മയവും ശ്രദ്ധാകർഷണവും നിലനിർത്തുന്നു. ഒരേപോലെ കേൾക്കുന്ന ‘മഹത്ത്വം/മഹത്വം’ രൂപങ്ങൾ മൂലത്തിലെ כבוד/גדל വ്യത്യാസം പരമാവധി ചുരുക്കത്തിൽ സൂക്ഷിക്കുന്നു.
