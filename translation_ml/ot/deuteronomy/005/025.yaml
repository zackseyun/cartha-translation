id: DEU.5.25
reference: Deuteronomy 5:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עַתָּה֙ לָ֣/מָּה נָמ֔וּת כִּ֣י תֹֽאכְלֵ֔/נוּ הָ/אֵ֥שׁ הַ/גְּדֹלָ֖ה הַ/זֹּ֑את אִם יֹסְפִ֣ים אֲנַ֗חְנוּ לִ֠/שְׁמֹעַ אֶת ק֨וֹל יְהוָ֧ה אֱלֹהֵ֛י/נוּ ע֖וֹד וָ/מָֽתְנוּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/025.yaml
  text: And now[a], why should we die? For this great fire will consume us. If we continue to hear the voice of Yahweh our God any longer, we will die.
translation:
  language: ml
  text: ഇനി നാം എന്തിനു മരിക്കണം? ഈ വലിയ തീ നമ്മെ ദഹിപ്പിച്ചുകളയും. നമ്മുടെ ദൈവമായ യഹ്വെയുടെ ശബ്ദം ഇനിയും കേട്ടുകൊണ്ടിരുന്നാൽ നാം മരിച്ചുപോകും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: മുൻസന്ദർഭത്തിൽനിന്നുള്ള നിഗമനത്തിലേക്കു കടക്കുന്ന ബന്ധകവും കാലസൂചനയും മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: לָמָּה נָמוּת
  choice: നാം എന്തിനു മരിക്കണം?
  rationale: ഭയപ്പെട്ട് ഉന്നയിക്കുന്ന ആലങ്കാരിക ചോദ്യത്തിന്റെ ഭാവം നിലനിർത്തുന്നു; അപൂർണ്ണക്രിയയെ വെറും ഭാവികാലമായി ചുരുക്കുന്നില്ല.
- source_word: כִּי תֹאכְלֵנוּ
  choice: നമ്മെ ദഹിപ്പിച്ചുകളയും
  rationale: തീ കർത്താവായിരിക്കുമ്പോൾ אכל എന്ന ‘തിന്നുക’ എന്ന ദൃശ്യഭാഷയുടെ നാശകരമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הָאֵשׁ הַגְּדֹלָה הַזֹּאת
  choice: ഈ മഹാഗ്നി
  rationale: നിർദ്ദേശകവും തീയുടെ മഹത്ത്വവും ശക്തിയും ചുരുക്കമായും ഗൗരവത്തോടെയും സംരക്ഷിക്കുന്നു.
- source_word: אִם יֹסְפִים אֲנַחְנוּ לִשְׁמֹעַ
  choice: കേട്ടുകൊണ്ടിരുന്നാൽ
  rationale: יסף + ധാതുരൂപം സൂചിപ്പിക്കുന്ന തുടർച്ചയെ മലയാളത്തിലെ തുടർച്ചാസ്വഭാവമുള്ള പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: קוֹל
  choice: ശബ്ദം
  rationale: ദൈവിക സംസാരത്തിന്റെ കേൾവിയനുഭവം സൂചിപ്പിക്കുന്നു; ‘സ്വരം’ എന്നതിനെക്കാൾ സാധാരണ വായനക്കാർക്ക് നേരിട്ടും സ്വാഭാവികവുമാണ്.
- source_word: יְהוָה
  choice: യഹ്വെ
  rationale: എബ്രായ ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയാക്കി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֵינוּ
  choice: നമ്മുടെ ദൈവമായ
  rationale: ഉടമസ്ഥബന്ധവും ഉടമ്പടിബന്ധത്തിന്റെ ഭാഷയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עוֹד
  choice: ഇനിയും
  rationale: ഇതിനു ശേഷവും തുടർന്നുകേൾക്കുക എന്ന ഭയാശങ്കയുള്ള സോപാധിക അർഥം നൽകുന്നു.
- source_word: וָמָתְנוּ
  choice: നാം മരിച്ചുപോകും
  rationale: സോപാധിക വാക്യത്തിന്റെ ഉറപ്പുള്ള ഭയഫലത്തെ വ്യക്തമായ ഭാവികാലത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ഒരു പദവിയാൽ പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നത് മൂലരൂപത്തെ കൂടുതൽ സുതാര്യമായി സംരക്ഷിക്കുന്നു.
- issue: ജനത്തിന്റെ മരണഭയത്തിന്റെ ഭാവം
  choice: ആലങ്കാരിക ചോദ്യം, തുടർന്ന് ഉറപ്പോടെ പ്രതീക്ഷിക്കുന്ന ഫലം
  alternative: 'വെറും ഭാവികാലചോദ്യം: ‘നാം എന്തിനു മരിക്കും?’'
  rationale: נָמוּת എന്ന അപൂർണ്ണക്രിയ ഇവിടെ ആലോചനാപരവും ഭയാശങ്കയുള്ളതുമായ ചോദ്യത്തിലാണ്; അവസാനത്തെ וָמָתְנוּ സോപാധിക ഫലത്തെ ഉറപ്പോടെ പറയുന്നു. ഈ വ്യത്യാസം പരിഭാഷയിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മഹാഗ്നി’ എന്ന പദം വചനത്തിന്റെ ഭയഗാംഭീര്യം നിലനിർത്തുന്നു; മറ്റു വാക്യഘടകങ്ങൾ സാധാരണ വായനക്കാർക്കു നേരിട്ട് മനസ്സിലാകുന്ന രീതിയിലാണ്. അടിക്കുറിപ്പുകളില്ലാത്തതിനാൽ മുഖ്യപാഠത്തിൽ അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ചേർത്തിട്ടില്ല.
