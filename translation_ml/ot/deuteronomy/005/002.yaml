  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: יְהוָ֣ה אֱלֹהֵ֗י/נוּ כָּרַ֥ת עִמָּ֛/נוּ בְּרִ֖ית בְּ/חֹרֵֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/002.yaml
  text: Yahweh our God made a covenant with us at Horeb[a].
translation:
  language: ml
  text: നമ്മുടെ ദൈവമായ യാഹ്‌വെ ഹോരേബിൽവെച്ച് നമ്മോടു ഒരു ഉടമ്പടി ചെയ്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “ഹോരേബിൽവെച്ച് നമ്മോടു ഒരു ഉടമ്പടി മുറിച്ചു.”
    reason: כרת ברית എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അക്ഷരാർഥം രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, ഹീബ്രു ഉച്ചാരണത്തെ സൂചിപ്പിക്കുന്ന വിധത്തിൽ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: אֱלֹהֵינוּ
  choice: നമ്മുടെ ദൈവം
  rationale: ഒന്നാംപുരുഷ ബഹുവചന പ്രത്യയം ഉൾപ്പെടുന്ന രൂപത്തിന്റെ നേരായ അർഥവും ഉടമ്പടിബന്ധവും നിലനിർത്തുന്നു.
- source_word: כָּרַת
  choice: ചെയ്തു
  rationale: כרת ברית എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; അക്ഷരാർഥമായ ‘മുറിച്ചു’ എന്ന പശ്ചാത്തലം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: בְּרִית
  choice: ഉടമ്പടി
  rationale: ദൈവവും ഇസ്രായേലും തമ്മിലുള്ള ഗൗരവമുള്ള ബന്ധക്രമത്തെ സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾഭാഷയിലും പൊതുഭാഷയിലും മനസ്സിലാകുന്ന പദം.
- source_word: עִמָּנוּ
  choice: നമ്മോടു
  rationale: ‘ഞങ്ങളോടൊപ്പം/ഞങ്ങളുമായി’ എന്ന ബന്ധാർഥം സ്വാഭാവികമായ മലയാള വാക്യഘടനയിൽ നൽകുന്നു.
- source_word: בְּחֹרֵב
  choice: ഹോരേബിൽവെച്ച്
  rationale: സ്ഥലനാമം ലിപ്യന്തരിച്ചു; בְּ എന്ന സ്ഥലസൂചകത്തിന്റെ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം തന്നെയായതിനാൽ ഒരു ബിരുദം പകരംവയ്ക്കാതെ ലിപ്യന്തരണം ഉപയോഗിച്ചു. ‘യാഹ്‌വെ’ എന്ന രൂപം സാധ്യതയേറിയ ഹീബ്രു ഉച്ചാരണത്തെ പ്രതിഫലിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നമ്മുടെ ദൈവമായ യാഹ്‌വെ’ എന്ന ഘടന മൂലത്തിലെ പദബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു; അപൂർവമായ ഹീബ്രു ശൈലി മുഖ്യവാക്യത്തിൽ അനുകരിക്കാതെ അടിക്കുറിപ്പിൽ നൽകുന്നു.
