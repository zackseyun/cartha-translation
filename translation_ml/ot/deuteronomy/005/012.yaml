source:
  edition: WLC
  text: שָׁמ֛וֹר אֶת י֥וֹם הַ/שַׁבָּ֖ת לְ/קַדְּשׁ֑/וֹ כַּ/אֲשֶׁ֥ר צִוְּ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/012.yaml
  text: Observe the Sabbath day[a], to keep it holy, as Yahweh your God commanded you.
translation:
  language: ml
  text: ശബ്ബത്ത് ദിവസം വിശുദ്ധമായി ആചരിക്കേണ്ടതിന്, നിന്റെ ദൈവമായ യഹ്‌വെ നിന്നോടു കല്പിച്ചതുപോലെ അതിനെ കാത്തുപാലിക്കൂ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ശബ്ബത്ത് ദിവസം പാലിക്കൂ” അല്ലെങ്കിൽ “ശബ്ബത്ത് ദിവസം കാത്തുസൂക്ഷിക്കൂ.” ഹീബ്രായ ക്രിയ ശ്രദ്ധാപൂർവമായ കാത്തുപാലിക്കലിന് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמוֹר
  choice: ശ്രദ്ധയോടെ പാലിക്കുക
  rationale: ഇവിടെ ആജ്ഞാർഥത്തിൽ വരുന്ന ക്രിയ ശ്രദ്ധാപൂർവമായ അനുഷ്ഠാനത്തെയും കാത്തുപാലിക്കലിനെയും സൂചിപ്പിക്കുന്നു. ‘പാലിക്കുക’ സ്വാഭാവികമായ മലയാളമാണ്; ‘ശ്രദ്ധയോടെ’ എന്നത് ഹീബ്രായ പദത്തിന്റെ ഊന്നൽ വ്യക്തമാക്കുന്നു.
- source_word: יוֹם הַשַׁבָּת
  choice: ശബ്ബത്തുദിവസം
  rationale: പ്രത്യേകമായി നിശ്ചയിക്കപ്പെട്ട ശബ്ബത്ത് ദിവസത്തെ സൂചിപ്പിക്കുന്ന, ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: לְקַדְּשׁוֹ
  choice: വിശുദ്ധമായി ആചരിക്കാൻ
  rationale: ലാമെദ് സഹിതമുള്ള infinitive ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു. ദിവസം വിശുദ്ധമായി വേർതിരിച്ച് അനുഷ്ഠിക്കണമെന്ന ആശയം ‘വിശുദ്ധമായി ആചരിക്കാൻ’ സ്വാഭാവികമായി നൽകുന്നു; അതിന് സ്വതവേ വിശുദ്ധി ഉണ്ടാക്കുന്നു എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: כַּאֲשֶׁר
  choice: പോലെ
  rationale: മുമ്പ് നൽകിയ ദൈവിക കല്പനയോടുള്ള യോജിപ്പ് ലളിതമായും സ്വാഭാവികമായും വ്യക്തമാക്കുന്നു.
- source_word: צִוְּךָ
  choice: നിന്നോടു കല്പിച്ചതുപോലെ
  rationale: צוה എന്ന ക്രിയയിലെ അധികാരപൂർവമായ ആജ്ഞാഭാവം ‘കല്പിച്ചു’ കൃത്യമായി നൽകുന്നു; രണ്ടാം പുരുഷ ഏകവചന പ്രത്യയം ‘നിന്നോടു’ എന്നു നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിലെ സ്വാഭാവിക ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവം
  rationale: രണ്ടാം പുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയമുള്ള ഉടമ്പടിപരമായ അഭിസംബോധനയെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം തന്നെയാണ് ഉള്ളത്. അതിനാൽ ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു പകരാതെ, ദൈവനാമം മലയാളത്തിൽ ലിപ്യന്തരിച്ചു; ‘യഹ്‌വെ’ സാധാരണ പണ്ഡിതപുനർനിർമാണത്തോട് ചേർന്ന രൂപമാണ്.
- issue: ശബ്ബത്തുദിവസത്തെ വിശുദ്ധമാക്കുക എന്നതിന്റെ അർഥം
  choice: വിശുദ്ധമായി ആചരിക്കാൻ
  alternative: അതിനെ വിശുദ്ധമാക്കാൻ; അതിനെ ശുദ്ധീകരിക്കാൻ
  rationale: קדש ഇവിടെ ദിവസത്തെ വിശുദ്ധമായി വേർതിരിച്ച് പരിഗണിക്കുകയും അനുഷ്ഠിക്കുകയും ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ദിവസം അശുദ്ധമായിരുന്നു, മനുഷ്യൻ അതിന് ആന്തരിക വിശുദ്ധി സൃഷ്ടിക്കുന്നു എന്ന അനാവശ്യ വ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഏകവചന അഭിസംബോധന നിലനിർത്തി. ‘ശ്രദ്ധയോടെ പാലിക്കുക’ എന്ന പ്രയോഗം ഹീബ്രായ ആജ്ഞയുടെ ഊന്നൽ വ്യക്തമാക്കുന്നു; പദക്രമം മലയാളത്തിന്റെ സ്വാഭാവിക ഒഴുക്കിനായി ക്രമപ്പെടുത്തി.
