source:
  edition: WLC
  text: לֹ֣א אֶת אֲבֹתֵ֔י/נוּ כָּרַ֥ת יְהוָ֖ה אֶת הַ/בְּרִ֣ית הַ/זֹּ֑את כִּ֣י אִתָּ֗/נוּ אֲנַ֨חְנוּ אֵ֥לֶּה פֹ֛ה הַ/יּ֖וֹם כֻּלָּ֥/נוּ חַיִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/003.yaml
  text: It was not with our fathers that Yahweh made this covenant[a], but with us—with us[c][b] who are all here alive today.
translation:
  language: ml
  text: യഹ്‌വെ ഈ ഉടമ്പടി[b] നമ്മുടെ പിതാക്കന്മാരോടല്ല[a], ഇന്ന് ഇവിടെ ജീവനോടിരിക്കുന്ന നമ്മളായ എല്ലാവരോടാണ്[c] ചെയ്തത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നമ്മുടെ പൂർവികരോട്.’ എബ്രായത്തിൽ അക്ഷരാർഥമായി ‘നമ്മുടെ പിതാക്കന്മാരോട്’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥമായി, ‘ഈ ഉടമ്പടി മുറിച്ചു.’
    reason: lexical_alternative
  - marker: c
    text: 'ഈ വിരോധത്തെ ചിലർ അലങ്കാരപരമായി മനസ്സിലാക്കുന്നു: നമ്മുടെ പിതാക്കന്മാരോടു മാത്രമല്ല, വിശേഷിച്ച് ഇന്ന് ഇവിടെ ജീവനോടിരിക്കുന്ന നമ്മളോടും.'
    reason: alternative_reading
lexical_decisions:
- source_word: כָּרַת ... אֶת הַבְּרִית
  choice: ഉടമ്പടി ചെയ്തു
  rationale: എബ്രായ പ്രയോഗത്തിന്റെ അക്ഷരാർഥം ‘ഉടമ്പടി മുറിച്ചു’ എന്നാണെങ്കിലും, അതിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘ഉടമ്പടി ചെയ്തു’ എന്നു നൽകുന്നു; הַזֹּאת എന്ന നിർദേശകത്തിന്റെ അർഥം ‘ഈ’ എന്നതിലൂടെ നിലനിർത്തി.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, ‘Yahweh’ എന്ന ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: אֲבֹתֵינוּ
  choice: നമ്മുടെ പിതാക്കന്മാർ
  rationale: എബ്രായത്തിലെ ‘ഞങ്ങളുടെ/നമ്മുടെ പിതാക്കന്മാർ’ എന്ന വ്യക്തമായ പദപ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; വിശാലമായ ‘പൂർവികർ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: כִּי
  choice: അല്ല, നമ്മോടാണ്
  rationale: മുൻപുള്ള നിഷേധത്തോടുള്ള ശക്തമായ വിരോധം മലയാളത്തിലെ ‘അല്ല ... ആണ്’ എന്ന ഘടനയിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: אִתָּנוּ אֲנַחְנוּ אֵלֶּה
  choice: നമ്മോടാണ്—... നമ്മോടെല്ലാവരോടും
  rationale: ‘നമ്മോടു, നമ്മൾ, ഇവർ’ എന്ന എബ്രായ ഊന്നൽ മലയാളത്തിൽ ആവർത്തനവും ദീർഘവിരാമവും ഉപയോഗിച്ച് പുനരാവിഷ്കരിക്കുന്നു.
- source_word: פֹה הַיּוֹם כֻּלָּנוּ חַיִּים
  choice: ഇന്ന് ഇവിടെ ജീവനോടിരിക്കുന്ന നമ്മോടെല്ലാവരോടും
  rationale: ‘ഇന്ന്’, ‘ഇവിടെ’, ‘എല്ലാവരും’, ‘ജീവനോടിരിക്കുന്നവർ’ എന്നീ ഘടകങ്ങളെല്ലാം സ്വാഭാവികമായ മലയാള ക്രമത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ഈ വാക്യം പിതാക്കന്മാർക്ക് ഉടമ്പടിയുമായി യാതൊരു ബന്ധവുമില്ലെന്ന് പൂർണമായി നിഷേധിക്കുന്നുവോ, അതോ ഇപ്പോഴത്തെ തലമുറയ്ക്കുള്ള ഉടമ്പടിയുടെ പ്രസക്തിയെ ഊന്നുന്നുവോ
  choice: ‘പിതാക്കന്മാരോടല്ല, നമ്മോടാണ്’ എന്ന എബ്രായത്തിലെ പ്രത്യക്ഷ വിരോധം വ്യാഖ്യാനപരമായ പരിമിതിപ്പദം ചേർക്കാതെ നിലനിർത്തി.
  alternative: ‘നമ്മുടെ പിതാക്കന്മാരോടു മാത്രമല്ല’ എന്നോ, ഉടമ്പടി പുതുക്കലിനെ ഊന്നുന്ന അലങ്കാരപരമായ വിരോധമെന്നോ മനസ്സിലാക്കാം.
  rationale: മൂലപാഠത്തിൽ ‘മാത്രം’ എന്ന പരിമിതിപ്പദമില്ല. അതിനാൽ ദൈവശാസ്ത്രപരമായ സംഘർഷം മുഖ്യപാഠത്തിൽ പരിഹരിക്കാതെ, മറ്റൊരു വായന അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘യഹ്‌വെ’ ദൈവനാമത്തെ ലിപ്യന്തരണം ചെയ്യുന്നു. ദീർഘവിരാമവും ആവർത്തനവും മൂലപാഠത്തിലെ ഇപ്പോഴത്തെ തലമുറയോടുള്ള ഊന്നൽ സൂക്ഷിക്കുന്നു.
