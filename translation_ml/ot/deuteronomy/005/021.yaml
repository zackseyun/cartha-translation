revisions:
- from: നിന്റെ അയൽക്കാരന്റെ ഭാര്യയെ നീ മോഹിക്കരുത്;[a] നിന്റെ അയൽക്കാരന്റെ വീടോ,[b] വയലോ, പുരുഷ അടിമയെയോ, സ്ത്രീ അടിമയെയോ, കാളയെയോ, കഴുതയെയോ, നിന്റെ അയൽക്കാരനുള്ള യാതൊന്നിനെയുമോ നീ ആഗ്രഹിക്കരുത്.
  to: നിന്റെ അയൽക്കാരന്റെ ഭാര്യയെ നീ മോഹിക്കരുത്;[a] നിന്റെ അയൽക്കാരന്റെ വീടിനെയോ,[b] അവന്റെ വയലിനെയോ, പുരുഷ അടിമയെയോ, സ്ത്രീ അടിമയെയോ, കാളയെയോ, കഴുതയെയോ, നിന്റെ അയൽക്കാരന്റേതായ യാതൊന്നിനെയുമോ നീ ആഗ്രഹിക്കരുത്.
  rationale: The revision corrects the possessive sense of the concluding Hebrew phrase and regularizes the object marking of ‘house.’ It retains the source order, all enumerated items, the two distinct prohibition verbs, and both properly anchored footnotes.
