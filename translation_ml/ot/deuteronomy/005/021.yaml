id: DEU.5.21
reference: Deuteronomy 5:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לֹ֥א תַחְמֹ֖ד אֵ֣שֶׁת רֵעֶ֑/ךָ וְ/לֹ֨א תִתְאַוֶּ֜ה בֵּ֣ית רֵעֶ֗/ךָ שָׂדֵ֜/הוּ וְ/עַבְדּ֤/וֹ וַ/אֲמָת/וֹ֙ שׁוֹר֣/וֹ וַ/חֲמֹר֔/וֹ וְ/כֹ֖ל אֲשֶׁ֥ר לְ/רֵעֶֽ/ךָס׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/021.yaml
  text: And you shall not covet your neighbor’s wife[a], and you shall not desire your neighbor’s house, his field, his male servant, his female servant, his ox, his donkey[b], or anything that belongs to your neighbor.
translation:
  language: ml
  text: നിന്റെ അയൽക്കാരന്റെ ഭാര്യയെ നീ മോഹിക്കരുത്;[a] നിന്റെ അയൽക്കാരന്റെ വീടിനെയോ,[b] അവന്റെ വയലിനെയോ, പുരുഷ അടിമയെയോ, സ്ത്രീ അടിമയെയോ, കാളയെയോ, കഴുതയെയോ, നിന്റെ അയൽക്കാരന്റേതായ യാതൊന്നിനെയുമോ നീ ആഗ്രഹിക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘മോഹിക്കുക’ എന്നും പിന്നീട് ‘ആഗ്രഹിക്കുക’ എന്നും പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നത് അർത്ഥത്തിൽ ബന്ധപ്പെട്ടെങ്കിലും വ്യത്യസ്തമായ രണ്ട് ഹീബ്രു ക്രിയകളാണ്. ഈ വ്യത്യാസം നിരോധനത്തിന് ഊന്നലോ ഭാഷാവൈവിധ്യമോ നൽകുന്നതാകാം.
    reason: lexical_alternative
  - marker: b
    text: ‘വീട്’ എന്നതിന് ‘കുടുംബം’ അല്ലെങ്കിൽ ‘കുടുംബസ്വത്ത്’ എന്ന വിശാലമായ അർത്ഥവും വരാം; എന്നാൽ പിന്നാലെ സ്വത്തുക്കൾ പട്ടികപ്പെടുത്തുന്നതിനാൽ ഇവിടെ വീട് അഥവാ വസ്തുവക എന്ന അർത്ഥമാണ് കൂടുതൽ സാധ്യതയുള്ളത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַחְמֹד
  choice: മോഹിക്കരുത്
  rationale: חמד മറ്റൊരാളുടേതിനോടുള്ള അനുചിതമായ മോഹത്തെ സൂചിപ്പിക്കുന്നു. ‘മോഹിക്കുക’ ആ ധാർമ്മിക ഗൗരവം നിലനിർത്തുകയും തുടർന്നുള്ള אוה എന്ന ക്രിയയിൽനിന്ന് വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: אֵשֶׁת רֵעֶךָ
  choice: നിന്റെ അയൽക്കാരന്റെ ഭാര്യ
  rationale: ഹീബ്രു സംയുക്തപ്രയോഗത്തിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: תִתְאַוֶּה
  choice: ആഗ്രഹിക്കരുത്
  rationale: אוה എന്ന ക്രിയ חמד-യുമായി അർത്ഥസാമ്യമുള്ളതാണെങ്കിലും അതേ പദമല്ല. ‘ആഗ്രഹിക്കുക’ എന്നു നൽകുന്നത് മൂലപാഠത്തിലെ ക്രിയാഭേദം സംരക്ഷിക്കുന്നു.
- source_word: בֵּית רֵעֶךָ
  choice: നിന്റെ അയൽക്കാരന്റെ വീട്
  rationale: בַּיִת വീടിനെയോ വിശാലമായ അർത്ഥത്തിൽ കുടുംബസ്വത്തിനെയോ സൂചിപ്പിക്കാം; പിന്നാലെയുള്ള സ്വത്തുക്കളുടെ പട്ടിക ഇവിടെ ‘വീട്’ എന്ന അർത്ഥത്തെ പിന്തുണയ്ക്കുന്നു.
- source_word: שָׂדֵהוּ
  choice: വയൽ
  rationale: שָׂדֶה എന്നതിന്റെ സാധാരണവും സന്ദർഭോചിതവുമായ അർത്ഥം ‘വയൽ’ ആണ്; ആവർത്തിക്കുന്ന ഉടമസ്ഥസർവനാമം മലയാളത്തിലെ പട്ടികാസംരചനയിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: עַבְדּוֹ
  choice: പുരുഷ അടിമ
  rationale: ഗൃഹസ്വത്തിന്റെ പട്ടികയിൽ ബന്ധിതമായ അടിമസ്ഥിതി പ്രസക്തമാണ്; ലിംഗഭേദവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: אֲמָתוֹ
  choice: സ്ത്രീ അടിമ
  rationale: אָמָה സ്ത്രീയായ അടിമയെ സൂചിപ്പിക്കുന്നു; മുൻപുള്ള പുരുഷ അടിമയുമായുള്ള ലിംഗജോടി സംരക്ഷിക്കുന്നു.
- source_word: שׁוֹרוֹ
  choice: കാള
  rationale: שׁוֹר സാധാരണയായി കാളയെയോ ഭാരവാഹിയായ ഗോവിനെയോ സൂചിപ്പിക്കുന്നു; നിയമസന്ദർഭത്തിൽ ‘കാള’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: חֲמֹרוֹ
  choice: കഴുത
  rationale: חֲמוֹר എന്നതിന്റെ വ്യക്തവും ആധുനികവുമായ മലയാളസമാനപദം.
- source_word: וְכֹל אֲשֶׁר לְרֵעֶךָ
  choice: നിന്റെ അയൽക്കാരനുള്ള യാതൊന്നും
  rationale: അയൽക്കാരന്റെ ഉടമസ്ഥതയിലുള്ള എല്ലാറ്റിനെയും ഉൾക്കൊള്ളുന്ന സമഗ്രമായ നിരോധനം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: רֵעֶךָ
  choice: നിന്റെ അയൽക്കാരൻ
  rationale: רֵעַ ഇവിടെ പരസ്പരബന്ധത്തിലുള്ള മറ്റൊരാളെ സൂചിപ്പിക്കുന്നു; ‘അയൽക്കാരൻ’ സ്ഥാപിതവും പൊതുവെ മനസ്സിലാകുന്നതുമായ പരിഭാഷയാണ്.
theological_decisions:
- issue: കല്പനയിലെ രണ്ട് നിരോധനക്രിയകളെ വേർതിരിക്കൽ
  choice: חמד എന്നതിന് ‘മോഹിക്കുക’, אוה എന്നതിന് ‘ആഗ്രഹിക്കുക’
  alternative: രണ്ടിനും ഒരേ പദമായി ‘മോഹിക്കുക’ അല്ലെങ്കിൽ ‘ആഗ്രഹിക്കുക’ ഉപയോഗിക്കുക
  rationale: ഹീബ്രു പാഠം അർത്ഥത്തിൽ ബന്ധപ്പെട്ടെങ്കിലും വ്യത്യസ്തമായ രണ്ട് ക്രിയകൾ ഉപയോഗിക്കുന്നു. അവയെ വേർതിരിക്കുന്നത് ആവർത്തനത്തിലെ ഊന്നലും സൂക്ഷ്മമായ അർത്ഥവ്യത്യാസവും അനാവശ്യമായി ഇല്ലാതാക്കുന്നില്ല.
- issue: അടിമസ്ഥിതിയെ സൂചിപ്പിക്കുന്ന പദങ്ങളുടെ പരിഭാഷ
  choice: ‘പുരുഷ അടിമ’, ‘സ്ത്രീ അടിമ’
  alternative: ‘ദാസൻ’, ‘ദാസി’ അല്ലെങ്കിൽ ‘വേലക്കാരൻ’, ‘വേലക്കാരി’
  rationale: ഗൃഹസ്വത്തുക്കളുടെ പട്ടികയിൽ ബന്ധിതമായ അടിമസ്ഥിതി വ്യക്തമായി പ്രസക്തമാണ്. ‘അടിമ’ അതിനെ മറച്ചുവയ്ക്കാതെ അറിയിക്കുകയും ഹീബ്രുവിലെ ലിംഗഭേദം നിലനിർത്തുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കല്പനാശൈലി ഉപയോഗിച്ചു. പട്ടികയുടെ നീളം വായനാസൗകര്യത്തോടെ നിലനിർത്താൻ ഉടമസ്ഥസർവനാമം ഓരോ ഇനത്തോടും ആവർത്തിക്കാതെ മലയാളത്തിലെ ‘-ഓ’ ഘടന ഉപയോഗിച്ചു; മൂലപാഠത്തിലെ എല്ലാ ഇനങ്ങളും ക്രമവും സംരക്ഷിച്ചു.
