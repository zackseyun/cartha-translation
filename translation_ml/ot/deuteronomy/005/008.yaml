id: DEU.5.8
reference: Deuteronomy 5:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹֽ֣א תַעֲשֶׂ֥ה לְ/ךָ֥ פֶ֨סֶל֙ כָּל תְּמוּנָ֔ה אֲשֶׁ֤ר בַּ/שָּׁמַ֨יִם֙ מִ/מַּ֔עַל וַ/אֲשֶׁ֥ר בָּ/אָ֖רֶץ מִ/תָּ֑חַת וַ/אֲשֶׁ֥ר בַּ/מַּ֖יִם מִ/תַּ֥חַת לָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/008.yaml
  text: You shall not make for yourself a carved image[a], or any likeness of what is in the heavens above, or on the earth beneath[b], or in the waters under the earth.
translation:
  language: ml
  text: നിനക്കായി ഒരു കൊത്തിയ രൂപമോ[a], മീതെ ആകാശത്തിലുള്ളതോ, താഴെ ഭൂമിയിലുള്ളതോ, ഭൂമിക്കു താഴെയുള്ള വെള്ളത്തിലുള്ളതോ ആയ യാതൊന്നിന്റെയും പ്രതിരൂപമോ[b] ഉണ്ടാക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വിഗ്രഹം.’ എബ്രായപദം പലപ്പോഴും വിഗ്രഹാരാധനയുമായി ബന്ധപ്പെട്ട രൂപത്തെ സൂചിപ്പിക്കുന്നു; എന്നാൽ അതിന്റെ മൂർത്തമായ അർഥം മുഖ്യവാചകത്തിൽ നിലനിർത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘സാദൃശ്യം’ അല്ലെങ്കിൽ ‘ആകൃതി.’
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶסֶל
  choice: കൊത്തിയ രൂപം
  rationale: കൊത്തിയോ വെട്ടിയോ രൂപപ്പെടുത്തിയ ദൃശ്യരൂപം എന്ന മൂർത്തമായ അർഥം നിലനിർത്തുന്നു; വിഗ്രഹാരാധനയുടെ പശ്ചാത്തലം സൂചിപ്പിക്കാമെങ്കിലും ‘വിഗ്രഹം’ എന്ന വ്യാഖ്യാനാത്മക നിഗമനം മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: תְּמוּנָה
  choice: പ്രതിരൂപം
  rationale: രൂപം, സാദൃശ്യം, പ്രതിനിധാനം എന്നീ അർഥവ്യാപ്തി ഉൾക്കൊള്ളുകയും കൊത്തിയ വസ്തുവിനപ്പുറം നിരോധനത്തിന്റെ വ്യാപ്തി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: לֹא תַעֲשֶׂה לְךָ
  choice: നിനക്കായി ... ഉണ്ടാക്കരുത്
  rationale: നിയമപരമായ നിരോധനം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; לְךָയിലെ വ്യക്തിപരമായ ഉപയോഗത്തിനോ കൈവശപ്പെടുത്തലിനോ ഉള്ള സൂചനയും നിലനിർത്തുന്നു.
- source_word: כָּל תְּמוּנָה
  choice: യാതൊന്നിന്റെയും പ്രതിരൂപം
  rationale: നിഷേധവാക്യത്തിൽ כָּל സൂചിപ്പിക്കുന്ന സമഗ്രമായ വ്യാപ്തി മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: אֲשֶׁר בַּשָּׁמַיִם מִמַּעַל
  choice: മീതെ ആകാശത്തിലുള്ളത്
  rationale: ശമയിം എന്ന രൂപത്തെ മലയാളത്തിലെ സ്വാഭാവിക കൂട്ടനാമമായ ‘ആകാശം’കൊണ്ട് നൽകുകയും മുകളിലുള്ള മേഖലയെന്ന ലംബവ്യത്യാസം സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: בָּאָרֶץ מִתָּחַת
  choice: താഴെ ഭൂമിയിലുള്ളത്
  rationale: ആകാശത്തിനു താഴെയുള്ള ഭൗമമേഖലയെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בַּמַּיִם מִתַּחַת לָאָרֶץ
  choice: ഭൂമിക്കടിയിലെ വെള്ളത്തിലുള്ളത്
  rationale: ഭൂമിക്കു കീഴിലുള്ള ജലത്തെക്കുറിച്ചുള്ള മൂലപാഠത്തിന്റെ പുരാതന ലോകചിത്രം വിശദീകരിച്ച് മാറ്റാതെ നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: രൂപനിരോധനത്തിന്റെ വ്യാപ്തി
  choice: കൊത്തിയ രൂപമോ ഏതെങ്കിലും പ്രതിരൂപമോ ഉണ്ടാക്കുന്നതിനുള്ള നിരോധനമായി വാക്യം വിവർത്തനം ചെയ്യുന്നു; ആരാധനയെക്കുറിച്ചുള്ള വിശദീകരണം ചേർക്കുന്നില്ല.
  alternative: ആരാധിക്കാനുള്ള വിഗ്രഹങ്ങൾ ഉണ്ടാക്കരുത് എന്ന വ്യാഖ്യാനാത്മക വിവർത്തനം.
  rationale: വണങ്ങുകയോ സേവിക്കുകയോ ചെയ്യുന്നതിനെക്കുറിച്ചുള്ള വ്യക്തമായ നിരോധനം അടുത്ത വാക്യത്തിലാണ്. ഈ വാക്യത്തിൽ അത് മുൻകൂട്ടി ചേർക്കാതിരിക്കുന്നത് പാഠത്തിന്റെ ക്രമവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമശൈലി. ‘ഉണ്ടാക്കരുത്’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; ‘കൊത്തിയ രൂപം’ മൂലപദത്തിന്റെ മൂർത്തതയും ‘പ്രതിരൂപം’ നിരോധനത്തിന്റെ വിശാലതയും നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ നൽകിയിരിക്കുന്നു.
