  variant: modern standard Malayalam
source:
  edition: WLC
  text: בְּ/כָל הַ/דֶּ֗רֶךְ אֲשֶׁ֨ר צִוָּ֜ה יְהוָ֧ה אֱלֹהֵי/כֶ֛ם אֶתְ/כֶ֖ם תֵּלֵ֑כוּ לְמַ֤עַן תִּֽחְיוּ/ן֙ וְ/ט֣וֹב לָ/כֶ֔ם וְ/הַאֲרַכְתֶּ֣ם יָמִ֔ים בָּ/אָ֖רֶץ אֲשֶׁ֥ר תִּֽירָשֽׁוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/033.yaml
  text: You shall walk in all the way that Yahweh your God has commanded you[a], so that you may live, and that it may go well with you, and that you may prolong your days in the land that you will possess.
translation:
  language: ml
  text: നിങ്ങളുടെ ദൈവമായ യഹ്‌വെ നിങ്ങളോടു കൽപ്പിച്ചിരിക്കുന്ന മുഴുവൻ വഴിയിലും നിങ്ങൾ നടക്കണം. അങ്ങനെ നിങ്ങൾ ജീവിക്കാനും, നിങ്ങൾക്കു നന്മ ഉണ്ടാകാനും, നിങ്ങൾ കൈവശമാക്കുന്ന[a] ദേശത്ത് നിങ്ങളുടെ നാളുകൾ ദീർഘിപ്പിക്കാനും ഇടയാകും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവകാശമാക്കുന്ന’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ ക്രിയയ്ക്ക് കൈവശപ്പെടുത്തുക, അവകാശമായി ലഭിക്കുക എന്നീ രണ്ടർഥങ്ങളും വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכָל הַדֶּרֶךְ
  choice: മുഴുവൻ വഴിയിലും
  rationale: ഏകവചനത്തിലുള്ള ‘വഴി’ എന്ന ഉടമ്പടിപരമായ ജീവിതരീതി-രൂപകം നിലനിർത്തുന്നു; כָל സൂചിപ്പിക്കുന്ന സമഗ്രതയും സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: צִוָּה
  choice: കല്പിച്ച
  rationale: മുമ്പ് നൽകിയതും ഇപ്പോഴും പ്രാബല്യമുള്ളതുമായ ദൈവകല്പനയെ സന്ദർഭാനുസൃതമായി സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായ ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ പദവിപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവമായ
  rationale: ഉടമ്പടിബന്ധം വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം; ദൈവനാമത്തോടു ചേർന്ന് ‘നിങ്ങളുടെ ദൈവമായ യഹ്‌വെ’ എന്നു വരുന്നു.
- source_word: תֵּלֵכוּ
  choice: നിങ്ങൾ നടക്കണം
  rationale: הלך എന്ന ക്രിയയുടെ ധാർമികജീവിതം/അനുസരണം സൂചിപ്പിക്കുന്ന രൂപകം നിലനിർത്തുകയും നിയമോപദേശത്തിന്റെ നിർബന്ധഭാവം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: לְמַעַן
  choice: അങ്ങനെ
  rationale: തുടർന്നുവരുന്ന ജീവൻ, നന്മ, ദീർഘായുസ്സ് എന്നീ ലക്ഷ്യഫലങ്ങളെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: תִּחְיוּן
  choice: നിങ്ങൾ ജീവിച്ചിരിക്കയും
  rationale: ജീവൻ നിലനിൽക്കുക എന്ന അടിസ്ഥാന അർഥം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: וְטוֹב לָכֶם
  choice: നിങ്ങൾക്കു നന്മ വരികയും
  rationale: ക്ഷേമം ഉണ്ടാകുക എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְהַאֲרַכְתֶּם יָמִים
  choice: നിങ്ങളുടെ നാളുകൾ ദീർഘമാകുകയും
  rationale: ‘നാളുകൾ ദീർഘമാക്കുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യരൂപം പരമാവധി നിലനിർത്തിക്കൊണ്ട് ദീർഘായുസ്സ് എന്ന അർഥം വ്യക്തമാക്കുന്നു.
- source_word: בָּאָרֶץ
  choice: ദേശത്തു
  rationale: ആവർത്തനപുസ്തകത്തിലെ ഉടമ്പടിദേശത്തെ സൂചിപ്പിക്കുന്ന പതിവും സ്വാഭാവികവുമായ മലയാളപദം.
- source_word: תִּירָשׁוּן
  choice: കൈവശമാക്കുന്ന
  rationale: ירשׁ എന്ന ക്രിയയുടെ പ്രദേശം ഏറ്റെടുത്തു കൈവശം വയ്ക്കുക എന്ന മൂർത്തമായ അർഥം നൽകുന്നു; ‘അവകാശമാക്കുക’ എന്ന പാരമ്പര്യ/അവകാശ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു പദവിപ്പേരാക്കി മാറ്റാതെ, സാധാരണ അംഗീകരിക്കപ്പെടുന്ന ‘Yahweh’ ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: ദേശവുമായി ബന്ധപ്പെട്ട ירשׁ എന്ന ക്രിയ
  choice: കൈവശമാക്കുന്ന ദേശം
  alternative: അവകാശമാക്കുന്ന ദേശം
  rationale: ഇവിടെ ദേശം ഏറ്റെടുത്തു അധിവസിക്കുന്ന മൂർത്തമായ ആശയം പ്രധാനമാണ്; എന്നാൽ ക്രിയയിലെ അവകാശലഭ്യതയുടെ അർഥസാധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
- issue: അനുസരണവും അനുഗ്രഹഫലങ്ങളും തമ്മിലുള്ള ബന്ധം
  choice: ‘അങ്ങനെ’ എന്ന ലക്ഷ്യ/ഫലബന്ധം നിലനിർത്തി
  alternative: നിശ്ചയമായ കാരണഫലവാഗ്ദാനമായി വികസിപ്പിക്കൽ
  rationale: לְמַעַן സൂചിപ്പിക്കുന്ന ലക്ഷ്യവും ഫലവും മലയാളത്തിൽ പ്രകടമാക്കുന്നു; പാഠത്തിൽ ഇല്ലാത്ത വ്യവസ്ഥകളോ സിദ്ധാന്തവ്യാഖ്യാനങ്ങളോ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമോപദേശശൈലി. ‘വഴി’ എന്ന ഏകവചനരൂപകവും ‘നാളുകൾ ദീർഘമാകുക’ എന്ന മൂലഭാഷാ ദൃശ്യവും നിലനിർത്തിയിട്ടുണ്ട്. അടിക്കുറിപ്പ് ചർച്ച ചെയ്യുന്ന പദത്തിനുതന്നെ [a] ചിഹ്നം ചേർത്തിരിക്കുന്നു.
