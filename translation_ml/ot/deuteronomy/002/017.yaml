  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/017.yaml
  text: Then Yahweh spoke to me[a], saying,
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വെ എന്നോടു പറഞ്ഞു[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ: ‘YHWH’; പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു വിവർത്തനം ചെയ്യുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അപ്പോൾ ... അരുളിച്ചെയ്തു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അപ്പോൾ’ എന്നു നൽകി. ദൈവത്തിന്റെ പ്രസ്താവനയ്ക്ക് സ്വാഭാവികവും മാന്യവുമായ മലയാളപ്രയോഗമായി ‘അരുളിച്ചെയ്തു’ തിരഞ്ഞെടുത്തു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി YHWH ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: אֵלַי
  choice: എന്നോട്
  rationale: אֶל എന്ന പൂർവപ്രത്യയം ഇവിടെ മോശെയിലേക്കുള്ള നേരിട്ടുള്ള അഭിസംബോധന സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘എന്നോട്’ സ്വാഭാവികമായി ആ അർഥം നൽകുന്നു.
- source_word: לֵאמֹר
  choice: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വാക്കുകൾക്കായി ഇരട്ടപ്പുള്ളി
  rationale: לֵאמֹר നേരിട്ടുള്ള ഉദ്ധരണി അവതരിപ്പിക്കുന്ന സൂത്രവാക്യമാണ്. ‘പറഞ്ഞുകൊണ്ട്’ എന്ന അനാവശ്യ ആവർത്തനത്തേക്കാൾ മലയാളത്തിൽ ഇരട്ടപ്പുള്ളി ഇതിന്റെ വാക്യപ്രവർത്തനം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്
  rationale: എബ്രായപാഠം സ്ഥാനപ്പേരല്ല, YHWH എന്ന ദൈവനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ പരമ്പരാഗത പകരമായ ‘കർത്താവ്’ എന്നതിനുപകരം വ്യക്തിനാമം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സംക്ഷിപ്തവും മാന്യവുമായ ആഖ്യാനശൈലി. ദൈവവചനസന്ദർഭത്തിന് യോജിച്ച ‘അരുളിച്ചെയ്തു’ ഉപയോഗിച്ചെങ്കിലും, മൂലത്തിലെ דבר എന്ന ക്രിയയുടെ സംസാരാർഥം നിലനിർത്തുന്നു. לֵאמֹר എന്ന ഉദ്ധരണി-ആമുഖം മലയാളത്തിലെ ഇരട്ടപ്പുള്ളിയിലൂടെ സ്വാഭാവികമാക്കി.
