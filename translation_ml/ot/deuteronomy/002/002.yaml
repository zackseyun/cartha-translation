translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വെ എന്നോട് ഇങ്ങനെ പറഞ്ഞു[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായപാഠം അക്ഷരാർഥത്തിൽ: ‘അപ്പോൾ യഹ്‌വെ എന്നോട് പറഞ്ഞു, പറഞ്ഞുകൊണ്ട്.’ അവസാനത്തെ ‘പറഞ്ഞുകൊണ്ട്’ അടുത്ത വാക്യത്തിൽ വരുന്ന വാക്കുകളെ പരിചയപ്പെടുത്തുന്നു; മലയാളത്തിൽ അതിന്റെ പ്രവർത്തനം ‘ഇങ്ങനെ’ എന്ന പദവും ദ്വിബിന്ദുവും പ്രകടിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ … പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ അടുത്ത സംഭവത്തിലേക്കു നീക്കുന്നു. ആ ക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ ‘അപ്പോൾ’ വ്യക്തമാക്കുന്നു; אָמַר എന്ന സാധാരണ സംസാരക്രിയയ്ക്ക് ‘പറഞ്ഞു’ യോജിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, അതിന്റെ അംഗീകരിക്കപ്പെട്ട മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: אֵלַי
  choice: എന്നോട്
  rationale: אֶל എന്ന പൂർവപ്രത്യയവും ഏകവചന ഒന്നാംപുരുഷ പ്രത്യയവും ചേർന്ന രൂപത്തിന്റെ സ്വാഭാവിക ആധുനിക മലയാള പരിഭാഷയാണ് ‘എന്നോട്’.
- source_word: לֵאמֹר
  choice: 'ഇങ്ങനെ … :'
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വാക്കുകളെ പരിചയപ്പെടുത്തുന്ന ഈ അനന്തക്രിയയുടെ പ്രവർത്തനം ‘ഇങ്ങനെ’ എന്ന പദവും ദ്വിബിന്ദുവും ചേർന്ന് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ‘പറഞ്ഞുകൊണ്ട്’ എന്ന കൃത്രിമ ആവർത്തനം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ഇവിടെ ഒരു പദവിയല്ല, ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ ദൈവനാമം ലിപ്യന്തരിച്ചു നൽകുന്നു; പ്രത്യേക സമുദായപരമായ രൂപം നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘അരുളിച്ചെയ്തു’ എന്ന ഉയർന്ന മതഭാഷയ്ക്കു പകരം, മൂലത്തിലെ സാധാരണ സംസാരക്രിയയെ പിന്തുടർന്ന് ‘പറഞ്ഞു’ ഉപയോഗിച്ചു.
