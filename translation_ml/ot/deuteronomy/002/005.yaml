id: DEU.2.5
reference: Deuteronomy 2:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אַל תִּתְגָּר֣וּ בָ֔/ם כִּ֠י לֹֽא אֶתֵּ֤ן לָ/כֶם֙ מֵֽ/אַרְצָ֔/ם עַ֖ד מִדְרַ֣ךְ כַּף רָ֑גֶל כִּֽי יְרֻשָּׁ֣ה לְ/עֵשָׂ֔ו נָתַ֖תִּי אֶת הַ֥ר שֵׂעִֽיר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/005.yaml
  text: Do not provoke them[a], for I will not give you any of their land, not even enough to set the sole of a foot on[c][b], because I have given Mount Seir to Esau as a possession.
translation:
  language: ml
  text: അവരോടു ഏറ്റുമുട്ടരുത്; അവരുടെ ദേശത്തിൽനിന്ന് ഒരു കാൽവെപ്പിനുള്ള ഇടംപോലും ഞാൻ നിങ്ങൾക്കു തരുകയില്ല; കാരണം സേയീർ പർവതപ്രദേശം[b] ഞാൻ ഏശാവിന് അവകാശമായി[a] നൽകിയിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അവകാശമായി” എന്നത് “കൈവശമായി” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: “സേയീർ പർവതപ്രദേശം” എന്നത് സേയീരിലെ പർവതനിരകളെയോ മലമ്പ്രദേശത്തെയോ സൂചിപ്പിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: תִּתְגָּרוּ בָם
  choice: അവരോടു ശത്രുതയ്ക്കു മുതിരരുത്
  rationale: ഹിത്പയേൽ രൂപവും ב എന്ന മുൻപ്രത്യയവും ചേർന്ന് പ്രകോപിപ്പിക്കൽ മുതൽ ശത്രുതാപരമായ ഏറ്റുമുട്ടലിൽ ഏർപ്പെടൽ വരെയുള്ള അർഥപരിധി നൽകുന്നു. സന്ദർഭത്തിൽ ഏദോമിനെതിരായ ശത്രുതാപരമായ നടപടി വിലക്കുന്നതിനാൽ, യുദ്ധം എന്നു അതിവ്യക്തമാക്കാതെ ഈ പ്രയോഗം അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לֹא אֶתֵּן לָכֶם מֵאַרְצָם
  choice: അവരുടെ ദേശത്തിൽ നിന്ന് ... ഞാൻ നിങ്ങൾക്കു തരുകയില്ല
  rationale: 'מן ഇവിടെ ഭാഗസൂചകമാണ്: അവരുടെ ദേശത്തിന്റെ യാതൊരു ഭാഗവും നൽകില്ല. ഹീബ്രായ ഘടനയും ഊന്നലും മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.'
- source_word: עַד מִדְרַךְ כַּף רָגֶל
  choice: കാൽപ്പാദം ചവിട്ടാനുള്ളിടംപോലും
  rationale: ഒരു കാൽപ്പാദം പതിയാവുന്നത്ര ഏറ്റവും ചെറിയ ഭൂവിഭാഗം എന്ന ദൃശ്യബിംബം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: יְרֻשָּׁה
  choice: അവകാശമായി
  rationale: ദൈവം ഏശാവിന് നൽകിയ സ്ഥിരമായ ഭൂപങ്ക്/കൈവശം എന്ന ആശയം നൽകുന്നു; കുടുംബപരമായ അനന്തരാവകാശം മാത്രം നിർബന്ധിതമാക്കുന്നില്ല.
- source_word: לְעֵשָׂו
  choice: ഏശാവിന്
  rationale: ലാമെദ് സ്വീകർത്താവിനെ സൂചിപ്പിക്കുന്നു; വ്യക്തിനാമം മലയാളത്തിലെ പരിചിതമായ രൂപത്തിൽ നൽകുന്നു.
- source_word: הַר שֵׂעִיר
  choice: സേയീർ മലനാട്
  rationale: הַר ഇവിടെ ഒറ്റ കൊടുമുടിയെ മാത്രമല്ല, സേയീരിന്റെ പർവതപ്രദേശത്തെയും സൂചിപ്പിക്കാം. സന്ദർഭത്തിന് അനുയോജ്യമായ ഭൂമേഖലാഭാവം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ഏദോമ്യദേശത്തിന്റെ ദൈവിക വിഹിതം
  choice: ഇസ്രായേൽ ശത്രുതയ്ക്കു മുതിരരുതെന്ന കല്പനയ്ക്ക് കാരണം, സേയീർ ദൈവം തന്നെയാണ് ഏശാവിന് നൽകിയതെന്ന നിലയിൽ വിവർത്തനം ചെയ്തു.
  alternative: ദൈവിക ഭൂവിഭജനത്തിന് ഊന്നൽ നൽകാതെ ഒരു രാഷ്ട്രീയ വിലക്കായി മാത്രം അവതരിപ്പിക്കൽ.
  rationale: രണ്ട് כִּי വാക്യങ്ങളും വിലക്കിന്റെ അടിസ്ഥാനമായി ദൈവത്തിന്റെ ഭൂവിഹിതത്തെ അവതരിപ്പിക്കുന്നു. പാഠത്തിനപ്പുറം വിശദീകരിക്കാതെ ആ ദൈവശാസ്ത്രപരമായ ബന്ധം നിലനിർത്തി.
- issue: יְרֻשָּׁה എന്നതിന്റെ അർഥപരിധി
  choice: അവകാശമായി
  alternative: കൈവശമായി / അവകാശഭൂമിയായി
  rationale: മൂലപദത്തിന് ‘അവകാശം’ എന്നും ‘കൈവശം’ എന്നും അർഥസാധ്യതയുണ്ട്. മലയാളത്തിലെ ‘അവകാശമായി’ ദൈവം നൽകിയ ഭൂപങ്കിനെ സ്വാഭാവികമായി സൂചിപ്പിക്കുമ്പോഴും അനന്തരാവകാശത്തിന്റെ ആശയം പൂർണമായി ഇല്ലാതാക്കുന്നില്ല; പകരംവായന അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ‘കാൽപ്പാദം ചവിട്ടാനുള്ളിടംപോലും’ എന്ന പ്രയോഗം മൂലത്തിലെ ഭൂമിയളവിന്റെ ദൃശ്യബിംബം നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
