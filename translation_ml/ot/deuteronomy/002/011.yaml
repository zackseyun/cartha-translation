source:
  edition: WLC
  text: רְפָאִ֛ים יֵחָשְׁב֥וּ אַף הֵ֖ם כָּ/עֲנָקִ֑ים וְ/הַ/מֹּ֣אָבִ֔ים יִקְרְא֥וּ לָ/הֶ֖ם אֵמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/011.yaml
  text: They too were considered Rephaim[a], like the Anakim; but the Moabites call them Emim.
translation:
  language: ml
  text: അനാക്യരെപ്പോലെ ഇവരും രെഫായീമ്യരായി[a] കണക്കാക്കപ്പെട്ടിരുന്നു; എന്നാൽ മോവാബ്യർ അവരെ ഏമ്യർ എന്നു വിളിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഭീമന്മാർ’; എന്നാൽ എബ്രായപദം ഏറ്റവും സ്വാഭാവികമായി ഒരു പുരാതന ജനവിഭാഗത്തിന്റെ പേരായാണ് മനസ്സിലാക്കപ്പെടുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְפָאִים
  choice: രെഫായീമ്യർ
  rationale: പുരാതന ജനവിഭാഗത്തിന്റെ പേരായി ലിപ്യന്തരണം ചെയ്തു; ‘മല്ലന്മാർ’ എന്ന വ്യാഖ്യാനപരമായ വിവർത്തനം മുഖ്യപാഠത്തിൽ ഒഴിവാക്കി.
- source_word: יֵחָשְׁבוּ
  choice: കണക്കാക്കപ്പെട്ടിരുന്നു
  rationale: חשׁב എന്ന ക്രിയയുടെ നിഫാൽ രൂപത്തിലുള്ള നിഷ്ക്രിയ അർഥവും ഒരു വിഭാഗത്തിൽ ഉൾപ്പെടുത്തി കരുതുന്നതെന്ന ആശയവും നിലനിർത്തുന്നു.
- source_word: אַף הֵם
  choice: ഇവരും
  rationale: മുൻപ് പറഞ്ഞ വിഭാഗത്തിൽ ഇവരെയും ഉൾപ്പെടുത്തുന്ന ഊന്നൽ സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: כָּעֲנָקִים
  choice: അനാക്യരെപ്പോലെ
  rationale: כ എന്ന ഉപസർഗത്തിന്റെ താരതമ്യാർഥം വ്യക്തമായി നിലനിർത്തുകയും ജനവിഭാഗനാമം ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: וְהַמֹּאָבִים
  choice: എന്നാൽ മോവാബ്യർ
  rationale: പൊതുവായ വർഗീകരണത്തിൽനിന്ന് മോവാബ്യരുടെ പേരിടൽരീതിയിലേക്കുള്ള ആശയമാറ്റം മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: יִקְרְאוּ לָהֶם
  choice: അവരെ ... എന്നു വിളിക്കുന്നു
  rationale: קרא ל എന്ന പ്രയോഗത്തിന്റെ ‘വിളിക്കുക/പേരിടുക’ എന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֵמִים
  choice: ഏമ്യർ
  rationale: മോവാബ്യർ ഉപയോഗിച്ച ജനവിഭാഗനാമമായി ലിപ്യന്തരണം ചെയ്തു; മലയാളത്തിൽ ഒരു ജനസമൂഹത്തെ സൂചിപ്പിക്കാൻ ‘-യർ’ രൂപം ഉപയോഗിച്ചു.
