  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. പുരാതന ജനവിഭാഗനാമങ്ങൾ മലയാള വായനക്കാർക്ക് വ്യക്തമായി തിരിച്ചറിയാവുന്ന വിധത്തിൽ ലിപ്യന്തരണം ചെയ്തു; മൂലത്തിലെ വർഗീകരണവും പേരിടലും തമ്മിലുള്ള വ്യത്യാസം സംരക്ഷിച്ചു.
