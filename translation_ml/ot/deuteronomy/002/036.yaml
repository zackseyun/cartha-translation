base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/036.yaml
  text: From Aroer[a], which is on the edge of the Arnon Valley, and the city that is in the valley, as far as Gilead, there was no town too high for us; Yahweh our God gave all of it before us.
translation:
  language: ml
  text: അർന്നോൻ താഴ്വരയുടെ വക്കിലുള്ള അരോവേർ മുതൽ, താഴ്വരയ്ക്കുള്ളിലെ പട്ടണവും ഗിലെയാദ് വരെയും, നമ്മുടെ കൈയെത്താത്തത്ര ഉയർന്ന[a] ഒരു പട്ടണവും ഉണ്ടായിരുന്നില്ല. നമ്മുടെ ദൈവമായ യഹ്വേ അതെല്ലാം നമുക്കു കൈമാറി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നമുക്കു കീഴടക്കാനാകാത്തവിധം ശക്തമായ” അല്ലെങ്കിൽ “നമുക്ക് അപ്രാപ്യമായ.” എബ്രായപാഠം അക്ഷരാർഥത്തിൽ ഒരു പട്ടണവും “നമുക്കു കൈയെത്താത്തത്ര ഉയർന്നതായിരുന്നില്ല” എന്നു പറയുന്നു; ഇവിടെ ഉയരം പ്രതിരോധബലത്തിന്റെയോ അപ്രാപ്യതയുടെയോ രൂപകമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעֲרֹעֵר
  choice: അരോവേർ മുതൽ
  rationale: മִן ഉപസർഗം ഭൂമിശാസ്ത്രപരമായ പരിധിയുടെ ആരംഭസ്ഥാനം സൂചിപ്പിക്കുന്നു; ‘മുതൽ’ അത് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: שְׂפַת נַחַל אַרְנֹן
  choice: അർന്നോൻ താഴ്വരയുടെ വക്കിൽ
  rationale: שָׂפָה എന്നത് അക്ഷരാർഥത്തിൽ ‘ചുണ്ട്’ എന്നും ഇവിടെ ‘വക്ക്/കര’ എന്നും അർഥമാക്കുന്നു. נַחַל ഒരു നീരൊഴുക്കുള്ള മലയിടുക്കിനെയോ താഴ്വരയെയോ സൂചിപ്പിക്കാം; പൊതുവായ വായനയ്ക്ക് ‘താഴ്വര’ വ്യക്തമാണ്.
- source_word: וְהָעִיר אֲשֶׁר בַּנַּחַל
  choice: താഴ്വരയ്ക്കുള്ളിലെ പട്ടണം ഉൾപ്പെടെ
  rationale: പട്ടണത്തെ ഭൂമിശാസ്ത്രപരമായ പരിധിയിലെ മറ്റൊരു സ്ഥാനമായി വാചകം ചേർക്കുന്നു. ‘ഉൾപ്പെടെ’ എന്നത് അതിന്റെ ബന്ധം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാക്കുന്നു, എന്നാൽ പട്ടണത്തിന്റെ തിരിച്ചറിയൽ നിർണയിക്കുന്നില്ല.
- source_word: וְעַד הַגִּלְעָד
  choice: ഗിലെയാദ് വരെ
  rationale: עַד ഭൂമിശാസ്ത്രപരമായ പരിധിയുടെ അറ്റം സൂചിപ്പിക്കുന്നു.
- source_word: קִרְיָה
  choice: പട്ടണം
  rationale: ഇത് നഗരത്തെയോ പട്ടണത്തെയോ സൂചിപ്പിക്കാം; ആധുനിക നഗരത്തിന്റെ വലുപ്പം അനാവശ്യമായി ധ്വനിപ്പിക്കാതെ പൊതുവായ അർഥം നൽകാൻ ‘പട്ടണം’ തെരഞ്ഞെടുത്തു.
- source_word: שָׂגְבָה מִמֶּנּוּ
  choice: നമുക്ക് എത്തിപ്പിടിക്കാനാകാത്തവിധം ഉയരത്തിലുള്ള
  rationale: മൂലപദം ഉയരത്തിന്റെ രൂപകം നിലനിർത്തിക്കൊണ്ട് പ്രതിരോധബലത്താലോ സ്ഥാനത്താലോ അപ്രാപ്യമായിരിക്കുക എന്ന ആശയം നൽകുന്നു.
- source_word: אֶת־הַכֹּל
  choice: അതെല്ലാം
  rationale: ഇതിനുമുമ്പ് വിവരിച്ച മുഴുവൻ പ്രദേശത്തെയും പട്ടണങ്ങളെയും സമാഹാരമായി സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: നമ്മുടെ ദൈവമായ യഹ്വേ
  rationale: ദൈവനാമമായ יהוה ഒരു പദവിയായി മാറ്റാതെ ‘യഹ്വേ’ എന്നു ലിപ്യന്തരിച്ചു; אֱלֹהֵינוּ ‘നമ്മുടെ ദൈവം’ എന്നാണ്.
- source_word: לְפָנֵינוּ
  choice: നമ്മുടെ മുമ്പിൽ ഏല്പിച്ചു
  rationale: ‘നമ്മുടെ മുമ്പിൽ’ എന്ന എബ്രായ പ്രയോഗം നിലനിർത്തുകയും, נָתַן എന്ന ക്രിയയുടെ ഈ സന്ദർഭത്തിലെ കൈമാറ്റാർഥം ‘ഏല്പിച്ചു’ എന്നു സ്വാഭാവികമായി നൽകുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ഉടമ്പടിനാമം നേരിട്ട് വരുന്നതിനാൽ അതിനെ ‘യഹ്വേ’ എന്നു ലിപ്യന്തരിച്ചു. ‘കർത്താവ്’ എന്നു പദവിയാക്കി മാറ്റുകയോ ‘യഹോവ’ എന്ന പരമ്പരാഗത രൂപം സ്വീകരിക്കുകയോ ചെയ്തില്ല.
- issue: ജയത്തിന്റെ കർത്താവ്
  choice: യഹ്വേ അതെല്ലാം നമ്മുടെ മുമ്പിൽ ഏല്പിച്ചു
  alternative: ഞങ്ങൾ അതെല്ലാം കീഴടക്കി
  rationale: മൂലപാഠം വിജയത്തിന്റെ നിർണായക പ്രവർത്തനം ദൈവത്തിനാണ് നൽകുന്നത്; മനുഷ്യപ്രവർത്തനമായി മാത്രം മാറ്റാതെ ആ ദൈവശാസ്ത്രപരമായ ഊന്നൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പമുള്ള, എന്നാൽ ഗൗരവമുള്ള മലയാളം ഉപയോഗിച്ചു. ഭൂമിശാസ്ത്രപരമായ ദീർഘഘടന വ്യക്തമാക്കാൻ ഡാഷുകൾ ഉപയോഗിച്ചു. שׂגב എന്ന പദത്തിലെ ഉയരരൂപകം മുഖ്യപാഠത്തിലും അതിന്റെ സൈനികസൂചന അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
