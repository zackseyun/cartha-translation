language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/נִּלְכֹּ֤ד אֶת כָּל עָרָי/ו֙ בָּ/עֵ֣ת הַ/הִ֔וא וַֽ/נַּחֲרֵם֙ אֶת כָּל עִ֣יר מְתִ֔ם וְ/הַ/נָּשִׁ֖ים וְ/הַ/טָּ֑ף לֹ֥א הִשְׁאַ֖רְנוּ שָׂרִֽיד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/034.yaml
  text: At that time we captured all his cities[a], and we devoted to destruction every inhabited city, with the women and the little children. We left no survivor.
translation:
  language: ml
  text: ആ സമയത്ത് ഞങ്ങൾ അവന്റെ എല്ലാ പട്ടണങ്ങളും പിടിച്ചെടുത്തു. ജനവാസമുള്ള ഓരോ പട്ടണത്തെയും—അതിലെ പുരുഷന്മാരെയും സ്ത്രീകളെയും കൊച്ചുകുട്ടികളെയും—ഞങ്ങൾ നാശത്തിനായി സമർപ്പിച്ചു[a]. ഒരാളെയും ശേഷിപ്പിച്ചില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ ഔപചാരികമായി: “നിരോധനവിധിക്കു കീഴിലാക്കി.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രു ക്രിയ, എന്തെങ്കിലും ഹേരെമിന്റെ കീഴിൽ നാശത്തിനായി സമർപ്പിക്കുന്ന ആശയം ഉൾക്കൊള്ളുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּלְכֹּד
  choice: ഞങ്ങൾ ... പിടിച്ചെടുത്തു
  rationale: לכד എന്ന സൈനികക്രിയയുടെ പട്ടണം കീഴടക്കുന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כָּל עָרָיו
  choice: അവന്റെ എല്ലാ പട്ടണങ്ങളും
  rationale: עיר പട്ടണമെന്നോ നഗരമെന്നോ അർഥമാക്കാം; ഈ പശ്ചാത്തലത്തിൽ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ ‘പട്ടണങ്ങൾ’ തിരഞ്ഞെടുത്തു, כָּל-ന്റെ സമഗ്രതയും നിലനിർത്തി.
- source_word: בָּעֵת הַהִוא
  choice: ആ സമയത്ത്
  rationale: ഹീബ്രു കാലസൂചനയുടെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: וַנַּחֲרֵם
  choice: നാശത്തിനായി സമർപ്പിച്ചു
  rationale: חרם എന്ന സാങ്കേതിക-ആരാധനാത്മക ആശയത്തിലെ ‘നാശത്തിനായി വേർതിരിക്കുക/സമർപ്പിക്കുക’ എന്ന ഭാവം വെറും ‘നശിപ്പിച്ചു’ എന്നതിനെക്കാൾ നന്നായി സൂക്ഷിക്കുന്നു.
- source_word: כָּל עִיר מְתִם
  choice: ജനവാസമുള്ള ഓരോ പട്ടണത്തെയും
  rationale: സംക്ഷിപ്തമായ ഹീബ്രു പ്രയോഗം മനുഷ്യർ വസിക്കുന്ന പട്ടണങ്ങളെ സൂചിപ്പിക്കുന്നു; പിന്നാലെയുള്ള പുരുഷന്മാർ, സ്ത്രീകൾ, കുട്ടികൾ എന്ന പട്ടികയുമായി ഇത് ബന്ധിപ്പിച്ചിരിക്കുന്നു.
- source_word: הַנָּשִׁים
  choice: സ്ത്രീകളും
  rationale: സ്ത്രീലിംഗ ബഹുവചന നാമത്തിന്റെ നേരിട്ടുള്ള പരിഭാഷ.
- source_word: הַטָּף
  choice: കൊച്ചുകുട്ടികളും
  rationale: טף ചെറിയ കുട്ടികളെയോ ചെറുപ്രായത്തിലുള്ള ആശ്രിതരെയോ സൂചിപ്പിക്കുന്നു; പ്രായവും ദുർബലതയും ‘കൊച്ചുകുട്ടികൾ’ വ്യക്തമാക്കുന്നു.
- source_word: לֹא הִשְׁאַרְנוּ שָׂרִיד
  choice: ഒരാളെയും ശേഷിപ്പിച്ചില്ല
  rationale: യുദ്ധസന്ദർഭത്തിൽ ‘അതിജീവിച്ച ഒരാളെയും വിട്ടില്ല’ എന്ന ആശയം ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ജയയുദ്ധവിവരണത്തിലെ חרם ഭാഷയുടെ പരിഭാഷ
  choice: നാശത്തിനായി സമർപ്പിച്ചു
  alternative: പൂർണമായി നശിപ്പിച്ചു; വിലക്കിന് വിധേയമാക്കി
  rationale: വാക്യത്തിലെ ഹിംസയെ മൃദൂകരിക്കാതെയും പിന്നീട് രൂപപ്പെട്ട ദൈവശാസ്ത്രവ്യാഖ്യാനം ചേർക്കാതെയും, חרם എന്ന പദത്തിന്റെ സാങ്കേതികവും സമർപ്പണപരവുമായ ഭാവം നിലനിർത്തുന്നു.
- issue: מְתִם എന്ന പദത്തിന്റെയും തുടർന്നുള്ള പട്ടികയുടെയും ലിംഗസൂചന
  choice: പുരുഷന്മാരും സ്ത്രീകളും കൊച്ചുകുട്ടികളും ഉൾപ്പെടെ
  alternative: സ്ത്രീകളും കൊച്ചുകുട്ടികളും ഉൾപ്പെടെ ജനവാസമുള്ള ഓരോ പട്ടണം
  rationale: മൂലപാഠത്തിലെ മനുഷ്യവാസസൂചനയും പുരുഷന്മാർ, സ്ത്രീകൾ, കുട്ടികൾ എന്ന വ്യക്തമായ വിഭാഗീകരണവും ഒരുമിച്ച് പ്രകടമാക്കുന്നു; അവയെ പൊതുവായ ‘ജനങ്ങൾ’ എന്നാക്കി നിഷ്പ്രഭമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘നാശത്തിനായി സമർപ്പിച്ചു’ എന്ന പ്രയോഗം സാങ്കേതികമായ חרם ആശയം നിലനിർത്തുന്നു; അടിക്കുറിപ്പിൽ കൂടുതൽ ഔപചാരികമായ പര്യായം നൽകിയിരിക്കുന്നു.
