  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: רַב לָ/כֶ֕ם סֹ֖ב אֶת הָ/הָ֣ר הַ/זֶּ֑ה פְּנ֥וּ לָ/כֶ֖ם צָפֹֽנָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/003.yaml
  text: You have gone around this hill country long enough[a]; turn northward.
translation:
  language: ml
  text: ഈ മലമ്പ്രദേശത്തെ ചുറ്റി സഞ്ചരിച്ചത് മതി[a]; ഇനി വടക്കോട്ടു തിരിയുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഈ മലയെ.” എബ്രായത്തിലെ הַר എന്ന പദത്തിന് ഒരു മലയെയോ മലമ്പ്രദേശത്തെയോ സൂചിപ്പിക്കാം; ഇവിടെ യാത്രയുടെ വിശാലമായ പശ്ചാത്തലം “മലമ്പ്രദേശം” എന്ന അർഥത്തെ പിന്തുണയ്ക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב לָכֶם
  choice: സഞ്ചരിച്ചത് മതി
  rationale: ഈ പ്രയോഗം വെറും ‘വളരെ’ എന്ന അർഥത്തിലല്ല, ഇത്രയും കാലം ചുറ്റിസഞ്ചരിച്ചത് മതിയെന്ന പര്യാപ്തത സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള ക്രിയയോടു ചേർത്താണ് മലയാളത്തിൽ സ്വാഭാവികമായി നൽകിയിരിക്കുന്നത്.
- source_word: סֹב
  choice: ചുറ്റി സഞ്ചരിച്ചത്
  rationale: סבב എന്ന ധാതുവിൽനിന്നുള്ള ഈ രൂപം ഇവിടെ ഒരു പ്രദേശത്തെ ചുറ്റിയോ അതിനുചുറ്റുമായി സഞ്ചരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: הָהָר הַזֶּה
  choice: ഈ മലമ്പ്രദേശം
  rationale: הַר എന്നതിന് ഒറ്റ മലയെന്നും മലനാടെന്നും അർഥമാകാം. യാത്രാവിവരണത്തിന്റെ വിശാല ഭൂമിശാസ്ത്രസന്ദർഭത്തിൽ ‘മലമ്പ്രദേശം’ യോജിക്കുന്നു; യഥാർഥ പദവൈകല്യം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: פְּנוּ
  choice: തിരിയുക
  rationale: യാത്രയിൽ ദിശ മാറ്റാനുള്ള ബഹുവചന ആജ്ഞയാണ്; മലയാളത്തിൽ ‘തിരിയുക’ നേരിട്ടും സ്വാഭാവികവുമാണ്.
- source_word: לָכֶם
  choice: പ്രത്യേകമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: ആജ്ഞയ്ക്കു പിന്നാലെയുള്ള ഈ ദാതൃസർവനാമം മലയാളത്തിൽ വേർതിരിച്ച് ‘നിങ്ങൾക്കായി’ എന്നു നൽകിയാൽ ഇവിടെ അനാവശ്യവും അസ്വാഭാവികവുമായ അർഥച്ചായ ഉണ്ടാകും; ബഹുവചന ആജ്ഞ സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: צָפֹנָה
  choice: വടക്കോട്ട്
  rationale: ദിശയിലേക്കുള്ള ചലനം സൂചിപ്പിക്കുന്ന രൂപമാണ്; ‘വടക്കോട്ട്’ അതിന്റെ ദിശാബലം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, മാന്യവും സംക്ഷിപ്തവുമായ ആജ്ഞാരൂപം. ‘ഇനി’ എന്നത് ഹീബ്രു വാക്യത്തിന്റെ സാഹചര്യജന്യമായ ദിശാമാറ്റം മലയാളത്തിൽ സ്വാഭാവികമാക്കുന്നു; പുതിയ ആശയം ചേർക്കുന്നില്ല.
