id: DEU.2.9
reference: Deuteronomy 2:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י אֶל תָּ֨צַר֙ אֶת מוֹאָ֔ב וְ/אַל תִּתְגָּ֥ר בָּ֖/ם מִלְחָמָ֑ה כִּ֠י לֹֽא אֶתֵּ֨ן לְ/ךָ֤ מֵֽ/אַרְצ/וֹ֙ יְרֻשָּׁ֔ה כִּ֣י לִ/בְנֵי ל֔וֹט נָתַ֥תִּי אֶת עָ֖ר יְרֻשָּֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/009.yaml
  text: And Yahweh said to me[a], “Do not harass Moab or provoke them to war, for I will not give you any of its land as a possession[b], because I have given Ar to the sons of Lot as a possession.”
translation:
  language: ml
  text: 'യഹ്‌വെ എന്നോടു പറഞ്ഞു: “മോവാബിനെ ഉപദ്രവിക്കരുത്[a]; അവരോടു യുദ്ധത്തിന് മുതിരരുത്. അവരുടെ ദേശത്തിൽ ഒരംശംപോലും ഞാൻ നിനക്ക് അവകാശമായി[b] തരുകയില്ല; കാരണം ലോത്തിന്റെ പുത്രന്മാർക്ക് ഞാൻ ആർ അവകാശമായി നൽകിയിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘മോവാബിനെ കഷ്ടപ്പെടുത്തരുത്; അവരോടു യുദ്ധത്തിൽ ഏർപ്പെടുകയും അരുത്.’'
    reason: lexical_alternative
  - marker: b
    text: ‘അവകാശമായി’ എന്നതിന് ഈ വാക്യത്തിലെ രണ്ടു പ്രയോഗങ്ങളിലും ‘കൈവശമായി’ അല്ലെങ്കിൽ ‘പാരമ്പര്യസ്വത്തായി’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ സ്വാഭാവികമായി ഉച്ചരിക്കാവുന്ന ലിപ്യന്തരണമായി നൽകി.
- source_word: אֶל תָּצַר אֶת מוֹאָב
  choice: മോവാബിനെ ഉപദ്രവിക്കരുത്
  rationale: צרר എന്ന ക്രിയ ഇവിടെ പൂർണയുദ്ധത്തിനു മുൻപുള്ള ശത്രുതാപരമായ സമ്മർദമോ ഉപദ്രവമോ സൂചിപ്പിക്കുന്നു; ‘ഉപദ്രവിക്കുക’ ആ അർഥപരിധി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְאַל תִּתְגָּר בָּם מִלְחָמָה
  choice: അവരോടു യുദ്ധത്തിനു മുതിരുകയും അരുത്
  rationale: גרה എന്ന ക്രിയയുടെ ഹിത്പയേൽ രൂപവും ‘യുദ്ധം’ എന്ന നാമവും ചേർന്ന് ശത്രുതയോടെ യുദ്ധത്തിൽ ഏർപ്പെടുന്നതിനെയോ അതിനു തുടക്കമിടുന്നതിനെയോ സൂചിപ്പിക്കുന്നു.
- source_word: מֵאַרְצוֹ
  choice: അവരുടെ ദേശത്തിൽ ഒരംശംപോലും
  rationale: מן എന്നതിന്റെ ഭാഗിക അർഥം ‘ഒരംശംപോലും’ എന്നു വ്യക്തമാക്കി; മോവാബിനെ ഒരു ജനസമൂഹമായി കാണുന്നതിനാൽ മലയാളത്തിൽ ബഹുവചനസർവനാമം സ്വാഭാവികമാണ്.
- source_word: יְרֻשָּׁה
  choice: അവകാശമായി
  rationale: അനുവദിച്ചുനൽകിയ സ്ഥിരസ്വത്തോ പാരമ്പര്യാവകാശമോ എന്ന അർഥം ഉൾക്കൊള്ളുന്ന ലളിതവും മാന്യവുമായ മലയാളപദം; രണ്ടു പ്രയോഗങ്ങളിലും ഒരേപോലെ നിലനിർത്തി.
- source_word: לִבְנֵי לוֹט
  choice: ലോത്തിന്റെ പുത്രന്മാർക്ക്
  rationale: മൂലത്തിലെ വംശാവലിപരമായ ‘ലോത്തിന്റെ പുത്രന്മാർ’ എന്ന രൂപം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് സന്തതികളെയും ഉൾക്കൊള്ളുന്നു.
- source_word: עָר
  choice: ആർ
  rationale: മോവാബുമായി ബന്ധപ്പെട്ട സ്ഥലനാമത്തിന്റെ നേരിട്ടുള്ള മലയാള ലിപ്യന്തരണം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം വ്യക്തിപരമായ ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ ഒരു പദവികൊണ്ട് പകരാതെ ലിപ്യന്തരിച്ചു; ‘യഹ്‌വെ’ ഹീബ്രു നാമത്തിന്റെ സാധാരണ പണ്ഡിതോചിത പുനർനിർമാണത്തെ മലയാളത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു.
- issue: יְרֻשָּׁה എന്നതിലെ സ്വത്തവകാശവും പാരമ്പര്യവും
  choice: അവകാശമായി
  alternative: കൈവശമായി; പാരമ്പര്യസ്വത്തായി
  rationale: ദൈവം അനുവദിച്ചുനൽകുന്ന ദേശാവകാശം എന്ന ആശയം നിലനിർത്തുന്നു; ‘കൈവശം’ മാത്രമായി ചുരുക്കുകയോ പാരമ്പര്യഭാവം അതിയായി വ്യക്തമാക്കുകയോ ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ഗദ്യം. ആജ്ഞകളുടെ സമാന്തരഘടനയും ദേശം ദൈവം അനുവദിച്ചുനൽകുന്നു എന്ന ആശയവും നിലനിർത്തി. ‘പുത്രന്മാർ’ എന്ന വംശാവലിപരമായ രൂപം മൂലത്തോട് അടുപ്പത്തിനായി സൂക്ഷിച്ചു.
