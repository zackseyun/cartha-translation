  text: וַ/יְהִ֨י כַ/אֲשֶׁר תַּ֜מּוּ כָּל אַנְשֵׁ֧י הַ/מִּלְחָמָ֛ה לָ/מ֖וּת מִ/קֶּ֥רֶב הָ/עָֽם־־׃ס
base_translation:
