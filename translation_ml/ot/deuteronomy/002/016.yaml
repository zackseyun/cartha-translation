  yaml_path: translation/ot/deuteronomy/002/016.yaml
  text: And when all the men of war had finished dying from among the people,[a]
translation:
  language: ml
  text: ജനത്തിന്റെ ഇടയിൽനിന്ന് എല്ലാ യുദ്ധവീരന്മാരും മരിച്ചുതീർന്നപ്പോൾ,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כַאֲשֶׁר
  choice: …പ്പോൾ
  rationale: വിവരണം അടുത്ത വാക്യത്തിലേക്കു നീളുന്ന ഒരു കാലസൂചക ഉപവാക്യമാണ് ഇവിടെ തുടങ്ങുന്നത്. അതിനാൽ ‘സംഭവിച്ചു’ എന്നു വേർതിരിച്ചു ചേർക്കാതെ മലയാളത്തിലെ സ്വാഭാവികമായ ‘…പ്പോൾ’ എന്ന ഘടനയിൽ ആശയം ഉൾപ്പെടുത്തി.
- source_word: תַּמּוּ ... לָמוּת
  choice: മരിച്ചുതീർന്നപ്പോൾ
  rationale: תמם എന്ന ക്രിയയും ‘മരിക്കുക’ എന്ന അനന്തക്രിയയും ചേർന്ന് മരണപ്രക്രിയ പൂർണമായതായി സൂചിപ്പിക്കുന്നു. ‘മരിച്ചുതീർന്നു’ ഈ പൂർത്തീകരണഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: כָּל
  choice: എല്ലാവരും
  rationale: സംഘത്തിലെ ഒരാളും ശേഷിച്ചില്ലെന്ന സമഗ്രത വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: യുദ്ധപുരുഷന്മാർ
  rationale: എബ്രായത്തിലെ ‘യുദ്ധത്തിന്റെ പുരുഷന്മാർ’ എന്ന പുരുഷലിംഗവും സൈനിക അർഥവും അടുത്തായി സംരക്ഷിക്കുന്നു; കൂടുതൽ സ്വാഭാവികമായ ‘പടയാളികൾ’ അടിക്കുറിപ്പിൽ പകരമായി നൽകിയിരിക്കുന്നു.
- source_word: מִקֶּרֶב הָעָם
  choice: ജനത്തിന്റെ ഇടയിൽനിന്ന്
  rationale: ഒരു സമൂഹത്തിന്റെ നടുവിൽനിന്നുള്ള നീക്കം അല്ലെങ്കിൽ ഇല്ലാതാകൽ എന്ന מִקֶּרֶב എന്ന പ്രയോഗത്തിന്റെ അർഥവും הָעָם എന്ന കൂട്ടായ പരാമർശവും നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി സ്വീകരിച്ചു. മൂലവാക്യം അടുത്ത വാക്യത്തിൽ പൂർത്തിയാകുന്ന കാലസൂചക ഉപവാക്യമായതിനാൽ അവസാനത്തിൽ അൽപവിരാമം നിലനിർത്തി.
