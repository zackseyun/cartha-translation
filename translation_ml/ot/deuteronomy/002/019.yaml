reference: Deuteronomy 2:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/קָרַבְתָּ֗ מ֚וּל בְּנֵ֣י עַמּ֔וֹן אַל תְּצֻרֵ֖/ם וְ/אַל תִּתְגָּ֣ר בָּ֑/ם כִּ֣י לֹֽא אֶ֠תֵּן מֵ/אֶ֨רֶץ בְּנֵי עַמּ֤וֹן לְ/ךָ֙ יְרֻשָּׁ֔ה כִּ֥י לִ/בְנֵי ל֖וֹט נְתַתִּ֥י/הָ יְרֻשָּֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/019.yaml
  text: When you come opposite the sons of Ammon[a], do not harass them or provoke them, for I will not give you any of the land of the sons of Ammon as a possession[c][b], because I have given it as a possession to the sons of Lot.
translation:
  language: ml
  text: നീ അമ്മോന്യരുടെ എതിർവശത്ത് എത്തുമ്പോൾ[a] അവരെ ഉപദ്രവിക്കരുത്; അവരോടു കലഹത്തിനു മുതിരുകയും അരുത്.[b] കാരണം അമ്മോന്യരുടെ ദേശത്തിൽനിന്ന് ഒന്നും നിനക്കു കൈവശമായി[c] ഞാൻ തരുകയില്ല; അത് ലോത്തിന്റെ മക്കൾക്കു കൈവശമായി ഞാൻ കൊടുത്തിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘അമ്മോന്റെ മക്കൾ’; ഈ വാക്യത്തിലുടനീളം അങ്ങനെ പരിഭാഷപ്പെടുത്താം.'
    reason: lexical_alternative
  - marker: b
    text: ‘അവരെ ആക്രമിക്കരുത്; അവരോടു ഏറ്റുമുട്ടുകയും അരുത്’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദങ്ങൾ ഉപരോധം മാത്രമല്ല, വിശാലമായ ശത്രുതാപരമായ നടപടികളെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: ‘അവകാശമായി’ അഥവാ ‘പൈതൃകമായി’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרַבְתָּ מוּל
  choice: നീ ... അടുത്തെത്തുമ്പോൾ
  rationale: ക്രിയയുടെ സമീപനാർഥവും സന്ദർഭത്തിലെ കാലസൂചനയും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. מוּל എന്നതിന്റെ അഭിമുഖമായുള്ള സമീപനം ഇവിടെ ‘അടുത്തെത്തുക’ എന്ന പ്രയോഗത്തിൽ ഉൾക്കൊള്ളുന്നു; ‘എതിർവശത്ത്’ എന്നു പറഞ്ഞാൽ അനാവശ്യമായ ഭൂമിശാസ്ത്ര കൃത്യത തോന്നാം.
- source_word: בְּנֵי עַמּוֹן
  choice: അമ്മോന്യർ
  rationale: അക്ഷരാർഥം ‘അമ്മോന്റെ മക്കൾ’ എന്നാണെങ്കിലും ഇത് ജനവിഭാഗനാമമായി വരുന്നിടത്ത് ‘അമ്മോന്യർ’ എന്നത് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: אַל תְּצֻרֵם
  choice: അവരെ ഉപദ്രവിക്കരുത്
  rationale: צור ഇവിടെ ഉപരോധം മാത്രമല്ല, വിശാലമായ ശത്രുതാപരമായ സമ്മർദമോ ആക്രമണനടപടിയോ സൂചിപ്പിക്കാം. ‘ഉപദ്രവിക്കരുത്’ ആ വിശാലത നിലനിർത്തുന്നു.
- source_word: וְאַל תִּתְגָּר בָּם
  choice: അവരോടു കലഹത്തിനു മുതിരുകയും അരുത്
  rationale: התגר എന്ന രൂപത്തിന്റെ പ്രകോപനം, ഏറ്റുമുട്ടൽ, ശത്രുത ആരംഭിക്കൽ എന്നീ സാധ്യതകൾ അമിതമായി ‘യുദ്ധം’ എന്നു നിർണ്ണയിക്കാതെ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: מֵאֶרֶץ בְּנֵי עַמּוֹן
  choice: അമ്മോന്യരുടെ ദേശത്തിൽനിന്ന് ഒന്നും
  rationale: നിഷേധത്തോടുകൂടിയ מִן-ന്റെ ഭാഗികാർഥം—ദേശത്തിന്റെ ഒരു വിഹിതംപോലും ഇല്ല—‘ഒന്നും’ എന്നതിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: יְרֻשָּׁה
  choice: കൈവശമായി
  rationale: יְרֻשָּׁהയ്ക്ക് അവകാശം, പൈതൃകം, സ്ഥിരകൈവശം എന്നീ അർഥങ്ങൾ ഉണ്ടാകാം. ഭൂമിയുടെ ദൈവിക വിഭജനസന്ദർഭത്തിൽ ‘കൈവശമായി’ വ്യക്തവും സിദ്ധാന്തപരമായി അമിതനിർണ്ണയം ഒഴിവാക്കുന്നതുമാണ്.
- source_word: לִבְנֵי לוֹט
  choice: ലോത്തിന്റെ മക്കൾക്ക്
  rationale: ഇവിടെ എബ്രായ ബന്ധുത്വപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നേരിട്ട് നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് ലോത്തിന്റെ വംശജരെയും ഉൾക്കൊള്ളുന്നു.
- source_word: נְתַתִּיהָ
  choice: ഞാൻ കൊടുത്തിരിക്കുന്നു
  rationale: പൂർത്തിയായ ദൈവിക ദാനത്തിന്റെയും അതിന്റെ ഇപ്പോഴും നിലനിൽക്കുന്ന ഫലത്തിന്റെയും ഭാവം മലയാളത്തിലെ പൂർണവർത്തമാനപ്രയോഗം നന്നായി നൽകുന്നു.
theological_decisions:
- issue: ദേശീയനാമത്തിലെ בְּנֵי എന്ന ബന്ധുത്വപദത്തിന്റെ പരിഭാഷ
  choice: അമ്മോന്യർ; എന്നാൽ ലോത്തിന്റെ മക്കൾ
  alternative: അമ്മോന്റെ മക്കൾ / ലോത്തിന്റെ സന്തതികൾ
  rationale: ആദ്യത്തേത് പതിവായ ജനവിഭാഗനാമമായതിനാൽ സ്വാഭാവിക രൂപം തെരഞ്ഞെടുത്തു; അവസാനത്തേത് ലോത്തുമായുള്ള വംശബന്ധം വാക്യത്തിന്റെ വാദത്തിൽ പ്രസക്തമായതിനാൽ ബന്ധുത്വഭാഷ നിലനിർത്തി. അടിക്കുറിപ്പ് അക്ഷരാർഥം സംരക്ഷിക്കുന്നു.
- issue: יְרֻשָּׁה എന്നതിന്റെ ഭൂമിശാസ്ത്ര-ദൈവശാസ്ത്ര അർഥം
  choice: കൈവശമായി
  alternative: അവകാശമായി / പൈതൃകമായി
  rationale: വാചകം ദൈവം നൽകിയ സ്ഥിരമായ ഭൂവുടമസ്ഥതയെ സൂചിപ്പിക്കുന്നു; കുടുംബപാരമ്പര്യം മാത്രം മുൻനിർത്താതെ യഥാർഥ അർഥപരിധി നിലനിർത്തുന്നു.
- issue: תִּתְגָּר എന്നതിൽ യുദ്ധം വ്യക്തമായി ചേർക്കണോ
  choice: കലഹത്തിനു മുതിരുക
  alternative: യുദ്ധത്തിനു പ്രകോപിപ്പിക്കുക / ഏറ്റുമുട്ടുക
  rationale: സന്ദർഭം സൈനികമാണെങ്കിലും മൂലപാഠത്തിൽ ‘യുദ്ധം’ എന്ന നാമം തുറന്നുപറയുന്നില്ല. അതിനാൽ ശത്രുതാപരമായ ഏറ്റുമുട്ടൽ ആരംഭിക്കുന്ന അർഥം നിലനിർത്തി, വിശദീകരണം അമിതമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഏകവചന അഭിസംബോധനയായ ‘നീ/നിനക്ക്’ നിലനിർത്തി. ‘ഉപദ്രവിക്കുക’, ‘കലഹത്തിനു മുതിരുക’, ‘കൈവശമായി’ എന്നീ പ്രയോഗങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായിരിക്കെ മൂലപാഠത്തിന്റെ അർഥവ്യാപ്തിയും അനിശ്ചിതത്വവും സംരക്ഷിക്കുന്നു.
