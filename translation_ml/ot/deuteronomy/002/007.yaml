- from: നിന്റെ ദൈവമായ യഹ്‌വെ നിന്റെ കൈകളുടെ സകല പ്രവൃത്തിയിലും നിന്നെ അനുഗ്രഹിച്ചിരിക്കുന്നു. ഈ വലിയ മരുഭൂമിയിലൂടെയുള്ള നിന്റെ സഞ്ചാരം അവിടുന്ന് അറിഞ്ഞിരിക്കുന്നു.[a] ഈ നാല്പതു വർഷവും നിന്റെ ദൈവമായ യഹ്‌വെ നിന്നോടുകൂടെ ഉണ്ടായിരുന്നു; നിനക്ക് ഒന്നിനും കുറവുണ്ടായിട്ടില്ല.
  to: നിന്റെ ദൈവമായ യഹ്‌വെ നിന്റെ കൈയുടെ സകല പ്രവൃത്തികളിലും നിന്നെ അനുഗ്രഹിച്ചിരിക്കുന്നു. ഈ വലിയ മരുഭൂമിയിലൂടെയുള്ള നിന്റെ സഞ്ചാരം അവിടുന്ന് അറിഞ്ഞിരിക്കുന്നു.[a] ഈ നാല്പതു വർഷങ്ങളായി നിന്റെ ദൈവമായ യഹ്‌വെ നിന്നോടുകൂടെ ഉണ്ടായിരിക്കുന്നു; നിനക്ക് ഒന്നിനും കുറവുണ്ടായിട്ടില്ല.
  rationale: The revision preserves the draft’s faithful lexical approach while restoring the singular ‘hand’ in the Hebrew idiom and making the forty-year divine presence durative in natural modern Malayalam. The footnote remains anchored to ‘അറിഞ്ഞിരിക്കുന്നു’ and continues to distinguish the literal sense from the contextual implication of attentive care.
