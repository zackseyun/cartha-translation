source:
  edition: WLC
  text: כִּי֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ בֵּֽרַכְ/ךָ֗ בְּ/כֹל֙ מַעֲשֵׂ֣ה יָדֶ֔/ךָ יָדַ֣ע לֶכְתְּ/ךָ֔ אֶת הַ/מִּדְבָּ֥ר הַ/גָּדֹ֖ל הַ/זֶּ֑ה זֶ֣ה אַרְבָּעִ֣ים שָׁנָ֗ה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ עִמָּ֔/ךְ לֹ֥א חָסַ֖רְתָּ דָּבָֽר־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/007.yaml
  text: For Yahweh your God has blessed you in all the work of your hands[a]. He has known your walking through this great wilderness. These forty years Yahweh your God has been with you; you have lacked nothing.
translation:
  language: ml
  text: നിന്റെ ദൈവമായ യഹ്‌വെ നിന്റെ കൈയുടെ സകല പ്രവൃത്തികളിലും നിന്നെ അനുഗ്രഹിച്ചിരിക്കുന്നു. ഈ വലിയ മരുഭൂമിയിലൂടെയുള്ള നിന്റെ സഞ്ചാരം അവിടുന്ന് അറിഞ്ഞിരിക്കുന്നു.[a] ഈ നാല്പതു വർഷങ്ങളായി നിന്റെ ദൈവമായ യഹ്‌വെ നിന്നോടുകൂടെ ഉണ്ടായിരിക്കുന്നു; നിനക്ക് ഒന്നിനും കുറവുണ്ടായിട്ടില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഈ വലിയ മരുഭൂമിയിലൂടെയുള്ള നിന്റെ യാത്രയെ അവിടുന്ന് ശ്രദ്ധയോടെ കാത്തുപോന്നു.” എബ്രായ ക്രിയയുടെ അക്ഷരാർഥം “അറിഞ്ഞു” എന്നാണ്; ഈ സന്ദർഭത്തിൽ അത് ശ്രദ്ധാപൂർവമായ കരുതലിനെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു പദവിയായി മാറ്റാതെ മലയാളത്തിൽ ശബ്ദലിപ്യന്തരണം ചെയ്തു.
- source_word: בֵּרַכְךָ
  choice: നിന്നെ അനുഗ്രഹിച്ചിരിക്കുന്നു
  rationale: പൂർത്തിയായെങ്കിലും ഇപ്പോഴും പ്രസക്തമായ പ്രവൃത്തിയെ മലയാളത്തിലെ സ്വാഭാവിക വർത്തമാനപൂർണ രൂപത്തിൽ അവതരിപ്പിക്കുന്നു; ഉടമ്പടിസംബന്ധമായ ‘അനുഗ്രഹം’ എന്ന അർഥവും നിലനിർത്തുന്നു.
- source_word: בְּכֹל מַעֲשֵׂה יָדֶךָ
  choice: നിന്റെ കൈകളുടെ സകല പ്രവൃത്തിയിലും
  rationale: അധ്വാനത്തെയും പ്രവർത്തനങ്ങളെയും സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയുടെ ദൃശ്യസ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יָדַע
  choice: അറിഞ്ഞിരിക്കുന്നു
  rationale: ידע എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ അടങ്ങിയിരിക്കുന്ന ശ്രദ്ധാപൂർവമായ കരുതൽ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: לֶכְתְּךָ
  choice: നിന്റെ സഞ്ചാരം
  rationale: നടപ്പ്, യാത്ര, അലച്ചിൽ എന്നിവ ഉൾക്കൊള്ളുന്ന സന്ദർഭോചിതവും സ്വാഭാവികവുമായ മലയാള പ്രയോഗം.
- source_word: אֶת הַמִּדְבָּר הַגָּדֹל הַזֶּה
  choice: ഈ വലിയ മരുഭൂമിയിലൂടെയുള്ള
  rationale: സഞ്ചാരത്തിന്റെ ഭൂമിശാസ്ത്രപരമായ പാത മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: זֶה אַרְבָּעִים שָׁנָה
  choice: ഈ നാല്പതു വർഷവും
  rationale: തുടർച്ചയായ കാലയളവിനെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: עִמָּךְ
  choice: നിന്നോടുകൂടെ ഉണ്ടായിരുന്നു
  rationale: എബ്രായത്തിലെ ക്രിയാരഹിത പ്രയോഗത്തിന് മലയാളത്തിൽ ആവശ്യമായ ‘ഉണ്ടായിരുന്നു’ ചേർത്ത് ദീർഘകാല ദൈവസാന്നിധ്യം പ്രകടിപ്പിക്കുന്നു.
- source_word: לֹא חָסַרְתָּ דָּבָר
  choice: നിനക്ക് ഒന്നിനും കുറവുണ്ടായിട്ടില്ല
  rationale: സമ്പൂർണ പര്യാപ്തത സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തെ സ്വാഭാവിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമത്തെ ഒരു പദവികൊണ്ട് പകരാതെ, സാധാരണ അംഗീകരിക്കപ്പെടുന്ന ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: יָדַע എന്ന ക്രിയയിലെ അറിവും കരുതലും തമ്മിലുള്ള അർഥവ്യാപ്തി
  choice: പ്രധാന പാഠത്തിൽ ‘അറിഞ്ഞിരിക്കുന്നു’
  alternative: ‘നിന്റെ സഞ്ചാരത്തെ ശ്രദ്ധയോടെ കാത്തുപോന്നു’
  rationale: അടിസ്ഥാന ക്രിയാർഥവും സന്ദർഭസൂചിതമായ പരിപാലനവും തമ്മിലുള്ള ഉദ്ദേശ്യപൂർവമായ അർഥസംഘർഷം നിലനിർത്തി, വ്യാഖ്യാനവികാസം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഏകവചന രണ്ടാംപുരുഷരൂപം മൂലപാഠത്തോട് ഒത്തുനിൽക്കുന്നു. ദൈവത്തെ പരാമർശിക്കാൻ ആദരസൂചകമായ ‘അവിടുന്ന്’ ഉപയോഗിച്ചു; എന്നാൽ ‘യഹ്‌വെ ... ഉണ്ടായിരുന്നു’ എന്നിടത്ത് വാക്യഘടന സ്വാഭാവികമാക്കി.
