revisions:
- from: ഭക്ഷണം വെള്ളിക്കു[a] എനിക്കു വിൽക്കുക, ഞാൻ ഭക്ഷിക്കട്ടെ; വെള്ളവും വെള്ളിക്കു എനിക്കു തരുക, ഞാൻ കുടിക്കട്ടെ. കാൽനടയായി[b] കടന്നുപോകാൻ മാത്രം എന്നെ അനുവദിക്കുക—
