translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ അപേക്ഷാഭാവം ഉപയോഗിച്ചു. ‘വെള്ളി’ എന്ന മൂർത്തമായ മൂലപദം മുഖ്യവാചകത്തിൽ നിലനിർത്തി; ‘കാൽനടയായി’ എന്ന സ്വാഭാവിക പ്രയോഗത്തോടൊപ്പം അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകി. വാക്യാവസാനത്തിലെ ദീർഘരേഖ തുടർന്നുവരുന്ന പ്രസംഗത്തെ സൂചിപ്പിക്കുന്നതിനായി നിലനിർത്തി.
