base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/028.yaml
  text: You may sell me food for silver[a], so that I may eat, and give me water for silver, so that I may drink[b]; only let me pass through on my feet—
translation:
  language: ml
  text: വെള്ളിക്കു ഭക്ഷണം എനിക്കു വിൽക്കുക, എനിക്കു ഭക്ഷിക്കാനായി; വെള്ളിക്കു വെള്ളം എനിക്കു തരുക, എനിക്കു കുടിക്കാനായി. കാൽനടയായി[b] കടന്നുപോകാൻ മാത്രം എന്നെ അനുവദിക്കുക—
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘എന്റെ കാലുകളിൽ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹכֶל
  choice: ഭക്ഷണം
  rationale: ഇവിടെ ഏതെങ്കിലും പ്രത്യേക ധാന്യമോ അപ്പമോ അല്ല, പൊതുവായി ആഹാരമാണ് ഉദ്ദേശിക്കുന്നത്; അതിനാൽ ‘ഭക്ഷണം’ സ്വാഭാവികവും അർഥവ്യാപ്തി നിലനിർത്തുന്നതുമാണ്.
- source_word: בַּכֶּסֶף
  choice: വെള്ളിക്കു
  rationale: എബ്രായത്തിലെ മൂർത്തമായ ‘വെള്ളി’ എന്ന പദം നിലനിർത്തിക്കൊണ്ട് വിലകൊടുത്തുള്ള ഇടപാടിനെ സൂചിപ്പിക്കുന്നു; സ്വാഭാവികമായ ‘പണത്തിന്’ എന്നത് അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: תַּשְׁבִּרֵנִי
  choice: എനിക്കു വിൽക്കുക
  rationale: ഈ സന്ദർഭത്തിൽ שׁבר എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഭക്ഷണം വിൽക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; അപേക്ഷയുടെ ഭാവം ആജ്ഞാരൂപത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: וְאָכַלְתִּי
  choice: ഞാൻ ഭക്ഷിക്കട്ടെ
  rationale: അപേക്ഷയുടെ ഉദ്ദേശ്യഫലം പ്രകടമാക്കുന്നു; വെറും ഭാവികാല പ്രസ്താവനയായി മാറ്റുന്നില്ല.
- source_word: וּמַיִם
  choice: വെള്ളം
  rationale: മൂലപദത്തിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ തുല്യപദം.
- source_word: תִּתֶּן לִי
  choice: എനിക്കു തരുക
  rationale: נתן + ל എന്ന പ്രയോഗത്തിന്റെ ലളിതവും നേരിട്ടുള്ളതുമായ പരിഭാഷ.
- source_word: וְשָׁתִיתִי
  choice: ഞാൻ കുടിക്കട്ടെ
  rationale: മുൻ അപേക്ഷയുടെ ഉദ്ദേശ്യഫലം പ്രകടമാക്കുകയും ഭക്ഷണത്തെക്കുറിച്ചുള്ള സമാന്തര ഘടന നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: רַק
  choice: മാത്രം
  rationale: അപേക്ഷയുടെ പരിമിതമായ പരിധി വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: אֶעְבְּרָה
  choice: കടന്നുപോകാൻ എന്നെ അനുവദിക്കുക
  rationale: കോഹോർട്ടേറ്റീവ് രൂപത്തിന്റെ അനുവാദം അഭ്യർഥിക്കുന്ന ഭാവം വ്യക്തമായി പകർന്നുനൽകുന്നു.
- source_word: בְרַגְלָי
  choice: കാൽനടയായി
  rationale: അക്ഷരാർഥം ‘എന്റെ കാലുകളിൽ’ എന്നാണെങ്കിലും, അതിന്റെ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നത് ‘കാൽനടയായി’ എന്ന പ്രയോഗമാണ്; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
