translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഞങ്ങളെ നേരിടാൻ’ എന്നത് മൂലത്തിലെ സാപേക്ഷമായി തുറന്ന പ്രയോഗം കാത്തുസൂക്ഷിക്കുന്നു; ‘യുദ്ധത്തിനായി’ ശത്രുതാപരമായ സന്ദർഭം വ്യക്തമാക്കുന്നു. ഈ വാക്യത്തിന് അനിവാര്യമായ അടിക്കുറിപ്പ് ആവശ്യമില്ല.
