source:
  edition: WLC
  text: וַ/יֵּצֵא֩ סִיחֹ֨ן לִ/קְרָאתֵ֜/נוּ ה֧וּא וְ/כָל עַמּ֛/וֹ לַ/מִּלְחָמָ֖ה יָֽהְצָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/032.yaml
  text: Then Sihon came out to meet us[a], he and all his people[b], for battle at Jahaz.
translation:
  language: ml
  text: അപ്പോൾ സീഹോൻ, അവനും അവന്റെ സകലജനവും, യുദ്ധത്തിനായി ഞങ്ങളെ നേരിടാൻ യാഹാസിലേക്കു പുറപ്പെട്ടു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: പുറപ്പെട്ടുവന്നു
  rationale: יצא എന്ന ക്രിയയുടെ ആഖ്യാനഭൂതകാലവും ഇസ്രായേല്യരുടെ ദൃഷ്ടികോണത്തിൽ അവരുടെ നേരെയുള്ള നീക്കവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: סִיחֹן
  choice: സീഹോൻ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: לִקְרָאתֵנוּ
  choice: ഞങ്ങളെ നേരിടാൻ
  rationale: അക്ഷരാർഥത്തിലെ ‘ഞങ്ങളെ എതിരേൽക്കാൻ/കാണാൻ’ എന്ന ആശയം നിലനിർത്തുന്നു; ശത്രുതാപരമായ അർഥം തുടർന്നുള്ള ‘യുദ്ധത്തിനായി’ എന്ന പ്രയോഗത്തിൽനിന്ന് വ്യക്തമാണ്.
- source_word: הוּא וְכָל עַמּוֹ
  choice: സീഹോനും അവന്റെ സകലജനവും
  rationale: സ്വതന്ത്ര സർവനാമമായ הוּא നൽകുന്ന വിഷയവ്യക്തത മലയാളത്തിൽ പേരോടു ചേർന്ന ‘-ഉം’ ഘടനയിലൂടെ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു; עם എന്നത് ചുരുക്കി ‘സൈന്യം’ ആക്കാതെ ‘ജനം’ എന്നു നിലനിർത്തുന്നു.
- source_word: לַמִּלְחָמָה
  choice: യുദ്ധത്തിനായി
  rationale: ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന לְ ഘടനയും സൈനികസന്ദർഭവും സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: יָהְצָה
  choice: യാഹാസിൽവെച്ച്
  rationale: സ്ഥലനാമമായ יָהַץ-ന്റെ ദിശാസൂചക ה ഇവിടെ യാഹാസിലേക്കുള്ള നീക്കവുമായി ബന്ധപ്പെട്ട യുദ്ധസന്ദർഭം സൂചിപ്പിക്കുന്നു; മലയാളവാക്യത്തിൽ യുദ്ധം നടന്ന സ്ഥലമായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
