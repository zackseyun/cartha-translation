  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וָ/אֶשְׁלַ֤ח מַלְאָכִים֙ מִ/מִּדְבַּ֣ר קְדֵמ֔וֹת אֶל סִיח֖וֹן מֶ֣לֶךְ חֶשְׁבּ֑וֹן דִּבְרֵ֥י שָׁל֖וֹם לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/026.yaml
  text: So I sent messengers from the wilderness of Kedemoth to Sihon king of Heshbon with words of peace[a], saying,
translation:
  language: ml
  text: 'അങ്ങനെ ഞാൻ കെദേമോത്ത് മരുഭൂമിയിൽനിന്ന് ഹെശ്ബോൻ രാജാവായ സീഹോന്റെ അടുക്കലേക്ക് സമാധാനവാക്കുകളുമായി[a] ദൂതന്മാരെ അയച്ചു, ഇപ്രകാരം പറഞ്ഞു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സമാധാനവ്യവസ്ഥകളുമായി.’ എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ ‘സമാധാനത്തിന്റെ വാക്കുകൾ’ എന്നാണ്; സമാധാനപരമായ ഒരു നയതന്ത്രസമീപനത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלַח
  choice: അങ്ങനെ ഞാൻ ... അയച്ചു
  rationale: വാവ്-തുടർച്ച കഥയെ മുന്നോട്ടു കൊണ്ടുപോകുന്നതിനാൽ ‘അങ്ങനെ’ സ്വാഭാവികമായി ക്രമബന്ധം സൂചിപ്പിക്കുന്നു; ഒന്നാംപുരുഷ കർത്താവും നിലനിർത്തുന്നു.
- source_word: מַלְאָכִים
  choice: ദൂതന്മാരെ
  rationale: ഇവിടെ നയതന്ത്രസന്ദർഭത്തിലുള്ള മനുഷ്യസന്ദേശവാഹകരെയാണ് സൂചിപ്പിക്കുന്നത്; സ്വർഗീയ ദൂതന്മാരെയല്ല.
- source_word: מִמִּדְבַּר קְדֵמוֹת
  choice: കേദെമോത്ത് മരുഭൂമിയിൽനിന്ന്
  rationale: מִדְבָּר എന്നത് ജനവാസം കുറഞ്ഞ മരുഭൂപ്രദേശത്തെ സൂചിപ്പിക്കുന്നു; സ്ഥലനാമവും നിർമാണബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֶל סִיחוֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: ഹെശ്ബോൻരാജാവായ സീഹോന്റെ അടുക്കലേക്ക്
  rationale: ദൗത്യത്തിന്റെ സ്വീകർത്താവിനെ വ്യക്തമാക്കുകയും രാജപദവിയോടുകൂടിയ പേരിനെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: דִּבְרֵי שָׁלוֹם
  choice: സമാധാനവാക്കുകളുമായി
  rationale: ‘സമാധാനത്തിന്റെ വാക്കുകൾ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപവും സമാധാനപരമായ നയതന്ത്രസമീപനമെന്ന അർഥവും ഒരുപോലെ സംരക്ഷിക്കുന്നു.
- source_word: לֵאמֹר
  choice: 'അവർ പറയേണ്ടിയിരുന്നത്:'
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള പ്രസംഗത്തിലേക്കുള്ള ഉദ്ധരണിസൂചനയെ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു; സന്ദേശവാഹകരാണ് വാക്കുകൾ അറിയിക്കുന്നതെന്ന സന്ദർഭാർഥം തുറന്നുകാട്ടുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. സ്ഥലനാമങ്ങൾ ‘കേദെമോത്ത്,’ ‘ഹെശ്ബോൻ,’ ‘സീഹോൻ’ എന്നിങ്ങനെ ലിപ്യന്തരണം ചെയ്തു. വാക്യം അടുത്ത വാക്യത്തിലെ നേരിട്ടുള്ള പ്രസംഗത്തിലേക്ക് നീളുന്നതിനാൽ അവസാനം ദ്വിബിന്ദു നൽകി.
