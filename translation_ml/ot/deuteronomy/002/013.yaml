id: DEU.2.13
reference: Deuteronomy 2:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: עַתָּ֗ה קֻ֛מוּ וְ/עִבְר֥וּ לָ/כֶ֖ם אֶת נַ֣חַל זָ֑רֶד וַֽ/נַּעֲבֹ֖ר אֶת נַ֥חַל זָֽרֶד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/013.yaml
  text: Now rise up and cross over the Wadi Zered[a]. So we crossed over the Wadi Zered.
translation:
  language: ml
  text: “ഇപ്പോൾ എഴുന്നേറ്റ് സേരെദ് വാദി[a] കടക്കുവിൻ.” അങ്ങനെ ഞങ്ങൾ സേരെദ് വാദി കടന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സേരെദ് തോട്’ എന്നോ ‘സേരെദ് താഴ്വര’ എന്നോ പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിലെ נחל (നഹൽ) എന്ന പദം സന്ദർഭമനുസരിച്ച് ഒരു വാദി, തോട്, നീർച്ചാൽ, അല്ലെങ്കിൽ കാലാവസ്ഥാനുസൃതമായി വെള്ളമൊഴുകുന്ന താഴ്വരയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: ഇപ്പോൾ
  rationale: അടുത്ത കല്പിതപ്രവൃത്തി അവതരിപ്പിക്കുന്ന കാലസൂചകമായ പദം; എബ്രായത്തിലെ അടിയന്തരത സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: קֻמוּ
  choice: എഴുന്നേറ്റ്
  rationale: קום എന്ന ക്രിയയുടെ ബഹുവചന ആജ്ഞാരൂപം; ആജ്ഞയുടെ ഊന്നൽ നിലനിർത്തുന്ന, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗം.
- source_word: וְעִבְרוּ
  choice: കടക്കുവിൻ
  rationale: യാത്രാസന്ദർഭത്തിൽ ഒരു വശത്തുനിന്ന് മറുവശത്തേക്കു കടക്കുക എന്ന അർഥം; പിന്നാലെയുള്ള അതേ ക്രിയയുമായുള്ള ആവർത്തനം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: לָכֶם
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ആജ്ഞയ്ക്ക് ഊന്നൽ നൽകുന്ന നൈതിക ദാതിവ് മലയാളത്തിൽ പ്രത്യേകം ചേർത്താൽ കൃത്രിമമാകും; ആജ്ഞാരൂപത്തിൽ അതിന്റെ പ്രഭാവം ഉൾക്കൊള്ളുന്നു.
- source_word: נַחַל
  choice: തോടുപള്ള
  rationale: കാലാവസ്ഥാനുസൃതമായി വെള്ളമൊഴുകാവുന്ന തോട്, നീർച്ചാൽപ്പള്ള, അല്ലെങ്കിൽ താഴ്വര എന്ന ഭൂപ്രകൃതിയെ സൂചിപ്പിക്കാം. ‘തോടുപള്ള’ വരണ്ട പ്രദേശത്തെ ജലപാതയുടെയും പള്ളത്തിന്റെയും സംയുക്തഭാവം നൽകുന്നു; അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: זָרֶד
  choice: സേരെദ്
  rationale: സ്ഥലനാമം മലയാള ലിപിയിൽ മൂലോച്ചാരണത്തോട് അടുത്തായി ലിപ്യന്തരിച്ചു.
- source_word: וַנַּעֲבֹר
  choice: അങ്ങനെ ഞങ്ങൾ ... കടന്നു
  rationale: ഒന്നാംപുരുഷ ബഹുവചനത്തിലെ തുടർകഥനരൂപം കല്പനയുടെ നിർവഹണം വിവരിക്കുന്നു; ‘അങ്ങനെ’ സ്വാഭാവികമായ ഫലക്രമം പ്രകടമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായിക്കാൻ എളുപ്പവുമായ ശൈലി. ദൈവിക ആജ്ഞയ്ക്ക് ‘കടക്കുവിൻ’ എന്ന ബഹുവചന മാന്യ/ഔപചാരിക രൂപം ഉപയോഗിച്ചു. נחל എന്ന പദത്തിന്റെ ഭൂപ്രകൃതിസംബന്ധിയായ അവ്യക്തത മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
