  text: וְ/הָֽ/עַוִּ֛ים הַ/יֹּשְׁבִ֥ים בַּ/חֲצֵרִ֖ים עַד עַזָּ֑ה כַּפְתֹּרִים֙ הַ/יֹּצְאִ֣ים מִ/כַּפְתּ֔וֹר הִשְׁמִידֻ֖/ם וַ/יֵּשְׁב֥וּ תַחְתָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/023.yaml
  text: As for the Avvim[a], who lived in villages as far as Gaza, the Caphtorim, who came out from Caphtor[b], destroyed them and settled in their place.
translation:
  language: ml
  text: ഗസ്സവരെ കുടിയിരുപ്പുകളിൽ[b] താമസിച്ചിരുന്ന അവ്വീം ജനതയെ[a], കഫ്തോരിൽനിന്ന് പുറപ്പെട്ടുവന്ന കഫ്തോര്യർ നശിപ്പിച്ച് അവരുടെ സ്ഥാനത്ത് പാർത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘അവ്വീയർ.’
    reason: lexical_alternative
  - marker: b
    text: ‘കുടിയിരുപ്പുകൾ’ എന്നത് ‘ഗ്രാമങ്ങൾ’ എന്നോ ‘പാളയങ്ങൾ’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעַוִּים
  choice: അവ്വീം ജനത
  rationale: ജനവിഭാഗത്തിന്റെ പേരായതിനാൽ മൂലരൂപത്തോട് അടുത്ത ലിപ്യന്തരണം നിലനിർത്തി; മലയാളത്തിൽ ബഹുവചനപ്രത്യയം ഇരട്ടിക്കാതിരിക്കാൻ ‘ജനത’ ചേർത്തു.
- source_word: הַיֹּשְׁבִים
  choice: താമസിച്ചിരുന്ന
  rationale: ישב ഇവിടെ സ്ഥിരവാസത്തെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ ഭൂതകാലബന്ധവാക്യരൂപം ഉപയോഗിച്ചു.
- source_word: בַּחֲצֵרִים
  choice: കുടിയിരുപ്പുകളിൽ
  rationale: חֲצֵרִים എന്ന പദത്തിന് മതിലില്ലാത്ത ഗ്രാമങ്ങൾ, ചെറുകുടിയിരുപ്പുകൾ, പാളയങ്ങൾ എന്നീ അർഥസാധ്യതകളുള്ളതിനാൽ വിശാലമായ അർഥം നൽകുന്ന ‘കുടിയിരുപ്പുകൾ’ തിരഞ്ഞെടുത്തു.
- source_word: עַד עַזָּה
  choice: ഗസ്സവരെ
  rationale: עַד സൂചിപ്പിക്കുന്ന ഭൂമിശാസ്ത്രപരമായ പരിധി സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: כַּפְתֹּרִים
  choice: കഫ്തോര്യർ
  rationale: കഫ്തോരിൽനിന്നുള്ള ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന പേര് മലയാളത്തിലെ സ്വാഭാവിക ജനനാമരൂപത്തിൽ നൽകി.
- source_word: הַיֹּצְאִים מִכַּפְתּוֹר
  choice: കഫ്തോരിൽനിന്ന് പുറപ്പെട്ടുവന്ന
  rationale: יצא എന്ന ക്രിയയിലെ ‘പുറപ്പെടുക’ എന്ന ചലനചിത്രം നിലനിർത്തിക്കൊണ്ട് ലക്ഷ്യസ്ഥാനത്തിന്റെ വീക്ഷണത്തിലുള്ള ‘വന്ന’ എന്ന ആശയവും സ്വാഭാവികമായി ചേർത്തു.
- source_word: הִשְׁמִידֻם
  choice: അവരെ നശിപ്പിച്ച്
  rationale: Hiphil രൂപത്തിലുള്ള שׁמד സൂചിപ്പിക്കുന്ന ശക്തമായ നശീകരണാർഥം നിലനിർത്തുന്നു; അനാവശ്യമായി കൂടുതൽ വികാരതീവ്രത ചേർക്കുന്നില്ല.
- source_word: וַיֵּשְׁבוּ תַחְתָּם
  choice: അവരുടെ സ്ഥാനത്ത് പാർത്തു
  rationale: മുൻനിവാസികളെ മാറ്റി അവരുടെ പ്രദേശത്ത് വസിച്ചതെന്ന പകരംവരവിന്റെ ആശയം വ്യക്തമായി നൽകുന്നു.
