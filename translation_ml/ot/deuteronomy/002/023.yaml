translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ജനനാമങ്ങൾ തിരിച്ചറിയാവുന്ന ലിപ്യന്തരണത്തിലും സ്വാഭാവിക മലയാളരൂപത്തിലും നൽകി. ഇംഗ്ലീഷ് consultation പാഠത്തിൽ [b] അടയാളം ‘Caphtor’ എന്നതിനു ശേഷം വന്നിരുന്നെങ്കിലും അതിന്റെ കുറിപ്പ് חֲצֵרִים എന്ന പദത്തെക്കുറിച്ചായതിനാൽ മലയാള മുഖ്യപാഠത്തിൽ ‘കുടിയിരുപ്പുകളിൽ’ എന്നതിനുശേഷം ശരിയായ സ്ഥാനത്ത് ചേർത്തു.
