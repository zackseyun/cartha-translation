reference: Deuteronomy 2:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/נַּעֲבֹ֞ר מֵ/אֵ֧ת אַחֵ֣י/נוּ בְנֵי עֵשָׂ֗ו הַ/יֹּֽשְׁבִים֙ בְּ/שֵׂעִ֔יר מִ/דֶּ֨רֶךְ֙ הָֽ/עֲרָבָ֔ה מֵ/אֵילַ֖ת וּ/מֵ/עֶצְיֹ֣ן גָּ֑בֶר וַ/נֵּ֨פֶן֙ וַֽ/נַּעֲבֹ֔ר דֶּ֖רֶךְ מִדְבַּ֥ר מוֹאָֽב־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/008.yaml
  text: So we passed on from our brothers[a], the sons of Esau, who live in Seir, away from the way of the Arabah, from Elath and from Ezion-geber[b]; and we turned and passed by the way of the wilderness of Moab.
translation:
  language: ml
  text: അങ്ങനെ, അരാബാ വഴിയിൽനിന്ന്, ഏലാത്തിൽനിന്നും എസ്യോൻ-ഗേബെരിൽനിന്നും, സേയീരിൽ താമസിക്കുന്ന നമ്മുടെ സഹോദരന്മാരായ[a] ഏശാവിന്റെ പുത്രന്മാരുടെ അരികിൽനിന്ന് ഞങ്ങൾ മുന്നോട്ടുകടന്നുപോയി; പിന്നെ ഞങ്ങൾ തിരിഞ്ഞ് മോവാബ് മരുഭൂമിയിലെ വഴിയിലൂടെ കടന്നുപോയി.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നമ്മുടെ ബന്ധുക്കളായ ഏശാവിന്റെ സന്തതികൾ.’ എബ്രായത്തിൽ അക്ഷരാർഥം ‘നമ്മുടെ സഹോദരന്മാർ, ഏശാവിന്റെ പുത്രന്മാർ’ എന്നാണ്.
    reason: alternative_reading
  - marker: b
    text: അരാബാ എന്നത് ചാവുകടലിന്റെ തെക്കുഭാഗത്തുള്ള ഭ്രംശതാഴ്‌വരാ പ്രദേശത്തെ സൂചിപ്പിക്കുന്നു. എബ്രായപ്രയോഗം ‘അരാബാ വഴിയിൽനിന്ന്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנַּעֲבֹר מֵאֵת
  choice: അരികിലൂടെ ഞങ്ങൾ കടന്നുപോയി
  rationale: עבר എന്ന യാത്രാക്രിയയും വ്യക്തികളെ സൂചിപ്പിക്കുന്ന מֵאֵת എന്ന പ്രയോഗവും ചേർന്ന് അവരുടെ സമീപത്തുകൂടി അവരെ പിന്നിലാക്കി യാത്ര തുടരുന്നതാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ഈ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אַחֵינוּ בְנֵי עֵשָׂו
  choice: നമ്മുടെ സഹോദരന്മാരായ ഏശാവിന്റെ പുത്രന്മാർ
  rationale: എദോമ്യരോടുള്ള ഇസ്രായേലിന്റെ ബന്ധുത്വം വ്യക്തമാക്കുന്ന ‘നമ്മുടെ സഹോദരന്മാർ’ എന്ന എബ്രായപ്രയോഗം നിലനിർത്തുന്നു; בְנֵי എന്നത് ‘പുത്രന്മാർ’ എന്നു അടുത്തായി പരിഭാഷപ്പെടുത്തി.
- source_word: הַיֹּשְׁבִים בְּשֵׂעִיר
  choice: സേയീരിൽ താമസിക്കുന്ന
  rationale: ישב ഇവിടെ സ്ഥിരവാസത്തെ സൂചിപ്പിക്കുന്നു; ‘താമസിക്കുന്ന’ ആധുനികവും സ്വാഭാവികവുമാണ്.
- source_word: מִדֶּרֶךְ הָעֲרָבָה
  choice: അരാബാ വഴി വിട്ട്
  rationale: דֶּרֶךְ എന്നത് ‘വഴി’ എന്നും מן ദിശമാറ്റി അകന്നുപോകുന്നതിനെ ‘വിട്ട്’ എന്നും നൽകി. അരാബാ ഒരു ഭൂപ്രദേശനാമമായതിനാൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: מֵאֵילַת וּמֵעֶצְיֹן גָּבֶר
  choice: ഏലാത്തിൽനിന്നും എസ്യോൻ-ഗേബെരിൽനിന്നുമുള്ള
  rationale: രണ്ടു സ്ഥലനാമങ്ങൾക്കും മുമ്പിലുള്ള מן സംരക്ഷിച്ച് അവയെ അരാബാ വഴിയുമായി സ്വാഭാവിക മലയാളത്തിൽ ബന്ധിപ്പിച്ചു.
- source_word: וַנֵּפֶן
  choice: ഞങ്ങൾ തിരിഞ്ഞ്
  rationale: פנה സൂചിപ്പിക്കുന്ന ദിശമാറ്റം നേരിട്ട് പകർത്തുന്നു.
- source_word: וַנַּעֲבֹר דֶּרֶךְ מִדְבַּר מוֹאָב
  choice: മോവാബ് മരുഭൂമിവഴിയായി പോയി
  rationale: ആവർത്തിക്കുന്ന עבר യാത്ര തുടരുന്നതായി നൽകുകയും דֶּרֶךְ מִדְבַּר מוֹאָב എന്ന പാതാസൂചന സ്വാഭാവികമായ മലയാളത്തിൽ പകർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: എദോമിനോടുള്ള ബന്ധുത്വഭാഷ
  choice: നമ്മുടെ സഹോദരന്മാരായ ഏശാവിന്റെ പുത്രന്മാർ
  alternative: നമ്മുടെ ബന്ധുക്കളായ ഏശാവിന്റെ സന്തതികൾ
  rationale: ‘സഹോദരന്മാർ’ എന്നും ‘പുത്രന്മാർ’ എന്നും ഉള്ള മൂലപാഠത്തിന്റെ വ്യക്തമായ ബന്ധുത്വഭാഷ നിലനിർത്തുന്നു; അതിനെ പൊതുവായ വംശീയബന്ധമായി മയപ്പെടുത്തുന്നില്ല.
- issue: അരാബാ വഴിയിൽനിന്നുള്ള നീക്കത്തിന്റെ ബന്ധം
  choice: ഏലാത്തിൽനിന്നും എസ്യോൻ-ഗേബെരിൽനിന്നുമുള്ള അരാബാ വഴി വിട്ട്
  alternative: അരാബാ വഴിയിലൂടെ, ഏലാത്തും എസ്യോൻ-ഗേബെരും കടന്ന്
  rationale: എബ്രായത്തിലെ ആവർത്തിച്ച מן ‘നിന്ന്’ എന്ന ആശയം സംരക്ഷിക്കുന്നു. സ്ഥലങ്ങൾ വഴിയുടെ ആരംഭമോ യാത്രയിൽ കടന്നുപോയ ഇടങ്ങളോ എന്നത് വ്യാഖ്യാനിച്ച് ഉറപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ യാത്രാവിവരണശൈലി സ്വീകരിച്ചു. ‘പാർക്കുന്ന’ എന്നതിനെക്കാൾ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ ‘താമസിക്കുന്ന’ ഉപയോഗിച്ചു. സ്ഥലനാമങ്ങൾ മലയാള ബൈബിൾ ഉപയോഗത്തിന് പരിചിതമായ രൂപങ്ങളിൽ ലിപ്യന്തരിച്ചു; മൂലപാഠത്തിലെ ബന്ധുത്വഭാഷയും യാത്രയുടെ ദിശയെക്കുറിച്ചുള്ള ചെറിയ വാക്യഘടനാപരമായ അനിശ്ചിതത്വവും പരമാവധി നിലനിർത്തി.
