source:
  edition: WLC
  text: אַתָּ֨ה עֹבֵ֥ר הַ/יּ֛וֹם אֶת גְּב֥וּל מוֹאָ֖ב אֶת עָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/018.yaml
  text: You are crossing today the border of Moab at Ar[a].
translation:
  language: ml
  text: നീ ഇന്ന് മോവാബിന്റെ അതിർത്തിയായ ആർ കടക്കുകയാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “മോവാബിന്റെ അതിർത്തി, അതായത് ആർ.” എബ്രായത്തിൽ ‘മോവാബിന്റെ അതിർത്തി’ക്കും ‘ആർ’ക്കും മുമ്പ് കർമചിഹ്നം ആവർത്തിക്കുന്നു; അതിനാൽ ‘ആർ’ മോവാബിന്റെ അതിർത്തിപ്രദേശത്തെയോ നഗരത്തെയോ സമാനാധികരണമായി തിരിച്ചറിയുന്നതായിരിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַתָּה
  choice: നീ
  rationale: രണ്ടാം പുരുഷ ഏകവചന സർവനാമം; ഇസ്രായേലിനെ ഒരു സമൂഹമായി ഏകവചനത്തിൽ അഭിസംബോധന ചെയ്യുന്നതു വികസിപ്പിക്കാതെ നിലനിർത്തുന്നു.
- source_word: עֹבֵר
  choice: കടക്കുകയാണ്
  rationale: സ്വതന്ത്ര സർവനാമത്തോടുകൂടിയ പ്രവചനാത്മക Qal കർത്തൃവാചക രൂപം സന്ദർഭത്തിലെ ഉടനടി നടക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ വർത്തമാന പുരോഗമനരൂപം അതു സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הַיּוֹם
  choice: ഇന്ന്
  rationale: സാധാരണ കാലസൂചക പ്രയോഗത്തിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: גְּבוּל
  choice: അതിർത്തി
  rationale: ഇവിടെ മോവാബിന്റെ ഭൂപ്രദേശപരമായ അതിരാണ് ഉദ്ദേശ്യം; ആധുനിക മലയാളത്തിൽ വ്യക്തമായ പദം.
- source_word: מוֹאָב
  choice: മോവാബ്
  rationale: സ്ഥലപ്പേരിന്റെ പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണം.
- source_word: עָר
  choice: ആർ
  rationale: സ്ഥലപ്പേര് വിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ പകർത്തുന്നു.
- source_word: אֶת ... אֶת
  choice: മോവാബിന്റെ അതിർത്തിയായ ആർ
  rationale: രണ്ടാമത്തെ കർമചിഹ്നം ‘ആർ’ എന്നതിനെ ‘മോവാബിന്റെ അതിർത്തി’യോട് സമാനാധികരണമായി ബന്ധിപ്പിക്കാം. മുഖ്യപാഠത്തിൽ ഈ ബന്ധം നിലനിർത്തുന്നു; ഭൂമിശാസ്ത്രപരമായ ‘ആറിനടുത്തുള്ള’ എന്ന വായന കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: ഇസ്രായേലിനോടുള്ള ഏകവചന അഭിസംബോധന
  choice: ‘നീ’ എന്ന ഏകവചനം നിലനിർത്തുക
  alternative: ‘നിങ്ങൾ’ അല്ലെങ്കിൽ ‘ഇസ്രായേലേ, നീ’ എന്നു വികസിപ്പിക്കുക
  rationale: എബ്രായ പാഠം ഇസ്രായേലിനെ സമൂഹപരമായ ഏകകമായി അഭിസംബോധന ചെയ്യുന്നു. വ്യാഖ്യാനപരമായ കൂട്ടിച്ചേർക്കൽ കൂടാതെ അതിന്റെ വാഗ്‌രീതി നിലനിർത്തുന്നു.
- issue: ‘ആർ’ എന്നതിന്റെ വ്യാകരണബന്ധം
  choice: മോവാബിന്റെ അതിർത്തിയെ ‘ആർ’ എന്നു സമാനാധികരണമായി തിരിച്ചറിയുക
  alternative: ആറിനടുത്തുവെച്ച് മോവാബിന്റെ അതിർത്തി കടക്കുന്നു
  rationale: ആവർത്തിച്ച אֶת സമാനാധികരണത്തെ പിന്തുണയ്ക്കുന്നു, എന്നാൽ കൃത്യബന്ധത്തിൽ യഥാർത്ഥ അവ്യക്തതയുണ്ട്; അതിനാൽ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. സ്ഥലനാമങ്ങൾ പ്രചാരത്തിലുള്ള ബൈബിൾ മലയാള ലിപ്യന്തരണത്തിൽ നൽകിയിരിക്കുന്നു; എബ്രായത്തിലെ ഏകവചന അഭിസംബോധനയും വാക്യഘടനയിലെ യഥാർത്ഥ അവ്യക്തതയും സംരക്ഷിച്ചിട്ടുണ്ട്.
