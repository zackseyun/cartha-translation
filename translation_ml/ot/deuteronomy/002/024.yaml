source:
  edition: WLC
  text: ק֣וּמוּ סְּע֗וּ וְ/עִבְרוּ֮ אֶת נַ֣חַל אַרְנֹן֒ רְאֵ֣ה נָתַ֣תִּי בְ֠/יָדְ/ךָ אֶת סִיחֹ֨ן מֶֽלֶךְ חֶשְׁבּ֧וֹן הָֽ/אֱמֹרִ֛י וְ/אֶת אַרְצ֖/וֹ הָחֵ֣ל רָ֑שׁ וְ/הִתְגָּ֥ר בּ֖/וֹ מִלְחָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/024.yaml
  text: Rise up[a], set out, and cross over the Arnon Valley. See, I have given into your hand Sihon king of Heshbon, the Amorite, and his land. Begin to take possession of it[c][b], and engage him in battle.
translation:
  language: ml
  text: എഴുന്നേൽക്കുവിൻ, പുറപ്പെടുവിൻ; അർന്നോൻ താഴ്വര[a] കടക്കുവിൻ. നോക്കൂ, ഹെശ്ബോൻ രാജാവായ അമോര്യൻ സീഹോനെയും അവന്റെ ദേശത്തെയും ഞാൻ നിന്റെ കൈയിൽ ഏല്പിച്ചിരിക്കുന്നു. അതു കൈവശമാക്കാൻ തുടങ്ങുക[b]; അവനോടു യുദ്ധത്തിൽ ഏറ്റുമുട്ടുക[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അർന്നോൻ വാടി’ അല്ലെങ്കിൽ ‘അർന്നോൻ തോട്’ എന്നും പരിഭാഷപ്പെടുത്താം; നַחַל എന്ന ഹീബ്രു പദം വാടി, വരണ്ട നീർച്ചാൽ, അല്ലെങ്കിൽ താഴ്വര എന്നിവയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘അതു സ്വന്തമാക്കാൻ തുടങ്ങുക’ എന്നും പരിഭാഷപ്പെടുത്താം. ഈ ക്രിയയ്ക്ക് ‘കൈവശക്കാരെ നീക്കുക’ എന്ന അർഥവും വരാം; എന്നാൽ ഇവിടെ തൊട്ടുമുമ്പുള്ള കർമം സീഹോന്റെ ദേശമാണ്.
    reason: lexical_alternative
  - marker: c
    text: ‘അവനോടു യുദ്ധത്തിൽ പോരാടുക’ അല്ലെങ്കിൽ ‘അവനെ യുദ്ധത്തിനു പ്രകോപിപ്പിക്കുക’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וּמוּ סְּע֗וּ
  choice: നിങ്ങൾ എഴുന്നേറ്റ് യാത്ര പുറപ്പെടുക
  rationale: രണ്ട് ബഹുവചന ആജ്ഞകളുടെയും ചലനാത്മകത സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְעִבְרוּ֮ אֶת נַ֣חַל אַרְנֹן
  choice: അർന്നോൻ താഴ്വര കടക്കുക
  rationale: עבר ഭൂമിശാസ്ത്രപരമായ അതിർത്തി കടക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; נחל എന്ന പദത്തിന്റെ താഴ്വര/വാടി അർഥം മുഖ്യപാഠത്തിൽ വായനാസൗകര്യത്തോടെ നൽകുന്നു.
- source_word: רְאֵ֣ה
  choice: നോക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഏകവചന ആജ്ഞയുടെ നേരിട്ടുള്ള, ആധുനിക രൂപം.
- source_word: נָתַ֣תִּי בְ֠יָדְךָ
  choice: ഞാൻ നിന്റെ കൈയിൽ ഏല്പിച്ചിരിക്കുന്നു
  rationale: അധികാരത്തിനോ നിയന്ത്രണത്തിനോ കീഴിൽ നൽകുക എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ കൈ എന്ന ദൃശ്യരൂപവും പൂർത്തിയായ ദാനത്തിന്റെ ഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: סִיחֹ֨ן מֶֽלֶךְ חֶשְׁבּ֧וֹן הָאֱמֹרִ֛י
  choice: ഹെശ്ബോൻ രാജാവായ അമോര്യൻ സീഹോൻ
  rationale: സീഹോന്റെ രാജപദവിയും വംശപരമായ തിരിച്ചറിയലും വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וְאֶת אַרְצ֖וֹ
  choice: അവന്റെ ദേശത്തെയും
  rationale: രാജാവിന്റെ അധീനപ്രദേശത്തെ സൂചിപ്പിക്കുന്ന אֶרֶץ എന്ന പദത്തിന്റെ നേരിട്ടുള്ള മലയാളരൂപം.
- source_word: הָחֵ֣ל רָ֑שׁ
  choice: അതു കൈവശമാക്കാൻ തുടങ്ങുക
  rationale: ירש എന്ന പദത്തിന്റെ ‘കൈവശമാക്കുക’ എന്ന സന്ദർഭോചിത അർഥം സ്വീകരിക്കുന്നു; സമീപസ്ഥമായ ‘അവന്റെ ദേശം’ ആണ് കർമമെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: וְהִתְגָּ֥ר בּ֖וֹ מִלְחָמָֽה
  choice: അവനോടു യുദ്ധത്തിൽ ഏറ്റുമുട്ടുക
  rationale: ശത്രുതാപരമായ പോരാട്ടത്തിൽ പ്രവേശിക്കുക എന്ന ആശയം അനാവശ്യമായി ‘പ്രകോപിപ്പിക്കുക’ എന്നിലേക്ക് ചുരുക്കാതെ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: ദൈവിക ദാനവും കീഴടക്കലിലെ മനുഷ്യപ്രവർത്തനവും
  choice: ‘ഞാൻ ... ഏല്പിച്ചിരിക്കുന്നു’ എന്ന പൂർത്തിയായ ദൈവിക ദാനവും ‘കൈവശമാക്കാൻ തുടങ്ങുക; ... ഏറ്റുമുട്ടുക’ എന്ന മനുഷ്യനോടുള്ള ആജ്ഞയും ഒരുപോലെ നിലനിർത്തി.
  alternative: ദൈവിക പ്രസ്താവനയെ ‘ഞാൻ ഏല്പിക്കും’ എന്ന ഭാവിവാഗ്ദാനമാക്കുക, അല്ലെങ്കിൽ ירש എന്നത് മുഖ്യപാഠത്തിൽ ‘കുടിയൊഴിപ്പിക്കുക’ എന്നു നൽകുക.
  rationale: ഹീബ്രു പാഠം ദൈവത്തിന്റെ പൂർത്തിയായ ദാനത്തെയും ഇസ്രായേലിന്റെ നിർബന്ധിത പ്രവർത്തനത്തെയും ചേർത്തുനിർത്തുന്നു; ആ പിരിമുറുക്കം പരിഹരിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ആദ്യത്തെ ബഹുവചന ആജ്ഞകളിൽ നിന്ന് ഇസ്രായേലിനെ ഏകസമൂഹമായി അഭിസംബോധന ചെയ്യുന്ന ഏകവചനത്തിലേക്കുള്ള ഹീബ്രു മാറ്റം ‘നിങ്ങൾ’/‘നിന്റെ’ എന്ന വ്യത്യാസത്തിലൂടെ സംരക്ഷിച്ചു. സ്രോതസ്സിലെ ഊന്നൽ നിലനിർത്താൻ ‘കൈയിൽ’ എന്ന രൂപകം സൂക്ഷിച്ചു.
