source:
  edition: WLC
  text: וְ/אֶת הָ/עָם֮ צַ֣ו לֵ/אמֹר֒ אַתֶּ֣ם עֹֽבְרִ֗ים בִּ/גְבוּל֙ אֲחֵי/כֶ֣ם בְּנֵי עֵשָׂ֔ו הַ/יֹּשְׁבִ֖ים בְּ/שֵׂעִ֑יר וְ/יִֽירְא֣וּ מִ/כֶּ֔ם וְ/נִשְׁמַרְתֶּ֖ם מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/004.yaml
  text: And command the people[a], saying, ‘You are about to pass through the territory of your brothers, the sons of Esau, who live in Seir; and they will be afraid of you[c][b]. So be very careful.’
translation:
  language: ml
  text: 'ജനത്തോടു കൽപിച്ച് ഇപ്രകാരം പറയുക: ‘സേയീരിൽ പാർക്കുന്ന നിങ്ങളുടെ സഹോദരന്മാരായ ഏശാവിന്റെ മക്കളുടെ പ്രദേശത്തുകൂടി നിങ്ങൾ കടന്നുപോകാനിരിക്കുകയാണ്[a][b]. അവർ നിങ്ങളെ ഭയപ്പെടും. അതുകൊണ്ട് നിങ്ങൾ വളരെ ജാഗ്രത പാലിക്കണം[c].’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിങ്ങൾ കടന്നുപോകുന്നു’ എന്നോ ‘നിങ്ങൾ കടന്നുപോകും’ എന്നോ പരിഭാഷപ്പെടുത്താം. എബ്രായ ക്രിയാരൂപം ആസന്നമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘അതിർത്തിയിലൂടെ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ പദത്തിന് അതിർത്തിരേഖയെയോ അതിനുള്ളിലെ പ്രദേശത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘അതിനാൽ നിങ്ങളെത്തന്നെ വളരെ സൂക്ഷിച്ചുകൊള്ളുക.’
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  choice: കല്പിച്ചുപറയുക
  rationale: צוה എന്ന ശക്തമായ ആജ്ഞാക്രിയയുടെ അധികാരപരമായ ഭാവം ‘കല്പിക്കുക’ നിലനിർത്തുന്നു; לֵאמֹר-ന്റെ അർഥവും സ്വാഭാവികമായി ചേർക്കുന്നു.
- source_word: הָעָם
  choice: ജനം
  rationale: ഇവിടെ עם ഇസ്രായേൽജനത്തെ സമൂഹമായി സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘ജനം’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: אַתֶּם עֹבְרִים
  choice: നിങ്ങൾ ഇപ്പോൾ കടന്നുപോകാനിരിക്കുകയാണ്
  rationale: സ്വതന്ത്ര സർവനാമത്തോടുകൂടിയ participle സന്ദർഭത്തിൽ ആസന്നമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ഈ പ്രയോഗം അതിന്റെ imminent force വ്യക്തമാക്കുന്നു.
- source_word: בִּגְבוּל
  choice: പ്രദേശത്തുകൂടി
  rationale: גְּבוּל അതിർത്തിരേഖയെയോ അതിനുള്ളിലെ ഭൂപ്രദേശത്തെയോ സൂചിപ്പിക്കാം; യാത്രാസന്ദർഭത്തിൽ ‘പ്രദേശം’ മുഖ്യവായനയായി യോജിക്കുന്നു, യഥാർഥ ദ്വയാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אֲחֵיכֶם בְּנֵי עֵשָׂו
  choice: നിങ്ങളുടെ സഹോദരന്മാരായ ഏശാവിന്റെ മക്കൾ
  rationale: ‘സഹോദരന്മാർ’ എന്ന ബന്ധുത്വഭാഷയും ‘ഏശാവിന്റെ മക്കൾ’ എന്ന വംശാവലിപ്രയോഗവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: הַיֹּשְׁבִים בְּשֵׂעִיר
  choice: സേയീരിൽ പാർക്കുന്ന
  rationale: ישב ഇവിടെ സ്ഥിരതാമസത്തെ സൂചിപ്പിക്കുന്നു; ‘പാർക്കുന്ന’ ദignified ആയതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമാണ്.
- source_word: וְיִירְאוּ מִכֶּם
  choice: അവർ നിങ്ങളെ ഭയപ്പെടും
  rationale: ירא + מן ഇവിടെ ഇസ്രായേലിനെക്കുറിച്ചുള്ള ഭയം പ്രകടിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ രൂപം വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וְנִשְׁמַרְתֶּם מְאֹד
  choice: അതുകൊണ്ട് നിങ്ങൾ വളരെ ജാഗ്രത പാലിക്കണം
  rationale: Niphal രൂപത്തിന്റെ ആത്മനിർദ്ദേശപരമായ ‘സ്വയം സൂക്ഷിക്കുക’ എന്ന ബലം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; מְאֹד-ന്റെ ഊന്നൽ ‘വളരെ’ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഏദോമുമായുള്ള ബന്ധുത്വഭാഷ
  choice: നിങ്ങളുടെ സഹോദരന്മാരായ ഏശാവിന്റെ മക്കൾ
  alternative: നിങ്ങളുടെ ബന്ധുക്കളായ ഏശാവിന്റെ സന്തതികൾ
  rationale: ഇസ്രായേലും ഏദോമും തമ്മിലുള്ള വംശപരമായ സഹോദരബന്ധത്തെ വാക്യം ഉദ്ദേശപൂർവം മുന്നോട്ടുവയ്ക്കുന്നു. അതിനാൽ ‘സഹോദരന്മാർ’ എന്നും ‘മക്കൾ’ എന്നും ഉള്ള നേരിട്ടുള്ള ഭാഷ മൃദൂകരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കല്പിക്കുക’, ‘പാർക്കുക’, ‘ജാഗ്രത പാലിക്കുക’ എന്നിവ സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായിരിക്കെ വചനത്തിന്റെ അധികാരപരവും ഔപചാരികവുമായ സ്വരം നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട മുഖ്യവാചകഭാഗങ്ങളിൽ ചേർത്തിരിക്കുന്നു.
