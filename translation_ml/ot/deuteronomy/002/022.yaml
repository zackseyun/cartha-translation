  yaml_path: translation/ot/deuteronomy/002/022.yaml
  text: just as he did for the sons of Esau who live in Seir[a], when he destroyed the Horites from before them[c][b], and they dispossessed them and settled in their place to this day.
translation:
  language: ml
  text: സേയീരിൽ താമസിക്കുന്ന ഏശാവിന്റെ മക്കൾക്കുവേണ്ടി അവൻ ചെയ്തതുപോലെതന്നെ—അവൻ അവരുടെ മുമ്പിൽനിന്ന്[a] ഹോര്യരെ നശിപ്പിച്ചു; അവർ അവരെ അവകാശഭ്രഷ്ടരാക്കി[b] അവരുടെ സ്ഥാനത്ത് ഇന്നുവരെ താമസിച്ചുവരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവരുടെ മുമ്പിൽനിന്ന്’ എന്നത്, ഹോര്യരെ അവരുടെ സാന്നിധ്യത്തിൽനിന്നോ പ്രദേശത്തുനിന്നോ നീക്കിയെന്ന അർഥമുള്ള എബ്രായ പ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘അവരെ ഒഴിപ്പിച്ചു’ അല്ലെങ്കിൽ ‘അവരെ കീഴടക്കി’; ഏശാവിന്റെ സന്തതികൾ ഹോര്യരെ നീക്കി അവരുടെ വാസസ്ഥലം കൈവശപ്പെടുത്തിയെന്നതാണ് ആശയം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: അവൻ ചെയ്തതുപോലെതന്നെ
  rationale: മുൻവാക്യത്തിലെ ദൈവിക പ്രവർത്തനത്തോടുള്ള താരതമ്യം നിലനിർത്തുന്നു; עָשָׂה എന്ന പൊതുവായ ക്രിയയെ അനാവശ്യമായി വിശദീകരിക്കുന്നില്ല.
- source_word: לִבְנֵי עֵשָׂו
  choice: ഏശാവിന്റെ മക്കൾക്കുവേണ്ടി
  rationale: കുടുംബ-വംശീയ പ്രയോഗം നിലനിർത്തിക്കൊണ്ട്, സന്ദർഭത്തിൽ ഇവർ ഏശാവിന്റെ സന്തതികളാണെന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הַיֹּשְׁבִים בְּשֵׂעִיר
  choice: സേയീരിൽ താമസിക്കുന്ന
  rationale: തുടർച്ചയായ വാസത്തെ സൂചിപ്പിക്കുന്ന പങ്കുപദപ്രയോഗം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: הִשְׁמִיד אֶת־הַחֹרִי
  choice: ഹോര്യരെ നശിപ്പിച്ചു
  rationale: ഹിഫ്ഇൽ രൂപത്തിന്റെ ശക്തമായ നശീകരണാർഥം നിലനിർത്തുന്നു; ജനവിഭാഗത്തിന്റെ പേര് പതിവായ ലിപ്യന്തരണത്തിൽ നൽകുന്നു.
- source_word: מִפְּנֵיהֶם
  choice: അവരുടെ മുമ്പിൽനിന്ന്
  rationale: എബ്രായ സ്ഥലസംബന്ധിയായ പ്രയോഗത്തിന്റെ രൂപം നിലനിർത്തുന്നു; സാന്നിധ്യത്തിൽനിന്നോ പ്രദേശത്തുനിന്നോ നീക്കിയെന്ന ആശയം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיִּירָשֻׁם
  choice: അവർ ഹോര്യരെ അവിടത്തുനിന്ന് ഒഴിപ്പിച്ച്
  rationale: ירשׁ എന്ന ക്രിയയുടെ കീഴടക്കൽസന്ദർഭത്തിലെ അർഥമായ മുൻവാസികളെ അവകാശത്തിൽനിന്ന് നീക്കുക എന്നത് സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ഭൂമി എന്ന പദം മൂലത്തിൽ ഇല്ലാത്തതിനാൽ പ്രധാനവാചകത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: וַיֵּשְׁבוּ תַחְתָּם
  choice: അവരുടെ സ്ഥാനത്ത് ... പാർത്തുവരുന്നു
  rationale: മുൻവാസികളുടെ സ്ഥാനത്ത് സ്ഥിരവാസമുറപ്പിച്ചതിനെ വ്യക്തമാക്കുന്നു; ഇന്നുവരെ തുടരുന്ന അവസ്ഥയുമായി മലയാളക്രിയ സ്വാഭാവികമായി ചേരുന്നു.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ഇന്നുവരെ
  rationale: എബ്രായ കാലപ്രയോഗത്തിന്റെ സാധാരണവും സംക്ഷിപ്തവുമായ മലയാളരൂപം.
theological_decisions:
- issue: עָשָׂה, הִשְׁמִיד എന്നീ ഏകവചന ക്രിയകളുടെ കർത്താവ്
  choice: സന്ദർഭത്തിൽ കർത്താവായ ദൈവത്തെ സൂചിപ്പിക്കുന്ന ‘അവൻ’
  alternative: കർത്താവിനെ പേരെടുത്തുപറയാതെ, മുൻസന്ദർഭത്തിൽനിന്ന് മനസ്സിലാക്കേണ്ട പരോക്ഷ കർത്താവ്
  rationale: എബ്രായത്തിൽ മൂന്നാംപുരുഷ ഏകവചനമാണ്; സമീപസന്ദർഭത്തിൽ അത് യഹോവയുടെ പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു. ‘അവൻ’ എന്ന് നൽകുന്നത് ആ സന്ദർഭബന്ധം നിലനിർത്തുന്നു, എന്നാൽ ഈ വാക്യത്തിൽ ഇല്ലാത്ത ദൈവനാമം ചേർക്കുന്നില്ല.
- issue: വിനാശത്തിന്റെ പ്രവർത്തകനും ഒഴിപ്പിക്കലിന്റെ പ്രവർത്തകരും
  choice: ദൈവം ഹോര്യരെ നശിപ്പിച്ചു; ഏശാവിന്റെ മക്കൾ അവരെ ഒഴിപ്പിച്ചു താമസമാക്കി
  alternative: എല്ലാ ക്രിയകൾക്കും ഒരേ കർത്താവാണെന്ന വായന
  rationale: הִשְׁמִיד ഏകവചനവും וַיִּירָשֻׁם, וַיֵּשְׁבוּ ബഹുവചനവുമാകയാൽ കർത്താവിലെ മാറ്റം മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. താരതമ്യവാക്യം മുൻസന്ദർഭവുമായി ബന്ധപ്പെടുന്നതിനാൽ തുടക്കത്തിലെ അപൂർണവാക്യസ്വഭാവം നിലനിർത്തി. ‘താമസിക്കുന്ന’ എന്ന ആധുനിക പ്രയോഗവും, അവസാനത്തിൽ തുടർച്ച സൂചിപ്പിക്കുന്ന ‘പാർത്തുവരുന്നു’ എന്ന രൂപവും ഉപയോഗിച്ചു.
