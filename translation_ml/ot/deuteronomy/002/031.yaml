  to: 'യഹ്‌വെ എന്നോടു പറഞ്ഞു: “നോക്കുക, സീഹോനെയും അവന്റെ ദേശത്തെയും നിന്റെ കൈയിൽ ഏൽപ്പിച്ചുതുടങ്ങിയിരിക്കുന്നു.[a] അവന്റെ ദേശം കൈവശമാക്കാൻ തുടങ്ങുക.[b]”'
