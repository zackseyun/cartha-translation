id: DEU.2.31
reference: Deuteronomy 2:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י רְאֵ֗ה הַֽחִלֹּ֨תִי֙ תֵּ֣ת לְ/פָנֶ֔י/ךָ אֶת סִיחֹ֖ן וְ/אֶת אַרְצ֑/וֹ הָחֵ֣ל רָ֔שׁ לָ/רֶ֖שֶׁת אֶת אַרְצֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/031.yaml
  text: And Yahweh said to me[a], “See, I have begun to give Sihon and his land over to you[b]. Begin to take possession of his land.”
translation:
  language: ml
  text: 'യഹ്‌വെ എന്നോടു പറഞ്ഞു: “നോക്കുക, സീഹോനെയും അവന്റെ ദേശത്തെയും നിന്റെ കൈയിൽ ഏൽപ്പിച്ചുതുടങ്ങിയിരിക്കുന്നു.[a] അവന്റെ ദേശം കൈവശമാക്കാൻ തുടങ്ങുക.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “നിന്റെ മുമ്പിൽ.” ഇവിടെ സീഹോനെയും അവന്റെ ദേശത്തെയും നിന്റെ അധികാരത്തിൽ ഏൽപ്പിക്കുന്നതാണ് അർഥം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, “കൈവശപ്പെടുത്താൻ തുടങ്ങുക; അവന്റെ ദേശം കൈവശമാക്കാൻ.” ഊന്നലിനായി എബ്രായപാഠത്തിൽ ഒരേ ക്രിയാധാതു ആവർത്തിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേര് ഉപയോഗിച്ച് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: רְאֵה
  choice: നോക്കുക
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ആജ്ഞയുടെ നേരിട്ടുള്ള ബലം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַחִלֹּתִי תֵּת
  choice: ഏൽപ്പിക്കാൻ ഞാൻ തുടങ്ങിക്കഴിഞ്ഞു
  rationale: ‘തുടങ്ങുക’ എന്ന ക്രിയയും പൂർത്തരൂപം സൂചിപ്പിക്കുന്ന, ഇപ്പോൾ ആരംഭിച്ചുകഴിഞ്ഞ പ്രവർത്തനവും നിലനിർത്തുന്നു; സൈനികസന്ദർഭത്തിൽ נתן സൂചിപ്പിക്കുന്ന അധികാരകൈമാറ്റം ‘ഏൽപ്പിക്കുക’ വ്യക്തമാക്കുന്നു.
- source_word: לְפָנֶיךָ
  choice: നിന്റെ അധീനതയിൽ
  rationale: അക്ഷരാർഥമായ ‘നിന്റെ മുമ്പിൽ’ എന്നതിനു പകരം, സീഹോനെയും ദേശത്തെയും ഇസ്രായേലിന്റെ അധികാരത്തിലാക്കുന്നു എന്ന സന്ദർഭാർഥം നൽകുന്നു.
- source_word: הָחֵל רָשׁ
  choice: കൈവശമാക്കാൻ തുടങ്ങുക
  rationale: ദൈവം ‘തുടങ്ങിക്കഴിഞ്ഞു’ എന്ന ആദ്യപ്രയോഗത്തോട് മനുഷ്യന്റെ പ്രതികരണമായ ‘തുടങ്ങുക’ എന്ന സമാന്തരതയും ירש എന്ന ക്രിയയുടെ ഭൂമി കൈവശപ്പെടുത്തുന്ന അർഥവും സംരക്ഷിക്കുന്നു.
- source_word: לָרֶשֶׁת אֶת־אַרְצוֹ
  choice: അവന്റെ ദേശം കൈവശമാക്കാൻ
  rationale: ഒരേ ധാതുവിന്റെ ആവർത്തനം മലയാളത്തിൽ അതേപടി നൽകിയാൽ അസ്വാഭാവികമാകുന്നതിനാൽ മുഖ്യാർഥം സ്വാഭാവികമായി നൽകി, ആവർത്തനം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ ഒരു സ്ഥാനപ്പേരല്ല, ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉള്ളത്; അതിനാൽ ആ പേര് മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- issue: ദൈവിക പ്രവർത്തനവും ഇസ്രായേലിന്റെ പ്രവർത്തനവും തമ്മിലുള്ള ബന്ധം
  choice: ‘ഞാൻ തുടങ്ങിക്കഴിഞ്ഞു’ / ‘തുടങ്ങുക’ എന്ന സമാന്തരത നിലനിർത്തി
  alternative: ദൈവത്തിന്റെ പ്രവൃത്തി മാത്രം അല്ലെങ്കിൽ മനുഷ്യന്റെ പ്രവൃത്തി മാത്രം മുൻനിർത്തുന്ന സ്വതന്ത്ര പുനർവ്യാഖ്യാനം
  rationale: ദൈവം ഏൽപ്പിക്കാൻ ആരംഭിച്ചതും ഇസ്രായേൽ കൈവശമാക്കാൻ ആരംഭിക്കേണ്ടതും എന്ന മൂലപാഠത്തിലെ ഉദ്ദേശപൂർവമായ സംഘർഷവും സമാന്തരതയും പരിഹരിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അപ്പോൾ’ ആഖ്യാനബന്ധം പ്രകടമാക്കുന്നു. ദൈവനാമം ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ പ്രസക്തമായ വാക്യഘടകങ്ങൾക്ക് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
