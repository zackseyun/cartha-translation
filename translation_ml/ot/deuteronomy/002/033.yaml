id: DEU.2.33
reference: Deuteronomy 2:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יִּתְּנֵ֛/הוּ יְהוָ֥ה אֱלֹהֵ֖י/נוּ לְ/פָנֵ֑י/נוּ וַ/נַּ֥ךְ אֹת֛/וֹ וְ/אֶת בנ/ו וְ/אֶת כָּל עַמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/033.yaml
  text: And Yahweh our God gave him over to us[a], and we struck him down[b], along with his sons and all his people.
translation:
  language: ml
  text: നമ്മുടെ ദൈവമായ യാഹ്‌വേ അവനെ നമ്മുടെ കൈയിൽ ഏല്പിച്ചു[a]; നാം അവനെയും അവന്റെ പുത്രന്മാരെയും[b] അവന്റെ സകല ജനത്തെയും അടിച്ചുവീഴ്ത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘നമ്മുടെ മുമ്പിൽ തന്നു’; ഇവിടെ അവനെ ഇസ്രായേലിന്റെ അധികാരത്തിൽ ഏല്പിച്ചു എന്നാണ് അർഥം.'
    reason: lexical_alternative
  - marker: b
    text: എബ്രായ വ്യഞ്ജനപാഠം ‘അവന്റെ മകൻ’ എന്നു വായിക്കാം; പരമ്പരാഗത വായനയിൽ ‘അവന്റെ പുത്രന്മാർ’ എന്നാണ്, സന്ദർഭത്തിൽ അതാണ് സ്വീകരിച്ചിരിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְּנֵהוּ ... לְפָנֵינוּ
  choice: അവനെ നമ്മുടെ കൈയിൽ ഏല്പിച്ചു
  rationale: അക്ഷരാർഥത്തിൽ ‘അവനെ നമ്മുടെ മുമ്പിൽ തന്നു’ എന്നാണെങ്കിലും, യുദ്ധസന്ദർഭത്തിൽ ശത്രുവിനെ ഇസ്രായേലിന്റെ അധികാരത്തിൽ ഏല്പിച്ചു എന്ന ആശയമാണ്; സ്വാഭാവിക മലയാളത്തിൽ ‘നമ്മുടെ കൈയിൽ ഏല്പിച്ചു’ അത് വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ‘യഹോവ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
- source_word: אֱלֹהֵינוּ
  choice: നമ്മുടെ ദൈവം
  rationale: ഒന്നാം പുരുഷ ബഹുവചന പ്രത്യയമുള്ള രൂപത്തിന്റെ നേരിട്ടുള്ള അർഥം സംരക്ഷിക്കുന്നു.
- source_word: וַנַּךְ
  choice: നാം ... സംഹരിച്ചു
  rationale: നכה എന്ന ക്രിയ യുദ്ധവിവരണത്തിൽ നിർണായകമായി അടിച്ചുവീഴ്ത്തുകയോ കൊല്ലുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; ഇവിടെ രാജാവിനോടൊപ്പം പുത്രന്മാരെയും ജനത്തെയും ഉൾക്കൊള്ളുന്നതിനാൽ ‘സംഹരിച്ചു’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: בנו
  choice: അവന്റെ പുത്രന്മാരെ
  rationale: വ്യഞ്ജനപാഠം ഏകവചനമായി വായിക്കാവുന്നതാണ്; എങ്കിലും മസോററ്റിക് വായനയും സന്ദർഭവും ബഹുവചനത്തെ പിന്തുണയ്ക്കുന്നു. വ്യത്യസ്ത വായന അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: כָּל עַמּוֹ
  choice: അവന്റെ സകല ജനത്തെയും
  rationale: עַם എന്നതിന്റെ നേരിട്ടുള്ള ‘ജനം’ എന്ന അർഥം നിലനിർത്തുന്നു; ‘സകല’ כָּל എന്ന സമഗ്രതയും പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വേ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം തന്നെയായതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ മലയാളസഭാ-ബൈബിൾ പ്രയോഗത്തിൽ വ്യാപകമായ ‘യഹോവ’ എന്ന രൂപം ഉപയോഗിച്ചു; ഇത് പ്രത്യേക വിഭാഗീയ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: ദൈവത്തിന്റെ പ്രവർത്തനവും ഇസ്രായേലിന്റെ യുദ്ധപ്രവർത്തനവും തമ്മിലുള്ള ബന്ധം
  choice: യഹോവ ഏല്പിച്ചു; നാം സംഹരിച്ചു
  alternative: യഹോവ അവനെ തോല്പിച്ചു
  rationale: 'മൂലത്തിലെ രണ്ടു വ്യത്യസ്ത കർത്താക്കളെയും പ്രവർത്തനങ്ങളെയും നിലനിർത്തി: ദൈവം ശത്രുവിനെ ഏല്പിക്കുന്നു, ഇസ്രായേൽ അവരെ സംഹരിക്കുന്നു. ഇതിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം മൃദൂകരിച്ചിട്ടില്ല.'
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള ആഖ്യാനശൈലി. ‘നമ്മുടെ കൈയിൽ ഏല്പിച്ചു’ സ്വാഭാവികമായ യുദ്ധസന്ദർഭപ്രയോഗമാണ്. ‘പുത്രന്മാർ’, ‘സകല’ എന്നിവ വാക്യത്തിന്റെ തിരുവെഴുത്തുസംബന്ധിയായ ഗൗരവം നിലനിർത്തുമ്പോഴും സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
