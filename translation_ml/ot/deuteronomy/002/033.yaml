  terminology: יְהוָהയ്ക്ക് ‘യാഹ്‌വേ’ ഉപയോഗിച്ചിരിക്കുന്നു; ഇത് മൂലത്തിലെ വ്യക്തിനാമവും POB audit trail-ഉം പ്രതിഫലിപ്പിക്കുന്നു. בנו-വിന്റെ കെതീവ്/പരമ്പരാഗത വായനാഭേദം അടിക്കുറിപ്പിൽ നിഷ്പക്ഷമായി സൂക്ഷിച്ചിരിക്കുന്നു.
  issues:
