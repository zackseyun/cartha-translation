revisions:
- from: എന്നാൽ ഹെശ്ബോൻ രാജാവായ സീഹോൻ തന്റെ ദേശത്തുകൂടി കടന്നുപോകാൻ ഞങ്ങളെ അനുവദിക്കാൻ തയ്യാറായില്ല. കാരണം, നിങ്ങളുടെ ദൈവമായ യഹോവ അവന്റെ മനോഭാവത്തെ കഠിനമാക്കുകയും അവന്റെ ഹൃദയത്തെ ദൃഢമാക്കുകയും ചെയ്തു[a]. അവനെ നിങ്ങളുടെ കൈയിൽ ഏൽപ്പിക്കേണ്ടതിനായിരുന്നു അത്—ഇന്നുള്ളതുപോലെതന്നെ.
  to: എന്നാൽ ഹെശ്ബോൻ രാജാവായ സീഹോൻ തന്റെ ദേശത്തുകൂടി കടന്നുപോകാൻ ഞങ്ങളെ അനുവദിക്കാൻ തയ്യാറായില്ല. കാരണം, നിങ്ങളുടെ ദൈവമായ യഹ്‌വേ അവന്റെ ആത്മാവിനെ കഠിനമാക്കുകയും അവന്റെ ഹൃദയത്തെ വഴങ്ങാത്തതാക്കുകയും ചെയ്തു[a]—അവനെ നിങ്ങളുടെ കൈയിൽ ഏൽപ്പിക്കേണ്ടതിനായി, ഇന്നത്തെപ്പോലെ.
  rationale: The revision preserves the source’s paired terms “spirit” and “heart,” the explicit divine agency and Sihon’s own unwillingness, and the territorial referent of בּוֹ. It also follows the project’s Yahweh convention, expresses the purpose clause directly, and uses a contextual main-text rendering for the heart’s obstinacy while retaining the lexical ‘strengthen/make firm’ alternative in the anchored footnote.
