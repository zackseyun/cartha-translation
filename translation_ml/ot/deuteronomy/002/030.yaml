source:
  edition: WLC
  text: וְ/לֹ֣א אָבָ֗ה סִיחֹן֙ מֶ֣לֶךְ חֶשְׁבּ֔וֹן הַעֲבִרֵ֖/נוּ בּ֑/וֹ כִּֽי הִקְשָׁה֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ אֶת רוּח֗/וֹ וְ/אִמֵּץ֙ אֶת לְבָב֔/וֹ לְמַ֛עַן תִּתּ֥/וֹ בְ/יָדְ/ךָ֖ כַּ/יּ֥וֹם הַ/זֶּֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/030.yaml
  text: But Sihon king of Heshbon was not willing to let us pass through his land[a], because Yahweh your God had hardened his spirit and made his heart stubborn, in order to give him into your hand, as it is this day.
translation:
  language: ml
  text: എന്നാൽ ഹെശ്ബോൻ രാജാവായ സീഹോൻ തന്റെ ദേശത്തുകൂടി കടന്നുപോകാൻ ഞങ്ങളെ അനുവദിക്കാൻ തയ്യാറായില്ല. കാരണം, നിങ്ങളുടെ ദൈവമായ യഹ്‌വേ അവന്റെ ആത്മാവിനെ കഠിനമാക്കുകയും അവന്റെ ഹൃദയത്തെ വഴങ്ങാത്തതാക്കുകയും ചെയ്തു[a]—അവനെ നിങ്ങളുടെ കൈയിൽ ഏൽപ്പിക്കേണ്ടതിനായി, ഇന്നത്തെപ്പോലെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവന്റെ ഹൃദയത്തെ ദൃഢമാക്കുകയും” അല്ലെങ്കിൽ “ശക്തമാക്കുകയും ചെയ്തു.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായക്രിയയ്ക്ക് “ശക്തമാക്കുക, ദൃഢമാക്കുക” എന്നർഥമുണ്ട്; ഈ സന്ദർഭത്തിൽ അത് വഴങ്ങാത്തതോ ശാഠ്യമുള്ളതോ ആക്കുക എന്ന ആശയമാണ് നൽകുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבָה
  choice: അനുവദിക്കാൻ തയ്യാറായില്ല
  rationale: സമ്മതിക്കാനോ മനസ്സാകാനോ ഉള്ള സന്നദ്ധതയില്ലായ്മയാണ് ക്രിയ സൂചിപ്പിക്കുന്നത്; വെറും ബാഹ്യമായ നിരസനത്തേക്കാൾ ആന്തരിക ഇച്ഛാഭാവം നിലനിർത്തുന്നു.
- source_word: הַעֲבִרֵנוּ בּוֹ
  choice: തന്റെ ദേശത്തുകൂടി കടന്നുപോകാൻ ഞങ്ങളെ അനുവദിക്കാൻ
  rationale: עבר എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം കടന്നുപോകാൻ ഇടയാക്കുക/അനുവദിക്കുക എന്നർഥം നൽകുന്നു; בּוֹ സന്ദർഭത്തിൽ സീഹോന്റെ വ്യക്തിയെയല്ല, അവന്റെ അധീനപ്രദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: הִקְשָׁה ... אֶת רוּחוֹ
  choice: അവന്റെ മനോഭാവത്തെ കഠിനമാക്കുകയും
  rationale: רוּחַ എന്നതിന്റെ അടിസ്ഥാന ആശയം നിലനിർത്തിക്കൊണ്ട്, ഇവിടെ വ്യക്തിയുടെ ആന്തരിക പ്രവണതയെയോ നിലപാടിനെയോ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളമായി ‘മനോഭാവം’ തിരഞ്ഞെടുത്തു; הִקְשָׁהയുടെ കാരണാർഥം ‘കഠിനമാക്കുക’ എന്നു നേരിട്ട് നൽകി.
- source_word: וְאִמֵּץ אֶת לְבָבוֹ
  choice: അവന്റെ ഹൃദയത്തെ ദൃഢമാക്കുകയും ചെയ്തു
  rationale: אמץ എന്ന ക്രിയയുടെ പ്രാഥമികമായ ശക്തമാക്കുക/ദൃഢമാക്കുക എന്ന അർഥം നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ ഇത് വഴങ്ങാത്ത നിലയിലേക്ക് നയിക്കുന്നുവെങ്കിലും ‘ശാഠ്യമുള്ളതാക്കി’ എന്ന വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ നിർബന്ധിക്കാതെ പാദക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: לְמַעַן
  choice: ഏൽപ്പിക്കേണ്ടതിനായിരുന്നു അത്
  rationale: ദൈവിക പ്രവർത്തിയുടെ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്ന ലളിതവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗം.
- source_word: תִּתּוֹ בְיָדְךָ
  choice: അവനെ നിങ്ങളുടെ കൈയിൽ ഏൽപ്പിക്കുക
  rationale: נתן ביד എന്ന പ്രയോഗം ഒരാളെ മറ്റൊരാളുടെ അധികാരത്തിൽ ഏൽപ്പിക്കുക എന്ന ആശയം നൽകുന്നു; ‘കൈയിൽ’ എന്ന എബ്രായ ദൃശ്യപ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: כַּיּוֹם הַזֶּה
  choice: ഇന്നുള്ളതുപോലെതന്നെ
  rationale: സംസാരിക്കുന്ന കാലത്ത് തെളിഞ്ഞുനിൽക്കുന്ന അവസ്ഥയെ ചൂണ്ടിക്കാണിക്കുന്ന ആവർത്തനപുസ്തകത്തിലെ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റണിനെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: ദൈവം കഠിനമാക്കിയതും സീഹോൻ തയ്യാറാകാതിരുന്നതും
  choice: സീഹോന്റെ സന്നദ്ധതയില്ലായ്മയും യഹോവ അവന്റെ മനോഭാവത്തെയും ഹൃദയത്തെയും ദൃഢമാക്കിയതും ഒരുപോലെ പ്രസ്താവിച്ചു.
  alternative: ദൈവം അതിനെ വെറും അനുവദിച്ചു എന്നോ സീഹോൻ മാത്രം സ്വയം കഠിനനായി എന്നോ വ്യാഖ്യാനിക്കുക.
  rationale: എബ്രായവാചകം മനുഷ്യന്റെ ഇച്ഛാഭാവത്തെയും ദൈവത്തിന്റെ പ്രവർത്തനത്തെയും നേരിട്ട് പറയുന്നു; അവയ്ക്കിടയിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം പരിഹരിക്കാതെ നിലനിർത്തണം.
- issue: וְאִמֵּץ എന്ന ക്രിയയുടെ മൂലാർഥവും സന്ദർഭാർഥവും
  choice: മുഖ്യവാചകത്തിൽ ‘ഹൃദയത്തെ ദൃഢമാക്കി’; പാദക്കുറിപ്പിൽ ‘വഴങ്ങാത്തതാക്കി’ എന്ന സന്ദർഭാർഥം.
  alternative: മുഖ്യവാചകത്തിൽ തന്നെ ‘ഹൃദയത്തെ ശാഠ്യമുള്ളതാക്കി’ എന്നു നൽകുക.
  rationale: ക്രിയയുടെ ‘ശക്തമാക്കുക/ദൃഢമാക്കുക’ എന്ന യഥാർഥ ശാബ്ദിക അർഥം സംരക്ഷിക്കുകയും, ഈ സന്ദർഭത്തിലെ പ്രതികൂലമായ വഴങ്ങാത്ത ഭാവം വായനക്കാരന് പാദക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള മലയാളം. ‘മനോഭാവം’, ‘ഹൃദയം’, ‘കൈയിൽ ഏൽപ്പിക്കുക’ എന്നീ പദങ്ങളിലൂടെ എബ്രായത്തിലെ മാനവശാസ്ത്രപരവും രൂപകാത്മകവുമായ ഭാഷ പരമാവധി നിലനിർത്തി.
