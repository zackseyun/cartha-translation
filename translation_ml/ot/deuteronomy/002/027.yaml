  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֶעְבְּרָ֣ה בְ/אַרְצֶ֔/ךָ בַּ/דֶּ֥רֶךְ בַּ/דֶּ֖רֶךְ אֵלֵ֑ךְ לֹ֥א אָס֖וּר יָמִ֥ין וּ/שְׂמֹֽאול׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/027.yaml
  text: Let me pass through your land; I will go only by the road[a]. I will not turn aside to the right or to the left.
translation:
  language: ml
  text: “അങ്ങയുടെ ദേശത്തുകൂടി കടന്നുപോകാൻ എന്നെ അനുവദിക്കണമേ. ഞാൻ വഴിയിലൂടെ മാത്രം[a] പോകും; വലത്തോട്ടോ ഇടത്തോട്ടോ തിരിയുകയില്ല.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “വഴിയിലൂടെ, വഴിയിലൂടെ.” ഇസ്രായേൽ നിശ്ചിത വഴിയിൽനിന്നു മാറാതെ സഞ്ചരിക്കുമെന്ന ഊന്നലാണ് ഈ ആവർത്തനം നൽകുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעְבְּרָה
  choice: കടന്നുപോകാൻ എന്നെ അനുവദിക്കണമേ
  rationale: ഒന്നാംപുരുഷ ഏകവചന കോഹോർട്ടേറ്റീവ് രൂപം ഈ നയതന്ത്രപരമായ സന്ദർഭത്തിൽ വിനീതമായ അഭ്യർഥന പ്രകടിപ്പിക്കുന്നു; വെറും ഭാവികാലത്തേക്കാൾ ഈ പ്രയോഗം അതു സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְאַרְצֶךָ
  choice: അങ്ങയുടെ ദേശത്തുകൂടി
  rationale: עבר എന്ന ക്രിയയോടു ചേർന്ന ב ഇവിടെ ഒരു പ്രദേശത്തിലൂടെയുള്ള കടന്നുപോക്കിനെ സൂചിപ്പിക്കുന്നു. ആദരസൂചകമായ ‘അങ്ങയുടെ’ രാജാവിനോടുള്ള അഭിസംബോധനയ്ക്കു യോജിക്കുന്നു.
- source_word: בַּדֶּרֶךְ בַּדֶּרֶךְ
  choice: വഴിയിലൂടെ മാത്രം
  rationale: ‘വഴിയിൽ, വഴിയിൽ’ എന്ന ആവർത്തനം നിശ്ചിത വഴിയിൽനിന്നു മാറാതെ കർശനമായി സഞ്ചരിക്കുമെന്ന ഊന്നൽ നൽകുന്നു. മലയാളത്തിൽ ‘മാത്രം’ ആ ഊന്നൽ സ്വാഭാവികമായി പകരുന്നു; അക്ഷരാർഥ ആവർത്തനം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: אֵלֵךְ
  choice: പോകും
  rationale: הלך യാത്രാസന്ദർഭത്തിൽ സാധാരണയായി ‘പോകുക’ എന്നാണ്; ലളിതവും സ്വാഭാവികവുമായ തത്തുല്യം ഇതാണ്.
- source_word: לֹא אָסוּר
  choice: തിരിയുകയില്ല
  rationale: סור വഴിയിൽനിന്നു മാറുകയോ തിരിയുകയോ ചെയ്യുക എന്നർഥം നൽകുന്നു. തുടർന്നുള്ള വലത്-ഇടത് ദിശാപ്രയോഗത്തോടു ‘തിരിയുക’ സ്വാഭാവികമായി ചേരുന്നു.
- source_word: יָמִין וּשְׂמֹאול
  choice: വലത്തോട്ടോ ഇടത്തോട്ടോ
  rationale: ഇരുവശത്തേക്കും വഴിമാറില്ലെന്ന സ്ഥിരമായ ദിശാപ്രയോഗം മലയാളത്തിൽ വ്യക്തമായും സ്വാഭാവികമായും പകരുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ അഭ്യർഥനാശൈലി ഉപയോഗിച്ചു. രാജാവിനോടുള്ള നയതന്ത്രപരമായ അഭിസംബോധന സൂചിപ്പിക്കാൻ ‘അങ്ങയുടെ’ എന്നും വിനീതമായ കോഹോർട്ടേറ്റീവ് ഭാവം നൽകാൻ ‘അനുവദിക്കണമേ’ എന്നും തിരഞ്ഞെടുത്തു. ഹീബ്രു ആവർത്തനത്തിന്റെ ഊന്നൽ മുഖ്യവാക്യത്തിൽ ‘മാത്രം’ കൊണ്ടും അക്ഷരരൂപം അടിക്കുറിപ്പിലൂടെയും സംരക്ഷിച്ചു.
