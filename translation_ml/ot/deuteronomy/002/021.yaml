source:
  edition: WLC
  text: עַ֣ם גָּד֥וֹל וְ/רַ֛ב וָ/רָ֖ם כָּ/עֲנָקִ֑ים וַ/יַּשְׁמִידֵ֤/ם יְהוָה֙ מִ/פְּנֵי/הֶ֔ם וַ/יִּירָשֻׁ֖/ם וַ/יֵּשְׁב֥וּ תַחְתָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/021.yaml
  text: a people great[a], numerous, and tall like the Anakim. Yahweh destroyed them from before them, and they dispossessed them and lived in their place.
translation:
  language: ml
  text: അനാക്യരെപ്പോലെ വലിയതും ജനബഹുലവും ഉയരം കൂടിയതുമായ ഒരു ജനത. യഹ്‌വെ അവരെ ഏശാവിന്റെ സന്തതികളുടെ മുമ്പിൽനിന്ന് നശിപ്പിച്ചു; ഏശാവിന്റെ സന്തതികൾ അവരെ സ്ഥാനഭ്രഷ്ടരാക്കി അവരുടെ സ്ഥാനത്ത് താമസിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַם גָּדוֹל וְרַב וָרָם
  choice: വലിയതും ജനബഹുലവും ഉയരം കൂടിയതുമായ ഒരു ജനത
  rationale: എബ്രായയിലെ ഏകവചന സമൂഹനാമവും വലുപ്പം, ജനസംഖ്യ, ശരീരത്തിന്റെ ഉയരം എന്നീ മൂന്നു വ്യത്യസ്ത വിശേഷണങ്ങളും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: כָּעֲנָקִים
  choice: അനാക്യരെപ്പോലെ
  rationale: כְּ എന്ന ഉപസർഗത്തിന്റെ ഉപമാഭാവം നിലനിർത്തുകയും ജനനാമം മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: וַיַּשְׁמִידֵם
  choice: അവരെ ... നശിപ്പിച്ചു
  rationale: ശמד എന്ന ക്രിയയുടെ ശക്തമായ നാശാർഥം സൂക്ഷിക്കുന്നു; സന്ദർഭം ആവശ്യപ്പെടുന്നതിലധികം സമ്പൂർണ ഉന്മൂലനം വ്യക്തമാക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരിയെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: מִפְּנֵיהֶם
  choice: ഏശാവിന്റെ സന്തതികളുടെ മുമ്പിൽനിന്ന്
  rationale: എബ്രായ സർവനാമത്തിന്റെ സൂചന മുൻസന്ദർഭത്തിൽനിന്ന് വ്യക്തമാക്കി, 'മുമ്പിൽനിന്ന്' എന്ന ദൃശ്യരൂപകം നിലനിർത്തുന്നു.
- source_word: וַיִּירָשֻׁם
  choice: അവർ ആ ജനത്തെ കൈവശം നീക്കി
  rationale: ירשׁ എന്ന ക്രിയയുടെ മുൻവാസികളെ നീക്കി അവരുടെ അധിവാസം സ്വന്തമാക്കുന്ന സന്ദർഭാർഥം നൽകുന്നു; മലയാളത്തിൽ ആളുകളെ നേരിട്ട് 'അവകാശമാക്കി' എന്നു പറയുന്ന അസ്വാഭാവികത ഒഴിവാക്കുന്നു.
- source_word: וַיֵּשְׁבוּ תַחְתָּם
  choice: അവരുടെ സ്ഥാനത്ത് താമസിച്ചു
  rationale: മുൻജനതയെ പകരംവെച്ചുള്ള അധിവാസം വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു പദവികൊണ്ട് പകരംവയ്ക്കാതെ സാധാരണ പണ്ഡിതലിപ്യന്തരത്തോട് ചേർന്ന മലയാളരൂപത്തിൽ സൂക്ഷിക്കുന്നു.
- issue: മൂന്നാംപുരുഷ ബഹുവചന സർവനാമങ്ങളുടെ സൂചന
  choice: ആദ്യത്തെ 'അവർ' എന്ന സൂചനയെ 'ഏശാവിന്റെ സന്തതികൾ' എന്നു വ്യക്തമാക്കി
  alternative: എല്ലായിടത്തും 'അവർ/അവരെ' എന്നു മാത്രം നിലനിർത്തുക
  rationale: എബ്രായത്തിൽ ഒരേ വാക്യത്തിനുള്ളിൽ രണ്ടു ജനവിഭാഗങ്ങളെ ബഹുവചന സർവനാമങ്ങൾ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു; മുൻസന്ദർഭം നൽകുന്ന തിരിച്ചറിയലാണ് ഉപയോഗിച്ചത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. മൂലത്തിലെ മൂന്നു വിശേഷണങ്ങളും പ്രവർത്തനക്രമവും നിലനിർത്തി; സർവനാമക്കുഴപ്പം മാത്രം സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കി.
