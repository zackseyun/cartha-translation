id: DEU.2.6
reference: Deuteronomy 2:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֹ֣כֶל תִּשְׁבְּר֧וּ מֵֽ/אִתָּ֛/ם בַּ/כֶּ֖סֶף וַ/אֲכַלְתֶּ֑ם וְ/גַם מַ֜יִם תִּכְר֧וּ מֵ/אִתָּ֛/ם בַּ/כֶּ֖סֶף וּ/שְׁתִיתֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/006.yaml
  text: You shall buy food from them with silver[a], so that you may eat; and you shall also buy water from them with silver, so that you may drink.
translation:
  language: ml
  text: ഭക്ഷിക്കാനായി അവരിൽനിന്ന് വെള്ളി കൊടുത്ത് ആഹാരം വാങ്ങണം; കുടിക്കാനായി അവരിൽനിന്ന് വെള്ളി കൊടുത്ത് വെള്ളവും വാങ്ങണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹכֶל
  choice: ആഹാരം
  rationale: ഭക്ഷിക്കാവുന്ന വിഭവങ്ങളെ പൊതുവായി സൂചിപ്പിക്കുന്ന പദമാണ്; ഈ സന്ദർഭത്തിൽ ധാന്യമായി മാത്രം പരിമിതപ്പെടുത്തേണ്ടതില്ല.
- source_word: תִּשְׁבְּרוּ
  choice: വാങ്ങണം
  rationale: שׁבר ഇവിടെ വിലകൊടുത്ത് ആഹാരം സ്വന്തമാക്കുക എന്ന വാണിജ്യാർഥത്തിലാണ്.
- source_word: מֵאִתָּם
  choice: അവരിൽനിന്ന്
  rationale: 'സ്രോതസ്സ് വ്യക്തമാക്കുന്നു: ആഹാരവും വെള്ളവും അവരിൽനിന്നാണ് വാങ്ങേണ്ടത്.'
- source_word: בַּכֶּסֶף
  choice: വെള്ളി കൊടുത്ത്
  rationale: പണമെന്ന പൊതുവായ വ്യാഖ്യാനത്തിനു പകരം എബ്രായത്തിലെ മൂർത്തമായ 'വെള്ളി' എന്ന പ്രയോഗം നിലനിർത്തുന്നു; 'കൊടുത്ത്' വിലയായി ഉപയോഗിക്കുന്നതിനെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַאֲכַלְתֶּם
  choice: ഭക്ഷിക്കാൻ വേണ്ട
  rationale: നിർദേശാത്മക സന്ദർഭത്തിലെ ക്രമബന്ധം ഉദ്ദേശിച്ച ഫലം/ലക്ഷ്യം സൂചിപ്പിക്കുന്നതായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ഔപചാരികമായി 'ഭക്ഷിക്കുകയും വേണം' എന്നും പരിഭാഷപ്പെടുത്താം.
- source_word: וְגַם
  choice: വെള്ളവും
  rationale: രണ്ടാമത്തെ സമാന്തര നിർദേശം കൂട്ടിച്ചേർക്കുന്ന 'കൂടാതെ/അതുപോലെ' എന്ന ശക്തി മലയാളത്തിലെ '-വും' സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: מַיִם
  choice: വെള്ളം
  rationale: നേരിട്ടുള്ള സമാനപദം.
- source_word: תִּכְרוּ
  choice: വാങ്ങണം
  rationale: כרהയ്ക്ക് മറ്റിടങ്ങളിൽ 'കുഴിക്കുക' എന്ന അർഥമുണ്ടെങ്കിലും, 'അവരിൽനിന്ന്', 'വെള്ളി കൊടുത്ത്' എന്നീ വാക്കുകളും ആഹാരം വാങ്ങുന്നതിനോടുള്ള സമാന്തരതയും ഇവിടെ വിലകൊടുത്തു സ്വന്തമാക്കുക എന്ന അർഥം ഉറപ്പിക്കുന്നു.
- source_word: וּשְׁתִיתֶם
  choice: കുടിക്കാൻ വേണ്ട
  rationale: ആഹാരത്തെക്കുറിച്ചുള്ള ആദ്യ നിർദേശത്തിന് സമാന്തരമായി, വാങ്ങുന്നതിന്റെ ഉദ്ദേശിച്ച ഫലം/ലക്ഷ്യം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; ഔപചാരികമായി 'കുടിക്കുകയും വേണം' എന്നും പരിഭാഷപ്പെടുത്താം.
theological_decisions:
- issue: ഏദോമ്യരുടെ ആഹാരവും വെള്ളവും കൈക്കലാക്കാതെ വിലകൊടുത്തു വാങ്ങണമെന്ന കല്പനയുടെ ധാർമിക-നിയമപരമായ ശക്തി
  choice: ആഹാരത്തിനും വെള്ളത്തിനും വെള്ളി നൽകി നിയമാനുസൃതമായി വാങ്ങണമെന്ന് വ്യക്തമായി പരിഭാഷപ്പെടുത്തി.
  alternative: എബ്രായ ക്രമബന്ധം കൂടുതൽ ഔപചാരികമായി പിന്തുടർന്ന്, 'വാങ്ങണം; ഭക്ഷിക്കുകയും വേണം ... വാങ്ങണം; കുടിക്കുകയും വേണം' എന്നു നൽകാം.
  rationale: സന്ദർഭം വിഭവങ്ങൾ പ്രതിഫലമില്ലാതെ എടുക്കുന്നതിനു പകരം വിലകൊടുത്തു വാങ്ങാൻ ഇസ്രായേലിനോട് കല്പിക്കുന്നു. അവസാന ക്രിയകളെ ലക്ഷ്യം/ഉദ്ദേശിച്ച ഫലം എന്ന നിലയിൽ അവതരിപ്പിക്കുന്നത് ഉള്ളടക്കം ചേർക്കാതെ ഈ പ്രായോഗിക ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കല്പനാശൈലി ഉപയോഗിച്ചു. 'വെള്ളി' എന്ന മൂർത്തമായ എബ്രായ പ്രയോഗം സംരക്ഷിച്ചു. വാക്യത്തിലെ സമാന്തരഘടന നിലനിർത്തിക്കൊണ്ട് അനാവശ്യമായ പദാവർത്തനം കുറച്ചു.
