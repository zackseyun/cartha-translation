  yaml_path: translation/ot/deuteronomy/002/001.yaml
  text: Then we turned and set out for the wilderness by the way of the Red Sea[a], just as Yahweh had spoken to me, and we went around Mount Seir for many days.
translation:
  language: ml
  text: പിന്നെ ഞങ്ങൾ തിരിഞ്ഞ്, യാഹ്‌വെ എന്നോടു പറഞ്ഞതുപോലെ, ചെങ്കടൽവഴിയായി മരുഭൂമിയിലേക്കു പുറപ്പെട്ടു; അനേകം ദിവസങ്ങൾ ഞങ്ങൾ സേയീർ പർവതത്തെ ചുറ്റി സഞ്ചരിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഞാങ്ങണക്കടൽ” എന്നും പരിഭാഷപ്പെടുത്താം. യാം സൂഫ് എന്ന ഹീബ്രു പേരിന്റെ കൂടുതൽ പദാനുസൃതമായ അർഥമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֵּפֶן
  choice: പിന്നെ ഞങ്ങൾ തിരിഞ്ഞ്
  rationale: പנה എന്ന ക്രിയ ദിശമാറ്റുന്നതിനെ സൂചിപ്പിക്കുന്നു; കഥാക്രമം ‘പിന്നെ’ എന്നതിലൂടെ സ്വാഭാവികമായി നിലനിർത്തുന്നു, ‘മടങ്ങി’ എന്ന അധിക അർഥം ചേർക്കുന്നില്ല.
- source_word: וַנִּסַּע הַמִּדְבָּרָה
  choice: മരുഭൂമിയിലേക്കു പുറപ്പെട്ടു
  rationale: נסע പാളയം പിരിച്ച് യാത്ര പുറപ്പെടുന്ന ആശയം നൽകുന്നു; directional he ലക്ഷ്യദിശ സൂചിപ്പിക്കുന്നതിനാൽ ‘മരുഭൂമിയിലേക്ക്’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: דֶּרֶךְ יַם סוּף
  choice: ചെങ്കടലിലേക്കുള്ള വഴിയിലൂടെ
  rationale: דרך ഇവിടെ സഞ്ചാരപാതയെയും ים סוף പരമ്പരാഗത ഭൂമിശാസ്ത്രനാമമായ ‘ചെങ്കടൽ’ എന്നതിനെയും സൂചിപ്പിക്കുന്നു; കൂടുതൽ പദാനുസൃതമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה אֵלַי
  choice: യഹോവ എന്നോടു അരുളിച്ചെയ്തതുപോലെ
  rationale: כאשר താരതമ്യസൂചകമായ ‘...തുപോലെ’ എന്നും דבר אל ‘ഒരാളോടു സംസാരിക്കുക’ എന്നും എടുത്തു. ദൈവത്തിന്റെ വാക്കിന് യോജിച്ച dignified Malayalam ആയി ‘അരുളിച്ചെയ്തു’ ഉപയോഗിച്ചു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ഹീബ്രു ചതുരക്ഷര ദൈവനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַנָּסָב אֶת הַר שֵׂעִיר
  choice: ഞങ്ങൾ സേയീർപർവതത്തെ ചുറ്റി സഞ്ചരിച്ചു
  rationale: סבב ഇവിടെ ചുറ്റിപ്പോകുക എന്ന ആശയമാണ് നൽകുന്നത്; തുടർച്ചയായ ഒന്നാംപുരുഷ ബഹുവചന സന്ദർഭം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിച്ചു.
- source_word: יָמִים רַבִּים
  choice: അനേകം ദിവസം
  rationale: കാലദൈർഘ്യത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗം വ്യാഖ്യാനാത്മകമായ ‘വളരെക്കാലം’ എന്നതിനു പകരം അടുത്ത രൂപത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠം വ്യക്തിനാമം ഉപയോഗിക്കുന്നതിനാൽ അത് ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ മലയാള വായനക്കാർക്ക് വ്യാപകമായി പരിചിതമായ ദൈവനാമരൂപം സ്വീകരിച്ചു; ഇതിലൂടെ പ്രത്യേക വിഭാഗീയ വ്യാഖ്യാനം ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. കഥാക്രമവും യാത്രാദിശയും മൂലപാഠത്തോട് ചേർന്ന് സൂക്ഷിച്ചു; ഭൂമിശാസ്ത്രനാമത്തിലെ യഥാർഥ പദസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
