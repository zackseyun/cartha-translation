id: DEU.2.15
reference: Deuteronomy 2:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/גַ֤ם יַד יְהוָה֙ הָ֣יְתָה בָּ֔/ם לְ/הֻמָּ֖/ם מִ/קֶּ֣רֶב הַֽ/מַּחֲנֶ֑ה עַ֖ד תֻּמָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/015.yaml
  text: Moreover[a], the hand of Yahweh was against them[b], to throw them into confusion from the midst of the camp until they were finished off.
translation:
  language: ml
  text: കൂടാതെ, പാളയത്തിന്റെ നടുവിൽനിന്ന് അവരെ പരിഭ്രാന്തരാക്കാൻ[a] യാഹ്‌വെയുടെ കൈ അവർക്കെതിരായിരുന്നു—അവർ ഒടുങ്ങിപ്പോകുന്നതുവരെ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അവരെ താറുമാറാക്കാൻ’ അല്ലെങ്കിൽ ‘അവരെ പിന്തിരിപ്പിച്ചോടിക്കാൻ’; ദൈവിക ന്യായവിധിയായി പരിഭ്രാന്തിയോ ആശയക്കുഴപ്പമോ ഉളവാക്കുന്നതിനെ ഈ എബ്രായ ക്രിയ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘അവർ അവസാനിക്കുന്നതുവരെ’ അല്ലെങ്കിൽ ‘അവർ നശിക്കുന്നതുവരെ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: കൂടാതെ
  rationale: മുൻവാക്യത്തോടുള്ള തുടർച്ചയും ഊന്നലും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: יַד יְהוָה
  choice: യാഹ്‌വെയുടെ കൈ
  rationale: ദൈവിക ശക്തിയെയും പ്രവർത്തനത്തെയും സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമായ ‘കൈ’ നിലനിർത്തുകയും יהוה എന്ന ഉടമ്പടിനാമം ‘യാഹ്‌വെ’ എന്നു ലിപ്യന്തരം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: בָם
  choice: അവർക്കെതിരായിരുന്നു
  rationale: ഈ സന്ദർഭത്തിൽ യാഹ്‌വെയുടെ കൈ അവർക്കുനേരെയുള്ള പ്രതികൂലമായ ന്യായവിധിപ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: לְהֻמָּם
  choice: അവരെ പരിഭ്രാന്തരാക്കി ചിതറിക്കാൻ
  rationale: המם എന്ന ക്രിയയുടെ പരിഭ്രാന്തി, ആശയക്കുഴപ്പം, താറുമാറാക്കൽ എന്നീ അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു; തുടർന്നുള്ള അന്തിമനാശവുമായി അതിനെ പൂർണമായി ലയിപ്പിക്കുന്നില്ല.
- source_word: מִקֶּרֶב הַמַּחֲנֶה
  choice: പാളയത്തിന്റെ നടുവിൽനിന്ന്
  rationale: ‘പാളയത്തിന്റെ മധ്യത്തിൽനിന്ന്’ എന്ന മൂലഭാഷയിലെ ദൃശ്യമായ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: עַד תֻּמָּם
  choice: അവർ ഒടുങ്ങിപ്പോകുന്നതുവരെ
  rationale: സംഘം പൂർണമായി അവസാനിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ഫലാത്മക അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; മരണം എന്ന അർഥം മാത്രം നിർബന്ധിക്കുന്നില്ല.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: യഹോവ
  rationale: മൂലപാഠത്തിലെ ചതുരക്ഷര ദൈവനാമം പൊതുവായ സ്ഥാനപ്പേരായി മാറ്റാതെ ഉടമ്പടിനാമമായി ലിപ്യന്തരം ചെയ്യുന്നു.
- issue: ദൈവിക ന്യായവിധിയിലെ പ്രവർത്തനവും അന്തിമഫലവും തമ്മിലുള്ള ബന്ധം
  choice: പരിഭ്രാന്തരാക്കി ചിതറിക്കൽ എന്ന പ്രവർത്തനവും ഒടുങ്ങിപ്പോകൽ എന്ന ഫലവും വേർതിരിച്ചു നിലനിർത്തുന്നു
  alternative: המם എന്ന ക്രിയയെ നേരിട്ട് ‘നശിപ്പിക്കുക’ എന്നു പരിഭാഷപ്പെടുത്തുക
  rationale: ക്രിയയുടെ പരിഭ്രാന്തി/താറുമാറാക്കൽ എന്ന അർഥവും עַד תֻּמָּם സൂചിപ്പിക്കുന്ന അന്തിമാവസ്ഥയും ഒരൊറ്റ ആശയമായി ചുരുക്കാതിരിക്കാൻ.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. മൂലഭാഷയിലെ ‘കൈ’ എന്ന ദൃശ്യപ്രയോഗവും ‘പാളയത്തിന്റെ നടുവിൽനിന്ന്’ എന്ന ഘടനയും നിലനിർത്തി; ദുഷ്കരമായ പദാനുപദ വാക്യക്രമം ഒഴിവാക്കി.
