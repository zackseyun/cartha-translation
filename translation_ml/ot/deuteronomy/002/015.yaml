    issue: The main text renders לְהֻמָּם as ‘അവരെ പരിഭ്രാന്തരാക്കി ചിതറിക്കാൻ.’
    rationale: ‘ചിതറിക്കുക’ introduces scattering/routing as an additional explicit action. While routing may be a possible contextual effect and appears as a footnote alternative, the main text should retain the Hebrew verb’s more basic sense of causing panic or confusion without expansion.
  revised_text: കൂടാതെ, പാളയത്തിന്റെ നടുവിൽനിന്ന് അവരെ പരിഭ്രാന്തരാക്കാൻ[a] യാഹ്‌വെയുടെ കൈ അവർക്കെതിരായിരുന്നു—അവർ ഒടുങ്ങിപ്പോകുന്നതുവരെ[b].
