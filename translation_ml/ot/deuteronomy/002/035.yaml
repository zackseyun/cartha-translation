source:
  edition: WLC
  text: רַ֥ק הַ/בְּהֵמָ֖ה בָּזַ֣זְנוּ לָ֑/נוּ וּ/שְׁלַ֥ל הֶ/עָרִ֖ים אֲשֶׁ֥ר לָכָֽדְנוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/035.yaml
  text: Only the livestock we took as plunder for ourselves[a], along with the spoil of the cities that we captured.
translation:
  language: ml
  text: കന്നുകാലികളെ മാത്രം ഞങ്ങൾ ഞങ്ങൾക്കായി കൊള്ളയായി എടുത്തു; ഞങ്ങൾ പിടിച്ചടക്കിയ പട്ടണങ്ങളിലെ കൊള്ളമുതലും എടുത്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: മാത്രമാണ്
  rationale: മുൻവാക്യത്തിലെ സമ്പൂർണ നശീകരണത്തിൽനിന്ന് കന്നുകാലികളെയും കൊള്ളമുതലിനെയും വേർതിരിച്ച്, സൂക്ഷിച്ചുവെച്ചത് ഇവ മാത്രമാണെന്ന പരിമിതി വ്യക്തമാക്കുന്നു.
- source_word: הַבְּהֵמָה
  choice: കന്നുകാലികൾ
  rationale: യുദ്ധത്തിൽ കൊള്ളയായി പിടിച്ചെടുത്ത വളർത്തുമൃഗങ്ങളെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; പൊതുവായ ‘മൃഗങ്ങൾ’ എന്നതിനെക്കാൾ ‘കന്നുകാലികൾ’ കൃത്യമാണ്.
- source_word: בָּזַזְנוּ לָנוּ
  choice: ഞങ്ങൾ നമുക്കായി കൊള്ളയടിച്ചത്
  rationale: בזז എന്ന ക്രിയയുടെ കൊള്ളയടിക്കുക എന്ന യുദ്ധസന്ദർഭാർഥവും לָנוּ എന്നതിന്റെ സ്വപ്രയോജനസൂചനയും നിലനിർത്തുന്നു.
- source_word: וּשְׁלַל
  choice: കൊള്ളമുതലിനെയും
  rationale: യുദ്ധത്തിൽ പിടിച്ചെടുത്ത വസ്തുവകകളെ സൂചിപ്പിക്കുന്ന שָׁלָל എന്ന പദത്തിന് സ്വാഭാവികവും വ്യക്തവുമായ മലയാളരൂപമാണിത്.
- source_word: הֶעָרִים
  choice: പട്ടണങ്ങൾ
  rationale: עִיר എന്ന പദം ഈ കീഴടക്കൽവിവരണത്തിൽ മതിലുകളുള്ളതോ ഭരണകേന്ദ്രങ്ങളായതോ ആയ ജനവാസകേന്ദ്രങ്ങളെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘പട്ടണങ്ങൾ’ സ്വാഭാവികമാണ്.
- source_word: אֲשֶׁר לָכָדְנוּ
  choice: ഞങ്ങൾ പിടിച്ചടക്കിയ
  rationale: לכד എന്ന ക്രിയയുടെ സൈനികസന്ദർഭത്തിലുള്ള പിടിച്ചടക്കുക/കൈവശമാക്കുക എന്ന അർഥം കൃത്യമായി നൽകുന്നു.
