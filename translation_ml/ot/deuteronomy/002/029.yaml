base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/029.yaml
  text: just as the sons of Esau who live in Seir and the Moabites who live in Ar did for me[a], until I cross the Jordan into the land that Yahweh our God is giving to us.
translation:
  language: ml
  text: സേയീരിൽ താമസിക്കുന്ന ഏശാവിന്റെ മക്കളും ആരിൽ താമസിക്കുന്ന മോവാബ്യരും എനിക്കു ചെയ്തതുപോലെതന്നെ[a], ഞങ്ങളുടെ ദൈവമായ യഹ്‌വെ ഞങ്ങൾക്കു നൽകുന്ന ദേശത്തേക്ക് ഞാൻ യോർദ്ദാൻ കടക്കുന്നതുവരെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എന്നോടു പെരുമാറിയതുപോലെ.’ എബ്രായയിൽ അക്ഷരാർഥം ‘എനിക്കു ചെയ്തതുപോലെ’ എന്നാണ്; സന്ദർഭത്തിൽ വഴിയനുവദിച്ചതും ആവശ്യസാധനങ്ങൾ ലഭ്യമാക്കിയതും ഇതിൽ ഉൾപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: ചെയ്തതുപോലെതന്നെ
  rationale: താരതമ്യത്തിന്റെ ഊന്നൽ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עָשׂוּ לִי
  choice: എനിക്കു ചെയ്തു
  rationale: എബ്രായയിലെ വിശാലവും സന്ദർഭാധീനവുമായ പ്രയോഗം അതിരുകടന്ന് വിശദീകരിക്കാതെ സംരക്ഷിക്കുന്നു; മുൻസന്ദർഭത്തിൽ വഴിയും സാധനങ്ങളും അനുവദിച്ചതിനെ സൂചിപ്പിക്കാം.
- source_word: בְּנֵי עֵשָׂו
  choice: ഏശാവിന്റെ മക്കൾ
  rationale: ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ കുടുംബബന്ധപ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: הַיֹּשְׁבִים
  choice: താമസിക്കുന്ന
  rationale: സ്ഥിരതാമസത്തെ സൂചിപ്പിക്കുന്ന പങ്കാളിക്രിയയ്ക്ക് സ്വാഭാവികമായ ആധുനിക മലയാളം.
- source_word: וְהַמּוֹאָבִים
  choice: മോവാബ്യർ
  rationale: ജനവിഭാഗനാമത്തിന്റെ നേരിട്ടുള്ള മലയാളരൂപം.
- source_word: עַד אֲשֶׁר אֶעֱבֹר אֶת הַיַּרְדֵּן
  choice: ഞാൻ യോർദ്ദാൻ കടക്കുന്നതുവരെ
  rationale: നദി കടന്നുപോകുന്നതിനെ മലയാളത്തിൽ വ്യക്തമായും സ്വാഭാവികമായും പറയുന്നു.
- source_word: אֶל הָאָרֶץ
  choice: ദേശത്തേക്ക്
  rationale: യോർദ്ദാൻ കടന്ന് ലക്ഷ്യദേശത്തിലേക്കുള്ള ചലനം വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֵינוּ
  choice: ഞങ്ങളുടെ ദൈവമായ
  rationale: ബന്ധസൂചകമായ പ്രഥമപുരുഷ ബഹുവചനവും യഹ്‌വെയോടുള്ള സമാസബന്ധവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: נֹתֵן לָנוּ
  choice: ഞങ്ങൾക്കു നൽകുന്ന
  rationale: എബ്രായ വർത്തമാന പങ്കാളിക്രിയയിലെ നടന്നുകൊണ്ടിരിക്കുന്നതും ഉറപ്പുള്ളതുമായ ദാനഭാവം പൂർത്തിയായ ഭൂതകാലമാക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ ദൈവത്തിന്റെ വ്യക്തിനാമം ഒരു പദവിയാൽ പകരംവയ്ക്കാതെ ലിപ്യന്തരണം ചെയ്യുന്നു; ‘യഹ്‌വെ’ എന്ന രൂപം Yahweh എന്ന ഉച്ചാരണത്തെ അടുത്തായി പ്രതിഫലിപ്പിക്കുന്നു.
- issue: עָשׂוּ לִי എന്നതിൽ സൂചിപ്പിക്കുന്ന പ്രവൃത്തി
  choice: എനിക്കു ചെയ്തു
  alternative: എന്നോടു പെരുമാറി / എനിക്ക് കടന്നുപോകാനും സാധനങ്ങൾ വാങ്ങാനും അനുവദിച്ചു
  rationale: സന്ദർഭം കടന്നുപോകലും ഭക്ഷണവും വെള്ളവും ലഭ്യമാക്കലും സൂചിപ്പിക്കുന്നുവെങ്കിലും, എബ്രായ വാചകം പ്രവൃത്തിയെ ഇവിടെ വ്യക്തമായി നിർവചിക്കുന്നില്ല; അതിനാൽ ആ അർത്ഥവ്യാപ്തി മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘താമസിക്കുന്ന’, ‘കടക്കുന്നതുവരെ’, ‘നൽകുന്ന’ എന്നീ പ്രയോഗങ്ങൾ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്; സ്ഥലനാമങ്ങളും ജനവിഭാഗനാമങ്ങളും ബൈബിൾ മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന രൂപത്തിൽ നൽകി.
