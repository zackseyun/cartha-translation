base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/025.yaml
  text: Today I will begin to put the dread and fear of you on the face of the peoples under all the heavens[b][a], who will hear the report about you and will tremble and writhe because of you.
translation:
  language: ml
  text: ഇന്നുമുതൽ ആകാശത്തിനുകീഴിലുള്ള സകല ജനതകളുടെയുംമേൽ നിന്നെക്കുറിച്ചുള്ള ഭീതിയും പേടിയും വരുത്താൻ ഞാൻ തുടങ്ങും. അവർ നിന്നെക്കുറിച്ചുള്ള വാർത്ത[a] കേൾക്കുമ്പോൾ നിന്റെ നിമിത്തം വിറയ്ക്കുകയും വേദനകൊണ്ട് പുളയുകയും[b] ചെയ്യും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘നിന്റെ കീർത്തി’ എന്നും ‘നിന്നെക്കുറിച്ചുള്ള കേൾവി’ എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രു പ്രയോഗത്തിന് വാർത്തയെയും അതിലൂടെ രൂപപ്പെടുന്ന കീർത്തിയെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘വ്യാകുലപ്പെടുകയും’ എന്നും ‘പ്രസവവേദനയിലെന്നപോലെ പുളയുകയും’ എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രു ക്രിയ തീവ്രമായ ശാരീരിക വ്യഥയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָחֵל תֵּת
  choice: വരുത്താൻ ഞാൻ തുടങ്ങും
  rationale: חלל എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപവും נתן എന്ന ക്രിയയുടെ infinitive construct-ഉം ചേർന്ന പ്രയോഗം ‘നൽകാൻ/വരുത്താൻ തുടങ്ങുക’ എന്നർഥം നൽകുന്നു. ഭീതിയും പേടിയും ജനതകളുടെമേൽ വരുത്തുന്നു എന്ന മലയാളപ്രയോഗം സ്വാഭാവികമാണ്.
- source_word: פַּחְדְּךָ וְיִרְאָתְךָ
  choice: നിന്നെക്കുറിച്ചുള്ള ഭീതിയും പേടിയും
  rationale: രണ്ടു സമാന്തര നാമങ്ങളെയും വേർതിരിച്ചു നിലനിർത്തുന്നു; ഇവ ഇസ്രായേലിനുണ്ടാകുന്ന ഭയമല്ല, ഇസ്രായേൽ നിമിത്തം ജനതകൾക്കുണ്ടാകുന്ന ഭയമാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: עַל פְּנֵי הָעַמִּים
  choice: സകല ജനതകളുടെയുംമേൽ
  rationale: അക്ഷരാർഥത്തിലെ ‘ജനതകളുടെ മുഖത്തിന്മേൽ’ എന്ന ഹീബ്രു രൂപകം മലയാളത്തിൽ അസ്വാഭാവികവും അർഥഭ്രമം സൃഷ്ടിക്കുന്നതുമാകയാൽ, സന്ദർഭത്തിലെ ‘ജനതകളുടെമേൽ’ എന്ന ആശയം സ്വാഭാവികമായി നൽകി.
- source_word: תַּחַת כָּל הַשָּׁמָיִם
  choice: ആകാശത്തിനുകീഴിലുള്ള
  rationale: ഭൂമിയിലെ സകല ജനതകളെയും സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ വ്യാപ്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר יִשְׁמְעוּן שִׁמְעֲךָ
  choice: അവർ നിന്നെക്കുറിച്ചുള്ള വാർത്ത കേൾക്കുമ്പോൾ
  rationale: שֵׁמַע/שִׁמְעַ എന്ന പദത്തിന് വാർത്ത, കേൾവി, കീർത്തി എന്നീ അർഥസാധ്യതകളുണ്ട്. മുഖ്യപാഠത്തിൽ വിശാലമായ ‘വാർത്ത’ സ്വീകരിച്ച് മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: וְרָגְזוּ
  choice: വിറയ്ക്കുകയും
  rationale: ഭയത്താൽ കുലുങ്ങുകയോ നടുങ്ങുകയോ ചെയ്യുന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְחָלוּ
  choice: വേദനകൊണ്ട് പുളയുകയും
  rationale: ശക്തമായ ശാരീരിക വ്യാകുലതയും പ്രസവവേദനപോലുള്ള പുളച്ചിലും സൂചിപ്പിക്കുന്ന ദൃശ്യത നിലനിർത്തുന്നു; പ്രസവത്തെ മുഖ്യപാഠത്തിൽ അനാവശ്യമായി നിർദ്ദിഷ്ടമാക്കുന്നില്ല.
- source_word: מִפָּנֶיךָ
  choice: നിന്റെ നിമിത്തം
  rationale: അക്ഷരാർഥത്തിൽ ‘നിന്റെ സന്നിധിയിൽനിന്ന്/മുഖത്തുനിന്ന്’; ഇവിടെ അവരുടെ ഭീതിയുടെയും വ്യാകുലതയുടെയും കാരണത്തെ വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഹീബ്രുവിലെ ആവർത്തനവും ശക്തമായ ശാരീരിക ദൃശ്യവും കഴിയുന്നത്ര നിലനിർത്തിക്കൊണ്ട്, മലയാളത്തിൽ അസ്വാഭാവികമായ ‘ജനതകളുടെ മുഖത്തിന്മേൽ’ എന്ന അക്ഷരരൂപം ഒഴിവാക്കി.
