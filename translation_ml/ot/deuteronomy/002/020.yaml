  text: אֶֽרֶץ רְפָאִ֥ים תֵּחָשֵׁ֖ב אַף הִ֑וא רְפָאִ֤ים יָֽשְׁבוּ בָ/הּ֙ לְ/פָנִ֔ים וְ/הָֽ/עַמֹּנִ֔ים יִקְרְא֥וּ לָ/הֶ֖ם זַמְזֻמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/020.yaml
  text: That also is considered a land of the Rephaim[a]; Rephaim lived in it formerly[b], but the Ammonites call them Zamzummim.
translation:
  language: ml
  text: അതും രെഫായീമ്യരുടെ ദേശമായി കണക്കാക്കപ്പെടുന്നു[a]. മുമ്പ് രെഫായീമ്യർ അവിടെ പാർത്തിരുന്നു[b]; എന്നാൽ അമ്മോന്യർ അവരെ സംസുമ്മ്യർ എന്നു വിളിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘രെഫായീമ്യരുടെ ദേശം.’
    reason: lexical_alternative
  - marker: b
    text: ‘രെഫായീമ്യർ’ എന്നത് വലിയ ശരീരവലുപ്പമുള്ളവരായി പരമ്പരാഗതമായി കണക്കാക്കപ്പെട്ടിരുന്ന ഒരു പുരാതന ജനവിഭാഗത്തെ സൂചിപ്പിക്കാം; ചില പരിഭാഷകൾ ഇവിടെ ഈ പദം ‘ഭീമന്മാർ’ എന്നു നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ רְפָאִים
  choice: രെഫായീമ്യരുടെ ദേശം
  rationale: אֶרֶץ എന്നത് ‘ദേശം’ എന്നും רְפָאִים ഇവിടെ ഒരു ജനവിഭാഗത്തിന്റെ പേരായും വരുന്നു. ‘മല്ലന്മാരുടെ ദേശം’ എന്ന വ്യാഖ്യാനപരമായ പരിഭാഷയ്ക്കുപകരം എബ്രായ ജനനാമം നിലനിർത്തുന്നു.
- source_word: תֵּחָשֵׁב
  choice: കണക്കാക്കപ്പെടുന്നു
  rationale: חשׁב എന്ന ക്രിയയുടെ നിഫാൽ രൂപത്തിലുള്ള ‘ആയി പരിഗണിക്കപ്പെടുക/കണക്കാക്കപ്പെടുക’ എന്ന കർമണിപ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: אַף הִוא
  choice: അതും
  rationale: മുൻപ് പരാമർശിച്ച ദേശത്തോടൊപ്പം ഈ ദേശത്തെയും ചേർക്കുന്ന വാക്യബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: רְפָאִים
  choice: രെഫായീമ്യർ
  rationale: ഇവിടെ ഈ പദം ഒരു പുരാതന ജനവിഭാഗത്തിന്റെ പേരായി പ്രവർത്തിക്കുന്നതിനാൽ വിവർത്തനം ചെയ്യാതെ മലയാളരൂപത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: יָשְׁבוּ בָהּ
  choice: അവിടെ പാർത്തിരുന്നു
  rationale: ישׁב എന്നതിന്റെ ‘താമസിക്കുക/പാർക്കുക’ എന്ന അർഥം ലളിതവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: לְפָנִים
  choice: മുമ്പ്
  rationale: ഒരു മുൻകാലത്തെ സൂചിപ്പിക്കുന്ന ക്രിയാവിശേഷണത്തിന്റെ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: וְהָעַמֹּנִים
  choice: എന്നാൽ അമ്മോന്യർ
  rationale: ו അടിസ്ഥാനമായി ‘കൂടാതെ/ഉം’ എന്നാണെങ്കിലും, രെഫായീമ്യർ എന്ന പൊതുപേരിൽനിന്ന് അമ്മോന്യർ ഉപയോഗിച്ച പേരിലേക്കുള്ള മാറ്റം മലയാളത്തിൽ ‘എന്നാൽ’ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: יִקְרְאוּ לָהֶם
  choice: അവരെ … എന്നു വിളിക്കുന്നു
  rationale: ഇവിടെ അപൂർണക്രിയാരൂപം പതിവായ നാമകരണത്തെ സൂചിപ്പിക്കുന്നതായി വർത്തമാനകാലത്തിൽ നൽകുന്നു.
- source_word: זַמְזֻמִּים
  choice: സംസുമ്മ്യർ
  rationale: ജനവിഭാഗത്തിന്റെ പേര് വിവർത്തനം ചെയ്യാതെ മലയാള ലിപിയിൽ നൽകുന്നു.
theological_decisions:
- issue: רְפָאִים എന്ന പദത്തിന്റെ അർഥം
  choice: ജനനാമമായി ‘രെഫായീമ്യർ’
  alternative: ‘മല്ലന്മാർ’
  rationale: ഈ സന്ദർഭത്തിൽ പദം ദേശത്തോടും അമ്മോന്യരുടെ മറ്റൊരു ജനനാമത്തോടും ബന്ധപ്പെടുത്തി ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ, ശരീരവലിപ്പത്തെക്കുറിച്ചുള്ള വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ നിർബന്ധിക്കാതെ മൂലത്തിലെ ജനനാമം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച മാന്യമായ മലയാളം. ജനനാമങ്ങൾ മലയാള ബഹുവചനരൂപത്തിൽ ലിപ്യന്തരിച്ചു; മൂലത്തിലെ കർമണിപ്രയോഗവും കാലസൂചനയും നിലനിർത്തി.
