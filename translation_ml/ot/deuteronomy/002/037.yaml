revisions:
- from: എന്നാൽ അമ്മോന്റെ മക്കളുടെ ദേശത്തേക്ക്[a] നീ അടുത്തുചെന്നില്ല—യബ്ബോക്ക് തോടിന്റെ കരയോരപ്രദേശത്തേക്കൊന്നും[b], മലനാട്ടിലെ പട്ടണങ്ങളിലേക്കും, നമ്മുടെ ദൈവമായ യഹോവ അടുത്തുചെല്ലരുതെന്നു കല്പിച്ച മറ്റൊരിടത്തേക്കും[c] നീ ചെന്നില്ല.
  to: മാത്രം, അമ്മോന്റെ മക്കളുടെ ദേശത്തോട് നീ അടുത്തുചെന്നില്ല—യബ്ബോക്ക് തോടിന്റെ കരയോരപ്രദേശത്തിന്റെ ഒരു ഭാഗത്തേക്കും, മലനാട്ടിലെ പട്ടണങ്ങളിലേക്കും, നമ്മുടെ ദൈവമായ യഹോവ കല്പിച്ച എല്ലാ സ്ഥലങ്ങളിലേക്കും നീ അടുത്തുചെന്നില്ല.
  rationale: “മാത്രം” രַק-ന്റെ അപവാദസൂചന നിലനിർത്തുന്നു. വാക്യത്തിലെ അവസാനത്തെ ആവർത്തിച്ച “നീ അടുത്തുചെന്നില്ല” മലയാളത്തിലെ സമാന്തര ഘടന വ്യക്തമാക്കുന്നു. എബ്രായത്തിലെ പരോക്ഷ കർമം മലയാളത്തിൽ വായിക്കാവുന്നവിധം ‘സ്ഥലങ്ങൾ’ എന്നു സൂചിപ്പിച്ചിട്ടുണ്ടെങ്കിലും, മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘അടുത്തുചെല്ലരുത്’ എന്ന കല്പനയോ ‘മറ്റൊരിടം’ എന്ന പരിമിതിയോ ചേർത്തിട്ടില്ല. എല്ലാ അടിക്കുറിപ്പ് ആങ്കറുകളും നിലനിർത്തിയിരിക്കുന്നു.
