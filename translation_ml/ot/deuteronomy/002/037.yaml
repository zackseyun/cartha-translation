id: DEU.2.37
reference: Deuteronomy 2:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: רַ֛ק אֶל אֶ֥רֶץ בְּנֵי עַמּ֖וֹן לֹ֣א קָרָ֑בְתָּ כָּל יַ֞ד נַ֤חַל יַבֹּק֙ וְ/עָרֵ֣י הָ/הָ֔ר וְ/כֹ֥ל אֲשֶׁר צִוָּ֖ה יְהוָ֥ה אֱלֹהֵֽי/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/037.yaml
  text: Only you did not come near the land of the sons of Ammon[a], all along the bank of the Jabbok, and the cities of the hill country[c][b], and all that Yahweh our God had commanded.
translation:
  language: ml
  text: മാത്രം, അമ്മോന്റെ മക്കളുടെ ദേശത്തോട് നീ അടുത്തുചെന്നില്ല—യബ്ബോക്ക് തോടിന്റെ കരയോരപ്രദേശത്തിന്റെ ഒരു ഭാഗത്തേക്കും, മലനാട്ടിലെ പട്ടണങ്ങളിലേക്കും, നമ്മുടെ ദൈവമായ യഹോവ കല്പിച്ച എല്ലാ സ്ഥലങ്ങളിലേക്കും നീ അടുത്തുചെന്നില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: എന്നാൽ … ഇല്ല
  rationale: മുൻവിവരണത്തിൽനിന്നുള്ള അപവാദം വ്യക്തമാക്കാൻ സ്വാഭാവികമായ മലയാള വിരുദ്ധബന്ധം ഉപയോഗിച്ചു.
- source_word: אֶל אֶרֶץ בְּנֵי עַמּוֹן
  choice: അമ്മോന്റെ മക്കളുടെ ദേശത്തേക്ക്
  rationale: ‘അമ്മോന്റെ മക്കൾ’ എന്ന എബ്രായ ഘടന നിലനിർത്തുന്നു; ‘അമ്മോന്യരുടെ ദേശം’ എന്ന സ്വാഭാവിക പര്യായം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: לֹא קָרָבְתָּ
  choice: നീ അടുത്തുചെന്നില്ല
  rationale: קרב എന്ന ക്രിയയുടെ സ്ഥലസംബന്ധിയായ അർഥം നിലനിർത്തുന്നു; സൈനികാക്രമണം എന്ന് അതിവ്യാഖ്യാനിക്കുന്നില്ല. ഏകവചന അഭിസംബോധനയും സംരക്ഷിക്കുന്നു.
- source_word: כָּל יַד נַחַל יַבֹּק
  choice: യബ്ബോക്ക് തോടിന്റെ കരയോരപ്രദേശത്തേക്കൊന്നും
  rationale: ജലപാതയുടെ ‘കൈ’ എന്ന പ്രയോഗം അതിന്റെ വശം, തീരം, അല്ലെങ്കിൽ സമീപപ്രദേശം എന്ന അർഥമുള്ള എബ്രായ ശൈലിയാണ്; മലയാളത്തിൽ അർഥം സ്വാഭാവികമായി അറിയിച്ചു.
- source_word: וְעָרֵי הָהָר
  choice: മലനാട്ടിലെ പട്ടണങ്ങളിലേക്കും
  rationale: הָהָר ഇവിടെ ഒറ്റമലയെക്കാൾ ഉയർന്ന മലനാടിനെ സൂചിപ്പിക്കുന്നു; עָרִים എന്നതിന് സാധാരണ വായനക്കാർക്കു സ്വാഭാവികമായ ‘പട്ടണങ്ങൾ’ തിരഞ്ഞെടുത്തു.
- source_word: וְכֹל אֲשֶׁר צִוָּה
  choice: അടുത്തുചെല്ലരുതെന്നു കല്പിച്ച മറ്റൊരിടത്തേക്കും
  rationale: എബ്രായത്തിൽ കല്പനയുടെ കർമം വ്യക്തമാക്കാതെ വിട്ടിരിക്കുന്നു. സന്ദർഭം ആവശ്യപ്പെടുന്ന ‘അടുത്തുചെല്ലരുത്’ എന്ന ആശയം മലയാളത്തിൽ വ്യക്തമാക്കി; അക്ഷരാർഥപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: אֱלֹהֵינוּ
  choice: നമ്മുടെ ദൈവമായ
  rationale: ഉടമസ്ഥബന്ധവും ഉടമ്പടിസംബന്ധിയായ വിശേഷണവും സ്വാഭാവിക മലയാളത്തിൽ അറിയിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമം ഉപയോഗിക്കുന്നതിനാൽ അതിനെ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
- issue: വാക്യാവസാനത്തിലെ പരോക്ഷമായ കല്പനയുടെ കർമം
  choice: അടുത്തുചെല്ലരുതെന്നു കല്പിച്ച മറ്റൊരിടത്തേക്കും
  alternative: നമ്മുടെ ദൈവമായ യഹോവ കല്പിച്ചതെല്ലാം
  rationale: സന്ദർഭത്തിൽ ദൈവകല്പന ചില പ്രദേശങ്ങളിലേക്ക് അടുത്തുചെല്ലാതിരിക്കാനാണ്. എന്നാൽ എബ്രായത്തിൽ കർമം തുറന്നുപറയാത്തതിനാൽ അക്ഷരാർഥപരമായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നൽകി; നിരോധനത്തിന്റെ ദൈവശാസ്ത്രപരമായ പരിധി അതിലധികം വികസിപ്പിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. മോശെ ജനത്തെ ഏകവചനമായി അഭിസംബോധന ചെയ്യുന്ന എബ്രായ രൂപം ‘നീ’ എന്നു നിലനിർത്തി. സ്ഥലങ്ങളുടെ പട്ടിക വ്യക്തമാക്കാൻ ദീർഘവിരാമവും സമാന്തര വിഭക്തിരൂപങ്ങളും ഉപയോഗിച്ചു.
