  text: And the days that we traveled from Kadesh-barnea until we crossed the Wadi Zered were thirty-eight years[a], until the entire generation of the men of war had come to an end from the midst of the camp, just as Yahweh had sworn to them.
translation:
  language: ml
  text: ഞങ്ങൾ കാദേശ്-ബർന്നേയയിൽനിന്ന് സഞ്ചരിച്ച് സേരെദ് തോട് കടന്നതുവരെയുള്ള ദിവസങ്ങൾ മുപ്പത്തെട്ടു വർഷമായിരുന്നു[a]—യഹോവ അവരോടു സത്യംചെയ്തിരുന്നതുപോലെ, യുദ്ധപുരുഷന്മാരുടെ ആ തലമുറ മുഴുവനും പാളയത്തിന്റെ നടുവിൽനിന്ന് ഇല്ലാതാകുന്നതുവരെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സേരെദ് അരുവി’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം തോട്, നീർച്ചാൽ, അല്ലെങ്കിൽ കാലാവസ്ഥാനുസൃതമായി വെള്ളമൊഴുകുന്ന വരണ്ട താഴ്വര എന്നിവയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיָּמִים אֲשֶׁר הָלַכְנוּ
  choice: ഞങ്ങൾ ... പുറപ്പെട്ട് ... കടക്കുന്നതുവരെയുള്ള കാലം
  rationale: അക്ഷരാർഥത്തിലെ ‘ഞങ്ങൾ നടന്ന ദിവസങ്ങൾ’ എന്നതിനെക്കാൾ, യാത്രയുടെ ദൈർഘ്യം സൂചിപ്പിക്കുന്ന സന്ദർഭാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: കാദേശ്-ബർന്നേയയിൽനിന്ന്
  rationale: സ്ഥലനാമത്തിന്റെ ഹീബ്രു ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം.
- source_word: נַחַל זֶרֶד
  choice: സേരെദ് തോട്
  rationale: נַחַל കാലാവസ്ഥാനുസൃതമായി വെള്ളമൊഴുകുന്ന തോട്, അരുവി, അല്ലെങ്കിൽ വരണ്ട നീർച്ചാൽ എന്നർഥമാകാം; സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ‘തോട്’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു.
- source_word: שְׁלֹשִׁים וּשְׁמֹנֶה שָׁנָה
  choice: മുപ്പത്തെട്ടു വർഷം
  rationale: സംഖ്യാവാക്യത്തിന്റെ സ്വാഭാവിക ആധുനിക മലയാളരൂപം.
- source_word: עַד תֹּם כָּל הַדּוֹר
  choice: ആ തലമുറ മുഴുവനും ... ഇല്ലാതാകുന്നതുവരെ
  rationale: תֹּם സൂചിപ്പിക്കുന്ന സമ്പൂർണമായ അവസാനത്തെ നിലനിർത്തുന്നു; ഇവിടെ ആ തലമുറയുടെ മരണത്തിലൂടെയുള്ള അന്ത്യമാണ് സന്ദർഭം.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: യുദ്ധത്തിനു പ്രാപ്തരായ പുരുഷന്മാർ
  rationale: അക്ഷരാർഥത്തിലെ ‘യുദ്ധപുരുഷന്മാർ’ എന്ന ആശയം നിലനിർത്തിക്കൊണ്ട്, സൈനികസേവനയോഗ്യരായ പുരുഷന്മാരെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നതെന്ന് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מִקֶּרֶב הַמַּחֲנֶה
  choice: പാളയത്തിന്റെ നടുവിൽനിന്ന്
  rationale: קֶרֶב എന്നതിലെ ‘മധ്യം/ഇടയിൽ’ എന്ന ആശയം സംരക്ഷിക്കുന്നു.
- source_word: כַּאֲשֶׁר נִשְׁבַּע יְהוָה לָהֶם
  choice: യഹോവ അവരോടു സത്യംചെയ്തിരുന്നതുപോലെ
  rationale: ദൈവനാമം ലിപ്യന്തരിച്ചു നൽകുകയും, נִשְׁבַּע എന്ന ശപഥഭാഷ വ്യക്തമായി നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ സുപരിചിതമായ ലിപ്യന്തരണരൂപത്തിൽ നൽകുന്നു.
- issue: אַנְשֵׁי הַמִּלְחָמָה എന്നതിലെ ലിംഗവും സൈനികസന്ദർഭവും
  choice: യുദ്ധത്തിനു പ്രാപ്തരായ പുരുഷന്മാർ
  alternative: യോദ്ധാക്കൾ
  rationale: ഹീബ്രുവിലെ വ്യക്തമായ പുരുഷസൂചനയും എണ്ണപ്പെടുന്ന സൈനികപ്രായക്കാരുടെ സന്ദർഭവും സംരക്ഷിക്കുന്നു.
- issue: തലമുറയുടെ ‘അവസാനം’ എന്ന ന്യായവിധിഭാഷ
  choice: ഇല്ലാതാകുന്നതുവരെ
  alternative: അവസാനിക്കുന്നതുവരെ
  rationale: അവർ പാളയത്തിൽനിന്ന് മരണംമൂലം നീങ്ങിപ്പോയതെന്ന സന്ദർഭാർഥം അറിയിക്കുമ്പോഴും, സംഭവത്തിന്റെ രീതി അനാവശ്യമായി വിശദീകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ദീർഘമായ ഹീബ്രു വാക്യത്തിന്റെ കാലപരിധിയും ഫലവും വ്യക്തമാക്കാൻ മലയാളത്തിൽ രണ്ടു വാക്യങ്ങളാക്കി; അർഥബന്ധം നിലനിർത്തി.
