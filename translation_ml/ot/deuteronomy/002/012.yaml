source:
  edition: WLC
  text: וּ/בְ/שֵׂעִ֞יר יָשְׁב֣וּ הַ/חֹרִים֮ לְ/פָנִים֒ וּ/בְנֵ֧י עֵשָׂ֣ו יִֽירָשׁ֗וּ/ם וַ/יַּשְׁמִידוּ/ם֙ מִ/פְּנֵי/הֶ֔ם וַ/יֵּשְׁב֖וּ תַּחְתָּ֑/ם כַּ/אֲשֶׁ֧ר עָשָׂ֣ה יִשְׂרָאֵ֗ל לְ/אֶ֨רֶץ֙ יְרֻשָּׁת֔/וֹ אֲשֶׁר נָתַ֥ן יְהוָ֖ה לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/012.yaml
  text: And in Seir the Horites formerly lived[a], but the sons of Esau dispossessed them and destroyed them from before them, and settled in their place, just as Israel did to the land of his possession[c][b], which Yahweh gave to them.
translation:
  language: ml
  text: സേയീരിൽ പണ്ട് ഹോര്യർ പാർത്തിരുന്നു. എന്നാൽ ഏശാവിന്റെ മക്കൾ അവരെ ഒഴിപ്പിച്ച് അവരുടെ ദേശം കൈവശപ്പെടുത്തി[a]; തങ്ങളുടെ മുമ്പിൽനിന്ന് അവരെ നശിപ്പിച്ചുനീക്കി[b], അവരുടെ സ്ഥാനത്ത് പാർത്തു. യഹ്‌വെ അവർക്കു നൽകിയ തന്റെ അവകാശദേശത്തിന്റെ കാര്യത്തിൽ ഇസ്രായേൽ ചെയ്തതുപോലെതന്നെയായിരുന്നു ഇത്[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവരെ പുറത്താക്കി.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായക്രിയയ്ക്ക് മുൻനിവാസികളെ ഒഴിപ്പിച്ച് അവരുടെ ദേശം കൈവശമാക്കുക എന്ന അർഥമുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘തങ്ങളുടെ മുമ്പിൽനിന്ന്’; തങ്ങളുടെ സാന്നിധ്യത്തിൽനിന്ന് അവരെ നീക്കിയെന്നർഥമുള്ള പ്രയോഗം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘തന്റെ പാരമ്പര്യമായി ലഭിച്ച ദേശത്തിന്റെ കാര്യത്തിൽ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹרִים
  choice: ഹോര്യർ
  rationale: സേയീരിൽ വസിച്ചിരുന്ന ജനവിഭാഗത്തിന്റെ പേരെന്ന നിലയിൽ, മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചനരൂപം ഉപയോഗിച്ചു.
- source_word: לְפָנִים
  choice: പണ്ട്
  rationale: ഇവിടെ സ്ഥലസൂചനയല്ല, മുൻകാലത്തെ സൂചിപ്പിക്കുന്ന കാലവാചകമാണ്; സാധാരണ വായനക്കാർക്കു വ്യക്തമായ ആധുനിക മലയാളരൂപം തിരഞ്ഞെടുത്തു.
- source_word: יִירָשׁוּם
  choice: അവരെ ഒഴിപ്പിച്ച് അവരുടെ ദേശം കൈവശപ്പെടുത്തി
  rationale: മുൻനിവാസികളെ നീക്കി അവരുടെ ഭൂമി കൈവശമാക്കുക എന്ന ירשׁ എന്ന ക്രിയയുടെ ഇരട്ട ആശയം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיַּשְׁמִידוּם
  choice: അവരെ നശിപ്പിച്ചുനീക്കി
  rationale: שׁמד എന്നതിന്റെ ശക്തമായ നാശാർഥം സംരക്ഷിക്കുമ്പോഴും, സന്ദർഭത്തിലെ നീക്കംചെയ്യൽ എന്ന ഫലവും മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מִפְּנֵיהֶם
  choice: തങ്ങളുടെ മുമ്പിൽനിന്ന്
  rationale: എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യഭാവം നിലനിർത്തുകയും, തങ്ങളുടെ സാന്നിധ്യത്തിൽനിന്ന് അവരെ നീക്കിയെന്ന അർഥം നൽകുകയും ചെയ്യുന്നു.
- source_word: תַּחְתָּם
  choice: അവരുടെ സ്ഥാനത്ത്
  rationale: മുൻനിവാസികളെ മാറ്റി അവരുടെ ഇടത്ത് താമസമാക്കിയെന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כַּאֲשֶׁר עָשָׂה יִשְׂרָאֵל
  choice: ഇസ്രായേൽ ചെയ്തതുപോലെതന്നെ
  rationale: താരതമ്യവാക്യത്തിന്റെ ലളിതരൂപം നിലനിർത്തുന്നു; ഇസ്രായേൽ കൃത്യമായി എന്തു ചെയ്തു എന്നത് വിവർത്തനത്തിൽ കൂടുതൽ വിശദീകരിക്കുന്നില്ല.
- source_word: לְאֶרֶץ יְרֻשָּׁתוֹ
  choice: തന്റെ അവകാശദേശത്തോട്
  rationale: יְרֻשָּׁה എന്നതിലെ കൈവശാവകാശത്തിന്റെയും പാരമ്പര്യമായി ലഭിച്ച ഓഹരിയുടെയും അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു; ഏകവചനമായ ഇസ്രായേലിനോടു ചേർന്ന ‘തന്റെ’ എന്ന രൂപവും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ അതിന്റെ പരിചിതമായ ലിപ്യന്തരണം നൽകി.
- source_word: לָהֶם
  choice: അവർക്കു
  rationale: ‘ഇസ്രായേൽ/തന്റെ’ എന്ന സമൂഹവാചക ഏകവചനത്തിൽനിന്ന് ‘അവർക്കു’ എന്ന ബഹുവചനത്തിലേക്കുള്ള എബ്രായത്തിലെ സംഖ്യാമാറ്റം അതേപടി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘ഇസ്രായേൽ തന്റെ അവകാശദേശത്തോട് ചെയ്തതുപോലെ’ എന്ന താരതമ്യത്തിന്റെ ചരിത്രപരമായ സൂചന
  choice: ഇസ്രായേൽ ഇതിനകം ചെയ്തതായി വാക്യം അവതരിപ്പിക്കുന്ന താരതമ്യം അതേപടി നിലനിർത്തി.
  alternative: ഇത് പിന്നീടുള്ള വിശദീകരണമെന്നോ, ഇസ്രായേൽ ഇനിയും ദേശം കൈവശപ്പെടുത്തിയിട്ടില്ലെന്നോ തോന്നുന്നവിധം വാക്യം മാറ്റുക.
  rationale: എബ്രായ പാഠം താരതമ്യത്തെ ഭൂതകാലസംഭവമായി നേരിട്ട് അവതരിപ്പിക്കുന്നു. കാലക്രമമോ പാഠചരിത്രമോ സംബന്ധിച്ച വാദങ്ങൾ വിവർത്തനത്തിലൂടെ പരിഹരിക്കാതെ യഥാർഥമായ പാഠസമ്മർദം സംരക്ഷിച്ചു.
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമത്തെ ഒരു ബിരുദപ്പേരാക്കി മാറ്റാതെ മലയാള ലിപ്യന്തരണമായി നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള വിവരണശൈലി ഉപയോഗിച്ചു. ‘അവരെ ഒഴിപ്പിച്ച് അവരുടെ ദേശം കൈവശപ്പെടുത്തി’ എന്നത് എബ്രായക്രിയയുടെ സങ്കീർണത സ്വാഭാവികമായി തുറന്നുകാട്ടുന്നു. അവസാന താരതമ്യവാക്യത്തിലെ ചരിത്രപരവും വ്യാകരണപരവുമായ സമ്മർദം ലളിതീകരിക്കാതെ നിലനിർത്തിയിട്ടുണ്ട്.
