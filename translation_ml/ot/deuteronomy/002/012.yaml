revisions:
- from: സേയീരിൽ പണ്ട് ഹോര്യർ പാർത്തിരുന്നു. എന്നാൽ ഏശാവിന്റെ മക്കൾ അവരെ ഒഴിപ്പിച്ച് അവരുടെ ദേശം കൈവശപ്പെടുത്തി[a]; തങ്ങളുടെ മുമ്പിൽനിന്ന് അവരെ നശിപ്പിച്ചുനീക്കി[b], അവരുടെ സ്ഥാനത്ത് പാർത്തു. യഹ്‌വെ അവർക്കു നൽകിയ തന്റെ അവകാശദേശത്തോട്[c] ഇസ്രായേൽ ചെയ്തതുപോലെതന്നെയായിരുന്നു അത്.
  to: സേയീരിൽ പണ്ട് ഹോര്യർ പാർത്തിരുന്നു. എന്നാൽ ഏശാവിന്റെ മക്കൾ അവരെ ഒഴിപ്പിച്ച് അവരുടെ ദേശം കൈവശപ്പെടുത്തി[a]; തങ്ങളുടെ മുമ്പിൽനിന്ന് അവരെ നശിപ്പിച്ചുനീക്കി[b], അവരുടെ സ്ഥാനത്ത് പാർത്തു. യഹ്‌വെ അവർക്കു നൽകിയ തന്റെ അവകാശദേശത്തിന്റെ കാര്യത്തിൽ ഇസ്രായേൽ ചെയ്തതുപോലെതന്നെയായിരുന്നു ഇത്[c].
  rationale: Only the final comparison has been revised. ‘അവകാശദേശത്തിന്റെ കാര്യത്തിൽ’ is idiomatic modern Malayalam for the Hebrew construction while retaining the received text's past-tense comparison and without attempting to settle chronological or compositional questions. Footnote c has been adjusted to match its revised anchor phrase.
