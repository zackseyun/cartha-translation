  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/לְ/גָ֣ד אָמַ֔ר בָּר֖וּךְ מַרְחִ֣יב גָּ֑ד כְּ/לָבִ֣יא שָׁכֵ֔ן וְ/טָרַ֥ף זְר֖וֹעַ אַף קָדְקֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/020.yaml
  text: 'And of Gad he said: “Blessed is he who enlarges Gad[a]. He dwells like a lioness, and tears off arm[c][b], even scalp.”'
translation:
  language: ml
  text: 'ഗാദിനെക്കുറിച്ച് അവൻ പറഞ്ഞു:


    “ഗാദിന് വിശാലത നൽകുന്നവൻ വാഴ്ത്തപ്പെട്ടവൻ[a].


    ഗാദ് സിംഹിയെപ്പോലെ[b] പാർക്കുന്നു;


    ഭുജവും ശിരസ്സിന്റെ ഉച്ചിപോലും അവൻ കീറിപ്പറിക്കുന്നു[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഗാദിന് വിശാലത നൽകുന്നവൻ വാഴ്ത്തപ്പെടട്ടെ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ദൈവം പരോക്ഷ കർത്താവായി ഉദ്ദേശിക്കപ്പെട്ടിരിക്കാം; എന്നാൽ ഹീബ്രു പാഠം കർത്താവിനെ വ്യക്തമായി പറയുന്നില്ല.
    reason: alternative_reading
  - marker: b
    text: ‘സിംഹത്തെപ്പോലെ’ എന്നും പരിഭാഷപ്പെടുത്താം; ഹീബ്രുപദം പൊതുവായി ശക്തനായ ഒരു സിംഹത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: 'അക്ഷരാർഥം: ‘ഭുജം, അതെ, ശിരസ്സിന്റെ ഉച്ചിപോലും.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְגָד
  choice: ഗാദിനെക്കുറിച്ച്
  rationale: ഗാദ് ഗോത്രത്തെ അഭിസംബോധന ചെയ്യുന്ന അനുഗ്രഹവാക്യം പരിചയപ്പെടുത്തുന്ന സ്വാഭാവിക മലയാള പ്രയോഗം.
- source_word: בָּרוּךְ
  choice: വാഴ്ത്തപ്പെട്ടവൻ
  rationale: ആശംസയാക്കി മാറ്റാതെ, ഹീബ്രുവിലെ അനുഗ്രഹപ്രഖ്യാപനത്തിന്റെ രൂപം നിലനിർത്തുന്നു.
- source_word: מַרְחִיב גָּד
  choice: ഗാദിന് വിശാലത നൽകുന്നവൻ
  rationale: സ്ഥലം വിശാലമാക്കുക, ഇടം നൽകുക, വ്യാപിപ്പിക്കുക എന്നീ അർഥസാധ്യതകൾ ഉൾക്കൊള്ളുന്നു; കർത്താവ് ആരെന്നത് വ്യക്തമാക്കാതെ ഹീബ്രുവിലെ തുറന്ന നില സംരക്ഷിക്കുന്നു.
- source_word: כְּלָבִיא
  choice: സിംഹിയെപ്പോലെ
  rationale: לָבִיא എന്ന പദത്തിന് സിംഹി എന്നും ശക്തനായ സിംഹം എന്നും അർഥമാകാം; പ്രധാന പാഠത്തിൽ സിംഹി സ്വീകരിച്ച് മറ്റുസാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
- source_word: שָׁכֵן
  choice: പതുങ്ങിക്കിടക്കുന്നു
  rationale: വസിക്കുക, പാർക്കുക, കിടക്കുക എന്നീ അർഥങ്ങളുള്ള ക്രിയയെ സിംഹത്തിന്റെ ദൃശ്യബിംബത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: וְטָרַף
  choice: കടിച്ചുകീറുന്നു
  rationale: ഇരപിടിക്കുന്ന മൃഗം കീറിപ്പറിക്കുന്ന ശക്തമായ ദൃശ്യബിംബം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: זְרוֹעַ
  choice: ഭുജം
  rationale: ശക്തി എന്ന അമൂർത്ത അർഥത്തേക്കാൾ ശരീരഭാഗം തന്നെയാണ് തുടർന്നുള്ള ‘ശിരസ്സിന്റെ ഉച്ചി’യോടുള്ള സമാന്തരത്തിൽ യോജിക്കുന്നത്.
- source_word: אַף קָדְקֹד
  choice: ശിരസ്സിന്റെ ഉച്ചിപോലും
  rationale: אַף എന്ന തീവ്രതാസൂചകത്തെ ‘പോലും’ കൊണ്ടും קָדְקֹד എന്ന ശരീരഭാഗത്തെ ‘ശിരസ്സിന്റെ ഉച്ചി’ കൊണ്ടും കൃത്യമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘ഗാദിന് വിശാലത നൽകുന്നവൻ’ എന്നതിന്റെ കർത്താവ്
  choice: കർത്താവിനെ പാഠത്തിൽ വ്യക്തമാക്കാതെ ‘നൽകുന്നവൻ’ എന്നു നിലനിർത്തി.
  alternative: ദൈവമാണ് കർത്താവെന്ന് മനസ്സിലാക്കി ‘ഗാദിന് വിശാലത നൽകുന്ന ദൈവം വാഴ്ത്തപ്പെടട്ടെ’ എന്നു പരിഭാഷപ്പെടുത്തുക.
  rationale: മൂലഹീബ്രുവിൽ ദൈവത്തിന്റെ പേര് ഇവിടെ പ്രത്യക്ഷമായി ഇല്ല. ദൈവം ഉദ്ദേശിക്കപ്പെട്ടിരിക്കാമെങ്കിലും ആ വ്യാഖ്യാനം പ്രധാന പാഠത്തിൽ ചേർക്കാതെ യഥാർഥമായ അവ്യക്തത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധത്തിൽ കാവ്യാത്മകവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ഹീബ്രു കവിതയിലെ ഹിംസാത്മകമായ സിംഹദൃശ്യം മയപ്പെടുത്താതെ നിലനിർത്തി.
