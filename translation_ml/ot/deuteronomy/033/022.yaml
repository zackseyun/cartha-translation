source:
  edition: WLC
  text: וּ/לְ/דָ֣ן אָמַ֔ר דָּ֖ן גּ֣וּר אַרְיֵ֑ה יְזַנֵּ֖ק מִן הַ/בָּשָֽׁן־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/022.yaml
  text: 'And of Dan he said: “Dan is a lion’s cub[a]; he leaps out from Bashan.”'
translation:
  language: ml
  text: 'ദാനെക്കുറിച്ച് അവൻ പറഞ്ഞു:

    “ദാൻ ഒരു സിംഹക്കുട്ടിയാണ്;

    അവൻ ബാശാനിൽനിന്ന് കുതിച്ചുചാടുന്നു.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൻ ബാശാനിൽനിന്ന് കുതിച്ചുപുറപ്പെടുന്നു.” എബ്രായ ക്രിയ പെട്ടെന്നുള്ള ഒരു ചാട്ടത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְדָן
  choice: ദാനെക്കുറിച്ച്
  rationale: ഗോത്രങ്ങൾക്കുള്ള അനുഗ്രഹങ്ങളുടെ പരമ്പരയിൽ അടുത്ത അനുഗ്രഹവിഷയത്തെ പരിചയപ്പെടുത്തുന്ന പ്രയോഗം. ‘ദാനെക്കുറിച്ച്’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികവും മൂലത്തിലെ സംബന്ധാർഥം നിലനിർത്തുന്നതുമാണ്.
- source_word: אָמַר
  choice: അവൻ പറഞ്ഞു
  rationale: אָמַר എന്ന സാധാരണ റിപ്പോർട്ടിങ് ക്രിയയുടെ ലളിതവും സുതാര്യവുമായ പരിഭാഷ.
- source_word: דָּן
  choice: ദാൻ
  rationale: വ്യക്തിയുടെയും ഗോത്രത്തിന്റെയും പേരായതിനാൽ മലയാള ലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: גּוּר אַרְיֵה
  choice: ഒരു സിംഹക്കുട്ടി
  rationale: ഈ സംയുക്തപദം പ്രായം കുറഞ്ഞ സിംഹത്തെ സൂചിപ്പിക്കുന്നു. ‘സിംഹക്കുട്ടി’ ആ ചിത്രം വ്യക്തമായി നൽകുന്ന സ്വാഭാവിക ആധുനിക മലയാളമാണ്.
- source_word: יְזַנֵּק
  choice: കുതിച്ചുചാടുന്നു
  rationale: പെട്ടെന്നുള്ള ശക്തമായ ചാട്ടത്തെ സൂചിപ്പിക്കുന്ന ക്രിയ. ‘കുതിച്ചുചാടുന്നു’ സിംഹത്തിന്റെ സജീവമായ ചിത്രം നിലനിർത്തുന്നു; ‘ആക്രമിക്കുന്നു’ എന്നു വിവക്ഷിച്ച് അർഥം ചുരുക്കുന്നില്ല.
- source_word: מִן הַבָּשָׁן
  choice: ബാശാനിൽനിന്ന്
  rationale: מִן ഉത്ഭവസ്ഥാനത്തെ സൂചിപ്പിക്കുന്നു; ബാശാൻ സ്ഥലനാമമായതിനാൽ ലിപ്യന്തരണം ചെയ്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കാവ്യാത്മക ഗദ്യം ഉപയോഗിച്ചു. ഹീബ്രു വരികളുടെ സമാന്തരഘടന കാണിക്കാൻ വരിവിഭജനം നിലനിർത്തി; ക്രിയയിലെ പെട്ടെന്നുള്ള ചലനഭാവം മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
