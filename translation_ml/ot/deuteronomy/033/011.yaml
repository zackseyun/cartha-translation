- from: യഹോവേ, അവന്റെ ശക്തിയെ അനുഗ്രഹിക്കണമേ[a]; അവന്റെ കൈകളുടെ പ്രവൃത്തി സ്വീകരിക്കണമേ. അവനെതിരെ എഴുന്നേൽക്കുന്നവരുടെയും അവനെ വെറുക്കുന്നവരുടെയും അരക്കെട്ട് തകർക്കണമേ[b]; അവർ വീണ്ടും എഴുന്നേൽക്കാതിരിക്കട്ടെ.
  to: യഹോവേ, അവന്റെ ശക്തിയെ[a] അനുഗ്രഹിക്കണമേ; അവന്റെ കൈകളുടെ പ്രവൃത്തി സ്വീകരിക്കണമേ. അവനെതിരെ എഴുന്നേൽക്കുന്നവരുടെയും അവനെ വെറുക്കുന്നവരുടെയും അര[b] തകർക്കണമേ; അവർ വീണ്ടും എഴുന്നേൽക്കാതിരിക്കട്ടെ.
