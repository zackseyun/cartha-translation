id: DEU.33.11
reference: Deuteronomy 33:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בָּרֵ֤ךְ יְהוָה֙ חֵיל֔/וֹ וּ/פֹ֥עַל יָדָ֖י/ו תִּרְצֶ֑ה מְחַ֨ץ מָתְנַ֧יִם קָמָ֛י/ו וּ/מְשַׂנְאָ֖י/ו מִן יְקוּמֽוּ/ן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/011.yaml
  text: Bless[a], O Yahweh, his strength, and accept the work of his hands. Crush the loins of those who rise against him, and of those who hate him[b], so that they do not rise again.
translation:
  language: ml
  text: യഹോവേ, അവന്റെ ശക്തിയെ[a] അനുഗ്രഹിക്കണമേ; അവന്റെ കൈകളുടെ പ്രവൃത്തി സ്വീകരിക്കണമേ. അവനെതിരെ എഴുന്നേൽക്കുന്നവരുടെയും അവനെ വെറുക്കുന്നവരുടെയും അര[b] തകർക്കണമേ; അവർ വീണ്ടും എഴുന്നേൽക്കാതിരിക്കട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ശക്തി” എന്നതിന് “സമ്പത്ത്,” “വിഭവശേഷി,” അല്ലെങ്കിൽ “സൈനികബലം” എന്നും അർഥമാകാം; എബ്രായപദത്തിന് ഈ അർഥവ്യാപ്തിയുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “അര.” അര ഇവിടെ ശക്തിയെ സൂചിപ്പിക്കുന്ന എബ്രായ ശരീരരൂപകമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: בָּרֵךְ
  choice: അനുഗ്രഹിക്കണമേ
  rationale: യഹോവയോടുള്ള ആജ്ഞാർഥക അപേക്ഷയാണ്. ‘അനുഗ്രഹിക്കുക’ എന്നത് നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ‘അഭിവൃദ്ധിപ്പെടുത്തുക’ എന്നത് സന്ദർഭത്തിൽ സാധ്യമെങ്കിലും കൂടുതൽ വ്യാഖ്യാനാത്മകമാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: חֵילוֹ
  choice: അവന്റെ ശക്തി
  rationale: חַיִל എന്ന പദത്തിന് ശക്തി, സമ്പത്ത്, വിഭവശേഷി, സൈനികബലം എന്നീ അർഥങ്ങൾ വരാം. ഇവിടെ ‘ശക്തി’ ഈ അർഥവ്യാപ്തിയെ ഏറ്റവും കുറച്ച് ചുരുക്കുന്ന തിരഞ്ഞെടുപ്പാണ്; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וּפֹעַל יָדָיו
  choice: അവന്റെ കൈകളുടെ പ്രവൃത്തി
  rationale: ഒരാളുടെ പ്രവർത്തനത്തെയോ അധ്വാനത്തെയോ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യരൂപം നിലനിർത്തുന്നു; ലേവിയുടെ ശുശ്രൂഷയിലേക്കും പൊതുവായ പ്രവർത്തിയിലേക്കും ഉള്ള സാധ്യത തുറന്നുവയ്ക്കുന്നു.
- source_word: תִּרְצֶה
  choice: സ്വീകരിക്കണമേ
  rationale: അംഗീകരിക്കുക, പ്രസാദിക്കുക, അനുകൂലമായി സ്വീകരിക്കുക എന്നീ ആശയങ്ങൾ ഉൾക്കൊള്ളുന്ന ക്രിയയാണ്. പുരോഹിതശുശ്രൂഷയുടെ പശ്ചാത്തലത്തിൽ ‘സ്വീകരിക്കണമേ’ സ്വാഭാവികവും അമിതമായി വിശദീകരിക്കാത്തതുമാണ്.
- source_word: מְחַץ
  choice: തകർക്കണമേ
  rationale: അടിച്ചുതകർക്കുക, ചതയ്ക്കുക എന്ന ശക്തമായ കവിതാത്മക ക്രിയയുടെ തീവ്രത മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מָתְנַיִם
  choice: അരക്കെട്ട്
  rationale: ശക്തിയുടെ കേന്ദ്രത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ശരീരരൂപകം നിലനിർത്തുന്നു. ‘കടിപ്രദേശം’ കൂടുതൽ ശരീരശാസ്ത്രപരവും ‘ശക്തി’ മാത്രം നൽകുന്നത് രൂപകം ഇല്ലാതാക്കുന്നതുമായതിനാൽ ‘അരക്കെട്ട്’ തിരഞ്ഞെടുത്തു.
- source_word: קָמָיו
  choice: അവനെതിരെ എഴുന്നേൽക്കുന്നവർ
  rationale: קום എന്ന ‘എഴുന്നേൽക്കുക’ എന്ന ക്രിയയുടെ ദൃശ്യഭാവം ‘വൈരികൾ’ എന്ന അമൂർത്തപദത്തിലേക്ക് ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: וּמְשַׂנְאָיו
  choice: അവനെ വെറുക്കുന്നവർ
  rationale: പങ്കാളിക്രിയയുടെ നേരിട്ടുള്ള വ്യക്തിപരമായ വൈരഭാവം വ്യക്തമാക്കുന്നു; ‘ശത്രുക്കൾ’ എന്ന പൊതുപദത്തേക്കാൾ മൂലപാഠത്തോട് അടുത്തതാണ്.
- source_word: מִן יְקוּמוּן
  choice: അവർ വീണ്ടും എഴുന്നേൽക്കാതിരിക്കട്ടെ
  rationale: എബ്രായത്തിലെ സംക്ഷിപ്തവും അല്പം ദീർഘവിട്ടതുമായ ഘടന, മുൻപത്തെ ‘തകർക്കുക’ എന്ന അപേക്ഷയുടെ ഫലമായി ഇനി എഴുന്നേൽക്കാൻ കഴിയാതിരിക്കുക എന്ന അർഥത്തിൽ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ഏകവചന സർവനാമങ്ങളുടെ സൂചിതൻ
  choice: സമീപസന്ദർഭത്തിൽ അനുഗ്രഹിക്കപ്പെടുന്ന ലേവിയെ സൂചിപ്പിക്കുന്ന ഏകവചനം നിലനിർത്തുന്നു.
  alternative: പുരോഹിതശുശ്രൂഷകനെയോ ലേവിയുടെ പ്രതിനിധിയായ ശുശ്രൂഷയെയോ പൊതുവായി സൂചിപ്പിക്കുന്നതായി വായിക്കാം.
  rationale: ആവർത്തനം 33:8–11 ലേവിയെക്കുറിച്ചുള്ള അനുഗ്രഹമാണ്. അതിനാൽ മൂലപാഠത്തിലെ ഏകവചനം വ്യാഖ്യാനപരമായി വിപുലീകരിക്കാതെ നിലനിർത്തുന്നത് ഉചിതമാണ്.
- issue: മִן יְקוּמוּן എന്ന അവസാനവാക്യത്തിന്റെ ബന്ധം
  choice: വൈരികൾ തകർന്നതിനാൽ ‘വീണ്ടും എഴുന്നേൽക്കാതിരിക്കട്ടെ’ എന്ന ഫലാർഥത്തിൽ നൽകുന്നു.
  alternative: ‘എഴുന്നേൽക്കുന്നതിൽനിന്ന്’ അല്ലെങ്കിൽ ‘ഒരിക്കലും എഴുന്നേൽക്കാതിരിക്കട്ടെ’ എന്ന കൂടുതൽ അക്ഷരാർഥപരമോ ശക്തമോ ആയ രൂപങ്ങൾ.
  rationale: എബ്രായ ഘടന ദീർഘവിട്ടതാണ്; ‘വീണ്ടും’ എന്നത് സന്ദർഭത്തിൽ അന്തർനിഹിതമായ ഫലം വ്യക്തമാക്കുന്നു, എന്നാൽ പൂർണനാശം പോലുള്ള അധിക സിദ്ധാന്താർഥം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. പ്രാർഥനാത്മക കവിതാഭാവത്തിനായി ‘-ണമേ’ രൂപം നിലനിർത്തി. ‘അരക്കെട്ട്’ എന്ന ശരീരരൂപകം മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ച് അതിന്റെ സാംസ്കാരിക അർഥം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
