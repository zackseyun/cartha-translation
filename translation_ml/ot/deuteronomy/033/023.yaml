id: DEU.33.23
reference: Deuteronomy 33:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/לְ/נַפְתָּלִ֣י אָמַ֔ר נַפְתָּלִי֙ שְׂבַ֣ע רָצ֔וֹן וּ/מָלֵ֖א בִּרְכַּ֣ת יְהוָ֑ה יָ֥ם וְ/דָר֖וֹם יְרָֽשָׁ/ה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/023.yaml
  text: 'And of Naphtali he said: “Naphtali[a], satisfied with favor and full of the blessing of Yahweh, possess the sea and the south.”'
translation:
  language: ml
  text: 'നഫ്താലിയെക്കുറിച്ച് അവൻ പറഞ്ഞു:

    “നഫ്താലിയേ, പ്രീതിയാൽ സംതൃപ്തനും

    യഹ്‌വേയുടെ അനുഗ്രഹം നിറഞ്ഞവനുമായ നീ,

    കടലും[a] തെക്കും കൈവശമാക്കുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “പടിഞ്ഞാറും തെക്കും.” എബ്രായത്തിൽ “കടൽ” എന്ന പദം പടിഞ്ഞാറ് എന്ന ദിശയെയും സൂചിപ്പിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְנַפְתָּלִי
  choice: നഫ്താലിയെക്കുറിച്ച്
  rationale: לְ എന്ന ഉപസർഗം ഇവിടെ ഗോത്രത്തെ അഭിസംബോധന ചെയ്യുന്ന അനുഗ്രഹവാക്യം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘നഫ്താലിയെക്കുറിച്ച്’ എന്നത് സന്ദർഭവും സമാന്തരഘടനയും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: שְׂבַע רָצוֹן
  choice: പ്രീതിയാൽ സംതൃപ്തനും
  rationale: שְׂבַע എന്നത് നിറഞ്ഞ് തൃപ്തനായ അവസ്ഥയെയും רָצוֹן ഇവിടെ ലഭിച്ച പ്രീതി/അനുകൂലതയെയും സൂചിപ്പിക്കുന്നു. ‘പ്രീതി’ എന്നത് ദൈവിക കൃപ എന്ന പ്രത്യേക സാങ്കേതിക അർഥം നിർബന്ധിക്കാതെ മൂലപദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
- source_word: וּמָלֵא בִּרְכַּת יְהוָה
  choice: യഹ്‌വേയുടെ അനുഗ്രഹം നിറഞ്ഞവനുമായ
  rationale: മൂലത്തിലെ സമാന്തര വിശേഷണഘടന മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു; יהוה എന്ന വ്യക്തിനാമം ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: יָם
  choice: കടൽ
  rationale: പദത്തിന്റെ പ്രാഥമിക അർഥമായ ‘കടൽ’ മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു. പ്രദേശപരമായ സന്ദർഭത്തിൽ ‘പടിഞ്ഞാറ്’ എന്ന ദിശാസൂചനയ്ക്കുള്ള സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: וְדָרוֹם
  choice: തെക്കും
  rationale: דָרוֹם എന്ന പദത്തിന്റെ നേരിട്ടുള്ള ദിശാസൂചനയായ ‘തെക്ക്’ സമാന്തരരൂപത്തിൽ നൽകുന്നു.
- source_word: יְרָשָׁה
  choice: കൈവശമാക്കുക
  rationale: ירשׁ ഇവിടെ പ്രദേശം സ്വന്തമാക്കി അധീനതയിൽ വയ്ക്കുക എന്ന ആജ്ഞാ/അനുഗ്രഹഭാവം വഹിക്കുന്നു. ‘കൈവശമാക്കുക’ ആ സജീവമായ പ്രദേശാധികാര അർഥം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലവാചകത്തിൽ ദൈവത്തിന്റെ ചതുരക്ഷര വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ, ഒരു പദവിയാൽ പകരംവയ്ക്കാതെ ആധുനിക മലയാളത്തിൽ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: רָצוֹן എന്ന പദത്തിലെ ദൈവിക പ്രീതിയുടെ സ്വഭാവം
  choice: പ്രീതി
  alternative: കൃപ; പ്രസാദം; അനുകൂലത
  rationale: യഹ്‌വേയുടെ അനുഗ്രഹത്തോടുള്ള സമാന്തരത ദൈവിക പ്രീതിയെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, ‘കൃപ’ പോലുള്ള കൂടുതൽ സാങ്കേതിക ദൈവശാസ്ത്രപദം ഉപയോഗിച്ച് അർഥം ചുരുക്കാതെ ‘പ്രീതി’ എന്നു നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള അനുഗ്രഹശൈലി ഉപയോഗിച്ചു. കവിതാസമാന്തര്യം വരിവിഭജനത്തിലൂടെ സൂക്ഷിക്കുകയും, അസ്വാഭാവികമായ പദാനുപദഘടന ഒഴിവാക്കുകയും ചെയ്തു. ‘നഫ്താലിയേ’ എന്ന നേരിട്ടുള്ള അഭിസംബോധനയും ‘നീ’ എന്ന കർത്താവും മലയാളത്തിലെ വ്യക്തതയ്ക്കായി ഉപയോഗിച്ചു.
