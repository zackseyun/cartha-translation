translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളം. അനുഗ്രഹകാവ്യത്തിന്റെ സമാന്തരഘടന നിലനിർത്തിയിരിക്കുന്നു; മുൻവാക്യത്തിൽനിന്ന് തുടരുന്നതിനാൽ അവസാനത്തിൽ കോമ ചേർത്തിരിക്കുന്നു.
