  yaml_path: translation/ot/deuteronomy/033/014.yaml
  text: and with the choicest produce of the sun[a], and with the yield of the months[b],
translation:
  language: ml
  text: സൂര്യന്റെ വിശിഷ്ടമായ വിളവുകൊണ്ടും[a], മാസങ്ങളുടെ വിശിഷ്ടമായ വിളവുകൊണ്ടും[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സൂര്യന്റെ അമൂല്യമായ ദാനങ്ങൾകൊണ്ടും.”
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ “മാസങ്ങൾ.” ഈ പദം ചന്ദ്രനുമായി ബന്ധപ്പെട്ടതാണ്; മാസംതോറും ഉണ്ടാകുന്ന വിളവിനെയും ഇത് സൂചിപ്പിച്ചേക്കാം.
