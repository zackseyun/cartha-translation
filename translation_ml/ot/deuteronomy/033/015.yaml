  text: and from the choicest things of the ancient mountains[a], and from the abundance of the everlasting hills[b],
translation:
  language: ml
  text: പുരാതന പർവതങ്ങളിലെ ഏറ്റവും നല്ലതിൽനിന്നും[a], ശാശ്വത കുന്നുകളുടെ സമൃദ്ധിയിൽനിന്നും[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘പുരാതന പർവതങ്ങളുടെ ശിഖരത്തിൽനിന്നും.’ എബ്രായപ്രയോഗത്തെ സ്ഥലപരമായി (‘ശിഖരം/മുകൾഭാഗം’) അല്ലെങ്കിൽ ഗുണപരമായി (‘മുഖ്യമായത്/ഏറ്റവും നല്ലത്’) മനസ്സിലാക്കാം.
