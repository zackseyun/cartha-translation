  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവും കാവ്യാത്മകവുമായ ശൈലി. ആവർത്തിക്കുന്ന ‘-യിൽനിന്നും’ ഘടന എബ്രായ സമാന്തരത സംരക്ഷിക്കുന്നു. വാക്യം അടുത്തും മുമ്പുമുള്ള അനുഗ്രഹപ്പട്ടികയുടെ ഭാഗമായതിനാൽ അവസാനത്തിൽ കോമ ഉപയോഗിച്ചു.
