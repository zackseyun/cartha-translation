  to: 'സെബൂലൂനെക്കുറിച്ച് അവൻ പറഞ്ഞു:


    “സെബൂലൂനേ, നീ പുറപ്പെടുന്നതിൽ[a] ആനന്ദിക്കുക;

    യിസ്സാഖാരേ, നിന്റെ കൂടാരങ്ങളിൽ.”'
  rationale: 'The revision preserves the Hebrew’s compact poetic syntax: the one imperative ‘rejoice’ governs both tribal addresses. It removes the unneeded additive nuance in the second line and uses a more idiomatic Malayalam rendering of the Hebrew ‘going out,’ while preserving the lexical alternative in the footnote.'
