revisions:
- from: 'സെബൂലൂനെക്കുറിച്ച് അവൻ പറഞ്ഞു:


    “സെബൂലൂനേ, നിന്റെ പുറപ്പാടിൽ[a] ആനന്ദിക്കുക;

