source:
  edition: WLC
  text: וְ/לִ/זְבוּלֻ֣ן אָמַ֔ר שְׂמַ֥ח זְבוּלֻ֖ן בְּ/צֵאתֶ֑/ךָ וְ/יִשָּׂשכָ֖ר בְּ/אֹהָלֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/018.yaml
  text: And of Zebulun he said[a], “Rejoice, Zebulun, in your going out, and Issachar, in your tents.”
translation:
  language: ml
  text: 'സെബൂലൂനെക്കുറിച്ച് അവൻ പറഞ്ഞു:


    “സെബൂലൂനേ, നീ പുറപ്പെടുന്നതിൽ[a] ആനന്ദിക്കുക;

    യിസ്സാഖാരേ, നിന്റെ കൂടാരങ്ങളിൽ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നീ പുറപ്പെടുമ്പോൾ.” ഈ ഹീബ്രു പ്രയോഗം സെബൂലൂന്റെ പ്രവർത്തനരംഗത്തെയോ അഭിവൃദ്ധിരംഗത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/זְבוּלֻן
  choice: സെബൂലൂനെക്കുറിച്ച്
  rationale: ലְ ഇവിടെ അടുത്ത ഗോത്രത്തെ സംബന്ധിച്ച അനുഗ്രഹവചനം അവതരിപ്പിക്കുന്നു. ‘സെബൂലൂനെക്കുറിച്ച്’ എന്നത് ആ ബന്ധം സ്വാഭാവികവും വ്യക്തവുമായി അറിയിക്കുന്നു.
- source_word: אָמַר
  choice: അവൻ പറഞ്ഞു
  rationale: വചനത്തെ പരിചയപ്പെടുത്തുന്ന സാധാരണ ക്രിയാരൂപം; മോശെയാണ് കർത്താവെന്നത് മുൻസന്ദർഭത്തിൽനിന്ന് വ്യക്തമാകുന്നു.
- source_word: שְׂמַח
  choice: ആനന്ദിക്കുക
  rationale: ആജ്ഞാർഥത്തിന്റെ ആഹ്വാനസ്വഭാവവും അനുഗ്രഹവചനത്തിന്റെ ഗൗരവമുള്ള ഭാവവും നിലനിർത്തുന്നു.
- source_word: זְבוּלֻן
  choice: സെബൂലൂൻ
  rationale: ഗോത്രനാമം മലയാള ബൈബിൾ വായനയിൽ പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: בְּ/צֵאתֶךָ
  choice: നിന്റെ പുറപ്പാടിൽ
  rationale: בְ ചേർന്ന infinitive construct സൂചിപ്പിക്കുന്ന പ്രവർത്തനമേഖലയെയോ സാഹചര്യത്തെയോ തുറന്ന നിലയിൽ സൂക്ഷിക്കുകയും ‘കൂടാരങ്ങളിൽ’ എന്ന സമാന്തര പ്രയോഗത്തോട് ചേരുകയും ചെയ്യുന്നു.
- source_word: וְ/יִשָּׂשכָר
  choice: യിസ്സാഖാരേ
  rationale: രണ്ടാമത്തെ ഗോത്രത്തെയും നേരിട്ട് അഭിസംബോധന ചെയ്യുന്ന ഹീബ്രു ഘടന മലയാളത്തിൽ സംബോധനരൂപത്തിലാക്കി.
- source_word: בְּ/אֹהָלֶיךָ
  choice: നിന്റെ കൂടാരങ്ങളിലും
  rationale: ഹീബ്രുവിലെ ബഹുവചനമായ ‘കൂടാരങ്ങൾ’ എന്ന ദൃശ്യരൂപം നിലനിർത്തി; ‘-ഉം’ ആദ്യ പാദത്തോടുള്ള സമാന്തരത വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: രണ്ടാം പാദത്തിൽ שְׂמַח എന്ന ക്രിയ ആവർത്തിക്കാത്തത്
  choice: ‘ആനന്ദിക്കുക’ രണ്ടാം പാദത്തിലും ചേർത്തു
  alternative: ‘യിസ്സാഖാരേ, നിന്റെ കൂടാരങ്ങളിലും’ എന്ന ക്രിയാരഹിത സമാന്തരരൂപം
  rationale: ഹീബ്രുവിൽ ആദ്യ പാദത്തിലെ ആജ്ഞ രണ്ടാം പാദത്തിലും അർത്ഥപരമായി ബാധകമാണ്. മലയാളത്തിൽ വാക്യം വ്യക്തവും സ്വാഭാവികവുമാക്കാൻ ക്രിയ ആവർത്തിച്ചു; പുതിയ ദൈവശാസ്ത്രപരമായ അർത്ഥം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവവും വായനാസൗകര്യവും ചേർന്ന മലയാളം ഉപയോഗിച്ചു. ഗോത്രങ്ങളെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്ന കവിതാത്മക രൂപവും ‘പുറപ്പാട്/കൂടാരങ്ങൾ’ എന്ന ഹീബ്രു സമാന്തര ദൃശ്യവും നിലനിർത്തി.
