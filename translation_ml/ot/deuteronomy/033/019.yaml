id: DEU.33.19
reference: Deuteronomy 33:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: עַמִּים֙ הַר יִקְרָ֔אוּ שָׁ֖ם יִזְבְּח֣וּ זִבְחֵי צֶ֑דֶק כִּ֣י שֶׁ֤פַע יַמִּים֙ יִינָ֔קוּ וּ/שְׂפוּנֵ֖י טְמ֥וּנֵי חֽוֹל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/019.yaml
  text: They will call peoples to the mountain[a]; there they will sacrifice righteous sacrifices[c][b], for they will draw from the abundance of the seas and from the hidden treasures of the sand.
translation:
  language: ml
  text: 'ജനതകളെ അവർ പർവതത്തിലേക്കു വിളിക്കും[a];


    അവിടെ അവർ നീതിയുടെ യാഗങ്ങൾ അർപ്പിക്കും[b].


    സമുദ്രങ്ങളുടെ സമൃദ്ധിയിൽനിന്നും

    മണലിൽ ഒളിഞ്ഞുകിടക്കുന്ന നിധികളിൽനിന്നും[c]

    അവർ സമൃദ്ധി ആകർഷിച്ചെടുക്കും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഒരു പർവതത്തിലേക്കു ജനതകളെ അവർ വിളിക്കും’ എന്നും പരിഭാഷപ്പെടുത്താം. ഏത് പർവതമെന്ന് എബ്രായപാഠം വ്യക്തമാക്കുന്നില്ല.
    reason: alternative_reading
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘നീതിയുടെ യാഗങ്ങൾ’; ‘നീതിയോടെ അർപ്പിക്കുന്ന യാഗങ്ങൾ’ അല്ലെങ്കിൽ ‘ശരിയായ യാഗങ്ങൾ’ എന്നും മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: c
    text: ‘മണലിന്റെ മറഞ്ഞ വസ്തുക്കൾ’ അഥവാ ‘മണലിന്റെ മറഞ്ഞ സമ്പത്ത്’ എന്നും പരിഭാഷപ്പെടുത്താം. കടൽത്തീരത്തോടോ മണൽപ്രദേശങ്ങളോടോ ബന്ധപ്പെട്ട വിഭവങ്ങളായിരിക്കാം ഉദ്ദേശ്യം.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמִּים
  choice: ജനതകളെ
  rationale: ബഹുവചനമായ ഈ പദം വ്യക്തികളെയല്ല, വിവിധ ജനസമൂഹങ്ങളെ സൂചിപ്പിക്കുന്നു; ‘ജനതകൾ’ ആ കൂട്ടായ അർഥം നിലനിർത്തുന്നു.
- source_word: הַר
  choice: പർവതത്തിലേക്ക്
  rationale: എബ്രായ പാഠം പർവതത്തിന്റെ പേര് പറയുന്നില്ല. മലയാളത്തിലെ നിർദേശകപദമില്ലാത്ത ഈ പ്രയോഗം സന്ദർഭസൂചിതമായ പർവതം എന്ന അർഥവും അനിശ്ചിതമായ ഒരു പർവതം എന്ന സാധ്യതയും തുറന്നുവെക്കുന്നു.
- source_word: יִקְרָאוּ
  choice: വിളിക്കും
  rationale: ‘വിളിക്കുക’, ‘ക്ഷണിക്കുക’, ‘കൂട്ടിവരുത്തുക’ എന്നീ സാധ്യതകൾ ഉൾക്കൊള്ളുന്ന വിശാലവും സ്വാഭാവികവുമായ പദം.
- source_word: יִזְבְּחוּ
  choice: യാഗങ്ങൾ അർപ്പിക്കും
  rationale: യാഗാർപ്പണത്തെ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ ആരാധനാപരമായ പ്രത്യേകത മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: זִבְחֵי צֶדֶק
  choice: നീതിയുള്ള യാഗങ്ങൾ
  rationale: യാഗങ്ങൾ ശരിയായതോ നീതിയോടുകൂടിയതോ സ്വീകാര്യമായതോ എന്ന ഘടനാപരമായ അർഥവ്യാപ്തി പൂർണമായി ചുരുക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: שֶׁפַע יַמִּים
  choice: സമുദ്രങ്ങളുടെ സമൃദ്ധി
  rationale: കടലിൽനിന്നു ലഭിക്കുന്ന ആഹാരം, വിഭവം, വ്യാപാരലാഭം തുടങ്ങിയവയിൽ ഏതെങ്കിലും ഒന്ന് മാത്രമായി അർഥം പരിമിതപ്പെടുത്താതെ സമൃദ്ധിയുടെ വിശാലത നിലനിർത്തുന്നു.
- source_word: יִינָקוּ
  choice: നുകരും
  rationale: മൂലത്തിലെ ‘കുടിക്കുക/മുലകുടിക്കുക’ എന്ന ജീവന്തമായ രൂപകം മലയാളത്തിൽ അസ്വാഭാവികമാകാതെ നിലനിർത്തുകയും അതിൽനിന്നു ലഭ്യമാക്കുക, അനുഭവിക്കുക എന്ന ആശയം നൽകുകയും ചെയ്യുന്നു.
- source_word: וּשְׂפוּנֵי טְמֻנֵי חוֹל
  choice: മണലിൽ മറഞ്ഞുകിടക്കുന്ന നിക്ഷേപങ്ങളും
  rationale: ഒളിപ്പിച്ചുവെച്ചതോ മൂടിക്കിടക്കുന്നതോ ആയ മണലുമായി ബന്ധപ്പെട്ട വിഭവങ്ങളെ കവിതാത്മകമായി സൂചിപ്പിക്കുന്നു; പ്രത്യേക ധാതുവോ ഉൽപ്പന്നമോ നിർബന്ധിച്ച് ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ‘നീതിയുള്ള യാഗങ്ങൾ’ എന്നതിന്റെ സ്വഭാവം
  choice: യാഗങ്ങളുടെ നീതിയുക്തതയെയോ ശരിയായ സ്വഭാവത്തെയോ പൊതുവായി സൂചിപ്പിക്കുന്ന പ്രയോഗം
  alternative: നീതിയോടെ അർപ്പിക്കുന്ന യാഗങ്ങൾ; ദൈവത്തിനു സ്വീകാര്യമായ യാഗങ്ങൾ
  rationale: צֶדֶק എന്ന പദം യാഗങ്ങളുടെ സ്വഭാവത്തെയോ അവ അർപ്പിക്കുന്ന രീതിയെയോ സൂചിപ്പിക്കാം. വിവർത്തനം പിൽക്കാല സിദ്ധാന്തവിഭാഗങ്ങൾ ചേർക്കാതെ ആ സംഘർഷം നിലനിർത്തുന്നു.
- issue: പർവതത്തിന്റെ തിരിച്ചറിയൽ
  choice: പേര് പറയാതെ ‘പർവതം’ എന്നു മാത്രം
  alternative: സീയോൻ പർവതം; ഒരു പർവതവിശുദ്ധസ്ഥലം; ഗോത്രപ്രദേശത്തെ പർവതം
  rationale: മൂലപാഠം ഏത് പർവതമെന്ന് വ്യക്തമാക്കാത്തതിനാൽ ഒരു പ്രത്യേക വിശുദ്ധസ്ഥലമായി തിരിച്ചറിയുന്നത് അതിവ്യാഖ്യാനമാകും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ കാവ്യഭാഷ ഉപയോഗിച്ചു. സമാന്തരവാക്യഘടനയും അവസാനത്തെ ‘നുകരും’ എന്ന രൂപകവും നിലനിർത്തി. ‘പർവതം’, ‘നീതിയുള്ള യാഗങ്ങൾ’, ‘മറഞ്ഞുകിടക്കുന്ന നിക്ഷേപങ്ങൾ’ എന്നിവയിൽ മൂലപാഠത്തിലെ അവ്യക്തത വിശദീകരണക്കുറിപ്പുകളോടെ സംരക്ഷിച്ചു.
