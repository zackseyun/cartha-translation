id: DEU.33.27
reference: Deuteronomy 33:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: מְעֹנָה֙ אֱלֹ֣הֵי קֶ֔דֶם וּ/מִ/תַּ֖חַת זְרֹעֹ֣ת עוֹלָ֑ם וַ/יְגָ֧רֶשׁ מִ/פָּנֶ֛י/ךָ אוֹיֵ֖ב וַ/יֹּ֥אמֶר הַשְׁמֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/027.yaml
  text: The God of old is a dwelling place[a], and underneath are everlasting arms. He drove out the enemy before you, and said, ‘Destroy!’
translation:
  language: ml
  text: പണ്ടുമുതലുള്ള ദൈവം വാസസ്ഥലമാണ്[a]; താഴെ നിത്യമായ ഭുജങ്ങളുണ്ട്. അവിടന്ന് നിന്റെ മുമ്പിൽനിന്ന് ശത്രുവിനെ ഓടിച്ചുകളഞ്ഞു; ‘നശിപ്പിക്കുക!’ എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “നിത്യനായ ദൈവം നിന്റെ അഭയസ്ഥാനമാണ്.” എബ്രായ വാക്യം പരമ്പരാഗതമായി ആ അർഥത്തിൽ വ്യാഖ്യാനിക്കാവുന്നതാണ്; എന്നാൽ കൂടുതൽ നേരിട്ടുള്ള പ്രയോഗം “പണ്ടുമുതലുള്ള ദൈവം വാസസ്ഥലമാണ്” എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: מְעֹנָה
  choice: വാസസ്ഥലം
  rationale: ഒരു പാർപ്പിടത്തെയോ അഭയമേകുന്ന ഇടത്തെയോ സൂചിപ്പിക്കുന്ന നാമം. ‘വാസസ്ഥലം’ എന്നത് മൂലരൂപകം നിലനിർത്തുന്നു; ‘അഭയസ്ഥാനം’ എന്ന സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: אֱלֹהֵי קֶדֶם
  choice: പുരാതനകാലംമുതലുള്ള ദൈവം
  rationale: קֶדֶם ഇവിടെ പ്രാചീനകാലത്തെയോ പണ്ടുമുതലുള്ള നിലനിൽപ്പിനെയോ സൂചിപ്പിക്കുന്നു. ഈ പ്രയോഗം ‘പുരാതന ദൈവം’ എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കിക്കൊണ്ട് കാലസംബന്ധമായ അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: וּמִתַּחַת
  choice: താഴെ
  rationale: സ്ഥലസംബന്ധമായ കാവ്യചിത്രം ലളിതവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: זְרֹעֹת עוֹלָם
  choice: നിത്യമായ ഭുജങ്ങൾ
  rationale: ‘ഭുജങ്ങൾ’ ശക്തിയുടെയും താങ്ങിന്റെയും രൂപകം നിലനിർത്തുന്നു; עוֹלָם ദീർഘമായി നിലനിൽക്കുന്ന, നിത്യമായ സ്വഭാവം സൂചിപ്പിക്കുന്നു.
- source_word: וַיְגָרֶשׁ
  choice: ഓടിച്ചുകളഞ്ഞ്
  rationale: גרש എന്ന ക്രിയയുടെ പുറത്താക്കുക, ഓടിച്ചുകളയുക എന്ന ശക്തമായ സൈനികസന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מִפָּנֶיךָ
  choice: നിന്റെ മുമ്പിൽനിന്ന്
  rationale: അക്ഷരാർഥത്തോടടുത്ത രൂപം നിലനിർത്തുകയും ഇസ്രായേലിന്റെ മുമ്പിൽനിന്ന് ശത്രുവിനെ നീക്കിയെന്ന സന്ദർഭം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: אוֹיֵב
  choice: ശത്രുവിനെ
  rationale: എബ്രായത്തിലെ ഏകവചനരൂപം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇതിന് സമൂഹവാചകമായ അർഥവും ഉണ്ടാകാം.
- source_word: וַיֹּאמֶר
  choice: എന്നു പറഞ്ഞു
  rationale: മുൻവാക്യത്തിലെ ദൈവത്തെയാണ് കർത്താവായി സ്വാഭാവികമായി തുടരുന്നത്.
- source_word: הַשְׁמֵד
  choice: നശിപ്പിക്കുക!
  rationale: പൂർണനാശത്തിന് ആഹ്വാനം ചെയ്യുന്ന ഹിഫീൽ ആജ്ഞാരൂപത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; മൂലപദത്തിൽ ഇല്ലാത്ത അധികവിശദീകരണം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: אֱלֹהֵי קֶדֶם എന്നതിലെ קֶדֶם ‘പുരാതനകാലംമുതലുള്ള’ എന്നോ ‘നിത്യനായ’ എന്നോ പരിഭാഷപ്പെടുത്തണമോ
  choice: പുരാതനകാലംമുതലുള്ള ദൈവം
  alternative: നിത്യനായ ദൈവം നിന്റെ അഭയസ്ഥാനം
  rationale: קֶדֶם നേരിട്ട് പുരാതനകാലത്തെയോ പണ്ടുമുതലുള്ളതിനെയോ സൂചിപ്പിക്കുന്നു. ‘നിത്യനായ ദൈവം’ എന്ന പരമ്പരാഗത വ്യാഖ്യാനം സന്ദർഭത്തിൽ സാധുവായതിനാൽ അത് അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു; എന്നാൽ പ്രധാനപാഠത്തിൽ മൂലഭാഷയുടെ കാലസൂചന സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കാവ്യശൈലി. ദൈവത്തെ സൂചിപ്പിക്കാൻ ആദരസൂചകമായ ‘അവിടന്ന്’ ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ സംക്ഷിപ്തതയും രൂപകങ്ങളും നിലനിർത്തി; പരമ്പരാഗതമായ വ്യത്യസ്ത വായന അടിക്കുറിപ്പിൽ ചേർത്തു.
