revisions:
- from: പുരാതനകാലംമുതലുള്ള ദൈവം വാസസ്ഥലമാണ്[a]; താഴെ നിത്യമായ ഭുജങ്ങളുണ്ട്. അവിടന്ന് നിന്റെ മുമ്പിൽനിന്ന് ശത്രുവിനെ ഓടിച്ചുകളഞ്ഞ്, ‘നശിപ്പിക്കുക!’ എന്നു പറഞ്ഞു.
  to: പണ്ടുമുതലുള്ള ദൈവം വാസസ്ഥലമാണ്[a]; താഴെ നിത്യമായ ഭുജങ്ങളുണ്ട്. അവിടന്ന് നിന്റെ മുമ്പിൽനിന്ന് ശത്രുവിനെ ഓടിച്ചുകളഞ്ഞു; ‘നശിപ്പിക്കുക!’ എന്നു പറഞ്ഞു.
