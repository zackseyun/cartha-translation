- from: 'യോസേഫിനെക്കുറിച്ച് അവൻ പറഞ്ഞു:

    “യഹോവയാൽ അനുഗ്രഹിക്കപ്പെട്ടതാകട്ടെ അവന്റെ ദേശം—

