reference: Deuteronomy 33:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/לְ/יוֹסֵ֣ף אָמַ֔ר מְבֹרֶ֥כֶת יְהֹוָ֖ה אַרְצ֑/וֹ מִ/מֶּ֤גֶד שָׁמַ֨יִם֙ מִ/טָּ֔ל וּ/מִ/תְּה֖וֹם רֹבֶ֥צֶת תָּֽחַת׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/013.yaml
  text: And of Joseph he said[a], “Blessed by Yahweh be his land, with the choicest things of heaven, with dew[b], and from the deep lying beneath,”
translation:
  language: ml
  text: 'യോസേഫിനെക്കുറിച്ച് അവൻ പറഞ്ഞു:


    “യഹോവയാൽ അനുഗ്രഹിക്കപ്പെടട്ടെ അവന്റെ ദേശം—


    ആകാശത്തിലെ ഉത്തമവസ്തുക്കളാലും[a] മഞ്ഞുകൊണ്ടും,


    താഴെ കിടക്കുന്ന ആഴജലത്താലും[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ആകാശത്തിലെ വിലയേറിയ വസ്തുക്കളിൽനിന്നും.”
    reason: lexical_alternative
  - marker: b
    text: “ആഴജലം” എന്നത് ദേശത്തിനടിയിലുള്ള ഭൂഗർഭജലത്തെ സൂചിപ്പിക്കുന്നതാകാം.
    reason: cultural_note
lexical_decisions:
- source_word: וּלְיוֹסֵף אָמַר
  choice: യോസേഫിനെക്കുറിച്ച് അവൻ പറഞ്ഞു
  rationale: ലְ എന്ന ഉപസർഗം ഗോത്രാനുഗ്രഹത്തിന്റെ ആമുഖത്തിൽ ‘കുറിച്ച്’ എന്ന അർഥത്തിൽ സ്വാഭാവികമായി വരുന്നു; אָמַר എന്നതിന്റെ ലളിതമായ നേരിട്ടുള്ള വിവർത്തനം ‘പറഞ്ഞു’ എന്നാണ്.
- source_word: מְבֹרֶכֶת יְהוָה אַרְצוֹ
  choice: യഹോവയാൽ അനുഗ്രഹിക്കപ്പെട്ടതാകട്ടെ അവന്റെ ദേശം
  rationale: സ്ത്രീലിംഗ കർമണി കൃദന്തമായ מְבֹרֶכֶת അനുഗ്രഹാശംസയുടെ ഭാവത്തിൽ അവതരിപ്പിച്ചു. ദൈവനാമമായ יהוה ശീർഷകമാക്കി മാറ്റാതെ ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: מִמֶּגֶד שָׁמַיִם
  choice: ആകാശത്തിന്റെ വിശിഷ്ടസമ്പത്തുകൊണ്ടും
  rationale: מֶגֶד വിലയേറിയതും ഉത്തമവുമായ വിളവിനെയോ സമൃദ്ധിയെയോ സൂചിപ്പിക്കുന്നു. ‘വിശിഷ്ടസമ്പത്ത്’ അതിന്റെ മൂല്യവും സമൃദ്ധിയും അനാവശ്യമായി പ്രത്യേക വസ്തുക്കളാക്കി ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: מִטָּל
  choice: മഞ്ഞുകൊണ്ടും
  rationale: കാർഷികസന്ദർഭത്തിൽ טַל രാത്രിയിൽ രൂപപ്പെടുന്ന മഞ്ഞാണ്; ആവർത്തിക്കുന്ന מן ഘടന മലയാളത്തിൽ കരണാർഥകമായ ‘കൊണ്ടും’ കൊണ്ട് സ്വാഭാവികമാക്കി.
- source_word: וּמִתְּהוֹם רֹבֶצֶת תָּחַת
  choice: അടിയിൽ കിടക്കുന്ന ആഴിയിലെ ജലത്താലും
  rationale: תְּהוֹם ആഴമുള്ള ജലസമൂഹത്തെ സൂചിപ്പിക്കുന്നു; רֹבֶצֶת תָּחַת എന്ന ദൃശ്യബിംബം ‘അടിയിൽ കിടക്കുന്ന’ എന്നു നിലനിർത്തി. മലയാളത്തിൽ ‘ആഴി’ മാത്രം കടലായി തെറ്റിദ്ധരിക്കപ്പെടാതിരിക്കാൻ ‘ജലം’ വ്യക്തമാക്കി.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ ചതുരക്ഷരി നേരിട്ട് വരുന്നതിനാൽ അതിനെ ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു പകരാതെ മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- issue: תְּהוֹם എന്നതിന്റെ അർഥം
  choice: ആഴിയിലെ ജലം
  alternative: അഗാധം / പാതാളം
  rationale: ഇവിടെ ദേശത്തെ ഫലഭൂയിഷ്ഠമാക്കുന്ന അനുഗ്രഹങ്ങളുടെ പട്ടികയിലാണ് ഈ പദം; അതിനാൽ ദുഷ്ടാത്മീയ ലോകമോ മരണലോകമോ എന്ന ആശയം ഇറക്കുമതി ചെയ്യാതെ ആഴത്തിലുള്ള ജലസ്രോതസ്സെന്ന അർഥം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ മലയാളം; കവിതാത്മക അനുഗ്രഹത്തിന്റെ വരിവിന്യാസവും മൂലപാഠത്തിലെ കാർഷിക-ജലസമൃദ്ധിയുടെ ദൃശ്യങ്ങളും സംരക്ഷിച്ചു. നൽകിയ ഇംഗ്ലീഷ് അടിക്കുറിപ്പുകളിൽ [a] തെറ്റായ സ്ഥാനത്തോ ഉള്ളടക്കത്തോടോ ചേർന്നതായി തോന്നുന്നതിനാൽ, മൂലഭാഷാ തെളിവിനെ ആശ്രയിച്ച് ആവശ്യമായ ഒരേയൊരു അടിക്കുറിപ്പ് תְּהוֹם എന്ന പദത്തിൽ ചേർത്തു.
