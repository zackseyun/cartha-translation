revisions:
- from: 'അവന്റെ കടിഞ്ഞൂൽ കാളയ്ക്കു തേജസ്സുണ്ട്;

    അതിന്റെ കൊമ്പുകൾ കാട്ടുകാളയുടെ കൊമ്പുകൾപോലെയാണ്.[a]

    അവകൊണ്ട് അവൻ ജനതകളെ ഒന്നാകെ

