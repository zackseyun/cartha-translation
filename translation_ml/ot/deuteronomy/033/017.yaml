id: DEU.33.17
reference: Deuteronomy 33:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בְּכ֨וֹר שׁוֹר֜/וֹ הָדָ֣ר ל֗/וֹ וְ/קַרְנֵ֤י רְאֵם֙ קַרְנָ֔י/ו בָּ/הֶ֗ם עַמִּ֛ים יְנַגַּ֥ח יַחְדָּ֖ו אַפְסֵי אָ֑רֶץ וְ/הֵם֙ רִבְב֣וֹת אֶפְרַ֔יִם וְ/הֵ֖ם אַלְפֵ֥י מְנַשֶּֽׁה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/017.yaml
  text: His firstborn bull has majesty[a], and his horns are the horns of a wild ox; with them he will gore peoples together to the ends of the earth. These are the myriads of Ephraim[b], and these are the thousands of Manasseh.
translation:
  language: ml
  text: 'അവന്റെ കടിഞ്ഞൂൽ കാളയ്ക്കു തേജസ്സുണ്ട്;

    അതിന്റെ കൊമ്പുകൾ കാട്ടുകാളയുടെ കൊമ്പുകൾപോലെയാണ്.[a]

    അവകൊണ്ട് അവൻ ജനതകളെ ഒരുമിച്ച്

    ഭൂമിയുടെ അറ്റങ്ങൾവരെ കുത്തും.

    അവ എഫ്രയീമിന്റെ പതിനായിരങ്ങളാണ്;[b]

    അവ മനശ്ശെയുടെ ആയിരങ്ങളാണ്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വന്യകാളയുടെ കൊമ്പുകൾ’ എന്നും വിവർത്തനം ചെയ്യാം. എബ്രായത്തിലെ רְאֵם ശക്തിയേറിയ ഒരു വന്യ ഗോവർഗമൃഗത്തെ സൂചിപ്പിക്കുന്നതായിരിക്കാം; പഴയ ചില വിവർത്തനങ്ങളിൽ കാണുന്ന ‘ഏകശൃംഗി’ എന്ന അർഥം സാധ്യത കുറഞ്ഞതാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘എഫ്രയീമിന്റെ അസംഖ്യർ’ എന്നും വിവർത്തനം ചെയ്യാം. എബ്രായത്തിലെ רִבְבוֹת വളരെ വലിയ സംഖ്യയെ സൂചിപ്പിക്കുന്നു; ഇവിടെ അത് ‘മനശ്ശെയുടെ ആയിരങ്ങൾ’ എന്നതിനോടു സംഖ്യാപരമായി താരതമ്യപ്പെടുത്തപ്പെട്ടിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכוֹר שׁוֹרוֹ
  choice: അവന്റെ കടിഞ്ഞൂൽ കാള
  rationale: בְּכוֹר എന്നത് ആദ്യജാത സന്തതിയെയും שׁוֹר ആൺകന്നുകാലിയെയും സൂചിപ്പിക്കുന്നു. കൊമ്പുകളുടെ തുടർന്നുള്ള ദൃശ്യവുമായി ചേരുന്നതിനാൽ ‘കാള’ എന്നും, രൂപകത്തിന്റെ ശക്തി നിലനിർത്താൻ ‘കടിഞ്ഞൂൽ’ എന്നും വിവർത്തനം ചെയ്തു.
- source_word: הָדָר לוֹ
  choice: തേജസ്സുണ്ട്
  rationale: הָדָר എന്ന നാമപദത്തിന് തേജസ്സ്, പ്രഭാവം, മഹത്ത്വം എന്നീ അർഥങ്ങളുണ്ട്. എബ്രായത്തിലെ ക്രിയാരഹിത വാക്യത്തിന്റെ നാമപദസ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: קַרְנֵי רְאֵם
  choice: കാട്ടുകാളയുടെ കൊമ്പുകൾ
  rationale: רְאֵם ശക്തിയേറിയ ഒരു വന്യ ഗോവർഗമൃഗത്തെ സൂചിപ്പിക്കുന്നതായി കരുതപ്പെടുന്നു. ഏകശൃംഗി എന്ന പരമ്പരാഗത ധാരണ ഒഴിവാക്കി, സാധാരണ വായനക്കാർക്കു വ്യക്തമായ ‘കാട്ടുകാള’ തെരഞ്ഞെടുത്തു.
- source_word: יְנַגַּח
  choice: കുത്തിവീഴ്ത്തും
  rationale: കൊമ്പുള്ള മൃഗം ഇടിക്കുകയോ കുത്തുകയോ ചെയ്യുന്നതാണ് נָגַח. ‘കുത്തിവീഴ്ത്തും’ എന്നത് കൊമ്പുകളുടെ മൂർത്തമായ ചിത്രവും ആക്രമണത്തിന്റെ ഫലവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: עַמִּים יַחְדָּו אַפְסֵי אָרֶץ
  choice: ജനതകളെ ഒന്നാകെ ഭൂമിയുടെ അറ്റങ്ങളോളം
  rationale: עַמִּים എന്ന ബഹുവചനം ‘ജനതകൾ’ എന്നും יַחְדָּו കൂട്ടായ വ്യാപ്തി സൂചിപ്പിക്കുന്നതിനാൽ ‘ഒന്നാകെ’ എന്നും നൽകി. אַפְסֵי אָרֶץ എന്ന കാവ്യപ്രയോഗത്തിന്റെ വിശാലമായ ഭൂമിശാസ്ത്രവ്യാപ്തി ‘ഭൂമിയുടെ അറ്റങ്ങളോളം’ എന്നു നിലനിർത്തി.
- source_word: רִבְבוֹת
  choice: പതിനായിരങ്ങൾ
  rationale: ഈ പദം പതിനായിരങ്ങളുടെ അളവിനെയോ അതിവലിയ സംഖ്യയെയോ സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള ‘ആയിരങ്ങൾ’ എന്നതിനോടുള്ള സംഖ്യാപരമായ സമാന്തര്യം വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: אַלְפֵי
  choice: ആയിരങ്ങൾ
  rationale: אֶלֶף ചില സന്ദർഭങ്ങളിൽ ഗോത്രവിഭാഗത്തെ സൂചിപ്പിക്കാമെങ്കിലും, ഇവിടെ רִבְבוֹת എന്ന പദത്തോടുള്ള സമാന്തര്യം സംഖ്യാപരമായ അർഥത്തെ ശക്തമായി പിന്തുണയ്ക്കുന്നു.
- source_word: אֶפְרַיִם / מְנַשֶּׁה
  choice: എഫ്രയീം / മനശ്ശെ
  rationale: ഹീബ്രു ഗോത്രനാമങ്ങളുടെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപങ്ങൾ ഉപയോഗിച്ചു.
theological_decisions:
- issue: യോസേഫിന്റെ അനുഗ്രഹത്തിലെ കാളയുടെ രൂപകം ആരെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നു
  choice: ആരെയാണ് പ്രത്യേകം സൂചിപ്പിക്കുന്നതെന്ന് മുഖ്യപാഠത്തിൽ നിർണയിക്കാതെ, യോസേഫിന്റെ ശക്തിയെക്കുറിച്ചുള്ള രൂപകമായി നിലനിർത്തി; അവസാന വരികൾ അതിനെ എഫ്രയീമിനോടും മനശ്ശെയോടും ബന്ധിപ്പിക്കുന്നു.
  alternative: ‘കടിഞ്ഞൂൽ കാള’ എഫ്രയീമിനെ, യോസേഫിന്റെ സന്തതികളിൽ പ്രാമുഖ്യമുള്ളവനായി, പ്രത്യേകമായി സൂചിപ്പിക്കുന്നതായി വ്യാഖ്യാനിക്കാം.
  rationale: ഹീബ്രു പാഠം യോസേഫിനെ അഭിസംബോധന ചെയ്യുന്ന അനുഗ്രഹത്തിന്റെ പശ്ചാത്തലത്തിൽ ഈ ചിത്രം അവതരിപ്പിക്കുകയും അവസാനം എഫ്രയീമിനെയും മനശ്ശെയെയും തിരിച്ചറിയിക്കുകയും ചെയ്യുന്നു. വിവർത്തനം ഈ ബന്ധം നിലനിർത്തുന്നു; എന്നാൽ രൂപകത്തിന്റെ കൃത്യമായ ഏകവചന സൂചകം നിർബന്ധിച്ച് തീരുമാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കാവ്യഭാഷ ഉപയോഗിച്ചു. അപരിചിതമായ സാങ്കേതിക പദങ്ങൾ ഒഴിവാക്കി; എങ്കിലും ‘കടിഞ്ഞൂൽ’, ‘തേജസ്സ്’, ‘ഭൂമിയുടെ അറ്റങ്ങളോളം’ എന്നീ പദപ്രയോഗങ്ങളിലൂടെ അനുഗ്രഹവചനത്തിന്റെ ഉയർന്ന ശൈലിയും മൃഗരൂപകത്തിന്റെ ശക്തിയും സംരക്ഷിച്ചു.
