  yaml_path: translation/ot/deuteronomy/033/024.yaml
  text: 'And of Asher he said: “Most blessed of sons is Asher[a]; may he be favored by his brothers[c][b], and may he dip his foot in oil.”'
translation:
  language: ml
  text: 'ആശേരിനെക്കുറിച്ച് അവൻ പറഞ്ഞു:


    “പുത്രന്മാരിൽ ഏറ്റവും അനുഗ്രഹിക്കപ്പെട്ടവൻ ആശേർ[a];


    അവൻ തന്റെ സഹോദരന്മാർക്ക് പ്രിയങ്കരനായിരിക്കട്ടെ[b];


    തന്റെ കാൽ എണ്ണയിൽ മുക്കട്ടെ[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “പുത്രന്മാരെക്കാൾ അനുഗ്രഹിക്കപ്പെട്ടവൻ ആശേർ.” എബ്രായ താരതമ്യപ്രയോഗം താരതമ്യമായോ അതിശ്രേഷ്ഠതാർഥമായോ മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “അവന്റെ സഹോദരന്മാർ” എന്നത് യാക്കോബിൽനിന്ന് ഉത്ഭവിച്ച ഇസ്രായേലിലെ മറ്റു ഗോത്രങ്ങളെ സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: cultural_note
  - marker: c
    text: “കാൽ എണ്ണയിൽ മുക്കുക” എന്ന ബിംബം സമൃദ്ധിയെയോ അഭിവൃദ്ധിയെയോ സൂചിപ്പിക്കുന്നതായിരിക്കാം; എന്നാൽ എബ്രായത്തിലെ അക്ഷരാർഥബിംബം മുഖ്യപാഠത്തിൽ നിലനിർത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאָשֵׁר אָמַר
  choice: ആശേരിനെക്കുറിച്ച് അവൻ പറഞ്ഞു
  rationale: ലְ എന്ന ഉപസർഗം അടുത്ത ഗോത്രത്തിനുള്ള അനുഗ്രഹവചനം അവതരിപ്പിക്കുന്നു. ‘ആശേരിനെക്കുറിച്ച്’ എന്നത് ഈ സന്ദർഭത്തിൽ സ്വാഭാവികവും പ്രസംഗഘടന വ്യക്തമാക്കുന്നതുമാണ്.
- source_word: בָּרוּךְ מִבָּנִים אָשֵׁר
  choice: പുത്രന്മാരിൽ ഏറ്റവും അനുഗൃഹീതൻ ആശേർ
  rationale: מִן ചേർന്ന ഈ പ്രയോഗത്തിന് താരതമ്യപരമോ അതിശയോക്തിപരമോ ആയ അർഥം വരാം. മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായ അതിശയോക്തിരൂപം സ്വീകരിക്കുകയും മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്തു.
- source_word: יְהִי רְצוּי אֶחָיו
  choice: അവൻ തന്റെ സഹോദരന്മാർക്ക് പ്രിയങ്കരനായിരിക്കട്ടെ
  rationale: അനുഗ്രഹസന്ദർഭത്തിലെ יְהִי ആശംസാപരമായി വിവർത്തനം ചെയ്തു. רְצוּי എന്നത് സ്വീകരിക്കപ്പെടുകയും പ്രീതി ലഭിക്കുകയും ചെയ്യുന്നവൻ എന്ന ബന്ധപരമായ ആശയം ഇവിടെ നൽകുന്നു.
- source_word: וְטֹבֵל בַּשֶּׁמֶן רַגְלוֹ
  choice: തന്റെ കാൽ എണ്ണയിൽ മുക്കട്ടെ
  rationale: സമൃദ്ധിയെ സൂചിപ്പിച്ചേക്കാവുന്ന ദൃശ്യരൂപം വ്യാഖ്യാനിച്ച് മാറ്റാതെ അക്ഷരാർഥത്തിലുള്ള കാവ്യബിംബമായി നിലനിർത്തി. ഏകവചനമായ רַגְלוֹ അനുസരിച്ച് ‘കാൽ’ എന്നു നൽകി.
theological_decisions:
- issue: ‘കാൽ എണ്ണയിൽ മുക്കുക’ എന്ന അനുഗ്രഹബിംബത്തിന്റെ വ്യാഖ്യാനം
  choice: മുഖ്യപാഠത്തിൽ ബിംബം അക്ഷരാർഥത്തിൽ നിലനിർത്തുക
  alternative: ഒലിവെണ്ണയുടെ കാർഷികസമൃദ്ധിയെയോ പൊതുവായ ഐശ്വര്യത്തെയോ നേരിട്ട് സൂചിപ്പിക്കുന്നതായി വ്യാഖ്യാനിക്കുക
  rationale: എബ്രായ ബിംബം സമൃദ്ധിയെയോ അഭിവൃദ്ധിയെയോ സൂചിപ്പിച്ചേക്കാം, എങ്കിലും അതിന്റെ കൃത്യമായ ഉദ്ദേശ്യം വ്യക്തമല്ല. അതിനാൽ കാവ്യപരവും ദൈവശാസ്ത്രപരവുമായ തുറന്ന നില സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ അനുഗ്രഹശൈലി ഉപയോഗിച്ചു. കവിതാസമാന്തര്യം നിലനിർത്താൻ വാക്യം മൂന്ന് വരികളാക്കി; അപരിചിതമായ ബിംബം വിശദീകരിച്ച് മുഖ്യപാഠത്തിൽ ലയിപ്പിക്കാതെ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
