source:
  edition: WLC
  text: וַ/יֹּאמַ֗ר יְהוָ֞ה מִ/סִּינַ֥י בָּא֙ וְ/זָרַ֤ח מִ/שֵּׂעִיר֙ לָ֔/מוֹ הוֹפִ֨יעַ֙ מֵ/הַ֣ר פָּארָ֔ן וְ/אָתָ֖ה מֵ/רִבְבֹ֣ת קֹ֑דֶשׁ מִֽ/ימִינ֕/וֹ אשדת לָֽ/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/002.yaml
  text: 'And he said: “Yahweh came from Sinai and dawned from Seir upon them[a]; he shone forth from Mount Paran, and came from myriads of holiness[b]; from his right hand came a fiery law for them.”'
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു:


    “യഹ്‌വെ സീനായിൽനിന്നു വന്നു;


    സേയീരിൽനിന്ന് അവരുടെമേൽ ഉദിച്ചുയർന്നു.


    പാരാൻ പർവതത്തിൽനിന്ന് അവൻ തേജസ്സോടെ പ്രകാശിച്ചു;


    വിശുദ്ധിയുടെ അനേകം പതിനായിരങ്ങളിൽനിന്ന് അവൻ വന്നു[a].


    അവന്റെ വലങ്കയ്യിൽനിന്ന് അവർക്കായി


    അഗ്നിമയമായ ന്യായപ്രമാണം പുറപ്പെട്ടു[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വിശുദ്ധരായ സ്വർഗീയ അനുചരന്മാരുടെ അനേകം പതിനായിരങ്ങളിൽനിന്ന്.” ഇവിടെ എബ്രായപ്രയോഗം അമൂർത്തമായ വിശുദ്ധിയെയോ വിശുദ്ധരായ സ്വർഗീയ അനുചരന്മാരെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
  - marker: b
    text: ഇവിടെയുള്ള എബ്രായപദരൂപം ദുഷ്കരവും അർഥം അനിശ്ചിതവുമാണ്. പരമ്പരാഗതമായി “അഗ്നിമയമായ ന്യായപ്രമാണം” എന്നു പരിഭാഷപ്പെടുത്തുന്നു; “അവന്റെ വലങ്കയ്യിൽനിന്നുള്ള അഗ്നിജ്വാലകൾ” എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ശബ്ദാന്തരണം ചെയ്തു.
- source_word: וְזָרַח מִשֵּׂעִיר לָמוֹ
  choice: അവരുടെമേൽ സേയീരിൽനിന്ന് ഉദിച്ചുയർന്നു
  rationale: זרח എന്ന ക്രിയയിലെ സൂര്യോദയത്തിന്റെയും പ്രകാശത്തിന്റെയും കാവ്യചിത്രം ‘ഉദിച്ചുയർന്നു’ നിലനിർത്തുന്നു; לָמוֹ ഇവിടെ പ്രകാശം ജനത്തിന്മേൽ പതിക്കുന്നതായി സ്വാഭാവികമായി വായിച്ചു.
- source_word: הוֹפִיעַ
  choice: തേജസ്സോടെ പ്രകാശിച്ചു
  rationale: ഹിഫിൽ രൂപത്തിന്റെ ദീപ്തമായി പ്രത്യക്ഷപ്പെടുക/പ്രകാശിക്കുക എന്ന അർഥവ്യാപ്തി സ്വാഭാവിക മലയാളത്തിൽ സൂക്ഷിക്കുന്നു.
- source_word: מֵרִבְבֹת קֹדֶשׁ
  choice: വിശുദ്ധിയുടെ പതിനായിരങ്ങളിൽനിന്ന്
  rationale: רבבות എന്ന ബഹുവചനത്തിന്റെ വിപുലസംഖ്യയും קֹדֶשׁ എന്ന നാമത്തിന്റെ ‘വിശുദ്ധി’ എന്ന രൂപവും ഔപചാരികമായി നിലനിർത്തി; വിശുദ്ധരായ അനുചരന്മാർ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
- source_word: מִימִינוֹ
  choice: അവന്റെ വലങ്കയ്യിൽനിന്ന്
  rationale: מן എന്ന ഉപസർഗത്തിന്റെ സാധാരണ ദിശാസൂചകമായ ‘നിന്ന്’ നിലനിർത്തുന്നു.
- source_word: אשדת
  choice: അഗ്നിമയമായ ന്യായപ്രമാണം
  rationale: വായിക്കാൻ വ്യക്തവും സീനായി സന്ദർഭത്തോട് യോജിച്ചതുമായ പരമ്പരാഗത വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; അതീവ ദുഷ്കരമായ ഈ എബ്രായരൂപത്തിന്റെ അനിശ്ചിതത്വവും അഗ്നിജ്വാലകൾ എന്ന സാധ്യതയും അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
theological_decisions:
- issue: കാവ്യാത്മക ദൈവപ്രത്യക്ഷതയിലെ ദൈവിക കർത്താവിന്റെ തിരിച്ചറിയൽ
  choice: പഴയനിയമസന്ദർഭത്തിലെ ഉടമ്പടിദൈവത്തിന്റെ വ്യക്തിനാമമായി ‘യഹ്‌വെ’ ഉപയോഗിച്ചു.
  alternative: പിന്നീടുള്ള ക്രിസ്തുശാസ്ത്രപരമായ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർക്കുക.
  rationale: വാക്യം യഹ്‌വെയുടെ സീനായി ദൈവപ്രത്യക്ഷതയെ വിവരിക്കുന്നു; പിന്നീടുള്ള ദൈവശാസ്ത്രവായനകൾ പരിഭാഷയിൽ ഇറക്കുമതി ചെയ്തില്ല.
- issue: מֵרִבְבֹת קֹדֶשׁ എന്നതിന്റെ വ്യാഖ്യാനം
  choice: ‘വിശുദ്ധിയുടെ പതിനായിരങ്ങളിൽനിന്ന്’ എന്ന തുറന്ന രൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
  alternative: ‘പതിനായിരക്കണക്കിന് വിശുദ്ധന്മാരുടെ ഇടയിൽനിന്ന്’ എന്നു വ്യക്തമായി വ്യാഖ്യാനിക്കുക.
  rationale: קֹדֶשׁ അമൂർത്തമായ വിശുദ്ധിയെയോ വിശുദ്ധരായ സ്വർഗീയ അനുചരന്മാരെയോ സൂചിപ്പിക്കാം; അതിനാൽ സാധ്യത പൂർണമായി തീർപ്പാക്കിയില്ല.
- issue: אשדת എന്ന ദുഷ്കരമായ പദരൂപത്തിന്റെ വ്യാഖ്യാനം
  choice: ‘അഗ്നിമയമായ ന്യായപ്രമാണം’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു, അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
  alternative: ‘അഗ്നിജ്വാലകൾ’ അല്ലെങ്കിൽ ‘തീപ്പൊരികൾ’ എന്നു നൽകുക.
  rationale: പരമ്പരാഗത വായന സീനായി സന്ദർഭത്തിൽ അർഥസമ്പന്നമാണെങ്കിലും പദരൂപം ഉറപ്പില്ല; അതിനാൽ ബദൽ സാധ്യത മറച്ചുവെച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കാവ്യഗദ്യം ഉപയോഗിച്ചു. അപരിചിതമായ അതിപുരാതന ശൈലി ഒഴിവാക്കി; എന്നാൽ ആവർത്തിതമായ ‘വന്നു/പ്രകാശിച്ചു’ എന്ന ദൈവപ്രത്യക്ഷതയുടെ കാവ്യസമാന്തരതയും ദിശാസൂചകങ്ങളായ ‘നിന്ന്’ രൂപങ്ങളും സൂക്ഷിച്ചു.
