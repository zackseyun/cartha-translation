  text: לְ/בִנְיָמִ֣ן אָמַ֔ר יְדִ֣יד יְהֹוָ֔ה יִשְׁכֹּ֥ן לָ/בֶ֖טַח עָלָ֑י/ו חֹפֵ֤ף עָלָי/ו֙ כָּל הַ/יּ֔וֹם וּ/בֵ֥ין כְּתֵיפָ֖י/ו שָׁכֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/012.yaml
  text: 'And of Benjamin he said: “The beloved of Yahweh dwells in safety by him[a]; he shields him all the day[b], and he dwells between his shoulders.”'
translation:
  language: ml
  text: 'ബെന്യാമീനെക്കുറിച്ച് അവൻ പറഞ്ഞു:


    “യഹോവയുടെ പ്രിയൻ അവിടുത്തെ അരികിൽ സുരക്ഷിതനായി വസിക്കുന്നു[a];


    അവിടുന്ന് ദിവസം മുഴുവൻ അവനെ പൊതിഞ്ഞുകാക്കുന്നു;


    അവൻ അവന്റെ തോളുകൾക്കിടയിൽ വസിക്കുന്നു[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവിടുത്തെ സമീപം സുരക്ഷിതനായി വസിക്കുന്നു’ എന്നും ‘അവിടുത്തെ കീഴിൽ/മീതെ സുരക്ഷിതനായി വസിക്കുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ ഉപസർഗം സമീപ്യമോ സംരക്ഷണപരമായ മേൽനോട്ടമോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം ‘അവന്റെ തോളുകൾക്കിടയിൽ.’ ഇത് സംരക്ഷണസാമീപ്യത്തിന്റെ രൂപകമായോ ബെന്യാമീന്റെ മലനാടിനെയോ അവന്റെ പ്രദേശത്തുണ്ടായിരുന്ന വിശുദ്ധമന്ദിരത്തെയോ സൂചിപ്പിക്കുന്ന ഭൂമിശാസ്ത്രപരമായ പ്രയോഗമായോ മനസ്സിലാക്കപ്പെടുന്നു. ‘അവൻ’ എന്നും ‘അവന്റെ’ എന്നും ഉള്ള സർവനാമങ്ങൾ ആരെ സൂചിപ്പിക്കുന്നു എന്നതിലും എബ്രായത്തിൽ അനിശ്ചിതത്വമുണ്ട്.
    reason: alternative_reading
lexical_decisions:
- source_word: לְבִנְיָמִן
  choice: ബെന്യാമീനെക്കുറിച്ച്
  rationale: ഗോത്രങ്ങൾക്കുള്ള അനുഗ്രഹവചനത്തിന്റെ ആമുഖത്തിൽ לְ എന്ന ഉപസർഗം ‘ബെന്യാമീനോട്/ബെന്യാമീനുവേണ്ടി’ എന്നും ഗ്രഹിക്കാമെങ്കിലും, മലയാളത്തിൽ തലക്കെട്ടുസ്വഭാവം സ്വാഭാവികമായി നൽകുന്നത് ‘ബെന്യാമീനെക്കുറിച്ച്’ എന്ന പ്രയോഗമാണ്.
- source_word: יְדִיד יְהוָה
  choice: യഹോവയുടെ പ്രിയൻ
  rationale: יְדִיד സ്നേഹിക്കപ്പെടുന്ന, പ്രിയപ്പെട്ട വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. ദൈവനാമം പദവിയാൽ മാറ്റാതെ ‘യഹോവ’ എന്നു നിലനിർത്തുന്നു.
- source_word: יִשְׁכֹּן לָבֶטַח
  choice: സുരക്ഷിതനായി വസിക്കുന്നു
  rationale: שׁכן എന്നത് ‘വസിക്കുക’ എന്നും לָבֶטַח സുരക്ഷിതാവസ്ഥയെയും സൂചിപ്പിക്കുന്നു. അനുഗ്രഹകാവ്യത്തിലെ നിലനിൽക്കുന്ന യാഥാർഥ്യം വർത്തമാനകാലത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: עָלָיו
  choice: അവിടുത്തെ അരികിൽ
  rationale: עַל എന്ന ഉപസർഗത്തിന് ഇവിടെ സമീപ്യം, മീതെയുള്ള സംരക്ഷണം, ആശ്രയം തുടങ്ങിയ അർഥസാധ്യതകളുണ്ട്. മുഖ്യപാഠത്തിൽ സമീപ്യം സൂചിപ്പിക്കുമ്പോഴും മറ്റ് സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: חֹפֵף עָלָיו
  choice: അവിടുന്ന് അവനെ മറച്ചുസൂക്ഷിക്കുന്നു
  rationale: חֹפֵף മീതെ മൂടിനിന്ന് സംരക്ഷിക്കുന്ന ആശയം നൽകുന്നു. ‘മറച്ചുസൂക്ഷിക്കുന്നു’ എന്നത് മൂടലിന്റെ ദൃശ്യവും സംരക്ഷണത്തിന്റെ അർഥവും ഒരുമിച്ച് വഹിക്കുന്നു.
- source_word: כָּל הַיּוֹם
  choice: ദിവസം മുഴുവൻ
  rationale: തുടർച്ചയായ ദൈവിക സംരക്ഷണം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וּבֵין כְּתֵיפָיו שָׁכֵן
  choice: അവൻ അവിടുത്തെ തോളുകൾക്കിടയിൽ വസിക്കുന്നു
  rationale: ‘തോളുകൾക്കിടയിൽ’ എന്ന എബ്രായ ദൃശ്യം നേരിട്ട് നിലനിർത്തുന്നു. സർവനാമങ്ങളുടെ പരാമർശവിഷയത്തിലെ കാവ്യാത്മക അനിശ്ചിതത്വം പൂർണമായി ഇല്ലാതാക്കാതെ, മുഖ്യവായനയിൽ പ്രിയൻ യഹോവയുടെ സംരക്ഷിതസാമീപ്യത്തിൽ വസിക്കുന്നു എന്നു ഗ്രഹിക്കുന്നു.
theological_decisions:
- issue: വാക്യത്തിലെ സർവനാമങ്ങൾ ആരെ സൂചിപ്പിക്കുന്നു
  choice: പ്രിയനായ ബെന്യാമീൻ യഹോവയുടെ അരികിൽ സുരക്ഷിതനായി വസിക്കുന്നു; യഹോവ അവനെ സംരക്ഷിക്കുന്നു; അവസാന വരിയിൽ പ്രിയൻ അവിടുത്തെ തോളുകൾക്കിടയിൽ വസിക്കുന്നു.
  alternative: യഹോവ ബെന്യാമീന്റെ മീതെയും അവന്റെ തോളുകൾക്കിടയിലും വസിക്കുന്നു; അല്ലെങ്കിൽ അവസാന വരിയിലെ സർവനാമബന്ധം ഭൂവിശേഷതയെ സൂചിപ്പിക്കുന്നു.
  rationale: എബ്രായ കവിതയുടെ ചുരുക്കവും മൂന്നാംപുരുഷ സർവനാമങ്ങളും ഒന്നിലധികം വ്യാകരണബന്ധങ്ങൾ അനുവദിക്കുന്നു. മുഖ്യപാഠം സാധാരണ സംരക്ഷണവായന സ്വീകരിച്ചെങ്കിലും, മറ്റു വായനകൾ അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
- issue: ‘തോളുകൾക്കിടയിൽ’ എന്ന ദൃശ്യത്തിന്റെ സ്വഭാവം
  choice: ശരീരദൃശ്യം അതേപടി നിലനിർത്തുന്നു.
  alternative: ബെന്യാമീന്റെ മലഞ്ചരിവുകളെയോ അവന്റെ പ്രദേശത്തുണ്ടായിരുന്ന വിശുദ്ധമന്ദിരത്തെയോ സൂചിപ്പിക്കുന്ന ഭൂമിശാസ്ത്രപരമായ രൂപകം.
  rationale: כָּתֵף എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘തോൾ/വശം’ എന്നാണ്. വ്യാഖ്യാനത്തെ മുഖ്യപാഠത്തിൽ ഉറപ്പിക്കാതെ കാവ്യരൂപകം നിലനിർത്തുന്നതാണ് സ്രോതസ്സിനോടു കൂടുതൽ വിശ്വസ്തം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കാവ്യഭാഷ ഉപയോഗിച്ചു. ‘വസിക്കുന്നു’ എന്ന ആവർത്തനം എബ്രായത്തിലെ שכן എന്ന ധാതുവിന്റെ ആവർത്തനവും വരികളുടെ ഐക്യവും നിലനിർത്തുന്നു. ദൈവത്തെ സൂചിപ്പിക്കുന്ന സർവനാമങ്ങൾക്ക് ആദരസൂചക രൂപങ്ങൾ ഉപയോഗിച്ചു; ദൈവനാമം ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
