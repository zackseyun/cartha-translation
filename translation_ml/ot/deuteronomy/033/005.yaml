  to: ജനത്തിന്റെ തലവന്മാരും ഇസ്രായേൽ ഗോത്രങ്ങളും ഒരുമിച്ചുകൂടിയപ്പോൾ[c], അവൻ യെശുരൂനിൽ[a][b] രാജാവായിരുന്നു.
