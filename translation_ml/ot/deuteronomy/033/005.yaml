  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֥י בִ/ישֻׁר֖וּן מֶ֑לֶךְ בְּ/הִתְאַסֵּף֙ רָ֣אשֵׁי עָ֔ם יַ֖חַד שִׁבְטֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/005.yaml
  text: And he was king in Jeshurun[a], when the heads of the people gathered together[c][b], the tribes of Israel as one.
translation:
  language: ml
  text: ജനത്തിന്റെ തലവന്മാരും ഇസ്രായേൽ ഗോത്രങ്ങളും ഒരുമിച്ചുകൂടിയപ്പോൾ[c], അവൻ യെശുരൂനിൽ[a][b] രാജാവായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “യഹോവ യെശുരൂനിൽ രാജാവായി”; മറ്റുചിലർ: “അവൻ [മോശെ] യെശുരൂനിൽ രാജാവായി” എന്നു മനസ്സിലാക്കുന്നു. ഹീബ്രുവിൽ കർത്താവ് ആരാണെന്ന് വ്യക്തമായി പറഞ്ഞിട്ടില്ല.'
    reason: alternative_reading
  - marker: b
    text: “യെശുരൂൻ” ഇസ്രായേലിന്റെ ഒരു കാവ്യനാമമാണ്.
    reason: cultural_note
  - marker: c
    text: 'അല്ലെങ്കിൽ: “ജനത്തിന്റെ തലവന്മാർ ഒരുമിച്ചുകൂടിയപ്പോൾ, ഇസ്രായേൽ ഗോത്രങ്ങൾ ഒരുമിച്ച്.” ഹീബ്രു വാക്യഘടന ചുരുങ്ങിയതായതിനാൽ ‘ഒരുമിച്ച്’ എന്നതിന്റെ കൃത്യബന്ധം ഒന്നിലധികം വിധത്തിൽ മനസ്സിലാക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: അവൻ … ആയിരുന്നു
  rationale: היה എന്ന ക്രിയാരൂപത്തിന് ‘ആയിരുന്നു’ എന്നും ‘ആയിത്തീർന്നു’ എന്നും അർഥമാകാം. ഈ സന്ദർഭത്തിൽ രാജത്വത്തിന്റെ ആരംഭം നിർബന്ധമായി സൂചിപ്പിക്കാതെ, സ്വാഭാവികമായ മലയാളത്തിൽ ‘ആയിരുന്നു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: בִישֻׁרוּן
  choice: യെശുരൂനിൽ
  rationale: ഇസ്രായേലിന്റെ കാവ്യനാമമായ യെശുരൂൻ എന്ന സംജ്ഞാനാമം ലിപ്യന്തരണം ചെയ്തു; ב എന്ന ഉപസർഗത്തിന്റെ സ്ഥലപരമോ സമൂഹപരമോ ആയ അർഥം ‘-ൽ’കൊണ്ട് നൽകി.
- source_word: מֶלֶךְ
  choice: രാജാവ്
  rationale: ഈ നാമത്തിന്റെ സാധാരണ അർഥം നിലനിർത്തി. രാജാവ് ആരാണെന്ന് മൂലപാഠം വ്യക്തമായി പറയാത്തതിനാൽ മുഖ്യപാഠത്തിലും വ്യക്തിയെ നിർണ്ണയിച്ചിട്ടില്ല.
- source_word: בְּהִתְאַסֵּף
  choice: ഒന്നിച്ചുകൂടിയപ്പോൾ
  rationale: ב ചേർന്ന infinitive construct ഇവിടെ കാലസൂചക ഉപവാക്യം അവതരിപ്പിക്കുന്നതിനാൽ ‘…പ്പോൾ’ എന്നു നൽകി; കൂട്ടായ സമ്മേളനത്തിന്റെ ആശയം ‘ഒന്നിച്ചുകൂടി’ എന്നതിൽ നിലനിർത്തി.
- source_word: רָאשֵׁי עָם
  choice: ജനത്തിന്റെ തലവന്മാർ
  rationale: ‘ജനത്തിന്റെ തലകൾ’ എന്ന ഹീബ്രു രൂപകത്തിന്റെ നേതൃത്വാർഥം സ്വാഭാവികമായി അറിയിക്കുന്ന ‘തലവന്മാർ’ ഉപയോഗിച്ചു.
- source_word: יַחַד
  choice: ഒന്നിച്ച് / ഒന്നായി
  rationale: ഒരുമയുടെയും കൂട്ടായ്മയുടെയും ആശയം പകരാൻ സമ്മേളനത്തെക്കുറിച്ച് ‘ഒന്നിച്ചുകൂടി’ എന്നും ഗോത്രങ്ങളെക്കുറിച്ച് ‘ഒന്നായി’ എന്നും സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽ ഗോത്രങ്ങൾ
  rationale: നേരിട്ടുള്ളതും മലയാളത്തിൽ സ്വാഭാവികവുമായ പരിഭാഷ; ചുരുങ്ങിയ ഹീബ്രു വാക്യഘടനയിലെ കൂട്ടായ ഐക്യം അടുത്തുള്ള ‘ഒന്നായപ്പോൾ’ എന്ന പ്രയോഗത്തിൽ വ്യക്തമാക്കി.
theological_decisions:
- issue: ‘അവൻ’, ‘രാജാവ്’ എന്നിവയുടെ സൂചിതവ്യക്തി
  choice: മുഖ്യപാഠത്തിൽ ‘അവൻ’ എന്ന സർവനാമം നിലനിർത്തി; ആരാണെന്ന് വ്യക്തമാക്കിയില്ല.
  alternative: ‘യഹോവ യെശുരൂനിൽ രാജാവായിരുന്നു’ അല്ലെങ്കിൽ ‘മോശെ യെശുരൂനിൽ രാജാവായിരുന്നു.’
  rationale: ഹീബ്രു പാഠത്തിൽ കർത്താവ് പ്രത്യക്ഷമായി പേരെടുത്തിട്ടില്ല. യഹോവയെയോ മോശെയെയോ ഉദ്ദേശിക്കുന്നതായി വ്യാഖ്യാനിക്കാം; അതിനാൽ യഥാർഥമായ അവ്യക്തത പരിഭാഷയിൽ സംരക്ഷിച്ചു.
- issue: ഇസ്രായേലിന്റെ കൂട്ടായ ഐക്യം
  choice: തലവന്മാരുടെ സമ്മേളനവും ഗോത്രങ്ങളുടെ ഐക്യവും പ്രകടമാക്കി; അതിന്റെ രാഷ്ട്രീയമോ ആരാധനാക്രമപരമോ ആയ സ്വഭാവം നിർണ്ണയിച്ചില്ല.
  alternative: ഔപചാരിക രാജാഭിഷേകസമ്മേളനം അല്ലെങ്കിൽ ഉടമ്പടിസമ്മേളനം എന്ന് വ്യക്തമാക്കുക.
  rationale: പാഠം ഏകീകൃതമായ സമ്മേളനം ചിത്രീകരിക്കുന്നുവെങ്കിലും അതിന്റെ കൃത്യമായ സ്ഥാപനപരമായ സ്വഭാവം പറയുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കത്തക്കവിധം ഗൗരവമുള്ള കാവ്യഭാവം നിലനിർത്തി. ‘തലവന്മാർ’, ‘ഗോത്രങ്ങൾ’, ‘രാജാവ്’ എന്നീ പരിചിത പദങ്ങൾ ഉപയോഗിച്ചു; മൂലപാഠത്തിലെ കർത്താവുസംബന്ധമായ അവ്യക്തത അടിക്കുറിപ്പോടെ സംരക്ഷിച്ചു.
