id: DEU.33.7
reference: Deuteronomy 33:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/זֹ֣את לִֽ/יהוּדָה֮ וַ/יֹּאמַר֒ שְׁמַ֤ע יְהוָה֙ ק֣וֹל יְהוּדָ֔ה וְ/אֶל עַמּ֖/וֹ תְּבִיאֶ֑/נּוּ יָדָי/ו֙ רָ֣ב ל֔/וֹ וְ/עֵ֥זֶר מִ/צָּרָ֖י/ו תִּהְיֶֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/007.yaml
  text: 'And this he said for Judah: “Hear[a], Yahweh, the voice of Judah, and bring him to his people. Let his hands strive for him, and be a help against his adversaries.”'
translation:
  language: ml
  text: 'യൂദയ്ക്കുവേണ്ടി അവൻ പറഞ്ഞത് ഇതാണ്:


    “യഹോവേ, യൂദയുടെ ശബ്ദം കേൾക്കണമേ;

    അവനെ അവന്റെ ജനത്തിന്റെ അടുക്കൽ കൊണ്ടുവരണമേ.

    അവന്റെ കൈകൾ അവനുവേണ്ടി പോരാടട്ടെ[a];

    അവന്റെ ശത്രുക്കൾക്കെതിരെ നീ അവന് സഹായമായിരിക്കണമേ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അവന്റെ കൈകൾ അവന് മതിയാകട്ടെ.” ഈ എബ്രായ വാക്യഖണ്ഡം ദുഷ്കരമാണ്; ഒന്നിലധികം വിധത്തിൽ ഇതിനെ മനസ്സിലാക്കിയിട്ടുണ്ട്.
    reason: alternative_reading
lexical_decisions:
- source_word: וְזֹאת לִיהוּדָה וַיֹּאמַר
  choice: യൂദയ്ക്കുവേണ്ടി അവൻ പറഞ്ഞത് ഇതാണ്
  rationale: ഗോത്രത്തിനായുള്ള അനുഗ്രഹത്തിലേക്കുള്ള സംക്രമണസൂത്രം സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; לִיהוּדָה എന്നത് ഇവിടെ യൂദയ്ക്കുവേണ്ടിയുള്ള വാക്കുകളെ സൂചിപ്പിക്കുന്നു.
- source_word: שְׁמַע יְהוָה קוֹל יְהוּדָה
  choice: യഹോവേ, യൂദയുടെ ശബ്ദം കേൾക്കണമേ
  rationale: קוֹל എന്നതിന്റെ അടിസ്ഥാനചിത്രമായ ‘ശബ്ദം’ നിലനിർത്തുന്നു; പ്രാർഥനാസന്ദർഭം മാത്രം ആശ്രയിച്ച് അതിനെ ‘നിലവിളി’ എന്നു പരിമിതപ്പെടുത്തുന്നില്ല. ദൈവനാമം യഹോവ എന്ന് ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וְאֶל עַמּוֹ תְּבִיאֶנּוּ
  choice: അവനെ അവന്റെ ജനത്തിന്റെ അടുക്കൽ കൊണ്ടുവരണമേ
  rationale: ഹിഫീൽ ക്രിയയുടെ ‘കൊണ്ടുവരുക’ എന്ന അർഥം നിലനിർത്തുകയും യുദ്ധശേഷമുള്ള മടങ്ങിവരവാണോ മറ്റൊരു ചേർക്കലാണോ എന്നു നിർണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: יָדָיו רָב לוֹ
  choice: അവന്റെ കൈകൾ അവനുവേണ്ടി പോരാടട്ടെ
  rationale: ദുഷ്കരവും ചുരുക്കമുള്ളതുമായ എബ്രായ പ്രയോഗത്തെ ריב/רב എന്നതിന്റെ പോരാടുക എന്ന സാധ്യതയിൽ വായിക്കുന്നു; തുടർന്നുള്ള ശത്രുക്കളെക്കുറിച്ചുള്ള അപേക്ഷയുമായി ഇതു യോജിക്കുന്നു. മറ്റൊരു പ്രധാന വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וְעֵזֶר מִצָּרָיו תִּהְיֶה
  choice: അവന്റെ ശത്രുക്കൾക്കെതിരെ നീ അവന് സഹായമായിരിക്കണമേ
  rationale: מִן എന്നത് ഇവിടെ എതിരാളികളിൽനിന്നുള്ള രക്ഷയെയോ അവർക്കെതിരായ സഹായത്തെയോ സൂചിപ്പിക്കുന്നതായി എടുക്കുന്നു. അഭിസംബോധന ചെയ്യപ്പെടുന്ന യഹോവയാണ് സഹായമാകേണ്ടത് എന്ന പ്രാർഥനാഭാവം വ്യക്തമാക്കാൻ ‘നീ’ ചേർക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: יָדָיו רָב לוֹ എന്ന ദുഷ്കരമായ വാക്യഖണ്ഡത്തിന്റെ വ്യാഖ്യാനം
  choice: അവന്റെ കൈകൾ അവനുവേണ്ടി പോരാടട്ടെ
  alternative: അവന്റെ കൈകൾ അവന് മതിയാകട്ടെ
  rationale: സൈനികവും ശത്രുസംബന്ധവുമായ സന്ദർഭത്തിൽ ‘പോരാടുക’ എന്ന വായന മുഖ്യപാഠത്തിൽ സ്വീകരിക്കുന്നു; എന്നാൽ എബ്രായത്തിന്റെ യഥാർഥ അനിശ്ചിതത്വം മറയ്ക്കാതെ വ്യത്യസ്തമായ വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള പ്രാർഥനാശൈലി ഉപയോഗിച്ചു. ‘കേൾക്കണമേ’, ‘കൊണ്ടുവരണമേ’, ‘സഹായമായിരിക്കണമേ’ എന്നീ രൂപങ്ങൾ അഭിസംബോധനയും അപേക്ഷാഭാവവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു. കവിതാസ്വഭാവം സൂക്ഷിക്കാൻ വരികളായി ക്രമപ്പെടുത്തി.
