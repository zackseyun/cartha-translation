source:
  edition: WLC
  text: וּ/לְ/לֵוִ֣י אָמַ֔ר תֻּמֶּ֥י/ךָ וְ/אוּרֶ֖י/ךָ לְ/אִ֣ישׁ חֲסִידֶ֑/ךָ אֲשֶׁ֤ר נִסִּית/וֹ֙ בְּ/מַסָּ֔ה תְּרִיבֵ֖/הוּ עַל מֵ֥י מְרִיבָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/008.yaml
  text: 'And of Levi he said: “Your Thummim and your Urim belong to your faithful one[a], whom you tested at Massah[b], with whom you contended at the waters of Meribah.”'
translation:
  language: ml
  text: 'ലേവിയെക്കുറിച്ച് അവൻ പറഞ്ഞു:


    “അങ്ങയുടെ തുമ്മീമും അങ്ങയുടെ ഊരീമും


    അങ്ങയുടെ വിശ്വസ്തനായവനുള്ളതാണ്[a].


    അവനെ അങ്ങ് മസ്സായിൽ പരീക്ഷിച്ചു[b];


    മെരീബായിലെ വെള്ളത്തിനരികെ


    അവനോടു വാദിച്ചു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അങ്ങയുടെ ഭക്തനായ ഒരുവനുള്ളതാണ്’ അല്ലെങ്കിൽ ‘അങ്ങയോടു വിശ്വസ്തനായ ഒരുവനുള്ളതാണ്’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപ്രയോഗം ഉടമ്പടിയോടുള്ള വിശ്വസ്തതയാൽ അടയാളപ്പെട്ട ഒരാളെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘മസ്സാ’ എന്ന പേരിന് ‘പരീക്ഷിക്കൽ’ എന്ന അർഥമുണ്ട്; ‘മെരീബാ’ എന്ന പേര് ‘വാദം/കലഹം’ എന്ന ആശയവുമായി ബന്ധപ്പെട്ടിരിക്കുന്നു (പുറപ്പാട് 17:1–7; സംഖ്യ 20:1–13 കാണുക).
    reason: cross_reference
lexical_decisions:
- source_word: וּלְלֵוִי
  choice: ലേവിയെക്കുറിച്ച്
  rationale: അനുഗ്രഹവചനങ്ങളുടെ പരമ്പരയിൽ ל ഗോത്രത്തെ വിഷയമായി അവതരിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മൂലഘടനയോട് ചേർന്നതുമായ പ്രയോഗം.
- source_word: תֻּמֶּיךָ וְאוּרֶיךָ
  choice: അങ്ങയുടെ തുമ്മീമും അങ്ങയുടെ ഊരീമും
  rationale: ഇവ പ്രത്യേക പുരോഹിതസാങ്കേതിക പദങ്ങളായതിനാൽ അർഥം അനുമാനിച്ച് പരിഭാഷപ്പെടുത്താതെ ലിപ്യന്തരണം ചെയ്തു; 2ms പ്രത്യയം രണ്ടിലും നിലനിർത്തി.
- source_word: לְאִישׁ חֲסִידֶךָ
  choice: അങ്ങയുടെ വിശ്വസ്തനായവനുള്ളതാണ്
  rationale: חָסִיד നിയമബന്ധത്തിലെ വിശ്വസ്തതയുള്ള ഒരാളെ സൂചിപ്പിക്കാം. വ്യക്തി ആരാണെന്നത് നിർണ്ണയിക്കാതെ ഏകവചനവും വ്യക്തിസൂചനയും നിലനിർത്തുന്നു; ക്രിയയില്ലാത്ത എബ്രായ വാക്യം മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘ഉള്ളതാണ്’ ചേർത്തു.
- source_word: אֲשֶׁר נִסִּיתוֹ
  choice: അവനെ അങ്ങ് പരീക്ഷിച്ചു
  rationale: נסה എന്ന പദത്തിന്റെ ‘പരീക്ഷിക്കുക, പരിശോധിക്കുക’ എന്ന സാധാരണ അർഥവും മരുഭൂമിസംഭവസൂചനയും സംരക്ഷിക്കുന്നു.
- source_word: בְּמַסָּה
  choice: മസ്സായിൽ
  rationale: ഇവിടെ സ്ഥലനാമമായതിനാൽ അതിന്റെ പദാർഥം മുഖ്യവാചകത്തിൽ പകരാതെ ലിപ്യന്തരണം ചെയ്തു.
- source_word: תְּרִיבֵהוּ
  choice: അവനോടു വാദിച്ചു
  rationale: ריב എന്നതിലെ തർക്കം/വാദം എന്ന നേരിട്ടുള്ള സംഘർഷഭാവം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളം.
- source_word: עַל מֵי מְרִיבָה
  choice: മെരീബയിലെ വെള്ളത്തിനരികെ
  rationale: עַל ഇവിടെ സംഭവസ്ഥലം സൂചിപ്പിക്കുന്നതായി വായിച്ചു; ‘വെള്ളത്തിനരികെ’ സ്ഥലം സ്വാഭാവികമായി വ്യക്തമാക്കുകയും മെരീബ എന്ന പേരുസൂചന സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘അങ്ങയുടെ വിശ്വസ്തനായവൻ’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: ആരോൻ, പൂർവപിതാവായ ലേവി, അല്ലെങ്കിൽ ലേവ്യഗോത്രം എന്നിങ്ങനെ വ്യക്തമായി തിരിച്ചറിയിക്കാതെ ഏകവചനപ്രയോഗം നിലനിർത്തി.
  alternative: ആരോനെ പ്രത്യേകം പറയുക; ലേവിയെ പ്രത്യേകം പറയുക; ലേവ്യഗോത്രത്തെ സമൂഹമായി വ്യക്തമാക്കുക.
  rationale: אִישׁ חֲסִידֶךָ എന്ന ഏകവചനത്തിന് ഒന്നിലധികം ചരിത്രപരമായ സൂചനകൾ സാധ്യമാണ്. മൂലപാഠത്തിലെ അവ്യക്തത പരിഭാഷയിൽ തീർപ്പാക്കിയിട്ടില്ല.
- issue: ദൈവത്തെ അഭിസംബോധന ചെയ്യുന്ന ഏകവചന സർവനാമത്തിന്റെ രജിസ്റ്റർ
  choice: ‘അങ്ങ്/അങ്ങയുടെ’ ഉപയോഗിച്ചു.
  alternative: ‘നീ/നിന്റെ’ ഉപയോഗിക്കുക.
  rationale: എബ്രായത്തിലെ ഏകവചനം സംരക്ഷിക്കുമ്പോൾ ആധുനിക മാനക മലയാളത്തിലെ ഗൗരവമുള്ള ദൈവാഭിസംബോധന നൽകുന്നു; പ്രത്യേക സമുദായശൈലി നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കവിതാത്മക വാക്യക്രമം. തുമ്മീം, ഊരീം എന്നീ സാങ്കേതിക പദങ്ങളും മസ്സാ, മെരീബ എന്നീ സ്ഥലനാമങ്ങളും ലിപ്യന്തരിച്ചു. അഭിസംബോധനയിൽ ആദരസൂചക ഏകവചനം ഉപയോഗിച്ചെങ്കിലും മൂലത്തിലെ ദൈവ-മനുഷ്യ സംഘർഷവും സൂചകവ്യക്തിയുടെ അവ്യക്തതയും മൃദൂകരിച്ചിട്ടില്ല.
