  variant: modern standard Malayalam
source:
  edition: WLC
  text: יוֹר֤וּ מִשְׁפָּטֶ֨י/ךָ֙ לְ/יַעֲקֹ֔ב וְ/תוֹרָתְ/ךָ֖ לְ/יִשְׂרָאֵ֑ל יָשִׂ֤ימוּ קְטוֹרָה֙ בְּ/אַפֶּ֔/ךָ וְ/כָלִ֖יל עַֽל מִזְבְּחֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/010.yaml
  text: They will teach your judgments to Jacob and your law to Israel[b][a]; they will place incense before you and whole burnt offerings on your altar.
translation:
  language: ml
  text: അവർ യാക്കോബിനെ നിന്റെ ന്യായവിധികളും ഇസ്രായേലിനെ നിന്റെ ന്യായപ്രമാണവും[a] പഠിപ്പിക്കും; അവർ നിന്റെ സന്നിധിയിൽ[b] ധൂപവും നിന്റെ യാഗപീഠത്തിന്മേൽ സമ്പൂർണ ദഹനയാഗവും അർപ്പിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിന്റെ ഉപദേശം’ എന്നും പരിഭാഷപ്പെടുത്താം (תּוֹרָה).
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘നിന്റെ മൂക്കിൽ/മൂക്കരികിൽ’; ദൈവത്തിന്റെ മുമ്പാകെ ധൂപം അർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന മനുഷ്യരൂപക പ്രയോഗം.'
    reason: cultural_note
lexical_decisions:
- source_word: יוֹרוּ
  choice: പഠിപ്പിക്കും
  rationale: ירה എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം പുരോഹിത-നിയമസന്ദർഭത്തിൽ ‘പഠിപ്പിക്കുക/ഉപദേശിക്കുക’ എന്നാണ്; ‘പഠിപ്പിക്കും’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: מִשְׁפָּטֶיךָ
  choice: നിന്റെ ന്യായവിധികൾ
  rationale: מִשְׁפָּט എന്നതിന് ന്യായവിധികൾ, ചട്ടങ്ങൾ, നിയമതീർപ്പുകൾ എന്നീ അർഥങ്ങളുണ്ട്. ‘ന്യായവിധികൾ’ അതിന്റെ ന്യായ-നിയമ ഭാവം നിലനിർത്തുന്നു.
- source_word: לְיַעֲקֹב / לְיִשְׂרָאֵל
  choice: യാക്കോബിനെ / ഇസ്രായേലിനെ
  rationale: לְ ഇവിടെ പഠിപ്പിക്കൽക്രിയയുടെ പരോക്ഷ കർമത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘യാക്കോബിനെ… പഠിപ്പിക്കും’ എന്ന കർമപ്രയോഗം സ്വാഭാവികമാണ്; കാവ്യസമാന്തരതയും നിലനിൽക്കുന്നു.
- source_word: וְתוֹרָתְךָ
  choice: നിന്റെ ന്യായപ്രമാണം
  rationale: תּוֹרָה എന്നത് ‘ഉപദേശം’ എന്നും ‘നിയമം’ എന്നും അർഥമാക്കാം. ഉടമ്പടി-പുരോഹിത പശ്ചാത്തലത്തിൽ പരിചിതവും നിയമപരമായ ശക്തി സൂക്ഷിക്കുന്നതുമായ ‘ന്യായപ്രമാണം’ സ്വീകരിച്ചു; മറ്റർഥം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: יָשִׂימוּ קְטוֹרָה
  choice: ധൂപം അർപ്പിക്കും
  rationale: ശാബ്ദികമായി ‘ധൂപം വെക്കും’ എന്നാണെങ്കിലും യാഗാരാധനാസന്ദർഭത്തിൽ മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗം ‘ധൂപം അർപ്പിക്കും’ എന്നതാണ്.
- source_word: בְּאַפֶּךָ
  choice: നിന്റെ സന്നിധിയിൽ
  rationale: ശാബ്ദികമായി ‘നിന്റെ മൂക്കിൽ/മൂക്കരികിൽ’ എന്ന മനുഷ്യരൂപക പ്രയോഗമാണിത്. ധൂപം ദൈവത്തിന്റെ മുമ്പാകെ അർപ്പിക്കുന്നതെന്ന സന്ദർഭാർഥം ‘നിന്റെ സന്നിധിയിൽ’ സ്വാഭാവികമായി നൽകുന്നു; ശാബ്ദിക രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: וְכָלִיל
  choice: സമ്പൂർണ ദഹനയാഗങ്ങൾ
  rationale: כָּלִיל യാഗപീഠത്തിൽ പൂർണമായി ദഹിപ്പിക്കുന്ന വഴിപാടിനെ സൂചിപ്പിക്കുന്നു. വർഗാത്മക/സമാഹാരാർഥം പ്രകടമാക്കാൻ ബഹുവചനം ഉപയോഗിച്ചു.
- source_word: עַל מִזְבְּחֶךָ
  choice: നിന്റെ യാഗപീഠത്തിന്മേൽ
  rationale: യാഗസന്ദർഭത്തിലെ עַל മִזְבֵּחַ എന്ന പ്രയോഗത്തിന്റെ നേരിട്ടുള്ളതും മാന്യവുമായ മലയാള പരിഭാഷ.
theological_decisions:
- issue: ഉടമ്പടി പശ്ചാത്തലത്തിലെ תּוֹרָהയുടെ വിവർത്തനം
  choice: ന്യായപ്രമാണം
  alternative: ഉപദേശം
  rationale: ലേവിയുടെ പുരോഹിതദൗത്യം ദൈവത്തിന്റെ ഉടമ്പടി നിർദേശങ്ങൾ ഇസ്രായേലിനെ പഠിപ്പിക്കുന്നതാണ്. ‘ന്യായപ്രമാണം’ നിയമ-ഉടമ്പടി ഭാവം നിലനിർത്തുന്നു; പദത്തിന്റെ വിശാലമായ ‘ഉപദേശം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: בְּאַפֶּךָയിലെ മനുഷ്യരൂപക ഭാഷ
  choice: നിന്റെ സന്നിധിയിൽ
  alternative: നിന്റെ മൂക്കരികിൽ
  rationale: ശാബ്ദിക പരിഭാഷ മലയാളത്തിൽ അപാരദർശകമോ തെറ്റിദ്ധരിപ്പിക്കുന്നതോ ആകാം. ധൂപം ദൈവത്തിന്റെ മുമ്പാകെ അർപ്പിക്കുന്നു എന്ന സന്ദർഭാർഥം മുഖ്യവാചകത്തിൽ നൽകി, യഥാർഥ രൂപകം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ബൈബിൾ ശൈലി. കാവ്യസമാന്തരത നിലനിർത്തി; അതേസമയം ‘വെക്കും’ എന്ന ശാബ്ദികതയ്ക്കുപകരം യാഗസന്ദർഭത്തിന് യോജിച്ച ‘അർപ്പിക്കും’ ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദങ്ങൾക്ക് പിന്നാലെ മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
