source:
  edition: WLC
  text: הָ/אֹמֵ֞ר לְ/אָבִ֤י/ו וּ/לְ/אִמּ/וֹ֙ לֹ֣א רְאִיתִ֔י/ו וְ/אֶת אֶחָי/ו֙ לֹ֣א הִכִּ֔יר וְ/אֶת בנ/ו לֹ֣א יָדָ֑ע כִּ֤י שָֽׁמְרוּ֙ אִמְרָתֶ֔/ךָ וּ/בְרִֽיתְ/ךָ֖ יִנְצֹֽרוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/009.yaml
  text: who said of his father and his mother[a], ‘I have not seen him,’ and did not acknowledge his brothers or know his sons; for they kept your word and guarded your covenant.
translation:
  language: ml
  text: തന്റെ അപ്പനെയും അമ്മയെയും കുറിച്ച്, ‘ഞാൻ അവനെ കണ്ടില്ല’[a] എന്നു പറഞ്ഞവൻ; തന്റെ സഹോദരന്മാരെ അംഗീകരിക്കാതെയും തന്റെ പുത്രന്മാരെ അറിയാതെയും ഇരുന്നവൻ. എന്തെന്നാൽ, അവർ അങ്ങയുടെ വചനം പാലിക്കുകയും അങ്ങയുടെ ഉടമ്പടി കാത്തുസൂക്ഷിക്കുകയും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘ഞാൻ അവനെ കണ്ടില്ല.’ ഈ സന്ദർഭത്തിൽ അതിന് ‘ഞാൻ അവനെ ഗണിച്ചില്ല’ അഥവാ ‘അവനെ പരിഗണിച്ചില്ല’ എന്ന അർഥവും ഉണ്ടായേക്കാം; ഉടമ്പടിയോടുള്ള വിശ്വസ്തതയ്ക്ക് കുടുംബബന്ധങ്ങളെക്കാൾ മുൻഗണന നൽകുന്നതാണ് പശ്ചാത്തലം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹמֵר
  choice: പറഞ്ഞവൻ
  rationale: മുൻവാക്യത്തിലെ ലേവിയെ സൂചിപ്പിക്കുന്ന നാമവാചക കർത്തൃവാചകമാണ്; മലയാളത്തിൽ ‘പറഞ്ഞവൻ’ സ്വാഭാവികമായി ആ ബന്ധം നിലനിർത്തുന്നു.
- source_word: לְאָבִיו וּלְאִמּוֹ
  choice: തന്റെ അപ്പനെയും അമ്മയെയും കുറിച്ച്
  rationale: אמר എന്ന ക്രിയയോടൊപ്പമുള്ള ל ഇവിടെ അഭിസംബോധനയെയോ സംബന്ധത്തെയോ സൂചിപ്പിക്കാം. തുടർന്നുള്ള കുടുംബബന്ധനിഷേധങ്ങളോട് ചേരുന്നതിനാൽ ‘കുറിച്ച്’ എന്ന് നൽകി; മൂലത്തിലെ ഇരട്ടസാധ്യത പൂർണമായി ഇല്ലാതാക്കുന്നില്ല.
- source_word: לֹא רְאִיתִיו
  choice: ഞാൻ അവനെ കണ്ടില്ല
  rationale: ראה എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘കാണുക’ നേരിട്ട് നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ ‘പരിഗണിച്ചില്ല/ഗണിച്ചില്ല’ എന്ന ബന്ധപരമായ ആശയം ഉണ്ടാകാമെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: הִכִּיר
  choice: അംഗീകരിക്കാതെയും
  rationale: ഹിഫീൽ രൂപം ഇവിടെ വെറും തിരിച്ചറിയലിനെക്കാൾ കുടുംബബന്ധത്തിന്റെ അവകാശം അംഗീകരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: אֶחָיו
  choice: തന്റെ സഹോദരന്മാരെ
  rationale: എബ്രായത്തിലെ വ്യക്തമായ പുല്ലിംഗ ബഹുവചനം പൊതുവാക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: בָּנָיו
  choice: തന്റെ പുത്രന്മാരെ
  rationale: മൂലത്തിലെ ‘പുത്രന്മാർ’ എന്ന പുല്ലിംഗ പ്രത്യേകത നിലനിർത്തുന്നു.
- source_word: יָדָע
  choice: അറിയാതെയും
  rationale: ידע എന്നതിന്റെ അടിസ്ഥാന അർഥം സംരക്ഷിക്കുമ്പോഴും സമാന്തരസന്ദർഭത്തിൽ ബന്ധപരമായ അംഗീകാരം നിഷേധിക്കുന്ന ശക്തി മലയാളത്തിലും നിലനിൽക്കുന്നു.
- source_word: כִּי
  choice: എന്തെന്നാൽ
  rationale: മുൻവിവരണത്തിനുള്ള കാരണം അവതരിപ്പിക്കുന്ന ബന്ധം വ്യക്തമാക്കുന്നു; ഗൗരവമുള്ള ആധുനിക മലയാളത്തിന് യോജിക്കുന്നു.
- source_word: שָׁמְרוּ
  choice: പാലിക്കുകയും
  rationale: വചനത്തോടു ബന്ധപ്പെട്ട ശׁמר അനുസരിക്കുക/പാലിക്കുക എന്ന ഉടമ്പടിപരമായ അർഥത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אִמְרָתֶךָ
  choice: അങ്ങയുടെ വചനം
  rationale: אמרה എന്നതിന്റെ ‘വചനം/ഉച്ചാരണം’ എന്ന അർഥം അനാവശ്യമായി ‘കല്പന’യായി ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: בְּרִיתְךָ
  choice: അങ്ങയുടെ ഉടമ്പടി
  rationale: ברית എന്ന ഉടമ്പടിപരമായ സാങ്കേതിക പദത്തിന് സാധാരണവും വ്യക്തവുമായ മലയാളം.
- source_word: יִנְצֹרוּ
  choice: കാത്തുസൂക്ഷിക്കുകയും ചെയ്തു
  rationale: נצר എന്നതിലെ കാവൽ/സംരക്ഷണ ഭാവം നിലനിർത്തുകയും മുൻപത്തെ שׁמר-നിന്നുള്ള പദവ്യത്യാസം പ്രകടമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ഏകവചനത്തിൽ നിന്ന് ബഹുവചനത്തിലേക്കുള്ള മാറ്റത്തിന്റെ സൂചിതർ
  choice: ലേവിയെ/ലേവ്യരെ സമൂഹപരമായി സൂചിപ്പിക്കുന്ന മൂലത്തിലെ മാറ്റം സംരക്ഷിച്ച്, ആദ്യം ഏകവചനവും (‘പറഞ്ഞവൻ... ഇരുന്നവൻ’) പിന്നെ ബഹുവചനവും (‘അവർ... ചെയ്തു’) ഉപയോഗിച്ചു.
  alternative: വാക്യം മുഴുവൻ ഏകവചനമോ മുഴുവൻ ബഹുവചനമോ ആക്കി സുഗമമാക്കുക.
  rationale: എബ്രായപാഠം പ്രതിനിധിയായ ഏകവചനത്തിൽ നിന്ന് ഗോത്രത്തെ സൂചിപ്പിക്കുന്ന ബഹുവചനത്തിലേക്ക് മാറുന്നു. അതിനെ ഏകീകരിക്കുന്നത് പാഠത്തിലെ യഥാർഥ ദൈവശാസ്ത്രപരവും വാക്യഘടനാപരവുമായ സംഘർഷം മായ്ച്ചുകളയും.
- issue: കുടുംബബന്ധങ്ങളെക്കാൾ ഉടമ്പടി വിശ്വസ്തതയ്ക്ക് മുൻഗണന നൽകുന്നതിന്റെ തീവ്രത
  choice: ‘കണ്ടില്ല’, ‘അംഗീകരിക്കാതെയും’, ‘അറിയാതെയും’ എന്ന മൂന്നു വ്യത്യസ്ത പ്രയോഗങ്ങളും നിലനിർത്തി.
  alternative: മൂന്നും ‘പരിഗണിച്ചില്ല’ എന്ന ഒറ്റ ആശയമായി വ്യാഖ്യാനപരമായി ഏകീകരിക്കുക.
  rationale: മൂലത്തിലെ വ്യത്യസ്ത ക്രിയകളും കഠിനമായ ശൈലിയും നിലനിർത്തുന്നത് വ്യാഖ്യാനം വായനക്കാരനുവേണ്ടി മുൻകൂട്ടി തീർപ്പാക്കാതിരിക്കാൻ സഹായിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ മലയാളം. ദൈവത്തെ അഭിസംബോധന ചെയ്യുന്ന രണ്ടാംപുരുഷ ഏകവചനത്തിന് ആദരസൂചകമായ ‘അങ്ങയുടെ’ ഉപയോഗിച്ചു. പ്രതിനിധിയായ ഏകവചനത്തിൽ നിന്ന് സമൂഹപരമായ ബഹുവചനത്തിലേക്കുള്ള മൂലപാഠത്തിലെ മാറ്റം മനപ്പൂർവം നിലനിർത്തി.
