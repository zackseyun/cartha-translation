  terminology: ‘ഇരുമ്പ്,’ ‘വെങ്കലം,’ ‘ശക്തി’ എന്നിവ സ്ഥിരതയുള്ളതും യോജിച്ചതുമാണ്. ‘ഓടാമ്പലുകൾ’ മുഖ്യവായനയ്ക്കു യോജിക്കുന്നു; ‘ചെരിപ്പുകൾ’ എന്ന ബദൽ അടിക്കുറിപ്പിൽ വ്യക്തമാണ്. അടിക്കുറിപ്പ് b-യിലെ ‘വിശ്രമം/സുരക്ഷ’ സ്ലാഷ് ഉപയോഗം ആശയസാദ്ധ്യതകളെ സംക്ഷിപ്തമായി സംരക്ഷിക്കുന്നു; അർഥം മാറ്റുന്നില്ല.
