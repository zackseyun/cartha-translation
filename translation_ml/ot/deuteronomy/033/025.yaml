source:
  edition: WLC
  text: בַּרְזֶ֥ל וּ/נְחֹ֖שֶׁת מִנְעָלֶ֑י/ךָ וּ/כְ/יָמֶ֖י/ךָ דָּבְאֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/025.yaml
  text: Your bars shall be iron and bronze[a], and as your days[b], so shall your strength be.
translation:
  language: ml
  text: നിന്റെ ഓടാമ്പലുകൾ ഇരുമ്പും വെങ്കലവും ആയിരിക്കും[a]; നിന്റെ നാളുകൾക്കൊത്തതായിരിക്കും നിന്റെ ശക്തി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്റെ ചെരിപ്പുകൾ ഇരുമ്പും വെങ്കലവും ആയിരിക്കും.” എബ്രായനാമം പാദരക്ഷയെ സൂചിപ്പിക്കാം. എന്നാൽ ലോഹങ്ങളുടെ പരാമർശവും സുരക്ഷയുടെ പശ്ചാത്തലവും കണക്കിലെടുത്ത് പലരും ഇവിടെ ഓടാമ്പലുകളെയോ കതകുപൂട്ടുകളെയോ ഉദ്ദേശിക്കുന്നതായി മനസ്സിലാക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “നിന്റെ നാളുകൾക്കൊത്തതായിരിക്കും നിന്റെ വിശ്രമം/സുരക്ഷ.” അവസാനത്തെ എബ്രായപദം അപൂർവവും അർഥം അനിശ്ചിതവുമാണ്; അനുഗ്രഹത്തിന്റെ പശ്ചാത്തലത്തോട് യോജിക്കുന്ന പരമ്പരാഗത വിവർത്തനമാണ് “ശക്തി.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּרְזֶל
  choice: ഇരുമ്പ്
  rationale: ലോഹത്തിന്റെ സാധാരണ അർഥം; נְחֹשֶׁת എന്ന പദത്തോടു ചേർന്നാണ് ഇവിടെ വരുന്നത്.
- source_word: נְחֹשֶׁת
  choice: വെങ്കലം
  rationale: ഈ എബ്രായപദം ചെമ്പിനെയോ വെങ്കലത്തെയോ വിശാലമായി സൂചിപ്പിക്കാം; ഇരുമ്പിനോടൊപ്പമുള്ള ലോഹദ്വയത്തിൽ ‘വെങ്കലം’ സ്വാഭാവികവും പരമ്പരാഗതവുമാണ്.
- source_word: מִנְעָלֶיךָ
  choice: നിന്റെ ഓടാമ്പലുകൾ
  rationale: പദത്തിന് ചെരിപ്പുകൾ എന്നും അർഥമാകാമെങ്കിലും, ഇരുമ്പും വെങ്കലവും കൊണ്ടുള്ള സുരക്ഷാസംവിധാനത്തിന്റെ ചിത്രത്തിൽ ‘ഓടാമ്പലുകൾ’ യോജിക്കുന്നു. യഥാർഥമായ പദാർഥസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וּכְיָמֶיךָ
  choice: നിന്റെ നാളുകൾക്കൊത്തതായിരിക്കും
  rationale: כְ താരതമ്യമോ അനുപാതമോ സൂചിപ്പിക്കുന്നു. ‘നാളുകൾക്കൊത്ത’ എന്ന പ്രയോഗം മൂലപാഠത്തിലെ സംക്ഷിപ്തമായ അനുപാതബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: דָּבְאֶךָ
  choice: നിന്റെ ശക്തി
  rationale: വളരെ അപൂർവവും അർഥം അനിശ്ചിതവുമായ പദമാണിത്. അനുഗ്രഹത്തിന്റെ പശ്ചാത്തലത്തിൽ ‘ശക്തി’ പരമ്പരാഗതവും സന്ദർഭോചിതവുമായ വിവർത്തനമാണ്; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: അനുഗ്രഹത്തിലെ ദൃശ്യരൂപത്തിന്റെ വ്യാഖ്യാനം
  choice: ഈ വാക്യം ദീർഘകാല സുരക്ഷയും നാളുകൾക്കൊത്ത ശക്തിയും വാഗ്ദാനം ചെയ്യുന്നതായി മുഖ്യപാഠത്തിൽ അവതരിപ്പിച്ചു.
  alternative: ഇത് ദുഷ്കരമായ ഭൂപ്രദേശത്തിനുള്ള ഉറപ്പുള്ള ലോഹച്ചെരിപ്പുകളെയും തുടർന്നുനിൽക്കുന്ന കരുത്തിനെയും സൂചിപ്പിക്കാം; അവസാന ഭാഗം നാളുകൾക്കൊത്ത വിശ്രമത്തെയോ സുരക്ഷയെയോ സൂചിപ്പിക്കാനും കഴിയും.
  rationale: പ്രധാനമായ ഉപദേശപരമായ പ്രശ്നമൊന്നുമില്ലെങ്കിലും രണ്ടു എബ്രായപദങ്ങളും വിവാദവിധേയമാണ്. മുഖ്യവായന അനുഗ്രഹത്തിന്റെയും സുരക്ഷയുടെയും പശ്ചാത്തലത്തോട് നന്നായി ചേരുന്നു; മറ്റ് വായനകൾ അടിക്കുറിപ്പുകളിൽ വ്യക്തമായി നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ അനുഗ്രഹവാക്യശൈലി ഉപയോഗിച്ചു. ‘ഓടാമ്പൽ’ സുരക്ഷാസംബന്ധമായ ലോഹദൃശ്യരൂപം നിലനിർത്തുന്നു; അർഥസന്ദിഗ്ധതകൾ മുഖ്യപാഠത്തിൽ മറച്ചുവയ്ക്കാതെ അടിക്കുറിപ്പുകളിൽ രേഖപ്പെടുത്തി.
