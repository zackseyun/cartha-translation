revisions:
- from: അങ്ങനെ ഇസ്രായേൽ സുരക്ഷിതമായി, തനിച്ച് വസിച്ചു; ധാന്യവും പുതുവീഞ്ഞുമുള്ള ദേശത്ത് യാക്കോബിന്റെ ഉറവ[a]; അവന്റെ ആകാശങ്ങളും മഞ്ഞുതുള്ളികൾ പൊഴിച്ചു.
  to: അങ്ങനെ ഇസ്രായേൽ സുരക്ഷിതമായി, തനിച്ച് വസിച്ചു; യാക്കോബിന്റെ ഉറവ ധാന്യവും പുതുവീഞ്ഞുമുള്ള ദേശത്തായിരുന്നു; അവന്റെ ആകാശങ്ങൾ പോലും മഞ്ഞു പൊഴിച്ചു.
