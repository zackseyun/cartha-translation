source:
  edition: WLC
  text: וַ/יִּשְׁכֹּן֩ יִשְׂרָאֵ֨ל בֶּ֤טַח בָּדָד֙ עֵ֣ין יַעֲקֹ֔ב אֶל אֶ֖רֶץ דָּגָ֣ן וְ/תִיר֑וֹשׁ אַף שָׁמָ֖י/ו יַֽעַרְפוּ טָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/028.yaml
  text: So Israel lived in safety[a], alone; Jacob's fountain in a land of grain and new wine[b]; even his heavens dripped dew.
translation:
  language: ml
  text: അങ്ങനെ ഇസ്രായേൽ സുരക്ഷിതമായി, തനിച്ച് വസിച്ചു; യാക്കോബിന്റെ ഉറവ ധാന്യവും പുതുവീഞ്ഞുമുള്ള ദേശത്തായിരുന്നു; അവന്റെ ആകാശങ്ങൾ പോലും മഞ്ഞു പൊഴിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁכֹּן
  choice: വസിച്ചു
  rationale: שׁכן എന്ന ക്രിയയുടെ ‘വസിക്കുക, പാർക്കുക’ എന്ന അർഥം സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בֶּטַח
  choice: സുരക്ഷിതമായി
  rationale: ഇവിടെ ക്രിയാവിശേഷണമായി വരുന്ന בטח ഇസ്രായേലിന്റെ നിർഭയവും സുരക്ഷിതവുമായ അവസ്ഥയെ സൂചിപ്പിക്കുന്നു.
- source_word: בָּדָד
  choice: തനിച്ച്
  rationale: ഒറ്റപ്പെടലിന്റെ ദുഃഖമെന്നതിലുപരി വേറിട്ടും ശല്യമില്ലാതെയും കഴിയുന്ന അവസ്ഥയെ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: עֵין יַעֲקֹב
  choice: യാക്കോബിന്റെ ഉറവ
  rationale: עֵין എന്ന പദത്തിന് ‘കണ്ണ്’ എന്നും ‘ഉറവ’ എന്നും അർഥമുണ്ട്; ധാന്യം, പുതുവീഞ്ഞ്, മഞ്ഞുതുള്ളി എന്നിവയുള്ള ഫലസമൃദ്ധിയുടെ പശ്ചാത്തലത്തിൽ ‘ഉറവ’ കൂടുതൽ യോജിക്കുന്നു, എന്നാൽ മറ്റർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: אֶל אֶרֶץ
  choice: ദേശത്ത്
  rationale: കാവ്യഘടനയിലെ אֶל ഇവിടെ ലക്ഷ്യത്തെയോ ബന്ധത്തെയോ സൂചിപ്പിക്കാം; മലയാളത്തിൽ സ്ഥലബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ ‘ദേശത്ത്’ എന്നു നൽകി.
- source_word: דָּגָן
  choice: ധാന്യം
  rationale: വിവിധ ധാന്യവിളകളെ ഉൾക്കൊള്ളുന്ന പൊതുപദം.
- source_word: תִּירוֹשׁ
  choice: പുതുവീഞ്ഞ്
  rationale: പുതിയതോ പുതുതായി ഉത്പാദിപ്പിച്ചതോ ആയ വീഞ്ഞിനെ സൂചിപ്പിക്കുന്ന കാർഷികസമൃദ്ധിയുടെ പദം.
- source_word: אַף
  choice: ആകാശങ്ങളും
  rationale: אַף നൽകുന്ന കൂട്ടിച്ചേർക്കലും ഊന്നലും മലയാളത്തിലെ ‘-ഉം’ മുഖേന സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: שָׁמָיו
  choice: അവന്റെ ആകാശങ്ങൾ
  rationale: മൂന്നാംപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയം നിലനിർത്തുന്നു; ഇത് യാക്കോബ്/ഇസ്രായേലിന് മുകളിലുള്ള ആകാശങ്ങളെ സൂചിപ്പിക്കുന്ന കാവ്യപ്രയോഗമാണ്.
- source_word: יַעַרְפוּ
  choice: പൊഴിച്ചു
  rationale: മഞ്ഞുതുള്ളികൾ താഴേക്ക് ഇറ്റുവീഴുന്നതോ ചൊരിയുന്നതോ സൂചിപ്പിക്കുന്ന കാവ്യക്രിയയെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: טָל
  choice: മഞ്ഞുതുള്ളികൾ
  rationale: കാർഷികാനുഗ്രഹത്തിന്റെ പ്രതീകമായ dew-നെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: עֵין יַעֲקֹב എന്ന പ്രയോഗത്തിന്റെ വ്യാഖ്യാനം
  choice: ‘യാക്കോബിന്റെ ഉറവ’ എന്നു വിവർത്തനം ചെയ്തു.
  alternative: ‘യാക്കോബിന്റെ കണ്ണ്’
  rationale: ഇത് പ്രധാനമായും പദാർഥപരവും കാവ്യപരവുമായ തീരുമാനമാണ്. ധാന്യം, പുതുവീഞ്ഞ്, മഞ്ഞുതുള്ളി എന്നീ ഫലസമൃദ്ധിയുടെ ചിത്രണം ‘ഉറവ’ എന്ന അർഥത്തെ പിന്തുണയ്ക്കുന്നു; യഥാർഥമായ മറ്റുസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- issue: בָּדָד എന്ന പദത്തിന്റെ ഭാവം
  choice: സുരക്ഷിതമായ വേറിട്ട വാസത്തെ സൂചിപ്പിക്കുന്ന ‘തനിച്ച്’
  alternative: ‘വേറിട്ട്’ അല്ലെങ്കിൽ ‘തനിയെ’
  rationale: അനുഗ്രഹത്തിന്റെ പശ്ചാത്തലം ഉപേക്ഷിക്കപ്പെട്ട ഒറ്റപ്പെടലല്ല, ശല്യമില്ലാത്ത സുരക്ഷിത വേറിട്ട നിലയാണ് സൂചിപ്പിക്കുന്നത്; എങ്കിലും പദത്തിന്റെ സംക്ഷിപ്തമായ സംഘർഷം അതിവ്യാഖ്യാനം ചെയ്യാതെ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കാവ്യശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ ക്രിയയില്ലാത്ത ‘യാക്കോബിന്റെ ഉറവ’ എന്ന ഘടന നിലനിർത്തി; ദുഷ്കരത കുറയ്ക്കാൻ വിരാമചിഹ്നങ്ങൾ ഉപയോഗിച്ചു. ഇംഗ്ലീഷ് consultation layer-ലുള്ള അടിക്കുറിപ്പ് [b] അതിന്റെ മുഖ്യവാചകവുമായി പൊരുത്തപ്പെടുന്നില്ലെന്ന് തോന്നുന്നതിനാൽ ആവർത്തിച്ചില്ല; പ്രസക്തമായ യഥാർഥ എബ്രായ പദാർഥവൈകല്യം [a] ആയി മാത്രം രേഖപ്പെടുത്തി.
