  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֤רְא רֵאשִׁית֙ ל֔/וֹ כִּי שָׁ֛ם חֶלְקַ֥ת מְחֹקֵ֖ק סָפ֑וּן וַ/יֵּתֵא֙ רָ֣אשֵׁי עָ֔ם צִדְקַ֤ת יְהוָה֙ עָשָׂ֔ה וּ/מִשְׁפָּטָ֖י/ו עִם יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/021.yaml
  text: He chose the best land for himself[a], because there the portion of the ruler was reserved. He came with the heads of the people; he carried out the righteousness of Yahweh[b], and his judgments with Israel.
translation:
  language: ml
  text: അവൻ തനിക്കായി ഏറ്റവും നല്ല ദേശം തിരഞ്ഞെടുത്തു[a]; കാരണം അവിടെ ഭരണാധികാരിയുടെ ഓഹരി നീക്കിവെച്ചിരുന്നു. അവൻ ജനത്തിന്റെ തലവന്മാരോടൊപ്പം വന്നു; അവൻ യഹോവയുടെ നീതി നടപ്പാക്കി[b], ഇസ്രായേലിനോടൊപ്പം യഹോവയുടെ ന്യായവിധികളും നടപ്പാക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഏറ്റവും നല്ല ദേശം’ എന്നതിനു പകരം ‘ആദ്യഭാഗം’ എന്നും വിവർത്തനം ചെയ്യാം. ‘ഭരണാധികാരി’ എന്നു വിവർത്തനം ചെയ്ത ഹീബ്രു പദത്തിന് ‘നിയമദാതാവ്’ എന്നും അർഥമാകാം; ചിലർ ഇത് മോശെയെ സൂചിപ്പിക്കുന്നതായി കാണുന്നു.
    reason: alternative_reading
  - marker: b
    text: ‘യഹോവയുടെ ന്യായം’ എന്നോ ‘യഹോവയുടെ നീതിപ്രവൃത്തികൾ’ എന്നോ വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: തിരഞ്ഞെടുത്തു
  rationale: പദശഃ ‘കണ്ടു’ എന്നാണെങ്കിലും, לֹו (‘തനിക്കായി’) എന്നതിനൊപ്പം ഇവിടെ ഒരു ഭാഗം നോക്കി തിരഞ്ഞെടുക്കുക എന്ന സന്ദർഭാർഥമാണ് സ്വാഭാവികം.
- source_word: רֵאשִׁית
  choice: ഏറ്റവും നല്ല ദേശം
  rationale: ഇവിടെ കാലപരമായ ‘ആരംഭം’ എന്നതിനെക്കാൾ ഗാദിന് ലഭിച്ച പ്രദേശത്തിന്റെ മുഖ്യമായോ ശ്രേഷ്ഠമായോ ഉള്ള ഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ദേശം’ സന്ദർഭത്തിൽ അന്തർനിഹിതമാണ്.
- source_word: חֶלְקַת
  choice: ഓഹരി
  rationale: അവകാശമായോ ഭൂവിഭാഗമായോ ലഭിക്കുന്ന നിശ്ചിത പങ്കിനെ സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: מְחֹקֵק
  choice: ഭരണാധികാരി
  rationale: ഈ പദത്തിന് ‘നിയമദാതാവ്’ എന്നും ‘ഭരണാധികാരി’ എന്നും അർഥമാകാം. വ്യക്തിയെ മോശെയായി ഉറപ്പിക്കാതെ അധികാരസ്ഥനെ സൂചിപ്പിക്കുന്ന പൊതുവായ വിവർത്തനം സ്വീകരിച്ചു.
- source_word: סָפוּן
  choice: നീക്കിവെച്ചിരുന്നു
  rationale: മറച്ചുവെക്കപ്പെട്ടതോ കരുതിവെക്കപ്പെട്ടതോ ആയ ഓഹരി എന്ന ആശയം ഈ സന്ദർഭത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: וַיֵּתֵא
  choice: വന്നു
  rationale: പുറപ്പെട്ടു/വന്നു എന്ന ചലനാർഥമുള്ള രൂപം; പിന്നാലെയുള്ള ‘ജനത്തിന്റെ തലവന്മാരോടൊപ്പം’ എന്ന പ്രയോഗത്തോട് ‘വന്നു’ സ്വാഭാവികമായി ചേരുന്നു.
- source_word: רָאשֵׁי עָם
  choice: ജനത്തിന്റെ തലവന്മാർ
  rationale: ‘ജനത്തിന്റെ തലകൾ’ എന്ന ഹീബ്രു രൂപകത്തിന്റെ അർഥമായ നേതാക്കളെ dignified, സാധാരണ മലയാളത്തിൽ നൽകുന്നു.
- source_word: צִדְקַת יְהוָה
  choice: യഹോവയുടെ നീതി
  rationale: צְדָקָה നീതി, നീതിപ്രവൃത്തി, ന്യായം എന്നിവ സൂചിപ്പിക്കാം. ‘നീതി’ മൂലപദത്തിന്റെ സംക്ഷിപ്തതയും ദൈവിക മാനദണ്ഡത്തിന്റെ ആശയവും നിലനിർത്തുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: וּמִשְׁפָּטָיו
  choice: അവന്റെ ന്യായവിധികൾ
  rationale: പ്രത്യയത്തിലെ ഏകവചന പുരുഷസൂചന യഹോവയിലേക്കാണ് സ്വാഭാവികമായി മടങ്ങുന്നത്; ബഹുവചനം ന്യായവിധികളെയോ നിയമനിർണയങ്ങളെയോ സൂചിപ്പിക്കുന്നു.
- source_word: עִם יִשְׂרָאֵל
  choice: ഇസ്രായേലിനോടൊപ്പം
  rationale: עִם എന്നതിന്റെ നേരിട്ടുള്ള ‘കൂടെ/ഒപ്പം’ എന്ന അർഥം നിലനിർത്തി, ഗാദ് ഇസ്രായേലിനൊപ്പം പ്രവർത്തിച്ചെന്ന ആശയം തുറന്നുവെക്കുന്നു.
theological_decisions:
- issue: מְחֹקֵק എന്ന പദത്തിന്റെ അർഥവും വ്യക്തിത്വവും
  choice: ‘ഭരണാധികാരി’ എന്ന് പൊതുവായി വിവർത്തനം ചെയ്തു; മോശെയെന്ന് വ്യക്തമായി തിരിച്ചറിഞ്ഞില്ല.
  alternative: ‘നിയമദാതാവ്’—മോശെയെ സൂചിപ്പിക്കുന്നതായി ചിലർ ഗ്രഹിക്കുന്നു; ‘നേതാവ്’ എന്നും സാധ്യമാണ്.
  rationale: ഹീബ്രു വാക്യം സംക്ഷിപ്തവും വ്യാഖ്യാനവൈവിധ്യമുള്ളതുമാണ്. വ്യക്തമായിട്ടില്ലാത്ത തിരിച്ചറിയൽ പാഠത്തിൽ ചേർക്കാതെ അധികാരത്തിന്റെ ആശയം നിലനിർത്തുന്നു.
- issue: צִדְקַת יְהוָה എന്നതിന്റെ പരിധി
  choice: ‘യഹോവയുടെ നീതി’ എന്ന് വിവർത്തനം ചെയ്തു.
  alternative: ‘യഹോവയുടെ ന്യായം’ അല്ലെങ്കിൽ ‘യഹോവയുടെ നീതിപ്രവൃത്തികൾ’.
  rationale: ഈ ഘടന ദൈവത്തിന്റെ നീതിഗുണത്തെയോ അവന്റെ നീതിയുള്ള പ്രവൃത്തികളെയോ സൂചിപ്പിക്കാം; പ്രധാന പാഠത്തിൽ സംക്ഷിപ്തമായ രൂപം നിലനിർത്തി വ്യത്യസ്ത സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. കവിതാസ്വഭാവമുള്ള ഹീബ്രു വാക്യത്തിന്റെ സംക്ഷിപ്തത കഴിയുന്നത്ര നിലനിർത്തി; എന്നാൽ അവസാന ഭാഗത്തിലെ സമാന്തര ക്രിയ മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ആവർത്തിച്ചു. ദൈവനാമം ‘യഹോവ’യായി നൽകി.
