- from: മോശെ നമുക്കായി ഒരു നിയമം കല്പിച്ചു[a][b]; അത് യാക്കോബിന്റെ സഭയ്ക്കുള്ള അവകാശമാണ്.
  to: മോശെ നമുക്കായി ഒരു നിയമം കല്പിച്ചു[a][b]; അത് യാക്കോബിന്റെ സമൂഹത്തിന്റെ പൈതൃകമാണ്.
