  text: Moses commanded a law for us[b][a], an inheritance for the assembly of Jacob.
translation:
  language: ml
  text: മോശെ നമുക്കായി ഒരു നിയമം കല്പിച്ചു[a][b]; അത് യാക്കോബിന്റെ സമൂഹത്തിന്റെ പൈതൃകമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “മോശെ നമുക്കു കല്പിച്ച നിയമം—യാക്കോബിന്റെ സമൂഹത്തിന്റെ പൈതൃകം.” എബ്രായ വാക്യഘടന സംക്ഷിപ്തമാണ്; ‘പൈതൃകം’ എന്നത് ‘നിയമം’ എന്നതിനോടു ചേർന്ന വിശദീകരണമായി വായിക്കാം.'
    reason: alternative_reading
  - marker: b
    text: ‘നിയമം’ എന്നത് ‘ഉപദേശം’ എന്നും, ‘പൈതൃകം’ എന്നത് ‘അവകാശസ്വത്ത്’ അല്ലെങ്കിൽ ‘പാരമ്പര്യസ്വത്ത്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרָה
  choice: നിയമം
  rationale: ഈ ഉടമ്പടിപരമായ സന്ദർഭത്തിൽ മോശെയിലൂടെ ഇസ്രായേലിനു ലഭിച്ച അധികാരപൂർവമായ ഉപദേശ-നിയമസംഹിതയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ഉപദേശം’ എന്ന വിശാലാർഥം സാധ്യമെങ്കിലും ഇവിടെ ‘നിയമം’ പൊതുവായ വായനക്കാർക്ക് കൂടുതൽ വ്യക്തമാണ്.
- source_word: צִוָּה
  choice: കല്പിച്ചു
  rationale: കല്പനയുടെ അധികാരസ്വഭാവം നിലനിർത്തുന്നു; ‘നൽകി’ എന്നതിനെക്കാൾ എബ്രായ ക്രിയയുടെ ശക്തി കൃത്യമായി പകരുന്നു.
- source_word: לָנוּ
  choice: നമുക്കായി
  rationale: ലְ എന്ന ഉപസർഗത്തിന്റെ ‘നമുക്ക്/നമുക്കായി’ എന്ന സാധ്യതകളിൽ, നിയമം ജനത്തിനായി കല്പിക്കപ്പെട്ടതും അവരുടെ ബാധ്യതയും അവകാശവുമായതും സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: מֹשֶׁה
  choice: മോശെ
  rationale: മലയാളത്തിൽ പ്രചാരത്തിലുള്ള വ്യക്തിനാമരൂപം.
- source_word: מוֹרָשָׁה
  choice: അവകാശം
  rationale: തലമുറകളായി കൈവശം ലഭിക്കുന്ന അവകാശസ്വത്ത് എന്ന ആശയം ലളിതമായി നൽകുന്നു. ‘പൈതൃകം’, ‘അവകാശസ്വത്ത്’ എന്നിവയും സാധ്യമാണ്.
- source_word: קְהִלַּת
  choice: സഭ
  rationale: ഒന്നിച്ചുകൂടിയ ഉടമ്പടിജനസമൂഹം എന്ന കൂട്ടായ അർഥം ചുരുക്കമായും ഗൗരവത്തോടെയും നൽകുന്നു; ഇവിടെ പിൽക്കാല സഭാസ്ഥാപനത്തെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നില്ല.
- source_word: יַעֲקֹב
  choice: യാക്കോബ്
  rationale: മൂലപാഠത്തിലെ പേര് വ്യാഖ്യാനിച്ച് ‘ഇസ്രായേൽ’ എന്നു മാറ്റാതെ അതേപടി നിലനിർത്തുന്നു.
theological_decisions:
- issue: രണ്ടു നാമഘടകങ്ങൾ തമ്മിലുള്ള വാക്യഘടനാബന്ധം
  choice: ആദ്യഭാഗത്തെ മോശെ നിയമം കല്പിച്ചു എന്ന പ്രസ്താവനയായും രണ്ടാംഭാഗത്തെ ആ നിയമം യാക്കോബിന്റെ സഭയുടെ അവകാശമാണെന്ന ബന്ധിത പ്രസ്താവനയായും പരിഭാഷപ്പെടുത്തി.
  alternative: ‘മോശെ നമുക്കു കല്പിച്ച നിയമം—യാക്കോബിന്റെ സഭയുടെ അവകാശം’ എന്ന അടുക്കിവെച്ച വിശേഷണസമാന വായന.
  rationale: രണ്ടാം പകുതിയിൽ ക്രിയയില്ലാത്തതിനാൽ എബ്രായ വാക്യഘടന സംക്ഷിപ്തവും ഒന്നിലധികം വിധത്തിൽ ബന്ധിപ്പിക്കാവുന്നതുമാണ്. മുഖ്യപാഠം അർഥബന്ധം വ്യക്തമാക്കുന്നു; അടുക്കിവെച്ച വായന അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. കവിതാസംക്ഷിപ്തത പൂർണമായി നഷ്ടപ്പെടാതിരിക്കാൻ രണ്ട് ബന്ധിത പ്രസ്താവനകൾ അർധവിരാമംകൊണ്ട് ചേർത്തു; അപൂർവമോ അതിയായി സഭാപരമോ ആയ സാങ്കേതിക പദങ്ങൾ ഒഴിവാക്കി.
