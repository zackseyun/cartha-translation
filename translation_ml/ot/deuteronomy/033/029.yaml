id: DEU.33.29
reference: Deuteronomy 33:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אַשְׁרֶ֨י/ךָ יִשְׂרָאֵ֜ל מִ֣י כָמ֗וֹ/ךָ עַ֚ם נוֹשַׁ֣ע בַּֽ/יהוָ֔ה מָגֵ֣ן עֶזְרֶ֔/ךָ וַ/אֲשֶׁר חֶ֖רֶב גַּאֲוָתֶ֑/ךָ וְ/יִכָּֽחֲשׁ֤וּ אֹיְבֶ֨י/ךָ֙ לָ֔/ךְ וְ/אַתָּ֖ה עַל בָּמוֹתֵ֥י/מוֹ תִדְרֹֽךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/029.yaml
  text: Blessed are you[a], Israel! Who is like you, a people saved by Yahweh, the shield of your help and the sword of your majesty? Your enemies will come cringing to you[b], and you will tread on their high places.
translation:
  language: ml
  text: 'ഇസ്രായേലേ, നീ എത്ര ഭാഗ്യവാൻ!


    നിന്നെപ്പോലെ ആരുണ്ട്?


    യഹ്‌വെയാൽ രക്ഷിക്കപ്പെട്ട ജനം നീ!


    അവൻ നിന്റെ സഹായത്തിന്റെ പരിചയും


    നിന്റെ മഹത്ത്വത്തിന്റെ വാളുമാകുന്നു.


    നിന്റെ ശത്രുക്കൾ നിന്റെ മുമ്പിൽ ഭയന്ന് കീഴടങ്ങും[a];


    നീ അവരുടെ ഉയരങ്ങൾ ചവിട്ടിമെതിക്കും[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്റെ ശത്രുക്കൾ നിനക്കു കപടമായി കീഴടങ്ങും.” എബ്രായ ക്രിയ നിർബന്ധിതമോ ആത്മാർഥതയില്ലാത്തതോ ആയ കീഴടങ്ങലിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “നീ അവരുടെ ഉയർന്ന സ്ഥലങ്ങൾ/കോട്ടകൾ ചവിട്ടിമെതിക്കും.” ഇവിടെ ചിലർ “അവരുടെ മുതുകുകൾ” എന്നും മനസ്സിലാക്കുന്നു; എന്നാൽ എബ്രായ നാമത്തിന്റെ കൂടുതൽ നേരിട്ടുള്ള അർഥം “ഉയരങ്ങൾ” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֶיךָ
  choice: നീ എത്ര ഭാഗ്യവാൻ
  rationale: അശ്രേ എന്ന ബഹുവചനരൂപത്തിലുള്ള ഉദ്‌ഘോഷം അനുഗൃഹീതവും അഭിലഷണീയവുമായ അവസ്ഥയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ ഉദ്‌ഘോഷഭാവം നിലനിർത്താൻ ഈ പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: מִי כָמוֹךָ
  choice: നിന്നെപ്പോലെ ആരുണ്ട്?
  rationale: ഇസ്രായേലിന്റെ അതുല്യത പ്രഖ്യാപിക്കുന്ന അലങ്കാരചോദ്യത്തെ നേരിട്ടും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
- source_word: עַם נוֹשַׁע בַּיהוָה
  choice: യഹ്‌വെയാൽ രക്ഷിക്കപ്പെട്ട ജനം
  rationale: നിഫാൽ കൃദന്തരൂപത്തിന്റെ കർമണിപ്രയോഗവും യഹ്‌വെ നൽകുന്ന വിടുതൽ ഇസ്രായേലിനെ വിശേഷിപ്പിക്കുന്നുവെന്ന ആശയവും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായ ദൈവനാമമായ ചതുർവ്യഞ്ജനത്തെ ഒരു സ്ഥാനപ്പേര് ഉപയോഗിച്ച് മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: מָגֵן עֶזְרֶךָ
  choice: നിന്റെ സഹായത്തിന്റെ പരിച
  rationale: സങ്കുചിതമായ എബ്രായ സംയുക്തപ്രയോഗം കഴിയുന്നത്ര അടുത്ത് നിലനിർത്തുകയും യഹ്‌വെ ഇസ്രായേലിന്റെ സംരക്ഷണസഹായത്തിന്റെ ഉറവിടമാണെന്ന ചിത്രം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: וַאֲשֶׁר חֶרֶב גַּאֲוָתֶךָ
  choice: നിന്റെ മഹത്ത്വത്തിന്റെ വാൾ
  rationale: മുൻപത്തെ നാമവിശേഷണത്തോട് സമാന്തരമായ അപൂർണവാക്യഘടന നിലനിർത്തുന്നു. גַּאֲוָה ഇവിടെ നിഷേധാത്മകമായ അഹങ്കാരത്തേക്കാൾ ഉയർച്ചയെയും ബഹുമാനത്തെയും സൂചിപ്പിക്കുന്നതിനാൽ ‘മഹത്ത്വം’ തിരഞ്ഞെടുത്തു.
- source_word: וְיִכָּחֲשׁוּ אֹיְבֶיךָ לָךְ
  choice: നിന്റെ ശത്രുക്കൾ നിന്റെ മുമ്പിൽ ഭയന്നു കീഴടങ്ങും
  rationale: ക്രിയ സൂചിപ്പിക്കാവുന്ന നിർബന്ധിതമോ ഭയജനിതമോ ആയ കീഴടങ്ങൽ വായനാസൗകര്യത്തോടെ നൽകുന്നു; അതിലുള്ള കപടമോ ആത്മാർഥതയില്ലാത്തതോ ആയ അനുസരണത്തിന്റെ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: עַל בָּמוֹתֵימוֹ תִדְרֹךְ
  choice: നീ അവരുടെ ഉന്നതസ്ഥാനങ്ങൾ ചവിട്ടിമെതിക്കും
  rationale: בָּמוֹת എന്ന പദത്തിന്റെ നേരിട്ടുള്ള ‘ഉയരങ്ങൾ/ഉന്നതസ്ഥാനങ്ങൾ’ എന്ന അർഥവും യുദ്ധവിജയത്തിന്റെ ചവിട്ടിമെതിക്കൽ ചിത്രവും നിലനിർത്തുന്നു; കോട്ടകൾ അല്ലെങ്കിൽ മുതുകുകൾ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം തന്നെയായതിനാൽ അതിനെ പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- issue: גַּאֲוָתֶךָ എന്ന പദത്തിന്റെ ഭാവം
  choice: നിന്റെ മഹത്ത്വം
  alternative: നിന്റെ അഹങ്കാരം; നിന്റെ ഉയർച്ച; നിന്റെ മഹിമ
  rationale: അനുഗ്രഹത്തിന്റെ സന്ദർഭത്തിൽ പദത്തിന് ഉയർന്ന ബഹുമാനവും പ്രതാപവുമാണ് പ്രധാനം. ‘അഹങ്കാരം’ അനാവശ്യമായ നൈതികനിഷേധം ചേർക്കുമെന്നതിനാൽ ഒഴിവാക്കി.
- issue: ശത്രുക്കളുടെ കീഴടങ്ങലിന്റെ സ്വഭാവം
  choice: ഭയന്നു കീഴടങ്ങും
  alternative: കപടമായി കീഴടങ്ങും
  rationale: כחשׁ എന്ന ക്രിയയിൽ നിർബന്ധിതമായ, ഭയജനിതമായ, അല്ലെങ്കിൽ ആത്മാർഥതയില്ലാത്ത അനുസരണം ഉൾക്കൊള്ളാം. മുഖ്യപാഠം ഒരു സാധ്യത വ്യക്തമാക്കുമ്പോൾ കപടതയുടെ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കാവ്യഭാഷയാണ് ഉപയോഗിച്ചത്. ചെറുവരികളും ഉദ്‌ഘോഷവും അലങ്കാരചോദ്യവും മോശെയുടെ അനുഗ്രഹത്തിന്റെ കവിതാത്മക താളം നിലനിർത്തുന്നു. ദുർഗ്രഹമായ പദപ്രയോഗങ്ങൾ ലളിതമാക്കിയെങ്കിലും മൂലത്തിലെ രൂപകങ്ങളും അർഥസന്ദിഗ്ധതകളും അടിക്കുറിപ്പുകളിലൂടെ സംരക്ഷിച്ചു.
