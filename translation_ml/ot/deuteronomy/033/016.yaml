  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מִ/מֶּ֗גֶד אֶ֚רֶץ וּ/מְלֹאָ֔/הּ וּ/רְצ֥וֹן שֹׁכְנִ֖י סְנֶ֑ה תָּב֨וֹאתָ/ה֙ לְ/רֹ֣אשׁ יוֹסֵ֔ף וּ/לְ/קָדְקֹ֖ד נְזִ֥יר אֶחָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/016.yaml
  text: and with the choicest things of the earth and its fullness[a], and the favor of the one who dwelt in the bush—may it come on the head of Joseph[b], and on the crown of the head of the one set apart from his brothers.
translation:
  language: ml
  text: 'ഭൂമിയുടെ വിശിഷ്ടവിഭവങ്ങളും അതിലുള്ള സകലസമൃദ്ധിയും,


    മുൾപ്പടർപ്പിൽ വസിച്ചവന്റെ പ്രസാദവും[a]—


    ഇതെല്ലാം യോസേഫിന്റെ ശിരസ്സിന്മേലും


    സഹോദരന്മാരിൽനിന്നു വേർതിരിക്കപ്പെട്ടവന്റെ നെറുകയിന്മേലും[b] വരട്ടെ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മുൾപ്പടർപ്പിൽ വസിച്ചവൻ’ എന്നത് കത്തുന്ന മുൾപ്പടർപ്പിൽ മോശയ്ക്കു പ്രത്യക്ഷനായ ദൈവത്തെ അനുസ്മരിപ്പിക്കുന്നു.
    reason: historical_allusion
  - marker: b
    text: ‘സഹോദരന്മാരുടെ ഇടയിൽ പ്രഭുവായവൻ’ അല്ലെങ്കിൽ ‘സഹോദരന്മാരുടെ ഇടയിൽ സമർപ്പിക്കപ്പെട്ടവൻ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം വേർതിരിക്കപ്പെട്ട നിലയെ ഊന്നുന്നു; ഇവിടെ അത് യോസേഫിന്റെ പ്രാമുഖ്യവും സൂചിപ്പിച്ചേക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: מִמֶּגֶד אֶרֶץ
  choice: ഭൂമിയുടെ വിശിഷ്ടവിഭവങ്ങളും
  rationale: മֶגֶד അനുഗ്രഹസന്ദർഭത്തിൽ വിലയേറിയതോ ഏറ്റവും നല്ലതോ ആയ വിളവുകളെയും വിഭവങ്ങളെയും സൂചിപ്പിക്കുന്നു. അֶרֶץ എന്നതിന് ‘ഭൂമി’ എന്നും ‘ദേശം’ എന്നും അർഥമാകാമെങ്കിലും, ‘അതിലുള്ള സകലസമൃദ്ധി’ എന്ന സമാന്തരപ്രയോഗത്തോടൊപ്പം ഇവിടെ വിശാലമായ ‘ഭൂമി’ സ്വാഭാവികമാണ്.
- source_word: וּמְלֹאָהּ
  choice: അതിലുള്ള സകലസമൃദ്ധിയും
  rationale: പദശഃ ‘അതിന്റെ നിറവ്’ എന്നാണെങ്കിലും, ഭൂമിയിൽ നിറഞ്ഞിരിക്കുന്നതെല്ലാം എന്ന കാവ്യാർഥം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וּרְצוֹן
  choice: പ്രസാദവും
  rationale: רָצוֹן ഇവിടെ ദൈവത്തിന്റെ അനുകൂലപ്രീതിയെയോ കൃപാപൂർവമായ അംഗീകാരത്തെയോ സൂചിപ്പിക്കുന്നു. ‘പ്രസാദം’ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ മലയാളപ്രയോഗമാണ്.
- source_word: שֹׁכְנִי סְנֶה
  choice: മുൾപ്പടർപ്പിൽ വസിച്ചവന്റെ
  rationale: ഈ വിശേഷണം മുൾപ്പടർപ്പിൽ മോശയ്ക്കു പ്രത്യക്ഷനായ ദൈവത്തെ സൂചിപ്പിക്കുന്നു. വിവരണാത്മക രൂപം നിലനിർത്തുന്നത് സൂചന വ്യക്തമാക്കുകയും മൂലപാഠത്തിൽ ഇല്ലാത്ത ദൈവനാമം മുഖ്യവാചകത്തിൽ ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: תָּבוֹאתָה
  choice: ഇവ ... വരട്ടെ
  rationale: ഹീബ്രായ ഏകവചനക്രിയ മുൻപറഞ്ഞ അനുഗ്രഹത്തെ ഒരു സമഗ്രതയായി കാണുന്നു. മലയാളത്തിൽ പല ഘടകങ്ങളെ പരാമർശിച്ചതിനാൽ ‘ഇവ ... വരട്ടെ’ എന്നത് ആശംസാരൂപവും സ്വാഭാവികതയും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: לְרֹאשׁ יוֹסֵף
  choice: യോസേഫിന്റെ ശിരസ്സിന്മേൽ
  rationale: അനുഗ്രഹം ഒരാളുടെ തലമേൽ വരുന്നു എന്ന ഹീബ്രായ കാവ്യപ്രയോഗം ഔപചാരികവും വ്യക്തവുമായ രീതിയിൽ സംരക്ഷിക്കുന്നു.
- source_word: וּלְקָדְקֹד
  choice: നെറുകയിന്മേൽ
  rationale: קָדְקֹד തലയുടെ മുകൾഭാഗത്തെയോ നെറുകയെയോ സൂചിപ്പിക്കുന്നു. മുൻവരിയിലെ ‘ശിരസ്സ്’ എന്ന പദത്തോടുള്ള കാവ്യസമാന്തരത ആവർത്തനഭാരം കൂടാതെ നിലനിർത്തുന്നു.
- source_word: נְזִיר אֶחָיו
  choice: സഹോദരന്മാരിൽനിന്നു വേർതിരിക്കപ്പെട്ടവന്റെ
  rationale: נָזִיר എന്നതിന്റെ അടിസ്ഥാനധ്വനി വേർതിരിക്കപ്പെട്ടവൻ അഥവാ സമർപ്പിക്കപ്പെട്ടവൻ എന്നതാണ്. യോസേഫിന്റെ കാര്യത്തിൽ ഇത് സഹോദരന്മാരിൽ അവനുള്ള പ്രാമുഖ്യവും സൂചിപ്പിച്ചേക്കാം; മുഖ്യവാചകം ആ സാധ്യതകളിൽ ഒന്നിനെ നിർബന്ധമായി ഉറപ്പിക്കുന്നില്ല.
theological_decisions:
- issue: ‘മുൾപ്പടർപ്പിൽ വസിച്ചവൻ’ എന്ന വിശേഷണത്തിന്റെ തിരിച്ചറിയൽ
  choice: കത്തുന്ന മുൾപ്പടർപ്പിൽ മോശയ്ക്കു വെളിപ്പെട്ട ദൈവത്തെ സൂചിപ്പിക്കുന്ന വിവരണാത്മക ദൈവവിശേഷണമായി നിലനിർത്തി.
  alternative: സീനായി/ഹോരേബുമായി ബന്ധപ്പെട്ട ഒരു പൊതുവായ ദൈവപ്രത്യക്ഷതയായി മാത്രം വായിക്കുക.
  rationale: പദപ്രയോഗം പുറപ്പാട് 3-ലെ ദൈവവെളിപ്പാടിനെ ശക്തമായി അനുസ്മരിപ്പിക്കുന്നു. എങ്കിലും ‘ദൈവം’ എന്ന പദം മൂലവാചകത്തിൽ നേരിട്ട് ചേർക്കാതെ വിവരണരൂപം നിലനിർത്തുന്നത് മൂലത്തിന്റെ കാവ്യസ്വഭാവം സംരക്ഷിക്കുന്നു.
- issue: נְזִיר אֶחָיו എന്നതിലെ വേർതിരിവും പ്രാമുഖ്യവും
  choice: ‘സഹോദരന്മാരിൽനിന്നു വേർതിരിക്കപ്പെട്ടവൻ’ എന്നു മുഖ്യവാചകത്തിൽ നൽകി.
  alternative: ‘സഹോദരന്മാരുടെ ഇടയിൽ പ്രഭുവായവൻ’ അല്ലെങ്കിൽ ‘സഹോദരന്മാരുടെ ഇടയിൽ സമർപ്പിക്കപ്പെട്ടവൻ.’
  rationale: പദത്തിന്റെ അടിസ്ഥാനാർഥമായ വേർതിരിക്കപ്പെടൽ നിലനിർത്തിക്കൊണ്ട്, യോസേഫിന്റെ ഉന്നതസ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന സാധ്യത അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കാവ്യഭാഷയാണ് ഉപയോഗിച്ചത്. ‘ശിരസ്സ്’, ‘നെറുക’, ‘പ്രസാദം’ എന്നിവ ഔപചാരികമായെങ്കിലും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പദങ്ങളാണ്. ഹീബ്രായ സമാന്തരഘടന വരിവിഭജനത്തിലൂടെ നിലനിർത്തി.
