source:
  edition: WLC
  text: אַ֚ף חֹבֵ֣ב עַמִּ֔ים כָּל קְדֹשָׁ֖י/ו בְּ/יָדֶ֑/ךָ וְ/הֵם֙ תֻּכּ֣וּ לְ/רַגְלֶ֔/ךָ יִשָּׂ֖א מִ/דַּבְּרֹתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/003.yaml
  text: Indeed[a], he loves the peoples; all his holy ones are in your hand, and they sit down at your feet[b]; each receives your words.
translation:
  language: ml
  text: തീർച്ചയായും, അവൻ ജനതകളെ സ്നേഹിക്കുന്നു; അവന്റെ വിശുദ്ധർ എല്ലാവരും നിന്റെ കൈയിലാണ്. അവർ നിന്റെ കാൽക്കൽ ഇരിക്കുന്നു[a]; ഓരോരുത്തനും നിന്റെ വചനങ്ങൾ സ്വീകരിക്കുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവർ ഇരിക്കുന്നു’ എന്നതിന്റെ എബ്രായപദം അനിശ്ചിതമാണ്; ‘അവർ ഒന്നിച്ചുകൂടി,’ ‘അവർ കുനിഞ്ഞിരിക്കുന്നു,’ അല്ലെങ്കിൽ ‘അവർ അടിച്ചുവീഴ്ത്തപ്പെട്ടു’ എന്നും മനസ്സിലാക്കിയിട്ടുണ്ട്.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, ‘ഓരോരുത്തനും നിന്റെ വചനങ്ങളിൽനിന്ന് എടുത്തുകൊള്ളുന്നു’ / ‘നിന്റെ അരുളപ്പാടുകൾ വഹിക്കുന്നു’; എബ്രായപ്രയോഗം അപൂർവവും ദുഷ്കരവുമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: തീർച്ചയായും
  rationale: ഇവിടെ ഈ പദം കൂട്ടിച്ചേർക്കൽ സൂചിപ്പിക്കുന്നതിനെക്കാൾ പ്രസ്താവനയ്ക്ക് ഊന്നൽ നൽകുന്നു.
- source_word: חֹבֵב
  choice: സ്നേഹിക്കുന്നു
  rationale: തുടരുന്ന സ്നേഹമനോഭാവം സൂചിപ്പിക്കുന്ന കൃതന്തത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: עַמִּים
  choice: ജനതകളെ
  rationale: ബഹുവചന കൂട്ടായ അർഥം നിലനിർത്തുകയും ‘വിജാതീയർ’ എന്ന പരിമിത വ്യാഖ്യാനം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: כָּל קְדֹשָׁיו
  choice: അവന്റെ വിശുദ്ധരായ എല്ലാവരും
  rationale: ദൂതന്മാരെയോ ഇസ്രായേലിനെയോ മാത്രം സൂചിപ്പിക്കുന്നതായി നിർണയിക്കാതെ, വേർതിരിക്കപ്പെട്ട വിശുദ്ധർ എന്ന വിശാലത നിലനിർത്തുന്നു.
- source_word: בְּיָדֶךָ
  choice: നിന്റെ കൈയിൽ
  rationale: എബ്രായത്തിലെ വ്യക്തിമാറ്റവും കൈ എന്ന പ്രതീകാത്മക പ്രയോഗവും അതേപടി സംരക്ഷിക്കുന്നു.
- source_word: תֻּכּוּ
  choice: അവർ ... ഇരിക്കുന്നു
  rationale: അവ്യക്തമായ ക്രിയയ്ക്ക്, കാൽക്കൽ നിന്നു വചനങ്ങൾ സ്വീകരിക്കുന്ന സന്ദർഭത്തോട് ഏറ്റവും യോജിക്കുന്ന അർഥം; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: לְרַגְלֶךָ
  choice: നിന്റെ കാൽക്കൽ
  rationale: ശിഷ്യത്വം, കീഴടങ്ങൽ, ശ്രവണം എന്നിവ സൂചിപ്പിക്കാവുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: יִשָּׂא
  choice: സ്വീകരിക്കുന്നു
  rationale: അടിസ്ഥാന അർഥമായ ‘എടുക്കുക/വഹിക്കുക’ എന്നതിൽനിന്ന്, വചനങ്ങളോടൊപ്പം സന്ദർഭോചിതമായ സ്വീകരിക്കൽ എന്ന അർഥം നൽകുന്നു.
- source_word: מִדַּבְּרֹתֶיךָ
  choice: നിന്റെ വചനങ്ങൾ
  rationale: അപൂർവവും ദുഷ്കരവുമായ രൂപത്തിന്റെ സംസാരവചനസംബന്ധിയായ അർഥം വ്യക്തമായി നൽകുന്നു; മുൻപ്രത്യയത്തിന്റെ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: കാവ്യത്തിലെ സർവനാമമാറ്റം
  choice: ‘അവൻ/അവന്റെ’ എന്ന മൂന്നാംപുരുഷത്തിൽനിന്ന് ‘നിന്റെ’ എന്ന രണ്ടാംപുരുഷത്തിലേക്കുള്ള മാറ്റം നിലനിർത്തി.
  alternative: എല്ലാ സർവനാമങ്ങളും മൂന്നാംപുരുഷത്തിലോ രണ്ടാംപുരുഷത്തിലോ ഏകീകരിക്കുക.
  rationale: മൂലപാഠത്തിലെ ശ്രദ്ധേയമായ കാവ്യഘടനയും അതിലെ ഉദ്ദേശ്യപൂർവമോ ദുഷ്കരമോ ആയ വ്യക്തിമാറ്റവും ലളിതമാക്കി ഇല്ലാതാക്കാതിരിക്കാനാണ്.
- issue: ‘വിശുദ്ധർ’ ആരെന്ന തിരിച്ചറിയൽ
  choice: ‘അവന്റെ വിശുദ്ധരായ എല്ലാവരും’ എന്നു വിശാലമായി പരിഭാഷപ്പെടുത്തി.
  alternative: ദൂതന്മാർ, ഇസ്രായേലിലെ വിശുദ്ധജനം, അല്ലെങ്കിൽ സഭാവിശുദ്ധർ എന്നു പ്രത്യേകമായി നിർവചിക്കുക.
  rationale: സന്ദർഭം ഒരു വിഭാഗത്തെ നിർബന്ധമായി നിശ്ചയിക്കുന്നില്ല; അതിനാൽ ദൈവശാസ്ത്രപരമായ പരിമിത നിർവചനം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘വചനങ്ങൾ’ എന്നത് ബൈബിൾസന്ദർഭത്തിന് യോജിച്ചെങ്കിലും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പദമാണ്. മൂലത്തിലെ മൂന്നാംപുരുഷ–രണ്ടാംപുരുഷ മാറ്റവും ദുഷ്കരമായ ക്രിയകളുടെ അനിശ്ചിതത്വവും സംരക്ഷിച്ചു.
