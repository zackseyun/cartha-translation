id: DEU.33.1
reference: Deuteronomy 33:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/זֹ֣את הַ/בְּרָכָ֗ה אֲשֶׁ֨ר בֵּרַ֥ךְ מֹשֶׁ֛ה אִ֥ישׁ הָ/אֱלֹהִ֖ים אֶת בְּנֵ֣י יִשְׂרָאֵ֑ל לִ/פְנֵ֖י מוֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/001.yaml
  text: 'This is the blessing with which Moses[a], the man of God, blessed the sons of Israel before his death:'
translation:
  language: ml
  text: 'ദൈവപുരുഷനായ മോശെ തന്റെ മരണത്തിനുമുമ്പ് യിസ്രായേൽമക്കളെ[a] അനുഗ്രഹിച്ച അനുഗ്രഹം ഇതാണ്:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘യിസ്രായേലിന്റെ പുത്രന്മാർ’; ഇത് യിസ്രായേൽജനത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്ന സ്ഥിരപ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת
  choice: ഇതാണ്
  rationale: വാക്യാരംഭത്തിലെ സംയോജകവും സൂചകസർവനാമവും ചേർന്ന് പുതിയ ഭാഗം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ഇതാണ്’ എന്നത് സ്വാഭാവികമായി ആ അവതരണബലം നൽകുന്നു; ഉറവിടത്തിൽ വ്യക്തമായ കാലസൂചകപദമില്ലാത്തതിനാൽ ‘ഇപ്പോൾ’ ചേർത്തിട്ടില്ല.
- source_word: הַבְּרָכָה
  choice: അനുഗ്രഹം
  rationale: ഔപചാരികമായ അനുഗ്രഹപ്രഖ്യാപനത്തെയാണ് നാമം സൂചിപ്പിക്കുന്നത്. നിർദ്ദിഷ്ടത ‘ഇതാണ്’ എന്ന വാക്യഘടനയിൽ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: אֲשֶׁר בֵּרַךְ
  choice: അനുഗ്രഹിച്ച
  rationale: ‘അനുഗ്രഹം’ എന്ന നാമത്തെ വിശേഷിപ്പിക്കുന്ന ബന്ധവാക്യം മലയാളത്തിൽ കൃത്യവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു; എബ്രായത്തിലെ നാമ-ക്രിയ ആവർത്തനവും സംരക്ഷിക്കുന്നു.
- source_word: מֹשֶׁה
  choice: മോശെ
  rationale: മലയാള ബൈബിൾ ഭാഷയിൽ സുപരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ദൈവപുരുഷൻ
  rationale: ദൈവത്താൽ നിയോഗിക്കപ്പെട്ട വ്യക്തിയെയോ പ്രവാചകനെയോ സൂചിപ്പിക്കുന്ന അംഗീകൃത എബ്രായ സ്ഥാനപ്പേര് സംക്ഷിപ്തവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: യിസ്രായേൽമക്കളെ
  rationale: അക്ഷരാർഥം ‘യിസ്രായേലിന്റെ പുത്രന്മാർ’ എന്നാണെങ്കിലും ഇത് യിസ്രായേൽജനത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്ന സ്ഥിരപ്രയോഗമാണ്. ‘യിസ്രായേൽമക്കൾ’ കുടുംബബന്ധവും കൂട്ടായ അർഥവും സ്വാഭാവികമായി നിലനിർത്തുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: לִפְנֵי מוֹתוֹ
  choice: തന്റെ മരണത്തിനുമുമ്പ്
  rationale: മോശെയുടെ മരണത്തിനു മുമ്പ് എന്ന കാലബന്ധം ഉറവിടത്തിലെ നാമരൂപഘടനയോട് അടുത്തുനിൽക്കുന്ന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. ‘തന്റെ’ എന്നത് കർത്താവായ മോശെയിലേക്കുള്ള ബന്ധം അസന്ദിഗ്ധമാക്കുന്നു.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ലിംഗസൂചക കൂട്ടപ്രയോഗത്തിന്റെ പരിഭാഷ
  choice: യിസ്രായേൽമക്കൾ
  alternative: യിസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: എബ്രായരൂപം വ്യാകരണപരമായി പുല്ലിംഗ ബഹുവചനമായ ‘പുത്രന്മാർ’ എന്നാണ്; എന്നാൽ ഇവിടെ അത് യിസ്രായേൽജനത്തെ മുഴുവനായി സൂചിപ്പിക്കുന്ന പരമ്പരാഗത കൂട്ടപ്രയോഗമാണ്. മുഖ്യവാചകത്തിൽ ‘യിസ്രായേൽമക്കൾ’ ഉപയോഗിക്കുന്നത് കുടുംബപരമായ രൂപവും വിശാലമായ കൂട്ടസൂചനയും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു; ഉറവിടത്തിലെ ലിംഗരൂപം അടിക്കുറിപ്പിൽ മറച്ചുവയ്ക്കാതെ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘അനുഗ്രഹിച്ച അനുഗ്രഹം’ എന്ന ആവർത്തനം മലയാളത്തിൽ അല്പം ഔപചാരികമായി തോന്നാമെങ്കിലും ഉറവിടത്തിലെ בֵּרַךְ / בְּרָכָה പദബന്ധം ഉദ്ദേശപൂർവം സംരക്ഷിച്ചിരിക്കുന്നു. വാക്യാവസാനത്തിലെ ദ്വിബിന്ദു തുടർന്നുവരുന്ന അനുഗ്രഹപ്രഖ്യാപനത്തെ പരിചയപ്പെടുത്തുന്നു.
