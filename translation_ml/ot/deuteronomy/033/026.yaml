source:
  edition: WLC
  text: אֵ֥ין כָּ/אֵ֖ל יְשֻׁר֑וּן רֹכֵ֤ב שָׁמַ֨יִם֙ בְ/עֶזְרֶ֔/ךָ וּ/בְ/גַאֲוָת֖/וֹ שְׁחָקִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/026.yaml
  text: There is none like God[a], O Jeshurun, who rides on the heavens to help you[c][b], and in his majesty on the skies.
translation:
  language: ml
  text: 'യെശുരൂനേ[a], ദൈവത്തെപ്പോലെ ആരുമില്ല!


    നിന്റെ സഹായത്തിനായി[b] അവൻ ആകാശങ്ങൾക്കുമേൽ സവാരി ചെയ്യുന്നു,


    തന്റെ മഹിമയോടെ മേഘപടലങ്ങൾക്കുമേലും[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യെശുരൂൻ’ ഇസ്രായേലിന്റെ ഒരു കാവ്യനാമമാണ്.
    reason: cultural_note
  - marker: b
    text: ‘നിന്നെ സഹായിക്കാൻ’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: c
    text: ‘ആകാശമണ്ഡലങ്ങൾക്കുമേൽ’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין כָּאֵל
  choice: ദൈവത്തെപ്പോലെ ആരുമില്ല
  rationale: അസ്തിത്വനിഷേധത്തോടുകൂടിയ സമ്പൂർണ താരതമ്യം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; אֵל ഇവിടെ പൊതുവായ ദൈവിക സംജ്ഞയായാണ് എടുത്തിരിക്കുന്നത്.
- source_word: יְשֻׁרוּן
  choice: യെശുരൂനേ
  rationale: ഇസ്രായേലിന്റെ കാവ്യനാമം വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരിച്ചു; സംബോധനരൂപം മലയാളത്തിലെ ‘-ഏ’ ഉപയോഗിച്ച് വ്യക്തമാക്കി.
- source_word: רֹכֵב
  choice: സവാരി ചെയ്യുന്നു
  rationale: ദൈവം ആകാശത്തിന്മേൽ സവാരി ചെയ്യുന്നുവെന്ന ഉയർന്ന കാവ്യചിത്രം നിലനിർത്തുന്നു; പൊതുവായ ‘സഞ്ചരിക്കുന്നു’ എന്നതിനെക്കാൾ മൂലപദത്തിന്റെ ദൃശ്യരൂപത്തോട് അടുത്തതാണ്.
- source_word: שָׁמַיִם
  choice: ആകാശങ്ങൾ
  rationale: ഹീബ്രു ബഹുവചനവും ഉയർന്ന കാവ്യശൈലിയും നിലനിർത്താൻ ബഹുവചനരൂപം സ്വീകരിച്ചു.
- source_word: בְעֶזְרֶךָ
  choice: നിന്റെ സഹായത്തിനായി
  rationale: בְ എന്ന ഉപസർഗത്തിന്റെ പ്രയോജന/ലക്ഷ്യഭാവം നിലനിർത്തുന്ന, എന്നാൽ മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗം; ‘നിന്നെ സഹായിക്കാൻ’ എന്ന അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וּבְגַאֲוָתוֹ
  choice: തന്റെ മഹിമയിൽ
  rationale: ദൈവത്തെക്കുറിച്ചുള്ള സന്ദർഭത്തിൽ גַּאֲוָה സൂചിപ്പിക്കുന്ന ഉന്നതതയും രാജകീയ പ്രഭാവവും ‘മഹിമ’ സ്വാഭാവികമായി നൽകുന്നു; തെറ്റിദ്ധരിപ്പിക്കാവുന്ന ‘അഹങ്കാരം’ ഒഴിവാക്കി.
- source_word: שְׁחָקִים
  choice: മേഘമണ്ഡലങ്ങൾ
  rationale: മുകളിലെ ആകാശമേഖലയെയോ മേഘങ്ങളെയോ സൂചിപ്പിക്കുന്ന കാവ്യപദത്തിന്റെ ദൃശ്യഭാവം നിലനിർത്തുകയും שָׁמַיִם എന്നതിനോടുള്ള സമാന്തരത വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: കാവ്യപരമായ താരതമ്യത്തിൽ אֵל എന്നതിന്റെ സൂചന
  choice: പൊതുവായ ദൈവിക സംജ്ഞയായി ‘ദൈവം’
  alternative: ‘ഏൽ’ എന്ന നാമം; ‘ശക്തൻ’ എന്ന പദവി
  rationale: വാക്യം ഇസ്രായേലിന്റെ ദൈവത്തിന്റെ അതുല്യതയെ പുകഴ്ത്തുന്നു. ‘ദൈവം’ എന്നത് ഏകദൈവവിശ്വാസപരമായ ബലം നിലനിർത്തുകയും മറ്റൊരു പേരുള്ള ദേവനെ സൂചിപ്പിക്കുന്നുവെന്ന അനാവശ്യ ധാരണ ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- issue: ആകാശത്തിന്മേൽ ദൈവം സവാരി ചെയ്യുന്ന കാവ്യചിത്രം
  choice: രൂപകം വിശദീകരിക്കാതെ നേരിട്ട് നിലനിർത്തി
  alternative: ദൈവത്തിന്റെ സർവാധികാരമെന്ന വ്യാഖ്യാനം വാചകത്തിൽ ചേർക്കുക
  rationale: മൂലപാഠത്തിലെ കാവ്യചിത്രവും അതിലെ ദൈവിക മഹത്വവും വായനക്കാരൻ നേരിട്ട് അനുഭവിക്കാനായി വ്യാഖ്യാനപരമായ വിപുലീകരണം ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കാവ്യഭാഷയാണ് ഉപയോഗിച്ചത്. ഹീബ്രു സമാന്തരഘടനയും രണ്ടാം വരിയിലെ ക്രിയ മൂന്നാം വരിയിലും ബാധകമാകുന്ന സംക്ഷിപ്തതയും നിലനിർത്തി. ‘സവാരി ചെയ്യുന്നു’ എന്നത് മൂലത്തിലെ ദൃശ്യരൂപം സംരക്ഷിക്കുന്നു; അപൂർവമായ ‘യെശുരൂൻ’ അടിക്കുറിപ്പിലൂടെ വിശദീകരിച്ചു.
