source:
  edition: WLC
  text: יְחִ֥י רְאוּבֵ֖ן וְ/אַל יָמֹ֑ת וִ/יהִ֥י מְתָ֖י/ו מִסְפָּֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/006.yaml
  text: May Reuben live and not die[a], and may his men be few.
translation:
  language: ml
  text: രൂബേൻ ജീവിക്കട്ടെ, മരിക്കാതിരിക്കട്ടെ; അവന്റെ ആളുകൾ എണ്ണത്തിൽ കുറവായിരിക്കട്ടെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “അവന്റെ ആളുകൾ എണ്ണപ്പെടട്ടെ.” അവസാന ഉപവാക്യത്തിലെ എബ്രായപാഠം ദുഷ്കരമാണ്. രൂബേൻ നിസ്സാരനായിത്തീരാതിരിക്കട്ടെ, അല്ലെങ്കിൽ ഗോത്രങ്ങളുടെ എണ്ണത്തിൽനിന്ന് ഒഴിവാക്കപ്പെടാതിരിക്കട്ടെ എന്ന പ്രാർത്ഥനയായും ഇതിനെ മനസ്സിലാക്കിയിട്ടുണ്ട്.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְחִי
  choice: ജീവിക്കട്ടെ
  rationale: חיה എന്ന ക്രിയയുടെ ഖാൽ ജസ്സീവ് രൂപം ആശംസയെയോ അനുഗ്രഹപ്രാർത്ഥനയെയോ സൂചിപ്പിക്കുന്നു. ‘ജീവിക്കട്ടെ’ ആ ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: רְאוּבֵן
  choice: രൂബേൻ
  rationale: വ്യക്തിയെയും ഗോത്രത്തെയും സൂചിപ്പിക്കുന്ന പേര് മലയാള ബൈബിൾ പാരമ്പര്യത്തിന് യോജിച്ച രീതിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: וְאַל יָמֹת
  choice: മരിക്കാതിരിക്കട്ടെ
  rationale: אַל ചേർന്ന ജസ്സീവ് നിഷേധാത്മകമായ ആശംസയാണ്. מות എന്നതിന്റെ നേരായ അർഥമായ ‘മരിക്കുക’ നിലനിർത്തി.
- source_word: וִיהִי
  choice: ആയിരിക്കട്ടെ
  rationale: രണ്ടാമത്തെ ജസ്സീവും ആശംസയോ അനുഗ്രഹപ്രാർത്ഥനയോ അവതരിപ്പിക്കുന്നു; ‘ആയിരിക്കട്ടെ’ സമാന്തര ഘടന നിലനിർത്തുന്നു.
- source_word: מְתָיו
  choice: അവന്റെ ആളുകൾ
  rationale: ഇവിടത്തെ ദുഷ്കരമായ പദം ഗോത്രത്തിലെ ആളുകളെയോ പുരുഷന്മാരെയോ സൂചിപ്പിക്കുന്നതായി സന്ദർഭത്തിൽ മനസ്സിലാക്കാം. ‘ആളുകൾ’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും അനാവശ്യമായ ലിംഗപരിമിതി ഒഴിവാക്കുന്നതുമാണ്.
- source_word: מִסְפָּר
  choice: ചുരുക്കം
  rationale: അക്ഷരാർഥം ‘എണ്ണം’ എന്നാണ്. היה എന്ന ക്രിയയോടുള്ള ഈ സംക്ഷിപ്ത പ്രയോഗം ‘എണ്ണത്തിൽ കുറവ്/ചുരുക്കം’ എന്ന അർഥം നൽകുന്നതായി മുഖ്യവായന സ്വീകരിക്കുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: וִיהִי מְתָיו מִסְפָּר എന്ന അവസാന ഉപവാക്യത്തിന്റെ വ്യാഖ്യാനം
  choice: ‘അവന്റെ ആളുകൾ ചുരുക്കമായിരിക്കട്ടെ’—രൂബേൻ എണ്ണത്തിൽ ചെറുതായിരുന്നാലും നിലനിൽക്കട്ടെ എന്ന യാഥാർഥ്യബോധമുള്ള അനുഗ്രഹം.
  alternative: ‘അവന്റെ ആളുകൾ എണ്ണപ്പെടട്ടെ’—ഗോത്രപ്പട്ടികയിൽനിന്നോ ജനസംഖ്യാകണക്കിൽനിന്നോ ഒഴിവാക്കപ്പെടാതിരിക്കട്ടെ; അല്ലെങ്കിൽ ‘അവന്റെ ആളുകൾ ചുരുക്കമായിരുന്നാലും’ എന്ന concessive വായന.
  rationale: മസോരറ്റിക് പാഠം സംക്ഷിപ്തവും ദുഷ്കരവുമാണ്. מִסְפָּר എന്നത് היהയോടൊപ്പം വന്നപ്പോൾ ‘എണ്ണാവുന്നത്ര കുറവ്’ എന്ന അർഥമാണ് ഏറ്റവും നേരായ വായന. എന്നാൽ ഗോത്രഗണനയിൽ ഉൾപ്പെടട്ടെ എന്ന അനുകൂല വായനയും സാധ്യമായതിനാൽ പാഠത്തിലെ യഥാർഥ അവ്യക്തത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു; പാഠഭേദം ചേർത്ത് പ്രശ്നം പരിഹരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ അനുഗ്രഹശൈലി. ജസ്സീവ് രൂപങ്ങളുടെ ആശംസാഭാവം ‘-ട്ടെ’ രൂപങ്ങളിലൂടെ നിലനിർത്തി. ദുഷ്കരമായ അവസാന ഉപവാക്യം മുഖ്യപാഠത്തിൽ സ്വാഭാവികമാക്കി, എന്നാൽ അതിന്റെ വ്യാഖ്യാനപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
