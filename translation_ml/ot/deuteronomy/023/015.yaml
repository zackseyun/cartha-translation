  to: നിന്റെ ദൈവമായ യഹോവ നിന്നെ വിടുവിക്കാനും നിന്റെ ശത്രുക്കളെ നിന്റെ കൈയിൽ ഏൽപ്പിക്കാനും നിന്റെ പാളയത്തിനുള്ളിൽ സഞ്ചരിക്കുന്നു. അതുകൊണ്ട് നിന്റെ പാളയം വിശുദ്ധമായിരിക്കണം; അവൻ നിന്റെ ഇടയിൽ ലജ്ജാകരമായ ഒരു കാര്യവും കാണാതിരിക്കാനും നിന്നെ വിട്ട് പിന്തിരിയാതിരിക്കാനും.[a]
  rationale: അവസാന ഉപവാക്യം മൂലപാഠത്തിനൊത്ത ഉദ്ദേശ/ഫലഭാവത്തിലേക്ക് പുനഃസ്ഥാപിച്ചു; അതുവഴി പാളയവിശുദ്ധിയുടെ വ്യവസ്ഥാപരമായ മുന്നറിയിപ്പ് നിലനിൽക്കുന്നു. ‘ലജ്ജാകരമായ ഒരു കാര്യവും’ എബ്രായ עֶרְוַת דָּבָר എന്ന വിശാലപ്രയോഗത്തെ സംരക്ഷിച്ചുകൊണ്ട് മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികമാക്കുന്നു. മറ്റെല്ലാ പ്രധാന തിരഞ്ഞെടുപ്പുകളും നിലനിർത്തി.
