source:
  edition: WLC
  text: כִּי֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ מִתְהַלֵּ֣ךְ בְּ/קֶ֣רֶב מַחֲנֶ֗/ךָ לְ/הַצִּֽילְ/ךָ֙ וְ/לָ/תֵ֤ת אֹיְבֶ֨י/ךָ֙ לְ/פָנֶ֔י/ךָ וְ/הָיָ֥ה מַחֲנֶ֖י/ךָ קָד֑וֹשׁ וְ/לֹֽא יִרְאֶ֤ה בְ/ךָ֙ עֶרְוַ֣ת דָּבָ֔ר וְ/שָׁ֖ב מֵ/אַחֲרֶֽי/ךָ׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/015.yaml
  text: For Yahweh your God walks in the midst of your camp to deliver you and to give your enemies before you[a]. Therefore your camp must be holy[c][b], so that he may not see in you anything indecent and turn away from you.
translation:
  language: ml
  text: നിന്റെ ദൈവമായ യഹോവ നിന്നെ വിടുവിക്കാനും നിന്റെ ശത്രുക്കളെ നിന്റെ കൈയിൽ ഏൽപ്പിക്കാനും നിന്റെ പാളയത്തിനുള്ളിൽ സഞ്ചരിക്കുന്നു. അതുകൊണ്ട് നിന്റെ പാളയം വിശുദ്ധമായിരിക്കണം; അവൻ നിന്റെ ഇടയിൽ ലജ്ജാകരമായ ഒരു കാര്യവും കാണാതിരിക്കാനും നിന്നെ വിട്ട് പിന്തിരിയാതിരിക്കാനും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നിന്നെ വിട്ട് പിന്തിരിയുക” എന്നതിന്റെ അക്ഷരാർഥം “നിന്റെ പിന്നിൽനിന്ന് മടങ്ങിപ്പോകുക” എന്നാണ്; യഹോവ ഇനി പാളയത്തോടൊപ്പം പോകാതിരിക്കുന്നതിന്റെ ചിത്രം ഈ പ്രയോഗത്തിലുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമത്തെ പൊതുവായി പരിചിതമായ മലയാളരൂപത്തിൽ നിലനിർത്തുന്നു; പകരം ഒരു പദവിനാമം ഉപയോഗിക്കുന്നില്ല.
- source_word: מִתְהַלֵּךְ
  choice: സഞ്ചരിക്കുന്നു
  rationale: പാളയത്തിനുള്ളിലെ സജീവമായ ദൈവസാന്നിധ്യത്തെ സൂചിപ്പിക്കുന്ന ഹിത്പയേൽ രൂപത്തിന്റെ ചലനചിത്രം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּקֶרֶב מַחֲנֶךָ
  choice: നിന്റെ പാളയത്തിനുള്ളിൽ
  rationale: בקרב എന്നതിന്റെ ‘മധ്യത്തിൽ/ഉള്ളിൽ’ എന്ന ആശയം വായനാസൗകര്യത്തോടെ നൽകുന്നു.
- source_word: לְהַצִּילְךָ
  choice: നിന്നെ വിടുവിക്കാനും
  rationale: സൈനിക സാഹചര്യത്തിലെ അപകടത്തിൽനിന്നുള്ള രക്ഷയെ ‘വിടുവിക്കുക’ യോജിച്ചവിധം പ്രകടിപ്പിക്കുന്നു.
- source_word: וְלָתֵת אֹיְבֶיךָ לְפָנֶיךָ
  choice: നിന്റെ ശത്രുക്കളെ നിന്റെ കൈയിൽ ഏല്പിക്കാനും
  rationale: അക്ഷരാർഥത്തിൽ ‘നിന്റെ മുമ്പിൽ കൊടുക്കുക’ എന്ന എബ്രായ പ്രയോഗം ശത്രുക്കളെ ഒരാളുടെ അധികാരത്തിൽ ഏല്പിക്കുക എന്നർഥമുള്ളതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: וְהָיָה מַחֲנֶיךָ קָדוֹשׁ
  choice: അതുകൊണ്ട് നിന്റെ പാളയം വിശുദ്ധമായിരിക്കണം
  rationale: ദൈവസാന്നിധ്യത്തിൽനിന്ന് ഉദ്ഭവിക്കുന്ന നിർബന്ധസ്വഭാവം സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കുന്നു.
- source_word: עֶרְוַת דָּבָר
  choice: ലജ്ജാകരമായ യാതൊന്നും
  rationale: ‘ഒരു കാര്യത്തിന്റെ നഗ്നത’ എന്ന അക്ഷരചിത്രത്തെ ചുരുക്കി തീർക്കാതെ, അശോഭനമോ അശുദ്ധമോ ആയ കാര്യങ്ങളെ ഉൾക്കൊള്ളാവുന്ന വിശാലപ്രയോഗം നൽകുന്നു.
- source_word: וְשָׁב מֵאַחֲרֶיךָ
  choice: നിന്നിൽനിന്ന് പിന്തിരിയുകയോ
  rationale: അക്ഷരാർഥത്തിലെ ‘നിന്റെ പിന്നിൽനിന്ന് മടങ്ങുക’ എന്ന അനുഗമനചിത്രം പൂർണമായി വ്യാഖ്യാനിക്കാതെ, സ്വാഭാവികവും അടുത്തതുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: യഹോവയുടെ സാന്നിധ്യത്തെ മനുഷ്യസദൃശമായി വിവരിക്കുന്നത്
  choice: പാളയത്തിനുള്ളിൽ ‘സഞ്ചരിക്കുന്നു’ എന്ന ചലനഭാഷ നിലനിർത്തി
  alternative: ‘നിന്റെ പാളയത്തിൽ സന്നിഹിതനാണ്’ എന്നു അമൂർത്തമായി പരിഭാഷപ്പെടുത്തുക
  rationale: ദൈവത്തിന്റെ ദേഹസ്വഭാവത്തെക്കുറിച്ച് നിഗമനം ചെയ്യാതെ, ദൈവസാമീപ്യം പാളയത്തിന്റെ വിശുദ്ധി ആവശ്യപ്പെടുന്നു എന്ന മൂലപാഠത്തിന്റെ സജീവചിത്രം സംരക്ഷിക്കുന്നു.
- issue: പാളയം വിശുദ്ധമായിരിക്കണമെന്ന വാക്യത്തിന്റെ ശക്തി
  choice: ‘വിശുദ്ധമായിരിക്കണം’ എന്ന ബാധ്യതാരൂപം
  alternative: ‘വിശുദ്ധമായിരിക്കും’ എന്ന ഭാവികാലരൂപം
  rationale: സന്ദർഭത്തിൽ ഇത് വെറും പ്രവചനമല്ല; യഹോവ പാളയത്തിൽ സഞ്ചരിക്കുന്നതിനാൽ പാലിക്കേണ്ട വിശുദ്ധിയുടെ നിർദേശമാണ്.
- issue: അശോഭനമായ കാര്യം കണ്ടാൽ യഹോവ പിന്തിരിയുമെന്ന മുന്നറിയിപ്പ്
  choice: വ്യവസ്ഥാപരമായ മുന്നറിയിപ്പിന്റെ കടുപ്പം നിലനിർത്തി
  alternative: ദൈവാനുഗ്രഹം കുറയും എന്ന അമൂർത്ത പരാവർത്തനം
  rationale: ദൈവസാന്നിധ്യവും പാളയശുദ്ധിയും തമ്മിലുള്ള പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം മൃദൂകരിക്കാതെ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണ മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഏകവചന അഭിസംബോധന നിലനിർത്തി. സൈനിക പാളയത്തിന്റെ പശ്ചാത്തലവും ദൈവസാന്നിധ്യത്തിന്റെ ചലനചിത്രവും സംരക്ഷിച്ചു.
