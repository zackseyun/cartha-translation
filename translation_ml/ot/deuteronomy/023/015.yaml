  revised_text: നിന്റെ ദൈവമായ യഹോവ നിന്നെ വിടുവിക്കാനും നിന്റെ ശത്രുക്കളെ നിന്റെ കൈയിൽ ഏൽപ്പിക്കാനും നിന്റെ പാളയത്തിനുള്ളിൽ സഞ്ചരിക്കുന്നു. അതുകൊണ്ട് നിന്റെ പാളയം വിശുദ്ധമായിരിക്കണം; അവൻ നിന്റെ ഇടയിൽ ലജ്ജാകരമായ ഒരു കാര്യവും കാണാതിരിക്കാനും നിന്നെ വിട്ട് പിന്തിരിയാതിരിക്കാനും.[a]
