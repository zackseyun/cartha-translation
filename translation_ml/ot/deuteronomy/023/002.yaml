  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹֽא יָבֹ֧א פְצֽוּעַ דַּכָּ֛א וּ/כְר֥וּת שָׁפְכָ֖ה בִּ/קְהַ֥ל יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/002.yaml
  text: No man with crushed testicles or a severed penis may enter the assembly of Yahweh[a][b].
translation:
  language: ml
  text: വൃഷണങ്ങൾ ചതഞ്ഞവനോ ലിംഗം ഛേദിക്കപ്പെട്ടവനോ യഹ്‌വെയുടെ സഭയിൽ പ്രവേശിക്കരുത്[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: “വൃഷണങ്ങൾ ചതഞ്ഞവനോ ലിംഗം മുറിച്ചുകളയപ്പെട്ടവനോ യഹ്‌വെയുടെ സഭയിൽ പ്രവേശിക്കരുത്.”'
    reason: lexical_alternative
  - marker: b
    text: “യഹ്‌വെയുടെ സഭ” എന്നത് ഇസ്രായേലിന്റെ ഉടമ്പടിസമൂഹത്തിലെ ഔപചാരിക പങ്കാളിത്തത്തെ സൂചിപ്പിക്കാം; ഈ വിലക്കിന്റെ കൃത്യമായ പരിധിയെക്കുറിച്ച് വ്യത്യസ്ത അഭിപ്രായങ്ങളുണ്ട്.
    reason: alternative_reading
lexical_decisions:
- source_word: יָבֹא
  choice: പ്രവേശിക്കരുത്
  rationale: בוא എന്നത് ‘വരുക/പ്രവേശിക്കുക’ എന്നാണ്. לֹא ചേർന്ന ഈ നിയമവാക്യത്തിൽ ‘പ്രവേശിക്കരുത്’ എന്നു പറയുന്നത് നിരോധനത്തിന്റെ ശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: פְצוּעַ דַּכָּא
  choice: വൃഷണങ്ങൾ ചതഞ്ഞവൻ
  rationale: ഈ പദസമുച്ചയം ചതച്ചതുമൂലം പുരുഷലൈംഗികാവയവത്തിനുണ്ടായ പരിക്കിനെ, പ്രത്യേകിച്ച് വൃഷണങ്ങൾക്കുണ്ടായ ക്ഷതത്തെ, സൂചിപ്പിക്കുന്നു. പൊതുവായ ‘ജനനേന്ദ്രിയം’ എന്നതിനെക്കാൾ ‘വൃഷണങ്ങൾ’ കൂടുതൽ കൃത്യമാണ്.
- source_word: וּכְרוּת שָׁפְכָה
  choice: ലിംഗം ഛേദിക്കപ്പെട്ടവൻ
  rationale: ശുക്ലം പുറപ്പെടുവിക്കുന്ന പുരുഷാവയവം മുറിച്ചുകളഞ്ഞ അവസ്ഥയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്. ‘ലിംഗം’ എന്നത് ആധുനിക മലയാളത്തിൽ വ്യക്തവും ശരീരശാസ്ത്രപരമായി കൃത്യവുമാണ്; וּ എന്ന ബന്ധകം രണ്ട് അവസ്ഥകളെ വേർതിരിക്കുന്ന ‘ഓ’ ആയി നൽകിയിരിക്കുന്നു.
- source_word: בִּקְהַל
  choice: സഭയിൽ
  rationale: קהל കൂടിച്ചേർന്ന സമൂഹത്തെയോ സഭയെയോ സൂചിപ്പിക്കുന്നു. നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ പശ്ചാത്തലത്തിൽ ‘സഭ’ സ്വാഭാവികമാണ്; അതിന്റെ കൃത്യമായ പരിധി വിവർത്തനത്തിൽ മുൻകൂട്ടി നിർണയിക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരിയെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, സാധ്യതയേറിയ ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണമായി നൽകിയിരിക്കുന്നു.
- source_word: לֹא
  choice: -രുത്
  rationale: ഹീബ്രുവിലെ നിഷേധം മലയാളത്തിലെ സ്വാഭാവിക നിയമനിരോധനരൂപമായ ‘പ്രവേശിക്കരുത്’ എന്നതിൽ പ്രകടമാക്കുന്നു.
- source_word: implicit male referent of the participial phrases
  choice: -വൻ
  rationale: രണ്ട് വിശേഷണപ്രയോഗങ്ങളും പുരുഷജനനേന്ദ്രിയത്തിലെ ക്ഷതത്തെക്കുറിച്ചായതിനാൽ പുരുഷനെ സൂചിപ്പിക്കുന്ന ‘വൻ’ എന്ന രൂപം അർഥം കൃത്യമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘യഹ്‌വെയുടെ സഭ’യിൽനിന്നുള്ള ഒഴിവാക്കലിന്റെ സ്വഭാവം
  choice: ഉടമ്പടിസമൂഹത്തിന്റെ സഭയിൽ പ്രവേശിക്കുന്നതിനുള്ള വിലക്കായി വാചകം നേരിട്ട് വിവർത്തനം ചെയ്തു; അതിന്റെ പരിധി മുഖ്യവാചകത്തിൽ നിർവചിച്ചില്ല.
  alternative: ഇസ്രായേലിന്റെ ആരാധനാസഭയിലെ ഔപചാരിക പങ്കാളിത്തം, പൗരസമൂഹാംഗത്വമോ വിവാഹയോഗ്യതയോ, അല്ലെങ്കിൽ വിശാലമായ ആചാരപരമായ ഒഴിവാക്കൽ എന്നിങ്ങനെ വ്യാഖ്യാനിക്കാം.
  rationale: കൃത്യമായ നിയമപരവും ദൈവശാസ്ത്രപരവുമായ വ്യാപ്തി ഈ വാക്യം തന്നെ വിശദീകരിക്കുന്നില്ല. അതിനാൽ പിൽക്കാല സഭാസംബന്ധമോ രക്ഷാസംബന്ധമോ ആയ നിഗമനങ്ങൾ ചേർക്കാതെ ഹീബ്രു പ്രയോഗത്തിന്റെ തുറന്ന സ്വഭാവം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമശൈലി ഉപയോഗിച്ചു. ശരീരഭാഗങ്ങളെ സൂചിപ്പിക്കുന്നിടത്ത് അവ്യക്തമായ പരമ്പരാഗത മൃദുപദങ്ങൾക്കുപകരം വ്യക്തവും വൈദ്യശാസ്ത്രപരമായി മനസ്സിലാകുന്നതുമായ പദങ്ങൾ തിരഞ്ഞെടുത്തു. വാക്യത്തിന്റെ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് അനാവശ്യമായ സാങ്കേതികഭാരം ഒഴിവാക്കി.
