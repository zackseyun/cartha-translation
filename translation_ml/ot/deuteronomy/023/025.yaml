  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֤י תָבֹא֙ בְּ/כֶ֣רֶם רֵעֶ֔/ךָ וְ/אָכַלְתָּ֧ עֲנָבִ֛ים כְּ/נַפְשְׁ/ךָ֖ שָׂבְעֶ֑/ךָ וְ/אֶֽל כֶּלְיְ/ךָ֖ לֹ֥א תִתֵּֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/025.yaml
  text: When you enter your neighbor’s vineyard[a], you may eat grapes as your appetite desires, until you are satisfied[c][b], but you shall not put any into your container.
translation:
  language: ml
  text: നിന്റെ അയൽക്കാരന്റെ മുന്തിരിത്തോട്ടത്തിൽ നീ പ്രവേശിക്കുമ്പോൾ[a], നിന്റെ വിശപ്പടങ്ങുവോളം ഇഷ്ടംപോലെ മുന്തിരിപ്പഴം തിന്നാം[b]. എന്നാൽ അവയിൽ ഒന്നും നിന്റെ പാത്രത്തിൽ ഇടരുത്[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിന്റെ അയൽക്കാരന്റെ മുന്തിരിത്തോട്ടത്തിൽ നീ പ്രവേശിക്കുന്നെങ്കിൽ.’ ഹീബ്രു പദം കാലസൂചകമായോ വ്യവസ്ഥാസൂചകമായോ മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘നിന്റെ ജീവൻ/ആഗ്രഹംപോലെ, നിന്റെ തൃപ്തിവരെ.’ ഇവിടെ ഇത് ഇഷ്ടമുള്ളത്ര ഭക്ഷിച്ച് വിശപ്പടക്കുക എന്നർഥമുള്ള ഒരു പ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘സംഭരണപാത്രത്തിൽ.’ ഹീബ്രു പദം പൊതുവായതാണ്; കൂട, സഞ്ചി തുടങ്ങിയ ഏതെങ്കിലും പ്രത്യേകതരം പാത്രത്തെ അത് നിർദേശിക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: പ്രവേശിക്കുമ്പോൾ
  rationale: ഇവിടെ כִּי ഒരു കാരണവാക്യമല്ല, സാഹചര്യത്തെ അവതരിപ്പിക്കുന്ന പദമാണ്. നിബന്ധനാസ്വഭാവമുള്ള നിയമസന്ദർഭത്തിൽ ‘എങ്കിൽ’ എന്ന അർഥവും സാധ്യമാണെങ്കിലും, സ്വാഭാവികമായ മുഖ്യവായനയായി ‘പ്രവേശിക്കുമ്പോൾ’ സ്വീകരിച്ചു.
- source_word: תָבֹא בְּכֶרֶם
  choice: മുന്തിരിത്തോട്ടത്തിൽ നീ പ്രവേശിക്കുക
  rationale: בוא എന്ന ക്രിയയും בְ എന്ന ഉപസർഗവും ഇവിടെ ഒരു സ്ഥലത്തിനകത്തു കടക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; അതിനാൽ ‘പ്രവേശിക്കുക’ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: רֵעֶךָ
  choice: നിന്റെ അയൽക്കാരന്റെ
  rationale: רֵעַ അയൽക്കാരൻ, സഹജീവി, മറ്റൊരാൾ എന്നീ അർഥങ്ങൾ വഹിക്കാം. ഉടമസ്ഥാവകാശം മറ്റൊരാളുടേതാണെന്ന നിയമസന്ദർഭത്തിൽ ‘അയൽക്കാരൻ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: וְאָכַלְתָּ עֲנָבִים
  choice: മുന്തിരിപ്പഴം തിന്നാം
  rationale: നിയമസന്ദർഭത്തിലെ ഈ രൂപം വെറും ഭാവിപ്രവൃത്തിയേക്കാൾ അനുവദനീയമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘തിന്നാം’ ആ അനുമതി സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: כְּנַפְשְׁךָ שָׂבְעֶךָ
  choice: നിന്റെ വിശപ്പടങ്ങുവോളം ഇഷ്ടംപോലെ
  rationale: നֶפֶשׁ ഇവിടെ ദൈവശാസ്ത്രപരമായ ‘ആത്മാവ്’ എന്നതല്ല, വ്യക്തിയുടെ ആഗ്രഹമോ ഭക്ഷണവാഞ്ഛയോ ആണ്; שָׂבְעֶךָ തൃപ്തിയാകുന്നതുവരെ എന്ന പരിധി നൽകുന്നു. രണ്ടും ചേർന്നുള്ള ഹീബ്രു പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ ഇങ്ങനെ നൽകിയിരിക്കുന്നു.
- source_word: כֶּלְיְךָ
  choice: നിന്റെ പാത്രത്തിൽ
  rationale: כְּלִי പൊതുവായി ഉപകരണം, പാത്രം, സംഭരണവസ്തു എന്നിവ സൂചിപ്പിക്കുന്നു. ‘കൂട’ അല്ലെങ്കിൽ ‘സഞ്ചി’ എന്നു പ്രത്യേകീകരിക്കാതെ ‘പാത്രം’ മൂലപദത്തിന്റെ സാമാന്യത നിലനിർത്തുന്നു.
- source_word: לֹא תִתֵּן
  choice: ഇടരുത്
  rationale: נתן എന്നതിന് ‘കൊടുക്കുക/വയ്ക്കുക/ഇടുക’ എന്നീ അർഥങ്ങളുണ്ട്. പാത്രത്തിലേക്കുള്ള നീക്കത്തെക്കുറിച്ചായതിനാൽ ‘ഇടരുത്’ സ്വാഭാവികവും കൃത്യവുമാണ്; ‘അവയിൽ ഒന്നും’ എന്നത് മുൻപറഞ്ഞ മുന്തിരിപ്പഴത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ നിയമവചനത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ‘തിന്നാം’ അനുമതിയും ‘ഇടരുത്’ നിരോധനവും നേരിട്ട് പ്രകടമാക്കുന്നു. ഹീബ്രുവിലെ വ്യവസ്ഥ/കാലസൂചനാ ദ്വയാർഥവും כְּלִי എന്ന പദത്തിന്റെ സാമാന്യതയും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
