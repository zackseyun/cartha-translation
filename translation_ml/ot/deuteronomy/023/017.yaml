source:
  edition: WLC
  text: עִמְּ/ךָ֞ יֵשֵׁ֣ב בְּ/קִרְבְּ/ךָ֗ בַּ/מָּק֧וֹם אֲשֶׁר יִבְחַ֛ר בְּ/אַחַ֥ד שְׁעָרֶ֖י/ךָ בַּ/טּ֣וֹב ל֑/וֹ לֹ֖א תּוֹנֶֽ/נּוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/017.yaml
  text: He shall live with you[a], in your midst, in the place that he chooses within one of your gates, wherever it is good for him[b]; you shall not oppress him.
translation:
  language: ml
  text: അവൻ നിങ്ങളോടുകൂടെ[a], നിങ്ങളുടെ മധ്യത്തിൽ, നിങ്ങളുടെ പട്ടണങ്ങളിലൊന്നിൽ[b], അവൻ തിരഞ്ഞെടുക്കുന്നതും തനിക്കു നല്ലതായതുമായ സ്ഥലത്ത് താമസിക്കട്ടെ; നിങ്ങൾ അവനെ പീഡിപ്പിക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങളോടുകൂടെ ... തനിക്കു നല്ലതെന്നു തോന്നുന്നിടത്ത് പാർക്കട്ടെ.’
    reason: lexical_alternative
  - marker: b
    text: ‘നിങ്ങളുടെ പട്ടണങ്ങളിലൊന്നിൽ’ എന്നതിന്റെ അക്ഷരാർഥം ‘നിങ്ങളുടെ കവാടങ്ങളിലൊന്നിൽ’ എന്നാണ്. ‘കവാടങ്ങൾ’ എന്നത് എബ്രായത്തിൽ ഒരു പട്ടണത്തെയോ സമൂഹത്തെയോ സൂചിപ്പിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: יֵשֵׁב
  choice: താമസിക്കട്ടെ
  rationale: ישב എന്ന ക്രിയയ്ക്ക് ഇരിക്കുക, പാർക്കുക, വസിക്കുക എന്നീ അർഥങ്ങളുണ്ട്. ഈ നിയമസന്ദർഭത്തിൽ തുടർന്നുള്ള വാസത്തിനുള്ള അനുവാദം സ്വാഭാവികമായി അറിയിക്കാൻ ‘താമസിക്കട്ടെ’ എന്നു നൽകി.
- source_word: עִמְּךָ
  choice: നിങ്ങളോടുകൂടെ
  rationale: עם എന്ന പൂർവപ്രത്യയത്തിന്റെ ‘കൂടെ’ എന്ന നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; തുടർന്നുള്ള ‘നിങ്ങളുടെ മധ്യത്തിൽ’ സമൂഹത്തിനുള്ളിലെ വാസം വ്യക്തമാക്കുന്നു.
- source_word: בְּקִרְבְּךָ
  choice: നിങ്ങളുടെ മധ്യത്തിൽ
  rationale: സമൂഹത്തിന്റെ ഉള്ളിൽ എന്ന എബ്രായ ദൃശ്യരൂപം മാന്യവും വ്യക്തവുമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר
  choice: തനിക്ക് ഇഷ്ടമുള്ള സ്ഥലത്ത്
  rationale: בחר എന്നത് തിരഞ്ഞെടുക്കുക എന്നാണ്. തിരഞ്ഞെടുക്കുന്നത് ആ വ്യക്തിയാണെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ദൈവമോ സമൂഹമോ സ്ഥലം തിരഞ്ഞെടുക്കുന്നു എന്ന വായന ഒഴിവാക്കുന്നു.
- source_word: בְּאַחַד שְׁעָרֶיךָ
  choice: നിങ്ങളുടെ പട്ടണങ്ങളിലൊന്നിൽ
  rationale: ‘നിന്റെ കവാടങ്ങളിലൊന്നിൽ’ എന്ന അക്ഷരാർഥപ്രയോഗത്തിൽ ‘കവാടങ്ങൾ’ പട്ടണങ്ങളെയോ അവയുടെ അധികാരപരിധിയെയോ സൂചിപ്പിക്കുന്ന മെറ്റോണിമിയാണ്. ആധുനിക വായനക്കാരന് ഉദ്ദേശ്യം നേരിട്ട് മനസ്സിലാകാൻ ‘പട്ടണങ്ങളിലൊന്നിൽ’ എന്നു നൽകി.
- source_word: בַּטּוֹב לוֹ
  choice: അവന് നന്മയായിരിക്കുന്നിടത്ത്
  rationale: ‘അവനു നന്മയിൽ’ എന്ന സങ്കുചിത എബ്രായ പ്രയോഗത്തിന്റെ നന്മ/അനുകൂലത എന്ന ഘടകം നിലനിർത്തുന്നു; വെറും ഇഷ്ടമോ സന്തോഷമോ ആയി ചുരുക്കുന്നില്ല.
- source_word: לֹא תּוֹנֶנּוּ
  choice: നിങ്ങൾ അവനെ പീഡിപ്പിക്കരുത്
  rationale: ינה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ദുർബലനായ ഒരാളെ അടിച്ചമർത്തുക, ചൂഷണം ചെയ്യുക, ദ്രോഹിക്കുക എന്ന സാമൂഹിക-നിയമപരമായ ശക്തി വഹിക്കുന്നു. ‘പീഡിപ്പിക്കരുത്’ അതിന്റെ ഗൗരവം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: പുരുഷ ഏകവചന സർവനാമങ്ങളുടെ സൂചിതവ്യക്തി
  choice: മുൻവാക്യത്തിലെ ഒളിച്ചോടിയ ദാസനെ വ്യക്തിഗത പുരുഷനായി സൂചിപ്പിച്ച് ‘അവൻ/അവനെ/അവന്’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ലിംഗനിരപേക്ഷമായ ബഹുവചനമോ ‘ആ വ്യക്തി’ എന്ന പ്രയോഗമോ ഉപയോഗിക്കുക.
  rationale: എബ്രായത്തിൽ മുഴുവൻ പുരുഷ ഏകവചന രൂപങ്ങളാണ്. അവയെ മലയാളത്തിൽ സ്വാഭാവികമായ പുരുഷ ഏകവചനമായി നിലനിർത്തുന്നത് വ്യാകരണസാക്ഷ്യത്തോട് ചേർന്നതാണ്.
- issue: താമസസ്ഥലം തിരഞ്ഞെടുക്കാനുള്ള അധികാരം
  choice: സ്ഥലം തിരഞ്ഞെടുക്കുന്നത് അഭയം തേടിയെത്തിയ വ്യക്തി തന്നെയാണെന്ന് വാചകം സൂചിപ്പിക്കുന്നു.
  alternative: ആതിഥേയ സമൂഹമോ യഹോവയോ സ്ഥലം തിരഞ്ഞെടുക്കുന്നു എന്നു വായിക്കുക.
  rationale: יִבְחַר എന്ന പുരുഷ ഏകവചന ക്രിയയുടെ ഏറ്റവും അടുത്തതും സന്ദർഭോചിതവുമായ കർത്താവ് മുൻവാക്യത്തിലെ ദാസനാണ്; ദൈവിക തിരഞ്ഞെടുപ്പിനെ സൂചിപ്പിക്കുന്ന പ്രത്യേക അടയാളമില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ മാന്യമായ നിയമഭാഷയാണ് ഉപയോഗിച്ചത്. വാക്യത്തിലെ ആവർത്തനവും സ്ഥലതിരഞ്ഞെടുപ്പിനെക്കുറിച്ചുള്ള രണ്ടു അടുത്ത പ്രയോഗങ്ങളും എബ്രായത്തിന്റെ ഊന്നൽ സംരക്ഷിക്കാൻ നിലനിർത്തി. ബഹുവചന രണ്ടാംപുരുഷ രൂപങ്ങൾക്ക് സ്വാഭാവികമായ ‘നിങ്ങൾ/നിങ്ങളുടെ’ ഉപയോഗിച്ചു.
