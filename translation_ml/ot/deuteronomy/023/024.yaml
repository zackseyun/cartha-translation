revisions:
- from: നിന്റെ അധരങ്ങളിൽനിന്നു പുറപ്പെട്ടത് നീ പാലിക്കുകയും നിറവേറ്റുകയും വേണം[a]—നിന്റെ ദൈവമായ യഹോവയ്ക്കു നീ സ്വമേധയാ വഴിപാടായി നേർന്നതും നിന്റെ വായ്കൊണ്ട് പറഞ്ഞതുമായതുപോലെ[b].
  to: നിന്റെ അധരങ്ങളിൽനിന്നു പുറപ്പെട്ടതു[a] നീ പാലിച്ചു നിറവേറ്റണം—നിന്റെ ദൈവമായ യഹ്‌വെക്കു സ്വമേധാവഴിപാടായി[b] നീ നിന്റെ വായ്കൊണ്ടു നേർന്നതുപോലെ.
