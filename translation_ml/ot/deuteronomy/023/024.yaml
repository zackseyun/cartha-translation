source:
  edition: WLC
  text: מוֹצָ֥א שְׂפָתֶ֖י/ךָ תִּשְׁמֹ֣ר וְ/עָשִׂ֑יתָ כַּ/אֲשֶׁ֨ר נָדַ֜רְתָּ לַ/יהוָ֤ה אֱלֹהֶ֨י/ךָ֙ נְדָבָ֔ה אֲשֶׁ֥ר דִּבַּ֖רְתָּ בְּ/פִֽי/ךָ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/024.yaml
  text: You shall keep what has gone out from your lips and do it[a], according to what you vowed to Yahweh your God as a freewill offering[b], which you spoke with your mouth.
translation:
  language: ml
  text: നിന്റെ അധരങ്ങളിൽനിന്നു പുറപ്പെട്ടതു[a] നീ പാലിച്ചു നിറവേറ്റണം—നിന്റെ ദൈവമായ യഹ്‌വെക്കു സ്വമേധാവഴിപാടായി[b] നീ നിന്റെ വായ്കൊണ്ടു നേർന്നതുപോലെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “നിന്റെ അധരങ്ങളുടെ ഉച്ചാരണം” അല്ലെങ്കിൽ “നിന്റെ അധരങ്ങളിൽനിന്നു വരുന്നത്.”'
    reason: lexical_alternative
  - marker: b
    text: 'അല്ലെങ്കിൽ: “സ്വമേധാ അർപ്പണം.” നിർബന്ധത്താലല്ലാതെ സ്വതന്ത്രമായി നൽകുന്ന വഴിപാടിനെയാണ് എബ്രായപദം സൂചിപ്പിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹצָא שְׂפָתֶיךָ
  choice: നിന്റെ അധരങ്ങളിൽനിന്നു പുറപ്പെട്ടത്
  rationale: מוֹצָא എന്ന പദത്തിന്റെ ‘പുറപ്പെടുന്നത്’ എന്ന ദൃശ്യപ്രയോഗം നിലനിർത്തുന്നു; ഇവിടെ അത് വായാൽ ഉച്ചരിച്ച നേർച്ചയെ സൂചിപ്പിക്കുന്നു.
- source_word: תִּשְׁמֹר וְעָשִׂיתָ
  choice: നീ പാലിക്കുകയും നിറവേറ്റുകയും വേണം
  rationale: שׁמר പ്രതിജ്ഞയോടുള്ള വിശ്വസ്തതയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പാലിക്കുക’ എന്നും, עשה അതു പ്രവൃത്തിയിൽ നടപ്പാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘നിറവേറ്റുക’ എന്നും വിവർത്തനം ചെയ്തു.
- source_word: כַּאֲשֶׁר נָדַרְתָּ
  choice: നീ ... നേർന്നതും ... പറഞ്ഞതുമായതുപോലെ
  rationale: നിർവഹിക്കേണ്ടത് നേർച്ചയിൽ പറഞ്ഞതനുസരിച്ചായിരിക്കണം എന്ന ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ യഹോവയ്ക്കു
  rationale: יהוה എന്ന ദൈവനാമം ‘യഹോവ’ എന്നു നേരിട്ട് ലിപ്യന്തരിച്ചു; ഉടമ്പടിനാമത്തിന്റെ വ്യക്തിത്വം നിലനിർത്തുന്നു.
- source_word: נְדָבָה
  choice: സ്വമേധയാ വഴിപാടായി
  rationale: നിർബന്ധത്താലല്ല, മനസ്സോടെ അർപ്പിക്കുന്ന വഴിപാടെന്ന പദത്തിന്റെ അർഥം നൽകുന്നു; നേർച്ചയും സ്വമേധാവഴിപാടും തമ്മിലുള്ള വാചകബന്ധം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר דִּבַּרְתָּ בְּפִיךָ
  choice: നിന്റെ വായ്കൊണ്ട് പറഞ്ഞതുമായ
  rationale: വാക്കാൽ നേർന്നതാണെന്ന എബ്രായത്തിലെ ആവർത്തിച്ച ഊന്നൽ മിനുക്കിക്കളയാതെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ഉടമ്പടിനാമം നേരിട്ട് ഉള്ളതിനാൽ അത് പൊതുവായ സ്ഥാനനാമമാക്കി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്നു നൽകി.
- issue: נְדָבָהയും നേർച്ചയും തമ്മിലുള്ള ബന്ധം
  choice: സ്വമേധയാ വഴിപാടായി നേർന്നത്
  alternative: നേർച്ചയ്ക്കു പുറമേയുള്ള ഒരു സ്വമേധാവഴിപാട്
  rationale: വാക്യഘടനയിൽ נְדָבָה നേർന്നതിനെ വിശദീകരിക്കുന്നതായി വായിക്കാം; അതിനെ വേറിട്ട അർപ്പണമായി നിർബന്ധിച്ച് വ്യാഖ്യാനിക്കാതെ ഉറവിടത്തിലെ സാന്ദ്രത നിലനിർത്തി.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. ‘അധരങ്ങളിൽനിന്നു പുറപ്പെട്ടത്’, ‘വായ്കൊണ്ട് പറഞ്ഞത്’ എന്നീ മൂലപാഠത്തിലെ ദൃശ്യവും ആവർത്തനവും നിലനിർത്തി; പ്രധാനവാക്യത്തിൽ സ്വാഭാവികതയ്ക്കായി ‘പാലിക്കുകയും നിറവേറ്റുകയും വേണം’ എന്നു നൽകി.
