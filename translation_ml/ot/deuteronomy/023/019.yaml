  rationale: The revision preserves the Hebrew’s literal ‘dog’ in the main text while retaining the disputed alternative in a conditional footnote. It replaces the overly specific ‘ആലയം’ with ‘ഭവനം,’ and standardizes the divine name to ‘യാഹ്‌വെ’ in accordance with the English POB audit trail. The revised predicate closely reflects the Hebrew nominal expression ‘an abomination.’
