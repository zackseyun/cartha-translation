reference: Deuteronomy 23:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹא תָבִיא֩ אֶתְנַ֨ן זוֹנָ֜ה וּ/מְחִ֣יר כֶּ֗לֶב בֵּ֛ית יְהוָ֥ה אֱלֹהֶ֖י/ךָ לְ/כָל נֶ֑דֶר כִּ֧י תוֹעֲבַ֛ת יְהוָ֥ה אֱלֹהֶ֖י/ךָ גַּם שְׁנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/019.yaml
  text: You shall not bring the wages of a prostitute or the price of a dog into the house of Yahweh your God for any vow[a], because both of them are an abomination to Yahweh your God.
translation:
  language: ml
  text: വേശ്യയുടെ കൂലിയോ നായയുടെ വിലയോ[a] ഏതെങ്കിലും നേർച്ചയ്ക്കായി നിന്റെ ദൈവമായ യാഹ്‌വെയുടെ ഭവനത്തിലേക്ക് കൊണ്ടുവരരുത്. അവ രണ്ടും നിന്റെ ദൈവമായ യാഹ്‌വെക്കു അറപ്പാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നായ’ എന്നത് ഒരു പുരുഷ ആരാധനാവേശ്യയെ നിന്ദിച്ച് വിളിക്കുന്ന പദമാണെങ്കിൽ, ‘പുരുഷവേശ്യയുടെ പ്രതിഫലം’ എന്നും വായിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: תָבִיא
  choice: കൊണ്ടുവരരുത്
  rationale: בוא എന്ന ധാതുവിന്റെ ഹിഫ്ഈൽ രൂപം ഒരു വസ്തുവിനെ ഒരു സ്ഥലത്തേക്കു കൊണ്ടുവരുന്നതിനെ സൂചിപ്പിക്കുന്നു; നിരോധനത്തിന്റെ മൂർത്തമായ സ്വഭാവം ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: אֶתְנַן זוֹנָה
  choice: വേശ്യയുടെ കൂലി
  rationale: אֶתְנַן പ്രതിഫലത്തെയോ കൂലിയെയോ സൂചിപ്പിക്കുന്നു; זוֹנָה എന്നത് ‘വേശ്യ’ എന്നാണ്. മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ സംയോജനം.
- source_word: מְחִיר כֶּלֶב
  choice: നായയുടെ വില
  rationale: מְחִיר സാധാരണയായി ‘വില’ എന്നും כֶּלֶב അക്ഷരാർഥത്തിൽ ‘നായ’ എന്നും അർഥമാക്കുന്നു. വിവാദമായ രൂപകാലങ്കാര വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർക്കാതെ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: בֵּית יְהוָה אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ യഹോവയുടെ ആലയം
  rationale: בֵּית അക്ഷരാർഥത്തിൽ ‘വീട്’ ആണെങ്കിലും ദൈവാരാധനയുടെ വിശുദ്ധസ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന സന്ദർഭത്തിൽ ‘ആലയം’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ‘ക്ഷേത്രം’ എന്ന അനാവശ്യ സാംസ്കാരിക ധ്വനി ഒഴിവാക്കുന്നതുമാണ്. יְהוָה എന്ന ഉടമ്പടിനാമം ‘യഹോവ’ എന്നു ലിപ്യന്തരം ചെയ്തു.
- source_word: לְכָל נֶדֶר
  choice: ഏതെങ്കിലും നേർച്ചയ്ക്കായി
  rationale: വസ്തു കൊണ്ടുവരുന്നതിന്റെ ഉദ്ദേശ്യമോ അവസരമോ ഈ വാക്യഭാഗം സൂചിപ്പിക്കുന്നു; മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്ത ‘നിവർത്തിക്കാൻ’ എന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: תוֹעֲבַת
  choice: അറപ്പാകുന്നു
  rationale: תוֹעֵבָה ദൈവത്തിന്റെ മുമ്പിൽ അത്യന്തം വെറുപ്പുളവാക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ശക്തമായ പദമാണ്; ‘അറപ്പ്’ അതിന്റെ തീവ്രത സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: גַּם שְׁנֵיהֶם
  choice: അവ രണ്ടും
  rationale: മുമ്പു പറഞ്ഞ രണ്ടു വസ്തുക്കളും ഒരുപോലെ നിരോധിതമാണെന്ന ഉൾക്കൊള്ളുന്ന ഊന്നൽ ലളിതമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: מְחִיר כֶּלֶב എന്നതിലെ כֶּלֶב-ന്റെ വ്യാഖ്യാനം
  choice: മുഖ്യപാഠത്തിൽ അക്ഷരാർഥമായ ‘നായ’ നിലനിർത്തി.
  alternative: പുരുഷവേശ്യയുടെ പ്രതിഫലം; ആരാധനയുമായി ബന്ധപ്പെട്ട പുരുഷവേശ്യയെ നിന്ദാപൂർവം വിളിക്കുന്ന പദം
  rationale: എബ്രായപദത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘നായ’ എന്നാണ്; രൂപകാലങ്കാര അർഥം ഉറപ്പില്ലാത്തതിനാൽ അതു മുഖ്യപാഠത്തിൽ അടിച്ചേൽപ്പിക്കാതെ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിലെ വ്യാപകവും തിരിച്ചറിയാവുന്നതുമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും മാന്യവും നിയമവാക്യത്തിന് യോജിച്ച ദൃഢതയുമുള്ള ശൈലി. ‘വേശ്യ’, ‘കൂലി’, ‘നായയുടെ വില’ എന്നീ നേരിട്ടുള്ള പദങ്ങൾ മൂലപാഠത്തിന്റെ തുറന്ന ഭാഷ മൃദൂകരിക്കാതെ നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വിവാദപ്രയോഗത്തിനു പിന്നാലെ മുഖ്യപാഠത്തിൽ നൽകിയിരിക്കുന്നു.
