source:
  edition: WLC
  text: בָּנִ֛ים אֲשֶׁר יִוָּלְד֥וּ לָ/הֶ֖ם דּ֣וֹר שְׁלִישִׁ֑י יָבֹ֥א לָ/הֶ֖ם בִּ/קְהַ֥ל יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/009.yaml
  text: Children born to them in the third generation may enter the assembly of Yahweh[a][b].
translation:
  language: ml
  text: അവർക്കു ജനിക്കുന്ന മക്കളിൽ മൂന്നാം തലമുറയിൽപ്പെട്ടവർ യാഹ്‌വേയുടെ സഭയിൽ പ്രവേശിക്കാം[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘പുത്രന്മാർ’; ഈ നിയമപരവും വംശാവലിസംബന്ധവുമായ സന്ദർഭത്തിൽ ഈ പദം സന്തതികളെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘മൂന്നാം തലമുറ പ്രവേശിക്കും.’ എബ്രായം ഇങ്ങനെ കൂടുതൽ ഔപചാരികമായി പരിഭാഷപ്പെടുത്താം; സന്ദർഭത്തിൽ മൂന്നാം തലമുറ മുതൽ പ്രവേശനം അനുവദിക്കപ്പെടുന്നു എന്നാണ് ആശയം.
    reason: alternative_reading
lexical_decisions:
- source_word: בָּנִים
  choice: മക്കൾ
  rationale: എബ്രായ പദത്തിന്റെ അക്ഷരാർഥം ‘പുത്രന്മാർ’ എന്നാണെങ്കിലും, ഈ നിയമപരവും വംശാവലിസംബന്ധവുമായ സന്ദർഭത്തിൽ അത് സന്തതികളെ പൊതുവായി സൂചിപ്പിക്കുന്നു. ‘മക്കൾ’ കുടുംബബന്ധം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר יִוָּלְדוּ לָהֶם
  choice: അവർക്കു ജനിക്കുന്ന
  rationale: ילד എന്ന ക്രിയയുടെ നിഷ്ക്രിയരൂപവും ל ചേർന്ന സർവനാമവും ചേർന്ന് ‘അവർക്കു ജനിക്കുന്ന’ എന്ന സ്വാഭാവിക അർഥം നൽകുന്നു.
- source_word: דּוֹר שְׁלִישִׁי
  choice: മൂന്നാം തലമുറയിലുള്ളവർ
  rationale: പ്രവേശനം അനുവദിക്കപ്പെടുന്ന വംശപരമ്പരയിലെ ഘട്ടമാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ വ്യക്തതയ്ക്കായി വ്യക്തികളെ സൂചിപ്പിക്കുന്ന ‘ഉള്ളവർ’ ചേർത്തു.
- source_word: יָבֹא
  choice: പ്രവേശിക്കാം
  rationale: അക്ഷരാർഥം ‘വരും/പ്രവേശിക്കും’ എന്നാണ്. നിയമപരമായ ഈ സന്ദർഭത്തിൽ അനുമതി വ്യക്തമാക്കുന്ന ‘പ്രവേശിക്കാം’ സ്വാഭാവികമാണ്; എങ്കിലും മൂലത്തിലെ ഭാവികാലരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: בִּקְהַל יְהוָה
  choice: യഹോവയുടെ സഭയിൽ
  rationale: קהל ഉടമ്പടിസമൂഹത്തിന്റെ ഔദ്യോഗിക കൂടിവരവിനെയോ സമൂഹത്തെയോ സൂചിപ്പിക്കുന്നു. ‘സഭ’ മലയാള ബൈബിൾഭാഷയിൽ പരിചിതവും ഈ ഔപചാരിക സമൂഹാർഥം വഹിക്കുന്നതുമാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമം ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകിയിരിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ ചതുരക്ഷരനാമമാണ് ഉള്ളത്; അതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ ദൈവനാമം നിലനിർത്തി.
- issue: നിയമ-വംശാവലി സന്ദർഭത്തിലെ בָּנִים എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: മക്കൾ
  alternative: പുത്രന്മാർ
  rationale: രൂപം പുല്ലിംഗ ബഹുവചനമാണെങ്കിലും ഇവിടെ ഒരു വംശത്തിലെ സന്തതികളെ പ്രതിനിധിയായി സൂചിപ്പിക്കുന്നു; പുരുഷന്മാരിൽ മാത്രം അർഥം അനാവശ്യമായി പരിമിതപ്പെടുത്താതിരിക്കാൻ ‘മക്കൾ’ തെരഞ്ഞെടുത്തു.
- issue: יָבֹא എന്ന ക്രിയയുടെ നിയമപരമായ ഭാവം
  choice: പ്രവേശിക്കാം
  alternative: പ്രവേശിക്കും
  rationale: നിയമസന്ദർഭത്തിൽ ഈ വാക്യം മൂന്നാം തലമുറ മുതൽ പ്രവേശനാനുമതി സൂചിപ്പിക്കുന്നു. എന്നാൽ വ്യാകരണപരമായി കൂടുതൽ ഔപചാരികമായ ഭാവികാല പരിഭാഷ സാധ്യമെന്ന കാര്യം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നിയമപരമായ അനുമതിഭാവം ‘പ്രവേശിക്കാം’ എന്നതിലൂടെ നൽകിയിരിക്കുന്നു; മൂലത്തിലെ സാധ്യതയുള്ള കൂടുതൽ അക്ഷരാർഥ വായന അടിക്കുറിപ്പിൽ നിലനിർത്തി. ‘സഭ’ എന്നത് ഇവിടെ പ്രാദേശിക ക്രൈസ്തവസഭയെ പ്രത്യേകമായി ഉദ്ദേശിക്കാതെ യഹോവയുടെ ഉടമ്പടിസമൂഹത്തെ സൂചിപ്പിക്കുന്നു.
