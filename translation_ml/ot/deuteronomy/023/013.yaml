- from: പാളയത്തിനു പുറത്തു നിനക്കായി ഒരു സ്ഥലം[a] ഉണ്ടായിരിക്കണം; നീ അവിടെ, പുറത്തേക്കു പോകണം.
  to: പാളയത്തിനു പുറത്തു നിനക്കായി ഒരു സ്ഥലം[a] ഉണ്ടായിരിക്കണം; നീ അവിടേക്കു, പുറത്തേക്കു പോകണം.
  rationale: The revision changes only “അവിടെ” to the directional “അവിടേക്കു.” This reflects the directional force of שָׁמָּה, improves Malayalam syntax, and retains the source text’s emphatic final reference to being outside. The lexical footnote and its anchor remain appropriate.
