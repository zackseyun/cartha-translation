translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ നിർദേശഭാവം ഉപയോഗിച്ചു. മൂലത്തിലെ ‘പുറത്ത്’ എന്ന ആവർത്തന ഊന്നൽ കഴിയുന്നത്ര നിലനിർത്തി.
