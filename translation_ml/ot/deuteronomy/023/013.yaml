source:
  edition: WLC
  text: וְ/יָד֙ תִּהְיֶ֣ה לְ/ךָ֔ מִ/ח֖וּץ לַֽ/מַּחֲנֶ֑ה וְ/יָצָ֥אתָ שָׁ֖מָּ/ה חֽוּץ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/013.yaml
  text: And you shall have a place outside the camp[a], and you shall go out there, outside.
translation:
  language: ml
  text: പാളയത്തിനു പുറത്തു നിനക്കായി ഒരു സ്ഥലം[a] ഉണ്ടായിരിക്കണം; നീ അവിടേക്കു, പുറത്തേക്കു പോകണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘കൈ’ (യാദ്); ഇവിടെ നിശ്ചയിച്ചിട്ടുള്ള ഒരു സ്ഥലം അഥവാ ഇടം എന്ന പ്രയോഗാർഥമായിരിക്കാം. അടുത്ത വാക്യത്തിന്റെ വെളിച്ചത്തിൽ ചില പരിഭാഷകൾ ഇതിനെ ഒരു ഉപകരണമോ കുറ്റിയോ ആയി പരിഭാഷപ്പെടുത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָד
  choice: സ്ഥലം
  rationale: സാധാരണയായി ‘കൈ’ എന്നർഥമുള്ള പദമാണെങ്കിലും, ഇവിടെ പാളയത്തിനു പുറത്തു നിശ്ചയിച്ചിട്ടുള്ള ഇടം എന്ന പ്രയോഗാർഥമാണ് സന്ദർഭത്തിനും വാക്യഘടനയ്ക്കും ഏറ്റവും യോജിക്കുന്നത്.
- source_word: תִּהְיֶה לְךָ
  choice: നിനക്കായി ... ഉണ്ടായിരിക്കണം
  rationale: היה + לְ എന്ന എബ്രായ ഘടന ലഭ്യതയെയോ ഒരാൾക്കായി ഏർപ്പെടുത്തിയിരിക്കുന്നതിനെയോ സൂചിപ്പിക്കുന്നു; നിർദേശത്തിന്റെ ഭാവവും ഇതിലൂടെ നിലനിർത്തുന്നു.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: പാളയത്തിനു പുറത്തു
  rationale: പാളയത്തിന്റെ അതിർത്തിക്കു പുറത്തുള്ള സ്ഥാനം നേരിട്ടും സ്വാഭാവികമായും വ്യക്തമാക്കുന്നു.
- source_word: וְיָצָאתָ
  choice: നീ ... പോകണം
  rationale: יצא എന്ന ക്രിയയുടെ ‘പുറത്തേക്കു പോകുക’ എന്ന ചലനാർഥവും നിർദേശാത്മക ഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: שָׁמָּה
  choice: അവിടെ
  rationale: മുമ്പു പറഞ്ഞ നിശ്ചിത സ്ഥലത്തേക്കാണ് ദിശാസൂചക ക്രിയാവിശേഷണം വിരൽചൂണ്ടുന്നത്.
- source_word: חוּץ
  choice: പുറത്തേക്കു
  rationale: വാക്യാവസാനത്തിലെ חוּץ പുറത്തെ സ്ഥാനം വീണ്ടും ഊന്നിപ്പറയുന്നു; മലയാളത്തിൽ ചലനത്തോടു ചേർത്തുകൊണ്ട് ആ ആവർത്തന ഊന്നൽ നിലനിർത്തുന്നു.
