source:
  edition: WLC
  text: כִּֽי תִדֹּ֥ר נֶ֨דֶר֙ לַ/יהוָ֣ה אֱלֹהֶ֔י/ךָ לֹ֥א תְאַחֵ֖ר לְ/שַׁלְּמ֑/וֹ כִּֽי דָּרֹ֨שׁ יִדְרְשֶׁ֜/נּוּ יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ מֵֽ/עִמָּ֔/ךְ וְ/הָיָ֥ה בְ/ךָ֖ חֵֽטְא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/022.yaml
  text: But if you make a vow to Yahweh your God[a], you shall not delay in paying it, for Yahweh your God will surely require it from you, and it will be sin in you.
translation:
  language: ml
  text: എന്നാൽ നിന്റെ ദൈവമായ യഹ്‌വേക്കു നീ ഒരു നേർച്ച നേർന്നാൽ, അതു നിറവേറ്റാൻ താമസിക്കരുത്. കാരണം നിന്റെ ദൈവമായ യഹ്‌വേ തീർച്ചയായും അതു നിന്നിൽനിന്ന് ആവശ്യപ്പെടും; അപ്പോൾ അതു നിനക്കു പാപമായിരിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നീ പാപക്കുറ്റക്കാരനായിരിക്കും.” എബ്രായപാഠം അക്ഷരാർഥത്തിൽ, “അതു നിന്നിൽ പാപമായിരിക്കും” എന്നു പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: എന്നാൽ ... നേർന്നാൽ
  rationale: മുൻവാക്യത്തോടുള്ള നേരിയ വൈരുധ്യവും വ്യവസ്ഥാസ്വഭാവവും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: תִדֹּר נֶדֶר
  choice: ഒരു നേർച്ച നേർന്നാൽ
  rationale: സജാതീയ കർമപ്രയോഗത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്ന, മലയാളത്തിൽ സ്വാഭാവികമായ ബൈബിൾപ്രയോഗം.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ യഹ്‌വേക്കു
  rationale: നേർച്ചയുടെ സ്വീകർത്താവിനെ സൂചിപ്പിക്കുന്ന לְ നിലനിർത്തുകയും ദൈവനാമം യഹ്‌വേ എന്നു ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: לֹא תְאַחֵר לְשַׁלְּמוֹ
  choice: അതു നിറവേറ്റാൻ താമസിക്കരുത്
  rationale: שלם എന്നത് നേർച്ചാസന്ദർഭത്തിൽ കൊടുക്കുക എന്നതോടൊപ്പം ബാധ്യത പൂർത്തിയാക്കുക എന്നും ഉൾക്കൊള്ളുന്നതിനാൽ ‘നിറവേറ്റുക’ കൂടുതൽ വ്യാപകവും സ്വാഭാവികവുമാണ്.
- source_word: דָּרֹשׁ יִדְרְשֶׁנּוּ
  choice: തീർച്ചയായും അതു നിന്നോടു ചോദിക്കും
  rationale: ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ടും ക്രിയയും ചേർന്ന ഊന്നൽ ‘തീർച്ചയായും’ വഴി സൂക്ഷിക്കുന്നു; דרש എന്നതിന്റെ ആവശ്യപ്പെടുക/കണക്കുചോദിക്കുക എന്ന നിയമപരമായ ഭാവം ‘ചോദിക്കും’ വഴി തുറന്നുവയ്ക്കുന്നു.
- source_word: מֵעִמָּךְ
  choice: നിന്നോടു
  rationale: നേർച്ച ചെയ്ത വ്യക്തിയിൽനിന്ന് അതിന്റെ നിറവേറ്റൽ ആവശ്യപ്പെടുമെന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְהָיָה בְךָ חֵטְא
  choice: അപ്പോൾ അതു നിനക്കു പാപമായിരിക്കും
  rationale: എബ്രായത്തിലെ സംക്ഷിപ്തവും അല്പം അസാധാരണവുമായ ‘നിന്നിൽ പാപമായിരിക്കും’ എന്ന ഘടനയുടെ രൂപകഭാവം കഴിയുന്നത്ര സൂക്ഷിക്കുന്നു; കുറ്റക്കാരനാകും എന്നു മാത്രം വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ / കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം പൊതുപദവിയാക്കി മാറ്റാതെ മലയാളലിപിയിൽ നേരിട്ട് പ്രതിനിധീകരിക്കുന്നു.
- issue: וְהָיָה בְךָ חֵטְא എന്നതിലെ പാപവും കുറ്റബാധ്യതയും
  choice: അതു നിനക്കു പാപമായിരിക്കും
  alternative: നീ പാപക്കുറ്റക്കാരനായിരിക്കും
  rationale: മൂലത്തിലെ ‘പാപം നിന്നിൽ/നിനക്കു ഉണ്ടായിരിക്കും’ എന്ന ദ്വയാർഥസാധ്യത നിലനിർത്തുന്നു; കുറ്റബാധ്യത എന്ന വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ നിയമോപദേശ ശൈലി. ‘നേർച്ച നേർന്നു’, ‘നിറവേറ്റുക’ എന്നീ പരിചിത പ്രയോഗങ്ങൾ ഉപയോഗിച്ചു; മൂലത്തിലെ ദൈവനാമവും അവസാനവാക്യത്തിലെ അർഥസമ്മർദവും സംരക്ഷിച്ചു.
