translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, മാന്യവും നിയമവാക്യത്തിന് യോജിച്ചും ഉള്ള ശൈലി. ‘വിളഞ്ഞുനിൽക്കുന്ന ധാന്യം’ അല്പം വിവരണാത്മകമാണെങ്കിലും കൊയ്യാതെ നിൽക്കുന്ന വിള എന്ന മൂലപാഠത്തിന്റെ പ്രത്യേകത സംരക്ഷിക്കുന്നു.
