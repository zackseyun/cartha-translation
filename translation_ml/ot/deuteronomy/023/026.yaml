  yaml_path: translation/ot/deuteronomy/023/026.yaml
  text: When you come into your neighbor’s standing grain[a], you may pluck heads with your hand[b], but you shall not put a sickle to your neighbor’s standing grain.
translation:
  language: ml
  text: നിന്റെ അയൽക്കാരന്റെ നിൽക്കുന്ന ധാന്യവിളയിൽ നീ ചെല്ലുമ്പോൾ, നിനക്കു കൈകൊണ്ട് കതിരുകൾ പറിക്കാം[a]; എന്നാൽ നിന്റെ അയൽക്കാരന്റെ നിൽക്കുന്ന ധാന്യവിളയ്ക്കുമേൽ അരിവാൾ പ്രയോഗിക്കരുത്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ധാന്യക്കതിരുകൾ’. എബ്രായപദം കൈകൊണ്ട് പറിക്കാവുന്ന, ധാന്യമണികൾ വഹിക്കുന്ന കതിരുകളെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നിന്റെ അയൽക്കാരന്റെ നിൽക്കുന്ന ധാന്യവിളയ്ക്കുമേൽ അരിവാൾ വീശരുത്.’ എബ്രായക്രിയയ്ക്ക് അരിവാൾ വീശുക, ചലിപ്പിക്കുക, അല്ലെങ്കിൽ വിളയിൽ പ്രയോഗിക്കുക എന്ന ആശയമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תָבֹא
  choice: നീ ചെല്ലുമ്പോൾ
  rationale: നിയമം ബാധകമാകുന്ന സാഹചര്യം അവതരിപ്പിക്കുന്ന പ്രയോഗമാണ്; ഉപാധിപരമായ ‘എങ്കിൽ’ എന്നതിനെക്കാൾ സ്വാഭാവികമായി ‘ചെല്ലുമ്പോൾ’ ആ അർഥം നൽകുന്നു.
- source_word: בְּקָמַת רֵעֶךָ
  choice: നിന്റെ അയൽക്കാരന്റെ വിളഞ്ഞുനിൽക്കുന്ന ധാന്യത്തിനിടയിൽ
  rationale: קָמָה കൊയ്യപ്പെടാതെ വയലിൽ നിൽക്കുന്ന ധാന്യവിളയെ സൂചിപ്പിക്കുന്നു. ‘വിളഞ്ഞുനിൽക്കുന്ന ധാന്യം’ ഈ പ്രത്യേകത നിലനിർത്തുന്നു; בְּ എന്നതിന്റെ സ്ഥലസൂചന ‘ഇടയിൽ’ എന്നു സ്വാഭാവികമായി നൽകിയിരിക്കുന്നു.
- source_word: וְקָטַפְתָּ
  choice: നിനക്കു ... പറിക്കാം
  rationale: രൂപപരമായി സാധാരണ ക്രിയാരൂപമാണെങ്കിലും നിയമസന്ദർഭത്തിൽ ഇത് അനുവാദമാണ്, കല്പനയല്ല; ‘പറിക്കാം’ അതു വ്യക്തമാക്കുന്നു.
- source_word: מְלִילֹת
  choice: കതിരുകൾ
  rationale: ധാന്യമണികൾ വഹിക്കുന്ന ears/heads എന്ന അർഥത്തിന് മലയാളത്തിലെ സ്വാഭാവിക കാർഷികപദമാണ് ‘കതിരുകൾ’.
- source_word: בְּיָדֶךָ
  choice: കൈകൊണ്ട്
  rationale: അനുവദിക്കപ്പെട്ടത് കൈകൊണ്ടുള്ള പരിമിതമായ പറിക്കൽ മാത്രമാണെന്ന രീതി നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: וְחֶרְמֵשׁ לֹא תָנִיף
  choice: എന്നാൽ ... അരിവാൾ പ്രയോഗിക്കരുത്
  rationale: കൈകൊണ്ട് പറിക്കാനുള്ള അനുവാദവും അരിവാൾകൊണ്ടുള്ള കൊയ്ത്തിന്റെ നിരോധനവും തമ്മിലുള്ള വൈരുധ്യം ‘എന്നാൽ’ വ്യക്തമാക്കുന്നു. נוּף എന്ന ക്രിയയുടെ വീശുക/ചലിപ്പിക്കുക/പ്രയോഗിക്കുക എന്ന പരിധിയിൽ, ഇവിടെ ഉപകരണം വിളയിൽ പ്രയോഗിക്കുന്നതിനെ ‘അരിവാൾ പ്രയോഗിക്കരുത്’ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: עַל קָמַת רֵעֶךָ
  choice: നിന്റെ അയൽക്കാരന്റെ വിളഞ്ഞുനിൽക്കുന്ന ധാന്യത്തിന്മേൽ
  rationale: עַל എന്നതിന്റെ മേൽ/അതിനോട് പ്രയോഗിക്കുക എന്ന ബന്ധം നിലനിർത്തുകയും നിരോധനത്തിന്റെ വസ്തു കൊയ്യാത്ത ധാന്യവിള തന്നെയാണെന്ന് ആവർത്തിക്കുകയും ചെയ്യുന്നു.
