reference: Deuteronomy 23:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לֹֽא אָבָ֞ה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ לִ/שְׁמֹ֣עַ אֶל בִּלְעָ֔ם וַ/יַּהֲפֹךְ֩ יְהוָ֨ה אֱלֹהֶ֧י/ךָ לְּ/ךָ֛ אֶת הַ/קְּלָלָ֖ה לִ/בְרָכָ֑ה כִּ֥י אֲהֵֽבְ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/006.yaml
  text: But Yahweh your God was not willing to listen to Balaam, and Yahweh your God turned the curse into a blessing for you, because Yahweh your God loved you.
translation:
  language: ml
  text: എന്നാൽ നിന്റെ ദൈവമായ യാഹ്‌വേ ബിലെയാമിനെ കേൾക്കാൻ തയ്യാറായില്ല; നിന്റെ ദൈവമായ യാഹ്‌വേ നിന്നെ സ്നേഹിച്ചതുകൊണ്ട് അവൻ ആ ശാപത്തെ നിനക്കായി അനുഗ്രഹമാക്കി മാറ്റി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָבָה
  choice: മനസ്സായില്ല
  rationale: കഴിവില്ലായ്മയല്ല, സന്നദ്ധതയോ സമ്മതമോ ഇല്ലായ്മയാണ് ക്രിയ സൂചിപ്പിക്കുന്നത്; ആ ഇച്ഛാസംബന്ധമായ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു പദവികൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവം
  rationale: രണ്ടാംപുരുഷ ഏകവചന പ്രത്യയത്തോടുകൂടിയ രൂപത്തിന്റെ നേരിട്ടുള്ള മലയാള പരിഭാഷ.
- source_word: לִשְׁמֹעַ אֶל
  choice: വാക്കു കേൾക്കാൻ
  rationale: ഇവിടെ കേൾക്കുക എന്നത് വെറും ശബ്ദഗ്രഹണമല്ല, ബിലെയാമിന്റെ ഉദ്ദേശത്തിന് ചെവികൊടുക്കുകയോ അത് അംഗീകരിക്കുകയോ ചെയ്യുന്നതാണ്; മലയാളത്തിൽ ‘വാക്കു കേൾക്കുക’ ഈ പ്രയോഗാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בִּלְעָם
  choice: ബിലെയാം
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: וַיַּהֲפֹךְ
  choice: മാറ്റി
  rationale: ഒരു നിലയിൽനിന്ന് വിപരീതഫലത്തിലേക്കുള്ള പരിവർത്തനം സൂചിപ്പിക്കുന്നു; ‘ശാപത്തെ അനുഗ്രഹമാക്കി മാറ്റി’ എന്നത് മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: הַקְּלָלָה
  choice: ആ ശാപം
  rationale: സന്ദർഭത്തിൽ ഇസ്രായേലിനെതിരായി ഉദ്ദേശിച്ച നിർദിഷ്ട ശാപത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: לִבְרָכָה
  choice: അനുഗ്രഹമാക്കി
  rationale: ലാമെദ് ഇവിടെ ഫലമോ പരിവർത്തനമോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘-ആക്കി’ ഘടന അത് കൃത്യമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: כִּי
  choice: -തുകൊണ്ട്
  rationale: യഹോവയുടെ പ്രവൃത്തിക്കുള്ള കാരണം അവതരിപ്പിക്കുന്ന ഹേതുബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֲהֵבְךָ
  choice: നിന്നെ സ്നേഹിച്ചതുകൊണ്ട്
  rationale: אָהֵב എന്ന ക്രിയയുടെ ലളിതവും നേരിട്ടുള്ളതുമായ അർഥം നിലനിർത്തി, കാരണവാക്യവുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു പകരാതെ, മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരരൂപത്തിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ഏകവചന അഭിസംബോധനയായ ‘നിന്റെ/നിന്നെ’ മൂലത്തിലെ 2ms രൂപം നിലനിർത്തുന്നു. ‘വാക്കു കേൾക്കാൻ മനസ്സായില്ല’ എന്ന പ്രയോഗം വെറും കേൾവിബോധമല്ല, സമ്മതിക്കാതിരിക്കുക എന്ന ആശയവും കൈവിടാതെ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി ഗ്രഹിക്കാവുന്ന വിധത്തിലാണ്.
