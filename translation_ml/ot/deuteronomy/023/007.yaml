  text: You shall not seek their peace or their prosperity all your days forever[a].
translation:
  language: ml
  text: അവരുടെ സമാധാനമോ അഭിവൃദ്ധിയോ നിന്റെ ആയുഷ്കാലമൊക്കെയും എന്നേക്കും അന്വേഷിക്കരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവരുടെ ക്ഷേമമോ അവരുടെ നന്മയോ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദങ്ങളുടെ അർഥം രാഷ്ട്രീയ സമാധാനത്തിലും സാമ്പത്തിക അഭിവൃദ്ധിയിലും ഒതുങ്ങുന്നതല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִדְרֹשׁ
  choice: അന്വേഷിക്കരുത്
  rationale: דרש എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘അന്വേഷിക്കുക/തേടുക’ നിലനിർത്തുന്നു; അമൂർത്തമായ കർമങ്ങളോടൊപ്പം മലയാളത്തിൽ സ്വാഭാവികവുമാണ്.
- source_word: שְׁלֹמָם
  choice: അവരുടെ സമാധാനം
  rationale: שָׁלוֹם എന്ന പദത്തിന്റെ സമാധാനം, ക്ഷേമം, സൗഖ്യം എന്നീ വിശാല അർഥമേഖലകളിൽ മുഖ്യമായ ‘സമാധാനം’ നിലനിർത്തുകയും തുടർന്നുള്ള טוֹבָהയിൽനിന്ന് വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: טֹבָתָם
  choice: അഭിവൃദ്ധി
  rationale: טוֹבָה ഇവിടെ നന്മ, ഗുണം, ക്ഷേമാവസ്ഥ, അഭിവൃദ്ധി എന്നിവ സൂചിപ്പിക്കാം. ‘അഭിവൃദ്ധി’ മറ്റൊരു ജനതയുടെ നന്മയും വളർച്ചയും തേടുക എന്ന സന്ദർഭത്തിന് യോജിക്കുകയും ആദ്യ നാമത്തിൽനിന്ന് വ്യത്യാസം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: כָּל יָמֶיךָ
  choice: നിന്റെ ആയുഷ്കാലമൊക്കെയും
  rationale: അക്ഷരാർഥമായ ‘നിന്റെ എല്ലാ ദിവസങ്ങളിലും’ എന്നതിന്റെ സ്വാഭാവിക മലയാളരൂപം; ഏകവചന അഭിസംബോധന നിലനിർത്തുന്നു.
- source_word: לְעוֹלָם
  choice: എന്നേക്കും
  rationale: നിരോധനത്തിന്റെ ദീർഘകാലബലം വ്യക്തമായി നിലനിർത്തുന്ന സ്വാഭാവിക ആധുനിക മലയാളപ്രയോഗം.
theological_decisions:
- issue: ‘നിന്റെ ആയുഷ്കാലമൊക്കെയും’ എന്നും ‘എന്നേക്കും’ എന്നും ചേർന്നുള്ള പ്രത്യക്ഷ ആവർത്തനം
  choice: രണ്ട് കാലസൂചനകളും പരിഭാഷയിൽ നിലനിർത്തി
  alternative: ‘നീ ജീവിച്ചിരിക്കുന്ന കാലത്തോളം’ എന്നു ചുരുക്കുക
  rationale: כָּל יָמֶיךָ, לְעוֹלָם എന്നീ രണ്ടു പ്രയോഗങ്ങളും എബ്രായപാഠം ഊന്നലിനായി അടുക്കിവയ്ക്കുന്നു; അത് മിനുക്കി നീക്കാതെ ഉറവിടത്തിന്റെ ശക്തി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വാക്യഘടന. ‘ആയുഷ്കാലമൊക്കെയും എന്നേക്കും’ എന്ന അസാധാരണമായ അടുക്കൽ ഉറവിടപാഠത്തിലെ ഉദ്ദേശ്യപൂർവമായ ഊന്നൽ സംരക്ഷിക്കാൻ നിലനിർത്തി.
