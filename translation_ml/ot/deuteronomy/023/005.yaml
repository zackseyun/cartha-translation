source:
  edition: WLC
  text: עַל דְּבַ֞ר אֲשֶׁ֨ר לֹא קִדְּמ֤וּ אֶתְ/כֶם֙ בַּ/לֶּ֣חֶם וּ/בַ/מַּ֔יִם בַּ/דֶּ֖רֶךְ בְּ/צֵאתְ/כֶ֣ם מִ/מִּצְרָ֑יִם וַ/אֲשֶׁר֩ שָׂכַ֨ר עָלֶ֜י/ךָ אֶת בִּלְעָ֣ם בֶּן בְּע֗וֹר מִ/פְּת֛וֹר אֲרַ֥ם נַהֲרַ֖יִם לְ/קַֽלְלֶֽ/ךָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/005.yaml
  text: because they did not meet you with bread and water on the way when you came out from Egypt[a], and because he hired Balaam son of Beor from Pethor of Aram-naharaim against you to curse you.
translation:
  language: ml
  text: കാരണം, നിങ്ങൾ ഈജിപ്തിൽനിന്ന് പുറപ്പെട്ടപ്പോൾ വഴിയിൽ അവർ അപ്പവും വെള്ളവുമായി നിങ്ങളെ എതിരേറ്റില്ല; കൂടാതെ, നിങ്ങളെ ശപിക്കാൻ അവൻ അരാം-നഹരയീമിലെ[a] പെഥോരിൽനിന്ന് ബെയോരിന്റെ മകൻ ബിലെയാമിനെ നിങ്ങൾക്കെതിരായി കൂലിക്കെടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അരാം-നഹരയീം പരമ്പരാഗതമായി മെസൊപ്പൊത്താമ്യയുമായി തിരിച്ചറിയപ്പെടുന്നു; ഈ പേരിന്റെ അക്ഷരാർഥം ‘രണ്ടു നദികളുടെ അരാം’ എന്നാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: עַל דְּבַר
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ വിലക്കിനുള്ള കാരണങ്ങൾ അവതരിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ കാരണസൂചകബലം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: קִדְּמוּ אֶתְכֶם
  choice: നിങ്ങളെ എതിരേറ്റില്ല
  rationale: വിഭവങ്ങളുമായി ചെന്നുകണ്ട് സ്വീകരിക്കുക എന്ന സന്ദർഭാർഥം നിലനിർത്തുന്നു; ‘സ്വീകരിച്ചില്ല’ എന്നതിനെക്കാൾ മൂലപദത്തിന്റെ കൂടിക്കാഴ്ചാഭാവം വ്യക്തമാക്കുന്നു.
- source_word: בַּלֶּחֶם וּבַמַּיִם
  choice: അപ്പവും വെള്ളവുമായി
  rationale: എബ്രായത്തിലെ മൂർത്തമായ രണ്ടു നാമങ്ങളും നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ ഉപകരണസൂചക രൂപം ഉപയോഗിക്കുന്നു.
- source_word: בַּדֶּרֶךְ
  choice: വഴിയിൽ
  rationale: സ്ഥലസൂചക പ്രയോഗത്തിന്റെ ലളിതവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: בְּצֵאתְכֶם מִמִּצְרָיִם
  choice: നിങ്ങൾ ഈജിപ്തിൽനിന്ന് പുറപ്പെട്ടപ്പോൾ
  rationale: കാലസൂചകമായ infinitive construct-ന്റെ അർഥവും പുറപ്പാടിന്റെ പരാമർശവും വ്യക്തമായി നൽകുന്നു.
- source_word: וַאֲשֶׁר
  choice: കൂടാതെ
  rationale: ആദ്യ കാരണത്തോടു സമാന്തരമായ രണ്ടാമത്തെ കാരണത്തെ മലയാളത്തിൽ വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു; ‘കാരണം’ എന്ന ആശയം മുൻവാക്യത്തിൽനിന്ന് തുടർന്നുവരുന്നു.
- source_word: שָׂכַר עָלֶיךָ
  choice: നിങ്ങൾക്കെതിരായി കൂലിക്കെടുത്തു
  rationale: שׂכר എന്നതിന്റെ ‘കൂലിക്കെടുക്കുക’ എന്ന അർഥവും עַל എന്നതിന്റെ ശത്രുതാപരമായ ദിശയും സംരക്ഷിക്കുന്നു.
- source_word: בִּלְעָם בֶּן בְּעוֹר
  choice: ബെയോരിന്റെ മകൻ ബിലെയാം
  rationale: വ്യക്തിനാമങ്ങൾ മലയാളലിപിയിൽ ശബ്ദാന്തരണം ചെയ്യുകയും എബ്രായ പിതൃനാമബന്ധം സ്വാഭാവിക മലയാളക്രമത്തിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: מִפְּתֹר אֲרַם נַהֲרַיִם
  choice: അരാം-നഹരയീമിലെ പെഥോരിൽനിന്ന്
  rationale: പ്രദേശനാമവും സ്ഥലനാമവും ശബ്ദാന്തരണം ചെയ്ത് ഭൂമിശാസ്ത്രബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘മെസൊപ്പൊത്താമ്യ’ എന്ന വ്യാഖ്യാനപരമായ പകരം മുഖ്യവാചകത്തിൽ കൊണ്ടുവരുന്നില്ല.
- source_word: לְקַלְלֶךָּ
  choice: നിങ്ങളെ ശപിക്കാൻ
  rationale: ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന infinitive-ന്റെ നേരിട്ടുള്ള, സ്വാഭാവിക മലയാളപരിഭാഷ.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. വാക്യം മുൻപത്തെ നിയമവാക്യത്തിന്റെ കാരണഭാഗമായതിനാൽ ‘കാരണം’ എന്ന തുടക്കം നിലനിർത്തി. ബഹുവചനമായ ‘അവർ’ എന്ന ആദ്യ കർത്താവിനും ഏകവചനമായ ‘അവൻ’ എന്ന രണ്ടാം കർത്താവിനുമിടയിലെ എബ്രായ മാറ്റം വ്യാഖ്യാനിച്ച് സമതലപ്പെടുത്താതെ സംരക്ഷിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട പ്രദേശനാമത്തിന് പിന്നാലെ ചേർത്തു.
