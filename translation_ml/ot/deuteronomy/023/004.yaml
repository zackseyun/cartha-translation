id: DEU.23.4
reference: Deuteronomy 23:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹֽא יָבֹ֧א עַמּוֹנִ֛י וּ/מוֹאָבִ֖י בִּ/קְהַ֣ל יְהוָ֑ה גַּ֚ם דּ֣וֹר עֲשִׂירִ֔י לֹא יָבֹ֥א לָ/הֶ֛ם בִּ/קְהַ֥ל יְהוָ֖ה עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/004.yaml
  text: No Ammonite or Moabite may enter the assembly of Yahweh[a]; even to the tenth generation[b], none of them may enter the assembly of Yahweh forever.
translation:
  language: ml
  text: അമ്മോന്യനോ മോവാബ്യനോ യഹോവയുടെ സഭയിൽ[a] പ്രവേശിക്കരുത്; പത്താം തലമുറവരെപ്പോലും[b] അവരിൽ ഒരാളും യഹോവയുടെ സഭയിൽ എന്നേക്കും പ്രവേശിക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യഹോവയുടെ സഭ’ എന്നതിന് ‘യഹോവയുടെ ജനസമൂഹം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രുവിൽ ‘പത്താം തലമുറവരെപ്പോലും’ എന്നും ‘എന്നേക്കും’ എന്നും രണ്ടും പറയുന്നു. ഒന്നിനെ മറ്റൊന്നായി ചുരുക്കാതെ നിലനിൽക്കുന്ന വിലക്കിന്റെ ശക്തി ഇവിടെ സംരക്ഷിച്ചിരിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: יָבֹא
  choice: പ്രവേശിക്കരുത്
  rationale: നിയമവാക്യത്തിൽ לֹא സഹിതമുള്ള അപൂർണക്രിയ നിരോധനമോ പ്രവേശനവിലക്കോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘പ്രവേശിക്കരുത്’ അത് സ്വാഭാവികമായും വ്യക്തമായും അറിയിക്കുന്നു.
- source_word: עַמּוֹנִי וּמוֹאָבִי
  choice: അമ്മോന്യനോ മോവാബ്യനോ
  rationale: ജാതിനാമങ്ങളെ മലയാളത്തിലെ പ്രചാരത്തിലുള്ള രൂപത്തിൽ നൽകുന്നു; וּ ഇവിടെ നിരോധനത്തിന്റെ പരിധിയിൽ ‘അല്ലെങ്കിൽ/ആയാലും’ എന്ന ഉൾക്കൊള്ളുന്ന അർഥം വഹിക്കുന്നതിനാൽ ‘-നോ ... -നോ’ സ്വാഭാവികമാണ്.
- source_word: קְהַל
  choice: സഭ
  rationale: ഔദ്യോഗികമായി കൂടിയ ഉടമ്പടിസമൂഹത്തെ സൂചിപ്പിക്കുന്ന קָהָל എന്ന പദത്തിന് dignified, പൊതുവായി മനസ്സിലാകുന്ന മലയാളരൂപം; ‘സമൂഹം’ എന്നതിനെക്കാൾ കൂടിവരവിന്റെ ആശയം നന്നായി നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ സ്ഥാപിതമായ ലിപ്യന്തരണരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: גַּם דּוֹר עֲשִׂירִי
  choice: പത്താം തലമുറപോലും
  rationale: גַּם നൽകുന്ന ഊന്നലും דּוֹר עֲשִׂירִי എന്ന തലമുറസൂചനയും ചുരുക്കാതെയും സ്വാഭാവികമായും സംരക്ഷിക്കുന്നു.
- source_word: לָהֶם
  choice: അവരുടെ
  rationale: ആ ജാതികളുമായി ബന്ധപ്പെട്ട തലമുറയെ സൂചിപ്പിക്കുന്ന ഹീബ്രു സർവനാമബന്ധം മലയാളത്തിൽ വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: עַד עוֹלָם
  choice: എന്നേക്കും
  rationale: നിലനിൽക്കുന്ന കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന സാധാരണവും ഗൗരവമുള്ളതുമായ മലയാളപ്രയോഗം; ‘പത്താം തലമുറ’ എന്ന മുൻപ്രയോഗവുമായി ലയിപ്പിക്കാതെ രണ്ടും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘പത്താം തലമുറപോലും’ എന്നതും ‘എന്നേക്കും’ എന്നതും തമ്മിലുള്ള ബന്ധം
  choice: രണ്ടു കാലസൂചനകളും മുഖ്യവാചകത്തിൽ അതേപടി നിലനിർത്തി.
  alternative: ‘പത്താം തലമുറ’ എന്നത് ‘ഒരിക്കലും ഇല്ല’ എന്നർഥമുള്ള ശൈലിയായി മാത്രം കണ്ട് ‘എന്നേക്കും’ എന്ന ഒറ്റപ്രയോഗത്തിലേക്ക് ചുരുക്കുക.
  rationale: ഹീബ്രു വാചകം രണ്ടു പ്രയോഗങ്ങളും ഉപയോഗിക്കുന്നു. അവയ്ക്കിടയിലെ ഊന്നലും വ്യാഖ്യാനസമ്മർദവും പരിഭാഷ നിശ്ശബ്ദമായി പരിഹരിക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമശൈലി. ജാതിനാമങ്ങൾ ഏകവചനത്തിൽ പൊതുവർഗത്തെ സൂചിപ്പിക്കുന്നു; ആവർത്തനം ഹീബ്രു വാക്യത്തിന്റെ നിയമപരമായ ഊന്നൽ നിലനിർത്താൻ സൂക്ഷിച്ചിരിക്കുന്നു.
