id: DEU.23.21
reference: Deuteronomy 23:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לַ/נָּכְרִ֣י תַשִּׁ֔יךְ וּ/לְ/אָחִ֖י/ךָ לֹ֣א תַשִּׁ֑יךְ לְמַ֨עַן יְבָרֶכְ/ךָ֜ יְהוָ֣ה אֱלֹהֶ֗י/ךָ בְּ/כֹל֙ מִשְׁלַ֣ח יָדֶ֔/ךָ עַל הָ/אָ֕רֶץ אֲשֶׁר אַתָּ֥ה בָא שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/021.yaml
  text: You may charge interest to a foreigner[a], but to your brother you shall not charge interest[b], so that Yahweh your God may bless you in all the work of your hand in the land that you are entering to possess.
translation:
  language: ml
  text: വിദേശിയിൽനിന്ന് നീ പലിശ ഈടാക്കാം[a]; എന്നാൽ നിന്റെ സഹോദരനിൽനിന്ന് പലിശ ഈടാക്കരുത്[b]. അതുവഴി, നീ കൈവശമാക്കാൻ പ്രവേശിക്കുന്ന ദേശത്ത് നിന്റെ കൈയുടെ സകല ഉദ്യമങ്ങളിലും നിന്റെ ദൈവമായ യഹ്‌വെ നിന്നെ അനുഗ്രഹിക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “പലിശയ്ക്ക് കടം കൊടുക്കാം” / “പലിശ വാങ്ങാം.”'
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ “നിന്റെ സഹോദരൻ” എന്നത് സഹ ഇസ്രായേല്യനെ, അതായത് ഇസ്രായേൽ സമൂഹത്തിലെ ഒരംഗത്തെ, സൂചിപ്പിക്കുന്നു; എബ്രായമൂലം കുടുംബബന്ധപദം തന്നെയാണ് ഉപയോഗിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: לַנָּכְרִי
  choice: വിദേശിയിൽനിന്ന്
  rationale: נָכְרִי ഇവിടെ ഇസ്രായേൽ സമൂഹത്തിൽപ്പെടാത്ത വിദേശിയെ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള ‘നിന്റെ സഹോദരൻ’ എന്ന പ്രയോഗത്തോടുള്ള നിയമപരമായ വൈരുധ്യം ഇത് വ്യക്തമാക്കുന്നു.
- source_word: תַשִּׁיךְ / לֹא תַשִּׁיךְ
  choice: പലിശ ഈടാക്കാം / പലിശ ഈടാക്കരുത്
  rationale: נשׁך എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഈ വായ്പാനിയമത്തിൽ പലിശ ചുമത്തുകയോ ഈടാക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പലിശ ഈടാക്കുക’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും നിഷ്പക്ഷവുമാണ്.
- source_word: אָחִיךָ
  choice: നിന്റെ സഹോദരൻ
  rationale: എബ്രായത്തിലെ കുടുംബബന്ധപദം നിലനിർത്തുന്നു; ഈ ഉടമ്പടി-നിയമസന്ദർഭത്തിൽ അത് സഹ ഇസ്രായേല്യനെ സൂചിപ്പിക്കുന്നു.
- source_word: לְמַעַן
  choice: അങ്ങനെ
  rationale: ഉദ്ദേശ്യം/ഫലം സൂചിപ്പിക്കുന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; അനുസരണത്തോടു ബന്ധപ്പെട്ട അനുഗ്രഹഫലം പ്രകടമാക്കുന്നു.
- source_word: יְבָרֶכְךָ יְהוָה אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ യഹ്‌വെ നിന്നെ അനുഗ്രഹിക്കും
  rationale: יְהוָה എന്ന ഉടമ്പടിനാമം ലിപ്യന്തരണം ചെയ്തു; ഉദ്ദേശ്യവാക്യത്തിലെ അനുഗ്രഹഫലം മലയാളത്തിൽ സ്വാഭാവികമായി ഭാവികാലത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: בְּכֹל מִשְׁלַח יָדֶךָ
  choice: നിന്റെ കൈ ചെയ്യുന്ന സകല പ്രവൃത്തിയിലും
  rationale: ‘കൈയുടെ ഉദ്യമം/പ്രവൃത്തി’ എന്ന എബ്രായ ദൃശ്യഭാഷ ഭാഗികമായി നിലനിർത്തിക്കൊണ്ട് അതിന്റെ അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു.
- source_word: עַל הָאָרֶץ
  choice: ദേശത്ത്
  rationale: സ്ഥലസൂചനയായ עַל ഈ സന്ദർഭത്തിൽ മലയാളത്തിൽ ‘ദേശത്ത്’ എന്ന് സ്വാഭാവികമായി വരുന്നു.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה לְרִשְׁתָּהּ
  choice: നീ കൈവശമാക്കാൻ പ്രവേശിക്കുന്ന
  rationale: בוא എന്ന പ്രവേശനചലനവും לרשתה എന്ന ലക്ഷ്യവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ ചതുർവ്യഞ്ജന ദൈവനാമം ഒരു പദവിയായി മാറ്റാതെ ഉടമ്പടിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: ‘സഹോദരൻ’ എന്നതിന്റെ നിയമസന്ദർഭപരമായ പരിധി
  choice: പ്രധാന പാഠത്തിൽ ‘നിന്റെ സഹോദരൻ’; അടിക്കുറിപ്പിൽ സഹ ഇസ്രായേല്യൻ എന്നു വിശദീകരണം
  alternative: പ്രധാന പാഠത്തിൽ ‘നിന്റെ സഹ ഇസ്രായേല്യൻ’
  rationale: മൂലത്തിലെ കുടുംബബന്ധരൂപകം സംരക്ഷിക്കുമ്പോൾ അതിന്റെ ഉടമ്പടി-സാമൂഹിക അർഥം അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുന്നു; പദത്തിന്റെ പരിധി പ്രധാന പാഠത്തിൽ നിശ്ശബ്ദമായി വ്യാഖ്യാനിച്ച് മാറ്റുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ‘സഹോദരൻ’, ‘കൈ ചെയ്യുന്ന പ്രവൃത്തി’ എന്നീ മൂലപാഠചിത്രങ്ങൾ വായനാസൗകര്യം നഷ്ടപ്പെടുത്താതെ നിലനിർത്തി; ദൈവനാമം ‘യഹ്‌വെ’ എന്നു നൽകി.
