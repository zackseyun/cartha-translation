  source_fidelity: 'മുഖ്യ ആശയം കൃത്യമാണ്: נָכְרִי-യുമായും ‘നിന്റെ സഹോദരൻ’-മായും ഉള്ള നിയമപരമായ വൈരുധ്യവും പലിശ ഈടാക്കുന്നതിന്റെ അനുവാദ/വിലക്ക് വ്യത്യാസവും ശരിയായി പ്രതിഫലിക്കുന്നു. എന്നാൽ לְמַעַן-നു പിന്നാലെയുള്ള יְבָרֶכְךָ ഉദ്ദേശ്യസൂചനയിലാണ്; കരടിലെ ഉറപ്പായ ഭാവികാലമായ ‘അനുഗ്രഹിക്കും’ അതിനെ അല്പം മാറ്റുന്നു.'
  naturalness: ‘വിദേശിയിൽനിന്ന് പലിശ ഈടാക്കാം’യും ‘നിന്റെ സഹോദരനിൽനിന്ന് പലിശ ഈടാക്കരുത്’യും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്. ‘അതുവഴി … അനുഗ്രഹിക്കേണ്ടതിന്’ ഉദ്ദേശ്യബന്ധം വ്യക്തമായി അറിയിക്കുകയും മാന്യമായ നിയമഭാഷ നിലനിർത്തുകയും ചെയ്യുന്നു. ‘നിന്റെ കൈയുടെ സകല ഉദ്യമങ്ങളിലും’ എന്നത് എബ്രായപ്രയോഗത്തോട് ചേർന്നും സ്വാഭാവികമായും വരുന്നു.
  terminology: ‘യഹ്‌വെ’, ‘സഹോദരൻ’, ‘പലിശ’ എന്നിവ ഉചിതമാണ്. ‘സഹോദരൻ’ സഹ ഇസ്രായേല്യനെ സൂചിപ്പിക്കുന്നതാണെന്ന അടിക്കുറിപ്പ് മൂലപാഠത്തിലെ കുടുംബപദം നിലനിർത്തിക്കൊണ്ട് ആവശ്യമായ സാമൂഹികസന്ദർഭം നൽകുന്നു.
  issues:
