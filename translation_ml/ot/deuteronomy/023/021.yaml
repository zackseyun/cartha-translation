revisions:
- from: വിദേശിയിൽനിന്ന് നീ പലിശ ഈടാക്കാം[a]; എന്നാൽ നിന്റെ സഹോദരനിൽനിന്ന് പലിശ ഈടാക്കരുത്[b]. അങ്ങനെ, നീ കൈവശമാക്കാൻ പ്രവേശിക്കുന്ന ദേശത്ത് നിന്റെ കൈ ചെയ്യുന്ന സകല പ്രവൃത്തിയിലും നിന്റെ ദൈവമായ യഹ്‌വെ നിന്നെ അനുഗ്രഹിക്കും.
  to: വിദേശിയിൽനിന്ന് നീ പലിശ ഈടാക്കാം[a]; എന്നാൽ നിന്റെ സഹോദരനിൽനിന്ന് പലിശ ഈടാക്കരുത്[b]. അതുവഴി, നീ കൈവശമാക്കാൻ പ്രവേശിക്കുന്ന ദേശത്ത് നിന്റെ കൈയുടെ സകല ഉദ്യമങ്ങളിലും നിന്റെ ദൈവമായ യഹ്‌വെ നിന്നെ അനുഗ്രഹിക്കേണ്ടതിന്.
  rationale: ഉദ്ദേശ്യസൂചകമായ ലְמַעַן യും അതിനോടു ബന്ധപ്പെട്ട יְבָרֶכְךָ യും ‘അതുവഴി … അനുഗ്രഹിക്കേണ്ടതിന്’ എന്നു പരിഭാഷപ്പെടുത്തി. ഇതിലൂടെ ദൈവാനുഗ്രഹത്തെ നിബന്ധനയില്ലാത്ത ഭാവിപ്രസ്താവനയായി അല്ലാതെ മൂലവാക്യത്തിലെ ഉദ്ദേശ്യ/ഫലബന്ധമായി നിലനിർത്തുന്നു. ‘കൈ ചെയ്യുന്ന സകല പ്രവൃത്തിയിലും’ എന്നതിനു പകരം ‘കൈയുടെ സകല ഉദ്യമങ്ങളിലും’ എന്നു നൽകിയത് מִשְׁלַח יָדֶךָ എന്ന എബ്രായപ്രയോഗത്തിലെ ‘undertakings’ എന്ന അർഥവും ‘കൈ’ എന്ന ദൃശ്യഭാഷയും കൂടുതൽ നന്നായി സംരക്ഷിക്കാനാണ്.
