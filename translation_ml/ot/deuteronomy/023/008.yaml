id: DEU.23.8
reference: Deuteronomy 23:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹֽא תְתַעֵ֣ב אֲדֹמִ֔י כִּ֥י אָחִ֖י/ךָ ה֑וּא לֹא תְתַעֵ֣ב מִצְרִ֔י כִּי גֵ֖ר הָיִ֥יתָ בְ/אַרְצֽ/וֹ־ס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/008.yaml
  text: You shall not abhor an Edomite[a], for he is your brother. You shall not abhor an Egyptian[c][b], for you were a sojourner in his land.
translation:
  language: ml
  text: എദോമ്യനെ നീ അറപ്പുള്ളവനായി കരുതരുത്[a]; കാരണം അവൻ നിന്റെ സഹോദരനാണ്[b]. ഈജിപ്തുകാരനെ നീ അറപ്പുള്ളവനായി കരുതരുത്; കാരണം അവന്റെ ദേശത്ത് നീ പരദേശിയായി താമസിച്ചിരുന്നു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വെറുക്കരുത്” അല്ലെങ്കിൽ “നിന്ദ്യനായി കരുതരുത്.”
    reason: lexical_alternative
  - marker: b
    text: “നിന്റെ സഹോദരൻ” എന്നത് ഏശാവിലൂടെ ഇസ്രായേലിനും എദോമിനും ഉണ്ടായിരുന്ന കുടുംബബന്ധത്തെ സൂചിപ്പിക്കുന്നു.
    reason: cross_reference
  - marker: c
    text: അഥവാ, “കുടിയേറ്റക്കാരനായി” അല്ലെങ്കിൽ “താമസക്കാരനായ വിദേശിയായി.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְתַעֵב
  choice: അറപ്പോടെ കാണരുത്
  rationale: പീയേൽ രൂപം ഒരാളെ നിന്ദ്യനും വെറുപ്പുളവാക്കുന്നവനുമായി കണക്കാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ശക്തമായ വിരക്തിയുടെ ഭാവം നിലനിർത്തിക്കൊണ്ട് രണ്ട് സമാന്തര വിലക്കുകളിലും ഒരേ പ്രയോഗം ആവർത്തിച്ചു.
- source_word: אֲדֹמִי
  choice: എദോമ്യൻ
  rationale: എദോമിൽപ്പെട്ട ഒരാളെ സൂചിപ്പിക്കുന്ന ജാതിനാമത്തിന്റെ പ്രചാരത്തിലുള്ള മലയാളരൂപം; എബ്രായത്തിലെ പ്രതിനിധാന ഏകവചനം നിലനിർത്തുന്നു.
- source_word: אָחִיךָ
  choice: നിന്റെ സഹോദരൻ
  rationale: എദോമും ഇസ്രായേലും തമ്മിലുള്ള കുടുംബബന്ധം വ്യക്തമാക്കുന്ന മൂലപാഠത്തിലെ നേരിട്ടുള്ള ബന്ധപദം നിലനിർത്തുന്നു; ‘ബന്ധു’ എന്നു വ്യാഖ്യാനപരമായി മൃദൂകരിച്ചില്ല.
- source_word: מִצְרִי
  choice: ഈജിപ്തുകാരൻ
  rationale: ഈജിപ്തിൽപ്പെട്ട ഒരാളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള ജാതിനാമം; പ്രതിനിധാന ഏകവചനം നിലനിർത്തുന്നു.
- source_word: גֵר
  choice: പരദേശിയായി താമസിച്ചിരുന്നു
  rationale: സ്വദേശത്തിനും സ്വന്തം വംശസമൂഹത്തിനും പുറത്തു മറ്റൊരു ജനതയുടെ ഇടയിൽ പാർക്കുന്ന ഒരാളെന്ന സാമൂഹിക അർഥം വ്യക്തമാക്കുന്നു. ‘പരദേശി’ എന്ന നാമത്തിന്റെ അർഥം ‘താമസിച്ചിരുന്നു’ എന്ന ക്രിയയോടു ചേർത്ത് സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
- source_word: בְאַרְצוֹ
  choice: അവന്റെ ദേശത്ത്
  rationale: ഏകവചന പ്രത്യയം നിലനിർത്തുന്നു; ഇവിടെ ‘ഈജിപ്തുകാരൻ’ ഈജിപ്തിനെ പ്രതിനിധീകരിക്കുന്ന ഏകവചനമാണ്.
- source_word: כִּי
  choice: കാരണം
  rationale: രണ്ട് വിലക്കുകൾക്കും പിന്നാലെ അവയുടെ കാരണം അവതരിപ്പിക്കുന്ന വ്യക്തവും സ്വാഭാവികവുമായ ബന്ധപദം.
theological_decisions:
- issue: ജനസമൂഹങ്ങളെ സൂചിപ്പിക്കുന്ന പ്രതിനിധാന ഏകവചനം
  choice: ‘എദോമ്യനെ,’ ‘ഈജിപ്തുകാരനെ,’ ‘അവൻ,’ ‘അവന്റെ ദേശത്ത്’ എന്നീ ഏകവചനരൂപങ്ങൾ നിലനിർത്തി.
  alternative: മലയാളശൈലിക്കായി ‘എദോമ്യർ,’ ‘ഈജിപ്തുകാർ,’ ‘അവരുടെ ദേശം’ എന്ന് ബഹുവചനമാക്കുക.
  rationale: എബ്രായ നിയമഭാഷ ഒരു ജനവിഭാഗത്തിലെ അംഗത്തെ പ്രതിനിധാന ഏകവചനത്തിൽ അഭിസംബോധന ചെയ്യുന്നു. ഏകവചനം മൂലരൂപത്തെയും കല്പനയുടെ വ്യക്തിപരമായ ഊന്നലിനെയും സംരക്ഷിക്കുന്നു.
- issue: എദോമുമായുള്ള ബന്ധത്തിന് ഉപയോഗിച്ച കുടുംബപദം
  choice: ‘നിന്റെ സഹോദരൻ’ എന്ന് അക്ഷരാർഥത്തിൽ നൽകി.
  alternative: ‘നിന്റെ ബന്ധു’ എന്ന് വ്യാഖ്യാനിച്ച് നൽകുക.
  rationale: ഇസ്രായേലും എദോമും തമ്മിലുള്ള കുടുംബബന്ധമാണ് വിലക്കിന്റെ അടിസ്ഥാനമായി പാഠം ചൂണ്ടിക്കാണിക്കുന്നത്. ‘സഹോദരൻ’ എന്ന പദം ആ ചരിത്ര-ദൈവശാസ്ത്രബന്ധം വ്യാഖ്യാനിച്ച് മൃദൂകരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമോപദേശ ശൈലി. മൂലപാഠത്തിലെ സമാന്തര ആവർത്തനവും പ്രതിനിധാന ഏകവചനവും നിലനിർത്തി; ‘ഗേർ’ എന്ന പദത്തിന്റെ സാമൂഹിക അർഥം സ്വാഭാവികമായ ക്രിയാപ്രയോഗത്തിലൂടെ വ്യക്തമാക്കി.
