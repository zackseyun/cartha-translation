  source_fidelity: 'മുഖ്യപാഠം എബ്രായത്തിലെ ക്രമവും ആശയവും വിശ്വസ്തമായി നൽകുന്നു: יָתֵד-ന്റെ ‘കുറ്റി,’ ദുർഗ്രഹമായ עַל אֲזֵנֶךָ-യുടെ സന്ദർഭാനുസൃതമായ ‘ഉപകരണങ്ങളുടെ കൂട്ടത്തിൽ,’ വെളിയിൽ ഇരിക്കുന്നതെന്ന മിതഭാഷണം, അതുകൊണ്ട് കുഴിക്കൽ, തിരിയൽ, വിസർജ്യം മൂടൽ എന്നിവ സംരക്ഷിക്കപ്പെട്ടിരിക്കുന്നു. ‘കുഴി’ എന്ന വ്യക്തമല്ലാത്ത കർമപദം ചേർത്തിട്ടില്ല.'
