translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ നിയമശൈലി സ്വീകരിച്ചു. മൂലത്തിലെ മിതഭാഷണം സംരക്ഷിച്ചു; ‘കുറ്റി’ എന്ന വസ്തുചിത്രവും עַל אֲזֵנֶךָ എന്ന ദുർഗ്രഹപ്രയോഗത്തിന്റെ അനിശ്ചിതത്വവും അടിക്കുറിപ്പുകളിൽ രേഖപ്പെടുത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദപ്രയോഗങ്ങൾക്ക് പിന്നാലെ മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
