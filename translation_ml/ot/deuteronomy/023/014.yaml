  yaml_path: translation/ot/deuteronomy/023/014.yaml
  text: And you shall have a peg among your equipment[a], and when you sit down outside[c][b], you shall dig with it and turn back and cover your excrement.
translation:
  language: ml
  text: നിന്റെ ഉപകരണങ്ങളുടെ കൂട്ടത്തിൽ ഒരു കുറ്റി[a][b] ഉണ്ടായിരിക്കണം. നീ വെളിയിൽ ഇരിക്കുമ്പോൾ[c] അതുകൊണ്ട് കുഴിച്ച്, പിന്നെ തിരിഞ്ഞ് നിന്റെ വിസർജ്യം മൂടണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘ആപ്പ്’; ചിലർ സന്ദർഭത്തിലെ ഉപയോഗത്തെ മുൻനിർത്തി ‘കുഴിക്കാനുള്ള ഉപകരണം’ അഥവാ ‘ചെറിയ മൺവെട്ടി’ എന്നു മനസ്സിലാക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം ‘നിന്റെ ചെവിമേൽ.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപ്രയോഗം ഒരാളുടെ സാമഗ്രികളെയോ ഉപകരണങ്ങളെയോ സൂചിപ്പിക്കുന്നതായി തോന്നുന്നു.
    reason: lexical_alternative
  - marker: c
    text: എബ്രായത്തിൽ ‘നീ വെളിയിൽ ഇരിക്കുമ്പോൾ’ എന്നാണ്; മലവിസർജനത്തിനായി പോകുന്നതിനെ സൂചിപ്പിക്കുന്ന മിതഭാഷണമാണിത്.
    reason: cultural_note
lexical_decisions:
- source_word: יָתֵד
  choice: കുറ്റി
  rationale: ഈ നാമം സാധാരണയായി കൂടാരക്കുറ്റി പോലുള്ള കുറ്റിയെയോ ആപ്പിനെയോ സൂചിപ്പിക്കുന്നു. ഇവിടെ കുഴിക്കാനുപയോഗിക്കുന്ന ഉപകരണമായതിനാൽ ‘കുറ്റി’ എന്ന മൂലചിത്രം നിലനിർത്തുകയും അതിന്റെ പ്രവർത്തനം തുടർന്നുള്ള വാക്യം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: עַל אֲזֵנֶךָ
  choice: നിന്റെ ഉപകരണങ്ങളുടെ കൂട്ടത്തിൽ
  rationale: അക്ഷരാർഥം ‘നിന്റെ ചെവിമേൽ’ എന്നാണ്; എന്നാൽ ഈ സൈനികപ്പാളയസന്ദർഭത്തിൽ അത് ഒരാളുടെ സാമഗ്രികളെയോ ഉപകരണങ്ങളെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗമായി മനസ്സിലാക്കുന്നതാണ് യുക്തം. മലയാളത്തിൽ അർഥശൂന്യമായ അക്ഷരവിവർത്തനം ഒഴിവാക്കി സന്ദർഭാർഥം നൽകി.
- source_word: בְּשִׁבְתְּךָ חוּץ
  choice: നീ വെളിയിൽ ഇരിക്കുമ്പോൾ
  rationale: ‘നീ വെളിയിൽ ഇരിക്കുമ്പോൾ’ എന്ന എബ്രായ മിതഭാഷണം അതേ മിതത്വത്തോടെ നിലനിർത്തുന്നു; മലവിസർജനത്തിനായി പുറത്തുപോകുന്നതാണ് സന്ദർഭത്തിൽ ഉദ്ദേശ്യം.
- source_word: וְחָפַרְתָּה בָהּ
  choice: അതുകൊണ്ട് കുഴിച്ച്
  rationale: സ്ത്രീലിംഗ സർവനാമം മുൻപുള്ള יָתֵד എന്ന കുറ്റിയെ സൂചിപ്പിക്കുന്നു. എബ്രായത്തിൽ ‘കുഴി’ എന്ന കർമപദം വ്യക്തമാക്കിയിട്ടില്ലാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല.
- source_word: וְשַׁבְתָּ
  choice: പിന്നെ തിരിഞ്ഞ്
  rationale: കുഴിച്ചതിനുശേഷം തിരിഞ്ഞ് വിസർജ്യം മൂടുന്ന പ്രവർത്തനക്രമം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ക്രിയയുടെ ‘മടങ്ങുക/തിരിയുക’ എന്ന അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു.
- source_word: צֵאָתֶךָ
  choice: നിന്റെ വിസർജ്യം
  rationale: മനുഷ്യവിസർജ്യത്തെ കൃത്യമായും മാന്യമായും സൂചിപ്പിക്കുന്ന, ആധുനിക മലയാളത്തിൽ മനസ്സിലാകുന്ന നിയമശൈലിയിലുള്ള പദം.
