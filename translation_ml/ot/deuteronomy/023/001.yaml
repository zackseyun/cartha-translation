source:
  edition: WLC
  text: לֹא יִקַּ֥ח אִ֖ישׁ אֶת אֵ֣שֶׁת אָבִ֑י/ו וְ/לֹ֥א יְגַלֶּ֖ה כְּנַ֥ף אָבִֽי/ו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/001.yaml
  text: A man shall not take his father’s wife[b][a], nor uncover his father’s skirt.
translation:
  language: ml
  text: ഒരു പുരുഷൻ തന്റെ അപ്പന്റെ ഭാര്യയെ വിവാഹം കഴിക്കരുത്[a]; തന്റെ അപ്പന്റെ വസ്ത്രത്തിന്റെ അറ്റം അനാവൃതമാക്കുകയും അരുത്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘തന്റെ അപ്പന്റെ ഭാര്യയെ സ്വീകരിക്കരുത്.’
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘തന്റെ അപ്പന്റെ വസ്ത്രത്തിന്റെ അറ്റം അനാവൃതമാക്കരുത്.’ ഇത് ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന ഒരു സൗമ്യോക്തിയാണ്; ‘തന്റെ അപ്പന്റെ നഗ്നത അനാവൃതമാക്കുക’ അല്ലെങ്കിൽ ‘തന്റെ അപ്പന്റെ വിവാഹശയ്യയെ ലംഘിക്കുക’ എന്നും ഇതിനെ മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: יִקַּח
  choice: സ്വീകരിക്കരുത്
  rationale: לָקַח എന്ന ക്രിയ ‘ഭാര്യ’യോടൊപ്പം വരുമ്പോൾ വിവാഹം കഴിക്കുക എന്ന അർഥം സൂചിപ്പിക്കാം. ‘സ്വീകരിക്കുക’ എന്നത് എബ്രായപ്രയോഗത്തിന്റെ വിശാലത നിലനിർത്തുന്നു; കൂടുതൽ വ്യക്തമായ ‘വിവാഹം കഴിക്കുക’ എന്ന വായന അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: אִישׁ
  choice: ഒരു പുരുഷൻ
  rationale: ഏകവചന പുല്ലിംഗനാമത്തിന്റെ വ്യക്തമായ നിയമപരമായ നിർദ്ദേശം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֵשֶׁת אָבִיו
  choice: തന്റെ അപ്പന്റെ ഭാര്യ
  rationale: ‘തന്റെ അപ്പന്റെ ഭാര്യ’ എന്ന ബന്ധവാചകം നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു. ‘രണ്ടാനമ്മ’ എന്നു പറഞ്ഞാൽ മൂലപാഠത്തേക്കാൾ അർഥം ചുരുങ്ങാൻ സാധ്യതയുണ്ട്.
- source_word: יְגַלֶּה
  choice: നീക്കി തുറക്കുക
  rationale: גלה എന്ന ക്രിയയുടെ ‘തുറക്കുക/അനാവൃതമാക്കുക’ എന്ന ആശയം ഇവിടെ വസ്ത്രത്തിന്റെ അറ്റത്തോടു ചേർത്ത് മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന വിധം പ്രകടിപ്പിക്കുന്നു.
- source_word: כְּנַף
  choice: വസ്ത്രത്തിന്റെ അറ്റം
  rationale: כָּנָף എന്നതിന് ‘ചിറക്, അരിക്, വസ്ത്രത്തിന്റെ അറ്റം’ എന്നീ അർഥങ്ങളുണ്ട്. ഇവിടെ ലൈംഗിക-വൈവാഹിക മേഖലയെ സൂചിപ്പിക്കുന്ന രൂപകപ്രയോഗം നിലനിർത്തുന്നതിനായി ‘വസ്ത്രത്തിന്റെ അറ്റം’ എന്നു പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: ലൈംഗിക ആശയം സൂചിപ്പിക്കുന്ന സൗമ്യോക്തി മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കണമോ
  choice: ‘തന്റെ അപ്പന്റെ വസ്ത്രത്തിന്റെ അറ്റം നീക്കി തുറക്കുക’ എന്ന രൂപകം മുഖ്യപാഠത്തിൽ നിലനിർത്തുക
  alternative: തന്റെ അപ്പന്റെ നഗ്നത അനാവൃതമാക്കുക / തന്റെ അപ്പന്റെ വിവാഹബന്ധം ലംഘിക്കുക
  rationale: എബ്രായപാഠം സാധാരണയായ ‘നഗ്നത അനാവൃതമാക്കുക’ എന്ന പ്രയോഗത്തിനു പകരം വസ്ത്രത്തിന്റെ അറ്റത്തെക്കുറിച്ചുള്ള സൗമ്യോക്തിയാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ ലൈംഗികവും വൈവാഹികവുമായ സൂചന വിശദീകരിച്ചുകൊണ്ട് രൂപകം മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ‘അപ്പൻ’ എന്നത് സാധാരണ വായനക്കാർക്ക് എളുപ്പമുള്ളതും മൂലത്തിലെ കുടുംബബന്ധം നേരിട്ട് വ്യക്തമാക്കുന്നതുമാണ്. അപരിചിതമായ ‘വസ്ത്രാഞ്ചലം’ ഒഴിവാക്കി ‘വസ്ത്രത്തിന്റെ അറ്റം’ ഉപയോഗിച്ചു; മൂലപാഠത്തിലെ സൗമ്യോക്തിയുടെ അവ്യക്തത അടിക്കുറിപ്പിലൂടെ വിശദീകരിച്ചു.
