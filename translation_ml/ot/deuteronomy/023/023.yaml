source:
  edition: WLC
  text: וְ/כִ֥י תֶחְדַּ֖ל לִ/נְדֹּ֑ר לֹֽא יִהְיֶ֥ה בְ/ךָ֖ חֵֽטְא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/023.yaml
  text: But if you refrain from making a vow[a], there will be no sin in you.
translation:
  language: ml
  text: എന്നാൽ, നീ നേർച്ച നേരാതിരിക്കുകയാണെങ്കിൽ നിനക്കു പാപമുണ്ടാകുകയില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിനക്കു കുറ്റം ഉണ്ടായിരിക്കുകയില്ല’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִי
  choice: എന്നാൽ … -ാതിരുന്നാൽ
  rationale: മുൻവാക്യത്തിലെ നേർച്ച നിറവേറ്റേണ്ട ബാധ്യതയോട് വൈരുധ്യം സൂചിപ്പിക്കുന്ന നിബന്ധനയാണ് ഇവിടെ; അതിനാൽ ‘എന്നാൽ … -ാതിരുന്നാൽ’ സ്വാഭാവികമായി അർഥം നൽകുന്നു.
- source_word: תֶחְדַּל
  choice: നേരാതിരുന്നാൽ
  rationale: חדל എന്നത് ‘ഒഴിഞ്ഞുനിൽക്കുക/ചെയ്യാതിരിക്കുക’ എന്ന അർഥത്തിലാണ്. ഇവിടെ ആരംഭിച്ച പ്രവൃത്തി നിർത്തുന്നതല്ല, നേർച്ച ചെയ്യാതിരിക്കുന്നതാണ് ഉദ്ദേശ്യം.
- source_word: לִ/נְדֹּר
  choice: നേർച്ച നേരുക
  rationale: נדר എന്ന ക്രിയയുടെ അർഥം നേർച്ച ചെയ്യുക എന്നതാണ്; ‘നേർച്ച നേരുക’ മലയാളത്തിലെ സ്വാഭാവികവും വ്യക്തവുമായ പ്രയോഗമാണ്.
- source_word: לֹא יִהְיֶה
  choice: ഉണ്ടാകുകയില്ല
  rationale: നിഷേധത്തോടുകൂടിയ היה ഇവിടെ അസ്തിത്വം നിഷേധിക്കുന്ന ഫലസൂചക പ്രയോഗമാണ്; ‘ഉണ്ടാകുകയില്ല’ അതിനെ നേരായി നിലനിർത്തുന്നു.
- source_word: בְ/ךָ
  choice: നിനക്കു
  rationale: അക്ഷരാർഥത്തിൽ ‘നിന്നിൽ’ എന്നായാലും, പാപമോ കുറ്റമോ ഒരാൾക്കു ചുമത്തപ്പെടാതിരിക്കുന്നതിനെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘നിനക്കു … ഉണ്ടാകുകയില്ല’ എന്നു പറയുന്നു.
- source_word: חֵטְא
  choice: പാപം
  rationale: חֵטְא പാപത്തെയും അതിൽനിന്നുള്ള കുറ്റബാധ്യതയെയും സൂചിപ്പിക്കാം. സന്ദർഭത്തിലെ ധാർമിക-നിയമപരമായ വൈരുധ്യം വ്യക്തമാക്കാൻ മുഖ്യപാഠത്തിൽ ‘പാപം’ സ്വീകരിച്ചു; ‘കുറ്റം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
theological_decisions:
- issue: നേർച്ച നേരാതിരിക്കുന്നതിന്റെ ധാർമിക നില
  choice: നേർച്ച നേരാതിരിക്കുന്നത് തന്നിൽ പാപമല്ല എന്നാണ് വാക്യം പറയുന്നത്.
  alternative: ധാർമിക പാപത്തെക്കാൾ നിയമപരമായ കുറ്റബാധ്യത ഇല്ലെന്നതിനാണ് ഊന്നൽ.
  rationale: חֵטְא എന്ന പദത്തിന് ‘പാപം’, ‘കുറ്റം/കുറ്റബാധ്യത’ എന്നീ പരസ്പരം മുട്ടുന്ന അർഥവ്യാപ്തികളുണ്ട്. മുഖ്യപാഠം ‘പാപം’ എന്നു നൽകുകയും കുറ്റബാധ്യതയുടെ സൂക്ഷ്മത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘നേർച്ച നേരുക’ എന്ന പൊതുവായി ഗ്രഹിക്കാവുന്ന ബൈബിൾ-മലയാള പ്രയോഗം നിലനിർത്തി; ഹീബ്രുവിലെ നിബന്ധനയും പാപം/കുറ്റബാധ്യത എന്ന അർഥവ്യാപ്തിയും സംരക്ഷിച്ചു.
