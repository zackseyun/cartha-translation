  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹא תַשִּׁ֣יךְ לְ/אָחִ֔י/ךָ נֶ֥שֶׁךְ כֶּ֖סֶף נֶ֣שֶׁךְ אֹ֑כֶל נֶ֕שֶׁךְ כָּל דָּבָ֖ר אֲשֶׁ֥ר יִשָּֽׁךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/020.yaml
  text: You shall not charge your brother interest on money[a], interest on food[c][b], or interest on anything that is lent at interest.
translation:
  language: ml
  text: നിന്റെ സഹോദരനിൽനിന്ന്[a] പണത്തിനോ[c] ഭക്ഷണത്തിനോ, പലിശയ്ക്ക് കൊടുക്കുന്ന മറ്റേതെങ്കിലും വസ്തുവിനോ പലിശ[b] ഈടാക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിന്റെ സഹഇസ്രായേല്യൻ’ അല്ലെങ്കിൽ ‘നിന്റെ സ്വന്തജനത്തിൽപ്പെട്ടവൻ’ എന്നും അർഥമാകാം; അക്ഷരാർഥം ‘നിന്റെ സഹോദരൻ.’
    reason: lexical_alternative
  - marker: b
    text: ഇവിടത്തെ എബ്രായപദം അമിതപലിശയെ മാത്രം അല്ല, വായ്പയ്ക്കു ചുമത്തുന്ന പലിശയെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: എബ്രായപദത്തിന്റെ അക്ഷരാർഥം ‘വെള്ളി’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַשִּׁיךְ
  choice: പലിശ ഈടാക്കരുത്
  rationale: ഹിഫീൽ രൂപം വായ്പ കൊടുക്കുന്നതിനെക്കാൾ, വായ്പക്കാരനിൽനിന്ന് പലിശ ചുമത്തുകയോ വാങ്ങുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. നിയമനിർദേശത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം ‘പലിശ ഈടാക്കുക’ എന്നാണ്.
- source_word: לְאָחִיךָ
  choice: നിന്റെ സഹോദരനിൽനിന്ന്
  rationale: എബ്രായപദത്തിന്റെ അക്ഷരാർഥമായ ‘നിന്റെ സഹോദരൻ’ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് ഉടമ്പടിസമൂഹത്തിലെ സഹഇസ്രായേല്യനെ കുടുംബബന്ധത്തിന്റെ ഭാഷയിൽ സൂചിപ്പിക്കുന്നു.
- source_word: נֶשֶׁךְ
  choice: പലിശ
  rationale: പദം വായ്പയ്ക്കു ചുമത്തുന്ന പലിശയെ പൊതുവായി സൂചിപ്പിക്കുന്നു; അമിതപലിശ എന്ന പരിമിത അർഥം ചേർക്കുന്നില്ല.
- source_word: כֶּסֶף
  choice: പണം
  rationale: അക്ഷരാർഥം ‘വെള്ളി’ ആണെങ്കിലും നിയമ-സാമ്പത്തിക സന്ദർഭത്തിൽ ഇത് പണത്തെ സൂചിപ്പിക്കുന്നു; ആ ഉദ്ദേശ്യം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: אֹכֶל
  choice: ഭക്ഷണം
  rationale: ഭക്ഷ്യവസ്തുക്കളെ പൊതുവായി സൂചിപ്പിക്കുന്ന ലളിതവും സ്വാഭാവികവുമായ മലയാളപദം.
- source_word: כָּל דָּבָר
  choice: മറ്റേതെങ്കിലും വസ്തു
  rationale: പണവും ഭക്ഷണവും കടന്നുള്ള സമഗ്ര വ്യാപ്തി പ്രകടമാക്കുന്നു.
- source_word: אֲשֶׁר יִשָּׁךְ
  choice: പലിശ ഈടാക്കാവുന്ന ഒന്നിന്മേലും
  rationale: ബന്ധവാക്യത്തിലെ പദപ്രയോഗം പലിശയ്ക്ക് വിധേയമാക്കപ്പെടുന്ന ഏതൊന്നിനെയും ഉൾക്കൊള്ളുന്നു. എബ്രായത്തിലെ ആവർത്തനം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന രൂപം തിരഞ്ഞെടുത്തു.
theological_decisions:
- issue: ‘സഹോദരൻ’ എന്നതിന്റെ ഉടമ്പടിസമൂഹപരമായ വ്യാപ്തി
  choice: മുഖ്യപാഠത്തിൽ ‘നിന്റെ സഹോദരൻ’ നിലനിർത്തി
  alternative: ‘നിന്റെ സഹഇസ്രായേല്യൻ’ അല്ലെങ്കിൽ ‘നിന്റെ സ്വന്തജനത്തിൽപ്പെട്ടവൻ’
  rationale: മൂലപാഠത്തിലെ കുടുംബബന്ധരൂപകവും അതിന്റെ ഉടമ്പടിപരമായ ഊന്നലും സംരക്ഷിക്കുന്നു; കൂടുതൽ വ്യാഖ്യാനാത്മകമായ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമനിർദേശശൈലി. മൂലത്തിലെ ‘പലിശ’ എന്ന ആവർത്തനം ഭാഗികമായി നിലനിർത്തി; ‘നിന്റെ സഹോദരൻ’ എന്ന കുടുംബ-ഉടമ്പടി ഭാഷയും സംരക്ഷിച്ചു.
