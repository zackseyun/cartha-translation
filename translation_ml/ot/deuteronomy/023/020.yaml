revisions:
- from: നിന്റെ സഹോദരനിൽനിന്ന് പണത്തിന്മേലോ[a] ഭക്ഷണത്തിന്മേലോ മറ്റേതെങ്കിലും വസ്തുവിന്മേലോ പലിശ ഈടാക്കരുത്—പലിശ ഈടാക്കാവുന്ന ഒന്നിന്മേലും പലിശ ഈടാക്കരുത്.[b]
  to: നിന്റെ സഹോദരനിൽനിന്ന്[a] പണത്തിനോ[c] ഭക്ഷണത്തിനോ, പലിശയ്ക്ക് കൊടുക്കുന്ന മറ്റേതെങ്കിലും വസ്തുവിനോ പലിശ[b] ഈടാക്കരുത്.
  rationale: The revision preserves the Hebrew legal prohibition and its threefold scope, while rendering the final relative clause as ‘പലിശയ്ക്ക് കൊടുക്കുന്ന’ rather than as a statement of what may bear interest. It also corrects the note anchors and separates the distinct lexical notes for ‘brother,’ ‘interest,’ and ‘money/silver.’
