id: DEU.23.16
reference: Deuteronomy 23:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹא תַסְגִּ֥יר עֶ֖בֶד אֶל אֲדֹנָ֑י/ו אֲשֶׁר יִנָּצֵ֥ל אֵלֶ֖י/ךָ מֵ/עִ֥ם אֲדֹנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/016.yaml
  text: You shall not hand over to his master a servant who has escaped from his master to you[a].
translation:
  language: ml
  text: തന്റെ യജമാനന്റെ അടുക്കൽനിന്ന് രക്ഷപ്പെട്ട് നിന്റെ അടുക്കൽ വന്ന അടിമയെ[a] അവന്റെ യജമാനന് ഏല്പിച്ചുകൊടുക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ദാസനെ.’ എബ്രായപദത്തിന് ദാസൻ, സേവകൻ, അടിമ എന്നീ അർഥങ്ങൾ വരാം; ഇവിടെ ആ വ്യക്തി ഒരു യജമാനന്റെ അധീനതയിൽനിന്ന് രക്ഷപ്പെട്ടതാണു നിയമത്തിന്റെ കേന്ദ്രവിഷയം എന്നതിനാൽ ‘അടിമ’ എന്നു പരിഭാഷപ്പെടുത്തി.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַסְגִּיר
  choice: ഏല്പിച്ചുകൊടുക്കരുത്
  rationale: ഹിഫീൽ രൂപം ഒരാളെ മറ്റൊരാളുടെ അധികാരത്തിലേക്ക് കൈമാറുക എന്ന നിയമപരമായ അർഥം നൽകുന്നു. ‘ഏല്പിച്ചുകൊടുക്കുക’ ആ ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עֶבֶד
  choice: അടിമ
  rationale: ഈ നിയമത്തിൽ ഒരാൾ യജമാനന്റെ അധീനതയിൽനിന്ന് രക്ഷപ്പെടുന്നതാണ് പ്രധാനം; അതിനാൽ ബന്ധിതമായ സാമൂഹികനില വ്യക്തമാക്കുന്ന ‘അടിമ’ യോജിക്കുന്നു. ‘ദാസൻ’ എന്നതും സാധ്യമാണ്.
- source_word: אֶל אֲדֹנָיו
  choice: അവന്റെ യജമാനന്
  rationale: ഈ സാമൂഹിക-നിയമപരമായ സന്ദർഭത്തിൽ אָדוֹן ദൈവിക പദവിയെയല്ല, അടിമയുടെ യജമാനനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אֲשֶׁר יִנָּצֵל
  choice: രക്ഷപ്പെട്ട് … വന്ന
  rationale: נצל എന്ന നിഫാൽ രൂപത്തിന് ‘രക്ഷിക്കപ്പെടുക’ എന്നും ‘രക്ഷപ്പെടുക’ എന്നും അർഥമാകാം. യജമാനന്റെ അടുക്കൽനിന്നുള്ള പലായനത്തിന്റെ ഈ സന്ദർഭത്തിൽ ‘രക്ഷപ്പെട്ട്’ സ്വാഭാവികമാണ്; ബന്ധവാക്യം മലയാളത്തിൽ പങ്കുപദഘടനയായി നൽകിയിരിക്കുന്നു.
- source_word: אֵלֶיךָ
  choice: നിന്റെ അടുക്കൽ വന്ന
  rationale: אֶל സൂചിപ്പിക്കുന്ന അഭിമുഖചലനം ‘അടുക്കൽ വന്ന’ എന്ന പ്രയോഗം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: מֵעִם אֲדֹנָיו
  choice: തന്റെ യജമാനന്റെ അടുക്കൽനിന്ന്
  rationale: מֵעִם യജമാനനോടൊപ്പമുള്ള അവസ്ഥയിൽനിന്നുള്ള വേർപാടിനെ സൂചിപ്പിക്കുന്നു; ഈ മലയാളപ്രയോഗം അതിനെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: עֶבֶד എന്ന സാമൂഹികനിലപ്പദം
  choice: അടിമ
  alternative: ദാസൻ / സേവകൻ
  rationale: വാക്യം യജമാനന്റെ അധികാരത്തിൽനിന്ന് രക്ഷപ്പെട്ട ഒരാളെ തിരികെ ഏല്പിക്കാതിരിക്കുന്നതിനെക്കുറിച്ചാണ്. അധീനതയുടെ സ്വഭാവം കേന്ദ്രമായതിനാൽ മൃദുവായ ‘സേവകൻ’ എന്നതിനെക്കാൾ ‘അടിമ’ മൂലപദത്തിന്റെ സാമൂഹിക യാഥാർഥ്യം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- issue: יִנָּצֵל എന്ന നിഫാൽ രൂപത്തിലെ അർഥവ്യാപ്തി
  choice: രക്ഷപ്പെട്ട്
  alternative: രക്ഷിക്കപ്പെട്ട്
  rationale: രൂപം രക്ഷിക്കപ്പെടൽ എന്ന ആശയത്തിനും ഇട നൽകുന്നുവെങ്കിലും, ‘യജമാനന്റെ അടുക്കൽനിന്ന്’ എന്നും ‘നിന്റെ അടുക്കൽ’ എന്നും വരുന്ന ദിശാസൂചനകൾ സ്വയം രക്ഷപ്പെട്ടു വന്ന സാഹചര്യം ശക്തമായി സൂചിപ്പിക്കുന്നു. വാചകത്തിൽ അധികമായി ‘ഓടിപ്പോയി’ എന്ന ആശയം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമനിർദേശശൈലി ഉപയോഗിച്ചു. ഏകവചനത്തിലുള്ള അഭിസംബോധനയായ אֵלֶיךָ ‘നിന്റെ അടുക്കൽ’ എന്നു നിലനിർത്തി. ആവർത്തിക്കുന്ന ‘യജമാനൻ’ എന്ന പദം മൂലവാക്യത്തിലെ ആവർത്തനത്തിന് അനുസൃതമായി സംരക്ഷിച്ചു.
