source:
  edition: WLC
  text: לֹא תִהְיֶ֥ה קְדֵשָׁ֖ה מִ/בְּנ֣וֹת יִשְׂרָאֵ֑ל וְ/לֹֽא יִהְיֶ֥ה קָדֵ֖שׁ מִ/בְּנֵ֥י יִשְׂרָאֵל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/018.yaml
  text: There shall not be a cult prostitute from the daughters of Israel[a], and there shall not be a cult prostitute from the sons of Israel.
translation:
  language: ml
  text: ഇസ്രായേലിന്റെ പുത്രിമാരിൽ ആരും ആരാധനാചാരവുമായി ബന്ധപ്പെട്ട വേശ്യയായിരിക്കരുത്[a]; ഇസ്രായേലിന്റെ പുത്രന്മാരിൽ ആരും ആരാധനാചാരവുമായി ബന്ധപ്പെട്ട പുരുഷവേശ്യയായിരിക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ക്ഷേത്രവേശ്യ.’ എബ്രായ പദങ്ങൾക്ക് അക്ഷരാർഥത്തിൽ ‘പ്രതിഷ്ഠിതയായ സ്ത്രീ/പ്രതിഷ്ഠിതനായ പുരുഷൻ’ എന്ന ധ്വനിയുണ്ടെങ്കിലും, ഇവിടെ അവ അന്യദേവാരാധനയുമായി ബന്ധപ്പെട്ടിരുന്ന അവിഹിത ലൈംഗിക ആചാരത്തിലെ സ്ത്രീയെയും പുരുഷനെയും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְדֵשָׁה
  choice: ആരാധനാചാര വേശ്യ
  rationale: പദം ഇവിടെ പൊതുവായ ലൈംഗിക അധാർമികതയെയോ വിശുദ്ധമായ പ്രതിഷ്ഠയെയോ അല്ല, അന്യദേവാരാധനയുമായി ബന്ധപ്പെട്ടിരുന്ന അവിഹിത ലൈംഗിക ആചാരത്തിലെ സ്ത്രീയെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക പ്രയോഗമാണ്. ‘ആരാധനാചാര’ എന്ന വിശേഷണം അതിന്റെ മതാചാരപരമായ മാനം വ്യക്തമാക്കുന്നു; ‘ക്ഷേത്രവേശ്യ’ എന്നത് സ്ഥലം അനാവശ്യമായി പരിമിതപ്പെടുത്താം.
- source_word: קָדֵשׁ
  choice: ആരാധനാചാര പുരുഷവേശ്യ
  rationale: സ്ത്രീലിംഗപദത്തിന്റെ പുല്ലിംഗ സമാന്തരമാണിത്. മലയാളത്തിൽ വ്യക്തിയുടെ പുരുഷലിംഗം സംശയരഹിതമായി വ്യക്തമാക്കാൻ ‘പുരുഷവേശ്യ’ എന്നു ചേർത്തു; ‘ആരാധനാചാര’ എന്ന ഒരേ വിശേഷണം എബ്രായത്തിലെ സമാന്തരത നിലനിർത്തുന്നു.
- source_word: לֹא תִהְיֶה / וְלֹא יִהְיֶה
  choice: ആരും ... ആയിരിക്കരുത്
  rationale: നിയമപരമായ വിലക്ക് സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു. എബ്രായത്തിലെ അസ്തിത്വക്രിയയുടെ രൂപം വാക്കിന് വാക്കായി പകർത്തുന്നതിനുപകരം നിരോധനത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: מִבְּנוֹת יִשְׂרָאֵל / מִבְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ പുത്രിമാരിൽ / ഇസ്രായേലിന്റെ പുത്രന്മാരിൽ
  rationale: മലയാളത്തിൽ സ്വാഭാവികമായ വിഭക്തിപ്രയോഗത്തിലൂടെ സമൂഹത്തിനുള്ളിൽ അത്തരമൊരു വ്യക്തി ഉണ്ടാകരുതെന്ന അർഥം നൽകുന്നു; അതേസമയം എബ്രായത്തിലെ പുത്രിമാർ/പുത്രന്മാർ എന്ന ലിംഗസൂചക സമാന്തരത സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: קדשׁ/קדשׁה എന്ന പദങ്ങളുടെ അർഥം
  choice: അന്യദേവാരാധനയോടു ബന്ധപ്പെട്ട ലൈംഗിക ആചാരത്തിൽ ഏർപ്പെട്ട സ്ത്രീയെയും പുരുഷനെയും സൂചിപ്പിക്കുന്നതായി വിവർത്തനം ചെയ്തു.
  alternative: പൊതുവായി ലൈംഗിക അധാർമികതയുള്ള വ്യക്തികൾ എന്നോ നിഷ്പക്ഷ അർഥത്തിൽ ‘പ്രതിഷ്ഠിക്കപ്പെട്ട സ്ത്രീ/പുരുഷൻ’ എന്നോ വിവർത്തനം ചെയ്യുക.
  rationale: ഈ നിയമസന്ദർഭത്തിൽ പദങ്ങൾ മതാചാരപരമായ അവിഹിത ലൈംഗിക പങ്കിനെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക പദങ്ങളാണ്. ‘ആരാധനാചാര’ എന്നു ചേർക്കുന്നത് നിയമത്തിന്റെ പ്രത്യേക ലക്ഷ്യം മറച്ചുവയ്ക്കാതെയും ആ ആചാരത്തിന് സാധുത നൽകാതെയും അർഥം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമശൈലി സ്വീകരിച്ചു. ‘പുത്രിമാർ/പുത്രന്മാർ’ എന്ന ദേശീയ-കുടുംബപരമായ സമാന്തരപ്രയോഗം നിലനിർത്തി; പുരുഷലിംഗം വ്യക്തമായി കാണിക്കാൻ രണ്ടാം ഘടകത്തിൽ ‘പുരുഷവേശ്യ’ ഉപയോഗിച്ചു.
