id: DEU.23.11
reference: Deuteronomy 23:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּֽי יִהְיֶ֤ה בְ/ךָ֙ אִ֔ישׁ אֲשֶׁ֛ר לֹא יִהְיֶ֥ה טָה֖וֹר מִ/קְּרֵה לָ֑יְלָה וְ/יָצָא֙ אֶל מִ/ח֣וּץ לַֽ/מַּחֲנֶ֔ה לֹ֥א יָבֹ֖א אֶל תּ֥וֹךְ הַֽ/מַּחֲנֶֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/011.yaml
  text: If there is among you a man who is not clean because of a nocturnal emission[a], he shall go outside the camp; he shall not come into the midst of the camp.
translation:
  language: ml
  text: നിങ്ങളുടെ ഇടയിൽ ഒരാൾ രാത്രിയിലെ സ്രാവം[a] നിമിത്തം ശുദ്ധനല്ലാതായാൽ, അവൻ പാളയത്തിനു പുറത്തേക്കു പോകണം; പാളയത്തിന്റെ അകത്തേക്കു വരരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘രാത്രിയിലെ ഒരു സംഭവം’; രാത്രിയിലുണ്ടാകുന്ന ശുക്ലസ്രാവത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രായ പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ആയാൽ
  rationale: നിയമപരമായ സോപാധിക സന്ദർഭം അവതരിപ്പിക്കുന്നതിനാൽ, കാലസൂചനയെക്കാൾ വ്യവസ്ഥ വ്യക്തമാക്കുന്ന ‘ആയാൽ’ സ്വാഭാവികമാണ്.
- source_word: יִהְיֶה בְךָ אִישׁ
  choice: നിങ്ങളുടെ ഇടയിൽ ഒരാൾ
  rationale: היה എന്ന ക്രിയയുടെ അസ്തിത്വാർഥവും בְךָയുടെ സമൂഹത്തിനുള്ളിലെ സ്ഥിതിയും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു; തുടർന്നുള്ള പ്രത്യേക ശാരീരികാവസ്ഥ പുരുഷനെ സൂചിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר לֹא יִהְיֶה טָהוֹר
  choice: ശുദ്ധനല്ലാതായാൽ
  rationale: ആചാരപരമായ ശുദ്ധിയുടെ അവസ്ഥയെയാണ് സൂചിപ്പിക്കുന്നത്; ധാർമിക കുറ്റം ആരോപിക്കുന്ന ഭാഷ ഒഴിവാക്കുന്നു.
- source_word: מִקְּרֵה לָיְלָה
  choice: രാത്രിയിലെ സ്രാവം
  rationale: അക്ഷരാർഥത്തിൽ ‘രാത്രിയിലെ ഒരു സംഭവം’ എന്ന ഹീബ്രായ പ്രയോഗം രാത്രിയിലുണ്ടാകുന്ന ശുക്ലസ്രാവത്തെ സൂചിപ്പിക്കുന്നു. മുഖ്യപാഠത്തിൽ മാന്യവും ഗ്രഹിക്കാവുന്നതുമായ സംക്ഷിപ്ത പ്രയോഗം നൽകി, അടിക്കുറിപ്പിൽ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: וְיָצָא אֶל מִחוּץ לַמַּחֲנֶה
  choice: അവൻ പാളയത്തിനു പുറത്തേക്കു പോകണം
  rationale: നിയമനിർദേശത്തിന്റെ നിർബന്ധസ്വഭാവവും പാളയത്തിന്റെ അതിരിന് പുറത്തേക്കുള്ള ചലനവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לֹא יָבֹא אֶל תּוֹךְ הַמַּחֲנֶה
  choice: പാളയത്തിന്റെ അകത്തേക്കു വരരുത്
  rationale: תּוֹךְ സൂചിപ്പിക്കുന്ന പാളയത്തിന്റെ ഉൾഭാഗം നിലനിർത്തുന്നു; വെറും അതിർത്തി കടക്കൽ എന്നതിലുപരി അകത്തേക്കുള്ള പ്രവേശനമാണ് നിരോധിക്കുന്നത്.
theological_decisions:
- issue: ഈ വാക്യത്തിലെ അശുദ്ധിയുടെ സ്വഭാവം
  choice: ധാർമിക കുറ്റമായി അല്ല, ആചാരപരമായ അശുദ്ധിയുടെ അവസ്ഥയായി അവതരിപ്പിച്ചു.
  alternative: ഇത് ധാർമിക മലിനതയെയോ വ്യക്തിപരമായ കുറ്റത്തെയോ സൂചിപ്പിക്കുന്നതായി പരിഭാഷപ്പെടുത്തുക.
  rationale: സന്ദർഭം പാളയത്തിന്റെ വിശുദ്ധിയും ശരീരസ്രാവം മൂലമുള്ള ആചാരപരമായ അശുദ്ധിയും സംബന്ധിച്ചതാണ്; വ്യക്തിപരമായ പാപം വാക്യം ആരോപിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ‘ശുദ്ധനല്ലാതായാൽ’ ആചാരപരമായ വിഭാഗം സംരക്ഷിക്കുന്നു; ‘രാത്രിയിലെ സ്രാവം’ അതിരുകടന്ന ക്ലിനിക്കൽ ഭാഷ ഒഴിവാക്കുകയും അടിക്കുറിപ്പ് ആവശ്യമായ വ്യക്തത നൽകുകയും ചെയ്യുന്നു.
