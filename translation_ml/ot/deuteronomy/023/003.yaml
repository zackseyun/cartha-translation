source:
  edition: WLC
  text: לֹא יָבֹ֥א מַמְזֵ֖ר בִּ/קְהַ֣ל יְהוָ֑ה גַּ֚ם דּ֣וֹר עֲשִׂירִ֔י לֹא יָ֥בֹא ל֖/וֹ בִּ/קְהַ֥ל יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/003.yaml
  text: No one of illegitimate birth may enter the assembly of Yahweh; even to the tenth generation[a], none of his descendants may enter the assembly of Yahweh.
translation:
  language: ml
  text: അംഗീകൃതമല്ലാത്ത ജനനസ്ഥിതിയുള്ള ഒരാളും[a] യാഹ്‌വേയുടെ സഭയിൽ പ്രവേശിക്കരുത്; പത്താം തലമുറവരെപ്പോലും അവന്റെ സന്തതികളിൽ ആരും യാഹ്‌വേയുടെ സഭയിൽ പ്രവേശിക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിലെ മംസേർ എന്ന പദത്തിന്റെ കൃത്യമായ അർഥപരിധി അനിശ്ചിതമാണ്. പരമ്പരാഗതമായി ഇത് ‘ജാരസന്തതി’ എന്നു പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്; എന്നാൽ അംഗീകൃതമല്ലാത്തതോ പ്രത്യേകമായി ഒഴിവാക്കപ്പെട്ടതോ ആയ ജനനസ്ഥിതിയെയും ഇതു സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַמְזֵר
  choice: വിലക്കപ്പെട്ട ബന്ധത്തിൽ ജനിച്ച ഒരുവൻ
  rationale: ഈ പദം അംഗീകൃതമല്ലാത്തതോ നിഷിദ്ധമായതോ ആയ ബന്ധത്തിൽനിന്നുള്ള ജനനസ്ഥിതിയെ സൂചിപ്പിക്കുന്നു; അതിന്റെ കൃത്യമായ പരിധി അനിശ്ചിതമായതിനാൽ പൊതുവായെങ്കിലും സ്വാഭാവികമായ പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: יָבֹא
  choice: പ്രവേശിക്കരുത്
  rationale: വരുക/പ്രവേശിക്കുക എന്ന ക്രിയ നിയമപരമായ നിരോധനത്തിൽ വന്നിരിക്കുന്നതിനാൽ, മലയാളത്തിൽ നിരോധനം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: קְהַל יְהוָה
  choice: യാഹ്‌വേയുടെ സഭ
  rationale: קהל ഒത്തുകൂടിയ ഉടമ്പടി സമൂഹത്തെ സൂചിപ്പിക്കുന്നു; ‘സഭ’ അതിന്റെ സാമൂഹികവും സമ്മേളനപരവുമായ അർഥം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വേ
  rationale: എബ്രായ ദൈവനാമം പകരപ്പട്ടംകൊണ്ട് മാറ്റാതെ ശബ്ദാന്തരണം ചെയ്തു.
- source_word: גַּם דּוֹר עֲשִׂירִי
  choice: പത്താം തലമുറവരെപ്പോലും
  rationale: വിലക്കിന്റെ തലമുറാപരമായ വ്യാപ്തിയും ‘പോലും’ എന്ന ഊന്നലും നിലനിർത്തുന്നു.
- source_word: לֹא יָבֹא לוֹ
  choice: അവന്റെ സന്തതികളിൽ ആരും ... പ്രവേശിക്കരുത്
  rationale: തുടർന്നുള്ള തലമുറയെക്കുറിച്ചുള്ള സന്ദർഭത്തിൽ לוֹ ആ വ്യക്തിയുടെ വംശപരമ്പരയിൽപ്പെട്ടവരെ സൂചിപ്പിക്കുന്നതായി സ്വാഭാവികമായി വ്യക്തമാക്കി.
theological_decisions:
- issue: מַמְזֵר എന്ന ജനനസ്ഥിതിയുടെ കൃത്യമായ നിർവചനം
  choice: വിലക്കപ്പെട്ട ബന്ധത്തിൽ ജനിച്ച ഒരുവൻ
  alternative: വിവാഹേതര ജനനമുള്ളവൻ; ജാരസന്തതി
  rationale: പദം ഏതു തരത്തിലുള്ള ജനനത്തെ നിർവചിക്കുന്നു എന്നത് പൂർണമായി ഉറപ്പില്ല. അതിനെ എല്ലാ വിവാഹേതര ജനനങ്ങളിലേക്കും ചുരുക്കുകയോ അപമാനകരമായ പരമ്പരാഗത പദം മാത്രം ഉപയോഗിക്കുകയോ ചെയ്യാതെ അവ്യക്തത നിലനിർത്തി.
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമത്തെ പേരായിത്തന്നെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ നിയമവാക്യത്തിന്റെ ഗൗരവവും ആവർത്തനവും നിലനിർത്തി. അപമാനകരമായി കേൾക്കാവുന്ന പരമ്പരാഗത പദം മുഖ്യപാഠത്തിൽ ഒഴിവാക്കി; മൂലത്തിലെ അർഥാനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
