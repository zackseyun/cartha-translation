source:
  edition: WLC
  text: וְ/הָיָ֥ה לִ/פְנֽוֹת עֶ֖רֶב יִרְחַ֣ץ בַּ/מָּ֑יִם וּ/כְ/בֹ֣א הַ/שֶּׁ֔מֶשׁ יָבֹ֖א אֶל תּ֥וֹךְ הַֽ/מַּחֲנֶה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/012.yaml
  text: And toward evening he shall wash himself with water[b][a], and when the sun sets he may come into the midst of the camp.
translation:
  language: ml
  text: സന്ധ്യയോടടുക്കുമ്പോൾ അവൻ വെള്ളത്തിൽ കുളിക്കണം; സൂര്യൻ അസ്തമിക്കുമ്പോൾ[a] അവന് പാളയത്തിന്റെ ഉൾഭാഗത്തേക്കു പ്രവേശിക്കാം.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘സൂര്യൻ അകത്തേക്കു വരുമ്പോൾ’; സൂര്യാസ്തമയത്തെ സൂചിപ്പിക്കുന്ന ഹെബ്രായ പ്രയോഗമാണിത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘പാളയത്തിലേക്കു.’ ഹെബ്രായ പദപ്രയോഗം പാളയത്തിന്റെ ഉൾഭാഗത്തേക്കുള്ള പ്രവേശനത്തെ കൂടുതൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: — (തുടർച്ച പ്രത്യേകം പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല)
  rationale: ഇവിടെ വാവ് + היה നിയമനിർദേശത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. മുൻസന്ദർഭവുമായി സ്വാഭാവികമായി ബന്ധപ്പെടുന്നതിനാൽ മലയാളത്തിൽ പ്രത്യേകമായി ‘അപ്പോൾ’ എന്ന പദം ചേർക്കാതെ തുടർച്ച നിലനിർത്തി.
- source_word: לִפְנוֹת עֶרֶב
  choice: സന്ധ്യയോടടുക്കുമ്പോൾ
  rationale: פנה എന്ന ക്രിയയുടെ infinitive construct ദിവസം സന്ധ്യയിലേക്കു തിരിയുന്ന സമയത്തെ സൂചിപ്പിക്കുന്നു. ‘സന്ധ്യയോടടുക്കുമ്പോൾ’ ഈ സമയസൂക്ഷ്മത സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יִרְחַץ בַּמָּיִם
  choice: വെള്ളത്തിൽ കുളിക്കണം
  rationale: ഈ ശുദ്ധീകരണസന്ദർഭത്തിൽ רחץ ശരീരം വെള്ളത്തിൽ കഴുകുന്നതിനെയോ കുളിക്കുന്നതിനെയോ സൂചിപ്പിക്കുന്നു. ‘കുളിക്കണം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമാണ്; בַּמַּיִם എന്നത് ‘വെള്ളത്തിൽ’ എന്നു നിലനിർത്തി.
- source_word: וּכְבֹא הַשֶּׁמֶשׁ
  choice: സൂര്യൻ അസ്തമിക്കുമ്പോൾ
  rationale: അക്ഷരാർഥത്തിൽ സൂര്യൻ ‘അകത്തേക്കു വരുമ്പോൾ’ എന്ന ഹെബ്രായ പ്രയോഗം സൂര്യാസ്തമയത്തെ സൂചിപ്പിക്കുന്ന idiom ആണ്. അർഥം വ്യക്തമായി നൽകുകയും അക്ഷരാർഥം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുകയും ചെയ്തു.
- source_word: יָבֹא
  choice: പ്രവേശിക്കാം
  rationale: നിയമപരമായ ഈ സന്ദർഭത്തിൽ imperfect രൂപം ശുദ്ധീകരണവും സൂര്യാസ്തമയവും കഴിഞ്ഞുള്ള പുനഃപ്രവേശനാനുമതിയാണ് സൂചിപ്പിക്കുന്നത്. ‘പ്രവേശിക്കാം’ വെറും ഭാവികാലത്തേക്കാൾ ഈ അനുമതിസൂക്ഷ്മത വ്യക്തമാക്കുന്നു.
- source_word: אֶל תּוֹךְ הַמַּחֲנֶה
  choice: പാളയത്തിന്റെ നടുവിലേക്കു
  rationale: תוך പാളയത്തിന്റെ ഉൾഭാഗത്തേക്കുള്ള പ്രവേശനം ഊന്നിപ്പറയുന്നു. ‘നടുവിലേക്കു’ ഈ പ്രത്യേകത നിലനിർത്തുന്നു; കൂടുതൽ പൊതുവായ പരിഭാഷ അടിക്കുറിപ്പിൽ നൽകി.
