translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ നിയമനിർദേശശൈലി ഉപയോഗിച്ചു. ‘സന്ധ്യയോടടുക്കുമ്പോൾ’, ‘കുളിക്കണം’, ‘പ്രവേശിക്കാം’ എന്നീ രൂപങ്ങൾ സമയക്രമം, ദേഹശുദ്ധീകരണം, പുനഃപ്രവേശനാനുമതി എന്നിവ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
