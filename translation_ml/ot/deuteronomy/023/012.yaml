    issue: ‘പാളയത്തിന്റെ നടുവിലേക്കു’ may over-specify the destination as the camp’s center.
    rationale: תּוֹךְ emphasizes being within the camp/interior, not necessarily its geometrical middle.
  - severity: low
    issue: Footnote b’s stated alternative is too close to the main rendering.
    rationale: With the main text revised to ‘ഉൾഭാഗത്തേക്കു,’ ‘പാളയത്തിലേക്കു’ clearly represents the less specific alternative.
