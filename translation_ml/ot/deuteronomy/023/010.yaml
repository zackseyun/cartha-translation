  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּֽי תֵצֵ֥א מַחֲנֶ֖ה עַל אֹיְבֶ֑י/ךָ וְ/נִ֨שְׁמַרְתָּ֔ מִ/כֹּ֖ל דָּבָ֥ר רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/010.yaml
  text: When you go out as an army against your enemies[a], then keep yourself from every evil thing.
translation:
  language: ml
  text: നിന്റെ ശത്രുക്കൾക്കെതിരെ സൈന്യമായി പുറപ്പെടുമ്പോൾ, എല്ലാ ദോഷകരമായ കാര്യങ്ങളിൽനിന്നും നിന്നെത്തന്നെ കാത്തുകൊള്ളുക.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എല്ലാ അശുദ്ധകാര്യങ്ങളിൽനിന്നും” / “അനുചിതമായ എന്തിൽനിന്നും.” ഈ ഹീബ്രു പ്രയോഗത്തിന് വിശാലമായ അർഥമുണ്ട്; ഈ സന്ദർഭത്തിൽ ആചാരപരമായ അശുദ്ധി അതിൽ ഉൾപ്പെടാമെങ്കിലും, അതിൽ മാത്രം ഒതുങ്ങുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: പുറപ്പെടുമ്പോൾ
  rationale: ഇവിടെ כִּי തുടർന്നുവരുന്ന കല്പനയ്ക്കുള്ള സാഹചര്യത്തെ അവതരിപ്പിക്കുന്നു; നിയമോപദേശത്തിന്റെ സന്ദർഭത്തിൽ ‘എപ്പോൾ’ എന്ന അർഥമുള്ള ‘-ുമ്പോൾ’ സ്വാഭാവികമാണ്.
- source_word: תֵצֵא
  choice: പുറപ്പെടുക
  rationale: יצא എന്ന ധാതുവിന്റെ നേരിട്ടുള്ള അർഥമായ ‘പുറപ്പെടുക’ സൈനികസന്ദർഭത്തിനും ആധുനിക മലയാളത്തിനും യോജിക്കുന്നു.
- source_word: מַחֲנֶה
  choice: സൈന്യമായി
  rationale: പദത്തിന് സാധാരണയായി ‘പാളയം’ എന്നർഥമുണ്ടെങ്കിലും, יצא എന്ന ക്രിയയോടും ശത്രുക്കൾക്കെതിരെയുള്ള നീക്കത്തോടും ചേർന്നപ്പോൾ പാളയമിട്ട സൈനികസമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: עַל
  choice: എതിരെ
  rationale: സൈനികസന്ദർഭത്തിൽ עַל ശത്രുതാപരമായ ബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ ‘എതിരെ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: אֹיְבֶיךָ
  choice: നിന്റെ ശത്രുക്കൾ
  rationale: אויב എന്ന നാമത്തോടു ചേർന്ന രണ്ടാംപുരുഷ ഏകവചന പ്രത്യയത്തിന്റെ നേരിട്ടുള്ള വിവർത്തനം.
- source_word: וְנִשְׁמַרְתָּ
  choice: നിന്നെത്തന്നെ കാത്തുകൊള്ളുക
  rationale: שׁמר-ന്റെ നിഫാൽ രൂപത്തിലുള്ള ആത്മനിഷ്ഠഭാവവും കല്പനാസ്വരവും ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: מִכֹּל
  choice: എല്ലാ ...യിൽനിന്നും
  rationale: מן കൂടിയ כֹּל, ഒരാൾ ഓരോ വിധത്തിലുള്ള കാര്യത്തിൽനിന്നും സ്വയം കാത്തുസൂക്ഷിക്കണമെന്ന് സൂചിപ്പിക്കുന്നു.
- source_word: דָּבָר רָע
  choice: ദുഷ്കാര്യങ്ങൾ
  rationale: דָּבָר എന്നതിന്റെ വിശാലമായ ‘കാര്യം’ എന്ന അർഥവും רָע എന്നതിന്റെ ധാർമികമോ ആചാരപരമോ ആയ ദോഷസൂചനയും സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു; അശുദ്ധിയിലേക്കു മാത്രം അർഥം ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: പാളയവിശുദ്ധിനിയമത്തിൽ דָּבָר רָע എന്ന പ്രയോഗത്തിന്റെ വ്യാപ്തി
  choice: അർഥം ആചാരപരമായ അശുദ്ധിയിലേക്കു മാത്രം ചുരുക്കാതെ ‘എല്ലാ ദുഷ്കാര്യങ്ങൾ’ എന്നു വിശാലമായി വിവർത്തനം ചെയ്തു.
  alternative: എല്ലാ അശുദ്ധകാര്യങ്ങളും / അനുചിതമായ എന്തും
  rationale: തുടർന്നുള്ള സന്ദർഭം ആചാരപരമായ അശുദ്ധിയെ പരാമർശിക്കുന്നുണ്ടെങ്കിലും, ഹീബ്രു പ്രയോഗം അതിനേക്കാൾ വിശാലമാണ്. അതിനാൽ പാഠത്തിലുള്ള അർഥവ്യാപ്തിയും വ്യാഖ്യാനപരമായ തുറന്ന നിലയും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കല്പനാശൈലി ഉപയോഗിച്ചു. ഏകവചന അഭിസംബോധന നിലനിർത്തി; ‘പാളയം’ എന്ന പദത്തിന്റെ അക്ഷരാർഥം ഈ വാക്യഘടനയിൽ അസ്വാഭാവികമാകുന്നതിനാൽ സന്ദർഭോചിതമായി ‘സൈന്യമായി’ എന്നു നൽകി.
