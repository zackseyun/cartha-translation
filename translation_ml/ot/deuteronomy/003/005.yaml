- from: ഇവയെല്ലാം ഉയർന്ന മതിലും ഇരട്ടവാതിലുകളും ഓടാമ്പലുകളുമുള്ള ഉറപ്പുള്ള പട്ടണങ്ങളായിരുന്നു; ഇവയ്ക്കു പുറമേ, തുറന്ന നാട്ടിലെ പട്ടണങ്ങളും[a] വളരെ ഏറെയുണ്ടായിരുന്നു.
  to: ഇവയെല്ലാം ഉയർന്ന മതിലും ഇരട്ടവാതിലുകളും ഓടാമ്പലുകളുമുള്ള കോട്ടകെട്ടിയ പട്ടണങ്ങളായിരുന്നു; ഇതുകൂടാതെ, തുറസ്സായ പ്രദേശങ്ങളിലെ പട്ടണങ്ങളും[a] വളരെ ഏറെയുണ്ടായിരുന്നു.
