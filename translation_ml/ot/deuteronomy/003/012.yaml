source:
  edition: WLC
  text: וְ/אֶת הָ/אָ֧רֶץ הַ/זֹּ֛את יָרַ֖שְׁנוּ בָּ/עֵ֣ת הַ/הִ֑וא מֵ/עֲרֹעֵ֞ר אֲשֶׁר עַל נַ֣חַל אַרְנֹ֗ן וַ/חֲצִ֤י הַֽר הַ/גִּלְעָד֙ וְ/עָרָ֔י/ו נָתַ֕תִּי לָ/רֻֽאוּבֵנִ֖י וְ/לַ/גָּדִֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/012.yaml
  text: And we took possession of this land at that time[a], from Aroer, which is on the Valley of the Arnon, and half the hill country of Gilead with its cities[b]; I gave it to the Reubenites and the Gadites.
translation:
  language: ml
  text: 'ആ കാലത്ത് നാം ഈ ദേശം കൈവശപ്പെടുത്തി: അർന്നോൻ താഴ്‌വര[a]യോടു ചേർന്ന അരോവേർ മുതൽ ഗിലെയാദ് മലനാടിന്റെ പകുതി[b]വരെയുള്ള പ്രദേശവും അതിലെ പട്ടണങ്ങളും. അത് ഞാൻ രൂബേന്യർക്കും ഗാദ്യർക്കും കൊടുത്തു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അർന്നോൻ വാദിയോടു ചേർന്ന അരോവേർ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിലെ נַחַל എന്ന പദത്തിന് വാദി, മലയിടുക്ക്, താഴ്‌വര എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: ‘ഗിലെയാദ് മലയുടെ പകുതി’ എന്നും പരിഭാഷപ്പെടുത്താം. പ്രദേശവിവരണങ്ങളിൽ എബ്രായത്തിലെ הַר എന്ന പദം ഒരു മലമ്പ്രദേശത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרַשְׁנוּ
  choice: നാം ... കൈവശപ്പെടുത്തി
  rationale: ജയിച്ചടക്കിയ പ്രദേശം സജീവമായി അധീനമാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘കൈവശപ്പെടുത്തി’ സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: הָאָרֶץ הַזֹּאת
  choice: ഈ ദേശം
  rationale: കൈവശപ്പെടുത്തിയ ഭൂപ്രദേശത്തെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בָּעֵת הַהִוא
  choice: ആ കാലത്ത്
  rationale: എബ്രായ സമയപ്രയോഗത്തിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: מֵעֲרֹעֵר אֲשֶׁר עַל נַחַל אַרְנֹן
  choice: അർന്നോൻ താഴ്‌വരയുടെ അരികിലുള്ള അരോവേർമുതൽ
  rationale: സ്ഥലനാമങ്ങൾ ലിപ്യന്തരണം ചെയ്യുകയും עַל എന്നതിന്റെ ഭൂമിശാസ്ത്രപരമായ ബന്ധം ‘അരികിലുള്ള’ എന്നു നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: נַחַל
  choice: താഴ്‌വര
  rationale: ഇവിടെ ജലപാതയോടുകൂടിയ മലയിടുക്ക്/വാദി എന്ന ഭൂമിശാസ്ത്ര അർഥമാണ്; പൊതുവായ വായനക്കാർക്ക് ‘താഴ്‌വര’ സുഗ്രാഹ്യമാണ്.
- source_word: וַחֲצִי הַר הַגִּלְעָד
  choice: ഗിലെയാദ് മലനാടിന്റെ പകുതി
  rationale: הַר ഇവിടെ ഒരു ഒറ്റ മലയേക്കാൾ വിശാലമായ മലമ്പ്രദേശത്തെ സൂചിപ്പിക്കാവുന്നതിനാൽ ‘മലനാട്’ തിരഞ്ഞെടുത്തു.
- source_word: וְעָרָיו
  choice: അതിലെ പട്ടണങ്ങൾ
  rationale: പ്രത്യയം ഗിലെയാദ് മലനാടിനോട് ബന്ധിപ്പിച്ച് പ്രദേശത്തിലെ പട്ടണങ്ങളെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: נָתַתִּי
  choice: അതു ഞാൻ ... കൊടുത്തു
  rationale: ഒന്നാംപുരുഷ ബഹുവചനത്തിൽനിന്ന് മോശെയുടെ ഒന്നാംപുരുഷ ഏകവചനത്തിലേക്കുള്ള മാറ്റം സംരക്ഷിക്കുകയും נתן എന്നതിന്റെ ലളിതമായ അർഥം നൽകുകയും ചെയ്യുന്നു.
- source_word: לָרֻאוּבֵנִי וְלַגָּדִי
  choice: രൂബേന്യർക്കും ഗാദ്യർക്കും
  rationale: ഏകവചന ഗോത്രവിശേഷണങ്ങൾ ഇവിടെ സമൂഹങ്ങളെ കൂട്ടായി സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചനരൂപം ഉപയോഗിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഭൂമിശാസ്ത്രപരമായ പരിധി വ്യക്തമാക്കാൻ ‘മുതൽ ... വരെ’ എന്ന സ്വാഭാവിക ഘടന ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
