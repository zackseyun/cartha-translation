  terminology: ‘ദേശം,’ ‘കൈവശപ്പെടുത്തി,’ ‘മലനാട്,’ ‘രൂബേന്യർ,’ and ‘ഗാദ്യർ’ are appropriate in modern standard Malayalam biblical register. ‘താഴ്‌വര’ reasonably renders נחל here, while the note preserves ‘വാദി’ and ‘മലയിടുക്ക്’ as alternatives.
  issues:
