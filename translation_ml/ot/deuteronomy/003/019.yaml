source:
  edition: WLC
  text: רַ֠ק נְשֵׁי/כֶ֣ם וְ/טַפְּ/כֶם֮ וּ/מִקְנֵ/כֶם֒ יָדַ֕עְתִּי כִּֽי מִקְנֶ֥ה רַ֖ב לָ/כֶ֑ם יֵֽשְׁבוּ֙ בְּ/עָ֣רֵי/כֶ֔ם אֲשֶׁ֥ר נָתַ֖תִּי לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/019.yaml
  text: Only your wives[a], your little ones, and your livestock—I know that you have much livestock—shall remain in your towns that I have given you[b],
translation:
  language: ml
  text: നിങ്ങളുടെ ഭാര്യമാരും കുഞ്ഞുങ്ങളും[a] കന്നുകാലികളും മാത്രം—നിങ്ങൾക്ക് ധാരാളം കന്നുകാലികളുണ്ടെന്ന് എനിക്കറിയാം—ഞാൻ നിങ്ങൾക്കു തന്ന പട്ടണങ്ങളിൽ[b] താമസിക്കട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കുഞ്ഞുങ്ങൾ” എന്നതിന് “മക്കൾ” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം ചെറിയ കുട്ടികളെയോ ആശ്രിതരെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “പട്ടണങ്ങൾ” എന്നതിന് “നഗരങ്ങൾ” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം വ്യത്യസ്ത വലുപ്പമുള്ള ജനവാസകേന്ദ്രങ്ങളെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: മാത്രം
  rationale: മുൻ കല്പനയിൽനിന്നുള്ള ഒഴിവിനെ സൂചിപ്പിക്കുന്ന നിയന്ത്രണാർഥം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: נְשֵׁיכֶם
  choice: നിങ്ങളുടെ ഭാര്യമാർ
  rationale: ഇവിടെ പിന്നിൽ കഴിയുന്ന കുടുംബാംഗങ്ങളെയാണ് ഉദ്ദേശിക്കുന്നത്; അതിനാൽ പൊതുവായ ‘സ്ത്രീകൾ’ എന്നതിനെക്കാൾ ‘ഭാര്യമാർ’ സന്ദർഭോചിതമാണ്.
- source_word: טַפְּכֶם
  choice: കുഞ്ഞുങ്ങൾ
  rationale: ചെറിയ കുട്ടികളെയോ ആശ്രിതരെയോ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ കുടുംബപരവും മൂർത്തവുമായ അർഥം ലളിതമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מִקְנֵיכֶם / מִקְנֶה רַב
  choice: കന്നുകാലികൾ / ധാരാളം കന്നുകാലികൾ
  rationale: വിവിധ ഇനങ്ങളിലുള്ള വളർത്തുമൃഗങ്ങളെ ഉൾക്കൊള്ളുന്ന വിശാലപദമായി ‘കന്നുകാലികൾ’ ഉപയോഗിക്കുകയും എബ്രായത്തിലെ ആവർത്തനം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: יָדַעְתִּי כִּי
  choice: ഉണ്ടെന്ന് എനിക്കറിയാം
  rationale: ഒഴിവിന്റെ കാരണം വിശദീകരിക്കുന്ന ഒന്നാംപുരുഷ പ്രസ്താവന നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: יֵשְׁבוּ
  choice: താമസിക്കട്ടെ
  rationale: യുദ്ധത്തിനായി കടന്നുപോകുന്നവരോട് വിപരീതമായി ഇവർ പിന്നിൽ കഴിയണമെന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְּעָרֵיכֶם
  choice: നിങ്ങളുടെ പട്ടണങ്ങളിൽ
  rationale: עִיר വ്യത്യസ്ത വലുപ്പമുള്ള ജനവാസകേന്ദ്രങ്ങളെ സൂചിപ്പിക്കാം; ‘പട്ടണം’ നഗരവലുപ്പം അനാവശ്യമായി നിർണയിക്കാതെ അർഥം നൽകുന്നു.
- source_word: אֲשֶׁר נָתַתִּי לָכֶם
  choice: ഞാൻ നിങ്ങൾക്കു തന്ന
  rationale: നൽകൽ പൂർത്തിയായ പ്രവൃത്തിയാണെന്ന എബ്രായ പൂർണക്രിയയുടെ ഭാവം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. മൂലത്തിലെ വാക്യാന്തര വിശദീകരണം ദീർഘവിരാമങ്ങൾക്കിടയിൽ നിലനിർത്തി; ‘കന്നുകാലികൾ’ എന്ന ആവർത്തനവും സംരക്ഷിച്ചു.
