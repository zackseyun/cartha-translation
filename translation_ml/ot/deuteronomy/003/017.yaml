  text: וְ/הָֽ/עֲרָבָ֖ה וְ/הַ/יַּרְדֵּ֣ן וּ/גְבֻ֑ל מִ/כִּנֶּ֗רֶת וְ/עַ֨ד יָ֤ם הָֽ/עֲרָבָה֙ יָ֣ם הַ/מֶּ֔לַח תַּ֛חַת אַשְׁדֹּ֥ת הַ/פִּסְגָּ֖ה מִזְרָֽחָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/017.yaml
  text: also the Arabah[a], with the Jordan as its border, from Kinnereth as far as the Sea of the Arabah, the Salt Sea[b], below the slopes of Pisgah on the east.
translation:
  language: ml
  text: അരാബയും[a], അതിന്റെ അതിരായ യോർദ്ദാനും, കിന്നെരെത്ത് മുതൽ അരാബാ കടൽ—അതായത് ഉപ്പുകടൽ[b]—വരെ, കിഴക്കോട്ട് പിസ്ഗയുടെ ചരിവുകൾക്കു താഴെയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അരാബ എന്നത് യോർദ്ദാൻ താഴ്‌വരയോടു ബന്ധപ്പെട്ട ഒരു ഭൂമിശാസ്ത്രപ്രദേശത്തിന്റെ പേരാണ്.
    reason: geographic_clarification
  - marker: b
    text: അതായത്, ചാവുകടൽ.
    reason: modern_name
lexical_decisions:
- source_word: הָעֲרָבָה
  choice: അരാബ
  rationale: ഈ അതിർത്തിവിവരണത്തിൽ പൊതുവായ ‘സമതലം’ എന്നതിലുപരി യോർദ്ദാൻ ഭ്രംശതാഴ്‌വരപ്രദേശത്തിന്റെ ഭൂമിശാസ്ത്രനാമമായാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
- source_word: הַיַּרְדֵּן
  choice: യോർദ്ദാൻ
  rationale: അതിർത്തിപ്പട്ടികയിൽ നദിയെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിലും ‘നദി’ എന്നു ചേർക്കാതെ പതിവായ ഭൂമിശാസ്ത്രനാമം നിലനിർത്തുന്നു.
- source_word: גְבֻל
  choice: അതിന്റെ അതിരായ
  rationale: എബ്രായത്തിലെ സംക്ഷിപ്തമായ പട്ടികാവാക്യഘടനയിൽ യോർദ്ദാനും പ്രദേശത്തിന്റെ അതിരും തമ്മിലുള്ള ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: מִכִּנֶּרֶת
  choice: കിന്നെരെത്ത് മുതൽ
  rationale: മൂലപാഠത്തിലുള്ള സ്ഥലനാമം മാത്രമാണ് ലിപ്യന്തരണം ചെയ്തത്; തടാകമാണോ പ്രദേശമാണോ എന്നു പാഠം വ്യക്തമാക്കാത്തതിനാൽ അതു നിർണയിച്ചിട്ടില്ല.
- source_word: יָם הָעֲרָבָה
  choice: അരാബാ കടൽ
  rationale: തുടർന്നുള്ള ‘ഉപ്പുകടൽ’ എന്ന സമാനാധികരണ വിശദീകരണത്തിനു മുമ്പുള്ള എബ്രായ ഭൂമിശാസ്ത്രവിശേഷണം അടുത്തായി നിലനിർത്തുന്നു.
- source_word: יָם הַמֶּלַח
  choice: ഉപ്പുകടൽ
  rationale: പരിചിതമായ ആധുനിക നാമത്തിനു പകരം എബ്രായ പ്രയോഗത്തിന്റെ നേരിട്ടുള്ള അർഥം സംരക്ഷിക്കുന്നു.
- source_word: תַּחַת
  choice: താഴെയുള്ള
  rationale: ദിക്കിനെക്കുറിച്ച് അധികമായി വ്യാഖ്യാനിക്കാതെ ഭൂപ്രകൃതിയിലെ താഴ്ന്ന സ്ഥാനം സൂചിപ്പിക്കുന്നു.
- source_word: אַשְׁדֹּת
  choice: ചരിവുകൾ
  rationale: ഈ ഭൂമിശാസ്ത്രസന്ദർഭത്തിൽ മലഞ്ചരിവുകളെയോ ഇറക്കങ്ങളെയോ സൂചിപ്പിക്കുന്ന അർഥമാണ് ഏറ്റവും യോജിച്ചത്.
- source_word: הַפִּסְגָּה
  choice: പിസ്ഗ
  rationale: സ്ഥലനാമമായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: מִזְרָחָה
  choice: കിഴക്കുള്ള
  rationale: പിസ്ഗയുടെ ചരിവുകളുമായി ബന്ധപ്പെട്ട കിഴക്കൻ ദിശാസ്ഥാനം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
