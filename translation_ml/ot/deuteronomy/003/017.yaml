    reason: modern_name
  revision_rationale: The revision preserves the Hebrew boundary-list structure, makes the eastward orientation explicit without overinterpreting it, and avoids adding ‘region’ where the source uses an elliptical series. The Arabah clarification is narrowed to avoid an overly broad geographical identification.
