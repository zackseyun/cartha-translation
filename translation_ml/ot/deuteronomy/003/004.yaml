  yaml_path: translation/ot/deuteronomy/003/004.yaml
  text: 'And we captured all his cities at that time; there was not a city that we did not take from them: sixty cities[a], all the region of Argob, the kingdom of Og in Bashan.'
translation:
  language: ml
  text: ആ സമയത്ത് അവന്റെ എല്ലാ പട്ടണങ്ങളും നാം പിടിച്ചെടുത്തു. അവരിൽനിന്ന്[a] നാം പിടിച്ചെടുക്കാത്ത ഒരു പട്ടണംപോലും ഉണ്ടായിരുന്നില്ല—അറുപത് പട്ടണങ്ങൾ, ബാശാനിലുള്ള ഓഗിന്റെ രാജ്യത്തിലെ അർഗോബ് പ്രദേശം മുഴുവനും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവരിൽനിന്ന്’ എന്നാണ് ഹീബ്രു; ഇത് ഓഗിനെ മാത്രം അല്ല, അവന്റെ ജനത്തെയോ സൈന്യത്തെയോ സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּלְכֹּד
  choice: നാം പിടിച്ചെടുത്തു
  rationale: לכד എന്ന ക്രിയയുടെ യുദ്ധസന്ദർഭത്തിലുള്ള പിടിച്ചടക്കൽ എന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כָּל עָרָיו
  choice: അവന്റെ എല്ലാ പട്ടണങ്ങളും
  rationale: עיר എന്നതിന് ഇവിടെ ‘പട്ടണം’ സ്വാഭാവികമാണ്; ഏകവചന പ്രത്യയം ഓഗിനെ സൂചിപ്പിക്കുന്നു.
- source_word: בָּעֵת הַהִוא
  choice: ആ സമയത്ത്
  rationale: ഹീബ്രു കാലസൂചക പ്രയോഗത്തിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: לֹא הָיְתָה קִרְיָה אֲשֶׁר לֹא לָקַחְנוּ מֵאִתָּם
  choice: അവരിൽനിന്ന് നാം പിടിച്ചെടുക്കാത്ത ഒരു പട്ടണംപോലും ഉണ്ടായിരുന്നില്ല
  rationale: മൂലത്തിലെ ഊന്നിയ നിഷേധവും ബന്ധവാക്യഘടനയും നിലനിർത്തുന്നു; מֵאִתָּם എന്ന ബഹുവചനരൂപവും വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: שִׁשִּׁים עִיר
  choice: അറുപതു പട്ടണങ്ങൾ
  rationale: സംഖ്യയും നാമവും നേരിട്ട് പരിഭാഷപ്പെടുത്തി, മുൻപ്രയോഗങ്ങളുമായുള്ള പദസ്ഥിരത പാലിക്കുന്നു.
- source_word: כָּל חֶבֶל אַרְגֹּב
  choice: അർഗോബ് പ്രദേശം മുഴുവനും
  rationale: חבל ഇവിടെ ഭരണപരമോ ഭൂമിശാസ്ത്രപരമോ ആയ പ്രദേശത്തെ സൂചിപ്പിക്കുന്നു; ‘പ്രദേശം’ ആധുനിക വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: מַמְלֶכֶת עוֹג בַּבָּשָׁן
  choice: ബാശാനിലെ ഓഗിന്റെ രാജ്യത്തിൽപ്പെട്ട
  rationale: അർഗോബ് പ്രദേശവും ബാശാനിലുള്ള ഓഗിന്റെ രാജ്യവും തമ്മിലുള്ള ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
