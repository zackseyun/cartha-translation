translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. യുദ്ധസന്ദർഭം വ്യക്തമാക്കാൻ ‘പിടിച്ചെടുത്തു’ ഉപയോഗിച്ചു. മൂലത്തിലെ ഏകവചനമായ ‘അവന്റെ’ എന്നതും പിന്നീടുള്ള ബഹുവചനമായ ‘അവരിൽനിന്ന്’ എന്നതും സമീകരിക്കാതെ നിലനിർത്തി; അതിന്റെ സൂചന അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
