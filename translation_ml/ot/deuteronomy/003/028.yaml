  rationale: The revision corrects the idiom for formally commissioning Joshua, clarifies that he crosses ahead of the people, and renders the causative inheritance verb with a Malayalam expression that means ‘cause them to receive [it] as an inheritance.’ It preserves the source’s concise register and does not add an explicit theological claim about ultimate ownership or agency.
