revisions:
- from: എന്നാൽ യോശുവയെ ചുമതല ഏൽപ്പിക്കുക[a]; അവനെ ശക്തിപ്പെടുത്തുകയും ധൈര്യപ്പെടുത്തുകയും ചെയ്യുക. കാരണം, അവൻ ഈ ജനത്തിന്റെ മുമ്പിൽ കടന്നുപോകും; നീ കാണാനിരിക്കുന്ന ദേശം അവൻ അവർക്കു അവകാശമായി ലഭ്യമാക്കും[b].
