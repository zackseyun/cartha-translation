source:
  edition: WLC
  text: וְ/צַ֥ו אֶת יְהוֹשֻׁ֖עַ וְ/חַזְּקֵ֣/הוּ וְ/אַמְּצֵ֑/הוּ כִּי ה֣וּא יַעֲבֹ֗ר לִ/פְנֵי֙ הָ/עָ֣ם הַ/זֶּ֔ה וְ/הוּא֙ יַנְחִ֣יל אוֹתָ֔/ם אֶת הָ/אָ֖רֶץ אֲשֶׁ֥ר תִּרְאֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/028.yaml
  text: But commission Joshua[a], and strengthen him and encourage him, for he will cross over before this people[c][b], and he will cause them to inherit the land that you will see.
translation:
  language: ml
  text: എന്നാൽ യോശുവയെ ചുമതലപ്പെടുത്തുക[a]; അവനെ ശക്തിപ്പെടുത്തുകയും ധൈര്യപ്പെടുത്തുകയും ചെയ്യുക. കാരണം, അവൻ ഈ ജനത്തിനു മുമ്പായി കടന്നുപോകും; നീ കാണാനിരിക്കുന്ന ദേശം അവർക്കു അവകാശമായി ലഭിക്കുമാറാക്കും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യോശുവയോടു കല്പിക്കുക’ അല്ലെങ്കിൽ ‘യോശുവയ്ക്ക് ഔദ്യോഗിക നിർദേശം നൽകുക.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ ക്രിയ ഔദ്യോഗികമായ ഒരു ചുമതല ഏൽപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ, ‘അവൻ അവർക്കു ദേശം അവകാശമായി നൽകും.’ എബ്രായ ക്രിയ കാരണാർത്ഥകമാണ്: ജനത്തിന് അവരുടെ അവകാശം ലഭിക്കുന്നതിനുള്ള പ്രവർത്തകനായി യോശുവ നിലകൊള്ളും.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצַו אֶת־יְהוֹשֻׁעַ
  choice: യോശുവയെ ചുമതല ഏൽപ്പിക്കുക
  rationale: צוה എന്ന പിയേൽ ആജ്ഞാരൂപം ഇവിടെ ഒരു സാധാരണ കല്പനയെക്കാൾ ഔദ്യോഗികമായ നേതൃത്വച്ചുമതല ഏൽപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ചുമതല ഏൽപ്പിക്കുക’ ആ ഔദ്യോഗിക ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְחַזְּקֵהוּ וְאַמְּצֵהוּ
  choice: അവനെ ശക്തിപ്പെടുത്തുകയും ധൈര്യപ്പെടുത്തുകയും ചെയ്യുക
  rationale: חזק, אמץ എന്നീ പരസ്പരപൂരക ക്രിയകൾ ഉറപ്പും ധൈര്യവും നൽകുന്നതിനെ സൂചിപ്പിക്കുന്നു; രണ്ടിന്റെയും വ്യത്യസ്ത ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: כִּי הוּא יַעֲבֹר לִפְנֵי הָעָם הַזֶּה
  choice: കാരണം, അവൻ ഈ ജനത്തിന്റെ മുമ്പിൽ കടന്നുപോകും
  rationale: עבר യോർദ്ദാൻ കടക്കുന്നതിന്റെ സന്ദർഭം നിലനിർത്തുന്നു; לִפְנֵי എന്നത് സ്ഥലപരമായ ‘മുമ്പിൽ’ എന്ന അർഥത്തോടൊപ്പം നേതൃത്വസൂചനയും തുറന്നുവെക്കുന്നു.
- source_word: וְהוּא יַנְחִיל אוֹתָם אֶת־הָאָרֶץ
  choice: ദേശം അവൻ അവർക്കു അവകാശമായി ലഭ്യമാക്കും
  rationale: נחל എന്ന ഹിഫീൽ ക്രിയയുടെ കാരണാർത്ഥം നിലനിർത്തിക്കൊണ്ട്, യോശുവ മുഖാന്തരം ജനത്തിന് ദേശം അവകാശമായി ലഭിക്കുമെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ പറയുന്നു.
- source_word: אֲשֶׁר תִּרְאֶה
  choice: നീ കാണാനിരിക്കുന്ന
  rationale: മോശെ പിന്നീട് കാണുന്ന ദേശത്തെ സൂചിപ്പിക്കുന്ന അപൂർണക്രിയയുടെ ഭാവിയർഥം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: യോശുവയുടെ പങ്കും ദേശം നൽകുന്ന ദൈവിക പ്രവർത്തനവും തമ്മിലുള്ള ബന്ധം
  choice: ‘അവൻ അവർക്കു അവകാശമായി ലഭ്യമാക്കും’ എന്ന് കാരണാർത്ഥം നിലനിർത്തി
  alternative: ‘അവൻ ദേശം അവർക്കു നൽകും’ അല്ലെങ്കിൽ ‘അവൻ അവരെ ദേശം അവകാശമാക്കിക്കും’
  rationale: ഹീബ്രു ഹിഫീൽ രൂപം യോശുവയെ ജനത്തിന് അവകാശം ലഭിക്കുന്നതിനുള്ള പ്രവർത്തക മധ്യസ്ഥനായി അവതരിപ്പിക്കുന്നു; ദേശത്തിന്റെ പരമദാതാവ് യോശുവ തന്നെയാണെന്ന് അനാവശ്യമായി സൂചിപ്പിക്കാതെ ആ പങ്ക് നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഔദ്യോഗിക നേതൃത്വച്ചുമതല, ശക്തിപ്പെടുത്തൽ, ധൈര്യപ്പെടുത്തൽ, ദേശം അവകാശമായി ലഭ്യമാക്കുന്ന കാരണാർത്ഥക പങ്ക് എന്നിവ വ്യക്തമായി നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
