source:
  edition: WLC
  text: וַ/נִּקַּ֞ח בָּ/עֵ֤ת הַ/הִוא֙ אֶת הָ/אָ֔רֶץ מִ/יַּ֗ד שְׁנֵי֙ מַלְכֵ֣י הָ/אֱמֹרִ֔י אֲשֶׁ֖ר בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֑ן מִ/נַּ֥חַל אַרְנֹ֖ן עַד הַ֥ר חֶרְמֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/008.yaml
  text: And at that time we took the land from the hand of the two kings of the Amorites who were beyond the Jordan[a], from the Wadi Arnon as far as Mount Hermon.
translation:
  language: ml
  text: ആ കാലത്ത്, യോർദാന്ന് അപ്പുറത്തുള്ള അമോര്യരുടെ രണ്ടു രാജാക്കന്മാരുടെ കൈയിൽനിന്ന് അർന്നോൻ തോടു മുതൽ ഹെർമ്മോൻ പർവതംവരെയുള്ള ദേശം നാം കൈവശപ്പെടുത്തി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അർന്നോൻ താഴ്വര” എന്നോ “അർന്നോൻ നദി” എന്നോ പരിഭാഷപ്പെടുത്താം; എബ്രായത്തിലെ נחל എന്ന പദത്തിന് വാടി, നീരൊഴുക്കുള്ള തോട്, തോടിന്റെ പാത, അല്ലെങ്കിൽ താഴ്വര എന്നിങ്ങനെ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּקַּח
  choice: നാം കൈവശപ്പെടുത്തി
  rationale: לקח എന്ന ക്രിയ ഇവിടെ ഒരു പ്രദേശം തങ്ങളുടെ അധീനതയിലാക്കിയതിനെ സൂചിപ്പിക്കുന്നു. വെറും ‘എടുത്തു’ എന്നതിനെക്കാൾ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്; അതേസമയം ‘പിടിച്ചടക്കി’ എന്നതുപോലെ മൂലക്രിയയിൽ ഇല്ലാത്ത അധിക സൈനികഭാവം ചേർക്കുന്നില്ല.
- source_word: בָּעֵת הַהִוא
  choice: ആ കാലത്ത്
  rationale: പൂർവവിവരണത്തിലേക്കു വിരൽചൂണ്ടുന്ന സാധാരണ കാലസൂചകപ്രയോഗം; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: הָאָרֶץ
  choice: ദേശം
  rationale: ഇവിടെ אֶרֶץ ഭൂമി മുഴുവനെയല്ല, നിർവചിക്കപ്പെട്ട ഒരു പ്രദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ദേശം’ ആ അർഥം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: מִיַּד
  choice: കൈയിൽനിന്ന്
  rationale: മറ്റൊരാളുടെ കൈവശമോ നിയന്ത്രണമോ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലി കഴിയുന്നത്ര നിലനിർത്തുന്നു; മലയാളത്തിലും അർഥം വ്യക്തമാണ്.
- source_word: שְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: അമോര്യരുടെ രണ്ടു രാജാക്കന്മാർ
  rationale: എബ്രായത്തിലെ ബന്ധഘടന കൃത്യമായി പ്രതിഫലിപ്പിക്കുകയും മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: אֲשֶׁר בְּעֵבֶר הַיַּרְדֵּן
  choice: യോർദാനക്കരയിലുണ്ടായിരുന്ന
  rationale: ഭാഷകന്റെ സ്ഥാനത്തെ ആശ്രയിക്കുന്ന ‘യോർദാന്റെ മറുകര’ എന്ന ഭൂമിശാസ്ത്രപ്രയോഗം അനാവശ്യമായി ദിശ നിശ്ചയിക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מִנַּחַל אַרְנֹן
  choice: അർന്നോൻ തോടുമുതൽ
  rationale: נחל എന്നത് വാടി, നീരൊഴുക്ക്, തോട്, താഴ്വര എന്നിവയെ സൂചിപ്പിക്കാം. ‘തോട്’ മലയാളവായനക്കാർക്ക് സ്വാഭാവികമാണെങ്കിലും പദത്തിന്റെ ഭൂമിശാസ്ത്രപരമായ വ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: עַד הַר חֶרְמוֹן
  choice: ഹെർമ്മോൻ പർവതംവരെ
  rationale: עַד പ്രദേശത്തിന്റെ അതിർത്തിവ്യാപ്തി സൂചിപ്പിക്കുന്നു; ‘വരെ’ അത് വ്യക്തമായി നൽകുന്നു.
