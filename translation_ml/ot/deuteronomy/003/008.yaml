translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. എബ്രായത്തിലെ ‘കൈയിൽനിന്ന്’ എന്ന ദൃശ്യശൈലി നിലനിർത്തിയപ്പോൾ മുഖ്യക്രിയയിൽ സ്വാഭാവികമായ ‘കൈവശപ്പെടുത്തി’ ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് സൂചകം ബന്ധപ്പെട്ട അനിശ്ചിത പദമായ ‘അർന്നോൻ തോട്’ എന്നതിനുശേഷമാണ് നൽകിയിരിക്കുന്നത്.
