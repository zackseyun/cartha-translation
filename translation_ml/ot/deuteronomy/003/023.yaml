source:
  edition: WLC
  text: וָ/אֶתְחַנַּ֖ן אֶל יְהוָ֑ה בָּ/עֵ֥ת הַ/הִ֖וא לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/023.yaml
  text: And I pleaded with Yahweh at that time[a], saying,
translation:
  language: ml
  text: 'ആ സമയത്ത് ഞാൻ യാഹ്‌വെയോട്[a] ഇങ്ങനെ യാചിച്ചു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു: ‘YHWH’ (יהוה). പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്താറുണ്ട്; ‘യഹോവ’ എന്ന ലിപ്യന്തരണവും ഉപയോഗിക്കപ്പെടുന്നു.'
    reason: ദൈവനാമത്തിന്റെ പരമ്പരാഗത പരിഭാഷയും പകരം ലിപ്യന്തരണവും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וָאֶתְחַנַּן
  choice: ഞാൻ ... യാചിച്ചു
  rationale: חנן എന്ന ധാതുവിന്റെ ഹിത്പഅേൽ രൂപം കൃപയ്ക്കോ കരുണയ്ക്കോ വേണ്ടിയുള്ള ആത്മാർഥമായ അപേക്ഷയെ സൂചിപ്പിക്കുന്നു. ‘യാചിച്ചു’ അതിന്റെ തീവ്രത സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു; പ്രാരംഭ waw ആഖ്യാനത്തിലെ തുടർച്ചയായി സന്ദർഭത്തിൽ പ്രതിഫലിക്കുന്നു.
- source_word: אֶל
  choice: -യോട്
  rationale: അപേക്ഷയുടെ ദിശ യഹോവയിലേക്കാണെന്ന് മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗമായ ‘യഹോവയോട് യാചിച്ചു’ വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ഹീബ്രു ദൈവനാമമായ יהוה ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ദീർഘകാലമായി പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകിയിരിക്കുന്നു; സാധ്യതയുള്ള ‘യാഹ്‌വെ’ രൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: בָּעֵת הַהִוא
  choice: ആ സമയത്ത്
  rationale: കാലസൂചനയെ അധികമായി നിർവചിക്കാതെ ഹീബ്രു പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളസമാനത നൽകുന്നു.
- source_word: לֵאמֹר
  choice: ഇങ്ങനെ
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വാക്കുകളെ പരിചയപ്പെടുത്തുന്ന ഹീബ്രു സൂത്രവാക്യത്തിന്റെ പ്രവർത്തനം മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഇങ്ങനെ’ നിർവഹിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ; കർത്താവ്
  rationale: മൂലപാഠം ഒരു സ്ഥാനപ്പേരല്ല, നാലക്ഷര ദൈവനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ മലയാളവായനക്കാർക്ക് പരിചിതമായ നാമരൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തി; ഉച്ചാരണത്തിന്റെ അനിശ്ചിതത്വവും മറ്റൊരു ലിപ്യന്തരണവും അടിക്കുറിപ്പിൽ അറിയിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘യാചിച്ചു’ ആത്മാർഥമായ അപേക്ഷയുടെ ഭാവം കാത്തുസൂക്ഷിക്കുന്നു; അടുത്ത വാക്യത്തിലെ നേരിട്ടുള്ള പ്രസംഗത്തിലേക്കുള്ള ബന്ധത്തിനായി അവസാനം ഇരട്ടപ്പുള്ളി ഉപയോഗിച്ചു.
