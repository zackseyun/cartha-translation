language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶת יְהוֹשׁ֣וּעַ צִוֵּ֔יתִי בָּ/עֵ֥ת הַ/הִ֖וא לֵ/אמֹ֑ר עֵינֶ֣י/ךָ הָ/רֹאֹ֗ת אֵת֩ כָּל אֲשֶׁ֨ר עָשָׂ֜ה יְהוָ֤ה אֱלֹהֵי/כֶם֙ לִ/שְׁנֵי֙ הַ/מְּלָכִ֣ים הָ/אֵ֔לֶּה כֵּֽן יַעֲשֶׂ֤ה יְהוָה֙ לְ/כָל הַ/מַּמְלָכ֔וֹת אֲשֶׁ֥ר אַתָּ֖ה עֹבֵ֥ר שָֽׁמָּ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/021.yaml
  text: And I commanded Joshua at that time[a], saying, ‘Your eyes have seen all that Yahweh your God did to these two kings; so Yahweh will do to all the kingdoms through which you are passing.’
translation:
  language: ml
  text: 'അക്കാലത്ത് ഞാൻ യോശുവയോടു കല്പിച്ചു: “നിങ്ങളുടെ ദൈവമായ യഹോവ ഈ രണ്ടു രാജാക്കന്മാരോടും ചെയ്തതെല്ലാം നിന്റെ കണ്ണുകൾ കണ്ടിരിക്കുന്നു. നീ കടന്നുചെല്ലുന്ന എല്ലാ രാജ്യങ്ങളോടും[a] യഹോവ ഇതുപോലെതന്നെ ചെയ്യും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തോട് കൂടുതൽ അടുത്ത രൂപം: “നീ അങ്ങോട്ടു കടന്നുപോകുന്ന എല്ലാ രാജ്യങ്ങളോടും.”'
    reason: അവസാനത്തെ ഹീബ്രായ പ്രയോഗം അക്ഷരാർഥത്തിൽ ‘നീ അങ്ങോട്ടു കടന്നുപോകുന്ന’ എന്നാണ്; മുഖ്യപാഠത്തിൽ ലക്ഷ്യദിശ സ്വാഭാവികമായി ‘കടന്നുചെല്ലുന്ന’ എന്നു നൽകിയിരിക്കുന്നു.
lexical_decisions:
- source_word: וְאֶת יְהוֹשׁוּעַ צִוֵּיתִי
  choice: ഞാൻ യോശുവയോടു കല്പിച്ചു
  rationale: צוה അധികാരപൂർവമായ കല്പനയെയോ ചുമതലപ്പെടുത്തലിനെയോ സൂചിപ്പിക്കുന്നു; ‘കല്പിച്ചു’ ഇവിടെ നേരിട്ടും സ്വാഭാവികവുമാണ്.
- source_word: בָּעֵת הַהִוא
  choice: അക്കാലത്ത്
  rationale: ഹീബ്രായിലെ സാധാരണ കാലസൂചക പ്രയോഗം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പകർത്തുന്നു.
- source_word: עֵינֶיךָ הָרֹאֹת
  choice: നിന്റെ കണ്ണുകൾ കണ്ടിരിക്കുന്നു
  rationale: ‘നീ കണ്ടു’ എന്നു ലളിതമാക്കാതെ, നേരിട്ടുള്ള ദൃക്സാക്ഷിത്വത്തിന് ഊന്നൽ നൽകുന്ന ‘നിന്റെ കണ്ണുകൾ’ എന്ന ഹീബ്രായ ദൃശ്യരൂപം നിലനിർത്തുന്നു.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവമായ യഹോവ
  rationale: ദൈവനാമം ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു; אֱלֹהֵיכֶם എന്നതിലെ ബഹുവചന അഭിസംബോധനാസൂചകം നിലനിർത്താൻ ‘നിങ്ങളുടെ’ എന്നു നൽകി. ചുറ്റുമുള്ള ഏകവചന അഭിസംബോധന യോശുവയോടാണ്, എന്നാൽ ഇവിടെ ദൈവം യിസ്രായേൽജനത്തിന്റെ ദൈവമായി പരാമർശിക്കപ്പെടുന്നു.
- source_word: לִשְׁנֵי הַמְּלָכִים הָאֵלֶּה
  choice: ഈ രണ്ടു രാജാക്കന്മാരോടും
  rationale: ל ഇവിടെ യഹോവയുടെ പ്രവൃത്തിക്ക് വിധേയരായ രാജാക്കന്മാരെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിലെ വിരോധഭാവം അമിതമായി വ്യക്തമാക്കാതെ ‘-ഓടും’ ഉപയോഗിച്ചു.
- source_word: כֵּן יַעֲשֶׂה יְהוָה
  choice: യഹോവ ഇതുപോലെതന്നെ ചെയ്യും
  rationale: മുമ്പ് രണ്ടു രാജാക്കന്മാർക്കുണ്ടായതും ഇനി മറ്റു രാജ്യങ്ങൾക്കുണ്ടാകുന്നതും തമ്മിലുള്ള താരതമ്യം כֵּן സൂചിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר אַתָּה עֹבֵר שָׁמָּה
  choice: നീ കടന്നുചെല്ലുന്ന
  rationale: עבר എന്നതിലെ കടക്കൽഭാവവും שָׁמָּה എന്നതിലെ ലക്ഷ്യദിശയും സ്വാഭാവിക മലയാളത്തിൽ ഒരുമിച്ചു പ്രകടിപ്പിക്കുന്നു; ഏകവചനമായ ‘നീ’ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ നിയമനാമമായ ചതുരക്ഷരനാമം നേരിട്ട് വന്നതിനാൽ ഒരു സ്ഥാനപ്പേരിലേക്കു മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകി.
- issue: ഏകവചനവും ബഹുവചനവും കലർന്ന അഭിസംബോധന
  choice: ‘നിന്റെ കണ്ണുകൾ’ / ‘നിങ്ങളുടെ ദൈവം’
  alternative: രണ്ടിടത്തും ‘നിന്റെ’ എന്നു ഏകീകരിക്കുക
  rationale: ഹീബ്രായിൽ യോശുവയോടുള്ള ഏകവചന അഭിസംബോധനയ്ക്കിടയിൽ אֱלֹהֵיכֶם ബഹുവചനമാണ്. ഈ അർത്ഥവത്തായ വ്യത്യാസം മായ്ച്ചുകളയാതെ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘കല്പിച്ചു’, ‘കണ്ടിരിക്കുന്നു’, ‘ഇതുപോലെതന്നെ’ എന്നീ രൂപങ്ങൾ ഗൗരവം നിലനിർത്തുന്നു; എന്നാൽ അനാവശ്യമായി പുരാതനമോ കൃത്രിമമോ ആയ പദക്രമം ഒഴിവാക്കി.
