source:
  edition: WLC
  text: וַ/נֵּ֣פֶן וַ/נַּ֔עַל דֶּ֖רֶךְ הַ/בָּשָׁ֑ן וַ/יֵּצֵ֣א עוֹג֩ מֶֽלֶךְ הַ/בָּשָׁ֨ן לִ/קְרָאתֵ֜/נוּ ה֧וּא וְ/כָל עַמּ֛/וֹ לַ/מִּלְחָמָ֖ה אֶדְרֶֽעִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/001.yaml
  text: Then we turned and went up by the way of Bashan[a], and Og king of Bashan came out to meet us, he and all his people, for battle at Edrei.
translation:
  language: ml
  text: പിന്നെ ഞങ്ങൾ തിരിഞ്ഞ് ബാശാനിലേക്കുള്ള വഴിയിലൂടെ കയറിച്ചെന്നു.[a] അപ്പോൾ ബാശാൻരാജാവായ ഓഗ്, തന്റെ സകല ജനങ്ങളോടുംകൂടെ, എദ്രെയിൽ ഞങ്ങളെ നേരിടാൻ യുദ്ധത്തിനായി പുറത്തുവന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ബാശാന്റെ വഴിയിലൂടെ.’ ഹീബ്രായ പ്രയോഗത്തിന്റെ അക്ഷരാർഥം ‘ബാശാന്റെ വഴി’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֵּפֶן
  choice: പിന്നെ ഞങ്ങൾ തിരിഞ്ഞ്
  rationale: വയ്യക്ഷോൽ ആഖ്യാനക്രമത്തിലെ തുടർച്ച ‘പിന്നെ’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; פנה എന്ന ക്രിയയുടെ ‘തിരിയുക’ എന്ന അർഥവും നിലനിർത്തുന്നു.
- source_word: וַנַּעַל
  choice: കയറിച്ചെന്നു
  rationale: עלה എന്നതിലെ മുകളിലേക്കുള്ള ഗതിയുടെ സൂചന നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ സഞ്ചാരപ്രയോഗം നൽകുന്നു.
- source_word: דֶּרֶךְ הַבָּשָׁן
  choice: ബാശാനിലേക്കുള്ള വഴിയിലൂടെ
  rationale: പ്രദേശനാമത്തോടുകൂടിയ דרך ഇവിടെ ആ പ്രദേശത്തേക്കോ അതിലൂടെക്കോ നയിക്കുന്ന വഴിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ബാശാനിലേക്കുള്ള വഴിയിലൂടെ’ വ്യക്തവും സ്വാഭാവികവുമാണ്, എന്നാൽ മൂലഭാഷയിലെ ഘടനാപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: וַיֵּצֵא
  choice: പുറപ്പെട്ടുവന്നു
  rationale: יצא എന്നതിന്റെ ‘പുറപ്പെടുക/പുറത്തുവരുക’ എന്ന അടിസ്ഥാനാർഥവും സംസാരകന്റെ ദിശയിലേക്കുള്ള വരവും ഒരുമിച്ച് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ‘പടനയിച്ചു’ പോലുള്ള അധിക വ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: ബാശാൻരാജാവായ ഓഗ്
  rationale: ഹീബ്രായ നിർമാണബന്ധം മലയാളത്തിലെ സ്വാഭാവിക സ്ഥാനവിവരണമായി അവതരിപ്പിക്കുകയും വ്യക്തിനാമം ലിപ്യന്തരം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: לִקְרָאתֵנוּ
  choice: ഞങ്ങളോടു ... ചെയ്യാൻ
  rationale: לקראת എന്നത് അടിസ്ഥാനപരമായി ‘എതിരേൽക്കാൻ/കണ്ടുമുട്ടാൻ’ എന്നാണ്; പിന്നാലെയുള്ള യുദ്ധലക്ഷ്യത്തോടു ചേർത്തപ്പോൾ ‘ഞങ്ങളോടു യുദ്ധം ചെയ്യാൻ’ മലയാളത്തിൽ സ്വാഭാവികമായി അതേ സൈനികസന്ദർഭം നൽകുന്നു.
- source_word: הוּא וְכָל־עַמּוֹ
  choice: തന്റെ സകല ജനത്തോടുംകൂടെ
  rationale: עם എന്ന വിശാലമായ ‘ജനം’ എന്ന അർഥം നിലനിർത്തുന്നു; മൂലത്തിൽ വ്യക്തമല്ലാത്ത ‘സൈന്യം’ എന്ന ചുരുക്കിയ വ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
- source_word: לַמִּלְחָמָה
  choice: യുദ്ധം ചെയ്യാൻ
  rationale: ഒരു പ്രത്യേക ഏറ്റുമുട്ടലിൽ מלחמה സൂചിപ്പിക്കുന്ന യുദ്ധലക്ഷ്യം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֶדְרֶעִי
  choice: എദ്രെയിൽവെച്ച്
  rationale: വ്യക്തമായ ഉപസർഗം ഇല്ലെങ്കിലും വാക്യാന്തത്തിലെ സ്ഥലനാമം ഏറ്റുമുട്ടലിന്റെ സ്ഥലം സൂചിപ്പിക്കുന്ന ക്രിയാവിശേഷണമായി പ്രവർത്തിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘ജനം’ എന്ന മൂലപദത്തെ ‘സൈന്യം’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കിയിട്ടില്ല. സ്ഥലനാമങ്ങൾ ബാശാൻ, എദ്രെയ് എന്നും വ്യക്തിനാമം ഓഗ് എന്നും ലിപ്യന്തരം ചെയ്തു.
