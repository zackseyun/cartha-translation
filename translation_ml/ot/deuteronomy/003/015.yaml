  yaml_path: translation/ot/deuteronomy/003/015.yaml
  text: And to Machir I gave Gilead[a].
translation:
  language: ml
  text: മാഖീരിന് ഞാൻ ഗിലെയാദ് കൊടുത്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ നിർദിഷ്ട ഉപപദത്തോടുകൂടി ‘ഗിലെയാദ്’ എന്നാണ്; മലയാളത്തിൽ സ്ഥലനാമം സാധാരണയായി ‘ഗിലെയാദ്’ എന്നു മാത്രം പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/מָכִיר
  choice: മാഖീരിന്
  rationale: לְ എന്ന ഉപസർഗത്തിന്റെ സ്വീകർത്താവിനെ സൂചിപ്പിക്കുന്ന അർഥം മലയാളത്തിലെ ദത്തിവിഭക്തിയായ ‘-ന്’ സ്വാഭാവികമായി നൽകുന്നു. വാക്യം മുൻവിവരണത്തോട് ബന്ധിപ്പിക്കുന്ന וּ മലയാളത്തിൽ നിർബന്ധമായി വേറൊരു പദമായി നൽകാതെ തുടർച്ചയിലൂടെ സൂചിപ്പിക്കാം.
- source_word: נָתַתִּי
  choice: ഞാൻ ... കൊടുത്തു
  rationale: נתן എന്ന ക്രിയയുടെ കാൽ പെർഫെക്റ്റ് ഒന്നാംപുരുഷ ഏകവചനരൂപം ഭൂതകാലത്തിലെ പൂർത്തിയായ പ്രവൃത്തിയായി നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: אֶת
  choice: '[നേരിട്ടുള്ള കർമസൂചകം; പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല]'
  rationale: നിശ്ചിത നേരിട്ടുള്ള കർമത്തെ അടയാളപ്പെടുത്തുന്ന വ്യാകരണകണം; മലയാളത്തിൽ ഇതിന് സ്വതന്ത്ര പദസമാനത ആവശ്യമില്ല.
- source_word: הַגִּלְעָד
  choice: ഗിലെയാദ്
  rationale: സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്തു. എബ്രായത്തിലെ നിർദിഷ്ട ഉപപദം മലയാളത്തിലെ സ്ഥാപിത സ്ഥലനാമത്തിനു മുമ്പിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കേണ്ടതില്ല; എന്നാൽ അതിന്റെ സാന്നിധ്യം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
