translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായ വാക്യക്രമത്തെ കഴിയുന്നത്ര നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ സ്വാഭാവിക ദത്തിവിഭക്തിയും ഭൂതകാലക്രിയയും ഉപയോഗിച്ചു.
