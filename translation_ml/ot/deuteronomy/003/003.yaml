source:
  edition: WLC
  text: וַ/יִּתֵּן֩ יְהוָ֨ה אֱלֹהֵ֜י/נוּ בְּ/יָדֵ֗/נוּ גַּ֛ם אֶת ע֥וֹג מֶֽלֶךְ הַ/בָּשָׁ֖ן וְ/אֶת כָּל עַמּ֑/וֹ וַ/נַּכֵּ֕/הוּ עַד בִּלְתִּ֥י הִשְׁאִֽיר ל֖/וֹ שָׂרִֽיד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/003.yaml
  text: So Yahweh our God also gave into our hand Og king of Bashan[a], and all his people, and we struck him down until he had no survivor left.
translation:
  language: ml
  text: നമ്മുടെ ദൈവമായ യഹ്‌വെ ബാശാനിലെ രാജാവായ ഓഗിനെയും അവന്റെ സകല ജനത്തെയും കൂടി നമ്മുടെ കയ്യിൽ ഏല്പിച്ചു. അവനു ഒരു അതിജീവിതനും ശേഷിക്കാതിരുന്നതുവരെ നാം അവനെ അടിച്ചുതോല്പിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തോട് കൂടുതൽ അടുത്ത്: “അവനു ഒരു അതിജീവിതനും ശേഷിക്കാതിരുന്നതുവരെ നാം അവനെ പ്രഹരിച്ചു.”'
    reason: എബ്രായത്തിലെ ഏകവചന കർമപ്രത്യയമായ “അവനെ”യും לוֹ (“അവനു”) എന്ന ഘടകവും കൂടുതൽ നേരിട്ട് കാണിക്കുന്ന പകരം പരിഭാഷ.
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ ഉച്ചാരണസഹായകമായി ലിപ്യന്തരിച്ചു.
- source_word: וַיִּתֵּן
  choice: ഏല്പിച്ചു
  rationale: נתן എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘കൊടുത്തു’ എന്നാണെങ്കിലും, യുദ്ധസന്ദർഭത്തിൽ ‘കയ്യിൽ ഏല്പിച്ചു’ എന്നത് സ്വാഭാവികമായി അധികാരത്തിനുള്ളിൽ കൊടുക്കുക എന്ന അർഥം അറിയിക്കുന്നു.
- source_word: בְּיָדֵנוּ
  choice: നമ്മുടെ കയ്യിൽ
  rationale: എബ്രായയിലെ ഏകവചനമായ ‘കൈ’യും സൈനികവിജയത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: גַּם
  choice: -നെയും
  rationale: മുൻപ് പറഞ്ഞ സീഹോന്റെ പരാജയത്തോടു ഓഗിന്റെ പരാജയവും കൂട്ടിച്ചേർക്കുന്ന അർഥം മലയാളത്തിലെ സമുച്ചയപ്രത്യയം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: ബാശാൻരാജാവായ ഓഗ്
  rationale: വ്യക്തിനാമവും ഭരണപ്രദേശവും രാജപദവിയും വ്യക്തമായ, സ്വാഭാവിക മലയാളക്രമത്തിൽ നൽകി.
- source_word: כָּל עַמּוֹ
  choice: അവന്റെ സകല ജനത്തെയും
  rationale: עַם എന്നത് ‘സൈന്യം’ എന്നതിലുമധികം വ്യാപകമായ ‘ജനം’ എന്ന അർഥമുള്ളതിനാൽ അതിന്റെ പരിധി ചുരുക്കിയില്ല.
- source_word: וַנַּכֵּהוּ
  choice: നാം അവരെ സംഹരിച്ചു
  rationale: נכה യുദ്ധസന്ദർഭത്തിൽ ആക്രമിച്ചു വീഴ്ത്തുക/പരാജയപ്പെടുത്തുക എന്ന ശക്തമായ അർഥം നൽകുന്നു. പിന്നാലെയുള്ള അതിജീവിതരില്ലാത്ത സമ്പൂർണനാശത്തിന്റെ പ്രസ്താവനയുമായി ‘സംഹരിച്ചു’ യോജിക്കുന്നു; ഏകവചനപ്രത്യയത്തിൽ ഓഗ് അവന്റെ ജനത്തെ പ്രതിനിധീകരിക്കുന്നു.
- source_word: עַד בִּלְתִּי הִשְׁאִיר לוֹ שָׂרִיד
  choice: അവനുവേണ്ടി ഒരൊറ്റ അതിജീവിതൻപോലും ശേഷിക്കാതിരുന്നതുവരെ
  rationale: ‘അവനു വേണ്ടി/അവനോട്’ എന്ന לוֹ ഘടകം നിലനിർത്തിക്കൊണ്ട്, ഒരാളും ശേഷിച്ചില്ലെന്ന ഫലത്തെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: ദൈവത്തിന്റെ വെളിപ്പെടുത്തപ്പെട്ട വ്യക്തിനാമത്തെ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: പരാജയത്തിന്റെ വ്യാപ്തി
  choice: ഒരൊറ്റ അതിജീവിതൻപോലും ശേഷിക്കാതിരുന്നതുവരെ
  alternative: അവന് ഒരു ശേഷിപ്പും ശേഷിക്കാതിരുന്നതുവരെ
  rationale: സമ്പൂർണമായ സൈനികനാശത്തെക്കുറിച്ചുള്ള എബ്രായവാചകത്തിന്റെ കാഠിന്യം വ്യാഖ്യാനപരമായ മൃദൂകരണം കൂടാതെ നിലനിർത്തുന്നു.
- issue: וַנַּכֵּהוּ എന്ന ഏകവചന കർമപ്രത്യയം
  choice: നാം അവരെ സംഹരിച്ചു
  alternative: നാം അവനെ സംഹരിച്ചു
  rationale: മുൻപുള്ള ഓഗിനെയും അവന്റെ സകല ജനത്തെയും എന്ന സംയുക്ത കർമത്തെ മലയാളത്തിൽ വ്യക്തമായി തിരിച്ചെടുക്കാൻ ബഹുവചനം ഉപയോഗിച്ചു; എബ്രായത്തിലെ ഏകവചനം ഓഗിനെ പ്രതിനിധിപരമായി കാണുന്നുവെന്ന വിവരം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ സാധാരണ മലയാളം. ‘നമ്മുടെ കയ്യിൽ ഏല്പിച്ചു’ എന്ന ബൈബിൾസഹജമായ പ്രയോഗം സ്രോതസ്സിലെ രൂപകം നിലനിർത്തുന്നു. മുഖ്യവാചകത്തിലെ ബഹുവചനം മലയാളത്തിൽ കർമസൂചന വ്യക്തമാക്കുന്നു; എബ്രായത്തിലെ ഏകവചനരൂപം അടിക്കുറിപ്പിൽ നൽകിയിട്ടുണ്ട്.
