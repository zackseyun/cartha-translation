reference: Deuteronomy 3:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/נַּחֲרֵ֣ם אוֹתָ֔/ם כַּ/אֲשֶׁ֣ר עָשִׂ֔ינוּ לְ/סִיחֹ֖ן מֶ֣לֶךְ חֶשְׁבּ֑וֹן הַחֲרֵם֙ כָּל עִ֣יר מְתִ֔ם הַ/נָּשִׁ֖ים וְ/הַ/טָּֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/006.yaml
  text: And we devoted them to destruction[a], just as we had done to Sihon king of Heshbon, utterly destroying every city—men, women, and little ones.
translation:
  language: ml
  text: നാം ഹെശ്ബോൻ രാജാവായ സീഹോനോടു ചെയ്തതുപോലെ അവരെയും നാശത്തിനായി സമർപ്പിച്ചു[a]; ഓരോ പട്ടണവും—പുരുഷന്മാരെയും സ്ത്രീകളെയും കുഞ്ഞുങ്ങളെയും—പൂർണമായി നശിപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നാശത്തിനായി മാറ്റിവെച്ചു.’ എബ്രായത്തിലെ חרם എന്ന ക്രിയ എന്തെങ്കിലും അല്ലെങ്കിൽ ആരെയെങ്കിലും നാശത്തിനായി സമർപ്പിക്കുകയോ മാറ്റിവെക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക പദമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנַּחֲרֵם
  choice: നാശത്തിനായി സമർപ്പിച്ചു
  rationale: חרם എന്ന സാങ്കേതിക പദത്തിന്റെ ‘നശിപ്പിക്കപ്പെടേണ്ടതായി സമർപ്പിക്കുക’ എന്ന ആശയം നിലനിർത്തുന്നു; വെറും ‘നശിപ്പിച്ചു’ എന്നതിനെക്കാൾ മൂലഭാഷയിലെ പ്രത്യേക അർഥം വ്യക്തമാക്കുന്നു.
- source_word: כַּאֲשֶׁר עָשִׂינוּ לְסִיחֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: നാം ഹെശ്ബോൻരാജാവായ സീഹോനോടു ചെയ്തതുപോലെ
  rationale: മുമ്പ് സീഹോനോടു ചെയ്ത നടപടിയുമായുള്ള താരതമ്യം സ്വാഭാവികമായ മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: הַחֲרֵם
  choice: പൂർണമായി നശിപ്പിച്ചു
  rationale: ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ട് മുൻപത്തെ חרם ക്രിയയുടെ സമ്പൂർണതയും തീവ്രതയും വ്യക്തമാക്കുന്നു.
- source_word: כָּל עִיר
  choice: ഓരോ പട്ടണവും
  rationale: עיר എന്നത് സന്ദർഭത്തിൽ പട്ടണം/നഗരം എന്നർഥം നൽകുന്നു; ‘ഓരോ പട്ടണവും’ സമഗ്രത വ്യക്തമാക്കുന്ന സ്വാഭാവിക പ്രയോഗമാണ്.
- source_word: מְתִם
  choice: പുരുഷന്മാരെ
  rationale: സ്ത്രീകളും കുഞ്ഞുങ്ങളും എന്ന തുടർന്നുള്ള വിഭാഗങ്ങളിൽനിന്നു വേർതിരിച്ചുള്ള പുരുഷവ്യക്തികളെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; അതിനെ ‘ജനവാസമുള്ള’ എന്ന വിശേഷണമായി മാറ്റുന്നില്ല.
- source_word: הַנָּשִׁים
  choice: സ്ത്രീകളെ
  rationale: നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ തുല്യപദം.
- source_word: וְהַטָּף
  choice: കുഞ്ഞുങ്ങളെയും
  rationale: טף പ്രധാനമായി ചെറിയ കുട്ടികളെ സൂചിപ്പിക്കുന്നു; വിശാലമായ ‘മക്കൾ’ എന്നതിനെക്കാൾ പ്രായസൂചന നിലനിർത്തുന്നു.
theological_decisions:
- issue: യുദ്ധവിധിയുടെ പശ്ചാത്തലത്തിലുള്ള חרם ഭാഷയുടെ പരിഭാഷ
  choice: മുഖ്യവാക്യത്തിൽ ‘നാശത്തിനായി സമർപ്പിച്ചു’ എന്നും വിശദീകരിക്കുന്ന ഘടകത്തിൽ ‘പൂർണമായി നശിപ്പിച്ചു’ എന്നും നൽകി.
  alternative: ‘പൂർണമായി നശിപ്പിച്ചു’ മാത്രം; ‘നാശശാപത്തിന് ഏല്പിച്ചു’
  rationale: മൂലപദത്തിന്റെ സാങ്കേതിക സ്വഭാവവും സംഭവത്തിന്റെ കഠിനമായ സമ്പൂർണ നാശവും ഒരുപോലെ നിലനിർത്തുന്നു; ഭാഷയെ മൃദൂകരിക്കുകയോ പ്രത്യേക സിദ്ധാന്തപരമായ വ്യാഖ്യാനം ചേർക്കുകയോ ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. പുരുഷന്മാർ, സ്ത്രീകൾ, കുഞ്ഞുങ്ങൾ എന്ന മൂലഭാഷയിലെ വ്യക്തമായ ത്രയം സംരക്ഷിച്ചിരിക്കുന്നു.
