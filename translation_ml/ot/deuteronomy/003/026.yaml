id: DEU.3.26
reference: Deuteronomy 3:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּתְעַבֵּ֨ר יְהוָ֥ה בִּ/י֙ לְמַ֣עַנְ/כֶ֔ם וְ/לֹ֥א שָׁמַ֖ע אֵלָ֑/י וַ/יֹּ֨אמֶר יְהוָ֤ה אֵלַ/י֙ רַב לָ֔/ךְ אַל תּ֗וֹסֶף דַּבֵּ֥ר אֵלַ֛/י ע֖וֹד בַּ/דָּבָ֥ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/026.yaml
  text: But Yahweh was angry with me because of you and did not listen to me[a], and Yahweh said to me, “Enough from you[b]; do not speak to me again about this matter.”
translation:
  language: ml
  text: 'എന്നാൽ, നിങ്ങൾ നിമിത്തം[a] യാഹ്‌വേ എന്നോടു കോപിച്ചു; എന്റെ വാക്കു കേട്ടില്ല. യാഹ്‌വേ എന്നോടു പറഞ്ഞു: “നിനക്കു മതി![b] ഈ കാര്യത്തെക്കുറിച്ച് ഇനി എന്നോടു സംസാരിക്കരുത്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങൾക്കുവേണ്ടി” / “നിങ്ങളുടെ കാരണത്താൽ.”
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ “നിനക്കു മതി”; കർശനമായി സംസാരണം അവസാനിപ്പിക്കുന്ന പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְעַבֵּר
  choice: കോപിച്ചു
  rationale: ഈ ഹിത്പയേൽ പ്രയോഗം യഹോവ ഒരാളോടു കോപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘കോപിച്ചു’ സ്വാഭാവികവും മൂലത്തിലെ ശക്തി അതിരുകടക്കാതെ നിലനിർത്തുന്നതുമാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ‘യഹോവ’ എന്ന ലിപ്യന്തരണത്തിലൂടെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- source_word: בִּי
  choice: എന്നോടു
  rationale: കോപത്തെ സൂചിപ്പിക്കുന്ന മലയാളപ്രയോഗത്തിൽ ‘എന്നോടു കോപിച്ചു’ സ്വാഭാവികമാണ്.
- source_word: לְמַעַנְכֶם
  choice: നിങ്ങൾ നിമിത്തം
  rationale: സന്ദർഭത്തിൽ ജനമാണ് മോശെയോടുള്ള യഹോവയുടെ കോപത്തിനു കാരണമായതെന്ന് ഈ പദം സൂചിപ്പിക്കുന്നു. ‘നിങ്ങൾ നിമിത്തം’ കാരണാർഥവും ‘നിങ്ങൾക്കുവേണ്ടി’ എന്ന സാധ്യതയും ഭാഗികമായി തുറന്നുവയ്ക്കുന്നു.
- source_word: וְלֹא שָׁמַע אֵלָי
  choice: എന്റെ അപേക്ഷ ചെവിക്കൊണ്ടില്ല
  rationale: ശמע + אֶל ഇവിടെ വെറും ശബ്ദം കേൾക്കുന്നതല്ല, മോശെയുടെ അപേക്ഷ അംഗീകരിക്കാതിരുന്നതാണ്. സന്ദർഭം വ്യക്തമാക്കാൻ ‘അപേക്ഷ’ ചേർത്തിരിക്കുന്നു.
- source_word: רַב לָךְ
  choice: മതി!
  rationale: ‘നിനക്കു മതി’ എന്ന അക്ഷരാർഥമുള്ള ചുരുക്കപ്രയോഗം ഇവിടെ കർശനമായി സംഭാഷണം അവസാനിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘മതി!’ അതിന്റെ സ്വാഭാവിക ശക്തി നൽകുന്നു.
- source_word: אַל תּוֹסֶף דַּבֵּר ... עוֹד
  choice: ഇനി ... സംസാരിക്കരുത്
  rationale: יסף എന്ന ആവർത്തന/തുടർച്ചാഭാവവും עוֹד എന്ന ‘ഇനി’ എന്ന ആശയവും മലയാളത്തിലെ ഏകീകൃത നിരോധനപ്രയോഗത്തിലൂടെ നൽകുന്നു.
- source_word: בַּדָּבָר הַזֶּה
  choice: ഈ കാര്യത്തെക്കുറിച്ച്
  rationale: ഇവിടെ דָּבָר മോശെയുടെ അഭ്യർഥന എന്ന ചർച്ചാവിഷയത്തെ സൂചിപ്പിക്കുന്നു; ‘കാര്യം’ ആ അർഥത്തിൽ സ്വാഭാവികമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ സംരക്ഷിക്കുന്നു. ആധുനിക പണ്ഡിതലിപ്യന്തരണം ‘യാഹ്‌വേ’ ആണെങ്കിലും മലയാള ബൈബിൾഭാഷയിൽ സാധാരണക്കാർക്കു സുപരിചിതമായ ‘യഹോവ’ തെരഞ്ഞെടുത്തു.
- issue: לְמַעַנְכֶם എന്നതിലെ കാരണവും പ്രയോജനാർഥവും
  choice: നിങ്ങൾ നിമിത്തം
  alternative: നിങ്ങൾക്കുവേണ്ടി / നിങ്ങളുടെ കാരണത്താൽ
  rationale: സന്ദർഭം കാരണാർഥത്തെ പിന്തുണയ്ക്കുന്നു; എന്നാൽ എബ്രായപ്രയോഗത്തിന് ‘നിങ്ങൾക്കുവേണ്ടി’ എന്ന അർഥസാധ്യതയുമുള്ളതിനാൽ അടിക്കുറിപ്പിൽ അത് നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. നേരിട്ടുള്ള ദൈവവചനത്തിന്റെ കർശനത ‘മതി!’ എന്ന ചുരുക്കരൂപത്തിൽ നിലനിർത്തി; പഴഞ്ചൻ വാക്യഘടനകൾ ഒഴിവാക്കി.
