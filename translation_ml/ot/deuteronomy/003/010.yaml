  text: כֹּ֣ל עָרֵ֣י הַ/מִּישֹׁ֗ר וְ/כָל הַ/גִּלְעָד֙ וְ/כָל הַ/בָּשָׁ֔ן עַד סַלְכָ֖ה וְ/אֶדְרֶ֑עִי עָרֵ֛י מַמְלֶ֥כֶת ע֖וֹג בַּ/בָּשָֽׁן׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/010.yaml
  text: all the cities of the tableland[a], and all Gilead, and all Bashan, as far as Salecah and Edrei[b], the cities of the kingdom of Og in Bashan.
translation:
  language: ml
  text: പീഠഭൂമിയിലെ എല്ലാ പട്ടണങ്ങളും[a], ഗിലെയാദ് മുഴുവനും, ബാശാൻ മുഴുവനും, സൽഖാവരെയും എദ്രെയിവരെയും—ബാശാനിലെ ഓഗിന്റെ രാജ്യത്തിലെ പട്ടണങ്ങൾ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പീഠഭൂമി’ എന്നതിന് ‘സമതലം’ അല്ലെങ്കിൽ ‘ഉയർന്ന സമതലപ്രദേശം’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം യോർദ്ദാനു കിഴക്കുള്ള നിരപ്പായ ഉയർന്ന പ്രദേശത്തെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל עָרֵי הַמִּישֹׁר
  choice: പീഠഭൂമിയിലെ എല്ലാ പട്ടണങ്ങളും
  rationale: מִישׁוֹר ഇവിടെ യോർദ്ദാനു കിഴക്കുള്ള ഉയർന്ന നിരപ്പായ ഭൂപ്രദേശത്തെ സൂചിപ്പിക്കുന്നു. ‘പീഠഭൂമി’ ഭൂപ്രകൃതിയുടെ ഈ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; כֹּל עָרֵי എന്നതിന്റെ സമഗ്രത ‘എല്ലാ പട്ടണങ്ങളും’ എന്നു നിലനിർത്തുന്നു.
- source_word: וְכָל הַגִּלְעָד
  choice: ഗിലെയാദ് മുഴുവനും
  rationale: പ്രദേശനാമം ലിപ്യന്തരണം ചെയ്യുകയും כֹּל എന്ന സമഗ്രത ‘മുഴുവനും’ എന്നു സ്വാഭാവികമായി നൽകുകയും ചെയ്തു.
- source_word: וְכָל הַבָּשָׁן
  choice: ബാശാൻ മുഴുവനും
  rationale: പ്രദേശനാമം ലിപ്യന്തരണം ചെയ്തു; ആവർത്തിക്കുന്ന כֹּל ഒഴിവാക്കാതെ ‘മുഴുവനും’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: עַד סַלְכָה וְאֶדְרֶעִי
  choice: സൽഖായും എദ്രെയിയുംവരെ
  rationale: עַד ഭൂമിശാസ്ത്രപരമായ വ്യാപ്തിയുടെ അതിരിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘വരെ’ എന്നു നൽകി; സ്ഥലനാമങ്ങൾ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു.
- source_word: עָרֵי מַמְלֶכֶת עוֹג בַּבָּשָׁן
  choice: ബാശാനിലെ ഓഗിന്റെ രാജ്യത്തിലെ പട്ടണങ്ങൾ
  rationale: എബ്രായത്തിലെ ബന്ധശൃംഖലയും בַּבָּשָׁן എന്ന സ്ഥലസൂചനയും സുതാര്യമായി നിലനിർത്തുന്നു. മുൻപുള്ള പട്ടികയെ വിശദീകരിക്കുന്ന അനുബന്ധപ്രയോഗമാണെന്നത് ഡാഷ് ഉപയോഗിച്ച് വ്യക്തമാക്കി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ഭൂമിശാസ്ത്ര-വിവരണശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ പട്ടികാസ്വഭാവവും ആവർത്തനവും നിലനിർത്തി; അവസാന പ്രയോഗത്തിന്റെ അനുബന്ധസ്വഭാവം ഡാഷിലൂടെ വായനാസൗകര്യത്തോടെ പ്രകടമാക്കി. ഇംഗ്ലീഷിലെ ലിപ്യന്തരഭേദത്തെക്കുറിച്ചുള്ള കുറിപ്പ് മലയാളവായനയ്ക്ക് പ്രസക്തമല്ലാത്തതിനാൽ ചേർത്തില്ല.
