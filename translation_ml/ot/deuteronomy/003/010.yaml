  source_fidelity: 'The draft accurately represents the full territorial catalogue: the cities of the mishor, all Gilead, all Bashan, the extent to Salecah and Edrei, and the appositional identification as cities of Og’s kingdom in Bashan. ‘പീഠഭൂമി’ is a defensible rendering of הַמִּישֹׁר, and the explanatory footnote appropriately preserves the lexical range.'
