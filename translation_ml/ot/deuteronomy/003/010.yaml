  revised_text: പീഠഭൂമിയിലെ എല്ലാ പട്ടണങ്ങളും[a], ഗിലെയാദ് മുഴുവനും, ബാശാൻ മുഴുവനും, സൽഖാവരെയും എദ്രെയിവരെയും—ബാശാനിലെ ഓഗിന്റെ രാജ്യത്തിലെ പട്ടണങ്ങൾ.
