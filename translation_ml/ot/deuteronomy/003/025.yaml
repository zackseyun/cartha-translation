id: DEU.3.25
reference: Deuteronomy 3:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֶעְבְּרָה נָּ֗א וְ/אֶרְאֶה֙ אֶת הָ/אָ֣רֶץ הַ/טּוֹבָ֔ה אֲשֶׁ֖ר בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֑ן הָ/הָ֥ר הַ/טּ֛וֹב הַ/זֶּ֖ה וְ/הַ/לְּבָנֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/025.yaml
  text: Please let me cross over and see the good land that is beyond the Jordan[a], this good hill country and Lebanon.
translation:
  language: ml
  text: ദയവായി ഞാൻ അക്കരെ കടന്ന് യോർദ്ദാനപ്പുറത്തുള്ള ആ നല്ല ദേശം—ഈ നല്ല മലനാടും[a] ലെബാനോനും—കാണട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഈ നല്ല മല.’ എബ്രായപദം ഒരു പ്രത്യേക മലയെയോ യോർദ്ദാന്റെ പടിഞ്ഞാറുള്ള മലമ്പ്രദേശത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעְבְּרָה נָּא
  choice: ദയവായി ഞാൻ അക്കരെ കടന്ന് ... കാണട്ടെ
  rationale: ഒന്നാംപുരുഷ cohortative രൂപവും അപേക്ഷയെ മയപ്പെടുത്തുന്ന נָא എന്ന കണികയും ചേർന്നുള്ള യാചനാഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: וְאֶרְאֶה
  choice: കാണട്ടെ
  rationale: ആദ്യ cohortative ക്രിയയോടു ചേർന്ന ആഗ്രഹവും ഉദ്ദേശ്യവും മലയാളത്തിലെ ഏകീകൃത വാക്യഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: הָאָרֶץ הַטּוֹבָה
  choice: ആ നല്ല ദേശം
  rationale: ആവർത്തനപുസ്തകത്തിലെ ഭൂപ്രദേശപരവും ഉടമ്പടിസംബന്ധവുമായ പ്രയോഗത്തിന് ‘നല്ല ദേശം’ യോജിക്കുന്നു.
- source_word: אֲשֶׁר בְּעֵבֶר הַיַּרְדֵּן
  choice: യോർദ്ദാനപ്പുറത്തുള്ള
  rationale: മോശെ നിൽക്കുന്ന കിഴക്കൻ വശത്തുനിന്ന് നദിയുടെ മറുവശത്തുള്ള പ്രദേശം എന്ന ദൃഷ്ടികോണം ചുരുക്കമായും വ്യക്തമായും നൽകുന്നു.
- source_word: הָהָר הַטּוֹב הַזֶּה
  choice: ഈ നല്ല മലനാട്
  rationale: הָר എന്ന ഏകവചനത്തിന് ഒരു പ്രത്യേക മല മാത്രമല്ല, മലമ്പ്രദേശത്തെയും സൂചിപ്പിക്കാം; സന്ദർഭത്തിൽ പ്രാദേശിക അർത്ഥം സ്വാഭാവികമാണ്.
- source_word: וְהַלְּבָנוֹן
  choice: ലെബാനോനും
  rationale: സ്ഥലനാമം മലയാളത്തിലെ പതിവുരൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു; മുൻപുള്ള ദേശവിവരണത്തോടുള്ള ബന്ധം സംയോജകപ്രത്യയം നിലനിർത്തുന്നു.
theological_decisions:
- issue: הָהָר എന്ന പദത്തിന്റെ ഭൂമിശാസ്ത്രപരമായ അർത്ഥം
  choice: ഈ നല്ല മലനാട്
  alternative: ഈ നല്ല മല
  rationale: എബ്രായ ഏകവചനം ഒരു മലമ്പ്രദേശത്തെ കൂട്ടായ അർത്ഥത്തിൽ സൂചിപ്പിക്കാം. ലെബാനോനോടൊപ്പം ദേശത്തെ വിവരിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘മലനാട്’ കൂടുതൽ സാധ്യതയുള്ള വായനയാണ്; എങ്കിലും പ്രത്യേക മലയെന്ന യഥാർഥ ഭാഷാപരമായ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ അപേക്ഷാഭാവം ഉപയോഗിച്ചു. ദേശത്തിന്റെ ഘടകങ്ങളെ വിശദീകരിക്കുന്ന appositional ബന്ധം ദീർഘവരകളാൽ വ്യക്തമാക്കി; എബ്രായത്തിലെ ഭൂമിശാസ്ത്രപരമായ ദ്വയാർഥത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
