source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֵלַ/י֙ אַל תִּירָ֣א אֹת֔/וֹ כִּ֣י בְ/יָדְ/ךָ֞ נָתַ֧תִּי אֹת֛/וֹ וְ/אֶת כָּל עַמּ֖/וֹ וְ/אֶת אַרְצ֑/וֹ וְ/עָשִׂ֣יתָ לּ֔/וֹ כַּ/אֲשֶׁ֣ר עָשִׂ֗יתָ לְ/סִיחֹן֙ מֶ֣לֶךְ הָֽ/אֱמֹרִ֔י אֲשֶׁ֥ר יוֹשֵׁ֖ב בְּ/חֶשְׁבּֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/002.yaml
  text: And Yahweh said to me, “Do not fear him, for I have given him, all his people, and his land into your hand; and you shall do to him just as you did to Sihon king of the Amorites, who lived in Heshbon.”
translation:
  language: ml
  text: 'യഹ്‌വെ എന്നോടു പറഞ്ഞു: “അവനെ ഭയപ്പെടേണ്ടാ; അവനെയും അവന്റെ സകല ജനത്തെയും അവന്റെ ദേശത്തെയും ഞാൻ നിന്റെ കയ്യിൽ ഏല്പിച്ചിരിക്കുന്നു. ഹെശ്ബോനിൽ പാർത്തിരുന്ന അമോര്യരുടെ രാജാവായ സീഹോനോടു നീ ചെയ്തതുപോലെതന്നെ അവനോടും ചെയ്യണം.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ ഉടമ്പടിനാമം പൊതുവായ സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, എബ്രായനാമത്തിന്റെ പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: אַל תִּירָא אֹתוֹ
  choice: അവനെ ഭയപ്പെടേണ്ടാ
  rationale: നിഷേധാത്മക കല്പനയും എബ്രായത്തിൽ വ്യക്തമായി നൽകിയിരിക്കുന്ന കർമവും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: בְיָדְךָ נָתַתִּי
  choice: ഞാൻ നിന്റെ കയ്യിൽ ഏല്പിച്ചിരിക്കുന്നു
  rationale: അധികാരത്തിലേക്കുള്ള കൈമാറ്റം സൂചിപ്പിക്കുന്ന ‘കയ്യിൽ’ എന്ന ഉറവിടഭാഷയിലെ ദൃശ്യരൂപം നിലനിർത്തുന്നു; പൂർത്തിയായതായി പ്രഖ്യാപിക്കുന്ന ക്രിയയുടെ ഇപ്പോഴത്തെ ഫലവും ‘ഏല്പിച്ചിരിക്കുന്നു’ വ്യക്തമാക്കുന്നു.
- source_word: וְאֶת כָּל עַמּוֹ וְאֶת אַרְצוֹ
  choice: അവന്റെ സകല ജനത്തെയും അവന്റെ ദേശത്തെയും
  rationale: עַם എന്നതിനെ ‘സൈന്യം’ എന്ന് ചുരുക്കാതെ മുഴുവൻ ജനതയെന്ന വ്യാപ്തിയോടെ പരിഭാഷപ്പെടുത്തി; אֶרֶץ എന്നതിന് സന്ദർഭോചിതമായി ‘ദേശം’ ഉപയോഗിച്ചു.
- source_word: וְעָשִׂיתָ לּוֹ
  choice: അവനോടും ചെയ്യണം
  rationale: עשה എന്ന വിശാലാർഥമുള്ള ക്രിയയെ അനാവശ്യമായി വിശദീകരിക്കാതെ നിലനിർത്തുന്നു; ചെയ്യേണ്ടതിന്റെ സ്വഭാവം തുടർന്നുള്ള താരതമ്യത്തിൽനിന്ന് വ്യക്തമാകുന്നു.
- source_word: כַּאֲשֶׁר עָשִׂיתָ
  choice: ചെയ്തതുപോലെതന്നെ
  rationale: താരതമ്യത്തിന്റെ കൃത്യമായ സമാനത ‘പോലെതന്നെ’ എന്ന പ്രയോഗത്തിലൂടെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לְסִיחֹן מֶלֶךְ הָאֱמֹרִי
  choice: അമോര്യരുടെ രാജാവായ സീഹോനോടു
  rationale: രാജാവിനെയും ജനവിഭാഗത്തെയും തമ്മിലുള്ള ബന്ധം വ്യക്തമായി സൂക്ഷിക്കുന്ന, മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണഘടന ഉപയോഗിച്ചു.
- source_word: אֲשֶׁר יוֹשֵׁב בְּחֶשְׁבּוֹן
  choice: ഹെശ്ബോനിൽ പാർത്തിരുന്ന
  rationale: ישב എന്ന കൃതന്തത്തിന്റെ താമസിക്കുക/പാർക്കുക എന്ന അർഥം നിലനിർത്തി; മുൻകാല രാജാവിനെക്കുറിച്ചുള്ള വിവരണമായതിനാൽ ‘പാർത്തിരുന്ന’ എന്ന് നൽകി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ ചതുരക്ഷര ദൈവനാമം നേരിട്ട് വരുന്നതിനാൽ അതിനെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ പേരായി സംരക്ഷിച്ചു; ‘യഹ്‌വെ’ എന്ന രൂപം ഹീബ്രു നാമത്തിന്റെ സാധാരണ പണ്ഡിതോചിത ഉച്ചാരണത്തെ മലയാളത്തിൽ പ്രതിനിധീകരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എബ്രായത്തിലെ ‘കയ്യിൽ’ എന്ന രൂപകം നിലനിർത്തിയെങ്കിലും ‘ഏല്പിച്ചിരിക്കുന്നു’ എന്ന സ്വാഭാവിക ക്രിയയുമായി ചേർത്തു. വാക്യത്തിന്റെ യുദ്ധസന്ദർഭം മറച്ചുവയ്ക്കാതെയും മൂലപാഠം പറയുന്നതിലധികം അക്രമവിവരം ചേർക്കാതെയും עשה എന്ന ക്രിയയുടെ വിശാലത സംരക്ഷിച്ചു.
