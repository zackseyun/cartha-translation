translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. വാക്യത്തിന്റെ സ്ഥലനാമപരമായ സമാന്തരഘടന നിലനിർത്തി; വിവർത്തനത്തിൽ അനാവശ്യമായി ‘ഹെർമ്മോൻ പർവതം’ ചേർത്തിട്ടില്ല.
