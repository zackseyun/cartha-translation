id: DEU.3.9
reference: Deuteronomy 3:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: צִידֹנִ֛ים יִקְרְא֥וּ לְ/חֶרְמ֖וֹן שִׂרְיֹ֑ן וְ/הָ֣/אֱמֹרִ֔י יִקְרְאוּ ל֖/וֹ שְׂנִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/009.yaml
  text: The Sidonians call Hermon Sirion[b][a], and the Amorites call it Senir—
translation:
  language: ml
  text: സീദോന്യർ ഹെർമ്മോനെ സിര്യോൻ എന്നും അമോര്യർ അതിനെ സെനീർ എന്നും വിളിക്കുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צִידֹנִים
  choice: സീദോന്യർ
  rationale: സീദോൻ ജനതയെ സൂചിപ്പിക്കുന്ന ബഹുവചന ജനനാമം; മലയാളത്തിൽ സ്വാഭാവികമായ ജനവിഭാഗരൂപം ഉപയോഗിച്ചു.
- source_word: יִקְרְאוּ
  choice: വിളിക്കുന്നു
  rationale: קרא എന്ന ക്രിയ ഇവിടെ ל എന്ന ഉപസർഗത്തോടൊപ്പം പേരിട്ടു വിളിക്കുക എന്ന അർഥത്തിലാണ്; മലയാളത്തിൽ ‘എന്നു വിളിക്കുന്നു’ സ്വാഭാവികമാണ്.
- source_word: לְחֶרְמוֹן
  choice: ഹെർമ്മോനെ
  rationale: ഹെർമ്മോൻ എന്ന സ്ഥലനാമം കർമരൂപത്തിൽ നൽകി. ഈ വാക്യത്തിലെ എബ്രായപാഠത്തിൽ ‘പർവതം’ എന്ന പദമില്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല.
- source_word: שִׂרְיֹן
  choice: സിര്യോൻ
  rationale: ഹെർമ്മോനു സീദോന്യർ ഉപയോഗിച്ചിരുന്ന പേരിന്റെ ലിപ്യന്തരണം.
- source_word: וְהָאֱמֹרִי
  choice: അമോര്യർ
  rationale: രൂപപരമായി ഏകവചനമായ ജനനാമം ഇവിടെ സമൂഹവാചകമാണ്; സമാന്തരമായ ബഹുവചന കർത്താവിനും ക്രിയയ്ക്കും അനുസരിച്ച് മലയാളത്തിൽ ബഹുവചനം നൽകി.
- source_word: יִקְרְאוּ לוֹ
  choice: അതിനെ … എന്നു വിളിക്കുന്നു
  rationale: സർവനാമം ഹെർമ്മോനെ സൂചിപ്പിക്കുന്നു; പേരിട്ടു വിളിക്കുന്ന അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
- source_word: שְׂנִיר
  choice: സെനീർ
  rationale: ഹെർമ്മോനു അമോര്യർ ഉപയോഗിച്ചിരുന്ന പേരിന്റെ ലിപ്യന്തരണം.
