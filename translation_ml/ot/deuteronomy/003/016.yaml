id: DEU.3.16
reference: Deuteronomy 3:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לָ/רֻאוּבֵנִ֨י וְ/לַ/גָּדִ֜י נָתַ֤תִּי מִן הַ/גִּלְעָד֙ וְ/עַד נַ֣חַל אַרְנֹ֔ן תּ֥וֹךְ הַ/נַּ֖חַל וּ/גְבֻ֑ל וְ/עַד֙ יַבֹּ֣ק הַ/נַּ֔חַל גְּב֖וּל בְּנֵ֥י עַמּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/016.yaml
  text: And to the Reubenites and to the Gadites I gave from Gilead as far as the Arnon Valley[a], the middle of the valley as a border, and as far as the Jabbok Valley[b], the border of the sons of Ammon.
translation:
  language: ml
  text: രൂബേന്യർക്കും ഗാദ്യർക്കും ഞാൻ ഗിലെയാദുമുതൽ അർനോൻ താഴ്‌വരവരെ[a], താഴ്‌വരയുടെ മധ്യം അതിർത്തിയായി, അമ്മോന്റെ മക്കളുടെ അതിർത്തിയായ[b] യബ്ബോക്ക് താഴ്‌വരവരെയും കൊടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായ പദമായ נחל ഒരു അരുവിയെയോ വാദിയെയോ അതിനോടു ബന്ധപ്പെട്ട താഴ്‌വരയെയോ സൂചിപ്പിക്കാം. ‘താഴ്‌വരയുടെ മധ്യം’ അതിർത്തിയായിരുന്നുവെന്ന് തുടർവാക്യം പറയുന്നതിനാൽ ഇവിടെ “താഴ്‌വര” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “അമ്മോന്റെ മക്കൾ” എന്നത് അമ്മോന്യജനത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ബന്ധുത്വപ്രയോഗമാണ്; “അമ്മോന്യരുടെ അതിർത്തി” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָרֻאוּבֵנִי וְלַגָּדִי
  choice: രൂബേന്യർക്കും ഗാദ്യർക്കും
  rationale: രൂപങ്ങൾ പൂർവപിതാക്കന്മാരായ രൂബേനെയും ഗാദിനെയും മാത്രമല്ല, അവരുടെ ഗോത്രസമൂഹങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ ജനവിഭാഗനാമങ്ങൾ ഈ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: נָתַתִּי
  choice: ഞാൻ ... കൊടുത്തു
  rationale: נתן എന്ന സാധാരണ ക്രിയയുടെ ലളിതമായ അർഥം നിലനിർത്തുന്നു; ‘വിഭജിച്ചുകൊടുത്തു’ പോലുള്ള അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: מִן הַגִּלְעָד
  choice: ഗിലെയാദുമുതൽ
  rationale: ഭൂപ്രദേശത്തിന്റെ വ്യാപ്തി ആരംഭിക്കുന്ന സ്ഥലം എന്ന ബന്ധം ചുരുക്കമായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: נַחַל אַרְנֹן / יַבֹּק הַנַּחַל
  choice: അർനോൻ താഴ്‌വര / യബ്ബോക്ക് താഴ്‌വര
  rationale: נחל എന്നത് അരുവിയെയോ വാദിയെയോ അതിനോടു ബന്ധപ്പെട്ട താഴ്‌വരയെയോ സൂചിപ്പിക്കാം. തുടർന്നുള്ള ‘താഴ്‌വരയുടെ മധ്യം’ എന്ന അതിർത്തിവിവരണത്തോട് ‘താഴ്‌വര’ നന്നായി യോജിക്കുന്നു; ജലപ്രവാഹത്തിന്റെ സ്ഥിരത അനാവശ്യമായി നിർണയിക്കുന്നുമില്ല.
- source_word: תּוֹךְ הַנַּחַל וּגְבֻל
  choice: താഴ്‌വരയുടെ മധ്യം അതിരായി നിശ്ചയിച്ച്
  rationale: താഴ്‌വരയുടെ നടുവിലൂടെയുള്ള രേഖ അതിർത്തിയായി പ്രവർത്തിച്ചു എന്ന അപ്പൊസിഷണൽ ബന്ധം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പറയുന്നു.
- source_word: גְּבוּל בְּנֵי עַמּוֹן
  choice: അമ്മോന്റെ മക്കളുടെ അതിരായ
  rationale: ‘അമ്മോന്റെ മക്കൾ’ എന്ന എബ്രായ ബന്ധുത്വപ്രയോഗം പ്രധാനപാഠത്തിൽ നിലനിർത്തുന്നു; അതിന്റെ ജനവിഭാഗാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ദീർഘമായ അതിർത്തിവിവരണം വായിക്കാൻ എളുപ്പമാക്കാൻ ഇടവരകൾ ഉപയോഗിച്ചിരിക്കുന്നു; മൂലപാഠത്തിലെ ഭൂപ്രദേശപരമായ അനിശ്ചിതത്വവും ‘അമ്മോന്റെ മക്കൾ’ എന്ന ബന്ധുത്വപ്രയോഗവും സംരക്ഷിച്ചിട്ടുണ്ട്.
