revisions:
- from: രൂബേന്യർക്കും ഗാദ്യർക്കും ഞാൻ ഗിലെയാദുമുതൽ അർനോൻ താഴ്‌വരവരെയും[a]—താഴ്‌വരയുടെ മധ്യം അതിരായി നിശ്ചയിച്ച്—അമ്മോന്റെ മക്കളുടെ അതിരായ യബ്ബോക്ക് താഴ്‌വരവരെയും[b] കൊടുത്തു.
  to: രൂബേന്യർക്കും ഗാദ്യർക്കും ഞാൻ ഗിലെയാദുമുതൽ അർനോൻ താഴ്‌വരവരെ[a], താഴ്‌വരയുടെ മധ്യം അതിർത്തിയായി, അമ്മോന്റെ മക്കളുടെ അതിർത്തിയായ[b] യബ്ബോക്ക് താഴ്‌വരവരെയും കൊടുത്തു.
  rationale: അമ്മോനെ സംബന്ധിക്കുന്ന അടിക്കുറിപ്പ് അതു വിശദീകരിക്കുന്ന പദസമുച്ചയത്തോടു ചേർത്ത് ആങ്കർ-സംബന്ധം ശരിയാക്കി. മൂലപാഠം വ്യക്തമാക്കാത്ത ‘നിശ്ചയിച്ച്’ ഒഴിവാക്കി, താഴ്‌വരയുടെ മധ്യം അതിർത്തിയാണെന്ന എബ്രായ അപ്പൊസിഷണൽ ഘടന നേരിട്ട് നിലനിർത്തി. മറ്റെല്ലാ പ്രധാന ഭൗമശാസ്ത്രപരവും ബന്ധുത്വപരവുമായ തിരഞ്ഞെടുപ്പുകളും സംരക്ഷിച്ചിരിക്കുന്നു.
