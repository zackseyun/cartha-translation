source:
  edition: WLC
  text: עֲלֵ֣ה רֹ֣אשׁ הַ/פִּסְגָּ֗ה וְ/שָׂ֥א עֵינֶ֛י/ךָ יָ֧מָּ/ה וְ/צָפֹ֛נָ/ה וְ/תֵימָ֥נָ/ה וּ/מִזְרָ֖חָ/ה וּ/רְאֵ֣ה בְ/עֵינֶ֑י/ךָ כִּי לֹ֥א תַעֲבֹ֖ר אֶת הַ/יַּרְדֵּ֥ן הַ/זֶּֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/027.yaml
  text: Go up to the top of Pisgah[a], and lift up your eyes westward and northward and southward and eastward, and see with your eyes[b]; for you shall not cross this Jordan.
translation:
  language: ml
  text: പിസ്ഗയുടെ കൊടുമുടിയിലേക്കു കയറുക. നിന്റെ കണ്ണുകൾ പടിഞ്ഞാറോട്ട്[a], വടക്കോട്ട്, തെക്കോട്ട്, കിഴക്കോട്ട് ഉയർത്തി നിന്റെ കണ്ണുകളാൽ കാണുക; കാരണം നീ ഈ യോർദ്ദാൻ[b] കടക്കുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘കടലിലേക്ക്’; പടിഞ്ഞാറ് എന്ന ദിശ സൂചിപ്പിക്കുന്ന പതിവുപ്രയോഗമാണിത്.
    reason: cultural_note
  - marker: b
    text: ‘ഈ യോർദ്ദാൻ നദി’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിൽ ‘ഈ യോർദ്ദാൻ’ എന്നാണുള്ളത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלֵה רֹאשׁ הַפִּסְגָּה
  choice: പിസ്ഗയുടെ കൊടുമുടിയിലേക്കു കയറുക
  rationale: עלה എന്ന ഏകവചന ആജ്ഞയുടെ മുകളിലേക്കുള്ള ദിശയും רֹאשׁ എന്നതിന്റെ ‘മുകൾഭാഗം/കൊടുമുടി’ എന്ന അർഥവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; പിസ്ഗ എന്ന സ്ഥലനാമവും സംരക്ഷിക്കുന്നു.
- source_word: וְשָׂא עֵינֶיךָ
  choice: നിന്റെ കണ്ണുകളുയർത്തി
  rationale: കാഴ്ച വിവിധ ദിശകളിലേക്കു തിരിക്കുക എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സാഹിത്യഭാവം നിലനിർത്തുന്നു; വെറും ‘നോക്കുക’ എന്നു ചുരുക്കുന്നില്ല.
- source_word: יָמָּה
  choice: പടിഞ്ഞാറോട്ട്
  rationale: ים (‘കടൽ’) എന്നതിൽനിന്നുള്ള ദിശാസൂചക രൂപം ഇവിടെ ഇസ്രായേൽദേശത്തിന്റെ ഭൂമിശാസ്ത്രപരമായ പ്രയോഗത്തിൽ ‘പടിഞ്ഞാറോട്ട്’ എന്നാണ് അർഥമാക്കുന്നത്.
- source_word: וְצָפֹנָה וְתֵימָנָה וּמִזְרָחָה
  choice: വടക്കോട്ട്, തെക്കോട്ട്, കിഴക്കോട്ട്
  rationale: മൂന്നു ദിശാസൂചക രൂപങ്ങളും സമാന്തരവും സാധാരണ വായനക്കാർക്കു വ്യക്തവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וּרְאֵה בְעֵינֶיךָ
  choice: നിന്റെ സ്വന്തം കണ്ണുകൾകൊണ്ടു കാണുക
  rationale: മുമ്പ് ‘കണ്ണുകളുയർത്തി’ എന്നു പറഞ്ഞ ശേഷവും മൂലപാഠം വീണ്ടും ‘നിന്റെ കണ്ണുകളാൽ’ എന്നു പറയുന്ന ഊന്നൽ സംരക്ഷിക്കാൻ ‘സ്വന്തം’ ചേർക്കുന്നു.
- source_word: כִּי לֹא תַעֲבֹר
  choice: കാരണം നീ ... കടക്കുകയില്ല
  rationale: כי നൽകുന്ന കാരണബന്ധവും עבר എന്ന ക്രിയയുടെ നദി കടക്കുക എന്ന സന്ദർഭാർഥവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: אֶת הַיַּרְדֵּן הַזֶּה
  choice: ഈ യോർദ്ദാൻ
  rationale: הזה എന്ന സമീപസൂചകത്തിന്റെ ഊന്നൽ സംരക്ഷിക്കുന്നു; മൂലപാഠത്തിൽ ‘നദി’ എന്ന നാമം പ്രത്യേകം ഇല്ലാത്തതിനാൽ അതു മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ഏകവചന അഭിസംബോധന ഉപയോഗിച്ചു. ദിശകളുടെ നിരയും ‘കണ്ണുകൾ’ എന്ന പദത്തിന്റെ ആവർത്തനത്തിലുളള ഊന്നലും സംരക്ഷിച്ചു. നൽകിയ ഇംഗ്ലീഷ് കരടിലെ അടിക്കുറിപ്പുസൂചകങ്ങൾ അവ വിശദീകരിക്കുന്ന യഥാർഥ പദങ്ങളായ ‘പടിഞ്ഞാറോട്ട്’, ‘യോർദ്ദാൻ’ എന്നിവയ്ക്കു പിന്നാലെ ശരിയായി സ്ഥാപിച്ചു.
