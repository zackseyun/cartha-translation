source:
  edition: WLC
  text: כִּ֣י רַק ע֞וֹג מֶ֣לֶךְ הַ/בָּשָׁ֗ן נִשְׁאַר֮ מִ/יֶּ֣תֶר הָ/רְפָאִים֒ הִנֵּ֤ה עַרְשׂ/וֹ֙ עֶ֣רֶשׂ בַּרְזֶ֔ל הֲ/לֹ֣ה הִ֔וא בְּ/רַבַּ֖ת בְּנֵ֣י עַמּ֑וֹן תֵּ֧שַׁע אַמּ֣וֹת אָרְכָּ֗/הּ וְ/אַרְבַּ֥ע אַמּ֛וֹת רָחְבָּ֖/הּ בְּ/אַמַּת אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/011.yaml
  text: For only Og king of Bashan was left of the remnant of the Rephaim[a]. Look, his bed was a bed of iron. Is it not in Rabbah of the Ammonites? Its length was nine cubits and its width four cubits[b], by the cubit of a man.
translation:
  language: ml
  text: ബാശാനിലെ രാജാവായ ഓഗ് മാത്രമാണ് രെഫായീമിന്റെ ശേഷിപ്പിൽനിന്ന് അവശേഷിച്ചിരുന്നത്.[a] നോക്കൂ, അവന്റെ കിടക്ക ഇരുമ്പുകൊണ്ടുള്ള കിടക്കയായിരുന്നു. അത് അമ്മോന്യരുടെ റബ്ബായിൽ ഇല്ലയോ? അതിന് ഒൻപത് മുഴം നീളവും നാല് മുഴം വീതിയുമുണ്ടായിരുന്നു—മനുഷ്യന്റെ മുഴപ്രകാരം.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ഭീമന്മാർ.’ ‘രെഫായീം’ എന്നത് അസാധാരണ വലിപ്പവുമായി ബന്ധപ്പെടുത്തിയിരുന്ന ഒരു പുരാതന ജനവിഭാഗത്തിന്റെ പേരായിരിക്കാം.
    reason: alternative_reading
  - marker: b
    text: ‘മനുഷ്യന്റെ മുഴപ്രകാരം’ എന്നതാണ് എബ്രായത്തിലെ അക്ഷരാർഥം; ‘സാധാരണ മുഴപ്രകാരം’ എന്നും മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: മാത്രമാണ്
  rationale: ഓഗ് മാത്രമേ ഈ കൂട്ടത്തിൽ ശേഷിച്ചിരുന്നുള്ളൂ എന്ന പരിമിതിവാചകത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: נִשְׁאַר מִיֶּתֶר
  choice: ശേഷിച്ചവരിൽ ശേഷിച്ചിരുന്നത്
  rationale: ക്രിയയുടെയും ‘ശേഷിപ്പ്/ബാക്കി’ എന്ന നാമത്തിന്റെയും ആവർത്തനം മലയാളത്തിൽ അല്പം സ്വാഭാവികമാക്കി നിലനിർത്തുന്നു.
- source_word: הָרְפָאִים
  choice: രെഫായീം
  rationale: ‘ഭീമന്മാർ’ എന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ അടിച്ചേൽപ്പിക്കാതെ പുരാതന ജനവിഭാഗത്തിന്റെ എബ്രായ നാമം ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: הִנֵּה
  choice: നോക്കൂ
  rationale: തെളിവായി ചൂണ്ടിക്കാണിക്കുന്ന വസ്തുവിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന ശക്തി ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: עַרְשׂוֹ ... עֶרֶשׂ
  choice: അവന്റെ കിടക്ക ... കിടക്കയായിരുന്നു
  rationale: എബ്രായത്തിലെ നാമപദാവർത്തനം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ‘കിടക്ക’ സ്വാഭാവികമായ പ്രാഥമിക അർഥമാണ്.
- source_word: בַּרְזֶל
  choice: ഇരുമ്പുകൊണ്ടുള്ള
  rationale: വസ്തുവിന്റെ നിർമ്മാണസാമഗ്രിയെ വ്യക്തവും സ്വാഭാവികവുമായി പറയുന്നു.
- source_word: הֲלֹה הִוא
  choice: അത് ... ഇല്ലയോ?
  rationale: അറിയപ്പെടുന്ന സ്ഥലത്തുള്ള വസ്തുവിനെ സാക്ഷ്യമായി ഉന്നയിക്കുന്ന എബ്രായ വാചാടോപചോദ്യം നിലനിർത്തുന്നു.
- source_word: בְּרַבַּת בְּנֵי עַמּוֹן
  choice: അമ്മോന്യരുടെ റബ്ബയിൽ
  rationale: സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്യുകയും ജനവിഭാഗത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: תֵּשַׁע אַמּוֹת ... וְאַרְבַּע אַמּוֹת
  choice: ഒൻപതു മുഴം ... നാലു മുഴം
  rationale: തെറ്റായ കൃത്യതയുള്ള ആധുനിക പരിവർത്തനം ഒഴിവാക്കി പുരാതന അളവായ മുഴം നിലനിർത്തുന്നു.
- source_word: בְּאַמַּת אִישׁ
  choice: മനുഷ്യന്റെ മുഴപ്രകാരം
  rationale: എബ്രായപ്രയോഗത്തോട് അടുത്തുനിൽക്കുകയും ‘സാധാരണ മുഴം’ എന്ന വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: הָרְפָאִים എന്നത് ‘ഭീമന്മാർ’ എന്നു വ്യാഖ്യാനിക്കണമോ, ജനവിഭാഗനാമമായി നിലനിർത്തണമോ
  choice: രെഫായീം
  alternative: ഭീമന്മാർ
  rationale: എബ്രായപദം പഴയനിയമത്തിൽ ഒരു ജനവിഭാഗത്തെയോ വിഭാഗത്തെയോ സൂചിപ്പിക്കുന്നു. അസാധാരണ വലിപ്പവുമായി ബന്ധമുണ്ടെങ്കിലും ‘ഭീമന്മാർ’ എന്നത് വ്യാഖ്യാനപരമാണ്.
- issue: עֶרֶשׂ എന്നത് കിടക്കയെയോ ശവമഞ്ചം/ശവപ്പെട്ടിയെയോ സൂചിപ്പിക്കുന്നുവോ
  choice: കിടക്ക
  alternative: ശവമഞ്ചം; ശവപ്പെട്ടി
  rationale: ഓഗിന്റെ അസാധാരണ വലിപ്പം വ്യക്തമാക്കാൻ അളവുകൾ പറയുന്ന ഉടൻസന്ദർഭത്തിൽ ‘കിടക്ക’ സ്വാഭാവികമാണ്; ശവസംസ്കാരപരമായ അർഥം എബ്രായം നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. എബ്രായത്തിലെ വാചാടോപചോദ്യം, നാമപദാവർത്തനം, പുരാതന അളവ്, ജനവിഭാഗനാമം എന്നിവ നിലനിർത്തി; വ്യാഖ്യാനപരമായ സാധ്യതകൾ അടിക്കുറിപ്പുകളിൽ നൽകി.
