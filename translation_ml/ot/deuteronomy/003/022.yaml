source:
  edition: WLC
  text: לֹ֖א תְִּירָא֑וּ/ם כִּ֚י יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם ה֖וּא הַ/נִּלְחָ֥ם לָ/כֶֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/022.yaml
  text: Do not fear them[a], for Yahweh your God is the one who fights for you.
translation:
  language: ml
  text: അവരെ ഭയപ്പെടരുത്[a]; കാരണം, നിങ്ങളുടെ ദൈവമായ യഹ്‌വെ തന്നെയാണ് നിങ്ങൾക്കുവേണ്ടി പോരാടുന്നത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവരെ പേടിക്കരുത്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תִּירָאוּם
  choice: അവരെ ഭയപ്പെടരുത്
  rationale: നിഷേധപദത്തോടുകൂടിയ അപൂർണക്രിയ ഇവിടെ വിലക്ക് അറിയിക്കുന്നു; മൂന്നാം പുരുഷ ബഹുവചന പ്രത്യയം ‘അവരെ’ എന്ന് വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻപുള്ള വിലക്കിന്റെ കാരണം അവതരിപ്പിക്കുന്ന ബന്ധകമായി സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവമായ
  rationale: ഇസ്രായേലിന്റെ ദൈവത്തെ സൂചിപ്പിക്കുന്ന ഏകവചനാർഥവും രണ്ടാം പുരുഷ ബഹുവചന ഉടമസ്ഥതയും സംരക്ഷിക്കുന്നു; മലയാളവാക്യത്തിൽ ദൈവനാമത്തോടു സ്വാഭാവികമായി ചേരുന്നു.
- source_word: הוּא
  choice: തന്നെയാണ്
  rationale: സ്വതന്ത്ര സർവനാമത്തിന്റെ ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הַנִּלְחָם
  choice: പോരാടുന്നത്
  rationale: לחם എന്ന ക്രിയയുടെ നിഫാൽ കൃദന്തരൂപം ഇവിടെ അവർക്കുവേണ്ടി യുദ്ധം ചെയ്യുന്ന ദൈവത്തിന്റെ സജീവ പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: לָכֶם
  choice: നിങ്ങൾക്കുവേണ്ടി
  rationale: ל എന്ന മുൻപ്രത്യയത്തിന്റെ ഗുണഭോക്തൃ/പ്രതിനിധിത്വാർഥം നേരിട്ട് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു ബിരുദംകൊണ്ട് പകരാതെ, മലയാളത്തിൽ പരിചിതമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: הוּא എന്ന സർവനാമത്തിന്റെ ഊന്നൽ
  choice: തന്നെയാണ്
  alternative: ആണ്
  rationale: ഇസ്രായേലിനുവേണ്ടി പോരാടുന്നവൻ അവരുടെ ദൈവമായ യഹോവ തന്നെയാണെന്ന മൂലപാഠത്തിലെ ഊന്നൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഭയപ്പെടരുത്’ ഔപചാരിക ഗൗരവം നിലനിർത്തുമ്പോൾ അടിക്കുറിപ്പിലെ ‘പേടിക്കരുത്’ സാധാരണ പ്രയോഗവികൽപം നൽകുന്നു.
