  to: മനശ്ശെയുടെ മകനായ യായീർ അർഗോബ് പ്രദേശം മുഴുവനും ഗെശൂര്യരുടെയും മാഖാത്യരുടെയും അതിർത്തിവരെ കൈവശപ്പെടുത്തി. അവൻ അവയ്ക്ക് തന്റെ പേരനുസരിച്ച്, ബാശാനിലെ “ഹവ്വോത്ത്-യായീർ”[a][b] എന്നു പേരിട്ടു; ഇന്നുവരെയും ആ പേര് നിലനിൽക്കുന്നു.
