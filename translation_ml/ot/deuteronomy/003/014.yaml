id: DEU.3.14
reference: Deuteronomy 3:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: יָאִ֣יר בֶּן מְנַשֶּׁ֗ה לָקַח֙ אֶת כָּל חֶ֣בֶל אַרְגֹּ֔ב עַד גְּב֥וּל הַ/גְּשׁוּרִ֖י וְ/הַ/מַּֽעֲכָתִ֑י וַ/יִּקְרָא֩ אֹתָ֨/ם עַל שְׁמ֤/וֹ אֶת הַ/בָּשָׁן֙ חַוֺּ֣ת יָאִ֔יר עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/014.yaml
  text: Jair son of Manasseh took all the region of Argob[a], as far as the border of the Geshurites and the Maacathites, and he called them, that is, Bashan, Havvoth-jair[b], to this day.
translation:
  language: ml
  text: മനശ്ശെയുടെ മകനായ യായീർ അർഗോബ് പ്രദേശം മുഴുവനും ഗെശൂര്യരുടെയും മാഖാത്യരുടെയും അതിർത്തിവരെ കൈവശപ്പെടുത്തി. അവൻ അവയ്ക്ക് തന്റെ പേരനുസരിച്ച്, ബാശാനിലെ “ഹവ്വോത്ത്-യായീർ”[a][b] എന്നു പേരിട്ടു; ഇന്നുവരെയും ആ പേര് നിലനിൽക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായ വാക്യഘടന വളരെ ചുരുക്കപ്പെട്ടതും ദുഷ്കരവുമാണ്. “അവൻ അവയ്ക്ക് തന്റെ പേരനുസരിച്ച് ‘ബാശാൻ-ഹവ്വോത്ത്-യായീർ’ എന്നു പേരിട്ടു” എന്നും ഇതിനെ മനസ്സിലാക്കാം.
    reason: alternative_reading
  - marker: b
    text: “ഹവ്വോത്ത്-യായീർ” എന്നതിന് “യായീറിന്റെ ഗ്രാമങ്ങൾ” എന്നോ “യായീറിന്റെ കൂടാരക്കുടിയിരിപ്പുകൾ” എന്നോ അർഥമുണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶבֶל
  choice: പ്രദേശം
  rationale: ഈ ഭൂമിശാസ്ത്രസന്ദർഭത്തിൽ നിർവചിക്കപ്പെട്ട ഒരു ഭൂപ്രദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ പദം.
- source_word: אַרְגֹּב
  choice: അർഗോബ്
  rationale: സ്ഥലനാമമായതിനാൽ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: עַד גְּבוּל הַגְּשׁוּרִי וְהַמַּעֲכָתִי
  choice: ഗെശൂര്യരുടെയും മാഖാത്യരുടെയും അതിർത്തിവരെ
  rationale: גְּבוּל എന്നതിന്റെ അതിർത്തി/പരിധി എന്ന അർഥവും ജനവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്ന രൂപങ്ങളും നിലനിർത്തുന്നു.
- source_word: לָקַח
  choice: കൈവശപ്പെടുത്തി
  rationale: ഭൂപ്രദേശം സ്വന്തമാക്കുകയോ അധീനതയിലാക്കുകയോ ചെയ്തുവെന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיִּקְרָא אֹתָם
  choice: അവൻ അവയെ ... എന്നു വിളിച്ചു
  rationale: എബ്രായത്തിലെ പുല്ലിംഗ ബഹുവചന കർമപ്രത്യയമായ ‘അവയെ’ ഏകവചനമാക്കി മിനുക്കാതെ നിലനിർത്തി.
- source_word: עַל שְׁמוֹ
  choice: തന്റെ പേരനുസരിച്ച്
  rationale: സ്വന്തം പേരുമായി ബന്ധപ്പെടുത്തി നാമകരണം ചെയ്തു എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം നൽകുന്നു.
- source_word: אֶת הַבָּשָׁן
  choice: അതായത് ബാശാനെ
  rationale: ദുഷ്കരവും ചുരുക്കപ്പെട്ടതുമായ വാക്യഘടനയിൽ ബാശാൻ മുൻപുള്ള കർമത്തെ വിശദീകരിക്കുന്ന സമാനാധികരണ ഘടകമായി അവതരിപ്പിക്കുന്നു; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: חַוֹּת יָאִיר
  choice: ഹവ്വോത്ത്-യായീർ
  rationale: സ്ഥലനാമമായി പ്രവർത്തിക്കുന്നതിനാൽ ലിപ്യന്തരണം ചെയ്തു; ഘടകപദത്തിന്റെ സാദ്ധ്യമായ അർഥങ്ങൾ അടിക്കുറിപ്പിൽ നൽകി.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ഇന്നുവരെയും ആ പേര് നിലനിൽക്കുന്നു
  rationale: ആഖ്യാതാവിന്റെ കാലംവരെ പേര് തുടർന്നുവെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. വ്യക്തിനാമങ്ങളും സ്ഥലനാമങ്ങളും മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപങ്ങളോട് ചേർന്ന് ലിപ്യന്തരിച്ചു. മൂലത്തിലെ ബഹുവചന സർവനാമവും ഏകവചനമായ ‘ബാശാൻ’ എന്ന സമാനാധികരണ ഘടകവും തമ്മിലുള്ള വാക്യഘടനാപരമായ പിരിമുറുക്ക് മുഖ്യപാഠത്തിൽ നിലനിർത്തി, വായനസഹായത്തിനായി അടിക്കുറിപ്പ് ചേർത്തു.
