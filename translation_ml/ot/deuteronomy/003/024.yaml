- from: “കർത്താവായ യഹോവേ, അങ്ങയുടെ മഹത്ത്വവും അങ്ങയുടെ ശക്തമായ കൈയും അങ്ങയുടെ ദാസനെ കാണിച്ചുതുടങ്ങിയിരിക്കുന്നുവല്ലോ. ആകാശത്തിലോ ഭൂമിയിലോ അങ്ങയുടെ പ്രവൃത്തികൾപോലെയും അങ്ങയുടെ വീര്യപ്രവൃത്തികൾപോലെയും ചെയ്യാൻ കഴിയുന്ന ദൈവം ആരുണ്ട്?”
  to: “കർത്താവായ യഹോവേ, അങ്ങയുടെ മഹത്ത്വവും അങ്ങയുടെ ശക്തമായ കൈയും അങ്ങയുടെ ദാസനായ എനിക്ക് കാണിച്ചുതുടങ്ങിയിരിക്കുന്നുവല്ലോ. ആകാശത്തിലോ ഭൂമിയിലോ അങ്ങയുടെ പ്രവൃത്തികളെപ്പോലെയും അങ്ങയുടെ പരാക്രമപ്രവൃത്തികളെപ്പോലെയും ചെയ്യാൻ കഴിയുന്ന ദൈവം ആരുണ്ട്?”
