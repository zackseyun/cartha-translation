id: DEU.3.24
reference: Deuteronomy 3:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֲדֹנָ֣/י יְהוִ֗ה אַתָּ֤ה הַֽחִלּ֨וֹתָ֙ לְ/הַרְא֣וֹת אֶֽת עַבְדְּ/ךָ֔ אֶ֨ת גָּדְלְ/ךָ֔ וְ/אֶת יָדְ/ךָ֖ הַ/חֲזָקָ֑ה אֲשֶׁ֤ר מִי אֵל֙ בַּ/שָּׁמַ֣יִם וּ/בָ/אָ֔רֶץ אֲשֶׁר יַעֲשֶׂ֥ה כְ/מַעֲשֶׂ֖י/ךָ וְ/כִ/גְבוּרֹתֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/024.yaml
  text: O Lord Yahweh[a], you have begun to show your servant your greatness and your strong hand. For what god is there in heaven or on earth who can do deeds like your deeds and mighty acts like yours?
translation:
  language: ml
  text: “കർത്താവായ യഹോവേ, അങ്ങയുടെ മഹത്ത്വവും അങ്ങയുടെ ശക്തമായ കൈയും അങ്ങയുടെ ദാസനായ എനിക്ക് കാണിച്ചുതുടങ്ങിയിരിക്കുന്നുവല്ലോ. ആകാശത്തിലോ ഭൂമിയിലോ അങ്ങയുടെ പ്രവൃത്തികളെപ്പോലെയും അങ്ങയുടെ പരാക്രമപ്രവൃത്തികളെപ്പോലെയും ചെയ്യാൻ കഴിയുന്ന ദൈവം ആരുണ്ട്?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: കർത്താവായ യഹോവേ
  rationale: אֲדֹנָי എന്ന അധികാരപദവും יהוה എന്ന ദൈവനാമവും വേർതിരിച്ചറിയാവുന്ന വിധത്തിൽ, മലയാളത്തിലെ സ്വാഭാവിക സംബോധനാരൂപത്തിൽ നൽകി.
- source_word: הַחִלּוֹתָ לְהַרְאוֹת
  choice: കാണിച്ചുതുടങ്ങിയിരിക്കുന്നുവല്ലോ
  rationale: ‘കാണിക്കാൻ ആരംഭിച്ചു’ എന്ന അർത്ഥവും, ആരംഭിച്ച വെളിപ്പെടുത്തലിന്റെ ഇപ്പോഴത്തെ പ്രസക്തിയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עַבְדְּךָ
  choice: അങ്ങയുടെ ദാസനെ
  rationale: ദൈവത്തോടുള്ള പ്രാർഥനാപരമായ വിധേയബന്ധത്തിൽ עבד എന്ന പദത്തിന് ‘ദാസൻ’ യോജിച്ചതാണ്.
- source_word: גָּדְלְךָ
  choice: അങ്ങയുടെ മഹത്ത്വം
  rationale: גדל സൂചിപ്പിക്കുന്ന വലിപ്പം, ശ്രേഷ്ഠത, മഹിമ എന്നീ ആശയങ്ങൾക്ക് സന്ദർഭോചിതമായ പദം.
- source_word: יָדְךָ הַחֲזָקָה
  choice: അങ്ങയുടെ ശക്തമായ കൈ
  rationale: ദൈവത്തിന്റെ പ്രവർത്തനശക്തിയെ സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം ഔപചാരികമായി നിലനിർത്തുന്നു.
- source_word: מִי אֵל בַּשָּׁמַיִם וּבָאָרֶץ
  choice: ആകാശത്തിലോ ഭൂമിയിലോ ... ദൈവം ആരുണ്ട്?
  rationale: സകല മേഖലയെയും ഉൾക്കൊള്ളുന്ന, താരതമ്യരഹിതത്വം ഉന്നയിക്കുന്ന വാചാടോപചോദ്യം സ്വാഭാവിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: יַעֲשֶׂה
  choice: ചെയ്യാൻ കഴിയുന്ന
  rationale: ഇവിടത്തെ അപൂർണക്രിയയുടെ കഴിവ്/സാധ്യത സൂചിപ്പിക്കുന്ന വാചാടോപബലം വ്യക്തമാക്കുന്നു.
- source_word: כְמַעֲשֶׂיךָ וְכִגְבוּרֹתֶיךָ
  choice: അങ്ങയുടെ പ്രവൃത്തികൾപോലെയും അങ്ങയുടെ വീര്യപ്രവൃത്തികൾപോലെയും
  rationale: מעשה, גבורה എന്നീ സമാന്തരവും വ്യത്യസ്തവുമായ പദങ്ങളെ യഥാക്രമം ‘പ്രവൃത്തികൾ’, ‘വീര്യപ്രവൃത്തികൾ’ എന്നു നൽകി കാവ്യസമാന്തരത സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: אֲדֹנָי יְהוִה എന്ന സംയുക്ത ദൈവസംബോധനയുടെ പരിഭാഷ
  choice: കർത്താവായ യഹോവേ
  alternative: കർത്താവായ ദൈവമേ
  rationale: יהוה എന്ന ഉടമ്പടിനാമം പൊതുവായ ‘ദൈവം’ എന്ന പദത്തിൽ ലയിപ്പിക്കാതെ നിലനിർത്തുകയും אֲדֹנָי എന്ന പദത്തിന്റെ ‘കർത്താവ്’ എന്ന അർത്ഥം വേർതിരിച്ചു പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- issue: മറ്റു ദേവന്മാരെക്കുറിച്ചുള്ള വാചാടോപചോദ്യം
  choice: ദൈവം ആരുണ്ട്?
  alternative: ഏതു ദൈവത്തിനാണ് ... കഴിയുക?
  rationale: മൂലപാഠം താരതമ്യരഹിതത്വം ശക്തമായി പ്രഖ്യാപിക്കുന്നുവെങ്കിലും ‘മറ്റു ദേവന്മാർ ഇല്ല’ എന്ന വ്യാഖ്യാനവാക്യം ചേർക്കുന്നില്ല; ചോദ്യം അതിന്റെ യഥാർഥ രൂപത്തിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പ്രാർഥനാപരവുമായ മലയാളം. ദൈവത്തെ അഭിസംബോധന ചെയ്യുമ്പോൾ ‘അങ്ങ്/അങ്ങയുടെ’ ഉപയോഗിച്ചു. എബ്രായത്തിലെ ശക്തമായ കൈ എന്ന രൂപകവും പ്രവൃത്തികൾ–വീര്യപ്രവൃത്തികൾ എന്ന സമാന്തരതയും നിലനിർത്തി.
