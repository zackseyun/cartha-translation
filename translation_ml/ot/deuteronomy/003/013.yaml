id: DEU.3.13
reference: Deuteronomy 3:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/יֶ֨תֶר הַ/גִּלְעָ֤ד וְ/כָל הַ/בָּשָׁן֙ מַמְלֶ֣כֶת ע֔וֹג נָתַ֕תִּי לַ/חֲצִ֖י שֵׁ֣בֶט הַֽ/מְנַשֶּׁ֑ה כֹּ֣ל חֶ֤בֶל הָֽ/אַרְגֹּב֙ לְ/כָל הַ/בָּשָׁ֔ן הַ/ה֥וּא יִקָּרֵ֖א אֶ֥רֶץ רְפָאִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/013.yaml
  text: And the rest of Gilead[a], and all Bashan, the kingdom of Og, I gave to the half-tribe of Manasseh—all the region of Argob, that is, all Bashan. That is called the land of the Rephaim.
translation:
  language: ml
  text: ഗിലെയാദിന്റെ ശേഷിച്ച ഭാഗവും ഓഗിന്റെ രാജ്യമായ ബാശാൻ മുഴുവനും ഞാൻ മനശ്ശെയുടെ പാതിഗോത്രത്തിനു കൊടുത്തു. അർഗോബ് പ്രദേശം മുഴുവനും—അതായത്, ബാശാൻ മുഴുവനും—രെഫായീമ്യരുടെ ദേശം[a] എന്നു വിളിക്കപ്പെടുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പരമ്പരാഗതമായി, “ഭീമന്മാരുടെ ദേശം” എന്നും വിവർത്തനം ചെയ്യാറുണ്ട്. ഈ പ്രദേശവുമായി ബന്ധപ്പെട്ടിരുന്ന ഒരു പുരാതന ജനവിഭാഗത്തിന്റെ എബ്രായ പേരാണ് “രെഫായീം.”
    reason: רְפָאִים എന്ന ജനനാമത്തിന്റെ പരമ്പരാഗത വ്യാഖ്യാനപരമായ വിവർത്തനം സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: יֶתֶר הַגִּלְעָד
  choice: ഗിലെയാദിന്റെ ശേഷിച്ച ഭാഗം
  rationale: മുമ്പ് നൽകിയ പ്രദേശത്തിനുശേഷം ഗിലെയാദിൽ ശേഷിച്ച ഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: כָל הַבָּשָׁן
  choice: ബാശാൻ മുഴുവനും
  rationale: כָל എന്ന പദത്തിന്റെ സമഗ്രത നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: מַמְלֶכֶת עוֹג
  choice: ഓഗിന്റെ രാജ്യമായ
  rationale: ബാശാനെ ഓഗിന്റെ രാജ്യമായി തിരിച്ചറിയുന്ന എബ്രായ നാമസംബന്ധം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: נָתַתִּי
  choice: ഞാൻ ... കൊടുത്തു
  rationale: ഒന്നാംപുരുഷപ്രയോഗവും ഭൂവിഭജനത്തിന്റെ സാഹചര്യവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: לַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: മനശ്ശെയുടെ പാതിഗോത്രത്തിനു
  rationale: യോർദ്ദാനക്കരയിലെ ഗോത്രവിഭാഗത്തെ ചുരുക്കമായും വ്യക്തമായും സൂചിപ്പിക്കുന്നു.
- source_word: כֹּל חֶבֶל הָאַרְגֹּב
  choice: അർഗോബ് പ്രദേശം മുഴുവനും
  rationale: חֶבֶל ഇവിടെ കയറല്ല, ഭൂപ്രദേശം അഥവാ ജില്ലയാണ്; ‘പ്രദേശം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: לְכָל הַבָּשָׁן
  choice: അതായത്, ബാശാൻ മുഴുവനും
  rationale: അർഗോബ് പ്രദേശവും ഇവിടെ ഉദ്ദേശിക്കുന്ന ബാശാന്റെ മുഴുവൻ വിസ്തൃതിയും തമ്മിലുള്ള വിശദീകരണാത്മക ബന്ധം മലയാളത്തിൽ വായനാസൗകര്യത്തോടെ പ്രകടിപ്പിക്കുന്നു.
- source_word: יִקָּרֵא
  choice: വിളിക്കപ്പെടുന്നു
  rationale: എബ്രായ അപൂർണ്ണകാല കർമണിരൂപം പതിവായ പേരിടലിനെ സൂചിപ്പിക്കാം; വർത്തമാന കർമണിരൂപം അതിനെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: אֶרֶץ רְפָאִים
  choice: രെഫായീമ്യരുടെ ദേശം
  rationale: רְפָאִים എന്നത് ഇവിടെ ഒരു പുരാതന ജനവിഭാഗത്തിന്റെ പേരായി നിലനിർത്തുന്നു; ‘മല്ലന്മാർ’ എന്ന വ്യാഖ്യാനപരമായ വിവർത്തനം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: רְפָאִים എന്നത് ജനവിഭാഗത്തിന്റെ പേരായി ലിപ്യന്തരണം ചെയ്യണമോ ‘മല്ലന്മാർ’ എന്നു വ്യാഖ്യാനിക്കണമോ
  choice: രെഫായീമ്യരുടെ ദേശം
  alternative: മല്ലന്മാരുടെ ദേശം
  rationale: ഈ സന്ദർഭത്തിൽ പദം ഒരു പുരാതന ജനവിഭാഗത്തിന്റെ പേരായി പ്രവർത്തിക്കുന്നു. ലിപ്യന്തരണം മൂലപാഠത്തിന്റെ പദപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു; പരമ്പരാഗത വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. നീണ്ട എബ്രായ വാക്യഘടന വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി; ആവർത്തനവും ഭൂമിശാസ്ത്രപരമായ തിരിച്ചറിയലും നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നം അതു വിശദീകരിക്കുന്ന ‘രെഫായീമ്യരുടെ ദേശം’ എന്ന പ്രയോഗത്തിനുശേഷം ചേർത്തു.
