id: DEU.3.20
reference: Deuteronomy 3:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: עַ֠ד אֲשֶׁר יָנִ֨יחַ יְהוָ֥ה לַֽ/אֲחֵי/כֶם֮ כָּ/כֶם֒ וְ/יָרְשׁ֣וּ גַם הֵ֔ם אֶת הָ/אָ֕רֶץ אֲשֶׁ֨ר יְהוָ֧ה אֱלֹהֵי/כֶ֛ם נֹתֵ֥ן לָ/הֶ֖ם בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֑ן וְ/שַׁבְתֶּ֗ם אִ֚ישׁ לִֽ/ירֻשָּׁת֔/וֹ אֲשֶׁ֥ר נָתַ֖תִּי לָ/כֶֽם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/020.yaml
  text: until Yahweh gives rest to your brothers as to you[a], and they also take possession of the land that Yahweh your God is giving them beyond the Jordan[c][b]. Then each of you may return to his possession that I have given you.
translation:
  language: ml
  text: യഹോവ നിങ്ങൾക്കെന്നപോലെ നിങ്ങളുടെ സഹോദരന്മാർക്കും സ്വസ്ഥത നൽകുകയും, നിങ്ങളുടെ ദൈവമായ യഹോവ യോർദ്ദാന്റെ മറുവശത്തുള്ള[a] ദേശം അവർക്കു നൽകുകയും അവരും അതു കൈവശമാക്കുകയും ചെയ്യുന്നതുവരെ. അതിനുശേഷം, ഞാൻ നിങ്ങൾക്കു നൽകിയിരിക്കുന്ന അവകാശഭൂമിയിലേക്ക്[b] നിങ്ങളിൽ ഓരോരുത്തനും മടങ്ങാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യോർദ്ദാനക്കരെ’ അല്ലെങ്കിൽ ‘യോർദ്ദാന്റെ മറുവശത്ത്.’ സംസാരിക്കുന്ന മോശെ നദിയുടെ കിഴക്കുവശത്തായതിനാൽ ഇവിടെ ഉദ്ദേശിക്കുന്നത് പടിഞ്ഞാറുവശമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘കൈവശഭൂമിയിലേക്ക്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יָנִיחַ
  choice: സ്വസ്ഥത നൽകുക
  rationale: ഹിഫീൽ രൂപം ഇവിടെ സുരക്ഷിതമായി വസിക്കാനുള്ള വിശ്രമം അഥവാ ആശ്വാസം നൽകുക എന്നർഥം വഹിക്കുന്നു; ആവർത്തിക്കുന്ന ആവർത്തനപുസ്തക പ്രമേയവും ഇതിലൂടെ നിലനിൽക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു പദവികൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: לַאֲחֵיכֶם
  choice: നിങ്ങളുടെ സഹോദരന്മാർക്ക്
  rationale: എബ്രായത്തിലെ പുരുഷലിംഗ ബന്ധുത്വപദം അതേപടി സൂക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ ഇത് മറ്റു ഇസ്രായേല്യ ഗോത്രാംഗങ്ങളെ സൂചിപ്പിക്കുന്നു.
- source_word: כָכֶם
  choice: നിങ്ങൾക്കെന്നപോലെ
  rationale: എബ്രായത്തിലെ സംക്ഷിപ്തമായ താരതമ്യം വിശദീകരിച്ച് തീർക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְיָרְשׁוּ
  choice: കൈവശമാക്കുക
  rationale: ירשׁ എന്ന ക്രിയയുടെ ദേശം സ്വന്തമാക്കി അധീനതയിൽ വരുത്തുക എന്ന സജീവ അർഥം ഇതിലൂടെ വ്യക്തമാണ്.
- source_word: נֹתֵן
  choice: നൽകുന്ന
  rationale: വർത്തമാന കൃദന്തരൂപം ദാനം ഉറപ്പുള്ളതും നടന്നു കൊണ്ടിരിക്കുന്നതുമായ പ്രവർത്തിയായി അവതരിപ്പിക്കുന്നു.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: യോർദ്ദാനക്കരെ
  rationale: നദിയുടെ മറുവശം എന്ന സ്ഥലസാപേക്ഷ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ദിശ സംസാരിക്കുന്നവന്റെ കിഴക്കൻ സ്ഥാനത്തെ ആശ്രയിച്ചിരിക്കുന്നു.
- source_word: וְשַׁבְתֶּם אִישׁ
  choice: നിങ്ങൾ ഓരോരുത്തർക്കും മടങ്ങാം
  rationale: ക്രമത്തിൽ തുടർന്ന് ലഭിക്കുന്ന അനുമതിയും אִישׁ എന്ന പദത്തിന്റെ വിതരണാർഥവും സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: לִירֻשָּׁתוֹ
  choice: അവകാശത്തിലേക്ക്
  rationale: കുടുംബത്തിനോ വ്യക്തിക്കോ ലഭിച്ച ഭൂവിഹിതം എന്ന നിയമ-ഉടമ്പടി അർഥം ‘അവകാശം’ നിലനിർത്തുന്നു.
- source_word: נָתַתִּי לָכֶם
  choice: ഞാൻ നിങ്ങൾക്കു നൽകിയിരിക്കുന്ന
  rationale: പൂർത്തിയായ ദാനത്തിന്റെയും അതിന്റെ ഇപ്പോഴത്തെ പ്രാബല്യത്തിന്റെയും ഭാവം മലയാളത്തിലെ പൂർണ്ണക്രിയാരൂപം പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമത്തെ ഒരു പദവിയാക്കി മാറ്റാതെ വ്യക്തിനാമമായി സംരക്ഷിക്കുന്നു.
- issue: לַאֲחֵיכֶם എന്ന പുരുഷലിംഗ ബന്ധുത്വപദം
  choice: നിങ്ങളുടെ സഹോദരന്മാർ
  alternative: നിങ്ങളുടെ സഹ ഇസ്രായേല്യർ
  rationale: മൂലത്തിലെ പുരുഷലിംഗ രൂപം നിലനിർത്തുന്നു; അത് മറ്റു ഇസ്രായേല്യരെ ഉൾക്കൊള്ളുന്ന പ്രതിനിധിപദമാണെന്നത് സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- issue: וְשַׁבְתֶּם എന്നതിന്റെ നിർദ്ദേശാത്മകമോ അനുമതിപരമോ ആയ ശക്തി
  choice: മടങ്ങാം
  alternative: മടങ്ങണം / മടങ്ങും
  rationale: മുൻപുള്ള സൈനിക ബാധ്യത പൂർത്തിയായശേഷം മടങ്ങാനുള്ള അനുമതി ലഭിക്കുന്നു എന്ന സന്ദർഭശക്തി സ്വീകരിച്ചു; നേരിട്ടുള്ള രൂപം ഭാവി അല്ലെങ്കിൽ നിർദ്ദേശം എന്നും വായിക്കാവുന്നതാണ്.
- issue: മൂലത്തിൽ വ്യക്തമല്ലാത്ത ‘സഹായിക്കണം’ എന്ന ആശയത്തിന്റെ അവതരണം
  choice: മുൻസന്ദർഭത്തിലെ നിർദ്ദേശം പൂർത്തിയാക്കാൻ ‘നിങ്ങൾ അവരെ സഹായിക്കണം’ ചേർത്തു
  alternative: ‘...ചെയ്യുന്നതുവരെ’ എന്ന അപൂർണ്ണ ഉപവാക്യം മാത്രം നിലനിർത്തുക
  rationale: ഈ വാക്യം 3:18–19-ലെ കല്പന തുടരുന്ന സമയപരിധി ഉപവാക്യമാണ്. ഒറ്റവാക്യമായി വായിക്കുമ്പോൾ മലയാളത്തിൽ പൂർണ്ണതയ്ക്കായി ആശയം വ്യക്തമാക്കി; പുതിയ ദൈവശാസ്ത്രവാദം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. വാക്യം മുൻസന്ദർഭത്തിലെ കല്പനയെ ആശ്രയിക്കുന്നതിനാൽ സ്വതന്ത്ര വായനയ്ക്ക് ആവശ്യമായ ‘നിങ്ങൾ അവരെ സഹായിക്കണം’ എന്ന ആശയം വ്യക്തമാക്കി. പ്രധാനപാഠത്തിലെ എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും അനുബന്ധ കുറിപ്പുകളുമായി പൊരുത്തപ്പെടുന്നു.
