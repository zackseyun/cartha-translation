revisions:
- from: യഹോവ നിങ്ങൾക്കെന്നപോലെ നിങ്ങളുടെ സഹോദരന്മാർക്കും സ്വസ്ഥത നൽകുകയും, നിങ്ങളുടെ ദൈവമായ യഹോവ യോർദ്ദാനക്കരെ[a] അവർക്കു നൽകുന്ന ദേശം അവരും കൈവശമാക്കുകയും ചെയ്യുന്നതുവരെ നിങ്ങൾ അവരെ സഹായിക്കണം. അതിനുശേഷം, ഞാൻ നിങ്ങൾക്കു നൽകിയിരിക്കുന്ന അവകാശത്തിലേക്ക്[b] നിങ്ങൾ ഓരോരുത്തർക്കും മടങ്ങാം.
  to: യഹോവ നിങ്ങൾക്കെന്നപോലെ നിങ്ങളുടെ സഹോദരന്മാർക്കും സ്വസ്ഥത നൽകുകയും, നിങ്ങളുടെ ദൈവമായ യഹോവ യോർദ്ദാന്റെ മറുവശത്തുള്ള[a] ദേശം അവർക്കു നൽകുകയും അവരും അതു കൈവശമാക്കുകയും ചെയ്യുന്നതുവരെ. അതിനുശേഷം, ഞാൻ നിങ്ങൾക്കു നൽകിയിരിക്കുന്ന അവകാശഭൂമിയിലേക്ക്[b] നിങ്ങളിൽ ഓരോരുത്തനും മടങ്ങാം.
  rationale: The revision removes the unstated command imported from the prior verse while preserving the source text’s dependent ‘until’ clause. It clarifies the Jordan-relative location, improves the distributive Malayalam syntax, and renders the allotted possession as ‘അവകാശഭൂമി.’ Footnote anchors and their corresponding notes remain structurally aligned.
