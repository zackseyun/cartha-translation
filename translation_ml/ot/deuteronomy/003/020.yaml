review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the principal lexical content, including Yahweh’s giving rest, the brothers’ taking possession, and return to the allotted possession. However, it inserts “നിങ്ങൾ അവരെ സഹായിക്കണം” (“you must help them”), which is not expressed in v. 20. The Hebrew begins with an עד אשר (“until”) temporal clause dependent on the preceding command; the translation should preserve that dependency rather than supply an explicit command from the prior context. “യോർദ്ദാനക്കരെ” can mean the riverbank and does not clearly express the source’s spatial sense, ‘beyond/across the Jordan.’
  naturalness: The register is suitably modern and dignified. “നിങ്ങൾ ഓരോരുത്തർക്കും മടങ്ങാം” is grammatically awkward because the distributive subject is cast in a dative-like plural form. “നിങ്ങളിൽ ഓരോരുത്തനും ... മടങ്ങാം” is idiomatic. A dependent opening temporal clause is appropriate here because the Hebrew itself continues the preceding sentence.
  terminology: “സ്വസ്ഥത നൽകുക,” “സഹോദരന്മാർ,” “കൈവശമാക്കുക,” and “യഹോവ” are appropriate. “അവകാശഭൂമി” more clearly conveys the allotted inherited possession than the abstract “അവകാശം.” “യോർദ്ദാന്റെ മറുവശത്തുള്ള ദേശം” clearly represents the speaker-relative phrase without implying an absolute direction in the main text.
  issues:
  - severity: high
    issue: The main text adds “നിങ്ങൾ അവരെ സഹായിക്കണം.”
    rationale: This obligation is supplied from the preceding context, not stated in the Hebrew text of Deuteronomy 3:20. The verse’s opening ‘until’ clause is intentionally dependent on the preceding command and should not be expanded into a new explicit command.
  - severity: medium
    issue: “യോർദ്ദാനക്കരെ” is spatially imprecise.
    rationale: It may denote the bank of the Jordan, whereas בְּעֵבֶר הַיַּרְדֵּן means beyond/across the Jordan, relative to Moses’ location.
