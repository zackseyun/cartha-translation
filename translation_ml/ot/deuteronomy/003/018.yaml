id: DEU.3.18
reference: Deuteronomy 3:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וָ/אֲצַ֣ו אֶתְ/כֶ֔ם בָּ/עֵ֥ת הַ/הִ֖וא לֵ/אמֹ֑ר יְהוָ֣ה אֱלֹהֵי/כֶ֗ם נָתַ֨ן לָ/כֶ֜ם אֶת הָ/אָ֤רֶץ הַ/זֹּאת֙ לְ/רִשְׁתָּ֔/הּ חֲלוּצִ֣ים תַּֽעַבְר֗וּ לִ/פְנֵ֛י אֲחֵי/כֶ֥ם בְּנֵֽי יִשְׂרָאֵ֖ל כָּל בְּנֵי חָֽיִל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/018.yaml
  text: And I commanded you at that time[a], saying, ‘Yahweh your God has given you this land to possess. You shall cross over armed before your brothers[c][b], the sons of Israel—all the men of valor.’
translation:
  language: ml
  text: 'ആ സമയത്ത് ഞാൻ നിങ്ങളോടു ഇങ്ങനെ കല്പിച്ചു: “നിങ്ങളുടെ ദൈവമായ യഹ്‌വെ ഈ ദേശം നിങ്ങൾക്കു കൈവശമാക്കാൻ തന്നിരിക്കുന്നു. നിങ്ങളിലെ യുദ്ധപ്രാപ്തരായ പുരുഷന്മാരെല്ലാം ആയുധധാരികളായി[a], നിങ്ങളുടെ സഹോദരന്മാരായ[b] ഇസ്രായേൽമക്കളുടെ മുമ്പിൽ കടന്നുപോകണം.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യുദ്ധസജ്ജരായി.”
    reason: חֲלוּצִים ആയുധം ധരിച്ചതിനൊപ്പം യുദ്ധത്തിനായി സജ്ജരായിരിക്കുന്നതും സൂചിപ്പിക്കാം.
  - marker: b
    text: 'അർഥം: “നിങ്ങളുടെ സഹ ഇസ്രായേല്യർ”; എബ്രായത്തിൽ അക്ഷരാർഥം, “നിങ്ങളുടെ സഹോദരന്മാരായ ഇസ്രായേൽമക്കൾ.”'
    reason: ബന്ധുത്വപദത്തിന്റെ അക്ഷരാർഥവും സമൂഹപരമായ വ്യാപ്തിയും വ്യക്തമാക്കുന്നു.
  - marker: c
    text: “യുദ്ധപ്രാപ്തരായ പുരുഷന്മാർ” എന്നത് കേവലം ധൈര്യമുള്ളവരെയല്ല, യുദ്ധം ചെയ്യാൻ ശേഷിയുള്ള പുരുഷന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: בְּנֵי חָיִל എന്ന സൈനികപ്രയോഗത്തിന്റെ സാഹചര്യാർഥം വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: וָאֲצַו אֶתְכֶם
  choice: ഞാൻ നിങ്ങളോടു ... കല്പിച്ചു
  rationale: צוה എന്ന ക്രിയയുടെ ആജ്ഞ നൽകുക എന്ന നേരിട്ടുള്ള അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בָּעֵת הַהִוא
  choice: ആ സമയത്ത്
  rationale: വിവരണത്തിന്റെ കാലസൂചന കൃത്യവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: לֵאמֹר
  choice: ഇങ്ങനെ
  rationale: നേരിട്ടുള്ള ഉദ്ധരണി അവതരിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തെ മലയാളത്തിലെ സ്വാഭാവികമായ സംഭാഷണാമുഖമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, സാധാരണ പുനർനിർമിത ഉച്ചാരണത്തോട് അടുത്ത മലയാളലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: נָתַן לָכֶם
  choice: നിങ്ങൾക്കു ... തന്നിരിക്കുന്നു
  rationale: പൂർത്തിയായ ദാനത്തിന്റെയും അതിന്റെ ഇപ്പോഴത്തെ പ്രസക്തിയുടെയും ഭാവം പ്രകടമാക്കുന്നു.
- source_word: הָאָרֶץ הַזֹּאת לְרִשְׁתָּהּ
  choice: ഈ ദേശം നിങ്ങൾക്കു കൈവശമാക്കാൻ
  rationale: ירשׁ ഇവിടെ ദേശം സ്വന്തമായി അധീനപ്പെടുത്തുകയും കൈവശം വയ്ക്കുകയും ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘അവകാശമാക്കുക’ എന്നത് പാരമ്പര്യാവകാശം മാത്രമായി തെറ്റിദ്ധരിക്കപ്പെടാം.
- source_word: חֲלוּצִים
  choice: ആയുധധാരികളായി
  rationale: യുദ്ധത്തിനായി സജ്ജരായി മുന്നേറുന്ന സൈനികസന്ദർഭം ചുരുക്കവും വ്യക്തവുമായി അറിയിക്കുന്നു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: תַּעַבְרוּ לִפְנֵי
  choice: മുമ്പിൽ കടന്നുപോകണം
  rationale: ആജ്ഞയുടെ നിർബന്ധശക്തിയും മറ്റു ഗോത്രങ്ങൾക്ക് മുന്നിലായി യോർദ്ദാൻ കടക്കുന്നതും നിലനിർത്തുന്നു.
- source_word: אֲחֵיכֶם בְּנֵי יִשְׂרָאֵל
  choice: നിങ്ങളുടെ സഹോദരന്മാരായ ഇസ്രായേൽമക്കൾ
  rationale: രക്തബന്ധപദവും അതിനെ വിശദീകരിക്കുന്ന ‘ഇസ്രായേൽമക്കൾ’ എന്ന പുരുഷലിംഗ ബഹുവചനവും സംരക്ഷിക്കുന്നു.
- source_word: כָּל בְּנֵי חָיִל
  choice: നിങ്ങളിലെ യുദ്ധപ്രാപ്തരായ പുരുഷന്മാരെല്ലാം
  rationale: חיל ഇവിടെ കേവലം ഉള്ളിലെ ധൈര്യമല്ല, യുദ്ധം ചെയ്യാനുള്ള ശേഷിയുള്ള പുരുഷന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്; വാക്യത്തിൽ ആരാണ് കടന്നുപോകേണ്ടതെന്ന് മലയാളത്തിൽ വ്യക്തമായി ക്രമീകരിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമത്തെ പദവിയായ ‘കർത്താവ്’ എന്നു പകരാതെ സൂക്ഷിക്കുന്നു; ‘യഹോവ’ എന്ന പരമ്പരാഗത രൂപത്തേക്കാൾ പുനർനിർമിത എബ്രായ ഉച്ചാരണത്തോട് ‘യഹ്‌വെ’ അടുത്തതാണ്.
- issue: אֲחֵיכֶם / בְּנֵי יִשְׂרָאֵל / בְּנֵי חָיִל എന്നീ പുരുഷലിംഗ സൈനികപദങ്ങൾ
  choice: സഹോദരന്മാർ ... ഇസ്രായേൽമക്കൾ ... യുദ്ധപ്രാപ്തരായ പുരുഷന്മാർ
  alternative: സഹ ഇസ്രായേല്യർ ... പോരാളികൾ
  rationale: സൈനികസന്ദർഭത്തിലെ മൂലപാഠത്തിന്റെ പുരുഷലിംഗ രൂപവും ബന്ധഭാഷയും സംരക്ഷിക്കുന്നു; ‘സഹ ഇസ്രായേല്യർ’ എന്ന അർഥസൂചന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്കു വ്യക്തവുമായ ശൈലി. എബ്രായ വാക്യക്രമം യാന്ത്രികമായി പകർത്താതെ, כָּל בְּנֵי חָיִל എന്ന കർത്തൃസമാന ഘടകത്തെ മലയാളത്തിൽ ആദ്യം കൊണ്ടുവന്ന് ആജ്ഞയുടെ അർഥം വ്യക്തമായി; മൂലത്തിലെ ബന്ധഭാഷയും സൈനികഭാവവും നിലനിർത്തി.
