id: ECC.1.2
reference: Ecclesiastes 1:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הֲבֵ֤ל הֲבָלִים֙ אָמַ֣ר קֹהֶ֔לֶת הֲבֵ֥ל הֲבָלִ֖ים הַ/כֹּ֥ל הָֽבֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/002.yaml
  text: Breath of breaths[a], says Qoheleth[b]; breath of breaths, all is mere breath.
translation:
  language: ml
  text: ശ്വാസങ്ങളിൽ ശ്വാസം[a]—കോഹെലെത്ത്[b] പറയുന്നു—ശ്വാസങ്ങളിൽ ശ്വാസം; എല്ലാം വെറും ശ്വാസം.
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: ഹീബ്രു הֶבֶל (ഹെവെൽ) എന്നതിന് അക്ഷരാർഥത്തിൽ ‘ശ്വാസം’ അഥവാ ‘നീരാവി’ എന്നാണ്. സഭാപ്രസംഗിയിൽ ഈ പദം ക്ഷണികമായത്, പിടിച്ചുനിർത്താനാവാത്തത്, പ്രതീക്ഷിച്ചതും സംഭവിക്കുന്നതും തമ്മിൽ പൊരുത്തപ്പെടാത്തത് എന്നീ പരസ്പരബന്ധമുള്ള അർഥസൂചനകൾ വഹിക്കുന്നു. ‘വ്യർഥത’, ‘നിരർഥകത’, ‘മായ’ എന്നിവയിൽ ഒന്നും ഈ സൂചനകളെല്ലാം ഒരുമിച്ച് ഉൾക്കൊള്ളുന്നില്ല. הֲבֵל הֲבָלִים (‘ശ്വാസങ്ങളിൽ ശ്വാസം’) എന്നത് ‘ഗീതങ്ങളിൽ ഗീതം’ പോലെയുള്ള ഹീബ്രു പരമോന്നതപ്രയോഗമാണ്.
    reason: The Malayalam illustration and the verse wording are aligned with the natural Malayalam superlative construction.
lexical_decisions:
- source_word: הֲבֵל / הָבֶל
  choice: ശ്വാസം / വെറും ശ്വാസം
  rationale: ഹീബ്രു പദം അക്ഷരാർഥത്തിൽ ‘ശ്വാസം’ അഥവാ ‘നീരാവി’ എന്ന ദൃശ്യരൂപം നൽകുന്നു. ക്ഷണികത, പിടികിട്ടായ്മ, പ്രതീക്ഷയും ഫലവും തമ്മിലുള്ള വൈരുധ്യം എന്നീ അർഥസൂചനകൾ ഒരുമിച്ച് നിലനിർത്താൻ ‘ശ്വാസം’ ഉപയോഗിച്ചു. വിധിപ്രസ്താവത്തിലുള്ള അവസാന പ്രയോഗത്തിൽ നിരർഥകത എന്ന ഏകാർഥം ചുമത്താതെ വിലയിരുത്തലിന്റെ തീവ്രത നൽകാൻ ‘വെറും ശ്വാസം’ എന്നു നൽകി.
- source_word: הֲבֵל הֲבָלִים
  choice: ശ്വാസങ്ങളുടെ ശ്വാസം
  rationale: ‘ഗീതങ്ങളുടെ ഗീതം’, ‘വിശുദ്ധങ്ങളിൽ അതിവിശുദ്ധം’ എന്നിവപോലുള്ള ഹീബ്രു പരമോന്നതപ്രയോഗത്തിന്റെ രൂപവും ശ്വാസം എന്ന മൂർത്തബിംബവും ഒരുമിച്ച് കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: אָמַר
  choice: പറയുന്നു
  rationale: രൂപത്തിൽ പൂർത്തകാലമായിരുന്നാലും സാഹിത്യപരമായ ഉദ്ധരണിസൂത്രത്തിൽ വർത്തമാനകാലം മലയാളത്തിൽ പ്രസ്താവനയെ സജീവവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: קֹהֶלֶת
  choice: കോഹെലെത്ത്
  rationale: ‘ഉപദേശകൻ’, ‘പ്രസംഗകൻ’, ‘സഭായോഗം വിളിച്ചുകൂട്ടുന്നവൻ’ തുടങ്ങിയ പരിഭാഷകൾ ഓരോന്നും പദത്തിന്റെ അർഥവ്യാപ്തി ചുരുക്കുന്നതിനാൽ ഹീബ്രു വിശേഷണനാമം ലിപ്യന്തരിച്ചു.
- source_word: הַכֹּל
  choice: എല്ലാം
  rationale: സമഗ്രത സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന് സാധാരണ ആധുനിക മലയാളത്തിലെ സ്വാഭാവികവും വ്യാപകവുമായ തത്തുല്യം.
theological_decisions:
- issue: സഭാപ്രസംഗിയിലെ കേന്ദ്രപ്രമേയമായ הֶבֶל എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: മൂർത്തബിംബം നിലനിർത്തി ‘ശ്വാസം’ എന്നും അവസാനത്തെ വിധിപ്രസ്താവത്തിൽ ‘വെറും ശ്വാസം’ എന്നും പരിഭാഷപ്പെടുത്തി.
  alternative: മായ; വ്യർഥത; നിരർഥകത; ക്ഷണികത; നീരാവി
  rationale: ‘വ്യർഥത’ ലക്ഷ്യം പരാജയപ്പെടുന്നതിലേക്കും ‘നിരർഥകത’ നിഹിലിസത്തിലേക്കും അർഥത്തെ ചുരുക്കാം; ‘മായ’ മറ്റൊരു ദാർശനിക ചട്ടക്കൂട് അനാവശ്യമായി ഉണർത്താം. ‘ശ്വാസം’ ക്ഷണികത, പിടികിട്ടായ്മ, അനുഭവത്തിലെ വിരോധാഭാസം എന്നിവ ഒരുമിച്ച് തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രു ആവർത്തനവും പരമോന്നതപ്രയോഗത്തിന്റെ ഘടനയും നിലനിർത്തി; ഇടയ്ക്കുള്ള ‘കോഹെലെത്ത് പറയുന്നു’ എന്ന ഘടകം ദീർഘരേഖകൾക്കുള്ളിൽ നൽകി വാക്യത്തിന്റെ പ്രഖ്യാപനാത്മക താളം സംരക്ഷിച്ചു.
