id: RUT.4.13
reference: Ruth 4:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח בֹּ֤עַז אֶת רוּת֙ וַ/תְּהִי ל֣/וֹ לְ/אִשָּׁ֔ה וַ/יָּבֹ֖א אֵלֶ֑י/הָ וַ/יִּתֵּ֨ן יְהוָ֥ה לָ֛/הּ הֵרָי֖וֹן וַ/תֵּ֥לֶד בֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/013.yaml
  text: So Boaz took Ruth[a], and she became his wife. He went in to her, and Yahweh granted her conception, and she bore a son.
translation:
  language: ml
  text: അങ്ങനെ ബോവസ് രൂത്തിനെ സ്വീകരിച്ചു; അവൾ അവന്റെ ഭാര്യയായി. അവൻ അവളുടെ അടുക്കൽ ചെന്നു. യഹ്‌വെ അവളെ ഗർഭം ധരിക്കാൻ ഇടയാക്കി[a]; അവൾ ഒരു മകനെ പ്രസവിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹ്‌വെ അവൾക്കു ഗർഭം നൽകി” എന്നും “യഹ്‌വെ അവൾക്കു ഗർഭധാരണം നൽകി” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: സ്വീകരിച്ചു
  rationale: לקח എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘എടുക്കുക’ എന്നാണെങ്കിലും വിവാഹസന്ദർഭത്തിൽ ‘സ്വീകരിക്കുക’ എന്നത് സ്വാഭാവികമായ മലയാളമാണ്. തുടർന്ന് വരുന്ന ‘അവൾ അവന്റെ ഭാര്യയായി’ എന്ന വാക്യം വിവാഹാർഥം വ്യക്തമാക്കുന്നതിനാൽ ‘വിവാഹം കഴിച്ചു’ എന്ന് ആവർത്തിച്ചിട്ടില്ല.
- source_word: וַתְּהִי לוֹ לְאִשָּׁה
  choice: അവൾ അവന്റെ ഭാര്യയായി
  rationale: ഔപചാരികമായ ദാമ്പത്യബന്ധം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ക്രമവും അർഥവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: അവൻ അവളുടെ അടുക്കൽ ചെന്നു
  rationale: ലൈംഗികസംയോഗത്തെ സൂചിപ്പിക്കുന്ന എബ്രായത്തിലെ മാന്യമായ പരോക്ഷപ്രയോഗം അതേ മിതത്വത്തോടെ നിലനിർത്തുന്നു; കൂടുതൽ തുറന്ന വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וַיִּתֵּן יְהוָה לָהּ הֵרָיוֹן
  choice: യഹ്‌വെ അവൾക്കു ഗർഭധാരണം നൽകി
  rationale: הֵרָיוֹן എന്നത് ഗർഭധാരണം/ഗർഭം എന്ന ആശയം നൽകുന്നു. ‘നൽകി’ എന്നത് മൂലത്തിലെ נתן എന്ന ക്രിയയും ദൈവിക പ്രവർത്തനകർത്തൃത്വവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: וַתֵּלֶד בֵּן
  choice: അവൾ ഒരു മകനെ പ്രസവിച്ചു
  rationale: ילד + בן എന്ന പ്രയോഗത്തിന്റെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാള പരിഭാഷയാണിത്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു പദവികൊണ്ട് പകരാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: രൂത്തിന്റെ ഗർഭധാരണത്തിലെ പ്രവർത്തനകർത്തൃത്വം
  choice: യഹ്‌വെ അവൾക്കു ഗർഭധാരണം നൽകി
  alternative: യഹ്‌വെ അവളെ ഗർഭം ധരിക്കാൻ പ്രാപ്തയാക്കി
  rationale: ഗർഭധാരണത്തെ യഹ്‌വെ നൽകിയതായി മൂലപാഠം വ്യക്തമായി അവതരിപ്പിക്കുന്നു. അതിനെ വിശദീകരിച്ചോ ദുർബലമാക്കിയോ മാറ്റാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ലൈംഗികസംയോഗത്തെ സൂചിപ്പിക്കുന്ന മൂലഭാഷയിലെ പരോക്ഷത നിലനിർത്തിയിട്ടുണ്ട്; ദൈവനാമം ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്തിരിക്കുന്നു.
