base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/002.yaml
  text: Then he took ten men from the elders of the city and said[a], “Sit here,” and they sat down.
translation:
  language: ml
  text: പിന്നെ അവൻ പട്ടണത്തിലെ മൂപ്പന്മാരിൽനിന്ന് പത്തു പുരുഷന്മാരെ തിരഞ്ഞെടുത്തു[a]. “ഇവിടെ ഇരിക്കൂ” എന്നു അവരോടു പറഞ്ഞു. അവർ ഇരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പട്ടണത്തിലെ മൂപ്പന്മാരിൽനിന്ന് പത്തു പുരുഷന്മാരെ എടുത്തു.” ഹീബ്രു ക്രിയയ്ക്ക് ഒരു പ്രത്യേക ഉദ്ദേശ്യത്തിനായി ആളുകളെ എടുക്കുക എന്ന അർഥം വരാം; ഇവിടെ നിയമനടപടിക്കായി അവരെ തിരഞ്ഞെടുത്തതായിരിക്കാം.
