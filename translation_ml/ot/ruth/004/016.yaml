source:
  edition: WLC
  text: וַ/תִּקַּ֨ח נָעֳמִ֤י אֶת הַ/יֶּ֨לֶד֙ וַ/תְּשִׁתֵ֣/הוּ בְ/חֵיקָ֔/הּ וַ/תְּהִי ל֖/וֹ לְ/אֹמֶֽנֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/016.yaml
  text: Then Naomi took the child and laid him in her lap[a], and she became his nurse.
translation:
  language: ml
  text: അപ്പോൾ നൊവൊമി കുഞ്ഞിനെ എടുത്ത് തന്റെ മടിയിൽ കിടത്തി; അവൾ അവന്റെ പോറ്റമ്മയായി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വളർത്തമ്മ’ അല്ലെങ്കിൽ ‘പരിപാലക.’ എബ്രായപദം കുഞ്ഞിനെ മുലയൂട്ടുകയോ വളർത്തുകയോ പരിപാലിക്കുകയോ ചെയ്യുന്ന സ്ത്രീയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקַּח
  choice: എടുത്ത്
  rationale: לקח എന്ന ക്രിയ ഇവിടെ കുഞ്ഞിനെ കൈയിലെടുക്കുന്ന നേരിട്ടുള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ആഖ്യാനത്തിന്റെ തുടർച്ച മലയാളത്തിൽ ‘എടുത്ത്’ എന്നു സ്വാഭാവികമായി വരുന്നു.
- source_word: הַיֶּלֶד
  choice: കുഞ്ഞിനെ
  rationale: יֶלֶד എന്നതിന് ‘കുട്ടി’ എന്നും അർഥമുണ്ടെങ്കിലും, സന്ദർഭത്തിലെ നവജാതശിശുവിനെ സൂചിപ്പിക്കാൻ ‘കുഞ്ഞ്’ കൂടുതൽ പ്രായോചിതവും സ്വാഭാവികവുമാണ്.
- source_word: וַתְּשִׁתֵהוּ
  choice: കിടത്തി
  rationale: שׁית എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം വെക്കുക/സ്ഥാപിക്കുക എന്നതാണ്; കുഞ്ഞിനെ മടിയിൽ വെച്ച പ്രവൃത്തി മലയാളത്തിൽ ‘കിടത്തി’ എന്നു സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: בְחֵיקָהּ
  choice: തന്റെ മടിയിൽ
  rationale: חֵיק മടി/മാർവിടം എന്ന ശരീരഭാഗത്തെ സൂചിപ്പിക്കാം. ഈ സന്ദർഭത്തിൽ ‘മടിയിൽ’ വ്യക്തവും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവുമാണ്; പ്രത്യയത്തിലെ ഉടമസ്ഥത ‘തന്റെ’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: וַתְּהִי לוֹ
  choice: അവൾ അവന്റെ ... ആയി
  rationale: היה + ל എന്ന ഘടന രൂപപ്പെട്ട ബന്ധമോ ചുമതലയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘അവന്റെ ... ആയി’ അത് സ്വാഭാവികമായി പകരുന്നു.
- source_word: לְאֹמֶנֶת
  choice: പോറ്റമ്മ
  rationale: אֹמֶנֶת കുഞ്ഞിനെ പോറ്റിവളർത്തുകയും പരിപാലിക്കുകയും ചെയ്യുന്ന സ്ത്രീയെ സൂചിപ്പിക്കുന്നു. ‘പോറ്റമ്മ’ വൈദ്യശുശ്രൂഷക എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കി മാതൃസദൃശമായ പരിചരണചുമതല വ്യക്തമാക്കുന്നു; പദത്തിന്റെ പരിധി അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
