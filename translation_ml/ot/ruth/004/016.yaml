translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പോറ്റമ്മ’ എന്നത് വൈദ്യരംഗത്തെ ‘നഴ്സ്’ എന്ന ആധുനിക അർഥക്കുഴപ്പം ഒഴിവാക്കുകയും אֹמֶנֶת എന്ന പദത്തിന്റെ മാതൃസദൃശ പരിചരണഭാവം നിലനിർത്തുകയും ചെയ്യുന്നു.
