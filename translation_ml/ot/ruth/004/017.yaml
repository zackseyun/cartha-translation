  yaml_path: translation/ot/ruth/004/017.yaml
  text: Then the neighbor women gave him a name[a], saying, “A son has been born to Naomi.” And they named him Obed. He was the father of Jesse, the father of David.
translation:
  language: ml
  text: അപ്പോൾ അയൽവാസികളായ സ്ത്രീകൾ, “നവോമിക്ക് ഒരു മകൻ ജനിച്ചിരിക്കുന്നു”[a] എന്നു പറഞ്ഞ് അവന് ഒരു പേരിട്ടു. അവർ അവന് ഓബേദ് എന്നു പേരിട്ടു. അവൻ യിശ്ശായിയുടെ പിതാവും യിശ്ശായി ദാവീദിന്റെ പിതാവുമായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: റൂത്ത് പ്രസവിച്ച കുഞ്ഞിലൂടെ നവോമിയുടെ കുടുംബം പുനഃസ്ഥാപിക്കപ്പെട്ടതിനെക്കുറിച്ചാണ് സ്ത്രീകൾ പറയുന്നത്; നവോമിയാണ് കുഞ്ഞിന്റെ ജൈവമാതാവ് എന്നല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁכֵנוֹת
  choice: അയൽക്കാരികളായ സ്ത്രീകൾ
  rationale: സ്ത്രീലിംഗ ബഹുവചനമായ പദം സമീപത്തു താമസിച്ചിരുന്ന സ്ത്രീകളെ പ്രത്യേകം സൂചിപ്പിക്കുന്നു. ഈ പ്രയോഗം സ്ഥലബന്ധവും ലിംഗസൂചനയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַתִּקְרֶאנָה לוֹ שֵׁם
  choice: അവന് പേരിട്ടു
  rationale: ‘അവനുവേണ്ടി/അവന് ഒരു പേര് വിളിച്ചു’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള രൂപം; പരോക്ഷ കർമമായ לוֹ-യുടെ ആശയവും നിലനിർത്തുന്നു.
- source_word: לֵאמֹר
  choice: എന്നു പറഞ്ഞ്
  rationale: തുടർന്നുവരുന്ന പ്രഖ്യാപനത്തെ അവതരിപ്പിക്കുന്ന ഉദ്ധരണിസൂചക ക്രിയാരൂപം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יֻלַּד בֵּן לְנָעֳמִי
  choice: നൊവൊമിക്ക് ഒരു മകൻ ജനിച്ചിരിക്കുന്നു
  rationale: കർമണിപ്രയോഗവും നൊവൊമിയെ ഗുണഭോക്താവായി/സ്വീകർത്താവായി സൂചിപ്പിക്കുന്ന לְ-യും സംരക്ഷിക്കുന്നു; അവളെ ജൈവമാതാവായി വ്യാഖ്യാനിച്ചുതീർക്കുന്നില്ല.
- source_word: וַתִּקְרֶאנָה שְׁמוֹ עוֹבֵד
  choice: അവർ അവന് ഓബേദ് എന്നു പേരിട്ടു
  rationale: എബ്രായത്തിലെ പതിവ് നാമകരണസൂത്രം ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: עוֹבֵד
  choice: ഓബേദ്
  rationale: പദത്തിന്റെ സാധ്യതയുള്ള ‘സേവിക്കുന്നവൻ’ എന്ന അർഥം വിവർത്തനം ചെയ്യാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֲבִי יִשַׁי אֲבִי דָוִד
  choice: അവൻ യിശ്ശായിയുടെ അപ്പനായിരുന്നു; യിശ്ശായി ദാവീദിന്റെ അപ്പനും
  rationale: ഇവിടെ אֲבִי നേരിട്ടുള്ള പിതൃത്വത്തെ സൂചിപ്പിക്കുന്നു. ആവർത്തനഘടനയുടെ വംശാവലിക്രമം വ്യക്തമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יִשַׁי
  choice: യിശ്ശായി
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ബൈബിൾപരമ്പരയിൽ പരിചിതമായ രൂപം ഉപയോഗിക്കുന്നു.
- source_word: דָוִד
  choice: ദാവീദ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ സ്ഥാപിതമായ രൂപം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: ‘നൊവൊമിക്ക് ഒരു മകൻ ജനിച്ചിരിക്കുന്നു’ എന്ന പ്രഖ്യാപനത്തിൽ നവജാതശിശുവുമായുള്ള നൊവൊമിയുടെ ബന്ധം
  choice: ‘നൊവൊമിക്ക്’ എന്ന മൂലപാഠത്തിലെ ബന്ധസൂചന പ്രധാനവാക്യത്തിൽ അതേപടി നിലനിർത്തി.
  alternative: ‘നൊവൊമിക്ക് ഒരു കൊച്ചുമകൻ ജനിച്ചിരിക്കുന്നു’ അല്ലെങ്കിൽ ‘നൊവൊമിക്ക് ഒരു മകനെ ലഭിച്ചിരിക്കുന്നു’
  rationale: റൂത്തിന്റെ കുഞ്ഞിലൂടെ നൊവൊമിയുടെ കുടുംബവംശം പുനഃസ്ഥാപിക്കപ്പെട്ടതിനെ അയൽക്കാരികൾ വിവരിക്കുന്നതാണ്. ‘കൊച്ചുമകൻ’ എന്നു വ്യക്തമാക്കുന്നത് മൂലപാഠത്തിലെ സാഹിത്യപരവും കുടുംബബന്ധപരവുമായ സംഘർഷം ഇല്ലാതാക്കും; എന്നാൽ ഇതു നൊവൊമിയുടെ ജൈവമാതൃത്വം അവകാശപ്പെടുന്നുമില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘അയൽക്കാരികളായ സ്ത്രീകൾ’, ‘പേരിട്ടു’ എന്നീ പ്രയോഗങ്ങൾ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്. ബന്ധത്തിന്റെ മൂലപാഠപരമായ ഉദ്ദേശ്യസന്ദിഗ്ധത അടിക്കുറിപ്പിലൂടെ വിശദീകരിച്ചെങ്കിലും പ്രധാനവാക്യത്തിൽ പരിഹരിച്ചിട്ടില്ല.
