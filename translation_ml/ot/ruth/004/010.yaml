source:
  edition: WLC
  text: וְ/גַ֣ם אֶת ר֣וּת הַ/מֹּאֲבִיָּה֩ אֵ֨שֶׁת מַחְל֜וֹן קָנִ֧יתִי לִ֣/י לְ/אִשָּׁ֗ה לְ/הָקִ֤ים שֵׁם הַ/מֵּת֙ עַל נַ֣חֲלָת֔/וֹ וְ/לֹא יִכָּרֵ֧ת שֵׁם הַ/מֵּ֛ת מֵ/עִ֥ם אֶחָ֖י/ו וּ/מִ/שַּׁ֣עַר מְקוֹמ֑/וֹ עֵדִ֥ים אַתֶּ֖ם הַ/יּֽוֹם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/010.yaml
  text: And also Ruth the Moabite[a], the wife of Mahlon, I have acquired for myself as a wife, to raise up the name of the dead over his inheritance, so that the name of the dead may not be cut off from among his brothers and from the gate of his place[c][b]. You are witnesses today.
translation:
  language: ml
  text: കൂടാതെ, മോവാബുകാരിയായ രൂത്തിനെ[a]—മഹ്ലോന്റെ ഭാര്യയെ—ഞാൻ എനിക്കായി ഭാര്യയായി സ്വന്തമാക്കിയിരിക്കുന്നു; മരിച്ചവന്റെ പേര് അവന്റെ പാരമ്പര്യസ്വത്തിന്മേൽ നിലനിർത്താനും, മരിച്ചവന്റെ പേര് അവന്റെ സഹോദരന്മാരുടെ ഇടയിൽനിന്നും അവന്റെ പട്ടണവാതിൽക്കൽനിന്നും അറ്റുപോകാതിരിക്കാനും. നിങ്ങൾ ഇന്ന് സാക്ഷികളാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഞാൻ എനിക്കുവേണ്ടി വാങ്ങിയിരിക്കുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രു ക്രിയയ്ക്ക് നിയമപരമായ ഒരു ഇടപാടിലൂടെ വിലകൊടുത്തു നേടുക എന്ന അർത്ഥവും വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: കൂടാതെ എന്ന ആശയം തുടർന്നുള്ള വാക്യബന്ധത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു
  rationale: മുൻവാക്യത്തിലെ നിയമനടപടിയോടുള്ള കൂട്ടിച്ചേർക്കൽ നിലനിർത്തുന്നു; മലയാളത്തിൽ വാക്യാരംഭം സ്വാഭാവികമാക്കുന്നു.
- source_word: ר֣וּת הַמֹּאֲבִיָּה
  choice: മോവാബ്യസ്ത്രീയായ രൂത്ത്
  rationale: വ്യക്തിനാമവും ജനവിഭാഗപരമായ തിരിച്ചറിയലും ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: אֵשֶׁת מַחְלוֹן
  choice: മഹ്ലോന്റെ ഭാര്യ
  rationale: സ്രോതസ്സ് ‘വിധവ’ എന്നു പറയാതെ ‘ഭാര്യ’ എന്നു പറയുന്നതിനാൽ അതേ നിർദ്ദിഷ്ടത നിലനിർത്തുന്നു.
- source_word: קָנִיתִי לִי
  choice: ഞാൻ എനിക്കു ... സ്വന്തമാക്കിയിരിക്കുന്നു
  rationale: קנה എന്ന ക്രിയയുടെ നിയമപരവും ഇടപാടുസംബന്ധവുമായ ‘നേടുക/വാങ്ങുക’ അർത്ഥം നിലനിർത്തുന്നു; രൂത്തിനെ വെറും വസ്തുവായി ചിത്രീകരിക്കുന്ന അതിവ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
- source_word: לְאִשָּׁה
  choice: ഭാര്യയായി
  rationale: വിവാഹപരമായ ഉദ്ദേശ്യവും നിയമസ്ഥിതിയും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לְהָקִים שֵׁם הַמֵּת
  choice: മരിച്ചവന്റെ പേര് ... നിലനിർത്തുന്നതിനും
  rationale: ‘പേര് ഉയർത്തുക/സ്ഥാപിക്കുക’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ കുടുംബവംശവും നിയമപരമായ അംഗീകാരവും തുടരുക എന്ന സന്ദർഭാർഥം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: עַל נַחֲלָתוֹ
  choice: അവന്റെ അവകാശത്തിന്മേൽ
  rationale: മരിച്ചവന്റെ പേരും പാരമ്പര്യസ്വത്തും തമ്മിലുള്ള നിയമബന്ധം സൂചിപ്പിക്കുന്ന עַל എന്നതിന്റെ രൂപകം പരമാവധി നിലനിർത്തുന്നു.
- source_word: וְלֹא יִכָּרֵת
  choice: അറ്റുപോകാതിരിക്കുന്നതിനും
  rationale: כרת എന്ന ക്രിയയുടെ ‘ഛേദിക്കപ്പെടുക/അറ്റുപോകുക’ എന്ന ഗൗരവമുള്ള പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: מֵעִם אֶחָיו
  choice: അവന്റെ സഹോദരന്മാരുടെ ഇടയിൽനിന്നും
  rationale: സ്രോതസ്സിലെ ‘സഹോദരന്മാർ’ എന്ന നിർദ്ദിഷ്ട പദം വിശാലമായ ‘ബന്ധുക്കൾ’ എന്നാക്കി വ്യാഖ്യാനിച്ചിട്ടില്ല.
- source_word: וּמִשַּׁעַר מְקוֹמוֹ
  choice: അവന്റെ പട്ടണവാതിൽക്കൽനിന്നും
  rationale: ‘അവന്റെ സ്ഥലത്തിന്റെ വാതിൽ’ എന്ന അക്ഷരാർഥത്തെ, നിയമകാര്യങ്ങൾ പരസ്യമായി തീർപ്പാക്കിയിരുന്ന പട്ടണവാതിൽ എന്ന സാംസ്കാരിക യാഥാർഥ്യത്തോടെ സ്വാഭാവികമാക്കുന്നു.
- source_word: עֵדִים אַתֶּם הַיּוֹם
  choice: നിങ്ങൾ ഇന്ന് സാക്ഷികളാകുന്നു
  rationale: സമ്മേളിച്ചവരോടുള്ള ഔപചാരിക നിയമപ്രഖ്യാപനം വർത്തമാനരൂപത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: 'രൂത്തിനോടുള്ള ബോവസിന്റെ നടപടി: നിയമപരമായ വീണ്ടെടുപ്പും വിവാഹവും'
  choice: ‘ഞാൻ എനിക്കു ഭാര്യയായി സ്വന്തമാക്കിയിരിക്കുന്നു’
  alternative: ‘ഞാൻ രൂത്തിനെ ഭാര്യയായി വാങ്ങിയിരിക്കുന്നു’ / ‘ഞാൻ രൂത്തിനെ ഭാര്യയായി സ്വീകരിച്ചിരിക്കുന്നു’
  rationale: ഇടപാടുസംബന്ധമായ קנה എന്ന ഭാഷയും വിവാഹോദ്ദേശ്യവും അവകാശപുനഃസ്ഥാപനവും ഒരുമിച്ചു സംരക്ഷിക്കുന്നു; വാങ്ങൽഭാഷയെ അതിരുകടന്ന് കടുപ്പിക്കുകയോ നിയമപരമായ വശം മായ്ച്ച് പ്രണയപരമായി മാത്രം അവതരിപ്പിക്കുകയോ ചെയ്യുന്നില്ല.
- issue: മരിച്ചവന്റെ പേര് നിലനിർത്തൽ
  choice: കുടുംബവംശവും പാരമ്പര്യസ്വത്തോടു ബന്ധപ്പെട്ട നിയമപരമായ അംഗീകാരവും തുടരുന്ന വിധത്തിൽ വിവർത്തനം ചെയ്തു
  alternative: ശാരീരിക സന്തതിയെ മാത്രം സൂചിപ്പിക്കുന്നതായി ചുരുക്കുക
  rationale: വാക്യത്തിൽ പേര്, അവകാശം, സഹോദരന്മാർ, പട്ടണവാതിൽ എന്നീ ഘടകങ്ങൾ ഒന്നിച്ചുവരുന്നതിനാൽ കുടുംബപരവും സാമൂഹിക-നിയമപരവുമായ പൂർണ്ണമായ സംഘർഷം നിലനിർത്തണം.
- issue: אֶחָיו എന്ന ബന്ധുപദം
  choice: സഹോദരന്മാർ
  alternative: ബന്ധുക്കൾ / കുലക്കാർ
  rationale: സന്ദർഭത്തിൽ വിശാല ബന്ധുവൃന്ദം ഉൾപ്പെടാമെങ്കിലും സ്രോതസ്സ് ഉപയോഗിക്കുന്ന നിർദ്ദിഷ്ട പദം മാറ്റാതെ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിയമപ്രഖ്യാപനത്തിന്റെ ഔപചാരികത നിലനിർത്തിയെങ്കിലും അനാവശ്യ പുരാതനഭാഷ ഒഴിവാക്കി. അടിക്കുറിപ്പുകളുടെ ക്രമം മുഖ്യവാചകത്തിൽ [a], [b], [c] എന്നിങ്ങനെ ക്രമപ്പെടുത്തി.
