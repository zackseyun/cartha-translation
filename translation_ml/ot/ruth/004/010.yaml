revisions:
- from: മോവാബ്യസ്ത്രീയായ രൂത്തിനെ[a]—മഹ്ലോന്റെ ഭാര്യയെ—ഞാൻ എനിക്കു ഭാര്യയായി സ്വന്തമാക്കിയിരിക്കുന്നു. മരിച്ചവന്റെ പേര് അവന്റെ അവകാശത്തിന്മേൽ നിലനിർത്തുന്നതിനും, മരിച്ചവന്റെ പേര് അവന്റെ സഹോദരന്മാരുടെ ഇടയിൽനിന്നും അവന്റെ പട്ടണവാതിൽക്കൽനിന്നും അറ്റുപോകാതിരിക്കുന്നതിനുമാണിത്.[b][c] നിങ്ങൾ ഇന്ന് സാക്ഷികളാകുന്നു.
  to: കൂടാതെ, മോവാബുകാരിയായ രൂത്തിനെ[a]—മഹ്ലോന്റെ ഭാര്യയെ—ഞാൻ എനിക്കായി ഭാര്യയായി സ്വന്തമാക്കിയിരിക്കുന്നു; മരിച്ചവന്റെ പേര് അവന്റെ പാരമ്പര്യസ്വത്തിന്മേൽ നിലനിർത്താനും, മരിച്ചവന്റെ പേര് അവന്റെ സഹോദരന്മാരുടെ ഇടയിൽനിന്നും അവന്റെ പട്ടണവാതിൽക്കൽനിന്നും അറ്റുപോകാതിരിക്കാനും. നിങ്ങൾ ഇന്ന് സാക്ഷികളാണ്.
  rationale: The revision restores the omitted additive conjunction, clarifies that the relevant inheritance is property rather than merely a legal right, and makes the final witness formula idiomatic while preserving its formal legal register. Footnote anchors and content remain structurally valid and correspond to the relevant expressions.
