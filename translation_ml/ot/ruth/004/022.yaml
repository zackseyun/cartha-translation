id: RUT.4.22
reference: Ruth 4:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עֹבֵד֙ הוֹלִ֣יד אֶת יִשָׁ֔י וְ/יִשַׁ֖י הוֹלִ֥יד אֶת דָּוִֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/022.yaml
  text: And Obed fathered Jesse[a], and Jesse fathered David.
translation:
  language: ml
  text: ഓബേദ് യിശ്ശായിയുടെ പിതാവായി; യിശ്ശായി ദാവീദിന്റെ പിതാവായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ
  choice: വാക്യഘടനയിലൂടെ ബന്ധിപ്പിച്ചു; പ്രത്യേകം ‘കൂടാതെ’ എന്നു ചേർത്തില്ല
  rationale: എബ്രായത്തിലെ വാവ് വംശാവലിയുടെ തുടർച്ച സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ രണ്ട് സമാന്തര ഉപവാക്യങ്ങളെ അർദ്ധവിരാമംകൊണ്ട് ബന്ധിപ്പിക്കുന്നത് സ്വാഭാവികമാണ്; ആവർത്തിച്ചുള്ള സംയോജകപദം ആവശ്യമില്ല.
- source_word: עֹבֵד
  choice: ഓബേദ്
  rationale: പേരിന്റെ എബ്രായ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന, മലയാള ബൈബിൾ വായനയിൽ പരിചിതമായ ലിപ്യന്തരണം.
- source_word: הוֹלִיד
  choice: ജനിപ്പിച്ചു
  rationale: ילד എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം വംശാവലിയിൽ ‘സന്താനത്തിന് പിതാവായി/ജനിപ്പിച്ചു’ എന്ന അർഥം നൽകുന്നു. ‘ജനിപ്പിച്ചു’ സംക്ഷിപ്തവും നിലവിലെ മലയാളത്തിൽ ഗ്രഹിക്കാവുന്നതുമായ വംശാവലിപ്രയോഗമാണ്.
- source_word: אֶת
  choice: പ്രത്യേകം വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: ഇത് നേരിട്ടുള്ള കർമത്തെ അടയാളപ്പെടുത്തുന്ന വ്യാകരണഘടകമാണ്; മലയാളത്തിലെ ‘-യെ’ എന്ന വിഭക്തിപ്രത്യയം അതിന്റെ പ്രവർത്തനം പ്രകടമാക്കുന്നു.
- source_word: יִשַׁי / יִשָׁי
  choice: യിശ്ശായി
  rationale: എബ്രായ പേരിനോട് അടുത്തതും മലയാള ക്രൈസ്തവ വായനയിൽ സ്ഥാപിതവുമായ രൂപം.
- source_word: דָּוִד
  choice: ദാവീദ്
  rationale: എബ്രായ നാമത്തിന്റെ മലയാളത്തിൽ സ്ഥാപിതമായ ലിപ്യന്തരണം.
theological_decisions:
- issue: വംശാവലിക്രിയയുടെ വിവർത്തനം
  choice: ജനിപ്പിച്ചു
  alternative: പിതാവായി; ജന്മം നൽകി
  rationale: വാക്യം ദാവീദിൽ അവസാനിക്കുന്ന നേരിട്ടുള്ള വംശാവലി പ്രസ്താവനയാണ്. ‘ജനിപ്പിച്ചു’ എബ്രായ ക്രിയയുടെ പുരുഷവംശപരമായ അർഥം നിലനിർത്തുന്നു; അതേസമയം പാഠത്തിൽ ഇല്ലാത്ത അധിക ദൈവശാസ്ത്രവാദം ഒന്നും ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വംശാവലിശൈലി ഉപയോഗിച്ചു. പേരുകൾ എബ്രായരൂപങ്ങളോട് അടുത്തുനിൽക്കുന്ന സ്ഥാപിത മലയാള ലിപ്യന്തരണങ്ങളിലാണ് നൽകിയിരിക്കുന്നത്.
