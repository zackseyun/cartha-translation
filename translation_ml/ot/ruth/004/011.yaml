revisions:
- from: 'അപ്പോൾ പട്ടണവാതിൽക്കൽ ഉണ്ടായിരുന്ന ജനമെല്ലാവരും മൂപ്പന്മാരും പറഞ്ഞു: “ഞങ്ങൾ സാക്ഷികളാണ്. നിന്റെ വീട്ടിലേക്കു വരുന്ന ഈ സ്ത്രീയെ യഹോവ റാഹേലിനെയും ലേയയെയുംപോലെ ആക്കട്ടെ; അവരിരുവരുമാണ് ഇസ്രായേൽഗൃഹം പണിതുയർത്തിയത്. എഫ്രാത്തയിൽ നീ അഭിവൃദ്ധിപ്പെടുകയും[a] ബേത്‌ലഹേമിൽ നിനക്കൊരു പേര് നേടുകയും ചെയ്യട്ടെ.”'
  to: 'അപ്പോൾ വാതിൽപ്പടിക്കൽ ഉണ്ടായിരുന്ന സകല ജനങ്ങളും മൂപ്പന്മാരും പറഞ്ഞു: “ഞങ്ങൾ സാക്ഷികളാണ്. നിന്റെ വീട്ടിലേക്കു വരുന്ന സ്ത്രീയെ യാഹ്‌വേ റാഹേലിനെയും ലേയയെയുംപോലെ ആക്കട്ടെ; അവരിരുവരും ഇസ്രായേൽഗൃഹം പണിതുയർത്തിയവരാണ്. എഫ്രാത്തയിൽ നീ അഭിവൃദ്ധിപ്പെടട്ടെ[a]; ബേത്‌ലഹേമിൽ പേര് നേടട്ടെ.”'
  rationale: The revision aligns the divine-name rendering with the mandated Yahweh policy, removes the unsupported demonstrative, and makes the final two clauses parallel Malayalam blessings. It retains the source’s household metaphor, place names, and the lexical ambiguity of חיל in the footnote.
