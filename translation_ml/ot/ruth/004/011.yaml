  text: וַ/יֹּ֨אמְר֜וּ כָּל הָ/עָ֧ם אֲשֶׁר בַּ/שַּׁ֛עַר וְ/הַ/זְּקֵנִ֖ים עֵדִ֑ים יִתֵּן֩ יְהוָ֨ה אֶֽת הָ/אִשָּׁ֜ה הַ/בָּאָ֣ה אֶל בֵּיתֶ֗/ךָ כְּ/רָחֵ֤ל וּ/כְ/לֵאָה֙ אֲשֶׁ֨ר בָּנ֤וּ שְׁתֵּי/הֶם֙ אֶת בֵּ֣ית יִשְׂרָאֵ֔ל וַ/עֲשֵׂה חַ֣יִל בְּ/אֶפְרָ֔תָה וּ/קְרָא שֵׁ֖ם בְּ/בֵ֥ית לָֽחֶם־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/011.yaml
  text: Then all the people who were at the gate[a], and the elders, said, “We are witnesses. May Yahweh make the woman who is coming into your house like Rachel and Leah, who together built up the house of Israel. And may you prosper in Ephrathah and proclaim a name in Bethlehem.”
translation:
  language: ml
  text: 'അപ്പോൾ വാതിൽപ്പടിക്കൽ ഉണ്ടായിരുന്ന സകല ജനങ്ങളും മൂപ്പന്മാരും പറഞ്ഞു: “ഞങ്ങൾ സാക്ഷികളാണ്. നിന്റെ വീട്ടിലേക്കു വരുന്ന സ്ത്രീയെ യാഹ്‌വേ റാഹേലിനെയും ലേയയെയുംപോലെ ആക്കട്ടെ; അവരിരുവരും ഇസ്രായേൽഗൃഹം പണിതുയർത്തിയവരാണ്. എഫ്രാത്തയിൽ നീ അഭിവൃദ്ധിപ്പെടട്ടെ[a]; ബേത്‌ലഹേമിൽ പേര് നേടട്ടെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “വീര്യം പ്രകടിപ്പിക്കട്ടെ,” “യോഗ്യത തെളിയിക്കട്ടെ,” അല്ലെങ്കിൽ “സമ്പന്നനാകട്ടെ.” ഹീബ്രു പ്രയോഗത്തിന് വീര്യം, ശക്തി, സമ്പത്ത്, അല്ലെങ്കിൽ വിജയകരമായ അഭിവൃദ്ധി എന്നീ അർഥങ്ങൾ ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵדִים
  choice: ഞങ്ങൾ സാക്ഷികളാണ്
  rationale: ഹീബ്രുവിൽ നാമപദം മാത്രമാണെങ്കിലും നേരിട്ടുള്ള പ്രസംഗത്തിൽ സൂചിതമായ ‘ആണ്’ ചേർക്കുന്നത് മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: יִתֵּן יְהוָה
  choice: യഹോവ ... ആക്കട്ടെ
  rationale: ‘കൊടുക്കുക’ എന്ന അടിസ്ഥാനാർഥമുള്ള נתן ഇവിടെ താരതമ്യത്തോടുകൂടിയ ആശീർവാദപ്രയോഗമായതിനാൽ ‘ആക്കട്ടെ’ എന്നത് ആശംസാഭാവവും സന്ദർഭാർഥവും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണത്തിലൂടെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- source_word: הָאִשָּׁה הַבָּאָה אֶל בֵּיתֶךָ
  choice: നിന്റെ വീട്ടിലേക്കു വരുന്ന ഈ സ്ത്രീ
  rationale: വിവാഹത്തിലൂടെ വീട്ടിലേക്കു പ്രവേശിക്കുന്നതിന്റെ മൂർത്തമായ ദൃശ്യവും വർത്തമാനകൃദന്തത്തിന്റെ ആസന്നതയും നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ വ്യക്തയായ സ്ത്രീയെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ‘ഈ’ സ്വാഭാവികമാണ്.
- source_word: כְּרָחֵל וּכְלֵאָה
  choice: റാഹേലിനെയും ലേയയെയുംപോലെ
  rationale: താരതമ്യവും പേരുകളും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: אֲשֶׁר בָּנוּ שְׁתֵּיהֶם אֶת בֵּית יִשְׂרָאֵל
  choice: അവരിരുവരുമാണ് ഇസ്രായേൽഗൃഹം പണിതുയർത്തിയത്
  rationale: കുടുംബവംശം സ്ഥാപിച്ചതിനെ സൂചിപ്പിക്കുന്ന ‘പണിയുക’ എന്ന രൂപകം നിലനിർത്തിക്കൊണ്ട് שְׁתֵּיהֶם എന്ന ഊന്നൽ ‘അവരിരുവരുമാണ്’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: וַעֲשֵׂה חַיִל
  choice: നീ അഭിവൃദ്ധിപ്പെടുകയും
  rationale: חיל എന്നതിന്റെ ശക്തി, വീര്യം, സമ്പത്ത്, വിജയം എന്നീ വിശാലാർഥങ്ങളിൽ വിവാഹാശീർവാദസന്ദർഭത്തിന് യോജിച്ച ‘അഭിവൃദ്ധിപ്പെടുക’ തെരഞ്ഞെടുത്തു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: בְּאֶפְרָתָה
  choice: എഫ്രാത്തയിൽ
  rationale: ഹീബ്രു സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്ത് പ്രാദേശിക സൂചന നിലനിർത്തുന്നു.
- source_word: וּקְרָא שֵׁם
  choice: നിനക്കൊരു പേര് നേടുകയും
  rationale: അക്ഷരാർഥത്തിൽ ‘ഒരു പേര് വിളിക്കുക/പ്രഖ്യാപിക്കുക’ എന്ന പ്രയോഗം ഇവിടെ കീർത്തിയോ പ്രശസ്തിയോ നേടുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘പേര് നേടുക’ രൂപകവും അർഥവും സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
- source_word: בְּבֵית לָחֶם
  choice: ബേത്‌ലഹേമിൽ
  rationale: സ്ഥലനാമത്തെ സാധാരണ മലയാള ലിപ്യന്തരണത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ ദൈവനാമം ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: റാഹേലും ലേയയും ‘ഇസ്രായേൽഗൃഹം പണിതു’ എന്ന രൂപകം
  choice: ഇസ്രായേൽഗൃഹം പണിതുയർത്തിയത്
  alternative: ഇസ്രായേൽവംശത്തെ സ്ഥാപിച്ചത്
  rationale: വംശസ്ഥാപനമാണ് സന്ദർഭാർഥമെങ്കിലും ഹീബ്രുവിലെ ‘വീട് പണിയുക’ എന്ന പ്രധാന രൂപകവും അതിലെ ദൈവശാസ്ത്രപരമായ കുടുംബ-ജനതാ ബന്ധവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആശീർവാദശൈലി ഉപയോഗിച്ചു. നിയമസാക്ഷ്യത്തിന്റെ ഔപചാരികതയും കുടുംബം പണിയുന്ന ഹീബ്രു രൂപകവും നിലനിർത്തി; ദുഷ്കരമായ חיל എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
