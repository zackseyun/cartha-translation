    issue: ജനിപ്പിച്ചു may be read as physical birthing rather than paternal descent.
    rationale: Although it is used in some Bible-style genealogies, modern standard Malayalam more clearly expresses a male ancestor’s genealogical relation with “പിതാവായി.” This better reflects the subject Perez and the genealogical sense of הוֹלִיד.
