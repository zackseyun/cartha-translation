lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ഇതാണ്
  rationale: വാവോടുകൂടിയ ചൂണ്ടുപദം ഇവിടെ പുതിയ വംശാവലിഭാഗം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ അനാവശ്യമായ കാലസൂചന ചേർക്കാതെ സ്വാഭാവികമായി ആ അവതരണശക്തി നൽകുന്നു.
- source_word: תּוֹלְדוֹת
  choice: വംശപരമ്പര
  rationale: ഇവിടെ പദം പേരെസിൽനിന്നുള്ള വംശാവലിരേഖയെ സൂചിപ്പിക്കുന്നു. ‘വംശപരമ്പര’ സൂത്രവാക്യത്തിന്റെ ഔപചാരികതയും സാധാരണ വായനക്കാർക്കുള്ള വ്യക്തതയും നിലനിർത്തുന്നു.
- source_word: פָּרֶץ
  choice: പേരെസ്
  rationale: എബ്രായരൂപത്തെ അടിസ്ഥാനമാക്കിയുള്ള മലയാള ലിപ്യന്തരണം.
- source_word: הוֹלִיד
  choice: ജനിപ്പിച്ചു
  rationale: ילד എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം വംശാവലിയിൽ ‘പിതാവായി/ജനിപ്പിച്ചു’ എന്ന അർഥം നൽകുന്നു. ‘ജനിപ്പിച്ചു’ സംക്ഷിപ്തവും മലയാള ബൈബിൾ വംശാവലിശൈലിയിൽ സ്വാഭാവികവുമാണ്.
- source_word: אֶת
  choice: '[നേരിട്ടുള്ള കർമചിഹ്നം; വിവർത്തനം ചെയ്തിട്ടില്ല]'
  rationale: ഇത് നിർദിഷ്ട നേരിട്ടുള്ള കർമത്തെ അടയാളപ്പെടുത്തുന്ന എബ്രായ കണികയാണ്; മലയാളത്തിൽ പ്രത്യേക പദസമാനത ആവശ്യമില്ല.
- source_word: חֶצְרוֹן
  choice: ഹെസ്രോൻ
  rationale: എബ്രായനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
