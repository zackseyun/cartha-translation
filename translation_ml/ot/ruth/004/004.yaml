source:
  edition: WLC
  text: וַ/אֲנִ֨י אָמַ֜רְתִּי אֶגְלֶ֧ה אָזְנְ/ךָ֣ לֵ/אמֹ֗ר קְ֠נֵה נֶ֥גֶד הַֽ/יֹּשְׁבִים֮ וְ/נֶ֣גֶד זִקְנֵ֣י עַמִּ/י֒ אִם תִּגְאַל֙ גְּאָ֔ל וְ/אִם לֹ֨א יִגְאַ֜ל הַגִּ֣ידָ/ה לִּ֗/י ו/אדע כִּ֣י אֵ֤ין זוּלָֽתְ/ךָ֙ לִ/גְא֔וֹל וְ/אָנֹכִ֖י אַחֲרֶ֑י/ךָ וַ/יֹּ֖אמֶר אָנֹכִ֥י אֶגְאָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/004.yaml
  text: So I thought I should inform you[a], saying, ‘Buy it in the presence of those sitting here and in the presence of the elders of my people. If you will redeem it, redeem it; but if he will not redeem it, tell me, so that I may know, for there is no one besides you to redeem it, and I am after you.’ And he said[b], ‘I will redeem it.’
translation:
  language: ml
  text: 'ഞാനോ, ‘ഇവിടെ ഇരിക്കുന്നവരുടെയും എന്റെ ജനത്തിന്റെ മൂപ്പന്മാരുടെയും സന്നിധിയിൽവെച്ച് അതു വാങ്ങിക്കൊള്ളുക’ എന്നു പറഞ്ഞ് നിന്നെ അറിയിക്കണമെന്നു വിചാരിച്ചു[a]. നീ അതു വീണ്ടെടുക്കുമെങ്കിൽ, വീണ്ടെടുക്കുക; എന്നാൽ അവൻ അതു വീണ്ടെടുക്കുകയില്ലെങ്കിൽ[b], എന്നോടു പറയുക; ഞാൻ അറിയട്ടെ. അതു വീണ്ടെടുക്കാൻ നിന്നെയല്ലാതെ മറ്റാരുമില്ല; നിനക്കുശേഷം ഞാനാണ്.” അയാൾ പറഞ്ഞു: “ഞാൻ അതു വീണ്ടെടുക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘നിന്റെ ചെവി തുറക്കുക’; ‘നിന്നെ അറിയിക്കുക’ അല്ലെങ്കിൽ ‘നിന്നെ വിവരം ധരിപ്പിക്കുക’ എന്നർഥമുള്ള ഒരു പ്രയോഗമാണിത്.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപാഠത്തിൽ ‘അവൻ വീണ്ടെടുക്കുകയില്ലെങ്കിൽ’ എന്നാണ്. രണ്ടാംപുരുഷനോടു സംസാരിക്കുന്ന ഈ സന്ദർഭത്തിൽ ചിലർ ഇതിനെ ‘നീ വീണ്ടെടുക്കുകയില്ലെങ്കിൽ’ എന്നു ഗ്രഹിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶגְלֶה אָזְנְךָ
  choice: നിന്നെ അറിയിക്കുക
  rationale: ‘നിന്റെ ചെവി തുറക്കുക’ എന്ന അക്ഷരാർഥമുള്ള എബ്രായ പ്രയോഗത്തിന്റെ ഉദ്ദേശ്യം ഒരാളെ വിവരം അറിയിക്കുക എന്നതാണ്. ആ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: קְנֵה
  choice: വാങ്ങിക്കൊള്ളുക
  rationale: קנה എന്ന ക്രിയയ്ക്ക് വാങ്ങുക, സ്വന്തമാക്കുക എന്നീ അർഥങ്ങളുണ്ട്. ഇവിടെ സ്വത്തുസംബന്ധമായ പരസ്യമായ നിയമനടപടിയാണ്; സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സന്ദർഭത്തിന് യോജിച്ചതുമായ ‘വാങ്ങിക്കൊള്ളുക’ തിരഞ്ഞെടുത്തു.
- source_word: נֶגֶד הַיֹּשְׁבִים
  choice: ഇവിടെ ഇരിക്കുന്നവരുടെ സന്നിധിയിൽവെച്ച്
  rationale: נגד സാക്ഷികളുടെ മുമ്പാകെയുള്ള പരസ്യനടപടിയെ സൂചിപ്പിക്കുന്നു; participle ആയ הַיֹּשְׁבִים കവാടത്തിൽ സന്നിഹിതരായി ഇരിക്കുന്നവരെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: זִקְנֵי עַמִּי
  choice: എന്റെ ജനത്തിന്റെ മൂപ്പന്മാർ
  rationale: സമൂഹത്തിലെ അംഗീകൃത നേതാക്കളെയാണ് ഈ പദസമുച്ചയം സൂചിപ്പിക്കുന്നത്. עַמִּי എന്നതിനെ അനാവശ്യമായി ‘കുലം’ എന്നു ചുരുക്കാതെ ‘എന്റെ ജനം’ എന്നു നിലനിർത്തുന്നു.
- source_word: תִּגְאַל ... גְּאָל
  choice: നീ അതു വീണ്ടെടുക്കുമെങ്കിൽ, വീണ്ടെടുക്കുക
  rationale: גאל എന്ന പ്രധാന നിയമ-കുടുംബബന്ധ പദത്തിന് ‘വീണ്ടെടുക്കുക’ എന്നു നൽകി, എബ്രായത്തിലെ ആവർത്തനവും അതിലൂടെ വരുന്ന ഊന്നലും നിലനിർത്തുന്നു.
- source_word: וְאִם לֹא יִגְאַל
  choice: എന്നാൽ അവൻ അതു വീണ്ടെടുക്കുകയില്ലെങ്കിൽ
  rationale: മസോററ്റിക് പാഠത്തിലെ ക്രിയ മൂന്നാംപുരുഷ ഏകവചനത്തിലാണ്. രണ്ടാംപുരുഷ അഭിസംബോധനയ്ക്കിടയിലെ ഈ പെട്ടെന്നുള്ള മാറ്റം അസ്വാഭാവികമായി തോന്നിയാലും അതു മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുകയും കൂടുതൽ സുഗമമായ മറ്റൊരു ഗ്രഹിക്കൽ അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: הַגִּידָה לִּי
  choice: എന്നോടു പറയുക
  rationale: നേരിട്ടുള്ള ആജ്ഞയെ ലളിതവും മാന്യവുമായ സാധാരണ മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֵין זוּלָתְךָ
  choice: നിന്നെയല്ലാതെ മറ്റാരുമില്ല
  rationale: זוּלָתְךָ പ്രകടിപ്പിക്കുന്ന ഒഴിവാക്കലും ഏകാവകാശവും സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: וְאָנֹכִי אַחֲרֶיךָ
  choice: നിനക്കുശേഷം ഞാനാണ്
  rationale: വീണ്ടെടുപ്പിനുള്ള നിയമാവകാശത്തിന്റെ ക്രമത്തിൽ സംസാരിക്കുന്നവൻ അടുത്തയാളാണെന്ന അർഥം സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
- source_word: אָנֹכִי אֶגְאָל
  choice: ഞാൻ അതു വീണ്ടെടുക്കാം
  rationale: മുമ്പ് പറഞ്ഞ സ്വത്തിനെ സൂചിപ്പിക്കാൻ മലയാളത്തിൽ ആവശ്യമായ ‘അതു’ ചേർക്കുന്നു. ‘വീണ്ടെടുക്കാം’ എന്നത് അവകാശവും ഉത്തരവാദിത്വവും ഏറ്റെടുക്കുന്ന സമ്മതപ്രതികരണമായി സ്വാഭാവികമാണ്.
theological_decisions:
- issue: കുടുംബ-നിയമപരമായ സന്ദർഭത്തിലെ גאל എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: വീണ്ടെടുക്കുക
  alternative: അടുത്ത ബന്ധുവെന്ന നിലയിൽ വീണ്ടെടുക്കുക; തിരികെ വാങ്ങുക
  rationale: ഈ വാക്യത്തിൽ കുടുംബസ്വത്ത് വീണ്ടെടുക്കാനുള്ള ബന്ധുവിന്റെ അവകാശവും ഉത്തരവാദിത്വവുമാണ് പശ്ചാത്തലം. ‘വീണ്ടെടുക്കുക’ നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ പദബന്ധം നിലനിർത്തുന്നു; ‘ബന്ധു-വീണ്ടെടുപ്പുകാരൻ’ പോലുള്ള വ്യാഖ്യാനാത്മക ആശയം ഓരോ പ്രയോഗത്തിലും പാഠത്തിലേക്ക് ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ഭാഷ ഉപയോഗിച്ചു. കവാടത്തിലെ പരസ്യമായ നിയമനടപടിയുടെ ഭാവം ‘സന്നിധിയിൽവെച്ച്’ എന്ന പ്രയോഗത്തിലൂടെ നിലനിർത്തി. ഗൗരവമുള്ള പ്രധാന പദമായി ‘വീണ്ടെടുക്കുക’ സ്ഥിരമായി ഉപയോഗിച്ചു; എന്നാൽ സാധാരണ വായനക്കാരനു അനാവശ്യമായി സാങ്കേതികമായ സംയുക്തപദങ്ങൾ ഒഴിവാക്കി. മസോററ്റിക് പാഠത്തിലെ രണ്ടാംപുരുഷത്തിൽനിന്ന് മൂന്നാംപുരുഷത്തിലേക്കുള്ള മാറ്റം തിരുത്താതെ സംരക്ഷിച്ചു.
