  text: וַ/תֹּאמַ֤רְנָה הַ/נָּשִׁים֙ אֶֽל נָעֳמִ֔י בָּר֣וּךְ יְהוָ֔ה אֲ֠שֶׁר לֹ֣א הִשְׁבִּ֥ית לָ֛/ךְ גֹּאֵ֖ל הַ/יּ֑וֹם וְ/יִקָּרֵ֥א שְׁמ֖/וֹ בְּ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/014.yaml
  text: Then the women said to Naomi[a], “Blessed be Yahweh, who has not left you without a redeemer today[c][b], and may his name be renowned in Israel.”
translation:
  language: ml
  text: 'അപ്പോൾ ആ സ്ത്രീകൾ നൊവൊമിയോടു പറഞ്ഞു: “ഇന്നു നിന്നെ ഒരു വീണ്ടെടുപ്പുകാരനില്ലാതെ വിടാതിരുന്ന യഹോവ വാഴ്ത്തപ്പെട്ടവനായിരിക്കട്ടെ![a][b] അവന്റെ പേര് ഇസ്രായേലിൽ പ്രസിദ്ധമാകട്ടെ.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വീണ്ടെടുപ്പുകാരൻ’ എന്നതിന് ‘ബന്ധുവായ വീണ്ടെടുപ്പുകാരൻ’ അഥവാ ‘കുടുംബസംരക്ഷകനായ വീണ്ടെടുപ്പുകാരൻ’ എന്നും പരിഭാഷപ്പെടുത്താം. അടുത്ത ബന്ധു ഒരു കുടുംബത്തിന്റെ അവകാശവും വംശപരമ്പരയും സംരക്ഷിച്ചു പുനഃസ്ഥാപിക്കുന്ന കുടുംബ-നിയമപരമായ ചുമതലയാണ് ഈ പദം എടുത്തുകാട്ടുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടത്തെ ‘വീണ്ടെടുപ്പുകാരൻ’ നൊവൊമിയെ പുനഃസ്ഥാപിക്കുന്ന നവജാതശിശുവിനെ പ്രത്യേകമായി സൂചിപ്പിക്കാം. എന്നാൽ ഈ അധ്യായത്തിൽ വീണ്ടെടുപ്പുകാരനായി പ്രവർത്തിക്കുന്ന ബോവസിന്റെ പങ്കിന്റെ വെളിച്ചത്തിൽ ചിലർ ഇതിനെ കൂടുതൽ വിപുലമായി മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
  - marker: c
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘അവന്റെ പേര് ഇസ്രായേലിൽ വിളിക്കപ്പെടട്ടെ.’ അവന്റെ പേര് ഇസ്രായേലിൽ അറിയപ്പെടുകയും പരാമർശിക്കപ്പെടുകയും ആദരിക്കപ്പെടുകയും ചെയ്യട്ടെ എന്നാണ് ഈ പ്രയോഗത്തിന്റെ ആശയം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמַרְנָה
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവു-തുടർച്ചയുള്ള ക്രിയ ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തെ അവതരിപ്പിക്കുന്നു. ‘അപ്പോൾ’ സ്വാഭാവികമായ മലയാള ആഖ്യാനക്രമം നൽകുന്നു.
- source_word: הַנָּשִׁים
  choice: ആ സ്ത്രീകൾ
  rationale: നിശ്ചിത ബഹുവചനനാമം; ഈ രംഗത്തുള്ള സമൂഹത്തിലെ സ്ത്രീകളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: בָּרוּךְ יְהוָה
  choice: യഹോവ വാഴ്ത്തപ്പെട്ടവൻ
  rationale: എബ്രായത്തിലെ പതിവായ അനുഗ്രഹ-സ്തുതിസൂത്രത്തിന്റെ രൂപവും ഗൗരവവും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവികൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പതിവായ ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: אֲשֶׁר לֹא הִשְׁבִּית לָךְ
  choice: നിന്നെ ... ഇല്ലാതെ വിടാതിരുന്ന
  rationale: ഹിഫീൽ രൂപത്തിന്റെ ‘കുറവുവരുത്തുക/ഇല്ലാതാക്കുക’ എന്ന ആശയം സന്ദർഭോചിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: גֹּאֵל
  choice: വീണ്ടെടുപ്പുകാരൻ
  rationale: കുടുംബത്തിലെ അടുത്ത ബന്ധു കുടുംബാവകാശവും വംശപരമ്പരയും സംരക്ഷിച്ചു പുനഃസ്ഥാപിക്കുന്ന നിയമപരമായ ചുമതലയുള്ളവനെ സൂചിപ്പിക്കുന്ന മുഖ്യപദം. പ്രധാനവാചകത്തിൽ സംക്ഷിപ്തപദം നിലനിർത്തി അതിന്റെ കുടുംബ-നിയമപരമായ ഭാവം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַיּוֹם
  choice: ഇന്ന്
  rationale: കാലസൂചനയെ ആധുനിക മലയാളത്തിൽ നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: וְיִקָּרֵא שְׁמוֹ
  choice: അവന്റെ പേര് ... പ്രസിദ്ധമാകട്ടെ
  rationale: അക്ഷരാർഥത്തിൽ ‘അവന്റെ പേര് വിളിക്കപ്പെടട്ടെ’ എന്നാണെങ്കിലും, ഈ അനുഗ്രഹസന്ദർഭത്തിൽ പേര് അറിയപ്പെടുകയും മാനിക്കപ്പെടുകയും ചെയ്യുക എന്ന പ്രയോഗാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּיִשְׂרָאֵל
  choice: ഇസ്രായേലിൽ
  rationale: ആ പേര് അറിയപ്പെടേണ്ടതും മാനിക്കപ്പെടേണ്ടതുമായ സമൂഹപരിധിയെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: גֹּאֵל (‘വീണ്ടെടുപ്പുകാരൻ’) ആരെ സൂചിപ്പിക്കുന്നു?
  choice: പ്രധാനവാചകത്തിൽ ‘വീണ്ടെടുപ്പുകാരൻ’ എന്ന പദം മാത്രം നൽകി, അത് നവജാതശിശുവിനെയോ ബോവസിന്റെ വീണ്ടെടുപ്പുപ്രവർത്തനത്തെയോ എന്ന് നിർണയിക്കാതെ വിടുന്നു.
  alternative: അത് പ്രത്യേകമായി ജനിച്ച ശിശുവായ ഓബേദിനെ സൂചിപ്പിക്കുന്നു; അല്ലെങ്കിൽ കുടുംബവീണ്ടെടുപ്പുകാരനായി പ്രവർത്തിച്ച ബോവസിനെ സൂചിപ്പിക്കുന്നു.
  rationale: ജനനവിവരണത്തിനു തൊട്ടുപിന്നാലെയുള്ള സന്ദർഭവും ‘അവന്റെ പേര്’ എന്ന തുടർവാക്യവും ശിശുവിനെ സമീപസൂച്യനാക്കുന്നു. എന്നാൽ അധ്യായത്തിലെ നിയമപരമായ വീണ്ടെടുപ്പുപശ്ചാത്തലം ബോവസിന്റെ പങ്കും സജീവമായി നിലനിർത്തുന്നു. അതിനാൽ എബ്രായവാചകത്തിലെ യഥാർഥ അനിശ്ചിതത്വം പരിഭാഷയിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘വീണ്ടെടുപ്പുകാരൻ’ എന്ന ദൈവശാസ്ത്ര-നിയമപരമായ മുഖ്യപദം നിലനിർത്തി അതിന്റെ പ്രത്യേക കുടുംബപശ്ചാത്തലം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു. സൂച്യന്റെ അനിശ്ചിതത്വം പ്രധാനവാചകത്തിൽ പരിഹരിക്കാതെ സംരക്ഷിച്ചു.
