reference: Ruth 4:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ לַ/גֹּאֵ֔ל חֶלְקַת֙ הַ/שָּׂדֶ֔ה אֲשֶׁ֥ר לְ/אָחִ֖י/נוּ לֶ/אֱלִימֶ֑לֶךְ מָכְרָ֣ה נָעֳמִ֔י הַ/שָּׁ֖בָה מִ/שְּׂדֵ֥ה מוֹאָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/003.yaml
  text: Then he said to the redeemer[a], “Naomi, who has returned from the fields of Moab[c][b], is selling the portion of the field that belonged to our brother Elimelech.”
translation:
  language: ml
  text: 'അപ്പോൾ അവൻ ആ വീണ്ടെടുപ്പുകാരനോടു പറഞ്ഞു: “മോവാബ് നാട്ടിൽനിന്ന്[b] മടങ്ങിവന്ന നൊവൊമി, നമ്മുടെ സഹോദരനായ എലീമേലെക്കിന്റേതായിരുന്ന വയലിന്റെ ഒരു ഭാഗം[a] വിൽക്കുകയാണ്[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ആ ഭൂമിക്കഷണം.”
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം “മോവാബിന്റെ വയൽപ്രദേശത്തുനിന്ന്”; മോവാബ് ദേശത്തെയോ നാട്ടിൻപ്രദേശത്തെയോ സൂചിപ്പിക്കുന്ന ഒരു പ്രയോഗമാണിത്.
    reason: cultural_note
  - marker: c
    text: അല്ലെങ്കിൽ, “വിറ്റിരിക്കുന്നു.” എബ്രായ ക്രിയാരൂപം പൂർത്തിയായ പ്രവൃത്തിയായി മനസ്സിലാക്കാം; എന്നാൽ ഇവിടെ നടന്നുകൊണ്ടിരിക്കുന്ന നിയമചർച്ചയുടെ പശ്ചാത്തലത്തിൽ വർത്തമാനമായി പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ അവൻ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച കഥയിലെ അടുത്ത സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നതിനാൽ, സ്വാഭാവികമായ മലയാളത്തിൽ ‘അപ്പോൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: לַגֹּאֵל
  choice: ആ വീണ്ടെടുപ്പുകാരനോട്
  rationale: גֹּאֵל കുടുംബബന്ധത്തിന്റെ അടിസ്ഥാനത്തിൽ വീണ്ടെടുപ്പിനുള്ള നിയമപരമായ ഉത്തരവാദിത്വമുള്ള വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. മുൻസന്ദർഭത്തിൽ തിരിച്ചറിയപ്പെട്ട വ്യക്തിയായതിനാൽ ‘ആ’ ചേർത്തു.
- source_word: חֶלְקַת הַשָּׂדֶה
  choice: വയലിന്റെ ഓഹരി
  rationale: חֶלְקָה ഒരു വിഹിതത്തെയോ പ്രത്യേക ഭൂമിക്കഷണത്തെയോ സൂചിപ്പിക്കുന്നു; ‘വയലിന്റെ ഓഹരി’ എബ്രായരൂപത്തോട് അടുത്തും മലയാളത്തിൽ വ്യക്തവുമാണ്.
- source_word: אֲשֶׁר לְאָחִינוּ לֶאֱלִימֶלֶךְ
  choice: നമ്മുടെ സഹോദരനായ എലീമേലെക്കിന്റേതായിരുന്ന
  rationale: ലാമെദ് ഘടന ഉടമസ്ഥതയെയോ ബന്ധത്തെയോ സൂചിപ്പിക്കുന്നു. ‘സഹോദരൻ’ ഇവിടെ വിശാലമായ കുടുംബബന്ധഭാഷയായിരിക്കാം; അതിനെ കൂടുതൽ നിർദിഷ്ടമായ ബന്ധമാക്കി മാറ്റിയിട്ടില്ല.
- source_word: מָכְרָה
  choice: വിൽക്കുകയാണ്
  rationale: പൂർണ്ണക്രിയാരൂപം പൂർത്തിയായ പ്രവൃത്തിയായി വായിക്കാമെങ്കിലും, ഇപ്പോൾ നടക്കുന്ന നിയമചർച്ചയിൽ വിൽപ്പനയ്ക്കു വെച്ചിരിക്കുന്നതെന്ന ഇപ്പോഴത്തെ അർഥം സന്ദർഭോചിതമാണ്. മറ്റുവായന അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: נָעֳמִי
  choice: നൊവൊമി
  rationale: മലയാള ബൈബിൾപരമ്പരയിൽ പരിചിതമായ പേരുരൂപം ഉപയോഗിച്ചു.
- source_word: הַשָּׁבָה
  choice: മടങ്ങിവന്ന
  rationale: നൊവൊമിയെ ‘മടങ്ങിവന്നവൾ’ എന്നു തിരിച്ചറിയിക്കുന്ന നിർദിഷ്ട പങ്കാളിക്രിയയുടെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
- source_word: מִשְּׂדֵה מוֹאָב
  choice: മോവാബ് നാട്ടിൽനിന്ന്
  rationale: അക്ഷരാർഥത്തിലെ ‘മോവാബിന്റെ വയൽ/വയൽപ്രദേശം’ എന്നത് മോവാബ് ദേശത്തെയോ നാട്ടിൻപ്രദേശത്തെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. സാധാരണ വായനക്കാർക്കായി സ്വാഭാവികമായ ‘മോവാബ് നാട്’ ഉപയോഗിച്ച് അക്ഷരാർഥം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
theological_decisions:
- issue: גֹּאֵל എന്ന നിയമ-കുടുംബപദത്തിന്റെ പരിഭാഷ
  choice: വീണ്ടെടുപ്പുകാരൻ
  alternative: അടുത്ത ബന്ധു / ബന്ധു-വീണ്ടെടുപ്പുകാരൻ
  rationale: പദത്തിന്റെ നിയമപരമായ വീണ്ടെടുപ്പുചുമതല നിലനിർത്തുകയും, ബന്ധത്തിന്റെ കൃത്യസ്വഭാവം അനാവശ്യമായി നിർണ്ണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: מָכְרָה എന്ന പൂർണ്ണക്രിയയുടെ കാലസൂചന
  choice: വിൽക്കുകയാണ്
  alternative: വിറ്റിരിക്കുന്നു
  rationale: നിയമപരമായ ഇടപാട് ഇപ്പോഴും ചർച്ചയിലാണെന്ന സന്ദർഭം വർത്തമാനപ്രക്രിയയെ പിന്തുണയ്ക്കുന്നു; എങ്കിലും പൂർത്തിയായ വിൽപ്പന എന്ന വ്യാകരണസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. നിയമപരമായ ‘വീണ്ടെടുപ്പുകാരൻ’, ഭൂമിയുടെ ‘ഓഹരി’ എന്നീ പ്രധാന ആശയങ്ങൾ നിലനിർത്തി; അപരിചിതമായ എബ്രായ ഭൂമിശാസ്ത്രപ്രയോഗവും ക്രിയാകാലത്തിലെ ദ്വയാർഥവും അടിക്കുറിപ്പുകളിൽ വ്യക്തമാക്കി.
