source:
  edition: WLC
  text: וּ/בֹ֨עַז עָלָ֣ה הַ/שַּׁעַר֮ וַ/יֵּ֣שֶׁב שָׁם֒ וְ/הִנֵּ֨ה הַ/גֹּאֵ֤ל עֹבֵר֙ אֲשֶׁ֣ר דִּבֶּר בֹּ֔עַז וַ/יֹּ֛אמֶר ס֥וּרָ/ה שְׁבָ/ה פֹּ֖ה פְּלֹנִ֣י אַלְמֹנִ֑י וַ/יָּ֖סַר וַ/יֵּשֵֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/001.yaml
  text: Boaz had gone up to the gate and sat down there[a], and behold, the kinsman-redeemer of whom Boaz had spoken was passing by. So he said, "Turn aside, sit down here[b], so-and-so." And he turned aside and sat down.
translation:
  language: ml
  text: ബോവസ് പട്ടണവാതിലിലേക്കു കയറിച്ചെന്ന് അവിടെ ഇരുന്നു.[a] അപ്പോഴതാ, ബോവസ് പറഞ്ഞിരുന്ന വീണ്ടെടുപ്പുകാരനായ ബന്ധു അതുവഴി കടന്നുപോകുകയായിരുന്നു. ബോവസ് അയാളോട്, “അമുകനേ, ഇങ്ങോട്ടു മാറിവന്ന് ഇരിക്കൂ”[b] എന്നു പറഞ്ഞു. അയാൾ ഇങ്ങോട്ടു മാറിവന്ന് ഇരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പുരാതന ഇസ്രായേലിൽ പട്ടണവാതിൽ നിയമപരവും പൗരപരവുമായ കാര്യങ്ങൾക്കുള്ള പൊതുസ്ഥലമായിരുന്നു.
    reason: cultural_note
  - marker: b
    text: എബ്രായത്തിൽ ‘പെലോനി അൽമോനി’; ആ മനുഷ്യന്റെ പേര് മനപ്പൂർവം പറയാതെ, ‘അമുകൻ’ അല്ലെങ്കിൽ ‘ആരോ ഒരാൾ’ എന്ന അർഥത്തിൽ ഉപയോഗിച്ച പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה הַשַּׁעַר
  choice: പട്ടണവാതിലിലേക്കു കയറിച്ചെന്ന്
  rationale: עָלָה എന്നതിന്റെ ‘കയറുക/മുകളിലേക്കു പോകുക’ എന്ന ദിശാഭാവം നിലനിർത്തുന്നു; മലയാളത്തിൽ ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ചലനം സ്വാഭാവികമായി പറയുന്നു. ‘പട്ടണ’ എന്നത് സന്ദർഭത്തിലെ നഗരവാതിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְהִנֵּה
  choice: അപ്പോൾ
  rationale: സംഭവവികാസത്തിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു വ്യവഹാരചിഹ്നം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പകരുന്നു; അതിശയസൂചനയെ അനാവശ്യമായി ശക്തമാക്കുന്നില്ല.
- source_word: הַגֹּאֵל
  choice: വീണ്ടെടുപ്പുകാരനായ ബന്ധു
  rationale: גֹּאֵל എന്ന പദത്തിലെ കുടുംബബന്ധവും നിയമപരമായ വീണ്ടെടുപ്പുചുമതലയും ഒരുമിച്ചു വ്യക്തമാക്കുന്നു; വെറും ‘വീണ്ടെടുപ്പുകാരൻ’ എന്നതിനെക്കാൾ സന്ദർഭസൂക്ഷ്മമാണ്.
- source_word: עֹבֵר
  choice: അതുവഴി കടന്നുപോകുകയായിരുന്നു
  rationale: പങ്കാളിക്രിയയുടെ നടന്നുകൊണ്ടിരിക്കുന്ന ഭാവം മലയാളത്തിലെ തുടർച്ചാഭൂതകാലംകൊണ്ട് പ്രകടമാക്കുന്നു.
- source_word: אֲשֶׁר דִּבֶּר בֹּעַז
  choice: ബോവസ് പറഞ്ഞിരുന്ന
  rationale: മുമ്പ് പരാമർശിക്കപ്പെട്ട അതേ വ്യക്തിയാണെന്ന് സംക്ഷിപ്തവും സ്വാഭാവികവുമായി തിരിച്ചറിയിക്കുന്നു.
- source_word: סוּרָה שְׁבָה פֹה
  choice: ഇങ്ങോട്ടു മാറിവന്ന് ഇവിടെ ഇരിക്കൂ
  rationale: വഴിയിൽനിന്ന് മാറിവരാനുള്ള ക്ഷണവും ഇരിക്കാനുള്ള കല്പനയും സ്വാഭാവിക മലയാളത്തിൽ സൂക്ഷിക്കുന്നു.
- source_word: פְּלֹנִי אַלְמֹנִי
  choice: അല്ലയോ ഇന്നയാളേ
  rationale: പേര് മനപ്പൂർവം പറയാതെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്ന ഹീബ്രു സ്ഥാനപൂരകപ്രയോഗത്തെ മലയാളത്തിലെ ‘ഇന്നയാൾ’ ഉപയോഗിച്ച് പകരുന്നു.
- source_word: וַיָּסַר וַיֵּשֶׁב
  choice: അയാൾ ഇങ്ങോട്ടു മാറിവന്ന് ഇരുന്നു
  rationale: ബോവസിന്റെ കല്പനയിലെ ക്രിയകൾ ആവർത്തിച്ച് ആ മനുഷ്യൻ അനുസരിച്ചതായി മൂലപാഠത്തിലെ വാചികബന്ധം നിലനിർത്തുന്നു.
theological_decisions:
- issue: גֹּאֵל എന്ന നിയമ-കുടുംബ പദത്തിന്റെ വിവർത്തനം
  choice: വീണ്ടെടുപ്പുകാരനായ ബന്ധു
  alternative: വീണ്ടെടുപ്പുകാരൻ; അടുത്ത ബന്ധു
  rationale: ഒറ്റ പദത്തിൽ ദൈവശാസ്ത്രപരമായ അർഥം അമിതമായി ചുമത്താതെയും കുടുംബബന്ധം ഇല്ലാതാക്കാതെയും, റൂത്തിന്റെ കഥയിലെ നിയമപരവും ബന്ധുത്വപരവുമായ ഇരട്ടവശം സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും കഥനയോഗ്യവുമായ ശൈലി. നിയമസന്ദർഭം വ്യക്തമാക്കാൻ ‘പട്ടണവാതിൽ’ എന്നും, גֹּאֵל എന്നതിലെ ബന്ധുത്വവും വീണ്ടെടുപ്പുചുമതലയും സംരക്ഷിക്കാൻ ‘വീണ്ടെടുപ്പുകാരനായ ബന്ധു’ എന്നും ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
