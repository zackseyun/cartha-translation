  to: 'അപ്പോൾ ബോവസ് മൂപ്പന്മാരോടും സകല ജനത്തോടും പറഞ്ഞു: “ഇന്ന് നിങ്ങൾ സാക്ഷികളാണ്: എലീമേലെക്കിന്റേതായിരുന്നതെല്ലാം, കില്യോന്റെയും മഹ്ലോന്റെയും ആയിരുന്നതെല്ലാം, ഞാൻ നൊവൊമിയുടെ കൈയിൽനിന്ന്[b] സ്വന്തമാക്കിയിരിക്കുന്നു[a].”'
  rationale: The revision retains the source’s legal-public register and its deliberate breadth concerning acquisition, while making the two possessive clauses explicitly parallel and improving Malayalam sentence flow. Footnote anchors remain attached to the corresponding Hebrew expressions, including the source-order placement of the idiom note before the acquisition note.
