base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/009.yaml
  text: Then Boaz said to the elders and all the people[b][a], “You are witnesses today that I have acquired from the hand of Naomi all that belonged to Elimelech and all that belonged to Chilion and Mahlon.”
translation:
  language: ml
  text: 'അപ്പോൾ ബോവസ് മൂപ്പന്മാരോടും സകല ജനത്തോടും പറഞ്ഞു: “ഇന്ന് നിങ്ങൾ സാക്ഷികളാണ്: എലീമേലെക്കിന്റേതായിരുന്നതെല്ലാം, കില്യോന്റെയും മഹ്ലോന്റെയും ആയിരുന്നതെല്ലാം, ഞാൻ നൊവൊമിയുടെ കൈയിൽനിന്ന്[b] സ്വന്തമാക്കിയിരിക്കുന്നു[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വാങ്ങിയിരിക്കുന്നു” അല്ലെങ്കിൽ “വിലയ്ക്കു വാങ്ങിയിരിക്കുന്നു” എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായ ക്രിയയ്ക്ക് നിയമപരമായ ഇടപാടിലൂടെ സ്വന്തമാക്കുക എന്ന അർഥവും വരാം.
    reason: lexical_alternative
  - marker: b
    text: “നൊവൊമിയുടെ കൈയിൽനിന്ന്” എന്നത് അവളുടെ കൈവശത്തുനിന്നോ നിയന്ത്രണത്തിൽനിന്നോ എന്നർഥമുള്ള എബ്രായ പ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ ക്രമം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לַזְּקֵנִים וְכָל הָעָם
  choice: മൂപ്പന്മാരോടും സകല ജനത്തോടും
  rationale: നിയമപരമായ ഇടപാടിൽ സന്നിഹിതരായ ഇരു കൂട്ടരെയും നേരിട്ട് അഭിസംബോധന ചെയ്യുന്നതു വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: עֵדִים אַתֶּם הַיּוֹם
  choice: നിങ്ങൾ ഇന്ന് സാക്ഷികളാണ്
  rationale: എബ്രായത്തിലെ ഊന്നൽ വ്യക്തവും സ്വാഭാവികവുമായ മലയാള വാക്യക്രമത്തിൽ പകരുന്നു.
- source_word: כִּי
  choice: എന്നതിന്
  rationale: ഇവിടെ כִּי കാരണമല്ല, സാക്ഷ്യത്തിന്റെ ഉള്ളടക്കമാണ് അവതരിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘എന്നതിന്’ ആ ബന്ധം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: קָנִיתִי
  choice: ഞാൻ ... സ്വന്തമാക്കിയിരിക്കുന്നു
  rationale: നിയമപരമായ സ്വത്തവകാശ കൈമാറ്റം സൂചിപ്പിക്കുന്നതോടൊപ്പം പണംകൊടുത്തുള്ള വാങ്ങൽ മാത്രമാണെന്ന് അനാവശ്യമായി പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: אֶת כָּל אֲשֶׁר לֶאֱלִימֶלֶךְ
  choice: എലീമേലെക്കിനുണ്ടായിരുന്നതെല്ലാം
  rationale: ‘എലീമേലെക്കിന് ഉണ്ടായിരുന്നതെല്ലാം’ എന്ന ഉടമസ്ഥതാസംബന്ധിയായ എബ്രായ പ്രയോഗത്തെ സ്വാഭാവിക മലയാളത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וְאֵת כָּל אֲשֶׁר לְכִלְיוֹן וּמַחְלוֹן
  choice: കില്യോനും മഹ്ലോനും ഉണ്ടായിരുന്നതെല്ലാം
  rationale: മുൻവാക്യാംശത്തോടുള്ള സമാന്തരത നിലനിർത്തുകയും ഇരുവരുമായി ബന്ധപ്പെട്ട മുഴുവൻ സ്വത്തും സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: מִיַּד נָעֳמִי
  choice: നൊവൊമിയുടെ കൈയിൽനിന്ന്
  rationale: ഉടമസ്ഥതയെയോ നിയന്ത്രണത്തെയോ സൂചിപ്പിക്കുന്ന എബ്രായ നിയമപ്രയോഗത്തിന്റെ രൂപഭാവം നിലനിർത്തുന്നു; അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ബോവസിന്റെ ഇടപാടിന്റെ സ്വഭാവം
  choice: സ്വത്തവകാശത്തിന്റെ നിയമപരമായ കൈമാറ്റം സൂചിപ്പിക്കാൻ ‘സ്വന്തമാക്കിയിരിക്കുന്നു’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘വാങ്ങിയിരിക്കുന്നു’ അല്ലെങ്കിൽ ‘വിലയ്ക്കു വാങ്ങിയിരിക്കുന്നു’
  rationale: വാക്യം എലീമേലെക്ക്, കില്യോൻ, മഹ്ലോൻ എന്നിവരുമായി ബന്ധപ്പെട്ട സ്വത്തെക്കുറിച്ചാണ് പറയുന്നത്. പണംകൊടുത്തുള്ള വാങ്ങൽ മാത്രമാണെന്നോ ആളുകളെ വാങ്ങിയെന്നോ പാഠം പറയാത്ത ആശയം ചേർക്കാതെ קנה എന്ന ക്രിയയുടെ വിശാലമായ നിയമപരമായ അർഥം ഈ പരിഭാഷ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ആദരവാർന്നതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. നിയമപരമായ പശ്ചാത്തലം നിലനിർത്താൻ ‘സാക്ഷികൾ’, ‘സ്വന്തമാക്കിയിരിക്കുന്നു’, ‘കൈയിൽനിന്ന്’ എന്നീ പദപ്രയോഗങ്ങൾ ഉപയോഗിച്ചു; അതേസമയം പഴഞ്ചൻ വിഭക്തിരൂപങ്ങളും അത്യധികം സാങ്കേതികമായ നിയമഭാഷയും ഒഴിവാക്കി.
