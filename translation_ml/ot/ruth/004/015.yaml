  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָ֤יָה לָ/ךְ֙ לְ/מֵשִׁ֣יב נֶ֔פֶשׁ וּ/לְ/כַלְכֵּ֖ל אֶת שֵׂיבָתֵ֑/ךְ כִּ֣י כַלָּתֵ֤/ךְ אֲֽשֶׁר אֲהֵבַ֨תֶ/ךְ֙ יְלָדַ֔תּ/וּ אֲשֶׁר הִיא֙ ט֣וֹבָה לָ֔/ךְ מִ/שִּׁבְעָ֖ה בָּנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/015.yaml
  text: And he will be to you a restorer of life and a sustainer of your old age[a], for your daughter-in-law, who loves you[c][b], has borne him—she who is better to you than seven sons.
translation:
  language: ml
  text: അവൻ നിനക്കു ജീവൻ വീണ്ടുനൽകുന്നവനും[a] നിന്റെ വാർധക്യത്തിൽ നിന്നെ പോറ്റുന്നവനും[b] ആയിരിക്കും. കാരണം, നിന്നെ സ്നേഹിക്കുന്ന നിന്റെ മരുമകളാണ് അവനെ പ്രസവിച്ചത്; അവൾ നിനക്കു ഏഴ് പുത്രന്മാരെക്കാൾ ശ്രേഷ്ഠയാണ്.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്റെ ജീവൻ വീണ്ടുനൽകുന്നവൻ.” ഹീബ്രുവിൽ അക്ഷരാർഥം “ജീവനെ/പ്രാണനെ തിരികെ നൽകുന്നവൻ.”
    reason: lexical_alternative
  - marker: b
    text: “നിന്റെ വാർധക്യം” എന്നതിന്റെ ഹീബ്രു അക്ഷരാർഥം “നിന്റെ നരച്ച മുടി” എന്നാണ്.
    reason: lexical_alternative
  - marker: c
    text: “ഏഴ് പുത്രന്മാർ” എന്നതിലെ ഏഴ് എന്ന സംഖ്യ പലപ്പോഴും പൂർണതയെയോ സമൃദ്ധിയെയോ സൂചിപ്പിക്കുന്നു. അനേകം പുത്രന്മാർ എന്ന ആദർശാനുഗ്രഹത്തെക്കാൾ രൂത്ത് നൊവൊമിക്ക് വിലപ്പെട്ടവളാണെന്നതാണ് താരതമ്യത്തിന്റെ ആശയം.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: ആയിരിക്കും
  rationale: സന്ദർഭത്തിൽ ഈ രൂപം കുഞ്ഞിനെക്കുറിച്ചുള്ള ഭാവി ഫലമോ ഉറപ്പുള്ള പ്രതീക്ഷയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ആയിരിക്കും’ അത് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לְמֵשִׁיב נֶפֶשׁ
  choice: നിനക്കു പുതുജീവൻ നൽകുന്നവൻ
  rationale: שוב എന്ന ധാതുവിലെ തിരികെ നൽകൽ/വീണ്ടെടുക്കൽ എന്ന ആശയവും נֶפֶשׁ എന്നതിന്റെ ഇവിടെ പ്രസക്തമായ ‘ജീവൻ, ജീവശക്തി’ എന്ന മൂർത്തമായ അർഥവും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: וּלְכַלְכֵּל
  choice: പോറ്റുന്നവൻ
  rationale: כלכל ഇവിടെ തുടർച്ചയായി പരിപാലിക്കുക, ആഹാരവും ആവശ്യങ്ങളും നൽകി താങ്ങുക എന്ന ആശയം നൽകുന്നു; ‘പോറ്റുക’ കുടുംബപരമായ ഈ സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: אֶת שֵׂיבָתֵךְ
  choice: നിന്റെ വാർധക്യത്തിൽ
  rationale: שֵׂיבָה അക്ഷരാർഥത്തിൽ നരച്ച മുടിയെയും പ്രയോഗത്തിൽ വാർധക്യത്തെയും സൂചിപ്പിക്കുന്നു. ലക്ഷ്യഭാഷയിൽ ഉദ്ദേശ്യം വ്യക്തവും സ്വാഭാവികവുമായി നൽകാൻ ‘വാർധക്യത്തിൽ’ ഉപയോഗിച്ചു.
- source_word: כִּי
  choice: രണ്ടാമത്തെ വാക്യത്തിലൂടെ കാരണബന്ധം
  rationale: ഹീബ്രുവിലെ כִּי മുൻപത്തെ പ്രസ്താവനയ്ക്കുള്ള കാരണം അവതരിപ്പിക്കുന്നു. മലയാളത്തിലെ വാക്യക്രമവും വിരാമചിഹ്നവും ആ വിശദീകരണബന്ധം നിലനിർത്തുന്നു; ഭാരമുള്ള ബന്ധപദം ചേർക്കാതെ വായന സ്വാഭാവികമാക്കുന്നു.
- source_word: כַלָּתֵךְ
  choice: നിന്റെ മരുമകൾ
  rationale: നൊവൊമിയും രൂത്തും തമ്മിലുള്ള ബന്ധത്തിന് ഈ സന്ദർഭത്തിലെ പതിവും കൃത്യവുമായ മലയാള പദം.
- source_word: אֲשֶׁר אֲהֵבַתֶךְ
  choice: നിന്നെ സ്നേഹിക്കുന്ന
  rationale: പൂർണ്ണക്രിയാരൂപം തെളിയിക്കപ്പെട്ട, തുടരുന്ന സ്നേഹബന്ധത്തെ സൂചിപ്പിക്കുന്നു; വർത്തമാനകാല മലയാളം ആ നിലനിൽക്കുന്ന യാഥാർഥ്യം വ്യക്തമാക്കുന്നു.
- source_word: יְלָדַתּוּ
  choice: അവനെ പ്രസവിച്ചത്
  rationale: പുരുഷലിംഗ ഏകവചന പ്രത്യയം ഇപ്പോൾ പരാമർശിച്ച കുഞ്ഞിലേക്കാണ് സ്വാഭാവികമായി ചൂണ്ടുന്നത്. മൂലത്തിൽ ഇല്ലാത്ത ‘ഒരു മകനെ’ എന്ന കർമം പ്രത്യേകം ചേർക്കുന്നില്ല.
- source_word: אֲשֶׁר הִיא טוֹבָה לָךְ
  choice: അവൾ നിനക്കു ... ശ്രേഷ്ഠയാണ്
  rationale: טוֹבָה കൂടെയുള്ള מן താരതമ്യം മൂല്യത്തിലും നന്മയിലും മേന്മ പ്രകടിപ്പിക്കുന്നു; ‘ശ്രേഷ്ഠ’ താരതമ്യത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: מִשִּׁבְעָה בָּנִים
  choice: ഏഴ് പുത്രന്മാരെക്കാൾ
  rationale: ഹീബ്രു വ്യക്തമായി ‘പുത്രന്മാർ’ എന്നു പറയുന്നു; ഏഴ് പൂർണതയെയോ സമൃദ്ധിയെയോ സൂചിപ്പിക്കുന്ന സാംസ്കാരിക താരതമ്യമായതിനാൽ ലിംഗനിർദ്ദിഷ്ട പദവും സംഖ്യയും നിലനിർത്തി.
theological_decisions:
- issue: נֶפֶשׁ എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ജീവൻ/പുതുജീവൻ
  alternative: ആത്മാവ്; വ്യക്തി
  rationale: സന്ദർഭം നൊവൊമിയുടെ ജീവിതത്തിലെ കുടുംബപരമായ പുനരുജ്ജീവനത്തെയും ഭാവിയിലെ പരിപാലനത്തെയും കുറിച്ചാണ്; ശരീരത്തിൽനിന്നു വേറിട്ട അമൂർത്ത ആത്മാവിനെക്കുറിച്ചുള്ള പ്രസ്താവനയല്ല. അതിനാൽ പിന്നീടുള്ള ദൈവശാസ്ത്രപരമായ വിഭാഗങ്ങൾ ഇറക്കുമതി ചെയ്യാതെ മൂർത്തമായ അർഥം നിലനിർത്തി.
- issue: מִשִּׁבְעָה בָּנִים എന്ന ലിംഗനിർദ്ദിഷ്ട താരതമ്യം
  choice: ഏഴ് പുത്രന്മാർ
  alternative: ഏഴ് മക്കൾ
  rationale: മൂലപാഠം വ്യക്തമായി പുത്രന്മാരെ പറയുന്നു; വാർധക്യത്തിലെ സംരക്ഷകരായി പുത്രന്മാരെ വിലമതിച്ചിരുന്ന പുരാതന സാമൂഹിക പ്രതീക്ഷയാണ് താരതമ്യത്തിന്റെ പശ്ചാത്തലം. അതിനാൽ അത് ലിംഗനിരപേക്ഷമാക്കിയില്ല.
- issue: വാക്യം പ്രവചനമോ ആശംസയോ
  choice: അവൻ ... ആയിരിക്കും
  alternative: അവൻ ... ആയിരിക്കട്ടെ
  rationale: וְהָיָה സന്ദർഭത്തിൽ കുഞ്ഞിന്റെ ഭാവി പങ്കിനെക്കുറിച്ചുള്ള ഫലപ്രസ്താവനയായി വായിക്കാം. ആശംസാസ്വരം സാധ്യമെങ്കിലും ഉറപ്പുള്ള ഭാവിപ്രസ്താവന മൂലരൂപത്തോട് അടുത്തതിനാൽ അത് മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘പോറ്റുന്നവൻ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ കുടുംബപരിപാലനഭാവം നൽകുന്നു. ‘പുത്രന്മാർ’ എന്ന പദം പുരാതന സാംസ്കാരിക താരതമ്യത്തിന്റെ ലിംഗനിർദ്ദിഷ്ടത നിലനിർത്താൻ ഉദ്ദേശപൂർവം സൂക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദപ്രയോഗത്തിനരികെ ചേർത്തിരിക്കുന്നു.
