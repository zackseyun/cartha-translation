- from: അവൻ നിനക്കു പുതുജീവൻ നൽകുന്നവനും[a] നിന്റെ വാർധക്യത്തിൽ നിന്നെ പോറ്റുന്നവനും[b] ആയിരിക്കും. നിന്നെ സ്നേഹിക്കുന്ന നിന്റെ മരുമകളാണ് അവനെ പ്രസവിച്ചത്; അവൾ നിനക്കു ഏഴ് പുത്രന്മാരെക്കാൾ ശ്രേഷ്ഠയാണ്.[c]
  to: അവൻ നിനക്കു ജീവൻ വീണ്ടുനൽകുന്നവനും[a] നിന്റെ വാർധക്യത്തിൽ നിന്നെ പോറ്റുന്നവനും[b] ആയിരിക്കും. കാരണം, നിന്നെ സ്നേഹിക്കുന്ന നിന്റെ മരുമകളാണ് അവനെ പ്രസവിച്ചത്; അവൾ നിനക്കു ഏഴ് പുത്രന്മാരെക്കാൾ ശ്രേഷ്ഠയാണ്.[c]
  rationale: മൂലഹീബ്രുവിലെ ‘ജീവൻ തിരികെ നൽകുന്നവൻ’ എന്ന രൂപകം കൂടുതൽ നേരിട്ട് പ്രതിഫലിപ്പിക്കാൻ മുഖ്യപാഠം പരിഷ്കരിച്ചു. כִּיയുടെ വിശദീകരണബന്ധം ‘കാരണം’ വഴി വ്യക്തമാക്കി. സാംസ്കാരിക അടിക്കുറിപ്പിലെ നൊവൊമിയുടെ നാമലിപിയും തിരുത്തി. മറ്റു പദങ്ങളും അടിക്കുറിപ്പുകളും മൂലപാഠത്തോടും ആധുനിക നിലവാരമലയാളത്തോടും യോജിക്കുന്നതിനാൽ നിലനിർത്തി.
