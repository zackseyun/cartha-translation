source:
  edition: WLC
  text: וְ/זֹאת֩ לְ/פָנִ֨ים בְּ/יִשְׂרָאֵ֜ל עַל הַ/גְּאוּלָּ֤ה וְ/עַל הַ/תְּמוּרָה֙ לְ/קַיֵּ֣ם כָּל דָּבָ֔ר שָׁלַ֥ף אִ֛ישׁ נַעֲל֖/וֹ וְ/נָתַ֣ן לְ/רֵעֵ֑/הוּ וְ/זֹ֥את הַ/תְּעוּדָ֖ה בְּ/יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/007.yaml
  text: 'This was formerly the custom in Israel concerning redemption and exchange[a], to confirm any matter: a man removed his sandal and gave it to his neighbor[c][b], and this was the attestation in Israel.'
translation:
  language: ml
  text: 'വീണ്ടെടുപ്പിനെയും കൈമാറ്റത്തെയും സംബന്ധിച്ച ഏതൊരു കാര്യവും ഉറപ്പിക്കുന്നതിനായി[b] പണ്ടുകാലത്ത്[a] ഇസ്രായേലിൽ ഉണ്ടായിരുന്ന രീതി ഇതായിരുന്നു: ഒരാൾ തന്റെ ചെരിപ്പ് ഊരി കൂട്ടുകാരനു കൊടുക്കുമായിരുന്നു. ഇസ്രായേലിൽ ഇതായിരുന്നു സാക്ഷ്യചിഹ്നം[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മുമ്പ്.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ഓരോ ഇടപാടും.”
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “ഇതായിരുന്നു ഇസ്രായേലിലെ സാക്ഷ്യം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפָנִים
  choice: പണ്ടുകാലത്ത്
  rationale: മുമ്പുണ്ടായിരുന്ന ഒരു ആചാരത്തെ പരിചയപ്പെടുത്തുന്ന കാലസൂചന സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַגְּאוּלָּה
  choice: വീണ്ടെടുപ്പ്
  rationale: കുടുംബബന്ധത്തെ അടിസ്ഥാനമാക്കിയുള്ള തിരിച്ചുവാങ്ങൽ/വീണ്ടെടുക്കൽ അവകാശത്തിന്റെ നിയമപരമായ പശ്ചാത്തലം നിലനിർത്തുന്ന നേരിട്ടുള്ള പദം.
- source_word: הַתְּמוּרָה
  choice: കൈമാറ്റം
  rationale: വിനിമയം, പകരംവെക്കൽ, അവകാശകൈമാറ്റം എന്നിവ ഉൾക്കൊള്ളാവുന്ന മൂലപദത്തിന്റെ വിശാലത അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: לְקַיֵּם כָּל דָּבָר
  choice: ഏതൊരു കാര്യവും ഉറപ്പിക്കുന്നതിനായി
  rationale: സ്ഥാപിക്കുക/സ്ഥിരീകരിക്കുക എന്ന ക്രിയാർഥവും כָּל דָּבָר എന്ന വിശാലപ്രയോഗവും സംരക്ഷിക്കുന്നു; നിയമസാങ്കേതികത അതിരുകടന്ന് ചേർക്കുന്നില്ല.
- source_word: שָׁלַף
  choice: ഊരി
  rationale: ചെരിപ്പിനെ സംബന്ധിച്ച് ‘പുറത്തെടുക്കുക/നീക്കുക’ എന്ന പ്രവർത്തി സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി പറയുന്നു.
- source_word: נַעֲלוֹ
  choice: തന്റെ ചെരിപ്പ്
  rationale: പുരാതന പശ്ചാത്തലത്തിലെ കാലുറയെ ലളിതവും പരിചിതവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: לְרֵעֵהוּ
  choice: കൂട്ടുകാരനു
  rationale: അയൽക്കാരൻ, സഹചാരി, ഇടപാടിലെ മറ്റേയാൾ എന്നീ സാധ്യതകളുള്ള רֵעַ എന്ന പദത്തെ ബന്ധപരമായി തുറന്ന നിലയിൽ നിലനിർത്തുന്നു.
- source_word: הַתְּעוּדָה
  choice: സാക്ഷ്യചിഹ്നം
  rationale: ഇടപാട് സാധൂകരിക്കുന്ന ദൃശ്യമായ സാക്ഷ്യം/തെളിവ് എന്ന നിയമസന്ദർഭത്തിലെ അർഥം വായനാസൗകര്യത്തോടെ നൽകുന്നു.
