  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. വംശാവലിയുടെ സംക്ഷിപ്ത ആവർത്തനശൈലി നിലനിർത്തി. നൽകിയ ഇംഗ്ലീഷ് പാഠത്തിൽ അടിക്കുറിപ്പുചിഹ്നം ‘നഹ്ശോൻ’ എന്ന പേരിനുശേഷമാണെങ്കിലും, അടിക്കുറിപ്പ് שַׂלְמָה എന്ന പേരിന്റെ രൂപഭേദത്തെക്കുറിച്ചായതിനാൽ അത് ‘സൽമാ’യോടു ചേർത്തു.
