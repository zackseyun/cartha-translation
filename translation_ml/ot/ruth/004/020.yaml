lexical_decisions:
- source_word: עַמִּינָדָב
  choice: അമ്മീനാദാബ്
  rationale: വ്യക്തിനാമം; എബ്രായ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന വിധത്തിൽ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: הוֹלִיד
  choice: ജനിപ്പിച്ചു
  rationale: വംശാവലിയുടെ സന്ദർഭത്തിൽ ഹിഫീൽ രൂപം ‘പിതാവായി/ജനിപ്പിച്ചു’ എന്ന അർഥം നൽകുന്നു. ‘ജനിപ്പിച്ചു’ പുരുഷവംശപരമ്പരയുടെ ആശയം ചുരുക്കമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: אֶת
  choice: '[വേർതിരിച്ച് പരിഭാഷപ്പെടുത്തിയിട്ടില്ല]'
  rationale: നേരിട്ടുള്ള കർമത്തെ സൂചിപ്പിക്കുന്ന വ്യാകരണചിഹ്നം; മലയാളത്തിലെ കർമവിഭക്തിയായ ‘-നെ/-യെ’ മുഖേന അതിന്റെ പ്രവർത്തനം പ്രകടമാക്കി.
- source_word: נַחְשׁוֹן
  choice: നഹ്ശോൻ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: וְ
  choice: ;
  rationale: രണ്ടു തുടർച്ചയായ വംശാവലി പ്രസ്താവനകളെ മലയാളത്തിൽ വ്യക്തമായി ബന്ധിപ്പിക്കാൻ അർധവിരാമം ഉപയോഗിച്ചു; എബ്രായത്തിലെ ലളിതമായ ബന്ധത്തിന്റെ പ്രവാഹം ഇതിലൂടെ നിലനിൽക്കുന്നു.
- source_word: שַׂלְמָה
  choice: സൽമാ
  rationale: ഈ വാക്യത്തിലെ എബ്രായരൂപമായ שַׂלְמָה നേരിട്ട് ലിപ്യന്തരിച്ചു; സമാന്തര വംശാവലികളിലെ പരമ്പരാഗത ‘സൽമോൻ’ എന്ന രൂപം മുഖ്യപാഠത്തിലേക്ക് കൊണ്ടുവന്നില്ല.
