  edition: WLC
  text: וַ/יֹּ֣אמֶר בֹּ֔עַז בְּ/יוֹם קְנוֹתְ/ךָ֥ הַ/שָּׂדֶ֖ה מִ/יַּ֣ד נָעֳמִ֑י וּ֠/מֵ/אֵת ר֣וּת הַ/מּוֹאֲבִיָּ֤ה אֵֽשֶׁת הַ/מֵּת֙ קניתי לְ/הָקִ֥ים שֵׁם הַ/מֵּ֖ת עַל נַחֲלָתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/005.yaml
  text: Then Boaz said[a], “On the day you acquire the field from the hand of Naomi, you also acquire Ruth the Moabite, the wife of the dead man[c][b], in order to raise up the name of the dead on his inheritance.”
translation:
  language: ml
  text: 'അപ്പോൾ ബോവസ് പറഞ്ഞു[a]: “നവോമിയുടെ കൈയിൽനിന്ന് വയൽ നീ സ്വന്തമാക്കുന്ന ദിവസം, മരിച്ചവന്റെ പേര് അവന്റെ അവകാശഭൂമിയിൽ നിലനിർത്തുന്നതിനായി[c], മരിച്ചവന്റെ ഭാര്യയായ[b] മോവാബ്യസ്ത്രീ രൂത്തിനെയും നീ ഏറ്റെടുക്കണം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ, “മോവാബ്യസ്ത്രീ രൂത്തിനെ ഞാൻ സ്വന്തമാക്കി” (അല്ലെങ്കിൽ “ഞാൻ സ്വന്തമാക്കുന്നു”) എന്നാണ്. എന്നാൽ സന്ദർഭത്തിൽ പലരും ഇതിനെ “നീ രൂത്തിനെയും ഏറ്റെടുക്കണം” എന്ന അർഥത്തിൽ മനസ്സിലാക്കുന്നു.
    reason: textual_variant
  - marker: b
    text: അല്ലെങ്കിൽ, “മരിച്ചവന്റെ ഭാര്യ.”
    reason: lexical_alternative
  - marker: c
    text: അതായത്, മരിച്ചവന്റെ കുടുംബപരമ്പരയും അവന്റെ പാരമ്പര്യസ്വത്തിലുള്ള അവകാശവും നിലനിർത്തുന്നതിനായി.
    reason: cultural_note
lexical_decisions:
- source_word: בְּיוֹם קְנוֹתְךָ
  choice: നീ സ്വന്തമാക്കുന്ന ദിവസം
  rationale: നിയമപരമായ ഇടപാടിന്റെ സമയസൂചനയും קנה എന്ന ക്രിയയുടെ കൈവശപ്പെടുത്തൽ എന്ന അർഥവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַשָּׂדֶה
  choice: വയൽ
  rationale: ചർച്ചയിലുള്ള നിർദിഷ്ട ഭൂഖണ്ഡത്തെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള പദസമാനം.
- source_word: מִיַּד נָעֳמִי
  choice: നൊവൊമിയുടെ കൈയിൽനിന്ന്
  rationale: ഉടമസ്ഥതയിലോ നിയന്ത്രണത്തിലോ നിന്നുള്ള നിയമപരമായ കൈമാറ്റം സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലി മലയാളത്തിലും ഗ്രാഹ്യമായതിനാൽ നിലനിർത്തി.
- source_word: וּמֵאֵת רוּת הַמּוֹאֲבִיָּה ... קניתי
  choice: മോവാബ്യസ്ത്രീ രൂത്തിനെയും നീ ഏറ്റെടുക്കണം
  rationale: മസോററ്റിക് പാഠത്തിലെ വ്യാകരണപ്രയാസം കണക്കിലെടുത്ത്, അടുത്ത വീണ്ടെടുപ്പുകാരനോടാണ് ബാധ്യത അറിയിക്കുന്നതെന്ന സന്ദർഭാർഥം പ്രധാനപാഠത്തിൽ നൽകി. ഒരു സ്ത്രീയെ ‘സ്വന്തമാക്കുക’ എന്നു പറയുന്നതിലെ അനാവശ്യ ഉടമസ്ഥതാഭാവം ഒഴിവാക്കാനും വിവാഹ-കുടുംബ ബാധ്യത ഉൾക്കൊള്ളിക്കാനും ‘ഏറ്റെടുക്കണം’ എന്നു തിരഞ്ഞെടുത്തു; ഒന്നാംപുരുഷ വായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: אֵשֶׁת הַמֵּת
  choice: മരിച്ചവന്റെ ഭാര്യ
  rationale: ‘വിധവ’ എന്ന വ്യാഖ്യാനാത്മക പദത്തേക്കാൾ മൂലത്തിലെ ബന്ധപ്രയോഗം നേരിട്ട് നൽകുന്നു.
- source_word: לְהָקִים שֵׁם הַמֵּת
  choice: മരിച്ചവന്റെ പേര് ... നിലനിർത്തുന്നതിനായി
  rationale: മരിച്ചവന്റെ കുടുംബപരമ്പരയും നിയമപരമായ അവകാശവും തുടരുമെന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: עַל נַחֲלָתוֹ
  choice: അവന്റെ അവകാശഭൂമിയിൽ
  rationale: മരിച്ചവന്റെ പേരിനും പാരമ്പര്യസ്വത്തിനും ഇടയിലുള്ള നിയമപരമായ ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: രൂത്തിനെ സംബന്ധിക്കുന്ന പ്രയോഗത്തിലും קניתי എന്ന ക്രിയയിലുമുള്ള പാഠ-വാക്യഘടനാപരമായ പ്രയാസം
  choice: വയൽ സ്വന്തമാക്കുന്ന അടുത്ത വീണ്ടെടുപ്പുകാരൻ രൂത്തിനെയും ഏറ്റെടുക്കേണ്ട ബാധ്യതയുണ്ടെന്ന സന്ദർഭാർഥം പ്രധാനപാഠത്തിൽ നൽകി.
  alternative: മസോററ്റിക് സ്വരചിഹ്നങ്ങളനുസരിച്ച് ‘ഞാൻ ... ഏറ്റെടുത്തു’ അല്ലെങ്കിൽ ‘ഞാൻ ... സ്വന്തമാക്കി’ എന്ന ഒന്നാംപുരുഷ വായന.
  rationale: തൊട്ടുമുമ്പും പിന്നാലെയും ഉള്ള സംഭാഷണത്തിന്റെ യുക്തിപ്രകാരം ബോവസ് അടുത്ത വീണ്ടെടുപ്പുകാരനുണ്ടാകുന്ന ബാധ്യതയാണ് അറിയിക്കുന്നത്. എന്നാൽ എബ്രായപാഠത്തിലെ യഥാർഥ ഒന്നാംപുരുഷ രൂപം മറച്ചുവയ്ക്കാതെ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- issue: മരിച്ചവന്റെ പേര് അവകാശഭൂമിയിൽ നിലനിർത്തുക എന്നതിന്റെ സാംസ്കാരിക-ദൈവശാസ്ത്രപരമായ അർഥം
  choice: മൂലത്തിലെ ‘പേര്’–‘അവകാശഭൂമി’ ബന്ധം പ്രധാനപാഠത്തിൽ നിലനിർത്തി, കുടുംബപരമ്പരയും സ്വത്തവകാശവും സംരക്ഷിക്കുന്ന ആശയം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
  alternative: പ്രധാനപാഠത്തിൽ തന്നെ ‘കുടുംബപരമ്പര തുടരാൻ’ എന്ന് വ്യാഖ്യാനിച്ച് എഴുതുക.
  rationale: മൂലപാഠത്തിന്റെ രൂപകവും നിയമപരമായ സംഘർഷവും സംരക്ഷിക്കുമ്പോൾ സാധാരണ വായനക്കാരന് ആവശ്യമായ സാംസ്കാരിക വിശദീകരണം അടിക്കുറിപ്പിലൂടെ ലഭിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമ-കുടുംബ ഭാഷ ഉപയോഗിച്ചു. ‘വയൽ സ്വന്തമാക്കുക’ എന്നും ‘രൂത്തിനെ ഏറ്റെടുക്കുക’ എന്നും വേർതിരിച്ചത് മൂലത്തിലെ ഇടപാട്-ബാധ്യത ബന്ധം നിലനിർത്തിക്കൊണ്ട് സ്ത്രീയെ വസ്തുവായി അവതരിപ്പിക്കുന്ന അനാവശ്യ ധ്വനി കുറയ്ക്കാനാണ്. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനപാഠത്തിൽ ഉൾപ്പെടുത്തി.
