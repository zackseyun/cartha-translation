  source_fidelity: 'പ്രധാനമായ സന്ദർഭാർഥം ശരിയായി കൈമാറിയിട്ടുണ്ട്: വയൽ സ്വന്തമാക്കുന്നതോടൊപ്പം രൂത്തിനോടുള്ള ബാധ്യതയും മരിച്ചവന്റെ പേര് അവകാശഭൂമിയോടു ബന്ധപ്പെടുത്തി നിലനിർത്താനുള്ള ഉദ്ദേശ്യവും വ്യക്തമാകുന്നു. എന്നാൽ നൊവൊമി എന്ന പേര് തിരുത്തണം; അത് നവോമി ആയിരിക്കണം. MT-യിലെ ഒന്നാംപുരുഷമായ קניתי വായനയെ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നതും ഉചിതമാണ്.'
  naturalness: വാക്യം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്. ‘രൂത്തിനെയും നീ ഏറ്റെടുക്കണം’ എന്ന പ്രയോഗം സ്ത്രീയെ സ്വത്തായി ചിത്രീകരിക്കാതെ സന്ദർഭത്തിലെ കുടുംബ-നിയമബാധ്യത അറിയിക്കുന്നു. അടിക്കുറിപ്പ് c ഉദ്ദേശ്യവാക്യത്തോടു ചേർത്താൽ വായനാപ്രവാഹവും അടിക്കുറിപ്പ്-സൂചനയും കൂടുതൽ കൃത്യമാകും.
  terminology: ‘വയൽ,’ ‘അവകാശഭൂമി,’ ‘മോവാബ്യസ്ത്രീ,’ ‘മരിച്ചവന്റെ പേര്’ എന്നിവ യോജിച്ച പദങ്ങളാണ്. ‘മരിച്ചവന്റെ ഭാര്യയായ’ എന്ന പ്രധാനപാഠരൂപവും നേരിട്ടുള്ളതാണ്; അതിന്റെ ബദൽ അടിക്കുറിപ്പിൽ അതേ ബന്ധപ്രയോഗമായി നൽകണം.
