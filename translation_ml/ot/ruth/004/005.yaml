  to: 'അപ്പോൾ ബോവസ് പറഞ്ഞു[a]: “നവോമിയുടെ കൈയിൽനിന്ന് വയൽ നീ സ്വന്തമാക്കുന്ന ദിവസം, മരിച്ചവന്റെ പേര് അവന്റെ അവകാശഭൂമിയിൽ നിലനിർത്തുന്നതിനായി[c], മരിച്ചവന്റെ ഭാര്യയായ[b] മോവാബ്യസ്ത്രീ രൂത്തിനെയും നീ ഏറ്റെടുക്കണം.”'
