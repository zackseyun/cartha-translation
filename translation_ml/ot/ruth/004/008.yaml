  yaml_path: translation/ot/ruth/004/008.yaml
  text: So the redeemer said to Boaz[b][a], “Buy it for yourself,” and he took off his sandal.
translation:
  language: ml
  text: 'അപ്പോൾ വീണ്ടെടുപ്പവകാശമുള്ള ആ ബന്ധു[a] ബോവസിനോടു പറഞ്ഞു: “നീ തന്നെ അതു വാങ്ങിക്കൊള്ളുക.” എന്നിട്ട് അയാൾ തന്റെ ചെരിപ്പ് ഊരി.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “വീണ്ടെടുപ്പുകാരൻ.” കുടുംബസ്വത്തോ വംശപരമ്പരയോ വീണ്ടെടുക്കാനുള്ള നിയമപരമായ ഉത്തരവാദിത്വമുള്ള അടുത്ത ബന്ധുവിനെയാണ് ഹീബ്രായ പദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ഈ ഇടപാടിൽ ചെരിപ്പ് ഊരുന്നത് പതിവായിരുന്ന ഒരു നിയമപരമായ അടയാളമായിരുന്നു; രൂത്ത് 4:7 കാണുക.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച കഥയെ അടുത്ത സംഭവത്തിലേക്കു നയിക്കുന്നു; ആ ക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ ‘അപ്പോൾ’ വ്യക്തമാക്കുന്നു.
- source_word: הַגֹּאֵל
  choice: വീണ്ടെടുപ്പവകാശമുള്ള ബന്ധു
  rationale: രൂത്തിന്റെ പശ്ചാത്തലത്തിൽ ഈ പദം കുടുംബസ്വത്തും വംശപരമ്പരയും വീണ്ടെടുക്കാനുള്ള നിയമപരമായ അവകാശവും ഉത്തരവാദിത്വവുമുള്ള അടുത്ത ബന്ധുവിനെ സൂചിപ്പിക്കുന്നു.
- source_word: לְבֹעַז
  choice: ബോവസിനോടു
  rationale: ആളോടു സംസാരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ഹീബ്രായ മുൻപ്രത്യയവും പേരും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: קְנֵה לָךְ
  choice: നീ തന്നെ അതു വാങ്ങിക്കൊള്ളുക
  rationale: ആജ്ഞാരൂപമായ ‘വാങ്ങുക’ എന്ന അർഥവും ഇടപാട് ബോവസ് സ്വന്തം ഉത്തരവാദിത്വത്തിൽ ഏറ്റെടുക്കണമെന്ന പ്രതിഫലനഭാവവും സംരക്ഷിക്കുന്നു; ‘അതു’ മുൻസന്ദർഭത്തിലെ സ്വത്തിനെ സൂചിപ്പിക്കുന്നു.
- source_word: וַיִּשְׁלֹף נַעֲלוֹ
  choice: എന്നിട്ട് അയാൾ തന്റെ ചെരിപ്പ് ഊരിക്കൊടുത്തു
  rationale: ക്രിയയുടെ അടിസ്ഥാനാർഥം ചെരിപ്പ് ഊരുക/നീക്കുക എന്നതാണ്. 4:7-ലെ ഇടപാട്-സന്ദർഭത്തിൽ അത് കൈമാറുന്നതും ഉൾപ്പെടുന്നതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ‘ഊരിക്കൊടുത്തു’ എന്നു നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. നിയമ-കുടുംബ പശ്ചാത്തലം സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന വിധത്തിൽ മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും വ്യക്തമാക്കി; അനാവശ്യമായ സഭാപരമായ സാങ്കേതികപദങ്ങൾ ഒഴിവാക്കി.
