source:
  edition: WLC
  text: וִ/יהִ֤י בֵֽיתְ/ךָ֙ כְּ/בֵ֣ית פֶּ֔רֶץ אֲשֶׁר יָלְדָ֥ה תָמָ֖ר לִֽ/יהוּדָ֑ה מִן הַ/זֶּ֗רַע אֲשֶׁ֨ר יִתֵּ֤ן יְהוָה֙ לְ/ךָ֔ מִן הַֽ/נַּעֲרָ֖ה הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/012.yaml
  text: And may your house be like the house of Perez[a], whom Tamar bore to Judah[b], from the offspring that Yahweh will give you by this young woman.
translation:
  language: ml
  text: ഈ യുവതിയിൽനിന്ന് യാഹ്‌വെ നിനക്കു നൽകുന്ന സന്തതിമൂലം[b] നിന്റെ കുടുംബം[a] താമാർ യെഹൂദാവിന് പ്രസവിച്ച പേരെസിന്റെ കുടുംബംപോലെ ആകട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘ഭവനം’ അഥവാ ‘വീട്’; ഇവിടെ ഇത് കുടുംബത്തെയും വംശപരമ്പരയെയും സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘വിത്ത്’; എബ്രായത്തിൽ ഇത് സന്തതി അഥവാ മക്കൾ എന്ന അർഥത്തിൽ സാധാരണയായി ഉപയോഗിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהִי
  choice: ആയിത്തീരട്ടെ
  rationale: ഇവിടെ ക്രിയാരൂപം ഒരു ആശംസയോ അനുഗ്രഹവചനമോ പ്രകടിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘ആയിത്തീരട്ടെ’ അതിന്റെ ആശംസാഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בֵיתְךָ / כְּבֵית פֶּרֶץ
  choice: നിന്റെ ഭവനം / പേരെസിന്റെ ഭവനംപോലെ
  rationale: בַּיִת ഇവിടെ കെട്ടിടം മാത്രമല്ല, കുടുംബവും വംശപരമ്പരയും ഉൾക്കൊള്ളുന്ന എബ്രായ പ്രയോഗമാണ്. ‘ഭവനം’ ആ രൂപകവും വിശാലതയും നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר יָלְדָה תָמָר לִיהוּדָה
  choice: താമാർ യെഹൂദായ്ക്കു പ്രസവിച്ച
  rationale: ബന്ധവാക്യവും ילד എന്ന പ്രസവക്രിയയും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: מִן הַזֶּרַע
  choice: സന്തതിയാൽ
  rationale: זֶרַע എന്നതിന്റെ അക്ഷരാർഥം ‘വിത്ത്’ ആണെങ്കിലും ഇവിടെ മക്കളെയോ സന്തതിയെയോ സൂചിപ്പിക്കുന്നു. מן എന്നതിന്റെ ഉറവിടം/മാർഗം എന്ന ബന്ധം ‘-യാൽ’ വഴി സന്ദർഭാനുസൃതമായി പ്രകടമാക്കുന്നു.
- source_word: אֲשֶׁר יִתֵּן יְהוָה לְךָ
  choice: യാഹ്‌വെ നിനക്കു നൽകുന്ന
  rationale: ദൈവം നൽകുന്ന സന്തതിയെ സൂചിപ്പിക്കുന്ന അപൂർണക്രിയയെ, ആശീർവാദത്തിന്റെ പ്രതീക്ഷാഭാവം നിലനിർത്തി മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ‘കർത്താവ്’ എന്ന പദവിയായി മാറ്റാതെ, Yahweh എന്ന ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: מִן הַנַּעֲרָה הַזֹּאת
  choice: ഈ യുവതിയിൽനിന്ന്
  rationale: נַעֲרָה എന്നത് യുവതിയെ സൂചിപ്പിക്കുന്നു; מן എന്ന ഉറവിടബന്ധം ‘യിൽനിന്ന്’ വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: യഹോവ / കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം നിലനിർത്തുകയും ഒരു പദവിയോ വ്യത്യസ്ത പരമ്പരാഗത ഉച്ചാരണമോ പകരംവയ്ക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: בֵּית എന്ന പദത്തിന്റെ വംശപരമായ അർഥവ്യാപ്തി
  choice: ഭവനം
  alternative: കുടുംബം / വംശം
  rationale: കുടുംബം, ഗൃഹം, വംശപരമ്പര എന്നീ ആശയങ്ങൾ ഒരുമിച്ചു വഹിക്കുന്ന മൂലഭാഷാ രൂപകം ചുരുക്കാതെ നിലനിർത്തുന്നു.
- issue: מִן הַזֶּרַע എന്ന പ്രയോഗത്തിന്റെ ബന്ധം
  choice: സന്തതിയാൽ
  alternative: സന്തതിയിൽനിന്ന് / സന്തതി നിമിത്തം
  rationale: מן എന്നത് ഇവിടെ ആശീർവാദം സഫലമാകുന്ന ഉറവിടമോ മാർഗമോ സൂചിപ്പിക്കാം. വ്യക്തമായ കാരണാർഥം നിർബന്ധിച്ച് ചേർക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ ബന്ധം പ്രകടിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ആശീർവാദശൈലി. എബ്രായത്തിലെ ‘ഭവനം’ എന്ന വംശരൂപകവും ‘സന്തതി’ എന്ന അർഥവും സംരക്ഷിച്ചിരിക്കുന്നു.
