translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സ്വാഭാവികവുമായ നിയമ-കുടുംബഭാഷ ഉപയോഗിച്ചു. גאל പദകുടുംബത്തിന്റെ ആവർത്തനം ‘വീണ്ടെടുക്കുക/വീണ്ടെടുപ്പ്’ എന്ന രൂപങ്ങളിൽ നിലനിർത്തി. ഹീബ്രുവിലെ ആശങ്കാഭാവവും സ്വത്തവകാശത്തെക്കുറിച്ചുള്ള അവ്യക്തതയും അനാവശ്യമായി വിശദീകരിച്ചുതീർക്കാതെ സംരക്ഷിച്ചു.
