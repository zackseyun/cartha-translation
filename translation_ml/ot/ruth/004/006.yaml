revisions:
- from: 'അപ്പോൾ വീണ്ടെടുപ്പുകാരൻ പറഞ്ഞു: “എനിക്കുവേണ്ടി അത് വീണ്ടെടുക്കാൻ എനിക്കു കഴിയില്ല; അങ്ങനെ ചെയ്താൽ എന്റെ സ്വന്തം അവകാശം ഞാൻ നശിപ്പിച്ചേക്കും. എന്റെ വീണ്ടെടുപ്പവകാശം[a] നീ നിനക്കുവേണ്ടി ഏറ്റെടുത്തു വീണ്ടെടുക്കുക; കാരണം അത് വീണ്ടെടുക്കാൻ എനിക്കു കഴിയില്ല.”'
