source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר הַ/גֹּאֵ֗ל לֹ֤א אוּכַל֙ ל/גאול לִ֔/י פֶּן אַשְׁחִ֖ית אֶת נַחֲלָתִ֑/י גְּאַל לְ/ךָ֤ אַתָּה֙ אֶת גְּאֻלָּתִ֔/י כִּ֥י לֹא אוּכַ֖ל לִ/גְאֹֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/006.yaml
  text: Then the redeemer said[a], “I cannot redeem it for myself, lest I ruin my own inheritance. Redeem for yourself my right of redemption[b], for I cannot redeem it.”
translation:
  language: ml
  text: 'അപ്പോൾ വീണ്ടെടുപ്പുകാരൻ പറഞ്ഞു: “എനിക്കുവേണ്ടി അത് വീണ്ടെടുക്കാൻ എനിക്കു കഴിയില്ല; അങ്ങനെ ചെയ്താൽ എന്റെ സ്വന്തം പാരമ്പര്യസ്വത്തിന് ഞാൻ നാശം വരുത്തും. എന്റെ വീണ്ടെടുപ്പവകാശം[a] നീ നിനക്കുവേണ്ടി വീണ്ടെടുക്കുക; കാരണം അത് വീണ്ടെടുക്കാൻ എനിക്കു കഴിയില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ “എന്റെ വീണ്ടെടുപ്പ്.” ഇവിടെ ഈ എബ്രായ നാമം കുടുംബസ്വത്ത് വീണ്ടെടുക്കാനുള്ള നിയമപരമായ അവകാശത്തെയും ബാധ്യതയെയും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגֹּאֵל
  choice: വീണ്ടെടുപ്പുകാരൻ
  rationale: גאל എന്ന ധാതുവിന്റെ കർത്തൃവാചക രൂപം കുടുംബസ്വത്ത് വീണ്ടെടുക്കാനുള്ള നിയമപരമായ അവകാശവും ബാധ്യതയും ഉള്ള ആളെ സൂചിപ്പിക്കുന്നു. ബന്ധുത്വം പശ്ചാത്തലത്തിൽ വ്യക്തമാകുന്നതിനാൽ പദത്തിൽ അധികമായി ചേർത്തിട്ടില്ല.
- source_word: לִגְאֹל / גְּאַל
  choice: വീണ്ടെടുക്കുക
  rationale: ആവർത്തിക്കുന്ന גאל പദകുടുംബം ഒരേ മലയാളപദംകൊണ്ട് നിലനിർത്തുന്നു; ഇവിടെ കുടുംബസ്വത്തും അതോടനുബന്ധിച്ച ബാധ്യതയും നിയമപരമായി ഏറ്റെടുക്കുന്നതാണ് ആശയം.
- source_word: גְּאֻלָּתִי
  choice: എന്റെ വീണ്ടെടുപ്പവകാശം
  rationale: അക്ഷരാർഥമായ ‘എന്റെ വീണ്ടെടുപ്പ്’ മലയാളത്തിൽ അവ്യക്തമാകാം. സന്ദർഭത്തിൽ മറ്റെയാൾക്കുള്ള മുൻഗണനയുള്ള നിയമാവകാശം ബോവസിന് വിട്ടുകൊടുക്കുന്നതായതിനാൽ ‘വീണ്ടെടുപ്പവകാശം’ അർഥം വ്യക്തമാക്കുന്നു; അക്ഷരാർഥസാദ്ധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: לִי
  choice: എനിക്കുവേണ്ടി
  rationale: വ്യക്തിപരമായ പ്രയോജനത്തെയോ താൽപര്യത്തെയോ സൂചിപ്പിക്കുന്ന ദാതിവ് സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: פֶּן אַשְׁחִית
  choice: അങ്ങനെ ചെയ്താൽ ... ഞാൻ നശിപ്പിച്ചേക്കും
  rationale: פֶּן ആശങ്കാജനകമായ ഫലത്തെ അവതരിപ്പിക്കുന്നു. שׁחת ഇവിടെ അക്ഷരാർഥത്തിലുള്ള സമ്പൂർണനാശമല്ലെങ്കിലും അവകാശത്തിന് ഗുരുതരഹാനി വരുത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു; സാധ്യതാഭാവം ‘ചെയ്തേക്കും’ പ്രകടമാക്കുന്നു.
- source_word: נַחֲלָתִי
  choice: എന്റെ സ്വന്തം അവകാശം
  rationale: പിതൃസ്വത്തും പാരമ്പര്യമായി ലഭിക്കുന്ന ഓഹരിയും ഉൾക്കൊള്ളുന്ന נַחֲלָהയെ ‘അവകാശം’ സ്വാഭാവികമായി നൽകുന്നു; ‘സ്വന്തം’ ഇപ്പോൾ വീണ്ടെടുക്കേണ്ട സ്വത്തിൽനിന്നുള്ള വ്യത്യാസം വ്യക്തമാക്കുന്നു.
- source_word: לְךָ אַתָּה
  choice: നീ നിനക്കുവേണ്ടി
  rationale: സ്വതന്ത്ര സർവനാമമായ אַתָּה നൽകുന്ന ഊന്നൽ മലയാളത്തിൽ ‘നീ’ എന്നും ദാതിവിന്റെ വ്യക്തിപരമായ പ്രയോജനം ‘നിനക്കുവേണ്ടി’ എന്നും പ്രകടമാക്കുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: തന്റെ നിരാകരണത്തെ വീണ്ടും വിശദീകരിക്കുന്ന കാരണബന്ധം വ്യക്തമായി നൽകുന്നു.
