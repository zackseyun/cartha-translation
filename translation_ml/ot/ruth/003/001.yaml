reference: Ruth 3:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֹּ֥אמֶר לָ֖/הּ נָעֳמִ֣י חֲמוֹתָ֑/הּ בִּתִּ֞/י הֲ/לֹ֧א אֲבַקֶּשׁ לָ֛/ךְ מָנ֖וֹחַ אֲשֶׁ֥ר יִֽיטַב לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/001.yaml
  text: Then Naomi her mother-in-law said to her[a], “My daughter, should I not seek a resting place for you, that it may go well with you?”
translation:
  language: ml
  text: 'അപ്പോൾ അവളുടെ അമ്മായിയമ്മയായ നൊവൊമി അവളോടു പറഞ്ഞു: “എന്റെ മകളേ, നിനക്കു നന്മ വരേണ്ടതിന് ഞാൻ നിനക്കായി ഒരു വിശ്രമസ്ഥലം അന്വേഷിക്കേണ്ടതല്ലയോ?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വിശ്രമം,’ ‘സുരക്ഷ,’ അല്ലെങ്കിൽ ‘ഒരു ഭവനം’ എന്നും പരിഭാഷപ്പെടുത്താം. സന്ദർഭത്തിൽ, വിവാഹത്തിലൂടെ ലഭിക്കാവുന്ന സ്ഥിരതയും ക്ഷേമവുമാണ് നൊവൊമി രൂത്തിനായി അന്വേഷിക്കുന്നതെന്നു തോന്നുന്നു; എന്നാൽ എബ്രായപദം അക്ഷരാർഥത്തിൽ ‘വിശ്രമസ്ഥലം’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ സംഭവക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: נָעֳמִי
  choice: നൊവൊമി
  rationale: എബ്രായ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: חֲמוֹתָהּ
  choice: അവളുടെ അമ്മായിയമ്മ
  rationale: മൂന്നാം പുരുഷ ഏകവചന സ്ത്രീലിംഗ പ്രത്യയം രൂത്തിനോടുള്ള നൊവൊമിയുടെ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: בִּתִּי
  choice: എന്റെ മകളേ
  rationale: വാത്സല്യവും കുടുംബബന്ധവും സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള സംബോധന അതേപടി നിലനിർത്തുന്നു.
- source_word: הֲלֹא
  choice: അന്വേഷിക്കേണ്ടതല്ലയോ?
  rationale: സമ്മതം പ്രതീക്ഷിക്കുന്ന എബ്രായ അലങ്കാരചോദ്യത്തിന്റെ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: אֲבַקֶּשׁ
  choice: അന്വേഷിക്കുക
  rationale: בקש എന്ന ക്രിയയുടെ പൊതുവായ ‘തേടുക/അന്വേഷിക്കുക’ എന്ന അർഥം നിലനിർത്തി, നൊവൊമിയുടെ പദ്ധതി അനാവശ്യമായി വിശദീകരിക്കുന്നില്ല.
- source_word: מָנוֹחַ
  choice: ഒരു വിശ്രമസ്ഥലം
  rationale: സ്ഥിരതയും സുരക്ഷിതമായ വിശ്രമവും ഉൾക്കൊള്ളുന്ന രൂപകം സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ വിവാഹത്തിലൂടെയുള്ള സ്ഥിരജീവിതം സൂചിപ്പിക്കാമെങ്കിലും അത് മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: אֲשֶׁר יִיטַב לָךְ
  choice: നിനക്കു നന്മ വരേണ്ടതിന്
  rationale: വെറും അമൂർത്തമായ ‘നല്ലത്’ എന്നതിനുപകരം രൂത്തിന്റെ ക്ഷേമം ലക്ഷ്യമാക്കുന്ന ഫലാർഥം സ്വാഭാവികമായി നൽകുന്നു.
