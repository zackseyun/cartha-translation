  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. എബ്രായത്തിലെ അലങ്കാരചോദ്യവും ‘വിശ്രമസ്ഥലം’ എന്ന രൂപകവും നിലനിർത്തിയിരിക്കുന്നു.
