  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֹּ֖אמֶר אֵלֶ֑י/הָ כֹּ֛ל אֲשֶׁר תֹּאמְרִ֥י אֶֽעֱשֶֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/005.yaml
  text: And she said to her[a], “All that you say, I will do.”
translation:
  language: ml
  text: 'അവൾ അവളോട് പറഞ്ഞു: “നീ പറയുന്നതെല്ലാം ഞാൻ ചെയ്യും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: അവൾ പറഞ്ഞു
  rationale: אמר എന്ന ക്രിയയുടെ wayyiqtol രൂപം ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്ന ലളിതമായ ഭൂതകാലപ്രയോഗമാണ്. മലയാളത്തിൽ ‘അവൾ പറഞ്ഞു’ എന്നത് സ്വാഭാവികമായി ആ പ്രവാഹം നൽകുന്നു.
- source_word: אֵלֶיהָ
  choice: അവളോട്
  rationale: אֶל എന്ന പൂർവപ്രത്യയവും മൂന്നാം പുരുഷ ഏകവചന സ്ത്രീലിംഗ പ്രത്യയവും അഭിസംബോധനയുടെ ദിശ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘അവളോട്’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: כֹּל אֲשֶׁר
  choice: പറയുന്നതെല്ലാം
  rationale: כֹּל אֲשֶׁר സമഗ്രതയെ ആപേക്ഷിക ഉപവാക്യത്തോടൊപ്പം പ്രകടിപ്പിക്കുന്നു. ‘എല്ലാം’ എന്ന ആശയം ക്രിയയോടു ചേർത്ത ‘പറയുന്നതെല്ലാം’ എന്ന രൂപം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: תֹּאמְרִי
  choice: നീ പറയുന്ന
  rationale: אמר എന്ന ക്രിയയുടെ Qal imperfect 2fs രൂപം ഇവിടെ നൊവൊമിയുടെ നിർദേശത്തെ സൂചിപ്പിക്കുന്നു. ‘നീ പറയുന്ന’ എന്ന് വിവർത്തനം ചെയ്യുന്നത് വ്യക്തമായി ഇല്ലാത്ത ‘എന്നോട്’ പോലുള്ള കർമം ചേർക്കാതെ മൂലത്തിന്റെ അർഥം നിലനിർത്തുന്നു.
- source_word: אֶעֱשֶׂה
  choice: ഞാൻ ചെയ്യും
  rationale: עשה എന്ന ക്രിയയുടെ Qal imperfect 1cs രൂപം രൂത്തിന്റെ ദൃഢനിശ്ചയമോ ഉദ്ദേശ്യമോ പ്രകടിപ്പിക്കുന്നു. ‘ഞാൻ ചെയ്യും’ എന്നത് അധിക കർമപദം ചേർക്കാതെയുള്ള നേരിട്ടുള്ള പരിഭാഷയാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. സ്ത്രീലിംഗ ഏകവചന രൂപങ്ങൾ മൂലപാഠത്തിലെ സൂചനകൾ നിലനിർത്തുന്നു. ഈ വാക്യത്തിന് ആവശ്യമായ യഥാർഥ പാഠഭേദമോ അർത്ഥദ്വയമോ ഇല്ലാത്തതിനാൽ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല; ഇംഗ്ലീഷ് consultation layer-ലെ [a] അടയാളം ‘to her’ എന്നിടത്താണെങ്കിലും നൽകിയ അടിക്കുറിപ്പ് വാചകത്തിന്റെ മറ്റൊരു രൂപത്തെപ്പറ്റിയതിനാൽ അതിനെ അനുകരിച്ചിട്ടില്ല.
