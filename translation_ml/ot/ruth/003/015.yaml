source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר הָ֠בִי הַ/מִּטְפַּ֧חַת אֲשֶׁר עָלַ֛יִ/ךְ וְ/אֶֽחֳזִי בָ֖/הּ וַ/תֹּ֣אחֶז בָּ֑/הּ וַ/יָּ֤מָד שֵׁשׁ שְׂעֹרִים֙ וַ/יָּ֣שֶׁת עָלֶ֔י/הָ וַ/יָּבֹ֖א הָ/עִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/015.yaml
  text: Then he said[a], “Bring the cloak that is on you and hold it out.” So she held it out, and he measured six measures of barley and put it on her[b]. Then he went into the city.
translation:
  language: ml
  text: 'അപ്പോൾ അവൻ പറഞ്ഞു: “നീ ധരിച്ചിരിക്കുന്ന മേലങ്കി കൊണ്ടുവന്ന് വിരിച്ചുപിടിക്കൂ.” അവൾ അതു വിരിച്ചുപിടിച്ചു. അവൻ ആറ് അളവ് യവം[a] അളന്ന് അവളുടെമേൽ വെച്ചു. പിന്നെ അവൻ പട്ടണത്തിലേക്കു പോയി.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘ആറ് യവം’; അളവിന്റെ ഏകകം പറഞ്ഞിട്ടില്ല.
    reason: lexical_alternative
  - marker: b
    text: ചില പുരാതന പരിഭാഷകളും അനേകം വിവർത്തനങ്ങളും ‘പിന്നെ അവൾ പട്ടണത്തിലേക്കു പോയി’ എന്നു വായിക്കുന്നു. മസോററ്റിക് പാഠത്തിൽ ‘പിന്നെ അവൻ പട്ടണത്തിലേക്കു പോയി’ എന്നാണ്.
    reason: textual_variant
lexical_decisions:
- source_word: הָבִי
  choice: കൊണ്ടുവന്ന്
  rationale: സ്ത്രീലിംഗ ഏകവചന ആജ്ഞാരൂപം; ധരിച്ചിരിക്കുന്ന വസ്ത്രം മുന്നിലേക്കു കൊണ്ടുവന്ന് കൊടുക്കുക എന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: הַמִּטְפַּחַת
  choice: മേലങ്കി
  rationale: ധാന്യം വഹിക്കാൻ തക്ക വലുപ്പമുള്ള പൊതിയുന്ന പുറംവസ്ത്രമാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്; ആധുനിക വായനക്കാരനെ തെറ്റിദ്ധരിപ്പിക്കാവുന്ന ‘മുഖപടം’ എന്നതിനെക്കാൾ ‘മേലങ്കി’ യോജിക്കുന്നു.
- source_word: וְאֶחֳזִי בָהּ
  choice: വിരിച്ചുപിടിക്കൂ
  rationale: അടിസ്ഥാനാർഥം ‘അതിൽ പിടിക്കുക’ എന്നാണ്; യവം ഇടുന്നതിനായി വസ്ത്രം പിടിച്ചുവിരിക്കണമെന്ന സന്ദർഭം സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
- source_word: וַיָּמָד
  choice: അളന്ന്
  rationale: ധാന്യം നിശ്ചിത അളവിൽ കൊടുക്കുന്ന പ്രവൃത്തി കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: שֵׁשׁ שְׂעֹרִים
  choice: ആറളവ് യവം
  rationale: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘ആറ് യവം’ എന്നാണുള്ളത്; അളവിന്റെ ഏകകം പറഞ്ഞിട്ടില്ല. മലയാളത്തിൽ അർഥവ്യക്തതയ്ക്കായി ‘അളവ്’ ചേർക്കുന്നു, എന്നാൽ ‘സേയാ’ പോലൊരു നിർദിഷ്ട ഏകകം അനുമാനിക്കുന്നില്ല.
- source_word: וַיָּשֶׁת עָלֶיהָ
  choice: അതിൽ വെച്ച് അവളുടെമേൽ ചുമത്തി
  rationale: അളന്ന യവം മേലങ്കിയിൽ വെച്ച് അവൾക്കു ചുമക്കാനായി അവളുടെമേൽ കയറ്റിവെച്ച പ്രവൃത്തി മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וַיָּבֹא הָעִיר
  choice: അവൻ പട്ടണത്തിലേക്കു പോയി
  rationale: മസോററ്റിക് പാഠത്തിലെ ക്രിയ പുല്ലിംഗ ഏകവചനമായതിനാൽ പ്രധാനപാഠത്തിൽ ‘അവൻ’ നിലനിർത്തുന്നു.
theological_decisions:
- issue: അവസാന ഉപവാക്യത്തിലെ കർത്താവ് (וַיָּבֹא הָעִיר)
  choice: അവൻ പട്ടണത്തിലേക്കു പോയി
  alternative: അവൾ പട്ടണത്തിലേക്കു പോയി
  rationale: ഇത് സിദ്ധാന്തപരമായ പ്രശ്നമല്ല, ശ്രദ്ധേയമായ പാഠഭേദമാണ്. മസോററ്റിക് പാഠത്തിലെ ക്രിയ പുല്ലിംഗമായതിനാൽ പ്രധാനപാഠം ‘അവൻ’ എന്നു നൽകുന്നു; ചില പുരാതന പരിഭാഷകളിലെ സ്ത്രീലിംഗ വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. മൂലപാഠത്തിലെ വ്യക്തമല്ലാത്ത അളവിന്റെ ഏകകം അനാവശ്യമായി നിർണയിച്ചിട്ടില്ല; അവസാന ക്രിയയുടെ പാഠഭേദം തുറന്നുവെച്ചിരിക്കുന്നു.
