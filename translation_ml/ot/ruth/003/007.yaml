base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/007.yaml
  text: And Boaz ate and drank[a], and his heart was merry, and he went to lie down at the end of the grain heap. Then she came quietly, uncovered his feet[b], and lay down.
translation:
  language: ml
  text: ബോവസ് ഭക്ഷണം കഴിക്കുകയും കുടിക്കുകയും ചെയ്തു; അവന്റെ മനസ്സ് സന്തോഷിച്ചു[a]. പിന്നെ അവൻ ധാന്യക്കൂമ്പാരത്തിന്റെ അറ്റത്ത് കിടക്കാൻ പോയി. അവൾ നിശ്ശബ്ദമായി വന്ന് അവന്റെ കാലുകൾ അനാവൃതമാക്കി[b], കിടന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവന്റെ ഹൃദയം പ്രസന്നമായി” അല്ലെങ്കിൽ “അവൻ നല്ല ഉല്ലാസത്തിലായിരുന്നു.” ഹീബ്രു പ്രയോഗം സന്തോഷത്തെയോ പ്രസന്നതയെയോ സൂചിപ്പിക്കുന്നു; അതുമാത്രം കൊണ്ട് അവൻ മദ്യലഹരിയിലായിരുന്നുവെന്ന് നിർബന്ധമായി അർഥമാകുന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “അവന്റെ കാലുകൾ അനാവൃതമാക്കി.” ചിലർ ഇതിനെ ഒരു സാധാരണ, അക്ഷരാർഥത്തിലുള്ള പ്രവൃത്തിയായി മനസ്സിലാക്കുന്നു; മറ്റുചിലർ ഇതിൽ സൂചനാപരമായ ധ്വനി കാണുന്നു. എന്നാൽ ഹീബ്രു വാചകം നിയന്ത്രിതമാണ്; ലൈംഗിക പ്രവർത്തനം നടന്നതായി അത് വ്യക്തമായി പറയുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאכַל וַיֵּשְׁתְּ
  choice: ഭക്ഷണം കഴിക്കുകയും കുടിക്കുകയും ചെയ്തു
  rationale: രണ്ടു ഹീബ്രു ക്രിയകളെയും നേരിട്ട്, സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലിയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וַיִּיטַב לִבּוֹ
  choice: അവന്റെ ഹൃദയം സന്തോഷമായി
  rationale: ഹൃദയം നല്ലതാകുക/പ്രസന്നമാകുക എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ഭാവം നിലനിർത്തുന്നു; മദ്യലഹരി ഉണ്ടായിരുന്നുവെന്ന് വാചകം പറയുന്നതിലധികം വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: וַיָּבֹא לִשְׁכַּב
  choice: കിടക്കാൻ പോയി
  rationale: בוא എന്ന ചലനക്രിയയെ മലയാള ആഖ്യാനത്തിൽ സ്വാഭാവികമായി 'പോയി' എന്നു നൽകുന്നു; שׁכב ഉറക്കം എന്നതിലുപരി കിടക്കുന്നതിനെ സൂചിപ്പിക്കുന്നതിനാൽ അതേ അർഥം നിലനിർത്തുന്നു.
- source_word: בִּקְצֵה הָעֲרֵמָה
  choice: ധാന്യക്കൂമ്പാരത്തിന്റെ അറ്റത്ത്
  rationale: קצה എന്നതിന്റെ അറ്റം/അരിക് എന്ന അർഥവും സന്ദർഭത്തിൽ עֲרֵמָה ധാന്യക്കൂമ്പാരമാണെന്നതും വ്യക്തമാക്കുന്നു.
- source_word: בַלָּט
  choice: പതുക്കെ
  rationale: ശബ്ദമുണ്ടാക്കാതെയും ശ്രദ്ധയിൽപ്പെടാതെയും സമീപിച്ചതെന്ന ഭാവം സ്വാഭാവികമായി നൽകുന്നു; അനാവശ്യമായ ധാർമിക വിലയിരുത്തൽ ചേർക്കുന്നില്ല.
- source_word: וַתְּגַל מַרְגְּלֹתָיו
  choice: അവന്റെ കാലുകളുടെ ഭാഗത്തെ മൂടി നീക്കി
  rationale: മസോററ്റിക് പാഠത്തിലെ 'അവന്റെ കാലുകളുടെ സ്ഥലം/ഭാഗം തുറന്നു' എന്ന നിയന്ത്രിത ദൃശ്യവിവരണം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ലൈംഗികമായ വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: וַתִּשְׁכָּב
  choice: അവിടെ കിടന്നു
  rationale: ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നൽകുന്നു; 'അവിടെ' എന്നത് മലയാളത്തിൽ പ്രവർത്തിയുടെ സ്ഥലബന്ധം സ്വാഭാവികമാക്കുന്നു, എന്നാൽ ലൈംഗിക പ്രവർത്തനം സൂചിപ്പിക്കുന്നില്ല.
theological_decisions:
- issue: രൂത്തിന്റെ പ്രവൃത്തി ലൈംഗിക പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നതായി പരിഭാഷപ്പെടുത്തണമോ
  choice: അവൾ മൂടി നീക്കി കിടന്നു എന്ന നിയന്ത്രിത വിവരണം മാത്രം മുഖ്യവാചകത്തിൽ നിലനിർത്തുക
  alternative: വശീകരണമോ ലൈംഗിക സമ്പർക്കമോ സൂചിപ്പിക്കുന്ന വിധത്തിൽ വ്യാഖ്യാനപരമായി പരിഭാഷപ്പെടുത്തുക
  rationale: ഹീബ്രു വാചകം രൂത്ത് പതുക്കെ വന്ന് ബോവസിന്റെ കാലുകളുടെ ഭാഗം തുറന്ന് കിടന്നുവെന്നേ വ്യക്തമായി പറയുന്നുള്ളൂ. സാധ്യതയുള്ള സൂചനകൾ വിശദീകരണക്കുറിപ്പിൽ അറിയിക്കാം; മുഖ്യവാചകം അവയെ തീർപ്പാക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഹീബ്രുവിലെ പ്രവർത്തനക്രമവും നിയന്ത്രിതമായ ഭാഷയും നിലനിർത്തിയിട്ടുണ്ട്. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
