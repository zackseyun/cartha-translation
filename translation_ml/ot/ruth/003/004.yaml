  source_fidelity: 'മൂലഎബ്രായത്തിലെ നിർദേശങ്ങളുടെ ക്രമവും അർഥവും കൃത്യമായി നിലനിർത്തിയിരിക്കുന്നു: അവൻ കിടന്നശേഷം സ്ഥലം ശ്രദ്ധിക്കുക, അവിടേക്കു ചെന്നു അവന്റെ കാൽഭാഗം അനാവൃതമാക്കുക, കിടക്കുക, പിന്നെ അവൻ എന്തു ചെയ്യണമെന്ന് അറിയിക്കും. וּבָאת-ന്റെ സന്ദർഭോചിതമായ ‘ചെന്ന്’യും, וְיָדַעַתְּ-ന്റെ പ്രായോഗിക അർഥമായ ‘ശ്രദ്ധിച്ചുവെക്കുക’യും യോജിച്ചിരിക്കുന്നു. מַרְגְּלֹתָיו-യിലെ ഉദ്ദേശ്യബോധമുള്ള അവ്യക്തത മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചിരിക്കുന്നു.'
  naturalness: ഭാഷ ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്. ‘അവന്റെ കാൽഭാഗം മൂടിയിരിക്കുന്നത് നീക്കി’ എന്ന പ്രയോഗം ‘അനാവൃതമാക്കുക’ എന്നതിന്റെ പ്രവൃത്തിസൂചന സ്വാഭാവികമായി നൽകുന്നു; അനാവശ്യമായി ലൈംഗികമായ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
