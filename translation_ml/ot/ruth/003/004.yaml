source:
  edition: WLC
  text: וִ/יהִ֣י בְ/שָׁכְב֗/וֹ וְ/יָדַ֨עַתְּ֙ אֶת הַ/מָּקוֹם֙ אֲשֶׁ֣ר יִשְׁכַּב שָׁ֔ם וּ/בָ֛את וְ/גִלִּ֥ית מַרְגְּלֹתָ֖י/ו ו/שכבתי וְ/הוּא֙ יַגִּ֣יד לָ֔/ךְ אֵ֖ת אֲשֶׁ֥ר תַּעַשִֽׂי/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/004.yaml
  text: Then[a], when he lies down, note the place where he lies. Then go, uncover his feet, and lie down[b], and he will tell you what you should do.
translation:
  language: ml
  text: അവൻ കിടക്കുമ്പോൾ, അവൻ കിടക്കുന്ന സ്ഥലം ശ്രദ്ധിച്ചുവെക്കുക. പിന്നെ അവിടേക്കു ചെന്ന് അവന്റെ കാൽഭാഗം[a] മൂടിയിരിക്കുന്നത് നീക്കി കിടക്കുക[b]. എന്തു ചെയ്യണമെന്ന് അവൻ നിനക്കു പറഞ്ഞുതരും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായ പദം ‘അവന്റെ പാദങ്ങൾ’ എന്നോ ‘അവന്റെ പാദങ്ങൾക്കു ചുറ്റുമുള്ള സ്ഥലം’ എന്നോ, കൂടുതൽ പൊതുവായി ശരീരത്തിന്റെ താഴത്തെ ഭാഗം എന്നോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: എഴുതപ്പെട്ട എബ്രായ രൂപം ‘ഞാൻ കിടന്നു’ എന്നാണ്; എന്നാൽ സന്ദർഭവും പരമ്പരാഗത വായനയും ‘നീ കിടക്കുക’ എന്നാണ് മനസ്സിലാക്കുന്നത്.
    reason: textual_variant
lexical_decisions:
- source_word: וִיהִי בְשָׁכְבוֹ
  choice: അവൻ കിടക്കുമ്പോൾ
  rationale: היה എന്ന ക്രിയാരൂപം തുടർന്നുള്ള നിർദേശത്തെ കാലസൂചനയോടെ അവതരിപ്പിക്കുന്നു; בְ + infinitive construct ‘കിടക്കുമ്പോൾ’ എന്ന സ്വാഭാവിക അർഥം നൽകുന്നു.
- source_word: וְיָדַעַתְּ אֶת־הַמָּקוֹם
  choice: സ്ഥലം ശ്രദ്ധിച്ചുവെക്കുക
  rationale: ידע ഇവിടെ വെറും ‘അറിയുക’ എന്നതിലുപരി, അവൻ കിടക്കുന്ന സ്ഥലം ശ്രദ്ധിച്ച് തിരിച്ചറിയുക എന്ന പ്രായോഗിക അർഥത്തിലാണ്.
- source_word: אֲשֶׁר יִשְׁכַּב שָׁם
  choice: അവൻ കിടക്കുന്ന സ്ഥലം
  rationale: ബന്ധവാക്യം ഉറങ്ങാനുള്ള സ്ഥലം തിരിച്ചറിയിക്കുന്നു; ശബ്ദാനുകരണമായി ആവർത്തിക്കാതെ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകിയിരിക്കുന്നു.
- source_word: וּבָאת
  choice: പിന്നെ അവിടേക്കു ചെന്ന്
  rationale: בוא സന്ദർഭമനുസരിച്ച് ‘വരുക’ അല്ലെങ്കിൽ ‘പോകുക’ ആകാം. ഇവിടെ നൊവൊമിയുടെ നിർദേശപ്രകാരം രൂത്ത് ആ സ്ഥലത്തേക്കു നീങ്ങുന്നതിനാൽ ‘ചെന്ന്’ സ്വാഭാവികമാണ്; ‘അവിടേക്കു’ ലക്ഷ്യം വ്യക്തമാക്കുന്നു.
- source_word: וְגִלִּית מַרְגְּלֹתָיו
  choice: അവന്റെ കാൽഭാഗം മൂടിയിരിക്കുന്നത് നീക്കി
  rationale: גלה ‘അനാവൃതമാക്കുക’ എന്നാണ്. מַרְגְּלוֹתָיו പാദങ്ങളെയോ പാദങ്ങൾക്കു ചുറ്റുമുള്ള താഴത്തെ ഭാഗത്തെയോ സൂചിപ്പിക്കാം; ‘കാൽഭാഗം’ ഈ വ്യാപ്തി നിലനിർത്തുന്നു. മലയാളത്തിൽ ഉദ്ദേശ്യം വ്യക്തമാക്കാൻ മൂടിയിരിക്കുന്നത് നീക്കുക എന്നു സ്വാഭാവികമായി പറഞ്ഞു.
- source_word: וְשָׁכָבְתִּי / וְשָׁכַבְתְּ
  choice: കിടക്കുക
  rationale: എഴുതപ്പെട്ട രൂപം ഒന്നാംപുരുഷ ഏകവചനമായിരിക്കുമ്പോഴും, പരമ്പരാഗത വായനയും നിർദേശത്തിന്റെ സന്ദർഭവും രൂത്തിനോടുള്ള രണ്ടാംപുരുഷ സ്ത്രീലിംഗ ഏകവചനത്തെ പിന്തുണയ്ക്കുന്നു.
- source_word: וְהוּא יַגִּיד לָךְ
  choice: അവൻ നിനക്കു പറഞ്ഞുതരും
  rationale: נגד എന്ന ഹിഫിൽ രൂപത്തിന്റെ സാധാരണ അർഥം ‘അറിയിക്കുക/പറയുക’ എന്നാണ്; ‘പറഞ്ഞുതരും’ മലയാളത്തിൽ നിർദേശപരമായ സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: אֵת אֲשֶׁר תַּעֲשִׂין
  choice: എന്തു ചെയ്യണമെന്ന്
  rationale: ബോവസ് രൂത്തിനോട് തുടർനടപടി അറിയിക്കുമെന്ന നിർദേശഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ബോവസിന്റെ കാൽഭാഗം അനാവൃതമാക്കി കിടക്കാനുള്ള നിർദേശത്തിലെ ലൈംഗിക സൂചനാസാധ്യത
  choice: പ്രവൃത്തിയെ വ്യക്തമായി ലൈംഗികമെന്നോ പൂർണമായും നിരപരാധമെന്നോ വ്യാഖ്യാനിക്കാതെ മൂലപാഠത്തിലെ അവ്യക്തത നിലനിർത്തി.
  alternative: ഇത് ലൈംഗിക സമീപനത്തിനുള്ള സൗമ്യപ്രയോഗമായി വ്യാഖ്യാനിക്കുക; അല്ലെങ്കിൽ ബോവസിനെ ഉണർത്താനുള്ള പ്രായോഗിക നടപടി മാത്രമായി വ്യാഖ്യാനിക്കുക.
  rationale: എബ്രായ പ്രയോഗം കഥാപരമായ പിരിമുറുക്കവും അവ്യക്തതയും വഹിക്കുന്നു. വിവർത്തനം അതിനെ പരിഹരിക്കാതെ, സാധ്യമായ അർഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നിർദേശങ്ങളുടെ ക്രമം സ്വാഭാവികമായി നിലനിർത്തി; ‘കാൽഭാഗം’ എന്ന പ്രയോഗത്തിലൂടെ മൂലത്തിലെ അർഥവ്യാപ്തിയും കഥാപരമായ അവ്യക്തതയും സംരക്ഷിച്ചു.
