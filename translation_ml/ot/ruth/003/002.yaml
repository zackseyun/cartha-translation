source:
  edition: WLC
  text: וְ/עַתָּ֗ה הֲ/לֹ֥א בֹ֨עַז֙ מֹֽדַעְתָּ֔/נוּ אֲשֶׁ֥ר הָיִ֖ית אֶת נַעֲרוֹתָ֑י/ו הִנֵּה ה֗וּא זֹרֶ֛ה אֶת גֹּ֥רֶן הַ/שְּׂעֹרִ֖ים הַ/לָּֽיְלָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/002.yaml
  text: And now[a], is not Boaz our relative, with whose young women you have been? Look[b], he is winnowing barley at the threshing floor tonight.
translation:
  language: ml
  text: ഇപ്പോൾ, നീ അവന്റെ യുവതികളോടൊപ്പമായിരുന്ന[b] നമ്മുടെ ബന്ധുവായ[a] ബോവസ് അല്ലേ? നോക്കൂ, അവൻ ഇന്ന് രാത്രി മെതിക്കളത്തിൽ യവം പാറ്റുകയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നമ്മുടെ അടുത്ത ബന്ധു’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം വെറും പരിചയക്കാരനെയല്ല, കുടുംബമോ ഗോത്രമോ വഴിയുള്ള ബന്ധമുള്ളയാളെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘അവന്റെ വേലക്കാരികളോടൊപ്പമായിരുന്ന’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം ബോവസിന്റെ സ്ത്രീത്തൊഴിലാളികളെയോ പരിചാരികമാരെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: നവോമി തന്റെ പദ്ധതിയിലെ അടുത്ത കാര്യത്തിലേക്കു കടക്കുന്നതു സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ ആധുനിക മലയാള പ്രയോഗം; വാവിന്റെ ബന്ധകശക്തി സന്ദർഭത്തിൽ വാക്യപ്രവാഹത്തിലൂടെ നിലനിൽക്കുന്നു.
- source_word: הֲלֹא
  choice: അല്ലേ?
  rationale: സമ്മതം പ്രതീക്ഷിക്കുന്ന എബ്രായ അലങ്കാരചോദ്യത്തിന്റെ സ്വാഭാവിക മലയാള സമാനപ്രയോഗം.
- source_word: מֹדַעְתָּנוּ
  choice: നമ്മുടെ ബന്ധു
  rationale: സന്ദർഭത്തിൽ വെറും പരിചയക്കാരനെയല്ല, കുടുംബമോ ഗോത്രമോ വഴിയുള്ള ബന്ധമുള്ളയാളെ സൂചിപ്പിക്കുന്നു; ‘ബന്ധു’ വ്യക്തവും ആധുനികവുമാണ്.
- source_word: אֲשֶׁר הָיִית אֶת נַעֲרוֹתָיו
  choice: നീ ആരുടെ യുവതികളോടൊപ്പമായിരുന്നോ
  rationale: റൂത്ത് ബോവസിന്റെ സ്ത്രീത്തൊഴിലാളികളോടോ പരിചാരികമാരോടോ ചേർന്നിരുന്നതിനെ സൂചിപ്പിക്കുന്ന ബന്ധവാക്യഘടന നിലനിർത്തുന്നു; മൂലപദത്തിൽ നിർബന്ധമല്ലാത്ത ദാസ്യഭാവം ചേർക്കാതിരിക്കാൻ ‘യുവതികൾ’ തിരഞ്ഞെടുത്തു.
- source_word: הִנֵּה
  choice: നോക്കൂ
  rationale: അടുത്തതായി പറയുന്ന സാഹചര്യത്തിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന പദത്തിന്റെ സൂചനാശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: זֹרֶה
  choice: പാറ്റുകയാണ്
  rationale: ധാന്യത്തിൽനിന്ന് പതിര് വേർതിരിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന മലയാള പദം; എബ്രായ വർത്തമാനകൃദന്തത്തിന്റെ നടന്നുകൊണ്ടിരിക്കുന്നതോ ഉടൻ നടക്കുന്നതോ ആയ ഭാവം നൽകുന്നു.
- source_word: אֶת גֹּרֶן הַשְּׂעֹרִים
  choice: മെതിക്കളത്തിൽ യവം
  rationale: ‘മെതിക്കളം’ വ്യാകരണപരമായി നേരിട്ടുള്ള കർമമായി വന്നാലും ഇവിടെ അവിടെ കിടക്കുന്ന യവധാന്യത്തെ സ്ഥലത്തിന്റെ പേരിലൂടെ സൂചിപ്പിക്കുന്ന പ്രയോഗമായി മനസ്സിലാക്കുന്നു; മലയാളത്തിൽ തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ പ്രവൃത്തിയുടെ വസ്തുവായ ‘യവം’ എന്നും സ്ഥലമായ ‘മെതിക്കളത്തിൽ’ എന്നും സ്വാഭാവികമായി വേർതിരിച്ചു.
- source_word: הַלָּיְלָה
  choice: ഇന്ന് രാത്രി
  rationale: ഈ രാത്രിയെ സൂചിപ്പിക്കുന്ന കാലപ്രയോഗത്തിന്റെ ഏറ്റവും സ്വാഭാവികമായ ആധുനിക മലയാള രൂപം.
theological_decisions:
- issue: מֹדַעְתָּנוּ എന്ന ബന്ധപദത്തിന്റെ പരിധി
  choice: നമ്മുടെ ബന്ധു
  alternative: നമ്മുടെ ചാർച്ചക്കാരൻ / നമ്മുടെ പരിചയക്കാരൻ
  rationale: ഇത് വീണ്ടെടുപ്പുകാരൻ എന്ന നിയമപരമായ പദവി നേരിട്ട് ചുമത്തുന്നില്ല; അതേസമയം കഥാസന്ദർഭത്തിലെ കുടുംബ-ഗോത്രബന്ധം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. അലങ്കാരചോദ്യം ‘അല്ലേ?’ എന്ന രൂപത്തിൽ നിലനിർത്തി. പാരമ്പര്യപരമായി പരിചിതമായെങ്കിലും ഇന്നും വ്യക്തമായ ‘മെതിക്കളം’, ‘യവം’, ‘പാറ്റുക’ എന്നീ കാർഷികപദങ്ങൾ ഉപയോഗിച്ചു. അടിക്കുറിപ്പുകളുടെ അടയാളങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങൾക്കരികിൽ ചേർത്തു.
