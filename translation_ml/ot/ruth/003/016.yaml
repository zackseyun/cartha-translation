id: RUT.3.16
reference: Ruth 3:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תָּבוֹא֙ אֶל חֲמוֹתָ֔/הּ וַ/תֹּ֖אמֶר מִי אַ֣תְּ בִּתִּ֑/י וַ/תַּ֨גֶּד לָ֔/הּ אֵ֛ת כָּל אֲשֶׁ֥ר עָֽשָׂה לָ֖/הּ הָ/אִֽישׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/016.yaml
  text: When she came to her mother-in-law[a], she said, “Who are you, my daughter?” Then she told her all that the man had done for her.
translation:
  language: ml
  text: അവൾ തന്റെ അമ്മായിയമ്മയുടെ അടുക്കൽ എത്തിയപ്പോൾ[a], അമ്മായിയമ്മ അവളോട്, “മകളേ, നീ ആരാണ്?” എന്നു ചോദിച്ചു. അപ്പോൾ ആ മനുഷ്യൻ തനിക്കുവേണ്ടി ചെയ്തതെല്ലാം അവൾ അമ്മായിയമ്മയോടു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, ആശയം വ്യാഖ്യാനിച്ച്: ‘മകളേ, കാര്യങ്ങൾ എങ്ങനെ നടന്നു?’ എബ്രായപാഠം അക്ഷരാർഥത്തിൽ ‘മകളേ, നീ ആരാണ്?’ എന്നാണ്. ഇത് രൂത്തിന്റെ മാറിയ നിലയെയോ അവളുടെ കൂടിക്കാഴ്ചയുടെ ഫലത്തെയോ കുറിച്ചുള്ള ചോദ്യമായിരിക്കാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתָּבוֹא
  choice: അവൾ ... എത്തിയപ്പോൾ
  rationale: വയ്യക്ഷോൽ രൂപം കഥയുടെ സംഭവക്രമം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; തുടർന്നുള്ള ചോദ്യവുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ സമയസൂചകമായ ‘എത്തിയപ്പോൾ’ ഉപയോഗിച്ചു.
- source_word: אֶל חֲמוֹתָהּ
  choice: തന്റെ അമ്മായിയമ്മയുടെ അടുക്കൽ
  rationale: חֲמוֹת എന്നത് പ്രത്യേകമായി ഭർത്താവിന്റെ അമ്മയെ സൂചിപ്പിക്കുന്നു; പ്രത്യയം രൂത്തിനെയാണ് പരാമർശിക്കുന്നത്.
- source_word: מִי אַתְּ
  choice: നീ ആരാണ്?
  rationale: എബ്രായവാക്യത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു. കൂടിക്കാഴ്ചയുടെ ഫലമോ രൂത്തിന്റെ മാറിയ നിലയോ ചോദിക്കുന്ന പ്രയോഗമായിരിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: בִּתִּי
  choice: മകളേ
  rationale: നൊവൊമി രൂത്തിനെ സ്നേഹപൂർവം അഭിസംബോധന ചെയ്യുന്നതിന്റെ കുടുംബബന്ധപരമായ ഊഷ്മളത സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַתַּגֶּד לָהּ
  choice: അവൾ അമ്മായിയമ്മയോടു പറഞ്ഞു
  rationale: נגד എന്ന ഹിഫിൽ രൂപത്തിന്റെ ‘അറിയിക്കുക/പറയുക’ എന്ന സാധാരണ അർഥം; സർവനാമങ്ങളുടെ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ‘അമ്മായിയമ്മ’ ആവർത്തിച്ചു.
- source_word: אֵת כָּל אֲשֶׁר
  choice: ചെയ്തതെല്ലാം
  rationale: സംഭവിച്ച കാര്യങ്ങളുടെ സമ്പൂർണത സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: עָשָׂה לָהּ הָאִישׁ
  choice: ആ മനുഷ്യൻ തനിക്കുവേണ്ടി ചെയ്തത്
  rationale: לָהּ ഇവിടെ രൂത്തിനുവേണ്ടി ചെയ്ത ഉപകാരപ്രദമായ പ്രവൃത്തികളെ സൂചിപ്പിക്കുന്നു; ‘ആ മനുഷ്യൻ’ എന്നത് ബോവസിന്റെ പേര് പറയാത്ത മൂലപാഠരൂപം നിലനിർത്തുന്നു.
theological_decisions:
- issue: മִי אַתְּ എന്ന ചോദ്യത്തിന്റെ വ്യാഖ്യാനം
  choice: പ്രധാനപാഠത്തിൽ അക്ഷരാർഥമായ ‘നീ ആരാണ്?’ നിലനിർത്തി.
  alternative: ‘മകളേ, കാര്യങ്ങൾ എങ്ങനെ നടന്നു?’ അല്ലെങ്കിൽ ‘മകളേ, ഇപ്പോൾ നിന്റെ നില എന്താണ്?’
  rationale: ചോദ്യം രൂത്തിന്റെ തിരിച്ചറിയൽ മാത്രം അന്വേഷിക്കുന്നതല്ലാതെ അവളുടെ പുതിയ നിലയെയോ കൂടിക്കാഴ്ചയുടെ ഫലത്തെയോ സൂചിപ്പിക്കാം. എന്നാൽ മൂലപാഠത്തിലെ ഉദ്ദേശ്യപൂർവമായിരിക്കാവുന്ന അവ്യക്തത വ്യാഖ്യാനിച്ച് തീർക്കാതെ സംരക്ഷിക്കണം.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ‘അമ്മായിയമ്മ’ എന്ന കൃത്യമായ ബന്ധപദവും ‘മകളേ’ എന്ന സ്നേഹപൂർവ അഭിസംബോധനയും ഉപയോഗിച്ചു. സർവനാമസന്ദിഗ്ധത ഒഴിവാക്കാൻ രണ്ടാം വാക്യത്തിൽ സംസാരിക്കുന്നയാളെ ‘അമ്മായിയമ്മ’ എന്നു വ്യക്തമാക്കിയെങ്കിലും മൂലപാഠത്തിലെ പ്രധാന അർഥവ്യക്തത സംരക്ഷിച്ചു.
