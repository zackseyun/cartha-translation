  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עַתָּה֙ כִּ֣י אָמְנָ֔ם כִּ֥י אם גֹאֵ֖ל אָנֹ֑כִי וְ/גַ֛ם יֵ֥שׁ גֹּאֵ֖ל קָר֥וֹב מִמֶּֽ/נִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/012.yaml
  text: And now[a], it is true that I am a redeemer[b], yet there is also a redeemer closer than I.
translation:
  language: ml
  text: ഇപ്പോൾ, ഞാൻ വീണ്ടെടുപ്പവകാശമുള്ള ബന്ധുവാണെന്നത്[a] സത്യംതന്നെ; എങ്കിലും എന്നെക്കാൾ അടുത്ത[b] മറ്റൊരു ബന്ധുവും ഉണ്ട്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘വീണ്ടെടുപ്പുകാരൻ.’ ഹീബ്രു പദം കുടുംബത്തിന്റെ സ്വത്തും അവകാശങ്ങളും വീണ്ടെടുക്കുന്നതുമായി ബന്ധപ്പെട്ട അംഗീകൃത ഉത്തരവാദിത്വങ്ങളുള്ള അടുത്ത ബന്ധുവിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘അടുത്ത’ എന്നത് സ്ഥലപരമായ അടുപ്പമല്ല; കുടുംബബന്ധത്തിന്റെ അടുപ്പത്തെയും അതനുസരിച്ചുള്ള വീണ്ടെടുപ്പവകാശത്തിന്റെ മുൻഗണനയെയും സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: വർത്തമാന വിഷയത്തിലേക്കുള്ള ബോവസിന്റെ സംഭാഷണപരമായ മാറ്റം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; ഹീബ്രു സംയോജകത്തിന്റെ ബന്ധവും സന്ദർഭത്തിൽ നിലനിൽക്കുന്നു.
- source_word: כִּי אָמְנָם כִּי אם
  choice: …എന്നതു സത്യംതന്നെ
  rationale: ഈ ഘടന ബോവസ് ആദ്യം സമ്മതിച്ചുറപ്പിക്കുന്ന കാര്യത്തെ അവതരിപ്പിക്കുന്നു. ‘സത്യംതന്നെ’ അതിന്റെ ഉറപ്പും തുടർന്ന് വരുന്ന പരിമിതപ്പെടുത്തലിനുള്ള ഇടവും നിലനിർത്തുന്നു.
- source_word: גֹאֵל
  choice: വീണ്ടെടുപ്പുകാരൻ
  rationale: കുടുംബാംഗത്തിന്റെ സ്വത്തും അവകാശങ്ങളും വീണ്ടെടുക്കുന്നതുമായി ബന്ധപ്പെട്ട അംഗീകൃത ബന്ധുത്വചുമതലയുള്ളയാളെ സൂചിപ്പിക്കുന്നു. മുഖ്യവാചകത്തിൽ സംക്ഷിപ്തമായ പദം ഉപയോഗിച്ച് നിയമപരവും കുടുംബപരവുമായ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: אָנֹכִי
  choice: ഞാൻ … ആണെന്നതു
  rationale: സ്വതന്ത്ര സർവനാമത്തിന്റെ വ്യക്തമായ ഊന്നൽ മലയാള വാക്യഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: וְגַם יֵשׁ
  choice: എന്നാൽ … ഉണ്ട്
  rationale: മുൻപ്രസ്താവനയെ പരിമിതപ്പെടുത്തുന്ന വസ്തുത അവതരിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ സന്ദർഭത്തിലെ വൈരുധ്യഭാവം നൽകുന്നു; ‘ഉണ്ട്’ അസ്തിത്വപ്രയോഗം സ്വാഭാവികമായി പകരുന്നു.
- source_word: קָרוֹב מִמֶּנִּי
  choice: എന്നെക്കാൾ അടുത്ത
  rationale: ഹീബ്രുവിലെ താരതമ്യപ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു. ഇവിടെ ഉദ്ദേശിക്കുന്നത് സ്ഥലപരമായ അടുപ്പമല്ല, ബന്ധുത്വക്രമത്തിലെ കൂടുതൽ അടുപ്പമാണെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: നിയമപരവും ബന്ധുത്വപരവുമായ സന്ദർഭത്തിൽ גֹאֵל എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: വീണ്ടെടുപ്പുകാരൻ
  alternative: വീണ്ടെടുക്കുന്ന അടുത്ത ബന്ധു; കുടുംബസംരക്ഷക-വീണ്ടെടുപ്പുകാരൻ
  rationale: ഈ വാക്യം പൊതുവായ ആത്മീയ വീണ്ടെടുപ്പിനെക്കാൾ ഇസ്രായേലിലെ കുടുംബവീണ്ടെടുപ്പ് അവകാശങ്ങളെയും ചുമതലകളെയും സംബന്ധിക്കുന്നു. ‘വീണ്ടെടുപ്പുകാരൻ’ മൂലപദത്തിന്റെ കേന്ദ്രാർഥം നിലനിർത്തുന്നു; കൂടുതൽ വിശദമായ പ്രയോഗങ്ങൾ വ്യാഖ്യാനപരമായതിനാൽ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘സത്യംതന്നെ … എന്നാൽ’ എന്ന ഘടന ബോവസിന്റെ സമ്മതവും അതിനെ പരിമിതപ്പെടുത്തുന്ന തുടർവസ്തുതയും വ്യക്തമായി സൂക്ഷിക്കുന്നു. സാങ്കേതികമായ ബന്ധുത്വനിയമത്തിന്റെ വിശദീകരണം മുഖ്യവാചകത്തെ ഭാരപ്പെടുത്താതെ അടിക്കുറിപ്പുകളിൽ നൽകിയിരിക്കുന്നു.
