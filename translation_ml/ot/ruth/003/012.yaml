  - severity: low
    issue: ‘വീണ്ടെടുപ്പുകാരൻ’ can be overly broad in Malayalam in this legal-kinship setting.
    rationale: The source denotes a family redeemer/relative with recognized redemption rights. An explicit kinship rendering better prevents an unintended abstract or spiritual sense.
