  text: അങ്ങനെ അവൾ മെതിക്കളത്തിലേക്കിറങ്ങി, അമ്മായിയമ്മ അവളോടു കൽപിച്ചതെല്ലാം ചെയ്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
