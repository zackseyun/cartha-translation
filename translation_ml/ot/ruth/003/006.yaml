    text: 'അഥവാ: “പിന്നെ അവൾ മെതിക്കളത്തിലേക്കിറങ്ങി; അമ്മായിയമ്മ അവളോടു നിർദേശിച്ച എല്ലാം അവൾ ചെയ്തു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶד
  choice: അങ്ങനെ അവൾ … ഇറങ്ങിച്ചെന്ന്
  rationale: ירד എന്ന ക്രിയയുടെ താഴോട്ടുള്ള ദിശാസൂചന ‘ഇറങ്ങിച്ചെന്ന്’ നിലനിർത്തുന്നു; ആരംഭത്തിലെ וַ കഥയുടെ തുടർച്ചയും മുൻനിർദേശത്തിന്റെ ഫലവും സൂചിപ്പിക്കുന്നതിനാൽ ‘അങ്ങനെ’ സ്വാഭാവികമാണ്.
- source_word: הַגֹּרֶן
  choice: മെതിക്കളത്തിലേക്കു
  rationale: גֹּרֶן ധാന്യം മെതിക്കുന്ന സ്ഥലത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ സ്വാഭാവികവും കൃഷിസന്ദർഭത്തിന് യോജിച്ചതുമായ പദമാണ് ‘മെതിക്കളം’.
- source_word: וַתַּעַשׂ
  choice: പ്രവർത്തിച്ചു
  rationale: עשה എന്ന വിശാലാർത്ഥമുള്ള ക്രിയ ഇവിടെ നൽകിയ കല്പനകൾ നടപ്പാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘അനുസരിച്ചു പ്രവർത്തിച്ചു’ എന്ന പ്രയോഗം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: כְּכֹל אֲשֶׁר
  choice: കല്പിച്ചതെല്ലാം അനുസരിച്ചു
  rationale: ഈ ഘടന മുൻപ് നൽകിയ നിർദേശങ്ങളോടുള്ള പൂർണമായ അനുരൂപത സൂചിപ്പിക്കുന്നു; ‘എല്ലാം’ כֹל എന്നതിന്റെ സമഗ്രതയും ‘അനുസരിച്ചു’ כְּ എന്ന ബന്ധവും പ്രകടമാക്കുന്നു.
- source_word: צִוַּתָּה
  choice: കല്പിച്ചതു
  rationale: צוה എന്ന ക്രിയയുടെ ആജ്ഞാപരമായ ശക്തി മൃദൂകരിക്കാതെ ‘കല്പിച്ചു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: חֲמוֹתָהּ
  choice: അമ്മായിയമ്മ
  rationale: ഈ ബന്ധപദം അവളുടെ ഭർത്താവിന്റെ അമ്മയായ നൊവൊമിയെ കൃത്യമായി സൂചിപ്പിക്കുന്നു; ‘അവൾ’ എന്ന കർത്താവിൽനിന്ന് ഉടമസ്ഥബന്ധം സന്ദർഭത്തിൽ വ്യക്തമാണ്.
