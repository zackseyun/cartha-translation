  register: ആധുനിക നിലവാര മലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘കല്പിച്ചു’ മൂലപദത്തിന്റെ ശക്തി നിലനിർത്തുമ്പോൾ, ‘അനുസരിച്ചു പ്രവർത്തിച്ചു’ മലയാളത്തിലെ സ്വാഭാവിക വാക്യഘടന ഉറപ്പാക്കുന്നു.
