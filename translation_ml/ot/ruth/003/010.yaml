id: RUT.3.10
reference: Ruth 3:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר בְּרוּכָ֨ה אַ֤תְּ לַֽ/יהוָה֙ בִּתִּ֔/י הֵיטַ֛בְתְּ חַסְדֵּ֥/ךְ הָ/אַחֲר֖וֹן מִן הָ/רִאשׁ֑וֹן לְ/בִלְתִּי לֶ֗כֶת אַחֲרֵי֙ הַ/בַּ֣חוּרִ֔ים אִם דַּ֖ל וְ/אִם עָשִֽׁיר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/010.yaml
  text: And he said[a], “May you be blessed by Yahweh, my daughter. You have made this last kindness greater than the first by not going after the young men, whether poor or rich.”
translation:
  language: ml
  text: 'അപ്പോൾ അവൻ പറഞ്ഞു: “എന്റെ മകളേ, യാഹ്‌വേ നിന്നെ അനുഗ്രഹിക്കട്ടെ. ദരിദ്രരോ ധനികരോ ആയ യുവാക്കളുടെ പിന്നാലെ പോകാതിരുന്നതിലൂടെ, നിന്റെ ആദ്യത്തെ ദയയെക്കാൾ മഹത്തരമായ ഈ ഒടുവിലത്തെ ദയ[a] നീ കാണിച്ചിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ദയ” എന്നതിന് “അചഞ്ചല സ്നേഹം,” “വിശ്വസ്തത,” അല്ലെങ്കിൽ “ഉടമ്പടി വിശ്വസ്തത” എന്നും അർഥമാകാം (חֶסֶד).
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרוּכָה אַתְּ לַיהוָה
  choice: യഹോവ നിന്നെ അനുഗ്രഹിക്കട്ടെ
  rationale: സ്ത്രീലിംഗ ഏകവചനത്തിലുള്ള ആശീർവാദസൂത്രത്തിന്റെ അനുഗ്രഹപ്രാർത്ഥനാഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ദൈവനാമം യഹോവ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: בִּתִּי
  choice: എന്റെ മകളേ
  rationale: ബോവസ് രൂത്തിനോട് പ്രായത്തിലും സാമൂഹികസ്ഥാനത്തിലും മുതിർന്നവനെന്ന നിലയിൽ സ്നേഹപൂർവം നടത്തുന്ന അഭിസംബോധനയിലെ കുടുംബരൂപകം നിലനിർത്തുന്നു.
- source_word: הֵיטַבְתְּ חַסְדֵּךְ הָאַחֲרוֹן מִן הָרִאשׁוֹן
  choice: നിന്റെ ആദ്യത്തെ ദയയെക്കാൾ മഹത്തായ ദയയാണ് ഇപ്പോൾ നീ കാണിച്ചിരിക്കുന്നത്
  rationale: ഇപ്പോഴത്തെ പ്രവൃത്തിയെയും മുമ്പത്തെ ദയയെയും താരതമ്യം ചെയ്യുന്ന എബ്രായ പ്രയോഗം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: חַסְדֵּךְ
  choice: നിന്റെ ... ദയ
  rationale: ഈ കഥാസന്ദർഭത്തിൽ രൂത്ത് നൊവൊമിയുടെ കുടുംബത്തോടു കാണിക്കുന്ന വിശ്വസ്തവും ഉദാരവുമായ നന്മയെ സൂചിപ്പിക്കാൻ ‘ദയ’ സ്വാഭാവികമാണ്; പദത്തിന്റെ വിശ്വസ്തതാഭാവം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: לְבִלְתִּי לֶכֶת אַחֲרֵי
  choice: പിന്നാലെ പോകാതിരുന്നതിലൂടെ
  rationale: രൂത്തിന്റെ ഇപ്പോഴത്തെ ദയ എങ്ങനെ കൂടുതൽ മഹത്തായി എന്ന് വിശദീകരിക്കുന്ന അനന്തരക്രിയാപ്രയോഗത്തിന്റെ അർഥം നിലനിർത്തുന്നു.
- source_word: הַבַּחוּרִים
  choice: യുവാക്കൾ
  rationale: വിവാഹസാധ്യതയുള്ള ചെറുപ്പക്കാരായ പുരുഷന്മാരെയാണ് സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്; ബോവസുമായുള്ള താരതമ്യം മൂലപാഠം നേരിട്ട് പറയാത്തതിനാൽ ‘കൂടുതൽ ചെറുപ്പക്കാരായവർ’ എന്നു വികസിപ്പിച്ചില്ല.
- source_word: אִם דַּל וְאִם עָשִׁיר
  choice: ദരിദ്രരോ ധനികരോ ആയ
  rationale: എല്ലാ സാമ്പത്തിക നിലകളെയും ഉൾക്കൊള്ളുന്ന വിരുദ്ധജോടിയെ നേരിട്ടും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: കഥാസന്ദർഭത്തിലെ חֶסֶד എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ദയ
  alternative: അചഞ്ചലസ്നേഹം; വിശ്വസ്തത; ഉടമ്പടിവിശ്വസ്തത
  rationale: ഇവിടെ രൂത്ത് പ്രണയമോ സാമ്പത്തികനേട്ടമോ തേടാതെ കുടുംബത്തിന്റെ നന്മയ്ക്കായി ചെയ്ത വിശ്വസ്ത പ്രവൃത്തിയെയാണ് ബോവസ് പ്രശംസിക്കുന്നത്. ‘ദയ’ കഥയുടെ നേരിട്ടുള്ള അർഥം ലളിതമായി നൽകുന്നു; പദത്തിന്റെ കൂടുതൽ സമ്പന്നമായ ബന്ധപരമായ അർഥങ്ങൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ അവതരണം
  choice: യഹോവ
  alternative: യാഹ്‌വെ; കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ചതുരക്ഷര ദൈവനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപത്തിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ കഥാഭാഷ ഉപയോഗിച്ചു. ആശീർവാദത്തിന്റെ ഭാവം, ബോവസിന്റെ സ്നേഹപൂർവമായ അഭിസംബോധന, ആദ്യത്തെയും ഇപ്പോഴത്തെയും ദയകളുടെ താരതമ്യം എന്നിവ വ്യക്തമാക്കി; മൂലപാഠം നിർണ്ണയിക്കാത്ത വ്യാഖ്യാനവിശദാംശങ്ങൾ മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
