    issue: ‘ഞെട്ടിവിറച്ച്’ is somewhat interpretive for וַיֶּחֱרַד.
    rationale: חרד denotes trembling, shaking, or being alarmed, but the text does not require both an explicit startle and trembling. ‘വിറച്ചു’ preserves the reaction while leaving its precise emotional force open.
  - severity: low
    issue: Present-tense ‘കിടക്കുന്നു!’ weakens the past narrative framing.
    rationale: The Hebrew participle describes the woman's state at the moment of discovery within a sequence of past events. ‘കിടന്നിരുന്നു’ naturally conveys this ongoing state in Malayalam.
