source:
  edition: WLC
  text: וַ/יְהִי֙ בַּ/חֲצִ֣י הַ/לַּ֔יְלָה וַ/יֶּחֱרַ֥ד הָ/אִ֖ישׁ וַ/יִּלָּפֵ֑ת וְ/הִנֵּ֣ה אִשָּׁ֔ה שֹׁכֶ֖בֶת מַרְגְּלֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/008.yaml
  text: And it happened at midnight that the man trembled and turned himself[a], and behold[b], a woman was lying at his feet.
translation:
  language: ml
  text: അർധരാത്രിയിൽ ആ മനുഷ്യൻ വിറച്ചു തിരിഞ്ഞു[a]; ഇതാ, ഒരു സ്ത്രീ അവന്റെ കാൽക്കൽ[b] കിടന്നിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ശരീരം വളച്ചു’ അല്ലെങ്കിൽ ‘പെട്ടെന്ന് ചലിച്ചു’ എന്നും ആകാം; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രായ ക്രിയ അപൂർവമാണ്. ഞെട്ടലിൽ അദ്ദേഹം തിരിയുകയോ ശരീരം വളയ്ക്കുകയോ ചെയ്തതിനെ അത് സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രായ പ്രയോഗം കാലുകളെ മാത്രമല്ല, കാലുകളുടെയോ കീഴ്ക്കാലുകളുടെയോ ഭാഗത്തുള്ള സ്ഥലത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: അർധരാത്രിയിൽ
  rationale: ഹീബ്രായ ആഖ്യാനത്തിലെ അടുത്ത സംഭവം അവതരിപ്പിക്കുന്ന വַיְהִי മലയാളത്തിൽ പ്രത്യേകമായി ‘സംഭവിച്ചു’ എന്നു ചേർക്കാതെ സ്വാഭാവികമായ കഥാപ്രവാഹത്തിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: בַּחֲצִי הַלַּיְלָה
  choice: അർധരാത്രിയിൽ
  rationale: പദപ്രയോഗത്തിന്റെ അർഥം ‘രാത്രിയുടെ മധ്യത്തിൽ’ എന്നാണ്; ‘അർധരാത്രിയിൽ’ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ തുല്യപ്രയോഗമാണ്.
- source_word: וַיֶּחֱרַד
  choice: ഞെട്ടിവിറച്ച്
  rationale: חרד സൂചിപ്പിക്കുന്ന പെട്ടെന്നുള്ള ഞെട്ടലും ശാരീരികമായ വിറയലും ഒരുമിച്ച് നിലനിർത്തുന്നു; ഭയം എന്ന വികാരം മാത്രം നിർബന്ധമായി ചുമത്തുന്നില്ല.
- source_word: הָאִישׁ
  choice: ആ മനുഷ്യൻ
  rationale: സന്ദർഭത്തിൽ ബോവസിനെ സൂചിപ്പിക്കുന്ന സാധാരണ പുരുഷവ്യക്തിനാമം; ‘ഭർത്താവ്’ പോലുള്ള അർഥം ഇവിടെ യോജിക്കുന്നില്ല.
- source_word: וַיִּלָּפֵת
  choice: തിരിഞ്ഞു
  rationale: അപൂർവമായ ഈ ക്രിയ ശരീരം തിരിക്കുകയോ വളയ്ക്കുകയോ പെട്ടെന്ന് ചലിപ്പിക്കുകയോ ചെയ്തതിനെ സൂചിപ്പിക്കാം. പ്രധാന പാഠത്തിൽ കൂടുതൽ നിർദിഷ്ടമായ ചലനം ചുമത്താതെ ‘തിരിഞ്ഞു’ എന്നു നൽകി അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: പെട്ടെന്നുള്ള തിരിച്ചറിവും അതിശയവും അടയാളപ്പെടുത്തുന്ന הִנֵּהയുടെ ആഖ്യാനശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: אִשָּׁה
  choice: ഒരു സ്ത്രീ
  rationale: ഈ സന്ദർഭത്തിലെ നേരായ അർഥം ‘സ്ത്രീ’ എന്നാണ്; ‘ഭാര്യ’ എന്നു വിവർത്തനം ചെയ്യുന്നത് തെറ്റായ ബന്ധം സൂചിപ്പിക്കും.
- source_word: שֹׁכֶבֶת
  choice: കിടക്കുന്നു
  rationale: കണ്ടെത്തുന്ന നിമിഷത്തിൽ തുടരുന്ന ശരീരനിലയെ ഹീബ്രായ വർത്തമാന കൃദന്തത്തിനു യോജിച്ചവിധം അവതരിപ്പിക്കുന്നു.
- source_word: מַרְגְּלֹתָיו
  choice: അവന്റെ കാൽക്കൽ
  rationale: കാലുകളെയോ കാലുകളുടെ ഭാഗത്തുള്ള സ്ഥലത്തെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാളം; അനാവശ്യമായ ലൈംഗിക വ്യാഖ്യാനം പ്രധാന പാഠത്തിൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: രംഗത്തെ ലൈംഗികമോ ശ്ലേഷാത്മകമോ ആയി അതിവ്യാഖ്യാനിക്കാനുള്ള സാധ്യത
  choice: സ്ത്രീ ബോവസിന്റെ കാൽക്കൽ കിടക്കുന്നതായി നേരിട്ട് വിവർത്തനം ചെയ്തു.
  alternative: ‘അവന്റെ കാലുകളുടെയോ കീഴ്ക്കാലുകളുടെയോ ഭാഗത്ത്’ എന്നു വിപുലീകരിച്ച് സാധ്യതയുള്ള സൂചന മുൻനിരയിൽ കൊണ്ടുവരിക.
  rationale: ഹീബ്രായ പാഠം ഒരു ലൈംഗിക പ്രവൃത്തി വ്യക്തമായി പ്രസ്താവിക്കുന്നില്ല. അതിനാൽ പാഠം പറയാത്ത ധാർമികമോ ലൈംഗികമോ ആയ വിധിനിർണയം ചേർക്കാതെ, സ്ഥലസൂചനയുടെ വ്യാപ്തി അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘അതാ’ എന്ന പ്രയോഗം കണ്ടെത്തലിന്റെ പെട്ടെന്നുള്ള സ്വഭാവം നിലനിർത്തുന്നു. അപൂർവക്രിയയുടെയും സ്ഥലസൂചനയുടെയും യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
