id: RUT.3.11
reference: Ruth 3:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עַתָּ֗ה בִּתִּ/י֙ אַל תִּ֣ירְאִ֔י כֹּ֥ל אֲשֶׁר תֹּאמְרִ֖י אֶֽעֱשֶׂה לָּ֑/ךְ כִּ֤י יוֹדֵ֨עַ֙ כָּל שַׁ֣עַר עַמִּ֔/י כִּ֛י אֵ֥שֶׁת חַ֖יִל אָֽתְּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/011.yaml
  text: And now[a], my daughter, do not fear. All that you say, I will do for you[b], for all the gate of my people knows that you are a woman of noble character.
translation:
  language: ml
  text: ഇപ്പോൾ, എന്റെ മകളേ, ഭയപ്പെടേണ്ട. നീ പറയുന്നതെല്ലാം ഞാൻ നിനക്കുവേണ്ടി ചെയ്യും. നീ ഉത്തമയായ സ്ത്രീയാണെന്ന് എന്റെ ജനത്തിന്റെ പട്ടണവാതിൽക്കലുള്ള എല്ലാവർക്കും അറിയാം.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പട്ടണവാതിൽ പുരാതന ഇസ്രായേലിൽ പൊതുയോഗങ്ങളും നിയമനടപടികളും നടന്നിരുന്ന സ്ഥലമായിരുന്നു; അതിനാൽ ഇവിടെ ‘പട്ടണവാതിൽക്കലുള്ള എല്ലാവരും’ എന്നത് പൊതുസമൂഹത്തെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: b
    text: അഥവാ ‘യോഗ്യയായ സ്ത്രീ,’ ‘ശ്രേഷ്ഠയായ സ്ത്രീ,’ ‘വീര്യവതിയായ സ്ത്രീ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּתִּי
  choice: എന്റെ മകളേ
  rationale: അക്ഷരാർഥത്തിലുള്ള കുടുംബസംബോധന നിലനിർത്തുന്നു; ഇവിടെ അത് ജൈവബന്ധം സൂചിപ്പിക്കണമെന്നില്ല, മറിച്ച് ബോവസിന്റെ ഊഷ്മളവും സംരക്ഷണാത്മകവുമായ അഭിസംബോധനയാണ്.
- source_word: אַל תִּירְאִי
  choice: ഭയപ്പെടേണ്ട
  rationale: നിഷേധകണത്തോടുകൂടിയ നിർദേശത്തെ സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: כֹּל אֲשֶׁר תֹּאמְרִי אֶעֱשֶׂה לָּךְ
  choice: നീ പറയുന്നതെല്ലാം ഞാൻ നിനക്കുവേണ്ടി ചെയ്യും
  rationale: ‘പറയുക’ എന്ന മൂലക്രിയ നിലനിർത്തുകയും സന്ദർഭത്തിലെ അഭ്യർഥനാഭാവം അനാവശ്യമായി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: כָּל שַׁעַר עַמִּי
  choice: എന്റെ ജനത്തിന്റെ പട്ടണവാതിൽക്കലുള്ള എല്ലാവർക്കും
  rationale: ‘വാതിൽ’ എന്ന സാംസ്കാരിക പ്രതീകം നിലനിർത്തിക്കൊണ്ട്, അത് ജനസമൂഹത്തെയും പൊതുവേദിയെയും സൂചിപ്പിക്കുന്ന മേതോനിമിയാണെന്ന് മലയാളത്തിൽ വ്യക്തമായി വായിക്കാവുന്ന വിധം നൽകുന്നു.
- source_word: אֵשֶׁת חַיִל
  choice: ഉത്തമയായ സ്ത്രീ
  rationale: חַיִל ഉൾക്കൊള്ളുന്ന യോഗ്യത, ശക്തി, മൂല്യം, സദ്ഗുണം എന്നീ അർഥവ്യാപ്തികളെ സന്ദർഭോചിതമായി സംക്ഷിപ്തമായി നൽകുന്നു; മറ്റു സാധ്യമായ അർഥങ്ങൾ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: אֵשֶׁת חַיִל എന്ന പ്രശംസാവാക്യത്തിന്റെ പരിഭാഷ
  choice: ഉത്തമയായ സ്ത്രീ
  alternative: യോഗ്യയായ സ്ത്രീ; ശ്രേഷ്ഠയായ സ്ത്രീ; വീര്യവതിയായ സ്ത്രീ
  rationale: പ്രയോഗത്തെ കേവലം ധാർമികതയിലേക്കോ ഗാർഹികതയിലേക്കോ ചുരുക്കാതെ രൂത്തിന്റെ പൊതുവായി അംഗീകരിക്കപ്പെട്ട യോഗ്യത, ശക്തി, സദ്ഗുണം എന്നിവ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ അനാവശ്യമായ സൈനികഭാവം ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ബോവസിന്റെ ആശ്വാസകരമായ അഭിസംബോധനയും രൂത്തിന്റെ പൊതുസമ്മതമായ സൽപ്പേരും വ്യക്തമായി നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട ആശയങ്ങൾക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
