  source_fidelity: 'The Malayalam accurately represents the Hebrew sequence and sense: the affectionate address "my daughter," the reassurance, Boaz’s comprehensive commitment, the public/community metonymy of "gate," and Ruth’s recognized status as אֵשֶׁת־חַיִל. "പട്ടണവാതിൽക്കലുള്ള എല്ലാവർക്കും" is an intelligible contextual rendering of the idiomatic "all the gate of my people," and the cultural note appropriately explains it.'
