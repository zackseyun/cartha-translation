  yaml_path: translation/ot/ruth/003/009.yaml
  text: He said[a], “Who are you?” And she said, “I am Ruth, your servant. Spread your wing over your servant[b], for you are a redeemer.”
translation:
  language: ml
  text: 'അവൻ ചോദിച്ചു: “നീ ആരാണ്?” അവൾ പറഞ്ഞു: “ഞാൻ അങ്ങയുടെ ദാസിയായ രൂത്താണ്. അങ്ങയുടെ ചിറക്[a] അങ്ങയുടെ ദാസിയുടെമേൽ വിരിക്കണമേ; കാരണം അങ്ങ് ഒരു വീണ്ടെടുപ്പുകാരനാണ്[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “അങ്ങയുടെ വസ്ത്രത്തിന്റെ അറ്റം അങ്ങയുടെ ദാസിയുടെമേൽ വിരിക്കണമേ.” എബ്രായപദത്തിന് ‘ചിറക്’ എന്നും വസ്ത്രത്തിന്റെ ‘അറ്റം’ എന്നും അർഥമാകാം; ഇവിടെ സംരക്ഷണവും വിവാഹബന്ധവുമായി ബന്ധപ്പെട്ട അപേക്ഷയും ഒരുമിച്ച് സൂചിപ്പിച്ചിരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ “ബന്ധു-വീണ്ടെടുപ്പുകാരൻ”; അതായത്, ഒരു ബന്ധുവിനുവേണ്ടി പ്രവർത്തിക്കാൻ അംഗീകൃതമായ ചുമതലയുള്ള കുടുംബാംഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי אָתּ
  choice: നീ ആരാണ്?
  rationale: ആളെ തിരിച്ചറിയാൻ ചോദിക്കുന്ന ലളിതമായ ചോദ്യമായി സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
- source_word: אָנֹכִי רוּת
  choice: ഞാൻ അങ്ങയുടെ ദാസിയായ രൂത്താണ്
  rationale: എബ്രായത്തിലെ ക്രിയയില്ലാത്ത സ്വപരിചയം മലയാളത്തിൽ സ്വാഭാവികമായ ‘ആണ്’ ചേർത്ത് വിവർത്തനം ചെയ്തു; പിന്നാലെയുള്ള വിനയസൂചകമായ സ്വയംവിശേഷണവുമായി ഒഴുക്കോടെ ബന്ധിപ്പിച്ചു.
- source_word: אֲמָתֶךָ / אֲמָתְךָ
  choice: അങ്ങയുടെ ദാസി
  rationale: אמה സ്ത്രീദാസിയെ സൂചിപ്പിക്കുന്നു. ‘ദാസി’ ലിംഗസൂചനയും രൂത്തിന്റെ വിനയപൂർവമായ സ്വയംവിശേഷണവും നിലനിർത്തുന്നു; രണ്ടു പ്രയോഗങ്ങളിലും ഒരേ പദം ഉപയോഗിച്ചു.
- source_word: וּפָרַשְׂתָּ
  choice: വിരിച്ചാലും
  rationale: פרשׂ എന്ന ക്രിയയുടെ ‘വിരിക്കുക/നീട്ടിവിരിക്കുകയ’ എന്ന അർഥം നിലനിർത്തുകയും അപേക്ഷയുടെ വിനയപൂർവമായ ഭാവം മലയാളത്തിൽ പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: כְנָפֶךָ
  choice: അങ്ങയുടെ ചിറക്
  rationale: כנף എന്ന പദത്തിന്റെ അടിസ്ഥാനമായ ‘ചിറക്’ എന്ന ദൃശ്യം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു. വസ്ത്രത്തിന്റെ അറ്റം എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയതിനാൽ സംരക്ഷണത്തിന്റെയും വിവാഹാവകാശവാദത്തിന്റെയും ഇരട്ടധ്വനി നഷ്ടപ്പെടുന്നില്ല.
- source_word: עַל
  choice: മേൽ
  rationale: മൂടുകയോ സംരക്ഷിക്കുകയോ ചെയ്യുന്ന ദൃശ്യത്തിന് അനുയോജ്യമായ സ്വാഭാവിക മലയാളസമാനം.
- source_word: כִּי
  choice: കാരണം
  rationale: രൂത്തിന്റെ അപേക്ഷയ്ക്കുള്ള കാരണം അവതരിപ്പിക്കുന്ന ബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: גֹאֵל
  choice: വീണ്ടെടുപ്പുകാരൻ
  rationale: גאל എന്ന മൂലത്തിന്റെ വീണ്ടെടുക്കൽ ആശയം നിലനിർത്തുന്ന പ്രധാനപദമാണിത്. കുടുംബബന്ധത്തിൽ അധിഷ്ഠിതമായ നിയമപരമായ ചുമതല അടിക്കുറിപ്പിൽ വിശദീകരിക്കുന്നു.
theological_decisions:
- issue: ‘അങ്ങയുടെ ചിറക്’ എന്ന രൂപകത്തിന്റെ അർഥവ്യാപ്തി
  choice: മുഖ്യപാഠത്തിൽ ‘ചിറക്’ എന്ന മൂർത്തദൃശ്യം നിലനിർത്തി.
  alternative: ‘അങ്ങയുടെ വസ്ത്രത്തിന്റെ അറ്റം’ എന്നു വിവർത്തനം ചെയ്ത് വിവാഹസൂചന മുൻനിരയിൽ കൊണ്ടുവരുക.
  rationale: כנף എന്ന പദത്തിന് ചിറക് എന്നും വസ്ത്രത്തിന്റെ അറ്റം എന്നും അർഥമാകാം. സംരക്ഷണവും വിവാഹബന്ധത്തിനായുള്ള അപേക്ഷയും ഒരുമിച്ച് സൂചിപ്പിക്കുന്ന മനഃപൂർവമായ ഇരട്ടധ്വനി തീർപ്പാക്കാതെ നിലനിർത്തുന്നു.
- issue: גֹאֵל എന്ന കുടുംബ-നിയമപരമായ പദവി
  choice: മുഖ്യപാഠത്തിൽ ‘വീണ്ടെടുപ്പുകാരൻ’ എന്നു നൽകി, കുടുംബബന്ധത്തിന്റെ സൂക്ഷ്മത അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
  alternative: ‘ബന്ധു-വീണ്ടെടുപ്പുകാരൻ’ അല്ലെങ്കിൽ ‘കുടുംബവീണ്ടെടുപ്പുകാരൻ’ എന്നു മുഖ്യപാഠത്തിൽ നൽകുക.
  rationale: ഒറ്റ വിശദീകരണസംയുക്തപദം ഉപയോഗിച്ച് നിയമപരവും കുടുംബപരവും പുനഃസ്ഥാപനപരവുമായ അർഥവ്യാപ്തി ചുരുക്കാതിരിക്കാൻ മുഖ്യപദം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സ്വാഭാവികവുമായ സംഭാഷണശൈലി സ്വീകരിച്ചു. ബോവസിനോടുള്ള രൂത്തിന്റെ ആദരവ് ‘അങ്ങ്/അങ്ങയുടെ’ എന്ന പ്രയോഗത്തിലൂടെ പ്രകടമാക്കി. ‘ദാസി’, ‘ചിറക്’, ‘വീണ്ടെടുപ്പുകാരൻ’ എന്നീ പദങ്ങൾ വാക്യത്തിന്റെ ഗൗരവവും മുഖ്യ എബ്രായദൃശ്യങ്ങളും നിലനിർത്തുന്നു.
