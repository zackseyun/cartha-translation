translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ നിർദേശശൈലി ഉപയോഗിച്ചു. ഹീബ്രുവിലെ ക്രിയാക്രമം മലയാളത്തിൽ സുതാര്യമാക്കാൻ ആദ്യ ഒരുക്കങ്ങൾ ക്രിയാവിശേഷണരൂപത്തിലും പ്രധാന കല്പന ‘ധരിക്കൂ/ഇറങ്ങിച്ചെല്ലൂ’ രൂപത്തിലും നൽകി. ‘ബോവസ്’ എന്നും ‘നല്ല വസ്ത്രം’ എന്നും മൂലത്തിൽ ഇല്ലാത്ത വിശദീകരണങ്ങൾ മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
