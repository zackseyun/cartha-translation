  text: וְ/רָחַ֣צְתְּ וָ/סַ֗כְתְּ וְ/שַׂ֧מְתְּ שמלת/ך עָלַ֖יִ/ךְ ו/ירדתי הַ/גֹּ֑רֶן אַל תִּוָּדְעִ֣י לָ/אִ֔ישׁ עַ֥ד כַּלֹּת֖/וֹ לֶ/אֱכֹ֥ל וְ/לִ/שְׁתּֽוֹת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/003.yaml
  text: Wash yourself[a], anoint yourself, and put your cloak on; then go down to the threshing floor[c][b]. Do not make yourself known to the man until he has finished eating and drinking.
translation:
  language: ml
  text: നീ കുളിച്ച്[a], തൈലം പുരട്ടി, നിന്റെ മേലങ്കി ധരിക്കൂ[b]. പിന്നെ മെതിക്കളത്തിലേക്കു ഇറങ്ങിച്ചെല്ലൂ[c]. അവൻ തിന്നുകയും കുടിക്കുകയും ചെയ്തു തീരുന്നതുവരെ നിന്നെ ആ മനുഷ്യനു വെളിപ്പെടുത്തരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ശരീരം കഴുകി.” എബ്രായക്രിയയ്ക്ക് ശരീരം കഴുകുക എന്നോ കുളിക്കുക എന്നോ അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “നിന്റെ വസ്ത്രം ധരിക്കൂ.” എബ്രായപദം പൊതുവേ ഒരു വസ്ത്രത്തെയോ മേലങ്കിയെയോ സൂചിപ്പിക്കുന്നു; ചില വിവർത്തനങ്ങൾ ഇതിനെ കൂടുതൽ പ്രത്യേകമായി ഉത്സവവസ്ത്രമെന്നോ ഏറ്റവും നല്ല വസ്ത്രമെന്നോ വ്യാഖ്യാനിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: ഇവിടത്തെ എബ്രായ വ്യഞ്ജനരൂപം അസാധാരണമാണ്. സന്ദർഭത്തിൽ ഇത് സാധാരണയായി രൂത്തിനോടുള്ള നൊവൊമിയുടെ തുടർനിർദേശമായി, “മെതിക്കളത്തിലേക്കു ഇറങ്ങിച്ചെല്ലൂ,” എന്നു മനസ്സിലാക്കപ്പെടുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: וְרָחַצְתְּ
  choice: നീ കുളിച്ച്
  rationale: רחץ ശരീരം കഴുകുന്നതിനെയോ കുളിക്കുന്നതിനെയോ സൂചിപ്പിക്കാം. ഈ ഒരുക്കങ്ങളുടെ സന്ദർഭത്തിൽ ‘കുളിച്ച്’ സ്വാഭാവികമാണ്; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וָסַכְתְּ
  choice: തൈലം പുരട്ടി
  rationale: סוך ശരീരത്തിൽ എണ്ണയോ സുഗന്ധതൈലമോ പുരട്ടുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘തൈലം പുരട്ടി’ എന്നത് ‘സുഗന്ധദ്രവ്യം പൂശി’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ വിവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: וְשַׂמְתְּ שמלתך עָלַיִךְ
  choice: നിന്റെ മേലങ്കി ധരിക്കൂ
  rationale: שִׂמְלָה പൊതുവേ വസ്ത്രമോ പുറംവസ്ത്രമോ ആണ്. ‘മേലങ്കി’ സാധ്യതയുള്ള അർഥം നൽകുന്നു; എബ്രായത്തിൽ വ്യക്തമല്ലാത്ത ‘ഏറ്റവും നല്ല വസ്ത്രം’ എന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: וירדתי הַגֹּרֶן
  choice: പിന്നെ മെതിക്കളത്തിലേക്കു ഇറങ്ങിച്ചെല്ലൂ
  rationale: ലിഖിത വ്യഞ്ജനരൂപം അസാധാരണമാണ്; സന്ദർഭവും വായനാപാരമ്പര്യവും രൂത്തിനോടുള്ള രണ്ടാം പുരുഷ ഏകവചന സ്ത്രീലിംഗ കല്പനയെ പിന്തുണയ്ക്കുന്നു. גֹּרֶן എന്നതിന് ‘മെതിക്കളം’ സ്വാഭാവികമായ മലയാള പദമാണ്.
- source_word: אַל תִּוָּדְעִי לָאִישׁ
  choice: ആ മനുഷ്യൻ നിന്നെ തിരിച്ചറിയാൻ ഇടവരരുത്
  rationale: ידע-യുടെ നിഫാൽ രൂപം ഇവിടെ അറിയപ്പെടുക/തിരിച്ചറിയപ്പെടുക എന്ന ആശയം നൽകുന്നു. לָאִישׁ എന്നത് സന്ദർഭത്തിലെ പ്രത്യേക മനുഷ്യനെ സൂചിപ്പിക്കുന്നതിനാൽ ബോവസിന്റെ പേര് ചേർക്കാതെ ‘ആ മനുഷ്യൻ’ എന്നു വിവർത്തനം ചെയ്യുന്നു.
- source_word: עַד כַּלֹּתוֹ לֶאֱכֹל וְלִשְׁתּוֹת
  choice: അവൻ തിന്നുകയും കുടിക്കുകയും ചെയ്തു കഴിയുന്നതുവരെ
  rationale: כלהയും ക്രിയാനാമങ്ങളും ചേർന്ന് രണ്ടു പ്രവൃത്തികളുടെയും പൂർത്തീകരണം സൂചിപ്പിക്കുന്നു; ഈ മലയാളരൂപം സമയബന്ധം വ്യക്തമായി നൽകുന്നു.
