revisions:
- from: 'അങ്ങനെ അവൾ പ്രഭാതംവരെ അവന്റെ കാൽക്കൽ കിടന്നു. ഒരാൾക്ക് മറ്റൊരാളെ തിരിച്ചറിയാൻ കഴിയുന്നതിനു മുമ്പേ[a] അവൾ എഴുന്നേറ്റു. അപ്പോൾ അവൻ പറഞ്ഞു[b]: “ആ സ്ത്രീ മെതിക്കളത്തിൽ വന്ന കാര്യം ആരും അറിയരുത്.”'
  to: 'അങ്ങനെ അവൾ പ്രഭാതം വരെ അവന്റെ കാൽക്കൽ കിടന്നു. ഒരാൾക്ക് മറ്റൊരാളെ തിരിച്ചറിയാൻ കഴിയുന്നതിനു മുമ്പേ[a] അവൾ എഴുന്നേറ്റു. അപ്പോൾ അവൻ പറഞ്ഞു[b]: “ആ സ്ത്രീ മെതിക്കളത്തിൽ വന്നതായി അറിയപ്പെടരുത്.”'
  rationale: അവസാനവാക്യം മൂലത്തിലെ നിഷ്ക്രിയ നിഷേധാജ്ഞയുടെ ഭാവം വ്യക്തമായി നിലനിർത്തുന്നതിനായി ‘അറിയപ്പെടരുത്’ എന്നു തിരുത്തി. ‘പ്രഭാതം വരെ’ എന്ന സാധാരണ വേർതിരിച്ചെഴുത്തും സ്വീകരിച്ചു. മറ്റെല്ലാ വാചകങ്ങളും മൂലപാഠത്തിലെ സൂചനാത്മകതയും സ്വാഭാവിക മലയാള ആഖ്യാനരീതിയും മതിയായവിധം സംരക്ഷിക്കുന്നു.
