source:
  edition: WLC
  text: וַ/תִּשְׁכַּ֤ב מרגלת/ו עַד הַ/בֹּ֔קֶר וַ/תָּ֕קָם ב/טרום יַכִּ֥יר אִ֖ישׁ אֶת רֵעֵ֑/הוּ וַ/יֹּ֨אמֶר֙ אַל יִוָּדַ֔ע כִּי בָ֥אָה הָ/אִשָּׁ֖ה הַ/גֹּֽרֶן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/014.yaml
  text: So she lay at his feet until morning[a], and she got up before one man could recognize another. And he said[b], “Do not let it be known that the woman came to the threshing floor.”
translation:
  language: ml
  text: 'അങ്ങനെ അവൾ പ്രഭാതം വരെ അവന്റെ കാൽക്കൽ കിടന്നു. ഒരാൾക്ക് മറ്റൊരാളെ തിരിച്ചറിയാൻ കഴിയുന്നതിനു മുമ്പേ[a] അവൾ എഴുന്നേറ്റു. അപ്പോൾ അവൻ പറഞ്ഞു[b]: “ആ സ്ത്രീ മെതിക്കളത്തിൽ വന്നതായി അറിയപ്പെടരുത്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “ഒരു പുരുഷൻ തന്റെ കൂട്ടുകാരനെ തിരിച്ചറിയുന്നതിനു മുമ്പ്.” മങ്ങിയ വെളിച്ചത്തിൽ ആളുകൾക്ക് പരസ്പരം വേർതിരിച്ചറിയാൻ കഴിയുന്നതിനു മുമ്പ് എന്നാണ് ഈ ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം.
    reason: lexical_alternative
  - marker: b
    text: സന്ദർഭത്തിൽ സംസാരിക്കുന്നത് മിക്കവാറും ബോവസാണ്; എന്നാൽ ഹീബ്രു പാഠം “അവൻ പറഞ്ഞു” എന്നു മാത്രമേ പറയുന്നുള്ളൂ.
    reason: alternative_reading
lexical_decisions:
- source_word: מרגלתיו
  choice: അവന്റെ കാൽക്കൽ
  rationale: ബോവസ് കിടന്നിരുന്നിടത്തിന്റെ കാൽഭാഗത്തെയാണ് പദം സൂചിപ്പിക്കുന്നത്. ‘അവന്റെ കാൽക്കൽ’ സ്വാഭാവികമായ മലയാളത്തിൽ സ്ഥലബന്ധം നിലനിർത്തുന്നു; കിടക്കയെയോ ശരീരനിലയെയോ അനാവശ്യമായി വ്യക്തമാക്കുന്നില്ല.
- source_word: בטרום
  choice: മുമ്പേ
  rationale: തുടർന്നുള്ള സംഭവം നടക്കുന്നതിനു മുൻപുള്ള സമയത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗം; മലയാളത്തിൽ കാലബന്ധം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יכיר
  choice: തിരിച്ചറിയാൻ കഴിയുന്നതിനു
  rationale: മങ്ങിയ വെളിച്ചത്തിൽ ആളുകളെ തിരിച്ചറിയാനുള്ള സാധ്യാവസ്ഥയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്. ‘കഴിയുക’ എന്ന ഘടകം ഈ സാധ്യതാഭാവം വ്യക്തമാക്കുന്നു.
- source_word: איש את רעהו
  choice: ഒരാൾക്ക് മറ്റൊരാളെ
  rationale: അക്ഷരാർഥത്തിൽ ‘ഒരു പുരുഷൻ തന്റെ കൂട്ടുകാരനെ’ എന്നാണെങ്കിലും, ഇവിടെ പരസ്പരം ആളുകളെ വേർതിരിച്ചറിയുക എന്ന ഹീബ്രു പ്രയോഗമാണ്. പൊതുവായ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אל יוודע
  choice: ആരും അറിയരുത്
  rationale: നിഷേധാത്മകമായ ആജ്ഞ/ആഗ്രഹവും കാര്യം വെളിപ്പെടരുതെന്ന അർഥവും മലയാളത്തിൽ നേരായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: האשה
  choice: ആ സ്ത്രീ
  rationale: ഹീബ്രുവിലെ നിർദിഷ്ട ഉപപദം നിലനിർത്തി, സന്ദർഭത്തിലെ നിർദിഷ്ട സ്ത്രീയായ രൂത്തിനെ സൂചിപ്പിക്കുന്നു.
- source_word: הגרן
  choice: മെതിക്കളം
  rationale: ധാന്യം മെതിക്കുകയും പതിരിൽനിന്ന് വേർതിരിക്കുകയും ചെയ്തിരുന്ന സ്ഥലത്തിനുള്ള സാധാരണവും കൃത്യവുമായ മലയാളപദം.
- source_word: ויאמר
  choice: അപ്പോൾ അവൻ പറഞ്ഞു
  rationale: ഹീബ്രുവിൽ പുരുഷ ഏകവചന കർത്താവ് അന്തർലീനമാണെങ്കിലും പേര് നൽകിയിട്ടില്ല. സന്ദർഭബന്ധം സ്വാഭാവികമാക്കിക്കൊണ്ട് ‘അവൻ’ എന്ന രൂപം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ויאמר എന്നതിലെ സംസാരിക്കുന്നയാളുടെ തിരിച്ചറിയൽ
  choice: പ്രധാന പാഠത്തിൽ ‘അവൻ പറഞ്ഞു’ എന്നു നൽകി ബോവസിന്റെ പേര് ചേർക്കാതിരിക്കുക.
  alternative: വ്യക്തതയ്ക്കായി ‘ബോവസ് പറഞ്ഞു’ എന്നു നൽകുക.
  rationale: സന്ദർഭം ബോവസിനെയാണ് ശക്തമായി സൂചിപ്പിക്കുന്നത്; എങ്കിലും ഹീബ്രു പാഠം പേര് പറയുന്നില്ല. അതിനാൽ മൂലപാഠത്തിലെ സൂചനാത്മകത നിലനിർത്തുന്നു.
- issue: രൂത്ത് ബോവസിന്റെ കാൽക്കൽ കിടന്നതിന്റെ ധാർമികമോ ലൈംഗികമോ ആയ സൂചന
  choice: ‘അവന്റെ കാൽക്കൽ കിടന്നു’ എന്ന സ്ഥലസൂചന മാത്രം നൽകുക.
  alternative: ലൈംഗികബന്ധം സൂചിപ്പിക്കുന്ന വ്യാഖ്യാനപരമായ ഭാഷ ഉപയോഗിക്കുക, അല്ലെങ്കിൽ അത്തരമൊരു സൂചനയെ വിശദീകരിച്ച് നിഷേധിക്കുക.
  rationale: ഈ വാക്യം സ്ഥലവും സമയവും മാത്രമാണ് നേരിട്ട് പറയുന്നത്. വിവാദമായ സൂചനയെ അംഗീകരിച്ചോ നിഷേധിച്ചോ പാഠത്തിനു മേൽ വ്യാഖ്യാനം ചുമത്താതെ കഥയിലെ ഉദ്ദേശ്യപൂർവമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘മെതിക്കളം’ പോലുള്ള പരിചിതമായ കൃഷിപദം ഉപയോഗിച്ചു. മൂലപാഠം വ്യക്തമാക്കാത്ത ലൈംഗിക സൂചനയോ സംസാരിക്കുന്നയാളുടെ പേരോ മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
