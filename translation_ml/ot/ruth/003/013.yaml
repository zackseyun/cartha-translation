  variant: modern standard Malayalam
source:
  edition: WLC
  text: לִ֣ינִי הַ/לַּ֗יְלָה וְ/הָיָ֤ה בַ/בֹּ֨קֶר֙ אִם יִגְאָלֵ֥/ךְ טוֹב֙ יִגְאָ֔ל וְ/אִם לֹ֨א יַחְפֹּ֧ץ לְ/גָֽאֳלֵ֛/ךְ וּ/גְאַלְתִּ֥י/ךְ אָנֹ֖כִי חַי יְהוָ֑ה שִׁכְבִ֖י עַד הַ/בֹּֽקֶר׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/013.yaml
  text: Stay here tonight[a], and in the morning, if he will redeem you, good—let him redeem you. But if he does not desire to redeem you, then I myself will redeem you, as Yahweh lives. Lie down until the morning.
translation:
  language: ml
  text: ഇന്നുരാത്രി ഇവിടെ തങ്ങുക. രാവിലെ, അവൻ നിന്നെ വീണ്ടെടുക്കാൻ തയ്യാറാണെങ്കിൽ, നല്ലത്; അവൻ നിന്നെ വീണ്ടെടുക്കട്ടെ. എന്നാൽ നിന്നെ വീണ്ടെടുക്കാൻ അവനു മനസ്സില്ലെങ്കിൽ, യാഹ്‌വേ ജീവിച്ചിരിക്കുന്നതുപോലെ, ഞാൻതന്നെ നിന്നെ വീണ്ടെടുക്കും. രാവിലെവരെ കിടന്നുകൊള്ളുക.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִינִי הַלַּיְלָה
  choice: ഈ രാത്രി ഇവിടെ തങ്ങുക
  rationale: לון എന്ന ക്രിയ രാത്രി ചെലവഴിക്കുകയോ താമസിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളത്തിനായി ‘ഇവിടെ’ ചേർത്തിരിക്കുന്നു; ‘ഈ രാത്രി’ ഹീബ്രു പ്രയോഗത്തിന്റെ സമയസൂചന നിലനിർത്തുന്നു.
- source_word: אִם יִגְאָלֵךְ
  choice: അവൻ നിന്നെ വീണ്ടെടുക്കുമെങ്കിൽ
  rationale: גאל എന്ന പദത്തിന്റെ വീണ്ടെടുപ്പ്-പ്രമേയവും കുടുംബനിയമപരമായ അർഥവും നിലനിർത്താൻ ‘വീണ്ടെടുക്കുക’ ഉപയോഗിച്ചു; പ്രത്യേക കുടുംബബാധ്യത അടിക്കുറിപ്പിൽ വിശദീകരിക്കുന്നു.
- source_word: טוֹב יִגְאָל
  choice: നല്ലത്—അവൻ നിന്നെ വീണ്ടെടുക്കട്ടെ
  rationale: ഹീബ്രുവിലെ സംക്ഷിപ്തമായ טוֹב അതേ സംക്ഷിപ്തതയോടെ ‘നല്ലത്’ എന്നു നൽകി; തുടർന്നുള്ള ക്രിയയുടെ അനുവദനീയമായ ഭാവം ‘വീണ്ടെടുക്കട്ടെ’ വ്യക്തമാക്കുന്നു.
- source_word: לֹא יַחְפֹּץ לְגָאֳלֵךְ
  choice: നിന്നെ വീണ്ടെടുക്കാൻ അവന് മനസ്സില്ലെങ്കിൽ
  rationale: חפץ ഇവിടെ ആഗ്രഹമോ സന്നദ്ധതയോ സൂചിപ്പിക്കുന്നു. ‘മനസ്സില്ലെങ്കിൽ’ ആ ഇച്ഛാപരമായ ഭാവം സാധാരണ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וּגְאַלְתִּיךְ אָנֹכִי
  choice: ഞാൻതന്നെ നിന്നെ വീണ്ടെടുക്കും
  rationale: אָנֹכִי നൽകുന്ന വ്യക്തിപരമായ ഊന്നൽ ‘ഞാൻതന്നെ’ എന്ന രൂപത്തിൽ സംരക്ഷിച്ചു.
- source_word: חַי יְהוָה
  choice: യഹോവ ജീവിക്കുന്നതാണേ
  rationale: ഇത് ഉറച്ച പ്രതിജ്ഞ സൂചിപ്പിക്കുന്ന ഹീബ്രു ശപഥസൂത്രമാണ്. ദൈവനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: שִׁכְבִי עַד הַבֹּקֶר
  choice: രാവിലെവരെ കിടന്നുകൊള്ളുക
  rationale: שכב എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ കിടക്കുക നിലനിർത്തുകയും, പുലർച്ചെവരെ അതേ നിലയിൽ തുടരുക എന്ന സന്ദർഭാർഥം ‘കിടന്നുകൊള്ളുക’ വഴി സ്വാഭാവികമാക്കുകയും ചെയ്തു.
theological_decisions:
- issue: രൂത്തിന്റെ കുടുംബനിയമസന്ദർഭത്തിൽ גאל എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മുഖ്യപാഠത്തിൽ ‘വീണ്ടെടുക്കുക’ നിലനിർത്തി
  alternative: അടുത്ത ബന്ധുവെന്ന നിലയിലെ വീണ്ടെടുപ്പുകാരന്റെ കടമ നിർവഹിക്കുക
  rationale: ‘വീണ്ടെടുക്കുക’ എന്നത് ഗ്രന്ഥത്തിലെ പ്രമേയബന്ധം സംരക്ഷിക്കുന്നു; എന്നാൽ പദത്തിന് ഇവിടെ കുടുംബബന്ധത്തെ ആധാരമാക്കിയ നിയമപരമായ ഉത്തരവാദിത്വമുണ്ടെന്ന വിവരം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ അവതരണം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം സ്ഥാനപ്പേരായി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണരൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: חַי יְהוָה എന്ന ശപഥസൂത്രം
  choice: യഹോവ ജീവിക്കുന്നതാണേ
  alternative: യഹോവയാണ, ഞാൻ നിന്നെ വീണ്ടെടുക്കും
  rationale: ശപഥത്തിന്റെ ശക്തി നിലനിർത്തുമ്പോഴും, മൂലത്തിലെ ‘ജീവിക്കുന്നു’ എന്ന ഘടകം മായ്ച്ചുകളയാതിരിക്കാൻ കൂടുതൽ ഔപചാരികമായ രൂപം തിരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ബോവസിന്റെ ഉറപ്പും ഹീബ്രുവിലെ സംക്ഷിപ്തതയും നിലനിർത്തി; നിയമപരമായ കുടുംബപശ്ചാത്തലം മുഖ്യപാഠം ഭാരപ്പെടുത്താതെ അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
