id: RUT.3.17
reference: Ruth 3:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֹּ֕אמֶר שֵׁשׁ הַ/שְּׂעֹרִ֥ים הָ/אֵ֖לֶּה נָ֣תַן לִ֑/י כִּ֚י אָמַ֣ר אַל תָּב֥וֹאִי רֵיקָ֖ם אֶל חֲמוֹתֵֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/017.yaml
  text: She said[a], “He gave me these six measures of barley, for he said, ‘Do not go to your mother-in-law empty-handed.’”
translation:
  language: ml
  text: 'അവൾ പറഞ്ഞു: “ഈ ആറ് അളവ് യവം അദ്ദേഹം എനിക്കു തന്നു; കാരണം, ‘നിന്റെ അമ്മായിയമ്മയുടെ അടുക്കലേക്കു വെറുംകൈയോടെ പോകരുത്’ എന്ന് അദ്ദേഹം പറഞ്ഞു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: അവൾ പറഞ്ഞു
  rationale: വിവരണത്തിലെ wayyiqtol രൂപം രൂത്തിന്റെ വാക്കുകൾ അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി ‘അവൾ പറഞ്ഞു’ എന്നു നൽകി.
- source_word: שֵׁשׁ הַשְּׂעֹרִים הָאֵלֶּה
  choice: ഈ ആറളവു യവം
  rationale: മൂലപാഠത്തിൽ ‘ആറ്’ എന്ന സംഖ്യയുണ്ടെങ്കിലും അളവിന്റെ പ്രത്യേക ഏകകം പറഞ്ഞിട്ടില്ല. സന്ദർഭം വ്യക്തമാക്കാൻ ‘അളവ്’ ചേർത്തു; ‘ഈ’ എന്ന സൂചകപദവും നിലനിർത്തി.
- source_word: נָתַן לִי
  choice: അദ്ദേഹം എനിക്കു തന്നു
  rationale: റിപ്പോർട്ട് ചെയ്ത സംഭാഷണത്തിലെ Qal perfect; ബോവസിനെ മാന്യമായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: כִּי אָמַר
  choice: എന്ന് അദ്ദേഹം പറഞ്ഞിരുന്നു
  rationale: സമ്മാനത്തിന്റെ കാരണം ബോവസിന്റെ മുൻവാക്കിലൂടെ വിശദീകരിക്കുന്നു; മലയാളത്തിലെ ഉദ്ധരണിഘടനയിൽ ‘എന്ന്’ സ്വാഭാവികമാണ്, മുൻകാലബന്ധം ‘പറഞ്ഞിരുന്നു’ വ്യക്തമാക്കുന്നു.
- source_word: אַל תָּבֹאִי
  choice: ചെല്ലരുത്
  rationale: בוא എന്ന ചലനക്രിയ ഇവിടെ ബോവസിന്റെ സ്ഥാനത്തുനിന്ന് അമ്മായിയമ്മയുടെ അടുക്കലേക്കുള്ള മടങ്ങിപ്പോക്കിനെ സൂചിപ്പിക്കുന്നു; ‘ചെല്ലരുത്’ ദിശാഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: רֵיקָם
  choice: വെറുംകൈയോടെ
  rationale: സമ്മാനമോ വിഭവമോ ഇല്ലാതെ മടങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളശൈലി.
- source_word: אֶל חֲמוֹתֵךְ
  choice: നിന്റെ അമ്മായിയമ്മയുടെ അടുക്കൽ
  rationale: חֲמוֹת എന്നത് ഭർത്താവിന്റെ അമ്മയെ സൂചിപ്പിക്കുന്നു; אֶל എന്നതിന്റെ ദിശാഭാവം ‘അടുക്കൽ’ വ്യക്തമാക്കുന്നു.
