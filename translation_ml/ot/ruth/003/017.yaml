translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി. ധാന്യത്തിന്റെ പേര് ‘യവം’ എന്നും, നിർവചിക്കപ്പെടാത്ത അളവിനെ ‘ആറളവു’ എന്നും നൽകി; അതിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
