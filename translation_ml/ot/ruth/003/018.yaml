  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ שְׁבִ֣י בִתִּ֔/י עַ֚ד אֲשֶׁ֣ר תֵּֽדְעִ֔י/ן אֵ֖יךְ יִפֹּ֣ל דָּבָ֑ר כִּ֣י לֹ֤א יִשְׁקֹט֙ הָ/אִ֔ישׁ כִּֽי אִם כִּלָּ֥ה הַ/דָּבָ֖ר הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/018.yaml
  text: Then she said[a], “Wait, my daughter, until you learn how the matter will fall out[b], for the man will not rest unless he has settled the matter today.”
translation:
  language: ml
  text: 'അപ്പോൾ അവൾ പറഞ്ഞു: “എന്റെ മകളേ, കാര്യം എങ്ങനെ കലാശിക്കുമെന്ന്[a] അറിയുന്നതുവരെ കാത്തിരിക്കൂ. ആ മനുഷ്യൻ[b] ഇന്ന് ഈ കാര്യം തീർപ്പാക്കാതെ വിശ്രമിക്കുകയില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ, “കാര്യം എങ്ങനെ വീഴും.” അർഥം: “കാര്യം എങ്ങനെ കലാശിക്കും.”'
    reason: lexical_alternative
  - marker: b
    text: “ആ മനുഷ്യൻ” എന്നത് ബോവസിനെ സൂചിപ്പിക്കുന്നു; എന്നാൽ എബ്രായപാഠം ഇവിടെ അദ്ദേഹത്തിന്റെ പേര് പറയുന്നില്ല.
    reason: cross_reference
lexical_decisions:
- source_word: שְׁבִי
  choice: കാത്തിരിക്കൂ
  rationale: ക്രിയയുടെ അക്ഷരാർഥം ‘ഇരിക്കുക/തങ്ങുക’ എന്നാണെങ്കിലും, ഫലം അറിയുന്നതുവരെ അവിടെത്തന്നെ നിന്നു കാത്തിരിക്കണമെന്ന സന്ദർഭോചിതമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: בִתִּי
  choice: എന്റെ മകളേ
  rationale: നൊവൊമിയുടെ വാത്സല്യപൂർവമായ അഭിസംബോധനയും എബ്രായത്തിലെ ഉടമസ്ഥസൂചനയും നിലനിർത്തുന്നു.
- source_word: תֵּדְעִין
  choice: അറിയുന്നതുവരെ
  rationale: ഇവിടെ യാദാ എന്ന ക്രിയ ഭാവിയിൽ വിവരം ലഭിച്ച് അറിയുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: אֵיךְ יִפֹּל דָּבָר
  choice: കാര്യം എങ്ങനെ കലാശിക്കുമെന്ന്
  rationale: ‘കാര്യം എങ്ങനെ വീഴും’ എന്ന എബ്രായ ശൈലിയുടെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; മൂലരൂപകം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: הָאִישׁ
  choice: ആ മനുഷ്യൻ
  rationale: സന്ദർഭത്തിൽ ബോവസിനെ സൂചിപ്പിക്കുന്ന നിർദിഷ്ട നാമപദം തന്നെയാണ് എബ്രായത്തിൽ ഉള്ളത്; പേര് ചേർക്കാതെ ആ പരാമർശരീതി നിലനിർത്തുന്നു.
- source_word: יִשְׁקֹט
  choice: സ്വസ്ഥനായിരിക്കുകയില്ല
  rationale: കാര്യം പൂർത്തിയാകുന്നതുവരെ അയാൾ അടങ്ങിയിരിക്കുകയോ വിശ്രമിക്കുകയോ ചെയ്യില്ലെന്ന ദൃഢനിശ്ചയം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: כִּי אִם כִּלָּה
  choice: തീർപ്പാക്കാതെ
  rationale: ഒഴിവാക്കൽ-നിബന്ധനയും പൂർത്തീകരണവും ചേർന്ന പ്രയോഗത്തെ, നിലനിൽക്കുന്ന നിയമപരവും ബന്ധപരവുമായ വിഷയം പരിഹരിക്കുന്ന അർഥത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: הַדָּבָר
  choice: ഈ കാര്യം
  rationale: വീണ്ടെടുപ്പും വിവാഹസാധ്യതയും സംബന്ധിച്ച നിലവിലുള്ള വിഷയത്തെയാണ് സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്.
- source_word: הַיּוֹם
  choice: ഇന്ന്
  rationale: കാലസൂചനയുടെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
