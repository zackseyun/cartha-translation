translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. മൂലഭാഷയിലെ നിർദിഷ്ടമെങ്കിലും പേരുപറയാത്ത ‘ആ മനുഷ്യൻ’ എന്ന പരാമർശം നിലനിർത്തിയിട്ടുണ്ട്; എബ്രായ ശൈലിയുടെ അക്ഷരരൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
