  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: יְשַׁלֵּ֥ם יְהוָ֖ה פָּעֳלֵ֑/ךְ וּ/תְהִ֨י מַשְׂכֻּרְתֵּ֜/ךְ שְׁלֵמָ֗ה מֵ/עִ֤ם יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁר בָּ֖את לַ/חֲס֥וֹת תַּֽחַת כְּנָפָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/012.yaml
  text: May Yahweh repay your work[a], and may your reward be full from Yahweh, the God of Israel, under whose wings you have come to seek refuge.
translation:
  language: ml
  text: നിന്റെ പ്രവൃത്തിക്കു യഹ്‌വെ പ്രതിഫലം നൽകട്ടെ; നീ ആരുടെ ചിറകുകളുടെ കീഴിൽ അഭയം തേടി വന്നിരിക്കുന്നുവോ, ആ ഇസ്രായേലിന്റെ ദൈവമായ യഹ്‌വെയിൽനിന്ന് നിനക്കുള്ള പ്രതിഫലം പൂർണമായിരിക്കട്ടെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്റെ കൂലി പൂർണമാകട്ടെ.” “പ്രതിഫലം” എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപദത്തിന് “കൂലി” എന്നും അർഥമാകാം. “പൂർണമായ” എന്നതിനുള്ള പദം “പ്രതിഫലം നൽകട്ടെ” എന്ന ആദ്യ ക്രിയയുടെ അതേ എബ്രായ പദമൂലത്തിൽനിന്നുള്ളതാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשַׁלֵּם
  choice: പ്രതിഫലം നൽകട്ടെ
  rationale: പീയേൽ രൂപം ഇവിടെ ബോവസിന്റെ ആശംസയെയോ അനുഗ്രഹവാക്യത്തെയോ സൂചിപ്പിക്കുന്നു. ‘നൽകട്ടെ’ ആ ആശംസാഭാവം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ശലം എന്ന പദമൂലത്തിലെ പകരംനൽകൽ/പൂർണമാക്കൽ എന്ന ആശയവും ‘പ്രതിഫലം’ വഴി നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായത്തിലെ ദൈവനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ശബ്ദാന്തരണം ചെയ്തു.
- source_word: פָּעֳלֵךְ
  choice: നിന്റെ പ്രവൃത്തി
  rationale: പദം പ്രവൃത്തി, പ്രവർത്തനം, ചെയ്ത കാര്യം എന്നിവയെ സൂചിപ്പിക്കാം. ഇവിടെ രൂത്തിന്റെ വിശ്വസ്തമായ പ്രവർത്തനങ്ങളെ ഉൾക്കൊള്ളുന്ന സംക്ഷിപ്തവും സ്വാഭാവികവുമായ പ്രയോഗമാണ് ‘നിന്റെ പ്രവൃത്തി’.
- source_word: וּתְהִי
  choice: ലഭിക്കട്ടെ
  rationale: രണ്ടാമത്തെ ക്രിയയും ആശംസാഭാവം തുടരുന്നു. മലയാളത്തിൽ ‘നിനക്കു ... ലഭിക്കട്ടെ’ എന്നു പുനർഘടിപ്പിക്കുന്നത് അർഥവും സമാന്തര ഘടനയും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מַשְׂכֻּרְתֵּךְ
  choice: നിനക്കു ... പ്രതിഫലം
  rationale: നാമത്തിന് ‘കൂലി’ എന്നും ‘പ്രതിഫലം’ എന്നും അർഥമാകാം. തൊഴിൽദാതാവിൽനിന്നുള്ള കൂലിയല്ല, ദൈവത്തിൽനിന്നുള്ള പകരംനൽകലാണ് സന്ദർഭം; അതിനാൽ ‘പ്രതിഫലം’ പ്രധാനവായനയായി സ്വീകരിച്ചു.
- source_word: שְׁלֵמָה
  choice: പൂർണമായ
  rationale: പൂർണതയെയോ സമ്പൂർണതയെയോ സൂചിപ്പിക്കുന്ന വിശേഷണം. ‘പൂർണമായ പ്രതിഫലം’ മലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമാണ്; ആദ്യക്രിയയോടുള്ള എബ്രായ പദമൂലബന്ധം അടിക്കുറിപ്പിൽ ചൂണ്ടിക്കാട്ടുന്നു.
- source_word: מֵעִם
  choice: യിൽനിന്ന്
  rationale: പ്രതിഫലത്തിന്റെ ഉറവിടം യഹ്‌വെയാണെന്ന് ഈ വിഭക്തി വ്യക്തമാക്കുന്നു.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ദൈവം
  rationale: എബ്രായ സംയുക്തഘടനയുടെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാള പരിഭാഷ.
- source_word: לַחֲסוֹת
  choice: അഭയം തേടി
  rationale: രക്ഷയും സംരക്ഷണവും ലക്ഷ്യമാക്കി അഭയം പ്രാപിക്കുന്ന ആശയം പ്രകടിപ്പിക്കുന്നു; ‘വന്നിരിക്കുന്നു’ എന്ന ചലനക്രിയയോടും സ്വാഭാവികമായി ചേരുന്നു.
- source_word: תַּחַת כְּנָפָיו
  choice: ആരുടെ ചിറകിൻ കീഴിൽ
  rationale: ദൈവിക സംരക്ഷണത്തിന്റെ രൂപകം വിശദീകരിച്ച് പരത്താതെ അതേപടി നിലനിർത്തുന്നു. ബന്ധവാക്യത്തിൽ ‘ആരുടെ’ എന്നു ഉപയോഗിക്കുന്നത് മലയാളവാക്യഘടന വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ ചതുരക്ഷരി നേരിട്ട് വരുന്നു. അതിനെ ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ മലയാളത്തിൽ ശബ്ദാന്തരണം ചെയ്യുന്നത് പാഠത്തിലെ ദൈവനാമത്തെ സംരക്ഷിക്കുന്നു.
- issue: ദൈവത്തിന്റെ ‘ചിറകുകൾ’ എന്ന രൂപകം
  choice: ചിറകിൻ കീഴിൽ
  alternative: സംരക്ഷണത്തിൽ
  rationale: മൂലപാഠത്തിലെ സജീവമായ അഭയരൂപകം ദൈവത്തിന്റെ സംരക്ഷണത്തെ സൂചിപ്പിക്കുന്നു; വ്യാഖ്യാനപരമായി ‘സംരക്ഷണം’ എന്നു മാത്രം മാറ്റാതെ രൂപകം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ അനുഗ്രഹവാക്യശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ രണ്ടു ആശംസാക്രിയകളുടെയും ഭാവം ‘നൽകട്ടെ/ലഭിക്കട്ടെ’ എന്ന ഘടനയിൽ നിലനിർത്തി; ചിറകുകളുടെ രൂപകം ചുരുക്കുകയോ വ്യാഖ്യാനിച്ച് മാറ്റുകയോ ചെയ്തില്ല.
