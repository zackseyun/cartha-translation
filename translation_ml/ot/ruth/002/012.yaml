  to: നിന്റെ പ്രവൃത്തിക്കു യഹ്‌വെ പ്രതിഫലം നൽകട്ടെ; നീ ആരുടെ ചിറകുകളുടെ കീഴിൽ അഭയം തേടി വന്നിരിക്കുന്നുവോ, ആ ഇസ്രായേലിന്റെ ദൈവമായ യഹ്‌വെയിൽനിന്ന് നിനക്കുള്ള പ്രതിഫലം പൂർണമായിരിക്കട്ടെ.[a]
