id: RUT.2.15
reference: Ruth 2:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תָּ֖קָם לְ/לַקֵּ֑ט וַ/יְצַו֩ בֹּ֨עַז אֶת נְעָרָ֜י/ו לֵ/אמֹ֗ר גַּ֣ם בֵּ֧ין הָֽ/עֳמָרִ֛ים תְּלַקֵּ֖ט וְ/לֹ֥א תַכְלִימֽוּ/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/015.yaml
  text: When she rose to glean[a], Boaz commanded his young men, saying, “Let her glean even among the sheaves[b], and do not humiliate her.”
translation:
  language: ml
  text: 'അവൾ കതിർ പെറുക്കാൻ എഴുന്നേറ്റപ്പോൾ, ബോവസ് തന്റെ യുവാക്കളോടു കല്പിച്ചു: “അവൾ കറ്റകൾക്കിടയിൽപ്പോലും പെറുക്കിക്കൊള്ളട്ടെ; അവളെ അപമാനിക്കരുത്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּקָם לְלַקֵּט
  choice: അവൾ കതിർ പെറുക്കാൻ എഴുന്നേറ്റപ്പോൾ
  rationale: קום എന്ന ക്രിയയുടെ എഴുന്നേൽക്കുക എന്ന അർഥവും לקט എന്നതിന്റെ കൊയ്ത്തിനുശേഷം ശേഷിച്ച കതിരുകൾ പെറുക്കുക എന്ന സാന്ദർഭിക അർഥവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു. തുടർന്നുള്ള ബോവസിന്റെ നടപടിയുമായുള്ള കാലബന്ധം ‘എഴുന്നേറ്റപ്പോൾ’ വ്യക്തമാക്കുന്നു.
- source_word: וַיְצַו ... לֵאמֹר
  choice: ബോവസ് തന്റെ യുവാക്കളോടു കല്പിച്ചു
  rationale: צוה എന്നത് വെറും നിർദേശത്തേക്കാൾ അധികാരപൂർവമായ കല്പനയാണ്. മലയാളത്തിൽ നേരിട്ടുള്ള ഉദ്ധരണിക്കു മുമ്പ് ‘പറഞ്ഞു’ കൂടി ചേർക്കേണ്ടതില്ലാത്തതിനാൽ, ഹീബ്രു പ്രയോഗത്തിന്റെ ആശയം സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: נְעָרָיו
  choice: തന്റെ യുവാക്കളോട്
  rationale: נַעַר എന്ന പദത്തിന്റെ യുവപുരുഷന്മാർ എന്ന അടിസ്ഥാന അർഥവും ഈ വയലിലെ പുരുഷതൊഴിലാളികളെന്ന സാന്ദർഭിക സൂചനയും സംരക്ഷിക്കുന്നു.
- source_word: גַּם בֵּין הָעֳמָרִים
  choice: കറ്റകൾക്കിടയിൽപ്പോലും
  rationale: גַּם അനുമതിയുടെ അസാധാരണമായ വ്യാപ്തി ഊന്നുന്നു; ‘പോലും’ അത് പ്രകടമാക്കുന്നു. בֵּין എന്നതിന്റെ ‘ഇടയിൽ’ എന്ന അർഥം മലയാളത്തിൽ സ്വാഭാവികമാണ്; עֳמָרִים ധാന്യക്കറ്റകളാണ്.
- source_word: תְּלַקֵּט
  choice: പെറുക്കിക്കൊള്ളട്ടെ
  rationale: ഇവിടെയുള്ള imperfect അനുവദനീയ കല്പനയായി പ്രവർത്തിക്കുന്നു. ‘പെറുക്കിക്കൊള്ളട്ടെ’ തൊഴിലാളികളോടുള്ള അനുമതിപൂർവമായ നിർദേശം വ്യക്തമാക്കുന്നു.
- source_word: וְלֹא תַכְלִימוּהָ
  choice: അവളെ അപമാനിക്കരുത്
  rationale: כלם എന്ന Hiphil രൂപം നാണംകെടുത്തുക, അപമാനിക്കുക, സാമൂഹികമായി അവഹേളിക്കുക എന്നീ ശക്തമായ അർഥങ്ങൾ നൽകുന്നു; ‘അപമാനിക്കരുത്’ ഈ വ്യാപ്തി സംക്ഷിപ്തമായി പകരുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘കതിർ പെറുക്കുക’, ‘കറ്റകൾക്കിടയിൽ’ എന്നീ കാർഷികപ്രയോഗങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും മൂലപാഠത്തിന്റെ കൊയ്ത്തുസന്ദർഭത്തോട് കൃത്യവുമാണ്.
