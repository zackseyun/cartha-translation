source:
  edition: WLC
  text: וְ/גַ֛ם שֹׁל תָּשֹׁ֥לּוּ לָ֖/הּ מִן הַ/צְּבָתִ֑ים וַ/עֲזַבְתֶּ֥ם וְ/לִקְּטָ֖ה וְ/לֹ֥א תִגְעֲרוּ בָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/016.yaml
  text: And also[a], you must surely pull out some for her from the bundles and leave it, so that she may gather it[b], and you must not rebuke her.
translation:
  language: ml
  text: കൂടാതെ, അവൾക്കുവേണ്ടി ധാന്യത്തണ്ടുകളുടെ കെട്ടുകളിൽനിന്ന്[a] കുറെ മനഃപൂർവം പുറത്തുവലിച്ച് അവിടെ വിട്ടേക്കണം. അവൾ അവ പെറുക്കിയെടുക്കട്ടെ[b]; അവളെ ശാസിക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കറ്റകളിൽനിന്ന്.’ എബ്രായപദം കൂട്ടിച്ചേർത്ത ധാന്യത്തണ്ടുകളുടെ കെട്ടുകളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവൾ കാലാ പെറുക്കട്ടെ.’ കൊയ്ത്തുകഴിഞ്ഞ വയലിൽ ശേഷിക്കുന്ന ധാന്യം പെറുക്കുന്നതിന് പതിവായി ഉപയോഗിക്കുന്ന എബ്രായക്രിയയാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: മാത്രമല്ല
  rationale: മുൻ നിർദേശത്തോടു ബന്ധിപ്പിക്കുന്നതോടൊപ്പം അതിനപ്പുറമുള്ള ഒരു അധിക നിർദേശമാണിതെന്ന ഊന്നൽ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: שֹׁל תָּשֹׁלּוּ
  choice: തീർച്ചയായും വലിച്ചെടുത്ത്
  rationale: ക്രിയയോടൊപ്പമുള്ള infinitive absolute പ്രവർത്തനത്തെ ഊന്നുന്നു. ധാന്യം അബദ്ധത്തിൽ വീഴാൻ അനുവദിക്കുകയല്ല, റൂത്തിനുവേണ്ടി മനപ്പൂർവം പുറത്തെടുക്കുകയാണ് ഇവിടെ ഉദ്ദേശ്യം.
- source_word: לָהּ
  choice: അവൾക്കുവേണ്ടി
  rationale: ഈ സന്ദർഭത്തിൽ മുൻപ്രത്യയം റൂത്തിന്റെ പ്രയോജനത്തിനായി ചെയ്യുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു.
- source_word: מִן הַצְּבָתִים
  choice: കറ്റക്കെട്ടുകളിൽനിന്ന്
  rationale: צְבָתִים കൊയ്തു കൂട്ടിക്കെട്ടിയ തണ്ടുകളുടെ കെട്ടുകളെ സൂചിപ്പിക്കുന്നു. ‘കറ്റക്കെട്ടുകൾ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും കാർഷികസന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: וַעֲזַבְתֶּם
  choice: അവിടെ ഇട്ടേക്കണം
  rationale: വലിച്ചെടുത്ത കതിരുകൾ റൂത്തിനു പെറുക്കാനായി നിലത്ത് ശേഷിപ്പിക്കണമെന്ന അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וְלִקְּטָה
  choice: അവൾ അവ പെറുക്കിയെടുക്കട്ടെ
  rationale: לקט കൊയ്ത്തിനുശേഷം ശേഷിച്ച ധാന്യം പെറുക്കുന്നതിന്റെ പതിവു ക്രിയയാണ്. മുൻവാക്യത്തിൽ ഇട്ടേക്കുന്ന കതിരുകളെ സൂചിപ്പിക്കുന്ന ‘അവ’ ചേർക്കുന്നത് മലയാളത്തിൽ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: וְלֹא תִגְעֲרוּ בָהּ
  choice: അവളെ ശാസിക്കരുത്
  rationale: גער എന്നതിലെ ശക്തമായ വിലക്കലിന്റെയോ ശകാരത്തിന്റെയോ ഭാവം ‘ശാസിക്കുക’ മാന്യവും സ്വാഭാവികവുമായ ഭാഷയിൽ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിർദേശശൈലി ഉപയോഗിച്ചു. ബഹുവചന കർത്താവിനെ മലയാളത്തിൽ പ്രത്യേകം ആവർത്തിക്കാതെ ക്രിയാരൂപങ്ങളിലൂടെ നിർദേശങ്ങളുടെ തുടർച്ച നിലനിർത്തി; കാർഷികസന്ദർഭം വ്യക്തമാക്കാൻ ‘കതിരുകൾ’ സന്ദർഭാനുസൃതമായി പൂരിപ്പിച്ചു.
