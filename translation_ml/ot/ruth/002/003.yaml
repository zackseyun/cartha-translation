  rationale: The revision explicitly restores the Hebrew’s three linked actions—going, arriving, and gleaning—while retaining natural Malayalam. “യാദൃച്ഛികമായി” continues to preserve the source’s language of apparent chance, and “ബോവസിന് അവകാശപ്പെട്ട വയൽഭാഗം” clearly expresses the possessive relationship without adding theological interpretation. The footnote has been lightly streamlined while preserving the source idiom and the distinction between the verse’s immediate wording and the book’s wider narrative invitation.
