lexical_decisions:
- source_word: וַתֵּלֶךְ וַתָּבוֹא
  choice: അവൾ പോയി ... എത്തിയത്
  rationale: הלך–בוא എന്ന തുടർച്ചയായ ചലനത്തെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ഹീബ്രു ആഖ്യാനത്തിന്റെ ഘട്ടക്രമം പൂർണമായി ഒറ്റ ക്രിയയാക്കി ലയിപ്പിക്കുന്നില്ല.
- source_word: וַתְּלַקֵּט
  choice: കതിരുകൾ പെറുക്കി
  rationale: കൊയ്ത്തുകാരുടെ പിന്നാലെ ശേഷിച്ച ധാന്യക്കതിരുകൾ ശേഖരിക്കുന്ന לקט എന്ന കാർഷികപ്രവൃത്തിയെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: בַּשָּׂדֶה
  choice: വയലിൽ
  rationale: കൊയ്ത്ത് നടക്കുന്ന വയൽപ്രദേശത്തെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ നിർദേശകപദം ചേർക്കാതെ പറയുന്നതാണ് സ്വാഭാവികം.
- source_word: אַחֲרֵי הַקֹּצְרִים
  choice: കൊയ്ത്തുകാരുടെ പിന്നാലെ
  rationale: 'ഇവിടെ אַחֲרֵי കാലക്രമത്തേക്കാൾ സ്ഥലപരമായ അർഥത്തിലാണ്: കൊയ്യുന്നവരുടെ പിന്നിൽ നടന്ന് ശേഷിച്ച കതിരുകൾ പെറുക്കുന്നു.'
- source_word: וַיִּקֶר מִקְרֶהָ
  choice: യാദൃച്ഛികമായി അവൾ എത്തിയത്
  rationale: קרה എന്ന ക്രിയയും അതേ മൂലത്തിൽനിന്നുള്ള מקרה എന്ന നാമവും ചേർന്ന പ്രയോഗം മനുഷ്യന്റെ കാഴ്ചയിൽ അപ്രതീക്ഷിതമായി സംഭവിച്ചതിനെ ഊന്നുന്നു; ദൈവപരിപാലനത്തെ മുഖ്യവാചകത്തിൽ വെളിപ്പെടുത്താതെ ആഖ്യാനത്തിലെ സൂക്ഷ്മമായ സംഘർഷം നിലനിർത്തുന്നു.
- source_word: חֶלְקַת הַשָּׂדֶה לְבֹעַז
  choice: ബോവസിന്റെ വയൽഭാഗം
  rationale: חלקה സൂചിപ്പിക്കുന്ന വയലിന്റെ പ്രത്യേക ഭാഗവും לְ സൂചിപ്പിക്കുന്ന ഉടമസ്ഥബന്ധവും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: אֲשֶׁר מִמִּשְׁפַּחַת אֱלִימֶלֶךְ
  choice: എലീമേലെക്കിന്റെ കുടുംബത്തിൽപ്പെട്ട
  rationale: מִשְׁפָּחָה എന്ന കുടുംബ/വംശകൂട്ടത്തെ സാങ്കേതികമല്ലാത്ത, വ്യാപകമായി ഗ്രഹിക്കാവുന്ന ഭാഷയിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: യാദൃച്ഛികതയായി തോന്നുന്ന സംഭവവും ദൈവപരിപാലനവും തമ്മിലുള്ള ആഖ്യാനപരമായ സംഘർഷം
  choice: മനുഷ്യന്റെ കാഴ്ചപ്പാടിലുള്ള സംഭവസാദൃശ്യം സൂചിപ്പിക്കാൻ ‘യാദൃച്ഛികമായി’ എന്നു മുഖ്യവാചകത്തിൽ നൽകുന്നു.
  alternative: ദൈവം അവളെ അവിടെ എത്തിച്ചു എന്ന വ്യാഖ്യാനാത്മക രൂപം; അല്ലെങ്കിൽ ‘അവളുടെ യാദൃച്ഛികത യാദൃച്ഛികമായി’ എന്ന അത്യന്തം അക്ഷരാർഥരൂപം.
  rationale: ഹീബ്രു വാചകം നേരിട്ട് ദൈവപരിപാലനം പ്രസ്താവിക്കുന്നില്ല; എന്നാൽ പുസ്തകത്തിന്റെ വിശാലമായ കഥ അത് തിരിച്ചറിയാൻ വായനക്കാരനെ ക്ഷണിക്കുന്നു. അതിനാൽ മുഖ്യവാചകം ഈ സംഘർഷം പരിഹരിക്കാതെ നിലനിർത്തുകയും അടിക്കുറിപ്പ് പ്രയോഗത്തിന്റെ പ്രത്യേകത വിശദീകരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘കതിരുകൾ പെറുക്കി’ എന്ന പ്രയോഗം പുരാതന കാർഷികസാഹചര്യം സാധാരണ വായനക്കാരന് വ്യക്തമാക്കുന്നു. മുഖ്യവാചകത്തിൽ [a] അടിക്കുറിപ്പുചിഹ്നം ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
