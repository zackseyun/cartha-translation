  text: So she went and came and gleaned in the field behind the reapers[a], and she happened to come to the portion of the field belonging to Boaz, who was from the family of Elimelech.
translation:
  language: ml
  text: അങ്ങനെ അവൾ പോയി, വയലിൽ എത്തി, കൊയ്ത്തുകാരുടെ പിന്നാലെ കതിരുകൾ പെറുക്കി. യാദൃച്ഛികമായി, അവൾ എത്തിച്ചേർന്നത് എലീമേലെക്കിന്റെ കുടുംബത്തിൽപ്പെട്ട ബോവസിന് അവകാശപ്പെട്ട വയൽഭാഗത്തായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “അവളുടെ യാദൃച്ഛികത സംഭവിച്ചു” എന്ന ഹീബ്രു ശൈലി. മനുഷ്യന്റെ കാഴ്ചയിൽ യാദൃച്ഛികമായി തോന്നുന്നതിനെ ഇത് പ്രകടിപ്പിക്കുന്നു; അതേസമയം, പുസ്തകത്തിന്റെ വിശാലമായ ആഖ്യാനം ദൈവപരിപാലനം ഇവിടെ പ്രവർത്തിക്കുന്നതായി കാണാൻ വായനക്കാരനെ ക്ഷണിക്കുന്നു.
