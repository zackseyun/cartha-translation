  naturalness: പാഠം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികമാണ്. രണ്ട് വാക്യങ്ങളാക്കി അവതരിപ്പിക്കുന്നത് മലയാള കഥാഖ്യാനത്തിന് സുഗമമാണ്. ‘പ്രാപ്തനും പ്രമാണിയുമായ’ എന്നത് സന്ദർഭത്തിൽ കഴിവും സാമൂഹികപ്രാധാന്യവും സൂചിപ്പിക്കുന്ന യോജിച്ച, സൈനികമല്ലാത്ത പ്രയോഗമാണ്.
  terminology: ‘ബന്ധു,’ ‘കുലം,’ ‘ബോവസ്’ എന്നിവ ഉചിതമാണ്. ‘വീണ്ടെടുപ്പുകാരൻ’ പോലുള്ള പിന്നീടുള്ള നിയമപരമായ നിർവചനം ഇവിടെ മുൻകൂട്ടി ചേർത്തിട്ടില്ല. പേരുകളുടെ നിലവിലുള്ള മലയാള ബൈബിൾരീതിയുമായും യോജിപ്പുണ്ട്.
