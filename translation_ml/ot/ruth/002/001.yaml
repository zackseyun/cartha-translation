id: RUT.2.1
reference: Ruth 2:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּֽ/לְ/נָעֳמִ֞י מידע לְ/אִישָׁ֗/הּ אִ֚ישׁ גִּבּ֣וֹר חַ֔יִל מִ/מִּשְׁפַּ֖חַת אֱלִימֶ֑לֶךְ וּ/שְׁמ֖/וֹ בֹּֽעַז׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/001.yaml
  text: Naomi had a relative of her husband[a], a man of great worth, from the clan of Elimelech[b], and his name was Boaz.
translation:
  language: ml
  text: നൊവൊമിക്ക് തന്റെ ഭർത്താവിന്റെ ഒരു ബന്ധുവുണ്ടായിരുന്നു. അദ്ദേഹം എലീമേലെക്കിന്റെ കുലത്തിൽപ്പെട്ട[b] വളരെ പ്രാപ്തനും പ്രമാണിയുമായ[a] ഒരു മനുഷ്യനായിരുന്നു; അദ്ദേഹത്തിന്റെ പേര് ബോവസ് എന്നായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വീരപരാക്രമിയായ മനുഷ്യൻ,’ ‘പ്രമുഖനായ മനുഷ്യൻ,’ അല്ലെങ്കിൽ ‘ധനികനായ മനുഷ്യൻ.’ എബ്രായപ്രയോഗം ശക്തി, കഴിവ്, സാമൂഹികനില, സ്വാധീനം, സമ്പത്ത് എന്നീ ആശയങ്ങൾ ഉൾക്കൊള്ളുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘കുലം’ എന്നതിനു പകരം ‘കുടുംബം’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദം വിശാലമായ ബന്ധുഗണത്തെയോ കുലത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְנָעֳמִי מידע לְאִישָׁהּ
  choice: നൊവൊമിക്ക് തന്റെ ഭർത്താവിന്റെ ഒരു ബന്ധുവുണ്ടായിരുന്നു
  rationale: מְיֻדָּע എന്ന പദം അറിയപ്പെടുന്നവൻ, പരിചയക്കാരൻ, ബന്ധു എന്നീ അർഥസാധ്യതകൾ വഹിക്കുന്നു. പിന്നാലെ എലീമേലെക്കിന്റെ കുലബന്ധം വ്യക്തമാകുന്നതിനാൽ ‘ബന്ധു’ സന്ദർഭത്തിന് യോജിക്കുന്നു; എന്നാൽ പിന്നീട് പ്രത്യക്ഷമാകുന്ന വീണ്ടെടുപ്പുകാരന്റെ നിയമപരമായ പദവി ഇവിടെ മുൻകൂട്ടി ചേർക്കുന്നില്ല. לְאִישָׁהּ ആ ബന്ധം നൊവൊമിയുടെ ഭർത്താവിന്റെ ഭാഗത്താണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: אִישׁ גִּבּוֹר חַיִל
  choice: വളരെ പ്രാപ്തനും പ്രമാണിയുമായ ആ മനുഷ്യൻ
  rationale: ഈ പ്രയോഗത്തിൽ ശക്തി, കഴിവ്, സമ്പത്ത്, സാമൂഹികനില, സ്വാധീനം തുടങ്ങിയ ആശയങ്ങൾ ഒത്തുചേരുന്നു. സൈനികമല്ലാത്ത ഈ സന്ദർഭത്തിൽ ‘പ്രാപ്തനും പ്രമാണിയുമായ’ എന്നത് അതിന്റെ വിശാലമായ പ്രശംസാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מִמִּשְׁפַּחַת אֱלִימֶלֶךְ
  choice: എലീമേലെക്കിന്റെ കുലത്തിൽപ്പെട്ട
  rationale: מִשְׁפָּחָה ഇവിടെ അടുത്ത കുടുംബത്തെക്കാൾ വിശാലമായ ബന്ധുഗണത്തെയോ കുലത്തെയോ സൂചിപ്പിക്കാം; അതിനാൽ ‘കുലം’ തിരഞ്ഞെടുത്തു.
- source_word: וּשְׁמוֹ בֹּעַז
  choice: ആ മനുഷ്യന്റെ പേര് ബോവസ് എന്നായിരുന്നു
  rationale: കഥാഖ്യാനത്തിൽ കഥാപാത്രത്തെ പരിചയപ്പെടുത്തുന്ന സ്വാഭാവിക മലയാളരൂപം; בֹּעַז എന്ന പേര് നിലവിലുള്ള മലയാള ബൈബിൾ ഉപയോഗവുമായി ചേർന്ന് ‘ബോവസ്’ എന്നു ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ കഥാഖ്യാനശൈലി. ഉറവിടത്തിൽ വ്യക്തമായ കാലസൂചകമായ ‘ഇപ്പോൾ’ ഇല്ലാത്തതിനാൽ വാക്യാരംഭത്തിൽ അത് ചേർത്തിട്ടില്ല. അടിക്കുറിപ്പുകളുടെ സൂചകങ്ങൾ ബന്ധപ്പെട്ട ആശയങ്ങൾക്കു പിന്നാലെ മുഖ്യപാഠത്തിൽ നൽകിയിരിക്കുന്നു.
