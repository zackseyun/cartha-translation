  yaml_path: translation/ot/ruth/002/005.yaml
  text: Then Boaz said to his young man who was set over the reapers[a], “Whose young woman is this?”
translation:
  language: ml
  text: 'അപ്പോൾ ബോവസ് കൊയ്ത്തുകാരുടെ മേൽനോട്ടത്തിനായി നിയോഗിക്കപ്പെട്ടിരുന്ന തന്റെ യുവപരിചാരകനോടു ചോദിച്ചു: “ഈ യുവതി ആരുടെ ആളാണ്?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഈ യുവതി ഏതു കുടുംബത്തിൽപ്പെട്ടവളാണ്?” എബ്രായ ചോദ്യം അവളുടെ കുടുംബത്തിലോ ഗൃഹത്തിലോ ഉള്ള ബന്ധത്തെക്കുറിച്ചാണ് ചോദിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... ചോദിച്ചു
  rationale: വാവ്-തുടർച്ച കഥയുടെ അടുത്ത സംഭവത്തിലേക്കു നീങ്ങുന്നു. സംഭാഷണം ഒരു ചോദ്യമായതിനാൽ മലയാളത്തിൽ ‘ചോദിച്ചു’ സ്വാഭാവികമാണ്; ‘അപ്പോൾ’ സംഭവക്രമം വ്യക്തമാക്കുന്നു.
- source_word: בֹּעַז
  choice: ബോവസ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ പരിചിതവും ഉറവിടത്തോട് അടുത്തതുമായ ലിപ്യന്തരണം.
- source_word: לְנַעֲרוֹ
  choice: തന്റെ യുവാവിനോട്
  rationale: נַעַר എന്നതിന് യുവാവ്, ഭൃത്യൻ, പരിചാരകൻ എന്നീ അർഥങ്ങൾ വരാം. ഇവിടെ മേൽനോട്ടച്ചുമതല അടുത്ത പദസമുച്ചയം വ്യക്തമാക്കുന്നതിനാൽ സാമൂഹികപദവി അധികമായി നിർണ്ണയിക്കാതെ ‘യുവാവ്’ എന്നു നിലനിർത്തുന്നു.
- source_word: הַנִּצָּב עַל הַקּוֹצְרִים
  choice: കൊയ്ത്തുകാരുടെ മേൽ നിയോഗിക്കപ്പെട്ടിരുന്ന
  rationale: נצב എന്ന നിഫാൽ കൃദന്തം നിയമിക്കപ്പെട്ടോ ചുമതലപ്പെടുത്തി നിർത്തപ്പെട്ടോ ഇരിക്കുന്നതിന്റെ ഭാവവും עַל മേൽനോട്ടബന്ധവും സൂചിപ്പിക്കുന്നു. ഈ പരിഭാഷ നിഷ്ക്രിയഭാവവും മേൽനോട്ടച്ചുമതലയും സംരക്ഷിക്കുന്നു.
- source_word: לְמִי
  choice: ആരുടേതാണ്
  rationale: ഈ എബ്രായ പ്രയോഗം ഉടമസ്ഥത മാത്രമല്ല, കുടുംബമോ ഗൃഹമോ ആയുള്ള ബന്ധവും ചോദിക്കാം. മലയാളത്തിലെ ‘ആരുടേതാണ്’ ആ യഥാർഥ ദ്വയാർഥത സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: הַנַּעֲרָה
  choice: യുവതി
  rationale: נַעֲרָה ഒരു യുവസ്ത്രീയെ സൂചിപ്പിക്കുന്നു. ‘യുവതി’ ആധുനികവും മാന്യവും സ്വാഭാവികവുമാണ്; ‘ദാസി’ എന്നു പറഞ്ഞാൽ ഉറവിടത്തിൽ വ്യക്തമല്ലാത്ത പദവി ചേർക്കും.
- source_word: הַזֹּאת
  choice: ഈ
  rationale: യുവതിയെ ചൂണ്ടിക്കാണിക്കുന്ന ലളിതമായ നിർദ്ദേശകപദത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
