translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ഉറവിടത്തിലെ സാമൂഹികബന്ധത്തിന്റെ ദ്വയാർഥത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചിരിക്കുന്നു; ‘മേൽ നിയോഗിക്കപ്പെട്ടിരുന്ന’ എന്ന രൂപം മേൽനോട്ടവും നിഷ്ക്രിയഭാവവും നിലനിർത്തുന്നു.
