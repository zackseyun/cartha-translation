  to: 'അപ്പോൾ ബോവസ് അവളോടു മറുപടി പറഞ്ഞു: “നിന്റെ ഭർത്താവിന്റെ മരണശേഷം നീ നിന്റെ അമ്മായിയമ്മയ്ക്കുവേണ്ടി ചെയ്തതെല്ലാം എനിക്ക് വിശദമായി അറിയിച്ചുകിട്ടിയിട്ടുണ്ട്. നിന്റെ അപ്പനെയും അമ്മയെയും ജന്മനാടിനെയും വിട്ട്, മുമ്പ് നിനക്ക് പരിചയമില്ലായിരുന്ന ഒരു ജനത്തിന്റെ ഇടയിലേക്കു നീ പോയതും ഞാൻ അറിഞ്ഞിരിക്കുന്നു.[a]”'
