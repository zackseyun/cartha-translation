  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֤עַן בֹּ֨עַז֙ וַ/יֹּ֣אמֶר לָ֔/הּ הֻגֵּ֨ד הֻגַּ֜ד לִ֗/י כֹּ֤ל אֲשֶׁר עָשִׂית֙ אֶת חֲמוֹתֵ֔/ךְ אַחֲרֵ֖י מ֣וֹת אִישֵׁ֑/ךְ וַ/תַּֽעַזְבִ֞י אָּבִ֣י/ךְ וְ/אִמֵּ֗/ךְ וְ/אֶ֨רֶץ֙ מֽוֹלַדְתֵּ֔/ךְ וַ/תֵּ֣לְכִ֔י אֶל עַ֕ם אֲשֶׁ֥ר לֹא יָדַ֖עַתְּ תְּמ֥וֹל שִׁלְשֽׁוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/011.yaml
  text: Then Boaz answered and said to her[a], “I have been fully told all that you have done for your mother-in-law after the death of your husband, and how you left your father and your mother and the land of your birth, and went to a people whom you did not know before.”
translation:
  language: ml
  text: 'അപ്പോൾ ബോവസ് അവളോടു മറുപടി പറഞ്ഞു: “നിന്റെ ഭർത്താവിന്റെ മരണശേഷം നീ നിന്റെ അമ്മായിയമ്മയ്ക്കുവേണ്ടി ചെയ്തതെല്ലാം എനിക്ക് വിശദമായി അറിയിച്ചുകിട്ടിയിട്ടുണ്ട്. നിന്റെ അപ്പനെയും അമ്മയെയും ജന്മനാടിനെയും വിട്ട്, മുമ്പ് നിനക്ക് പരിചയമില്ലായിരുന്ന ഒരു ജനത്തിന്റെ ഇടയിലേക്കു നീ പോയതും ഞാൻ അറിഞ്ഞിരിക്കുന്നു.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “ഇന്നലെയോ അതിന്റെ തലേദിവസമോ നിനക്കു പരിചയമില്ലായിരുന്ന.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֻגֵּד הֻגַּד לִי
  choice: എന്നോടു വിശദമായി പറഞ്ഞിട്ടുണ്ട്
  rationale: Infinitive absolute with the Hophal finite verb intensifies the passive report. This Malayalam phrasing naturally preserves both the passive sense and the thoroughness of the report.
- source_word: כֹּל אֲשֶׁר עָשִׂית
  choice: നീ ... ചെയ്തതെല്ലാം
  rationale: Preserves the totalizing force of כֹּל and forms an idiomatic Malayalam relative construction.
- source_word: אֶת חֲמוֹתֵךְ
  choice: നിന്റെ അമ്മായിയമ്മയ്ക്കുവേണ്ടി
  rationale: The object marker is contextually benefactive; this rendering clearly expresses what Ruth did for Naomi.
- source_word: אַחֲרֵי מוֹת אִישֵׁךְ
  choice: നിന്റെ ഭർത്താവിന്റെ മരണശേഷം
  rationale: Preserves the Hebrew nominal construction and its solemn narrative tone.
- source_word: וַתַּעַזְבִי
  choice: വിട്ട്
  rationale: A natural modern Malayalam equivalent for leaving behind, without the excessive emotive loading of 'ഉപേക്ഷിച്ച്'.
- source_word: אָבִיךְ וְאִמֵּךְ
  choice: നിന്റെ അപ്പനെയും അമ്മയെയും
  rationale: Retains the Hebrew's separate naming of father and mother rather than compressing them into 'parents'.
- source_word: וְאֶרֶץ מוֹלַדְתֵּךְ
  choice: ജന്മനാടിനെയും
  rationale: A concise, natural Malayalam rendering of 'the land of your birth/native land'.
- source_word: וַתֵּלְכִי אֶל עַם
  choice: ഒരു ജനത്തിന്റെ അടുക്കലേക്കു നീ വന്നതും
  rationale: Although הלך is formally 'go,' Malayalam narrative deixis naturally permits 'വന്നു' from Boaz's location and speech perspective. It clearly communicates Ruth's movement to the people among whom Boaz stands.
- source_word: עַם
  choice: ഒരു ജനം
  rationale: Represents an ethnic/community people without the more political connotations of 'nation'.
- source_word: אֲשֶׁר לֹא יָדַעַתְּ
  choice: നിനക്ക് പരിചയമില്ലായിരുന്ന
  rationale: ידע here concerns prior personal familiarity; 'പരിചയമില്ലായിരുന്ന' conveys this more naturally than a bare cognitive 'അറിയാതിരുന്ന'.
- source_word: תְּמוֹל שִׁלְשׁוֹם
  choice: മുമ്പ്
  rationale: The idiom literally refers to 'yesterday and the day before' but conventionally expresses previous time. The smooth sense is used in the text and the literal form retained in a footnote.
theological_decisions: []
translation_notes:
  register: Modern standard Malayalam with a dignified narrative register. 'അമ്മായിയമ്മ' is readily understandable for mother-in-law; 'അപ്പൻ' is natural and dignified in this setting. The intensified passive report is expressed idiomatically, while the Hebrew time idiom is documented in the footnote.
