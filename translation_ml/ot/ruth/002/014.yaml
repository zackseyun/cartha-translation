  yaml_path: translation/ot/ruth/002/014.yaml
  text: At mealtime Boaz said to her[a], “Come here and eat some bread, and dip your piece in the sour wine.” So she sat beside the reapers, and he passed her roasted grain. She ate and was satisfied, and she had some left over.
translation:
  language: ml
  text: 'ഭക്ഷണസമയത്ത് ബോവസ് അവളോടു പറഞ്ഞു: “ഇവിടേക്കു വന്ന് അപ്പത്തിൽനിന്ന് കുറെ കഴിക്കുക; നിന്റെ അപ്പക്കഷണം പുളിച്ച വീഞ്ഞിൽ മുക്കുക.[a]” അങ്ങനെ അവൾ കൊയ്ത്തുകാരുടെ അരികിൽ ഇരുന്നു. അവൻ അവൾക്കു വറുത്ത ധാന്യം നീട്ടിക്കൊടുത്തു. അവൾ കഴിച്ചു തൃപ്തയായി; അവൾക്കു കുറെ ബാക്കിയും ഉണ്ടായിരുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നിന്റെ അപ്പക്കഷണം വിനാഗിരിയിൽ മുക്കുക.” എബ്രായപദമായ חֹמֶץ വിനാഗിരിയെയോ പുളിച്ച വീഞ്ഞുകൊണ്ടുള്ള പാനീയത്തെയോ സൂചിപ്പിക്കാം; ഈ കൃഷിത്തൊഴിലാളികളുടെ ഭക്ഷണസന്ദർഭത്തിൽ പുളിച്ച വീഞ്ഞായിരിക്കാനാണ് കൂടുതൽ സാധ്യത.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֵת הָאֹכֶל
  choice: ഭക്ഷണസമയത്ത്
  rationale: തൊഴിലാളികൾ ഭക്ഷണം കഴിക്കുന്ന സമയത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: גֹּשִׁי הֲלֹם
  choice: ഇവിടേക്കു വന്ന്
  rationale: അടുത്തേക്കു വരാനുള്ള നേരിട്ടുള്ള ക്ഷണം ലളിതവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: וְאָכַלְתְּ מִן הַלֶּחֶם
  choice: അപ്പത്തിൽനിന്നു കുറെ കഴിക്കുക
  rationale: מִן എന്നതിന്റെ ഭാഗികത സൂചിപ്പിക്കുന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: וְטָבַלְתְּ פִּתֵּךְ בַּחֹמֶץ
  choice: നിന്റെ അപ്പക്കഷണം പുളിച്ച വീഞ്ഞിൽ മുക്കുക
  rationale: פַּת ഭക്ഷണസന്ദർഭത്തിൽ അപ്പക്കഷണത്തെ സൂചിപ്പിക്കുന്നു; חֹמֶץ പുളിച്ച വീഞ്ഞോ വിനാഗിരിയോ ആകാമെന്ന യഥാർഥ പദാർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: מִצַּד הַקּוֹצְרִים
  choice: കൊയ്ത്തുകാരുടെ അരികിൽ
  rationale: കൃഷിപ്പണിയുടെ പശ്ചാത്തലവും അവരുടെ വശത്തുള്ള സ്ഥാനവും വ്യക്തമായി നൽകുന്നു.
- source_word: וַיִּצְבָּט לָהּ קָלִי
  choice: അവൻ അവൾക്കു വറുത്ത ധാന്യം നീട്ടിക്കൊടുത്തു
  rationale: അപൂർവമായ ക്രിയ ഭക്ഷണം കൈമാറുകയോ നീട്ടിക്കൊടുക്കുകയോ ചെയ്തതിനെ സൂചിപ്പിക്കുന്നു; קָלִי വറുത്ത ധാന്യമാണ്.
- source_word: וַתִּשְׂבַּע
  choice: തൃപ്തയായി
  rationale: വേണ്ടത്ര കഴിച്ച് നിറഞ്ഞു എന്ന അർഥം സ്വാഭാവികവും മാന്യവുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: וַתֹּתַר
  choice: കുറെ മിച്ചവും വെച്ചു
  rationale: സ്ത്രീലിംഗ ഏകവചന ക്രിയാശൃംഖല രൂത്തിനെയാണ് കർത്താവായി തുടരുന്നത്; കഴിച്ചതിനുശേഷം ഭക്ഷണത്തിൽ കുറെ ശേഷിപ്പിച്ചു എന്ന ആശയം നൽകുന്നു.
