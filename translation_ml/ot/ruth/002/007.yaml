revisions:
- from: 'അവൾ പറഞ്ഞു: “കൊയ്ത്തുകാരുടെ പിന്നാലെ കറ്റകൾക്കിടയിൽ കാലാ പെറുക്കി ശേഖരിക്കാൻ ദയവായി എന്നെ അനുവദിക്കണമേ.” അങ്ങനെ അവൾ വന്ന് രാവിലെമുതൽ ഇതുവരെ ഇവിടെത്തന്നെ പണിയെടുത്തുകൊണ്ടിരിക്കുന്നു; കുടിലിൽ അവൾ അല്പസമയം മാത്രമേ ഇരുന്നിട്ടുള്ളൂ.[a]'
  to: 'അവൾ പറഞ്ഞു: “കൊയ്ത്തുകാരുടെ പിന്നാലെ കറ്റകൾക്കിടയിൽ കതിർ പെറുക്കാനും ശേഖരിക്കാനും ദയവായി എന്നെ അനുവദിക്കണമേ.” അങ്ങനെ അവൾ വന്ന് രാവിലെ മുതൽ ഇതുവരെ അവിടെത്തന്നെ തങ്ങിക്കൊണ്ടിരിക്കുന്നു; കുടിലിൽ അവൾ അല്പസമയം മാത്രമേ ഇരുന്നിട്ടുള്ളൂ.[a]'
