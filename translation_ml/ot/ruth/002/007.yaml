reference: Ruth 2:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֹּ֗אמֶר אֲלַקֳטָה נָּא֙ וְ/אָסַפְתִּ֣י בָֽ/עֳמָרִ֔ים אַחֲרֵ֖י הַ/קּוֹצְרִ֑ים וַ/תָּב֣וֹא וַֽ/תַּעֲמ֗וֹד מֵ/אָ֤ז הַ/בֹּ֨קֶר֙ וְ/עַד עַ֔תָּה זֶ֛ה שִׁבְתָּ֥/הּ הַ/בַּ֖יִת מְעָֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/007.yaml
  text: She said[a], ‘Please let me glean and gather among the sheaves after the reapers.’ So she came and has remained from morning until now; she has sat in the house only a little.
translation:
  language: ml
  text: 'അവൾ പറഞ്ഞു: “കൊയ്ത്തുകാരുടെ പിന്നാലെ കറ്റകൾക്കിടയിൽ കതിർ പെറുക്കാനും ശേഖരിക്കാനും ദയവായി എന്നെ അനുവദിക്കണമേ.” അങ്ങനെ അവൾ വന്ന് രാവിലെ മുതൽ ഇതുവരെ അവിടെത്തന്നെ തങ്ങിക്കൊണ്ടിരിക്കുന്നു; കുടിലിൽ അവൾ അല്പസമയം മാത്രമേ ഇരുന്നിട്ടുള്ളൂ.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അവൾ കുടിലിൽ അല്പസമയം മാത്രമേ വിശ്രമിച്ചിട്ടുള്ളൂ.” അവസാന ഉപവാക്യത്തിന്റെ ഹീബ്രൂ പാഠം ദുഷ്കരമാണ്; “വീട്” എന്നു പരിഭാഷപ്പെടുത്താവുന്ന പദം ഇവിടെ വയലിലെ തൊഴിലാളികളുടെ കുടിലിനെ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲלַקֳטָה
  choice: കാലാ പെറുക്കി
  rationale: കൊയ്ത്തിനുശേഷം വയലിൽ ശേഷിക്കുന്ന ധാന്യം പെറുക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന കാർഷികസന്ദർഭത്തിലെ കൃത്യവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ പ്രയോഗം.
- source_word: נָּא
  choice: ദയവായി ... അനുവദിക്കണമേ
  rationale: രൂത്തിന്റെ ആദരപൂർവമായ അപേക്ഷ ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: וְאָסַפְתִּי
  choice: ശേഖരിക്കാൻ
  rationale: לקט എന്ന പെറുക്കലിൽനിന്ന് വ്യത്യസ്തമായി, പെറുക്കിയതു കൂട്ടിച്ചേർക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു.
- source_word: בָעֳמָרִים
  choice: കറ്റകൾക്കിടയിൽ
  rationale: עֳמָרִים കെട്ടിവെച്ച ധാന്യത്തണ്ടുകളുടെ കറ്റകളാണ്; בְ എന്ന സ്ഥലസൂചകത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം ‘ക്കിടയിൽ’ ആണ്.
- source_word: אַחֲרֵי הַקּוֹצְרִים
  choice: കൊയ്ത്തുകാരുടെ പിന്നാലെ
  rationale: കൊയ്ത്തുകാരെ പിന്തുടർന്ന് പെറുക്കുന്ന സ്ഥലപരവും ക്രമപരവുമായ അർഥം നിലനിർത്തുന്നു.
- source_word: וַתָּבֹא וַתַּעֲמוֹד
  choice: അവൾ വന്ന് ... ഇവിടെത്തന്നെ പണിയെടുത്തുകൊണ്ടിരിക്കുന്നു
  rationale: അക്ഷരാർഥമായ ‘വന്ന് നിന്നു’ എന്നതിലുപരി തുടർന്നുള്ള സമയപ്രയോഗം സൂചിപ്പിക്കുന്ന നിലനിൽപ്പും അധ്വാനവും സന്ദർഭോചിതമായി നൽകുന്നു; ‘പണിയെടുത്തു’ എന്നത് സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാകുന്ന വ്യാഖ്യാനപരമായ പൂരിപ്പിക്കലാണ്.
- source_word: מֵאָז הַבֹּקֶר וְעַד עַתָּה
  choice: രാവിലെമുതൽ ഇതുവരെ
  rationale: രാവിലെ ആരംഭിച്ച് റിപ്പോർട്ട് ചെയ്യുന്ന സമയംവരെയുള്ള തുടർച്ച സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: זֶה שִׁבְתָּהּ הַבַּיִת מְעָט
  choice: കുടിലിൽ അവൾ അല്പസമയം മാത്രമേ ഇരുന്നിട്ടുള്ളൂ
  rationale: ദുഷ്കരമായ ഹീബ്രൂ വാക്യത്തിന്റെ സാധ്യതയേറിയ അർഥം—വയലിലെ അഭയസ്ഥാനത്ത് അവൾ ചെലവഴിച്ച സമയം വളരെ കുറവായിരുന്നു—വ്യക്തമായി നൽകുന്നു; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായിക്കാൻ എളുപ്പമുള്ളതുമായ ശൈലി. പുരാതന കൊയ്ത്തുസന്ദർഭം വ്യക്തമാക്കാൻ ‘കാലാ പെറുക്കുക’, ‘കറ്റകൾ’, ‘കുടിൽ’ എന്നീ പ്രയോഗങ്ങൾ തെരഞ്ഞെടുത്തു. മൂലപാഠത്തിലെ അവസാന ഉപവാക്യത്തിന്റെ വ്യാകരണ-അർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
