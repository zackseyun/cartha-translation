  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֹּאמֶר֩ לָ֨/הּ חֲמוֹתָ֜/הּ אֵיפֹ֨ה לִקַּ֤טְתְּ הַ/יּוֹם֙ וְ/אָ֣נָה עָשִׂ֔ית יְהִ֥י מַכִּירֵ֖/ךְ בָּר֑וּךְ וַ/תַּגֵּ֣ד לַ/חֲמוֹתָ֗/הּ אֵ֤ת אֲשֶׁר עָשְׂתָה֙ עִמּ֔/וֹ וַ/תֹּ֗אמֶר שֵׁ֤ם הָ/אִישׁ֙ אֲשֶׁ֨ר עָשִׂ֧יתִי עִמּ֛/וֹ הַ/יּ֖וֹם בֹּֽעַז־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/019.yaml
  text: And her mother-in-law said to her[a], “Where did you glean today, and where have you worked? Blessed be the one who took notice of you.” So she told her mother-in-law with whom she had worked, and she said, “The name of the man with whom I worked today is Boaz.”
translation:
  language: ml
  text: 'അവളുടെ അമ്മായിയമ്മ അവളോടു ചോദിച്ചു: “ഇന്ന് നീ എവിടെയാണ് കതിർ പെറുക്കിയത്? എവിടെയാണ് നീ വേല ചെയ്തത്? നിന്നെ ശ്രദ്ധിച്ചവൻ അനുഗൃഹീതനായിരിക്കട്ടെ!” അപ്പോൾ താൻ ആരോടുകൂടെ വേല ചെയ്തുവെന്ന് അവൾ അമ്മായിയമ്മയോടു പറഞ്ഞു. അവൾ പറഞ്ഞു: “ഇന്ന് ഞാൻ ആരോടുകൂടെ വേല ചെയ്തുവോ, ആ മനുഷ്യന്റെ പേര് ബോവസ് എന്നാണ്.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വേല ചെയ്തുവെന്ന്,” “വേല ചെയ്തുവോ” എന്നീ ഭാഗങ്ങൾക്ക് എബ്രായത്തിൽ കൂടുതൽ അക്ഷരാർഥമായി “അവനോടുകൂടെ അവൾ ചെയ്തത്,” “ഇന്ന് ഞാൻ അവനോടുകൂടെ ചെയ്തത്” എന്നാണ്. ഇവിടെ വയലിലെ അധ്വാനമാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמוֹתָהּ
  choice: അവളുടെ അമ്മായിയമ്മ
  rationale: സന്ദർഭത്തിലെ ഭർത്താവിന്റെ അമ്മയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും പ്രചാരത്തിലുള്ളതുമായ മലയാള ബന്ധപദം.
- source_word: לִקַּטְתְּ
  choice: കതിർ പെറുക്കിയത്
  rationale: കൊയ്ത്തിനുശേഷം ശേഷിച്ച ധാന്യക്കതിരുകൾ ശേഖരിക്കുന്ന പ്രവൃത്തിയെ മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു; വെറും ‘ശേഖരിക്കുക’ എന്ന പൊതുവായ അർഥം ഒഴിവാക്കുന്നു.
- source_word: וְאָנָה עָשִׂית
  choice: എവിടെയാണ് നീ വേല ചെയ്തത്
  rationale: עשה എന്ന പൊതുവായ ‘ചെയ്യുക’ എന്ന ക്രിയയ്ക്ക് വയൽവേലയുടെ ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമായ അർഥം നൽകുന്നു.
- source_word: יְהִי מַכִּירֵךְ בָּרוּךְ
  choice: നിന്നെ ശ്രദ്ധിച്ചവൻ അനുഗൃഹീതനായിരിക്കട്ടെ
  rationale: מכיר എന്നതിലെ തിരിച്ചറിയുക/ശ്രദ്ധിക്കുക എന്ന ആശയം നിലനിർത്തുകയും റൂത്തിനോടു അനുകൂല ശ്രദ്ധ കാട്ടിയ ആളെ നൊവൊമി അനുഗ്രഹിക്കുന്നതായി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: אֵת אֲשֶׁר עָשְׂתָה עִמּוֹ
  choice: താൻ ആരോടുകൂടെ വേല ചെയ്തുവെന്ന്
  rationale: ഹീബ്രുവിലെ അക്ഷരാർഥമായ ‘അവനോടുകൂടെ ചെയ്തത്’ എന്ന പ്രയോഗം ഈ വയൽവേലാ സന്ദർഭത്തിൽ തെറ്റിദ്ധാരണയില്ലാതെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר עָשִׂיתִי עִמּוֹ
  choice: ഞാൻ ആരോടുകൂടെ വേല ചെയ്തുവോ
  rationale: עשה + עם എന്ന ഘടനയിലെ അസ്പഷ്ടമായ ‘കൂടെ ചെയ്തത്’ എന്നതിനെ സന്ദർഭാനുസൃതമായി വേലയായി വ്യക്തമാക്കുന്നു, അതേസമയം ‘ആരോടുകൂടെ’ എന്ന ബന്ധം സംരക്ഷിക്കുന്നു.
- source_word: בֹּעַז
  choice: ബോവസ്
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം സ്വീകരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘കതിർ പെറുക്കുക’ കാർഷിക-സാമൂഹിക പശ്ചാത്തലം സംരക്ഷിക്കുന്നു. ‘വേല ചെയ്യുക’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്. അടിക്കുറിപ്പ് ചിഹ്നം പ്രധാനവാചകത്തിൽ ചേർത്തിട്ടുണ്ട്.
