translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. കാർഷികസന്ദർഭത്തിൽ ‘പെറുക്കുക’ ഉപയോഗിച്ച് gleaning എന്ന ആശയം സ്വാഭാവികമായി നൽകി. [a], [b] എന്നീ അടിക്കുറിപ്പുചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട പദപ്രയോഗങ്ങൾക്കു പിന്നാലെ പ്രധാനപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
