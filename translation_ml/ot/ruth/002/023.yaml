source:
  edition: WLC
  text: וַ/תִּדְבַּ֞ק בְּ/נַעֲר֥וֹת בֹּ֨עַז֙ לְ/לַקֵּ֔ט עַד כְּל֥וֹת קְצִֽיר הַ/שְּׂעֹרִ֖ים וּ/קְצִ֣יר הַֽ/חִטִּ֑ים וַ/תֵּ֖שֶׁב אֶת חֲמוֹתָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/023.yaml
  text: So she stayed close to Boaz's young women to glean[a], until the end of the barley harvest and the wheat harvest[b]. And she lived with her mother-in-law.
translation:
  language: ml
  text: അങ്ങനെ അവൾ ബോവസിന്റെ യുവതികളോടു ചേർന്നുനിന്ന്[a] യവക്കൊയ്ത്തും ഗോതമ്പുകൊയ്ത്തും തീരുന്നതുവരെ പെറുക്കിക്കൊണ്ടിരുന്നു. അവൾ തന്റെ അമ്മായിയമ്മയോടൊപ്പം താമസിച്ചു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ബോവസിന്റെ യുവതികളോടു മുറുകെ ചേർന്നുനിന്ന്.” എബ്രായ ക്രിയ അടുത്ത ബന്ധത്തെയോ ഉറച്ച ചേർച്ചയെയോ ഊന്നിപ്പറയാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അവൾ തന്റെ അമ്മായിയമ്മയോടൊപ്പം തുടർന്നു.” എബ്രായ ക്രിയയ്ക്ക് സന്ദർഭമനുസരിച്ച് താമസിക്കുക, തുടരുക, വസിക്കുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּדְבַּק
  choice: ചേർന്നുനിന്ന്
  rationale: דבק എന്ന ക്രിയയ്ക്ക് പറ്റിച്ചേരുക, മുറുകെ ചേർന്നുനിൽക്കുക എന്ന അടിസ്ഥാനഭാവമുണ്ട്. ഇവിടെ ബോവസിന്റെ യുവതൊഴിലാളികളുമായുള്ള രൂത്തിന്റെ തുടർച്ചയായ അടുത്ത സഹവാസം സ്വാഭാവികമായി അറിയിക്കുന്നു; ശാരീരികമായി പിടിച്ചുനിന്നു എന്ന അതിശക്തമായ ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: בְּנַעֲרוֹת בֹּעַז
  choice: ബോവസിന്റെ യുവതികളോടു
  rationale: נַעֲרוֹת ഇവിടെ ബോവസിന്റെ യുവതൊഴിലാളികളെയാണ് സൂചിപ്പിക്കുന്നത്. דבק-യോടു ചേർന്ന בְ എന്ന ഉപസർഗത്തിന്റെ ബന്ധഭാവം മലയാളത്തിൽ ‘യുവതികളോടു ചേർന്നുനിന്ന്’ എന്നു സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: לְלַקֵּט
  choice: പെറുക്കിക്കൊണ്ടിരുന്നു
  rationale: לקט കൊയ്ത്തിനുശേഷം വയലിൽ ശേഷിച്ച കതിരുകൾ പെറുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. കാലയളവിലുടനീളം തുടർന്ന പ്രവൃത്തിയായതിനാൽ ‘പെറുക്കിക്കൊണ്ടിരുന്നു’ എന്നു നൽകി.
- source_word: עַד כְּלוֹת
  choice: തീരുന്നതുവരെ
  rationale: ഈ ഘടന പൂർത്തിയാകുന്നതുവരെയുള്ള സമയപരിധി സൂചിപ്പിക്കുന്നു. ‘തീരുന്നതുവരെ’ ആ കാലപരിധി സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: קְצִיר הַשְּׂעֹרִים וּקְצִיר הַחִטִּים
  choice: യവക്കൊയ്ത്തും ഗോതമ്പുകൊയ്ത്തും
  rationale: രണ്ട് വ്യത്യസ്ത വിളവെടുപ്പുകാലങ്ങളും വ്യക്തമായി നിലനിർത്തുന്നു; രൂത്ത് ദീർഘകാലം പെറുക്കിയെന്ന വിവരണപ്രാധാന്യവും സംരക്ഷിക്കുന്നു.
- source_word: וַתֵּשֶׁב
  choice: താമസിച്ചു
  rationale: ישב എന്നതിന് ഇരിക്കുക, പാർക്കുക, വസിക്കുക, തുടരുക തുടങ്ങിയ അർഥങ്ങളുണ്ട്. ഇവിടെ അമ്മായിയമ്മയോടൊപ്പമുള്ള വാസമാണ് സന്ദർഭസഹജം; എങ്കിലും ‘കൂടെ തുടർന്നു’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אֶת חֲמוֹתָהּ
  choice: തന്റെ അമ്മായിയമ്മയോടൊപ്പം
  rationale: ישב-യോടുള്ള ഈ പ്രയോഗം ഒരാളോടൊപ്പം വസിക്കുക എന്ന ബന്ധം അറിയിക്കുന്നു. മലയാളത്തിൽ ‘അമ്മായിയമ്മയോടൊപ്പം’ എന്നത് വ്യക്തവും സ്വാഭാവികവുമാണ്.
