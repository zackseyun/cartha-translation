  yaml_path: translation/ot/ruth/002/020.yaml
  text: Naomi said to her daughter-in-law[a], “Blessed be he by Yahweh, whose kindness has not forsaken the living or the dead.” Then Naomi said to her, “The man is a close relative of ours[b]; he is one of our redeemers.”
translation:
  language: ml
  text: 'നൊവൊമി തന്റെ മരുമകളോടു പറഞ്ഞു: “ജീവിച്ചിരിക്കുന്നവരോടും മരിച്ചവരോടുമുള്ള തന്റെ ദയ കൈവിടാത്ത യഹോവ അവനെ അനുഗ്രഹിക്കട്ടെ[a].” പിന്നെ നൊവൊമി അവളോടു പറഞ്ഞു: “ആ മനുഷ്യൻ നമ്മുടെ അടുത്ത ബന്ധുവാണ്; അവൻ നമ്മുടെ വീണ്ടെടുപ്പുകാരിൽ ഒരാളാണ്[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു സാധ്യത: “ജീവിച്ചിരിക്കുന്നവരോടും മരിച്ചവരോടുമുള്ള തന്റെ ദയ കൈവിടാത്ത അവനെ യഹോവ അനുഗ്രഹിക്കട്ടെ.” ഈ വായനയിൽ “തന്റെ ദയ” എന്നത് യഹോവയുടെ ദയയല്ല, ബോവസിന്റെ ദയയാണ്.'
    reason: alternative_reading
  - marker: b
    text: അഥവാ “കുടുംബവീണ്ടെടുപ്പുകാരിൽ ഒരാൾ.” കുടുംബാംഗത്തെയോ കുടുംബസ്വത്തിനെയോ വീണ്ടെടുക്കാനുള്ള അംഗീകൃത അവകാശമോ കടമയോ ഉള്ള അടുത്ത ബന്ധുവിനെയാണ് എബ്രായപദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ הוּא לַיהוָה
  choice: യഹോവ അവനെ അനുഗ്രഹിക്കട്ടെ
  rationale: ക്രിയയില്ലാത്ത എബ്രായ അനുഗ്രഹസൂത്രത്തെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ ആശംസയായി അവതരിപ്പിക്കുന്നു; לַיהוָה അനുഗ്രഹത്തിന്റെ ഉറവിടമായ യഹോവയെ സൂചിപ്പിക്കുന്നു.
- source_word: חַסְדּוֹ
  choice: തന്റെ ദയ
  rationale: חֶסֶד എന്ന പദത്തിന്റെ ദയ, വിശ്വസ്തസ്നേഹം, ഉടമ്പടിവിശ്വസ്തത എന്നീ അർത്ഥവ്യാപ്തികളിൽ സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക പദമാണ് ‘ദയ’. സർവനാമം യഹോവയെയോ ബോവസിനെയോ സൂചിപ്പിക്കാമെന്ന അവ്യക്തത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: לֹא עָזַב
  choice: കൈവിടാത്ത
  rationale: עזב എന്നതിന്റെ ‘ഉപേക്ഷിക്കുക/കൈവിടുക’ എന്ന ബന്ധപരമായ ശക്തി മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: אֶת הַחַיִּים וְאֶת הַמֵּתִים
  choice: ജീവിച്ചിരിക്കുന്നവരോടും മരിച്ചവരോടും
  rationale: എബ്രായത്തിലെ രണ്ടു വിഭാഗങ്ങളെയും ഉൾക്കൊള്ളുന്ന സമാന്തരപ്രയോഗം മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: קָרוֹב לָנוּ
  choice: നമ്മുടെ അടുത്ത ബന്ധു
  rationale: ഇവിടെ קָרוֹב സ്ഥലപരമായ സമീപ്യമല്ല, കുടുംബബന്ധത്തിലെ അടുപ്പമാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: מִגֹּאֲלֵנוּ
  choice: നമ്മുടെ വീണ്ടെടുപ്പുകാരിൽ ഒരാൾ
  rationale: גאל ധാതുവിൽനിന്നുള്ള രൂപം കുടുംബാംഗത്തെയോ കുടുംബസ്വത്തിനെയോ വീണ്ടെടുക്കാനുള്ള അംഗീകൃത അവകാശമോ കടമയോ ഉള്ള ബന്ധുവിനെ സൂചിപ്പിക്കുന്നു. മുഖ്യപാഠത്തിൽ സംക്ഷിപ്തമായ പരിഭാഷയും അടിക്കുറിപ്പിൽ നിയമ-കുടുംബ പശ്ചാത്തലവും നൽകുന്നു.
theological_decisions:
- issue: 'അനുഗ്രഹവാക്യത്തിലെ സർവനാമങ്ങളുടെ സൂചിതവ്യക്തി: നൊവൊമി ബോവസിനെ അനുഗ്രഹിക്കുന്നുവോ, ‘തന്റെ ദയ’ യഹോവയുടേതോ ബോവസിന്റേതോ'
  choice: നൊവൊമി ബോവസിനുവേണ്ടി യഹോവയുടെ അനുഗ്രഹം ആശംസിക്കുന്നു; ‘തന്റെ ദയ’ യഹോവയുടെ ദയയെ സൂചിപ്പിക്കുന്നു.
  alternative: നൊവൊമി ബോവസിനുവേണ്ടി അനുഗ്രഹം ആശംസിക്കുന്നു; ‘തന്റെ ദയ’ ബോവസിന്റെ ദയയെ സൂചിപ്പിക്കുന്നു.
  rationale: ഉടൻ മുമ്പ് പരാമർശിക്കപ്പെട്ട പുരുഷൻ ബോവസായതിനാൽ അനുഗ്രഹിക്കപ്പെടുന്നവൻ അവനാണ്. ബന്ധവാക്യം സമീപസ്ഥമായ ദൈവനാമത്തോട് ചേർക്കാവുന്നതും ഗ്രന്ഥത്തിലെ ദൈവിക ദയയുടെ പ്രമേയത്തോട് പൊരുത്തപ്പെടുന്നതുമാണ്. എങ്കിലും എബ്രായവാക്യം മറ്റൊരു ബന്ധവും അനുവദിക്കുന്നതിനാൽ ബോവസിനെ സൂചിപ്പിക്കുന്ന വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. ‘യഹോവ’ എന്ന ദൈവനാമം നേരിട്ട് നിലനിർത്തി. കുടുംബ-നിയമപരമായ സാങ്കേതികത മുഖ്യപാഠത്തെ ഭാരപ്പെടുത്താതെ അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
