source:
  edition: WLC
  text: וְ/הִנֵּה בֹ֗עַז בָּ֚א מִ/בֵּ֣ית לֶ֔חֶם וַ/יֹּ֥אמֶר לַ/קּוֹצְרִ֖ים יְהוָ֣ה עִמָּ/כֶ֑ם וַ/יֹּ֥אמְרוּ ל֖/וֹ יְבָרֶכְ/ךָ֥ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/004.yaml
  text: And behold[a], Boaz came from Bethlehem and said to the reapers, “Yahweh be with you.” And they said to him[b], “May Yahweh bless you.”
translation:
  language: ml
  text: ഇതാ, ബോവസ് ബേത്‌ലഹേമിൽനിന്ന് വന്നു. അവൻ കൊയ്ത്തുകാരോട്, “യഹ്‌വെ നിങ്ങളോടുകൂടെ ഇരിക്കട്ടെ”[a] എന്നു പറഞ്ഞു. അവർ അവനോട്, “യഹ്‌വെ അങ്ങയെ അനുഗ്രഹിക്കട്ടെ”[b] എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രുവിൽ അക്ഷരാർഥം: “യഹ്‌വെ നിങ്ങളോടുകൂടെ.” ഇത് അഭിവാദ്യമായോ അനുഗ്രഹാശംസയായോ ഉപയോഗിച്ച പ്രയോഗമാണ്.'
    reason: മൂലത്തിലെ ക്രിയാരഹിത ഘടനയും സന്ദർഭോചിതമായ ആശംസാഭാവവും വ്യക്തമാക്കുന്നു.
  - marker: b
    text: 'അഥവാ: “യഹ്‌വെ അങ്ങയെ അനുഗ്രഹിക്കുമാറാകട്ടെ.” ഹീബ്രു ക്രിയാരൂപം ഒരു ആശംസയോ അനുഗ്രഹമോ പ്രകടിപ്പിക്കുന്നു.'
    reason: ആശംസാഭാവം മലയാളത്തിൽ മറ്റൊരു സ്വാഭാവിക രീതിയിൽ നൽകാമെന്നു സൂചിപ്പിക്കുന്നു.
lexical_decisions:
- source_word: וְהִנֵּה
  choice: അപ്പോൾ ഇതാ
  rationale: വിവരണത്തിലെ അടുത്ത രംഗത്തെ സജീവമായി അവതരിപ്പിക്കുന്ന ഹീബ്രു വ്യവഹാരസൂചകത്തിന്റെ ഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בֹּעַז
  choice: ബോവസ്
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം.
- source_word: בָּא
  choice: വന്നു
  rationale: בוא എന്ന ക്രിയയുടെ സന്ദർഭോചിതവും നേരിട്ടുള്ളതുമായ പരിഭാഷ.
- source_word: מִבֵּית לֶחֶם
  choice: ബേത്‌ലഹേമിൽനിന്നു
  rationale: מן എന്ന ഉപസർഗത്തിന്റെ ‘നിന്ന്’ എന്ന അർഥവും സ്ഥലനാമവും വ്യക്തമായി നൽകുന്നു.
- source_word: לַקֹּצְרִים
  choice: കൊയ്ത്തുകാരോട്
  rationale: קצר എന്ന ‘കൊയ്യുക’ എന്ന ധാതുവുമായി നേരിട്ട് ബന്ധപ്പെടുന്ന, കാർഷികസന്ദർഭത്തിന് യോജിച്ച സാധാരണ മലയാളപദം.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: עִמָּכֶם
  choice: നിങ്ങളോടുകൂടെ ഇരിക്കട്ടെ
  rationale: അക്ഷരാർഥത്തിൽ ക്രിയയില്ലാത്ത ‘യഹ്‌വെ നിങ്ങളോടുകൂടെ’ എന്ന വാക്യം ഈ അഭിവാദ്യ-ആശംസാസന്ദർഭത്തിൽ അനുഗ്രഹാശംസയായി സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יְבָרֶכְךָ
  choice: അങ്ങയെ അനുഗ്രഹിക്കട്ടെ
  rationale: ക്രിയാരൂപത്തിലെ ആശംസാഭാവം ‘അനുഗ്രഹിക്കട്ടെ’ എന്നു വ്യക്തമാക്കുന്നു; ഏകവചനമായ ‘നിന്നെ’ എന്ന അർഥം ബോവസിനോടുള്ള ആദരസൂചകമായ ‘അങ്ങയെ’ കൊണ്ട് നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ ചതുരക്ഷര വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരം ചെയ്തു; ഒരു സ്ഥാനപ്പേര് പകരംവെച്ചിട്ടില്ല.
- issue: יְהוָה עִמָּכֶם എന്ന ക്രിയാരഹിത വാക്യത്തിന്റെ ഭാവം
  choice: യഹ്‌വെ നിങ്ങളോടുകൂടെ ഇരിക്കട്ടെ
  alternative: യഹ്‌വെ നിങ്ങളോടുകൂടെയുണ്ട്
  rationale: തൊഴിലാളികളോടുള്ള അഭിവാദ്യവും അവരുടെ മറുപടിയായ അനുഗ്രഹാശംസയും ചേർന്ന സന്ദർഭം ഇവിടെ കേവല പ്രസ്താവനയെക്കാൾ ആശംസാഭാവം സൂചിപ്പിക്കുന്നു; എങ്കിലും ഹീബ്രുവിൽ ക്രിയ പ്രകടമല്ലെന്ന കാര്യം അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും വായിക്കാൻ എളുപ്പമുള്ളതുമായ വിവരണശൈലി സ്വീകരിച്ചു. ‘ഇതാ’ എന്നത് രംഗത്തിന്റെ സജീവത നിലനിർത്തുന്നു; പഴഞ്ചൻ ഭാവം ഒഴിവാക്കാൻ ‘നോക്കൂ’ ഉപയോഗിച്ചില്ല. തൊഴിലാളികൾ ബോവസിനോട് പറയുന്ന ഏകവചന സർവനാമം സാമൂഹികസന്ദർഭത്തിന് യോജിച്ച ആദരരൂപമായ ‘അങ്ങയെ’ എന്നു പരിഭാഷപ്പെടുത്തി.
