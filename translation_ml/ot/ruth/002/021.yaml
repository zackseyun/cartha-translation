source:
  edition: WLC
  text: וַ/תֹּ֖אמֶר ר֣וּת הַ/מּוֹאֲבִיָּ֑ה גַּ֣ם כִּי אָמַ֣ר אֵלַ֗/י עִם הַ/נְּעָרִ֤ים אֲשֶׁר לִ/י֙ תִּדְבָּקִ֔י/ן עַ֣ד אִם כִּלּ֔וּ אֵ֥ת כָּל הַ/קָּצִ֖יר אֲשֶׁר לִֽ/י׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/021.yaml
  text: Then Ruth the Moabite said[a], “He also said to me, ‘You are to stay close by my young women until they have finished all my harvest.’”
translation:
  language: ml
  text: 'അപ്പോൾ മോവാബ്യസ്ത്രീയായ രൂത്ത് പറഞ്ഞു: “അദ്ദേഹം എന്നോട് ഇതും പറഞ്ഞു: ‘എന്റെ യുവവേലക്കാരോടൊപ്പം അവർ എന്റെ മുഴുവൻ വിളവെടുപ്പും തീർക്കുന്നതുവരെ ചേർന്നുനിൽക്കുക[a].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രു പാഠത്തിൽ ഇവിടെ “യുവവേലക്കാർ” എന്ന പുല്ലിംഗരൂപമാണ്. എന്നാൽ 2:8-ൽ ബോവസ് “യുവവേലക്കാരികൾ” എന്നാണ് പറഞ്ഞത്; അതിനാൽ ചില പരിഭാഷകൾ ഇവിടെ “എന്റെ യുവവേലക്കാരികളോടൊപ്പം ചേർന്നുനിൽക്കുക” എന്നു നൽകുന്നു.
    reason: textual_contextual_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച കഥയിലെ അടുത്ത സംഭവത്തിലേക്കു നീങ്ങുന്നു; ആ ക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ ‘അപ്പോൾ’ പ്രകടമാക്കുന്നു.
- source_word: רוּת הַמּוֹאֲבִיָּה
  choice: മോവാബ്യസ്ത്രീയായ രൂത്ത്
  rationale: വ്യക്തിനാമവും സ്ത്രീലിംഗത്തിലുള്ള ജനതാസൂചകപദവും ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: גַּם כִּי אָמַר אֵלַי
  choice: അദ്ദേഹം എന്നോട് ഇതും പറഞ്ഞു
  rationale: גַּם എന്നതിലെ കൂട്ടിച്ചേർക്കൽഭാവം ‘ഇതും’ എന്നു സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; കർത്താവ് സന്ദർഭത്തിൽ ബോവസ് ആണെങ്കിലും പേരിനെ മൂലപാഠത്തിൽ ഇല്ലാത്തവിധം ചേർത്തിട്ടില്ല.
- source_word: עִם הַנְּעָרִים אֲשֶׁר לִי
  choice: എന്റെ യുവവേലക്കാരോടൊപ്പം
  rationale: נְעָרִים വ്യാകരണപരമായി പുല്ലിംഗ ബഹുവചനമാണ്; കൃഷിപ്പണിയുടെ സന്ദർഭത്തിൽ ‘യുവവേലക്കാർ’ അർത്ഥവും ലിംഗസൂചനയും നിലനിർത്തുന്നു. עִם നേരിട്ട് ‘ഒപ്പം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: תִּדְבָּקִין
  choice: ചേർന്നുനിൽക്കുക
  rationale: דבק എന്ന ക്രിയയുടെ അടുത്തു പറ്റിനിൽക്കുക/വിട്ടുപിരിയാതിരിക്കുക എന്ന ആശയം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: עַד אִם כִּלּוּ
  choice: തീർക്കുന്നതുവരെ
  rationale: പ്രവൃത്തിയുടെ അവസാനപരിധി സൂചിപ്പിക്കുന്ന ഹീബ്രു ഘടനയെ സംക്ഷിപ്തമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: אֵת כָּל הַקָּצִיר אֲשֶׁר לִי
  choice: എന്റെ വിളവെടുപ്പെല്ലാം
  rationale: മുഴുവൻ വിളവെടുപ്പും ബോവസിന്റേതാണെന്ന ഉടമസ്ഥതയും സമഗ്രതയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘യുവാക്കൾ’ ആണോ ‘യുവതികൾ’ ആണോ എന്ന സന്ദർഭപരമായ വ്യത്യാസം
  choice: യുവവേലക്കാർ
  alternative: യുവവേലക്കാരികൾ
  rationale: ഈ വാക്യത്തിലെ മസോററ്റിക് പാഠം הַנְּעָרִים എന്ന പുല്ലിംഗരൂപമാണ് ഉപയോഗിക്കുന്നത്. 2:8-ലെ ബോവസിന്റെ വാക്കുകളിൽ സ്ത്രീലിംഗരൂപം വന്നതിനാൽ ചില പരിഭാഷകൾ സന്ദർഭാനുസൃതമായി ‘യുവതികൾ’ എന്നു നൽകുന്നു; എന്നാൽ ഇവിടെ നൽകിയിരിക്കുന്ന WLC പാഠത്തിന്റെ യഥാർത്ഥ വ്യത്യാസം മുഖ്യവാചകത്തിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി സ്വീകരിച്ചു. ‘ചേർന്നുനിൽക്കുക’ എന്നത് അത്യന്തം പദാനുപദമായ ‘പറ്റിപ്പിടിക്കുക’ എന്നതിനെക്കാൾ ഈ തൊഴിൽസന്ദർഭത്തിൽ വ്യക്തമാണ്. മൂലപാഠത്തിലെ പുല്ലിംഗരൂപവും സമീപസന്ദർഭത്തിലെ സ്ത്രീലിംഗരൂപവുമായുള്ള യഥാർത്ഥ സംഘർഷം അടിക്കുറിപ്പിലൂടെ തുറന്നുവെച്ചു.
