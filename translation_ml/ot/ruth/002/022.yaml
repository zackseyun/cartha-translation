  text: Then Naomi said to Ruth her daughter-in-law[a], “It is good, my daughter, that you go out with his young women, so that they do not come upon you in another field.”
translation:
  language: ml
  text: 'അപ്പോൾ നൊവൊമി തന്റെ മരുമകളായ രൂത്തിനോടു പറഞ്ഞു: “മകളേ, നീ അവന്റെ യുവതികളോടൊപ്പം പോകുന്നതു നല്ലതാണ്; അങ്ങനെ മറ്റൊരു വയലിൽ ആരും നിന്നെ ഉപദ്രവിക്കാതിരിക്കും[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “മറ്റൊരു വയലിൽ ആരും നിന്നെ കണ്ടുമുട്ടാതിരിക്കും.” എബ്രായ ക്രിയയ്ക്ക് വെറുതെ കണ്ടുമുട്ടുക എന്ന അർത്ഥവും ശല്യപ്പെടുത്തുകയോ ആക്രമിക്കുകയോ ചെയ്യുന്ന ദോഷകരമായ നേരിടൽ എന്ന അർത്ഥവും വരാം. ഇവിടെ രൂത്തിന്റെ സുരക്ഷയെക്കുറിച്ചുള്ള നൊവൊമിയുടെ ആശങ്ക ദോഷകരമായ അർത്ഥത്തെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച കഥയിലെ അടുത്ത സംഭവത്തെ സൂചിപ്പിക്കുന്നു; ആഖ്യാനക്രമം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: כַּלָּתָהּ
  choice: തന്റെ മരുമകളായ
  rationale: മൂന്നാം പുരുഷ സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം ചേർന്ന പദം രൂത്തിനും നൊവൊമിക്കും ഇടയിലെ ബന്ധം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: טוֹב
  choice: നല്ലത്
  rationale: ഇത് നൊവൊമിയുടെ ലളിതമായ വിലയിരുത്തലാണ്; ‘ഏറ്റവും നല്ലത്’ എന്ന അതിശയോക്തി ചേർക്കുന്നില്ല.
- source_word: בִּתִּי
  choice: മകളേ
  rationale: ഇവിടെ ജൈവമാതൃത്വമല്ല, കുടുംബസ്നേഹവും അടുപ്പവും പ്രകടിപ്പിക്കുന്ന അഭിസംബോധനയാണ്.
- source_word: כִּי
  choice: '... പോകുന്നതാണ്'
  rationale: നല്ലതെന്ന് നൊവൊമി വിലയിരുത്തുന്നതിന്റെ ഉള്ളടക്കം മലയാളത്തിൽ സ്വാഭാവികമായ നാമവാക്യഘടനയിലൂടെ നൽകുന്നു.
- source_word: תֵצְאִי
  choice: വയലിലേക്കു പോകുക
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർത്ഥം ‘പുറപ്പെടുക/പോകുക’ എന്നാണ്. മലയാളത്തിൽ ലക്ഷ്യസന്ദർഭം വ്യക്തമാകാൻ ‘വയലിലേക്കു’ ചേർത്തിട്ടുണ്ടെങ്കിലും ‘കതിരുകൾ പെറുക്കുക’ എന്ന സന്ദർഭാർത്ഥം ക്രിയയിൽ ഇറക്കുമതി ചെയ്തിട്ടില്ല.
- source_word: נַעֲרוֹתָיו
  choice: അവന്റെ വേലക്കാരികൾ
  rationale: ബോവസിന്റെ വയലിൽ ജോലി ചെയ്യുന്ന യുവതികളെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്. ‘വേലക്കാരികൾ’ ആ സാമൂഹിക-തൊഴിൽബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; പ്രായം അനാവശ്യമായി മുൻനിറുത്തുന്നില്ല.
- source_word: וְלֹא יִפְגְּעוּ בָךְ
  choice: ആരും നിന്നെ ഉപദ്രവിക്കാതിരിക്കട്ടെ[a]
  rationale: פגע എന്ന ക്രിയയ്ക്ക് കണ്ടുമുട്ടുക, നേരിടുക, ദോഷകരമായി സമീപിക്കുക എന്നീ അർത്ഥങ്ങൾ വരാം. രൂത്തിന്റെ സുരക്ഷയെക്കുറിച്ചുള്ള ആശങ്കയുടെ പശ്ചാത്തലത്തിൽ നിഷേധാത്മക അർത്ഥം പ്രധാനപാഠത്തിൽ നൽകുന്നു; വിശാലമായ അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: בְּשָׂדֶה אַחֵר
  choice: മറ്റൊരു വയലിൽവെച്ച്
  rationale: സ്ഥലസൂചകമായ എബ്രായ പ്രയോഗത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. കുടുംബാഭിസംബോധനയായി ‘മകളേ’ നിലനിർത്തി. സുരക്ഷാഭീഷണിയുടെ സന്ദർഭാർത്ഥം വ്യക്തമാക്കിയെങ്കിലും ക്രിയയിലെ അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
