  source_fidelity: 'The three prohibitions/instructions are retained in order: do not glean in another field, do not leave this place, and remain closely with Boaz''s women. Rendering the rhetorical הֲלוֹא שָׁמַעַתְּ as “കേൾക്കൂ” is a defensible idiomatic attention-getter, consistent with the English audit trail. However, נַעֲרֹתַי identifies Boaz''s young women/female attendants and does not explicitly identify them as workers; “ജോലിക്കാരികൾ” narrows the expression unnecessarily.'
