id: RUT.2.8
reference: Ruth 2:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ בֹּ֨עַז אֶל ר֜וּת הֲ/ל֧וֹא שָׁמַ֣עַתְּ בִּתִּ֗/י אַל תֵּלְכִי֙ לִ/לְקֹט֙ בְּ/שָׂדֶ֣ה אַחֵ֔ר וְ/גַ֛ם לֹ֥א תַעֲבוּרִ֖י מִ/זֶּ֑ה וְ/כֹ֥ה תִדְבָּקִ֖י/ן עִם נַעֲרֹתָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/008.yaml
  text: 'Then Boaz said to Ruth, “Listen, my daughter: do not go to glean in another field, and also do not go away from here, but stay close with my young women.”'
translation:
  language: ml
  text: 'അപ്പോൾ ബോവസ് രൂത്തിനോടു പറഞ്ഞു: “മകളേ, കേൾക്കൂ. പെറുക്കാൻ മറ്റൊരു വയലിലേക്കു പോകരുത്; ഇവിടെനിന്നു മാറിപ്പോകുകയും അരുത്. എന്റെ യുവതികളോടൊപ്പംതന്നെ നിൽക്കുക.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלוֹא שָׁמַעַתְּ
  choice: കേൾക്കൂ
  rationale: അക്ഷരാർഥത്തിൽ ചോദ്യംപോലുള്ള ‘നീ കേട്ടില്ലേ?’ എന്ന പ്രയോഗം ഇവിടെ ശ്രദ്ധ ക്ഷണിക്കുന്ന അഭ്യർഥനയായി പ്രവർത്തിക്കുന്നു; സ്വാഭാവിക മലയാളത്തിൽ അതിന്റെ പ്രയോഗബലം ‘കേൾക്കൂ’ എന്നു നൽകി.
- source_word: לִלְקֹט
  choice: പെറുക്കാൻ
  rationale: വിളവെടുപ്പിനു ശേഷം ശേഷിച്ച കതിരുകൾ ശേഖരിക്കുന്ന പ്രവൃത്തിയാണ് സൂചിപ്പിക്കുന്നത്; സന്ദർഭത്തിൽ മലയാളത്തിലെ ‘പെറുക്കുക’ അതിനെ ലളിതമായി അറിയിക്കുന്നു.
- source_word: נַעֲרֹתַי
  choice: എന്റെ ജോലിക്കാരികൾ
  rationale: നַעֲרוֹת എന്നത് യുവതികളെയോ സ്ത്രീസേവകരെയോ സൂചിപ്പിക്കാം; വയലിലെ ജോലിസന്ദർഭത്തിൽ ‘ജോലിക്കാരികൾ’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: תִדְבָּקִין עִם
  choice: ഒപ്പംതന്നെ ചേർന്നുനിൽക്കുക
  rationale: דבק എന്ന ക്രിയയിലെ അടുത്തുനിൽക്കുക/പറ്റിനിൽക്കുക എന്ന ശക്തമായ ആശയവും עִם എന്ന ‘ഒപ്പം’ എന്ന ബന്ധവും നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സംഭാഷണശൈലി. ‘മകളേ’ എന്നത് പ്രായത്തെയും കരുതലോടെയുള്ള അഭിസംബോധനയെയും സൂചിപ്പിക്കുന്നു; ബന്ധുത്വം അവകാശപ്പെടുന്നില്ല. മൂലത്തിലെ നിർദേശങ്ങളുടെ ആവർത്തനവും ഊന്നലും നിലനിർത്തി.
