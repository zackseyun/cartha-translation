  terminology: “പെറുക്കാൻ” appropriately conveys gleaning in a concise Malayalam form. “എന്റെ യുവതികൾ” preserves the source term's broad reference better than “എന്റെ ജോലിക്കാരികൾ,” without forcing a social-status interpretation.
