id: RUT.2.2
reference: Ruth 2:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֹּאמֶר֩ ר֨וּת הַ/מּוֹאֲבִיָּ֜ה אֶֽל נָעֳמִ֗י אֵֽלְכָה נָּ֤א הַ/שָּׂדֶה֙ וַ/אֲלַקֳטָּ֣ה בַ/שִׁבֳּלִ֔ים אַחַ֕ר אֲשֶׁ֥ר אֶמְצָא חֵ֖ן בְּ/עֵינָ֑י/ו וַ/תֹּ֥אמֶר לָ֖/הּ לְכִ֥י בִתִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/002.yaml
  text: And Ruth the Moabite said to Naomi[a], “Please let me go to the field and glean among the ears of grain after him in whose eyes I find favor.” And she said to her, “Go[b], my daughter.”
translation:
  language: ml
  text: 'മോവാബ്യയായ രൂത്ത് നവോമിയോടു പറഞ്ഞു: “ദയവായി ഞാൻ വയലിലേക്കു പോയി, ആരുടെ പ്രീതി എനിക്കു ലഭിക്കുമോ അവന്റെ പിന്നാലെ കതിരുകൾക്കിടയിൽ പെറുക്കിക്കൊള്ളട്ടെ.” നവോമി അവളോടു പറഞ്ഞു: “പോകൂ, മകളേ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמּוֹאֲבִיָּה
  choice: മോവാബ്യസ്ത്രീയായ
  rationale: രൂത്തിന്റെ മോവാബ്യ വംശപരമായ തിരിച്ചറിയൽ ആഖ്യാനത്തിൽ നിലനിർത്തുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും നിന്ദാസൂചനയില്ലാത്തതുമായ പ്രയോഗം.
- source_word: אֵלְכָה נָּא
  choice: ദയവായി ഞാൻ … പോയി … പെറുക്കിക്കൊള്ളട്ടെ
  rationale: കോഹോർട്ടേറ്റീവും נָא-യും ചേർന്ന വിനീതമായ അനുമതിയാചനയെ മലയാളത്തിലെ ‘ദയവായി … -ട്ടെ’ എന്ന രൂപത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: הַשָּׂדֶה
  choice: വയലിലേക്ക്
  rationale: ധാന്യവിളവെടുപ്പ് നടക്കുന്ന കൃഷിസ്ഥലത്തെ ലളിതവും സന്ദർഭോചിതവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: וַאֲלַקֳטָּה
  choice: പെറുക്കിക്കൊള്ളട്ടെ
  rationale: വിളവെടുപ്പിനുശേഷം ശേഷിക്കുന്ന ധാന്യം പെറുക്കുന്ന പ്രവൃത്തിയെ സന്ദർഭത്തിൽ വ്യക്തമായി നൽകുന്നു; മലയാളത്തിൽ പ്രത്യേക സാങ്കേതികപദം നിർബന്ധിക്കാതെ അർഥം എത്തിക്കുന്നു.
- source_word: בַשִּׁבֳּלִים
  choice: ധാന്യക്കതിരുകൾ
  rationale: ഈ പദം കെട്ടിയ കറ്റകളെയല്ല, ധാന്യത്തിന്റെ കതിരുകളെയോ തലകളെയോ സൂചിപ്പിക്കുന്നു.
- source_word: אַחַר אֲשֶׁר אֶמְצָא חֵן בְּעֵינָיו
  choice: ആരുടെ ദൃഷ്ടിയിൽ എനിക്കു പ്രീതി ലഭിക്കുമോ, അവന്റെ പിന്നാലെ
  rationale: ‘കണ്ണുകളിൽ പ്രീതി കണ്ടെത്തുക’ എന്ന എബ്രായ ശൈലിയുടെ ആശയം നിലനിർത്തുകയും മൂന്നാംപുരുഷ ഏകവചന പുല്ലിംഗ പ്രത്യയം ‘അവന്റെ’ എന്നു വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: חֵן
  choice: പ്രീതി
  rationale: ഈ സാമൂഹിക സന്ദർഭത്തിലെ അനുകൂലമായ പരിഗണനയെയും സ്വീകാര്യതയെയും സൂചിപ്പിക്കുന്നു; അനാവശ്യമായ സിദ്ധാന്തപരമായ ഭാരം ഒഴിവാക്കുന്നു.
- source_word: לְכִי בִתִּי
  choice: പോകൂ, മകളേ
  rationale: ലളിതമായ കല്പനയും നൊവൊമിയുടെ വാത്സല്യപൂർവമായ അഭിസംബോധനയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ആരുടെ ദൃഷ്ടിയിൽ എനിക്കു പ്രീതി ലഭിക്കുമോ’ എന്ന പ്രയോഗം മൂലഭാഷയിലെ അനുകൂലപരിഗണനയുടെ ശൈലി സംരക്ഷിക്കുമ്പോഴും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാണ്. നൽകിയ ഇംഗ്ലീഷ് consultation layer-ലെ അടിക്കുറിപ്പ് അടയാളങ്ങളും അവയുടെ ഉള്ളടക്കവും തമ്മിൽ പൊരുത്തക്കേടുള്ളതിനാൽ, മൂലഭാഷയിൽ ഈ വാക്യത്തിന് അനിവാര്യമായ പ്രസിദ്ധീകരണ അടിക്കുറിപ്പ് ഒന്നും ചേർത്തിട്ടില്ല.
