  text: וַ֠/תֹּאמֶר אֶמְצָא חֵ֨ן בְּ/עֵינֶ֤י/ךָ אֲדֹנִ/י֙ כִּ֣י נִֽחַמְתָּ֔/נִי וְ/כִ֥י דִבַּ֖רְתָּ עַל לֵ֣ב שִׁפְחָתֶ֑/ךָ וְ/אָנֹכִי֙ לֹ֣א אֶֽהְיֶ֔ה כְּ/אַחַ֖ת שִׁפְחֹתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/013.yaml
  text: Then she said[a], “May I find favor in your eyes, my lord, because you have comforted me and because you have spoken to the heart of your servant, though I am not like one of your female servants.”
translation:
  language: ml
  text: 'അപ്പോൾ അവൾ പറഞ്ഞു: “യജമാനനേ, അങ്ങയുടെ ദൃഷ്ടിയിൽ എനിക്കു പ്രീതി ലഭിക്കട്ടെ. അങ്ങ് എന്നെ ആശ്വസിപ്പിക്കുകയും അങ്ങയുടെ ദാസിയുടെ ഹൃദയത്തോടു സംസാരിക്കുകയും ചെയ്തല്ലോ[a]—ഞാനാകട്ടെ, അങ്ങയുടെ ദാസിമാരിൽ ഒരാളെപ്പോലെയല്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “അങ്ങ് അങ്ങയുടെ ദാസിയോടു ദയാപൂർവം സംസാരിച്ചു.” എബ്രായയിൽ അക്ഷരാർഥം: “അങ്ങ് അങ്ങയുടെ ദാസിയുടെ ഹൃദയത്തോടു സംസാരിച്ചു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶמְצָא חֵן
  choice: എനിക്കു പ്രീതി ലഭിക്കട്ടെ
  rationale: ഒന്നാംപുരുഷ അപൂർണക്രിയ ഇവിടെ വെറും ഭാവികാലപ്രസ്താവനയല്ല, വിനയപൂർവമായ ആശംസയോ അഭ്യർഥനയോ ആണ്. ‘പ്രീതി ലഭിക്കുക’ എന്നത് കൃപാപൂർവമായ അംഗീകാരം നേടുന്നതിനെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: בְּעֵינֶיךָ
  choice: അങ്ങയുടെ ദൃഷ്ടിയിൽ
  rationale: എബ്രായയിലെ ‘കണ്ണുകളിൽ’ എന്ന മൂലചിത്രം മലയാളത്തിൽ സ്വാഭാവികമായ ‘ദൃഷ്ടിയിൽ’ എന്ന പ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: אֲדֹנִי
  choice: യജമാനനേ
  rationale: ഇവിടെ ബോവസിനോടുള്ള ആദരപൂർവമായ മാനുഷിക സംബോധനയാണ്; ദൈവിക ശീർഷകമല്ല. സാമൂഹിക വിനയം വ്യക്തമാക്കാൻ ‘യജമാനനേ’ അനുയോജ്യമാണ്.
- source_word: נִחַמְתָּנִי
  choice: അങ്ങ് എന്നെ ആശ്വസിപ്പിച്ചു
  rationale: രൂത്തിന്റെ അരക്ഷിതാവസ്ഥയിൽ ലഭിച്ച സാന്ത്വനവും ധൈര്യവും സൂചിപ്പിക്കുന്നതിനാൽ ‘ആശ്വസിപ്പിച്ചു’ സന്ദർഭോചിതമാണ്.
- source_word: דִבַּרְתָּ עַל־לֵב
  choice: അങ്ങയുടെ ദാസിയുടെ ഹൃദയത്തോടു സംസാരിച്ചു
  rationale: ‘ഹൃദയത്തോടു സംസാരിക്കുക’ എന്ന എബ്രായ രൂപകം മുഖ്യവാചകത്തിൽ നിലനിർത്തി; അതിന്റെ സ്വാഭാവിക അർഥമായ ദയാപൂർവമായ സംസാരിക്കൽ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: שִׁפְחָתֶךָ / שִׁפְחֹתֶיךָ
  choice: അങ്ങയുടെ ദാസി / അങ്ങയുടെ ദാസിമാർ
  rationale: പദം സ്ത്രീലിംഗത്തിലുള്ള ദാസിയെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നു. രൂത്തിന്റെ വിനയപൂർവമായ സ്വയംപരാമർശവും ബോവസിന്റെ വീട്ടിലെ സ്ത്രീദാസികളുമായുള്ള താരതമ്യവും ഒരേ പദമൂലത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: וְאָנֹכִי לֹא אֶהְיֶה כְּאַחַת
  choice: ഞാനാകട്ടെ, അങ്ങയുടെ ദാസിമാരിൽ ഒരാളെപ്പോലും അല്ല
  rationale: ബോവസിന്റെ ദയയും തന്റെ താഴ്ന്ന സാമൂഹികസ്ഥാനവും തമ്മിലുള്ള വൈരുധ്യം ‘ഞാനാകട്ടെ’ എന്നതിലൂടെ വ്യക്തമാക്കുന്നു; അവസ്ഥാസൂചന മലയാളത്തിൽ വർത്തമാനകാലത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
