translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്കു ഗ്രാഹ്യവുമായ മലയാളം ഉപയോഗിച്ചു. ‘അങ്ങ്’ എന്ന ആദരസൂചക സർവനാമവും ‘യജമാനനേ’ എന്ന സംബോധനയും രൂത്തിന്റെ വിനയം നിലനിർത്തുന്നു; എബ്രായയിലെ ഹൃദയരൂപകം മുഖ്യവാചകത്തിൽ സംരക്ഷിച്ച് അതിന്റെ സുതാര്യമായ അർഥം അടിക്കുറിപ്പിൽ നൽകി.
