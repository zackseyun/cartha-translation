  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: עֵינַ֜יִ/ךְ בַּ/שָּׂדֶ֤ה אֲשֶׁר יִקְצֹרוּ/ן֙ וְ/הָלַ֣כְתִּ אַחֲרֵי/הֶ֔ן הֲ/ל֥וֹא צִוִּ֛יתִי אֶת הַ/נְּעָרִ֖ים לְ/בִלְתִּ֣י נָגְעֵ֑/ךְ וְ/צָמִ֗ת וְ/הָלַכְתְּ֙ אֶל הַ/כֵּלִ֔ים וְ/שָׁתִ֕ית מֵ/אֲשֶׁ֥ר יִשְׁאֲב֖וּ/ן הַ/נְּעָרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/009.yaml
  text: Keep your eyes on the field where they are harvesting[a], and follow behind them. Have I not commanded the young men not to touch you? When you are thirsty, go to the jars and drink from what the young men have drawn.
translation:
  language: ml
  text: അവർ കൊയ്യുന്ന വയലിൽ ശ്രദ്ധവെക്കുക; സ്ത്രീകളുടെ പിന്നാലെ പോകുക. നിന്നെ തൊടരുതെന്ന്[a] ഞാൻ യുവാക്കളോടു കൽപിച്ചിട്ടില്ലേ? നിനക്കു ദാഹിക്കുമ്പോൾ പാത്രങ്ങളുടെ അടുക്കൽ ചെന്നു യുവാക്കൾ കോരിവെച്ച വെള്ളം കുടിച്ചുകൊള്ളുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, സന്ദർഭാനുസൃതമായി, “നിന്റെമേൽ കൈവെക്കരുതെന്ന്.” എബ്രായത്തിൽ അക്ഷരാർഥം “നിന്നെ തൊടരുതെന്ന്” എന്നാണ്; ഉപദ്രവിക്കുകയോ ആക്രമിക്കുകയോ ചെയ്യരുത് എന്ന ആശയവും ഇതിൽ ഉൾപ്പെട്ടേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינַיִךְ בַּשָּׂדֶה
  choice: വയലിൽത്തന്നെ നിന്റെ ശ്രദ്ധയിരിക്കട്ടെ
  rationale: ‘നിന്റെ കണ്ണുകൾ വയലിൽ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ നിർദേശാത്മക അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ‘-ത്തന്നെ’ ശ്രദ്ധ അതേ വയലിൽ കേന്ദ്രീകരിക്കണമെന്ന ഭാവം വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר יִקְצֹרוּן
  choice: അവർ കൊയ്യുന്ന
  rationale: നടന്നുകൊണ്ടിരിക്കുന്ന കൊയ്ത്തിനെ സൂചിപ്പിക്കുന്ന ആപേക്ഷിക വാക്യം സംക്ഷിപ്തമായും മൂലപദത്തോട് അടുത്തും നൽകുന്നു.
- source_word: וְהָלַכְתְּ אַחֲרֵיהֶן
  choice: അവരുടെ പിന്നാലെ പോകുക
  rationale: אַחֲרֵיהֶן എന്നതിലെ ‘പിന്നാലെ’ എന്ന സ്ഥലബന്ധം നിലനിർത്തുന്നു. എബ്രായത്തിലെ പ്രത്യയം സ്ത്രീലിംഗ ബഹുവചനമാണെങ്കിലും മലയാളത്തിലെ ‘അവർ’ ലിംഗം നിർബന്ധമായി അടയാളപ്പെടുത്തുന്നില്ല; പ്രസംഗസന്ദർഭമാണ് പരാമർശം വ്യക്തമാക്കുന്നത്.
- source_word: הֲלוֹא צִוִּיתִי
  choice: ഞാൻ ... കല്പിച്ചിട്ടില്ലേ?
  rationale: ബോവസിന്റെ അധികാരത്തെയും ആശ്വാസം നൽകുന്ന മൂലത്തിലെ വാചാടോപചോദ്യരൂപത്തെയും നിലനിർത്തുന്നു.
- source_word: הַנְּעָרִים
  choice: യുവാക്കൾ
  rationale: ഇവിടെ ബോവസിന്റെ പുരുഷ തൊഴിലാളികളെയാണ് സൂചിപ്പിക്കുന്നത്; മുൻപുള്ള സ്ത്രീലിംഗ ബഹുവചനപരാമർശത്തിൽനിന്നുള്ള വ്യത്യാസം സംരക്ഷിക്കുന്നു.
- source_word: לְבִלְתִּי נָגְעֵךְ
  choice: നിന്നെ തൊടരുതെന്ന്
  rationale: נגע എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥമായ ‘തൊടുക’ മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ ഉപദ്രവമോ ആക്രമണമോ ഉൾപ്പെടാവുന്ന ശക്തമായ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְצָמִת
  choice: നിനക്കു ദാഹിക്കുമ്പോൾ
  rationale: പ്രതീക്ഷിക്കാവുന്ന സാഹചര്യത്തെ സ്വാഭാവികമായ മലയാള കാലവാക്യമായി അവതരിപ്പിക്കുന്നു.
- source_word: הַכֵּלִים
  choice: പാത്രങ്ങൾ
  rationale: כְּלִי എന്ന വിശാലമായ ‘പാത്രം/സംഭരണി’ അർഥം അനാവശ്യമായി ഒരു പ്രത്യേക പാത്രരൂപത്തിലേക്ക് ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: וְשָׁתִית מֵאֲשֶׁר יִשְׁאֲבוּן הַנְּעָרִים
  choice: യുവാക്കൾ കോരിവെച്ച വെള്ളം കുടിച്ചുകൊള്ളുക
  rationale: ‘യുവാക്കൾ കോരിയതിൽനിന്ന് കുടിക്കുക’ എന്ന മൂലഘടനയുടെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; കുടിക്കുന്ന വസ്തു വെള്ളമാണെന്ന സന്ദർഭസൂചന വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ‘തൊടുക’ എന്നതിന്റെ സന്ദർഭാർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘തൊടരുത്’ നിലനിർത്തി, ഉപദ്രവമോ ആക്രമണമോ ഉൾപ്പെടാവുന്ന അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
  alternative: ‘നിന്റെമേൽ കൈവെക്കരുത്’ എന്ന് മുഖ്യപാഠത്തിൽ പരിഭാഷപ്പെടുത്തുക.
  rationale: മൂലത്തിലെ പദസുതാര്യതയും സ്ത്രീയുടെ സുരക്ഷയെ സംബന്ധിക്കുന്ന സന്ദർഭഗൗരവവും ഒരുപോലെ സംരക്ഷിക്കുന്നു; ഉപദ്രവത്തിന്റെ കൃത്യസ്വഭാവം പാഠം പറയുന്നതിലധികം നിർണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ബോവസിന്റെ നിർദേശവും ആശ്വാസം നൽകുന്ന വാചാടോപചോദ്യവും വ്യക്തമായി നിലനിർത്തി; എബ്രായത്തിലെ സ്ത്രീലിംഗ ബഹുവചന സൂചനയെ മലയാളത്തിൽ കൃത്രിമമായി വിപുലീകരിച്ചിട്ടില്ല.
