revisions:
- from: അവർ കൊയ്യുന്ന വയലിൽത്തന്നെ നിന്റെ ശ്രദ്ധയിരിക്കട്ടെ; അവരുടെ പിന്നാലെ പോകുക. നിന്നെ തൊടരുതെന്ന്[a] ഞാൻ യുവാക്കളോടു കല്പിച്ചിട്ടില്ലേ? നിനക്കു ദാഹിക്കുമ്പോൾ പാത്രങ്ങളുടെ അടുക്കൽ ചെന്നു യുവാക്കൾ കോരിവെച്ച വെള്ളം കുടിച്ചുകൊള്ളുക.
  to: അവർ കൊയ്യുന്ന വയലിൽ ശ്രദ്ധവെക്കുക; സ്ത്രീകളുടെ പിന്നാലെ പോകുക. നിന്നെ തൊടരുതെന്ന്[a] ഞാൻ യുവാക്കളോടു കൽപിച്ചിട്ടില്ലേ? നിനക്കു ദാഹിക്കുമ്പോൾ പാത്രങ്ങളുടെ അടുക്കൽ ചെന്നു യുവാക്കൾ കോരിവെച്ച വെള്ളം കുടിച്ചുകൊള്ളുക.
  rationale: മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘ത്തന്നെ’ എന്ന ഊന്നൽ ഒഴിവാക്കി. സ്ത്രീലിംഗ ബഹുവചനമായ אַחֲרֵיהֶן-ന്റെ സന്ദർഭപരമായ സൂചന ‘സ്ത്രീകളുടെ’ എന്നതിലൂടെ വ്യക്തമാക്കി; ഇതിലൂടെ അവരെ പുരുഷ തൊഴിലാളികളായ ‘യുവാക്കൾ’ എന്നതിൽനിന്ന് വേർതിരിച്ചിരിക്കുന്നു. മറ്റെല്ലാ ഘടകങ്ങളും മൂലത്തിനും സ്വാഭാവിക മലയാളപ്രയോഗത്തിനും യോജിക്കുന്നതിനാൽ നിലനിർത്തി.
