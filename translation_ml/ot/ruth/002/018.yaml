source:
  edition: WLC
  text: וַ/תִּשָּׂא֙ וַ/תָּב֣וֹא הָ/עִ֔יר וַ/תֵּ֥רֶא חֲמוֹתָ֖/הּ אֵ֣ת אֲשֶׁר לִקֵּ֑טָה וַ/תּוֹצֵא֙ וַ/תִּתֶּן לָ֔/הּ אֵ֥ת אֲשֶׁר הוֹתִ֖רָה מִ/שָּׂבְעָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/018.yaml
  text: She picked it up and went into the city[a], and her mother-in-law saw what she had gleaned. Then she brought out and gave her what she had left over after she was satisfied.
translation:
  language: ml
  text: അവൾ അതെടുത്ത് പട്ടണത്തിലേക്കു ചെന്നു. അവൾ പെറുക്കിയത് അമ്മായിയമ്മ കണ്ടു. പിന്നെ, താൻ തൃപ്തയായശേഷം അവൾ മിച്ചംവെച്ചത് പുറത്തെടുത്ത് അമ്മായിയമ്മയ്ക്കു കൊടുത്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വയറുനിറയെ ഭക്ഷിച്ചശേഷം.”
    reason: מִשָּׂבְעָהּ എന്ന പ്രയോഗം ഭക്ഷണം കഴിച്ചു തൃപ്തിയായ അവസ്ഥയെ കൂടുതൽ വ്യക്തമായി ഇങ്ങനെയും പരിഭാഷപ്പെടുത്താം.
lexical_decisions:
- source_word: וַתִּשָּׂא
  choice: അവൾ അതെടുത്തു
  rationale: נשׂא എന്ന ക്രിയയ്ക്ക് ‘എടുക്കുക/ചുമക്കുക’ എന്ന അർഥമുണ്ട്. പെറുക്കിയ ധാന്യം വീട്ടിലേക്കു കൊണ്ടുപോകാനായി റൂത്ത് എടുത്ത പ്രവൃത്തിയെ സന്ദർഭോചിതവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: הָעִיר
  choice: പട്ടണത്തിലേക്കു
  rationale: עִיר എന്നത് നഗരം അല്ലെങ്കിൽ പട്ടണം എന്നർഥം നൽകുന്നു. ബെത്‌ലഹേമിന്റെ ഈ കഥാസന്ദർഭത്തിൽ ‘പട്ടണം’ ആധുനിക മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികമാണ്; സ്ഥലത്തിന്റെ വലുപ്പത്തെ അനാവശ്യമായി പെരുപ്പിക്കുന്നില്ല.
- source_word: חֲמוֹתָהּ
  choice: അമ്മായിയമ്മ
  rationale: റൂത്തിന്റെ ഭർത്താവിന്റെ അമ്മയായ നൊവൊമിയെ സൂചിപ്പിക്കുന്ന ബന്ധപദത്തിന്റെ സാധാരണ മലയാളരൂപം.
- source_word: אֵת אֲשֶׁר לִקֵּטָה
  choice: അവൾ പെറുക്കിയിരുന്നത്
  rationale: לקט കൊയ്ത്തുകാരുടെ പിന്നാലെ ശേഷിച്ച കതിരുകൾ പെറുക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന മുഖ്യപദമാണ്. ‘പെറുക്കുക’ അതിന്റെ കൃഷിസംബന്ധമായ പ്രത്യേകത നിലനിർത്തുന്നു.
- source_word: וַתּוֹצֵא
  choice: അവൾ പുറത്തെടുത്തു
  rationale: ഹിഫീൽ രൂപത്തിലുള്ള יצא ഇവിടെ കൈവശം സൂക്ഷിച്ചിരുന്ന ഭക്ഷണം പുറത്തെടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: וַתִּתֶּן לָהּ
  choice: അമ്മായിയമ്മയ്ക്കു കൊടുത്തു
  rationale: לָהּ എന്ന പരോക്ഷ കർമം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു. സർവനാമങ്ങളുടെ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ഉദ്ദേശിക്കപ്പെട്ട വ്യക്തിയെ ബന്ധപദംകൊണ്ട് വ്യക്തമാക്കിയിരിക്കുന്നു.
- source_word: אֵת אֲשֶׁר הוֹתִרָה
  choice: മിച്ചംവെച്ചത്
  rationale: יתר എന്ന മൂലത്തിന്റെ ഹിഫീൽ രൂപം ശേഷിപ്പിക്കുക, മിച്ചംവെക്കുക എന്നർഥം നൽകുന്നു. റൂത്ത് തന്റെ ഭക്ഷണത്തിൽനിന്നു നൊവൊമിക്കായി സൂക്ഷിച്ച ഭാഗമാണ് സന്ദർഭം.
- source_word: מִשָּׂבְעָהּ
  choice: താൻ തൃപ്തയായശേഷം
  rationale: שׂבע പൂർണതൃപ്തി അല്ലെങ്കിൽ വയറുനിറവ് സൂചിപ്പിക്കുന്നു; מִן ഇവിടെ ആ അവസ്ഥയ്ക്കുശേഷമുള്ള ശേഷിപ്പിനെയാണ് കാണിക്കുന്നത്. ‘തൃപ്തയായശേഷം’ മൂലത്തിലെ സംക്ഷിപ്തതയും അർഥവും നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഹീബ്രുവിലെ തുടർച്ചയായ ക്രിയാക്രമം സ്വാഭാവികമായ മലയാളവാക്യങ്ങളാക്കി; റൂത്തിനെയും നൊവൊമിയെയും സൂചിപ്പിക്കുന്ന സർവനാമങ്ങളിൽ ആശയക്കുഴപ്പം വരാതിരിക്കാൻ അവസാന ഘട്ടത്തിൽ ‘അമ്മായിയമ്മയ്ക്കു’ എന്നു വ്യക്തമാക്കി.
