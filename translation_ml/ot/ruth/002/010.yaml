id: RUT.2.10
reference: Ruth 2:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תִּפֹּל֙ עַל פָּנֶ֔י/הָ וַ/תִּשְׁתַּ֖חוּ אָ֑רְצָ/ה וַ/תֹּ֣אמֶר אֵלָ֗י/ו מַדּוּעַ֩ מָצָ֨אתִי חֵ֤ן בְּ/עֵינֶ֨י/ךָ֙ לְ/הַכִּירֵ֔/נִי וְ/אָּנֹכִ֖י נָכְרִיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/010.yaml
  text: Then she fell on her face and bowed to the ground and said to him[a], “Why have I found favor in your eyes, that you should take notice of me, though I am a foreign woman?”
translation:
  language: ml
  text: 'അപ്പോൾ അവൾ കമിഴ്ന്നുവീണ് നിലംതൊട്ട് കുനിഞ്ഞു. അവൾ അവനോടു പറഞ്ഞു: “ഞാൻ ഒരു വിദേശസ്ത്രീയായിരിക്കെ, അങ്ങ് എന്നെ ശ്രദ്ധിക്കുന്നതിനു തക്കവണ്ണം അങ്ങയുടെ ദൃഷ്ടിയിൽ എനിക്കു പ്രീതി ലഭിച്ചത് എന്തുകൊണ്ടാണ്?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “എന്നെ ശ്രദ്ധിക്കുന്നതിനു” എന്നതിന് “എന്നെ പരിഗണിക്കുന്നതിനു,” “എന്നെ അംഗീകരിക്കുന്നതിനു,” അല്ലെങ്കിൽ “എന്നെ തിരിച്ചറിയുന്നതിനും” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: לְהַכִּירֵנִי എന്ന ഹിഫീൽ രൂപത്തിന്റെ സന്ദർഭാനുസൃതമായ അർഥസാധ്യതകൾ സൂചിപ്പിക്കുന്നു.
lexical_decisions:
- source_word: וַתִּפֹּל עַל־פָּנֶיהָ
  choice: അവൾ കമിഴ്ന്നുവീണ്
  rationale: മുഖം നിലത്താകുന്ന വിധത്തിൽ വീഴുന്ന എബ്രായ പ്രയോഗത്തിന്റെ വിനയസൂചകമായ ശരീരഭാവം സ്വാഭാവിക മലയാളത്തിൽ സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
- source_word: וַתִּשְׁתַּחוּ אָרְצָה
  choice: നിലംവരെ കുനിഞ്ഞ് അവനെ നമസ്കരിച്ചു
  rationale: നിലത്തോളം കുനിഞ്ഞുള്ള ആദരവിന്റെ പ്രവൃത്തി വ്യക്തമാക്കുന്നു; ഈ മാനുഷിക സാമൂഹിക സാഹചര്യത്തിൽ ദൈവാരാധന എന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: അങ്ങയുടെ ദൃഷ്ടിയിൽ എനിക്ക് പ്രീതി ലഭിച്ചത്
  rationale: ‘കണ്ണുകളിൽ പ്രീതി കണ്ടെത്തുക’ എന്ന എബ്രായ ശൈലിയുടെ ദൃശ്യഭാവം നിലനിർത്തിക്കൊണ്ട് മാന്യവും ഗ്രഹിക്കാവുന്നതുമായ മലയാളം നൽകുന്നു.
- source_word: לְהַכִּירֵנִי
  choice: അങ്ങ് എന്നെ പരിഗണിക്കാൻ
  rationale: ഹിഫീൽ രൂപത്തിന് ഇവിടെ ‘ശ്രദ്ധിക്കുക, അംഗീകരിക്കുക, പരിഗണിക്കുക’ എന്നീ അർഥസാധ്യതകളുണ്ട്. ബോവസ് റൂത്തിനോട് അനുകൂല ശ്രദ്ധ കാണിച്ചതാണ് സന്ദർഭം; ‘പരിഗണിക്കുക’ അത് സ്വാഭാവികമായി പകരുന്നു.
- source_word: וְאָנֹכִי נָכְרִיָּה
  choice: ഞാൻ ഒരു വിദേശസ്ത്രീയായിട്ടും
  rationale: וְ എന്ന ബന്ധകത്തിന്റെ സന്ദർഭജന്യമായ concessive വൈരുധ്യം ‘ആയിട്ടും’ എന്നു നൽകുന്നു; നָכְרִיָּהയുടെ സ്ത്രീലിംഗവും വിദേശസ്ഥിതിയും വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: וַתִּשְׁתַּחוּ എന്ന പദത്തിന്റെ ആരാധനാസംബന്ധിയായ സാധ്യത
  choice: ബോവസിനോടുള്ള ആഴമായ ആദരവിന്റെ നമസ്കാരമായി വിവർത്തനം ചെയ്തു
  alternative: ദൈവാരാധനയെ സൂചിപ്പിക്കുന്ന ‘ആരാധിച്ചു’ എന്ന വിവർത്തനം
  rationale: കഥാസന്ദർഭത്തിൽ റൂത്ത് ബോവസിനോട് സാമൂഹികമായ ആദരവും വിനയവും പ്രകടിപ്പിക്കുകയാണ്; ദൈവാരാധനയെന്ന അവകാശവാദം മൂലപാഠം ഇവിടെ ഉന്നയിക്കുന്നില്ല.
- issue: וְאָנֹכִיയിലെ ബന്ധത്തിന്റെ സ്വഭാവം
  choice: വൈരുധ്യം വ്യക്തമാക്കുന്ന ‘ആയിട്ടും’
  alternative: അക്ഷരാർഥത്തിൽ ‘ഞാൻ ഒരു വിദേശസ്ത്രീയാണ്’ എന്നു സമുച്ചയമായി നൽകുക
  rationale: താൻ വിദേശസ്ത്രീയായിരിക്കെ ബോവസ് തന്നെ പരിഗണിച്ചതിലുള്ള റൂത്തിന്റെ അതിശയം സന്ദർഭം വ്യക്തമാക്കുന്നു; എങ്കിലും വ്യാകരണപരമായ അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. റൂത്ത് ബോവസിനെ അഭിസംബോധന ചെയ്യുന്നതിനാൽ ആദരസൂചകമായ ‘അങ്ങ്/അങ്ങയുടെ’ ഉപയോഗിച്ചു. ശരീരഭാവത്തിന്റെ തീവ്രതയും വിദേശസ്ത്രീ എന്ന സാമൂഹിക തിരിച്ചറിയലും നിലനിർത്തി.
