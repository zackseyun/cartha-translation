translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. കാർഷികസന്ദർഭത്തിലെ പ്രത്യേക അർഥം നിലനിർത്താൻ ‘കാലാപെറുക്കി’, ‘മെതിച്ചു’ എന്നീ നാട്ടുവഴക്കമുള്ള പദങ്ങൾ ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം അതു വിശദീകരിക്കുന്ന ‘ഏഫാ’യ്ക്കു പിന്നാലെ ചേർത്തു.
