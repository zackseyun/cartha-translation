id: RUT.2.17
reference: Ruth 2:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תְּלַקֵּ֥ט בַּ/שָּׂדֶ֖ה עַד הָ/עָ֑רֶב וַ/תַּחְבֹּט֙ אֵ֣ת אֲשֶׁר לִקֵּ֔טָה וַ/יְהִ֖י כְּ/אֵיפָ֥ה שְׂעֹרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/017.yaml
  text: So she gleaned in the field until evening[a], and beat out what she had gleaned, and it was about an ephah of barley.
translation:
  language: ml
  text: അങ്ങനെ അവൾ വൈകുന്നേരം വരെ വയലിൽ കതിർ പെറുക്കി. അവൾ പെറുക്കിയെടുത്തത് മെതിച്ചു; അപ്പോൾ ഏകദേശം ഒരു ഏഫാ[a] യവം ലഭിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഏഫാ ധാന്യങ്ങൾ പോലുള്ള ഉണങ്ങിയ വസ്തുക്കൾ അളക്കുന്നതിനുള്ള പുരാതന അളവായിരുന്നു; ഏകദേശം 20–22 ലിറ്റർ.
    reason: cultural_note
lexical_decisions:
- source_word: וַתְּלַקֵּט
  choice: അങ്ങനെ അവൾ ... കാലാപെറുക്കി
  rationale: לקט കൊയ്ത്തുകാർക്കു പിന്നാലെ ശേഷിച്ച കതിരുകൾ പെറുക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘കാലാപെറുക്കി’ ഈ പ്രത്യേക കാർഷിക അർഥം സ്വാഭാവികമായി നിലനിർത്തുന്നു; വാവ് തുടർച്ചയെ സന്ദർഭാനുസൃതമായി ‘അങ്ങനെ’ എന്നു നൽകി.
- source_word: בַּשָּׂדֶה
  choice: വയലിൽ
  rationale: שׂדה ഇവിടെ രൂത്ത് ജോലി ചെയ്തിരുന്ന നിർദിഷ്ട വയലിനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘വയലിൽ’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: עַד הָעָרֶב
  choice: വൈകുന്നേരംവരെ
  rationale: അവളുടെ അധ്വാനത്തിന്റെ സമയപരിധി നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: וַתַּחְבֹּט
  choice: മെതിച്ചപ്പോൾ
  rationale: חבט ഇവിടെ പെറുക്കിയ കതിരുകളിൽനിന്ന് ധാന്യം വേർതിരിക്കുന്ന പ്രവൃത്തിയാണ്. ‘മെതിക്കുക’ മലയാളത്തിലെ സ്വാഭാവിക കാർഷികപദമാണ്.
- source_word: אֵת אֲשֶׁר לִקֵּטָה
  choice: താൻ പെറുക്കിയെടുത്തത്
  rationale: അവൾ കാലാപെറുക്കിലൂടെ ശേഖരിച്ച കതിരുകളെ സൂചിപ്പിക്കുന്നു; ആവർത്തനത്തിലെ ഭാരമൊഴിവാക്കി അർഥം നിലനിർത്തുന്നു.
- source_word: וַיְהִי
  choice: ഉണ്ടായിരുന്നു
  rationale: മെതിച്ചതിനുശേഷം ലഭിച്ച അളവ് അറിയിക്കുന്ന ഫലസൂചക പ്രയോഗമായി സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
- source_word: כְּאֵיפָה
  choice: ഏകദേശം ഒരു ഏഫാ
  rationale: כְּ ഏകദേശ അളവിനെ സൂചിപ്പിക്കുന്നു. ചരിത്രപരമായ അളവായ אֵיפָה ‘ഏഫാ’ എന്നു ലിപ്യന്തരിച്ചു; ആധുനിക തുല്യവിവരം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: שְׂעֹרִים
  choice: യവം
  rationale: שְׂעֹרִים barley എന്ന ധാന്യമാണ്; അതിന്റെ സാധാരണ മലയാളപദം ‘യവം’ ആണ്.
