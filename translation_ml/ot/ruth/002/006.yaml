source:
  edition: WLC
  text: וַ/יַּ֗עַן הַ/נַּ֛עַר הַ/נִּצָּ֥ב עַל הַ/קּוֹצְרִ֖ים וַ/יֹּאמַ֑ר נַעֲרָ֤ה מֽוֹאֲבִיָּה֙ הִ֔יא הַ/שָּׁ֥בָה עִֽם נָעֳמִ֖י מִ/שְּׂדֵ֥ה מוֹאָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/006.yaml
  text: Then the young man who was set over the reapers answered and said[a], “She is a young Moabite woman who returned with Naomi from the fields of Moab.”
translation:
  language: ml
  text: 'അപ്പോൾ കൊയ്ത്തുകാരുടെ ചുമതല വഹിച്ചിരുന്ന യുവാവ് മറുപടിയായി പറഞ്ഞു: “നൊവൊമിയോടൊപ്പം മോവാബിലെ വയലുകളിൽനിന്ന്[a] മടങ്ങിവന്ന മോവാബ്യ യുവതിയാണിവൾ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “മോവാബിന്റെ വയലിൽനിന്ന്”; എബ്രായത്തിലെ ഏകവചനപദം മോവാബിലെ കൃഷിപ്രദേശത്തെ കൂട്ടായ അർഥത്തിൽ സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: ഉത്തരം പറഞ്ഞു
  rationale: എബ്രായത്തിലെ ‘ഉത്തരം നൽകി, പറഞ്ഞു’ എന്ന ഇരട്ട ആഖ്യാനപ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘ഉത്തരം പറഞ്ഞു’ എന്നു സംക്ഷിപ്തമായി നൽകി.
- source_word: הַנַּעַר
  choice: യുവാവ്
  rationale: നַעַר എന്നത് യുവാവിനെയോ സേവകനെയോ സൂചിപ്പിക്കാം; മേൽനോട്ടച്ചുമതല തുടർന്നുള്ള വിശേഷണം വ്യക്തമാക്കുന്നതിനാൽ പദത്തിന്റെ അടിസ്ഥാന അർഥമായ ‘യുവാവ്’ നിലനിർത്തി.
- source_word: הַנִּצָּב עַל הַקּוֹצְרִים
  choice: കൊയ്ത്തുകാരുടെ മേൽ നിയോഗിക്കപ്പെട്ടിരുന്ന
  rationale: נצב എന്നതിലെ നിർത്തപ്പെട്ട/നിയോഗിക്കപ്പെട്ട നിലയും עַל സൂചിപ്പിക്കുന്ന മേൽനോട്ടബന്ധവും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു; ‘മേൽവിചാരകൻ’ പോലൊരു സ്ഥാനപ്പേര് മൂലത്തിൽ ഇല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല.
- source_word: הַקּוֹצְרִים
  choice: കൊയ്ത്തുകാർ
  rationale: ധാന്യം കൊയ്യുന്നവരെ സൂചിപ്പിക്കുന്ന പങ്കാളിത്തനാമത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: נַעֲרָה מוֹאֲבִיָּה
  choice: മോവാബ്യ യുവതി
  rationale: נַעֲרָהയെ പ്രായപൂർത്തിയാകാത്ത കുട്ടിയെന്നു തെറ്റിദ്ധരിപ്പിക്കാതെ ‘യുവതി’ എന്നും ജനവിഭാഗ/ദേശീയ ഉത്ഭവം സൂചിപ്പിക്കുന്ന מוֹאֲבִיָּהയെ ‘മോവാബ്യ’ എന്നും നൽകി.
- source_word: הִיא
  choice: ഇവൾ
  rationale: തിരിച്ചറിയിക്കൽ പ്രസ്താവനയായ ‘അവൾ/ഇവൾ ആകുന്നു’ എന്ന ആശയം സംഭാഷണസന്ദർഭത്തിൽ സ്വാഭാവികമായി ‘ഇവൾ’ എന്നു നൽകി.
- source_word: הַשָּׁבָה
  choice: മടങ്ങിവന്ന
  rationale: שׁוב എന്ന ക്രിയയുടെ ‘തിരികെ വരുക’ എന്ന അർഥവും രൂത്തിന്റെ കഥയിലെ മടങ്ങിവരവ് എന്ന പ്രമേയവും നിലനിർത്തുന്നു.
- source_word: עִם נָעֳמִי
  choice: നൊവൊമിയോടൊപ്പം
  rationale: ലളിതമായ സഹഗമനബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: מִשְּׂדֵה מוֹאָב
  choice: മോവാബ് ദേശത്തുനിന്ന്
  rationale: שְׂדֵה എന്ന ഏകവചന രൂപം ഇവിടെ മോവാബിന്റെ വയൽപ്രദേശം/നാട്ടിൻപ്രദേശം എന്ന കൂട്ടായ പ്രാദേശിക അർഥത്തിൽ ഗ്രഹിക്കാം; മലയാളത്തിൽ ‘ദേശം’ സന്ദർഭാർത്ഥം വ്യക്തമായി നൽകുന്നു, അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
