- from: 'അപ്പോൾ കൊയ്ത്തുകാരുടെ മേൽ നിയോഗിക്കപ്പെട്ടിരുന്ന യുവാവ് ഉത്തരം പറഞ്ഞു: “മോവാബ് ദേശത്തുനിന്ന് നൊവൊമിയോടൊപ്പം മടങ്ങിവന്ന മോവാബ്യ യുവതിയാണിവൾ.[a]”'
  to: 'അപ്പോൾ കൊയ്ത്തുകാരുടെ ചുമതല വഹിച്ചിരുന്ന യുവാവ് മറുപടിയായി പറഞ്ഞു: “നൊവൊമിയോടൊപ്പം മോവാബിലെ വയലുകളിൽനിന്ന്[a] മടങ്ങിവന്ന മോവാബ്യ യുവതിയാണിവൾ.”'
