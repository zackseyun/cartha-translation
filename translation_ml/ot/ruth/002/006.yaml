translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘മേൽ നിയോഗിക്കപ്പെട്ടിരുന്ന’ എന്ന പ്രയോഗം യുവാവിന്റെ ഔദ്യോഗിക മേൽനോട്ടസ്ഥാനം സൂചിപ്പിക്കുമ്പോഴും മൂലപദത്തിലെ നില/നിയോഗ ഭാവം നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വാക്യത്തിന്റെ അവസാനം മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
