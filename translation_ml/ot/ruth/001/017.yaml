    issue: The divine name is rendered “യഹോവ.”
    rationale: “യഹോവ” represents Jehovah, whereas the project decision for יְהוָה is Yahweh. “യാഹ്‌വെ” better follows that decision in Malayalam transliteration.
  - severity: medium
    issue: “എന്നെയും അടക്കം ചെയ്യും” is active in form.
    rationale: אָסמוּת? The Hebrew אֶקָּבֵר is Niphal, “I will be buried.” Malayalam should retain this passive sense.
  - severity: low
    issue: The oath condition precedes the oath formula in the draft.
    rationale: This does not substantially alter meaning, but restoring the Hebrew sequence better serves optimal equivalence and makes the oath’s conditional force clearer.
