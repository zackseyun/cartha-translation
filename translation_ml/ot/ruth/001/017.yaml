source:
  edition: WLC
  text: בַּ/אֲשֶׁ֤ר תָּמ֨וּתִי֙ אָמ֔וּת וְ/שָׁ֖ם אֶקָּבֵ֑ר כֹּה֩ יַעֲשֶׂ֨ה יְהוָ֥ה לִ/י֙ וְ/כֹ֣ה יֹסִ֔יף כִּ֣י הַ/מָּ֔וֶת יַפְרִ֖יד בֵּינִ֥/י וּ/בֵינֵֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/017.yaml
  text: Where you die[a], I will die, and there I will be buried. May Yahweh do so to me, and more also[b], if anything but death separates me from you.
translation:
  language: ml
  text: നീ മരിക്കുന്നിടത്ത് ഞാനും മരിക്കും; അവിടെ ഞാൻ അടക്കം ചെയ്യപ്പെടും. യാഹ്‌വെ എന്നോടു ഇങ്ങനെയും അതിലധികവും ചെയ്യട്ടെ.[a] മരണമല്ലാതെ മറ്റൊന്നും നമ്മെ വേർപെടുത്തിയാൽ അങ്ങനെയാകട്ടെ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'പദാനുപദമായി: “യാഹ്‌വെ എന്നോടു ഇങ്ങനെ ചെയ്യട്ടെ; ഇനിയും ഇങ്ങനെ കൂട്ടിച്ചേർക്കട്ടെ.” ദൈവിക ശിക്ഷ സ്വയം ക്ഷണിക്കുന്ന ഒരു എബ്രായ ശപഥസൂത്രമാണിത്; ശിക്ഷയുടെ സ്വഭാവം വ്യക്തമാക്കുന്നില്ല.'
    reason: lexical_alternative
  - marker: b
    text: 'പദാനുപദമായി, അവസാന വാക്കുകൾ: “മരണം എന്നെയും നിന്നെയും വേർപെടുത്തും.” ശപഥസന്ദർഭത്തിൽ ഇതിന്റെ അർഥം, മരണത്തിനു പുറമെ മറ്റൊന്നും അവരെ വേർപെടുത്തിയാൽ ശപഥം ബാധകമാകട്ടെ എന്നതാണ്.'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּאֲשֶׁר
  choice: നീ മരിക്കുന്നിടത്ത്
  rationale: בְּ + אֲשֶׁר സ്ഥലത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘മരിക്കുന്നിടത്ത്’ എന്നത് ‘in the place where’ എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: תָּמוּתִי אָמוּת
  choice: നീ മരിക്കുന്നിടത്ത് ഞാനും മരിക്കും
  rationale: מות എന്ന ക്രിയയുടെ ആവർത്തനം രൂത്തിന്റെ ഗൗരവമുള്ള പ്രതിജ്ഞയിലെ സമാന്തരത നിലനിർത്തുന്നു; ‘ഞാനും’ അവളുടെ പങ്കുചേരാനുള്ള ഉറച്ച തീരുമാനം വ്യക്തമാക്കുന്നു.
- source_word: וְשָׁם אֶקָּבֵר
  choice: അവിടെത്തന്നെ എന്നെയും അടക്കം ചെയ്യും
  rationale: Niphal രൂപമായ אֶקָּבֵר നിഷ്ക്രിയാർഥത്തിൽ ‘അടക്കം ചെയ്യപ്പെടും’ എന്നാണ്; ആധുനിക മലയാളത്തിൽ ‘എന്നെയും അടക്കം ചെയ്യും’ കൂടുതൽ സ്വാഭാവികമാണ്. ‘അവിടെത്തന്നെ’ മുൻപറഞ്ഞ സ്ഥലത്തോടുള്ള ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: כֹּה יַעֲשֶׂה יְהוָה לִי וְכֹה יֹסִיף
  choice: യഹോവ എന്നോട് ഇതും ഇതിനപ്പുറവും ചെയ്യട്ടെ
  rationale: ദൈവിക ശിക്ഷ സ്വയം ക്ഷണിക്കുന്ന പരമ്പരാഗത എബ്രായ ശപഥസൂത്രത്തിന്റെ ഗൗരവം നിലനിർത്തിക്കൊണ്ട്, അതിന്റെ നിർവചിക്കാത്ത ശിക്ഷാഭാവം മലയാളത്തിൽ കൃത്രിമമായി വിശദീകരിക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപമായ ‘യഹോവ’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: כִּי הַמָּוֶת יַפְרִיד בֵּינִי וּבֵינֵךְ
  choice: മരണമല്ലാതെ മറ്റെന്തെങ്കിലും എന്നെയും നിന്നെയും വേർപെടുത്തിയാൽ
  rationale: ശപഥസന്ദർഭത്തിൽ വാക്യത്തിന്റെ ഉദ്ദേശ്യം മരണം മാത്രം അനുവദനീയമായ വേർപാടാണെന്നതാണ്. ‘മറ്റെന്തെങ്കിലും’ വ്യാകരണത്തിൽ അന്തർലീനമായ ആശയം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; കൂടുതൽ പദാനുപദമായ രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു ബിരുദമായ ‘കർത്താവ്’ എന്നു പകരാതെ നാമരൂപത്തിൽ നിലനിർത്തി.
- issue: രൂത്തിന്റെ ശപഥത്തിലെ അവസാന വ്യവസ്ഥയുടെ വ്യാപ്തി
  choice: മരണമല്ലാതെ മറ്റെന്തെങ്കിലും നമ്മെ വേർപെടുത്തിയാൽ എന്ന അർഥം
  alternative: മരണം നമ്മെ വേർപെടുത്തും/വേർപെടുത്തിയാൽ എന്ന കൂടുതൽ പദാനുപദ വായന
  rationale: ശപഥസൂത്രത്തിന്റെ സന്ദർഭാർഥം, മരണത്തിനു മുമ്പുള്ള മറ്റൊരു കാരണവും തങ്ങളെ വേർപെടുത്തരുത് എന്നതാണ്. എന്നാൽ כִּי എന്നതിന്റെയും പ്രസ്താവനയുടെ ചുരുക്കരൂപത്തിന്റെയും യഥാർഥ ഭാഷാപരമായ മുറുക്ക് അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രതിജ്ഞാഭാഷ ഉപയോഗിച്ചു. ‘അടക്കം ചെയ്യും’, ‘വേർപെടുത്തിയാൽ’ തുടങ്ങിയ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പദങ്ങൾ തെരഞ്ഞെടുത്തു; എബ്രായ ശപഥസൂത്രത്തിന്റെ അപൂർണവും സൂചനാപരവുമായ സ്വഭാവം അമിതമായി വ്യാഖ്യാനിക്കാതെ അടിക്കുറിപ്പിലൂടെ നിലനിർത്തി.
