id: RUT.1.11
reference: Ruth 1:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר נָעֳמִי֙ שֹׁ֣בְנָה בְנֹתַ֔/י לָ֥/מָּה תֵלַ֖כְנָה עִמִּ֑/י הַֽ/עֽוֹד לִ֤/י בָנִים֙ בְּֽ/מֵעַ֔/י וְ/הָי֥וּ לָ/כֶ֖ם לַ/אֲנָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/011.yaml
  text: But Naomi said[a], “Turn back, my daughters. Why would you go with me? Do I still have sons in my womb, that they may become husbands for you?”
translation:
  language: ml
  text: 'എന്നാൽ നൊവൊമി പറഞ്ഞു[a]: “എന്റെ പെൺമക്കളേ, മടങ്ങിപ്പോകൂ. നിങ്ങൾ എന്തിന് എന്നോടൊപ്പം വരണം? നിങ്ങൾക്കു ഭർത്താക്കന്മാരാകാൻ എന്റെ ഗർഭത്തിൽ എനിക്ക് ഇനിയും പുത്രന്മാരുണ്ടോ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥം, “എന്റെ പുത്രിമാരേ.” നൊവൊമി തന്റെ മരുമക്കളെ കുടുംബസ്നേഹത്തോടെ അഭിസംബോധന ചെയ്യുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: എന്നാൽ നൊവൊമി പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; മുൻവാക്യത്തിലെ മരുമക്കളുടെ തീരുമാനത്തോടുള്ള നൊവൊമിയുടെ എതിർപ്രതികരണം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘എന്നാൽ’ ഉപയോഗിച്ചു.
- source_word: שֹׁבְנָה
  choice: മടങ്ങിപ്പോകുവിൻ
  rationale: שוב എന്ന ക്രിയയുടെ തിരിച്ചുപോകുക എന്ന ദിശാസൂചനയും സ്ത്രീലിംഗ ബഹുവചന ആജ്ഞയുടെ ഭാവവും നിലനിർത്തുന്നു.
- source_word: בְנֹתַי
  choice: എന്റെ മക്കളേ
  rationale: അക്ഷരാർഥം ‘എന്റെ പുത്രിമാരേ’ എന്നാണ്; ഇവിടെ മരുമക്കളോടുള്ള കുടുംബസ്നേഹപൂർവമായ അഭിസംബോധനയാണ്. സാധാരണ മലയാളത്തിൽ ‘എന്റെ മക്കളേ’ ആ സ്നേഹവും സ്വാഭാവികതയും നൽകുന്നു.
- source_word: לָמָּה תֵלַכְנָה עִמִּי
  choice: നിങ്ങൾ എന്തിന് എന്നോടൊപ്പം വരണം?
  rationale: ഇംപെർഫെക്റ്റ് രൂപം ഇവിടെ വെറും ഭാവികാലമല്ല, നൊവൊമിയുടെ ആലങ്കാരികമായ നിരുത്സാഹപ്പെടുത്തൽ പ്രകടിപ്പിക്കുന്നു; ‘വരണം’ ആ ഭാവം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: הַעוֹד לִי
  choice: ഇനിയും ... ഉണ്ടോ?
  rationale: עוד തുടർന്നുള്ള അസ്തിത്വമോ കൈവശമോ ചോദിക്കുന്നു; മലയാളത്തിൽ ‘ഇനിയും ... ഉണ്ടോ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: בָנִים
  choice: പുത്രന്മാർ
  rationale: എബ്രായപദം വ്യക്തമായി ആൺമക്കളെ സൂചിപ്പിക്കുന്നു; വിവാഹബന്ധത്തെക്കുറിച്ചുള്ള വാക്യത്തിന്റെ യുക്തിക്ക് ഇത് നിർണായകമാണ്.
- source_word: בְּמֵעַי
  choice: എന്റെ ഗർഭത്തിൽ
  rationale: מֵעֶה ആന്തരാവയവങ്ങളെയോ ഉദരത്തെയോ സൂചിപ്പിക്കാമെങ്കിലും, പ്രസവസാധ്യതയുടെ ഈ സന്ദർഭത്തിൽ ‘ഗർഭം’ ആണ് ഉദ്ദേശ്യം ഏറ്റവും വ്യക്തമായി നൽകുന്നത്.
- source_word: וְהָיוּ לָכֶם לַאֲנָשִׁים
  choice: നിങ്ങൾക്കു ഭർത്താക്കന്മാരായിത്തീരാൻ
  rationale: അക്ഷരാർഥത്തിലെ ‘നിങ്ങൾക്കു ഭർത്താക്കന്മാരാകുക’ എന്ന സങ്കൽപ്പിത ഫലത്തെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; אֲנָשִׁים ഇവിടെ പൊതുവായ ‘പുരുഷന്മാർ’ അല്ല, ‘ഭർത്താക്കന്മാർ’ എന്നാണ്.
theological_decisions:
- issue: വിധവകൾക്കായി ഭാവിയിൽ ജനിക്കാവുന്ന പുത്രന്മാർ ഭർത്താക്കന്മാരാകുമെന്ന നൊവൊമിയുടെ ആലങ്കാരിക ചോദ്യം
  choice: വാക്യത്തിലെ സങ്കൽപ്പിത വിവാഹയുക്തി വിശദീകരണം ചേർക്കാതെ അതേപടി നിലനിർത്തി.
  alternative: ലേവിരേറ്റ് വിവാഹാചാരത്തെ മുഖ്യവാക്യത്തിൽ വിശദീകരിക്കുക.
  rationale: മൂലവാക്യം ആചാരത്തിന്റെ നിയമപരമായ വിശദീകരണം നൽകുന്നില്ല; നൊവൊമിയുടെ പ്രായോഗികമായി അസാധ്യമായ സാധ്യതയെക്കുറിച്ചുള്ള ചോദ്യം മാത്രമാണ്. അതിനാൽ പ്രത്യേക ദൈവശാസ്ത്രപരമോ നിയമപരമോ ആയ വ്യാഖ്യാനം ഇറക്കുമതി ചെയ്തില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായിക്കാൻ എളുപ്പവുമായ ശൈലി. ‘മക്കളേ’ സ്നേഹപൂർവമായ കുടുംബാഭിസംബോധനയായി സ്വാഭാവികമാണ്; ‘പുത്രന്മാർ’, ‘ഭർത്താക്കന്മാർ’ എന്നീ പദങ്ങൾ സന്ദർഭത്തിലെ ലിംഗ-വിവാഹ സവിശേഷത കൃത്യമായി നിലനിർത്തുന്നു.
