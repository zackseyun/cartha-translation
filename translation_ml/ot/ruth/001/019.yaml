id: RUT.1.19
reference: Ruth 1:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֵּלַ֣כְנָה שְׁתֵּי/הֶ֔ם עַד בֹּאָ֖/נָה בֵּ֣ית לָ֑חֶם וַ/יְהִ֗י כְּ/בֹאָ֨/נָה֙ בֵּ֣ית לֶ֔חֶם וַ/תֵּהֹ֤ם כָּל הָ/עִיר֙ עֲלֵי/הֶ֔ן וַ/תֹּאמַ֖רְנָה הֲ/זֹ֥את נָעֳמִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/019.yaml
  text: So the two of them went on until they came to Bethlehem. And when they came to Bethlehem[a], the whole town was stirred because of them, and the women said, “Is this Naomi?”
translation:
  language: ml
  text: 'അങ്ങനെ അവർ ഇരുവരും ബേത്‌ലഹേമിൽ എത്തുന്നതുവരെ യാത്ര തുടർന്നു. അവർ ബേത്‌ലഹേമിൽ എത്തിയപ്പോൾ, അവരെച്ചൊല്ലി പട്ടണം മുഴുവൻ കലക്കമുണ്ടായി. സ്ത്രീകൾ[a] പറഞ്ഞു: “ഇവൾ നൊവൊമിയാണോ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പറഞ്ഞു” എന്നതിനുള്ള ഹീബ്രു ക്രിയ സ്ത്രീലിംഗ ബഹുവചനത്തിലാണ്; അതിനാൽ സംസാരിച്ചവർ സ്ത്രീകളാണെന്ന് വ്യക്തമാകുന്നു.
    reason: ഉറവിടഭാഷയിലെ ലിംഗസൂചന വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: וַתֵּלַכְנָה שְׁתֵּיהֶם
  choice: അങ്ങനെ അവർ ഇരുവരും … യാത്ര തുടർന്നു
  rationale: הלך എന്ന ക്രിയയുടെ ആഖ്യാനതുടർച്ച യാത്ര മുന്നോട്ടു പോയതിനെ സൂചിപ്പിക്കുന്നു; שְׁתֵּיהֶם നൊവൊമിയെയും രൂത്തിനെയും ഒരു ജോഡിയായി പ്രത്യേകം ചൂണ്ടിക്കാട്ടുന്നു.
- source_word: עַד בֹּאָנָה
  choice: എത്തുന്നതുവരെ
  rationale: עַד കൂടിയ בוא യാത്രയുടെ അവസാനബിന്ദുവിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ പ്രയോഗമാണിത്.
- source_word: בֵּית לָחֶם
  choice: ബേത്‌ലഹേം
  rationale: സ്ഥലനാമത്തെ അർഥവിവർത്തനം ചെയ്യാതെ ആധുനിക മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: וַיְהִי כְּבֹאָנָה
  choice: അവർ … എത്തിയപ്പോൾ
  rationale: ഹീബ്രു ആഖ്യാനസൂത്രത്തിന്റെ കാലസംബന്ധമായ അർഥം നിലനിർത്തി, അക്ഷരാർഥത്തിലുള്ള അസ്വാഭാവിക ആവർത്തനം ഒഴിവാക്കി.
- source_word: וַתֵּהֹם כָּל הָעִיר
  choice: പട്ടണം മുഴുവൻ ഇളകിമറിഞ്ഞു
  rationale: המה ഇവിടെ ജനങ്ങളുടെ ശക്തമായ ചലനവും കോലാഹലവും സൂചിപ്പിക്കുന്നു. ‘ഇളകിമറിഞ്ഞു’ പ്രതികരണത്തിന്റെ തീവ്രത സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘നഗരം’ എന്നതിനെക്കാൾ കഥാസന്ദർഭത്തിലെ ബേത്‌ലഹേമിന് ‘പട്ടണം’ യോജിക്കുന്നു.
- source_word: עֲלֵיהֶן
  choice: അവരെച്ചൊല്ലി
  rationale: അവരുടെ വരവാണ് പട്ടണത്തിലെ പ്രതികരണത്തിന് കാരണമോ അവസരമോ ആയതെന്ന ബന്ധം സംക്ഷിപ്തമായി നൽകുന്നു; പ്രതികരണത്തിന്റെ കൃത്യഭാവം അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: וַתֹּאמַרְנָה
  choice: സ്ത്രീകൾ … ചോദിച്ചു
  rationale: ക്രിയാരൂപം സ്ത്രീലിംഗ ബഹുവചനമായതിനാൽ സംസാരിച്ചവർ സ്ത്രീകളാണെന്ന ഉറവിടവിവരം മലയാളത്തിൽ വ്യക്തമാക്കി.
- source_word: הֲזֹאת נָעֳמִי
  choice: ഇവൾ നൊവൊമിയാണോ?
  rationale: ചോദ്യകണവും സ്ത്രീലിംഗ ഏകവചന സൂചകസർവനാമവും നേരിട്ട് നിലനിർത്തുന്നു. ആശ്ചര്യം സന്ദർഭത്തിൽ പ്രകടമാണെങ്കിലും ‘ശരിക്കും’ പോലുള്ള വ്യാഖ്യാനപദം ചേർത്തിട്ടില്ല.
