  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഹീബ്രുവിലെ യാത്രാതുടർച്ച, പട്ടണത്തിന്റെ കൂട്ടായ പ്രതികരണം, സംസാരിച്ചവരുടെ സ്ത്രീലിംഗ ബഹുവചനസൂചന എന്നിവ സംരക്ഷിച്ചു.
