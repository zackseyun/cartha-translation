translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായ വാക്യഘടനയുടെ പ്രധാന സമാന്തരത നിലനിർത്തിയിട്ടുണ്ടെങ്കിലും വിവാഹത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗം മലയാളത്തിൽ അസ്വാഭാവികമാകാതിരിക്കാൻ ‘ഭാര്യമാരായി സ്വീകരിച്ചു’ എന്നു നൽകിയിരിക്കുന്നു.
