  text: וַ/יִּשְׂא֣וּ לָ/הֶ֗ם נָשִׁים֙ מֹֽאֲבִיּ֔וֹת שֵׁ֤ם הָֽ/אַחַת֙ עָרְפָּ֔ה וְ/שֵׁ֥ם הַ/שֵּׁנִ֖ית ר֑וּת וַ/יֵּ֥שְׁבוּ שָׁ֖ם כְּ/עֶ֥שֶׂר שָׁנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/004.yaml
  text: And they took for themselves Moabite wives. The name of the one was Orpah[a], and the name of the other was Ruth. And they lived there about ten years.
translation:
  language: ml
  text: അവർ മോവാബ്യസ്ത്രീകളെ തങ്ങൾക്കു ഭാര്യമാരായി സ്വീകരിച്ചു.[a] ഒരുവളുടെ പേര് ഒർപ്പാ എന്നും രണ്ടാമത്തവളുടെ പേര് രൂത്ത് എന്നും ആയിരുന്നു. അവർ അവിടെ ഏകദേശം പത്തു വർഷം താമസിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവർ മോവാബ്യസ്ത്രീകളെ വിവാഹം കഴിച്ചു.” എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ, “അവർ തങ്ങൾക്കായി മോവാബ്യസ്ത്രീകളെ ഭാര്യമാരായി എടുത്തു” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ לָהֶם נָשִׁים
  choice: തങ്ങൾക്കു ഭാര്യമാരായി സ്വീകരിച്ചു
  rationale: נָשָׂא എന്ന ക്രിയ നָשִׁים എന്ന പദത്തോടൊപ്പം വരുമ്പോൾ വിവാഹം കഴിക്കുക എന്ന ആശയമുള്ള പ്രയോഗമാണ്. ‘ഭാര്യമാരായി സ്വീകരിച്ചു’ എന്നത് വിവാഹാർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുകയും ലָהֶם എന്നതിലെ വ്യക്തിപരമായ പങ്കാളിത്തത്തിന്റെ ഭാവം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: נָשִׁים מֹאֲבִיּוֹת
  choice: മോവാബ്യസ്ത്രീകളെ
  rationale: സ്ത്രീകളുടെ മോവാബ്യ ദേശീയ-വംശീയ തിരിച്ചറിയൽ സംക്ഷിപ്തമായും സ്വാഭാവികമായും നൽകുന്നു; ‘ഭാര്യമാരായി’ എന്ന തുടർപ്രയോഗം അവരുടെ വിവാഹബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: שֵׁם הָאַחַת
  choice: ഒരുവളുടെ പേര്
  rationale: אַחַת എന്നത് ഇവിടെ രണ്ടുപേരിൽ ഒരുവളെ സൂചിപ്പിക്കുന്നു; ‘ആദ്യത്തവൾ’ എന്ന് അനാവശ്യമായി ക്രമാർഥം ചേർക്കാതെ എബ്രായത്തിലെ വിരുദ്ധജോടി നിലനിർത്തുന്നു.
- source_word: עָרְפָּה
  choice: ഒർപ്പാ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: וְשֵׁם הַשֵּׁנִית
  choice: രണ്ടാമത്തവളുടെ പേര്
  rationale: הַשֵּׁנִית എന്ന ക്രമസംഖ്യയുടെ വ്യക്തമായ അർഥമായ ‘രണ്ടാമത്തവൾ’ നിലനിർത്തുന്നു.
- source_word: רוּת
  choice: രൂത്ത്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: അവർ അവിടെ താമസിച്ചു
  rationale: יָשַׁב ഇവിടെ ദീർഘകാല വാസത്തെ സൂചിപ്പിക്കുന്നു; ‘താമസിച്ചു’ ആ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כְּעֶשֶׂר שָׁנִים
  choice: ഏകദേശം പത്തു വർഷം
  rationale: ഉപസർഗമായ כְּ ഇവിടെ ഏകദേശത്വം സൂചിപ്പിക്കുന്നതിനാൽ വെറും ‘പത്തു വർഷം’ എന്നതിനെക്കാൾ കൃത്യമാണ്.
