translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ ‘ആ സ്ത്രീ’ എന്ന പരാമർശവും ‘മക്കൾ’ എന്ന വിശാല പദവും സംരക്ഷിച്ചു; നഷ്ടത്തിന്റെ ഇരട്ട ഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘മക്കളും ഭർത്താവും ഇല്ലാതെ’ എന്നു ചേർത്തു.
