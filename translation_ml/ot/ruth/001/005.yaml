  yaml_path: translation/ot/ruth/001/005.yaml
  text: Then both of them also died[a], Mahlon and Chilion, and the woman was left without her two children and without her husband.
translation:
  language: ml
  text: പിന്നെ അവരുടെ രണ്ടുപേരും കൂടി—മഹ്ലോനും കില്യോനും—മരിച്ചു. അങ്ങനെ ആ സ്ത്രീ തന്റെ രണ്ടു മക്കളും[a] ഭർത്താവും ഇല്ലാതെ ശേഷിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തന്റെ രണ്ടു പുത്രന്മാരും.’ എബ്രായപാഠത്തിൽ ‘തന്റെ രണ്ടു മക്കൾ’ എന്നാണ്; അവിടെ ഉപയോഗിച്ച പദം സന്തതികളെ കൂടുതൽ പൊതുവായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמ֥וּתוּ
  choice: പിന്നെ ... മരിച്ചു
  rationale: വയ്യക്ഷോൽ രൂപം ആഖ്യാനത്തെ അടുത്ത സംഭവത്തിലേക്കു നീക്കുന്നു; മലയാളത്തിലെ സ്വാഭാവിക ഭൂതകാല ആഖ്യാനക്രമം ‘പിന്നെ’ വ്യക്തമാക്കുന്നു.
- source_word: גַם שְׁנֵיהֶם
  choice: അവരുടെ രണ്ടുപേരും
  rationale: മുൻപുണ്ടായ എലീമേലെക്കിന്റെ മരണത്തിനു പിന്നാലെ ഈ രണ്ടുപേരുടെയും മരണം സംഭവിച്ചെന്ന കൂട്ടിച്ചേർക്കൽ സന്ദർഭം വ്യക്തമാക്കുന്നു; ‘രണ്ടുപേരും’ ഇരുവരെയും ഊന്നിപ്പറയുന്നു.
- source_word: מַחְלוֹן וְכִלְיוֹן
  choice: മഹ്ലോനും കില്യോനും
  rationale: എബ്രായ വ്യക്തിനാമങ്ങൾ മലയാളത്തിൽ ഉച്ചാരണസമീപമായി ലിപ്യന്തരിച്ചു.
- source_word: וַתִּשָּׁאֵר
  choice: ശേഷിച്ചു
  rationale: שׁאר എന്ന ക്രിയയുടെ ‘ശേഷിക്കുക/അവശേഷിക്കുക’ എന്ന അർഥം നിലനിർത്തുന്നു; തുടർന്നുള്ള ‘ഇല്ലാതെ’ നഷ്ടത്തിന്റെ ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הָאִשָּׁה
  choice: ആ സ്ത്രീ
  rationale: മൂലപാഠം ഇവിടെ നൊവൊമിയുടെ പേര് പറയാതെ ‘ആ സ്ത്രീ’ എന്നാണ് പറയുന്നത്; അതേ ആഖ്യാനപ്രയോഗം സംരക്ഷിച്ചു.
- source_word: מִשְּׁנֵי יְלָדֶיהָ
  choice: തന്റെ രണ്ടു മക്കളും ഇല്ലാതെ
  rationale: יְלָדִים സന്തതികളെ പൊതുവായി സൂചിപ്പിക്കാവുന്ന പദമാണ്. ഇവർ പ്രായപൂർത്തിയായ പുത്രന്മാരാണെങ്കിലും ‘മക്കൾ’ എന്നത് എബ്രായപദത്തിന്റെ വിശാലതയും അമ്മയുടെ ബന്ധദൃഷ്ടിയും നിലനിർത്തുന്നു.
- source_word: וּמֵאִישָׁהּ
  choice: ഭർത്താവും ഇല്ലാതെ
  rationale: ഉടമസ്ഥപ്രത്യയത്തോടുകൂടിയ אִישׁ ഇവിടെ ‘ഭർത്താവ്’ എന്നാണ്; ആവർത്തിക്കുന്ന מִן വേർപാടിനെയും നഷ്ടത്തെയും സൂചിപ്പിക്കുന്നതിനാൽ ‘ഇല്ലാതെ’ സ്വാഭാവികമാണ്.
