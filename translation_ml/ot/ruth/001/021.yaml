id: RUT.1.21
reference: Ruth 1:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֲנִי֙ מְלֵאָ֣ה הָלַ֔כְתִּי וְ/רֵיקָ֖ם הֱשִׁיבַ֣/נִי יְהוָ֑ה לָ֣/מָּה תִקְרֶ֤אנָה לִ/י֙ נָעֳמִ֔י וַֽ/יהוָה֙ עָ֣נָה בִ֔/י וְ/שַׁדַּ֖י הֵ֥רַֽע לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/021.yaml
  text: I went away full[a], but Yahweh has brought me back empty. Why do you call me Naomi[b], when Yahweh has testified against me and the Almighty has brought calamity on me?
translation:
  language: ml
  text: ഞാൻ നിറഞ്ഞവളായി പോയി; എന്നാൽ യഹ്‌വെ എന്നെ ശൂന്യയായി തിരികെ കൊണ്ടുവന്നു. യഹ്‌വെ എനിക്കെതിരായി സാക്ഷ്യം പറയുകയും[a] സർവശക്തൻ എനിക്കു ദുരന്തം വരുത്തുകയും ചെയ്തിരിക്കെ[b], നിങ്ങൾ എന്നെ നൊവൊമി എന്ന് വിളിക്കുന്നത് എന്തിന്?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എനിക്കെതിരായി ഉത്തരം പറയുകയും.’ ഹീബ്രു ക്രിയയ്ക്ക് ഒരാൾക്കെതിരായി ഉത്തരം പറയുക അഥവാ സാക്ഷ്യം പറയുക എന്ന അർഥമുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘എനിക്കു ദോഷം വരുത്തുകയും.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രു പ്രയോഗം നൊവൊമിക്കു വന്ന അനർഥത്തെയോ പ്രതികൂലാവസ്ഥയെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְלֵאָה
  choice: നിറഞ്ഞവളായിട്ട്
  rationale: നൊവൊമിയുടെ മുമ്പത്തെ സമൃദ്ധാവസ്ഥയെ സൂചിപ്പിക്കുന്ന വിധേയവിശേഷണം. ‘വെറുമയായി’ എന്ന തുടർവിരുദ്ധത നിലനിർത്തുന്നു; കുടുംബം, സുരക്ഷ, സമ്പത്ത് എന്നിവയിൽ ഏതൊക്കെയാണ് ഉദ്ദേശ്യമെന്ന് വിശദീകരിച്ച് അർഥം ചുരുക്കുന്നില്ല.
- source_word: הָלַכְתִּי
  choice: ഞാൻ ... പോയത്
  rationale: സന്ദർഭത്തിൽ ബെത്‌ലഹേമിൽനിന്നുള്ള പുറപ്പെടലിനെ സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: וְרֵיקָם
  choice: വെറുമയായി
  rationale: ‘നിറഞ്ഞവളായി’ എന്നതിനോടുള്ള ശക്തമായ വിരുദ്ധത സംരക്ഷിക്കുന്നു. ‘വെറുങ്കൈയായി’ എന്നത് ഭൗതികസ്വത്തിൽ മാത്രം അർഥം ചുരുക്കാൻ ഇടയുള്ളതിനാൽ ഒഴിവാക്കി.
- source_word: הֱשִׁיבַנִי
  choice: എന്നെ ... തിരികെ കൊണ്ടുവന്നത്
  rationale: שוב എന്ന ക്രിയയുടെ ഹിഫീൽ കാരണാർഥവും ദൈവിക പ്രവർത്തകത്വവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവികൊണ്ട് പകരാതെ, ഹീബ്രു നാമത്തിന്റെ പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: לָמָּה תִקְרֶאנָה לִי נָעֳמִי
  choice: നിങ്ങൾ എന്നെ നൊവൊമി എന്നു വിളിക്കുന്നത് എന്തിന്?
  rationale: ബെത്‌ലഹേമിലെ സ്ത്രീകളോടുള്ള നേരിട്ടുള്ള അലങ്കാരപ്രശ്നം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: נָעֳמִי
  choice: നൊവൊമി
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പരിചിതരൂപത്തിൽ ലിപ്യന്തരിച്ചു; ‘സുഖകരമായവൾ’ എന്ന പേരർഥം മുഖ്യവാക്യത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: עָנָה בִי
  choice: എനിക്കെതിരായി സാക്ഷ്യം പറഞ്ഞിരിക്കുമ്പോഴും
  rationale: ഈ ഘടനയ്ക്കുള്ള ന്യായാധിപത്യപരമായ ‘എതിരായി സാക്ഷ്യം പറയുക’ എന്ന സാധ്യത സ്വീകരിക്കുന്നു; പിന്നാലെയുള്ള ദുരന്തവാക്യവുമായി ഇതിനെ ലയിപ്പിക്കുന്നില്ല. മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: שַׁדַּי
  choice: സർവശക്തൻ
  rationale: ദൈവിക പദവിയുടെ അർഥം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: הֵרַע לִי
  choice: എനിക്കു ദുരന്തം വരുത്തിയിരിക്കുമ്പോഴും
  rationale: നൊവൊമിയുടെ കഷ്ടതയിൽ ദൈവത്തിന്റെ നേരിട്ടുള്ള പ്രവർത്തകത്വം നിലനിർത്തുന്നു; അതേസമയം ദൈവം ധാർമിക തിന്മ ചെയ്തുവെന്ന തെറ്റിദ്ധാരണ ഉളവാക്കാവുന്ന പദപ്രയോഗം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: നൊവൊമിയുടെ കഷ്ടതയിൽ ദൈവത്തിന്റെ പ്രവർത്തകത്വം
  choice: ‘യഹ്‌വെ എനിക്കെതിരായി സാക്ഷ്യം പറഞ്ഞു’ എന്നും ‘സർവശക്തൻ എനിക്കു ദുരന്തം വരുത്തി’ എന്നും ശക്തമായ ദൈവിക പ്രവർത്തകത്വം നിലനിർത്തി.
  alternative: ‘ദുരന്തം എനിക്കു വരാൻ അനുവദിച്ചു’ എന്നു മൃദൂകരിക്കുക; അല്ലെങ്കിൽ עָנָה എന്നത് ‘എന്നെ പീഡിപ്പിച്ചു’ എന്നു വിവർത്തനം ചെയ്യുക.
  rationale: ഹീബ്രു വാക്യം നൊവൊമിയുടെ കഠിനാനുഭവത്തെ യഹ്‌വെയുടെയും ശദ്ദായിയുടെയും പ്രവർത്തനവുമായി നേരിട്ട് ബന്ധിപ്പിക്കുന്നു. ആ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ നിലനിർത്തുന്നു; എന്നാൽ הֵרַע എന്നത് ‘തിന്മ ചെയ്തു’ എന്നു നൽകി ധാർമിക തിന്മ സൂചിപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘നിറഞ്ഞവൾ/വെറുമയായവൾ’ എന്ന മൂലപാഠത്തിലെ തീവ്രവിരുദ്ധതയും നൊവൊമിയുടെ വികാരഭാരവും സംരക്ഷിച്ചു. ദൈവനാമത്തിന് ‘യഹ്‌വെ’ എന്നും שַׁדַּי എന്ന പദവിക്ക് ‘സർവശക്തൻ’ എന്നും ഉപയോഗിച്ചു. ഇംഗ്ലീഷ് ഉപദേശപാളിയിലെ അടിക്കുറിപ്പുസൂചകങ്ങൾ ഉള്ളടക്കവുമായി പൊരുത്തപ്പെടാത്ത സ്ഥാനങ്ങളിലായിരുന്നതിനാൽ, മലയാള മുഖ്യവാക്യത്തിൽ അവ ബന്ധപ്പെട്ട ഹീബ്രു പ്രയോഗങ്ങൾക്കു പിന്നാലെ ചേർത്തു.
