source:
  edition: WLC
  text: הֲ/לָהֵ֣ן תְּשַׂבֵּ֗רְנָה עַ֚ד אֲשֶׁ֣ר יִגְדָּ֔לוּ הֲ/לָהֵן֙ תֵּֽעָגֵ֔נָה לְ/בִלְתִּ֖י הֱי֣וֹת לְ/אִ֑ישׁ אַ֣ל בְּנֹתַ֗/י כִּֽי מַר לִ֤/י מְאֹד֙ מִ/כֶּ֔ם כִּֽי יָצְאָ֥ה בִ֖/י יַד יְהוָֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/013.yaml
  text: Would you wait for them until they were grown? Would you refrain from belonging to a man for them? No[a], my daughters, for it is much more bitter for me than for you, because the hand of Yahweh has gone out against me.
translation:
  language: ml
  text: അവർ വളരുന്നതുവരെ നിങ്ങൾ അവർക്കായി കാത്തിരിക്കുമോ? അവർക്കുവേണ്ടി നിങ്ങൾ വിവാഹം കഴിക്കാതെ കഴിയുമോ?[a] അല്ല, എന്റെ മക്കളേ! നിങ്ങളുടെ അവസ്ഥയെക്കാൾ എന്റെ അവസ്ഥ വളരെ കയ്പേറിയതാണ്; യഹോവയുടെ കൈ എനിക്കെതിരായി പുറപ്പെട്ടിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അവർക്കുവേണ്ടി നിങ്ങൾ അവിവാഹിതരായി തുടരുമോ?” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായക്രിയ അപൂർവമാണ്; ഭാവിയിലെ ഭർത്താക്കന്മാർക്കായി കാത്തുകൊണ്ട് വിവാഹത്തിൽനിന്നു വിട്ടുനിൽക്കുന്നതിനെ അതു സൂചിപ്പിക്കുന്നതായി തോന്നുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשַׂבֵּרְנָה
  choice: കാത്തിരിക്കുമോ
  rationale: ശׂבר എന്ന ക്രിയയുടെ ഇവിടെ പ്രസക്തമായ അർഥം ‘കാത്തിരിക്കുക/പ്രതീക്ഷയോടെ കാത്തിരിക്കുക’ എന്നാണ്; സങ്കൽപ്പിത പുത്രന്മാർ വളരുന്നതുവരെ കാത്തിരിക്കുന്നതിനെ സന്ദർഭം സൂചിപ്പിക്കുന്നു.
- source_word: עַד אֲשֶׁר יִגְדָּלוּ
  choice: അവർ വളരുന്നതുവരെ
  rationale: സങ്കൽപ്പിത പുത്രന്മാർ വിവാഹപ്രായത്തിലെത്തുന്നതുവരെയുള്ള കാലം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: תֵּעָגֵנָה לְבִלְתִּי הֱיוֹת לְאִישׁ
  choice: വിവാഹം കഴിക്കാതെ കഴിയുമോ
  rationale: അപൂർവമായ עגן എന്ന ക്രിയയുടെ കൃത്യമായ സൂക്ഷ്മാർഥം അനിശ്ചിതമാണെങ്കിലും, തുടർന്നുള്ള ‘ഒരു പുരുഷന്റേതാകാതിരിക്കുക’ എന്ന പ്രയോഗം വിവാഹത്തിൽനിന്നു വിട്ടുനിൽക്കുന്നതായി അർഥം വ്യക്തമാക്കുന്നു. മലയാളത്തിൽ അർഥം സ്വാഭാവികമാക്കുന്നു; അപൂർവക്രിയയുടെ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אַל בְּנֹתַי
  choice: വേണ്ട, എന്റെ മക്കളേ!
  rationale: אַל ഇവിടെ നേരിട്ടുള്ള വിലക്കിനെക്കാൾ നൊവൊമിയുടെ വികാരപൂർണമായ നിരാകരണമായി പ്രവർത്തിക്കുന്നു; ‘വേണ്ട’ ആ വ്യവഹാരബലം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כִּי מַר לִי מְאֹד מִכֶּם
  choice: നിങ്ങളുടെ കാര്യം ഓർക്കുമ്പോൾ എനിക്ക് അത്യന്തം കയ്പേറുന്നു
  rationale: מִכֶּם എന്നത് ‘നിങ്ങളെക്കാൾ’ എന്ന താരതമ്യമായോ ‘നിങ്ങളെച്ചൊല്ലി/നിങ്ങളുടെ നിമിത്തം’ എന്ന ബന്ധമായോ ഗ്രഹിക്കാം. MT-യിലെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പോടെ സംരക്ഷിച്ചുകൊണ്ട്, സന്ദർഭത്തിൽ നൊവൊമി മരുമക്കളുടെ നഷ്ടത്തെക്കുറിച്ച് ദുഃഖിക്കുന്ന വായന പ്രധാനപാഠത്തിൽ നൽകിയിരിക്കുന്നു.
- source_word: יָצְאָה בִי יַד יְהוָה
  choice: യഹോവയുടെ കൈ എനിക്കെതിരായി നീണ്ടിരിക്കുന്നു
  rationale: ദൈവിക പ്രവർത്തനത്തെയും പ്രതികൂലതയെയും സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം നിലനിർത്തുന്നു; ‘നീണ്ടിരിക്കുന്നു’ എന്നത് ‘പുറപ്പെട്ടിരിക്കുന്നു’ എന്ന അസ്വാഭാവിക മലയാളത്തേക്കാൾ വ്യക്തമാകുമ്പോഴും ‘കൈ’ എന്ന ദൃശ്യരൂപം സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: നൊവൊമി തന്റെ കഷ്ടത യഹോവയുടെ പ്രവർത്തനവുമായി ബന്ധിപ്പിക്കുന്നത്
  choice: യഹോവയുടെ കൈ എനിക്കെതിരായി നീണ്ടിരിക്കുന്നു
  alternative: യഹോവ എനിക്ക് ദുരിതം വരുത്തിയിരിക്കുന്നു
  rationale: മൂലപാഠം നൊവൊമിയുടെ കഷ്ടതയെ യഹോവയുടെ ‘കൈ’യോട് വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു. ഈ ദൈവശാസ്ത്രപരമായ സംഘർഷം മയപ്പെടുത്താതെയും, ദൈവത്തിന്റെ ഉദ്ദേശത്തെക്കുറിച്ച് പാഠത്തിൽ ഇല്ലാത്ത വിശദീകരണം ചേർക്കാതെയും കൈയുടെ രൂപകം സംരക്ഷിക്കുന്നു.
- issue: מִכֶּם എന്ന പ്രയോഗത്തിലെ അനിശ്ചിതത്വം
  choice: നിങ്ങളുടെ കാര്യം ഓർക്കുമ്പോൾ എനിക്ക് അത്യന്തം കയ്പേറുന്നു
  alternative: എന്റെ അവസ്ഥ നിങ്ങളുടേതിനെക്കാൾ വളരെ കയ്പേറിയതാണ്
  rationale: എബ്രായ מִן താരതമ്യം സൂചിപ്പിക്കാമെങ്കിലും, വ്യക്തികളെ സൂചിപ്പിക്കുന്ന പ്രത്യയത്തോടുകൂടി കാരണം/ബന്ധം എന്ന അർഥവും സാധ്യമാണ്. രണ്ട് വായനകളും അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു; നൊവൊമിയുടെ കരുതലോടെയുള്ള അഭിസംബോധനയോട് നന്നായി ചേരുന്ന വായന പ്രധാനപാഠത്തിൽ സ്വീകരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. നൊവൊമിയുടെ തുടർച്ചയായ വാചാടോപചോദ്യങ്ങളും വികാരപൂർണമായ ‘വേണ്ട, എന്റെ മക്കളേ!’ എന്ന അഭിസംബോധനയും നിലനിർത്തി. അപൂർവക്രിയയുടെയും מִכֶּם എന്നതിന്റെയും യഥാർഥ അർഥാനിശ്ചിതത്വം അടിക്കുറിപ്പുകളിൽ തുറന്നുവെച്ചു.
