translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. എബ്രായവാക്യത്തിലെ ‘മടങ്ങിവന്നു’ എന്ന ആവർത്തനവും രൂത്തിന്റെ മോവാബ്യസ്വത്വത്തിനുള്ള ഊന്നലും നിലനിർത്തിയപ്പോൾ, മലയാളത്തിലെ വായനാസൗകര്യത്തിനായി ഉപവാക്യക്രമം അല്പം പുനഃക്രമീകരിച്ചു.
