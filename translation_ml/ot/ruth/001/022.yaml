base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/022.yaml
  text: So Naomi returned[a], and Ruth the Moabite, her daughter-in-law, with her, who returned from the fields of Moab. And they came to Bethlehem at the beginning of the barley harvest.
translation:
  language: ml
  text: അങ്ങനെ നൊവൊമി മടങ്ങിവന്നു; അവളുടെ മോവാബ്യയായ മരുമകൾ രൂത്തും അവളോടുകൂടെ മോവാബിലെ വയലുകളിൽനിന്ന്[a] മടങ്ങിവന്നു. അവർ യവക്കൊയ്ത്തിന്റെ ആരംഭത്തിൽ ബേത്‌ലഹേമിൽ എത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, കൂടുതൽ വ്യവഹാരികമായി, ‘മോവാബ് ദേശത്തുനിന്ന്.’ എബ്രായപാഠത്തിൽ അക്ഷരാർഥം ‘മോവാബിന്റെ വയലുകളിൽനിന്ന്’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּשָׁב
  choice: മടങ്ങിവന്നു
  rationale: שׁוב എന്ന ക്രിയയുടെ മടങ്ങിവരുക എന്ന അർഥവും മുൻവിവരണത്തോടുള്ള ആഖ്യാനബന്ധവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: הַמּוֹאֲבִיָּה
  choice: മോവാബ്യസ്ത്രീ
  rationale: സ്ത്രീലിംഗ ജനതാസൂചക വിശേഷണം നാമമായി ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ രൂത്തിന്റെ മോവാബ്യസ്വത്വത്തിന് മൂലപാഠം നൽകുന്ന ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: כַלָּתָהּ
  choice: അവളുടെ മരുമകൾ
  rationale: സ്ത്രീയായ മകന്റെ ഭാര്യയെ സൂചിപ്പിക്കുന്ന ബന്ധപദത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: עִמָּהּ
  choice: അവളോടുകൂടെ
  rationale: രൂത്ത് നൊവൊമിയോടൊപ്പം വന്നുവെന്ന അനുഗമനബന്ധം നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: הַשָּׁבָה
  choice: മടങ്ങിവന്ന
  rationale: സ്ത്രീലിംഗ ഏകവചന കൃദന്തരൂപം നിലനിർത്തുന്നു; വാക്യക്രമത്തിൽ ഇത് രൂത്തിനെ വിശേഷിപ്പിക്കുന്നതായി സ്വാഭാവികമായി വായിക്കാം.
- source_word: מִשְּׂדֵי מוֹאָב
  choice: മോവാബിലെ വയലുകളിൽനിന്ന്
  rationale: שׂדה എന്ന പദത്തിന്റെ അക്ഷരാർഥമായ ‘വയൽ’ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ പ്രദേശം എന്ന വിശാലാർഥവും അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
- source_word: וְהֵמָּה בָּאוּ
  choice: അവർ ... എത്തി
  rationale: സ്വതന്ത്ര സർവനാമത്തിലെ വിഷയഊന്നൽ മലയാളത്തിൽ വ്യക്തമായ ‘അവർ’കൊണ്ട് പ്രകടിപ്പിക്കുകയും ലക്ഷ്യസ്ഥാനത്തെത്തിയ ചലനം സ്വാഭാവികമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: בֵּית לֶחֶם
  choice: ബേത്‌ലഹേം
  rationale: സ്ഥലനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: בִּתְחִלַּת
  choice: ആരംഭത്തിൽ
  rationale: കാലഘട്ടത്തിന്റെ തുടക്കത്തെ സൂചിപ്പിക്കുന്ന construct രൂപത്തിന് വ്യക്തമായ തുല്യപദം.
- source_word: קְצִיר שְׂעֹרִים
  choice: യവക്കൊയ്ത്ത്
  rationale: യവത്തിന്റെ വിളവെടുപ്പ് എന്ന construct ബന്ധം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
