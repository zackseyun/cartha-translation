source:
  edition: WLC
  text: וַ/יָּ֥מָת אֱלִימֶ֖לֶךְ אִ֣ישׁ נָעֳמִ֑י וַ/תִּשָּׁאֵ֥ר הִ֖יא וּ/שְׁנֵ֥י בָנֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/003.yaml
  text: Then Elimelech[a], Naomi’s husband, died, and she was left, and her two sons.
translation:
  language: ml
  text: അപ്പോൾ നൊവൊമിയുടെ ഭർത്താവായ എലീമേലെക്ക് മരിച്ചു; അവളും അവളുടെ രണ്ടു പുത്രന്മാരും ശേഷിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: അപ്പോൾ ... മരിച്ചു
  rationale: വയിക്തോൽ രൂപം കഥയിലെ അടുത്ത സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ആഖ്യാനക്രമം സ്വാഭാവികമായി സൂചിപ്പിക്കാൻ ‘അപ്പോൾ’ ഉപയോഗിച്ചു.
- source_word: אֱלִימֶלֶךְ
  choice: എലീമേലെക്ക്
  rationale: വ്യക്തിനാമം മലയാളത്തിൽ ഉച്ചാരണാനുസൃതമായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: אִישׁ נָעֳמִי
  choice: നൊവൊമിയുടെ ഭർത്താവായ
  rationale: ഈ സംയുക്തപ്രയോഗത്തിൽ אִישׁ എന്നത് പൊതുവായ ‘പുരുഷൻ’ എന്നതിലുപരി വൈവാഹികബന്ധം സൂചിപ്പിക്കുന്ന ‘ഭർത്താവ്’ എന്നാണ്.
- source_word: וַתִּשָּׁאֵר
  choice: ശേഷിച്ചു
  rationale: മരണത്തിനു ശേഷം ജീവനോടെ ശേഷിക്കുക എന്ന שׁאר എന്ന ക്രിയയുടെ സന്ദർഭാർഥം നിലനിർത്തുന്നു.
- source_word: הִיא וּשְׁנֵי בָנֶיהָ
  choice: അവളും അവളുടെ രണ്ടു പുത്രന്മാരും
  rationale: ഹീബ്രുവിൽ നൊവൊമിയും അവളുടെ രണ്ടു പുത്രന്മാരും ഒരുമിച്ച് ശേഷിച്ചവരായി വ്യക്തമായി ചേർത്തുപറയുന്നു; ‘പുത്രന്മാരോടൊപ്പം അവൾ ശേഷിച്ചു’ എന്നതിനെക്കാൾ ഈ ഘടന മൂലപാഠത്തെ അടുത്തായി പിന്തുടരുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ സാധാരണ മലയാളം. ‘മക്കൾ’ എന്നതിനെക്കാൾ ലിംഗവും ബന്ധവും കൃത്യമായി വ്യക്തമാക്കാൻ ‘പുത്രന്മാർ’ ഉപയോഗിച്ചു; വാക്യത്തിന്റെ ഹീബ്രു സമാന്തരഘടന മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തി.
