translation_notes:
  register: ആധുനികവും മാന്യവും എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ നിലവാരമലയാളം. നൊവൊമിയോടുള്ള മരുമക്കളുടെ അഭിസംബോധനയിൽ ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു; മൂലപാഠത്തിലെ ബഹുവചന സ്ത്രീലിംഗ കർത്താവിനെ മലയാളത്തിൽ സ്വാഭാവികമായ ‘അവർ’ എന്നു നൽകി.
