  text: וַ/תֹּאמַ֖רְנָה לָּ֑/הּ כִּי אִתָּ֥/ךְ נָשׁ֖וּב לְ/עַמֵּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/010.yaml
  text: But they said to her[a], “No, we will return with you to your people.”
translation:
  language: ml
  text: 'അവർ അവളോടു പറഞ്ഞു: “തീർച്ചയായും, അങ്ങയോടുകൂടെ ഞങ്ങൾ അങ്ങയുടെ ജനത്തിന്റെ അടുത്തേക്കു മടങ്ങിവരും.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “അങ്ങയോടുകൂടെ ഞങ്ങൾ അങ്ങയുടെ ജനത്തിന്റെ അടുത്തേക്കു മടങ്ങിവരും.” ഇവിടെ എബ്രായ ‘കീ’ ഊന്നലോ ബന്ധമോ സൂചിപ്പിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמַרְנָה
  choice: എന്നാൽ അവർ പറഞ്ഞു
  rationale: വാവ് ചേർന്ന ക്രിയ ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; മുൻവാക്യത്തിൽ നൊവൊമി ആവശ്യപ്പെട്ടതിനോടുള്ള എതിർപ്പ് സന്ദർഭത്തിൽ ഉള്ളതിനാൽ ‘എന്നാൽ’ സ്വാഭാവികമാണ്.
- source_word: לָּהּ
  choice: അവളോട്
  rationale: לְ എന്ന ഉപസർഗവും മൂന്നാംപുരുഷ ഏകവചന സ്ത്രീലിംഗ പ്രത്യയവും നൊവൊമിയെ പരാമർശിക്കുന്ന പരോക്ഷ കർമത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: כִּי
  choice: അല്ല
  rationale: ഇവിടെ כִּי നൊവൊമിയുടെ നിർദേശത്തെ നിരസിച്ചുകൊണ്ടുള്ള ഊന്നിയ മറുപടി അവതരിപ്പിക്കുന്നു; ആ സംഭാഷണഭാവം ആധുനിക മലയാളത്തിൽ ‘അല്ല’ എന്ന് സ്വാഭാവികമായി പ്രകടമാകുന്നു. ‘തീർച്ചയായും/കാരണം’ എന്ന കൂടുതൽ അക്ഷരാർഥപരമായ സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: אִתָּךְ
  choice: അങ്ങയോടൊപ്പം
  rationale: രണ്ടാംപുരുഷ ഏകവചന സ്ത്രീലിംഗ പ്രത്യയത്തോടുകൂടിയ ഉപസർഗം നൊവൊമിയോടുള്ള സഹഗമനത്തെ സൂചിപ്പിക്കുന്നു. ആദരസൂചകമായ ‘അങ്ങ്’ ബന്ധത്തിന്റെ ഗൗരവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: נָשׁוּב
  choice: ഞങ്ങൾ മടങ്ങും
  rationale: שׁוּב എന്ന ധാതുവിന്റെ ‘മടങ്ങുക’ എന്ന അടിസ്ഥാനാർഥവും രൂത്ത് 1-ൽ ആവർത്തിക്കുന്ന മടങ്ങിവരവ് എന്ന പ്രമേയബന്ധവും നിലനിർത്തുന്നു.
- source_word: לְעַמֵּךְ
  choice: അങ്ങയുടെ ജനത്തിന്റെ അടുക്കലേക്ക്
  rationale: עַם ഇവിടെ അടുത്ത ബന്ധുക്കളെ മാത്രം അല്ല, നൊവൊമിയുടെ ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്നു; ‘ജനത്തിന്റെ അടുക്കലേക്ക്’ ലക്ഷ്യവും സമൂഹസംബന്ധവും വ്യക്തമാക്കുന്നു.
