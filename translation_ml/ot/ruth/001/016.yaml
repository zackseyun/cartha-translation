id: RUT.1.16
reference: Ruth 1:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר רוּת֙ אַל תִּפְגְּעִי בִ֔/י לְ/עָזְבֵ֖/ךְ לָ/שׁ֣וּב מֵ/אַחֲרָ֑יִ/ךְ כִּ֠י אֶל אֲשֶׁ֨ר תֵּלְכִ֜י אֵלֵ֗ךְ וּ/בַ/אֲשֶׁ֤ר תָּלִ֨ינִי֙ אָלִ֔ין עַמֵּ֣/ךְ עַמִּ֔/י וֵ/אלֹהַ֖יִ/ךְ אֱלֹהָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/016.yaml
  text: But Ruth said[a], “Do not press me to leave you, to turn back from following after you. For where you go, I will go; and where you lodge, I will lodge. Your people will be my people[d][c][b], and your God my God.”
translation:
  language: ml
  text: 'എന്നാൽ രൂത്ത് പറഞ്ഞു: “നിന്നെ വിട്ടുപോകാനും നിന്നെ പിന്തുടരുന്നതിൽനിന്ന് മടങ്ങിപ്പോകാനും എന്നോടു നിർബന്ധിച്ചു അപേക്ഷിക്കരുതേ.[a] കാരണം, നീ പോകുന്നിടത്ത് ഞാനും പോകും; നീ രാത്രി പാർക്കുന്നിടത്ത് ഞാനും രാത്രി പാർക്കും.[b] നിന്റെ ജനം എന്റെ ജനം; നിന്റെ ദൈവം എന്റെ ദൈവം.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘എന്നോടു ശക്തമായി അപേക്ഷിക്കരുതേ’ അല്ലെങ്കിൽ ‘എന്നെ പ്രേരിപ്പിക്കരുതേ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘നീ രാത്രി ചെലവഴിക്കുന്നിടത്ത് ഞാനും രാത്രി ചെലവഴിക്കും.’
    reason: lexical_alternative
  - marker: c
    text: ‘നിന്റെ ജനം എന്റെ ജനം; നിന്റെ ദൈവം എന്റെ ദൈവം’ എന്ന എബ്രായ വാക്യങ്ങളിൽ ക്രിയയില്ല. അതിനാൽ അവ വർത്തമാനകാലത്തിലോ ഭാവികാലത്തിലോ മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: תִּפְגְּעִי בִי
  choice: എന്നെ നിർബന്ധിക്കരുതേ
  rationale: פגע + ב ഇവിടെ ശാരീരികമായി എതിർക്കുക എന്നതല്ല, ഒരാളെ ശക്തമായി പ്രേരിപ്പിക്കുക അഥവാ നിർബന്ധപൂർവം ആവശ്യപ്പെടുക എന്ന അർഥത്തിലാണ്. ആ അപേക്ഷയുടെ തീവ്രത സ്വാഭാവികമായ മലയാളത്തിൽ ഇത് പ്രകടിപ്പിക്കുന്നു.
- source_word: לְעָזְבֵךְ
  choice: നിന്നെ വിട്ടുപോകാൻ
  rationale: עזב എന്നതിന്റെ സാധാരണ അർഥമായ ‘വിട്ടുപോകുക’ സന്ദർഭത്തിന് യോജിക്കുന്നു; ‘ഉപേക്ഷിക്കുക’ എന്ന കൂടുതൽ ഭാരമുള്ള പദം അനാവശ്യമാണ്.
- source_word: לָשׁוּב מֵאַחֲרָיִךְ
  choice: നിന്നെ പിന്തുടരുന്നതിൽനിന്ന് മടങ്ങിപ്പോകാൻ
  rationale: שׁוב എന്ന മടങ്ങൽഭാവവും מֵאַחֲרָיִךְ എന്ന ‘നിന്റെ പിന്നാലെനിന്ന്’ എന്ന ദിശാചിത്രവും, സ്വാഭാവിക മലയാളത്തിൽ പിന്തുടരുന്നത് അവസാനിപ്പിച്ച് മടങ്ങുക എന്ന ആശയമായി നിലനിർത്തുന്നു.
- source_word: כִּי
  choice: വാക്യങ്ങളുടെ തുടർച്ചയിലൂടെ കാരണബന്ധം
  rationale: ഇവിടെ כִּי രൂത്തിന്റെ അപേക്ഷയ്ക്കുള്ള കാരണം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ പ്രത്യേകമായി ‘കാരണം’ ചേർക്കാതെ തുടർന്നുള്ള പ്രതിജ്ഞയിലൂടെ ആ ബന്ധം വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: אֶל אֲשֶׁר תֵּלְכִי אֵלֵךְ
  choice: നീ പോകുന്നിടത്ത് ഞാനും പോകും
  rationale: ലക്ഷ്യസ്ഥാനം സൂചിപ്പിക്കുന്ന ബന്ധവാക്യവും സമാന്തരഘടനയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וּבַאֲשֶׁר תָּלִינִי אָלִין
  choice: നീ രാത്രി പാർക്കുന്നിടത്ത് ഞാനും രാത്രി പാർക്കും
  rationale: לון സാധാരണയായി രാത്രി തങ്ങുന്നതിനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘രാത്രി പാർക്കുക’ ആ പ്രത്യേകതയും കവിതാസമാന്തര്യവും നിലനിർത്തുന്നു.
- source_word: עַמֵּךְ עַמִּי
  choice: നിന്റെ ജനം എന്റെ ജനം
  rationale: എബ്രായത്തിലെ ക്രിയയില്ലാത്ത സംക്ഷിപ്ത തിരിച്ചറിയൽവാക്യം മലയാളത്തിലും സ്വാഭാവികമായി ക്രിയയില്ലാതെ നിലനിർത്താം; ഇതിലൂടെ കാലസൂചന നിർബന്ധിച്ച് തീരുമാനിക്കുന്നില്ല.
- source_word: וֵאלֹהַיִךְ אֱלֹהָי
  choice: നിന്റെ ദൈവം എന്റെ ദൈവം
  rationale: മൂലത്തിലെ ക്രിയയില്ലാത്ത സമാന്തരവും ഏറ്റുപറച്ചിലിന്റെ സംക്ഷിപ്ത ശക്തിയും കാത്തുസൂക്ഷിക്കുന്നു. രൂപവും സന്ദർഭവും ഏകവചനമായ ‘ദൈവം’ ആവശ്യപ്പെടുന്നു.
theological_decisions:
- issue: ജനത്തെയും ദൈവത്തെയും കുറിച്ചുള്ള ക്രിയയില്ലാത്ത തിരിച്ചറിയൽവാക്യങ്ങളുടെ കാലഭാവം
  choice: 'രണ്ടു വാക്യങ്ങളും മലയാളത്തിൽ ക്രിയയില്ലാതെ നൽകുക: ‘നിന്റെ ജനം എന്റെ ജനം; നിന്റെ ദൈവം എന്റെ ദൈവം’'
  alternative: ‘നിന്റെ ജനം എന്റെ ജനമായിരിക്കും; നിന്റെ ദൈവം എന്റെ ദൈവമായിരിക്കും’ എന്ന ഭാവികാലരൂപം, അല്ലെങ്കിൽ രണ്ടും വർത്തമാനകാലത്തിൽ നൽകുക
  rationale: എബ്രായത്തിൽ ബന്ധകക്രിയ ഇല്ല; സന്ദർഭം പ്രതിജ്ഞാഭാവം നൽകുന്നുവെങ്കിലും വ്യാകരണം വർത്തമാനമോ ഭാവിയോ തുറന്നുവെക്കുന്നു. മലയാളത്തിലെ ക്രിയയില്ലാത്ത ഘടന യഥാർഥ അനിശ്ചിതത്വവും സാഹിത്യശക്തിയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ലളിതവും മാന്യവും പ്രതിജ്ഞാഭരിതവുമായ നേരിട്ടുള്ള സംഭാഷണശൈലി. ‘രാത്രി പാർക്കുക’ എന്ന പ്രയോഗം לון എന്ന പദത്തിന്റെ രാത്രിതാമസസൂചന നിലനിർത്തുന്നു. മൂലത്തിലെ ക്രിയയില്ലാത്ത അവസാന സമാന്തരവാക്യങ്ങൾ അതേവിധം സംരക്ഷിച്ചു.
