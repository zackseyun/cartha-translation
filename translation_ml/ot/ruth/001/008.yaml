id: RUT.1.8
reference: Ruth 1:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר נָעֳמִי֙ לִ/שְׁתֵּ֣י כַלֹּתֶ֔י/הָ לֵ֣כְנָה שֹּׁ֔בְנָה אִשָּׁ֖ה לְ/בֵ֣ית אִמָּ֑/הּ יעשה יְהוָ֤ה עִמָּ/כֶם֙ חֶ֔סֶד כַּ/אֲשֶׁ֧ר עֲשִׂיתֶ֛ם עִם הַ/מֵּתִ֖ים וְ/עִמָּדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/008.yaml
  text: And Naomi said to her two daughters-in-law[a], “Go, return, each to her mother’s house. May Yahweh show you kindness, as you have shown it to the dead and to me.”
translation:
  language: ml
  text: 'നവോമി തന്റെ രണ്ടു മരുമക്കളോടു പറഞ്ഞു: “പോകൂ; നിങ്ങൾ ഓരോരുത്തരും സ്വന്തം അമ്മയുടെ വീട്ടിലേക്കു മടങ്ങിപ്പോകൂ. മരിച്ചവരോടും എന്നോടും നിങ്ങൾ ദയ കാണിച്ചതുപോലെ, യഹ്‌വെ നിങ്ങളോടും ദയ[a] കാണിക്കട്ടെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘അചഞ്ചല സ്നേഹം,’ ‘വിശ്വസ്ത സ്നേഹം,’ അല്ലെങ്കിൽ ‘ഉടമ്പടി വിശ്വസ്തത’ എന്നും പരിഭാഷപ്പെടുത്താം (ഹീബ്രു: ഹെസെദ്).'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַלֹּתֶיהָ
  choice: തന്റെ രണ്ടു മരുമക്കൾ
  rationale: ഈ സന്ദർഭത്തിൽ כַּלָּה പുത്രന്റെ ഭാര്യയെ സൂചിപ്പിക്കുന്നു; ‘മരുമക്കൾ’ എന്നത് സ്വാഭാവികവും സന്ദർഭത്തിൽ വ്യക്തവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: לֵכְנָה שֹּׁבְנָה
  choice: പോകൂ; ... മടങ്ങിപ്പോകൂ
  rationale: രണ്ട് ആജ്ഞാരൂപങ്ങളും നിലനിർത്തി നൊവൊമിയുടെ ഊന്നിപ്പറയൽ പ്രകടമാക്കുന്നു; ആവർത്തനം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ രണ്ടാമത്തെ ആജ്ഞയോടൊപ്പം ലക്ഷ്യസ്ഥാനം ചേർത്തിരിക്കുന്നു.
- source_word: אִשָּׁה לְבֵית אִמָּהּ
  choice: നിങ്ങൾ ഓരോരുത്തരും സ്വന്തം അമ്മയുടെ വീട്ടിലേക്ക്
  rationale: אִשָּׁה ഇവിടെ വിതരണാർഥത്തിൽ ‘ഓരോരുത്തിയും’ എന്ന ആശയം നൽകുന്നു. ‘അമ്മയുടെ വീട്’ പൊതുവായ ‘കുടുംബവീട്’ എന്നാക്കി മാറ്റാതെ മൂലപാഠത്തിന്റെ പ്രത്യേക പ്രയോഗം സംരക്ഷിച്ചിരിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു പകരാതെ, ‘Yahweh’ എന്ന ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണമായി നൽകിയിരിക്കുന്നു.
- source_word: חֶסֶד
  choice: ദയ
  rationale: ഈ അനുഗ്രഹപ്രാർത്ഥനയിൽ חֶסֶד സൂചിപ്പിക്കുന്ന കരുണാപൂർവമായ വിശ്വസ്തനന്മയെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ‘ദയ’ എന്ന പദം നൽകുന്നു; അതിലെ വിശ്വസ്തസ്നേഹത്തിന്റെയും ഉടമ്പടിബന്ധത്തിന്റെയും വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: עֲשִׂיתֶם עִם הַמֵּתִים וְעִמָּדִי
  choice: മരിച്ചവരോടും എന്നോടും നിങ്ങൾ ദയ കാണിച്ചതുപോലെ
  rationale: עשה עם חֶסֶד എന്ന പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി ‘ദയ കാണിക്കുക’ എന്നു വിവർത്തനം ചെയ്യുന്നു. הַמֵּתִים എന്ന ബഹുവചനം വ്യാഖ്യാനിച്ച് വ്യക്തികളുടെ പേരുകൾ ചേർക്കാതെ ‘മരിച്ചവർ’ എന്നുതന്നെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ יהוה നേരിട്ട് ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ നാമം ലിപ്യന്തരണം ചെയ്തു. ‘യഹോവ’യ്ക്കു പകരം ‘Yahweh’ പ്രതിഫലിപ്പിക്കുന്ന ‘യഹ്‌വെ’ സ്വീകരിച്ചു.
- issue: חֶסֶד എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി
  choice: പ്രധാനപാഠത്തിൽ ‘ദയ’, അടിക്കുറിപ്പിൽ മറ്റു സാധ്യതകൾ
  alternative: അചഞ്ചലസ്നേഹം; വിശ്വസ്തസ്നേഹം; ഉടമ്പടിവിശ്വസ്തത
  rationale: ഇവിടെ നൊവൊമി മരുമക്കളുടെ പ്രവൃത്തിയെയും യഹ്‌വെയിൽനിന്ന് ആശംസിക്കുന്ന അനുഗ്രഹത്തെയും ഒരേ പദത്തിലൂടെ ബന്ധിപ്പിക്കുന്നു. ഒരു സാങ്കേതിക ദൈവശാസ്ത്രാർഥം മാത്രം നിർബന്ധിക്കാതെ സന്ദർഭോചിതമായ ‘ദയ’ ഉപയോഗിക്കുകയും പദത്തിന്റെ സമ്പന്നമായ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നെങ്കിലും മാന്യവും വേദപാരായണത്തിന് യോജിച്ചതുമായ ശൈലി. ‘പോകൂ’ എന്ന സമകാലിക ആജ്ഞാരൂപം ഉപയോഗിച്ചു; ‘അമ്മയുടെ വീട്,’ ‘മരിച്ചവർ’ എന്നീ മൂലപാഠവിശദാംശങ്ങൾ പൊതുവാക്കാതെ നിലനിർത്തി.
