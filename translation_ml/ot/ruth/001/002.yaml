source:
  edition: WLC
  text: וְ/שֵׁ֣ם הָ/אִ֣ישׁ אֱֽלִימֶ֡לֶךְ וְ/שֵׁם֩ אִשְׁתּ֨/וֹ נָעֳמִ֜י וְ/שֵׁ֥ם שְׁנֵֽי בָנָ֣י/ו מַחְל֤וֹן וְ/כִלְיוֹן֙ אֶפְרָתִ֔ים מִ/בֵּ֥ית לֶ֖חֶם יְהוּדָ֑ה וַ/יָּבֹ֥אוּ שְׂדֵי מוֹאָ֖ב וַ/יִּֽהְיוּ שָֽׁם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/002.yaml
  text: The man's name was Elimelech[a], and his wife's name was Naomi, and the names of his two sons were Mahlon and Chilion. They were Ephrathites from Bethlehem in Judah[c][b]. They came to the fields of Moab and were there.
translation:
  language: ml
  text: ആ മനുഷ്യന്റെ പേര് എലീമെലെക്ക് എന്നും, അവന്റെ ഭാര്യയുടെ പേര് നവൊമി എന്നും, അവന്റെ രണ്ടു പുത്രന്മാരുടെ പേരുകൾ മഹ്ലോൻ എന്നും കില്യോൻ എന്നും ആയിരുന്നു. അവർ യെഹൂദയിലെ ബേത്‌ലഹേമിൽനിന്നുള്ള എഫ്രാത്ത്യരായിരുന്നു. അവർ മോവാബിന്റെ വയലുകളിൽ[a] എത്തി, അവിടെ ഉണ്ടായിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “മോവാബിന്റെ വയലുകളിൽ”; “മോവാബ് പ്രദേശത്ത്” എന്നും പരിഭാഷപ്പെടുത്താം.'
    reason: שְׂדֵי מוֹאָב എന്ന പ്രയോഗത്തിന്റെ ശാബ്ദിക ദൃശ്യവും പ്രാദേശിക അർഥവും സംരക്ഷിക്കാൻ.
  - marker: b
    text: 'അക്ഷരാർഥം: “അവർ അവിടെ ഉണ്ടായിരുന്നു”; “അവിടെ താമസിച്ചു” അല്ലെങ്കിൽ “അവിടെ പാർത്തു” എന്നും പരിഭാഷപ്പെടുത്താം.'
    reason: וַיִּהְיוּ שָׁם എന്നതിലെ ലളിതമായ ‘അവിടെ ഉണ്ടായിരുന്നു’ എന്ന അർഥവും സന്ദർഭസൂചിതമായ താമസാർഥവും തുറന്നുവയ്ക്കാൻ.
lexical_decisions:
- source_word: וְשֵׁם הָאִישׁ
  choice: ആ മനുഷ്യന്റെ പേര് … ആയിരുന്നു
  rationale: ഹീബ്രായ പേരുപറയൽ സൂത്രം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֱלִימֶלֶךְ
  choice: എലീമെലെക്ക്
  rationale: വ്യക്തിനാമം പരിഭാഷപ്പെടുത്താതെ ഹീബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു.
- source_word: נָעֳמִי
  choice: നൊവൊമി
  rationale: വ്യക്തിനാമത്തിന്റെ പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: מַחְלוֹן וְכִלְיוֹן
  choice: മഹ്ലോൻ എന്നും കില്യോൻ എന്നും
  rationale: വ്യക്തിനാമങ്ങൾ ഹീബ്രായ രൂപങ്ങളെ അടിസ്ഥാനമാക്കി ലിപ്യന്തരണം ചെയ്തു; כ എന്ന അക്ഷരത്തിന് ഇവിടെ ‘ക’ ഉപയോഗിച്ചു.
- source_word: אֶפְרָתִים
  choice: എഫ്രാത്ത്യർ
  rationale: എഫ്രാത്താ/ബേത്‌ലഹേമുമായി ബന്ധമുള്ള ജനവിഭാഗസൂചക പദമായി നൽകി; ‘എഫ്രയീമ്യർ’ എന്ന തെറ്റായ ഭൂമിശാസ്ത്രബന്ധം ഒഴിവാക്കി.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: യെഹൂദയിലെ ബേത്‌ലഹേമിൽനിന്നുള്ള
  rationale: ബേത്‌ലഹേം യെഹൂദയിൽ സ്ഥിതിചെയ്യുന്നതും അവരുടെ സ്വദേശമാണെന്നും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: שְׂדֵי מוֹאָב
  choice: മോവാബ് ദേശപ്രദേശങ്ങളിൽ
  rationale: ശാബ്ദികമായ ‘മോവാബിന്റെ വയലുകൾ’ എന്ന രൂപത്തിന്റെ പ്രാദേശിക അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ശാബ്ദിക രൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: וַיִּהְיוּ שָׁם
  choice: അവിടെ പാർത്തു
  rationale: അക്ഷരാർഥം ‘അവിടെ ഉണ്ടായിരുന്നു’ എന്നാണെങ്കിലും സന്ദർഭത്തിലെ താമസത്തിന്റെ തുടർച്ച മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; കൂടുതൽ ശാബ്ദികമായ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
