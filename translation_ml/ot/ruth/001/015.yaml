  terminology: ‘ജനത്തിന്റെ അടുക്കലേക്ക്,’ ‘ദേവന്മാരുടെ അടുക്കലേക്ക്,’ ‘നാത്തൂന്റെ പിന്നാലെ’ എന്നിവ യഥാക്രമം עַם, אֱלֹהִים, אַחֲרֵי എന്നിവയുടെ ആശയം യോജ്യമായി പകരുന്നു. മോവാബ്യ ആരാധനയെക്കുറിച്ച് ബഹുവചനം നിലനിർത്തുന്നതും ഏകവചനസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നതും ഉചിതമാണ്.
