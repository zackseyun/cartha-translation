id: RUT.1.15
reference: Ruth 1:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֹּ֗אמֶר הִנֵּה֙ שָׁ֣בָה יְבִמְתֵּ֔/ךְ אֶל עַמָּ֖/הּ וְ/אֶל אֱלֹהֶ֑י/הָ שׁ֖וּבִי אַחֲרֵ֥י יְבִמְתֵּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/015.yaml
  text: And she said[a], “Look, your sister-in-law has gone back to her people and to her gods[b]. Go back after your sister-in-law.”
translation:
  language: ml
  text: 'അപ്പോൾ അവൾ പറഞ്ഞു: “നോക്കൂ, നിന്റെ നാത്തൂൻ തന്റെ ജനത്തിന്റെ അടുക്കലേക്കും തന്റെ ദേവന്മാരുടെ അടുക്കലേക്കും[a] മടങ്ങിപ്പോയിരിക്കുന്നു[b]. നിന്റെ നാത്തൂന്റെ പിന്നാലെ മടങ്ങിപ്പോകുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ദേവന്മാരുടെ” എന്നതിന് “ദേവന്റെ” എന്നും വിവർത്തനം ചെയ്യാം. ഹീബ്രു പദത്തിന്റെ രൂപം ബഹുവചനമാണെങ്കിലും ചില സന്ദർഭങ്ങളിൽ അത് ഏകവചനാർഥത്തിലും ഉപയോഗിക്കപ്പെടുന്നു; ഇവിടെ മോവാബിലെ ദേവതകളെയാണ് ബഹുവചനം സൂചിപ്പിക്കുന്നതെന്നതാണ് കൂടുതൽ സാധ്യത.
    reason: alternative_reading
  - marker: b
    text: അല്ലെങ്കിൽ, “മടങ്ങിയിരിക്കുന്നു.” ഹീബ്രുവിൽ ഓർപ്പയുടെ പ്രവൃത്തിക്കും രൂത്തിനോടുള്ള നിർദേശത്തിനും ഒരേ ‘മടങ്ങുക’ എന്ന ക്രിയയാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: അപ്പോൾ അവൾ പറഞ്ഞു
  rationale: കഥനത്തിലെ wayyiqtol രൂപം സ്വാഭാവികമായ മലയാള ആഖ്യാനക്രമത്തിൽ അവതരിപ്പിക്കുന്നു; സംസാരിക്കുന്നത് നൊവൊമിയാണെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: הִנֵּה
  choice: നോക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു അവ്യയത്തിന്റെ ശക്തി, പഴഞ്ചൻ ശൈലിയില്ലാതെ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: שָׁבָה / שׁוּבִי
  choice: മടങ്ങിപ്പോയിരിക്കുന്നു / മടങ്ങിപ്പോകുക
  rationale: ഒരേ שוב ധാതു ഓർപ്പയുടെ പൂർത്തിയായ പ്രവൃത്തിക്കും രൂത്തിനോടുള്ള കല്പനയ്ക്കും ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ, ‘മടങ്ങുക’ എന്ന ഒരേ ക്രിയയിലൂടെ ആവർത്തനം പരമാവധി നിലനിർത്തുന്നു.
- source_word: יְבִמְתֵּךְ
  choice: നിന്റെ നാത്തൂൻ
  rationale: ഈ ലേവിരേറ്റ് കുടുംബബന്ധസന്ദർഭത്തിൽ സ്ത്രീയായ ഭർത്തൃസഹോദരന്റെ ഭാര്യയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും ചുരുക്കവുമായ മലയാളബന്ധപദം; രണ്ടിടത്തും ഒരേവിധം ഉപയോഗിച്ചു.
- source_word: אֶל עַמָּהּ
  choice: തന്റെ ജനത്തിന്റെ അടുക്കലേക്ക്
  rationale: עַם ഇവിടെ അടുത്ത ബന്ധുക്കളെ മാത്രം അല്ല, അവളുടെ ജനവിഭാഗത്തെയും സമൂഹത്തെയും സൂചിപ്പിക്കുന്നു.
- source_word: וְאֶל אֱלֹהֶיהָ
  choice: തന്റെ ദേവന്മാരുടെ അടുക്കലേക്ക്
  rationale: മോവാബ്യ ആരാധനാസന്ദർഭത്തിൽ സഫിക്സോടുകൂടിയ ബഹുവചനരൂപത്തിന്റെ സാധ്യതയേറിയ അർഥം നിലനിർത്തുന്നു.
- source_word: אַחֲרֵי
  choice: പിന്നാലെ
  rationale: ഓർപ്പ സ്വീകരിച്ച വഴിയെ പിന്തുടരുക എന്ന ദൃശ്യവും ദിശാബോധവും നേരിട്ട് പകരുന്നു.
theological_decisions:
- issue: മോവാബ്യ ആരാധനയെ സൂചിപ്പിക്കുന്ന אֱלֹהֶיהָയുടെ വിവർത്തനം
  choice: തന്റെ ദേവന്മാർ
  alternative: തന്റെ ദേവൻ
  rationale: אֱלֹהִים ചില സന്ദർഭങ്ങളിൽ ഏകവചനാർഥത്തിൽ വരാമെങ്കിലും, ഇവിടെ മോവാബ്യ ജനതയിലേക്കും അവരുടെ ആരാധനയിലേക്കുമുള്ള മടങ്ങിപ്പോക്കാണ് വിഷയം. അതിനാൽ ബഹുവചനം മൂലരൂപത്തെയും സാധ്യതയേറിയ സാംസ്കാരിക അർഥത്തെയും നന്നായി പ്രതിഫലിപ്പിക്കുന്നു; എങ്കിലും ഏകവചനസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നേരിട്ടുള്ള സംഭാഷണശൈലി. ഹീബ്രുവിലെ שוב എന്ന ക്രിയയുടെ ആവർത്തനം ‘മടങ്ങുക’ വഴി സംരക്ഷിച്ചു. ‘നാത്തൂൻ’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ബന്ധപദമായി തെരഞ്ഞെടുത്തു; പ്രാദേശികമായി അർഥവ്യാപ്തി വ്യത്യാസപ്പെടാമെങ്കിലും സന്ദർഭം ബന്ധം വ്യക്തമാക്കുന്നു.
