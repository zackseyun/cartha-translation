  source_fidelity: 'മുഖ്യവിവർത്തനം ഹീബ്രു വാക്യത്തിന്റെ അർഥവും ഘടനയും നന്നായി പകരുന്നു: ഓർപ്പയുടെ മടങ്ങിപ്പോക്കും രൂത്തിനോടുള്ള മടങ്ങാനുള്ള നിർദേശവും ഒരേ ‘മടങ്ങുക’ ക്രിയയാൽ പ്രതിഫലിക്കുന്നു. אֱלֹהֶיהָ എന്ന ബഹുവചനരൂപം ‘ദേവന്മാർ’ എന്നായി ശരിയായി നൽകിയിരിക്കുന്നു.'
