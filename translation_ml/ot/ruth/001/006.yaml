lexical_decisions:
- source_word: וַתָּקָם
  choice: അപ്പോൾ അവൾ ... എഴുന്നേറ്റ്
  rationale: קום എന്ന ക്രിയയുടെ കഥാഖ്യാനക്രമം ‘അപ്പോൾ’ എന്നതിലൂടെ വ്യക്തമാക്കുകയും ‘എഴുന്നേറ്റ്’ എന്നത് പ്രവർത്തനത്തിന്റെ ആരംഭം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וְכַלֹּתֶיהָ
  choice: തന്റെ മരുമക്കളോടൊപ്പം
  rationale: ഹീബ്രുവിലെ സംയോജകപ്രയോഗം ഇവിടെ സഹഗമനത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ആ അർഥം സ്വാഭാവിക മലയാളത്തിൽ ‘ഒപ്പം’ എന്നു നൽകി.
- source_word: וַתָּשָׁב
  choice: മടങ്ങി
  rationale: שׁוב എന്നതിന്റെ ‘തിരികെ പോകുക/മടങ്ങുക’ എന്ന അടിസ്ഥാനാർഥം സന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מִשְּׂדֵי מוֹאָב
  choice: മോവാബിലെ വയൽപ്രദേശങ്ങളിൽനിന്ന്
  rationale: שׂדה എന്ന പദത്തിന്റെ മൂർത്തമായ ‘വയൽ’ ദൃശ്യം നിലനിർത്തിക്കൊണ്ട്, ബഹുവചനത്തിന് ഇവിടെ പ്രദേശസൂചനയുണ്ടെന്നതും വ്യക്തമാക്കുന്നു.
- source_word: כִּי שָׁמְעָה
  choice: കാരണം ... അവൾ കേട്ടിരുന്നു
  rationale: כִּי മടങ്ങാനുള്ള കാരണം അവതരിപ്പിക്കുന്നു; qatal രൂപം മുൻപേ ലഭിച്ച വാർത്തയാണെന്ന പശ്ചാത്തലം ‘കേട്ടിരുന്നു’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: בִּשְׂדֵה מוֹאָב
  choice: മോവാബ് പ്രദേശത്തുവെച്ച്
  rationale: ഇവിടെയുള്ള ഏകവചന שׂדה പ്രദേശത്തെ കൂട്ടായ അർഥത്തിൽ സൂചിപ്പിക്കുന്നു. ‘വയലിൽവെച്ച്’ എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ സ്വാഭാവികമായ പ്രദേശസൂചന ഉപയോഗിച്ചു; ആദ്യപ്രയോഗത്തിലെ വയൽദൃശ്യം പൂർണമായി ഇല്ലാതാക്കിയിട്ടില്ല.
- source_word: פָּקַד
  choice: സന്ദർശിച്ച്
  rationale: פקד ഇവിടെ ദൈവത്തിന്റെ അനുകൂല ഇടപെടലിനെ സൂചിപ്പിക്കുന്നു. ‘സന്ദർശിക്കുക’ എന്നത് ആ ദൈവിക ശ്രദ്ധയും ഇടപെടലും നിലനിർത്തുന്നു; ‘സഹായിച്ചു’ എന്നു മാത്രം നൽകി അതിന്റെ അർഥവ്യാപ്തി ചുരുക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റോനെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന വിധം ലിപ്യന്തരിച്ചു.
- source_word: עַמּוֹ
  choice: തന്റെ ജനത്തെ
  rationale: עם എന്ന പദത്തിന്റെ സമൂഹപരവും ബന്ധപരവുമായ അർഥം ‘ജനം’ നിലനിർത്തുന്നു; പ്രതിഫലനാത്മകമായ ‘തന്റെ’ മലയാളവാക്യത്തിൽ ഉടമസ്ഥബന്ധം വ്യക്തമായി കാണിക്കുന്നു.
- source_word: לָתֵת לָהֶם לָחֶם
  choice: അവർക്കു ഭക്ഷണം നൽകിയിരിക്കുന്നു
  rationale: לֶחֶם അക്ഷരാർഥത്തിൽ ‘അപ്പം’ ആണെങ്കിലും ക്ഷാമം അവസാനിപ്പിക്കുന്ന പൊതുവായ ആഹാരലഭ്യതയെ ഇവിടെ സൂചിപ്പിക്കുന്നു. അതിനാൽ മുഖ്യപാഠത്തിൽ ‘ഭക്ഷണം’ നൽകി, അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ഒരു സ്ഥാനപ്പേരല്ല, ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ അത് സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്തു.
- issue: פקד എന്നതിലെ ദൈവിക ഇടപെടലിന്റെ സ്വഭാവം
  choice: സന്ദർശിച്ച്
  alternative: കരുതൽ കാണിച്ച്; സഹായത്തിനെത്തി
  rationale: സന്ദർഭം അനുകൂലമായ ഇടപെടലാണെന്ന് വ്യക്തമാക്കുന്നുവെങ്കിലും, അത് എങ്ങനെയായിരുന്നു എന്ന് ക്രിയ തന്നെ പൂർണമായി നിർവചിക്കുന്നില്ല. ‘സന്ദർശിച്ച്’ ആ ദൈവശാസ്ത്രപരമായ അർഥവ്യാപ്തിയും പിരിമുറുക്കവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥാഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘വയൽപ്രദേശങ്ങൾ’ മൂലപാഠത്തിലെ ദൃശ്യം നിലനിർത്തുന്നു; ആവർത്തിച്ച ഏകവചനപ്രയോഗം മലയാളത്തിൽ തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ ‘പ്രദേശം’ എന്നു നൽകി. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ‘ഭക്ഷണം’ എന്ന പദത്തിനുശേഷം തന്നെയാണ് ചേർത്തത്.
