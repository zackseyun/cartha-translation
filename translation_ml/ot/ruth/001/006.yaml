  text: Then she arose with her daughters-in-law and returned from the fields of Moab[a], because in the field of Moab she had heard that Yahweh had visited his people to give them food.
translation:
  language: ml
  text: അപ്പോൾ അവൾ തന്റെ മരുമക്കളോടൊപ്പം എഴുന്നേറ്റ് മോവാബിലെ വയൽപ്രദേശങ്ങളിൽനിന്ന് മടങ്ങി; മോവാബിൽവെച്ച് യഹ്‌വെ തന്റെ ജനത്തെ സന്ദർശിച്ച് അവർക്കു ആഹാരം നൽകാൻ പോകുന്നു എന്നു അവൾ കേട്ടിരുന്നു.[a]
