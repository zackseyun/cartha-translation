id: RUT.1.1
reference: Ruth 1:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֗י בִּ/ימֵי֙ שְׁפֹ֣ט הַ/שֹּׁפְטִ֔ים וַ/יְהִ֥י רָעָ֖ב בָּ/אָ֑רֶץ וַ/יֵּ֨לֶךְ אִ֜ישׁ מִ/בֵּ֧ית לֶ֣חֶם יְהוּדָ֗ה לָ/גוּר֙ בִּ/שְׂדֵ֣י מוֹאָ֔ב ה֥וּא וְ/אִשְׁתּ֖/וֹ וּ/שְׁנֵ֥י בָנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/001.yaml
  text: It happened in the days when the judges judged that there was a famine in the land[c][b][a], and a man went from Bethlehem of Judah to sojourn in the fields of Moab—he and his wife and his two sons.
translation:
  language: ml
  text: ന്യായാധിപന്മാർ ന്യായം വിധിച്ചിരുന്ന കാലത്ത് ദേശത്ത് ക്ഷാമമുണ്ടായി. യെഹൂദയിലെ ബേത്‌ലഹേമിൽനിന്ന് ഒരു മനുഷ്യൻ മോവാബിന്റെ വയലുകളിൽ[a] പരദേശിയായി താമസിക്കാൻ പോയി—അവനും ഭാര്യയും രണ്ട് ആൺമക്കളും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മോവാബിന്റെ പ്രദേശത്ത്’ അല്ലെങ്കിൽ ‘മോവാബ് ദേശത്ത്.’ പദശഃ, ‘മോവാബിന്റെ വയലുകളിൽ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ഉണ്ടായി / അപ്പോൾ … പോയി
  rationale: ഹീബ്രായ ആഖ്യാനാരംഭത്തിന്റെ സംഭവപരമ്പര സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ഉറവിടത്തിൽ ഇല്ലാത്ത ‘ഇപ്പോൾ’ ചേർക്കുന്നില്ല.
- source_word: בִּימֵי שְׁפֹט הַשֹּׁפְטִים
  choice: ന്യായാധിപന്മാർ ന്യായപാലനം നടത്തിയിരുന്ന കാലത്ത്
  rationale: שׁפט എന്ന ഒരേ ധാതുവിന്റെ ആവർത്തനം ‘ന്യായാധിപന്മാർ/ന്യായപാലനം’ എന്ന രൂപത്തിൽ സംരക്ഷിക്കുന്നു; അവരുടെ ഭരണപരമായ പങ്കും സൂചിപ്പിക്കപ്പെടുന്നു.
- source_word: רָעָב בָּאָרֶץ
  choice: ദേശത്ത് ക്ഷാമമുണ്ടായി
  rationale: പ്രദേശവ്യാപകമായ കടുത്ത ഭക്ഷ്യക്ഷാമത്തെ ‘ക്ഷാമം’ കൃത്യമായി സൂചിപ്പിക്കുന്നു; הארץ ഇവിടെ കഥാസന്ദർഭത്തിലെ ദേശമാണ്.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: യെഹൂദയിലെ ബേത്‌ലഹേമിൽനിന്ന്
  rationale: സ്ഥലബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും മറ്റൊരു ബേത്‌ലഹേമിൽനിന്ന് ഇതിനെ വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: לָגוּר
  choice: പരദേശിയായി താമസിക്കാൻ
  rationale: സ്ഥിരകുടിയേറ്റമെന്നതിലുപരി അന്യദേശവാസിയായുള്ള താമസം എന്ന גור-ന്റെ സൂക്ഷ്മാർഥം സംരക്ഷിക്കുന്നു.
- source_word: בִּשְׂדֵי מוֹאָב
  choice: മോവാബ് ദേശപ്രദേശങ്ങളിൽ
  rationale: പദശഃ ‘മോവാബിന്റെ വയലുകളിൽ’ എന്നാണെങ്കിലും ബഹുവചനപ്രയോഗം ഇവിടെ മോവാബിന്റെ പ്രദേശത്തെയും നാട്ടിൻപുറങ്ങളെയും സൂചിപ്പിക്കാം; ‘ദേശപ്രദേശങ്ങൾ’ ആ ഭൗമസൂചന സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הוּא וְאִשְׁתּוֹ וּשְׁנֵי בָנָיו
  choice: അയാളും അയാളുടെ ഭാര്യയും അയാളുടെ രണ്ടു പുത്രന്മാരുംകൂടെ
  rationale: കൂടെ പോയ കുടുംബാംഗങ്ങളെ ഉറവിടത്തിലെ ലളിതമായ കൂട്ടിച്ചേർക്കൽ ഘടനയോടെ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ന്യായാധിപന്മാർ ന്യായപാലനം’ എന്ന ധാതുസാമ്യം ഉദ്ദേശപൂർവം നിലനിർത്തി. ‘പരദേശിയായി താമസിക്കുക’ എന്നത് ചെറിയ തോതിൽ ഔപചാരികമാണെങ്കിലും സാംസ്കാരിക-നിയമപരമായ അന്യദേശവാസത്തിന്റെ ഭാവം വ്യക്തമായി നൽകുന്നു.
