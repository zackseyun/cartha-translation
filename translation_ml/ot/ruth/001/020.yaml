reference: Ruth 1:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֹּ֣אמֶר אֲלֵי/הֶ֔ן אַל תִּקְרֶ֥אנָה לִ֖/י נָעֳמִ֑י קְרֶ֤אןָ לִ/י֙ מָרָ֔א כִּי הֵמַ֥ר שַׁדַּ֛י לִ֖/י מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/020.yaml
  text: But she said to them[a], “Do not call me Naomi; call me Mara, for the Almighty has made me very bitter.”
translation:
  language: ml
  text: 'എന്നാൽ അവൾ അവരോടു പറഞ്ഞു: “എന്നെ നവോമി[a] എന്നു വിളിക്കരുത്; എന്നെ മാറാ എന്നു വിളിക്കൂ. സർവശക്തൻ എനിക്ക് അത്യന്തം കയ്പ് വരുത്തിയിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നവോമി” എന്ന പേരിന് “പ്രസന്നയായവൾ” എന്നതുപോലുള്ള അർഥമുണ്ട്; “മാറാ” എന്നതിന് “കയ്പുള്ളവൾ” എന്നാണ് അർഥം.
    reason: രണ്ടു പേരുകൾ തമ്മിലുള്ള അർഥവൈരുധ്യവും തുടർന്നുള്ള ‘കയ്പ്’ എന്ന പദബന്ധവും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וַתֹּאמֶר אֲלֵיהֶן
  choice: എന്നാൽ അവൾ അവരോടു പറഞ്ഞു
  rationale: വിവരണത്തിന്റെ തുടർച്ച നിലനിർത്തുന്നതിനൊപ്പം, ബെത്‌ലഹേമിലെ സ്ത്രീകളുടെ വാക്കുകളോടുള്ള നൊവൊമിയുടെ തിരുത്തൽഭാവമുള്ള പ്രതികരണം ‘എന്നാൽ’ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; സ്ത്രീലിംഗ ബഹുവചന സർവനാമം മലയാളത്തിൽ സന്ദർഭാനുസൃതമായി ‘അവരോട്’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: אַל תִּקְרֶאנָה לִי נָעֳמִי
  choice: എന്നെ നൊവൊമി എന്നു വിളിക്കരുത്
  rationale: קרא എന്ന ക്രിയയുടെ പേരിട്ട് വിളിക്കുക എന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; വ്യക്തിനാമം പരിഭാഷപ്പെടുത്താതെ ലിപ്യന്തരണം ചെയ്തു.
- source_word: קְרֶאןָ לִי מָרָא
  choice: എന്നെ മാറാ എന്നു വിളിക്കൂ
  rationale: മുൻവാക്യത്തിലെ ‘വിളിക്കുക’ ആവർത്തിച്ച് രണ്ടു പേരുകൾ തമ്മിലുള്ള വാക്ചാതുര്യമുള്ള വൈരുധ്യം നിലനിർത്തുന്നു; മാറാ എന്നത് പകരം സ്വീകരിക്കേണ്ട വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: הֵמַר ... לִי מְאֹד
  choice: എനിക്ക് അത്യന്തം കയ്പ് വരുത്തിയിരിക്കുന്നു
  rationale: ഹിഫീൽ രൂപത്തിന്റെ ‘കയ്പുണ്ടാക്കുക/കയ്പ് വരുത്തുക’ എന്ന കാരണാർഥവും לִי എന്നതിന്റെ ബാധിതവ്യക്തിസൂചനയും מְאֹד എന്ന തീവ്രതയും നിലനിർത്തുന്നു; ‘മാറാ’ എന്ന പേരുമായുള്ള കയ്പിന്റെ പദബന്ധവും വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: שַׁדַּי എന്ന ദൈവിക സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: സർവശക്തൻ
  alternative: ശദ്ദായി
  rationale: ഇത് വ്യക്തിനാമത്തേക്കാൾ ദൈവിക സ്ഥാനപ്പേരായി ഇവിടെ പ്രവർത്തിക്കുന്നു. അതിന്റെ പരമ്പരാഗതവും അർഥസുതാര്യവുമായ മലയാളപരിഭാഷ ഉപയോഗിച്ചു; പ്രത്യേക സിദ്ധാന്തവ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നേരിട്ടുള്ള സംഭാഷണശൈലി സ്വീകരിച്ചു. പേരുകൾ ലിപ്യന്തരണം ചെയ്യുകയും ദൈവിക സ്ഥാനപ്പേര് പരിഭാഷപ്പെടുത്തുകയും ചെയ്തു. ‘എനിക്ക് കയ്പ് വരുത്തി’ എന്ന പ്രയോഗം എബ്രായത്തിലെ ബാധിതവ്യക്തിസൂചനയും കാരണാർഥവും അനാവശ്യമായി വിശദീകരിക്കാതെ നിലനിർത്തുന്നു.
