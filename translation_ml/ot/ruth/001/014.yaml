  register: ആധുനികവും മാന്യവും കഥനത്തിന് യോജിച്ചതുമായ മലയാളം. ‘ശബ്ദം ഉയർത്തി കരഞ്ഞു’ എന്ന കൂടുതൽ രൂപാനുസൃത പ്രയോഗത്തിനുപകരം ‘ഉറക്കെ കരഞ്ഞു’ എന്നു നൽകി മലയാളത്തിലെ അനാവശ്യ ആവർത്തനം ഒഴിവാക്കി. ‘മുറുകെപ്പിടിച്ചു’ എന്നത് ദേഹപരമായ പിടിത്തത്തെയും വിട്ടുപിരിയാത്ത ബന്ധത്തെയും തുറന്നുവെക്കുന്നു.
