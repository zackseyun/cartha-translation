- from: അപ്പോൾ അവർ വീണ്ടും ഉറക്കെ കരഞ്ഞു. ഒർപ്പാ തന്റെ അമ്മായിയമ്മയെ ചുംബിച്ചു; എന്നാൽ രൂത്ത് അവളെ മുറുകെപ്പിടിച്ചു[a].
  to: അപ്പോൾ അവർ ശബ്ദമുയർത്തി വീണ്ടും കരഞ്ഞു. ഒർപ്പാ തന്റെ അമ്മായിയമ്മയെ ചുംബിച്ചു; എന്നാൽ[a] രൂത്ത് അവളോടു പറ്റിച്ചേർന്നു.
  rationale: The revision preserves the Hebrew’s two-part expression of audible lament, uses a broader and more contextually fitting equivalent for Ruth’s attachment, and moves the conjunction footnote marker to the word whose translation is in question. It retains the contextual adversative without treating it as the only possible grammatical reading.
