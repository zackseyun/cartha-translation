translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. സർവനാമങ്ങൾ മാത്രം ഉപയോഗിച്ചാൽ ആരെ സൂചിപ്പിക്കുന്നുവെന്ന ആശയക്കുഴപ്പം ഉണ്ടാകാവുന്നതിനാൽ സന്ദർഭപ്രകാരം രൂത്ത്, നൊവൊമി എന്നീ പേരുകൾ ചേർത്തു; എന്നാൽ എബ്രായത്തിലെ പ്രവൃത്തിയും അതിന്റെ തുറന്ന പ്രയോഗവും നിലനിർത്തി.
