  yaml_path: translation/ot/ruth/001/018.yaml
  text: When she saw that she was determined to go with her[a], she stopped speaking to her.
translation:
  language: ml
  text: തന്നോടൊപ്പം പോകാൻ രൂത്ത് ഉറച്ചിരിക്കുകയാണെന്നു നൊവൊമി കണ്ടപ്പോൾ, അവളോടു സംസാരിക്കുന്നത് നിർത്തി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: കണ്ടപ്പോൾ
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ഇവിടെ മുൻവാക്യത്തോടുള്ള കാലബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ ‘കണ്ടപ്പോൾ’ യോജിക്കുന്നു.
- source_word: כִּי
  choice: എന്ന്
  rationale: നൊവൊമി ഗ്രഹിച്ച കാര്യത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ‘എന്ന്’ സ്വാഭാവികമാണ്.
- source_word: מִתְאַמֶּצֶת
  choice: ഉറച്ചിരിക്കുകയാണ്
  rationale: אמץ എന്ന ധാതുവിന്റെ ഹിത്പയേൽ രൂപം സ്വയം ശക്തിപ്പെടുത്തി ദൃഢനിശ്ചയത്തോടെ നിൽക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘ഉറച്ചിരിക്കുക’ ഈ ഭാവം സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הִיא
  choice: രൂത്ത്
  rationale: എബ്രായത്തിൽ സ്വതന്ത്ര സർവനാമം വിഷയത്തിന് ഊന്നൽ നൽകുന്നു. മലയാളത്തിൽ സർവനാമങ്ങളുടെ ആശയക്കുഴപ്പം ഒഴിവാക്കി സന്ദർഭത്തിലെ വ്യക്തിയെ പേരെടുത്തുപറയുന്നത് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: לָלֶכֶת אִתָּהּ
  choice: തന്നോടൊപ്പം പോകാൻ
  rationale: യാത്രാസന്ദർഭത്തിൽ הלך എന്നത് ‘പോകുക’ എന്നാണ്; אִתָּהּ കൂടെ പോകുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘തന്നോടൊപ്പം’ എന്നത് നൊവൊമിയോടൊപ്പം എന്ന ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: וַתֶּחְדַּל
  choice: നിർത്തി
  rationale: חדל എന്നതിന് ‘അവസാനിപ്പിക്കുക/നിർത്തുക’ എന്ന അർഥമുണ്ട്; ‘നിർത്തി’ ലളിതവും ആഖ്യാനത്തിന് യോജിച്ചതുമാണ്.
- source_word: לְדַבֵּר אֵלֶיהָ
  choice: അവളോടു സംസാരിക്കുന്നത്
  rationale: എബ്രായപ്രയോഗം അക്ഷരാർഥത്തിൽ അവളോടു സംസാരിക്കുന്നതു നിർത്തിയെന്ന് പറയുന്നു; എന്തു സംസാരമാണെന്ന സന്ദർഭാർഥം മുഖ്യപാഠത്തിൽ അധികമായി ചേർത്തിട്ടില്ല.
