id: RUT.1.12
reference: Ruth 1:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: שֹׁ֤בְנָה בְנֹתַ/י֙ לֵ֔כְןָ כִּ֥י זָקַ֖נְתִּי מִ/הְי֣וֹת לְ/אִ֑ישׁ כִּ֤י אָמַ֨רְתִּי֙ יֶשׁ לִ֣/י תִקְוָ֔ה גַּ֣ם הָיִ֤יתִי הַ/לַּ֨יְלָה֙ לְ/אִ֔ישׁ וְ/גַ֖ם יָלַ֥דְתִּי בָנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/012.yaml
  text: Turn back[a], my daughters; go on, for I am too old to belong to a husband. Even if I were to say[b], ‘There is still hope for me’—even if I were with a husband tonight and even bore sons—
translation:
  language: ml
  text: എന്റെ പെൺമക്കളേ, മടങ്ങിപ്പോകുവിൻ; പോകുവിൻ. ഒരു ഭർത്താവുണ്ടാകാൻ എനിക്ക് വളരെ പ്രായമായിരിക്കുന്നു.[a] ‘എനിക്ക് പ്രത്യാശയുണ്ട്’ എന്നു ഞാൻ പറഞ്ഞാലും[b]—ഇന്നുരാത്രിതന്നെ എനിക്ക് ഒരു ഭർത്താവുണ്ടാകുകയും പുത്രന്മാരെ പ്രസവിക്കുകയും ചെയ്താലും—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരു ഭർത്താവിനുള്ളവളാകാൻ” അല്ലെങ്കിൽ “വിവാഹം കഴിക്കാൻ.” ഹീബ്രു പദപ്രയോഗം അക്ഷരാർഥത്തിൽ “ഒരു പുരുഷന്/ഭർത്താവിന് ഉള്ളവളാകുന്നതിൽനിന്ന്” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: 'ഹീബ്രു ഒരു സാങ്കൽപ്പിക നിബന്ധനാശൃംഖല അവതരിപ്പിക്കുന്നു: “ഞാൻ, ‘എനിക്ക് പ്രത്യാശയുണ്ട്’ എന്നു പറഞ്ഞാലും—ഇന്നുരാത്രി എനിക്ക് ഒരു ഭർത്താവുണ്ടാകുകയും പുത്രന്മാരെ പ്രസവിക്കുകയും ചെയ്താലും—”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁבְנָה
  choice: മടങ്ങിപ്പോകുവിൻ
  rationale: സ്ത്രീലിംഗ ബഹുവചന ആജ്ഞ; നവോമിയോടൊപ്പം പോകുന്നതിൽനിന്ന് തിരികെ പോകാൻ രൂത്തിനോടും ഒർപ്പയോടും ആവശ്യപ്പെടുന്ന സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു.
- source_word: בְנֹתַי
  choice: എന്റെ മക്കളേ
  rationale: മരുമക്കളോടുള്ള നവോമിയുടെ കുടുംബസ്നേഹവും ആദരവുമുള്ള അഭിസംബോധന സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ഇവിടെ സ്ത്രീകളെയാണ് അഭിസംബോധന ചെയ്യുന്നതെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: לֵכְןָ
  choice: നിങ്ങളുടെ വഴിക്കു പോകുവിൻ
  rationale: രണ്ടാമത്തെ സ്ത്രീലിംഗ ബഹുവചന ആജ്ഞയെ ആദ്യ ആജ്ഞയിൽനിന്ന് വേർതിരിക്കുകയും അവർ തങ്ങളുടെ വഴിക്കു തുടരണമെന്ന ആശയം സ്വാഭാവികമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: זָקַנְתִּי
  choice: എനിക്ക് വളരെ പ്രായമായിരിക്കുന്നു
  rationale: വാർധക്യം മൂലം വീണ്ടും വിവാഹിതയാകാനുള്ള യാഥാർഥ്യസാധ്യത ഇല്ലെന്ന സന്ദർഭസൂചന നൽകുന്നു; ഹീബ്രുവിലെ ഫലാവസ്ഥയും നിലനിർത്തുന്നു.
- source_word: מִהְיוֹת לְאִישׁ
  choice: ഒരു ഭർത്താവിനുള്ളവളാകാൻ
  rationale: ലְ എന്ന ബന്ധസൂചക പ്രയോഗത്തിന്റെ അസാധാരണമായെങ്കിലും അർഥവത്തായ രൂപം പൂർണമായി ലളിതമാക്കി ‘വിവാഹം കഴിക്കാൻ’ എന്നാക്കാതെ നിലനിർത്തുന്നു; സ്വാഭാവിക പകരങ്ങൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: כִּי אָמַרְתִּי
  choice: എന്നു ഞാൻ പറഞ്ഞാലും
  rationale: ഇവിടെ כִּי സാങ്കൽപ്പിക നിബന്ധനാശൃംഖല ആരംഭിക്കുന്നു; മലയാളത്തിലെ ‘പറഞ്ഞാലും’ വർധിച്ചുവരുന്ന അസാധ്യതയുടെ ഭാവം നൽകുന്നു.
- source_word: יֶשׁ לִי תִקְוָה
  choice: എനിക്ക് പ്രത്യാശയുണ്ട്
  rationale: യֵשׁ לִי എന്ന അസ്തിത്വാധിഷ്ഠിത പ്രയോഗത്തെ മലയാളത്തിൽ സ്വാഭാവികമായും അടുത്തായും അവതരിപ്പിക്കുന്നു; ‘ഇനിയും’ എന്നത് മൂലത്തിൽ വ്യക്തമായി ഇല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല.
- source_word: גַּם הָיִיתִי הַלַּיְלָה לְאִישׁ
  choice: ഇന്നുരാത്രിതന്നെ എനിക്ക് ഒരു ഭർത്താവുണ്ടാകുകയും
  rationale: ഉടൻ ഒരു ഭർത്താവുണ്ടാകുന്ന സാങ്കൽപ്പിക സാഹചര്യം വ്യക്തമാക്കുന്നു; ‘ഇന്നുരാത്രിതന്നെ’ സമയത്തിന്റെ ഊന്നൽ സംരക്ഷിക്കുന്നു, എന്നാൽ വിവാഹച്ചടങ്ങിനെ അനാവശ്യമായി വ്യക്തമാക്കുന്നില്ല.
- source_word: וְגַם יָלַדְתִּי בָנִים
  choice: ഞാൻ പുത്രന്മാരെ പ്രസവിക്കുകയും ചെയ്താലും
  rationale: יָלַד എന്ന പ്രസവക്രിയയും בָנִים എന്ന പുരുഷലിംഗസൂചനയും വ്യക്തമായി നിലനിർത്തുന്നു; വാക്യം അടുത്ത വാക്യത്തിലേക്ക് നീളുന്നതിനാൽ അവസാനത്തിൽ ദീർഘവിരാമചിഹ്നം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: ലേവിരാറ്റ് വിവാഹസന്ദർഭത്തിലെ പുരുഷലിംഗ സന്താനസൂചന
  choice: പുത്രന്മാർ
  alternative: മക്കൾ
  rationale: മൂലപാഠത്തിലെ בָנִים വ്യക്തമായി പുത്രന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്; തുടർന്നുള്ള വിവാഹ-വംശതുടർച്ചാ വാദത്തിനും ഈ പ്രത്യേകത പ്രസക്തമാണ്.
- issue: സാങ്കൽപ്പിക നിബന്ധനാശൃംഖലയുടെ തുറന്ന നില
  choice: ‘പറഞ്ഞാലും … ഉണ്ടാകുകയും … പ്രസവിക്കുകയും ചെയ്താലും—’
  alternative: കാരണം ഞാൻ പറഞ്ഞു …
  rationale: നവോമിയുടെ വാദം അടുത്ത വാക്യത്തിലേക്ക് നീളുന്ന അസംപൂർണ സാങ്കൽപ്പിക ശൃംഖലയാണ്; അതിനെ നിർണ്ണായക പ്രസ്താവനയായി മാറ്റാതെ ദൈവശാസ്ത്രപരവും വാചകപരവുമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ബൈബിൾ സംഭാഷണത്തിന് യോജിച്ച ഗൗരവം നിലനിർത്താൻ ‘പോകുവിൻ’ രൂപം ഉപയോഗിച്ചു. ‘ഭർത്താവിനുള്ളവളാകാൻ’ എന്നത് മൂലത്തിലെ ബന്ധസൂചക അസ്പഷ്ടത സംരക്ഷിക്കുന്നതിനാൽ അല്പം അസാധാരണമാണ്; സ്വാഭാവിക പകരങ്ങൾ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
