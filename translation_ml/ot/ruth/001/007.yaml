source:
  edition: WLC
  text: וַ/תֵּצֵ֗א מִן הַ/מָּקוֹם֙ אֲשֶׁ֣ר הָיְתָה שָׁ֔מָּ/ה וּ/שְׁתֵּ֥י כַלֹּתֶ֖י/הָ עִמָּ֑/הּ וַ/תֵּלַ֣כְנָה בַ/דֶּ֔רֶךְ לָ/שׁ֖וּב אֶל אֶ֥רֶץ יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/007.yaml
  text: So she went out from the place where she had been[a], and her two daughters-in-law with her, and they went on the way to return to the land of Judah.
translation:
  language: ml
  text: അങ്ങനെ അവൾ താൻ ഉണ്ടായിരുന്ന സ്ഥലത്തുനിന്ന് പുറപ്പെട്ടു[a]; അവളുടെ രണ്ടു മരുമക്കളും അവളോടൊപ്പം ഉണ്ടായിരുന്നു. അവർ യെഹൂദാദേശത്തേക്കു മടങ്ങാൻ വഴിയിലൂടെ പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “പുറത്തേക്കു പോയി.” എബ്രായക്രിയയുടെ അക്ഷരാർഥം ‘പുറത്തേക്കു പോകുക’ എന്നാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּצֵא
  choice: അങ്ങനെ അവൾ ... പുറപ്പെട്ടു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അങ്ങനെ’ മുൻവാക്യത്തോടുള്ള ബന്ധം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു. ‘പുറപ്പെട്ടു’ എന്നത് יצא എന്ന ക്രിയയുടെ സഞ്ചാരഭാവം നിലനിർത്തുന്നു.
- source_word: מִן־הַמָּקוֹם אֲשֶׁר הָיְתָה שָׁמָּה
  choice: താൻ താമസിച്ചിരുന്ന സ്ഥലത്തുനിന്ന്
  rationale: ബന്ധവാക്യം നൊവൊമി മുമ്പ് പാർത്തിരുന്ന സ്ഥലത്തെ തിരിച്ചറിയിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി ‘താൻ താമസിച്ചിരുന്ന’ എന്നു നൽകി.
- source_word: וּשְׁתֵּי כַלֹּתֶיהָ עִמָּהּ
  choice: അവളുടെ രണ്ടു മരുമക്കളും അവളോടുകൂടെ ഉണ്ടായിരുന്നു
  rationale: כַּלָּה ഇവിടെ ‘മരുമകൾ’ എന്നാണ്. എബ്രായത്തിലെ കൂടെയുണ്ടായിരുന്നതിന്റെ പ്രസ്താവന വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: וַתֵּלַכְנָה בַדֶּרֶךְ
  choice: അവർ വഴിയിലൂടെ പോയി
  rationale: സ്ത്രീലിംഗ ബഹുവചനക്രിയ മൂന്നു സ്ത്രീകളെയും സൂചിപ്പിക്കുന്നു. ‘വഴിയിലൂടെ പോയി’ യാത്രയുടെ ദൃശ്യഭാവം നിലനിർത്തുന്നു; നടന്നു എന്ന അനാവശ്യ പ്രത്യേകീകരണം ഒഴിവാക്കുന്നു.
- source_word: לָשׁוּב
  choice: മടങ്ങാൻ
  rationale: שׁוּב എന്നതിന്റെ ‘മടങ്ങുക’ എന്ന അർഥവും രൂത്ത് 1-ലെ ആവർത്തിത പ്രമേയവും നിലനിർത്തുന്നു.
- source_word: אֶל־אֶרֶץ יְהוּדָה
  choice: യെഹൂദാദേശത്തേക്ക്
  rationale: אֶרֶץ എന്ന ‘ദേശം/നാട്’ ഘടകം ഒഴിവാക്കാതെ ലക്ഷ്യസ്ഥാനം വ്യക്തമാക്കുന്നു.
