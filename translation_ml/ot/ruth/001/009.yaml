source:
  edition: WLC
  text: יִתֵּ֤ן יְהוָה֙ לָ/כֶ֔ם וּ/מְצֶ֣אןָ מְנוּחָ֔ה אִשָּׁ֖ה בֵּ֣ית אִישָׁ֑/הּ וַ/תִּשַּׁ֣ק לָ/הֶ֔ן וַ/תִּשֶּׂ֥אנָה קוֹלָ֖/ן וַ/תִּבְכֶּֽינָה׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/009.yaml
  text: May Yahweh grant that you find rest[a], each of you in the house of her husband." Then she kissed them, and they lifted up their voices and wept.
translation:
  language: ml
  text: “നിങ്ങൾ ഓരോരുത്തരും താന്താന്റെ ഭർത്താവിന്റെ വീട്ടിൽ സ്വസ്ഥത[a] കണ്ടെത്താൻ യഹോവ ഇടയാക്കട്ടെ.” പിന്നെ അവൾ അവരെ ചുംബിച്ചു. അവർ ശബ്ദമുയർത്തി കരഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വിശ്രമം’, ‘സുരക്ഷിതത്വം’, ‘സ്ഥിരത’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ എബ്രായപദം ഭർത്താവിന്റെ വീട്ടിൽ ലഭിക്കുന്ന സുരക്ഷിതവും സ്ഥിരതയുള്ളതുമായ ജീവിതത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתֵּן יְהוָה ... וּמְצֶאןָ
  choice: നിങ്ങൾ ... കണ്ടെത്താൻ യഹോവ ഇടയാക്കട്ടെ
  rationale: നവോമിയുടെ ആശീർവാദപ്രാർത്ഥനയിലെ ആഗ്രഹാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; തുടർന്നുള്ള ക്രിയയും അതേ ആശംസയുടെ ഭാഗമായി ചേർക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: מְנוּחָה
  choice: സ്വസ്ഥത
  rationale: വിശ്രമം, സുരക്ഷിതത്വം, സ്ഥിരതയുള്ള ജീവിതം എന്നീ അർത്ഥസാധ്യതകൾ ഉൾക്കൊള്ളുന്ന എബ്രായ പദത്തിന്റെ വിശാലത സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ ഇത് പുനർവിവാഹത്തിലൂടെ ലഭിക്കുന്ന സ്ഥിരമായ ഭവനജീവിതത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: אִשָּׁה בֵּית אִישָׁהּ
  choice: നിങ്ങൾ ഓരോരുത്തരും താന്താന്റെ ഭർത്താവിന്റെ വീട്ടിൽ
  rationale: രണ്ടു സ്ത്രീകളെയും പ്രത്യേകം ഉദ്ദേശിക്കുന്ന വിതരണാർഥം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַתִּשַּׁק לָהֶן
  choice: പിന്നെ അവൾ അവരെ ചുംബിച്ചു
  rationale: ലളിതമായ എബ്രായ ആഖ്യാനക്രമം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַתִּשֶּׂאנָה קוֹלָן וַתִּבְכֶּינָה
  choice: അവർ ശബ്ദമുയർത്തി കരഞ്ഞു
  rationale: ഉച്ചത്തിലുള്ള വിലാപത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപവും അർത്ഥവും സംക്ഷിപ്തമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ; കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം പദവിയായി മാറ്റാതെ സൂക്ഷിക്കുന്നു. മലയാള ബൈബിൾ വായനക്കാർക്കിടയിൽ പരിചിതവും മാന്യവുമായ രൂപമായതിനാൽ ‘യഹോവ’ തിരഞ്ഞെടുത്തു; ഉച്ചാരണപുനർനിർമ്മിതിയായ ‘യാഹ്‌വേ’യും സാധ്യമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘സ്വസ്ഥത’ എന്ന പദം മൂലത്തിലെ രൂപകം നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു. സ്ത്രീകളെ പ്രത്യേകം സൂചിപ്പിക്കുന്ന വിതരണാർഥത്തിനായി ‘ഓരോരുത്തരും താന്താന്റെ’ ഉപയോഗിച്ചു.
