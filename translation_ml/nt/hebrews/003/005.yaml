  yaml_path: translation/nt/hebrews/003/005.yaml
  text: And Moses indeed was faithful in all his house as a servant[a], for a testimony of the things that would be spoken later[b],
translation:
  language: ml
  text: മോശെ അവിടുത്തെ ഭവനത്തിലെല്ലാം ഒരു ശുശ്രൂഷകനെന്ന നിലയിൽ വിശ്വസ്തനായിരുന്നു[a]—പിന്നീട് പറയപ്പെടാനിരുന്ന കാര്യങ്ങൾക്കു സാക്ഷ്യമായി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവിടുത്തെ ഭവനം മുഴുവനിലും ഒരു ശുശ്രൂഷകനായി.’ ‘ഭവനം’ എന്ന രൂപകം തുടർന്നുള്ള വാക്യങ്ങളിലും നിലനിൽക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘പറയപ്പെടേണ്ടിയിരുന്ന കാര്യങ്ങൾക്കു സാക്ഷ്യമായി.’ ഈ പ്രയോഗം പിന്നീടുള്ള വെളിപ്പാടിലേക്കു വിരൽചൂണ്ടുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: (പ്രത്യേകമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല)
  rationale: മുൻവാക്യവുമായുള്ള തുടർച്ച മലയാളത്തിലെ വാക്യക്രമത്തിൽ സ്വാഭാവികമായി വ്യക്തമാകുന്നതിനാൽ ‘കൂടാതെ’ എന്നു ചേർക്കുന്നത് അനാവശ്യമായി ഭാരമുള്ളതാകും.
- source_word: Μωϋσῆς μὲν
  choice: മോശെ
  rationale: μὲν അടുത്ത വാക്യത്തിലെ δέ-യോടുള്ള താരതമ്യത്തിന് വഴിയൊരുക്കുന്നു; മലയാളത്തിൽ ആ പ്രതീക്ഷ വാക്യഘടനയും അടുത്ത വാക്യത്തിലെ വിരോധവും സ്വാഭാവികമായി വഹിക്കുന്നതിനാൽ പ്രത്യേകം ‘തീർച്ചയായും’ എന്നു ചേർത്തില്ല.
- source_word: πιστὸς
  choice: വിശ്വസ്തനായിരുന്നു
  rationale: ദൈവത്തിന്റെ സേവനത്തിൽ മോശെയുടെ വിശ്വാസ്യതയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സന്ദർഭോചിതവുമായ പദം.
- source_word: ἐν ὅλῳ τῷ οἴκῳ αὐτοῦ
  choice: അവിടുത്തെ ഭവനത്തിലെല്ലാം
  rationale: സംഖ്യ 12:7-ലെയും എബ്രായർ 3-ലെ തുടർന്നുള്ള വാക്യങ്ങളിലെയും ‘ഭവനം’ എന്ന രൂപകം നിലനിർത്തുന്നു. αὐτοῦ ആരെ സൂചിപ്പിക്കുന്നു എന്നത് ഗ്രീക്കിൽ സന്ദർഭാധീനമാണ്; മലയാളത്തിൽ ആദരസൂചകമായ ‘അവിടുത്തെ’ ദൈവത്തെ സൂചിപ്പിക്കുന്നതായി വായിക്കാം.
- source_word: ὡς θεράπων
  choice: ഒരു ശുശ്രൂഷകനെന്ന നിലയിൽ
  rationale: θεράπων മാന്യമായ സേവനപങ്കിനെ സൂചിപ്പിക്കുന്നു; δοῦλος എന്ന പദത്തിന്റെ അടിമത്തഭാവം ഇറക്കുമതി ചെയ്യാതെ, പുത്രനോടുള്ള അടുത്ത വാക്യത്തിലെ വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: εἰς μαρτύριον
  choice: സാക്ഷ്യമായിത്തീരാൻ
  rationale: εἰς എന്നതിലെ ഉദ്ദേശ്യ/ഫലസൂചന മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τῶν λαληθησομένων
  choice: പിന്നീട് അരുളിച്ചെയ്യപ്പെടാനിരുന്ന കാര്യങ്ങൾക്കു
  rationale: ഭാവികാല കർമണി കൃദന്തത്തിന്റെ മുന്നോട്ടുള്ള സൂചന നിലനിർത്തുന്നു; പറയുന്ന കർത്താവിനെ മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ നാമമായി ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ‘അവിടുത്തെ ഭവനം’ എന്നതിന്റെ അർഥം
  choice: ദൈവജനത്തെയും ദൈവിക ക്രമത്തെയും ഉൾക്കൊള്ളുന്ന ബൈബിളിലെ ‘ഭവനം’ എന്ന രൂപകം നിലനിർത്തി.
  alternative: ‘അവിടുത്തെ കുടുംബം മുഴുവനിലും’
  rationale: ‘ഭവനം’ എന്ന പദം സംഖ്യ 12:7-ലേക്കുള്ള ബന്ധവും എബ്രായർ 3:6-ൽ വികസിക്കുന്ന രൂപകവും സംരക്ഷിക്കുന്നു; അതിനെ വെറും ഗാർഹിക കുടുംബമായി ചുരുക്കുന്നില്ല.
- issue: θεράπων എന്ന പദത്തിന്റെ ഭാവം
  choice: ‘ശുശ്രൂഷകൻ’
  alternative: ‘ദാസൻ’ അല്ലെങ്കിൽ ‘പരിചാരകൻ’
  rationale: മോശെയുടെ മാന്യമായ സേവനപങ്ക് പ്രകടമാക്കുകയും δοῦλος സൂചിപ്പിക്കാവുന്ന ശക്തമായ അടിമത്തഭാവം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- issue: τῶν λαληθησομένων എന്തിനെ സൂചിപ്പിക്കുന്നു
  choice: ‘പിന്നീട് അരുളിച്ചെയ്യപ്പെടാനിരുന്ന കാര്യങ്ങൾ’ എന്ന തുറന്ന മുന്നോട്ടുള്ള സൂചന
  alternative: ‘പിന്നീട് പുത്രനിലൂടെ വെളിപ്പെടുത്തപ്പെടാനിരുന്ന കാര്യങ്ങൾ’
  rationale: സന്ദർഭം പുത്രനിലെ വെളിപ്പാടിലേക്കു ചൂണ്ടാമെങ്കിലും, ഈ വാക്യം തന്നെ ‘പുത്രനിലൂടെ’ എന്നു പറയുന്നില്ല; അതിനാൽ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർത്തില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘ഭവനം’, ‘ശുശ്രൂഷകൻ’, ‘സാക്ഷ്യം’ എന്നീ സഭാപരിചിത പദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന സ്വാഭാവികമാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
