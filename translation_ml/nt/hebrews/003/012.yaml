reference: Hebrews 3:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: βλέπετε, ἀδελφοί, μήποτε ἔσται ἔν τινι ὑμῶν καρδία πονηρὰ ἀπιστίας ἐν τῷ ἀποστῆναι ἀπὸ θεοῦ ζῶντος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/012.yaml
  text: Watch out[a], brothers[c][b], lest there be in any of you an evil heart of unbelief in turning away from the living God.
translation:
  language: ml
  text: സഹോദരന്മാരേ,[a] നിങ്ങളിൽ ആരിലും ജീവനുള്ള ദൈവത്തിൽനിന്ന് അകന്നുപോകുന്നതിലൂടെ അവിശ്വാസം നിറഞ്ഞ ദുഷ്ടഹൃദയം ഉണ്ടാകാതിരിക്കാൻ സൂക്ഷിച്ചുകൊള്ളുക.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സഹോദരന്മാരേ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നത് പുല്ലിംഗ ബഹുവചനമായ ἀδελφοί ആണ്; സഹവിശ്വാസികളായ സ്ത്രീപുരുഷന്മാർ ഉൾപ്പെട്ട ഒരു സമൂഹത്തെയും ഈ പദം അഭിസംബോധന ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ജീവനുള്ള ദൈവത്തിൽനിന്ന് വിട്ടുപോകുന്നതിലൂടെ’ / ‘വീണുപോകുന്നതിലൂടെ.’
    reason: alternative_reading
  - marker: c
    text: അഥവാ, ‘ദുഷ്ടവും വിശ്വാസമില്ലാത്തതുമായ ഹൃദയം.’
    reason: alternative_reading
lexical_decisions:
- source_word: βλέπετε
  choice: സൂക്ഷിച്ചുകൊള്ളുക
  rationale: വർത്തമാനകാല ബഹുവചന ആജ്ഞയുടെ ജാഗ്രതാനിർദേശം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചന സംബോധനയുടെ രൂപം നിലനിർത്തുന്നു; വിശ്വാസികളുടെ സമ്മിശ്ര സമൂഹത്തെയും ഇത് അഭിസംബോധന ചെയ്യാമെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: μήποτε ἔσται ἔν τινι ὑμῶν
  choice: നിങ്ങളിൽ ആരിലും ഉണ്ടാകാതിരിക്കാൻ
  rationale: സമൂഹത്തിലെ ഏതൊരു വ്യക്തിയിലും ഈ അവസ്ഥ ഉണ്ടാകാമെന്ന മുന്നറിയിപ്പ് സ്വാഭാവികമായ മലയാള വാക്യഘടനയിൽ സംരക്ഷിക്കുന്നു.
- source_word: καρδία πονηρά
  choice: ദുഷ്ടഹൃദയം
  rationale: καρδία എന്ന ബൈബിൾപരമായ ആന്തരികകേന്ദ്രത്തിന്റെ രൂപകവും πονηράയുടെ ധാർമിക ഗൗരവവും നിലനിർത്തുന്നു.
- source_word: ἀπιστίας
  choice: അവിശ്വാസത്തിന്റെ
  rationale: എബ്രായർ 3-ലെ ദൈവവചനത്തിൽ വിശ്വസിക്കാത്തതിനെക്കുറിച്ചുള്ള സമീപസന്ദർഭത്തോട് യോജിക്കുന്നു; വിശ്വാസവഞ്ചന എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἐν τῷ ἀποστῆναι
  choice: അകന്നുപോകുന്ന
  rationale: ദൈവത്തിൽനിന്നുള്ള പിന്മാറ്റത്തിന്റെ ഗൗരവം വ്യക്തമാക്കുമ്പോഴും ‘വിശ്വാസത്യാഗം ചെയ്യുക’ എന്ന സാങ്കേതിക ദൈവശാസ്ത്രപദം അനാവശ്യമായി ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: ἀπὸ θεοῦ ζῶντος
  choice: ജീവനുള്ള ദൈവത്തിൽനിന്ന്
  rationale: അനാർത്രസ് ആയിരുന്നാലും സന്ദർഭത്തിൽ നിർദിഷ്ടമായ, ബൈബിൾപരമായി പരിചിതമായ ‘ജീവനുള്ള ദൈവം’ എന്ന പ്രയോഗം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ἀπιστίας എന്നത് ‘അവിശ്വാസം’ എന്നോ ‘വിശ്വാസവഞ്ചന’ എന്നോ പരിഭാഷപ്പെടുത്തണമോ
  choice: അവിശ്വാസം
  alternative: വിശ്വാസവഞ്ചന / വിശ്വാസമില്ലായ്മ
  rationale: സമീപസന്ദർഭം ദൈവത്തിന്റെ വചനം വിശ്വസിക്കാതിരുന്ന ഇസ്രായേലിന്റെ മാതൃകയ്ക്ക് ഊന്നൽ നൽകുന്നു. എങ്കിലും ഈ പദത്തിന്റെ വിശ്വസ്തതക്കുറവ് എന്ന ധാർമിക വശം അടിക്കുറിപ്പിൽ തുറന്നുവയ്ക്കുന്നു.
- issue: ἀποστῆναι എന്നതിന് സാങ്കേതികമായ ‘വിശ്വാസത്യാഗം ചെയ്യുക’ എന്ന ശക്തമായ പ്രയോഗം ഉപയോഗിക്കണമോ
  choice: അകന്നുപോകുക
  alternative: വിട്ടുപോകുക / വീണുപോകുക / വിശ്വാസത്യാഗം ചെയ്യുക
  rationale: മൂലക്രിയ പിന്മാറുക, വിട്ടുപോകുക, അകന്നുപോകുക എന്നീ അർഥങ്ങൾ വഹിക്കുന്നു. തിരഞ്ഞെടുത്ത രൂപം മുന്നറിയിപ്പിന്റെ ഗൗരവം സംരക്ഷിക്കുമ്പോഴും പിന്നീടുള്ള സാങ്കേതിക ദൈവശാസ്ത്രവിഭാഗം വാക്യത്തിൽ അടിച്ചേൽപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മുന്നറിയിപ്പുശൈലി. ‘സൂക്ഷിച്ചുകൊള്ളുക’ എന്ന ബഹുവചന ആജ്ഞയും ‘നിങ്ങളിൽ ആരിലും’ എന്ന വ്യക്തിഗത-സാമൂഹിക വ്യാപ്തിയും നിലനിർത്തി. ‘ഹൃദയം’ എന്ന ബൈബിൾരൂപകം മാറ്റാതെ സൂക്ഷിച്ചു.
