  register: ആധുനിക നിലവാര മലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ‘പിതാക്കന്മാർ’, ‘പ്രവൃത്തികൾ’ എന്നിവ മൂലപദങ്ങളോടുള്ള ഔപചാരിക അടുപ്പം നിലനിർത്തുന്നു; ദുഷ്കരമായ ἐν δοκιμασίᾳ പ്രയോഗവും καί-യുടെ ബന്ധവും അടിക്കുറിപ്പുകളിലൂടെ തുറന്നുവെക്കുന്നു.
