  text: where your fathers tested me by trial and saw my works[b][a],
translation:
  language: ml
  text: അവിടെ നിങ്ങളുടെ പിതാക്കന്മാർ എന്നെ പരീക്ഷിച്ചുനോക്കി[a]; അവർ എന്റെ പ്രവൃത്തികൾ കണ്ടു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പരീക്ഷണത്തിൽ എന്നെ പരീക്ഷിച്ചു’ അല്ലെങ്കിൽ ‘എന്നെ പരീക്ഷിച്ചു.’ ἐν δοκιμασίᾳ എന്ന ഗ്രീക്ക് പ്രയോഗം ദുഷ്കരമാണ്; അത് പരീക്ഷണത്തിന്റെ വിധമോ മാർഗമോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ചില പരിഭാഷകൾ ഈ ഭാഗത്തെ ‘എന്റെ പ്രവൃത്തികൾ കണ്ടിട്ടും’ എന്നു വിരുദ്ധാർഥബന്ധത്തോടെ നൽകുന്നു. എന്നാൽ ഗ്രീക്കിൽ ലളിതമായി ‘കണ്ടു’ എന്നേയുള്ളൂ.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ
  choice: അവിടെ
  rationale: മുൻവാക്യത്തിലെ മരുഭൂമിയെ സൂചിപ്പിക്കുന്ന സ്ഥലവാചകമായതിനാൽ ‘അവിടെ’ എന്ന് പരിഭാഷപ്പെടുത്തി; ‘അപ്പോൾ’ എന്ന കാലവാചകവും സന്ദർഭത്തിൽ സാധ്യമെങ്കിലും സ്ഥലാർഥമാണ് നേരിട്ടുള്ളത്.
- source_word: ἐπείρασαν
  choice: പരീക്ഷിച്ചു
  rationale: ദൈവത്തെ പ്രകോപനപരമായി പരീക്ഷിച്ചു നോക്കുക എന്ന സങ്കീർത്തനം 95-ലെ ആശയം ലളിതവും നേരിട്ടുമായി നിലനിർത്തുന്നു.
- source_word: οἱ πατέρες ὑμῶν
  choice: നിങ്ങളുടെ പിതാക്കന്മാർ
  rationale: മൂലത്തിലെ പുരുഷലിംഗ ബഹുവചനവും ചരിത്ര-ഉടമ്പടി ഭാഷാശൈലിയും നേരിട്ട് നിലനിർത്തുന്നു; ‘പൂർവികർ’ എന്നത് കൂടുതൽ ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക ബദലാണ്.
- source_word: ἐν δοκιμασίᾳ
  choice: പരീക്ഷണത്തിലൂടെ
  rationale: ἐν എന്നതിന്റെ മാർഗം/വിധം സൂചിപ്പിക്കുന്ന സാധ്യത മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ദുഷ്കരമായ പ്രയോഗത്തിന്റെ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: καὶ εἶδον
  choice: കാണുകയും ചെയ്തു
  rationale: ഗ്രീക്കിലെ ലളിതമായ καί-ബന്ധം അതേപടി നിലനിർത്തുന്നു; ‘കണ്ടിട്ടും’ എന്ന concessive വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: τὰ ἔργα μου
  choice: എന്റെ പ്രവൃത്തികൾ
  rationale: മരുഭൂമിയിൽ ദൈവം ചെയ്ത പ്രവർത്തനങ്ങളെ സൂചിപ്പിക്കുന്ന ἔργα എന്ന പദത്തിന്റെ രൂപവും തിരുവെഴുത്തുഭാഷയിലെ പ്രതിധ്വനിയും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: പരീക്ഷിക്കപ്പെട്ടത് ആരെന്നത്
  choice: എന്നെ പരീക്ഷിച്ചു
  alternative: പരീക്ഷിച്ചു
  rationale: SBLGNT-യിലെ ഈ ഉപവാക്യത്തിൽ ‘എന്നെ’ എന്ന കർമപദം പ്രത്യക്ഷമായി ഇല്ലെങ്കിലും സങ്കീർത്തനം 95-ലെ ഉദ്ധരണിയുടെ സന്ദർഭവും വാക്യത്തിന്റെ ഒഴുക്കും ദൈവമാണ് ഉദ്ദേശിക്കപ്പെട്ട കർമമെന്ന് വ്യക്തമാക്കുന്നു. മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി ‘എന്നെ’ ചേർത്തു.
- issue: പ്രവൃത്തികൾ കണ്ടതും പരീക്ഷിച്ചതും തമ്മിലുള്ള ബന്ധം
  choice: എന്റെ പ്രവൃത്തികൾ അവർ കാണുകയും ചെയ്തു
  alternative: എന്റെ പ്രവൃത്തികൾ കണ്ടിട്ടും
  rationale: സന്ദർഭത്തിൽ concessive ആശയം തോന്നാമെങ്കിലും ഗ്രീക്കിൽ ‘കൂടാതെ/ഉം’ എന്ന ലളിതമായ καί മാത്രമേയുള്ളൂ; അതിനാൽ ദൈവത്തിന്റെ പ്രവൃത്തികൾ കണ്ടിട്ടും പരീക്ഷിച്ചു എന്ന വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ നിർബന്ധിച്ചിട്ടില്ല.
