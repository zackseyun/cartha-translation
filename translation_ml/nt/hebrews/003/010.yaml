source:
  edition: SBLGNT
  text: τεσσεράκοντα ἔτη· διὸ προσώχθισα τῇ γενεᾷ ⸀ταύτῃ καὶ εἶπον· Ἀεὶ πλανῶνται τῇ καρδίᾳ· αὐτοὶ δὲ οὐκ ἔγνωσαν τὰς ὁδούς μου·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/010.yaml
  text: For forty years[a], therefore, I was provoked with this generation, and said, ‘They always go astray in their hearts[b], but they have not known my ways.’
translation:
  language: ml
  text: 'അതുകൊണ്ട്, നാല്പതു വർഷം[a] ഈ തലമുറയോട് എനിക്കു കടുത്ത അസന്തോഷം തോന്നി; ഞാൻ പറഞ്ഞു: ‘അവർ തങ്ങളുടെ ഹൃദയത്തിൽ[b] എപ്പോഴും വഴിതെറ്റിപ്പോകുന്നു; എന്നാൽ എന്റെ വഴികൾ അവർ അറിഞ്ഞിട്ടില്ല.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഈ തലമുറയോടു ഞാൻ കോപിച്ചു’ എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്ക് ക്രിയയ്ക്ക് കടുത്ത അസന്തോഷമോ അറപ്പോ പ്രകടിപ്പിക്കാനാകും.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ ‘ഹൃദയത്തിൽ’ എന്ന് ഏകവചനമാണ്; തലമുറയെ ഒരു സമൂഹമൊട്ടാകെ കണക്കാക്കുന്നതാകാം. ‘തങ്ങളുടെ ഹൃദയങ്ങളിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: τεσσεράκοντα ἔτη
  choice: നാല്പതു വർഷം
  rationale: കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന accusative പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി ‘നാല്പതു വർഷം’ എന്നു നൽകുന്നു.
- source_word: διὸ
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യത്തിൽനിന്നുള്ള ഫലമോ നിഗമനമോ വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളബന്ധപദം.
- source_word: προσώχθισα
  choice: കടുത്ത അസന്തോഷം തോന്നി
  rationale: ക്രിയയിലെ ശക്തമായ അനിഷ്ടവും അസന്തോഷവും നിലനിർത്തുന്നു; വെറും കോപമായോ അതിലേറെ ശക്തമായ വെറുപ്പായോ അർഥം ചുരുക്കുന്നില്ല.
- source_word: τῇ γενεᾷ ταύτῃ
  choice: ഈ തലമുറയോടു
  rationale: ക്രിയയോടു ചേർന്ന ദത്തിവിന്റെ ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി ‘-യോടു’ എന്നുപറയുന്നു.
- source_word: Ἀεὶ πλανῶνται
  choice: എപ്പോഴും വഴിതെറ്റിപ്പോകുന്നു
  rationale: തുടർച്ചയായ ധാർമിക-ആത്മീയ വ്യതിചലനം ലളിതവും വ്യക്തവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τῇ καρδίᾳ
  choice: തങ്ങളുടെ ഹൃദയത്തിൽ
  rationale: ഗ്രീക്കിലെ ഏകവചനമായ ‘ഹൃദയം’ നിലനിർത്തി തലമുറയെ ഒരു സമൂഹമൊട്ടാകെ കാണുന്ന സാധ്യത സംരക്ഷിക്കുന്നു.
- source_word: αὐτοὶ δὲ οὐκ ἔγνωσαν
  choice: അവർ അറിഞ്ഞിട്ടില്ല
  rationale: δέയിലെ വ്യത്യാസഭാവം മലയാളത്തിലെ അർദ്ധവിരാമവും വാക്യക്രമവും പ്രകടമാക്കുന്നു; perfect രൂപം അവരുടെ പരാജയത്തിന്റെ നിലനിൽക്കുന്ന ഫലം സൂചിപ്പിക്കുന്നു.
- source_word: τὰς ὁδούς μου
  choice: എന്റെ വഴികൾ
  rationale: ദൈവത്തിന്റെ പ്രവർത്തനരീതിയും അവൻ നിർദേശിക്കുന്ന ജീവിതമാർഗവും ഉൾക്കൊള്ളുന്ന ബൈബിൾ രൂപകം നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: προσώχθισα എന്ന പദത്തിലെ ദൈവിക അസന്തോഷത്തിന്റെ തീവ്രത
  choice: കടുത്ത അസന്തോഷം തോന്നി
  alternative: കോപിച്ചു; വെറുത്തു
  rationale: ദൈവത്തിന്റെ യഥാർഥവും ശക്തവുമായ ഉടമ്പടിസംബന്ധിയായ അസന്തോഷം പ്രകടിപ്പിക്കുമ്പോഴും ഗ്രീക്ക് അനുവദിക്കുന്നതിലധികം അതിനെ ‘വെറുപ്പ്’ എന്നാക്കി ശക്തിപ്പെടുത്തുകയോ വെറും ‘കോപം’ എന്നാക്കി ചുരുക്കുകയോ ചെയ്യുന്നില്ല.
- issue: τῇ καρδίᾳയിലെ സമൂഹവാചക ഏകവചനം
  choice: തങ്ങളുടെ ഹൃദയത്തിൽ
  alternative: തങ്ങളുടെ ഹൃദയങ്ങളിൽ
  rationale: തലമുറയെ ഒരു സമൂഹമൊട്ടാകെ കാണുന്ന ഗ്രീക്ക് ഏകവചനത്തിന്റെ സാധ്യത സംരക്ഷിക്കുന്നു; മലയാളത്തിലും ഈ കൂട്ടായ പ്രയോഗം ഗ്രഹിക്കാവുന്നതാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. സങ്കീർത്തന ഉദ്ധരണിയുടെ കാവ്യാത്മക-ന്യായവിധി ഭാവം സൂക്ഷിച്ചിരിക്കുന്നു; അപൂർവമോ വിഭാഗീയമോ ആയ പദാവലി ഒഴിവാക്കി.
