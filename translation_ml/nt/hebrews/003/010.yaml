revisions:
- from: 'അതുകൊണ്ട് നാല്പതു വർഷം[a] ഞാൻ ഈ തലമുറയോടു കടുത്ത അസന്തോഷം തോന്നി പറഞ്ഞു: ‘അവർ തങ്ങളുടെ ഹൃദയത്തിൽ[b] എപ്പോഴും വഴിതെറ്റിപ്പോകുന്നു; എന്റെ വഴികൾ അവർ അറിഞ്ഞിട്ടില്ല.’'
  to: 'അതുകൊണ്ട്, നാല്പതു വർഷം[a] ഈ തലമുറയോട് എനിക്കു കടുത്ത അസന്തോഷം തോന്നി; ഞാൻ പറഞ്ഞു: ‘അവർ തങ്ങളുടെ ഹൃദയത്തിൽ[b] എപ്പോഴും വഴിതെറ്റിപ്പോകുന്നു; എന്നാൽ എന്റെ വഴികൾ അവർ അറിഞ്ഞിട്ടില്ല.’'
  rationale: The revision corrects the Malayalam grammar of the divine-displeasure clause by using a dative experiencer, while retaining the lexical restraint of ‘കടുത്ത അസന്തോഷം.’ It also makes the adversative force of δέ explicit with ‘എന്നാൽ.’ The duration, inferential ‘അതുകൊണ്ട്,’ collective-singular heart, and present-perfect sense of ‘അറിഞ്ഞിട്ടില്ല’ are preserved.
