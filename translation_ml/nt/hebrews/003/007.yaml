id: HEB.3.7
reference: Hebrews 3:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Διό, καθὼς λέγει τὸ πνεῦμα τὸ ἅγιον· Σήμερον ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/007.yaml
  text: 'Therefore, just as the Holy Spirit says: “Today, if you hear his voice,”'
translation:
  language: ml
  text: 'അതുകൊണ്ട്, പരിശുദ്ധാത്മാവ് പറയുന്നതുപോലെ: “ഇന്ന് നിങ്ങൾ അവന്റെ ശബ്ദം കേൾക്കുന്നെങ്കിൽ,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διό
  choice: അതുകൊണ്ട്
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: καθὼς
  choice: പറയുന്നതുപോലെ
  rationale: ഉദ്ധരണി അവതരിപ്പിക്കുന്ന താരതമ്യസൂത്രം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു; λέγει എന്ന ക്രിയയോടു ചേർത്താണ് പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നത്.
- source_word: λέγει
  choice: പറയുന്നു
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാലത്തെ നിലനിർത്തി തിരുവെഴുത്തിലൂടെ ഇപ്പോഴും മുഴങ്ങുന്ന വാക്കെന്ന അവതരണശക്തി സംരക്ഷിക്കുന്നു.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: പരിശുദ്ധാത്മാവ്
  rationale: വ്യക്തവും പ്രചാരത്തിലുള്ളതുമായ നേരിട്ടുള്ള തർജമ; ഗ്രീക്കിലില്ലാത്ത ഊന്നൽ ചേർക്കുന്നില്ല.
- source_word: Σήμερον
  choice: ഇന്ന്
  rationale: സങ്കീർത്തന ഉദ്ധരണിയിലെ കാലസൂചന നേരിട്ട്, സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐὰν
  choice: എങ്കിൽ
  rationale: നിബന്ധനയെ നേരിട്ട് സൂചിപ്പിക്കുന്നു; മലയാളവാക്യക്രമത്തിൽ ക്രിയയോടു ചേർന്ന് ‘കേൾക്കുന്നെങ്കിൽ’ എന്നായി വരുന്നു.
- source_word: τῆς φωνῆς αὐτοῦ
  choice: അവന്റെ ശബ്ദം
  rationale: വ്യക്തിപരമായ ‘voice’ എന്ന അർഥം നിലനിർത്തുന്നു; വെറും ശബ്ദധ്വനിയായി ചുരുക്കുന്നില്ല.
- source_word: ἀκούσητε
  choice: നിങ്ങൾ ... കേൾക്കുന്നെങ്കിൽ
  rationale: ἐὰν സഹിതമുള്ള നിബന്ധന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. ‘അനുസരിക്കുക’ എന്നു വിപുലീകരിക്കാതെ കേൾക്കുക എന്ന അടിസ്ഥാനാർഥം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: സങ്കീർത്തന ഉദ്ധരണിയുടെ വക്താവാരെന്ന നിർദേശം
  choice: ഉദ്ധരണി പരിശുദ്ധാത്മാവ് പറയുന്നതായി നേരിട്ട് അവതരിപ്പിക്കുന്നു.
  alternative: പരിശുദ്ധാത്മാവ് തിരുവെഴുത്തിലൂടെയോ സങ്കീർത്തനകാരനിലൂടെയോ പറയുന്നു.
  rationale: ഗ്രീക്ക് പാഠം വ്യക്തമായി ‘പരിശുദ്ധാത്മാവ് പറയുന്നു’ എന്നാണ്. പ്രചോദനത്തെക്കുറിച്ചുള്ള കൂടുതൽ വിശദീകരണം ചേർക്കാതെ ആ നേരിട്ടുള്ള നിർദേശം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. വാക്യം അടുത്ത വാക്യത്തിൽ തുടരുന്നതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തിയിരിക്കുന്നു.
