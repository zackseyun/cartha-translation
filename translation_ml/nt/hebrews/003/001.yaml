id: HEB.3.1
reference: Hebrews 3:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὅθεν, ἀδελφοὶ ἅγιοι, κλήσεως ἐπουρανίου μέτοχοι, κατανοήσατε τὸν ἀπόστολον καὶ ἀρχιερέα τῆς ὁμολογίας ἡμῶν ⸀Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/001.yaml
  text: Therefore[a], holy brothers, sharers in a heavenly calling, consider Jesus, the apostle and high priest of our confession[c][b],
translation:
  language: ml
  text: അതുകൊണ്ട്, വിശുദ്ധ സഹോദരന്മാരേ[a], സ്വർഗീയമായ വിളിയിൽ പങ്കാളികളായവരേ[b], നമ്മുടെ ഏറ്റുപറച്ചിലിന്റെ അപ്പോസ്തലനും മഹാപുരോഹിതനുമായ യേശുവിനെ ശ്രദ്ധാപൂർവം പരിഗണിക്കുവിൻ.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സഹോദരന്മാർ’ എന്ന അഭിസംബോധന ഇവിടെ സ്ത്രീകളുൾപ്പെടെയുള്ള മുഴുവൻ വിശ്വാസിസമൂഹത്തെയും ഉദ്ദേശിക്കുന്നു.
    reason: cultural_note
  - marker: b
    text: 'അഥവാ: ‘സ്വർഗീയമായ വിളിയിൽ പങ്കുചേരുന്നവരേ.’'
    reason: lexical_alternative
  - marker: c
    text: 'മറ്റൊരു സാധ്യത: ‘നാം ഏറ്റുപറയുന്നവനായ യേശുവിനെ—അപ്പോസ്തലനെയും മഹാപുരോഹിതനെയും—ശ്രദ്ധാപൂർവം പരിഗണിക്കുവിൻ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅθεν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാദത്തിൽനിന്ന്, പ്രത്യേകിച്ച് 2:17–18-ൽനിന്ന്, നിഗമനം അവതരിപ്പിക്കുന്ന ബന്ധകത്തിന്റെ അനുമാനാത്മക ബലം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀδελφοὶ ἅγιοι
  choice: വിശുദ്ധ സഹോദരന്മാരേ
  rationale: പുരുഷലിംഗ ബഹുവചനമായ അഭിസംബോധനയുടെ രൂപവും ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ട സമൂഹമെന്ന ‘വിശുദ്ധ’ എന്ന പദത്തിന്റെ ഉടമ്പടിസംബന്ധമായ ഭാവവും നിലനിർത്തുന്നു; സ്ത്രീകളും ഉൾപ്പെടുന്ന വിശ്വാസിസമൂഹത്തെയാണ് ഇത് അഭിസംബോധന ചെയ്യുന്നതെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: κλήσεως ἐπουρανίου
  choice: സ്വർഗീയമായ വിളിയിൽ
  rationale: ദൈവികമായ വിളിയുടെ സ്വർഗീയ ഉറവിടവും സ്വഭാവവും തുറന്ന നിലയിൽ സൂക്ഷിക്കുന്നു; നിർദേശക അവ്യയം ഇല്ലാത്ത ഗ്രീക്ക് പ്രയോഗത്തെ അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: μέτοχοι
  choice: പങ്കാളികളായവരേ
  rationale: ഒന്നിൽ യഥാർഥമായി പങ്കുചേരുന്നവരെ സൂചിപ്പിക്കുന്ന പങ്കാളിത്തഭാവം വ്യക്തവും ആധുനികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: κατανοήσατε
  choice: ശ്രദ്ധാപൂർവം പരിഗണിക്കുവിൻ
  rationale: കേവലം ഓർക്കുക എന്നതിലുപരി ഏകാഗ്രമായ നിരീക്ഷണവും ചിന്തയും ആവശ്യപ്പെടുന്ന ആജ്ഞയുടെ ബലം വ്യക്തമാക്കുന്നു.
- source_word: ἀπόστολον
  choice: അപ്പോസ്തലൻ
  rationale: ദൈവത്താൽ അയക്കപ്പെട്ടവൻ എന്ന ഭാവമുള്ള, ഇവിടെ യേശുവിന് പ്രയോഗിച്ചിരിക്കുന്ന വിശിഷ്ട ശീർഷകം വ്യാഖ്യാനിച്ച് ലഘൂകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: ἀρχιερέα
  choice: മഹാപുരോഹിതൻ
  rationale: യഹൂദ ആരാധനാപരമായ പദവിക്കും എബ്രായലേഖനത്തിലെ മുഖ്യ പ്രമേയത്തിനും അനുയോജ്യമായ സ്ഥാപിത മലയാള പദം.
- source_word: τῆς ὁμολογίας ἡμῶν
  choice: നമ്മുടെ ഏറ്റുപറച്ചിലിന്റെ
  rationale: വിശ്വാസിസമൂഹം പരസ്യമായി അംഗീകരിക്കുകയും പ്രഖ്യാപിക്കുകയും ചെയ്യുന്ന ഏറ്റുപറച്ചിലിന്റെ ഭാവം നിലനിർത്തുന്നു; ഈ ജനിറ്റീവ് രണ്ട് ശീർഷകങ്ങളോടും ബന്ധപ്പെടാവുന്ന വിധത്തിൽ വാക്യം ക്രമീകരിച്ചിരിക്കുന്നു.
- source_word: Ἰησοῦν
  choice: യേശു
  rationale: പേരിന്റെ മലയാളത്തിൽ സ്ഥാപിതമായ രൂപം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: ἀδελφοὶ എന്ന ലിംഗസൂചക അഭിസംബോധന
  choice: മുഖ്യപാഠത്തിൽ ‘സഹോദരന്മാരേ’ എന്ന് നൽകി, ഉൾക്കൊള്ളുന്ന സമൂഹാർത്ഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുക.
  alternative: ‘സഹോദരീസഹോദരന്മാരേ’ അല്ലെങ്കിൽ ‘സഹോദരങ്ങളേ’.
  rationale: ഗ്രീക്കിന്റെ വ്യാകരണപരമായ പുരുഷലിംഗ ബഹുവചനം സംരക്ഷിക്കുമ്പോഴും അഭിസംബോധന മുഴുവൻ വിശ്വാസിസമൂഹത്തെയും—സ്ത്രീകളുൾപ്പെടെ—ഉദ്ദേശിക്കുന്നുവെന്നത് മറച്ചുവയ്ക്കുന്നില്ല.
- issue: യേശുവിന് ἀπόστολος എന്ന ശീർഷകം
  choice: ‘അപ്പോസ്തലൻ’ എന്ന ശീർഷകം നിലനിർത്തുക.
  alternative: ‘അയക്കപ്പെട്ടവൻ’ അല്ലെങ്കിൽ ‘ദൂതൻ’.
  rationale: വാക്യം യേശുവിന് നേരിട്ട് നൽകുന്ന ശീർഷകത്തിന്റെ സാഹിത്യ-ദൈവശാസ്ത്ര ബലം സംരക്ഷിക്കുകയും പിന്നീടുള്ള സഭാപദവി സംബന്ധമായ വ്യത്യാസങ്ങൾ പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: τῆς ὁμολογίας ἡμῶν എന്നതിന്റെ ബന്ധം
  choice: ‘നമ്മുടെ ഏറ്റുപറച്ചിലിന്റെ അപ്പോസ്തലനും മഹാപുരോഹിതനും’ എന്ന് രണ്ട് ശീർഷകങ്ങളോടും ബന്ധിപ്പിക്കുക.
  alternative: ‘നാം ഏറ്റുപറയുന്ന യേശുവിനെ—അപ്പോസ്തലനെയും മഹാപുരോഹിതനെയും—’.
  rationale: ജനിറ്റീവ് പ്രയോഗത്തിന്റെ സ്വാഭാവിക ഘടന സംരക്ഷിക്കുന്നു; എന്നാൽ ‘നാം ഏറ്റുപറയുന്നവൻ’ എന്ന വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ‘പരിഗണിക്കുവിൻ’ എന്ന ബഹുമാനപൂർവ ബഹുവചന ആജ്ഞ വേദപാഠത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു; ദുർഗ്രാഹ്യമായ അതിപുരാതന പദങ്ങൾ ഒഴിവാക്കിയിരിക്കുന്നു.
