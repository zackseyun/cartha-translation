review_pass:
  verdict: revise
  source_fidelity: The draft retains the contrast, Son/house imagery, and real condition. However, its final clause reverses the source's assertion-condition order, and the wording for authority over the house can be more idiomatic and precise in Malayalam.
  naturalness: ‘അവന്റെ ഭവനത്തിന്മേൽ’ is less natural for supervisory authority, and ‘പ്രത്യാശയെച്ചൊല്ലിയുള്ള’ is somewhat formal and less direct than current standard usage. Placing the conditional clause after the identification of the house also follows the Greek more closely while reading smoothly.
  terminology: ‘മശീഹാ,’ ‘പുത്രൻ,’ ‘ഭവനം,’ ‘ധൈര്യം,’ and ‘പ്രത്യാശ’ are suitable. ‘അഭിമാനം’ appropriately preserves the potentially strong rhetorical force of καύχημα without doctrinal expansion.
  issues:
  - severity: low
    issue: The condition is placed before ‘we are that house.’
    rationale: The draft does preserve conditionality, but the Greek first states ‘whose house we are’ and then qualifies it with the ἐὰν clause. Restoring that order better reflects the source and avoids making the identification sound merely consequential.
  - severity: low
    issue: ‘അവന്റെ ഭവനത്തിന്മേൽ’ may suggest physical location rather than oversight.
    rationale: ‘അവന്റെ ഭവനത്തിനുമേൽ’ is a more natural Malayalam expression for the authority denoted by ἐπὶ τὸν οἶκον αὐτοῦ.
