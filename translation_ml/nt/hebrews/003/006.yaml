revisions:
- from: എന്നാൽ മശീഹാ[a] അവന്റെ ഭവനത്തിന്മേൽ പുത്രനായി വിശ്വസ്തനായിരുന്നു. നമുക്കുള്ള ധൈര്യവും[b] പ്രത്യാശയെച്ചൊല്ലിയുള്ള അഭിമാനവും[c] നാം മുറുകെപ്പിടിച്ചാൽ, ആ ഭവനം നാം തന്നെയാണ്.
  to: എന്നാൽ മശീഹാ[a] അവന്റെ ഭവനത്തിനുമേൽ ഒരു പുത്രനെന്ന നിലയിൽ വിശ്വസ്തനായിരുന്നു; നാം ആ ഭവനമാണ്—നാം ധൈര്യവും[b] പ്രത്യാശയെക്കുറിച്ചുള്ള അഭിമാനവും[c] മുറുകെപ്പിടിക്കുന്നുവെങ്കിൽ.
  rationale: The revision preserves the supplied elliptical predicate ‘വിശ്വസ്തനായിരുന്നു’ in line with the immediate context and English audit trail, while improving the Malayalam expression of authority, restoring the source order of the main assertion and condition, and using more current idiom for the relation of hope to boasting. The pronoun ‘അവന്റെ’ is retained without resolving its referent beyond the Greek.
