id: HEB.3.6
reference: Hebrews 3:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Χριστὸς δὲ ὡς υἱὸς ἐπὶ τὸν οἶκον αὐτοῦ· ⸀ὃς οἶκός ἐσμεν ἡμεῖς, ⸀ἐὰν τὴν παρρησίαν καὶ τὸ καύχημα τῆς ⸀ἐλπίδος κατάσχωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/006.yaml
  text: But the Messiah was faithful as a Son over his house[a], whose house we are[c][b], if we hold fast our boldness and the boast of our hope.
translation:
  language: ml
  text: എന്നാൽ മശീഹാ[a] അവന്റെ ഭവനത്തിനുമേൽ ഒരു പുത്രനെന്ന നിലയിൽ വിശ്വസ്തനായിരുന്നു; നാം ആ ഭവനമാണ്—നാം ധൈര്യവും[b] പ്രത്യാശയെക്കുറിച്ചുള്ള അഭിമാനവും[c] മുറുകെപ്പിടിക്കുന്നുവെങ്കിൽ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മശീഹാ’ എന്നതിനുപകരം ‘ക്രിസ്തു’ എന്നും പരിഭാഷപ്പെടുത്താം. Χριστός എന്ന ഗ്രീക്ക് പദം സ്ഥാനപ്പേരായോ പേരുപോലുള്ള സംജ്ഞയായോ പ്രവർത്തിക്കാം.
    reason: alternative_reading
  - marker: b
    text: ‘ധൈര്യം’ എന്നതിനുപകരം ‘ആത്മവിശ്വാസം’ എന്നും പരിഭാഷപ്പെടുത്താം. παρρησία എന്ന ഗ്രീക്ക് പദത്തിന് തുറന്നുപറച്ചിൽ, സ്വാതന്ത്ര്യം, ഉറച്ച ധൈര്യം എന്നീ ഭാവങ്ങളുണ്ട്.
    reason: lexical_alternative
  - marker: c
    text: ‘പ്രത്യാശയെക്കുറിച്ചുള്ള അഭിമാനം’ എന്നതിന് ‘പ്രത്യാശയിൽനിന്നുള്ള ആത്മവിശ്വാസം’ അല്ലെങ്കിൽ ‘പ്രത്യാശയിലുള്ള ആഹ്ലാദം’ എന്നും പരിഭാഷപ്പെടുത്താം. καύχημα എന്ന ഗ്രീക്ക് പദത്തിന് അഭിമാനം, അഭിമാനത്തിന്റെ ആധാരം, ആഹ്ലാദപൂർണമായ ആത്മവിശ്വാസം എന്നീ അർഥങ്ങളാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς
  choice: മശീഹാ
  rationale: മോശെയുമായുള്ള താരതമ്യത്തിൽ അഭിഷിക്തനായ ദൈവിക പ്രതിനിധി എന്ന സ്ഥാനപ്പേരിന്റെ ഭാവം സജീവമായതിനാൽ ‘മശീഹാ’ എന്നു പരിഭാഷപ്പെടുത്തി; ‘ക്രിസ്തു’ എന്ന പേരുപോലുള്ള പ്രയോഗസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ മോശെയെക്കുറിച്ചുള്ള പ്രസ്താവനയുമായി ഇവിടെ വരുന്ന വൈരുധ്യം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ὡς υἱὸς
  choice: പുത്രനായി
  rationale: ὡς എന്ന താരതമ്യാത്മക ഭാവവും υἱός എന്ന ബന്ധപദവും ചുരുക്കമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: ἐπὶ τὸν οἶκον αὐτοῦ
  choice: അവന്റെ ഭവനത്തിന്മേൽ
  rationale: ἐπί ഇവിടെ അധികാരത്തിന്റെയും മേൽനോട്ടത്തിന്റെയും അർഥം നൽകുന്നു. ‘ഭവനം’ എന്നത് ദൈവജനത്തെ സൂചിപ്പിക്കുന്ന രൂപകം നിലനിർത്തുന്നു; ‘അവന്റെ’ എന്ന സർവനാമത്തിന്റെ പരാമർശം വ്യാഖ്യാനിച്ച് പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: πιστός (elliptically supplied from the preceding context)
  choice: വിശ്വസ്തനായിരുന്നു
  rationale: ഗ്രീക്കിൽ മുൻസന്ദർഭത്തിൽനിന്ന് മനസ്സിലാക്കേണ്ട വിധം വിട്ടുപോയിരിക്കുന്ന വിശേഷണഘടകം മലയാളത്തിൽ പൂർണ്ണവും സ്വാഭാവികവുമായ വാക്യത്തിനായി പ്രകടമാക്കി.
- source_word: ὃς οἶκός ἐσμεν ἡμεῖς
  choice: ആ ഭവനം നാം തന്നെയാണ്
  rationale: ദൈവജനമാണ് ഭവനം എന്ന രൂപകം വ്യക്തമായി നിലനിർത്തുകയും ἡμεῖς എന്ന ഊന്നൽ ‘നാം തന്നെയാണ്’ എന്നു പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐὰν
  choice: എങ്കിൽ / -ആൽ
  rationale: ‘മുറുകെപ്പിടിച്ചാൽ’ എന്ന സോപാധിക ക്രിയാരൂപത്തിലൂടെ യഥാർഥ വ്യവസ്ഥ പ്രകടമാക്കുന്നു; അതിനെക്കുറിച്ചുള്ള പ്രത്യേക സിദ്ധാന്തനിഗമനം ചേർക്കുന്നില്ല.
- source_word: παρρησίαν
  choice: ധൈര്യം
  rationale: തുറന്നുപറയാനുള്ള സ്വാതന്ത്ര്യവും ഉറച്ച ആത്മവിശ്വാസവും ഉൾക്കൊള്ളുന്ന ധീരതയുടെ ഭാവം നൽകുന്നു; മറ്റൊരു യുക്തമായ അർഥം അടിക്കുറിപ്പിൽ ചേർത്തിരിക്കുന്നു.
- source_word: καύχημα
  choice: അഭിമാനം
  rationale: ഒരാൾ അഭിമാനിക്കുകയോ പ്രശംസിക്കുകയോ ചെയ്യുന്ന കാര്യം എന്ന നാമരൂപത്തിന്റെ വാചാടോപശക്തി നിലനിർത്തുന്നു; വെറും ‘ആത്മവിശ്വാസം’ എന്നു മൃദൂകരിക്കുന്നില്ല.
- source_word: τῆς ἐλπίδος
  choice: പ്രത്യാശയെച്ചൊല്ലിയുള്ള
  rationale: καύχημαയും ἐλπίςഉം തമ്മിലുള്ള ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; പ്രത്യാശയാണ് ഈ അഭിമാനത്തിന്റെ ആധാരമെന്ന ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: κατάσχωμεν
  choice: നാം മുറുകെപ്പിടിച്ചാൽ
  rationale: തുടർന്നും ഉറച്ചുനിൽക്കുന്ന പിടിച്ചുനിൽപ്പിന്റെ പ്രബോധനാത്മക ശക്തി മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: Χριστός എന്നത് സ്ഥാനപ്പേരായോ പേരുപോലുള്ള പ്രയോഗമായോ പരിഭാഷപ്പെടുത്തുക
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: മോശെയും പുത്രനും തമ്മിലുള്ള രക്ഷാചരിത്രപരമായ താരതമ്യത്തിൽ സ്ഥാനപ്പേരിന്റെ ഭാവം പ്രസക്തമാണ്; എന്നാൽ പേരുപോലുള്ള വായനയും സാധുവായതിനാൽ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- issue: ἐὰν ... κατάσχωμεν എന്ന വ്യവസ്ഥയുടെ ശക്തി
  choice: നാം മുറുകെപ്പിടിച്ചാൽ
  alternative: നാം തീർച്ചയായും മുറുകെപ്പിടിക്കുന്നപക്ഷം
  rationale: ഗ്രീക്ക് ഒരു യഥാർഥ വ്യവസ്ഥ പ്രസ്താവിക്കുന്നു. ലളിതമായ സോപാധിക രൂപം ആ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം നിലനിർത്തുന്നു; സ്ഥിരോത്സാഹത്തെയോ വിശ്വാസത്യാഗത്തെയോ കുറിച്ചുള്ള വിഭാഗീയ വിശദീകരണം ചേർക്കുന്നില്ല.
- issue: αὐτοῦ എന്ന സർവനാമം ആരെ സൂചിപ്പിക്കുന്നു
  choice: അവന്റെ
  alternative: ദൈവത്തിന്റെ
  rationale: സന്ദർഭം ദൈവത്തിന്റെ ഭവനം എന്ന വായനയെ ശക്തമായി പിന്തുണയ്ക്കുന്നുവെങ്കിലും, സർവനാമത്തെ വ്യക്തമായ നാമമാക്കി മാറ്റാതെ മൂലത്തിലെ സൂചനാഭാവം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. ‘ഭവനം’ എന്ന പദം οἶκος എന്ന രൂപകത്തെ നിലനിർത്തുന്നു; ‘വീട്’ എന്നതിനെക്കാൾ ഈ ഗൗരവമുള്ള സന്ദർഭത്തിന് അനുയോജ്യമാണ്. വാക്യക്രമം മലയാളത്തിന്റെ സ്വാഭാവിക ഒഴുക്കിനായി ക്രമീകരിച്ചെങ്കിലും മൂലത്തിലെ വൈരുധ്യം, രൂപകം, വ്യവസ്ഥ എന്നിവ സംരക്ഷിച്ചു.
