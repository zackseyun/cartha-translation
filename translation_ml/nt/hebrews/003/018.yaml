  to: തന്റെ വിശ്രമത്തിൽ പ്രവേശിക്കുകയില്ലെന്ന് അവൻ ആരോടാണ് ശപഥം ചെയ്തത്—അനുസരിക്കാതിരുന്നവരോടല്ലാതെ[a]?
