id: HEB.3.18
reference: Hebrews 3:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τίσιν δὲ ὤμοσεν μὴ εἰσελεύσεσθαι εἰς τὴν κατάπαυσιν αὐτοῦ εἰ μὴ τοῖς ἀπειθήσασιν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/018.yaml
  text: And to whom did he swear that they would not enter his rest[a], if not to those who disobeyed?
translation:
  language: ml
  text: തന്റെ വിശ്രമത്തിൽ പ്രവേശിക്കുകയില്ലെന്ന് അവൻ ആരോടാണ് ശപഥം ചെയ്തത്—അനുസരിക്കാതിരുന്നവരോടല്ലാതെ[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അനുസരിക്കാതിരുന്നവർ’ എന്നതിന് ‘അനുസരണം നിരസിച്ചവർ’ എന്നും അർഥമാകാം. സന്ദർഭത്തിൽ ഈ അനുസരണക്കേട് അവിശ്വാസവുമായി അടുത്ത് ബന്ധപ്പെട്ടിരിക്കുന്നു (എബ്രാ 3:19).
    reason: lexical_alternative
lexical_decisions:
- source_word: τίσιν
  choice: ആരോടാണ്
  rationale: വ്യക്തികളെ സൂചിപ്പിക്കുന്ന ദത്തിവിഭക്തിയിലുള്ള ചോദ്യം; മലയാളത്തിലെ വാചാടോപപരമായ ചോദ്യത്തിന് സ്വാഭാവികമായ രൂപം.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: മുൻവാക്യത്തിലെ ചോദ്യപരമ്പര തുടരുന്ന ബന്ധകമാണ്; മലയാളത്തിലെ വാക്യക്രമം ആ തുടർച്ച സ്വാഭാവികമായി അറിയിക്കുന്നു. ‘എന്നാൽ’ എന്നു ചേർത്താൽ ഗ്രീക്കിലുള്ളതിലധികം വൈരുധ്യം തോന്നാം.
- source_word: ὤμοσεν
  choice: സത്യം ചെയ്തത്
  rationale: ὀμνύω എന്ന ക്രിയയുടെ ഗൗരവമുള്ള ശപഥാർഥം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: μὴ εἰσελεύσεσθαι
  choice: പ്രവേശിക്കുകയില്ലെന്ന്
  rationale: ശപഥത്തിന്റെ ഉള്ളടക്കം അറിയിക്കുന്ന അനന്തക്രിയാരൂപം മലയാളത്തിൽ സ്വാഭാവികമായ പരോക്ഷപ്രസ്താവനയായി നൽകിയിരിക്കുന്നു.
- source_word: εἰς τὴν κατάπαυσιν αὐτοῦ
  choice: തന്റെ സ്വസ്ഥതയിൽ
  rationale: κατάπαυσις എന്നത് എബ്രായലേഖനത്തിലെ ദൈവത്തിന്റെ ‘സ്വസ്ഥത’ എന്ന പ്രമേയപരമായ അർഥത്തിൽ; εἰς സൂചിപ്പിക്കുന്ന പ്രവേശനദിശ ‘-യിൽ പ്രവേശിക്കുക’ എന്ന മലയാളപ്രയോഗത്തിൽ നിലനിൽക്കുന്നു.
- source_word: εἰ μὴ
  choice: -ഓടല്ലാതെ
  rationale: വാചാടോപപരമായ ചോദ്യത്തിൽ പ്രതീക്ഷിക്കുന്ന ഏക ഉത്തരം വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: τοῖς ἀπειθήσασιν
  choice: അനുസരിക്കാതിരുന്നവരോട്
  rationale: ἀπειθέω ഇവിടെ അനുസരിക്കാതിരുന്നതിനെ സൂചിപ്പിക്കുന്നു; അടുത്ത വാക്യത്തിലെ അവിശ്വാസവുമായി ബന്ധമുണ്ടെങ്കിലും അതിനെ നേരിട്ട് ‘വിശ്വസിക്കാത്തവർ’ എന്നു മാറ്റാതെ പദവ്യത്യാസം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: മുന്നറിയിപ്പിന്റെ സന്ദർഭത്തിൽ ἀπειθήσασιν എന്ന പദത്തിന്റെ അർഥം
  choice: അനുസരിക്കാതിരുന്നവർ
  alternative: വിശ്വസിക്കാതിരുന്നവർ
  rationale: 3:18-19-ൽ അനുസരണക്കേടും അവിശ്വാസവും അടുത്ത് ബന്ധപ്പെടുന്നു; എങ്കിലും 3:18 ഉപയോഗിക്കുന്നത് ἀπειθέω ആണ്, ἀπιστέω അല്ല. അതിനാൽ മുഖ്യപാഠം അനുസരണക്കേടിനെ നിലനിർത്തുകയും സന്ദർഭത്തിലെ വിശ്വാസബന്ധം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാചാടോപചോദ്യം. ഗ്രീക്കിലെ പ്രതീക്ഷിത ഉത്തരം ആദ്യം വെച്ച് ‘-ഓടല്ലാതെ’ എന്ന ഘടനയിൽ അവതരിപ്പിച്ചതിനാൽ വാക്യം വ്യക്തവും വായനാസൗകര്യമുള്ളതുമാണ്.
