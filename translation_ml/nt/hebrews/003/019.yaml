  text: And we see that they were not able to enter because of unbelief[a].
translation:
  language: ml
  text: അവിശ്വാസം[a] നിമിത്തം അവർക്കു പ്രവേശിക്കാനായില്ലെന്ന് നാം കാണുന്നു.
  philosophy: optimal-equivalence
  footnotes:
