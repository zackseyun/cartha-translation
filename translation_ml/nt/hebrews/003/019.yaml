    text: അഥവാ, “അവിശ്വസ്തത.” ഈ ഗ്രീക്ക് പദത്തിന് വിശ്വാസക്കുറവ് മാത്രമല്ല, വിശ്വസ്തതയുടെ അഭാവം എന്ന അർഥവും ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: —
  rationale: മുൻവാക്യത്തിന്റെ നിഗമനം സ്വാഭാവികമായി തുടരുന്നതിനാൽ മലയാളത്തിൽ പ്രത്യേക സംയോജകപദം ചേർക്കാതെ ബന്ധം നിലനിർത്തുന്നു; ‘അങ്ങനെ’ എന്നു ചേർത്താൽ ഗ്രീക്കിലുള്ളതിലധികം നിഗമനബലം വരാം.
- source_word: βλέπομεν
  choice: നാം കാണുന്നു
  rationale: വർത്തമാനകാലത്തിലെ ഒന്നാംപുരുഷ ബഹുവചനക്രിയയുടെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ മലയാളരൂപം; എഴുത്തുകാരന്റെ സജീവമായ നിരീക്ഷണശൈലി നിലനിർത്തുന്നു.
- source_word: ὅτι
  choice: എന്നു
  rationale: കാണുന്നതിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് ഘടന മലയാളത്തിൽ സ്വാഭാവികമായ പരോക്ഷവാക്യരൂപത്തിൽ നൽകുന്നു.
- source_word: οὐκ ἠδυνήθησαν
  choice: അവർക്കു … കഴിഞ്ഞില്ല
  rationale: ശേഷിയില്ലായ്മ സൂചിപ്പിക്കുന്ന δύναμαι എന്ന ക്രിയയുടെ ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: εἰσελθεῖν
  choice: പ്രവേശിക്കാൻ
  rationale: വാഗ്ദത്തദേശത്തിലേക്കും ദൈവത്തിന്റെ വിശ്രമത്തിലേക്കും പ്രവേശിക്കുന്നതിനെക്കുറിച്ചുള്ള സന്ദർഭത്തിന് യോജിച്ച, ഗൗരവമുള്ള സാധാരണ പദം.
- source_word: δι’
  choice: നിമിത്തം
  rationale: Accusative-നോടുകൂടിയ διά ഇവിടെ കാരണം സൂചിപ്പിക്കുന്നു; ‘നിമിത്തം’ ആ കാരണബന്ധം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀπιστίαν
  choice: അവിശ്വാസം
  rationale: ദൈവത്തിന്റെ വാക്കിലും വാഗ്ദത്തത്തിലും വിശ്വസിക്കാതിരുന്നതാണ് സമീപസന്ദർഭത്തിലെ പ്രാധാന്യം. പദത്തിനുള്ള അവിശ്വസ്തത/വിശ്വസിക്കാൻ വിസമ്മതിക്കൽ എന്ന സൂക്ഷ്മത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ἀπιστία എന്ന പദത്തിലെ വിശ്വാസക്കുറവും അവിശ്വസ്തതയും തമ്മിലുള്ള അർത്ഥവ്യാപ്തി
  choice: അവിശ്വാസം
  alternative: അവിശ്വസ്തത
  rationale: എബ്രായർ 3-ലെ സമീപസന്ദർഭം ദൈവത്തിന്റെ വാഗ്ദത്തം വിശ്വസിക്കാതിരുന്നതിന് ഊന്നൽ നൽകുന്നതിനാൽ പ്രധാന പാഠത്തിൽ ‘അവിശ്വാസം’ ഏറ്റവും വ്യക്തമാണ്. എന്നാൽ വിശ്വസിക്കാൻ അവിശ്വസ്തമായി വിസമ്മതിച്ചു എന്ന ഉടമ്പടിസംബന്ധിയായ സൂചന നഷ്ടപ്പെടാതിരിക്കാൻ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ ആശയക്രമം കഴിയുന്നത്ര നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ സ്വാഭാവികമായ ‘എന്നു നാം കാണുന്നു’ എന്ന ഘടന ഉപയോഗിച്ചു.
