language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλὰ παρακαλεῖτε ἑαυτοὺς καθ’ ἑκάστην ἡμέραν, ἄχρις οὗ τὸ Σήμερον καλεῖται, ἵνα μὴ σκληρυνθῇ ⸂τις ἐξ ὑμῶν⸃ ἀπάτῃ τῆς ἁμαρτίας·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/013.yaml
  text: But encourage one another every day[b][a], as long as it is called “Today,” so that none of you may be hardened by the deceitfulness of sin.
translation:
  language: ml
  text: എന്നാൽ, “ഇന്ന്”[b] എന്നു വിളിക്കപ്പെടുന്നിടത്തോളം, നിങ്ങളിൽ ആരും പാപത്തിന്റെ വഞ്ചനയാൽ കഠിനരാകാതിരിക്കാൻ ഓരോ ദിവസവും പരസ്പരം പ്രോത്സാഹിപ്പിക്കുക[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “പരസ്പരം ഉദ്ബോധിപ്പിക്കുക.” സന്ദർഭമനുസരിച്ച് ഗ്രീക്ക് ക്രിയയ്ക്ക് പ്രോത്സാഹിപ്പിക്കുക, ഉദ്ബോധിപ്പിക്കുക, അഭ്യർഥിക്കുക, ആശ്വസിപ്പിക്കുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: “ഇന്ന്” എന്നത് സങ്കീർത്തനം 95-നെ പ്രതിധ്വനിപ്പിക്കുന്നു; ദൈവത്തിന്റെ വിളിയോട് പ്രതികരിക്കേണ്ട ഇപ്പോഴത്തെ കാലത്തെയാണ് അത് സൂചിപ്പിക്കുന്നത്.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλὰ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ മുന്നറിയിപ്പിനോടുള്ള ശക്തമായ വൈരുധ്യം സ്വാഭാവികമായ മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: παρακαλεῖτε
  choice: പ്രോത്സാഹിപ്പിക്കുക
  rationale: ഈ ക്രിയയ്ക്ക് പ്രോത്സാഹിപ്പിക്കുക, ഉദ്ബോധിപ്പിക്കുക, അഭ്യർഥിക്കുക, ആശ്വസിപ്പിക്കുക എന്നീ അർഥവ്യാപ്തിയുണ്ട്. അവിശ്വാസത്തിനെതിരെ പരസ്പരം ഉറപ്പിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘പ്രോത്സാഹിപ്പിക്കുക’ സ്വാഭാവികവും ഉൾക്കൊള്ളുന്നതുമായ പ്രയോഗമാണ്.
- source_word: ἑαυτοὺς
  choice: പരസ്പരം
  rationale: രൂപത്തിൽ പ്രത്യാവർത്തക സർവനാമമാണെങ്കിലും ബഹുവചന ആജ്ഞയോടൊപ്പം പരസ്പരപ്രവർത്തനമാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്.
- source_word: καθ’ ἑκάστην ἡμέραν
  choice: ഓരോ ദിവസവും
  rationale: ദിവസേന ആവർത്തിക്കേണ്ട പ്രവൃത്തിയെ വ്യക്തമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ἄχρις οὗ
  choice: കാലം നിലനിൽക്കുന്നിടത്തോളം
  rationale: ഒരു അവസാനബിന്ദുവിനെക്കാൾ, ഉദ്ബോധനം തുടരേണ്ട ഇപ്പോഴത്തെ കാലയളവിനാണ് സന്ദർഭത്തിൽ ഊന്നൽ.
- source_word: τὸ Σήμερον καλεῖται
  choice: “ഇന്ന്” എന്നു വിളിക്കപ്പെടുന്ന
  rationale: സങ്കീർത്തനം 95-ലെ ‘ഇന്ന്’ എന്ന പ്രയോഗത്തിന്റെ ഉദ്ധരണിസ്വഭാവം ഉദ്ധരണിച്ചിഹ്നങ്ങളിലൂടെ നിലനിർത്തുന്നു; മലയാളത്തിലെ വാക്യഘടന പൂർത്തിയാക്കാൻ ‘കാലം’ സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കിയിരിക്കുന്നു.
- source_word: ἵνα μὴ σκληρυνθῇ τις ἐξ ὑμῶν
  choice: നിങ്ങളിൽ ആരും കഠിനപ്പെട്ടുപോകാതിരിക്കാൻ
  rationale: നിഷേധാത്മക ഉദ്ദേശ്യവും സമൂഹത്തിലെ ഓരോ വ്യക്തിയെയും ഉൾക്കൊള്ളുന്ന മുന്നറിയിപ്പും സ്വാഭാവികമായി കൈമാറുന്നു. ‘കഠിനപ്പെട്ടുപോകുക’ കഠിനീകരണം സംഭവിക്കുന്ന പ്രക്രിയയെ സൂചിപ്പിക്കുന്നു.
- source_word: ἀπάτῃ τῆς ἁμαρτίας
  choice: പാപത്തിന്റെ വഞ്ചനയാൽ
  rationale: ദത്തിവ് വിഭക്തിയുടെ ഉപകരണാർഥം നിലനിർത്തി, കഠിനീകരണത്തിന് ഇടയാക്കുന്ന പാപത്തിന്റെ വഞ്ചകസ്വഭാവം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: പരസ്പര ഉദ്ബോധനത്തിന്റെ സമൂഹപരമായ സ്വഭാവം
  choice: പരസ്പരം
  alternative: നിങ്ങളെത്തന്നെ
  rationale: ഗ്രീക്ക് പ്രത്യാവർത്തക സർവനാമം ഇവിടെ ബഹുവചനത്തിൽ പരസ്പരാർഥത്തിലാണ്; അതിനാൽ വ്യക്തികേന്ദ്രിതമായി തെറ്റിദ്ധരിക്കപ്പെടാവുന്ന പദാനുപദ വിവർത്തനത്തിന് പകരം സമൂഹത്തിലെ അംഗങ്ങൾ തമ്മിലുള്ള ഉത്തരവാദിത്വം വ്യക്തമാക്കുന്നു.
- issue: τὸ Σήμερον എന്നതിന്റെ തിരുവെഴുത്തുപരമായ ഭാരം
  choice: “ഇന്ന്” എന്ന ഉദ്ധരണിരൂപം, ഇപ്പോഴത്തെ പ്രതികരണകാലത്തെ സൂചിപ്പിക്കുന്നത്
  alternative: സാധാരണ കാലസൂചനയായ ഇന്ന്
  rationale: എബ്രായർ 3-ൽ ഇത് സങ്കീർത്തനം 95-നെ പ്രതിധ്വനിപ്പിക്കുകയും ദൈവത്തിന്റെ വിളിയോട് പ്രതികരിക്കേണ്ട ഇപ്പോഴത്തെ അവസരത്തിന് പ്രത്യേക പ്രാധാന്യം നൽകുകയും ചെയ്യുന്നു; മുഖ്യവാചകത്തിൽ അതിരുകടന്ന് വ്യാഖ്യാനിക്കാതെ ഉദ്ധരണിച്ചിഹ്നങ്ങൾ ആ ബന്ധം സംരക്ഷിക്കുന്നു.
- issue: കഠിനീകരണത്തിലെ കർത്തൃത്വം
  choice: കഠിനപ്പെട്ടുപോകാതിരിക്കാൻ
  alternative: കഠിനരാക്കപ്പെടാതിരിക്കാൻ
  rationale: ഗ്രീക്കിലെ നിഷ്ക്രിയരൂപത്തിന്റെ സംഭവസ്വഭാവം നിലനിർത്തുമ്പോഴും ആരാണ് കഠിനമാക്കുന്നത് എന്ന് വാചകം നിർണയിക്കുന്നില്ല; മലയാളത്തിൽ അസ്വാഭാവികമായ നിർബന്ധിത നിഷ്ക്രിയം ഒഴിവാക്കി യഥാർഥത്തിലെ അവ്യക്തത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘പ്രോത്സാഹിപ്പിക്കുക’ എന്ന പൊതുവായി ഗ്രഹിക്കാവുന്ന പദം മുഖ്യവാചകത്തിൽ ഉപയോഗിച്ച് ‘ഉദ്ബോധിപ്പിക്കുക’ എന്ന ശക്തമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി. മൂലത്തിലെ ദീർഘവാക്യബന്ധവും ‘ഇന്ന്’ എന്ന തിരുവെഴുത്തുപരമായ പ്രതിധ്വനിയും സംരക്ഷിച്ചിട്ടുണ്ട്.
