id: HEB.3.11
reference: Hebrews 3:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὡς ὤμοσα ἐν τῇ ὀργῇ μου· Εἰ εἰσελεύσονται εἰς τὴν κατάπαυσίν μου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/011.yaml
  text: as I swore in my wrath[a], ‘They shall never enter my rest.’
translation:
  language: ml
  text: 'എന്റെ ക്രോധത്തിൽ ഞാൻ ശപഥം ചെയ്തതുപോലെ: “അവർ ഒരിക്കലും എന്റെ വിശ്രമത്തിൽ പ്രവേശിക്കുകയില്ല.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഗ്രീക്കിൽ അക്ഷരാർഥം: “അവർ എന്റെ വിശ്രമത്തിൽ പ്രവേശിക്കുമെങ്കിൽ.” ഇത് “അവർ തീർച്ചയായും എന്റെ വിശ്രമത്തിൽ പ്രവേശിക്കുകയില്ല” എന്ന് അർഥമാക്കുന്ന ഒരു ശപഥസൂത്രമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: ചെയ്തതുപോലെ
  rationale: മുൻസന്ദർഭത്തിലെ ഉദ്ധരണിയോട് ബന്ധിപ്പിക്കുന്ന താരതമ്യപ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὤμοσα
  choice: ഞാൻ ശപഥം ചെയ്തു
  rationale: ὀμνύω എന്ന ക്രിയയുടെ ശപഥം ചെയ്യുക എന്ന നേരിട്ടുള്ള അർഥവും വാക്യത്തിന്റെ ഗൗരവവും വ്യക്തമാക്കുന്നു.
- source_word: ἐν τῇ ὀργῇ μου
  choice: എന്റെ ക്രോധത്തിൽ
  rationale: ὀργήയുടെ ശക്തവും ന്യായവിധിസംബന്ധവുമായ ഭാവം ‘ക്രോധം’ സംരക്ഷിക്കുന്നു.
- source_word: Εἰ εἰσελεύσονται
  choice: അവർ ഒരിക്കലും ... പ്രവേശിക്കുകയില്ല
  rationale: εἰ + ഭാവികാലക്രിയ ഇവിടെ അപൂർണ്ണമായ ശപഥസൂത്രമാണ്; ഉപാധിവാക്യമെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കി അതിന്റെ ഉറച്ച നിഷേധാർഥം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: εἰς τὴν κατάπαυσίν μου
  choice: എന്റെ വിശ്രമത്തിൽ
  rationale: κατάπαυσις എന്ന പദത്തിന്റെ ‘വിശ്രമം’ എന്ന ആശയവും എബ്രായലേഖനത്തിൽ വികസിക്കുന്ന ദൈവിക വിശ്രമത്തിന്റെ പ്രമേയവും അനാവശ്യമായി ചുരുക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: Εἰ εἰσελεύσονται എന്ന ശപഥസൂത്രത്തിന്റെ പരിഭാഷ
  choice: “അവർ ഒരിക്കലും എന്റെ വിശ്രമത്തിൽ പ്രവേശിക്കുകയില്ല” എന്ന വ്യക്തമായ നിഷേധം
  alternative: “അവർ എന്റെ വിശ്രമത്തിൽ പ്രവേശിക്കുമെങ്കിൽ” എന്ന പദാനുപദ രൂപം
  rationale: ഗ്രീക്ക്-എബ്രായ ശപഥശൈലിയിൽ ഈ വ്യവസ്ഥാരൂപം ശക്തമായ നിഷേധമാണ്. അതിന്റെ അർഥബലം വ്യക്തമാക്കുന്നത് ഉപാധിയെന്ന തെറ്റായ വായന ഒഴിവാക്കുന്നു.
- issue: κατάπαυσις എന്ന പദത്തിന്റെ സന്ദർഭാർഥം
  choice: വിശ്രമം
  alternative: വിശ്രമസ്ഥലം
  rationale: സങ്കീർത്തനം 95-ഉം ദൈവത്തിന്റെ സ്വന്തം വിശ്രമവും തമ്മിലുള്ള ആശയബന്ധം സംരക്ഷിക്കുന്നു; ദേശം, സ്വർഗം, മാനസിക സമാധാനം എന്നിവയിൽ ഏതെങ്കിലും ഒന്നായി മുൻകൂട്ടി പരിമിതപ്പെടുത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ദൈവിക ന്യായവിധിയുടെ ഭാവം നിലനിർത്താൻ ‘ക്രോധം’, ശപഥത്തിന്റെ ഔപചാരികതയ്ക്കായി ‘ശപഥം ചെയ്തു’ എന്നിവ ഉപയോഗിച്ചു.
