source:
  edition: SBLGNT
  text: μέτοχοι γὰρ ⸂τοῦ Χριστοῦ γεγόναμεν⸃, ἐάνπερ τὴν ἀρχὴν τῆς ὑποστάσεως μέχρι τέλους βεβαίαν κατάσχωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/014.yaml
  text: For we have become sharers in the Messiah, if indeed we hold the beginning of our assurance firm to the end.
translation:
  language: ml
  text: കാരണം, നാം മശീഹയിൽ[a] പങ്കാളികളായിത്തീർന്നിരിക്കുന്നു, ആരംഭത്തിൽ നമുക്കുണ്ടായിരുന്ന ഉറപ്പിനെ[b] അവസാനംവരെ ദൃഢമായി മുറുകെപ്പിടിക്കുന്നുവെങ്കിൽ.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മശീഹയിൽ പങ്കുള്ളവർ,’ ‘മശീഹയുടെ പങ്കാളികൾ,’ അല്ലെങ്കിൽ ‘മശീഹയിൽ പങ്കുപറ്റുന്നവർ.’
    reason: lexical_alternative
  - marker: b
    text: ‘ഉറപ്പ്’ എന്നു പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്ക് പദത്തിന് ‘ആത്മവിശ്വാസം’ എന്നും, ചില സന്ദർഭങ്ങളിൽ ‘സത്ത’ അല്ലെങ്കിൽ ‘യാഥാർഥ്യം’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: c
    text: 'അക്ഷരാർഥത്തോട് കൂടുതൽ അടുത്ത രൂപം: ‘നമ്മുടെ ഉറപ്പിന്റെ ആരംഭത്തെ അവസാനംവരെ ദൃഢമായി മുറുകെപ്പിടിക്കുന്നുവെങ്കിൽ.’'
    reason: formal_alternative
lexical_decisions:
- source_word: μέτοχοι
  choice: പങ്കാളികൾ
  rationale: മറ്റൊരാളോടൊപ്പമോ മറ്റൊന്നിലോ പങ്കുള്ളവരെ സൂചിപ്പിക്കുന്നു. ‘പങ്കാളികൾ’ എന്നത് ആ പങ്കാളിത്തത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻപുള്ള മുന്നറിയിപ്പിനോ പ്രബോധനത്തിനോ കാരണം അല്ലെങ്കിൽ വിശദീകരണം നൽകുന്ന ബന്ധകം.
- source_word: τοῦ Χριστοῦ
  choice: മശീഹയിൽ
  rationale: Χριστός ഇവിടെ പേരുപോലെക്കാൾ സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നു. μέτοχοι എന്നതിനോടുള്ള ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി ‘മശീഹയിൽ പങ്കാളികൾ’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: γεγόναμεν
  choice: ആയിത്തീർന്നിരിക്കുന്നു
  rationale: ഭൂതകാലത്തിൽ സംഭവിച്ച് ഇപ്പോഴും നിലനിൽക്കുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പൂർണ്ണകാലത്തിന്റെ ഇരട്ട ഭാവവും നിലനിർത്തുന്നു.
- source_word: ἐάνπερ
  choice: എങ്കിൽത്തന്നെ
  rationale: വെറും ‘എങ്കിൽ’ എന്നതിലുപരി വ്യവസ്ഥയ്ക്ക് ഊന്നൽ നൽകുന്ന കണികയുടെ ശക്തി പ്രകടമാക്കുന്നു.
- source_word: τὴν ἀρχὴν τῆς ὑποστάσεως
  choice: നമ്മുടെ ആദ്യത്തെ ഉറപ്പ്
  rationale: വാക്കുതോറുമുള്ള ‘ഉറപ്പിന്റെ ആരംഭം’ മലയാളത്തിൽ അസ്വാഭാവികവും അവ്യക്തവുമാകാം. ഇവിടെ തുടക്കത്തിൽ ഉണ്ടായിരുന്ന ഉറച്ച ആത്മവിശ്വാസാവസ്ഥയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; പദത്തിന്റെ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: μέχρι τέλους
  choice: അവസാനംവരെ
  rationale: മുഴുവൻ കാലയളവിലൂടെയും തുടർന്നുനിൽക്കുന്നതിനെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി വ്യക്തമാക്കുന്നു.
- source_word: βεβαίαν κατάσχωμεν
  choice: ദൃഢമായി മുറുകെപ്പിടിക്കുന്നുവെങ്കിൽ
  rationale: βεβαίαν എന്നതിലെ സ്ഥിരതയും κατάσχωμεν എന്നതിലെ കൈവിടാതെ നിലനിർത്തലും ചേർത്ത് സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: വ്യവസ്ഥാവാക്യവും സ്ഥിരോത്സാഹവും
  choice: ‘എങ്കിൽത്തന്നെ ... മുറുകെപ്പിടിക്കുന്നുവെങ്കിൽ’ എന്ന യഥാർഥ വ്യവസ്ഥ നിലനിർത്തി.
  alternative: സ്ഥിരോത്സാഹം മുൻപേയുള്ള പങ്കാളിത്തത്തിന്റെ തെളിവു മാത്രമാണെന്നോ, പങ്കാളിത്തം നിലനിൽക്കാനുള്ള ഉപാധിയാണെന്നോ വ്യക്തമായി വ്യാഖ്യാനിക്കുക.
  rationale: ഗ്രീക്ക് വാക്യം വ്യവസ്ഥ വ്യക്തമാക്കുന്നുവെങ്കിലും സ്ഥിരോത്സാഹം, വിശ്വാസത്യാഗം, സുരക്ഷിതത്വം എന്നിവയെക്കുറിച്ചുള്ള പിന്നീടുള്ള സിദ്ധാന്തവാദങ്ങളിൽ ഏതാണ് ശരിയെന്ന് ഇവിടെ സ്വയം തീർപ്പാക്കുന്നില്ല.
- issue: τοῦ Χριστοῦ എന്ന ഷഷ്ഠീവ്യാകരണബന്ധം
  choice: ‘മശീഹയിൽ പങ്കാളികൾ’
  alternative: ‘മശീഹയുടെ പങ്കാളികൾ’ അല്ലെങ്കിൽ ‘മശീഹയോടൊപ്പം പങ്കുള്ളവർ’
  rationale: ഷഷ്ഠിയുടെ ബന്ധം പങ്കാളിത്തം/പങ്കുവെക്കൽ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘മശീഹയിൽ പങ്കാളികൾ’ ദൈവശാസ്ത്രപരമായ ബന്ധം തുറന്ന നിലയിൽ സൂക്ഷിച്ചുകൊണ്ട് സ്വാഭാവികമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘മുറുകെപ്പിടിക്കുക’ സ്ഥിരോത്സാഹത്തിന്റെ സജീവഭാവം നൽകുന്നു; അടിക്കുറിപ്പുകൾ പദാർഥപരമായ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു.
