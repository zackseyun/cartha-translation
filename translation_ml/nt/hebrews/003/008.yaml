id: HEB.3.8
reference: Hebrews 3:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μὴ σκληρύνητε τὰς καρδίας ὑμῶν ὡς ἐν τῷ παραπικρασμῷ, κατὰ τὴν ἡμέραν τοῦ πειρασμοῦ ἐν τῇ ἐρήμῳ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/008.yaml
  text: do not harden your hearts as in the rebellion[a], as on the day of testing in the wilderness,
translation:
  language: ml
  text: നിങ്ങളുടെ ഹൃദയങ്ങളെ കഠിനമാക്കരുത്; കലാപസമയത്ത് എന്നപോലെയും മരുഭൂമിയിലെ പരീക്ഷണദിവസത്തിൽ എന്നപോലെയും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, സങ്കീർത്തനം 95:8-ന്റെ പിന്നിലുള്ള എബ്രായ സ്ഥലനാമങ്ങളെ പിന്തുടർന്ന്: “മെരീബായിൽ എന്നപോലെയും മരുഭൂമിയിലെ മസ്സായിൽ ഉണ്ടായ ദിവസത്തിൽ എന്നപോലെയും.”'
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ σκληρύνητε
  choice: കഠിനമാക്കരുത്
  rationale: μή ചേർന്ന aorist active subjunctive നേരിട്ടുള്ള വിലക്കാണ്; active voice ശ്രോതാക്കളുടെ ഉത്തരവാദിത്വമുള്ള പ്രവൃത്തിയെ നിലനിർത്തുന്നു.
- source_word: τὰς καρδίας ὑμῶν
  choice: നിങ്ങളുടെ ഹൃദയങ്ങളെ
  rationale: സമൂഹത്തോടുള്ള ബഹുവചന നേരിട്ടുള്ള അഭിസംബോധന നിലനിർത്തുന്നു; ‘ഹൃദയം’ വികാരം മാത്രമല്ല, ചിന്ത, ഇച്ഛ, മനോഭാവം എന്നിവ ഉൾപ്പെടുന്ന ആന്തരിക വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സ്ഥാപിത ബൈബിൾപ്രയോഗമാണ്.
- source_word: ὡς ἐν τῷ παραπικρασμῷ
  choice: മത്സരിച്ചപ്പോൾ ചെയ്തതുപോലെ
  rationale: παραπικρασμός ദൈവത്തെ പ്രകോപിപ്പിച്ച മത്സരത്തെയോ കലാപത്തെയോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സംഭവത്തെയും കേൾവിക്കാരുടെ സമാന പ്രവൃത്തിയെയും സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ ക്രിയാത്മക രൂപം ഉപയോഗിച്ചു.
- source_word: κατὰ τὴν ἡμέραν τοῦ πειρασμοῦ
  choice: പരീക്ഷണദിവസത്തിൽ എന്നപോലെ
  rationale: κατά + accusative ഇവിടെ താരതമ്യപരമായ ബന്ധം നിലനിർത്തുന്നു; πειρασμός ഈ ചരിത്രസന്ദർഭത്തിൽ പ്രലോഭനത്തേക്കാൾ പരീക്ഷണസംഭവത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἐν τῇ ἐρήμῳ
  choice: മരുഭൂമിയിൽ
  rationale: ഇസ്രായേലിന്റെ മരുഭൂമിയാത്രയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സ്ഥാപിതവുമായ മലയാള ബൈബിൾപദം.
theological_decisions:
- issue: സങ്കീർത്തനം 95-ലെ ചരിത്രസൂചനയുടെ പരിഭാഷ
  choice: ഗ്രീക്ക് പാഠത്തിലെ സംഭവവിവരണങ്ങൾ പ്രധാനവാക്യത്തിൽ ‘മത്സരിച്ചപ്പോൾ’, ‘പരീക്ഷണദിവസം’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘മരുഭൂമിയിലെ മെരീബയിൽ എന്നപോലെ, മസ്സായിലെ ദിവസത്തിൽ എന്നപോലെ’ എന്ന എബ്രായ സ്ഥലനാമാധിഷ്ഠിത രൂപം.
  rationale: എബ്രായ പശ്ചാത്തലത്തിലെ സ്ഥലനാമങ്ങൾക്ക് പകരം ഹെബ്രായർ ഉദ്ധരിക്കുന്ന ഗ്രീക്ക് സങ്കീർത്തനപാഠം വിവരണാത്മക നാമങ്ങൾ ഉപയോഗിക്കുന്നു. അതിനാൽ പ്രധാനവാക്യം ഗ്രീക്ക് പാഠത്തെ പിന്തുടരുകയും എബ്രായ സ്ഥലനാമങ്ങൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും തിരുവെഴുത്ത് ഉദ്ധരണിയുടെ ഭാവവും നിലനിർത്തി. ഗ്രീക്കിലെ ഇരട്ട താരതമ്യം മലയാളത്തിൽ വ്യക്തമായി കേൾക്കാൻ വാക്യഘടന ക്രമപ്പെടുത്തി; ‘മത്സരം’ എന്ന നാമത്തിന്റെ അസ്വാഭാവികത ഒഴിവാക്കാൻ ‘മത്സരിച്ചപ്പോൾ ചെയ്തതുപോലെ’ എന്നു നൽകി.
