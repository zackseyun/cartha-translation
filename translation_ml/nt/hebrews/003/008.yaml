revisions:
- from: മരുഭൂമിയിൽ പരീക്ഷണദിവസത്തിൽ എന്നപോലെ, മത്സരിച്ചപ്പോൾ ചെയ്തതുപോലെ, നിങ്ങളുടെ ഹൃദയങ്ങളെ കഠിനമാക്കരുത്.[a]
