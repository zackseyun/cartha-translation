id: HEB.3.17
reference: Hebrews 3:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τίσιν δὲ προσώχθισεν τεσσεράκοντα ἔτη; οὐχὶ τοῖς ἁμαρτήσασιν, ὧν τὰ κῶλα ἔπεσεν ἐν τῇ ἐρήμῳ;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/017.yaml
  text: And with whom was he angry for forty years? Was it not with those who sinned[a], whose bodies fell in the wilderness?
translation:
  language: ml
  text: നാൽപ്പത് വർഷം ദൈവം ആരോടാണ് കോപിച്ചിരുന്നത്? പാപം ചെയ്തവരോടല്ലയോ—മരുഭൂമിയിൽ ശരീരങ്ങൾ വീണുപോയവരോടല്ലയോ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മരുഭൂമിയിൽ ശവങ്ങൾ വീണുപോയവരോടല്ലയോ?’
    reason: κῶλα എന്ന പദം അക്ഷരാർഥത്തിൽ ശരീരഭാഗങ്ങളെ സൂചിപ്പിക്കാമെങ്കിലും, ഈ ന്യായവിധിസന്ദർഭത്തിൽ മരിച്ചുവീണവരുടെ ശരീരങ്ങൾ/ശവങ്ങൾ എന്ന അർഥത്തിലാണ് ഉപയോഗിച്ചിരിക്കുന്നത്. ‘ശവങ്ങൾ’ കൂടുതൽ കടുപ്പമുള്ള സന്ദർഭോചിതമായ ബദലാണ്.
lexical_decisions:
- source_word: προσώχθισεν
  choice: കോപിച്ചു
  rationale: ദൈവം അവരോട് കോപിക്കുകയും നീരസപ്പെടുകയും ചെയ്തതിനെ സൂചിപ്പിക്കുന്ന ക്രിയയാണ്. ആധുനിക മലയാളത്തിൽ വ്യക്തവും സന്ദർഭോചിതവുമായ പ്രയോഗം ‘കോപിച്ചു’ എന്നതാണ്.
- source_word: τεσσεράκοντα ἔτη
  choice: നാൽപ്പതു വർഷം
  rationale: കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ ഇങ്ങനെ നൽകുന്നു.
- source_word: ἁμαρτήσασιν
  choice: പാപം ചെയ്തവർ
  rationale: മരുഭൂമിയിലെ തലമുറയുടെ പാപപ്രവൃത്തിയെ നേരിട്ടും സ്വാഭാവികമായും വ്യക്തമാക്കുന്നു.
- source_word: κῶλα
  choice: ശരീരങ്ങൾ
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥം ശരീരാവയവങ്ങൾ എന്നാണെങ്കിലും, ഇവിടെ മരുഭൂമിയിൽ മരിച്ചുവീണവരുടെ ശരീരങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ശരീരങ്ങൾ’ അർഥം വ്യക്തമായി നൽകുന്നു; പദത്തിന്റെ കടുപ്പമുള്ള മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: ἔπεσεν
  choice: വീണുകിടന്നു
  rationale: മരുഭൂമിയിൽ മരിച്ചുവീണ ശരീരങ്ങളുടെ ദൃശ്യഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ‘മരിച്ചു’ എന്ന് മൂലത്തിൽ ഇല്ലാത്ത ക്രിയ നേരിട്ട് ചേർക്കുന്നില്ല.
- source_word: ἐν τῇ ἐρήμῳ
  choice: മരുഭൂമിയിൽ
  rationale: ഇസ്രായേലിന്റെ മരുഭൂമിയാത്രയുടെ വേദിയെ സൂചിപ്പിക്കുന്ന പതിവും വ്യക്തവുമായ മലയാള പദം.
theological_decisions:
- issue: προσώχθισεν എന്ന ക്രിയയുടെ പരോക്ഷ കർത്താവ്
  choice: ദൈവം
  alternative: അവൻ
  rationale: ചുറ്റുപാടിൽ പരോക്ഷമായി സൂചിപ്പിക്കപ്പെടുന്ന കർത്താവ് ദൈവമാണ്. മലയാളത്തിൽ ചോദ്യം വ്യക്തവും സ്വാഭാവികവുമാക്കാൻ ‘ദൈവം’ എന്നു തുറന്നുപറയുന്നു; പുതിയൊരു ദൈവശാസ്ത്ര അവകാശവാദം ഇതിലൂടെ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. മൂലത്തിലെ രണ്ടു വാചാടോപചോദ്യങ്ങളും നിലനിർത്തിയിരിക്കുന്നു; രണ്ടാമത്തെ ചോദ്യത്തിലെ οὐχί പ്രതീക്ഷിക്കുന്ന സമ്മതത്തെ ‘അല്ലയോ’ എന്നതിലൂടെ പ്രകടമാക്കുന്നു.
