  to: നാൽപ്പത് വർഷം ദൈവം ആരോടാണ് കോപിച്ചിരുന്നത്? പാപം ചെയ്തവരോടല്ലയോ—മരുഭൂമിയിൽ ശരീരങ്ങൾ വീണുപോയവരോടല്ലയോ?[a]
