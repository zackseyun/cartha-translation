id: HEB.3.3
reference: Hebrews 3:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πλείονος γὰρ ⸂οὗτος δόξης⸃ παρὰ Μωϋσῆν ἠξίωται καθ’ ὅσον πλείονα τιμὴν ἔχει τοῦ οἴκου ὁ κατασκευάσας αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/003.yaml
  text: For this one has been counted worthy of more glory than Moses, just as the one who built the house has greater honor than the house.
translation:
  language: ml
  text: എന്തെന്നാൽ, വീടിനെക്കാൾ അതു പണിതവന് എത്രയധികം ബഹുമാനമുണ്ടോ, അത്രയധികം ഇദ്ദേഹം മോശെയെക്കാൾ കൂടുതൽ മഹത്ത്വത്തിന് അർഹനായി കണക്കാക്കപ്പെട്ടിരിക്കുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτος
  choice: ഇദ്ദേഹം
  rationale: മുൻവാക്യത്തിൽ പരാമർശിക്കപ്പെട്ട യേശുവിലേക്കുള്ള സൂചന സ്വാഭാവികമായി നിലനിർത്തുന്നു; വാക്യത്തിൽ പേര് ചേർത്ത് ഉറവിടത്തെക്കാൾ വ്യക്തമാക്കുന്നില്ല.
- source_word: δόξης
  choice: മഹത്ത്വം
  rationale: δόξα എന്ന പദത്തിന്റെ ഗൗരവം, മഹിമ, ബഹുമാനം എന്നീ അർത്ഥവലയങ്ങളിൽ ഇവിടെ താരതമ്യത്തിന്റെ ഉയർന്ന വശം പ്രകടമാക്കുന്നു; തുടർന്നുള്ള τιμήയിൽനിന്നും പദവ്യത്യാസം സൂക്ഷിക്കുന്നു.
- source_word: ἠξίωται
  choice: അർഹനായി കണക്കാക്കപ്പെട്ടിരിക്കുന്നു
  rationale: പൂർണ്ണകാല കർമണിപ്രയോഗത്തിന്റെ ‘യോഗ്യനായി വിലയിരുത്തപ്പെട്ടിരിക്കുന്നു’ എന്ന ഭാവവും ഇപ്പോഴുള്ള ഫലവും നിലനിർത്തുന്നു.
- source_word: καθ’ ὅσον
  choice: എത്രത്തോളം … അത്രത്തോളം
  rationale: രണ്ടു താരതമ്യങ്ങൾ തമ്മിലുള്ള അളവുസംബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; വെറും കാരണാർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: ὁ κατασκευάσας αὐτόν
  choice: അതു പണിതവൻ
  rationale: κατασκευάζω ഇവിടെ വീട് നിർമിക്കുക/പണിയുക എന്ന സ്വാഭാവിക അർത്ഥത്തിൽ നൽകുന്നു; αὐτόν വീടിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: τιμὴν
  choice: ബഹുമാനം
  rationale: τιμήയുടെ മാന്യത/ബഹുമാനം എന്ന അർത്ഥം നൽകുകയും δόξαയ്ക്ക് ഉപയോഗിച്ച ‘മഹത്ത്വം’ എന്നതിൽനിന്ന് വേർതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: οὗτος ആരെ സൂചിപ്പിക്കുന്നു
  choice: പേരുചേർക്കാതെ ‘ഇദ്ദേഹം’ എന്നു നിലനിർത്തി
  alternative: ‘യേശു’ അല്ലെങ്കിൽ ‘ക്രിസ്തു’ എന്ന് വ്യക്തമാക്കുക
  rationale: സന്ദർഭത്തിൽ സൂചന യേശുവിലേക്കാണെങ്കിലും, ഗ്രീക്ക് വാക്യത്തിൽ പേര് ഇല്ല; ഉറവിടത്തിലെ പരാമർശരീതി സംരക്ഷിക്കുന്നു.
- issue: വീട് പണിതവനെക്കുറിച്ചുള്ള ഉപമയുടെ ദൈവശാസ്ത്രപരമായ വ്യാഖ്യാനം
  choice: ഉപമയെ അതിന്റെ താരതമ്യരൂപത്തിൽ മാത്രം വിവർത്തനം ചെയ്തു
  alternative: ‘ദൈവം’ അല്ലെങ്കിൽ ‘ക്രിസ്തു’ എന്ന് പണിതവനെ തിരിച്ചറിയുന്ന വിശദീകരണം ചേർക്കുക
  rationale: ഈ വാക്യം തന്നിൽ പണിതവന്റെ തിരിച്ചറിയൽ തുറന്നുവെക്കുന്നു; അടുത്ത വാക്യത്തിന്റെ വിശദീകരണം മുൻകൂട്ടി ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് സുലഭവുമായ മലയാളം. ഗ്രീക്കിലെ കാരണസൂചകമായ γάρ വാക്യത്തിന്റെ വിശദീകരണബന്ധത്തിൽ ഉൾക്കൊള്ളുന്നു; മലയാളത്തിലെ പ്രവാഹം കണക്കിലെടുത്ത് പ്രത്യേകമായി ‘എന്തെന്നാൽ’ ചേർത്തിട്ടില്ല.
