  text: τίνες γὰρ ἀκούσαντες παρεπίκραναν; ἀλλ’ οὐ πάντες οἱ ἐξελθόντες ἐξ Αἰγύπτου διὰ Μωϋσέως;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/016.yaml
  text: For who[a], when they heard, rebelled? Was it not all those who came out of Egypt through Moses?
translation:
  language: ml
  text: എന്തെന്നാൽ, കേട്ടശേഷം കലഹിച്ചവർ ആരായിരുന്നു?[a] മോശെ മുഖാന്തരം ഈജിപ്തിൽനിന്ന് പുറപ്പെട്ട എല്ലാവരും അല്ലയോ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കേട്ട് പ്രകോപിപ്പിച്ചവർ” അല്ലെങ്കിൽ “കയ്പുണ്ടാക്കിയവർ.” ഗ്രീക്ക് ക്രിയയെ കൂടുതൽ പദാനുപദമായി ഇങ്ങനെ പരിഭാഷപ്പെടുത്താം; ഇവിടെ അത് മരുഭൂമിയിൽ ഇസ്രായേൽ ദൈവത്തിനെതിരെ മത്സരിച്ച് അവനെ പ്രകോപിപ്പിച്ചതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνες
  choice: ആരായിരുന്നു
  rationale: പ്രത്യേകമായ ഒരു കൂട്ടത്തിന്റെ തിരിച്ചറിയൽ ചോദിക്കുന്ന ബഹുവചന വാചാടോപചോദ്യത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാദത്തിന് വിശദീകരണമോ പിന്തുണയോ നൽകുന്ന യുക്തിബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: ἀκούσαντες
  choice: കേട്ടശേഷം
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള കേൾവിയെ സൂചിപ്പിക്കുന്ന ഭൂതകാല കൃദന്തരൂപത്തിന്റെ കാലബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പകരുന്നു.
- source_word: παρεπίκραναν
  choice: മത്സരിച്ചവർ
  rationale: മരുഭൂമിയിൽ ദൈവത്തെ അനുസരിക്കാതെ എതിർത്ത ഇസ്രായേലിന്റെ പ്രവൃത്തിയെ ആധുനിക വായനക്കാർക്ക് വ്യക്തമായി അറിയിക്കുന്നു; കൂടുതൽ പദാനുപദമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἀλλ’ οὐ πάντες
  choice: എല്ലാവരും അല്ലയോ?
  rationale: പ്രതീക്ഷിക്കപ്പെടുന്ന അനുകൂല ഉത്തരം ശക്തമായി സൂചിപ്പിക്കുന്ന വാചാടോപചോദ്യത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം; ഇവിടെ ἀλλάയ്ക്ക് വേറിട്ട ശക്തമായ വിരോധസൂചകം ആവശ്യമില്ല.
- source_word: οἱ ἐξελθόντες ἐξ Αἰγύπτου
  choice: ഈജിപ്തിൽനിന്ന് പുറപ്പെട്ട
  rationale: പുറപ്പാട് സംഭവത്തിലെ കൂട്ടത്തെ സൂചിപ്പിക്കുന്ന substantival participle-ഉം ἐξ എന്നതിന്റെ സ്ഥലവിയോഗാർഥവും ചുരുക്കമായി സംരക്ഷിക്കുന്നു.
- source_word: διὰ Μωϋσέως
  choice: മോശെ മുഖാന്തരം
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന മധ്യസ്ഥതയെയോ പ്രവർത്തകോപാധിയെയോ സംരക്ഷിക്കുന്നു; ‘മോശെയുടെ നേതൃത്വത്തിൽ’ എന്ന വ്യാഖ്യാനവിപുലീകരണം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: മരുഭൂമിതലമുറയുടെ പശ്ചാത്തലത്തിൽ παραπικραίνω എന്ന ക്രിയയുടെ അർഥം
  choice: മത്സരിച്ചു
  alternative: പ്രകോപിപ്പിച്ചു; കയ്പേറിയതാക്കി
  rationale: ഇവിടെ ദൈവവചനം കേട്ടശേഷമുള്ള അനുസരണക്കേടും എതിർപ്പുമാണ് ഉദ്ദേശിക്കുന്നത്. ‘മത്സരിച്ചു’ ആ കഥാപരവും ദൈവശാസ്ത്രപരവുമായ ശക്തി വ്യക്തമാക്കുന്നു; പദാനുപദ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാചകരീതി. വാചാടോപചോദ്യങ്ങളുടെ ശക്തിയും മുൻസന്ദർഭത്തോടുള്ള γὰρ-ന്റെ യുക്തിബന്ധവും നിലനിർത്തിയിരിക്കുന്നു.
