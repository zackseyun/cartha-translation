id: HEB.3.15
reference: Hebrews 3:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν τῷ λέγεσθαι· Σήμερον ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε, Μὴ σκληρύνητε τὰς καρδίας ὑμῶν ὡς ἐν τῷ παραπικρασμῷ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/015.yaml
  text: while it is being said[a], “Today, if you hear his voice, do not harden your hearts as in the rebellion.”
translation:
  language: ml
  text: 'പറയപ്പെടുമ്പോൾ: “ഇന്ന് നിങ്ങൾ അവന്റെ ശബ്ദം കേൾക്കുന്നെങ്കിൽ, കലാപസമയത്തെപ്പോലെ[a] നിങ്ങളുടെ ഹൃദയങ്ങളെ കഠിനമാക്കരുത്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പ്രകോപനസമയത്തെപ്പോലെ”; ഇത് സങ്കീർത്തനം 95-ലെ ഉദ്ധരണിയുടെ പരമ്പരാഗത വിവർത്തനത്തെ പ്രതിധ്വനിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ λέγεσθαι
  choice: ഇങ്ങനെ പറയപ്പെട്ടുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: ἐν സഹിതമുള്ള articular infinitive കാലസാഹചര്യം സൂചിപ്പിക്കുന്നു; വർത്തമാനകാല കർമണി രൂപത്തിന്റെ തുടർച്ചാഭാവം ‘പറയപ്പെട്ടുകൊണ്ടിരിക്കുമ്പോൾ’ നിലനിർത്തുന്നു. മുൻവാക്യവുമായി ബന്ധമുള്ള ഉദ്ധരണിയാണെന്ന് ‘ഇങ്ങനെ’ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: Σήμερον
  choice: ഇന്ന്
  rationale: ഉദ്ധരണിയിലെ അടിയന്തരത നിലനിർത്തുന്ന സാധാരണവും നേരിട്ടുമുള്ള കാലസൂചകപദം.
- source_word: ἐὰν … ἀκούσητε
  choice: നിങ്ങൾ … കേൾക്കുന്നെങ്കിൽ
  rationale: ἐὰν-നോടുകൂടിയ aorist subjunctive ഇവിടെ വ്യവസ്ഥാപരമായ ആഹ്വാനമാണ്; മലയാളത്തിലെ സ്വാഭാവിക വ്യവസ്ഥാരൂപം അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: τῆς φωνῆς αὐτοῦ
  choice: അവന്റെ ശബ്ദം
  rationale: വ്യക്തിപരമായ ദൈവിക അഭിസംബോധന നിലനിർത്തുന്ന സ്വാഭാവിക മലയാള ജനിറ്റീവ് പ്രയോഗം.
- source_word: Μὴ σκληρύνητε τὰς καρδίας ὑμῶν
  choice: നിങ്ങളുടെ ഹൃദയങ്ങളെ കഠിനമാക്കരുത്
  rationale: മൂലത്തിലെ നിരോധനവും ‘ഹൃദയം’ എന്ന ബൈബിൾപരമായ ആന്തരിക വ്യക്തിത്വസങ്കൽപ്പവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ὡς ἐν τῷ παραπικρασμῷ
  choice: കലാപത്തിന്റെ സമയത്തെപ്പോലെ
  rationale: παραπικρασμός സൂചിപ്പിക്കുന്ന ദൈവത്തോടുള്ള ധിക്കാരപരമായ എതിർപ്പ് ആധുനിക വായനക്കാർക്ക് വ്യക്തമായി അറിയിക്കാൻ ‘കലാപം’ തെരഞ്ഞെടുത്തു; നിർദ്ദിഷ്ടമായ പഴയ സംഭവത്തോടുള്ള താരതമ്യം ‘സമയത്തെപ്പോലെ’ സ്വാഭാവികമാക്കുന്നു.
theological_decisions:
- issue: സങ്കീർത്തനം 95-ലെ ഉദ്ധരണിയിൽ παραπικρασμός എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: കലാപം
  alternative: പ്രകോപനം
  rationale: ഈ പദം മരുഭൂമിയിൽ ഇസ്രായേൽ ദൈവത്തോടു ധിക്കാരപൂർവം എതിർത്ത സംഭവത്തെ സൂചിപ്പിക്കുന്നു. ‘കലാപം’ അതിന്റെ ധാർമികവും ഉടമ്പടിപരവുമായ ഗൗരവം ഇന്നത്തെ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു; ദൈവത്തെ പ്രകോപിപ്പിച്ച പ്രവൃത്തി എന്ന പദസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. വാക്യം മുൻസന്ദർഭവുമായി വ്യാകരണപരമായി ബന്ധപ്പെടുന്ന ഭാഗമാണെന്ന സ്വഭാവം തുടക്കത്തിലെ ‘ഇങ്ങനെ പറയപ്പെട്ടുകൊണ്ടിരിക്കുമ്പോൾ’ എന്ന പ്രയോഗത്തിലൂടെ നിലനിർത്തിയിരിക്കുന്നു.
