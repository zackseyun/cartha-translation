id: HEB.3.4
reference: Hebrews 3:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πᾶς γὰρ οἶκος κατασκευάζεται ὑπό τινος, ὁ ⸀δὲ πάντα κατασκευάσας θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/004.yaml
  text: For every house is built by someone[a], but God is the one who built all things.
translation:
  language: ml
  text: ഓരോ വീടും ആരെങ്കിലും പണിയുന്നതാണ്; കാരണം, സകലവും പണിതവൻ ദൈവമാണ്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς
  choice: ഓരോ
  rationale: ഏകവചനമായ οἶκος-നോടൊപ്പം πᾶς വിതരണാർഥത്തിലാണ്; അതിനാൽ ‘ഓരോ വീടും’ എന്നത് സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: γὰρ
  choice: ആണല്ലോ
  rationale: മുൻവാദത്തിനുള്ള വിശദീകരണകാരണം γάρ അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ വാക്യാന്തത്തിലെ ‘ആണല്ലോ’ ഈ വിശദീകരണബന്ധം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: οἶκος
  choice: വീട്
  rationale: സന്ദർഭത്തിലെ യഥാർഥ കെട്ടിടചിത്രവും തുടർന്നുള്ള രൂപകാർഥവും നിലനിർത്തുന്നു; ‘കുടുംബം’ എന്നു വിവർത്തനം ചെയ്യുന്നത് ഇവിടെ രൂപകത്തെ മുൻകൂട്ടി വ്യാഖ്യാനിക്കും.
- source_word: κατασκευάζεται
  choice: പണിയുന്നതാണ്
  rationale: വർത്തമാനകാല കർമണി രൂപം പൊതുസത്യമായി അവതരിപ്പിക്കുന്നു. ‘പണിയുക’ വാസ്തുചിത്രത്തിന് യോജിച്ച സാധാരണ മലയാളമാണ്.
- source_word: ὑπό τινος
  choice: ആരെങ്കിലും
  rationale: ὑπό കർത്തൃകാരകത്തെയും τις അനിശ്ചിത വ്യക്തിയെയും സൂചിപ്പിക്കുന്നു; ‘ആരെങ്കിലും’ അതിനെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὁ δὲ
  choice: എന്നാൽ ... ദൈവമാണ്
  rationale: δέ പൊതുതത്ത്വത്തിൽനിന്ന് അതിന്റെ പരമമായ പ്രയോഗത്തിലേക്കുള്ള മൃദുവായ വൈരുധ്യം സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിലെ substantival participle മലയാളത്തിൽ സ്വാഭാവികമായ തിരിച്ചറിയൽവാക്യമായി നൽകിയിരിക്കുന്നു.
- source_word: πάντα
  choice: സകലവും
  rationale: πάντα-യുടെ സമഗ്രമായ വ്യാപ്തി നിലനിർത്തുന്നു; ‘പ്രപഞ്ചം’ പോലുള്ള കൂടുതൽ വ്യാഖ്യാനാത്മകമായ പദം ചേർക്കുന്നില്ല.
- source_word: κατασκευάσας
  choice: പണിതത്
  rationale: ആദ്യ clause-ലെ κατασκευάζεται-യുമായുള്ള പദബന്ധവും കെട്ടിടരൂപകവും നിലനിർത്തുന്നു.
- source_word: θεός
  choice: ദൈവം
  rationale: സകലവും പണിതവനെ ദൈവമായി വ്യക്തമായി തിരിച്ചറിയുന്ന ഗ്രീക്ക് പ്രസ്താവന നേരിട്ട് നൽകുന്നു.
theological_decisions:
- issue: അവസാന clause-ൽ സകലവും പണിതവൻ ദൈവമാണെന്ന തിരിച്ചറിയൽ എങ്ങനെ നിലനിർത്തണം
  choice: സകലവും പണിതത് ദൈവമാണ്
  alternative: ദൈവമാണ് സകലവും പണിതവൻ
  rationale: ὁ ... κατασκευάσας θεός എന്ന ഗ്രീക്ക് ഘടന സകലവും പണിതവനെ ദൈവമായി തിരിച്ചറിയുന്നു. തിരഞ്ഞെടുത്ത രൂപം ഈ അവകാശവാദം വ്യക്തമായി സൂക്ഷിക്കുകയും വാക്യത്തിന്റെ കെട്ടിടസാദൃശ്യം നിലനിർത്തുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, ഗൗരവമുള്ള ശൈലി. ‘വീട്/പണിയുക’ എന്ന പദാവർത്തനം ഗ്രീക്കിലെ വാസ്തുരൂപകവും വാദത്തിന്റെ ബന്ധവും കാത്തുസൂക്ഷിക്കുന്നു. ഇംഗ്ലീഷ് അടിക്കുറിപ്പിലെ ‘everything’ എന്നത് ഇംഗ്ലീഷിലെ ശൈലിവ്യത്യാസം മാത്രമായതിനാൽ മലയാളത്തിൽ പ്രത്യേക അടിക്കുറിപ്പ് ആവശ്യമില്ല; ‘സകലവും’ തന്നെ πάντα-യുടെ അർഥം നേരിട്ട് നൽകുന്നു.
