  text: πιστὸν ὄντα τῷ ποιήσαντι αὐτὸν ὡς καὶ Μωϋσῆς ⸀ἐν τῷ οἴκῳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/002.yaml
  text: who was faithful to the one who appointed him[b][a], just as Moses also was in all his house.
translation:
  language: ml
  text: തന്നെ നിയമിച്ചവനോട് അദ്ദേഹം വിശ്വസ്തനായിരുന്നു—മോശയും അവന്റെ ഭവനത്തിൽ വിശ്വസ്തനായിരുന്നതുപോലെ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πιστὸν ὄντα
  choice: അദ്ദേഹം വിശ്വസ്തനായിരുന്നു
  rationale: ഈ പദസമുച്ചയം ഒന്നാം വാക്യത്തിൽ പരാമർശിച്ച യേശുവിനെ വിശേഷിപ്പിക്കുന്നു. πιστός ഇവിടെ ‘വിശ്വസിക്കുന്നവൻ’ എന്നതിലുപരി ഏൽപ്പിക്കപ്പെട്ട ദൗത്യത്തിൽ ആശ്രയയോഗ്യനും വിശ്വസ്തനും ആയിരിക്കുക എന്ന അർഥത്തിലാണ്.
- source_word: τῷ ποιήσαντι αὐτὸν
  choice: തന്നെ നിയമിച്ചവനോട്
  rationale: ποιέω എന്ന ക്രിയയ്ക്ക് സാധാരണയായി ‘ഉണ്ടാക്കുക/ചെയ്യുക’ എന്ന അർഥമുണ്ടെങ്കിലും, ഇവിടെ മോശയോടുള്ള താരതമ്യവും ഭവനത്തിലെ ചുമതലയെക്കുറിച്ചുള്ള തുടർന്നുള്ള വാദവും പരിഗണിക്കുമ്പോൾ ‘നിയമിക്കുക’ എന്ന സന്ദർഭാർഥം സ്വാഭാവികമാണ്. ക്രിയയുടെ അടിസ്ഥാനാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ὡς καὶ
  choice: മോശയും ... പോലെതന്നെ
  rationale: യേശുവിന്റെ വിശ്വസ്തതയും മോശയുടെ വിശ്വസ്തതയും തമ്മിലുള്ള താരതമ്യം ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: Μωϋσῆς
  choice: മോശ
  rationale: മലയാള ബൈബിൾഭാഷയിലും പൊതുവായ ഉപയോഗത്തിലുമുള്ള സ്ഥിരമായ പേരുരൂപം.
- source_word: ἐν τῷ οἴκῳ αὐτοῦ
  choice: അവിടത്തെ ഭവനത്തിൽ
  rationale: οἶκος എന്ന പദത്തിന്റെ ‘ഭവനം’ എന്ന രൂപകം തുടർന്നുള്ള വാക്യങ്ങളിൽ വികസിക്കുന്നതിനാൽ അത് നിലനിർത്തുന്നു. αὐτοῦ ആരെ സൂചിപ്പിക്കുന്നു എന്ന് പേരെടുത്ത് വ്യക്തമാക്കാതെ, ആദരസൂചകമായ സർവനാമരൂപത്തിലൂടെ ഗ്രീക്കിലെ പരാമർശതുറന്ന നില സംരക്ഷിക്കുന്നു. SBLGNT മുഖ്യപാഠത്തിൽ ‘എല്ലാ’ എന്ന പദമില്ല.
theological_decisions:
- issue: പുത്രനെ സംബന്ധിച്ച ποιήσαντι എന്ന പദത്തിന്റെ അർഥം
  choice: നിയമിച്ചവൻ
  alternative: ഉണ്ടാക്കിയവൻ
  rationale: ‘ഉണ്ടാക്കിയവൻ’ എന്നത് നിഘണ്ടുപരമായി സാധ്യമെങ്കിലും, ഈ സന്ദർഭത്തിൽ പുത്രൻ സൃഷ്ടിക്കപ്പെട്ടവനാണെന്ന ആവശ്യമില്ലാത്ത ധാരണ ഉളവാക്കാം. ദൗത്യനിയോഗവും വിശ്വസ്തതയും കേന്ദ്രീകരിക്കുന്ന സന്ദർഭത്തിൽ ‘നിയമിച്ചവൻ’ ഉദ്ദേശിച്ച അർഥം കൂടുതൽ കൃത്യമായി അറിയിക്കുന്നു; യഥാർഥ പദസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ‘അവിടത്തെ ഭവനം’ എന്നതിലെ αὐτοῦ എന്ന സർവനാമത്തിന്റെ സൂചിതൻ
  choice: മുഖ്യപാഠത്തിൽ സർവനാമമായി നിലനിർത്തി
  alternative: ദൈവത്തിന്റെ ഭവനം എന്ന് വ്യക്തമായി പറയുക; മോശയുടെ ഭവനം എന്ന് ഗ്രഹിക്കുക
  rationale: സംഖ്യ 12:7-ലെ പശ്ചാത്തലവും തന്നെ നിയമിച്ചവനിലേക്കുള്ള സമീപപരാമർശവും ദൈവത്തിന്റെ ഭവനമാണ് ഉദ്ദേശിച്ചതെന്ന് ശക്തമായി സൂചിപ്പിക്കുന്നു. എങ്കിലും ഗ്രീക്ക് പേരെടുത്ത് വ്യക്തമാക്കാത്തതിനാൽ വിവർത്തനവും അതിനെ പൂർണമായി തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘വീട്’ എന്നതിനു പകരം ‘ഭവനം’ തിരഞ്ഞെടുത്തത് 3:3–6-ൽ വികസിക്കുന്ന രൂപകവും തിരുവെഴുത്തുപരമായ ഗൗരവവും നിലനിർത്താനാണ്. വാക്യം ഒന്നാം വാക്യത്തിലെ യേശുവിനെ തുടർന്നാണ് വരുന്നതെങ്കിലും, മലയാളത്തിൽ സ്വാഭാവികമായ സമ്പൂർണ പ്രസ്താവനയായി അവതരിപ്പിച്ചു.
