- from: തന്നെ നിയമിച്ചവനോട്[a] അദ്ദേഹം വിശ്വസ്തനായിരുന്നു; മോശയും അവിടത്തെ ഭവനത്തിൽ[b] വിശ്വസ്തനായിരുന്നതുപോലെതന്നെ.
