id: HEB.11.15
reference: Hebrews 11:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἰ μὲν ἐκείνης ⸀μνημονεύουσιν ἀφ’ ἧς ⸀ἐξέβησαν, εἶχον ἂν καιρὸν ἀνακάμψαι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/015.yaml
  text: And if they had been remembering that land from which they had gone out[a], they would have had opportunity to return.
translation:
  language: ml
  text: അവർ വിട്ടുപോന്ന ആ നാടിനെ[a] ഓർത്തുകൊണ്ടിരുന്നെങ്കിൽ, മടങ്ങിപ്പോകാൻ അവർക്ക് അവസരം ഉണ്ടാകുമായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ആ ദേശത്തെ’ അല്ലെങ്കിൽ ‘ആ സ്വദേശത്തെ.’ അവർ വിട്ടുപോന്ന ഭൗമിക സ്ഥലത്തെയാണ് ഗ്രീക്ക് പദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: μνημονεύουσιν
  choice: ഓർത്തുകൊണ്ടിരുന്നെങ്കിൽ
  rationale: വർത്തമാനകാല ക്രിയാരൂപം യാഥാർഥ്യവിരുദ്ധമായ നിബന്ധനയിൽ വരുന്നതിനാൽ, സന്ദർഭത്തിൽ തുടരുന്ന മാനസിക ശ്രദ്ധയെ സൂചിപ്പിക്കുന്ന മലയാള ഭൂതകാലരൂപം സ്വാഭാവികമാണ്. വെറും ഗൃഹാതുരത്വം എന്ന ആശയം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: ἐκείνης
  choice: ആ നാടിനെ
  rationale: സ്ത്രീലിംഗ നിർദേശസർവനാമം മുൻവാക്യത്തിലെ ഭൗമിക സ്വദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘നാട്’ രാഷ്ട്രീയ അർഥത്തിൽ ഒതുങ്ങാതെ സ്ഥലത്തെയും സ്വദേശത്തെയും സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: ἀφ’ ἧς
  choice: അവർ വിട്ടുപോന്ന
  rationale: ഉത്ഭവസ്ഥലത്തുനിന്നുള്ള പുറപ്പെടൽ മലയാളത്തിൽ സ്വാഭാവികമായ ബന്ധകക്രിയാരൂപത്തിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: ἐξέβησαν
  choice: വിട്ടുപോന്ന
  rationale: ἐκβαίνω എന്നതിലെ പുറപ്പെട്ടുപോകൽ നിലനിർത്തുന്നു; ‘പോന്ന’ എന്ന രൂപം മുൻകാല പുറപ്പെടലിനെയും ഇപ്പോഴത്തെ അകലത്തെയും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: εἶχον ἂν
  choice: ഉണ്ടാകുമായിരുന്നു
  rationale: ഇംപെർഫെക്റ്റ് ക്രിയയോടുകൂടിയ ἄν സൂചിപ്പിക്കുന്ന യാഥാർഥ്യവിരുദ്ധ ഫലവാക്യത്തിന് യോജിച്ച മലയാള നിബന്ധനാരൂപമാണിത്.
- source_word: καιρὸν
  choice: അവസരം
  rationale: വെറും കാലദൈർഘ്യമല്ല, മടങ്ങാനുള്ള അനുകൂലസാധ്യതയെയോ സന്ദർഭത്തെയോ ഇവിടെ സൂചിപ്പിക്കുന്നു.
- source_word: ἀνακάμψαι
  choice: മടങ്ങിപ്പോകാൻ
  rationale: മുൻസ്ഥലത്തേക്കുള്ള തിരിച്ചുപോക്ക് വ്യക്തമായി പ്രകടിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: καὶ εἰ μὲν
  choice: …എങ്കിൽ
  rationale: മുൻസന്ദർഭത്തോട് ബന്ധമുള്ള നിബന്ധന മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു. καί, μέν എന്നിവയ്ക്ക് വേറിട്ട പദങ്ങൾ ചേർത്താൽ വാക്യം കൃത്രിമമാകുന്നതിനാൽ നിബന്ധനാഘടനയിൽ അവയുടെ പ്രവർത്തനം ഉൾക്കൊള്ളുന്നു.
theological_decisions:
- issue: ഓർത്തിരുന്ന ‘നാടിന്റെ’ സ്വഭാവം
  choice: അവർ മുമ്പ് വിട്ടുപോന്ന ഭൗമിക സ്വദേശം
  alternative: ഒരു നിർദിഷ്ട സ്ഥലമല്ലാതെ അവരുടെ പഴയ ജീവിതരീതി
  rationale: എബ്രായർ 11:13–16-ലെ അടുത്ത സന്ദർഭം പിതാക്കന്മാർ വിട്ട ഭൗമിക നാടിനെയും അവർ ആഗ്രഹിച്ച ശ്രേഷ്ഠമായ സ്വർഗീയ നാടിനെയും തമ്മിൽ വേർതിരിക്കുന്നു. അതിനാൽ മുഖ്യപാഠം സ്ഥലസംബന്ധമായ അർഥം നിലനിർത്തുന്നു; അതിനെ രൂപകമായി വ്യാഖ്യാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. യാഥാർഥ്യവിരുദ്ധ നിബന്ധന ‘ഓർത്തുകൊണ്ടിരുന്നെങ്കിൽ … ഉണ്ടാകുമായിരുന്നു’ എന്ന സ്വാഭാവിക ഘടനയിൽ സൂക്ഷിച്ചിരിക്കുന്നു. ‘നാട്’ എന്നത് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ ‘ദേശം/സ്വദേശം’ എന്നീ സാധുവായ പര്യായങ്ങൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
