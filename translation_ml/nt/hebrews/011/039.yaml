  text: ⸀καὶ πάντες μαρτυρηθέντες διὰ τῆς πίστεως οὐκ ἐκομίσαντο τὴν ἐπαγγελίαν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/039.yaml
  text: And all these[a], though commended through faith, did not receive the promise[b],
translation:
  language: ml
  text: ഇവരെല്ലാവരും വിശ്വാസത്തിലൂടെ അനുകൂല സാക്ഷ്യം ലഭിച്ചിട്ടും[a] വാഗ്ദത്തം[b] പ്രാപിച്ചില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അംഗീകാരം ലഭിച്ചിട്ടും’ അല്ലെങ്കിൽ ‘നല്ല സാക്ഷ്യം ലഭിച്ചിട്ടും.’ വിശ്വാസം മുഖാന്തരം ഇവരെക്കുറിച്ച് അനുകൂലമായ സാക്ഷ്യം നൽകപ്പെട്ടു എന്നതിനാണ് ഗ്രീക്ക് രൂപം ഊന്നൽ നൽകുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘വാഗ്ദാനം ചെയ്യപ്പെട്ടത്.’ ഇവിടെ ‘വാഗ്ദത്തത്തിന്റെ നിവൃത്തി’ എന്ന ആശയം സന്ദർഭത്തിൽ ഉൾപ്പെട്ടിരിക്കാമെങ്കിലും, ഗ്രീക്ക് പദപ്രയോഗം ‘വാഗ്ദത്തം’ എന്നുതന്നെയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: (പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല)
  rationale: മുൻവിവരണത്തോടുള്ള ബന്ധം മലയാളത്തിലെ വാക്യപ്രവാഹത്തിൽ സ്വാഭാവികമായി വ്യക്തമാകുന്നതിനാൽ ‘കൂടാതെ’ എന്നൊരു പദം ചേർത്തിട്ടില്ല; ഗ്രീക്കിലെ ലളിതമായ ബന്ധകത്തിന് ഇല്ലാത്ത വൈരുധ്യഭാവവും ചേർത്തിട്ടില്ല.
- source_word: πάντες
  choice: ഇവരെല്ലാവരും
  rationale: മുൻവാക്യങ്ങളിൽ പറഞ്ഞ വിശ്വാസമാതൃകകളിലേക്കുള്ള അന്വയം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: μαρτυρηθέντες
  choice: നല്ല സാക്ഷ്യം ലഭിച്ചിട്ടും
  rationale: ദൈവത്തിൽനിന്നുള്ള അനുകൂല സാക്ഷ്യം അഥവാ അംഗീകാരം ലഭിച്ചു എന്ന കർത്തൃവാച്യമല്ലാത്ത ആശയം നിലനിർത്തുന്നു. പിന്നാലെയുള്ള ‘പ്രാപിച്ചില്ല’ എന്നതിനോടുള്ള സന്ദർഭജന്യമായ concessive ബന്ധം ‘-ിട്ടും’ വ്യക്തമാക്കുന്നു.
- source_word: διὰ τῆς πίστεως
  choice: വിശ്വാസത്തിലൂടെ
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന മാധ്യമം/ഉപാധി സംരക്ഷിക്കുകയും πίστις എന്നതിന് പതിവായ ദൈവശാസ്ത്രപരമായ ‘വിശ്വാസം’ ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: οὐκ ἐκομίσαντο
  choice: പ്രാപിച്ചില്ല
  rationale: κομίζω എന്ന മധ്യമരൂപത്തിന്റെ ‘ലഭിക്കുക/സ്വന്തമാക്കുക’ എന്ന അർഥം dignified, natural Malayalam-ൽ നൽകുന്നു.
- source_word: τὴν ἐπαγγελίαν
  choice: വാഗ്ദത്തം
  rationale: ഗ്രീക്കിലെ നിർദിഷ്ട ഏകവചനത്തിന്റെ സംക്ഷിപ്തത നിലനിർത്തുന്നു; ‘വാഗ്ദത്തത്തിന്റെ നിവൃത്തി’ എന്ന് വികസിപ്പിച്ച് വ്യാഖ്യാനം പരിഭാഷയിൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ‘വാഗ്ദത്തം’ എന്നതിന്റെ സന്ദർഭാർഥം
  choice: വാഗ്ദത്തം
  alternative: വാഗ്ദത്തത്തിന്റെ നിവൃത്തി; വാഗ്ദാനം ചെയ്യപ്പെട്ടത്; വാഗ്ദത്തമായ അവകാശം/അനുഗ്രഹം
  rationale: പഴയകാല വിശ്വാസികൾ ഇനിയും പ്രാപിക്കാതിരുന്ന അന്തിമ വാഗ്ദത്തനിവൃത്തിയിലേക്കാണ് സന്ദർഭം വിരൽചൂണ്ടുന്നത്; എങ്കിലും ഗ്രീക്ക് അതിനെ വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കുന്നില്ല. അതിനാൽ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു.
- issue: മാർτυρηθέντες എന്നതിലെ സാക്ഷ്യത്തിന്റെ ഉറവിടം
  choice: നല്ല സാക്ഷ്യം ലഭിച്ചിട്ടും
  alternative: ദൈവത്തിന്റെ അംഗീകാരം ലഭിച്ചിട്ടും
  rationale: അദ്ധ്യായസന്ദർഭം സാക്ഷ്യം ദൈവത്തിൽനിന്നാണെന്ന് സൂചിപ്പിച്ചാലും, ഈ വാക്യത്തിൽ കർത്താവ് പ്രത്യേകം പറയുന്നില്ല. അതിനാൽ ‘ദൈവത്തിന്റെ’ എന്നു മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘നല്ല സാക്ഷ്യം ലഭിക്കുക,’ ‘വാഗ്ദത്തം പ്രാപിക്കുക’ എന്നീ പ്രയോഗങ്ങൾ എബ്രായർ 11-ലെ ആവർത്തിത ദൈവശാസ്ത്രഭാഷയോട് ചേരുന്നതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമാണ്.
