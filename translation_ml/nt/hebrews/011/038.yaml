source:
  edition: SBLGNT
  text: ὧν οὐκ ἦν ἄξιος ὁ κόσμος ⸀ἐπὶ ἐρημίαις πλανώμενοι καὶ ὄρεσι καὶ σπηλαίοις καὶ ταῖς ὀπαῖς τῆς γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/038.yaml
  text: —of whom the world was not worthy—wandering in deserts and mountains[b][a], and caves and holes in the ground.
translation:
  language: ml
  text: —ലോകം അർഹിക്കാതിരുന്നവർ—മരുഭൂമികളിലും[a] മലകളിലും ഗുഹകളിലും ഭൂമിയിലെ കുഴികളിലും[b] അലഞ്ഞുനടന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വിജനപ്രദേശങ്ങളിലും.’
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘ഭൂമിയുടെ കുഴികളിലും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν οὐκ ἦν ἄξιος ὁ κόσμος
  choice: അവർക്ക് ലോകം യോഗ്യമായിരുന്നില്ല
  rationale: ബന്ധസർവനാമത്തിന്റെ ഷഷ്ഠീവ്യാകരണരൂപം മലയാളത്തിൽ സ്വാഭാവികമായ ദാതൃപ്രയോഗത്തിലൂടെ അവതരിപ്പിക്കുന്നു; വിശ്വസ്തരായ പീഡിതരുടെ മൂല്യത്തിന് വിപരീതമായി ലോകത്തെ വിലയിരുത്തുന്ന ശക്തമായ പ്രസ്താവന നിലനിർത്തുന്നു.
- source_word: ἐπὶ ἐρημίαις
  choice: മരുഭൂമികളിലും
  rationale: ἐπί + ദാതൃവിഭക്തി ഇവിടെ സ്ഥലസൂചനയാണ്. ‘മരുഭൂമികൾ’ വ്യക്തവും ദൃശ്യവുമായ പ്രധാന അർഥം നൽകുന്നു; വിശാലമായ ‘വിജനപ്രദേശങ്ങൾ’ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: πλανώμενοι
  choice: അലഞ്ഞുനടന്നു
  rationale: സ്ഥിരവാസമില്ലാതെ അഭയാർഥികളെപ്പോലെ സഞ്ചരിച്ച അവസ്ഥയെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ὄρεσι
  choice: മലകളിലും
  rationale: ὄρος എന്ന പദത്തിന്റെ സാധാരണവും സന്ദർഭോചിതവുമായ അർഥം.
- source_word: σπηλαίοις
  choice: ഗുഹകളിലും
  rationale: ഒളിത്താവളങ്ങളായ പ്രകൃതിദത്ത ഗുഹകളെ സൂചിപ്പിക്കുന്ന ലളിതവും കൃത്യവുമായ പദം.
- source_word: ταῖς ὀπαῖς τῆς γῆς
  choice: ഭൂമിയിലെ പൊത്തുകളിലും
  rationale: ὀπή സൂചിപ്പിക്കുന്ന തുറവുകൾ, കുഴികൾ, വിടവുകൾ എന്നിവയുടെ മൂർത്തചിത്രം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘ലോകം അവർക്ക് യോഗ്യമായിരുന്നില്ല’ എന്നതിന്റെ വിലയിരുത്തൽശക്തി
  choice: വിശ്വസ്തരായ പീഡിതരുടെ മൂല്യത്തോട് താരതമ്യപ്പെടുത്തി ലോകത്തെ കുറ്റപ്പെടുത്തുന്ന ശക്തമായ പ്രസ്താവനയായി നിലനിർത്തി.
  alternative: വിശ്വസ്തരും ലോകവും തമ്മിലുള്ള പൊരുത്തക്കേടിനെക്കുറിച്ചുള്ള കൂടുതൽ നിഷ്പക്ഷമായ പ്രസ്താവന.
  rationale: ഗ്രീക്കിലെ ἄξιος വ്യക്തമായ മൂല്യനിർണയം നടത്തുന്നു. അതിനെ വെറും സാമൂഹിക അകൽച്ചയായി മയപ്പെടുത്താതെ, വാക്യം നൽകുന്ന ദൈവശാസ്ത്രപരമായ സംഘർഷം വിപുലീകരണമില്ലാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ പട്ടികാക്രമവും ‘അലഞ്ഞുനടന്നു’ എന്ന ഏക ക്രിയയുടെ വ്യാപ്തിയും നിലനിർത്തിയിരിക്കുന്നു; ഇടയ്ക്കുള്ള വിലയിരുത്തൽവാക്യം ദീർഘരേഖകൾക്കിടയിൽ സംരക്ഷിച്ചു.
