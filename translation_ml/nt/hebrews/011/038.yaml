revisions:
- from: —അവർക്ക് ലോകം യോഗ്യമായിരുന്നില്ല—അവർ മരുഭൂമികളിലും[a] മലകളിലും ഗുഹകളിലും ഭൂമിയിലെ പൊത്തുകളിലും[b] അലഞ്ഞുനടന്നു.
  to: —ലോകം അർഹിക്കാതിരുന്നവർ—മരുഭൂമികളിലും[a] മലകളിലും ഗുഹകളിലും ഭൂമിയിലെ കുഴികളിലും[b] അലഞ്ഞുനടന്നു.
  rationale: The revision corrects the direction of the worthiness statement so that the world, rather than the faithful sufferers, is evaluated as unworthy. It also uses a more transparent standard term for the openings or holes in the ground, while preserving the original’s compact list and its participial sense of homeless wandering.
