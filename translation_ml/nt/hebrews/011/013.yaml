id: HEB.11.13
reference: Hebrews 11:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Κατὰ πίστιν ἀπέθανον οὗτοι πάντες, μὴ ⸀λαβόντες τὰς ἐπαγγελίας, ἀλλὰ πόρρωθεν αὐτὰς ἰδόντες καὶ ἀσπασάμενοι, καὶ ὁμολογήσαντες ὅτι ξένοι καὶ παρεπίδημοί εἰσιν ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/013.yaml
  text: All these died in faith[a], not having received the promises, but having seen them from afar and greeted them[c][b], and having confessed that they are strangers and exiles on the earth.
translation:
  language: ml
  text: 'വിശ്വാസത്തിൽ ഇവരെല്ലാവരും മരിച്ചു: വാഗ്ദാനങ്ങൾ ലഭിക്കാതെയാണ് അവർ മരിച്ചത്; പക്ഷേ, അവയെ ദൂരത്തുനിന്ന് കണ്ട് സാദരം സ്വീകരിക്കുകയും, തങ്ങൾ ഭൂമിയിൽ അന്യരും പരദേശവാസികളുമാണെന്ന്[b] ഏറ്റുപറയുകയും ചെയ്തു[a].


    [a] അഥവാ, “അഭിവാദ്യം ചെയ്തു” അല്ലെങ്കിൽ “ആലിംഗനം ചെയ്തു.” ഇവിടെ ഗ്രീക്കുപദം ദൂരത്തുനിന്ന് കണ്ട വാഗ്ദാനങ്ങളെ സാദരം സ്വീകരിക്കുന്നതിനെ ആലങ്കാരികമായി സൂചിപ്പിക്കുന്നു.


    [b] “പരദേശവാസികൾ” എന്നത് ഒരിടത്ത് സ്ഥിരമായ അവകാശമോ പൂർണമായ അംഗത്വമോ ഇല്ലാതെ താമസിക്കുന്നവരെ സൂചിപ്പിക്കുന്നു; “താൽക്കാലിക താമസക്കാർ” എന്നും പരിഭാഷപ്പെടുത്താം.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അഭിവാദ്യം ചെയ്തു” അല്ലെങ്കിൽ “ആലിംഗനം ചെയ്തു.” ഇവിടെ ഗ്രീക്കുപദം ദൂരത്തുനിന്ന് കണ്ട വാഗ്ദാനങ്ങളെ സാദരം സ്വീകരിക്കുന്നതിനെ ആലങ്കാരികമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “പരദേശവാസികൾ” എന്നത് ഒരിടത്ത് സ്ഥിരമായ അവകാശമോ പൂർണമായ അംഗത്വമോ ഇല്ലാതെ താമസിക്കുന്നവരെ സൂചിപ്പിക്കുന്നു; “താൽക്കാലിക താമസക്കാർ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατὰ πίστιν
  choice: വിശ്വാസത്തിൽ
  rationale: κατά + accusative ഇവിടെ വിശ്വാസത്തോടൊത്ത നിലയെയോ വിശ്വാസത്തിന്റെ മണ്ഡലത്തെയോ സൂചിപ്പിക്കുന്നു. ‘വിശ്വാസത്താൽ’ എന്ന് കാരണോപാധിയായി മാത്രം ചുരുക്കാതെ, അവർ മരിക്കുമ്പോഴും നിലനിന്ന വിശ്വാസഭാവം ഇതിലൂടെ സംരക്ഷിക്കുന്നു.
- source_word: ἀπέθανον
  choice: മരിച്ചു
  rationale: ക്രിയയുടെ നേരായതും സുതാര്യവുമായ പരിഭാഷ; മൃദൂക്തി ഒഴിവാക്കുന്നു.
- source_word: οὗτοι πάντες
  choice: ഇവരെല്ലാവരും
  rationale: മുമ്പ് പരാമർശിച്ച എല്ലാവരെയും ചൂണ്ടിക്കാണിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: μὴ λαβόντες τὰς ἐπαγγελίας
  choice: വാഗ്ദാനങ്ങൾ ലഭിച്ചില്ലെങ്കിലും
  rationale: ബഹുവചനമായ ‘വാഗ്ദാനങ്ങൾ’ നിലനിർത്തുന്നു. നിഷേധാത്മക പങ്കാളിക്രിയയുടെ ആശയം മലയാളത്തിൽ സ്വാഭാവികമായ concessive ഘടനയിലൂടെ അവതരിപ്പിക്കുന്നു.
- source_word: πόρρωθεν αὐτὰς ἰδόντες
  choice: അവയെ ദൂരത്തുനിന്ന് കണ്ട്
  rationale: ദൂരെയുള്ളതിനെ കാണുന്ന സ്ഥലാത്മകവും ആലങ്കാരികവുമായ ദൃശ്യഭാവം സംരക്ഷിക്കുന്നു.
- source_word: ἀσπασάμενοι
  choice: സ്വാഗതം ചെയ്തു
  rationale: വാഗ്ദാനങ്ങളാണ് കർമം എന്നതിനാൽ ‘അഭിവാദ്യം ചെയ്തു’ എന്ന അതിപദാനുവാദത്തേക്കാൾ സ്വാഭാവികമാണ്; അതേസമയം സാദരം സ്വീകരിക്കൽ എന്ന ആലങ്കാരിക അർഥം നിലനിർത്തുന്നു. മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ὁμολογήσαντες
  choice: ഏറ്റുപറയുകയും ചെയ്തു
  rationale: പരസ്യമായി അംഗീകരിക്കുകയോ പ്രഖ്യാപിക്കുകയോ ചെയ്യുന്ന ὁμολογέωയുടെ ശക്തി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളം.
- source_word: ξένοι
  choice: അന്യർ
  rationale: സ്വദേശീയമായ പൂർണ അംഗത്വമില്ലാത്തവരെ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ പദം.
- source_word: παρεπίδημοί
  choice: പരദേശവാസികൾ
  rationale: സ്ഥിരമായ അവകാശമോ പൂർണമായ നാട്ടംഗത്വമോ ഇല്ലാതെ ഒരു സ്ഥലത്ത് കഴിയുന്നവരുടെ നില സൂചിപ്പിക്കുന്നു; നിർബന്ധിത നാടുകടത്തൽ എന്ന ആശയം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: ἐπὶ τῆς γῆς
  choice: ഭൂമിയിൽ
  rationale: ഒരു പ്രത്യേക ദേശത്തേക്കാൾ വിശാലമായ ഭൂമിയിലെ മനുഷ്യജീവിതമാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്.
theological_decisions:
- issue: πίστις എന്ന പദത്തിന്റെ സന്ദർഭാനുസൃത അർഥം
  choice: വിശ്വാസം
  alternative: വിശ്വസ്തത; ആശ്രയം
  rationale: ഇവിടെ പിതാക്കന്മാർ മരണംവരെയും പുലർത്തിയ ദൈവാശ്രയമുള്ള നിലപാടാണ് പ്രസക്തം. ‘വിശ്വാസം’ ആ അർഥം തുറന്നുവെക്കുകയും പ്രത്യേക സിദ്ധാന്തവ്യാഖ്യാനം നിർബന്ധിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: വാഗ്ദാനങ്ങളോടുള്ള ἀσπασάμενοι എന്ന ആലങ്കാരിക പ്രതികരണം
  choice: സ്വാഗതം ചെയ്തു
  alternative: അഭിവാദ്യം ചെയ്തു; ആലിംഗനം ചെയ്തു
  rationale: വാഗ്ദാനങ്ങൾ ഇനിയും ലഭിച്ചിട്ടില്ലെങ്കിലും അവയെ സന്തോഷത്തോടെ അംഗീകരിച്ചെന്ന ആലങ്കാരികത സംരക്ഷിക്കുന്നു; ‘ആലിംഗനം ചെയ്തു’ എന്നത് അർഥം കൂടുതൽ വ്യാഖ്യാനാത്മകമായി ശക്തിപ്പെടുത്താം.
- issue: παρεπίδημοί സൂചിപ്പിക്കുന്ന ഭൂമിയിലെ താമസനില
  choice: പരദേശവാസികൾ
  alternative: താൽക്കാലിക താമസക്കാർ; പ്രവാസികൾ
  rationale: ‘നാടുകടത്തപ്പെട്ടവർ’ എന്ന നിർബന്ധിത അർഥം ചേർക്കാതെ, സ്ഥിരമായ അവകാശവും പൂർണമായ ഉൾപ്പെടലും ഇല്ലാത്ത താമസനില വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ പങ്കാളിക്രിയകളുടെ നീണ്ട നിര മലയാളത്തിൽ വായനാസൗകര്യത്തിനായി രണ്ട് പ്രധാന ഖണ്ഡങ്ങളാക്കി; ദർശനം, സ്വാഗതം, ഏറ്റുപറച്ചിൽ എന്നീ ആശയക്രമം നിലനിർത്തി. ‘അന്യർ—പരദേശവാസികൾ’ എന്ന പദജോടി സാമൂഹികമായി ഉൾപ്പെടാത്തതും സ്ഥിരാവകാശമില്ലാത്തതുമായ രണ്ടു ബന്ധിത ഭാവങ്ങൾ വേർതിരിച്ചുനിർത്തുന്നു.
