  text: Πίστει ⸀καὶ περὶ μελλόντων εὐλόγησεν Ἰσαὰκ τὸν Ἰακὼβ καὶ τὸν Ἠσαῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/020.yaml
  text: By faith Isaac blessed Jacob and Esau, even concerning things to come.
translation:
  language: ml
  text: വിശ്വാസത്താൽ യിസ്ഹാക്ക് വരാനിരുന്ന കാര്യങ്ങളെക്കുറിച്ചുപോലും യാക്കോബിനെയും ഏശാവിനെയും അനുഗ്രഹിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πίστει
  choice: വിശ്വാസത്താൽ
  rationale: ഗ്രീക്ക് ദത്തിവ് ഇവിടെ ഉപാധി/അടിസ്ഥാനം സൂചിപ്പിക്കുന്നു; എബ്രായർ 11-ലെ ആവർത്തിത ശൈലിയും നിലനിർത്തുന്നു.
- source_word: καὶ περὶ μελλόντων
  choice: വരാനിരുന്ന കാര്യങ്ങളെക്കുറിച്ചുപോലും
  rationale: περὶ μελλόντων ഭാവിയിൽ സംഭവിക്കാനിരുന്ന കാര്യങ്ങളെ സൂചിപ്പിക്കുന്നു; καὶ-യുടെ ഊന്നൽ ‘പോലും’ എന്നതിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: εὐλόγησεν
  choice: അനുഗ്രഹിച്ചു
  rationale: ആശീർവാദം പ്രഖ്യാപിക്കുക/നൽകുക എന്ന സാധാരണ ബൈബിൾ അർഥം കൃത്യമായി നൽകുന്നു.
- source_word: Ἰσαὰκ ... Ἰακὼβ ... Ἠσαῦ
  choice: യിസ്ഹാക്ക് ... യാക്കോബ് ... ഏശാവ്
  rationale: മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ വ്യക്തിനാമരൂപങ്ങൾ ഉപയോഗിക്കുന്നു; വിഭക്തിക്കനുസരിച്ച് കർമരൂപങ്ങൾ ചേർക്കുന്നു.
theological_decisions:
- issue: യാക്കോബിനും ഏശാവിനും നൽകിയ അനുഗ്രഹങ്ങളുടെ ഭാവിമുഖമായ സ്വഭാവം
  choice: വരാനിരുന്ന കാര്യങ്ങളെക്കുറിച്ചുപോലും
  alternative: ഭാവികാര്യങ്ങളെക്കുറിച്ച്
  rationale: വാക്യം ആ ഭാവികാര്യങ്ങളുടെ കൃത്യസ്വഭാവം വിശദീകരിക്കുന്നില്ല; അതിനാൽ പ്രവചനം തുടങ്ങിയ കൂടുതൽ നിർദ്ദിഷ്ടമായ വ്യാഖ്യാനം ചേർക്കാതെ ഗ്രീക്കിലെ തുറന്ന പ്രയോഗം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ സാധാരണ മലയാളം. ഗ്രീക്ക് പദക്രമത്തിന്റെ ഊന്നൽ കഴിയുന്നത്ര നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ മലയാള വാക്യഘടന ഉപയോഗിച്ചു.
