source:
  edition: SBLGNT
  text: οἳ διὰ πίστεως κατηγωνίσαντο βασιλείας, εἰργάσαντο δικαιοσύνην, ἐπέτυχον ἐπαγγελιῶν, ἔφραξαν στόματα λεόντων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/033.yaml
  text: who through faith conquered kingdoms[a], worked righteousness, obtained promises, shut the mouths of lions[b],
translation:
  language: ml
  text: വിശ്വാസത്തിലൂടെ[b] അവർ രാജ്യങ്ങളെ കീഴടക്കി, നീതി പ്രവർത്തിച്ചു[a], വാഗ്ദാനങ്ങൾ പ്രാപിച്ചു, സിംഹങ്ങളുടെ വായടച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നീതി നടപ്പാക്കി.” ഗ്രീക്ക് പദത്തിന് സന്ദർഭമനുസരിച്ച് നീതിനിഷ്ഠയെയോ നീതി പ്രവർത്തിക്കുന്നതിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “വിശ്വാസത്താൽ.” ഇവിടെ വിശ്വാസം അവർ പ്രവർത്തിച്ച മാർഗമോ ഉപകരണമോ ആയി അവതരിപ്പിക്കപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ πίστεως
  choice: വിശ്വാസത്തിലൂടെ
  rationale: διά + genitive ഇവിടെ പ്രവർത്തനത്തിന്റെ മാർഗമോ ഉപകരണമോ സൂചിപ്പിക്കുന്നു. ‘വിശ്വാസത്തിലൂടെ’ എന്നത് ഗ്രീക്ക് ഘടനയും എബ്രായർ 11-ലെ മുഖ്യപ്രമേയവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: κατηγωνίσαντο βασιλείας
  choice: രാജ്യങ്ങളെ കീഴടക്കി
  rationale: യുദ്ധത്തിലോ സംഘർഷത്തിലോ മേൽക്കൈ നേടി അധീനമാക്കുക എന്ന ശക്തമായ അർഥം ‘കീഴടക്കി’ വ്യക്തമാക്കുന്നു; βασιλείας ഇവിടെ രാഷ്ട്രീയ രാജ്യങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: εἰργάσαντο δικαιοσύνην
  choice: നീതി പ്രവർത്തിച്ചു
  rationale: ἐργάζομαι എന്നതിന്റെ സജീവമായ ‘പ്രവർത്തിക്കുക/നടപ്പാക്കുക’ എന്ന ആശയവും δικαιοσύνηയുടെ ധാർമികമായ നീതി/നീതിനിഷ്ഠ എന്ന അർഥവ്യാപ്തിയും ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: ἐπέτυχον ἐπαγγελιῶν
  choice: വാഗ്ദാനങ്ങൾ പ്രാപിച്ചു
  rationale: ἐπιτυγχάνω എന്നത് നേടുക, പ്രാപിക്കുക എന്നർഥം നൽകുന്നു. വാഗ്ദാനങ്ങൾ എത്രത്തോളം നിവൃത്തിയായി എന്ന എബ്രായർ ലേഖനത്തിലെ സംഘർഷം അമിതമായി നിർവചിക്കാതെ ‘പ്രാപിച്ചു’ നിലനിർത്തുന്നു.
- source_word: ἔφραξαν στόματα λεόντων
  choice: സിംഹങ്ങളുടെ വായടച്ചു
  rationale: φράσσω എന്നതിന്റെ അടയ്ക്കുക/തടയുക എന്ന അർഥവും ദൃശ്യബിംബത്തിന്റെ ശക്തിയും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: Hebrews 11-ലെ πίστις എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: വിശ്വാസം
  alternative: ആശ്രയം; വിശ്വസ്തത
  rationale: ഈ അധ്യായത്തിൽ ദൈവത്തെ ആശ്രയിച്ച് പ്രവർത്തിക്കുന്നതാണു മുഖ്യസന്ദർഭം. അതിനാൽ ‘വിശ്വാസം’ ഏറ്റവും യോജിച്ച മുഖ്യവിവർത്തനമാണ്; ‘വിശ്വസ്തത’ ഇവിടെ അനാവശ്യമായി കർത്തൃഗുണത്തിലേക്ക് അർഥം ചുരുക്കാം.
- issue: δικαιοσύνη എന്ന പദത്തിന്റെ ധാർമിക-ന്യായപരമായ അർഥവ്യാപ്തി
  choice: നീതി
  alternative: നീതിനിഷ്ഠ; നീതി നടപ്പാക്കൽ
  rationale: ഇവിടെ പദം ശരിയായതു ചെയ്യുന്നതിനെയും നീതി നടപ്പാക്കുന്നതിനെയും ഉൾക്കൊള്ളാം. ‘നീതി’ ഈ രണ്ട് വശങ്ങളും തുറന്നുവെക്കുന്നു; ഒരു പ്രത്യേക സിദ്ധാന്തപരമായ അർഥത്തിലേക്ക് പദത്തെ ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. ഗ്രീക്ക് മൂലത്തിലെ നാല് സമാന്തര ക്രിയാഖണ്ഡങ്ങളുടെ ദ്രുതഗതിയുള്ള പട്ടികാശൈലി നിലനിർത്തിയിരിക്കുന്നു. നൽകിയ ഇംഗ്ലീഷ് കരടിൽ അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങളിൽ നിന്ന് മാറിനിന്നതിനാൽ, മലയാളത്തിൽ [b] ‘വിശ്വാസത്തിലൂടെ’ എന്നതിനും [a] ‘നീതി പ്രവർത്തിച്ചു’ എന്നതിനും പിന്നാലെ യുക്തിയായി സ്ഥാപിച്ചു.
