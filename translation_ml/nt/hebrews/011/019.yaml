id: HEB.11.19
reference: Hebrews 11:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λογισάμενος ὅτι καὶ ἐκ νεκρῶν ἐγείρειν δυνατὸς ὁ θεός· ὅθεν αὐτὸν καὶ ἐν παραβολῇ ἐκομίσατο.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/019.yaml
  text: having considered that God is able even to raise from the dead[a], from where, in a figure[b], he also received him back.
translation:
  language: ml
  text: ദൈവത്തിന് മരിച്ചവരിൽനിന്നുപോലും ഉയിർപ്പിക്കാൻ കഴിയുമെന്ന് അവൻ കണക്കാക്കി; അവിടെനിന്ന്[a], ഒരു ഉപമയിലെന്നപോലെ[b], അവന് അവനെ തിരികെ ലഭിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അതിൽനിന്ന്.” ഗ്രീക്ക് പദം മുൻപറഞ്ഞ മരണ-പുനരുത്ഥാന ആശയത്തിലേക്കുള്ള ബന്ധം സൂചിപ്പിക്കുന്നു; “അതിനാൽ” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “ഒരു ഉപമയിൽ.” അബ്രാഹാമിന് ഇസഹാക്കിനെ മരണത്തിൽനിന്നു തിരികെ ലഭിച്ചതുപോലെയായിരുന്നു.
    reason: lexical_and_contextual_clarification
lexical_decisions:
- source_word: λογισάμενος
  choice: കണക്കാക്കി
  rationale: അബ്രാഹാമിന്റെ ആന്തരികമായ യുക്തിചിന്തയെയും ഉറച്ച നിഗമനത്തെയും സൂചിപ്പിക്കുന്ന ക്രിയാപദം. മലയാളത്തിൽ സ്വാഭാവികമായിരിക്കെ മൂലപദത്തിന്റെ വിവേചനാത്മക ഭാവം നിലനിർത്തുന്നു.
- source_word: καὶ ἐκ νεκρῶν
  choice: മരിച്ചവരിൽനിന്നുപോലും
  rationale: പുനരുത്ഥാനസംബന്ധമായ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; καὶ എന്നതിന്റെ ഊന്നൽ ‘പോലും’ വഴി പ്രകടമാക്കുന്നു.
- source_word: ἐγείρειν
  choice: ഉയിർപ്പിക്കാൻ
  rationale: ഈ സന്ദർഭത്തിലെ പുനരുത്ഥാനാർഥം വ്യക്തമായി അറിയിക്കുന്ന സാധാരണ മലയാളപ്രയോഗം.
- source_word: δυνατὸς ὁ θεός
  choice: ദൈവത്തിനു കഴിയും
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാല ശേഷിപ്രസ്താവന സംക്ഷിപ്തമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: ὅθεν
  choice: അതിനാൽ
  rationale: മുൻപ്രസ്താവനയിൽനിന്നുള്ള നിഗമനമോ ഫലമോ ഇവിടെ ഏറ്റവും സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു; പദത്തിന്റെ സ്രോതസ്സിനെ സൂചിപ്പിക്കാവുന്ന അർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἐν παραβολῇ
  choice: പ്രതീകാത്മകമായ അർഥത്തിൽ
  rationale: ഇസഹാക്കിനെ യഥാർഥ പുനരുത്ഥാനത്തിലൂടെയല്ല, മരണത്തിൽനിന്നു ലഭിച്ചതുപോലെ അബ്രാഹാം തിരികെ ലഭിച്ചു എന്ന സാദൃശ്യഭാവം വ്യക്തമാക്കുന്നു; ‘ഉപമയിൽ’ എന്ന കൂടുതൽ രൂപാനുസൃത സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἐκομίσατο
  choice: തിരികെ ലഭിക്കുകയും ചെയ്തു
  rationale: നഷ്ടപ്പെടാനിരുന്ന മകനെ വീണ്ടും ലഭിച്ചുവെന്ന സന്ദർഭാർഥവും ഗ്രീക്ക് മധ്യമപ്രയോഗത്തിന്റെ അനുഭവഭാവവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: αὐτόν
  choice: അവനെ
  rationale: മൂലത്തിലെ സർവനാമം നിലനിർത്തുന്നു; മുൻസന്ദർഭത്തിൽ അത് ഇസഹാക്കിനെ സൂചിപ്പിക്കുന്നത് വ്യക്തമാണ്.
theological_decisions:
- issue: ഇസഹാക്കിനെ ‘തിരികെ ലഭിച്ചതിന്റെ’ സ്വഭാവം
  choice: യഥാർഥ പുനരുത്ഥാനമെന്നല്ല, പുനരുത്ഥാനത്തോടു സാദൃശ്യമുള്ള പ്രതീകാത്മകമായ തിരിച്ചുകിട്ടൽ എന്ന നിലയിൽ അവതരിപ്പിച്ചു.
  alternative: ‘ഒരു ഉപമയിൽ’ എന്നു രൂപാനുസൃതമായി പരിഭാഷപ്പെടുത്തി സംഭവത്തിന്റെ ഉപമാത്മകമോ മാതൃകാത്മകമോ ആയ ഭാവം കൂടുതൽ തുറന്ന നിലയിൽ വിടാം.
  rationale: ἐν παραβολῇ യഥാർഥ പുനരുത്ഥാനം സംഭവിച്ചുവെന്ന് പറയുന്നില്ല; അതേസമയം സംഭവത്തിന്റെ സാദൃശ്യപരവും സാധ്യതയുള്ള മാതൃകാത്മകവുമായ ശക്തി ഇല്ലാതാക്കാതിരിക്കാൻ വ്യാഖ്യാനം അതിരുകടന്ന് നിർണ്ണയിച്ചിട്ടില്ല.
- issue: ὅθεν എന്ന പദത്തിന്റെ ബന്ധം
  choice: മുൻചിന്തയിൽനിന്നുള്ള ഫലമായി ‘അതിനാൽ’ എന്നു നൽകി.
  alternative: ‘അവിടെനിന്ന്’ അഥവാ ‘അതിൽനിന്ന്’ എന്നു നൽകി മരിച്ചവരിൽനിന്നുള്ള സ്രോതസ്സുമായുള്ള ബന്ധം ഊന്നാം.
  rationale: സന്ദർഭത്തിൽ നിഗമനബന്ധം മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികമാണ്; എന്നാൽ ഗ്രീക്ക് പദത്തിനുള്ള സ്രോതസ്സ്/സ്ഥലം സൂചിപ്പിക്കുന്ന സാധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. സങ്കീർണമായ ഗ്രീക്ക് പങ്കുപദഘടന വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി. മുൻസന്ദർഭം വ്യക്തമായതിനാൽ മൂലത്തിലെ സർവനാമങ്ങൾ നിലനിർത്തി; പ്രത്യേക മതവിഭാഗപരമായ സാങ്കേതിക പദങ്ങൾ ഒഴിവാക്കി.
