revisions:
- from: മരിച്ചവരിൽനിന്നുപോലും ഉയിർപ്പിക്കാൻ ദൈവത്തിനു കഴിയുമെന്ന് അവൻ കണക്കാക്കി. അതിനാൽ[a], പ്രതീകാത്മകമായ അർഥത്തിൽ[b] അവന് അവനെ തിരികെ ലഭിക്കുകയും ചെയ്തു.
  to: ദൈവത്തിന് മരിച്ചവരിൽനിന്നുപോലും ഉയിർപ്പിക്കാൻ കഴിയുമെന്ന് അവൻ കണക്കാക്കി; അവിടെനിന്ന്[a], ഒരു ഉപമയിലെന്നപോലെ[b], അവന് അവനെ തിരികെ ലഭിച്ചു.
  rationale: പരിഷ്കരണം ὅθεν-ന്റെ സ്രോതസ്സ്/സ്ഥലബന്ധം ‘അവിടെനിന്ന്’ എന്നതിലൂടെ സംരക്ഷിക്കുന്നു. ἐν παραβολῇ-യെ ‘ഒരു ഉപമയിലെന്നപോലെ’ എന്ന് നൽകുന്നതിലൂടെ യഥാർഥ പുനരുത്ഥാനം സംഭവിച്ചു എന്ന് വാക്യം പറയാതെ, സംഭവത്തിന്റെ സാദൃശ്യപരമായ സ്വഭാവം വ്യക്തമാക്കുന്നു. ശേഷിക്കുന്ന മുഖ്യപദങ്ങൾ മൂലഗ്രീക്കിനോടും സ്വാഭാവിക ആധുനിക മലയാളപ്രയോഗത്തോടും യോജിച്ചതിനാൽ നിലനിർത്തിയിരിക്കുന്നു.
