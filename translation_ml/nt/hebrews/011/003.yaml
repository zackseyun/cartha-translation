  rationale: καταρτίζω എന്നതിന് ഒരുക്കുക, യഥാസ്ഥാനപ്പെടുത്തുക, സജ്ജമാക്കുക എന്നീ അർത്ഥങ്ങളുണ്ട്. പൂർണ്ണകാല നിഷ്ക്രിയരൂപത്തിന്റെ പൂർത്തിയായതും നിലവിൽ ഫലമുള്ളതുമായ ഭാവം ഈ പ്രയോഗം നിലനിർത്തുന്നു; ഭൗതിക സൃഷ്ടി മാത്രം എന്ന് അമിതമായി നിർണ്ണയിക്കുന്നില്ല.
