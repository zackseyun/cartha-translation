theological_decisions:
- issue: സൃഷ്ടിയുമായി ബന്ധപ്പെട്ട αἰῶνες എന്നതിന്റെ വ്യാപ്തി
  choice: പ്രധാനപാഠത്തിൽ ‘യുഗങ്ങൾ’ എന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ലോകങ്ങൾ’ അല്ലെങ്കിൽ ‘പ്രപഞ്ചം’
  rationale: ഗ്രീക്ക് പദത്തിന് കാലപരമായ അർത്ഥമുണ്ടെങ്കിലും എബ്രായർ ലേഖനത്തിൽ കാലത്തിലുടനീളമുള്ള സൃഷ്ടലോകക്രമത്തെയും ഉൾക്കൊള്ളാം. ‘യുഗങ്ങൾ’ മൂലപാഠത്തിന്റെ കാല-പ്രപഞ്ച വ്യാപ്തി തുറന്നുവെക്കുന്നു; മറ്റു വായനകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: ദൃശ്യമായവയിൽനിന്നല്ല സൃഷ്ടി ഉണ്ടായത് എന്ന പ്രസ്താവനയുടെ ദൈവശാസ്ത്രപരമായ പരിധി
  choice: കാണപ്പെടുന്നത് ദൃശ്യമായവയിൽനിന്ന് ഉണ്ടായതല്ല എന്ന് മൂലപാഠത്തിന്റെ വ്യക്തമായ അവകാശവാദം മാത്രം രേഖപ്പെടുത്തി.
  alternative: ‘ഒന്നുമില്ലായ്മയിൽനിന്നുള്ള സൃഷ്ടി’ എന്ന് നേരിട്ട് വ്യക്തമാക്കുക
  rationale: ഈ വാക്യം ഒന്നുമില്ലായ്മയിൽനിന്നുള്ള സൃഷ്ടി എന്ന ഉപദേശവുമായി പൊരുത്തപ്പെടുന്നുവെങ്കിലും, ഗ്രീക്ക് വാചകം നേരിട്ട് പറയുന്നത് ദൃശ്യമായത് ദൃശ്യവസ്തുക്കളിൽനിന്ന് ഉണ്ടായതല്ല എന്നാണ്. അതിനപ്പുറം സിദ്ധാന്തപരമായ വിശദീകരണം പ്രധാനപാഠത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘യുഗങ്ങൾ’ എന്ന മൂലപാഠസമീപമായ പദം നിലനിർത്തി അതിന്റെ പ്രപഞ്ചപരമായ സാധ്യത അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു. വാക്യഘടന വായനാസൗകര്യത്തിനായി രണ്ടു വാക്യങ്ങളാക്കിയെങ്കിലും ഗ്രീക്കിലെ ഉപാധി, തിരിച്ചറിവ്, ഫലം എന്നീ ബന്ധങ്ങൾ സംരക്ഷിച്ചു.
