  yaml_path: translation/nt/hebrews/011/003.yaml
  text: By faith we understand that the ages were framed by the word of God[a], so that what is seen did not come into being from things that are visible.
translation:
  language: ml
  text: 'വിശ്വാസത്താൽ നാം മനസ്സിലാക്കുന്നു: യുഗങ്ങൾ[a] ദൈവത്തിന്റെ വചനത്താൽ ക്രമീകരിക്കപ്പെട്ടിരിക്കുന്നു. അങ്ങനെ, കാണപ്പെടുന്നത് ദൃശ്യമായവയിൽനിന്ന് ഉണ്ടായതല്ല.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ലോകങ്ങൾ’ അല്ലെങ്കിൽ ‘പ്രപഞ്ചം’; ഗ്രീക്കിൽ അക്ഷരാർഥം ‘യുഗങ്ങൾ.’ ഈ പദത്തിന് കാലത്തിലുടനീളമുള്ള ലോകക്രമത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
