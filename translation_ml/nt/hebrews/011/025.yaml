revisions:
- from: പാപത്തിന്റെ താത്കാലികമായ സുഖം അനുഭവിക്കുന്നതിനെക്കാൾ ദൈവജനത്തോടൊപ്പം പീഡനം സഹിക്കാനാണ് അദ്ദേഹം തിരഞ്ഞെടുത്തത്.[a]
  to: പാപത്തിന്റെ താൽക്കാലിക സുഖം അനുഭവിക്കുന്നതിനെക്കാൾ ദൈവജനത്തോടൊപ്പം പീഡിപ്പിക്കപ്പെടാനാണ് അദ്ദേഹം തിരഞ്ഞെടുത്തത്.[a]
  rationale: The revision retains the source’s comparative structure, its deliberate choice, and the broad expression “enjoyment of sin.” It changes only the suffering verb to make the Greek passive explicit and standardizes the spelling of “temporary.” The alternative footnote remains properly anchored to πρόσκαιρον and does not alter the meaning.
  reviewer_model: gpt-5.6-terra
