source:
  edition: SBLGNT
  text: μᾶλλον ἑλόμενος συγκακουχεῖσθαι τῷ λαῷ τοῦ θεοῦ ἢ πρόσκαιρον ἔχειν ἁμαρτίας ἀπόλαυσιν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/025.yaml
  text: choosing rather to be mistreated with the people of God than to have the temporary enjoyment of sin,[a]
translation:
  language: ml
  text: പാപത്തിന്റെ താൽക്കാലിക സുഖം അനുഭവിക്കുന്നതിനെക്കാൾ ദൈവജനത്തോടൊപ്പം പീഡിപ്പിക്കപ്പെടാനാണ് അദ്ദേഹം തിരഞ്ഞെടുത്തത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘പാപത്തിന്റെ ക്ഷണികമായ സുഖം.’
    reason: πρόσκαιρον എന്നതിന് ‘താൽക്കാലിക’ എന്നതിനൊപ്പം, അതിന്റെ വേഗം കടന്നുപോകുന്ന സ്വഭാവത്തിന് ഊന്നൽ നൽകുന്ന ‘ക്ഷണികമായ’ എന്നും വിവർത്തനം ചെയ്യാം.
lexical_decisions:
- source_word: μᾶλλον ἑλόμενος
  choice: തിരഞ്ഞെടുത്തത്
  rationale: താരതമ്യത്തിലുള്ള രണ്ട് വഴികളിൽ മോശ നടത്തിയ ബോധപൂർവമായ വ്യക്തിപരമായ തിരഞ്ഞെടുപ്പിനെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘...നെക്കാൾ ...ആണ്’ എന്ന ഘടന μᾶλλον ... ἢ എന്ന മുൻഗണനാസൂചന നിലനിർത്തുന്നു.
- source_word: συγκακουχεῖσθαι
  choice: പീഡനം സഹിക്കാൻ
  rationale: συν- സൂചിപ്പിക്കുന്ന കൂട്ടായ പങ്കാളിത്തം ‘ദൈവജനത്തോടൊപ്പം’ എന്നതിലൂടെ പ്രകടമാകുന്നു; ശേഷിക്കുന്ന ക്രിയാഭാഗം ദുഷ്പെരുമാറ്റവും കഷ്ടാനുഭവവും ഉൾക്കൊള്ളുന്ന വിധത്തിൽ പരിഭാഷപ്പെടുത്തി.
- source_word: τῷ λαῷ τοῦ θεοῦ
  choice: ദൈവജനത്തോടൊപ്പം
  rationale: ഉടമ്പടിസംബന്ധമായ ‘ദൈവജനം’ എന്ന പ്രയോഗവും അവരോടുള്ള ഐക്യദാർഢ്യവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: πρόσκαιρον
  choice: താത്കാലികമായ
  rationale: അൽപ്പകാലം മാത്രം നിലനിൽക്കുന്നതെന്ന അർത്ഥം വ്യക്തവും ആധുനികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἔχειν
  choice: അനുഭവിക്കുന്നതിനെ
  rationale: ἀπόλαυσιν എന്ന നാമത്തോടു ചേർന്ന ἔχειν മലയാളത്തിൽ അക്ഷരാർഥമായി ‘ഉണ്ടായിരിക്കുക’ എന്നു പറഞ്ഞാൽ അസ്വാഭാവികമാകുന്നതിനാൽ, മുഴുവൻ പ്രയോഗത്തിന്റെ അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἁμαρτίας ἀπόλαυσιν
  choice: പാപത്തിന്റെ ... സുഖം
  rationale: പാപവുമായി ബന്ധപ്പെട്ട ആസ്വാദനമെന്ന വിശാലത നിലനിർത്തുന്നു; ഏതു പ്രത്യേക പാപമാണ് ഉദ്ദേശ്യമെന്ന് നിർവചിക്കുന്നില്ല.
theological_decisions:
- issue: ദൈവജനത്തോടൊപ്പം കഷ്ടം സഹിക്കുന്നതിന് എതിരായി മോശ നിരസിച്ച വഴിയുടെ സ്വഭാവം
  choice: പാപവുമായി ബന്ധപ്പെട്ട താത്കാലിക സുഖം എന്ന പൊതുവായ ധാർമ്മിക വൈരുധ്യം നിലനിർത്തി.
  alternative: ഫറവോന്റെ കൊട്ടാരത്തിലെ പദവിയും സൗകര്യങ്ങളും നിലനിർത്താൻ ആവശ്യമായ ഒത്തുതീർപ്പുകളെയോ ഈജിപ്തുമായി ബന്ധപ്പെട്ട പ്രത്യേക പാപസുഖങ്ങളെയോ സൂചിപ്പിക്കുന്നതായി വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്ക് വാക്യം പാപത്തിന്റെ പ്രത്യേക രൂപം നിർവചിക്കുന്നില്ല; അതിനാൽ പരിഭാഷ അതിന്റെ വിശാലതയും ദൈവജനത്തോടുള്ള ഐക്യദാർഢ്യവുമായുള്ള വൈരുധ്യവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി. മുൻവാക്യത്തിലെ മോശയെ സൂചിപ്പിക്കുന്ന കർത്താവ് ‘അദ്ദേഹം’ എന്നു വ്യക്തമാക്കി; പങ്കാളിത്തം ‘ദൈവജനത്തോടൊപ്പം’ എന്നതിലൂടെ പ്രകടമാക്കി.
