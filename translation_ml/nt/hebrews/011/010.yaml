id: HEB.11.10
reference: Hebrews 11:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐξεδέχετο γὰρ τὴν τοὺς θεμελίους ἔχουσαν πόλιν, ἧς τεχνίτης καὶ δημιουργὸς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/010.yaml
  text: For he was waiting for the city that has foundations[b][a], whose architect and builder is God.
translation:
  language: ml
  text: കാരണം, അടിത്തറകളുള്ള നഗരത്തിനായി അവൻ കാത്തിരിക്കുകയായിരുന്നു[a]; അതിന്റെ രൂപകല്പനക്കാരനും നിർമ്മാതാവും ദൈവമാണ്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അടിത്തറകൾ ഉള്ള നഗരം.’ ബഹുവചനം അതിന്റെ സ്ഥിരതയും ഉറപ്പും ഊന്നിക്കാട്ടുന്നുണ്ടാകാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അതിന്റെ ശില്പിയും ഉണ്ടാക്കുന്നവനും ദൈവമാണ്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεδέχετο
  choice: കാത്തിരിക്കുകയായിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം മുൻകാലത്ത് തുടർന്നിരുന്ന പ്രതീക്ഷയോടെയുള്ള കാത്തിരിപ്പിനെ സൂചിപ്പിക്കുന്നു; ഈ മലയാളപ്രയോഗം ആ ദീർഘത നിലനിർത്തുന്നു.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തിൽ അബ്രാഹാം വിശ്വാസത്താൽ താൽക്കാലികമായി പാർത്തതിന്റെ വിശദീകരണബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: τοὺς θεμελίους ἔχουσαν πόλιν
  choice: അടിത്തറകളുള്ള നഗരം
  rationale: ഗ്രീക്കിലെ പങ്കാളിത്തപ്രയോഗത്തിന്റെ അർഥവും നിർദിഷ്ടമായ നഗരസൂചനയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: θεμελίους
  choice: അടിത്തറകൾ
  rationale: ഗ്രീക്കിലെ ബഹുവചനം കൃത്യമായി നിലനിർത്തുന്നു; പശ്ചാത്തലത്തിലെ കൂടാരങ്ങളുടെ താൽക്കാലികതയ്ക്ക് വിപരീതമായ സ്ഥിരതയും ഇത് സൂചിപ്പിക്കാം.
- source_word: πόλιν
  choice: നഗരം
  rationale: സന്ദർഭത്തിനും എബ്രായലേഖനത്തിലെ ദൈവനഗര പ്രതിച്ഛായയ്ക്കും യോജിച്ച സാധാരണ മലയാളപദം.
- source_word: ἧς
  choice: അതിന്റെ
  rationale: നഗരത്തെ സൂചിപ്പിക്കുന്ന ഷഷ്ഠീവാചക ബന്ധസർവനാമത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: τεχνίτης
  choice: ശില്പി
  rationale: വിദഗ്ധമായി രൂപകല്പന ചെയ്യുന്നവനെയോ പണിയുന്നവനെയോ സൂചിപ്പിക്കുന്ന പദം; δημιουργός എന്ന തുടർപദത്തിൽനിന്ന് വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: δημιουργός
  choice: നിർമ്മാതാവ്
  rationale: ഉണ്ടാക്കുന്നവൻ എന്ന വിശാല അർഥവും നഗരനിർമാണത്തിന്റെ സന്ദർഭവും ഉൾക്കൊള്ളുന്നു.
- source_word: ὁ θεός
  choice: ദൈവം
  rationale: വിഷയപദത്തിന്റെ പതിവും വ്യക്തവുമായ മലയാളപരിഭാഷ.
theological_decisions:
- issue: വാഗ്ദത്ത നഗരത്തിന്റെ സ്വഭാവം
  choice: അടിത്തറകളുള്ള നഗരം
  alternative: സ്വർഗീയ നഗരം; സ്ഥിരമായ അടിത്തറകളുള്ള നഗരം
  rationale: ഈ വാക്യം നഗരത്തെ ‘സ്വർഗീയ നഗരം’ എന്നോ ‘പുതിയ യെരൂശലേം’ എന്നോ നേരിട്ട് നാമകരണം ചെയ്യുന്നില്ല. അതിനാൽ ദൈവം അതിന്റെ ശില്പിയും നിർമ്മാതാവുമാണെന്ന പ്രതിച്ഛായ നിലനിർത്തി, വിശാലമായ ദൈവശാസ്ത്രപരമായ തിരിച്ചറിയൽ മുഖ്യപാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ ബഹുവചനമായ ‘അടിത്തറകൾ’ നിലനിർത്തി; നഗരത്തെ സ്വർഗീയമെന്നോ പുതിയ യെരൂശലേമെന്നോ മുഖ്യപാഠത്തിൽ വിശദീകരിച്ചിട്ടില്ല.
