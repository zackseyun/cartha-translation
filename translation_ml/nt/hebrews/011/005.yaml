    text: അഥവാ, ‘മരണം അനുഭവിക്കാതിരിക്കേണ്ടതിന്.’ ‘മരണം കാണുക’ എന്നത് ഗ്രീക്കിലെ ഒരു ഭാഷാപ്രയോഗമാണ്.
