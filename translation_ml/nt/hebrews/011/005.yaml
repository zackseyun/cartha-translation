id: HEB.11.5
reference: Hebrews 11:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Πίστει Ἑνὼχ μετετέθη τοῦ μὴ ἰδεῖν θάνατον, καὶ οὐχ ηὑρίσκετο διότι μετέθηκεν αὐτὸν ὁ θεός· πρὸ γὰρ τῆς ⸀μεταθέσεως μεμαρτύρηται εὐαρεστηκέναι τῷ θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/005.yaml
  text: By faith Enoch was taken away so that he should not see death[a], and he was not found because God had taken him away. For before his being taken away, he had been commended as having pleased God[c][b],
translation:
  language: ml
  text: വിശ്വാസത്താൽ ഹാനോക്ക് മരണം കാണാതിരിക്കേണ്ടതിന് എടുത്തുകൊണ്ടുപോകപ്പെട്ടു. ദൈവം അവനെ എടുത്തുകൊണ്ടുപോയതിനാൽ അവനെ കണ്ടെത്താനായില്ല. എടുത്തുകൊണ്ടുപോകപ്പെടുന്നതിനുമുമ്പ്, അവൻ ദൈവത്തെ പ്രസാദിപ്പിച്ചവനാണെന്ന് സാക്ഷ്യം ലഭിച്ചിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πίστει
  choice: വിശ്വാസത്താൽ
  rationale: πίστις എന്ന പദത്തിന് എബ്രായർ 11-ൽ യോജിക്കുന്ന സ്ഥിരമായ അർഥം ‘വിശ്വാസം’ ആണ്; ദത്തിവ് ഇവിടെ ഹാനോക്കിന്റെ അനുഭവത്തിന്റെ മാർഗമോ അടിസ്ഥാനമോ സൂചിപ്പിക്കുന്നു.
- source_word: Ἑνὼχ
  choice: ഹാനോക്ക്
  rationale: ഉല്പത്തി പുസ്തകത്തിലെ ഈ വ്യക്തിക്കായി മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ സുപരിചിതമായ പേരുരൂപം നിലനിർത്തുന്നു.
- source_word: μετετέθη / μετέθηκεν / μεταθέσεως
  choice: എടുത്തുകൊള്ളപ്പെട്ടു / എടുത്തുകൊണ്ടതിനാൽ / എടുത്തുകൊള്ളപ്പെടുന്നതിനുമുമ്പ്
  rationale: ഒരേ പദകുടുംബത്തിന്റെ ആവർത്തനം കഴിയുന്നത്ര നിലനിർത്തിക്കൊണ്ട്, ദൈവം ഹാനോക്കിനെ ഭൗമികജീവിതത്തിൽനിന്ന് മാറ്റിയെന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; ‘സ്വർഗത്തിലേക്ക്’ എന്ന ഉറവിടത്തിൽ വ്യക്തമല്ലാത്ത വിശദീകരണം ചേർക്കുന്നില്ല.
- source_word: τοῦ μὴ ἰδεῖν θάνατον
  choice: മരണം കാണാതിരിക്കേണ്ടതിന്
  rationale: ഗ്രീക്കിലെ ‘മരണം കാണുക’ എന്ന പ്രയോഗം മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു; articular infinitive-ന്റെ ഉദ്ദേശ്യം/ഫലം എന്ന ബന്ധം ‘-േണ്ടതിന്’ വഴി പ്രകടമാക്കുന്നു.
- source_word: οὐχ ηὑρίσκετο
  choice: അവനെ കണ്ടെത്താനായില്ല
  rationale: ആരാണ് അന്വേഷിച്ചതെന്നത് വ്യക്തമാക്കാതെവിട്ട്, അവനെ കണ്ടെത്തിയില്ല എന്ന ഗ്രീക്ക് ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: μεμαρτύρηται
  choice: സാക്ഷ്യം ലഭിച്ചിരുന്നു
  rationale: perfect passive രൂപവും തിരുവെഴുത്തിലൂടെയോ ദൈവികമായോ ലഭിച്ച അംഗീകാരത്തിന്റെ ആശയവും സംരക്ഷിക്കുന്നു; ‘പ്രശംസിക്കപ്പെട്ടു’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക രൂപം ഒഴിവാക്കുന്നു.
- source_word: εὐαρεστηκέναι τῷ θεῷ
  choice: ദൈവത്തെ പ്രസാദിപ്പിച്ചവൻ എന്നു
  rationale: ഹാനോക്ക് ദൈവത്തിന് പ്രസാദകരനായിരുന്നുവെന്ന മുൻകാലാവസ്ഥയെ, മലയാളത്തിൽ സ്വാഭാവികമായി സാക്ഷ്യത്തിന്റെ ഉള്ളടക്കമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഹാനോക്കിന്റെ μετατίθημι അനുഭവത്തിന്റെ സ്വഭാവം
  choice: ‘എടുത്തുകൊള്ളപ്പെട്ടു’ എന്നു മാത്രം പരിഭാഷപ്പെടുത്തി
  alternative: ‘സ്വർഗത്തിലേക്ക് എടുക്കപ്പെട്ടു’ എന്നു വിശദീകരിക്കുക
  rationale: ഹാനോക്ക് മരണം കാണാതിരിക്കാനായി ദൈവം അവനെ എടുത്തുവെന്ന് വാക്യം പറയുന്നു; എന്നാൽ എവിടേക്കാണെന്നോ അതിന്റെ പ്രക്രിയ എന്താണെന്നോ ഈ വാക്യം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ അധികമായ ഉപദേശവിവരണം ചേർക്കുന്നില്ല.
- issue: ‘മരണം കാണുക’ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: മുഖ്യവാചകത്തിൽ ‘മരണം കാണുക’ എന്ന രൂപം നിലനിർത്തി
  alternative: ‘മരണം അനുഭവിക്കുക’ എന്നു വ്യാഖ്യാനിച്ച് പരിഭാഷപ്പെടുത്തുക
  rationale: ഗ്രീക്ക് ഭാഷാശൈലി മലയാളത്തിലും മനസ്സിലാക്കാവുന്നതാണ്; അതിന്റെ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നതിലൂടെ ഉറവിടരൂപവും വായനാസൗകര്യവും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
- issue: τοῦ μὴ ἰδεῖν എന്ന ഘടനയുടെ ഉദ്ദേശ്യം/ഫലം
  choice: ‘കാണാതിരിക്കേണ്ടതിന്’
  alternative: ‘അതുകൊണ്ട് അവൻ മരണം കണ്ടില്ല’
  rationale: ഗ്രീക്ക് ഘടന ഉദ്ദേശ്യമോ ഉദ്ദേശ്യസഹിതമായ ഫലമോ സൂചിപ്പിക്കാം. തെരഞ്ഞെടുത്ത രൂപം ഈ ബന്ധം പ്രകടമാക്കുന്നു; അതിനെ വെറും സംഭവഫലമായി മാത്രം പരിമിതപ്പെടുത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി ഉപയോഗിച്ചു. ‘ഹാനോക്ക്,’ ‘വിശ്വാസം,’ ‘സാക്ഷ്യം ലഭിക്കുക’ തുടങ്ങിയ പരിചിതമായ ബൈബിൾ പദപ്രയോഗങ്ങൾ നിലനിർത്തിയെങ്കിലും പഴഞ്ചൻ ക്രിയാരൂപങ്ങൾ ഒഴിവാക്കി. ഉറവിടത്തിലെ ആവർത്തനവും ദൈവശാസ്ത്രപരമായ മിതത്വവും സംരക്ഷിച്ചു.
