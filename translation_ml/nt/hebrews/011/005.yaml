  revision_rationale: 'The revision corrects the malformed causal verb phrase and uses a consistent, modern Malayalam expression for μετατίθημι/μετάθεσις: ‘എടുത്തുകൊണ്ടുപോകപ്പെട്ടു,’ ‘എടുത്തുകൊണ്ടുപോയി,’ and ‘എടുത്തുകൊണ്ടുപോകപ്പെടുന്നതിനുമുമ്പ്.’ It retains the passive in the first clause, the source’s ‘see death’ idiom with its footnote, and the passive sense of the prior testimony. No theological detail beyond the verse is introduced.'
