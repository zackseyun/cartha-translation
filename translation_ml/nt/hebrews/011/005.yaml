revisions:
- from: വിശ്വാസത്താൽ ഹാനോക്ക് മരണം കാണാതിരിക്കേണ്ടതിന് എടുത്തുകൊള്ളപ്പെട്ടു[a]. ദൈവം അവനെ എടുത്തുകൊണ്ടതിനാൽ അവനെ കണ്ടെത്താനായില്ല. എടുത്തുകൊള്ളപ്പെടുന്നതിനുമുമ്പുതന്നെ അവൻ ദൈവത്തെ പ്രസാദിപ്പിച്ചവൻ എന്നു സാക്ഷ്യം ലഭിച്ചിരുന്നു.
  to: വിശ്വാസത്താൽ ഹാനോക്ക് മരണം കാണാതിരിക്കേണ്ടതിന് എടുത്തുകൊണ്ടുപോകപ്പെട്ടു. ദൈവം അവനെ എടുത്തുകൊണ്ടുപോയതിനാൽ അവനെ കണ്ടെത്താനായില്ല. എടുത്തുകൊണ്ടുപോകപ്പെടുന്നതിനുമുമ്പ്, അവൻ ദൈവത്തെ പ്രസാദിപ്പിച്ചവനാണെന്ന് സാക്ഷ്യം ലഭിച്ചിരുന്നു.
  rationale: 'The revision corrects the malformed causal verb phrase and uses a consistent, modern Malayalam expression for μετατίθημι/μετάθεσις: ‘എടുത്തുകൊണ്ടുപോകപ്പെട്ടു,’ ‘എടുത്തുകൊണ്ടുപോയി,’ and ‘എടുത്തുകൊണ്ടുപോകപ്പെടുന്നതിനുമുമ്പ്.’ It retains the passive in the first clause, the source’s ‘see death’ idiom with its footnote, and the passive sense of the prior testimony. No theological detail beyond the verse is introduced.'
