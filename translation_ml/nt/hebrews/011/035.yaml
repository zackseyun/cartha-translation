id: HEB.11.35
reference: Hebrews 11:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔλαβον γυναῖκες ἐξ ἀναστάσεως τοὺς νεκροὺς αὐτῶν· ἄλλοι δὲ ἐτυμπανίσθησαν, οὐ προσδεξάμενοι τὴν ἀπολύτρωσιν, ἵνα κρείττονος ἀναστάσεως τύχωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/035.yaml
  text: Women received back their dead by resurrection[a]; but others were tortured, not accepting release[c][b], so that they might obtain a better resurrection.
translation:
  language: ml
  text: സ്ത്രീകൾക്ക് തങ്ങളുടെ മരിച്ചവരെ ഉയിർപ്പിലൂടെ തിരികെ ലഭിച്ചു. എന്നാൽ മറ്റുചിലർ, ശ്രേഷ്ഠമായ ഒരു പുനരുത്ഥാനം പ്രാപിക്കേണ്ടതിന് മോചനം സ്വീകരിക്കാതെ, ക്രൂരമായി പീഡിപ്പിക്കപ്പെട്ടു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλαβον
  choice: തിരികെ ലഭിച്ചു
  rationale: മരിച്ചവരെ ഉയിർപ്പിലൂടെ വീണ്ടും ജീവനോടെ ലഭിച്ചുവെന്ന സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു; വെറും ‘ലഭിച്ചു’ എന്നതിനെക്കാൾ പുനഃപ്രാപ്തിയുടെ ആശയം സൂക്ഷിക്കുന്നു.
- source_word: γυναῖκες
  choice: സ്ത്രീകൾ
  rationale: ഇവിടെ പൊതുവായി സ്ത്രീകളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ഭാര്യമാർ’ എന്ന് പരിമിതപ്പെടുത്താൻ പാഠത്തിൽ അടിസ്ഥാനമില്ല.
- source_word: ἐξ ἀναστάσεως
  choice: ഉയിർപ്പിലൂടെ
  rationale: ἐξ ഇവിടെ ഉറവിടമോ മാർഗമോ സൂചിപ്പിക്കുന്നു; ഉയിർപ്പിന്റെ ഫലമായി മരിച്ചവരെ തിരികെ ലഭിച്ചു എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: τοὺς νεκροὺς αὐτῶν
  choice: തങ്ങളുടെ മരിച്ചവരെ
  rationale: അവരോടു ബന്ധപ്പെട്ട് മരിച്ചുപോയവരെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും വിശാലവുമായ പ്രയോഗം.
- source_word: ἄλλοι δὲ
  choice: എന്നാൽ മറ്റുചിലർ
  rationale: മുൻപത്തെ വിടുതൽ അനുഭവങ്ങളിൽനിന്ന് പീഡനം സഹിച്ചവരിലേക്കുള്ള ശക്തമായ വൈരുധ്യം δέ പ്രകടമാക്കുന്നു.
- source_word: ἐτυμπανίσθησαν
  choice: ക്രൂരമായി പീഡിപ്പിക്കപ്പെട്ടു
  rationale: കടുത്ത ശാരീരിക പീഡനമാണ് ക്രിയയുടെ കേന്ദ്രാർഥം. കൃത്യമായ ഉപകരണമോ രീതിയോ അനിശ്ചിതമായതിനാൽ അത് മുഖ്യപാഠത്തിൽ നിർണ്ണയിക്കുന്നില്ല.
- source_word: οὐ προσδεξάμενοι
  choice: സ്വീകരിക്കാതെ
  rationale: വാഗ്ദാനം ചെയ്യപ്പെട്ട മോചനം അവർ മനഃപൂർവം നിരസിച്ചു എന്ന പങ്കാളിക്രിയയുടെ ഭാവം നൽകുന്നു.
- source_word: τὴν ἀπολύτρωσιν
  choice: മോചനം
  rationale: ഈ സന്ദർഭത്തിൽ പീഡനത്തിൽനിന്നോ മരണത്തിൽനിന്നോ ഉള്ള വിടുതലാണ് ഉദ്ദേശ്യം; രക്ഷാശാസ്ത്രപരമായ ‘വീണ്ടെടുപ്പ്’ അനാവശ്യമായി ഇറക്കുമതി ചെയ്യുന്നത് ഒഴിവാക്കുന്നു.
- source_word: ἵνα
  choice: പ്രാപിക്കേണ്ടതിനായിരുന്നു അത്
  rationale: അവർ മോചനം നിരസിച്ചതിന്റെ ലക്ഷ്യം സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യബന്ധം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: κρείττονος ἀναστάσεως
  choice: ശ്രേഷ്ഠമായ ഒരു പുനരുത്ഥാനം
  rationale: എബ്രായലേഖനത്തിൽ κρείττων സാധാരണയായി ‘ശ്രേഷ്ഠമായ/മെച്ചപ്പെട്ട’ എന്ന താരതമ്യാർഥം വഹിക്കുന്നു. മുൻപറഞ്ഞ താൽക്കാലിക ജീവപുനഃസ്ഥാപനത്തോടുള്ള വൈരുധ്യം നിലനിർത്തുന്നു.
- source_word: τύχωσιν
  choice: പ്രാപിക്കുക
  rationale: τυγχάνω ഇവിടെ നേടുക അഥവാ പ്രാപിക്കുക എന്നർഥത്തിലാണ്; ‘പുനരുത്ഥാനം പ്രാപിക്കുക’ സ്വാഭാവികമായ മലയാളപ്രയോഗമാണ്.
theological_decisions:
- issue: ἀπολύτρωσιν എന്നതിന്റെ സന്ദർഭാർഥം
  choice: പീഡനത്തിൽനിന്നോ മരണത്തിൽനിന്നോ ഉള്ള താൽക്കാലിക മോചനം
  alternative: വിശാലമായ രക്ഷാശാസ്ത്രാർഥത്തിലുള്ള വീണ്ടെടുപ്പ്
  rationale: ഉടൻ വരുന്ന സന്ദർഭം വിശ്വസ്തത ഉപേക്ഷിച്ചാൽ ലഭിക്കുമായിരുന്ന രക്ഷപ്പെടൽ നിരസിച്ച പീഡിതരെക്കുറിച്ചാണ്. ‘മോചനം’ ആ കഥാസന്ദർഭം നിലനിർത്തുകയും പാഠത്തിൽ വ്യക്തമല്ലാത്ത പ്രായശ്ചിത്തസിദ്ധാന്തം ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: ‘ശ്രേഷ്ഠമായ പുനരുത്ഥാനം’ എന്നതിന്റെ താരതമ്യബലം
  choice: സാധാരണ മർത്യജീവിതത്തിലേക്കുള്ള പുനഃസ്ഥാപനത്തെക്കാൾ ശ്രേഷ്ഠമായ, മരണത്തിനപ്പുറമുള്ള പുനരുത്ഥാനപ്രത്യാശ
  alternative: മുൻ ഉദാഹരണത്തോടുള്ള പ്രത്യേക വൈരുധ്യമില്ലാത്ത കൂടുതൽ അനുകൂലമായ പുനരുത്ഥാനം
  rationale: വാക്യത്തിന്റെ ആദ്യഭാഗം മരിച്ചവർ ഈ ജീവിതത്തിലേക്ക് മടങ്ങിവന്നതിനെക്കുറിച്ചും രണ്ടാംഭാഗം മരണം സഹിച്ച വിശ്വസ്തരെക്കുറിച്ചുമാണ്. ഈ വായന വാചകത്തിലെ താരതമ്യം സൂക്ഷിക്കുന്നു; പുനരുത്ഥാനത്തിന്റെ രീതി അതിലധികം നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘ഉയിർപ്പ്’ ആദ്യ സംഭവത്തിലെ ജീവപുനഃസ്ഥാപനത്തിനും ‘പുനരുത്ഥാനം’ അവസാനത്തെ സമഗ്രമായ പ്രത്യാശയ്ക്കും ഉപയോഗിച്ച് വാക്യത്തിലെ ആശയവ്യത്യാസം സ്വാഭാവികമായി പ്രകടമാക്കി. പീഡനരീതി മുഖ്യപാഠത്തിൽ അനാവശ്യമായി നിർണ്ണയിക്കാതെ അടിക്കുറിപ്പിൽ അനിശ്ചിതത്വം സൂക്ഷിച്ചു.
