  source_fidelity: 'മുഖ്യാർഥങ്ങൾ കൃത്യമായി പ്രതിഫലിക്കുന്നു: സ്ത്രീകൾ മരിച്ചവരെ പുനഃപ്രാപിച്ചു; മറ്റുചിലർ വിടുതൽ നിരസിച്ച് പീഡനം സഹിച്ചു; അവരുടെ ലക്ഷ്യം ശ്രേഷ്ഠമായ പുനരുത്ഥാനമായിരുന്നു. എന്നാൽ നിലവിലെ അവസാനവാക്യത്തിലെ “പ്രാപിക്കേണ്ടതിനായിരുന്നു അത്” എന്ന പ്രയോഗത്തിൽ “അത്” എന്തിനെ സൂചിപ്പിക്കുന്നു എന്നത് അസ്പഷ്ടമാണ്; ἵνα-ഉദ്ദേശ്യബന്ധം കൂടുതൽ നേരിട്ട് ചേർക്കണം.'
