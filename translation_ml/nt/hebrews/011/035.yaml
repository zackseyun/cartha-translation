- from: സ്ത്രീകൾക്ക് തങ്ങളുടെ മരിച്ചവരെ ഉയിർപ്പിലൂടെ തിരികെ ലഭിച്ചു. എന്നാൽ മറ്റുചിലർ മോചനം[a] സ്വീകരിക്കാതെ ക്രൂരമായി പീഡിപ്പിക്കപ്പെട്ടു[b]—ശ്രേഷ്ഠമായ ഒരു പുനരുത്ഥാനം പ്രാപിക്കേണ്ടതിനായിരുന്നു അത്[c].
  to: സ്ത്രീകൾക്ക് തങ്ങളുടെ മരിച്ചവരെ ഉയിർപ്പിലൂടെ തിരികെ ലഭിച്ചു. എന്നാൽ മറ്റുചിലർ, ശ്രേഷ്ഠമായ ഒരു പുനരുത്ഥാനം പ്രാപിക്കേണ്ടതിന് മോചനം സ്വീകരിക്കാതെ, ക്രൂരമായി പീഡിപ്പിക്കപ്പെട്ടു.
  rationale: മോചനം നിരസിച്ചതും ശ്രേഷ്ഠമായ പുനരുത്ഥാനം പ്രാപിക്കാനുള്ള ഉദ്ദേശ്യവും തമ്മിലുള്ള ഗ്രീക്ക് വാക്യബന്ധം വ്യക്തമായി പുനഃക്രമീകരിച്ചു. പീഡനോപകരണത്തെക്കുറിച്ചുള്ള അടിക്കുറിപ്പ് ഭാഷാപരമായി സ്വാഭാവികമാക്കി, ചരിത്രപരമായ അനിശ്ചിതത്വം നിലനിർത്തി. മറ്റെല്ലാ പ്രധാന പദപ്രയോഗങ്ങളും ഉറവിടപാഠത്തോടും ആധുനിക മലയാള ഉപയോഗത്തോടും യോജിക്കുന്നതിനാൽ നിലനിർത്തി.
