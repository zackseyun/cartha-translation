  text: ἕτεροι δὲ ἐμπαιγμῶν καὶ μαστίγων πεῖραν ἔλαβον, ἔτι δὲ δεσμῶν καὶ φυλακῆς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/036.yaml
  text: And others experienced mocking and flogging[a], and even chains and imprisonment.
translation:
  language: ml
  text: മറ്റു ചിലർ പരിഹാസങ്ങളും ചാട്ടവാറടിയും, ചങ്ങലകളും തടവും വരെ അനുഭവിച്ചു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പരിഹാസങ്ങളുടെയും ചാട്ടവാറടികളുടെയും, കൂടാതെ ചങ്ങലകളുടെയും തടവിന്റെയും പരീക്ഷണം ഏറ്റുവാങ്ങി.” ഗ്രീക്കിൽ കൂടുതൽ അക്ഷരാർഥമായി “...യുടെ പരീക്ഷണം ഏറ്റുവാങ്ങി” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτεροι
  choice: മറ്റു ചിലർ
  rationale: മുമ്പ് പറഞ്ഞവരിൽനിന്നു വ്യത്യസ്തമായ മറ്റൊരു വിഭാഗത്തെ സൂചിപ്പിക്കുന്ന അനിശ്ചിത ബഹുവചനം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐμπαιγμῶν
  choice: പരിഹാസം
  rationale: പൊതുവായ അവഹേളനവും നിന്ദയും ഉൾക്കൊള്ളുന്ന, ആധുനിക വായനക്കാർക്ക് വ്യക്തമായ പദം.
- source_word: μαστίγων
  choice: ചാട്ടവാറടി
  rationale: ചാട്ടകൊണ്ടുള്ള ശാരീരിക ശിക്ഷയെ വ്യക്തമായും ഗൗരവത്തോടെയും സൂചിപ്പിക്കുന്നു.
- source_word: πεῖραν ἔλαβον
  choice: അനുഭവിച്ചു
  rationale: അക്ഷരാർഥത്തിൽ ‘പരീക്ഷണം ഏറ്റുവാങ്ങി’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; പീഡനം സഹിക്കേണ്ടിവന്നതെന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: ἔτι δὲ
  choice: പോലും
  rationale: പരിഹാസത്തിലും ചാട്ടവാറടിയിലുംനിന്ന് ചങ്ങലയിലേക്കും തടവിലേക്കുമുള്ള തീവ്രതയുടെ വർധന സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: δεσμῶν
  choice: ചങ്ങലകൾ
  rationale: ബന്ധനോപകരണങ്ങളെ സൂചിപ്പിക്കുന്ന മൂർത്തവും ഇന്നും എളുപ്പം മനസ്സിലാകുന്നതുമായ സമാനപദം.
- source_word: φυλακῆς
  choice: തടവ്
  rationale: തടവിലാക്കപ്പെട്ട അവസ്ഥയെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
