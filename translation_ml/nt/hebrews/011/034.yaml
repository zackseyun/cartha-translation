id: HEB.11.34
reference: Hebrews 11:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔσβεσαν δύναμιν πυρός, ἔφυγον στόματα ⸀μαχαίρης, ⸀ἐδυναμώθησαν ἀπὸ ἀσθενείας, ἐγενήθησαν ἰσχυροὶ ἐν πολέμῳ, παρεμβολὰς ἔκλιναν ἀλλοτρίων·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/034.yaml
  text: quenched the power of fire[a], escaped the edge of the sword, were made strong out of weakness, became mighty in battle[b], put foreign armies to flight.
translation:
  language: ml
  text: തീയുടെ ശക്തി കെടുത്തി, വാളിന്റെ വായ്ത്തലയിൽനിന്ന് രക്ഷപ്പെട്ടു[a], ബലഹീനതയിൽനിന്ന് ശക്തരാക്കപ്പെട്ടു, യുദ്ധത്തിൽ പ്രബലരായി, വിദേശസൈന്യങ്ങളെ പിന്തിരിപ്പിച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘വാളിന്റെ വായുകളിൽനിന്ന്’; ഇത് വാളിന്റെ വായ്ത്തലയെയോ വെട്ടിനെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘സൈന്യങ്ങൾ’ എന്നു പരിഭാഷപ്പെടുത്തിയ പദത്തിന്റെ അടിസ്ഥാനാർഥം ‘പാളയങ്ങൾ’ അഥവാ ‘സൈനികപ്പാളയങ്ങൾ’ എന്നാണ്; ഇവിടെ അത് പാളയമടിച്ച സൈനികശക്തികളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσβεσαν
  choice: കെടുത്തി
  rationale: σβέννυμι എന്ന ക്രിയയുടെ തീ അണയ്ക്കുക/കെടുത്തുക എന്ന സജീവവും ദൃശ്യവുമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δύναμιν πυρός
  choice: തീയുടെ ശക്തി
  rationale: δύναμις എന്ന പദത്തിന്റെ ശക്തി/പ്രഭാവം എന്ന ആശയം ഒഴിവാക്കാതെ, വെറും ‘തീ’ എന്നു ചുരുക്കാതെ വിവർത്തനം ചെയ്യുന്നു.
- source_word: ἔφυγον στόματα μαχαίρης
  choice: വാളിന്റെ വായിൽനിന്ന് രക്ഷപ്പെട്ടു
  rationale: στόματα എന്ന ‘വായുകൾ’ എന്ന ദൃശ്യരൂപം മലയാളത്തിലും മനസ്സിലാകുന്നതായി നിലനിർത്തുന്നു; ἔφυγον ഇവിടെ അപകടത്തിൽനിന്നുള്ള വിജയകരമായ രക്ഷയെ സൂചിപ്പിക്കുന്നു.
- source_word: ἐδυναμώθησαν ἀπὸ ἀσθενείας
  choice: ബലഹീനതയിൽനിന്ന് ശക്തരാക്കപ്പെട്ടു
  rationale: ἀπό സൂചിപ്പിക്കുന്ന ഉറവിടം/അവസ്ഥ ‘ബലഹീനതയിൽനിന്ന്’ എന്നതിലൂടെ നിലനിർത്തുകയും, ക്രിയയുടെ കർമണിപ്രയോഗം ‘ശക്തരാക്കപ്പെട്ടു’ എന്നതിലൂടെ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐγενήθησαν ἰσχυροὶ ἐν πολέμῳ
  choice: യുദ്ധത്തിൽ പ്രബലരായി
  rationale: ഒരു നിലയിലേക്കുള്ള വരവ് സൂചിപ്പിക്കുന്ന ἐγενήθησανയും ἰσχυρός എന്ന ശക്തിയുടെ ആശയവും, മുൻവാക്യത്തിലെ ‘ശക്തർ’ എന്ന ആവർത്തനം അമിതമാക്കാതെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: παρεμβολὰς ἔκλιναν ἀλλοτρίων
  choice: വിദേശികളുടെ സൈന്യങ്ങളെ പിന്തിരിപ്പിച്ചു
  rationale: παρεμβολήയുടെ അടിസ്ഥാനാർഥം പാളയം ആണെങ്കിലും ഇവിടെ അത് പാളയമടിച്ച സൈനികശക്തിയെ സൂചിപ്പിക്കുന്നു; κλίνωയുടെ തിരിക്കുക/പിന്മാറാൻ ഇടയാക്കുക എന്ന സൈനികസന്ദർഭാർഥം ‘പിന്തിരിപ്പിച്ചു’ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: വിശ്വാസവീരരുടെ വിടുതലും യുദ്ധവിജയവും വിവരിക്കുന്ന ദൃശ്യങ്ങളുടെ മൂർത്തത
  choice: തീ, വാൾ, ബലഹീനത, യുദ്ധം, വിദേശസൈന്യങ്ങൾ എന്നീ മൂർത്തമായ ചരിത്ര-സൈനിക ദൃശ്യങ്ങൾ നിലനിർത്തി
  alternative: ഇവയെ അപകടങ്ങളുടെയും ശത്രുക്കളുടെയും മേലുള്ള പൊതുവായതോ ആത്മീയമോ ആയ വിജയമായി അവതരിപ്പിക്കുക
  rationale: വാക്യം വിശ്വാസത്തോടു ബന്ധപ്പെട്ട മൂർത്തമായ വിടുതലുകളും പ്രവർത്തികളും നിരത്തുന്നു; അവയെ ആത്മീയവൽക്കരിക്കുന്നത് മൂലപാഠത്തിന്റെ ചരിത്ര-സൈനിക സ്വഭാവം മങ്ങിച്ചുകളയും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗ്രീക്കിലെ ദൃശ്യഭാഷയും കർമണിപ്രയോഗവും കഴിയുന്നത്ര നിലനിർത്തി; സൈനികസന്ദർഭത്തിലെ ലക്ഷ്യാർഥം ആവശ്യമായിടത്ത് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കി.
