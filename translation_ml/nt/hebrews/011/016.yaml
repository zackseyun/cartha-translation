  to: എന്നാൽ ഇപ്പോൾ അവർ അതിലും മെച്ചമായ ഒരു സ്വദേശം[a]—അതായത്, സ്വർഗീയമായത്—ആഗ്രഹിക്കുന്നു. അതുകൊണ്ട് അവരുടെ ദൈവം എന്നു വിളിക്കപ്പെടാൻ ദൈവം ലജ്ജിക്കുന്നില്ല; കാരണം അവർക്കായി അവിടുന്ന് ഒരു നഗരം ഒരുക്കിയിരിക്കുന്നു.
