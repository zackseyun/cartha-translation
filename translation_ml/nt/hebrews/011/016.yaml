  source_fidelity: 'അർഥം പൊതുവേ മൂലത്തോടു വിശ്വസ്തമാണ്: മെച്ചമായ/സ്വർഗീയമായ സ്വദേശത്തോടുള്ള അഭിലാഷം, ദൈവം ‘അവരുടെ ദൈവം’ എന്നു വിളിക്കപ്പെടുന്നതിലെ ലജ്ജയില്ലായ്മ, അവർക്കായി നഗരം ഒരുക്കിയിരിക്കുന്നു എന്നിവ സംരക്ഷിച്ചിട്ടുണ്ട്. എന്നാൽ ‘വിളിക്കപ്പെടുന്നതിൽ’ എന്ന രൂപത്തെ ‘വിളിക്കപ്പെടാൻ’ എന്നു മാറ്റുന്നത് ഗ്രീക്കിലെ infinitive-ന്റെ ഉദ്ദേശ്യവും മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗവും കൂടുതൽ നേരിട്ട് നൽകും.'
  naturalness: ‘അവരുടെ ദൈവം എന്നു വിളിക്കപ്പെടാൻ ദൈവം ലജ്ജിക്കുന്നില്ല’ എന്ന ക്രമം ആധുനിക നിലവാര മലയാളത്തിൽ കൂടുതൽ സുഗമവും വ്യക്തവുമാണ്. അടിക്കുറിപ്പ് ചിഹ്നം അതു വിശദീകരിക്കുന്ന ‘സ്വദേശം’ എന്ന പദത്തിനു തൊട്ടുപിന്നാലെ സ്ഥാപിക്കുന്നതും വായനാസൗകര്യം മെച്ചപ്പെടുത്തുന്നു.
