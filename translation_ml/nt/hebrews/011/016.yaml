id: HEB.11.16
reference: Hebrews 11:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: νῦν δὲ κρείττονος ὀρέγονται, τοῦτ’ ἔστιν ἐπουρανίου. διὸ οὐκ ἐπαισχύνεται αὐτοὺς ὁ θεὸς θεὸς ἐπικαλεῖσθαι αὐτῶν, ἡτοίμασεν γὰρ αὐτοῖς πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/016.yaml
  text: But as it is[a], they long for a better country—that is, a heavenly one. Therefore God is not ashamed to be called their God, for he has prepared a city for them.
translation:
  language: ml
  text: എന്നാൽ ഇപ്പോൾ അവർ അതിലും മെച്ചമായ ഒരു സ്വദേശം[a]—അതായത്, സ്വർഗീയമായത്—ആഗ്രഹിക്കുന്നു. അതുകൊണ്ട് അവരുടെ ദൈവം എന്നു വിളിക്കപ്പെടാൻ ദൈവം ലജ്ജിക്കുന്നില്ല; കാരണം അവർക്കായി അവിടുന്ന് ഒരു നഗരം ഒരുക്കിയിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മെച്ചമായ ഒരു ദേശം’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ സ്ത്രീലിംഗ വിശേഷണങ്ങൾ മുൻസന്ദർഭത്തിൽ സൂചിപ്പിച്ച ‘സ്വദേശം/ദേശം’ എന്ന ആശയത്തിലേക്കാണ് മിക്കവാറും തിരിച്ചുപോകുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν δὲ
  choice: എന്നാൽ ഇപ്പോൾ
  rationale: മുൻവാക്യത്തിലെ സാങ്കൽപ്പിക സാധ്യതയ്ക്കു വിരുദ്ധമായി ഇപ്പോഴുള്ള യാഥാർഥ്യം അവതരിപ്പിക്കുന്ന പ്രയോഗം. കാലസൂചനയും വൈരുധ്യവും മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: κρείττονος
  choice: അതിലും മെച്ചമായ
  rationale: താരതമ്യാർഥം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; മുൻപ് പറഞ്ഞ ദേശത്തെക്കാൾ ശ്രേഷ്ഠമായതെന്ന സന്ദർഭാർഥം ‘അതിലും’ വ്യക്തമാക്കുന്നു.
- source_word: ὀρέγονται
  choice: ആഗ്രഹിക്കുന്നു
  rationale: എത്തിച്ചേരാനുള്ള ഉത്സുകമായ അഭിലാഷത്തെ സൂചിപ്പിക്കുന്ന മധ്യപ്രയോഗം. ‘ആഗ്രഹിക്കുന്നു’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും മാന്യവുമാണ്.
- source_word: κρείττονος ... ἐπουρανίου
  choice: അതിലും മെച്ചമായ ഒരു സ്വദേശം—അതായത്, സ്വർഗീയമായത്
  rationale: സ്ത്രീലിംഗ വിശേഷണങ്ങൾ മുൻസന്ദർഭത്തിലെ πατρίς എന്ന ആശയത്തെ സൂചിപ്പിക്കുന്നു. ‘സ്വദേശം’ ദേശത്തെയും സ്വന്തം നാട്ടിനെയും ഉൾക്കൊള്ളുന്ന സന്ദർഭോചിതമായ മലയാള പദമാണ്; വിശേഷണാത്മകമായ ἐπουρανίου ‘സ്വർഗീയമായത്’ എന്നു നിലനിർത്തുന്നു.
- source_word: διὸ
  choice: അതുകൊണ്ട്
  rationale: അവരുടെ സ്വർഗീയ സ്വദേശത്തോടുള്ള അഭിലാഷത്തിൽനിന്ന് ദൈവത്തിന്റെ പ്രതികരണത്തിലേക്കുള്ള നിഗമനം അടയാളപ്പെടുത്തുന്നു.
- source_word: οὐκ ἐπαισχύνεται
  choice: ലജ്ജിക്കുന്നില്ല
  rationale: മൂലത്തിലെ ലജ്ജ/മാനം സംബന്ധിച്ച ശക്തി നേരിട്ട് സംരക്ഷിക്കുന്ന സ്വാഭാവിക മലയാള പ്രയോഗം.
- source_word: θεὸς ἐπικαλεῖσθαι αὐτῶν
  choice: അവരുടെ ദൈവം എന്നു വിളിക്കപ്പെടുന്നതിൽ
  rationale: പഴയനിയമത്തിലെ ബന്ധസൂചകമായ ‘അവരുടെ ദൈവം’ എന്ന നാമകരണസൂത്രം വികസിപ്പിക്കാതെ അതേപടി നിലനിർത്തുന്നു.
- source_word: ἡτοίμασεν
  choice: ഒരുക്കിയിരിക്കുന്നു
  rationale: പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ പ്രസക്തി മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: πόλιν
  choice: ഒരു നഗരം
  rationale: നിർദ്ദിഷ്ട നിർദ്ദേശകമില്ലാത്ത മൂലപദത്തെ അനിശ്ചിതമായി വിവർത്തനം ചെയ്യുകയും എബ്രായലേഖനത്തിലെ ദൃശ്യമായ അന്തിമകാല നഗരപ്രതീകം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: κρείττονος, ἐπουρανίου എന്നിവയോടൊപ്പം വിട്ടുകളഞ്ഞിരിക്കുന്ന സ്ത്രീലിംഗ നാമം
  choice: മുൻസന്ദർഭത്തിലെ πατρίς അടിസ്ഥാനമാക്കി ‘സ്വദേശം’ ചേർത്തു
  alternative: ‘ദേശം’ ചേർക്കുക, അല്ലെങ്കിൽ ‘മെച്ചമായതിനെ’ എന്നു നാമം വ്യക്തമാക്കാതെ വിടുക
  rationale: ഗ്രീക്കിൽ ഈ വാക്യത്തിൽ നാമം പ്രത്യക്ഷമല്ലെങ്കിലും 11:14-ലെ πατρίδα അതിന്റെ സ്വാഭാവിക മുൻപദമാണ്. ‘സ്വദേശം’ ബന്ധബോധം സൂചിപ്പിക്കുമ്പോഴും മൂലത്തിൽ ഇല്ലാത്ത പ്രത്യേക ദൈവശാസ്ത്രവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: ‘അവരുടെ ദൈവം’ എന്ന ഉടമ്പടി-ബന്ധ സൂത്രവാക്യം
  choice: ‘അവരുടെ ദൈവം എന്നു വിളിക്കപ്പെടുന്നതിൽ’ എന്ന് വികസിപ്പിക്കാതെ നിലനിർത്തി
  alternative: ‘അവരെ തന്റെ ജനമായി അംഗീകരിക്കാൻ’ എന്നു വ്യാഖ്യാനപരമായി മാറ്റുക
  rationale: മൂലപാഠം ദൈവത്തെ അവരുടെ ദൈവം എന്നു വിളിക്കുന്നതിനെക്കുറിച്ചാണ് പറയുന്നത്; ജനമായി അംഗീകരിക്കുന്നു എന്ന വിപുലീകരണം സന്ദർഭസാദ്ധ്യമാണെങ്കിലും പാഠത്തിൽ നേരിട്ട് ഇല്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച മാന്യമായ ശൈലി. ‘അവിടുന്ന്’ എന്ന ആദരസൂചക സർവനാമം ദൈവത്തെ സൂചിപ്പിക്കാൻ ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ‘സ്വദേശം’ പ്രയോഗത്തിന് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
