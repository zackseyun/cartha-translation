  text: to whom it was said[a], “In Isaac your offspring will be called,”
translation:
  language: ml
  text: 'അവനോടാണ് ഇങ്ങനെ പറയപ്പെട്ടത്: “യിസ്ഹാക്കിലൂടെയായിരിക്കും നിന്റെ സന്തതി എന്നു വിളിക്കപ്പെടുന്നത്.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “യിസ്ഹാക്കിൽ നിനക്കു വിത്ത് എന്നു വിളിക്കപ്പെടും.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ὃν
  choice: അവനോടാണ്
  rationale: മുൻസന്ദർഭത്തിലെ അബ്രാഹാമിനെ സൂചിപ്പിക്കുകയും ἐλαλήθη എന്ന കർമണിപ്രയോഗത്തോടൊപ്പം സ്വാഭാവികമായ മലയാളം നൽകുകയും ചെയ്യുന്നു.
- source_word: ἐλαλήθη
  choice: അരുളിച്ചെയ്യപ്പെട്ടത്
  rationale: ദൈവം പറഞ്ഞ വചനമാണെന്ന സന്ദർഭം മാനിച്ചുകൊണ്ട് ഗ്രീക്കിലെ ഭൂതകാല കർമണിരൂപം നിലനിർത്തുന്നു.
- source_word: ὅτι
  choice: 'ഇങ്ങനെ … :'
  rationale: പറഞ്ഞതിന്റെ ഉള്ളടക്കം നേരിട്ടുള്ള ഉദ്ധരണിയായി അവതരിപ്പിക്കാൻ മലയാളത്തിൽ സ്വാഭാവികമായ ഘടന.
- source_word: Ἐν Ἰσαὰκ
  choice: യിസ്ഹാക്കിലൂടെയായിരിക്കും
  rationale: ἐν എന്നതിന്റെ അക്ഷരാർഥമായ ‘യിൽ’ ഇവിടെ വംശപരമ്പര യിസ്ഹാക്കിലൂടെ തുടരുന്നു എന്ന ആശയം നൽകുന്നു; ‘ലൂടെ’ ആ ബന്ധം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: κληθήσεταί
  choice: വിളിക്കപ്പെടുന്നത്
  rationale: καλέω എന്ന ക്രിയയുടെ ഭാവികാല കർമണിഭാവം കാത്തുസൂക്ഷിക്കുന്നു; ഇവിടെ ‘അങ്ങനെ അംഗീകരിക്കപ്പെടുക/കണക്കാക്കപ്പെടുക’ എന്ന അർഥസാധ്യതയും പൂർണമായി ഇല്ലാതാക്കുന്നില്ല.
- source_word: σοι
  choice: നിന്റെ
  rationale: ഗ്രീക്കിലെ ദത്തിവിഭക്തിക്ക് ഇവിടെ ഉടമസ്ഥതാസൂചകമായ അർഥം സ്വാഭാവികമാണ്.
- source_word: σπέρμα
  choice: സന്തതി
  rationale: കൂട്ടായ ഏകവചനമായ ‘വിത്ത്/വംശം’ എന്ന അർഥം ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു; വെറും ബഹുവചനമായ ‘സന്തതികൾ’ എന്നതിനെക്കാൾ രൂപത്തിലെ അർഥസാന്ദ്രത നിലനിർത്തുന്നു.
theological_decisions:
- issue: യിസ്ഹാക്കിനെക്കുറിച്ചുള്ള ഉല്പത്തി ഉദ്ധരണിയിൽ വാഗ്ദത്തവംശം എങ്ങനെ നിർദ്ദേശിക്കപ്പെടുന്നു
  choice: “യിസ്ഹാക്കിലൂടെയായിരിക്കും നിന്റെ സന്തതി എന്നു വിളിക്കപ്പെടുന്നത്”
  alternative: “യിസ്ഹാക്കിൽ നിനക്കു സന്തതി എന്നു വിളിക്കപ്പെടും” / “യിസ്ഹാക്കിലൂടെ നിന്റെ സന്തതി കണക്കാക്കപ്പെടും”
  rationale: വാഗ്ദത്തവംശം യിസ്ഹാക്കിലൂടെ തിരിച്ചറിയപ്പെടുന്നു എന്ന ആശയം വ്യക്തമാക്കുമ്പോഴും ‘വിളിക്കപ്പെടും’ എന്ന മൂലപദത്തിന്റെ രൂപവും വേദശാസ്ത്രപരമായ അർഥതുറപ്പും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘അരുളിച്ചെയ്യപ്പെട്ടത്’ ദൈവവചനത്തിന്റെ സന്ദർഭത്തിന് യോജിച്ച ഔപചാരികത നൽകുന്നു; ‘സന്തതി’ കൂട്ടായ ഏകവചനത്തിന്റെ സൂക്ഷ്മത നിലനിർത്തുന്നു.
