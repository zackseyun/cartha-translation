id: HEB.11.21
reference: Hebrews 11:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πίστει Ἰακὼβ ἀποθνῄσκων ἕκαστον τῶν υἱῶν Ἰωσὴφ εὐλόγησεν, καὶ προσεκύνησεν ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/021.yaml
  text: By faith Jacob[a], as he was dying, blessed each of the sons of Joseph[b], and worshiped while leaning on the top of his staff.
translation:
  language: ml
  text: വിശ്വാസത്താൽ യാക്കോബ്, മരിക്കുന്ന വേളയിൽ, യോസേഫിന്റെ പുത്രന്മാരിൽ ഓരോരുത്തനെയും അനുഗ്രഹിച്ചു; തന്റെ വടിയുടെ[a] അറ്റത്ത് ഊന്നിക്കൊണ്ട് ആരാധിക്കുകയും ചെയ്തു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഉല്പത്തി 47:31-ന്റെ എബ്രായ പാഠമനുസരിച്ച്: “തന്റെ കിടക്കയുടെ തലഭാഗത്തിന്മേൽ കുനിഞ്ഞ് ആരാധിച്ചു.” ഇവിടെ ഗ്രീക്ക് പാഠം “വടി” എന്നാണ് വായിക്കുന്നത്.'
    reason: textual_variant
  - marker: b
    text: 'അല്ലെങ്കിൽ: “തന്റെ വടിയുടെ അറ്റത്തേക്കു തിരിഞ്ഞ് ആരാധിച്ചു.” ഈ പ്രയോഗം മിക്കവാറും യാക്കോബിന്റെ ശരീരഭാവത്തെയാണ് വിവരിക്കുന്നത്, വടിയെ ആരാധനയുടെ ലക്ഷ്യമായി അല്ല.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: വിശ്വാസത്താൽ
  rationale: എബ്രായർ 11-ൽ പ്രവൃത്തികൾ വിശ്വാസത്താൽ അല്ലെങ്കിൽ വിശ്വാസത്തിന്റെ നിലപാടിൽ ചെയ്തതായി സൂചിപ്പിക്കുന്ന ദത്തിവ് പ്രയോഗമാണിത്; മലയാളത്തിൽ ഉപകരണാർഥം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἀποθνῄσκων
  choice: മരിക്കാറായപ്പോൾ
  rationale: പ്രധാന ക്രിയകളോടു സമകാലികമായ വർത്തമാന കൃദന്തത്തിന്റെ കാലസൂചനയും യാക്കോബിന്റെ ആസന്നമരണാവസ്ഥയും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ἕκαστον τῶν υἱῶν Ἰωσὴφ
  choice: യോസേഫിന്റെ പുത്രന്മാരിൽ ഓരോരുത്തനെയും
  rationale: ἕκαστον എന്ന പദത്തിന്റെയും ഭാഗിക ഷഷ്ഠിയുടെയും വിതരണാർഥം നിലനിർത്തി, രണ്ടു പുത്രന്മാരെയും വെവ്വേറെ അനുഗ്രഹിച്ചതിന് ഊന്നൽ നൽകുന്നു.
- source_word: εὐλόγησεν
  choice: അനുഗ്രഹിച്ചു
  rationale: ഉല്പത്തി പശ്ചാത്തലത്തിലെ അനുഗ്രഹപ്രഖ്യാപനത്തെ സൂചിപ്പിക്കുന്ന പതിവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗം.
- source_word: προσεκύνησεν
  choice: ആരാധിച്ചു
  rationale: ഇവിടെ വെറും കുനിയലിനേക്കാൾ ആരാധനാപരമായ ഭക്തിക്രിയയാണ് ഉദ്ദേശിക്കപ്പെടുന്നത്. ഗ്രീക്കിൽ ആരാധനയുടെ കർമം വ്യക്തമാക്കിയിട്ടില്ലാത്തതിനാൽ 'ദൈവത്തെ' എന്നു മുഖ്യവാക്യത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ
  choice: തന്റെ വടിയുടെ അറ്റത്ത് ചാരിക്കൊണ്ട്
  rationale: ഗ്രീക്ക് പദക്രമത്തിന്റെ സാദ്ധ്യമായ ശാരീരികഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും വടി ആരാധനയുടെ ലക്ഷ്യമാണെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുകയും ചെയ്യുന്നു; അക്ഷരാർഥത്തിലെ ദിശാസൂചന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: അവസാന ഉപവാക്യത്തിൽ യാക്കോബിന്റെ ആരാധനയും വടിയും തമ്മിലുള്ള ബന്ധം
  choice: യാക്കോബ് തന്റെ വടിയുടെ അറ്റത്ത് ചാരിക്കൊണ്ട് ആരാധിച്ചു.
  alternative: യാക്കോബ് തന്റെ വടിയുടെ അറ്റത്തേക്കു തിരിഞ്ഞ് ആരാധിച്ചു; അല്ലെങ്കിൽ ഉല്പത്തി 47:31-ന്റെ എബ്രായ പാഠമനുസരിച്ച് കിടക്കയുടെ തലഭാഗത്തിന്മേൽ കുനിഞ്ഞ് ആരാധിച്ചു.
  rationale: എബ്രായർ ലേഖനത്തിലെ ഗ്രീക്ക് പാഠം വ്യക്തമായി 'വടി' എന്നു വായിക്കുന്നു; എന്നാൽ ἐπί ഉള്ള പ്രയോഗം ഭാവമോ ദിശയോ സൂചിപ്പിക്കാം. മുഖ്യപാഠം സാദ്ധ്യതയേറിയ ശരീരഭാവം നൽകുന്നു; വടിയെയാണ് ആരാധിച്ചതെന്ന ധാരണ വരുത്തുന്നില്ല. ഉല്പത്തിയിലെ എബ്രായ പാഠരൂപവും കൂടുതൽ അക്ഷരാർഥമുള്ള ദിശാവായനയും അടിക്കുറിപ്പുകളിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. 'അനുഗ്രഹിച്ചു', 'ആരാധിച്ചു' എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാക്കി. ഗ്രീക്ക് പാഠത്തിലെ യഥാർഥ അസ്പഷ്ടതകൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
