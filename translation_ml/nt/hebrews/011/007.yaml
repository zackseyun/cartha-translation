id: HEB.11.7
reference: Hebrews 11:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πίστει χρηματισθεὶς Νῶε περὶ τῶν μηδέπω βλεπομένων εὐλαβηθεὶς κατεσκεύασεν κιβωτὸν εἰς σωτηρίαν τοῦ οἴκου αὐτοῦ, δι’ ἧς κατέκρινεν τὸν κόσμον, καὶ τῆς κατὰ πίστιν δικαιοσύνης ἐγένετο κληρονόμος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/007.yaml
  text: By faith Noah[a], having been warned about things not yet seen, in reverent fear constructed an ark for the salvation of his household[d][c][b], through which he condemned the world and became heir of the righteousness according to faith.
translation:
  language: ml
  text: വിശ്വാസത്താൽ നോഹ, ഇതുവരെ കാണപ്പെട്ടിട്ടില്ലാത്ത കാര്യങ്ങളെക്കുറിച്ച് മുന്നറിയിപ്പു ലഭിച്ച്[a], ഭക്തിപൂർവമായ ഭയത്തോടെ[b] തന്റെ വീട്ടുകാരുടെ രക്ഷയ്ക്കായി ഒരു പെട്ടകം പണിതു. അതിലൂടെ[c] അവൻ ലോകത്തെ കുറ്റംവിധിച്ചു; വിശ്വാസപ്രകാരമുള്ള നീതിയുടെ[d] അവകാശിയായിത്തീർന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദൈവിക നിർദേശം ലഭിച്ച്’ അല്ലെങ്കിൽ ‘ദൈവത്തിൽനിന്ന് മുന്നറിയിപ്പു ലഭിച്ച്.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ദൈവഭയത്താൽ പ്രേരിതനായി.’
    reason: lexical_alternative
  - marker: c
    text: ‘അതിലൂടെ’ എന്നത് വ്യാകരണപരമായി ഏറ്റവും സ്വാഭാവികമായി പെട്ടകത്തെ സൂചിപ്പിക്കുന്നു; ചിലർ ഇത് നോഹയുടെ വിശ്വാസത്തെയോ വിശ്വാസപൂർവമായ അനുസരണത്തെയോ വിശാലമായി സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
  - marker: d
    text: ‘നീതി’ എന്നതിന് ‘നീതിമത്തം’ എന്നും പരിഭാഷപ്പെടുത്താം; ഇവിടെ വിശ്വാസവുമായി ബന്ധപ്പെട്ട ദൈവസന്നിധിയിലെ ശരിയായ നില എന്ന ആശയവും ഉൾപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: വിശ്വാസത്താൽ
  rationale: എബ്രായർ 11-ൽ ആവർത്തിക്കുന്ന ഘടനയും ഉപാധിയെ സൂചിപ്പിക്കുന്ന ദത്തിവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: χρηματισθεὶς
  choice: മുന്നറിയിപ്പു ലഭിച്ചപ്പോൾ
  rationale: ദൈവിക സന്ദേശമോ മുന്നറിയിപ്പോ ലഭിച്ചതിനെ സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിൽ കർത്താവ് വ്യക്തമായി പറയാത്തതിനാൽ മുഖ്യപാഠത്തിൽ ‘ദൈവത്തിൽനിന്ന്’ എന്നു ചേർത്തിട്ടില്ല.
- source_word: περὶ τῶν μηδέπω βλεπομένων
  choice: അന്നുവരെ കാണപ്പെട്ടിട്ടില്ലാത്ത കാര്യങ്ങളെക്കുറിച്ച്
  rationale: μηδέπω എന്നതിന്റെ ‘ഇനിയും/അന്നുവരെ ഇല്ല’ എന്ന കാലസൂചനയും വരാനിരിക്കുന്ന അദൃശ്യകാര്യങ്ങളും സംരക്ഷിക്കുന്നു.
- source_word: εὐλαβηθεὶς
  choice: ഭക്തിപൂർവമായ ഭയത്തോടെ
  rationale: വെറും ഭീതിയല്ല, ദൈവസന്നിധിയിലെ ആദരഭയത്തോടെയുള്ള പ്രതികരണമാണ് പദം സൂചിപ്പിക്കുന്നത്.
- source_word: κατεσκεύασεν κιβωτὸν
  choice: ഒരു പെട്ടകം പണിതു
  rationale: നോഹയുടെ സന്ദർഭത്തിൽ κιβωτός-ന്റെ പതിവായ മലയാള പദം ‘പെട്ടകം’; κατεσκεύασεν ഇവിടെ ‘പണിതു’ എന്നു സ്വാഭാവികമായി വരുന്നു.
- source_word: εἰς σωτηρίαν τοῦ οἴκου αὐτοῦ
  choice: തന്റെ കുടുംബത്തിന്റെ രക്ഷയ്ക്കായി
  rationale: οἶκος ഇവിടെ വീട്ടുകാരെയോ കുടുംബാംഗങ്ങളെയോ സൂചിപ്പിക്കുന്നു; σωτηρίαയുടെ രക്ഷ/വിടുതൽ അർഥം നിലനിർത്തുന്നു.
- source_word: δι’ ἧς
  choice: അതിലൂടെ
  rationale: സ്ത്രീലിംഗ ആപേക്ഷിക സർവനാമത്തിന്റെ ഏറ്റവും അടുത്ത മുൻപദമായ κιβωτός, ‘പെട്ടകം’, ആണ് സ്വാഭാവിക സൂചന; വിശ്വാസപ്രേരിത അനുസരണത്തെ വിശാലമായി സൂചിപ്പിക്കാനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: κατέκρινεν τὸν κόσμον
  choice: ലോകത്തെ കുറ്റംവിധിക്കുകയും
  rationale: നോഹയുടെ വിശ്വാസപൂർവമായ അനുസരണം അവിശ്വാസിയായ ലോകത്തിന്റെ കുറ്റാവസ്ഥ വെളിപ്പെടുത്തിയെന്ന നേരിട്ടുള്ള അർഥം നൽകുന്നു.
- source_word: τῆς κατὰ πίστιν δικαιοσύνης
  choice: വിശ്വാസത്തിനൊത്ത നീതിയുടെ
  rationale: κατάയുടെ ‘അനുസരിച്ചുള്ള/ഒത്ത’ ബന്ധം അമിതമായി വ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്നു; δικαιοσύνηയ്ക്ക് ഇവിടെ ‘നീതി’ എന്ന സ്വാഭാവികവും ദൈവശാസ്ത്രപരമായി തുറന്നതുമായ പദം ഉപയോഗിക്കുന്നു.
- source_word: ἐγένετο κληρονόμος
  choice: അവകാശിയായിത്തീരുകയും ചെയ്തു
  rationale: ലഭിച്ച നിലയെയോ പദവിയെയോ വ്യക്തമായി പ്രകടിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളം.
theological_decisions:
- issue: χρηματισθεὶς-ന്റെ ദൈവിക ഉറവിടം മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കണമോ
  choice: ‘മുന്നറിയിപ്പു ലഭിച്ചപ്പോൾ’ എന്ന് മാത്രം
  alternative: ‘ദൈവത്തിൽനിന്ന് മുന്നറിയിപ്പു ലഭിച്ചപ്പോൾ’ / ‘ദൈവിക നിർദേശം ലഭിച്ചപ്പോൾ’
  rationale: സന്ദർഭം ദൈവിക ഉറവിടം സൂചിപ്പിച്ചാലും ഗ്രീക്കിൽ ദൈവം എന്ന പദം വ്യക്തമല്ല; അതിനാൽ അതിനെ മുഖ്യപാഠത്തിൽ ചേർക്കാതെ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: εὐλαβηθεὶς-ന്റെ ഭയവും ഭക്തിയും
  choice: ഭക്തിപൂർവമായ ഭയത്തോടെ
  alternative: ആദരഭയത്താൽ പ്രേരിതനായി / ഭക്തിയോടെ
  rationale: വെറും പേടി എന്ന അർഥത്തിലേക്ക് ചുരുക്കാതെയും ഭയത്തിന്റെ ഘടകം ഇല്ലാതാക്കാതെയും ഇരുവശവും സംരക്ഷിക്കുന്നു.
- issue: δι’ ἧς ആരെയോ എന്തിനെയോ സൂചിപ്പിക്കുന്നു
  choice: പെട്ടകത്തെ സൂചിപ്പിക്കുന്ന ‘അതിലൂടെ’
  alternative: നോഹയുടെ വിശ്വാസം അല്ലെങ്കിൽ വിശ്വാസപൂർവമായ അനുസരണം വഴി
  rationale: വ്യാകരണപരമായി ഏറ്റവും അടുത്ത സ്ത്രീലിംഗ മുൻപദം κιβωτός ആണ്; എന്നാൽ വിശാലമായ ആശയബന്ധം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- issue: δικαιοσύνηയുടെ പരിഭാഷ
  choice: നീതി
  alternative: നീതിമത്തം / ദൈവസന്നിധിയിലെ ശരിയായ നില
  rationale: ‘നീതി’ പദം ഗ്രീക്കിന്റെ ന്യായപരവും ബന്ധപരവുമായ അർഥവ്യാപ്തി തുറന്നുവെക്കുന്നു; ‘വിശ്വാസത്തിനൊത്ത’ എന്ന ഘടന ഉടമ്പടി-ബന്ധപരമായ വശത്തെയും സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ദീർഘമായ ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് മലയാള വാക്യങ്ങളാക്കി; ആശയബന്ധം നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട മുഖ്യപാഠഭാഗങ്ങളിൽ ചേർത്തിരിക്കുന്നു.
