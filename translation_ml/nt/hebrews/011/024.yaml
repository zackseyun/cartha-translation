  - severity: low
    issue: The lexical-alternative footnote uses ആശ്രയത്താൽ for “by trust.”
    rationale: ആശ്രയത്താൽ is not the most natural Malayalam expression for this semantic alternative. ആശ്രയിച്ചുകൊണ്ട് is clearer while retaining the audit trail’s acknowledged alternative.
