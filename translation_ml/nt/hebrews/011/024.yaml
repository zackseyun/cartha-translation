source:
  edition: SBLGNT
  text: πίστει Μωϋσῆς μέγας γενόμενος ἠρνήσατο λέγεσθαι υἱὸς θυγατρὸς Φαραώ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/024.yaml
  text: By faith Moses[a], when he had grown up, refused to be called the son of Pharaoh’s daughter,
translation:
  language: ml
  text: വിശ്വാസത്താൽ മോശെ[a] പ്രായപൂർത്തിയായപ്പോൾ ഫറവോന്റെ മകളുടെ മകൻ എന്നു വിളിക്കപ്പെടാൻ വിസമ്മതിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ “വിശ്വസ്തതയാൽ” അല്ലെങ്കിൽ “ആശ്രയിച്ചുകൊണ്ട്”; ഗ്രീക്ക്: πίστει. ഈ അധ്യായത്തിൽ ആവർത്തിക്കുന്ന പ്രയോഗത്തെ പിന്തുടർന്ന് മുഖ്യപാഠത്തിൽ “വിശ്വാസത്താൽ” എന്നു നൽകിയിരിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: വിശ്വാസത്താൽ
  rationale: ഹെബ്രായർ 11-ൽ ആവർത്തിക്കുന്ന സൂത്രവാക്യവും ഇവിടെ ഉപാധി/മാർഗം സൂചിപ്പിക്കുന്ന ദത്തിവ് പ്രയോഗവും സ്വാഭാവികമായി പകർന്നുനൽകുന്നു.
- source_word: Μωϋσῆς
  choice: മോശെ
  rationale: മലയാളത്തിൽ പ്രചാരമുള്ള വ്യക്തിനാമരൂപം.
- source_word: μέγας γενόμενος
  choice: വളർന്നപ്പോൾ
  rationale: പദാനുപദമായി ‘വലിയവനായപ്പോൾ’ എന്നതിനെക്കാൾ പ്രായപൂർത്തിയായതിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἠρνήσατο
  choice: വിസമ്മതിച്ചു
  rationale: തനിക്കു ചാർത്തപ്പെട്ട രാജകീയ തിരിച്ചറിയൽ സ്വീകരിക്കാൻ ബോധപൂർവം നിരസിച്ചതാണ് സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്.
- source_word: λέγεσθαι
  choice: വിളിക്കപ്പെടാൻ
  rationale: കർമണിപ്രയോഗത്തിലുള്ള അപാദാനക്രിയയുടെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാള പരിഭാഷ.
- source_word: υἱὸς θυγατρὸς Φαραώ
  choice: ഫറവോന്റെ മകളുടെ മകൻ
  rationale: മോശെയുടെ നിർദിഷ്ടമായ ദത്തെടുത്ത രാജകീയ തിരിച്ചറിയലിനെ സൂചിപ്പിക്കുന്ന ബന്ധഘടന മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: Φαραώ
  choice: ഫറവോൻ
  rationale: ഈജിപ്തിലെ ഭരണാധികാരിയുടെ സ്ഥാനപ്പേരിന് മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം.
theological_decisions:
- issue: ഹെബ്രായർ 11-ലെ πίστις എന്ന ആവർത്തിത പദത്തിന്റെ പരിഭാഷ
  choice: വിശ്വാസം
  alternative: വിശ്വസ്തത; ആശ്രയം
  rationale: അധ്യായത്തിലെ ആവർത്തിതമായ πίστει സൂത്രവും വിശ്വാസത്തിൽ നിന്നുള്ള പ്രവർത്തനങ്ങളിലേക്കുള്ള ഊന്നലും ‘വിശ്വാസത്താൽ’ എന്ന മുഖ്യവായനയെ പിന്തുണയ്ക്കുന്നു; സാദ്ധ്യമായ മറ്റു അർഥങ്ങൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ വാക്യക്രമവും ദൈവശാസ്ത്രപരമായ അർഥസാദ്ധ്യതയും കഴിയുന്നത്ര നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ മലയാളപ്രയോഗം തെരഞ്ഞെടുത്തു.
