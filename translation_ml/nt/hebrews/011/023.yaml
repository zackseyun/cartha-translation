id: HEB.11.23
reference: Hebrews 11:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Πίστει Μωϋσῆς γεννηθεὶς ἐκρύβη τρίμηνον ὑπὸ τῶν πατέρων αὐτοῦ, διότι εἶδον ἀστεῖον τὸ παιδίον καὶ οὐκ ἐφοβήθησαν τὸ διάταγμα τοῦ βασιλέως.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/023.yaml
  text: By faith Moses[a], when he was born, was hidden for three months by his parents, because they saw that the child was beautiful, and they were not afraid of the king’s edict.
translation:
  language: ml
  text: വിശ്വാസത്താൽ മോശെ ജനിച്ചപ്പോൾ, അവന്റെ മാതാപിതാക്കൾ അവനെ മൂന്നു മാസത്തേക്ക് ഒളിപ്പിച്ചു; കാരണം, കുഞ്ഞ് സുന്ദരനായ[a] ഒരാളാണെന്ന് അവർ കണ്ടു, രാജാവിന്റെ കൽപ്പനയെ അവർ ഭയപ്പെട്ടില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“നല്ല” എന്നോ “വിശേഷപ്പെട്ട” എന്നോ പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക്: ἀστεῖον. പുറപ്പാട് 2:2; പ്രവൃത്തികൾ 7:20 എന്നിവ കാണുക.'
    reason: ἀστεῖον എന്ന പദത്തിന്റെ അർഥവ്യാപ്തിയും പുറപ്പാട് 2:2, പ്രവൃത്തികൾ 7:20 എന്നിവയുമായുള്ള പ്രതിധ്വനിയും സൂചിപ്പിക്കുന്ന പദവികൽപം.
lexical_decisions:
- source_word: Πίστει
  choice: വിശ്വാസത്താൽ
  rationale: ഉപാധി അഥവാ മാർഗം സൂചിപ്പിക്കുന്ന ദത്തിവിനെ പ്രതിഫലിപ്പിക്കുകയും എബ്രായർ 11-ലെ ആവർത്തിക്കുന്ന പ്രമേയം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: Μωϋσῆς
  choice: മോശെ
  rationale: മലയാളത്തിൽ പ്രചാരത്തിലുള്ള വ്യക്തിനാമരൂപം.
- source_word: γεννηθεὶς
  choice: ജനിച്ചപ്പോൾ
  rationale: അയോറിസ്റ്റ് നിഷ്ക്രിയ കൃതന്തത്തിന്റെ കാലബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐκρύβη
  choice: മാതാപിതാക്കൾ ... ഒളിപ്പിച്ചു
  rationale: ഗ്രീക്കിലെ നിഷ്ക്രിയപ്രയോഗത്തിന്റെ പ്രവർത്താവിനെ വാക്യം തന്നെ വ്യക്തമാക്കുന്നതിനാൽ, സ്വാഭാവിക മലയാളത്തിനായി കർത്തരിപ്രയോഗമാക്കി; മോശെയാണ് ഒളിപ്പിക്കപ്പെട്ടത് എന്ന അർഥം മാറ്റമില്ലാതെ നിലനിൽക്കുന്നു.
- source_word: τρίμηνον
  choice: മൂന്നു മാസം
  rationale: കാലദൈർഘ്യം മലയാളത്തിലെ സ്വാഭാവിക രൂപത്തിൽ നൽകുന്നു.
- source_word: ὑπὸ τῶν πατέρων αὐτοῦ
  choice: മാതാപിതാക്കൾ
  rationale: πατέρων എന്നതിന്റെ അക്ഷരാർഥം ‘പിതാക്കന്മാർ’ ആണെങ്കിലും, പുറപ്പാട് പശ്ചാത്തലത്തിലും ഇവിടെ വരുന്ന ബഹുവചന ക്രിയകളിലും ഇത് അച്ഛനെയും അമ്മയെയും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു.
- source_word: διότι
  choice: കണ്ടതിനാൽ
  rationale: അവനെ ഒളിപ്പിച്ചതിന്റെ കാരണം വ്യക്തമാക്കുന്ന ബന്ധം മലയാളവാക്യത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: εἶδον
  choice: കണ്ടു
  rationale: അവരുടെ നേരിട്ടുള്ള നിരീക്ഷണം ലളിതമായി നിലനിർത്തുന്നു.
- source_word: ἀστεῖον
  choice: സുന്ദരനായ
  rationale: ഈ പദത്തിന് സുന്ദരം, നല്ലത്, വിശേഷപ്പെട്ടത് എന്നീ അർഥനിറങ്ങളുണ്ട്; പുറപ്പാട് 2:2, പ്രവൃത്തികൾ 7:20 എന്നിവയുമായുള്ള പ്രതിധ്വനി കാത്തുകൊണ്ട് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ രൂപം തെരഞ്ഞെടുത്തു.
- source_word: τὸ παιδίον
  choice: ഒരു കുഞ്ഞ്
  rationale: സന്ദർഭത്തിൽ നവജാതശിശുവിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും മാന്യവുമായ മലയാളപ്രയോഗം.
- source_word: οὐκ ἐφοβήθησαν
  choice: അവർ ഭയപ്പെട്ടില്ല
  rationale: വിശ്വാസവും ഭയവും തമ്മിലുള്ള വൈരുധ്യം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: τὸ διάταγμα τοῦ βασιλέως
  choice: രാജാവിന്റെ കൽപ്പന
  rationale: ഔദ്യോഗികമായ രാജാജ്ഞയെ സൂചിപ്പിക്കുന്ന, ആധുനിക വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന പദപ്രയോഗം.
theological_decisions:
- issue: മോശെയെ ഒളിപ്പിക്കാൻ മാതാപിതാക്കളെ പ്രേരിപ്പിച്ചതിന്റെ സ്വഭാവം
  choice: കുഞ്ഞ് സുന്ദരനാണെന്ന അവരുടെ നിരീക്ഷണവും രാജാവിന്റെ കൽപ്പനയെ ഭയപ്പെടാതിരുന്നതും വിശ്വാസത്തിന്റെ കീഴിൽ ഒരുമിച്ച് അവതരിപ്പിച്ചു.
  alternative: കുഞ്ഞിന്റെ സൗന്ദര്യം മാത്രമായിരുന്നു പ്രേരണ; അല്ലെങ്കിൽ അവന്റെ രൂപത്തിൽ പ്രത്യേകമായ ഒരു ദൈവിക അടയാളം അവർ കണ്ടു.
  rationale: വാക്യഘടന അവരുടെ നിരീക്ഷണത്തെയും രാജകൽപ്പനയോടുള്ള നിർഭയത്വത്തെയും ‘വിശ്വാസത്താൽ’ എന്ന പ്രമേയത്തിനുള്ളിൽ നിർത്തുന്നു. കുഞ്ഞിന്റെ രൂപം അത്ഭുതകരമായ ദൈവിക അടയാളമായിരുന്നു എന്ന് മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ അത്തരമൊരു വ്യാഖ്യാനം പരിഭാഷയിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ ശൈലി. ഗ്രീക്കിലെ ദീർഘമായ വാക്യബന്ധം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി നിഷ്ക്രിയപ്രയോഗം കർത്തരിപ്രയോഗമാക്കി. അർധവിരാമം അവസാന കാരണഘടകത്തെയും നിർഭയത്വത്തെയും വ്യക്തമായി വേർതിരിക്കുന്നു.
