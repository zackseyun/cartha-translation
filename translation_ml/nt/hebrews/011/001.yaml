id: HEB.11.1
reference: Hebrews 11:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἔστιν δὲ πίστις ἐλπιζομένων ὑπόστασις, πραγμάτων ἔλεγχος οὐ βλεπομένων·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/001.yaml
  text: Faith is the assurance of things hoped for[b][a], the proof of things not seen.
translation:
  language: ml
  text: വിശ്വാസം പ്രത്യാശിക്കപ്പെടുന്ന കാര്യങ്ങളുടെ ഉറപ്പും[a] കാണാത്ത കാര്യങ്ങളുടെ തെളിവുമാണ്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “സത്ത” അഥവാ “യാഥാർഥ്യം.”
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ “ദൃഢബോധ്യം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστις
  choice: വിശ്വാസം
  rationale: ഇവിടെ ദൈവത്തിന്റെ വാഗ്ദാനങ്ങളിലുള്ള ആശ്രയവും ഉറച്ച വിശ്വാസവുമാണ് സൂചിപ്പിക്കുന്നത്; ‘വിശ്വസ്തത’ എന്ന അർഥമല്ല സന്ദർഭത്തിൽ പ്രധാനമായത്.
- source_word: ἐλπιζομένων
  choice: പ്രത്യാശിക്കുന്നവയുടെ
  rationale: ജനിറ്റീവ് ബഹുവചനത്തിലുള്ള substantival participle പ്രത്യാശയുടെ വിഷയങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ഈ രൂപം സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: ὑπόστασις
  choice: ഉറപ്പ്
  rationale: ഈ പദത്തിന്റെ ‘ഉറപ്പ്/ആത്മവിശ്വാസം’ എന്ന പ്രായോഗിക അർഥം സന്ദർഭത്തിൽ വ്യക്തമായി നൽകുന്നു; ‘സത്ത’ എന്ന സാങ്കേതിക തത്ത്വചിന്താപരമായ ധ്വനി മുഖ്യവാചകത്തിൽ ഒഴിവാക്കുന്നു.
- source_word: πραγμάτων
  choice: കാര്യങ്ങളുടെ
  rationale: πρᾶγμα എന്ന വിശാല പദത്തിന് ‘കാര്യങ്ങൾ’ സ്വാഭാവികമായ പൊതുപദമാണ്; കാണാത്ത യാഥാർഥ്യങ്ങളെയും വിഷയങ്ങളെയും ഉൾക്കൊള്ളുന്നു.
- source_word: ἔλεγχος
  choice: തെളിവ്
  rationale: പദത്തിലെ വസ്തുനിഷ്ഠമായ തെളിവിന്റെയും അതിൽനിന്നുണ്ടാകുന്ന ബോധ്യത്തിന്റെയും ശക്തി ‘തെളിവ്’ നന്നായി സംവേദിപ്പിക്കുന്നു.
- source_word: οὐ βλεπομένων
  choice: കാണാത്ത കാര്യങ്ങളുടെ
  rationale: വർത്തമാനകാല passive participle-ന്റെ നിഷേധാർഥം നേരിട്ട് നൽകുകയും ഇപ്പോഴത്തെ കാഴ്ചയ്ക്കപ്പുറമുള്ള കാര്യങ്ങളിലേക്കുള്ള സൂചന നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇവിടെ δέ ശക്തമായ വിരോധമല്ല, മൃദുവായ ആശയമാറ്റമാണ്. ഒറ്റവാക്യമായി വായിക്കുമ്പോൾ മലയാളത്തിൽ ഒരു തുടക്കബന്ധകപദം ചേർക്കാതിരിക്കുന്നതാണ് കൂടുതൽ സ്വാഭാവികം.
theological_decisions:
- issue: എബ്രായർ 11:1-ലെ ὑπόστασις എന്ന പദത്തിന്റെ അർഥം
  choice: ഉറപ്പ്
  alternative: അടിസ്ഥാനം; യാഥാർഥ്യം
  rationale: അധ്യായത്തിന്റെ പ്രബോധനാത്മക സന്ദർഭത്തിൽ വിശ്വാസത്തിന്റെ ഉറപ്പിനാണ് ഊന്നൽ. എന്നിരുന്നാലും പദത്തിന്റെ വസ്തുനിഷ്ഠമായ ‘അടിസ്ഥാനം/യാഥാർഥ്യം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: πίστις എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: വിശ്വാസം
  alternative: ആശ്രയം; വിശ്വസ്തത
  rationale: ഇവിടെ വിശ്വാസിയുടെ ദൈവാശ്രയമായ നിലപാടാണ് ഉദ്ദേശിക്കുന്നത്; ‘വിശ്വസ്തത’ എന്ന ഗുണം മുഖ്യമായ അർഥമല്ല.
- issue: ἔλεγχος വസ്തുനിഷ്ഠമായ തെളിവാണോ ആന്തരിക ബോധ്യമാണോ
  choice: തെളിവ്
  alternative: ദൃഢബോധ്യം
  rationale: ഗ്രീക്ക് പദത്തിന് തെളിവ്, പരിശോധനയാൽ സ്ഥാപിക്കൽ, ബോധ്യം എന്നീ ബന്ധമുള്ള അർഥങ്ങളുണ്ട്. മുഖ്യവാചകത്തിൽ വസ്തുനിഷ്ഠ ശക്തി നിലനിർത്തി ആന്തരിക ബോധ്യത്തിന്റെ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടന ഉപയോഗിച്ചു. ഗ്രീക്ക് വാക്യത്തിലെ സമാന്തരഘടന ‘ഉറപ്പും … തെളിവുമാണ്’ എന്ന രൂപത്തിൽ നിലനിർത്തി. δέ-യ്ക്ക് അനാവശ്യമായി ‘ഇപ്പോൾ’ ചേർത്തിട്ടില്ല.
