reference: Hebrews 11:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πίστει Ῥαὰβ ἡ πόρνη οὐ συναπώλετο τοῖς ἀπειθήσασιν, δεξαμένη τοὺς κατασκόπους μετ’ εἰρήνης.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/031.yaml
  text: By faith Rahab the prostitute did not perish with those who were disobedient[b][a], because she had welcomed the spies in peace.
translation:
  language: ml
  text: വിശ്വാസത്താൽ വേശ്യയായ രാഹാബ് അനുസരിക്കാതിരുന്നവരോടൊപ്പം നശിച്ചില്ല; കാരണം അവൾ ചാരന്മാരെ സമാധാനത്തോടെ സ്വീകരിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ചാരന്മാരെ സമാധാനത്തോടെ സ്വീകരിച്ചശേഷം.”
    reason: δεξαμένη എന്ന പങ്കാളിക്രിയയെ കാരണമായി കാണുന്നതിനു പകരം മുൻകാല സാഹചര്യമായി ഗ്രഹിക്കാവുന്ന വ്യാകരണസാധ്യത സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: πίστει
  choice: വിശ്വാസത്താൽ
  rationale: ഉപാധി സൂചിപ്പിക്കുന്ന ദത്തിവ്; എബ്രായർ 11-ലെ മാതൃകാപരമായ ആവർത്തനപ്രയോഗം സ്വാഭാവികമായും സംക്ഷിപ്തമായും നിലനിർത്തുന്നു.
- source_word: Ῥαὰβ ἡ πόρνη
  choice: വേശ്യയായ രാഹാബ്
  rationale: പേര് മലയാളത്തിലെ പ്രചാരത്തിലുള്ള രൂപത്തിൽ ലിപ്യന്തരിച്ചു; πόρνηയുടെ നേരിട്ടുള്ള സാമൂഹിക-ധാർമ്മിക അർത്ഥം പഴഞ്ചൊല്ലോ മൃദൂകരണവുമില്ലാതെ നൽകുന്നു.
- source_word: οὐ συναπώλετο
  choice: ഒപ്പം നശിച്ചില്ല
  rationale: സംയുക്തക്രിയയിലെ ‘മറ്റുള്ളവരോടുകൂടെ നശിക്കുക’ എന്ന ആശയം ‘അവരോടൊപ്പം’ എന്ന ബന്ധത്തോടെ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τοῖς ἀπειθήσασιν
  choice: അനുസരിക്കാതിരുന്നവരോടൊപ്പം
  rationale: ἀπειθέωയുടെ അവിശ്വാസവുമായി ബന്ധപ്പെട്ടെങ്കിലും പ്രധാനമായ അനുസരണക്കേടിന്റെ അർത്ഥം സംരക്ഷിക്കുന്നു.
- source_word: δεξαμένη
  choice: കാരണം അവൾ ... സ്വീകരിച്ചു
  rationale: ഏറിസ്റ്റ് പങ്കാളിക്രിയയെ ഇവിടെ സാഹചര്യപരമായ/കാരണപരമായ ബന്ധമായി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; പങ്കാളിക്രിയയുടെ ബന്ധത്തിൽ ചെറിയ വ്യാഖ്യാനസാധ്യത ഉള്ളതിനാൽ അടിക്കുറിപ്പിൽ കൂടുതൽ ഔപചാരികമായ രൂപം നൽകുന്നു.
- source_word: τοὺς κατασκόπους
  choice: ചാരന്മാരെ
  rationale: യോശുവയുടെ സന്ദർഭത്തിൽ κατάσκοπος എന്നതിന്റെ വ്യക്തവും പതിവുമായ മലയാളരൂപം.
- source_word: μετ’ εἰρήνης
  choice: സമാധാനത്തോടെ
  rationale: സ്വീകരണത്തിന്റെ സമാധാനപരമായ രീതിയെ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; ‘സമാധാനത്തിൽ’ എന്ന കൃത്രിമ പദാനുപദരൂപം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: എബ്രായർ 11-ലെ πίστει എന്ന മാതൃകാസൂത്രത്തിന്റെ പരിഭാഷ
  choice: വിശ്വാസത്താൽ
  alternative: ആശ്രയത്താൽ / വിശ്വസ്തതയാൽ
  rationale: ഈ അധ്യായത്തിലെ ആവർത്തിത മാതൃകാസൂത്രത്തിൽ ‘വിശ്വാസം’ തന്നെയാണ് സന്ദർഭോചിതമായ പ്രാഥമിക അർത്ഥം; ‘ആശ്രയം’, ‘വിശ്വസ്തത’ എന്നിവ ബന്ധപ്പെട്ട ആശയങ്ങളാണെങ്കിലും ഇവിടെ മുഖ്യവായനയായി കുറവാണ്.
- issue: ἀπειθήσασιν എന്നതിലെ അനുസരണക്കേടും അവിശ്വാസവും
  choice: അനുസരിക്കാതിരുന്നവർ
  alternative: വിശ്വസിക്കാതിരുന്നവർ
  rationale: ഗ്രീക്ക് ക്രിയയിലെ മനഃപൂർവമായ അനുസരണക്കേടിന്റെ ഘടകം നിലനിർത്തുന്നു; ‘വിശ്വസിക്കാതിരുന്നവർ’ വിശ്വാസത്തിന്റെ വശം മുൻനിറുത്തുമെങ്കിലും പദത്തിന്റെ പൂർണ്ണ നൈതിക-പ്രവർത്തനബലം കുറയ്ക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള മലയാളം. ‘വേശ്യ’ എന്ന നേരിട്ടുള്ള പദവും ‘വിശ്വാസത്താൽ’ എന്ന എബ്രായർ 11-ലെ ആവർത്തനസൂത്രവും നിലനിർത്തി. പ്രധാനവാചകത്തിലെ എല്ലാ അടിക്കുറിപ്പുകൾക്കും പൊരുത്തപ്പെടുന്ന മാർക്കർ നൽകിയിട്ടുണ്ട്.
