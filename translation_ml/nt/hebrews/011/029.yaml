id: HEB.11.29
reference: Hebrews 11:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Πίστει διέβησαν τὴν Ἐρυθρὰν Θάλασσαν ὡς διὰ ξηρᾶς ⸀γῆς, ἧς πεῖραν λαβόντες οἱ Αἰγύπτιοι κατεπόθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/029.yaml
  text: By faith they crossed the Red Sea as through dry land[a], of which the Egyptians, when they attempted it, were swallowed up.
translation:
  language: ml
  text: വിശ്വാസത്താൽ അവർ ഉണങ്ങിയ നിലത്തിലൂടെ കടക്കുന്നതുപോലെ ചെങ്കടൽ[a] കടന്നു; അതു കടക്കാൻ ശ്രമിച്ച ഈജിപ്തുകാർ വിഴുങ്ങപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഞാങ്ങണക്കടൽ.’ ഇവിടെ ഗ്രീക്ക് പാഠത്തിൽ ‘ചെങ്കടൽ’ (Ἐρυθρὰν Θάλασσαν) എന്നാണ്; എന്നാൽ പുറപ്പാടിലെ അടിസ്ഥാന എബ്രായ സ്ഥലനാമം ‘ഞാങ്ങണക്കടൽ’ എന്നർഥമാകാമെന്ന് ചിലർ കരുതുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστει
  choice: വിശ്വാസത്താൽ
  rationale: ഉപാധി/മാർഗം സൂചിപ്പിക്കുന്ന ദത്തിവ്. എബ്രായർ 11-ലെ ആവർത്തിത പ്രമേയമായ πίστις എന്ന പദത്തെ സ്വാഭാവികമായും സ്ഥിരതയോടെയും ‘വിശ്വാസം’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: διέβησαν
  choice: കടന്നു
  rationale: ഒരു വശത്തുനിന്ന് മറുവശത്തേക്കു സഞ്ചരിക്കുക എന്ന διαβαίνω-യുടെ സംഭവാർഥം ലളിതമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: Ἐρυθρὰν Θάλασσαν
  choice: ചെങ്കടൽ
  rationale: ഗ്രീക്ക് പാഠത്തിൽ വ്യക്തമായി Ἐρυθρὰν Θάλασσαν (‘ചെങ്കടൽ’) എന്നാണ്; പുറപ്പാടിലെ അടിസ്ഥാന എബ്രായ സ്ഥലനാമത്തെക്കുറിച്ചുള്ള ‘ഞാങ്ങണക്കടൽ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ὡς διὰ ξηρᾶς γῆς
  choice: ഉണങ്ങിയ നിലത്തിലൂടെ എന്നപോലെ
  rationale: ὡς എന്ന താരതമ്യഘടകവും διά സൂചിപ്പിക്കുന്ന ‘വഴിയായി/ഇടയിലൂടെ’ എന്ന ആശയവും നിലനിർത്തുന്നു; ξηρὰ γῆ സ്വാഭാവികമായി ‘ഉണങ്ങിയ നിലം’ എന്നു നൽകുന്നു.
- source_word: ἧς πεῖραν λαβόντες
  choice: അതു കടക്കാൻ ശ്രമിച്ചപ്പോൾ
  rationale: πεῖραν λαμβάνειν എന്നത് ‘ശ്രമിക്കുക’ എന്ന ഇടിയമാണ്. ബന്ധസർവനാമത്തിന്റെ മുൻസൂചനയായ അതേ കടന്നുപോകൽ മലയാളത്തിൽ വ്യക്തമായി ‘അതു കടക്കാൻ’ എന്നു പ്രകടമാക്കുന്നു.
- source_word: οἱ Αἰγύπτιοι
  choice: ഈജിപ്തുകാർ
  rationale: പുറപ്പാട് സംഭവത്തിലെ ഈജിപ്ത്യരെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള ദേശീയനാമം.
- source_word: κατεπόθησαν
  choice: വിഴുങ്ങപ്പെട്ടു
  rationale: καταπίνω എന്ന ക്രിയയുടെ ‘വിഴുങ്ങുക’ എന്ന സജീവ ദൃശ്യരൂപവും ഗ്രീക്കിലെ കർമണിപ്രയോഗവും സംരക്ഷിക്കുന്നു; ‘മുങ്ങിമരിച്ചു’ എന്ന വ്യാഖ്യാനാത്മക പരിഭാഷ ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: എബ്രായർ 11-ൽ πίστις എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: വിശ്വാസം
  alternative: ആശ്രയം; വിശ്വസ്തത
  rationale: അധ്യായത്തിലെ ആവർത്തിത Πίστει സൂത്രവാക്യത്തിന് ‘വിശ്വാസത്താൽ’ എന്നതാണ് പ്രസംഗസന്ദർഭത്തോട് ഏറ്റവും യോജിക്കുന്നതും മലയാള ക്രൈസ്തവ ഭാഷയിൽ സ്വാഭാവികവുമായ രൂപം; ഇവിടെ ‘വിശ്വസ്തത’യെ മുൻനിർത്താൻ സന്ദർഭപരമായ കാരണമില്ല.
- issue: ἧς എന്ന ബന്ധസർവനാമത്തിന്റെ സൂചന
  choice: അതേ കടന്നുപോകൽ ഈജിപ്തുകാർ ശ്രമിച്ചു എന്ന അർഥത്തിൽ ‘അതു കടക്കാൻ’
  alternative: ‘അതിനെ പരീക്ഷിച്ചപ്പോൾ’ എന്ന കൂടുതൽ പദാനുപദ രൂപം
  rationale: ഗ്രീക്ക് വാക്യം കടൽക്കടത്തലിലേക്കോ അതിലൂടെ ഉണ്ടായ പാതയിലേക്കോ ബന്ധിപ്പിക്കാവുന്ന ചെറിയ വ്യാകരണസാന്ദിഗ്ധ്യം വഹിക്കുന്നു. മലയാളത്തിൽ അസ്വാഭാവികമായ ബന്ധവാക്യം ഒഴിവാക്കി, ഈജിപ്തുകാർ അതേ കടക്കൽ ശ്രമിച്ചു എന്ന കേന്ദ്രാർഥം നൽകുന്നു; ദൈവത്തെ പരീക്ഷിച്ചു എന്ന അനാവശ്യ ദൈവശാസ്ത്രാർഥം ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘വിഴുങ്ങപ്പെട്ടു’ എന്ന ദൃശ്യാത്മക കർമണിരൂപം മൂലപാഠത്തിന്റെ ശക്തി നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ [a] ആയി ചേർത്തിരിക്കുന്നു.
