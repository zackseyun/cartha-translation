revisions:
- from: വിശ്വാസത്താൽ അവർ ഉണങ്ങിയ നിലത്തിലൂടെ എന്നപോലെ ചെങ്കടൽ[a] കടന്നു. എന്നാൽ ഈജിപ്തുകാർ അതു കടക്കാൻ ശ്രമിച്ചപ്പോൾ, അവർ വിഴുങ്ങപ്പെട്ടു.
  to: വിശ്വാസത്താൽ അവർ ഉണങ്ങിയ നിലത്തിലൂടെ കടക്കുന്നതുപോലെ ചെങ്കടൽ[a] കടന്നു; അതു കടക്കാൻ ശ്രമിച്ച ഈജിപ്തുകാർ വിഴുങ്ങപ്പെട്ടു.
