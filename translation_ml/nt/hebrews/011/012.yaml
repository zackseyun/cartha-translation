id: HEB.11.12
reference: Hebrews 11:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διὸ καὶ ἀφ’ ἑνὸς ἐγεννήθησαν, καὶ ταῦτα νενεκρωμένου, καθὼς τὰ ἄστρα τοῦ οὐρανοῦ τῷ πλήθει καὶ ὡς ἡ ἄμμος ἡ παρὰ τὸ χεῖλος τῆς θαλάσσης ἡ ἀναρίθμητος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/012.yaml
  text: Therefore from one man[a], and this one as good as dead, descendants were born as numerous as the stars of heaven and as the innumerable sand by the seashore.
translation:
  language: ml
  text: അതുകൊണ്ട്, ഒരൊറ്റ മനുഷ്യനിൽനിന്ന്[a]—അതും മരിച്ചവനെപ്പോലെയായിരുന്ന ഒരാളിൽനിന്ന്—ആകാശത്തിലെ നക്ഷത്രങ്ങളെപ്പോലെ എണ്ണത്തിൽ പെരുകിയവരും കടൽത്തീരത്തെ എണ്ണമറ്റ മണൽത്തരികളെപ്പോലെയുള്ളവരുമായ സന്തതികൾ ജനിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ അക്ഷരാർഥമായി, ‘ഒരുവനിൽനിന്ന്.’ സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത് അബ്രാഹാമിനെയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യത്തിലെ വിശ്വാസത്തെയും വാഗ്ദാനം ചെയ്തവന്റെ വിശ്വസ്തതയെയും അടിസ്ഥാനമാക്കിയുള്ള നിഗമനബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἀφ’ ἑνὸς
  choice: ഒരൊറ്റ മനുഷ്യനിൽനിന്ന്
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗരൂപവും സന്ദർഭവും അബ്രാഹാമിനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ഒരൊറ്റ’ എന്നത് അവന്റെ ഏകത്വത്തിന് ഊന്നൽ നൽകുന്നു.
- source_word: ἐγεννήθησαν
  choice: സന്തതികൾ ജനിച്ചു
  rationale: ബഹുവചന കർമണിപ്രയോഗം അബ്രാഹാമിന്റെ സന്തതികളുടെ ഉദ്ഭവത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഇത് സ്വാഭാവികമായി ഫലത്തെ അറിയിക്കുന്നു.
- source_word: καὶ ταῦτα νενεκρωμένου
  choice: അതും മരിച്ചവനെപ്പോലെയായിരുന്ന ഒരുവനിൽനിന്ന്
  rationale: καὶ ταῦτα എന്ന ഊന്നൽ ‘അതും’ എന്നതിലൂടെ നിലനിർത്തുന്നു. νενεκρωμένου അക്ഷരാർഥത്തിലുള്ള മരണമല്ല, വാർധക്യംമൂലം സന്താനോൽപാദനശേഷി ഇല്ലാതായതുപോലുള്ള അവസ്ഥയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: καθὼς τὰ ἄστρα τοῦ οὐρανοῦ τῷ πλήθει
  choice: എണ്ണത്തിൽ ആകാശത്തിലെ നക്ഷത്രങ്ങളെപ്പോലെ
  rationale: താരതമ്യവും τῷ πλήθει എന്ന എണ്ണപ്പെരുപ്പത്തിന്റെ ആശയവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ὡς ἡ ἄμμος ἡ παρὰ τὸ χεῖλος τῆς θαλάσσης ἡ ἀναρίθμητος
  choice: കടൽത്തീരത്തെ മണൽപോലെ എണ്ണമറ്റവർ
  rationale: χείλος എന്നതിന്റെ അക്ഷരാർഥമായ ‘വക്ക്’ മലയാളത്തിലെ സ്വാഭാവികമായ ‘കടൽത്തീരം’ എന്ന പ്രയോഗത്തിൽ നൽകുകയും ἀναρίθμητος എന്ന എണ്ണിക്കൂടായ്മ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘ഒരുവനിൽനിന്ന്’ എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: പ്രധാനപാഠത്തിൽ ‘ഒരൊറ്റ മനുഷ്യനിൽനിന്ന്’ എന്നു നൽകി അബ്രാഹാമിനെ സൂചിപ്പിക്കുന്നു.
  alternative: ‘ഒരുവനിൽനിന്ന്’ അല്ലെങ്കിൽ ‘ഒന്നിൽനിന്ന്’
  rationale: പുല്ലിംഗ ഏകവചനവും സമീപസന്ദർഭവും അബ്രാഹാമിലേക്കാണ് വിരൽചൂണ്ടുന്നത്; പേര് ചേർക്കാതെ തന്നെ മനുഷ്യനെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് വ്യക്തമാക്കുന്നു.
- issue: νενεκρωμένου എന്നതിന്റെ ശക്തി
  choice: ‘മരിച്ചവനെപ്പോലെയായിരുന്ന’ എന്ന രൂപകപ്രയോഗം
  alternative: ‘മരിച്ചിരുന്ന’ അല്ലെങ്കിൽ ‘നിർജീവനാക്കപ്പെട്ടിരുന്ന’
  rationale: അബ്രാഹാം അക്ഷരാർഥത്തിൽ മരിച്ചിരുന്നുവെന്നല്ല, വാർധക്യം നിമിത്തം സന്താനജനനത്തിന് അശക്തനായതുപോലെയായിരുന്നുവെന്നാണ് സന്ദർഭം; രൂപകത്തിന്റെ തീവ്രതയും അത്ഭുതത്തിന്റെ ഭാവവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളം; വാഗ്ദാനഭാഷയുടെ ഗൗരവവും താരതമ്യങ്ങളുടെ കാവ്യഭാവവും നിലനിർത്തി. ദീർഘവാക്യത്തിന്റെ ബന്ധങ്ങൾ വ്യക്തമാക്കാൻ ഇടവരകൾ ഉപയോഗിച്ചു.
