id: HEB.11.6
reference: Hebrews 11:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: χωρὶς δὲ πίστεως ἀδύνατον εὐαρεστῆσαι, πιστεῦσαι γὰρ δεῖ τὸν προσερχόμενον τῷ θεῷ ὅτι ἔστιν καὶ τοῖς ἐκζητοῦσιν αὐτὸν μισθαποδότης γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/006.yaml
  text: And without faith it is impossible to please him[c][b][a], for the one who comes to God must believe that he exists and that he is a rewarder of those who diligently seek him.
translation:
  language: ml
  text: വിശ്വാസം[a] കൂടാതെ ദൈവത്തെ പ്രസാദിപ്പിക്കുക അസാധ്യമാണ്. കാരണം, ദൈവത്തെ സമീപിക്കുന്നവർ ദൈവം ഉണ്ടെന്നും[b] ദൈവത്തെ ആത്മാർഥമായി അന്വേഷിക്കുന്നവർക്ക് അവിടന്ന് പ്രതിഫലം നൽകുന്നവനാണെന്നും[c] വിശ്വസിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആശ്രയം’ എന്നും പരിഭാഷപ്പെടുത്താം. πίστις ചില സന്ദർഭങ്ങളിൽ ‘വിശ്വസ്തത’ എന്നും അർഥമാക്കാം; എന്നാൽ ഇവിടെ തുടർന്നുള്ള വിശദീകരണം ദൈവത്തെ വിശ്വസിക്കുന്നതിലാണ് ഊന്നുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘അവിടന്ന് ഉണ്ട് എന്ന്.’ ഗ്രീക്ക് പ്രയോഗം വളരെ സംക്ഷിപ്തമാണ്.'
    reason: lexical_alternative
  - marker: c
    text: ‘പ്രതിഫലം നൽകുന്നവനാകുന്നു’ അല്ലെങ്കിൽ ‘പ്രതിഫലം നൽകുന്നവനായി വെളിപ്പെടുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിൽ ‘ആകുന്നു/ആയിത്തീരുന്നു’ എന്ന ക്രിയയാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; ഇവിടെ ദൈവത്തെ അന്വേഷിക്കുന്നവർക്ക് അവിടന്ന് എങ്ങനെയുള്ളവനായി അനുഭവപ്പെടുന്നു എന്ന ആശയം അതിനുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς δὲ πίστεως
  choice: വിശ്വാസം കൂടാതെ
  rationale: χωρίς വേർപാട് അഥവാ അഭാവം സൂചിപ്പിക്കുന്നു; δέ മൃദുവായ ബന്ധകമാണ്. മലയാളത്തിൽ വാക്യപ്രവാഹം സ്വാഭാവികമാക്കാൻ പ്രത്യേക ബന്ധകപദം ചേർക്കാതെ അർഥം നിലനിർത്തി. πίστις ഇവിടെ തുടർന്നുള്ള πιστεῦσαι മൂലം വിശ്വസിക്കൽ/ആശ്രയിക്കൽ എന്ന മനുഷ്യപ്രതികരണത്തെയാണ് പ്രധാനമായി സൂചിപ്പിക്കുന്നത്.
- source_word: ἀδύνατον εὐαρεστῆσαι
  choice: ദൈവത്തെ പ്രസാദിപ്പിക്കുക അസാധ്യമാണ്
  rationale: ഗ്രീക്കിലെ കർമം സന്ദർഭത്തിൽനിന്ന് മനസ്സിലാകുന്നു; മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ‘ദൈവത്തെ’ ചേർത്തു. അസാധ്യതയുടെ ശക്തി പൂർണമായി നിലനിർത്തുന്നു.
- source_word: πιστεῦσαι γὰρ δεῖ
  choice: കാരണം ... വിശ്വസിക്കണം
  rationale: γάρ കാരണം നൽകുന്നു; δεῖ അനിവാര്യത പ്രകടിപ്പിക്കുന്നു. ‘വിശ്വസിക്കണം’ ഈ രണ്ടാമത്തെ ഘടകത്തിന്റെ സ്വാഭാവികവും ശക്തവുമായ മലയാളരൂപമാണ്.
- source_word: τὸν προσερχόμενον τῷ θεῷ
  choice: ദൈവത്തെ സമീപിക്കുന്നവൻ
  rationale: προσέρχομαι ദൈവത്തിങ്കലേക്ക് അടുക്കുകയോ സമീപിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘സമീപിക്കുന്നവൻ’ ആരാധനാപരമായ സാധ്യത ഇല്ലാതാക്കാതെ ആ ചലനം വ്യക്തമായി നൽകുന്നു.
- source_word: ὅτι ἔστιν
  choice: ദൈവം ഉണ്ടെന്ന്
  rationale: സംക്ഷിപ്തമായ ഗ്രീക്ക് പ്രയോഗം ദൈവത്തിന്റെ യാഥാർഥ്യമായ അസ്തിത്വം ഉറപ്പിക്കുന്നു. സാധാരണ വായനക്കാർക്ക് നേരിട്ട് മനസ്സിലാകുന്ന രൂപമാണ് ‘ദൈവം ഉണ്ടെന്ന്’.
- source_word: τοῖς ἐκζητοῦσιν αὐτὸν
  choice: തന്നെ ഉത്സാഹപൂർവം അന്വേഷിക്കുന്നവർക്ക്
  rationale: ἐκζητέω സാധാരണ അന്വേഷിക്കലിനെക്കാൾ തീവ്രമായോ ആത്മാർഥമായോ അന്വേഷിക്കൽ സൂചിപ്പിക്കാം; ‘ഉത്സാഹപൂർവം’ ആ ഊന്നൽ മലയാളത്തിൽ നൽകുന്നു.
- source_word: μισθαποδότης γίνεται
  choice: പ്രതിഫലം നൽകുന്നവനാണ്
  rationale: μισθαποδότης പ്രതിഫലം നൽകുന്നവനെ സൂചിപ്പിക്കുന്നു. γίνεται അക്ഷരാർഥത്തിൽ ‘ആകുന്നു/ആയിത്തീരുന്നു’ എന്നായിരിക്കാമെങ്കിലും, ഈ വിധേയപ്രയോഗത്തിൽ അന്വേഷിക്കുന്നവർക്ക് ദൈവം എങ്ങനെയുള്ളവനായി വെളിപ്പെടുന്നു എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ ‘ആണ്’ എന്നു നൽകി; ഗ്രീക്കിലെ രൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
theological_decisions:
- issue: πίστις എന്ന ദൈവശാസ്ത്രപ്രാധാന്യമുള്ള പദത്തിന്റെ വിവർത്തനം
  choice: വിശ്വാസം
  alternative: ആശ്രയം; വിശ്വസ്തത
  rationale: ഈ വാക്യത്തിലെ πιστεῦσαι എന്ന വിശദീകരണം ദൈവത്തെ വിശ്വസിക്കുന്നതിലേക്കാണ് വിരൽചൂണ്ടുന്നത്. ‘വിശ്വാസം’ സ്ഥാപിതവും വിശാലവുമായ പദമാണ്; പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ നിർവചനം അതിൽ ചുമത്തുന്നില്ല.
- issue: ὅτι ἔστιν എന്നതിന്റെ സംക്ഷിപ്തത
  choice: ദൈവം ഉണ്ടെന്ന്
  alternative: അവിടന്ന് ആകുന്നു എന്ന്
  rationale: ഗ്രീക്ക് രൂപത്തിന്റെ സംക്ഷിപ്തതയ്ക്ക് ഒന്നിലധികം ഭാഷാന്തരസാധ്യതയുണ്ടെങ്കിലും, സന്ദർഭത്തിൽ ദൈവത്തിന്റെ അസ്തിത്വമാണ് നേരിട്ടുള്ള അർഥം. കൂടുതൽ അക്ഷരാർഥമുള്ള സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- issue: γίνεται ദൈവത്തിന്റെ സ്വഭാവവുമായി ബന്ധപ്പെടുത്തി എങ്ങനെ നൽകണം
  choice: പ്രതിഫലം നൽകുന്നവനാണ്
  alternative: പ്രതിഫലം നൽകുന്നവനാകുന്നു; പ്രതിഫലം നൽകുന്നവനായി വെളിപ്പെടുന്നു
  rationale: ‘ആയിത്തീരുന്നു’ എന്നു മാത്രം നൽകിയാൽ ദൈവത്തിന്റെ സ്വഭാവത്തിൽ മാറ്റം സംഭവിക്കുന്നു എന്ന അനാവശ്യ ധാരണ മലയാളത്തിൽ ഉണ്ടാകാം. സന്ദർഭത്തിൽ അന്വേഷിക്കുന്നവരോടുള്ള ദൈവത്തിന്റെ നിലപാടാണ് പ്രസ്താവിക്കുന്നത്; അതിനാൽ സ്വാഭാവികമായ പ്രധാനവായന നൽകി, ഗ്രീക്കിലെ യഥാർഥ ക്രിയാഭാവം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ദൈവത്തെ സൂചിപ്പിക്കാൻ ആദരസൂചകമായ ‘അവിടന്ന്’ ഉപയോഗിച്ചു. സാങ്കേതിക ദൈവശാസ്ത്രഭാഷയും അതിപുരാതനമായ വാക്യഘടനയും ഒഴിവാക്കി; എന്നാൽ മൂലത്തിലെ അനിവാര്യത, വിശ്വാസം, സമീപിക്കൽ, ഉത്സാഹപൂർവമായ അന്വേഷണം, പ്രതിഫലം എന്നീ ആശയങ്ങൾ നിലനിർത്തി.
