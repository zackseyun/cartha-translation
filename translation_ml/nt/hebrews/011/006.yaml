    rationale: ‘അവിടന്ന് ആകുന്നു എന്ന്’ മലയാളത്തിൽ വ്യാകരണപരമായും ശൈലീപരമായും കൃത്രിമമാണ്. ഗ്രീക്കിന്റെ സംക്ഷിപ്തത സൂചിപ്പിച്ചുകൊണ്ട് ‘അവിടന്ന് ഉണ്ട് എന്ന്’ എന്ന് നൽകാം.
  revised_text: വിശ്വാസം[a] കൂടാതെ ദൈവത്തെ പ്രസാദിപ്പിക്കുക അസാധ്യമാണ്. കാരണം, ദൈവത്തെ സമീപിക്കുന്നവർ ദൈവം ഉണ്ടെന്നും[b] ദൈവത്തെ ആത്മാർഥമായി അന്വേഷിക്കുന്നവർക്ക് അവിടന്ന് പ്രതിഫലം നൽകുന്നവനാണെന്നും[c] വിശ്വസിക്കണം.
