  source_fidelity: 'മുഖ്യവാക്യം ഗ്രീക്കിന്റെ ഘടനയും അർഥവും മിക്കവാറും കൃത്യമായി നൽകുന്നു: വിശ്വാസമില്ലാതെ പ്രസാദിപ്പിക്കാനാവില്ല; ദൈവത്തെ സമീപിക്കുന്നവർ ദൈവത്തിന്റെ അസ്തിത്വവും അവിടന്ന് അന്വേഷിക്കുന്നവർക്ക് പ്രതിഫലം നൽകുന്നവനാണെന്നും വിശ്വസിക്കണം. γίνομαι-യുടെ സന്ദർഭോചിതമായ ‘ആണ്’ എന്ന മുഖ്യവായന സ്വീകാര്യമാണ്; അതിന്റെ കൂടുതൽ അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കാം.'
  naturalness: ‘തന്നെ ഉത്സാഹപൂർവം അന്വേഷിക്കുന്നവർ’ എന്ന പ്രയോഗം അല്പം അസ്വാഭാവികമാണ്. ‘ഉത്സാഹപൂർവം’ ഇവിടെ ἐκζητέω-യുടെ ആത്മാർഥ/തീവ്ര അന്വേഷണത്തെക്കാൾ ആവേശത്തെയാണു കൂടുതൽ സൂചിപ്പിക്കുന്നത്. ‘ദൈവത്തെ ആത്മാർഥമായി അന്വേഷിക്കുന്നവർ’ സ്വാഭാവികവും കൂടുതൽ യോജിച്ചതുമാണ്. അടിക്കുറിപ്പ് b-യിലെ ‘അവിടന്ന് ആകുന്നു എന്ന്’ ആധുനിക മാനകമലയാളത്തിൽ സ്വാഭാവികമല്ല.
  terminology: ‘വിശ്വാസം,’ ‘പ്രസാദിപ്പിക്കുക,’ ‘സമീപിക്കുന്നവർ,’ ‘ആത്മാർഥമായി അന്വേഷിക്കുന്നവർ,’ ‘പ്രതിഫലം നൽകുന്നവൻ’ എന്നിവ വ്യക്തവും ഉചിതവുമാണ്. ‘അവിടന്ന്’ എന്ന ആദരസൂചക പ്രയോഗം രജിസ്റ്ററിനൊത്തതാണ്.
  issues:
