    issue: ἐκζητοῦσιν-ന്റെ മലയാള രൂപം
    rationale: ‘ഉത്സാഹപൂർവം അന്വേഷിക്കുന്നവർ’ എന്നത് ‘enthusiastically’ എന്ന ഭാവത്തിലേക്കു വഴുതാം. ἐκζητέω ഇവിടെ ആത്മാർഥമായ/തീവ്രമായ അന്വേഷിക്കലിനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ആത്മാർഥമായി’ കൂടുതൽ കൃത്യവും സ്വാഭാവികവുമാണ്.
  - severity: low
