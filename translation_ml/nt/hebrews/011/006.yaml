  revision_rationale: മുഖ്യതിരുത്തൽ ἐκζητέω-യുടെ തീവ്ര/ആത്മാർഥ ഭാവം ആധുനിക സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നതിനാണ്. ‘തന്നെ’ എന്ന സർവനാമത്തിന്റെ സാധ്യമായ അസ്പഷ്ടതയും നീക്കി, വാക്യത്തിന്റെ പ്രവാഹം മെച്ചപ്പെടുത്തി. അടിക്കുറിപ്പ് b-യിലെ കൃത്രിമമായ അക്ഷരാർഥബദൽ സ്വാഭാവികമായ രൂപത്തിൽ തിരുത്തി. മറ്റെല്ലാ അർഥഘടകങ്ങളും, അടിക്കുറിപ്പ് ആങ്കറുകളും, γίγνεται-യുടെ വ്യാഖ്യാനസാധ്യതയും നിലനിർത്തിയിരിക്കുന്നു.
