lexical_decisions:
- source_word: ἐν ταύτῃ
  choice: ഇതിലൂടെ
  rationale: സ്ത്രീലിംഗ ഏകവചനമായ ഈ സർവനാമം മുൻവാക്യത്തിലെ πίστις (‘വിശ്വാസം’) എന്ന പദത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ ἐν ഉപാധിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഇതിലൂടെ’ എന്നത് ഗ്രീക്കിന്റെ അർഥവും മലയാളത്തിന്റെ സ്വാഭാവികതയും നിലനിർത്തുന്നു.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ വിശ്വാസത്തെക്കുറിച്ചുള്ള പ്രസ്താവനയ്ക്ക് വിശദീകരണം നൽകുന്ന ബന്ധം സംക്ഷിപ്തമായും സ്വാഭാവികമായും പ്രകടമാക്കുന്നു.
- source_word: ἐμαρτυρήθησαν
  choice: അംഗീകാരം ലഭിച്ചു
  rationale: μαρτυρέω എന്ന ക്രിയയുടെ ഭൂതകാല കർമണിപ്രയോഗം ഇവിടെ അനുകൂലമായ സാക്ഷ്യമോ പ്രശംസയോ ലഭിച്ചതിനെ സൂചിപ്പിക്കുന്നു. ‘അംഗീകാരം ലഭിച്ചു’ എന്നത് കർമണിഭാവവും അനുകൂല വിലയിരുത്തലും സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: οἱ πρεσβύτεροι
  choice: പൂർവികർ
  rationale: ഇവിടെ ഈ പദം സഭയിലെ ഔദ്യോഗിക ‘മൂപ്പന്മാരെ’ അല്ല, മുൻതലമുറകളിലെ വിശ്വാസികളെ പൊതുവായി സൂചിപ്പിക്കുന്നു. ‘പൂർവികർ’ ഈ സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു; കൂടുതൽ പദാനുപദമായ സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ταύτῃ എന്നതിന്റെ സൂചിതപദം
  choice: മുൻവാക്യത്തിൽ പറഞ്ഞ വിശ്വാസത്തെയാണ് പ്രധാനമായി സൂചിപ്പിക്കുന്നതായി വായിക്കാവുന്ന ‘ഇതിലൂടെ’
  alternative: മുൻവാക്യത്തിൽ വിവരിച്ച യാഥാർഥ്യത്തെ കൂടുതൽ വിശാലമായി സൂചിപ്പിക്കുന്ന ‘ഇതിൽ’
  rationale: സ്ത്രീലിംഗ ഏകവചനം πίστις എന്ന പദവുമായി നേരിട്ട് പൊരുത്തപ്പെടുകയും അധ്യായത്തിന്റെ വാദഗതി വിശ്വാസത്തെ ഉപാധിയായി അവതരിപ്പിക്കുകയും ചെയ്യുന്നു. എന്നാൽ മുഖ്യപാഠത്തിലെ ‘ഇത്’ എന്ന സർവനാമം ഗ്രീക്കിലെ സൂചനാരൂപം നിലനിർത്തുന്നതിനാൽ വിശാലമായ വായന പൂർണമായി അടച്ചുകളയുന്നില്ല.
- issue: അംഗീകാരം നൽകുന്നവന്റെ വ്യക്തിത്വം
  choice: പ്രവർത്തകനെ മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കാതെ കർമണിപ്രയോഗം നിലനിർത്തി
  alternative: ‘ദൈവത്തിന്റെ അംഗീകാരം ലഭിച്ചു’ എന്ന് പ്രവർത്തകനെ വ്യക്തമാക്കുക
  rationale: അധ്യായത്തിന്റെ സന്ദർഭം ദൈവിക അംഗീകാരത്തെ ശക്തമായി സൂചിപ്പിക്കുന്നുവെങ്കിലും ഈ വാക്യത്തിലെ ഗ്രീക്ക് പാഠം പ്രവർത്തകനെ നേരിട്ട് പറയുന്നില്ല. അതിനാൽ വിവർത്തനം അതിനെ ചേർക്കാതെ യഥാർഥമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മൂപ്പന്മാർ’ എന്ന പദം ആധുനിക സഭാപദവിയായി തെറ്റിദ്ധരിക്കപ്പെടാൻ സാധ്യതയുള്ളതിനാൽ സന്ദർഭോചിതമായ ‘പൂർവികർ’ മുഖ്യപാഠത്തിൽ ഉപയോഗിച്ചു. ഗ്രീക്കിലെ കർമണിപ്രയോഗവും ταύτῃ എന്നതിലെ സൂചനാത്മക തുറന്ന നിലയും പരമാവധി സംരക്ഷിച്ചു.
