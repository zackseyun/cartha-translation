revisions:
- from: ദൈവം നമ്മെ കണക്കിലെടുത്ത് അതിലും മെച്ചമായ ഒന്ന് മുൻകൂട്ടി ഒരുക്കിയിരുന്നു[a]. അതുകൊണ്ട്, നമ്മെ കൂടാതെ അവർ പൂർണതയിൽ എത്തരുതെന്നായിരുന്നു ദൈവത്തിന്റെ ഉദ്ദേശ്യം[b].
  to: ദൈവം നമുക്കുവേണ്ടി മെച്ചമായ എന്തോ മുൻകൂട്ടി ഒരുക്കിയിരുന്നു[a], അവർ നമ്മെ കൂടാതെ പൂർണരാക്കപ്പെടാതിരിക്കേണ്ടതിന്[b].
