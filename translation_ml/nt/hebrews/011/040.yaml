id: HEB.11.40
reference: Hebrews 11:40
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῦ θεοῦ περὶ ἡμῶν κρεῖττόν τι προβλεψαμένου, ἵνα μὴ χωρὶς ἡμῶν τελειωθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/040.yaml
  text: since God had provided something better for us[b][a], so that they would not be made perfect apart from us.
translation:
  language: ml
  text: ദൈവം നമുക്കുവേണ്ടി മെച്ചമായ എന്തോ മുൻകൂട്ടി ഒരുക്കിയിരുന്നു[a], അവർ നമ്മെ കൂടാതെ പൂർണരാക്കപ്പെടാതിരിക്കേണ്ടതിന്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദൈവം നമുക്കുവേണ്ടി മെച്ചമായ എന്തോ മുൻകൂട്ടി കണ്ടിരുന്നു.” ഗ്രീക്ക് പദത്തിന് മുൻകൂട്ടി കാണുക എന്നോ മുൻകൂട്ടി ഒരുക്കുക എന്നോ അർഥമാകാം; ഈ സന്ദർഭം ദൈവത്തിന്റെ ഒരുക്കത്തെയോ പദ്ധതിയെയോ കൂടുതൽ പിന്തുണയ്ക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അവർ നമ്മെ കൂടാതെ പൂർണരാക്കപ്പെടാതിരിക്കേണ്ടതിന്” അല്ലെങ്കിൽ “അവർ നമ്മെ കൂടാതെ പൂർത്തീകരിക്കപ്പെടാതിരിക്കേണ്ടതിന്.”
    reason: alternative_reading
lexical_decisions:
- source_word: προβλεψαμένου
  choice: മുൻകൂട്ടി ഒരുക്കിയിരുന്നു
  rationale: ക്രിയാരൂപത്തിൽ മുൻകൂട്ടിയുള്ള ദർശനത്തിന്റെയും കരുതലോടെയുള്ള ഒരുക്കത്തിന്റെയും അർഥസാധ്യതയുണ്ട്. സന്ദർഭത്തിൽ ദൈവത്തിന്റെ മുൻകൂട്ടിയുള്ള ക്രമീകരണം മുൻനിൽക്കുന്നതിനാൽ ഈ പ്രയോഗം തിരഞ്ഞെടുത്തു; മറ്റൊരു അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: κρεῖττόν τι
  choice: അതിലും മെച്ചമായ ഒന്ന്
  rationale: എബ്രായലേഖനത്തിൽ ആവർത്തിക്കുന്ന ‘മെച്ചമായ’ എന്ന താരതമ്യപ്രമേയം നിലനിർത്തുന്നു. ‘ഒന്ന്’ എന്നത് അനിശ്ചിതസർവനാമമായ τιയെ സ്വാഭാവിക മലയാളത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു; ‘അതിലും’ മുൻവാക്യത്തിലെ സാഹചര്യവുമായി താരതമ്യം വ്യക്തമാക്കുന്നു.
- source_word: περὶ ἡμῶν
  choice: നമ്മെ കണക്കിലെടുത്ത്
  rationale: περίയുടെ ‘നമ്മെ സംബന്ധിച്ച്/നമ്മെ മുന്നിൽ കണ്ടുകൊണ്ട്’ എന്ന ബന്ധസൂചന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; വെറും ഗുണഭോക്തൃസൂചനയായി മാത്രം ചുരുക്കുന്നില്ല.
- source_word: ἵνα μὴ
  choice: എത്തരുതെന്നായിരുന്നു ദൈവത്തിന്റെ ഉദ്ദേശ്യം
  rationale: ἵνα μήയുടെ ഉദ്ദേശ്യബലം വ്യക്തമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു. ഗ്രീക്കിൽ ഇതിനകം സൂചിപ്പിക്കപ്പെട്ട കർത്താവായ ദൈവത്തെ ആവർത്തിക്കുന്നത് മലയാളത്തിൽ വാക്യബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: χωρὶς ἡμῶν
  choice: നമ്മെ കൂടാതെ
  rationale: ‘നമ്മിൽനിന്ന് വേർപെട്ട്’ എന്നും മനസ്സിലാക്കാവുന്ന, കൂട്ടായ പൂർത്തീകരണത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക പ്രയോഗം.
- source_word: τελειωθῶσιν
  choice: പൂർണതയിൽ എത്തുക
  rationale: τελειόωയുടെ പൂർത്തീകരണം, പൂർണത എന്നീ രണ്ടുതലങ്ങളും നിലനിർത്തുന്നു; അതിനെ ധാർമിക കുറ്റമറ്റത്വമായി മാത്രം ചുരുക്കുന്നില്ല.
- source_word: τοῦ θεοῦ
  choice: ദൈവം
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് ഘടന മലയാളത്തിൽ സ്വതന്ത്ര കാരണ/പശ്ചാത്തലവാക്യമായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: എബ്രായലേഖനത്തിന്റെ രക്ഷാചരിത്രപരമായ സന്ദർഭത്തിൽ τελειωθῶσιν എന്നതിന്റെ അർഥം
  choice: ‘പൂർണതയിൽ എത്തുക’ എന്ന പ്രയോഗത്തിലൂടെ പൂർണതയുടെയും പൂർത്തീകരണത്തിന്റെയും അർഥങ്ങൾ ഒരുമിച്ച് നിലനിർത്തി.
  alternative: ‘പൂർണരാക്കപ്പെടുക’ അല്ലെങ്കിൽ ‘പൂർത്തീകരിക്കപ്പെടുക’
  rationale: ഈ പദം എബ്രായലേഖനത്തിൽ പൂർത്തീകരണം, ദൈവസന്നിധിയിലേക്കുള്ള പ്രവേശനം, അന്തിമനിവൃത്തി എന്നിവയുമായി ബന്ധപ്പെട്ട സമ്പന്നമായ ദൈവശാസ്ത്രബലം വഹിക്കുന്നു. വിവർത്തനം അതിനെ ധാർമിക പൂർണതയായോ കാലക്രമപരമായ പൂർത്തീകരണമായോ മാത്രം പരിമിതപ്പെടുത്തുന്നില്ല.
- issue: προβλέπω എന്ന പദത്തിൽ മുൻകാഴ്ചയോ മുൻകരുതലോടെയുള്ള ഒരുക്കമോ
  choice: പ്രധാനപാഠത്തിൽ ദൈവത്തിന്റെ മുൻകൂട്ടിയുള്ള ഒരുക്കം സ്വീകരിച്ചു.
  alternative: ‘മുൻകൂട്ടി കണ്ടിരുന്നു’
  rationale: രണ്ടു സാധ്യതകളും ഭാഷാപരമായി സത്യസന്ധമായി നിലനിർത്തണം. എന്നാൽ വിശ്വാസികളുടെ സംയുക്ത പൂർണതയെ ദൈവം ക്രമീകരിച്ചുവെന്ന സന്ദർഭം ‘ഒരുക്കിയിരുന്നു’ എന്ന അർഥത്തെ കൂടുതൽ പിന്തുണയ്ക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ദീർഘമായ ഗ്രീക്ക് വാക്യഘടന വായനാസൗകര്യത്തിനായി രണ്ട് മലയാളവാക്യങ്ങളാക്കി. ‘പൂർണത’ എന്ന പദം ദൈവശാസ്ത്രപരമായ സാന്ദ്രത നിലനിർത്തുമ്പോഴും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാണ്. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
