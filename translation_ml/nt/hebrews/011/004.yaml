id: HEB.11.4
reference: Hebrews 11:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Πίστει πλείονα θυσίαν Ἅβελ παρὰ Κάϊν προσήνεγκεν τῷ θεῷ, δι’ ἧς ἐμαρτυρήθη εἶναι δίκαιος, μαρτυροῦντος ἐπὶ τοῖς δώροις αὐτοῦ ⸂τοῦ θεοῦ⸃, καὶ δι’ αὐτῆς ἀποθανὼν ἔτι ⸀λαλεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/004.yaml
  text: By faith Abel offered to God a better sacrifice than Cain[a], through which he was attested as righteous, God testifying concerning his gifts; and through it, though he died[d][c][b], he still speaks.
translation:
  language: ml
  text: വിശ്വാസത്താൽ ഹാബെൽ കയീനെക്കാൾ ശ്രേഷ്ഠമായ ഒരു യാഗം ദൈവത്തിന് അർപ്പിച്ചു.[a] അതിലൂടെ അവൻ നീതിമാനാണെന്ന സാക്ഷ്യം ലഭിച്ചു;[b] ദൈവം അവന്റെ വഴിപാടുകളെക്കുറിച്ച് സാക്ഷ്യം നൽകി. അതിലൂടെ,[c] മരിച്ചിട്ടും അവൻ ഇന്നും സംസാരിക്കുന്നു.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ശ്രേഷ്ഠമായ ഒരു യാഗം’ എന്നതിന് ‘കൂടുതലായ ഒരു യാഗം’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ താരതമ്യരൂപം ഗുണമേന്മയെയോ അളവിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവൻ നീതിമാനാണെന്ന് സാക്ഷ്യപ്പെടുത്തപ്പെട്ടു’ അല്ലെങ്കിൽ ‘അവൻ നീതിമാനായി അംഗീകരിക്കപ്പെട്ടു.’
    reason: lexical_alternative
  - marker: c
    text: ‘അതിലൂടെ’ എന്നത് ഹാബെലിന്റെ വിശ്വാസത്തെയോ അവന്റെ യാഗത്തെയോ സൂചിപ്പിക്കാം; ഗ്രീക്ക് വാക്യം ഇത് പൂർണമായി വ്യക്തമാക്കുന്നില്ല.
    reason: alternative_reading
  - marker: d
    text: ‘മരിച്ച ശേഷവും അവൻ ഇന്നും സംസാരിക്കുന്നു’ എന്നും ഈ വാക്യഭാഗം പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστει
  choice: വിശ്വാസത്താൽ
  rationale: ഉപാധി അഥവാ മാർഗം സൂചിപ്പിക്കുന്ന ദത്തിവ്; എബ്രായർ 11-ന്റെ പശ്ചാത്തലത്തിൽ മനുഷ്യന്റെ ദൈവാശ്രയമായ വിശ്വാസമാണ് പ്രധാന ആശയം.
- source_word: πλείονα θυσίαν
  choice: ശ്രേഷ്ഠമായ ഒരു യാഗം
  rationale: താരതമ്യരൂപം ഗുണമേന്മയെയോ അളവിനെയോ സൂചിപ്പിക്കാം. സന്ദർഭത്തിൽ ഗുണപരമായ മേന്മ സ്വാഭാവികമായതിനാൽ ‘ശ്രേഷ്ഠമായ’ എന്നു മുഖ്യപാഠത്തിൽ നൽകി; ‘കൂടുതലായ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: παρὰ Κάϊν
  choice: കയീനെക്കാൾ
  rationale: താരതമ്യത്തോടുകൂടിയ παρά താരതമ്യത്തിന്റെ മാനദണ്ഡം വ്യക്തമാക്കുന്നു.
- source_word: προσήνεγκεν τῷ θεῷ
  choice: ദൈവത്തിന് അർപ്പിച്ചു
  rationale: προσφέρω യാഗസംബന്ധമായ സന്ദർഭത്തിൽ ‘അർപ്പിക്കുക’ എന്നത് സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: δι’ ἧς
  choice: അതിലൂടെ
  rationale: സ്ത്രീലിംഗ ആപേക്ഷിക സർവനാമം ഏറ്റവും സ്വാഭാവികമായി θυσίαν (‘യാഗം’) എന്നതിലേക്കാണ് മടങ്ങുന്നത്.
- source_word: ἐμαρτυρήθη εἶναι δίκαιος
  choice: അവൻ നീതിമാനാണെന്ന സാക്ഷ്യം ലഭിച്ചു
  rationale: μαρτυρέω എന്ന ക്രിയയുടെ സാക്ഷ്യഭാവം നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായ കർമണിപ്രയോഗം നൽകുകയും ചെയ്യുന്നു.
- source_word: μαρτυροῦντος ἐπὶ τοῖς δώροις αὐτοῦ τοῦ θεοῦ
  choice: ദൈവം അവന്റെ വഴിപാടുകളെക്കുറിച്ച് സാക്ഷ്യം നൽകി
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് സ്വാഭാവികമായ അനുബന്ധവാക്യമായി നൽകി; യാഗസന്ദർഭത്തിൽ δῶρα എന്നതിന് ‘വഴിപാടുകൾ’ യോജിക്കുന്നു.
- source_word: δι’ αὐτῆς
  choice: അതിലൂടെത്തന്നെ
  rationale: സ്ത്രീലിംഗ സർവനാമത്തിന്റെ സൂചന വിശ്വാസത്തിലേക്കോ യാഗത്തിലേക്കോ ആകാം; ‘അത്’ എന്ന സർവനാമം ഈ അവ്യക്തത ഒരു പരിധിവരെ നിലനിർത്തുന്നു.
- source_word: ἀποθανὼν
  choice: മരിച്ചിട്ടും
  rationale: തുടർന്നും സംസാരിക്കുന്നു എന്ന ആശയത്തോടുള്ള വൈരുധ്യം വ്യക്തമാക്കുന്ന സ്വാഭാവിക concessive രൂപം.
- source_word: ἔτι λαλεῖ
  choice: ഇന്നും സംസാരിക്കുന്നു
  rationale: വർത്തമാനകാലത്തിലെ തുടരുന്ന പ്രസക്തി ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: അവസാനത്തെ δι’ αὐτῆς എന്നതിന്റെ സൂചന
  choice: ‘അതിലൂടെത്തന്നെ’ എന്ന് അവ്യക്തത നിലനിർത്തി
  alternative: ‘വിശ്വാസത്തിലൂടെ’ അല്ലെങ്കിൽ ‘യാഗത്തിലൂടെ’
  rationale: അധ്യായത്തിന്റെ പ്രമേയം വിശ്വാസമാണെങ്കിലും ഏറ്റവും അടുത്ത സ്ത്രീലിംഗ നാമം യാഗമാണ്. മൂലഭാഷ നിർണായകമായി തീർപ്പാക്കാത്തതിനാൽ മുഖ്യപാഠത്തിൽ ഒരു വ്യാഖ്യാനം മാത്രം ഉറപ്പിച്ചില്ല.
- issue: ἐμαρτυρήθη എന്നതിന്റെ ഭാവം
  choice: ‘സാക്ഷ്യം ലഭിച്ചു’ എന്ന സാക്ഷ്യഭാഷ
  alternative: ‘അംഗീകാരം ലഭിച്ചു’ അല്ലെങ്കിൽ ‘നീതിമാനെന്ന് സാക്ഷ്യപ്പെടുത്തപ്പെട്ടു’
  rationale: എബ്രായർ 11-ൽ ആവർത്തിക്കുന്ന സാക്ഷ്യത്തിന്റെ പ്രമേയം നിലനിർത്തുകയും ദൈവിക അംഗീകാരം എന്ന വ്യാഖ്യാനം മാത്രം അടിച്ചേൽപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘യാഗം’, ‘വഴിപാട്’, ‘നീതിമാൻ’, ‘സാക്ഷ്യം’ എന്നീ പരിചിത ബൈബിൾപദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന സ്വാഭാവികമാക്കി. ‘അതിലൂടെത്തന്നെ’ എന്ന പ്രയോഗവും അടിക്കുറിപ്പും ചേർന്ന് മൂലത്തിലെ സൂചനാവ്യക്തത സംരക്ഷിക്കുന്നു.
