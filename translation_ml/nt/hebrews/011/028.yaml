id: HEB.11.28
reference: Hebrews 11:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πίστει πεποίηκεν τὸ πάσχα καὶ τὴν πρόσχυσιν τοῦ αἵματος, ἵνα μὴ ὁ ὀλοθρεύων τὰ πρωτότοκα θίγῃ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/028.yaml
  text: By faith he has kept the Passover and the sprinkling of the blood[a], so that the destroyer of the firstborn might not touch them.
translation:
  language: ml
  text: വിശ്വാസത്താൽ അവൻ പെസഹ ആചരിക്കുകയും രക്തം തളിക്കുകയും ചെയ്തു[a]; ആദ്യജാതരെ സംഹരിക്കുന്നവൻ അവരെ തൊടാതിരിക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘രക്തം പുരട്ടുകയും ചെയ്തു.’ ഗ്രീക്കുപദം രക്തം ആചാരപരമായി പ്രയോഗിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. പെസഹാസന്ദർഭത്തിൽ വാതിൽപ്പടികളിലും മേൽപ്പടിയിലും രക്തം പുരട്ടുന്നതാണ് ഉദ്ദേശ്യം; ‘തളിക്കുക’ പരമ്പരാഗതമായ ആചാരപരമായ പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: വിശ്വാസത്താൽ
  rationale: ഉപാധി/മാർഗം സൂചിപ്പിക്കുന്ന ദത്തിവ്; എബ്രായർ 11-ൽ ആവർത്തിക്കുന്ന സൂത്രവാക്യത്തിന്റെ ഏകത നിലനിർത്തുന്നു.
- source_word: πεποίηκεν
  choice: ആചരിച്ചു
  rationale: ഇവിടെ ποιέω പെസഹാനുഷ്ഠാനം നിർവഹിച്ചതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ പൂർത്തിയായ പ്രവൃത്തിയെ സ്വാഭാവികമായി അറിയിക്കുന്ന പ്രയോഗമാണിത്.
- source_word: τὸ πάσχα
  choice: പെസഹ
  rationale: ഭക്ഷണത്തിൽ മാത്രം പരിമിതപ്പെടുത്താതെ പെസഹാചരണത്തെ മൊത്തമായി ഉൾക്കൊള്ളുന്ന പരമ്പരാഗതവും വ്യാപകമായി മനസ്സിലാകുന്നതുമായ പദം.
- source_word: τὴν πρόσχυσιν τοῦ αἵματος
  choice: രക്തം തളിക്കുന്ന അനുഷ്ഠാനം
  rationale: രക്തം ആചാരപരമായി ഇടുന്നതിനെ സൂചിപ്പിക്കുന്നു. പരമ്പരാഗതമായ ‘തളിക്കൽ’ നിലനിർത്തുമ്പോഴും ഇത് ഒരു അനുഷ്ഠാനമാണെന്നത് മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; പുറപ്പാട് 12-ന്റെ സാഹചര്യത്തിൽ ‘പുരട്ടൽ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἵνα μὴ
  choice: തൊടാതിരിക്കേണ്ടതിനായിരുന്നു അത്
  rationale: ഗ്രീക്കിലെ ഉദ്ദേശ്യാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὁ ὀλοθρεύων
  choice: സംഹരിക്കുന്നവൻ
  rationale: സുബstantival participle-ന്റെ അർഥം നിലനിർത്തുന്നു; ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത ‘ദൂതൻ’ എന്ന തിരിച്ചറിയൽ ചേർക്കുന്നില്ല.
- source_word: τὰ πρωτότοκα
  choice: ആദ്യജാതരെ
  rationale: ലിംഗനിർണ്ണയം കൂടാതെ substantival neuter plural-ന്റെ പൊതുവായ അർഥം നിലനിർത്തുന്നു.
- source_word: θίγῃ
  choice: തൊടാതിരിക്കുക
  rationale: സന്ദർഭത്തിൽ വിനാശകരമായ സ്പർശമാണെങ്കിലും, ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘തൊടുക’ നിലനിർത്തുന്നു.
- source_word: αὐτῶν
  choice: അവരെ
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തമായ സർവനാമപരാമർശം നിലനിർത്തുകയും ‘ഇസ്രായേല്യർ’ പോലുള്ള വിശദീകരണം മൂലവാക്യത്തിലേക്ക് ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: πεποίηκεν എന്ന ക്രിയയുടെ പരോക്ഷ കർത്താവ്
  choice: മുൻസന്ദർഭത്തിൽ പറയുന്ന മോശെയെ സൂചിപ്പിക്കുന്ന ‘അവൻ’ നിലനിർത്തി.
  alternative: ‘മോശെ’ എന്നു പേര് വ്യക്തമാക്കുക.
  rationale: എബ്രായർ 11:23–29-ലെ സന്ദർഭം കർത്താവ് മോശെയാണെന്ന് വ്യക്തമാക്കുന്നു; എന്നാൽ ഗ്രീക്കിലെ സർവനാമപരമായ അവതരണം നിലനിർത്തുന്നത് മൂലത്തോടു കൂടുതൽ അടുത്തതാണ്.
- issue: πίστις എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: വിശ്വാസം
  alternative: ആശ്രയം / വിശ്വസ്തത
  rationale: എബ്രായർ 11-ന്റെ അധ്യായവ്യാപകമായ പ്രമേയവും ആവർത്തിക്കുന്ന പ്രയോഗവും ഇവിടെ ‘വിശ്വാസം’ എന്ന അർഥത്തെ ശക്തമായി പിന്തുണയ്ക്കുന്നു.
- issue: ὁ ὀλοθρεύων എന്നതിന്റെ തിരിച്ചറിയൽ
  choice: സംഹരിക്കുന്നവൻ
  alternative: സംഹാരദൂതൻ
  rationale: മൂലഗ്രീക്ക് ‘ദൂതൻ’ എന്നു പറയുന്നില്ല; അതിനാൽ വ്യാഖ്യാനപരമായ തിരിച്ചറിയൽ മുഖ്യവാക്യത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പെസഹ’, ‘വിശ്വാസം’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തി; അസ്പഷ്ടമായ ദൂതപരമായ തിരിച്ചറിയലോ വിഭാഗീയ വ്യാഖ്യാനമോ ചേർത്തിട്ടില്ല.
