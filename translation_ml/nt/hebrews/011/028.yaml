  to: വിശ്വാസത്താൽ അവൻ പെസഹ ആചരിക്കുകയും രക്തം തളിക്കുകയും ചെയ്തു[a]; ആദ്യജാതരെ സംഹരിക്കുന്നവൻ അവരെ തൊടാതിരിക്കേണ്ടതിന്.
