  text: ἐλιθάσθησαν, ⸀ἐπρίσθησαν, ἐν φόνῳ ⸀μαχαίρης ἀπέθανον, περιῆλθον ἐν μηλωταῖς, ἐν αἰγείοις δέρμασιν, ὑστερούμενοι, θλιβόμενοι, κακουχούμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/037.yaml
  text: They were stoned[a], they were sawn in two, they died by the sword; they went about in sheepskins, in goatskins, destitute, afflicted, mistreated—
translation:
  language: ml
  text: അവർ കല്ലെറിയപ്പെട്ടു; അവർ ഈർച്ചവാളാൽ രണ്ടായി മുറിക്കപ്പെട്ടു; അവർ വാളാൽ വധിക്കപ്പെട്ടു[a]; അവർ ചെമ്മരിയാടുകളുടെ തോൽവസ്ത്രങ്ങളും കോലാടുകളുടെ തോൽവസ്ത്രങ്ങളും ധരിച്ച്, ഇല്ലായ്മ അനുഭവിച്ചും പീഡിപ്പിക്കപ്പെട്ടും ദുഷ്പെരുമാറ്റം സഹിച്ചും അലഞ്ഞുനടന്നു—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “അവർ വാളിന്റെ വധത്തിൽ മരിച്ചു”; അല്ലെങ്കിൽ, “അവർ വാളാൽ മരിച്ചു.” φόνος എന്ന ഗ്രീക്ക് പദം ഹിംസാത്മകമായ വധത്തിന്റെ ആശയം ശക്തിപ്പെടുത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλιθάσθησαν
  choice: അവർ കല്ലെറിയപ്പെട്ടു
  rationale: λιθάζω എന്ന ക്രിയയുടെ ഭൂതകാല കർമണിരൂപം നേരിട്ട് നിലനിർത്തുന്നു; ഇവിടെ മരണത്തെ പ്രത്യേകം ചേർക്കാതെ ഗ്രീക്കിന്റെ രൂപവും രക്തസാക്ഷിത്വങ്ങളുടെ പട്ടികയും സംരക്ഷിക്കുന്നു.
- source_word: ἐπρίσθησαν
  choice: അവർ ഈർച്ചവാളാൽ രണ്ടായി അറുക്കപ്പെട്ടു
  rationale: πρίζω എന്നത് ഈർച്ചവാളുകൊണ്ട് അറുക്കുക എന്നാണ്; സന്ദർഭത്തിൽ ഉദ്ദേശിക്കപ്പെടുന്ന രണ്ടായി അറുക്കൽ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐν φόνῳ μαχαίρης ἀπέθανον
  choice: അവർ വാളാൽ ക്രൂരമായി കൊല്ലപ്പെട്ടു[a]
  rationale: ἀπέθανον അക്ഷരാർഥത്തിൽ ‘മരിച്ചു’ എന്നാണെങ്കിലും φόνος നൽകുന്ന ഹിംസാത്മകമായ വധത്തിന്റെ ശക്തി മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്താൻ ഈ പ്രയോഗം തെരഞ്ഞെടുത്തു. അടിക്കുറിപ്പിൽ കൂടുതൽ അക്ഷരാർഥപരമായ രൂപം നൽകുന്നു.
- source_word: περιῆλθον
  choice: അലഞ്ഞുനടന്നു
  rationale: സ്ഥലത്തുനിന്ന് സ്ഥലത്തേക്ക് സഞ്ചരിക്കുന്നതിന്റെ ഭാവം ഈ സന്ദർഭത്തിൽ ‘അലഞ്ഞുനടന്നു’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐν μηλωταῖς, ἐν αἰγείοις δέρμασιν
  choice: ചെമ്മരിയാടുകളുടെ തോലും കോലാടുകളുടെ തോലും ധരിച്ച്
  rationale: ഇവ തോൽകൊണ്ടുള്ള വസ്ത്രങ്ങളാണെന്ന അർഥം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു; സമാന്തര ഘടനയും നിലനിർത്തുന്നു.
- source_word: ὑστερούμενοι
  choice: ഇല്ലായ്മ അനുഭവിച്ചും
  rationale: അത്യാവശ്യ വസ്തുക്കളുടെ അഭാവത്തിലും ആവശ്യത്തിലുമാകുക എന്ന പങ്കാളിത്തരൂപത്തിന്റെ ആശയം ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: θλιβόμενοι
  choice: പീഡിപ്പിക്കപ്പെട്ടും
  rationale: സമ്മർദം, കഷ്ടം, പീഡനം എന്നിവ അനുഭവിക്കുക എന്ന കർമണി ആശയം സന്ദർഭോചിതമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: κακουχούμενοι
  choice: ദുഷ്പെരുമാറ്റം സഹിച്ചും
  rationale: ദോഷകരമായി പെരുമാറപ്പെടുക എന്ന അർഥം θλιβόμενοι-ൽനിന്ന് വേർതിരിച്ചുകൊണ്ട് വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: ἐν φόνῳ μαχαίρης എന്ന ഹിംസാത്മക മരണപ്രയോഗത്തിന്റെ ശക്തി
  choice: വാളാൽ ക്രൂരമായി കൊല്ലപ്പെട്ടു
  alternative: വാളാൽ മരിച്ചു
  rationale: φόνος എന്ന പദം വെറും ആയുധോപാധിയേക്കാൾ വധത്തിന്റെയും രക്തച്ചൊരിച്ചിലിന്റെയും ശക്തി ചേർക്കുന്നു. പ്രധാന പാഠത്തിൽ ആ ശക്തി നിലനിർത്തുകയും അക്ഷരാർഥപരമായ ലളിതരൂപം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. തുടർച്ചയായ കർമണിക്രിയകളുടെയും പങ്കാളിത്തരൂപങ്ങളുടെയും പട്ടിക വ്യക്തമാക്കാൻ അർധവിരാമങ്ങൾ ഉപയോഗിച്ചു; അടുത്ത വാക്യത്തിലേക്കുള്ള തുടർച്ച സൂചിപ്പിക്കാൻ അവസാനത്തിൽ ദീർഘരേഖ നിലനിർത്തി.
