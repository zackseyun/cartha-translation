id: HEB.11.32
reference: Hebrews 11:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ τί ἔτι λέγω; ἐπιλείψει ⸂με γὰρ⸃ διηγούμενον ὁ χρόνος περὶ Γεδεών, Βαράκ, ⸀Σαμψών, Ἰεφθάε, Δαυίδ τε καὶ Σαμουὴλ καὶ τῶν προφητῶν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/032.yaml
  text: And what more shall I say? For time would fail me if I were telling about Gideon[a], Barak, Samson, Jephthah, David, and also Samuel and the prophets,
translation:
  language: ml
  text: ഇനി ഞാൻ എന്താണു പറയുക? കാരണം, ഗിദെയോൻ, ബാരാക്, ശിംശോൻ, യിഫ്താഹ്, ദാവീദ്, കൂടാതെ ശമൂവേൽ, പ്രവാചകന്മാർ എന്നിവരെക്കുറിച്ച് വിവരിച്ചുപറയുകയാണെങ്കിൽ സമയം എനിക്കു തികയുകയില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: “ഞാൻ വിവരിച്ചുപറയുമ്പോൾ സമയം എനിക്കു തീർന്നുപോകും.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ τί ἔτι λέγω;
  choice: ഇനി ഞാൻ എന്തു പറയണം?
  rationale: ഇത് കൂടുതൽ ഉദാഹരണങ്ങളിലേക്കു നീങ്ങുന്ന ഒരു ആലങ്കാരിക ചോദ്യമാണ്. ‘ഇനി’ എന്നത് ἔτιയുടെ തുടർച്ചാഭാവവും ചോദ്യം പ്രസംഗത്തിന്റെ മുന്നോട്ടുള്ള ചലനവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐπιλείψει με γὰρ ὁ χρόνος
  choice: എനിക്ക് സമയം തികയുകയില്ല
  rationale: സമയം അപര്യാപ്തമാകും എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; γάρ സൂചിപ്പിക്കുന്ന വിശദീകരണബന്ധം വാക്യക്രമത്തിൽ വ്യക്തമാണ്.
- source_word: διηγούμενον
  choice: വിവരിച്ചുകൊണ്ടിരുന്നാൽ
  rationale: με എന്ന സർവനാമത്തോടു യോജിക്കുന്ന വർത്തമാനകാല മധ്യകൃദ്‌രൂപം തുടരുന്ന സാഹചര്യത്തെ സൂചിപ്പിക്കുന്നു. വ്യവസ്ഥാപരമായ ആലങ്കാരിക ഭാവം മലയാളത്തിലെ ‘-കൊണ്ടിരുന്നാൽ’ സംരക്ഷിക്കുന്നു.
- source_word: περὶ
  choice: കുറിച്ച്
  rationale: തുടർന്ന് പറയുന്ന വ്യക്തികളെയും സംഘത്തെയും വിവരണത്തിന്റെ വിഷയമായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: Γεδεών, Βαράκ, Σαμψών, Ἰεφθάε, Δαυίδ, Σαμουὴλ
  choice: ഗിദെയോൻ, ബാരാക്ക്, ശിംശോൻ, യിഫ്താഹ്, ദാവീദ്, ശമൂവേൽ
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ രൂപങ്ങളോട് ചേർന്ന വ്യക്തിനാമ ലിപ്യന്തരണങ്ങളാണ്.
- source_word: Δαυίδ τε καὶ Σαμουὴλ καὶ τῶν προφητῶν
  choice: ദാവീദ്, കൂടാതെ ശമൂവേലിനെയും പ്രവാചകന്മാരെയും
  rationale: τε καὶ എന്നതിന്റെ കൂട്ടിച്ചേർക്കൽഭാവം ‘കൂടാതെ’ എന്നതിലൂടെ നിലനിർത്തുന്നു; ശമൂവേലിനെയും പ്രവാചകന്മാരുടെ വിശാലസംഘത്തെയും അനാവശ്യമായി ഒന്നാക്കി വായിക്കുന്നില്ല.
theological_decisions:
- issue: സമയം തികയാത്തതിനെക്കുറിച്ചുള്ള പ്രസ്താവനയുടെ ആലങ്കാരിക സ്വഭാവം
  choice: തുടർന്നും വിശദമായി വിവരിച്ചാൽ സമയം തികയുകയില്ല എന്ന പ്രസംഗപരമായ അർഥം
  alternative: ‘സമയം എന്നെ വിട്ടുപോകും’ എന്ന കൂടുതൽ പദാനുപദമായ ഭാവം
  rationale: ഭാവികാല ക്രിയയും കൃദ്‌രൂപവും ചേർന്ന ഗ്രീക്ക് ഘടന, എഴുത്തുകാരന് അക്ഷരാർഥത്തിൽ ഒട്ടും സമയമില്ലെന്നല്ല, ഉദാഹരണങ്ങൾ ചുരുക്കുകയാണെന്നതാണ് സൂചിപ്പിക്കുന്നത്.
- issue: ദാവീദ്, ശമൂവേൽ, പ്രവാചകന്മാർ എന്നിവരുടെ ബന്ധവും ക്രമവും
  choice: ‘ദാവീദ്, കൂടാതെ ശമൂവേലിനെയും പ്രവാചകന്മാരെയും’
  alternative: ‘ദാവീദിനെയും ശമൂവേലിനെയും പ്രവാചകന്മാരെയും’
  rationale: τε καὶ എന്ന കൂട്ടിച്ചേർക്കൽ സൂക്ഷ്മത നിലനിർത്തുന്നു; അതേസമയം ശമൂവേലിന്റെ സ്ഥാനത്തെക്കുറിച്ച് പാഠം പറയുന്നതിലധികം ദൈവശാസ്ത്രപരമായ വർഗീകരണം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി ഉപയോഗിച്ചു. പേരുകൾ പരിചിതമായ മലയാള ബൈബിൾ രൂപങ്ങളിൽ നൽകി; വാക്യത്തിന്റെ ആലങ്കാരിക ചോദ്യഭാവവും സമയപരിമിതിയുടെ പ്രസംഗപരമായ ഊന്നലും നിലനിർത്തി.
