id: HEB.11.30
reference: Hebrews 11:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πίστει τὰ τείχη Ἰεριχὼ ⸀ἔπεσαν κυκλωθέντα ἐπὶ ἑπτὰ ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/030.yaml
  text: By faith the walls of Jericho fell after they had been encircled for seven days[a].
translation:
  language: ml
  text: വിശ്വാസത്താൽ യെരീഹോയുടെ മതിലുകൾ ഏഴു ദിവസം ചുറ്റപ്പെട്ട ശേഷം വീണു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വിശ്വാസം മുഖാന്തരം.’ ഗ്രീക്കിലെ ദത്തിവ് രൂപമായ πίστει ഉപാധിയെയോ രീതിയെയോ സൂചിപ്പിക്കാം; മുഖ്യപാഠം എബ്രായർ 11-ലെ പരിചിതമായ ആവർത്തനരീതി നിലനിർത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: വിശ്വാസത്താൽ
  rationale: πίστις എന്ന പദത്തിന്റെ ഏകവചന ദത്തിവ് ഇവിടെ ഉപാധിയെയോ രീതിയെയോ സൂചിപ്പിക്കാം. എബ്രായർ 11-ൽ ആവർത്തിക്കുന്ന സൂത്രവാക്യത്തിന്റെ താളവും സാധ്യതയുള്ള ഉപാധ്യർഥവും ‘വിശ്വാസത്താൽ’ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: τὰ τείχη
  choice: മതിലുകൾ
  rationale: τεῖχος സാധാരണയായി നഗരമതിലിനെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ ‘മതിലുകൾ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: Ἰεριχὼ
  choice: യെരീഹോയുടെ
  rationale: സ്ഥലനാമം മലയാളത്തിലെ പരിചിതമായ രൂപത്തിൽ നൽകി, മതിലുകളുമായുള്ള ബന്ധം സംബന്ധികാവിഭക്തിയിലൂടെ പ്രകടിപ്പിക്കുന്നു.
- source_word: ἔπεσαν
  choice: വീണു
  rationale: πίπτω എന്ന ക്രിയയുടെ ലളിതമായ ഭൂതകാല അർഥം നേരിട്ട് നൽകുന്നു; ‘തകർന്നുവീണു’ എന്നു പറയുന്നത് മൂലപദത്തേക്കാൾ കൂടുതൽ പ്രത്യേകത ചേർക്കും.
- source_word: κυκλωθέντα
  choice: ചുറ്റപ്പെട്ടശേഷം
  rationale: κυκλόω എന്ന ക്രിയയുടെ ഭൂതകാല നിഷ്ക്രിയ കൃദന്തരൂപം പ്രധാനക്രിയയ്ക്കുമുമ്പ് നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ആരാണ് ചുറ്റിയത് എന്ന് ഗ്രീക്ക് വാചകം ഇവിടെ തുറന്നുപറയാത്തതിനാൽ നിഷ്ക്രിയരൂപം നിലനിർത്തുന്നു.
- source_word: ἐπὶ ἑπτὰ ἡμέρας
  choice: ഏഴു ദിവസം
  rationale: ἐπί + accusative കാലദൈർഘ്യം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഏഴു ദിവസം ചുറ്റപ്പെട്ടശേഷം’ എന്ന ഘടന ആ ദൈർഘ്യം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: എബ്രായർ 11:30-ലെ πίστις എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: വിശ്വാസം
  alternative: വിശ്വസ്തത; ആശ്രയം
  rationale: എബ്രായർ 11-ലെ ആവർത്തിത സൂത്രവാക്യവും വിശ്വാസത്തിന്റെ മാതൃകകളെക്കുറിച്ചുള്ള സന്ദർഭവും കണക്കിലെടുത്ത് ‘വിശ്വാസം’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; മറ്റർഥങ്ങൾ ഇവിടെ നിർബന്ധമായി ചുമത്തിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘ചുറ്റപ്പെട്ടശേഷം’ എന്ന നിഷ്ക്രിയപ്രയോഗം ഗ്രീക്ക് വാചകത്തിലെ രൂപവും നിർവഹിച്ചവരെ തുറന്നുപറയാത്തതും സംരക്ഷിക്കുന്നു.
