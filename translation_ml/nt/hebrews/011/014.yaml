id: HEB.11.14
reference: Hebrews 11:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ γὰρ τοιαῦτα λέγοντες ἐμφανίζουσιν ὅτι πατρίδα ἐπιζητοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/014.yaml
  text: For those who say such things make it clear that they are seeking a homeland[a].
translation:
  language: ml
  text: കാരണം, ഇങ്ങനെയുള്ള കാര്യങ്ങൾ പറയുന്നവർ തങ്ങൾ ഒരു സ്വദേശം[a] തേടുകയാണെന്ന് വ്യക്തമാക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സ്വന്തം നാട്’ അല്ലെങ്കിൽ ‘ജന്മനാട്.’ അവർ പ്രത്യാശിച്ചിരുന്ന സ്വദേശം ആത്യന്തികമായി സ്വർഗീയമാണെന്ന് അടുത്ത വാക്യം വ്യക്തമാക്കുന്നു.
    reason: πατρίδα എന്ന പദത്തിന്റെ അർഥവ്യാപ്തിയും അടുത്ത വാക്യത്തിലെ സന്ദർഭവ്യക്തതയും അറിയിക്കാൻ.
lexical_decisions:
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തോടുള്ള വിശദീകരണബന്ധം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: τοιαῦτα
  choice: ഇങ്ങനെയുള്ള കാര്യങ്ങൾ
  rationale: മുൻസന്ദർഭത്തിൽ ഉദ്ധരിച്ച പ്രസ്താവനകളുടെ സ്വഭാവത്തിലേക്കു തിരിച്ചുചൂണ്ടുന്നു.
- source_word: λέγοντες
  choice: പറയുന്നവർ
  rationale: വർത്തമാനകാല കൃദന്തരൂപത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ ആപേക്ഷികപ്രയോഗമായി നൽകുന്നു.
- source_word: ἐμφανίζουσιν
  choice: വ്യക്തമാക്കുന്നു
  rationale: അവരുടെ വാക്കുകൾ ഒരു കാര്യം തെളിവായി വെളിപ്പെടുത്തുന്നു എന്ന ആശയം നൽകുന്നു.
- source_word: ὅτι
  choice: എന്ന്
  rationale: വ്യക്തമാക്കപ്പെടുന്ന ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന മലയാളത്തിലെ സ്വാഭാവിക ഘടന.
- source_word: πατρίδα
  choice: ഒരു സ്വദേശം
  rationale: ജന്മനാട്, സ്വന്തം നാട് എന്നീ അർഥസാധ്യതകൾ ഉൾക്കൊള്ളുന്ന, ഗൗരവമുള്ള ആധുനിക പ്രയോഗം; മൂലത്തിലെ അനിർദിഷ്ടതയും നിലനിർത്തുന്നു.
- source_word: ἐπιζητοῦσιν
  choice: തേടുകയാണെന്ന്
  rationale: വർത്തമാനകാലത്തിലെ തുടരുന്ന സജീവമായ അന്വേഷണത്തെ പ്രകടമാക്കുന്നു; വെറും ആഗ്രഹം എന്നതിലേക്കു ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: പിതാക്കന്മാർ തേടിയ πατρίς എന്താണെന്നത്
  choice: മുഖ്യവാക്യത്തിൽ ‘ഒരു സ്വദേശം’ എന്നു പൊതുവായി നിലനിർത്തി.
  alternative: ‘ഭൗമിക സ്വദേശം’ അല്ലെങ്കിൽ ‘സ്വർഗീയ സ്വദേശം’ എന്നു വ്യക്തമാക്കുക.
  rationale: ഈ വാക്യം മാത്രം സ്വദേശത്തെ ഭൗമികമോ സ്വർഗീയമോ എന്നു നിർണ്ണയിക്കുന്നില്ല; അടുത്ത വാക്യം അതിന്റെ അന്തിമ സ്വഭാവം വ്യക്തമാക്കുന്നു. അതിനാൽ വിശദീകരണം മുൻകൂട്ടി മുഖ്യവാക്യത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സ്വദേശം’ സാധാരണ വായനക്കാർക്കു ഗ്രാഹ്യമാകുന്നതിനോടൊപ്പം മൂലപദത്തിന്റെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യവാക്യത്തിൽ ചേർത്തിരിക്കുന്നു.
