revisions:
- from: ഈജിപ്തിലെ നിക്ഷേപങ്ങളെക്കാൾ വലിയ സമ്പത്തായി മശീഹയുടെ നിന്ദയെ അവൻ കണക്കാക്കി[a][b]; കാരണം, ലഭിക്കാനിരിക്കുന്ന പ്രതിഫലത്തിലായിരുന്നു അവന്റെ ദൃഷ്ടി.
  to: ഈജിപ്തിലെ നിക്ഷേപങ്ങളെക്കാൾ വലിയ സമ്പത്തായി മശീഹയുടെ നിന്ദയെ അവൻ കണക്കാക്കി[a][b]; കാരണം, അവൻ പ്രതിഫലത്തിലേക്കു നോക്കിക്കൊണ്ടിരുന്നു.
