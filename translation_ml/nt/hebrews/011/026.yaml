id: HEB.11.26
reference: Hebrews 11:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μείζονα πλοῦτον ἡγησάμενος τῶν Αἰγύπτου θησαυρῶν τὸν ὀνειδισμὸν τοῦ Χριστοῦ, ἀπέβλεπεν γὰρ εἰς τὴν μισθαποδοσίαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/026.yaml
  text: He considered the reproach of Messiah greater wealth than the treasures of Egypt[b][a], for he was looking to the reward.
translation:
  language: ml
  text: ഈജിപ്തിലെ നിക്ഷേപങ്ങളെക്കാൾ വലിയ സമ്പത്തായി മശീഹയുടെ നിന്ദയെ അവൻ കണക്കാക്കി[a][b]; കാരണം, അവൻ പ്രതിഫലത്തിലേക്കു നോക്കിക്കൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ക്രിസ്തുവിന്റെ നിന്ദയെ.’ ഗ്രീക്കിലെ Χριστοῦ എന്ന പദവി ‘ക്രിസ്തു’ എന്നും വിവർത്തനം ചെയ്യാം; ഇവിടെ അത് ഒരു പദവിയായി പ്രവർത്തിക്കുന്നതിനാൽ ‘മശീഹ’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: ‘മശീഹയുടെ നിന്ദ’ എന്നത് മശീഹയ്ക്കുവേണ്ടി സഹിച്ച നിന്ദയെയോ, ദൈവത്തിന്റെ അഭിഷിക്തനോടൊപ്പം പങ്കിട്ട നിന്ദയെയോ, മശീഹയിൽ പൂർത്തിയാകുന്നതായി എബ്രായർ കാണുന്ന നിന്ദയെയോ സൂചിപ്പിക്കാം. ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അവ്യക്തത ചുരുക്കാതെ നിലനിർത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: μείζονα πλοῦτον
  choice: വലിയ സമ്പത്തായി
  rationale: താരതമ്യപ്രയോഗത്തിന്റെ മൂല്യനിർണയഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ഈജിപ്തിലെ നിക്ഷേപങ്ങളുമായുള്ള താരതമ്യം ‘-യെക്കാൾ’ വ്യക്തമാക്കുന്നു.
- source_word: ἡγησάμενος
  choice: അവൻ കണക്കാക്കി
  rationale: ἡγέομαι എന്ന ക്രിയയുടെ ‘പരിഗണിക്കുക/വിലയിരുത്തുക’ എന്ന അർഥം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: τῶν Αἰγύπτου θησαυρῶν
  choice: ഈജിപ്തിലെ നിക്ഷേപങ്ങളെക്കാൾ
  rationale: ഈജിപ്തിനോടു ബന്ധപ്പെട്ട ധനശേഖരങ്ങളെ സൂചിപ്പിക്കുന്ന ജനിറ്റീവ് ബന്ധവും താരതമ്യഘടനയും വ്യക്തമായി നൽകുന്നു.
- source_word: τὸν ὀνειδισμὸν
  choice: നിന്ദയെ
  rationale: ὀνειδισμός സൂചിപ്പിക്കുന്ന പരസ്യമായ നിന്ദയും അപമാനവും സംക്ഷിപ്തമായി ഉൾക്കൊള്ളുന്ന സാധാരണ ബൈബിൾ-മലയാള പദമാണ്.
- source_word: τοῦ Χριστοῦ
  choice: മശീഹയുടെ
  rationale: Χριστός ഇവിടെ പേരിനേക്കാൾ അഭിഷിക്തൻ എന്ന പദവിയായി പ്രവർത്തിക്കുന്നു; അതിനാൽ ‘മശീഹ’ ഉപയോഗിച്ചു. ജനിറ്റീവിന്റെ ബന്ധം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: ἀπέβλεπεν
  choice: ദൃഷ്ടി ... ആയിരുന്നു
  rationale: ഇംപെർഫെക്റ്റ് ക്രിയ സൂചിപ്പിക്കുന്ന തുടർച്ചയായ ശ്രദ്ധയെയും അഭിമുഖതയെയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: μισθαποδοσίαν
  choice: ലഭിക്കാനിരിക്കുന്ന പ്രതിഫലം
  rationale: പദത്തിന്റെ പ്രതിഫലം/പ്രതിഫലദാനം എന്ന അർഥം നൽകുന്നു; സന്ദർഭത്തിലെ ഭാവിമുഖമായ പ്രതീക്ഷ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: മോശെയുമായി ബന്ധപ്പെട്ട ‘മശീഹയുടെ നിന്ദ’ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: ‘മശീഹയുടെ നിന്ദ’ എന്ന ജനിറ്റീവ് പ്രയോഗം വ്യാഖ്യാനവിപുലീകരണമില്ലാതെ നിലനിർത്തി.
  alternative: മശീഹയ്ക്കുവേണ്ടി സഹിച്ച നിന്ദ; ദൈവത്തിന്റെ അഭിഷിക്തനോടൊപ്പം പങ്കിട്ട നിന്ദ; മശീഹയിൽ പൂർത്തിയാകുന്നതായി എബ്രായർ കാണുന്ന നിന്ദ
  rationale: ഗ്രീക്ക് പ്രയോഗം ഈ ബന്ധത്തിന്റെ കൃത്യസ്വഭാവം നിർണയിക്കുന്നില്ല. അതിനാൽ ക്രിസ്തുശാസ്ത്രപരമായ സംഘർഷവും യഥാർഥ അവ്യക്തതയും വിവർത്തനം ചുരുക്കി പരിഹരിക്കുന്നില്ല.
- issue: Χριστοῦ എന്ന പദവിയുടെ വിവർത്തനം
  choice: മശീഹയുടെ
  alternative: ക്രിസ്തുവിന്റെ
  rationale: ഇവിടെ Χριστός അഭിഷിക്തനെ സൂചിപ്പിക്കുന്ന പദവിയായി പ്രവർത്തിക്കുന്നതിനാൽ ‘മശീഹ’ പ്രധാന പാഠത്തിൽ സ്വീകരിച്ചു; പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘നിന്ദ’, ‘സമ്പത്ത്’, ‘പ്രതിഫലം’ എന്നീ പൊതുവായി മനസ്സിലാകുന്ന പദങ്ങൾ ഉപയോഗിച്ചു. മുഖ്യവാക്യത്തിൽ മൂലത്തിലെ ജനിറ്റീവ് അവ്യക്തത സംരക്ഷിക്കുകയും വിശദീകരണം അടിക്കുറിപ്പുകളിലേക്ക് മാറ്റുകയും ചെയ്തു.
