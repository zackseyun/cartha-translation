id: HEB.11.11
reference: Hebrews 11:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πίστει καὶ ⸂αὐτῇ Σάρρᾳ⸃ δύναμιν εἰς καταβολὴν σπέρματος ἔλαβεν καὶ παρὰ καιρὸν ⸀ἡλικίας, ἐπεὶ πιστὸν ἡγήσατο τὸν ἐπαγγειλάμενον·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/011.yaml
  text: By faith even Sarah herself received power to conceive offspring[a], even beyond the proper time of life, because she considered the one who had promised to be faithful.
translation:
  language: ml
  text: വിശ്വാസത്താൽ സാറയ്ക്കുപോലും സന്തതിയെ ഗർഭം ധരിക്കാനുള്ള ശക്തി ലഭിച്ചു[a]. സാധാരണ പ്രസവപ്രായം കഴിഞ്ഞിട്ടും, വാഗ്ദാനം ചെയ്തവൻ വിശ്വസ്തനാണെന്ന് അവൾ കരുതിയതുകൊണ്ടാണ് അത് ലഭിച്ചത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: “വിത്ത് നിക്ഷേപിക്കുന്നതിനുള്ള ശക്തി ലഭിച്ചു.” ഗ്രീക്ക് പ്രയോഗം അസാധാരണവും ശൈലീപരവുമാണ്; സന്ദർഭത്തിൽ അത് സന്തതിയെ ഉൽപാദിപ്പിക്കാനുള്ള കഴിവിനെയാണ് സൂചിപ്പിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: വിശ്വാസത്താൽ
  rationale: എബ്രായർ 11-ൽ ആവർത്തിക്കുന്ന പ്രയോഗത്തിലെ ഉപാധി സൂചിപ്പിക്കുന്ന ദത്തിവാണ്; ‘വിശ്വാസത്താൽ’ എന്നത് അർത്ഥവും അധ്യായത്തിലെ ശൈലിബന്ധവും നിലനിർത്തുന്നു.
- source_word: καὶ αὐτῇ Σάρρᾳ
  choice: സാറയ്ക്കുതന്നെയും
  rationale: καὶ-യുടെ ഉൾപ്പെടുത്തൽഭാവവും αὐτῇ-യുടെ ഊന്നലും ഒരുമിച്ച് പ്രകടമാക്കുന്നു; സാറയെ ഈ വിശ്വാസസാക്ഷികളുടെ നിരയിലെ പ്രത്യേകം ഊന്നിപ്പറയുന്ന ഉദാഹരണമായി നിലനിർത്തുന്നു.
- source_word: δύναμιν ... ἔλαβεν
  choice: ശക്തി ലഭിച്ചു
  rationale: δύναμις എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർത്ഥബന്ധം കാത്തുകൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കാവുന്ന പ്രയോഗമാണിത്.
- source_word: εἰς καταβολὴν σπέρματος
  choice: സന്തതിയെ ഗർഭം ധരിക്കാനുള്ള
  rationale: അസാധാരണമായ ഈ ഗ്രീക്ക് ശൈലിയുടെ സന്ദർഭാർഥം സന്തത്യുൽപാദനത്തിനുള്ള കഴിവാണ്. സാറയാണ് വ്യാകരണപരമായ കർത്താവ് എന്ന വായനയ്ക്ക് അനുസൃതമായി സ്വാഭാവികമായ മലയാളം നൽകി; കൂടുതൽ പദാനുപദമായ രൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: καὶ παρὰ καιρὸν ἡλικίας
  choice: ജീവിതത്തിലെ അതിനുള്ള യോജിച്ച പ്രായം കഴിഞ്ഞിട്ടും
  rationale: παρὰ ഇവിടെ സാധാരണ പരിധിക്കപ്പുറം എന്ന ആശയവും καιρός യോജിച്ച സമയം എന്ന ആശയവും നൽകുന്നു. പ്രസവപ്രായം എന്ന് അതിവ്യക്തമാക്കാതെ സന്ദർഭം വായനക്കാരന് വ്യക്തമാക്കുന്നു.
- source_word: ἐπεὶ
  choice: '...തുകൊണ്ടാണ്'
  rationale: മുൻവാക്യത്തിലെ സംഭവത്തിന്റെ കാരണം വ്യക്തമായി ബന്ധിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള കാരണപ്രയോഗം.
- source_word: πιστὸν
  choice: വിശ്വസ്തൻ
  rationale: വാഗ്ദാനം ചെയ്തവന്റെ ആശ്രയയോഗ്യമായ സ്വഭാവത്തെ സൂചിപ്പിക്കുകയും പദത്തിന്റെ ദൈവശാസ്ത്രപരമായ ഭാരം അനാവശ്യ വ്യാഖ്യാനമില്ലാതെ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἡγήσατο
  choice: കരുതി
  rationale: ἡγέομαι എന്ന പദത്തിലെ വിലയിരുത്തി നിഗമനം ചെയ്യുന്ന അർത്ഥം സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τὸν ἐπαγγειλάμενον
  choice: വാഗ്ദാനം ചെയ്തവൻ
  rationale: ദൈവത്തെ സൂചിപ്പിക്കുന്ന substantival participle-ന്റെ ഘടനയും ഗൗരവവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: വാക്യഘടനാപരമായി ദുഷ്കരമായ ഭാഗത്തിലെ കർത്താവും സാറയുടെ പ്രവർത്തനത്തിന്റെ അർത്ഥവും
  choice: സാറയാണ് കർത്താവ്; സന്തതിയെ ഗർഭം ധരിക്കാനുള്ള ശക്തി അവൾക്കു ലഭിച്ചു.
  alternative: അബ്രാഹാം പരോക്ഷമായി ഉൾപ്പെട്ടിരിക്കുന്നതോ മുഖ്യനായിരിക്കുന്നതോ; അല്ലെങ്കിൽ ഒരു വംശം സ്ഥാപിക്കാനുള്ള ശക്തിയാണ് സാറയ്ക്കു ലഭിച്ചത്.
  rationale: ഈ പാഠരൂപത്തിൽ αὐτῇ Σάρρᾳ എന്നത് ἔλαβεν എന്ന ക്രിയയുടെ കർത്താവായി സാറയെ ഏറ്റവും സ്വാഭാവികമായി തിരിച്ചറിയിക്കുന്നു. καταβολὴ σπέρματος എന്ന പദപ്രയോഗം പദാനുപദമായി പുരുഷകേന്ദ്രിതമായി തോന്നാമെങ്കിലും, പ്രായം കഴിഞ്ഞ സാറയുടെ വിശ്വാസവും അത്ഭുതകരമായ ഗർഭധാരണവുമാണ് സന്ദർഭത്തിലെ ഊന്നൽ. അതിനാൽ മുഖ്യപാഠത്തിൽ സാറയെ കർത്താവായി നിലനിർത്തി, അസാധാരണമായ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകി.
- issue: ദൈവത്തെക്കുറിച്ചുള്ള πιστός എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: വിശ്വസ്തൻ
  alternative: ആശ്രയയോഗ്യൻ; വിശ്വസനീയൻ
  rationale: സാറയുടെ വിശ്വാസത്തിന് അടിസ്ഥാനം ദൈവത്തിന്റെ വാഗ്ദാനനിഷ്ഠമായ സ്വഭാവമാണെന്ന് വാക്യം പറയുന്നു. ‘വിശ്വസ്തൻ’ അതിന്റെ ദൈവശാസ്ത്രപരമായ ഗൗരവം അധിക ആശയം ചേർക്കാതെ കാത്തുസൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. ഗ്രീക്കിലെ ദീർഘവാക്യം മലയാളത്തിലെ വ്യക്തതയ്ക്കായി രണ്ട് വാക്യങ്ങളാക്കി; രണ്ടാം വാക്യത്തിലെ ‘അങ്ങനെ സംഭവിച്ചത്’ കാരണംബന്ധം വ്യക്തമാക്കുന്നു. സാറയെ കർത്താവായി നിലനിർത്തിയെങ്കിലും ഗ്രീക്ക് പദപ്രയോഗത്തിലെ യഥാർഥ അസാധാരണത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
