id: HEB.11.8
reference: Hebrews 11:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀Πίστει καλούμενος Ἀβραὰμ ὑπήκουσεν ἐξελθεῖν εἰς ⸀τόπον ὃν ἤμελλεν λαμβάνειν εἰς κληρονομίαν, καὶ ἐξῆλθεν μὴ ἐπιστάμενος ποῦ ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/008.yaml
  text: By faith Abraham[a], when called, obeyed to go out to a place that he was going to receive as an inheritance, and he went out not knowing where he was going.
translation:
  language: ml
  text: വിശ്വാസത്താൽ, പുറപ്പെടാൻ വിളിക്കപ്പെട്ടപ്പോൾ അബ്രാഹാം അനുസരിച്ചു; അവകാശമായി ലഭിക്കാനിരുന്ന ഒരു സ്ഥലത്തേക്കു അവൻ പുറപ്പെട്ടു. താൻ എവിടേക്കാണ് പോകുന്നതെന്ന് അറിയാതെയാണ് അവൻ പുറപ്പെട്ടത്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πίστει
  choice: വിശ്വാസത്താൽ
  rationale: ദാതിവ് ഇവിടെ മാർഗം/ഉപാധി സൂചിപ്പിക്കുന്നു. അബ്രാഹാമിന്റെ ദൈവാശ്രയമുള്ള പ്രതികരണത്തെ സന്ദർഭം ഊന്നുന്നതിനാൽ ‘വിശ്വാസത്താൽ’ സ്വാഭാവികവും പരമ്പരാഗതവുമായ തിരഞ്ഞെടുപ്പാണ്.
- source_word: καλούμενος
  choice: വിളിക്കപ്പെട്ടപ്പോൾ
  rationale: വർത്തമാനകാല കർമണി കൃദന്തത്തിന്റെ സാഹചര്യപരവും കാലസൂചകവുമായ ബലം നിലനിർത്തുന്നു; വിളിച്ചയാളെ മൂലപാഠംപോലെ വ്യക്തമാക്കാതെ വിടുന്നു.
- source_word: ὑπήκουσεν ἐξελθεῖν
  choice: പുറപ്പെടാൻ അനുസരിച്ചു
  rationale: ‘അനുസരിച്ചു’ എന്ന ക്രിയയോടു ചേർന്ന പൂരക അനന്തക്രിയയുടെ ബന്ധം നേരിട്ട് നിലനിർത്തുന്നു. മലയാളത്തിൽ അല്പം ഔപചാരികമാണെങ്കിലും വ്യക്തവും ഗ്രഹിക്കാവുന്നതുമാണ്.
- source_word: τόπον
  choice: ഒരു സ്ഥലത്തേക്ക്
  rationale: ലക്ഷ്യസ്ഥാനം ഇനിയും വ്യക്തമാക്കപ്പെട്ടിട്ടില്ലാത്തതിനാൽ അനിശ്ചിതമായ ‘ഒരു സ്ഥലം’ യോജിക്കുന്നു.
- source_word: ἤμελλεν λαμβάνειν εἰς κληρονομίαν
  choice: അവകാശമായി ലഭിക്കാനിരുന്ന
  rationale: μέλλω സൂചിപ്പിക്കുന്ന ഭാവിസംബന്ധം നിലനിർത്തുന്നു; ‘വിധിക്കപ്പെട്ടിരുന്നു’ എന്നതുപോലുള്ള അധിക ദൈവശാസ്ത്രഭാരം ഒഴിവാക്കുന്നു. κληρονομίαയെ ‘അവകാശം’ എന്നു സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐξῆλθεν
  choice: അവൻ പുറപ്പെട്ടു
  rationale: മുമ്പുള്ള ἐξελθεῖν എന്ന ക്രിയയുമായുള്ള എഴുത്തുകാരന്റെ ആവർത്തനം ‘പുറപ്പെടുക’ എന്ന ഒരേ പദത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: μὴ ἐπιστάμενος ποῦ ἔρχεται
  choice: താൻ എവിടേക്കാണു പോകുന്നതെന്ന് അറിയാതെയാണ്
  rationale: അറിവില്ലായ്മയും യാത്രയും ഒരേസമയം നടന്നുവെന്ന അനുബന്ധസാഹചര്യം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ἔρχεται ഇവിടെ ലക്ഷ്യത്തിലേക്കുള്ള സഞ്ചാരത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പോകുന്നത്’ എന്നു വിവർത്തനം ചെയ്യുന്നു.
theological_decisions:
- issue: πίστις എന്ന പദത്തിന്റെ അർഥം
  choice: വിശ്വാസം
  alternative: ആശ്രയം / വിശ്വസ്തത
  rationale: ഈ സന്ദർഭം അബ്രാഹാമിന്റെ വിശ്വസിച്ചുള്ള അനുസരണത്തെ മുൻനിർത്തുന്നു. ‘വിശ്വസ്തത’ എന്നു നൽകിയാൽ അവന്റെ സ്ഥിരമായ ഗുണത്തിന് അനാവശ്യമായ മുൻതൂക്കം ലഭിക്കാം; ‘വിശ്വാസം’ ആശ്രയവും പ്രതികരണവും ഉൾക്കൊള്ളുന്നു.
- issue: വിളിച്ച വ്യക്തിയുടെ തിരിച്ചറിയൽ
  choice: മൂലപാഠംപോലെ വ്യക്തമാക്കാതെ കർമണിപ്രയോഗം നിലനിർത്തി
  alternative: ദൈവം വിളിച്ചപ്പോൾ
  rationale: സന്ദർഭത്തിൽ വിളിച്ചത് ദൈവമാണെന്നു മനസ്സിലാകുന്നുവെങ്കിലും ഈ വാക്യത്തിൽ θεός ഇല്ല; അതിനാൽ പ്രധാനപാഠത്തിൽ അത് ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘പുറപ്പെടാൻ അനുസരിച്ചു’ എന്നത് ഉദ്ദേശപൂർവം അല്പം ഔപചാരികമായി നിലനിർത്തിയിരിക്കുന്നു; അതിന്റെ കൂടുതൽ സ്വാഭാവികമായ രൂപം അടിക്കുറിപ്പിൽ നൽകിയിട്ടുണ്ട്.
