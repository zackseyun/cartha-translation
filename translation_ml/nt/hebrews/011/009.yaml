id: HEB.11.9
reference: Hebrews 11:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πίστει παρῴκησεν εἰς γῆν τῆς ἐπαγγελίας ὡς ἀλλοτρίαν, ἐν σκηναῖς κατοικήσας μετὰ Ἰσαὰκ καὶ Ἰακὼβ τῶν συγκληρονόμων τῆς ἐπαγγελίας τῆς αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/009.yaml
  text: By faith he lived as a foreigner in the land of promise[a], as in a foreign land, dwelling in tents with Isaac and Jacob, fellow heirs of the same promise.
translation:
  language: ml
  text: വിശ്വാസത്താൽ അവൻ വാഗ്ദത്തദേശത്ത് അന്യദേശത്തിലെന്നപോലെ പരദേശിയായി പാർത്തു; അതേ വാഗ്ദത്തത്തിന്റെ കൂട്ടവകാശികളായ യിസ്ഹാക്കിനോടും യാക്കോബിനോടുംകൂടെ കൂടാരങ്ങളിൽ വസിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “വിശ്വാസത്താൽ അവൻ വാഗ്ദത്തദേശത്ത് ഒരു അന്യദേശത്തിലെന്നപോലെ പരദേശിയായി പാർത്തു; അതേ വാഗ്ദത്തത്തിന്റെ കൂട്ടവകാശികളായ യിസ്ഹാക്കിനോടും യാക്കോബിനോടുംകൂടെ കൂടാരങ്ങളിൽ വസിച്ചു.”'
    reason: ὡς ἀλλοτρίαν എന്ന പ്രയോഗം വാഗ്ദത്തദേശത്തെ ‘ഒരു അന്യദേശം’ എന്ന നിലയിൽ കാണുന്നതായും വിവർത്തനം ചെയ്യാം; ഇത് മൂലത്തിലെ താരതമ്യവും ദേശം സ്വന്തമല്ലാത്തതെന്ന സൂചനയും നിലനിർത്തുന്നു.
lexical_decisions:
- source_word: πίστει
  choice: വിശ്വാസത്താൽ
  rationale: ഉപാധി അഥവാ മാർഗം സൂചിപ്പിക്കുന്ന ദത്തിവ്; എബ്രായർ 11-ലെ ആവർത്തിത പ്രയോഗത്തിന് സ്വാഭാവികവും സ്ഥിരതയുള്ളതുമായ പരിഭാഷ.
- source_word: παρῴκησεν
  choice: പരദേശിയെപ്പോലെ പാർത്തു
  rationale: സ്വദേശിയല്ലാത്തവനായി താൽക്കാലികമായി താമസിക്കുന്ന സാമൂഹികവും വാസസ്ഥലപരവുമായ ആശയം വ്യക്തമാക്കുന്നു.
- source_word: εἰς γῆν τῆς ἐπαγγελίας
  choice: വാഗ്ദത്തദേശത്ത്
  rationale: വാസത്തെ സൂചിപ്പിക്കുന്ന ക്രിയയോടൊപ്പം εἰς ഇവിടെ സ്ഥലാർഥത്തിൽ സ്വാഭാവികമായി ഗ്രഹിക്കാം; ‘വാഗ്ദത്തദേശം’ മലയാള ബൈബിൾ ഭാഷയിൽ വ്യക്തവും സംക്ഷിപ്തവുമാണ്.
- source_word: ὡς ἀλλοτρίαν
  choice: അതു തനിക്കു അന്യദേശമായിരുന്നതുപോലെ
  rationale: ദേശം മറ്റൊരാളുടേതോ തനിക്കു സ്വന്തമല്ലാത്തതോ എന്ന ἀλλότριος എന്ന പദത്തിന്റെ ആശയവും ὡς സൂചിപ്പിക്കുന്ന താരതമ്യവും നിലനിർത്തുന്നു.
- source_word: ἐν σκηναῖς κατοικήσας
  choice: കൂടാരങ്ങളിൽ വസിച്ചു
  rationale: സ്ഥിരതാമസമില്ലാത്ത ജീവിതത്തിന്റെ മൂർത്തമായ ചിത്രം ലളിതമായി നൽകുന്നു; പങ്കാളിക്രിയയുടെ സാഹചര്യാർഥം മലയാളത്തിൽ സമാന്തര ക്രിയയായി സ്വാഭാവികമാക്കി.
- source_word: μετὰ Ἰσαὰκ καὶ Ἰακώβ
  choice: യിസ്ഹാക്കിനോടും യാക്കോബിനോടുംകൂടെ
  rationale: μετάയുടെ ‘കൂടെ’ എന്ന അർഥം നേരിട്ട് സംരക്ഷിക്കുന്നു; പേരുകൾ മലയാളത്തിലെ പരിചിത ബൈബിൾ രൂപങ്ങളിൽ നൽകി.
- source_word: τῶν συγκληρονόμων
  choice: കൂട്ടവകാശികളായ
  rationale: ഒരേ അവകാശത്തിൽ പങ്കുചേരുന്നവരെന്ന സംയുക്ത അർഥം സംക്ഷിപ്തവും വായനാസൗകര്യമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: τῆς ἐπαγγελίας τῆς αὐτῆς
  choice: അതേ വാഗ്ദത്തത്തിന്റെ
  rationale: അബ്രാഹാമിനു ലഭിച്ച അതേ വാഗ്ദത്തമാണ് യിസ്ഹാക്കും യാക്കോബും പങ്കിട്ടതെന്ന തിരിച്ചറിയൽ ഊന്നൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: വ്യക്തമായി പറയാത്ത കർത്താവിന്റെ സൂചകം
  choice: ‘അവൻ’ എന്നത് മുൻവാക്യത്തിലെ അബ്രാഹാമിനെ സൂചിപ്പിക്കുന്നു
  alternative: പേര് വ്യക്തമായി ചേർത്ത് ‘അബ്രാഹാം’ എന്നു പരിഭാഷപ്പെടുത്തുക
  rationale: ഗ്രീക്കിൽ കർത്താവ് ക്രിയയിൽ ഉൾക്കൊള്ളുകയും മുൻവാക്യത്തിൽനിന്ന് മനസ്സിലാകുകയും ചെയ്യുന്നു. ‘അവൻ’ എന്നു നിലനിർത്തുന്നത് മൂലത്തിന്റെ വാക്യബന്ധം സംരക്ഷിക്കുന്നു.
- issue: വാഗ്ദത്തദേശത്തായിരുന്നിട്ടും അന്യദേശമായി ജീവിച്ചെന്ന സംഘർഷം
  choice: ‘വാഗ്ദത്തദേശത്ത് ... തനിക്കു അന്യദേശമായിരുന്നതുപോലെ’ എന്ന് രണ്ടുവശവും നിലനിർത്തി
  alternative: ദേശം ഇനിയും സ്വന്തമായിരുന്നില്ലെന്ന് വിശദീകരിച്ച് അർഥം തുറന്നുപറയുക
  rationale: വാഗ്ദത്തവും അന്നത്തെ അനുഭവവും തമ്മിലുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷം മൂലപാഠത്തിൽ ഉദ്ദേശ്യപൂർവം നിലനിൽക്കുന്നു; വ്യാഖ്യാനത്തോടെ അത് പരിഹരിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘പാർത്തു’, ‘വസിച്ചു’, ‘വാഗ്ദത്തദേശം’, ‘കൂട്ടവകാശികൾ’ എന്നിവ ബൈബിൾസന്ദർഭത്തിന് യോജിച്ചെങ്കിലും അതിപുരാതനമല്ലാത്ത പദങ്ങളായി തെരഞ്ഞെടുത്തു.
