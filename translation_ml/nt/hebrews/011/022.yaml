id: HEB.11.22
reference: Hebrews 11:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πίστει Ἰωσὴφ τελευτῶν περὶ τῆς ἐξόδου τῶν υἱῶν Ἰσραὴλ ἐμνημόνευσεν, καὶ περὶ τῶν ὀστέων αὐτοῦ ἐνετείλατο.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/022.yaml
  text: By faith Joseph, as he was nearing the end of his life, mentioned the exodus of the sons of Israel and gave instructions concerning his bones.
translation:
  language: ml
  text: വിശ്വാസത്താൽ യോസേഫ്, തന്റെ ജീവിതാവസാനം അടുത്തപ്പോൾ[a], ഇസ്രായേൽമക്കളുടെ പുറപ്പാടിനെക്കുറിച്ച്[b] പരാമർശിക്കുകയും തന്റെ അസ്ഥികളെക്കുറിച്ച് നിർദേശം നൽകുകയും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മരിക്കാറായപ്പോൾ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ഇസ്രായേൽമക്കളുടെ ‘പുറപ്പെടലിനെക്കുറിച്ച്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: വിശ്വാസത്താൽ
  rationale: എബ്രായർ 11-ൽ ആവർത്തിക്കുന്ന പ്രയോഗരീതി നിലനിർത്തുന്നു; ഇവിടെ ദത്തിവ് യോസേഫ് പ്രവർത്തിച്ച വിശ്വാസത്തെ സൂചിപ്പിക്കുന്ന ഉപകരണാർഥത്തിലാണ്.
- source_word: τελευτῶν
  choice: തന്റെ ജീവിതാവസാനം അടുത്തപ്പോൾ
  rationale: ജീവിതം അവസാനിക്കുന്ന ഘട്ടത്തിലായിരിക്കുക എന്ന സമകാലിക പങ്കാളിക്രിയയുടെ ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; കൂടുതൽ അക്ഷരാർഥമായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: περὶ τῆς ἐξόδου
  choice: പുറപ്പാടിനെക്കുറിച്ച്
  rationale: ഈജിപ്തിൽനിന്നുള്ള ഇസ്രായേൽമക്കളുടെ ഭാവിപുറപ്പെടലാണ് സന്ദർഭം; 'പുറപ്പാട്' എന്നത് സാധാരണ മലയാളത്തിലും ചരിത്രസംഭവത്തെ തിരിച്ചറിയിക്കുന്ന പദമായും യോജിക്കുന്നു.
- source_word: τῶν υἱῶν Ἰσραὴλ
  choice: ഇസ്രായേൽമക്കളുടെ
  rationale: ഗ്രീക്കിലെ കുടുംബബന്ധപരമായ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു; വെറും 'ഇസ്രായേല്യർ' എന്നു പൊതുവാക്കുന്നില്ല.
- source_word: ἐμνημόνευσεν
  choice: പരാമർശിക്കുകയും
  rationale: περί എന്നതിനോടൊപ്പമുള്ള ക്രിയ ഇവിടെ മനസ്സിൽ ഓർക്കുക എന്നതിലുപരി ഒരു കാര്യത്തെക്കുറിച്ച് പറയുക അഥവാ പരാമർശിക്കുക എന്നാണ്.
- source_word: ἐνετείλατο
  choice: നിർദേശം നൽകുകയും ചെയ്തു
  rationale: മധ്യപ്രയോഗത്തിലുള്ള ക്രിയയുടെ നിർദേശിക്കുക/ആജ്ഞാപിക്കുക എന്ന അർഥം വ്യക്തമായി നൽകുന്നു; സന്ദർഭത്തിന് ആവശ്യമില്ലാത്ത കടുപ്പം ഒഴിവാക്കുന്നു.
- source_word: περὶ τῶν ὀστέων αὐτοῦ
  choice: തന്റെ അസ്ഥികളെക്കുറിച്ച്
  rationale: ഗ്രീക്കിലെ വ്യക്തമായ 'അസ്ഥികൾ' എന്ന പദം പൊതുവായ 'ഭൗതികാവശിഷ്ടങ്ങൾ' എന്നാക്കി മാറ്റാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: എബ്രായർ 11-ൽ πίστις എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: വിശ്വാസം
  alternative: വിശ്വസ്തത; ആശ്രയം
  rationale: അധ്യായത്തിലുടനീളമുള്ള ആവർത്തിത സൂത്രവാക്യവും ഈ സന്ദർഭത്തിലെ ഉപകരണാർഥ ദത്തിവും 'വിശ്വാസം' എന്ന വായനയെ ശക്തമായി പിന്തുണയ്ക്കുന്നു; 'വിശ്വസ്തത' എന്നാക്കി മാറ്റി ആശയത്തെ നിശ്ശബ്ദമായി തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ഇസ്രായേൽമക്കൾ,’ ‘പുറപ്പാട്,’ ‘അസ്ഥികൾ’ എന്നീ പദങ്ങൾ മൂലപാഠത്തിന്റെ കുടുംബപരവും ചരിത്രപരവും മൂർത്തവുമായ ഭാഷ സംരക്ഷിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട മുഖ്യപാഠസ്ഥാനങ്ങളിൽ നൽകിയിരിക്കുന്നു.
