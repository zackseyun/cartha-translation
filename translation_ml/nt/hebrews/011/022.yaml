  source_fidelity: 'The translation accurately represents the Greek: «വിശ്വാസത്താൽ» retains the instrumental πίστει in Hebrews 11''s recurring formula; «തന്റെ ജീവിതാവസാനം അടുത്തപ്പോൾ» communicates τελευτῶν as Joseph was at the end of life; «ഇസ്രായേൽമക്കളുടെ പുറപ്പാടിനെക്കുറിച്ച്» represents περὶ τῆς ἐξόδου τῶν υἱῶν Ἰσραήλ; and the final clause preserves both Joseph''s directive and the concrete reference to his bones.'
