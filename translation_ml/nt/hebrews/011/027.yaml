    rationale: ‘മോശെ ഫറവോനെ വിട്ട് ഓടിപ്പോയ സംഭവം’ എന്നത് ഈജിപ്ത് വിടലിനെ വ്യക്തമായി പറയുന്നില്ല; ‘ഫറവോനിൽനിന്ന് ഓടി ഈജിപ്ത് വിട്ടുപോയി’ എന്നു പറയുന്നത് പുറപ്പാട് 2-ലെ നിർദ്ദേശിത സംഭവത്തെ കൃത്യമായി വിവരിക്കുന്നു. രണ്ടു സംഭവങ്ങളിൽ ഏതാണ് ഉദ്ദേശിക്കുന്നതെന്ന അനിശ്ചിതത്വം തുടർന്നും സംരക്ഷിക്കുന്നു.
