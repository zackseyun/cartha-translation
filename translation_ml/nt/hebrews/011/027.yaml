id: HEB.11.27
reference: Hebrews 11:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πίστει κατέλιπεν Αἴγυπτον, μὴ φοβηθεὶς τὸν θυμὸν τοῦ βασιλέως, τὸν γὰρ ἀόρατον ὡς ὁρῶν ἐκαρτέρησεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/027.yaml
  text: By faith he left Egypt[a], not fearing the king’s anger[b], for he endured as seeing the One who is invisible.
translation:
  language: ml
  text: വിശ്വാസത്താൽ അവൻ രാജാവിന്റെ കോപത്തെ ഭയപ്പെടാതെ ഈജിപ്ത് വിട്ടുപോയി[a]; അദൃശ്യനായവനെ[b] കാണുന്നതുപോലെ അവൻ ഉറച്ചുനിന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: മോശെ ഫറവോനിൽനിന്ന് ഓടി ഈജിപ്ത് വിട്ടുപോയ സംഭവത്തെയാണോ (പുറപ്പാട് 2), അതോ യിസ്രായേലിനോടൊപ്പം ഈജിപ്തിൽനിന്ന് പുറപ്പെട്ട സംഭവത്തെയാണോ (പുറപ്പാട് 12–14) ഈ വാക്യം സൂചിപ്പിക്കുന്നത് എന്നു ഗ്രീക്ക് വാചകം വ്യക്തമാക്കുന്നില്ല.
    reason: cross_reference
  - marker: b
    text: അഥവാ, ‘കാണാനാവാത്തവനെ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: വിശ്വാസത്താൽ
  rationale: πίστις എന്ന പദത്തിന്റെ സന്ദർഭോചിതമായ ഉപകരണാർഥ ദത്തിവ് രൂപം; എബ്രായർ 11-ലെ ആവർത്തിത പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: κατέλιπεν Αἴγυπτον
  choice: ഈജിപ്ത് വിട്ടുപോയി
  rationale: καταλείπω ഇവിടെ സ്ഥലം വിട്ടുപോകുക എന്ന സ്വാഭാവിക അർഥത്തിലാണ്; ‘ഉപേക്ഷിച്ചു’ എന്നത് ആശയം അനാവശ്യമായി ശക്തമാക്കും.
- source_word: μὴ φοβηθεὶς τὸν θυμὸν τοῦ βασιλέως
  choice: രാജാവിന്റെ കോപത്തെ ഭയപ്പെട്ടില്ല
  rationale: ഗ്രീക്കിലെ നിഷേധാർഥക കൃതന്തത്തിന്റെ ആശയം സ്വാഭാവികമായ മലയാള വാക്യമായി നൽകുന്നു; θυμός എന്ന ശക്തമായ വികാരത്തിന് ‘കോപം’ വ്യക്തവും അതിശയോക്തിയില്ലാത്തതുമാണ്.
- source_word: τὸν ἀόρατον
  choice: അദൃശ്യനായവനെ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ വിശേഷണം വ്യക്തിയെ സൂചിപ്പിക്കുന്ന നാമപ്രയോഗമാണ്; ദൈവത്തെ സൂചിപ്പിക്കുന്ന വ്യക്തിപരമായ പ്രയോഗവും ‘കാണുക’ എന്ന വിരോധാഭാസവും നിലനിർത്തുന്നു.
- source_word: ὡς ὁρῶν
  choice: കാണുന്നതുപോലെ
  rationale: ὡς എന്ന താരതമ്യഭാവം നേരിട്ട് നിലനിർത്തുന്നു; ‘കണ്ടതുകൊണ്ട്’ എന്നു വ്യാഖ്യാനിച്ചു തീർക്കുന്നില്ല.
- source_word: ἐκαρτέρησεν
  choice: ഉറച്ചുനിന്നു
  rationale: καρτερέω സൂചിപ്പിക്കുന്ന സ്ഥിരതയോടെയുള്ള സഹനവും നിലനിൽപ്പും സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി അറിയിക്കുന്നു; ‘സഹിച്ചുനിന്നു’ എന്നും സാധ്യമെങ്കിലും ഇവിടെ ഉറച്ച നിലപാടിനാണ് മുൻതൂക്കം.
theological_decisions:
- issue: ‘അവൻ ഈജിപ്ത് വിട്ടുപോയി’ എന്നതിന്റെ ചരിത്രസംഭവം
  choice: പ്രധാനവാചകം സംഭവം ഏതെന്ന് നിർണയിക്കാതെ മോശെയുടെ ഈജിപ്ത് വിടലായി മാത്രം അവതരിപ്പിക്കുന്നു.
  alternative: പുറപ്പാട് 2-ലെ മോശെയുടെ പലായനമോ പുറപ്പാട് 12–14-ലെ യിസ്രായേലിനൊപ്പമുള്ള പുറപ്പാടോ എന്ന് വ്യക്തമായി നിർണ്ണയിക്കുക.
  rationale: ഗ്രീക്ക് വാചകം ഏത് സംഭവമാണ് ഉദ്ദേശിക്കുന്നതെന്ന് വ്യക്തമാക്കുന്നില്ല; അതിനാൽ വ്യാഖ്യാനഭേദം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ച് പ്രധാനവാചകത്തിലെ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു.
- issue: ‘അദൃശ്യനായവനെ കാണുന്നതുപോലെ’ എന്ന വിരോധാഭാസം
  choice: ദൈവത്തെ വ്യക്തിപരമായി സൂചിപ്പിക്കുന്നതും വിശ്വാസത്തിലൂടെയുള്ള ദർശനത്തിന്റെ രൂപകവും അതേപടി നിലനിർത്തുന്നു.
  alternative: ‘ദൈവസാന്നിധ്യം തിരിച്ചറിഞ്ഞതിനാൽ’ എന്നിങ്ങനെ ആശയം വിശദീകരിച്ച് വിവർത്തനം ചെയ്യുക.
  rationale: വിശദീകരണപരമായ പുനരാഖ്യാനം മൂലവാചകത്തിലെ ഉദ്ദേശപൂർവമായ വിരോധാഭാസവും സാഹിത്യശക്തിയും കുറയ്ക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗ്രീക്കിലെ പങ്കുപ്രയോഗങ്ങൾ മലയാളത്തിൽ സ്വാഭാവികമായ സ്വതന്ത്ര ഉപവാക്യങ്ങളാക്കി; എന്നാൽ കാരണം, താരതമ്യം, വ്യാഖ്യാനപരമായ അനിശ്ചിതത്വം എന്നിവ സംരക്ഷിച്ചു. നൽകിയ ഇംഗ്ലീഷ് അടിക്കുറിപ്പുകളിൽ സൂചികകളും ഉള്ളടക്കവും തമ്മിൽ പൊരുത്തക്കേടുണ്ടായതിനാൽ, [a] ചരിത്രസംഭവത്തിലെ അനിശ്ചിതത്വത്തോടും [b] ἀόρατος എന്ന പദത്തിന്റെ പകരംവിവർത്തനത്തോടും അർഥസംബന്ധമായി ചേർത്തിരിക്കുന്നു.
