- from: വിശ്വാസത്താൽ അവൻ ഈജിപ്ത് വിട്ടുപോയി[a]; രാജാവിന്റെ കോപത്തെ ഭയപ്പെട്ടില്ല. കാരണം, അദൃശ്യനായവനെ[b] കാണുന്നതുപോലെ അവൻ ഉറച്ചുനിന്നു.
  to: വിശ്വാസത്താൽ അവൻ രാജാവിന്റെ കോപത്തെ ഭയപ്പെടാതെ ഈജിപ്ത് വിട്ടുപോയി[a]; അദൃശ്യനായവനെ[b] കാണുന്നതുപോലെ അവൻ ഉറച്ചുനിന്നു.
  rationale: 'പരിഷ്കാരം മൂലഗ്രീക്കിലെ പങ്കുപ്രയോഗബന്ധം കൂടുതൽ സ്വാഭാവികമായി നിലനിർത്തുകയും അടിക്കുറിപ്പ് a-യിൽ പുറപ്പാട് 2-ലെ നിർദ്ദേശിത സംഭവത്തെ കൃത്യമായി വിവരിക്കുകയും ചെയ്യുന്നു. മുഖ്യവാചകം ഏത് ചരിത്രസംഭവമാണ് ഉദ്ദേശിക്കുന്നതെന്ന് നിർണയിക്കുന്നില്ല. അടിക്കുറിപ്പുകളുടെ ചിഹ്നങ്ങൾ മലയാള മുഖ്യവാചകത്തിലെ അവയുടെ യഥാർഥ ആങ്കറുകളോടാണ് ചേർത്തിരിക്കുന്നത്: [a] ‘ഈജിപ്ത് വിട്ടുപോയി,’ [b] ‘അദൃശ്യനായവനെ.’'
