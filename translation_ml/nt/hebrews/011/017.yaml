id: HEB.11.17
reference: Hebrews 11:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Πίστει προσενήνοχεν Ἀβραὰμ τὸν Ἰσαὰκ πειραζόμενος, καὶ τὸν μονογενῆ προσέφερεν ὁ τὰς ἐπαγγελίας ἀναδεξάμενος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/017.yaml
  text: By faith Abraham[a], when he was being tested, offered up Isaac, and the one who had received the promises was offering up his one and only son,
translation:
  language: ml
  text: വിശ്വാസത്താൽ അബ്രാഹാം, പരീക്ഷിക്കപ്പെടുമ്പോൾ, യിസ്ഹാക്കിനെ അർപ്പിച്ചു. വാഗ്ദാനങ്ങൾ സ്വീകരിച്ചിരുന്ന അവൻ തന്റെ ഏകപുത്രനെ[a] അർപ്പിക്കുകയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഒരേയൊരു പുത്രനെ” അല്ലെങ്കിൽ “അതുല്യനായ പുത്രനെ.” ഗ്രീക്ക് പദം യിസ്ഹാക്കിന്റെ അനന്യസ്ഥാനത്തെ ഊന്നുന്നു; “ഏകജാതപുത്രനെ” എന്നത് പരമ്പരാഗത പരിഭാഷയാണ്.
    reason: μονογενής എന്ന പദത്തിന്റെ അർഥപരിധിയും യിസ്ഹാക്കിന്റെ വാഗ്ദാനബന്ധിയായ അനന്യസ്ഥാനവും വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: Πίστει
  choice: വിശ്വാസത്താൽ
  rationale: മാർഗം/ഉപാധി സൂചിപ്പിക്കുന്ന ദാതൃവിഭക്തിയുടെ അർഥം സ്വാഭാവികമായി നൽകുകയും ഈ അധ്യായത്തിൽ ആവർത്തിക്കുന്ന പ്രയോഗം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: προσενήνοχεν
  choice: അർപ്പിച്ചു
  rationale: προσφέρω എന്ന ക്രിയയുടെ യാഗാർപ്പണസൂചന നിലനിർത്തുന്നു; കഥാസംഗ്രഹസന്ദർഭത്തിൽ ഗ്രീക്കിലെ perfect രൂപം മലയാളത്തിൽ സ്വാഭാവികമായ ഭൂതകാലക്രിയയായി നൽകിയിരിക്കുന്നു.
- source_word: πειραζόμενος
  choice: പരീക്ഷിക്കപ്പെടുമ്പോൾ
  rationale: അബ്രാഹാമിനെ വിശേഷിപ്പിക്കുന്ന വർത്തമാനകാല കർമണി പങ്കാളിക്രിയയുടെ കാലസാഹചര്യവും കർമണിപ്രയോഗവും വ്യക്തമാക്കുന്നു. പാപത്തിലേക്കുള്ള പ്രലോഭനമല്ല, വിശ്വാസത്തിന്റെ പരീക്ഷണമാണെന്ന സന്ദർഭത്തിന് ‘പരീക്ഷിക്കുക’ യോജിക്കുന്നു.
- source_word: μονογενῆ
  choice: ഏകപുത്രനെ
  rationale: യിസ്ഹാക്കിന്റെ അനന്യമായ, വാഗ്ദാനബന്ധിയായ പുത്രസ്ഥാനത്തെ സംക്ഷിപ്തവും മാന്യവുമായി സൂചിപ്പിക്കുന്നു. അബ്രാഹാമിന് മറ്റൊരു ജൈവപുത്രൻ ഉണ്ടായിരുന്നതിനാൽ പദത്തിന്റെ അർഥപരിധി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കിയിരിക്കുന്നു.
- source_word: προσέφερεν
  choice: അർപ്പിക്കുകയായിരുന്നു
  rationale: Imperfect ക്രിയാരൂപത്തിന്റെ പുരോഗമനപരമായ ദൃശ്യഭാവം നിലനിർത്തുകയും മുമ്പത്തെ സംഗ്രഹപ്രസ്താവനയായ ‘അർപ്പിച്ചു’ എന്നതിൽനിന്ന് വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀναδεξάμενος
  choice: സ്വീകരിച്ചിരുന്ന
  rationale: വാഗ്ദാനങ്ങളെ ലഭിച്ചു സ്വീകരിച്ച അബ്രാഹാമിന്റെ മുൻകാലാനുഭവം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐπαγγελίας
  choice: വാഗ്ദാനങ്ങൾ
  rationale: ഗ്രീക്കിലെ ബഹുവചനം കൃത്യമായി നിലനിർത്തി അബ്രാഹാമിനു ലഭിച്ച ദൈവിക വാഗ്ദാനങ്ങളുടെ സമുച്ചയത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: καὶ
  choice: രണ്ടാമത്തെ വാക്യമായി ബന്ധം നിലനിർത്തി
  rationale: ഗ്രീക്കിലെ ബന്ധകത്തിന്റെ തുടർച്ച മലയാളത്തിൽ വാക്യക്രമത്തിലൂടെയും ആവർത്തിച്ച വിഷയത്തിലൂടെയും സ്വാഭാവികമായി പ്രകടമാകുന്നു; കൃത്രിമമായ നീണ്ട സംയുക്തവാക്യം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: അബ്രാഹാമിന് ഇശ്മായേലും ഉണ്ടായിരിക്കെ യിസ്ഹാക്കിനെ μονογενής എന്നു വിളിക്കുന്നത്
  choice: ‘ഏകപുത്രനെ’ എന്നു പരിഭാഷപ്പെടുത്തി, യിസ്ഹാക്കിന്റെ അനന്യമായ വാഗ്ദാനപുത്രസ്ഥാനത്തെ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: ‘ഒരേയൊരു പുത്രനെ’, ‘അതുല്യനായ പുത്രനെ’, അല്ലെങ്കിൽ പരമ്പരാഗതമായ ‘ഏകജാതപുത്രനെ’
  rationale: ഈ പദം ഇവിടെ ജൈവപരമായി മറ്റൊരു പുത്രനും ഇല്ലെന്ന അവകാശവാദത്തേക്കാൾ യിസ്ഹാക്കിന്റെ അനന്യസ്ഥാനത്തെയാണ് ഊന്നുന്നത്. ‘ഏകജാത’ എന്ന പരമ്പരാഗത രൂപം ഈ സന്ദർഭത്തിലേക്ക് അനാവശ്യമായ പിൽക്കാല ക്രിസ്തുശാസ്ത്രബന്ധങ്ങൾ കൊണ്ടുവരാൻ ഇടയുള്ളതിനാൽ മുഖ്യപാഠത്തിൽ ഒഴിവാക്കി.
- issue: προσέφερεν എന്ന imperfect ക്രിയയുടെ ദൃശ്യഭാവം
  choice: ‘അർപ്പിക്കുകയായിരുന്നു’ എന്ന പുരോഗമനരൂപം ഉപയോഗിച്ചു.
  alternative: ‘അർപ്പിച്ചു’
  rationale: അർപ്പണപ്രവൃത്തി നടന്നു കൊണ്ടിരുന്ന ദൃശ്യത്തെ ഗ്രീക്ക് ക്രിയാരൂപം മുന്നിലെത്തിക്കുന്നതിനാൽ ആ തുറന്ന, പുരോഗമനഭാവം നിലനിർത്തി; സംഭവത്തിന്റെ പൂർത്തീകരണത്തെക്കുറിച്ച് വാക്യം പറയുന്നതിലധികം നിർണയിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലുള്ള ലളിതവും മാന്യവുമായ ശൈലി. നീണ്ട ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് മലയാളവാക്യങ്ങളാക്കി; ആശയബന്ധവും ക്രിയാരൂപങ്ങളിലെ വ്യത്യാസവും നിലനിർത്തി. ‘യിസ്ഹാക്ക്’ എന്ന വ്യാപകമായ മലയാള ബൈബിൾ നാമരൂപം ഉപയോഗിച്ചു.
