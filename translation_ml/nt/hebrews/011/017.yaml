  source_fidelity: 'മുഖ്യപരിഭാഷ ഗ്രീക്ക് വാക്യത്തിന്റെ ഘടനയും നിർണായക വ്യത്യാസങ്ങളും വിശ്വസ്തമായി നിലനിർത്തുന്നു: Πίστει-യുടെ ഉപാധ്യർഥം ‘വിശ്വാസത്താൽ,’ πειραζόμενος-ന്റെ കർമണി-കാലസാഹചര്യം ‘പരീക്ഷിക്കപ്പെടുമ്പോൾ,’ προσενήνοχεν-ന്റെ യാഗാർപ്പണഭാവം ‘അർപ്പിച്ചു,’ ἐπαγγελίας-ന്റെ ബഹുവചനം ‘വാഗ്ദാനങ്ങൾ,’ കൂടാതെ προσέφερεν-ന്റെ അപൂർണ/പുരോഗമന ഭാവം ‘അർപ്പിക്കുകയായിരുന്നു.’ രണ്ട് വാക്യങ്ങളാക്കിയിട്ടും ഗ്രീക്കിലെ വിരോധാഭാസസദൃശമായ ഊന്നൽ—അർപ്പിച്ചു എന്നും അർപ്പിക്കുകയായിരുന്നു എന്നും—നഷ്ടപ്പെട്ടിട്ടില്ല.'
  naturalness: ആധുനിക നിലവാരമലയാളത്തിൽ വാക്യങ്ങൾ സ്വാഭാവികവും മാന്യവുമാണ്. ‘വിശ്വാസത്താൽ,’ ‘വാഗ്ദാനങ്ങൾ,’ ‘അർപ്പിച്ചു’ എന്നിവ ഈ സാഹിത്യ-മതപരമായ രജിസ്റ്ററിന് യോജിച്ച സ്ഥിരപ്രയോഗങ്ങളാണ്. ‘പരീക്ഷിക്കപ്പെടുമ്പോൾ’ സന്ദർഭത്തിന് വ്യക്തവും സ്വാഭാവികവുമാണ്.
  terminology: ‘ഏകപുത്രനെ’ ഇവിടെ μονογενῆ-യ്ക്ക് സ്വീകരിക്കാവുന്ന സംക്ഷിപ്തമായ മുഖ്യപാഠപരിഭാഷയാണ്. അടിക്കുറിപ്പ് ‘ഒരേയൊരു’/‘അതുല്യ’ എന്ന സാധ്യതകൾ രേഖപ്പെടുത്തി, യിസ്ഹാക്കിന്റെ വാഗ്ദാനബന്ധിയായ അനന്യസ്ഥാനം വ്യക്തമാക്കുന്നു; ‘ഏകജാതപുത്രൻ’ എന്ന പരമ്പരാഗത രൂപം മുഖ്യപാഠത്തിലേക്ക് നിർബന്ധിക്കുന്നില്ല. ‘യിസ്ഹാക്ക്’ എന്ന നാമരൂപവും നൽകിയിരിക്കുന്ന പദ്ധതിയുടെ നാമരൂപനയത്തോട് പൊരുത്തപ്പെടുന്നു.
