reference: Hebrews 6:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐκφέρουσα δὲ ἀκάνθας καὶ τριβόλους ἀδόκιμος καὶ κατάρας ἐγγύς, ἧς τὸ τέλος εἰς καῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/008.yaml
  text: But if it bears thorns and thistles[a], it is worthless and near to being cursed, and its end is for burning.
translation:
  language: ml
  text: എന്നാൽ മുള്ളും ഞെരിഞ്ഞിലും വിളയിക്കുന്ന നിലം പ്രയോജനശൂന്യമാണ്[a]; അത് ശാപത്തിന് അടുത്താണ്; ഒടുവിൽ അത് കത്തിക്കപ്പെടും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘തിരസ്കരിക്കപ്പെട്ടതാണ്’.
    reason: ἀδόκιμος എന്ന പദത്തിന് പരിശോധനയിൽ പരാജയപ്പെട്ടതിനാൽ അംഗീകരിക്കപ്പെടാത്തത് എന്ന അർഥവും വരാം; ഈ ശക്തമായ പദസാധ്യത സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: ἐκφέρουσα
  choice: വിളയിക്കുന്നതാകട്ടെ
  rationale: മുൻവാക്യത്തിലെ നിലത്തെ സൂചിപ്പിക്കുന്ന സ്ത്രീലിംഗ ഏകവചന വർത്തമാന കൃതന്തമാണിത്. കാർഷികസന്ദർഭത്തിൽ ‘വിളയിക്കുക’ സ്വാഭാവികവും തുടർച്ചയായ ഫലോൽപാദനത്തിന്റെ ആശയം നിലനിർത്തുന്നതുമാണ്.
- source_word: δὲ
  choice: എന്നാൽ … ആകട്ടെ
  rationale: 7-ാം വാക്യത്തിലെ ഫലഭൂയിഷ്ഠമായ നിലത്തോടുള്ള വൈരുധ്യം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀκάνθας καὶ τριβόλους
  choice: മുള്ളും ഞെരിഞ്ഞിലും
  rationale: രണ്ടു തരത്തിലുള്ള മുള്ളുചെടികളെ സൂചിപ്പിക്കുന്ന കാർഷികബിംബം മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായും വ്യക്തമായും നൽകുന്നു.
- source_word: ἀδόκιμος
  choice: പ്രയോജനശൂന്യമാണ്
  rationale: പരിശോധനയിൽ ഉപയോഗയോഗ്യമല്ലെന്ന കാർഷികസന്ദർഭത്തിലെ വിലയിരുത്തൽ മുൻനിർത്തുന്നു; കൂടുതൽ ശക്തമായ ‘തിരസ്കരിക്കപ്പെട്ടത്’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: κατάρας ἐγγύς
  choice: ശാപത്തിന് അടുത്തിരിക്കുന്നു
  rationale: ഗ്രീക്കിലെ നാമപ്രയോഗം നിലനിർത്തി, ‘ശപിക്കപ്പെടാൻ അടുത്തിരിക്കുന്നു’ എന്ന ക്രിയാരൂപത്തിലേക്ക് അർഥം ചുരുക്കാതെ സ്വാഭാവിക മലയാളം നൽകുന്നു.
- source_word: ἧς τὸ τέλος
  choice: അതിന്റെ അവസാനം
  rationale: മുൻപറഞ്ഞ നിലത്തെയാണ് ബന്ധസർവനാമം സൂചിപ്പിക്കുന്നത്; τέλος എന്നതിന്റെ കാലപരവും ഫലപരവുമായ വ്യാപ്തി ‘അവസാനം’ നിലനിർത്തുന്നു.
- source_word: εἰς καῦσιν
  choice: ചുട്ടുകളയപ്പെടുക എന്നതാണ്
  rationale: ഉദ്ദേശ്യമോ ഫലമോ സൂചിപ്പിക്കുന്ന പ്രയോഗത്തെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; അന്തിമവിധിയെക്കുറിച്ചുള്ള കൂടുതൽ പ്രത്യേക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: മുൻവാക്യത്തിൽനിന്നുള്ള ‘നിലം’ എന്ന കർത്താവിനെ ഈ വാക്യത്തിൽ വീണ്ടും വ്യക്തമാക്കണമോ
  choice: ‘നിലം’ വീണ്ടും ചേർക്കാതെ ‘വിളയിക്കുന്നതാകട്ടെ’, ‘അത്’ എന്നീ രൂപങ്ങൾ ഉപയോഗിച്ചു
  alternative: എന്നാൽ മുള്ളും ഞെരിഞ്ഞിലും വിളയിക്കുന്ന നിലം…
  rationale: ഗ്രീക്കിൽ ‘നിലം’ ആവർത്തിക്കുന്നില്ലെങ്കിലും സ്ത്രീലിംഗ കൃതന്തം മുൻവാക്യത്തിലെ നിലത്തെ വ്യക്തമായി തുടരുന്നു. മലയാളത്തിൽ കർത്താവിനെ അനാവശ്യമായി ചേർക്കാതെ ബന്ധം നിലനിർത്താം.
- issue: ἀδόκιμος എന്നത് ശക്തമായ ദൈവശാസ്ത്രപരമായ പദംകൊണ്ട് പരിഭാഷപ്പെടുത്തണമോ
  choice: മുഖ്യപാഠത്തിൽ ‘പ്രയോജനശൂന്യമാണ്’; ‘തിരസ്കരിക്കപ്പെട്ടതാണ്’ അടിക്കുറിപ്പിൽ
  alternative: തിരസ്കരിക്കപ്പെട്ടതാണ്
  rationale: ഉടൻ വരുന്ന കാർഷികബിംബത്തിൽ നിലത്തിന്റെ ഉപയോഗയോഗ്യതയാണ് മുൻപന്തിയിൽ. എന്നാൽ ‘തിരസ്കരിക്കപ്പെട്ടത്’ എന്ന ഗൗരവമുള്ള പദസാധ്യത മറച്ചുവയ്ക്കാതെ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: εἰς καῦσιν അന്തിമ ന്യായവിധിയായി വിശദീകരിക്കണമോ
  choice: ‘ചുട്ടുകളയപ്പെടുക’ എന്ന ബിംബം മാത്രം നിലനിർത്തി
  alternative: നരകാഗ്നിയിൽ നശിപ്പിക്കപ്പെടുക / അഗ്നിന്യായവിധിക്കായി
  rationale: മൂലപാഠം കാർഷികബിംബമാണ് നൽകുന്നത്; അതിന്റെ ദൈവശാസ്ത്രപരമായ സൂചനയെ കൂടുതൽ പ്രത്യേകമായി നിർവചിക്കുന്നില്ല. അതിനാൽ പാഠത്തിലെ സംഘർഷവും തുറന്ന അർഥവ്യാപ്തിയും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. കാർഷികബിംബവും നാമരൂപത്തിലുള്ള ‘ശാപത്തിന് അടുത്ത്’ എന്ന അസ്പഷ്ടതയും നിലനിർത്തി; അനാവശ്യമായ അന്തിമവിധി-വ്യാഖ്യാനം ഒഴിവാക്കി.
