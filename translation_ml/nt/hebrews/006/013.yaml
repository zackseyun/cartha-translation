id: HEB.6.13
reference: Hebrews 6:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τῷ γὰρ Ἀβραὰμ ἐπαγγειλάμενος ὁ θεός, ἐπεὶ κατ’ οὐδενὸς εἶχεν μείζονος ὀμόσαι, ὤμοσεν καθ’ ἑαυτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/013.yaml
  text: For when God made the promise to Abraham[a], since he could swear by no one greater, he swore by himself[b],
translation:
  language: ml
  text: എന്തെന്നാൽ, ദൈവം അബ്രാഹാമിനോടു വാഗ്ദാനം ചെയ്തപ്പോൾ[a], സത്യം ചെയ്യാൻ തന്നെക്കാൾ വലിയ ആരും ഇല്ലാതിരുന്നതിനാൽ, അവൻ തന്നെത്തന്നെ ചൊല്ലി സത്യം ചെയ്തു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘ദൈവം അബ്രാഹാമിനു വാഗ്ദാനം നൽകിയപ്പോൾ.’'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: ‘അവന് സത്യം ചെയ്യാൻ തന്നെക്കാൾ വലിയ ആരും ഇല്ലാതിരുന്നതിനാൽ.’'
    reason: previous_rendering
lexical_decisions:
- source_word: ἐπαγγειλάμενος
  choice: വാഗ്ദാനം ചെയ്തപ്പോൾ
  rationale: എപ്പംഗെല്ലൊമൈ എന്ന ക്രിയയുടെ എയോറിസ്റ്റ് മധ്യ കൃദന്തരൂപം ദൈവം വാഗ്ദാനം ചെയ്ത സംഭവത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ കാലബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘വാഗ്ദാനം ചെയ്തപ്പോൾ’ എന്നു നൽകി.
- source_word: ἐπεὶ
  choice: ഇല്ലാതിരുന്നതിനാൽ
  rationale: ഇവിടെ ἐπεί ദൈവം തന്നെത്തന്നെ ചൊല്ലി സത്യം ചെയ്തതിന്റെ കാരണം അവതരിപ്പിക്കുന്നു; ‘-തിനാൽ’ ആ കാരണബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: κατ’ οὐδενὸς ... μείζονος
  choice: തന്നെക്കാൾ വലിയ ആരെയും ചൊല്ലി
  rationale: οὐδενός രൂപപരമായി വ്യക്തിയെയോ വസ്തുവെയോ സൂചിപ്പിക്കാമെങ്കിലും, സത്യം ചെയ്യുന്നതിന്റെ സന്ദർഭം ഒരു വ്യക്തിപരമായ അധികാരത്തെയാണ് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്. താരതമ്യത്തിന്റെ മാനദണ്ഡമായ ദൈവത്തെ മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘തന്നെക്കാൾ’ ചേർത്തു.
- source_word: ὀμόσαι / ὤμοσεν
  choice: സത്യം ചെയ്യാൻ / സത്യം ചെയ്തു
  rationale: ഇൻഫിനിറ്റീവിലും പ്രധാനക്രിയയിലും ഉള്ള ഒരേ ഗ്രീക്ക് മൂലത്തിന്റെ ആവർത്തനം മലയാളത്തിലും ഒരേ പ്രയോഗംകൊണ്ട് സംരക്ഷിച്ചു.
- source_word: καθ’ ἑαυτοῦ
  choice: തന്നെത്തന്നെ ചൊല്ലി
  rationale: ശപഥഭാഷയിൽ κατά കൂടിയ ആത്മവാചക സർവനാമം ഒരാളെ സാക്ഷിയാക്കി അഥവാ ആ വ്യക്തിയുടെ നാമത്തിൽ സത്യം ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘തന്നെത്തന്നെ ചൊല്ലി’ മലയാളത്തിലെ സ്വാഭാവിക ശപഥപ്രയോഗമാണ്.
- source_word: γὰρ
  choice: പ്രത്യേക പദമായി ചേർത്തിട്ടില്ല
  rationale: γάρ മുൻവാക്യത്തിന്റെ വിശദീകരണമായി ഈ വാക്യത്തെ ബന്ധിപ്പിക്കുന്നു. ഒറ്റവാക്യമായി വായിക്കുമ്പോൾ ‘എന്തെന്നാൽ’ ചേർക്കുന്നത് മലയാളത്തിൽ അപൂർണ്ണമോ കൃത്രിമമോ തോന്നാം; കാരണഘടന വാക്യത്തിനുള്ളിൽ നിലനിൽക്കുന്നു.
- source_word: Τῷ ... Ἀβραὰμ
  choice: അബ്രാഹാമിനോടു
  rationale: ദത്തിവ് രൂപം വാഗ്ദാനത്തിന്റെ സ്വീകർത്താവിനെ സൂചിപ്പിക്കുന്നു. ‘അബ്രാഹാമിനോടു വാഗ്ദാനം ചെയ്തു’ എന്നത് ആ ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
theological_decisions:
- issue: ദൈവത്തിന്റെ ശപഥത്തിന്റെ സ്വഭാവം
  choice: തന്നെക്കാൾ വലിയ ആരെയും ചൊല്ലി സത്യം ചെയ്യാൻ ഇല്ലാത്തതിനാൽ ദൈവം തന്നെത്തന്നെ ചൊല്ലി സത്യം ചെയ്തു
  alternative: ദൈവത്തിന് സത്യം ചെയ്യാൻ തന്നെക്കാൾ വലിയവൻ ആരും ഉണ്ടായിരുന്നില്ല; അതിനാൽ അവൻ തന്നെക്കൊണ്ട് സത്യം ചെയ്തു
  rationale: ദൈവത്തിന്റെ അതുല്യമായ പരമത്വവും സ്വയംചൊല്ലിയ ശപഥവും പാഠം പറയുന്നതുപോലെ നിലനിർത്തുന്നു; അതിനപ്പുറമുള്ള സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ശപഥത്തിന്റെ ആശയം സാധാരണ വായനക്കാർക്കു വ്യക്തമായിരിക്കാനായി ‘ചൊല്ലി സത്യം ചെയ്യുക’ എന്ന പ്രയോഗം ഉപയോഗിച്ചു; ഗ്രീക്കിലെ ക്രിയാവർത്തനം മലയാളത്തിലും സൂക്ഷിച്ചു.
