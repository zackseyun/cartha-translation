    reason: lexical_alternative
lexical_decisions:
- source_word: καλὸν
  choice: നല്ല
  rationale: ῥῆμα എന്ന പദത്തെ വിശേഷിപ്പിക്കുന്ന καλός ഇവിടെ നന്മയും ശ്രേഷ്ഠതയും സൂചിപ്പിക്കുന്നു; ‘നല്ല വചനം’ സ്വാഭാവികവും അർത്ഥനിഷ്ഠവുമാണ്.
- source_word: γευσαμένους
  choice: രുചിച്ചറിയുകയും … അനുഭവിച്ചറിയുകയും ചെയ്തവർ
  rationale: രുചിക്കുക എന്ന മൂലരൂപകം നിലനിർത്തിക്കൊണ്ട് രൂപകപ്രയോഗമാണെന്ന് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു. ഈ കൃദ്ദന്തരൂപം മുൻവാക്യത്തിൽനിന്നു തുടരുന്ന ബഹുവചന കർമനിരയുടെ ഭാഗമാണ്.
- source_word: θεοῦ ῥῆμα
  choice: ദൈവത്തിന്റെ വചനം
  rationale: ῥῆμα ഒരു വാക്കിനെയോ അരുളപ്പാടിനെയോ സൂചിപ്പിക്കാം; ‘ദൈവത്തിന്റെ വചനം’ അതിന്റെ ഉറവിട/ഉടമസ്ഥബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: δυνάμεις
  choice: ശക്തികൾ
  rationale: ബഹുവചനമായ δύναμις അത്ഭുതകരമായ ശക്തിപ്രകടനങ്ങളെയോ ശക്തിപ്രവൃത്തികളെയോ സൂചിപ്പിക്കാം. ‘ശക്തികൾ’ ഈ അർത്ഥവ്യാപ്തി ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: τε
  choice: …യും
  rationale: മുൻപുള്ള ഘടകത്തോട് δυνάμεις-നെ ബന്ധിപ്പിക്കുന്ന സംയോജകബലം മലയാളത്തിലെ ‘യും’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: μέλλοντος αἰῶνος
  choice: വരാനിരിക്കുന്ന യുഗത്തിന്റെ
  rationale: ഭാവിയിൽ വരാനുള്ള യുഗത്തെ സൂചിപ്പിക്കുന്ന അന്ത്യകാലാഭിമുഖ്യം കൃത്യമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: മുന്നറിയിപ്പിന്റെ പശ്ചാത്തലത്തിൽ γεύομαι എന്നതിന്റെ അർത്ഥം
  choice: ‘രുചിച്ചറിയുക’ എന്ന രൂപകം നിലനിർത്തി; പങ്കാളിത്തം പൂർണമാണെന്നോ ഉപരിപ്ലവമാണെന്നോ വിവർത്തനം തീരുമാനിക്കുന്നില്ല.
  alternative: അനുഭവിക്കുക; വെറുതെ ഒന്നു രുചിച്ചുനോക്കുക
  rationale: എബ്രായർ 6:4–6-ലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ മൂലപാഠത്തിന്റെ രൂപകവും അവ്യക്തതയും കാത്തുസൂക്ഷിക്കുന്നു.
- issue: അന്ത്യകാല പശ്ചാത്തലത്തിലെ δυνάμεις
  choice: ശക്തികൾ
  alternative: അത്ഭുതങ്ങൾ; വീര്യപ്രവൃത്തികൾ
  rationale: വരാനിരിക്കുന്ന യുഗത്തിന്റെ അത്ഭുതകരമായ പ്രകടനങ്ങളെയും കൂടുതൽ വ്യാപകമായ ദൈവിക ശക്തികളെയും ഈ പദം സൂചിപ്പിക്കാം; ‘ശക്തികൾ’ ആ സാധ്യതകൾ തുറന്നുവയ്ക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഒറ്റവാക്യമായി വായിക്കുമ്പോൾ അപൂർണമായി തോന്നാമെന്നതിനാൽ തുടർച്ച സൂചിപ്പിക്കുന്ന ‘ചെയ്തവർ’യും വിരാമചിഹ്നവും ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
