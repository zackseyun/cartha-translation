  source_fidelity: 'The principal sense is retained: Jesus entered into the previously mentioned inner place, for believers, and holds an eternal high-priestly office patterned after Melchizedek. However, മുന്നോടിയായി functions chiefly as an adverb (''in advance'') and does not adequately retain πρόδρομος as the personal role ''forerunner.'''
