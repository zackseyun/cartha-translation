id: HEB.6.20
reference: Hebrews 6:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅπου πρόδρομος ὑπὲρ ἡμῶν εἰσῆλθεν Ἰησοῦς, κατὰ τὴν τάξιν Μελχισέδεκ ἀρχιερεὺς γενόμενος εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/020.yaml
  text: where Jesus has entered as a forerunner on our behalf[b][a], having become a high priest forever according to the order of Melchizedek.
translation:
  language: ml
  text: മെൽക്കീസേദെക്കിന്റെ ക്രമപ്രകാരം[b] എന്നേക്കും മഹാപുരോഹിതനായിത്തീർന്ന യേശു, നമുക്കുവേണ്ടി[a] മുൻഗാമിയായി അവിടെ പ്രവേശിച്ചിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നമ്മെ പ്രതിനിധീകരിച്ച്.’ ഗ്രീക്ക് പ്രയോഗം മറ്റുള്ളവരുടെ പ്രയോജനത്തിനുവേണ്ടിയുള്ള പ്രവർത്തനത്തെ സൂചിപ്പിക്കാം; ഇവിടെ യേശുവിന്റെ പ്രതിനിധിപരമായ പ്രവേശനത്തിന് ഊന്നൽ ലഭിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘മെൽക്കീസേദെക്കിന്റെ ക്രമത്തിൽ’; സങ്കീർത്തനം 110:4-ന്റെ പ്രതിധ്വനി.
    reason: cross_reference
lexical_decisions:
- source_word: ὅπου
  choice: അവിടെ
  rationale: മുൻവാക്യത്തിലെ തിരശ്ശീലയ്ക്കുള്ളിലെ സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാനാർഥം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: πρόδρομος
  choice: മുന്നോടിയായി
  rationale: മറ്റുള്ളവർക്ക് മുമ്പായി ചെന്നു വഴി തുറക്കുന്നവൻ എന്ന രൂപകം ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ὑπὲρ ἡμῶν
  choice: നമുക്കുവേണ്ടി
  rationale: പ്രതിനിധിത്വത്തിന്റെയും പ്രയോജനത്തിന്റെയും അർഥസാധ്യത നിലനിർത്തുന്നു; ഈ വാക്യം വ്യക്തമായി പറയാത്ത പകരസ്ഥാപനാർഥം നിർബന്ധമായി ചേർക്കുന്നില്ല.
- source_word: εἰσῆλθεν
  choice: പ്രവേശിച്ചിരിക്കുന്നു
  rationale: പ്രവേശനം കഴിഞ്ഞ സംഭവമാണെങ്കിലും അതിന്റെ ഇപ്പോഴും നിലനിൽക്കുന്ന പ്രസക്തി മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: κατὰ τὴν τάξιν Μελχισέδεκ
  choice: മെൽക്കീസേദെക്കിന്റെ ക്രമപ്രകാരം
  rationale: സങ്കീർത്തനം 110:4-ലെ പ്രതിധ്വനിയും മാതൃകയുടെയോ നിയമനത്തിന്റെയോ ആശയവും സംരക്ഷിക്കുന്നു.
- source_word: ἀρχιερεὺς
  choice: മഹാപുരോഹിതൻ
  rationale: എബ്രായലേഖനത്തിന്റെ വാദത്തിൽ കേന്ദ്രസ്ഥാനമുള്ള പുരോഹിതപദവിക്കുള്ള അംഗീകൃതവും കൃത്യവുമായ മലയാളപദം.
- source_word: γενόμενος
  choice: ആയിത്തീർന്ന
  rationale: ഗ്രീക്ക് കൃദന്തരൂപം ഒഴിവാക്കാതെ യേശു മഹാപുരോഹിതപദവി പ്രാപിച്ചതായി വ്യക്തമാക്കുന്നു.
- source_word: εἰς τὸν αἰῶνα
  choice: എന്നേക്കും
  rationale: നിലനിൽക്കുന്ന ശാശ്വതതയെ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: γενόμενος എന്നതും ക്രിസ്തുവിന്റെ വ്യക്തിത്വവും തമ്മിലുള്ള ബന്ധം
  choice: മഹാപുരോഹിതനായിത്തീർന്ന
  alternative: മഹാപുരോഹിതനായി നിയമിക്കപ്പെട്ട
  rationale: മൂലപാഠത്തിലെ ‘ആയിത്തീരുക’ എന്ന ക്രിയാഭാവം നിലനിർത്തിക്കൊണ്ട്, ഇവിടെ പറയുന്നത് യേശുവിന്റെ അസ്തിത്വത്തിന്റെ ആരംഭമോ സ്വഭാവമാറ്റമോ അല്ല, പുരോഹിതപദവിയാണെന്ന് സന്ദർഭം വ്യക്തമാക്കാൻ അനുവദിക്കുന്നു.
- issue: ὑπὲρ ἡμῶν എന്നതിന്റെ അർഥവ്യാപ്തി
  choice: നമുക്കുവേണ്ടി
  alternative: നമ്മുടെ സ്ഥാനത്ത്
  rationale: വിശ്വാസികൾക്കുവേണ്ടിയുള്ള യേശുവിന്റെ പ്രതിനിധിപരമായ പ്രവേശനം പ്രകടമാക്കുന്നു; ഈ വാക്യത്തിൽ മാത്രം നിർബന്ധമല്ലാത്ത കൂടുതൽ സങ്കുചിതമായ പ്രായശ്ചിത്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി. മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിനായി കൃദന്തഭാഗം ആദ്യം കൊണ്ടുവന്നെങ്കിലും ഗ്രീക്ക് പാഠത്തിലെ ആശയബന്ധങ്ങളും ഉദ്ദേശ്യപൂർവമായ അർഥവ്യാപ്തിയും നിലനിർത്തിയിരിക്കുന്നു.
