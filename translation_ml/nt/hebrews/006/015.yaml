id: HEB.6.15
reference: Hebrews 6:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ οὕτως μακροθυμήσας ἐπέτυχεν τῆς ἐπαγγελίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/015.yaml
  text: And so[a], after waiting patiently, he obtained the promise.
translation:
  language: ml
  text: അങ്ങനെ, ക്ഷമയോടെ കാത്തിരുന്നശേഷം, അദ്ദേഹം വാഗ്ദാനം പ്രാപിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വാഗ്ദാനം ചെയ്തതു ലഭിച്ചു.” ഗ്രീക്കിൽ കൂടുതൽ അക്ഷരാർഥമായി “വാഗ്ദാനം പ്രാപിച്ചു” എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ οὕτως
  choice: അങ്ങനെ
  rationale: മുൻവാക്യത്തിലെ അബ്രാഹാമിനെക്കുറിച്ചുള്ള വിവരണവുമായി ബന്ധിപ്പിച്ച്, രീതിയുടെയും ഫലത്തിന്റെയും ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: μακροθυμήσας
  choice: ക്ഷമയോടെ കാത്തിരുന്നശേഷം
  rationale: ദീർഘകാലം ക്ഷമയോടെ നിലനിന്ന് പ്രതീക്ഷിച്ചിരിക്കുക എന്ന ക്രിയയുടെ സന്ദർഭോചിതമായ അർത്ഥവും, കർത്തൃക്രിയയ്ക്കു മുമ്പുള്ള കാലബന്ധവും വ്യക്തമാക്കുന്നു.
- source_word: ἐπέτυχεν
  choice: പ്രാപിച്ചു
  rationale: വിജയകരമായി നേടുക അഥവാ കൈവരിക്കുക എന്ന അർത്ഥം നൽകുന്നു; ഇവിടെ വാഗ്ദാനത്തിന്റെ പൂർണനിവൃത്തി എന്ന് അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: τῆς ἐπαγγελίας
  choice: വാഗ്ദാനം
  rationale: ഗ്രീക്കിലെ നാമപ്രയോഗം നേരിട്ട് നിലനിർത്തുകയും ചുറ്റുപാടിലെ ദൈവിക വാഗ്ദാനവുമായി ഉള്ള പദബന്ധം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ἐπέτυχεν τῆς ἐπαγγελίας എന്നത് വാഗ്ദാനത്തിന്റെ പൂർണനിവൃത്തി ലഭിച്ചതാണോ, അതോ വാഗ്ദാനം പ്രാപിച്ചതാണോ എന്ന ചോദ്യം
  choice: വാഗ്ദാനം പ്രാപിച്ചു
  alternative: വാഗ്ദാനം ചെയ്തതു ലഭിച്ചു
  rationale: ഗ്രീക്ക് പാഠം അക്ഷരാർഥത്തിൽ ‘വാഗ്ദാനം പ്രാപിച്ചു’ എന്നാണ് പറയുന്നത്; പൂർണനിവൃത്തി ലഭിച്ചു എന്ന് വ്യക്തമായി നിർണയിക്കുന്നില്ല. അതിനാൽ എബ്രായലേഖനത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും സാധ്യതയുള്ള അർത്ഥവ്യാപ്തിയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. അബ്രാഹാമിനെ സൂചിപ്പിക്കുന്നതിന് ‘അദ്ദേഹം’ ഉപയോഗിച്ചു; ‘പ്രാപിച്ചു’ എന്നത് തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവം നിലനിർത്തുമ്പോഴും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാണ്.
