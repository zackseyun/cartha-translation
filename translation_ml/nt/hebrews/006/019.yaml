id: HEB.6.19
reference: Hebrews 6:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἣν ὡς ἄγκυραν ἔχομεν τῆς ψυχῆς, ⸀ἀσφαλῆ τε καὶ βεβαίαν καὶ εἰσερχομένην εἰς τὸ ἐσώτερον τοῦ καταπετάσματος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/019.yaml
  text: We have this as an anchor of the soul[a], both secure and firm, and entering into the inner place behind the curtain,
translation:
  language: ml
  text: ഈ പ്രത്യാശ നമുക്ക് ആത്മാവിന്റെ നങ്കൂരമായി ഉണ്ട്; അത് സുരക്ഷിതവും ഉറപ്പുള്ളതും തിരശ്ശീലയ്ക്കപ്പുറമുള്ള അകത്തെ സ്ഥലത്തേക്ക് പ്രവേശിക്കുന്നതുമാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “തിരശ്ശീലയ്ക്കുള്ളിലെ അകത്തെ സ്ഥലത്തേക്ക്” അല്ലെങ്കിൽ “തിരശ്ശീലയ്ക്കപ്പുറത്തേക്ക്.”'
    reason: τοῦ καταπετάσματος എന്ന ഷഷ്ഠീവ്യാകരണപ്രയോഗത്തിന്റെ സാധ്യമായ സ്ഥലബന്ധപരമായ വിവർത്തനങ്ങൾ സൂക്ഷിക്കാൻ.
lexical_decisions:
- source_word: ἣν
  choice: ഈ പ്രത്യാശ
  rationale: സ്ത്രീലിംഗ ആപേക്ഷിക സർവനാമം മുൻവാക്യത്തിലെ ‘പ്രത്യാശ’യെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികവും സൂചന വ്യക്തവുമാക്കാൻ മുൻപദം ആവർത്തിച്ചു.
- source_word: ὡς ἄγκυραν
  choice: നങ്കൂരമായി
  rationale: ὡς സൂചിപ്പിക്കുന്ന ഉപമ നിലനിർത്തുന്നു; മലയാളത്തിൽ ‘നങ്കൂരമായി’ എന്നത് നേരിട്ടും സ്വാഭാവികവുമാണ്.
- source_word: ἔχομεν
  choice: നമുക്ക് ... ഉണ്ട്
  rationale: വർത്തമാനകാല ക്രിയയുടെ ഉടമസ്ഥതാസൂചന ലളിതമായ ആധുനിക മലയാളത്തിൽ നേരിട്ട് അവതരിപ്പിക്കുന്നു.
- source_word: τῆς ψυχῆς
  choice: ആത്മാവിന്റെ
  rationale: ψυχήയുടെ പരമ്പരാഗതവും സന്ദർഭോചിതവുമായ അർഥം നിലനിർത്തുന്നു; അതിനെ ‘മനസ്സ്’ എന്ന പരിമിതമായ മാനസിക അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: ἀσφαλῆ
  choice: സുരക്ഷിതവും
  rationale: നങ്കൂരത്തിന്റെ രൂപകത്തിൽ സുരക്ഷയും ആശ്രയയോഗ്യതയും പ്രകടമാക്കുന്നു; βεβαίαν എന്ന അടുത്ത വിശേഷണത്തിൽനിന്നുള്ള വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: τε καὶ
  choice: '...വും ...വും'
  rationale: രണ്ട് സമന്വിത ഗുണങ്ങൾക്കും തുല്യ ഊന്നൽ നൽകുന്ന ഗ്രീക്ക് ബന്ധത്തിന്റെ ശക്തി മലയാളത്തിലെ ദ്വന്ദ്വപ്രത്യയങ്ങളിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: βεβαίαν
  choice: ഉറപ്പുള്ളതും
  rationale: സ്ഥിരതയും ആശ്രയയോഗ്യതയും സൂചിപ്പിക്കുന്നു; ἀσφαλῆയുടെ ‘സുരക്ഷിതം’ എന്ന അർഥവുമായി ലയിപ്പിക്കുന്നില്ല.
- source_word: εἰσερχομένην
  choice: പ്രവേശിക്കുന്നതുമാണ്
  rationale: വർത്തമാന കൃദന്തരൂപം നങ്കൂരത്തെ തുടർന്നും വിശേഷിപ്പിക്കുന്നു. രൂപകത്തിലെ അസാധാരണമായ നങ്കൂരപ്രവേശനം വിശദീകരിച്ച് ഇല്ലാതാക്കാതെ നിലനിർത്തുന്നു.
- source_word: εἰς τὸ ἐσώτερον
  choice: അകത്തെ സ്ഥലത്തേക്ക്
  rationale: നാമവൽക്കരിച്ച താരതമ്യവിശേഷണം സൂചിപ്പിക്കുന്ന ഉള്ളിലുള്ള മേഖലയെ വ്യക്തമാക്കുന്നു; ‘അതിവിശുദ്ധസ്ഥലം’ എന്ന് വ്യാഖ്യാനിച്ച് അധികമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: τοῦ καταπετάσματος
  choice: തിരശ്ശീലയ്ക്കപ്പുറമുള്ള
  rationale: വിശുദ്ധമന്ദിരത്തിലെ വേർതിരിക്കുന്ന തിരശ്ശീലയുടെ മറുവശം എന്ന സന്ദർഭോചിത സ്ഥലബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു. ഗ്രീക്കിലെ ഷഷ്ഠീവ്യാകരണത്തിന്റെ കൂടുതൽ അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: സ്വർഗീയ വിശുദ്ധമന്ദിരത്തിന്റെ ആരാധനാസംബന്ധിയായ ദൃശ്യരൂപം
  choice: καταπέτασμα എന്നത് ‘തിരശ്ശീല’ എന്നും സ്ഥലബന്ധം ‘തിരശ്ശീലയ്ക്കപ്പുറം’ എന്നും നൽകി.
  alternative: ‘തിരശ്ശീലയ്ക്കുള്ളിൽ’ അല്ലെങ്കിൽ ‘തിരശ്ശീലയ്ക്കപ്പുറത്ത്’
  rationale: എബ്രായലേഖനത്തിന്റെ തുടർസന്ദർഭത്തിൽ വികസിക്കുന്ന സമാഗമകൂടാര/വിശുദ്ധമന്ദിര ദൃശ്യരൂപം ആധുനിക വായനക്കാർക്ക് വ്യക്തമായി നിലനിർത്തുന്നു; അതേസമയം സ്ഥലം ‘അതിവിശുദ്ധസ്ഥലം’ എന്ന് പേരിട്ട് മൂലപാഠത്തേക്കാൾ അധികം വ്യാഖ്യാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘നങ്കൂരം,’ ‘തിരശ്ശീല’ എന്നീ ദൃശ്യപദങ്ങൾ നിലനിർത്തി; നങ്കൂരം അകത്തേക്ക് പ്രവേശിക്കുന്നു എന്ന മൂലപാഠത്തിലെ രൂപകാത്മക സംഘർഷം വിശദീകരിച്ച് നീക്കിയിട്ടില്ല.
