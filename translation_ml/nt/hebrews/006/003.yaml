  text: καὶ τοῦτο ⸀ποιήσομεν ἐάνπερ ἐπιτρέπῃ ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/003.yaml
  text: And this we will do[a], if indeed God permits.
translation:
  language: ml
  text: ഇതും നാം ചെയ്യും[a], ദൈവം അനുവദിക്കുന്നുവെങ്കിൽ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദൈവം അനുവദിക്കുന്നപക്ഷം.” ഗ്രീക്കിലെ “എാൻപെർ” എന്ന കണം ഈ വ്യവസ്ഥയ്ക്ക് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: -ഉം
  rationale: മുൻവാക്യത്തിലെ ആഹ്വാനത്തോട് ഈ പ്രസ്താവനയെ ബന്ധിപ്പിക്കുന്ന സംയോജകം; ‘ഇതും’ എന്ന രൂപം മലയാളത്തിൽ സ്വാഭാവികമായി ആ ബന്ധം പ്രകടമാക്കുന്നു.
- source_word: τοῦτο
  choice: ഇത്
  rationale: തൊട്ടുമുമ്പ് പറഞ്ഞ പ്രവർത്തനത്തെയോ മുന്നോട്ടുപോകുന്ന നടപടിയെയോ സൂചിപ്പിക്കുന്ന ഏകവചന നപുംസകലിംഗ സർവനാമത്തിന്റെ നേരിട്ടുള്ള രൂപം.
- source_word: ποιήσομεν
  choice: നാം ചെയ്യും
  rationale: ποιέω എന്ന ക്രിയയുടെ ഭാവികാല സജീവ നിർദ്ദേശകരൂപം. സന്ദർഭത്തിൽ ‘മുന്നോട്ടുപോകും’ എന്ന ആശയം ഉൾപ്പെട്ടിട്ടുണ്ടെങ്കിലും, ‘ചെയ്യും’ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സംക്ഷിപ്തതയും തുറന്ന അർഥവും നിലനിർത്തുന്നു.
- source_word: ἐάνπερ
  choice: എങ്കിൽത്തന്നെ
  rationale: സാധാരണ വ്യവസ്ഥയെക്കാൾ അല്പം ഊന്നൽ നൽകുന്ന περ എന്ന ഘടകത്തെ മലയാളത്തിലെ ‘-ത്തന്നെ’ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; എന്നാൽ വ്യവസ്ഥയെ അതിരുകടന്ന് വിശദീകരിക്കുന്നില്ല.
- source_word: ἐπιτρέπῃ
  choice: അനുവദിക്കുന്ന
  rationale: വ്യവസ്ഥാസൂചക ഘടനയിലെ വർത്തമാനകാല സജീവരൂപം; ‘അനുവദിക്കുക’ എന്നത് ἐπιτρέπωയുടെ അർഥം കൃത്യവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὁ θεός
  choice: ദൈവം
  rationale: വാക്യത്തിലെ കർത്താവിനെ ആധുനിക നിലവാര മലയാളത്തിലെ പതിവനുസരിച്ച് ‘ദൈവം’ എന്നു നൽകുന്നു; ഗ്രീക്കിലെ നിർദേശക ഉപപദം പ്രത്യേകം പരിഭാഷപ്പെടുത്തേണ്ടതില്ല.
theological_decisions:
- issue: ദൈവത്തിന്റെ അനുമതിയെ സംബന്ധിക്കുന്ന വ്യവസ്ഥാവാക്യം
  choice: രചയിതാവിന്റെ മുന്നോട്ടുപോകാനുള്ള ഉദ്ദേശ്യം വ്യക്തമാക്കുകയും അതിനെ ദൈവത്തിന്റെ അനുമതിക്ക് വിധേയമാക്കുകയും ചെയ്യുന്ന യഥാർഥ വ്യവസ്ഥയായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ദൈവഹിതമെങ്കിൽ’ എന്ന ദുർബലമായ പതിവുപ്രയോഗം, അല്ലെങ്കിൽ ദൈവിക കാരണനിർണയത്തെക്കുറിച്ച് മൂലപാഠത്തേക്കാൾ അധികം പറയുന്ന വ്യാഖ്യാനപരമായ രൂപം.
  rationale: ἐάνπερ എന്നത് ഊന്നലുള്ള യഥാർഥ വ്യവസ്ഥ പ്രകടമാക്കുന്നു. മനുഷ്യന്റെ ഉദ്ദേശ്യവും ദൈവത്തിന്റെ അനുമതിയും തമ്മിലുള്ള പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം ഒരു പ്രത്യേക സിദ്ധാന്തത്തിലേക്ക് ചുരുക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഇതും’ മുൻസന്ദർഭവുമായുള്ള ബന്ധം സ്വാഭാവികമായി നിലനിർത്തുന്നു; ദീർഘവിരാമം മുഖ്യപ്രസ്താവനയും അതിനെ നിയന്ത്രിക്കുന്ന വ്യവസ്ഥയും വ്യക്തമായി വേർതിരിക്കുന്നു.
