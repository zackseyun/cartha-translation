translation:
  language: ml
  text: 'ഇപ്രകാരം പറഞ്ഞു[a]: “തീർച്ചയായും ഞാൻ നിന്നെ അനുഗ്രഹിക്കുകയും തീർച്ചയായും നിന്നെ വർധിപ്പിക്കുകയും ചെയ്യും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ: ‘അനുഗ്രഹിച്ചുകൊണ്ട് ഞാൻ നിന്നെ അനുഗ്രഹിക്കും; വർധിപ്പിച്ചുകൊണ്ട് ഞാൻ നിന്നെ വർധിപ്പിക്കും.’ ഉല്പത്തി 22:17-നെ പ്രതിധ്വനിപ്പിക്കുന്ന ഊന്നൽപ്രയോഗമാണിത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: ഇങ്ങനെ പറഞ്ഞുകൊണ്ട്
  rationale: ദൈവത്തിന്റെ ശപഥത്തിലെ വാക്കുകൾ നേരിട്ട് അവതരിപ്പിക്കുന്ന വർത്തമാനകാല കൃദന്തരൂപം; മലയാളത്തിൽ ഉദ്ധരണിയിലേക്കുള്ള സ്വാഭാവിക ബന്ധം നൽകുന്നു.
- source_word: Εἰ μὴν
  choice: തീർച്ചയായും
  rationale: ഇത് അക്ഷരാർഥത്തിലുള്ള വ്യവസ്ഥയല്ല, ശപഥഭാഷയിലെ ശക്തമായ ഉറപ്പാണ്; ‘തീർച്ചയായും’ ആ ഊന്നൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: εὐλογῶν εὐλογήσω
  choice: ഞാൻ നിന്നെ അനുഗ്രഹിക്കും
  rationale: കൃദന്തവും സമാപികാക്രിയയും ആവർത്തിക്കുന്ന സെമിറ്റിക് ഊന്നൽപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; മൂലരൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: σε
  choice: നിന്നെ
  rationale: അബ്രാഹാമിനെ സൂചിപ്പിക്കുന്ന ഏകവചന ദ്വിതീയപുരുഷ കർമരൂപം.
- source_word: καὶ
  choice: ;
  rationale: രണ്ട് സമാന്തര വാഗ്ദാനങ്ങളെ മലയാളത്തിൽ വ്യക്തമായി ബന്ധിപ്പിക്കാൻ അർധവിരാമം ഉപയോഗിച്ചു; ഗ്രീക്കിലെ καὶ യുടെ ഏകോപനബന്ധം നിലനിൽക്കുന്നു.
- source_word: πληθύνων πληθυνῶ σε
  choice: തീർച്ചയായും നിന്നെ അത്യന്തം വർധിപ്പിക്കും
  rationale: ‘വർധിപ്പിക്കുക’ എന്ന നേരിട്ടുള്ള ക്രിയ നിലനിർത്തിക്കൊണ്ട്, ആവർത്തിത ഗ്രീക്ക് ഘടനയുടെ ശക്തമായ ഊന്നൽ ‘തീർച്ചയായും’ എന്നും വർധനയുടെ വ്യാപ്തി ‘അത്യന്തം’ എന്നും പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: അബ്രാഹാമിനോടുള്ള വാഗ്ദാനത്തിൽ ഉദ്ധരിച്ച ഊന്നലുള്ള ശപഥസൂത്രത്തിന്റെ പരിഭാഷ
  choice: വായനാസൗകര്യമുള്ള മലയാളത്തിൽ രണ്ട് വാഗ്ദാനങ്ങളുടെയും ഉറപ്പ് വ്യക്തമാക്കുകയും, ഗ്രീക്കിലെ ആവർത്തിത ക്രിയാഘടന അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുകയും ചെയ്തു.
  alternative: 'കൂടുതൽ രൂപാനുസൃതമായി: ‘അനുഗ്രഹിച്ചുകൊണ്ട് ഞാൻ നിന്നെ അനുഗ്രഹിക്കും; വർധിപ്പിച്ചുകൊണ്ട് ഞാൻ നിന്നെ വർധിപ്പിക്കും.’'
  rationale: ഉല്പത്തി 22:17-ന്റെ ഗ്രീക്ക് രൂപത്തെ പ്രതിധ്വനിപ്പിക്കുന്ന ആവർത്തനം ശക്തമായ ഊന്നലാണ്. മുഖ്യപാഠത്തിൽ സ്വാഭാവിക മലയാളവും അടിക്കുറിപ്പിൽ രൂപപരമായ വിവരവും നൽകുന്നത് അർഥം, ഊന്നൽ, അന്തർപാഠബന്ധം എന്നിവ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ശപഥത്തിന്റെ ഗൗരവം നിലനിർത്താൻ ‘തീർച്ചയായും’ ഉപയോഗിച്ചു; അസ്വാഭാവികമായ ക്രിയാവർത്തനം മുഖ്യപാഠത്തിൽ ഒഴിവാക്കി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
