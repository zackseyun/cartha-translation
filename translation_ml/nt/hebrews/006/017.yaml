id: HEB.6.17
reference: Hebrews 6:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν ᾧ περισσότερον βουλόμενος ὁ θεὸς ἐπιδεῖξαι τοῖς κληρονόμοις τῆς ἐπαγγελίας τὸ ἀμετάθετον τῆς βουλῆς αὐτοῦ ἐμεσίτευσεν ὅρκῳ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/017.yaml
  text: So when God desired to show more clearly to the heirs of the promise the unchangeable character of his purpose[a], he guaranteed it with an oath[b],
translation:
  language: ml
  text: ഇക്കാരണത്താൽ, ദൈവം തന്റെ ഉദ്ദേശ്യത്തിന്റെ മാറ്റമില്ലാത്ത സ്വഭാവം[a] വാഗ്ദത്തത്തിന്റെ അവകാശികൾക്കു കൂടുതൽ വ്യക്തമായി കാണിച്ചുകൊടുക്കാൻ ആഗ്രഹിച്ചതിനാൽ, ഒരു ശപഥത്താൽ അതിന് ഉറപ്പുനൽകി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “മാറ്റമില്ലാത്ത സ്വഭാവം” എന്നതിന് കൂടുതൽ അക്ഷരാർഥത്തിൽ “മാറ്റമില്ലായ്മ” എന്നും പറയാം.
    reason: lexical_alternative
  - marker: b
    text: “ഉറപ്പുനൽകി” എന്നതിന് കൂടുതൽ അക്ഷരാർഥത്തിൽ “ഒരു ശപഥത്താൽ ഇടപെട്ടു” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: അതുകൊണ്ട്, ...പ്പോൾ
  rationale: മുൻവാക്യത്തിലെ ദൈവശപഥത്തെ ഈ വാക്യവുമായി ബന്ധിപ്പിക്കുന്ന സന്ദർഭോചിതമായ യുക്തി-കാലബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: περισσότερον
  choice: കൂടുതൽ വ്യക്തമായി
  rationale: ἐπιδεῖξαι എന്ന ക്രിയയോടൊപ്പം ദൈവം തന്റെ ഉദ്ദേശ്യം കൂടുതൽ തെളിമയോടെ പ്രകടമാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: βουλόμενος
  choice: ആഗ്രഹിച്ചപ്പോൾ
  rationale: ദൈവത്തിന്റെ ബോധപൂർവവും ലക്ഷ്യബോധമുള്ളതുമായ ഇച്ഛയെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ ഇത് വെറും നിഷ്ഫലമായ ആഗ്രഹമല്ല.
- source_word: ἐπιδεῖξαι
  choice: കാണിച്ചുകൊടുക്കാൻ
  rationale: സ്വീകർത്താക്കൾക്കു തെളിയിച്ചുകാണിക്കുക എന്ന അർഥം സാധാരണക്കാർക്കു മനസ്സിലാകുന്ന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: τοῖς κληρονόμοις τῆς ἐπαγγελίας
  choice: വാഗ്ദത്തത്തിന്റെ അവകാശികൾക്കു
  rationale: അവകാശമായി ലഭിക്കേണ്ട ദൈവിക വാഗ്ദത്തവുമായി ബന്ധപ്പെട്ട ഉടമ്പടി-പശ്ചാത്തലം സംക്ഷിപ്തമായും കൃത്യമായും നിലനിർത്തുന്നു.
- source_word: τὸ ἀμετάθετον τῆς βουλῆς αὐτοῦ
  choice: തന്റെ ഉദ്ദേശ്യത്തിന്റെ മാറ്റമില്ലാത്ത സ്വഭാവം
  rationale: ദൈവത്തിന്റെ നിർണയിച്ച ഉദ്ദേശ്യം മാറ്റാനാവാത്തതാണെന്ന ആശയം സാങ്കേതികമായ പദപ്രയോഗമില്ലാതെ വ്യക്തമാക്കുന്നു.
- source_word: ἐμεσίτευσεν ὅρκῳ
  choice: ഒരു ശപഥത്താൽ അതിന് ഉറപ്പുനൽകി
  rationale: മധ്യസ്ഥനായി ഇടയിൽ നിൽക്കുക എന്ന ക്രിയയുടെ മൂലചിത്രം ഇവിടെ ശപഥംകൊണ്ട് ഉറപ്പുനൽകുക എന്ന സന്ദർഭാർഥത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; കൂടുതൽ അക്ഷരാർഥമുള്ള രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ദൈവത്തിന്റെ βουλή മാറ്റമില്ലാത്തതെന്ന പ്രസ്താവന
  choice: തന്റെ ഉദ്ദേശ്യത്തിന്റെ മാറ്റമില്ലാത്ത സ്വഭാവം
  alternative: തന്റെ ആലോചനയുടെ മാറ്റമില്ലായ്മ
  rationale: വാക്യം ഊന്നുന്നത് ദൈവത്തിന്റെ ഉദ്ദേശ്യം സ്ഥിരവും മാറ്റാനാവാത്തതുമാണെന്നതിലാണ്; പിന്നീടുണ്ടായ സാങ്കേതിക തത്ത്വചിന്താപദങ്ങൾ ചേർക്കാതെ ആ ഊന്നൽ നിലനിർത്തുന്നു.
- issue: ἐμεσίτευσεν എന്ന ക്രിയയും ദൈവത്തിന്റെ ശപഥവും തമ്മിലുള്ള ബന്ധം
  choice: ഒരു ശപഥത്താൽ അതിന് ഉറപ്പുനൽകി
  alternative: ഒരു ശപഥവുമായി ഇടയിൽ നിന്നു
  rationale: ശപഥത്തിലൂടെ വാഗ്ദത്തത്തിന്റെ അവകാശികൾക്കു അധിക ഉറപ്പു നൽകുന്നതാണ് സന്ദർഭത്തിലെ പ്രവർത്തനാർഥം. എന്നാൽ ക്രിയയിലെ മധ്യസ്ഥതയുടെ ചിത്രം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. “വാഗ്ദത്തം,” “അവകാശികൾ,” “ശപഥം” എന്നീ ബൈബിൾസന്ദർഭത്തിൽ പരിചിതമായ പദങ്ങൾ നിലനിർത്തി; ദുഷ്കരമായ സാങ്കേതിക പദങ്ങൾ ഒഴിവാക്കി. രണ്ട് അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനവാചകത്തിൽ ചേർത്തിട്ടുണ്ട്.
