revisions:
- from: അതുകൊണ്ട്, ദൈവം തന്റെ ഉദ്ദേശ്യത്തിന്റെ മാറ്റമില്ലാത്ത സ്വഭാവം വാഗ്ദത്തത്തിന്റെ അവകാശികൾക്കു കൂടുതൽ വ്യക്തമായി കാണിച്ചുകൊടുക്കാൻ ആഗ്രഹിച്ചപ്പോൾ, ഒരു ശപഥത്താൽ അതിന് ഉറപ്പുനൽകി.[a][b]
