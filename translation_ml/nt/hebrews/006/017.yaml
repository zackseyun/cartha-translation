  rationale: മുഖ്യഅർഥം മാറ്റാതെ, ഗ്രീക്ക് പങ്കുപ്രയോഗത്തിന്റെ ബന്ധം മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികമാക്കി. അടിക്കുറിപ്പുകൾ അവ വ്യാഖ്യാനിക്കുന്ന പദങ്ങളിലേക്കു മാറ്റി സ്ഥാപിക്കുകയും ἐμεσίτευσεν-ന്റെ അക്ഷരാർഥപരമായ ബദൽ കൃത്യമാക്കുകയും ചെയ്തു.
