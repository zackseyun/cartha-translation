source:
  edition: SBLGNT
  text: ἵνα μὴ νωθροὶ γένησθε, μιμηταὶ δὲ τῶν διὰ πίστεως καὶ μακροθυμίας κληρονομούντων τὰς ἐπαγγελίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/012.yaml
  text: so that you may not become sluggish[a], but imitators of those who through faith and patience inherit the promises.
translation:
  language: ml
  text: അങ്ങനെ, നിങ്ങൾ മന്ദതയുള്ളവരായിത്തീരാതെ, വിശ്വാസത്താലും[a] ക്ഷമയാലും വാഗ്ദാനങ്ങൾ അവകാശമായി പ്രാപിക്കുന്നവരെ അനുകരിക്കുന്നവരായിരിക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വിശ്വസ്തതയാലും ക്ഷമയാലും.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദത്തിന് ചില സന്ദർഭങ്ങളിൽ “വിശ്വസ്തത” അല്ലെങ്കിൽ “ആശ്രയം” എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μὴ
  choice: അങ്ങനെ ... -ാതെ
  rationale: മുൻവാക്യത്തിലെ പ്രബോധനവുമായി ഈ വാക്യത്തെ ബന്ധിപ്പിക്കുന്ന ഉദ്ദേശ്യ/ഫലഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: νωθροὶ
  choice: ഉത്സാഹംകെട്ടവർ
  rationale: പ്രതികരണത്തിലും പരിശ്രമത്തിലും മന്ദത കാണിക്കുന്ന അവസ്ഥയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്. ‘മടിയന്മാർ’ എന്നത് അമിതമായ ധാർമിക കുറ്റപ്പെടുത്തലായി കേൾക്കാം; ‘ഉത്സാഹംകെട്ടവർ’ സന്ദർഭത്തിലെ ആത്മീയ ജാഗ്രതക്കുറവ് സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: γένησθε
  choice: ആയിത്തീരുക
  rationale: γίνομαι എന്ന ക്രിയയുടെ ഇവിടെ പ്രസക്തമായ ‘ഒരു അവസ്ഥയിലേക്കു വന്നുചേരുക’ എന്ന ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: μιμηταὶ
  choice: അനുകരിക്കുന്നവർ
  rationale: മറ്റുള്ളവരുടെ മാതൃക പിന്തുടരുക എന്ന μιμητής എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥം നൽകുന്നു.
- source_word: διὰ πίστεως
  choice: വിശ്വാസത്താൽ
  rationale: πίστις എന്ന പദത്തിന്റെ സാധാരണവും വിശാലവുമായ അർഥം നിലനിർത്തുന്നു; ‘വിശ്വസ്തത’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: μακροθυμίας
  choice: ദീർഘക്ഷമയാൽ
  rationale: ദീർഘകാലം ക്ഷമയോടെ നിലനിൽക്കുക എന്ന μακροθυμίαയുടെ ഭാവം ചുരുക്കമായും മാന്യമായും നൽകുന്നു.
- source_word: κληρονομούντων
  choice: അവകാശമായി പ്രാപിക്കുന്നവർ
  rationale: ‘അവകാശമായി ലഭിക്കുക’ എന്ന κληρονομέωയുടെ അർഥം വ്യക്തമാക്കുകയും വർത്തമാന കൃദന്തരൂപത്തിന്റെ സ്വഭാവസൂചകമായ ഭാവം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: τὰς ἐπαγγελίας
  choice: വാഗ്ദാനങ്ങൾ
  rationale: ഗ്രീക്കിലെ വ്യക്തമായ ബഹുവചനം സംരക്ഷിക്കുകയും എബ്രായലേഖനത്തിലെ ദൈവിക വാഗ്ദാനങ്ങളുടെ പ്രമേയവുമായി പൊരുത്തപ്പെടുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: πίστις എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി
  choice: വിശ്വാസം
  alternative: വിശ്വസ്തത / ആശ്രയം
  rationale: ഈ സന്ദർഭത്തിൽ ദൈവത്തിലുള്ള ആശ്രയവും സ്ഥിരമായ വിശ്വസ്തതയും ഉൾക്കൊള്ളാവുന്നതാണ്. പ്രധാന പാഠത്തിൽ ‘വിശ്വാസം’ ഉപയോഗിക്കുന്നത് അർഥവ്യാപ്തി ചുരുക്കാതെ നിലനിർത്തുന്നു; ‘വിശ്വസ്തത’ എന്ന സാദ്ധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവമുള്ള ശൈലി. ‘ഉത്സാഹംകെട്ടവർ’ എന്ന പ്രയോഗം പഴഞ്ചൻ ഭാഷയും അമിതമായ കുറ്റപ്പെടുത്തലും ഒഴിവാക്കുന്നു; ‘ദീർഘക്ഷമ’ ബൈബിൾസന്ദർഭത്തിന് യോജിച്ച ചുരുക്കവും മാന്യവുമായ പദമായി ഉപയോഗിച്ചു.
