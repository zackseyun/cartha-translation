id: HEB.6.1
reference: Hebrews 6:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Διὸ ἀφέντες τὸν τῆς ἀρχῆς τοῦ Χριστοῦ λόγον ἐπὶ τὴν τελειότητα φερώμεθα, μὴ πάλιν θεμέλιον καταβαλλόμενοι μετανοίας ἀπὸ νεκρῶν ἔργων, καὶ πίστεως ἐπὶ θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/001.yaml
  text: Therefore[a], leaving the elementary message about the Messiah, let us be carried on to maturity, not laying again a foundation of repentance from dead works and of faith toward God[d][c][b],
translation:
  language: ml
  text: അതുകൊണ്ട്, മശീഹയെക്കുറിച്ചുള്ള പ്രാരംഭ ഉപദേശം[a] പിന്നിട്ട്, നിർജീവ പ്രവൃത്തികളിൽനിന്നുള്ള മാനസാന്തരത്തിന്റെയും ദൈവത്തിലേക്കുള്ള വിശ്വാസത്തിന്റെയും[d] അടിസ്ഥാനം വീണ്ടും ഇടാതെ, നാം പക്വതയിലേക്കു[b] നയിക്കപ്പെടട്ടെ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘മശീഹയുടെ പ്രാരംഭ ഉപദേശം’ അല്ലെങ്കിൽ ‘മശീഹയെക്കുറിച്ചുള്ള അടിസ്ഥാന ഉപദേശം.’
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘സമ്പൂർണതയിലേക്കു’ അല്ലെങ്കിൽ ‘പരിപൂർണതയിലേക്കു.’
    reason: lexical_alternative
  - marker: c
    text: 'അല്ലെങ്കിൽ, ‘മുന്നോട്ടുപോകാം.’ ഗ്രീക്കിൽ നിഷ്ക്രിയഭാവമാണ്: അക്ഷരാർഥത്തിൽ, ‘നയിക്കപ്പെടട്ടെ’ അല്ലെങ്കിൽ ‘കൊണ്ടുപോകപ്പെടട്ടെ.’'
    reason: lexical_alternative
  - marker: d
    text: അല്ലെങ്കിൽ, ‘ദൈവത്തിലുള്ള വിശ്വാസം.’
    reason: alternative_reading
lexical_decisions:
- source_word: Διὸ
  choice: അതുകൊണ്ട്
  rationale: മുൻസന്ദർഭത്തിൽനിന്നുള്ള നിഗമനത്തെ അടിസ്ഥാനമാക്കി ഉപദേശം അവതരിപ്പിക്കുന്ന ബന്ധകപദം.
- source_word: ἀφέντες τὸν τῆς ἀρχῆς τοῦ Χριστοῦ λόγον
  choice: മശീഹയെക്കുറിച്ചുള്ള പ്രാരംഭ ഉപദേശം പിന്നിട്ടു
  rationale: λόγος ഇവിടെ സന്ദേശം/ഉപദേശം എന്നും τῆς ἀρχῆς അടിസ്ഥാനഘട്ടം എന്നും സൂചിപ്പിക്കുന്നു. ‘പിന്നിട്ടു’ എന്നത് ഉപേക്ഷിക്കലല്ല, അതിൽനിന്ന് മുന്നോട്ടുപോകലാണ് പ്രകടമാക്കുന്നത്.
- source_word: Χριστοῦ
  choice: മശീഹ
  rationale: ഇവിടെ Χριστός അഭിഷിക്തനായവന്റെ സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നു.
- source_word: ἐπὶ τὴν τελειότητα
  choice: പക്വതയിലേക്ക്
  rationale: അടിസ്ഥാന ഉപദേശത്തിൽനിന്ന് പൂർണവളർച്ചയിലേക്കുള്ള പുരോഗതിയാണ് സന്ദർഭം; പാപരഹിതമായ പരിപൂർണത എന്ന ധാരണ അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: φερώμεθα
  choice: നാം ... നയിക്കപ്പെടുക
  rationale: വർത്തമാനകാല നിഷ്ക്രിയ ഉപദേശകഭാവത്തിന്റെ അർഥം നിലനിർത്തുന്നു; പുരോഗതി സ്വശക്തികൊണ്ടു മാത്രം സംഭവിക്കുന്നതായി അവതരിപ്പിക്കുന്നില്ല.
- source_word: θεμέλιον καταβαλλόμενοι
  choice: അടിസ്ഥാനം വീണ്ടും ഇടാതിരിക്കുക
  rationale: മൂലപാഠത്തിലെ നിർമാണരൂപകം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: μετανοίας ἀπὸ νεκρῶν ἔργων
  choice: നിർജീവ പ്രവൃത്തികളിൽനിന്നുള്ള മാനസാന്തരം
  rationale: μετάνοιαയുടെ സ്ഥാപിതവും സ്വാഭാവികവുമായ അർഥം നൽകുന്നു; νεκρῶν ἔργων എന്ന രൂപകം മരണത്തിലേക്കു നയിക്കുന്ന പ്രവൃത്തികൾ എന്ന ഒറ്റ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: πίστεως ἐπὶ θεόν
  choice: ദൈവത്തിലേക്കുള്ള വിശ്വാസം
  rationale: ἐπί + accusative-ന്റെ ദിശാസൂചന നിലനിർത്തുന്നു; ‘ദൈവത്തിലുള്ള വിശ്വാസം’ എന്നതും സാധ്യതയുള്ള സ്വാഭാവിക പരിഭാഷയാണ്.
theological_decisions:
- issue: പ്രാരംഭ മശീഹാ ഉപദേശം ‘വിടുക’ എന്നത് അതിനെ നിരാകരിക്കലാണോ, അതിൽനിന്ന് മുന്നോട്ടുപോകലാണോ
  choice: ‘പിന്നിട്ടു’ എന്നു പരിഭാഷപ്പെടുത്തി, നിലവിലെ ശ്രദ്ധ അടിസ്ഥാനപാഠങ്ങളിൽനിന്ന് പക്വതയിലേക്കു നീങ്ങുന്നതായി സൂചിപ്പിച്ചു.
  alternative: ‘വിട്ടിട്ട്’ അല്ലെങ്കിൽ ‘ഉപേക്ഷിച്ച്’
  rationale: ‘അടിസ്ഥാനം വീണ്ടും ഇടാതിരിക്കുക’ എന്ന തുടർവാക്യം നിരാകരണമല്ല, അടിസ്ഥാനത്തിന്മേൽ തുടർന്നുള്ള വളർച്ചയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് കാണിക്കുന്നു.
- issue: τελειότης എന്നത് പരിപൂർണതയോ പക്വതയോ
  choice: പക്വത
  alternative: പരിപൂർണത; സമ്പൂർണത
  rationale: അടിസ്ഥാന ഉപദേശവും തുടർന്നുള്ള ആത്മീയ വളർച്ചയും തമ്മിലുള്ള വൈരുധ്യത്തിൽ ‘പക്വത’യാണ് ഉദ്ദേശ്യം ഏറ്റവും വ്യക്തമായി അറിയിക്കുന്നത്.
- issue: φερώμεθα എന്ന നിഷ്ക്രിയരൂപം നിലനിർത്തണമോ
  choice: ‘നയിക്കപ്പെടുക’ എന്നു നിഷ്ക്രിയഭാവം നിലനിർത്തി.
  alternative: ‘മുന്നോട്ടുപോകുക’
  rationale: ഗ്രീക്ക് രൂപത്തിലെ നിഷ്ക്രിയത്വം സംരക്ഷിക്കുകയും പുരോഗതിയുടെ കർത്താവിനെ പാഠം പറയുന്നതിലധികം നിർണ്ണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: νεκρῶν ἔργων എന്നതിന്റെ അർഥം
  choice: നിർജീവ പ്രവൃത്തികൾ
  alternative: മരണത്തിലേക്കു നയിക്കുന്ന പ്രവൃത്തികൾ; മരിച്ച പ്രവൃത്തികൾ
  rationale: മൂലത്തിലെ രൂപകപരമായ അവ്യക്തത നിലനിർത്തുന്നു; ഫലശൂന്യമായ പ്രവൃത്തികളോ മരണബന്ധിയായ പ്രവൃത്തികളോ എന്ന വ്യാഖ്യാനങ്ങളിൽ ഒന്ന് മാത്രം നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. അടിസ്ഥാനമിടൽ എന്ന രൂപകം സംരക്ഷിച്ചിരിക്കുന്നു; സാങ്കേതികമോ വിഭാഗീയമോ ആയ പദപ്രയോഗം ഒഴിവാക്കി.
