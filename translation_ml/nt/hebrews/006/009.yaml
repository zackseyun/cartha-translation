id: HEB.6.9
reference: Hebrews 6:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Πεπείσμεθα δὲ περὶ ὑμῶν, ἀγαπητοί, τὰ κρείσσονα καὶ ἐχόμενα σωτηρίας, εἰ καὶ οὕτως λαλοῦμεν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/009.yaml
  text: But we are convinced of better things concerning you[a], beloved—things that belong to salvation—even though we speak in this way.
translation:
  language: ml
  text: എന്നാൽ, പ്രിയരേ, ഞങ്ങൾ ഇങ്ങനെ സംസാരിക്കുന്നെങ്കിലും, നിങ്ങളെക്കുറിച്ച് രക്ഷയോടു ബന്ധപ്പെട്ടതും കൂടുതൽ നല്ലതായതുമായ കാര്യങ്ങൾ ഉണ്ടെന്ന് ഞങ്ങൾക്ക് ഉറപ്പുണ്ട്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘രക്ഷയെ അനുഗമിക്കുന്ന കാര്യങ്ങൾ.’
    reason: ἐχόμενα σωτηρίας എന്ന പ്രയോഗത്തിന് സാധ്യമായ മറ്റൊരു അർഥബന്ധം രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: Πεπείσμεθα
  choice: ഞങ്ങൾക്ക് ഉറപ്പുണ്ട്
  rationale: സമ്പൂർണകാലരൂപം ഉറച്ച ബോധ്യത്തിന്റെ നിലയെ സൂചിപ്പിക്കുന്നു. ആ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യങ്ങളിലെ കഠിനമായ മുന്നറിയിപ്പിൽനിന്നുള്ള വൈരുധ്യാത്മക തിരിവ് വ്യക്തമാക്കുന്നു.
- source_word: περὶ ὑμῶν
  choice: നിങ്ങളുടെ കാര്യത്തിൽ
  rationale: περί + ഷഷ്ഠി വിഭക്തിയുടെ ‘നിങ്ങളെ സംബന്ധിച്ച്’ എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀγαπητοί
  choice: പ്രിയരേ
  rationale: സ്നേഹപൂർവമായ സംബോധനയുടെ ഊഷ്മളതയും മാന്യതയും നിലനിർത്തുന്നു.
- source_word: τὰ κρείσσονα
  choice: ഇതിലും നല്ലത്
  rationale: തൊട്ടുമുൻപുള്ള മുന്നറിയിപ്പിനോടുള്ള താരതമ്യഭാവം വ്യക്തമാക്കിക്കൊണ്ട് നപുംസക ബഹുവചന വിശേഷണത്തിന്റെ വസ്തുസൂചക പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐχόμενα σωτηρίας
  choice: രക്ഷയോടു ബന്ധപ്പെട്ടത്
  rationale: രക്ഷയുമായുള്ള ബന്ധം വ്യക്തമാക്കുന്നു; അവ തെളിവുകളോ ഫലങ്ങളോ കാരണങ്ങളോ ആണെന്ന് നിർവചിക്കാതെ ഗ്രീക്കിലെ വിശാലത സംരക്ഷിക്കുന്നു.
- source_word: εἰ καὶ
  choice: സംസാരിക്കുന്നെങ്കിലും
  rationale: വാക്യത്തിലെ concessive അർഥമായ ‘ഇങ്ങനെ സംസാരിച്ചാലും’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: οὕτως
  choice: ഇങ്ങനെ
  rationale: മുൻപുള്ള മുന്നറിയിപ്പിന്റെ രീതിയെയും ഉള്ളടക്കത്തെയും സംക്ഷിപ്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: λαλοῦμεν
  choice: ഞങ്ങൾ സംസാരിക്കുന്നു
  rationale: വർത്തമാനകാല ക്രിയയുടെ ലളിതവും നേരിട്ടുമുള്ള അർഥം നിലനിർത്തുന്നു.
theological_decisions:
- issue: മുന്നറിയിപ്പിന്റെ പശ്ചാത്തലത്തിൽ ἐχόμενα എന്നതും σωτηρίας എന്നതും തമ്മിലുള്ള ബന്ധം
  choice: ‘രക്ഷയോടു ബന്ധപ്പെട്ടതുമായ കാര്യങ്ങൾ’ എന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘രക്ഷയെ അനുഗമിക്കുന്ന കാര്യങ്ങൾ’
  rationale: ശ്രോതാക്കളുടെ ജീവിതത്തിൽ രക്ഷയുമായി യഥാർഥമായി ബന്ധപ്പെട്ട യാഥാർഥ്യങ്ങൾ ഉണ്ടെന്ന വിശ്വാസം വാക്യം പ്രകടിപ്പിക്കുന്നു. എന്നാൽ അവ രക്ഷയുടെ തെളിവുകളോ അനുഗാമികളോ ഫലങ്ങളോ ആണെന്ന് ഗ്രീക്ക് നിർബന്ധമായി വ്യക്തമാക്കുന്നില്ല. അതിനാൽ പിന്നീടുള്ള സിദ്ധാന്തവിവാദങ്ങൾ പരിഭാഷയിൽ തീർപ്പാക്കാതെ പാഠത്തിന്റെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ‘പ്രിയരേ’ പാസ്റ്ററൽ ഊഷ്മളത നിലനിർത്തുന്നു; വാക്യക്രമം മലയാളത്തിന്റെ സ്വാഭാവിക പ്രവാഹത്തിന് അനുസരിച്ച് ക്രമപ്പെടുത്തി.
