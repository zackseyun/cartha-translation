id: HEB.6.6
reference: Hebrews 6:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ παραπεσόντας, πάλιν ἀνακαινίζειν εἰς μετάνοιαν, ἀνασταυροῦντας ἑαυτοῖς τὸν υἱὸν τοῦ θεοῦ καὶ παραδειγματίζοντας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/006.yaml
  text: and having fallen away[a], to renew them again to repentance[b], since they are crucifying again for themselves the Son of God and exposing him to public shame.
translation:
  language: ml
  text: വഴിതെറ്റിപ്പോയവരെയും[a] വീണ്ടും മാനസാന്തരത്തിലേക്കു പുതുക്കുക[b]; കാരണം, അവർ തങ്ങൾക്കുതന്നെ ദൈവപുത്രനെ വീണ്ടും ക്രൂശിക്കുകയും അവനെ പരസ്യമായ അപമാനത്തിന് ഇരയാക്കുകയും ചെയ്യുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വിശ്വാസത്യാഗം ചെയ്തവരെയും.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് ഗുരുതരമായ പിന്മാറ്റത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവർ തങ്ങൾക്കുതന്നെ ദൈവപുത്രനെ വീണ്ടും ക്രൂശിക്കുകയും അവനെ പരസ്യമായ അപമാനത്തിന് ഇരയാക്കുകയും ചെയ്തുകൊണ്ടിരിക്കുമ്പോൾ.’ ഗ്രീക്കിലെ ഈ ക്രിയാരൂപങ്ങളെ കാരണം വിശദീകരിക്കുന്നവയായോ ഒരേസമയം നടക്കുന്ന പ്രവൃത്തികളെ സൂചിപ്പിക്കുന്നവയായോ മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: παραπεσόντας
  choice: വീണുപോയവരെയും
  rationale: ഗൗരവമുള്ള പിന്മാറ്റത്തെ സൂചിപ്പിക്കുന്ന ഭൂതകാല പങ്കാളിത്തരൂപം. സാങ്കേതികമായ ഒരു പിൽക്കാല ദൈവശാസ്ത്ര നിർവചനം മുഖ്യവാചകത്തിൽ അടിച്ചേൽപ്പിക്കാതെ മുന്നറിയിപ്പിന്റെ തീവ്രത നിലനിർത്തുന്നു.
- source_word: πάλιν ἀνακαινίζειν
  choice: വീണ്ടും ... പുതുക്കുക
  rationale: πάλιν സ്വാഭാവികമായി ἀνακαινίζειν-നെ വിശേഷിപ്പിക്കുന്നു; മുൻ നിലയിലേക്കുള്ള പുനഃസ്ഥാപനമെന്ന ആശയം നേരിട്ട് നൽകുന്നു.
- source_word: εἰς μετάνοιαν
  choice: മാനസാന്തരത്തിലേക്ക്
  rationale: εἰς എന്നതിന്റെ ലക്ഷ്യദിശയും μετάνοια എന്നതിന്റെ പശ്ചാത്താപപൂർവമായ തിരിഞ്ഞുവരവെന്ന അർഥവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἀνασταυροῦντας
  choice: വീണ്ടും ക്രൂശിക്കുകയും
  rationale: ἀνά-യുടെ ആവർത്തനബോധവും വർത്തമാന പങ്കാളിത്തരൂപത്തിന്റെ തുടരുന്ന പ്രവൃത്തിബോധവും തുടർന്നുള്ള ‘ചെയ്യുന്നു’ എന്ന ക്രിയയോടൊപ്പം പ്രകടമാക്കുന്നു.
- source_word: ἑαυτοῖς
  choice: തങ്ങൾക്കുതന്നെ
  rationale: പ്രതിഫലനാത്മക ദത്തിവിന്റെ ‘തങ്ങളോടു ബന്ധപ്പെട്ട്/തങ്ങൾക്കായി’ എന്ന ബോധം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τὸν υἱὸν τοῦ θεοῦ
  choice: ദൈവപുത്രനെ
  rationale: ക്രിസ്തുവിനെക്കുറിച്ചുള്ള ഈ പദവിയുടെ നേരിട്ടുള്ള, നിലവാരമുള്ള മലയാളരൂപം.
- source_word: παραδειγματίζοντας
  choice: പരസ്യമായ അപമാനത്തിന് ഇരയാക്കുകയും
  rationale: പൊതുജനമധ്യേ നിന്ദയ്ക്കും ലജ്ജയ്ക്കും തുറന്നുകാട്ടുക എന്ന ക്രിയയുടെ സാമൂഹിക അർഥം വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: മുൻ വാക്യത്തിലെ ‘അസാധ്യമാണ്’ എന്ന ആശയം ഈ വാക്യത്തിൽ ആവർത്തിക്കണമോ
  choice: പുതിയ സമാപകക്രിയ ചേർക്കാതെ, മുൻ വാക്യത്തിൽ ആരംഭിച്ച വാക്യഘടനയുടെ ഭാഗമായി വിവർത്തനം ചെയ്തു.
  alternative: ‘വീണുപോയവരെ വീണ്ടും മാനസാന്തരത്തിലേക്കു പുതുക്കുക അസാധ്യമാണ്’ എന്ന് സ്വതന്ത്രവാക്യമാക്കുക.
  rationale: ഗ്രീക്കിൽ ഈ വാക്യം എബ്രായർ 6:4–6-ലെ മുൻ വാക്യഘടനയെ ആശ്രയിക്കുന്നു. ആ ആശ്രിതത്വം സംരക്ഷിക്കുന്നു.
- issue: παραπίπτω സൂചിപ്പിക്കുന്ന വീഴ്ചയുടെ ദൈവശാസ്ത്രസ്വഭാവം
  choice: ‘വീണുപോയവർ’ എന്നു നൽകി; രക്ഷ നഷ്ടപ്പെടൽ, പ്രത്യക്ഷവിശ്വാസം, അന്തിമ വിശ്വാസത്യാഗം എന്നിവയിൽ ഒന്നായി നിർവചിച്ചില്ല.
  alternative: ‘വിശ്വാസത്യാഗം ചെയ്തവർ’ എന്നു നൽകുക.
  rationale: ഗ്രീക്ക് ഗുരുതരമായ പിന്മാറ്റം സൂചിപ്പിക്കുന്നുവെങ്കിലും, പിന്നീടുണ്ടായ വിഭാഗീയ വ്യാഖ്യാനങ്ങളിൽ ഒന്ന് അത് സ്വതവേ തീർപ്പാക്കുന്നില്ല.
- issue: ἀνασταυροῦντας, παραδειγματίζοντας എന്നീ പങ്കാളിത്തരൂപങ്ങളുടെ ബന്ധം
  choice: ‘കാരണം’ ഉപയോഗിച്ച് വിശദീകരണപരമായ/കാരണപരമായ ബന്ധം മുഖ്യവാചകത്തിൽ നൽകി.
  alternative: ‘അവർ ... ചെയ്തുകൊണ്ടിരിക്കുമ്പോൾ’ എന്ന സമകാലിക വായന.
  rationale: പങ്കാളിത്തരൂപങ്ങൾ പുതുക്കലിനെക്കുറിച്ചുള്ള പ്രസ്താവനയുടെ കാരണം വിശദീകരിക്കുന്നതായി വായിക്കാം; എന്നാൽ സമകാലിക അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വാക്യം മുൻസന്ദർഭത്തെ ആശ്രയിക്കുന്ന ഗ്രീക്ക് ഘടന സംരക്ഷിക്കുന്നു; ‘മാനസാന്തരം’, ‘ദൈവപുത്രൻ’, ‘ക്രൂശിക്കുക’ തുടങ്ങിയ വ്യാപകമായി മനസ്സിലാകുന്ന ബൈബിൾപദങ്ങൾ നിലനിർത്തിയിരിക്കുന്നു.
