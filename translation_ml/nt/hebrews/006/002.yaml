lexical_decisions:
- source_word: βαπτισμῶν
  choice: ശുദ്ധീകരണസ്നാനങ്ങൾ
  rationale: ബഹുവചനരൂപവും ആചാരപരമായ ശുദ്ധീകരണകഴുകലുകളെ സൂചിപ്പിക്കാവുന്ന ഗ്രീക്ക് പ്രയോഗവും നിലനിർത്തുന്നു. ‘സ്നാനങ്ങൾ’ എന്ന പദം മാത്രം ഉപയോഗിക്കുന്നതിനെക്കാൾ ഉദ്ദേശിച്ച ആചാരപരമായ അർഥം വ്യക്തമാക്കുകയും, ക്രിസ്തീയ സ്നാനം മാത്രമാണെന്ന് അനാവശ്യമായി പരിമിതപ്പെടുത്താതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: διδαχὴν
  choice: ഉപദേശം
  rationale: അടിസ്ഥാനവിഷയങ്ങളെക്കുറിച്ചുള്ള ബോധനത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: ἐπιθέσεώς τε χειρῶν
  choice: കൈവെക്കൽ
  rationale: ഈ അംഗീകൃത ആചാരത്തെ ലളിതമായും സ്വാഭാവികമായും സൂചിപ്പിക്കുന്ന മലയാളപ്രയോഗം.
- source_word: ἀναστάσεώς τε νεκρῶν
  choice: മരിച്ചവരുടെ പുനരുത്ഥാനം
  rationale: νεκρῶν എന്ന ബഹുവചനത്തിന്റെ കൂട്ടായ അർഥവും ἀνάστασις എന്നതിന്റെ സ്ഥാപിതമായ അർഥവും നിലനിർത്തുന്നു.
- source_word: κρίματος αἰωνίου
  choice: നിത്യമായ ന്യായവിധി
  rationale: വിധിയെ ശിക്ഷാവിധിയായി മാത്രം ചുരുക്കാതെ κρίμα എന്ന പദത്തിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു; αἰώνιος ഇവിടെ സൂചിപ്പിക്കുന്ന അന്തിമവും നിത്യവുമായ സ്വഭാവവും വ്യക്തമാക്കുന്നു.
- source_word: τε ... τε καὶ
  choice: …, …, … എന്നിവയും
  rationale: ഗ്രീക്കിലെ പട്ടികാസംയോജനത്തെ സ്വാഭാവികമായ മലയാളഘടനയിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: βαπτισμῶν എന്നതിന്റെ അർഥം
  choice: ‘ശുദ്ധീകരണസ്നാനങ്ങൾ’ എന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘സ്നാനങ്ങൾ’ അഥവാ ‘ജ്ഞാനസ്നാനങ്ങൾ’
  rationale: ബഹുവചനവും ഗ്രീക്ക് പദത്തിന്റെ വിപുലമായ ആചാരപരമായ ഉപയോഗവും കണക്കിലെടുത്ത്, ഇത് ക്രിസ്തീയ സ്നാനത്തെ മാത്രം സൂചിപ്പിക്കുന്നുവെന്ന് തീർപ്പാക്കാതെ ആചാരപരമായ ശുദ്ധീകരണസ്നാനങ്ങൾ എന്ന സാധ്യത മുൻനിർത്തുന്നു. മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: κρίματος αἰωνίου എന്നതിന്റെ വ്യാപ്തി
  choice: ‘നിത്യമായ ന്യായവിധി’ എന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘നിത്യശിക്ഷാവിധി’
  rationale: ഗ്രീക്ക് പാഠം ‘വിധി’ എന്നാണ് പറയുന്നത്; ‘ശിക്ഷാവിധി’ എന്ന് പരിഭാഷപ്പെടുത്തുന്നത് ഫലത്തെ അനാവശ്യമായി ചുരുക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധത്തിൽ മാന്യവും സംക്ഷിപ്തവുമായ ശൈലി സ്വീകരിച്ചു. വാക്യം മുൻവാക്യത്തിൽ ആരംഭിച്ച പട്ടികയുടെ തുടർച്ചയായതിനാൽ അവസാനം ‘എന്നിവയും’ ഉപയോഗിച്ചു.
