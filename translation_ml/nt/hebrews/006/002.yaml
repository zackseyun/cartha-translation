translation:
  language: ml
  text: സ്നാനങ്ങളെക്കുറിച്ചുള്ള ഉപദേശം[a], കൈവയ്പ്, മരിച്ചവരുടെ പുനരുത്ഥാനം, നിത്യമായ ന്യായവിധി എന്നിവയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആചാരപരമായ കഴുകലുകളെക്കുറിച്ചുള്ള ഉപദേശം.” ഗ്രീക്കിലെ ബഹുവചനം ക്രിസ്തീയ സ്നാനത്തെ മാത്രം സൂചിപ്പിക്കണമെന്നില്ല; പൊതുവായോ ആചാരപരമായോ ഉള്ള കഴുകലുകളെ സൂചിപ്പിക്കാം.
