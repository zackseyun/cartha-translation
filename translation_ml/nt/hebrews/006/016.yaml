id: HEB.6.16
reference: Hebrews 6:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ἄνθρωποι γὰρ κατὰ τοῦ μείζονος ὀμνύουσιν, καὶ πάσης αὐτοῖς ἀντιλογίας πέρας εἰς βεβαίωσιν ὁ ὅρκος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/016.yaml
  text: For people swear by one greater than themselves[b][a], and for them an oath is the end of every dispute for confirmation.
translation:
  language: ml
  text: മനുഷ്യർ[a] തങ്ങളേക്കാൾ വലിയവനെച്ചൊല്ലി ശപഥം ചെയ്യുന്നു; സ്ഥിരീകരണത്തിനായി ശപഥം അവർക്ക് എല്ലാ തർക്കങ്ങളുടെയും[b] അറുതിയാകുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ആളുകൾ.’ ഗ്രീക്കിലെ ἄνθρωποι മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു; പുരുഷന്മാരെ മാത്രം അല്ല.
    reason: lexical_alternative
  - marker: b
    text: ‘തർക്കം’ എന്നതിന് ‘എതിർവാദം’ എന്നോ ‘വിവാദം’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνθρωποι
  choice: മനുഷ്യർ
  rationale: ഇത് പുരുഷന്മാരെ മാത്രം സൂചിപ്പിക്കുന്നതല്ല; മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്ന ബഹുവചനമാണ്. ‘മനുഷ്യർ’ ആ പൊതുവായ അർഥവും ചുറ്റുപാടിലുള്ള ദൈവം–മനുഷ്യൻ വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: κατὰ τοῦ μείζονος
  choice: തങ്ങളേക്കാൾ വലിയവനെച്ചൊല്ലി
  rationale: ശപഥപ്രയോഗത്തിൽ κατά + ജനിറ്റീവ് ഉയർന്ന അധികാരമുള്ള ഒരാളെ സാക്ഷിയാക്കി ശപഥം ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘തങ്ങളേക്കാൾ’ എന്നത് താരതമ്യത്തിന്റെ അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; എന്നാൽ ഗ്രീക്കിൽ ഇല്ലാത്ത പ്രത്യേക വ്യക്തിയെ നിർണയിക്കുന്നില്ല.
- source_word: ὀμνύουσιν
  choice: ശപഥം ചെയ്യുന്നു
  rationale: ശപഥമെടുക്കുന്ന പ്രവൃത്തിയെ നേരിട്ടും സാധാരണ വായനക്കാർക്ക് വ്യക്തമായും അറിയിക്കുന്നു.
- source_word: πάσης ... ἀντιλογίας
  choice: എല്ലാ തർക്കത്തിന്റെയും
  rationale: ഇവിടെ ἀντιλογία വെറും യുക്തിപരമായ വിരോധമല്ല, എതിർവാദമോ വിവാദമോ ഉൾപ്പെടുന്ന തർക്കമാണ്. സന്ദർഭത്തിൽ ശപഥം തർക്കം അവസാനിപ്പിക്കുന്നതിനാൽ ‘തർക്കം’ സ്വാഭാവികമാണ്.
- source_word: πέρας
  choice: അറുതി
  rationale: പദത്തിന്റെ ‘അവസാനം/അറുതി’ എന്ന രൂപകം നിലനിർത്തുകയും തർക്കം അവസാനിക്കുന്നതിനെ സംക്ഷിപ്തമായി അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: εἰς βεβαίωσιν
  choice: ഉറപ്പിനായുള്ള
  rationale: εἰς + അക്ക്യൂസേറ്റീവ് സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യ/ഫലഭാവവും βεβαίωσις എന്ന പദത്തിന്റെ സ്ഥിരീകരണം, സാധൂകരണം എന്നീ അർഥങ്ങളും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὁ ὅρκος
  choice: ശപഥം
  rationale: പൊതുവായ ഒരു മാനുഷിക ആചാരത്തെക്കുറിച്ചുള്ള പ്രസ്താവനയായതിനാൽ മലയാളത്തിൽ നിർദേശകപദം ചേർക്കാതെ പറയുന്നത് സ്വാഭാവികമാണ്.
theological_decisions:
- issue: മനുഷ്യരെയാകെ സൂചിപ്പിക്കുന്ന പൊതുപ്രസ്താവന
  choice: മനുഷ്യർ
  alternative: പുരുഷന്മാർ
  rationale: ἄνθρωποι ഇവിടെ ലിംഗവിശേഷമായി പുരുഷന്മാരെയല്ല, മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു; അതിനാൽ ഉറവിടത്തിന്റെ വ്യാപ്തി ചുരുക്കുന്നില്ല.
- issue: ശപഥത്തിൽ വിളിച്ചുപറയപ്പെടുന്ന ‘വലിയവൻ’ ആരെന്നത്
  choice: തങ്ങളേക്കാൾ വലിയവനെച്ചൊല്ലി
  alternative: ദൈവത്തെച്ചൊല്ലി
  rationale: സന്ദർഭം പരമോന്നതനായ ദൈവത്തിലേക്കു നയിക്കുന്നുവെങ്കിലും ഈ വാക്യത്തിലെ താരതമ്യപ്രയോഗം പ്രത്യേക വ്യക്തിയെ നേരിട്ട് പേരിടുന്നില്ല. അതിനാൽ ഉറവിടത്തിലെ പൊതുവായ പ്രസ്താവനയും ദൈവശാസ്ത്രപരമായ സൂചനയും ഒരുപോലെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘വലിയവനെച്ചൊല്ലി’ എന്നത് ശപഥത്തിന്റെ സാക്ഷി/അധികാരം എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു; ‘അറുതി’ πέρας എന്ന പദത്തിന്റെ രൂപകം കാത്തുസൂക്ഷിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടുണ്ട്.
