source:
  edition: SBLGNT
  text: Ἀδύνατον γὰρ τοὺς ἅπαξ φωτισθέντας γευσαμένους τε τῆς δωρεᾶς τῆς ἐπουρανίου καὶ μετόχους γενηθέντας πνεύματος ἁγίου
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/004.yaml
  text: For it is impossible[a], in the case of those who were once enlightened, and who tasted the heavenly gift, and became partakers of the Holy Spirit[c][b],
translation:
  language: ml
  text: കാരണം, ഒരിക്കൽ പ്രകാശം ലഭിക്കുകയും[a] സ്വർഗീയ ദാനം രുചിക്കുകയും[b] പരിശുദ്ധാത്മാവിന്റെ പങ്കാളികളായിത്തീരുകയും[c] ചെയ്തവരുടെ കാര്യത്തിൽ അത് അസാധ്യമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പ്രകാശം ലഭിച്ചവർ’ എന്നത് പൊതുവായി ആത്മീയ പ്രകാശമോ ഉപദേശമോ ലഭിച്ചവരെ സൂചിപ്പിക്കാം; ചിലർ ഇതിനെ മാനസാന്തരത്തെയോ സ്നാനവുമായി ബന്ധപ്പെട്ട പ്രകാശലഭനത്തെയോ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നതായി വ്യാഖ്യാനിക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, ‘സ്വർഗീയ ദാനം അനുഭവിക്കുകയും.’ മൂലപദത്തിന്റെ അക്ഷരാർഥം ‘രുചിക്കുക’ എന്നാണെങ്കിലും, അത് വെറും അല്പം പരീക്ഷിച്ചതിനേക്കാൾ യഥാർഥ അനുഭവത്തെ സൂചിപ്പിക്കാനും കഴിയും.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘പരിശുദ്ധാത്മാവിൽ പങ്കാളികളായിത്തീരുകയും’ അല്ലെങ്കിൽ ‘പരിശുദ്ധാത്മാവിൽ പങ്കുചേരുകയും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδύνατον
  choice: അത് അസാധ്യമാണ്
  rationale: വാക്യത്തിന്റെ ആരംഭത്തിലുള്ള ഊന്നൽ നിലനിർത്തുന്നു. 6:4-ലെ പ്രസ്താവന 6:6-ൽ മാത്രമാണ് പൂർത്തിയാകുന്നത് എന്നതിനാൽ, ‘അത്’ തുടർന്നുവരുന്ന ആശയത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ പ്രസ്താവനയുമായുള്ള വിശദീകരണബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἅπαξ φωτισθέντας
  choice: ഒരിക്കൽ പ്രകാശിതരാകുകയും
  rationale: ആത്മീയമോ ബൗദ്ധികമോ ആയ പ്രകാശലഭനത്തിന്റെ രൂപകം നിലനിർത്തുന്നു; മാനസാന്തരമെന്നോ സ്നാനമെന്നോ പ്രത്യേകം നിർവചിക്കുന്നില്ല.
- source_word: γευσαμένους
  choice: രുചിച്ചറിയുകയും
  rationale: ‘രുചിക്കുക’ എന്ന മൂർത്തരൂപകത്തോടൊപ്പം യഥാർഥ അനുഭവം എന്ന സാധ്യതയും സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: δωρεᾶς τῆς ἐπουρανίου
  choice: സ്വർഗീയദാനം
  rationale: ദാനത്തിന്റെ സ്വഭാവം വ്യക്തമാക്കാതെ ഗ്രീക്കിലെ വിശേഷണഘടന സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: μετόχους γενηθέντας πνεύματος ἁγίου
  choice: പരിശുദ്ധാത്മാവിൽ പങ്കാളികളായിത്തീരുകയും
  rationale: ‘പങ്കാളികൾ’ പങ്കുവഹിക്കലിന്റെ ശക്തി സൂക്ഷിക്കുന്നു; രക്ഷാകരമായ നിവാസമോ ദുർബലമായ ബന്ധമോ എന്ന് സിദ്ധാന്തപരമായി ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: φωτισθέντας മാനസാന്തരത്തെയോ സ്നാനത്തെയോ പ്രത്യേകം സൂചിപ്പിക്കുന്നുണ്ടോ
  choice: ‘പ്രകാശിതരാകുകയും’ എന്ന വിശാലമായ രൂപകം നിലനിർത്തി
  alternative: ‘മാനസാന്തരപ്പെട്ടവർ’ അല്ലെങ്കിൽ ‘സ്നാനം സ്വീകരിച്ചവർ’
  rationale: ഗ്രീക്ക് പദം പ്രത്യേക ആചാരമോ അനുഭവമോ തുറന്നുപറയുന്നില്ല; അതിനാൽ വ്യാഖ്യാനപരമായ സംഘർഷം പരിഭാഷയിൽ നിലനിർത്തുന്നു.
- issue: γευσαμένους വെറും അല്പാനുഭവമാണോ യഥാർഥ അനുഭവമാണോ
  choice: ‘രുചിച്ചറിയുകയും’
  alternative: ‘അനുഭവിക്കുകയും’ അല്ലെങ്കിൽ ‘മേലോടിയായി രുചിക്കുകയും’
  rationale: രൂപകവും യഥാർഥ അനുഭവത്തിന്റെ സാധ്യതയും ഒരുമിച്ച് നിലനിർത്തി, വിശ്വാസത്യാഗത്തെക്കുറിച്ചുള്ള തർക്കം പദതലത്തിൽ തീർപ്പാക്കുന്നില്ല.
- issue: പരിശുദ്ധാത്മാവിലെ പങ്കാളിത്തത്തിന്റെ കൃത്യമായ രക്ഷാശാസ്ത്രപരമായ അർഥം
  choice: ‘പരിശുദ്ധാത്മാവിൽ പങ്കാളികളായിത്തീരുകയും’
  alternative: ‘പരിശുദ്ധാത്മാവിനെ പൂർണമായി പ്രാപിക്കുകയും’ അല്ലെങ്കിൽ ‘പരിശുദ്ധാത്മാവിന്റെ സ്വാധീനം അനുഭവിക്കുകയും’
  rationale: മൂലത്തിലെ ശക്തമായ പങ്കാളിത്തഭാഷ സംരക്ഷിക്കുന്നു; അതേസമയം ഒരു പ്രത്യേക സമ്പ്രദായത്തിന്റെ സ്ഥിരോത്സാഹമോ വിശ്വാസത്യാഗമോ സംബന്ധിച്ച നിഗമനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ഗ്രീക്കിൽ 6:4-ൽ ആരംഭിച്ച് 6:6-ൽ പൂർത്തിയാകുന്ന ദീർഘവാക്യമാണെന്നത് കാണിക്കാൻ ഈ വാക്യം ‘കാരണം,’ എന്ന ബന്ധകത്തോടെ തുറന്ന നിലയിൽ അവസാനിപ്പിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദസമുച്ചയങ്ങൾക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
