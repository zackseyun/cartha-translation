id: HEB.6.18
reference: Hebrews 6:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἵνα διὰ δύο πραγμάτων ἀμεταθέτων, ἐν οἷς ἀδύνατον ψεύσασθαι ⸀θεόν, ἰσχυρὰν παράκλησιν ἔχωμεν οἱ καταφυγόντες κρατῆσαι τῆς προκειμένης ἐλπίδος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/018.yaml
  text: so that through two unchangeable things[a], in which it is impossible for God to lie[b], we who have fled for refuge might have strong encouragement to take hold of the hope set before us.
translation:
  language: ml
  text: അങ്ങനെ, മാറ്റമില്ലാത്ത രണ്ടു കാര്യങ്ങളിലൂടെ[a]—അവയിൽ ദൈവം കള്ളം പറയുക അസാധ്യമാണ്—അഭയം തേടി ഓടിയെത്തിയ നമുക്കു[b] നമ്മുടെ മുമ്പിൽ വെച്ചിരിക്കുന്ന പ്രത്യാശ മുറുകെപ്പിടിക്കാൻ ശക്തമായ പ്രോത്സാഹനം ലഭിക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “മാറ്റമില്ലാത്ത രണ്ടു കാര്യങ്ങൾ” എന്നത് സന്ദർഭത്തിൽ ദൈവത്തിന്റെ വാഗ്ദാനത്തെയും ശപഥത്തെയും സൂചിപ്പിക്കുന്നു.
    reason: contextual_clarification
  - marker: b
    text: “അഭയം തേടി ഓടിയെത്തിയ” എന്ന പ്രയോഗം സുരക്ഷയ്ക്കായി അഭയസ്ഥാനത്തേക്ക് ഓടുന്നതിന്റെ ചിത്രം ഉണർത്തുന്നു; പഴയനിയമത്തിലെ അഭയനഗരങ്ങളെയും ഇത് ഓർമിപ്പിച്ചേക്കാം.
    reason: cross_reference
lexical_decisions:
- source_word: ἵνα
  choice: അങ്ങനെ ... പ്രാപിക്കേണ്ടതിനാണ്
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞതിൽനിന്ന് ഉളവാകുന്ന ഉദ്ദേശ്യവും ഫലവും മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: διὰ δύο πραγμάτων ἀμεταθέτων
  choice: മാറ്റമില്ലാത്ത രണ്ടു കാര്യങ്ങളിലൂടെ
  rationale: πράγματα എന്ന വിശാലപദം ‘കാര്യങ്ങൾ’ എന്നു നിലനിർത്തുകയും ἀμετάθετος സൂചിപ്പിക്കുന്ന മാറ്റാനാവാത്ത സ്വഭാവം വ്യക്തമായി നൽകുകയും ചെയ്യുന്നു; സന്ദർഭത്തിൽ ഇവ വാഗ്ദാനവും ശപഥവുമാണ്.
- source_word: ἐν οἷς
  choice: അവയിൽ
  rationale: മുൻപറഞ്ഞ രണ്ടു കാര്യങ്ങളോടുള്ള ആപേക്ഷികബന്ധം ലളിതമായി നിലനിർത്തുന്നു.
- source_word: ἀδύνατον ψεύσασθαι θεόν
  choice: ദൈവം കള്ളം പറയുക അസാധ്യമാണ്
  rationale: ഗ്രീക്കിലെ impersonal construction-ന്റെ ഊന്നലും ഗൗരവവും നിലനിർത്തുന്നു; ‘ദൈവം കള്ളം പറയുകയില്ല’ എന്നതിനെക്കാൾ മൂലപാഠത്തോട് അടുത്തതാണ്.
- source_word: ἰσχυρὰν παράκλησιν
  choice: ശക്തമായ പ്രോത്സാഹനം
  rationale: παράκλησις എന്നതിലെ പ്രോത്സാഹനം/ആശ്വാസം എന്ന അർത്ഥവ്യാപ്തിയിൽ, ഇവിടെ പ്രത്യാശയെ മുറുകെപ്പിടിക്കാൻ ശക്തിപ്പെടുത്തുന്ന ആശയമാണ് സന്ദർഭോചിതം.
- source_word: ἔχωμεν
  choice: പ്രാപിക്കേണ്ടതിനാണ്
  rationale: ἵνα-യോടുകൂടിയ subjunctive സൂചിപ്പിക്കുന്ന ലക്ഷ്യം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: οἱ καταφυγόντες
  choice: അഭയം തേടി ഓടിയെത്തിയ നാം
  rationale: വെറും ‘അഭയം പ്രാപിച്ചവർ’ എന്നതിലുപരി, അപകടത്തിൽനിന്ന് സുരക്ഷിതസ്ഥാനത്തേക്ക് ഓടിയെത്തുന്ന സജീവമായ അഭയരൂപകം സംരക്ഷിക്കുന്നു.
- source_word: κρατῆσαι
  choice: മുറുകെപ്പിടിക്കാൻ
  rationale: κρατέω-യുടെ പിടിക്കുക, ഉറച്ചുപിടിക്കുക എന്നീ അർത്ഥങ്ങൾ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; പ്രത്യാശയോടുള്ള തുടർച്ചയായ ഉറച്ച ബന്ധവും വ്യക്തമാകുന്നു.
- source_word: τῆς προκειμένης ἐλπίδος
  choice: നമ്മുടെ മുമ്പിൽ വെച്ചിരിക്കുന്ന പ്രത്യാശ
  rationale: πρόκειμαι സൂചിപ്പിക്കുന്ന, മുന്നിൽ അവതരിപ്പിക്കപ്പെട്ടിരിക്കുന്ന വസ്തുനിഷ്ഠമായ പ്രത്യാശയെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: അഭയത്തിന്റെയും പ്രത്യാശയുടെയും രൂപകം
  choice: ‘അഭയം തേടി ഓടിയെത്തിയ’ എന്നും ‘പ്രത്യാശ മുറുകെപ്പിടിക്കാൻ’ എന്നും രൂപകത്തിന്റെ സജീവത നിലനിർത്തി.
  alternative: ‘അഭയം പ്രാപിച്ച നാം പ്രത്യാശയിൽ ഉറച്ചുനിൽക്കാൻ’
  rationale: മൂലപാഠം അഭയം തേടിയുള്ള ഓട്ടവും മുന്നിലുള്ള പ്രത്യാശയെ പിടിച്ചെടുക്കുന്നതും ചേർക്കുന്നു; അതിനെ അമൂർത്തമായ ഉറപ്പിന്റെ ഭാഷയാക്കി ലഘൂകരിച്ചില്ല.
- issue: ദൈവത്തിന്റെ സത്യസന്ധത
  choice: ‘ദൈവം കള്ളം പറയുക അസാധ്യമാണ്’
  alternative: ‘ദൈവത്തിന് കള്ളം പറയാൻ കഴിയില്ല’
  rationale: മൂലപാഠത്തിലെ അസാധ്യതയുടെ പ്രസ്താവന നേരിട്ട് സംരക്ഷിക്കുന്നു; അതിനപ്പുറമുള്ള തത്ത്വചിന്താപരമായ വിശദീകരണം ചേർക്കുന്നില്ല.
- issue: മാറ്റമില്ലാത്ത രണ്ടു കാര്യങ്ങളുടെ തിരിച്ചറിയൽ
  choice: പ്രധാനപാഠത്തിൽ ‘രണ്ടു കാര്യങ്ങൾ’ എന്നു മാത്രം നിലനിർത്തി.
  alternative: ‘വാഗ്ദാനവും ശപഥവും’ എന്നു പ്രധാനപാഠത്തിൽ വ്യക്തമാക്കുക
  rationale: സന്ദർഭം അവയെ ദൈവത്തിന്റെ വാഗ്ദാനവും ശപഥവും ആയി സൂചിപ്പിക്കുന്നുവെങ്കിലും, ഈ വാക്യം അവയ്ക്ക് പേര് നൽകുന്നില്ല; അതിനാൽ വിവർത്തനത്തിൽ വ്യാഖ്യാനം ചേർത്തില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ദീർഘമായ ഗ്രീക്ക് വാക്യഘടനയുടെ ബന്ധങ്ങൾ ഡാഷുകൾകൊണ്ട് വ്യക്തമാക്കിയിരിക്കുന്നു. ദൈവശാസ്ത്രപരമായ വിശദീകരണം പ്രധാനപാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതെ യഥാർത്ഥ രൂപകങ്ങളും ഊന്നലും സംരക്ഷിച്ചു.
