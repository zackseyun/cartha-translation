reference: Hebrews 6:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐπιθυμοῦμεν δὲ ἕκαστον ὑμῶν τὴν αὐτὴν ἐνδείκνυσθαι σπουδὴν πρὸς τὴν πληροφορίαν τῆς ἐλπίδος ἄχρι τέλους,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/011.yaml
  text: And we desire each one of you to show the same diligence for the full assurance of hope until the end[b][a],
translation:
  language: ml
  text: നിങ്ങളിൽ ഓരോരുത്തരും പ്രത്യാശയുടെ പൂർണ ഉറപ്പിനായി[a] അവസാനംവരെ[b] അതേ ശുഷ്കാന്തി കാണിക്കണമെന്നാണ് ഞങ്ങൾ ആഗ്രഹിക്കുന്നത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പ്രത്യാശയുടെ സമ്പൂർണ നിശ്ചയം.’ ഗ്രീക്ക് പദത്തിന് പൂർണമായ നിശ്ചയം, ഉറപ്പ് എന്നീ അർത്ഥങ്ങൾ നൽകാനാകും.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവസാനത്തോളം.’ പൂർത്തിയാകുന്നതുവരെ സ്ഥിരമായി തുടരുന്നതിന് ഈ പ്രയോഗം ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιθυμοῦμεν
  choice: ഞങ്ങൾ ആഗ്രഹിക്കുന്നു
  rationale: ശക്തമായ ആഗ്രഹം സൂചിപ്പിക്കുന്ന ക്രിയയാണിത്; ഇവിടെ ഇടയപരമായ പ്രബോധനമായതിനാൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ഈ പ്രയോഗം യോജിക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ ആശയബന്ധം വാക്യക്രമത്തിലൂടെ സൂചിപ്പിച്ച് പ്രത്യേകം വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: മുൻവാക്യത്തിലെ ഉറപ്പുനൽകലിൽനിന്ന് പ്രബോധനത്തിലേക്കുള്ള മൃദുവായ മാറ്റമാണിത്. മലയാളത്തിൽ നിർബന്ധമായി ‘എന്നാൽ’ ചേർത്താൽ അനാവശ്യമായ വിരോധഭാവം ഉണ്ടാകാം.
- source_word: ἕκαστον ὑμῶν
  choice: നിങ്ങളിൽ ഓരോരുത്തരും
  rationale: സമൂഹത്തിലെ ഓരോ വ്യക്തിക്കും പ്രബോധനം ബാധകമാണെന്ന വിതരണാത്മക ഊന്നൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: τὴν αὐτὴν
  choice: അതേ
  rationale: മുൻസന്ദർഭത്തിൽ പ്രകടമായ സ്നേഹത്തോടും ശുശ്രൂഷയോടും ബന്ധപ്പെട്ട ഉത്സാഹത്തിലേക്കുള്ള പിന്മൊഴി സംക്ഷിപ്തമായി സൂക്ഷിക്കുന്നു.
- source_word: ἐνδείκνυσθαι
  choice: കാണിക്കുക
  rationale: ഒരു ഗുണം പ്രവൃത്തിയിൽ പ്രകടമാക്കുക എന്ന അർത്ഥം ലളിതവും നേരിട്ടുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: σπουδὴν
  choice: ഉത്സാഹം
  rationale: σπουδήയിലെ ആത്മാർഥത, ശ്രദ്ധ, സജീവമായ ശുഷ്കാന്തി എന്നിവ സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു; ക്ഷണികമായ വികാരാവേശം മാത്രം ഉദ്ദേശിക്കുന്നില്ല.
- source_word: πρὸς
  choice: -നായി
  rationale: പ്രത്യാശയുടെ പൂർണ ഉറപ്പിലേക്കുള്ള ലക്ഷ്യമോ ഉദ്ദേശ്യമോ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: πληροφορίαν
  choice: പൂർണ ഉറപ്പ്
  rationale: പൂർണതയുള്ള നിശ്ചയമോ ഉറപ്പോ എന്ന ആശയം നൽകുന്നു; അത് വെറും വികാരപരമായ ആത്മവിശ്വാസമായി ചുരുക്കുന്നില്ല.
- source_word: ἐλπίδος
  choice: പ്രത്യാശ
  rationale: ദൈവത്തിന്റെ വാഗ്ദാനത്തിൽ അധിഷ്ഠിതമായ പ്രതീക്ഷയെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള മലയാള പദം.
- source_word: ἄχρι τέλους
  choice: അവസാനംവരെ
  rationale: നിർദിഷ്ട പൂർത്തിവരെ തുടർന്നുനിൽക്കുക എന്ന കാലപരവും സഹനപരവുമായ ശക്തി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘പ്രത്യാശയുടെ പൂർണ ഉറപ്പ്’ എന്നതും സ്ഥിരോത്സാഹവും തമ്മിലുള്ള ബന്ധം
  choice: പ്രത്യാശയോടു ബന്ധപ്പെട്ട പൂർണ ഉറപ്പിലേക്കായി അതേ ഉത്സാഹം അവസാനംവരെ പ്രകടിപ്പിക്കണമെന്ന നിലയിൽ വിവർത്തനം ചെയ്തു.
  alternative: ഇത് രക്ഷയെക്കുറിച്ചുള്ള പൂർണമായ ആന്തരിക നിശ്ചയമെന്നോ പ്രത്യാശിക്കപ്പെടുന്ന വാഗ്ദാനത്തിന്റെ പൂർണ സാക്ഷാത്കാരമെന്നോ മാത്രം വ്യക്തമാക്കാമായിരുന്നു.
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിൽ വ്യക്തിപരമായ ഉറപ്പും പ്രത്യാശയുടെ ഉറച്ച സ്വഭാവവും തമ്മിൽ അർത്ഥപരമായ ഓവർലാപ്പുണ്ട്. ഒരു പ്രത്യേക സിദ്ധാന്തവ്യവസ്ഥയിലേക്ക് വാക്യത്തെ ചുരുക്കാതെ ആ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘നിങ്ങളിൽ ഓരോരുത്തരും’ എന്നത് വ്യക്തിഗത ഊന്നൽ നിലനിർത്തുന്നു. മൂലവാക്യത്തിലെ ദീർഘഘടന വായനാസൗകര്യത്തിനായി മലയാളത്തിന്റെ സ്വാഭാവിക പദക്രമത്തിൽ ക്രമീകരിച്ചു. നൽകിയ മാർക്കർക്രമമായ [b][a] മുഖ്യവാചകത്തിൽ അതേപടി സൂക്ഷിച്ചു.
