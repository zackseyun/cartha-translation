reference: Hebrews 6:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐ γὰρ ἄδικος ὁ θεὸς ἐπιλαθέσθαι τοῦ ἔργου ὑμῶν ⸀καὶ τῆς ἀγάπης ἧς ἐνεδείξασθε εἰς τὸ ὄνομα αὐτοῦ, διακονήσαντες τοῖς ἁγίοις καὶ διακονοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/010.yaml
  text: For God is not unjust so as to forget your work and the love that you showed for his name in having served the saints and in continuing to serve them[a][b][c].
translation:
  language: ml
  text: കാരണം, നിങ്ങളുടെ പ്രവൃത്തിയും വിശുദ്ധരെ സേവിച്ചതിലൂടെയും ഇപ്പോഴും അവരെ സേവിച്ചുകൊണ്ടിരിക്കുന്നതിലൂടെയും അവിടത്തെ നാമത്തിനുവേണ്ടി നിങ്ങൾ കാണിച്ച സ്നേഹവും മറന്നുകളയാൻ ദൈവം അനീതിയുള്ളവനല്ല.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘അവിടത്തെ നാമത്തോടുള്ള.’'
    reason: lexical_alternative
  - marker: b
    text: അതായത്, സഹവിശ്വാസികൾ; ഇവിടെ ‘വിശുദ്ധർ’ എന്നത് ദൈവത്തിന്റെ വിശുദ്ധജനത്തെ സൂചിപ്പിക്കുന്നു, പിന്നീട് വിശുദ്ധപദവി ലഭിച്ച ഒരു പ്രത്യേക വിഭാഗത്തെയല്ല.
    reason: cultural_note
  - marker: c
    text: 'അല്ലെങ്കിൽ: ‘വിശുദ്ധരെ സേവിക്കുകയും ഇപ്പോഴും അവരെ സേവിച്ചുകൊണ്ടിരിക്കുകയും ചെയ്തതിലൂടെ.’'
    reason: previous_rendering
lexical_decisions:
- source_word: ἄδικος
  choice: അനീതിയുള്ളവൻ
  rationale: ദൈവം അവരുടെ പ്രവൃത്തിയെ അവഗണിക്കുന്നത് നീതിക്കു വിരുദ്ധമായിരിക്കുമെന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐπιλαθέσθαι
  choice: മറന്നുകളയാൻ
  rationale: പദത്തിന്റെ നേരിട്ടുള്ള അർഥമായ ‘മറക്കുക’ നിലനിർത്തുന്നു; ഇവിടെ പ്രവൃത്തിയിൽ കണക്കിലെടുക്കാതെ പോകുക എന്ന സന്ദർഭസൂചനയും ഉൾക്കൊള്ളുന്നു.
- source_word: τοῦ ἔργου ὑμῶν
  choice: നിങ്ങളുടെ പ്രവൃത്തി
  rationale: ഏകവചനത്തിലുള്ള συλλക്റ്റീവ് അർഥം നിലനിർത്തുകയും തുടർന്നുള്ള സേവനവുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: τῆς ἀγάπης
  choice: സ്നേഹം
  rationale: ἀγάπηയുടെ സാധാരണവും വ്യക്തവുമായ മലയാള സമാനപദം; സേവനത്തിലൂടെ പ്രകടമായ സ്നേഹമാണ് സന്ദർഭം.
- source_word: ἐνεδείξασθε
  choice: നിങ്ങൾ കാണിച്ച
  rationale: തെളിവായി പ്രകടിപ്പിക്കുക എന്ന ക്രിയയുടെ അർഥം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: εἰς τὸ ὄνομα αὐτοῦ
  choice: അവിടത്തെ നാമത്തോടു
  rationale: εἰς സൂചിപ്പിക്കുന്ന ദിശ/ഭക്തിബന്ധം സംരക്ഷിക്കുകയും ‘നാമം’ എന്ന ബൈബിൾപ്രയോഗം പരാവർത്തനം ചെയ്യാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: διακονήσαντες
  choice: സേവിച്ചതിൽ
  rationale: മുൻപ് നടന്ന സേവനത്തെ സൂചിപ്പിക്കുന്ന aorist participle-ന്റെ ഭാവം നൽകുന്നു.
- source_word: τοῖς ἁγίοις
  choice: വിശുദ്ധരെ
  rationale: പുതിയനിയമത്തിൽ വിശ്വാസസമൂഹത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാപിത പദം നിലനിർത്തുന്നു; പിന്നീട് വിശുദ്ധപദവി ലഭിച്ച പ്രത്യേക വർഗം എന്ന ധാരണ ഒഴിവാക്കാൻ അടിക്കുറിപ്പ് ചേർക്കുന്നു.
- source_word: διακονοῦντες
  choice: ഇപ്പോഴും സേവിച്ചുകൊണ്ടിരിക്കുന്നതിൽ
  rationale: വർത്തമാന participle സൂചിപ്പിക്കുന്ന തുടരുന്ന സേവനം വ്യക്തമാക്കുകയും മുൻകാല സേവനത്തോടുള്ള aspectual വ്യത്യാസം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ഈ വാക്യം ദൈവസന്നിധിയിൽ മനുഷ്യപ്രവൃത്തികളുടെ പുണ്യാർജനം പഠിപ്പിക്കുന്നുണ്ടോ, അതോ വിശ്വാസികളുടെ പ്രവൃത്തികളെ ദൈവം നീതിപൂർവം ഓർക്കുന്നതാണോ
  choice: ദൈവം അവരുടെ പ്രവൃത്തിയും സ്നേഹവും മറക്കാത്തവനാണെന്ന നീതിസംബന്ധമായ പ്രസ്താവന അതേപടി നിലനിർത്തുന്നു; പ്രവൃത്തികൾ രക്ഷ സമ്പാദിക്കുന്നു എന്നു കൂട്ടിച്ചേർക്കുന്നില്ല.
  alternative: മനുഷ്യപ്രവൃത്തികൾ മൂലം ദൈവം പ്രതിഫലം നൽകാൻ കടപ്പെട്ടിരിക്കുന്നു എന്ന ശക്തമായ പുണ്യാർജന വ്യാഖ്യാനം.
  rationale: ഗ്രീക്ക് പാഠം ദൈവം അവരുടെ പ്രവൃത്തിയും സ്നേഹവും മറക്കാൻ അനീതിയുള്ളവനല്ല എന്നു മാത്രമാണ് പറയുന്നത്. അതിനാൽ ദൈവനീതിയും ഓർമയും സംരക്ഷിക്കുമ്പോൾ പാഠത്തിൽ വ്യക്തമല്ലാത്ത പുണ്യാർജന സിദ്ധാന്തം ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ആദരപൂർവവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ദൈവത്തെ സൂചിപ്പിക്കാൻ ആദരസൂചകമായ ‘അവിടത്തെ’ ഉപയോഗിച്ചു. രണ്ട് participle-കളിലെ മുൻകാല/തുടർച്ച വ്യത്യാസം ‘സേവിച്ചതിലും’ എന്നും ‘ഇപ്പോഴും സേവിച്ചുകൊണ്ടിരിക്കുന്നതിലും’ എന്നും വ്യക്തമാക്കി. ദീർഘവാക്യത്തിന്റെ ബന്ധം സുതാര്യമാക്കാൻ ഡാഷുകൾ ഉപയോഗിച്ചു.
