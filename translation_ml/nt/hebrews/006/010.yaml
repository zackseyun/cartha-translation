- from: കാരണം, നിങ്ങളുടെ പ്രവൃത്തിയും അവിടത്തെ നാമത്തോടു നിങ്ങൾ കാണിച്ച സ്നേഹവും—വിശുദ്ധരെ സേവിച്ചതിലും ഇപ്പോഴും സേവിച്ചുകൊണ്ടിരിക്കുന്നതിലും പ്രകടമായ ആ സ്നേഹം—മറന്നുകളയാൻ ദൈവം അനീതിയുള്ളവനല്ല.[a][b][c]
  to: കാരണം, നിങ്ങളുടെ പ്രവൃത്തിയും വിശുദ്ധരെ സേവിച്ചതിലൂടെയും ഇപ്പോഴും അവരെ സേവിച്ചുകൊണ്ടിരിക്കുന്നതിലൂടെയും അവിടത്തെ നാമത്തിനുവേണ്ടി നിങ്ങൾ കാണിച്ച സ്നേഹവും മറന്നുകളയാൻ ദൈവം അനീതിയുള്ളവനല്ല.[a][b][c]
  rationale: The revision replaces an unnatural Malayalam construction with “അവിടത്തെ നാമത്തിനുവേണ്ടി,” which naturally expresses devotion to and honor of God’s name. It also recasts the service participles as parallel instrumental clauses, explicitly retaining past service (“സേവിച്ചതിലൂടെയും”) and continuing service (“ഇപ്പോഴും ... സേവിച്ചുകൊണ്ടിരിക്കുന്നതിലൂടെയും”). No implication that works earn salvation has been added.
