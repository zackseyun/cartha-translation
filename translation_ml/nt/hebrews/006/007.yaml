id: HEB.6.7
reference: Hebrews 6:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: γῆ γὰρ ἡ πιοῦσα τὸν ἐπ’ αὐτῆς ⸂ἐρχόμενον πολλάκις⸃ ὑετόν, καὶ τίκτουσα βοτάνην εὔθετον ἐκείνοις δι’ οὓς καὶ γεωργεῖται, μεταλαμβάνει εὐλογίας ἀπὸ τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/007.yaml
  text: For land that drinks the rain that often comes upon it and produces vegetation useful to those for whose sake it is also cultivated receives blessing from God[a][b].
translation:
  language: ml
  text: അതിന്റെമേൽ പലപ്പോഴും പെയ്യുന്ന മഴ കുടിക്കുകയും, ആരുടെ നന്മയ്ക്കുവേണ്ടിയാണോ അത് കൃഷി ചെയ്യപ്പെടുന്നതും അവർക്കു ഉപയോഗപ്രദമായ സസ്യങ്ങൾ മുളപ്പിക്കുകയും ചെയ്യുന്ന നിലം ദൈവത്തിൽനിന്നുള്ള അനുഗ്രഹം പ്രാപിക്കുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γῆ
  choice: നിലം
  rationale: കൃഷിക്കു വിധേയമായ ഭൂഭാഗം എന്ന കാർഷികസന്ദർഭം സ്വാഭാവികമായി അറിയിക്കുന്നു; ‘ഭൂമി’ എന്നത് ഇവിടെ അതിവ്യാപകമാകാം.
- source_word: πιοῦσα
  choice: കുടിക്കുകയും
  rationale: മഴ സ്വീകരിക്കുന്ന നിലത്തെ വ്യക്തിവൽക്കരിക്കുന്ന ഗ്രീക്ക് രൂപകം നിലനിർത്തുന്നു; ‘ആഗിരണം ചെയ്യുക’ എന്നതിനെക്കാൾ സജീവവും ദൃശ്യവുമാണ്.
- source_word: τὸν ἐπ’ αὐτῆς ἐρχόμενον πολλάκις ὑετόν
  choice: തന്റെമേൽ പലപ്പോഴും പെയ്യുന്ന മഴ
  rationale: πολλάκις എന്ന ആവർത്തനവും ἐπ’ αὐτῆς എന്ന ‘മേൽ’ എന്ന ആശയവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: τίκτουσα
  choice: മുളപ്പിക്കുകയും
  rationale: നിലം സസ്യവളർച്ച ഉളവാക്കുന്നു എന്ന ആശയം കാർഷികസന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; പ്രസവസംബന്ധമായ മൂലരൂപകം വാക്കുതോറും പകർത്തുന്നില്ല.
- source_word: βοτάνην
  choice: സസ്യങ്ങൾ
  rationale: പൊതുവായ സസ്യവളർച്ചയെ സൂചിപ്പിക്കുന്ന ലളിതവും ആധുനികവുമായ പദം; ഒരു പ്രത്യേക വിളയെ അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: εὔθετον
  choice: പ്രയോജനമുള്ള
  rationale: അനുയോജ്യതയും പ്രായോഗിക ഉപകാരവും സൂചിപ്പിക്കുന്ന അർഥം കാർഷികസന്ദർഭത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ἐκείνοις δι’ οὓς καὶ γεωργεῖται
  choice: ആർക്കുവേണ്ടിയാണോ അത് കൃഷി ചെയ്യപ്പെടുന്നത് അവർക്കു
  rationale: διά + accusative ഇവിടെ ഉദ്ദേശ്യം/നന്മ (‘ആർക്കുവേണ്ടി’) എന്ന അർഥത്തിലാണ് ഏറ്റവും സ്വാഭാവികം; കൃഷി ചെയ്യുന്നവരുടെ പ്രവർത്തകത്വം നിർബന്ധമായി പ്രസ്താവിക്കുന്നില്ല.
- source_word: γεωργεῖται
  choice: കൃഷി ചെയ്യപ്പെടുന്നത്
  rationale: നിലം കാർഷികമായി പരിപാലിക്കപ്പെടുന്നു എന്ന passive ആശയം വിശാലമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: μεταλαμβάνει
  choice: പ്രാപിക്കുന്നു
  rationale: ദൈവത്തിൽനിന്നുള്ള അനുഗ്രഹം ലഭിക്കുന്നു എന്ന അർഥം dignified modern Malayalam-ൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: εὐλογίας ἀπὸ τοῦ θεοῦ
  choice: ദൈവത്തിൽനിന്നുള്ള അനുഗ്രഹം
  rationale: അനുഗ്രഹത്തിന്റെ ഉറവിടം ദൈവമാണെന്ന് വ്യക്തമായി സൂചിപ്പിക്കുകയും ഗ്രീക്കിലെ പൊതുവായ പ്രയോഗം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: മുന്നറിയിപ്പിന്റെ പശ്ചാത്തലത്തിലുള്ള കാർഷികരൂപകം
  choice: വാക്യത്തിലെ അനുകൂല കാർഷികരൂപകം നേരിട്ട് നിലനിർത്തി; വിശ്വാസികളുടെ നിലനിൽപ്പോ വിശ്വാസത്യാഗമോ സംബന്ധിച്ച പ്രത്യേക സിദ്ധാന്തനിഗമനം വിവർത്തനത്തിൽ ചേർത്തില്ല.
  alternative: ഫലം തരുന്ന നിലത്തെ ഒരു പ്രത്യേക വിശ്വാസിവർഗവുമായി വ്യാഖ്യാനപരമായി നേരിട്ട് സമീകരിക്കുക.
  rationale: ഈ വാക്യം കാർഷികസാദൃശ്യത്തിന്റെ അനുകൂലവശം മാത്രമാണ് പ്രസ്താവിക്കുന്നത്; വിശാലമായ ഭാഗത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം വിവർത്തനം തന്നെ തീർപ്പാക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘മഴ കുടിക്കുക’ എന്ന വ്യക്തിവൽക്കരിച്ച കാർഷികദൃശ്യം സൂക്ഷിച്ചു. വാക്യഘടന സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നവിധം ക്രമപ്പെടുത്തി; യഥാർഥ വ്യാകരണപരമായ വ്യത്യസ്തവായന അടിക്കുറിപ്പിൽ നിലനിർത്തി.
