revisions:
- from: തന്റെമേൽ പലപ്പോഴും പെയ്യുന്ന മഴ കുടിക്കുകയും, ആർക്കുവേണ്ടിയാണോ അത് കൃഷി ചെയ്യപ്പെടുന്നത്[a] അവർക്കു പ്രയോജനമുള്ള സസ്യങ്ങൾ[b] മുളപ്പിക്കുകയും ചെയ്യുന്ന നിലം ദൈവത്തിൽനിന്നുള്ള അനുഗ്രഹം പ്രാപിക്കുന്നു.
