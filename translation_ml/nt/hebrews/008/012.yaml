source:
  edition: SBLGNT
  text: ὅτι ἵλεως ἔσομαι ταῖς ἀδικίαις αὐτῶν, καὶ τῶν ἁμαρτιῶν ⸀αὐτῶν οὐ μὴ μνησθῶ ἔτι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/012.yaml
  text: For I will be merciful toward their unrighteousness[b][a], and I will remember their sins no more.
translation:
  language: ml
  text: എന്തെന്നാൽ, അവരുടെ അനീതികളുടെ കാര്യത്തിൽ ഞാൻ കരുണയുള്ളവനായിരിക്കും; അവരുടെ പാപങ്ങളെ ഞാൻ ഇനി ഓർക്കുകയില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “അവരുടെ പാപങ്ങളെ ഞാൻ ഇനി തീർച്ചയായും ഓർക്കുകയില്ല.” ഉടമ്പടിയുടെ പശ്ചാത്തലത്തിൽ ഇത് പൂർണമായ ക്ഷമയെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്; ദൈവം അവയെക്കുറിച്ചുള്ള അറിവ് നഷ്ടപ്പെടുത്തുന്നു എന്നല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: കാരണം
  rationale: മുൻപുള്ള ഉടമ്പടി വാഗ്ദാനത്തിന് വിശദീകരണമോ കാരണമോ അവതരിപ്പിക്കുന്ന ബന്ധകമായി ὅτι ഇവിടെ പ്രവർത്തിക്കുന്നു.
- source_word: ἵλεως ἔσομαι
  choice: ഞാൻ കരുണ കാണിക്കും
  rationale: ദയാപൂർവമായ അനുകൂല മനോഭാവവും ക്ഷമയും സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ταῖς ἀδικίαις αὐτῶν
  choice: അവരുടെ അനീതികളോട്
  rationale: ἀδικία എന്ന പദത്തിന്റെ അനീതി, തെറ്റ് എന്നീ അർഥസാധ്യതകളും ബഹുവചനവും കഴിയുന്നത്ര നിലനിർത്തുന്നു; മൂലത്തിൽ വ്യക്തമല്ലാത്ത ‘പ്രവൃത്തികൾ’ എന്ന പദം ചേർക്കുന്നില്ല.
- source_word: τῶν ἁμαρτιῶν αὐτῶν
  choice: അവരുടെ പാപങ്ങളെ
  rationale: ἁμαρτίαയുടെ സാധാരണ അർഥവും മൂലത്തിലെ ബഹുവചനവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: οὐ μὴ μνησθῶ ἔτι
  choice: ഇനി ഒരിക്കലും ഓർക്കുകയുമില്ല
  rationale: οὐ μή എന്ന ശക്തമായ നിഷേധവും ἔτιയുടെ ‘ഇനി’ എന്ന കാലസൂചനയും സ്വാഭാവികമായി സംയോജിപ്പിക്കുന്നു.
theological_decisions:
- issue: ദൈവം പാപങ്ങളെ ഓർക്കാതിരിക്കുന്നതിന്റെ അർഥം
  choice: ‘ഓർക്കുകയില്ല’ എന്ന തിരുവെഴുത്തിലെ ഉടമ്പടിപരമായ പ്രയോഗം മുഖ്യപാഠത്തിൽ അതേപടി നിലനിർത്തി
  alternative: ദൈവം പാപങ്ങളെ അറിവിൽനിന്ന് അക്ഷരാർഥത്തിൽ മറന്നുപോകുന്നു എന്ന് വിശദീകരിക്കുക
  rationale: പൂർണക്ഷമയെയും പാപം ഇനി കണക്കാക്കാതിരിക്കുന്നതിനെയും സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്; എന്നാൽ മുഖ്യപാഠത്തിൽ വ്യാഖ്യാനം കയറ്റാതെ അതിന്റെ ദൈവശാസ്ത്രപരമായ സംഘർഷം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘അനീതികൾ’ എന്ന ബഹുവചനം മൂലപാഠത്തിന്റെ രൂപവും അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു.
