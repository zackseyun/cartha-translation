- from: കാരണം, അവരുടെ അനീതികളോട് ഞാൻ കരുണ കാണിക്കും; അവരുടെ പാപങ്ങളെ ഇനി ഒരിക്കലും ഓർക്കുകയുമില്ല.[a]
  to: എന്തെന്നാൽ, അവരുടെ അനീതികളുടെ കാര്യത്തിൽ ഞാൻ കരുണയുള്ളവനായിരിക്കും; അവരുടെ പാപങ്ങളെ ഞാൻ ഇനി ഓർക്കുകയില്ല.[a]
  rationale: The revision retains the source’s plurality, future orientation, and covenantal non-remembrance idiom, while making the mercy-with-respect-to-wrongs construction idiomatic in modern standard Malayalam. The footnote continues to identify the emphatic negation and explain the covenantal idiom without altering the main-text wording.
