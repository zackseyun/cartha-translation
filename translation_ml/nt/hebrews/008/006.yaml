revisions:
- from: എന്നാൽ ഇപ്പോൾ, അവൻ എത്രത്തോളം കൂടുതൽ നല്ല ഉടമ്പടിയുടെ[b] മധ്യസ്ഥനായിരിക്കുന്നുവോ, അത്രത്തോളം മികവേറിയ ശുശ്രൂഷ[a] അവന് ലഭിച്ചിരിക്കുന്നു; ആ ഉടമ്പടി കൂടുതൽ നല്ല വാഗ്ദാനങ്ങളെ അടിസ്ഥാനമാക്കി പ്രാബല്യത്തിൽ വരുത്തപ്പെട്ടിരിക്കുന്നു.[c]
  to: എന്നാൽ ഇപ്പോൾ, അവൻ മധ്യസ്ഥനായിരിക്കുന്ന ഉടമ്പടി[b] എത്രത്തോളം മെച്ചമായതാണോ, അത്രത്തോളം മേന്മയേറിയ ശുശ്രൂഷ[a] അവൻ നേടിയിരിക്കുന്നു; ആ ഉടമ്പടി മെച്ചമായ വാഗ്ദാനങ്ങളുടെ അടിസ്ഥാനത്തിൽ നിയമപരമായി സ്ഥാപിക്കപ്പെട്ടിരിക്കുന്നു.[c]
  rationale: 'The revision preserves every element of the Greek while making the comparative-correlative relationship more transparent in Malayalam: the covenant Christ mediates is better, and therefore his ministry is correspondingly more excellent. It also removes an unsupported qualifier from footnote a and uses a more natural legal-covenantal rendering for the perfect passive νενομοθέτηται.'
