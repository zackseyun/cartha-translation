id: HEB.8.6
reference: Hebrews 8:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀νυνὶ δὲ διαφορωτέρας τέτυχεν λειτουργίας, ὅσῳ καὶ κρείττονός ἐστιν διαθήκης μεσίτης, ἥτις ἐπὶ κρείττοσιν ἐπαγγελίαις νενομοθέτηται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/006.yaml
  text: But as it is[a], he has obtained a more excellent ministry, by as much as he is also the mediator of a better covenant[c][b], which has been enacted on better promises.
translation:
  language: ml
  text: എന്നാൽ ഇപ്പോൾ, അവൻ മധ്യസ്ഥനായിരിക്കുന്ന ഉടമ്പടി[b] എത്രത്തോളം മെച്ചമായതാണോ, അത്രത്തോളം മേന്മയേറിയ ശുശ്രൂഷ[a] അവൻ നേടിയിരിക്കുന്നു; ആ ഉടമ്പടി മെച്ചമായ വാഗ്ദാനങ്ങളുടെ അടിസ്ഥാനത്തിൽ നിയമപരമായി സ്ഥാപിക്കപ്പെട്ടിരിക്കുന്നു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മേന്മയേറിയ ശുശ്രൂഷ.’
    reason: lexical_alternative
  - marker: b
    text: διαθήκη എന്ന ഗ്രീക്ക് പദത്തിന് ചില സന്ദർഭങ്ങളിൽ ‘വിൽപ്പത്രം’ എന്നും അർഥമാകാം; എന്നാൽ തുടർന്നുള്ള വാക്യങ്ങളിൽ ഉദ്ധരിക്കുന്ന യിരെമ്യാവിന്റെ പുതിയ ഉടമ്പടിവാഗ്ദാനത്തിന്റെ പശ്ചാത്തലത്തിൽ ഇവിടെ ‘ഉടമ്പടി’യാണ് യോജിക്കുന്നത്.
    reason: alternative_reading
  - marker: c
    text: അഥവാ, ‘സ്ഥാപിക്കപ്പെട്ടിരിക്കുന്നു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: എന്നാൽ ഇപ്പോൾ
  rationale: മുമ്പ് പറഞ്ഞ ഭൂമിയിലെ പുരോഹിതശുശ്രൂഷയോടുള്ള വർത്തമാനകാല വൈരുധ്യം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: διαφορωτέρας
  choice: മികവേറിയ
  rationale: ഗുണപരമായ മേന്മ സൂചിപ്പിക്കുന്ന താരതമ്യഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τέτυχεν
  choice: ലഭിച്ചിരിക്കുന്നു
  rationale: പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴും നിലനിൽക്കുന്ന ഫലം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പൂർണ്ണകാലത്തിന്റെ ആശയം നിലനിർത്തുന്നു.
- source_word: λειτουργίας
  choice: ശുശ്രൂഷ
  rationale: സന്ദർഭത്തിലെ ക്രിസ്തുവിന്റെ വിശുദ്ധവും പുരോഹിതപരവുമായ സേവനത്തെ, അനാവശ്യ വിശദീകരണം ചേർക്കാതെ, വ്യക്തമാക്കുന്നു.
- source_word: ὅσῳ καὶ
  choice: എത്രത്തോളം ... അത്രത്തോളം
  rationale: ശുശ്രൂഷയുടെ മേന്മയും മധ്യസ്ഥത വഹിക്കുന്ന ഉടമ്പടിയുടെ മേന്മയും തമ്മിലുള്ള ആനുപാതികബന്ധം സംരക്ഷിക്കുന്നു.
- source_word: κρείττονός ... διαθήκης
  choice: കൂടുതൽ നല്ല ഉടമ്പടിയുടെ
  rationale: എബ്രായലേഖനത്തിൽ ആവർത്തിക്കുന്ന മേന്മയുടെ ഭാഷയും പഴയനിയമ ഉടമ്പടിപശ്ചാത്തലവും നിലനിർത്തുന്നു.
- source_word: μεσίτης
  choice: മധ്യസ്ഥൻ
  rationale: ഉടമ്പടിയിലെ കക്ഷികൾക്കിടയിൽ നിന്നു ബന്ധം സാധ്യമാക്കുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്ന കൃത്യവും സ്ഥാപിതവുമായ പദമാണ്.
- source_word: ἥτις
  choice: ആ ഉടമ്പടി
  rationale: ബന്ധസർവനാമത്തിന്റെ സൂചന വ്യക്തമായ മലയാളത്തിൽ ആവർത്തിച്ച്, വിവരണാത്മക ഉപവാക്യം സുതാര്യമാക്കുന്നു.
- source_word: ἐπὶ κρείττοσιν ἐπαγγελίαις
  choice: കൂടുതൽ നല്ല വാഗ്ദാനങ്ങളെ അടിസ്ഥാനമാക്കി
  rationale: ἐπί ഇവിടെ സൂചിപ്പിക്കുന്ന അടിസ്ഥാനം എന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: νενομοθέτηται
  choice: പ്രാബല്യത്തിൽ വരുത്തപ്പെട്ടിരിക്കുന്നു
  rationale: നിയമപരമായി സ്ഥാപിച്ച് പ്രാബല്യത്തിലാക്കിയതും അതിന്റെ ഫലം തുടരുന്നതുമായ പൂർണ്ണകാല കർമണിപ്രയോഗം പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: എബ്രായർ 8:6-ൽ διαθήκη എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ഉടമ്പടി
  alternative: വിൽപ്പത്രം
  rationale: തുടർന്നുള്ള വാക്യങ്ങളിൽ ഉദ്ധരിക്കുന്ന യിരെമ്യാവിന്റെ പുതിയ ഉടമ്പടിവാഗ്ദാനവും പുരോഹിതമധ്യസ്ഥതയും ഇവിടെ നേരിട്ടുള്ള പശ്ചാത്തലമായതിനാൽ ‘ഉടമ്പടി’ യോജിക്കുന്നു; ചില മറ്റു സന്ദർഭങ്ങളിൽ സാധ്യമായ ‘വിൽപ്പത്രം’ ഇവിടെ ആ പശ്ചാത്തലം മറയ്ക്കും.
- issue: νενομοθέτηται എന്നതിലെ നിയമപരമായ ഭാവം
  choice: പ്രാബല്യത്തിൽ വരുത്തപ്പെട്ടിരിക്കുന്നു
  alternative: സ്ഥാപിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: ഉടമ്പടി വെറും രൂപീകരിക്കപ്പെട്ടു എന്നതിലുപരി ഔപചാരികമായി ഏർപ്പെടുത്തി പ്രാബല്യത്തിലായിരിക്കുന്നു എന്ന ഭാവം സംരക്ഷിക്കുന്നു; പൊതുവായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഗ്രീക്കിലെ താരതമ്യ-ആനുപാതിക ഘടന ‘എത്രത്തോളം ... അത്രത്തോളം’ എന്ന രൂപത്തിൽ നിലനിർത്തി; നീണ്ട വാക്യത്തിന്റെ വ്യക്തതയ്ക്കായി അർധവിരാമം ഉപയോഗിച്ചു.
