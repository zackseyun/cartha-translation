id: HEB.8.8
reference: Hebrews 8:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μεμφόμενος γὰρ ⸀αὐτοὺς λέγει· Ἰδοὺ ἡμέραι ἔρχονται, λέγει κύριος, καὶ συντελέσω ἐπὶ τὸν οἶκον Ἰσραὴλ καὶ ἐπὶ τὸν οἶκον Ἰούδα διαθήκην καινήν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/008.yaml
  text: For in finding fault with them he says, “Look, days are coming, says the Lord, when I will establish a new covenant with the house of Israel and with the house of Judah,”
translation:
  language: ml
  text: 'എന്തെന്നാൽ, അവരെ കുറ്റപ്പെടുത്തിക്കൊണ്ട് അവൻ പറയുന്നു: “ഇതാ, നാളുകൾ വരുന്നു—കർത്താവ് അരുളിച്ചെയ്യുന്നു—അന്ന് ഞാൻ ഇസ്രായേൽഗൃഹത്തോടും യെഹൂദാഗൃഹത്തോടും ഒരു പുതിയ ഉടമ്പടി സ്ഥാപിക്കും,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεμφόμενος ... αὐτοὺς
  choice: അവരെ കുറ്റപ്പെടുത്തിക്കൊണ്ട്
  rationale: ക്രിയയുടെ നേരിട്ടുള്ള കർമമായ ‘അവരെ’ നിലനിർത്തുകയും, കുറ്റം ചുമത്തുക/കുറ്റപ്പെടുത്തുക എന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: Ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന പ്രവാചകീയ പ്രയോഗം ചുരുക്കമായും ഗൗരവത്തോടെയും നിലനിർത്തുന്നു.
- source_word: συντελέσω ... διαθήκην
  choice: ഉടമ്പടി സ്ഥാപിക്കും
  rationale: സന്ദർഭത്തിൽ ഉടമ്പടി പ്രാബല്യത്തിൽ കൊണ്ടുവരുക എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു; ‘പൂർത്തിയാക്കും’ എന്ന പദാനുപദ പരിഭാഷ മലയാളത്തിൽ തെറ്റിദ്ധാരണയ്ക്ക് ഇടയാക്കാം.
- source_word: οἶκον Ἰσραὴλ ... οἶκον Ἰούδα
  choice: ഇസ്രായേൽഗൃഹത്തോടും യെഹൂദാഗൃഹത്തോടും
  rationale: ബൈബിൾപരമായ സമൂഹ/വംശ അർഥമുള്ള ‘ഗൃഹം’ എന്ന രൂപകം സംരക്ഷിക്കുന്നു; ἐπὶ എന്ന ബന്ധം ഉടമ്പടി സ്ഥാപിക്കുന്നവരോടുള്ള ബന്ധമായി മലയാളത്തിൽ ‘-ത്തോട്’ ഉപയോഗിച്ച് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ‘അവരെ’ (αὐτούς) എന്നതിന്റെ സൂചന
  choice: സർവനാമം അതേപടി നിലനിർത്തി
  alternative: മുൻ ഉടമ്പടിയിലുള്ളവരെയോ ഇസ്രായേലിനെയോ പേരെടുത്ത് വ്യക്തമാക്കുക
  rationale: ഈ വാക്യം സൂചിപ്പിക്കുന്നവരെ വ്യാഖ്യാനപരമായി നിർണ്ണയിക്കാതെ ഗ്രീക്ക് വാചകത്തിലെ പരാമർശസ്വഭാവവും സന്ദർഭപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
- issue: പുതിയ ഉടമ്പടിയുടെ പ്രവർത്തി
  choice: ‘സ്ഥാപിക്കും’
  alternative: ‘പൂർത്തിയാക്കും’ അല്ലെങ്കിൽ ‘ഉണ്ടാക്കും’
  rationale: συντελέσω എന്ന പദത്തിന്റെ പൂർത്തീകരിച്ച് പ്രാബല്യത്തിൽ വരുത്തുന്ന ആശയം ഇവിടെ ഉടമ്പടി സ്ഥാപിക്കൽ എന്ന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ഉടമ്പടിയുടെ ദൈവശാസ്ത്രപരമായ സ്വഭാവം അധികമായി നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രവാചകീയ ശൈലി. ഉദ്ധരണിക്കുള്ളിലെ ‘കർത്താവ് അരുളിച്ചെയ്യുന്നു’ എന്ന ഇടച്ചൊല്ല് ദീർഘരേഖകൾക്കിടയിൽ നൽകി ഗ്രീക്ക് വാക്യക്രമവും മലയാള വായനാസൗകര്യവും ഒരുമിച്ച് സംരക്ഷിച്ചു.
