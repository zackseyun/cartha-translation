id: HEB.8.11
reference: Hebrews 8:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ οὐ μὴ διδάξωσιν ἕκαστος τὸν πολίτην αὐτοῦ καὶ ἕκαστος τὸν ἀδελφὸν αὐτοῦ, λέγων· Γνῶθι τὸν κύριον, ὅτι πάντες εἰδήσουσίν με ἀπὸ ⸀μικροῦ ἕως μεγάλου αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/011.yaml
  text: And they will certainly not teach[a], each one his fellow citizen and each one his brother, saying, ‘Know the Lord,’ because they will all know me, from the least of them to the greatest.
translation:
  language: ml
  text: ഓരോരുത്തനും തന്റെ സഹപൗരനെയും ഓരോരുത്തനും തന്റെ സഹോദരനെയും, ‘കർത്താവിനെ അറിയുക’ എന്നു പറഞ്ഞ്, ഒരിക്കലും പഠിപ്പിക്കുകയില്ല[a]. കാരണം, അവരിൽ ഏറ്റവും ചെറിയവൻ മുതൽ ഏറ്റവും വലിയവൻ വരെ എല്ലാവരും എന്നെ അറിയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘അയൽക്കാരനെ.’ ഹീബ്രായർക്കുള്ള ലേഖനത്തിന്റെ ഗ്രീക്ക് പാഠത്തിൽ ‘സഹപൗരൻ’ എന്നാണ്; എന്നാൽ ഇതിന് അടിസ്ഥാനമായ യിരെമ്യാവിലെ വാക്യം സാധാരണയായി ‘അയൽക്കാരൻ’ എന്നു പരിഭാഷപ്പെടുത്തപ്പെടുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ μὴ διδάξωσιν
  choice: ഇനി ഒരിക്കലും പഠിപ്പിക്കുകയില്ല
  rationale: οὐ μήയോടുകൂടിയ aorist subjunctive ശക്തമായ നിഷേധമാണ്. മലയാളത്തിൽ സ്വാഭാവികമായി അതിന്റെ ഊന്നൽ പ്രകടമാക്കാൻ ‘ഇനി ഒരിക്കലും ... ഇല്ല’ ഉപയോഗിച്ചു.
- source_word: ἕκαστος
  choice: ഓരോരുത്തനും
  rationale: ഉടമ്പടി സമൂഹത്തിലെ വ്യക്തികളെ വേർതിരിച്ചുകാട്ടുന്ന distributive അർഥം നിലനിർത്തുന്നു.
- source_word: πολίτην
  choice: സഹപൗരനെ
  rationale: ഹീബ്രായലേഖനത്തിലെ നിലവിലുള്ള ഗ്രീക്ക് പാഠം ‘പൗരൻ’ എന്ന പ്രത്യേക അർഥമുള്ള πολίτης ആണ്; അതിനാൽ യിരെമ്യാവിലെ പതിവ് ‘അയൽക്കാരൻ’ എന്ന പരിഭാഷയ്ക്കുപകരം ഗ്രീക്ക് പാഠത്തിന് മുൻഗണന നൽകി.
- source_word: ἀδελφόν
  choice: സഹോദരനെ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ഏകവചനവും കുടുംബബന്ധത്തെ സൂചിപ്പിക്കുന്ന ഉടമ്പടിഭാഷയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: Γνῶθι
  choice: അറിയുക
  rationale: aorist imperative-ന്റെ നേരിട്ടുള്ള ആജ്ഞാരൂപം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: κύριον
  choice: കർത്താവിനെ
  rationale: κύριος എന്ന ഉടമ്പടിസന്ദർഭത്തിലുള്ള പദത്തിന് മലയാള ബൈബിൾഭാഷയിൽ വ്യക്തവും മാന്യവുമായ പതിവുരൂപം.
- source_word: εἰδήσουσίν με
  choice: എല്ലാവരും എന്നെ അറിയും
  rationale: πάντες എന്ന സമഗ്രതയും με എന്ന പ്രത്യക്ഷ കർമവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἀπὸ μικροῦ ἕως μεγάλου αὐτῶν
  choice: അവരിൽ ഏറ്റവും ചെറിയവൻമുതൽ ഏറ്റവും വലിയവൻവരെ
  rationale: പ്രായമോ പദവിയോ മാത്രം പരിമിതപ്പെടുത്താതെ സമൂഹത്തിലെ മുഴുവൻ ശ്രേണിയെയും ഉൾക്കൊള്ളുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു.
theological_decisions:
- issue: യിരെമ്യാവ് 31:34-ന്റെ ഉദ്ധരണിസന്ദർഭത്തിൽ πολίτην എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: സഹപൗരനെ
  alternative: അയൽക്കാരനെ
  rationale: പഴയനിയമസന്ദർഭം കാരണം ‘അയൽക്കാരൻ’ പരിചിതമാണെങ്കിലും, ഹീബ്രായലേഖനത്തിലെ ഗ്രീക്ക് പാഠത്തിൽ πολίτην എന്നാണ്. അതിനാൽ മൂലഭാഷയ്ക്ക് മുൻഗണന നൽകി പ്രധാനപാഠത്തിൽ ‘സഹപൗരൻ’ നിലനിർത്തി; പരിചിതമായ മറ്റുവായന അടിക്കുറിപ്പിൽ നൽകി.
- issue: ἀδελφόν എന്ന ലിംഗസൂചക കുടുംബപദം
  choice: സഹോദരനെ
  alternative: സഹോദരനെയോ സഹോദരിയെയോ
  rationale: മൂലപാഠത്തിലെ പുല്ലിംഗ ഏകവചനരൂപവും കുടുംബബന്ധഭാഷയും മാറ്റാതെ സൂക്ഷിച്ചു; വാഗ്ദാനത്തിന്റെ വിശാലമായ പ്രയോഗം വിവർത്തനത്തിൽ വിപുലീകരിച്ച് ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിലും തിരുവെഴുത്തിന് യോജിച്ച മാന്യമായ ശൈലിയിലും വിവർത്തനം ചെയ്തു. ശക്തമായ നിഷേധം സ്വാഭാവികമാക്കാൻ ‘ഇനി ഒരിക്കലും’ ഉപയോഗിച്ചു; ഗ്രീക്ക് വാക്യത്തിന്റെ ആവർത്തനഭാരം കുറയ്ക്കാതെ മലയാള പദക്രമം ക്രമപ്പെടുത്തി.
