  to: ഓരോരുത്തനും തന്റെ സഹപൗരനെയും ഓരോരുത്തനും തന്റെ സഹോദരനെയും, ‘കർത്താവിനെ അറിയുക’ എന്നു പറഞ്ഞ്, ഒരിക്കലും പഠിപ്പിക്കുകയില്ല[a]. കാരണം, അവരിൽ ഏറ്റവും ചെറിയവൻ മുതൽ ഏറ്റവും വലിയവൻ വരെ എല്ലാവരും എന്നെ അറിയും.
  rationale: The revision restores the repeated distributive force of ἕκαστος, avoids adding a temporal implication to οὐ μή, and makes minor punctuation, spacing, and footnote-style improvements. It retains the Greek-specific ‘സഹപൗരൻ’ and the masculine singular familial term ‘സഹോദരൻ.’
