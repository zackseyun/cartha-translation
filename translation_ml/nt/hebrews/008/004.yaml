  text: εἰ μὲν ⸀οὖν ἦν ἐπὶ γῆς, οὐδ’ ἂν ἦν ἱερεύς, ⸀ὄντων τῶν προσφερόντων κατὰ ⸀νόμον τὰ δῶρα·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/004.yaml
  text: If he were on earth[a], he would not even be a priest, since there are those who offer the gifts according to the law.
translation:
  language: ml
  text: അവൻ ഭൂമിയിലായിരുന്നെങ്കിൽ പുരോഹിതൻപോലും ആകുമായിരുന്നില്ല; കാരണം ന്യായപ്രമാണപ്രകാരം കാഴ്ചകൾ[a] അർപ്പിക്കുന്നവർ ഉണ്ട്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വഴിപാടുകൾ.’ ഗ്രീക്കിൽ ‘ദാനങ്ങൾ’ എന്നർഥമുള്ള പദമാണ്; ഈ സന്ദർഭത്തിൽ അത് യാഗാർപ്പണങ്ങൾക്കുള്ള സാധാരണ പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ μὲν οὖν
  choice: അതിനാൽ, … ആയിരുന്നെങ്കിൽ
  rationale: οὖν സൂചിപ്പിക്കുന്ന മുൻവാദത്തിൽനിന്നുള്ള നിഗമനബന്ധവും εἰ തുടങ്ങുന്ന നിബന്ധനയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; μὲν-ന് ഇവിടെ വേറിട്ടൊരു പദം ചേർക്കുന്നത് വാക്യം ഭാരമുള്ളതാക്കും.
- source_word: ἦν ἐπὶ γῆς
  choice: അവൻ ഭൂമിയിലായിരുന്നെങ്കിൽ
  rationale: ἐπὶ γῆς ചുറ്റുപാടിലുള്ള സ്വർഗീയ–ഭൗമിക വൈരുധ്യത്തിൽ ‘ഭൂമിയിൽ’ എന്നാണ്; അപൂർണ്ണ ഭൂതകാലവും നിബന്ധനാഘടനയും ചേർന്നുള്ള യാഥാർഥ്യവിരുദ്ധ അർഥം ‘ആയിരുന്നെങ്കിൽ’ വ്യക്തമാക്കുന്നു.
- source_word: οὐδ’ ἂν ἦν ἱερεύς
  choice: ഒരു പുരോഹിതൻപോലും ആകുമായിരുന്നില്ല
  rationale: οὐδέയുടെ ഊന്നിയ നിഷേധം ‘പോലും’ കൊണ്ടും ἄν സഹിതമുള്ള സങ്കൽപ്പിത ഫലം ‘ആകുമായിരുന്നില്ല’ കൊണ്ടും പകർത്തുന്നു.
- source_word: ὄντων τῶν προσφερόντων
  choice: അർപ്പിക്കുന്നവർ ഇവിടെ ഉണ്ട്
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ടിന്റെ സാഹചര്യപരവും കാരണപരവുമായ ഭാവം മുൻപുള്ള ‘കാരണം’ വ്യക്തമാക്കുന്നു. ഗ്രീക്കിൽ സ്ഥലം പ്രത്യേകം പറഞ്ഞിട്ടില്ലെങ്കിലും, ഭൂമിയിലെ നിലവിലുള്ള പുരോഹിതരെ സൂചിപ്പിക്കുന്ന ബന്ധം മലയാളത്തിൽ വ്യക്തമായി വായിക്കാനാണ് ‘ഇവിടെ’ ഉപയോഗിച്ചത്.
- source_word: κατὰ νόμον
  choice: ന്യായപ്രമാണപ്രകാരം
  rationale: പുരോഹിതശുശ്രൂഷയെ നിയന്ത്രിക്കുന്ന മോശൈക നിയമക്രമമാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്; മലയാള ബൈബിൾ പ്രയോഗത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമായ രൂപമാണിത്.
- source_word: τὰ δῶρα
  choice: കാഴ്ചകൾ
  rationale: യാഗാരാധനാസന്ദർഭത്തിലെ ദൈവത്തിനു സമർപ്പിക്കുന്ന ദാനങ്ങൾ എന്ന അർഥം നൽകുകയും προσφέρω-യെ പരിഭാഷപ്പെടുത്തിയ ‘അർപ്പിക്കുക’ എന്ന ക്രിയയുമായി അനാവശ്യ പദാവർത്തനം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: നിബന്ധനാവാക്യത്തിലെ പരോക്ഷ കർത്താവ്
  choice: സമീപസന്ദർഭത്തിലെ യേശുവിനെ സൂചിപ്പിച്ച് ‘അവൻ’ എന്നു വ്യക്തമാക്കി.
  alternative: കർത്താവിനെ പരോക്ഷമായിത്തന്നെ വിടുക.
  rationale: ഗ്രീക്കിൽ കർത്താവ് ക്രിയാരൂപത്തിൽ ഉൾക്കൊള്ളുന്നുവെങ്കിലും മലയാളത്തിൽ വ്യക്തതയ്ക്കായി സർവനാമം ആവശ്യമാണ്; ഇത് സന്ദർഭത്തിനു പുറത്തുള്ള ദൈവശാസ്ത്രനിഗമനം ചേർക്കുന്നില്ല.
- issue: നിബന്ധനയുടെ യാഥാർഥ്യവിരുദ്ധ സ്വഭാവം
  choice: ‘ഭൂമിയിലായിരുന്നെങ്കിൽ … ആകുമായിരുന്നില്ല’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ഭൂമിയിലാണെങ്കിൽ … ആകുകയില്ല’ എന്ന തുറന്ന നിബന്ധനയായി വായിക്കുക.
  rationale: εἰ + imperfect, ἄν + imperfect എന്ന ഘടന ഭൂമിയിലായിരുന്നുവെന്ന സങ്കൽപ്പത്തിനു വിരുദ്ധമായ ഫലമാണ് അവതരിപ്പിക്കുന്നത്; മലയാളത്തിലെ ഭൂതകാല സങ്കൽപ്പിത രൂപം അത് സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. ‘പുരോഹിതൻ’, ‘ന്യായപ്രമാണം’, ‘കാഴ്ചകൾ’ എന്നീ പദങ്ങൾ ആരാധനാസന്ദർഭത്തിന്റെ സ്വഭാവം നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് ചൂണ്ടിക്കാണിക്കുന്ന പദത്തിനുശേഷം തന്നെയാണ് [a] ചേർത്തിരിക്കുന്നത്.
