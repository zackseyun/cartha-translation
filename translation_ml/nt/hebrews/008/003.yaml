id: HEB.8.3
reference: Hebrews 8:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πᾶς γὰρ ἀρχιερεὺς εἰς τὸ προσφέρειν δῶρά τε καὶ θυσίας καθίσταται· ὅθεν ἀναγκαῖον ἔχειν τι καὶ τοῦτον ὃ προσενέγκῃ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/003.yaml
  text: For every high priest is appointed to offer both gifts and sacrifices[a]; therefore it is necessary for this one also to have something that he may offer.
translation:
  language: ml
  text: ഓരോ മഹാപുരോഹിതനും വഴിപാടുകളും യാഗങ്ങളും അർപ്പിക്കാനാണല്ലോ നിയമിക്കപ്പെടുന്നത്. അതുകൊണ്ട്, ഇദ്ദേഹത്തിനും അർപ്പിക്കാൻ എന്തെങ്കിലും ഉണ്ടായിരിക്കേണ്ടത് അനിവാര്യമാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “ഇദ്ദേഹത്തിനും അർപ്പിക്കാനായി എന്തെങ്കിലും ഉണ്ടായിരിക്കണം.” ഗ്രീക്ക് വാക്യത്തിൽ ‘ഇദ്ദേഹം’ ആരെന്നത് പേരെടുത്തു പറയുന്നില്ല; സന്ദർഭത്തിൽ അത് മഹാപുരോഹിതനായ യേശുവിനെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς γὰρ ἀρχιερεὺς
  choice: ഓരോ മഹാപുരോഹിതനും ... ആണല്ലോ
  rationale: πᾶς എന്ന ഏകവചനപ്രയോഗത്തിന്റെ വിതരണാർഥം ‘ഓരോ’ നിലനിർത്തുന്നു. γάρ മുൻവാക്യത്തോടുള്ള വിശദീകരണബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ‘ആണല്ലോ’ എന്നു നൽകി.
- source_word: εἰς τὸ προσφέρειν
  choice: അർപ്പിക്കാൻ
  rationale: εἰς ചേർന്ന articular infinitive ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു; ‘അർപ്പിക്കാൻ’ അതിന്റെ ഉദ്ദേശ്യാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: δῶρά τε καὶ θυσίας
  choice: വഴിപാടുകളും യാഗങ്ങളും
  rationale: τε καὶ ബന്ധിപ്പിക്കുന്ന രണ്ട് വ്യത്യസ്ത ആരാധനാകർമവിഭാഗങ്ങളെയും വേർതിരിച്ചു നിലനിർത്തുന്നു. δῶρα എന്നതിന് ‘വഴിപാടുകൾ’, θυσίαι എന്നതിന് ‘യാഗങ്ങൾ’ എന്നത് മലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ പ്രയോഗമാണ്.
- source_word: καθίσταται
  choice: നിയമിക്കപ്പെടുന്നു
  rationale: പുരോഹിതസ്ഥാനത്തേക്ക് സ്ഥാപിക്കപ്പെടുകയോ നിയോഗിക്കപ്പെടുകയോ ചെയ്യുന്നതാണ് ഇവിടെ ഉദ്ദേശ്യം; ‘നിയമിക്കപ്പെടുന്നു’ ഔദ്യോഗികനിയോഗത്തിന്റെ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: ὅθεν
  choice: അതുകൊണ്ട്
  rationale: മുൻപ്രസ്താവനയിൽനിന്നുള്ള നിഗമനം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀναγκαῖον ἔχειν
  choice: ഉണ്ടായിരിക്കേണ്ടത് അനിവാര്യമാണ്
  rationale: ഗ്രീക്കിലെ അനിവാര്യതാബോധം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: τι
  choice: എന്തെങ്കിലും
  rationale: അർപ്പിക്കപ്പെടുന്ന വസ്തു ഏതെന്ന് വ്യക്തമാക്കാത്ത അനിശ്ചിതസർവനാമത്തിന്റെ അർഥം സംരക്ഷിക്കുന്നു.
- source_word: καὶ τοῦτον
  choice: ഇദ്ദേഹത്തിനും
  rationale: καί എന്നതിന്റെ ‘-ഉം’ എന്ന ഉൾപ്പെടുത്തൽഭാവവും τοῦτον എന്ന നിർദ്ദേശസർവനാമത്തിന്റെ ഭാവവും നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ യേശുവിനെ സൂചിപ്പിച്ചാലും പേര് മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: ὃ προσενέγκῃ
  choice: അർപ്പിക്കാൻ
  rationale: ബന്ധസർവനാമത്തോടുകൂടിയ aorist subjunctive സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യസാധ്യത മലയാളത്തിലെ infinitive ഘടനയിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
theological_decisions:
- issue: τοῦτον (‘ഇദ്ദേഹം’) എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: സന്ദർഭത്തിൽ മഹാപുരോഹിതനായ യേശുവിനെയാണ് സൂചിപ്പിക്കുന്നത്; എന്നാൽ മുഖ്യപാഠത്തിൽ ഗ്രീക്കിലെ നിർദ്ദേശപ്രയോഗം നിലനിർത്തി.
  alternative: മുഖ്യപാഠത്തിൽ ‘യേശുവിനും’ അല്ലെങ്കിൽ ‘ക്രിസ്തുവിനും’ എന്ന് വ്യക്തമാക്കുക.
  rationale: സന്ദർഭം സൂചിതവ്യക്തിയെ വ്യക്തമാക്കുന്നുണ്ടെങ്കിലും ഗ്രീക്ക് പാഠം പേര് പറയുന്നില്ല. അതിനാൽ പേര് ചേർത്ത് അവ്യക്തത നീക്കാതെ പാഠത്തിന്റെ രൂപം സംരക്ഷിച്ചു.
- issue: δῶρα, θυσίαι എന്നീ ആരാധനാകർമപദങ്ങൾ
  choice: ‘വഴിപാടുകൾ’, ‘യാഗങ്ങൾ’ എന്നീ വ്യത്യസ്ത വിഭാഗങ്ങളായി നിലനിർത്തി.
  alternative: രണ്ടും ചേർത്ത് ‘യാഗാർപ്പണങ്ങൾ’ എന്നോ ‘ബലികൾ’ എന്നോ പരിഭാഷപ്പെടുത്തുക.
  rationale: വാക്യം പൊതുവായ പുരോഹിതതത്ത്വം പ്രസ്താവിക്കുന്നു; ക്രിസ്തുവിന്റെ സ്വയാർപ്പണത്തെക്കുറിച്ചുള്ള വിശദീകരണം ഇവിടെ ചേർക്കാതെ പാഠത്തിലെ രണ്ട് വിഭാഗങ്ങളും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. പുരോഹിതാരാധനയുമായി ബന്ധപ്പെട്ട പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നവിധം നൽകിയപ്പോൾ അവയുടെ വ്യത്യാസം നിലനിർത്തി; ഗ്രീക്കിലെ സൂചിതവ്യക്തിയെ മുഖ്യപാഠത്തിൽ അതിലധികം വ്യക്തമാക്കിയിട്ടില്ല.
