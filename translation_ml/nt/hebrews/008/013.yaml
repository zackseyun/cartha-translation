  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν τῷ λέγειν Καινὴν πεπαλαίωκεν τὴν πρώτην, τὸ δὲ παλαιούμενον καὶ γηράσκον ἐγγὺς ἀφανισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/013.yaml
  text: By saying[a], “new,” he has made the first obsolete[c][b]. And what is becoming obsolete and growing old is near to disappearing.
translation:
  language: ml
  text: “പുതിയത്” എന്നു പറയുന്നതിലൂടെ[a], അവൻ ആദ്യത്തേതിനെ കാലഹരണപ്പെടുത്തിയിരിക്കുന്നു.[b] കാലഹരണപ്പെടുകയും പഴകുകയും ചെയ്യുന്നത് അപ്രത്യക്ഷമാകുന്നതിന് അടുത്തിരിക്കുന്നു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “എന്നു പറയുമ്പോൾ” അല്ലെങ്കിൽ “എന്നു പറയുന്നതിൽ.”
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ “പുതിയത്” എന്ന വാക്കു മാത്രമാണ് ഉദ്ധരിച്ചിരിക്കുന്നത്; മുൻ ഉദ്ധരണിയിലെ “പുതിയ ഉടമ്പടി” എന്ന പ്രയോഗത്തെയാണ് അത് ഓർമിപ്പിക്കുന്നത് (യിരെമ്യാവ് 31:31; എബ്രായർ 8:8).
    reason: cross_reference
  - marker: c
    text: അഥവാ “മാഞ്ഞുപോകുന്നതിന് അടുത്തിരിക്കുന്നു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ λέγειν
  choice: എന്നു പറയുന്നതിലൂടെ
  rationale: ἐν സഹിതമുള്ള articular infinitive സാഹചര്യത്തെയോ മാർഗത്തെയോ സൂചിപ്പിക്കുന്നു. ഇവിടെ ‘പറയുന്നതിലൂടെ’ എന്നത് പുതിയതെന്ന പ്രഖ്യാപനവും ആദ്യത്തേതിന്റെ നിലയും തമ്മിലുള്ള കാരണാത്മക ബന്ധം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: Καινὴν
  choice: “പുതിയത്”
  rationale: ഗ്രീക്കിൽ വിശേഷണം മാത്രമാണ് ഉദ്ധരിച്ചിരിക്കുന്നത്; മുൻവാക്യഭാഗത്തിലെ ‘പുതിയ ഉടമ്പടി’ എന്ന പ്രയോഗത്തെ സംക്ഷിപ്തമായി ഓർമിപ്പിക്കുന്നു. ഇല്ലാത്ത ‘ഉടമ്പടി’ എന്ന നാമം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: πεπαλαίωκεν
  choice: കാലഹരണപ്പെട്ടതാക്കിയിരിക്കുന്നു
  rationale: perfect രൂപം പൂർത്തിയായ പ്രവൃത്തിയെയും അതിന്റെ ഇപ്പോഴത്തെ ഫലത്തെയും സൂചിപ്പിക്കുന്നു. ‘കാലഹരണപ്പെട്ടതാക്കിയിരിക്കുന്നു’ എന്നത് വെറും പ്രായം കൂടിയെന്നതിലുപരി സന്ദർഭത്തിലെ പഴയതാകൽ/പ്രാബല്യം നഷ്ടപ്പെടൽ എന്ന ബലം നൽകുന്നു.
- source_word: τὴν πρώτην
  choice: ആദ്യത്തേതിനെ
  rationale: വിശേഷണം ഇവിടെ നാമത്തിന്റെ സ്ഥാനത്ത് നിൽക്കുന്നു; സന്ദർഭത്തിൽ അത് ആദ്യത്തെ ഉടമ്പടിയെ സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിന്റെ സംക്ഷിപ്തത നിലനിർത്താൻ ‘ഉടമ്പടി’ മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: τὸ ... παλαιούμενον
  choice: കാലഹരണപ്പെട്ടുകൊണ്ടും ... ഇരിക്കുന്നത്
  rationale: വർത്തമാനകാല participle തുടരുന്ന പ്രക്രിയയെ സൂചിപ്പിക്കുന്നു. ഈ രൂപം ആ പുരോഗമനഭാവം മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: γηράσκον
  choice: പഴകിക്കൊണ്ടും
  rationale: പ്രായംചെന്നുകൊണ്ടിരിക്കുന്നതിന്റെ ദൃശ്യരൂപം നിലനിർത്തുകയും മുൻ participle-നോടൊപ്പം സ്വാഭാവികമായി ചേരുകയും ചെയ്യുന്നു.
- source_word: ἐγγὺς
  choice: അടുത്തിരിക്കുന്നു
  rationale: genitive-നോടുകൂടിയ ἐγγύς സൂചിപ്പിക്കുന്ന സമീപ്യത വ്യക്തമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀφανισμοῦ
  choice: മാഞ്ഞുപോകുന്നതിന്
  rationale: ഈ നാമം അപ്രത്യക്ഷമാകൽ, മറഞ്ഞുപോകൽ എന്നീ അർഥങ്ങൾ വഹിക്കുന്നു. ‘മാഞ്ഞുപോകുക’ വായനാസൗകര്യമുള്ളതും മൂലത്തിലെ ദൃശ്യഭാവം നിലനിർത്തുന്നതുമാണ്.
theological_decisions:
- issue: “പുതിയത്” എന്നു പറയുന്നവന്റെ പരോക്ഷമായ കർത്താവ്
  choice: മുഖ്യപാഠത്തിൽ കർത്താവിനെ വ്യക്തമാക്കാതെ വിട്ടു
  alternative: ‘അവൻ’ അല്ലെങ്കിൽ ‘ദൈവം’ എന്നു വ്യക്തമാക്കുക
  rationale: ഗ്രീക്കിൽ കർത്താവ് പ്രത്യക്ഷമായി നൽകിയിട്ടില്ല; യിരെമ്യാവിന്റെ ഉദ്ധരണിയിൽ സംസാരിക്കുന്നവനിലേക്കാണ് സന്ദർഭം വിരൽചൂണ്ടുന്നത്. മലയാളത്തിൽ കർത്താവിനെ ഒഴിവാക്കുന്നത് ഈ സംക്ഷിപ്തതയും അവ്യക്തതയും നിലനിർത്തുന്നു.
- issue: ആദ്യത്തെ ഉടമ്പടിയുടെ സ്ഥിതി
  choice: ‘കാലഹരണപ്പെട്ടതാക്കിയിരിക്കുന്നു’
  alternative: ‘പഴയതാക്കിയിരിക്കുന്നു’
  rationale: പുതിയ ഉടമ്പടിയുമായുള്ള വിരുദ്ധതയിൽ ആദ്യത്തേത് പഴയതും മറഞ്ഞുപോകാനടുത്തതുമായി മാറിയെന്ന വാദം ഈ പരിഭാഷ അറിയിക്കുന്നു; അതേസമയം ന്യായപ്രമാണത്തെക്കുറിച്ചുള്ള അധിക സിദ്ധാന്തപരമായ നിഗമനങ്ങൾ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി ഉപയോഗിച്ചു. ഉടമ്പടി എന്ന നാമം സന്ദർഭത്തിൽ വ്യക്തമായതിനാൽ ഗ്രീക്കിനെപ്പോലെ മുഖ്യപാഠത്തിൽ ആവർത്തിച്ചിട്ടില്ല. സമാന്തര participle-കളുടെ പുരോഗമനസ്വഭാവം ‘കാലഹരണപ്പെട്ടുകൊണ്ടും പഴകിക്കൊണ്ടും’ എന്ന ഘടനയിൽ നിലനിർത്തി.
