    text: 'കൂടുതൽ സുഗമമായി: “ഞാൻ എന്റെ നിയമങ്ങൾ അവരുടെ മനസ്സുകളിൽ നൽകും; ഞാൻ അവ അവരുടെ ഹൃദയങ്ങളിൽ എഴുതും.” ഗ്രീക്കിൽ ആദ്യത്തേത് ഒരു കൃദന്തരൂപവും (“നൽകിക്കൊണ്ട്”) രണ്ടാമത്തേത് ഭാവികാലക്രിയയും (“ഞാൻ എഴുതും”) ആണ്.'
