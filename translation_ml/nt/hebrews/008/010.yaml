id: HEB.8.10
reference: Hebrews 8:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι αὕτη ἡ διαθήκη ἣν διαθήσομαι τῷ οἴκῳ Ἰσραὴλ μετὰ τὰς ἡμέρας ἐκείνας, λέγει κύριος, διδοὺς νόμους μου εἰς τὴν διάνοιαν αὐτῶν, καὶ ἐπὶ καρδίας αὐτῶν ἐπιγράψω αὐτούς, καὶ ἔσομαι αὐτοῖς εἰς θεόν καὶ αὐτοὶ ἔσονταί μοι εἰς λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/010.yaml
  text: 'For this is the covenant that I will make with the house of Israel after those days[a], says the Lord: putting my laws into their minds, and I will write them on their hearts; and I will be their God, and they will be my people.'
translation:
  language: ml
  text: 'എന്തെന്നാൽ, “ആ നാളുകൾക്കുശേഷം ഞാൻ ഇസ്രായേൽ ഭവനത്തോടു ചെയ്യാനിരിക്കുന്ന ഉടമ്പടി ഇതാണ്,” കർത്താവ് അരുളിച്ചെയ്യുന്നു: “എന്റെ നിയമങ്ങൾ അവരുടെ മനസ്സുകളിൽ നൽകിക്കൊണ്ട്, ഞാൻ അവ അവരുടെ ഹൃദയങ്ങളിൽ എഴുതും; ഞാൻ അവരുടെ ദൈവമായിരിക്കും, അവർ എന്റെ ജനമായിരിക്കും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαθήκη
  choice: ഉടമ്പടി
  rationale: യിരെമ്യാവിലെ പുതിയ ഉടമ്പടിയുടെ പശ്ചാത്തലവും എബ്രായലേഖനത്തിലെ ഉടമ്പടിസംബന്ധമായ അർഥവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: διαθήσομαι
  choice: ഞാൻ ... ചെയ്യുന്ന
  rationale: ഉടമ്പടി ‘ചെയ്യുക’ എന്ന മലയാളപ്രയോഗം ഭാവികാലസന്ദർഭത്തിൽ സ്വാഭാവികമായി അർഥം നൽകുന്നു; ഗ്രീക്കിലെ ഭാവികാലം ‘ആ നാളുകൾക്കുശേഷം’ എന്നതിലൂടെ കൂടി വ്യക്തമാകുന്നു.
- source_word: οἴκῳ Ἰσραήλ
  choice: ഇസ്രായേൽഭവനം
  rationale: പ്രവാചകഗ്രന്ഥത്തിലെ സമൂഹപരവും ഉടമ്പടിപരവുമായ പ്രയോഗം ‘ഇസ്രായേൽ’ എന്നു മാത്രം ലളിതമാക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: μετὰ τὰς ἡμέρας ἐκείνας
  choice: ആ നാളുകൾക്കുശേഷം
  rationale: മൂലത്തിലെ കാലസൂചനയും പ്രവാചകശൈലിയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: κύριος
  choice: കർത്താവ്
  rationale: ഗ്രീക്ക് κύριος എന്ന പദത്തിന്റെ പുതിയനിയമത്തിലെ പതിവായ മലയാള തുല്യരൂപം ഉപയോഗിക്കുന്നു.
- source_word: διδοὺς
  choice: നൽകിക്കൊണ്ട്
  rationale: തുടർന്നുവരുന്ന ഭാവികാലക്രിയയോടൊപ്പം ഗ്രീക്കിലുള്ള വർത്തമാന കൃദന്തരൂപത്തിന്റെ അസമമായ ഘടന മനസ്സിലാകുന്ന വിധത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: νόμους
  choice: നിയമങ്ങൾ
  rationale: ഗ്രീക്കിലെ വ്യക്തമായ ബഹുവചനം നിലനിർത്തുന്നു; ഏകവചനമായ ‘ന്യായപ്രമാണം’ എന്നു മാറ്റുന്നില്ല.
- source_word: διάνοιαν
  choice: മനസ്സുകൾ
  rationale: ചിന്തയുടെയും ഗ്രഹണത്തിന്റെയും ആന്തരിക മണ്ഡലത്തെ സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുകയും ബഹുവചന ഉടമകളോട് യോജിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐπὶ καρδίας αὐτῶν
  choice: അവരുടെ ഹൃദയങ്ങളിൽ
  rationale: എഴുത്തിന്റെ രൂപകവും ആന്തരികതയും സ്വാഭാവിക മലയാളത്തിൽ ഒരുമിച്ചു പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐπιγράψω
  choice: ഞാൻ ... എഴുതും
  rationale: കൊത്തിവയ്ക്കുക എന്ന ശക്തമായ വ്യാഖ്യാനം ചേർക്കാതെ എഴുത്തിന്റെ മൂലരൂപകം വ്യക്തമായി നൽകുന്നു.
- source_word: ἔσομαι αὐτοῖς εἰς θεόν
  choice: ഞാൻ അവരുടെ ദൈവമായിരിക്കും
  rationale: ഉടമ്പടിയുടെ പരമ്പരാഗത ബന്ധസൂത്രം സ്വാഭാവികവും വ്യക്തവുമായി സംരക്ഷിക്കുന്നു.
- source_word: αὐτοὶ ἔσονταί μοι εἰς λαόν
  choice: അവർ എന്റെ ജനമായിരിക്കും
  rationale: ഉടമ്പടിബന്ധത്തിലെ സ്വന്തതയും പരസ്പരബന്ധവും മലയാളത്തിലെ സ്ഥാപിതമായ രൂപത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: യിരെമ്യാവിലെ ഉടമ്പടിവചനവുമായി ഉള്ള അന്തർപാഠബന്ധം
  choice: ‘ഇസ്രായേൽഭവനം’, ‘എന്റെ നിയമങ്ങൾ’, ‘അവരുടെ ഹൃദയങ്ങൾ’, ‘അവരുടെ ദൈവം’, ‘എന്റെ ജനം’ എന്നീ ഉടമ്പടിപദങ്ങൾ നിലനിർത്തി.
  alternative: പ്രവാചകവചനത്തിന്റെ ഔപചാരിക പ്രതിധ്വനി കുറയ്ക്കുന്ന സ്വതന്ത്ര സമകാലിക പരാവർത്തനം.
  rationale: ഈ ഉദ്ധരണിയുടെ ദൈവശാസ്ത്രപരമായ ശക്തി പഴയനിയമത്തിലെ ഉടമ്പടിവചനവുമായി തിരിച്ചറിയാവുന്ന തുടർച്ചയിൽ ആശ്രയിക്കുന്നതിനാൽ അതിനെ ലളിതവത്കരിച്ചില്ല.
- issue: διδοὺς എന്ന കൃദന്തരൂപവും ἐπιγράψω എന്ന ഭാവികാലക്രിയയും തമ്മിലുള്ള മിശ്രഘടന
  choice: ‘നൽകിക്കൊണ്ട് ... ഞാൻ എഴുതും’ എന്ന ഘടന പ്രധാനപാഠത്തിൽ നിലനിർത്തി.
  alternative: ‘ഞാൻ എന്റെ നിയമങ്ങൾ അവരുടെ മനസ്സുകളിൽ നൽകും; അവ അവരുടെ ഹൃദയങ്ങളിൽ എഴുതും.’
  rationale: മൂലഗ്രീക്കിലെ വ്യാകരണപരമായ അസമത്വം നിശ്ശബ്ദമായി സമമാക്കാതെ സംരക്ഷിച്ചു; കൂടുതൽ സുഗമമായ വായന അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. പ്രവാചക ഉദ്ധരണിയുടെ ഉടമ്പടിഭാഷ നിലനിർത്തിയപ്പോൾ അനാവശ്യമായ പുരാതനപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
