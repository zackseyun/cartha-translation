id: HEB.8.2
reference: Hebrews 8:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τῶν ἁγίων λειτουργὸς καὶ τῆς σκηνῆς τῆς ἀληθινῆς, ἣν ἔπηξεν ὁ κύριος, ⸀οὐκ ἄνθρωπος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/002.yaml
  text: a minister of the holy places and of the true tabernacle[a], which the Lord set up[b], not man.
translation:
  language: ml
  text: വിശുദ്ധസ്ഥലങ്ങളുടെയും[a] യഥാർഥ കൂടാരത്തിന്റെയും ശുശ്രൂഷകൻ—അതിനെ സ്ഥാപിച്ചത് കർത്താവാണ്,[b] മനുഷ്യനല്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘വിശുദ്ധമന്ദിരം’; ഗ്രീക്കുപ്രയോഗം വിശുദ്ധജനങ്ങളെയല്ല, വിശുദ്ധമന്ദിരത്തിലെ വിശുദ്ധസ്ഥലങ്ങളെയാണു സൂചിപ്പിക്കാനിടയുള്ളത്.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘കർത്താവ് ഉറപ്പിച്ചുകെട്ടിയത്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν ἁγίων
  choice: വിശുദ്ധസ്ഥലങ്ങൾ
  rationale: സന്ദർഭം സ്വർഗീയ വിശുദ്ധമന്ദിരത്തിലെ പുരോഹിതശുശ്രൂഷയെക്കുറിച്ചാണ്. നപുംസകലിംഗ ബഹുവചനമായ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്ഥലസൂചനയും ബഹുവചനവും ഈ പരിഭാഷ നിലനിർത്തുന്നു; ‘വിശുദ്ധന്മാർ’ എന്ന വ്യക്തിസൂചന ഇവിടെ സന്ദർഭോചിതമല്ല.
- source_word: λειτουργὸς
  choice: ശുശ്രൂഷകൻ
  rationale: പൊതു അല്ലെങ്കിൽ ആരാധനാപരമായ ഔദ്യോഗിക സേവനം നിർവഹിക്കുന്നവനെ സൂചിപ്പിക്കുന്ന പദമാണിത്. മലയാളത്തിൽ പുരോഹിതശുശ്രൂഷയുടെ ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: σκηνῆς
  choice: തിരുനിവാസം
  rationale: മോശെയുടെ സമാഗമകൂടാരത്തെയും അതിന്റെ സ്വർഗീയ പ്രതിരൂപത്തെയും ഉണർത്തുന്ന ആരാധനാസംബന്ധമായ പദം. ‘കൂടാരം’ എന്നതിനെക്കാൾ വിശുദ്ധനിവാസത്തിന്റെ ആശയം നൽകുകയും വാക്യത്തിന് സ്വാഭാവികമായ ഗൗരവം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἀληθινῆς
  choice: യഥാർഥ
  rationale: ഭൗമിക പകർപ്പിനോടു വ്യത്യസ്തമായ പരമമായ യാഥാർഥ്യത്തെ സൂചിപ്പിക്കുന്നു; ‘യഥാർഥ’ എന്നത് ‘സത്യമായ’ എന്നതിലുണ്ടാകാവുന്ന സത്യസന്ധതയുടെ അർഥഭ്രമം ഒഴിവാക്കുന്നു.
- source_word: ἔπηξεν
  choice: സ്ഥാപിച്ചു
  rationale: ഒരു കൂടാരം ഉറപ്പിച്ചു നിർത്തുക അല്ലെങ്കിൽ സ്ഥാപിക്കുക എന്ന അർഥമാണ്. ‘സ്ഥാപിച്ചു’ മലയാളത്തിൽ സ്വാഭാവികമാണ്; കൂടാരം കെട്ടിയെന്ന ദൃശ്യഭാവമുള്ള മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: ὁ κύριος
  choice: കർത്താവ്
  rationale: κύριος എന്ന ദൈവിക അഭിസംബോധനയ്ക്ക് മലയാള ബൈബിൾ ഭാഷയിൽ വ്യക്തവും പ്രചാരമുള്ളതുമായ തുല്യപദം.
- source_word: οὐκ ἄνθρωπος
  choice: മനുഷ്യനല്ല
  rationale: ദൈവിക പ്രവർത്തനവും മാനുഷിക പ്രവർത്തനവും തമ്മിലുള്ള സംക്ഷിപ്തമായ വൈരുധ്യം നിലനിർത്തുന്നു. ഏകവചനരൂപം ഇവിടെ മനുഷ്യനെ പൊതുവായി പ്രതിനിധീകരിക്കുന്നു.
theological_decisions:
- issue: τῶν ἁγίων എന്നതിന്റെ സൂചിതാർഥവും സ്വർഗീയ വിശുദ്ധമന്ദിരവുമായുള്ള ബന്ധവും
  choice: വിശുദ്ധന്മാരെയല്ല, ആരാധനാസംബന്ധമായ വിശുദ്ധസ്ഥലങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്
  alternative: വിശുദ്ധന്മാർ; വിശുദ്ധമന്ദിരം
  rationale: എബ്രായർ 8:1-5 സ്വർഗീയ വിശുദ്ധമന്ദിരത്തിൽ മശീഹ നിർവഹിക്കുന്ന മഹാപുരോഹിതശുശ്രൂഷയെക്കുറിച്ചാണ്. ‘വിശുദ്ധസ്ഥലങ്ങൾ’ എന്നത് ഗ്രീക്കിലെ ബഹുവചനവും വിശുദ്ധമന്ദിരസന്ദർഭവും നിലനിർത്തുന്നു.
- issue: ἀληθινή എന്ന വിശേഷണത്തിന്റെ ദൈവശാസ്ത്രപരമായ ഭാവം
  choice: ഭൗമിക മാതൃകയ്ക്കു പിന്നിലെ പരമമായ യാഥാർഥ്യം എന്ന ഭാവം തുറന്നുവെക്കുന്ന ‘യഥാർഥ’
  alternative: സത്യമായ; യഥാർഥമായി നിലവിലുള്ള
  rationale: ഭൗമിക തിരുനിവാസം അസത്യമാണെന്ന ധാരണ വരുത്താതെ, സ്വർഗീയ തിരുനിവാസം പൂർണവും മൂലവുമായ യാഥാർഥ്യമാണെന്ന എബ്രായലേഖനത്തിലെ സംഘർഷം സംരക്ഷിക്കുന്നു.
- issue: ἄνθρωπος എന്നതിന്റെ പൊതുപ്രതിനിധിയായ ഏകവചനശക്തി
  choice: മനുഷ്യനല്ല
  alternative: ഒരു മനുഷ്യനല്ല; മനുഷ്യർ അല്ല
  rationale: കർത്താവും മനുഷ്യനും തമ്മിലുള്ള ഗ്രീക്കിലെ തീക്ഷ്ണമായ വൈരുധ്യം നിലനിർത്തുകയും പദത്തെ ലിംഗപരമായി തെറ്റിദ്ധരിപ്പിക്കാതെ പൊതുവായ മനുഷ്യസൂചനയായി നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ആരാധനാസംബന്ധമായ ശൈലി. ‘തിരുനിവാസം’ ബൈബിൾസന്ദർഭത്തിലെ വിശുദ്ധകൂടാരത്തെ സൂചിപ്പിക്കുന്നു; കൂടുതൽ പദാനുപദമായ ‘കൂടാരം’ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ പ്രധാനപാഠത്തിൽ ബന്ധപ്പെട്ട ആശയങ്ങൾക്കു പിന്നാലെ നൽകിയിരിക്കുന്നു.
