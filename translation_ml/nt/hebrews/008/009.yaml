reference: Hebrews 8:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐ κατὰ τὴν διαθήκην ἣν ἐποίησα τοῖς πατράσιν αὐτῶν ἐν ἡμέρᾳ ἐπιλαβομένου μου τῆς χειρὸς αὐτῶν ἐξαγαγεῖν αὐτοὺς ἐκ γῆς Αἰγύπτου, ὅτι αὐτοὶ οὐκ ἐνέμειναν ἐν τῇ διαθήκῃ μου, κἀγὼ ἠμέλησα αὐτῶν, λέγει κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/009.yaml
  text: not like the covenant that I made with their fathers on the day when I took hold of their hand to bring them out of the land of Egypt[a], because they did not continue in my covenant, and I disregarded them[b], says the Lord.
translation:
  language: ml
  text: ഈജിപ്തുദേശത്തുനിന്ന് അവരെ പുറത്തുകൊണ്ടുവരാൻ ഞാൻ അവരുടെ കൈ പിടിച്ച[a] നാളിൽ അവരുടെ പിതാക്കന്മാരോടു ഞാൻ ചെയ്ത ഉടമ്പടിപോലെയല്ല ഇത്. കാരണം, അവർ എന്റെ ഉടമ്പടിയിൽ നിലനിന്നില്ല; ഞാനും അവരെ അവഗണിച്ചു[b] എന്ന് കർത്താവ് അരുളിച്ചെയ്യുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പ്രയോഗസഹജമായി: ‘ഞാൻ അവരെ കൈപിടിച്ച് ഈജിപ്തുദേശത്തുനിന്ന് പുറത്തുകൊണ്ടുവന്ന നാളിൽ.’'
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ എബ്രായർ ലേഖനത്തിലെ ഗ്രീക്ക് പാഠത്തെ പിന്തുടർന്ന് ‘ഞാനും അവരെ അവഗണിച്ചു’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു. എന്നാൽ യിരെമ്യാവ് 31:32-ന്റെ എബ്രായപാഠത്തിന് വ്യത്യസ്തമായ അർഥമുണ്ട്; അത് സാധാരണയായി ‘ഞാൻ അവരുടെ ഭർത്താവായിരുന്നു എങ്കിലും’ അല്ലെങ്കിൽ ‘ഞാൻ അവരുടെ യജമാനനായിരുന്നു എങ്കിലും’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: διαθήκην
  choice: ഉടമ്പടി
  rationale: എബ്രായർ ലേഖനത്തിലെ ദൈവത്തിന്റെ ഉടമ്പടിബന്ധത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്ന, മലയാളത്തിൽ സ്ഥാപിതവും സന്ദർഭോചിതവുമായ പദം.
- source_word: τοῖς πατράσιν αὐτῶν
  choice: അവരുടെ പിതാക്കന്മാരുമായി
  rationale: ഗ്രീക്കിലെ വ്യക്തമായ പുല്ലിംഗ ബഹുവചനവും ഇസ്രായേലിന്റെ പൂർവപിതാക്കന്മാരിലേക്കുള്ള സൂചനയും നിലനിർത്തുന്നു.
- source_word: ἐν ἡμέρᾳ ἐπιλαβομένου μου τῆς χειρὸς αὐτῶν
  choice: ഞാൻ അവരുടെ കൈ പിടിച്ച നാളിൽ
  rationale: കാലസൂചനയും ഏകവചനമായ ‘കൈ’ എന്ന ദൃശ്യബിംബവും നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളം.
- source_word: ἐξαγαγεῖν αὐτοὺς ἐκ γῆς Αἰγύπτου
  choice: അവരെ ഈജിപ്തുദേശത്തുനിന്ന് പുറത്തുകൊണ്ടുവരാൻ
  rationale: പുറപ്പാടിന്റെ ആശയവും γῆς എന്ന ‘ദേശം’ സൂചനയും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: οὐκ ἐνέμειναν ἐν τῇ διαθήκῃ μου
  choice: അവർ എന്റെ ഉടമ്പടിയിൽ നിലനിന്നില്ല
  rationale: ἐμμένω എന്നതിലെ തുടരുക/ഉറച്ചുനിൽക്കുക എന്ന ഉടമ്പടിവിശ്വസ്തതയുടെ അർഥം അമിതവ്യാഖ്യാനമില്ലാതെ നൽകുന്നു.
- source_word: κἀγὼ ἠμέλησα αὐτῶν
  choice: ഞാനും അവരെ അവഗണിച്ചു
  rationale: κἀγώയിലെ സാധാരണ ‘ഞാനും’ എന്ന ബന്ധവും ἀμελέωയുടെ അവഗണിക്കുക എന്ന അർഥവും നിലനിർത്തുന്നു; ‘ഉപേക്ഷിച്ചു’ എന്ന കൂടുതൽ ശക്തമായ അർഥം ചേർക്കുന്നില്ല.
- source_word: λέγει κύριος
  choice: എന്ന് കർത്താവ് അരുളിച്ചെയ്യുന്നു
  rationale: ദൈവിക ഉദ്ധരണിയുടെ ഗൗരവമുള്ളതും മലയാള ബൈബിൾ ഭാഷയിൽ സ്വാഭാവികവുമായ അവതരണം; വർത്തമാനകാല ഉദ്ധരണിസൂത്രം നിലനിർത്തുന്നു.
theological_decisions:
- issue: യിരെമ്യാവ് 31:32-ന്റെ എബ്രായപാഠത്തിൽനിന്ന് വ്യത്യസ്തമായ ἠμέλησα αὐτῶν എന്ന എബ്രായർ ലേഖനത്തിലെ ഗ്രീക്ക് വായന
  choice: ഞാനും അവരെ അവഗണിച്ചു
  alternative: ഞാൻ അവരുടെ ഭർത്താവായിരുന്നു / യജമാനനായിരുന്നു എങ്കിലും
  rationale: എബ്രായർ 8:9-ലെ ഗ്രീക്ക് പാഠം വ്യക്തമായി ‘അവരെ അവഗണിച്ചു’ എന്ന അർഥമാണ് നൽകുന്നത്. അതിനാൽ മുഖ്യപാഠം ഗ്രീക്കിനെ പിന്തുടരുന്നു; എബ്രായ യിരെമ്യാവിലെ പ്രധാന അന്തർപാഠ വ്യത്യാസം അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. ‘ഉടമ്പടി’, ‘കർത്താവ് അരുളിച്ചെയ്യുന്നു’ എന്നിവ വേദപാഠത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു; വാക്യഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കിക്കൊണ്ട് ഗ്രീക്കിലെ കൈപിടിക്കൽ, ദേശം, ഉടമ്പടിയിൽ നിലനിൽക്കാതിരിക്കുക എന്നീ പ്രധാന രൂപകങ്ങളും ബന്ധങ്ങളും സംരക്ഷിച്ചിരിക്കുന്നു.
