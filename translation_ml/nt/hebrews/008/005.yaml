id: HEB.8.5
reference: Hebrews 8:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: (οἵτινες ὑποδείγματι καὶ σκιᾷ λατρεύουσιν τῶν ἐπουρανίων, καθὼς κεχρημάτισται Μωϋσῆς μέλλων ἐπιτελεῖν τὴν σκηνήν, Ὅρα γάρ, φησίν, ποιήσεις πάντα κατὰ τὸν τύπον τὸν δειχθέντα σοι ἐν τῷ ὄρει)·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/005.yaml
  text: who serve a copy and shadow of the heavenly things[a], just as Moses was divinely instructed when he was about to erect the tabernacle; for he says[b], “See that you make everything according to the pattern shown to you on the mountain.”
translation:
  language: ml
  text: 'തിരുനിവാസം പണിതീർക്കാനിരുന്നപ്പോൾ മോശെക്കു ദൈവിക നിർദേശം ലഭിച്ചതുപോലെ[a], അവർ സ്വർഗീയമായവയുടെ പകർപ്പും നിഴലുമായ ഒന്നിൽ ശുശ്രൂഷ ചെയ്യുന്നു[b]. കാരണം, ദൈവം പറയുന്നു: “പർവതത്തിൽ നിനക്കു കാണിച്ചുതന്ന മാതൃകപ്രകാരം സകലവും ഉണ്ടാക്കാൻ ശ്രദ്ധിക്കുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദൈവിക നിർദേശം ലഭിച്ചു’ എന്നതിന് ‘ദൈവിക മുന്നറിയിപ്പ് ലഭിച്ചു’ എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്ക് ക്രിയയ്ക്ക് ദൈവത്തിൽനിന്നുള്ള മുന്നറിയിപ്പിന്റെയോ ശക്തമായ ഉപദേശത്തിന്റെയോ അർഥം ഊന്നാനാകും.
    reason: lexical_alternative
  - marker: b
    text: ‘പണിതീർക്കുക’ എന്നതിന് ‘പണിയുക’ എന്നും പരിഭാഷപ്പെടുത്താം; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് ക്രിയയ്ക്ക് ഒരു പ്രവൃത്തി പൂർത്തിയാക്കുക എന്നോ നിർവഹിക്കുക എന്നോ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: അവർ
  rationale: മുൻവാക്യത്തിൽ പരാമർശിച്ച പുരോഹിതരിലേക്കുള്ള ബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ തുടരുന്നു; ഗ്രീക്കിലെ ഗുണസൂചന അനാവശ്യമായി വിപുലീകരിക്കുന്നില്ല.
- source_word: ὑποδείγματι καὶ σκιᾷ
  choice: പകർപ്പിനും നിഴലിനും
  rationale: ഭൗമിക വിശുദ്ധസ്ഥലം സ്വർഗീയമായതിനോട് യഥാർഥമായി ബന്ധപ്പെട്ടതും അതിനേക്കാൾ അപൂർണവുമായിരിക്കുന്നുവെന്ന വാക്യത്തിന്റെ ഇരട്ടരൂപകം നിലനിർത്തുന്നു.
- source_word: λατρεύουσιν
  choice: ശുശ്രൂഷിക്കുന്നത്
  rationale: ആരാധനാപരവും പുരോഹിതപരവുമായ സേവനത്തെ സൂചിപ്പിക്കുന്ന, ഈ സന്ദർഭത്തിൽ വ്യക്തമായ മലയാളപദം.
- source_word: τῶν ἐπουρανίων
  choice: സ്വർഗീയമായവയുടെ
  rationale: സ്ഥലത്തെ മാത്രം സൂചിപ്പിക്കാതെയും ‘യാഥാർഥ്യങ്ങൾ’ എന്ന് വ്യാഖ്യാനം ചുരുക്കാതെയും ഗ്രീക്കിന്റെ വിശാലമായ അർഥം നിലനിർത്തുന്നു.
- source_word: κεχρημάτισται
  choice: ദൈവിക നിർദേശം ലഭിച്ചത്
  rationale: ദൈവത്തിൽനിന്നുള്ള വെളിപ്പെടുത്തലും നിർദേശവും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു; ശാസനയുടെയോ മുന്നറിയിപ്പിന്റെയോ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: μέλλων ἐπιτελεῖν τὴν σκηνήν
  choice: തിരുനിവാസം പണിതീർക്കാനിരിക്കെ
  rationale: μέλλων എന്ന സമീപഭാവവും ἐπιτελεῖν എന്ന പൂർത്തീകരണഭാവവും നിർമാണസന്ദർഭത്തിൽ സ്വാഭാവികമായി ചേർക്കുന്നു.
- source_word: Ὅρα ... ποιήσεις πάντα
  choice: സകലവും ഉണ്ടാക്കാൻ ശ്രദ്ധിക്കുക
  rationale: ഭാവികാലരൂപം കല്പനയായി പ്രവർത്തിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ കല്പനാശക്തി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: τύπον
  choice: മാതൃക
  rationale: മോശയ്ക്ക് കാണിച്ചുകൊടുത്ത രൂപരേഖയെയോ മാതൃകയെയോ സൂചിപ്പിക്കുന്ന സാധാരണവും സന്ദർഭോചിതവുമായ പദം.
theological_decisions:
- issue: ഭൗമിക ശുശ്രൂഷയും സ്വർഗീയമായവയും തമ്മിലുള്ള ബന്ധം
  choice: ‘സ്വർഗീയമായവയുടെ പകർപ്പിനും നിഴലിനും’ എന്ന് പരിഭാഷപ്പെടുത്തി
  alternative: ‘സ്വർഗീയ യാഥാർഥ്യങ്ങളുടെ പ്രതിരൂപത്തിനും നിഴലിനും’
  rationale: ഭൗമിക ക്രമീകരണം വെറും അസത്യചിഹ്നമല്ലെന്നും അതേസമയം സ്വർഗീയമായതിനോട് തുല്യമല്ലെന്നും ഉള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷം ‘പകർപ്പ്’, ‘നിഴൽ’ എന്നീ രണ്ടു രൂപകങ്ങളിലൂടെയും നിലനിർത്തുന്നു.
- issue: κεχρημάτισται എന്ന ക്രിയയുടെ സ്വരം
  choice: ‘ദൈവിക നിർദേശം ലഭിച്ചു’
  alternative: ‘ദൈവിക മുന്നറിയിപ്പ് ലഭിച്ചു’
  rationale: ദൈവിക ആശയവിനിമയവും നിർദേശവും പ്രധാനമായി നിലനിർത്തുന്നു; ഉദ്ധരണിയിലെ ജാഗ്രതാസ്വരം കണക്കിലെടുത്ത് ‘മുന്നറിയിപ്പ്’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- issue: ഉദ്ധരണി പറയുന്നവന്റെ തിരിച്ചറിയൽ
  choice: ‘ഇങ്ങനെ അരുളിച്ചെയ്തിരിക്കുന്നു’ എന്ന കർത്താവില്ലാത്ത രൂപം
  alternative: ‘അവൻ പറയുന്നു’ അല്ലെങ്കിൽ ‘ദൈവം പറയുന്നു’
  rationale: ദൈവിക വചനമെന്ന സന്ദർഭം വ്യക്തമാക്കുമ്പോഴും ഗ്രീക്കിൽ പ്രത്യക്ഷമല്ലാത്ത നാമകർത്താവിനെ മുഖ്യപാഠത്തിൽ ചേർക്കാതിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘തിരുനിവാസം’, ‘ശുശ്രൂഷ’, ‘അരുളിച്ചെയ്തിരിക്കുന്നു’ എന്നിവ ബൈബിൾസന്ദർഭത്തിന് യോജിച്ച മാന്യത നിലനിർത്തുന്നു; വാക്യഘടന വായനാസൗകര്യത്തിനായി രണ്ടായി വിഭജിച്ചിരിക്കുന്നു.
