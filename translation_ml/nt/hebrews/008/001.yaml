id: HEB.8.1
reference: Hebrews 8:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Κεφάλαιον δὲ ἐπὶ τοῖς λεγομένοις, τοιοῦτον ἔχομεν ἀρχιερέα, ὃς ἐκάθισεν ἐν δεξιᾷ τοῦ θρόνου τῆς μεγαλωσύνης ἐν τοῖς οὐρανοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/001.yaml
  text: 'The main point in what is being said is this: we have such a high priest[a], who sat down at the right hand of the throne of the Majesty in the heavens[b],'
translation:
  language: ml
  text: 'പറഞ്ഞുവരുന്ന കാര്യങ്ങളുടെ മുഖ്യകാര്യം[a] ഇതാണ്: സ്വർഗങ്ങളിൽ[b] മഹത്വത്തിന്റെ സിംഹാസനത്തിന്റെ വലത്തുഭാഗത്ത് ഇരുന്ന ഇങ്ങനെയൊരു മഹാപുരോഹിതൻ നമുക്കുണ്ട്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മുഖ്യകാര്യം’ എന്നതിന് ‘സംഗ്രഹം’ അഥവാ ‘പ്രധാന ആശയം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘സ്വർഗങ്ങളിൽ’ എന്നതിന് ‘സ്വർഗത്തിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്കിൽ ബഹുവചനം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κεφάλαιον
  choice: മുഖ്യസാരം
  rationale: ഇവിടെ വാദത്തിന്റെ പ്രധാന ആശയമോ സംഗ്രഹമോ സൂചിപ്പിക്കുന്നു; അക്ഷരാർഥത്തിലുള്ള ‘അധ്യായം’ അല്ല. ‘മുഖ്യസാരം’ സ്വാഭാവികവും സന്ദർഭോചിതവും ആണ്.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇവിടെ ശക്തമായ വൈരുധ്യമല്ല, നേരിയ ആശയമാറ്റമാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിലെ വാക്യഘടന തന്നെ ആ മാറ്റം സ്വാഭാവികമായി അറിയിക്കുന്നതിനാൽ ‘ഇപ്പോൾ’ പോലുള്ള കാലസൂചകപദം ചേർത്തിട്ടില്ല.
- source_word: ἐπὶ τοῖς λεγομένοις
  choice: പറഞ്ഞുവരുന്ന കാര്യങ്ങളുടെ
  rationale: നിലവിൽ അവതരിപ്പിക്കപ്പെടുന്ന വാദവിഷയങ്ങളെ സൂചിപ്പിക്കുന്ന പ്രയോഗം; വർത്തമാനകാലത്തിന്റെ തുടർച്ചാഭാവം ‘പറഞ്ഞുവരുന്ന’ നിലനിർത്തുന്നു.
- source_word: τοιοῦτον ἔχομεν ἀρχιερέα
  choice: ഇങ്ങനെയൊരു മഹാപുരോഹിതൻ നമുക്കുണ്ട്
  rationale: മുൻവിവരണത്തിലേക്ക് തിരിഞ്ഞുനോക്കുന്ന τοιοῦτον എന്നതും ἔχομεν എന്ന ലളിതമായ ഉടമസ്ഥതാഭാവവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἐκάθισεν
  choice: ഇരുന്ന
  rationale: സിംഹാസനത്തിന്റെ വലത്തുഭാഗത്ത് ഇരിപ്പിടം സ്വീകരിച്ച പൂർത്തിയായ പ്രവൃത്തി അറിയിക്കുന്നു; അതിന്റെ ദൈവശാസ്ത്രപരമായ ഫലം പരിഭാഷയിൽ വിശദീകരിച്ച് ചേർത്തിട്ടില്ല.
- source_word: ἐν δεξιᾷ τοῦ θρόνου
  choice: സിംഹാസനത്തിന്റെ വലത്തുഭാഗത്ത്
  rationale: ബഹുമാനത്തിന്റെയും അധികാരത്തിന്റെയും സ്ഥാനം സൂചിപ്പിക്കുന്ന മൂലഭാഷയിലെ രൂപകം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: τῆς μεγαλωσύνης
  choice: മഹത്വത്തിന്റെ
  rationale: ദൈവത്തെ നേരിട്ട് നാമകരണം ചെയ്യാതെ ആദരപൂർവം പരാമർശിക്കുന്ന മൂലപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: സ്വർഗങ്ങളിൽ
  rationale: ഗ്രീക്കിലെ ബഹുവചനരൂപം മലയാളത്തിലും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ‘മഹത്വം’ ആരെ സൂചിപ്പിക്കുന്നു എന്ന് തുറന്നുപറയണമോ
  choice: ‘മഹത്വത്തിന്റെ’ എന്ന ആദരസൂചക പരോക്ഷപ്രയോഗം നിലനിർത്തി.
  alternative: ‘ദൈവത്തിന്റെ സിംഹാസനം’
  rationale: മൂലപാഠം θεός എന്നു നേരിട്ട് പറയുന്നില്ല. അതിനാൽ സൂചനയെ വ്യാഖ്യാനിച്ച് കൂടുതൽ വ്യക്തമാക്കാതെ അതിന്റെ ഉയർന്ന ശൈലിയും പരോക്ഷതയും സംരക്ഷിച്ചു.
- issue: ἐκάθισεν എന്നതിൽ പൂർത്തിയായ പുരോഹിതപ്രവൃത്തിയുടെ ആശയം വിശദീകരിക്കണമോ
  choice: ‘ഇരുന്ന’ എന്നു മാത്രം പരിഭാഷപ്പെടുത്തി.
  alternative: ‘തന്റെ പ്രവൃത്തി പൂർത്തിയാക്കി വിജയത്തോടെ ഉപവിഷ്ടനായി’
  rationale: വിശാലസന്ദർഭത്തിൽ അത്തരം ദൈവശാസ്ത്രപരമായ സൂചനയുണ്ടെങ്കിലും ഈ പദത്തിൽ ഇല്ലാത്ത വിശദീകരണം വാക്യത്തിലേക്ക് ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന, എന്നാൽ എബ്രായലേഖനത്തിന്റെ ഗൗരവം നിലനിർത്തുന്ന ശൈലി. പദാനുപദകഠിനത ഒഴിവാക്കി മൂലവാക്യത്തിന്റെ ആശയക്രമവും ദൈവശാസ്ത്രപരമായ പരോക്ഷതയും സംരക്ഷിച്ചു. അടിക്കുറിപ്പുകളുടെ സൂചകങ്ങൾ അനുബന്ധിക്കുന്ന ആശയങ്ങൾക്ക് പിന്നാലെ വാക്യത്തിൽ ചേർത്തിരിക്കുന്നു.
