reference: Hebrews 8:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εἰ γὰρ ἡ πρώτη ἐκείνη ἦν ἄμεμπτος, οὐκ ἂν δευτέρας ἐζητεῖτο τόπος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/007.yaml
  text: For if that first covenant had been faultless[b][a], no place would have been sought for a second.
translation:
  language: ml
  text: എന്തെന്നാൽ, ആ ആദ്യ ഉടമ്പടി കുറ്റമറ്റതായിരുന്നുവെങ്കിൽ, രണ്ടാമത്തേതിന് ഇടം അന്വേഷിക്കപ്പെടുമായിരുന്നില്ല.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘ആ ആദ്യത്തേത്’; സന്ദർഭത്തിൽനിന്ന് ‘ഉടമ്പടി’ ചേർത്തിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘രണ്ടാമത്തേതിന് അവസരമോ സാഹചര്യമോ അന്വേഷിക്കപ്പെടുമായിരുന്നില്ല.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ γὰρ
  choice: ആ ... ആയിരുന്നെങ്കിൽ
  rationale: γάρ മുൻവാദത്തിന്റെ വിശദീകരണബന്ധം സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ സ്വാഭാവിക വാക്യപ്രവാഹത്തിൽ പ്രത്യേകമായി ‘എന്തെന്നാൽ’ ചേർക്കാതെ നിബന്ധനാവാക്യം അവതരിപ്പിക്കുന്നത് ബന്ധം നിലനിർത്തുകയും അസ്വാഭാവികത ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: ἡ πρώτη ἐκείνη
  choice: ആ ആദ്യ ഉടമ്പടി
  rationale: ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘ആ ആദ്യത്തേത്’ എന്നാണെങ്കിലും, സ്ത്രീലിംഗപ്രയോഗത്തിന്റെ സന്ദർഭസൂചകം ഉടമ്പടിയാണ്. അതിനാൽ വ്യക്തതയ്ക്കായി ‘ഉടമ്പടി’ ചേർത്തിരിക്കുന്നു.
- source_word: ἦν ἄμεμπτος
  choice: കുറ്റമറ്റതായിരുന്നെങ്കിൽ
  rationale: ἄμεμπτος കുറ്റം ചുമത്താൻ അടിസ്ഥാനമില്ലാത്തത്, ന്യൂനതയില്ലാത്തത് എന്ന അർഥം നൽകുന്നു. കുറ്റത്തിന്റെ സ്വഭാവം വിശദീകരിക്കാതെ മൂലത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു.
- source_word: οὐκ ἂν
  choice: അന്വേഷിക്കപ്പെടുമായിരുന്നില്ല
  rationale: അസത്യാവസ്ഥാപരമായ നിബന്ധനയുടെ ഫലവാക്യത്തിലുള്ള നിഷേധാത്മക സാദ്ധ്യതാഭാവം മലയാളത്തിലെ ‘-മായിരുന്നില്ല’ രൂപം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: δευτέρας
  choice: രണ്ടാമത്തേതിന്
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തത നിലനിർത്തുന്നു; ‘ഉടമ്പടി’ എന്ന സൂചകം മുൻഭാഗത്ത് വ്യക്തമാക്കിയതിനാൽ ഇവിടെ ആവർത്തിക്കേണ്ടതില്ല.
- source_word: ἐζητεῖτο τόπος
  choice: ഇടം അന്വേഷിക്കപ്പെടുമായിരുന്നില്ല
  rationale: മൂലത്തിലെ നിഷ്ക്രിയരൂപവും τόπος എന്നതിന്റെ ‘ഇടം’ എന്ന അടിസ്ഥാനരൂപകവും നിലനിർത്തുന്നു; പ്രസക്തിയിൽ ഇത് അവസരം അഥവാ സാഹചര്യം എന്ന അർഥവും വഹിക്കാം.
theological_decisions:
- issue: ഗ്രീക്കിൽ ആവർത്തിക്കാത്ത ‘ഉടമ്പടി’ വ്യക്തമാക്കണമോ
  choice: ‘ആ ആദ്യ ഉടമ്പടി’ എന്ന് വ്യക്തമാക്കി
  alternative: ‘ആ ആദ്യത്തേത്’
  rationale: സമീപസന്ദർഭം ആദ്യത്തെയും രണ്ടാമത്തെയും ഉടമ്പടികളെ താരതമ്യം ചെയ്യുന്നു. മനസ്സിലാക്കാൻ ആവശ്യമായ സൂചകം മാത്രം വ്യക്തമാക്കുന്നതാണ്; പുതിയ ദൈവശാസ്ത്രവാദം ചേർക്കുന്നില്ല.
- issue: ആദ്യ ഉടമ്പടിയിലെ കുറ്റം അഥവാ ന്യൂനത എന്താണെന്ന സൂചന
  choice: ‘കുറ്റമറ്റത്’ എന്നു മാത്രം പരിഭാഷപ്പെടുത്തി; കുറ്റത്തിന്റെ സ്ഥാനം വിശദീകരിച്ചില്ല
  alternative: ‘ന്യൂനതയില്ലാത്തത്’ അല്ലെങ്കിൽ ജനങ്ങളിലായിരുന്നു കുറ്റമെന്ന് വിശദീകരിക്കൽ
  rationale: ഈ വാക്യം നിബന്ധനാത്മക വാദം മാത്രമാണ് അവതരിപ്പിക്കുന്നത്; കുറ്റം ഉടമ്പടിയിലോ അതിന്റെ നടത്തിപ്പിലോ ജനങ്ങളിലോ എന്ന് ഇവിടെ തീർപ്പാക്കുന്നില്ല. അടുത്ത വാക്യത്തിന്റെ വിശദീകരണം മുൻകൂട്ടി ഇറക്കുമതി ചെയ്യാതിരിക്കുന്നു.
- issue: τόπος എന്നതിന്റെ രൂപകമോ ആശയാർഥമോ
  choice: ‘ഇടം’ എന്ന രൂപകം മുഖ്യപാഠത്തിൽ നിലനിർത്തി
  alternative: ‘അവസരം’ അല്ലെങ്കിൽ ‘സാഹചര്യം’
  rationale: മൂലത്തിന്റെ രൂപഭാവം സംരക്ഷിക്കുമ്പോഴും മലയാളത്തിൽ അർഥഗ്രാഹ്യമാണ്; സാധ്യമായ ആശയാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ മലയാളം. ‘ഉടമ്പടി’ എന്ന സ്ഥാപിത ബൈബിൾപദം നിലനിർത്തിയിരിക്കുന്നു. ഗ്രീക്കിലെ നിഷ്ക്രിയപ്രയോഗവും ‘ഇടം’ എന്ന രൂപകവും സൂക്ഷിച്ചെങ്കിലും അവയുടെ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
