id: HEB.2.14
reference: Hebrews 2:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐπεὶ οὖν τὰ παιδία κεκοινώνηκεν ⸂αἵματος καὶ σαρκός⸃, καὶ αὐτὸς παραπλησίως μετέσχεν τῶν αὐτῶν, ἵνα διὰ τοῦ θανάτου καταργήσῃ τὸν τὸ κράτος ἔχοντα τοῦ θανάτου, τοῦτ’ ἔστι τὸν διάβολον,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/014.yaml
  text: Therefore[a], since the children share in flesh and blood, he himself likewise partook of the same things, so that through death he might nullify the one who has the power of death—that is, the devil[b],
translation:
  language: ml
  text: അതുകൊണ്ട്, മക്കൾ രക്തത്തിലും മാംസത്തിലും പങ്കുചേർന്നിരിക്കുന്നതിനാൽ, മരണത്തിലൂടെ മരണത്തിന്റെ അധികാരം കൈവശമുള്ളവനെ—അതായത് പിശാചിനെ—നിർവീര്യനാക്കേണ്ടതിന് അവനും അതേ കാര്യങ്ങളിൽ അവരെപ്പോലെതന്നെ പങ്കെടുത്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നശിപ്പിക്കേണ്ടതിന്.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘ശക്തിയില്ലാതാക്കുക,’ ‘ഫലശൂന്യമാക്കുക,’ ‘നീക്കിക്കളയുക’ എന്നീ അർഥങ്ങൾ വരാം; അസ്തിത്വം പൂർണമായി ഇല്ലാതാക്കുക എന്നത് നിർബന്ധമായും അർഥമല്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐπεὶ οὖν
  choice: അതുകൊണ്ട്, ... ആയിരിക്കുന്നതിനാൽ
  rationale: οὖν എന്നതിന്റെ നിഗമനസ്വഭാവവും ἐπεί എന്നതിന്റെ കാരണസ്വഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τὰ παιδία
  choice: മക്കൾ
  rationale: സമീപസന്ദർഭത്തിൽ പുത്രനു നൽകപ്പെട്ട മക്കളെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും അമിതവ്യാഖ്യാനമില്ലാത്തതുമായ പ്രയോഗം.
- source_word: κεκοινώνηκεν
  choice: പങ്കാളികളായിരിക്കുന്നതിനാൽ
  rationale: പങ്കാളിത്തത്തിൽനിന്ന് ഉളവായ നിലവിലെ അവസ്ഥയെ ഗ്രീക്ക് perfect സൂചിപ്പിക്കുന്നു.
- source_word: αἵματος καὶ σαρκός
  choice: രക്തത്തിലും മാംസത്തിലും
  rationale: ഗ്രീക്കിലെ ‘രക്തവും മാംസവും’ എന്ന ക്രമം സംരക്ഷിക്കുന്നു; σάρξ ഇവിടെ ശരീരമാംസമാണ്, ‘പാപസ്വഭാവം’ അല്ല.
- source_word: παραπλησίως
  choice: അവരെപ്പോലെതന്നെ
  rationale: യഥാർഥമായ സാമ്യം വ്യക്തമാക്കുന്നു; എന്നാൽ പൂർണമായ അഭേദ്യത നിർബന്ധിച്ച് ചുമത്തുന്നില്ല.
- source_word: μετέσχεν τῶν αὐτῶν
  choice: അതേ കാര്യങ്ങളിൽ ... പങ്കുചേർന്നു
  rationale: മക്കളുടെ പങ്കാളിത്തത്തോടുള്ള സമാന്തര്യം നിലനിർത്തിക്കൊണ്ട് വ്യത്യസ്ത ഗ്രീക്ക് ക്രിയയുടെ ഭേദവും സാധ്യമായത്ര സൂക്ഷിക്കുന്നു.
- source_word: διὰ τοῦ θανάτου
  choice: തന്റെ മരണത്തിലൂടെ
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന മാർഗം വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ കർത്താവിന്റെ മരണമാണെന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: καταργήσῃ
  choice: നിർവീര്യനാക്കുക
  rationale: അസ്തിത്വം ഇല്ലാതാക്കുക എന്നതല്ല, പ്രവർത്തനശക്തി നഷ്ടപ്പെടുത്തുക എന്ന പ്രധാന ആശയം നൽകുന്നു.
- source_word: τὸ κράτος ἔχοντα τοῦ θανάτου
  choice: മരണത്തിന്മേൽ അധികാരമുള്ളവൻ
  rationale: κράτος എന്നതിലെ ശക്തി/ആധിപത്യം എന്ന അർഥം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: τὸν διάβολον
  choice: പിശാച്
  rationale: പുതിയനിയമത്തിലെ സ്ഥാപിതമായ വ്യക്തിനാമസദൃശ വിശേഷണത്തിന് മലയാളത്തിലെ പതിവായ തുല്യപദം.
theological_decisions:
- issue: ക്രിസ്തു മനുഷ്യരുടെ രക്തമാംസങ്ങളിൽ പങ്കുചേർന്നത്
  choice: ‘അവനും അതേ കാര്യങ്ങളിൽ അവരെപ്പോലെതന്നെ പങ്കുചേർന്നു’ എന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘അവനും അവരെപ്പോലെ മനുഷ്യസ്വഭാവം സ്വീകരിച്ചു’
  rationale: മനുഷ്യത്വത്തിലെ യഥാർഥ പങ്കാളിത്തം ഉറപ്പാക്കുമ്പോഴും, മൂലപാഠത്തിലെ παραπλησίως എന്ന സാമ്യസൂചനയും രണ്ട് വ്യത്യസ്ത പങ്കാളിത്തക്രിയകളും നിലനിർത്തുന്നു; പിൽക്കാല സിദ്ധാന്തഭാഷ പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: καταργήσῃ പിശാചിനോടു ബന്ധപ്പെട്ട് നൽകുന്ന അർഥം
  choice: ‘നിർവീര്യനാക്കുക’
  alternative: ‘നശിപ്പിക്കുക’
  rationale: പിശാചിന്റെ അസ്തിത്വനാശം നിർബന്ധമായി സൂചിപ്പിക്കാതെ, അവന്റെ പ്രവർത്തനാധികാരം ഫലശൂന്യമാക്കുക എന്ന അർഥപരിധി സംരക്ഷിക്കുന്നു; പരമ്പരാഗതമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ ‘രക്തവും മാംസവും’ എന്ന അസാധാരണ ക്രമം സുതാര്യതയ്ക്കായി നിലനിർത്തി. ദീർഘവാക്യം മലയാളത്തിലെ വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി; ഉദ്ദേശ്യബന്ധം വ്യക്തമായി സൂക്ഷിച്ചു.
