reference: Hebrews 2:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅθεν ὤφειλεν κατὰ πάντα τοῖς ἀδελφοῖς ὁμοιωθῆναι, ἵνα ἐλεήμων γένηται καὶ πιστὸς ἀρχιερεὺς τὰ πρὸς τὸν θεόν, εἰς τὸ ἱλάσκεσθαι τὰς ἁμαρτίας τοῦ λαοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/017.yaml
  text: Therefore he had to become like his brothers in every respect[a], so that he might become a merciful and faithful high priest in the things pertaining to God[b], to make atonement for the sins of the people.
translation:
  language: ml
  text: അതുകൊണ്ട്, എല്ലാ വിധത്തിലും തന്റെ സഹോദരന്മാരോടു സദൃശനാകേണ്ടത് അവന് ആവശ്യമായിരുന്നു[a]; അങ്ങനെ അവൻ ദൈവസംബന്ധമായ കാര്യങ്ങളിൽ കരുണയുള്ളവനും വിശ്വസ്തനുമായ മഹാപുരോഹിതനായിത്തീരാനും ജനത്തിന്റെ പാപങ്ങൾക്കു പ്രായശ്ചിത്തം ചെയ്യാനും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തന്റെ സഹോദരീസഹോദരന്മാരോടു സദൃശനാകേണ്ടത്.’ ഗ്രീക്കിൽ ‘സഹോദരന്മാർ’ എന്ന പുല്ലിംഗ ബഹുവചന കുടുംബപദമാണ്; സന്ദർഭത്തിൽ അത് വിശ്വാസികളുടെ വിപുലമായ കുടുംബത്തെ ഉൾക്കൊള്ളാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ὤφειλεν
  choice: ആകേണ്ടത് അവന് ആവശ്യമായിരുന്നു
  rationale: ബാഹ്യമായ നിർബന്ധം അനാവശ്യമായി സൂചിപ്പിക്കാതെ രക്ഷാപദ്ധതിയോടു ബന്ധപ്പെട്ട യഥാർഥ ആവശ്യകത നിലനിർത്തുന്നു.
- source_word: κατὰ πάντα
  choice: എല്ലാ കാര്യങ്ങളിലും
  rationale: സാദൃശ്യത്തിന്റെ സമഗ്രവ്യാപ്തി വ്യക്തമാക്കുന്ന സ്വാഭാവിക പ്രയോഗം.
- source_word: τοῖς ἀδελφοῖς
  choice: തന്റെ സഹോദരന്മാരെ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചന കുടുംബപദത്തിന്റെ രൂപം നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ ഉൾക്കൊള്ളുന്ന അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὁμοιωθῆναι
  choice: പോലെ ആകേണ്ടത്
  rationale: സാദൃശ്യം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; അവതാരസന്ദർഭത്തിൽ അനാവശ്യമായ യാന്ത്രിക നിർജ്ജീവത ഒഴിവാക്കുന്നു.
- source_word: ἵνα
  choice: അങ്ങനെ
  rationale: തുടർന്നുവരുന്ന ലക്ഷ്യഫലം മലയാളത്തിൽ വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: ἐλεήμων
  choice: കരുണയുള്ളവൻ
  rationale: പുരോഹിതസന്ദർഭത്തിലെ കരുണയുടെ ആശയം ലളിതവും ഗൗരവമുള്ളതുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: πιστὸς
  choice: വിശ്വസ്തൻ
  rationale: ദൈവസന്നിധിയിലെ പുരോഹിതശുശ്രൂഷയിലെ വിശ്വാസ്യതയും സ്ഥിരതയും സൂചിപ്പിക്കുന്നു.
- source_word: ἀρχιερεὺς
  choice: മഹാപുരോഹിതൻ
  rationale: പദവിയുടെ അംഗീകൃതവും നേരിട്ടുള്ളതുമായ മലയാള പരിഭാഷ.
- source_word: τὰ πρὸς τὸν θεόν
  choice: ദൈവവുമായി ബന്ധപ്പെട്ട കാര്യങ്ങളിൽ
  rationale: പുരോഹിതശുശ്രൂഷയുടെ ദൈവാഭിമുഖ മേഖലയെ അമിത വ്യാഖ്യാനമില്ലാതെ സൂക്ഷിക്കുന്നു.
- source_word: εἰς τὸ ἱλάσκεσθαι
  choice: പ്രായശ്ചിത്തം ചെയ്യാൻ
  rationale: പാപങ്ങളെ പുരോഹിതപരമായി പരിഹരിക്കുന്ന പ്രവർത്തനത്തെ വായനാസൗകര്യത്തോടെ അവതരിപ്പിക്കുന്നു; സാങ്കേതികമായി വ്യത്യസ്തമായ സൂക്ഷ്മാർത്ഥങ്ങൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: τὰς ἁμαρτίας
  choice: പാപങ്ങൾക്കു
  rationale: ജനത്തിന്റെ പാപങ്ങളെയാണ് പുരോഹിതപ്രവർത്തനം ലക്ഷ്യമിടുന്നതെന്ന് മലയാളത്തിലെ സ്വാഭാവിക കാർകരൂപത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ἱλάσκεσθαι എന്ന പദത്തിന്റെ പ്രായശ്ചിത്തസംബന്ധമായ വിവർത്തനം
  choice: പ്രായശ്ചിത്തം ചെയ്യാൻ
  alternative: പാപങ്ങൾ നീക്കാൻ; ദൈവകോപം ശമിപ്പിക്കാൻ
  rationale: മുഖ്യവാചകത്തിൽ വിശാലമായ പുരോഹിതാർഥം നിലനിർത്തുകയും പാപനീക്കവും ദൈവകോപശമനവും തമ്മിലുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷം ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: ἀδελφοῖς എന്ന പുല്ലിംഗ കുടുംബപദത്തിന്റെ വ്യാപ്തി
  choice: തന്റെ സഹോദരന്മാർ
  alternative: തന്റെ സഹോദരീസഹോദരന്മാർ
  rationale: മൂലത്തിലെ പുല്ലിംഗ ബഹുവചനരൂപം മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ വിശ്വാസകുടുംബത്തിലെ സ്ത്രീകളെയും ഉൾക്കൊള്ളാവുന്ന പ്രതിനിധിപരമായ ഉപയോഗം അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
- issue: ὁμοιωθῆναι എന്ന നിർജ്ജീവ infinitive-ന്റെ അവതരണം
  choice: പോലെ ആകേണ്ടത്
  alternative: പോലെയാക്കപ്പെടേണ്ടത്
  rationale: ഗ്രീക്ക് രൂപത്തിന്റെ നിർജ്ജീവത മലയാളത്തിൽ അക്ഷരാർഥമായി പകർത്തുമ്പോൾ ഉണ്ടാകുന്ന കൃത്രിമത്വം ഒഴിവാക്കി, പൂർണമായ സാദൃശ്യം എന്ന ആശയം സംരക്ഷിക്കുന്നു; പ്രവർത്തനകർത്താവിനെ വാചകം വ്യക്തമാക്കാത്ത അവസ്ഥയും അതേപടി വിടുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മഹാപുരോഹിതൻ’, ‘പ്രായശ്ചിത്തം’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് സുഗമമാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
