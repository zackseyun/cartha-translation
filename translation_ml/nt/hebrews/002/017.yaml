  terminology: ‘മഹാപുരോഹിതൻ’യും ‘പ്രായശ്ചിത്തം ചെയ്യുക’യും നിലനിർത്തുന്നു. ἱλάσκεσθαι-യുടെ തർക്കവിഷയമായ സൂക്ഷ്മതകൾ ‘പാപങ്ങൾ നീക്കുക’/‘ദൈവകോപം ശമിപ്പിക്കുക’ എന്ന ബദലുകളായി അടിക്കുറിപ്പിൽ അവതരിപ്പിക്കുന്നു; മുഖ്യവാചകം ഒരു പ്രത്യേക ദൈവശാസ്ത്ര വിശദീകരണം അടിച്ചേൽപ്പിക്കുന്നില്ല.
