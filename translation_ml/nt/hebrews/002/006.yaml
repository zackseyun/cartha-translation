reference: Hebrews 2:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διεμαρτύρατο δέ πού τις λέγων· Τί ἐστιν ἄνθρωπος ὅτι μιμνῄσκῃ αὐτοῦ, ἢ υἱὸς ἀνθρώπου ὅτι ἐπισκέπτῃ αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/006.yaml
  text: But someone has testified somewhere[a], saying, “What is man, that you remember him, or the son of man[c][b], that you care for him?”
translation:
  language: ml
  text: 'എന്നാൽ, ഒരിടത്ത് ഒരാൾ ഇങ്ങനെ സാക്ഷ്യപ്പെടുത്തിയിരിക്കുന്നു: “മനുഷ്യൻ എന്തുള്ളൂ, നീ അവനെ ഓർക്കാൻ[a]? മനുഷ്യപുത്രൻ എന്തുള്ളൂ, നീ അവനെ കരുതാൻ[c][b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, കൂടുതൽ പരമ്പരാഗതമായി, “അവനെ മനസ്സിൽ സൂക്ഷിക്കാൻ.”
    reason: lexical_alternative
  - marker: b
    text: “മനുഷ്യപുത്രൻ” ഇവിടെ സങ്കീർത്തനം 8:4-നെ പ്രതിധ്വനിപ്പിക്കുന്നു; അവിടെ അത് മനുഷ്യരാശിയെ സൂചിപ്പിക്കുന്ന കാവ്യപ്രയോഗമാണ്. എബ്രായരുടെ വിശാലമായ സന്ദർഭം ഈ ഭാഗത്തിന് യേശുവിനെ സംബന്ധിച്ച പ്രാധാന്യവും നൽകുന്നു.
    reason: cross_reference
  - marker: c
    text: അല്ലെങ്കിൽ, “അവനെ സന്ദർശിക്കാൻ” അല്ലെങ്കിൽ “അവനെ പരിപാലിക്കാൻ.” ഗ്രീക്ക് ക്രിയ സന്ദർശനത്തിലൂടെയോ പരിചരണത്തിലൂടെയോ പ്രകടമാകുന്ന ശ്രദ്ധാപൂർവമായ കരുതലിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: διεμαρτύρατο
  choice: സാക്ഷ്യപ്പെടുത്തിയിരിക്കുന്നു
  rationale: ഊന്നലോടെയുള്ള സാക്ഷ്യപ്പെടുത്തൽ എന്ന അർഥവും ഉദ്ധരിക്കപ്പെട്ട തിരുവെഴുത്തുസാക്ഷ്യത്തിന്റെ നിലനിൽക്കുന്ന പ്രസക്തിയും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: δέ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിൽനിന്നുള്ള മൃദുവായ വ്യത്യാസമോ വാദപരമായ വഴിത്തിരിവോ സൂചിപ്പിക്കുന്നു.
- source_word: πού τις
  choice: ഒരിടത്ത് ഒരാൾ
  rationale: ഉദ്ധരണിയുടെ സ്ഥാനവും മനുഷ്യരചയിതാവും പേരെടുത്തുപറയാതെ അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം; എഴുത്തുകാരന് സ്ഥലം അറിയില്ലെന്ന സൂചന നൽകുന്നില്ല.
- source_word: Τί ἐστιν ἄνθρωπος
  choice: മനുഷ്യൻ എന്തുള്ളൂ?
  rationale: പ്രതിനിധാനപരമായ ഏകവചനവും സങ്കീർത്തനത്തിലെ കാവ്യാത്മക ചോദ്യത്തിന്റെ ഭാവവും നിലനിർത്തുന്നു.
- source_word: ὅτι μιμνῄσκῃ αὐτοῦ
  choice: അവനെ ഓർക്കാൻ
  rationale: μιμνῄσκομαι എന്നതിന്റെ ‘ഓർക്കുക/മനസ്സിൽ സൂക്ഷിക്കുക’ എന്ന അർഥം സാധാരണക്കാർക്ക് വ്യക്തമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: υἱὸς ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: സങ്കീർത്തനം 8-ലെ മനുഷ്യരാശിയെ സൂചിപ്പിക്കുന്ന കാവ്യസമാന്തരവും എബ്രായരിലെ തുടർന്നുള്ള യേശുസംബന്ധിയായ പ്രയോഗസാധ്യതയും ഒരുമിച്ച് തുറന്നുവെക്കുന്നു.
- source_word: ὅτι ἐπισκέπτῃ αὐτόν
  choice: അവനെ കരുതാൻ
  rationale: ἐπισκέπτομαι സൂചിപ്പിക്കുന്ന ശ്രദ്ധാപൂർവമായ സന്ദർശനം, പരിപാലനം, കരുതൽ എന്നിവയിൽ സന്ദർഭത്തിന് യോജിച്ച അർഥം സ്വാഭാവികമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: ‘മനുഷ്യപുത്രൻ’ എന്നത് ഇവിടെ വ്യക്തമായ മിശിഹാ പദവിയായി വിവർത്തനം ചെയ്യണമോ
  choice: സങ്കീർത്തന ഉദ്ധരണിയിലെ ‘മനുഷ്യപുത്രൻ’ എന്ന രൂപം നിലനിർത്തി, മുഖ്യപാഠത്തിൽ അത് വ്യക്തമായ മിശിഹാ പദവിയായി അടയാളപ്പെടുത്താതിരിക്കുന്നു.
  alternative: ‘ഒരു മനുഷ്യൻ’ എന്ന പൊതുവായ അർഥത്തിൽ മാറ്റുക, അല്ലെങ്കിൽ യേശുവിനെ മാത്രം സൂചിപ്പിക്കുന്ന പദവിയായി വ്യക്തമാക്കുക.
  rationale: സങ്കീർത്തനം 8-ൽ ഈ പ്രയോഗം മനുഷ്യനെക്കുറിച്ചുള്ള കാവ്യസമാന്തരമാണ്; എബ്രായരുടെ തുടർന്നുള്ള സന്ദർഭം അതിന് ക്രിസ്തുസംബന്ധിയായ പ്രാധാന്യവും നൽകുന്നു. അതിനാൽ രണ്ടുതലങ്ങളിലുമുള്ള അർഥസാധ്യത നേരത്തേ തീർപ്പാക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ഒരിടത്ത് ഒരാൾ’ എന്ന പ്രയോഗം ഗ്രീക്കിലെ അനിശ്ചിത അവതരണം നിലനിർത്തുന്നു. കാവ്യാത്മക സമാന്തരതയ്ക്കായി ‘മനുഷ്യൻ/മനുഷ്യപുത്രൻ’ നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പുകുറികളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
