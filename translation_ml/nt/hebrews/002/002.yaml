source:
  edition: SBLGNT
  text: εἰ γὰρ ὁ δι’ ἀγγέλων λαληθεὶς λόγος ἐγένετο βέβαιος, καὶ πᾶσα παράβασις καὶ παρακοὴ ἔλαβεν ἔνδικον μισθαποδοσίαν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/002.yaml
  text: For if the message spoken through angels proved firm[a], and every transgression and disobedience received a just penalty[b],
translation:
  language: ml
  text: ദൂതന്മാർ മുഖാന്തരം അരുളിച്ചെയ്യപ്പെട്ട സന്ദേശം ഉറപ്പുള്ളതായിത്തീരുകയും, ഓരോ ലംഘനത്തിനും അനുസരണക്കേടിനും നീതിയുക്തമായ പ്രതിഫലം ലഭിക്കുകയും ചെയ്തെങ്കിൽ[a][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇത് ദൂതന്മാർ മുഖാന്തരം നൽകപ്പെട്ടതായി യഹൂദപാരമ്പര്യം മനസ്സിലാക്കിയ ന്യായപ്രമാണത്തെ സൂചിപ്പിക്കുന്നതാകാം; അപ്പൊസ്തലപ്രവൃത്തികൾ 7:53; ഗലാത്യർ 3:19 എന്നിവ താരതമ്യം ചെയ്യുക.
    reason: cross_reference
  - marker: b
    text: അഥവാ ‘നീതിയുക്തമായ ശിക്ഷ’ അല്ലെങ്കിൽ ‘അർഹമായ പകരം’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δι’ ἀγγέλων λαληθεὶς λόγος
  choice: ദൂതന്മാർ മുഖാന്തരം അരുളിച്ചെയ്യപ്പെട്ട സന്ദേശം
  rationale: λόγος ഇവിടെ ആശയവിനിമയം ചെയ്യപ്പെട്ട ദൈവിക സന്ദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്. διά + genitive സൂചിപ്പിക്കുന്ന മധ്യസ്ഥത ‘മുഖാന്തരം’ എന്നതിലൂടെ നിലനിർത്തുന്നു; λαληθείς എന്നതിന്റെ ഗൗരവമുള്ള സ്വാഭാവിക പരിഭാഷയായി ‘അരുളിച്ചെയ്യപ്പെട്ട’ ഉപയോഗിക്കുന്നു.
- source_word: ἀγγέλων
  choice: ദൂതന്മാർ
  rationale: എബ്രായർ 2-ലെ സന്ദർഭവും സീനായി ന്യായപ്രമാണം ദൂതന്മാർ മുഖാന്തരം ലഭിച്ചു എന്ന യഹൂദപാരമ്പര്യവും കണക്കിലെടുക്കുമ്പോൾ സ്വർഗീയ ദൂതന്മാരാണ് സാധ്യതയുള്ള സൂചന.
- source_word: ἐγένετο βέβαιος
  choice: അചഞ്ചലമായി നിലനിന്നു
  rationale: സന്ദേശം പ്രാബല്യവും ഉറപ്പും ഉള്ളതായി നിലകൊണ്ടു എന്ന ഫലസൂചന നൽകുന്നു; വെറും വിശ്വാസ്യതയോ സ്ഥിരീകരണമോ മാത്രമായി അർഥം ചുരുക്കുന്നില്ല.
- source_word: πᾶσα παράβασις
  choice: ഓരോ അതിക്രമം
  rationale: παράβασις കല്പന നിശ്ചയിച്ച അതിർത്തി ലംഘിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘അതിക്രമം’ അതിന്റെ നിയമപരവും ധാർമികവുമായ ഭാരം നിലനിർത്തുന്നു.
- source_word: παρακοὴ
  choice: അനുസരണക്കേട്
  rationale: കേൾക്കാതിരിക്കുക എന്ന മൂലധ്വനിയിൽനിന്ന് വരുന്ന അനുസരണവിമുഖതയാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്; παράβασις-നോടുള്ള സമാന്തരതയും നിലനിർത്തുന്നു.
- source_word: ἔλαβεν
  choice: ലഭിച്ചു
  rationale: ഓരോ പ്രവൃത്തിക്കും അതിന് യോജിച്ച പ്രതിഫലം ലഭിച്ചു എന്ന ഗ്രീക്ക് വാക്യഘടന നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἔνδικον μισθαποδοσίαν
  choice: നീതിയുക്തമായ പ്രതിഫലം
  rationale: μισθαποδοσία പ്രതിഫലം അഥവാ തിരിച്ചുനൽകൽ എന്ന വിശാല അർഥമുള്ളതും ἔνδικος അത് ന്യായപ്രകാരമുള്ളതാണെന്ന് വ്യക്തമാക്കുന്നതുമാണ്. സന്ദർഭത്തിൽ ശിക്ഷാത്മക അർഥമുണ്ടെങ്കിലും ‘പ്രതിഫലം’ ഗ്രീക്കിലെ പദപരിധി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ‘ദൂതന്മാർ മുഖാന്തരം അരുളിച്ചെയ്യപ്പെട്ട സന്ദേശം’ എന്തിനെ സൂചിപ്പിക്കുന്നു
  choice: ന്യായപ്രമാണത്തിലേക്കുള്ള സൂചനയായി മനസ്സിലാക്കുന്നു, എന്നാൽ മുഖ്യവാചകത്തിൽ ‘ന്യായപ്രമാണം’ എന്ന് വ്യക്തമാക്കുന്നില്ല.
  alternative: ദൂതന്മാർ അറിയിച്ച ഏതെങ്കിലും പൊതുവായ ദൈവിക സന്ദേശം.
  rationale: വിശാലസന്ദർഭവും യഹൂദപാരമ്പര്യവും സീനായി ന്യായപ്രമാണത്തെ ശക്തമായി സൂചിപ്പിക്കുന്നു. എങ്കിലും ഗ്രീക്ക് വാചകം ‘സന്ദേശം’ എന്നു മാത്രമേ പറയുന്നുള്ളൂ; അതിനാൽ തിരിച്ചറിയൽ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും മുഖ്യവാചകത്തിലെ അർഥതുറപ്പ് നിലനിർത്തുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ‘അരുളിച്ചെയ്യപ്പെട്ട’ ദൈവിക സന്ദേശത്തിന്റെ സന്ദർഭത്തിന് യോജിച്ച ഔപചാരികത നൽകുന്നു. വാക്യം അടുത്ത വാക്യത്തിൽ പൂർത്തിയാകുന്ന വ്യവസ്ഥാവാക്യമാകയാൽ അവസാനത്തിൽ കോമ നിലനിർത്തിയിരിക്കുന്നു.
