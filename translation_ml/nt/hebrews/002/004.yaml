id: HEB.2.4
reference: Hebrews 2:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: συνεπιμαρτυροῦντος τοῦ θεοῦ σημείοις τε καὶ τέρασιν καὶ ποικίλαις δυνάμεσιν καὶ πνεύματος ἁγίου μερισμοῖς κατὰ τὴν αὐτοῦ θέλησιν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/004.yaml
  text: while God also bore witness with signs and wonders and various miracles and distributions of the Holy Spirit according to his will.
translation:
  language: ml
  text: ദൈവവും അടയാളങ്ങളാലും അത്ഭുതങ്ങളാലും വിവിധ ശക്തിപ്രവൃത്തികളാലും[a] പരിശുദ്ധാത്മാവിന്റെ വിതരണങ്ങളാലും[b] തന്റെ ഇഷ്ടപ്രകാരം സാക്ഷ്യം വഹിച്ചുകൊണ്ട്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വിവിധ ശക്തികൾ’ അല്ലെങ്കിൽ ‘വിവിധ വീര്യപ്രവൃത്തികൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദം ശക്തിയുടെ പ്രകടനങ്ങളെയും ഈ സന്ദർഭത്തിൽ അത്ഭുതപ്രവൃത്തികളെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘പരിശുദ്ധാത്മാവിന്റെ പങ്കുവെക്കലുകൾ’ അല്ലെങ്കിൽ ‘പരിശുദ്ധാത്മാവിന്റെ വിഹിതങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. മൂലപാഠത്തിൽ ‘വരങ്ങൾ’ എന്ന പദം നേരിട്ട് ചേർത്തിട്ടില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεπιμαρτυροῦντος τοῦ θεοῦ
  choice: ദൈവവും കൂടെ സാക്ഷ്യം വഹിച്ചു
  rationale: συν- എന്നതിന്റെ സഹ/അധിക സാക്ഷ്യത്തിന്റെ ഭാവം ‘വും കൂടെ’ നിലനിർത്തുന്നു. മുൻവാക്യത്തെ ആശ്രയിക്കുന്ന ജനിറ്റീവ് പാർട്ടിസിപ്പിളിന്റെ സമകാലിക അനുബന്ധപ്രവർത്തനം മലയാളത്തിൽ സ്വാഭാവികമായ സമാപിക ക്രിയയായി അവതരിപ്പിച്ചു.
- source_word: σημείοις τε καὶ τέρασιν
  choice: അടയാളങ്ങളാലും അത്ഭുതങ്ങളാലും
  rationale: ദൈവം സാക്ഷ്യം വഹിച്ച മാർഗം സൂചിപ്പിക്കുന്ന കരണാർഥക ദത്തിവിനെ ‘-ആൽ’കൊണ്ട് വ്യക്തമാക്കി; പതിവായ ഗ്രീക്ക് പദജോടിയുടെ തെളിവിന്റെയും വിസ്മയത്തിന്റെയും ഭാവങ്ങൾ നിലനിർത്തുന്നു.
- source_word: ποικίλαις δυνάμεσιν
  choice: വിവിധ ശക്തിപ്രവൃത്തികളാലും
  rationale: δύναμις എന്ന പദത്തിലെ ‘ശക്തി’ എന്ന അടിസ്ഥാനഭാവവും ഈ സന്ദർഭത്തിലെ അത്ഭുതപ്രവൃത്തികളുടെ അർത്ഥവും ഒരുമിച്ച് സൂക്ഷിക്കുന്നു; ‘അത്ഭുതങ്ങൾ’ എന്ന് മാത്രം പറഞ്ഞ് σημείοις/τέρασιν എന്നിവയുമായുള്ള വ്യത്യാസം ഇല്ലാതാക്കുന്നില്ല.
- source_word: πνεύματος ἁγίου
  choice: പരിശുദ്ധാത്മാവിന്റെ
  rationale: μερισμοῖς-നെ വിശേഷിപ്പിക്കുന്ന ജനിറ്റീവ് രൂപവും സ്ഥിരമായ ദൈവിക നാമവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: μερισμοῖς
  choice: പങ്കുവെക്കലുകളാലും
  rationale: വിതരണം, വിഹിതം നൽകൽ എന്നീ അർത്ഥങ്ങൾ ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളം; മൂലത്തിൽ ഇല്ലാത്ത ‘വരങ്ങൾ’ എന്ന പദം ചേർത്തിട്ടില്ല.
- source_word: κατὰ τὴν αὐτοῦ θέλησιν
  choice: തന്റെ ഇഷ്ടപ്രകാരമുള്ള
  rationale: κατά + accusative സൂചിപ്പിക്കുന്ന അനുരൂപത വ്യക്തമാക്കുന്നു. പ്രതിഫലന സർവനാമം പ്രധാന കർത്താവായ ദൈവത്തിലേക്കാണ് സ്വാഭാവികമായി മടങ്ങുന്നത്.
theological_decisions:
- issue: αὐτοῦ (‘തന്റെ’) എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: ദൈവം
  alternative: പരിശുദ്ധാത്മാവ്
  rationale: വാക്യത്തിന്റെ നിയന്ത്രക കർത്താവ് ദൈവമാണ്; അതിനാൽ ‘തന്റെ’ സ്വാഭാവികമായി ദൈവത്തെ സൂചിപ്പിക്കുന്നു. പരിശുദ്ധാത്മാവിലേക്കുള്ള ബന്ധം വ്യാകരണപരമായി പൂർണമായും അസാധ്യമെന്ന് പ്രഖ്യാപിക്കുന്നില്ല.
- issue: μερισμοῖς-ൽ ‘വരങ്ങൾ’ ചേർക്കണമോ
  choice: ‘വരങ്ങൾ’ ചേർക്കാതെ ‘പങ്കുവെക്കലുകൾ’
  alternative: പരിശുദ്ധാത്മാവിന്റെ വരങ്ങളുടെ വിതരണം
  rationale: വരങ്ങൾ എന്ന ആശയം സന്ദർഭത്തിൽ ഉൾപ്പെട്ടിരിക്കാമെങ്കിലും ഗ്രീക്ക് പാഠത്തിൽ അതിനുള്ള പ്രത്യേക നാമപദമില്ല; അതിനാൽ വ്യാഖ്യാനപരമായ കൂട്ടിച്ചേർക്കൽ മുഖ്യപാഠത്തിൽ ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ മലയാളം. വാക്യം മുൻവാക്യത്തിന്റെ തുടർച്ചയായതിനാൽ ആശ്രിതഭാവം അർത്ഥത്തിൽ നിലനിർത്തിയെങ്കിലും ഒറ്റവാക്യമായി വായിക്കാവുന്ന സ്വാഭാവിക ക്രമം സ്വീകരിച്ചു; മുഖ്യപാഠത്തിലെ എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദങ്ങൾക്ക് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
