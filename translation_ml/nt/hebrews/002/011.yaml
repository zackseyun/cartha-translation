  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅ τε γὰρ ἁγιάζων καὶ οἱ ἁγιαζόμενοι ἐξ ἑνὸς πάντες· δι’ ἣν αἰτίαν οὐκ ἐπαισχύνεται ἀδελφοὺς αὐτοὺς καλεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/011.yaml
  text: For both the one who sanctifies and those who are being sanctified are all from one[a]; for this reason he is not ashamed to call them brothers[b],
translation:
  language: ml
  text: വിശുദ്ധീകരിക്കുന്നവനും വിശുദ്ധീകരിക്കപ്പെടുന്നവരും എല്ലാവരും ഒന്നിൽനിന്നുള്ളവരാണ്[a]. അതുകൊണ്ട് അവരെ സഹോദരന്മാർ എന്നു വിളിക്കാൻ അവൻ ലജ്ജിക്കുന്നില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഒരു പിതാവിൽനിന്ന്,’ ‘ഒരു ഉറവിടത്തിൽനിന്ന്,’ അല്ലെങ്കിൽ ‘ഒരു പൂർവികനിൽനിന്ന്.’ ‘ഒന്ന്’ എന്തിനെ സൂചിപ്പിക്കുന്നുവെന്ന് ഗ്രീക്ക് പാഠം വ്യക്തമാക്കുന്നില്ല.
    reason: alternative_reading
  - marker: b
    text: ‘സഹോദരന്മാർ’ എന്നത് ἀδελφοὺς എന്ന പുല്ലിംഗ ബഹുവചനത്തിന്റെ പരിഭാഷയാണ്; ഈ സന്ദർഭത്തിൽ സ്ത്രീകൾ ഉൾപ്പെടെയുള്ള വിശ്വാസികളുടെ വിശാലമായ കുടുംബത്തെ ഇത് സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἁγιάζων
  choice: വിശുദ്ധീകരിക്കുന്നവൻ
  rationale: വർത്തമാനകാല കർത്തരി കൃദന്തരൂപത്തിന്റെ നാമപ്രയോഗം പ്രതിഫലിപ്പിക്കുകയും ἁγιάζω എന്ന ക്രിയയുടെ ദൈവശാസ്ത്രപരവും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ അർഥം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: οἱ ἁγιαζόμενοι
  choice: വിശുദ്ധീകരിക്കപ്പെട്ടുകൊണ്ടിരിക്കുന്നവർ
  rationale: വർത്തമാനകാല കർമണി കൃദന്തരൂപത്തിലെ പുരോഗമനഭാവം വ്യക്തമാക്കുകയും ἁγιάζω-യോടുള്ള പദസമാനത കാത്തുസൂക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐξ ἑνὸς
  choice: ഒരുവനിൽനിന്നുള്ളവർ
  rationale: ἑνός പുല്ലിംഗ/നപുംസകലിംഗ രൂപത്തിൽ ഒരേപോലെയാകാമെങ്കിലും വ്യക്തിപരമായ ഉറവിടസാധ്യത മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കാൻ ‘ഒരുവൻ’ ഉപയോഗിക്കുന്നു; ആ ഒരുവൻ ആരാണെന്ന് മുഖ്യപാഠം വ്യക്തമാക്കുന്നില്ല.
- source_word: πάντες
  choice: എല്ലാവരും
  rationale: വിശുദ്ധീകരിക്കുന്നവനെയും വിശുദ്ധീകരിക്കപ്പെടുന്നവരെയും ഒരുപോലെ ഉൾക്കൊള്ളുന്ന ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: δι’ ἣν αἰτίαν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യത്തിൽനിന്നുള്ള ഫലം സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: οὐκ ἐπαισχύνεται
  choice: ലജ്ജിക്കുന്നില്ല
  rationale: മാന-അപമാന ഭാവം അനാവശ്യ വ്യാഖ്യാനമില്ലാതെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἀδελφοὺς
  choice: സഹോദരന്മാർ
  rationale: സ്രോതസ്സിലെ പുല്ലിംഗ ബഹുവചനം കൃത്യമായി നിലനിർത്തുന്നു; വിശ്വാസിസമൂഹത്തിലെ സ്ത്രീകളെയും സന്ദർഭപരമായി ഉൾക്കൊള്ളാമെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: καλεῖν
  choice: വിളിക്കാൻ
  rationale: ἐπαισχύνεται-യോടു ചേർന്ന അനന്തക്രിയയുടെ സ്വാഭാവിക മലയാളപ്രയോഗമാണ്.
theological_decisions:
- issue: ‘അവൻ’ എന്ന സൂചിത കർത്താവിന്റെയും ἐξ ἑνὸς എന്നതിലെ ‘ഒരുവൻ’ എന്നതിന്റെയും തിരിച്ചറിയൽ
  choice: സന്ദർഭത്തിൽ ‘അവൻ’ വിശുദ്ധീകരിക്കുന്ന പുത്രനെ സൂചിപ്പിക്കുന്നു; ‘ഒരുവൻ’ ആരാണെന്നത് വ്യക്തമാക്കാതെ നിലനിർത്തുന്നു.
  alternative: ‘ഒരേ പിതാവിൽനിന്ന്’, ‘ഒരേ ഉറവിടത്തിൽനിന്ന്’, അല്ലെങ്കിൽ ‘ഒരേ പൂർവികനിൽനിന്ന്’ എന്നു വ്യക്തമാക്കുക.
  rationale: അടുത്ത സന്ദർഭം വിശുദ്ധീകരിക്കുന്നവനെ പുത്രൻ/യേശു എന്നു തിരിച്ചറിയാൻ സഹായിക്കുന്നുവെങ്കിലും ἐξ ἑνὸς എന്ന പ്രയോഗം ദൈവം, ഒരു പൂർവികൻ, അല്ലെങ്കിൽ പൊതുവായ ഉറവിടം എന്നിവയിൽ ഏതാണെന്ന് വ്യക്തമാക്കുന്നില്ല. അതിനാൽ പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘വിശുദ്ധീകരിക്കുക’ എന്ന പരിചിത ദൈവശാസ്ത്രപദം നിലനിർത്തിയിട്ടുണ്ട്. മൂലപാഠത്തിലെ ἐξ ἑνὸς എന്ന പ്രയോഗത്തിന്റെ അവ്യക്തത അടിക്കുറിപ്പോടെ സംരക്ഷിച്ചു; മുഖ്യപാഠത്തിലെ എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും ചേർത്തിട്ടുണ്ട്.
