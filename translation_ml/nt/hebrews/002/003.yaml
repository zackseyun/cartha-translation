id: HEB.2.3
reference: Hebrews 2:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πῶς ἡμεῖς ἐκφευξόμεθα τηλικαύτης ἀμελήσαντες σωτηρίας, ἥτις, ἀρχὴν λαβοῦσα λαλεῖσθαι διὰ τοῦ κυρίου, ὑπὸ τῶν ἀκουσάντων εἰς ἡμᾶς ἐβεβαιώθη,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/003.yaml
  text: How will we escape if we neglect so great a salvation? This salvation[a], having at first been spoken through the Lord, was confirmed to us by those who heard him,
translation:
  language: ml
  text: ഇത്ര മഹത്തായ രക്ഷയെ നാം അവഗണിച്ചാൽ എങ്ങനെ രക്ഷപ്പെടും? കർത്താവിലൂടെ ആദ്യം പ്രസ്താവിക്കപ്പെടാൻ തുടങ്ങിയ ഈ രക്ഷ[a], കേട്ടവരാൽ നമുക്കു സ്ഥിരീകരിക്കപ്പെട്ടു,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “കർത്താവിലൂടെ പ്രസ്താവിക്കപ്പെടാൻ ആദ്യം തുടങ്ങിയതും കേട്ടവരാൽ നമുക്കു സ്ഥിരീകരിക്കപ്പെട്ടതുമായ രക്ഷ.”'
    reason: ἀρχὴν λαβοῦσα λαλεῖσθαι എന്ന പ്രയോഗത്തിന്റെ ‘പ്രസ്താവിക്കപ്പെടാൻ തുടക്കം ലഭിച്ചു’ എന്ന ആരംഭസൂചക ഭാവവും ἥτις ആരംഭിക്കുന്ന ബന്ധവാക്യഘടനയും കൂടുതൽ അക്ഷരാനുസൃതമായി കാണിക്കുന്ന മറ്റൊരു വിവർത്തനം.
lexical_decisions:
- source_word: πῶς
  choice: എങ്ങനെ
  rationale: രക്ഷപ്പെടാനുള്ള വഴിയില്ലെന്ന ശക്തമായ സൂചന നൽകുന്ന അലങ്കാരപ്രശ്നത്തിന്റെ രൂപം മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: ἐκφευξόμεθα
  choice: രക്ഷപ്പെടും
  rationale: ഭാവികാല ചോദ്യരൂപം സ്വാഭാവികമായ മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു; അതിനെ നേരിട്ടുള്ള നിഷേധപ്രസ്താവനയാക്കുന്നില്ല.
- source_word: τηλικαύτης
  choice: ഇത്ര മഹത്തായ
  rationale: രക്ഷയുടെ അതിവലിയ മഹത്ത്വത്തെ ഊന്നിപ്പറയുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: ἀμελήσαντες
  choice: നാം അവഗണിച്ചാൽ
  rationale: ഭൂതകാല കൃദന്തരൂപം ഇവിടെ മുഖ്യക്രിയയോടുള്ള വ്യവസ്ഥാപരമായ ബന്ധം സൂചിപ്പിക്കുന്നു; മുന്നറിയിപ്പിന്റെ സന്ദർഭത്തിൽ ഈ രൂപം വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: σωτηρίας
  choice: രക്ഷ
  rationale: വിടുതലയും അന്തിമമായ ദൈവിക രക്ഷയും ഉൾക്കൊള്ളുന്ന, സന്ദർഭോചിതവും സ്ഥാപിതവുമായ മലയാള പദം.
- source_word: ἥτις
  choice: ഈ രക്ഷ
  rationale: ബന്ധസർവനാമത്തിന്റെ മുൻപദമായ ‘രക്ഷ’ വ്യക്തമായി ആവർത്തിച്ച് വിശദീകരണസ്വഭാവം നിലനിർത്തുന്നു.
- source_word: ἀρχὴν λαβοῦσα λαλεῖσθαι
  choice: ആദ്യം പ്രസ്താവിക്കപ്പെട്ട
  rationale: അക്ഷരാർഥത്തിലെ ‘സംസാരിക്കപ്പെടാൻ തുടക്കം ലഭിച്ച’ എന്ന ആശയം സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; പ്രഖ്യാപനം കർത്താവിലൂടെ ആരംഭിച്ചു എന്ന കാലപരവും ആരംഭസൂചകവുമായ ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: διὰ τοῦ κυρίου
  choice: കർത്താവിലൂടെ
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന മാധ്യമമോ പ്രവർത്തകത്വമോ നിലനിർത്തുന്നു; κύριος എന്ന പദത്തിന് സ്ഥാപിതമായ ‘കർത്താവ്’ ഉപയോഗിക്കുന്നു.
- source_word: ὑπὸ τῶν ἀκουσάντων
  choice: കേട്ടവരാൽ
  rationale: ഗ്രീക്കിൽ കേട്ടതിന്റെ കർമം വ്യക്തമാക്കിയിട്ടില്ല; സന്ദർഭത്തിൽ കർത്താവിനെ കേട്ടവരാണ് ഉദ്ദേശ്യമെങ്കിലും മലയാള മുഖ്യപാഠത്തിൽ അതു ചേർക്കാതെ മൂലത്തിലെ സംക്ഷിപ്തതയും സാധ്യതയുള്ള വ്യാകരണപരമായ തുറന്ന നിലയും സൂക്ഷിക്കുന്നു.
- source_word: εἰς ἡμᾶς
  choice: നമുക്കു
  rationale: സാക്ഷ്യം സ്വീകരിച്ചവരിലേക്കുള്ള ദിശയും ബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐβεβαιώθη
  choice: സ്ഥിരീകരിക്കപ്പെട്ടു
  rationale: സന്ദേശത്തിന്റെ സത്യതയും ഉറപ്പും കേട്ടവരുടെ സാക്ഷ്യത്താൽ സ്ഥാപിക്കപ്പെട്ടു എന്ന നിർജ്ജീവക്രിയാഭാവം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: τοῦ κυρίου എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: ‘കർത്താവ്’ യേശുവിനെ സൂചിപ്പിക്കുന്നതായി വിവർത്തനം അനുവദിക്കുന്നു.
  alternative: പൊതുവായി ദൈവത്തെ സൂചിപ്പിക്കുന്ന ‘കർത്താവ്’.
  rationale: രക്ഷ ആദ്യം കർത്താവിലൂടെ പ്രസ്താവിക്കപ്പെടുകയും പിന്നീട് കേട്ടവർ അതു സ്ഥിരീകരിക്കുകയും ചെയ്തു എന്ന ക്രമം യേശുവിന്റെ ഭൗമിക പ്രസ്താവനയിലേക്കും അതു കേട്ടവരുടെ സാക്ഷ്യത്തിലേക്കും ശക്തമായി വിരൽചൂണ്ടുന്നു; എങ്കിലും പേരിനെ മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
- issue: മുന്നറിയിപ്പുചോദ്യത്തിന്റെ ശക്തി
  choice: ഭാവികാല അലങ്കാരചോദ്യമായി നിലനിർത്തി.
  alternative: ‘നാം ഒരിക്കലും രക്ഷപ്പെടുകയില്ല’ എന്ന വ്യക്തമായ നിഷേധപ്രസ്താവന.
  rationale: ഗ്രീക്ക് പാഠം രക്ഷപ്പെടാനാകില്ലെന്ന ശക്തമായ സൂചന നൽകുന്നുവെങ്കിലും ചോദ്യരൂപത്തിലാണ്; അതിനാൽ മുന്നറിയിപ്പിന്റെ തീവ്രതയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും അതേ രൂപത്തിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘രക്ഷ’, ‘കർത്താവ്’, ‘സ്ഥിരീകരിക്കപ്പെട്ടു’ എന്നീ സ്ഥാപിത പദങ്ങൾ ഉപയോഗിച്ചു. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തി.
