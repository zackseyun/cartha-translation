id: HEB.2.13
reference: Hebrews 2:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ πάλιν· Ἐγὼ ἔσομαι πεποιθὼς ἐπ’ αὐτῷ· καὶ πάλιν· Ἰδοὺ ἐγὼ καὶ τὰ παιδία ἅ μοι ἔδωκεν ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/013.yaml
  text: And again[a], “I will put my trust in him.” And again, “Behold[d][c][b], I and the children whom God has given me.”
translation:
  language: ml
  text: 'വീണ്ടും: “ഞാൻ അവനിൽ ആശ്രയിച്ചിരിക്കും.”[a] വീണ്ടും: “ഇതാ,[b] ഞാനും ദൈവം എനിക്കു നൽകിയ മക്കളും.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “ഞാൻ അവനിൽ ആശ്രയിക്കുന്നവനായിരിക്കും” അഥവാ “ഞാൻ അവനിൽ ആത്മവിശ്വാസമുള്ളവനായിരിക്കും.”'
    reason: lexical_alternative
  - marker: b
    text: ഈ വാക്യത്തിന്റെ ഗ്രീക്കിൽ സംസാരിക്കുന്നയാളെ പേരെടുത്ത് പറയുന്നില്ല; സന്ദർഭത്തിൽ എബ്രായർ ഈ ഉദ്ധരണികളെ പുത്രനോട് പ്രയോഗിക്കുന്നു.
    reason: cross_reference
  - marker: c
    text: 'അഥവാ: “ദൈവം എനിക്കു തന്ന മക്കളും.”'
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ πάλιν
  choice: വീണ്ടും
  rationale: മറ്റൊരു ഉദ്ധരണി അവതരിപ്പിക്കുന്ന സംക്ഷിപ്ത സൂത്രവാക്യം. ഗ്രീക്കിൽ ‘അവൻ പറയുന്നു’ എന്ന ക്രിയ ഇല്ലാത്തതിനാൽ അത് കൂട്ടിച്ചേർത്തിട്ടില്ല.
- source_word: Ἐγὼ
  choice: ഞാൻ
  rationale: ഉദ്ധരണിയിലെ ഊന്നലുള്ള പ്രഥമപുരുഷ സർവനാമം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἔσομαι πεποιθὼς
  choice: ആശ്രയിച്ചിരിക്കും
  rationale: εἰμί എന്നതിന്റെ ഭാവികാലരൂപവും πείθω എന്നതിന്റെ പൂർണകൃതന്തവും ചേർന്ന പ്രയോഗം ഉറച്ചുനിൽക്കുന്ന ഭാവിയിലെ ആശ്രയഭാവം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ രൂപമാണിത്.
- source_word: ἐπ’ αὐτῷ
  choice: അവനിൽ
  rationale: ആശ്രയിക്കുക എന്ന ക്രിയയോടൊപ്പം മലയാളത്തിൽ സ്വാഭാവികമായ ബന്ധപ്രയോഗം; ഗ്രീക്കിലെ വ്യക്തിസൂചന നിലനിർത്തുന്നു.
- source_word: Ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഉദ്ധരണിശൈലിയുടെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τὰ παιδία
  choice: മക്കൾ
  rationale: ഇവിടെ ബന്ധപരമായി പറയുന്ന കുട്ടികളെ സൂചിപ്പിക്കുന്നു; ‘മക്കൾ’ ഉദ്ധരണിയുടെ കുടുംബബന്ധഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἅ μοι ἔδωκεν ὁ θεός
  choice: ദൈവം എനിക്കു നൽകിയ
  rationale: ഗ്രീക്കിലെ ലളിത ഭൂതകാലത്തെ മലയാളത്തിൽ വിശേഷണരൂപമായി സ്വാഭാവികമായി നൽകുന്നു; കൊടുക്കലിന്റെ ഫലം ഇപ്പോഴും പ്രസക്തമാണെന്ന സന്ദർഭവും നിലനിൽക്കുന്നു.
- source_word: ὁ θεός
  choice: ദൈവം
  rationale: θεός എന്നതിനുള്ള സാധാരണയും സന്ദർഭോചിതവുമായ മലയാള പരിഭാഷ.
theological_decisions:
- issue: ഉദ്ധരണികളുടെ ക്രിസ്തുശാസ്ത്രപരമായ ശബ്ദം
  choice: പ്രഥമപുരുഷ ഉദ്ധരണികൾ അതേപടി നൽകി, മുഖ്യവാചകത്തിൽ സംസാരിക്കുന്നയാളെ പേരെടുത്ത് വ്യക്തമാക്കിയില്ല.
  alternative: ‘അവൻ പറയുന്നു’ എന്നോ ‘മിശിഹാ പറയുന്നു’ എന്നോ ചേർക്കുക.
  rationale: ഈ ഉദ്ധരണികളെ സന്ദർഭത്തിൽ എബ്രായർ പുത്രനോട് പ്രയോഗിക്കുന്നുവെങ്കിലും, ഈ വാക്യത്തിലെ ഗ്രീക്ക് ഉദ്ധരണിസൂത്രം സംസാരിക്കുന്നയാളെ പേരെടുത്ത് പറയുന്നില്ല. അതിനാൽ വ്യാഖ്യാനം മുഖ്യവാചകത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതെ സന്ദർഭം അതിനെ നിർണ്ണയിക്കാൻ വിട്ടിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ തിരുവെഴുത്ത് ഉദ്ധരണിക്ക് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ‘ഇതാ’ ഉദ്ധരണിയുടെ ഉയർന്ന രജിസ്റ്റർ നിലനിർത്തുന്നു. ഗ്രീക്കിൽ ഇല്ലാത്ത സംസാരക്രിയ ചേർത്തിട്ടില്ല; വ്യാഖ്യാനപരമായ ക്രിസ്തുശാസ്ത്ര തിരിച്ചറിയൽ അടിക്കുറിപ്പിലാക്കി.
