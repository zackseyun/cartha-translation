  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐ γὰρ δήπου ἀγγέλων ἐπιλαμβάνεται, ἀλλὰ σπέρματος Ἀβραὰμ ἐπιλαμβάνεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/016.yaml
  text: For surely it is not angels that he helps[a], but the offspring of Abraham.
translation:
  language: ml
  text: എന്തെന്നാൽ, തീർച്ചയായും, അവൻ സഹായിക്കുന്നത്[a] ദൂതന്മാരെയല്ല, അബ്രാഹാമിന്റെ സന്തതിയെയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പിടിക്കുന്നു’ അല്ലെങ്കിൽ ‘കൈക്കൊള്ളുന്നു.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് അക്ഷരാർഥത്തിൽ ‘പിടിക്കുക’ എന്നർഥമുണ്ടാകാം; എന്നാൽ ഇവിടെ ‘സഹായിക്കുക’ അഥവാ ‘സഹായത്തിനെത്തുക’ എന്ന അർഥമായിരിക്കാനാണു കൂടുതൽ സാധ്യത.
    reason: lexical_alternative
lexical_decisions:
- source_word: δήπου
  choice: തീർച്ചയായും
  rationale: പ്രസ്താവന ശ്രോതാക്കൾക്ക് വ്യക്തമായ ഒന്നാണെന്ന ഊന്നലോടുകൂടിയ അനുമാനഭാവം ഇത് സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀγγέλων
  choice: ദൂതന്മാരെ
  rationale: ἐπιλαμβάνεται എന്ന ക്രിയയോടു ബന്ധപ്പെട്ടു, അബ്രാഹാമിന്റെ സന്തതിയുമായി വൈരുധ്യത്തിൽ നിൽക്കുന്ന വിഭാഗത്തെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള മലയാള തുല്യപദമാണിത്.
- source_word: ἐπιλαμβάνεται
  choice: സഹായിക്കുന്നത്
  rationale: അക്ഷരാർഥത്തിൽ ‘പിടിക്കുക’ എന്നാകാമെങ്കിലും, ഈ സന്ദർഭത്തിൽ സഹായത്തിനായി കൈക്കൊള്ളുക അഥവാ സഹായത്തിനെത്തുക എന്ന പ്രയോഗാർഥമാണ് കൂടുതൽ യോജിക്കുന്നത്. അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: σπέρματος Ἀβραὰμ
  choice: അബ്രാഹാമിന്റെ സന്തതി
  rationale: σπέρμα എന്ന ഏകവചന കൂട്ടനാമത്തിന്റെ ‘വിത്ത്/സന്തതി/വംശജർ’ എന്ന അർഥപരിധി ‘സന്തതി’ സ്വാഭാവികമായും താരതമ്യേന ഔപചാരികമായും നിലനിർത്തുന്നു; ‘വംശജർ’ എന്ന ബഹുവചന വ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
- source_word: οὐ γὰρ ... ἀλλὰ
  choice: ദൂതന്മാരെയല്ല, അബ്രാഹാമിന്റെ സന്തതിയെയാണ്
  rationale: ഗ്രീക്കിലെ ശക്തമായ ‘അല്ല ... മറിച്ച് ...’ വൈരുധ്യവും രണ്ടാമത്തെ ഘടകത്തിനുള്ള ഊന്നലും മലയാളത്തിലെ ‘-യല്ല ... -യെയാണ്’ ഘടനയിലൂടെ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ക്രിസ്തുവിന്റെ രക്ഷാപ്രവൃത്തിയുമായി ബന്ധപ്പെട്ട് ἐπιλαμβάνεται എന്നതിന്റെ അർഥം
  choice: പുത്രൻ ദൂതന്മാരെയല്ല, അബ്രാഹാമിന്റെ സന്തതിയെയാണ് സഹായിക്കുന്നത്.
  alternative: പുത്രൻ അബ്രാഹാമിന്റെ സന്തതിയെ പിടിച്ചെടുക്കുന്നു/കൈക്കൊള്ളുന്നു; ഇത് മനുഷ്യസ്വഭാവം ഏറ്റെടുത്തതിനെ ഊന്നുന്നതായി വായിക്കാം.
  rationale: തൊട്ടുമുമ്പും പിന്നാലെയും ഉള്ള സന്ദർഭം മനുഷ്യരോടുള്ള പുത്രന്റെ ഐക്യദാർഢ്യത്തെയും രക്ഷാപരമായ സഹായത്തെയും കുറിച്ചാണ്. അതിനാൽ ‘സഹായിക്കുക’ എന്ന പ്രയോഗാർഥം മുഖ്യപാഠത്തിൽ കൂടുതൽ യോജിക്കുന്നു. എന്നാൽ അക്ഷരാർഥവും അതുമായി ബന്ധപ്പെട്ട അവതാരവായനയും യഥാർഥമായ വ്യാഖ്യാനസാധ്യതകളായതിനാൽ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അബ്രാഹാമിന്റെ സന്തതി’ എന്ന പ്രയോഗം ഏകവചന കൂട്ടനാമത്തിന്റെ തുറന്ന അർഥപരിധി നിലനിർത്തുന്നു. [a] എന്ന അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
