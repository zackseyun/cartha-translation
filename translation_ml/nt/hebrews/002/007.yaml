source:
  edition: SBLGNT
  text: ἠλάττωσας αὐτὸν βραχύ τι παρ’ ἀγγέλους, δόξῃ καὶ τιμῇ ἐστεφάνωσας ⸀αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/007.yaml
  text: You made him lower than the angels for a little while[a]; you crowned him with glory and honor.
translation:
  language: ml
  text: നീ അവനെ ദൂതന്മാരെക്കാൾ അല്പകാലത്തേക്ക് താഴ്ത്തി[a]; മഹത്ത്വവും ബഹുമാനവുംകൊണ്ട് നീ അവനെ കിരീടം ചൂടിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “നീ അവനെ ദൂതന്മാരെക്കാൾ അല്പം താഴ്ത്തി.” ഗ്രീക്ക് പ്രയോഗം കാലദൈർഘ്യത്തിനുപകരം അളവും സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἠλάττωσας
  choice: താഴ്ത്തി
  rationale: ἐλαττόω എന്ന ക്രിയയുടെ കാരണാർത്ഥകവും താരതമ്യപരവുമായ ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; തുടർന്നുള്ള ‘ദൂതന്മാരെക്കാൾ’ താരതമ്യം വ്യക്തമാക്കുന്നു.
- source_word: αὐτὸν
  choice: അവനെ
  rationale: സങ്കീർത്തന ഉദ്ധരണിയിലെ മനുഷ്യപ്രതിനിധിയെ സൂചിപ്പിക്കുന്ന പുല്ലിംഗ ഏകവചന സർവനാമം നിലനിർത്തുന്നു; മൂലത്തിൽ ഇല്ലാത്ത നാമം ചേർക്കുന്നില്ല.
- source_word: βραχύ τι
  choice: അല്പകാലത്തേക്ക്
  rationale: ഗ്രീക്കിൽ കാലദൈർഘ്യമോ അളവോ സൂചിപ്പിക്കാവുന്ന പ്രയോഗമാണിത്. എബ്രായർ 2-ലെ താൽക്കാലിക താഴ്ത്തലും തുടർന്നുള്ള മഹത്ത്വീകരണവും പരിഗണിച്ച് കാലാർത്ഥം മുഖ്യവാചകത്തിൽ സ്വീകരിക്കുന്നു; അളവാർത്ഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: παρ’ ἀγγέλους
  choice: ദൂതന്മാരെക്കാൾ
  rationale: ἐλαττόω-യോടൊപ്പമുള്ള παρά + accusative താരതമ്യം സൂചിപ്പിക്കുന്നതിനാൽ ‘ദൂതന്മാരെക്കാൾ’ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: δόξῃ
  choice: മഹത്ത്വംകൊണ്ട്
  rationale: στεφανόω-യോടുള്ള ദത്തിവ് കിരീടമണിയിക്കുന്നതിനുള്ളത് എന്തെന്ന് വ്യക്തമാക്കുന്നു. δόξα ഇവിടെ ലഭിച്ച ഉന്നതസ്ഥിതിയും പ്രഭാവവും സൂചിപ്പിക്കുന്നതിനാൽ ‘മഹത്ത്വം’ അനുയോജ്യം.
- source_word: τιμῇ
  choice: ബഹുമാനംകൊണ്ട്
  rationale: τιμή ലഭിച്ച ആദരവും പദവിയും സൂചിപ്പിക്കുന്നു; δόξα-യോടുള്ള കൂട്ടുകെട്ട് ‘മഹത്ത്വവും ബഹുമാനവും’ എന്നായി സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἐστεφάνωσας
  choice: കിരീടമണിയിച്ചു
  rationale: στεφανόω എന്ന ക്രിയയുടെ നേരിട്ടുള്ള പ്രതീകം നിലനിർത്തുന്ന, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഭൂതകാലരൂപം.
- source_word: αὐτόν
  choice: അവനെ
  rationale: രണ്ടാം പ്രയോഗത്തിലെ കർമസർവനാമം മൂലവാക്യഘടനയ്ക്കും മലയാളത്തിലെ വ്യക്തതയ്ക്കുമായി ആവർത്തിക്കുന്നു.
theological_decisions:
- issue: സങ്കീർത്തനം 8-ന്റെ ഉദ്ധരണിയിലെ βραχύ τι എന്ന പ്രയോഗത്തിന്റെ അർത്ഥം
  choice: 'കാലാർത്ഥം: ‘അല്പകാലത്തേക്ക്’'
  alternative: 'അളവാർത്ഥം: ‘അല്പം താഴ്ത്തി’'
  rationale: ഗ്രീക്ക് രണ്ടർത്ഥങ്ങളും അനുവദിക്കുന്നു. എബ്രായർ 2-ന്റെ സമീപസന്ദർഭത്തിൽ പുത്രന്റെ താൽക്കാലിക താഴ്ത്തലിനുശേഷമുള്ള മഹത്ത്വീകരണവുമായി കാലാർത്ഥം ശക്തമായി യോജിക്കുന്നു. എങ്കിലും യഥാർത്ഥ ഭാഷാപരമായ അവ്യക്തത ഇല്ലാതാക്കാതെ അളവാർത്ഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. സങ്കീർത്തനോചിതമായ ഗൗരവം നിലനിർത്തുമ്പോഴും പഴഞ്ചൻ പദക്രമം ഒഴിവാക്കി. യഥാർത്ഥ ഗ്രീക്കിലെ കാലം/അളവ് അവ്യക്തത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
