  to: നീ അവനെ ദൂതന്മാരെക്കാൾ അല്പകാലത്തേക്ക് താഴ്ത്തി[a]; മഹത്ത്വവും ബഹുമാനവുംകൊണ്ട് നീ അവനെ കിരീടം ചൂടിച്ചു.
