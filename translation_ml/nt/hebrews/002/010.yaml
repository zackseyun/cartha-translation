id: HEB.2.10
reference: Hebrews 2:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἔπρεπεν γὰρ αὐτῷ, δι’ ὃν τὰ πάντα καὶ δι’ οὗ τὰ πάντα, πολλοὺς υἱοὺς εἰς δόξαν ἀγαγόντα τὸν ἀρχηγὸν τῆς σωτηρίας αὐτῶν διὰ παθημάτων τελειῶσαι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/010.yaml
  text: For it was fitting for him—for whom are all things and through whom are all things—in bringing many sons to glory[d][c][b][a], to perfect the pioneer of their salvation through sufferings.
translation:
  language: ml
  text: എന്തെന്നാൽ, എല്ലാം ആർക്കുവേണ്ടിയാണോ, എല്ലാം ആരിലൂടെയാണോ ഉള്ളത്, അവന് അനേകം പുത്രന്മാരെ മഹത്ത്വത്തിലേക്കു നയിച്ചുകൊണ്ട് അവരുടെ രക്ഷയുടെ നായകനെ കഷ്ടാനുഭവങ്ങളിലൂടെ പൂർണതയിലെത്തിക്കുന്നത് ഉചിതമായിരുന്നു.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അനേകം പുത്രന്മാർ” എന്നത് ഗ്രീക്കിലെ പുത്രത്വവും അവകാശവും സംബന്ധിച്ച ഊന്നൽ നിലനിർത്തുന്നു; ഇവിടെ ഉദ്ദേശിക്കുന്നത് പുരുഷന്മാർ മാത്രമല്ല, ദൈവത്തിന്റെ എല്ലാ മക്കളുമാണ്.
    reason: lexical_alternative
  - marker: b
    text: “രക്ഷയുടെ നായകൻ” എന്നതിന് “രക്ഷയുടെ മുന്നോടി,” “സ്ഥാപകൻ,” “നേതാവ്,” അല്ലെങ്കിൽ “ആരംഭകൻ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: “പൂർണതയിലെത്തിക്കുക” എന്നത് ധാർമ്മികമായ ഒരു കുറവ് തിരുത്തുക എന്നല്ല; കഷ്ടാനുഭവങ്ങളിലൂടെ നിയുക്ത ലക്ഷ്യത്തിലേക്കോ ദൗത്യത്തിന്റെ സമാപ്തിയിലേക്കോ എത്തിക്കുക എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔπρεπεν
  choice: ഉചിതമായിരുന്നു
  rationale: ദൈവത്തിന്റെ ഉദ്ദേശ്യത്തിൽ യോജിച്ചതും തക്കതുമായിരുന്നതിനെ സൂചിപ്പിക്കുന്ന അപൂർണ ഭൂതകാലപ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: αὐτῷ
  choice: അവൻ
  rationale: സന്ദർഭത്തിൽ സർവനാമം ദൈവത്തെ സൂചിപ്പിക്കുന്നു; പിന്നാലെയുള്ള ബന്ധവാക്യങ്ങൾ ആ സൂചന വ്യക്തമാക്കുന്നു.
- source_word: δι’ ὃν τὰ πάντα καὶ δι’ οὗ τὰ πάντα
  choice: സകലവും ആർക്കുവേണ്ടിയാണോ സകലവും ആരിലൂടെയാണോ ഉള്ളത്
  rationale: ആദ്യ διά അന്തിമലക്ഷ്യത്തെയും രണ്ടാമത്തേത് പ്രവർത്തനമാർഗത്തെയും സൂചിപ്പിക്കുന്ന വ്യത്യാസം സംരക്ഷിക്കുന്നു.
- source_word: πολλοὺς υἱοὺς
  choice: അനേകം പുത്രന്മാരെ
  rationale: υἱούς എന്ന പുത്രത്വ-അവകാശഭാവമുള്ള വ്യക്തമായ പദം നിലനിർത്തുന്നു; ഉൾക്കൊള്ളുന്ന വ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: εἰς δόξαν
  choice: മഹത്ത്വത്തിലേക്ക്
  rationale: മഹത്ത്വമെന്ന ലക്ഷ്യത്തിലേക്കുള്ള ചലനം εἰς സൂചിപ്പിക്കുന്നതുപോലെ നൽകുന്നു.
- source_word: ἀγαγόντα
  choice: നയിക്കുന്നതിൽ
  rationale: അയോറിസ്റ്റ് കൃതന്തം τελειῶσαι എന്ന ക്രിയയുമായി സാഹചര്യപരമായി ബന്ധപ്പെടുന്നു; അതിനെ ഉദ്ദേശ്യവാക്യമായി നിർബന്ധിച്ച് വ്യാഖ്യാനിക്കാതെ ഗ്രീക്കിലെ ബന്ധം സംരക്ഷിക്കുന്നു.
- source_word: ἀρχηγὸν
  choice: മുന്നോടിയായവനെ
  rationale: ആരംഭിക്കുകയും വഴി തുറന്ന് മുമ്പിൽ നടക്കുകയും ചെയ്യുന്നവൻ എന്ന ഇരട്ടഭാവം സാധാരണ മലയാളത്തിൽ പകരുന്നു.
- source_word: τῆς σωτηρίας αὐτῶν
  choice: അവരുടെ രക്ഷയുടെ
  rationale: മൂലത്തിലെ ജനിറ്റീവ് ബന്ധം നേരിട്ട്, സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: διὰ παθημάτων
  choice: കഷ്ടാനുഭവങ്ങളിലൂടെ
  rationale: παθημάτων എന്ന ബഹുവചനം അനുഭവിച്ച വിവിധ കഷ്ടതകളുടെ മൂർത്തഭാവത്തോടെ സംരക്ഷിക്കുന്നു.
- source_word: τελειῶσαι
  choice: പൂർണതയിലെത്തിക്കുന്നത്
  rationale: ധാർമ്മിക കുറവ് തിരുത്തുക എന്നതല്ല, നിയുക്ത ലക്ഷ്യത്തിലേക്കോ സമാപ്തിയിലേക്കോ എത്തിക്കുക എന്ന ഹെബ്രായലേഖനത്തിലെ അർഥം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: τελειῶσαι എന്നത് പുത്രനെക്കുറിച്ച് പ്രയോഗിക്കുമ്പോഴുള്ള അർഥം
  choice: പൂർണതയിലെത്തിക്കുക
  alternative: പൂർണനാക്കുക; സമാപ്തിയിലെത്തിക്കുക
  rationale: ധാർമ്മിക അപൂർണത പരിഹരിച്ചതെന്ന സൂചന ഒഴിവാക്കി, കഷ്ടാനുഭവങ്ങളിലൂടെ തന്റെ രക്ഷാദൗത്യത്തിന്റെ നിയുക്ത ലക്ഷ്യത്തിലേക്ക് എത്തിച്ചതെന്ന അർഥം നൽകുന്നു.
- issue: πολλοὺς υἱοὺς എന്നതിന്റെ പരിഭാഷ
  choice: അനേകം പുത്രന്മാർ
  alternative: അനേകം മക്കൾ
  rationale: മൂലത്തിലെ പുത്രത്വവും അവകാശവും സംബന്ധിച്ച പ്രതിധ്വനി സംരക്ഷിക്കുന്നു; പുരുഷന്മാർക്ക് മാത്രമായി പരിമിതമല്ലെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: ἀγαγόντα എന്ന കൃതന്തവും τελειῶσαι എന്ന ക്രിയയും തമ്മിലുള്ള ബന്ധം
  choice: അനേകം പുത്രന്മാരെ മഹത്ത്വത്തിലേക്കു നയിക്കുന്നതിൽ ... പൂർണതയിലെത്തിക്കുക
  alternative: അനേകം പുത്രന്മാരെ മഹത്ത്വത്തിലേക്കു നയിക്കേണ്ടതിന് ... പൂർണതയിലെത്തിക്കുക
  rationale: കൃതന്തത്തെ വ്യക്തമായ ഉദ്ദേശ്യവാക്യമായി തീർക്കാതെ, ഗ്രീക്കിലെ സാഹചര്യപരവും വ്യാഖ്യാനസാധ്യതയുള്ളതുമായ ബന്ധം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. മൂലത്തിലെ ദീർഘവാക്യഘടന സാധ്യമായത്ര സംരക്ഷിച്ചെങ്കിലും ബന്ധങ്ങൾ വ്യക്തമാക്കാൻ സ്വാഭാവിക മലയാള പദക്രമം ഉപയോഗിച്ചു. ദൈവത്തെ സൂചിപ്പിക്കുന്ന സർവനാമത്തിന് നിർബന്ധിത ബഹുമാനബഹുവചനം ഉപയോഗിക്കാതെ മൂലത്തിലെ ഏകവചനരീതി പാലിച്ചു.
