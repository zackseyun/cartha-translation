id: HEB.2.18
reference: Hebrews 2:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν ᾧ γὰρ πέπονθεν αὐτὸς πειρασθείς, δύναται τοῖς πειραζομένοις βοηθῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/018.yaml
  text: For because he himself suffered when he was tempted[a], he is able to help those who are being tempted.
translation:
  language: ml
  text: എന്തെന്നാൽ, അവൻതന്നെ പ്രലോഭിപ്പിക്കപ്പെട്ടപ്പോൾ[a] കഷ്ടം അനുഭവിച്ചതുകൊണ്ട്, പ്രലോഭിപ്പിക്കപ്പെടുന്നവരെ സഹായിക്കാൻ അവനു കഴിയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, രണ്ടിടത്തും ‘പരീക്ഷിക്കുക’: ‘അവൻതന്നെ പരീക്ഷിക്കപ്പെട്ടപ്പോൾ കഷ്ടം അനുഭവിച്ചതുകൊണ്ട്, പരീക്ഷിക്കപ്പെടുന്നവരെ സഹായിക്കാൻ അവനു കഴിയും.’ സന്ദർഭമനുസരിച്ച് ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘പ്രലോഭിപ്പിക്കുക’ എന്നോ ‘പരീക്ഷിക്കുക’ എന്നോ അർഥമാകാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ γὰρ
  choice: എന്തെന്നാൽ … അതുകൊണ്ട്
  rationale: ἐν ᾧ എന്ന പ്രയോഗത്തിന്റെ കാരണാർഥവും γὰρ എന്നതിന്റെ വിശദീകരണബന്ധവും സ്വാഭാവികമായ മലയാള വാക്യഘടനയിൽ ഒരുമിച്ചു വ്യക്തമാക്കുന്നു.
- source_word: πέπονθεν
  choice: കഷ്ടം അനുഭവിച്ചു
  rationale: πάσχω എന്ന ക്രിയയുടെ പൂർത്തിയായ അനുഭവവും അതിന്റെ ഇപ്പോഴത്തെ പ്രസക്തിയും സന്ദർഭം വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ ഭൂതകാലപ്രയോഗം സ്വാഭാവികമാണ്.
- source_word: αὐτὸς
  choice: അവൻതന്നെ
  rationale: പുത്രൻ വ്യക്തിപരമായി ഈ അനുഭവത്തിലൂടെ കടന്നുപോയി എന്ന ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: πειρασθείς
  choice: പ്രലോഭിപ്പിക്കപ്പെട്ടപ്പോൾ
  rationale: πειράζω ഇവിടെ ‘പ്രലോഭിപ്പിക്കുക’ എന്നും ‘പരീക്ഷിക്കുക’ എന്നും അർഥമാക്കാൻ കഴിയും. മുഖ്യപാഠത്തിൽ സാധാരണ പുതിയനിയമ പ്രയോഗമായ ‘പ്രലോഭിപ്പിക്കുക’ സ്വീകരിച്ച് മറ്റർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: δύναται
  choice: അവനു കഴിയും
  rationale: കഴിവിനെയും ശേഷിയെയും സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ക്രിയയുടെ അർഥം ലളിതവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: τοῖς πειραζομένοις
  choice: പ്രലോഭിപ്പിക്കപ്പെടുന്നവരെ
  rationale: വർത്തമാന കൃദന്തത്തിന്റെ തുടരുന്ന പ്രവൃത്തിഭാവം മലയാളത്തിലെ ‘-പ്പെടുന്നവർ’ എന്ന രൂപം നിലനിർത്തുന്നു.
- source_word: βοηθῆσαι
  choice: സഹായിക്കാൻ
  rationale: βοηθέω എന്നതിന്റെ ‘സഹായിക്കുക, സഹായത്തിനെത്തുക’ എന്ന അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ഭാഷയിൽ നൽകുന്നു.
theological_decisions:
- issue: യേശുവിനും വിശ്വാസികൾക്കും ബാധകമായ πειράζω എന്ന പദത്തിന്റെ അർഥം
  choice: പ്രലോഭിപ്പിക്കപ്പെട്ടു / പ്രലോഭിപ്പിക്കപ്പെടുന്നു
  alternative: പരീക്ഷിക്കപ്പെട്ടു / പരീക്ഷിക്കപ്പെടുന്നു
  rationale: മുഖ്യപാഠം യേശുവിന്റെ കഷ്ടാനുഭവത്തിലും മനുഷ്യരോടുള്ള അനുഭവപരമായ ഐക്യദാർഢ്യത്തിലും ഊന്നുന്നു; പാപത്തിന് വഴങ്ങിയെന്ന സൂചന നൽകാതെ ‘പ്രലോഭിപ്പിക്കുക’ എന്ന സാധാരണ പുതിയനിയമ അർഥം നിലനിർത്തുന്നു. ഗ്രീക്കിലെ യഥാർഥ ദ്വയാർഥത ‘പരീക്ഷിക്കുക’ എന്ന പകരംവായനയായി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘അവൻതന്നെ’ എന്ന രൂപം മൂലപാഠത്തിലെ ഊന്നൽ കാത്തുസൂക്ഷിക്കുന്നു; കാരണബന്ധം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘എന്തെന്നാൽ … അതുകൊണ്ട്’ എന്ന ഘടന ഉപയോഗിച്ചു.
