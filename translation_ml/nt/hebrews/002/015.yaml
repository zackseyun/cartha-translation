id: HEB.2.15
reference: Hebrews 2:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀπαλλάξῃ τούτους, ὅσοι φόβῳ θανάτου διὰ παντὸς τοῦ ζῆν ἔνοχοι ἦσαν δουλείας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/015.yaml
  text: and free those who[a], through fear of death, were subject to slavery all their lives.
translation:
  language: ml
  text: മരണഭയം നിമിത്തം ജീവിതകാലം മുഴുവൻ അടിമത്തത്തിന് അധീനരായിരുന്ന എല്ലാവരെയും മോചിപ്പിക്കാനും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπαλλάξῃ
  choice: മോചിപ്പിക്കുക
  rationale: ഒരു അവസ്ഥയിൽനിന്നോ ബന്ധനത്തിൽനിന്നോ വിടുവിക്കുക എന്ന ക്രിയയുടെ അർഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: τούτους, ὅσοι
  choice: എല്ലാവരെയും
  rationale: പ്രകടനസർവനാമവും വർഗസമാവേശിയായ ബന്ധസർവനാമവും ചേർന്നതിന്റെ ശക്തി മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: φόβῳ θανάτου
  choice: മരണഭയംനിമിത്തം
  rationale: ദത്തിവ് സൂചിപ്പിക്കുന്ന കാരണപരമായോ ഉപാധിപരമായോ ഉള്ള ബന്ധം നിലനിർത്തുന്നു; ഭയമാണ് അടിമത്തവുമായി ബന്ധപ്പെട്ട കാരണമെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: διὰ παντὸς τοῦ ζῆν
  choice: ജീവിതകാലം മുഴുവൻ
  rationale: ജീവിതത്തിന്റെ മുഴുവൻ ദൈർഘ്യവും സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: ἔνοχοι ἦσαν δουλείας
  choice: അടിമത്തത്തിന് അധീനരായിരുന്ന
  rationale: ἔνοχος എന്നതിലെ വിധേയത്വം/ബന്ധിതാവസ്ഥയും δουλεία എന്നതിലെ യഥാർഥ അടിമത്തത്തിന്റെ ശക്തിയും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: καὶ
  choice: -ഉം
  rationale: മുൻവാക്യത്തിലെ ഉദ്ദേശ്യപ്രയോഗത്തോട് ഈ വാക്യത്തെ ബന്ധിപ്പിക്കുന്ന സംയോജകശക്തി മലയാളത്തിലെ ‘-ഉം’ നിലനിർത്തുന്നു.
theological_decisions:
- issue: δουλεία വിവരിക്കുന്ന അവസ്ഥയുടെ സ്വഭാവം
  choice: മരണഭയവുമായി ബന്ധപ്പെട്ട യഥാർഥ അടിമത്തം എന്നു മാത്രം പരിഭാഷയിൽ പറയുന്നു.
  alternative: പിശാചിനോടുള്ള അടിമത്തം; പാപത്തോടുള്ള അടിമത്തം; മർത്ത്യതയുടെ കീഴിലുള്ള അസ്തിത്വഭയം
  rationale: മുൻവാക്യം പിശാചിനെയും മരണത്തിന്റെ അധികാരത്തെയും പരാമർശിക്കുന്നുവെങ്കിലും, ഈ വാക്യം അടിമത്തത്തിന്റെ കൃത്യമായ പ്രമാണത്തെ കൂടുതൽ ചുരുക്കി നിർവചിക്കുന്നില്ല. അതിനാൽ മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വാക്യം മുൻവാക്യവുമായി വ്യാകരണപരമായി തുടർന്നുനിൽക്കുന്നതിനാൽ അവസാനത്തിൽ ‘മോചിപ്പിക്കേണ്ടതിനും’ ഉപയോഗിച്ചു. ‘അടിമത്തം’ എന്നത് രൂപകത്തിന്റെ ശക്തി കുറയ്ക്കാതെ നൽകുന്നു.
