revisions:
- from: മരണഭയംനിമിത്തം ജീവിതകാലം മുഴുവൻ അടിമത്തത്തിന് അധീനരായിരുന്ന എല്ലാവരെയും മോചിപ്പിക്കേണ്ടതിനും.
  to: മരണഭയം നിമിത്തം ജീവിതകാലം മുഴുവൻ അടിമത്തത്തിന് അധീനരായിരുന്ന എല്ലാവരെയും മോചിപ്പിക്കാനും.
