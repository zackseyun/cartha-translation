id: HEB.2.5
reference: Hebrews 2:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οὐ γὰρ ἀγγέλοις ὑπέταξεν τὴν οἰκουμένην τὴν μέλλουσαν, περὶ ἧς λαλοῦμεν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/005.yaml
  text: For he did not subject the world to come to angels[a], about which we are speaking.
translation:
  language: ml
  text: കാരണം, നാം സംസാരിച്ചുകൊണ്ടിരിക്കുന്ന വരാനിരിക്കുന്ന ലോകത്തെ ദൈവം ദൂതന്മാർക്കു കീഴ്പ്പെടുത്തിയിട്ടില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വരാനിരിക്കുന്ന ജനവാസമുള്ള ലോകത്തെ.’
    reason: οἰκουμένη എന്ന പദത്തിന്റെ കൂടുതൽ അക്ഷരാർഥമുള്ള പരിഭാഷ രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: Οὐ γὰρ
  choice: കീഴ്പ്പെടുത്തിയിട്ടില്ലല്ലോ
  rationale: γάρ മുൻവാദത്തോടുള്ള വിശദീകരണബന്ധം സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘-ല്ലോ’ ആ ബന്ധം സ്വാഭാവികമായി മുന്നോട്ടുകൊണ്ടുപോകുന്നു. Οὐ നിഷേധം നിലനിർത്തുന്നു.
- source_word: ἀγγέλοις
  choice: ദൂതന്മാർക്കു
  rationale: എബ്രായലേഖനത്തിന്റെ സമീപസന്ദർഭത്തിൽ മനുഷ്യസന്ദേശവാഹകരല്ല, സ്വർഗീയ ദൂതന്മാരാണ് ഉദ്ദേശ്യം.
- source_word: ὑπέταξεν
  choice: കീഴ്പ്പെടുത്തിയിട്ടില്ല
  rationale: അധികാരത്തിനോ ഭരണത്തിനോ കീഴിൽ ആക്കുക എന്ന ὑποτάσσωയുടെ അർഥം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: τὴν οἰκουμένην
  choice: ലോകത്തെ
  rationale: οἰκουμένηയുടെ ‘വാസമുള്ള ലോകം/ലോകം’ എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ ‘ലോകം’ എന്നു നൽകി; കൂടുതൽ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: τὴν μέλλουσαν
  choice: വരാനിരിക്കുന്ന
  rationale: μέλλουσαν സൂചിപ്പിക്കുന്ന ഭാവികാലസ്വഭാവവും യുഗാന്ത്യാഭിമുഖതയും അമിതവ്യാഖ്യാനമില്ലാതെ നിലനിർത്തുന്നു.
- source_word: περὶ ἧς λαλοῦμεν
  choice: നാം സംസാരിച്ചുകൊണ്ടിരിക്കുന്ന
  rationale: വർത്തമാനകാലത്തിലുള്ള തുടരുന്ന സംവാദത്തെ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുകയും ബന്ധവാക്യം ‘ലോകം’ എന്നതിനോടു വ്യക്തമായി ചേർക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘വരാനിരിക്കുന്ന ലോകം’ എന്നതിന്റെ സൂചിതാർത്ഥം
  choice: ഭാവിയിൽ വരാനിരിക്കുന്ന ലോകം/ലോകക്രമം എന്ന യുഗാന്ത്യാഭിമുഖ അർഥം തുറന്നുവെക്കുന്നു.
  alternative: പൊതുവിലുള്ള വാസമുള്ള ഭൂമി; അല്ലെങ്കിൽ പ്രത്യേകമായി സുവിശേഷയുഗം.
  rationale: τὴν οἰκουμένην τὴν μέλλουσαν സ്വാഭാവികമായി വരാനിരിക്കുന്ന ലോകത്തെ സൂചിപ്പിക്കുന്നു. സങ്കീർത്തനം 8-നെ തുടർന്നുള്ള വ്യാഖ്യാനം ആധിപത്യത്തെക്കുറിച്ചാണെങ്കിലും, ഇവിടെ അതിന്റെ കൃത്യമായ കാലഘട്ടമോ രൂപമോ വിവർത്തനം നിർണ്ണയിക്കുന്നില്ല.
- issue: വാക്യത്തിലെ കർത്താവ്
  choice: മലയാളത്തിലെ വ്യക്തതയ്ക്കായി ‘ദൈവം’ എന്നു വ്യക്തമാക്കി.
  alternative: 'ഗ്രീക്കുപോലെ കർത്താവിനെ പരോക്ഷമായി വിടുക: ‘കീഴ്പ്പെടുത്തിയിട്ടില്ലല്ലോ’.'
  rationale: ഗ്രീക്കിൽ ὑπέταξεν എന്ന ക്രിയയുടെ കർത്താവ് സന്ദർഭത്തിൽനിന്ന് ദൈവമാണെന്ന് മനസ്സിലാകുന്നു. മലയാളത്തിൽ കർത്താവിനെ വ്യക്തമാക്കുന്നത് ആശയക്കുഴപ്പം ഒഴിവാക്കുന്നു; പുതിയ ദൈവശാസ്ത്രപരമായ അവകാശവാദം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ദൂതന്മാർ’, ‘കീഴ്പ്പെടുത്തുക’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തി; അതേസമയം വാക്യക്രമം സാധാരണ വായനക്കാർക്ക് എളുപ്പമാക്കി.
