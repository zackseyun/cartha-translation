  - severity: low
    issue: The assembly footnote gives an alternative for the whole phrase rather than for the anchored noun.
    rationale: Since marker [b] is attached to 'സഭ,' its alternative should correspond directly to ἐκκλησία, such as 'കൂടിവന്ന സമൂഹം.'
  - severity: low
