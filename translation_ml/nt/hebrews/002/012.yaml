id: HEB.2.12
reference: Hebrews 2:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγων· Ἀπαγγελῶ τὸ ὄνομά σου τοῖς ἀδελφοῖς μου, ἐν μέσῳ ἐκκλησίας ὑμνήσω σε·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/012.yaml
  text: saying[a], “I will proclaim your name to my brothers[b]; in the midst of the assembly I will sing praise to you.”
translation:
  language: ml
  text: 'എന്നു പറഞ്ഞ്: “ഞാൻ നിന്റെ നാമം എന്റെ സഹോദരന്മാരോട്[a] പ്രഖ്യാപിക്കും; സഭാമധ്യേ[b] ഞാൻ നിന്നെ സ്തുതിച്ചുപാടും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്റെ സഹോദരന്മാരോടും സഹോദരിമാരോടും.” ഗ്രീക്കിൽ “സഹോദരന്മാർ” എന്നാണ്; എന്നാൽ സന്ദർഭത്തിൽ ഈ കുടുംബബന്ധപദം സഹവിശ്വാസികളായ എല്ലാവരെയും ഉൾക്കൊള്ളാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “കൂടിവന്ന സമൂഹം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: എന്നു പറഞ്ഞുകൊണ്ട്
  rationale: ഉദ്ധരണിയെ പരിചയപ്പെടുത്തുന്ന വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ ബന്ധകസ്വഭാവം നിലനിർത്തുന്നു; മുൻവാക്യത്തോടുള്ള വ്യാകരണബന്ധവും വ്യക്തമാക്കുന്നു.
- source_word: Ἀπαγγελῶ
  choice: പ്രഖ്യാപിക്കും
  rationale: പരസ്യമായി അറിയിക്കുക, പ്രസ്താവിക്കുക എന്ന ക്രിയയുടെ അർത്ഥശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τὸ ὄνομά σου
  choice: നിന്റെ നാമം
  rationale: മൂലപാഠത്തിലെ ‘നാമം’ അതേപടി നിലനിർത്തുന്നു; അതിൽ സ്വഭാവം, കീർത്തി, വെളിപ്പെട്ട വ്യക്തിത്വം തുടങ്ങിയ ആശയങ്ങൾ ഉൾക്കൊള്ളാമെങ്കിലും വിവർത്തനത്തിൽ അവ വിശദീകരിച്ച് ചേർക്കുന്നില്ല.
- source_word: τοῖς ἀδελφοῖς μου
  choice: എന്റെ സഹോദരന്മാരോട്
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചനം കൃത്യമായി നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ വിശ്വാസകുടുംബത്തിലെ സ്ത്രീകളും ഉൾപ്പെടാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἐν μέσῳ
  choice: മധ്യത്തിൽ
  rationale: ഉദ്ധരണിയുടെ ഉയർന്ന കാവ്യഭാവം നിലനിർത്തിക്കൊണ്ട് ‘നടുവിൽ/മധ്യത്തിൽ’ എന്ന സ്ഥാനാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: ἐκκλησίας
  choice: സഭയുടെ
  rationale: ഇവിടെ സ്ഥാപനപരമായ പിൽക്കാല അർത്ഥത്തെക്കാൾ കൂടിവന്ന ജനസമൂഹമാണ് ഉദ്ദേശ്യം; മലയാളത്തിൽ ആരാധനയ്ക്കായി കൂടിയ സമൂഹത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്ന ‘സഭ’ ഉപയോഗിക്കുന്നു, മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ὑμνήσω
  choice: സ്തുതിച്ചു പാടും
  rationale: സ്തുതി ഗാനമായി അർപ്പിക്കുക എന്ന ക്രിയയുടെ സംഗീതപരമായ സൂക്ഷ്മത വ്യക്തവും സ്വാഭാവികവുമായി പകരുന്നു.
- source_word: σε
  choice: നിന്നെ
  rationale: ഗ്രീക്കിലെ നേരിട്ടുള്ള കർമബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἀδελφοῖς എന്ന കുടുംബബന്ധപദത്തിന്റെ പ്രതിനിധാനപരമായ വ്യാപ്തി
  choice: സഹോദരന്മാർ
  alternative: സഹോദരീസഹോദരന്മാർ / സഹോദരങ്ങൾ
  rationale: മൂലത്തിലെ പുല്ലിംഗ ബഹുവചനം പ്രധാനപാഠത്തിൽ നിലനിർത്തുന്നു. എന്നാൽ സന്ദർഭത്തിൽ വിശ്വാസികളുടെ മുഴുവൻ കുടുംബത്തെയും സൂചിപ്പിക്കാമെന്ന ഉൾക്കൊള്ളുന്ന സാധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
- issue: പഴയനിയമ ഉദ്ധരണിയിലെ ἐκκλησία
  choice: സഭ
  alternative: കൂടിവന്ന സമൂഹം / ജനസമൂഹം
  rationale: സങ്കീർത്തനം 22:22-ലെ കൂടിവന്ന ദൈവജനത്തെയാണ് പദം സൂചിപ്പിക്കുന്നത്. ‘സഭ’ മലയാളത്തിൽ ഈ കൂട്ടായ അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു; അതിനെ നിർബന്ധമായി ഒരു പിൽക്കാല സ്ഥാപനമായി വ്യാഖ്യാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാഹിത്യഭാഷയാണ് ഉപയോഗിച്ചിരിക്കുന്നത്. സങ്കീർത്തന ഉദ്ധരണിയുടെ കാവ്യഗൗരവം നിലനിർത്താൻ ‘നാമം,’ ‘പ്രഖ്യാപിക്കും,’ ‘മധ്യത്തിൽ,’ ‘സ്തുതിച്ചു പാടും’ എന്നീ പദപ്രയോഗങ്ങൾ തിരഞ്ഞെടുത്തു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങളോടുതന്നെ ചേർത്തിരിക്കുന്നു.
