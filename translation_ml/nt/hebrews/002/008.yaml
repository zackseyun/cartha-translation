  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πάντα ὑπέταξας ὑποκάτω τῶν ποδῶν αὐτοῦ· ἐν ⸂τῷ γὰρ⸃ ⸀ὑποτάξαι τὰ πάντα οὐδὲν ἀφῆκεν αὐτῷ ἀνυπότακτον. νῦν δὲ οὔπω ὁρῶμεν αὐτῷ τὰ πάντα ὑποτεταγμένα·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/008.yaml
  text: You subjected all things under his feet.” For in subjecting all things to him[a], he left nothing not subjected to him[b]. But now we do not yet see all things subjected to him.
translation:
  language: ml
  text: “അങ്ങ് സകലവും അവന്റെ[a] കാൽക്കീഴിലാക്കി.” അവന് സകലവും അധീനമാക്കിയതിൽ[b], അവന് അധീനമാകാതെ ഒന്നും അവൻ വിട്ടുകളഞ്ഞില്ല. എന്നാൽ ഇപ്പോൾ സകലവും അവന് അധീനമായിരിക്കുന്നതായി നാം ഇനിയും കാണുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവന്റെ’, ‘അവന്’ എന്നീ സർവനാമങ്ങൾ സങ്കീർത്തനം 8-നെ പ്രതിധ്വനിപ്പിക്കുന്നു. സങ്കീർത്തനത്തിന്റെ ആദിമസന്ദർഭത്തിൽ അവ മനുഷ്യവർഗത്തെ സൂചിപ്പിക്കാം; എബ്രായർക്കുള്ള ലേഖനത്തിലെ പ്രയോഗത്തിൽ അവ യേശുവിലേക്കും സൂചിപ്പിക്കാം.
    reason: cross_reference
  - marker: b
    text: 'അഥവാ: ‘അവന് സകലവും അധീനമാക്കിയപ്പോൾ.’ ഗ്രീക്ക് ഘടന കാലസൂചകമായും വിവർത്തനം ചെയ്യാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: സകലവും
  rationale: നപുംസകലിംഗ ബഹുവചനത്തിന്റെ സമഗ്രവ്യാപ്തി നിലനിർത്തുന്നു; ഈ വാക്യത്തിലെ ആവർത്തനവും സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: ὑπέταξας
  choice: കാൽക്കീഴിലാക്കി
  rationale: സങ്കീർത്തനം 8-ലെ ആധിപത്യരൂപകം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; രണ്ടാംപുരുഷ കർത്താവിനെ ‘അങ്ങ്’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: ὑποκάτω τῶν ποδῶν αὐτοῦ
  choice: അവന്റെ കാൽക്കീഴിൽ
  rationale: ആധിപത്യത്തെയും അധീനതയെയും സൂചിപ്പിക്കുന്ന തിരുവെഴുത്തിലെ ദൃശ്യരൂപം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: ἐν τῷ ... ὑποτάξαι
  choice: അധീനമാക്കിയതിൽ
  rationale: പ്രവൃത്തിയുടെ സാഹചര്യത്തെയോ അതിൽ അടങ്ങിയ അർഥത്തെയോ സൂചിപ്പിക്കാവുന്ന ഗ്രീക്ക് ഘടനയുടെ തുറന്ന സ്വഭാവം കഴിയുന്നത്ര നിലനിർത്തുന്നു; കാലസൂചകമായ വിവർത്തനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: οὐδὲν ἀφῆκεν ... ἀνυπότακτον
  choice: അവന് അധീനമാകാതെ ഒന്നും അവൻ ശേഷിപ്പിച്ചില്ല
  rationale: സമഗ്രതയുടെ അവകാശവാദവും ὑποτάσσω പദകുടുംബത്തിന്റെ ആവർത്തനവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: νῦν δὲ οὔπω ὁρῶμεν
  choice: എന്നാൽ ഇപ്പോൾ ... നാം ഇനിയും കാണുന്നില്ല
  rationale: പ്രഖ്യാപിതമായ അധീനതയും ഇപ്പോഴത്തെ അനുഭവത്തിൽ അതിന്റെ പൂർണത കാണാത്തതും തമ്മിലുള്ള വൈരുധ്യം വ്യക്തമാക്കുന്നു.
- source_word: ὑποτεταγμένα
  choice: അധീനമായിരിക്കുന്നതായി
  rationale: പൂർണ ഭൂതകാല കർമണി പങ്കാളിയുടെ ഫലാവസ്ഥ മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: αὐτοῦ / αὐτῷ എന്ന സർവനാമങ്ങളുടെ സൂചിതവ്യക്തി
  choice: മൂലത്തിലെപ്പോലെ ‘അവന്റെ/അവന്’ എന്ന സർവനാമങ്ങൾ നിലനിർത്തി; ആരെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കിയില്ല.
  alternative: സങ്കീർത്തനം 8-ന്റെ ആദിമസന്ദർഭത്തിൽ മനുഷ്യവർഗം; എബ്രായലേഖനത്തിലെ ക്രിസ്തുകേന്ദ്ര പ്രയോഗത്തിൽ യേശു.
  rationale: സങ്കീർത്തനത്തിന്റെ മനുഷ്യനെക്കുറിച്ചുള്ള പ്രസ്താവനയും എബ്രായലേഖനം അതിനെ യേശുവിൽ ഉച്ചസ്ഥായിയിലെത്തിക്കുന്ന രീതിയും തമ്മിലുള്ള ഉദ്ദേശ്യപൂർവമായ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. സങ്കീർത്തന ഉദ്ധരണിയുടെ ഗൗരവം നിലനിർത്താൻ ‘അങ്ങ്’ ഉപയോഗിച്ചു. ὑποτάσσω പദകുടുംബത്തിന്റെ ആവർത്തനം ‘അധീനമാക്കുക/അധീനമാകുക’ വഴി പരമാവധി സംരക്ഷിച്ചു.
