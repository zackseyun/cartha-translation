id: HEB.2.9
reference: Hebrews 2:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τὸν δὲ βραχύ τι παρ’ ἀγγέλους ἠλαττωμένον βλέπομεν Ἰησοῦν διὰ τὸ πάθημα τοῦ θανάτου δόξῃ καὶ τιμῇ ἐστεφανωμένον, ὅπως ⸀χωρὶς θεοῦ ὑπὲρ παντὸς γεύσηται θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/009.yaml
  text: But we see Jesus[a], who was made lower than the angels for a little while, crowned with glory and honor because of the suffering of death, so that by the grace of God he might taste death for everyone.
translation:
  language: ml
  text: 'എന്നാൽ, അല്പകാലത്തേക്ക് മാലാഖമാരെക്കാൾ താഴ്ത്തപ്പെട്ട യേശുവിനെ നാം കാണുന്നു: മരണത്തിന്റെ പീഡനം അനുഭവിച്ചതിനാൽ മഹത്ത്വവും ബഹുമാനവുംകൊണ്ടു കിരീടമണിയിക്കപ്പെട്ടവനായ അവൻ, അങ്ങനെ ദൈവത്തെ കൂടാതെ,[a] എല്ലാവർക്കുംവേണ്ടി മരണം രുചിക്കേണ്ടതിന്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികൾ ‘ദൈവത്തെ കൂടാതെ’ എന്നതിനുപകരം ‘ദൈവകൃപയാൽ’ എന്നു വായിക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: βραχύ τι
  choice: അല്പകാലത്തേക്ക്
  rationale: സങ്കീർത്തനം 8-ന്റെ പ്രതിധ്വനിയും സന്ദർഭവും കണക്കിലെടുത്ത്, അളവിനേക്കാൾ പരിമിതമായ കാലയളവാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നതെന്ന് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: παρ’ ἀγγέλους
  choice: ദൂതന്മാരെക്കാൾ
  rationale: ἐλαττόω എന്ന താരതമ്യപ്രയോഗത്തിനു ശേഷം παρά + accusative നൽകുന്ന ‘ദൂതന്മാരെ അപേക്ഷിച്ച്’ എന്ന അർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: ἠλαττωμένον
  choice: താഴ്ത്തപ്പെട്ട
  rationale: പൂർണകാല നിഷ്ക്രിയ കൃദന്തരൂപത്തിന്റെ താരതമ്യവും നിഷ്ക്രിയഭാവവും നിലനിർത്തുന്നു; വെറും മാനസിക അപമാനമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: διὰ τὸ πάθημα τοῦ θανάτου
  choice: മരണത്തിന്റെ കഷ്ടം അനുഭവിച്ചതിനാൽ
  rationale: Accusative-നോടുകൂടിയ διά ഇവിടെ കാരണത്തെ സൂചിപ്പിക്കുന്നതായി എടുത്തു; മലയാളത്തിൽ സ്വാഭാവികമാക്കുമ്പോഴും മരണസഹനവും മഹത്ത്വകിരീടവും തമ്മിലുള്ള ബന്ധം സംരക്ഷിക്കുന്നു.
- source_word: δόξῃ καὶ τιμῇ ἐστεφανωμένον
  choice: മഹത്ത്വവും ബഹുമാനവും കിരീടമായി അണിഞ്ഞിരിക്കുന്നതായി
  rationale: στεφανόω എന്നതിലെ കിരീടരൂപകം നിലനിർത്തുകയും perfect participle സൂചിപ്പിക്കുന്ന പൂർത്തിയായതും തുടരുന്നതുമായ അവസ്ഥ പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ὅπως
  choice: അങ്ങനെ ... വേണ്ടതിന്
  rationale: ഉദ്ദേശ്യം അല്ലെങ്കിൽ ഫലം സൂചിപ്പിക്കുന്ന ബന്ധം അനാവശ്യമായി ഒന്നിലേക്കു മാത്രം ചുരുക്കാതെ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: χωρὶς θεοῦ
  choice: ദൈവത്തെ കൂടാതെ
  rationale: നൽകിയിരിക്കുന്ന SBLGNT മൂലപാഠത്തെ നേരിട്ട് പിന്തുടരുന്നു. കൂടുതൽ വ്യാപകമായി സ്വീകരിക്കപ്പെടുന്ന χάριτι θεοῦ എന്ന പാഠഭേദം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ὑπὲρ παντός
  choice: എല്ലാവർക്കുംവേണ്ടി
  rationale: ὑπέρ എന്നതിന്റെ പ്രതിനിധിത്വപരമായ ‘വേണ്ടി’ എന്ന അർഥവും παντός എന്ന ഏകവചനത്തിന്റെ വിതരണാത്മക വ്യക്തിപരമായ അർഥവും സന്ദർഭാനുസൃതമായി നൽകുന്നു.
- source_word: γεύσηται θανάτου
  choice: മരണം രുചിക്കേണ്ടതിന്
  rationale: ‘മരണം രുചിക്കുക’ എന്ന ഗ്രീക്ക് രൂപകം നിലനിർത്തുന്നു; മലയാളത്തിലും ഇത് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള പ്രയോഗമാണ്.
theological_decisions:
- issue: ഉദ്ദേശ്യവാക്യത്തിലെ പാഠഭേദം
  choice: പ്രധാനപാഠത്തിൽ ‘ദൈവത്തെ കൂടാതെ’
  alternative: ‘ദൈവകൃപയാൽ’
  rationale: നൽകിയിരിക്കുന്ന SBLGNT പാഠം χωρὶς θεοῦ എന്നാണ്; അതിനാൽ മൂലപാഠാധിഷ്ഠിത വിവർത്തനം പ്രധാനപാഠത്തിൽ അതിനെ പിന്തുടരുന്നു. പുരാതനവും വ്യാപകമായി സ്വീകരിക്കപ്പെട്ടതുമായ χάριτι θεοῦ എന്ന പാഠഭേദം ദൈവശാസ്ത്രപരമായ സംഘർഷം മറച്ചുവയ്ക്കാതെ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ὑπὲρ παντός എന്നതിലെ παντός-ന്റെ പരിധി
  choice: എല്ലാവർക്കുംവേണ്ടി
  alternative: എല്ലാറ്റിനുംവേണ്ടി
  rationale: സന്ദർഭത്തിൽ ക്രിസ്തുവിന്റെ മരണം മനുഷ്യർക്കുവേണ്ടിയെന്ന വ്യക്തിപരവും വിതരണാത്മകവുമായ വായന സ്വാഭാവികമാണ്; എങ്കിലും ഗ്രീക്ക് രൂപത്തിന് നപുംസകാർഥമായ ‘എല്ലാറ്റിനും’ എന്ന സാധ്യത വ്യാകരണപരമായി ഉണ്ടായേക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. വാക്യത്തിന്റെ സങ്കീർണത വായനാസൗകര്യത്തിനായി വിരാമചിഹ്നങ്ങളാൽ ക്രമപ്പെടുത്തി; ‘കിരീടം’, ‘മരണം രുചിക്കുക’ എന്നീ മുഖ്യ രൂപകങ്ങൾ നിലനിർത്തി. പ്രധാനപാഠം നൽകിയ ഗ്രീക്ക് പതിപ്പിനെ പിന്തുടരുന്നു; ഇംഗ്ലീഷ് ഉപദേശപാളിയിലെ വ്യത്യസ്ത പാഠം അടിക്കുറിപ്പിലാക്കി.
