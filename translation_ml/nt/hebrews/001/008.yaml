id: HEB.1.8
reference: Hebrews 1:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πρὸς δὲ τὸν υἱόν· Ὁ θρόνος σου ὁ θεὸς εἰς τὸν αἰῶνα τοῦ αἰῶνος, ⸂καὶ ἡ ῥάβδος τῆς εὐθύτητος⸃ ῥάβδος τῆς βασιλείας ⸀σου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/008.yaml
  text: But of the Son he says[a], “Your throne, O God, is forever and ever[b], and the scepter of uprightness is the scepter of your kingdom.”
translation:
  language: ml
  text: 'എന്നാൽ പുത്രനെക്കുറിച്ചാകട്ടെ, അവൻ പറയുന്നു: “ദൈവമേ,[a] അങ്ങയുടെ സിംഹാസനം എന്നെന്നേക്കും നിലനിൽക്കുന്നു; നേർമയുടെ[b] ചെങ്കോലാണ് അങ്ങയുടെ രാജ്യത്തിന്റെ ചെങ്കോൽ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'സാധ്യത കുറവുള്ള മറ്റൊരു വിവർത്തനം: “ദൈവം എന്നെന്നേക്കും അങ്ങയുടെ സിംഹാസനമാണ്.” ഗ്രീക്ക് വാക്യഘടനയെക്കുറിച്ച് വ്യത്യസ്താഭിപ്രായങ്ങളുണ്ടെങ്കിലും, “ദൈവമേ, അങ്ങയുടെ സിംഹാസനം” എന്ന നേരിട്ടുള്ള അഭിസംബോധനയാണ് സന്ദർഭത്തിനും ഉദ്ധരണിയുടെ പ്രഭാവത്തിനും കൂടുതൽ യോജിക്കുന്നത്.'
    reason: alternative_reading
  - marker: b
    text: അഥവാ “നീതിയുടെ.” ഗ്രീക്ക് പദത്തിന് നേരായ സ്വഭാവം അഥവാ ധാർമികമായ ശരിതനം എന്ന അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς δὲ τὸν υἱόν
  choice: എന്നാൽ പുത്രനോട് അവൻ പറയുന്നു
  rationale: πρός + accusative ഇവിടെ പുത്രനോടുള്ള അഭിസംബോധനയായി സ്വാഭാവികമായി ഗ്രഹിക്കാം; ഗ്രീക്കിൽ സൂചിതമായിരിക്കുന്ന ‘പറയുന്നു’ എന്ന ക്രിയ മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ചേർത്തു.
- source_word: υἱόν
  choice: പുത്രൻ
  rationale: നിർദ്ദിഷ്ടമായ ക്രിസ്തുശാസ്ത്രപരമായ സ്ഥാനപ്പേരെന്ന നിലയിൽ ‘പുത്രൻ’ ഉപയോഗിച്ചു.
- source_word: Ὁ θρόνος σου ὁ θεὸς
  choice: ദൈവമേ, അങ്ങയുടെ സിംഹാസനം
  rationale: ὁ θεός-നെ നേരിട്ടുള്ള അഭിസംബോധനയായി വായിക്കുന്നതാണ് സങ്കീർത്തന ഉദ്ധരണിയുടെ പ്രഭാവത്തിനും എബ്രായർ 1-ലെ സന്ദർഭത്തിനും ഏറ്റവും യോജിച്ചത്. വാക്യഘടനാപരമായി സാധ്യമായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: εἰς τὸν αἰῶνα τοῦ αἰῶνος
  choice: എന്നെന്നേക്കും നിലനിൽക്കുന്നു
  rationale: അവസാനമില്ലാത്ത ദൈർഘ്യം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാള തുല്യം; മലയാളവാക്യം പൂർണമാക്കാൻ ‘നിലനിൽക്കുന്നു’ ചേർത്തു.
- source_word: ῥάβδος
  choice: ചെങ്കോൽ
  rationale: രാജകീയ അധികാരത്തിന്റെ അടയാളമായ ദണ്ഡിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ചെങ്കോൽ’ ഏറ്റവും യോജിച്ച മലയാളപദമാണ്.
- source_word: τῆς εὐθύτητος
  choice: നേർമയുടെ
  rationale: εὐθύτης എന്നത് നേരായ സ്വഭാവം, സത്യസന്ധത, ധാർമിക നേര് എന്നിവ സൂചിപ്പിക്കുന്നു; ‘നേർമ’ ഈ പ്രാഥമിക അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ῥάβδος τῆς βασιλείας σου
  choice: അങ്ങയുടെ രാജ്യത്തിന്റെ ചെങ്കോൽ
  rationale: βασιλεία-യുടെ രാജ്യം/ഭരണാധികാരം എന്ന രാജകീയ ആശയം വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ὁ θεός എന്നത് പുത്രനെ ‘ദൈവമേ’ എന്നു നേരിട്ട് അഭിസംബോധന ചെയ്യുന്നതാണോ, അതോ ‘ദൈവം അങ്ങയുടെ സിംഹാസനമാണ്’ എന്നു വിധേയമായി വായിക്കണമോ എന്നത്.
  choice: 'നേരിട്ടുള്ള അഭിസംബോധന: “ദൈവമേ, അങ്ങയുടെ സിംഹാസനം…”'
  alternative: “ദൈവം അങ്ങയുടെ സിംഹാസനമാണ്…”
  rationale: എബ്രായർ 1-ലെ പുത്രന്റെ അതുല്യസ്ഥാനത്തെ ചൂണ്ടിക്കാണിക്കുന്ന ഉദ്ധരണിപരമ്പരയ്ക്കും സങ്കീർത്തനം 45:6-ന്റെ ഗ്രീക്ക് രൂപത്തിന്റെ സാധാരണ വായനയ്ക്കും നേരിട്ടുള്ള അഭിസംബോധന കൂടുതൽ യോജിക്കുന്നു. എങ്കിലും യഥാർഥമായ വാക്യഘടനാ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ദൈവത്തോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയിൽ ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു. രാജകീയ ദൃശ്യഭാഷ നിലനിർത്താൻ ‘സിംഹാസനം’, ‘ചെങ്കോൽ’, ‘രാജ്യം’ എന്നീ സുപരിചിത പദങ്ങൾ ഉപയോഗിച്ചു.
