source:
  edition: SBLGNT
  text: ἠγάπησας δικαιοσύνην καὶ ἐμίσησας ἀνομίαν· διὰ τοῦτο ἔχρισέν σε ὁ θεός, ὁ θεός σου, ἔλαιον ἀγαλλιάσεως παρὰ τοὺς μετόχους σου·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/009.yaml
  text: You have loved righteousness and hated lawlessness; therefore God[a], your God, has anointed you with the oil of gladness beyond your companions.
translation:
  language: ml
  text: നീ നീതിയെ[a] സ്നേഹിച്ചു; നിയമലംഘനത്തെ വെറുത്തു. അതുകൊണ്ട് ദൈവം, നിന്റെ ദൈവം, നിന്റെ കൂട്ടാളികളേക്കാൾ അധികമായി ആനന്ദത്തിന്റെ തൈലംകൊണ്ട് നിന്നെ അഭിഷേകം ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ന്യായം.’ ഗ്രീക്ക് പദത്തിന് ധാർമിക ശരിതനിമയെയോ ന്യായപരതയെയോ സൂചിപ്പിക്കാം; ഇവിടെ മുഖ്യപാഠത്തിൽ ‘നീതി’ എന്നാണ് നൽകിയിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγάπησας
  choice: സ്നേഹിക്കുകയും ... ചെയ്തു
  rationale: ഉദ്ധരണിയിലെ എയോറിസ്റ്റ് ക്രിയയെ സ്വാഭാവികമായ മലയാള ഭൂതകാലത്തിൽ നൽകി; തുടർന്നുള്ള സമാന്തര ക്രിയയുമായി ബന്ധിപ്പിക്കാൻ ‘-ഉകയും’ ഘടന ഉപയോഗിച്ചു.
- source_word: δικαιοσύνην
  choice: നീതിയെ
  rationale: ധാർമികമായ ശരിതനിമയും ന്യായവും ഉൾക്കൊള്ളാൻ കഴിയുന്ന, ആധുനിക മലയാളത്തിൽ സുതാര്യമായ പദം; ‘ന്യായത്തെ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: ἐμίσησας
  choice: വെറുക്കുകയും ചെയ്തു
  rationale: ‘സ്നേഹിച്ചു’ എന്നതിനോടുള്ള ശക്തമായ ധാർമിക വൈരുധ്യം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἀνομίαν
  choice: നിയമലംഘനത്തെ
  rationale: നിയമത്തെ അവഗണിക്കുകയോ ലംഘിക്കുകയോ ചെയ്യുന്ന അർഥം വ്യക്തമായി നൽകുന്നു; പൊതുവായ ‘ദുഷ്ടത’ എന്നതിനെക്കാൾ ഗ്രീക്ക് പദത്തിന്റെ നിയമസംബന്ധിയായ ഘടകം സംരക്ഷിക്കുന്നു.
- source_word: διὰ τοῦτο
  choice: അതുകൊണ്ട്
  rationale: മുൻപറഞ്ഞ ധാർമിക നിലപാടിനും അഭിഷേകത്തിനുമിടയിലെ കാരണപരമായ ബന്ധം ചുരുക്കമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: ἔχρισέν
  choice: അഭിഷേകം ചെയ്തു
  rationale: രാജകീയവും മശീഹാസംബന്ധിയായതുമായ അഭിഷേകചിത്രം നിലനിർത്തുന്ന സ്ഥാപിതവും മനസ്സിലാക്കാവുന്നതുമായ പ്രയോഗം.
- source_word: ὁ θεός, ὁ θεός σου
  choice: ദൈവം, നിന്റെ ദൈവം
  rationale: ആവർത്തനവും ബന്ധസൂചനയും വ്യാഖ്യാനപരമായ വിപുലീകരണമില്ലാതെ അതേപടി സംരക്ഷിക്കുന്നു.
- source_word: ἔλαιον ἀγαλλιάσεως
  choice: ആനന്ദത്തിന്റെ തൈലം
  rationale: ആഘോഷവും സന്തോഷവും സൂചിപ്പിക്കുന്ന തിരുവെഴുത്തുപരമായ അഭിഷേകബിംബം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: παρὰ τοὺς μετόχους σου
  choice: നിന്റെ കൂട്ടാളികളേക്കാൾ അധികമായി
  rationale: παράയുടെ താരതമ്യാർഥവും μετόχοι എന്നതിന്റെ പങ്കാളിത്തമോ സഹവർത്തിത്വമോ സൂചിപ്പിക്കുന്ന ബന്ധാർഥവും വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: δικαιοσύνη എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: നീതി
  alternative: ന്യായം
  rationale: സന്ദർഭത്തിലെ ധാർമിക ശരിതനിമയ്ക്ക് ‘നീതി’ യോജിക്കുന്നു; ന്യായനിർവഹണം എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
- issue: പുത്രനെ സംബന്ധിച്ച ‘ദൈവം, നിന്റെ ദൈവം’ എന്ന പ്രയോഗത്തിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ സംഘർഷം
  choice: പ്രയോഗം വിശദീകരണമില്ലാതെ നേരിട്ട് നിലനിർത്തി
  alternative: ത്രിത്വബന്ധം വിശദീകരിക്കുന്ന വ്യാഖ്യാനപരമായ പുനരാഖ്യാനം
  rationale: വാക്യം പുത്രനെ ഉന്നതമായി അവതരിപ്പിക്കുമ്പോഴും ‘നിന്റെ ദൈവം’ എന്നു പറയുന്നു; ഈ യഥാർഥ ദൈവശാസ്ത്രപരമായ സംഘർഷം മയപ്പെടുത്താതെയും അധിക സിദ്ധാന്തവിവരണം ചേർക്കാതെയും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായിക്കാൻ എളുപ്പവുമായ ശൈലി. സങ്കീർത്തനോദ്ധരണിയുടെ ഗൗരവം നിലനിർത്താൻ ‘അഭിഷേകം’, ‘ആനന്ദത്തിന്റെ തൈലം’ എന്നീ തിരുവെഴുത്തുപരമായ പ്രയോഗങ്ങൾ സൂക്ഷിച്ചു; അപരിചിതമായ അതിസംസ്കൃത പദങ്ങൾ ഒഴിവാക്കി.
