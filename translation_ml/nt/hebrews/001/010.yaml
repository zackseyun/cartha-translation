source:
  edition: SBLGNT
  text: καί· Σὺ κατ’ ἀρχάς, κύριε, τὴν γῆν ἐθεμελίωσας, καὶ ἔργα τῶν χειρῶν σού εἰσιν οἱ οὐρανοί·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/010.yaml
  text: And[a], “You, Lord, in the beginning laid the foundation of the earth, and the heavens are the works of your hands.”
translation:
  language: ml
  text: 'കൂടാതെ: “കർത്താവേ, ആരംഭത്തിൽ[a] ഭൂമിക്ക് അടിത്തറയിട്ടത് അങ്ങാണ്; ആകാശങ്ങൾ അങ്ങയുടെ കൈകളുടെ പ്രവൃത്തികളാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ആദിയിൽ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καί
  choice: കൂടാതെ
  rationale: ഉദ്ധരണിപരമ്പരയിൽ മറ്റൊരു ഉദ്ധരണി ചേർക്കുന്നതാണെന്ന് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; വെറും ‘ഉം’ എന്നതിനെക്കാൾ മലയാളത്തിൽ വ്യക്തമാണ്.
- source_word: Σὺ
  choice: അങ്ങാണ്
  rationale: ഗ്രീക്കിലെ പ്രകടമായ സർവനാമത്തിന്റെ ഊന്നൽ നിലനിർത്തുകയും കർത്താവിനോടുള്ള ആദരപൂർവമായ നേരിട്ടുള്ള അഭിസംബോധന മലയാളത്തിൽ സ്വാഭാവികമാക്കുകയും ചെയ്യുന്നു.
- source_word: κατ’ ἀρχάς
  choice: ആരംഭത്തിൽ
  rationale: സൃഷ്ടിയുടെ തുടക്കത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രയോഗം; ‘ആദിയിൽ’ എന്ന പരമ്പരാഗത സാധ്യതയെക്കാൾ സാധാരണ വായനക്കാർക്ക് നേരിട്ട് മനസ്സിലാകും.
- source_word: κύριε
  choice: കർത്താവേ
  rationale: κύριος എന്നതിന്റെ സംബോധനരൂപവും നേരിട്ടുള്ള അഭിസംബോധനയും നിലനിർത്തുന്നു.
- source_word: τὴν γῆν
  choice: ഭൂമിക്ക്
  rationale: ആകാശങ്ങളോടു ചേർന്ന സൃഷ്ടിസന്ദർഭത്തിൽ γῆ ഒരു പ്രത്യേക ദേശമല്ല, ഭൂമിയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἐθεμελίωσας
  choice: അടിത്തറയിട്ടത്
  rationale: θεμελιόω എന്ന ക്രിയയിലെ നിർമ്മാണരൂപകം വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: ἔργα τῶν χειρῶν σού
  choice: അങ്ങയുടെ കൈകളുടെ പ്രവൃത്തികൾ
  rationale: മൂലത്തിലെ മാനവരൂപകാത്മകമായ ‘കൈകൾ’ എന്ന ദൃശ്യം ലഘൂകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: οἱ οὐρανοί
  choice: ആകാശങ്ങൾ
  rationale: ഗ്രീക്കിലെ ബഹുവചനം സംരക്ഷിക്കുകയും ഭൂമിയോടുള്ള സൃഷ്ടിസമാന്തര്യം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: സങ്കീർത്തനം 102-ലെ ‘കർത്താവ്’ എന്ന അഭിസംബോധന എബ്രായർ 1-ൽ പുത്രനോടു പ്രയോഗിക്കുന്നത്
  choice: ‘കർത്താവേ’ എന്ന നേരിട്ടുള്ള അഭിസംബോധന യാതൊരു ലഘൂകരണവും കൂടാതെ നിലനിർത്തി.
  alternative: ഉദ്ധരണിയുടെ ക്രിസ്തുവിനെ സംബന്ധിച്ച ശക്തി കുറയ്ക്കുന്ന വിധത്തിൽ കൂടുതൽ നിഷ്പക്ഷമായി പരിഭാഷപ്പെടുത്തുക.
  rationale: ഗ്രീക്ക് പാഠത്തിൽ κύριε വ്യക്തമായ സംബോധനയായി ഉണ്ട്. എബ്രായലേഖകന്റെ പ്രയോഗം വിശദീകരിച്ച് കൂട്ടിച്ചേർക്കാതെയും മയപ്പെടുത്താതെയും പരിഭാഷ സംരക്ഷിക്കണം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വായനാസൗകര്യവും ചേർത്തിരിക്കുന്നു. ദൈവത്തോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയിൽ ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു; സങ്കീർത്തനോദ്ധരണിയുടെ കാവ്യചിത്രങ്ങളും ഗ്രീക്കിലെ ഊന്നലും സംരക്ഷിച്ചു.
