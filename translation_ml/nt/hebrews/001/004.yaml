- from: അവൻ ദൂതന്മാരെക്കാൾ എത്രത്തോളം ഉന്നതനായിത്തീർന്നുവോ,[a] അത്രത്തോളം അവരുടേതിനെക്കാൾ ശ്രേഷ്ഠമായ നാമം[b] അവകാശമായി പ്രാപിച്ചിരിക്കുന്നു.
  to: അവൻ ദൂതന്മാരെക്കാൾ എത്രത്തോളം ഉന്നതനായിത്തീർന്നുവോ,[a] അത്രത്തോളം അവരുടേതിനെക്കാൾ ശ്രേഷ്ഠമായ നാമം[b] അവകാശമായി പ്രാപിച്ചിരിക്കുന്നു.
  rationale: മുഖ്യവിവർത്തനത്തിൽ സുരക്ഷിതമായ അർഥപരമായ തിരുത്തൽ ആവശ്യമില്ല. എന്നാൽ അടിക്കുറിപ്പ് a-യെ പൂർണമായ ബദൽവിവർത്തനമാക്കി പുനഃസ്ഥാപിക്കുകയും, അടിക്കുറിപ്പ് b-യിലെ ആവർത്തനം നീക്കി അതിന്റെ സന്ദർഭസൂചന കൂടുതൽ സ്വാഭാവികമാക്കുകയും ചെയ്തു. ‘നാമം’ മുഖ്യപാഠത്തിൽതന്നെ നിലനിർത്തിയതിനാൽ, തുടർന്നുള്ള വാക്യങ്ങളിലൂടെയുള്ള തിരിച്ചറിയൽ മുൻകൂട്ടി വ്യാഖ്യാനിക്കുന്നില്ല.
