id: HEB.1.4
reference: Hebrews 1:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοσούτῳ κρείττων γενόμενος τῶν ἀγγέλων ὅσῳ διαφορώτερον παρ’ αὐτοὺς κεκληρονόμηκεν ὄνομα.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/004.yaml
  text: having become as much superior to the angels as the name he has inherited is more excellent than theirs.
translation:
  language: ml
  text: അവൻ ദൂതന്മാരെക്കാൾ എത്രത്തോളം ഉന്നതനായിത്തീർന്നുവോ,[a] അത്രത്തോളം അവരുടേതിനെക്കാൾ ശ്രേഷ്ഠമായ നാമം[b] അവകാശമായി പ്രാപിച്ചിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദൂതന്മാരെക്കാൾ എത്രത്തോളം മെച്ചപ്പെട്ടവനായിത്തീർന്നുവോ, അത്രത്തോളം അവരുടേതിനെക്കാൾ വിശിഷ്ടമായ നാമം അവകാശമായി പ്രാപിച്ചിരിക്കുന്നു.’
    reason: lexical_alternative
  - marker: b
    text: തുടർന്നുള്ള സന്ദർഭത്തിൽ ഈ ‘നാമം’ ‘പുത്രൻ’ എന്ന പുത്രപദവിയെയും സ്ഥാനത്തെയും സൂചിപ്പിക്കുന്നതായി വ്യക്തമാകുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: τοσούτῳ ... ὅσῳ
  choice: എത്രത്തോളം ... അത്രത്തോളം
  rationale: ആനുപാതികമായ താരതമ്യം വ്യക്തമാക്കുന്ന ഗ്രീക്ക് സഹബന്ധഘടന മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: κρείττων
  choice: ഉന്നതൻ
  rationale: ഇവിടെ ധാർമികമായ ‘നല്ലത്’ എന്നതിലുപരി ദൂതന്മാരോടുള്ള പദവി-ശ്രേഷ്ഠതയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
- source_word: γενόμενος
  choice: ആയിത്തീർന്നുവോ
  rationale: ഗ്രീക്കിലെ ‘ആയിത്തീരുക’ എന്ന ചലനാത്മക അർഥം നേരിട്ട് നിലനിർത്തുന്നു; ‘സൃഷ്ടിക്കപ്പെട്ടു’ എന്ന ആശയം അനാവശ്യമായി വരുത്തുന്നില്ല.
- source_word: τῶν ἀγγέλων
  choice: ദൂതന്മാരെക്കാൾ
  rationale: താരതമ്യത്തിനു ശേഷമുള്ള ഗ്രീക്ക് ഷഷ്ഠിവിഭക്തിയുടെ അർഥം സ്വാഭാവിക മലയാള താരതമ്യരൂപത്തിൽ നൽകുന്നു.
- source_word: διαφορώτερον
  choice: ശ്രേഷ്ഠമായ
  rationale: നാമത്തിന്റെ കൂടുതൽ വിശിഷ്ടമായ മഹത്വവും മേന്മയും സന്ദർഭോചിതമായി അറിയിക്കുന്നു.
- source_word: παρ’ αὐτοὺς
  choice: അവരുടേതിനെക്കാൾ
  rationale: താരതമ്യം ദൂതന്മാരുടെ നാമത്തോടോ നാമപദവിയോടോ ആണെന്ന സൂചിതമായ ഉടമസ്ഥബന്ധം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: κεκληρονόμηκεν
  choice: അവകാശമായി പ്രാപിച്ചിരിക്കുന്നു
  rationale: പൂർണകാലരൂപത്തിലെ, ഭൂതകാലത്തിൽ ലഭിച്ച് ഇപ്പോഴും നിലനിൽക്കുന്ന ഫലാവസ്ഥ സംരക്ഷിക്കുന്നു.
- source_word: ὄνομα
  choice: നാമം
  rationale: തുടർന്നുള്ള വാക്യങ്ങൾ അർഥം വ്യക്തമാക്കാൻ ഇടവരുത്തിക്കൊണ്ട് മൂലപദത്തിന്റെ സാഹിത്യപരവും പദവി സൂചിപ്പിക്കുന്നതുമായ വ്യാപ്തി നിലനിർത്തുന്നു.
theological_decisions:
- issue: γενόμενος എന്ന പദവും പുത്രന്റെ നിലയും
  choice: ‘ഉന്നതനായിത്തീർന്നുവോ’ എന്ന് സുതാര്യമായി പരിഭാഷപ്പെടുത്തി, ഉയർത്തപ്പെട്ട നിലയെക്കുറിച്ചുള്ള വാക്യത്തിന്റെ ചലനാത്മക ഭാഷ നിലനിർത്തി.
  alternative: ‘ഉന്നതനായി സൃഷ്ടിക്കപ്പെട്ടു’ എന്നോ മാറ്റമൊന്നും സൂചിപ്പിക്കാതെ ‘ഉന്നതനാണ്’ എന്നോ പരിഭാഷപ്പെടുത്തുക.
  rationale: ആദ്യത്തേത് മൂലപാഠത്തിൽ ഇല്ലാത്ത സൃഷ്ടിക്കപ്പെട്ടതെന്ന ആശയം വരുത്താം; രണ്ടാമത്തേത് γενόμενος എന്ന പദത്തിന്റെ ചലനാത്മകത ഇല്ലാതാക്കും. പരിഭാഷ വാക്യത്തിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം വ്യാഖ്യാനിച്ച് നീക്കാതെ സംരക്ഷിക്കുന്നു.
- issue: ‘നാമം’ എന്നതിന്റെ സന്ദർഭാർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘നാമം’ എന്നുതന്നെ നിലനിർത്തി; തുടർന്നുള്ള സന്ദർഭം അതിനെ പുത്രന്റെ പുത്രപദവി/സ്ഥാനവുമായി ബന്ധിപ്പിക്കുന്നതായി അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
  alternative: മുഖ്യപാഠത്തിൽ തന്നെ ‘പുത്രൻ എന്ന പദവി’ എന്ന് വിശദീകരിക്കുക.
  rationale: ഗ്രീക്ക് വാക്യം ὄνομα എന്നു മാത്രമാണ് പറയുന്നത്; മുൻകൂട്ടി പരാവർത്തനം ചെയ്യാതെ എബ്രായർ 1-ലെ സാഹിത്യവികാസം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘എത്രത്തോളം ... അത്രത്തോളം’ എന്ന ഘടന മൂലത്തിലെ ആനുപാതിക താരതമ്യം സംരക്ഷിക്കുന്നു; ‘നാമം’, ‘അവകാശമായി പ്രാപിച്ചിരിക്കുന്നു’ എന്നിവ എബ്രായർ ലേഖനത്തിന്റെ ഉയർന്ന ശൈലിക്ക് യോജിക്കുന്നു.
