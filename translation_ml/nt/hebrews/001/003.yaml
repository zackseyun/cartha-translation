id: HEB.1.3
reference: Hebrews 1:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃς ὢν ἀπαύγασμα τῆς δόξης καὶ χαρακτὴρ τῆς ὑποστάσεως αὐτοῦ, φέρων τε τὰ πάντα τῷ ῥήματι τῆς δυνάμεως, ⸂δι’ αὑτοῦ⸃ καθαρισμὸν ⸂τῶν ἁμαρτιῶν ποιησάμενος⸃ ἐκάθισεν ἐν δεξιᾷ τῆς μεγαλωσύνης ἐν ὑψηλοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/003.yaml
  text: He[a], being the radiance of his glory and the exact imprint of his being, and sustaining all things by the word of his power, after making purification for sins through himself[b], sat down at the right hand of the Majesty on high[c],
translation:
  language: ml
  text: അവിടുന്ന് ദൈവത്തിന്റെ മഹത്ത്വത്തിന്റെ തേജസ്സും ദൈവത്തിന്റെ സത്തയുടെ[a] കൃത്യമായ മുദ്രയും ആകുന്നു; തന്റെ ശക്തിയുടെ വചനത്താൽ സകലത്തെയും താങ്ങിനിർത്തുന്ന അവിടുന്ന്, തന്നിലൂടെ[b] പാപങ്ങൾക്കുള്ള ശുദ്ധീകരണം വരുത്തിയശേഷം, ഉയരങ്ങളിൽ[c] മഹാമഹിമയുടെ വലത്തുഭാഗത്ത് ഇരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സത്ത” എന്നതിന് “യാഥാർഥ്യം,” “സ്വഭാവം,” അല്ലെങ്കിൽ “അസ്തിത്വം” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ “തന്നിലൂടെ” എന്ന വാക്കുകൾ ഇല്ല. ഇവിടെ SBLGNT പാഠം പിന്തുടർന്ന് അവ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
    reason: textual_variant
  - marker: c
    text: അഥവാ “ഉന്നതസ്ഥാനത്ത്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπαύγασμα
  choice: തേജസ്സ്
  rationale: ദൈവിക മഹത്ത്വത്തിൽനിന്നു പ്രസരിക്കുന്ന പ്രകാശശോഭ എന്ന രൂപകം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; വെറും പ്രതിഫലനം എന്ന ദുർബലമായ അർഥം ഒഴിവാക്കുന്നു.
- source_word: δόξα
  choice: മഹത്ത്വം
  rationale: ദൈവത്തിന്റെ തേജോമയമായ മഹിമയും ഔന്നത്യവും സൂചിപ്പിക്കുന്ന, സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന പദം.
- source_word: χαρακτήρ
  choice: കൃത്യമായ മുദ്ര
  rationale: മുദ്ര പതിപ്പിക്കുമ്പോൾ ലഭിക്കുന്ന കൃത്യമായ അടയാളം എന്ന ഗ്രീക്ക് രൂപകം നിലനിർത്തുകയും വെറും സാദൃശ്യം എന്ന ആശയത്തേക്കാൾ ശക്തമായ യോജിപ്പ് പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: ὑπόστασις
  choice: സത്ത
  rationale: അടിസ്ഥാന യാഥാർഥ്യം അഥവാ യഥാർഥ അസ്തിത്വം എന്ന അർഥം സംക്ഷിപ്തമായി നൽകുന്നു; പിൽക്കാല സാങ്കേതിക ദാർശനിക നിർവചനങ്ങളെ മുഖ്യവാചകത്തിൽ അമിതമായി ചുമത്തുന്നില്ല.
- source_word: φέρων
  choice: താങ്ങിനിർത്തുന്ന
  rationale: സകലത്തെയും തുടർച്ചയായി വഹിക്കുകയും നിലനിർത്തുകയും ചെയ്യുന്ന സജീവ പ്രവർത്തനം വ്യക്തമാക്കുന്നു.
- source_word: τὰ πάντα
  choice: സകലത്തെയും
  rationale: ഗ്രീക്കിലെ സമഗ്രമായ വ്യാപ്തി ചുരുക്കാതെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: τῷ ῥήματι τῆς δυνάμεως
  choice: തന്റെ ശക്തിയുടെ വചനത്താൽ
  rationale: ശക്തിയും ഉച്ചരിക്കപ്പെട്ട വചനവും തമ്മിലുള്ള ഗ്രീക്ക് ബന്ധം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: δι’ αὑτοῦ
  choice: തന്നിലൂടെ
  rationale: διά എന്ന പദത്തിന്റെ സാധാരണ മാധ്യമാർഥവും പ്രതിഫല സർവനാമത്തിന്റെ ഊന്നലും സംരക്ഷിക്കുന്നു.
- source_word: καθαρισμὸν τῶν ἁμαρτιῶν
  choice: പാപങ്ങൾക്കുള്ള ശുദ്ധീകരണം
  rationale: പാപത്തെ കൈകാര്യം ചെയ്യുന്ന ആചാരപരവും ബലിസംബന്ധവുമായ ശുദ്ധീകരണഭാവം നിലനിർത്തുന്നു; പാപങ്ങൾ തന്നെയാണ് ശുദ്ധമാക്കപ്പെടുന്നത് എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: ἐν δεξιᾷ τῆς μεγαλωσύνης
  choice: മഹാമഹിമയുടെ വലത്തുഭാഗത്ത്
  rationale: ദൈവത്തെ ‘മഹാമഹിമ’ എന്നു പരാമർശിക്കുന്ന ഗ്രീക്കിലെ ഗൗരവമുള്ള പരോക്ഷനാമം നിലനിർത്തുന്നു.
- source_word: ἐν ὑψηλοῖς
  choice: ഉയരങ്ങളിൽ
  rationale: ബഹുവചനരൂപവും സ്വർഗീയ ഉന്നതസ്ഥാനത്തിന്റെ സ്ഥലാർഥവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ὑπόστασις എന്ന പദത്തിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ ഭാരം
  choice: സത്ത
  alternative: സ്വഭാവം; യാഥാർഥ്യം; അസ്തിത്വം
  rationale: പുത്രൻ ദൈവത്തിന്റെ യാഥാർഥ്യവുമായി കൃത്യമായി ഒത്തുനിൽക്കുന്നു എന്ന ശക്തമായ വാക്യാർഥം നിലനിർത്തുന്നു; അതേസമയം പിൽക്കാല സഭാസൂത്രങ്ങളിലെ സാങ്കേതിക പദപ്രയോഗം മുഴുവനായി വാക്യത്തിലേക്ക് ഇറക്കിവെക്കുന്നില്ല.
- issue: ἀπαύγασμα, χαρακτήρ എന്നീ പദങ്ങളുടെ ശക്തമായ ക്രിസ്തുശാസ്ത്രപരമായ പ്രസ്താവന
  choice: ‘തേജസ്സ്’, ‘കൃത്യമായ മുദ്ര’ എന്നീ ശക്തമായ രൂപകങ്ങൾ നിലനിർത്തുക
  alternative: പ്രതിഫലനം; പ്രതിനിധാനം
  rationale: പുത്രനെ വെറും ദുർബല പ്രതിഫലനമായോ ബാഹ്യ പ്രതിനിധിയായോ ചുരുക്കാതെ ഗ്രീക്കിലെ ശക്തമായ യോജിപ്പും പങ്കാളിത്തവും സംരക്ഷിക്കുന്നു.
- issue: δι’ αὑτοῦ ഉൾപ്പെടുന്ന പാഠഭേദം
  choice: SBLGNT അനുസരിച്ച് ‘തന്നിലൂടെ’ മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തുക
  alternative: പ്രയോഗം ഒഴിവാക്കുക; ‘താൻതന്നെ’ എന്നു കർത്തൃമാധ്യമമായി പരിഭാഷപ്പെടുത്തുക
  rationale: നൽകിയിരിക്കുന്ന മൂലപാഠം δι’ αὑτοῦ ഉൾക്കൊള്ളുന്നതിനാൽ അത് പരിഭാഷപ്പെടുത്തുന്നു; മറ്റു കൈയെഴുത്തുപ്രതികളിലെ വ്യത്യാസം അടിക്കുറിപ്പിൽ തുറന്നുപറയുന്നു.
- issue: ‘മഹാമഹിമ’ ആരെ സൂചിപ്പിക്കുന്നു എന്നത്
  choice: ഗ്രീക്കിലെ ദൈവസംബന്ധിയായ പരോക്ഷനാമം നിലനിർത്തുക
  alternative: ദൈവത്തിന്റെ വലത്തുഭാഗത്ത്
  rationale: സന്ദർഭത്തിൽ അത് ദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിലും, മൂലപാഠത്തിലെ ഗൗരവമുള്ള ‘Majesty’ എന്ന പരാമർശം നേരിട്ട് ‘ദൈവം’ എന്നു മാറ്റാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള, എന്നാൽ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന ശൈലി. ഗ്രീക്കിലെ ദീർഘവാക്യഘടന അർധവിരാമവും പങ്കാളിത്തഘടനയും ഉപയോഗിച്ച് നിലനിർത്തി. ‘അവിടുന്ന്’ ആദരസൂചക സർവനാമമായി ഉപയോഗിച്ചു; ദൈവത്തെ സൂചിപ്പിക്കുന്ന സർവനാമത്തിലെ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ആദ്യ രണ്ടു ജനിറ്റീവുകൾ ‘ദൈവത്തിന്റെ’ എന്നു വ്യക്തമാക്കി.
