id: HEB.1.11
reference: Hebrews 1:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: αὐτοὶ ἀπολοῦνται, σὺ δὲ διαμένεις· καὶ πάντες ὡς ἱμάτιον παλαιωθήσονται,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/011.yaml
  text: They will perish[a], but you remain; and they all will wear out like a garment[b],
translation:
  language: ml
  text: അവ നശിച്ചുപോകും; എന്നാൽ നീ നിലനിൽക്കുന്നു. അവയെല്ലാം ഒരു വസ്ത്രംപോലെ പഴകിപ്പോകും[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരു വസ്ത്രംപോലെ പഴക്കംചെല്ലും.’
    reason: lexical_alternative
  - marker: b
    text: ഈ ദൃശ്യരൂപം സങ്കീർത്തനം 102:25–27-നെ പ്രതിധ്വനിപ്പിക്കുന്നു; സൃഷ്ടിക്കപ്പെട്ടവയുടെ ക്ഷണികതയും അഭിസംബോധന ചെയ്യപ്പെടുന്നവന്റെ ശാശ്വതമായ നിലനിൽപ്പും തമ്മിലുള്ള വൈരുധ്യം അതിൽ കാണാം.
    reason: cross_reference
lexical_decisions:
- source_word: αὐτοὶ
  choice: അവ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ ആകാശങ്ങളെയും ഭൂമിയെയും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ജഡവസ്തുക്കളെ പരാമർശിക്കാൻ ‘അവ’ സ്വാഭാവികമാണ്; പിന്നാലെയുള്ള ‘നീ’ എന്നതുമായുള്ള വൈരുധ്യം വാക്യഘടന വ്യക്തമാക്കുന്നു.
- source_word: ἀπολοῦνται
  choice: നശിച്ചുപോകും
  rationale: വരാനിരിക്കുന്ന അവസാനത്തെയോ ഇല്ലാതാകലിനെയോ ശക്തമായി സൂചിപ്പിക്കുന്നു; എന്നാൽ നാശം വരുത്തുന്ന ഒരു ബാഹ്യകർത്താവിനെ മൂലപാഠത്തിൽ ഇല്ലാത്തവിധം വ്യക്തമാക്കുന്നില്ല.
- source_word: σὺ δὲ
  choice: എന്നാൽ നീ
  rationale: സൃഷ്ടിയുടെ ക്ഷണികതയും അഭിസംബോധന ചെയ്യപ്പെടുന്നവന്റെ നിലനിൽപ്പും തമ്മിലുള്ള ശക്തമായ വൈരുധ്യം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: διαμένεις
  choice: നിലനിൽക്കുന്നു
  rationale: തുടർന്നും ഇരിക്കുക, നിലനിൽക്കുക എന്ന അർഥം നൽകുന്നു. ഗ്രീക്കിലെ വർത്തമാനകാലരൂപവും സൃഷ്ടിയുടെ നാശത്തോടുള്ള വൈരുധ്യവും സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: πάντες
  choice: അവയെല്ലാം
  rationale: മുൻപ് പരാമർശിച്ച സൃഷ്ടവസ്തുക്കളെ സമഗ്രമായി സൂചിപ്പിക്കുകയും ‘എല്ലാം’ എന്ന ആശയം വ്യക്തമായി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ὡς ἱμάτιον
  choice: ഒരു വസ്ത്രംപോലെ
  rationale: ἱμάτιον എന്നതിന്റെ പൊതുവായ വസ്ത്രരൂപകം പ്രത്യേക വസ്ത്രയിനമായി ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: παλαιωθήσονται
  choice: പഴകിപ്പോകും
  rationale: കാലക്രമത്തിൽ പഴകുകയോ തേഞ്ഞുപോകുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. വസ്ത്രരൂപകത്തോട് ചേർന്ന് സാധാരണ മലയാളത്തിൽ വ്യക്തമായി കേൾക്കുന്നു.
theological_decisions:
- issue: അഭിസംബോധന ചെയ്യപ്പെടുന്നവനും ക്രിസ്തുശാസ്ത്രപരമായ പ്രാധാന്യവും
  choice: ‘നീ നിലനിൽക്കുന്നു’ എന്ന നേരിട്ടുള്ള അഭിസംബോധന നിലനിർത്തി.
  alternative: ‘അവിടുന്ന് നിലനിൽക്കുന്നു’ എന്ന ആദരസൂചക രൂപം ഉപയോഗിക്കുക.
  rationale: എബ്രായർ 1-ന്റെ സന്ദർഭത്തിൽ സങ്കീർത്തനം 102-ലെ വാക്കുകൾ പുത്രനോടാണ് പ്രയോഗിക്കുന്നത്. ഗ്രീക്കിലെ ഏകവചന ദ്വിതീയപുരുഷ സർവനാമത്തിന്റെ നേരിട്ടുള്ള ശക്തി ‘നീ’ കാത്തുസൂക്ഷിക്കുന്നു; പാഠത്തിനപ്പുറമുള്ള വ്യാഖ്യാനപരമായ പദവി ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലപാഠത്തിലെ ശക്തമായ വൈരുധ്യം നിലനിർത്താൻ രണ്ടു സ്വതന്ത്ര വാക്യങ്ങൾ ഉപയോഗിച്ചു. ഇംഗ്ലീഷ് consultation layer-ൽ [a] എന്ന അടയാളം ‘will perish’ എന്നതിനുശേഷം വന്നിരുന്നെങ്കിലും അതിന്റെ ഉള്ളടക്കം παλαιωθήσονται എന്ന പദത്തിന്റെ വ്യത്യസ്ത പരിഭാഷയായതിനാൽ മലയാളത്തിൽ ശരിയായ പദസമുച്ചയത്തിനുശേഷം അടയാളപ്പെടുത്തി.
