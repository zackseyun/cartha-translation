id: HEB.1.12
reference: Hebrews 1:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὡσεὶ περιβόλαιον ἑλίξεις αὐτούς, ⸂ὡς ἱμάτιον⸃ καὶ ἀλλαγήσονται· σὺ δὲ ὁ αὐτὸς εἶ, καὶ τὰ ἔτη σου οὐκ ἐκλείψουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/012.yaml
  text: and like a cloak you will roll them up[a]; like a garment they will be changed. But you are the same[b], and your years will not fail.
translation:
  language: ml
  text: ഒരു മേലങ്കിപോലെ നീ അവയെ ചുരുട്ടും[a]; ഒരു വസ്ത്രംപോലെ അവ മാറ്റപ്പെടും. എന്നാൽ നീ അതേപടി തന്നെയാണ്; നിന്റെ വർഷങ്ങൾ അവസാനിക്കുകയുമില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “മടക്കും.”'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: “നിന്റെ വർഷങ്ങൾ നിലച്ചുപോകുകയില്ല.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσεὶ περιβόλαιον
  choice: ഒരു മേലങ്കിപോലെ
  rationale: ചുറ്റിപ്പുതയ്ക്കുന്ന പുറംവസ്ത്രത്തിന്റെ ഉപമ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἑλίξεις
  choice: ചുരുട്ടും
  rationale: ചുരുട്ടുക, മടക്കുക എന്നീ അർഥസാധ്യതകളിൽ വസ്ത്രോപമയ്ക്ക് യോജിക്കുന്നതും ഗ്രീക്കിലെ ഭാവികാല സജീവക്രിയയെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നതുമായ പ്രയോഗം.
- source_word: αὐτούς
  choice: അവയെ
  rationale: മുൻസന്ദർഭത്തിലെ സൃഷ്ടിക്കപ്പെട്ട ആകാശങ്ങളെ സൂചിപ്പിക്കുന്ന സർവനാമം മലയാളത്തിൽ സ്വാഭാവികമായി നപുംസക ബഹുവചനത്തിൽ നൽകുന്നു.
- source_word: ὡς ἱμάτιον
  choice: ഒരു വസ്ത്രംപോലെ
  rationale: περιβόλαιον എന്ന ആദ്യ വസ്ത്രപദത്തോടുള്ള കാവ്യാത്മക സമാന്തരത നിലനിർത്തുകയും ഏകവചനം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀλλαγήσονται
  choice: അവ മാറ്റപ്പെടും
  rationale: സൃഷ്ടിക്കപ്പെട്ടവ മാറ്റത്തിന് വിധേയമാകുന്നു എന്ന ഭാവികാല കർമണിപ്രയോഗം അതേപടി നിലനിർത്തുന്നു.
- source_word: σὺ δὲ ὁ αὐτὸς εἶ
  choice: എന്നാൽ നീ അതേപടി ഇരിക്കുന്നു
  rationale: മാറുന്ന സൃഷ്ടിയും മാറ്റമില്ലാതെ ഒരേ നിലയിൽ ഉള്ള അഭിസംബോധിതനും തമ്മിലുള്ള വൈരുധ്യം വ്യക്തമാക്കുന്നു; പിൽക്കാല സാങ്കേതിക ദൈവശാസ്ത്രപദം ചേർക്കുന്നില്ല.
- source_word: τὰ ἔτη σου οὐκ ἐκλείψουσιν
  choice: നിന്റെ വർഷങ്ങൾ അവസാനിക്കുകയുമില്ല
  rationale: കാലപരമായ കാവ്യരൂപകം നിലനിർത്തിക്കൊണ്ട് ἐκλείπω എന്നതിന്റെ ‘അവസാനിക്കുക/നിലയ്ക്കുക’ എന്ന ആശയം വ്യക്തമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ക്രിസ്തുവിനെ സംബന്ധിച്ച ഉദ്ധരണിയിൽ സ്ഥിരതയും സൃഷ്ടിയുടെ മാറ്റവും തമ്മിലുള്ള വൈരുധ്യം
  choice: എന്നാൽ നീ അതേപടി ഇരിക്കുന്നു
  alternative: എന്നാൽ നീ മാറ്റമില്ലാത്തവനാണ്
  rationale: ὁ αὐτός എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ തുറന്നതും നേരിട്ടുള്ളതുമായ രൂപം നിലനിർത്തുന്നു; ‘മാറ്റമില്ലാത്തവൻ’ എന്ന കൂടുതൽ സാങ്കേതികമായി കേൾക്കാവുന്ന വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ കാവ്യഭാഷ. മേലങ്കി–വസ്ത്രം എന്ന സമാന്തര ഉപമയും മാറ്റപ്പെടുന്ന സൃഷ്ടി–അതേപടി ഇരിക്കുന്ന അഭിസംബോധിതൻ എന്ന ദൈവശാസ്ത്രപരമായ വൈരുധ്യവും സംരക്ഷിച്ചിരിക്കുന്നു.
