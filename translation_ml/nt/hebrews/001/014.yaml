id: HEB.1.14
reference: Hebrews 1:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐχὶ πάντες εἰσὶν λειτουργικὰ πνεύματα εἰς διακονίαν ἀποστελλόμενα διὰ τοὺς μέλλοντας κληρονομεῖν σωτηρίαν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/014.yaml
  text: Are they not all ministering spirits, being sent out for service for the sake of those who are about to inherit salvation?[a]
translation:
  language: ml
  text: അവർ എല്ലാവരും രക്ഷ അവകാശമായി ലഭിക്കാനിരിക്കുന്നവർക്കുവേണ്ടി സേവനത്തിനായി അയയ്ക്കപ്പെടുന്ന ശുശ്രൂഷകാത്മാക്കൾ അല്ലയോ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “രക്ഷ അവകാശമായി ലഭിക്കുന്നവർ.” ഗ്രീക്ക് പ്രയോഗത്തിന് ഭാവിമുഖമായ അർഥമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχὶ
  choice: അല്ലയോ
  rationale: ഉവ്വ് എന്ന ഉത്തരം പ്രതീക്ഷിക്കുന്ന ഗ്രീക്ക് അലങ്കാരചോദ്യത്തിന്റെ ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: πάντες
  choice: എല്ലാവരും
  rationale: ദൂതന്മാരെ മുഴുവനായി ഉൾക്കൊള്ളുന്ന പ്രയോഗത്തിന്റെ സമഗ്രത സംരക്ഷിക്കുന്നു.
- source_word: λειτουργικὰ πνεύματα
  choice: സേവകാത്മാക്കൾ
  rationale: വിശുദ്ധമോ ഔദ്യോഗികമോ ആയ സേവനത്തിന്റെ സൂചനയുള്ള λειτουργικός എന്ന പദത്തിന്റെ ഭാവം സംക്ഷിപ്തമായി നൽകുന്നു; ഇവിടെ πνεύματα ദൂതജീവികളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: εἰς διακονίαν
  choice: ശുശ്രൂഷയ്ക്കായി
  rationale: ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന പ്രയോഗം നാമരൂപത്തിൽ നിലനിർത്തുകയും സഭാപദവിയെന്ന അനാവശ്യ അർഥം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: ἀποστελλόμενα
  choice: അയയ്ക്കപ്പെടുന്ന
  rationale: വർത്തമാനകാല കർമണി പങ്കുപദത്തിന്റെ വിവരണാത്മക സ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: διὰ τοὺς
  choice: അവർക്കുവേണ്ടി
  rationale: διά + accusative ഇവിടെ ഗുണഭോക്താക്കളെ ലക്ഷ്യമാക്കിയുള്ള സേവനത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ഗുണാർത്ഥം വ്യക്തമാക്കുന്നു.
- source_word: τοὺς μέλλοντας
  choice: ലഭിക്കാനിരിക്കുന്നവർ
  rationale: μέλλωയുടെ ഭാവിമുഖവും പ്രതീക്ഷാത്മകവുമായ അർഥം സംരക്ഷിക്കുന്നു; മുൻനിർണ്ണയം പോലുള്ള ആശയം ചേർക്കുന്നില്ല.
- source_word: κληρονομεῖν
  choice: അവകാശമായി ലഭിക്കുക
  rationale: അവകാശം/പൈതൃകം എന്ന രൂപകം വ്യക്തമായി സംരക്ഷിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണ്.
- source_word: σωτηρίαν
  choice: രക്ഷ
  rationale: എബ്രായലേഖനത്തിലെ വർത്തമാനവും ഭാവിമുഖവുമായ രക്ഷാഭാവം ഉൾക്കൊള്ളുന്ന സ്ഥാപിതമായ മലയാള പദം.
theological_decisions:
- issue: μέλλοντας κληρονομεῖν σωτηρίαν എന്നതിന്റെ കാലപരവും ദൈവശാസ്ത്രപരവുമായ ഭാവം
  choice: രക്ഷ അവകാശമായി ലഭിക്കാനിരിക്കുന്നവർ
  alternative: രക്ഷ അവകാശമായി ലഭിക്കുന്നവർ / രക്ഷ അവകാശമായി ലഭിക്കേണ്ടവർ
  rationale: ഭാവിമുഖമായ പ്രതീക്ഷ സംരക്ഷിക്കുമ്പോഴും ഉറപ്പ്, മുൻനിർണ്ണയം എന്നിവയെക്കുറിച്ചുള്ള ഏതെങ്കിലും പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ നിലപാട് വാക്യത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. അലങ്കാരചോദ്യത്തിന്റെ ഊന്നൽ നിലനിർത്തിയിരിക്കുന്നു. ‘സേവകാത്മാക്കൾ’ ദൂതന്മാരുടെ സേവകസ്വഭാവം വ്യക്തമാക്കുന്നു; ‘ശുശ്രൂഷയ്ക്കായി’ മൂലത്തിലെ വേറിട്ട സേവനപദവും നിലനിർത്തുന്നു.
