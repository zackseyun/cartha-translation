reference: Hebrews 1:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τίνι γὰρ εἶπέν ποτε τῶν ἀγγέλων· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε, καὶ πάλιν· Ἐγὼ ἔσομαι αὐτῷ εἰς πατέρα, καὶ αὐτὸς ἔσται μοι εἰς υἱόν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/005.yaml
  text: For to which of the angels did he ever say[a], “You are my Son; today I have begotten you”? And again, “I will be to him a father[c][b], and he will be to me a son”?
translation:
  language: ml
  text: 'എന്തെന്നാൽ, ദൂതന്മാരിൽ ആരോടാണ് അവൻ എപ്പോഴെങ്കിലും ഇങ്ങനെ പറഞ്ഞിട്ടുള്ളത്[a]?


    “നീ എന്റെ പുത്രനാകുന്നു;

    ഇന്ന് ഞാൻ നിന്നെ ജനിപ്പിച്ചിരിക്കുന്നു.”[b]


    വീണ്ടും:


    “ഞാൻ അവന് പിതാവായിരിക്കും;

    അവൻ എനിക്ക് പുത്രനായിരിക്കും.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “ഏതെങ്കിലും സമയത്ത് പറഞ്ഞു.”'
    reason: lexical_alternative
  - marker: b
    text: “ഞാൻ നിന്നെ ജനിപ്പിച്ചിരിക്കുന്നു” എന്നത് സങ്കീർത്തനം 2:7-ന്റെ ഉദ്ധരണിയാണ്. ഈ വാക്കുകൾ രാജാഭിഷേകം, പുനരുത്ഥാനം, അല്ലെങ്കിൽ പിതാവുമായുള്ള പുത്രന്റെ നിത്യബന്ധം എന്നിവയുമായി ബന്ധപ്പെടുത്തി മനസ്സിലാക്കപ്പെട്ടിട്ടുണ്ട്; പരിഭാഷ ഇവയിൽ ഒന്നിനെ നിർണയിക്കാതെ മൂലവാചകം നിലനിർത്തുന്നു.
    reason: cross_reference
  - marker: c
    text: '2 ശമൂവേൽ 7:14-ൽ നിന്നുള്ള ഉദ്ധരണി. കൂടുതൽ സ്വാഭാവികമായി: “ഞാൻ അവന്റെ പിതാവായിരിക്കും; അവൻ എന്റെ പുത്രനായിരിക്കും.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Τίνι ... τῶν ἀγγέλων
  choice: ദൂതന്മാരിൽ ആരോട്
  rationale: ചോദ്യസർവനാമത്തിന്റെ ദത്തിവിഭക്തിയും ഭാഗിക ഷഷ്ഠിയായ ‘ദൂതന്മാരിൽ’ എന്ന ആശയവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: γὰρ
  choice: ചോദ്യത്തിന്റെ വിശദീകരണബന്ധത്തിലൂടെ പ്രകടമാക്കി
  rationale: മുൻവാക്യത്തിലെ വാദത്തിന് ഈ വാക്യം കാരണം നൽകുന്നു. ഒറ്റവാക്യം സ്വതന്ത്രമായി വായിക്കുമ്പോൾ അസ്വാഭാവികമാകാവുന്ന ‘എന്തെന്നാൽ’ ചേർക്കാതെ, വാക്യഘടനയിൽ ബന്ധം സൂചിപ്പിക്കുന്നു.
- source_word: εἶπέν ποτε
  choice: എപ്പോഴെങ്കിലും ... പറഞ്ഞിട്ടുള്ളത്
  rationale: ποτέ നൽകുന്ന ‘ഏതെങ്കിലും അവസരത്തിൽ’ എന്ന ഊന്നലും, ഒരിക്കൽപോലും അങ്ങനെ പറഞ്ഞിട്ടില്ലെന്ന അലങ്കാരചോദ്യത്തിന്റെ ശക്തിയും സംരക്ഷിക്കുന്നു.
- source_word: ἀγγέλων
  choice: ദൂതന്മാർ
  rationale: എബ്രായർ 1-ലെ പശ്ചാത്തലം മനുഷ്യസന്ദേശവാഹകരെയല്ല, സ്വർഗീയ ദൂതന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: Υἱός μου εἶ σύ
  choice: നീ എന്റെ പുത്രനാകുന്നു
  rationale: നേരിട്ടുള്ള അഭിസംബോധനയും പുത്രത്വത്തിന്റെ ഗൗരവവും നിലനിർത്തുന്ന സ്വാഭാവികവും മാന്യവുമായ മലയാളം.
- source_word: σήμερον
  choice: ഇന്ന്
  rationale: വ്യാഖ്യാനപരമായ പരാവർത്തനം കൂടാതെ കാലസൂചക ക്രിയാവിശേഷണം നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: γεγέννηκά σε
  choice: ഞാൻ നിന്നെ ജനിപ്പിച്ചിരിക്കുന്നു
  rationale: γεννάω എന്ന ക്രിയയുടെ ജനന/പിതൃത്വ രൂപകം മായ്ച്ചുകളയാതെ, പൂർത്തികാലത്തിന്റെ നിലവിലുള്ള ഫലസൂചനയും കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: καὶ πάλιν
  choice: വീണ്ടും
  rationale: മറ്റൊരു തിരുവെഴുത്ത് ഉദ്ധരണി അവതരിപ്പിക്കുന്ന സൂത്രവാക്യം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: Ἐγὼ ἔσομαι αὐτῷ εἰς πατέρα
  choice: ഞാൻ അവന് പിതാവായിരിക്കും
  rationale: εἰς + accusative ഘടനയുടെ ഔപചാരിക ബന്ധഭാവം നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായി കേൾക്കുകയും ചെയ്യുന്നു.
- source_word: καὶ αὐτὸς ἔσται μοι εἰς υἱόν
  choice: അവൻ എനിക്ക് പുത്രനായിരിക്കും
  rationale: മുൻവരിയോടുള്ള സമാന്തരതയും പരസ്പരബന്ധവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: സങ്കീർത്തനം 2:7-ലെ ‘ഞാൻ നിന്നെ ജനിപ്പിച്ചിരിക്കുന്നു’ എന്നതിന്റെ അർഥം
  choice: ‘ജനിപ്പിച്ചിരിക്കുന്നു’ എന്ന രൂപകം അതേപടി നിലനിർത്തി; രാജാഭിഷേകം, പുനരുത്ഥാനം, അവതാരം, അല്ലെങ്കിൽ പിതാവുമായുള്ള നിത്യബന്ധം എന്നൊന്നായി മുഖ്യപാഠത്തിൽ നിർണയിച്ചില്ല.
  alternative: ‘ഇന്ന് ഞാൻ നിന്റെ പിതാവായിരിക്കുന്നു’ എന്ന വ്യാഖ്യാനപരമായ പരാവർത്തനം, അല്ലെങ്കിൽ ഒരു പ്രത്യേക ക്രിസ്തുശാസ്ത്ര വ്യാഖ്യാനം വ്യക്തമാക്കൽ.
  rationale: ഉദ്ധരണിയുടെ ഭാഷയ്ക്ക് പല വ്യാഖ്യാനപരമായ ബന്ധങ്ങളുണ്ട്; ഗ്രീക്ക് പാഠം അവയിൽ ഒന്ന് ഇവിടെ വ്യക്തമായി തിരഞ്ഞെടുത്തിട്ടില്ല.
- issue: രണ്ട് ഉദ്ധരണികളിലുമുള്ള പുത്രത്വഭാഷ
  choice: രണ്ടിടത്തും ‘പുത്രൻ’ എന്ന പദം ഉപയോഗിച്ചു; മലയാളത്തിൽ അക്ഷരവലുപ്പംകൊണ്ട് ക്രിസ്തുശാസ്ത്രപരമായ വ്യത്യാസം അടിച്ചേൽപ്പിച്ചില്ല.
  alternative: ആദ്യ ഉദ്ധരണിയിൽ മാത്രം ഇംഗ്ലീഷിനെ അനുകരിച്ച് വ്യത്യസ്ത അക്ഷരവലുപ്പമോ മറ്റൊരു പദരൂപമോ ഉപയോഗിക്കൽ.
  rationale: ഗ്രീക്കിലെ അക്ഷരരീതി അത്തരമൊരു ദൈവശാസ്ത്രപരമായ വ്യത്യാസം നിർബന്ധിക്കുന്നില്ല; മലയാള ലിപിയിലും capital/lowercase വ്യത്യാസമില്ല. സന്ദർഭം രണ്ടും പുത്രനോട് പ്രയോഗിക്കുന്നതായി വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായും ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. തിരുവെഴുത്ത് ഉദ്ധരണികളുടെ കവിതാസമാന സമാന്തരത വരിവിഭജനത്തിലൂടെ നിലനിർത്തി. ‘പുത്രൻ’, ‘പിതാവ്’, ‘ജനിപ്പിക്കുക’ എന്നീ പദങ്ങൾ ഔപചാരികമായ ദൈവശാസ്ത്ര ഭാരം സംരക്ഷിക്കുമ്പോഴും അനാവശ്യമായി സഭാവിഭാഗ-വിശേഷമായ ഭാഷ ഒഴിവാക്കുന്നു.
