  rationale: The revision corrects the unrepresented γάρ and avoids making explicit a divine subject that the Greek verse itself leaves implicit. It otherwise preserves the draft’s accurate rendering of the Greek wording, its literary parallelism, and the intentionally non-interpretive treatment of “I have begotten you.”
