id: HEB.1.7
reference: Hebrews 1:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ πρὸς μὲν τοὺς ἀγγέλους λέγει· Ὁ ποιῶν τοὺς ἀγγέλους αὐτοῦ πνεύματα, καὶ τοὺς λειτουργοὺς αὐτοῦ πυρὸς φλόγα·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/007.yaml
  text: And about the angels he says[a], “He makes his angels winds, and his ministers a flame of fire.”
translation:
  language: ml
  text: 'ദൂതന്മാരെക്കുറിച്ച് അവൻ പറയുന്നു: “അവൻ തന്റെ ദൂതന്മാരെ കാറ്റുകളാക്കുന്നു[a]; തന്റെ ശുശ്രൂഷകരെ അഗ്നിജ്വാലയാക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ “ആത്മാക്കളാക്കുന്നു”: ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദത്തിന് “കാറ്റുകൾ” എന്നും “ആത്മാക്കൾ” എന്നും അർഥമാകാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: πρὸς μὲν τοὺς ἀγγέλους
  choice: ദൂതന്മാരെക്കുറിച്ച്
  rationale: ഇവിടെ πρός എന്നത് ദൂതന്മാരോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയല്ല, അവരെ സംബന്ധിച്ചുള്ള പ്രസ്താവനയാണ്; ഉദ്ധരണിയും ദൂതന്മാരെക്കുറിച്ചാണ് പറയുന്നത്.
- source_word: λέγει
  choice: അവൻ പറയുന്നു
  rationale: തിരുവെഴുത്ത് ഉദ്ധരിക്കുന്ന വർത്തമാനകാല പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: Ὁ ποιῶν
  choice: അവൻ ... ആക്കുന്നു
  rationale: ποιέωയുടെ സജീവ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ‘നിയമിക്കുന്നു’ എന്ന വ്യാഖ്യാനപരമായ അർഥം ചേർക്കുന്നില്ല.
- source_word: ἀγγέλους
  choice: ദൂതന്മാർ
  rationale: എബ്രായർ 1-ലെ സ്വർഗീയ ദൂതന്മാരും പുത്രനും തമ്മിലുള്ള താരതമ്യം കണക്കിലെടുക്കുമ്പോൾ പൊതുവായ ‘സന്ദേശവാഹകർ’ എന്നതിനെക്കാൾ ‘ദൂതന്മാർ’ യോജിക്കുന്നു.
- source_word: πνεύματα
  choice: കാറ്റുകൾ
  rationale: പദത്തിന് ‘കാറ്റുകൾ’ എന്നും ‘ആത്മാക്കൾ’ എന്നും അർഥമാകാം. സങ്കീർത്തനം 104:4-ന്റെ പശ്ചാത്തലവും ‘അഗ്നിജ്വാല’ എന്ന സമാന്തര പ്രകൃതിചിത്രവും കണക്കിലെടുത്ത് മുഖ്യപാഠത്തിൽ ‘കാറ്റുകൾ’ സ്വീകരിച്ചു; യഥാർഥമായ ദ്വയാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: λειτουργοὺς
  choice: ശുശ്രൂഷകർ
  rationale: സേവനം നിർവഹിക്കുന്നവരെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ ഉയർന്നതും ഔദ്യോഗികവുമായ ഭാവം ‘ശുശ്രൂഷകർ’ നിലനിർത്തുന്നു; പ്രത്യേക സഭാപദവി ഉദ്ദേശിക്കുന്നില്ല.
- source_word: πυρὸς φλόγα
  choice: അഗ്നിജ്വാല
  rationale: ഏകവചനത്തിലുള്ള കവിതാത്മക അഗ്നിചിത്രം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി പകർത്തുന്നു.
- source_word: αὐτοῦ
  choice: തന്റെ
  rationale: ഉദ്ധരണിയിലെ കർത്താവായ ദൈവത്തോടുള്ള ബന്ധം മലയാളത്തിലെ സ്വാഭാവിക പ്രത്യാവർത്തി ഉടമസ്ഥരൂപത്തിലൂടെ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: സങ്കീർത്തനം 104:4-ൽനിന്നുള്ള ഉദ്ധരണിയിലെ πνεύματα എന്നതിന്റെ അർഥം
  choice: കാറ്റുകൾ
  alternative: ആത്മാക്കൾ
  rationale: ഗ്രീക്ക് പദം രണ്ടർഥത്തിനും ഇടനൽകുന്നു. എബ്രായ പശ്ചാത്തലവും ‘അഗ്നിജ്വാല’യോടുള്ള കവിതാസമാന്തര്യവും ‘കാറ്റുകൾ’ എന്നതിനെ പിന്തുണയ്ക്കുന്നു; എന്നാൽ ദൈവശാസ്ത്രപരമായ ദ്വയാർഥം അമിതമായി തീർപ്പാക്കാതിരിക്കാൻ മറ്റുവായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഉദ്ധരണിയുടെ കവിതാഭാവം നിലനിർത്താൻ ‘കാറ്റുകൾ’, ‘അഗ്നിജ്വാല’ എന്നീ സമാന്തര ചിത്രങ്ങൾ ഉപയോഗിച്ചു; ‘ശുശ്രൂഷകർ’ എന്നത് ഉയർന്ന സേവനഭാവം നൽകുന്നു, എന്നാൽ പ്രത്യേക സഭാപദവി സൂചിപ്പിക്കുന്നില്ല.
