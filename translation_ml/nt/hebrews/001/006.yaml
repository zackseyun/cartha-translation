id: HEB.1.6
reference: Hebrews 1:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅταν δὲ πάλιν εἰσαγάγῃ τὸν πρωτότοκον εἰς τὴν οἰκουμένην, λέγει· Καὶ προσκυνησάτωσαν αὐτῷ πάντες ἄγγελοι θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/006.yaml
  text: And when he again brings the Firstborn into the world[a], he says[b], “And let all God’s angels worship him.”
translation:
  language: ml
  text: 'അവൻ ആദ്യജാതനെ വീണ്ടും ലോകത്തിലേക്കു കൊണ്ടുവരുമ്പോൾ[a] ഇപ്രകാരം പറയുന്നു: “ദൈവത്തിന്റെ ദൂതന്മാരെല്ലാം[b] അവനെ ആരാധിക്കട്ടെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “വീണ്ടും, അവൻ ആദ്യജാതനെ ലോകത്തിലേക്കു കൊണ്ടുവരുമ്പോൾ ഇപ്രകാരം പറയുന്നു: ‘ദൈവത്തിന്റെ ദൂതന്മാരെല്ലാം അവനെ ആരാധിക്കട്ടെ.’” ‘വീണ്ടും’ എന്ന ഗ്രീക്ക് ക്രിയാവിശേഷണം ‘കൊണ്ടുവരുമ്പോൾ’ എന്നതിനോടോ ‘പറയുന്നു’ എന്നതിനോടോ ചേർത്തു മനസ്സിലാക്കാം.'
    reason: alternative_reading
  - marker: b
    text: അഥവാ, “ദൈവത്തിന്റെ സകല ദൂതന്മാരും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: കൊണ്ടുവരുമ്പോൾ
  rationale: ഒരു നിർദിഷ്ട സംഭവത്തെ സൂചിപ്പിക്കുന്ന കാലവാക്യം സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ആവർത്തനാർഥമുള്ള ‘എപ്പോഴൊക്കെയോ’ ഇവിടെ അനാവശ്യമാണ്.
- source_word: δὲ
  choice: വാക്യഘടനയിൽ പ്രത്യേകം പദമായി പ്രകടിപ്പിച്ചിട്ടില്ല
  rationale: ഇത് ശക്തമായ വൈരുധ്യമല്ല, വാദത്തെ മുന്നോട്ടു നയിക്കുന്ന മൃദുവായ ബന്ധകമാണ്. മലയാളത്തിലെ തുടർച്ചയായ വാക്യഘടന അതിന്റെ പ്രവർത്തനം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: മുഖ്യപാഠത്തിൽ ‘കൊണ്ടുവരുന്നു’ എന്നതിനോടു ചേർത്തിരിക്കുന്നു. എന്നാൽ ‘അരുളിച്ചെയ്യുന്നു’ എന്നതിനോടു ചേർക്കാനുള്ള യഥാർഥ വ്യാകരണസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: εἰσαγάγῃ
  choice: കൊണ്ടുവരുമ്പോൾ
  rationale: ὅταν-നു ശേഷമുള്ള ക്രിയയുടെ സന്ദർഭോചിതമായ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; ‘പ്രവേശിപ്പിക്കുക’ എന്നത് ഇവിടെ കൂടുതൽ യാന്ത്രികമായി തോന്നും.
- source_word: τὸν πρωτότοκον
  choice: ആദ്യജാതനെ
  rationale: പുത്രനെ സൂചിപ്പിക്കുന്ന വിശേഷണാത്മക നാമപ്രയോഗത്തിന്റെ പുത്രത്വ-പ്രാമുഖ്യ അനുരണനങ്ങൾ നിലനിർത്തുന്നു; മലയാളത്തിൽ വലിയക്ഷരത്തിലൂടെ സ്ഥാനനാമഭാവം കാണിക്കാനാവാത്തതിനാൽ സന്ദർഭമാണ് അത് വ്യക്തമാക്കുന്നത്.
- source_word: εἰς τὴν οἰκουμένην
  choice: ലോകത്തിലേക്കു
  rationale: οἰκουμένηയുടെ ‘വാസമുള്ള ലോകം/ലോകം’ എന്ന വ്യാപ്തി ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: λέγει
  choice: ഇങ്ങനെ അരുളിച്ചെയ്യുന്നു
  rationale: ഉദ്ധരണിയിലേക്കുള്ള മാറ്റം വ്യക്തമാക്കുകയും സന്ദർഭത്തിൽ ദൈവമാണ് പറയുന്നത് എന്ന ആദരഭാവം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു. ‘ഇങ്ങനെ’ ഉദ്ധരണി അവതരിപ്പിക്കുന്ന മലയാള പ്രയോഗമാണ്.
- source_word: προσκυνησάτωσαν
  choice: ആരാധിക്കട്ടെ
  rationale: മൂന്നാംപുരുഷ ആജ്ഞ/അനുവാദക രൂപം കൃത്യമായി നൽകുന്നു. എബ്രായർ 1-ലെ ദൂതന്മാർ പുത്രനു നൽകേണ്ട ബഹുമാനത്തിന്റെ സന്ദർഭത്തിൽ ‘വണങ്ങട്ടെ’ എന്നതിനെക്കാൾ ‘ആരാധിക്കട്ടെ’ ശക്തി നന്നായി പകർത്തുന്നു.
- source_word: αὐτῷ
  choice: അവനെ
  rationale: προσκυνέωയുടെ ദത്തിവ് കർമത്തെ മലയാളത്തിൽ നേരിട്ടുള്ള കർമമായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: πάντες ἄγγελοι θεοῦ
  choice: ദൈവത്തിന്റെ ദൂതന്മാരെല്ലാം
  rationale: πάντες എന്ന സമഗ്രതയും θεοῦ എന്ന ഷഷ്ഠീബന്ധവും വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: πάλιν എന്നതിന്റെ വാക്യഘടനാപരമായ ബന്ധം
  choice: '‘വീണ്ടും’ എന്നത് ‘കൊണ്ടുവരുന്നു’ എന്നതിനോടു ചേർത്തു: ‘ആദ്യജാതനെ വീണ്ടും ലോകത്തിലേക്കു കൊണ്ടുവരുമ്പോൾ’'
  alternative: '‘വീണ്ടും’ എന്നത് ‘അരുളിച്ചെയ്യുന്നു’ എന്നതിനോടു ചേർത്തു: ‘വീണ്ടും, ... ഇങ്ങനെ അരുളിച്ചെയ്യുന്നു’'
  rationale: ഗ്രീക്ക് ഇരു വ്യാഖ്യാനങ്ങളും അനുവദിക്കുന്നു. മുഖ്യപാഠം പദക്രമത്തോടു സ്വാഭാവികമായി ചേരുന്ന വായന സ്വീകരിക്കുന്നു; യഥാർഥമായ അവ്യക്തത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: പുത്രനോടുള്ള προσκυνέωയുടെ ശക്തി
  choice: ആരാധിക്കട്ടെ
  alternative: വണങ്ങട്ടെ / പ്രണാമം അർപ്പിക്കട്ടെ
  rationale: എബ്രായർ 1-ൽ പുത്രന്റെ ദൂതന്മാരേക്കാൾ മഹത്തായ സ്ഥാനം സ്ഥാപിക്കുകയും ദൈവത്തിന്റെ സകല ദൂതന്മാരോടും ഈ പ്രവൃത്തി ആവശ്യപ്പെടുകയും ചെയ്യുന്ന പശ്ചാത്തലത്തിൽ ‘ആരാധിക്കുക’ ക്രിയയുടെ ശക്തി ഏറ്റവും നന്നായി നൽകുന്നു; അതിനപ്പുറമുള്ള സിദ്ധാന്തവിവരണം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന ആദരപൂർണ മലയാളം. ദൈവത്തെ സൂചിപ്പിക്കുന്ന അപ്രകട കർത്താവിന് ‘അവിടുന്ന്’ എന്നും ദൈവവചനപ്രവൃത്തിക്ക് ‘അരുളിച്ചെയ്യുന്നു’ എന്നും ഉപയോഗിച്ചു. ‘ആദ്യജാതൻ’, ‘ആരാധിക്കുക’ എന്നീ ദൈവശാസ്ത്രഭാരമുള്ള പദങ്ങൾ മൂലത്തിന്റെ അനുരണനം നിലനിർത്തുന്നു; വിഭാഗീയ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
