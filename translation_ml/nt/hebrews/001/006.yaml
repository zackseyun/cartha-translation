  to: 'അവൻ ആദ്യജാതനെ വീണ്ടും ലോകത്തിലേക്കു കൊണ്ടുവരുമ്പോൾ[a] ഇപ്രകാരം പറയുന്നു: “ദൈവത്തിന്റെ ദൂതന്മാരെല്ലാം[b] അവനെ ആരാധിക്കട്ടെ.”'
