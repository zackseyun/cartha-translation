    [a] അഥവാ, “വീണ്ടും, അവിടുന്ന് ആദ്യജാതനെ ലോകത്തിലേക്കു കൊണ്ടുവരുമ്പോൾ ഇങ്ങനെ അരുളിച്ചെയ്യുന്നു: ‘ദൈവത്തിന്റെ ദൂതന്മാരെല്ലാം അവനെ ആരാധിക്കട്ടെ.’” ‘വീണ്ടും’ എന്ന ഗ്രീക്ക് ക്രിയാവിശേഷണം ‘കൊണ്ടുവരുന്നു’ എന്നതിനോടോ ‘അരുളിച്ചെയ്യുന്നു’ എന്നതിനോടോ ചേർത്തു മനസ്സിലാക്കാം.


