id: HEB.1.13
reference: Hebrews 1:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πρὸς τίνα δὲ τῶν ἀγγέλων εἴρηκέν ποτε· Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ὑποπόδιον τῶν ποδῶν σου;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/013.yaml
  text: But to which of the angels has he ever said[a], ‘Sit at my right hand until I make your enemies a footstool for your feet’?”
translation:
  language: ml
  text: 'എന്നാൽ ദൂതന്മാരിൽ ആരോടാണ് അവിടുന്ന് എപ്പോഴെങ്കിലും പറഞ്ഞിട്ടുള്ളത്: “ഞാൻ നിന്റെ ശത്രുക്കളെ നിന്റെ പാദങ്ങൾക്കു പാദപീഠമാക്കുന്നതുവരെ നീ എന്റെ വലത്തുഭാഗത്ത് ഇരിക്കുക”?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “ഞാൻ നിന്റെ ശത്രുക്കളെ നിന്റെ പാദങ്ങൾക്കു കീഴിൽ ആക്കുന്നതുവരെ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς τίνα δὲ τῶν ἀγγέλων
  choice: എന്നാൽ ദൂതന്മാരിൽ ആരോടാണ്
  rationale: πρός with τίνα after the verb of speaking means ‘to whom’; δέ marks the contrast with the Son’s unique status in the preceding argument.
- source_word: εἴρηκέν ποτε
  choice: എപ്പോഴെങ്കിലും ഇങ്ങനെ പറഞ്ഞിട്ടുള്ളത്
  rationale: The perfect εἴρηκεν is represented by ‘പറഞ്ഞിട്ടുള്ളത്,’ retaining the continuing relevance of the utterance, while ποτέ is ‘എപ്പോഴെങ്കിലും.’ ‘ഇങ്ങനെ’ naturally introduces the direct quotation without adding interpretive content.
- source_word: Κάθου
  choice: ഇരിക്കുക
  rationale: A direct, dignified modern Malayalam imperative that preserves the command without making it passive or overly colloquial.
- source_word: ἐκ δεξιῶν μου
  choice: എന്റെ വലത്തുഭാഗത്ത്
  rationale: This fixed enthronement expression is locative and denotes the position of honor at God’s right side; the Malayalam idiom is clear and natural.
- source_word: ἕως ἂν θῶ
  choice: ഞാൻ … ആക്കുന്നതുവരെ
  rationale: The future contingency expressed by ἕως ἂν with the subjunctive is naturally conveyed by the Malayalam ‘-ുന്നതുവരെ’; ‘ആക്കുക’ fits the predicate metaphor ‘footstool.’
- source_word: τοὺς ἐχθρούς σου
  choice: നിന്റെ ശത്രുക്കളെ
  rationale: A direct rendering of the plural object.
- source_word: ὑποπόδιον τῶν ποδῶν σου
  choice: നിന്റെ പാദങ്ങൾക്ക് പാദപീഠം
  rationale: Preserves the scriptural metaphor of royal subjugation rather than replacing it with an explanatory paraphrase.
theological_decisions:
- issue: സങ്കീർത്തനം 110:1-ലെ രാജാഭിഷേകവാക്യത്തിന്റെ ക്രിസ്തുസംബന്ധമായ ശക്തി
  choice: പുത്രനോടു മാത്രം അഭിസംബോധന ചെയ്യുന്ന നേരിട്ടുള്ള വാക്യമായി രാജാസനാരോഹണത്തിന്റെയും ശത്രുക്കളുടെ കീഴടക്കത്തിന്റെയും ദൃശ്യഭാഷ നിലനിർത്തി.
  alternative: ‘ഞാൻ നിന്റെ ശത്രുക്കളെ പൂർണമായി പരാജയപ്പെടുത്തുന്നതുവരെ’ എന്ന വിശദീകരണപരമായ പരാവർത്തനം.
  rationale: എബ്രായലേഖനത്തിന്റെ വാദം പുത്രനും ദൂതന്മാരും തമ്മിലുള്ള വ്യത്യാസത്തിലും ഉദ്ധരണിയുടെ കൃത്യമായ ദൃശ്യഭാഷയിലുമാണ് ആശ്രയിക്കുന്നത്; അതിനാൽ രൂപകം വ്യാഖ്യാനിച്ച് ലഘൂകരിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ആദരപൂർണ മലയാളം. ദൈവത്തെ സൂചിപ്പിക്കുന്ന കർത്താവിന് ‘അവിടുന്ന്’ ഉപയോഗിച്ചു; ഉദ്ധരണിയിൽ മൂലഭാഷയിലെ ഏകവചന രണ്ടാംപുരുഷ അഭിസംബോധന നിലനിർത്തി. പാദപീഠരൂപകം വിശദീകരിച്ച് ഇല്ലാതാക്കാതെ സംരക്ഷിച്ചു.
