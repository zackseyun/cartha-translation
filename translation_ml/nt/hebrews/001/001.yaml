lexical_decisions:
- source_word: Πολυμερῶς
  choice: പല ഭാഗങ്ങളായും
  rationale: വെളിപ്പാട് പല ഭാഗങ്ങളിലോ അംശങ്ങളിലോ ലഭിച്ചതെന്ന ആശയം നിലനിർത്തുകയും, തുടർന്ന് വരുന്ന πολυτρόπως എന്ന പദത്തിന്റെ ‘വിധങ്ങൾ’ എന്ന അർഥത്തിൽനിന്ന് ഇതിനെ വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: πολυτρόπως
  choice: പല വിധങ്ങളിലായും
  rationale: ദൈവം സംസാരിച്ച രീതികളിലെ വൈവിധ്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: πάλαι
  choice: പണ്ടുകാലത്ത്
  rationale: അതിനുമുമ്പുള്ള വിദൂരകാലത്തെ സൂചിപ്പിക്കുന്ന, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ പ്രയോഗം.
- source_word: ὁ θεὸς
  choice: ദൈവം
  rationale: ഗ്രീക്കിലെ കർത്താവിനെ നേരിട്ട് പ്രതിനിധാനം ചെയ്യുന്നു.
- source_word: λαλήσας
  choice: അരുളിച്ചെയ്തു
  rationale: ദൈവത്തിന്റെ പ്രവാചകവചനത്തെ സൂചിപ്പിക്കാൻ മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ക്രിയ; ഗ്രീക്കിൽ ഇത് 1:2-ലെ മുഖ്യക്രിയയുമായി ബന്ധപ്പെടുന്ന ഭൂതകാല ക്രിയാവിശേഷരൂപമാണെങ്കിലും, ഒറ്റ വാക്യത്തിന്റെ വായനാസൗകര്യത്തിനായി സമാപികാക്രിയയായി നൽകി.
- source_word: τοῖς πατράσιν
  choice: പിതാക്കന്മാരോട്
  rationale: ‘പിതാക്കന്മാർ’ എന്ന ഉറവിടഭാഷയിലെ ലിംഗസൂചകവും ഉടമ്പടി-ചരിത്രപരവുമായ പദപ്രയോഗം നിലനിർത്തുന്നു; ഗ്രീക്കിൽ ‘നമ്മുടെ’ എന്ന സർവനാമമില്ല.
- source_word: ἐν τοῖς προφήταις
  choice: പ്രവാചകന്മാരിലൂടെ
  rationale: ἐν എന്നതിന്റെ ഇവിടെ പ്രസക്തമായ മാധ്യമാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; അക്ഷരാർഥത്തിലുള്ള ‘പ്രവാചകന്മാരിൽ’ എന്നതിനെക്കാൾ അർഥം വ്യക്തമാണ്.
theological_decisions:
- issue: എബ്രായർ 1:2-നോടുള്ള ബന്ധത്തിൽ λαλήσας എന്ന ക്രിയാവിശേഷരൂപത്തിന്റെ പരിഭാഷ
  choice: 1:1-ൽ ‘അരുളിച്ചെയ്തു’ എന്ന സമാപികാക്രിയ ഉപയോഗിച്ച്, മുൻകാല വെളിപ്പാടെന്ന സമയസൂചന നിലനിർത്തുക.
  alternative: ‘അരുളിച്ചെയ്ത ദൈവം...’ എന്ന അപൂർണമായി തോന്നാവുന്ന ക്രിയാവിശേഷഘടന നിലനിർത്തുക.
  rationale: ഗ്രീക്ക് വാക്യഘടന 1:2-ൽ പൂർത്തിയാകുന്നുവെങ്കിലും, വാക്യം ഒറ്റയ്ക്ക് വായിക്കുമ്പോൾ മലയാളത്തിൽ അസ്വാഭാവികമായ അപൂർണത ഒഴിവാക്കുന്നു. അതേസമയം മുൻകാല സംസാരവും 1:2-ലെ തുടർന്നുള്ള സംസാരവും തമ്മിലുള്ള വ്യത്യാസം മുൻകൂട്ടി വ്യാഖ്യാനിച്ച് തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായ വായനാശൈലിയും പിന്തുടർന്നു. ‘പല ഭാഗങ്ങളായും പല വിധങ്ങളിലായും’ എന്ന സമാന്തരഘടന ഉറവിടത്തിലെ രണ്ട് വ്യത്യസ്ത ക്രിയാവിശേഷണങ്ങളുടെ അർഥവ്യത്യാസം നിലനിർത്തുന്നു. ‘അരുളിച്ചെയ്തു’ ദൈവവചനത്തിന്റെ സന്ദർഭത്തിന് യോജിക്കുന്നതായിരുന്നാലും അതിപുരാതനമായ വാക്യഘടന ഒഴിവാക്കി.
