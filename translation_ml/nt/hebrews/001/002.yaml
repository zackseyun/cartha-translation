id: HEB.1.2
reference: Hebrews 1:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐπ’ ἐσχάτου τῶν ἡμερῶν τούτων ἐλάλησεν ἡμῖν ἐν υἱῷ, ὃν ἔθηκεν κληρονόμον πάντων, δι’ οὗ καὶ ⸂ἐποίησεν τοὺς αἰῶνας⸃·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/002.yaml
  text: in these last days he has spoken to us in a Son[a], whom he appointed heir of all things[b], through whom he also made the ages.
translation:
  language: ml
  text: ഈ അവസാന നാളുകളിൽ അവൻ പുത്രനിൽ[a] നമ്മോടു സംസാരിച്ചു. ആ പുത്രനെ അവൻ എല്ലാറ്റിന്റെയും അവകാശിയായി നിയമിച്ചു; അവൻ മുഖാന്തരം യുഗങ്ങളെയും[b] ഉണ്ടാക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരു പുത്രൻ മുഖാന്തരം.’ ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘പുത്രനിൽ’ എന്നാണ്; ‘പുത്രൻ’ എന്നതിന് മുമ്പ് article ഇല്ല. ദൈവത്തിന്റെ സംസാരത്തിന്റെ രീതിയെയും അതിന്റെ പരമമായ സ്വഭാവത്തെയും ഈ പ്രയോഗം ഊന്നിക്കാട്ടുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘പ്രപഞ്ചത്തെയും’ അല്ലെങ്കിൽ ‘ലോകങ്ങളെയും.’ ‘യുഗങ്ങൾ’ എന്ന ഗ്രീക്ക് പദം യുഗങ്ങളെ തന്നെയും, വിപുലമായ അർഥത്തിൽ, മുഴുവൻ സൃഷ്ടക്രമത്തെയും സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπ’ ἐσχάτου τῶν ἡμερῶν τούτων
  choice: ഈ അവസാന നാളുകളിൽ
  rationale: കാലസൂചനയുടെ അന്ത്യകാലപരമായ ഊന്നൽ നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കാവുന്ന പ്രയോഗം.
- source_word: ἐλάλησεν ἡμῖν
  choice: നമ്മോടു സംസാരിച്ചു
  rationale: ഗ്രീക്ക് aorist സൂചിപ്പിക്കുന്ന പൂർത്തിയായ സംസാരപ്രവൃത്തിയെ മലയാളത്തിലെ സ്വാഭാവിക ഭൂതകാലരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἐν υἱῷ
  choice: പുത്രനിൽ
  rationale: ἐν എന്നതിന്റെ ‘-ൽ’ ഭാവവും ഗ്രീക്കിൽ υἱῷ-ന് നിർദേശകപദമില്ലെന്ന സവിശേഷതയും കഴിയുന്നത്ര നിലനിർത്തുന്നു. മലയാളത്തിന് article വ്യവസ്ഥയില്ലാത്തതിനാൽ ‘ഒരു’ ചേർത്ത് അനിശ്ചിതത്വം അധികമായി ചുമത്തുന്നില്ല.
- source_word: ὃν ἔθηκεν κληρονόμον πάντων
  choice: ആ പുത്രനെ അവൻ എല്ലാറ്റിന്റെയും അവകാശിയായി നിയമിച്ചു
  rationale: τίθημι ഇവിടെ ഒരു സ്ഥാനത്തേക്ക് നിയമിക്കുക എന്ന അർഥത്തിലാണ്; πάντων എന്നതിന്റെ സമഗ്രവ്യാപ്തി ‘എല്ലാറ്റിന്റെയും’ എന്നതിൽ നിലനിൽക്കുന്നു. ബന്ധസർവനാമത്തിനു പകരം ‘ആ പുത്രനെ’ എന്നത് മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: δι’ οὗ
  choice: അവൻ മുഖാന്തരം
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന ഇടനിലക്കാരനായ പ്രവർത്തകന്റെ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: ἐποίησεν
  choice: ഉണ്ടാക്കി
  rationale: ποιέω എന്ന വിശാലമായ ക്രിയയെ ‘സൃഷ്ടിച്ചു’ എന്ന കൂടുതൽ സവിശേഷമായ പദത്തിലേക്ക് ചുരുക്കാതെ അവതരിപ്പിക്കുന്നു.
- source_word: τοὺς αἰῶνας
  choice: യുഗങ്ങളെയും
  rationale: αἰῶνες എന്ന പദത്തിന്റെ കാലപരമായ രൂപവും സൃഷ്ടക്രമത്തിലേക്കു വ്യാപിക്കാവുന്ന വിശാലതയും നിലനിർത്തുന്നു; പ്രപഞ്ചം എന്ന വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: ἐν υἱῷ എന്നതിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ ഊന്നൽ
  choice: ‘പുത്രനിൽ’ എന്ന് പരിഭാഷപ്പെടുത്തി
  alternative: ‘ഒരു പുത്രൻ മുഖാന്തരം’ അല്ലെങ്കിൽ ‘തന്റെ പുത്രൻ മുഖാന്തരം’
  rationale: ഗ്രീക്കിലെ article ഇല്ലാത്ത രൂപവും ἐν എന്നതിന്റെ രീതിയോ മണ്ഡലമോ സൂചിപ്പിക്കുന്ന ഭാവവും മായ്ച്ചുകളയുന്നില്ല. അതേസമയം അടുത്ത വാക്യഭാഗത്തിലെ ‘ആ പുത്രനെ’ എന്ന പരാമർശം വ്യക്തിയെ തിരിച്ചറിയിക്കുന്നു; ഗ്രീക്കിലില്ലാത്ത ഉടമസ്ഥസർവനാമം ചേർക്കുന്നുമില്ല.
- issue: τοὺς αἰῶνας എന്നതിന്റെ വ്യാപ്തിയും സൃഷ്ടിയിൽ പുത്രന്റെ പങ്കും
  choice: മുഖ്യപാഠത്തിൽ ‘യുഗങ്ങൾ’
  alternative: ‘പ്രപഞ്ചം,’ ‘ലോകങ്ങൾ,’ അല്ലെങ്കിൽ ‘സൃഷ്ടക്രമം’
  rationale: മൂലപദത്തിന്റെ കാലപരവും പ്രപഞ്ചപരവുമായി തുറന്നിരിക്കുന്ന അർഥവ്യാപ്തി നിലനിർത്തുന്നു. പുത്രൻ മുഖാന്തരമുള്ള ദൈവിക സൃഷ്ടിപ്രവർത്തനം വ്യക്തമാക്കുമ്പോഴും അതിനെ കേവലം സ്ഥലപരമായ ‘പ്രപഞ്ചം’ എന്നതിലേക്ക് ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പുത്രനിൽ’ എന്നത് ഉദ്ദേശപൂർവം കുറച്ച് ഔപചാരികമായി നിലനിർത്തിയിരിക്കുന്നു; മൂലത്തിലെ അസാധാരണവും ദൈവശാസ്ത്രപരമായി ഭാരം വഹിക്കുന്നതുമായ പ്രയോഗം സ്വാഭാവികമാക്കുന്നതിനിടെ ഇല്ലാതാക്കാതിരിക്കാനാണിത്. ‘യുഗങ്ങൾ’ സാധാരണ വായനക്കാർക്ക് വിശദീകരണം ആവശ്യമാകാമെന്നതിനാൽ അടിക്കുറിപ്പ് ചേർത്തിരിക്കുന്നു.
