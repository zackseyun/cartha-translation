id: HEB.9.21
reference: Hebrews 9:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ τὴν σκηνὴν δὲ καὶ πάντα τὰ σκεύη τῆς λειτουργίας τῷ αἵματι ὁμοίως ἐράντισεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/021.yaml
  text: And likewise he sprinkled with the blood both the tabernacle and all the vessels of the ministry[a][b].
translation:
  language: ml
  text: അതുപോലെതന്നെ, സമാഗമകൂടാരത്തെയും[a] ശുശ്രൂഷയ്ക്കുള്ള എല്ലാ ഉപകരണങ്ങളെയും[b] അവൻ രക്തംകൊണ്ട് തളിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കൂടാരം.’ ഗ്രീക്ക് പദത്തിന് ‘കൂടാരം’ എന്ന് അർഥമാകാം; എന്നാൽ ഇവിടെ അത് വിശുദ്ധ സമാഗമകൂടാരത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ശുശ്രൂഷയുടെ എല്ലാ സാമഗ്രികളെയും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: σκηνή
  choice: സമാഗമകൂടാരം
  rationale: ഈ സന്ദർഭത്തിൽ ഇത് ഒരു സാധാരണ കൂടാരത്തെയല്ല, മോശെയുടെ കാലത്തെ വിശുദ്ധ കൂടാരത്തെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ‘സമാഗമകൂടാരം’ ആ ആരാധനാസന്ദർഭം വ്യക്തമായി നൽകുന്നു.
- source_word: σκεύη
  choice: ഉപകരണങ്ങൾ
  rationale: ആരാധനാശുശ്രൂഷയിൽ ഉപയോഗിച്ചിരുന്ന വിവിധ വസ്തുക്കളെ ഉൾക്കൊള്ളുന്ന വിശാലവും സ്വാഭാവികവുമായ പദമാണിത്; ‘പാത്രങ്ങൾ’ എന്നു പറഞ്ഞാൽ അർഥം അനാവശ്യമായി ചുരുങ്ങാം.
- source_word: λειτουργία
  choice: ശുശ്രൂഷ
  rationale: ഇവിടെ പദം പൊതുവായ സേവനത്തെയല്ല, പുരോഹിതപരവും ആരാധനാപരവുമായ വിശുദ്ധ ശുശ്രൂഷയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: αἷμα
  choice: രക്തം
  rationale: യാഗരക്തത്തെ അക്ഷരാർഥത്തിൽ സൂചിപ്പിക്കുന്നതിനാൽ നേരിട്ടുള്ള പരിഭാഷ നിലനിർത്തുന്നു.
- source_word: ὁμοίως
  choice: അതുപോലെതന്നെ
  rationale: മുൻവാക്യത്തിൽ വിവരിച്ച തളിക്കലുമായി ഈ പ്രവൃത്തിയെ ബന്ധിപ്പിക്കുന്ന താരതമ്യശക്തി വ്യക്തമാക്കുന്നു.
- source_word: ἐράντισεν
  choice: തളിച്ചു
  rationale: ആചാരപരമായി രക്തം പ്രയോഗിക്കുന്ന പ്രവൃത്തിക്കുള്ള വ്യക്തവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളപ്രയോഗമാണിത്.
- source_word: δὲ
  choice: വാക്യത്തിന്റെ പ്രവാഹത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇവിടെ δέ നേരിയ ബന്ധകമാണ്; ‘അതുപോലെതന്നെ’ എന്ന തുടക്കവും മലയാള വാക്യഘടനയും ആ ബന്ധം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: πάντα τὰ σκεύη
  choice: എല്ലാ ഉപകരണങ്ങളെയും
  rationale: πάντα നൽകുന്ന സമഗ്രത നിലനിർത്തുകയും ബഹുവചനത്തെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: പുറപ്പാട് പുസ്തകത്തിലെ മോശൈക ആചാരങ്ങളുമായുള്ള ഈ വാക്യത്തിന്റെ ബന്ധം
  choice: മോശെ സമാഗമകൂടാരത്തെയും അതിലെ ശുശ്രൂഷാ ഉപകരണങ്ങളെയും രക്തംകൊണ്ട് തളിച്ചതായി വാക്യം പറയുന്നതുപോലെ നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: പുറപ്പാടിലെ വിവരണങ്ങളുമായി പൊരുത്തപ്പെടുത്താൻ ചരിത്രപരമായ വിശദീകരണമോ അധികവിവരമോ മുഖ്യപാഠത്തിൽ ചേർക്കുക.
  rationale: ഗ്രീക്ക് പാഠം നൽകുന്ന സംഗ്രഹപ്രസ്താവന അതേപടി നിലനിർത്തണം; അന്തർപാഠപരമായ ചോദ്യങ്ങൾ പരിഭാഷയിൽ മറച്ചുവയ്ക്കുകയോ പരിഹരിക്കുകയോ ചെയ്യരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ആരാധനാസന്ദർഭം നിലനിർത്താൻ ‘സമാഗമകൂടാരം’, ‘ശുശ്രൂഷ’ എന്നീ പരിചിതമായ വിശുദ്ധഗ്രന്ഥപദങ്ങൾ ഉപയോഗിച്ചെങ്കിലും അത്യന്തം സാങ്കേതികമായ ഭാഷ ഒഴിവാക്കി.
