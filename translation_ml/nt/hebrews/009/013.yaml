source:
  edition: SBLGNT
  text: εἰ γὰρ τὸ αἷμα ⸂τράγων καὶ ταύρων⸃ καὶ σποδὸς δαμάλεως ῥαντίζουσα τοὺς κεκοινωμένους ἁγιάζει πρὸς τὴν τῆς σαρκὸς καθαρότητα,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/013.yaml
  text: For if the blood of goats and bulls[a], and the ashes of a heifer that sprinkle those who have been defiled, sanctify for the purification of the flesh[d][c][b],
translation:
  language: ml
  text: ആട്ടുകൊറ്റന്മാരുടെയും കാളകളുടെയും രക്തവും, അശുദ്ധരായവരുടെമേൽ തളിക്കുന്ന പെൺപശുവിന്റെ ചാരവും, ജഡത്തിന്റെ ശുദ്ധിക്കായി അവരെ വിശുദ്ധീകരിക്കുന്നുവെങ്കിൽ,[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘അശുദ്ധർ’ എന്നു പറയുന്നത് ആചാരപരമായി അശുദ്ധരായവരെയാണ്.
    reason: lexical_alternative
  - marker: b
    text: അതായത്, പഴയ ഉടമ്പടിയിലെ ആചാരങ്ങൾ നൽകുന്ന ബാഹ്യവും ശരീരസംബന്ധവുമായ ശുദ്ധി.
    reason: cultural_note
  - marker: c
    text: സംഖ്യ 19-ൽ വിവരിക്കുന്ന പെൺപശുവിന്റെ ചാരം ഉപയോഗിച്ചുള്ള ശുദ്ധീകരണാചാരത്തിലേക്കുള്ള സൂചന.
    reason: cross_reference
lexical_decisions:
- source_word: αἷμα
  choice: രക്തം
  rationale: യാഗാചാരസന്ദർഭത്തിലെ നേരിട്ടുള്ള അർഥം സ്വാഭാവികമായും കൃത്യമായും നൽകുന്നു.
- source_word: τράγων καὶ ταύρων
  choice: ആട്ടുകൊറ്റന്മാരുടെയും കാളകളുടെയും
  rationale: ആൺമൃഗങ്ങളെ സൂചിപ്പിക്കുന്ന യാഗസംബന്ധമായ പദങ്ങളുടെ അർഥം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: σποδὸς δαμάλεως
  choice: പശുക്കിടാവിന്റെ ചാരം
  rationale: സംഖ്യ 19-ലെ പെൺകിടാവിന്റെ ശുദ്ധീകരണാചാരത്തിലേക്കുള്ള സൂചന നിലനിർത്തുന്നു; മലയാളത്തിൽ സ്വാഭാവികവും ലിംഗസൂചനയിൽ അതിരുകടക്കാത്തതുമാണ്.
- source_word: ῥαντίζουσα
  choice: അശുദ്ധരായവരുടെമേൽ തളിക്കപ്പെടുന്ന
  rationale: ഗ്രീക്കിൽ വ്യാകരണപരമായി ‘ചാരം’ തളിക്കുന്നതായി പറഞ്ഞിട്ടുണ്ടെങ്കിലും ആചാരത്തിൽ ചാരകലർന്ന വെള്ളമാണ് ആളുകളുടെമേൽ തളിക്കുന്നത്. മലയാളത്തിൽ തെറ്റായ പ്രവർത്തകസൂചന ഒഴിവാക്കി ആചാരപ്രവർത്തനം സ്വാഭാവികമായി നൽകുന്നു; ഇതിന്റെ രൂപഭേദം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: τοὺς κεκοινωμένους
  choice: അശുദ്ധരായവർ
  rationale: ഇവിടെ κοινόω ധാർമിക ദുഷ്ടതയെയല്ല, ആചാരപരമായ അശുദ്ധിയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἁγιάζει
  choice: വിശുദ്ധീകരിക്കുന്നു
  rationale: പഴയ ഉടമ്പടിയിലെ ആചാരപരമായ വേർതിരിക്കലും ശുദ്ധീകരണഫലവും സൂചിപ്പിക്കുന്ന ദൈവശാസ്ത്രപരമായ പദഭാവം നിലനിർത്തുന്നു.
- source_word: πρὸς τὴν τῆς σαρκὸς καθαρότητα
  choice: ജഡത്തിന്റെ ശുദ്ധിക്കായി
  rationale: അടുത്ത വാക്യത്തിലെ മനസ്സാക്ഷിയുടെ ശുദ്ധീകരണത്തോടുള്ള വൈരുധ്യം കാത്തുസൂക്ഷിക്കാൻ മൂലപദത്തോട് അടുത്ത രൂപം സ്വീകരിക്കുന്നു.
- source_word: εἰ γὰρ
  choice: എങ്കിൽ
  rationale: വാക്യം 14-ൽ പൂർത്തിയാകുന്ന വ്യവസ്ഥാപരമായ താരതമ്യം സ്വാഭാവിക മലയാളത്തിൽ തുറക്കുന്നു; ‘γὰρ’ എന്ന ബന്ധത്തിന്റെ ശക്തി സന്ദർഭപ്രവാഹത്തിൽ പ്രകടമാണ്.
theological_decisions:
- issue: പഴയ ഉടമ്പടിയിലെ ആചാരങ്ങൾ ‘വിശുദ്ധീകരിക്കുന്നു’ എന്നതിന്റെ പരിധി
  choice: ബാഹ്യവും ആചാരപരവുമായ വിശുദ്ധീകരണം
  alternative: ആന്തരികമായ ധാർമികമോ ആത്മീയമോ ആയ സമ്പൂർണ പരിവർത്തനം
  rationale: ‘ജഡത്തിന്റെ ശുദ്ധി’ എന്ന പരിധിയും അടുത്ത വാക്യത്തിലെ ‘മനസ്സാക്ഷി’യുമായുള്ള വ്യത്യാസവും ആചാരപരമായ അർഥം ആവശ്യപ്പെടുന്നു.
- issue: σάρξ എന്ന പദത്തിന്റെ അർഥം
  choice: ജഡം—ബാഹ്യമായ ശരീര/ആചാര മേഖല
  alternative: പാപസ്വഭാവം
  rationale: ലേവ്യശുദ്ധീകരണാചാരമാണ് സന്ദർഭം; ഇവിടെ σάρξ ധാർമികമായ പാപസ്വഭാവത്തെ സൂചിപ്പിക്കുന്നില്ല.
- issue: ῥαντίζουσα എന്ന കർത്തൃപ്രയോഗത്തിന്റെ അവതരണം
  choice: ‘അശുദ്ധരായവരുടെമേൽ തളിക്കപ്പെടുന്ന’ എന്ന സ്വാഭാവിക കർമണിപ്രയോഗം
  alternative: ‘അശുദ്ധരായവരെ തളിക്കുന്ന ചാരം’ എന്ന ഗ്രീക്ക് വ്യാകരണത്തോട് കൂടുതൽ അടുത്ത സജീവപ്രയോഗം
  rationale: സംഖ്യ 19 പ്രകാരം ചാരം കലർത്തിയ വെള്ളമാണ് വ്യക്തികളുടെമേൽ തളിക്കുന്നത്. മൂലവാക്യത്തിന്റെ സംക്ഷിപ്ത ആചാരഭാഷയെ തെറ്റായി ചാരം തന്നെ പ്രവർത്തകനെന്ന ഭാവത്തിൽ മലയാളത്തിലാക്കാതിരിക്കാനാണ് കർമണിരൂപം; പദശഃ രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള ആരാധനാ/യാഗാചാര പദഭാവം നിലനിർത്തി. ‘ജഡം’, ‘വിശുദ്ധീകരിക്കുന്നു’ എന്നീ പദങ്ങൾ അടുത്ത വാക്യത്തിലെ ദൈവശാസ്ത്രപരമായ വൈരുധ്യം സംരക്ഷിക്കുന്നു. വാക്യം വ്യവസ്ഥാപരമായി 9:14-ലേക്ക് നീളുന്നതിനാൽ അവസാനം അർദ്ധവിരാമസദൃശമായ കോമ നിലനിർത്തി.
