review_pass:
  verdict: revise
  source_fidelity: 'The passive wording ‘അശുദ്ധരായവരുടെമേൽ തളിക്കപ്പെടുന്ന’ reverses the Greek participle’s active presentation: the ashes are described as sprinkling the defiled. Malayalam can express this naturally as ‘അശുദ്ധരായവരുടെമേൽ തളിക്കുന്ന.’ ‘പശുക്കിടാവ്’ is not a reliable equivalent for δάμαλις (‘heifer,’ a young female bovine); ‘പെൺപശു’ better preserves the sex and cultic allusion.'
  naturalness: The revised sentence is fluent modern standard Malayalam while retaining the formal, conditional syntax that continues into verse 14. Making ‘അവരെ’ explicit after ‘വിശുദ്ധീകരിക്കുന്നുവെങ്കിൽ’ also makes the understood object clear.
  terminology: ‘ആട്ടുകൊറ്റന്മാർ,’ ‘കാളകൾ,’ ‘രക്തം,’ ‘വിശുദ്ധീകരിക്കുന്നു,’ and ‘ജഡത്തിന്റെ ശുദ്ധി’ appropriately retain the sacrificial and theological register. ‘പെൺപശു’ is preferable to the ambiguous ‘പശുക്കിടാവ്.’
  issues:
  - severity: medium
    issue: The draft renders ῥαντίζουσα with a passive participle.
    rationale: 'Greek has an active participle modifying ‘ashes’: ‘ashes ... sprinkling the defiled.’ The passive says that the ashes are sprinkled on the defiled and thus alters the grammatical relation. ‘അശുദ്ധരായവരുടെമേൽ തളിക്കുന്ന’ is both active and natural Malayalam.'
  - severity: medium
    issue: ‘പശുക്കിടാവ്’ does not accurately identify δάμαλις.
    rationale: It can denote a calf rather than a heifer/young female bovine and does not clearly preserve the female referent. ‘പെൺപശു’ is clearer in modern Malayalam and maintains the Numbers 19 allusion.
  revised_text: ആട്ടുകൊറ്റന്മാരുടെയും കാളകളുടെയും രക്തവും, അശുദ്ധരായവരുടെമേൽ തളിക്കുന്ന പെൺപശുവിന്റെ ചാരവും, ജഡത്തിന്റെ ശുദ്ധിക്കായി അവരെ വിശുദ്ധീകരിക്കുന്നുവെങ്കിൽ,[a][b][c]
