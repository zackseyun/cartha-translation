    issue: The quotation-introducing participial phrase is somewhat heavy.
    rationale: ‘ഇങ്ങനെ പറഞ്ഞുകൊണ്ട്’ is less concise and less natural than ‘ഇങ്ങനെ പറഞ്ഞ്,’ with no gain in fidelity.
  - severity: medium
    issue: The existing footnote's alternative sentence is not idiomatic Malayalam.
    rationale: ‘...ഉടമ്പടിയുടെ രക്തം ഇത്’ is an unnatural nominal-clause order. A footnote should not present an unidiomatic form as a literal alternative. It can instead explain that Greek leaves the copula unexpressed, while Malayalam naturally supplies it.
  revised_text: 'ഇങ്ങനെ പറഞ്ഞ്: “ഇതാണ് ദൈവം നിങ്ങളോടു കല്പിച്ച ഉടമ്പടിയുടെ രക്തം.”[a]'
