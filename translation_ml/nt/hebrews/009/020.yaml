id: HEB.9.20
reference: Hebrews 9:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγων· Τοῦτο τὸ αἷμα τῆς διαθήκης ἧς ἐνετείλατο πρὸς ὑμᾶς ὁ θεός·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/020.yaml
  text: saying[a], “This is the blood of the covenant that God commanded for you.”
translation:
  language: ml
  text: 'ഇങ്ങനെ പറഞ്ഞ്: “ഇതാണ് ദൈവം നിങ്ങളോടു കല്പിച്ച ഉടമ്പടിയുടെ രക്തം.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ‘ആണ്’ എന്ന ബന്ധകക്രിയ പ്രത്യക്ഷമായി ഇല്ല; മലയാളത്തിൽ വാക്യം സ്വാഭാവികമാക്കാൻ അത് ചേർത്തിരിക്കുന്നു.
    reason: മൂലപാഠത്തിലെ സൂചിതമായ നാമവാക്യഘടന രേഖപ്പെടുത്തുന്നു; എന്നാൽ അശുദ്ധമായോ അസ്വാഭാവികമായോ ഒരു ബദൽ വിവർത്തനം നിർദേശിക്കുന്നില്ല.
lexical_decisions:
- source_word: λέγων
  choice: ഇങ്ങനെ പറഞ്ഞുകൊണ്ട്
  rationale: വർത്തമാനകാല കൃദന്തരൂപം മുൻവാക്യത്തിലെ പ്രവൃത്തിയോടുള്ള ബന്ധം നിലനിർത്തിക്കൊണ്ട് ഉദ്ധരണിയെ അവതരിപ്പിക്കുന്നു.
- source_word: Τοῦτο
  choice: ഇതാണ്
  rationale: ഗ്രീക്കിൽ ബന്ധകക്രിയ വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും മലയാളത്തിൽ സ്വാഭാവികമായ നാമവാക്യത്തിനായി ‘ആണ്’ ചേർക്കുന്നു; ഇത് അർഥപരമായ അധികവ്യാഖ്യാനം നൽകുന്നില്ല.
- source_word: αἷμα
  choice: രക്തം
  rationale: ബലിയർപ്പണത്തിലൂടെ ഉടമ്പടി ഉറപ്പിക്കുന്ന പശ്ചാത്തലത്തിലും മൂലപദത്തിന്റെ മൂർത്തമായ അർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: διαθήκης
  choice: ഉടമ്പടിയുടെ
  rationale: പുറപ്പാട് 24:8-ലെ പശ്ചാത്തലത്തിൽ ഇത് അന്ത്യപത്രമല്ല, ദൈവവും ജനവും തമ്മിലുള്ള ഉടമ്പടിയാണ്.
- source_word: ἧς
  choice: ഉടമ്പടിയുടെ ... ദൈവം ... കല്പിച്ച
  rationale: ബന്ധസർവനാമത്തിന്റെ ഷഷ്ഠീബന്ധം മലയാളത്തിലെ സ്വാഭാവികമായ ബന്ധവാക്യക്രമത്തിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: ἐνετείλατο
  choice: കല്പിച്ച
  rationale: ἐντέλλομαι എന്ന ക്രിയയുടെ ‘ആജ്ഞാപിക്കുക/നിർദേശിക്കുക’ എന്ന അർഥം മാന്യവും സാധാരണവുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: πρὸς ὑμᾶς
  choice: നിങ്ങളോടു
  rationale: πρός + accusative എന്നതിന്റെ നേരിട്ടുള്ള ദിശാസംബന്ധമായ അർഥം സംരക്ഷിക്കുന്നു; ‘നിങ്ങൾക്കുവേണ്ടി’ എന്നു നൽകി പ്രയോജനാർഥം അനാവശ്യമായി ഉറപ്പിക്കുന്നില്ല.
- source_word: ὁ θεός
  choice: ദൈവം
  rationale: θεός എന്ന പദത്തിന്റെ പതിവും പ്രസക്തവുമായ മലയാളരൂപം.
theological_decisions:
- issue: διαθήκη എന്ന പദത്തിന്റെ ഉടമ്പടി-സ്ഥാപന പശ്ചാത്തലത്തിലെ വിവർത്തനം
  choice: ഉടമ്പടി
  alternative: നിയമപത്രം / അന്ത്യപത്രം
  rationale: വാക്യം പുറപ്പാട് 24:8-നെ അനുസ്മരിപ്പിക്കുകയും മോശൈക ഉടമ്പടി രക്തത്താൽ സ്ഥാപിക്കപ്പെട്ടതിനെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു; ‘അന്ത്യപത്രം’ എന്ന നിയമപരമായ അർഥം ഈ പശ്ചാത്തലത്തിന് യോജിക്കുന്നില്ല.
- issue: Τοῦτο-യ്ക്ക് ശേഷം സൂചിതമായ ബന്ധകക്രിയ നൽകൽ
  choice: ഇതാണ്
  alternative: ഇത്, ഉടമ്പടിയുടെ രക്തം
  rationale: മലയാളത്തിൽ ഉദ്ധരണി വ്യക്തവും സ്വാഭാവികവുമാക്കാൻ ‘ആണ്’ ആവശ്യമാണ്; ഗ്രീക്കിൽ സൂചിതമായ നാമവിശേഷണപ്രസ്താവന മാത്രമേ ഇതിലൂടെ വ്യക്തമാക്കുന്നുള്ളൂ.
- issue: πρὸς ὑμᾶς എന്നതിലെ ബന്ധത്തിന്റെ സ്വഭാവം
  choice: നിങ്ങളോടു
  alternative: നിങ്ങൾക്കുവേണ്ടി
  rationale: മൂലപാഠത്തിലെ ദിശാസംബന്ധമായ രൂപം നിലനിർത്തുകയും ‘വേണ്ടി’ എന്ന പ്രയോജനാർഥ വ്യാഖ്യാനം നിർബന്ധമാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ഉടമ്പടി’, ‘രക്തം’, ‘കല്പിച്ചു’ എന്നീ പ്രധാന ബൈബിൾപദങ്ങൾ നിലനിർത്തിയപ്പോൾ വാക്യക്രമം മലയാളത്തിന് സ്വാഭാവികമാക്കി.
