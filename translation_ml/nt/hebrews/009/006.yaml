source:
  edition: SBLGNT
  text: Τούτων δὲ οὕτως κατεσκευασμένων, εἰς μὲν τὴν πρώτην σκηνὴν διὰ παντὸς εἰσίασιν οἱ ἱερεῖς τὰς λατρείας ἐπιτελοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/006.yaml
  text: With these things prepared in this way[a], the priests continually enter the first tabernacle, performing the services[b],
translation:
  language: ml
  text: ഇവയെല്ലാം ഇങ്ങനെ ഒരുക്കിയിരിക്കെ, പുരോഹിതന്മാർ ശുശ്രൂഷകൾ[b] നിർവഹിച്ചുകൊണ്ട് ഒന്നാമത്തെ കൂടാരത്തിലേക്ക്[a] നിരന്തരം പ്രവേശിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഒന്നാം വിഭാഗത്തിലേക്ക്” അല്ലെങ്കിൽ “ഒന്നാം മുറിയിലേക്ക്.” ഗ്രീക്കിലെ σκηνή എന്ന പദത്തിന് വിശുദ്ധകൂടാരത്തെ മുഴുവനായോ, ഈ സന്ദർഭത്തിൽ അതിന്റെ ഒന്നാം വിഭാഗത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “ആരാധനാകർമങ്ങൾ നിർവഹിച്ചുകൊണ്ട്” അല്ലെങ്കിൽ “ആചാരപരമായ ചുമതലകൾ നിറവേറ്റിക്കൊണ്ട്” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτων δὲ οὕτως κατεσκευασμένων
  choice: ഇവയെല്ലാം ഇങ്ങനെ ഒരുക്കിയിരിക്കെ
  rationale: തുടർന്നുവരുന്ന പ്രവർത്തനത്തിന്റെ പശ്ചാത്തലം സൂചിപ്പിക്കുന്ന genitive absolute സ്വാഭാവികമായ മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു. മുൻവാക്യങ്ങളിൽ വിവരിച്ച വിശുദ്ധകൂടാരവും ഉപകരണങ്ങളും ക്രമപ്പെടുത്തിയിരിക്കുന്നതിനെ ‘ഒരുക്കിയിരിക്കെ’ വ്യക്തമാക്കുന്നു; δὲ-യുടെ മൃദുവായ സംക്രമണബലം സന്ദർഭത്തിലൂടെ ലഭിക്കുന്നതിനാൽ കൃത്രിമമായ ഒരു വ്യവഹാരപദം ചേർത്തിട്ടില്ല.
- source_word: εἰς μὲν τὴν πρώτην σκηνὴν
  choice: ഒന്നാമത്തെ കൂടാരത്തിലേക്ക്
  rationale: σκηνήയുടെ ‘കൂടാരം’ എന്ന അടിസ്ഥാനവും മോശെയുടെ വിശുദ്ധകൂടാരവുമായി ബന്ധപ്പെട്ട ആരാധനാപരമായ പശ്ചാത്തലവും നിലനിർത്തുന്നു. ഇവിടെ ഉദ്ദേശിക്കുന്നത് വിശുദ്ധകൂടാരത്തിന്റെ ഒന്നാം വിഭാഗമായിരിക്കാമെന്ന സന്ദർഭസൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: διὰ παντὸς
  choice: നിരന്തരം
  rationale: ഓരോ നിമിഷവും അകത്ത് തന്നെയുണ്ടായിരുന്നു എന്നല്ല, പതിവായി ആവർത്തിച്ചിരുന്ന പുരോഹിതശുശ്രൂഷയെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്. അടുത്ത വാക്യത്തിലെ മഹാപുരോഹിതന്റെ പരിമിത പ്രവേശനവുമായി ഉള്ള വൈരുധ്യവും ഇത് നിലനിർത്തുന്നു.
- source_word: εἰσίασιν
  choice: പ്രവേശിക്കുന്നു
  rationale: വർത്തമാനകാല ക്രിയയുടെ പതിവായി ആവർത്തിക്കുന്ന പ്രവർത്തനബലം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: οἱ ἱερεῖς
  choice: പുരോഹിതന്മാർ
  rationale: അടുത്ത വാക്യത്തിലെ മഹാപുരോഹിതനിൽനിന്ന് വേർതിരിച്ചറിയപ്പെടുന്ന സാധാരണ പുരോഹിതന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: τὰς λατρείας
  choice: ശുശ്രൂഷകൾ
  rationale: വിശുദ്ധമന്ദിരത്തിൽ നിർവഹിച്ചിരുന്ന ആരാധനാപരവും ആചാരപരവുമായ സേവനങ്ങളെ ലളിതവും മാന്യവുമായ ഭാഷയിൽ സൂചിപ്പിക്കുന്നു; സാധ്യതയുള്ള കൂടുതൽ വ്യക്തമായ അർഥങ്ങൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἐπιτελοῦντες
  choice: നിർവഹിച്ചുകൊണ്ട്
  rationale: പുരോഹിതന്മാർ പ്രവേശിക്കുമ്പോൾ ചെയ്യുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന participle-നെ മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുകയും നിർദേശിക്കപ്പെട്ട ശുശ്രൂഷകൾ നടത്തുക എന്ന അർഥം നൽകുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: വിശുദ്ധസ്ഥലത്തിന്റെ പശ്ചാത്തലത്തിൽ σκηνή എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: കൂടാരം
  alternative: ഒന്നാം വിഭാഗം / ഒന്നാം മുറി
  rationale: എബ്രായർ 9 മോശെയുടെ വിശുദ്ധകൂടാരത്തെ വിശദീകരിക്കുന്നതിനാൽ ‘കൂടാരം’ പഴയനിയമത്തിലെ ആരാധനാപരമായ പശ്ചാത്തലം നിലനിർത്തുന്നു. അതേസമയം ഇവിടെ അതിന്റെ ആദ്യവിഭാഗമാണ് ഉദ്ദേശ്യമെന്ന സന്ദർഭാർഥം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
- issue: പുരോഹിതശുശ്രൂഷയിൽ διὰ παντὸς എന്നതിന്റെ ബലം
  choice: നിരന്തരം
  alternative: പതിവായി / എല്ലായ്പോഴും
  rationale: സാധാരണ പുരോഹിതന്മാരുടെ ആവർത്തിച്ചുള്ള പ്രവേശനവും മഹാപുരോഹിതന്റെ വർഷത്തിലൊരിക്കലുള്ള പ്രവേശനവും തമ്മിലുള്ള വൈരുധ്യം നിലനിർത്തുന്നു; ഇടവിടാതെയുള്ള സാന്നിധ്യം എന്ന് അനാവശ്യമായി സൂചിപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വാക്യഘടനയാണ് ഉപയോഗിച്ചത്. ‘കൂടാരം,’ ‘പുരോഹിതന്മാർ,’ ‘ശുശ്രൂഷകൾ’ എന്നീ പദങ്ങൾ ആരാധനാപരമായ പശ്ചാത്തലം നിലനിർത്തുമ്പോഴും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നവയാണ്. മൂലപാഠത്തിലെ ആവർത്തനസ്വഭാവവും ഒന്നാം വിഭാഗത്തെക്കുറിച്ചുള്ള അർഥസാദ്ധ്യതയും അതിരുകടന്ന് വ്യാഖ്യാനിക്കാതെ സംരക്ഷിച്ചു.
