  rationale: 'The revision supplies “പ്രവേശിച്ചത്” to make explicit in Malayalam the verb understood from the preceding context and retained elliptically in Greek. This yields a natural negated-purpose statement: Christ did not enter in order to offer himself repeatedly. The present-tense customary action of the high priest (“പ്രവേശിക്കുന്നതുപോലെ”), the annual recurrence, and the contrastive “blood not his own” are retained. The footnote is preserved with only punctuation adjusted for modern Malayalam style.'
