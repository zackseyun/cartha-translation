id: HEB.9.25
reference: Hebrews 9:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐδ’ ἵνα πολλάκις προσφέρῃ ἑαυτόν, ὥσπερ ὁ ἀρχιερεὺς εἰσέρχεται εἰς τὰ ἅγια κατ’ ἐνιαυτὸν ἐν αἵματι ἀλλοτρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/025.yaml
  text: Nor was it so that he might offer himself many times[a], just as the high priest enters the holy places year by year with blood not his own,
translation:
  language: ml
  text: മഹാപുരോഹിതൻ തന്റേതല്ലാത്ത രക്തവുമായി ആണ്ടുതോറും വിശുദ്ധസ്ഥലങ്ങളിലേക്ക്[a] പ്രവേശിക്കുന്നതുപോലെ, അവൻ തന്നെത്തന്നെ പലവട്ടം അർപ്പിക്കുന്നതിനായുമല്ല പ്രവേശിച്ചത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വിശുദ്ധമന്ദിരത്തിലേക്ക്.’ ഗ്രീക്കിൽ അക്ഷരാർഥം ‘വിശുദ്ധസ്ഥലങ്ങളിലേക്ക്’ എന്നാണ്; ഈ ആരാധനാക്രമസന്ദർഭത്തിൽ ചിലർ ഇതിനെ കൂടുതൽ നിർദ്ദിഷ്ടമായി ‘അതിവിശുദ്ധസ്ഥലത്തിലേക്ക്’ എന്നു മനസ്സിലാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδ’ ἵνα
  choice: അർപ്പിക്കേണ്ടതിനുമായിരുന്നില്ല അത്
  rationale: മുൻവാക്യത്തിൽനിന്നു തുടരുന്ന നിഷേധാത്മക ഉദ്ദേശ്യത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ക്രിസ്തുവിന്റെ പ്രവേശനം ആവർത്തിച്ചുള്ള സ്വയം-അർപ്പണത്തിനായിരുന്നില്ല എന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: πολλάκις
  choice: പലവട്ടം
  rationale: ആണ്ടുതോറുമുള്ള ആവർത്തനത്തോടുള്ള വൈരുധ്യം നേരിട്ടും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: προσφέρῃ ἑαυτόν
  choice: അവൻ തന്നെത്തന്നെ … അർപ്പിക്കേണ്ടതിന്
  rationale: προσφέρω എന്നതിന്റെ യാഗാർപ്പണസംബന്ധമായ അർഥവും ἑαυτόν എന്നതിന്റെ ആത്മവാചക ഊന്നലും സംരക്ഷിക്കുന്നു.
- source_word: ὥσπερ
  choice: പ്രവേശിക്കുന്നതുപോലെ
  rationale: ക്രിസ്തുവിന്റെ പ്രവൃത്തിയും മഹാപുരോഹിതന്റെ പതിവായ പ്രവൃത്തിയും തമ്മിലുള്ള താരതമ്യം വ്യക്തമായി അടയാളപ്പെടുത്തുന്നു.
- source_word: ὁ ἀρχιερεὺς
  choice: മഹാപുരോഹിതൻ
  rationale: യഹൂദ ആരാധനാക്രമത്തിലെ ഈ പദവിക്കുള്ള പ്രചാരത്തിലുള്ള കൃത്യമായ മലയാളപദം.
- source_word: εἰσέρχεται
  choice: പ്രവേശിക്കുന്നു
  rationale: പതിവായി നടക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് വർത്തമാനകാലഭാവം നിലനിർത്തുന്നു.
- source_word: εἰς τὰ ἅγια
  choice: വിശുദ്ധസ്ഥലങ്ങളിലേക്ക്
  rationale: ഗ്രീക്കിലെ നപുംസകലിംഗ ബഹുവചനം കഴിയുന്നത്ര നേരിട്ട് നിലനിർത്തുന്നു; സന്ദർഭത്തെ ‘അതിവിശുദ്ധസ്ഥലം’ എന്നു മാത്രം നിർണ്ണയിച്ച് ചുരുക്കുന്നില്ല.
- source_word: κατ’ ἐνιαυτὸν
  choice: ആണ്ടുതോറും
  rationale: എല്ലാ വർഷവും ആവർത്തിക്കുന്ന ആരാധനാക്രമത്തെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ἐν αἵματι ἀλλοτρίῳ
  choice: തന്റേതല്ലാത്ത രക്തവുമായി
  rationale: രക്തം മറ്റൊന്നിന്റേതാണെന്ന അർഥവും അതിനെ ഉപയോഗിച്ചുള്ള പ്രവേശനമെന്ന ഉപകരണഭാവവും പ്രകടിപ്പിക്കുന്നു; ക്രിസ്തു തന്നെത്തന്നെ അർപ്പിക്കുന്നതുമായുള്ള വൈരുധ്യവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ക്രിസ്തുവിന്റെ അർപ്പണവും ലേവ്യ മഹാപുരോഹിതന്റെ വാർഷിക പ്രവേശനവും തമ്മിലുള്ള താരതമ്യം
  choice: മഹാപുരോഹിതന്റെ ആവർത്തിച്ചുള്ള വാർഷിക പ്രവേശനത്തിന് വിപരീതമായി ക്രിസ്തു തന്നെത്തന്നെ പലവട്ടം അർപ്പിക്കേണ്ടതില്ലെന്ന നിലയിൽ വിവർത്തനം ചെയ്തു.
  alternative: ‘വിശുദ്ധസ്ഥലങ്ങൾ’ എന്നത് കൂടുതൽ നിർദ്ദിഷ്ടമായി ‘അതിവിശുദ്ധസ്ഥലം’ എന്നു നൽകാം.
  rationale: ഉടൻ ചുറ്റുമുള്ള സന്ദർഭം പഴയ ഉടമ്പടിയിലെ ആവർത്തിത ശുശ്രൂഷയും ക്രിസ്തുവിന്റെ ആവർത്തിക്കപ്പെടാത്ത അർപ്പണവും തമ്മിൽ വൈരുധ്യം സൃഷ്ടിക്കുന്നു. എന്നാൽ τὰ ἅγια എന്ന പദത്തിന്റെ പരിധി വിവർത്തനം സിദ്ധാന്തപരമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഗ്രീക്കിലെ താരതമ്യഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ഉപവാക്യം ആദ്യം വെച്ചു. അടിക്കുറിപ്പ് സൂചകം അതുമായി ബന്ധപ്പെട്ട ‘വിശുദ്ധസ്ഥലങ്ങളിലേക്ക്’ എന്ന പദത്തിന് പിന്നാലെ ചേർത്തു.
