id: HEB.9.12
reference: Hebrews 9:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐδὲ δι’ αἵματος τράγων καὶ μόσχων διὰ δὲ τοῦ ἰδίου αἵματος, εἰσῆλθεν ἐφάπαξ εἰς τὰ ἅγια, αἰωνίαν λύτρωσιν εὑράμενος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/012.yaml
  text: and not through the blood of goats and calves[a], but through his own blood, he entered once for all into the holy places, having obtained eternal redemption.
translation:
  language: ml
  text: ആൺകോലാടുകളുടെയും കാളക്കിടാക്കളുടെയും രക്തത്തിലൂടെയല്ല, മറിച്ച് സ്വന്തം രക്തത്തിലൂടെ, അദ്ദേഹം ഒരിക്കലായി വിശുദ്ധസ്ഥലങ്ങളിൽ[a] പ്രവേശിച്ചു; നിത്യമായ വീണ്ടെടുപ്പ് നേടിയവനായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വിശുദ്ധമന്ദിരത്തിലേക്ക്.’ ഗ്രീക്കിൽ ‘വിശുദ്ധസ്ഥലങ്ങൾ’ എന്നാണ്. ചില പരിഭാഷകൾ ‘അതിവിശുദ്ധസ്ഥലത്തിലേക്ക്’ എന്നു നൽകുന്നുണ്ടെങ്കിലും, അത് മൂലപദം ആവശ്യപ്പെടുന്നതിനെക്കാൾ കൂടുതൽ വ്യാഖ്യാനപരമാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲ
  choice: അല്ല
  rationale: മുൻവാക്യത്തിൽനിന്നു തുടരുന്ന നിഷേധാത്മക വൈരുധ്യം, പിന്നാലെയുള്ള ‘സ്വന്തം രക്തത്തിലൂടെയാണ്’ എന്ന പ്രയോഗത്തോടൊപ്പം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: δι’ αἵματος τράγων καὶ μόσχων
  choice: ആടുകളുടെയും കാളക്കിടാക്കളുടെയും രക്തത്തിലൂടെ
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന മാർഗം/ഉപാധി നിലനിർത്തുന്നു; τράγων എന്നത് ആൺആടുകളെ സൂചിപ്പിക്കുന്നുവെങ്കിലും മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി പൊതുവായ ‘ആടുകൾ’ സ്വീകരിച്ചു; μόσχων ‘കാളക്കിടാക്കൾ’ എന്നു നൽകി.
- source_word: διὰ δὲ τοῦ ἰδίου αἵματος
  choice: സ്വന്തം രക്തത്തിലൂടെയാണ്
  rationale: ആവർത്തിച്ച διά-യുടെ ഉപാധിസൂചനയും ἰδίου-യുടെ ഉടമസ്ഥതാ ഊന്നലും നിലനിർത്തുന്നു.
- source_word: εἰσῆλθεν
  choice: പ്രവേശിച്ചത്
  rationale: പൂർത്തിയായ ഏകകാലിക പ്രവൃത്തിയെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἐφάπαξ
  choice: എന്നേക്കുമായി ഒരിക്കൽ
  rationale: ഒരിക്കൽ മാത്രം നടന്ന, ആവർത്തിക്കേണ്ടതില്ലാത്ത നിർണായക പ്രവൃത്തി എന്ന അർഥം വ്യക്തമാക്കുന്നു.
- source_word: εἰς τὰ ἅγια
  choice: വിശുദ്ധസ്ഥലങ്ങളിൽ
  rationale: ഗ്രീക്കിലെ ബഹുവചനരൂപം നിലനിർത്തുകയും ‘അതിവിശുദ്ധസ്ഥലം’ എന്നു വ്യാഖ്യാനപരമായി അതിനിർണ്ണയിക്കുന്നത് ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: αἰωνίαν λύτρωσιν
  choice: നിത്യമായ വീണ്ടെടുപ്പ്
  rationale: സ്ഥിരവും അനന്തഫലമുള്ളതുമായ redemption എന്ന ആശയം സഭാപരമായും പൊതുവായും ഗ്രഹിക്കാവുന്ന മലയാളത്തിൽ നൽകുന്നു.
- source_word: εὑράμενος
  choice: നേടിയെടുത്തു
  rationale: അക്ഷരാർഥമായ ‘കണ്ടെത്തി’ എന്നതിനു പകരം സന്ദർഭത്തിലെ ‘ലഭ്യമാക്കി/നേടി’ എന്ന ഫലം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: സ്വന്തം രക്തത്തിലൂടെയുള്ള ക്രിസ്തുവിന്റെ പ്രവേശനത്തിന്റെ സ്വഭാവം
  choice: മൃഗരക്തത്തിനു വിപരീതമായി സ്വന്തം രക്തത്തിലൂടെയാണ് അദ്ദേഹം പ്രവേശിച്ചതെന്ന് പറയുന്നു; അതിന്റെ കൃത്യമായ സ്വർഗീയ യാഗക്രമം നിർവചിക്കുന്നില്ല.
  alternative: രക്തം അക്ഷരാർഥത്തിൽ കൊണ്ടുപോയി സമർപ്പിച്ചു; അല്ലെങ്കിൽ രക്തം ചൊരിഞ്ഞശേഷം മാത്രമാണ് പ്രവേശിച്ചത്.
  rationale: ആവർത്തിച്ച διά + genitive ഉപാധി/മാർഗം സൂചിപ്പിക്കുന്നതായി ഒരേവിധം പരിഭാഷപ്പെടുത്തി; മൂലപാഠം പറയാത്ത യാഗക്രമം ചേർത്തിട്ടില്ല.
- issue: τὰ ἅγια എന്നതിന്റെ പരിധി
  choice: വിശുദ്ധസ്ഥലങ്ങൾ
  alternative: വിശുദ്ധമന്ദിരം; അതിവിശുദ്ധസ്ഥലം
  rationale: ഗ്രീക്കിലെ ബഹുവചനം സംരക്ഷിക്കുന്നു. ‘വിശുദ്ധമന്ദിരം’ സാധ്യമായ അർഥമാണെങ്കിലും ‘അതിവിശുദ്ധസ്ഥലം’ എന്നു നൽകുന്നത് പാഠത്തെക്കാൾ കൂടുതൽ നിർദ്ദിഷ്ടമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. യാഗപരമായ പദസാന്ദ്രത നിലനിർത്തിക്കൊണ്ട് വാക്യഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കി; അടിക്കുറിപ്പിന്റെ [a] ചിഹ്നം മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
