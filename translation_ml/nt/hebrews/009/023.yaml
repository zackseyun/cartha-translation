  terminology: ‘പകർപ്പുകൾ,’ ‘ശുദ്ധീകരിക്കപ്പെടുക,’ ‘സ്വർഗീയമായവ,’ ‘ശ്രേഷ്ഠമായ യാഗങ്ങൾ’ എന്നിവ മൂലപാഠത്തോടും എബ്രായർക്കുള്ള ലേഖനത്തിലെ യാഗാചാര രജിസ്റ്ററോടും യോജിക്കുന്നു. അടിക്കുറിപ്പുകൾ ഉചിതമായ സ്ഥാനങ്ങളിൽ നങ്കൂരമിട്ടിരിക്കുന്നു; മുഖ്യപാഠത്തിലെ ബഹുവചനമായ ‘യാഗങ്ങളാൽ’ അടിക്കുറിപ്പ് ശരിയായി വിശദീകരിക്കുന്നു.
