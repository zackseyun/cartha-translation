id: HEB.9.23
reference: Hebrews 9:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀνάγκη οὖν τὰ μὲν ὑποδείγματα τῶν ἐν τοῖς οὐρανοῖς τούτοις καθαρίζεσθαι, αὐτὰ δὲ τὰ ἐπουράνια κρείττοσι θυσίαις παρὰ ταύτας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/023.yaml
  text: Therefore it was necessary for the copies of the things in the heavens to be cleansed with these[c][b][a], but the heavenly things themselves with better sacrifices than these.
translation:
  language: ml
  text: അതിനാൽ, സ്വർഗങ്ങളിലുള്ളവയുടെ പകർപ്പുകൾ[a] ഇവകൊണ്ട് ശുദ്ധീകരിക്കപ്പെടേണ്ടത്[b] ആവശ്യമായിരുന്നു; എന്നാൽ സ്വർഗീയമായവതന്നെ ഇവയെക്കാൾ ശ്രേഷ്ഠമായ യാഗങ്ങളാൽ[c] ശുദ്ധീകരിക്കപ്പെടേണ്ടിയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പകർപ്പുകൾ’ എന്നതിന് ‘മാതൃകകൾ’ എന്നോ ‘പ്രതിരൂപങ്ങൾ’ എന്നോ വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: ‘ശുദ്ധീകരിക്കപ്പെടുക’ എന്ന ക്രിയ യാഗാചാരപരമായ ശുദ്ധിയെയോ ശുദ്ധീകരണത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: ഗ്രീക്കിൽ ‘ശ്രേഷ്ഠമായ യാഗങ്ങൾ’ എന്നു ബഹുവചനമാണ്; എന്നാൽ എബ്രായലേഖനത്തിലെ സന്ദർഭം മശീഹയുടെ ഒരിക്കലായുള്ള അർപ്പണത്തെ കേന്ദ്രീകരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνάγκη
  choice: ആവശ്യമായിരുന്നു
  rationale: ഗ്രീക്കിലെ വ്യക്തിനിരപേക്ഷമായ ആവശ്യകതയെ സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; മുൻവാക്യങ്ങളിലെ ആചാരങ്ങളെ വിശദീകരിക്കുന്ന ഭൂതകാലസന്ദർഭവും നിലനിർത്തുന്നു.
- source_word: οὖν
  choice: അതിനാൽ
  rationale: മുൻവിവരണത്തിൽനിന്നുള്ള നിഗമനബന്ധം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: ὑποδείγματα
  choice: പകർപ്പുകൾ
  rationale: ഭൗമിക ആരാധനാസംബന്ധമായ വസ്തുക്കൾ സ്വർഗീയമായവയോട് correspond ചെയ്യുന്ന രൂപങ്ങളാണെന്ന വൈരുധ്യം ലളിതമായി നിലനിർത്തുന്നു; ‘മാതൃകകൾ’, ‘പ്രതിരൂപങ്ങൾ’ എന്നിവ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: τῶν ἐν τοῖς οὐρανοῖς
  choice: സ്വർഗങ്ങളിലുള്ളവയുടെ
  rationale: οὐρανοῖς എന്ന ബഹുവചനം നിലനിർത്തുകയും പിന്നാലെയുള്ള ἐπουράνια എന്ന വിശേഷണപ്രയോഗത്തിൽനിന്ന് ഈ പദബന്ധത്തെ വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: καθαρίζεσθαι
  choice: ശുദ്ധീകരിക്കപ്പെടേണ്ടത് / ശുദ്ധീകരിക്കപ്പെടേണ്ടിയിരുന്നു
  rationale: യാഗാചാരപരമായ ശുദ്ധീകരണഭാഷയും കർമണിപ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: αὐτὰ δὲ τὰ ἐπουράνια
  choice: എന്നാൽ സ്വർഗീയമായവതന്നെ
  rationale: αὐτά നൽകുന്ന ഊന്നൽ ‘തന്നെ’ എന്നതിലൂടെ സൂക്ഷിക്കുകയും ‘യാഥാർഥ്യങ്ങൾ’ എന്ന വ്യാഖ്യാനാത്മക പദം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: κρείττοσι θυσίαις
  choice: ശ്രേഷ്ഠമായ യാഗങ്ങളാൽ
  rationale: എബ്രായലേഖനത്തിലെ പ്രധാന താരതമ്യപദമായ κρείττων-നെയും θυσίαις എന്ന ബഹുവചനത്തെയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: παρὰ ταύτας
  choice: ഇവയെക്കാൾ
  rationale: താരതമ്യനിർമാണമായ παρά + comparative-ന്റെ അർഥം വ്യക്തമായി നൽകുന്നു; ‘ഇവ’ മുമ്പ് പരാമർശിച്ച ഭൗമിക ശുദ്ധീകരണോപാധികളെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘സ്വർഗീയമായവ’ ശുദ്ധീകരിക്കപ്പെടുന്നു എന്ന പ്രസ്താവന
  choice: ‘സ്വർഗീയമായവതന്നെ ... ശുദ്ധീകരിക്കപ്പെടേണ്ടിയിരുന്നു’ എന്ന യാഗാചാരപരമായ ഭാഷ അതേപടി നിലനിർത്തി.
  alternative: ‘സ്വർഗീയ വിശുദ്ധമന്ദിരം’ എന്നോ ‘സ്വർഗീയ ജനങ്ങൾ’ എന്നോ വ്യാഖ്യാനിക്കുക, അല്ലെങ്കിൽ സ്വർഗം ശുദ്ധീകരിക്കപ്പെടുന്നു എന്ന ആശയം ഒഴിവാക്കുന്ന പരാവർത്തനം നൽകുക.
  rationale: ഗ്രീക്ക് ഭൗമിക പകർപ്പുകളെയും സ്വർഗീയമായവയെയും നേരിട്ട് താരതമ്യം ചെയ്ത് രണ്ടിനും ശുദ്ധീകരണഭാഷ ഉപയോഗിക്കുന്നു. ഈ ദൈവശാസ്ത്രപരമായ സംഘർഷം വിവർത്തനംകൊണ്ട് പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
- issue: മശീഹയുടെ ഒരിക്കലായുള്ള അർപ്പണവുമായി ബന്ധപ്പെട്ടിടത്ത് ‘യാഗങ്ങൾ’ എന്ന ബഹുവചനം
  choice: മുഖ്യപാഠത്തിൽ ‘യാഗങ്ങളാൽ’ എന്ന ബഹുവചനം നിലനിർത്തി.
  alternative: ആശയപരമായി ‘യാഗത്താൽ’ എന്ന ഏകവചനം ഉപയോഗിക്കുക.
  rationale: എബ്രായലേഖനം മറ്റിടങ്ങളിൽ മശീഹയുടെ ഒരിക്കലായുള്ള അർപ്പണത്തെ ഊന്നിപ്പറയുന്നുവെങ്കിലും ഇവിടെ θυσίαις ബഹുവചനമാണ്. അതിനെ ഏകവചനമാക്കി ദൈവശാസ്ത്രപരമായി സമന്വയിപ്പിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. യാഗാചാരപരമായ പദാവലി സംരക്ഷിച്ചുകൊണ്ട് അനാവശ്യമായ വ്യാഖ്യാനപരാവർത്തനം ഒഴിവാക്കി; ‘സ്വർഗങ്ങൾ’ എന്ന ബഹുവചനവും ‘യാഗങ്ങൾ’ എന്ന ബഹുവചനവും മൂലപാഠാനുസൃതമായി നിലനിർത്തി.
