revisions:
- from: കാരണം, ഉടമ്പടി[a] ഉള്ളിടത്ത്, അത് ഏർപ്പെടുത്തിയയാൾ മരിച്ചതായി സ്ഥാപിക്കേണ്ടത് അനിവാര്യമാണ്.
  to: കാരണം, ഉടമ്പടി[a] ഉള്ളിടത്ത്, അത് ഏർപ്പെടുത്തിയയാൾ മരിച്ചുവെന്ന് തെളിയിക്കപ്പെടേണ്ടത് അനിവാര്യമാണ്.
