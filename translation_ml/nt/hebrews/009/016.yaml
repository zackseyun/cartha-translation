  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅπου γὰρ διαθήκη, θάνατον ἀνάγκη φέρεσθαι τοῦ διαθεμένου·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/016.yaml
  text: For where there is a covenant[a], it is necessary for the death of the one who made it to be brought forward.
translation:
  language: ml
  text: കാരണം, ഉടമ്പടി[a] ഉള്ളിടത്ത്, അത് ഏർപ്പെടുത്തിയയാൾ മരിച്ചുവെന്ന് തെളിയിക്കപ്പെടേണ്ടത് അനിവാര്യമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “വിൽപ്പത്രം ഉള്ളിടത്ത്, അതു തയ്യാറാക്കിയയാൾ മരിച്ചുവെന്ന് തെളിയിക്കപ്പെടേണ്ടത് അനിവാര്യമാണ്.” ഗ്രീക്കിലെ διαθήκη (ദിയാഥേക്കേ) എന്ന പദത്തിന് ‘ഉടമ്പടി’ എന്നും ‘വിൽപ്പത്രം’ എന്നും അർഥമാകാം; 16–17 വാക്യങ്ങളിൽ പലരും നിയമപരമായ ഈ രണ്ടാമത്തെ അർഥമാണ് മനസ്സിലാക്കുന്നത്.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπου γὰρ
  choice: കാരണം, ... ഉള്ളിടത്ത്
  rationale: γάρ എന്നതിന്റെ വിശദീകരണസ്വഭാവം ‘കാരണം’ എന്നും ὅπου എന്നതിന്റെ സ്ഥല/സാഹചര്യബന്ധം ‘ഉള്ളിടത്ത്’ എന്നും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: διαθήκη
  choice: ഉടമ്പടി
  rationale: എബ്രായർ 8–10 അധ്യായങ്ങളിലെ വിശാലമായ ഉടമ്പടി-സന്ദർഭത്തോട് യോജിക്കുന്നു. ‘വിൽപ്പത്രം’ എന്ന നിയമപരമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: θάνατον
  choice: മരിച്ചതായി
  rationale: θάνατον എന്ന ‘മരണം’ എന്ന ആശയം മലയാളത്തിലെ സ്ഥാപിക്കൽ/തെളിയിക്കൽ പ്രയോഗത്തോട് സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ ഉപവാക്യരൂപത്തിൽ നൽകുന്നു.
- source_word: ἀνάγκη
  choice: അനിവാര്യമാണ്
  rationale: ആവശ്യകതയെ വ്യക്തവും ഗൗരവമുള്ളതുമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: φέρεσθαι
  choice: സ്ഥാപിക്കേണ്ടത്
  rationale: അക്ഷരാർഥമായ ‘കൊണ്ടുവരപ്പെടുക’ മലയാളത്തിൽ ഈ സാഹചര്യത്തിൽ അസ്വാഭാവികമാണ്. മരണം പ്രാബല്യത്തിലുള്ള വസ്തുതയായി മുന്നോട്ടുവെക്കുകയോ സ്ഥിരീകരിക്കുകയോ വേണമെന്ന നിയമസാക്ഷ്യപരമായ ആശയം ‘സ്ഥാപിക്കുക’ വ്യക്തമാക്കുന്നു.
- source_word: τοῦ διαθεμένου
  choice: അത് ഏർപ്പെടുത്തിയയാൾ
  rationale: διατίθεμαι എന്ന ക്രിയയുടെ ‘ക്രമീകരിക്കുക/ഏർപ്പെടുത്തുക’ എന്ന അർഥം നിലനിർത്തുന്നു; ‘വിൽപ്പത്രകർത്താവ്’ എന്ന ഒറ്റ നിയമാർഥം മുഖ്യവാചകത്തിൽ മുൻകൂട്ടി നിർബന്ധിക്കുന്നില്ല.
theological_decisions:
- issue: διαθήκη എന്ന പദം ‘ഉടമ്പടി’ എന്നോ ‘വിൽപ്പത്രം’ എന്നോ വിവർത്തനം ചെയ്യണമോ
  choice: മുഖ്യവാചകത്തിൽ ‘ഉടമ്പടി’; ‘വിൽപ്പത്രം’ എന്ന വായന അടിക്കുറിപ്പിൽ
  alternative: മുഖ്യവാചകത്തിൽ ‘വിൽപ്പത്രം’ അഥവാ ‘ടെസ്റ്റമെന്റ്’
  rationale: തൊട്ടടുത്ത വാക്യങ്ങളുടെ നിയമപരമായ വ്യാഖ്യാനം യഥാർഥ സാധ്യതയായിരിക്കുമ്പോഴും, എബ്രായർ 8–10-ലെ പ്രധാന വാദം ഉടമ്പടിയെ കേന്ദ്രീകരിക്കുന്നു. അതിനാൽ മുഖ്യവാചകത്തിൽ ഉടമ്പടി നിലനിർത്തുകയും അർഥദ്വയവും വ്യാഖ്യാനപരമായ പിരിമുറുക്കവും അടിക്കുറിപ്പിലൂടെ തുറന്നുവെക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി. ‘മരണം സ്ഥാപിക്കുക’ എന്ന അസ്വാഭാവിക ഘടന ഒഴിവാക്കി ‘മരിച്ചതായി സ്ഥാപിക്കുക’ എന്നു നൽകിയെങ്കിലും, ഗ്രീക്കിലെ നിയമ/സാക്ഷ്യപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
