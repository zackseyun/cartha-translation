  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μόνον ἐπὶ βρώμασιν καὶ πόμασιν καὶ διαφόροις βαπτισμοῖς, ⸀δικαιώματα σαρκὸς μέχρι καιροῦ διορθώσεως ἐπικείμενα.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/010.yaml
  text: concerned only with foods and drinks and various washings, fleshly regulations imposed until the time of reformation.
translation:
  language: ml
  text: അവ ഭക്ഷണപാനീയങ്ങൾക്കും പലതരം കഴുകലുകൾക്കും മാത്രം ബാധകമായ ശരീരസംബന്ധമായ ചട്ടങ്ങളായിരുന്നു; പരിഷ്കരണത്തിന്റെ കാലംവരെ അവ ചുമത്തപ്പെട്ടിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βρώμασιν καὶ πόμασιν
  choice: ഭക്ഷണപാനീയങ്ങളെ
  rationale: ഭക്ഷണവും പാനീയവും സംബന്ധിച്ച ആചാരനിയമങ്ങളെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി അറിയിക്കുന്നു.
- source_word: διαφόροις βαπτισμοῖς
  choice: വിവിധ കഴുകലുകളെ
  rationale: ഇവിടെ βαπτισμοῖς ആചാരപരമായ പലതരം ശുദ്ധീകരണക്കഴുകലുകളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘സ്നാനങ്ങൾ’ എന്നത് ക്രിസ്തീയ സ്നാനത്തെ അനാവശ്യമായി സൂചിപ്പിച്ചേക്കാം.
- source_word: δικαιώματα σαρκὸς
  choice: ജഡസംബന്ധമായ ചട്ടങ്ങൾ
  rationale: δικαιώματα എന്നതിന്റെ നിയമപരമായ അർഥം ‘ചട്ടങ്ങൾ’കൊണ്ടും σαρκὸς എന്നതിന്റെ ശരീരബാഹ്യ ആചാരങ്ങളെ കേന്ദ്രീകരിക്കുന്ന ഭാവം ‘ജഡസംബന്ധമായ’കൊണ്ടും നിലനിർത്തുന്നു.
- source_word: καιροῦ διορθώσεως
  choice: കാര്യങ്ങൾ നേരെയാക്കപ്പെടുന്ന കാലം
  rationale: διόρθωσις എന്നതിലെ തിരുത്തി ശരിയായ നിലയിലാക്കൽ എന്ന അടിസ്ഥാനഭാവം നിലനിർത്തുന്നു; ‘നവീകരണം’ പോലുള്ള വ്യാഖ്യാനപരമായി ചുരുങ്ങിയ പദം ഒഴിവാക്കുന്നു.
- source_word: ἐπικείμενα
  choice: ചുമത്തപ്പെട്ട
  rationale: നിയമങ്ങൾ ബാധ്യതയായി ഏർപ്പെടുത്തിയിരുന്നു എന്ന ആശയം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: σαρκὸς എന്നതിന്റെ വ്യാഖ്യാനം
  choice: ജഡസംബന്ധമായ
  alternative: ശരീരത്തെ സംബന്ധിച്ച
  rationale: മൂലപദത്തിന്റെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം നിലനിർത്തുന്നു; അതിനെ വെറും ശാരീരിക ശുചിത്വമായി ചുരുക്കുന്നില്ല.
- issue: διορθώσεως എന്നതിന്റെ കാലസൂചന
  choice: കാര്യങ്ങൾ നേരെയാക്കപ്പെടുന്ന കാലം
  alternative: നവീകരണകാലം
  rationale: ആ കാലത്തിന്റെ കൃത്യമായ ചരിത്ര-ദൈവശാസ്ത്ര തിരിച്ചറിയൽ വാക്യത്തിൽ ചേർക്കാതെ, മൂലത്തിലെ തുറന്ന സ്വഭാവം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. ഈ വാക്യം മുൻവാക്യത്തിലെ വഴിപാടുകളെയും യാഗങ്ങളെയും ആശ്രയിക്കുന്നതിനാൽ ‘അവ’ ചേർത്തു; ഭൂതകാലസന്ദർഭം വ്യക്തമാക്കാൻ ‘ആയിരുന്നു’ ഉപയോഗിച്ചു.
