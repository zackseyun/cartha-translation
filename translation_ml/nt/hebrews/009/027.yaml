id: HEB.9.27
reference: Hebrews 9:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ καθ’ ὅσον ἀπόκειται τοῖς ἀνθρώποις ἅπαξ ἀποθανεῖν, μετὰ δὲ τοῦτο κρίσις,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/027.yaml
  text: And just as it is appointed for men to die once[a], and after this, judgment,
translation:
  language: ml
  text: മനുഷ്യർ ഒരിക്കൽ മരിക്കേണ്ടത് നിശ്ചയിക്കപ്പെട്ടിരിക്കുന്നതുപോലെ, അതിനുശേഷം ന്യായവിധിയും ഉണ്ടാകും,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθ’ ὅσον
  choice: …പോലെ
  rationale: അടുത്ത വാക്യത്തിൽ തുടരുന്ന ഉപമയ്ക്ക് തുടക്കം കുറിക്കുന്ന പ്രയോഗമായതിനാൽ, അളവിനെയല്ല താരതമ്യത്തെയാണ് മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നത്.
- source_word: ἀπόκειται
  choice: നിശ്ചയിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: ദാതൃവിഭക്തിയോടും അനന്തക്രിയയോടും ചേർന്ന ഈ സന്ദർഭത്തിൽ, സൂക്ഷിച്ചുവെക്കുക എന്നതിലുപരി മനുഷ്യർക്കായി ഉറപ്പിക്കപ്പെട്ടിരിക്കുന്ന അവസ്ഥ എന്ന ആശയം നൽകുന്നു.
- source_word: τοῖς ἀνθρώποις
  choice: മനുഷ്യർ
  rationale: ഗ്രീക്കിലെ വ്യാകരണപരമായി പുല്ലിംഗ ബഹുവചനം ഇവിടെ പുരുഷന്മാരെ മാത്രം അല്ല, മനുഷ്യരാശിയെ പൊതുവായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘മനുഷ്യർ’ ഈ ഉൾക്കൊള്ളുന്ന അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: ἅπαξ
  choice: ഒരിക്കൽ
  rationale: മരണത്തിന്റെ ഒറ്റത്തവണ സംഭവത്തെ ലളിതമായും കൃത്യമായും അറിയിക്കുന്നു; ‘എന്നേക്കുമായി ഒരിക്കൽ’ എന്ന അധിക ആശയം ചേർക്കുന്നില്ല.
- source_word: ἀποθανεῖν
  choice: മരിക്കുക
  rationale: അനന്തക്രിയയുടെ സാധാരണവും നേരിട്ടുള്ളതുമായ അർഥം.
- source_word: μετὰ δὲ τοῦτο
  choice: അതിനു ശേഷം
  rationale: മരണത്തിന് പിന്നാലെയുള്ള ക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: κρίσις
  choice: ന്യായവിധി
  rationale: വിധിനിർണയത്തെ വിശാലമായി സൂചിപ്പിക്കുന്നു; ഫലം ശിക്ഷാവിധിയാണെന്ന് മുൻകൂട്ടി നിശ്ചയിക്കുകയോ ഒരു പ്രത്യേക അന്ത്യകാല പദ്ധതി ചേർക്കുകയോ ചെയ്യുന്നില്ല.
theological_decisions:
- issue: τοῖς ἀνθρώποις എന്നതിന്റെ പൊതുവായ മാനവസൂചന
  choice: ‘മനുഷ്യർ’ എന്നു പരിഭാഷപ്പെടുത്തി മനുഷ്യരാശിയെ മുഴുവനായി സൂചിപ്പിച്ചു
  alternative: ‘പുരുഷന്മാർ’
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചനം ഈ സന്ദർഭത്തിൽ പുരുഷന്മാർക്ക് മാത്രമായുള്ള പരാമർശമല്ല. മലയാളത്തിൽ ‘പുരുഷന്മാർ’ എന്നു പറഞ്ഞാൽ തെറ്റായ ലിംഗപരിമിതി ഉണ്ടാകും.
- issue: മരണത്തിനു ശേഷമുള്ള κρίσις എന്നതിന്റെ വ്യാപ്തി
  choice: വിശദീകരണം ചേർക്കാതെ ‘ന്യായവിധി’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: ‘ശിക്ഷാവിധി’ അല്ലെങ്കിൽ ‘അന്തിമ ന്യായവിധി’
  rationale: വാക്യം മരണത്തിനു ശേഷം ന്യായവിധിയുണ്ടെന്ന് പറയുന്നു; എന്നാൽ അതിന്റെ ഫലമോ സമഗ്രമായ അന്ത്യകാല ക്രമമോ ഇവിടെ നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. വാക്യം 9:28-ൽ പൂർത്തിയാകുന്ന താരതമ്യത്തിന്റെ ആദ്യഭാഗമായതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തി. ‘മനുഷ്യർ’ സ്വാഭാവികമായി എല്ലാവരെയും ഉൾക്കൊള്ളുന്നതിനാൽ ഇംഗ്ലീഷിലെ ലിംഗസൂചനാ അടിക്കുറിപ്പ് മലയാളത്തിൽ ആവശ്യമില്ല.
