id: HEB.9.18
reference: Hebrews 9:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅθεν οὐδὲ ἡ πρώτη χωρὶς αἵματος ἐγκεκαίνισται·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/018.yaml
  text: Therefore not even the first covenant was inaugurated without blood[a].
translation:
  language: ml
  text: അതുകൊണ്ട്, ആദ്യ ഉടമ്പടിപോലും രക്തം കൂടാതെ പ്രാബല്യത്തിൽ വന്നില്ല[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: മൂലത്തിൽ ‘ആദ്യത്തേത്’; സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത് ആദ്യ ഉടമ്പടിയാണ്. ‘ആദ്യ വിൽപ്പത്രം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: ഗ്രീക്കിൽ നാമം അധ്യാഹൃതമായതിനാലും സമീപവാക്യങ്ങളിൽ ‘ഉടമ്പടി/വിൽപ്പത്രം’ എന്ന അർഥസാധ്യത നിലനിൽക്കുന്നതിനാലും.
lexical_decisions:
- source_word: ὅθεν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: οὐδὲ
  choice: പോലും ... ഇല്ല
  rationale: ‘not even’ എന്ന ഊന്നലോടെയുള്ള നിഷേധം മലയാളത്തിന്റെ സ്വാഭാവിക വാക്യക്രമത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἡ πρώτη
  choice: ആദ്യ ഉടമ്പടി
  rationale: ഗ്രീക്കിൽ നാമം അധ്യാഹൃതമാണെങ്കിലും സന്ദർഭം ആദ്യ ഉടമ്പടിയെയാണ് സൂചിപ്പിക്കുന്നത്; വ്യക്തതയ്ക്കായി ‘ഉടമ്പടി’ ചേർക്കുന്നു.
- source_word: χωρὶς αἵματος
  choice: രക്തം കൂടാതെ
  rationale: രക്തത്തിന്റെ അഭാവം സൂചിപ്പിക്കുന്ന പ്രയോഗത്തെയും യാഗപരവും ഉടമ്പടിസംബന്ധവുമായ ഭാവത്തെയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἐγκεκαίνισται
  choice: പ്രാബല്യത്തിൽ വന്നില്ല
  rationale: ഉടമ്പടി രക്തത്താൽ ഔപചാരികമായി നിലവിൽ വന്നതിനെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; ഗ്രീക്ക് പൂർണ്ണകാലത്തിന്റെ പൂർത്തിയായ പ്രവർത്തനഭാവം ഭൂതകാലപ്രയോഗത്തിൽ പ്രകടമാകുന്നു.
theological_decisions:
- issue: ‘ആദ്യത്തേത്’ എന്നതിന്റെ സൂചിതനാമം
  choice: ആദ്യ ഉടമ്പടി
  alternative: ആദ്യത്തേത്; ആദ്യ വിൽപത്രം
  rationale: എബ്രായർ 9-ലെ സമീപസന്ദർഭവും പുറപ്പാട് 24-ലെ രക്തത്താൽ ഉടമ്പടി സ്ഥാപിച്ച സംഭവത്തിലേക്കുള്ള സൂചനയും ‘ഉടമ്പടി’യെ പിന്തുണയ്ക്കുന്നു. എന്നിരുന്നാലും ഗ്രീക്കിൽ ഇവിടെ നാമം വ്യക്തമായി ആവർത്തിക്കുന്നില്ലെന്നത് അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- issue: ἐγκαινίζω എന്ന ക്രിയയുടെ ഉടമ്പടിസംബന്ധമായ ഭാവം
  choice: പ്രാബല്യത്തിൽ വന്നു
  alternative: ഉദ്ഘാടനം ചെയ്യപ്പെട്ടു; പ്രതിഷ്ഠിക്കപ്പെട്ടു; സ്ഥിരീകരിക്കപ്പെട്ടു
  rationale: നിയമപരമായ സ്ഥിരീകരണം മാത്രമായോ ആരാധനാപരമായ പ്രതിഷ്ഠ മാത്രമായോ അർഥം ചുരുക്കാതെ, ഉടമ്പടി നിലവിൽ വന്നുവെന്ന ആശയം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘പ്രാബല്യത്തിൽ വന്നു’ എന്നത് ഔപചാരിക ആരംഭവും നിലവിൽ വരലും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു; അടിക്കുറിപ്പ് മൂലത്തിലെ അധ്യാഹാരവും അർഥസാധ്യതയും സംരക്ഷിക്കുന്നു.
