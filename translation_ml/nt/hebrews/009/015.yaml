id: HEB.9.15
reference: Hebrews 9:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ διὰ τοῦτο διαθήκης καινῆς μεσίτης ἐστίν, ὅπως θανάτου γενομένου εἰς ἀπολύτρωσιν τῶν ἐπὶ τῇ πρώτῃ διαθήκῃ παραβάσεων τὴν ἐπαγγελίαν λάβωσιν οἱ κεκλημένοι τῆς αἰωνίου κληρονομίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/015.yaml
  text: And for this reason he is the mediator of a new covenant[a], so that, since a death has occurred for the redemption of the transgressions committed under the first covenant, those who have been called may receive the promise of the eternal inheritance.
translation:
  language: ml
  text: അതുകൊണ്ട് അവൻ ഒരു പുതിയ ഉടമ്പടിയുടെ[a] മധ്യസ്ഥനാണ്; ആദ്യത്തെ ഉടമ്പടിക്കു കീഴിൽ നടന്ന ലംഘനങ്ങളിൽനിന്നുള്ള വീണ്ടെടുപ്പിനായി ഒരു മരണം സംഭവിച്ചതിനാൽ, വിളിക്കപ്പെട്ടവർ നിത്യമായ അവകാശത്തിന്റെ വാഗ്ദാനം ലഭിക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഉടമ്പടി’ എന്നതിന് ‘വിൽപ്പത്രം’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദമായ διαθήκη-യ്ക്ക് ഈ രണ്ട് അർഥങ്ങളും വരാം; എബ്രായർ 9:16–17 ഈ അർഥസാമ്യം വികസിപ്പിക്കുന്നു. എന്നാൽ ഈ വാക്യത്തിൽ ആദ്യത്തെ ഉടമ്പടിയുമായുള്ള വൈരുധ്യം ഉള്ളതിനാൽ ‘ഉടമ്പടി’യാണ് കൂടുതൽ യോജിച്ചത്.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യത്തിലെ വാദവുമായി കാരണപരമായി ബന്ധിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: διαθήκης καινῆς
  choice: ഒരു പുതിയ ഉടമ്പടിയുടെ
  rationale: ഈ വാക്യത്തിലെ ആദ്യത്തെ ഉടമ്പടിയുമായുള്ള വൈരുധ്യവും എബ്രായലേഖനത്തിന്റെ ഉടമ്പടി-പശ്ചാത്തലവും കൃത്യമായി പ്രകടിപ്പിക്കുന്നു; ‘വിൽപത്രം’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: μεσίτης
  choice: മധ്യസ്ഥൻ
  rationale: രണ്ടു കക്ഷികൾക്കിടയിൽ നിന്ന് ഉടമ്പടി-ബന്ധം സാധ്യമാക്കുന്നവനെ സൂചിപ്പിക്കുന്ന കൃത്യവും സാധാരണവുമായ പദം.
- source_word: θανάτου γενομένου
  choice: ഒരു മരണം സംഭവിച്ചിരിക്കുന്നതിനാൽ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ടിന്റെ പൂർത്തിയായ സംഭവവും തുടർന്നുള്ള ഫലത്തിനുള്ള അതിന്റെ കാരണപരമായ പ്രസക്തിയും നിലനിർത്തുന്നു; ഗ്രീക്കിലുള്ളതുപോലെ മരണം ആരുടേതെന്ന് ഇവിടെ പ്രത്യേകം ചേർക്കുന്നില്ല.
- source_word: ἀπολύτρωσιν
  choice: വീണ്ടെടുപ്പ്
  rationale: വിലകൊടുത്തുള്ള മോചനമെന്ന ബലിസംബന്ധമായ ആശയം ഉൾക്കൊള്ളുന്ന സ്ഥാപിതവും മനസ്സിലാക്കാവുന്നതുമായ മലയാളപദം.
- source_word: τῶν ἐπὶ τῇ πρώτῃ διαθήκῃ παραβάσεων
  choice: ആദ്യത്തെ ഉടമ്പടിക്കു കീഴിൽ നടന്ന ലംഘനങ്ങളിൽനിന്നുള്ള
  rationale: ἐπί + ദത്തിവിന്റെ കാല/അധികാരപരിധി സൂചിപ്പിക്കുന്ന ‘കീഴിൽ’ എന്ന അർഥം നൽകുകയും ലംഘനങ്ങളോടുള്ള ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: τὴν ἐπαγγελίαν ... τῆς αἰωνίου κληρονομίας
  choice: നിത്യമായ അവകാശത്തിന്റെ വാഗ്ദാനം
  rationale: വാഗ്ദാനവും അതിന്റെ ഉള്ളടക്കമായ നിലനിൽക്കുന്ന അവകാശവും തമ്മിലുള്ള ഗ്രീക്ക് ജനിറ്റീവ് ബന്ധം സംരക്ഷിക്കുന്നു.
- source_word: οἱ κεκλημένοι
  choice: വിളിക്കപ്പെട്ടവർ
  rationale: പെർഫെക്റ്റ് പാസീവ് ആശയത്തിലെ ദൈവിക വിളി ലഭിച്ചവരുടെ നില സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: λάβωσιν
  choice: ലഭിക്കേണ്ടതിന്
  rationale: ὅπως-നോടു ചേർന്ന ഉദ്ദേശ്യ/ഫലഭാവം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
theological_decisions:
- issue: ἐστίν എന്ന ക്രിയയുടെ വ്യക്തമാക്കാത്ത കർത്താവ്
  choice: ‘അവൻ’ എന്നു വ്യക്തമാക്കി; സമീപസന്ദർഭത്തിലെ മശീഹാ/യേശുവിനെയാണ് സൂചിപ്പിക്കുന്നത്.
  alternative: കർത്താവിനെ പറയാതെ അക്ഷരാർഥഘടന നിലനിർത്തുക.
  rationale: മലയാളത്തിലെ വ്യക്തതയ്ക്കായി കർത്താവ് ആവശ്യമാണ്; മുൻസന്ദർഭം അതിനെ വ്യക്തമായി നിർണ്ണയിക്കുന്നതിനാൽ പുതിയ ഉപദേശവിവരം ചേർക്കുന്നില്ല.
- issue: ഈ വാക്യത്തിലെ διαθήκη എന്ന പദത്തിന്റെ അർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘ഉടമ്പടി’.
  alternative: ‘വിൽപത്രം’ അഥവാ ‘നിയമപത്രം’.
  rationale: ‘പുതിയ’തും ‘ആദ്യത്തെ’തുമായ ഉടമ്പടികളുടെ നേരിട്ടുള്ള വൈരുധ്യം ഇവിടെ ഉടമ്പടി എന്ന അർഥത്തെ മുൻനിർത്തുന്നു. എന്നാൽ 9:16–17-ൽ പ്രസക്തമാകുന്ന വിൽപത്രാർഥസാധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
- issue: θανάτου γενομένου എന്നതിലെ മരണത്തിന്റെ വ്യക്തമായ തിരിച്ചറിയൽ
  choice: ‘ഒരു മരണം സംഭവിച്ചിരിക്കുന്നതിനാൽ’ എന്ന് ഗ്രീക്കിലെ അനിശ്ചിതത്വം നിലനിർത്തി.
  alternative: ‘അവന്റെ മരണം സംഭവിച്ചതിനാൽ’ അഥവാ ‘ക്രിസ്തു മരിച്ചതിനാൽ’.
  rationale: സന്ദർഭത്തിൽ ക്രിസ്തുവിന്റെ മരണമാണ് ഉദ്ദേശ്യമെങ്കിലും, ഈ ഉപവാക്യത്തിൽ ഉടമസ്ഥസർവനാമമോ വ്യക്തമായ കർത്താവോ ഇല്ല; അതിനാൽ മുഖ്യപാഠത്തിൽ അത് ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഉടമ്പടി, മധ്യസ്ഥൻ, വീണ്ടെടുപ്പ്, അവകാശം എന്നീ സ്ഥാപിത ബൈബിൾപദങ്ങൾ നിലനിർത്തിയപ്പോൾ വാക്യബന്ധം സ്വാഭാവികമാക്കി.
