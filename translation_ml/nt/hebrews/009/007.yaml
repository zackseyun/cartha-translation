  source_fidelity: ഗ്രീക്ക് വാക്യത്തിലെ സ്ഥലവ്യത്യാസം (εἰς δὲ τὴν δευτέραν), വാർഷിക ആവൃത്തി, മഹാപുരോഹിതന്റെ മാത്രമായുള്ള പ്രവേശനം, ‘രക്തം കൂടാതെയല്ല’ എന്ന നിഷേധാത്മക പ്രയോഗം, രക്തം അർപ്പിക്കുന്ന പ്രവൃത്തി, തനിക്കുവേണ്ടിയും ജനത്തിന്റെ അറിവില്ലാതെ ചെയ്ത പാപങ്ങൾക്കുവേണ്ടിയും എന്ന ലക്ഷ്യം എന്നിവ വിശ്വസ്തമായി പകർന്നിട്ടുണ്ട്. ‘ആ രക്തം’ എന്ന ആവർത്തനം ഗ്രീക്കിലെ ബന്ധസർവനാമത്തിന്റെ പൂർവപദം മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
  naturalness: വാചകം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്. ദീർഘമായ ഗ്രീക്ക് വാക്യത്തെ രണ്ട് വാക്യങ്ങളാക്കിയിട്ടും യുക്തിബന്ധമോ ഊന്നലോ നഷ്ടപ്പെട്ടിട്ടില്ല. ‘അതും രക്തം കൂടാതെയല്ല’ എന്ന പ്രയോഗം സന്ദർഭോചിതമായി സ്വാഭാവികമാണ്.
  terminology: ‘മഹാപുരോഹിതൻ,’ ‘സമാഗമകൂടാരം,’ ‘രക്തം,’ ‘അർപ്പിക്കുന്നു’ എന്നിവ യോജിച്ച ബലിപരമായ/ആരാധനാസംബന്ധമായ പദങ്ങളാണ്. ‘അറിവില്ലാതെ ചെയ്ത പാപങ്ങൾ’ ἀγνοημάτων എന്നതിന്റെ ധാർമ്മിക അർഥം സംരക്ഷിക്കുന്നു; മനഃപൂർവതയെക്കുറിച്ച് അധിക വ്യാഖ്യാനം അടിച്ചേൽപ്പിക്കുന്നില്ല. അടിക്കുറിപ്പുകൾ യഥാക്രമം രണ്ടാമത്തെ വിഭാഗത്തിന്റെ പദപര്യായവും പാപങ്ങളുടെ അർഥപര്യായവും വ്യക്തമായി നൽകുന്നു.
