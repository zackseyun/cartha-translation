id: HEB.9.7
reference: Hebrews 9:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰς δὲ τὴν δευτέραν ἅπαξ τοῦ ἐνιαυτοῦ μόνος ὁ ἀρχιερεύς, οὐ χωρὶς αἵματος, ὃ προσφέρει ὑπὲρ ἑαυτοῦ καὶ τῶν τοῦ λαοῦ ἀγνοημάτων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/007.yaml
  text: But into the second room only the high priest enters once a year[a], and not without blood[b], which he offers for himself and for the people's sins committed in ignorance.
translation:
  language: ml
  text: എന്നാൽ രണ്ടാമത്തെ മുറിയിലേക്ക്[a] വർഷത്തിൽ ഒരിക്കൽ മഹാപുരോഹിതൻ മാത്രം പ്രവേശിക്കുന്നു; അതും രക്തം കൂടാതെയല്ല. തനിക്കുവേണ്ടിയും ജനത്തിന്റെ അറിവില്ലാതെ ചെയ്ത പാപങ്ങൾക്കുവേണ്ടിയും[b] അവൻ ആ രക്തം അർപ്പിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘രണ്ടാമത്തെ കൂടാരത്തിലേക്ക്’ അല്ലെങ്കിൽ ‘രണ്ടാമത്തെ വിഭാഗത്തിലേക്ക്’; സമാഗമകൂടാരത്തിന്റെ ഉള്ളിലെ രണ്ടാമത്തെ ഭാഗത്തെയാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘ജനത്തിന്റെ മനഃപൂർവമല്ലാതെ ചെയ്ത പാപങ്ങൾക്കുവേണ്ടിയും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς δὲ τὴν δευτέραν
  choice: എന്നാൽ രണ്ടാമത്തെ മുറിയിലേക്ക്
  rationale: മുൻസന്ദർഭത്തിൽ വിവരിച്ച സമാഗമകൂടാരത്തിന്റെ രണ്ടാമത്തെ ഉൾവിഭാഗത്തെയാണ് അപൂർണ്ണമായ ഗ്രീക്ക് പ്രയോഗം സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ സ്വാഭാവികവും സ്ഥലപരമായ വ്യത്യാസം വ്യക്തമാക്കുന്നതുമായതിനാൽ ‘മുറി’ ചേർത്തു.
- source_word: ἅπαξ τοῦ ἐνιαυτοῦ
  choice: വർഷത്തിൽ ഒരിക്കൽ
  rationale: വാർഷിക ആവൃത്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ കൃത്യമായി അറിയിക്കുന്നു.
- source_word: μόνος ὁ ἀρχιερεύς
  choice: മഹാപുരോഹിതൻ മാത്രം
  rationale: μόνος സൂചിപ്പിക്കുന്ന വ്യക്തിപരമായ പ്രത്യേകാവകാശം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: οὐ χωρὶς αἵματος
  choice: അതും രക്തം കൂടാതെയല്ല
  rationale: ഗ്രീക്കിലെ നിഷേധാത്മക ഊന്നൽ നിലനിർത്തുകയും ബലിസംബന്ധമായ ‘രക്തം’ എന്ന പ്രതീകം വിശദീകരിച്ച് മാറ്റാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ὃ προσφέρει
  choice: അവൻ ആ രക്തം അർപ്പിക്കുന്നു
  rationale: ബന്ധസർവനാമത്തിന്റെ പൂർവപദമായ രക്തം മലയാളത്തിൽ വ്യക്തമായി ആവർത്തിച്ചു; προσφέρει എന്നതിന്റെ ബലിസംബന്ധമായ അർഥം ‘അർപ്പിക്കുന്നു’ നൽകുന്നു.
- source_word: ὑπὲρ ἑαυτοῦ
  choice: തനിക്കുവേണ്ടിയും
  rationale: ബലിസന്ദർഭത്തിലെ ὑπέρ സൂചിപ്പിക്കുന്ന പ്രതിനിധാനപരമായ പ്രയോജനം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τῶν τοῦ λαοῦ ἀγνοημάτων
  choice: ജനത്തിന്റെ അറിവില്ലാതെ ചെയ്ത പാപങ്ങൾക്കുവേണ്ടിയും
  rationale: ἀγνοήματα വെറും വിവരമില്ലായ്മയല്ല, അറിവില്ലായ്മയാൽ സംഭവിച്ച കുറ്റകരമായ പ്രവൃത്തികളാണെന്ന ധാർമ്മികവും ബലിസംബന്ധവുമായ ശക്തി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ബലിസന്ദർഭത്തിലെ ἀγνοήματα എന്നതിന്റെ സ്വഭാവം
  choice: അറിവില്ലാതെ ചെയ്ത പാപങ്ങൾ
  alternative: മനഃപൂർവമല്ലാതെ ചെയ്ത പാപങ്ങൾ; അറിവില്ലായ്മയുടെ പ്രവൃത്തികൾ
  rationale: പദം അറിവില്ലായ്മയിലോ അബദ്ധത്തിലോ ചെയ്ത കുറ്റങ്ങളെ സൂചിപ്പിക്കുന്നു. ‘അറിവില്ലാതെ ചെയ്ത പാപങ്ങൾ’ എന്നത് അവയുടെ ധാർമ്മിക ഗൗരവം നിലനിർത്തുന്നു; എന്നാൽ ഉദ്ദേശപൂർവതയെക്കുറിച്ചുള്ള എല്ലാ ചോദ്യങ്ങളും വിവർത്തനത്തിൽ മുൻകൂട്ടി തീർപ്പാക്കുന്നില്ല.
- issue: രക്തം അർപ്പിക്കുന്നതിന്റെ ലക്ഷ്യം
  choice: തനിക്കുവേണ്ടിയും ജനത്തിന്റെ പാപങ്ങൾക്കുവേണ്ടിയും
  alternative: തന്റെ പാപങ്ങൾക്കുവേണ്ടിയും ജനത്തിന്റെ പാപങ്ങൾക്കുവേണ്ടിയും
  rationale: ഗ്രീക്ക് ὑπὲρ ἑαυτοῦ എന്നത് ‘തനിക്കുവേണ്ടി’ എന്നാണ് പറയുന്നത്; ഇവിടെ ‘തന്റെ പാപങ്ങൾ’ എന്ന് ചേർക്കുന്നത് മൂലപാഠത്തേക്കാൾ കൂടുതൽ വ്യക്തീകരണമാകുന്നതിനാൽ ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. സമാഗമകൂടാര-ബലി പശ്ചാത്തലം വ്യക്തമാക്കാൻ ‘മഹാപുരോഹിതൻ,’ ‘രക്തം,’ ‘അർപ്പിക്കുന്നു’ എന്നീ പരിചിതമായ പദങ്ങൾ നിലനിർത്തി. ഗ്രീക്കിലെ ദീർഘവാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി; ആശയബന്ധം മാറ്റിയിട്ടില്ല.
