- from: ന്യായപ്രമാണപ്രകാരമുള്ള ഓരോ കല്പനയും മോശെ ജനത്തോടൊക്കെയും പ്രസ്താവിച്ചുകഴിഞ്ഞപ്പോൾ, അവൻ കിടാക്കളുടെ[a] രക്തത്തോടൊപ്പം വെള്ളവും കടുംചുവപ്പുനിറമുള്ള കമ്പിളിനൂലും ഈസോപ്പും എടുത്ത്, ഗ്രന്ഥച്ചുരുളിന്മേലും ജനത്തിന്മേൽ മുഴുവനും തളിച്ചു,
  to: കാരണം, ന്യായപ്രമാണപ്രകാരമുള്ള ഓരോ കല്പനയും മോശെ മുഴുവൻ ജനത്തോടും പ്രസ്താവിച്ചശേഷം, അവൻ കിടാക്കളുടെ[a] രക്തത്തോടൊപ്പം വെള്ളവും കടുംചുവപ്പുനിറമുള്ള കമ്പിളിയും ഈസോപ്പും എടുത്ത്, ഗ്രന്ഥച്ചുരുളിന്മേലും മുഴുവൻ ജനത്തിന്മേലും തളിച്ചു,
