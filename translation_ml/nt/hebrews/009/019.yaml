id: HEB.9.19
reference: Hebrews 9:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λαληθείσης γὰρ πάσης ἐντολῆς κατὰ ⸀τὸν νόμον ὑπὸ Μωϋσέως παντὶ τῷ λαῷ, λαβὼν τὸ αἷμα τῶν ⸀μόσχων μετὰ ὕδατος καὶ ἐρίου κοκκίνου καὶ ὑσσώπου αὐτό τε τὸ βιβλίον καὶ πάντα τὸν λαὸν ἐράντισεν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/019.yaml
  text: For when every commandment according to the law had been spoken by Moses to all the people[a], he took the blood of the calves with water and scarlet wool and hyssop, and sprinkled both the scroll itself and all the people,
translation:
  language: ml
  text: കാരണം, ന്യായപ്രമാണപ്രകാരമുള്ള ഓരോ കല്പനയും മോശെ മുഴുവൻ ജനത്തോടും പ്രസ്താവിച്ചശേഷം, അവൻ കിടാക്കളുടെ[a] രക്തത്തോടൊപ്പം വെള്ളവും കടുംചുവപ്പുനിറമുള്ള കമ്പിളിയും ഈസോപ്പും എടുത്ത്, ഗ്രന്ഥച്ചുരുളിന്മേലും മുഴുവൻ ജനത്തിന്മേലും തളിച്ചു,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഇളം കാളകളുടെ.” യാഗസന്ദർഭത്തിൽ ഗ്രീക്ക് പദം കിടാക്കളെയോ ഇളം കാളകളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαληθείσης γὰρ πάσης ἐντολῆς
  choice: ഓരോ കല്പനയും ... പ്രസ്താവിച്ചുകഴിഞ്ഞപ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ടിന്റെ കാലസംബന്ധമായ അർഥവും πάσης എന്നതിന്റെ വിതരണാത്മകമായ ‘ഓരോ’ എന്ന ഊന്നലും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു. γάρ മുൻവാക്യത്തോടുള്ള വിശദീകരണബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ സന്ദർഭത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളപ്പെടുന്നു.
- source_word: κατὰ τὸν νόμον
  choice: ന്യായപ്രമാണപ്രകാരമുള്ള
  rationale: κατάയുടെ അനുരൂപത/അനുസരണം എന്ന അർഥം ചുരുക്കവും സ്വാഭാവികവുമായ രീതിയിൽ നൽകുന്നു.
- source_word: ὑπὸ Μωϋσέως παντὶ τῷ λαῷ
  choice: മോശെ ജനത്തോടൊക്കെയും
  rationale: മോശെയെ പ്രസ്താവനയുടെ കർത്താവായും മുഴുവൻ ജനത്തെയും ശ്രോതാക്കളായും വ്യക്തമാക്കുന്നു.
- source_word: λαβὼν τὸ αἷμα τῶν μόσχων
  choice: അവൻ കിടാക്കളുടെ രക്തത്തോടൊപ്പം ... എടുത്ത്
  rationale: ആഖ്യാനക്രമം സ്വാഭാവികമായി നിലനിർത്തുന്നു. μόσχων എന്നതിന് നേരിട്ടുള്ള സമാനപദമായി ‘കിടാക്കൾ’ ഉപയോഗിക്കുകയും യാഗസന്ദർഭത്തിൽ സാധ്യമായ മറ്റൊരു അർഥം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: μετὰ ὕδατος καὶ ἐρίου κοκκίνου καὶ ὑσσώπου
  choice: രക്തത്തോടൊപ്പം വെള്ളവും കടുംചുവപ്പുനിറമുള്ള കമ്പിളിനൂലും ഈസോപ്പും
  rationale: μετά സൂചിപ്പിക്കുന്ന കൂടെ/ഒപ്പം എന്ന ബന്ധം അനാവശ്യമായി ‘കലർത്തി’ എന്നു വ്യാഖ്യാനിക്കാതെ സംരക്ഷിക്കുന്നു. κοκκίνου എന്ന നിറപദത്തിന് ആധുനിക മലയാളത്തിൽ വ്യക്തമായ ‘കടുംചുവപ്പുനിറമുള്ള’ എന്നു നൽകി.
- source_word: αὐτό τε τὸ βιβλίον
  choice: ഗ്രന്ഥച്ചുരുളിന്മേലും
  rationale: പുരാതന എഴുത്തുരേഖയുടെ ഭൗതികരൂപം വ്യക്തമാക്കാൻ βιβλίον എന്നത് ‘ഗ്രന്ഥച്ചുരുൾ’ എന്നു പരിഭാഷപ്പെടുത്തി; τε ... καί എന്ന ഏകോപനം രണ്ടു വസ്തുക്കളിലും തളിച്ചതായി മലയാളത്തിലെ ‘-ഉം ... -ഉം’ ഘടനയിലൂടെ നിലനിർത്തുന്നു.
- source_word: καὶ πάντα τὸν λαὸν ἐράντισεν
  choice: ജനത്തിന്മേൽ മുഴുവനും തളിച്ചു
  rationale: πάντα എന്ന സമഗ്രതയും ῥαντίζω എന്ന ആചാരപരമായ തളിക്കലും വ്യക്തവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ഭാഷയിൽ നൽകുന്നു.
theological_decisions:
- issue: പുറപ്പാട് 24-ലെ വിവരണവുമായുള്ള ബന്ധവും μόσχων എന്ന പദത്തിന്റെ അർഥവും
  choice: എബ്രായലേഖനത്തിലെ ഗ്രീക്ക് വാചകം ഉള്ളതുപോലെ പരിഭാഷപ്പെടുത്തി ‘കിടാക്കൾ’ എന്നു മുഖ്യവാചകത്തിൽ നൽകുന്നു.
  alternative: ‘ഇളം കാളകൾ’ എന്നു പരിഭാഷപ്പെടുത്തുക, അല്ലെങ്കിൽ പഴയനിയമത്തിലെ ആചാരവിവരങ്ങൾ മുഖ്യവാചകത്തിൽ വികസിപ്പിക്കുക.
  rationale: പഴയനിയമവിവരണവുമായി ഒത്തുചേരാൻ ഈ വാക്യത്തിന്റെ സംക്ഷിപ്തമായ പുനരാഖ്യാനം മാറ്റുന്നില്ല. യാഗസന്ദർഭത്തിൽ സാധ്യമായ പദാർഥവ്യത്യാസം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: വെള്ളം, കമ്പിളിനൂൽ, ഈസോപ്പ് എന്നിവ രക്തവുമായി ഉള്ള ബന്ധം
  choice: ‘രക്തത്തോടൊപ്പം’ എന്നു പരിഭാഷപ്പെടുത്തി അനുഗമനബന്ധം മാത്രം വ്യക്തമാക്കുന്നു.
  alternative: ‘രക്തത്തിൽ കലർത്തി’ എന്നോ ആചാരക്രമം വിശദീകരിച്ചോ പരിഭാഷപ്പെടുത്തുക.
  rationale: μετά എന്ന പദം ഇവയെ എടുത്തതിലുള്ള അനുഗമനം സൂചിപ്പിക്കുന്നു; കലർത്തിയെന്ന പ്രത്യേക നിഗമനം മുഖ്യവാചകത്തിൽ ചേർക്കാതിരിക്കുന്നത് മൂലപാഠത്തിന്റെ പരിധിയും അവ്യക്തതയും കാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ആചാരപരമായ ആശയങ്ങൾക്ക് പരിചിതമായ ‘തളിച്ചു’, ‘ഈസോപ്പ്’ എന്നീ പദങ്ങൾ ഉപയോഗിച്ചു; പുരാതന രേഖയുടെ രൂപം വ്യക്തമാക്കാൻ ‘ഗ്രന്ഥച്ചുരുൾ’ തിരഞ്ഞെടുത്തു.
