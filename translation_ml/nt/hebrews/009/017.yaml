id: HEB.9.17
reference: Hebrews 9:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διαθήκη γὰρ ἐπὶ νεκροῖς βεβαία, ἐπεὶ ⸀μήποτε ἰσχύει ὅτε ζῇ ὁ διαθέμενος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/017.yaml
  text: For a covenant is valid over dead ones[b][a], since it is never in force while the one who made it is living.
translation:
  language: ml
  text: കാരണം, മരിച്ചവരുടെ കാര്യത്തിൽ ഉടമ്പടി പ്രാബല്യമുള്ളതാണ്[b][a]; അത് ചെയ്തയാൾ ജീവിച്ചിരിക്കുമ്പോൾ അതു ഒരിക്കലും പ്രാബല്യത്തിൽ വരുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “ഒരു വിൽപത്രം മരണശേഷം മാത്രമേ പ്രാബല്യത്തിലുള്ളതാകൂ; അതു തയ്യാറാക്കിയയാൾ ജീവിച്ചിരിക്കുമ്പോൾ അത് ഒരിക്കലും പ്രാബല്യത്തിൽ വരുകയില്ല.” ഗ്രീക്കുപദത്തിന് ‘ഉടമ്പടി’ എന്നും ‘വിൽപത്രം’ എന്നും അർഥമാകാം.'
    reason: alternative_reading
  - marker: b
    text: “മരിച്ചവരുടെ കാര്യത്തിൽ” എന്ന ഗ്രീക്കുപ്രയോഗം സംക്ഷിപ്തമാണ്. വിൽപത്രസന്ദർഭത്തിൽ മരിച്ചവരെയോ, ഉടമ്പടി ഉറപ്പിക്കലിൽ ഉൾപ്പെട്ട മരണങ്ങളെയോ അത് സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαθήκη
  choice: ഉടമ്പടി
  rationale: എബ്രായർ 8–10-ലെ ഉടമ്പടി-ബലി പശ്ചാത്തലത്തോട് യോജിക്കുന്നു; ‘വിൽപത്രം’ എന്ന നിയമപരമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἐπὶ νεκροῖς
  choice: മരിച്ചവരുടെമേൽ മാത്രമേ
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തവും വിവാദവിധേയവുമായ പ്രയോഗം അതിരുകടന്ന് വിശദീകരിക്കാതെ സൂക്ഷിക്കുന്നു. ‘മാത്രമേ’ എന്നത് തുടർന്നുള്ള വാക്യത്തിലെ ജീവിച്ചിരിക്കുന്ന കാലത്തോടുള്ള വൈരുധ്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: βεβαία
  choice: പ്രാബല്യമുള്ളൂ
  rationale: നിയമപരമോ ഉടമ്പടിസംബന്ധമോ ആയ സാധുതയും പ്രവർത്തനശക്തിയും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ἐπεὶ
  choice: കാരണം
  rationale: മുൻപ്രസ്താവനയ്ക്കുള്ള വിശദീകരണകാരണത്തെ വ്യക്തമാക്കുന്നു.
- source_word: μήποτε
  choice: ഒരിക്കലും ... വരുകയില്ല
  rationale: ഈ സന്ദർഭത്തിലെ ‘ഒരിക്കലും ഇല്ല’ എന്ന കാലപരമായ നിഷേധം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἰσχύει
  choice: പ്രാബല്യത്തിൽ വരുക
  rationale: ഉടമ്പടിയുടെയോ വിൽപത്രത്തിന്റെയോ പ്രവർത്തനക്ഷമത എന്ന നിയമസൂചന നിലനിർത്തുന്നു.
- source_word: ὅτε ζῇ
  choice: ജീവിച്ചിരിക്കുമ്പോൾ
  rationale: മരണാവസ്ഥയോടുള്ള കാലപരമായ വൈരുധ്യം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ὁ διαθέμενος
  choice: അത് ചെയ്തയാൾ
  rationale: ‘ഉടമ്പടി ചെയ്തയാൾ’ എന്നും ‘വിൽപത്രം തയ്യാറാക്കിയയാൾ’ എന്നും ഗ്രഹിക്കാവുന്ന വിധത്തിൽ കർത്താവിന്റെ സ്വഭാവം തുറന്നുവയ്ക്കുന്നു.
theological_decisions:
- issue: διαθήκη എന്നത് ‘ഉടമ്പടി’ എന്നോ ‘വിൽപത്രം’ എന്നോ പരിഭാഷപ്പെടുത്തേണ്ടതുണ്ടോ
  choice: മുഖ്യപാഠത്തിൽ ‘ഉടമ്പടി’
  alternative: ‘വിൽപത്രം’
  rationale: എബ്രായർ 8–10-ന്റെ മുഖ്യചട്ടക്കൂട് ഉടമ്പടിയുടേതാണ്; എന്നാൽ 9:16–17-ലെ നിയമപരമായ വിൽപത്രവായന യഥാർഥ സാധ്യതയായതിനാൽ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: ἐπὶ νεκροῖς എന്ന പ്രയോഗത്തിന്റെ സൂചന എത്രത്തോളം വ്യക്തമാക്കണം
  choice: ‘മരിച്ചവരുടെമേൽ’ എന്ന തുറന്ന പ്രയോഗം
  alternative: ‘മരണം സംഭവിച്ചശേഷം’; ‘മരിച്ച ബലിമൃഗങ്ങളുടെ അടിസ്ഥാനത്തിൽ’
  rationale: ഇത് വിൽപത്രകർത്താവിന്റെ മരണത്തെയോ ഉടമ്പടി ഉറപ്പിക്കുന്ന ബലിമരണത്തെയോ സൂചിപ്പിക്കാമെന്ന തർക്കം തീർപ്പാക്കാതെ ഗ്രീക്കിലെ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ഗ്രീക്കിലെ ഉദ്ദേശ്യപൂർവമായ സംക്ഷിപ്തതയും ഉടമ്പടി/വിൽപത്രം എന്ന ദ്വയാർഥതയും മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പുകളിലും സംരക്ഷിച്ചു.
