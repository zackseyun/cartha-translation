  source_fidelity: 'മൂലഗ്രീക്കിലെ മുഖ്യവിരോധവും ഘടകങ്ങളും പൊതുവേ നന്നായി പ്രതിഫലിക്കുന്നു: മനുഷ്യനിർമിത വിശുദ്ധസ്ഥലങ്ങൾ യഥാർഥ സ്വർഗീയ കാര്യങ്ങളുടെ പ്രതിരൂപങ്ങളാണെന്നും മശീഹ സ്വർഗത്തിലേക്കുതന്നെ പ്രവേശിച്ചെന്നും ദൈവസന്നിധിയിൽ നമുക്കുവേണ്ടി പ്രത്യക്ഷനാകുന്നുവെന്നും വിവർത്തനം പറയുന്നു. എന്നാൽ ‘മനുഷ്യകൈകളാൽ’ എന്നത് χειροποίητα-യുടെ സാധാരണയും ഗ്രന്ഥപരവുമായ ‘കൈകളാൽ നിർമിക്കപ്പെട്ട’ എന്ന പ്രയോഗത്തെ അനാവശ്യമായി ‘മനുഷ്യ’ എന്നു വ്യക്തമാക്കി വികസിപ്പിക്കുന്നു. കൂടാതെ ‘എന്തെന്നാൽ’ കൊണ്ട് ആരംഭിക്കുന്ന മലയാളവാക്യത്തിൽ ‘പിന്നെയോ’ സ്വാഭാവികമല്ല; ഗ്രീക്കിലെ ἀλλά-യുടെ ശക്തമായ വിരോധം ‘മറിച്ച്’ കൂടുതൽ കൃത്യമായി നൽകും.'
  naturalness: ‘സ്വർഗത്തിലേക്കുതന്നെ’യും ‘ദൈവസന്നിധിയിൽ പ്രത്യക്ഷനാകാൻ’യും ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികമാണ്. വാക്യഘടന കൂടുതൽ ഒഴുക്കോടെയും വ്യക്തതയോടെയും വരാൻ ‘പിന്നെയോ’യ്ക്ക് പകരം ‘മറിച്ച്’ ഉപയോഗിക്കണം. ‘യഥാർഥമായവ’ സാധുവാണെങ്കിലും ‘യഥാർഥ കാര്യങ്ങൾ’ വായനക്കാരന് കൂടുതൽ വ്യക്തമാണ്; ഗ്രീക്കിലെ നാമവത്കൃത ബഹുവചനവും നിലനിൽക്കും.
