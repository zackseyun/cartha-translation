id: HEB.9.24
reference: Hebrews 9:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐ γὰρ εἰς χειροποίητα ⸂εἰσῆλθεν ἅγια⸃ Χριστός, ἀντίτυπα τῶν ἀληθινῶν, ἀλλ’ εἰς αὐτὸν τὸν οὐρανόν, νῦν ἐμφανισθῆναι τῷ προσώπῳ τοῦ θεοῦ ὑπὲρ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/024.yaml
  text: For Messiah did not enter into holy places made by hands[a], copies of the true things, but into heaven itself[c][b], now to appear in the presence of God on our behalf.
translation:
  language: ml
  text: എന്തെന്നാൽ, കൈകളാൽ നിർമിക്കപ്പെട്ടതും യഥാർഥ കാര്യങ്ങളുടെ പ്രതിരൂപങ്ങളുമായ വിശുദ്ധസ്ഥലങ്ങളിലേക്കല്ല മശീഹ പ്രവേശിച്ചത്; മറിച്ച്, ഇപ്പോൾ നമുക്കുവേണ്ടി ദൈവസന്നിധിയിൽ[a] പ്രത്യക്ഷനാകാൻ സ്വർഗത്തിലേക്കുതന്നെയാണ് പ്രവേശിച്ചത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദൈവസന്നിധിയിൽ’ എന്നതിന്റെ അക്ഷരാർഥം ‘ദൈവത്തിന്റെ മുഖത്തിനു മുമ്പിൽ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστός
  choice: മശീഹ
  rationale: ഇവിടെ അഭിഷിക്തനായ രാജാവും മഹാപുരോഹിതനുമായ പദവിയുടെ അർഥം സജീവമായതിനാൽ, കേവലം പേരുപോലെ തോന്നാവുന്ന രൂപത്തിനുപകരം പദവിയെ വ്യക്തമാക്കുന്ന ‘മശീഹ’ ഉപയോഗിച്ചു.
- source_word: χειροποίητα
  choice: മനുഷ്യകൈകളാൽ നിർമിക്കപ്പെട്ട
  rationale: ഭൗമിക വിശുദ്ധസ്ഥലവും സ്വർഗീയ യാഥാർഥ്യവും തമ്മിലുള്ള വൈരുധ്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἅγια
  choice: വിശുദ്ധസ്ഥലങ്ങൾ
  rationale: ഗ്രീക്കിലെ നപുംസകലിംഗ ബഹുവചനം സംരക്ഷിക്കുകയും സമാഗമകൂടാര-ആരാധനാസന്ദർഭം വ്യക്തമാക്കുകയും ചെയ്യുന്നു; ഒരു പ്രത്യേക അറയിലേക്ക് അർഥം ചുരുക്കുന്നില്ല.
- source_word: ἀντίτυπα
  choice: പ്രതിരൂപങ്ങൾ
  rationale: ഭൗമിക വിശുദ്ധസ്ഥലങ്ങൾ സ്വർഗീയ യാഥാർഥ്യങ്ങളോട് അനുരൂപമായി അവയെ പ്രതിനിധാനം ചെയ്യുന്നു എന്ന ആശയം നൽകുന്നു; ‘പകർപ്പുകൾ’ എന്നതിനെക്കാൾ ഈ ബന്ധത്തിന്റെ സൂക്ഷ്മത നന്നായി സൂചിപ്പിക്കുന്നു.
- source_word: τῶν ἀληθινῶν
  choice: യഥാർഥമായവയുടെ
  rationale: ഗ്രീക്കിലെ വിശേഷണത്തിന്റെ നാമവാചക ബഹുവചനപ്രയോഗം നിലനിർത്തുന്നു; ‘സത്യസന്ധമായ’ എന്നല്ല, അന്തിമവും യഥാർഥവുമായ സ്വർഗീയ കാര്യങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: αὐτὸν τὸν οὐρανόν
  choice: സ്വർഗത്തിലേക്കുതന്നെ
  rationale: αὐτόν നൽകുന്ന ഊന്നൽ ‘തന്നെ’ എന്നതിലൂടെ പ്രകടമാക്കി, ഭൗമിക പ്രതിരൂപത്തിനു പകരം സ്വർഗീയ യാഥാർഥ്യത്തിലേക്കുള്ള പ്രവേശനം വ്യക്തമാക്കുന്നു.
- source_word: νῦν ἐμφανισθῆναι
  choice: ഇപ്പോൾ ... പ്രത്യക്ഷനാകാൻ
  rationale: νῦν എന്ന കാലസൂചനയും പ്രവേശനത്തിന്റെ ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന infinitive-ഉം സ്വാഭാവികമായി നിലനിർത്തുന്നു; മൂലത്തിൽ വ്യക്തമല്ലാത്ത അധിക ആശയം ചേർക്കുന്നില്ല.
- source_word: τῷ προσώπῳ τοῦ θεοῦ
  choice: ദൈവസന്നിധിയിൽ
  rationale: അക്ഷരാർഥത്തിലെ ‘ദൈവത്തിന്റെ മുഖത്തിനു മുമ്പിൽ’ എന്ന വ്യക്തിപരമായ സമീപ്യത സ്വാഭാവിക മലയാള പ്രയോഗത്തിൽ നൽകുന്നു.
- source_word: ὑπὲρ ἡμῶν
  choice: നമുക്കുവേണ്ടി
  rationale: മഹാപുരോഹിതന്റെ പ്രതിനിധിത്വപരവും മധ്യസ്ഥതാപരവുമായ പ്രവർത്തനം വ്യക്തമാക്കുന്നു; വാക്യം പറയുന്നതിലുപരി ഒരു പ്രത്യേക പ്രായശ്ചിത്തസിദ്ധാന്തം ചുമത്തുന്നില്ല.
theological_decisions:
- issue: ἅγια എന്ന ആരാധനാസംബന്ധമായ പദത്തിന്റെ എണ്ണം
  choice: ‘വിശുദ്ധസ്ഥലങ്ങൾ’ എന്ന ബഹുവചനം
  alternative: ‘വിശുദ്ധമന്ദിരം’ അഥവാ ‘അതിവിശുദ്ധസ്ഥലം’ എന്ന ഏകവചനം
  rationale: മൂലത്തിലെ ബഹുവചനം സംരക്ഷിച്ച് സമാഗമകൂടാരത്തിന്റെ വിശുദ്ധ മേഖലകളെക്കുറിച്ചുള്ള സാധ്യത തുറന്നുവെക്കുന്നു; ഒരു പ്രത്യേക അറയെന്ന വ്യാഖ്യാനം നിർബന്ധിക്കുന്നില്ല.
- issue: Χριστός എന്ന ക്രിസ്തുശാസ്ത്രപരമായ പദവി
  choice: ‘മശീഹ’
  alternative: ‘ക്രിസ്തു’
  rationale: ഈ മഹാപുരോഹിതസംബന്ധമായ വാദത്തിൽ പദവിയുടെ അർഥം സജീവമാണ്. ‘മശീഹ’ അത് തുറന്നുകാട്ടുന്നു; വ്യക്തിയുടെ തിരിച്ചറിയലിലോ ക്രിസ്തുശാസ്ത്രപരമായ ഉള്ളടക്കത്തിലോ മാറ്റമില്ല.
- issue: ὑπὲρ ἡμῶν എന്ന പ്രതിനിധിത്വപ്രയോഗം
  choice: ‘നമുക്കുവേണ്ടി’
  alternative: ‘നമ്മുടെ പക്ഷമായി’
  rationale: വാക്യത്തിലെ മഹാപുരോഹിത-മധ്യസ്ഥ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; അതിന്റെ പരിധിയെ ഒരു പ്രത്യേക സിദ്ധാന്തരൂപത്തിൽ ചുരുക്കുന്നില്ല.
- issue: ἐμφανισθῆναι എന്നതിന്റെ പ്രവർത്തകഭാവം
  choice: ‘പ്രത്യക്ഷനാകാൻ’
  alternative: ‘തന്നെത്തന്നെ ഹാജരാക്കാൻ’
  rationale: മൂലത്തിലെ passive രൂപം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുകയും, വ്യക്തമല്ലാത്ത reflexive ആശയം ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ആരാധനാസംബന്ധമായ സാങ്കേതികത നിലനിർത്തിയെങ്കിലും അതിപുരാതനമായ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി. പ്രധാനവാക്യത്തിലെ [a] അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട പ്രയോഗത്തിനുശേഷം വാക്യാവസാനത്തിൽ ചേർത്തിരിക്കുന്നു.
