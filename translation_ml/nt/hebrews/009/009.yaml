id: HEB.9.9
reference: Hebrews 9:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἥτις παραβολὴ εἰς τὸν καιρὸν τὸν ἐνεστηκότα, καθ’ ⸀ἣν δῶρά τε καὶ θυσίαι προσφέρονται μὴ δυνάμεναι κατὰ συνείδησιν τελειῶσαι τὸν λατρεύοντα,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/009.yaml
  text: which is a parable for the present time[a], according to which both gifts and sacrifices are offered that are not able to perfect the worshiper with respect to conscience,
translation:
  language: ml
  text: ഇപ്പോഴുള്ള കാലത്തിനുള്ള ഒരു ഉപമയാണത്[a]; അതിനനുസരിച്ച് വഴിപാടുകളും യാഗങ്ങളും അർപ്പിക്കപ്പെടുന്നു; അവയ്ക്ക് മനസ്സാക്ഷിയുടെ കാര്യത്തിൽ ആരാധിക്കുന്നവനെ പൂർണനാക്കാൻ കഴിയുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇപ്പോഴുള്ള കാലത്തിനുള്ള ഒരു പ്രതീകം” അല്ലെങ്കിൽ “ദൃഷ്ടാന്തം.”
    reason: ‘ഉപമ’യ്ക്കു ഈ സന്ദർഭത്തിൽ സാധ്യമായ ‘പ്രതീകം’ അല്ലെങ്കിൽ ‘ദൃഷ്ടാന്തം’ എന്ന പരിഭാഷകൾ സൂചിപ്പിക്കുന്നു.
lexical_decisions:
- source_word: ἥτις
  choice: അത്
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ സമാഗമകൂടാരക്രമത്തെ സൂചിപ്പിക്കുകയും വിശദീകരണബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: παραβολὴ
  choice: ഉപമ
  rationale: ആലങ്കാരികമായ പൊരുത്തം സൂചിപ്പിക്കുന്ന പദത്തിന്റെ വിശാല അർഥം നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിൽ സാധ്യമായ ‘പ്രതീകം/ദൃഷ്ടാന്തം’ എന്ന അർഥങ്ങൾ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: εἰς τὸν καιρὸν τὸν ἐνεστηκότα
  choice: ഇപ്പോഴത്തെ കാലത്തേക്കുള്ള
  rationale: വാദത്തിൽ നിലവിലുള്ള കാലത്തോടുള്ള ബന്ധം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: καθ’ ἣν
  choice: അതനുസരിച്ച്
  rationale: ഉപമയോ സമാഗമകൂടാരക്രമമോ തുടർന്നുള്ള ആരാധനാക്രമത്തെ നിയന്ത്രിക്കുന്ന ബന്ധം സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
- source_word: δῶρά τε καὶ θυσίαι
  choice: വഴിപാടുകളും യാഗങ്ങളും
  rationale: ആരാധനാസംബന്ധമായ രണ്ടു വ്യത്യസ്ത പദങ്ങളും ജോടിയായി നിലനിർത്തുന്നു.
- source_word: προσφέρονται
  choice: അർപ്പിക്കപ്പെടുന്ന
  rationale: വർത്തമാനകാല കർമണി രൂപത്തിലെ തുടർച്ചയായ ആരാധനാക്രിയ നിലനിർത്തുന്നു.
- source_word: μὴ δυνάμεναι
  choice: കഴിയുന്നില്ല
  rationale: വഴിപാടുകൾക്കും യാഗങ്ങൾക്കും ഉള്ള അശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പറയുന്നു.
- source_word: κατὰ συνείδησιν
  choice: മനസ്സാക്ഷിയുടെ കാര്യത്തിൽ
  rationale: പരിപൂർണത കൈവരാത്ത മേഖല മനസ്സാക്ഷിയാണെന്ന് വ്യക്തമാക്കുന്നു; ആത്മാർഥത മാത്രം ഉദ്ദേശിക്കുന്നുവെന്ന ധാരണ ഒഴിവാക്കുന്നു.
- source_word: τελειῶσαι
  choice: പരിപൂർണനാക്കാൻ
  rationale: എബ്രായലേഖനത്തിലെ ലക്ഷ്യസിദ്ധി, പൂർണയോഗ്യത എന്നീ ദൈവശാസ്ത്രഭാരമുള്ള ആശയങ്ങൾ നിലനിർത്തുന്നു.
- source_word: τὸν λατρεύοντα
  choice: ആരാധിക്കുന്നവനെ
  rationale: ആരാധനയിൽ ഏർപ്പെട്ടിരിക്കുന്ന ഏകവചന വ്യക്തിയെ സ്വാഭാവികവും ഉൾക്കൊള്ളാവുന്നതുമായ ഭാഷയിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ആരാധനാക്രമ-മാതൃകാസംബന്ധമായ സന്ദർഭത്തിൽ παραβολή എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ഉപമ
  alternative: പ്രതീകം; ദൃഷ്ടാന്തം
  rationale: ഭൗമിക വിശുദ്ധമന്ദിരക്രമവും ഇപ്പോഴത്തെ കാലവും തമ്മിലുള്ള ആലങ്കാരിക പൊരുത്തം നിലനിർത്തുന്നു; അതിനെ വെറും അമൂർത്തമായ പ്രതീകമായി ചുരുക്കുന്നില്ല. സന്ദർഭത്തിൽ സാധ്യമായ മറ്റു പരിഭാഷകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ആരാധനാസംബന്ധമായ ‘വഴിപാടുകൾ’, ‘യാഗങ്ങൾ’, ‘മനസ്സാക്ഷി’, ‘പരിപൂർണനാക്കുക’ എന്നീ പദങ്ങൾ മൂലത്തിലെ വ്യത്യാസങ്ങളും എബ്രായലേഖനത്തിന്റെ ആശയഭാരവും നിലനിർത്തുന്നു.
