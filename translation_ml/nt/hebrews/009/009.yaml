  to: ഇപ്പോഴുള്ള കാലത്തിനുള്ള ഒരു ഉപമയാണത്[a]; അതിനനുസരിച്ച് വഴിപാടുകളും യാഗങ്ങളും അർപ്പിക്കപ്പെടുന്നു; അവയ്ക്ക് മനസ്സാക്ഷിയുടെ കാര്യത്തിൽ ആരാധിക്കുന്നവനെ പൂർണനാക്കാൻ കഴിയുന്നില്ല.
  rationale: The revision retains the draft’s lexical decisions but makes the passive offering of the paired cultic gifts explicit and then clearly attributes their incapacity to perfect the worshiper in respect to conscience. It also improves modern Malayalam idiom without resolving the figurative force of παραβολή beyond what the source permits.
