  text: By this the Holy Spirit is indicating that the way into the holy places has not yet been revealed while the first tabernacle still has standing,
translation:
  language: ml
  text: ഇതിലൂടെ പരിശുദ്ധാത്മാവ് സൂചിപ്പിക്കുന്നത്, ആദ്യത്തെ തിരുനിവാസം നിലനിൽക്കുന്നിടത്തോളം വിശുദ്ധസ്ഥാനങ്ങളിലേക്കുള്ള വഴി[a] ഇനിയും വെളിപ്പെട്ടിട്ടില്ല എന്നതാണ്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “വിശുദ്ധമന്ദിരത്തിലേക്കുള്ള വഴി.” ഗ്രീക്ക് പ്രയോഗം വിശുദ്ധസ്ഥാനങ്ങളെ പൊതുവായി സൂചിപ്പിക്കാം; ചിലർ ഇതിനെ കൂടുതൽ പ്രത്യേകമായി “അതിവിശുദ്ധസ്ഥലത്തിലേക്കുള്ള വഴി” എന്നു മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: അഥവാ “ആദ്യത്തെ തിരുനിവാസം ഇപ്പോഴും നിൽക്കുന്നിടത്തോളം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δηλοῦντος
  choice: സൂചിപ്പിക്കുന്നത്
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് ഘടനയുടെ വിശദീകരണസ്വഭാവവും വർത്തമാനകാല പ്രാബല്യവും സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: πνεύματος τοῦ ἁγίου
  choice: പരിശുദ്ധാത്മാവ്
  rationale: പുതിയനിയമത്തിലെ പതിവായ പരാമർശത്തിന് യോജിച്ച, സ്വാഭാവികവും മാന്യവുമായ മലയാളപ്രയോഗം.
- source_word: μήπω πεφανερῶσθαι
  choice: ഇനിയും വെളിപ്പെട്ടിട്ടില്ല
  rationale: പെർഫെക്റ്റ് പാസീവ് ഇൻഫിനിറ്റീവ് സൂചിപ്പിക്കുന്ന, ഇതുവരെ വെളിപ്പെടുത്തപ്പെടാതെ തുടരുന്ന അവസ്ഥ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: τὴν τῶν ἁγίων ὁδὸν
  choice: വിശുദ്ധസ്ഥാനങ്ങളിലേക്കുള്ള വഴി
  rationale: ആരാധനാസ്ഥലത്തെ സൂചിപ്പിക്കുന്ന ബഹുവചനത്തിന്റെ വ്യാപ്തി നിലനിർത്തുകയും സന്ദർഭം ആവശ്യപ്പെടുന്ന പ്രവേശനാർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: πρώτης σκηνῆς
  choice: ആദ്യത്തെ തിരുനിവാസം
  rationale: ഉടൻമുമ്പുള്ള കൂടാരവിഭാഗങ്ങളുടെ സ്ഥാനപരമായ വേർതിരിവിൽ ‘ആദ്യത്തെ’ എന്നത് നിലനിർത്തുന്നു; ‘തിരുനിവാസം’ ആരാധനാപരമായ σκηνή എന്ന ആശയം സാധാരണ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐχούσης στάσιν
  choice: നിലനിൽക്കുന്നിടത്തോളം
  rationale: ആദ്യ തിരുനിവാസത്തിന്റെ തുടർന്നുള്ള നിലനിൽപ്പ് അഥവാ പ്രാബല്യം എന്ന അർഥം നൽകുന്നു; χρονപരമായ ബന്ധം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാക്കുന്നു.
- source_word: ἔτι
  choice: ഇനിയും
  rationale: വെളിപ്പെടാത്ത അവസ്ഥയുടെ തുടർച്ചയെ സ്വാഭാവികമായി അടയാളപ്പെടുത്തുന്നു.
theological_decisions:
- issue: τῶν ἁγίων എന്നതിന്റെ സൂചിതാർഥം
  choice: ആരാധനാപരമായ വിശുദ്ധസ്ഥാനങ്ങളിലേക്കുള്ള പ്രവേശനം
  alternative: വിശുദ്ധന്മാരുടെ വഴി
  rationale: ചുറ്റുപാടുള്ള വാക്യങ്ങൾ തിരുനിവാസത്തിന്റെ ക്രമീകരണത്തെയും പുരോഹിതപ്രവേശനത്തെയും കുറിച്ചായതിനാൽ ഇവിടെ അർഥം വ്യക്തികളല്ല, വിശുദ്ധസ്ഥലങ്ങളാണ്.
- issue: വിശുദ്ധസ്ഥാനത്തിന്റെ കൃത്യത
  choice: വിശുദ്ധസ്ഥാനങ്ങൾ എന്ന വിശാലമായ പ്രയോഗം
  alternative: അതിവിശുദ്ധസ്ഥലം മാത്രം
  rationale: സന്ദർഭം ഉള്ളിലെ അതിവിശുദ്ധസ്ഥലത്തെ പ്രത്യേകമായി സൂചിപ്പിക്കാമെങ്കിലും, ഗ്രീക്കിലെ ബഹുവചനം അതിലധികം വ്യാപ്തിയുള്ളതാണ്; അതിനാൽ പ്രധാനപാഠത്തിൽ ഈ യഥാർഥ അവ്യക്തത നിലനിർത്തുന്നു.
- issue: ἐχούσης στάσιν എന്നതിലെ നിലനിൽപ്പും പ്രാബല്യവും
  choice: നിലനിൽക്കുന്നിടത്തോളം
  alternative: ഇപ്പോഴും നിൽക്കുന്നിടത്തോളം
  rationale: പ്രയോഗം ഭൗതികമായി നിൽക്കുന്നതിനെ മാത്രം അല്ല, തുടർന്നുള്ള സ്ഥാനം അല്ലെങ്കിൽ പ്രാബല്യവും സൂചിപ്പിക്കാം; പ്രധാനപാഠം ഈ വിപുലത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ആരാധനാപരമായ പശ്ചാത്തലം നിലനിർത്താൻ ‘തിരുനിവാസം’, ‘വിശുദ്ധസ്ഥാനങ്ങൾ’ എന്നീ പദങ്ങൾ ഉപയോഗിച്ചു; ഗ്രീക്കിലെ യഥാർഥ അർഥവ്യാപ്തി അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
