id: HEB.9.5
reference: Hebrews 9:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὑπεράνω δὲ αὐτῆς Χερουβὶν δόξης κατασκιάζοντα τὸ ἱλαστήριον· περὶ ὧν οὐκ ἔστιν νῦν λέγειν κατὰ μέρος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/005.yaml
  text: And above it were the cherubim of glory overshadowing the atoning sacrifice[a]; about these things it is not now possible to speak in detail.
translation:
  language: ml
  text: അതിനു മുകളിൽ, മഹത്ത്വത്തിന്റെ കെരൂബുകൾ പ്രായശ്ചിത്തമൂടിയുടെമേൽ നിഴൽ വിരിച്ചുനിന്നു[a]. ഇവയെക്കുറിച്ച് ഇപ്പോൾ ഓരോന്നായി വിശദമായി പറയാൻ കഴിയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കൃപാസനം’; ഇവിടെ ഉദ്ദേശിക്കുന്നത് നിയമപെട്ടകത്തിന്റെ മൂടിയാണ്. ഈ ഗ്രീക്കുപദത്തിന് ‘പ്രായശ്ചിത്തോപാധി’ എന്ന അർഥവും വരാം.
    reason: ἱλαστήριον എന്ന പദത്തിന്റെ വസ്തുസൂചകവും പ്രായശ്ചിത്തപരവുമായ അർഥസാധ്യതകൾ സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: ὑπεράνω δὲ αὐτῆς
  choice: അതിനു മുകളിൽ
  rationale: മുൻവാക്യത്തിലെ നിയമപെട്ടകത്തെയാണ് സ്ത്രീലിംഗ സർവനാമം സൂചിപ്പിക്കുന്നത്. ആവർത്തനം ഒഴിവാക്കി സ്ഥലബന്ധം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: Χερουβὶν δόξης
  choice: മഹത്ത്വത്തിന്റെ കെരൂബുകൾ
  rationale: δόξης എന്ന ബന്ധവിഭക്തിയുടെ സംക്ഷിപ്തതയും ദൈവിക മഹത്ത്വവുമായുള്ള ബന്ധത്തിലെ അർഥതുറന്ന നിലയും സംരക്ഷിക്കുന്നു; ‘മഹത്തായ കെരൂബുകൾ’ എന്ന് ഗുണവിശേഷണമാക്കി ചുരുക്കുന്നില്ല.
- source_word: κατασκιάζοντα
  choice: നിഴൽ വിരിച്ചുനിന്നു
  rationale: കെരൂബുകൾ മൂടിക്കു മുകളിലായി ചിറകുകൾ വിരിച്ചു നിഴലേകുന്ന ദൃശ്യബന്ധം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; ഗ്രീക്കിലെ വർത്തമാന കൃദന്തരൂപത്തിന്റെ തുടരുന്ന നില ‘നിന്നു’ എന്നതിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: τὸ ἱλαστήριον
  choice: പ്രായശ്ചിത്തമൂടി
  rationale: ഈ കൂടാരോപകരണസന്ദർഭത്തിൽ പദം നിയമപെട്ടകത്തിന്റെ മൂടിയെന്ന ദൃശ്യവസ്തുവിനെയാണ് സൂചിപ്പിക്കുന്നത്; അതേസമയം പ്രായശ്ചിത്തവുമായി അതിനുള്ള ബന്ധവും സംയുക്തപദം നിലനിർത്തുന്നു. പദത്തിന്റെ മറ്റു സാധ്യമായ വ്യാഖ്യാനങ്ങൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: περὶ ὧν
  choice: ഇവയെക്കുറിച്ച്
  rationale: ഇപ്പോൾ പരാമർശിച്ച കൂടാരോപകരണങ്ങളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: οὐκ ἔστιν νῦν λέγειν κατὰ μέρος
  choice: ഇപ്പോൾ ഓരോന്നായി വിശദമായി പറയാൻ കഴിയില്ല
  rationale: κατὰ μέρος എന്നതിലെ ‘ഓരോന്നായി/വിശദമായി’ എന്ന ആശയവും ഇപ്പോഴത്തെ ചർച്ചയിൽ അതിനു സാധ്യതയില്ലെന്ന വാക്യത്തിന്റെ ഭാവവും വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ἱλαστήριον എന്ന പദത്തിന്റെ കൂടാരോപകരണസന്ദർഭത്തിലെ വിവർത്തനം
  choice: പ്രായശ്ചിത്തമൂടി
  alternative: കൃപാസനം; നിയമപെട്ടകത്തിന്റെ മൂടി; പ്രായശ്ചിത്തോപാധി
  rationale: കെരൂബുകൾ അതിനു മുകളിൽ നിഴൽ വിരിക്കുന്നു എന്ന വാക്യഘടന ഇവിടെ ഒരു ഭൗതിക മൂടിയാണ് നേരിട്ടുള്ള സൂചിതവസ്തുവെന്ന് വ്യക്തമാക്കുന്നു. എങ്കിലും ἱλαστήριον എന്ന പദത്തിന്റെ പ്രായശ്ചിത്തപരമായ അർഥഭാരം നഷ്ടപ്പെടുത്താതിരിക്കാൻ ‘പ്രായശ്ചിത്തമൂടി’ സ്വീകരിച്ചു; പരമ്പരാഗതവും വിപുലവുമായ വായനകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: Χερουβὶν δόξης എന്ന ബന്ധവിഭക്തിയുടെ വ്യാഖ്യാനം
  choice: മഹത്ത്വത്തിന്റെ കെരൂബുകൾ
  alternative: മഹത്ത്വമുള്ള കെരൂബുകൾ; ദൈവമഹത്ത്വവുമായി ബന്ധപ്പെട്ട കെരൂബുകൾ
  rationale: ഇത് കെരൂബുകളുടെ മഹിമയെയോ അവ ദൈവമഹത്ത്വവുമായി ബന്ധപ്പെട്ടിരിക്കുന്നതിനെയോ സൂചിപ്പിക്കാം. മൂലത്തിലെ സംക്ഷിപ്തവും വ്യാഖ്യാനപരമായി തുറന്നതുമായ പ്രയോഗം പ്രധാനവാക്യത്തിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘കെരൂബുകൾ’ എന്ന ബൈബിൾസംബന്ധിയായ ലിപ്യന്തരണം നിലനിർത്തി. ‘പ്രായശ്ചിത്തമൂടി’ എന്ന സുതാര്യമായ സംയുക്തപദം ഭൗതിക വസ്തുവിനെയും അതിന്റെ ആരാധനാപരമായ പ്രവർത്തനത്തെയും ഒരുമിച്ച് അറിയിക്കുന്നു.
