source:
  edition: SBLGNT
  text: μετὰ δὲ τὸ δεύτερον καταπέτασμα σκηνὴ ἡ λεγομένη ⸂Ἅγια Ἁγίων⸃,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/003.yaml
  text: And behind the second curtain was a tabernacle called the Most Holy Place,[a]
translation:
  language: ml
  text: രണ്ടാമത്തെ തിരശ്ശീലയ്ക്കപ്പുറം “അതിവിശുദ്ധസ്ഥലം”[a] എന്നു വിളിക്കപ്പെടുന്ന കൂടാരം ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പരമ്പരാഗതമായി, “വിശുദ്ധാതിവിശുദ്ധസ്ഥലം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ... τὸ δεύτερον καταπέτασμα
  choice: രണ്ടാമത്തെ തിരശ്ശീലയ്ക്കപ്പുറം
  rationale: ഇവിടെ μετά + accusative വിശുദ്ധമന്ദിരത്തിന്റെ സ്ഥലക്രമം സൂചിപ്പിക്കുന്നതിനാൽ കാലാർത്ഥമായ ‘ശേഷം’ എന്നതിനെക്കാൾ സ്ഥലാർത്ഥമായ ‘അപ്പുറം’ സ്വാഭാവികവും കൃത്യവുമാണ്. καταπέτασμα അകത്തെ വിഭജനത്തിരശ്ശീലയെ സൂചിപ്പിക്കുന്നു.
- source_word: δὲ
  choice: വാക്യക്രമത്തിലൂടെ ബന്ധിപ്പിച്ചു; പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയില്ല
  rationale: δέ വിവരണം മുന്നോട്ടുകൊണ്ടുപോകുന്ന മൃദുവായ ബന്ധകമാണ്. മലയാളത്തിൽ വാക്യക്രമം തന്നെ ഈ ബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ പോലുള്ള അതിരൂക്ഷമായ വൈരുധ്യം ചേർത്തില്ല.
- source_word: σκηνὴ
  choice: കൂടാരം
  rationale: σκηνή സമാഗമകൂടാരത്തെയും ഇവിടെ അതിന്റെ അകത്തെ വിഭാഗത്തെയും സൂചിപ്പിക്കുന്നു. ‘കൂടാരം’ മൂലരൂപകം നിലനിർത്തുന്നു; ‘മുറി’ എന്നത് വ്യാഖ്യാനപരമായി ചുരുക്കിപ്പറയും.
- source_word: ἡ λεγομένη
  choice: എന്നു വിളിക്കപ്പെടുന്ന
  rationale: ആട്രിബ്യൂട്ടീവ് പങ്കാളിത്തരൂപത്തിന്റെ അർത്ഥവും വാക്യബന്ധവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Ἅγια Ἁγίων
  choice: അതിവിശുദ്ധസ്ഥലം
  rationale: സെമിറ്റിക് പരമോന്നതപ്രയോഗമായ ‘വിശുദ്ധങ്ങളുടെ വിശുദ്ധം’ എന്നതിന്റെ അർത്ഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുകയും കൂടാരത്തിന്റെ ഏറ്റവും അകത്തെ വിശുദ്ധസ്ഥാനത്തെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: Ἅγια Ἁγίων എന്ന വിശുദ്ധമന്ദിരപദത്തിന്റെ പരിഭാഷ
  choice: അതിവിശുദ്ധസ്ഥലം
  alternative: വിശുദ്ധാതിവിശുദ്ധസ്ഥലം
  rationale: പ്രധാനപാഠത്തിലെ രൂപം സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമാണ്; പരമ്പരാഗത മലയാളപ്രയോഗം അടിക്കുറിപ്പിൽ നിലനിർത്തി ആരാധനാപരമായ പദപരിചയവും മൂലത്തിലെ ശക്തമായ പരമോന്നതഭാവവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘തിരശ്ശീല’, ‘കൂടാരം’, ‘അതിവിശുദ്ധസ്ഥലം’ എന്നീ പദങ്ങൾ വിശുദ്ധമന്ദിരസന്ദർഭം നിലനിർത്തുന്നു; അനാവശ്യമായ സഭാവിഭാഗ-വിശേഷ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
