revisions:
- from: അതുപോലെതന്നെ, അനേകരുടെ പാപങ്ങൾ വഹിക്കേണ്ടതിന് ഒരിക്കൽ അർപ്പിക്കപ്പെട്ട മശീഹാ, തന്നെ ആകാംക്ഷയോടെ കാത്തിരിക്കുന്നവർക്കു രക്ഷയ്ക്കായി, പാപത്തിൽനിന്ന് വേറിട്ട്[a], രണ്ടാം പ്രാവശ്യം പ്രത്യക്ഷനാകും.
