id: HEB.9.28
reference: Hebrews 9:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὕτως καὶ ὁ Χριστός, ἅπαξ προσενεχθεὶς εἰς τὸ πολλῶν ἀνενεγκεῖν ἁμαρτίας, ἐκ δευτέρου χωρὶς ἁμαρτίας ὀφθήσεται τοῖς αὐτὸν ἀπεκδεχομένοις εἰς σωτηρίαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/028.yaml
  text: so also the Messiah[a], having been offered once to bear the sins of many, will appear a second time, apart from sin, to those who eagerly await him, for salvation.
translation:
  language: ml
  text: അതുപോലെതന്നെ, അനേകരുടെ പാപങ്ങൾ വഹിക്കുന്നതിനായി ഒരിക്കൽ അർപ്പിക്കപ്പെട്ട മശീഹാ, അവനെ ആകാംക്ഷയോടെ കാത്തിരിക്കുന്നവർക്കു രക്ഷയ്ക്കായി, പാപം കൂടാതെ, രണ്ടാം പ്രാവശ്യം പ്രത്യക്ഷനാകും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως καὶ
  choice: അതുപോലെതന്നെ
  rationale: മുൻവാക്യത്തിലെ താരതമ്യവുമായി ഈ വാക്യത്തെ ബന്ധിപ്പിക്കുന്ന താരതമ്യ-നിഗമന ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὁ Χριστός
  choice: മശീഹാ
  rationale: ഇവിടെ Χριστός രക്ഷാചരിത്രപരമായ വാദത്തിലെ പദവിനാമമായി പ്രവർത്തിക്കുന്നതിനാൽ പേരുപോലുള്ള ‘ക്രിസ്തു’ എന്നതിനു പകരം ‘മശീഹാ’ എന്നു നൽകി.
- source_word: ἅπαξ
  choice: ഒരിക്കൽ
  rationale: ഗ്രീക്കിലെ ‘ഒരിക്കൽ’ എന്ന നേരിട്ടുള്ള അർഥം മാത്രം നൽകുന്നു; പദത്തിൽ വ്യക്തമല്ലാത്ത ‘എന്നേക്കുമായി’ എന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: προσενεχθεὶς
  choice: അർപ്പിക്കപ്പെട്ട
  rationale: ഭൂതകാല സംഭവത്തെയും കർമണിപ്രയോഗത്തെയും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; ഇവിടെ വ്യക്തമല്ലാത്ത ആത്മവാചകത ചേർക്കുന്നില്ല.
- source_word: εἰς τὸ πολλῶν ἀνενεγκεῖν ἁμαρτίας
  choice: അനേകരുടെ പാപങ്ങൾ വഹിക്കേണ്ടതിന്
  rationale: ഉദ്ദേശ്യഭാവവും യെശയ്യാവിലെയും യാഗസംബന്ധമായ ഭാഷയിലെയും പാപവഹന പ്രതിധ്വനിയും നിലനിർത്തുന്നു.
- source_word: ἐκ δευτέρου
  choice: രണ്ടാം പ്രാവശ്യം
  rationale: ആദ്യത്തെ അർപ്പണവുമായി വിരുദ്ധമായി വരുന്ന രണ്ടാമത്തെ പ്രത്യക്ഷത വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: χωρὶς ἁμαρτίας
  choice: പാപത്തിൽനിന്ന് വേറിട്ട്
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തവും വ്യാഖ്യാനസാധ്യതയുള്ളതുമായ പ്രയോഗം കഴിയുന്നത്ര നേരിട്ട് നിലനിർത്തുന്നു; കൂടുതൽ വിശദമായ അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ὀφθήσεται
  choice: പ്രത്യക്ഷനാകും
  rationale: ഭാവികാലത്തെ പ്രത്യക്ഷതയെ സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുകയും അന്ത്യകാലസംബന്ധമായ പ്രയോഗത്തിന് യോജിക്കുകയും ചെയ്യുന്നു.
- source_word: τοῖς αὐτὸν ἀπεκδεχομένοις
  choice: തന്നെ ആകാംക്ഷയോടെ കാത്തിരിക്കുന്നവർക്കു
  rationale: ἀπεκδέχομαι എന്ന ക്രിയയിലെ പ്രതീക്ഷാഭരിതവും തീവ്രവുമായ കാത്തിരിപ്പ് ‘ആകാംക്ഷയോടെ’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: εἰς σωτηρίαν
  choice: രക്ഷയ്ക്കായി
  rationale: ലക്ഷ്യത്തെയോ ഫലത്തെയോ സൂചിപ്പിക്കുന്ന εἰς എന്നതിന്റെ ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: രണ്ടാം പ്രത്യക്ഷതയിലെ χωρὶς ἁμαρτίας എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: പ്രധാനപാഠത്തിൽ ‘പാപത്തിൽനിന്ന് വേറിട്ട്’ എന്ന സംക്ഷിപ്ത രൂപം നിലനിർത്തി.
  alternative: ‘പാപവുമായി ബന്ധമില്ലാതെ,’ അതായത് ആദ്യത്തെ അർപ്പണത്തിലെപ്പോലെ പാപം വഹിക്കാനല്ല.
  rationale: രണ്ടാം വരവിൽ പാപവഹനത്തിനല്ല എന്ന സന്ദർഭാർഥം ശക്തമാണെങ്കിലും, ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സംക്ഷിപ്തതയും ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും പ്രധാനപാഠത്തിൽ വിശദീകരിച്ചു തീർക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. യാഗസംബന്ധവും അന്ത്യകാലസംബന്ധവുമായ ഭാവങ്ങൾ നിലനിർത്തിക്കൊണ്ട് അമിതവ്യാഖ്യാനം ഒഴിവാക്കി.
