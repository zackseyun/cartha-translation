reference: Hebrews 9:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: χρυσοῦν ἔχουσα θυμιατήριον καὶ τὴν κιβωτὸν τῆς διαθήκης περικεκαλυμμένην πάντοθεν χρυσίῳ, ἐν ᾗ στάμνος χρυσῆ ἔχουσα τὸ μάννα καὶ ἡ ῥάβδος Ἀαρὼν ἡ βλαστήσασα καὶ αἱ πλάκες τῆς διαθήκης,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/004.yaml
  text: having the golden censer[a], and the ark of the covenant covered on all sides with gold, in which were a golden jar holding the manna, Aaron’s staff that budded, and the tablets of the covenant,
translation:
  language: ml
  text: സ്വർണധൂപപീഠവും[a] നാലുപാടും സ്വർണംകൊണ്ട് പൊതിഞ്ഞ ഉടമ്പടിയുടെ പെട്ടകവും അതിനുണ്ടായിരുന്നു. ആ പെട്ടകത്തിൽ മന്നാ സൂക്ഷിച്ചിരുന്ന ഒരു സ്വർണഭരണിയും തളിർത്ത അഹരോന്റെ വടിയും ഉടമ്പടിയുടെ പലകകളും ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സ്വർണധൂപകലശം.” θυμιατήριον എന്ന ഗ്രീക്ക് പദം ധൂപം കത്തിക്കുന്ന ഉപകരണത്തെയോ ധൂപപീഠത്തെയോ സൂചിപ്പിക്കാം; ഇവിടെ ഏതാണ് ഉദ്ദേശിച്ചതെന്നത് ചർച്ചാവിഷയമാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: χρυσοῦν ἔχουσα θυμιατήριον
  choice: സ്വർണധൂപപീഠവും അതിനുണ്ടായിരുന്നു
  rationale: θυμιατήριον ധൂപം കത്തിക്കുന്ന ഉപകരണമെന്നോ ധൂപപീഠമെന്നോ അർഥമാകാം. സമാഗമകൂടാരത്തിന്റെ ഉപകരണങ്ങളെ വിവരിക്കുന്ന സന്ദർഭത്തിൽ ‘ധൂപപീഠം’ സ്വാഭാവികമായ മുഖ്യവായനയാണ്; യഥാർഥമായ പദാർഥസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു. ἔχουσα എന്നത് മുൻവാക്യത്തിലെ അതിവിശുദ്ധസ്ഥലത്തോട് ബന്ധപ്പെടുത്തി മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
- source_word: τὴν κιβωτὸν τῆς διαθήκης
  choice: ഉടമ്പടിയുടെ പെട്ടകം
  rationale: വിശുദ്ധമായ covenant ark-നെ സൂചിപ്പിക്കുന്ന മലയാള ബൈബിൾ പ്രയോഗമായി ‘ഉടമ്പടിയുടെ പെട്ടകം’ വ്യക്തവും പരിചിതവുമാണ്.
- source_word: περικεκαλυμμένην πάντοθεν χρυσίῳ
  choice: നാലുപാടും സ്വർണംകൊണ്ട് പൊതിഞ്ഞ
  rationale: πάντοθεν സൂചിപ്പിക്കുന്ന സമഗ്രമായ ചുറ്റുമുള്ള ആവരണം ‘നാലുപാടും’ എന്ന പ്രയോഗം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἐν ᾗ
  choice: ആ പെട്ടകത്തിൽ
  rationale: സ്ത്രീലിംഗ ഏകവചനമായ ആപേക്ഷിക സർവനാമം പെട്ടകത്തെയാണ് വ്യാകരണപരമായി സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ നാമം ആവർത്തിച്ചു.
- source_word: στάμνος χρυσῆ ἔχουσα τὸ μάννα
  choice: മന്നാ സൂക്ഷിച്ചിരുന്ന ഒരു സ്വർണഭരണി
  rationale: στάμνος ഒരു ഭരണി/പാത്രമാണ്. ‘ഭരണി’ ആധുനിക മലയാളത്തിൽ എളുപ്പം ഗ്രഹിക്കാവുന്നതും ‘സൂക്ഷിച്ചിരുന്ന’ ἔχουσα എന്നതിന്റെ സന്ദർഭോചിതമായ സ്വാഭാവിക പരിഭാഷയുമാണ്.
- source_word: ἡ ῥάβδος Ἀαρὼν ἡ βλαστήσασα
  choice: തളിർത്ത അഹരോന്റെ വടി
  rationale: βλαστήσασα സൂചിപ്പിക്കുന്ന അറിയപ്പെടുന്ന സംഭവത്തെ ‘തളിർത്ത’ സംക്ഷിപ്തമായും കൃത്യമായും നൽകുന്നു; ῥάβδος ഇവിടെ ‘വടി’ എന്നു സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
- source_word: αἱ πλάκες τῆς διαθήκης
  choice: ഉടമ്പടിയുടെ പലകകൾ
  rationale: πλάκες എന്നതിന് ‘പലകകൾ’ എന്നും διαθήκη എന്നതിന് ഈ ആരാധനാപരവും ദൈവശാസ്ത്രപരവുമായ സന്ദർഭത്തിൽ ‘ഉടമ്പടി’ എന്നും നൽകി. മൂലത്തിൽ ഈ വാക്യത്തിൽ പറയാത്ത ‘കൽ’ ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: θυμιατήριον എന്ന പദത്തിന്റെ അർഥം
  choice: ധൂപപീഠം
  alternative: ധൂപകലശം
  rationale: ഈ ഗ്രീക്ക് പദം ധൂപം കത്തിക്കുന്ന കൈയിൽ വഹിക്കാവുന്ന ഉപകരണത്തെയോ ധൂപപീഠത്തെയോ സൂചിപ്പിക്കാം. സമാഗമകൂടാരത്തിലെ ഉപകരണവിവരണത്തിൽ ‘ധൂപപീഠം’ മുഖ്യവായനയായി സ്വീകരിച്ചെങ്കിലും ചരിത്രപരവും പദാർഥപരവുമായ സന്ദിഗ്ധത പരിഹരിച്ചെന്നു നടിക്കാതെ അടിക്കുറിപ്പിൽ ‘ധൂപകലശം’ നിലനിർത്തി.
- issue: ἐν ᾗ സൂചിപ്പിക്കുന്ന സ്ഥലം
  choice: പെട്ടകത്തിനുള്ളിൽ
  alternative: അതിവിശുദ്ധസ്ഥലവുമായി പൊതുവായി ബന്ധപ്പെടുത്തിയ വസ്തുക്കൾ
  rationale: ആപേക്ഷിക സർവനാമം വ്യാകരണപരമായി κιβωτός (‘പെട്ടകം’) എന്ന നാമത്തോടാണ് യോജിക്കുന്നത്. അതിനാൽ പാഠത്തിന്റെ നേരിട്ടുള്ള ഘടന പിന്തുടർന്നു; പുറപ്പാട്, സംഖ്യ, 1 രാജാക്കന്മാർ എന്നിവയുമായി ഒത്തുനോക്കി ചരിത്രപരമായ ബുദ്ധിമുട്ട് പരിഹരിക്കാൻ പാഠം മാറ്റിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. വാക്യം മുൻവാക്യത്തിലെ അതിവിശുദ്ധസ്ഥലത്തിന്റെ വിവരണം തുടരുന്നതിനാൽ ἔχουσα എന്ന ബന്ധം ‘അതിനുണ്ടായിരുന്നു’ എന്നു വ്യക്തമാക്കി. സാങ്കേതികമായ ആരാധനാപദങ്ങൾ ആവശ്യമായത്ര മാത്രം ഉപയോഗിക്കുകയും യഥാർഥമായ പദാർഥസന്ദിഗ്ധത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുകയും ചെയ്തു.
