  source_fidelity: ഗ്രീക്ക് വാക്യത്തിലെ നിയമപരമായ പരിധി (κατὰ τὸν νόμον), σχεδόν-ന്റെ യോഗ്യതയായ ‘മിക്കവാറും,’ രക്തത്തെ ശുദ്ധീകരണോപാധിയായി കാണിക്കുന്ന ἐν αἵματι, കൂടാതെ αἱματεκχυσίας ഇല്ലാതെ ἄφεσις ഉണ്ടാകില്ലെന്ന പ്രസ്താവന എന്നിവ കൃത്യമായി നിലനിൽക്കുന്നു. ‘പാപക്ഷമ’ സന്ദർഭാനുസൃതമായി ἄφεσιസിന്റെ അർത്ഥം വ്യക്തമായി നൽകുന്നു.
