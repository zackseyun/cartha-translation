  terminology: ‘ശുദ്ധീകരിക്കപ്പെടുന്നു,’ ‘രക്തം ചൊരിയാതെ,’ ‘പാപക്ഷമ’ എന്നീ പദങ്ങൾ ആചാര-ബലിസന്ദർഭത്തിന് അനുയോജ്യമാണ്. അടിക്കുറിപ്പ് ἄφεσιസിന്റെ ‘മോചനം/വിടുതൽ’ എന്ന വിശാല പദസാധ്യത സൂചിപ്പിക്കുമ്പോൾ മുഖ്യവാചകത്തിലെ സന്ദർഭാർഥം സംരക്ഷിക്കുന്നു.
