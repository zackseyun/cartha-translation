id: HEB.9.22
reference: Hebrews 9:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ σχεδὸν ἐν αἵματι πάντα καθαρίζεται κατὰ τὸν νόμον, καὶ χωρὶς αἱματεκχυσίας οὐ γίνεται ἄφεσις.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/022.yaml
  text: And according to the law[a], almost everything is cleansed with blood, and without the shedding of blood there is no forgiveness.
translation:
  language: ml
  text: നിയമപ്രകാരം മിക്കവാറും എല്ലാം രക്തത്താൽ ശുദ്ധീകരിക്കപ്പെടുന്നു; രക്തം ചൊരിയാതെ പാപക്ഷമ[a] ഉണ്ടാകുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘മോചനം’. ഗ്രീക്ക് പദത്തിന് വിടുതൽ അല്ലെങ്കിൽ ക്ഷമ എന്നർത്ഥം വരാം; ഇവിടെ പാപങ്ങളുടെ ക്ഷമയാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: σχεδόν
  choice: മിക്കവാറും
  rationale: നിയമപ്രകാരമുള്ള എല്ലാ ശുദ്ധീകരണങ്ങളും രക്തംകൊണ്ടായിരുന്നു എന്ന് സമ്പൂർണമായി പറയാതെ, ഗ്രീക്ക് ക്രിയാവിശേഷണം നൽകുന്ന പരിധിനിർണ്ണയം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐν αἵματι
  choice: രക്തത്താൽ
  rationale: ἐν ഇവിടെ ശുദ്ധീകരണത്തിന്റെ ഉപാധി സൂചിപ്പിക്കുന്നു; ‘രക്തത്തിൽ’ എന്ന സ്ഥാനാർഥകമായ വിവർത്തനത്തേക്കാൾ ‘രക്തത്താൽ’ ആചാരപരമായ ഉപാധി വ്യക്തമായി നൽകുന്നു.
- source_word: πάντα
  choice: എല്ലാം
  rationale: നപുംസകലിംഗ ബഹുവചനം സന്ദർഭത്തിലെ വസ്തുക്കളെയും ആചാരകാര്യങ്ങളെയും പൊതുവായി ഉൾക്കൊള്ളുന്നു; ‘മിക്കവാറും’ അതിന്റെ വ്യാപ്തി നിയന്ത്രിക്കുന്നു.
- source_word: καθαρίζεται
  choice: ശുദ്ധീകരിക്കപ്പെടുന്നു
  rationale: വർത്തമാനകാല കർമണി രൂപം നിയമത്തിൻ കീഴിലെ പതിവായ ആചാരനടപടി സൂചിപ്പിക്കുന്നു; ഈ തിരഞ്ഞെടുപ്പ് ആചാരപരവും ദൈവശാസ്ത്രപരവുമായ അർത്ഥം നിലനിർത്തുന്നു.
- source_word: κατὰ τὸν νόμον
  choice: നിയമപ്രകാരം
  rationale: κατά മോശെയുടെ നിയമക്രമത്തോടുള്ള അനുരൂപതയാണ് സൂചിപ്പിക്കുന്നത്; ‘നിയമപ്രകാരം’ അതിനെ അമിതവ്യാഖ്യാനമില്ലാതെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: χωρὶς
  choice: കൂടാതെ / ഇല്ലാതെ
  rationale: പ്രധാനവാക്യത്തിലെ ‘രക്തം ചൊരിയാതെ’ എന്ന രൂപം ‘രക്തച്ചൊരിച്ചിൽ കൂടാതെ’ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: αἱματεκχυσίας
  choice: രക്തം ചൊരിയൽ
  rationale: ബലിസംബന്ധമായ രക്തം ഒഴുക്കുന്നതോ ചൊരിയുന്നതോ ആയ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ക്രിയാരൂപത്തിലുള്ള ‘രക്തം ചൊരിയാതെ’ മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികമാണ്.
- source_word: οὐ γίνεται
  choice: ഉണ്ടാകുന്നില്ല
  rationale: γίνεται ഇവിടെ ഒരു ഫലം സംഭവിക്കുകയോ നിലവിൽ വരുകയോ ചെയ്യുന്നില്ല എന്ന അർത്ഥത്തിലാണ്; ‘ഉണ്ടാകുന്നില്ല’ ആ ഫലാത്മക അർത്ഥം നിലനിർത്തുന്നു.
- source_word: ἄφεσις
  choice: പാപക്ഷമ
  rationale: പദത്തിന് വിടുതൽ, മോചനം, ക്ഷമ എന്നീ അർത്ഥങ്ങൾ വരാം; ഈ ബലിസംബന്ധമായ സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത് പാപങ്ങളുടെ ക്ഷമയാണെന്ന് വ്യക്തമായി, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഭാഷയിൽ നൽകുന്നു.
theological_decisions:
- issue: ബലിസംബന്ധമായ സന്ദർഭത്തിൽ ἄφεσις എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: പാപക്ഷമ
  alternative: മോചനം / വിടുതൽ
  rationale: ഗ്രീക്ക് പദത്തിന്റെ വിശാലമായ അർത്ഥപരിധി അംഗീകരിച്ചുകൊണ്ട്, എബ്രായലേഖനത്തിന്റെ ഈ സന്ദർഭത്തിൽ പാപങ്ങൾ ക്ഷമിക്കപ്പെടുന്നതാണ് ഉദ്ദേശ്യമെന്ന് ‘പാപക്ഷമ’ വ്യക്തമായി പറയുന്നു. പ്രത്യേകമായ ഒരു സഭാപാരമ്പര്യത്തിന്റെ സിദ്ധാന്തരൂപം ഇതിൽ ചേർക്കുന്നില്ല; മറ്റൊരു സാധ്യമായ പദാർത്ഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ആചാരപരമായ ‘ശുദ്ധീകരണം’ എന്നും ബലിസംബന്ധമായ ‘രക്തം ചൊരിയൽ’ എന്നും നിലനിർത്തിയിരിക്കുന്നു. ഗ്രീക്കിലെ ആദ്യ καί മുൻവാക്യത്തോടുള്ള സാധാരണ ബന്ധകമായതിനാൽ, ഒറ്റവാക്യമായി മലയാളത്തിൽ അനാവശ്യമായ ‘കൂടാതെ’ ചേർക്കാതെ സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
