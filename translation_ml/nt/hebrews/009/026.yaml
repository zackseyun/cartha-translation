id: HEB.9.26
reference: Hebrews 9:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐπεὶ ἔδει αὐτὸν πολλάκις παθεῖν ἀπὸ καταβολῆς κόσμου· ⸀νυνὶ δὲ ἅπαξ ἐπὶ συντελείᾳ τῶν αἰώνων εἰς ἀθέτησιν ⸀ἁμαρτίας διὰ τῆς θυσίας αὐτοῦ πεφανέρωται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/026.yaml
  text: Otherwise[a], he would have had to suffer many times since the foundation of the world. But as it is[c][b], he has appeared once for all at the consummation of the ages to put away sin through the sacrifice of himself.
translation:
  language: ml
  text: അല്ലായിരുന്നെങ്കിൽ, ലോകസ്ഥാപനം മുതൽ അവൻ പലതവണ കഷ്ടം അനുഭവിക്കേണ്ടിവന്നേനെ. എന്നാൽ ഇപ്പോൾ, യുഗങ്ങളുടെ പരിസമാപ്തിയിൽ, തന്നെത്തന്നെ യാഗമായി അർപ്പിച്ചതിലൂടെ പാപത്തെ നീക്കിക്കളയാൻ അവൻ ഒരിക്കൽ പ്രത്യക്ഷനായിരിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവന്റെ യാഗത്തിലൂടെ.” ഗ്രീക്കിൽ കൂടുതൽ അക്ഷരാർഥത്തിൽ, “തന്നെത്തന്നെ യാഗമായി അർപ്പിച്ചതിലൂടെ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: അല്ലായിരുന്നെങ്കിൽ
  rationale: മുൻവാക്യത്തിലെ ആവർത്തിച്ചുള്ള അർപ്പണം എന്ന സങ്കൽപ്പത്തിൽനിന്ന് ഉണ്ടാകുമായിരുന്ന ഫലം ഇവിടെ അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ അനുമാനാത്മക-വിരുദ്ധ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἔδει αὐτὸν πολλάκις παθεῖν
  choice: അവൻ പലതവണ കഷ്ടം അനുഭവിക്കേണ്ടിവരുമായിരുന്നു
  rationale: ἔδει എന്ന അപൂർണ്ണഭൂതകാലരൂപത്തിലെ സങ്കൽപ്പിതമായ അനിവാര്യതയും πολλάκις–ἅπαξ എന്ന ആവർത്തനം/ഒരിക്കൽ എന്ന വൈരുധ്യവും സംരക്ഷിക്കുന്നു.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: ലോകസ്ഥാപനംമുതൽ
  rationale: ലോകത്തിന്റെ സ്ഥാപനം മുതൽ തുടർന്നുള്ള സമയത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് കാലപ്രയോഗം സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: νυνὶ δὲ
  choice: എന്നാൽ ഇപ്പോൾ
  rationale: സങ്കൽപ്പിത സാഹചര്യത്തിനും യാഥാർഥ്യത്തിനും ഇടയിലെ ശക്തമായ വൈരുധ്യവും νυνί എന്ന കാലസൂചനയും നിലനിർത്തുന്നു.
- source_word: ἅπαξ
  choice: ഒരിക്കലായി
  rationale: πολλάκις എന്നതുമായുള്ള നേരിട്ടുള്ള വൈരുധ്യം നിലനിർത്തുകയും, യാഗത്തിന്റെ ആവർത്തിക്കപ്പെടാത്ത നിർണായക സ്വഭാവം സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐπὶ συντελείᾳ τῶν αἰώνων
  choice: യുഗങ്ങളുടെ പരിസമാപ്തിയിൽ
  rationale: συντέλεια എന്നതിലെ പൂർത്തീകരണം/പര്യവസാനം എന്ന ഭാരം നിലനിർത്തുകയും αἰῶνες എന്ന ബഹുവചനം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: εἰς ἀθέτησιν ἁμαρτίας
  choice: പാപത്തെ നീക്കിക്കളയാൻ
  rationale: ἀθέτησις എന്നതിലെ മാറ്റിവെക്കൽ, അസാധുവാക്കൽ, നീക്കംചെയ്യൽ എന്നീ ആശയങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഭാഷയിൽ നൽകുന്നു; ἁμαρτίας എന്ന ഏകവചനം ‘പാപം’ എന്ന നിലയിൽ സംരക്ഷിക്കുന്നു.
- source_word: διὰ τῆς θυσίας αὐτοῦ
  choice: തന്നെത്തന്നെ യാഗമായി അർപ്പിച്ചതിലൂടെ
  rationale: വാച്യഘടനയിലെ സാധ്യതയുള്ള ‘അവന്റെ യാഗത്തിലൂടെ’ എന്ന അർഥത്തേക്കാൾ സന്ദർഭം സൂചിപ്പിക്കുന്ന സ്വയം-അർപ്പണത്തെ വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: πεφανέρωται
  choice: പ്രത്യക്ഷനായിരിക്കുന്നു
  rationale: പൂർത്തിയായ പ്രത്യക്ഷതയുടെ നിലനിൽക്കുന്ന പ്രാധാന്യം സൂചിപ്പിക്കുന്ന perfect രൂപവും ക്രിസ്തുവിന്റെ ചരിത്രപരമായ പ്രത്യക്ഷതയും പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ἅπαξ എന്നതിന്റെ യാഗസംബന്ധമായ ശക്തി
  choice: ഒരിക്കലായി
  alternative: ഒരിക്കൽ
  rationale: πολλάκις (‘പലതവണ’) എന്നതുമായുള്ള വൈരുധ്യവും എബ്രായലേഖനത്തിന്റെ സമീപവാദവും യാഗത്തിന്റെ നിർണായകവും ആവർത്തിക്കപ്പെടാത്തതുമായ സ്വഭാവം സൂചിപ്പിക്കുന്നു; ‘ഒരിക്കലായി’ അതിനെ അനാവശ്യമായ ഉപദേശവികാസമില്ലാതെ പ്രകടിപ്പിക്കുന്നു.
- issue: ἁμαρτίας എന്ന ഏകവചനത്തിന്റെ വ്യാപ്തി
  choice: പാപം
  alternative: പാപങ്ങൾ
  rationale: ഗ്രീക്ക് ഏകവചനം വ്യക്തിഗത പ്രവൃത്തികളുടെ പട്ടികയേക്കാൾ പാപം എന്ന യാഥാർഥ്യത്തെ സമഗ്രമായി അവതരിപ്പിക്കാൻ സാധ്യതയുള്ളതിനാൽ അത് സംരക്ഷിക്കുന്നു.
- issue: αὐτοῦ എന്ന സർവനാമത്തിന്റെ യാഗസംബന്ധമായ ബന്ധം
  choice: തന്നെത്തന്നെ യാഗമായി അർപ്പിച്ചതിലൂടെ
  alternative: അവന്റെ യാഗത്തിലൂടെ
  rationale: സമീപസന്ദർഭത്തിലെ ക്രിസ്തുവിന്റെ സ്വയം-അർപ്പണം മുൻനിർത്തി സ്വയംസംബന്ധമായ അർഥം മുഖ്യവാചകത്തിൽ നൽകി; വ്യാകരണപരമായി കൂടുതൽ സംക്ഷിപ്തമായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവവും വായനാസൗകര്യവും ചേർന്ന മലയാളം. ‘യുഗങ്ങളുടെ പരിസമാപ്തി’ പോലുള്ള പദപ്രയോഗം മൂലത്തിലെ യുഗാന്തപരമായ ഭാരം സംരക്ഷിക്കുന്നു; സങ്കീർണമായ വാക്യബന്ധം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി കേൾക്കുന്നതിന് സ്വാഭാവിക ക്രമത്തിൽ നൽകിയിരിക്കുന്നു.
