source:
  edition: SBLGNT
  text: Εἶχε μὲν ⸀οὖν ἡ πρώτη δικαιώματα λατρείας τό τε ἅγιον κοσμικόν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/001.yaml
  text: Even the first covenant had regulations for worship and an earthly sanctuary[a][b].
translation:
  language: ml
  text: ആദ്യ ഉടമ്പടിക്കും[a] ആരാധനയ്ക്കുള്ള ചട്ടങ്ങളും ഭൂമിയിലെ ഒരു വിശുദ്ധമന്ദിരവും[b] ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ‘ഒന്നാമത്തേത്’ എന്നു മാത്രമാണുള്ളത്; സന്ദർഭത്തിൽ ഇത് ആദ്യ ഉടമ്പടിയെയാണ് സൂചിപ്പിക്കുന്നത്. ചിലർ ഇതിനെ കൂടുതൽ പൊതുവായി ‘ആദ്യ ക്രമീകരണം’ എന്നും മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, ‘ലൗകികമായ ഒരു വിശുദ്ധമന്ദിരം.’ ഈ അധ്യായത്തിൽ പിന്നീട് പറയുന്ന സ്വർഗീയ യാഥാർഥ്യങ്ങളോടുള്ള വൈരുധ്യത്തിൽ ഇവിടെ ഉദ്ദേശിക്കുന്നത് ‘ഭൂമിയിലുള്ളത്’ എന്നായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶχε
  choice: ഉണ്ടായിരുന്നു
  rationale: ἔχω എന്ന ക്രിയയുടെ അപൂർണ്ണഭൂതകാലരൂപം മുൻക്രമീകരണത്തിൽ ഇവ നിലനിന്നിരുന്നുവെന്ന് ലളിതവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: μὲν οὖν
  choice: -നും
  rationale: വാക്യം മുൻവാദത്തിൽനിന്ന് തുടർന്നുകൊണ്ട് നൽകുന്ന മൃദുവായ ഊന്നൽ മലയാളത്തിലെ ചേർക്കൽപ്രത്യയമായ ‘-നും’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ഉറവിടത്തിൽ ഇല്ലാത്ത കാലസൂചകമായ ‘ഇപ്പോൾ’ ചേർക്കുന്നില്ല.
- source_word: ἡ πρώτη
  choice: ഒന്നാമത്തേത്
  rationale: സ്ത്രീലിംഗ ഏകവചനമായ ഈ നാമീകൃത വിശേഷണം 8:13-ലെ ഒന്നാം ഉടമ്പടിയെ പ്രധാനമായി സൂചിപ്പിക്കുന്നു. എന്നാൽ ഗ്രീക്കിൽ ‘ഉടമ്പടി’ ആവർത്തിച്ചിട്ടില്ലാത്തതിനാൽ യഥാർഥമായ സംക്ഷിപ്തതയും ചെറിയ അർത്ഥവ്യാപ്തിയും മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു.
- source_word: δικαιώματα
  choice: ചട്ടങ്ങൾ
  rationale: ആരാധനയെ നിയന്ത്രിച്ചിരുന്ന നിർദേശങ്ങളെയോ നിബന്ധനകളെയോ സൂചിപ്പിക്കുന്ന, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ആധുനിക പദം.
- source_word: λατρείας
  choice: ആരാധനയ്ക്കുള്ള
  rationale: ഇവ ആരാധനയുമായി ബന്ധപ്പെട്ടതും അതിനായി നിശ്ചയിക്കപ്പെട്ടതുമായ ചട്ടങ്ങളാണെന്ന ആരാധനാകർമ്മപരമായ അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τό τε ἅγιον
  choice: ഒരു വിശുദ്ധമന്ദിരം
  rationale: തുടർന്നുള്ള വാക്യങ്ങൾ അതിന്റെ ഭാഗങ്ങൾ വിശദീകരിക്കുന്നതിനാൽ ഒരു പ്രത്യേക അറയെ മാത്രം സൂചിപ്പിക്കാതെ വിശുദ്ധസ്ഥാനത്തെ സമഗ്രമായി അടയാളപ്പെടുത്തുന്നു.
- source_word: κοσμικόν
  choice: ഈ ലോകത്തിലുള്ള
  rationale: പിന്നീട് പറയുന്ന സ്വർഗീയ യാഥാർഥ്യങ്ങളോടുള്ള ഭൗമിക വൈരുധ്യം വ്യക്തമാക്കുകയും ‘ലൗകികം’ എന്ന പദത്തിന് ആധുനിക ഉപയോഗത്തിലുള്ള ധാർമികമായി പ്രതികൂലമായ സൂചന ഒഴിവാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ἡ πρώτη എന്നതിന്റെ സൂചിതനാമം
  choice: മുഖ്യപാഠത്തിൽ ‘ഒന്നാമത്തേത്’; അടിക്കുറിപ്പിൽ ‘ഒന്നാം ഉടമ്പടി’ എന്നു വ്യക്തമാക്കുന്നു
  alternative: ഒന്നാം ഉടമ്പടി; ഒന്നാം കൂടാരം; ആദ്യ ക്രമീകരണം
  rationale: എബ്രായർ 8:13-ലെ അടുത്ത സന്ദർഭം ഒന്നാം ഉടമ്പടിയെയാണ് ശക്തമായി സൂചിപ്പിക്കുന്നത്. എങ്കിലും ഗ്രീക്ക് നാമം വ്യക്തമാക്കാതെ ‘ഒന്നാമത്തേത്’ എന്നു മാത്രമാണ് പറയുന്നത്; അതിനാൽ വ്യാഖ്യാനം പൂർണമായി മുഖ്യപാഠത്തിലേക്ക് ചേർക്കാതെ ഉറവിടത്തിലെ സംക്ഷിപ്തത സംരക്ഷിക്കുന്നു.
- issue: κοσμικόν എന്നതിന്റെ അർത്ഥം
  choice: ഈ ലോകത്തിലുള്ള
  alternative: ലൗകികമായ; ഭൗമികമായ
  rationale: ഇവിടെ വൈരുധ്യം ധാർമികമായി ലോകീയം-ആത്മീയം എന്നതല്ല, ഭൂമിയിലെ വിശുദ്ധമന്ദിരവും പിന്നീട് വിവരിക്കുന്ന സ്വർഗീയ യാഥാർഥ്യങ്ങളും തമ്മിലാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ആരാധനാകർമ്മപരമായ ആശയം നിലനിർത്താൻ ‘ആരാധന’, ‘ചട്ടങ്ങൾ’, ‘വിശുദ്ധമന്ദിരം’ എന്നിവ ഉപയോഗിച്ചു. ഗ്രീക്കിലെ ellipsis സംരക്ഷിക്കാൻ മുഖ്യപാഠത്തിൽ ‘ഒന്നാമത്തേത്’ നിലനിർത്തി, പ്രധാന സന്ദർഭാർത്ഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
