review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately retains the comparative force, sacrificial ‘blood,’ Messiah title, reflexive self-offering, future ‘will cleanse,’ conscience, and purpose clause. Two lexical adjustments improve precision: νεκρῶν ἔργων is ‘dead works,’ not ‘inert works,’ and εἰς τὸ λατρεύειν expresses purpose rather than obligation.'
  naturalness: The sentence is broadly fluent modern standard Malayalam. ‘മരിച്ച പ്രവൃത്തികൾ’ is more direct and idiomatic than ‘നിർജീവ പ്രവൃത്തികൾ’ while preserving the source metaphor. ‘സേവിക്കുന്നതിന്’ expresses the purpose naturally without adding the necessity nuance of ‘സേവിക്കേണ്ടതിന്.’ ‘നിത്യാത്മാവിലൂടെ’ is a more natural compact rendering for the main reading.
  terminology: ‘മശീഹ,’ ‘മനസ്സാക്ഷി,’ ‘ശുദ്ധീകരിക്കും,’ and ‘ജീവനുള്ള ദൈവം’ are appropriate. The footnote properly preserves the genuine ambiguity of διὰ πνεύματος αἰωνίου. The revised wording continues to identify the principal reading as the Holy Spirit without making the alternative unavailable.
  issues:
  - severity: medium
    issue: ‘നിർജീവ പ്രവൃത്തികൾ’ for νεκρῶν ἔργων
    rationale: ‘നിർജീവ’ primarily means inert, nonliving, or inactive. νεκρῶν literally retains the stronger metaphor ‘dead’; ‘മരിച്ച പ്രവൃത്തികൾ’ is clear modern Malayalam and does not interpret the phrase beyond the Greek.
  - severity: low
    issue: ‘സേവിക്കേണ്ടതിന്’ for εἰς τὸ λατρεύειν
    rationale: 'This introduces a ‘should/must serve’ nuance. The Greek infinitive with εἰς marks purpose: cleansing is for serving the living God. ‘സേവിക്കുന്നതിന്’ conveys this without added modality.'
  revised_text: അങ്ങനെയെങ്കിൽ, നിത്യാത്മാവിലൂടെ തന്നെത്തന്നെ കളങ്കമില്ലാത്തവനായി ദൈവത്തിന് അർപ്പിച്ച മശീഹയുടെ രക്തം, ജീവനുള്ള ദൈവത്തെ സേവിക്കുന്നതിന് നമ്മുടെ മനസ്സാക്ഷിയെ മരിച്ച പ്രവൃത്തികളിൽനിന്ന് എത്രയധികം ശുദ്ധീകരിക്കും![a]
