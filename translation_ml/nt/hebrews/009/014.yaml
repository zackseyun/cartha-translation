revisions:
- from: അങ്ങനെയെങ്കിൽ, നിത്യനായ ആത്മാവിലൂടെ തന്നെത്തന്നെ കളങ്കമില്ലാത്തവനായി ദൈവത്തിന് അർപ്പിച്ച മശീഹയുടെ രക്തം, ജീവനുള്ള ദൈവത്തെ സേവിക്കേണ്ടതിന് നമ്മുടെ മനസ്സാക്ഷിയെ നിർജീവ പ്രവൃത്തികളിൽനിന്ന് എത്രയധികം ശുദ്ധീകരിക്കും![a]
  to: അങ്ങനെയെങ്കിൽ, നിത്യാത്മാവിലൂടെ തന്നെത്തന്നെ കളങ്കമില്ലാത്തവനായി ദൈവത്തിന് അർപ്പിച്ച മശീഹയുടെ രക്തം, ജീവനുള്ള ദൈവത്തെ സേവിക്കുന്നതിന് നമ്മുടെ മനസ്സാക്ഷിയെ മരിച്ച പ്രവൃത്തികളിൽനിന്ന് എത്രയധികം ശുദ്ധീകരിക്കും![a]
  rationale: The revision makes only safe lexical and syntactic improvements. It restores the literal-metaphorical force of ‘dead works’ and renders the purpose infinitive without a necessity implication. The alternative reading of ‘through an eternal spirit’ remains explicitly available in the footnote.
