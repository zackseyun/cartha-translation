id: HEB.9.14
reference: Hebrews 9:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πόσῳ μᾶλλον τὸ αἷμα τοῦ Χριστοῦ, ὃς διὰ πνεύματος αἰωνίου ἑαυτὸν προσήνεγκεν ἄμωμον τῷ θεῷ, καθαριεῖ τὴν συνείδησιν ⸀ἡμῶν ἀπὸ νεκρῶν ἔργων εἰς τὸ λατρεύειν θεῷ ζῶντι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/014.yaml
  text: how much more will the blood of Messiah—who through the eternal Spirit offered himself without blemish to God—cleanse our conscience from dead works to serve the living God[a].
translation:
  language: ml
  text: അങ്ങനെയെങ്കിൽ, നിത്യാത്മാവിലൂടെ തന്നെത്തന്നെ കളങ്കമില്ലാത്തവനായി ദൈവത്തിന് അർപ്പിച്ച മശീഹയുടെ രക്തം, ജീവനുള്ള ദൈവത്തെ സേവിക്കുന്നതിന് നമ്മുടെ മനസ്സാക്ഷിയെ മരിച്ച പ്രവൃത്തികളിൽനിന്ന് എത്രയധികം ശുദ്ധീകരിക്കും![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിത്യമായ ഒരു ആത്മാവിലൂടെ.” ഗ്രീക്ക് പ്രയോഗം കൂടുതൽ പൊതുവായ അർഥത്തിലും വായിക്കാം; ഇവിടെ “നിത്യാത്മാവ്” എന്നത് പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്നതായി എടുത്തിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: πόσῳ μᾶλλον
  choice: എത്രയധികം
  rationale: മുൻവാക്യത്തിൽനിന്നുള്ള ശക്തമായ താരതമ്യനിഗമനത്തിന്റെ ആലങ്കാരിക ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τὸ αἷμα τοῦ Χριστοῦ
  choice: മശീഹയുടെ രക്തം
  rationale: αἷμα എന്ന ബലിസംബന്ധമായ പ്രതീകം നേരിട്ട് നിലനിർത്തുന്നു; Χριστός ഇവിടെ അഭിഷിക്തൻ എന്ന പദവിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘മശീഹ’ എന്നു നൽകി.
- source_word: διὰ πνεύματος αἰωνίου
  choice: നിത്യനായ ആത്മാവിലൂടെ
  rationale: διάയുടെ മാധ്യമാർഥം ‘ആത്മാവിലൂടെ’ എന്നു നിലനിർത്തുന്നു. പ്രധാന വായനയിൽ ദൈവാത്മാവാണ് സൂചനയെന്നു കരുതുന്നതിനാൽ വ്യക്തിസൂചകമായ ‘നിത്യനായ’ ഉപയോഗിച്ചു; വ്യാകരണപരമായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: ἑαυτὸν προσήνεγκεν
  choice: തന്നെത്തന്നെ ... അർപ്പിച്ച
  rationale: പ്രത്യാവർത്തകതയും യാഗാർപ്പണത്തിന്റെ ആരാധനാസംബന്ധമായ ഭാഷയും സംരക്ഷിക്കുന്നു.
- source_word: ἄμωμον
  choice: കളങ്കമില്ലാത്തവനായി
  rationale: സ്വീകാര്യമായ യാഗത്തിന് ദോഷമോ കളങ്കമോ ഇല്ലെന്ന ബലിപശ്ചാത്തലം പ്രകടമാക്കുന്നു.
- source_word: καθαριεῖ
  choice: ശുദ്ധീകരിക്കും
  rationale: ഗ്രീക്കിലെ ഭാവികാലം നിലനിർത്തുകയും ശുദ്ധി സംബന്ധമായ സന്ദർഭത്തിന് യോജിച്ച പദം ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: τὴν συνείδησιν ἡμῶν
  choice: നമ്മുടെ മനസ്സാക്ഷിയെ
  rationale: അന്തരംഗത്തിലെ ധാർമ്മിക ബോധത്തെ സൂചിപ്പിക്കുന്ന പതിവും സ്വാഭാവികവുമായ മലയാള പദപ്രയോഗം.
- source_word: ἀπὸ νεκρῶν ἔργων
  choice: നിർജീവ പ്രവൃത്തികളിൽനിന്ന്
  rationale: വ്യാഖ്യാനിച്ച് ‘മരണത്തിലേക്കു നയിക്കുന്ന’ എന്നു മാറ്റാതെ മൂലത്തിലെ സാന്ദ്രമായ രൂപകം നിലനിർത്തുന്നു; ‘മൃതപ്രവൃത്തികൾ’ എന്ന അപരിചിത പ്രയോഗത്തേക്കാൾ ആധുനിക മലയാളത്തിൽ വ്യക്തമാണ്.
- source_word: εἰς τὸ λατρεύειν
  choice: സേവിക്കേണ്ടതിന്
  rationale: ഉദ്ദേശ്യം വ്യക്തമാക്കുകയും λατρεύω ഉൾക്കൊള്ളുന്ന ആരാധനയും ദൈവസേവനവും അതിയായി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: θεῷ ζῶντι
  choice: ജീവനുള്ള ദൈവത്തെ
  rationale: സന്ദർഭത്തിലെ നിർദിഷ്ടതയും ബൈബിൾ ഭാഷയിലെ സ്ഥിരമായ വിശേഷണവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: πνεύματος αἰωνίου എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: ദൈവാത്മാവിനെ സൂചിപ്പിക്കുന്നതായി ‘നിത്യനായ ആത്മാവ്’
  alternative: ‘നിത്യമായ ഒരു ആത്മാവിലൂടെ’; മശീഹയുടെ സ്വന്തം നിത്യാത്മാവ് അല്ലെങ്കിൽ ആത്മീയമായ അർപ്പണരീതി
  rationale: ലേഖനമില്ലാത്ത ഗ്രീക്ക് പ്രയോഗത്തിന് ഒന്നിലധികം വ്യാകരണസാധ്യതകളുണ്ട്. പ്രധാന വായനയായി പരിശുദ്ധാത്മാവിനെ സ്വീകരിച്ചെങ്കിലും യഥാർത്ഥമായ അവ്യക്തത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: Χριστός എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ അഭിഷിക്തനായവന്റെ ബലിമരണപ്രവൃത്തി പറയുന്നതിനാൽ പദവിയുടെ അർഥം സജീവമാണ്; അതുകൊണ്ട് ലിപ്യന്തരണത്തേക്കാൾ ‘മശീഹ’ തിരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ ശൈലി. യാഗം, ശുദ്ധീകരണം, മനസ്സാക്ഷി, ദൈവസേവനം എന്നീ പ്രധാന ആശയങ്ങൾ ഔപചാരികമായെങ്കിലും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഭാഷയിൽ നിലനിർത്തി.
