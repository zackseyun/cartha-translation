  text: σκηνὴ γὰρ κατεσκευάσθη ἡ πρώτη ἐν ᾗ ἥ τε λυχνία καὶ ἡ τράπεζα καὶ ἡ πρόθεσις τῶν ἄρτων, ἥτις λέγεται Ἅγια·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/002.yaml
  text: For a first tabernacle was prepared[a], in which were the lampstand and the table and the bread of the Presence[b], which is called the Holy Place.
translation:
  language: ml
  text: ആദ്യത്തെ കൂടാരം ഒരുക്കപ്പെട്ടു; അതിൽ നിലവിളക്കും മേശയും നിരത്തിവെച്ച അപ്പങ്ങളും[a] ഉണ്ടായിരുന്നു. അതിനെ ‘വിശുദ്ധസ്ഥലം’[b] എന്നു വിളിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സന്നിധിയപ്പം’; പരമ്പരാഗതമായി, ‘കാഴ്ചയപ്പം.’ ഗ്രീക്കിൽ അക്ഷരാർഥം, ‘അപ്പങ്ങളുടെ നിരത്തിവെപ്പ്.’
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ ‘വിശുദ്ധസ്ഥാനങ്ങൾ’ എന്ന ബഹുവചനരൂപം; ഇവിടെ കൂടാരത്തിന്റെ ആദ്യത്തെ അറയായ വിശുദ്ധസ്ഥലത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκηνὴ … ἡ πρώτη
  choice: ഒന്നാമത്തെ കൂടാരം
  rationale: σκηνή എന്ന പദത്തിന്റെ കൂടാരസ്വഭാവവും മോശൈക വിശുദ്ധമന്ദിരവുമായുള്ള ബന്ധവും നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് ആദ്യത്തെ അറയെ സൂചിപ്പിക്കുന്നു.
- source_word: κατεσκευάσθη
  choice: ഒരുക്കപ്പെട്ടിരുന്നു
  rationale: നിർമാണത്തിൽ മാത്രം അർഥം ചുരുക്കാതെ, വിശുദ്ധസ്ഥലവും അതിലെ ഉപകരണങ്ങളും ക്രമീകരിച്ച് സജ്ജമാക്കിയെന്ന വിശാലമായ ആശയം നൽകുന്നു.
- source_word: λυχνία
  choice: വിളക്കുതണ്ട്
  rationale: മെഴുകുതിരിയല്ല, എണ്ണവിളക്കുകൾ വയ്ക്കുന്ന വിശുദ്ധോപകരണമാണെന്നത് വ്യക്തമാക്കുന്ന സ്വാഭാവിക പദം.
- source_word: τράπεζα
  choice: മേശ
  rationale: വിശുദ്ധസ്ഥലത്തിലെ ഉപകരണത്തിന് നേരിട്ടും സ്വാഭാവികവുമായ തർജമ.
- source_word: ἡ πρόθεσις τῶν ἄρτων
  choice: നിരത്തിവെച്ച അപ്പം
  rationale: അപ്പങ്ങൾ മുന്നിൽ വെക്കുക അഥവാ നിരത്തിവെക്കുക എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; പരമ്പരാഗത സാങ്കേതികപദം മുഖ്യവാചകത്തിൽ നിർബന്ധിക്കുന്നില്ല.
- source_word: Ἅγια
  choice: വിശുദ്ധസ്ഥലം
  rationale: ഗ്രീക്കിൽ രൂപം ബഹുവചനമാണെങ്കിലും, ഇവിടെ രണ്ടാമത്തെ അറയിൽനിന്ന് വേർതിരിച്ച ആദ്യത്തെ അറയെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: Ἅγια എന്ന ബഹുവചനരൂപവും കൂടാരത്തിന്റെ അറകളും തമ്മിലുള്ള ബന്ധം
  choice: വിശുദ്ധസ്ഥലം
  alternative: വിശുദ്ധസ്ഥാനങ്ങൾ / വിശുദ്ധമന്ദിരം
  rationale: തുടർന്നുള്ള വാക്യത്തിലെ അകത്തെ അറയുമായുള്ള സ്ഥലപരമായ വ്യത്യാസം വ്യക്തമാക്കാൻ ഏകവചനമായ പരമ്പരാഗത സ്ഥാനനാമം ഉപയോഗിച്ചു; ഗ്രീക്ക് ബഹുവചനരൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- issue: ἡ πρόθεσις τῶν ἄρτων എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: നിരത്തിവെച്ച അപ്പം
  alternative: സന്നിധിയപ്പം / അപ്പത്തിന്റെ നിരത്തിവെപ്പ്
  rationale: ഗ്രീക്കിലെ ‘വെക്കൽ/നിരത്തിവെക്കൽ’ എന്ന ഘടകം സംരക്ഷിച്ചുകൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ രൂപം തിരഞ്ഞെടുത്തു; പഴയനിയമപരമായ മറ്റൊരു പരിചിത നാമം അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ആരാധനാസംബന്ധിയായ ആശയങ്ങൾ വ്യക്തമാക്കുമ്പോഴും അനാവശ്യമായ സഭാപാരമ്പര്യ സാങ്കേതികഭാഷ ഒഴിവാക്കി. എല്ലാ അടിക്കുറിപ്പുകുറികളും ബന്ധപ്പെട്ട പദങ്ങൾക്ക് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
