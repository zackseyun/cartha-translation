reference: Hebrews 9:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Χριστὸς δὲ παραγενόμενος ἀρχιερεὺς τῶν ⸀γενομένων ἀγαθῶν διὰ τῆς μείζονος καὶ τελειοτέρας σκηνῆς οὐ χειροποιήτου, τοῦτ’ ἔστιν οὐ ταύτης τῆς κτίσεως,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/011.yaml
  text: But the Messiah came as high priest of the good things that have come[a], through the greater and more perfect tabernacle not made by hands—that is[b], not of this creation—
translation:
  language: ml
  text: എന്നാൽ വന്നെത്തിയ നന്മകളുടെ മഹാപുരോഹിതനായി മശീഹ വന്നു[a]; കൈകൊണ്ടു നിർമിച്ചതല്ലാത്തതും—അതായത്, ഈ സൃഷ്ടിയിൽപ്പെട്ടതല്ലാത്തതുമായ—കൂടുതൽ മഹത്തും കൂടുതൽ പൂർണവുമായ തിരുനിവാസത്തിലൂടെ—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ “വരാനിരിക്കുന്ന നന്മകളുടെ” എന്നു വായിക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: Χριστὸς
  choice: മശീഹ
  rationale: സന്ദർഭത്തിൽ അഭിഷിക്തനായ വാഗ്ദത്ത രക്ഷകൻ എന്ന പദവിയർഥം സജീവമായതിനാൽ ‘ക്രിസ്തു’ എന്ന പേരുരൂപത്തേക്കാൾ ‘മശീഹ’ തിരഞ്ഞെടുത്തു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യങ്ങളിലെ ഭൗമിക തിരുനിവാസത്തോടും പുരോഹിതശുശ്രൂഷയോടുമുള്ള വൈരുധ്യപരമായ മാറ്റം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: παραγενόμενος
  choice: വന്നു
  rationale: മശീഹ മഹാപുരോഹിതനായി സന്നിഹിതനായെത്തിയതിനെ സൂചിപ്പിക്കുന്ന പങ്കാളിത്തക്രിയയെ ലളിതവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു; ‘പ്രത്യക്ഷപ്പെട്ടു’ എന്നത് മൂലത്തിലെ വരവ് എന്ന ഭാവത്തെ മങ്ങിച്ചേക്കാം.
- source_word: ἀρχιερεὺς
  choice: മഹാപുരോഹിതൻ
  rationale: എബ്രായലേഖനത്തിലെ ആരാധനാസംബന്ധിയായ ഔദ്യോഗിക പദത്തിന് മലയാളത്തിലെ സ്ഥിരവും കൃത്യവുമായ തുല്യപദം.
- source_word: τῶν γενομένων ἀγαθῶν
  choice: വന്നെത്തിയ നന്മകളുടെ
  rationale: SBLGNT-യിലെ γενομένων എന്ന വായനയെ നേരിട്ട് പിന്തുടർന്ന്, നന്മകൾ ഇതിനകം വന്നെത്തിയെന്ന പൂർത്തീകരണഭാവം നിലനിർത്തുന്നു.
- source_word: διὰ τῆς ... σκηνῆς
  choice: '... തിരുനിവാസത്തിലൂടെ'
  rationale: σκηνή ഇവിടെ സാധാരണ കൂടാരമല്ല, മരുഭൂമിയിലെ ആരാധനാനിവാസത്തിന്റെ പ്രതിരൂപമാണ്. ‘തിരുനിവാസം’ ആ ആരാധനാപരമായ ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു. വാക്യം 12-ലേക്ക് നീളുന്ന ഗ്രീക്ക് വാക്യഘടനയും നിലനിർത്തുന്നു.
- source_word: μείζονος
  choice: കൂടുതൽ മഹത്തായ
  rationale: വലിപ്പം മാത്രമല്ല, ശ്രേഷ്ഠതയും സൂചിപ്പിക്കുന്നതിനാൽ ‘വലുതായ’ എന്നതിനു പകരം ‘മഹത്തായ’ ഉപയോഗിച്ചു.
- source_word: τελειοτέρας
  choice: കൂടുതൽ പൂർണമായ
  rationale: എബ്രായലേഖനത്തിലെ പൂർണത/പൂർത്തീകരണം എന്ന പ്രമേയബന്ധം സംരക്ഷിക്കുന്നു.
- source_word: οὐ χειροποιήτου
  choice: കൈകൊണ്ടു നിർമിച്ചതല്ലാത്ത
  rationale: മനുഷ്യനിർമിതമല്ലെന്ന ആരാധനാസംബന്ധിയായ വൈരുധ്യം മൂലത്തോട് അടുത്തുനിന്ന് വ്യക്തമാക്കുന്നു.
- source_word: τοῦτ’ ἔστιν
  choice: അതായത്
  rationale: തുടർന്നുവരുന്ന വിശദീകരണം സ്വാഭാവികമായി പരിചയപ്പെടുത്തുന്നു.
- source_word: οὐ ταύτης τῆς κτίσεως
  choice: ഈ സൃഷ്ടിയിൽപ്പെട്ടതല്ലാത്ത
  rationale: ‘ഈ സൃഷ്ടിയുടെതല്ലാത്ത’ എന്ന കൃത്രിമ രൂപം ഒഴിവാക്കി, ഇപ്പോഴുള്ള സൃഷ്ടിവ്യവസ്ഥയോട് അതിന് ബന്ധമില്ലെന്ന മൂലാർഥം വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: τῶν γενομένων ἀγαθῶν എന്ന പാഠവായനയും കാലസൂചനയും
  choice: വന്നെത്തിയ നന്മകളുടെ
  alternative: വരാനിരിക്കുന്ന നന്മകളുടെ
  rationale: പ്രധാനപാഠം SBLGNT-യിലെ γενομένων (‘വന്നെത്തിയ’) പിന്തുടരുന്നു. μελλόντων (‘വരാനിരിക്കുന്ന’) എന്ന സുപരിചിതമായ പാഠഭേദം അടിക്കുറിപ്പിൽ നൽകിയതിലൂടെ പാഠവിമർശനപരവും ദൈവശാസ്ത്രപരവുമായ സംഘർഷം മറച്ചുവയ്ക്കുന്നില്ല.
- issue: διὰ τῆς ... σκηνῆς എന്ന പദസമുച്ചയത്തിന്റെ വാക്യബന്ധം
  choice: വാക്യം 12-ലെ മുഖ്യക്രിയയിലേക്കു നീളുന്ന അപൂർണ ഘടനയായി നിലനിർത്തി
  alternative: മശീഹയുടെ വരവിന്റെ മാർഗമായി തിരുനിവാസത്തെ ബന്ധിപ്പിക്കുക
  rationale: ഗ്രീക്ക് വാക്യം അടുത്ത വാക്യത്തിലെ εἰσῆλθεν എന്ന മുഖ്യക്രിയയിലേക്ക് തുടരുന്നു. അതിനാൽ തിരുനിവാസം മശീഹ വന്നതിന്റെ മാർഗമാണെന്ന് തെറ്റായി ഉറപ്പിക്കാതെ യഥാർഥ വാക്യതുടർച്ച സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ആരാധനാസംബന്ധിയായ കൃത്യതയ്ക്കായി ‘മഹാപുരോഹിതൻ’, ‘തിരുനിവാസം’ എന്നിവ ഉപയോഗിച്ചു. മൂലഗ്രീക്ക് വാക്യം 9:12-ലേക്ക് തുടരുന്നതിനാൽ അവസാനത്തിൽ ദീർഘവിരാമചിഹ്നം നൽകി അപൂർണത ഉദ്ദേശപൂർവം സംരക്ഷിച്ചു; പ്രധാനപാഠത്തിലെ [a] അടിക്കുറിപ്പ് പാഠഭേദം വ്യക്തമാക്കുന്നു.
