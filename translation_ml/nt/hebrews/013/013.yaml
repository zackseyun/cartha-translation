id: HEB.13.13
reference: Hebrews 13:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοίνυν ἐξερχώμεθα πρὸς αὐτὸν ἔξω τῆς παρεμβολῆς, τὸν ὀνειδισμὸν αὐτοῦ φέροντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/013.yaml
  text: Therefore[a], let us go out to him outside the camp, bearing his reproach.
translation:
  language: ml
  text: അതിനാൽ, നമുക്കു പാളയത്തിനു പുറത്ത് അവന്റെ അടുക്കലേക്കു പോകാം; അവന്റെ നിന്ദ വഹിച്ചുകൊണ്ട്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοίνυν
  choice: അതിനാൽ
  rationale: മുൻവാക്യങ്ങളിലെ, പ്രത്യേകിച്ച് 13:11–12-ലെ, ആശയത്തിൽനിന്നുള്ള നിഗമനം സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവികമായ മലയാളത്തിൽ കാരണ-നിഗമനബന്ധം നിലനിർത്തുന്നു.
- source_word: ἐξερχώμεθα
  choice: നമുക്കു ചെല്ലാം
  rationale: ഒന്നാംപുരുഷ ബഹുവചനത്തിലെ ആഹ്വാനാത്മക ഉപവാക്യത്തിന്റെ പ്രേരണാഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘പാളയത്തിനു പുറത്തുള്ള’ എന്ന സ്ഥലം സൂചിപ്പിക്കുന്ന പ്രയോഗം പുറത്തേക്കുള്ള നീക്കവും വ്യക്തമാക്കുന്നു.
- source_word: πρὸς αὐτὸν
  choice: അവന്റെ അടുക്കലേക്കു
  rationale: ഒരു വ്യക്തിയിലേക്കുള്ള നീക്കം സൂചിപ്പിക്കുന്ന πρός എന്ന പദത്തിന്റെ അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ സർവനാമം യേശുവിനെ സൂചിപ്പിക്കുന്നു.
- source_word: ἔξω τῆς παρεμβολῆς
  choice: പാളയത്തിനു പുറത്തുള്ള
  rationale: പാളയം എന്ന ദൃശ്യരൂപം നിലനിർത്തി ലേവ്യയാഗപശ്ചാത്തലത്തെയും സമൂഹത്തിൽനിന്നുള്ള പുറന്തള്ളലിനെയും അനാവശ്യ വ്യാഖ്യാനമില്ലാതെ സംരക്ഷിക്കുന്നു.
- source_word: τὸν ὀνειδισμὸν αὐτοῦ
  choice: അവന്റെ നിന്ദ
  rationale: ὀνειδισμός എന്നതിലെ അപമാനം, അധിക്ഷേപം, സാമൂഹിക ലജ്ജ എന്നീ അർഥവ്യാപ്തികൾ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; αὐτοῦ എന്ന ഉടമസ്ഥസംബന്ധത്തിന്റെ സ്വാഭാവികമായ തുറന്ന നിലയും സംരക്ഷിക്കുന്നു.
- source_word: φέροντες
  choice: വഹിച്ചുകൊണ്ടുതന്നെ
  rationale: വർത്തമാനകാല കൃദന്തരൂപത്തിലെ തുടർച്ചയും നിന്ദ ഏറ്റുവഹിച്ചുകൊണ്ട് അവന്റെ അടുക്കൽ ചെല്ലുക എന്ന അനുബന്ധപ്രവർത്തനവും പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ‘അവൻ’ എന്ന സർവനാമത്തിന്റെ സൂചിതവ്യക്തി
  choice: ഗ്രീക്കിലുള്ള സർവനാമം നിലനിർത്തി ‘അവൻ’ എന്ന് പരിഭാഷപ്പെടുത്തി; ഉടൻമുമ്പുള്ള 13:12-ന്റെ പശ്ചാത്തലത്തിൽ അത് യേശുവിനെ സൂചിപ്പിക്കുന്നു.
  alternative: ‘യേശുവിന്റെ അടുക്കലേക്കു’ എന്ന് വ്യക്തമായി ചേർക്കുക.
  rationale: മൂലപാഠം പേര് ആവർത്തിക്കാതെ സർവനാമം ഉപയോഗിക്കുന്നു. സന്ദർഭത്തിൽ സൂചിതവ്യക്തി വ്യക്തമായതിനാൽ പേര് ചേർത്ത് മൂലത്തെക്കാൾ വിശദമാക്കേണ്ടതില്ല.
- issue: ‘പാളയത്തിനു പുറത്ത്’ എന്നതിന്റെ അർഥം
  choice: യാഗപരവും സാമൂഹികവുമായ ദൃശ്യരൂപം ‘പാളയം’ എന്ന വാക്കിലൂടെ നിലനിർത്തി.
  alternative: ‘മതസ്ഥാപനത്തിനു പുറത്ത്’ അല്ലെങ്കിൽ ‘സമൂഹത്തിനു പുറത്ത്’ എന്ന് വ്യാഖ്യാനപരമായി മാറ്റുക.
  rationale: ലേവ്യയാഗക്രമത്തോടുള്ള അന്തർപാഠബന്ധവും യേശു അനുഭവിച്ച തിരസ്കാരവും ഈ രൂപകത്തിൽ ഒന്നിച്ചുനിൽക്കുന്നു. ഒരു വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കുന്നത് ദൈവശാസ്ത്രപരമായ വ്യാപ്തി നഷ്ടപ്പെടുത്തും.
- issue: ‘അവന്റെ നിന്ദ’ എന്ന ഉടമസ്ഥപ്രയോഗം
  choice: ഉടമസ്ഥബന്ധം തുറന്ന നിലയിൽ നിലനിർത്തി ‘അവന്റെ നിന്ദ’ എന്ന് നൽകി.
  alternative: ‘അവൻ സഹിച്ച നിന്ദ’ അല്ലെങ്കിൽ ‘അവനെതിരായ നിന്ദ’ എന്ന് വ്യക്തമാക്കുക.
  rationale: സന്ദർഭത്തിൽ യേശുവിന്റെ തിരസ്കാരത്തിൽ പങ്കുചേരലാണ് പ്രധാനമെങ്കിലും, αὐτοῦ എന്ന ഗ്രീക്ക് രൂപം അതിനെ വിശദീകരിക്കുന്ന വാക്യമായി പരിമിതപ്പെടുത്തുന്നില്ല. അതിനാൽ യഥാർഥമായ സംക്ഷിപ്തതയും അർഥസമ്മർദവും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഹ്വാനശൈലി സ്വീകരിച്ചു. ‘പാളയം’, ‘നിന്ദ വഹിക്കുക’ എന്നീ ബൈബിൾ ദൃശ്യപ്രയോഗങ്ങൾ സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നിലനിർത്തി; വിഭാഗീയ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
