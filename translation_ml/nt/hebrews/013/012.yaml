id: HEB.13.12
reference: Hebrews 13:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διὸ καὶ Ἰησοῦς, ἵνα ἁγιάσῃ διὰ τοῦ ἰδίου αἵματος τὸν λαόν, ἔξω τῆς πύλης ἔπαθεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/012.yaml
  text: Therefore Jesus also suffered outside the gate[b][a], so that he might sanctify the people through his own blood.
translation:
  language: ml
  text: അതുകൊണ്ട്, തന്റെ സ്വന്തം രക്തത്താൽ ജനത്തെ വിശുദ്ധീകരിക്കാനായി[a] യേശുവും കവാടത്തിനു പുറത്ത്[b] കഷ്ടം അനുഭവിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വിശുദ്ധമാക്കാനായി’ അല്ലെങ്കിൽ ‘ദൈവത്തിനായി വേർതിരിക്കാനായി’.
    reason: lexical_alternative
  - marker: b
    text: ‘കവാടത്തിനു പുറത്ത്’ എന്നത് യേശു കഷ്ടം അനുഭവിച്ച യെരൂശലേമിനു പുറത്തുള്ള സ്ഥലത്തെ സൂചിപ്പിക്കുന്നതാകാം; മുൻസന്ദർഭത്തിൽ യാഗമൃഗങ്ങളുടെ അവശിഷ്ടങ്ങൾ പാളയത്തിനു പുറത്തേക്കു കൊണ്ടുപോയതിനെയും ഇത് ഓർമിപ്പിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: διὸ
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യങ്ങളിലെ യാഗസംബന്ധമായ വാദത്തിൽനിന്നുള്ള നിഗമനത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: καὶ
  choice: -വും (യേശുവും)
  rationale: മുൻസന്ദർഭത്തിലെ യാഗമാതൃകയോട് യേശുവിനുള്ള സമാനബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: Ἰησοῦς
  choice: യേശു
  rationale: മലയാളത്തിൽ സ്ഥിരമായി ഉപയോഗിക്കുന്ന വ്യക്തിനാമരൂപം.
- source_word: ἵνα ἁγιάσῃ
  choice: വിശുദ്ധീകരിക്കാനായി
  rationale: ἵναയും aorist subjunctive-ഉം സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യം സ്വാഭാവികമായി നൽകുന്നു; യാഗപരവും ഉടമ്പടിസംബന്ധവുമായ അർത്ഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: διὰ τοῦ ἰδίου αἵματος
  choice: തന്റെ സ്വന്തം രക്തത്താൽ
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന ഉപാധിയെയും ἰδίου നൽകുന്ന ഊന്നലിനെയും യാഗചിത്രത്തെയും സംരക്ഷിക്കുന്നു.
- source_word: τὸν λαόν
  choice: ജനത്തെ
  rationale: നിശ്ചിതമായ സമൂഹത്തെ സൂചിപ്പിക്കുന്നു; മൂലപാഠത്തിലില്ലാത്ത ‘ദൈവത്തിന്റെ’ എന്ന വിശദീകരണം ചേർക്കുന്നില്ല.
- source_word: ἔξω τῆς πύλης
  choice: കവാടത്തിനു പുറത്ത്
  rationale: മൂലത്തിലെ ഏകവചനമായ ‘കവാടം’ നിലനിർത്തുകയും ‘നഗരം’ എന്ന പദം മുഖ്യപാഠത്തിൽ കൂട്ടിച്ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἔπαθεν
  choice: കഷ്ടം അനുഭവിച്ചു
  rationale: πάσχωയുടെ കഷ്ടാനുഭവത്തെ വ്യക്തവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
theological_decisions:
- issue: യാഗസന്ദർഭത്തിൽ ἁγιάζω എന്നതിന്റെ പരിഭാഷ
  choice: വിശുദ്ധീകരിക്കുക
  alternative: വിശുദ്ധമാക്കുക; ദൈവത്തിനായി വേർതിരിക്കുക
  rationale: എബ്രായലേഖനത്തിലെ യാഗപരവും ഉടമ്പടിസംബന്ധവുമായ ഭാഷാശൈലി സംരക്ഷിക്കുന്നു; ഒരു പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ സാങ്കേതിക നിർവചനം അടിച്ചേൽപ്പിക്കുന്നില്ല.
- issue: τὸν λαόν എന്നതിന്റെ വ്യാപ്തി
  choice: ജനത്തെ
  alternative: ദൈവജനത്തെ
  rationale: സന്ദർഭം ദൈവത്തിന്റെ ഉടമ്പടിജനത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും ഗ്രീക്കിൽ ‘ദൈവത്തിന്റെ’ എന്നു വ്യക്തമാക്കിയിട്ടില്ല; അതിനാൽ മുഖ്യപാഠത്തിൽ അത് ചേർത്തിട്ടില്ല.
- issue: കവാടത്തിനു പുറത്തുള്ള സ്ഥലം
  choice: കവാടത്തിനു പുറത്ത്
  alternative: നഗരകവാടത്തിനു പുറത്ത്; യെരൂശലേമിനു പുറത്ത്
  rationale: യേശുവിന്റെ കഷ്ടാനുഭവസ്ഥലവും മുൻസന്ദർഭത്തിലെ പാളയത്തിനു പുറത്തേക്കുള്ള യാഗാവശിഷ്ടനീക്കവും തമ്മിലുള്ള പ്രതിധ്വനി നിലനിർത്തുന്നു; എന്നാൽ മൂലപാഠം വ്യക്തമാക്കാത്ത ‘നഗരം’ അല്ലെങ്കിൽ ‘യെരൂശലേം’ മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ ഉദ്ദേശ്യബന്ധവും യാഗപരമായ പദസമ്പത്തും നിലനിർത്തിക്കൊണ്ട് അനാവശ്യമായ വ്യാഖ്യാനവികാസം ഒഴിവാക്കി.
