  yaml_path: translation/nt/hebrews/013/002.yaml
  text: Do not neglect hospitality[a], for through it some have entertained angels without knowing it.
translation:
  language: ml
  text: അതിഥിസൽക്കാരം മറക്കരുത്; അതിലൂടെ ചിലർ അറിയാതെ ദൂതന്മാരെ[a] അതിഥികളായി സ്വീകരിച്ചിട്ടുണ്ട്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ചിലർ അറിയാതെ സന്ദേശവാഹകരെ അതിഥികളായി സ്വീകരിച്ചിട്ടുണ്ട്.” ഗ്രീക്ക് പദത്തിന് ‘ദൂതന്മാർ’ എന്നും ‘സന്ദേശവാഹകർ’ എന്നും അർഥമാകാം; എന്നാൽ ഇവിടെ സാധ്യതയുള്ള പഴയനിയമസൂചനയ്ക്ക് ‘ദൂതന്മാർ’ എന്ന അർഥമാണ് കൂടുതൽ യോജിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλοξενίας
  choice: അതിഥിസൽക്കാരം
  rationale: അപരിചിതരെയും അതിഥികളെയും സ്നേഹപൂർവം സ്വീകരിക്കുന്ന പ്രവൃത്തിയെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്; ആ ആശയം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായും സംക്ഷിപ്തമായും ‘അതിഥിസൽക്കാരം’ അറിയിക്കുന്നു.
- source_word: μὴ ἐπιλανθάνεσθε
  choice: മറക്കരുത്
  rationale: മറക്കുക, അവഗണിക്കുക എന്നീ അർഥങ്ങൾ ക്രിയയ്ക്കുണ്ട്. മൂലപാഠത്തിന്റെ നേരിട്ടുള്ള പ്രബോധനഭാവം നിലനിർത്തിക്കൊണ്ട്, ഈ കടമ പ്രാവർത്തികമാക്കാതിരിക്കരുത് എന്ന ആശയവും സന്ദർഭത്തിൽ ‘മറക്കരുത്’ നൽകുന്നു.
- source_word: διὰ ταύτης
  choice: അതിലൂടെ
  rationale: സ്ത്രീലിംഗ സർവനാമം മുൻപുള്ള അതിഥിസൽക്കാരത്തെ സൂചിപ്പിക്കുന്നു; διάയുടെ ഉപകരണാർഥം ‘അതിലൂടെ’ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἔλαθόν
  choice: അറിയാതെ
  rationale: λανθάνωയും കൃതന്തവും ചേർന്ന നിർമാണം, ചെയ്ത കാര്യം കർത്താക്കൾ അറിഞ്ഞിരുന്നില്ലെന്ന് സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘അറിയാതെ’ അത് വ്യക്തവും ചുരുക്കവുമായി നൽകുന്നു.
- source_word: τινες
  choice: ചിലർ
  rationale: അനിശ്ചിത ബഹുവചനത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രതിനിധീകരിക്കുന്നു.
- source_word: ξενίσαντες
  choice: അതിഥികളായി സ്വീകരിച്ചിട്ടുണ്ട്
  rationale: അതിഥികളെ താമസിപ്പിക്കുകയും ആതിഥ്യം നൽകുകയും ചെയ്യുക എന്ന അർഥം വ്യക്തമായി നൽകുന്നു; മലയാളത്തിൽ തെറ്റിദ്ധാരണയില്ലാത്ത സ്വാഭാവിക പ്രയോഗമാണിത്.
- source_word: ἀγγέλους
  choice: ദൂതന്മാരെ
  rationale: ἄγγελος എന്ന പദത്തിന് ദൈവിക ദൂതന്മാരെയോ പൊതുവായി സന്ദേശവാഹകരെയോ സൂചിപ്പിക്കാം. സാധ്യതയുള്ള ഉല്പത്തി 18–19 സൂചന ദൈവിക ദൂതന്മാരെ അനുകൂലിക്കുന്നു; ‘ദൂതന്മാർ’ മലയാളത്തിൽ ആ അർഥം വഹിക്കുമ്പോഴും പദത്തിന്റെ അടിസ്ഥാനമായ ദൂതൻ എന്ന ആശയം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἀγγέλους എന്നതിന്റെ സൂചിതാർഥം
  choice: ദൈവിക ദൂതന്മാർ എന്നത് മുഖ്യവായനയായി ‘ദൂതന്മാർ’
  alternative: മനുഷ്യരായ സന്ദേശവാഹകർ
  rationale: അബ്രാഹാമും ലോത്തും ദൈവിക സന്ദർശകരെ സ്വീകരിച്ച സംഭവങ്ങളിലേക്കുള്ള സാധ്യതയുള്ള സൂചന ദൈവിക അർഥത്തെ ശക്തമായി പിന്തുണയ്ക്കുന്നു. എങ്കിലും ഗ്രീക്ക് പദത്തിന്റെ പൊതുവായ ‘സന്ദേശവാഹകർ’ എന്ന അർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. ‘അതിഥിസൽക്കാരം’ സ്ഥാപിതവും സ്വാഭാവികവുമായ പദമായി ഉപയോഗിച്ചു; മൂലപാഠത്തിലെ ചുരുക്കവും പ്രബോധനഭാവവും നിലനിർത്തി.
