id: HEB.13.24
reference: Hebrews 13:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀσπάσασθε πάντας τοὺς ἡγουμένους ὑμῶν καὶ πάντας τοὺς ἁγίους. ἀσπάζονται ὑμᾶς οἱ ἀπὸ τῆς Ἰταλίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/024.yaml
  text: Greet all your leaders and all the saints[a]. Those from Italy greet you.
translation:
  language: ml
  text: നിങ്ങളുടെ എല്ലാ നേതാക്കളെയും എല്ലാ വിശുദ്ധരെയും അഭിവാദ്യം ചെയ്യുക. ഇറ്റലിയിൽനിന്നുള്ളവർ[a] നിങ്ങളെ അഭിവാദ്യം ചെയ്യുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇറ്റലിയിലുള്ളവർ നിങ്ങളെ അഭിവാദ്യം ചെയ്യുന്നു.” ഗ്രീക്ക് പ്രയോഗം ഇറ്റലിയിൽനിന്നുള്ളവരെയോ ഇറ്റലിയിൽ ഉള്ളവരെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: അഭിവാദ്യം ചെയ്യുക
  rationale: ἀσπάζομαι എന്ന ക്രിയയുടെ ആജ്ഞാർഥബലം നിലനിർത്തുകയും കത്തിന്റെ സമാപനസന്ദർഭത്തിലെ ആശംസ അറിയിക്കൽ സ്വാഭാവികവും മാന്യവുമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: πάντας
  choice: എല്ലാ
  rationale: രണ്ടു കൂട്ടങ്ങളുടെയും സമഗ്രത വ്യക്തമാക്കുന്ന നേരിട്ടുള്ള ആധുനിക മലയാളപ്രയോഗമാണ്.
- source_word: τοὺς ἡγουμένους ὑμῶν
  choice: നിങ്ങളുടെ എല്ലാ നേതാക്കളെയും
  rationale: പദപ്രയോഗം അക്ഷരാർഥത്തിൽ ‘നിങ്ങളെ നയിക്കുന്നവർ’ എന്നാണ്; ഇവിടെ വിശ്വാസസമൂഹത്തിലെ അംഗീകൃത നേതാക്കളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘നേതാക്കൾ’ എന്നത് രാഷ്ട്രീയമായോ അധികാരപരമായോ തെറ്റിദ്ധാരണ സൃഷ്ടിക്കാതെ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: τοὺς ἁγίους
  choice: എല്ലാ വിശുദ്ധരെയും
  rationale: പുതിയ നിയമത്തിൽ വിശ്വാസികളെ സൂചിപ്പിക്കാൻ പതിവായി ഉപയോഗിക്കുന്ന ‘വിശുദ്ധർ’ എന്ന ദൈവശാസ്ത്രപരമായ പദത്തിന്റെ ഭാരവും കൂട്ടത്തെ മുഴുവനായും ഉദ്ദേശിക്കുന്ന അർഥവും നിലനിർത്തുന്നു.
- source_word: ἀσπάζονται
  choice: അഭിവാദ്യം ചെയ്യുന്നു
  rationale: വർത്തമാനകാല സൂചനയും കത്തിലെ ആശംസാസന്ദർഭവും ചുരുക്കമായും സ്വാഭാവികമായും സംരക്ഷിക്കുന്നു.
- source_word: οἱ ἀπὸ τῆς Ἰταλίας
  choice: ഇറ്റലിയിൽനിന്നുള്ളവർ
  rationale: ἀπό + ഷഷ്ഠീവിഭക്തി സാധാരണയായി ഉറവിടമോ ദേശബന്ധമോ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഇറ്റലിയിൽനിന്നുള്ളവർ’ മുഖ്യവായനയായി സ്വീകരിച്ചു; സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
theological_decisions:
- issue: οἱ ἀπὸ τῆς Ἰταλίας എന്ന പ്രയോഗത്തിന്റെ സൂചന
  choice: ഇറ്റലിയിൽനിന്നുള്ളവർ
  alternative: ഇറ്റലിയിലുള്ളവർ
  rationale: ἀπό എന്ന ഉപസർഗം സ്വാഭാവികമായി ഉത്ഭവമോ പുറപ്പെടുന്ന സ്ഥലമോ സൂചിപ്പിക്കുന്നു. എന്നാൽ ഈ പ്രയോഗം ഇറ്റലിയിൽ ഇപ്പോൾ ഉള്ളവരെയും സൂചിപ്പിക്കാമെന്ന വ്യാഖ്യാനസാധ്യതയുണ്ട്. കത്തിന്റെ രചനാസ്ഥലം അനാവശ്യമായി തീർച്ചപ്പെടുത്താതിരിക്കാൻ ആ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കത്തുശൈലി ഉപയോഗിച്ചു. ‘നേതാക്കൾ’, ‘വിശുദ്ധർ’, ‘അഭിവാദ്യം ചെയ്യുക’ എന്നീ പരിചിത പദങ്ങൾ മൂലപാഠത്തിന്റെ സഭാസന്ദർഭവും ദൈവശാസ്ത്രപരമായ ഭാരംയും അനാവശ്യ വ്യാഖ്യാനവികാസമില്ലാതെ നിലനിർത്തുന്നു.
