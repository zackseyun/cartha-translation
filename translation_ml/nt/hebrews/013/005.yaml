id: HEB.13.5
reference: Hebrews 13:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀφιλάργυρος ὁ τρόπος· ἀρκούμενοι τοῖς παροῦσιν· αὐτὸς γὰρ εἴρηκεν· Οὐ μή σε ἀνῶ οὐδ’ οὐ μή σε ⸀ἐγκαταλίπω·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/005.yaml
  text: Let your way of life be free from the love of money[a], being content with what you have, for he himself has said, “I will never leave you[b], nor will I ever forsake you.”
translation:
  language: ml
  text: 'നിങ്ങളുടെ ജീവിതരീതി പണസ്നേഹമില്ലാത്തതായിരിക്കട്ടെ; നിങ്ങൾക്കു നിലവിൽ ഉള്ളതിൽ തൃപ്തരായിരിക്കുക[a]. എന്തെന്നാൽ അവൻതന്നെ പറഞ്ഞിരിക്കുന്നു: “ഞാൻ നിന്നെ ഒരിക്കലും കൈവിടുകയില്ല[b]; നിന്നെ ഒരിക്കലും ഉപേക്ഷിക്കുകയുമില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “നിലവിലുള്ള കാര്യങ്ങളിൽ തൃപ്തരായിരിക്കുക.” ഇത് കൈവശമുള്ള വസ്തുക്കളെയും നിലവിലെ സാഹചര്യങ്ങളെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ഈ വാഗ്ദാനം പഴയ നിയമത്തിലെ ഉടമ്പടിസംബന്ധമായ ഉറപ്പുകളെ, പ്രത്യേകിച്ച് ആവർത്തനം 31:6, 8; യോശുവ 1:5 എന്നിവയെ, പ്രതിധ്വനിപ്പിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: ἀφιλάργυρος
  choice: പണത്തോടുള്ള സ്നേഹത്തിൽനിന്ന് സ്വതന്ത്രമായ
  rationale: പണത്തോടുള്ള സ്നേഹം സ്വഭാവത്തെ നിയന്ത്രിക്കാത്ത അവസ്ഥയാണ് ഈ വിശേഷണം സൂചിപ്പിക്കുന്നത്. പൊതുവായ ‘അത്യാഗ്രഹം’ എന്നതിനെക്കാൾ മൂലത്തിലെ പണസ്നേഹത്തെ ഇത് കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: ὁ τρόπος
  choice: നിങ്ങളുടെ ജീവിതരീതി
  rationale: ഇവിടെ τρόπος ഒരാളുടെ പെരുമാറ്റത്തെയും ജീവിക്കുന്ന രീതിയെയും സൂചിപ്പിക്കുന്നു. ബഹുവചന അഭിസംബോധന മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കിയിരിക്കുന്നു.
- source_word: ἀρκούμενοι
  choice: തൃപ്തരായിരിക്കുക
  rationale: ആരംഭത്തിലെ പ്രബോധനവുമായി ബന്ധമുള്ള പങ്കാളിക്രിയയുടെ പ്രബോധനാത്മക ഭാവവും തുടർച്ചയായ മനോഭാവവും ഈ രൂപം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τοῖς παροῦσιν
  choice: ഇപ്പോൾ നിങ്ങൾക്കുള്ളതുകൊണ്ട്
  rationale: അക്ഷരാർഥത്തിൽ ‘സന്നിഹിതമായ/ഇപ്പോഴുള്ള കാര്യങ്ങൾ’ എന്നാണ്. സന്ദർഭത്തിൽ കൈവശമുള്ള സമ്പത്തോ നിലവിലെ സാഹചര്യങ്ങളോ ഉൾക്കൊള്ളാൻ കഴിയുന്ന സ്വാഭാവിക മലയാളമാണിത്.
- source_word: αὐτὸς γὰρ εἴρηκεν
  choice: എന്തെന്നാൽ അവിടുന്നുതന്നെ പറഞ്ഞിരിക്കുന്നു
  rationale: αὐτός നൽകുന്ന ഊന്നൽ ‘തന്നെ’ നിലനിർത്തുന്നു; εἴρηκεν എന്ന perfect രൂപത്തിന്റെ ഇപ്പോഴും നിലനിൽക്കുന്ന പ്രാബല്യം ‘പറഞ്ഞിരിക്കുന്നു’ പ്രകടമാക്കുന്നു. ദൈവത്തെ സൂചിപ്പിക്കുന്ന മലയാളത്തിലെ ആദരസൂചക സർവനാമമാണ് ഉപയോഗിച്ചത്; മൂലത്തിൽ ഇല്ലാത്ത ‘ദൈവം’ എന്ന നാമം ചേർത്തിട്ടില്ല.
- source_word: Οὐ μή σε ἀνῶ
  choice: ഞാൻ നിന്നെ ഒരിക്കലും കൈവിടുകയില്ല
  rationale: οὐ μή എന്ന ശക്തമായ നിഷേധത്തെ ‘ഒരിക്കലും ... ഇല്ല’ സ്വാഭാവികവും ഉറപ്പുള്ളതുമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു. ἀνίημι ഇവിടെ ‘കൈവിടുക’ എന്നു യോജിക്കുന്നു.
- source_word: οὐδ’ οὐ μή σε ἐγκαταλίπω
  choice: നിന്നെ ഒരിക്കലും ഉപേക്ഷിക്കുകയുമില്ല
  rationale: ἐγκαταλείπω എന്നതിന്റെ ഉപേക്ഷിക്കുക/വിട്ടുകളയുക എന്ന അർഥവും ആവർത്തിച്ച ശക്തമായ നിഷേധവും ഗൗരവമുള്ളതും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഉദ്ധരണിയിലെ സംസാരിക്കുന്നവന്റെ തിരിച്ചറിയൽ
  choice: ‘ദൈവം’ എന്ന നാമം ചേർക്കാതെ ‘അവിടുന്നുതന്നെ’ എന്ന സർവനാമം നിലനിർത്തുക.
  alternative: ‘ദൈവംതന്നെ പറഞ്ഞിരിക്കുന്നു’
  rationale: സന്ദർഭത്തിൽ സംസാരിക്കുന്നത് ദൈവമാണെന്ന് വ്യക്തമായിരുന്നാലും ഗ്രീക്കിൽ θεός എന്ന നാമമല്ല, αὐτός എന്ന സർവനാമമാണ്. അതിനാൽ ദൈവസൂചനയുള്ള ആദരസൂചക സർവനാമം ഉപയോഗിച്ച് മൂലത്തിന്റെ രൂപം കഴിയുന്നത്ര സംരക്ഷിച്ചു.
- issue: ഉദ്ധരണിയിലെ ശക്തമായ ഇരട്ട നിഷേധങ്ങൾ
  choice: രണ്ടു വാക്യഭാഗങ്ങളിലും ‘ഒരിക്കലും ... ഇല്ല’ ഉപയോഗിക്കുക.
  alternative: ‘തീർച്ചയായും കൈവിടുകയോ ഉപേക്ഷിക്കുകയോ ഇല്ല’
  rationale: ആവർത്തിക്കുന്ന οὐ μή രൂപങ്ങൾ ഉറപ്പിനെ ശക്തമാക്കുന്നു. ഗ്രീക്ക് ഘടന യാന്ത്രികമായി പകർത്താതെ അതിന്റെ മുഴുവൻ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ രണ്ടിടത്തും പ്രകടമാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ പ്രബോധനശൈലി. ‘പണസ്നേഹമില്ലാത്തത്’ എന്ന കട്ടിയുള്ള സംയുക്തരൂപത്തിനു പകരം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ‘പണത്തോടുള്ള സ്നേഹത്തിൽനിന്ന് സ്വതന്ത്രമായ’ എന്നു നൽകി. ഉദ്ധരണിയിലെ ഏകവചന ‘നിന്നെ’ മൂലത്തിലെ σε നിലനിർത്തുന്നു.
