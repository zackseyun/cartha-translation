id: HEB.13.22
reference: Hebrews 13:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, ἀνέχεσθε τοῦ λόγου τῆς παρακλήσεως, καὶ γὰρ διὰ βραχέων ἐπέστειλα ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/022.yaml
  text: I urge you[a], brothers, bear with this word of exhortation[b], for I have written to you briefly.
translation:
  language: ml
  text: സഹോദരന്മാരേ[a], ഈ പ്രബോധനവചനം[b] ക്ഷമയോടെ സ്വീകരിക്കണമെന്ന് ഞാൻ നിങ്ങളോട് അഭ്യർഥിക്കുന്നു; കാരണം, ഞാൻ നിങ്ങൾക്കു ചുരുക്കമായിട്ടാണ് എഴുതിയത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സഹോദരീസഹോദരന്മാരേ.’ ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘സഹോദരന്മാരേ’ എന്നാണ്; ഈ സംബോധന മുഴുവൻ സഭയെയും ഉൾക്കൊള്ളുന്നതായിരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘പ്രബോധനവചനം’ എന്നത് ‘പ്രോത്സാഹനസന്ദേശം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: ഞാൻ നിങ്ങളോട് അഭ്യർഥിക്കുന്നു
  rationale: παρακαλέω ഇവിടെ ശ്രോതാക്കളോടുള്ള ആത്മാർഥമായ അഭ്യർഥനയാണ്. ‘അഭ്യർഥിക്കുന്നു’ എന്നത് അതിന്റെ ഗൗരവവും വ്യക്തിപരമായ അപേക്ഷയുടെ ഭാവവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: δέ ഇവിടെ ശക്തമായ വിരോധമല്ല, മൃദുവായ ആശയമാറ്റമാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ‘എന്നാൽ’ ചേർത്താൽ ഇല്ലാത്ത വിരോധം തോന്നാം; വാക്യക്രമം തന്നെ ഈ സമാപനാഭ്യർഥനയിലേക്കുള്ള മാറ്റം വ്യക്തമാക്കുന്നു.
- source_word: ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: സംബോധനരൂപത്തിലുള്ള ഗ്രീക്ക് പദം വ്യാകരണപരമായി പുല്ലിംഗ ബഹുവചനമാണ്. മുഖ്യപാഠം ആ രൂപം നിലനിർത്തുന്നു; മുഴുവൻ സഭയെയും ഉൾക്കൊള്ളുന്ന പ്രയോഗമായിരിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀνέχεσθε
  choice: ക്ഷമയോടെ സ്വീകരിക്കുക
  rationale: ἀνέχομαι എന്നതിന് സഹിക്കുക, ക്ഷമയോടെ അംഗീകരിക്കുക എന്നീ അർഥങ്ങളുണ്ട്. ഒരു സന്ദേശത്തോടുള്ള പ്രതികരണത്തെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ ‘ക്ഷമയോടെ സ്വീകരിക്കുക’ എന്നത് വെറും കേൾവിയേക്കാൾ വിശാലവും, ‘സഹിച്ചുകൊള്ളുക’ എന്നതിനെക്കാൾ സ്വാഭാവികവുമാണ്.
- source_word: τοῦ λόγου τῆς παρακλήσεως
  choice: ഈ പ്രബോധനവചനം
  rationale: λόγος ഇവിടെ അറിയിക്കപ്പെട്ട സന്ദേശത്തെയും παράκλησις പ്രബോധനം, പ്രോത്സാഹനം എന്നീ ബന്ധപ്പെട്ട ആശയങ്ങളെയും സൂചിപ്പിക്കുന്നു. ‘ഈ’ എന്നത് ഗ്രീക്കിൽ പ്രകടമായ സർവനാമമല്ലെങ്കിലും ഇപ്പോഴത്തെ രചനയിലേക്കുള്ള സൂചന മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: καὶ γὰρ
  choice: കാരണം
  rationale: ഈ പദസമുച്ചയം മുൻ അഭ്യർഥനയ്ക്കുള്ള വിശദീകരണകാരണം നൽകുന്നു. ‘കാരണം’ അതിന്റെ ബന്ധം മലയാളത്തിൽ അമിതമായി പദാനുപദമാക്കാതെ വ്യക്തമാക്കുന്നു.
- source_word: διὰ βραχέων
  choice: ചുരുക്കമായിട്ട്
  rationale: ഈ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം ‘ചുരുക്കമായി’ അല്ലെങ്കിൽ ‘കുറച്ചു വാക്കുകളിൽ’ എന്നാണ്. ‘ചുരുക്കമായിട്ട്’ സ്വാഭാവികവും രചനയുടെ ആപേക്ഷിക സംക്ഷിപ്തതയെ സൂചിപ്പിക്കുന്നതുമാണ്.
- source_word: ἐπέστειλα ὑμῖν
  choice: ഞാൻ നിങ്ങൾക്കു എഴുതിയത്
  rationale: ἐπιστέλλω ഇവിടെ എഴുതിയയയ്ക്കുക എന്ന കത്തുരൂപസന്ദർഭത്തിലെ അർഥത്തിലാണ്; ദാതൃവിഭക്തിയായ ὑμῖν സ്വീകർത്താക്കളെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ഭൂതകാലരൂപം ഗ്രീക്ക് aorist-ന്റെ സന്ദർഭപരമായ അർഥം നേരിട്ട് നൽകുന്നു.
theological_decisions:
- issue: ἀδελφοί എന്ന ലിംഗസൂചക സംബോധന
  choice: സഹോദരന്മാരേ
  alternative: സഹോദരീസഹോദരന്മാരേ / സഹോദരന്മാരും സഹോദരിമാരും
  rationale: ഗ്രീക്ക് പദത്തിന്റെ വ്യാകരണപരമായ പുല്ലിംഗരൂപം മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു. അതേസമയം ഇത് സ്ത്രീകളുൾപ്പെടെയുള്ള മുഴുവൻ സഭയെയും അഭിസംബോധന ചെയ്യുന്നതാകാമെന്ന യഥാർഥ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു; അങ്ങനെ പാഠത്തിന്റെ രൂപവും ഉൾക്കൊള്ളുന്ന പ്രയോഗസാധ്യതയും രണ്ടും നിലനിർത്തുന്നു.
- issue: παράκλησις എന്ന പദത്തിന്റെ ഭാവം
  choice: പ്രബോധനം
  alternative: പ്രോത്സാഹനം
  rationale: സന്ദർഭത്തിൽ രചനയുടെ ഉപദേശപരവും അഭ്യർഥനാപരവുമായ സ്വഭാവം ‘പ്രബോധനം’ നന്നായി പ്രകടിപ്പിക്കുന്നു. എന്നാൽ പദത്തിൽ പ്രോത്സാഹനത്തിന്റെ ഭാവവും ഉണ്ടാകുന്നതിനാൽ അത് അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി ഉപയോഗിച്ചു. ‘സഹിച്ചുകൊള്ളുക’ എന്ന കർക്കശമായ പദപ്രയോഗത്തിനു പകരം സന്ദേശത്തെ ക്ഷമയോടെ അംഗീകരിക്കുന്ന ഭാവമുള്ള ‘ക്ഷമയോടെ സ്വീകരിക്കുക’ തെരഞ്ഞെടുത്തു; മൂലപാഠത്തിലെ മൃദുവായ ആശയമാറ്റം മലയാളത്തിൽ അനാവശ്യ വിരോധബന്ധം ചേർക്കാതെ നിലനിർത്തി.
