id: HEB.13.6
reference: Hebrews 13:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὥστε θαρροῦντας ἡμᾶς λέγειν· Κύριος ἐμοὶ βοηθός, ⸀οὐ φοβηθήσομαι· τί ποιήσει μοι ἄνθρωπος;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/006.yaml
  text: so that we confidently say[a], “The Lord is my helper; I will not be afraid[b]. What can man do to me?”
translation:
  language: ml
  text: 'അതുകൊണ്ട് നമുക്ക് ധൈര്യത്തോടെ പറയാൻ കഴിയും: “കർത്താവാണ് എന്റെ സഹായി; ഞാൻ ഭയപ്പെടുകയില്ല. ഒരു മനുഷ്യന് എന്നോട് എന്തു ചെയ്യാൻ കഴിയും?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “ഒരു മനുഷ്യൻ എന്നോട് എന്തു ചെയ്യും?” ἄνθρωπος എന്ന ഗ്രീക്കുപദം ഇവിടെ ഒരു മനുഷ്യനെ പൊതുവായി സൂചിപ്പിക്കുന്ന ഏകവചനമാണ്; പുരുഷന്മാരെ മാത്രം ഉദ്ദേശിക്കുന്നതല്ല.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞതിൽനിന്നുള്ള ഫലമോ നിഗമനമോ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: θαρροῦντας ἡμᾶς λέγειν
  choice: നമുക്ക് ധൈര്യത്തോടെ പറയാം
  rationale: θαρροῦντας എന്നതിലെ ആത്മവിശ്വാസവും ധൈര്യവും നിലനിർത്തിക്കൊണ്ട് ഗ്രീക്ക് ഘടനയെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: Κύριος
  choice: കർത്താവ്
  rationale: ദൈവത്തെ സൂചിപ്പിക്കുന്ന κύριος എന്ന പദത്തിന്റെ നിലവാരമുള്ളതും ആദരസൂചകവുമായ മലയാളരൂപം.
- source_word: ἐμοὶ βοηθός
  choice: എന്റെ സഹായി
  rationale: ദാതൃവിഭക്തിയുടെ ‘എനിക്കുവേണ്ടിയുള്ള സഹായി’ എന്ന അർഥം മലയാളത്തിലെ സ്വാഭാവിക ഉടമസ്ഥപ്രയോഗത്തിലൂടെ നൽകുന്നു.
- source_word: οὐ φοβηθήσομαι
  choice: ഞാൻ ഭയപ്പെടുകയില്ല
  rationale: ഭാവികാലത്തിന്റെ അർഥം കൃത്യവും ഗൗരവമുള്ളതുമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τί ποιήσει μοι ἄνθρωπος
  choice: ഒരു മനുഷ്യന് എന്നോട് എന്തു ചെയ്യാൻ കഴിയും?
  rationale: ഭാവികാലരൂപത്തിലുള്ള വാചാടോപചോദ്യത്തിന്റെ ഉദ്ദേശ്യം—മനുഷ്യഭീഷണിയുടെ പരിമിതി—മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; ἄνθρωπος എന്ന ഏകവചന പൊതുപദവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἄνθρωπος എന്ന പൊതുവാചക ഏകവചനത്തിന്റെ വിവർത്തനം
  choice: ഒരു മനുഷ്യൻ
  alternative: ആർക്കെങ്കിലും
  rationale: മൂലത്തിലെ ഏകവചന പ്രതിനിധിപരമായ പ്രയോഗം നിലനിർത്തുന്നു; ഇവിടെ പുരുഷന്മാരെ മാത്രം ഉദ്ദേശിക്കുന്നില്ല.
- issue: ποιήσει എന്ന ഭാവികാലത്തിന്റെ വാചാടോപപരമായ ശക്തി
  choice: എന്തു ചെയ്യാൻ കഴിയും?
  alternative: എന്തു ചെയ്യും?
  rationale: രൂപപരമായി ‘ചെയ്യും’ എന്നാണെങ്കിലും, സന്ദർഭത്തിൽ ചോദ്യം മനുഷ്യന് ആത്യന്തികമായി ദോഷം വരുത്താൻ കഴിയില്ലെന്ന ധൈര്യം പ്രകടിപ്പിക്കുന്നു. ‘കഴിയും’ ആ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ഔപചാരിക രൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവവും വായനാസൗകര്യവും ഒരുമിക്കുന്ന മലയാളം. ഉദ്ധരണിയുടെ സങ്കീർത്തനസദൃശമായ ഉറച്ച പ്രഖ്യാപനഭാവം സംരക്ഷിച്ചിരിക്കുന്നു.
