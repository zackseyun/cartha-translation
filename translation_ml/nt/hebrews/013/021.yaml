  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καταρτίσαι ὑμᾶς ἐν ⸀παντὶ ἀγαθῷ εἰς τὸ ποιῆσαι τὸ θέλημα αὐτοῦ, ποιῶν ἐν ⸀ἡμῖν τὸ εὐάρεστον ἐνώπιον αὐτοῦ διὰ Ἰησοῦ Χριστοῦ, ᾧ ἡ δόξα εἰς τοὺς ⸀αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/021.yaml
  text: may he equip you in every good thing to do his will[a], working in us what is pleasing before him through Jesus the Messiah, to whom be the glory forever and ever. Amen.
translation:
  language: ml
  text: തന്റെ ഇഷ്ടം ചെയ്യേണ്ടതിന്, എല്ലാ നല്ല കാര്യങ്ങളിലും നിങ്ങളെ പ്രാപ്തരാക്കുകയും, യേശു മശീഹയിലൂടെ തന്റെ മുമ്പാകെ പ്രസാദകരമായതു നമ്മിൽ പ്രവർത്തിക്കുകയും ചെയ്യട്ടെ. അവിടത്തേക്കു[a] എന്നെന്നേക്കും മഹത്വം ഉണ്ടായിരിക്കട്ടെ. ആമേൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവിടത്തേക്കു’ എന്നത് പ്രത്യേകിച്ച് യേശു മശീഹയെ സൂചിപ്പിക്കാം; മറ്റു ചിലർ ഇത് ഈ പ്രാർഥനയുടെ വിഷയമായ സമാധാനത്തിന്റെ ദൈവത്തെ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: καταρτίσαι
  choice: സജ്ജരാക്കട്ടെ
  rationale: ആവശ്യമായ കഴിവും ഒരുക്കവും നൽകുക എന്ന പ്രാർഥനാഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἐν παντὶ ἀγαθῷ
  choice: സകല നന്മയിലും
  rationale: ἐν എന്നതിന്റെ രൂപം കാത്തുകൊണ്ട് ‘എല്ലാ നല്ല കാര്യങ്ങളിലും’ എന്ന വിശാലമായ അർഥം നൽകുന്നു; ‘സകല നല്ല വസ്തുക്കളാലും’ എന്ന് നിർബന്ധിച്ച് ഉപകരണാർഥം മാത്രം ചുമത്തുന്നില്ല.
- source_word: εἰς τὸ ποιῆσαι τὸ θέλημα αὐτοῦ
  choice: തന്റെ ഇഷ്ടം ചെയ്യാൻ
  rationale: ആർട്ടിക്കുലർ ഇൻഫിനിറ്റീവിന്റെ ഉദ്ദേശ്യാർഥം സംക്ഷിപ്തമായും നേരിട്ടും നൽകുന്നു.
- source_word: ποιῶν ἐν ἡμῖν
  choice: നമ്മിൽ പ്രവർത്തിച്ചുകൊണ്ട്
  rationale: ദൈവത്തിന്റെ തുടരുന്ന പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്ന participial ബന്ധവും ἐν ἡμῖν എന്ന ആന്തരിക പരിധിയും നിലനിർത്തുന്നു.
- source_word: τὸ εὐάρεστον ἐνώπιον αὐτοῦ
  choice: തന്റെ സന്നിധിയിൽ പ്രസാദകരമായത്
  rationale: ദൈവത്തിന്റെ മുമ്പാകെ പ്രസാദകരമായതെന്ന വിലയിരുത്തൽ നിലനിർത്തുന്ന സ്വാഭാവിക പ്രയോഗം.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: യേശു മശീഹയിലൂടെ
  rationale: Χριστός ഇവിടെ സ്ഥാനപ്പേരായതിനാൽ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി; διάയുടെ മാധ്യമാർഥം ‘യിലൂടെ’ നൽകുന്നു.
- source_word: ᾧ ἡ δόξα
  choice: അവിടത്തേക്കു മഹത്ത്വം ഉണ്ടായിരിക്കട്ടെ
  rationale: ആർക്കാണ് മഹത്ത്വം എന്ന ബന്ധം വ്യക്തമാക്കാതെ ഗ്രീക്കിലെ relative pronoun ഘടനയുടെ സന്ദർഭപരമായ ദ്വയാർഥത നിലനിർത്തുന്നു.
- source_word: εἰς τοὺς αἰῶνας
  choice: എന്നെന്നേക്കും
  rationale: അവസാനമില്ലാത്ത കാലദൈർഘ്യം വ്യക്തമാക്കുന്ന പതിവായ മലയാള ദൈവസ്തുതിപ്രയോഗം.
theological_decisions:
- issue: ᾧ (‘ആർക്കു/അവിടത്തേക്കു’) എന്ന ബന്ധസർവനാമത്തിന്റെ മുൻപദം
  choice: ‘അവിടത്തേക്കു’ എന്ന സർവനാമം ഉപയോഗിച്ച് മുൻപദം നിർണ്ണയിക്കാതെ വിട്ടു
  alternative: ഇത് അടുത്തായി പറഞ്ഞ യേശു മശീഹയെ സൂചിപ്പിക്കാം; അല്ലെങ്കിൽ പ്രാർഥനയുടെ വിഷയമായ സമാധാനത്തിന്റെ ദൈവത്തെ സൂചിപ്പിക്കാം
  rationale: ഗ്രീക്ക് വാക്യഘടന രണ്ടുവിധത്തിൽ മനസ്സിലാക്കാവുന്നതാണ്. വിവർത്തനം ഒന്നിനെ മാത്രം ഉറപ്പിക്കാതെ ആ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായും ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘അവിടന്ന്/അവിടത്തേക്കു’ എന്ന ആദരസൂചക രൂപം ദൈവത്തെക്കുറിച്ചുള്ള സന്ദർഭത്തിന് യോജിക്കുന്നു. ഗ്രീക്കിലെ participle മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ഉപവാക്യം മുഖ്യപ്രാർഥനയ്ക്കു മുമ്പായി ക്രമപ്പെടുത്തി.
