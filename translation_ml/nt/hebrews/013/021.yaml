revisions:
- from: യേശു മശീഹയിലൂടെ തന്റെ സന്നിധിയിൽ പ്രസാദകരമായത് നമ്മിൽ പ്രവർത്തിച്ചുകൊണ്ട്, തന്റെ ഇഷ്ടം ചെയ്യാൻ സകല നന്മയിലും അവിടന്ന് നിങ്ങളെ സജ്ജരാക്കട്ടെ. അവിടത്തേക്കു[a] എന്നെന്നേക്കും മഹത്ത്വം ഉണ്ടായിരിക്കട്ടെ. ആമേൻ.
  to: തന്റെ ഇഷ്ടം ചെയ്യേണ്ടതിന്, എല്ലാ നല്ല കാര്യങ്ങളിലും നിങ്ങളെ പ്രാപ്തരാക്കുകയും, യേശു മശീഹയിലൂടെ തന്റെ മുമ്പാകെ പ്രസാദകരമായതു നമ്മിൽ പ്രവർത്തിക്കുകയും ചെയ്യട്ടെ. അവിടത്തേക്കു[a] എന്നെന്നേക്കും മഹത്വം ഉണ്ടായിരിക്കട്ടെ. ആമേൻ.
