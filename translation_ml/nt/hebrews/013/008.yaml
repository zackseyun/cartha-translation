source:
  edition: SBLGNT
  text: Ἰησοῦς Χριστὸς ἐχθὲς καὶ σήμερον ὁ αὐτός, καὶ εἰς τοὺς αἰῶνας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/008.yaml
  text: Jesus the Messiah is the same yesterday and today and forever[a].
translation:
  language: ml
  text: മശീഹയായ യേശു ഇന്നലെയും ഇന്നും എന്നേക്കും അതേ വ്യക്തിയാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യേശുക്രിസ്തു ഇന്നലെയും ഇന്നും എന്നേക്കും അതേ വ്യക്തിയാണ്.” ഗ്രീക്കിലെ Χριστός എന്ന പദവി “ക്രിസ്തു” എന്നു ലിപ്യന്തരം ചെയ്യുകയോ “മശീഹ” എന്നു പരിഭാഷപ്പെടുത്തുകയോ ചെയ്യാം.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰησοῦς
  choice: യേശു
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ പ്രമാണികവും വ്യാപകവുമായ രൂപം.
- source_word: Χριστὸς
  choice: മശീഹ
  rationale: അഭിഷിക്തൻ എന്ന പദവിയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ശീർഷകം മലയാളത്തിൽ അർഥസൂചന നിലനിർത്തുന്ന പരിചിതമായ രൂപത്തിൽ നൽകി; വെറും കുടുംബപ്പേരായി വായിക്കപ്പെടാതിരിക്കാനും ഇത് സഹായിക്കുന്നു.
- source_word: ἐχθὲς
  choice: ഇന്നലെ
  rationale: കാലസൂചക ക്രിയാവിശേഷണത്തിന്റെ നേരിട്ടുള്ള സ്വാഭാവിക പരിഭാഷ.
- source_word: σήμερον
  choice: ഇന്നും
  rationale: ആവർത്തിക്കുന്ന καὶ ഉൾപ്പെടെ സമയക്രമത്തിന്റെ താളവും ഊന്നലും നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: ὁ αὐτός
  choice: ഒരേ ആൾതന്നെ
  rationale: വ്യക്തിയായ യേശുവിന്റെ തുടർച്ചയായ അതേ സ്വത്വം വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാള പ്രയോഗം; ഗ്രീക്കിൽ സൂചിതമായ സംയോജകക്രിയ മലയാളത്തിൽ വാക്യഘടനയിലൂടെ പ്രകടമാകുന്നു.
- source_word: εἰς τοὺς αἰῶνας
  choice: എന്നേക്കും
  rationale: എല്ലാ യുഗങ്ങളിലേക്കും നീളുന്ന ശാശ്വതതയെ വ്യക്തമാക്കുന്ന സാധാരണ ആധുനിക മലയാള പ്രയോഗം.
- source_word: καὶ ... καὶ ... καὶ
  choice: -യും ... -ഉം ... -ഉം
  rationale: ഗ്രീക്കിലെ ആവർത്തിച്ചുള്ള സംയോജകങ്ങളുടെ താളപരമായ ഊന്നൽ മലയാളത്തിലെ അനുബന്ധപ്രത്യയങ്ങളിലൂടെ നിലനിർത്തി.
theological_decisions:
- issue: കാലങ്ങളിലുടനീളം യേശുവിന്റെ മാറ്റമില്ലായ്മയെക്കുറിച്ചുള്ള ക്രിസ്തുശാസ്ത്രപരമായ പ്രസ്താവന
  choice: യേശു മശീഹ ഇന്നലെയും ഇന്നും എന്നേക്കും ഒരേ ആൾതന്നെയാണെന്ന് പാഠം പറയുന്നതത്രെ പരിഭാഷയിൽ വ്യക്തമാക്കി.
  alternative: ക്രിസ്തുവിന്റെ മാറ്റമില്ലായ്മയെയോ ദൈവത്വത്തെയോ കുറിച്ചുള്ള വിപുലമായ സിദ്ധാന്തവ്യാഖ്യാനം പരിഭാഷയിൽ ചേർക്കുക.
  rationale: ഗ്രീക്ക് വാക്യം യേശുവിന്റെ കാലാതീതമായ അതേ സ്വത്വത്തെ ഉറപ്പിക്കുന്നു; അതിൽനിന്നുള്ള ന്യായമായ ദൈവശാസ്ത്രനിഗമനങ്ങൾ പരിഭാഷയ്ക്കുള്ളിൽ വിശദീകരിക്കാതെ പാഠത്തിലെ സംക്ഷിപ്തതയും ദൈവശാസ്ത്രപരമായ തുറന്നതും സംരക്ഷിച്ചു.
- issue: Χριστός എന്ന പദത്തിന്റെ പേര്-പദവി സ്വഭാവം
  choice: പ്രധാന പാഠത്തിൽ പദവിയുടെ അർഥം മുന്നിൽ നിർത്തി “മശീഹ” എന്നു നൽകി.
  alternative: പരമ്പരാഗത ലിപ്യന്തരണമായ “ക്രിസ്തു” ഉപയോഗിക്കുക.
  rationale: സന്ദർഭത്തിൽ ഇത് യേശുവിനെ മശീഹാപദവിയാൽ തിരിച്ചറിയിക്കുന്നു. എന്നാൽ “ക്രിസ്തു” എന്ന പ്രമാണികമായ മറ്റൊരു രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ സംക്ഷിപ്തതയും ഇന്നലെ–ഇന്ന്–എന്നേക്കും എന്ന ത്രികാല താളവും നിലനിർത്തി; പാഠത്തിൽ ഇല്ലാത്ത സിദ്ധാന്തവികാസം ചേർത്തിട്ടില്ല.
