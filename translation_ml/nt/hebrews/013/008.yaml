revisions:
- from: യേശു മശീഹ ഇന്നലെയും ഇന്നും എന്നേക്കും ഒരേ ആൾതന്നെ.[a]
  to: മശീഹയായ യേശു ഇന്നലെയും ഇന്നും എന്നേക്കും അതേ വ്യക്തിയാണ്.[a]
  rationale: The revision replaces an informal identity expression with formal, natural modern Malayalam and uses an idiomatic title construction for Χριστός. It preserves the source’s compact statement, the yesterday–today–forever sequence, and the alternative ‘Christ’ rendering in the footnote.
  reviewer_model: gpt-5.6-terra
