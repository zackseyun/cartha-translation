id: HEB.13.16
reference: Hebrews 13:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τῆς δὲ εὐποιΐας καὶ κοινωνίας μὴ ἐπιλανθάνεσθε, τοιαύταις γὰρ θυσίαις εὐαρεστεῖται ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/016.yaml
  text: And do not neglect doing good and sharing[b][a], for with such sacrifices God is pleased.
translation:
  language: ml
  text: നന്മ ചെയ്യാനും പങ്കുവെക്കാനും[b] മറക്കരുത്[a]; കാരണം, ദൈവം ഇത്തരം യാഗങ്ങളിൽ പ്രസാദിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവഗണിക്കരുത്.’ ഗ്രീക്ക് ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘മറക്കരുത്’ എന്നാണെങ്കിലും, ഇവിടെ ഈ പ്രവൃത്തികൾ ചെയ്യാതിരിക്കരുത് എന്ന പ്രായോഗിക ഭാവവും അതിനുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: ‘പങ്കുവെക്കുക’ എന്നത് ‘കൂട്ടായ്മയിൽ പങ്കാളിയാകുക’ എന്നോ ‘ഉദാരമായി നൽകുക’ എന്നോ പരിഭാഷപ്പെടുത്താം; ഈ സന്ദർഭത്തിൽ മറ്റുള്ളവരുമായി വിഭവങ്ങൾ പ്രായോഗികമായി പങ്കിടുന്നതായിരിക്കാം പ്രധാനമായി ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐποιΐας
  choice: നന്മ ചെയ്യുക
  rationale: സജീവമായി നന്മ പ്രവർത്തിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന നാമരൂപത്തിന്റെ ക്രിയാത്മക ഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: κοινωνίας
  choice: പങ്കുവെക്കുക
  rationale: ഇവിടെ നന്മ ചെയ്യുന്നതിനോടു ചേർന്നു വരുന്നതിനാലും ഇവയെ ‘യാഗങ്ങൾ’ എന്നു വിളിക്കുന്നതിനാലും, മറ്റുള്ളവരുമായി വിഭവങ്ങൾ പ്രായോഗികമായി പങ്കിടുന്നതാണ് പ്രധാന സൂചന; അതേസമയം പദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
- source_word: μὴ ἐπιλανθάνεσθε
  choice: മറക്കരുത്
  rationale: ഗ്രീക്ക് ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്ന സ്വാഭാവികമായ പ്രബോധനശൈലി; കടമ നിർവഹിക്കാതിരിക്കുന്ന പ്രായോഗിക ഭാവവും സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: τοιαύταις ... θυσίαις
  choice: ഇത്തരം യാഗങ്ങളിൽ
  rationale: നന്മ ചെയ്യലിനെയും പങ്കുവെക്കലിനെയും ദൈവത്തിനു പ്രസാദകരമായ യാഗങ്ങളായി അവതരിപ്പിക്കുന്ന ആരാധനാപരമായ രൂപകം അതേപടി സൂക്ഷിക്കുന്നു.
- source_word: εὐαρεστεῖται
  choice: പ്രസാദിക്കുന്നു
  rationale: ദൈവം ഇത്തരം യാഗങ്ങളിൽ സന്തുഷ്ടനാകുന്നു എന്ന അർഥം dignified, സാധാരണ മലയാള പ്രയോഗത്തിൽ നൽകുന്നു.
- source_word: ὁ θεός
  choice: ദൈവം
  rationale: നാമനിർദേശക കർത്താവിന്റെ പതിവും വ്യക്തവുമായ മലയാള പരിഭാഷ.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: δέ ഇവിടെ ശക്തമായ വിരോധമല്ല, മുൻസന്ദർഭത്തോടുള്ള മൃദുവായ ബന്ധമാണ്; മലയാളത്തിലെ വാക്യപ്രവാഹം തന്നെ ആ ബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഈ വാക്യത്തിലെ ‘യാഗങ്ങളുടെ’ സ്വഭാവം
  choice: നന്മ ചെയ്യലും പങ്കുവെക്കലും ദൈവത്തിനു പ്രസാദകരമായ യാഗങ്ങളാണെന്ന രൂപകപ്രയോഗം
  alternative: ഇത് പ്രധാനമായും ദാനധർമ്മത്തെ മാത്രം സൂചിപ്പിക്കുന്നു; അല്ലെങ്കിൽ യാഗരൂപകമില്ലാത്ത പൊതുവായ ധാർമിക പെരുമാറ്റം മാത്രമാണ്
  rationale: ഗ്രീക്ക് പാഠം θυσίαις എന്ന യാഗപദം വ്യക്തമായി ഉപയോഗിക്കുന്നു. അതിനാൽ രൂപകം മായ്ച്ചുകളയാതെയും അതിനെ ദാനധർമ്മത്തിലേക്കു മാത്രം ചുരുക്കാതെയും പരിഭാഷ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ പ്രബോധനശൈലി. ‘യാഗങ്ങൾ’ എന്ന ആരാധനാപരമായ രൂപകം സംരക്ഷിച്ചു; ‘പങ്കുവെക്കുക’ എന്നതിന് ഉള്ള അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദങ്ങൾക്ക് പിന്നാലെ മുഖ്യപാഠത്തിൽ നൽകിയിരിക്കുന്നു.
