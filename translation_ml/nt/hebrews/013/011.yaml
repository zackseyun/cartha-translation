id: HEB.13.11
reference: Hebrews 13:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὧν γὰρ εἰσφέρεται ζῴων τὸ αἷμα περὶ ἁμαρτίας εἰς τὰ ἅγια διὰ τοῦ ἀρχιερέως, τούτων τὰ σώματα κατακαίεται ἔξω τῆς παρεμβολῆς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/011.yaml
  text: For the bodies of those animals whose blood is brought into the holy places for sin by the high priest are burned outside the camp[a][b].
translation:
  language: ml
  text: കാരണം, പാപത്തിനുവേണ്ടി മഹാപുരോഹിതൻ രക്തം വിശുദ്ധസ്ഥലങ്ങളിലേക്കു കൊണ്ടുചെല്ലുന്ന ആ മൃഗങ്ങളുടെ ശരീരങ്ങൾ പാളയത്തിനു പുറത്ത് ചുട്ടുകളയപ്പെടുന്നു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘വിശുദ്ധമന്ദിരത്തിലേക്കു.’ ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘വിശുദ്ധസ്ഥലങ്ങളിലേക്കു’ എന്നാണ്; വിശുദ്ധമന്ദിരമേഖലയെ സൂചിപ്പിക്കുന്ന ആരാധനാക്രമപരമായ പ്രയോഗമാണിത്.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘പൂർണമായി ചുട്ടുകളയപ്പെടുന്നു.’ ക്രിയയ്ക്ക് പൂർണമായി ദഹിപ്പിക്കുക എന്ന ഊന്നൽ ഉണ്ടായേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν ... ζῴων / τούτων τὰ σώματα
  choice: മൃഗങ്ങളുടെ ശരീരങ്ങൾ
  rationale: യാഗസന്ദർഭത്തിൽ ζῴων എന്നത് യാഗമൃഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ഗ്രീക്കിലെ ബന്ധവാക്യവും പുനരാരംഭഘടനയും മലയാളത്തിൽ സ്വാഭാവികമായി ഒരുമിപ്പിച്ചു.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തെ വിശദീകരിച്ചു ന്യായീകരിക്കുന്ന ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: εἰσφέρεται
  choice: കൊണ്ടുചെല്ലുന്ന
  rationale: രക്തം വിശുദ്ധമേഖലയിലേക്കു കൊണ്ടുപോകുന്ന കർമം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: τὸ αἷμα
  choice: രക്തം
  rationale: യാഗസംബന്ധമായ അക്ഷരാർഥം നിലനിർത്തുന്നു.
- source_word: περὶ ἁμαρτίας
  choice: പാപത്തിനുവേണ്ടി
  rationale: ഇത് പാപവുമായി ബന്ധപ്പെട്ട യാഗകർമമാണെന്ന അർഥം നിലനിർത്തുന്നു; ‘പാപയാഗമായി’ എന്നു പറഞ്ഞ് ഗ്രീക്കിനേക്കാൾ നിർദിഷ്ടമാക്കുന്നില്ല.
- source_word: εἰς τὰ ἅγια
  choice: വിശുദ്ധസ്ഥലങ്ങളിലേക്കു
  rationale: ഗ്രീക്കിലെ ബഹുവചനവും വിശുദ്ധമന്ദിരമേഖലയെ സൂചിപ്പിക്കുന്ന ആരാധനാക്രമപരമായ പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: διὰ τοῦ ἀρχιερέως
  choice: മഹാപുരോഹിതൻ
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന കർത്തൃത്വം മലയാളത്തിലെ സജീവ ബന്ധവാക്യത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: κατακαίεται
  choice: ദഹിപ്പിക്കപ്പെടുന്നു
  rationale: തീയിട്ട് ചുട്ടുകളയുന്ന യാഗകർമത്തെ മാന്യവും വ്യക്തവുമായ ഭാഷയിൽ നൽകുന്നു; പൂർണമായി ചുട്ടുതീർക്കുന്ന ശക്തമായ ഭാവം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: ἔξω τῆς παρεμβολῆς
  choice: പാളയത്തിനു പുറത്തുവെച്ചു
  rationale: ഇസ്രായേലിന്റെ പാളയത്തെയും കൂടാരാരാധനയുടെ പശ്ചാത്തലത്തെയും കൃത്യമായി പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: εἰς τὰ ἅγια എന്ന ആരാധനാക്രമപരമായ പ്രയോഗത്തിന്റെ പരിധി
  choice: വിശുദ്ധസ്ഥലങ്ങളിലേക്കു
  alternative: വിശുദ്ധമന്ദിരത്തിലേക്കു; അതിവിശുദ്ധസ്ഥലത്തേക്കു
  rationale: എബ്രായർ ലേഖനത്തിൽ τὰ ἅγια വിശുദ്ധമന്ദിരമേഖലയെ കുറിച്ച് കുറെയൊന്നു വഴക്കത്തോടെ ഉപയോഗിക്കുന്നു. ഇവിടെ ‘അതിവിശുദ്ധസ്ഥലം’ എന്നു മാത്രം നിർദിഷ്ടമാക്കാതെ ഗ്രീക്കിലെ ബഹുവചനവും അർഥവ്യാപ്തിയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആരാധനാക്രമപരമായ ശൈലി. ഗ്രീക്കിലെ നീണ്ട ബന്ധഘടന മലയാളവായനയ്ക്കായി സജീവ ബന്ധവാക്യമായി ക്രമപ്പെടുത്തി; അർഥത്തിലെ ബഹുവചനവും കർമബന്ധവും നിലനിർത്തി.
