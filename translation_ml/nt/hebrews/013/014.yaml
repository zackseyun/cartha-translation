  yaml_path: translation/nt/hebrews/013/014.yaml
  text: For we do not have a lasting city here[a], but we seek the one that is to come.
translation:
  language: ml
  text: കാരണം, നമുക്ക് ഇവിടെ നിലനിൽക്കുന്ന ഒരു നഗരം ഇല്ല; എന്നാൽ വരാനിരിക്കുന്ന നഗരത്തെയാണ് നാം അന്വേഷിക്കുന്നത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “വരുന്ന നഗരം” അല്ലെങ്കിൽ “വരാനുള്ള നഗരം.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ
  choice: ഇല്ലല്ലോ
  rationale: γάρ മുൻസന്ദർഭത്തിനുള്ള കാരണമോ വിശദീകരണമോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘-ല്ലോ’ സ്വാഭാവികമായി ആ വിശദീകരണബന്ധം പ്രകടമാക്കുന്നു. οὐ നിഷേധമായി നിലനിൽക്കുന്നു.
- source_word: ἔχομεν
  choice: നമുക്ക് ... ഇല്ല
  rationale: ‘നമുക്കുണ്ട്’ എന്ന ഉടമസ്ഥതാസംരചനയുടെ സ്വാഭാവിക നിഷേധരൂപം; ഗ്രീക്കിലെ വർത്തമാനകാല അർഥം സംരക്ഷിക്കുന്നു.
- source_word: ὧδε
  choice: ഇവിടെ
  rationale: സ്ഥലസൂചകമായ പദത്തിന്റെ നേരായ അർഥം നിലനിർത്തുന്നു; ‘ഭൂമിയിൽ’ എന്നു വ്യാഖ്യാനിച്ച് പരിധി ചുരുക്കുന്നില്ല.
- source_word: μένουσαν
  choice: നിലനിൽക്കുന്ന
  rationale: πόλιν എന്ന നാമത്തെ വിശേഷിപ്പിക്കുന്ന വർത്തമാന കർത്തൃവാചക കൃദന്തത്തിന്റെ ‘തുടർന്ന് നിലനിൽക്കുക/സ്ഥിരമായി ഇരിക്കുക’ എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: πόλιν
  choice: നഗരം
  rationale: മൂലപാഠത്തിലെ സാക്ഷാൽ നാമവും നഗരരൂപകവും നിലനിർത്തുന്നു; ‘സ്വദേശം’ പോലുള്ള വ്യാഖ്യാനപരമായ പദങ്ങൾ ഒഴിവാക്കുന്നു.
- source_word: ἀλλὰ
  choice: എന്നാൽ എന്ന ആശയം അർധവിരാമത്തിനുശേഷമുള്ള വിരുദ്ധഘടനയിലൂടെ
  rationale: മലയാളത്തിൽ ആദ്യഘടകത്തിലെ ‘ഇല്ലല്ലോ’യും രണ്ടാം ഘടകത്തിലെ ‘-ത്തെയാണു’ എന്ന ഊന്നലും ചേർന്ന് ശക്തമായ വൈരുധ്യം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τὴν μέλλουσαν
  choice: വരാനിരിക്കുന്ന നഗരത്തെ
  rationale: സ്ത്രീലിംഗ കൃദന്തം മുൻപുള്ള πόλιν എന്ന നാമത്തെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ നാമം ആവർത്തിച്ച് ഭാവിമുഖമായ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: ἐπιζητοῦμεν
  choice: നാം അന്വേഷിക്കുന്നു
  rationale: തുടർച്ചയായും ലക്ഷ്യബോധത്തോടെയും തേടുന്നതിനെ സൂചിപ്പിക്കുന്ന, ആധുനിക മലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമായ പ്രയോഗം.
theological_decisions:
- issue: ‘നഗരം’ എന്ന രൂപകത്തിന്റെ സ്വഭാവം
  choice: മൂലപാഠത്തിലെ ‘നഗരം’ എന്ന രൂപകം അതേപടി നിലനിർത്തുന്നു.
  alternative: ‘സ്വർഗം’, ‘സ്വർഗീയ നഗരം’, അല്ലെങ്കിൽ ‘സ്വർഗീയ യെരൂശലേം’ എന്നു വ്യക്തമാക്കുക.
  rationale: എബ്രായർ ലേഖനത്തിന്റെ വിശാലസന്ദർഭം സ്വർഗീയ നഗരത്തെക്കുറിച്ച് സംസാരിക്കുന്നുവെങ്കിലും ഈ വാക്യം അതിനെ സ്വർഗമെന്നോ യെരൂശലേമെന്നോ നേരിട്ട് പേരിടുന്നില്ല. അതിനാൽ പാഠത്തിന്റെ ഭാവിമുഖമായ നഗരരൂപകവും അതിലെ ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ഇല്ലല്ലോ’ γάρ സൂചിപ്പിക്കുന്ന വിശദീകരണബന്ധം ലളിതമായി നൽകുന്നു; ‘നഗരം’ എന്ന മൂലരൂപകം വ്യാഖ്യാനിച്ച് മാറ്റിയിട്ടില്ല. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വാക്യഭാഗത്തിനു ശേഷം നൽകിയിരിക്കുന്നു.
