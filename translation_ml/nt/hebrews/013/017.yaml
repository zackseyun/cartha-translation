id: HEB.13.17
reference: Hebrews 13:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Πείθεσθε τοῖς ἡγουμένοις ὑμῶν καὶ ὑπείκετε, αὐτοὶ γὰρ ἀγρυπνοῦσιν ὑπὲρ τῶν ψυχῶν ὑμῶν ὡς λόγον ἀποδώσοντες, ἵνα μετὰ χαρᾶς τοῦτο ποιῶσιν καὶ μὴ στενάζοντες, ἀλυσιτελὲς γὰρ ὑμῖν τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/017.yaml
  text: Be persuaded by your leaders and yield to them[a], for they are keeping watch over your souls as those who will give an account, so that they may do this with joy and not with groaning, for this would be unprofitable for you.
translation:
  language: ml
  text: നിങ്ങളുടെ നേതാക്കളുടെ വാക്ക് കേട്ട് അവർക്കു വഴങ്ങുക[a]. കണക്കു കൊടുക്കേണ്ടവരെന്ന നിലയിൽ അവർ നിങ്ങളുടെ ആത്മാക്കൾക്കുവേണ്ടി ജാഗ്രത പുലർത്തുന്നു. അവർ ഈ ദൗത്യം സന്തോഷത്തോടെയും നെടുവീർപ്പിടാതെയും ചെയ്യേണ്ടതിന് അങ്ങനെ ചെയ്യുക; അല്ലെങ്കിൽ അത് നിങ്ങൾക്കു പ്രയോജനകരമായിരിക്കുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നിങ്ങളുടെ നേതാക്കളെ അനുസരിക്കുകയും അവർക്കു വഴങ്ങുകയും ചെയ്യുക.” ഗ്രീക്കിലെ Πείθεσθε എന്ന പദത്തിന് ‘അനുസരിക്കുക’ എന്ന അർഥം വരാം; എന്നാൽ കൂടുതൽ അക്ഷരാർഥത്തിൽ, അവരുടെ വാക്കിൽ ‘ബോധ്യപ്പെടുക’ എന്ന ആശയവും അതിലുണ്ട്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πείθεσθε
  choice: വാക്കു കേട്ട്
  rationale: മധ്യ/കർമണി ആജ്ഞാരൂപത്തിന് ‘ബോധ്യപ്പെടുക, അനുസരിക്കുക’ എന്നീ അർഥങ്ങൾ വരാം. മലയാളത്തിലെ ‘വാക്കു കേൾക്കുക’ നേതാക്കളുടെ പ്രേരണയോട് വിശ്വാസപൂർവം പ്രതികരിക്കുന്നതും അനുസരിക്കുന്നതുമായ ആശയം സ്വാഭാവികമായി നൽകുന്നു; വെറും അധികാരപരമായ കല്പനാനുസരണം എന്നതിലേക്കു ചുരുക്കുന്നില്ല.
- source_word: ἡγουμένοις
  choice: നേതാക്കൾ
  rationale: സമൂഹത്തിൽ അംഗീകരിക്കപ്പെട്ട് നേതൃത്വം നൽകുന്നവരെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്. ‘നേതാക്കൾ’ ആധുനികവും സ്വാഭാവികവുമാണ്; മൂലപദത്തേക്കാൾ ശക്തമായ ഭരണാധികാരഭാവം ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: ὑπείκετε
  choice: വഴങ്ങുക
  rationale: വിട്ടുകൊടുക്കുക, വഴങ്ങുക, കീഴൊതുങ്ങുക എന്ന ആശയം നൽകുന്നു. ആദ്യ ക്രിയയുമായി ലയിപ്പിക്കാതെ അതിനോടൊപ്പം വരുന്ന മനോഭാവം നിലനിർത്തുന്നു.
- source_word: ἀγρυπνοῦσιν
  choice: ജാഗരിച്ചുകൊണ്ടിരിക്കുന്നു
  rationale: ഉറക്കമൊഴിഞ്ഞുള്ള സൂക്ഷ്മജാഗ്രതയുടെ ദൃശ്യഭാവം സംരക്ഷിക്കുകയും ഇടയപരമായ കരുതൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ψυχῶν
  choice: ആത്മാക്കൾ
  rationale: ψυχήയ്ക്ക് ജീവൻ, വ്യക്തി, ആത്മാവ് എന്നീ അർഥങ്ങൾ ഉണ്ടെങ്കിലും ഇവിടെ ‘ആത്മാക്കൾ’ പ്രയോഗത്തിന്റെ ആത്മീയ ഗൗരവം സംരക്ഷിക്കുന്നു; സമഗ്ര വ്യക്തിയോടുള്ള കരുതൽ അതുവഴി നിഷേധിക്കപ്പെടുന്നില്ല.
- source_word: ὡς λόγον ἀποδώσοντες
  choice: കണക്കു ബോധിപ്പിക്കേണ്ടവരെന്ന നിലയിൽ
  rationale: ഭാവിയിൽ കണക്കു നൽകേണ്ട നേതാക്കളുടെ ഉത്തരവാദിത്വം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ആരോടാണ് കണക്കു നൽകുന്നതെന്ന് മൂലവാക്യം വ്യക്തമാക്കാത്തതിനാൽ ‘ദൈവത്തോട്’ എന്നു വാചകത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: μετὰ χαρᾶς
  choice: സന്തോഷത്തോടെ
  rationale: മലയാളത്തിൽ സ്വാഭാവികമായി ക്രിയയെ വിശേഷിപ്പിക്കുകയും ഗ്രീക്കിലെ സന്തോഷത്തിന്റെ ഭാവം നേരിട്ട് നൽകുകയും ചെയ്യുന്നു.
- source_word: στενάζοντες
  choice: ഞരങ്ങിക്കൊണ്ട്
  rationale: ദുഃഖം എന്ന അമൂർത്ത പദത്തിലേക്കു മാറ്റാതെ στενάζω എന്നതിലെ ഞരക്കം/നെടുവീർപ്പ് എന്ന മൂർത്തഭാവം നിലനിർത്തുന്നു.
- source_word: ἀλυσιτελές
  choice: പ്രയോജനകരമായിരിക്കില്ല
  rationale: ‘ഗുണകരമല്ല, പ്രയോജനമില്ല’ എന്ന അർഥം കൃത്യമായി നൽകുന്നു; ‘ദോഷകരം’ എന്നു വിവർത്തനം ചെയ്യുന്നത് മൂലത്തിന്റെ ശക്തി അനാവശ്യമായി കൂട്ടും.
theological_decisions:
- issue: സഭാനേതാക്കളോടുള്ള ആഹ്വാനത്തിന്റെ സ്വഭാവം
  choice: അംഗീകരിക്കപ്പെട്ട നേതാക്കളുടെ വാക്കിനോട് വിശ്വാസപൂർവം പ്രതികരിച്ച് അവർക്കു വഴങ്ങാനുള്ള ആഹ്വാനം
  alternative: നേതാക്കൾക്ക് നിരുപാധികമായ സമ്പൂർണ അനുസരണം നൽകാനുള്ള ശക്തമായ കല്പന
  rationale: Πείθεσθε, ὑπείκετε എന്നീ രണ്ടു ക്രിയകൾ വിശ്വാസപൂർവമായ അനുസരണവും വഴങ്ങലും സൂചിപ്പിക്കുന്നു; എന്നാൽ പരിധിയില്ലാത്ത അധികാരാനുസരണം വിവർത്തനത്തിൽ സ്ഥാപിക്കേണ്ടതില്ല. നേതാക്കൾ തന്നെയും കണക്കു ബോധിപ്പിക്കേണ്ടവരാണെന്ന കാരണവാക്യം അവരുടെ ഉത്തരവാദിത്വം ഊന്നുന്നു.
- issue: ἵνα ഉപവാക്യത്തിന്റെ പ്രായോഗിക ലക്ഷ്യം
  choice: വിശ്വാസികളുടെ പ്രതികരണം നേതാക്കൾക്ക് തങ്ങളുടെ ജാഗ്രതാപരമായ ദൗത്യം സന്തോഷത്തോടെ, ഞരങ്ങാതെ നിർവഹിക്കാൻ ഇടയാക്കണം
  alternative: നേതാക്കളുടെ സന്തോഷം തന്നെയാണ് അനുസരണത്തിന്റെ അന്തിമവും സ്വതന്ത്രവുമായ ലക്ഷ്യം
  rationale: ‘ഇതു ചെയ്യുക’ എന്നത് തൊട്ടുമുമ്പുള്ള ആത്മാക്കൾക്കുവേണ്ടിയുള്ള ജാഗ്രതയെ സൂചിപ്പിക്കുന്നു; അവസാന കാരണം അതു വിശ്വാസികൾക്കുതന്നെ പ്രയോജനകരമാണെന്നതിലാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ‘വാക്കു കേട്ട്’ എന്ന സ്വാഭാവിക പ്രയോഗം ബന്ധപരമായ അനുസരണം സൂചിപ്പിക്കുന്നു; സാധ്യതയുള്ള നേരിട്ടുള്ള ‘അനുസരിക്കുക’ എന്ന വിവർത്തനം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിട്ടുണ്ട്. ഓരോ നേതാവിനെയും ഒറ്റയ്ക്ക് അഭിസംബോധന ചെയ്യുന്നതല്ലാത്തതിനാൽ ബഹുവചനരൂപങ്ങൾ ഉപയോഗിച്ചു.
