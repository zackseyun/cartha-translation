id: HEB.13.9
reference: Hebrews 13:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διδαχαῖς ποικίλαις καὶ ξέναις μὴ παραφέρεσθε· καλὸν γὰρ χάριτι βεβαιοῦσθαι τὴν καρδίαν, οὐ βρώμασιν, ἐν οἷς οὐκ ὠφελήθησαν οἱ ⸀περιπατοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/009.yaml
  text: Do not be carried away by various and strange teachings[a], for it is good for the heart to be strengthened by grace, not by foods[c][b], by which those who occupied themselves with them were not benefited.
translation:
  language: ml
  text: പലതരത്തിലുള്ളതും അന്യവുമായ ഉപദേശങ്ങളാൽ വഴിതെറ്റിക്കപ്പെടരുത്. എന്തെന്നാൽ, ഭക്ഷണങ്ങളാലല്ല, കൃപയാൽ ഹൃദയം ഉറപ്പിക്കപ്പെടുന്നതാണ് നല്ലത്.[a] അവയിൽ ഏർപ്പെട്ടവർക്ക് അവയാൽ പ്രയോജനം ലഭിച്ചില്ല.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കൃപയാൽ ഹൃദയം ശക്തിപ്പെടുന്നതാണ് നല്ലത്.” ഗ്രീക്ക് ക്രിയയ്ക്ക് “ഉറപ്പിക്കുക,” “ദൃഢമാക്കുക,” “ശക്തിപ്പെടുത്തുക” എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ അക്ഷരാർഥം “ഭക്ഷണങ്ങൾ” എന്നും “അവയിൽ നടന്നവർ” എന്നും ആണ്. ഇവിടെ “അവയിൽ നടന്നവർ” എന്നത് ഭക്ഷണങ്ങളുമായി ബന്ധപ്പെട്ട കാര്യങ്ങളിൽ ജീവിക്കുകയോ അവയിൽ ഏർപ്പെടുകയോ ചെയ്തവരെ സൂചിപ്പിക്കാം; ഏതു പ്രത്യേക ആചാരങ്ങളാണെന്ന് വാക്യം വ്യക്തമാക്കുന്നില്ല.
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: διδαχαῖς ποικίλαις καὶ ξέναις
  choice: വിവിധവും അപരിചിതവുമായ ഉപദേശങ്ങളാൽ
  rationale: ποικίλαις എന്നതിന്റെ വൈവിധ്യവും ξέναις എന്നതിന്റെ സ്വന്തമല്ലാത്തതോ പരിചിതമായ സന്ദേശത്തിൽപ്പെടാത്തതോ ആയ ഭാവവും നിലനിർത്തുന്നു; ‘അപരിചിതമായ’ എന്നത് വംശീയമോ ഭൂമിശാസ്ത്രപരമോ ആയ അർഥം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: μὴ παραφέρεσθε
  choice: വഴിതെറ്റിക്കപ്പെടരുത്
  rationale: നിഷ്ക്രിയരൂപത്തിലുള്ള മുന്നറിയിപ്പും ശരിയായ പാതയിൽനിന്ന് കൊണ്ടുപോകപ്പെടുന്ന ആശയവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: χάριτι
  choice: കൃപയാൽ
  rationale: ദത്തിവ് ഇവിടെ മാർഗമോ കാരണമോ സൂചിപ്പിക്കുന്നു; θεολογികമായി പ്രാധാന്യമുള്ള ‘കൃപ’ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: βεβαιοῦσθαι τὴν καρδίαν
  choice: ഹൃദയം ഉറപ്പിക്കപ്പെടുന്നതാണ്
  rationale: βεβαιόω എന്നതിലെ ഉറപ്പിക്കുക, ദൃഢമാക്കുക എന്നീ അർഥങ്ങൾ ഉൾക്കൊള്ളുന്നു; καρδίαയെ ‘ഹൃദയം’ എന്നു തന്നെ നിലനിർത്തുന്നു.
- source_word: οὐ βρώμασιν
  choice: ഭക്ഷണങ്ങളാലല്ല
  rationale: βρώμασιν എന്ന പദത്തെ വ്യാഖ്യാനപരമായി ‘നിയമങ്ങൾ’ എന്നു വിപുലീകരിക്കാതെ നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: ἐν οἷς ... οἱ περιπατοῦντες
  choice: അത്തരം ഭക്ഷണാചാരങ്ങളിൽ ഏർപ്പെട്ടവർ
  rationale: അക്ഷരാർഥമായ ‘അവയിൽ നടന്നവർ’ മലയാളത്തിൽ അവ്യക്തമാണ്. സന്ദർഭത്തിലെ ജീവിതരീതിയോ അനുഷ്ഠാനപരമായ ഏർപ്പെടലോ സ്വാഭാവികമായി അറിയിക്കുന്നു; ‘ഭക്ഷണാചാരങ്ങൾ’ എന്ന വിശദീകരണം അടിക്കുറിപ്പിലൂടെ സുതാര്യമാക്കുന്നു.
- source_word: οὐκ ὠφελήθησαν
  choice: യാതൊരു പ്രയോജനവും ഉണ്ടായിട്ടില്ല
  rationale: അവർക്ക് ഗുണം ലഭിച്ചില്ല എന്ന നിഷ്ക്രിയ ആശയം സ്വാഭാവികവും ശക്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ‘ഭക്ഷണങ്ങൾ’ എന്നതിന്റെ കൃത്യമായ സൂചനയും കൃപയുമായുള്ള വൈരുധ്യവും
  choice: പ്രധാന വാക്യത്തിൽ ‘ഭക്ഷണങ്ങൾ’ എന്ന ഗ്രീക്ക് പദം നിലനിർത്തി, അവസാന ഉപവാക്യത്തിൽ അതുമായി ബന്ധപ്പെട്ട ആചാരപരമായ ഏർപ്പെടൽ വ്യക്തമാക്കുന്നു.
  alternative: ഇത് യാഗഭോജനങ്ങൾ മാത്രമെന്നോ യഹൂദ ഭക്ഷണനിയമങ്ങൾ മുഴുവനെന്നോ നിർണയിക്കുക.
  rationale: സന്ദർഭം ഭക്ഷണവുമായി ബന്ധപ്പെട്ട അനുഷ്ഠാനങ്ങളെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, ഗ്രീക്ക് പദം അവയുടെ പരിധി കൃത്യമായി നിർണയിക്കുന്നില്ല; അതിനാൽ പ്രത്യേക മതക്രമം പരിഭാഷയിൽ ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: ‘ഹൃദയം’ എന്ന രൂപകത്തിന്റെ ശക്തി
  choice: ഹൃദയം
  alternative: മനസ്സ്; ആന്തരികജീവിതം
  rationale: καρδίαയുടെ ബൈബിൾപരവും മാനവശാസ്ത്രപരവുമായ ഭാരം സംരക്ഷിക്കുകയും വ്യാഖ്യാനപരമായ ചുരുക്കം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- issue: βεβαιοῦσθαι എന്ന ക്രിയയുടെ അർഥവ്യാപ്തി
  choice: ഉറപ്പിക്കപ്പെടുക
  alternative: ശക്തിപ്പെടുക; ദൃഢമാക്കപ്പെടുക
  rationale: ക്രിയയിൽ ‘സ്ഥിരമാക്കുക’ എന്നും ‘ബലപ്പെടുത്തുക’ എന്നും ഉള്ള സമീപ അർഥങ്ങൾ നിലനിൽക്കുന്നു; പ്രധാന പാഠത്തിൽ ‘ഉറപ്പിക്കപ്പെടുക’ സ്വാഭാവികവും പ്രസക്തവുമാണ്, പകരം വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വായനാസൗകര്യവും തുലനം ചെയ്തു. ‘കൃപ,’ ‘ഹൃദയം,’ ‘ഭക്ഷണങ്ങൾ’ എന്നീ മുഖ്യ ബൈബിൾപദങ്ങൾ നിലനിർത്തി; അസ്വാഭാവികമായ അക്ഷരപരിഭാഷ അവസാന ഉപവാക്യത്തിൽ ഒഴിവാക്കി, യഥാർത്ഥ രൂപവും അവ്യക്തതയും അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
