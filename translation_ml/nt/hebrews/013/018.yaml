  text: Προσεύχεσθε περὶ ἡμῶν, ⸀πειθόμεθα γὰρ ὅτι καλὴν συνείδησιν ἔχομεν, ἐν πᾶσιν καλῶς θέλοντες ἀναστρέφεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/018.yaml
  text: Pray for us[a], for we are convinced that we have a good conscience[c][b], since we want to conduct ourselves well in everything.
translation:
  language: ml
  text: ഞങ്ങൾക്കുവേണ്ടി പ്രാർഥിക്കുക. കാരണം, ഞങ്ങൾക്കു നല്ല മനസ്സാക്ഷിയുണ്ടെന്ന്[b] ഞങ്ങൾക്കു ബോധ്യമുണ്ട്[a]; എല്ലാക്കാര്യങ്ങളിലും നന്നായി പെരുമാറാൻ ആഗ്രഹിച്ചുകൊണ്ട്[c] ഞങ്ങൾ ജീവിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഞങ്ങൾ ബോധ്യപ്പെട്ടിരിക്കുന്നു,’ ‘ഞങ്ങൾക്ക് ഉറപ്പുണ്ട്,’ അല്ലെങ്കിൽ ‘ഞങ്ങൾക്കു ദൃഢവിശ്വാസമുണ്ട്.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘തെളിഞ്ഞ മനസ്സാക്ഷി.’
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘എല്ലാക്കാര്യങ്ങളിലും മാന്യമായി പെരുമാറാൻ ആഗ്രഹിച്ചുകൊണ്ട്.’
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: Προσεύχεσθε
  choice: പ്രാർഥിക്കുക
  rationale: വർത്തമാനകാല ബഹുവചന ആജ്ഞാരൂപം. തുടർച്ചയുടെ ഭാവം സന്ദർഭത്തിൽ ഉൾക്കൊള്ളാമെങ്കിലും, മുഖ്യവാചകത്തിൽ അത് പ്രത്യേകം ചേർക്കുന്നത് അതിവിവർത്തനമാകും.
- source_word: περὶ ἡμῶν
  choice: ഞങ്ങൾക്കുവേണ്ടി
  rationale: പ്രാർഥനയോടൊപ്പം περί + genitive എന്ന പ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാളം ‘വേണ്ടി’ എന്നാണ്.
- source_word: πειθόμεθα
  choice: ഞങ്ങൾക്കു ബോധ്യമുണ്ട്
  rationale: എഴുത്തുകാരുടെ ഉറച്ച ആന്തരിക ബോധ്യം വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം; ‘ഉറപ്പുണ്ട്’ എന്നതും സാധ്യമാണ്.
- source_word: καλὴν συνείδησιν
  choice: നല്ല മനസ്സാക്ഷി
  rationale: വിശേഷണവും നാമവും നേരിട്ട് സംരക്ഷിക്കുന്നു. ‘കുറ്റമില്ലാത്ത മനസ്സാക്ഷി’ കൂടുതൽ വ്യാഖ്യാനാത്മകമാണ്.
- source_word: ἐν πᾶσιν
  choice: എല്ലാക്കാര്യങ്ങളിലും
  rationale: സമഗ്രത സൂചിപ്പിക്കുന്ന സ്വാഭാവിക ആധുനിക മലയാളം.
- source_word: καλῶς
  choice: നന്നായി
  rationale: ജീവിതരീതിയെ വിശാലമായി വിശേഷിപ്പിക്കുന്ന ക്രിയാവിശേഷണം; ‘മാന്യമായി’ എന്നത് സാധ്യമെങ്കിലും കൂടുതൽ നിർവചനാത്മകമാണ്.
- source_word: θέλοντες
  choice: ഞങ്ങൾ ആഗ്രഹിക്കുന്നതിനാൽ
  rationale: വർത്തമാനകാല കൃദന്തരൂപത്തെ മലയാളത്തിൽ വ്യക്തമായ വിശദീകരണ/കാരണബന്ധത്തോടെ അവതരിപ്പിക്കുന്നു.
- source_word: ἀναστρέφεσθαι
  choice: ജീവിക്കാൻ
  rationale: ഇവിടെ ക്രിയ ഒരാളുടെ ജീവിതരീതിയെയോ പെരുമാറ്റത്തെയോ സൂചിപ്പിക്കുന്നു. ‘ജീവിക്കാൻ’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും അർത്ഥവ്യാപ്തിയുള്ളതുമാണ്.
theological_decisions:
- issue: അവസാന കൃദന്തവാക്യഭാഗവും നല്ല മനസ്സാക്ഷിയെന്ന അവകാശവാദവും തമ്മിലുള്ള ബന്ധം
  choice: ‘എല്ലാക്കാര്യങ്ങളിലും നന്നായി ജീവിക്കാൻ ഞങ്ങൾ ആഗ്രഹിക്കുന്നതിനാൽ’ എന്ന വിശദീകരണ/കാരണബന്ധം
  alternative: ‘എല്ലാക്കാര്യങ്ങളിലും നന്നായി ജീവിക്കാൻ ആഗ്രഹിച്ചുകൊണ്ട്’ എന്ന കൂടുതൽ രൂപപരമായ ബന്ധം
  rationale: θέλοντες എന്ന കൃദന്തത്തിന്റെ ബന്ധം ഗ്രീക്കിൽ പൂർണമായി നിർവചിക്കപ്പെട്ടിട്ടില്ല. മുഖ്യവാചകത്തിൽ സ്വാഭാവിക മലയാളത്തിനായി വിശദീകരണ/കാരണഭാവം നൽകിയെങ്കിലും, പാപരാഹിത്യത്തെക്കുറിച്ചുള്ള ശക്തമായ അവകാശവാദം ചേർത്തിട്ടില്ല; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്ക് വാക്യത്തിന്റെ തർക്കബന്ധം വ്യക്തമാക്കുമ്പോഴും അതിലെ സാധ്യതാപരമായ വ്യത്യാസങ്ങൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
