    rationale: Place the anchors after their corresponding expressions in normal order. ‘തെളിഞ്ഞ മനസ്സാക്ഷി’ more closely represents the intended lexical alternative than ‘കുറ്റബോധമില്ലാത്ത മനസ്സാക്ഷി.’
  revised_text: ഞങ്ങൾക്കുവേണ്ടി പ്രാർഥിക്കുക. കാരണം, ഞങ്ങൾക്കു നല്ല മനസ്സാക്ഷിയുണ്ടെന്ന്[b] ഞങ്ങൾക്കു ബോധ്യമുണ്ട്[a]; എല്ലാക്കാര്യങ്ങളിലും നന്നായി പെരുമാറാൻ ആഗ്രഹിച്ചുകൊണ്ട്[c] ഞങ്ങൾ ജീവിക്കുന്നു.
