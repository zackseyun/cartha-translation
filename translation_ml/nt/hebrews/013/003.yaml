id: HEB.13.3
reference: Hebrews 13:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μιμνῄσκεσθε τῶν δεσμίων ὡς συνδεδεμένοι, τῶν κακουχουμένων ὡς καὶ αὐτοὶ ὄντες ἐν σώματι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/003.yaml
  text: Remember those in prison[a], as though imprisoned with them; those who are mistreated[b], since you yourselves also are in the body.
translation:
  language: ml
  text: തടവിലായവരെ, നിങ്ങളും അവരോടൊപ്പം ബന്ധിക്കപ്പെട്ടിരിക്കുന്നതുപോലെ ഓർക്കുക; ദുഷ്പെരുമാറ്റം അനുഭവിക്കുന്നവരെ, നിങ്ങളും ശരീരത്തിലുള്ളവരായിരിക്കെ ഓർക്കുക.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ശരീരത്തിൽ” എന്നത് സാധാരണ മനുഷ്യരുടെ ശരീരപരമായ ദൗർബല്യവും കഷ്ടപ്പാടിനോടുള്ള തുറന്നുനിൽപ്പും പങ്കിടുന്നതിനെ സൂചിപ്പിക്കാനാണ് കൂടുതൽ സാധ്യത. ക്രിസ്തുവിന്റെ ശരീരത്തിൽ ഉൾപ്പെട്ടിരിക്കുന്നതിന്റെ സൂചനയായും ചിലർ ഇതു മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: μιμνῄσκεσθε
  choice: ഓർക്കുക
  rationale: വർത്തമാനകാല ആജ്ഞയുടെ തുടർച്ചയായ കരുതലും അനുസ്മരണവും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ആവർത്തിച്ചു കൊണ്ടിരിക്കുക എന്ന ആശയം അതിരുകടന്ന് വ്യക്തമാക്കുന്നില്ല.
- source_word: τῶν δεσμίων
  choice: തടവിലായവരെ
  rationale: δέσμιος എന്നത് ബന്ധനത്തിലുള്ളവനെയോ തടവുകാരനെയോ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ പ്രയോഗമാണിത്.
- source_word: ὡς συνδεδεμένοι
  choice: അവരോടൊപ്പം ബന്ധിക്കപ്പെട്ടവരെപ്പോലെ
  rationale: συνδέομαι എന്ന പദത്തിലെ ‘ഒരുമിച്ചു ബന്ധിക്കപ്പെടുക’ എന്ന മൂർത്തമായ ദൃശ്യവും തടവുകാരോടുള്ള ഐക്യദാർഢ്യവും സംരക്ഷിക്കുന്നു.
- source_word: τῶν κακουχουμένων
  choice: ദുഷ്പെരുമാറ്റം അനുഭവിക്കുന്നവരെ
  rationale: മറ്റുള്ളവരാൽ ഏൽപ്പിക്കപ്പെടുന്ന പീഡനമോ മോശമായ പെരുമാറ്റമോ എന്ന നിഷ്ക്രിയ അർഥം ലളിതമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὡς καὶ αὐτοὶ ὄντες ἐν σώματι
  choice: നിങ്ങളും ശരീരത്തിലാണല്ലോ എന്ന ബോധത്തോടെ
  rationale: ἐν σώματι എന്ന ‘ശരീരത്തിൽ’ എന്ന രൂപം നിലനിർത്തുകയും ὡς എന്നതിന്റെ പ്രേരണാത്മക ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു; ശരീരത്തിന്റെ ദൗർബല്യം പങ്കിടുന്നു എന്ന പ്രധാന സൂചനയെ പൂർണമായി വ്യാഖ്യാനിച്ച് അടച്ചുപൂട്ടുന്നില്ല.
theological_decisions:
- issue: ἐν σώματι (‘ശരീരത്തിൽ’) എന്നതിന്റെ അർഥം
  choice: പൊതുവായ മനുഷ്യശരീരാവസ്ഥയും അതിനോടൊപ്പമുള്ള ദൗർബല്യവും
  alternative: ക്രിസ്തുവിന്റെ ശരീരത്തിലെ അംഗത്വം
  rationale: തടവിലായവരോടും പീഡിതരോടും സഹാനുഭൂതി കാണിക്കാനുള്ള ആഹ്വാനമാണ് സന്ദർഭം; അതിനാൽ പങ്കിട്ട ശരീരപരമായ ദൗർബല്യമാണ് ഏറ്റവും സ്വാഭാവികമായ അർഥം. എന്നിരുന്നാലും ‘ശരീരത്തിൽ’ എന്ന പദരൂപം നിലനിർത്തുന്നതിനാൽ സഭാസംബന്ധമായ അനുരണനം തള്ളിക്കളയുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ ബന്ധനദൃശ്യം മുഖ്യവാചകത്തിൽ സംരക്ഷിച്ചിരിക്കുന്നു. ഒരേയൊരു അടിക്കുറിപ്പ് ദൈവശാസ്ത്രപരമായ യഥാർഥ അനിശ്ചിതത്വം മാത്രം രേഖപ്പെടുത്തുന്നു.
