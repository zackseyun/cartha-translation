revisions:
- from: തടവിലായവരെ, അവരോടൊപ്പം ബന്ധിക്കപ്പെട്ടവരെപ്പോലെ ഓർക്കുക; ദുഷ്പെരുമാറ്റം അനുഭവിക്കുന്നവരെ, നിങ്ങളും ശരീരത്തിലാണല്ലോ എന്ന ബോധത്തോടെ ഓർക്കുക.[a]
  to: തടവിലായവരെ, നിങ്ങളും അവരോടൊപ്പം ബന്ധിക്കപ്പെട്ടിരിക്കുന്നതുപോലെ ഓർക്കുക; ദുഷ്പെരുമാറ്റം അനുഭവിക്കുന്നവരെ, നിങ്ങളും ശരീരത്തിലുള്ളവരായിരിക്കെ ഓർക്കുക.[a]
