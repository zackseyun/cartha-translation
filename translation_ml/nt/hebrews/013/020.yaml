id: HEB.13.20
reference: Hebrews 13:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὁ δὲ θεὸς τῆς εἰρήνης, ὁ ἀναγαγὼν ἐκ νεκρῶν τὸν ποιμένα τῶν προβάτων τὸν μέγαν ἐν αἵματι διαθήκης αἰωνίου, τὸν κύριον ἡμῶν Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/020.yaml
  text: May the God of peace[a], who brought up from the dead our Lord Jesus, the great shepherd of the sheep, by the blood of an eternal covenant,
translation:
  language: ml
  text: സമാധാനത്തിന്റെ ദൈവം—നിത്യമായ ഒരു ഉടമ്പടിയുടെ രക്തത്താൽ[a] ആടുകളുടെ മഹാനായ ഇടയനും നമ്മുടെ കർത്താവുമായ യേശുവിനെ മരിച്ചവരിൽനിന്ന് ഉയർത്തിക്കൊണ്ടുവന്നവൻ—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “നിത്യമായ ഒരു ഉടമ്പടിയുടെ രക്തത്തിലൂടെ.” ‘നിത്യമായ ഒരു ഉടമ്പടിയുടെ രക്തത്തിൽ/രക്തത്താൽ’ എന്ന പദസമുച്ചയത്തിന് ഗ്രീക്കിൽ അല്പം വ്യത്യസ്തമായ വ്യാകരണബന്ധം സാധ്യമാണ്.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁ δὲ
  choice: സമാധാനത്തിന്റെ ദൈവം
  rationale: δέ ഇവിടെ ഉപദേശങ്ങളിൽനിന്ന് ആശീർവാദപ്രാർഥനയിലേക്കുള്ള മൃദുവായ മാറ്റം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ പ്രത്യേക ബന്ധകപദം ചേർക്കാതെ വാക്യം ആരംഭിക്കുന്നത് സ്വാഭാവികവും മൂലത്തിൽ ഇല്ലാത്ത കാലസൂചന ഒഴിവാക്കുന്നതുമാണ്.
- source_word: θεὸς τῆς εἰρήνης
  choice: സമാധാനത്തിന്റെ ദൈവം
  rationale: ദൈവത്തെ സമാധാനത്താൽ സവിശേഷമാക്കുന്ന ഗ്രീക്ക് ഷഷ്ഠീവ്യവസ്ഥയെ സ്വാഭാവികവും പരിചിതവുമായ രീതിയിൽ നിലനിർത്തുന്നു.
- source_word: ὁ ἀναγαγὼν ἐκ νεκρῶν
  choice: മരിച്ചവരുടെ ഇടയിൽനിന്ന് ഉയർത്തിക്കൊണ്ടുവന്നവൻ
  rationale: ἀνάγω എന്നതിലെ ‘മുകളിലേക്കു കൊണ്ടുവരുക’ എന്ന ദൃശ്യഭാവവും പുനരുത്ഥാനസന്ദർഭവും ഒരുപോലെ പ്രകടമാക്കുന്നു; ἐκ νεκρῶν എന്നത് ബഹുവചനാർത്ഥത്തോടെ പരിഭാഷപ്പെടുത്തി.
- source_word: τὸν ποιμένα τῶν προβάτων τὸν μέγαν
  choice: ആടുകളുടെ മഹാ ഇടയനായ
  rationale: ποιμήν എന്ന ഇടയരൂപകവും πρόβατα എന്ന ‘ആടുകൾ’ എന്ന നേരിട്ടുള്ള അർത്ഥവും മഹത്വസൂചകമായ μέγας-ഉം നിലനിർത്തുന്നു.
- source_word: ἐν αἵματι
  choice: രക്തത്താൽ
  rationale: ἐν ഇവിടെ ഉപാധിയെയോ അടിസ്ഥാനബന്ധത്തെയോ സൂചിപ്പിക്കാം. ‘രക്തത്താൽ’ സ്വാഭാവികമായി ഉപാധ്യർത്ഥം നൽകുന്നു; ബന്ധത്തിന്റെ എല്ലാ ദൈവശാസ്ത്ര വിശദാംശങ്ങളും നിർവചിക്കുന്നില്ല.
- source_word: διαθήκης αἰωνίου
  choice: നിത്യമായ ഒരു ഉടമ്പടിയുടെ
  rationale: Hebrews-ലെ διαθήκη എന്നതിന് ‘ഉടമ്പടി’ യോജിക്കുന്നു. ഗ്രീക്കിൽ നിർദ്ദേശക ഉപപദമില്ലാത്തതിനാൽ ‘ഒരു’ ചേർത്തു; എങ്കിലും അറിയപ്പെട്ട പുതിയ ഉടമ്പടിയിലേക്കുള്ള സൂചന നിഷേധിക്കുന്നില്ല.
- source_word: τὸν κύριον ἡμῶν Ἰησοῦν
  choice: നമ്മുടെ കർത്താവായ യേശുവിനെ
  rationale: യേശുവിനെ ‘നമ്മുടെ കർത്താവ്’ എന്നു തിരിച്ചറിയുന്ന ഗ്രീക്ക് അനുബന്ധഘടന വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: ἐν αἵματι διαθήκης αἰωνίου എന്ന പദസമുച്ചയത്തിന്റെ വ്യാകരണബന്ധം
  choice: ‘രക്തത്താൽ’ എന്നത് ദൈവം യേശുവിനെ മരിച്ചവരിൽനിന്ന് ഉയർത്തിക്കൊണ്ടുവന്ന പ്രവൃത്തിയോടു പ്രധാനമായി ബന്ധിപ്പിച്ചു.
  alternative: ഇത് ‘ആടുകളുടെ മഹാ ഇടയൻ’ എന്ന വിശേഷണത്തോടു കൂടുതൽ അടുത്ത് ബന്ധിപ്പിച്ച് വായിക്കാം; അല്ലെങ്കിൽ ‘നിത്യമായ ഉടമ്പടിയുടെ രക്തത്തിലൂടെ’ എന്നു നൽകാം.
  rationale: ഗ്രീക്ക് പദക്രമം ഒന്നിലധികം ബന്ധസാധ്യത അനുവദിക്കുന്നു. പ്രധാനവായന ദൈവത്തിന്റെ ഉയർത്തിക്കൊണ്ടുവരുന്ന പ്രവൃത്തിയോടു ചേർക്കുന്നു; അടിക്കുറിപ്പ് യഥാർത്ഥ വ്യാകരണ-ദൈവശാസ്ത്ര അസ്പഷ്ടത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ഗൗരവമുള്ള പ്രാർഥനാഭാഷ. ഇത് അടുത്ത വാക്യത്തിൽ പൂർത്തിയാകുന്ന ആശീർവാദപ്രാർഥനയുടെ ആദ്യഭാഗമായതിനാൽ അവസാനം പൂർണവിരാമത്തിനു പകരം ദീർഘവിരാമചിഹ്നം ഉപയോഗിച്ചു. ‘മഹാ ഇടയൻ’, ‘ഉടമ്പടി’, ‘കർത്താവ്’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കാൻ ക്രമപ്പെടുത്തി.
