  text: περισσοτέρως δὲ παρακαλῶ τοῦτο ποιῆσαι ἵνα τάχιον ἀποκατασταθῶ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/019.yaml
  text: And I urge you all the more to do this[a], so that I may be restored to you sooner.
translation:
  language: ml
  text: നിങ്ങൾ ഇതു ചെയ്യണമെന്ന് ഞാൻ നിങ്ങളോടു അതിലുമധികം അപേക്ഷിക്കുന്നു; അങ്ങനെ ഞാൻ എത്രയും വേഗം നിങ്ങളുടെ അടുക്കലേക്കു തിരിച്ചെത്താൻ വേണ്ടിയാണ്[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങളുടെ അടുക്കലേക്കു പുനഃസ്ഥാപിക്കപ്പെടാൻ.” ഗ്രീക്കുപദം കൃത്യമായ സാഹചര്യം വ്യക്തമാക്കുന്നില്ല; എഴുത്തുകാരൻ വായനക്കാരുടെ അടുക്കലേക്കുള്ള തന്റെ പുനഃചേരലിനെ പൊതുവായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: περισσοτέρως
  choice: അധികമായി
  rationale: അഭ്യർഥനയുടെ തീവ്രത കൂട്ടുന്ന താരതമ്യക്രിയാവിശേഷണത്തിന്റെ ബലം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: വാക്യബന്ധത്തിലൂടെ പരോക്ഷമായി
  rationale: ഇവിടെ δέ ശക്തമായ വിരോധമല്ല, മുൻവാക്യത്തോടുള്ള മൃദുവായ ബന്ധമാണ്. മലയാളത്തിൽ പ്രത്യേക ബന്ധപദം ചേർക്കാതെ വാക്യം തുടരുന്നത് കൂടുതൽ സ്വാഭാവികമാണ്.
- source_word: παρακαλῶ
  choice: ഞാൻ നിങ്ങളോട് അഭ്യർഥിക്കുന്നു
  rationale: സന്ദർഭത്തിലെ ആത്മാർഥമായ അപേക്ഷയുടെ ബലം വ്യക്തമാക്കുന്നു; അതേസമയം അതിനെ ഒരു കൽപ്പനയാക്കി കടുപ്പിക്കുന്നില്ല.
- source_word: τοῦτο ποιῆσαι
  choice: ഇതു ചെയ്യണമെന്ന്
  rationale: തൊട്ടുമുമ്പുള്ള പ്രാർഥനാവിനന്തിയിലേക്കുള്ള τοῦτο എന്ന പദത്തിന്റെ അന്വയസൂചന നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἵνα
  choice: അങ്ങനെ
  rationale: എഴുത്തുകാരന്റെ അഭ്യർഥനയുടെ ഉദ്ദേശ്യം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: τάχιον
  choice: വേഗത്തിൽ
  rationale: താരതമ്യാർഥമുള്ള ‘കൂടുതൽ വേഗത്തിൽ/നേരത്തേ’ എന്ന ആശയം സന്ദർഭാനുസൃതമായി സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἀποκατασταθῶ
  choice: മടക്കിവരുത്തപ്പെടട്ടെ
  rationale: ഗ്രീക്കിലെ നിഷ്ക്രിയരൂപവും വായനക്കാരുടെ അടുക്കലേക്കുള്ള പുനഃചേരലും നിലനിർത്തുന്നു; തടവ്, രോഗം, യാത്ര തുടങ്ങിയ പ്രത്യേക സാഹചര്യം നിർണ്ണയിക്കുന്നില്ല.
- source_word: ὑμῖν
  choice: നിങ്ങളുടെ അടുക്കൽ
  rationale: ബഹുവചന അഭിസംബോധനയും വായനക്കാരിലേക്കുള്ള ദിശ/ബന്ധവും വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: എഴുത്തുകാരൻ പ്രതീക്ഷിക്കുന്ന പുനഃസ്ഥാപനത്തിന്റെ സാഹചര്യം
  choice: വായനക്കാരുടെ അടുക്കൽ മടക്കിവരുത്തപ്പെടുക എന്ന പൊതുവായ അർഥം
  alternative: തടവിൽനിന്നുള്ള മോചനം, യാത്രയ്ക്കുശേഷമുള്ള മടങ്ങിവരവ്, രോഗശാന്തി, അല്ലെങ്കിൽ അവരുടെ ഇടയിലെ ശുശ്രൂഷയിലേക്കുള്ള പുനഃസ്ഥാപനം
  rationale: ἀποκατασταθῶ ὑμῖν എഴുത്തുകാരൻ അവരിലേക്കു തിരികെ ലഭിക്കപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും അതിന്റെ കൃത്യമായ ചരിത്രസാഹചര്യം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ വിവർത്തനം ആ അവ്യക്തത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ അഭ്യർഥനാശൈലി. മൂലത്തിലെ നിഷ്ക്രിയരൂപവും ചരിത്രസാഹചര്യത്തിലെ അവ്യക്തതയും സംരക്ഷിച്ചിരിക്കുന്നു.
