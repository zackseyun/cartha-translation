  to: നമുക്ക് ഒരു യാഗപീഠമുണ്ട്; അതിൽനിന്ന് ഭക്ഷിക്കാൻ തിരുനിവാസത്തിൽ ശുശ്രൂഷ ചെയ്യുന്നവർക്ക് അവകാശമില്ല[a][b].
  rationale: പ്രധാനപാഠത്തിൽ തിരുത്തൽ ആവശ്യമില്ല. വിവാദമായ ‘യാഗപീഠം’ എന്ന പ്രതീകം വിശദീകരിക്കാതെ നിലനിർത്തിയിരിക്കുന്നു. ഇംഗ്ലീഷ് audit trail-നോടും ഗ്രീക്കിന്റെ തുറന്ന പ്രതീകഭാഷയോടും കൂടുതൽ കൃത്യമായി ചേരുന്നതിനായി അടിക്കുറിപ്പ് b-യിൽ മാത്രം ‘അനുഗ്രഹങ്ങൾ’ എന്നതിനു പകരം ‘യാഗാർപ്പണത്തിൽനിന്നുള്ള പ്രയോജനങ്ങൾ’ ഉപയോഗിച്ചു.
