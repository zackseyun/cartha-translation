  source_fidelity: 'പ്രധാനപാഠം ഗ്രീക്കിനോട് വിശ്വസ്തമാണ്: ἔχομεν എന്ന ഉൾക്കൊള്ളുന്ന വർത്തമാനപ്രയോഗം ‘നമുക്ക് … ഉണ്ട്’ എന്നും, θυσιαστήριον ‘യാഗപീഠം’ എന്നും, ἐξ οὗ φαγεῖν ‘അതിൽനിന്ന് ഭക്ഷിക്കാൻ’ എന്നും, οὐκ ἔχουσιν ἐξουσίαν ‘അവകാശമില്ല’ എന്നും, οἱ τῇ σκηνῇ λατρεύοντες ‘തിരുനിവാസത്തിൽ ശുശ്രൂഷ ചെയ്യുന്നവർ’ എന്നും യോജ്യമായി നൽകുന്നു. യാഗപീഠത്തിന്റെ നിർദിഷ്ടസൂചന പ്രധാനപാഠത്തിൽ ചേർക്കാതെ വിട്ടിരിക്കുന്നതും ശരിയാണ്.'
  naturalness: വാക്യം ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമാണ്. ‘യാഗപീഠത്തിൽനിന്ന് ഭക്ഷിക്കുക’ എന്ന ചിത്രം അക്ഷരാർഥത്തിൽ അല്പം അസാധാരണമെന്നു തോന്നാമെങ്കിലും, അത് ഗ്രീക്കിലെ ഉദ്ദേശ്യപൂർവമായ ആരാധനാപരമായ ചിത്രം സംരക്ഷിക്കുന്നു; അതിനാൽ മാറ്റേണ്ടതില്ല.
  terminology: ‘യാഗപീഠം,’ ‘തിരുനിവാസം,’ ‘ശുശ്രൂഷ,’ ‘അവകാശം’ എന്നിവ സന്ദർഭോചിതവും സ്ഥാപിതവുമായ പദങ്ങളാണ്. എന്നാൽ അടിക്കുറിപ്പ് b-യിലെ ‘യാഗാർപ്പണത്തിന്റെ അനുഗ്രഹങ്ങൾ’ ഇംഗ്ലീഷ് audit trail-ലെ ‘sacrificial benefits’ എന്നതിനെക്കാൾ ‘ആശീർവാദങ്ങൾ’ എന്ന അർഥത്തിലേക്കു വഴുതാം. ‘യാഗാർപ്പണത്തിൽനിന്നുള്ള പ്രയോജനങ്ങൾ’ എന്നു മാറ്റുന്നത് വ്യാഖ്യാനസാധ്യതയെ കൂടുതൽ കൃത്യമായി സംരക്ഷിക്കുന്നു.
