id: HEB.13.10
reference: Hebrews 13:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔχομεν θυσιαστήριον ἐξ οὗ φαγεῖν οὐκ ἔχουσιν ἐξουσίαν οἱ τῇ σκηνῇ λατρεύοντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/010.yaml
  text: We have an altar from which those who serve at the tabernacle have no right to eat[a][b].
translation:
  language: ml
  text: നമുക്ക് ഒരു യാഗപീഠമുണ്ട്; അതിൽനിന്ന് ഭക്ഷിക്കാൻ തിരുനിവാസത്തിൽ ശുശ്രൂഷ ചെയ്യുന്നവർക്ക് അവകാശമില്ല[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ കൃത്യമായി: ‘കൂടാരത്തിൽ/തിരുനിവാസത്തിൽ ആരാധനാശുശ്രൂഷ ചെയ്യുന്നവർ.’ പഴയ ഉടമ്പടിയിലെ വിശുദ്ധമന്ദിരശുശ്രൂഷയിൽ ഏർപ്പെട്ടിരുന്നവരെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.'
    reason: lexical_alternative
  - marker: b
    text: ‘യാഗപീഠം’ എന്നത് ക്രിസ്തു തന്നെയോ, ക്രൂശോ, സ്വർഗീയ യാഗപീഠമോ, ക്രിസ്തുവിന്റെ യാഗാർപ്പണത്തിൽനിന്നുള്ള പ്രയോജനങ്ങളോ സൂചിപ്പിക്കുന്നതായി വിവിധർ വ്യാഖ്യാനിക്കുന്നു. എന്നാൽ ഗ്രീക്ക് പാഠം ഇവിടെ ആ പ്രതീകം കൂടുതൽ കൃത്യമായി നിർവചിക്കുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔχομεν
  choice: നമുക്ക് ... ഉണ്ട്
  rationale: വർത്തമാനകാല ക്രിയയുടെ ലളിതമായ അർഥം നിലനിർത്തുന്നു; എഴുത്തുകാരനെയും വായനക്കാരെയും ഉൾക്കൊള്ളുന്ന സംയുക്തമായ കൈവശം/പ്രാപ്യത ഇതിൽ പ്രകടമാണ്.
- source_word: θυσιαστήριον
  choice: യാഗപീഠം
  rationale: ബലികൾ അർപ്പിക്കുന്ന പീഠം എന്ന നേരിട്ടുള്ള ആരാധനാസംബന്ധമായ അർഥം നൽകുന്നു. ഇവിടെ അതിനെ ‘ക്രൂശ്’ എന്നോ ‘യാഗം’ എന്നോ വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: ἐξ οὗ
  choice: അതിൽനിന്ന്
  rationale: ἐκ എന്ന പൂർവപ്രത്യയം സൂചിപ്പിക്കുന്ന ഉറവിടബന്ധവും യാഗപീഠത്തിൽനിന്ന് ഭക്ഷിക്കുന്ന ദൃശ്യവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: φαγεῖν
  choice: ഭക്ഷിക്കാൻ
  rationale: അനന്തക്രിയയുടെ ലളിതവും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: οὐκ ἔχουσιν ἐξουσίαν
  choice: അവകാശമില്ല
  rationale: ἐξουσία ഇവിടെ അംഗീകൃതമായി പങ്കുചേരാനുള്ള അവകാശം അഥവാ അധികാരപരമായ അനുമതി സൂചിപ്പിക്കുന്നു; ‘അവകാശമില്ല’ ആരാധനാപരമായ ഈ സാഹചര്യത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: οἱ τῇ σκηνῇ λατρεύοντες
  choice: തിരുനിവാസത്തിൽ ശുശ്രൂഷ ചെയ്യുന്നവർ
  rationale: λατρεύω പൊതുവായ ആരാധനയെക്കാൾ വിശുദ്ധമന്ദിരത്തിലെ ആരാധനാശുശ്രൂഷയെ സൂചിപ്പിക്കുന്നു. Hebrews-ലെ σκηνή പഴയ ഉടമ്പടിയുടെ കൂടാരവിശുദ്ധമന്ദിരത്തെ ഉണർത്തുന്നതിനാൽ ‘തിരുനിവാസം’ എന്ന സ്ഥാപിതവും മനസ്സിലാക്കാവുന്നതുമായ പദം ഉപയോഗിച്ചു.
theological_decisions:
- issue: എബ്രായർ 13:10-ലെ ‘യാഗപീഠം’ എന്തിനെ സൂചിപ്പിക്കുന്നു
  choice: പ്രധാനപാഠത്തിൽ ‘യാഗപീഠം’ എന്ന മൂർത്തമായ പ്രതീകം കൂടുതൽ വിശദീകരിക്കാതെ നിലനിർത്തുക.
  alternative: ക്രിസ്തു തന്നേ; ക്രൂശ്; സ്വർഗീയ യാഗപീഠം; ക്രിസ്തുവിന്റെ യാഗാർപ്പണത്തിന്റെ അനുഗ്രഹങ്ങൾ.
  rationale: ഗ്രീക്ക് വാക്യം ഇവിടെ യാഗപീഠത്തിന്റെ കൃത്യമായ സൂചന വ്യക്തമാക്കുന്നില്ല. വ്യത്യസ്ത വ്യാഖ്യാനങ്ങൾക്കിടയിൽ ഒന്നിനെ പ്രധാനപാഠത്തിൽ ഉറപ്പിക്കുന്നത് പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സാന്ദ്രതയും തുറന്ന നിലയും ഇല്ലാതാക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ആരാധനാസംബന്ധമായ പശ്ചാത്തലം വ്യക്തമാക്കാൻ ‘യാഗപീഠം,’ ‘തിരുനിവാസം,’ ‘ശുശ്രൂഷ’ എന്നീ പരിചിത പദങ്ങൾ ഉപയോഗിച്ചു; വാക്യത്തിന്റെ ദൈവശാസ്ത്രപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
