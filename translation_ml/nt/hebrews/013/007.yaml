- from: നിങ്ങളോടു ദൈവത്തിന്റെ വചനം സംസാരിച്ച നിങ്ങളുടെ നേതാക്കളെ ഓർക്കുക. അവരുടെ ജീവിതരീതിയുടെ പരിണതി പരിഗണിച്ചുകൊണ്ട്[a], അവരുടെ വിശ്വാസം[b] അനുകരിക്കുക.
  to: നിങ്ങളോടു ദൈവത്തിന്റെ വചനം പറഞ്ഞ നിങ്ങളുടെ നേതാക്കളെ ഓർക്കുക. അവരുടെ ജീവിതരീതിയുടെ പരിണതി പരിഗണിച്ചുകൊണ്ട്[a], അവരുടെ വിശ്വാസം[b] അനുകരിക്കുക.
