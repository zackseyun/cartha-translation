id: HEB.13.7
reference: Hebrews 13:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Μνημονεύετε τῶν ἡγουμένων ὑμῶν, οἵτινες ἐλάλησαν ὑμῖν τὸν λόγον τοῦ θεοῦ, ὧν ἀναθεωροῦντες τὴν ἔκβασιν τῆς ἀναστροφῆς μιμεῖσθε τὴν πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/007.yaml
  text: Remember your leaders[a], who spoke the word of God to you. As you consider the outcome of their way of life[b], imitate their faith.
translation:
  language: ml
  text: നിങ്ങളോടു ദൈവത്തിന്റെ വചനം പറഞ്ഞ നിങ്ങളുടെ നേതാക്കളെ ഓർക്കുക. അവരുടെ ജീവിതരീതിയുടെ പരിണതി പരിഗണിച്ചുകൊണ്ട്[a], അവരുടെ വിശ്വാസം[b] അനുകരിക്കുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പരിണതി” എന്നത് “അന്ത്യം” എന്നും പരിഭാഷപ്പെടുത്താം; ചില വ്യാഖ്യാനങ്ങളിൽ ഇത് അവർ എങ്ങനെ മരിച്ചു എന്നതിനെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “വിശ്വസ്തത.” ഗ്രീക്ക് പദത്തിന് “വിശ്വാസം” എന്നും “വിശ്വസ്തത” എന്നും അർഥമാകാം; പദ്ധതിയുടെ പതിവനുസരിച്ച് മുഖ്യവാചകത്തിൽ “വിശ്വാസം” നൽകിയിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: Μνημονεύετε
  choice: ഓർക്കുക
  rationale: വർത്തമാനകാല ആജ്ഞ തുടർച്ചയായ ഓർമ്മപ്പെടുത്തലിനെ സൂചിപ്പിക്കാമെങ്കിലും, സന്ദർഭത്തിൽ ‘ഓർക്കുക’ സ്വാഭാവികവും ആ ദൈർഘ്യഭാവം ഉൾക്കൊള്ളാൻ കഴിയുന്നതുമായ മലയാളമാണ്.
- source_word: τῶν ἡγουμένων ὑμῶν
  choice: നിങ്ങളുടെ നേതാക്കളെ
  rationale: സഭാസമൂഹത്തിൽ അംഗീകരിക്കപ്പെട്ട് വഴിനടത്തിയവരെയാണ് സൂചിപ്പിക്കുന്നത്; ‘നേതാക്കൾ’ യഥാർഥ അധികാരം നിലനിർത്തുകയും രാഷ്ട്രീയമായ ‘ഭരണാധികാരികൾ’ എന്ന അതിരുകടന്ന ഭാവം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: οἵτινες ἐλάλησαν ὑμῖν τὸν λόγον τοῦ θεοῦ
  choice: നിങ്ങളോടു ദൈവത്തിന്റെ വചനം സംസാരിച്ച
  rationale: λαλέω എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘സംസാരിക്കുക’ നിലനിർത്തുന്നു; ‘ദൈവത്തിന്റെ വചനം’ എന്നത് മൂലത്തിലെ ഷഷ്ഠീബന്ധവും പരിചിതമായ ബൈബിൾ പ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: ἀναθεωροῦντες
  choice: പരിഗണിച്ചുകൊണ്ട്
  rationale: ശ്രദ്ധാപൂർവം നിരീക്ഷിക്കുകയും ചിന്തിക്കുകയും ചെയ്യുന്ന ഭാവം അറിയിക്കുന്നു; വെറുമൊരു നോട്ടമല്ല, വിചാരപൂർവമായ വിലയിരുത്തലാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: τὴν ἔκβασιν
  choice: പരിണതി
  rationale: ἔκβασις എന്നത് ഫലം, അന്ത്യം, പരിണതി എന്നിവ സൂചിപ്പിക്കാം. ‘പരിണതി’ ജീവിതത്തിന്റെ അന്തിമ ഫലത്തെ ഉൾക്കൊള്ളുമ്പോഴും മരണമോ രക്തസാക്ഷിത്വമോ എന്ന് അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: τῆς ἀναστροφῆς
  choice: അവരുടെ ജീവിതരീതിയുടെ
  rationale: ἀναστροφή പെരുമാറ്റത്തെയും ജീവിതം നയിച്ച രീതിയെയും സൂചിപ്പിക്കുന്നു; ‘ജീവിതരീതി’ ഈ രണ്ടും സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി ഉൾക്കൊള്ളിക്കുന്നു.
- source_word: μιμεῖσθε
  choice: അനുകരിക്കുക
  rationale: നേരിട്ടുള്ള ആജ്ഞയുടെ ശക്തി കാത്തുസൂക്ഷിക്കുന്ന വ്യക്തവും പ്രചാരത്തിലുള്ളതുമായ പദമാണ്.
- source_word: τὴν πίστιν
  choice: അവരുടെ വിശ്വാസം
  rationale: πίστις വിശ്വാസം എന്നും വിശ്വസ്തത എന്നും അർഥമാകാം. പദ്ധതിയുടെ പതിവനുസരിച്ച് മുഖ്യവാചകത്തിൽ ‘വിശ്വാസം’ ഉപയോഗിച്ച് മറ്റർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: അനുകരിക്കാവുന്ന മനുഷ്യഗുണത്തെ സൂചിപ്പിക്കുന്ന πίστις എന്ന പദത്തിന്റെ അർഥം
  choice: വിശ്വാസം
  alternative: വിശ്വസ്തത
  rationale: നേതാക്കളെ സവിശേഷരാക്കിയ ഗുണം അനുകരിക്കാനാണ് വാക്യം ആഹ്വാനം ചെയ്യുന്നത്. സന്ദർഭത്തിൽ വിശ്വാസവും വിശ്വസ്തതയും രണ്ടും യോജിക്കാം; അതിനാൽ മുഖ്യവാചകത്തിൽ പദ്ധതിയുടെ സ്ഥിരമായ പരിഭാഷയായ ‘വിശ്വാസം’ നൽകി യഥാർഥ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: ἔκβασις നേതാക്കളുടെ മരണത്തെയോ രക്തസാക്ഷിത്വത്തെയോ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നുണ്ടോ
  choice: പരിണതി
  alternative: അന്ത്യം; ചില വ്യാഖ്യാനങ്ങളിൽ അവരുടെ മരണവിധം
  rationale: ഈ പദത്തിന് ജീവിതത്തിന്റെ അന്തിമഫലം അല്ലെങ്കിൽ അന്ത്യം സൂചിപ്പിക്കാനാകുമെങ്കിലും, വാക്യം മരണമോ രക്തസാക്ഷിത്വമോ വ്യക്തമായി പറയുന്നില്ല. ‘പരിണതി’ കൂടുതൽ പ്രത്യേകമായ ചരിത്രനിഗമനം അടിച്ചേൽപ്പിക്കാതെ പദത്തിന്റെ വ്യാപ്തി കാത്തുസൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. മൂലത്തിലെ മൂന്ന് ആജ്ഞാഭാവങ്ങൾ—ഓർക്കുക, പരിഗണിക്കുക, അനുകരിക്കുക—വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു. ഇംഗ്ലീഷ് consultation layer-ൽ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളുടെ സ്ഥാനവും ഉള്ളടക്കവും തമ്മിലുണ്ടായ പൊരുത്തക്കേട് തിരുത്തി, ἔκβασις-നുള്ള കുറിപ്പ് [a] ആയും πίστις-നുള്ള കുറിപ്പ് [b] ആയും ബന്ധപ്പെട്ട പദങ്ങൾക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
