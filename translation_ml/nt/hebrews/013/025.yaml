  register: ആധുനിക നിലവാരമലയാളത്തിൽ, ലേഖനസമാപനാശംസയ്ക്ക് യോജിച്ച ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ സംക്ഷിപ്തത നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ ആവശ്യമായ ആശംസാക്രിയ ചേർത്തിരിക്കുന്നു.
