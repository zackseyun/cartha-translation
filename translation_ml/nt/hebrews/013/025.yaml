  language: ml
  text: കൃപ നിങ്ങളെല്ലാവരോടും കൂടെ ഇരിക്കട്ടെ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ χάρις
  choice: കൃപ
  rationale: ലേഖനത്തിന്റെ സമാപനാശംസയിൽ χάρις ദൈവകൃപയെ സൂചിപ്പിക്കുന്ന പതിവുപദമാണ്. മലയാളത്തിൽ ‘കൃപ’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ തത്തുല്യപദമാണ്; ഗ്രീക്കിലെ നിർദേശകപദം പ്രത്യേകം പരിഭാഷപ്പെടുത്തേണ്ടതില്ല.
- source_word: μετὰ
  choice: കൂടെ ഇരിക്കട്ടെ
  rationale: ജനിറ്റീവിനോടുകൂടിയ μετά എന്നതിന് ‘കൂടെ’ എന്നാണ് അർഥം. ക്രിയയില്ലാത്ത ഗ്രീക്ക് ആശംസാവാക്യത്തിന്റെ ആശംസാഭാവം സ്വാഭാവിക മലയാളത്തിൽ ‘ഇരിക്കട്ടെ’ എന്നു പൂരിപ്പിക്കുന്നു.
- source_word: πάντων ὑμῶν
  choice: നിങ്ങളെല്ലാവരോടും
  rationale: πάντων ὑμῶν ശ്രോതൃസമൂഹത്തിലെ എല്ലാവരെയും വ്യക്തമായി ഉൾക്കൊള്ളുന്നു. ‘നിങ്ങളെല്ലാവരോടും’ ആ സമഗ്രത വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
theological_decisions: []
