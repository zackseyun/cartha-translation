id: HEB.13.15
reference: Hebrews 13:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: δι’ αὐτοῦ ⸀οὖν ἀναφέρωμεν θυσίαν αἰνέσεως διὰ παντὸς τῷ θεῷ, τοῦτ’ ἔστιν καρπὸν χειλέων ὁμολογούντων τῷ ὀνόματι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/015.yaml
  text: Therefore[a], through him let us continually offer up to God a sacrifice of praise—that is[c][b], the fruit of lips confessing his name.
translation:
  language: ml
  text: അതുകൊണ്ട്, അവനിലൂടെ നാം എപ്പോഴും ദൈവത്തിന് സ്തുതിയാഗം അർപ്പിക്കാം—അതായത്, അവന്റെ നാമം ഏറ്റുപറയുന്ന അധരങ്ങളുടെ ഫലം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അവന്റെ നാമം അംഗീകരിക്കുന്ന അധരങ്ങളുടെ ഫലം” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ αὐτοῦ
  choice: അവനിലൂടെ
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന മാധ്യമം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ക്രിസ്തുവിലൂടെയുള്ള അർപ്പണമാണ് ഉദ്ദേശ്യം, എന്നാൽ സർവനാമം വിശദീകരിച്ച് വിപുലീകരിക്കുന്നില്ല.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀναφέρωμεν
  choice: നാം ... അർപ്പിക്കാം
  rationale: ഒന്നാംപുരുഷ ബഹുവചന hortatory subjunctive-ന്റെ ആഹ്വാനഭാവവും യാഗാർപ്പണസൂചനയും സംരക്ഷിക്കുന്നു.
- source_word: θυσίαν αἰνέσεως
  choice: സ്തുതിയാഗം
  rationale: യാഗരൂപകം നിലനിർത്തുന്ന, മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ സംയുക്തപ്രയോഗം.
- source_word: διὰ παντός
  choice: എപ്പോഴും
  rationale: തുടർച്ചയായി/എല്ലാകാലത്തും എന്ന അർത്ഥം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τῷ θεῷ
  choice: ദൈവത്തിന്
  rationale: അർപ്പണത്തിന്റെ സ്വീകർത്താവിനെ സൂചിപ്പിക്കുന്ന ദത്തിവ് മലയാളത്തിൽ നേരിട്ട് നൽകുന്നു.
- source_word: τοῦτ’ ἔστιν
  choice: അതായത്
  rationale: സ്തുതിയാഗം എന്താണെന്ന് വിശദീകരിക്കുന്ന പുനർവ്യാഖ്യാനം വ്യക്തമാക്കുന്നു.
- source_word: καρπὸν χειλέων
  choice: അധരങ്ങളുടെ ഫലം
  rationale: തിരുവെഴുത്തുപശ്ചാത്തലമുള്ള രൂപകം നിലനിർത്തുന്നു; ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത ‘നമ്മുടെ’ എന്ന പദം ചേർക്കുന്നില്ല.
- source_word: ὁμολογούντων
  choice: ഏറ്റുപറയുന്ന
  rationale: പരസ്യമായ സമ്മതിക്കൽ/അംഗീകരിക്കൽ എന്ന അർത്ഥവ്യാപ്തി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: τῷ ὀνόματι αὐτοῦ
  choice: അവന്റെ നാമം
  rationale: ὁμολογέω-യോടൊപ്പമുള്ള ദത്തിവിനെ മലയാളത്തിൽ സ്വാഭാവികമായ നേരിട്ടുള്ള കർമമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: δι’ αὐτοῦ എന്നതിലെ ‘അവൻ’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: സന്ദർഭത്തിൽ ക്രിസ്തുവിനെ സൂചിപ്പിക്കുന്നതായും അവനിലൂടെയുള്ള മധ്യസ്ഥതാഭാവം നിലനിർത്തുന്നതായും വായിക്കുക; പരിഭാഷയിൽ ‘അവനിലൂടെ’ എന്നു മാത്രം നൽകുക.
  alternative: ‘യേശുവിലൂടെ’ അല്ലെങ്കിൽ ‘ക്രിസ്തുവിലൂടെ’ എന്ന് വ്യക്തമായി വികസിപ്പിക്കുക.
  rationale: മുൻസന്ദർഭം യേശുവിനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും മൂലപാഠം സർവനാമം മാത്രമാണ് ഉപയോഗിക്കുന്നത്; അതിനാൽ സന്ദർഭാർഥം സംരക്ഷിച്ചുകൊണ്ട് അനാവശ്യ വിശദീകരണം ഒഴിവാക്കുന്നു.
- issue: യാഗഭാഷയുടെ ശക്തി
  choice: ‘അർപ്പിക്കാം’, ‘സ്തുതിയാഗം’ എന്നീ യാഗരൂപകങ്ങൾ നിലനിർത്തുക.
  alternative: ‘ദൈവത്തെ സ്തുതിക്കാം’ എന്നാക്കി രൂപകം ലഘൂകരിക്കുക.
  rationale: പഴയനിയമ യാഗഭാഷയെ സ്തുതിയുമായി ഉദ്ദേശ്യപൂർവം ബന്ധിപ്പിക്കുന്ന വാക്യത്തിന്റെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും തുടർച്ചയും നിലനിർത്തുന്നു.
- issue: ὁμολογούντων എന്നതിന്റെ അർത്ഥവ്യാപ്തി
  choice: ‘ഏറ്റുപറയുന്ന’ എന്ന് പരിഭാഷപ്പെടുത്തി തുറന്ന സമ്മതത്തിന്റെ ഭാവം മുൻനിർത്തുക.
  alternative: ‘അംഗീകരിക്കുന്ന’ അല്ലെങ്കിൽ ‘സ്തുതിക്കുന്ന’.
  rationale: ക്രിയയ്ക്ക് ഏറ്റുപറയുക, തുറന്നു അംഗീകരിക്കുക എന്നീ അർത്ഥങ്ങൾ ഉണ്ടാകാം; ‘ഏറ്റുപറയുന്ന’ എന്നത് അതിന്റെ സാക്ഷ്യാത്മക ഭാവം നിലനിർത്തുന്നു, എന്നാൽ മറ്റൊരു സാധുവായ വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘സ്തുതിയാഗം’, ‘അധരങ്ങളുടെ ഫലം’ എന്നീ ബൈബിൾരൂപകങ്ങൾ ഉദ്ദേശ്യപൂർവം നിലനിർത്തി; വാക്യക്രമം മലയാളത്തിന്റെ സ്വാഭാവിക ഒഴുക്കിനനുസരിച്ച് ക്രമപ്പെടുത്തി.
