  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: γινώσκετε τὸν ἀδελφὸν ⸀ἡμῶν Τιμόθεον ἀπολελυμένον, μεθ’ οὗ ἐὰν τάχιον ἔρχηται ὄψομαι ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/023.yaml
  text: Know that our brother Timothy has been released[a], with whom I will see you if he comes soon.
translation:
  language: ml
  text: നമ്മുടെ സഹോദരനായ തിമൊഥെയൊസ് മോചിതനായിരിക്കുന്നു എന്ന് അറിഞ്ഞുകൊള്ളുക. അവൻ വേഗം വന്നാൽ, അവനോടൊപ്പം ഞാൻ നിങ്ങളെ കാണും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γινώσκετε
  choice: അറിഞ്ഞുകൊള്ളുക
  rationale: വർത്തമാനകാല ആജ്ഞാരൂപത്തിന്റെ അറിയിപ്പുസ്വഭാവവും ആജ്ഞാബലവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τὸν ἀδελφὸν ἡμῶν
  choice: നമ്മുടെ സഹോദരനായ
  rationale: ആദിമ ക്രൈസ്തവസമൂഹത്തിലെ കുടുംബബന്ധസൂചകമായ പ്രയോഗം നിലനിർത്തുകയും തിമൊഥെയൊസിനെ വ്യക്തമായി വിശേഷിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: Τιμόθεον
  choice: തിമൊഥെയൊസ്
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പരിചിതമായ ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകിയിരിക്കുന്നു.
- source_word: ἀπολελυμένον
  choice: മോചിതനായിരിക്കുന്നു
  rationale: ἀπολύω എന്ന ക്രിയയുടെ പൂർത്തകാല നിഷ്ക്രിയ കൃദന്തരൂപം സൂചിപ്പിക്കുന്ന, പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ പ്രസക്തി പ്രകടമാക്കുന്നു. തടവിൽനിന്നുള്ള മോചനം സാധ്യതയേറിയതാണെങ്കിലും മൂലപദത്തിന് യാത്രയാക്കി അയയ്ക്കുക അഥവാ വിട്ടയയ്ക്കുക എന്ന അർഥവും സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: μεθ’ οὗ
  choice: അവനോടൊപ്പം
  rationale: തിമൊഥെയൊസിനോടൊപ്പമുള്ള ഭാവിസന്ദർശനം സ്വാഭാവികവും വ്യക്തവുമായി മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ἐὰν τάχιον ἔρχηται
  choice: അവൻ വേഗം വന്നാൽ
  rationale: നിബന്ധനാഭാവം നിലനിർത്തുന്നു; താരതമ്യരൂപത്തിലുള്ള τάχιον സന്ദർഭത്തിൽ ‘വേഗം’ എന്നത് സ്വാഭാവികമാണ്.
- source_word: ὄψομαι ὑμᾶς
  choice: ഞാൻ നിങ്ങളെ കാണും
  rationale: ‘സന്ദർശിക്കും’ എന്ന വ്യാഖ്യാനപരമായ പദത്തേക്കാൾ മൂലത്തിലെ കാണുക എന്ന നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. മൂലവാക്യത്തിലെ ആജ്ഞാബലവും നിബന്ധനയും നേരിട്ടുള്ള ‘കാണും’ എന്ന പ്രയോഗവും നിലനിർത്തിയിരിക്കുന്നു; ἀπολελυμένον എന്നതിലെ യഥാർഥ പദാർഥവൈവിധ്യം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചിരിക്കുന്നു.
