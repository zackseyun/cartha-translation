  text: Ἡ φιλαδελφία μενέτω.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/001.yaml
  text: Let brotherly love continue[a].
translation:
  language: ml
  text: സഹോദരസ്നേഹം[a] തുടർന്നും നിലനിൽക്കട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സഹവിശ്വാസികളോടുള്ള സ്നേഹം’; ഗ്രീക്ക് പദം ക്രിസ്തീയ സമൂഹത്തിനുള്ളിലെ കുടുംബസദൃശമായ സ്നേഹത്തെ സൂചിപ്പിക്കുന്നു; പുരുഷന്മാരെ മാത്രമല്ല ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλαδελφία
  choice: സഹോദരസ്നേഹം
  rationale: വിശ്വാസസമൂഹത്തിലെ അംഗങ്ങൾ തമ്മിലുള്ള കുടുംബബന്ധസദൃശമായ സ്നേഹത്തെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്. ‘സഹോദരസ്നേഹം’ ഗ്രീക്കിലെ കുടുംബരൂപകം നിലനിർത്തുന്നു; സ്ത്രീകളെയും പുരുഷന്മാരെയും ഉൾക്കൊള്ളുന്ന അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: μενέτω
  choice: തുടർന്നും നിലനിൽക്കട്ടെ
  rationale: μένω എന്ന ക്രിയയുടെ വർത്തമാനകാല ആജ്ഞാരൂപം ഇതിനകം നിലവിലുള്ള അവസ്ഥ തുടർന്നുനിൽക്കണമെന്ന ആഹ്വാനം നൽകുന്നു. ഈ പ്രയോഗം അതിന്റെ ആജ്ഞാഭാവവും തുടർച്ചയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: Ἡ
  choice: പ്രത്യേകമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: നാമത്തെ നിർദിഷ്ടവും വായനക്കാർക്ക് പരിചിതവുമായ ഗുണമായി ചൂണ്ടിക്കാണിക്കുന്ന ഗ്രീക്ക് നിർദേശകപദത്തിന്റെ ഭാവം മലയാളത്തിലെ സ്വാഭാവിക ആഹ്വാനവാക്യത്തിൽ പദക്രമത്തിലൂടെയും സന്ദർഭത്തിലൂടെയും ഉൾക്കൊള്ളുന്നു.
theological_decisions:
- issue: φιλαδελφία എന്ന പദത്തിന്റെ വ്യാപ്തിയും കുടുംബബന്ധസൂചകമായ ഭാഷയും
  choice: ‘സഹോദരസ്നേഹം’ എന്ന് വിവർത്തനം ചെയ്ത് കുടുംബരൂപകം നിലനിർത്തുക
  alternative: ‘സഹവിശ്വാസികളോടുള്ള സ്നേഹം’ അല്ലെങ്കിൽ ‘പരസ്പരസ്നേഹം’
  rationale: ഗ്രീക്ക് പദം സഹോദരബന്ധത്തിന്റെ രൂപകത്തിലൂടെ ക്രിസ്തീയ സമൂഹത്തിനുള്ളിലെ കുടുംബസദൃശമായ സ്നേഹത്തെ സൂചിപ്പിക്കുന്നു. പൊതുവായ ‘പരസ്പരസ്നേഹം’ എന്നു പറഞ്ഞാൽ ആ രൂപകം നഷ്ടപ്പെടും; അതേസമയം, ഈ പദം പുരുഷന്മാരെ മാത്രം ഉദ്ദേശിക്കുന്നതല്ലെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘തുടർന്നും നിലനിൽക്കട്ടെ’ എന്ന പ്രയോഗം ആജ്ഞയുടെ മൃദുവായെങ്കിലും വ്യക്തമായ ഭാവവും പ്രവർത്തിയുടെ തുടർച്ചയും ഒരുമിച്ച് നൽകുന്നു.
