id: HEB.13.4
reference: Hebrews 13:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τίμιος ὁ γάμος ἐν πᾶσιν καὶ ἡ κοίτη ἀμίαντος, πόρνους ⸀γὰρ καὶ μοιχοὺς κρινεῖ ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/004.yaml
  text: Let marriage be held in honor among all[a], and the marriage bed be undefiled[b], for God will judge the sexually immoral and adulterers.
translation:
  language: ml
  text: എല്ലാവരാലും വിവാഹം ആദരിക്കപ്പെടട്ടെ[a][b], വിവാഹശയ്യ മലിനമാകാതെ ഇരിക്കട്ടെ; കാരണം, ലൈംഗിക അധാർമികതയിൽ ഏർപ്പെടുന്നവരെയും വ്യഭിചാരികളെയും ദൈവം ന്യായംവിധിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വിവാഹം എല്ലാവരാലും ആദരണീയമാണ്.” ആദ്യ ഉപവാക്യത്തിൽ ഗ്രീക്കിൽ വ്യക്തമായ ക്രിയയില്ല; അതിനാൽ ഇത് ഒരു ആഹ്വാനമായോ പ്രസ്താവനയായോ വായിക്കാം.
    reason: alternative_reading
  - marker: b
    text: “എല്ലാവരാലും” എന്നതിനു പകരം “എല്ലാവരുടെയും ഇടയിൽ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίμιος
  choice: ആദരിക്കപ്പെടട്ടെ
  rationale: ഈ പദം ആദരണീയവും വിലമതിക്കപ്പെടുന്നതുമായ നിലയെ സൂചിപ്പിക്കുന്നു. ചുറ്റുമുള്ള പ്രബോധനങ്ങളുടെ പശ്ചാത്തലത്തിൽ ആഹ്വാനരൂപം സ്വാഭാവികമാണ്; എന്നാൽ മൂലഗ്രീക്കിൽ ക്രിയ വ്യക്തമല്ലാത്തതിനാൽ പ്രസ്താവനാരൂപവും അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ὁ γάμος
  choice: വിവാഹം
  rationale: ഇവിടെ വിവാഹച്ചടങ്ങിനെയല്ല, വിവാഹബന്ധം അഥവാ വിവാഹസ്ഥിതിയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἐν πᾶσιν
  choice: എല്ലാവരുടെയും ഇടയിൽ
  rationale: വ്യക്തികളെ സൂചിപ്പിക്കുന്ന ബഹുവചനപ്രയോഗമായി വായിക്കുന്നത് സ്വാഭാവികമാണ്. ‘എല്ലാവരാലും’ എന്ന കർത്തൃസൂചനയുള്ള വായനയും സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἡ κοίτη
  choice: വിവാഹശയ്യ
  rationale: അക്ഷരാർഥത്തിൽ ‘ശയ്യ’ എന്നാണെങ്കിലും വിവാഹസന്ദർഭത്തിൽ ദാമ്പത്യലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന ഉപലക്ഷണമാണ്; ‘വിവാഹശയ്യ’ മലയാളത്തിൽ അർഥം വ്യക്തവും മാന്യവുമായി നൽകുന്നു.
- source_word: ἀμίαντος
  choice: മലിനമാകാതിരിക്കട്ടെ
  rationale: ‘മലിനമാകാത്തത്, കളങ്കമില്ലാത്തത്’ എന്ന നൈതികവും ശുദ്ധിസംബന്ധവുമായ ഭാവം സൂക്ഷിക്കുന്നു; പ്രബോധനരൂപത്തിനനുസരിച്ച് ക്രിയാത്മകമായി പരിഭാഷപ്പെടുത്തി.
- source_word: πόρνους
  choice: ലൈംഗിക അധാർമികതയിൽ ഏർപ്പെടുന്നവർ
  rationale: പദം വിവിധതരം ലൈംഗിക അധാർമികതയിൽ ഏർപ്പെടുന്നവരെ വിശാലമായി സൂചിപ്പിക്കുന്നു; ഒരു പ്രത്യേക പ്രവൃത്തിയിലേക്ക് അർഥം ചുരുക്കുന്നില്ല.
- source_word: μοιχοὺς
  choice: വ്യഭിചാരികൾ
  rationale: വിവാഹവിശ്വസ്തത ലംഘിക്കുന്നവരെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്ന പദമായതിനാൽ വിശാലമായ മുൻവിഭാഗത്തിൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: κρινεῖ
  choice: ന്യായംവിധിക്കും
  rationale: ഭാവികാല ദൈവിക ന്യായവിധിയെ സൂചിപ്പിക്കുന്നു. ‘ശിക്ഷിക്കും’ എന്നതിനെക്കാൾ ‘ന്യായംവിധിക്കും’ മൂലപദത്തിന്റെ ഫലം മുൻകൂട്ടി നിർണയിക്കാതെ അർഥം സൂക്ഷിക്കുന്നു.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻപുള്ള പ്രബോധനത്തിന് ദൈവിക ന്യായവിധി അടിസ്ഥാനകാരണമാണെന്ന് വ്യക്തമാക്കുന്ന യുക്തിബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ആദ്യ ഉപവാക്യം പ്രസ്താവനയാണോ പ്രബോധനമാണോ
  choice: ‘വിവാഹം ... ആദരിക്കപ്പെടട്ടെ’ എന്ന പ്രബോധനരൂപം
  alternative: ‘വിവാഹം എല്ലാവരുടെയും ഇടയിൽ ആദരണീയമാണ്’ എന്ന പ്രസ്താവനാരൂപം
  rationale: ഗ്രീക്കിൽ വ്യക്തമായ സമാപകക്രിയ ഇല്ലാത്തതിനാൽ രണ്ടു വായനകളും വ്യാകരണപരമായി സാധ്യമാണ്. എബ്രായർ 13-ലെ തുടർച്ചയായ നൈതിക ആഹ്വാനങ്ങളോട് പ്രബോധനരൂപം കൂടുതൽ ചേരുന്നു; യഥാർഥ അവ്യക്തത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: ἐν πᾶσιν എന്നതിന്റെ ബന്ധം
  choice: ‘എല്ലാവരുടെയും ഇടയിൽ’
  alternative: ‘എല്ലാവരാലും’
  rationale: ഇരുവായനകളും വ്യക്തികളെ സൂചിപ്പിക്കാം. പ്രധാനപാഠം വിവാഹത്തിന് സർവസാമൂഹികമായി ലഭിക്കേണ്ട ആദരത്തെ മുൻനിർത്തുന്നു; ഓരോ വ്യക്തിയും അതിനെ ആദരിക്കണമെന്ന വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. ‘വിവാഹശയ്യ’ എന്ന ബൈബിൾസഹജമായെങ്കിലും ഇന്നും ഗ്രാഹ്യമായ പ്രയോഗം ദാമ്പത്യബന്ധത്തിന്റെ സൂചന മാന്യമായി നിലനിർത്തുന്നു. ‘ലൈംഗിക അധാർമികത’ πόρνος എന്ന വിശാല വിഭാഗത്തെ അനാവശ്യമായി ചുരുക്കാതെ നൽകുന്നു.
