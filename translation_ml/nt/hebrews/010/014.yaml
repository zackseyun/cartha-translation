  text: μιᾷ γὰρ προσφορᾷ τετελείωκεν εἰς τὸ διηνεκὲς τοὺς ἁγιαζομένους.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/014.yaml
  text: For by one offering he has perfected for all time those who are being sanctified[a].
translation:
  language: ml
  text: എന്തെന്നാൽ, ഒരു വഴിപാടിനാൽ അവൻ വിശുദ്ധീകരിക്കപ്പെടുന്നവരെ എന്നേക്കുമായി പൂർണരാക്കിയിരിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വിശുദ്ധരാക്കപ്പെടുന്നവരെ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: μιᾷ
  choice: ഒരൊറ്റ
  rationale: പ്രസφορᾷ എന്ന നാമത്തെ വിശേഷിപ്പിക്കുന്ന ഏകവചന സംഖ്യയാണ്. സന്ദർഭത്തിൽ വഴിപാടിന്റെ ഏകത്വത്തിന് ഊന്നൽ നൽകാൻ ‘ഒരൊറ്റ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാദത്തിന്റെ വിശദീകരണകാരണം അവതരിപ്പിക്കുന്ന ബന്ധകമായതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ ‘എന്തെന്നാൽ’ ഉപയോഗിച്ചു.
- source_word: προσφορᾷ
  choice: വഴിപാടിലൂടെ
  rationale: ദൈവത്തിനു സമർപ്പിക്കുന്ന വഴിപാട് എന്ന വിശാലമായ അർഥം നിലനിർത്തുന്നു; ‘യാഗം’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് ഈ സ്ഥാനത്ത് അല്പം കൂടുതൽ വ്യാഖ്യാനാത്മകമായിരിക്കും. ഗ്രീക്കിലെ ദത്തിവ് ഇവിടെ മാർഗം സൂചിപ്പിക്കുന്നതിനാൽ ‘-ലൂടെ’ ഉപയോഗിച്ചു.
- source_word: τετελείωκεν
  choice: പൂർണരാക്കിയിരിക്കുന്നു
  rationale: പൂർത്തിയായ പ്രവൃത്തിയും അതിന്റെ നിലനിൽക്കുന്ന ഫലവും സൂചിപ്പിക്കുന്ന perfect രൂപത്തിന്റെ ബലം മലയാളത്തിലെ ‘-യിരിക്കുന്നു’ ഘടനയിലൂടെ നിലനിർത്തി. എബ്രായലേഖനത്തിലെ ‘പൂർണത’ എന്ന പ്രമേയബന്ധവും സംരക്ഷിക്കുന്നു.
- source_word: εἰς τὸ διηνεκές
  choice: എന്നേക്കുമായി
  rationale: ഒരിക്കൽ നടന്ന വഴിപാടിന്റെ ഫലം നിരന്തരം നിലനിൽക്കുന്നു എന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: τοὺς ἁγιαζομένους
  choice: വിശുദ്ധീകരിക്കപ്പെട്ടുകൊണ്ടിരിക്കുന്നവരെ
  rationale: വർത്തമാനകാല കർമണി പങ്കാളിത്തരൂപത്തിലെ തുടരുന്ന ഭാവം നിലനിർത്താൻ ‘-പ്പെട്ടുകൊണ്ടിരിക്കുന്ന’ രൂപം ഉപയോഗിച്ചു. ‘വിശുദ്ധീകരിക്കുക’ എന്നത് ഈ സന്ദർഭത്തിലെ ദൈവിക വിശുദ്ധീകരണപ്രവൃത്തിയെ കൃത്യമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: പൂർത്തിയായ പൂർണീകരണവും തുടരുന്ന വിശുദ്ധീകരണവും തമ്മിലുള്ള ബന്ധം
  choice: ‘പൂർണരാക്കിയിരിക്കുന്നു’ എന്ന പൂർത്തിയായ, നിലനിൽക്കുന്ന ഫലത്തോടൊപ്പം ‘വിശുദ്ധീകരിക്കപ്പെട്ടുകൊണ്ടിരിക്കുന്നവരെ’ എന്ന തുടരുന്ന രൂപവും നിലനിർത്തി.
  alternative: ഇരുവശങ്ങളിലൊന്നിലേക്ക് മാത്രം വാക്യത്തെ ചുരുക്കി, ‘വിശുദ്ധരാക്കിയവരെ’ എന്നോ പൂർത്തിയായ ഫലത്തെ ദുർബലപ്പെടുത്തുന്ന പുരോഗമനരൂപമെന്നോ പരിഭാഷപ്പെടുത്തുക.
  rationale: τετελείωκεν പൂർത്തിയായതും നിലനിൽക്കുന്നതുമായ ഫലം സൂചിപ്പിക്കുമ്പോൾ ἁγιαζομένους തുടരുന്ന കർമണി ഭാവം സൂചിപ്പിക്കുന്നു. ഗ്രീക്ക് പാഠത്തിലെ ഈ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം ഏതെങ്കിലും സിദ്ധാന്തരീതിയിലേക്ക് ഒതുക്കാതെ പരിഭാഷയിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘വിശുദ്ധീകരിക്കപ്പെട്ടുകൊണ്ടിരിക്കുന്നവരെ’ എന്ന രൂപം അല്പം സാന്ദ്രമാണെങ്കിലും ഗ്രീക്കിലെ വർത്തമാന കർമണി ഭാവം കൃത്യമായി നിലനിർത്തുന്നതിനായി സ്വീകരിച്ചു; കൂടുതൽ സുതാര്യമായ പദപ്രയോഗം അടിക്കുറിപ്പിൽ നൽകി.
