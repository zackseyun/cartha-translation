  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁλοκαυτώματα καὶ περὶ ἁμαρτίας οὐκ εὐδόκησας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/006.yaml
  text: In whole burnt offerings and sin offerings you took no pleasure[a].
translation:
  language: ml
  text: സർവാംഗദഹനയാഗങ്ങളിലും പാപയാഗങ്ങളിലും നീ പ്രസാദിച്ചില്ല[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “സർവാംഗദഹനയാഗങ്ങളിലും പാപത്തിനുവേണ്ടിയുള്ള യാഗങ്ങളിലും നീ പ്രസാദിച്ചില്ല.” ഗ്രീക്കിലെ περὶ ἁμαρτίας യാഗസന്ദർഭത്തിൽ പാപത്തിനുവേണ്ടി അർപ്പിക്കുന്ന യാഗത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁλοκαυτώματα
  choice: സർവാംഗദഹനയാഗങ്ങൾ
  rationale: തീയിൽ പൂർണമായി ദഹിപ്പിച്ചിരുന്ന പ്രത്യേക യാഗവിഭാഗത്തെ വ്യക്തമാക്കുന്നു; പൊതുവായ ‘ഹോമയാഗങ്ങൾ’ എന്നതിനെക്കാൾ മൂലപദത്തിന്റെ സമ്പൂർണദഹന ആശയം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: καὶ
  choice: -ഉം ... -ഉം
  rationale: രണ്ട് യാഗവിഭാഗങ്ങളെയും സ്വാഭാവികമായ മലയാള സമുച്ചയഘടനയിൽ ബന്ധിപ്പിക്കുന്നു.
- source_word: περὶ ἁμαρτίας
  choice: പാപയാഗങ്ങൾ
  rationale: യാഗസന്ദർഭത്തിൽ ‘പാപത്തിനുവേണ്ടിയുള്ള യാഗം’ എന്ന അർഥമുള്ള സാങ്കേതിക പ്രയോഗമാണിത്; മലയാളത്തിൽ ‘പാപയാഗം’ സംക്ഷിപ്തവും സന്ദർഭോചിതവുമാണ്.
- source_word: οὐκ
  choice: ഇല്ല
  rationale: εὐδόκησας എന്ന ക്രിയയോടു ചേർത്ത് നിഷേധം പൂർണമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: εὐδόκησας
  choice: നീ പ്രസാദിച്ചില്ല
  rationale: ദൈവത്തോടുള്ള ഏകവചന അഭിസംബോധന നിലനിർത്തുകയും ‘അംഗീകരിച്ച് സന്തോഷിക്കുക/തൃപ്തിപ്പെടുക’ എന്ന വിലയിരുത്തൽഭാവം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ അറിയിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: സങ്കീർത്തനം 40:6-ലെ ഗ്രീക്ക് രൂപം ഉദ്ധരിക്കുന്ന എബ്രായർ 10-ന്റെ വാദത്തിൽ യാഗപദങ്ങളുടെ വിവർത്തനം
  choice: ‘സർവാംഗദഹനയാഗങ്ങൾ’, ‘പാപയാഗങ്ങൾ’ എന്നീ പ്രത്യേക യാഗവിഭാഗങ്ങൾ നിലനിർത്തി.
  alternative: ‘ഹോമയാഗങ്ങളും പാപത്തിനുവേണ്ടിയുള്ള യാഗങ്ങളും’ അല്ലെങ്കിൽ പൊതുവായി ‘യാഗങ്ങൾ’
  rationale: മോശൈക യാഗങ്ങളിലെ പ്രത്യേക വിഭാഗങ്ങളെയും പുത്രന്റെ അനുസരണപൂർവമായ സ്വയംസമർപ്പണത്തെയും തമ്മിൽ താരതമ്യം ചെയ്യുന്ന സന്ദർഭമായതിനാൽ, പൊതുവാക്കാതെ മൂലത്തിലെ യാഗസവിശേഷത സംരക്ഷിക്കുന്നു; അതേസമയം അധികമായ സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. പ്രത്യേക യാഗപദങ്ങൾ സന്ദർഭത്തിന്റെ കൃത്യതയ്ക്കായി നിലനിർത്തിയിരിക്കുന്നു; അടിക്കുറിപ്പ് പ്രധാനപാഠത്തിലെ [a] ചിഹ്നവുമായി പൊരുത്തപ്പെടുന്നു.
