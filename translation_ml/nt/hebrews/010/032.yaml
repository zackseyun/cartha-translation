id: HEB.10.32
reference: Hebrews 10:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀναμιμνῄσκεσθε δὲ τὰς πρότερον ἡμέρας, ἐν αἷς φωτισθέντες πολλὴν ἄθλησιν ὑπεμείνατε παθημάτων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/032.yaml
  text: But remember the former days[a], when, after you were enlightened, you endured a great struggle of sufferings[c][b],
translation:
  language: ml
  text: എന്നാൽ, നിങ്ങൾ വെളിച്ചം ലഭിച്ചശേഷം[a][b] കഷ്ടാനുഭവങ്ങളുടെ വലിയൊരു പോരാട്ടം[c] സഹിച്ചുനിന്ന മുൻകാല നാളുകൾ ഓർക്കുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങൾ വെളിച്ചം ലഭിച്ചപ്പോൾ.’ ഗ്രീക്ക് കൃദ്‌രൂപം പ്രധാനക്രിയയോടൊപ്പം നടന്നതായോ അതിനു മുമ്പ് നടന്നതായോ മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘വെളിച്ചം ലഭിച്ചു’ എന്നത് പൊതുവായി ആത്മീയപ്രകാശം ലഭിച്ചതിനെ സൂചിപ്പിക്കാം; ചിലർ ഇതിനെ മാനസാന്തരം, സ്നാനം, അല്ലെങ്കിൽ വിശ്വാസത്തിലെ ഉപദേശം എന്നിവയുമായി ബന്ധിപ്പിക്കുന്നു.
    reason: alternative_reading
  - marker: c
    text: അഥവാ, ‘കഷ്ടാനുഭവങ്ങളുടെ കഠിനമായ മത്സരം.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന നാമപദത്തിന് പോരാട്ടം അഥവാ മത്സരം എന്ന ഭാവമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναμιμνῄσκεσθε
  choice: ഓർക്കുക
  rationale: വർത്തമാനകാല ആജ്ഞാരൂപത്തിന്റെ പ്രബോധനശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; ഓർത്തുകൊണ്ടിരിക്കുക എന്ന തുടർച്ചാഭാവം സന്ദർഭത്തിൽ അന്തർലീനമാണ്.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻപുള്ള മുന്നറിയിപ്പിൽനിന്ന് പഴയ വിശ്വസ്തത ഓർമിപ്പിക്കുന്ന പ്രബോധനത്തിലേക്കുള്ള മൃദുവായ വിരുദ്ധമാറ്റം സൂചിപ്പിക്കുന്നു.
- source_word: τὰς πρότερον ἡμέρας
  choice: ആ പഴയ നാളുകൾ
  rationale: മുൻകാല അനുഭവങ്ങളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും മാന്യവുമായ മലയാളപ്രയോഗം.
- source_word: ἐν αἷς
  choice: ആ ... നാളുകൾ
  rationale: അക്ഷരാർഥമായ ‘അവയിൽ’ എന്നതിനു പകരം ബന്ധവാക്യഘടനയിലൂടെ കാലസൂചന സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: φωτισθέντες
  choice: നിങ്ങൾ പ്രകാശിതരായശേഷം
  rationale: ആത്മീയ വെളിച്ചത്തിന്റെ മൂലരൂപകം നിലനിർത്തുകയും, പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ളതായി പങ്കുവിനയുടെ പ്രവർത്തനം വായിക്കാവുന്ന വിധം നൽകുകയും ചെയ്യുന്നു.
- source_word: πολλὴν ἄθλησιν
  choice: വലിയൊരു പോരാട്ടം
  rationale: ἄθλησις എന്ന പദത്തിലെ മത്സരം/പോരാട്ടം എന്ന ഭാവവും πολλήν സൂചിപ്പിക്കുന്ന തീവ്രതയും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ὑπεμείνατε
  choice: സഹിച്ചുനിന്ന
  rationale: കഷ്ടതയ്ക്കിടയിലും പിന്മാറാതെ നിലനിന്നത് എന്ന ὑπομένωയുടെ അർഥം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: παθημάτων
  choice: കഷ്ടാനുഭവങ്ങൾ നിറഞ്ഞ
  rationale: പോരാട്ടത്തിന്റെ സ്വഭാവം കഷ്ടാനുഭവങ്ങളാൽ നിർണയിക്കപ്പെട്ടതാണെന്ന ജനിറ്റീവ് ബന്ധം സുഗമമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: മുന്നറിയിപ്പിന്റെയും പ്രബോധനത്തിന്റെയും പശ്ചാത്തലത്തിൽ φωτισθέντες എന്നതിന്റെ അർഥം
  choice: ‘പ്രകാശിതരായ’ എന്ന രൂപകപ്രയോഗം നിലനിർത്തി
  alternative: മാനസാന്തരപ്പെട്ടശേഷം / സ്നാനം സ്വീകരിച്ചശേഷം / സുവിശേഷത്തിന്റെ വെളിച്ചം ലഭിച്ചശേഷം
  rationale: ഈ പദം ആത്മീയമായ പ്രകാശലബ്ധിയെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, അത് മാനസാന്തരം, സ്നാനം, വിശ്വാസപഠനം എന്നിവയിൽ ഏതെങ്കിലുമൊന്നാണെന്ന് വാക്യം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ പ്രബോധനശൈലി. ‘പ്രകാശിതരായ’ എന്ന ബൈബിൾസഹജ രൂപകം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തിയിരിക്കുന്നു; ‘സഹിച്ചുനിന്ന’ എന്നത് ദീർഘക്ഷമയോടെ ഉറച്ചുനിന്ന ഭാവം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
