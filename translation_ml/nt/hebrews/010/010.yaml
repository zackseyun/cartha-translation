source:
  edition: SBLGNT
  text: ἐν ᾧ θελήματι ἡγιασμένοι ⸀ἐσμὲν διὰ τῆς προσφορᾶς τοῦ σώματος Ἰησοῦ Χριστοῦ ἐφάπαξ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/010.yaml
  text: By that will we have been sanctified through the offering of the body of Jesus the Messiah once for all[a][b].
translation:
  language: ml
  text: ആ ഇഷ്ടത്താൽ[a], മശീഹയായ യേശുവിന്റെ ശരീരം ഒരിക്കലെന്നേക്കുമായി അർപ്പിച്ചതിലൂടെ നാം വിശുദ്ധീകരിക്കപ്പെട്ടിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, ‘ആ ഇഷ്ടത്തിൽ.’ മുൻസന്ദർഭത്തിൽ പറഞ്ഞ ദൈവത്തിന്റെ ഇഷ്ടത്തെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ θελήματι
  choice: ആ ഇഷ്ടത്താൽ
  rationale: മുൻസന്ദർഭത്തിൽ പറഞ്ഞ ദൈവത്തിന്റെ ഇഷ്ടത്തിലേക്കാണ് ഈ പ്രയോഗം തിരിച്ചുചൂണ്ടുന്നത്. അക്ഷരാർഥത്തിലുള്ള ‘ആ ഇഷ്ടത്തിൽ’ എന്നതിനെക്കാൾ ഉപാധി/അടിസ്ഥാനം സൂചിപ്പിക്കുന്ന ‘ആ ഇഷ്ടത്താൽ’ മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: ἡγιασμένοι ἐσμὲν
  choice: നാം വിശുദ്ധീകരിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: പൂർണമായ പ്രവർത്തനവും തുടരുന്ന ഫലവും സൂചിപ്പിക്കുന്ന പരിപ്രാസ്തിക പൂർണകാലത്തിന്റെ ഭാവം ഈ രൂപം നിലനിർത്തുന്നു; പുരോഗമിച്ചുകൊണ്ടിരിക്കുന്ന പ്രവർത്തനമെന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: διὰ τῆς προσφορᾶς
  choice: അർപ്പിച്ചതിലൂടെ
  rationale: ജനിറ്റീവിനോടുകൂടിയ διά ഇവിടെ മാർഗമോ ഉപാധിയോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ക്രിയാനാമസദൃശമായ ഈ പ്രയോഗം ‘അർപ്പണം’ എന്ന അർഥവും ‘മുഖാന്തരം’ എന്ന ബന്ധവും സ്വാഭാവികമായി കൈമാറുന്നു.
- source_word: τοῦ σώματος
  choice: ശരീരം
  rationale: അർപ്പിക്കപ്പെട്ടത് യേശുവിന്റെ ശരീരമാണെന്ന മൂലപാഠത്തിലെ മൂർത്തമായ ഊന്നൽ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: Ἰησοῦ Χριστοῦ
  choice: മശീഹയായ യേശുവിന്റെ
  rationale: Χριστός എന്ന പദത്തിന്റെ സ്ഥാനപ്പേരായ അർഥം ‘മശീഹ’ എന്നു വ്യക്തമാക്കുകയും, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ രീതിയിൽ അത് യേശുവിനോടു ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐφάπαξ
  choice: ഒരിക്കലായി
  rationale: അർപ്പണത്തിന്റെ ഏകവും ആവർത്തിക്കപ്പെടാത്തതുമായ സ്വഭാവം സംക്ഷിപ്തമായും ബൈബിൾസന്ദർഭത്തിന് യോജിച്ചും അറിയിക്കുന്നു.
theological_decisions:
- issue: വിശുദ്ധീകരണത്തിന്റെ കാലഭാവവും ദൈവശാസ്ത്രപരമായ ശക്തിയും
  choice: ‘വിശുദ്ധീകരിക്കപ്പെട്ടിരിക്കുന്നു’ എന്നു നൽകി പൂർത്തിയായ പ്രവർത്തനവും നിലനിൽക്കുന്ന ഫലവും സംരക്ഷിച്ചു
  alternative: ‘വിശുദ്ധീകരിക്കപ്പെടുന്നു’ അല്ലെങ്കിൽ ‘വിശുദ്ധരായിരിക്കുന്നു’
  rationale: ἡγιασμένοι ἐσμὲν പരിപ്രാസ്തിക പൂർണകാലമാണ്; അതിനെ പുരോഗമനവർത്തമാനമായി മാറ്റുകയോ ഏതെങ്കിലും പ്രത്യേക സമ്പ്രദായത്തിന്റെ വിശുദ്ധീകരണസിദ്ധാന്തത്തിലേക്ക് ചുരുക്കുകയോ ചെയ്യാതെ വ്യാകരണഭാവം നിലനിർത്തുന്നു.
- issue: Χριστός എന്ന ക്രിസ്തുശാസ്ത്രപരമായ സ്ഥാനപ്പേര്
  choice: മശീഹയായ യേശു
  alternative: യേശുക്രിസ്തു
  rationale: ഇവിടെ Χριστός സ്ഥാനപ്പേരായി മനസ്സിലാക്കാവുന്നതിനാൽ അതിന്റെ അർഥം സുതാര്യമാക്കുന്നു; പരിചിതമായ ‘ക്രിസ്തു’ എന്ന രൂപവും അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വിശുദ്ധീകരിക്കപ്പെട്ടിരിക്കുന്നു’, ‘അർപ്പിക്കുക’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ദൈവശാസ്ത്രപരമായ ഔപചാരികത നിലനിർത്തുന്നു. അക്ഷരാർഥപരമായ വ്യത്യാസങ്ങളും പരിചിതമായ ക്രിസ്തു/മശീഹ രൂപഭേദവും അടിക്കുറിപ്പുകളിൽ തുറന്നുവെച്ചിരിക്കുന്നു.
