- from: തിരശ്ശീലയിലൂടെ—അതായത്[a], തന്റെ ജഡത്തിലൂടെ[b]—അവൻ നമുക്കായി ഉദ്ഘാടനം ചെയ്ത പുതിയതും ജീവനുള്ളതുമായ വഴി.
  to: അവൻ നമുക്കായി ഉദ്ഘാടനം ചെയ്ത പുതിയതും ജീവനുള്ളതുമായ വഴി—തിരശ്ശീലയിലൂടെ[a], അതായത് തന്റെ ജഡത്തിലൂടെ[b]—
  rationale: 'The revision relocates the curtain phrase so that it naturally qualifies the ‘way,’ while retaining the Greek sequence of the explanatory identification: through the curtain, that is, through his flesh. It also moves footnote a to the word for which its lexical alternative is supplied. No doctrinal interpretation beyond the text''s own metaphor has been added.'
