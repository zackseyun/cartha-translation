  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἣν ἐνεκαίνισεν ἡμῖν ὁδὸν πρόσφατον καὶ ζῶσαν διὰ τοῦ καταπετάσματος, τοῦτ’ ἔστιν τῆς σαρκὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/020.yaml
  text: which he inaugurated for us as a new and living way through the curtain—that is[a], his flesh[b],
translation:
  language: ml
  text: അവൻ നമുക്കായി ഉദ്ഘാടനം ചെയ്ത പുതിയതും ജീവനുള്ളതുമായ വഴി—തിരശ്ശീലയിലൂടെ[a], അതായത് തന്റെ ജഡത്തിലൂടെ[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘മറയിലൂടെ.’'
    reason: καταπέτασμα എന്ന പദത്തിന് ‘തിരശ്ശീല’ എന്നും ‘മറ’ എന്നും പരിഭാഷപ്പെടുത്താം; ആരാധനാസ്ഥലത്തിലെ വേർതിരിക്കുന്ന തിരശ്ശീലയാണ് ഉദ്ദേശ്യം.
  - marker: b
    text: ‘അതായത്, തന്റെ ജഡത്തിലൂടെ’ എന്ന വാക്കുകൾ തിരശ്ശീലയുടെ രൂപകത്തെ യേശുവിന്റെ ജഡവുമായി ബന്ധിപ്പിക്കുന്നു.
    reason: മൂലവാക്യത്തിലെ വിശദീകരണപരമായ സമാനാധികരണം തിരശ്ശീലയെ അവന്റെ ജഡവുമായി തിരിച്ചറിയിക്കുന്നു. മലയാളത്തിൽ മുൻപുള്ള ‘-ലൂടെ’ എന്ന ബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കാനാണ് ഈ രൂപം.
lexical_decisions:
- source_word: ἣν
  choice: ആ വഴി
  rationale: ബന്ധസർവനാമം മുൻവാക്യത്തിലെ പ്രവേശനവുമായി വ്യാകരണപരമായി ബന്ധപ്പെട്ടു നിൽക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ സമ്പൂർണ്ണവാക്യത്തിനായി അതിന്റെ സൂചിതപദമായ ‘വഴി’ വ്യക്തമാക്കി.
- source_word: ἐνεκαίνισεν
  choice: ഉദ്ഘാടനം ചെയ്ത
  rationale: പുതുതായി ഉപയോഗത്തിനായി ആരംഭിക്കുക/പ്രതിഷ്ഠിക്കുക എന്ന ആരാധനാപരമായ സൂക്ഷ്മത നിലനിർത്തുന്നു; ‘തുറന്ന’ എന്നതിനെക്കാൾ മൂലപദത്തിന്റെ അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
- source_word: ἡμῖν
  choice: നമുക്കായി
  rationale: പ്രയോജനസൂചക ദാതിവിനെ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὁδὸν
  choice: വഴി
  rationale: നേരിട്ടും രൂപകമായും ഉപയോഗിക്കാവുന്ന സ്വാഭാവിക മലയാളപദം; ദൈവസന്നിധിയിലേക്കുള്ള പ്രവേശനത്തിന്റെ ദൃശ്യഭാവം നിലനിർത്തുന്നു.
- source_word: πρόσφατον
  choice: പുതിയതുമായ
  rationale: പുതുതായി സ്ഥാപിക്കപ്പെട്ട വഴിയെന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ζῶσαν
  choice: ജീവനുള്ളതുമായ
  rationale: ‘ജീവിക്കുന്ന’ എന്നതിനെക്കാൾ വഴിയെ വിശേഷിപ്പിക്കാൻ സ്വാഭാവികം; ‘ജീവൻ നൽകുന്ന’ എന്നു വ്യാഖ്യാനിച്ച് അർഥം ചുരുക്കുന്നില്ല.
- source_word: διὰ τοῦ καταπετάσματος
  choice: തിരശ്ശീലയിലൂടെ
  rationale: സമാഗമകൂടാരത്തിലെയോ ദേവാലയത്തിലെയോ അകത്തെ തിരശ്ശീലയെ സൂചിപ്പിക്കുന്ന καταπέτασμα സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ പരിഭാഷപ്പെടുത്തി.
- source_word: τοῦτ’ ἔστιν
  choice: അതായത്
  rationale: തുടർന്നുവരുന്ന വിശദീകരണപരമായ സമാനാധികരണത്തെ സ്വാഭാവികമായി പരിചയപ്പെടുത്തുന്നു.
- source_word: τῆς σαρκὸς αὐτοῦ
  choice: തന്റെ ജഡത്തിലൂടെ
  rationale: σάρξ എന്നതിന്റെ ഭൗതിക അർഥം ‘ജഡം’ എന്നു നിലനിർത്തുന്നു. മുൻപുള്ള διάയുടെ ബന്ധം മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘-ത്തിലൂടെ’ ആവർത്തിച്ചു; ‘തന്റെ’ എന്നത് കർത്താവായ അവനിലേക്കുള്ള പ്രത്യാവർത്തനബന്ധം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: തിരശ്ശീലയും അവന്റെ ജഡവും തമ്മിലുള്ള രൂപകബന്ധം
  choice: ‘തിരശ്ശീലയിലൂടെ—അതായത്, തന്റെ ജഡത്തിലൂടെ—’ എന്ന് നൽകി ജഡത്തിലൂടെയുള്ള പ്രവേശനമെന്ന ബന്ധം വ്യക്തമാക്കി.
  alternative: ‘തിരശ്ശീലയിലൂടെ—അതായത്, തന്റെ ജഡം—’
  rationale: ഗ്രീക്കിലെ സമാനാധികരണം തിരശ്ശീലയുടെ രൂപകത്തെ അവന്റെ ജഡവുമായി ബന്ധിപ്പിക്കുന്നു. മലയാളത്തിൽ ആദ്യത്തെ διάയുടെ പ്രാബല്യം വ്യക്തമാക്കാൻ ‘-ത്തിലൂടെ’ ആവർത്തിക്കുന്നത് പ്രവേശനമാർഗത്തിന്റെ ആശയം സംരക്ഷിക്കുന്നു; എന്നാൽ തിരിച്ചറിയൽ എങ്ങനെ കൃത്യമായി പ്രവർത്തിക്കുന്നു എന്ന ദൈവശാസ്ത്രപരമായ സംഘർഷം കൂടുതൽ വിശദീകരിച്ച് തീർപ്പാക്കുന്നില്ല.
- issue: σάρξ എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ജഡം
  alternative: ശരീരം
  rationale: ഇവിടെ യേശുവിന്റെ ഭൗതിക മാനുഷികതയെ സൂചിപ്പിക്കുന്നതിനാൽ മൂലപദത്തോട് സുതാര്യമായ ‘ജഡം’ സ്വീകരിച്ചു; ‘പാപസ്വഭാവം’ പോലുള്ള വ്യാഖ്യാനപരമായ അർഥം ഇറക്കുമതി ചെയ്തില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഈ വാക്യം മുൻവാക്യത്തെ ആശ്രയിക്കുന്നതിനാൽ മലയാളത്തിൽ ‘വഴി’ കേന്ദ്രമാക്കി സ്വാഭാവിക സമ്പൂർണ്ണവാക്യക്രമം സ്വീകരിച്ചു; ‘ഉദ്ഘാടനം’ ആരാധനാപരമായ സൂക്ഷ്മത സംരക്ഷിക്കുന്നു.
