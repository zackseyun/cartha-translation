- from: വിശ്വാസത്തിന്റെ പൂർണനിശ്ചയത്തോടെ, പരമാർഥമായ ഹൃദയവുമായി നമുക്ക് അടുത്തുചെല്ലാം; നമ്മുടെ ഹൃദയങ്ങൾ ദുഷ്ടമനസ്സാക്ഷിയിൽനിന്ന് തളിക്കപ്പെട്ട് ശുദ്ധീകരിക്കപ്പെട്ടവയും നമ്മുടെ ശരീരം ശുദ്ധജലത്തിൽ കഴുകപ്പെട്ടതുമായിരിക്കട്ടെ.[a][b][c]
  to: സത്യഹൃദയത്തോടെ, വിശ്വാസത്തിന്റെ പൂർണ ഉറപ്പോടെ, ദുഷ്ടമായ മനസ്സാക്ഷിയിൽനിന്ന് നമ്മുടെ ഹൃദയങ്ങൾ തളിക്കപ്പെട്ടും നമ്മുടെ ശരീരങ്ങൾ ശുദ്ധജലത്താൽ കഴുകപ്പെട്ടും ഇരിക്കെ, നമുക്ക് അടുത്തു ചെല്ലാം.[a][b][c]
  rationale: The revision restores the Greek syntax by making both perfect passive participles (“having been sprinkled” and “having been washed”) concomitant qualifiers of “let us draw near.” It removes the redundant explicit “purified,” uses a more accurate modern Malayalam equivalent for “true heart,” and retains the source’s ambiguity about the precise referent of the washing. Footnote markers are placed at the relevant translated expressions and all supplied markers have corresponding notes.
