source:
  edition: SBLGNT
  text: προσερχώμεθα μετὰ ἀληθινῆς καρδίας ἐν πληροφορίᾳ πίστεως, ῥεραντισμένοι τὰς καρδίας ἀπὸ συνειδήσεως πονηρᾶς καὶ λελουσμένοι τὸ σῶμα ὕδατι καθαρῷ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/022.yaml
  text: let us draw near with a true heart in full assurance of faith[d][c][b][a], with our hearts sprinkled clean from an evil conscience and our bodies washed with pure water.
translation:
  language: ml
  text: സത്യഹൃദയത്തോടെ, വിശ്വാസത്തിന്റെ പൂർണ ഉറപ്പോടെ, ദുഷ്ടമായ മനസ്സാക്ഷിയിൽനിന്ന് നമ്മുടെ ഹൃദയങ്ങൾ തളിക്കപ്പെട്ടും നമ്മുടെ ശരീരങ്ങൾ ശുദ്ധജലത്താൽ കഴുകപ്പെട്ടും ഇരിക്കെ, നമുക്ക് അടുത്തു ചെല്ലാം.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആത്മാർഥമായ ഹൃദയത്തോടെ.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “കുറ്റബോധമുള്ള മനസ്സാക്ഷിയിൽനിന്ന്.”
    reason: lexical_alternative
  - marker: c
    text: ഇവിടത്തെ ദൃശ്യഭാഷ ആചാരപരമായ ശുദ്ധീകരണത്തെ ഓർമ്മിപ്പിക്കുന്നു; ചില വായനക്കാർക്ക് ഇതിൽ സ്നാനത്തിന്റെ പ്രതിധ്വനിയും കേൾക്കാം. എന്നാൽ ഈ വാക്യം കഴുകൽ എന്താണെന്ന് വ്യക്തമായി പറയുന്നില്ല.
    reason: cultural_note
lexical_decisions:
- source_word: προσερχώμεθα
  choice: നമുക്ക് അടുത്തുചെല്ലാം
  rationale: വർത്തമാനകാല മധ്യമ hortatory subjunctive-ന്റെ ആഹ്വാനഭാവവും ദൈവസന്നിധിയിലേക്കുള്ള പ്രവേശനസന്ദർഭവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἀληθινῆς καρδίας
  choice: പരമാർഥമായ ഹൃദയവുമായി
  rationale: ἀληθινός എന്നതിലെ സത്യവും യാഥാർഥ്യവും ആത്മാർഥതയും ഉൾക്കൊള്ളുന്നു; ‘ആത്മാർഥമായ’ എന്ന പരിമിതമായ വ്യാഖ്യാനത്തിലേക്ക് മാത്രം ചുരുക്കുന്നില്ല.
- source_word: ἐν πληροφορίᾳ πίστεως
  choice: വിശ്വാസത്തിന്റെ പൂർണനിശ്ചയത്തോടെ
  rationale: πληροφορία സൂചിപ്പിക്കുന്ന പൂർണമായ ഉറപ്പും πίστις എന്നതിന്റെ വിശ്വാസാർഥവും വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ῥεραντισμένοι τὰς καρδίας ἀπὸ συνειδήσεως πονηρᾶς
  choice: നമ്മുടെ ഹൃദയങ്ങൾ ദുഷ്ടമനസ്സാക്ഷിയിൽനിന്ന് തളിക്കപ്പെട്ട് ശുദ്ധീകരിക്കപ്പെട്ടവയും
  rationale: പൂർണകാല നിഷ്ക്രിയ കൃദന്തത്തിന്റെ പൂർത്തിയായ ശുദ്ധീകരണാവസ്ഥയും തളിക്കൽ എന്ന ആചാരപരമായ ദൃശ്യവും ἀπό സൂചിപ്പിക്കുന്ന വേർതിരിക്കലും നിലനിർത്തുന്നു.
- source_word: λελουσμένοι τὸ σῶμα ὕδατι καθαρῷ
  choice: നമ്മുടെ ശരീരം ശുദ്ധജലത്തിൽ കഴുകപ്പെട്ടതുമായിരിക്കട്ടെ
  rationale: ഗ്രീക്കിലെ ഏകവചനമായ ശരീരം നിലനിർത്തുകയും പൂർണകാല കൃദന്തം സൂചിപ്പിക്കുന്ന കഴുകപ്പെട്ട അവസ്ഥ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: കഴുകൽ എന്ന ഭാഷയെ ക്രിസ്തീയ സ്നാനമായി വ്യക്തമായി തിരിച്ചറിയിക്കണമോ
  choice: പ്രധാനപാഠത്തിൽ ശുദ്ധീകരണദൃശ്യം നിലനിർത്തി സ്നാനം എന്ന് വ്യക്തമാക്കാതിരിക്കുന്നു
  alternative: ഇത് സ്നാനകഴുകലാണെന്ന് നേരിട്ട് പരിഭാഷപ്പെടുത്തുക
  rationale: വാക്യം ആചാരപരമായ ശുദ്ധീകരണത്തെയും സ്നാനത്തെയും ഓർമ്മിപ്പിച്ചേക്കാം; എന്നാൽ കഴുകൽ എന്താണെന്ന് അത് വ്യക്തമായി നിർവചിക്കുന്നില്ല.
- issue: συνειδήσεως πονηρᾶς എന്നത് കുറ്റബോധമുള്ള മനസ്സാക്ഷി എന്നാക്കണമോ
  choice: ദുഷ്ടമനസ്സാക്ഷി
  alternative: കുറ്റബോധമുള്ള മനസ്സാക്ഷി
  rationale: πονηρός എന്നതിന്റെ വിശാലമായ ധാർമിക അർഥം നിലനിർത്തുകയും കുറ്റബോധം എന്ന ഒറ്റ മനശ്ശാസ്ത്രപരമായ അർഥത്തിലേക്ക് ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘പരമാർഥമായ’ എന്നത് ἀληθινός എന്നതിലെ ‘യഥാർഥം/സത്യം/ആത്മാർഥത’ എന്ന പരിധി സംരക്ഷിക്കുന്നു. കൃദന്തങ്ങളുടെ സമാന്തരഘടന മലയാളത്തിൽ വായനാസൗകര്യത്തിനായി ‘...വയും ...തുമായിരിക്കട്ടെ’ എന്ന രൂപത്തിൽ അവതരിപ്പിച്ചു.
