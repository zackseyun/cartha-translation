lexical_decisions:
- source_word: Ἔχοντες
  choice: നമുക്കുള്ളതിനാൽ
  rationale: രൂപത്തിൽ ഒരു കൃദന്തരൂപമാണെങ്കിലും, തുടർന്നുവരുന്ന ആഹ്വാനത്തിന്റെ അടിസ്ഥാനമാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്. അതിനാൽ ‘നമുക്കുള്ളതിനാൽ’ എന്നു നൽകുന്നത് ഗ്രീക്കിലെ ആശ്രിതഘടനയും കാരണാർഥവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനബന്ധം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചന സംബോധനയുടെ രൂപം നിലനിർത്തുന്നു; ഇത് സഭാസമൂഹത്തെ മുഴുവനായി പ്രതിനിധാനപരമായി അഭിസംബോധന ചെയ്തിരിക്കാമെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: παρρησίαν
  choice: ധൈര്യം
  rationale: ദൈവസന്നിധിയിലേക്കു സ്വതന്ത്രവും ഉറപ്പോടെയും സമീപിക്കാനുള്ള ശക്തമായ ആത്മവിശ്വാസത്തെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: εἰς τὴν εἴσοδον
  choice: പ്രവേശിക്കാനുള്ള
  rationale: ‘പ്രവേശനം ലക്ഷ്യമാക്കിയുള്ള’ എന്ന നാമപദപ്രയോഗത്തിന്റെ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായ ക്രിയാധിഷ്ഠിത രൂപത്തിൽ നൽകുന്നു.
- source_word: τῶν ἁγίων
  choice: വിശുദ്ധസ്ഥലങ്ങളിലേക്കു
  rationale: എബ്രായലേഖനത്തിലെ കൂടാര-ആരാധനാസന്ദർഭത്തിൽ ദൈവസാന്നിധ്യത്തിന്റെ വിശുദ്ധമേഖലകളെയാണ് സൂചിപ്പിക്കുന്നത്. ബഹുവചനസ്വഭാവം നിലനിർത്തുകയും ‘അതിവിശുദ്ധസ്ഥലം’ എന്ന കൂടുതൽ സങ്കുചിതമായ വ്യാഖ്യാനം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: ἐν τῷ αἵματι Ἰησοῦ
  choice: യേശുവിന്റെ രക്തത്താൽ
  rationale: പ്രവേശനത്തിന്റെ മാർഗമോ അടിസ്ഥാനമോ യേശുവിന്റെ ബലിമരണരക്തമാണെന്ന അർഥം അധികവ്യാഖ്യാനം ചേർക്കാതെ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: τῶν ἁγίων എന്നതിന്റെ വ്യാപ്തി
  choice: ദൈവസാന്നിധ്യത്തിന്റെ വിശുദ്ധസ്ഥലങ്ങളെ സൂചിപ്പിക്കുന്ന ആരാധനാപരവും സ്ഥലപരവുമായ പ്രയോഗം
  alternative: വിശുദ്ധമന്ദിരം; അതിവിശുദ്ധസ്ഥലം; വിശുദ്ധന്മാർ
  rationale: എബ്രായലേഖനത്തിലെ തുടർച്ചയായ കൂടാര-ബലിദാന ചിത്രണം സ്ഥലപരമായ അർഥത്തെ പിന്തുണയ്ക്കുന്നു. ‘വിശുദ്ധന്മാർ’ സന്ദർഭത്തിന് യോജിക്കുന്നില്ല; ‘അതിവിശുദ്ധസ്ഥലം’ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ വ്യാപ്തി അനാവശ്യമായി ചുരുക്കും.
- issue: ἀδελφοί എന്ന സംബോധനയുടെ പ്രതിനിധാനപരമായ വ്യാപ്തി
  choice: പ്രധാനവാചകത്തിൽ ‘സഹോദരന്മാരേ’ നിലനിർത്തി, മുഴുവൻ സഭാസമൂഹത്തെയും ഉൾക്കൊള്ളാമെന്നത് അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുക
  alternative: സഹോദരീസഹോദരന്മാരേ; സഹോദരങ്ങളേ
  rationale: മൂലത്തിലെ വ്യാകരണപരമായ പുല്ലിംഗരൂപം പ്രധാനവാചകത്തിൽ സംരക്ഷിക്കുമ്പോഴും അതിന്റെ സാധ്യതയുള്ള ഉൾക്കൊള്ളുന്ന അഭിസംബോധന അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. വാക്യം അടുത്ത വാക്യങ്ങളിലെ ആഹ്വാനത്തിലേക്കു തുടരുമെന്ന മൂലഘടന കാണിക്കാൻ അവസാനം അൽപവിരാമം നിലനിർത്തി. ‘യേശുവിന്റെ രക്തത്താൽ’ എന്ന ഘടകം പ്രവേശനത്തോടു ചേർത്ത് മലയാളത്തിലെ സ്വാഭാവിക പദക്രമത്തിൽ നൽകി.
