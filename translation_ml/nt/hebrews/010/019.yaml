  text: അതുകൊണ്ട്, സഹോദരന്മാരേ[a], യേശുവിന്റെ രക്തത്താൽ വിശുദ്ധസ്ഥലങ്ങളിലേക്കു[b] പ്രവേശിക്കാനുള്ള ധൈര്യം നമുക്കുള്ളതിനാൽ,
