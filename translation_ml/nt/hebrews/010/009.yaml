id: HEB.10.9
reference: Hebrews 10:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τότε εἴρηκεν· Ἰδοὺ ἥκω τοῦ ⸀ποιῆσαι τὸ θέλημά σου· ἀναιρεῖ τὸ πρῶτον ἵνα τὸ δεύτερον στήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/009.yaml
  text: Then he said[a], ‘Behold, I have come to do your will.’ He takes away the first so that he may establish the second.
translation:
  language: ml
  text: 'പിന്നെ അവൻ പറഞ്ഞു: “ഇതാ, നിന്റെ ഇഷ്ടം നിറവേറ്റാൻ ഞാൻ വന്നിരിക്കുന്നു.” രണ്ടാമത്തേത് സ്ഥാപിക്കാനായി അവൻ ആദ്യത്തേത് നീക്കിക്കളയുന്നു.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘രണ്ടാമത്തേത് സ്ഥാപിക്കുന്നതിനായി അവൻ ആദ്യത്തേത് നീക്കുന്നു’ എന്നും വിവർത്തനം ചെയ്യാം. ഇവിടെ ‘ആദ്യത്തേത്’, ‘രണ്ടാമത്തേത്’ എന്നിവ യഥാക്രമം ബലിയർപ്പണങ്ങളുടെ ആദ്യ ക്രമത്തെയും മശീഹയുടെ അർപ്പണത്തിൽ ദൈവത്തിന്റെ ഇഷ്ടം നിറവേറുന്ന രണ്ടാമത്തെ യാഥാർഥ്യത്തെയും സൂചിപ്പിക്കുന്നതാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: പിന്നെ
  rationale: മുൻ ഉദ്ധരണിയോടും തുടർന്നുള്ള വാദത്തോടും ഉള്ള ക്രമബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: εἴρηκεν
  choice: അവൻ പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ പൂർണകാലത്തിന് മുൻപു പറഞ്ഞ വാക്കിന്റെ നിലനിൽക്കുന്ന പ്രസക്തിയുണ്ടെങ്കിലും, τότεയോടൊപ്പം മലയാളത്തിൽ ലളിതമായ ഭൂതകാലം സ്വാഭാവികമാണ്; തിരുവെഴുത്തിന്റെ ഇപ്പോഴത്തെ പ്രസക്തി സന്ദർഭം നൽകുന്നു.
- source_word: Ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്നതും തിരുവെഴുത്തുശൈലിയുടെ ഗൗരവം നിലനിർത്തുന്നതുമായ സ്വാഭാവിക മലയാള സമാനപദം.
- source_word: ἥκω
  choice: ഞാൻ വന്നിരിക്കുന്നു
  rationale: വന്നെത്തിയതും ഇപ്പോഴും സന്നിഹിതനായിരിക്കുന്നതുമായ അർഥഭാവം മലയാളത്തിലെ പൂർണവർത്തമാനരൂപം നന്നായി പകർന്നു നൽകുന്നു.
- source_word: τοῦ ποιῆσαι
  choice: നിറവേറ്റാൻ
  rationale: ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു; ദൈവഹിതം വെറും പ്രവൃത്തിയായി ചെയ്യുക എന്നതിലുപരി അനുസരണയിലൂടെ സാക്ഷാത്കരിക്കുക എന്ന സന്ദർഭബലം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὸ θέλημά σου
  choice: നിന്റെ ഇഷ്ടം
  rationale: θέλημα എന്നത് ആഗ്രഹം, ഉദ്ദേശ്യം, ഹിതം എന്നിവ ഉൾക്കൊള്ളുന്നു; ദൈവത്തോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയിൽ ‘നിന്റെ ഇഷ്ടം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: ἀναιρεῖ
  choice: നീക്കിക്കളഞ്ഞിട്ട്
  rationale: ആദ്യത്തേതിനെ മാറ്റിനിർത്തുക/ഇല്ലാതാക്കുക എന്ന സന്ദർഭാർഥം നൽകുന്നു; ‘റദ്ദാക്കുന്നു’ എന്ന നിയമപരമായ അധികവ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
- source_word: τὸ πρῶτον
  choice: ആദ്യത്തേത്
  rationale: ഗ്രീക്കിലെ നാമവൽക്കരിച്ച വിശേഷണത്തിന്റെ സംക്ഷിപ്തത നിലനിർത്തുകയും അതിന്റെ കൃത്യമായ സൂചന സന്ദർഭത്തിന് വിട്ടുകൊടുക്കുകയും ചെയ്യുന്നു.
- source_word: ἵνα
  choice: -യിട്ട്
  rationale: ആദ്യത്തേത് നീക്കുന്നതും രണ്ടാമത്തേത് സ്ഥാപിക്കുന്നതും തമ്മിലുള്ള ഉദ്ദേശ്യബന്ധം സ്വാഭാവിക മലയാള ക്രിയാസന്ധിയിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: τὸ δεύτερον
  choice: രണ്ടാമത്തേത്
  rationale: ‘ആദ്യത്തേത്’ എന്നതിനോടുള്ള സമാന്തരതയും മൂലപാഠത്തിന്റെ ഉദ്ദേശപൂർവമായ സംക്ഷിപ്തതയും നിലനിർത്തുന്നു.
- source_word: στήσῃ
  choice: സ്ഥാപിക്കുന്നു
  rationale: നിലവിൽ വരുത്തുക, ഉറപ്പിക്കുക എന്ന അർഥം സന്ദർഭത്തിന് യോജിച്ച ഗൗരവമുള്ള മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ‘ആദ്യത്തേത്’, ‘രണ്ടാമത്തേത്’ എന്നിവയുടെ സൂചന
  choice: മുഖ്യപാഠത്തിൽ ഗ്രീക്കിലെ സംക്ഷിപ്തമായ ‘ആദ്യത്തേത്’, ‘രണ്ടാമത്തേത്’ എന്ന രൂപം നിലനിർത്തി; അടിക്കുറിപ്പിൽ ബലിയർപ്പണങ്ങളുടെ ആദ്യ ക്രമവും മശീഹയുടെ അർപ്പണത്തിൽ നിറവേറിയ ദൈവഹിതവും സാധ്യതയുള്ള സൂചനയായി വിശദീകരിച്ചു.
  alternative: ഇവ സങ്കീർത്തന ഉദ്ധരണിയിലെ രണ്ടു പ്രസ്താവനകളെയോ, കൂടുതൽ വിശാലമായി പഴയ ഉടമ്പടിയെയും പുതിയ ഉടമ്പടിയെയും സൂചിപ്പിക്കുന്നു എന്നു നേരിട്ട് വിവർത്തനം ചെയ്യുക.
  rationale: എബ്രായർ 10:8–10-ന്റെ അടുത്ത സന്ദർഭം ബലികളെയും വഴിപാടുകളെയും ദൈവഹിതം നിറവേറ്റുന്നതിനെയും തമ്മിൽ വിരുദ്ധമായി നിരത്തുന്നു. എങ്കിലും മൂലപാഠം സൂചനയെ തുറന്നുവയ്ക്കുന്നതിനാൽ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർക്കാതെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും യഥാർഥമായ അവ്യക്തതയും സംരക്ഷിച്ചു.
- issue: ἀναιρεῖ, στήσῃ എന്നീ ക്രിയകളുടെ കർത്താവ്
  choice: സന്ദർഭത്തിൽ ഉദ്ധരിക്കപ്പെട്ട സംസാരിക്കുന്നവനായ പുത്രനെ സൂചിപ്പിക്കുന്ന വിധത്തിൽ ‘അവൻ’ നിലനിർത്തി.
  alternative: ദൈവം ആദ്യത്തേതിനെ നീക്കി രണ്ടാമത്തേതിനെ സ്ഥാപിക്കുന്നു എന്നു വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്കിൽ കർത്താവ് പ്രത്യക്ഷമായി ആവർത്തിക്കുന്നില്ല. ‘അവൻ’ എന്ന രൂപം വ്യാകരണപരമായ തുടർച്ച നിലനിർത്തുകയും ദൈവവും പുത്രനും തമ്മിലുള്ള പ്രവർത്തനബന്ധം അനാവശ്യമായി തീർപ്പാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഇതാ’ ഉദ്ധരണിയുടെ തിരുവെഴുത്തുസ്വരം നിലനിർത്തുന്നു. ‘ആദ്യത്തേത്/രണ്ടാമത്തേത്’ എന്ന സംക്ഷിപ്തത വ്യാഖ്യാനാത്മക വികസനം ഒഴിവാക്കുന്നു.
