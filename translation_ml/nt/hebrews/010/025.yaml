    reason: lexical_alternative
  - marker: b
    text: ‘ആ ദിവസം’ എന്നത് കർത്താവിന്റെ ദിവസത്തെയോ അന്തിമ ന്യായവിധിയുടെ ദിവസത്തെയോ സൂചിപ്പിക്കുന്നതായിരിക്കാം.
