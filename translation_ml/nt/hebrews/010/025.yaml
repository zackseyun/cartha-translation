reference: Hebrews 10:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μὴ ἐγκαταλείποντες τὴν ἐπισυναγωγὴν ἑαυτῶν, καθὼς ἔθος τισίν, ἀλλὰ παρακαλοῦντες, καὶ τοσούτῳ μᾶλλον ὅσῳ βλέπετε ἐγγίζουσαν τὴν ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/025.yaml
  text: not neglecting our own gathering together[a], as is the habit of some[b], but encouraging one another—and all the more as you see the Day drawing near.
translation:
  language: ml
  text: ചിലർക്കു പതിവുള്ളതുപോലെ നമ്മുടെ ഒരുമിച്ചുകൂടൽ അവഗണിക്കാതെ, പരസ്പരം പ്രോത്സാഹിപ്പിക്കുക. ആ ദിവസം അടുത്തുവരുന്നതു നിങ്ങൾ കാണുന്നത്രയും ഇതു കൂടുതൽ കൂടുതൽ ചെയ്യുക.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγκαταλείποντες
  choice: അവഗണിക്കാതെ
  rationale: കൂടിവരുന്നത് നിലനിർത്തുന്നതിൽ വീഴ്ച വരുത്തുക, അതിൽനിന്ന് പിന്മാറുക എന്നീ അർഥസാധ്യതകൾ ഈ ക്രിയയ്ക്കുണ്ട്. പൂർണമായ ഉപേക്ഷണം എന്ന അർഥം അനാവശ്യമായി ശക്തമാക്കാതെ, സന്ദർഭത്തിലെ മുന്നറിയിപ്പ് സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കാൻ ‘അവഗണിക്കാതെ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: ἐπισυναγωγὴν ἑαυτῶν
  choice: നമ്മുടെ ഒരുമിച്ചുകൂടിവരവ്
  rationale: വിശ്വാസസമൂഹം ഒരുമിച്ചുകൂടുന്നതിനെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്. പിൽക്കാല സ്ഥാപനപരമായ അർഥം ചേർക്കാതെ കൂട്ടായ്മയുടെ പ്രവൃത്തിയും തുടർച്ചയും വ്യക്തമാക്കുന്നു.
- source_word: καθὼς ἔθος τισίν
  choice: ചിലർക്കു പതിവുള്ളതുപോലെ
  rationale: ἔθος എന്നതിന്റെ ‘പതിവ്/ശീലം’ എന്ന അർഥവും ചിലരോടുള്ള മൃദുവെങ്കിലും വ്യക്തമായ ശാസനയും നിലനിർത്തുന്നു.
- source_word: παρακαλοῦντες
  choice: പരസ്പരം പ്രോത്സാഹിപ്പിക്കുക
  rationale: παρακαλέω പ്രോത്സാഹിപ്പിക്കുക, ഉദ്ബോധിപ്പിക്കുക, ആശ്വസിപ്പിക്കുക എന്നീ അർഥങ്ങൾ വഹിക്കാം. സഹനത്തിൽ പരസ്പരം ശക്തിപ്പെടുത്തുന്ന ഈ സന്ദർഭത്തിൽ ‘പ്രോത്സാഹിപ്പിക്കുക’ സ്വാഭാവികമാണ്; പരസ്പരത സമൂഹസന്ദർഭത്തിൽനിന്ന് വ്യക്തമാകുന്നു.
- source_word: τοσούτῳ μᾶλλον ὅσῳ
  choice: കാണുന്തോറും ഇതു കൂടുതൽ കൂടുതൽ ചെയ്യുക
  rationale: ദിവസം അടുത്തുവരുന്നതായി കാണുന്നതിന്റെ അനുപാതത്തിൽ പ്രോത്സാഹനം വർധിക്കണമെന്ന ഗ്രീക്ക് സഹബന്ധനിർമാണത്തിന്റെ തീവ്രത മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: βλέπετε
  choice: നിങ്ങൾ കാണുന്നു
  rationale: രണ്ടാംപുരുഷ ബഹുവചന വർത്തമാനരൂപത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; അവർ എങ്ങനെ തിരിച്ചറിയുന്നു എന്നു കൂടുതൽ നിർവചിക്കുന്നില്ല.
- source_word: ἐγγίζουσαν τὴν ἡμέραν
  choice: ആ ദിവസം അടുത്തുവരുന്നത്
  rationale: ἐγγίζωയുടെ സമീപിച്ചുവരുന്ന കാലബോധവും, സന്ദർഭത്തിൽ നേരത്തേ അറിയപ്പെട്ട ഒരു പ്രത്യേക ഭാവിദിവസത്തെ സൂചിപ്പിക്കുന്ന നിർദിഷ്ടതയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘ആ ദിവസം’ എന്നതിന്റെ അന്ത്യകാലസൂചന
  choice: മൂലപാഠത്തിലുള്ള നിർദിഷ്ടത നിലനിർത്തി ‘ആ ദിവസം’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘കർത്താവിന്റെ ദിവസം’ അല്ലെങ്കിൽ ‘ന്യായവിധിദിവസം’ എന്നു വിശദീകരിക്കുക.
  rationale: സന്ദർഭം അന്ത്യകാലത്തെ നിർണായക ദിവസത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും ഗ്രീക്ക് പാഠം അതിനെ ഇവിടെ ‘കർത്താവിന്റെ ദിവസം’ എന്നോ ‘ന്യായവിധിദിവസം’ എന്നോ തുറന്നു പറയുന്നില്ല. അതിനാൽ വ്യാഖ്യാനപരമായ വിപുലീകരണം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
- issue: παρακαλοῦντες എന്നതിലെ പരസ്പരകർമം
  choice: ‘പരസ്പരം’ എന്നു വ്യക്തമാക്കി.
  alternative: കർമം വ്യക്തമാക്കാതെ ‘പ്രോത്സാഹിപ്പിക്കുക’ എന്നു മാത്രം നൽകുക.
  rationale: ഗ്രീക്കിൽ കർമം തുറന്നു പറഞ്ഞിട്ടില്ലെങ്കിലും ‘നമ്മുടെ ഒരുമിച്ചുകൂടിവരവ്’ എന്ന സമൂഹസന്ദർഭം പരസ്പരപ്രവർത്തനം ശക്തമായി സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ആശയം സ്വാഭാവികവും വ്യക്തവുമാക്കുന്ന സന്ദർഭാധിഷ്ഠിത വിശദീകരണമാണിത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ പ്രബോധനശൈലി ഉപയോഗിച്ചു. മുൻവാക്യത്തിൽ ആരംഭിച്ച ആഹ്വാനം മലയാളത്തിൽ വ്യക്തമായി തുടരാൻ ക്രിയാരൂപങ്ങൾ ആജ്ഞാർഥത്തിൽ ക്രമപ്പെടുത്തി. ഇംഗ്ലീഷിലെ വലിയക്ഷരത്തിലൂടെ സൂചിപ്പിക്കുന്ന ‘Day’ എന്ന പ്രത്യേകത മലയാളത്തിൽ ‘ആ ദിവസം’ എന്ന നിർദിഷ്ടപ്രയോഗവും അടിക്കുറിപ്പും വഴി അറിയിച്ചു.
