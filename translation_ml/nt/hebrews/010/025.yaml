revisions:
- from: ചിലർക്കു പതിവുള്ളതുപോലെ, നമ്മുടെ ഒരുമിച്ചുകൂടിവരവ് അവഗണിക്കാതെ[a], പരസ്പരം പ്രോത്സാഹിപ്പിക്കുക. ആ ദിവസം[b] അടുത്തുവരുന്നതു നിങ്ങൾ കാണുന്തോറും ഇതു കൂടുതൽ കൂടുതൽ ചെയ്യുക.
  to: ചിലർക്കു പതിവുള്ളതുപോലെ നമ്മുടെ ഒരുമിച്ചുകൂടൽ അവഗണിക്കാതെ, പരസ്പരം പ്രോത്സാഹിപ്പിക്കുക. ആ ദിവസം അടുത്തുവരുന്നതു നിങ്ങൾ കാണുന്നത്രയും ഇതു കൂടുതൽ കൂടുതൽ ചെയ്യുക.
