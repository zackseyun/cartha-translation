id: HEB.10.17
reference: Hebrews 10:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀καὶ τῶν ἁμαρτιῶν αὐτῶν καὶ τῶν ἀνομιῶν αὐτῶν οὐ μὴ ⸀μνησθήσομαι ἔτι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/017.yaml
  text: and I will no longer remember their sins and their lawless deeds[a][b].
translation:
  language: ml
  text: അവരുടെ പാപങ്ങളും അവരുടെ നിയമലംഘനങ്ങളും ഞാൻ ഇനി ഒരിക്കലും ഓർക്കുകയില്ല.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: “അവരുടെ പാപങ്ങളും അവരുടെ നിയമലംഘനങ്ങളും ഞാൻ ഇനി നിശ്ചയമായും ഓർക്കുകയില്ല.”'
    reason: lexical_alternative
  - marker: b
    text: “നിയമലംഘനങ്ങൾ” എന്ന് പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ἀνομίαι എന്ന പദം “നിയമവിരുദ്ധ പ്രവൃത്തികൾ” എന്നും പരമ്പരാഗതമായി “അകൃത്യങ്ങൾ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: -ഉം / -കളും
  rationale: മുൻവാക്യത്തിലെ ഉദ്ധരണിയുടെ തുടർച്ചയായ ഈ ഘടകത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ നാമങ്ങളോടു ചേർന്ന സമുച്ചയപ്രത്യയം ഉപയോഗിച്ചു.
- source_word: τῶν ἁμαρτιῶν αὐτῶν
  choice: അവരുടെ പാപങ്ങളും
  rationale: ἁμαρτίαയുടെ നേരിട്ടുള്ളതും പതിവുമായ തർജമയായ ‘പാപം’ നിലനിർത്തി; ബഹുവചനവും αὐτῶν എന്ന ഉടമസ്ഥതയും വ്യക്തമായി പ്രതിഫലിപ്പിച്ചു.
- source_word: καὶ τῶν ἀνομιῶν αὐτῶν
  choice: അവരുടെ നിയമലംഘനങ്ങളും
  rationale: ἀνομία നിയമത്തോടുള്ള വിരോധമോ നിയമലംഘനമോ സൂചിപ്പിക്കുന്നു. ‘നിയമലംഘനങ്ങൾ’ ആ അർഥം ആധുനിക വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; പരമ്പരാഗതമായ ‘അകൃത്യങ്ങൾ’ എന്നതിനെക്കാൾ കൃത്യമാണ്.
- source_word: οὐ μὴ μνησθήσομαι
  choice: ഞാൻ ... ഒരിക്കലും ഓർക്കുകയില്ല
  rationale: οὐ μή എന്ന ശക്തമായ നിഷേധം ‘ഒരിക്കലും ... ഇല്ല’ എന്ന പ്രയോഗത്തിലൂടെ പ്രകടമാക്കി; μιμνῄσκομαιയുടെ പ്രധാന ബൈബിൾപ്രതീകമായ ‘ഓർക്കുക’ നിലനിർത്തി.
- source_word: ἔτι
  choice: ഇനി
  rationale: ἔτιയുടെ ‘ഇനിമേൽ/ഇനി’ എന്ന കാലസൂചന മലയാളത്തിലെ നിഷേധവാക്യത്തിൽ സ്വാഭാവികമായി ചേർത്തു.
theological_decisions:
- issue: ദൈവം പാപങ്ങളെ ഓർക്കാതിരിക്കുക
  choice: ‘ഞാൻ ഇനി ഒരിക്കലും ഓർക്കുകയില്ല’ എന്ന ബൈബിൾഭാഷ നേരിട്ട് നിലനിർത്തി.
  alternative: ‘ഞാൻ ഇനി അവ കണക്കിലെടുക്കുകയില്ല’ അല്ലെങ്കിൽ ‘അവർക്കെതിരെ ചുമത്തുകയില്ല.’
  rationale: വാക്യം ദൈവികമായ ‘ഓർക്കാതിരിക്കൽ’ എന്ന ഉടമ്പടി-പ്രതീകം ഉപയോഗിക്കുന്നു. അതിനെ വിശദീകരണപരമായി മാറ്റുന്നത് ദൈവത്തിന്റെ സർവജ്ഞതയെക്കുറിച്ചുള്ള ദാർശനിക പ്രശ്നം മുൻകൂട്ടി പരിഹരിച്ചുകളയും; അതിനാൽ മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ശക്തമായ നിഷേധം വ്യക്തമായി പ്രകടിപ്പിക്കുമ്പോഴും ‘ഓർക്കുക’ എന്ന മൂലപാഠരൂപകം നിലനിർത്തിയിരിക്കുന്നു.
