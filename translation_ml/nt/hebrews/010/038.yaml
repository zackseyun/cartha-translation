id: HEB.10.38
reference: Hebrews 10:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ δίκαιός ⸀μου ἐκ πίστεως ζήσεται, καὶ ἐὰν ὑποστείληται, οὐκ εὐδοκεῖ ἡ ψυχή μου ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/038.yaml
  text: But my righteous one will live by faith[a], and if he shrinks back[c][b], my soul takes no pleasure in him.
translation:
  language: ml
  text: എന്നാൽ എന്റെ[b] നീതിമാൻ വിശ്വാസത്താൽ[a] ജീവിക്കും; അവൻ[c] പിൻവാങ്ങിയാൽ, എന്റെ ആത്മാവിന് അവനിൽ പ്രസാദമില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വിശ്വസ്തതയാൽ’ എന്നോ ‘ആശ്രയത്താൽ’ എന്നോ വിവർത്തനം ചെയ്യാം. ഗ്രീക്കിലെ πίστις എന്ന പദത്തിന് ഈ അർഥങ്ങളും വരാം; പ്രധാനപാഠത്തിൽ ‘വിശ്വാസം’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘എന്റെ നീതിമാൻ’ എന്നതിനുപകരം ‘നീതിമാൻ’ എന്നു മാത്രമേയുള്ളൂ.
    reason: textual_variant
  - marker: c
    text: ‘അവൻ’, ‘അവനിൽ’ എന്നീ പുല്ലിംഗ ഏകവചനരൂപങ്ങൾ ഗ്രീക്ക് പദപ്രയോഗത്തെ പ്രതിഫലിപ്പിക്കുന്നു; അവ പുരുഷന്മാരെ മാത്രം സൂചിപ്പിക്കണമെന്നില്ല, പ്രതിനിധാനപരമായി ഉപയോഗിച്ചവയാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ δίκαιός μου
  choice: എന്റെ നീതിമാൻ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ വിശേഷണം ഒരാളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘നീതിമാൻ’ എന്നു നൽകി. SBLGNT-യിലെ μου അനുസരിച്ച് ‘എന്റെ’ നിലനിർത്തി.
- source_word: ἐκ πίστεως
  choice: വിശ്വാസത്താൽ
  rationale: ἐκ ഇവിടെ അടിസ്ഥാനം അഥവാ മാർഗം സൂചിപ്പിക്കുന്നു. πίστις എന്ന പദത്തിന്റെ സാധാരണവും സ്വാഭാവികവുമായ വിവർത്തനമായി ‘വിശ്വാസം’ സ്വീകരിച്ചു; ‘വിശ്വസ്തത’, ‘ആശ്രയം’ എന്നീ സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: ζήσεται
  choice: ജീവിക്കും
  rationale: ζάω എന്ന ക്രിയയുടെ ഭാവികാലരൂപം ആധുനിക മലയാളത്തിൽ നേരിട്ട് ‘ജീവിക്കും’ എന്നു നൽകി.
- source_word: ὑποστείληται
  choice: പിൻവാങ്ങിയാൽ
  rationale: സമ്മർദത്തിനുമുമ്പിൽ പിന്മാറുക, പിന്തിരിയുക എന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: οὐκ εὐδοκεῖ
  choice: പ്രസാദിക്കുകയില്ല
  rationale: സന്തോഷമോ അംഗീകാരമോ തോന്നാതിരിക്കുക എന്ന εὐδοκέω-യുടെ അർഥം ഗൗരവമുള്ള മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἡ ψυχή μου
  choice: എന്റെ പ്രാണൻ
  rationale: ഗ്രീക്കിലെ ‘എന്റെ പ്രാണൻ’ എന്ന വ്യക്തിപരമായ തിരുവെഴുത്തുശൈലി ‘ഞാൻ’ എന്നു ലഘൂകരിക്കാതെ സംരക്ഷിച്ചു.
- source_word: ἐν αὐτῷ
  choice: അവനിൽ
  rationale: ἐν + ദത്തിവ് രൂപത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുകയും പ്രസാദത്തിന്റെ വിഷയമായ വ്യക്തിയെ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ἐκ πίστεως എന്നതിലെ πίστις-ന്റെ അർഥം
  choice: വിശ്വാസത്താൽ
  alternative: വിശ്വസ്തതയാൽ; ആശ്രയത്താൽ
  rationale: പ്രധാനപാഠത്തിൽ സാധാരണ അർഥമായ ‘വിശ്വാസം’ സ്വീകരിച്ചു; ഹബക്കൂക്ക് ഉദ്ധരണിയിലുള്ള അർഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ തുറന്നുവച്ചു.
- issue: ‘പിൻവാങ്ങിയാൽ’ എന്ന ഉപവാക്യത്തിലെ കർത്താവ്
  choice: മുമ്പു പറഞ്ഞ അതേ ഏകവചന വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ‘അവൻ’
  alternative: ‘ആരെങ്കിലും പിൻവാങ്ങിയാൽ’ എന്ന അനിശ്ചിതമായ വേറൊരു കർത്താവ്
  rationale: ഗ്രീക്ക് പാഠത്തിലെ ഏകവചന തുടർച്ച നിലനിർത്തി; മുന്നറിയിപ്പിലുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷം മൃദൂകരിച്ചില്ല.
- issue: വ്യാകരണലിംഗവും പ്രതിനിധാനസ്വഭാവവും
  choice: പുല്ലിംഗ ഏകവചനമായ ‘അവൻ/അവനിൽ’ നിലനിർത്തി
  alternative: ലിംഗനിരപേക്ഷമായ ബഹുവചനമോ ‘ആ വ്യക്തി’ എന്ന രൂപമോ
  rationale: മൂലത്തിലെ പുല്ലിംഗ ഏകവചനം കൃത്യമായി നൽകി; അത് പുരുഷന്മാർക്കു മാത്രമുള്ള പരാമർശമല്ലെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ തിരുവെഴുത്തുശൈലി സ്വീകരിച്ചു. ‘പിൻവാങ്ങുക’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്. ‘എന്റെ പ്രാണൻ’ ദൈനംദിന പ്രയോഗത്തേക്കാൾ ഉയർന്ന രജിസ്റ്ററിലാണെങ്കിലും, മൂലത്തിലെ ψυχή എന്ന വ്യക്തിപരമായ പ്രയോഗവും ഉദ്ധരണിയുടെ ഭാവവും സംരക്ഷിക്കാൻ ഉദ്ദേശപൂർവം നിലനിർത്തി.
