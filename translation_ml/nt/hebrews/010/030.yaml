source:
  edition: SBLGNT
  text: οἴδαμεν γὰρ τὸν εἰπόντα· Ἐμοὶ ἐκδίκησις, ἐγὼ ⸀ἀνταποδώσω· καὶ πάλιν· ⸂Κρινεῖ κύριος⸃ τὸν λαὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/030.yaml
  text: For we know the one who said[a], “Vengeance is mine; I will repay,” and again[b], “The Lord will judge his people.”
translation:
  language: ml
  text: കാരണം, “പ്രതികാരം എന്റേതാണ്; ഞാൻ പകരം വീട്ടും”[a] എന്നു പറഞ്ഞവനെ നാം അറിയുന്നു; വീണ്ടും, “കർത്താവ് തന്റെ ജനത്തെ ന്യായംവിധിക്കും”[b] എന്നും പറയുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “പ്രതികാരം എനിക്കുള്ളത്.”'
    reason: lexical_alternative
  - marker: b
    text: ഈ ഉദ്ധരണി ആവർത്തനം 32:35–36-നെ പ്രതിധ്വനിപ്പിക്കുന്നു. അവിടത്തെ മൂലസന്ദർഭത്തിൽ “ന്യായംവിധിക്കുക” എന്നതിൽ ശിക്ഷയും നീതി സ്ഥാപിക്കലും ഉൾപ്പെടാം; ഇവിടെ മുന്നറിയിപ്പിന്റെ സന്ദർഭം ദൈവിക ന്യായവിധിക്കാണ് ഊന്നൽ നൽകുന്നത്.
    reason: cross_reference
lexical_decisions:
- source_word: οἴδαμεν γὰρ
  choice: ഇതു പറഞ്ഞവനെ നാം അറിയുന്നുവല്ലോ
  rationale: οἶδα എന്ന പൂർണരൂപത്തിന് ഇവിടെ വർത്തമാനകാല അർഥമാണ്; γάρ മുൻവാക്യത്തോടുള്ള വിശദീകരണബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ‘-വല്ലോ’ ഉപയോഗിച്ചു.
- source_word: τὸν εἰπόντα
  choice: ഇതു പറഞ്ഞവനെ
  rationale: ഉദ്ധരിച്ച തിരുവെഴുത്തിന്റെ പ്രഭാഷകനായ ദൈവത്തെ സൂചിപ്പിക്കുന്ന substantival aorist participle സ്വാഭാവികമായും വ്യക്തിപരമായും വിവർത്തനം ചെയ്യുന്നു.
- source_word: Ἐμοὶ ἐκδίκησις
  choice: പ്രതികാരം എനിക്കുള്ളത്
  rationale: ‘എനിക്ക് പ്രതികാരം’ എന്ന ഗ്രീക്ക് ദീർഘവാക്യരഹിത ഘടനയിലെ അവകാശബോധം വ്യക്തമായി നിലനിർത്തുന്നു; പ്രതികാരം മനുഷ്യർക്കല്ല, ദൈവത്തിനാണ് എന്ന ഊന്നലും സംരക്ഷിക്കുന്നു.
- source_word: ἀνταποδώσω
  choice: ഞാൻ പകരം നൽകും
  rationale: പ്രവൃത്തിക്കനുസരിച്ച് തിരികെ നൽകുക, പ്രതിഫലം നൽകുക എന്ന നീതിന്യായപരമായ അർഥം ഗൗരവമുള്ള സാധാരണ മലയാളത്തിൽ നൽകുന്നു.
- source_word: καὶ πάλιν
  choice: വീണ്ടും
  rationale: രണ്ടാമത്തെ ഉദ്ധരണി അവതരിപ്പിക്കുന്ന സൂത്രവാക്യം അധിക ക്രിയ ചേർക്കാതെ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: Κρινεῖ κύριος
  choice: കർത്താവ് ... ന്യായംവിധിക്കും
  rationale: κρίνωയുടെ നീതിന്യായപരമായ വിശാല അർഥം നിലനിർത്തുകയും എബ്രായർ 10-ലെ മുന്നറിയിപ്പ് സന്ദർഭത്തിന് യോജിക്കുകയും ചെയ്യുന്നു.
- source_word: τὸν λαὸν αὐτοῦ
  choice: തന്റെ ജനത്തെ
  rationale: പ്രത്യാവർത്തക ഉടമസ്ഥത സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കി ഉടമ്പടിജനത്തെക്കുറിച്ചുള്ള സൂചന സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ആവർത്തനം 32-ലെ ന്യായവിധിഭാഷയുടെ അർഥവ്യാപ്തി
  choice: “കർത്താവ് തന്റെ ജനത്തെ ന്യായംവിധിക്കും”
  alternative: “കർത്താവ് തന്റെ ജനത്തിനു നീതി നടത്തും / അവരെ കുറ്റവിമുക്തരാക്കും”
  rationale: മൂലസന്ദർഭത്തിൽ വിധിക്കൽ ശിക്ഷയും നീതീകരണവും ഉൾക്കൊള്ളാൻ കഴിയും. എബ്രായർ 10-ലെ മുന്നറിയിപ്പ് ശിക്ഷാത്മക ദൈവവിധിയെ ഊന്നുന്നുവെങ്കിലും ‘ന്യായംവിധിക്കും’ എന്ന വിശാലപദം മൂലത്തിലെ അർഥപിരിമുറുക്കം നിലനിർത്തുന്നു.
- issue: ദൈവിക പ്രതികാരത്തിന്റെ അവകാശം
  choice: “പ്രതികാരം എനിക്കുള്ളത്”
  alternative: “പ്രതികാരം എന്റേതാണ്”
  rationale: രണ്ടു രൂപങ്ങളും സാധുവാണ്; തിരുവെഴുത്ത് ഉദ്ധരണിയുടെ ഗൗരവവും ഗ്രീക്കിലെ ദത്തിവ്-ഊന്നലും നിലനിർത്താൻ ‘എനിക്കുള്ളത്’ തെരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ഉദ്ധരണികളുടെ തിരുവെഴുത്തുസ്വരം നിലനിർത്തിക്കൊണ്ട് അതിപുരാതന പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
