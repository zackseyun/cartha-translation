id: HEB.10.1
reference: Hebrews 10:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Σκιὰν γὰρ ἔχων ὁ νόμος τῶν μελλόντων ἀγαθῶν, οὐκ αὐτὴν τὴν εἰκόνα τῶν πραγμάτων, κατ’ ἐνιαυτὸν ταῖς αὐταῖς θυσίαις ἃς προσφέρουσιν εἰς τὸ διηνεκὲς οὐδέποτε ⸀δύναται τοὺς προσερχομένους τελειῶσαι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/001.yaml
  text: For since the law has only a shadow of the good things to come[a], not the very form of the realities, it can never, by the same sacrifices that they continually offer year after year[c][b], perfect those who draw near.
translation:
  language: ml
  text: വരാനിരിക്കുന്ന നന്മകളുടെ നിഴൽ മാത്രമേ ന്യായപ്രമാണത്തിനുള്ളൂ; യാഥാർഥ്യങ്ങളുടെ പ്രതിരൂപം തന്നെയല്ല.[a] അതിനാൽ, വർഷംതോറും തുടർച്ചയായി അർപ്പിക്കുന്ന അതേ യാഗങ്ങളാൽ ദൈവത്തെ സമീപിക്കുന്നവരെ[b] ഒരിക്കലും പൂർണതയിൽ എത്തിക്കാൻ[c] അതിനു കഴിയുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യാഥാർഥ്യങ്ങളുടെ പ്രതിരൂപം തന്നെയല്ല.’
    reason: lexical_alternative
  - marker: b
    text: ‘സമീപിക്കുന്നവർ’ എന്നത് ആരാധനയിൽ ദൈവത്തെ സമീപിക്കുന്നവരെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ദൈവത്തെ’ എന്ന വാക്ക് ഗ്രീക്കിൽ പരോക്ഷമാണ്.
    reason: cultural_note
  - marker: c
    text: അഥവാ, ‘പൂർണരാക്കാൻ’ അല്ലെങ്കിൽ ‘ലക്ഷ്യത്തിലെത്തിക്കാൻ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Σκιὰν
  choice: നിഴൽ
  rationale: εἰκών എന്ന പദത്തോടുള്ള വൈരുധ്യം നിലനിർത്തിക്കൊണ്ട്, വരാനിരിക്കുന്നതിന്റെ മുൻസൂചനയായെങ്കിലും അതിന്റെ പൂർണ യാഥാർഥ്യമല്ലാത്ത ഒന്നെന്ന മൂലരൂപകം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: τῶν μελλόντων ἀγαθῶν
  choice: വരാനിരിക്കുന്ന നന്മകളുടെ
  rationale: ഭാവിയിൽ ലഭിക്കാനിരിക്കുന്ന നന്മകളെന്ന മുന്നോട്ടുനോക്കുന്ന അർഥം സമയത്തെ അനാവശ്യമായി കൂടുതൽ നിർവചിക്കാതെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: οὐκ αὐτὴν τὴν εἰκόνα τῶν πραγμάτων
  choice: ആ യാഥാർഥ്യങ്ങളുടെ തനതായ രൂപമല്ല
  rationale: αὐτήν എന്ന ഊന്നലും നിഴലിനോടു വിരുദ്ധമായ εἰκών എന്ന ആശയവും വ്യക്തമാക്കുന്നു; πραγμάτων ഇവിടെ നിഴലിനൊത്ത യഥാർഥ കാര്യങ്ങളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘യാഥാർഥ്യങ്ങൾ’ എന്ന് നൽകി.
- source_word: κατ’ ἐνιαυτὸν ταῖς αὐταῖς θυσίαις
  choice: വർഷംതോറും ... അതേ യാഗങ്ങളാൽ
  rationale: വാർഷിക ആവർത്തനവും ഒരേ യാഗങ്ങൾ വീണ്ടും അർപ്പിക്കപ്പെടുന്നതുമെന്ന ഊന്നൽ നിലനിർത്തുന്നു; ദാതിവ് ഉപകരണാർഥത്തിൽ വിവർത്തനം ചെയ്തു.
- source_word: ἃς προσφέρουσιν εἰς τὸ διηνεκές
  choice: മുടങ്ങാതെ അർപ്പിക്കുന്ന
  rationale: ഗ്രീക്കിലെ അജ്ഞാത ബഹുവചന കർത്താവിനെ മലയാളത്തിൽ കൃത്രിമമായി ചേർക്കാതെ, തുടർന്നുകൊണ്ടിരിക്കുന്ന ആചാരപരമായ അർപ്പണത്തെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: οὐδέποτε δύναται
  choice: ഒരിക്കലും ... കഴിയുകയില്ല
  rationale: δύναται എന്ന ശേഷിയുടെയും οὐδέποτε എന്ന സമ്പൂർണ നിഷേധത്തിന്റെയും ശക്തി സംരക്ഷിക്കുന്നു.
- source_word: τοὺς προσερχομένους
  choice: ദൈവത്തെ സമീപിക്കുന്നവരെ
  rationale: എബ്രായലേഖനത്തിലെ ആരാധനാപരമായ ദൈവസമീപനത്തിന്റെ സൂചന വ്യക്തമാക്കുന്നു; ഗ്രീക്കിൽ ‘ദൈവത്തെ’ പരോക്ഷമാണെന്ന വിവരം അടിക്കുറിപ്പിലൂടെ ശ്രദ്ധയിൽപ്പെടുത്തുന്നു.
- source_word: τελειῶσαι
  choice: പൂർണതയിൽ എത്തിക്കാൻ
  rationale: ലക്ഷ്യത്തിലേക്കോ ഉദ്ദേശിച്ച സമാപ്തിയിലേക്കോ കൊണ്ടുവരുക എന്ന τελειόω-യുടെ അർഥം നൽകുന്നു; ധാർമ്മികമായ പാപരഹിതത്വം മാത്രം എന്ന തെറ്റായ ധാരണ ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: നിഴലും രൂപവും തമ്മിലുള്ള യാഗശാസ്ത്രപരമായ വൈരുധ്യം
  choice: ന്യായപ്രമാണത്തിന് വരാനിരിക്കുന്ന നന്മകളുടെ നിഴൽ ഉണ്ട്, എന്നാൽ ആ യാഥാർഥ്യങ്ങളുടെ തനതായ രൂപം അതല്ല
  alternative: ന്യായപ്രമാണം ഭാവിനന്മകളുടെ പ്രതീകാത്മക പ്രതിരൂപമാണ്
  rationale: ഗ്രീക്ക് σκιά-യെയും εἰκών-നെയും വ്യക്തമായി വേർതിരിക്കുന്നു. വിവർത്തനം ന്യായപ്രമാണത്തിന്റെ ദൈവദത്തമായ മുൻസൂചനാപങ്ക് നിഷേധിക്കാതെയും അതിനെ അന്തിമ യാഥാർഥ്യമായി ഉയർത്താതെയും ഈ സംഘർഷം നിലനിർത്തുന്നു.
- issue: യാഗസന്ദർഭത്തിലെ τελειῶσαι എന്ന പദത്തിന്റെ അർഥം
  choice: പൂർണതയിൽ എത്തിക്കുക
  alternative: പൂർണരാക്കുക; സമാപ്തിയിലെത്തിക്കുക
  rationale: എബ്രായലേഖനത്തിൽ ഈ പദം ദൈവസന്നിധിയിലേക്കുള്ള നിർണായക പ്രവേശനവും ലക്ഷ്യസിദ്ധിയും സൂചിപ്പിക്കുന്നു. ‘പൂർണതയിൽ എത്തിക്കുക’ ഈ ആശയം നിലനിർത്തുകയും ധാർമ്മിക പാപരഹിതത്വം മാത്രം അർഥമാക്കുന്നില്ലെന്ന് സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ‘ന്യായപ്രമാണം,’ ‘യാഗം,’ ‘ദൈവത്തെ സമീപിക്കുക’ എന്നീ പരിചിതമായ ബൈബിൾപര പദങ്ങൾ നിലനിർത്തി; ദീർഘമായ ഗ്രീക്ക് വാക്യഘടന മലയാളത്തിൽ വ്യക്തതയ്ക്കായി രണ്ട് പ്രധാന ഖണ്ഡങ്ങളാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
