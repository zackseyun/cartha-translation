  text: and a great priest over the house of God[b][a],
translation:
  language: ml
  text: ദൈവത്തിന്റെ ഭവനത്തിനുമേൽ ഒരു മഹാനായ പുരോഹിതനും നമുക്കുള്ളതിനാൽ,[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മഹാപുരോഹിതൻ’ എന്നും പരിഭാഷപ്പെടുത്താറുണ്ട്. എബ്രായലേഖനം യേശുവിനെ പലപ്പോഴും മഹാപുരോഹിതനായി അവതരിപ്പിക്കുന്നുവെങ്കിലും ഇവിടെ അക്ഷരാർഥത്തിൽ ‘മഹാനായ പുരോഹിതൻ’ എന്നാണ്.
    reason: alternative_reading
  - marker: b
    text: ‘ദൈവത്തിന്റെ ഭവനം’ എന്നതിന് ദൈവത്തിന്റെ കുടുംബം, അതായത് അവന്റെ ജനം, എന്ന അർഥവും ഉണ്ടായേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: -ഉം
  rationale: മുൻവാക്യത്തിലെ സമാന്തര ഘടകവുമായി ഈ പദസമുച്ചയത്തെ ബന്ധിപ്പിക്കുന്ന സംയോജകത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ അനുബന്ധപ്രത്യയംകൊണ്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: ἱερέα
  choice: പുരോഹിതൻ
  rationale: ἱερεύς എന്നത് സാധാരണയായി ‘പുരോഹിതൻ’ എന്നാണ്; ഗ്രീക്കിൽ സാങ്കേതികമായി ‘മഹാപുരോഹിതൻ’ എന്നർഥമുള്ള ἀρχιερεύς ഇവിടെ ഇല്ല.
- source_word: μέγαν
  choice: മഹാനായ
  rationale: പുരോഹിതന്റെ മഹത്ത്വവും ശ്രേഷ്ഠതയും സൂചിപ്പിക്കുന്ന μέγας എന്ന വിശേഷണം പ്രത്യേകം നിലനിർത്തുന്നു; അതിനെ ‘മഹാപുരോഹിതൻ’ എന്ന സാങ്കേതിക സ്ഥാനപ്പേരിൽ ലയിപ്പിക്കുന്നില്ല.
- source_word: ἐπὶ
  choice: -ന്റെ മേൽ
  rationale: ἐπί + accusative ഇവിടെ അധികാരത്തിന്റെയോ മേൽനോട്ടത്തിന്റെയോ ആശയം നൽകുന്നു; ‘മേൽ’ അത് സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: τὸν οἶκον
  choice: ഭവനം
  rationale: οἶκος എന്ന പദത്തിന്റെ ‘വീട്/ഭവനം’ എന്ന രൂപകം നിലനിർത്തുന്നു; അതിന് ദൈവത്തിന്റെ കുടുംബം അഥവാ ജനം എന്ന സമൂഹാർഥവും ഉണ്ടായേക്കാം.
- source_word: τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ
  rationale: ഭവനം ദൈവത്തിന്റേതാണെന്ന് വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാള ജനിറ്റീവ് രൂപം.
theological_decisions:
- issue: ἱερέα μέγαν എന്നത് ‘മഹാപുരോഹിതൻ’ എന്ന സാങ്കേതിക സ്ഥാനപ്പേരായി പരിഭാഷപ്പെടുത്തണമോ
  choice: മഹാനായ പുരോഹിതൻ
  alternative: മഹാപുരോഹിതൻ
  rationale: എബ്രായലേഖനം യേശുവിനെ പലവട്ടം മഹാപുരോഹിതനായി അവതരിപ്പിക്കുന്നുവെങ്കിലും ഇവിടെ ἀρχιερεύς അല്ല, ἱερεύς + μέγας ആണ്. അതിനാൽ മൂലപാഠത്തിന്റെ വ്യത്യസ്തമായ പ്രയോഗം നിലനിർത്തുന്നു.
- issue: οἶκος എന്നത് കെട്ടിടമോ ദൈവജനമെന്ന കുടുംബമോ
  choice: ഭവനം
  alternative: കുടുംബം / ഭവനത്തിലുള്ളവർ
  rationale: ‘ഭവനം’ എന്ന രൂപകം സംരക്ഷിക്കുന്നത് ഭൗതികവും സമൂഹപരവുമായ അർഥസാധ്യതകൾ തുറന്നുവയ്ക്കുന്നു; എബ്രായർ 3:2–6-ലെ ദൈവജനസംബന്ധിയായ അനുരണനവും ഇതിലുണ്ട്.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. വാക്യം 19–22-ലെ ദീർഘമായ ഗ്രീക്ക് വാക്യഘടനയുടെ ഭാഗമായതിനാൽ ‘നമുക്കുള്ളതിനാൽ’ എന്നത് സന്ദർഭത്തിൽ നിന്നു സ്വാഭാവികമായി പൂരിപ്പിച്ചു. ‘മഹാനായ പുരോഹിതൻ’ മൂലത്തിലെ വിശേഷണവും നാമവും വേർതിരിച്ചു നിലനിർത്തുന്നു; ‘ഭവനം’ ബൈബിൾരൂപകവും കുടുംബ/ജനസമൂഹ അർഥസാധ്യതയും സംരക്ഷിക്കുന്നു.
