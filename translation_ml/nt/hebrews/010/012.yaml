id: HEB.10.12
reference: Hebrews 10:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀οὗτος δὲ μίαν ὑπὲρ ἁμαρτιῶν προσενέγκας θυσίαν εἰς τὸ διηνεκὲς ἐκάθισεν ἐν δεξιᾷ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/012.yaml
  text: But this one[a], after offering one sacrifice for sins for all time, sat down at the right hand of God[b],
translation:
  language: ml
  text: എന്നാൽ ഇദ്ദേഹമോ പാപങ്ങൾക്കുവേണ്ടി ഒരേയൊരു യാഗം എന്നേക്കുമായി അർപ്പിച്ചശേഷം[a] ദൈവത്തിന്റെ വലതുഭാഗത്ത്[b] ഇരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “എന്നേക്കുമായി” എന്നർഥമുള്ള ഗ്രീക്ക് പദസമുച്ചയം “ഒരേയൊരു യാഗം അർപ്പിച്ചു” എന്നതോടു ചേർത്ത് വായിക്കാം; അല്ലെങ്കിൽ “ദൈവത്തിന്റെ വലതുഭാഗത്ത് എന്നേക്കും ഇരുന്നു” എന്നവിധം “ഇരുന്നു” എന്ന ക്രിയയോടു ചേർത്തും വായിക്കാം.
    reason: alternative_reading
  - marker: b
    text: “ദൈവത്തിന്റെ വലതുഭാഗത്ത്” എന്നത് സങ്കീർത്തനം 110:1-നെ പ്രതിധ്വനിപ്പിക്കുന്നു; മശീഹയുടെ ഉയർത്തപ്പെടലിനെക്കുറിച്ചുള്ള എബ്രായർക്കുള്ള ലേഖനത്തിന്റെ വാദത്തിൽ അത് പ്രധാനമാണ്.
    reason: cross_reference
lexical_decisions:
- source_word: οὗτος
  choice: ഇദ്ദേഹം
  rationale: മുൻവാക്യത്തിലെ ആവർത്തിച്ച് യാഗങ്ങൾ അർപ്പിക്കുന്ന പുരോഹിതന്മാരോടുള്ള വൈരുധ്യം പ്രകടമാക്കുന്ന ഗ്രീക്ക് നിർദേശകസർവനാമത്തിന്റെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ പുരോഹിതന്മാരുടെ ആവർത്തിത ശുശ്രൂഷയോടുള്ള വ്യക്തമായ വൈരുധ്യം സൂചിപ്പിക്കുന്നു.
- source_word: μίαν ... θυσίαν
  choice: ഒരേയൊരു യാഗം
  rationale: ആവർത്തിക്കപ്പെടുന്ന അനേകം യാഗങ്ങൾക്കു വിരുദ്ധമായി ഈ യാഗത്തിന്റെ ഏകത്വത്തിന് ഊന്നൽ നൽകുന്നു.
- source_word: ὑπὲρ ἁμαρτιῶν
  choice: പാപങ്ങൾക്കുവേണ്ടി
  rationale: ബലിയുടെ ഉദ്ദേശ്യവും പ്രയോജനവും വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളം; ഗ്രീക്കിലെ ബഹുവചനം നിലനിർത്തുന്നു.
- source_word: προσενέγκας
  choice: അർപ്പിച്ചശേഷം
  rationale: പ്രധാനക്രിയയായ ‘ഇരുന്നു’ എന്നതിനുമുമ്പ് പൂർത്തിയായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന aorist participle-ന്റെ കാലക്രമബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: εἰς τὸ διηνεκές
  choice: എന്നേക്കും പ്രാബല്യമുള്ള
  rationale: ഒറ്റ യാഗത്തിന്റെ ശാശ്വതവും തുടർന്നുനിൽക്കുന്നതുമായ ഫലപ്രാപ്തി സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; അതേസമയം വ്യാകരണപരമായ മറ്റൊരു ബന്ധസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: ἐκάθισεν
  choice: ഇരുന്നു
  rationale: പൂർത്തിയായ പ്രവൃത്തിയെ ലളിതമായും നേരിട്ടും അറിയിക്കുന്നു; സന്ദർഭത്തിൽ യാഗാർപ്പണത്തിന്റെ പൂർത്തീകരണത്തോടും ഉയർത്തപ്പെടലോടും ചേരുന്നു.
- source_word: ἐν δεξιᾷ τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ വലതുഭാഗത്ത്
  rationale: സങ്കീർത്തനം 110:1-ലേക്കുള്ള സൂചന നിലനിർത്തുന്ന, മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും വ്യക്തവുമായ പ്രയോഗം.
theological_decisions:
- issue: εἰς τὸ διηνεκές എന്ന പദസമുച്ചയത്തിന്റെ വ്യാകരണബന്ധം
  choice: ‘ഒരേയൊരു യാഗം’ എന്നതിനോട് ബന്ധപ്പെടുത്തി, യാഗത്തിന്റെ സ്ഥിരമായ പ്രാബല്യം സൂചിപ്പിച്ചു.
  alternative: ‘ദൈവത്തിന്റെ വലതുഭാഗത്ത് എന്നേക്കും ഇരുന്നു’ എന്നവിധം പ്രധാനക്രിയയോടു ബന്ധിപ്പിക്കാം; അല്ലെങ്കിൽ ‘പാപങ്ങൾക്കുവേണ്ടി എന്നേക്കുമായി ഒരേയൊരു യാഗം അർപ്പിച്ചു’ എന്നു ക്രിയയോട് കൂടുതൽ അടുത്തും ചേർക്കാം.
  rationale: എബ്രായർ 10-ന്റെ വാദത്തിൽ ആവർത്തിത യാഗങ്ങൾക്ക് എതിരായി ക്രിസ്തുവിന്റെ ഏകയാഗത്തിന്റെ സ്ഥിരഫലമാണ് മുഖ്യ ഊന്നൽ. എങ്കിലും ഗ്രീക്ക് പദക്രമം ഇരിപ്പിനോടു ബന്ധിപ്പിക്കുന്ന വായന പൂർണമായി ഒഴിവാക്കുന്നില്ല; അതിനാൽ അടിക്കുറിപ്പിൽ ആ സാദ്ധ്യത സംരക്ഷിക്കുന്നു.
- issue: ദൈവത്തിന്റെ വലതുഭാഗത്ത് ഇരിക്കൽ
  choice: സങ്കീർത്തനം 110:1-ന്റെ പ്രതിധ്വനി വ്യക്തമാക്കുന്ന അടിക്കുറിപ്പ് നൽകി.
  alternative: വാചകം മാത്രം നൽകി പരാമർശം വിശദീകരിക്കാതിരിക്കുക.
  rationale: ഈ സങ്കീർത്തനവാക്യം എബ്രായലേഖനത്തിലെ മശീഹയുടെ ഉയർത്തപ്പെടലിനെക്കുറിച്ചുള്ള വാദത്തിന് കേന്ദ്രമാണ്; അടിക്കുറിപ്പ് വ്യാഖ്യാനം അടിച്ചേൽപ്പിക്കാതെ അന്തർഗ്രന്ഥബന്ധം തിരിച്ചറിയാൻ സഹായിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ഇദ്ദേഹം’ എന്നത് οὗτος-ന്റെ നിർദേശകവും വൈരുധ്യാത്മകവുമായ ശക്തി നിലനിർത്തുന്നു. ‘എന്നേക്കും പ്രാബല്യമുള്ള’ എന്ന പ്രയോഗം സ്ഥിരഫലത്തെ വ്യക്തമായി അറിയിക്കുമ്പോൾ, മൂലഭാഷയിലെ ബന്ധസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
