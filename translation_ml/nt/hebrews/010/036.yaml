id: HEB.10.36
reference: Hebrews 10:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὑπομονῆς γὰρ ἔχετε χρείαν ἵνα τὸ θέλημα τοῦ θεοῦ ποιήσαντες κομίσησθε τὴν ἐπαγγελίαν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/036.yaml
  text: For you have need of endurance[a], so that after doing the will of God you may receive the promise.
translation:
  language: ml
  text: കാരണം, ദൈവത്തിന്റെ ഇഷ്ടം ചെയ്തശേഷം വാഗ്ദത്തം പ്രാപിക്കേണ്ടതിന് നിങ്ങൾക്ക് സഹിച്ചുനിൽപ്പ് ആവശ്യമാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വാഗ്ദാനം ചെയ്യപ്പെട്ടത് പ്രാപിക്കേണ്ടതിന്.”
    reason: ἐπαγγελίαν എന്നത് വാഗ്ദത്തത്തെയോ വാഗ്ദാനം ചെയ്യപ്പെട്ട കാര്യമോ സൂചിപ്പിക്കാവുന്ന അർഥസാധ്യത.
lexical_decisions:
- source_word: ὑπομονῆς
  choice: സഹിച്ചുനിൽപ്പ്
  rationale: സമ്മർദത്തിന്റെയും പരീക്ഷയുടെയും കീഴിൽ പതറാതെ സ്ഥിരമായി നിലകൊള്ളുന്നതാണ് ὑπομονή സൂചിപ്പിക്കുന്നത്. ‘സഹിച്ചുനിൽപ്പ്’ ഈ സജീവവും ദീർഘകാലവുമായ ഭാവം സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: χρείαν ἔχετε
  choice: നിങ്ങൾക്ക് ... ആവശ്യമാണ്
  rationale: χρείαν ἔχειν എന്ന പ്രയോഗത്തിന്റെ സ്വാഭാവിക അർഥം ‘ആവശ്യമുണ്ട്’ എന്നതാണ്. മലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമായ രൂപമാണിത്.
- source_word: ἵνα
  choice: '... വേണ്ടതിന്'
  rationale: ἵνα ലക്ഷ്യമോ ഉദ്ദേശിച്ച ഫലമോ അവതരിപ്പിക്കുന്നു. ‘വേണ്ടതിന്’ ആ ബന്ധം ചുരുക്കമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ ഇഷ്ടം
  rationale: ഗ്രീക്കിലെ ജനിറ്റീവ് ഘടന നേരിട്ട് നിലനിർത്തുകയും മലയാള ബൈബിൾഭാഷയിൽ പരിചിതവും വ്യക്തവുമായ പ്രയോഗം നൽകുകയും ചെയ്യുന്നു.
- source_word: ποιήσαντες
  choice: ചെയ്തശേഷം
  rationale: അഓറിസ്റ്റ് പാർട്ടിസിപ്പിൾ പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘ചെയ്തശേഷം’ ആ കാലബന്ധം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: κομίσησθε
  choice: പ്രാപിക്കേണ്ടതിന്
  rationale: ഈ സന്ദർഭത്തിൽ κομίζω വാഗ്ദാനം ചെയ്യപ്പെട്ടത് സ്വീകരിക്കുകയോ സ്വന്തമാക്കുകയോ ചെയ്യുക എന്ന അർഥത്തിലാണ്. ‘പ്രാപിക്കുക’ ഗൗരവമുള്ളതും സ്വാഭാവികവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: τὴν ἐπαγγελίαν
  choice: വാഗ്ദത്തം
  rationale: ἐπαγγελία എന്ന നാമത്തിന്റെ നേരിട്ടുള്ള അർഥമായ ‘വാഗ്ദത്തം’ നിലനിർത്തുന്നു; അത് വാഗ്ദാനത്തെയോ വാഗ്ദാനം ചെയ്തതിന്റെ നിറവേറ്റലിനെയോ സൂചിപ്പിക്കാമെന്ന അവ്യക്തത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ἐπαγγελίαν എന്നത് വാഗ്ദത്തത്തെ തന്നെയാണോ, വാഗ്ദാനം ചെയ്യപ്പെട്ട കാര്യമോ അതിന്റെ നിറവേറ്റലോ ആണോ സൂചിപ്പിക്കുന്നത്
  choice: വാഗ്ദത്തം
  alternative: വാഗ്ദാനം ചെയ്യപ്പെട്ടത്
  rationale: ഗ്രീക്കിൽ നേരിട്ട് ഉപയോഗിച്ചിരിക്കുന്നത് ‘വാഗ്ദത്തം’ എന്ന നാമമാണ്; എന്നാൽ κομίσησθε എന്ന ക്രിയയോടൊപ്പം അത് വാഗ്ദാനം ചെയ്യപ്പെട്ട അനുഗ്രഹം പ്രാപിക്കുന്നതിനെ സൂചിപ്പിക്കാനും കഴിയും. മുഖ്യപാഠം ഉറവിടത്തിന്റെ രൂപവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു; കൂടുതൽ വ്യാഖ്യാനാത്മകമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ‘സഹിച്ചുനിൽപ്പ്’ സ്ഥിരതയോടെയുള്ള ക്ഷമയെ സജീവമായി അവതരിപ്പിക്കുന്നു; ‘വാഗ്ദത്തം’ ഉറവിടത്തിലെ സംക്ഷിപ്തതയും അവ്യക്തതയും സംരക്ഷിക്കുന്നു.
