id: HEB.10.16
reference: Hebrews 10:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Αὕτη ἡ διαθήκη ἣν διαθήσομαι πρὸς αὐτοὺς μετὰ τὰς ἡμέρας ἐκείνας, λέγει κύριος, διδοὺς νόμους μου ἐπὶ καρδίας αὐτῶν, καὶ ἐπὶ ⸂τὴν διάνοιαν⸃ αὐτῶν ἐπιγράψω αὐτούς,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/016.yaml
  text: 'This is the covenant that I will make with them after those days[a], says the Lord: putting my laws upon their hearts, and I will write them on their minds,'
translation:
  language: ml
  text: '“ആ നാളുകൾക്കുശേഷം ഞാൻ അവരുമായി ചെയ്യുന്ന ഉടമ്പടി ഇതാണ്,” കർത്താവ് അരുളിച്ചെയ്യുന്നു: “എന്റെ നിയമങ്ങൾ അവരുടെ ഹൃദയങ്ങളിൽ വെച്ചുകൊണ്ട്, അവരുടെ മനസ്സുകളിൽ ഞാൻ അവ എഴുതും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαθήκη
  choice: ഉടമ്പടി
  rationale: യിരെമ്യാവിലെ പുതിയ ഉടമ്പടിയുടെ പശ്ചാത്തലം നിലനിർത്തുന്ന സ്വാഭാവികമായ മലയാള പദം; ‘വിൽപ്പത്രം’ എന്ന അർഥം ഇവിടെ യോജിക്കുന്നില്ല.
- source_word: διαθήσομαι πρὸς αὐτούς
  choice: ഞാൻ അവരുമായി ചെയ്യുന്ന
  rationale: ഉടമ്പടി സ്ഥാപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ഭാവികാല ആശയം മലയാളത്തിൽ ഉദ്ധരണിയുടെ സ്വാഭാവിക വാക്യഘടനയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: μετὰ τὰς ἡμέρας ἐκείνας
  choice: ആ നാളുകൾക്കുശേഷം
  rationale: ഗ്രീക്കിലെ കാലസൂചന വിപുലീകരിക്കാതെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: λέγει κύριος
  choice: കർത്താവ് അരുളിച്ചെയ്യുന്നു
  rationale: κύριος എന്നത് ‘കർത്താവ്’ എന്നും, ദൈവിക പ്രഖ്യാപനത്തിന്റെ ഗൗരവമുള്ള ശൈലി λέγει എന്നതിന് ‘അരുളിച്ചെയ്യുന്നു’ എന്നും നൽകുന്നു.
- source_word: διδοὺς νόμους μου ἐπὶ καρδίας αὐτῶν
  choice: എന്റെ നിയമങ്ങൾ അവരുടെ ഹൃദയങ്ങളിൽ വെച്ചുകൊണ്ട്
  rationale: διδοὺς എന്ന വർത്തമാന കൃദന്തരൂപവും νόμους എന്ന ബഹുവചനവും സംരക്ഷിക്കുന്നു; രൂപകാത്മക സ്ഥാനബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഹൃദയങ്ങളിൽ’ എന്ന് നൽകുന്നു.
- source_word: ἐπὶ τὴν διάνοιαν αὐτῶν
  choice: അവരുടെ മനസ്സുകളിൽ
  rationale: διάνοια ചിന്തിക്കുകയും ഗ്രഹിക്കുകയും ചെയ്യുന്ന മനസ്സിനെ സൂചിപ്പിക്കുന്നു; αὐτῶν എന്ന ബഹുവചനബന്ധം മലയാളത്തിൽ ‘മനസ്സുകളിൽ’ എന്നു സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἐπιγράψω αὐτούς
  choice: ഞാൻ അവ എഴുതും
  rationale: ഭാവികാല ക്രിയയും മുമ്പുള്ള ‘നിയമങ്ങൾ’ എന്നതിലേക്കുള്ള സർവനാമസൂചനയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: യിരെമ്യാ ഉദ്ധരണിയിലെ ആന്തരിക വാക്യഘടന
  choice: ‘വെച്ചുകൊണ്ട്’ എന്ന കൃദന്തരൂപത്തിനുശേഷം ‘ഞാൻ അവ എഴുതും’ എന്ന സമാപികാഭാവിക ക്രിയ നിലനിർത്തി.
  alternative: 'രണ്ട് സമാപിക ക്രിയകളാക്കി: ‘ഞാൻ ... വെക്കും; ... എഴുതും.’'
  rationale: എബ്രായർ ലേഖനത്തിലെ ഗ്രീക്ക് പാഠം ആദ്യം διδοὺς എന്ന കൃദന്തവും തുടർന്ന് ἐπιγράψω എന്ന സമാപിക ക്രിയയും ഉപയോഗിക്കുന്നു. അതിനെ സമമാക്കിയോ യിരെമ്യാവിന്റെ പരിചിതമായ പരിഭാഷയോട് ഒത്തുതീർത്തോ മാറ്റാതെ മലയാളത്തിൽ വായനയോഗ്യമായി സംരക്ഷിച്ചു.
- issue: ‘ഹൃദയങ്ങൾ’ എന്നും ‘മനസ്സുകൾ’ എന്നും പറയുന്ന രൂപകങ്ങൾ
  choice: രണ്ടും വേർതിരിച്ചു ‘ഹൃദയങ്ങളിൽ’, ‘മനസ്സുകളിൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ഇരുവരെയും ഒറ്റയായ ആന്തരിക വ്യക്തിത്വത്തിന്റെ പര്യായങ്ങളാക്കി ലയിപ്പിക്കുക.
  rationale: മൂലപാഠത്തിലെ വ്യത്യസ്ത പദങ്ങളും അവയ്ക്കിടയിലെ ആശയപരമായ പിരിമുറുക്കവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നെങ്കിലും തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ‘ഉടമ്പടി’, ‘നിയമങ്ങൾ’, ‘ഹൃദയങ്ങൾ’, ‘മനസ്സുകൾ’ എന്നീ പ്രധാന അന്തർപാഠ പദങ്ങൾ വ്യക്തമായി നിലനിർത്തി. ഈ വാക്യത്തിനായി മലയാളത്തിൽ അനിവാര്യമായ പാഠക്കുറിപ്പ് ഒന്നും ചേർത്തിട്ടില്ല.
