  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλ’ ἐν αὐταῖς ἀνάμνησις ἁμαρτιῶν κατ’ ἐνιαυτόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/003.yaml
  text: But in these sacrifices there is a reminder of sins year after year,[a]
translation:
  language: ml
  text: എന്നാൽ ഈ യാഗങ്ങളിൽ വർഷംതോറും പാപങ്ങളെക്കുറിച്ച് ഓർമപ്പെടുത്തലുണ്ടാകുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഓരോ വർഷവും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ ആശയത്തോടുള്ള വൈരുധ്യം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: ἐν αὐταῖς
  choice: ഈ യാഗങ്ങളിൽ
  rationale: സ്ത്രീലിംഗ ബഹുവചന സർവനാമം മുൻസന്ദർഭത്തിലെ ആവർത്തിച്ചുള്ള യാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ആശയവ്യക്തതയ്ക്കായി നാമം ചേർത്തു.
- source_word: ἀνάμνησις
  choice: ഓർമപ്പെടുത്തൽ
  rationale: പാപങ്ങളെ വീണ്ടും മനസ്സിലേക്കു കൊണ്ടുവരുന്ന പ്രവൃത്തിയെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἁμαρτιῶν
  choice: പാപങ്ങളെക്കുറിച്ച്
  rationale: ἀνάμνησις-നോടു ബന്ധപ്പെടുന്ന ജനിറ്റീവിന്റെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; പാപങ്ങളാണ് ഓർമിപ്പിക്കപ്പെടുന്ന വിഷയം എന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: κατ’ ἐνιαυτόν
  choice: വർഷംതോറും
  rationale: ഓരോ വർഷവും ആവർത്തിക്കുന്ന സംഭവത്തെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: αὐταῖς എന്നതിന്റെ സൂചിതവിഷയം
  choice: മുൻസന്ദർഭത്തിലെ ആവർത്തിച്ചുള്ള യാഗങ്ങളെ സൂചിപ്പിക്കുന്നതായി ‘ഈ യാഗങ്ങളിൽ’ എന്നു വ്യക്തമാക്കി.
  alternative: ‘അവയിൽ’ എന്നു സർവനാമം മാത്രം നിലനിർത്തുക.
  rationale: 10:1–2-ലെ യാഗങ്ങളാണ് ഉടൻ മുൻപുള്ള സൂചിതവിഷയം. നാമം വ്യക്തമാക്കുന്നത് പുതിയ ദൈവശാസ്ത്രപരമായ ആശയം ചേർക്കാതെ വാദത്തിന്റെ വ്യക്തത കൂട്ടുന്നു.
- issue: κατ’ ἐνιαυτόν എന്നതിന്റെ കാലപരമായ ബലം
  choice: ‘വർഷംതോറും’ എന്നു പരിഭാഷപ്പെടുത്തി വാർഷിക ആവർത്തനം പ്രകടിപ്പിച്ചു.
  alternative: ‘ഓരോ വർഷവും’ എന്നു പരിഭാഷപ്പെടുത്തുക.
  rationale: രണ്ടും ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ആവർത്തനാർഥം നൽകുന്നു; ‘വർഷംതോറും’ സംക്ഷിപ്തവും സന്ദർഭത്തിലെ തുടർച്ചയായ ആവർത്തനത്തിന് യോജിച്ചതുമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘യാഗങ്ങൾ’ എന്നത് ബലികളുടെ സന്ദർഭത്തിന് പരിചിതവും സ്വാഭാവികവുമായ പദമാണ്; വാക്യത്തിലെ യഥാർഥ വൈരുധ്യവും വാർഷിക ആവർത്തനവും നിലനിർത്തിയിരിക്കുന്നു.
