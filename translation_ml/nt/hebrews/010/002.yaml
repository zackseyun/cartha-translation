id: HEB.10.2
reference: Hebrews 10:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐπεὶ οὐκ ἂν ἐπαύσαντο προσφερόμεναι, διὰ τὸ μηδεμίαν ἔχειν ἔτι συνείδησιν ἁμαρτιῶν τοὺς λατρεύοντας ἅπαξ ⸀κεκαθαρισμένους;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/002.yaml
  text: Otherwise[a], would they not have stopped being offered, because those who worship, having once been cleansed[b], would no longer have any consciousness of sins?
translation:
  language: ml
  text: അല്ലെങ്കിൽ, ആ യാഗങ്ങൾ അർപ്പിക്കപ്പെടുന്നത് നിർത്തുമായിരുന്നില്ലേ? കാരണം, ആരാധിക്കുന്നവർ ഒരിക്കൽ ശുദ്ധീകരിക്കപ്പെട്ടശേഷം[b] അവർക്ക് ഇനി പാപങ്ങളെക്കുറിച്ചുള്ള യാതൊരു ബോധവും[a] ഉണ്ടായിരിക്കുമായിരുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പാപങ്ങളെക്കുറിച്ചുള്ള മനസ്സാക്ഷിബോധം’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പ്രയോഗത്തിന് മനസ്സാക്ഷി, അവബോധം, ബോധം എന്നീ അർഥങ്ങൾ വരാം; ഇവിടെ ദൈവസന്നിധിയിൽ പാപംമൂലമുള്ള കുറ്റബോധം തുടർന്നുനിൽക്കുന്നതാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘ഒരിക്കലെന്നെന്നേക്കുമായി ശുദ്ധീകരിക്കപ്പെട്ടശേഷം’ എന്നും പരിഭാഷപ്പെടുത്താം. ‘ഒരിക്കൽ’ എന്ന ക്രിയാവിശേഷണം ഈ സന്ദർഭത്തിൽ നിർണായകവും ആവർത്തിക്കേണ്ടതില്ലാത്തതുമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: അങ്ങനെയായിരുന്നെങ്കിൽ
  rationale: മുൻവാക്യത്തിലെ വാദത്തെ അടിസ്ഥാനമാക്കിയുള്ള യാഥാർഥ്യവിരുദ്ധ നിഗമനമാണ് ഇവിടെ അവതരിപ്പിക്കുന്നത്. മലയാളത്തിൽ ഈ പ്രയോഗം ആ സാങ്കൽപ്പിക നിഗമനം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: οὐκ ἂν ἐπαύσαντο προσφερόμεναι
  choice: ആ യാഗങ്ങൾ അർപ്പിക്കുന്നത് നിർത്തുമായിരുന്നില്ലേ?
  rationale: οὐκ ἄν സഹിതമുള്ള ക്രിയാരൂപത്തിന്റെ യാഥാർഥ്യവിരുദ്ധവും വാചാടോപപരവുമായ ചോദ്യഭാവം നിലനിർത്തുന്നു; പ്രസംഗസന്ദർഭത്തിൽ മനസ്സിലാക്കപ്പെടുന്ന യാഗങ്ങളെ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: διὰ τὸ μηδεμίαν ἔχειν ἔτι
  choice: യാതൊരു ബോധവും പിന്നെ അവർക്കുണ്ടാകുമായിരുന്നില്ലല്ലോ; അതുകൊണ്ട്
  rationale: διάയോടുകൂടിയ articular infinitive കാരണത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ വാക്യക്രമത്തിന് അനുയോജ്യമായി കാരണം ആദ്യം പറഞ്ഞ് ‘അതുകൊണ്ട്’ എന്ന ബന്ധപദത്തിലൂടെ പ്രധാനചോദ്യവുമായി ചേർത്തിരിക്കുന്നു.
- source_word: συνείδησιν ἁμαρτιῶν
  choice: പാപങ്ങളെക്കുറിച്ചുള്ള യാതൊരു ബോധവും
  rationale: συνείδησις ഇവിടെ മനസ്സാക്ഷി, അവബോധം, ബോധം എന്നീ അർഥസാധ്യതകൾ വഹിക്കുന്നു. ധാർമിക വിവേചനശേഷി പൂർണമായി ഇല്ലാതാകുന്നു എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കിക്കൊണ്ട് മൂലത്തിലെ വിശാലത ‘ബോധം’ നിലനിർത്തുന്നു.
- source_word: τοὺς λατρεύοντας
  choice: ആരാധിക്കുന്നവർ
  rationale: ആരാധനയിൽ ഏർപ്പെട്ടിരിക്കുന്നവരെ സൂചിപ്പിക്കുന്ന substantival participle-ന്റെ ക്രിയാഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἅπαξ κεκαθαρισμένους
  choice: ഒരിക്കൽ ശുദ്ധീകരിക്കപ്പെട്ടശേഷം
  rationale: perfect passive participle സൂചിപ്പിക്കുന്ന പൂർത്തിയായ ശുദ്ധീകരണവും അതിന്റെ തുടർന്നുനിൽക്കുന്ന ഫലവും വായനാസൗകര്യത്തോടെ നൽകുന്നു; ἅπαξ എന്നത് പ്രധാനപാഠത്തിൽ ‘ഒരിക്കൽ’ എന്നു സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: ശുദ്ധീകരിക്കപ്പെട്ട ആരാധകരിലെ συνείδησιν ἁμαρτιῶν എന്നതിന്റെ അർഥം
  choice: പാപങ്ങളെക്കുറിച്ചുള്ള ബോധം
  alternative: പാപങ്ങളെക്കുറിച്ചുള്ള മനസ്സാക്ഷിബോധം; പാപക്കുറ്റബോധം
  rationale: വാക്യത്തിന്റെ വാദം, ഫലപ്രദമായ ശുദ്ധീകരണം ദൈവസന്നിധിയിലെ തുടർച്ചയായ പാപബോധത്തെ നീക്കുമെന്നതാണ്. എന്നാൽ വിശ്വാസിക്ക് പാപത്തെക്കുറിച്ചുള്ള ധാർമിക തിരിച്ചറിവ് ഒട്ടും ശേഷിക്കില്ലെന്ന വ്യാഖ്യാനം പരിഭാഷയിൽ നിർബന്ധിച്ച് ചേർക്കുന്നില്ല.
- issue: ἅπαξ എന്നതിന്റെ നിർണായകത
  choice: ഒരിക്കൽ
  alternative: ഒരിക്കലായി എന്നെന്നേക്കുമായി
  rationale: ഈ സന്ദർഭത്തിൽ ആവർത്തിക്കാനാവാത്ത നിർണായകത സൂചിപ്പിക്കാമെങ്കിലും, ἅπαξ എന്ന ഏകപദം തന്നെ ശക്തമായ വിപുലീകരണം നിർബന്ധിക്കുന്നില്ല. അതിനാൽ പ്രധാനപാഠം ചുരുക്കമായി സൂക്ഷിച്ച് സാധ്യത അടിക്കുറിപ്പിൽ പറയുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ദീർഘമായ ഗ്രീക്ക് ചോദ്യവാക്യത്തിന്റെ കാരണം–ഫലം ബന്ധം വ്യക്തമാക്കാൻ മലയാളത്തിന്റെ സ്വാഭാവിക വാക്യക്രമം ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് [a] അതു വിശദീകരിക്കുന്ന ‘ബോധം’ എന്ന പദത്തിനരികിലും [b] ‘ശുദ്ധീകരിക്കപ്പെട്ടശേഷം’ എന്നതിനരികിലും സ്ഥാപിച്ചു.
