source:
  edition: SBLGNT
  text: κατέχωμεν τὴν ὁμολογίαν τῆς ἐλπίδος ἀκλινῆ, πιστὸς γὰρ ὁ ἐπαγγειλάμενος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/023.yaml
  text: Let us hold fast the confession of our hope without wavering[a], for the one who promised is faithful.
translation:
  language: ml
  text: നമ്മുടെ പ്രത്യാശയുടെ ഏറ്റുപറച്ചിൽ ചാഞ്ചല്യമില്ലാതെ മുറുകെപ്പിടിക്കാം[a]; വാഗ്ദാനം ചെയ്തവൻ വിശ്വസ്തനല്ലോ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പ്രത്യാശയുടെ ഏറ്റുപറച്ചിൽ.” ഗ്രീക്കിൽ “നമ്മുടെ” എന്നു വ്യക്തമായി ചേർത്തിട്ടില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέχωμεν
  choice: മുറുകെപ്പിടിക്കാം
  rationale: ഒന്നാംപുരുഷ ബഹുവചനത്തിലെ പ്രബോധനാത്മക ഉപവിധിയുടെ ‘നമുക്ക് … ചെയ്യാം’ എന്ന ആഹ്വാനഭാവവും ഉറച്ചുനിൽക്കുക എന്ന ആശയവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὁμολογίαν
  choice: ഏറ്റുപറച്ചിൽ
  rationale: വിശ്വാസത്തെയോ പ്രത്യാശയെയോ പരസ്യമായി അംഗീകരിക്കുകയും പ്രഖ്യാപിക്കുകയും ചെയ്യുന്ന അർഥം സന്ദർഭോചിതമായി നൽകുന്നു; ‘പ്രഖ്യാപനം’ എന്നതിനെക്കാൾ വിശ്വാസസാക്ഷ്യത്തിന്റെ ഭാവം ഇതിൽ വ്യക്തമാണ്.
- source_word: τῆς ἐλπίδος
  choice: നമ്മുടെ പ്രത്യാശയുടെ
  rationale: ഗ്രീക്കിൽ ഉടമസ്ഥസർവനാമം ഇല്ലെങ്കിലും സമൂഹത്തോടുള്ള ആഹ്വാനത്തിൽ ഉദ്ദേശിക്കപ്പെടുന്നത് അവർ ഏറ്റുപറയുന്ന പ്രത്യാശയാണ്. സ്വാഭാവികതയ്ക്കായി ‘നമ്മുടെ’ ചേർത്തിരിക്കുന്നു; സ്രോതസ്സിലെ രൂപം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀκλινῆ
  choice: ചാഞ്ചല്യമില്ലാതെ
  rationale: വളയാതെയും വ്യതിചലിക്കാതെയും ഉറച്ചുനിൽക്കുന്ന ഭാവം വായനാസൗകര്യമുള്ള മലയാളത്തിൽ നൽകുന്നു; ഇത് ഏറ്റുപറച്ചിലിന്റെ അചഞ്ചലതയെ സൂചിപ്പിക്കുന്നു.
- source_word: πιστὸς
  choice: വിശ്വസ്തൻ
  rationale: വാഗ്ദാനം നിറവേറ്റുന്നതിൽ ആശ്രയിക്കാവുന്നവൻ എന്ന അർഥവും പദത്തിന്റെ ദൈവശാസ്ത്രപരമായ അനുരണനവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: ὁ ἐπαγγειλάμενος
  choice: വാഗ്ദാനം ചെയ്തവൻ
  rationale: നാമസദൃശമായി പ്രവർത്തിക്കുന്ന ഗ്രീക്ക് കൃന്തത്തിന്റെ രൂപവും മുമ്പ് നൽകിയ വാഗ്ദാനത്തിലേക്കുള്ള സൂചനയും സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു; ദൈവം എന്ന കർത്താവിനെ സ്രോതസ്സുപോലെ പരോക്ഷമായി വിടുന്നു.
theological_decisions:
- issue: ‘വാഗ്ദാനം ചെയ്തവൻ’ എന്നതിന്റെ പരോക്ഷ കർത്താവ്
  choice: സന്ദർഭത്തിൽ ദൈവം എന്നു മനസ്സിലാകുമെങ്കിലും വിവർത്തനത്തിൽ പേര് ചേർക്കാതെ സ്രോതസ്സുപോലെ പരോക്ഷമായി നിലനിർത്തി.
  alternative: ‘വാഗ്ദാനം ചെയ്ത ദൈവം’ എന്നു വ്യക്തമാക്കുക.
  rationale: സന്ദർഭം ദൈവത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്നുവെങ്കിലും ഗ്രീക്ക് പേര് തുറന്നുപറയുന്നില്ല. അതിനാൽ അനാവശ്യമായ വ്യാഖ്യാനവിപുലീകരണം ഒഴിവാക്കുന്നു.
- issue: ‘പ്രത്യാശ’യോടൊപ്പം ‘നമ്മുടെ’ ചേർക്കൽ
  choice: സ്വാഭാവികമായ സമൂഹാഭിമുഖ മലയാളത്തിനായി ‘നമ്മുടെ പ്രത്യാശയുടെ ഏറ്റുപറച്ചിൽ’ എന്നു നൽകി.
  alternative: ‘പ്രത്യാശയുടെ ഏറ്റുപറച്ചിൽ’ എന്നു ഉടമസ്ഥസർവനാമമില്ലാതെ നൽകുക.
  rationale: ഗ്രീക്കിൽ ‘നമ്മുടെ’ ഇല്ലെന്ന യഥാർഥ അസ്പഷ്ടത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തിക്കൊണ്ട്, അഭിസംബോധന ചെയ്യപ്പെടുന്ന സമൂഹത്തിന്റെ പ്രത്യാശയാണ് ഉദ്ദേശ്യമെന്ന സന്ദർഭാർഥം വായനാസൗകര്യത്തോടെ അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ പ്രബോധനശൈലി ഉപയോഗിച്ചു. ‘മുറുകെപ്പിടിക്കാം’ സമൂഹത്തോടുള്ള ഉൾക്കൊള്ളുന്ന ആഹ്വാനം സ്വാഭാവികമായി നൽകുന്നു; ‘വിശ്വസ്തനല്ലോ’ കാരണം ചൂണ്ടിക്കാണിക്കുന്ന γάρ-ന്റെ ഉറപ്പുനൽകുന്ന ഭാവം പ്രകടമാക്കുന്നു.
