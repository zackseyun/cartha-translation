id: HEB.10.5
reference: Hebrews 10:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διὸ εἰσερχόμενος εἰς τὸν κόσμον λέγει· Θυσίαν καὶ προσφορὰν οὐκ ἠθέλησας, σῶμα δὲ κατηρτίσω μοι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/005.yaml
  text: 'Therefore[a], when he comes into the world, he says: “Sacrifice and offering you did not desire, but a body you prepared for me.”'
translation:
  language: ml
  text: 'അതുകൊണ്ട്[a], അവൻ ലോകത്തിലേക്കു വരുമ്പോൾ ഇങ്ങനെ പറയുന്നു: “യാഗവും വഴിപാടും നീ ആഗ്രഹിച്ചില്ല; എന്നാൽ എനിക്കായി ഒരു ശരീരം നീ ഒരുക്കി.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ എബ്രായർക്കുള്ള ലേഖനം സങ്കീർത്തനം 40:6-ന്റെ ഗ്രീക്ക് പാഠരൂപമായ “എനിക്കായി ഒരു ശരീരം നീ ഒരുക്കി” എന്നതാണു പിന്തുടരുന്നത്. സങ്കീർത്തനം 40:6-ന്റെ എബ്രായ പാഠത്തിൽ, “എനിക്കായി നീ ചെവികൾ തുറന്നു” എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: അതുകൊണ്ട്
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: εἰσερχόμενος εἰς τὸν κόσμον
  choice: അവൻ ലോകത്തിലേക്കു വരുമ്പോൾ
  rationale: വർത്തമാന കൃദ്‌രൂപത്തിന്റെ കാലബന്ധം സ്വാഭാവികമായി നിലനിർത്തുകയും ‘ലോകത്തിലേക്ക്’ എന്ന ആശയം നേരിട്ട് പകരുകയും ചെയ്യുന്നു.
- source_word: λέγει
  choice: ഇങ്ങനെ പറയുന്നു
  rationale: തിരുവെഴുത്ത് ഉദ്ധരണി അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് വർത്തമാനകാലം നിലനിർത്തുന്നു; ‘ഇങ്ങനെ’ ഉദ്ധരണിയിലേക്കുള്ള മാറ്റം മലയാളത്തിൽ സ്വാഭാവികമാക്കുന്നു.
- source_word: Θυσίαν καὶ προσφορὰν
  choice: യാഗവും വഴിപാടും
  rationale: പരസ്പരം ബന്ധപ്പെട്ടെങ്കിലും വ്യത്യസ്തമായ രണ്ടു ആരാധനാപദങ്ങൾ വ്യക്തവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ രീതിയിൽ നിലനിർത്തുന്നു.
- source_word: οὐκ ἠθέλησας
  choice: നീ ആഗ്രഹിച്ചില്ല
  rationale: θέλω എന്നതിലെ ആഗ്രഹം/ഇഷ്ടം എന്ന അർത്ഥം, ദൈവത്തിന്റെ ബലികളോടുള്ള നിലപാട് അമിതമായി വ്യാഖ്യാനിക്കാതെ പകരുന്നു.
- source_word: σῶμα
  choice: ഒരു ശരീരം
  rationale: ഏകവചനത്തിലുള്ള മൂർത്തനാമം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും എബ്രായലേഖനത്തിലെ ശരീരസംബന്ധമായ വാദശക്തി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: യാഗവും വഴിപാടും ആഗ്രഹിക്കാത്തതും ശരീരം ഒരുക്കിയതും തമ്മിലുള്ള വ്യക്തമായ വൈരുധ്യം സൂചിപ്പിക്കുന്നു.
- source_word: κατηρτίσω μοι
  choice: എനിക്കായി ... നീ ഒരുക്കി
  rationale: καταρτίζω എന്നതിന്റെ ‘ഒരുക്കുക/സജ്ജമാക്കുക’ എന്ന അർത്ഥവും μοι എന്ന ദാതുവിന്റെ ഗുണഭോക്തൃബന്ധവും സ്വാഭാവികമായി പകരുന്നു.
theological_decisions:
- issue: എബ്രായർ 10:5-ലെ സങ്കീർത്തനം 40:6 ഉദ്ധരണിയുടെ ഗ്രീക്ക് പദക്രമം എബ്രായ പാഠത്തിൽനിന്ന് വ്യത്യസ്തമാണ്.
  choice: എബ്രായർ നൽകുന്ന ഗ്രീക്ക് പാഠമനുസരിച്ച് ‘എനിക്കായി ഒരു ശരീരം നീ ഒരുക്കി’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: സങ്കീർത്തനം 40:6-ലെ എബ്രായ പാഠത്തെ അടിസ്ഥാനമാക്കി ‘എനിക്കായി നീ ചെവികൾ തുറന്നു’ എന്നു നൽകുക.
  rationale: പരിഭാഷ ചെയ്യപ്പെടുന്ന വാക്യത്തിന്റെ മൂലഭാഷാപാഠത്തിനാണ് മുൻഗണന. വ്യത്യാസം പ്രധാനപ്പെട്ടതിനാൽ അതിനെ മുഖ്യപാഠത്തിൽ സമന്വയിപ്പിക്കാതെ അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ആരാധനാപരമായ ‘യാഗം’, ‘വഴിപാട്’ എന്നീ പരിചിതപദങ്ങൾ ഉപയോഗിച്ചു; ഗ്രീക്ക് ഉദ്ധരണിയുടെ വർത്തമാന അവതരണവും പാഠഭേദത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തി.
