id: HEB.10.26
reference: Hebrews 10:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἑκουσίως γὰρ ἁμαρτανόντων ἡμῶν μετὰ τὸ λαβεῖν τὴν ἐπίγνωσιν τῆς ἀληθείας, οὐκέτι περὶ ἁμαρτιῶν ἀπολείπεται θυσία,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/026.yaml
  text: For if we go on sinning deliberately after receiving the knowledge of the truth[a], there no longer remains a sacrifice for sins,
translation:
  language: ml
  text: കാരണം, സത്യത്തെക്കുറിച്ചുള്ള അറിവ്[a] ലഭിച്ചശേഷം നാം മനഃപൂർവം പാപം ചെയ്തുകൊണ്ടിരുന്നാൽ, പാപങ്ങൾക്കായി ഒരു യാഗവും ഇനി ശേഷിക്കുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സത്യത്തെക്കുറിച്ചുള്ള പൂർണപരിജ്ഞാനം.’ ഗ്രീക്കുപദത്തിന് പൂർണമായതോ നിർണായകമായതോ ആയ അറിവ് എന്ന ഭാവവും ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑκουσίως
  choice: മനഃപൂർവം
  rationale: മനസ്സറിഞ്ഞുള്ള ഉദ്ദേശ്യപൂർവമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പദം.
- source_word: γὰρ
  choice: വാക്യത്തിന്റെ വിശദീകരണബന്ധം സന്ദർഭത്തിലൂടെ പ്രകടമാക്കി
  rationale: മുൻവാക്യത്തോടുള്ള വിശദീകരണബന്ധം ഗ്രീക്കിൽ വ്യക്തമാണ്. എന്നാൽ ഒറ്റവാക്യമായി വായിക്കുമ്പോൾ ‘എന്തെന്നാൽ’ ചേർക്കുന്നത് മലയാളത്തിൽ അപൂർണമായി തോന്നാം; അതിനാൽ ബന്ധം വാക്യഘടനയിൽ നിലനിർത്തി.
- source_word: ἁμαρτανόντων ἡμῶν
  choice: നാം ... പാപം ചെയ്തുകൊണ്ടിരുന്നാൽ
  rationale: വർത്തമാനകാല പങ്കാളിപദത്തിന്റെ തുടരുന്ന പ്രവൃത്തിസ്വഭാവവും genitive absolute ഘടനയുടെ സന്ദർഭാനുസൃതമായ വ്യവസ്ഥാഭാവവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: μετὰ τὸ λαβεῖν
  choice: ലഭിച്ചശേഷവും
  rationale: സത്യപരിജ്ഞാനം ലഭിച്ചതിനുശേഷമുള്ള തുടർച്ചയായ പാപത്തെ വ്യക്തമാക്കുന്നു; ‘-വും’ മുന്നറിയിപ്പിലെ വിരോധഭാവം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἐπίγνωσιν
  choice: പരിജ്ഞാനം
  rationale: വെറും വിവരം എന്നതിലുപരി അറിവ്/തിരിച്ചറിവ് എന്ന ശക്തമായ ഭാവം വഹിക്കാൻ കഴിയുന്ന മലയാളപദം; ‘പൂർണപരിജ്ഞാനം’ എന്ന കൂടുതൽ ശക്തമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: τῆς ἀληθείας
  choice: സത്യത്തെക്കുറിച്ചുള്ള
  rationale: ജെനിറ്റീവ് ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ സുവിശേഷസത്യത്തെ സൂചിപ്പിച്ചേക്കാമെങ്കിലും അത് വിശദീകരിച്ച് ചേർത്തിട്ടില്ല.
- source_word: οὐκέτι
  choice: ഇനിയൊന്നും ... ഇല്ല
  rationale: ആ ഘട്ടത്തിനുശേഷം ഇനി ശേഷിക്കാത്തതിനെ വ്യക്തമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: περὶ ἁμαρτιῶν
  choice: പാപങ്ങൾക്കുവേണ്ടിയുള്ള
  rationale: യാഗസന്ദർഭത്തിൽ περὶ + genitive എന്നതിന്റെ ‘പാപങ്ങൾക്കുവേണ്ടി’ എന്ന അർഥം സംരക്ഷിക്കുന്നു.
- source_word: ἀπολείπεται
  choice: ശേഷിക്കുന്നില്ല
  rationale: ഗ്രീക്കിലെ ‘ശേഷിക്കുന്നു/ബാക്കിയാകുന്നു’ എന്ന ആശയം മലയാളത്തിൽ നേരിട്ട് നൽകുന്നു.
- source_word: θυσία
  choice: യാഗം
  rationale: എബ്രായലേഖനത്തിന്റെ ബലിയർപ്പണസന്ദർഭത്തിന് യോജിക്കുന്ന, സാധാരണ വായനക്കാർക്ക് പരിചിതമായ മാന്യമായ പദം.
theological_decisions:
- issue: ἁμαρτανόντων എന്നതിന്റെ പ്രവൃത്തിസ്വഭാവവും മുന്നറിയിപ്പിന്റെ പരിധിയും
  choice: ‘പാപം ചെയ്തുകൊണ്ടിരുന്നാൽ’ എന്ന് തുടർച്ചയായ പ്രവൃത്തിയായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘മനഃപൂർവം പാപം ചെയ്താൽ’
  rationale: വർത്തമാനകാല പങ്കാളിപദം തുടരുന്നോ പതിവായോ ഉള്ള പ്രവൃത്തിയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു. ഒറ്റപ്പെട്ട ഒരു മനഃപൂർവ പാപത്തെക്കുറിച്ചാണെന്ന് അതിരുകടന്ന് പറയാതെയും വിശ്വാസത്യാഗം/സ്ഥിരോത്സാഹം സംബന്ധിച്ച ഏതെങ്കിലും മതവിഭാഗീയ നിലപാട് ചേർക്കാതെയും മുന്നറിയിപ്പിന്റെ ഗൗരവം നിലനിർത്തുന്നു.
- issue: ἐπίγνωσις സൂചിപ്പിക്കുന്ന അറിവിന്റെ ദൈവശാസ്ത്രപരമായ ആഴം
  choice: ‘സത്യത്തെക്കുറിച്ചുള്ള പരിജ്ഞാനം’ എന്ന് നൽകി; രക്ഷാകരമായ പുതുജനനം എന്ന് നിർവചിച്ചില്ല.
  alternative: ‘സത്യത്തെക്കുറിച്ചുള്ള പൂർണപരിജ്ഞാനം’ അല്ലെങ്കിൽ ‘രക്ഷാകരമായ സത്യജ്ഞാനം’
  rationale: വാക്യം സത്യപരിജ്ഞാനം ലഭിച്ചതായി പറയുന്നു; എന്നാൽ ആ അറിവിന്റെ അനുഭവപരമോ രക്ഷാശാസ്ത്രപരമോ ആയ നില കൃത്യമായി നിർവചിക്കുന്നില്ല. അതിനാൽ ഗ്രീക്കിലെ യഥാർഥ അനിശ്ചിതത്വവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും സംരക്ഷിച്ചു.
- issue: θυσίαയുടെ ഏകത്വവും ക്രിസ്തുവിന്റെ യാഗവുമായുള്ള ബന്ധവും
  choice: ‘യാഗം ഇനിയൊന്നും ശേഷിക്കുന്നില്ല’ എന്ന് നൽകി.
  alternative: ‘മറ്റൊരു യാഗം ശേഷിക്കുന്നില്ല’
  rationale: ‘മറ്റൊരു’ എന്നു ചേർത്താൽ ഗ്രീക്കിൽ പരോക്ഷമായിരിക്കുന്ന ആശയം കൂടുതൽ വ്യാഖ്യാനാത്മകമായി വ്യക്തമാകും. പ്രധാനപാഠം അത്രയും വിശദീകരിക്കാതെ, യാഗം ഇനി ശേഷിക്കുന്നില്ല എന്ന വാക്യത്തിന്റെ നേരിട്ടുള്ള ശക്തി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ‘മനഃപൂർവം’ ഉദ്ദേശ്യപൂർവതയും ‘ചെയ്തുകൊണ്ടിരുന്നാൽ’ തുടർച്ചയും വേർതിരിച്ച് വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം പ്രധാനപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
