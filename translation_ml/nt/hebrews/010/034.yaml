id: HEB.10.34
reference: Hebrews 10:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ γὰρ τοῖς ⸀δεσμίοις συνεπαθήσατε, καὶ τὴν ἁρπαγὴν τῶν ὑπαρχόντων ὑμῶν μετὰ χαρᾶς προσεδέξασθε, γινώσκοντες ἔχειν ⸀ἑαυτοὺς κρείττονα ⸀ὕπαρξιν καὶ μένουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/034.yaml
  text: For you also suffered together with the prisoners[a], and you accepted with joy the plundering of your possessions[b], knowing that you yourselves have a better and lasting possession.
translation:
  language: ml
  text: തടവിലായവരുടെ കഷ്ടങ്ങളിൽ നിങ്ങളും പങ്കുചേർന്നല്ലോ[a]. നിങ്ങളുടെ വസ്തുവകകൾ കൊള്ളയടിക്കപ്പെട്ടത് നിങ്ങൾ സന്തോഷത്തോടെ സ്വീകരിക്കുകയും ചെയ്തു, നിങ്ങൾക്കുതന്നെ ശ്രേഷ്ഠവും നിലനിൽക്കുന്നതുമായ ഒരു സമ്പത്ത് ഉണ്ടെന്ന് അറിഞ്ഞുകൊണ്ട്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘തടവിലായവരോട് നിങ്ങൾ സഹതാപം കാണിച്ചു.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് സഹതാപം കാണിക്കുക എന്നും കഷ്ടത്തിൽ പങ്കുചേരുക എന്നും അർഥമാകാം; ഇവിടെ രണ്ടാമത്തെ അർഥമാണ് സന്ദർഭത്തോട് കൂടുതൽ യോജിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: 'ചില കൈയെഴുത്തുപ്രതികളിൽ: ‘നിങ്ങൾക്കായി സ്വർഗത്തിൽ ശ്രേഷ്ഠവും നിലനിൽക്കുന്നതുമായ ഒരു സമ്പത്ത് ഉണ്ടെന്ന് അറിഞ്ഞുകൊണ്ട്.’'
    reason: textual_variant
lexical_decisions:
- source_word: δεσμίοις
  choice: തടവിലായവർ
  rationale: δέσμιος എന്നത് ബന്ധനത്തിലോ തടവിലോ കഴിയുന്നവരെ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ പ്രയോഗമാണിത്.
- source_word: συνεπαθήσατε
  choice: കഷ്ടങ്ങളിൽ നിങ്ങളും പങ്കുചേർന്നു
  rationale: συμπαθέω സഹതാപം തോന്നുന്നതിനു പുറമേ മറ്റുള്ളവരുടെ കഷ്ടത്തിൽ പങ്കാളിയാകുന്ന ഐക്യദാർഢ്യവും സൂചിപ്പിക്കാം. σύν- എന്ന ഘടകവും പീഡനസന്ദർഭവും കണക്കിലെടുത്ത് സജീവമായ പങ്കാളിത്തം മുന്നിൽ കൊണ്ടുവരുന്നു.
- source_word: ἁρπαγήν
  choice: കൊള്ളയടിക്കപ്പെട്ടത്
  rationale: ἁρπαγή ബലപ്രയോഗത്തോടെയുള്ള അന്യായമായ അപഹരണത്തെ സൂചിപ്പിക്കുന്നു. ‘കണ്ടുകെട്ടൽ’ എന്ന ഭരണപരമായ പദത്തേക്കാൾ ഗ്രീക്കിന്റെ ശക്തി ഇത് നിലനിർത്തുന്നു.
- source_word: τῶν ὑπαρχόντων ὑμῶν
  choice: നിങ്ങളുടെ വസ്തുവകകൾ
  rationale: ഇവിടെ ὑπάρχω എന്ന കൃതന്തം നാമരൂപത്തിൽ ഒരാളുടെ ഭൗതികമായ ഉടമസ്ഥവസ്തുക്കളെ സൂചിപ്പിക്കുന്നു.
- source_word: μετὰ χαρᾶς
  choice: സന്തോഷത്തോടെ
  rationale: ഗ്രീക്കിലെ അർഥവും ഊന്നലും സ്വാഭാവികമായ മലയാള ക്രിയാവിശേഷണത്തിലൂടെ നൽകുന്നു.
- source_word: προσεδέξασθε
  choice: സ്വീകരിച്ചു
  rationale: προσδέχομαι എന്നതിന് സ്വീകരിക്കുക, വരവേൽക്കുക എന്നീ അർഥങ്ങളുണ്ട്. ഇവിടെ അനീതിയെ അംഗീകരിച്ചു എന്ന ധ്വനി വരാതെ നഷ്ടം മനസ്സോടെ സഹിച്ചതിനെ ‘സ്വീകരിച്ചു’ വ്യക്തമാക്കുന്നു.
- source_word: γινώσκοντες
  choice: അറിഞ്ഞുകൊണ്ട്
  rationale: കൃതന്തത്തിന്റെ സമകാലികവും കാരണസൂചകവുമായ ഭാവം അതിരുകടന്ന് വ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്നു.
- source_word: ἑαυτοὺς ἔχειν
  choice: നിങ്ങൾക്കുതന്നെ ... ഉണ്ടെന്ന്
  rationale: പ്രതിഫലന സർവനാമത്തിന്റെ ഊന്നൽ ‘നിങ്ങൾക്കുതന്നെ’ എന്നതിലൂടെ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: κρείττονα
  choice: ശ്രേഷ്ഠമായ
  rationale: എബ്രായലേഖനത്തിൽ ആവർത്തിക്കുന്ന താരതമ്യപ്രമേയത്തോട് യോജിച്ചും ‘മെച്ചപ്പെട്ട’ എന്നതിനെക്കാൾ dignified ആയുമുള്ള പ്രയോഗമാണിത്.
- source_word: ὕπαρξιν
  choice: സമ്പത്ത്
  rationale: ὕπαρξις ഉടമസ്ഥതയെയോ സമ്പത്തിനെയോ സൂചിപ്പിക്കുന്നു. ഭൂമിയിലെ വസ്തുവകകളോട് വിരുദ്ധമായി നിൽക്കുന്ന ഏകവചന കൂട്ടാർഥം മലയാളത്തിൽ ‘ഒരു സമ്പത്ത്’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: μένουσαν
  choice: നിലനിൽക്കുന്നതായ
  rationale: μένω ഇവിടെ ആ സമ്പത്തിന്റെ സ്ഥിരതയും തുടർച്ചയും ഊന്നുന്നു; ‘നിലനിൽക്കുന്നത്’ ഈ അർഥം നേരിട്ട് നൽകുന്നു.
theological_decisions:
- issue: തടവിലായവരോടുള്ള ഐക്യദാർഢ്യത്തിന്റെ സ്വഭാവം
  choice: അവരുടെ കഷ്ടങ്ങളിൽ പങ്കുചേർന്നതായി വിവർത്തനം ചെയ്തു.
  alternative: തടവിലായവരോട് സഹതാപം കാണിച്ചു.
  rationale: συμπαθέω സഹതാപം എന്ന അർഥം അനുവദിക്കുന്നുവെങ്കിലും, ദത്തിവോടുകൂടിയ പ്രയോഗവും എബ്രായർ 10:32–34-ലെ പീഡനസന്ദർഭവും ചെലവേറിയ സജീവ ഐക്യദാർഢ്യത്തെ മുൻനിർത്തുന്നു. പദത്തിന്റെ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- issue: ‘ശ്രേഷ്ഠവും നിലനിൽക്കുന്നതുമായ സമ്പത്ത്’ എന്താണെന്നത്
  choice: സ്വർഗം, രക്ഷ, അവകാശം, പ്രതിഫലം എന്നിവയിൽ ഒന്നായി വ്യക്തമാക്കാതെ പൊതുവായ പ്രയോഗം നിലനിർത്തി.
  alternative: സ്വർഗത്തിലുള്ള ശ്രേഷ്ഠമായ സമ്പത്ത്; ശ്രേഷ്ഠമായ അവകാശം.
  rationale: SBLGNT മുഖ്യപാഠത്തിൽ ‘സ്വർഗത്തിൽ’ എന്നില്ല. അതിനാൽ വാക്യം നൽകുന്ന വിശാലതയും അന്ത്യകാലസൂചനയിലെ തുറന്ന നിലയും സംരക്ഷിച്ചു; പാഠഭേദം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘വസ്തുവകകൾ’ എന്ന ഭൗതികപദവും ‘സമ്പത്ത്’ എന്ന ഏകവചനപദവും ഉപയോഗിച്ച് ഗ്രീക്കിലെ ὑπαρχόντων/ὕπαρξιν ബന്ധം ഭാഗികമായി സംരക്ഷിച്ചു. മുഖ്യപാഠത്തിൽ വ്യാഖ്യാനപരമായ ‘സ്വർഗത്തിൽ’ ചേർത്തിട്ടില്ല.
