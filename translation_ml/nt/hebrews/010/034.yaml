  naturalness: ‘തടവിലായവരുടെ കഷ്ടങ്ങളിൽ നിങ്ങളും പങ്കുചേർന്നു’ സ്വാഭാവികമാണ്. എന്നാൽ ‘അറിഞ്ഞുകൊണ്ട്’ എന്ന ഘടകം ‘സ്വീകരിക്കുകയും ചെയ്തു’ എന്ന ക്രിയയ്ക്കുശേഷം വരുമ്പോൾ മലയാളത്തിൽ നഷ്ടം സ്വീകരിച്ചതിന്റെ കാരണമായി കൂടുതൽ സ്വാഭാവികമായും വ്യക്തമായും വായിക്കപ്പെടുന്നു.
