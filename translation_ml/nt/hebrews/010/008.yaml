id: HEB.10.8
reference: Hebrews 10:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀνώτερον λέγων ὅτι ⸂Θυσίας καὶ προσφορὰς⸃ καὶ ὁλοκαυτώματα καὶ περὶ ἁμαρτίας οὐκ ἠθέλησας οὐδὲ εὐδόκησας, αἵτινες κατὰ ⸀νόμον προσφέρονται,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/008.yaml
  text: After saying above[a], “Sacrifices and offerings and whole burnt offerings and sin offerings you did not desire[c][b], nor did you delight in”—which are offered according to the law—
translation:
  language: ml
  text: 'മുമ്പ് ഇപ്രകാരം പറഞ്ഞിട്ട്: “യാഗങ്ങളും അർപ്പണങ്ങളും സർവാംഗഹോമങ്ങളും പാപയാഗങ്ങളും നീ ആഗ്രഹിച്ചില്ല; അവയിൽ പ്രസാദിച്ചുമില്ല”—ഇവ ന്യായപ്രമാണപ്രകാരം അർപ്പിക്കപ്പെടുന്നവയാണ്—'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνώτερον λέγων
  choice: മുകളിൽ പറഞ്ഞതുപോലെ
  rationale: തൊട്ടുമുമ്പ് ഉദ്ധരിച്ച വാക്കുകളിലേക്കുള്ള സൂചന സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; കൃത്രിമമായ കാലക്രമവായന ഒഴിവാക്കുന്നു.
- source_word: Θυσίας καὶ προσφορὰς
  choice: യാഗങ്ങളും വഴിപാടുകളും
  rationale: ആരാധനാപരമായ അർപ്പണങ്ങളുടെ രണ്ടു പൊതുവിഭാഗങ്ങളെ വ്യത്യസ്തവും പരിചിതവുമായ പദങ്ങളാൽ അവതരിപ്പിക്കുന്നു.
- source_word: ὁλοκαυτώματα
  choice: സർവാംഗഹോമങ്ങളും
  rationale: യാഗവസ്തു മുഴുവനായി ദഹിപ്പിക്കപ്പെടുന്ന അർപ്പണം എന്ന മൂലപദത്തിന്റെ പ്രത്യേകത സംക്ഷിപ്തമായി സൂക്ഷിക്കുന്നു.
- source_word: περὶ ἁμαρτίας
  choice: പാപപരിഹാരയാഗങ്ങളും
  rationale: സെപ്തുഅജിന്റിലെയും ലേവ്യയാഗസന്ദർഭത്തിലെയും സാങ്കേതിക ബലി-വിഭാഗത്തെ വ്യക്തമാക്കുന്നു; വെറും പൊതുവായ ‘പാപത്തെക്കുറിച്ചുള്ളത്’ എന്ന അർഥം ഒഴിവാക്കുന്നു.
- source_word: οὐκ ἠθέλησας
  choice: നീ ആഗ്രഹിച്ചില്ല
  rationale: θέλω എന്ന ക്രിയയുടെ ഇച്ഛ/ആഗ്രഹ അർഥം നിലനിർത്തുകയും അടുത്ത ക്രിയയുമായുള്ള വ്യത്യാസം കാക്കുകയും ചെയ്യുന്നു.
- source_word: οὐδὲ εὐδόκησας
  choice: അവയിൽ പ്രസാദിച്ചതുമില്ല
  rationale: അംഗീകാരത്തോടുകൂടിയ സംതൃപ്തി എന്ന εὐδοκέωയുടെ ഭാവം നൽകുന്നു; മലയാള വ്യാകരണത്തിനായി ‘അവയിൽ’ എന്നത് മുൻപുള്ള പട്ടികയിൽനിന്ന് സ്വാഭാവികമായി പൂരിപ്പിക്കുന്നു.
- source_word: κατὰ νόμον προσφέρονται
  choice: ന്യായപ്രമാണപ്രകാരം അർപ്പിക്കപ്പെടുന്നവയാണ്
  rationale: ഈ യാഗങ്ങൾ നിയമനിർദേശത്തോട് യോജിച്ചാണ് അർപ്പിക്കപ്പെടുന്നത് എന്ന ഗ്രീക്ക് വാക്യത്തിന്റെ വർത്തമാനകാല കർമണിപ്രയോഗം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദൈവം യാഗങ്ങൾ ആഗ്രഹിച്ചില്ലെന്ന പ്രസ്താവനയും അവ ന്യായപ്രമാണപ്രകാരം അർപ്പിക്കപ്പെടുന്നു എന്ന പ്രസ്താവനയും തമ്മിലുള്ള സംഘർഷം
  choice: രണ്ടു പ്രസ്താവനകളും വിശദീകരിച്ച് ലഘൂകരിക്കാതെ അതേ വാക്യത്തിൽ നിലനിർത്തി
  alternative: ദൈവം ‘യാഗങ്ങൾ മാത്രം’ ആഗ്രഹിച്ചില്ല എന്നോ അവ ‘അപര്യാപ്തമായിരുന്നു’ എന്നോ വ്യാഖ്യാനിച്ച് ചേർക്കുക
  rationale: മൂലവാക്യം ഉദ്ദേശപൂർവം സൃഷ്ടിക്കുന്ന ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം വായനക്കാരൻ സന്ദർഭത്തിൽനിന്ന് ഗ്രഹിക്കേണ്ടതാണ്; വിവർത്തനം അത് മുൻകൂട്ടി പരിഹരിക്കരുത്.
- issue: περὶ ἁμαρτίας എന്ന പ്രയോഗത്തിന്റെ ബലിസംബന്ധമായ അർഥം
  choice: പാപപരിഹാരയാഗങ്ങൾ
  alternative: പാപത്തിനുവേണ്ടിയുള്ള അർപ്പണങ്ങൾ
  rationale: ഇവിടെ ലേവ്യബലിവ്യവസ്ഥയിലെ ഒരു പ്രത്യേക വിഭാഗമാണ് ഉദ്ദേശിക്കുന്നത്; എന്നാൽ അതിന്റെ തുടർദൈവശാസ്ത്രപരമായ ഫലം വിവർത്തനത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള തിരുവെഴുത്തുശൈലി. ‘സർവാംഗഹോമം’, ‘പാപപരിഹാരയാഗം’, ‘ന്യായപ്രമാണം’ എന്നീ ആരാധനാ-നിയമ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് തിരിച്ചറിയാവുന്ന വിധത്തിൽ ഉപയോഗിച്ചു. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനത്തെ ദീർഘരേഖ നിലനിർത്തി.
