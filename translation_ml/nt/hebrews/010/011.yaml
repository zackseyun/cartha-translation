id: HEB.10.11
reference: Hebrews 10:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ πᾶς μὲν ἱερεὺς ἕστηκεν καθ’ ἡμέραν λειτουργῶν καὶ τὰς αὐτὰς πολλάκις προσφέρων θυσίας, αἵτινες οὐδέποτε δύνανται περιελεῖν ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/011.yaml
  text: And every priest stands day after day ministering and offering the same sacrifices again and again[a], which can never take away sins.
translation:
  language: ml
  text: ഓരോ പുരോഹിതനും ദിവസേന ശുശ്രൂഷ ചെയ്യുകയും ഒരേ യാഗങ്ങൾ വീണ്ടും വീണ്ടും അർപ്പിക്കുകയും ചെയ്തുകൊണ്ട് നിൽക്കുന്നു; ആ യാഗങ്ങൾക്ക് പാപങ്ങളെ ഒരിക്കലും എടുത്തുകളയാൻ[a] കഴിയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നീക്കിക്കളയാൻ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ... ἱερεὺς
  choice: ഓരോ പുരോഹിതനും
  rationale: ഏകവചന നാമത്തോടുകൂടിയ πᾶς-ന്റെ വിതരണാർഥം നിലനിർത്തുന്നു; ഇത് ലേവ്യപുരോഹിതക്രമത്തിലെ ഓരോ പുരോഹിതനെയും സൂചിപ്പിക്കുന്നു, മഹാപുരോഹിതനെ മാത്രമല്ല.
- source_word: ἕστηκεν
  choice: നിൽക്കുന്നു
  rationale: പുരോഹിതന്റെ തുടർന്നുനിൽക്കുന്ന നിലയെ സ്വാഭാവികമായി അറിയിക്കുകയും അടുത്ത വാക്യത്തിലെ മശിഹായുടെ ഇരിപ്പുമായുള്ള ദൃശ്യവൈരുധ്യം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: καθ’ ἡμέραν
  choice: ദിവസംതോറും
  rationale: ദിവസേന ആവർത്തിക്കുന്ന പ്രവൃത്തിയെ ആധുനികവും സ്വാഭാവികവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: λειτουργῶν
  choice: ശുശ്രൂഷ ചെയ്തുകൊണ്ടും
  rationale: പൊതുവായ സേവനത്തേക്കാൾ ഇവിടെ ഉദ്ദേശിക്കുന്ന ആരാധനാപരവും പുരോഹിതപരവുമായ സേവനത്തിന്റെ ഭാവം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: τὰς αὐτὰς ... θυσίας
  choice: ഒരേ യാഗങ്ങൾ
  rationale: അதே യാഗങ്ങൾ ആവർത്തിച്ച് അർപ്പിക്കുന്നതിലുള്ള ഊന്നൽ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: πολλάκις
  choice: വീണ്ടും വീണ്ടും
  rationale: ആവർത്തനത്തിന്റെ ശക്തമായ വാചാടോപഭാവം സ്വാഭാവിക മലയാളത്തിൽ പകർന്നു നൽകുന്നു.
- source_word: προσφέρων
  choice: അർപ്പിച്ചുകൊണ്ടും
  rationale: യാഗസന്ദർഭത്തിൽ προσφέρω എന്നതിന്റെ കൃത്യവും പതിവുമായ അർഥം നൽകുന്നു.
- source_word: αἵτινες
  choice: എന്നാൽ ആ യാഗങ്ങൾക്ക്
  rationale: മുൻപറഞ്ഞ യാഗങ്ങളിലേക്കുള്ള ബന്ധം വ്യക്തമാക്കുകയും ഗ്രീക്കിലെ വിശദീകരണാത്മക ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: οὐδέποτε δύνανται
  choice: ഒരിക്കലും ... കഴിയില്ല
  rationale: പൂർണമായ അശക്തിയെ മൃദൂകരിക്കാതെ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: περιελεῖν ἁμαρτίας
  choice: പാപങ്ങളെ ... എടുത്തുകളയാൻ
  rationale: περιαιρέω എന്നതിന്റെ നീക്കംചെയ്യുക/എടുത്തുകളയുക എന്ന അർഥം ബലിപരിഹാരസന്ദർഭത്തിന് അനുയോജ്യമായ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: പുരോഹിതൻ നിൽക്കുന്നതും എബ്രായർ 10-ലെ വാദവും തമ്മിലുള്ള ബന്ധം
  choice: ἕστηκεν എന്നത് ‘നിൽക്കുന്നു’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘നിന്നുകൊണ്ടിരിക്കുന്നു’ അല്ലെങ്കിൽ ‘നിന്നിട്ടുണ്ട്’ എന്നിങ്ങനെ കാലഭാവത്തിന് കൂടുതൽ ഊന്നൽ നൽകുക.
  rationale: ഇത് പുരോഹിതരുടെ തുടരുന്ന ശുശ്രൂഷയും അടുത്ത വാക്യത്തിലെ മശിഹായുടെ ഇരിപ്പും തമ്മിലുള്ള സാഹിത്യ-ദൈവശാസ്ത്ര വൈരുധ്യം വ്യാഖ്യാനം കൂട്ടിച്ചേർക്കാതെ നിലനിർത്തുന്നു.
- issue: യാഗങ്ങളുടെ അപ്രാപ്തിയുടെ വ്യാപ്തി
  choice: ‘പാപങ്ങളെ ഒരിക്കലും എടുത്തുകളയാൻ കഴിയില്ല’ എന്ന സമ്പൂർണ അശക്തി നിലനിർത്തി.
  alternative: ‘പാപങ്ങളെ പൂർണമായി പരിഹരിക്കാൻ കഴിയില്ല’ എന്ന മൃദുവാക്കിയ രൂപം.
  rationale: പഴയ യാഗങ്ങളുടെ അപര്യാപ്തതയെക്കുറിച്ചുള്ള ഗ്രന്ഥകാരന്റെ വാദത്തിൽ ഗ്രീക്ക് വാചകം സമ്പൂർണ അശക്തിയാണ് പ്രസ്താവിക്കുന്നത്; അതിനെ പരിഭാഷയിൽ മൃദൂകരിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘പുരോഹിതൻ,’ ‘ശുശ്രൂഷ,’ ‘യാഗം’ എന്നീ പരിചിതമായ ആരാധനാപദങ്ങൾ ഉപയോഗിച്ചു; ഗ്രീക്ക് വാക്യത്തിലെ ആവർത്തനവും അടുത്ത വാക്യത്തോടുള്ള നിലപാട്-വൈരുധ്യവും വ്യക്തമായി സൂക്ഷിച്ചു.
