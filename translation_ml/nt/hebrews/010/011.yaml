- from: ഓരോ പുരോഹിതനും ദിവസംതോറും ശുശ്രൂഷ ചെയ്തുകൊണ്ടും ഒരേ യാഗങ്ങൾ വീണ്ടും വീണ്ടും അർപ്പിച്ചുകൊണ്ടും നിൽക്കുന്നു. എന്നാൽ ആ യാഗങ്ങൾക്ക് പാപങ്ങളെ ഒരിക്കലും എടുത്തുകളയാൻ[a] കഴിയില്ല.
  to: ഓരോ പുരോഹിതനും ദിവസേന ശുശ്രൂഷ ചെയ്യുകയും ഒരേ യാഗങ്ങൾ വീണ്ടും വീണ്ടും അർപ്പിക്കുകയും ചെയ്തുകൊണ്ട് നിൽക്കുന്നു; ആ യാഗങ്ങൾക്ക് പാപങ്ങളെ ഒരിക്കലും എടുത്തുകളയാൻ[a] കഴിയില്ല.
