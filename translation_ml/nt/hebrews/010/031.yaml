  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: φοβερὸν τὸ ἐμπεσεῖν εἰς χεῖρας θεοῦ ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/031.yaml
  text: It is a fearful thing to fall into the hands of the living God[a].
translation:
  language: ml
  text: ജീവനുള്ള ദൈവത്തിന്റെ കൈകളിൽ വീഴുന്നത് ഭയാനകമാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ജീവനുള്ള ദൈവത്തിന്റെ കൈകളിൽ വീഴുന്നത് ഭീതിജനകമാണ്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβερὸν
  choice: ഭയാനകമാണ്
  rationale: φοβερός ഭയം, നടുക്കം, ഭീതി എന്നിവ ഉളവാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ഭയാനകമാണ്’ ഈ മുന്നറിയിപ്പിന്റെ ഗൗരവം സ്വാഭാവികമായും ശക്തമായും നിലനിർത്തുന്നു.
- source_word: τὸ ἐμπεσεῖν
  choice: വീഴുന്നത്
  rationale: ആർട്ടിക്കിളോടുകൂടിയ ഏറിസ്റ്റ് ഇൻഫിനിറ്റീവ് നാമവൽക്കരിച്ച ക്രിയാഭാവത്തിലാണ്; εἰς ചേർന്നതിനാൽ ‘കൈകളിൽ വീഴുന്നത്’ എന്ന പ്രയോഗം മൂലരൂപത്തിന്റെ ശക്തി കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: εἰς χεῖρας
  choice: കൈകളിൽ
  rationale: ഒരാളുടെ അധികാരത്തിനോ ന്യായവിധിക്കോ കീഴിലാകുക എന്ന ആശയമുള്ള ബൈബിൾസംബന്ധിയായ രൂപകം. ‘കൈകൾ’ നിലനിർത്തുന്നത് ദൃശ്യബിംബവും അന്തർപാഠബന്ധവും സംരക്ഷിക്കുന്നു.
- source_word: θεοῦ
  choice: ദൈവത്തിന്റെ
  rationale: ‘കൈകളിൽ’ എന്നതിനോടു ബന്ധപ്പെടുന്ന സ്വാമിത്വസംബന്ധമായ ജനിറ്റീവ്; അധിക വിശദീകരണം ആവശ്യമില്ല.
- source_word: ζῶντος
  choice: ജീവനുള്ള
  rationale: θεοῦ-നെ വിശേഷിപ്പിക്കുന്ന വർത്തമാന കൃതന്തം. ‘ജീവനുള്ള ദൈവം’ എന്ന സ്വാഭാവിക ബൈബിൾപ്രയോഗം ദൈവത്തിന്റെ യാഥാർഥ്യവും സജീവസാന്നിധ്യവും സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: മുന്നറിയിപ്പിന്റെ വ്യാപ്തിയും ന്യായവിധിസൂചനയും
  choice: ജീവനുള്ള ദൈവത്തിന്റെ കൈകളിൽ വീഴുന്നതിനെക്കുറിച്ചുള്ള പൊതുവായ, ഗൗരവമേറിയ പ്രഖ്യാപനമായി നിലനിർത്തി
  alternative: ഇത് താൽക്കാലിക ശിക്ഷണത്തെ മാത്രം സൂചിപ്പിക്കുന്നതായി ചുരുക്കുക; അല്ലെങ്കിൽ ന്യായവിധിസൂചനയില്ലാത്ത അസ്തിത്വപരമായ പ്രസ്താവനയായി കാണുക
  rationale: സന്ദർഭത്തിൽ ഇത് ഒരു മുന്നറിയിപ്പുഭാഗത്തിന്റെ ഉപസംഹാരമാണ്; ‘കൈകളിൽ വീഴുക’ എന്ന പ്രയോഗത്തിന് ന്യായവിധിയുടെ ശക്തമായ സൂചനയുണ്ട്. എങ്കിലും ഗ്രീക്കിൽ ‘ന്യായവിധി’ എന്ന നാമം നേരിട്ട് ഇല്ലാത്തതിനാൽ അത് മുഖ്യവാചകത്തിൽ ചേർത്ത് ആശയതർക്കം തീർപ്പാക്കിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മൂലത്തിലെ സംക്ഷിപ്തതയും ഭീഷണിയുടെ തീവ്രതയും കൈകളുടെ രൂപകവും നിലനിർത്തിയിരിക്കുന്നു.
