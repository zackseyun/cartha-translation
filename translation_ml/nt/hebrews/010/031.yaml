  source_fidelity: 'The Malayalam accurately renders the articular infinitive construction as a general statement: “ജീവനുള്ള ദൈവത്തിന്റെ കൈകളിൽ വീഴുന്നത് ഭയാനകമാണ്.” It retains the imagery of falling into God’s hands and the qualifying expression “the living God,” without adding “judgment” or another interpretive expansion. The locative form “കൈകളിൽ” is idiomatic Malayalam in this construction and adequately conveys Greek εἰς χεῖρας.'
