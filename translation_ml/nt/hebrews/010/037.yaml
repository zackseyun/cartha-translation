id: HEB.10.37
reference: Hebrews 10:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔτι γὰρ μικρὸν ὅσον ὅσον, ὁ ἐρχόμενος ἥξει καὶ οὐ χρονίσει·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/037.yaml
  text: For yet a very little while[b][a], the one who is coming will come and will not delay.
translation:
  language: ml
  text: എന്തെന്നാൽ, ഇനി വളരെ ചുരുങ്ങിയ സമയം മാത്രം[a]; വരുന്നവൻ[b] വരും; താമസിക്കുകയുമില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘അൽപ്പം, എത്രമാത്രം എത്രമാത്രം’; വളരെ ചുരുങ്ങിയ സമയത്തെ ഊന്നിപ്പറയുന്ന ഒരു പ്രയോഗം.
    reason: lexical_alternative
  - marker: b
    text: ‘വരുന്നവൻ’ എന്നത് സന്ദർഭത്തിൽ മിശിഹായെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരായിരിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτι γὰρ
  choice: ഇനി
  rationale: γάρ മുൻവാക്യത്തിലെ പ്രബോധനത്തിന് വിശദീകരണം നൽകുന്നു; മലയാളത്തിൽ ‘ഇനി’ എന്ന സ്വാഭാവിക തുടക്കം ἔτιയുടെ കാലസൂചന വ്യക്തമായി നൽകുന്നു, എന്നാൽ γάρ പ്രത്യേകം വിവർത്തനം ചെയ്യുന്നത് ഇവിടെ കൃത്രിമമാകും.
- source_word: μικρὸν ὅσον ὅσον
  choice: വളരെ അല്പസമയം മാത്രം
  rationale: ആവർത്തിച്ചുള്ള ὅσον ὅσον വളരെ ചുരുങ്ങിയ കാലത്തെ ഊന്നിപ്പറയുന്ന പ്രയോഗമാണ്; ഈ മലയാളരൂപം ആ ഊന്നൽ സ്വാഭാവികമായി പകർന്നു നൽകുന്നു.
- source_word: ὁ ἐρχόμενος
  choice: വരുവാനുള്ളവൻ
  rationale: നിശ്ചയാർഥക ഘടകത്തോടുകൂടിയ വർത്തമാന കൃദന്തരൂപം നാമമായി പ്രവർത്തിക്കുന്നു. ‘വരുവാനുള്ളവൻ’ അതിന്റെ പ്രതീക്ഷിത വരവും സന്ദർഭത്തിലെ സാധ്യതയുള്ള മിശിഹാ-സൂചനയും അനാവശ്യമായ വ്യാഖ്യാനം ചേർക്കാതെ നിലനിർത്തുന്നു.
- source_word: ἥξει
  choice: വരും
  rationale: ഭാവികാല നിർദേശത്തിന്റെ നേരിട്ടുള്ള സ്വാഭാവിക മലയാളരൂപം; ἐρχόμενος എന്നതുമായുള്ള ‘വരുക’ എന്ന ശാബ്ദിക പ്രതിധ്വനിയും സംരക്ഷിക്കുന്നു.
- source_word: οὐ χρονίσει
  choice: താമസിക്കുകയുമില്ല
  rationale: χρονίζω ഇവിടെ വൈകുക അഥവാ താമസിക്കുക എന്നർഥം നൽകുന്നു; ആധുനിക മലയാളത്തിൽ ‘താമസിക്കുകയില്ല’ വ്യക്തവും ഗൗരവമുള്ളതുമാണ്.
theological_decisions:
- issue: ὁ ἐρχόμενος എന്നത് മിശിഹാ-സ്ഥാനപ്പേരായോ സാധാരണ കൃദന്തപ്രയോഗമായോ വിവർത്തനം ചെയ്യണമോ
  choice: പ്രധാനപാഠത്തിൽ ‘വരുവാനുള്ളവൻ’ എന്നു നൽകി, സാധ്യതയുള്ള സ്ഥാനപ്പേരിന്റെ ശക്തി നിലനിർത്തി.
  alternative: ‘വരുന്നവൻ’
  rationale: നിശ്ചയാർഥക കൃദന്തം സന്ദർഭത്തിൽ പ്രതീക്ഷിക്കപ്പെടുന്ന പ്രത്യേക വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; എന്നാൽ ഗ്രീക്ക് വ്യാകരണം മാത്രം നിർബന്ധിക്കുന്നതിലധികം വ്യക്തമായി ‘മിശിഹാ’ എന്നു ചേർക്കാതിരിക്കുന്നത് യഥാർഥമായ വ്യാഖ്യാനസാധ്യത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, ഗൗരവമുള്ള മലയാളം. മൂലത്തിലെ ‘വരുക’ എന്ന ആവർത്തനം സംരക്ഷിക്കുകയും അതിന്റെ മിശിഹാ-സൂചന ഉറപ്പിച്ചു പറയാതെ നിലനിർത്തുകയും ചെയ്തു.
