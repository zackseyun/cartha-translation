revisions:
- from: ഇനി വളരെ അല്പസമയം മാത്രം[a]; വരുവാനുള്ളവൻ വരും, താമസിക്കുകയുമില്ല.[b]
  to: എന്തെന്നാൽ, ഇനി വളരെ ചുരുങ്ങിയ സമയം മാത്രം[a]; വരുന്നവൻ[b] വരും; താമസിക്കുകയുമില്ല.
  rationale: The revision restores the explanatory force of γάρ, uses idiomatic modern Malayalam for the emphatic short interval, and replaces an ambiguous future/obligative-sounding expression with a direct participial rendering. It also relocates the alternative-reading footnote anchor to the word it explains and refines the lexical footnote without imposing a messianic identification in the main text.
