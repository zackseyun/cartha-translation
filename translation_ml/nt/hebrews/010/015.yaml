  yaml_path: translation/nt/hebrews/010/015.yaml
  text: And the Holy Spirit also testifies to us[a]; for after saying,
translation:
  language: ml
  text: 'പരിശുദ്ധാത്മാവും നമ്മോടു സാക്ഷ്യം പറയുന്നു[a]; കാരണം, പറഞ്ഞശേഷം:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നമ്മോടു സാക്ഷ്യം വഹിക്കുന്നു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρεῖ
  choice: സാക്ഷ്യം പറയുന്നു
  rationale: വർത്തമാനകാല സജീവക്രിയയായ μαρτυρεῖയുടെ സാക്ഷി/സാക്ഷ്യ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: ഇവിടെ δέ ശക്തമായ വിരോധമല്ല, വാദത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്ന മൃദുവായ ബന്ധകമാണ്; മലയാളത്തിലെ വാക്യപ്രവാഹത്തിൽ പ്രത്യേക പദമില്ലാതെയും അതിന്റെ പ്രവർത്തനം സ്വാഭാവികമായി ലഭിക്കുന്നു.
- source_word: ἡμῖν
  choice: നമ്മോടു
  rationale: μαρτυρέωയോടൊപ്പമുള്ള ദത്തിവ് സാക്ഷ്യം അഭിമുഖീകരിക്കുന്നവരെ സൂചിപ്പിക്കുന്നു; ‘നമ്മോടു’ എന്നത് ഈ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: καὶ
  choice: -വും
  rationale: പരിശുദ്ധാത്മാവിനെ ഒരു അധിക സാക്ഷിയായി അവതരിപ്പിക്കുന്ന കൂട്ടിച്ചേർക്കൽഭാവം മലയാളത്തിലെ ‘-വും’ വ്യക്തമായി നൽകുന്നു.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: പരിശുദ്ധാത്മാവ്
  rationale: നിർദ്ദിഷ്ടമായ പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്ന, ആധുനിക മലയാളത്തിൽ സ്ഥാപിതവും ഗൗരവമുള്ളതുമായ പ്രയോഗം.
- source_word: μετὰ γὰρ τὸ εἰρηκέναι
  choice: പറഞ്ഞശേഷം ഇങ്ങനെ പറയുന്നു
  rationale: μετάയോടുകൂടിയ articular infinitive കാലക്രമം സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിൽ കർത്താവ് പ്രകടമല്ലെങ്കിലും മുൻവാക്യത്തിലെ പരിശുദ്ധാത്മാവാണ് സ്വാഭാവികമായി മനസ്സിലാകുന്നത്; തുടർന്നുവരുന്ന ഉദ്ധരണിയിലേക്കുള്ള മലയാളബന്ധത്തിനായി ‘ഇങ്ങനെ പറയുന്നു’ ചേർത്തിരിക്കുന്നു.
theological_decisions:
- issue: പരിശുദ്ധാത്മാവിന്റെ വ്യക്തിപരമായ സാക്ഷ്യപ്രവർത്തനം
  choice: പരിശുദ്ധാത്മാവും നമ്മോടു സാക്ഷ്യം പറയുന്നു
  alternative: പരിശുദ്ധാത്മാവും നമുക്കുവേണ്ടി സാക്ഷ്യം വഹിക്കുന്നു
  rationale: ഗ്രീക്ക് വാക്യഘടന പരിശുദ്ധാത്മാവിനെ സജീവമായി സാക്ഷ്യം പറയുന്നവനായി അവതരിപ്പിക്കുന്നു. ‘നമ്മോടു’ എന്നത് അഭിസംബോധനയുടെ അർഥം നിലനിർത്തുകയും ‘നമുക്കുവേണ്ടി’ എന്ന പക്ഷസാക്ഷ്യത്തിന്റെ അധിക അർഥം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- issue: εἰρηκέναι എന്ന infinitive-ന്റെ കർത്താവ്
  choice: മുൻവാക്യത്തിൽനിന്ന് പരിശുദ്ധാത്മാവിനെ മനസ്സിലാക്കാൻ അനുവദിക്കുന്നു
  alternative: ‘അവൻ പറഞ്ഞശേഷം’ എന്ന് ലിംഗസൂചക സർവനാമം വ്യക്തമാക്കുക
  rationale: മൂലപാഠം infinitive-ന്റെ കർത്താവിനെ പ്രത്യേകം ആവർത്തിക്കുന്നില്ല. മലയാളത്തിലും കർത്താവിനെ വീണ്ടും വ്യക്തമാക്കാതെ ഗ്രീക്കിന്റെ സംക്ഷിപ്തതയും സന്ദർഭബന്ധവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ആരാധനാപരമായ ഗൗരവം നിലനിർത്തുന്നതുമായ മലയാളം. അടുത്ത വാക്യത്തിലെ ഉദ്ധരണിയിലേക്കു വാക്യം തുറന്നുനിൽക്കുന്നതിനാൽ അവസാനത്തിൽ കോളൺ ഉപയോഗിച്ചു.
