  terminology: ‘പരിശുദ്ധാത്മാവ്’ is the standard modern Malayalam term for τὸ πνεῦμα τὸ ἅγιον. ‘സാക്ഷ്യം പറയുന്നു’ is a suitable contemporary rendering of μαρτυρεῖ; the alternate ‘സാക്ഷ്യം വഹിക്കുന്നു’ is correctly retained in the footnote.
