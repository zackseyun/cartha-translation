  source_fidelity: 'The first clause accurately represents μαρτυρεῖ δὲ ἡμῖν καὶ τὸ πνεῦμα τὸ ἅγιον: ‘പരിശുദ്ധാത്മാവും’ conveys the additive καί, and ‘നമ്മോടു സാക്ഷ്യം പറയുന്നു’ appropriately renders the dative addressee and the present-tense testimony. However, ‘പറഞ്ഞശേഷം ഇങ്ങനെ പറയുന്നു’ adds a second, present-tense act of speaking (‘ഇങ്ങനെ പറയുന്നു’) not present in μετὰ γὰρ τὸ εἰρηκέναι. The Greek has only ‘for after saying,’ and leaves the subject understood.'
