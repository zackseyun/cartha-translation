revisions:
- from: ചിലപ്പോൾ നിന്ദകൾക്കും കഷ്ടതകൾക്കും നടുവിൽ നിങ്ങൾ പരസ്യമായി കാഴ്ചവസ്തുക്കളാക്കപ്പെട്ടു[a]; മറ്റു ചിലപ്പോൾ അങ്ങനെ പെരുമാറപ്പെട്ടവരോടു പങ്കുചേരുന്നവരായിത്തീർന്നു[b].
