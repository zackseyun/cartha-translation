id: HEB.10.33
reference: Hebrews 10:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῦτο μὲν ὀνειδισμοῖς τε καὶ θλίψεσιν θεατριζόμενοι, τοῦτο δὲ κοινωνοὶ τῶν οὕτως ἀναστρεφομένων γενηθέντες·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/033.yaml
  text: sometimes being publicly exposed to insults and afflictions[b][a], and at other times becoming partners with those who were treated that way.
translation:
  language: ml
  text: ഒരുവശത്ത്, നിന്ദകൾക്കും കഷ്ടതകൾക്കും വിധേയരായി നിങ്ങൾ പരസ്യമായി കാഴ്ചവസ്തുക്കളാക്കപ്പെട്ടു[a]; മറുവശത്ത്, അങ്ങനെതന്നെ അനുഭവിച്ചവരുടെ പങ്കാളികളായിത്തീർന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, കൂടുതൽ ദൃശ്യഭാവത്തോടെ: “പൊതുജനമധ്യേ കാഴ്ചയാക്കപ്പെട്ടു.”'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: “അങ്ങനെ ജീവിച്ചവരുടെയോ പെരുമാറിയവരുടെയോ പങ്കാളികളായിത്തീർന്നു.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദത്തിന് ചില സന്ദർഭങ്ങളിൽ ജീവിതരീതിയെയോ പെരുമാറ്റത്തെയോ സൂചിപ്പിക്കാം; എന്നാൽ ഇവിടെ പീഡനത്തിന്റെ സന്ദർഭം “അങ്ങനെതന്നെ അനുഭവിച്ചവർ” എന്ന അർഥത്തിനാണ് മുൻതൂക്കം നൽകുന്നത്.'
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτο μὲν ... τοῦτο δὲ
  choice: ചിലപ്പോൾ ... മറ്റു ചിലപ്പോൾ
  rationale: രണ്ട് തരത്തിലുള്ള അനുഭവങ്ങളെ പരസ്പരം ബന്ധിപ്പിക്കുന്ന ഗ്രീക്ക് ഘടനയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὀνειδισμοῖς
  choice: നിന്ദകൾ
  rationale: വാക്കുകളിലൂടെയുള്ള അപമാനവും പഴിയും സൂചിപ്പിക്കുന്ന, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്നതുമായ പദം.
- source_word: θλίψεσιν
  choice: കഷ്ടതകൾ
  rationale: പീഡനസന്ദർഭത്തിലെ സമ്മർദങ്ങളും ദുരിതങ്ങളും അനാവശ്യമായി ചുരുക്കാതെ അറിയിക്കുന്നു.
- source_word: θεατριζόμενοι
  choice: പരസ്യമായി കാഴ്ചവസ്തുക്കളാക്കപ്പെട്ടു
  rationale: നാടകവേദിയിലെന്നപോലെ പൊതുജനമധ്യേ അപമാനകരമായി പ്രദർശിപ്പിക്കപ്പെടുന്ന ശക്തമായ ദൃശ്യഭാവം നിലനിർത്തുന്നു.
- source_word: κοινωνοὶ
  choice: പങ്കുചേരുന്നവർ
  rationale: വെറും സഹവാസമല്ല, മറ്റുള്ളവരുടെ അനുഭവത്തിലും കഷ്ടതയിലും ഐക്യദാർഢ്യത്തോടെ പങ്കാളികളാകുന്നതാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: τῶν οὕτως ἀναστρεφομένων
  choice: അങ്ങനെ പെരുമാറപ്പെട്ടവർ
  rationale: ഉടൻമുമ്പുള്ള നിന്ദയും കഷ്ടതയും മുൻനിർത്തി, അതേവിധം മറ്റുള്ളവരാൽ കൈകാര്യം ചെയ്യപ്പെട്ടവരെ സൂചിപ്പിക്കുന്നതായി സന്ദർഭം അനുകൂലിക്കുന്നു; ജീവിതരീതിയെ സൂചിപ്പിക്കുന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: γενηθέντες
  choice: ആയിത്തീർന്നു
  rationale: അത്തരക്കാരോടുള്ള പങ്കാളിത്തത്തിലേക്ക് അവർ പ്രവേശിച്ചതിനെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ἀναστρεφομένων എന്ന പദത്തിന്റെ സന്ദർഭാർഥം
  choice: അതേവിധം പീഡിപ്പിക്കപ്പെടുകയോ പെരുമാറപ്പെടുകയോ ചെയ്തവർ
  alternative: അങ്ങനെ ജീവിച്ചവർ / പെരുമാറിയവർ
  rationale: സമീപസന്ദർഭം നിന്ദ, കഷ്ടത, പീഡിതരോടുള്ള ഐക്യദാർഢ്യം എന്നിവയെക്കുറിച്ചായതിനാൽ സ്വീകരിച്ച വായനയ്ക്ക് മുൻതൂക്കമുണ്ട്. എങ്കിലും ഗ്രീക്ക് പദത്തിന് ജീവിതരീതിയെയോ പെരുമാറ്റത്തെയോ സൂചിപ്പിക്കാനാകുന്നതിനാൽ യഥാർഥമായ അവ്യക്തത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, dignified എങ്കിലും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന മലയാളം. ഗ്രീക്കിലെ പൊതുകാഴ്ചയാക്കൽ എന്ന ശക്തമായ രൂപകം മുഖ്യവാചകത്തിൽ നിലനിർത്തുകയും ἀναστρεφομένων എന്നതിലെ യഥാർഥ അവ്യക്തത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുകയും ചെയ്തു.
