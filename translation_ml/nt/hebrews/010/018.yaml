    reason: ἄφεσις എന്ന പദത്തിന് ‘മോചനം’ എന്ന പരിഭാഷാവികല്പമുണ്ട്; τούτων എന്ന സർവനാമത്തിന്റെ മുൻസന്ദർഭസൂചനയും വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: ὅπου
  choice: എവിടെ ... അവിടെ എന്ന ആശയം ഉൾക്കൊള്ളുന്ന ‘-ഇടത്ത്’ ഘടന
