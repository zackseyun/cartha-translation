- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇവിടെ δέ ശക്തമായ വൈരുധ്യമല്ല, മൃദുവായ നിഗമനബന്ധമാണ് സൂചിപ്പിക്കുന്നത്. മുൻസന്ദർഭത്തിൽ നിന്നുള്ള ബന്ധം മലയാള വാക്യഘടനയിൽ തന്നെ വ്യക്തമാകുന്നതിനാൽ ‘എന്നാൽ’ പോലൊരു ശക്തമായ ബന്ധകം ചേർത്തിട്ടില്ല.
- source_word: ἄφεσις
  choice: ക്ഷമിക്കപ്പെടുക
  rationale: നാമരൂപമായ ‘ക്ഷമ/മോചനം’ എന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിനായി ക്രിയാപദഘടനയിൽ നൽകി; പാപക്ഷമ എന്ന സന്ദർഭാർഥം നിലനിർത്തുന്നു.
- source_word: τούτων
  choice: ഇവ
  rationale: മുൻവാക്യത്തിലെ പാപങ്ങളെയും നിയമലംഘനങ്ങളെയും സൂചിപ്പിക്കുന്ന സർവനാമത്തിന്റെ അവ്യക്തത നിലനിർത്തുന്നു; ‘ഈ പാപങ്ങൾ’ എന്ന് വിശദീകരിച്ച് മൂലപാഠത്തേക്കാൾ അധികം വ്യക്തമാക്കിയിട്ടില്ല.
- source_word: οὐκέτι
  choice: ഇനി ഇല്ല
  rationale: മുമ്പുണ്ടായിരുന്നതിന്റെ അവസാനത്തെയോ തുടർന്നുള്ള ആവശ്യമില്ലായ്മയെയോ കൃത്യമായി സൂചിപ്പിക്കുന്നു.
- source_word: προσφορὰ
  choice: വഴിപാട്
  rationale: യാഗസന്ദർഭത്തിലെ സമർപ്പണത്തെ സൂചിപ്പിക്കുന്ന പൊതുവായ പദം; ‘യാഗം’ എന്ന് ചുരുക്കി അർഥപരിധി അനാവശ്യമായി കുറയ്ക്കുന്നില്ല.
- source_word: περὶ ἁμαρτίας
  choice: പാപത്തിനുവേണ്ടിയുള്ള
  rationale: യാഗപരമായ ‘പാപത്തിനുവേണ്ടി’ എന്ന അർഥം സംരക്ഷിക്കുന്നു; ‘പാപയാഗം’ എന്ന് സാങ്കേതികമായി അതിവ്യക്തമാക്കുന്നില്ല.
theological_decisions:
- issue: ക്രിസ്തുവിന്റെ യാഗത്തിന്റെ അന്തിമത്വത്തെക്കുറിച്ചുള്ള സൂചന
  choice: ക്ഷമ ലഭിച്ചിടത്ത് പാപത്തിനുവേണ്ടിയുള്ള വഴിപാട് ഇനി ഇല്ലെന്നാണ് വാക്യം പറയുന്നത്.
  alternative: എല്ലാത്തരം വഴിപാടുകളും പൂർണമായി ഇല്ലാതാക്കിയെന്നോ, ഇത് ലേവ്യയാഗങ്ങളെക്കുറിച്ചുമാത്രമുള്ള പരിമിത പ്രസ്താവനയെന്നോ വ്യക്തമാക്കുക.
  rationale: ഉടൻ മുൻപും പിന്നെയും വരുന്ന സന്ദർഭം ആവർത്തിച്ച യാഗങ്ങളെയും ഫലപ്രദമായ ഏകയാഗത്തെയും തമ്മിൽ താരതമ്യം ചെയ്യുന്നു. പരിഭാഷ പാപത്തിനുവേണ്ടിയുള്ള വഴിപാടിന്റെ അവസാനത്തെ പ്രസ്താവിക്കുന്നു; അതിനപ്പുറമുള്ള ദൈവശാസ്ത്ര നിഗമനങ്ങൾ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ നാമഘടന സ്വാഭാവിക മലയാളത്തിനായി ക്രിയാപദഘടനയാക്കി; സർവനാമത്തിന്റെ സന്ദർഭാധീനതയും യാഗപരമായ പദപ്രയോഗത്തിന്റെ വ്യാപ്തിയും സംരക്ഷിച്ചു.
