revisions:
- from: എന്നാൽ നാം നാശത്തിലേക്കു പിന്മാറുന്നവരല്ല[a]; മറിച്ച് ആത്മാവിന്റെ സംരക്ഷണത്തിനായി വിശ്വാസം പുലർത്തുന്നവരാണ്[b][c][d].
  to: എന്നാൽ നാം നാശത്തിലേക്കു പിന്മാറുന്നവരിൽപ്പെട്ടവരല്ല[a]; മറിച്ച് ആത്മാവിന്റെ സംരക്ഷണത്തിനായുള്ള വിശ്വാസമുള്ളവരാണ്[b][c][d].
  rationale: The revision preserves the explicit ‘we,’ the adversative contrast, the noncommittal sense of retreat rather than explicit apostasy, and the destructive/preservative contrast. It makes the Malayalam reflect the Greek’s parallel category language more closely and refines the lexical-alternative note without resolving disputed nuances.
