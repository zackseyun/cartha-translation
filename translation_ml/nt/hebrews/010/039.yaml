id: HEB.10.39
reference: Hebrews 10:39
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ οὐκ ἐσμὲν ὑποστολῆς εἰς ἀπώλειαν, ἀλλὰ πίστεως εἰς περιποίησιν ψυχῆς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/039.yaml
  text: But we are not of shrinking back to destruction[d][c][b][a], but of faith to the preservation of the soul.
translation:
  language: ml
  text: എന്നാൽ നാം നാശത്തിലേക്കു പിന്മാറുന്നവരിൽപ്പെട്ടവരല്ല[a]; മറിച്ച് ആത്മാവിന്റെ സംരക്ഷണത്തിനായുള്ള വിശ്വാസമുള്ളവരാണ്[b][c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘പിൻവാങ്ങുന്നവർ.’ ഗ്രീക്ക് പദത്തിന് പിന്മാറ്റം, പിന്നോട്ടുപോകൽ എന്നീ അർഥങ്ങളുണ്ട്; ചിലർ ഇവിടെ അതിനെ കൂടുതൽ ശക്തമായി, വിശ്വാസം പൂർണമായി ഉപേക്ഷിക്കൽ എന്ന അർഥത്തിൽ മനസ്സിലാക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘വിശ്വസ്തത.’ ഇവിടെ ‘വിശ്വാസം’ എന്നതിന് സ്ഥിരമായി വിശ്വസ്തരായി നിലകൊള്ളുക എന്ന നിഴലർഥവും ഉണ്ടായേക്കാം.
    reason: alternative_reading
  - marker: c
    text: അഥവാ ‘ജീവന്റെ സംരക്ഷണത്തിനായി,’ ‘ജീവനെ നേടുന്നതിനായി,’ അല്ലെങ്കിൽ ‘ജീവനെ/സ്വയത്തെ സ്വന്തമാക്കുന്നതിനായി.’ ഗ്രീക്ക് പ്രയോഗം ആധുനിക അർഥത്തിൽ ‘ആത്മാവ്’ എന്നതിൽ മാത്രം ഒതുങ്ങാതെ ഒരാളുടെ ജീവൻ, സ്വയം, അല്ലെങ്കിൽ വ്യക്തിയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: d
    text: അഥവാ ‘ആത്മാവിനെ നിലനിർത്തുന്നതിനായി.’
    reason: previous_rendering
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: എന്നാൽ നാം
  rationale: മുൻപുള്ള മുന്നറിയിപ്പിനോടുള്ള ശക്തമായ വൈരുധ്യവും ἡμεῖς എന്ന സർവനാമത്തിന്റെ ഊന്നലും നിലനിർത്തുന്നു.
- source_word: ὑποστολῆς
  choice: പിന്മാറുന്നവർ
  rationale: ഭയത്താലോ മടിയാലോ പിന്നോട്ടുപോകുക എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; പൂർണ വിശ്വാസത്യാഗം എന്ന് മുഖ്യവാചകത്തിൽ അതിവ്യാഖ്യാനം ചെയ്യുന്നില്ല.
- source_word: εἰς ἀπώλειαν
  choice: നാശത്തിലേക്കു
  rationale: εἰς സൂചിപ്പിക്കുന്ന അന്ത്യം/ഫലം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: πίστεως
  choice: വിശ്വാസം പുലർത്തുന്നവർ
  rationale: വാക്യത്തിലെ വർഗ്ഗീകരണസ്വഭാവമുള്ള ജനിറ്റീവ് പ്രയോഗം സ്വാഭാവിക മലയാളത്തിലാക്കുന്നു; വിശ്വാസത്തോടൊപ്പം സ്ഥിരമായ വിശ്വസ്തതയുടെ നിഴലർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: εἰς περιποίησιν
  choice: സംരക്ഷണത്തിനായി
  rationale: നാശം എന്നതിന് എതിരായ നിലനിർത്തൽ/സംരക്ഷണം എന്ന അർഥം മുൻനിർത്തുന്നു; പദത്തിനുള്ള നേടൽ, കൈവശമാക്കൽ എന്നീ സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ψυχῆς
  choice: ആത്മാവിന്റെ
  rationale: പരമ്പരാഗതവും ദൈവശാസ്ത്രപരവുമായ ഭാരം നിലനിർത്തുന്നു; ഇവിടെ ψυχή ജീവൻ, സ്വയം, വ്യക്തി എന്നിവയെ വിശാലമായി സൂചിപ്പിക്കാമെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ὑποστολή എന്നതിന്റെ ശക്തി
  choice: പിന്മാറുക
  alternative: വിശ്വാസം പൂർണമായി ഉപേക്ഷിക്കുക
  rationale: മൂലപദം പിൻവാങ്ങലിനെയോ പിന്മാറ്റത്തെയോ സൂചിപ്പിക്കുന്നു; പൂർണ വിശ്വാസത്യാഗം എന്ന വ്യാഖ്യാനം സാധ്യമെങ്കിലും പദം മാത്രം അതു നിർബന്ധിക്കുന്നില്ല.
- issue: πίστις എന്നതിന്റെ അർഥനിഴൽ
  choice: വിശ്വാസം
  alternative: വിശ്വസ്തത
  rationale: പ്രധാന അർഥമായി വിശ്വാസം നിലനിർത്തുന്നു; ഉപദേശപരമായ ഈ സന്ദർഭത്തിൽ സ്ഥിരതയുള്ള വിശ്വസ്തതയും ഉൾപ്പെടാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: περιποίησις ψυχῆς എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: ആത്മാവിന്റെ സംരക്ഷണം
  alternative: ജീവനെ നേടൽ / സ്വയം കൈവശമാക്കൽ
  rationale: നാശത്തോടുള്ള നേരിട്ടുള്ള വൈരുധ്യം സംരക്ഷണം എന്ന അർഥത്തെ പിന്തുണയ്ക്കുന്നു; എന്നാൽ ഗ്രീക്ക് പദത്തിന്റെ നേടൽ/കൈവശമാക്കൽ എന്ന സാധ്യത മറച്ചുവയ്ക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ സംക്ഷിപ്ത ജനിറ്റീവ് വൈരുധ്യം വാക്കിന് വാക്കായി പകർത്തിയാൽ മലയാളത്തിൽ കൃത്രിമമാകുന്നതിനാൽ ‘പിന്മാറുന്നവർ / വിശ്വാസം പുലർത്തുന്നവർ’ എന്ന സമാന്തര ഘടന ഉപയോഗിച്ചു. അർഥത്തിലെ യഥാർത്ഥ അനിശ്ചിതത്വങ്ങൾ അടിക്കുറിപ്പുകളിൽ നിലനിർത്തി.
