id: HEB.10.29
reference: Hebrews 10:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πόσῳ δοκεῖτε χείρονος ἀξιωθήσεται τιμωρίας ὁ τὸν υἱὸν τοῦ θεοῦ καταπατήσας, καὶ τὸ αἷμα τῆς διαθήκης κοινὸν ἡγησάμενος ἐν ᾧ ἡγιάσθη, καὶ τὸ πνεῦμα τῆς χάριτος ἐνυβρίσας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/029.yaml
  text: How much worse punishment do you think will be deserved by the one who has trampled underfoot the Son of God[a], and has regarded the blood of the covenant by which he was sanctified as common[c][b], and has insulted the Spirit of grace?
translation:
  language: ml
  text: ദൈവപുത്രനെ ചവിട്ടിമെതിക്കുകയും, താൻ വിശുദ്ധീകരിക്കപ്പെട്ട ഉടമ്പടിയുടെ രക്തത്തെ സാധാരണമായതായി[a][b] കണക്കാക്കുകയും, കൃപയുടെ ആത്മാവിനെ അപമാനിക്കുകയും[c] ചെയ്തവൻ ഇതിലും എത്രയോ കഠിനമായ ശിക്ഷയ്ക്ക് അർഹനാകും എന്ന് നിങ്ങൾ കരുതുന്നു?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അശുദ്ധമായി’ അല്ലെങ്കിൽ ‘അപവിത്രമായി.’
    reason: lexical_alternative
  - marker: b
    text: ‘താൻ വിശുദ്ധീകരിക്കപ്പെട്ട’ എന്ന വാക്യഭാഗം ഗ്രീക്കിൽ ഈ കുറ്റം ചെയ്യുന്ന വ്യക്തിയോടാണ് വ്യാകരണപരമായി ബന്ധപ്പെടുന്നത്; എന്നാൽ ചില വ്യാഖ്യാതാക്കൾ അതിന്റെ സൂചിതവ്യക്തിയെ വേറൊരു വിധത്തിൽ മനസ്സിലാക്കുന്നു. ഈ പരിഭാഷ ദൈവശാസ്ത്രവിവാദം തീർപ്പാക്കാതെ മൂലത്തിലെ സംഘർഷം നിലനിർത്തുന്നു.
    reason: alternative_reading
  - marker: c
    text: അഥവാ, ‘കൃപയുടെ ആത്മാവിനെ ധിക്കാരപൂർവം നിന്ദിക്കുകയും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πόσῳ … χείρονος
  choice: എത്രയോ കഠിനമായ
  rationale: താരതമ്യത്തോടുകൂടിയ ഗ്രീക്ക് വാക്പ്രയോഗത്തെ സ്വാഭാവികമായ മലയാളത്തിലെ ശക്തമായ ആലങ്കാരിക ചോദ്യമായി അവതരിപ്പിക്കുന്നു; മുൻസന്ദർഭത്തേക്കാൾ കടുത്ത ശിക്ഷ എന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: ἀξιωθήσεται τιμωρίας
  choice: ശിക്ഷയ്ക്ക് അർഹനാകും
  rationale: ‘ശിക്ഷയ്ക്ക് യോഗ്യനായി കണക്കാക്കപ്പെടും’ എന്ന ന്യായവിധിപരമായ നിഷ്ക്രിയഭാവം സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: καταπατήσας
  choice: ചവിട്ടിമെതിക്കുകയും
  rationale: വെറും അവജ്ഞയായി പരാവർത്തനം ചെയ്യാതെ മൂലത്തിലെ ശക്തമായ ദൃശ്യരൂപവും നിന്ദാഭാവവും നിലനിർത്തുന്നു.
- source_word: κοινὸν
  choice: സാധാരണമായതായി
  rationale: വിശുദ്ധമായി വേർതിരിക്കപ്പെട്ടതിനോടുള്ള വിരുദ്ധതയിൽ ‘പൊതുവായത്/സാധാരണമായത്’ എന്ന അടിസ്ഥാന അർഥം സൂക്ഷിക്കുന്നു; ‘അശുദ്ധം’, ‘അപവിത്രം’ എന്നിവ സാധ്യതയുള്ള സന്ദർഭാർഥങ്ങളായി അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: αἷμα τῆς διαθήκης
  choice: ഉടമ്പടിയുടെ രക്തം
  rationale: ഉടമ്പടിയുടെയും യാഗത്തിന്റെയും ബൈബിൾപരമായ പ്രതിധ്വനി നിലനിർത്തുന്ന നേരിട്ടുള്ള പ്രയോഗം.
- source_word: ἐν ᾧ ἡγιάσθη
  choice: താൻ വിശുദ്ധീകരിക്കപ്പെട്ട
  rationale: രക്തം വിശുദ്ധീകരണത്തിന്റെ മാധ്യമമാണെന്ന ബന്ധവും ഏകവചനത്തിലുള്ള വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ഘടനയും നിലനിർത്തുന്നു.
- source_word: ἐνυβρίσας
  choice: അപമാനിക്കുകയും
  rationale: ധിക്കാരപൂർവമായ നിന്ദ എന്ന ശക്തി സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: πνεῦμα τῆς χάριτος
  choice: കൃപയുടെ ആത്മാവ്
  rationale: ഗ്രീക്കിലെ ബന്ധരൂപവും ദൈവാത്മാവിനെ സൂചിപ്പിക്കുന്ന പദപ്രയോഗവും ഔപചാരികമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ἐν ᾧ ἡγιάσθη എന്നതിലെ വിശുദ്ധീകരിക്കപ്പെട്ട വ്യക്തി
  choice: പ്രധാനവാക്യത്തിൽ വിവരിക്കപ്പെടുന്ന ഏകവചന വ്യക്തിയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്ന വിധത്തിൽ ‘താൻ വിശുദ്ധീകരിക്കപ്പെട്ട’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ഈ പരാമർശം ക്രിസ്തുവിനെയോ ഉടമ്പടിസമൂഹത്തെയോ മറ്റൊരു വിധത്തിലോ സൂചിപ്പിക്കുന്നതായി ചിലർ വ്യാഖ്യാനിക്കുന്നു.
  rationale: ഗ്രീക്കിൽ ഏറ്റവും അടുത്ത വ്യാകരണപരമായ ബന്ധം പങ്കാളിക്രിയകളാൽ വിവരിക്കപ്പെടുന്ന ഏകവചന കർത്താവിനോടാണ്. വിശ്വാസത്യാഗത്തെയും നിലനിൽപ്പിനെയും സംബന്ധിച്ച ദൈവശാസ്ത്രവിവാദം പരിഭാഷയിൽ തീർപ്പാക്കാതെ, മൂലഘടന നൽകുകയും വ്യാഖ്യാനവൈവിധ്യം അടിക്കുറിപ്പിൽ അറിയിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. വാക്യത്തിന്റെ ആലങ്കാരിക ചോദ്യസ്വഭാവവും മൂലത്തിലെ മൂന്നു സമാന്തര കുറ്റാരോപണങ്ങളും നിലനിർത്തിയിരിക്കുന്നു; അനാവശ്യമായ സഭാപദാവലിയോ വിഭാഗീയ വ്യാഖ്യാനമോ ചേർത്തിട്ടില്ല.
