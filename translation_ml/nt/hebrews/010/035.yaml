  text: μὴ ἀποβάλητε οὖν τὴν παρρησίαν ὑμῶν, ἥτις ἔχει ⸂μεγάλην μισθαποδοσίαν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/035.yaml
  text: Therefore[a], do not throw away your boldness, which has a great reward,
translation:
  language: ml
  text: അതുകൊണ്ട്, നിങ്ങളുടെ ധൈര്യം[a] ഉപേക്ഷിച്ചുകളയരുത്; അതിന് വലിയ പ്രതിഫലമുണ്ട്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ആത്മവിശ്വാസം.’ ഗ്രീക്ക് പദം ആത്മവിശ്വാസപൂർണമായ സ്വാതന്ത്ര്യത്തെയോ തുറന്ന സമീപനത്തെയോ സൂചിപ്പിക്കാം, പ്രത്യേകിച്ച് ദൈവത്തെ സമീപിക്കുന്നതിൽ.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἀποβάλητε
  choice: ഉപേക്ഷിച്ചുകളയരുത്
  rationale: μήയോടുകൂടിയ aorist subjunctive ഒരു വിലക്കാണ്. ἀποβάλλω മനഃപൂർവം തള്ളിക്കളയുകയോ കൈവിടുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നതിനാൽ, വെറുതെ നഷ്ടപ്പെടുക എന്നതിനെക്കാൾ ശക്തമായ ‘ഉപേക്ഷിച്ചുകളയരുത്’ തിരഞ്ഞെടുത്തു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻപുള്ള പ്രബോധനത്തിൽനിന്നും വിശ്വാസികളുടെ അനുഭവസ്മരണയിൽനിന്നും നിഗമനം അവതരിപ്പിക്കുന്ന ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: παρρησίαν
  choice: ധൈര്യം
  rationale: എബ്രായലേഖനത്തിൽ ഈ പദം ദൈവത്തെ സമീപിക്കുന്നതിലുള്ള ആത്മവിശ്വാസപൂർണമായ സ്വാതന്ത്ര്യത്തെയും വിശ്വാസത്തിൽ ഉറച്ചുനിൽക്കുന്ന തുറന്ന ധീരതയെയും സൂചിപ്പിക്കാം. ‘ധൈര്യം’ പ്രബോധനത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; ‘ആത്മവിശ്വാസം’ സാധ്യമായ മറ്റൊരു പരിഭാഷയാണ്.
- source_word: ὑμῶν
  choice: നിങ്ങളുടെ
  rationale: παρρησίαν എന്ന നാമത്തെ വിശേഷിപ്പിക്കുന്ന നേരിട്ടുള്ള ഉടമസ്ഥ genitive.
- source_word: ἥτις
  choice: അതിന്
  rationale: ധൈര്യത്തിന്റെ സവിശേഷത വിശദീകരിക്കുന്ന relative clause മലയാളത്തിൽ സ്വാഭാവികമായി സ്വതന്ത്രവാക്യരൂപത്തിൽ അവതരിപ്പിക്കുന്നു; ഇതിലൂടെ antecedent-ബന്ധം നിലനിൽക്കുന്നു.
- source_word: ἔχει
  choice: ഉണ്ട്
  rationale: ഗ്രീക്കിലെ ലളിത present indicative നേരിട്ട് സംരക്ഷിക്കുന്നു; ‘നൽകും’ എന്ന കാരണഫല വ്യാഖ്യാനം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: μεγάλην
  choice: വലിയ
  rationale: പ്രതിഫലത്തിന്റെ മഹത്ത്വം സൂചിപ്പിക്കുന്ന സാധാരണവും സ്വാഭാവികവുമായ തുല്യപദം.
- source_word: μισθαποδοσίαν
  choice: പ്രതിഫലം
  rationale: പ്രതിഫലത്തെയോ ലഭിക്കേണ്ട പകരത്തെയോ സൂചിപ്പിക്കുന്ന പദത്തിന് വ്യക്തവും സ്വാഭാവികവുമായ മലയാളം; സന്ദർഭത്തിലെ അനുകൂലമായ ഭാവി പ്രതിഫലത്തെ വ്യക്തമാക്കുന്നു, എന്നാൽ അതിനെ ഇടപാടുസ്വഭാവമുള്ള കൂലിയായി ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: എബ്രായർ 10:35-ലെ παρρησία എന്ന പദത്തിന്റെ അർത്ഥം
  choice: ദൈവത്തെ സമീപിക്കുന്നതിലും വിശ്വാസത്തിൽ പരസ്യമായി ഉറച്ചുനിൽക്കുന്നതിലും ഉള്ള ആത്മവിശ്വാസപൂർണമായ ധീരതയെ സൂചിപ്പിക്കുന്ന ‘ധൈര്യം’
  alternative: ആത്മവിശ്വാസം
  rationale: എബ്രായലേഖനത്തിലെ പ്രയോഗം ദൈവസന്നിധിയിലേക്കുള്ള സ്വതന്ത്രവും ആത്മവിശ്വാസപൂർണവുമായ സമീപനത്തെയും സ്ഥിരതയുള്ള വിശ്വാസപ്രകടനത്തെയും ഉൾക്കൊള്ളുന്നു. ‘ധൈര്യം’ പ്രബോധനാത്മക ശക്തി നിലനിർത്തുന്നു; അടന്തരമായ ഉറപ്പിലേക്കു മാത്രം അർത്ഥം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ പ്രബോധനശൈലി. ‘ഉപേക്ഷിച്ചുകളയരുത്’ മനഃപൂർവമായ കൈവിടലിന്റെ ശക്തി നിലനിർത്തുന്നു. παρρησίαയുടെ യഥാർഥ അർത്ഥവ്യാപ്തി പ്രധാനപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചിട്ടുണ്ട്.
