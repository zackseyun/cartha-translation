id: HEB.10.7
reference: Hebrews 10:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τότε εἶπον· Ἰδοὺ ἥκω, ἐν κεφαλίδι βιβλίου γέγραπται περὶ ἐμοῦ, τοῦ ποιῆσαι, ὁ θεός, τὸ θέλημά σου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/007.yaml
  text: Then I said[a], ‘Behold, I have come—in the scroll of the book it is written about me—to do your will, O God.’
translation:
  language: ml
  text: 'അപ്പോൾ ഞാൻ പറഞ്ഞു: “ഇതാ, ഞാൻ വന്നിരിക്കുന്നു—ഗ്രന്ഥച്ചുരുളിൽ[a] എന്നെക്കുറിച്ച് എഴുതിയിരിക്കുന്നു—ദൈവമേ, അങ്ങയുടെ ഹിതം നിറവേറ്റാൻ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പുസ്തകച്ചുരുളിൽ.” ഇവിടെ ആധുനിക രീതിയിൽ തുന്നിക്കെട്ടിയ പുസ്തകമല്ല, എഴുത്തുചുരുളാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: അപ്പോൾ
  rationale: ഉദ്ധരിക്കപ്പെടുന്ന പ്രതികരണത്തെ പരിചയപ്പെടുത്തുന്ന കാലസൂചക ക്രിയാവിശേഷണത്തിന് സ്വാഭാവികവും സംക്ഷിപ്തവുമായ തുല്യപദം.
- source_word: εἶπον
  choice: ഞാൻ പറഞ്ഞു
  rationale: λέγω എന്ന ക്രിയയുടെ ആഖ്യാനപരമായ ഉദ്ധരണിസൂത്രത്തിന് മലയാളത്തിലെ സ്വാഭാവിക രൂപം.
- source_word: Ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗൗരവമുള്ള തിരുവെഴുത്തുശൈലി നിലനിർത്തുന്നു.
- source_word: ἥκω
  choice: ഞാൻ വന്നിരിക്കുന്നു
  rationale: വന്ന് ഇപ്പോൾ സന്നിഹിതനായിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ഈ വർത്തമാനരൂപത്തിന്റെ സമ്പൂർണതാഭാവം പ്രകടമാക്കുന്നു.
- source_word: ἐν κεφαλίδι βιβλίου
  choice: ഗ്രന്ഥച്ചുരുളിൽ
  rationale: κεφαλίς ഇവിടെ തലക്കെട്ടിനെയല്ല, എഴുതിയ ചുരുളിനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ഗ്രന്ഥച്ചുരുൾ’ പുരാതന എഴുത്തുരൂപം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: γέγραπται
  choice: എഴുതിയിരിക്കുന്നു
  rationale: എഴുതപ്പെട്ടത് ഇപ്പോഴും പ്രാബല്യത്തിൽ നിലകൊള്ളുന്നു എന്ന ഗ്രീക്ക് സമ്പൂർണ നിഷ്ക്രിയരൂപത്തിന്റെ ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: περὶ ἐμοῦ
  choice: എന്നെക്കുറിച്ച്
  rationale: περί + genitive എന്ന പ്രയോഗത്തിന്റെ കൃത്യവും സാധാരണവുമായ മലയാളരൂപം.
- source_word: τοῦ ποιῆσαι
  choice: നിറവേറ്റാൻ
  rationale: വരവിന്റെ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു; ദൈവഹിതവുമായി ചേർന്നപ്പോൾ ‘നിറവേറ്റുക’ സ്വാഭാവിക മലയാളമാണ്, എങ്കിലും ποιέω എന്നതിന്റെ അടിസ്ഥാനഭാവമായ ‘ചെയ്യുക’ നിലനിർത്തുന്നു.
- source_word: ὁ θεός
  choice: ദൈവമേ
  rationale: രൂപത്തിൽ nominative ആയിരുന്നാലും ഇവിടെ നേരിട്ടുള്ള സംബോധനമാണ്; മലയാളത്തിലെ സംബോധനരൂപം അത് വ്യക്തമാക്കുന്നു.
- source_word: τὸ θέλημά σου
  choice: അങ്ങയുടെ ഹിതം
  rationale: θέλημα എന്നതിലെ ഇഷ്ടം/ഹിതം എന്ന ആശയം ദൈവത്തോടുള്ള ആദരസൂചകമായ ആധുനിക ഭാഷയിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: സങ്കീർത്തന ഉദ്ധരണിയിലെ ഒന്നാംപുരുഷ പ്രസ്താവനയെ എബ്രായർ മിശിഹായോട് പ്രയോഗിക്കുന്നത്
  choice: പ്രഭാഷകനെ മുഖ്യവാക്യത്തിൽ പ്രത്യേകം ‘മിശിഹാ’ എന്നു തിരിച്ചറിയിക്കാതെ ഒന്നാംപുരുഷ പ്രസ്താവനയായി തന്നെ പരിഭാഷപ്പെടുത്തി.
  alternative: മുഖ്യവാക്യത്തിൽ പ്രഭാഷകൻ മിശിഹായാണെന്ന് വ്യക്തമായി ചേർക്കുക.
  rationale: സന്ദർഭത്തിൽ എബ്രായർ ഈ വാക്കുകൾ പുത്രൻ/ക്രിസ്തുവിനോട് പ്രയോഗിക്കുന്നു; എന്നാൽ ഈ വാക്യത്തിന്റെ പദരൂപം ഒന്നാംപുരുഷ പ്രഖ്യാപനമായതിനാൽ ക്രിസ്തുശാസ്ത്രപരമായ തിരിച്ചറിയൽ സന്ദർഭം തന്നെ സ്ഥാപിക്കട്ടെ.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധം, എന്നാൽ ഉദ്ധരണിയുടെ ഗൗരവവും തിരുവെഴുത്തുശൈലിയും നിലനിർത്തി. ദൈവത്തോടുള്ള സംബോധനയിൽ ആദരസൂചകമായ ‘അങ്ങ്’ രൂപം ഉപയോഗിച്ചു.
