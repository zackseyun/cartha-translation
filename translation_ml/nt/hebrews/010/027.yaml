id: HEB.10.27
reference: Hebrews 10:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: φοβερὰ δέ τις ἐκδοχὴ κρίσεως καὶ πυρὸς ζῆλος ἐσθίειν μέλλοντος τοὺς ὑπεναντίους.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/027.yaml
  text: but a fearful expectation of judgment[a], and a fury of fire about to consume the adversaries.
translation:
  language: ml
  text: എന്നാൽ, ന്യായവിധിയെക്കുറിച്ചുള്ള ഭയാനകമായൊരു പ്രതീക്ഷയും[a] എതിരാളികളെ ദഹിപ്പിക്കാനിരിക്കുന്ന അഗ്നിജ്വാലയുടെ ഉഗ്രക്രോധവും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “ഭയപ്പെടുത്തുന്ന ന്യായവിധിപ്രതീക്ഷയും എതിരാളികളെ ദഹിപ്പിക്കാനിരിക്കുന്ന അഗ്നിയുടെ ഉഗ്രമായ തീക്ഷ്ണതയും.”'
    reason: φοβερὰ ἐκδοχὴ κρίσεως, πυρὸς ζῆλος എന്നിവയുടെ കൂടുതൽ സംക്ഷിപ്തവും വ്യവഹാരസഹജവുമായ പരിഭാഷ; ‘ഭയപ്പെടുത്തുന്ന’ എന്നത് പ്രതീക്ഷയുടെ സ്വഭാവത്തെ സൂചിപ്പിക്കുന്നു, ‘അഗ്നിയുടെ ഉഗ്രമായ തീക്ഷ്ണത’ ζῆλος-ന്റെ തീവ്രത നിലനിർത്തുന്നു.
lexical_decisions:
- source_word: φοβερὰ
  choice: ഭയാനകമായ
  rationale: പ്രതീക്ഷയുടെ ഭീതിജനകമായ സ്വഭാവം നേരിട്ടും ഗൗരവത്തോടെയും അറിയിക്കുന്നു; മുന്നറിയിപ്പിന്റെ തീവ്രത മയപ്പെടുത്തുന്നില്ല.
- source_word: δέ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ നിഷേധത്തോടുള്ള വൈരുധ്യം സൂചിപ്പിക്കുന്ന ബന്ധകമായി സന്ദർഭത്തിൽ സ്വാഭാവികമാണ്.
- source_word: τις
  choice: -യൊരു
  rationale: അനിശ്ചിതസർവനാമത്തിന്റെ ഭാവം മലയാളത്തിലെ അനിശ്ചിത ഏകവചനരൂപത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; ഇത് 'ഉറപ്പുള്ള' എന്ന അർഥം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: ἐκδοχὴ κρίσεως
  choice: ന്യായവിധിയെക്കുറിച്ചുള്ള ... പ്രതീക്ഷ
  rationale: ἐκδοχήയുടെ ‘പ്രതീക്ഷിച്ചു കാത്തിരിക്കുക’ എന്ന ആശയവും κρίσις എന്നതിന്റെ വിശാലമായ ന്യായവിധി അർഥവും സംരക്ഷിക്കുന്നു.
- source_word: πυρὸς ζῆλος
  choice: അഗ്നിയുടെ ഉഗ്രരോഷം
  rationale: ഗ്രീക്കിലെ സാന്ദ്രവും വ്യക്തിവൽക്കരിച്ചതുമായ അഗ്നിചിത്രം സ്വാഭാവിക മലയാളത്തിൽ ശക്തമായി പകരുന്നു; വെറും ‘തീ’ എന്നാക്കി ദുർബലപ്പെടുത്തുന്നില്ല.
- source_word: ἐσθίειν
  choice: ദഹിപ്പിക്കുക
  rationale: അഗ്നി പൂർണമായി നശിപ്പിക്കുന്നതിന്റെ ആശയം ഗൗരവമുള്ളതും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: μέλλοντος
  choice: -ആനിരിക്കുന്ന
  rationale: വരാനിരിക്കുന്നതും ആസന്നവുമായ പ്രവർത്തനഭാവം നിലനിർത്തുന്നു.
- source_word: τοὺς ὑπεναντίους
  choice: എതിരാളികളെ
  rationale: വിരോധത്തിൽ നിലകൊള്ളുന്നവരെ സൂചിപ്പിക്കുന്ന ഔപചാരികവും സന്ദർഭോചിതവുമായ പദമാണ്; ‘ശത്രുക്കൾ’ എന്നതിലേക്കാൾ മൂലപദത്തിന്റെ ബന്ധപരമായ അർഥം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ന്യായവിധിയിലെ അഗ്നിചിത്രത്തിന്റെ സ്വഭാവം
  choice: എതിരാളികളെ ദഹിപ്പിക്കാനിരിക്കുന്ന അഗ്നിയുടെ ഉഗ്രരോഷം എന്ന ദൃശ്യഭാഷ അതിന്റെ പൂർണ ശക്തിയോടെ നിലനിർത്തി.
  alternative: ഇത് വെറും രൂപകമാണെന്നോ പ്രത്യേകിച്ച് നിത്യശിക്ഷയാണെന്നോ പരിഭാഷയിൽ വിശദീകരിക്കുക.
  rationale: വാക്യം കഠിനമായ ദൈവിക ന്യായവിധി അവതരിപ്പിക്കുന്നുവെങ്കിലും അതിന്റെ എല്ലാ ദൈവശാസ്ത്രപരമായ വിശദാംശങ്ങളും ഇവിടെ നിർവചിക്കുന്നില്ല; അതിനാൽ പരിഭാഷ ചിത്രത്തിന്റെ തീവ്രത സംരക്ഷിക്കുകയും അതിനപ്പുറമുള്ള വ്യാഖ്യാനം ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവപൂർണ മലയാളം. ഗ്രീക്ക് വാക്യത്തിന്റെ അപൂർണസദൃശമായ ഘടനയും മുൻവാക്യത്തോടുള്ള ബന്ധവും നിലനിർത്താൻ ‘ശേഷിക്കുന്നു’ പോലുള്ള സന്ദർഭപൂരക ക്രിയ ചേർത്തിട്ടില്ല.
