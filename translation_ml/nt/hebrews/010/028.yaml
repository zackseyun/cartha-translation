    rationale: The phrase is faithful, but repeats related words. ‘സാക്ഷികളുടെ മൊഴിയുടെ അടിസ്ഥാനത്തിൽ’ is idiomatic Malayalam and retains the supplied judicial sense of the English audit trail.
