  naturalness: The register is clear, modern, and suitably formal. ‘രണ്ടോ മൂന്നോ സാക്ഷികളുടെ സാക്ഷ്യത്തിന്റെ അടിസ്ഥാനത്തിൽ’ is understandable, though ‘മൊഴിയുടെ അടിസ്ഥാനത്തിൽ’ is more idiomatic legal Malayalam and avoids repetition of cognate terms.
