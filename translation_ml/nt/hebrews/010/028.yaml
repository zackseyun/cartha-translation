- from: മോശെയുടെ ന്യായപ്രമാണം തള്ളിക്കളഞ്ഞ ഒരാൾ, രണ്ടോ മൂന്നോ സാക്ഷികളുടെ സാക്ഷ്യത്തിന്റെ അടിസ്ഥാനത്തിൽ, കരുണ ലഭിക്കാതെ മരിക്കുന്നു.[a]
