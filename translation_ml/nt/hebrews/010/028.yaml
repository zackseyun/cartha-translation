source:
  edition: SBLGNT
  text: ἀθετήσας τις νόμον Μωϋσέως χωρὶς οἰκτιρμῶν ἐπὶ δυσὶν ἢ τρισὶν μάρτυσιν ἀποθνῄσκει·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/028.yaml
  text: Anyone who has set aside the law of Moses dies without mercy on the testimony of two or three witnesses[a].
translation:
  language: ml
  text: മോശെയുടെ ന്യായപ്രമാണം നിരസിച്ചവൻ, രണ്ടോ മൂന്നോ സാക്ഷികളുടെ മൊഴിയുടെ അടിസ്ഥാനത്തിൽ, യാതൊരു കരുണയും കൂടാതെ മരിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വധിക്കപ്പെടുന്നു.’ ഗ്രീക്കിൽ അക്ഷരാർഥം ‘മരിക്കുന്നു’ എന്നാണ്; എന്നാൽ മോശെയുടെ ന്യായപ്രമാണപ്രകാരമുള്ള ന്യായവിധിയും വധശിക്ഷയുമാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθετήσας
  choice: തള്ളിക്കളഞ്ഞ
  rationale: അധികാരമുള്ള ഒന്നിനെ നിരസിക്കുകയോ അസാധുവാക്കുകയോ ചെയ്യുന്ന അർഥം നൽകുന്നു. കേവലം ഒരു കല്പന ലംഘിച്ചു എന്നതിലുപരി ന്യായപ്രമാണത്തിന്റെ അധികാരം നിരസിക്കുന്ന ഭാവവും നിലനിർത്തുന്നു.
- source_word: τις
  choice: ഒരാൾ
  rationale: അനിശ്ചിത സർവനാമത്തിന്റെ പൊതുവായ, പ്രതിനിധിപരമായ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: νόμον Μωϋσέως
  choice: മോശെയുടെ ന്യായപ്രമാണം
  rationale: ഗ്രീക്കിലെ ജനിറ്റീവ് ഘടനയ്ക്കു ചേർന്നതും ബൈബിൾ-നിയമ പശ്ചാത്തലത്തിൽ സാധാരണ വായനക്കാർക്കു വ്യക്തവുമായ പ്രയോഗം.
- source_word: χωρὶς οἰκτιρμῶν
  choice: കരുണ ലഭിക്കാതെ
  rationale: വിധിന്യായസന്ദർഭത്തിലെ ‘കരുണ കൂടാതെ’ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; മൂലത്തിലെ ബഹുവചനം മലയാളത്തിൽ ഏകവചന അമൂർത്തനാമമായി നൽകുന്നത് ഭാഷാസഹജമാണ്.
- source_word: ἐπὶ δυσὶν ἢ τρισὶν μάρτυσιν
  choice: രണ്ടോ മൂന്നോ സാക്ഷികളുടെ സാക്ഷ്യത്തിന്റെ അടിസ്ഥാനത്തിൽ
  rationale: ἐπί സഹിതമുള്ള ദത്തിവ് ഇവിടെ വിധിയുടെ അടിസ്ഥാനത്തെ സൂചിപ്പിക്കുന്നു. ‘സാക്ഷ്യം’ എന്നു ചേർക്കുന്നത് നിയമപരമായ അർഥം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀποθνῄσκει
  choice: മരിക്കുന്നു
  rationale: മൂലത്തിലെ വർത്തമാന നിർദേശകക്രിയ പൊതുവായ നിയമഫലം പ്രസ്താവിക്കുന്നു. ‘മരിക്കുന്നു’ ഗ്രീക്കിനോടു കൂടുതൽ ഔപചാരികമായി ചേർന്നുനിൽക്കുന്നു; വധശിക്ഷയുടെ ആശയം സന്ദർഭത്തിൽനിന്ന് ഗ്രഹിക്കാം.
theological_decisions:
- issue: ἀποθνῄσκει എന്നതിലെ ന്യായവിധി മൂലമുള്ള വധശിക്ഷാഭാവം മുഖ്യവാക്യത്തിൽ വ്യക്തമാക്കണമോ
  choice: മുഖ്യവാക്യത്തിൽ ‘മരിക്കുന്നു’ എന്നു നിലനിർത്തി, നിയമപരമായ വധശിക്ഷാഭാവം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
  alternative: ‘വധിക്കപ്പെടുന്നു’ / ‘മരണശിക്ഷ അനുഭവിക്കുന്നു’
  rationale: ആവർത്തനപുസ്തകത്തിലെ നിയമനടപടിയും വധശിക്ഷയും പശ്ചാത്തലത്തിലുണ്ടെങ്കിലും ഗ്രീക്ക് ക്രിയ അക്ഷരാർഥത്തിൽ ‘മരിക്കുന്നു’ എന്നാണ്. അതിനാൽ മൂലപാഠത്തിന്റെ നിയന്ത്രണം പാലിച്ചുകൊണ്ട് യഥാർഥ നിയമസന്ദർഭം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ന്യായപ്രമാണം,’ ‘സാക്ഷ്യം,’ ‘കരുണ’ എന്നീ പരിചിതമായ പദങ്ങൾ നിയമപരവും തിരുവെഴുത്തുസംബന്ധവുമായ ഭാവം നിലനിർത്തുന്നു.
