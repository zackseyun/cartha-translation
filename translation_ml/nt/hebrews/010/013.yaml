source:
  edition: SBLGNT
  text: τὸ λοιπὸν ἐκδεχόμενος ἕως τεθῶσιν οἱ ἐχθροὶ αὐτοῦ ὑποπόδιον τῶν ποδῶν αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/013.yaml
  text: from then on waiting until his enemies are made a footstool for his feet[b][a],
translation:
  language: ml
  text: അന്നുമുതൽ, തന്റെ ശത്രുക്കൾ തന്റെ പാദങ്ങൾക്ക് പാദപീഠമാക്കപ്പെടുന്നതുവരെ കാത്തിരിക്കുന്നു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പ്രതീക്ഷയോടെ കാത്തിരിക്കുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പങ്കാളിക്രിയയിൽ പ്രതീക്ഷയോടെയുള്ള കാത്തിരിപ്പിന്റെ ഭാവം ഉൾക്കൊള്ളാം.
    reason: lexical_alternative
  - marker: b
    text: 'ഈ വാക്കുകൾ സങ്കീർത്തനം 110:1-നെ പ്രതിധ്വനിപ്പിക്കുന്നു: “ഞാൻ നിന്റെ ശത്രുക്കളെ നിന്റെ പാദങ്ങൾക്ക് പാദപീഠമാക്കുന്നതുവരെ എന്റെ വലത്തുഭാഗത്ത് ഇരിക്കുക.”'
    reason: cross_reference
lexical_decisions:
- source_word: τὸ λοιπὸν
  choice: അന്നുമുതൽ
  rationale: മുൻസന്ദർഭത്തിൽ പുത്രൻ യാഗം അർപ്പിച്ച് ദൈവത്തിന്റെ വലത്തുഭാഗത്ത് ഇരുന്നതിനു ശേഷമുള്ള കാലത്തെ സൂചിപ്പിക്കുന്ന ക്രിയാവിശേഷണപ്രയോഗം. സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സമയാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: ἐκδεχόμενος
  choice: കാത്തിരിക്കുന്നു
  rationale: പ്രതീക്ഷയോടെയുള്ള കാത്തിരിപ്പെന്ന ഭാവം ഉൾക്കൊള്ളുന്ന വർത്തമാന പങ്കാളിക്രിയ. മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ രൂപം; അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἕως
  choice: വരെ
  rationale: കാത്തിരിപ്പിന്റെ സമയപരമായ അന്ത്യബിന്ദു അവതരിപ്പിക്കുന്ന സാധാരണ സംയോജകാർഥം.
- source_word: τεθῶσιν
  choice: ആക്കപ്പെടുന്നതുവരെ
  rationale: τίθημι എന്ന ക്രിയയുടെ ഏറിസ്റ്റ് പാസീവ് സബ്ജങ്ക്ടീവ് രൂപത്തിന്റെ കർമണിപ്രയോഗം നിലനിർത്തുന്നു. പാദപീഠം എന്ന വിധേയനാമത്തോടൊപ്പം മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: οἱ ἐχθροὶ αὐτοῦ
  choice: തന്റെ ശത്രുക്കൾ
  rationale: വാക്യത്തിലെ കർത്താവിലേക്കു തിരിച്ചുപോകുന്ന αὐτοῦ എന്ന സർവനാമബന്ധം മലയാളത്തിൽ ‘തന്റെ’ എന്നു സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ὑποπόδιον τῶν ποδῶν αὐτοῦ
  choice: തന്റെ പാദങ്ങൾക്ക് പാദപീഠം
  rationale: സങ്കീർത്തനം 110:1-ലെ സിംഹാസനാരോഹണചിത്രം അമൂർത്തമായി പരാവർത്തനം ചെയ്യാതെ അതിന്റെ മൂർത്തരൂപത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: സങ്കീർത്തനം 110:1-ൽ നിന്നുള്ള മിശിഹായുടെ സിംഹാസനാരോഹണചിത്രം
  choice: ശത്രുക്കൾ ‘തന്റെ പാദങ്ങൾക്ക് പാദപീഠമാക്കപ്പെടുന്നു’ എന്ന മൂർത്തചിത്രം നിലനിർത്തി.
  alternative: ശത്രുക്കൾ തോൽപ്പിക്കപ്പെടുന്നതുവരെ / ശത്രുക്കൾ അവന്റെ കാൽക്കീഴിലാക്കപ്പെടുന്നതുവരെ
  rationale: എബ്രായലേഖനത്തിലെ സങ്കീർത്തനം 110:1-നോടുള്ള മനഃപൂർവമായ പ്രതിധ്വനിയും ക്രിസ്തുശാസ്ത്രപരമായ ശക്തിയും സംരക്ഷിക്കാൻ മൂലചിത്രം നിലനിർത്തുന്നു; അതിനെ വെറും പരാജയമെന്നോ കീഴടക്കമെന്നോ വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. കർമണിപ്രയോഗവും ‘പാദപീഠം’ എന്ന സങ്കീർത്തനചിത്രവും സംരക്ഷിച്ചു; അടിക്കുറിപ്പ് സൂചകങ്ങൾ ബന്ധപ്പെട്ട പദക്രമത്തിൽ ചേർത്തു.
