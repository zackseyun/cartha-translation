  source_fidelity: ഗ്രീക്ക് വാക്യത്തിന്റെ കാലസൂചനയായ τὸ λοιπὸν (‘അന്നുമുതൽ’), തുടരുന്ന കാത്തിരിപ്പ് (ἐκδεχόμενος), ἕως-വരെ ഘടന, കൂടാതെ τεθῶσιν-ന്റെ കർമണിഭാവം എന്നിവ വിശ്വസ്തമായി പുനർനിർമ്മിച്ചിരിക്കുന്നു. ശത്രുക്കൾ ‘പാദപീഠം’ ആക്കപ്പെടുന്ന സങ്കീർത്തനം 110:1-ലെ മൂർത്തചിത്രവും സംരക്ഷിക്കപ്പെടുന്നു.
  naturalness: ‘അന്നുമുതൽ, തന്റെ ശത്രുക്കൾ തന്റെ പാദങ്ങൾക്ക് പാദപീഠമാക്കപ്പെടുന്നതുവരെ കാത്തിരിക്കുന്നു’ എന്നത് ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമാണ്. മുൻവാക്യത്തിൽനിന്ന് തുടരുന്ന പങ്കാളിവാക്യസ്വഭാവം മലയാളത്തിൽ സ്വതന്ത്ര ക്രിയാരൂപത്തിലൂടെ സ്വാഭാവികമായി കൈകാര്യം ചെയ്തിരിക്കുന്നു.
  terminology: ‘പാദപീഠം’ സങ്കീർത്തനപ്രതിധ്വനിക്കും പൊതുവായ ബൈബിൾരജിസ്റ്ററിനും യോജിച്ച പദമാണ്. ‘തന്റെ’ എന്ന പ്രയോഗം ഗ്രീക്കിലെ αὐτοῦ-വിന്റെ ബന്ധം ശരിയായി നിലനിർത്തുന്നു. പ്രതീക്ഷാഭാവം സാധ്യതയായി മാത്രം അടിക്കുറിപ്പിൽ നൽകിയത് ഉചിതമാണ്.
