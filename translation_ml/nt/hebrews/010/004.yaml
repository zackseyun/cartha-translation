id: HEB.10.4
reference: Hebrews 10:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀδύνατον γὰρ αἷμα ταύρων καὶ τράγων ἀφαιρεῖν ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/004.yaml
  text: For it is impossible for the blood of bulls and goats to take away sins[a].
translation:
  language: ml
  text: കാരണം, കാളകളുടെയും കോലാടുകളുടെയും രക്തത്താൽ പാപങ്ങൾ എടുത്തുമാറ്റുക അസാധ്യമാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പാപങ്ങൾ നീക്കിക്കളയുക.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് എടുത്തുമാറ്റുക, നീക്കിക്കളയുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδύνατον
  choice: അസാധ്യമാണ്
  rationale: ക്രിയാനാമരൂപത്തോടുകൂടെ വ്യക്തിനിരപേക്ഷ വിധേയവിശേഷണമായി ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ, പ്രസ്താവനയുടെ നിരുപാധികമായ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാദത്തിന് വിശദീകരണപരമായ അടിസ്ഥാനം നൽകുന്ന ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: αἷμα
  choice: രക്തം
  rationale: എബ്രായലേഖനത്തിലെ ബലിസംബന്ധമായ വാദത്തിന് കേന്ദ്രമായ മൂർത്തപദം തന്നെയായി നിലനിർത്തുന്നു; ‘ബലി’ എന്നാക്കി പരാവർത്തനം ചെയ്യുന്നില്ല.
- source_word: ταύρων
  choice: കാളകളുടെ
  rationale: ഷണ്ഡീകരിക്കാത്ത ആൺകന്നുകാലിയെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ ബലിസന്ദർഭത്തിന് യോജിച്ച, സാധാരണക്കാർക്ക് വ്യക്തമായ മലയാളരൂപം.
- source_word: τράγων
  choice: ആൺകോലാടുകളുടെ
  rationale: ഗ്രീക്കിലെ ആൺലിംഗസൂചന നിലനിർത്തിക്കൊണ്ട് ആട്ടിനത്തിൽനിന്ന് വ്യക്തമായി വേർതിരിക്കുന്ന കൃത്യമായ മലയാളപദം.
- source_word: ἀφαιρεῖν
  choice: നീക്കിക്കളയുക
  rationale: പാപങ്ങളെ എടുത്തുമാറ്റുക/നീക്കുക എന്ന ഗ്രീക്ക് ക്രിയയുടെ ശക്തി സ്വാഭാവികമായി നൽകുന്നു; കേവലം ‘പരിഹരിക്കുക’ എന്ന വ്യാഖ്യാനപരമായ ആശയം ചേർക്കുന്നില്ല.
- source_word: ἁμαρτίας
  choice: പാപങ്ങൾ
  rationale: ഗ്രീക്കിലെ വ്യക്തമായ ബഹുവചനം നിലനിർത്തുന്നു.
theological_decisions:
- issue: മൃഗബലിയുടെ ഫലപ്രാപ്തിയുടെ സ്വഭാവം
  choice: മൃഗങ്ങളുടെ രക്തത്തിന് പാപങ്ങൾ നീക്കിക്കളയാൻ കഴിയില്ലെന്ന വാക്യത്തിന്റെ നേരിട്ടുള്ള അവകാശവാദം മാത്രം വിവർത്തനത്തിൽ നിലനിർത്തി.
  alternative: അത്തരം ബലികൾ പാപങ്ങളെ താൽക്കാലികമായി മൂടിയെന്നോ ആചാരപരമായ ശുദ്ധീകരണം മാത്രം നൽകിയെന്നോ മുഖ്യവാചകത്തിൽ വിശദീകരിക്കുക.
  rationale: സന്ദർഭത്തിലെ അന്തിമമായ പാപനീക്കലുമായുള്ള വൈരുധ്യം സൂചിപ്പിക്കുമ്പോഴും, വാക്യം തന്നെ വ്യക്തമാക്കാത്ത സിദ്ധാന്തപരമായ വിശദീകരണം ചേർക്കാതെ ദൈവശാസ്ത്രപരമായ സംഘർഷം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ആൺകോലാട്’ മൂലപദത്തിന്റെ ലിംഗസൂചന കൃത്യമായി നിലനിർത്തുന്നു; ‘നീക്കിക്കളയുക’ മൂർത്തമായ ക്രിയാശക്തി സംരക്ഷിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
