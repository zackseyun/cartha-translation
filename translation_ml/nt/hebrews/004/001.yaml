revisions:
- from: അതുകൊണ്ട്, അവന്റെ വിശ്രമത്തിൽ പ്രവേശിക്കാനുള്ള വാഗ്ദാനം ഇപ്പോഴും നിലനിൽക്കുമ്പോൾ[a], നിങ്ങളിൽ ആരെങ്കിലും അതിൽ എത്താതെപോയതായി തോന്നാതിരിക്കാൻ നമുക്ക് ഭയപ്പെടാം[b].
  to: അതുകൊണ്ട്, അവന്റെ വിശ്രമത്തിൽ പ്രവേശിക്കാനുള്ള വാഗ്ദാനം ഇപ്പോഴും നിലനിൽക്കുമ്പോൾ[a], നിങ്ങളിൽ ആരെങ്കിലും അത് കൈവരിക്കുന്നതിൽ പരാജയപ്പെട്ടതായി തോന്നാതിരിക്കാൻ നമുക്ക് ഭയപ്പെടാം[b].
