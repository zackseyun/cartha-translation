id: HEB.4.2
reference: Hebrews 4:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ γάρ ἐσμεν εὐηγγελισμένοι καθάπερ κἀκεῖνοι, ἀλλ’ οὐκ ὠφέλησεν ὁ λόγος τῆς ἀκοῆς ἐκείνους, μὴ ⸀συγκεκερασμένους τῇ πίστει τοῖς ἀκούσασιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/002.yaml
  text: For indeed[a], we also have had good news proclaimed to us, just as they did; but the message they heard did not benefit them[b], because it was not united by faith with those who heard.
translation:
  language: ml
  text: കാരണം, തീർച്ചയായും, അവരെപ്പോലെ നമുക്കും സുവാർത്ത അറിയിക്കപ്പെട്ടിരിക്കുന്നു. എന്നാൽ അവർ കേട്ട സന്ദേശം അവർക്കു പ്രയോജനപ്പെട്ടില്ല; കാരണം, വിശ്വാസത്താൽ അവർ കേട്ടവരോടു ചേർന്നില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഒരു പാഠഭേദവും പരമ്പരാഗത വിവർത്തനവും അനുസരിച്ച്: “കാരണം, കേട്ടവരിൽ ആ സന്ദേശം വിശ്വാസവുമായി കലർന്നില്ല.”'
    reason: textual_variant
lexical_decisions:
- source_word: εὐηγγελισμένοι
  choice: സുവാർത്ത അറിയിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: ἐσμεν എന്നതിനോടു ചേർന്ന പരിപ്രാസ്തിക പൂർണകാല കർമണി പ്രയോഗം; മുമ്പ് നടന്ന അറിയിപ്പിന്റെ ഇപ്പോഴും നിലനിൽക്കുന്ന പ്രസക്തി മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: καθάπερ κἀκεῖνοι
  choice: അവരെപ്പോലെ നമുക്കും
  rationale: ഇപ്പോഴത്തെ ശ്രോതാക്കളും മരുഭൂമിതലമുറയും ദൈവിക സന്ദേശം ലഭിച്ചവരാണെന്ന സമാന്തരത സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ὁ λόγος τῆς ἀκοῆς
  choice: അവർ കേട്ട സന്ദേശം
  rationale: λόγος എന്നത് അറിയിക്കപ്പെട്ട ഉള്ളടക്കമായും ἀκοή കേൾവിയായും എടുത്ത്, അക്ഷരാർഥത്തിലെ അസ്വാഭാവികത ഒഴിവാക്കുന്നു.
- source_word: ὠφέλησεν
  choice: പ്രയോജനപ്പെട്ടില്ല
  rationale: സന്ദേശം അവർക്കു ഗുണമോ ആത്മീയ നേട്ടമോ വരുത്തിയില്ലെന്ന അർഥം ലളിതമായി നൽകുന്നു.
- source_word: συγκεκερασμένους
  choice: ചേർന്നില്ല
  rationale: കലർത്തുക, സംയോജിപ്പിക്കുക എന്ന രൂപകാത്മക ആശയം ആളുകൾ തമ്മിൽ വിശ്വാസത്താൽ ചേർക്കപ്പെടുക എന്ന സന്ദർഭോചിത അർഥത്തിൽ നൽകുന്നു.
- source_word: πίστει
  choice: വിശ്വാസത്താൽ
  rationale: ദാതൃവിഭക്തി ഇവിടെ ഉപാധിയെ സൂചിപ്പിക്കുന്നതായി എടുത്ത് πίστις എന്നതിന് പതിവായതും സന്ദർഭോചിതവുമായ 'വിശ്വാസം' ഉപയോഗിക്കുന്നു.
- source_word: τοῖς ἀκούσασιν
  choice: കേട്ടവരോടു
  rationale: ἀκούω എന്നതിന്റെ അടിസ്ഥാന അർഥമായ കേൾക്കുക നിലനിർത്തുന്നു; പ്രതികരണത്തിന്റെ സ്വഭാവം വിവർത്തനത്തിൽ അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
theological_decisions:
- issue: πίστις എന്ന പദത്തിന്റെ അർഥം
  choice: വിശ്വാസം
  alternative: ആശ്രയം / വിശ്വസ്തത
  rationale: സന്ദർഭത്തിൽ കേൾവിയോടു പ്രതികരിക്കുന്ന വിശ്വാസമാണ് മുഖ്യമായത്; 'വിശ്വസ്തത' ഇവിടെ കുറച്ച് സാധ്യതയുള്ളതാണ്.
- issue: അവസാന ഉപവാക്യത്തിന്റെ വ്യാഖ്യാനം
  choice: വിശ്വാസത്താൽ അവർ കേട്ടവരോടു ചേർന്നില്ല
  alternative: കേട്ടവരിൽ ആ സന്ദേശം വിശ്വാസവുമായി കലർന്നില്ല
  rationale: നൽകിയ SBLGNT പാഠത്തിലെ accusative ബഹുവചനമായ συγκεκερασμένους, ἐκείνους എന്ന ആളുകളെ വിശേഷിപ്പിക്കുന്നതായി സ്വാഭാവികമായി വായിക്കാം. പ്രസിദ്ധമായ പാഠഭേദം സന്ദേശം വിശ്വാസവുമായി കലർന്നില്ല എന്ന പരമ്പരാഗത വായനയെ പിന്തുണയ്ക്കുന്നതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. മൂലപാഠത്തിലെ വാക്യഘടനാപരവും പാഠഭേദപരവുമായ അനിശ്ചിതത്വം മുഖ്യവാചകത്തിലും അടിക്കുറിപ്പിലും സുതാര്യമായി നിലനിർത്തി.
