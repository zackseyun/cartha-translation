id: HEB.4.12
reference: Hebrews 4:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ζῶν γὰρ ὁ λόγος τοῦ θεοῦ καὶ ἐνεργὴς καὶ τομώτερος ὑπὲρ πᾶσαν μάχαιραν δίστομον καὶ διϊκνούμενος ἄχρι μερισμοῦ ψυχῆς ⸀καὶ πνεύματος, ἁρμῶν τε καὶ μυελῶν, καὶ κριτικὸς ἐνθυμήσεων καὶ ἐννοιῶν καρδίας·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/012.yaml
  text: For the word of God is living and active[a], and sharper than any double-edged sword, piercing to the division of soul and spirit, of joints and marrow[c][b], and able to judge the thoughts and intentions of the heart.
translation:
  language: ml
  text: എന്തെന്നാൽ, ദൈവത്തിന്റെ വചനം ജീവനുള്ളതും പ്രവർത്തനക്ഷമവും ഇരുവായ്ത്തലയുള്ള ഏതു വാളിനെക്കാളും മൂർച്ചയേറിയതും പ്രാണന്റെയും ആത്മാവിന്റെയും[a], സന്ധികളുടെയും മജ്ജകളുടെയും വേർതിരിവുവരെ തുളച്ചുകയറുന്നതും ഹൃദയത്തിലെ ചിന്തകളെയും ഉദ്ദേശ്യങ്ങളെയും വിലയിരുത്താൻ കഴിവുള്ളതുമാണ്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പ്രാണന്റെയും ആത്മാവിന്റെയും’ എന്ന പ്രയോഗം മനുഷ്യൻ നിർബന്ധമായും വേർപെടുത്താവുന്ന പ്രത്യേക ഘടകങ്ങളാൽ നിർമ്മിതനാണെന്ന ഒരു സിദ്ധാന്തം ഇവിടെ സ്ഥാപ Jennings?
    reason: alternative_reading
  - marker: b
    text: അഥവാ, ‘ഹൃദയത്തിലെ ചിന്തകളെയും ഉദ്ദേശ്യങ്ങളെയും വിവേചിക്കുന്നതും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ζῶν
  choice: ജീവനുള്ളത്
  rationale: വർത്തമാനകാല സ്വഭാവം സൂചിപ്പിക്കുന്ന ഈ പദം ദൈവവചനത്തിന്റെ നിരന്തരമായ ജീവചൈതന്യം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: γὰρ
  choice: സന്ദർഭബന്ധത്തിലൂടെ സൂചിപ്പിച്ചു; പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയില്ല
  rationale: മുൻവാക്യത്തെ അടിസ്ഥാനപ്പെടുത്തുന്ന വിശദീകരണബന്ധമാണ് γὰρ സൂചിപ്പിക്കുന്നത്. ഒറ്റവാക്യമായി ഉദ്ധരിക്കുമ്പോൾ ‘എന്തെന്നാൽ’ എന്നു തുടങ്ങുന്നത് മലയാളത്തിൽ അസ്വാഭാവികമാകുന്നതിനാൽ ബന്ധം വാക്യത്തിന്റെ പ്രഖ്യാപനസ്വഭാവത്തിൽ നിലനിർത്തി.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ വചനം
  rationale: ദൈവത്തിന്റെ അരുളപ്പാട്, സന്ദേശം, തിരുവെഴുത്ത് എന്നിവയിൽ ഒന്നായി മാത്രം അർഥം ചുരുക്കാതെ ഗ്രീക്കിലെ വിശാലത നിലനിർത്തുന്ന പതിവും സുതാര്യവുമായ പ്രയോഗം.
- source_word: ἐνεργὴς
  choice: പ്രവർത്തനനിരതം
  rationale: വെറും ശക്തിയുള്ളത് എന്നതിലുപരി സജീവമായി പ്രവർത്തിക്കുന്നതെന്ന ആശയം നൽകുന്നു; ‘ജീവനുള്ളത്’ എന്നതിനോടുള്ള അനാവശ്യ ആവർത്തനവും ഒഴിവാക്കുന്നു.
- source_word: τομώτερος ὑπὲρ πᾶσαν μάχαιραν δίστομον
  choice: ഇരുവായ്ത്തലയുള്ള ഏതു വാളിനെക്കാളും മൂർച്ചയേറിയത്
  rationale: താരതമ്യവും ഇരുവശവും മുറിക്കുന്ന വാളിന്റെ ദൃശ്യബിംബവും വ്യക്തമായ ആധുനിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: διϊκνούμενος
  choice: തുളച്ചുകയറുന്നു
  rationale: ആഴത്തിലേക്ക് കടന്നുചെല്ലുന്ന വാളിന്റെ ചലനബിംബം ശക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἄχρι μερισμοῦ
  choice: വേർതിരിക്കുംവരെ
  rationale: ἄχρι സൂചിപ്പിക്കുന്ന എത്തിച്ചേരുന്ന പരിധിയും μερισμός സൂചിപ്പിക്കുന്ന വേർതിരിക്കലും മലയാളത്തിൽ സ്വാഭാവികമായി ചേർത്തു.
- source_word: ψυχῆς καὶ πνεύματος
  choice: പ്രാണനെയും ആത്മാവിനെയും
  rationale: രണ്ടു ഗ്രീക്ക് പദങ്ങളെയും വേർതിരിച്ചു നിലനിർത്തുന്നു; മനുഷ്യഘടനയെക്കുറിച്ചുള്ള ഒരു പ്രത്യേക സിദ്ധാന്തം പരിഭാഷയിൽ അടിച്ചേൽപ്പിക്കുന്നില്ല.
- source_word: ἁρμῶν τε καὶ μυελῶν
  choice: സന്ധികളെയും മജ്ജകളെയും
  rationale: ശരീരത്തിന്റെ അത്യന്തം ആഴത്തിലുള്ള ഭാഗങ്ങളിലേക്കുള്ള കടന്നുകയറ്റത്തിന്റെ സമാന്തര ബിംബം നിലനിർത്തുന്നു.
- source_word: κριτικὸς
  choice: വിലയിരുത്താൻ കഴിവുള്ളത്
  rationale: ചിന്തകളുടെ സ്വഭാവം പരിശോധിച്ചു വിധിക്കുന്ന ശേഷിയെ സൂചിപ്പിക്കുന്നു; ‘വിമർശനാത്മകം’ പോലുള്ള ആധുനികമായി ചുരുങ്ങിയ അർഥം ഒഴിവാക്കുന്നു.
- source_word: ἐνθυμήσεων
  choice: ചിന്തകൾ
  rationale: ഉള്ളിലെ ആലോചനകളെയും വിചാരങ്ങളെയും ഉൾക്കൊള്ളുന്ന വിശാലവും സാധാരണക്കാർക്ക് വ്യക്തമുമായ പദം.
- source_word: ἐννοιῶν
  choice: ഉദ്ദേശ്യങ്ങൾ
  rationale: മുൻപത്തെ ‘ചിന്തകൾ’ എന്നതിൽനിന്ന് വേർതിരിച്ച് ഉള്ളിലെ ലക്ഷ്യങ്ങളെയും മനോഭാവങ്ങളെയും സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘ദൈവത്തിന്റെ വചനം’ എന്നതിന്റെ സൂചിതവിഷയം
  choice: തിരുവെഴുത്ത്, പ്രസംഗിക്കപ്പെട്ട സന്ദേശം, ദൈവത്തിന്റെ അരുളപ്പാട്, വ്യക്തിയായ വചനം എന്നിവയിൽ ഒന്നായി അർഥം ചുരുക്കാതെ ‘ദൈവത്തിന്റെ വചനം’ എന്നു നിലനിർത്തി.
  alternative: ‘തിരുവെഴുത്ത്’ എന്നോ ‘ദൈവപുത്രൻ’ എന്നോ വ്യക്തമായി നിർണ്ണയിക്കുക.
  rationale: എബ്രായർക്കുള്ള ലേഖനത്തിന്റെ സമീപസന്ദർഭം ദൈവത്തിന്റെ സംസാരത്തിന്റെ ഫലപ്രാപ്തിക്ക് ഊന്നൽ നൽകുന്നുവെങ്കിലും ഗ്രീക്ക് പ്രയോഗം അതിനേക്കാൾ വിശാലമായ അനുരണനം അനുവദിക്കുന്നു.
- issue: ‘പ്രാണനും ആത്മാവും’ എന്നതിന്റെ മനുഷ്യശാസ്ത്രപരമായ അർഥം
  choice: രണ്ടു പദങ്ങളും അതേപടി വേർതിരിച്ചു സൂക്ഷിച്ചു; അവ നിർബന്ധമായും വേർപെടുത്താവുന്ന സാങ്കേതിക ഘടകങ്ങളാണെന്ന് പ്രസ്താവിച്ചില്ല.
  alternative: മനുഷ്യൻ രണ്ടു ഘടകങ്ങളോ മൂന്നു ഘടകങ്ങളോ ഉള്ളവനാണെന്ന സിദ്ധാന്തത്തിന്റെ തെളിവായി വാക്യം വ്യക്തമാക്കുക.
  rationale: ഇവിടെ മുഖ്യമായ ഊന്നൽ ദൈവവചനത്തിന്റെ അത്യന്തം ആഴത്തിലുള്ള തുളച്ചുകയറ്റത്തിലും വിലയിരുത്തലിലുമാണ്; മനുഷ്യഘടനയെക്കുറിച്ചുള്ള ഒരു പ്രത്യേക സമ്പ്രദായം പരിഭാഷ ചേർക്കരുത്.
- issue: ‘വേർതിരിക്കുംവരെ’ എന്ന ബിംബത്തിന്റെ സ്വഭാവം
  choice: വാൾബിംബത്തിന്റെ തീവ്രത നിലനിർത്തിക്കൊണ്ട് തുളച്ചുകയറ്റത്തിന്റെ പരമമായ ആഴമായി അവതരിപ്പിച്ചു.
  alternative: പ്രാണനെയും ആത്മാവിനെയും യാഥാർഥ്യത്തിൽ പരസ്പരം വിച്ഛേദിക്കുന്നു എന്ന് നിർണ്ണയിക്കുക.
  rationale: μερισμός വേർതിരിക്കൽ സൂചിപ്പിക്കുന്നുവെങ്കിലും വാക്യത്തിന്റെ രൂപകം ദൈവവചനത്തിന്റെ എത്തിപ്പെടാനാവാത്ത ആഴമില്ലെന്ന ആശയമാണ് മുൻനിർത്തുന്നത്; അതിനപ്പുറം സിദ്ധാന്തനിഗമനം നിർബന്ധിക്കേണ്ടതില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വചനം’, ‘പ്രാണൻ’, ‘ആത്മാവ്’ എന്നീ സ്ഥാപിത ബൈബിൾപദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന ലളിതമാക്കി. മൂലത്തിലെ വാൾബിംബവും ആന്തരിക വിലയിരുത്തലും വ്യക്തമായി കേൾക്കാൻ രണ്ട് സ്വതന്ത്ര ഉപവാക്യങ്ങൾ ഉപയോഗിച്ചു.
