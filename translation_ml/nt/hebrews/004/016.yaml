source:
  edition: SBLGNT
  text: προσερχώμεθα οὖν μετὰ παρρησίας τῷ θρόνῳ τῆς χάριτος, ἵνα λάβωμεν ἔλεος καὶ χάριν εὕρωμεν εἰς εὔκαιρον βοήθειαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/016.yaml
  text: Therefore[a], let us approach the throne of grace with boldness[b], so that we may receive mercy and find grace for timely help.
translation:
  language: ml
  text: അതുകൊണ്ട്, നമുക്കു കരുണ ലഭിക്കാനും തക്കസമയത്തുള്ള സഹായത്തിനായി[b] കൃപ കണ്ടെത്താനും നാം ധൈര്യത്തോടെ[a] കൃപയുടെ സിംഹാസനത്തെ സമീപിക്കാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ആത്മവിശ്വാസത്തോടെ.’ ഗ്രീക്കുപദത്തിന് ആത്മവിശ്വാസം, മടിയില്ലാത്ത ധൈര്യം, തുറന്നുപറയാനുള്ള സ്വാതന്ത്ര്യം എന്നീ ആശയങ്ങൾ നൽകാൻ കഴിയും.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘ആവശ്യസമയത്തെ സഹായത്തിനായി.’ ഗ്രീക്കുപ്രയോഗം കൂടുതൽ അക്ഷരാർഥത്തിൽ തക്കസമയത്തു ലഭിക്കുന്ന സഹായത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσερχώμεθα
  choice: നാം സമീപിക്കാം
  rationale: വർത്തമാനകാല മധ്യപ്രയോഗ സബ്ജങ്ക്ടീവിന്റെ ആഹ്വാനഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: യേശുവിന്റെ മഹാപുരോഹിതത്വത്തെക്കുറിച്ചുള്ള മുൻവാദത്തിൽനിന്നുള്ള നിഗമനബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: μετὰ παρρησίας
  choice: ധൈര്യത്തോടെ
  rationale: παρρησία സൂചിപ്പിക്കുന്ന മടിയില്ലാത്ത, തുറന്ന സമീപനത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; ഇത് വെറും ആന്തരിക ഉറപ്പായി ചുരുക്കുന്നില്ല.
- source_word: τῷ θρόνῳ τῆς χάριτος
  choice: കൃപയുടെ സിംഹാസനത്തെ
  rationale: ജനിറ്റീവ് ഘടനയും സിംഹാസനരൂപകവും വ്യാഖ്യാനാതിക്രമമില്ലാതെ നിലനിർത്തുന്നു.
- source_word: ἵνα
  choice: -ാനും … -ാനും
  rationale: മലയാളത്തിലെ സമാന്തര ഉദ്ദേശ്യഘടന ഉപയോഗിച്ച് ഗ്രീക്കിലെ ഉദ്ദേശ്യാർഥം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: λάβωμεν ἔλεος
  choice: നമുക്കു കരുണ ലഭിക്കാനും
  rationale: λαμβάνω എന്നതിന്റെ ‘ലഭിക്കുക/സ്വീകരിക്കുക’ എന്ന സാധാരണ അർഥവും ἔλεος എന്നതിന്റെ ‘കരുണ’ എന്ന അർഥവും നിലനിർത്തുന്നു.
- source_word: χάριν εὕρωμεν
  choice: കൃപ കണ്ടെത്താനും
  rationale: മുൻവാക്യഭാഗത്തിലെ ‘കരുണ ലഭിക്കുക’ എന്നതിൽനിന്നു വ്യത്യസ്തമായി ‘കൃപ കണ്ടെത്തുക’ എന്ന മൂലപദപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: εἰς εὔκαιρον βοήθειαν
  choice: തക്കസമയത്തുള്ള സഹായത്തിനായി
  rationale: εὔκαιρος സൂചിപ്പിക്കുന്ന യോജിച്ച സമയത്ത് ലഭിക്കുന്ന സഹായത്തിന്റെ ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: ദൈവത്തെ സമീപിക്കുന്നതിലെ παρρησίαയുടെ സൂക്ഷ്മാർഥം
  choice: ധൈര്യത്തോടെ
  alternative: ആത്മവിശ്വാസത്തോടെ
  rationale: യേശുവിന്റെ മഹാപുരോഹിതശുശ്രൂഷയിലൂടെ ലഭിക്കുന്ന മടിയില്ലാത്ത പ്രവേശനത്തിന്റെ ശക്തി ‘ധൈര്യത്തോടെ’ കൂടുതൽ നന്നായി നിലനിർത്തുന്നു; അതേസമയം അഹങ്കാരപരമായ ധാർഷ്ട്യം ഇതിൽ ചേർക്കുന്നില്ല.
- issue: രണ്ടാം ഉപവാക്യത്തിലെ χάρις
  choice: കൃപ
  alternative: പ്രീതി
  rationale: ദൈവിക അനുഗ്രഹത്തിന്റെ അർഥവും എബ്രായലേഖനത്തിലെ പ്രധാന പദത്തിന്റെ ദൈവശാസ്ത്രപരമായ ഘനതയും ‘കൃപ’ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കൃപയുടെ സിംഹാസനം’ എന്ന പരിചിതരൂപകം നിലനിർത്തി; സമാന്തരമായ ‘കരുണ ലഭിക്കുക / കൃപ കണ്ടെത്തുക’ എന്ന മൂലഭാഷാഭേദവും സംരക്ഷിച്ചു. അടിക്കുറിപ്പുകളുടെ സൂചനകൾ അവ വിശദീകരിക്കുന്ന യഥാർത്ഥ പദപ്രയോഗങ്ങളോടാണ് ചേർത്തിരിക്കുന്നത്.
