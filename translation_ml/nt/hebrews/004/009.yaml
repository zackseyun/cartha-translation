id: HEB.4.9
reference: Hebrews 4:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἄρα ἀπολείπεται σαββατισμὸς τῷ λαῷ τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/009.yaml
  text: So then[a], a Sabbath rest remains for the people of God.
translation:
  language: ml
  text: അതുകൊണ്ട്, ദൈവജനത്തിനായി ഒരു ശബ്ബത്തുവിശ്രമം[a] ശേഷിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ശബ്ബത്താചരണം.’ σαββατισμός എന്ന ഗ്രീക്കുപദം അപൂർവമാണ്; അത് ശബ്ബത്തിനെ വ്യക്തമായി അനുസ്മരിപ്പിക്കുന്നു. ഇവിടെ ദൈവജനത്തിനായി ശേഷിക്കുന്ന ശബ്ബത്തുസദൃശമായ വിശ്രമത്തെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നതെന്നു തോന്നുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα
  choice: അതുകൊണ്ട്
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനം സൂചിപ്പിക്കുന്ന അനുമാനകണത്തിന്റെ താർക്കികബലം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀπολείπεται
  choice: ശേഷിക്കുന്നു
  rationale: ഒന്ന് ഇപ്പോഴും ബാക്കിനിൽക്കുന്നു അഥവാ ലഭ്യമായി തുടരുന്നു എന്ന വർത്തമാനകാലഭാവം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: σαββατισμός
  choice: ശബ്ബത്തുവിശ്രമം
  rationale: അപൂർവമായ ഈ നാമത്തിന്റെ ശബ്ബത്തുമായുള്ള വ്യക്തമായ പദബന്ധവും എബ്രായർ 3–4-ലെ വിശ്രമപ്രമേയവും ഒരുമിച്ച് നിലനിർത്തുന്നു; വെറും ആചരണമായി അർഥം ചുരുക്കുന്നില്ല.
- source_word: τῷ λαῷ
  choice: ജനത്തിനായി
  rationale: ദത്തിവ് ഇവിടെ പ്രയോജനം/ലഭ്യത സൂചിപ്പിക്കുന്നതിനാൽ, ആ വിശ്രമം ദൈവജനത്തിനായി ശേഷിക്കുന്നു എന്ന സ്വാഭാവിക മലയാളപ്രയോഗം സ്വീകരിച്ചു.
- source_word: τοῦ θεοῦ
  choice: ദൈവജനത്തിന്
  rationale: ഉടമസ്ഥതയും ബന്ധവും സൂചിപ്പിക്കുന്ന ജനിറ്റീവിനെ മലയാളത്തിലെ സ്വാഭാവിക സംയുക്തരൂപമായ ‘ദൈവജനം’ കൊണ്ട് നൽകുന്നു.
theological_decisions:
- issue: എബ്രായർ 4:9-ലെ σαββατισμός എന്ന പദത്തിന്റെ അർഥം
  choice: ദൈവജനത്തിനായി ശേഷിക്കുന്ന ശബ്ബത്തുസദൃശമായ വിശ്രമം—‘ശബ്ബത്തുവിശ്രമം’
  alternative: അക്ഷരാർഥത്തിലുള്ള ശബ്ബത്താചരണം; അല്ലെങ്കിൽ ശബ്ബത്ത് അനുരണനം ഇല്ലാത്ത പൂർണമായും രൂപകാലങ്കാരപരമായ ആത്മീയവിശ്രമം
  rationale: ഈ പദം തന്നെ ശബ്ബത്തിനെ വ്യക്തമായി അനുസ്മരിപ്പിക്കുന്നു; സമീപസന്ദർഭം ദൈവത്തിന്റെ വിശ്രമത്തെയും ഏഴാം ദിവസത്തെയും വാഗ്ദത്തവിശ്രമത്തെയും ബന്ധിപ്പിക്കുന്നു. ‘ശബ്ബത്തുവിശ്രമം’ എന്ന പരിഭാഷ ആഴ്ചതോറുമുള്ള ആചരണമായി ചുരുക്കാതെയും ശബ്ബത്ത് അർഥസൂചന നീക്കാതെയും ആ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ശബ്ബത്തുവിശ്രമം’ എന്ന സംയുക്തപദം മൂലപദത്തിന്റെ ശബ്ബത്ത് അനുരണനവും സന്ദർഭത്തിലെ വിശ്രമപ്രമേയവും സംരക്ഷിക്കുന്നു.
