id: HEB.4.10
reference: Hebrews 4:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ γὰρ εἰσελθὼν εἰς τὴν κατάπαυσιν αὐτοῦ καὶ αὐτὸς κατέπαυσεν ἀπὸ τῶν ἔργων αὐτοῦ ὥσπερ ἀπὸ τῶν ἰδίων ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/010.yaml
  text: For the one who has entered his rest has himself also rested from his works[b][a], just as God did from his own.
translation:
  language: ml
  text: എന്തെന്നാൽ അവന്റെ വിശ്രമത്തിൽ[a] പ്രവേശിച്ചവനും തന്റെ പ്രവൃത്തികളിൽനിന്ന് വിശ്രമിച്ചിരിക്കുന്നു[b], ദൈവം തന്റെ സ്വന്തം പ്രവൃത്തികളിൽനിന്ന് വിശ്രമിച്ചതുപോലെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദൈവത്തിന്റെ വിശ്രമത്തിൽ പ്രവേശിച്ചവൻ.’ ‘അവന്റെ’ എന്ന സർവനാമം എബ്രായർ 3–4-ന്റെ സന്ദർഭത്തിൽ മിക്കവാറും ദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, ‘തന്റെ പ്രവൃത്തികളിൽനിന്ന് വിരമിച്ചിരിക്കുന്നു.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് ക്രിയ ‘വിശ്രമം’ എന്ന പദവുമായി ഒരേ പദകുടുംബത്തിൽപ്പെട്ടതിനാൽ മുഖ്യവാചകത്തിൽ ആവർത്തിച്ചുള്ള വിശ്രമഭാഷ നിലനിർത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ... εἰσελθὼν
  choice: പ്രവേശിച്ചവൻ
  rationale: നാമവാചകമായി പ്രവർത്തിക്കുന്ന ഭൂതകാല കൃദന്തരൂപത്തിന്റെ പൊതുവായ ഏകവചനവും പ്രവേശനം പൂർത്തിയായെന്ന ഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തെ വിശദീകരിക്കുകയും അതിന് അടിസ്ഥാനം നൽകുകയും ചെയ്യുന്ന ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: κατάπαυσιν
  choice: വിശ്രമം
  rationale: എബ്രായർ 3–4-ലെ മുഖ്യ പ്രമേയപദവും ഉല്പത്തി 2-ലെ ദൈവത്തിന്റെ വിശ്രമവുമായുള്ള ബന്ധവും നിലനിർത്തുന്നു.
- source_word: αὐτοῦ (after κατάπαυσιν)
  choice: അവന്റെ
  rationale: സന്ദർഭത്തിൽ ഇത് മിക്കവാറും ദൈവത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, ഗ്രീക്കിലെ സർവനാമരൂപവും അതിലുള്ള യഥാർഥ വ്യാകരണസാധ്യതയും മുഖ്യവാചകത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: καὶ αὐτὸς
  choice: താനും
  rationale: καί എന്നതിന്റെ കൂട്ടിച്ചേർക്കൽഭാവവും αὐτός എന്നതിന്റെ ഊന്നലും ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: κατέπαυσεν
  choice: വിശ്രമിച്ചിരിക്കുന്നു
  rationale: κατάπαυσις എന്ന നാമപദവുമായുള്ള ശബ്ദാർഥബന്ധവും ഭാഗത്തിലെ ആവർത്തിച്ചുള്ള വിശ്രമഭാഷയും നിലനിർത്തുന്നു; പൂർത്തിയായ പ്രവർത്തിയുടെ ഇപ്പോഴത്തെ പ്രസക്തിയും അറിയിക്കുന്നു.
- source_word: ἀπὸ τῶν ἔργων αὐτοῦ
  choice: തന്റെ പ്രവൃത്തികളിൽനിന്ന്
  rationale: ἔργα എന്ന പൊതുവായ പദത്തെ പ്രത്യേക മതശാസ്ത്രപരമായ അർഥത്തിലേക്ക് ചുരുക്കാതെ നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: ὥσπερ
  choice: '...പോലെ'
  rationale: പ്രവേശിച്ചവന്റെ വിശ്രമവും ദൈവത്തിന്റെ വിശ്രമവും തമ്മിലുള്ള വ്യക്തമായ താരതമ്യം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: τῶν ἰδίων
  choice: തന്റെ സ്വന്തം പ്രവൃത്തികളിൽനിന്ന്
  rationale: ഗ്രീക്കിൽ ഒഴിവാക്കിയിരിക്കുന്ന ἔργων മലയാളത്തിൽ വ്യക്തതയ്ക്കായി പുനഃസ്ഥാപിക്കുകയും ἰδίων എന്നതിന്റെ സ്വത്വഊന്നൽ ‘സ്വന്തം’ വഴി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ὁ θεός
  choice: ദൈവം
  rationale: θεός എന്ന പദത്തിന്റെ നിലവാരമുള്ള മലയാള പരിഭാഷ.
theological_decisions:
- issue: ‘അവന്റെ വിശ്രമം’ (αὐτοῦ) ആരുടേതാണ്?
  choice: മുഖ്യവാചകത്തിൽ ‘അവന്റെ’ എന്ന് നിലനിർത്തി; സന്ദർഭത്തിൽ അത് ദൈവത്തിന്റെ വിശ്രമത്തെ സൂചിപ്പിക്കുന്നതാണ് ഏറ്റവും സാധ്യതയുള്ളത്.
  alternative: പ്രവേശിക്കുന്ന വ്യക്തിയുടെ സ്വന്തം വിശ്രമം എന്നാണ് സർവനാമം സൂചിപ്പിക്കുന്നത്.
  rationale: എബ്രായർ 3–4-ൽ ആവർത്തിച്ച് പറയുന്നത് ദൈവത്തിന്റെ വിശ്രമമാണ്; കൂടാതെ വാക്യാവസാനത്തിലെ ദൈവത്തിന്റെ സ്വന്തം വിശ്രമവുമായുള്ള താരതമ്യവും ഈ വായനയെ പിന്തുണയ്ക്കുന്നു. എങ്കിലും ‘ദൈവത്തിന്റെ’ എന്ന് നേരിട്ട് ചേർത്ത് ഗ്രീക്കിലെ സർവനാമസാധ്യത പൂർണമായി അടച്ചുകളയാതെ മുഖ്യവാചകത്തിൽ യഥാർഥ സംഘർഷം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘വിശ്രമം/വിശ്രമിച്ചു’ എന്ന ആവർത്തനം ശൈലിപരമായി ഒഴിവാക്കാതെ മൂലത്തിലെ പദബന്ധവും ഭാഗത്തിന്റെ പ്രമേയവും സംരക്ഷിച്ചിരിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട വാചകഘടകത്തിന് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
