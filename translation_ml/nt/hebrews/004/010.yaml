  source_fidelity: 'മുഖ്യവാചകം ഗ്രീക്കിലെ പ്രധാന ഘടകങ്ങൾ വിശ്വസ്തമായി നൽകുന്നു: പ്രവേശിച്ച വ്യക്തി, ‘അവന്റെ വിശ്രമം’ എന്ന സന്ദർഭാനുസൃതമെങ്കിലും മുഖ്യവാചകത്തിൽ തുറന്നുവച്ച സർവനാമം, പ്രവൃത്തികളിൽനിന്നുള്ള വിശ്രമം, ദൈവത്തിന്റെ സ്വന്തം പ്രവൃത്തികളിൽനിന്നുള്ള വിശ്രമത്തോടുള്ള താരതമ്യം. ‘അവനും’ എന്ന പ്രയോഗം καὶ αὐτός-ന്റെ ‘അവനും/അവൻതന്നെയും’ എന്ന കൂട്ടിച്ചേർക്കൽ-ഊന്നൽ സ്വാഭാവികമായി വഹിക്കുന്നു.'
  naturalness: ‘എന്തെന്നാൽ’ എന്നതിനുശേഷമുള്ള അനാവശ്യ കോമ ഒഴിവാക്കുകയും താരതമ്യഘടകം വാക്യാവസാനത്ത് ക്രമീകരിക്കുകയും ചെയ്താൽ ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ ഒഴുക്ക് മെച്ചപ്പെടും. ‘വിശ്രമം/വിശ്രമിച്ചിരിക്കുന്നു’ എന്ന ആവർത്തനം ഇവിടെ പ്രമേയപരമായി ഉചിതമാണ്.
  terminology: ‘വിശ്രമം,’ ‘പ്രവൃത്തികൾ,’ ‘ദൈവം’ എന്നിവ യോജിച്ച നിലവാരമുള്ള പദങ്ങളാണ്. മുഖ്യവാചകത്തിലെ ‘അവന്റെ’ ഗ്രീക്കിലെ അസന്ദിഗ്ധമല്ലാത്ത സർവനാമത്തെ അനാവശ്യമായി വ്യാഖ്യാനിക്കുന്നില്ല. രണ്ടാം അടിക്കുറിപ്പിലെ ‘തന്റെ പ്രവൃത്തികൾ അവസാനിപ്പിച്ചിരിക്കുന്നു’ എന്നത് പ്രവൃത്തികൾതന്നെ അവസാനിച്ചു എന്ന തെറ്റായ അർഥസാധ്യത ഉണ്ടാക്കാം; ‘തന്റെ പ്രവൃത്തികളിൽനിന്ന് വിരമിച്ചിരിക്കുന്നു’ കൂടുതൽ കൃത്യമാണ്.
