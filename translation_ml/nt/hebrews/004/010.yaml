revisions:
- from: എന്തെന്നാൽ, അവന്റെ വിശ്രമത്തിൽ പ്രവേശിച്ചവൻ, ദൈവം തന്റെ സ്വന്തം പ്രവൃത്തികളിൽനിന്ന് വിശ്രമിച്ചതുപോലെ, താനും തന്റെ പ്രവൃത്തികളിൽനിന്ന് വിശ്രമിച്ചിരിക്കുന്നു.[a][b]
  to: എന്തെന്നാൽ അവന്റെ വിശ്രമത്തിൽ[a] പ്രവേശിച്ചവനും തന്റെ പ്രവൃത്തികളിൽനിന്ന് വിശ്രമിച്ചിരിക്കുന്നു[b], ദൈവം തന്റെ സ്വന്തം പ്രവൃത്തികളിൽനിന്ന് വിശ്രമിച്ചതുപോലെ.
  rationale: അർഥത്തിൽ മാറ്റം വരുത്താതെ അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ സൂചിപ്പിക്കുന്ന പദങ്ങളിലേക്കു മാറ്റി. രണ്ടാം അടിക്കുറിപ്പിലെ ബദൽപ്രയോഗം ἀπό (‘നിന്ന്’) എന്ന ബന്ധവും വ്യക്തി തന്റെ പ്രവൃത്തികളിൽനിന്ന് വിരമിക്കുന്നു എന്ന അർഥവും വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്നവിധം പരിഷ്കരിച്ചു. വാക്യക്രമം മലയാളത്തിലെ സ്വാഭാവിക താരതമ്യഘടനയ്ക്കനുസരിച്ച് ലഘുവായി ക്രമീകരിച്ചു.
