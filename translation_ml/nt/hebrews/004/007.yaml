  to: 'വീണ്ടും അവൻ ഒരു ദിവസം നിശ്ചയിക്കുന്നു: “ഇന്ന്.” വളരെക്കാലത്തിനുശേഷം ദാവീദിലൂടെ ഇപ്രകാരം പറഞ്ഞുകൊണ്ട്, മുമ്പ് പറഞ്ഞിരിക്കുന്നതുപോലെ:


    “ഇന്ന് നിങ്ങൾ അവന്റെ ശബ്ദം കേൾക്കുന്നുവെങ്കിൽ,

    നിങ്ങളുടെ ഹൃദയങ്ങൾ കഠിനമാക്കരുത്.”'
  rationale: പുനഃപരിഭാഷ അർഥത്തിൽ മാറ്റം വരുത്തുന്നില്ല. ‘ഇന്ന്’ ദൈവം നിശ്ചയിക്കുന്ന ദിവസത്തിന്റെ പേരായി വ്യക്തമായി വേർതിരിക്കുന്നു; ദീർഘകാലാന്തരത്തിനുശേഷം ദാവീദിലൂടെ പറയപ്പെടുന്ന ഉദ്ധരണി എന്ന ഗ്രീക്ക് വാക്യഘടന കൂടുതൽ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു. ἐν Δαυὶδ-ന്റെ വ്യാഖ്യാനപരമായ പകരംവായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
