id: HEB.4.7
reference: Hebrews 4:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πάλιν τινὰ ὁρίζει ἡμέραν, Σήμερον, ἐν Δαυὶδ λέγων μετὰ τοσοῦτον χρόνον, καθὼς ⸀προείρηται, Σήμερον ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε, μὴ σκληρύνητε τὰς καρδίας ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/007.yaml
  text: 'Again he appoints a certain day[a], “Today,” saying through David after so long a time, just as has been said before: “Today, if you hear his voice, do not harden your hearts.”'
translation:
  language: ml
  text: 'വീണ്ടും അവൻ ഒരു ദിവസം നിശ്ചയിക്കുന്നു: “ഇന്ന്.” വളരെക്കാലത്തിനുശേഷം ദാവീദിലൂടെ ഇപ്രകാരം പറഞ്ഞുകൊണ്ട്, മുമ്പ് പറഞ്ഞിരിക്കുന്നതുപോലെ:


    “ഇന്ന് നിങ്ങൾ അവന്റെ ശബ്ദം കേൾക്കുന്നുവെങ്കിൽ,

    നിങ്ങളുടെ ഹൃദയങ്ങൾ കഠിനമാക്കരുത്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: മുൻവാദത്തെ പുനരാരംഭിച്ച് ദൈവം ഒരു ദിവസം വീണ്ടും നിർണയിക്കുന്നുവെന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τινὰ ἡμέραν
  choice: ഒരു നിശ്ചിത ദിവസം
  rationale: τις സൂചിപ്പിക്കുന്ന, ഏതെന്ന് തുടർന്ന് വ്യക്തമാക്കപ്പെടുന്ന നിർദിഷ്ടമായെങ്കിലും ആദ്യം പേരിടാത്ത ദിവസത്തിന്റെ ഭാവം നിലനിർത്തുന്നു.
- source_word: ὁρίζει
  choice: നിശ്ചയിക്കുന്നു
  rationale: അധികാരപൂർവം ഒരു ദിവസം നിർണയിക്കുകയോ വേർതിരിക്കുകയോ ചെയ്യുന്നതിനെ വ്യക്തമാക്കുന്നു.
- source_word: Σήμερον
  choice: “ഇന്ന്”
  rationale: ദൈവം നിർണയിക്കുന്ന ദിവസത്തിന്റെ പേരും സങ്കീർത്തന ഉദ്ധരണിയുടെ ഊന്നലും നിലനിർത്തുന്നു.
- source_word: ἐν Δαυὶδ λέγων
  choice: ദാവീദിലൂടെ അവൻ ഇങ്ങനെ പറയുന്നു
  rationale: ദാവീദിനെ വചനത്തിന്റെ മാനുഷിക മാധ്യമമായി അവതരിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം; ഗ്രീക്കിലെ ἐν എന്നതിന്റെ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: μετὰ τοσοῦτον χρόνον
  choice: വളരെക്കാലത്തിനുശേഷം
  rationale: മരുഭൂമിയിലെ തലമുറയ്ക്കുശേഷമുള്ള ദീർഘമായ കാലാന്തരത്തിന് നൽകിയ ഊന്നൽ സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: καθὼς προείρηται
  choice: മുമ്പ് പറഞ്ഞിരിക്കുന്നതുപോലെ
  rationale: മുമ്പ് ഉച്ചരിക്കപ്പെട്ട വാക്കിന് ഇപ്പോഴും പ്രസക്തിയുണ്ടെന്ന പൂർണകാല നിഷ്ക്രിയരൂപത്തിന്റെ ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε
  choice: നിങ്ങൾ അവന്റെ ശബ്ദം കേൾക്കുന്നെങ്കിൽ
  rationale: പ്രതികരണാത്മകമായ ശ്രവണത്തെ സൂചിപ്പിക്കുന്ന ബൈബിൾപ്രയോഗം നിലനിർത്തുന്നു; അതിനെ നേരിട്ട് ‘അനുസരിക്കുക’ എന്നു വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: μὴ σκληρύνητε τὰς καρδίας ὑμῶν
  choice: നിങ്ങളുടെ ഹൃദയങ്ങൾ കഠിനമാക്കരുത്
  rationale: മനസ്സിന്റെയും ഇച്ഛയുടെയും പിടിവാശിയെ സൂചിപ്പിക്കുന്ന മൂലരൂപകവും മുന്നറിയിപ്പിന്റെ ശക്തിയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദൈവത്തിന്റെ സ്വസ്ഥതയെക്കുറിച്ചുള്ള വാദത്തിൽ ‘ഇന്ന്’ എന്നതിന്റെ പ്രാബല്യം
  choice: പ്രതികരിക്കാനുള്ള ദൈവം നിശ്ചയിച്ച ഇപ്പോഴത്തെ അവസരമായി തുറന്ന നിലയിൽ അവതരിപ്പിക്കുന്നു.
  alternative: സങ്കീർത്തനക്കാരൻ സംസാരിച്ച ചരിത്രദിവസമായി മാത്രം, അല്ലെങ്കിൽ പൂർണമായും അന്ത്യകാലദിവസമായി മാത്രം പരിമിതപ്പെടുത്തുക.
  rationale: മരുഭൂമിക്കാലത്തിനു വളരെക്കാലത്തിനുശേഷവും ദൈവം പ്രതികരണത്തിനായി ‘ഇന്ന്’ എന്നു വിളിക്കുന്ന ദിവസം നിശ്ചയിക്കുന്നുവെന്ന വാദം വാക്യം മുന്നോട്ടുവയ്ക്കുന്നു; കാലത്തെക്കുറിച്ചുള്ള കൂടുതൽ വ്യവസ്ഥിതമായ ഒരു സിദ്ധാന്തം പരിഭാഷയിൽ ചേർക്കുന്നില്ല.
- issue: ἐν Δαυὶδ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: “ദാവീദിലൂടെ”
  alternative: “ദാവീദിൽ,” അതായത് ദാവീദുമായി ബന്ധപ്പെട്ട സങ്കീർത്തനത്തിൽ.
  rationale: ദൈവം ദാവീദിനെ മാധ്യമമാക്കി സംസാരിക്കുന്നു എന്ന അർഥം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; ഗ്രന്ഥസ്ഥാനം സൂചിപ്പിക്കുന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ഉദ്ധരണിയുടെ കാവ്യഘടന വരിവിരാമങ്ങളിലൂടെ പ്രകടമാക്കി; പരമ്പരാഗത ബൈബിൾരൂപകമായ ‘ഹൃദയങ്ങൾ കഠിനമാക്കുക’ നിലനിർത്തി.
