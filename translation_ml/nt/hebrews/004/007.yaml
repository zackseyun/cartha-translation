revisions:
- from: 'വീണ്ടും അവൻ “ഇന്ന്” എന്നൊരു നിശ്ചിത ദിവസം നിശ്ചയിക്കുന്നു. വളരെക്കാലത്തിനുശേഷം ദാവീദിലൂടെ[a] അവൻ ഇങ്ങനെ പറയുന്നു; മുമ്പ് പറഞ്ഞിരിക്കുന്നതുപോലെ:


    “ഇന്ന് നിങ്ങൾ അവന്റെ ശബ്ദം കേൾക്കുന്നെങ്കിൽ,

