  source_fidelity: 'അർഥം പൊതുവേ വിശ്വസ്തമാണ്: ദൈവം വീണ്ടും ‘ഇന്ന്’ എന്ന ദിവസം നിശ്ചയിക്കുന്നതും, ദാവീദിലൂടെ സങ്കീർത്തനവചനം ഉദ്ധരിക്കുന്നതും, മുന്നറിയിപ്പും സൂക്ഷിച്ചിട്ടുണ്ട്. എന്നാൽ ‘“ഇന്ന്” എന്നൊരു നിശ്ചിത ദിവസം’ എന്ന ക്രമം മലയാളത്തിൽ അല്പം അസ്വാഭാവികമാണ്; ഗ്രീക്കിലെ τινὰ ἡμέραν എന്ന ‘ഒരു നിർദിഷ്ട/നിശ്ചിത ദിവസം’ എന്ന ഘടകം കൂടുതൽ സ്വാഭാവികമായി പുനഃക്രമീകരിക്കാം.'
  naturalness: '‘വീണ്ടും അവൻ “ഇന്ന്” എന്നൊരു നിശ്ചിത ദിവസം നിശ്ചയിക്കുന്നു’ എന്നതിലെ ‘എന്നൊരു’ പ്രയോഗവും ‘നിശ്ചിത ദിവസം നിശ്ചയിക്കുന്നു’ എന്ന ചേർച്ചയും ഭാരമുള്ളതാണ്. ‘വീണ്ടും അവൻ ഒരു ദിവസം നിശ്ചയിക്കുന്നു: “ഇന്ന്”’ എന്ന രൂപം ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്; ‘വളരെക്കാലത്തിനുശേഷം’ എന്ന കാലവാചകവും ‘ദാവീദിലൂടെ പറഞ്ഞുകൊണ്ട്’ എന്നതോടു ചേർക്കുന്നത് വാക്യബന്ധം വ്യക്തമാക്കുന്നു.'
  terminology: ‘ദാവീദിലൂടെ,’ ‘ശബ്ദം കേൾക്കുക,’ ‘ഹൃദയങ്ങൾ കഠിനമാക്കരുത്’ എന്നിവ മൂലപാഠത്തിന്റെ ഭാഷാരീതിയും സ്ഥാപിതമായ വേദപുസ്തകഭാഷയും സംരക്ഷിക്കുന്നു. ἐν Δαυὶδ-ന്റെ പകരം വായന അടിക്കുറിപ്പിൽ യുക്തമായി നിലനിർത്തിയിരിക്കുന്നു.
