id: HEB.4.5
reference: Hebrews 4:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐν τούτῳ πάλιν· Εἰ εἰσελεύσονται εἰς τὴν κατάπαυσίν μου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/005.yaml
  text: 'And in this place again: ‘They shall certainly not enter my rest.’[a]'
translation:
  language: ml
  text: 'വീണ്ടും ഈ ഭാഗത്ത് ഇങ്ങനെ പറയുന്നു: “അവർ ഒരിക്കലും എന്റെ വിശ്രമത്തിൽ പ്രവേശിക്കുകയില്ല.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഗ്രീക്കിൽ അക്ഷരാർഥം: “അവർ എന്റെ വിശ്രമത്തിൽ പ്രവേശിക്കുമെങ്കിൽ”; ഇത് “അവർ ഒരിക്കലും എന്റെ വിശ്രമത്തിൽ പ്രവേശിക്കുകയില്ല” എന്നർഥമുള്ള ഒരു ശപഥപ്രയോഗമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: മറ്റൊരിടത്ത്
  rationale: ഇവിടെ ἐν τούτῳ മറ്റൊരു തിരുവെഴുത്തുഭാഗത്തിലെ ഉദ്ധരണിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘മറ്റൊരിടത്ത്’ എന്നത് ഉദ്ധരണികളുടെ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: തിരുവെഴുത്തിൽനിന്നുള്ള മറ്റൊരു ഉദ്ധരണിയിലേക്കോ അതേ സാക്ഷ്യത്തിന്റെ ആവർത്തനത്തിലേക്കോ മാറുന്നതിനെ സംക്ഷിപ്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: Εἰ εἰσελεύσονται
  choice: അവർ ഒരിക്കലും ... പ്രവേശിക്കുകയില്ല
  rationale: εἰ + ഭാവികാല ക്രിയ ഇവിടെ എബ്രായ ശപഥശൈലിയെ പ്രതിഫലിപ്പിക്കുന്ന ശക്തമായ നിഷേധമാണ്. അതിന്റെ വാച്യരൂപമായ ‘അവർ പ്രവേശിക്കുമെങ്കിൽ’ എന്നതിനു പകരം ഉദ്ദേശ്യബലം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: κατάπαυσίν
  choice: വിശ്രമം
  rationale: എബ്രായർ 3–4 അധ്യായങ്ങളിലെ പ്രധാന പദബന്ധം നിലനിർത്തുകയും ദൈവത്തിന്റെ വിശ്രമം എന്ന ആശയം സ്വാഭാവികമായി അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: μου
  choice: എന്റെ
  rationale: സങ്കീർത്തന ഉദ്ധരണിയിലെ ദൈവിക പ്രഥമപുരുഷ ഉടമസ്ഥത നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: ശപഥസദൃശമായ Εἰ εἰσελεύσονται എന്ന പ്രയോഗത്തിന്റെ പരിഭാഷ
  choice: അവർ ഒരിക്കലും എന്റെ വിശ്രമത്തിൽ പ്രവേശിക്കുകയില്ല
  alternative: അവർ എന്റെ വിശ്രമത്തിൽ പ്രവേശിക്കുമെങ്കിൽ
  rationale: ഗ്രീക്കിൽ രൂപം വ്യവസ്ഥാവാക്യമാണെങ്കിലും, ഉദ്ധരിച്ചിരിക്കുന്ന സെമിറ്റിക് ശപഥശൈലിയിൽ അത് ഊന്നിയ നിഷേധമായി പ്രവർത്തിക്കുന്നു. ‘ഒരിക്കലും ... ഇല്ല’ എന്ന പരിഭാഷ അധിക സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കാതെ ആ പ്രയോഗത്തിന്റെ അർഥബലം പകരുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. തിരുവെഴുത്ത് ഉദ്ധരണിയിലേക്കുള്ള മാറിവരവ് വ്യക്തമാക്കാൻ ‘വീണ്ടും മറ്റൊരിടത്ത്’ ഉപയോഗിച്ചു; പ്രധാന ദൈവശാസ്ത്രപദമായ ‘വിശ്രമം’ നിലനിർത്തി.
