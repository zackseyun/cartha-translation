id: HEB.4.3
reference: Hebrews 4:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰσερχόμεθα γὰρ ⸀εἰς κατάπαυσιν οἱ πιστεύσαντες, καθὼς εἴρηκεν· Ὡς ὤμοσα ἐν τῇ ὀργῇ μου, Εἰ εἰσελεύσονται εἰς τὴν κατάπαυσίν μου, καίτοι τῶν ἔργων ἀπὸ καταβολῆς κόσμου γενηθέντων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/003.yaml
  text: For we who have believed enter the rest[a], just as he has said, “As I swore in my wrath[b], ‘If they shall enter my rest,’” although his works were finished from the foundation of the world.
translation:
  language: ml
  text: 'ലോകം സ്ഥാപിക്കപ്പെട്ടതുമുതൽ അവിടുത്തെ പ്രവൃത്തികൾ പൂർത്തിയായിരുന്നിട്ടും,[b] വിശ്വസിച്ചവരായ നാം ആ വിശ്രമത്തിലേക്ക് പ്രവേശിക്കുന്നു; അവിടുന്ന് അരുളിച്ചെയ്തിരിക്കുന്നതുപോലെ: “എന്റെ ക്രോധത്തിൽ ഞാൻ സത്യം ചെയ്തു: ‘അവർ ഒരിക്കലും എന്റെ വിശ്രമത്തിൽ പ്രവേശിക്കുകയില്ല.’”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഗ്രീക്കിൽ അക്ഷരാർഥം: “അവർ എന്റെ വിശ്രമത്തിൽ പ്രവേശിക്കുമെങ്കിൽ—.” ഇത് ഒരു സത്യപ്രതിജ്ഞാരീതിയാണ്; ഇവിടെ അതിന്റെ അർഥം “അവർ തീർച്ചയായും എന്റെ വിശ്രമത്തിൽ പ്രവേശിക്കുകയില്ല” അഥവാ “ഒരിക്കലും പ്രവേശിക്കുകയില്ല” എന്നാണ്.'
    reason: alternative_reading
  - marker: b
    text: 'അല്ലെങ്കിൽ: “ലോകം സ്ഥാപിക്കപ്പെട്ടതുമുതൽ അവിടുത്തെ പ്രവൃത്തികൾ നിർവഹിക്കപ്പെട്ടിരുന്നു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσερχόμεθα
  choice: പ്രവേശിക്കുന്നു
  rationale: വർത്തമാനകാല ക്രിയയുടെ ഇപ്പോഴുള്ളതും പൊതുവായതുമായ പ്രാബല്യം നിലനിർത്തുന്നു; ഭാവിയിലെ പൂർത്തീകരണത്തിലേക്ക് മാത്രം അർത്ഥം ചുരുക്കുന്നില്ല.
- source_word: κατάπαυσιν
  choice: ആ വിശ്രമത്തിൽ
  rationale: മുൻസന്ദർഭത്തിൽ ചർച്ചചെയ്യുന്ന ദൈവിക വിശ്രമത്തെ നിർദ്ദിഷ്ടമായി സൂചിപ്പിക്കുന്നു.
- source_word: οἱ πιστεύσαντες
  choice: വിശ്വസിച്ചവരായ നാം
  rationale: ഭൂതകാലകൃത്യത്തിന്റെ ഭാവം നിലനിർത്തിക്കൊണ്ട് ഒന്നാംപുരുഷ ബഹുവചനത്തിലുള്ള എഴുത്തുകാരന്റെ സ്വയം ഉൾപ്പെടുത്തൽ വ്യക്തമാക്കുന്നു.
- source_word: καθὼς εἴρηκεν
  choice: അവിടുന്ന് അരുളിച്ചെയ്തിരിക്കുന്നതുപോലെ
  rationale: പറഞ്ഞ വചനത്തിന്റെ നിലനിൽക്കുന്ന പ്രാബല്യം ഗ്രീക്ക് പൂർണ്ണകാലത്തിന് അനുസൃതമായി പ്രകടമാക്കുന്നു; ദൈവത്തെ സൂചിപ്പിക്കാൻ ആദരസൂചകമായ സ്വാഭാവിക മലയാളം ഉപയോഗിക്കുന്നു.
- source_word: Ὡς ὤμοσα ἐν τῇ ὀργῇ μου
  choice: എന്റെ ക്രോധത്തിൽ ഞാൻ സത്യം ചെയ്തതുപോലെ
  rationale: ὀργήയുടെ ഗൗരവമുള്ള ന്യായവിധിസ്വരം ‘ക്രോധം’ നിലനിർത്തുന്നു.
- source_word: Εἰ εἰσελεύσονται εἰς τὴν κατάπαυσίν μου
  choice: അവർ എന്റെ വിശ്രമത്തിൽ പ്രവേശിക്കുമെങ്കിൽ—
  rationale: ഗ്രീക്കിലെ ഉപാധിവാക്യരൂപമുള്ള സത്യപ്രതിജ്ഞാസൂത്രം മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു; അതിന്റെ ശക്തമായ നിഷേധാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: καίτοι
  choice: പൂർത്തിയായിരുന്നിട്ടും
  rationale: വാക്യത്തിലെ concessive ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τῶν ἔργων ... γενηθέντων
  choice: അവിടുത്തെ പ്രവൃത്തികൾ പൂർത്തിയായിരുന്നിട്ടും
  rationale: ജനിതക സ്വതന്ത്രപ്രയോഗത്തിന്റെ മുൻപേ പൂർത്തിയായ അവസ്ഥ വ്യക്തമാക്കുന്നു; പ്രവൃത്തികൾ ദൈവത്തിന്റേതാണെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നതിനാൽ ആദരസൂചക സർവനാമം ചേർക്കുന്നു.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: ലോകസ്ഥാപനംമുതൽ
  rationale: ലോകത്തിന്റെ സ്ഥാപനം/സൃഷ്ടി എന്ന പരമ്പരാഗത ആശയം സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: സങ്കീർത്തനം 95-ലെ സത്യപ്രതിജ്ഞാവാക്യത്തിന്റെ ശക്തി
  choice: ‘അവർ എന്റെ വിശ്രമത്തിൽ പ്രവേശിക്കുമെങ്കിൽ—’ എന്ന ഗ്രീക്ക് ഉപാധിരൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തി, അതിന്റെ നിഷേധാർഥം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
  alternative: ‘അവർ ഒരിക്കലും എന്റെ വിശ്രമത്തിൽ പ്രവേശിക്കുകയില്ല’ എന്ന് അർത്ഥാനുസൃതമായി നേരിട്ട് പരിഭാഷപ്പെടുത്തുക.
  rationale: മൂലപാഠത്തിന്റെ യഥാർഥ രൂപവും അതിലുള്ള സെമിറ്റിക് സത്യപ്രതിജ്ഞാരീതിയും മറച്ചുവയ്ക്കാതെ സംരക്ഷിക്കുന്നു; അതേസമയം സാധാരണ വായനക്കാരനെ തെറ്റിദ്ധരിപ്പിക്കാതിരിക്കാൻ ഉദ്ദേശിച്ച അർത്ഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: വിശ്വാസികൾ വിശ്രമത്തിൽ പ്രവേശിക്കുന്നതിന്റെ കാലഭാവം
  choice: വർത്തമാനകാലമായ ‘പ്രവേശിക്കുന്നു’ ഉപയോഗിച്ചു.
  alternative: ‘പ്രവേശിക്കും’ അല്ലെങ്കിൽ ‘പ്രവേശിച്ചുകൊണ്ടിരിക്കുന്നു’.
  rationale: ഗ്രീക്ക് വർത്തമാനകാലം നൽകുന്ന ഇപ്പോൾ/പൊതുസത്യം എന്ന ഭാവം നിലനിർത്തുകയും ഭാവിയിലെ സമാപ്തിയെ നിഷേധിക്കാതെ വാക്യത്തിലെ ഇതിനകം–ഇനിയും എന്ന ദൈവശാസ്ത്രപരമായ സംഘർഷം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ തിരുവെഴുത്തുശൈലി. ദൈവത്തെ സൂചിപ്പിക്കാൻ ‘അവിടുന്ന്/അവിടുത്തെ’ എന്ന ആദരസൂചക രൂപങ്ങൾ ഉപയോഗിച്ചു. സത്യപ്രതിജ്ഞാസൂത്രത്തിന്റെ അപൂർണ്ണമായി തോന്നുന്ന ഉപാധിരൂപം ഉദ്ദേശപൂർവം ഡാഷോടെ സംരക്ഷിക്കുകയും അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുകയും ചെയ്തു.
