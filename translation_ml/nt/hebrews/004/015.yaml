id: HEB.4.15
reference: Hebrews 4:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐ γὰρ ἔχομεν ἀρχιερέα μὴ δυνάμενον συμπαθῆσαι ταῖς ἀσθενείαις ἡμῶν, ⸀πεπειρασμένον δὲ κατὰ πάντα καθ’ ὁμοιότητα χωρὶς ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/015.yaml
  text: For we do not have a high priest unable to sympathize with our weaknesses, but one who has been tested in every way according to likeness, yet without sin.
translation:
  language: ml
  text: നമ്മുടെ ബലഹീനതകളോടു സഹതപിക്കാൻ കഴിയാത്ത ഒരു മഹാപുരോഹിതനല്ല നമുക്കുള്ളത്; മറിച്ച്, സകലവിധത്തിലും നമ്മെപ്പോലെ[b] പരീക്ഷിക്കപ്പെട്ടിട്ടും[a] പാപം കൂടാതെ ഇരുന്ന ഒരു മഹാപുരോഹിതനെയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സകലവിധത്തിലും പ്രലോഭിപ്പിക്കപ്പെട്ടിട്ടും.”
    reason: πειράζω എന്ന ക്രിയയ്ക്ക് ‘പരീക്ഷിക്കുക’ എന്നും ‘പ്രലോഭിപ്പിക്കുക’ എന്നും അർഥമാകാം.
  - marker: b
    text: “നമ്മെപ്പോലെ” എന്നതിന് മൂലപാഠത്തിൽ പദശഃ “സാദൃശ്യപ്രകാരം” എന്നാണ്.
    reason: καθ’ ὁμοιότητα എന്ന പ്രയോഗത്തിന്റെ പദശഃ രൂപവും അതിലെ സംക്ഷിപ്തതയും സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: ἀρχιερέα
  choice: മഹാപുരോഹിതൻ
  rationale: എബ്രായലേഖനത്തിലെ യേശുവിന്റെ പുരോഹിതമധ്യസ്ഥതയെ സൂചിപ്പിക്കുന്ന കേന്ദ്രപദവിക്ക് കൃത്യവും പരിചിതവുമായ മലയാളപദം.
- source_word: μὴ δυνάμενον συμπαθῆσαι
  choice: നമ്മോടൊപ്പം സഹതപിക്കാൻ കഴിയാത്ത
  rationale: οὐ ... μὴ എന്ന നിഷേധഘടനയിലെ വ്യതിരിക്തമായ ഊന്നൽ നിലനിർത്തുന്നു. συμπαθέω വെറും അനുകമ്പയല്ല, മറ്റൊരാളുടെ ദൗർബല്യത്തിൽ പങ്കുചേർന്ന് സഹാനുഭവിക്കുക എന്ന ആശയവും വഹിക്കുന്നു.
- source_word: ταῖς ἀσθενείαις ἡμῶν
  choice: നമ്മുടെ ബലഹീനതകളിൽ
  rationale: ശാരീരിക രോഗത്തിൽ മാത്രം ഒതുങ്ങാതെ മനുഷ്യന്റെ ദൗർബല്യവും പരിമിതിയും സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ പ്രയോഗം.
- source_word: πεπειρασμένον
  choice: പരീക്ഷിക്കപ്പെട്ടിട്ടും
  rationale: πειράζω എന്നതിന് പരീക്ഷിക്കുക, പ്രലോഭിപ്പിക്കുക എന്നീ അർഥങ്ങളുണ്ട്. പ്രധാനപാഠത്തിൽ ‘പരീക്ഷിക്കപ്പെട്ട’ എന്നത് യഥാർഥമായ ശോധനയെ വ്യക്തമാക്കുകയും മറ്റർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: κατὰ πάντα
  choice: സകലവിധത്തിലും
  rationale: പരീക്ഷണത്തിന്റെ സമഗ്രത വ്യക്തമാക്കുന്ന സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളപ്രയോഗം.
- source_word: καθ’ ὁμοιότητα
  choice: നമ്മെപ്പോലെ
  rationale: ഗ്രീക്കിലെ ‘സാദൃശ്യപ്രകാരം’ എന്ന സംക്ഷിപ്തപ്രയോഗത്തിൽ സന്ദർഭം സൂചിപ്പിക്കുന്ന താരതമ്യം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; പദശഃ രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: χωρὶς ἁμαρτίας
  choice: പാപമില്ലാത്തവൻ
  rationale: പരീക്ഷിക്കപ്പെട്ടതിലെ സാദൃശ്യത്തിനിടയിലും പാപം നിർണായകമായ ഒഴിവാണെന്ന വാക്യത്തിന്റെ ഊന്നൽ വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ക്രിസ്തുവിന്റെ പാപരാഹിത്യവുമായി ബന്ധപ്പെട്ട πεπειρασμένον എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: പരീക്ഷിക്കപ്പെട്ടിട്ടും
  alternative: എല്ലാവിധത്തിലും പ്രലോഭിപ്പിക്കപ്പെട്ടിട്ടും
  rationale: യഥാർഥമായ പരീക്ഷണാനുഭവവും പാപരാഹിത്യവും ഒരുമിച്ച് നിലനിർത്തുന്നു. ‘പ്രലോഭിപ്പിക്കപ്പെട്ട’ എന്ന സാധുവായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു; അതിലൂടെ മൂലപാഠത്തിലെ അർഥവ്യാപ്തി മായ്ച്ചുകളയുന്നില്ല.
- issue: καθ’ ὁμοιότητα സൂചിപ്പിക്കുന്ന താരതമ്യം എത്രമാത്രം വ്യക്തമാക്കണം
  choice: നമ്മെപ്പോലെ
  alternative: സാദൃശ്യപ്രകാരം
  rationale: സന്ദർഭത്തിൽ സൂചിതമായ താരതമ്യം സാധാരണ വായനക്കാരന് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; എന്നാൽ ഗ്രീക്കിലെ സംക്ഷിപ്തവും ഏതാണ്ട് തുറന്നതുമായ രൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ നിഷേധാത്മക വ്യതിരിക്തഘടന നിലനിർത്തിയിരിക്കുന്നു. പ്രധാനവാചകത്തിലെ ‘നമ്മെപ്പോലെ’ വായനാസൗകര്യം നൽകുമ്പോൾ പദശഃ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും പ്രധാനപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
