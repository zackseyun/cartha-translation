id: HEB.4.11
reference: Hebrews 4:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: σπουδάσωμεν οὖν εἰσελθεῖν εἰς ἐκείνην τὴν κατάπαυσιν, ἵνα μὴ ἐν τῷ αὐτῷ τις ὑποδείγματι πέσῃ τῆς ἀπειθείας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/011.yaml
  text: Therefore[a], let us make every effort to enter that rest, so that no one may fall by the same pattern of disobedience.
translation:
  language: ml
  text: അതുകൊണ്ട്, ആരും അനുസരണക്കേടിന്റെ അതേ മാതൃകയിൽ വീഴാതിരിക്കേണ്ടതിന് ആ വിശ്രമത്തിൽ പ്രവേശിക്കാൻ നമുക്ക് പരമാവധി ശ്രമിക്കാം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπουδάσωμεν
  choice: നമുക്ക് സർവശ്രമവും ചെയ്യാം
  rationale: ഹോർട്ടേറ്ററി സബ്ജങ്ക്റ്റീവ് കൂട്ടായ ആഹ്വാനം നൽകുന്നു; ക്രിയയുടെ ഉത്സാഹം, ജാഗ്രത, കഠിനശ്രമം എന്നീ ഭാവങ്ങൾ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘സർവശ്രമവും ചെയ്യാം’ എന്നു പകർന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: ദൈവത്തിന്റെ വിശ്രമത്തെയും മരുഭൂമിതലമുറയുടെ പരാജയത്തെയും കുറിച്ചുള്ള മുൻവാദത്തിൽനിന്നുള്ള നിഗമനബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: εἰσελθεῖν
  choice: പ്രവേശിക്കാൻ
  rationale: σπουδάσωμεν എന്ന ക്രിയയോടു ചേർന്ന പൂരകമായ എയോറിസ്റ്റ് ഇൻഫിനിറ്റീവിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: ἐκείνην τὴν κατάπαυσιν
  choice: ആ വിശ്രമത്തിൽ
  rationale: മുൻസന്ദർഭത്തിൽ വിശദീകരിച്ച ദൈവിക വിശ്രമത്തിലേക്കു ചൂണ്ടുന്ന നിർദേശകത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു; വിശ്രമത്തിന്റെ സ്വഭാവം അനാവശ്യമായി നിർവചിക്കുന്നില്ല.
- source_word: ἵνα μὴ
  choice: ആരും ... വീണുപോകാതിരിക്കേണ്ടതിന്
  rationale: നിഷേധാത്മക ഉദ്ദേശ്യത്തെയും ഗൗരവമുള്ള മുന്നറിയിപ്പിനെയും മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐν τῷ αὐτῷ ... ὑποδείγματι
  choice: അതേ മാതൃകയിൽ
  rationale: ὑπόδειγμα ഇവിടെ മരുഭൂമിതലമുറ നൽകിയ ആവർത്തിക്കരുതാത്ത മാതൃകയെയോ മുന്നറിയിപ്പുദാഹരണത്തെയോ സൂചിപ്പിക്കുന്നു; ἐν എന്നതിന്റെ മേഖലാഭാവം ‘മാതൃകയിൽ’ എന്നു നിലനിർത്തി.
- source_word: πέσῃ
  choice: വീണുപോകാതിരിക്കുക
  rationale: ἵνα μή-യോടു ചേർന്ന എയോറിസ്റ്റ് സബ്ജങ്ക്റ്റീവിന്റെ മുന്നറിയിപ്പുഭാവം നേരിട്ട് പകർന്നു.
- source_word: τῆς ἀπειθείας
  choice: അനുസരണക്കേടിന്റെ
  rationale: ἀπείθεια എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘അനുസരണക്കേട്’ ആണ്. എബ്രായർ ലേഖനത്തിലെ സന്ദർഭത്തിൽ ഇത് അവിശ്വാസത്തോടു അടുത്തു ബന്ധപ്പെട്ടിട്ടുണ്ടെങ്കിലും ആ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ അടിച്ചേൽപ്പിച്ചിട്ടില്ല.
theological_decisions:
- issue: മരുഭൂമിതലമുറയുടെ പരാജയവുമായി ἀπείθεια എന്ന പദത്തിനുള്ള ബന്ധം
  choice: മുഖ്യപാഠത്തിൽ ‘അനുസരണക്കേട്’ എന്നു പരിഭാഷപ്പെടുത്തി, ‘അവിശ്വാസം’ എന്ന സന്ദർഭസാധ്യമായ അർഥം അടിക്കുറിപ്പിൽ നൽകി.
  alternative: അവിശ്വാസം
  rationale: സങ്കീർത്തനം 95-ന്റെ വ്യാഖ്യാനത്തിൽ എബ്രായർ ലേഖനം അവിശ്വാസത്തെയും അനുസരണക്കേടിനെയും അടുത്തു ബന്ധിപ്പിക്കുന്നു. എങ്കിലും ἀπείθεια എന്ന പദത്തിന്റെ കൂടുതൽ നേരിട്ടുള്ള അർഥം ‘അനുസരണക്കേട്’ ആയതിനാൽ, രണ്ടിനുമിടയിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം ഇല്ലാതാക്കാതെ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രബോധനശൈലി സ്വീകരിച്ചു. ‘ആ വിശ്രമം’ എന്ന സന്ദർഭബന്ധിത പ്രയോഗവും കൂട്ടായ ആഹ്വാനമായ ‘നമുക്ക് ... ചെയ്യാം’ എന്ന രൂപവും നിലനിർത്തി; സഭാവിഭാഗപരമായ പ്രത്യേക വ്യാഖ്യാനങ്ങൾ ഒഴിവാക്കി.
