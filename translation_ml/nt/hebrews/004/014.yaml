id: HEB.4.14
reference: Hebrews 4:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἔχοντες οὖν ἀρχιερέα μέγαν διεληλυθότα τοὺς οὐρανούς, Ἰησοῦν τὸν υἱὸν τοῦ θεοῦ, κρατῶμεν τῆς ὁμολογίας·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/014.yaml
  text: Therefore[a], since we have a great high priest who has passed through the heavens—Jesus the Son of God—let us hold fast to our confession.
translation:
  language: ml
  text: അതിനാൽ, സ്വർഗ്ഗങ്ങളിലൂടെ കടന്നുപോയ ദൈവപുത്രനായ യേശു എന്ന മഹാനായ മഹാപുരോഹിതൻ നമുക്കുള്ളതിനാൽ, നമ്മുടെ ഏറ്റുപറച്ചിൽ മുറുകെപ്പിടിക്കാം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നമ്മുടെ വിശ്വാസപ്രഖ്യാപനം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔχοντες οὖν
  choice: അതിനാൽ ... നമുക്കുള്ളതിനാൽ
  rationale: οὖν മുൻവാദത്തിൽനിന്നുള്ള നിഗമനത്തെയും ἔχοντες തുടർന്നുള്ള ആഹ്വാനത്തിന്റെ അടിസ്ഥാനത്തെയും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ രണ്ടിന്റെയും വ്യത്യസ്ത വ്യാകരണപങ്കുകൾ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἀρχιερέα μέγαν
  choice: മഹാപുരോഹിതൻ
  rationale: യേശുവിന്റെ ശ്രേഷ്ഠമായ പുരോഹിതപദവിയെ ഗൗരവത്തോടെയും മലയാളത്തിലെ പരിചിതമായ ബൈബിൾ പദാവലിയോടെയും പ്രകടിപ്പിക്കുന്നു.
- source_word: διεληλυθότα τοὺς οὐρανούς
  choice: ആകാശമണ്ഡലങ്ങളിലൂടെ കടന്നുപോയ
  rationale: പൂർണകാല കൃദന്തരൂപത്തിലെ പൂർത്തിയായ പ്രവൃത്തിയും ഗ്രീക്കിലെ ബഹുവചനമായ οὐρανούς-ഉം നിലനിർത്തുന്നു; ‘കടന്നുപോയ’ എന്നത് διέρχομαι എന്നതിന്റെ സഞ്ചാരചിത്രം സംരക്ഷിക്കുന്നു.
- source_word: Ἰησοῦν τὸν υἱὸν τοῦ θεοῦ
  choice: ദൈവപുത്രനായ യേശു
  rationale: വ്യക്തിനാമവും ക്രിസ്തുശാസ്ത്രപരമായ പദവിയും വ്യക്തമായി നിലനിർത്തി മലയാളത്തിൽ സ്വാഭാവികമായ അനുബന്ധഘടന ഉപയോഗിക്കുന്നു.
- source_word: κρατῶμεν
  choice: മുറുകെപ്പിടിക്കാം
  rationale: ആഹ്വാനാത്മകമായ ഒന്നാംപുരുഷ ബഹുവചനവും തുടർച്ചയായ ഉറച്ചുനിൽപ്പിന്റെ ഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: τῆς ὁμολογίας
  choice: നമ്മുടെ വിശ്വാസപ്രഖ്യാപനം
  rationale: ὁμολογία സമൂഹം അംഗീകരിക്കുകയും തുറന്നു പ്രഖ്യാപിക്കുകയും ചെയ്യുന്ന വിശ്വാസസാക്ഷ്യത്തെ സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിലെ നിർദ്ദിഷ്ടത മലയാളത്തിൽ സമൂഹബന്ധം വ്യക്തമാക്കുന്ന ‘നമ്മുടെ’ എന്നതിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: υἱὸς τοῦ θεοῦ എന്ന ക്രിസ്തുശാസ്ത്രപരമായ പദവി
  choice: ദൈവപുത്രൻ
  alternative: ദൈവത്തിന്റെ പുത്രൻ
  rationale: ‘ദൈവപുത്രൻ’ മലയാളത്തിൽ സ്ഥാപിതവും സ്വാഭാവികവുമായ ഔപചാരിക പദവിയാണ്; യേശുവിന്റെ തിരിച്ചറിയൽ ചുരുക്കുകയോ വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കുകയോ ചെയ്യുന്നില്ല.
- issue: τοὺς οὐρανούς എന്ന ബഹുവചന സ്വർഗീയചിത്രണം
  choice: ആകാശമണ്ഡലങ്ങൾ
  alternative: സ്വർഗം
  rationale: മൂലത്തിലെ ബഹുവചനം സംരക്ഷിക്കുകയും, വാക്യം പറയുന്നതിലധികം ക്രമീകരിച്ച ഒരു പ്രപഞ്ചശാസ്ത്രം ചുമത്താതെ പല സ്വർഗീയ മണ്ഡലങ്ങളിലൂടെയുള്ള കടന്നുപോകലിന്റെ ചിത്രം നിലനിർത്തുകയും ചെയ്യുന്നു.
- issue: ὁμολογίαയുടെ ഉള്ളടക്കം
  choice: വിശ്വാസപ്രഖ്യാപനം
  alternative: ഏറ്റുപറച്ചിൽ
  rationale: ഇവിടെ ഉദ്ദേശിക്കുന്നത് പാപസമ്മതമെന്ന ധാരണ ഒഴിവാക്കി, സമൂഹത്തിന്റെ പരസ്യമായ വിശ്വാസസ്വീകാരത്തെ സൂചിപ്പിക്കുന്നു; എന്നാൽ പ്രഖ്യാപനത്തിന്റെ വിശദമായ ഉള്ളടക്കം വാക്യത്തിലേക്ക് ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ദീർഘമായ ഗ്രീക്ക് വാക്യഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കി; നിഗമനം, അടിസ്ഥാനം, ആഹ്വാനം എന്നീ ബന്ധങ്ങൾ വ്യക്തമായി നിലനിർത്തി.
