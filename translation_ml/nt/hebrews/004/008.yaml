id: HEB.4.8
reference: Hebrews 4:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ γὰρ αὐτοὺς Ἰησοῦς κατέπαυσεν, οὐκ ἂν περὶ ἄλλης ἐλάλει μετὰ ταῦτα ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/008.yaml
  text: For if Joshua had given them rest[a], he would not have spoken later about another day.
translation:
  language: ml
  text: കാരണം, യോശുവ[a] അവർക്കു വിശ്രമം നൽകിയിരുന്നെങ്കിൽ, പിന്നീട് മറ്റൊരു ദിവസത്തെക്കുറിച്ച് അവൻ പറയുമായിരുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഗ്രീക്കിൽ: ‘യേശു.’ Ἰησοῦς എന്ന നാമരൂപം യേശുവിനെയോ യോശുവയെയോ സൂചിപ്പിക്കാം; ഇവിടെ സന്ദർഭം നൂന്റെ മകൻ യോശുവയെയാണ് വ്യക്തമായി സൂചിപ്പിക്കുന്നത്.'
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ ആശയത്തിന് വിശദീകരണം നൽകുന്ന γάρ എന്ന ബന്ധകത്തിന്റെ താർക്കികബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: Ἰησοῦς
  choice: യോശുവ
  rationale: ഗ്രീക്കിലെ ഈ നാമരൂപം യേശുവിനെയും യോശുവയെയും സൂചിപ്പിക്കാമെങ്കിലും, ഇവിടെ സന്ദർഭം കനാൻദേശപ്രവേശനവുമായി ബന്ധപ്പെട്ട നൂന്റെ മകൻ യോശുവയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: κατέπαυσεν
  choice: വിശ്രമം നൽകിയിരുന്നെങ്കിൽ
  rationale: καταπαύω എന്ന ക്രിയയുടെ ‘വിശ്രമിപ്പിക്കുക/വിശ്രമം നൽകുക’ എന്ന കാരണാർത്ഥം നിലനിർത്തുകയും, εἰ സഹിതമുള്ള യാഥാർഥ്യവിരുദ്ധ നിബന്ധന സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: οὐκ ἂν ... ἐλάλει
  choice: പറയുമായിരുന്നില്ല
  rationale: οὐκ ἄν എന്ന ഘടനയും ഭൂതകാല അപൂർണ്ണക്രിയയും ചേർന്ന് പ്രകടിപ്പിക്കുന്ന ഭൂതകാല യാഥാർഥ്യവിരുദ്ധ ഫലം മലയാളത്തിലെ സോപാധിക ക്രിയാരൂപത്തിൽ നൽകുന്നു.
- source_word: περὶ ἄλλης ... ἡμέρας
  choice: മറ്റൊരു ദിവസത്തെക്കുറിച്ച്
  rationale: വാഗ്ദത്തമായ വിശ്രമവുമായി ബന്ധപ്പെട്ട, പിന്നീടുള്ള വേറൊരു ദിവസത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗത്തിന്റെ അർത്ഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: μετὰ ταῦτα
  choice: പിന്നീട്
  rationale: യോശുവയുടെ കാലത്തിനു ശേഷമുള്ള സമയക്രമം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: എബ്രായർ 4:8-ലെ Ἰησοῦς എന്ന പേരിന്റെ സൂചിത വ്യക്തി
  choice: നൂന്റെ മകൻ യോശുവ
  alternative: യേശു
  rationale: സന്ദർഭം ഇസ്രായേൽ യോശുവയുടെ നേതൃത്വത്തിൽ ദേശത്തു പ്രവേശിച്ചതിനെയും അതിനുശേഷവും നിലനിന്ന വിശ്രമവാഗ്ദത്തത്തെയും കുറിച്ചാണ്. അതിനാൽ മുഖ്യപാഠത്തിൽ ‘യോശുവ’ എന്നു നൽകുന്നു; എന്നാൽ ഗ്രീക്കിൽ ‘യേശു’ക്കും ‘യോശുവ’ക്കും ഒരേ നാമരൂപമായതിനാൽ അത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: ἐλάλει എന്ന ക്രിയയുടെ വ്യക്തമാക്കാത്ത കർത്താവ്
  choice: അവൻ
  alternative: ദൈവം
  rationale: ഗ്രീക്ക് പാഠത്തിൽ കർത്താവിന്റെ പേര് ഈ വാക്യത്തിൽ തുറന്നുപറയുന്നില്ല. അതിനാൽ സന്ദർഭത്തിൽ നിന്ന് ‘ദൈവം’ എന്ന് ചേർത്ത് അവ്യക്തത നീക്കാതെ സർവനാമം ഉപയോഗിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ദൈവശാസ്ത്രപരമായ ‘വിശ്രമം’ എന്ന മുഖ്യപദം നിലനിർത്തി; മൂലത്തിൽ വ്യക്തമാക്കാത്ത ക്രിയാകർത്താവിനെ ‘അവൻ’ എന്ന സർവനാമത്തിലൂടെ അവ്യക്തമായിത്തന്നെ സൂക്ഷിച്ചു.
