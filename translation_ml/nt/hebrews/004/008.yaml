  terminology: ‘വിശ്രമം’ consistently preserves the key rest terminology in the argument of Hebrews 3–4. ‘യോശുവ’ correctly identifies Joshua son of Nun, while the footnote transparently notes the identical Greek name-form and its possible rendering as Jesus.
