id: HEB.4.6
reference: Hebrews 4:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐπεὶ οὖν ἀπολείπεται τινὰς εἰσελθεῖν εἰς αὐτήν, καὶ οἱ πρότερον εὐαγγελισθέντες οὐκ εἰσῆλθον δι’ ἀπείθειαν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/006.yaml
  text: Therefore[a], since it remains for some to enter it, and those who formerly had the good news proclaimed to them did not enter because of disobedience,
translation:
  language: ml
  text: അതിനാൽ, ചിലർ അതിൽ പ്രവേശിക്കാൻ ഇനിയും ശേഷിക്കുന്നതിനാലും, മുമ്പ് സുവാർത്ത അറിയിക്കപ്പെട്ടവർ അനുസരണക്കേടു നിമിത്തം പ്രവേശിക്കാതിരുന്നതിനാലും,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπεὶ οὖν
  choice: അതുകൊണ്ട്, ... ഇതിനാലും
  rationale: οὖν എന്നതിന്റെ നിഗമനസ്വഭാവം ‘അതുകൊണ്ട്’ എന്നും ἐπεί എന്നതിന്റെ കാരണസൂചകഭാവം ‘ഇതിനാലും’ എന്ന വാക്യഘടനയിലൂടെയും നിലനിർത്തുന്നു.
- source_word: ἀπολείπεται
  choice: ഇനിയും ശേഷിക്കുന്നു
  rationale: പ്രവേശനം ഇപ്പോഴും ശേഷിച്ചുനിൽക്കുന്നു എന്ന വർത്തമാനകാല തുടർച്ചയും ലഭ്യതയും പ്രകടമാക്കുന്നു.
- source_word: τινὰς
  choice: ചിലർ
  rationale: നിർദ്ദിഷ്ടരല്ലാത്ത ചില വ്യക്തികളെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു.
- source_word: εἰσελθεῖν εἰς αὐτήν
  choice: അതിൽ പ്രവേശിക്കാനുള്ളത്
  rationale: മുൻസന്ദർഭത്തിലെ ദൈവത്തിന്റെ വിശ്രമത്തെ ആവർത്തിച്ച് ചേർക്കാതെ αὐτήν എന്ന സർവനാമപരമായ പരാമർശം ‘അതിൽ’ എന്നു നിലനിർത്തുന്നു.
- source_word: οἱ πρότερον εὐαγγελισθέντες
  choice: മുമ്പ് സുവാർത്ത അറിയിക്കപ്പെട്ടവർ
  rationale: εὐαγγελισθέντες എന്ന കർമണിപ്രയോഗം സംരക്ഷിക്കുകയും സഭാപരമായ സാങ്കേതികപദം ഒഴിവാക്കി സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ഭാഷ ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: οὐκ εἰσῆλθον
  choice: പ്രവേശിക്കാതിരുന്നു
  rationale: ലളിതമായ ഭൂതകാല നിഷേധമായി ഗ്രീക്ക് വാക്യത്തിന്റെ നേരിട്ടുള്ള അർഥം നൽകുന്നു.
- source_word: δι’ ἀπείθειαν
  choice: അനുസരണക്കേടുനിമിത്തം
  rationale: ἀπείθεια എന്ന പദത്തിന്റെ മുഖ്യമായ ‘അനുസരിക്കാനുള്ള വിസമ്മതം/അനുസരണക്കേട്’ എന്ന അർഥം നിലനിർത്തുന്നു; വിശ്വാസമില്ലായ്മയുമായുള്ള അർഥബന്ധം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: വിശ്രമത്തെക്കുറിച്ചുള്ള മുന്നറിയിപ്പിൽ ἀπείθεια എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: അനുസരണക്കേടുനിമിത്തം
  alternative: വിശ്വാസമില്ലായ്മനിമിത്തം
  rationale: ഈ സന്ദർഭത്തിൽ ദൈവവചനത്തെ വിശ്വസിക്കാതിരിക്കുന്നതും അനുസരിക്കാതിരിക്കുന്നതും പരസ്പരം ബന്ധപ്പെട്ടിരിക്കുന്നു. എങ്കിലും പദത്തിന്റെ മുഖ്യമായ അനുസരണനിഷേധഭാവം മുഖ്യപാഠത്തിൽ സൂക്ഷിച്ച്, വിശ്വാസമില്ലായ്മ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നത് ദൈവശാസ്ത്രപരമായ സംഘർഷം ഒതുക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. വാക്യം അടുത്ത ഭാഗത്തേക്ക് തുടരുന്ന ഗ്രീക്ക് ഘടന അനുസരിച്ച് അവസാനത്തിൽ അൽപവിരാമം നിലനിർത്തിയിരിക്കുന്നു; മുൻസന്ദർഭത്തിലെ ‘വിശ്രമം’ ഇവിടെ വിശദീകരണമായി ചേർക്കാതെ ‘അതിൽ’ എന്ന സർവനാമം സൂക്ഷിച്ചിരിക്കുന്നു.
