id: HEB.4.4
reference: Hebrews 4:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἴρηκεν γάρ που περὶ τῆς ἑβδόμης οὕτως· Καὶ κατέπαυσεν ὁ θεὸς ἐν τῇ ἡμέρᾳ τῇ ἑβδόμῃ ἀπὸ πάντων τῶν ἔργων αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/004.yaml
  text: 'For he has spoken somewhere about the seventh day in this way: “And God rested on the seventh day from all his works,”[a][b]'
translation:
  language: ml
  text: 'എന്തെന്നാൽ, ഏഴാം ദിവസത്തെക്കുറിച്ച് ഒരിടത്ത്[a] അവിടുന്ന് ഇങ്ങനെ പറഞ്ഞിട്ടുണ്ട്: “ദൈവം ഏഴാം ദിവസം തന്റെ സകല പ്രവൃത്തികളിൽനിന്നും വിശ്രമിച്ചു.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “എവിടെയോ.” ഗ്രീക്കിൽ അക്ഷരാർഥം “എവിടെയോ” എന്നാണ്. ഇത് തിരുവെഴുത്തിലെ സ്ഥലം പ്രത്യേകം പറയാതെയുള്ള അവതരണമാണ്; അതിന്റെ ആധികാരികതയെക്കുറിച്ചുള്ള സംശയമല്ല.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “പ്രവൃത്തികൾ അവസാനിപ്പിച്ചു.” ഈ ക്രിയയ്ക്ക് പ്രവൃത്തി നിർത്തുക എന്നതിന് ഊന്നൽ നൽകാം. എന്നാൽ ഉല്പത്തി 2:2-നോടും എബ്രായർ 3–4-ലെ ദൈവത്തിന്റെ വിശ്രമത്തെക്കുറിച്ചുള്ള വാദത്തോടുമുള്ള ബന്ധം നിലനിർത്താൻ ഇവിടെ “വിശ്രമിച്ചു” എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴρηκεν
  choice: പറഞ്ഞിട്ടുണ്ട്
  rationale: ഗ്രീക്ക് പൂർണകാലം മുൻകാലത്ത് പറഞ്ഞ വചനം ഇപ്പോഴും പ്രാബല്യമുള്ളതാണെന്ന ഭാവം നൽകുന്നു; ലളിതമായ ഭൂതകാലത്തേക്കാൾ ‘പറഞ്ഞിട്ടുണ്ട്’ ആ ഭാവം സ്വാഭാവികമായി സൂക്ഷിക്കുന്നു.
- source_word: γάρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ വാദത്തിന് വിശദീകരണവും പിന്തുണയും നൽകുന്ന ബന്ധകമാണ്.
- source_word: που
  choice: ഒരിടത്ത്
  rationale: തിരുവെഴുത്തിലെ സ്ഥലം പ്രത്യേകം പേരെടുത്തുപറയാത്ത അവതരണരീതി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ഉദ്ധരണിയുടെ ആധികാരികതയെക്കുറിച്ചുള്ള അനിശ്ചിതത്വം ഇതിൽ സൂചിപ്പിക്കുന്നില്ല.
- source_word: περὶ τῆς ἑβδόμης
  choice: ഏഴാം ദിവസത്തെക്കുറിച്ച്
  rationale: സന്ദർഭത്തിൽ വിട്ടുപോയ ‘ദിവസം’ എന്ന നാമം വ്യക്തതയ്ക്കായി ചേർക്കുന്നു.
- source_word: οὕτως
  choice: ഇങ്ങനെ
  rationale: തുടർന്നുവരുന്ന ഉദ്ധരണിയുടെ വാക്കുകൾ പരിചയപ്പെടുത്തുന്ന സ്വാഭാവികവും കൃത്യവുമായ പ്രയോഗം.
- source_word: Καὶ
  choice: -ഉം ... ചെയ്തു
  rationale: ഉദ്ധരണിയുടെ ആരംഭത്തിലുള്ള ബന്ധകഭാവം മലയാളത്തിലെ ചേർക്കൽപ്രത്യയവും സഹായക്രിയയുംകൊണ്ട് പ്രതിനിധീകരിക്കുന്നു.
- source_word: κατέπαυσεν
  choice: വിശ്രമിച്ചു
  rationale: ഉല്പത്തി 2:2-ലെ ഉദ്ധരണിയുമായും എബ്രായർ 3–4 അധ്യായങ്ങളിലെ ‘വിശ്രമം’ എന്ന മുഖ്യ ആശയവുമായും ഉള്ള പദബന്ധം നിലനിർത്തുന്നു; പ്രവൃത്തി അവസാനിപ്പിച്ചു എന്ന അർഥഘടകവും സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: ὁ θεὸς
  choice: ദൈവം
  rationale: കർത്താവിനെ നേരിട്ട്, സ്വാഭാവിക മലയാളത്തിൽ പ്രതിനിധീകരിക്കുന്നു.
- source_word: ἐν τῇ ἡμέρᾳ τῇ ἑβδόμῃ
  choice: ഏഴാം ദിവസം
  rationale: ദിവസം സൂചിപ്പിക്കാനുള്ള സ്വാഭാവിക മലയാള പ്രയോഗം.
- source_word: ἀπὸ πάντων τῶν ἔργων αὐτοῦ
  choice: തന്റെ സകല പ്രവൃത്തികളിൽനിന്നും
  rationale: αὐτοῦ കർത്താവായ ദൈവത്തിലേക്കു തിരിച്ചുചൂണ്ടുന്നതിനാൽ ‘തന്റെ’ എന്നും, ബഹുവചനമായ ἔργων ‘പ്രവൃത്തികൾ’ എന്നും നൽകുന്നു; ἀπό സൂചിപ്പിക്കുന്ന വേർപാടോ വിരാമമോ ‘-ൽനിന്നും’ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദൈവത്തിന്റെ ശബ്ബത്ത്-വിരാമവും എബ്രായരിലെ ‘വിശ്രമം’ എന്ന ആശയവും തമ്മിലുള്ള ബന്ധം
  choice: വിശ്രമിച്ചു
  alternative: പ്രവൃത്തികൾ അവസാനിപ്പിച്ചു / വിരമിച്ചു
  rationale: ഈ വാക്യം ഉല്പത്തി 2:2 ഉദ്ധരിക്കുകയും ദൈവത്തിന്റെ വിശ്രമത്തെക്കുറിച്ചുള്ള എബ്രായർ 3–4-ലെ വാദത്തിൽ പങ്കുചേരുകയും ചെയ്യുന്നു. ‘വിശ്രമിച്ചു’ എന്നത് ദൈവം ക്ഷീണിച്ചു എന്ന വ്യാഖ്യാനം നിർബന്ധമാക്കാതെ ആ തിരുവെഴുത്തുബന്ധവും മുഖ്യപദത്തിന്റെ തുടർച്ചയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ തിരുവെഴുത്ത് ഉദ്ധരണിക്ക് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ‘അവിടുന്ന്’ എന്ന ആദരസൂചക സർവനാമം സന്ദർഭത്തിൽ ദൈവത്തെ സൂചിപ്പിക്കുന്നു. ഉദ്ധരണിയുടെ ആരംഭത്തിലുള്ള Καὶ പൂർണമായി നഷ്ടപ്പെടാതിരിക്കാൻ ‘വിശ്രമിക്കുകയും ചെയ്തു’ എന്ന മലയാള ഘടന ഉപയോഗിച്ചു.
