revisions:
- from: 'എന്തെന്നാൽ, ഏഴാം ദിവസത്തെക്കുറിച്ച് ഒരിടത്ത്[a] അവിടുന്ന് ഇങ്ങനെ പറഞ്ഞിട്ടുണ്ട്: “ദൈവം ഏഴാം ദിവസം തന്റെ സകല പ്രവൃത്തികളിൽനിന്നും വിശ്രമിക്കുകയും[b] ചെയ്തു.”'
  to: 'എന്തെന്നാൽ, ഏഴാം ദിവസത്തെക്കുറിച്ച് ഒരിടത്ത്[a] അവിടുന്ന് ഇങ്ങനെ പറഞ്ഞിട്ടുണ്ട്: “ദൈവം ഏഴാം ദിവസം തന്റെ സകല പ്രവൃത്തികളിൽനിന്നും വിശ്രമിച്ചു.”[b]'
