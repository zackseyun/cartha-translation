id: HEB.4.13
reference: Hebrews 4:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ οὐκ ἔστιν κτίσις ἀφανὴς ἐνώπιον αὐτοῦ, πάντα δὲ γυμνὰ καὶ τετραχηλισμένα τοῖς ὀφθαλμοῖς αὐτοῦ, πρὸς ὃν ἡμῖν ὁ λόγος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/013.yaml
  text: And no creature is hidden from his sight[a], but all things are naked and laid bare to his eyes[b], to whom we must give account.
translation:
  language: ml
  text: അവിടുത്തെ സന്നിധിയിൽ ഒരു സൃഷ്ടിയും മറഞ്ഞിരിക്കുന്നില്ല; എന്നാൽ സകലവും അവിടുത്തെ കണ്ണുകൾക്കു മുമ്പിൽ നഗ്നമായും പൂർണമായി അനാവൃതമായും ഇരിക്കുന്നു[b]. അവിടുത്തോടു നാം കണക്ക് കൊടുക്കേണ്ടവരാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘നമുക്കു ആരോടാണോ കാര്യമുള്ളത്’; ഗ്രീക്ക് വാക്യഭാഗം ‘നമ്മുടെ വാക്ക്/കാര്യം ആരിലേക്കാണോ’ എന്നും മനസ്സിലാക്കാം.'
    reason: alternative_reading
  - marker: b
    text: ‘പൂർണമായി അനാവൃതമായും’ എന്നു പരിഭാഷപ്പെടുത്തിയ പദം അപൂർവമായ ഒരു ഗ്രീക്ക് ക്രിയയിൽനിന്നുള്ളതാണ്. കഴുത്ത് തുറന്നുകാട്ടപ്പെടുന്നതോ പിന്നോട്ടു വളയ്ക്കപ്പെടുന്നതോ ആയ ചിത്രം അതിൽ ഉണ്ടായിരിക്കാം; ദൈവമുമ്പാകെയുള്ള സമ്പൂർണ വെളിപ്പെടലാണ് ഊന്നൽ.
    reason: lexical_alternative
lexical_decisions:
- source_word: κτίσις
  choice: സൃഷ്ടി
  rationale: ഏതൊരു സൃഷ്ടജീവിയെയോ സൃഷ്ടവസ്തുവെയോ പൊതുവായി സൂചിപ്പിക്കുന്ന ഏകവചനപ്രയോഗം; മലയാളത്തിൽ ‘ഒരു സൃഷ്ടിയും’ എന്നത് വിതരണാത്മകമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀφανὴς
  choice: മറഞ്ഞിരിക്കുന്ന
  rationale: അദൃശ്യമായ സ്വഭാവത്തെയല്ല, ദൈവിക പരിശോധനയിൽനിന്ന് ഒളിഞ്ഞിരിക്കാനാകാത്ത അവസ്ഥയെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
- source_word: ἐνώπιον αὐτοῦ
  choice: അവിടുത്തെ സന്നിധിയിൽ
  rationale: ‘അവിടുത്തെ മുമ്പിൽ’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്ന മാന്യവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗം; അടുത്ത വാക്യഭാഗത്തിലെ കണ്ണുകളുടെ പരാമർശം ദർശനത്തിന്റെ ആശയം വ്യക്തമാക്കുന്നു.
- source_word: πάντα
  choice: സകലവും
  rationale: നപുംസകലിംഗ ബഹുവചനത്തിന്റെ സമഗ്രവ്യാപ്തി ചുരുക്കമായും ഗൗരവത്തോടെയും പ്രകടമാക്കുന്നു.
- source_word: γυμνὰ
  choice: നഗ്നം
  rationale: സമ്പൂർണമായ അനാവൃതാവസ്ഥയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് രൂപകം അതിന്റെ തീവ്രതയോടെ നിലനിർത്തുന്നു.
- source_word: τετραχηλισμένα
  choice: പൂർണമായി തുറന്നുകിടക്കുന്നത്
  rationale: അപൂർവമായ ഈ ക്രിയാരൂപം കഴുത്ത് തുറന്നുകാട്ടപ്പെടുന്നതോ പിന്നോട്ടു വളയ്ക്കപ്പെടുന്നതോ ആയ ദൃശ്യസൂചന ഉൾക്കൊള്ളാം; വിവാദമായ ചിത്രം മുഖ്യവാക്യത്തിൽ നിർബന്ധിക്കാതെ സമ്പൂർണ വെളിപ്പെടലിന്റെ ഫലം വ്യക്തമാക്കുന്നു.
- source_word: τοῖς ὀφθαλμοῖς αὐτοῦ
  choice: അവിടുത്തെ കണ്ണുകൾക്കു മുമ്പിൽ
  rationale: ദൈവിക ദൃഷ്ടിയോടുള്ള ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: πρὸς ὃν ἡμῖν ὁ λόγος
  choice: അവിടുത്തോടാണ് നാം കണക്കു ബോധിപ്പിക്കേണ്ടത്
  rationale: ചുരുക്കവും പ്രയോഗസവിശേഷവുമായ ഗ്രീക്ക് വാക്യഭാഗത്തെ സന്ദർഭത്തിലെ ദൈവിക പരിശോധനയും ഉത്തരവാദിത്വവും അനുസരിച്ച് വ്യക്തമായി അവതരിപ്പിക്കുന്നു; കൂടുതൽ അക്ഷരാർഥസാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: πρὸς ὃν ἡμῖν ὁ λόγος എന്ന വാക്യഭാഗത്തിന്റെ വ്യാഖ്യാനം
  choice: മനുഷ്യർ ദൈവത്തോടു കണക്കു ബോധിപ്പിക്കേണ്ട ഉത്തരവാദിത്വം ഇതു പ്രകടിപ്പിക്കുന്നു.
  alternative: ‘നമുക്ക് ഇടപാടുള്ളവൻ’ അല്ലെങ്കിൽ ‘നമ്മുടെ വാക്ക്/കാര്യം ആരിലേക്കാണോ’
  rationale: എബ്രായർ 4:12–13-ലെ ദൈവത്തിന്റെ സർവവ്യാപകമായ അറിവും പരിശോധനയും ന്യായവിധിസ്വഭാവമുള്ള മുന്നറിയിപ്പും ‘കണക്കു ബോധിപ്പിക്കുക’ എന്ന അർഥത്തെ പിന്തുണയ്ക്കുന്നു. എങ്കിലും ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ചുരുക്കവും അർഥവ്യാപ്തിയും കാരണം മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും ഗൗരവമുള്ളതുമായ ശൈലി. ദൈവത്തെ സൂചിപ്പിക്കാൻ ‘അവിടുന്ന്/അവിടുത്തെ’ എന്ന ആദരസൂചക രൂപം ഉപയോഗിച്ചു. അപൂർവ ഗ്രീക്ക് രൂപകത്തിന്റെ വിവാദമായ പ്രത്യേക ചിത്രം മുഖ്യവാക്യത്തിൽ നിർബന്ധിക്കാതെ അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
