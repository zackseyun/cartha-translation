id: HEB.12.19
reference: Hebrews 12:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ σάλπιγγος ἤχῳ καὶ φωνῇ ῥημάτων, ἧς οἱ ἀκούσαντες παρῃτήσαντο ⸀μὴ προστεθῆναι αὐτοῖς λόγον·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/019.yaml
  text: and to the sound of a trumpet and to a voice of words[b][a], whose hearers begged that no further word be spoken to them.
translation:
  language: ml
  text: കാഹളത്തിന്റെ മുഴക്കത്തിനും വാക്കുകളുടെ ശബ്ദത്തിനും നിങ്ങൾ സമീപിച്ചിട്ടില്ല. ആ ശബ്ദം കേട്ടവർ, തങ്ങളോടു ഇനി ഒരു വാക്കും പറയപ്പെടരുതെന്ന് അപേക്ഷിച്ചു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അത് കേട്ടവർ, തങ്ങളോടു ഇനി ഒരു വാക്കും പറയപ്പെടരുതെന്ന് അപേക്ഷിച്ചു.” ഇവിടെ ബന്ധസർവനാമം ‘വാക്കുകളുടെ ശബ്ദത്തെ’ മാത്രമല്ല, സീനായിലെ മുഴുവൻ പ്രത്യക്ഷീകരണത്തെയും വിശാലമായി സൂചിപ്പിക്കുന്നതായി എടുക്കാം.
    reason: alternative_reading
  - marker: b
    text: ദൈവത്തിന്റെ ശബ്ദം ഇനി നേരിട്ട് കേൾക്കാതിരിക്കണമെന്ന ഇസ്രായേല്യരുടെ അപേക്ഷയ്ക്ക് പുറപ്പാട് 20:18–19; ആവർത്തനം 5:23–27 കാണുക.
    reason: cross_reference
lexical_decisions:
- source_word: σάλπιγγος ἤχῳ
  choice: കാഹളത്തിന്റെ മുഴക്കം
  rationale: ἦχος എന്ന പദത്തിന്റെ ‘ശബ്ദം/മുഴക്കം’ എന്ന അർഥവും സീനായിലെ ശക്തമായ ശ്രാവ്യപ്രതീതിയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: φωνῇ ῥημάτων
  choice: വാക്കുകൾ ഉച്ചരിച്ച ശബ്ദം
  rationale: വെറും ശബ്ദമല്ല, വ്യക്തമായി ഉച്ചരിക്കപ്പെട്ട വാക്കുകളുള്ള സ്വരമാണെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ഗ്രീക്കിലെ അസാധാരണമായ പ്രയോഗം അനാവശ്യമായി വ്യാഖ്യാനിച്ചുതീർക്കുന്നില്ല.
- source_word: ἧς
  choice: ആ ശബ്ദം
  rationale: സ്ത്രീലിംഗ ഏകവചനമായ ബന്ധസർവനാമത്തിന്റെ ഏറ്റവും അടുത്ത പൂർവപദമായ φωνῇയിലേക്കുള്ള സൂചന പ്രധാനവാചകത്തിൽ വ്യക്തമാക്കുന്നു; വിശാലമായ സൂചനയുടെ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: οἱ ἀκούσαντες
  choice: കേട്ടവർ
  rationale: സുബ്സ്റ്റാന്റീവൽ പങ്കാളിത്തരൂപത്തെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പ്രതിനിധീകരിക്കുന്നു.
- source_word: παρῃτήσαντο
  choice: അപേക്ഷിച്ചു
  rationale: തുടർന്നുള്ള നേരിട്ടുള്ള അഭിസംബോധനയിൽനിന്ന് ഒഴിവാക്കണമെന്ന തീവ്രമായ അഭ്യർഥനയാണ് സന്ദർഭത്തിൽ; ‘നിരസിച്ചു’ എന്നതിനെക്കാൾ ‘അപേക്ഷിച്ചു’ സീനായി വിവരണത്തോട് യോജിക്കുന്നു.
- source_word: μὴ προστεθῆναι αὐτοῖς λόγον
  choice: ഇനി ഒരു വാക്കും തങ്ങളോടു പറയരുതെന്ന്
  rationale: προστίθημι എന്നതിലെ ‘ഇനിയും കൂട്ടിച്ചേർക്കുക/തുടരുക’ എന്ന ആശയവും λόγος എന്നതിലെ ‘വാക്ക്’ എന്ന ഘടകവും വ്യക്തമായ ആധുനിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ἧς എന്ന ബന്ധസർവനാമത്തിന്റെ പൂർവപദം
  choice: പ്രധാനവാചകത്തിൽ ഇത് ഏറ്റവും അടുത്തുള്ള ‘ശബ്ദം’ (φωνῇ) എന്ന പദത്തെ സൂചിപ്പിക്കുന്നു.
  alternative: കാഹളമുഴക്കവും വാക്കുകളുടെ ശബ്ദവും ഉൾപ്പെടുന്ന സീനായിലെ മുഴുവൻ പ്രത്യക്ഷീകരണത്തെയും ഇത് വിശാലമായി സൂചിപ്പിക്കാം.
  rationale: സ്ത്രീലിംഗ ഏകവചനം φωνῇയുമായി നേരിട്ട് പൊരുത്തപ്പെടുന്നു. എങ്കിലും സന്ദർഭത്തിൽ ഇസ്രായേല്യർ ഭയപ്പെട്ടത് മുഴുവൻ സീനായി അനുഭവത്തെയുമാണ്; അതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. 12:18 മുതൽ തുടരുന്ന ‘നിങ്ങൾ വന്നിട്ടില്ല’ എന്ന വാക്യഘടന അർഥസമ്പൂർണതയ്ക്കായി ഈ വാക്യത്തിൽ ഉൾപ്പെടുത്തി. ‘കാഹളം’, ‘മുഴക്കം’, ‘വാക്ക്’, ‘അപേക്ഷിച്ചു’ എന്നിവ ബൈബിൾസന്ദർഭത്തിന്റെ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് അനാവശ്യമായ പുരാതനഭാഷ ഒഴിവാക്കുന്നു.
