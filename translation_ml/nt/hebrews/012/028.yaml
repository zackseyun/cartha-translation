id: HEB.12.28
reference: Hebrews 12:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διὸ βασιλείαν ἀσάλευτον παραλαμβάνοντες ἔχωμεν χάριν, δι’ ἧς ⸀λατρεύωμεν εὐαρέστως τῷ θεῷ μετὰ ⸂εὐλαβείας καὶ δέους⸃,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/028.yaml
  text: Therefore[a], since we are receiving an unshakable kingdom, let us have grace, through which we may serve God acceptably with reverence and awe,
translation:
  language: ml
  text: അതുകൊണ്ട്, ഇളക്കാനാവാത്ത ഒരു രാജ്യം സ്വീകരിച്ചുകൊണ്ടിരിക്കുന്ന നമുക്കു കൃപ ഉണ്ടായിരിക്കട്ടെ[a]. ആ കൃപയാൽ നാം ആദരവോടും ഭയഭക്തിയോടുംകൂടെ ദൈവത്തിനു പ്രസാദകരമായി സേവനം അർപ്പിക്കാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “നമുക്ക് നന്ദിയുള്ളവരായിരിക്കാം.” ἔχωμεν χάριν എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന് “നമുക്കു കൃപ ഉണ്ടായിരിക്കട്ടെ” എന്നും ഇടിയോമാറ്റിക് അർഥത്തിൽ “നമുക്ക് നന്ദിയുള്ളവരായിരിക്കാം” എന്നും അർഥമാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: അതുകൊണ്ട്
  rationale: മുമ്പുള്ള വാദത്തിൽനിന്നുള്ള നിഗമനം വ്യക്തമാക്കുന്ന സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: βασιλείαν ἀσάλευτον
  choice: ഇളക്കാനാവാത്ത ഒരു രാജ്യം
  rationale: മുമ്പത്തെ സന്ദർഭത്തിലെ ഇളക്കപ്പെടുന്ന സൃഷ്ടവസ്തുക്കളുമായുള്ള വൈരുധ്യം നിലനിർത്തുകയും ἀσάλευτον എന്നതിന്റെ അർഥം വ്യക്തമായി അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: παραλαμβάνοντες
  choice: സ്വീകരിച്ചുകൊണ്ടിരിക്കുന്ന
  rationale: വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ തുടരുന്ന അർഥവും തുടർന്നുള്ള ആഹ്വാനത്തിന്റെ സാഹചര്യവും സംരക്ഷിക്കുന്നു.
- source_word: ἔχωμεν χάριν
  choice: നമുക്കു കൃപ ഉണ്ടായിരിക്കട്ടെ
  rationale: χάρις എന്ന പദത്തിന്റെ ‘കൃപ’ എന്ന അടിസ്ഥാനാർഥവും തുടർന്നുള്ള δι’ ἧς സൂചിപ്പിക്കുന്ന ഉപകരണബന്ധവും നിലനിർത്തുന്നു; ‘നമുക്ക് നന്ദിയുള്ളവരായിരിക്കാം’ എന്ന സാദ്ധ്യമായ ഇടിയോമാറ്റിക് അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: δι’ ἧς
  choice: ആ കൃപയാൽ
  rationale: സ്ത്രീലിംഗ ആപേക്ഷിക സർവനാമം χάριν എന്നതിലേക്കു മടങ്ങുന്നതും διάയുടെ ഉപകരണാർഥവും മലയാളത്തിൽ വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: λατρεύωμεν
  choice: നാം ... സേവനം അർപ്പിക്കാം
  rationale: ദൈവത്തോടുള്ള ആരാധനാപരമായ സേവനം എന്ന ബൈബിൾപ്രയോഗം സൂചിപ്പിക്കുന്നു; വെറും ആന്തരിക ആരാധനയായി അർഥം ചുരുക്കുന്നില്ല.
- source_word: εὐαρέστως τῷ θεῷ
  choice: ദൈവത്തിനു പ്രസാദകരമായി
  rationale: സേവനം ദൈവത്തിനു സ്വീകാര്യവും പ്രസാദകരവുമായ രീതിയിലായിരിക്കണം എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: μετὰ εὐλαβείας καὶ δέους
  choice: ആദരവോടും ഭയഭക്തിയോടുംകൂടെ
  rationale: εὐλάβεια സൂചിപ്പിക്കുന്ന ഭക്തിപൂർവമായ ആദരവും δέος സൂചിപ്പിക്കുന്ന ദൈവസന്നിധിയിലെ ഭയമിശ്രിതമായ വിസ്മയവും വേർതിരിച്ചും സ്വാഭാവികമായും അറിയിക്കുന്നു.
theological_decisions:
- issue: ἔχωμεν χάριν എന്നതിലെ χάριν എന്ന പദത്തിന്റെ അർഥം
  choice: കൃപ
  alternative: നന്ദിയുള്ളവരായിരിക്കുക / നന്ദി പുലർത്തുക
  rationale: തുടർന്നുവരുന്ന δι’ ἧς എന്ന പ്രയോഗം χάριν എന്നതിനെ ദൈവത്തിനു പ്രസാദകരമായി സേവിക്കുന്നതിനുള്ള മാർഗമായ ‘കൃപ’ എന്നു ഗ്രഹിക്കാൻ വ്യാകരണപരമായി അനുകൂലമാണ്. എന്നാൽ ‘നന്ദി പുലർത്തുക’ എന്ന ഇടിയോമാറ്റിക് വായനയും പുരാതനവും സാദ്ധ്യവുമാകയാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന ഗൗരവമുള്ള ശൈലി. ‘സേവനം അർപ്പിക്കുക’ എന്നത് λατρεύωയുടെ ആരാധനാപരമായ ഭാവം നിലനിർത്തുന്നു. χάρις സംബന്ധിച്ച യഥാർഥ അർഥസന്ദിഗ്ധത മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചിട്ടുണ്ട്.
