- from: ശിക്ഷണത്തിനായി സഹിച്ചുനിൽക്കുക[a]. ദൈവം നിങ്ങളോടു പുത്രന്മാരോടെന്നപോലെ ഇടപെടുന്നു[b]. കാരണം, പിതാവ് ശിക്ഷണം നൽകാത്ത ഏതു പുത്രനാണുള്ളത്?
  to: ശിക്ഷണത്തിനായി സഹിച്ചുനിൽക്കുക[a]. ദൈവം നിങ്ങളോട് പുത്രന്മാരോടെന്നപോലെ പെരുമാറുന്നു[b]. കാരണം, ഒരു പിതാവ് ശിക്ഷണം നൽകാത്ത ഏത് പുത്രനാണുള്ളത്?
  rationale: The revision replaces a semantically broad verb with an idiomatic Malayalam expression that conveys God’s treatment of the readers in the father–son analogy. It also smooths the rhetorical question. The source ambiguity concerning εἰς παιδείαν remains in footnote a, and the explicit masculine imagery remains in both the text and explanatory footnote.
