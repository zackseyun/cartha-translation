id: HEB.12.7
reference: Hebrews 12:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰς παιδείαν ὑπομένετε· ὡς υἱοῖς ὑμῖν προσφέρεται ὁ θεός· τίς ⸀γὰρ υἱὸς ὃν οὐ παιδεύει πατήρ;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/007.yaml
  text: Endure for discipline[a]; God is dealing with you as with sons[b]. For what son is there whom a father does not discipline?
translation:
  language: ml
  text: ശിക്ഷണത്തിനായി സഹിച്ചുനിൽക്കുക[a]. ദൈവം നിങ്ങളോട് പുത്രന്മാരോടെന്നപോലെ പെരുമാറുന്നു[b]. കാരണം, ഒരു പിതാവ് ശിക്ഷണം നൽകാത്ത ഏത് പുത്രനാണുള്ളത്?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ഇത് ശിക്ഷണമായി കണ്ട് സഹിച്ചുനിൽക്കുക.’ ശിക്ഷണത്തിന്റെ ഉദ്ദേശ്യത്തോടെ സഹിക്കാനുള്ള ആഹ്വാനമായോ, സഹിക്കേണ്ടിവരുന്നതിനെ ശിക്ഷണമായി കണക്കാക്കാനുള്ള ആഹ്വാനമായോ ഗ്രീക്ക് വാചകം മനസ്സിലാക്കാം.
    reason: alternative_reading
  - marker: b
    text: ഗ്രീക്കിൽ ‘പുത്രന്മാർ.’ ഇവിടെ പിതാവ്–പുത്രൻ ഉപമയാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; എന്നാൽ ഇതിന്റെ പ്രയോഗം പുരുഷന്മാർക്കു മാത്രമായി പരിമിതപ്പെടുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς παιδείαν
  choice: ശിക്ഷണത്തിനായി
  rationale: εἰς എന്നതിന്റെ ഉദ്ദേശ്യ/ഫലസൂചന നിലനിർത്തുകയും παιδείαയുടെ തിരുത്തലും രൂപപ്പെടുത്തലും ഉൾപ്പെടുന്ന അർഥം ‘ശിക്ഷണം’ വഴി പ്രകടമാക്കുകയും ചെയ്യുന്നു. ‘ശിക്ഷണമായി’ എന്ന വായനയും വ്യാകരണപരമായി സാധ്യമാണ്; അത് അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: ὑπομένετε
  choice: സഹിച്ചുനിൽക്കുക
  rationale: രൂപം സൂചകമോ ആജ്ഞാർഥമോ ആയി ഗ്രഹിക്കാമെങ്കിലും സന്ദർഭത്തിൽ പ്രബോധനമായ ആജ്ഞാർഥമാണ് സ്വാഭാവികം. ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത ഒരു കർമം ചേർക്കാതെ വിവർത്തനം ചെയ്തു.
- source_word: ὡς υἱοῖς
  choice: പുത്രന്മാരോടെന്നപോലെ
  rationale: പിതാവ്–പുത്രൻ ഉപമയിലെ ബന്ധപരമായ താരതമ്യം നിലനിർത്തുന്നു; ലിംഗസൂചന മായ്ച്ചുകളയുന്ന ‘മക്കളോടെന്നപോലെ’ എന്നതിനെ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചില്ല.
- source_word: προσφέρεται
  choice: ഇടപെടുന്നു
  rationale: ഈ സന്ദർഭത്തിലെ മധ്യ/കർമണി രൂപത്തിന്റെ ബന്ധപരമായ ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: τίς γὰρ υἱὸς ὃν οὐ παιδεύει πατήρ
  choice: കാരണം, പിതാവ് ശിക്ഷണം നൽകാത്ത ഏതു പുത്രനാണുള്ളത്?
  rationale: വാചകത്തിലെ അലങ്കാരപ്രശ്നത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; πατήρ-ന് ഗ്രീക്കിൽ ഇല്ലാത്ത ഉടമസ്ഥസർവനാമം ചേർത്തിട്ടില്ല. παιδεύει എന്നത് παιδείαയുമായുള്ള പദബന്ധം പ്രകടമാക്കാൻ ‘ശിക്ഷണം നൽകുക’ എന്നു വിവർത്തനം ചെയ്തു.
theological_decisions:
- issue: പിതാവ്–പുത്രൻ ഉപമയിലെ ലിംഗസൂചക കുടുംബഭാഷ
  choice: മുഖ്യപാഠത്തിൽ ‘പുത്രന്മാർ’ നിലനിർത്തി
  alternative: മക്കൾ
  rationale: വാക്യത്തിന്റെ വാദം പിതാവും പുത്രന്മാരും തമ്മിലുള്ള സാംസ്കാരികമായി തിരിച്ചറിയാവുന്ന ഉപമയെ ആശ്രയിക്കുന്നു. അതിനാൽ ഗ്രീക്കിലെ പുരുഷലിംഗപദം നിലനിർത്തി; പ്രയോഗം പുരുഷന്മാർക്കു മാത്രമല്ലെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന വിധത്തിൽ ഗൗരവമുള്ള ശൈലി സ്വീകരിച്ചു. ‘ശിക്ഷണം’ എന്ന പദം ശിക്ഷ മാത്രമല്ല, തിരുത്തലും വളർത്തലും പരിശീലനവും ഉൾക്കൊള്ളുന്ന παιδείαയുടെ വിശാല അർഥം വഹിക്കാൻ ഉപയോഗിച്ചു.
