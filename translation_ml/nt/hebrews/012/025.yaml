id: HEB.12.25
reference: Hebrews 12:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Βλέπετε μὴ παραιτήσησθε τὸν λαλοῦντα· εἰ γὰρ ἐκεῖνοι οὐκ ⸀ἐξέφυγον ⸂ἐπὶ γῆς παραιτησάμενοι τὸν⸃ χρηματίζοντα, ⸀πολὺ μᾶλλον ἡμεῖς οἱ τὸν ἀπ’ οὐρανῶν ἀποστρεφόμενοι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/025.yaml
  text: See to it that you do not refuse the one who is speaking[a]. For if those did not escape when they refused the one who warned them on earth[b], much less will we if we turn away from the one who warns from heaven.
translation:
  language: ml
  text: സംസാരിക്കുന്നവനെ[a] നിരസിക്കാതിരിക്കാൻ സൂക്ഷിക്കുക. ഭൂമിയിൽവെച്ച് മുന്നറിയിപ്പ് നൽകിയവനെ നിരസിച്ചവർ രക്ഷപ്പെട്ടില്ലെങ്കിൽ, സ്വർഗത്തിൽനിന്ന് സംസാരിക്കുന്നവനിൽനിന്ന് നാം പിന്തിരിയുകയാണെങ്കിൽ എത്രയധികം നാം രക്ഷപ്പെടാതിരിക്കും![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഭൂമിയിൽ ദൈവിക മുന്നറിയിപ്പ് നൽകിയവൻ.” ഗ്രീക്ക് ക്രിയയ്ക്ക് ദൈവിക അധികാരത്തോടെയുള്ള അറിയിപ്പിനെയോ മുന്നറിയിപ്പിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “എത്രയധികം നാം, സ്വർഗത്തിൽനിന്നുള്ളവനിൽനിന്ന് പിന്തിരിയുന്നവർ!” “രക്ഷപ്പെടാതിരിക്കും” എന്ന ക്രിയ മുൻ ഉപവാക്യത്തിൽനിന്ന് സൂചിതമാണ്. “സ്വർഗത്തിൽനിന്ന് സംസാരിക്കുന്നവൻ” എന്നതിനെ “സ്വർഗത്തിൽനിന്ന് മുന്നറിയിപ്പ് നൽകുന്നവൻ” എന്നും മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπετε
  choice: സൂക്ഷിച്ചുകൊള്ളുക
  rationale: ബഹുവചന ആജ്ഞയുടെ മുന്നറിയിപ്പും ജാഗ്രതയ്ക്കുള്ള ആഹ്വാനവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: μὴ παραιτήσησθε / παραιτησάμενοι
  choice: നിരസിക്കാതിരിക്കാൻ / നിരസിച്ചവർ
  rationale: ഒരേ ഗ്രീക്ക് ക്രിയയുടെ ആവർത്തനം മലയാളത്തിലും നിലനിർത്തി, പറയപ്പെടുന്ന വാക്ക് സ്വീകരിക്കാതിരിക്കുന്നതിന്റെ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: τὸν λαλοῦντα
  choice: സംസാരിക്കുന്നവനെ
  rationale: വർത്തമാനകാല കൃദന്തത്തിന്റെ തുടരുന്ന സംസാരപ്രവർത്തിയും തൽക്ഷണതയും സംരക്ഷിക്കുന്നു; വാക്യം പറയാത്ത വ്യക്തിനാമം ചേർക്കുന്നില്ല.
- source_word: ἐξέφυγον
  choice: രക്ഷപ്പെട്ടില്ല
  rationale: ന്യായവിധിയുടെ ഫലത്തിൽനിന്ന് ഒഴിഞ്ഞുമാറാനാകാതിരുന്നതിനെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἐπὶ γῆς
  choice: ഭൂമിയിൽവെച്ച്
  rationale: ἀπ’ οὐρανῶν എന്നതുമായുള്ള ഭൂമി–സ്വർഗം വൈരുധ്യം നിലനിർത്തുന്നു; സീനായി എന്ന് അധികമായി വ്യക്തമാക്കുന്നില്ല.
- source_word: χρηματίζοντα
  choice: ദൈവിക മുന്നറിയിപ്പ് നൽകിയവനെ
  rationale: ക്രിയയിലെ ദൈവികമായി അധികാരപ്പെടുത്തിയ അറിയിപ്പിന്റെയോ മുന്നറിയിപ്പിന്റെയോ ഭാവം സംരക്ഷിക്കുന്നു. വെറും ‘മുന്നറിയിപ്പ് നൽകിയവൻ’ എന്നതിനെക്കാൾ ഉറവിടഭാവം വ്യക്തമാക്കുന്നു, എന്നാൽ വ്യക്തിയുടെ പേര് ചേർക്കുന്നില്ല.
- source_word: πολὺ μᾶλλον
  choice: എത്രയധികം ... രക്ഷപ്പെടുകയില്ല
  rationale: ചെറിയതിൽനിന്ന് വലിയതിലേക്കുള്ള നിഷേധാത്മക വാദം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ἀποστρεφόμενοι
  choice: പിന്തിരിയുകയാണെങ്കിൽ
  rationale: കൃദന്തത്തിൽ ഉൾക്കൊള്ളുന്ന വ്യവസ്ഥാപരമായ അർഥം വായനാസൗകര്യത്തോടെ നൽകുന്നു; വിശ്വാസത്യാഗം പോലുള്ള കൂടുതൽ സാങ്കേതിക പദം അടിച്ചേൽപ്പിക്കുന്നില്ല.
- source_word: τὸν ἀπ’ οὐρανῶν
  choice: സ്വർഗത്തിൽനിന്ന് സംസാരിക്കുന്നവനിൽനിന്ന്
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്ത പ്രയോഗത്തെ മുൻപത്തെ ‘സംസാരിക്കുന്നവൻ’ എന്നതുമായി ബന്ധിപ്പിച്ച് വ്യക്തമാക്കുന്നു; ‘മുന്നറിയിപ്പ് നൽകുന്നവൻ’ എന്നും വായിക്കാവുന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: സംസാരിക്കുന്ന/മുന്നറിയിപ്പ് നൽകുന്ന വ്യക്തിയുടെ തിരിച്ചറിയൽ
  choice: ‘സംസാരിക്കുന്നവൻ’, ‘ദൈവിക മുന്നറിയിപ്പ് നൽകിയവൻ’ എന്ന പൊതുവായ വിവരണം നിലനിർത്തി
  alternative: ദൈവം അല്ലെങ്കിൽ ക്രിസ്തു എന്ന് നേരിട്ട് ചേർക്കുക
  rationale: സന്ദർഭം ദൈവിക സംസാരത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും ഈ വാക്യം വ്യക്തിനാമമോ സ്ഥാനനാമമോ നൽകുന്നില്ല. അതിനാൽ വായനക്കാരൻ സന്ദർഭത്തിൽനിന്ന് തിരിച്ചറിയാൻ കഴിയുന്ന വിധത്തിൽ ഗ്രീക്കിന്റെ തുറന്ന സ്വഭാവം സംരക്ഷിച്ചു.
- issue: രണ്ടാം ഉപവാക്യത്തിലെ ഗ്രീക്ക് ക്രിയാലോപം
  choice: ‘എത്രയധികം നാം രക്ഷപ്പെടുകയില്ല’ എന്ന് സൂചിത ക്രിയ വ്യക്തമാക്കി
  alternative: ‘എത്രയധികം നാം, ... പിന്തിരിയുന്നവർ’ എന്ന കൂടുതൽ അക്ഷരാർഥപരമായ അപൂർണ രൂപം
  rationale: മുൻ ഉപവാക്യത്തിലെ ‘രക്ഷപ്പെട്ടു’ എന്ന ക്രിയ രണ്ടാമത്തേതിലും അർഥപരമായി തുടരുന്നു. അത് മലയാളത്തിൽ വ്യക്തമാക്കുന്നത് വായനാസൗകര്യത്തിനാവശ്യമാണ്; പുതിയ ദൈവശാസ്ത്രവാദം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക പ്രമാണ മലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഭൂമി–സ്വർഗം വൈരുധ്യവും ആവർത്തിച്ച ‘നിരസിക്കുക’ എന്ന ആശയവും സംരക്ഷിച്ചു. ഗ്രീക്കിലെ സംക്ഷിപ്തത വായനാസൗകര്യത്തിനായി പരിമിതമായി വ്യക്തമാക്കി; വ്യക്തിയുടെ തിരിച്ചറിയൽ അനാവശ്യമായി നിർണയിച്ചിട്ടില്ല.
