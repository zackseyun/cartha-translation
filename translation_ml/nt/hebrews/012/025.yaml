  to: സംസാരിക്കുന്നവനെ[a] നിരസിക്കാതിരിക്കാൻ സൂക്ഷിക്കുക. ഭൂമിയിൽവെച്ച് മുന്നറിയിപ്പ് നൽകിയവനെ നിരസിച്ചവർ രക്ഷപ്പെട്ടില്ലെങ്കിൽ, സ്വർഗത്തിൽനിന്ന് സംസാരിക്കുന്നവനിൽനിന്ന് നാം പിന്തിരിയുകയാണെങ്കിൽ എത്രയധികം നാം രക്ഷപ്പെടാതിരിക്കും![b]
  rationale: The revision removes a mild interpretive expansion from the main text, retains the Greek’s unnamed speaking/warning figure, preserves the ongoing sense of “speaking,” and makes the implied final verb explicit in idiomatic Malayalam. The notes preserve the lexical and syntactic alternatives without resolving the speaker’s identity.
