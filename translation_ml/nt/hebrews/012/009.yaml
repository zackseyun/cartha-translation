id: HEB.12.9
reference: Hebrews 12:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶτα τοὺς μὲν τῆς σαρκὸς ἡμῶν πατέρας εἴχομεν παιδευτὰς καὶ ἐνετρεπόμεθα· οὐ ⸀πολὺ μᾶλλον ὑποταγησόμεθα τῷ πατρὶ τῶν πνευμάτων καὶ ζήσομεν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/009.yaml
  text: Furthermore[a], we had our earthly fathers as disciplinarians, and we respected them[c][b]. Shall we not much more submit to the Father of spirits and live?
translation:
  language: ml
  text: കൂടാതെ, നമ്മുടെ ശാരീരിക പിതാക്കന്മാർ നമ്മെ ശിക്ഷണം നൽകിയിരുന്നു; നാം അവരെ ആദരിക്കുകയും ചെയ്തു. എങ്കിൽ, ആത്മാക്കളുടെ പിതാവിന് നാം എത്രയോ അധികം കീഴടങ്ങി ജീവിക്കേണ്ടതല്ലയോ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആത്മാക്കളുടെ പിതാവ്’ എന്നത് പ്രത്യേകിച്ച് ‘നമ്മുടെ ആത്മാക്കളുടെ പിതാവ്’ എന്ന അർഥത്തിലാകാം; എന്നാൽ ഗ്രീക്ക് പ്രയോഗം അതിനെക്കാൾ വിശാലമാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶτα
  choice: കൂടാതെ
  rationale: മുൻവാദത്തോട് മറ്റൊരു ശക്തമായ കാര്യം ചേർക്കുന്ന പ്രയോഗം; വെറും കാലക്രമം സൂചിപ്പിക്കുന്ന ‘പിന്നെ’ എന്നതിനെക്കാൾ സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: τοὺς μὲν τῆς σαρκὸς ἡμῶν πατέρας
  choice: നമ്മുടെ ജഡപ്രകാരമുള്ള പിതാക്കന്മാർ
  rationale: ശാരീരികമായ മനുഷ്യവംശബന്ധത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ രൂപവും ‘ആത്മാക്കളുടെ പിതാവ്’ എന്ന തുടർന്നുള്ള വൈരുധ്യവും നിലനിർത്തുന്നു; ‘ജഡം’ ഇവിടെ പാപസ്വഭാവമല്ല.
- source_word: παιδευτὰς
  choice: നമ്മെ ശിക്ഷണം നൽകിയിരുന്നു
  rationale: മാതാപിതാക്കൾ പരിശീലനപരമായ തിരുത്തലും ശിക്ഷണവും നൽകിയവരായിരുന്നു എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ചുറ്റുപാടിലെ παιδεία എന്ന ആശയബന്ധവും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: ἐνετρεπόμεθα
  choice: നാം അവരെ ആദരിക്കുകയും ചെയ്തു
  rationale: ശിക്ഷണം നൽകിയ പിതാക്കന്മാരോടുള്ള ബഹുമാനപൂർവമായ പരിഗണനയാണ് സന്ദർഭത്തിലെ അർഥം.
- source_word: οὐ πολὺ μᾶλλον ὑποταγησόμεθα
  choice: നാം എത്രയധികം കീഴടങ്ങി ... വേണ്ടതാണ്!
  rationale: ചെറുതിൽനിന്ന് വലുതിലേക്കുള്ള വാദത്തിന്റെ ഊന്നലും ഉത്തരം വ്യക്തമായ വാചാടോപചോദ്യത്തിന്റെ ശക്തിയും സ്വാഭാവിക മലയാളത്തിൽ പകരുന്നു.
- source_word: τῷ πατρὶ τῶν πνευμάτων
  choice: ആത്മാക്കളുടെ പിതാവിന്
  rationale: ‘നമ്മുടെ ആത്മാക്കളുടെ’ എന്നു പരിമിതപ്പെടുത്താതെ ഗ്രീക്കിലെ വിശാലമായ ബഹുവചന ഷഷ്ഠിവിഭക്തി പ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: καὶ ζήσομεν
  choice: ജീവിക്കേണ്ടതാണ്
  rationale: കീഴടങ്ങുന്നതുമായി ജീവനെ ബന്ധിപ്പിക്കുന്ന ഫലസൂചന നിലനിർത്തിക്കൊണ്ട് വാചാടോപചോദ്യത്തിൽ സ്വാഭാവികമായി ചേരുന്നു.
theological_decisions:
- issue: ‘ആത്മാക്കളുടെ പിതാവ്’ എന്നതിന്റെ വ്യാപ്തി
  choice: ഗ്രീക്കിലുള്ളതുപോലെ ‘ആത്മാക്കളുടെ പിതാവ്’ എന്നു വിശാലമായി നിലനിർത്തി.
  alternative: ‘നമ്മുടെ ആത്മാക്കളുടെ പിതാവ്’ അല്ലെങ്കിൽ ‘ആത്മീയജീവികളുടെ പിതാവ്’.
  rationale: സമീപസന്ദർഭത്തിൽ മനുഷ്യപിതാക്കന്മാരും ദൈവവും തമ്മിലുള്ള വൈരുധ്യം വ്യക്തമാണ്; എന്നാൽ ‘ആത്മാക്കൾ’ ആരെല്ലാമാണെന്നത് വാചകം തന്നെ പരിമിതപ്പെടുത്തുന്നില്ല. അതിനാൽ വ്യാഖ്യാനപരമായ ചുരുക്കം ഒഴിവാക്കി.
- issue: ‘ജഡം’ എന്നതിന്റെ അർഥം
  choice: ശാരീരിക മനുഷ്യവംശബന്ധം സൂചിപ്പിക്കുന്ന ‘ജഡപ്രകാരമുള്ള’.
  alternative: ‘ഭൗമികരായ’ അല്ലെങ്കിൽ ‘മാനുഷികരായ’.
  rationale: ഇവിടെ σάρξ പാപസ്വഭാവത്തെ സൂചിപ്പിക്കുന്നില്ല; മനുഷ്യജനനവും ദേഹബന്ധവും ‘ആത്മാക്കൾ’ എന്നതിനോടുള്ള വൈരുധ്യവുമാണ് സൂചന.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലത്തിലെ ‘ജഡം/ആത്മാക്കൾ’ വൈരുധ്യം ഉദ്ദേശപൂർവം നിലനിർത്തി. വാചാടോപചോദ്യത്തിന്റെ സ്വാഭാവിക മലയാളരൂപമായി ആശ്ചര്യചിഹ്നം ഉപയോഗിച്ചു.
