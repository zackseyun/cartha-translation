revisions:
- from: കൂടാതെ, നമ്മുടെ ജഡപ്രകാരമുള്ള പിതാക്കന്മാർ നമ്മെ ശിക്ഷണം നൽകിയിരുന്നു; നാം അവരെ ആദരിക്കുകയും ചെയ്തു. എങ്കിൽ ആത്മാക്കളുടെ പിതാവിന് നാം എത്രയധികം കീഴടങ്ങി ജീവിക്കേണ്ടതാണ്![a]
  to: കൂടാതെ, നമ്മുടെ ശാരീരിക പിതാക്കന്മാർ നമ്മെ ശിക്ഷണം നൽകിയിരുന്നു; നാം അവരെ ആദരിക്കുകയും ചെയ്തു. എങ്കിൽ, ആത്മാക്കളുടെ പിതാവിന് നാം എത്രയോ അധികം കീഴടങ്ങി ജീവിക്കേണ്ടതല്ലയോ?[a]
  rationale: The revision preserves the source’s rhetorical-question form, its ‘much more’ argument, and the broad plural expression ‘Father of spirits.’ It replaces an awkward and potentially moralized rendering of σάρξ with natural modern Malayalam that denotes physical/human fathers in the intended contrast.
