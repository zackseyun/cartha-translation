id: HEB.12.15
reference: Hebrews 12:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐπισκοποῦντες μή τις ὑστερῶν ἀπὸ τῆς χάριτος τοῦ θεοῦ, μή τις ῥίζα πικρίας ἄνω φύουσα ἐνοχλῇ καὶ ⸂δι’ αὐτῆς⸃ μιανθῶσιν ⸀πολλοί,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/015.yaml
  text: watching carefully lest anyone fall short of the grace of God[a], lest any root of bitterness springing up cause trouble, and through it many be defiled[b],
translation:
  language: ml
  text: 'ജാഗ്രതയോടെ ശ്രദ്ധിക്കുക: ദൈവത്തിന്റെ കൃപ കൈവരിക്കുന്നതിൽ ആരും പരാജയപ്പെടാതിരിക്കട്ടെ[a]; കയ്പിന്റെ ഒരു വേര്[b] മുളച്ചുപൊങ്ങി കുഴപ്പമുണ്ടാക്കാതിരിക്കട്ടെ; അതിലൂടെ അനേകർ അശുദ്ധരാകാതിരിക്കട്ടെ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദൈവത്തിന്റെ കൃപയിൽ ആരും കുറവുള്ളവരാകാതിരിക്കട്ടെ.’ ഗ്രീക്ക് പ്രയോഗത്തിന് ലഭ്യമായ കൃപ കൈവരിക്കാതിരിക്കുക എന്നും അതിൽ കുറവുള്ളവരാകുക എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: ‘കയ്പിന്റെ വേര്’ എന്ന പ്രയോഗം ആവർത്തനം 29:18-നെ പ്രതിധ്വനിപ്പിക്കുന്നതാകാം. അവിടെ വിഷമുള്ള ഒരു വേര് സമൂഹത്തിനുള്ളിൽ പടരുന്ന ഉടമ്പടിയോടുള്ള അവിശ്വസ്തതയെ പ്രതിനിധാനം ചെയ്യുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπισκοποῦντες
  choice: ജാഗ്രതയോടെ നോക്കിക്കൊള്ളുക
  rationale: മേൽനോട്ടം വഹിക്കുകയും ശ്രദ്ധാപൂർവം കരുതുകയും ചെയ്യുന്ന തുടർച്ചയായ ജാഗ്രതയാണ് വർത്തമാനകാല കൃദന്തരൂപം സൂചിപ്പിക്കുന്നത്. മുൻവാക്യത്തിലെ ആഹ്വാനത്തോടു ബന്ധമുള്ള രൂപമാണെങ്കിലും, മലയാളത്തിൽ വാക്യം സ്വാഭാവികവും വ്യക്തവുമാകാൻ ആഹ്വാനരൂപത്തിൽ നൽകി.
- source_word: μή τις ὑστερῶν ἀπὸ τῆς χάριτος τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ കൃപയിൽനിന്ന് ആരും പിന്നിലായിപ്പോകാതിരിക്കാനും
  rationale: ὑστερέω എന്ന പദത്തിന് ലഭ്യമായതിനെ പ്രാപിക്കാതിരിക്കുക എന്നും അതിൽ കുറവുവരിക അഥവാ പിന്നിലാകുക എന്നും അർഥമാകാം. ‘പിന്നിലായിപ്പോകുക’ മുന്നറിയിപ്പിന്റെ ശക്തി നിലനിർത്തുകയും ഒരു പ്രത്യേക രക്ഷാശാസ്ത്രനിഗമനം അടിച്ചേൽപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: χάριτος
  choice: കൃപ
  rationale: ഇവിടത്തെ ദൈവിക അനുഗ്രഹത്തിന്റെയും രക്ഷാപരമായ അർഥധ്വനിയുടെയും പതിവായ, സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: ῥίζα πικρίας
  choice: കയ്പിന്റെ ഒരു വേര്
  rationale: ഗ്രീക്കിലെ സമാസബന്ധം അടുത്തായി നിലനിർത്തുന്നതോടൊപ്പം ആവർത്തനം 29:18-ലെ പ്രതിധ്വനിയും സംരക്ഷിക്കുന്നു.
- source_word: ἄνω φύουσα
  choice: മുളച്ചുവന്ന്
  rationale: മേലോട്ടു പൊട്ടിമുളച്ചു വളരുന്ന സസ്യരൂപകം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἐνοχλῇ
  choice: കുഴപ്പമുണ്ടാക്കുക
  rationale: സമൂഹത്തെ അലട്ടുകയോ പ്രശ്നത്തിലാക്കുകയോ ചെയ്യുന്ന അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: δι’ αὐτῆς
  choice: അതുമൂലം
  rationale: സ്ത്രീലിംഗ സർവനാമം ഏറ്റവും സ്വാഭാവികമായി ‘വേര്’ എന്നതിനെയാണ് സൂചിപ്പിക്കുന്നത്; διάയുടെ കാരണോപാധിപരമായ അർഥം ‘അതുമൂലം’ നിലനിർത്തുന്നു.
- source_word: μιανθῶσιν πολλοί
  choice: അനേകർ അശുദ്ധരാകുക
  rationale: μιαίνω എന്നതിലെ ധാർമികവും ആചാരപരവുമായ മലിനീകരണത്തിന്റെ ശക്തി ‘അശുദ്ധരാകുക’ സംരക്ഷിക്കുന്നു; അതിനെ വെറും സാമൂഹിക അസ്വസ്ഥതയായി മയപ്പെടുത്തുന്നില്ല.
theological_decisions:
- issue: ‘ദൈവത്തിന്റെ കൃപയിൽനിന്ന് പിന്നിലായിപ്പോകുക’ എന്ന മുന്നറിയിപ്പ് രക്ഷ നഷ്ടപ്പെടുന്നതാണോ, കൃപ പ്രാപിക്കാതിരിക്കുന്നതാണോ എന്ന ചോദ്യം
  choice: ദൈവത്തിന്റെ കൃപയിൽനിന്ന് ആരും പിന്നിലായിപ്പോകാതിരിക്കുക
  alternative: ദൈവത്തിന്റെ കൃപ പ്രാപിക്കുന്നതിൽ ആരും പരാജയപ്പെടാതിരിക്കുക
  rationale: ഗ്രീക്ക് പ്രയോഗം ഈ രണ്ടു ആശയസാധ്യതകളും അനുവദിക്കുന്നു. പിൽക്കാല മതവിഭാഗപരമായ നിലപാടുകളിലൊന്ന് തീർപ്പാക്കി ചേർക്കാതെ വാക്യത്തിലെ മുന്നറിയിപ്പും ആശയപിരിമുറുക്കവും മുഖ്യവാചകം സംരക്ഷിക്കുന്നു.
- issue: μιαίνω എന്നതിനെ വെറും സാമൂഹിക പ്രശ്നമായി മയപ്പെടുത്തണമോ
  choice: അശുദ്ധരാകുക
  alternative: ദുഷിക്കപ്പെടുക
  rationale: പദത്തിനുള്ള ധാർമികവും ആചാരപരവുമായ അശുദ്ധിയുടെ ഗൗരവം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കൃപ’, ‘അശുദ്ധർ’ തുടങ്ങിയ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തിയപ്പോൾ, വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി ക്രമപ്പെടുത്തി. ഗ്രീക്കിലെ കൃദന്തരൂപം മുൻവാക്യത്തെ ആശ്രയിക്കുന്നതിനാൽ ഒറ്റവാക്യമായി വായിക്കുമ്പോൾ വ്യക്തതയ്ക്കായി മലയാളത്തിൽ ആഹ്വാനരൂപം ഉപയോഗിച്ചു.
