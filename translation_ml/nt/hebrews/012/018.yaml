id: HEB.12.18
reference: Hebrews 12:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οὐ γὰρ προσεληλύθατε ⸀ψηλαφωμένῳ καὶ κεκαυμένῳ πυρὶ καὶ γνόφῳ καὶ ⸀ζόφῳ καὶ θυέλλῃ
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/018.yaml
  text: For you have not come to what can be touched[a], and to a blazing fire, and to darkness and gloom and storm[b],
translation:
  language: ml
  text: കാരണം, സ്പർശിക്കാവുന്ന ഒന്നിലേക്കും[a] ആളിക്കത്തുന്ന തീയിലേക്കും ഇരുട്ടിലേക്കും കൂരിരുട്ടിലേക്കും കൊടുങ്കാറ്റിലേക്കും നിങ്ങൾ വന്നുചേർന്നിട്ടില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സ്പർശിക്കാവുന്ന ഒരു മലയിലേക്ക്.’ ചുറ്റുമുള്ള സന്ദർഭം സീനായി മലയെ സൂചിപ്പിക്കുന്നു; എന്നാൽ ഈ വാക്യത്തിന്റെ ഗ്രീക്കിൽ ‘മല’ എന്ന പദം വ്യക്തമായി ഇല്ല.
    reason: alternative_reading
  - marker: b
    text: 'ഈ പട്ടികയെ ഇങ്ങനെയും ഘടിപ്പിക്കാം: ‘സ്പർശിക്കാവുന്ന ഒന്നിലേക്ക്, ആളിക്കത്തുന്ന തീയിലേക്ക്, ഇരുട്ടിലേക്കും കൂരിരുട്ടിലേക്കും കൊടുങ്കാറ്റിലേക്കും നിങ്ങൾ വന്നുചേർന്നിട്ടില്ല.’'
    reason: previous_rendering
lexical_decisions:
- source_word: Οὐ γὰρ
  choice: കാരണം ... ഇല്ല
  rationale: γάρ-ന്റെ വിശദീകരണാത്മക ബന്ധം ‘കാരണം’ എന്നു നിലനിർത്തുകയും οὐ ക്രിയയെ നിഷേധിക്കുന്നതായി സ്വാഭാവികമായ മലയാളവാക്യക്രമത്തിൽ നൽകുകയും ചെയ്തു.
- source_word: προσεληλύθατε
  choice: നിങ്ങൾ വന്നുചേർന്നിട്ടില്ല
  rationale: പൂർണകാലം സൂചിപ്പിക്കുന്ന, സമീപിച്ചതിന്റെ ഫലമായി ഇപ്പോൾ അവിടെ എത്തിയിരിക്കുന്ന അവസ്ഥ ‘വന്നുചേർന്നു’ എന്ന പ്രയോഗം സ്വാഭാവികമായി പകർന്നു നൽകുന്നു.
- source_word: ψηλαφωμένῳ
  choice: സ്പർശിക്കാവുന്ന ഒന്നിലേക്ക്
  rationale: ഗ്രീക്കിൽ ‘മല’ എന്ന നാമം ഇല്ലാത്തതിനാൽ അത് മുഖ്യപാഠത്തിൽ ചേർക്കാതെ, സ്പർശിക്കാനാകുന്ന യാഥാർഥ്യം എന്ന അനിർദിഷ്ട അർഥം സംരക്ഷിച്ചു.
- source_word: κεκαυμένῳ πυρί
  choice: ആളിക്കത്തുന്ന തീയിലേക്ക്
  rationale: തീ കത്തിക്കൊണ്ടിരിക്കുന്ന അവസ്ഥയെ വ്യക്തവും ദൃശ്യസമ്പന്നവും സമകാലികവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: γνόφῳ
  choice: ഇരുട്ടിലേക്ക്
  rationale: കട്ടിയേറിയ ഇരുട്ട് എന്ന അർഥമേഖല ലളിതമായ ‘ഇരുട്ട്’കൊണ്ട് നൽകി; തുടർന്നുള്ള സമാനപദത്തോടുള്ള വാചകസഞ്ചയം നിലനിർത്തി.
- source_word: ζόφῳ
  choice: കൂരിരുട്ടിലേക്ക്
  rationale: ζόφος സൂചിപ്പിക്കുന്ന ഭീഷണമായ ഗാഢാന്ധകാരം ‘കൂരിരുട്ട്’ എന്നു നൽകി γνόφος-ൽനിന്ന് നേരിയ വ്യത്യാസം വരുത്തി.
- source_word: θυέλλῃ
  choice: കൊടുങ്കാറ്റിലേക്ക്
  rationale: θύελλα സൂചിപ്പിക്കുന്ന ശക്തമായ കാറ്റും പ്രക്ഷുബ്ധതയും സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ രീതിയിൽ നൽകുന്നു.
theological_decisions:
- issue: സമീപിച്ച വസ്തുവായി ‘മല’ ചേർക്കണമോ
  choice: മുഖ്യപാഠത്തിൽ ‘മല’ ചേർക്കാതെ ‘സ്പർശിക്കാവുന്ന ഒന്ന്’ എന്നു വിവർത്തനം ചെയ്തു.
  alternative: ‘സ്പർശിക്കാവുന്ന ഒരു മലയിലേക്ക്’ എന്നു വിവർത്തനം ചെയ്യുക.
  rationale: സന്ദർഭം സീനായി മലയെ സൂചിപ്പിക്കുന്നുവെങ്കിലും ഈ വാക്യത്തിന്റെ ഗ്രീക്കിൽ ὄρος (‘മല’) ഇല്ല. അതിനാൽ മൂലപാഠത്തിലെ അനിർദിഷ്ടത മുഖ്യപാഠത്തിൽ നിലനിർത്തി സന്ദർഭപരമായ തിരിച്ചറിവ് അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ആവർത്തിച്ച καί-കളെ ഓരോ ഘടകത്തിലും ‘-ലേക്കും’ എന്ന സമാന്തരരൂപത്തിൽ നിലനിർത്തി; വാക്യാവസാനത്തിലെ ഏക നിഷേധം മുഴുവൻ പട്ടികയിലും വ്യാപിക്കുന്നതായി സ്വാഭാവിക മലയാളവാക്യക്രമം ഉപയോഗിച്ചു.
