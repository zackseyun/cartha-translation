  text: ὃν γὰρ ἀγαπᾷ κύριος παιδεύει, μαστιγοῖ δὲ πάντα υἱὸν ὃν παραδέχεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/006.yaml
  text: For the Lord disciplines the one he loves[b][a], and he scourges every son whom he receives.
translation:
  language: ml
  text: എന്തെന്നാൽ, കർത്താവ് താൻ സ്നേഹിക്കുന്നവന് ശിക്ഷണം നൽകുന്നു; താൻ സ്വീകരിക്കുന്ന ഓരോ പുത്രനെയും ചാട്ടവാറുകൊണ്ട് അടിക്കുന്നു[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ചാട്ടവാറുകൊണ്ട് അടിക്കുന്നു’ എന്നതിന് ‘ചമ്മട്ടികൊണ്ട് പ്രഹരിക്കുന്നു’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്ക് ക്രിയ ശക്തമായതാണ്; അത് കഠിനമായ ശിക്ഷണത്തെ ചിത്രീകരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ഓരോ പുത്രൻ’ എന്നത് ഗ്രീക്ക് പദപ്രയോഗത്തെ പ്രതിഫലിപ്പിക്കുന്നു; ദൈവം തന്റെ മക്കളായി അംഗീകരിക്കുന്ന എല്ലാവരെയും ഈ പ്രയോഗം സന്ദർഭത്തിൽ പ്രതിനിധീകരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: താൻ സ്നേഹിക്കുന്നവനെ … താൻ സ്വീകരിക്കുന്ന
  rationale: ആപേക്ഷിക സർവനാമത്തിന്റെ ഏകവചനവും പൊതുവ്യാപകമായ പ്രസ്താവനാസ്വഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: γὰρ
  choice: മുൻവാക്യവുമായി ബന്ധത്തിൽ ‘എന്തെന്നാൽ’ എന്ന കാരണാർഥം
  rationale: γάρ മുൻപുള്ള പ്രബോധനത്തിന് ആധാരം നൽകുന്നു. ഒറ്റവാക്യമായി ഉദ്ധരിക്കുമ്പോൾ മലയാളത്തിൽ കൃത്രിമത്വം ഒഴിവാക്കാൻ മുഖ്യപാഠത്തിൽ പ്രത്യേക സംയോജകം ചേർത്തിട്ടില്ല; വാക്യത്തിന്റെ കാരണസ്വഭാവം സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: ἀγαπᾷ
  choice: സ്നേഹിക്കുന്ന
  rationale: ἀγαπάω എന്നതിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ ആധുനിക മലയാളരൂപം.
- source_word: κύριος
  choice: കർത്താവ്
  rationale: κύριος എന്ന ദൈവിക സ്ഥാനനാമത്തിന്റെ പതിവും ഗൗരവമുള്ളതുമായ മലയാള തർജമ.
- source_word: παιδεύει
  choice: ശിക്ഷണത്തിൽ വളർത്തുന്നു
  rationale: παιδεύω വെറും ശിക്ഷയല്ല, തിരുത്തലും പരിശീലനവും ഉൾപ്പെടുന്ന വളർത്തലാണ്; ഈ പ്രയോഗം അതിന്റെ രൂപീകരണപരമായ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: μαστιγοῖ
  choice: ചമ്മട്ടികൊണ്ട് അടിക്കുന്നു
  rationale: ക്രിയയുടെ ശക്തമായ, ശാരീരിക പ്രഹരത്തെ സൂചിപ്പിക്കുന്ന രൂപകം മയപ്പെടുത്താതെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: δὲ
  choice: ;
  rationale: ഇവിടെ δέ ശക്തമായ വിരോധത്തേക്കാൾ തുടർച്ചയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ അർദ്ധവിരാമം രണ്ടു സമാന്തര ഘടകങ്ങളെ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: πάντα υἱὸν
  choice: ഓരോ പുത്രനെയും
  rationale: ഗ്രീക്കിലെ ഏകവചന പുരുഷലിംഗ പുത്രത്വപ്രതീകം സംരക്ഷിക്കുന്നു; അതിന്റെ പ്രതിനിധാനപരമായ വ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: παραδέχεται
  choice: സ്വീകരിക്കുന്ന
  rationale: അംഗീകരിച്ച് ബന്ധത്തിലേക്ക് കൈക്കൊള്ളുന്ന അർഥം ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
theological_decisions:
- issue: ദൈവിക ശിക്ഷണത്തിന്റെ പശ്ചാത്തലത്തിൽ υἱός എന്ന പുത്രത്വപദത്തിന്റെ വിവർത്തനം
  choice: ഓരോ പുത്രനെയും
  alternative: ഓരോ മകനെയും / ഓരോ കുഞ്ഞിനെയും
  rationale: എബ്രായർ 12-ലെ പുത്രത്വപ്രതീകവും മൂലപാഠത്തിലെ υἱός എന്ന പദവും നിലനിർത്തുന്നു. ഇത് ദൈവം തന്റെ മക്കളായി അംഗീകരിക്കുന്ന എല്ലാവരെയും സന്ദർഭത്തിൽ പ്രതിനിധീകരിക്കുന്നതായി അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- issue: μαστιγοῖ എന്ന ശക്തമായ ക്രിയയും ദൈവസ്നേഹവും തമ്മിലുള്ള സംഘർഷം
  choice: ചമ്മട്ടികൊണ്ട് അടിക്കുന്നു
  alternative: കഠിനമായി ശിക്ഷിക്കുന്നു / പ്രഹരിക്കുന്നു
  rationale: മൂലപാഠത്തിലെ കടുത്ത രൂപകം മയപ്പെടുത്താതെ, സ്നേഹവും വേദനാജനകമായ ശിക്ഷണവും തമ്മിലുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷം അതേപടി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ശിക്ഷണത്തിൽ വളർത്തുന്നു’ എന്ന പ്രയോഗം παιδεύει എന്ന പദത്തിലെ തിരുത്തൽ-പരിശീലന ഭാവം ഉൾക്കൊള്ളുന്നു; ‘ചമ്മട്ടികൊണ്ട് അടിക്കുന്നു’ എന്നത് μαστιγοῖയുടെ കഠിനത മറയ്ക്കുന്നില്ല. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
