id: HEB.12.14
reference: Hebrews 12:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εἰρήνην διώκετε μετὰ πάντων, καὶ τὸν ἁγιασμόν, οὗ χωρὶς οὐδεὶς ὄψεται τὸν κύριον,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/014.yaml
  text: Pursue peace with everyone[a], and the holiness without which no one will see the Lord.
translation:
  language: ml
  text: എല്ലാവരോടും സമാധാനത്തോടെ ജീവിക്കാനും വിശുദ്ധി പിന്തുടരാനും പരിശ്രമിക്കുക; വിശുദ്ധിയില്ലാതെ ആരും കർത്താവിനെ കാണുകയില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἰρήνην
  choice: സമാധാനം
  rationale: ബന്ധപരവും സമൂഹപരവുമായ സമാധാനമാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്; μετὰ πάντων എന്ന പ്രയോഗം മറ്റുള്ളവരോടു സമാധാനത്തിൽ ജീവിക്കുന്നതിലേക്കാണ് വിരൽചൂണ്ടുന്നത്.
- source_word: διώκετε
  choice: പിന്തുടരുക
  rationale: διώκω സൂചിപ്പിക്കുന്ന സജീവവും നിരന്തരവുമായ ശ്രമത്തിന്റെ ഭാവം ‘പിന്തുടരുക’ നിലനിർത്തുന്നു.
- source_word: μετὰ πάντων
  choice: എല്ലാവരോടുമുള്ള
  rationale: സകല മനുഷ്യരെയും ഉൾക്കൊള്ളുന്ന വ്യാപ്തിയും സമാധാനത്തിന്റെ ബന്ധപരമായ സ്വഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τὸν ἁγιασμόν
  choice: വിശുദ്ധി
  rationale: ἁγιασμός വിശുദ്ധമായ അവസ്ഥയെയോ ജീവിതഗുണത്തെയോ, അതുപോലെ വിശുദ്ധീകരിക്കപ്പെടുന്ന പ്രക്രിയയെയോ സൂചിപ്പിക്കാം. മുഖ്യപാഠത്തിൽ ‘വിശുദ്ധി’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സന്ദർഭോചിതവുമാണ്; മറ്റർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: οὗ χωρὶς
  choice: വിശുദ്ധിയില്ലാതെ
  rationale: ഏകവചന പുല്ലിംഗ ആപേക്ഷിക സർവനാമം ഏറ്റവും സ്വാഭാവികമായി ἁγιασμόν എന്നതിനെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ നാമം ആവർത്തിക്കുന്നത് ബന്ധം സംശയരഹിതമായി വ്യക്തമാക്കുന്നു.
- source_word: οὐδεὶς ὄψεται
  choice: ആരും ... കാണുകയില്ല
  rationale: സമ്പൂർണ നിഷേധവും ഭാവികാല അർത്ഥവും സ്വാഭാവികമായ മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: τὸν κύριον
  choice: കർത്താവിനെ
  rationale: κύριος എന്ന ബഹുമാനപദവി നിലനിർത്തുകയും അത് പിതാവായ ദൈവത്തെയോ യേശുക്രിസ്തുവിനെയോ എന്നു പരിഭാഷയിൽ തന്നെ പരിമിതപ്പെടുത്താതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: പ്രബോധനസന്ദർഭത്തിലെ ἁγιασμός എന്ന പദത്തിന്റെ അർത്ഥം
  choice: മുഖ്യപാഠത്തിൽ ‘വിശുദ്ധി’
  alternative: ‘വിശുദ്ധീകരണം’
  rationale: വാക്യം പിന്തുടരേണ്ട വിശുദ്ധമായ ജീവിതയാഥാർഥ്യത്തെക്കുറിച്ചാണ് പ്രബോധിപ്പിക്കുന്നത്. ‘വിശുദ്ധീകരണം’ സാധുവായ മറ്റൊരു അർത്ഥമാണെങ്കിലും സാങ്കേതിക ദൈവശാസ്ത്രപദമായി കേൾക്കാം; അതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: ‘കർത്താവ്’ എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: ‘കർത്താവ്’ എന്ന പദവി അതേപടി നിലനിർത്തി
  alternative: ‘ദൈവം’ അല്ലെങ്കിൽ ‘കർത്താവായ യേശു’ എന്നു വ്യക്തമാക്കുക
  rationale: ഗ്രീക്ക് പാഠം τὸν κύριον എന്നു മാത്രമാണ് പറയുന്നത്. ഉറവിടം വ്യക്തമാക്കാത്തത് പരിഭാഷയും വ്യക്തമാക്കാതെ അതിന്റെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രബോധനശൈലി സ്വീകരിച്ചു. രണ്ടു കർമപദങ്ങളെയും ഒരേ ക്രിയയോട് ബന്ധിപ്പിച്ച് ഗ്രീക്ക് വാക്യത്തിന്റെ സമാന്തരഘടന പരമാവധി നിലനിർത്തി; ‘വിശുദ്ധിയില്ലാതെ’ എന്ന ആവർത്തനം മലയാളത്തിലെ വ്യക്തതയ്ക്കായി ഉപയോഗിച്ചു.
