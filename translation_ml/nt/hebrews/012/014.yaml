  source_fidelity: 'അർത്ഥം പൊതുവേ ഉറവിടത്തോട് വിശ്വസ്തമാണ്: സമാധാനവും വിശുദ്ധിയും സജീവമായി തേടേണ്ടതും, വിശുദ്ധിയില്ലാതെ ആരും കർത്താവിനെ കാണുകയില്ലെന്ന ഭാവിനിഷേധവും നിലനിൽക്കുന്നു. എന്നാൽ ‘എല്ലാവരോടുമുള്ള സമാധാനം’ എന്ന പ്രയോഗം സ്വാഭാവികമായി ‘എല്ലാവർക്കും ഉള്ള/ബന്ധപ്പെട്ട സമാധാനം’ എന്നും കേൾക്കാം; μετὰ πάντων എന്ന ‘എല്ലാവരോടും’ എന്ന ബന്ധം കൂടുതൽ നേരിട്ട് വ്യക്തമാക്കുന്നതാണ് ഉചിതം.'
  naturalness: മുഖ്യപാഠം വായിക്കാവുന്നതാണെങ്കിലും ആദ്യ നാമവാക്യത്തിലെ ജനിറ്റീവ്-സദൃശ ഘടന അല്പം കടുപ്പമുള്ളതാണ്. ‘എല്ലാവരോടും സമാധാനത്തോടെ ജീവിക്കാനും വിശുദ്ധി പിന്തുടരാനും പരിശ്രമിക്കുക’ ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും പ്രബോധനശൈലിക്ക് യോജിച്ചതുമാണ്. അടിക്കുറിപ്പിലെ പട്ടികഘടനയും കൂടുതൽ സുഗമമാക്കി.
