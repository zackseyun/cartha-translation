  to: എല്ലാവരോടും സമാധാനത്തോടെ ജീവിക്കാനും വിശുദ്ധി പിന്തുടരാനും പരിശ്രമിക്കുക; വിശുദ്ധിയില്ലാതെ ആരും കർത്താവിനെ കാണുകയില്ല.
