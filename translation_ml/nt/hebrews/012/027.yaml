id: HEB.12.27
reference: Hebrews 12:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τὸ δὲ Ἔτι ἅπαξ δηλοῖ ⸂τῶν σαλευομένων⸃ μετάθεσιν ὡς πεποιημένων, ἵνα μείνῃ τὰ μὴ σαλευόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/027.yaml
  text: This phrase, “Yet once more,” indicates the removal of the things being shaken—as things that have been made—so that the things not being shaken may remain.
translation:
  language: ml
  text: “ഇനി ഒരിക്കൽക്കൂടി” എന്ന പ്രയോഗം, കുലുക്കപ്പെടുന്നവ—ഉണ്ടാക്കപ്പെട്ടവ എന്ന നിലയിൽ[a]—നീക്കപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു; കുലുക്കപ്പെടാത്തവ[b] നിലനിൽക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സൃഷ്ടിക്കപ്പെട്ടവയായി.” ഗ്രീക്കിൽ അക്ഷരാർഥം “ഉണ്ടാക്കപ്പെട്ടവ എന്ന നിലയിൽ” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “കുലുക്കാൻ കഴിയാത്തവ” / “അചഞ്ചലമായത്.”
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ δὲ Ἔτι ἅπαξ
  choice: “ഇനി ഒരിക്കൽക്കൂടി” എന്ന പ്രയോഗം
  rationale: നപുംസക ലിംഗത്തിലുള്ള ആർട്ടിക്കിൾ ഉദ്ധരിച്ച വാക്കുകളെ ഒരു പ്രയോഗമായി നാമവൽക്കരിക്കുന്നു. δέ ഇവിടെ മൃദുവായ ബന്ധകമായതിനാൽ മലയാളത്തിൽ പ്രത്യേകം പദം ചേർക്കാതെ വാക്യബന്ധത്തിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: δηλοῖ
  choice: സൂചിപ്പിക്കുന്നു
  rationale: ഉദ്ധരിച്ച പ്രയോഗത്തിൽനിന്നുള്ള നിഗമനം വ്യക്തമാക്കുന്ന, സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആധുനിക മലയാളം.
- source_word: τῶν σαλευομένων
  choice: കുലുക്കപ്പെടുന്നവ
  rationale: വർത്തമാനകാല കർമണി പങ്കാളിത്തരൂപത്തിന്റെ തുടരുന്ന അല്ലെങ്കിൽ സ്വഭാവപരമായ കുലുക്കപ്പെടൽ നിലനിർത്തുന്നു.
- source_word: μετάθεσιν
  choice: നീക്കപ്പെടുന്നത്
  rationale: സന്ദർഭത്തിൽ വെറും മാറ്റത്തേക്കാൾ എടുത്തുമാറ്റൽ അഥവാ നീക്കം എന്ന അർഥമാണ് യോജിക്കുന്നത്.
- source_word: ὡς πεποιημένων
  choice: ഉണ്ടാക്കപ്പെട്ടവ എന്ന നിലയിൽ
  rationale: ὡς എന്നതും ποιέωയുടെ perfect passive participle സൂചിപ്പിക്കുന്ന ഉണ്ടാക്കപ്പെട്ടവ എന്ന വിഭാഗവും നിലനിർത്തുന്നു; കാരണാർഥം അനാവശ്യമായി ശക്തിപ്പെടുത്തുന്നില്ല.
- source_word: ἵνα μείνῃ
  choice: നിലനിൽക്കേണ്ടതിനാണ്
  rationale: ἵνα ഘടനയിലെ ഉദ്ദേശ്യം/ഫലം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: τὰ μὴ σαλευόμενα
  choice: കുലുക്കപ്പെടാത്തവ
  rationale: ‘കുലുക്കാൻ കഴിയാത്തവ’ എന്ന് വ്യാഖ്യാനിച്ച് ശക്തിപ്പെടുത്താതെ, മുൻപത്തെ പങ്കാളിത്തരൂപത്തോടുള്ള നേരിട്ടുള്ള വിരുദ്ധസമാന്തരത നിലനിർത്തുന്നു.
theological_decisions:
- issue: τὰ μὴ σαλευόμενα എന്നത് അശക്യതയായി വ്യാഖ്യാനിക്കണമോ, നേരിട്ടുള്ള നിഷേധമായി നിലനിർത്തണമോ
  choice: കുലുക്കപ്പെടാത്തവ
  alternative: കുലുക്കാൻ കഴിയാത്തവ / അചഞ്ചലമായവ
  rationale: ഗ്രീക്ക് വാക്യം ‘കുലുക്കപ്പെടുന്നവ’ എന്നും ‘കുലുക്കപ്പെടാത്തവ’ എന്നും പങ്കാളിത്തരൂപങ്ങളെ നേരിട്ട് വിരുദ്ധമായി നിർത്തുന്നു. അടുത്ത വാക്യത്തിലെ അചഞ്ചലമായ രാജ്യത്തെ മുൻകൂട്ടി ഈ വാക്യത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതെ മൂലത്തിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഉദ്ധരണി വ്യക്തമായി അടയാളപ്പെടുത്തി; നീണ്ട ആശയബന്ധം സെമിക്കോളണും ഇടവരകളും ഉപയോഗിച്ച് വായനാസൗകര്യത്തോടെ നിലനിർത്തി.
