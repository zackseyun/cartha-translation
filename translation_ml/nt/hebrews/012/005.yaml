id: HEB.12.5
reference: Hebrews 12:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐκλέλησθε τῆς παρακλήσεως, ἥτις ὑμῖν ὡς υἱοῖς διαλέγεται, Υἱέ μου, μὴ ὀλιγώρει παιδείας κυρίου, μηδὲ ἐκλύου ὑπ’ αὐτοῦ ἐλεγχόμενος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/005.yaml
  text: 'And you have forgotten the exhortation that addresses you as sons: “My son[a], do not regard lightly the Lord’s discipline[c][b], nor lose heart when you are reproved by him.”'
translation:
  language: ml
  text: 'നിങ്ങളെ പുത്രന്മാരെന്നു കരുതി അഭിസംബോധന ചെയ്യുന്ന ആ ഉപദേശം നിങ്ങൾ മറന്നിരിക്കുന്നു:


    “എന്റെ മകനേ[a], കർത്താവിന്റെ ശിക്ഷണം[b][c] നിസ്സാരമായി കരുതരുത്;


    അവൻ നിന്നെ ശാസിക്കുമ്പോൾ മനസ്സുതളരുകയുമരുത്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “എന്റെ കുഞ്ഞേ.” ഗ്രീക്കിൽ ഇവിടെ “എന്റെ മകനേ” എന്നും നേരത്തേ “പുത്രന്മാർ” എന്നും വരുന്നു. ഇത് സദൃശവാക്യങ്ങളിലെ പദപ്രയോഗത്തെയും ഈ ഭാഗത്തിലെ പ്രതിനിധാനപരമായ പുത്രത്വഭാഷയെയും പ്രതിഫലിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “ശിക്ഷണം” എന്നത് ശിക്ഷയെ മാത്രം സൂചിപ്പിക്കുന്നില്ല; “പരിശീലനം,” “ശാസനം,” അല്ലെങ്കിൽ “തിരുത്തൽ” എന്നും മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: c
    text: സദൃശവാക്യങ്ങൾ 3:11-ൽ നിന്നുള്ള ഉദ്ധരണി/സൂചന.
    reason: cross_reference
lexical_decisions:
- source_word: ἐκλέλησθε
  choice: നിങ്ങൾ മറന്നിരിക്കുന്നു
  rationale: സമ്പൂർണകാലരൂപം, മുൻപ് മറന്നതിന്റെ ഫലം ഇപ്പോഴും തുടരുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു. ‘മറന്നിരിക്കുന്നു’ ഈ അർഥവും ശാസനാസ്വരവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: παρακλήσεως
  choice: പ്രബോധനം
  rationale: പദത്തിന് പ്രോത്സാഹനം, ആശ്വാസം, ഉപദേശം, പ്രബോധനം എന്നീ അർഥങ്ങൾ വരാം. ഇവിടെ സദൃശവാക്യങ്ങളിലെ മുന്നറിയിപ്പ് ഉദ്ധരിക്കുന്നതിനാൽ ‘പ്രബോധനം’ ഉപദേശപരവും പ്രോത്സാഹനപരവുമായ ഭാവങ്ങൾ ഒരുമിച്ചു വഹിക്കുന്നു.
- source_word: ἥτις ... διαλέγεται
  choice: നിങ്ങളോടു സംസാരിക്കുന്ന
  rationale: തിരുവെഴുത്തിലെ പ്രബോധനം വായനക്കാരെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്നതാണ് ഗ്രീക്ക് പ്രയോഗം സൂചിപ്പിക്കുന്നത്. ‘സംസാരിക്കുന്ന’ എന്നത് വ്യക്തീകരണം അതിരുകടക്കാതെ ഈ സജീവഭാവം നിലനിർത്തുന്നു.
- source_word: ὡς υἱοῖς
  choice: പുത്രന്മാരോടെന്നപോലെ
  rationale: ഗ്രീക്കിൽ വ്യക്തമായി പുരുഷലിംഗ ബഹുവചനമാണ്; ഉദ്ധരിക്കപ്പെടുന്ന സദൃശവാക്യത്തിലെ പുത്രഭാഷയുമായും തുടർന്നുള്ള ഭാഗത്തിലെ പുത്രത്വവാദവുമായും ഇതിന് ബന്ധമുണ്ട്.
- source_word: Υἱέ μου
  choice: എന്റെ മകനേ
  rationale: ഏകവചന സംബോധനയായ ‘പുത്രാ’ എന്ന മൂലാർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുകയും സദൃശവാക്യങ്ങളുമായുള്ള പദബന്ധം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ὀλιγώρει
  choice: നിസ്സാരമായി കരുതരുത്
  rationale: അപ്രധാനമെന്നു കണക്കാക്കുക, വിലകുറച്ചു കാണുക എന്ന അർഥമാണ് ഇവിടെ. ‘നിസ്സാരമായി കരുതരുത്’ അവഗണനയ്ക്കെതിരായ മുന്നറിയിപ്പ് വ്യക്തമായി നൽകുന്നു; ‘വെറുക്കരുത്’ എന്ന കൂടുതൽ ശക്തമായ അർഥം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: παιδείας
  choice: ശിക്ഷണം
  rationale: രൂപപ്പെടുത്തുന്ന പരിശീലനവും തിരുത്തുന്ന ശാസനയും ഉൾക്കൊള്ളുന്ന പദമാണിത്. ‘ശിക്ഷണം’ ശിക്ഷ എന്നതിലേക്കു മാത്രം ചുരുക്കാതെ വിദ്യാഭ്യാസപരവും തിരുത്തൽപരവുമായ ഇരുവശങ്ങളും നിലനിർത്തുന്നു.
- source_word: κυρίου
  choice: കർത്താവിന്റെ
  rationale: ബന്ധസൂചകമായ ഗ്രീക്ക് രൂപം സ്വാഭാവിക മലയാളത്തിലെ ഉടമസ്ഥരൂപത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: ἐκλύου
  choice: മനസ്സുതളരുകയുമരുത്
  rationale: ശാസനയ്ക്കു കീഴിൽ അകമേ ക്ഷീണിച്ച് ധൈര്യം കൈവിടുന്നതാണ് സന്ദർഭത്തിലെ ആശയം. ‘മനസ്സുതളരുക’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: ἐλεγχόμενος
  choice: അവൻ നിന്നെ ശാസിക്കുമ്പോൾ
  rationale: ἐλέγχω തെറ്റ് വെളിപ്പെടുത്തി ശാസിക്കുക, തിരുത്തുക എന്ന ആശയം വഹിക്കുന്നു. ഗ്രീക്കിലെ കർമണിപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായ കർത്തരിപ്രയോഗമായി നൽകിയെങ്കിലും കർത്താവാണ് പ്രവർത്തിക്കുന്നവൻ എന്ന ബന്ധം നിലനിർത്തുന്നു.
theological_decisions:
- issue: പ്രബോധനത്തിലെ ലിംഗസൂചക പുത്രഭാഷ
  choice: υἱοῖς / Υἱέ എന്നവയെ ‘പുത്രന്മാർ’ / ‘എന്റെ മകനേ’ എന്നു മുഖ്യപാഠത്തിൽ നൽകുക
  alternative: ‘മക്കൾ’ / ‘എന്റെ കുഞ്ഞേ’
  rationale: സദൃശവാക്യങ്ങളിലെ പദപ്രയോഗത്തിലും എബ്രായർ 12-ലെ പുത്രത്വവാദത്തിലും പുരുഷലിംഗ പുത്രഭാഷ ഉദ്ദേശ്യപൂർവമാണ്. അതിനാൽ അതിനെ ലിംഗനിരപേക്ഷമാക്കാതെ നിലനിർത്തുന്നു; അതിന്റെ പ്രതിനിധാനപരമായ വ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: ദൈവിക παιδείαയുടെ അർഥവ്യാപ്തി
  choice: ‘ശിക്ഷണം’
  alternative: ‘പരിശീലനം’ അല്ലെങ്കിൽ ‘ഉപദേശം’ അല്ലെങ്കിൽ ‘ശിക്ഷ’
  rationale: പദം രൂപപ്പെടുത്തുന്ന പരിശീലനവും തെറ്റുതിരുത്തുന്ന ശാസനയും ഉൾക്കൊള്ളുന്നു. ‘ശിക്ഷണം’ അതിനെ വെറും ദണ്ഡനമായോ വെറും പഠിപ്പിക്കലായോ ചുരുക്കാതെ അർഥത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി ഉപയോഗിച്ചു. ഉദ്ധരണിയുടെ കാവ്യസ്വഭാവം വരിവിഭജനത്തിലൂടെ നിലനിർത്തി. ‘പ്രബോധനം,’ ‘ശിക്ഷണം’ തുടങ്ങിയ പദങ്ങൾ സഭാപരമായ പരിചയം ഉള്ളവർക്കും സാധാരണ വായനക്കാർക്കും ഗ്രഹിക്കാവുന്ന വിധം തിരഞ്ഞെടുത്തു; അതേസമയം മൂലത്തിലെ പുത്രഭാഷയും ശാസന-പരിശീലന അർഥവ്യാപ്തിയും ചുരുക്കിയിട്ടില്ല.
