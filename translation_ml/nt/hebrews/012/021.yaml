id: HEB.12.21
reference: Hebrews 12:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καί, οὕτω φοβερὸν ἦν τὸ φανταζόμενον, Μωϋσῆς εἶπεν· Ἔκφοβός εἰμι καὶ ἔντρομος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/021.yaml
  text: And so terrifying was the sight that Moses said[b][a], “I am fearful and trembling.”
translation:
  language: ml
  text: 'ആ കാഴ്ച[a] അത്ര ഭയാനകമായിരുന്നതിനാൽ മോശ[b] പറഞ്ഞു: “ഞാൻ അത്യന്തം ഭയപ്പെട്ടും വിറച്ചും ഇരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “പ്രത്യക്ഷപ്പെട്ടത്” അല്ലെങ്കിൽ “ആ ദൃശ്യം.” ഈ ഗ്രീക്ക് പ്രയോഗം സീനായിയിൽ ദൃശ്യമായി വെളിപ്പെട്ട പ്രത്യക്ഷീകരണത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഈ വാക്കുകൾ പഴയ നിയമത്തിൽ നിന്നുള്ള വാക്കുതോറുമുള്ള ഉദ്ധരണിയല്ല; സീനായി സംഭവവുമായി ബന്ധപ്പെട്ട മോശയുടെ ഭയപ്രതികരണത്തെ ഇവ പ്രതിഫലിപ്പിക്കുന്നു. ആവർത്തനപുസ്തകം 9:19 താരതമ്യം ചെയ്യുക.
    reason: cross_reference
lexical_decisions:
- source_word: καί
  choice: ആ കാഴ്ച... ആയിരുന്നതിനാൽ
  rationale: മുൻവാക്യത്തിലെ സീനായി വിവരണത്തിന്റെ തുടർച്ച മലയാളവാക്യത്തിന്റെ സ്വാഭാവിക പ്രവാഹത്തിലൂടെ നിലനിർത്തുന്നു; പ്രത്യേകമായി ‘കൂടാതെ’ എന്നു ചേർക്കുന്നത് ഇവിടെ കൃത്രിമമാകും.
- source_word: οὕτω φοβερὸν
  choice: അത്ര ഭയാനകമായിരുന്നതിനാൽ
  rationale: οὕτω സൂചിപ്പിക്കുന്ന തീവ്രമായ അളവും φοβερόν എന്നതിന്റെ ഭീതിജനകശക്തിയും സ്വാഭാവികമായ കാരണവാക്യഘടനയിൽ പകരുന്നു.
- source_word: τὸ φανταζόμενον
  choice: ആ കാഴ്ച
  rationale: സീനായിയിൽ ദൃശ്യമായ പ്രത്യക്ഷീകരണത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന് ലളിതവും സ്വാഭാവികവുമായ മലയാളം; മറ്റു സാദ്ധ്യമായ അർഥങ്ങൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: Μωϋσῆς εἶπεν
  choice: മോശ പറഞ്ഞു
  rationale: പേരിന്റെയും സാധാരണ ആഖ്യാനക്രിയയുടെയും പ്രചാരത്തിലുള്ള നേരിട്ടുള്ള മലയാളരൂപം.
- source_word: Ἔκφοβός εἰμι
  choice: ഞാൻ അത്യന്തം ഭയപ്പെടുന്നു
  rationale: ἔκφοβος സൂചിപ്പിക്കുന്ന കടുത്ത ഭയം വ്യക്തമായി പകരുന്നു; അടുത്ത പദത്തിലെ വിറയൽ എന്ന ആശയവുമായി ലയിപ്പിക്കാതെ വേർതിരിക്കുന്നു.
- source_word: καὶ ἔντρομος
  choice: വിറയ്ക്കുകയും ചെയ്യുന്നു
  rationale: ἔντρομος എന്ന രണ്ടാമത്തെ, ശാരീരിക വിറയൽ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ സ്വതന്ത്രശക്തി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ഈ വാക്കുകളും പഴയനിയമത്തിലെ സീനായി വിവരണവും തമ്മിലുള്ള ബന്ധം
  choice: ഭയാനകമായ സീനായി പ്രത്യക്ഷീകരണത്തോടുള്ള മോശയുടെ പ്രതികരണമായി വാക്യം നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: ഇത് ആവർത്തനപുസ്തകം 9:19-നെ ആധാരമാക്കിയ സ്വതന്ത്രസംഗ്രഹമാണെന്ന് മുഖ്യവാക്യത്തിൽ വിശദീകരിക്കുക.
  rationale: ഗ്രീക്ക് പാഠം മോശ പറഞ്ഞതായി നേരിട്ട് അവതരിപ്പിക്കുന്നു; കൃത്യമായ പഴയനിയമ ഉറവിടത്തെക്കുറിച്ചുള്ള അന്തർപാഠപ്രശ്നം മുഖ്യവാക്യത്തിൽ പരിഹരിക്കാതെ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ἔκφοβος, ἔντρομος എന്നീ രണ്ടു പദങ്ങളുടെയും ഭയം–വിറയൽ വ്യത്യാസം നിലനിർത്തി; അടിക്കുറിപ്പുകളുടെ മാർക്കറുകൾ പ്രധാനവാക്യത്തിൽ ചേർത്തിരിക്കുന്നു.
