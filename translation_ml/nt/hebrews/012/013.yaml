id: HEB.12.13
reference: Hebrews 12:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ τροχιὰς ὀρθὰς ⸀ποιεῖτε τοῖς ποσὶν ὑμῶν, ἵνα μὴ τὸ χωλὸν ἐκτραπῇ, ἰαθῇ δὲ μᾶλλον.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/013.yaml
  text: and make straight paths for your feet[a], so that the lame may not be turned aside[b], but rather be healed.
translation:
  language: ml
  text: നിങ്ങളുടെ കാലുകൾക്കായി നേരായ പാതകൾ ഒരുക്കുക[a]. അങ്ങനെ മുടന്തുള്ളത് വഴിതെറ്റിപ്പോകാതെ[b], പകരം സൗഖ്യം പ്രാപിക്കട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ വാക്കുകൾ സദൃശവാക്യങ്ങൾ 4:26-നെ പ്രതിധ്വനിപ്പിക്കുകയും ശിക്ഷണത്തോടെ നടക്കുന്നതിനെക്കുറിച്ചുള്ള ഈ ഭാഗത്തിന്റെ ദൃശ്യഭാഷ തുടരുകയും ചെയ്യുന്നു.
    reason: cross_reference
  - marker: b
    text: അഥവാ ‘സന്ധി തെറ്റിപ്പോകാതെ’ അല്ലെങ്കിൽ ‘സ്ഥാനഭ്രംശം സംഭവിക്കാതെ’; ശരീരരൂപകത്തിനുള്ളിൽ ഗ്രീക്ക് ക്രിയയ്ക്ക് കൂടുതൽ വൈദ്യശാസ്ത്രപരമായ അർഥസൂചനയും ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: τροχιὰς
  choice: പാതകൾ
  rationale: ചക്രപ്പാടുകളെയോ നടപ്പുവഴികളെയോ സൂചിപ്പിക്കാവുന്ന ഈ പദത്തിന്, ജീവിതഗതിയുടെ രൂപകം സ്വാഭാവികമായി നിലനിർത്തുന്ന ആധുനിക മലയാളപ്രയോഗം ‘പാതകൾ’ ആണ്.
- source_word: ὀρθὰς
  choice: നേരായ
  rationale: ശരിയായി ക്രമപ്പെടുത്തിയതും വ്യതിചലിക്കാത്തതുമായ വഴിയുടെ ദൃശ്യബിംബം നിലനിർത്തുന്നു; സദൃശവാക്യങ്ങൾ 4:26-ന്റെ പ്രതിധ്വനിയോടും യോജിക്കുന്നു.
- source_word: ποιεῖτε
  choice: ഒരുക്കുക
  rationale: വഴി സജ്ജമാക്കുക എന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; വർത്തമാനകാല ആജ്ഞയുടെ തുടർച്ചയായ ഉത്തരവാദിത്വവും ഉൾക്കൊള്ളാൻ കഴിയും.
- source_word: τοῖς ποσὶν ὑμῶν
  choice: നിങ്ങളുടെ കാലുകൾക്കായി
  rationale: ദാതൃവിഭക്തിയുടെ പ്രയോജന/ബന്ധാർഥം നേരിട്ട് നിലനിർത്തുകയും നടപ്പിന്റെ രൂപകത്തോട് പൊരുത്തപ്പെടുകയും ചെയ്യുന്നു.
- source_word: τὸ χωλὸν
  choice: മുടന്തുള്ളത്
  rationale: നപുംസകലിംഗ ഏകവചന വിശേഷണത്തിന്റെ പൊതുവായോ കൂട്ടായോ ഉള്ള ബലം നിലനിർത്തുന്നു; അത് വ്യക്തിയെയോ വ്യക്തിയിലുള്ള ദൗർബല്യത്തെയോ സൂചിപ്പിക്കുന്നുവെന്ന് നിർബന്ധിച്ച് തീരുമാനിക്കുന്നില്ല.
- source_word: ἐκτραπῇ
  choice: വഴിതെറ്റിപ്പോകാതെ
  rationale: പ്രധാനമായ ‘വഴിയിൽനിന്ന് തിരിയുക’ എന്ന അർഥം നടപ്പിന്റെ രൂപകത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; സന്ധി തെറ്റുക എന്ന വൈദ്യശാസ്ത്രസൂചന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἰαθῇ
  choice: സൗഖ്യം പ്രാപിക്കട്ടെ
  rationale: ἰάομαι എന്ന പദത്തിന്റെ രോഗശാന്തി/സൗഖ്യപ്രാപ്തി എന്ന അർഥവും ശരീരരൂപകവും നിലനിർത്തുന്നു.
- source_word: μᾶλλον
  choice: പകരം
  rationale: മുൻപത്തെ നിഷേധാത്മക ഫലത്തിനും അഭിലഷിതമായ സൗഖ്യത്തിനും ഇടയിലെ വ്യക്തമായ വൈരുധ്യം പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ശരീരസംബന്ധമായ ദൃശ്യഭാഷ അക്ഷരാർഥത്തിലോ രൂപകാർഥത്തിലോ എന്നത്
  choice: ‘മുടന്തുള്ളത്’, ‘സൗഖ്യം പ്രാപിക്കുക’ എന്നീ ശരീരസംബന്ധമായ പദങ്ങൾ നിലനിർത്തി, അവ ശാരീരിക ദൗർബല്യമോ ആത്മീയ/സാമൂഹിക ദൗർബല്യമോ എന്ന് പ്രധാനവാക്യത്തിൽ തീരുമാനിച്ചിട്ടില്ല.
  alternative: ‘മുടന്തുള്ളത്’ ആത്മീയമായി ദുർബലരായ വിശ്വാസികളെയോ പൊതുവായി അപകടസാധ്യതയിലുള്ളവരെയോ മാത്രം സൂചിപ്പിക്കുന്നു എന്ന് വ്യാഖ്യാനിക്കുക.
  rationale: ഗ്രീക്ക് വാക്യം ഉപദേശാത്മക സന്ദർഭത്തിൽ ശരീരരൂപകം പ്രയോഗിക്കുന്നു. പരാമർശത്തിന്റെ പരിധി ചുരുക്കാതെ അതിലെ യഥാർഥ അർഥവൈവിധ്യവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നതാണ് ഉചിതം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആജ്ഞാരൂപം ഉപയോഗിച്ചു. ‘മുടന്തുള്ളത്’ എന്ന നപുംസകപ്രയോഗം മൂലത്തിലെ τὸ χωλόν എന്നതിന്റെ ഉദ്ദേശ്യപൂർവമായ അനിശ്ചിതത്വം നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനവാക്യത്തിൽ ചേർത്തിട്ടുണ്ട്.
