id: HEB.12.10
reference: Hebrews 12:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ μὲν γὰρ πρὸς ὀλίγας ἡμέρας κατὰ τὸ δοκοῦν αὐτοῖς ἐπαίδευον, ὁ δὲ ἐπὶ τὸ συμφέρον εἰς τὸ μεταλαβεῖν τῆς ἁγιότητος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/010.yaml
  text: For they disciplined us for a few days as seemed best to them[a], but he does so for our benefit[b], so that we may share in his holiness.
translation:
  language: ml
  text: അവർ കുറച്ചുനാളത്തേക്ക്[a] തങ്ങൾക്കു ഉചിതമെന്നു തോന്നിയതനുസരിച്ച്[b] നമ്മെ ശിക്ഷണം നൽകിയിരുന്നു; അവനാകട്ടെ, നാം അവന്റെ വിശുദ്ധിയിൽ പങ്കാളികളാകേണ്ടതിന്, നമ്മുടെ നന്മയ്ക്കായി നമ്മെ ശിക്ഷിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘ഏതാനും ദിവസങ്ങൾക്കായി’; അഥവാ, ‘അല്പകാലത്തേക്ക്.’ ഈ ലോകത്തിലെ പിതാക്കന്മാരുടെ ശിക്ഷണം പരിമിതകാലത്തേക്കുള്ളതാണെന്ന് ഈ പ്രയോഗം ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘തങ്ങൾക്കു ശരിയെന്നു തോന്നിയതനുസരിച്ച്.’ ഇവിടെ അവരുടെ സ്വന്തം വിലയിരുത്തലാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ὀλίγας ἡμέρας
  choice: കുറച്ചുനാളത്തേക്കു
  rationale: ‘ഏതാനും ദിവസങ്ങൾക്കായി’ എന്ന അക്ഷരാർഥത്തെക്കാൾ സ്വാഭാവികമായി പരിമിതമായ കാലയളവ് സൂചിപ്പിക്കുകയും ഭൗമിക പിതാക്കന്മാരുടെ ശിക്ഷണത്തിന്റെ ഹ്രസ്വത നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: κατὰ τὸ δοκοῦν αὐτοῖς
  choice: തങ്ങൾക്കു ഉചിതമെന്നു തോന്നിയതനുസരിച്ച്
  rationale: അവരുടെ വിലയിരുത്തലിൽ ശരിയോ ഉചിതമോ ആയി തോന്നിയതിനെ സൂചിപ്പിക്കുന്നു; അവരുടെ തീരുമാനം നിർബന്ധമായും പിഴവറ്റതായിരുന്നു എന്നു പ്രസ്താവിക്കുന്നില്ല.
- source_word: ἐπαίδευον
  choice: ശിക്ഷണം നൽകി
  rationale: സന്ദർഭത്തിലെ παιδεύω ശിക്ഷ മാത്രമല്ല, മാതാപിതാക്കളുടെ തിരുത്തലും പരിശീലനവും ഉൾക്കൊള്ളുന്നതിനാൽ ‘ശിക്ഷണം’ എന്ന വിശാലമായ പദം തെരഞ്ഞെടുത്തു.
- source_word: ὁ δὲ
  choice: അവനാകട്ടെ ... നമ്മെ ശിക്ഷിക്കുന്നു
  rationale: ഗ്രീക്കിൽ ക്രിയയും ദൈവം എന്ന നാമവും സന്ദർഭത്തിൽനിന്ന് ഗ്രഹിക്കപ്പെടുന്നു. മലയാളത്തിൽ അർഥം സ്വാഭാവികമാക്കാൻ ക്രിയ ചേർത്തിട്ടും ‘ദൈവം’ എന്നു നേരിട്ട് ചേർക്കാതെ സർവനാമം നിലനിർത്തി.
- source_word: ἐπὶ τὸ συμφέρον
  choice: നമ്മുടെ നന്മയ്ക്കായി
  rationale: ദൈവിക ശിക്ഷണത്തിന്റെ ലക്ഷ്യം നമ്മുടെ പ്രയോജനമാണെന്ന ഉദ്ദേശ്യാർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: εἰς τὸ μεταλαβεῖν
  choice: പങ്കുചേരേണ്ടതിന്
  rationale: μεταλαμβάνω എന്നതിലെ പങ്കാളിത്തവും εἰς τό ഘടനയിലെ ലക്ഷ്യാർഥവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: ἁγιότητος αὐτοῦ
  choice: അവന്റെ വിശുദ്ധിയിൽ
  rationale: ദൈവത്തിനുള്ള വിശുദ്ധി എന്ന ഗുണത്തിൽ വിശ്വാസികൾ പങ്കുചേരുന്നതായി മൂലപാഠം പറയുന്ന വിധം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ὁ δὲ എന്ന ഏകവചന കർത്താവിന്റെ സൂചിത വ്യക്തി
  choice: സന്ദർഭത്തിൽ ദൈവത്തെ സൂചിപ്പിക്കുന്ന ‘അവൻ’ എന്ന സർവനാമം ഉപയോഗിച്ചു.
  alternative: വ്യക്തതയ്ക്കായി ‘ദൈവം’ എന്ന് നേരിട്ട് ചേർക്കുക.
  rationale: എബ്രായർ 12:5–11-ൽ ഭൗമിക പിതാക്കന്മാരും ദൈവവും തമ്മിലുള്ള വൈരുധ്യം വ്യക്തമാണ്. സർവനാമം ഉപയോഗിക്കുന്നത് മൂലപാഠത്തിന്റെ പരോക്ഷത സംരക്ഷിക്കുന്നു.
- issue: ‘അവന്റെ വിശുദ്ധിയിൽ പങ്കുചേരുക’ എന്നതിന്റെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തി
  choice: വിശുദ്ധീകരണത്തിന്റെ രീതി കൂടുതൽ നിർവചിക്കാതെ ദൈവത്തിന്റെ വിശുദ്ധിയിലെ പങ്കാളിത്തമായി വിവർത്തനം ചെയ്തു.
  alternative: ഇത് സ്ഥാനപരമായ വിശുദ്ധി മാത്രമായോ ക്രമാനുഗത വിശുദ്ധീകരണം മാത്രമായോ വ്യാഖ്യാനിക്കുക.
  rationale: വാക്യം ദൈവിക ശിക്ഷണത്തിന്റെ ലക്ഷ്യമായി വിശുദ്ധിയിലെ പങ്കാളിത്തം പ്രസ്താവിക്കുന്നുവെങ്കിലും അതിന്റെ പ്രവർത്തനരീതി ചുരുക്കി നിർവചിക്കുന്നില്ല; അതിനാൽ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക പ്രമാണ മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ശിക്ഷണം’ മാതാപിതാക്കളുടെ തിരുത്തൽ, പരിശീലനം, ശാസനം എന്നീ ആശയങ്ങൾ ഉൾക്കൊള്ളുന്ന വിശാലപദമായി ഉപയോഗിച്ചു. ‘അവനാകട്ടെ’ μὲν…δὲ എന്ന ശക്തമായ വൈരുധ്യം പ്രകടമാക്കുന്നു.
