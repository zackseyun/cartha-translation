  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλὰ προσεληλύθατε Σιὼν ὄρει καὶ πόλει θεοῦ ζῶντος, Ἰερουσαλὴμ ἐπουρανίῳ, καὶ μυριάσιν ἀγγέλων, πανηγύρει
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/022.yaml
  text: But you have come to Mount Zion and to the city of the living God[a], the heavenly Jerusalem, and to myriads of angels in festal gathering[b],
translation:
  language: ml
  text: എന്നാൽ നിങ്ങൾ സീയോൻ മലയിലേക്കും ജീവനുള്ള ദൈവത്തിന്റെ നഗരമായ സ്വർഗീയ യെരൂശലേമിലേക്കും ഉത്സവസമ്മേളനത്തിലുള്ള അസംഖ്യം ദൂതന്മാരുടെ[a][b] അടുക്കലേക്കും വന്നിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “അസംഖ്യം ദൂതന്മാരുടെ അടുക്കലേക്കും ഒരു ഉത്സവസമ്മേളനത്തിലേക്കും.” ‘ഉത്സവസമ്മേളനം’ എന്ന ഗ്രീക്ക് പദത്തെ ദൂതന്മാരോടു ചേർത്തോ പട്ടികയിലെ വേറൊരു ഘടകമായോ വായിക്കാം.'
    reason: alternative_reading
  - marker: b
    text: ‘അസംഖ്യം’ എന്നു പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്ക് പദത്തിന് അക്ഷരാർഥത്തിൽ ‘പതിനായിരങ്ങൾ’ എന്നും പൊതുവായി എണ്ണമറ്റ മഹാസമൂഹം എന്നും അർത്ഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: എന്നാൽ
  rationale: മുൻവാക്യങ്ങളിലെ സീനായി അനുഭവത്തോടുള്ള ശക്തമായ വൈരുധ്യം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: προσεληλύθατε
  choice: വന്നിരിക്കുന്നു
  rationale: പൂർണകാലരൂപം സൂചിപ്പിക്കുന്ന, മുമ്പ് സംഭവിച്ച സമീപനത്തിന്റെ ഇപ്പോഴും നിലനിൽക്കുന്ന ഫലം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: Σιὼν ὄρει
  choice: സീയോൻ മലയിലേക്ക്
  rationale: സ്ഥലനാമവും മല എന്ന ദൃശ്യബിംബവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: πόλει θεοῦ ζῶντος
  choice: ജീവനുള്ള ദൈവത്തിന്റെ നഗരം
  rationale: θεοῦ എന്ന ബന്ധസൂചക രൂപവും ζῶντος എന്ന ദൈവശാസ്ത്രപരമായി പ്രാധാന്യമുള്ള വിശേഷണവും സംരക്ഷിക്കുന്നു.
- source_word: Ἰερουσαλὴμ ἐπουρανίῳ
  choice: സ്വർഗീയ യെരൂശലേം
  rationale: മുൻപറഞ്ഞ ‘ജീവനുള്ള ദൈവത്തിന്റെ നഗരം’ എന്നതിനുള്ള സമാനാധികരണമായി സ്വാഭാവികവും നേരിട്ടുമായ വിവർത്തനം.
- source_word: μυριάσιν ἀγγέλων
  choice: അസംഖ്യം ദൂതന്മാർ
  rationale: μυριάς എന്നത് അക്ഷരാർഥത്തിൽ പതിനായിരങ്ങളെയോ പൊതുവായി എണ്ണമറ്റ വലിയ സമൂഹത്തെയോ സൂചിപ്പിക്കാം; മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായ പൊതുവർത്ഥം നൽകി അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: πανηγύρει
  choice: ഉത്സവസമ്മേളനമായി കൂടിയിരിക്കുന്ന
  rationale: ആഘോഷപരമായ പൊതുസമ്മേളനം എന്ന അർത്ഥം വ്യക്തമാക്കുകയും മുഖ്യവായനയിൽ ഇത് ദൂതന്മാരോടു ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: πανηγύρει എന്ന പദത്തിന്റെ വാക്യഘടനാപരമായ ബന്ധം
  choice: ‘ഉത്സവസമ്മേളനമായി കൂടിയിരിക്കുന്ന അസംഖ്യം ദൂതന്മാർ’ എന്നു ദൂതസമൂഹത്തോടു ബന്ധിപ്പിച്ചു.
  alternative: ‘അസംഖ്യം ദൂതന്മാരിലേക്കും ഒരു ഉത്സവസമ്മേളനത്തിലേക്കും’ എന്നു പട്ടികയിലെ വേറൊരു ഘടകമായി വായിക്കാം; അല്ലെങ്കിൽ 23-ാം വാക്യത്തിലെ ‘സഭ’യോടു ബന്ധിപ്പിക്കാം.
  rationale: തൊട്ടുമുമ്പുള്ള ‘ദൂതന്മാർ’ എന്നതിനോടു ചേർക്കുന്നത് അർത്ഥസമ്പന്നവും സാധാരണവുമായ വായനയാണ്. എന്നാൽ ഗ്രീക്ക് ദത്തിവ് പദപരമ്പര ഒന്നിലധികം ഘടനകൾ അനുവദിക്കുന്നതിനാൽ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ആദരപൂർണമായ മലയാളം. ‘സീയോൻ,’ ‘യെരൂശലേം’ എന്നീ പരമ്പരാഗത ബൈബിൾ സ്ഥലനാമങ്ങൾ നിലനിർത്തി. ദീർഘമായ ദത്തിവ് പട്ടിക മലയാളത്തിൽ വ്യക്തമായി വായിക്കാനായി ഓരോ ലക്ഷ്യത്തോടും ‘-ലേക്ക്/അടുക്കലേക്ക്’ പ്രയോഗിച്ചു; മൂലത്തിലെ വാക്യഘടനാപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
