translation:
  language: ml
  text: പാപത്തിനെതിരായ പോരാട്ടത്തിൽ, രക്തം ചൊരിയുന്നതുവരെയും നിങ്ങൾ ഇതുവരെ ചെറുത്തുനിന്നിട്ടില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങൾ ഇതുവരെ രക്തംവരെ ചെറുത്തുനിന്നിട്ടില്ല.” ഗ്രീക്കിൽ കൂടുതൽ അക്ഷരാർഥമായി, “രക്തംവരെ നിങ്ങൾ ഇതുവരെ ചെറുത്തുനിന്നിട്ടില്ല” എന്നാണ്; രക്തച്ചൊരിച്ചിലിന്റെ പരിധിവരെയുള്ള ചെറുത്തുനിൽപ്പിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔπω
  choice: ഇതുവരെ ... ഇല്ല
  rationale: വിവരിക്കുന്ന പരിധിയിൽ ഇനിയും എത്തിയിട്ടില്ലെന്ന കാലസൂചന സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: μέχρις αἵματος
  choice: രക്തം ചൊരിയേണ്ടിവരുന്നിടത്തോളം
  rationale: അക്ഷരാർഥത്തിൽ ‘രക്തംവരെ’ എന്ന ഗ്രീക്ക് പ്രയോഗം രക്തച്ചൊരിച്ചിലോ ഗുരുതരമായ ശാരീരിക പീഡനമോ വരെ എത്തുന്ന ചെറുത്തുനിൽപ്പിനെ സൂചിപ്പിക്കുന്നു; ആരുടെ രക്തമാണെന്ന് അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: ἀντικατέστητε
  choice: ചെറുത്തുനിന്നിട്ടില്ല
  rationale: എതിർത്തുനിൽക്കുക, പ്രതിരോധിക്കുക എന്ന ആശയം സംഘർഷത്തിന്റെ പശ്ചാത്തലത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: πρὸς τὴν ἁμαρτίαν
  choice: പാപത്തിനെതിരെയുള്ള
  rationale: πρός + accusative സൂചിപ്പിക്കുന്ന എതിർപ്പിനെ വ്യക്തമായി നൽകുന്നു; പാപത്തിന്റെ കൃത്യമായ സന്ദർഭപരമായ സൂചന നിർവചിക്കാതെ നിലനിർത്തുന്നു.
- source_word: ἀνταγωνιζόμενοι
  choice: നിങ്ങളുടെ പോരാട്ടത്തിൽ
  rationale: തുടർന്നുകൊണ്ടിരിക്കുന്ന കഠിനമത്സരമോ സംഘർഷമോ സൂചിപ്പിക്കുന്ന കായിക-യുദ്ധ രൂപകത്തെ ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ പകർന്നു നൽകുന്നു.
theological_decisions:
- issue: ‘പാപം’ എന്നതിന്റെ സന്ദർഭപരമായ സൂചന
  choice: ‘പാപം’ എന്നു പൊതുവായി നിലനിർത്തി
  alternative: പീഡകരുടെ പാപപൂർണമായ എതിർപ്പ്; പൊതുവായ പാപം; വിശ്വാസം ഉപേക്ഷിക്കാനുള്ള പ്രലോഭനം
  rationale: സമീപസന്ദർഭം ശത്രുത സഹിക്കുന്നതിനെയും പാപം ഉപേക്ഷിക്കുന്നതിനെയും ഉൾക്കൊള്ളുന്നു; എന്നാൽ വാക്യം തന്നെ സൂചനയെ ഒന്നിലേക്കു ചുരുക്കുന്നില്ല. അതിനാൽ ഗ്രീക്കിലെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തിയും സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, ഗൗരവമുള്ള മലയാളം. ‘രക്തംവരെ’ എന്ന അക്ഷരാർഥ പ്രയോഗത്തിന്റെ അസ്വാഭാവികത മുഖ്യവാചകത്തിൽ വിശദീകരിച്ച്, അതിന്റെ രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
