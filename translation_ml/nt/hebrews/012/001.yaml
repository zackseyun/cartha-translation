id: HEB.12.1
reference: Hebrews 12:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τοιγαροῦν καὶ ἡμεῖς, τοσοῦτον ἔχοντες περικείμενον ἡμῖν νέφος μαρτύρων, ὄγκον ἀποθέμενοι πάντα καὶ τὴν εὐπερίστατον ἁμαρτίαν, δι’ ὑπομονῆς τρέχωμεν τὸν προκείμενον ἡμῖν ἀγῶνα,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/001.yaml
  text: Therefore[a], since we also have so great a cloud of witnesses surrounding us, laying aside every weight and the sin that so easily entangles, let us run with endurance the race set before us,
translation:
  language: ml
  text: അതുകൊണ്ട്, നമ്മെ ചുറ്റിനിൽക്കുന്ന സാക്ഷികളുടെ ഇത്ര വലിയൊരു മേഘം നമുക്കും ഉള്ളതിനാൽ, എല്ലാ ഭാരവും എളുപ്പം കുരുക്കുന്ന പാപവും[a] നീക്കിവെച്ച്, നമ്മുടെ മുമ്പിൽ വെച്ചിരിക്കുന്ന ഓട്ടം സഹിഷ്ണുതയോടെ ഓടാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നമ്മോടു ചേർന്നുപറ്റുന്ന പാപം” എന്നോ “എളുപ്പം കെണിയിലാക്കുന്ന പാപം” എന്നോ പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് വിശേഷണം അപൂർവമാണ്; കുരുക്കുക, കെണിയിലാക്കുക, അടുത്തു പറ്റിച്ചേരുക എന്നിവയിൽ ഏതൊരു ഭാവത്തിനാണ് ഊന്നൽ എന്നത് അനിശ്ചിതമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοιγαροῦν
  choice: അതുകൊണ്ട്
  rationale: മുൻ അധ്യായത്തിലെ വിശ്വാസസാക്ഷ്യങ്ങളിൽനിന്ന് നിഗമനം അവതരിപ്പിക്കുന്ന ശക്തമായ അനുമാനബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τοσοῦτον ... νέφος μαρτύρων
  choice: സാക്ഷികളുടെ ഇത്ര വലിയൊരു മേഘം
  rationale: വമ്പിച്ച സമൂഹത്തെ സൂചിപ്പിക്കുന്ന ‘മേഘം’ എന്ന രൂപകം നിലനിർത്തുകയും τοσοῦτον എന്ന പദത്തിന്റെ തീവ്രത അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: περικείμενον ἡμῖν
  choice: നമ്മെ ചുറ്റിനിൽക്കുന്ന
  rationale: എല്ലാ വശത്തുമായി സ്ഥിതിചെയ്യുന്നു എന്ന സ്ഥലപരമായ ചിത്രം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: μάρτυρων
  choice: സാക്ഷികൾ
  rationale: എബ്രായർ 11-ലെ വിശ്വാസികളുടെ ജീവിതം വിശ്വാസത്തിനു സാക്ഷ്യം വഹിക്കുന്നു എന്ന അർഥം അനുവദിക്കുന്നു; അവർ ഓട്ടം കാണുന്ന പ്രേക്ഷകർ മാത്രമാണെന്ന വ്യാഖ്യാനം പരിഭാഷയിൽ അടിച്ചേൽപ്പിക്കുന്നില്ല.
- source_word: ὄγκον πάντα
  choice: എല്ലാ ഭാരവും
  rationale: ഓട്ടക്കാരനെ മന്ദഗതിയിലാക്കുന്ന ഭാരത്തിന്റെ കായികരൂപകം സംരക്ഷിക്കുന്നു; ‘തടസ്സം’ എന്ന വിശദീകരണപരമായ പരിഭാഷയെക്കാൾ മൂലചിത്രത്തോട് അടുത്തതാണ്.
- source_word: ἀποθέμενοι
  choice: നീക്കിവെച്ച്
  rationale: പ്രധാന ആഹ്വാനത്തിനു മുമ്പായോ അതോടൊപ്പമോ ഭാരവും പാപവും നിർണായകമായി ഉപേക്ഷിക്കുന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: εὐπερίστατον
  choice: എളുപ്പം കുരുക്കുന്ന
  rationale: ഓട്ടത്തിന്റെ പശ്ചാത്തലത്തിൽ ചലനത്തെ തടസ്സപ്പെടുത്തുന്ന അപകടം വ്യക്തമായി നൽകുന്നു. അപൂർവമായ ഈ ഗ്രീക്ക് പദത്തിന്റെ യഥാർഥ അർഥവ്യാപ്തി അനിശ്ചിതമായതിനാൽ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: ἁμαρτίαν
  choice: പാപം
  rationale: ഗ്രീക്കിലെ നിർദേശക ഉപപദം പാപത്തെ സന്ദർഭത്തിൽ ഒരു വ്യക്തമായ യാഥാർഥ്യമായി അവതരിപ്പിക്കുന്നു; എന്നാൽ ഏതെങ്കിലും പ്രത്യേക പാപത്തെ പേരെടുത്ത് നിർണയിക്കുന്നില്ല.
- source_word: δι’ ὑπομονῆς
  choice: സഹിഷ്ണുതയോടെ
  rationale: പ്രയാസത്തിനിടയിലും സ്ഥിരമായി നിലനിൽക്കുകയും മുന്നോട്ടുപോകുകയും ചെയ്യുന്ന ὑπομονήയുടെ ഭാവം ഓട്ടരൂപകത്തിന് യോജിച്ചവിധം നൽകുന്നു.
- source_word: τρέχωμεν
  choice: ഓടാം
  rationale: ഒന്നാംപുരുഷ ബഹുവചനത്തിലെ പ്രോത്സാഹനാത്മക ആഹ്വാനം സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: τὸν προκείμενον ἡμῖν ἀγῶνα
  choice: നമ്മുടെ മുമ്പിൽ വെച്ചിരിക്കുന്ന ഓട്ടം
  rationale: ἀγών എന്നതിന് മത്സരം, പോരാട്ടം എന്നീ അർഥങ്ങളും ഉണ്ടെങ്കിലും τρέχωμεν എന്ന ഓട്ടക്രിയ കാരണം ‘ഓട്ടം’ സന്ദർഭത്തിന് ഏറ്റവും യോജിക്കുന്നു; προκείμενον നിശ്ചയിക്കപ്പെട്ട പാതയുടെ ഭാവം നിലനിർത്തുന്നു.
theological_decisions:
- issue: എബ്രായർ 11-നോടുള്ള ബന്ധത്തിൽ ‘സാക്ഷികൾ’ എന്നതിന്റെ അർഥം
  choice: വിശ്വാസജീവിതത്താൽ സാക്ഷ്യം വഹിക്കുന്നവർ; ചുറ്റിനിൽക്കുന്ന ചിത്രം പ്രബോധനത്തിന് ശക്തി നൽകുന്നു
  alternative: വിശ്വാസികളുടെ ഓട്ടം നോക്കിക്കൊണ്ടിരിക്കുന്ന സ്വർഗീയ പ്രേക്ഷകരാണ് പ്രധാനമായും ഉദ്ദേശിക്കുന്നത്
  rationale: അടുത്ത സന്ദർഭം എബ്രായർ 11-ലെ വിശ്വാസമാതൃകകളിലേക്കാണ് വിരൽചൂണ്ടുന്നത്. ‘സാക്ഷികൾ’ എന്ന പദം അതേപടി നിലനിർത്തുന്നത് അവർ ഇപ്പോൾ സജീവമായി നിരീക്ഷിക്കുന്നു എന്ന ശക്തമായ വ്യാഖ്യാനം അടിച്ചേൽപ്പിക്കാതെ ഇരുസാധ്യതകളിലുമുള്ള വ്യാഖ്യാനാത്മക പിരിമുറുക്കം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘സാക്ഷികളുടെ മേഘം’, ‘ഭാരം’, ‘ഓട്ടം’ എന്നീ ബന്ധിത രൂപകങ്ങൾ സംരക്ഷിച്ചിരിക്കുന്നു; അപൂർവമായ εὐπερίστατον എന്ന പദത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചിരിക്കുന്നു.
