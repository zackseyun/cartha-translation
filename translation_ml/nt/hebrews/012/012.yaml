id: HEB.12.12
reference: Hebrews 12:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Διὸ τὰς παρειμένας χεῖρας καὶ τὰ παραλελυμένα γόνατα ἀνορθώσατε,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/012.yaml
  text: Therefore[a], strengthen your drooping hands and your weakened knees,
translation:
  language: ml
  text: അതുകൊണ്ട്[a], തളർന്ന കൈകളും ദുർബലമായ മുട്ടുകളും ബലപ്പെടുത്തുവിൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: ‘അതുകൊണ്ട്, തൂങ്ങിക്കിടക്കുന്ന കൈകളും ദുർബലമായ മുട്ടുകളും നിവർത്തുവിൻ.’ ഈ വാക്കുകൾ ഗ്രീക്ക് പാരമ്പര്യത്തിലെ യെശയ്യാവ് 35:3-നെ അനുസ്മരിപ്പിക്കുകയും പുതുക്കപ്പെട്ട ധൈര്യത്തിന്റെയും സഹനത്തിന്റെയും ശരീരരൂപകം ഉപയോഗിക്കുകയും ചെയ്യുന്നു.'
    reason: cross_reference
lexical_decisions:
- source_word: Διὸ
  choice: അതുകൊണ്ട്
  rationale: മുൻവിവരണത്തിൽനിന്ന് ഈ പ്രബോധനത്തിലേക്കുള്ള നിഗമനബന്ധം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി വ്യക്തമാക്കുന്നു.
- source_word: παρειμένας χεῖρας
  choice: തളർന്ന കൈകൾ
  rationale: താഴ്ന്നു തൂങ്ങുകയോ ശക്തിയറ്റിരിക്കുകയോ ചെയ്യുന്ന കൈകളുടെ ദൃശ്യരൂപം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: παραλελυμένα γόνατα
  choice: ദുർബലമായ മുട്ടുകൾ
  rationale: സന്ദർഭത്തിലെ ക്ഷീണത്തിന്റെയും തളർച്ചയുടെയും രൂപകം നിലനിർത്തുന്നു; വൈദ്യശാസ്ത്രപരമായ പക്ഷാഘാതമെന്ന തെറ്റായ ധാരണ ഒഴിവാക്കുന്നു.
- source_word: ἀνορθώσατε
  choice: ബലപ്പെടുത്തുവിൻ
  rationale: നിവർത്തുക, ഉയർത്തുക, പുനഃസ്ഥാപിക്കുക എന്നീ അർഥസാധ്യതകൾക്കിടയിൽ, സഹനത്തിൽ പുതുശക്തി നേടാനുള്ള ആഹ്വാനം സന്ദർഭോചിതമായി നൽകുന്നു; ശരീരാവയവങ്ങളുടെ രൂപകവും നിലനിൽക്കുന്നു.
theological_decisions:
- issue: ശാരീരിക ദൗർബല്യത്തിന്റെ രൂപകത്തിലുള്ള പ്രബോധനം
  choice: പുതിയ ധൈര്യത്തിനും സഹനത്തിനുമുള്ള ആഹ്വാനമായി ‘ബലപ്പെടുത്തുവിൻ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘തൂങ്ങിക്കിടക്കുന്ന കൈകളും ദുർബലമായ മുട്ടുകളും നിവർത്തുവിൻ’ എന്ന കൂടുതൽ പദാനുപദ പരിഭാഷ.
  rationale: എബ്രായർ 12-ലെ സമീപസന്ദർഭം സഹനം, ശിക്ഷണം, സ്ഥിരത എന്നിവയെക്കുറിച്ചാണ്. യെശയ്യാവ് 35:3-ന്റെ ഗ്രീക്ക് പാരമ്പര്യത്തെ അനുസ്മരിപ്പിക്കുന്ന ശരീരരൂപകം സംരക്ഷിക്കുമ്പോൾ അതിന്റെ പ്രബോധനശക്തിയും വ്യക്തമായി നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ബലപ്പെടുത്തുവിൻ’ എന്ന ബഹുവചന ആജ്ഞാരൂപം സമൂഹത്തെ അഭിസംബോധന ചെയ്യുന്ന ഗ്രീക്ക് ക്രിയയുടെ സ്വഭാവം നിലനിർത്തുന്നു; അടിക്കുറിപ്പിൽ കൂടുതൽ പദാനുപദ രൂപം നൽകിയിരിക്കുന്നു.
