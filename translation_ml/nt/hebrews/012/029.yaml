lexical_decisions:
- source_word: καὶ γὰρ
  choice: കാരണം
  rationale: γὰρ മുൻവാക്യത്തിലെ മുന്നറിയിപ്പിനും ആഹ്വാനത്തിനും വിശദീകരണപരമായ കാരണം നൽകുന്നു. καὶയുടെ ഊന്നൽ മലയാളത്തിൽ വേർതിരിച്ച് ചേർത്താൽ വാക്യം കൃത്രിമമാകുന്നതിനാൽ ബന്ധത്തിന്റെ സ്വാഭാവികതയിൽ ഉൾക്കൊള്ളിച്ചു.
- source_word: ὁ θεὸς ἡμῶν
  choice: നമ്മുടെ ദൈവം
  rationale: ഗ്രീക്കിലെ ഉടമസ്ഥതയും സമൂഹപരവും ഉടമ്പടിസംബന്ധവുമായ ഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: πῦρ
  choice: അഗ്നി
  rationale: രൂപകം വ്യാഖ്യാനിച്ച് മയപ്പെടുത്താതെ നേരിട്ട് പരിഭാഷപ്പെടുത്തി; ആവർത്തനപുസ്തകം 4:24-ലേക്കുള്ള പ്രതിധ്വനിയും ഇതിലൂടെ നിലനിൽക്കുന്നു.
- source_word: καταναλίσκον
  choice: ദഹിപ്പിക്കുന്ന
  rationale: വർത്തമാനകാല കർത്തൃവാചക കൃദന്തത്തിന്റെ പ്രവർത്തനാത്മക ഭാവം സ്വാഭാവികമായി നൽകുകയും അഗ്നി പൂർണമായി വിഴുങ്ങി നശിപ്പിക്കുന്നു എന്ന ആശയം പ്രകടമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ദൈവത്തെ അഗ്നിയായി വിശേഷിപ്പിക്കുന്ന രൂപകം
  choice: ‘നമ്മുടെ ദൈവം ദഹിപ്പിക്കുന്ന അഗ്നിയാണ്’ എന്ന നേരിട്ടുള്ള രൂപകം നിലനിർത്തി.
  alternative: ‘നമ്മുടെ ദൈവം ദഹിപ്പിക്കുന്ന അഗ്നിപോലെയാണ്’ / ‘നമ്മുടെ ദൈവം ദഹിപ്പിക്കുന്ന ഒരു അഗ്നിയാണ്’
  rationale: ഗ്രീക്കിൽ ഉപമാസൂചകം ഇല്ല; അതിനാൽ ‘പോലെ’ ചേർക്കുന്നത് വാക്യത്തിന്റെ ശക്തി കുറയ്ക്കും. നിർദേശക ആർട്ടിക്കിൾ ഇല്ലാത്ത ഗ്രീക്ക് വിധേയനാമത്തിന് മലയാളത്തിൽ ‘ഒരു’ നിർബന്ധമല്ല; അത് ഒഴിവാക്കുന്നത് ആവർത്തനപുസ്തകം 4:24-ന്റെ ശക്തമായ പ്രഖ്യാപനഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘തീ’ എന്നതിനെക്കാൾ തിരുവെഴുത്തിലെ രൂപകത്തിന്റെ ഔന്നത്യവും അന്തർപാഠബന്ധവും നിലനിർത്താൻ ‘അഗ്നി’ തിരഞ്ഞെടുത്തു.
