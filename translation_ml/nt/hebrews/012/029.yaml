translation:
  language: ml
  text: കാരണം, നമ്മുടെ ദൈവം ദഹിപ്പിക്കുന്ന അഗ്നിയാണ്.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ആവർത്തനപുസ്തകം 4:24-ന്റെ പ്രതിധ്വനി; അവിടെ ദൈവത്തെ ‘ദഹിപ്പിക്കുന്ന അഗ്നി’ എന്നു വിശേഷിപ്പിക്കുന്നു.
    reason: cross_reference
  - marker: b
