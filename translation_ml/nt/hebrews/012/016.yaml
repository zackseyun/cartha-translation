review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the two-person categories, naturally associates “like Esau” with βέβηλος rather than requiring Esau to be called sexually immoral, and renders Esau’s sale of his own birthright for one meal faithfully. However, “ദൈവികകാര്യങ്ങളെ അവഗണിക്കുന്നവൻ” is somewhat interpretive and less direct for βέβηλος, whose contextual force is profane—treating sacred things as common or of little value.
  naturalness: The prose is clear, but “ഒരൊറ്റ നേരത്തെ ഭക്ഷണം” is less idiomatic and slightly shifts “a single meal” toward a meal-time. “ഒരൊറ്റ ഭക്ഷണത്തിനുവേണ്ടി” is more direct. “വിശുദ്ധകാര്യങ്ങളെ നിസ്സാരമായി കാണുന്നവൻ” is natural modern Malayalam and conveys the contextual contrast.
  terminology: “ആദ്യജാതാവകാശം” is an appropriate established rendering of πρωτοτόκια. “ലൈംഗികമായി അധാർമികനായ” is concise and accurately represents πόρνος. Rendering βέβηλος with reference to sacred matters avoids importing the narrower doctrinal implication of “godless.”
  issues:
  - severity: low
    issue: βέβηλος is rendered as “ദൈവികകാര്യങ്ങളെ അവഗണിക്കുന്നവൻ.”
    rationale: This communicates the intended idea but is an expanded interpretation. “വിശുദ്ധകാര്യങ്ങളെ നിസ്സാരമായി കാണുന്നവൻ” more closely reflects profaneness in this context without implying merely a theoretical lack of belief in God.
  - severity: low
    issue: “ഒരൊറ്റ നേരത്തെ ഭക്ഷണത്തിനുവേണ്ടി” for βρώσεως μιᾶς.
    rationale: The Greek denotes one meal/serving; “നേരത്തെ” introduces a time-related nuance not expressed by the source.
  revised_text: ആരും ലൈംഗികമായി അധാർമികനായോ, ഏശാവിനെപ്പോലെ വിശുദ്ധകാര്യങ്ങളെ നിസ്സാരമായി കാണുന്നവനായോ ആകരുത്. അവൻ ഒരൊറ്റ ഭക്ഷണത്തിനുവേണ്ടി തന്റെ ആദ്യജാതാവകാശം വിറ്റുകളഞ്ഞു.
