id: HEB.12.16
reference: Hebrews 12:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μή τις πόρνος ἢ βέβηλος ὡς Ἠσαῦ, ὃς ἀντὶ βρώσεως μιᾶς ἀπέδετο τὰ πρωτοτόκια ⸀ἑαυτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/016.yaml
  text: that no one be sexually immoral or godless like Esau, who sold his own birthright for a single meal.
translation:
  language: ml
  text: ആരും ലൈംഗികമായി അധാർമികനായോ, ഏശാവിനെപ്പോലെ വിശുദ്ധകാര്യങ്ങളെ നിസ്സാരമായി കാണുന്നവനായോ ആകരുത്. അവൻ ഒരൊറ്റ ഭക്ഷണത്തിനുവേണ്ടി തന്റെ ആദ്യജാതാവകാശം വിറ്റുകളഞ്ഞു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πόρνος
  choice: ലൈംഗിക അധാർമികതയിൽ ഏർപ്പെടുന്നവൻ
  rationale: ലൈംഗികമായി അധാർമികനായ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് നാമത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: βέβηλος
  choice: ദൈവികകാര്യങ്ങളെ അവഗണിക്കുന്നവൻ
  rationale: വിശുദ്ധമല്ലാത്തത്, സാധാരണവത്കരിക്കുന്നത്, വിശുദ്ധകാര്യങ്ങൾക്ക് വിലകൽപ്പിക്കാത്തത് എന്നീ അർഥവ്യാപ്തി ഉൾക്കൊള്ളുന്നു; ദൈവം ഇല്ലെന്ന സിദ്ധാന്തപരമായ നിലപാട് മാത്രം സൂചിപ്പിക്കാവുന്ന പദം ഒഴിവാക്കുന്നു.
- source_word: πρωτοτόκια
  choice: ആദ്യജാതാവകാശം
  rationale: ആദ്യജാതനു ലഭിക്കുന്ന പ്രത്യേക അവകാശത്തെയും പദവിയെയും സൂചിപ്പിക്കുന്ന സന്ദർഭോചിതമായ പദം.
- source_word: ἀντὶ βρώσεως μιᾶς
  choice: ഒരൊറ്റ നേരത്തെ ഭക്ഷണത്തിനുവേണ്ടി
  rationale: ഒരു ഭക്ഷണം എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ മൂല്യവിനിമയഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀπέδετο
  choice: വിറ്റുകളഞ്ഞു
  rationale: വിൽക്കുക എന്ന ക്രിയയുടെ മധ്യരൂപം നടത്തിയ ഇടപാടിന്റെ അന്തിമത്വത്തോടെ ലളിതമായി പകരുന്നു.
theological_decisions:
- issue: βέβηλος എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ദൈവികകാര്യങ്ങളെ അവഗണിക്കുന്നവൻ
  alternative: ദൈവഭക്തിയില്ലാത്തവൻ / അശുദ്ധൻ
  rationale: ഏശാവ് ആദ്യജാതാവകാശത്തെ നിസ്സാരമാക്കിയ സന്ദർഭത്തിൽ വിശുദ്ധമായ കാര്യങ്ങൾക്ക് വിലകൽപ്പിക്കാത്ത മനോഭാവമാണ് മുഖ്യം. ദൈവനിഷേധം മാത്രം ധ്വനിപ്പിക്കാതെയും ആചാരപരമായ അശുദ്ധിയിലേക്കു ചുരുക്കാതെയും അർഥം നിലനിർത്തുന്നു.
- issue: πόρνος, βέβηλος എന്നീ വിശേഷണങ്ങളും ഏശാവുമായുള്ള ബന്ധവും
  choice: രണ്ടും നിരോധിത വ്യക്തിവർഗങ്ങളായി അവതരിപ്പിച്ച് ‘ഏശാവിനെപ്പോലെ’ രണ്ടാമത്തേതിനോട് ചേർത്തു
  alternative: ഏശാവിനെ ലൈംഗിക അധാർമികനും ദൈവികകാര്യങ്ങളെ അവഗണിക്കുന്നവനുമായി ഒരുപോലെ വിശേഷിപ്പിക്കുക
  rationale: ഗ്രീക്ക് വാക്യഘടനയിൽ ὡς Ἠσαῦ എന്നത് βέβηλος എന്നതിനോടാണ് ഏറ്റവും സ്വാഭാവികമായി ചേരുന്നത്; ഏശാവിനെ πόρνος എന്നും നിർബന്ധമായി വിളിക്കുന്ന വ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ഗദ്യശൈലി. ‘ആദ്യജാതാവകാശം’ പോലുള്ള ബൈബിൾസന്ദർഭ പദം നിലനിർത്തിയപ്പോൾ അപരിചിതമായ ‘ലൗകികൻ/അപവിത്രൻ’ എന്ന ഒറ്റപ്പദത്തിനു പകരം βέβηλος എന്നതിന്റെ സന്ദർഭാർഥം വ്യക്തമായി പറഞ്ഞു.
