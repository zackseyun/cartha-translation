id: HEB.12.26
reference: Hebrews 12:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὗ ἡ φωνὴ τὴν γῆν ἐσάλευσεν τότε, νῦν δὲ ἐπήγγελται λέγων· Ἔτι ἅπαξ ἐγὼ ⸀σείσω οὐ μόνον τὴν γῆν ἀλλὰ καὶ τὸν οὐρανόν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/026.yaml
  text: whose voice shook the earth then[a], but now he has promised, saying[b], “Yet once more I will shake not only the earth but also the heaven.”
translation:
  language: ml
  text: 'അന്ന് അവന്റെ ശബ്ദം ഭൂമിയെ കുലുക്കി; എന്നാൽ ഇപ്പോൾ അവൻ ഇങ്ങനെ[a] വാഗ്ദാനം ചെയ്തിരിക്കുന്നു: “ഇനി ഒരിക്കൽക്കൂടി ഞാൻ ഭൂമിയെ മാത്രമല്ല, ആകാശത്തെയും[b] കുലുക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹഗ്ഗായി 2:6-ൽനിന്നുള്ള ഉദ്ധരണി.
    reason: cross_reference
  - marker: b
    text: അഥവാ “സ്വർഗത്തെയും.” ഗ്രീക്കിൽ ഈ പദം ഏകവചനത്തിലും നിർദിഷ്ടത സൂചിപ്പിക്കുന്ന ആർട്ടിക്കിളോടുകൂടിയുമാണ്; അക്ഷരാർഥത്തിൽ “ആ ആകാശത്തെ/സ്വർഗത്തെ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ ἡ φωνὴ
  choice: അവന്റെ ശബ്ദം
  rationale: ബന്ധസർവനാമത്തിന്റെ ഷഷ്ഠിവിഭക്തിരൂപം മുൻസന്ദർഭത്തിലെ ദൈവത്തെ സൂചിപ്പിക്കുന്നു. ‘അവന്റെ ശബ്ദം’ എന്നത് ആ ബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐσάλευσεν / σείσω
  choice: കുലുക്കി / കുലുക്കും
  rationale: ഭൂമിയെയും ആകാശത്തെയും ബാധിക്കുന്ന ശക്തമായ ചലനത്തിന്റെ ദൃശ്യഭാവം ‘കുലുക്കുക’ വ്യക്തമായും ഒരേപദബന്ധത്തോടെയും നൽകുന്നു.
- source_word: τὴν γῆν
  choice: ഭൂമിയെ
  rationale: οὐρανόν എന്നതിനോടുള്ള സമഗ്രമായ വൈരുധ്യം കണക്കിലെടുത്ത്, പ്രാദേശികമായ ‘ദേശം’ എന്നതിനു പകരം സൃഷ്ടിയിലെ ഭൂമണ്ഡലത്തെ സൂചിപ്പിക്കുന്ന ‘ഭൂമി’ തിരഞ്ഞെടുത്തു.
- source_word: τότε / νῦν δὲ
  choice: അന്ന് / എന്നാൽ ഇപ്പോൾ
  rationale: കഴിഞ്ഞ സംഭവവും ഇപ്പോഴും പ്രാബല്യത്തിലുള്ള വാഗ്ദാനവും തമ്മിലുള്ള കാലപരവും വൈരുധ്യാത്മകവുമായ ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἐπήγγελται λέγων
  choice: ഇങ്ങനെ വാഗ്ദാനം ചെയ്തിരിക്കുന്നു
  rationale: ഗ്രീക്ക് പൂർണകാലത്തിന്റെ ഇപ്പോഴും നിലനിൽക്കുന്ന ഫലം ‘ചെയ്തിരിക്കുന്നു’ സൂചിപ്പിക്കുന്നു; ഉദ്ധരണിയിലേക്കുള്ള λέγων എന്ന ബന്ധം ‘ഇങ്ങനെ’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: Ἔτι ἅπαξ
  choice: ഇനി ഒരിക്കൽക്കൂടി
  rationale: ἔτιയുടെ ഭാവികാലസൂചനയും ἅπαξയുടെ ‘ഒരിക്കൽക്കൂടി’ എന്ന ഊന്നലും സംരക്ഷിക്കുന്നു.
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: മാത്രമല്ല ... -ത്തെയും
  rationale: ഗ്രീക്കിലെ സഹബന്ധഘടന മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: τὸν οὐρανόν
  choice: ആകാശത്തെയും
  rationale: ഭൂമിയോടൊപ്പം വരുന്ന വിശാലമായ സൃഷ്ടിമണ്ഡലത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു. ‘സ്വർഗം’ എന്ന സാധ്യമായ അർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തിയിരിക്കുന്നു.
theological_decisions:
- issue: ബന്ധസർവനാമത്തിന്റെയും വാഗ്ദാനം ചെയ്യുന്നവന്റെയും സൂചിതവ്യക്തി
  choice: മുൻസന്ദർഭത്തിലെ ദൈവത്തെ ‘അവന്റെ’ എന്നും ‘അവൻ’ എന്നും സൂചിപ്പിച്ചു.
  alternative: വ്യക്തിപരമായ ദൈവസൂചന മങ്ങിയ ഒരു നിർവ്യക്ത പ്രയോഗം
  rationale: മുൻസന്ദർഭവും ഹഗ്ഗായിയിലെ ഉദ്ധരണിയും ദൈവമാണ് സംസാരിക്കുന്നതെന്ന് വ്യക്തമാക്കുന്നു; എന്നാൽ വാക്യത്തിൽ ഇല്ലാത്ത ഒരു ദൈവനാമം ചേർത്തിട്ടില്ല.
- issue: ഭൂമി–ആകാശം എന്ന പ്രയോഗത്തിന്റെ വ്യാപ്തി
  choice: വിശാലമായ സൃഷ്ടിമണ്ഡലങ്ങളെ സൂചിപ്പിക്കുന്ന ‘ഭൂമി’യും ‘ആകാശം’യും ഉപയോഗിച്ചു.
  alternative: പ്രാദേശിക അർഥത്തിലുള്ള ‘ദേശം’യും പരിമിതമായ ‘വാനമണ്ഡലം’യും; അല്ലെങ്കിൽ ‘സ്വർഗം’
  rationale: ഗ്രീക്കിലെ ജോടിയുടെ പ്രാപഞ്ചിക വ്യാപ്തി നിലനിർത്തുകയും സംഭവത്തിന്റെ രീതി അനാവശ്യമായി നിർവചിക്കാതിരിക്കുകയും ചെയ്യുന്നു. οὐρανός എന്നതിലെ ‘സ്വർഗം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. വാക്യബന്ധം വ്യക്തമായി വരാൻ ഗ്രീക്കിലെ ബന്ധവാക്യം നേരിട്ടുള്ള വാക്യക്രമത്തിലാക്കി; കാലവൈരുധ്യവും ഉദ്ധരണിയുടെ പ്രവാചകശക്തിയും സംരക്ഷിച്ചു.
