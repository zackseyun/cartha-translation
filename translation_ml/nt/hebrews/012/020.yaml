id: HEB.12.20
reference: Hebrews 12:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐκ ἔφερον γὰρ τὸ διαστελλόμενον· Κἂν θηρίον θίγῃ τοῦ ὄρους, λιθοβοληθήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/020.yaml
  text: 'For they could not endure what was being commanded: “If even an animal touches the mountain[a], it will be stoned.”'
translation:
  language: ml
  text: 'എന്തെന്നാൽ, കല്പിക്കപ്പെട്ടത് അവർക്ക് സഹിക്കാനായില്ല: “ഒരു മൃഗംപോലും മലയിൽ തൊട്ടാൽ[a] അതു കല്ലെറിഞ്ഞു കൊല്ലപ്പെടും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികൾ പുറപ്പാട് 19:12–13-നെ പ്രതിധ്വനിപ്പിച്ചുകൊണ്ട്, “അല്ലെങ്കിൽ അമ്പെയ്തു കൊല്ലപ്പെടും” എന്നു കൂടി ചേർക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: οὐκ ἔφερον
  choice: അവർക്കു സഹിക്കാനായില്ല
  rationale: നിഷേധത്തോടുകൂടിയ φέρω ഇവിടെ ‘സഹിക്കുക’ എന്ന അർഥത്തിലാണ്. അസഹ്യതയും കഴിവില്ലായ്മയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: γὰρ
  choice: കാരണം
  rationale: γάρ മുൻവാക്യത്തെ വിശദീകരിക്കുന്ന കാരണബന്ധം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘കാരണം’ ആ ബന്ധം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: τὸ διαστελλόμενον
  choice: കല്പിക്കപ്പെട്ടത്
  rationale: διαστέλλομαι എന്ന വർത്തമാന കർമണി കൃദന്തരൂപം അധികാരപൂർവമായ നിർദേശം കല്പിക്കപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘കല്പിക്കപ്പെട്ടത്’ ഗ്രീക്കിലെ നാമവൽക്കരിച്ച പ്രയോഗവും കർമണിഭാവവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: Κἂν
  choice: ഒരു … പോലും … തൊട്ടാൽ
  rationale: καί + ἐάν നൽകുന്ന ഊന്നലോടുകൂടിയ നിബന്ധന മലയാളത്തിലെ ‘പോലും …-ാൽ’ ഘടന സ്വാഭാവികമായി പകർന്നു നൽകുന്നു.
- source_word: θηρίον
  choice: ഒരു മൃഗം
  rationale: θηρίον ഇവിടെ പൊതുവായി ഒരു മൃഗത്തെ സൂചിപ്പിക്കുന്നു; ‘വന്യമൃഗം’ എന്നു പറഞ്ഞാൽ മൂലപാഠത്തിലില്ലാത്ത പരിമിതി വരാം.
- source_word: θίγῃ
  choice: തൊട്ടാൽ
  rationale: നിബന്ധനാവാക്യത്തിലെ aorist subjunctive മലയാളത്തിൽ ‘തൊട്ടാൽ’ എന്ന ലളിത നിബന്ധനാരൂപത്തിൽ സ്വാഭാവികമായി പ്രതിഫലിക്കുന്നു.
- source_word: τοῦ ὄρους
  choice: മലയിൽ
  rationale: θιγγάνω-വിനോടുള്ള genitive സ്പർശത്തിന്റെ വസ്തുവിനെ സൂചിപ്പിക്കുന്നു. സന്ദർഭം സീനായിയെ വ്യക്തമാക്കുന്നുവെങ്കിലും ഈ വാക്യത്തിലെ ഗ്രീക്ക് ‘മല’ എന്നു മാത്രമായതിനാൽ അതുതന്നെ നിലനിർത്തുന്നു.
- source_word: λιθοβοληθήσεται
  choice: അതിനെ കല്ലെറിഞ്ഞു കൊല്ലണം
  rationale: λιθοβολέω എന്നത് ശിക്ഷയായി കല്ലെറിഞ്ഞു കൊല്ലുന്നതിനെ സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിലെ future passive ഇവിടെ ഉദ്ധരിക്കപ്പെടുന്ന നിയമകല്പനയുടെ നിർബന്ധബലം വഹിക്കുന്നതിനാൽ മലയാളത്തിൽ ‘കൊല്ലണം’ എന്നു സ്വാഭാവികമായി നൽകുകയും കർമണി അർഥം ‘അതിനെ’ വഴി വ്യക്തമാക്കുകയും ചെയ്തു.
theological_decisions:
- issue: സീനായി കല്പനയുമായുള്ള ഉദ്ധരണിയുടെ ബന്ധം
  choice: നൽകിയിരിക്കുന്ന SBLGNT പാഠത്തിലുള്ള ‘അതിനെ കല്ലെറിഞ്ഞു കൊല്ലണം’ എന്നിടത്ത് ഉദ്ധരണം അവസാനിപ്പിച്ചു.
  alternative: പുറപ്പാട് 19:12–13-നോട് അനുരൂപമാക്കി ‘അല്ലെങ്കിൽ അമ്പെയ്തു കൊല്ലണം’ എന്നു മുഖ്യപാഠത്തിൽ ചേർക്കുക.
  rationale: ചില കൈയെഴുത്തുപ്രതികളിൽ വിപുലീകരിച്ച വാചകം ഉണ്ടെങ്കിലും നൽകിയിരിക്കുന്ന ഗ്രീക്ക് പാഠത്തിൽ അത് ഇല്ല. അതിനാൽ മുഖ്യപാഠം സമന്വയിപ്പിച്ച് വികസിപ്പിക്കാതെ പാഠഭേദം അടിക്കുറിപ്പിൽ മാത്രം രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. ‘കല്പിക്കപ്പെട്ടത്’ എന്ന രൂപം നിയമകല്പനയുടെ ഭാവം സൂക്ഷിക്കുന്നു; ‘കല്ലെറിഞ്ഞു കൊല്ലണം’ ശിക്ഷയുടെ സ്വഭാവവും നിർബന്ധബലവും വ്യക്തമായി നൽകുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ‘മലയിൽ തൊട്ടാൽ’ എന്ന ഭാഗത്തിനു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
