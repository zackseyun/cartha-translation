id: HEB.12.3
reference: Hebrews 12:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀναλογίσασθε γὰρ τὸν τοιαύτην ὑπομεμενηκότα ὑπὸ τῶν ἁμαρτωλῶν εἰς ⸀ἑαυτοὺς ἀντιλογίαν, ἵνα μὴ κάμητε ταῖς ψυχαῖς ὑμῶν ἐκλυόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/003.yaml
  text: For consider the one who endured such opposition from sinners against himself[a], so that you may not grow weary[b], becoming discouraged in your souls.
translation:
  language: ml
  text: പാപികൾ തങ്ങൾക്കുതന്നെ എതിരായി[a] നടത്തിയ ഇത്തരമൊരു എതിർപ്പ് സഹിച്ചവനെക്കുറിച്ച് ചിന്തിച്ചുനോക്കുവിൻ; അങ്ങനെ നിങ്ങൾ ക്ഷീണിച്ചുപോകാതെയും ഉള്ളിൽ തളരാതെയും ഇരിക്കേണ്ടതിനായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘അവനുതന്നെ എതിരായി’ എന്നു വായിക്കുന്നു. SBLGNT പാഠത്തിൽ ‘തങ്ങൾക്കുതന്നെ എതിരായി’ എന്നാണ്. സന്ദർഭത്തിൽ എതിർപ്പ് യേശുവിനെതിരെയാണ് നടത്തപ്പെട്ടത്.
    reason: textual_variant
lexical_decisions:
- source_word: Ἀναλογίσασθε
  choice: ചിന്തിച്ചുനോക്കുവിൻ
  rationale: മനഃപൂർവം ആലോചിക്കുകയും ശ്രദ്ധാപൂർവം പരിഗണിക്കുകയും ചെയ്യാനുള്ള ആജ്ഞയാണ്. ആഹ്വാനത്തിന്റെ ശക്തി നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി കേൾക്കുന്നു.
- source_word: τοιαύτην
  choice: ഇത്തരമൊരു
  rationale: എതിർപ്പിന്റെ സ്വഭാവത്തെയോ അളവിനെയോ സൂചിപ്പിക്കുന്ന വിശാലമായ ഊന്നൽ നിലനിർത്തുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത കൃത്യമായ അളവ് ചേർക്കുന്നില്ല.
- source_word: ὑπομεμενηκότα
  choice: സഹിച്ചവനെ
  rationale: ὑπομένω എന്ന ക്രിയയുടെ പൂർണ്ണകാല കൃദന്തരൂപം കഴിഞ്ഞ സഹനത്തെയും അതിന്റെ നിലനിൽക്കുന്ന പ്രസക്തിയെയും സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ ‘സഹിക്കുക’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: ἁμαρτωλῶν
  choice: പാപികൾ
  rationale: പാപസ്വഭാവമുള്ളവരെ സൂചിപ്പിക്കുന്ന നാമവൽക്കരിച്ച വിശേഷണം നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: ἀντιλογίαν
  choice: എതിർപ്പ്
  rationale: വാക്കാലുള്ള എതിർപ്പും വിശാലമായ വിരോധവും ഉൾക്കൊള്ളാൻ കഴിയുന്ന പദം; ‘വൈരാഗ്യം’ എന്നതിനെക്കാൾ മൂലപദത്തിന്റെ അർത്ഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: εἰς ἑαυτοὺς
  choice: തങ്ങൾക്കുതന്നെ എതിരായി
  rationale: SBLGNT-യിലെ ബഹുവചന ആത്മവാചക സർവനാമത്തെ പ്രധാന പാഠത്തിൽ നേരിട്ട് നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ അസാധാരണമായി തോന്നുന്ന ഈ വായനയെ നിശ്ശബ്ദമായി തിരുത്താതെ പാഠഭേദം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: κάμητε
  choice: ക്ഷീണിച്ചുപോകാതിരിക്കട്ടെ
  rationale: ശ്രമത്താലോ കഷ്ടതയാലോ ക്ഷീണിച്ചുപോകുക എന്ന അടിസ്ഥാന അർത്ഥം നൽകുന്നു; ഉപദേശാത്മക സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: ταῖς ψυχαῖς ὑμῶν
  choice: ഉള്ളിൽ
  rationale: ψυχή ഇവിടെ ആന്തരിക ജീവനെ അഥവാ വ്യക്തിയുടെ ഉള്ളത്തെ സൂചിപ്പിക്കുന്നു. പദാനുപദമായ ‘ആത്മാക്കളിൽ’ എന്ന അസ്വാഭാവിക പ്രയോഗം ഒഴിവാക്കി അർത്ഥം വ്യക്തമായി നൽകുന്നു.
- source_word: ἐκλυόμενοι
  choice: തളർന്ന്
  rationale: ഉത്സാഹം നഷ്ടപ്പെടുക, തളരുക, വിട്ടുകളയാൻ തുടങ്ങുക എന്നീ ആശയങ്ങൾ ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളം; κάμητε-യോടുള്ള വ്യത്യാസവും കഴിയുന്നത്ര നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘സഹിച്ചവൻ’ ആരെയാണ് സൂചിപ്പിക്കുന്നത്
  choice: പേര് ഈ വാക്യത്തിൽ ചേർക്കാതെ ‘സഹിച്ചവൻ’ എന്നു നിലനിർത്തി
  alternative: ‘യേശു’ എന്ന് വ്യക്തമായി ചേർക്കുക
  rationale: തൊട്ടുമുമ്പുള്ള 12:2 യേശുവിനെയാണ് മാതൃകയായി ചൂണ്ടിക്കാണിക്കുന്നത്. എന്നാൽ ഈ വാക്യത്തിലെ ഗ്രീക്ക് പേര് ആവർത്തിക്കുന്നില്ല; അതിനാൽ സന്ദർഭം സൂചിപ്പിക്കുന്ന പരാമർശം അതേപടി നിലനിർത്തുന്നു.
- issue: εἰς ἑαυτούς എന്ന പാഠഭേദത്തിന്റെ അർത്ഥം
  choice: SBLGNT-യിലെ ‘തങ്ങൾക്കുതന്നെ എതിരായി’ എന്ന ബഹുവചന വായന പ്രധാന പാഠത്തിൽ നിലനിർത്തി
  alternative: ചില കൈയെഴുത്തുപ്രതികളിലെ ‘അവനുതന്നെ എതിരായി’ എന്ന ഏകവചന വായന പ്രധാന പാഠത്തിൽ സ്വീകരിക്കുക
  rationale: നൽകിയിരിക്കുന്ന മൂലപാഠത്തെ മുൻഗണന നൽകി അതിലെ ദുഷ്കരവും യഥാർഥവുമായ വായന സംരക്ഷിക്കുന്നു. എതിർപ്പ് യേശുവിനെതിരെയാണെന്ന സന്ദർഭബോധവും പ്രധാന പാഠഭേദവും അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു; അതുവഴി വ്യാഖ്യാനപരമായ സംഘർഷം മറച്ചുവയ്ക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്കിന്റെ ഉപദേശാത്മക ഭാവം നിലനിർത്താൻ ‘ചിന്തിച്ചുനോക്കുവിൻ’ ഉപയോഗിച്ചു. ‘മനസ്സിൽ’ എന്നതിനെക്കാൾ വിശാലമായി ആന്തരിക വ്യക്തിത്വത്തെ സൂചിപ്പിക്കാൻ ‘ഉള്ളിൽ’ തിരഞ്ഞെടുത്തു. SBLGNT-യിലെ ദുഷ്കരമായ ബഹുവചന വായന പ്രധാന പാഠത്തിൽ സംരക്ഷിച്ച് പാഠഭേദം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
