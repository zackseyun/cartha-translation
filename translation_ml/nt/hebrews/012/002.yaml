id: HEB.12.2
reference: Hebrews 12:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀφορῶντες εἰς τὸν τῆς πίστεως ἀρχηγὸν καὶ τελειωτὴν Ἰησοῦν, ὃς ἀντὶ τῆς προκειμένης αὐτῷ χαρᾶς ὑπέμεινεν σταυρὸν αἰσχύνης καταφρονήσας, ἐν δεξιᾷ τε τοῦ θρόνου τοῦ θεοῦ κεκάθικεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/002.yaml
  text: fixing our eyes on Jesus[a], the pioneer and perfecter of faith, who for the joy set before him endured the cross, despising the shame[b], and has sat down at the right hand of the throne of God.
translation:
  language: ml
  text: വിശ്വാസത്തിന്റെ വഴിതുറന്നവനും അതിനെ പൂർണതയിലെത്തിക്കുന്നവനുമായ യേശുവിലേക്കു ദൃഷ്ടി ഉറപ്പിച്ചുകൊണ്ട്[a], തന്റെ മുമ്പിൽ വെച്ചിരുന്ന സന്തോഷത്തെ മുൻനിർത്തി അവൻ ക്രൂശ് സഹിച്ചു; അപമാനം വകവെക്കാതെ[b], ദൈവത്തിന്റെ സിംഹാസനത്തിന്റെ വലത്തുഭാഗത്ത് ഇരുന്നിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “വിശ്വസ്തതയുടെ വഴിതുറന്നവനും അതിനെ പൂർണതയിലെത്തിക്കുന്നവനുമായ യേശുവിലേക്കു”; അല്ലെങ്കിൽ: “നമ്മുടെ വിശ്വാസത്തിന്റെ വഴിതുറന്നവനും അതിനെ പൂർണതയിലെത്തിക്കുന്നവനുമായ യേശുവിലേക്കു.” ഗ്രീക്ക് പ്രയോഗം സംക്ഷിപ്തമാണ്; πίστις എന്ന പദത്തിന് ‘വിശ്വാസം’ എന്നും ‘വിശ്വസ്തത’ എന്നും അർഥമാകാം.'
    reason: alternative_reading
  - marker: b
    text: 'അഥവാ: “അപമാനത്തെ നിസ്സാരമായി കണ്ട്.” ക്രൂശുമരണത്തിന്റെ അപകീർത്തിയെ തന്നെ നിയന്ത്രിക്കുന്ന നിർണായക കാര്യമാകാൻ അവൻ അനുവദിച്ചില്ല എന്നതാണ് ആശയം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφορῶντες εἰς
  choice: നമ്മുടെ ദൃഷ്ടി ഉറപ്പിച്ചുകൊണ്ട്
  rationale: മറ്റുള്ളവയിൽനിന്ന് ശ്രദ്ധ മാറ്റി ഒരു ലക്ഷ്യത്തിലേക്ക് ഏകാഗ്രമായി നോക്കുക എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ἀρχηγὸν
  choice: വഴിതുറന്നവൻ
  rationale: തുടക്കം കുറിക്കുന്നവൻ, മുന്നിൽ നടന്ന് വഴി കാണിക്കുന്നവൻ എന്നീ സന്ദർഭോചിത ഭാവങ്ങൾ ഉൾക്കൊള്ളുന്നു.
- source_word: τελειωτὴν
  choice: പൂർണതയിലെത്തിക്കുന്നവൻ
  rationale: ഉദ്ദേശിച്ച സമാപ്തിയിലേക്കോ പൂർണതയിലേക്കോ കൊണ്ടുവരുന്നവൻ എന്ന അർഥം വ്യക്തമാക്കുന്നു.
- source_word: τῆς πίστεως
  choice: വിശ്വാസത്തിന്റെ
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തമായ ഷഷ്ഠീവാക്യം ‘നമ്മുടെ’ എന്നു ചേർക്കാതെ നിലനിർത്തുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἀντὶ τῆς προκειμένης αὐτῷ χαρᾶς
  choice: തന്റെ മുമ്പിൽ വെച്ചിരുന്ന സന്തോഷം ലക്ഷ്യമാക്കി
  rationale: മുമ്പിലുള്ള സന്തോഷം സഹനത്തിന് പ്രേരകമായ പ്രതീക്ഷയായിരുന്നു എന്ന സന്ദർഭാർഥം നൽകുന്നു; ‘പകരം’ എന്ന സാധ്യതയെ അനാവശ്യമായി മുഖ്യവാചകത്തിൽ ഉറപ്പിക്കുന്നില്ല.
- source_word: ὑπέμεινεν σταυρὸν
  choice: ക്രൂശ് സഹിച്ചു
  rationale: കഷ്ടതയ്ക്കു കീഴിൽ ഉറച്ചുനിൽക്കുന്ന സഹനത്തിന്റെ ആശയം ചുരുക്കവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: αἰσχύνης καταφρονήσας
  choice: അപമാനം വകവെക്കാതെ
  rationale: ക്രൂശുമരണത്തിന്റെ അപകീർത്തിയെ നിർണായകമായി കണക്കാക്കാതിരിക്കുക എന്ന ഭാവം ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐν δεξιᾷ ... τοῦ θρόνου τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ സിംഹാസനത്തിന്റെ വലത്തുഭാഗത്ത്
  rationale: ബഹുമാനത്തിന്റെയും അധികാരത്തിന്റെയും സ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന മൂലരൂപകം നിലനിർത്തുന്നു.
- source_word: κεκάθικεν
  choice: ഇരിക്കുകയും ചെയ്തിരിക്കുന്നു
  rationale: പൂർത്തിയായ പ്രവൃത്തിയുടെ തുടരുന്ന ഫലം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് perfect-ന്റെ ഭാവം മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: τῆς πίστεως എന്നതിന്റെ പരിധി
  choice: ‘വിശ്വാസത്തിന്റെ’ എന്നു സംക്ഷിപ്തമായി നിലനിർത്തി
  alternative: ‘നമ്മുടെ വിശ്വാസത്തിന്റെ’ അല്ലെങ്കിൽ ‘വിശ്വസ്തതയുടെ’
  rationale: മൂലപാഠത്തിൽ ‘നമ്മുടെ’ ഇല്ല; πίστις ഇവിടെ വിശ്വാസത്തെയോ വിശ്വസ്തമായ നിലനിൽപ്പിനെയോ സൂചിപ്പിക്കാം. അതിനാൽ മുഖ്യവാചകം അനാവശ്യമായി ഒരു വ്യാഖ്യാനം മാത്രം ഉറപ്പിക്കുന്നില്ല.
- issue: ἀντί എന്നതിന്റെ ബന്ധാർഥം
  choice: മുമ്പിൽ വെച്ച സന്തോഷത്തെ ലക്ഷ്യമാക്കിയുള്ള സഹനം
  alternative: തന്റെ മുമ്പിലുണ്ടായിരുന്ന സന്തോഷത്തിനു പകരം ക്രൂശ് തെരഞ്ഞെടുത്തു
  rationale: സഹനത്തോടെ മുന്നിലുള്ള ലക്ഷ്യത്തിലേക്ക് ഓടുന്ന സന്ദർഭം പ്രേരകമായ ഭാവിസന്തോഷം എന്ന വായനയെ പിന്തുണയ്ക്കുന്നു; എങ്കിലും ἀντίയുടെ പകരംവയ്ക്കൽഭാവം നിഘണ്ടുപരമായി സാധ്യമാണ്.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ഗൗരവവും വായനാസൗകര്യവും സംയോജിപ്പിച്ചു. ഈ വാക്യം മുൻവാക്യത്തിലെ ആഹ്വാനത്തിന്റെ തുടർച്ചയായതിനാൽ, മലയാളത്തിൽ വ്യാകരണപരമായ സമ്പൂർണതയ്ക്കായി ‘നമുക്ക് ഓടാം’ ആവർത്തിച്ചു; അത് 12:1-ൽനിന്നുള്ള ആശയമാണ്, 12:2-ലെ സ്വതന്ത്ര ഗ്രീക്ക് പദമല്ല. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട വാക്യഭാഗങ്ങളിൽ ചേർത്തിരിക്കുന്നു.
