revisions:
- from: വിശ്വാസത്തിന്റെ വഴിതുറന്നവനും അതിനെ പൂർണതയിലെത്തിക്കുന്നവനുമായ യേശുവിൽ നമ്മുടെ ദൃഷ്ടി ഉറപ്പിച്ചുകൊണ്ട്[a] നമുക്ക് ഓടാം. തന്റെ മുമ്പിൽ വെച്ചിരുന്ന സന്തോഷം ലക്ഷ്യമാക്കി, അവൻ അപമാനം വകവെക്കാതെ[b] ക്രൂശ് സഹിച്ചു; ദൈവത്തിന്റെ സിംഹാസനത്തിന്റെ വലത്തുഭാഗത്ത് ഇരിക്കുകയും ചെയ്തിരിക്കുന്നു.
  to: വിശ്വാസത്തിന്റെ വഴിതുറന്നവനും അതിനെ പൂർണതയിലെത്തിക്കുന്നവനുമായ യേശുവിലേക്കു ദൃഷ്ടി ഉറപ്പിച്ചുകൊണ്ട്[a], തന്റെ മുമ്പിൽ വെച്ചിരുന്ന സന്തോഷത്തെ മുൻനിർത്തി അവൻ ക്രൂശ് സഹിച്ചു; അപമാനം വകവെക്കാതെ[b], ദൈവത്തിന്റെ സിംഹാസനത്തിന്റെ വലത്തുഭാഗത്ത് ഇരുന്നിരിക്കുന്നു.
  rationale: The revision removes the imported imperative from 12:1, retains the participial connection appropriate to 12:2, improves the directional expression of ἀφορῶντες εἰς, and uses idiomatic Malayalam for the perfect κεκάθικεν. The main text keeps the English audit trail’s contextually preferred sense of ἀντί (“with the joy before him in view”) while preserving the disputed scope of τῆς πίστεως in footnote a.
  reviewer_model: gpt-5.6-terra
