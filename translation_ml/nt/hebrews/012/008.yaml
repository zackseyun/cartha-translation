id: HEB.12.8
reference: Hebrews 12:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ δὲ χωρίς ἐστε παιδείας ἧς μέτοχοι γεγόνασι πάντες, ἄρα νόθοι ⸂καὶ οὐχ υἱοί ἐστε⸃.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/008.yaml
  text: But if you are without discipline, of which all have become sharers, then you are illegitimate children and not sons.
translation:
  language: ml
  text: എന്നാൽ എല്ലാവരും പങ്കാളികളായിട്ടുള്ള ആ ശിക്ഷണത്തിൽനിന്ന് നിങ്ങൾ ഒഴിവുള്ളവരാണെങ്കിൽ, നിങ്ങൾ നിയമാനുസൃത മക്കളല്ല, പുത്രന്മാരുമല്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδείας
  choice: ശിക്ഷണം
  rationale: മാതാപിതാക്കളുടെ തിരുത്തലും പരിശീലനവും ഉൾക്കൊള്ളുന്ന ‘discipline’ എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു; വെറും ശിക്ഷ എന്ന അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: μέτοχοι γεγόνασι
  choice: പങ്കാളികളായിട്ടുള്ള
  rationale: പങ്കുപറ്റിയവരായിത്തീർന്നിരിക്കുന്നു എന്ന പൂർത്തീകരണഭാവം ലളിതവും സ്വാഭാവികവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: νόθοι
  choice: നിയമാനുസൃത മക്കളല്ല
  rationale: അവകാശമുള്ള കുടുംബാംഗങ്ങളായി അംഗീകരിക്കപ്പെടാത്ത മക്കൾ എന്ന പ്രസക്തമായ അർഥം നൽകുന്നു; ആധുനിക വായനയിൽ അപമാനകരമായി തോന്നാവുന്ന പരമ്പരാഗത പദം ഒഴിവാക്കുന്നു.
- source_word: υἱοί
  choice: പുത്രന്മാർ
  rationale: νόθοι എന്ന പൊതുവായ ‘മക്കൾ’ എന്ന ആശയത്തോടുള്ള ഗ്രീക്ക് വാക്യത്തിലെ വ്യത്യാസം നിലനിർത്തുകയും പുത്രത്വത്തിന്റെ അവകാശസൂചന സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘എല്ലാവരും’ എന്നതിന്റെ പരിധി
  choice: എല്ലാവരും
  alternative: എല്ലാ ദൈവമക്കളും
  rationale: πάντες എന്നതിൽ ഇല്ലാത്ത വിശദീകരണം വാചകത്തിൽ ചേർക്കാതെ, സന്ദർഭം പരിധി നിർണ്ണയിക്കാൻ അനുവദിക്കുന്നു.
- issue: νόθοι എന്ന കുടുംബ-അവകാശ ഉപമ
  choice: നിയമാനുസൃത മക്കളല്ല
  alternative: അവിവാഹിതബന്ധത്തിൽ ജനിച്ചവർ
  rationale: പുരാതന സാമൂഹിക-നിയമപരമായ ഉപമയുടെ അവകാശബോധം നിലനിർത്തുന്നു; ജനനസാഹചര്യത്തെക്കുറിച്ചുള്ള അനാവശ്യമായ ആധുനിക നൈതികവിധി ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ നിബന്ധനാത്മക ഘടനയും ‘മക്കൾ/പുത്രന്മാർ’ വ്യത്യാസവും കഴിയുന്നത്ര നിലനിർത്തിയിരിക്കുന്നു.
