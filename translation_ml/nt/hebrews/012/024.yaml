id: HEB.12.24
reference: Hebrews 12:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ διαθήκης νέας μεσίτῃ Ἰησοῦ, καὶ αἵματι ῥαντισμοῦ κρεῖττον λαλοῦντι παρὰ τὸν Ἅβελ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/024.yaml
  text: and to Jesus[a], the mediator of a new covenant[b], and to the sprinkled blood that speaks better than Abel.
translation:
  language: ml
  text: ഒരു പുതിയ ഉടമ്പടിയുടെ മധ്യസ്ഥനായ യേശുവിങ്കലേക്കും, ഹാബേലിനെക്കാൾ മെച്ചമായി സംസാരിക്കുന്ന തളിക്കപ്പെട്ട രക്തത്തിലേക്കും[b][a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഹാബേലിന്റെ രക്തത്തെക്കാൾ.’ ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘ഹാബേലിനെക്കാൾ’ എന്നുമാത്രമാണ്; നിലത്തുനിന്നു നിലവിളിച്ച ഹാബേലിന്റെ രക്തത്തെയായിരിക്കാം ഇത് സൂചിപ്പിക്കുന്നത് (ഉല്പത്തി 4:10).
    reason: alternative_reading
  - marker: b
    text: ‘തളിക്കപ്പെട്ട രക്തം’ എന്നത് തളിച്ചുപയോഗിച്ച ബലിരക്തത്തെ സൂചിപ്പിക്കുന്നു; ഉടമ്പടി ഉറപ്പിക്കുന്നതിന്റെയും ശുദ്ധീകരണത്തിന്റെയും ദൃശ്യഭാവങ്ങൾ ഇതിലുണ്ട്.
    reason: cultural_note
lexical_decisions:
- source_word: διαθήκης νέας
  choice: ഒരു പുതിയ ഉടമ്പടിയുടെ
  rationale: διαθήκη ഇവിടെ നിയമപരവും ദൈവശാസ്ത്രപരവുമായ ‘ഉടമ്പടി’ എന്ന അർഥത്തിലാണ്. ഗ്രീക്കിലെ അനാർത്രസ് ഘടനയെ സ്വാഭാവിക മലയാളത്തിൽ ‘ഒരു പുതിയ ഉടമ്പടി’ എന്നു നൽകി; ‘പുതിയ ഉടമ്പടി’ എന്നും വിവർത്തനം ചെയ്യാം.
- source_word: μεσίτῃ
  choice: മധ്യസ്ഥനായ
  rationale: രണ്ടു കക്ഷികൾക്കിടയിൽ നിന്ന് ഉടമ്പടിബന്ധം സാധ്യമാക്കുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്ന കൃത്യവും പ്രചാരത്തിലുള്ളതുമായ പദമാണ് ‘മധ്യസ്ഥൻ’.
- source_word: Ἰησοῦ
  choice: യേശു
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ സ്ഥിരപ്രയോഗം സ്വീകരിച്ചു.
- source_word: αἵματι ῥαντισμοῦ
  choice: തളിക്കപ്പെട്ട രക്തം
  rationale: ആചാരപരമായി തളിച്ചു പ്രയോഗിക്കുന്ന ബലിരക്തത്തെ സൂചിപ്പിക്കുന്നു; പുരാതനഭാഷാശൈലി ഒഴിവാക്കി ബലിയും ശുദ്ധീകരണവും സംബന്ധിച്ച ദൃശ്യഭാവം നിലനിർത്തുന്നു.
- source_word: κρεῖττον
  choice: മെച്ചമായി
  rationale: ‘സംസാരിക്കുന്ന’ എന്ന ക്രിയയെ സ്വാഭാവികമായി വിശേഷിപ്പിക്കുകയും എബ്രായലേഖനത്തിലെ താരതമ്യഭാവം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: λαλοῦντι
  choice: സംസാരിക്കുന്ന
  rationale: വർത്തമാന കൃദന്തരൂപത്തിന്റെ തുടരുന്ന പ്രവർത്തനഭാവം സംരക്ഷിക്കുന്നു.
- source_word: παρὰ τὸν Ἅβελ
  choice: ഹാബേലിനെക്കാൾ
  rationale: ഗ്രീക്ക് മൂലപാഠം ‘ഹാബേലിന്റെ രക്തത്തെക്കാൾ’ എന്നു വികസിപ്പിക്കാതെ ഹാബേലിനെ നേരിട്ട് പേരെടുക്കുന്നു; അതിലെ സംക്ഷിപ്തതയും അർഥസന്ദിഗ്ധതയും നിലനിർത്തി.
theological_decisions:
- issue: ഹാബേലുമായുള്ള താരതമ്യത്തിന്റെ സൂചിതവിഷയം
  choice: പ്രധാനപാഠത്തിൽ ‘ഹാബേലിനെക്കാൾ’ എന്ന ഗ്രീക്കിലെ സംക്ഷിപ്ത താരതമ്യം നിലനിർത്തി.
  alternative: ‘ഹാബേലിന്റെ രക്തത്തെക്കാൾ’ അല്ലെങ്കിൽ ‘ഹാബേലിന്റെ രക്തം ആവശ്യപ്പെട്ടതിനെക്കാൾ മെച്ചമായ കാര്യങ്ങൾ’
  rationale: ഉല്പത്തി 4:10-ലെ നിലത്തുനിന്നു നിലവിളിക്കുന്ന ഹാബേലിന്റെ രക്തമാണ് പശ്ചാത്തലസൂചനയെന്നത് ശക്തമായ സാധ്യതയാണ്. എങ്കിലും ഗ്രീക്ക് പാഠം രക്തം എന്നു ആവർത്തിക്കാതെ ഹാബേലിനെ മാത്രം പറയുന്നു; അതിനാൽ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർക്കാതെ അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. വാക്യം മുൻവാക്യത്തിൽ ആരംഭിച്ച പട്ടികയുടെ തുടർച്ചയായതിനാൽ മൂലപാഠത്തിലെ ഖണ്ഡവാക്യസ്വഭാവം നിലനിർത്തി. ആവർത്തിച്ച ‘രക്തത്തിലേക്കും’ എന്ന പ്രയോഗവും ദീർഘവിരാമവും മലയാളത്തിൽ ബന്ധം വ്യക്തമാക്കാൻ ഉപയോഗിച്ചു; പുതിയ ആശയം ചേർത്തിട്ടില്ല.
