  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐκκλησίᾳ πρωτοτόκων ⸂ἀπογεγραμμένων ἐν οὐρανοῖς⸃, καὶ κριτῇ θεῷ πάντων, καὶ πνεύμασι δικαίων τετελειωμένων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/023.yaml
  text: and to the assembly of the firstborn who are enrolled in the heavens[a], and to God, the judge of all, and to the spirits of righteous people made perfect,
translation:
  language: ml
  text: സ്വർഗങ്ങളിൽ പേരെഴുതപ്പെട്ടിരിക്കുന്ന ആദ്യജാതരുടെ സഭയിലേക്കും[a], എല്ലാവരുടെയും ന്യായാധിപനായ ദൈവത്തിലേക്കും, പൂർണരാക്കപ്പെട്ട നീതിമാന്മാരുടെ ആത്മാക്കളിലേക്കും,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സ്വർഗത്തിൽ.’ ഗ്രീക്കിൽ ‘സ്വർഗങ്ങളിൽ’ എന്ന ബഹുവചനമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: സഭയിലേക്കും
  rationale: സ്വർഗീയ സീയോന്റെ പശ്ചാത്തലത്തിൽ കൂടിവന്ന സമൂഹത്തെ സൂചിപ്പിക്കാൻ, സ്ഥാപനപരമായ അർഥം അനാവശ്യമായി മുൻനിർത്താതെ, സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ‘സഭ’ ഉപയോഗിച്ചു. ദത്തിവ് രൂപവും മുമ്പത്തെ വാക്യത്തിൽനിന്നു തുടരുന്ന ‘അടുത്തുവന്നിരിക്കുന്നു’ എന്ന ആശയവും ‘-യിലേക്കും’ വഴി നിലനിർത്തി.
- source_word: πρωτοτόκων
  choice: ആദ്യജാതരുടെ
  rationale: ഗ്രീക്കിലെ ബഹുവചനരൂപം നിലനിർത്തുകയും ‘പുത്രന്മാർ’ എന്ന മൂലപാഠത്തിലില്ലാത്ത പരിമിതി ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു. ആദ്യജാതസ്ഥാനം അഥവാ അവകാശപദവി പങ്കിടുന്ന ഒരു സമൂഹത്തെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്.
- source_word: ἀπογεγραμμένων
  choice: പേരെഴുതപ്പെട്ടിരിക്കുന്ന
  rationale: രജിസ്റ്ററിൽ രേഖപ്പെടുത്തിയതെന്ന ദൃശ്യവും, പൂർത്തിയായ രേഖപ്പെടുത്തലിന്റെ ഇപ്പോഴും നിലനിൽക്കുന്ന ഫലവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἐν οὐρανοῖς
  choice: സ്വർഗങ്ങളിൽ
  rationale: ഗ്രീക്കിലെ ബഹുവചനം മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ചു. കൂടുതൽ പതിവായ ഏകവചനപ്രയോഗം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: κριτῇ θεῷ πάντων
  choice: എല്ലാവരുടെയും ന്യായാധിപനായ ദൈവത്തിലേക്കും
  rationale: ദൈവവും ന്യായാധിപനും ഒരാളാണെന്ന സമാനാധികരണബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു; πάντων എന്നത് വ്യക്തികളെ സൂചിപ്പിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘എല്ലാവരുടെയും’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: πνεύμασι
  choice: ആത്മാക്കളിലേക്കും
  rationale: അടിസ്ഥാന പദാർഥമായ ‘ആത്മാക്കൾ’ നിലനിർത്തി; ദൂതന്മാരെന്നോ ശരീരരഹിതാവസ്ഥയെക്കുറിച്ചുള്ള വിശദമായ സിദ്ധാന്തമെന്നോ വിപുലീകരിച്ചില്ല.
- source_word: δικαίων
  choice: നീതിമാന്മാരുടെ
  rationale: മനുഷ്യരെ സൂചിപ്പിക്കുന്ന ബഹുവചന നാമവിശേഷണത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി നാമവൽക്കരിക്കുന്നു; പുരുഷന്മാർക്ക് മാത്രം ബാധകമെന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: τετελειωμένων
  choice: പൂർണരാക്കപ്പെട്ട
  rationale: τελειόω എന്ന ക്രിയയുടെ പൂർത്തീകരണം/പൂർണത എന്ന എബ്രായലേഖനത്തിലെ പ്രധാന ആശയവും കർമണിപ്രയോഗവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ‘ആദ്യജാതർ’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: ആദ്യജാതസ്ഥാനവും അവകാശവും പങ്കിടുന്ന ദൈവജനത്തിന്റെ സമൂഹത്തെ സൂചിപ്പിക്കുന്ന ബഹുവചന വിശേഷണം
  alternative: ഏക ആദ്യജാതനായ ക്രിസ്തുവിനുള്ള സഭ എന്ന വ്യാഖ്യാനം
  rationale: πρωτοτόκων എന്ന വ്യക്തമായ ബഹുവചനം സമൂഹപരമായ സൂചനയ്ക്കാണ് ശക്തമായ പിന്തുണ നൽകുന്നത്. അതിനാൽ മൂലപാഠത്തിലില്ലാത്ത ഉടമസ്ഥബന്ധം പരിഭാഷയിൽ ചേർത്തില്ല.
- issue: ‘പൂർണരാക്കപ്പെട്ട നീതിമാന്മാരുടെ ആത്മാക്കൾ’ എന്നതിന്റെ സൂചന
  choice: ദൈവസന്നിധിയിൽ പൂർണതയിലേക്കു കൊണ്ടുവരപ്പെട്ട നീതിമാനായ മനുഷ്യരുടെ ആത്മാക്കൾ
  alternative: ശരീരാവസ്ഥ പരിഗണിക്കാതെ എല്ലാ നീതിമാന്മാരെയും പൊതുവായി സൂചിപ്പിക്കുന്നു
  rationale: ‘നീതിമാന്മാരുടെ ആത്മാക്കൾ’ എന്ന പ്രയോഗം മനുഷ്യരെ അവരുടെ ആത്മീയാവസ്ഥയിൽ സൂചിപ്പിക്കുന്നതാണ് ഏറ്റവും സ്വാഭാവികം. എന്നാൽ ഇടക്കാലാവസ്ഥയെക്കുറിച്ചുള്ള കൂടുതൽ വിശദാംശങ്ങൾ വാക്യം പറയാത്തതിനാൽ പരിഭാഷയിൽ അവ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. വാക്യം മുൻവാക്യത്തിൽനിന്നുള്ള പട്ടികയുടെ ഭാഗമായതിനാൽ ആരംഭത്തിലും അവസാനത്തിലും ബന്ധകസ്വഭാവം നിലനിർത്തി. ഓരോ ഘടകത്തിലുമുള്ള ആവർത്തിതമായ καί ‘-ഉം’ ഉപയോഗിച്ച് പ്രതിഫലിപ്പിച്ചു.
