  source_fidelity: 'The draft preserves the temporal contrast, experiential force of δοκεῖ, and the causal relation of discipline and subsequent fruit. However, the phrase “നീതി എന്ന സമാധാനപൂർണമായ ഫലം” reverses the Greek genitive relationship: δικαιοσύνης qualifies “fruit,” rather than being apposed to it.'
