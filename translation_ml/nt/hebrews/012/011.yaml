source:
  edition: SBLGNT
  text: πᾶσα ⸀δὲ παιδεία πρὸς μὲν τὸ παρὸν οὐ δοκεῖ χαρᾶς εἶναι ἀλλὰ λύπης, ὕστερον δὲ καρπὸν εἰρηνικὸν τοῖς δι’ αὐτῆς γεγυμνασμένοις ἀποδίδωσιν δικαιοσύνης.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/011.yaml
  text: All discipline seems for the present to be not joy but sorrow[a]; yet later it yields the peaceful fruit of righteousness to those who have been trained by it.
translation:
  language: ml
  text: എല്ലാ ശിക്ഷണവും തൽക്കാലം സന്തോഷകരമല്ല, ദുഃഖകരമാണെന്നാണ് തോന്നുന്നത്; എന്നാൽ പിന്നീട്, അതിലൂടെ പരിശീലനം ലഭിച്ചവർക്ക് അത് നീതിയുടെ സമാധാനപൂർണമായ ഫലം നൽകുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ന്യായത്തിന്റെ.” ഗ്രീക്ക് പദത്തിന് “നീതി” എന്നും “ന്യായം” എന്നും അർഥമാകാം; ഇവിടെ ശിക്ഷണത്തിലൂടെ ഉളവാകുന്ന നേരായ ജീവിതത്തെയാണ് അത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδεία
  choice: ശിക്ഷണം
  rationale: ദൈവത്തിന്റെ പിതൃസഹജമായ തിരുത്തലും പരിശീലനവും ഉൾക്കൊള്ളുന്ന വിശാലമായ അർഥം നൽകുന്നു; ശിക്ഷ മാത്രമെന്ന ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: πρὸς μὲν τὸ παρὸν
  choice: ഇപ്പോൾ
  rationale: ὕστερον എന്ന ‘പിന്നീട്’ എന്നതോടുള്ള സമയവൈരുധ്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: οὐ δοκεῖ
  choice: എന്നാണ് തോന്നുന്നത്
  rationale: വസ്തുനിഷ്ഠമായ അന്തിമവിധിയല്ല, അനുഭവപ്പെടുന്ന പ്രത്യക്ഷതയാണ് ക്രിയ സൂചിപ്പിക്കുന്നത്.
- source_word: χαρᾶς ... ἀλλὰ λύπης
  choice: സന്തോഷകരമെന്നല്ല, ദുഃഖകരമെന്നാണ്
  rationale: മൂലത്തിലെ സന്തോഷം–ദുഃഖം വൈരുധ്യം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ വിധേയപ്രയോഗമാക്കുന്നു.
- source_word: καρπὸν εἰρηνικὸν
  choice: സമാധാനപൂർണമായ ഫലം
  rationale: εἰρηνικός ഫലത്തെ നേരിട്ട് വിശേഷിപ്പിക്കുന്നതിനാൽ, സമാധാനത്തിന്റെ സ്വഭാവമുള്ള ഫലം എന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: γεγυμνασμένοις
  choice: പരിശീലനം നേടിയവർക്ക്
  rationale: ആവർത്തിച്ചുള്ള അഭ്യാസത്തിലൂടെ രൂപപ്പെട്ടവരെ സൂചിപ്പിക്കുന്ന പൂർണ്ണകാല കർമണിഭാവവും വ്യായാമപരിശീലനത്തിന്റെ രൂപകവും വായനാസൗകര്യത്തോടെ നൽകുന്നു.
- source_word: ἀποδίδωσιν
  choice: നൽകുന്നു
  rationale: ശിക്ഷണം പിന്നീട് ഫലം ഉളവാക്കുന്നു എന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി പറയുന്നു; ‘ഫലം നൽകുന്നു’ എന്ന പ്രയോഗം യോജിക്കുന്നു.
- source_word: δικαιοσύνης
  choice: നീതി
  rationale: മലയാളത്തിൽ ‘നീതി’ എന്നത് നേരായ ജീവിതം, ധാർമിക ശരിതനിമ, ന്യായം എന്നീ അർഥവ്യാപ്തികൾ വഹിക്കുന്നു; ഇവിടെ ശിക്ഷണം ഉളവാക്കുന്ന ശരിയായ ജീവിതഫലത്തെയാണ് പ്രധാനമായി സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: ദൈവത്തിന്റെ പ്രവർത്തനമായി παιδεία എന്നതിന്റെ അർഥം
  choice: തിരുത്തലും പരിശീലനവും ഉൾപ്പെടുന്ന രൂപപ്പെടുത്തുന്ന ശിക്ഷണം
  alternative: ശിക്ഷ; ഉപദേശം മാത്രം
  rationale: എബ്രായർ 12:5–10-ലെ പിതൃപുത്ര പശ്ചാത്തലം വിശുദ്ധിയിലേക്കും പക്വതയിലേക്കും നയിക്കുന്ന സ്നേഹപൂർവമായ തിരുത്തലാണ് സൂചിപ്പിക്കുന്നത്; പ്രതികാരശിക്ഷയായി ചുരുക്കുന്നില്ല.
- issue: δικαιοσύνης എന്നതിന്റെ പരിധി
  choice: നീതി—ഇവിടെ നേരായ ജീവിതവും ധാർമിക ശരിതനിമയും
  alternative: നീതീകരണം; സാമൂഹിക ന്യായം മാത്രം
  rationale: വാക്യത്തിലെ ഫലരൂപകം ശിക്ഷണത്തിലൂടെ വളരുന്ന നേരായ ജീവിതത്തെ മുൻനിർത്തുന്നു; പദത്തിന്റെ ന്യായം/നീതിനിഷ്ഠ എന്ന വിശാലത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി. മൂലത്തിലെ അനുഭവപരമായ ‘തോന്നുന്നു’, ഇപ്പോൾ–പിന്നീട് വൈരുധ്യം, ശിക്ഷണത്തിന്റെ തിരുത്തൽ/പരിശീലന വ്യാപ്തി എന്നിവ നിലനിർത്തി. പ്രധാനവാചകത്തിലെ [a] അടിക്കുറിപ്പ് ചിഹ്നം അനുബന്ധ അടിക്കുറിപ്പുമായി പൊരുത്തപ്പെടുന്നു.
