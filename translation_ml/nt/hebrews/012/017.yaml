  to: പിന്നീട് അവൻ അനുഗ്രഹം അവകാശമായി നേടാൻ ആഗ്രഹിച്ചപ്പോൾ തിരസ്കരിക്കപ്പെട്ടുവെന്ന് നിങ്ങൾക്കറിയാമല്ലോ. കാരണം, മാനസാന്തരത്തിന് അവസരം അവൻ കണ്ടെത്തിയില്ല[a], കണ്ണീരോടെ അത് അന്വേഷിച്ചെങ്കിലും[b].
  rationale: 'The revision removes an added negative result not expressed in the source and retains the Greek''s concessive construction: Esau did not find a place/opportunity for repentance, although he sought “it” with tears. This preserves the intentionally disputed referent of αὐτήν without doctrinally resolving whether it denotes the blessing, repentance, or an opportunity/change of mind. Footnote b is clarified without changing its content.'
