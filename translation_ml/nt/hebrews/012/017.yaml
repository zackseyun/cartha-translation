id: HEB.12.17
reference: Hebrews 12:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἴστε γὰρ ὅτι καὶ μετέπειτα θέλων κληρονομῆσαι τὴν εὐλογίαν ἀπεδοκιμάσθη, μετανοίας γὰρ τόπον οὐχ εὗρεν, καίπερ μετὰ δακρύων ἐκζητήσας αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/017.yaml
  text: For you know that afterward[a], when he wanted to inherit the blessing, he was rejected, for he found no opportunity for repentance[b], though he sought it with tears.
translation:
  language: ml
  text: പിന്നീട് അവൻ അനുഗ്രഹം അവകാശമായി നേടാൻ ആഗ്രഹിച്ചപ്പോൾ തിരസ്കരിക്കപ്പെട്ടുവെന്ന് നിങ്ങൾക്കറിയാമല്ലോ. കാരണം, മാനസാന്തരത്തിന് അവസരം അവൻ കണ്ടെത്തിയില്ല[a], കണ്ണീരോടെ അത് അന്വേഷിച്ചെങ്കിലും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “മാനസാന്തരത്തിന് ഇടം കണ്ടെത്തിയില്ല.” ഇതിന് സംഭവഫലം മാറ്റാനുള്ള അവസരം അവന് ലഭിച്ചില്ല എന്നോ, യിസ്ഹാക്കിന്റെ മനസ്സുമാറ്റം നേടാനായില്ല എന്നോ അർഥമാകാം.
    reason: alternative_reading
  - marker: b
    text: “അത്” എന്നത് “അനുഗ്രഹം” എന്നതിനെയോ, സാധ്യത കുറവാണെങ്കിലും “മാനസാന്തരം/അതിനുള്ള അവസരം” എന്നതിനെയോ സൂചിപ്പിക്കാം. ഗ്രീക്ക് പാഠം എന്തിനെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് വ്യക്തമാക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴστε
  choice: നിങ്ങൾക്കറിയാമല്ലോ
  rationale: οἶδα എന്ന പൂർണരൂപം ഇവിടെ വർത്തമാനകാല അർഥത്തിലാണ്; വായനക്കാരുടെ നിലവിലുള്ള അറിവിനെ ഓർമിപ്പിക്കുന്ന γάρ-ന്റെ വിശദീകരണഭാവവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: μετέπειτα
  choice: പിന്നീട്
  rationale: തുടർന്നുണ്ടായ സമയത്തെ സൂചിപ്പിക്കുന്ന ലളിതവും സ്വാഭാവികവുമായ മലയാള പ്രയോഗം.
- source_word: θέλων
  choice: ആഗ്രഹിച്ചപ്പോൾ
  rationale: കൃദ്യന്തരൂപത്തെ കാലസൂചകമായി അവതരിപ്പിക്കുന്നു; അവന്റെ ഇച്ഛയെ അമിതമായി ശക്തിപ്പെടുത്തുന്നില്ല.
- source_word: κληρονομῆσαι τὴν εὐλογίαν
  choice: അനുഗ്രഹം അവകാശമായി നേടാൻ
  rationale: κληρονομέω-യുടെ അവകാശലഭ്യതാഭാവം നിലനിർത്തുകയും ഏശാവിന്റെ പിതൃഅനുഗ്രഹത്തിന്റെ പശ്ചാത്തലവുമായി ബന്ധം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ἀπεδοκιμάσθη
  choice: തിരസ്കരിക്കപ്പെട്ടു
  rationale: പരിഗണനയ്ക്കുശേഷം അംഗീകരിക്കപ്പെടാതിരിക്കുക എന്ന നിഷ്ക്രിയഭാവം നൽകുന്നു; സാങ്കേതികമായ രക്ഷാശാസ്ത്ര അർഥം ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: μετανοίας ... τόπον
  choice: മാനസാന്തരത്തിന് അവസരം
  rationale: ‘സ്ഥലം കണ്ടെത്തുക’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; μετανοία എന്ന പ്രധാന പദം ‘മാനസാന്തരം’ ആയി നിലനിർത്തുന്നു.
- source_word: μετὰ δακρύων ἐκζητήσας αὐτήν
  choice: കണ്ണീരോടെ അത് അന്വേഷിച്ചിട്ടും
  rationale: ക concessive ഭാവവും കണ്ണീരോടെയുള്ള തീവ്രമായ അന്വേഷണവും നൽകുന്നു; ‘അത്’ എന്ന സർവനാമം എന്തിനെ സൂചിപ്പിക്കുന്നു എന്ന മൂലപാഠത്തിലെ അവ്യക്തത നിലനിർത്തുന്നു.
theological_decisions:
- issue: αὐτήν (‘അത്’) എന്ന സർവനാമത്തിന്റെ സൂചിതവും ‘മാനസാന്തരത്തിന് അവസരം കണ്ടെത്തിയില്ല’ എന്നതിന്റെ അർഥവും
  choice: പ്രധാനപാഠത്തിൽ ‘അത്’ എന്ന അവ്യക്ത സർവനാമവും ‘മാനസാന്തരത്തിന് അവസരം’ എന്ന പ്രയോഗവും നിലനിർത്തി.
  alternative: ‘അത്’ അനുഗ്രഹത്തെ സൂചിപ്പിക്കാം; അല്ലെങ്കിൽ മാനസാന്തരത്തെയോ അതിനുള്ള അവസരത്തെയോ സൂചിപ്പിക്കാം. ‘മാനസാന്തരം’ ഏശാവിന്റെ പശ്ചാത്താപമെന്നോ യിസ്ഹാക്കിന്റെ മനസ്സുമാറ്റമെന്നോ മനസ്സിലാക്കാം.
  rationale: εὐλογίαയും μετάνοιαയും സ്ത്രീലിംഗ നാമങ്ങളായതിനാൽ αὐτήν വ്യാകരണപരമായി ഒന്നിലധികം മുൻപദങ്ങളെ സൂചിപ്പിക്കാം. അതിനാൽ വ്യാഖ്യാനപരമായി തീർപ്പാക്കാതെ ഗ്രീക്കിലെ യഥാർഥ അവ്യക്തതയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മാനസാന്തരം,’ ‘അവകാശമായി നേടുക,’ ‘തിരസ്കരിക്കപ്പെടുക’ എന്നീ പരിചിതമായ വേദപദങ്ങൾ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വാക്യഘടനയിൽ ഉപയോഗിച്ചു. ദീർഘമായ ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് മലയാള വാക്യങ്ങളാക്കി; കാരണംസൂചകബന്ധം നിലനിർത്തി.
