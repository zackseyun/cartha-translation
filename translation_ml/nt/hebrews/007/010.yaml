source:
  edition: SBLGNT
  text: ἔτι γὰρ ἐν τῇ ὀσφύϊ τοῦ πατρὸς ἦν ὅτε συνήντησεν αὐτῷ ⸀Μελχισέδεκ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/010.yaml
  text: For he was still in the loins of his father when Melchizedek met him[a].
translation:
  language: ml
  text: കാരണം, മെൽക്കീസേദെക്ക് അവനെ കണ്ടുമുട്ടിയപ്പോൾ ലേവി അപ്പോഴും തന്റെ പിതാവിന്റെ അരയിൽ ആയിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ വ്യാഖ്യാനപരമായി: “തന്റെ പൂർവികന്റെ ശരീരത്തിൽ.” ഗ്രീക്കിൽ അക്ഷരാർഥം “തന്റെ പിതാവിന്റെ അരയിൽ” എന്നാണ്; പൂർവികനിൽനിന്നുള്ള വംശപരമ്പരയെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι
  choice: അപ്പോഴും
  rationale: കണ്ടുമുട്ടൽ നടന്ന സമയത്തും തുടരുന്ന മുൻസ്ഥിതിയെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ വാദത്തിനുള്ള വിശദീകരണബന്ധം സൂചിപ്പിക്കുന്നു.
- source_word: ἐν τῇ ὀσφύϊ
  choice: അരക്കെട്ടിൽ
  rationale: പൂർവികനിൽനിന്നുള്ള വംശജനനത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് മൂർത്തരൂപകം നിലനിർത്തുന്നു; അർത്ഥവിവരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: τοῦ πατρὸς
  choice: തന്റെ പിതാവിന്റെ
  rationale: ഗ്രീക്കിലെ ബന്ധഘടന നിലനിർത്തുന്നു; ഇവിടെ ‘പിതാവ്’ എന്നത് പൂർവികനായ അബ്രാഹാമിനെ സൂചിപ്പിക്കുന്നതായി സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: ἦν
  choice: ആയിരുന്നു
  rationale: εἰμί എന്ന ക്രിയയുടെ അപൂർണ്ണഭൂതകാലരൂപത്തിന് നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: ὅτε
  choice: അപ്പോൾ
  rationale: കണ്ടുമുട്ടൽ നടന്ന സമയത്തെ സൂചിപ്പിക്കുന്ന കാലബന്ധം മലയാള വാക്യഘടനയിൽ ‘കണ്ടുമുട്ടിയപ്പോൾ’ എന്ന രൂപത്തിൽ നൽകുന്നു.
- source_word: συνήντησεν
  choice: കണ്ടുമുട്ടി
  rationale: സംഭവിച്ച കൂടിക്കാഴ്ചയെ ചുരുക്കമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: αὐτῷ
  choice: അവനെ
  rationale: ഗ്രീക്കിലെ സർവനാമം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അത് അബ്രാഹാമിനെ സൂചിപ്പിക്കുന്നു.
- source_word: Μελχισέδεκ
  choice: മെൽക്കീസേദെക്ക്
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം സ്വീകരിക്കുന്നു.
theological_decisions:
- issue: അബ്രാഹാമിൽ ലേവിയുടെ വംശപരമായ സാന്നിധ്യം
  choice: ‘തന്റെ പിതാവിന്റെ അരക്കെട്ടിൽ’ എന്ന മൂർത്തമായ പ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തി
  alternative: ‘തന്റെ പൂർവികന്റെ ശരീരത്തിൽ’ അഥവാ ‘തന്റെ പൂർവികനിൽ’
  rationale: ലേവി അബ്രാഹാമിൽ വംശപരമായ അർത്ഥത്തിൽ ഉണ്ടായിരുന്നുവെന്ന ലേഖകന്റെ പ്രതിനിധാനപരമായ വാദം വ്യാഖ്യാനിച്ച് തീർക്കാതെ അതിന്റെ രൂപകത്തോടുകൂടെ നിലനിർത്തുന്നു.
- issue: ‘പിതാവ്’ ആരെന്ന തിരിച്ചറിയൽ
  choice: ‘തന്റെ പിതാവ്’ എന്ന് പരിഭാഷപ്പെടുത്തി
  alternative: ‘തന്റെ പൂർവികനായ അബ്രാഹാം’
  rationale: സന്ദർഭത്തിലെ സൂചിത വ്യക്തി അബ്രാഹാമാണെങ്കിലും ഗ്രീക്ക് പാഠം പേര് ചേർക്കുന്നില്ല; അതിനാൽ മുഖ്യപാഠത്തിൽ അധിക വ്യക്തത ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഗ്രീക്കിലെ വംശപരമായ മൂർത്തരൂപകം മുഖ്യപാഠത്തിൽ സൂക്ഷിച്ച് അതിന്റെ അർത്ഥം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
