  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μετατιθεμένης γὰρ τῆς ἱερωσύνης ἐξ ἀνάγκης καὶ νόμου μετάθεσις γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/012.yaml
  text: For when the priesthood is changed[a], of necessity there is also a change of law.
translation:
  language: ml
  text: എന്തെന്നാൽ, പുരോഹിതത്വത്തിൽ മാറ്റം വരുമ്പോൾ നിയമത്തിലും അനിവാര്യമായി മാറ്റം സംഭവിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ന്യായപ്രമാണത്തിലും മാറ്റം സംഭവിക്കുന്നു”; ഇവിടെ ലേവ്യപുരോഹിതത്വം സ്ഥാപിച്ച മോശൈക ന്യായപ്രമാണത്തെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: μετατιθεμένης
  choice: മാറ്റം വരുമ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് ഘടനയുടെ സാഹചര്യാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ഒരു ക്രമത്തിൽനിന്ന് മറ്റൊന്നിലേക്കുള്ള മാറ്റം സൂചിപ്പിക്കുമ്പോഴും ‘കൈമാറ്റം’ എന്നതിലേക്കു മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: ἱερωσύνης
  choice: പുരോഹിതപദവി
  rationale: വ്യക്തിഗത പുരോഹിതപ്രവൃത്തിയെയല്ല, പുരോഹിതത്വത്തിന്റെ സ്ഥാപനത്തെയും ഔദ്യോഗിക സ്ഥാനത്തെയും സൂചിപ്പിക്കുന്നു.
- source_word: ἐξ ἀνάγκης
  choice: അനിവാര്യമായി
  rationale: പുരോഹിതപദവിയിലെ മാറ്റത്തിന്റെ നിർബന്ധിതമായ താർക്കിക ഫലമാണ് നിയമത്തിലെ മാറ്റമെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: νόμου
  choice: നിയമത്തിനും
  rationale: ആർട്ടിക്കിൾ ഇല്ലാത്ത νόμου എന്ന രൂപത്തിന്റെ വിശാലത നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ പുരോഹിതപദവി ക്രമീകരിക്കുന്ന മോശൈക നിയമവ്യവസ്ഥ സ്വാഭാവികമായി ഉൾപ്പെടുന്നു.
- source_word: μετάθεσις
  choice: മാറ്റം
  rationale: മുമ്പുള്ള μετατιθεμένης എന്ന സമാനമൂലപദത്തോടുള്ള ആശയപരമായ സമാന്തരത നിലനിർത്തുന്നു; ‘നീക്കം’ എന്നു പറഞ്ഞ് അർഥം അതിരുകടത്തുന്നില്ല.
- source_word: γίνεται
  choice: സംഭവിക്കുന്നു
  rationale: ഫലമായി ഒരു മാറ്റം ഉണ്ടാകുന്നു എന്ന സംഭവാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: καὶ
  choice: -നും
  rationale: പുരോഹിതപദവിയിലെ മാറ്റത്തോടൊപ്പം നിയമത്തിലും മാറ്റം വരുന്നു എന്ന കൂട്ടിച്ചേർക്കൽ അർഥം മലയാളത്തിലെ ദത്തിവ്-സമുച്ചയപ്രത്യയം വഴി നൽകുന്നു.
- source_word: γὰρ
  choice: സന്ദർഭബന്ധത്തിൽ ഉൾക്കൊള്ളിച്ചു
  rationale: γάρ മുൻവാദത്തിന്റെ വിശദീകരണം ആരംഭിക്കുന്നു. ഒറ്റവാക്യമായി ഉദ്ധരിക്കുമ്പോൾ അസ്വാഭാവികമായ ‘എന്തെന്നാൽ’ ഒഴിവാക്കി, കാരണ-വിശദീകരണബന്ധം വാക്യഘടനയിൽ നിലനിർത്തി.
theological_decisions:
- issue: പുരോഹിതപദവിയോടു ബന്ധപ്പെട്ട νόμος എന്നതിന്റെ വ്യാപ്തി
  choice: പ്രധാനപാഠത്തിൽ ‘നിയമം’ എന്നു നൽകി, പുരോഹിതപദവിയെ നിയന്ത്രിക്കുന്ന നിയമക്രമത്തെയും സന്ദർഭത്തിലെ മോശൈക ന്യായപ്രമാണത്തെയും ഉൾക്കൊള്ളാൻ അനുവദിച്ചു.
  alternative: ‘ന്യായപ്രമാണം’ അഥവാ ‘ആ നിയമം’ എന്നു നൽകി മോശൈക ന്യായപ്രമാണത്തെ കൂടുതൽ വ്യക്തമായി സൂചിപ്പിക്കുക.
  rationale: ഗ്രീക്കിൽ νόμου ആർട്ടിക്കിൾ കൂടാതെയാണ്; അതിനാൽ നിർദിഷ്ടത നിർബന്ധമായി ചേർക്കേണ്ടതില്ല. എങ്കിലും എബ്രായർ 7-ന്റെ സന്ദർഭം ലേവ്യപുരോഹിതപദവി സ്ഥാപിച്ച മോശൈക നിയമക്രമത്തെ വ്യക്തമായി ഉൾക്കൊള്ളുന്നു. ഈ പ്രത്യേകത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘പുരോഹിതപദവി’ സ്ഥാപനപരമായ അർഥം വ്യക്തമാക്കുന്നു; ‘അനിവാര്യമായി’ വാദത്തിന്റെ താർക്കിക നിർബന്ധം നിലനിർത്തുന്നു. പ്രധാനപാഠത്തിൽ യഥാർഥത്തിലുള്ള നിയമപരമായ വ്യാപ്തി സംരക്ഷിച്ചും അടിക്കുറിപ്പിൽ മോശൈക ന്യായപ്രമാണമെന്ന സന്ദർഭപരമായ വായന നൽകിയുമിരിക്കുന്നു.
