source:
  edition: SBLGNT
  text: ὃς οὐ κατὰ νόμον ἐντολῆς ⸀σαρκίνης γέγονεν ἀλλὰ κατὰ δύναμιν ζωῆς ἀκαταλύτου,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/016.yaml
  text: who has become such not according to a law of a fleshly commandment[a], but according to the power of an indestructible life[c][b],
translation:
  language: ml
  text: അവൻ അങ്ങനെയായിത്തീർന്നത് ജഡസംബന്ധമായ ഒരു കല്പനയെ അടിസ്ഥാനമാക്കിയുള്ള നിയമപ്രകാരമല്ല[a][c], മറിച്ച് നശിപ്പിക്കാനാവാത്ത ജീവന്റെ ശക്തിയനുസരിച്ചാണ്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ശാരീരികമായ ഒരു വ്യവസ്ഥയുടെ’ അല്ലെങ്കിൽ ‘ദേഹസംബന്ധമായ ഒരു കല്പനയുടെ.’
    reason: lexical_alternative
  - marker: b
    text: പരമ്പരാഗതമായി, ‘അവസാനമില്ലാത്ത ജീവന്റെ.’
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘ജഡസംബന്ധമായ ഒരു കല്പനയാൽ നിർണയിക്കപ്പെട്ട നിയമപ്രകാരം.’
    reason: previous_rendering
lexical_decisions:
- source_word: ὃς
  choice: അവൻ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ വ്യക്തിയിലേക്കു തിരിച്ചുചൂണ്ടുന്ന ബന്ധസർവനാമം മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യബന്ധത്തോടെ അവതരിപ്പിക്കുന്നു.
- source_word: κατὰ νόμον
  choice: നിയമപ്രകാരം
  rationale: κατά ഇവിടെ മാനദണ്ഡമോ അടിസ്ഥാനമോ സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിൽ നിർദ്ദിഷ്ട ആർട്ടിക്കിൾ ഇല്ലാത്തതിനാൽ ‘ന്യായപ്രമാണം’ എന്നു പ്രത്യേകമായി തിരിച്ചറിയുന്നില്ല.
- source_word: ἐντολῆς σαρκίνης
  choice: ജഡസംബന്ധമായ ഒരു കല്പനയുടെ
  rationale: കല്പനയുടെ ബാഹ്യവും ശാരീരികവും വംശപരവുമായ സ്വഭാവം നിലനിർത്തുന്നു; ‘പാപസ്വഭാവമുള്ള’ എന്ന ധാർമിക അർഥം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: γέγονεν
  choice: അങ്ങനെയായിത്തീർന്നത്
  rationale: മുൻസന്ദർഭത്തിൽനിന്ന് മനസ്സിലാകുന്ന പൗരോഹിത്യപദവി ആവർത്തിക്കാതെ, പൂർത്തികാലം സൂചിപ്പിക്കുന്ന നിലവിലുള്ള ഫലാവസ്ഥ നിലനിർത്തുന്നു.
- source_word: ἀλλὰ κατὰ δύναμιν
  choice: മറിച്ച് ... ശക്തിപ്രകാരമാണ്
  rationale: ആദ്യത്തെ κατὰ ഘടനയോടുള്ള ശക്തമായ വൈരുധ്യവും സമാന്തരതയും സംരക്ഷിക്കുന്നു.
- source_word: ζωῆς ἀκαταλύτου
  choice: നശിപ്പിക്കാനാവാത്ത ജീവന്റെ
  rationale: ἀκατάλυτος എന്നത് അവസാനമില്ലാത്ത ദൈർഘ്യം മാത്രമല്ല, തകർക്കാനോ ഇല്ലാതാക്കാനോ കഴിയാത്ത സ്വഭാവവും സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: σαρκίνης എന്ന പദത്തിന്റെ അർഥം
  choice: ജഡസംബന്ധമായ
  alternative: ശാരീരികമായ; ദേഹസംബന്ധമായ
  rationale: ഇവിടെ പാപപരമായ ‘ജഡികത’യല്ല, ബാഹ്യമായ ദേഹ-വംശപരമായ യോഗ്യതയാണ് നശിപ്പിക്കാനാവാത്ത ജീവനോടു വൈരുധ്യത്തിൽ നിൽക്കുന്നത്.
- issue: ἀκαταλύτου എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: നശിപ്പിക്കാനാവാത്ത
  alternative: അവസാനമില്ലാത്ത
  rationale: മൂലപദത്തിലെ തകർക്കാനോ ഇല്ലാതാക്കാനോ കഴിയാത്തതെന്ന ആശയം നിലനിർത്തുന്നു; പരമ്പരാഗതമായ കാലദൈർഘ്യകേന്ദ്രിത പരിഭാഷ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: γέγονεν എന്നതിലെ നിഗൂഢമായ പൂരകം
  choice: അങ്ങനെയായിത്തീർന്നത്
  alternative: പുരോഹിതനായത്
  rationale: ഗ്രീക്കിൽ ‘പുരോഹിതൻ’ എന്ന പദം ഈ വാക്യത്തിൽ ആവർത്തിക്കാത്തതിനാൽ, സന്ദർഭത്തിൽനിന്നു ലഭിക്കുന്ന അർഥം തുറന്ന നിലയിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ‘ജഡസംബന്ധമായ’ എന്നത് മൂലത്തിലെ σάρξ പദകുടുംബത്തിന്റെ ദൃശ്യഭാവം നിലനിർത്തുമ്പോഴും പാപസ്വഭാവം എന്ന അർഥം ചുമത്താതിരിക്കാനാണ് ഉപയോഗിച്ചത്. വാക്യം മുൻസന്ദർഭവുമായി ബന്ധപ്പെട്ടു നിൽക്കുന്നതിനാൽ ‘അങ്ങനെയായിത്തീർന്നത്’ എന്ന പ്രയോഗം ഉദ്ദേശപൂർവം നിലനിർത്തി.
