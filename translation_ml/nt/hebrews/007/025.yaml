id: HEB.7.25
reference: Hebrews 7:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅθεν καὶ σῴζειν εἰς τὸ παντελὲς δύναται τοὺς προσερχομένους δι’ αὐτοῦ τῷ θεῷ, πάντοτε ζῶν εἰς τὸ ἐντυγχάνειν ὑπὲρ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/025.yaml
  text: Therefore he is also able to save completely those who draw near to God through him[a], since he always lives to intercede for them.
translation:
  language: ml
  text: അതുകൊണ്ട്, അവനിലൂടെ ദൈവത്തോട് അടുത്തുവരുന്നവരെ പൂർണമായി രക്ഷിക്കാനും അവന് കഴിയും; കാരണം, അവർക്കുവേണ്ടി മധ്യസ്ഥത വഹിക്കാൻ അവൻ എപ്പോഴും ജീവിക്കുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅθεν
  choice: അതുകൊണ്ട്
  rationale: മുമ്പ് പറഞ്ഞ യേശുവിന്റെ സ്ഥിരമായ പൗരോഹിത്യത്തിൽനിന്നുള്ള നിഗമനമാണെന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: καὶ
  choice: —
  rationale: ഗ്രീക്കിലെ ചേർക്കൽഭാവം മലയാളവാക്യത്തിന്റെ നിഗമനഘടനയിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു; പ്രത്യേകം ‘കൂടെയും’ എന്നു ചേർത്താൽ മലയാളത്തിൽ അസ്വാഭാവികമാകാം.
- source_word: σῴζειν
  choice: രക്ഷിക്കാൻ
  rationale: രക്ഷാസംബന്ധമായ സന്ദർഭത്തിൽ പദത്തിന്റെ സാധാരണ ദൈവശാസ്ത്രപരമായ ഭാരവും തുടർച്ചയും നിലനിർത്തുന്നു.
- source_word: εἰς τὸ παντελές
  choice: പൂർണമായി
  rationale: സമ്പൂർണത എന്ന മുഖ്യ അർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു; കാലപരമായ ‘എന്നേക്കുമായി’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: δύναται
  choice: അവനു കഴിയും
  rationale: അവന്റെ നിലനിൽക്കുന്ന പൗരോഹിത്യത്തിൽ അധിഷ്ഠിതമായ കഴിവിനെ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: τοὺς προσερχομένους
  choice: അടുത്തുവരുന്നവരെ
  rationale: എബ്രായലേഖനത്തിൽ ദൈവസന്നിധിയിലേക്കുള്ള ആരാധനാപരവും ബന്ധപരവുമായ സമീപനത്തിന്റെ ആവർത്തിത ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: δι’ αὐτοῦ
  choice: അവനിലൂടെ
  rationale: യേശുവിന്റെ പൗരോഹിത്യ മധ്യസ്ഥതയിലൂടെയുള്ള ദൈവസമീപനം വ്യക്തമാക്കുന്നു.
- source_word: τῷ θεῷ
  choice: ദൈവത്തോട്
  rationale: προσέρχομαι എന്ന ക്രിയയോടൊപ്പം ലക്ഷ്യം സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: πάντοτε ζῶν
  choice: അവൻ എപ്പോഴും ജീവിക്കുന്നു
  rationale: അവന്റെ രക്ഷിക്കാനുള്ള കഴിവിന്റെ അടിസ്ഥാനവും തുടർച്ചയായ ജീവനെയും വ്യക്തമാക്കുന്നു.
- source_word: εἰς τὸ ἐντυγχάνειν
  choice: മധ്യസ്ഥത വഹിക്കാൻ
  rationale: അവർക്കുവേണ്ടിയുള്ള നിരന്തരമായ പ്രതിനിധാനപ്രവർത്തനം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: ὑπὲρ αὐτῶν
  choice: അവർക്കുവേണ്ടി
  rationale: പ്രതിനിധാനത്തിന്റെയും പ്രയോജനത്തിന്റെയും ഭാവം സ്വാഭാവികമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: εἰς τὸ παντελές എന്ന പ്രയോഗത്തിന്റെ അർഥവ്യാപ്തി
  choice: മുഖ്യപാഠത്തിൽ ‘പൂർണമായി’
  alternative: ‘എന്നേക്കുമായി’; പരമ്പരാഗതമായി ‘അങ്ങേയറ്റംവരെ’
  rationale: ഈ പ്രയോഗത്തിന് സമ്പൂർണമായും എന്നും എന്നേക്കുമായി എന്നും അർഥമാകാം. തുടർന്ന് പറയുന്ന അവന്റെ നിരന്തരജീവൻ രക്ഷയുടെ സമ്പൂർണതയെയും നിലനിൽക്കുന്ന ഫലപ്രാപ്തിയെയും പിന്തുണയ്ക്കുന്നു. അതിനാൽ മുഖ്യപാഠം ഒരു വശം അവതരിപ്പിക്കുമ്പോൾ മറ്റുള്ള യഥാർഥ സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘അടുത്തുവരുന്നവർ’, ‘മധ്യസ്ഥത വഹിക്കുക’ എന്നീ പ്രയോഗങ്ങൾ എബ്രായലേഖനത്തിലെ ആരാധനാപരവും പൗരോഹിത്യപരവുമായ ഭാവം നിലനിർത്തുന്നു.
