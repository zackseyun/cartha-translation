id: HEB.7.6
reference: Hebrews 7:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ μὴ γενεαλογούμενος ἐξ αὐτῶν δεδεκάτωκεν ⸀Ἀβραάμ, καὶ τὸν ἔχοντα τὰς ἐπαγγελίας εὐλόγηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/006.yaml
  text: But the one who is not traced by genealogy from them has taken a tenth from Abraham and has blessed the one who had the promises[a][b].
translation:
  language: ml
  text: എന്നാൽ, അവരിൽനിന്നുള്ള വംശാവലിയിൽ ഉൾപ്പെടാത്തവൻ അബ്രാഹാമിൽനിന്ന് പത്തിലൊന്ന് സ്വീകരിച്ചിരിക്കുന്നു[a]; വാഗ്ദത്തങ്ങൾ ഉള്ളവനെ അനുഗ്രഹിച്ചുമിരിക്കുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അബ്രാഹാമിൽനിന്ന് ദശാംശം സ്വീകരിച്ചിരിക്കുന്നു.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് പത്തിലൊന്ന് എടുക്കുക അല്ലെങ്കിൽ സ്വീകരിക്കുക എന്നർഥമുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: ‘അനുഗ്രഹിച്ചു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഗ്രീക്ക് പൂർണകാലം ഈ സംഭവത്തിന് ലേഖകന്റെ വാദത്തിൽ തുടരുന്ന പ്രസക്തിയുണ്ടെന്ന് സൂചിപ്പിക്കുന്നു.
    reason: aspectual_alternative
lexical_decisions:
- source_word: ὁ δὲ μὴ γενεαλογούμενος ἐξ αὐτῶν
  choice: എന്നാൽ അവരിൽനിന്ന് വംശാവലി കണക്കാക്കപ്പെടാത്തവൻ
  rationale: γενεαλογούμενος എന്ന വർത്തമാനകാല കർമണി പങ്കാളിത്തരൂപത്തിന്റെ വംശാവലി-രജിസ്ട്രേഷൻ ആശയം നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ ‘അവർ’ ലേവിയുടെ സന്തതികളെ സൂചിപ്പിക്കുന്നു; മെൽക്കീസേദെക്കിന്റെ ഉത്ഭവത്തെക്കുറിച്ച് അതിഭൗതിക നിഗമനം ചേർക്കുന്നില്ല.
- source_word: δεδεκάτωκεν
  choice: പത്തിലൊന്ന് വാങ്ങിയിരിക്കുന്നു
  rationale: ക്രിയയുടെ ‘പത്തിലൊന്ന് എടുക്കുക/സ്വീകരിക്കുക’ എന്ന അർഥവും, പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ പ്രസക്തി സൂചിപ്പിക്കുന്ന പൂർണകാല ഭാവവും പ്രകടമാക്കുന്നു.
- source_word: Ἀβραάμ
  choice: അബ്രാഹാം
  rationale: മലയാളത്തിൽ പ്രചാരത്തിലുള്ള വ്യക്തിനാമരൂപം.
- source_word: τὸν ἔχοντα τὰς ἐπαγγελίας
  choice: വാഗ്ദത്തങ്ങൾ ഉള്ളവനെ
  rationale: ἔχοντα എന്ന വർത്തമാനകാല പങ്കാളിത്തരൂപവും ἐπαγγελίας എന്ന ബഹുവചനവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: εὐλόγηκεν
  choice: അനുഗ്രഹിക്കുകയും ചെയ്തിരിക്കുന്നു
  rationale: ഗ്രീക്കിലെ പൂർണകാലത്തെ നിലനിർത്തി, ആ അനുഗ്രഹത്തിന് ലേഖകന്റെ വാദത്തിൽ തുടരുന്ന പ്രസക്തി ഉണ്ടെന്ന ഭാവം നൽകുന്നു.
theological_decisions:
- issue: മെൽക്കീസേദെക്കും ലേവ്യ വംശാവലിയും തമ്മിലുള്ള വൈരുധ്യം
  choice: മെൽക്കീസേദെക്ക് ലേവ്യരിൽനിന്ന് വംശാവലി കണക്കാക്കപ്പെടാത്തവനാണെന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘അവരിൽനിന്ന് ജനിക്കാത്തവൻ’ അല്ലെങ്കിൽ ‘അവരുടെ വംശത്തിൽപ്പെടാത്തവൻ’.
  rationale: സന്ദർഭത്തിലെ വാദം ലേവ്യ പൗരോഹിത്യത്തിന്റെ വംശാവലി അടിസ്ഥാനത്തെക്കുറിച്ചാണ്. അതിനാൽ നിയമപരവും വംശാവലിസംബന്ധവുമായ ഊന്നൽ സംരക്ഷിക്കുകയും, മെൽക്കീസേദെക്കിന്റെ സ്വഭാവത്തെയോ ഉത്ഭവത്തെയോ കുറിച്ചുള്ള അനുമാനം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- issue: അബ്രാഹാം വാഗ്ദത്തങ്ങൾ ‘ഉള്ളവൻ’ എന്ന വർത്തമാനകാല പ്രയോഗം
  choice: വാഗ്ദത്തങ്ങൾ ഉള്ളവനെ
  alternative: വാഗ്ദത്തങ്ങൾ ലഭിച്ചവനെ / വാഗ്ദത്തങ്ങൾ ഉണ്ടായിരുന്നവനെ
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാല പങ്കാളിത്തരൂപം സംരക്ഷിച്ച്, വാഗ്ദത്തങ്ങളുടെ തുടരുന്ന പ്രാധാന്യം മായ്ച്ചുകളയുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ദശാംശം’ എന്ന സഭാപരിചിത പദം മുഖ്യവാചകത്തിൽ ഒഴിവാക്കി സുതാര്യമായ ‘പത്തിലൊന്ന്’ ഉപയോഗിച്ചു; പകരം പദം അടിക്കുറിപ്പിൽ നൽകി. ഗ്രീക്ക് പൂർണകാലത്തിന്റെ വാദപരമായ പ്രസക്തി മലയാളത്തിലെ ‘വാങ്ങിയിരിക്കുന്നു / ചെയ്തിരിക്കുന്നു’ രൂപങ്ങളിലൂടെ സൂക്ഷിച്ചു.
