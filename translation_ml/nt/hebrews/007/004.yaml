source:
  edition: SBLGNT
  text: Θεωρεῖτε δὲ πηλίκος οὗτος ⸀ᾧ δεκάτην Ἀβραὰμ ἔδωκεν ἐκ τῶν ἀκροθινίων ὁ πατριάρχης.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/004.yaml
  text: Consider how great this man was[b][a], to whom Abraham the patriarch gave a tenth of the spoils.
translation:
  language: ml
  text: ഗോത്രപിതാവായ അബ്രാഹാം കൊള്ളമുതലിൽനിന്ന് പത്തിലൊന്ന്[a] കൊടുത്ത ഈ വ്യക്തി എത്ര മഹാനാണെന്ന് ചിന്തിച്ചുനോക്കൂ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദശാംശം.’ ഗ്രീക്കിൽ അക്ഷരാർഥം ‘പത്തിലൊന്ന്’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കുപദം യുദ്ധത്തിൽ പിടിച്ചെടുത്ത കൊള്ളമുതലിനെ സൂചിപ്പിക്കാം; കൊള്ളയിലെ ഏറ്റവും മികച്ച ഭാഗം എന്ന സൂക്ഷ്മാർഥവും അതിനുണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Θεωρεῖτε
  choice: ചിന്തിച്ചുനോക്കൂ
  rationale: ബഹുവചന വർത്തമാനകാല ആജ്ഞയുടെ ശ്രദ്ധാപൂർവമായ പരിചിന്തനത്തിനുള്ള ആഹ്വാനം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: ഇവിടെ ശക്തമായ വിരോധമല്ല, മൃദുവായ ആശയമാറ്റമാണ് സൂചിപ്പിക്കുന്നത്; മലയാളവാക്യത്തിന്റെ പ്രവാഹത്തിൽ അത് സ്വാഭാവികമായി പ്രകടമാകുന്നതിനാൽ ‘ഇപ്പോൾ’ എന്ന കാലസൂചന ചേർത്തിട്ടില്ല.
- source_word: πηλίκος
  choice: എത്ര മഹാനായിരുന്നുവെന്ന്
  rationale: വലിപ്പമോ മഹത്ത്വമോ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ വിലയിരുത്തൽശക്തി നിലനിർത്തുന്നു; ആ മഹത്ത്വത്തിന്റെ കൃത്യസ്വഭാവം സന്ദർഭം നിർണ്ണയിക്കാൻ വിടുന്നു.
- source_word: οὗτος
  choice: ഈ മനുഷ്യൻ
  rationale: മുൻസന്ദർഭത്തിലെ മെൽക്കീസേദെക്കിനെ സൂചിപ്പിക്കുന്ന പുല്ലിംഗ ഏകവചന പരാമർശം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ᾧ
  choice: അദ്ദേഹത്തിനു
  rationale: ‘കൊടുത്തു’ എന്ന ക്രിയയോടു ചേരുന്ന ദത്തിവ് ബന്ധം സ്വാഭാവികമായി നൽകുന്നു; ആദരസൂചക സർവനാമം വാക്യത്തിന്റെ ഗൗരവമുള്ള ശൈലിക്കു യോജിക്കുന്നു.
- source_word: δεκάτην
  choice: പത്തിലൊന്ന്
  rationale: ഗ്രീക്കിലെ അക്ഷരാർഥം നേരിട്ട് നൽകുന്നു; പിന്നീട് രൂപപ്പെട്ട സ്ഥാപനപരമായ അർഥങ്ങൾ നിർബന്ധമായി ചുമത്തുന്നില്ല.
- source_word: Ἀβραὰμ
  choice: അബ്രാഹാം
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ സ്ഥിരപ്പെട്ട വ്യക്തിനാമരൂപം.
- source_word: ἔδωκεν
  choice: കൊടുത്തത്
  rationale: δίδωμι എന്ന ക്രിയയുടെ ലളിതവും കൃത്യവുമായ മലയാളസമാനപദം.
- source_word: ἐκ τῶν ἀκροθινίων
  choice: കൊള്ളമുതലിൽനിന്ന്
  rationale: യുദ്ധത്തിൽ പിടിച്ചെടുത്ത മുതലിനെ സൂചിപ്പിക്കുന്നു; ‘ഏറ്റവും മികച്ച ഭാഗം’ എന്ന സാദ്ധ്യമായ സൂക്ഷ്മാർഥം മുഖ്യവാചകത്തിൽ നിർബന്ധമാക്കാതെ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ὁ πατριάρχης
  choice: ഗോത്രപിതാവായ
  rationale: അബ്രാഹാമിന്റെ പൂർവപിതൃസ്ഥാനത്തെ വ്യക്തമാക്കുന്ന, സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള പദപ്രയോഗം.
theological_decisions:
- issue: മെൽക്കീസേദെക്കിന്റെ മഹത്ത്വവും അബ്രാഹാമിന്റെ പ്രവൃത്തിയും തമ്മിലുള്ള ബന്ധം
  choice: ഗോത്രപിതാവായ അബ്രാഹാം മെൽക്കീസേദെക്കിനു പത്തിലൊന്ന് കൊടുത്ത പ്രവൃത്തി അദ്ദേഹത്തിന്റെ മഹത്ത്വം പരിഗണിക്കാൻ വായനക്കാരനെ പ്രേരിപ്പിക്കുന്നതായി മാത്രം വാക്യം അവതരിപ്പിക്കുന്നു.
  alternative: പത്തിലൊന്ന് സ്വീകരിച്ചതിനാൽ മെൽക്കീസേദെക്ക് അബ്രാഹാമിനെക്കാൾ ശ്രേഷ്ഠനാണെന്ന നിഗമനം മുഖ്യവാചകത്തിൽ തുറന്നുപറയുക.
  rationale: വാക്യത്തിന്റെ വാദദിശ ശ്രേഷ്ഠതയിലേക്കാണെങ്കിലും, ഈ വാക്യം നേരിട്ട് പറയുന്നതിലധികം വിവർത്തനത്തിൽ ചേർക്കാതെ തുടർന്നുള്ള സന്ദർഭത്തിനായി ദൈവശാസ്ത്രപരമായ നിഗമനം തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലവാക്യത്തിലെ പരിചിന്തനാഹ്വാനം നിലനിർത്തുകയും, വ്യക്തമല്ലാത്ത ‘ഏറ്റവും മികച്ച ഭാഗം’ എന്ന സൂക്ഷ്മാർഥം അടിക്കുറിപ്പിലേക്കു മാറ്റുകയും ചെയ്തു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട പദങ്ങൾക്കു പിന്നാലെ ക്രമത്തിൽ നൽകിയിരിക്കുന്നു.
