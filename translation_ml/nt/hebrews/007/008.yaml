source:
  edition: SBLGNT
  text: καὶ ὧδε μὲν δεκάτας ἀποθνῄσκοντες ἄνθρωποι λαμβάνουσιν, ἐκεῖ δὲ μαρτυρούμενος ὅτι ζῇ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/008.yaml
  text: And here mortal men receive tithes[a], but there he is testified to be living.
translation:
  language: ml
  text: ഇവിടെ മരിക്കുന്ന മനുഷ്യർ ദശാംശങ്ങൾ സ്വീകരിക്കുന്നു; എന്നാൽ അവിടെ, ജീവിക്കുന്നതായി സാക്ഷ്യപ്പെടുത്തപ്പെട്ടവൻ അവ സ്വീകരിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അവൻ ജീവിക്കുന്നു എന്ന് അവനെക്കുറിച്ച് സാക്ഷ്യപ്പെടുത്തുന്നു.” മെൽക്കീസേദെക്ക് അക്ഷരാർഥത്തിൽ അമരനാണെന്ന് നേരിട്ട് പ്രസ്താവിക്കുന്നതിനുപകരം, ഗ്രീക്ക് വാചകം ഈ കാര്യം തിരുവെഴുത്തിലെ സാക്ഷ്യമായി അവതരിപ്പിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ὧδε
  choice: ഇവിടെ
  rationale: ἐκεῖ എന്നതിനോടുള്ള ‘ഇവിടെ ... അവിടെ’ എന്ന ദൈക്തിക വൈരുധ്യം നിലനിർത്തുന്നു; ഇപ്പോഴത്തെ ലേവ്യ പുരോഹിതക്രമത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: δεκάτας
  choice: ദശാംശങ്ങൾ
  rationale: ആരാധനാ-നിയമപരമായ പശ്ചാത്തലത്തിലെ പത്തിലൊന്ന് നൽകുന്ന പതിവിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും പ്രചാരത്തിലുള്ളതുമായ പദം.
- source_word: ἀποθνῄσκοντες ἄνθρωποι
  choice: മരിക്കുന്ന മനുഷ്യർ
  rationale: വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ അർഥം നേരിട്ട് നിലനിർത്തുകയും ലേവ്യ പുരോഹിതരുടെ മരണവിധേയത്വം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: λαμβάνουσιν
  choice: സ്വീകരിക്കുന്നു
  rationale: ദശാംശം കൈപ്പറ്റുന്നതിനെ അധിക വ്യാഖ്യാനം ചേർക്കാതെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἐκεῖ
  choice: അവിടെ
  rationale: ഉല്പത്തി വിവരണത്തിൽ മെൽക്കീസേദെക്കിനെ അവതരിപ്പിക്കുന്ന സാഹചര്യത്തെ സൂചിപ്പിച്ച് ὧδε-യോടുള്ള സമാന്തര വൈരുധ്യം സംരക്ഷിക്കുന്നു.
- source_word: μαρτυρούμενος
  choice: സാക്ഷ്യപ്പെടുത്തപ്പെടുന്നു
  rationale: ഗ്രീക്കിലെ നിഷ്ക്രിയരൂപവും തിരുവെഴുത്തിലെ സാക്ഷ്യത്തിന്റെ തെളിവുസ്വഭാവവും നിലനിർത്തുന്നു.
- source_word: ὅτι ζῇ
  choice: അവൻ ജീവിക്കുന്നു എന്ന്
  rationale: വർത്തമാനകാലവും ὅτι-വാക്യത്തിന്റെ ഘടനയും നേരിട്ട് സംരക്ഷിക്കുന്നു; മെൽക്കീസേദെക്കിന്റെ അക്ഷരാർഥത്തിലുള്ള അമരത്വം വിവർത്തനം സ്വയം പ്രഖ്യാപിക്കുന്നില്ല.
theological_decisions:
- issue: ലേവ്യ പുരോഹിതരും മെൽക്കീസേദെക്കും തമ്മിലുള്ള വൈരുധ്യത്തിന്റെ സ്വഭാവം
  choice: മരിക്കുന്ന ലേവ്യ പുരോഹിതരെ, ജീവിക്കുന്നു എന്ന് സാക്ഷ്യപ്പെടുത്തപ്പെടുന്ന മെൽക്കീസേദെക്കുമായി താരതമ്യം ചെയ്യുന്നു.
  alternative: മെൽക്കീസേദെക്ക് വ്യക്തിപരമായി അക്ഷരാർഥത്തിൽ എന്നേക്കും അമരനാണെന്ന് ഈ വാക്യം നേരിട്ട് പഠിപ്പിക്കുന്നു.
  rationale: μαρτυρούμενος എന്ന നിഷ്ക്രിയ സാക്ഷ്യഭാഷ നിലനിർത്തുന്നത് വാദത്തെ തിരുവെഴുത്തിലെ അവതരണവുമായി ബന്ധിപ്പിക്കുകയും അക്ഷരാർഥത്തിലുള്ള അമരത്വത്തെ നിർബന്ധിതമായി തീർപ്പാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ഇവിടെ ... എന്നാൽ അവിടെ’ എന്ന വാഗ്മയ വൈരുധ്യവും നിഷ്ക്രിയ സാക്ഷ്യഭാഷയും സംരക്ഷിച്ചു.
