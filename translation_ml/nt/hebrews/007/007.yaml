  text: χωρὶς δὲ πάσης ἀντιλογίας τὸ ἔλαττον ὑπὸ τοῦ κρείττονος εὐλογεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/007.yaml
  text: Beyond all dispute[a], the lesser is blessed by the greater.
translation:
  language: ml
  text: യാതൊരു തർക്കവുമില്ലാതെ[a], താഴ്ന്നവൻ ശ്രേഷ്ഠനാൽ അനുഗ്രഹിക്കപ്പെടുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യാതൊരു എതിർവാദവുമില്ലാതെ’ അല്ലെങ്കിൽ ‘യാതൊരു വൈരുധ്യവുമില്ലാതെ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς δὲ πάσης ἀντιλογίας
  choice: യാതൊരു തർക്കത്തിനും ഇടയില്ലാതെ
  rationale: χωρίς + πάσης ἀντιλογίας എന്ന പ്രയോഗം എതിർവാദത്തിനോ തർക്കത്തിനോ ഇടയില്ലെന്ന സ്വയംവ്യക്തമായ ഉറപ്പ് അറിയിക്കുന്നു. δέ ഇവിടെ നേരിയ ആശയമാറ്റം സൂചിപ്പിക്കുന്നതിനാൽ പ്രത്യേകമായ വിരുദ്ധബന്ധപദം ചേർക്കാതെ മലയാളവാക്യത്തിന്റെ ഒഴുക്കിൽ ഉൾപ്പെടുത്തി.
- source_word: τὸ ἔλαττον
  choice: ചെറിയവൻ
  rationale: നപുംസകലിംഗ താരതമ്യപദം ഇവിടെ വ്യക്തികളെ പൊതുവായി സൂചിപ്പിക്കുന്നു. ‘ചെറിയവൻ’ പദവി അഥവാ നിലയിലെ താരതമ്യം നിലനിർത്തുന്നു; ധാർമികമായ അധമത്വം അനാവശ്യമായി സൂചിപ്പിക്കുന്നില്ല.
- source_word: ὑπὸ τοῦ κρείττονος
  choice: വലിയവനാൽ
  rationale: ὑπό + genitive കർമണിപ്രയോഗത്തിലെ കർത്താവിനെ സൂചിപ്പിക്കുന്നു. κρείττων ഇവിടെ ഉയർന്ന പദവിയെയോ ശ്രേഷ്ഠസ്ഥാനത്തെയോ താരതമ്യമായി സൂചിപ്പിക്കുന്നു; ‘വലിയവൻ’ അതിനെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: εὐλογεῖται
  choice: അനുഗ്രഹിക്കപ്പെടുന്നു
  rationale: വർത്തമാനകാല കർമണിരൂപത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ ഇത് മെൽക്കീസേദെക്ക് അബ്രാഹാമിനെ അനുഗ്രഹിച്ചതിനെക്കുറിച്ചായതിനാൽ ‘നല്ലതു പറയുന്നു’ എന്നതിനെക്കാൾ ‘അനുഗ്രഹിക്കപ്പെടുന്നു’ യോജിക്കുന്നു.
theological_decisions:
- issue: ‘ചെറിയവൻ’, ‘വലിയവൻ’ എന്നീ താരതമ്യങ്ങളുടെ സ്വഭാവം
  choice: താഴ്ന്ന നിലയിലുള്ളവൻ ഉയർന്ന നിലയിലുള്ളവനാൽ അനുഗ്രഹിക്കപ്പെടുന്നു എന്ന പൊതുതത്ത്വമായി പരിഭാഷപ്പെടുത്തി.
  alternative: ദൈവശാസ്ത്രപരമായ പ്രാധാന്യമില്ലാത്ത ഒരു സാമൂഹിക പതിവായി മാത്രം വ്യക്തമാക്കുക.
  rationale: എബ്രായർ 7-ന്റെ വാദത്തിൽ ഈ പ്രസ്താവന മെൽക്കീസേദെക്കിന് അബ്രാഹാമിനേക്കാൾ ഉയർന്ന സ്ഥാനം ഉണ്ടെന്നതിന് പിന്തുണ നൽകുന്നു. എന്നാൽ വാക്യത്തിൽ ഇല്ലാത്ത വിശദീകരണം ചേർക്കാതെ താരതമ്യത്തിലെ പദവിവ്യത്യാസം മാത്രം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. വാക്യത്തിന്റെ പൊതുതത്ത്വസ്വഭാവവും കർമണിപ്രയോഗവും സംരക്ഷിച്ചു.
