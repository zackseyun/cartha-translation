  rationale: The revision removes the likely physical-size/age implication of «ചെറിയവൻ/വലിയവൻ» and expresses the Greek comparative relation as lower and higher status. It also makes the opening idiom more concise and natural. The passive verb and the source’s general-principle formulation are retained; no interpretive expansion concerning Melchizedek or Abraham is added.
