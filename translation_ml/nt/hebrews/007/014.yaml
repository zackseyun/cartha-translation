source:
  edition: SBLGNT
  text: πρόδηλον γὰρ ὅτι ἐξ Ἰούδα ἀνατέταλκεν ὁ κύριος ἡμῶν, εἰς ἣν φυλὴν ⸂περὶ ἱερέων οὐδὲν⸃ Μωϋσῆς ἐλάλησεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/014.yaml
  text: For it is evident that our Lord has arisen from Judah[a], a tribe about which Moses said nothing concerning priests.
translation:
  language: ml
  text: കാരണം, നമ്മുടെ കർത്താവ് യെഹൂദയിൽനിന്ന് ഉദിച്ചുവന്നിരിക്കുന്നു[a] എന്നത് വ്യക്തമാണ്. ആ ഗോത്രത്തെ സംബന്ധിച്ച് പുരോഹിതന്മാരെക്കുറിച്ച് മോശെ ഒന്നും പറഞ്ഞിട്ടില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യെഹൂദയിൽനിന്ന് മുളച്ചുവന്നിരിക്കുന്നു.’ ഗ്രീക്ക് ക്രിയ ഉദിക്കുകയോ മുളച്ചുവരുകയോ ചെയ്യുന്ന ദൃശ്യരൂപം ഉണർത്തുന്നു. ഇവിടെ പ്രധാനമായും ഉദ്ദേശിക്കുന്നത് പുനരുത്ഥാനമല്ല, യെഹൂദാഗോത്രത്തിൽനിന്നുള്ള ഉത്ഭവമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρόδηλον
  choice: വ്യക്തമാണ്
  rationale: ഒരു കാര്യം തെളിഞ്ഞതും സംശയരഹിതവുമാണെന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: γὰρ
  choice: വാക്യങ്ങളുടെ വിശദീകരണബന്ധത്തിലൂടെ പ്രകടമാക്കി
  rationale: മുൻവാദത്തിനുള്ള വിശദീകരണമാണ് ഈ വാക്യം. മലയാളത്തിൽ പ്രത്യേകമായ ‘എന്തെന്നാൽ’ ചേർക്കാതെ പ്രസ്താവനയുടെ ക്രമത്തിലൂടെ ആ ബന്ധം സ്വാഭാവികമായി നിലനിർത്തി.
- source_word: ἐξ Ἰούδα
  choice: യെഹൂദയിൽനിന്ന്
  rationale: ഉത്ഭവവും വംശപരമായ ബന്ധവും സൂചിപ്പിക്കുന്നു; പിന്നാലെ ‘ഗോത്രം’ വരുന്നതിനാൽ ഇവിടെ അതു ആവർത്തിച്ചിട്ടില്ല.
- source_word: ἀνατέταλκεν
  choice: ഉദിച്ചുവന്നിരിക്കുന്നു
  rationale: ഉദിക്കുക, മുളച്ചുവരിക എന്ന ദൃശ്യരൂപം നിലനിർത്തുകയും പൂർത്തികാലത്തിന്റെ ഇപ്പോഴുള്ള പ്രസക്തി സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ὁ κύριος ἡμῶν
  choice: നമ്മുടെ കർത്താവ്
  rationale: പദവിയും ഉടമസ്ഥസർവനാമവും സ്വാഭാവികവും സഭാപാരമ്പര്യപരമായി പരിചിതവുമായ മലയാളത്തിൽ നൽകുന്നു; ‘യേശു’ എന്ന് പാഠത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: εἰς ἣν φυλήν
  choice: ആ ഗോത്രത്തെക്കുറിച്ച്
  rationale: ഇപ്പോൾ പറഞ്ഞ യെഹൂദാഗോത്രത്തെ പരാമർശിച്ച് അതുമായി ബന്ധപ്പെട്ട മോശെയുടെ മൗനം അവതരിപ്പിക്കുന്നു.
- source_word: περὶ ἱερέων οὐδὲν
  choice: പുരോഹിതന്മാരെ സംബന്ധിക്കുന്ന ഒന്നും
  rationale: ‘പൗരോഹിത്യം’ എന്ന അമൂർത്ത ആശയം ചേർക്കാതെ ഗ്രീക്കിലെ ബഹുവചനമായ ‘പുരോഹിതന്മാർ’ നിലനിർത്തുന്നു.
- source_word: Μωϋσῆς ἐλάλησεν
  choice: മോശെ പറഞ്ഞിട്ടില്ല
  rationale: λαλέω എന്ന സാധാരണ ‘പറയുക/സംസാരിക്കുക’ എന്ന അർഥം സന്ദർഭോചിതമായി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ‘നമ്മുടെ കർത്താവ്’ എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: പാഠത്തിലെ പദവി അതേപടി നിലനിർത്തി; സന്ദർഭത്തിൽ അത് യേശുവിനെ സൂചിപ്പിക്കുന്നു.
  alternative: ‘നമ്മുടെ കർത്താവായ യേശു’ എന്ന് വ്യക്തമായി ചേർക്കുക.
  rationale: എബ്രായലേഖനത്തിന്റെ അടുത്ത സന്ദർഭം യേശുവിന്റെ യെഹൂദാവംശബന്ധത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, മൂലപാഠം ഇവിടെ പേര് ചേർക്കുന്നില്ല.
- issue: ἀνατέταλκεν എന്ന ക്രിയയുടെ ആശയം
  choice: യെഹൂദയിൽനിന്നുള്ള ഉത്ഭവം/വംശപരമ്പര സൂചിപ്പിക്കുന്ന ‘ഉദിച്ചുവന്നിരിക്കുന്നു’.
  alternative: ‘ഉയിർത്തെഴുന്നേറ്റിരിക്കുന്നു’ എന്ന പുനരുത്ഥാനാർത്ഥം, അല്ലെങ്കിൽ രൂപകം ഒഴിവാക്കി ‘വംശജനായിരിക്കുന്നു’.
  rationale: സന്ദർഭം ഗോത്രവംശത്തെയും പുരോഹിതയോഗ്യതയെയും കുറിച്ചാണ്. അതിനാൽ പുനരുത്ഥാനം പ്രധാന അർഥമല്ല; അതേസമയം മൂലത്തിലെ ഉദയം/മുളപ്പ് എന്ന രൂപകം പൂർണമായി ഇല്ലാതാക്കിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘കർത്താവ്’, ‘ഗോത്രം’, ‘പുരോഹിതന്മാർ’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തി; ഗ്രീക്കിലെ രൂപകവും ഗോത്രപരമായ വാദവും സാധാരണ വായനക്കാരന് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ അവതരിപ്പിച്ചു.
