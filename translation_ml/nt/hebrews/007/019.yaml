revisions:
- from: എന്തെന്നാൽ, ന്യായപ്രമാണം ഒന്നിനെയും പൂർണതയിൽ എത്തിച്ചില്ല[a]; എന്നാൽ അതിലും മെച്ചമായ ഒരു പ്രത്യാശ കൊണ്ടുവരപ്പെട്ടു[b]. ആ പ്രത്യാശയിലൂടെയാണ് നാം ദൈവത്തോട് അടുത്തുചെല്ലുന്നത്.
  to: എന്തെന്നാൽ, ന്യായപ്രമാണം ഒന്നിനെയും പൂർണതയിലെത്തിച്ചില്ല[a]; എന്നാൽ മെച്ചമായ ഒരു പ്രത്യാശയുടെ അവതരണമുണ്ടായി[b]. ആ പ്രത്യാശയിലൂടെ നാം ദൈവത്തോടു സമീപിക്കുന്നു.
