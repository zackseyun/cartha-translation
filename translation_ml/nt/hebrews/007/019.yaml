id: HEB.7.19
reference: Hebrews 7:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐδὲν γὰρ ἐτελείωσεν ὁ νόμος, ἐπεισαγωγὴ δὲ κρείττονος ἐλπίδος, δι’ ἧς ἐγγίζομεν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/019.yaml
  text: For the law perfected nothing[a], but there is the introduction of a better hope[b], through which we draw near to God.
translation:
  language: ml
  text: എന്തെന്നാൽ, ന്യായപ്രമാണം ഒന്നിനെയും പൂർണതയിലെത്തിച്ചില്ല[a]; എന്നാൽ മെച്ചമായ ഒരു പ്രത്യാശയുടെ അവതരണമുണ്ടായി[b]. ആ പ്രത്യാശയിലൂടെ നാം ദൈവത്തോടു സമീപിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒന്നിനെയും തികവുള്ളതാക്കിയില്ല.” ഗ്രീക്ക് ക്രിയയ്ക്ക് “പൂർത്തിയിലേക്കെത്തിച്ചു” എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “മെച്ചമായ ഒരു പ്രത്യാശയെ കൊണ്ടുവരൽ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲν
  choice: ഒന്നിനെയും
  rationale: ക്രിയയുടെ നപുംസകലിംഗ കർമമായി വരുന്ന സമ്പൂർണ നിഷേധം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻപ്രസ്താവനയ്ക്ക് വിശദീകരണമോ അടിസ്ഥാനമോ നൽകുന്ന ബന്ധകശക്തി വ്യക്തമാക്കുന്നു.
- source_word: ἐτελείωσεν
  choice: പൂർണതയിൽ എത്തിച്ചില്ല
  rationale: എബ്രായലേഖനത്തിൽ ലക്ഷ്യസിദ്ധി, സമാപ്തി, ദൈവസന്നിധിയിലേക്കുള്ള പ്രാപ്യത എന്നിവയുമായി ബന്ധപ്പെട്ട τελειόω എന്ന പ്രധാന പദത്തിന്റെ അർഥവ്യാപ്തി സൂക്ഷിക്കുന്നു; വെറും ‘ഒന്നും ചെയ്തില്ല’ എന്നാക്കി ചുരുക്കുന്നില്ല.
- source_word: ὁ νόμος
  choice: ന്യായപ്രമാണം
  rationale: സന്ദർഭത്തിലെ മോശൈക നിയമ-പുരോഹിത വ്യവസ്ഥയെ മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും വ്യക്തവുമായ രീതിയിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἐπεισαγωγὴ
  choice: കൊണ്ടുവരപ്പെട്ടു
  rationale: അപൂർണമായ ഗ്രീക്ക് നാമവാക്യത്തിന്റെ ‘കൊണ്ടുവരൽ/അവതരിപ്പിക്കൽ’ എന്ന ആശയം സ്വാഭാവിക മലയാള വാക്യമായി നൽകുന്നു; കർത്തൃവാചകമോ കാലസൂചനയോ അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: ന്യായപ്രമാണത്തിന്റെ പരിമിതിയും മെച്ചമായ പ്രത്യാശയുടെ വരവും തമ്മിലുള്ള വൈരുധ്യം വ്യക്തമാക്കുന്നു.
- source_word: κρείττονος ἐλπίδος
  choice: അതിലും മെച്ചമായ ഒരു പ്രത്യാശ
  rationale: κρείττων എന്ന എബ്രായലേഖനത്തിലെ ആവർത്തിത താരതമ്യപദത്തിന് ‘മെച്ചമായ’ എന്നു നൽകുന്നു; ‘അതിലും’ എന്നത് ന്യായപ്രമാണത്തോടുള്ള സന്ദർഭപരമായ താരതമ്യം സ്വാഭാവികമാക്കുന്നു.
- source_word: δι’ ἧς
  choice: ആ പ്രത്യാശയിലൂടെ
  rationale: സ്ത്രീലിംഗ ആപേക്ഷിക സർവനാമത്തിന്റെ ഏറ്റവും സ്വാഭാവിക മുൻപദം ‘പ്രത്യാശ’ ആണെന്ന് വ്യക്തമാക്കുകയും ഉപാധി/മാധ്യമം എന്ന അർഥം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐγγίζομεν
  choice: നാം ദൈവത്തോട് അടുത്തുചെല്ലുന്നു
  rationale: ദൈവസന്നിധിയിലേക്കുള്ള ആരാധനാപരവും ദൈവശാസ്ത്രപരവുമായ സമീപനം സൂചിപ്പിക്കുന്ന ‘draw near’ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τῷ θεῷ
  choice: ദൈവത്തോട്
  rationale: ἐγγίζομεν എന്ന ക്രിയയോടൊപ്പമുള്ള ദിശ/സമീപനബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ന്യായപ്രമാണവുമായി ബന്ധപ്പെട്ട τελειόω എന്നതിന്റെ അർഥം
  choice: ന്യായപ്രമാണം ഒന്നിനെയും പൂർണതയിൽ എത്തിച്ചില്ല
  alternative: ന്യായപ്രമാണം ഒന്നും ചെയ്തില്ല
  rationale: ഈ ക്രിയ എബ്രായലേഖനത്തിൽ ഉദ്ദേശിച്ച ലക്ഷ്യത്തിലേക്കോ ദൈവസന്നിധിയിലുള്ള പൂർണ പ്രാപ്യതയിലേക്കോ എത്തിക്കൽ എന്ന ഭാരം വഹിക്കുന്നു. അതിനാൽ ന്യായപ്രമാണം എല്ലാ നിലയിലും ഉപയോഗശൂന്യമായിരുന്നു എന്ന അതിവ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
- issue: നിഷേധവാക്യത്തിനു ശേഷമുള്ള ഗ്രീക്ക് നാമവാക്യത്തിന്റെ അപൂർണ ഘടന
  choice: എന്നാൽ അതിലും മെച്ചമായ ഒരു പ്രത്യാശ കൊണ്ടുവരപ്പെട്ടു
  alternative: എന്നാൽ അതിലും മെച്ചമായ ഒരു പ്രത്യാശയുടെ കൊണ്ടുവരൽ ഉണ്ടായി
  rationale: ഗ്രീക്കിലെ നാമഘടനയുടെ ആശയം സൂക്ഷിക്കുമ്പോഴും മലയാളത്തിൽ അസ്വാഭാവികമായ നാമവാക്യം ഒഴിവാക്കുന്നു. പ്രത്യാശ എപ്പോൾ അല്ലെങ്കിൽ ആരാൽ കൊണ്ടുവരപ്പെട്ടു എന്നത് വാക്യത്തിൽ ചേർക്കുന്നില്ല.
- issue: δι’ ἧς എന്നതിന്റെ മുൻപദം
  choice: ‘പ്രത്യാശ’യെ സൂചിപ്പിക്കുന്നതായി വ്യക്തമായി ആവർത്തിച്ചു
  alternative: ‘അതിലൂടെ’ എന്ന അവ്യക്തമായ സർവനാമം ഉപയോഗിക്കുക
  rationale: ഗ്രീക്കിലെ സ്ത്രീലിംഗ സർവനാമം κρείττονος ἐλπίδος എന്നതിലേക്കാണ് ഏറ്റവും സ്വാഭാവികമായി മടങ്ങുന്നത്. മലയാളത്തിൽ ‘ആ പ്രത്യാശയിലൂടെ’ എന്നത് ആശയക്കുഴപ്പം ഒഴിവാക്കുന്നു; ദൈവത്തോട് അടുത്തുചെല്ലാനുള്ള മാർഗം പ്രത്യാശ തന്നെയാണെന്ന വാക്യബന്ധം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ dignified എന്നാൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ശൈലി. ‘ന്യായപ്രമാണം’ എന്ന പരിചിതമായ തിരുവെഴുത്തുപദം നിലനിർത്തി; ‘പൂർണതയിൽ എത്തിക്കുക’, ‘അടുത്തുചെല്ലുക’ എന്നീ പ്രയോഗങ്ങൾ എബ്രായലേഖനത്തിലെ മുഖ്യ ആശയബന്ധങ്ങൾ സംരക്ഷിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
