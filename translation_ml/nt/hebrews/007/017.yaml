source:
  edition: SBLGNT
  text: ⸀μαρτυρεῖται γὰρ ὅτι Σὺ ἱερεὺς εἰς τὸν αἰῶνα κατὰ τὴν τάξιν Μελχισέδεκ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/017.yaml
  text: 'For it is testified: “You are a priest forever according to the order of Melchizedek.”[a][b]'
translation:
  language: ml
  text: 'എന്തെന്നാൽ, ഇങ്ങനെ സാക്ഷ്യം നൽകപ്പെടുന്നു: “മെൽക്കീസേദെക്കിന്റെ ക്രമപ്രകാരം നീ എന്നേക്കും ഒരു പുരോഹിതനാണ്.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മെൽക്കീസേദെക്കിന്റെ മാതൃകപ്രകാരം നീ എന്നേക്കും ഒരു പുരോഹിതനാണ്.”
    reason: lexical_alternative
  - marker: b
    text: സങ്കീർത്തനം 110:4-ൽനിന്നുള്ള ഉദ്ധരണി.
    reason: cross_reference
lexical_decisions:
- source_word: μαρτυρεῖται
  choice: സാക്ഷ്യപ്പെടുത്തിയിരിക്കുന്നു
  rationale: വർത്തമാനകാല കർമണിപ്രയോഗത്തിന്റെ വ്യക്തിനിരപേക്ഷ സ്വഭാവം നിലനിർത്തുകയും തിരുവെഴുത്ത് സാക്ഷ്യം ഉദ്ധരിക്കുന്ന സന്ദർഭം വ്യക്തമാക്കുകയും ചെയ്യുന്നു; സാക്ഷ്യം നൽകുന്ന വിഷയം അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിന് ആധാരമോ വിശദീകരണമോ നൽകുന്ന ബന്ധകത്തിന്റെ ശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: ὅτι
  choice: ':'
  rationale: സാക്ഷ്യത്തിന്റെ ഉള്ളടക്കമായ നേരിട്ടുള്ള ഉദ്ധരണിയെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കാൻ ദ്വിബിന്ദു ഉപയോഗിച്ചു.
- source_word: Σὺ
  choice: നീ
  rationale: ഏകവചന ദ്വിതീയപുരുഷനെ നേരിട്ടുള്ള അഭിസംബോധനയായി കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: ἱερεὺς
  choice: ഒരു പുരോഹിതൻ
  rationale: അഭിസംബോധിതന്റെ പദവി സൂചിപ്പിക്കുന്ന വിധേയനാമം; ‘മഹാപുരോഹിതൻ’ എന്ന് വിപുലീകരിക്കാതെ ഗ്രീക്കിലെ ἱερεύς മാത്രം പരിഭാഷപ്പെടുത്തി.
- source_word: εἰς τὸν αἰῶνα
  choice: എന്നേക്കും
  rationale: തുടർച്ചയായ, അവസാനമില്ലാത്ത കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവികവും മാന്യവുമായ മലയാളരൂപം.
- source_word: κατὰ τὴν τάξιν
  choice: ക്രമപ്രകാരം
  rationale: ഒരു ക്രമത്തോടോ മാതൃകയോടോ ഉള്ള അനുരൂപത സൂചിപ്പിക്കുന്നു; മൂലത്തിലെ അർഥവ്യാപ്തി ചുരുക്കാതെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ രൂപം.
- source_word: Μελχισέδεκ
  choice: മെൽക്കീസേദെക്ക്
  rationale: വ്യക്തിനാമം മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ ശബ്ദലിപ്യന്തരണരൂപത്തിൽ നൽകി.
theological_decisions:
- issue: സങ്കീർത്തന ഉദ്ധരണിയിലെ പൗരോഹിത്യപദവിയെ പിൽക്കാല ദൈവശാസ്ത്ര വിശദീകരണങ്ങൾ ചേർക്കാതെ പരിഭാഷപ്പെടുത്തൽ
  choice: “നീ എന്നേക്കും ഒരു പുരോഹിതനാകുന്നു” എന്ന നേരിട്ടുള്ള പ്രസ്താവന നിലനിർത്തി.
  alternative: വ്യക്തതയ്ക്കായി “മഹാപുരോഹിതൻ” എന്ന് വിപുലീകരിക്കുക.
  rationale: ഈ വാക്യത്തിലെ ഗ്രീക്ക് പദം ἱερεύς ‘പുരോഹിതൻ’ എന്നാണ്; എബ്രായർ ലേഖനം യേശുവിനെ മഹാപുരോഹിതനായി വിശദീകരിക്കുന്നുവെങ്കിലും, ആ വിശേഷണം ഇവിടെ ചേർക്കുന്നത് മൂലപാഠത്തിന് അതീതമായിരിക്കും.
- issue: κατὰ τὴν τάξιν എന്നതിലെ τάξις-ന്റെ അർഥവ്യാപ്തി
  choice: “ക്രമപ്രകാരം” എന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: “മാതൃകപ്രകാരം” അല്ലെങ്കിൽ “രീതിയിൽ” എന്ന് പരിഭാഷപ്പെടുത്തുക.
  rationale: ‘ക്രമം’ എന്നത് സ്ഥാപിത ക്രമം, വിഭാഗം, മാതൃകയോടുള്ള അനുരൂപത എന്നിവയുടെ സാധ്യത നിലനിർത്തുന്നു; ഒരൊറ്റ വ്യാഖ്യാനത്തിലേക്ക് വാക്യത്തെ ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. തിരുവെഴുത്തുസാക്ഷ്യത്തിന്റെ ഔപചാരിക ഭാവം നിലനിർത്താൻ ‘സാക്ഷ്യപ്പെടുത്തിയിരിക്കുന്നു’ ഉപയോഗിച്ചു; ഉദ്ധരണിയുടെ കാവ്യാത്മക ഗൗരവം സംരക്ഷിച്ചുകൊണ്ട് പഴഞ്ചൻ വാക്യഘടന ഒഴിവാക്കി.
