language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τοιοῦτος γὰρ ἡμῖν ⸀καὶ ἔπρεπεν ἀρχιερεύς, ὅσιος, ἄκακος, ἀμίαντος, κεχωρισμένος ἀπὸ τῶν ἁμαρτωλῶν, καὶ ὑψηλότερος τῶν οὐρανῶν γενόμενος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/026.yaml
  text: 'For such a high priest was indeed fitting for us: holy[a], innocent, undefiled, separated from sinners[b], and having become higher than the heavens.'
translation:
  language: ml
  text: 'എന്തെന്നാൽ, നമുക്കു ഇങ്ങനെയുള്ള ഒരു മഹാപുരോഹിതൻതന്നെ യോജിച്ചവനായിരുന്നു: വിശുദ്ധനും നിർദോഷനും കളങ്കമില്ലാത്തവനും പാപികളിൽനിന്നു വേർതിരിക്കപ്പെട്ടവനും[a] ആകാശങ്ങളെക്കാൾ ഉന്നതനായിത്തീർന്നവനും[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പാപികളിൽനിന്നു വേറിട്ടുനിൽക്കുന്നവൻ’ എന്നും വിവർത്തനം ചെയ്യാം. ഈ പ്രയോഗം അദ്ദേഹത്തിന്റെ ധാർമിക വിശുദ്ധിയെയും ഉന്നത മഹാപുരോഹിതസ്ഥാനത്തെയും എടുത്തുകാട്ടുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ആകാശങ്ങൾക്കുമീതെ ഉയർത്തപ്പെട്ടവൻ’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοιοῦτος
  choice: ഇങ്ങനെയുള്ള
  rationale: മുൻവാക്യങ്ങളിൽ വിവരിച്ച മഹാപുരോഹിതന്റെ സ്വഭാവത്തിലേക്കു പിന്നോട്ടു ചൂണ്ടുന്ന പ്രയോഗത്തിന്റെ അനാഫോറിക ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: γὰρ
  choice: വാക്യബന്ധത്തിലൂടെ സൂചിപ്പിച്ചു
  rationale: ഇത് മുൻവാദത്തിന്റെ വിശദീകരണമാണെന്ന ബന്ധം മലയാളത്തിലെ തുടർച്ചയിലും ‘തന്നെ’ എന്ന ഊന്നലിലും വ്യക്തമാണ്; ഇവിടെ ‘എന്തെന്നാൽ’ ചേർക്കുന്നത് വാക്യം അസ്വാഭാവികമാക്കും.
- source_word: ἡμῖν καὶ ἔπρεπεν
  choice: തന്നെയായിരുന്നു നമുക്കു യോജിച്ചത്
  rationale: ἡμῖν എന്നതിന്റെ ബന്ധപരമായ ദാതിവ് ‘നമുക്ക്’ എന്നും ἔπρεπεν എന്നതിന്റെ യോജ്യത ‘യോജിച്ചത്’ എന്നും നൽകുന്നു; καίയുടെ ഊന്നൽ ‘തന്നെ’ കൊണ്ട് പകർത്തുന്നു.
- source_word: ἀρχιερεύς
  choice: മഹാപുരോഹിതൻ
  rationale: എബ്രായർക്കുള്ള ലേഖനത്തിലെ പുരോഹിതപദവിക്ക് നിലവാരമുള്ളതും കൃത്യവുമായ മലയാളപദം.
- source_word: ὅσιος
  choice: വിശുദ്ധൻ
  rationale: ദൈവത്തോടുള്ള വിശുദ്ധമായ സമർപ്പണവും ധാർമിക വിശുദ്ധിയും ഉൾക്കൊള്ളുന്ന, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പദം.
- source_word: ἄκακος
  choice: നിർദോഷൻ
  rationale: തിന്മയോ ദുഷ്ടലക്ഷ്യമോ ഇല്ലാത്ത ധാർമിക നിഷ്കളങ്കത വ്യക്തമാക്കുന്നു; ‘ഉപദ്രവമില്ലാത്തവൻ’ എന്ന ദുർബലമായ അർഥം ഒഴിവാക്കുന്നു.
- source_word: ἀμίαντος
  choice: കളങ്കമില്ലാത്തവൻ
  rationale: ധാർമികവും ആരാധനാസംബന്ധവുമായ അശുദ്ധിയില്ലായ്മയുടെ പ്രതിധ്വനി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: κεχωρισμένος ἀπὸ τῶν ἁμαρτωλῶν
  choice: പാപികളിൽനിന്നു വേർതിരിക്കപ്പെട്ടവൻ
  rationale: പൂർണ്ണകാല കൃതന്തം സൂചിപ്പിക്കുന്ന നിലനിൽക്കുന്ന വേർതിരിവ് നേരിട്ട് പകർത്തുന്നു; അത് എപ്പോൾ അല്ലെങ്കിൽ ഏതു വിധത്തിൽ സംഭവിച്ചു എന്ന് മുഖ്യവാചകം നിർണ്ണയിക്കുന്നില്ല.
- source_word: ὑψηλότερος τῶν οὐρανῶν γενόμενος
  choice: ആകാശങ്ങളെക്കാൾ ഉന്നതനായിത്തീർന്നവൻ
  rationale: താരതമ്യരൂപവും γενόμενος സൂചിപ്പിക്കുന്ന ഫലപ്രാപ്തിയുള്ള നിലയിലേക്കുള്ള പ്രവേശനവും നിലനിർത്തുന്നു; കർത്തൃത്വം പ്രത്യേകം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ‘പാപികളിൽനിന്നു വേർതിരിക്കപ്പെട്ടവൻ’ എന്നതിൽ യേശുവും പാപികളും തമ്മിലുള്ള ബന്ധം
  choice: വാചകം നേരിട്ടുതന്നെ നിലനിർത്തി; അടിക്കുറിപ്പിൽ ധാർമിക വിശുദ്ധിയുടെയും ഉന്നത പുരോഹിതസ്ഥാനത്തിന്റെയും പശ്ചാത്തലം സൂചിപ്പിച്ചു.
  alternative: ഇത് പാപികളുമായുള്ള ശാരീരികമോ സാമൂഹികമോ ആയ എല്ലാ സമ്പർക്കത്തിന്റെയും നിഷേധമായി വിവർത്തനം ചെയ്യുക.
  rationale: ചുറ്റുമുള്ള വിശേഷണങ്ങൾ മഹാപുരോഹിതന്റെ വിശുദ്ധിയും യോഗ്യതയും ഉയർച്ചയും വിവരിക്കുന്നു. സുവിശേഷങ്ങളിലെ പാപികളുമായുള്ള യേശുവിന്റെ സഹവാസത്തെ നിഷേധിക്കാതെയും വാക്യത്തിന്റെ യഥാർഥ വ്യാപ്തി അതിയായി ചുരുക്കാതെയും മൂലപാഠത്തിലെ സംഘർഷം സംരക്ഷിക്കുന്നു.
- issue: γενόμενος എന്നതും ആകാശങ്ങളെക്കാൾ ഉന്നതമായ നിലയും
  choice: ‘ഉന്നതനായിത്തീർന്നവൻ’ എന്ന് നൽകി രക്ഷാചരിത്രത്തിലെ ഉയർത്തപ്പെട്ട പുരോഹിതസ്ഥാനത്തിലേക്കുള്ള ഫലപ്രാപ്തി സൂചിപ്പിച്ചു.
  alternative: ‘എപ്പോഴും ആകാശങ്ങളെക്കാൾ ഉന്നതനായിരിക്കുന്നവൻ’ എന്ന നിലാവിവരണം, അല്ലെങ്കിൽ ‘ഉയർത്തപ്പെട്ടവൻ’ എന്ന വ്യക്തമായ കർമണിപ്രയോഗം.
  rationale: γενόμενος ചരിത്രപരവും ഫലസൂചകവുമായ ചലനം രേഖപ്പെടുത്തുന്നു; എന്നാൽ ദൈവസ്വഭാവത്തിലെ മാറ്റമോ പ്രവർത്തകനെയോ മൂലപാഠം ഇവിടെ വ്യക്തമാക്കുന്നില്ല. അതിനാൽ അവ വിവർത്തനത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. വിശേഷണങ്ങളുടെ നിരയും പുരോഹിതപരമായ ഭാവവും നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
