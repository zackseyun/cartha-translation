revisions:
- from: മാത്രമല്ല, ഇത് ശപഥം കൂടാതെയായിരുന്നില്ല എന്നതുകൊണ്ടും—(അവർ ശപഥം കൂടാതെയാണ് പുരോഹിതന്മാരായിത്തീർന്നത്;[a]
  to: ഇതും ശപഥം കൂടാതെയല്ലായിരുന്നതുകൊണ്ട്—(കാരണം, അവർ ശപഥം കൂടാതെ[a] പുരോഹിതന്മാരായിത്തീർന്നവരാണ്;
