source:
  edition: SBLGNT
  text: Καὶ καθ’ ὅσον οὐ χωρὶς ὁρκωμοσίας (οἱ μὲν γὰρ χωρὶς ὁρκωμοσίας εἰσὶν ἱερεῖς γεγονότες,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/020.yaml
  text: And inasmuch as this was not without an oath (for they indeed have become priests without an oath,[a]
translation:
  language: ml
  text: ഇതും ശപഥം കൂടാതെയല്ലായിരുന്നതുകൊണ്ട്—(കാരണം, അവർ ശപഥം കൂടാതെ[a] പുരോഹിതന്മാരായിത്തീർന്നവരാണ്;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ശപഥമില്ലാതെ.’
    reason: χωρὶς ὁρκωμοσίας എന്ന പ്രയോഗത്തിന് ‘ശപഥം കൂടാതെ’ എന്നതിനോടു സമാനമായ, കൂടുതൽ ചുരുക്കമുള്ള മലയാള പരിഭാഷ.
lexical_decisions:
- source_word: Καὶ
  choice: മാത്രമല്ല
  rationale: മുൻവാദത്തോടു ബന്ധിപ്പിക്കുകയും തുടർന്നുള്ള താരതമ്യത്തിലെ മറ്റൊരു ഘടകം അവതരിപ്പിക്കുകയും ചെയ്യുന്ന ബന്ധകമായി സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
- source_word: καθ’ ὅσον
  choice: എന്നതുകൊണ്ടും
  rationale: തുടർന്നുള്ള നിഗമനത്തിന്റെ അടിസ്ഥാനമോ അളവോ സൂചിപ്പിക്കുന്ന പ്രയോഗം. വാക്യം അടുത്ത വാക്യത്തിലേക്കു നീളുന്നതിനാൽ കാരണാത്മകവും താരതമ്യാത്മകവുമായ ബന്ധം തുറന്നുവെക്കുന്നു.
- source_word: οὐ χωρὶς ὁρκωμοσίας
  choice: ശപഥം കൂടാതെയായിരുന്നില്ല
  rationale: χωρίς എന്നതിന്റെ ‘കൂടാതെ/വേറിട്ട്’ എന്ന അർഥവും ഊന്നലുള്ള നിഷേധവും നിലനിർത്തുന്നു.
- source_word: ὁρκωμοσίας
  choice: ശപഥം
  rationale: ശപഥമെടുക്കൽ അഥവാ ശപഥത്താൽ ഉറപ്പിക്കൽ എന്ന ആശയം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ സംക്ഷിപ്ത പദത്തിൽ നൽകുന്നു.
- source_word: οἱ μὲν γὰρ
  choice: അവർ
  rationale: γάρ നൽകുന്ന വിശദീകരണം പരാന്തസിസിലൂടെ വ്യക്തമാകുന്നു; μέν ആരംഭിക്കുന്ന താരതമ്യം അടുത്ത വാക്യത്തിൽ പൂർത്തിയാകുന്നതിനാൽ മലയാളത്തിൽ അധികമായി നിർവചിച്ചിട്ടില്ല.
- source_word: χωρὶς ὁρκωμοσίας
  choice: ശപഥം കൂടാതെ
  rationale: ആവർത്തിച്ചിരിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം ആദ്യ ഭാഗത്തോടു പദസാമ്യം പുലർത്തി വിവർത്തനം ചെയ്തു.
- source_word: εἰσὶν ἱερεῖς γεγονότες
  choice: പുരോഹിതന്മാരായിത്തീർന്നത്
  rationale: പൂർത്തിയായ ഒരു സംഭവത്തിൽനിന്നുണ്ടായ നിലയെ സൂചിപ്പിക്കുന്ന പരിഭാഷ; അവർ പുരോഹിതപദവിയിൽ പ്രവേശിച്ചതെന്ന ആശയം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ശപഥമില്ലാതെ പുരോഹിതന്മാരായവരും ശപഥത്താൽ സ്ഥാപിക്കപ്പെട്ട പുരോഹിതനും തമ്മിലുള്ള താരതമ്യത്തിന്റെ സൂചന
  choice: ‘അവർ’ എന്ന സർവനാമം നിലനിർത്തി, ശപഥമില്ലാതെ പുരോഹിതന്മാരായവരെ മാത്രം ഈ വാക്യത്തിൽ പരാമർശിച്ചു.
  alternative: ‘ലേവ്യപുരോഹിതന്മാർ’ എന്നു വ്യക്തമായി ചേർക്കുക.
  rationale: സന്ദർഭം ലേവ്യപുരോഹിതരെയും യേശുവിന്റെ പുരോഹിതത്വത്തെയും താരതമ്യം ചെയ്യുന്നുവെങ്കിലും, ഈ വാക്യത്തിലെ ഗ്രീക്ക് പാഠം ‘അവർ’ എന്നു മാത്രമാണ് പറയുന്നത്. അതിനാൽ വ്യാഖ്യാനപരമായ പേര് മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണമായ മലയാളം. ഗ്രീക്ക് വാക്യഘടന 7:21-ൽ മാത്രമേ പൂർത്തിയാകുന്നുള്ളൂ എന്നതിനാൽ ദീർഘവിരാമവും തുറന്ന പരാന്തസിസും നിലനിർത്തി; അനാവശ്യമായി പൂർണ്ണവാക്യമാക്കി അർഥബന്ധം മാറ്റിയിട്ടില്ല.
