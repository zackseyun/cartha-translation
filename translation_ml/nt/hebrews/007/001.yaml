id: HEB.7.1
reference: Hebrews 7:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οὗτος γὰρ ὁ Μελχισέδεκ, βασιλεὺς Σαλήμ, ἱερεὺς τοῦ θεοῦ τοῦ ὑψίστου, ⸀ὁ συναντήσας Ἀβραὰμ ὑποστρέφοντι ἀπὸ τῆς κοπῆς τῶν βασιλέων καὶ εὐλογήσας αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/001.yaml
  text: For this Melchizedek[a], king of Salem, priest of God Most High, met Abraham as he was returning from the slaughter of the kings and blessed him[b],
translation:
  language: ml
  text: കാരണം, ഈ മെൽക്കീസേദെക്ക് ശാലേമിന്റെ രാജാവും അത്യുന്നത ദൈവത്തിന്റെ പുരോഹിതനും ആയിരുന്നു. രാജാക്കന്മാരെ സംഹരിച്ചതിനുശേഷം മടങ്ങിവരുകയായിരുന്ന അബ്രാഹാമിനെ അദ്ദേഹം കണ്ടുമുട്ടി അനുഗ്രഹിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “രാജാക്കന്മാരെ തോൽപ്പിച്ചതിനുശേഷം.” ഗ്രീക്കിൽ കൂടുതൽ അക്ഷരാർഥമായി, “രാജാക്കന്മാരുടെ സംഹാരത്തിൽനിന്ന്” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτος γὰρ ὁ Μελχισέδεκ
  choice: കാരണം ... ഈ മെൽക്കീസേദെക്ക്
  rationale: γάρ മുൻവാദവുമായി വിശദീകരണബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ ‘കാരണം’ എന്നു നൽകി; οὗτος എന്ന നിർദേശകത്തിന്റെ ഊന്നൽ ‘ഈ’ നിലനിർത്തുന്നു. പേര് മലയാളത്തിലെ പരിചിതമായ ബൈബിൾ ലിപ്യന്തരണത്തിൽ നൽകി.
- source_word: βασιλεὺς Σαλήμ
  choice: ശാലേംരാജാവ്
  rationale: രാജപദവിയും സ്ഥലനാമവും സ്വാഭാവികമായ മലയാള സംയുക്തരൂപത്തിൽ നൽകി; ഉല്പത്തി 14-ുമായുള്ള ബന്ധം തിരിച്ചറിയാവുന്ന വിധത്തിൽ Σαλήμ ‘ശാലേം’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: ἱερεὺς τοῦ θεοῦ τοῦ ὑψίστου
  choice: അത്യുന്നതനായ ദൈവത്തിന്റെ പുരോഹിതൻ
  rationale: τοῦ ὑψίστου ദൈവത്തെ വിശേഷിപ്പിക്കുന്ന ദിവ്യപദവിയായി നിലനിർത്തി; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ രൂപം.
- source_word: ὁ συναντήσας Ἀβραὰμ
  choice: അബ്രാഹാമിനെ ചെന്നുകണ്ട്
  rationale: συναντάωയുടെ കൂടിക്കാഴ്ച എന്ന അർഥം ‘ചെന്നുകണ്ട്’ സ്വാഭാവികമായി അറിയിക്കുന്നു; കർത്താവ് മെൽക്കീസേദെക്കാണെന്ന ബന്ധം വ്യക്തമാണ്.
- source_word: ὑποστρέφοντι
  choice: മടങ്ങിവരുകയായിരുന്ന
  rationale: വർത്തമാന കൃദന്തരൂപം കൂടിക്കാഴ്ചയോടു സമകാലികമായി തുടരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു.
- source_word: ἀπὸ τῆς κοπῆς τῶν βασιλέων
  choice: രാജാക്കന്മാരെ സംഹരിച്ചശേഷം
  rationale: κοπήയുടെ അക്ഷരാർഥമായ വെട്ടിവീഴ്ത്തൽ/സംഹാരം സൈനികസന്ദർഭത്തിൽ നിലനിർത്തുന്നു; ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ക്രിയാരൂപം ഉപയോഗിച്ചു. ‘തോൽപ്പിച്ചശേഷം’ എന്ന വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
- source_word: καὶ εὐλογήσας αὐτόν
  choice: അനുഗ്രഹിച്ചു
  rationale: സυναντήσας എന്ന കൃദന്തരൂപത്തോടു ചേർന്ന രണ്ടാമത്തെ പ്രവൃത്തി മലയാളത്തിൽ പ്രധാന ക്രിയയായി സ്വാഭാവികമായി അവതരിപ്പിച്ചു; αὐτόν അബ്രാഹാമിനെയാണ് സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: τοῦ θεοῦ τοῦ ὑψίστου എന്ന ദിവ്യപദവിയുടെ വിവർത്തനം
  choice: അത്യുന്നതനായ ദൈവത്തിന്റെ പുരോഹിതൻ
  alternative: അത്യുന്നത ദൈവത്തിന്റെ പുരോഹിതൻ
  rationale: ഇത് സിദ്ധാന്തപരമായ നിർണ്ണയമല്ല, ഭാഷാശൈലിയിലെ തിരഞ്ഞെടുപ്പാണ്. ‘അത്യുന്നതനായ’ എന്നത് ὕψιστος ദൈവത്തെ വിശേഷിപ്പിക്കുന്നതായി വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- issue: κοπή എന്ന പദത്തിലെ യുദ്ധഹിംസയുടെ തീവ്രത
  choice: സംഹരിച്ചശേഷം
  alternative: തോൽപ്പിച്ചശേഷം
  rationale: മൂലപദം വെട്ടിവീഴ്ത്തൽ/സംഹാരം എന്ന ശക്തമായ അർഥം വഹിക്കുന്നതിനാൽ മുഖ്യപാഠത്തിൽ അത് നിലനിർത്തി; എന്നാൽ ഉല്പത്തി 14-ലെ സംഭവത്തെ പൊതുവായി ‘തോൽപ്പിക്കൽ’ എന്നു ഗ്രഹിക്കാവുന്നതിനാൽ ആ വായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവവും സാധാരണ വായനാസൗകര്യവും പുലർത്തുന്ന മലയാളം. വാക്യം അടുത്ത വാക്യത്തിലേക്കു വ്യാകരണപരമായി തുടരുന്ന ഗ്രീക്ക് ഘടനയാണെങ്കിലും, നൽകിയ ഏകവാക്യഘടകത്തിന് മലയാളത്തിൽ സമ്പൂർണത ലഭിക്കുന്ന വിധത്തിൽ ക്രമപ്പെടുത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
