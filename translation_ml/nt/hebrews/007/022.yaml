id: HEB.7.22
reference: Hebrews 7:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: κατὰ ⸀τοσοῦτο ⸀κρείττονος διαθήκης γέγονεν ἔγγυος Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/022.yaml
  text: By so much[a], Jesus has become the guarantor of a better covenant.
translation:
  language: ml
  text: അതത്രത്തോളം മെച്ചപ്പെട്ട ഒരു ഉടമ്പടിയുടെ[a] ഉറപ്പുകാരനായിത്തീർന്നിരിക്കുന്നു യേശു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വിൽപ്പത്രം.’ ഗ്രീക്ക് പദത്തിന് ‘ഉടമ്പടി’ എന്നും ചില സന്ദർഭങ്ങളിൽ ‘വിൽപ്പത്രം’ എന്നും അർഥമാകാം; ഇവിടെ പൗരോഹിത്യത്തെയും ശപഥത്തെയും കുറിച്ചുള്ള വാദത്തിന് ‘ഉടമ്പടി’യാണ് ഏറ്റവും യോജിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: κατὰ τοσοῦτο
  choice: അത്രത്തോളം
  rationale: κατά + അളവിനെ സൂചിപ്പിക്കുന്ന accusative ഇവിടെ താരതമ്യത്തിന്റെ വ്യാപ്തി വ്യക്തമാക്കുന്നു. മുൻവാദവുമായി ബന്ധിപ്പിക്കുന്ന ‘by so much/to that extent’ എന്ന ആശയം ‘അത്രത്തോളം’ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: κρείττονος
  choice: മെച്ചപ്പെട്ട
  rationale: എബ്രായലേഖനത്തിലെ ആവർത്തിച്ചുവരുന്ന താരതമ്യപദത്തിന്റെ ലളിതവും വ്യക്തവുമായ മലയാളരൂപമാണിത്.
- source_word: διαθήκης
  choice: ഉടമ്പടിയുടെ
  rationale: പദത്തിന് ‘ഉടമ്പടി’ എന്നും ചില സന്ദർഭങ്ങളിൽ ‘വിൽപ്പത്രം’ എന്നും അർഥമാകാം. ഇവിടെ പൗരോഹിത്യത്തെയും ശപഥത്തെയും കുറിച്ചുള്ള വാദസന്ദർഭത്തിൽ ‘ഉടമ്പടി’ യോജിക്കുന്നു.
- source_word: γέγονεν
  choice: ആയിത്തീർന്നിരിക്കുന്നു
  rationale: Perfect രൂപം പൂർത്തിയായ സംഭവത്തിന്റെയും ഇപ്പോഴും തുടരുന്ന ഫലത്തിന്റെയും ഭാവം നൽകുന്നു; ‘ആയിത്തീർന്നിരിക്കുന്നു’ അത് സംരക്ഷിക്കുന്നു.
- source_word: ἔγγυος
  choice: ഉറപ്പുകാരൻ
  rationale: ഒരു ബാധ്യതയുടെ ഉറപ്പ് ഏറ്റെടുക്കുന്ന വ്യക്തിയെയാണ് പദം സൂചിപ്പിക്കുന്നത്. ‘ഉറപ്പുകാരൻ’ ആ വ്യക്തിപരമായ പങ്ക് വ്യക്തവും ആധുനികവുമായ ഭാഷയിൽ അറിയിക്കുന്നു.
- source_word: Ἰησοῦς
  choice: യേശു
  rationale: പേരിന്റെ മലയാളത്തിൽ സ്ഥിരപ്രചാരമുള്ള രൂപം.
theological_decisions:
- issue: എബ്രായർ 7:22-ലെ διαθήκη എന്ന പദത്തിന്റെ അർഥം
  choice: ഉടമ്പടി
  alternative: വിൽപ്പത്രം
  rationale: διαθήκη എന്ന പദത്തിന്റെ അർഥവ്യാപ്തിയിൽ വിൽപ്പത്രം ഉൾപ്പെടാമെങ്കിലും, യേശുവിന്റെ പൗരോഹിത്യത്തെയും ദൈവത്തിന്റെ ശപഥത്തെയും കുറിച്ചുള്ള ഈ സന്ദർഭം ഉടമ്പടിയെയാണ് മുൻനിർത്തുന്നത്. മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലത്തിലെ താരതമ്യബലവും യേശു വാക്യാവസാനത്തിൽ വരുന്ന ഊന്നലും കഴിയുന്നത്ര നിലനിർത്തിയിരിക്കുന്നു; മുൻവാക്യത്തെ ആശ്രയിക്കുന്ന മൂലത്തിലെ സംക്ഷിപ്തത പരിഹരിച്ച് വികസിപ്പിച്ചിട്ടില്ല.
