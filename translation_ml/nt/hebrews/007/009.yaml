  text: καὶ ὡς ἔπος εἰπεῖν, δι’ Ἀβραὰμ καὶ Λευὶ ὁ δεκάτας λαμβάνων δεδεκάτωται,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/009.yaml
  text: And[a], so to speak, through Abraham even Levi, who receives tithes, has paid tithes[b],
translation:
  language: ml
  text: പറയാമെങ്കിൽ[a], ദശാംശങ്ങൾ സ്വീകരിക്കുന്ന ലേവിപോലും അബ്രാഹാമിലൂടെ ദശാംശം കൊടുത്തിരിക്കുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഒരുവിധത്തിൽ പറഞ്ഞാൽ” / “എന്നു പറഞ്ഞാൽ.”
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ ക്രിയ കർമണിരൂപത്തിലാണ് (“ദശാംശം നൽകിയവനായിരിക്കുന്നു” എന്ന ആശയം). അബ്രാഹാമിലൂടെ ലേവി ദശാംശം കൊടുത്തവനായി കണക്കാക്കപ്പെടുന്നു എന്നാണ് ഇതു സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἔπος εἰπεῖν
  choice: അങ്ങനെ പറയാമെങ്കിൽ
  rationale: ഒരു കാര്യത്തെ യോഗ്യതയോടെയോ ആലങ്കാരികമായോ അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് ശൈലിയുടെ മൃദൂകരണഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δι’ Ἀβραὰμ
  choice: അബ്രാഹാമിലൂടെ
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന മധ്യസ്ഥത ഇവിടെ സംരക്ഷിക്കുന്നു; അബ്രാഹാമിന്റെ പ്രവൃത്തിയിൽ ലേവി പ്രതിനിധീകരിക്കപ്പെടുന്നു എന്ന വാദം അനാവശ്യമായി വിശദീകരിക്കുന്നില്ല.
- source_word: καὶ Λευὶ
  choice: ലേവിപോലും
  rationale: καίയുടെ ആശ്ചര്യജനകമായ ഊന്നൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: ὁ δεκάτας λαμβάνων
  choice: ദശാംശങ്ങൾ സ്വീകരിക്കുന്ന
  rationale: ലേവിയുടെ പുരോഹിതപരമായ പതിവുചുമതലയെ സൂചിപ്പിക്കുന്ന substantival present participle-ന്റെ സ്വഭാവം നിലനിർത്തുന്നു.
- source_word: δεκάτας
  choice: ദശാംശങ്ങൾ
  rationale: ആരാധനാപരവും സാമ്പത്തികവുമായ പശ്ചാത്തലത്തിൽ നൽകുന്ന പത്തിലൊന്നിനുള്ള നിലവാരമുള്ള മലയാളപദം.
- source_word: δεδεκάτωται
  choice: ദശാംശം കൊടുത്തിരിക്കുന്നു
  rationale: ഗ്രീക്കിലെ perfect passive അത്യന്തം ചുരുക്കിയ ഘടനയിൽ വന്നിട്ടുണ്ടെങ്കിലും സന്ദർഭാർഥം ലേവി അബ്രാഹാമിലൂടെ ദശാംശം നൽകിയവനായി കണക്കാക്കപ്പെടുന്നു എന്നതാണ്; മലയാളത്തിൽ കൃത്രിമമായ passive രൂപം ഒഴിവാക്കി, പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ വാദപ്രസക്തി പ്രകടമാക്കുന്നു. അടിക്കുറിപ്പ് മൂലരൂപം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: അബ്രാഹാമിന്റെ പ്രവൃത്തിയിൽ ലേവിയുടെ പ്രതിനിധിപരമായ പങ്കാളിത്തം
  choice: ലേവി അബ്രാഹാമിലൂടെ ദശാംശം കൊടുത്തതായി വാക്യം പറയുന്നു; ബന്ധത്തിന്റെ കൃത്യമായ ദാർശനിക സംവിധാനം നിർവചിക്കുന്നില്ല.
  alternative: ലേവി തന്റെ പൂർവികനായ അബ്രാഹാമിൽ സമൂഹപരമായി ഉൾപ്പെട്ടിരുന്നു എന്നോ ഇത് കേവലം ആലങ്കാരിക പ്രസ്താവനയാണെന്നോ വ്യക്തമാക്കുക.
  rationale: “അങ്ങനെ പറയാമെങ്കിൽ” എന്നും “അബ്രാഹാമിലൂടെ” എന്നും ഉള്ള പ്രയോഗങ്ങൾ വാക്യത്തിലെ യോഗ്യതയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും സംരക്ഷിക്കുന്നു; കർശനമായ അക്ഷരാർഥത്തിലേക്കോ വെറും ഉപമയിലേക്കോ ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. “ദശാംശം” എന്ന പരിചിതമായ ബൈബിൾ-ആരാധനാപദം നിലനിർത്തി; ഗ്രീക്കിലെ അസ്വാഭാവികമായ കർമണിചുരുക്കം മുഖ്യവാചകത്തിൽ അർഥസുതാര്യമായി നൽകി അടിക്കുറിപ്പിൽ രൂപപരമായ വിവരം രേഖപ്പെടുത്തി.
