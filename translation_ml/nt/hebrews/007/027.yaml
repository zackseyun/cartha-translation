source:
  edition: SBLGNT
  text: ὃς οὐκ ἔχει καθ’ ἡμέραν ἀνάγκην, ὥσπερ οἱ ἀρχιερεῖς, πρότερον ὑπὲρ τῶν ἰδίων ἁμαρτιῶν θυσίας ἀναφέρειν, ἔπειτα τῶν τοῦ λαοῦ (τοῦτο γὰρ ἐποίησεν ἐφάπαξ ἑαυτὸν ἀνενέγκας)·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/027.yaml
  text: who has no need[a], day after day, like the high priests, to offer up sacrifices first for his own sins and then for those of the people[d][c][b], for this he did once for all when he offered up himself.
translation:
  language: ml
  text: മഹാപുരോഹിതന്മാരെപ്പോലെ, ആദ്യം സ്വന്തം പാപങ്ങൾക്കുവേണ്ടിയും പിന്നെ ജനത്തിന്റെ പാപങ്ങൾക്കുവേണ്ടിയും അനുദിനം[a] യാഗങ്ങൾ അർപ്പിക്കേണ്ട ആവശ്യം അവനില്ല. അവൻ തന്നെത്തന്നെ അർപ്പിച്ചപ്പോൾ ഇത് ഒരിക്കലായിട്ടു[b] ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദിവസംതോറും.” ഗ്രീക്ക് പ്രയോഗം ആവർത്തിച്ചുള്ള ദൈനംദിനതയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ഒരിക്കലായി” അല്ലെങ്കിൽ “ഒരിക്കലും ആവർത്തിക്കപ്പെടാത്തവിധം.” ഇവിടെ ഉദ്ദേശിക്കുന്നത് ആവർത്തിക്കേണ്ടതില്ലാത്ത ഒറ്റത്തവണത്തെ പ്രവൃത്തിയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: അനുദിനം
  rationale: ആവർത്തിച്ചുള്ള ദൈനംദിന ആവശ്യകതയെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀνάγκην
  choice: ആവശ്യം
  rationale: ἔχει ἀνάγκην എന്ന പ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാള തുല്യപദം; നിർബന്ധം എന്നതിനെക്കാൾ ഇവിടെ സന്ദർഭോചിതം.
- source_word: ὥσπερ οἱ ἀρχιερεῖς
  choice: മഹാപുരോഹിതന്മാരെപ്പോലെ
  rationale: ലേവ്യ മഹാപുരോഹിതന്മാരുമായുള്ള താരതമ്യവും ഗ്രീക്കിലെ ബഹുവചനവും നിലനിർത്തുന്നു.
- source_word: πρότερον ... ἔπειτα
  choice: ആദ്യം ... പിന്നെ
  rationale: യാഗാർപ്പണക്രമത്തിലെ അനുക്രമം വ്യക്തമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: ὑπὲρ τῶν ἰδίων ἁμαρτιῶν
  choice: സ്വന്തം പാപങ്ങൾക്കുവേണ്ടി
  rationale: യാഗസന്ദർഭത്തിലെ ὑπέρ എന്നതിന്റെ പ്രതിനിധിപരമായ അർഥം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: θυσίας ἀναφέρειν
  choice: യാഗങ്ങൾ അർപ്പിക്കുക
  rationale: ആരാധനാപരമായ സന്ദർഭത്തിൽ ἀναφέρω എന്നതിന്റെ യാഗാർപ്പണ അർഥം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: τῶν τοῦ λαοῦ
  choice: ജനത്തിന്റെ പാപങ്ങൾക്കുവേണ്ടി
  rationale: ഗ്രീക്കിൽ മുൻപത്തെ ἁμαρτιῶν എന്ന പദം അധ്യാഹരിച്ചിരിക്കുന്നതിനാൽ, മലയാളത്തിൽ അർഥവ്യക്തതയ്ക്കായി ‘പാപങ്ങൾ’ ആവർത്തിക്കുന്നു.
- source_word: τοῦτο γὰρ ἐποίησεν
  choice: ഇത് ... ചെയ്തു
  rationale: τοῦτο എന്ന പിന്നോട്ടുള്ള സൂചന നിലനിർത്തുകയും മുൻപു പറഞ്ഞ യാഗക്രിയയിലേക്കു വായനക്കാരനെ നയിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐφάπαξ
  choice: ഒരിക്കലായി
  rationale: ഒറ്റത്തവണ നടന്നതും ആവർത്തിക്കേണ്ടതില്ലാത്തതുമായ നിർണായക സ്വഭാവം സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἑαυτὸν ἀνενέγκας
  choice: അവൻ തന്നെത്തന്നെ അർപ്പിച്ചപ്പോൾ
  rationale: അവന്റെ സ്വയംയാഗത്തിന്റെ ബലിപരമായ അർഥം നിലനിർത്തിക്കൊണ്ട് aorist participle-നെ സ്വാഭാവികമായ കാലവാക്യമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: τοῦτο (‘ഇത്’) എന്നതിന്റെ വ്യാപ്തി
  choice: ‘ഇത്’ മുൻപു പറഞ്ഞ നിർണായക യാഗക്രിയയെ സൂചിപ്പിക്കുന്ന വിധത്തിൽ നിലനിർത്തുന്നു; ക്രിസ്തു സ്വന്തം പാപങ്ങൾക്കായി യാഗം അർപ്പിച്ചു എന്നു വിവർത്തനം സൂചിപ്പിക്കുന്നില്ല.
  alternative: ‘ഇത്’ ജനത്തിന്റെ പാപങ്ങൾക്കുവേണ്ടിയുള്ള അർപ്പണത്തെ മാത്രം സൂചിപ്പിക്കുന്നതായി വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്ക് വാക്യത്തിന്റെ പിന്നോട്ടുള്ള സൂചനയിലെ പരിധി പൂർണമായി നിർവചിക്കാതെ നിലനിർത്തുന്നു; അതേസമയം ‘അവൻ തന്നെത്തന്നെ അർപ്പിച്ചപ്പോൾ’ എന്ന വാക്യം മഹാപുരോഹിതന്മാരിൽനിന്നുള്ള വ്യത്യാസം വ്യക്തമാക്കുന്നു.
- issue: ക്രിസ്തുവിന്റെ സ്വയംയാഗം
  choice: ‘അവൻ തന്നെത്തന്നെ അർപ്പിച്ചപ്പോൾ’
  alternative: ‘അവൻ തന്നെത്തന്നെ നൽകിക്കൊണ്ട്’
  rationale: എബ്രായലേഖനത്തിലെ പുരോഹിത-യാഗ ഭാഷയുടെ ശക്തി മങ്ങിപ്പോകാതിരിക്കാൻ ‘അർപ്പിക്കുക’ ഉപയോഗിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. ‘മഹാപുരോഹിതൻ,’ ‘യാഗം അർപ്പിക്കുക’ എന്നീ സ്ഥാപിത ബൈബിൾ പദങ്ങൾ ആരാധനാപരമായ ഭാവം നിലനിർത്താൻ ഉപയോഗിച്ചു; ഗ്രീക്കിലെ ദീർഘവാക്യം മലയാളത്തിലെ വ്യക്തതയ്ക്കായി രണ്ട് വാക്യങ്ങളാക്കി.
