    issue: Footnote b gives a semantically incorrect alternative for ἐφάπαξ.
    rationale: “ഒരിക്കലും എന്നേക്കുമായി” in normal Malayalam denotes ‘never, forever,’ not ‘once and for all.’ It reverses the intended sense and must be replaced.
  - severity: low
    issue: “ഒരിക്കലായി” is less natural in this verbal construction.
    rationale: “ഒരിക്കലായിട്ടു” is idiomatic modern Malayalam for an act performed once, and the note can explain the definitive, nonrepeated force.
