  yaml_path: translation/nt/hebrews/007/021.yaml
  text: but this one became a priest with an oath through the one who said to him[a], “The Lord has sworn and will not change his mind, ‘You are a priest forever.’”
translation:
  language: ml
  text: 'എന്നാൽ ഇദ്ദേഹമാകട്ടെ, തന്നോട് ഇങ്ങനെ പറഞ്ഞവനിലൂടെ ശപഥത്തോടെയാണ് പുരോഹിതനായത്: “കർത്താവ് ശപഥം ചെയ്തിരിക്കുന്നു[a]; അവിടുന്ന് മനസ്സു മാറ്റുകയുമില്ല: നീ എന്നേക്കും ഒരു പുരോഹിതനാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ കൂടുതൽ രൂപാനുസൃതമായി: “കർത്താവ് ശപഥം ചെയ്തു.” ഗ്രീക്കിലെ aorist രൂപമായ Ὤμοσεν എന്നത് “ശപഥം ചെയ്തു” എന്നോ “ശപഥം ചെയ്തിരിക്കുന്നു” എന്നോ പരിഭാഷപ്പെടുത്താം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: എന്നാൽ ഇദ്ദേഹമാകട്ടെ
  rationale: മുൻവാക്യത്തിലെ പുരോഹിതന്മാരിൽനിന്ന് ഈ പുരോഹിതനെ വേർതിരിച്ചുകാട്ടുന്ന ഗ്രീക്കിലെ വിരുദ്ധതയും ഊന്നലും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: μετὰ ὁρκωμοσίας
  choice: ശപഥത്തോടെയാണ്
  rationale: ശപഥം കൂടെയുണ്ടായിരുന്ന സാഹചര്യവും അതിലൂടെ ഉണ്ടായ നിയമനവും സൂചിപ്പിക്കുന്നു; മുൻവാക്യത്തിലെ ‘ശപഥം കൂടാതെ’ എന്ന ആശയത്തോടുള്ള വ്യത്യാസവും വ്യക്തമാക്കുന്നു.
- source_word: διὰ τοῦ λέγοντος πρὸς αὐτόν
  choice: തന്നോട് ഇങ്ങനെ പറഞ്ഞവൻ മുഖാന്തരം
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന കർത്തൃത്വം/മാധ്യമത്വം സംരക്ഷിക്കുകയും ദൈവം ഉദ്ധരണിയുടെ പ്രഭാഷകനാണെന്ന രൂപം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: Ὤμοσεν κύριος
  choice: കർത്താവ് ശപഥം ചെയ്തിരിക്കുന്നു
  rationale: സങ്കീർത്തനം 110:4-ലെ പ്രഖ്യാപനത്തിന്റെ നിലനിൽക്കുന്ന പ്രാബല്യം മലയാളത്തിലെ പൂർത്തകാലപ്രയോഗത്തിലൂടെ വ്യക്തമാക്കുന്നു; ഗ്രീക്ക് aorist ലളിതഭൂതകാലമായും പരിഭാഷപ്പെടുത്താവുന്നതാണ്.
- source_word: κύριος
  choice: കർത്താവ്
  rationale: ഗ്രീക്ക് κύριος എന്ന പദത്തിന്റെ പതിവും സന്ദർഭോചിതവുമായ മലയാളരൂപം.
- source_word: οὐ μεταμεληθήσεται
  choice: അവിടുന്ന് മനസ്സു മാറ്റുകയുമില്ല
  rationale: ധാർമിക പശ്ചാത്താപമല്ല, പ്രഖ്യാപിച്ച തീരുമാനത്തിൽനിന്ന് പിന്മാറാതിരിക്കലാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്; ആദരസൂചക സർവനാമം മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: Σὺ ἱερεὺς
  choice: നീ ഒരു പുരോഹിതനാണ്
  rationale: ഗ്രീക്കിൽ പ്രകടമല്ലാത്ത copula മലയാളത്തിലെ സ്വാഭാവിക വാക്യഘടനയ്ക്കായി ചേർക്കുന്നു; അഭിസംബോധിതന്റെ പുരോഹിതപദവി വ്യക്തമായി പറയുന്നു.
- source_word: εἰς τὸν αἰῶνα
  choice: എന്നേക്കും
  rationale: ഈ ഗ്രീക്ക് കാലപ്രയോഗത്തിന്റെ നിരന്തരവും അവസാനമില്ലാത്തതുമായ അർഥം സാധാരണ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: സങ്കീർത്തനം 110:4-ലെ ശപഥവും പുരോഹിതപദവിയുടെ സ്ഥിരതയും
  choice: ഈ പുരോഹിതൻ ദൈവത്തിന്റെ ശപഥത്തോടെയാണ് നിയമിക്കപ്പെട്ടതെന്നും അവന്റെ പുരോഹിതപദവി എന്നേക്കുമുള്ളതാണെന്നും പ്രകടമാക്കുന്നു.
  alternative: Ὤμοσεν എന്ന aorist രൂപം ‘കർത്താവ് ശപഥം ചെയ്തു’ എന്ന് ലളിതഭൂതകാലത്തിൽ നൽകാം.
  rationale: എബ്രായലേഖനത്തിന്റെ സന്ദർഭം ശപഥമില്ലാതെ നിയമിക്കപ്പെട്ട മുൻപുരോഹിതന്മാരെയും ദൈവശപഥത്താൽ സ്ഥാപിക്കപ്പെട്ട സ്ഥിരമായ പുരോഹിതപദവിയെയും തമ്മിൽ വേർതിരിക്കുന്നു. പാഠത്തിനപ്പുറമുള്ള പിൽക്കാല സിദ്ധാന്തരൂപങ്ങൾ ചേർക്കാതെ ഈ വ്യത്യാസം സംരക്ഷിച്ചിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. ‘ഇദ്ദേഹമാകട്ടെ’ എന്നത് ഗ്രീക്കിലെ വിരുദ്ധത നിലനിർത്തുന്നു; ദൈവത്തെ സൂചിപ്പിക്കുന്നിടത്ത് ‘അവിടുന്ന്’ എന്ന ആദരസൂചക രൂപം ഉപയോഗിച്ചു. ഉദ്ധരണിക്കുള്ളിലെ ഉദ്ധരണി വ്യക്തമായി അടയാളപ്പെടുത്തി.
