source:
  edition: SBLGNT
  text: Καὶ περισσότερον ἔτι κατάδηλόν ἐστιν, εἰ κατὰ τὴν ὁμοιότητα Μελχισέδεκ ἀνίσταται ἱερεὺς ἕτερος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/015.yaml
  text: And it is even more evident[a], if another priest arises according to the likeness of Melchizedek[b],
translation:
  language: ml
  text: മെൽക്കീസേദെക്കിന്റെ സാദൃശ്യപ്രകാരം[b] വേറൊരു[a] പുരോഹിതൻ എഴുന്നേൽക്കുന്നുവെങ്കിൽ, ഇത് ഇനിയും കൂടുതൽ വ്യക്തമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വേറൊരു” എന്നതിന് “വ്യത്യസ്തനായ ഒരു” എന്നും അർത്ഥമാകാം; ഇവിടെ മെൽക്കീസേദെക്കിന്റെ ക്രമത്തോടുള്ള താരതമ്യം ആ വ്യത്യസ്തതയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “മെൽക്കീസേദെക്കിന്റെ സാദൃശ്യപ്രകാരം” എന്ന പ്രയോഗം ഈ അധ്യായത്തിൽ സങ്കീർത്തനം 110:4-ൽനിന്ന് എടുത്ത വാക്കുകളെയും വാദത്തെയും പ്രതിധ്വനിപ്പിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: περισσότερον ἔτι
  choice: ഇനിയും അധികം
  rationale: മുൻപുള്ള വാദത്തെ കൂടുതൽ ശക്തമാക്കുന്ന താരതമ്യപ്രയോഗത്തിന്റെ തീവ്രത സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: κατάδηλόν
  choice: വ്യക്തമാണ്
  rationale: ‘പ്രകടം, വ്യക്തം’ എന്ന അർത്ഥം ലളിതവും മാന്യവുമായ ഭാഷയിൽ നൽകുന്നു; തീവ്രത ഇതിനുമുമ്പുള്ള ‘ഇനിയും അധികം’ എന്നതിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: εἰ
  choice: എങ്കിൽ
  rationale: സന്ദർഭത്തിൽ കാരണസൂചന ഉണ്ടായേക്കാമെങ്കിലും, ഗ്രീക്കിലെ വ്യവസ്ഥാസ്വഭാവം പരിഹരിക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: κατὰ τὴν ὁμοιότητα
  choice: സാദൃശ്യപ്രകാരം
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ആശയവും ഈ അധ്യായത്തിലെ സങ്കീർത്തനം 110:4-നെ ആധാരമാക്കിയ വാദവുമായുള്ള ബന്ധവും കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: Μελχισέδεκ
  choice: മെൽക്കീസേദെക്ക്
  rationale: മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം ഉപയോഗിക്കുന്നു.
- source_word: ἀνίσταται
  choice: എഴുന്നേൽക്കുന്നു
  rationale: ഒരു പുരോഹിതൻ രംഗത്തുവരുന്നതോ ഉദയം ചെയ്യുന്നതോ ആയ മൂലരൂപകം നിലനിർത്തുന്നു; പുനരുത്ഥാനാർത്ഥം നിർബന്ധമായി ചുമത്തുന്നില്ല.
- source_word: ἱερεὺς ἕτερος
  choice: വേറൊരു പുരോഹിതൻ
  rationale: സംഖ്യയിൽ മറ്റൊരാൾ എന്നതോടൊപ്പം വ്യത്യസ്തതയുടെ സാധ്യതയും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്ന മലയാളപ്രയോഗമാണ്.
theological_decisions:
- issue: പുരോഹിതത്വവുമായി ബന്ധപ്പെട്ട ἕτερος എന്ന പദത്തിന്റെ സൂക്ഷ്മത
  choice: വേറൊരു പുരോഹിതൻ
  alternative: വ്യത്യസ്തനായ ഒരു പുരോഹിതൻ
  rationale: ലേവ്യപുരോഹിതക്രമത്തിൽനിന്നു വേറിട്ടു മെൽക്കീസേദെക്കിനോടു സാദൃശ്യമുള്ള പുരോഹിതനെയാണ് വാദം സൂചിപ്പിക്കുന്നത്. എന്നാൽ പ്രധാനപാഠത്തിൽ ‘വ്യത്യസ്തനായ’ എന്നു ശക്തമായി നിർവചിക്കാതെ പദത്തിന്റെ അർത്ഥവ്യാപ്തി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ വാക്യഘടന. ഗ്രീക്കിലെ വ്യവസ്ഥാവാക്യം ആദ്യം കൊണ്ടുവന്നത് മലയാളത്തിലെ വ്യക്തതയ്ക്കായി; ആശയക്രമം മാറ്റിയിട്ടില്ല. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
