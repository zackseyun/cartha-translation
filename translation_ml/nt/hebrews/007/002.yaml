revisions:
- from: അവന് അബ്രാഹാം സകലത്തിന്റെയും പത്തിലൊന്ന്[a] വീതിച്ചുകൊടുത്തു. ആദ്യം, അവന്റെ പേര് പരിഭാഷപ്പെടുത്തിയാൽ “നീതിയുടെ രാജാവ്”[b] എന്നാണ്; പിന്നെ അവൻ ശാലേമിന്റെ രാജാവും ആകുന്നു—അതായത്, “സമാധാനത്തിന്റെ രാജാവ്.”
  to: അബ്രാഹാം അവന് എല്ലാറ്റിൽനിന്നും പത്തിലൊന്ന്[a] വേർതിരിച്ചു നൽകി. ആദ്യം, അവന്റെ പേരിന്റെ അർഥം “നീതിയുടെ രാജാവ്”[b] എന്നാണ്; പിന്നെ, ശാലേമിന്റെ രാജാവ്, അതായത് “സമാധാനത്തിന്റെ രാജാവ്.”
