source:
  edition: SBLGNT
  text: ᾧ καὶ δεκάτην ἀπὸ πάντων ἐμέρισεν Ἀβραάμ, πρῶτον μὲν ἑρμηνευόμενος βασιλεὺς δικαιοσύνης ἔπειτα δὲ καὶ βασιλεὺς Σαλήμ, ὅ ἐστιν βασιλεὺς εἰρήνης,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/002.yaml
  text: to whom Abraham also apportioned a tenth of everything[a]. First, his name is translated King of Righteousness, and then also King of Salem, that is[b], King of Peace.
translation:
  language: ml
  text: അബ്രാഹാം അവന് എല്ലാറ്റിൽനിന്നും പത്തിലൊന്ന്[a] വേർതിരിച്ചു നൽകി. ആദ്യം, അവന്റെ പേരിന്റെ അർഥം “നീതിയുടെ രാജാവ്”[b] എന്നാണ്; പിന്നെ, ശാലേമിന്റെ രാജാവ്, അതായത് “സമാധാനത്തിന്റെ രാജാവ്.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ദശാംശം.” ഗ്രീക്കിൽ അക്ഷരാർഥം “പത്തിലൊന്ന്” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “ന്യായത്തിന്റെ രാജാവ്.” δικαιοσύνη എന്ന ഗ്രീക്കുപദത്തിന് “നീതി” എന്നും “ന്യായം” എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ
  choice: അവന്
  rationale: മൽക്കീസേദെക്കിനെ സൂചിപ്പിക്കുന്ന ദത്തിവിഭക്തിയിലുള്ള ബന്ധസർവനാമം; പത്തിലൊന്ന് ലഭിച്ച വ്യക്തിയെന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: δεκάτην ἀπὸ πάντων
  choice: സകലത്തിന്റെയും പത്തിലൊന്ന്
  rationale: δεκάτην എന്നതിന്റെ അക്ഷരാർഥമായ ‘പത്തിലൊന്ന്’ നിലനിർത്തുകയും ἀπὸ πάντων സൂചിപ്പിക്കുന്ന മുഴുവൻ വകകളിൽനിന്നുള്ള അംശം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐμέρισεν
  choice: വീതിച്ചുകൊടുത്തു
  rationale: വെറുതെ ‘കൊടുത്തു’ എന്നതിലുപരി, വേർതിരിച്ച് ഓഹരിയാക്കിയെന്ന μερίζω എന്ന ക്രിയയുടെ ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: πρῶτον μὲν ἑρμηνευόμενος
  choice: ആദ്യം, അവന്റെ പേര് പരിഭാഷപ്പെടുത്തിയാൽ
  rationale: പേരിന്റെ അർഥവ്യാഖ്യാനമാണ് നടക്കുന്നതെന്ന് മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; πρῶτον μὲν എന്ന ക്രമസൂചനയും നിലനിർത്തുന്നു.
- source_word: βασιλεὺς δικαιοσύνης
  choice: നീതിയുടെ രാജാവ്
  rationale: δικαιοσύνηയുടെ നൈതിക-ബന്ധപരമായ അർഥവ്യാപ്തി വഹിക്കുന്ന സ്വാഭാവികവും സഭാപാരമ്പര്യത്തിന് മാത്രം പരിമിതമല്ലാത്തതുമായ മലയാളപ്രയോഗം.
- source_word: ἔπειτα δὲ καὶ βασιλεὺς Σαλήμ
  choice: പിന്നെ അവൻ ശാലേമിന്റെ രാജാവും ആകുന്നു
  rationale: രണ്ടാമത്തെ വ്യാഖ്യാനഘട്ടവും καί നൽകുന്ന ‘കൂടി/ഉം’ എന്ന ആശയവും സംരക്ഷിക്കുന്നു; Σαλήμ സ്ഥലപ്പേരായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: ὅ ἐστιν βασιλεὺς εἰρήνης
  choice: അതായത്, ‘സമാധാനത്തിന്റെ രാജാവ്’
  rationale: ὅ ἐστιν എന്ന വിശദീകരണസൂചനയും εἰρήνηയുടെ സാധാരണ അർഥമായ ‘സമാധാനം’ എന്നതും വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: δικαιοσύνη എന്ന പദത്തിന്റെ ശീർഷകപരമായ വിവർത്തനം
  choice: നീതി
  alternative: ന്യായം
  rationale: ‘നീതി’ എന്നത് righteousness എന്ന നൈതികവും ദൈവബന്ധപരവുമായ ഭാവം മലയാളത്തിൽ നന്നായി വഹിക്കുന്നു. അതേസമയം δικαιοσύνηയ്ക്ക് ‘ന്യായം/ന്യായനിഷ്ഠ’ എന്ന അർഥസാധ്യതയുണ്ടെന്നത് അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. പേരുകളുടെ അർഥവ്യാഖ്യാനം വ്യക്തമാക്കാൻ ഉദ്ധരണിചിഹ്നങ്ങൾ ഉപയോഗിച്ചു. ‘വീതിച്ചുകൊടുത്തു’ എന്ന പ്രയോഗം മൂലക്രിയയുടെ വിഭജനഭാവം നിലനിർത്തുന്നു.
