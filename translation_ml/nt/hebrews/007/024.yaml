  yaml_path: translation/nt/hebrews/007/024.yaml
  text: But he[a], because he remains forever, holds the priesthood permanently.
translation:
  language: ml
  text: എന്നാൽ അദ്ദേഹം എന്നേക്കും നിലനിൽക്കുന്നതിനാൽ, പൗരോഹിത്യം സ്ഥിരമായി വഹിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മാറ്റമില്ലാത്ത പൗരോഹിത്യം വഹിക്കുന്നു”; അല്ലെങ്കിൽ, “മറ്റൊരാളിലേക്കു കൈമാറാനാവാത്ത പൗരോഹിത്യം ഉണ്ട്.” ഗ്രീക്ക് വിശേഷണത്തിന് ഈ രണ്ടർഥനിറങ്ങളും ഉണ്ടാകാം. അദ്ദേഹം എന്നേക്കും ജീവിക്കുന്നതിനാൽ അദ്ദേഹത്തിന്റെ പൗരോഹിത്യം മറ്റൊരാളിലേക്കു കടന്നുപോകുന്നില്ല എന്നതാണ് സന്ദർഭത്തിലെ ആശയം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: എന്നാൽ അദ്ദേഹം
  rationale: മുൻവാക്യത്തിലെ അനേകം പുരോഹിതന്മാരോട് യേശുവിനെ വൈരുധ്യപ്പെടുത്തി ചൂണ്ടിക്കാണിക്കുന്ന substantival article-ഉം δέ-യുടെ വൈരുധ്യഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: διὰ τὸ μένειν αὐτὸν
  choice: അദ്ദേഹം ... നിലനിൽക്കുന്നതിനാൽ
  rationale: διά സഹിതമുള്ള articular infinitive കാരണത്തെ സൂചിപ്പിക്കുന്നു; μένω ഇവിടെ മരണമുള്ള മുൻപുരോഹിതന്മാർക്ക് വിപരീതമായി തുടർന്നും ജീവിച്ചിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: εἰς τὸν αἰῶνα
  choice: എന്നേക്കും
  rationale: അവസാനമില്ലാത്ത കാലസ്ഥിരതയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന് സ്വാഭാവികവും വ്യക്തവുമായ മലയാളം.
- source_word: ἀπαράβατον
  choice: സ്ഥിരമായി
  rationale: പൗരോഹിത്യം മറ്റൊരാളിലേക്കു മാറാത്തതോ മാറ്റമില്ലാതെ തുടരുന്നതോ എന്ന ഇരുനിറവും സന്ദർഭാനുസൃതമായി ഉൾക്കൊള്ളുന്ന പ്രയോഗം; യഥാർഥ lexical ambiguity അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἔχει τὴν ἱερωσύνην
  choice: പൗരോഹിത്യം ... വഹിക്കുന്നു
  rationale: ἔχω ഇവിടെ പൗരോഹിത്യപദവി കൈവശംവെക്കുന്നതും തുടരുന്നതും സൂചിപ്പിക്കുന്നു; ‘വഹിക്കുന്നു’ പദവി നിർവഹിക്കുന്നതിന്റെ സ്വാഭാവിക മലയാളപ്രയോഗമാണ്.
- source_word: ἱερωσύνην
  choice: പൗരോഹിത്യം
  rationale: പുരോഹിതപദവിയെയോ അവസ്ഥയെയോ സൂചിപ്പിക്കുന്നതിന് നിലവാരമുള്ള മലയാള പദം.
theological_decisions:
- issue: ക്രിസ്തുവിന്റെ പൗരോഹിത്യവുമായി ബന്ധപ്പെട്ട ἀπαράβατον എന്നതിന്റെ അർഥം
  choice: അദ്ദേഹം എന്നേക്കും ജീവിക്കുന്നതിനാൽ പൗരോഹിത്യം സ്ഥിരമായി വഹിക്കുന്നു എന്ന സന്ദർഭോചിതമായ അർഥം
  alternative: മാറ്റമില്ലാത്ത പൗരോഹിത്യം; മറ്റൊരാളിലേക്കു കൈമാറാനാവാത്ത പൗരോഹിത്യം
  rationale: മരിക്കുകയും പകരം മറ്റുള്ളവർ വരികയും ചെയ്ത പുരോഹിതന്മാരുമായുള്ള വൈരുധ്യമാണ് അടുത്ത സന്ദർഭം. അതിനാൽ സ്ഥിരത മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കുന്നു; എന്നാൽ ഗ്രീക്ക് വിശേഷണത്തിന്റെ യഥാർഥ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു, പിന്നീടുള്ള സാങ്കേതിക ദൈവശാസ്ത്രനിർവചനം വാക്യത്തിൽ ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘അദ്ദേഹം’ യേശുവിനെ ആദരപൂർവം സൂചിപ്പിക്കുന്നു; ‘പൗരോഹിത്യം’ സഭാപരമായ പ്രത്യേക സാങ്കേതിക വ്യാഖ്യാനം ചുമത്താതെ ഗ്രീക്ക് പദത്തിന്റെ പദവിസംബന്ധമായ അർഥം നൽകുന്നു.
