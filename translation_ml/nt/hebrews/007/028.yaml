id: HEB.7.28
reference: Hebrews 7:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ νόμος γὰρ ἀνθρώπους καθίστησιν ἀρχιερεῖς ἔχοντας ἀσθένειαν, ὁ λόγος δὲ τῆς ὁρκωμοσίας τῆς μετὰ τὸν νόμον υἱόν, εἰς τὸν αἰῶνα τετελειωμένον.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/028.yaml
  text: For the law appoints men as high priests who have weakness[a], but the word of the oath, which came after the law[b], appoints a Son who has been perfected forever.
translation:
  language: ml
  text: കാരണം, ന്യായപ്രമാണം ബലഹീനതയുള്ള മനുഷ്യരെ മഹാപുരോഹിതന്മാരായി നിയമിക്കുന്നു; എന്നാൽ ന്യായപ്രമാണത്തിനുശേഷം വന്ന ശപഥത്തിന്റെ വചനം, എന്നേക്കുമായി പരിപൂർണനാക്കപ്പെട്ടിരിക്കുന്ന[b] ഒരു പുത്രനെ[a] നിയമിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ‘പുത്രൻ’ എന്നതിന് നിർദിഷ്ട ഉപപദമില്ല; അതിനാൽ ‘പുത്രനെ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ‘ഒരു പുത്രനെ’ എന്നത് ‘മനുഷ്യരെ’ എന്നതിനോടുള്ള വിരോധത്തിന് ഊന്നൽ നൽകുന്നു; സന്ദർഭത്തിൽ യേശുവിനെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: alternative_reading
  - marker: b
    text: ‘എന്നേക്കുമായി പൂർണതയിലെത്തിക്കപ്പെട്ടിരിക്കുന്ന’ എന്നും പരിഭാഷപ്പെടുത്താം. ഈ ക്രിയയ്ക്ക് ‘പൂർണതയിലെത്തിക്കുക,’ ‘ലക്ഷ്യസിദ്ധിയിലെത്തിക്കുക,’ പുരോഹിതസന്ദർഭത്തിൽ ‘പ്രതിഷ്ഠിക്കുക’ എന്നീ അർഥഭാവങ്ങളും ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμος
  choice: ന്യായപ്രമാണം
  rationale: സന്ദർഭത്തിൽ മോശൈക ന്യായപ്രമാണത്തെയും അതിലെ പുരോഹിതക്രമത്തെയും സൂചിപ്പിക്കുന്നു; മലയാള ബൈബിൾ ഭാഷയിൽ സുപരിചിതവും മാന്യവുമായ പദം.
- source_word: καθίστησιν
  choice: നിയമിക്കുന്നു
  rationale: പുരോഹിതസ്ഥാനത്തേക്ക് ഔദ്യോഗികമായി നിയോഗിക്കുന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു; രണ്ടാം ഖണ്ഡത്തിൽ ഗ്രീക്കിൽ അധ്യാഹൃതമായിരിക്കുന്ന ക്രിയയും മലയാളത്തിൽ വ്യക്തമായി ആവർത്തിക്കുന്നു.
- source_word: ἀνθρώπους
  choice: മനുഷ്യരെ
  rationale: ലേവ്യ മഹാപുരോഹിതന്മാരുടെ മാനുഷികതയെ പുത്രനോടു വിരോധമായി മുന്നോട്ടുകൊണ്ടുവരുന്നു; മലയാളത്തിൽ ലിംഗപരമായി അനാവശ്യമായി ചുരുക്കാതെ ചരിത്രപരമായ സൂചന നിലനിർത്തുന്നു.
- source_word: ἀρχιερεῖς
  choice: മഹാപുരോഹിതന്മാരായി
  rationale: തുടർച്ചയായി ആ സ്ഥാനം വഹിച്ചവരെ സൂചിപ്പിക്കുന്ന ബഹുവചനം നിലനിർത്തുന്നു.
- source_word: ἔχοντας ἀσθένειαν
  choice: ബലഹീനതയുള്ള
  rationale: ἀσθένεια എന്ന നാമരൂപം നിലനിർത്തുന്നു; ശാരീരിക രോഗം മാത്രമല്ല, മാനുഷിക ദൗർബല്യവും പരിമിതിയും ഉൾക്കൊള്ളാൻ കഴിയുന്നു.
- source_word: λόγος τῆς ὁρκωμοσίας
  choice: ശപഥവചനം
  rationale: ദൈവത്തിന്റെ ശപഥമായി ഉച്ചരിക്കപ്പെട്ട തിരുവെഴുത്തുപ്രഖ്യാപനത്തെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: τῆς μετὰ τὸν νόμον
  choice: ന്യായപ്രമാണത്തിനുശേഷം വന്ന
  rationale: ശപഥവചനം ന്യായപ്രമാണത്തിനു കാലക്രമത്തിൽ ശേഷമാണ് നൽകിയതെന്ന എബ്രായലേഖനത്തിന്റെ വാദം വ്യക്തമാക്കുന്നു.
- source_word: υἱόν
  choice: ഒരു പുത്രനെ
  rationale: ഗ്രീക്കിൽ നിർദിഷ്ട ഉപപദമില്ലാത്ത രൂപവും ‘മനുഷ്യർ’ എന്നതുമായ ഗുണപരമായ വിരോധവും പരമാവധി നിലനിർത്തുന്നു; സന്ദർഭം യേശുവിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: εἰς τὸν αἰῶνα
  choice: എന്നേക്കുമായി
  rationale: അവസാനമില്ലാത്ത നിലനിൽപ്പിനെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τετελειωμένον
  choice: പരിപൂർണനാക്കപ്പെട്ടിരിക്കുന്ന
  rationale: പൂർണതയിലേക്കോ ലക്ഷ്യസിദ്ധിയിലേക്കോ എത്തിക്കപ്പെട്ടതെന്ന അർഥവ്യാപ്തിയും perfect passive രൂപം സൂചിപ്പിക്കുന്ന നിലനിൽക്കുന്ന ഫലവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: നിർദിഷ്ട ഉപപദമില്ലാത്ത υἱόν എന്നതിന്റെ പരിഭാഷ
  choice: ഒരു പുത്രനെ
  alternative: പുത്രനെ
  rationale: മനുഷ്യരായ മഹാപുരോഹിതന്മാരും പുത്രനും തമ്മിലുള്ള വിരോധം നിലനിർത്തിക്കൊണ്ട് ഗ്രീക്ക് രൂപത്തിന്റെ അനിർദിഷ്ടത മലയാളത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു. ‘ഒരു’ എന്നത് പല പുത്രന്മാരിൽ ഒരാൾ എന്ന ആശയം നിർബന്ധമായി ഉദ്ദേശിക്കുന്നില്ലെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- issue: τετελειωμένον എന്നതിന്റെ പുരോഹിതശാസ്ത്രപരമായ അർഥം
  choice: പരിപൂർണനാക്കപ്പെട്ടിരിക്കുന്ന
  alternative: പൂർണതയിലെത്തിക്കപ്പെട്ടിരിക്കുന്ന; പ്രതിഷ്ഠിക്കപ്പെട്ടിരിക്കുന്ന
  rationale: പൂർണത, ലക്ഷ്യസിദ്ധി, പുരോഹിതശുശ്രൂഷയ്ക്കുള്ള യോഗ്യത എന്നീ അർഥസാധ്യതകളെ ഒരൊറ്റ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതെ എബ്രായലേഖനത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘ന്യായപ്രമാണം,’ ‘മഹാപുരോഹിതൻ,’ ‘ശപഥവചനം’ തുടങ്ങിയ സ്ഥാപിത ബൈബിൾ പദങ്ങൾ നിലനിർത്തിയപ്പോൾ വാക്യഘടന സ്വാഭാവികമാക്കി. മൂലത്തിലെ γάρ (‘കാരണം/എന്തെന്നാൽ’) മുൻസന്ദർഭവുമായി ബന്ധിപ്പിക്കുന്നതിനാൽ ‘ന്യായപ്രമാണം’ എന്നതിന് മുമ്പ് ‘കാരണം’ ചേർക്കുന്നതും സാധ്യമാണ്; ഒറ്റവാക്യമായി വായിക്കുമ്പോൾ അമിതബന്ധകത ഒഴിവാക്കാൻ ഇവിടെ പ്രകടമായി ചേർത്തിട്ടില്ല.
