id: HEB.7.5
reference: Hebrews 7:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ οἱ μὲν ἐκ τῶν υἱῶν Λευὶ τὴν ἱερατείαν λαμβάνοντες ἐντολὴν ἔχουσιν ἀποδεκατοῦν τὸν λαὸν κατὰ τὸν νόμον, τοῦτ’ ἔστιν τοὺς ἀδελφοὺς αὐτῶν, καίπερ ἐξεληλυθότας ἐκ τῆς ὀσφύος Ἀβραάμ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/005.yaml
  text: And those from the sons of Levi who receive the priesthood have a commandment according to the law to collect a tenth from the people—that is[b][a], from their brothers—though they also have come from Abraham’s loins.
translation:
  language: ml
  text: ലേവിയുടെ പുത്രന്മാരിൽനിന്ന് പൗരോഹിത്യം സ്വീകരിക്കുന്നവർക്ക്, ന്യായപ്രമാണപ്രകാരം ജനത്തിൽനിന്ന്—അതായത്, തങ്ങളുടെ സഹോദരന്മാരിൽനിന്ന്[a]—ദശാംശം പിരിക്കാൻ കല്പനയുണ്ട്; അവരും അബ്രാഹാമിന്റെ അരയിൽനിന്ന് വന്നവരാണെങ്കിലും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തങ്ങളുടെ സഹഇസ്രായേല്യരിൽനിന്ന്.” ഗ്രീക്കിൽ “തങ്ങളുടെ സഹോദരന്മാർ” എന്നാണ്; ജനത്തിലെ സഹഅംഗങ്ങളെ സൂചിപ്പിക്കാൻ പുരുഷലിംഗ കുടുംബബന്ധഭാഷയാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അവരും അബ്രാഹാമിന്റെ വംശജരാണെങ്കിലും.” അക്ഷരാർഥത്തിൽ, “അബ്രാഹാമിന്റെ അരയിൽനിന്ന് വന്നവരാണെങ്കിലും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ μὲν ἐκ τῶν υἱῶν Λευὶ
  choice: ലേവിയുടെ പുത്രന്മാരിൽനിന്ന് ... സ്വീകരിക്കുന്നവർ
  rationale: ἐκ എന്നതിന്റെ ഭാഗിക അർഥവും υἱῶν എന്ന കുടുംബവംശഭാഷയും നിലനിർത്തുന്നു; എല്ലാ ലേവ്യരെയും പൊതുവായി സൂചിപ്പിക്കാതെ, ലേവിയുടെ വംശത്തിൽനിന്ന് പൗരോഹിത്യം ലഭിക്കുന്നവരിലാണ് ശ്രദ്ധ.
- source_word: τὴν ἱερατείαν λαμβάνοντες
  choice: പൗരോഹിത്യം സ്വീകരിക്കുന്നവർ
  rationale: λαμβάνοντες സ്വയം ഏറ്റെടുക്കുന്നതിനെക്കാൾ ലഭിക്കൽ/നിയമനം സൂചിപ്പിക്കുന്നതിനാൽ ‘സ്വീകരിക്കുന്നവർ’ എന്നു പരിഭാഷപ്പെടുത്തി; ἱερατείαയ്ക്ക് സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ‘പൗരോഹിത്യം’ ഉപയോഗിച്ചു.
- source_word: ἐντολὴν ἔχουσιν
  choice: കല്പനയുണ്ട്
  rationale: ഗ്രീക്കിലെ നാമപദഘടനയും നിയമപരമായ അധികാരഭാവവും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: ἀποδεκατοῦν
  choice: ദശാംശം പിരിക്കാൻ
  rationale: മറ്റുള്ളവരിൽനിന്ന് പത്തിലൊന്ന് സ്വീകരിക്കുകയോ ശേഖരിക്കുകയോ ചെയ്യുന്നതാണ് ക്രിയയുടെ അർഥം; ‘ദശാംശം കൊടുക്കാൻ’ എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: τὸν λαὸν
  choice: ജനത്തിൽനിന്ന്
  rationale: λαός എന്നതിന്റെ നേരായ പരിഭാഷ; തുടർന്നുള്ള വിശദീകരണം ഇവർ ഇസ്രായേൽജനമാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: κατὰ τὸν νόμον
  choice: ന്യായപ്രമാണപ്രകാരം
  rationale: κατάയുടെ മാനദണ്ഡപരമായ അർഥം സൂക്ഷിക്കുകയും മോശെയുടെ ന്യായപ്രമാണസന്ദർഭം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: τοῦτ’ ἔστιν
  choice: അതായത്
  rationale: വിശദീകരണാത്മകമായ സമാനാധികരണത്തെ സ്വാഭാവിക മലയാളത്തിൽ അടയാളപ്പെടുത്തുന്നു.
- source_word: τοὺς ἀδελφοὺς αὐτῶν
  choice: തങ്ങളുടെ സഹോദരന്മാരിൽനിന്ന്
  rationale: ഗ്രീക്കിലെ പുരുഷലിംഗ കുടുംബബന്ധപദം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; ഇവിടെ വിശാലമായി സഹഇസ്രായേല്യരെ സൂചിപ്പിക്കുന്നതാണെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: καίπερ
  choice: ആണെങ്കിലും
  rationale: വാക്യത്തിലെ വിട്ടുവീഴ്ചാസൂചകമായ concessive ബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐξεληλυθότας ἐκ τῆς ὀσφύος Ἀβραάμ
  choice: അവരും അബ്രാഹാമിന്റെ അരയിൽനിന്ന് വന്നവരാണ്
  rationale: അബ്രാഹാമിൽനിന്നുള്ള ശാരീരിക വംശപരമ്പരയെ സൂചിപ്പിക്കുന്ന മൂർത്തമായ ഗ്രീക്ക് പ്രയോഗം നിലനിർത്തുന്നു; ‘അവരും’ എന്നത് ലേവിയുടെ പുത്രന്മാരുമായുള്ള പൊതുവംശബന്ധത്തിന്റെ വാദബലം പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ഇസ്രായേൽ സമൂഹത്തെ സൂചിപ്പിക്കുന്ന കുടുംബബന്ധഭാഷ
  choice: തങ്ങളുടെ സഹോദരന്മാർ
  alternative: തങ്ങളുടെ സഹഇസ്രായേല്യർ
  rationale: ἀδελφούς എന്ന പുരുഷലിംഗ ബന്ധപദം പാഠത്തിൽ സംരക്ഷിക്കുമ്പോൾ അതിന്റെ ഉടമ്പടിസമൂഹപരമായ വിശാല സൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കാം.
- issue: ശാരീരിക വംശപരമ്പരയുടെ രൂപകപ്രയോഗം
  choice: അബ്രാഹാമിന്റെ അരയിൽനിന്ന് വന്നവർ
  alternative: അബ്രാഹാമിന്റെ വംശജർ
  rationale: എബ്രായർ 7-ലെ താരതമ്യവാദത്തിന് പൊതുവായ ശാരീരിക വംശപരമ്പര നിർണായകമാണ്; അതിനാൽ ഗ്രീക്കിലെ ശരീരാധിഷ്ഠിത പ്രയോഗം മായ്ച്ചുകളയാതെ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പൗരോഹിത്യം’, ‘ന്യായപ്രമാണം’, ‘ദശാംശം’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തി; ഗ്രീക്കിലെ വംശപരവും നിയമപരവുമായ സൂക്ഷ്മതകൾ അമിതവ്യാഖ്യാനം കൂടാതെ സംരക്ഷിച്ചു.
