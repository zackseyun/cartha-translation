id: HEB.7.23
reference: Hebrews 7:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ οἱ μὲν πλείονές εἰσιν γεγονότες ἱερεῖς διὰ τὸ θανάτῳ κωλύεσθαι παραμένειν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/023.yaml
  text: And they indeed have become many priests[a], because they are prevented by death from remaining in office[b],
translation:
  language: ml
  text: കൂടാതെ, പുരോഹിതന്മാർ അനേകരുണ്ടായിരുന്നു[a]; കാരണം, മരണം അവരെ തങ്ങളുടെ ശുശ്രൂഷയിൽ തുടരുന്നതിൽനിന്ന് തടഞ്ഞു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവർ അനേകം പുരോഹിതന്മാരായിത്തീർന്നിട്ടുണ്ട്.’
    reason: γεγονότες ഉൾപ്പെട്ട ഗ്രീക്ക് ഘടനയെ പുരോഹിതന്മാരുടെ ബഹുത്വം വ്യക്തമാക്കുന്ന അസ്തിത്വവാക്യമായും വിവർത്തനം ചെയ്യാം.
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘തുടരുന്നതിൽനിന്ന്’; സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത് പുരോഹിതശുശ്രൂഷയിൽ തുടരുന്നതാണ്.
    reason: παραμένειν എന്ന പദത്തിൽ ‘ശുശ്രൂഷയിൽ’ എന്നത് നേരിട്ട് ഇല്ലെങ്കിലും പുരോഹിതസന്ദർഭം അതിനെ സൂചിപ്പിക്കുന്നു.
lexical_decisions:
- source_word: Καὶ
  choice: അവർ
  rationale: Καί ഇവിടെ മുൻവാക്യത്തിലെ വാദം തുടരുന്ന ലളിതമായ ബന്ധകമാണ്. എന്നാൽ ഒറ്റവാക്യമായി സ്വാഭാവികമായ മലയാളം ലഭിക്കാൻ പ്രത്യേകമായ ‘കൂടാതെ’ ചേർക്കാതെ സർവനാമത്തോടെ വാക്യം ആരംഭിച്ചു.
- source_word: οἱ μὲν πλείονές εἰσιν γεγονότες ἱερεῖς
  choice: അവർ അനേകം പുരോഹിതന്മാരായിത്തീർന്നിട്ടുണ്ട്
  rationale: γεγονότες എന്ന perfect രൂപത്തിന്റെ ഫലാവസ്ഥയും πλείονες സൂചിപ്പിക്കുന്ന പുരോഹിതന്മാരുടെ ബഹുത്വവും നിലനിർത്തുന്നു. μέν അടുത്ത വാക്യത്തിലെ δέ-യോടുള്ള വൈരുധ്യത്തിന് വഴിയൊരുക്കുന്നു; മലയാളത്തിൽ അർധവിരാമവും വാക്യക്രമവും ആ ബന്ധം വഹിക്കുന്നു.
- source_word: διὰ τὸ θανάτῳ κωλύεσθαι
  choice: കാരണം, മരണത്താൽ അവർക്ക് ... കഴിയുന്നില്ല
  rationale: διά സഹിതമുള്ള articular infinitive കാരണത്തെ സൂചിപ്പിക്കുന്നു; θανάτῳ ഉപകരണ/കാരണഭാവത്തിൽ ‘മരണത്താൽ’ എന്നു നൽകി. κωλύεσθαι എന്ന passive ആശയം സ്വാഭാവിക മലയാളത്തിൽ കഴിവില്ലായ്മയായി പ്രകടിപ്പിച്ചു.
- source_word: παραμένειν
  choice: തങ്ങളുടെ ശുശ്രൂഷയിൽ തുടരാൻ
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥം ‘തുടരുക/നിലനിൽക്കുക’ എന്നതാണ്. പുരോഹിതസന്ദർഭത്തിൽ തുടരുന്നത് അവരുടെ ശുശ്രൂഷയിലാണെന്ന് വ്യക്തമാക്കുന്നു; ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത പ്രത്യേക സ്ഥാപനപരമായ പദവി ചേർക്കുന്നില്ല.
theological_decisions:
- issue: മുൻ പുരോഹിതന്മാരുടെ ബഹുത്വവും യേശുവിന്റെ നിലനിൽക്കുന്ന പൗരോഹിത്യവും തമ്മിലുള്ള വൈരുധ്യം
  choice: മരണം മൂലം അനേകം പുരോഹിതന്മാർ ഉണ്ടായെന്ന വാക്യത്തിന്റെ ആശയം മാത്രം പ്രകടമാക്കി; അടുത്ത വാക്യത്തിലെ യേശുവുമായുള്ള വൈരുധ്യത്തിന് വഴിയൊരുക്കി.
  alternative: മുഖ്യപാഠത്തിൽ ‘ലേവ്യപുരോഹിതന്മാർ’ അല്ലെങ്കിൽ ‘പഴയ പുരോഹിതന്മാർ’ എന്നു വ്യക്തമാക്കുക.
  rationale: സന്ദർഭം ആ പുരോഹിതക്രമത്തെ സൂചിപ്പിച്ചാലും ഈ വാക്യത്തിലെ ഗ്രീക്ക് ‘ലേവ്യ’ എന്ന വിശേഷണം ഉപയോഗിക്കുന്നില്ല. അതിനാൽ അധിക സിദ്ധാന്തപരമായ വിശദീകരണം ചേർത്തില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘പുരോഹിതൻ’, ‘ശുശ്രൂഷ’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തി; അത്യന്തം സംസ്കൃതവത്കൃതമായ ഘടന ഒഴിവാക്കി.
