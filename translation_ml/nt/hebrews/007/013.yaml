id: HEB.7.13
reference: Hebrews 7:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐφ’ ὃν γὰρ λέγεται ταῦτα φυλῆς ἑτέρας μετέσχηκεν, ἀφ’ ἧς οὐδεὶς προσέσχηκεν τῷ θυσιαστηρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/013.yaml
  text: For the one about whom these things are said belongs to another tribe[b][a], from which no one has served at the altar.
translation:
  language: ml
  text: എന്തെന്നാൽ, ഈ കാര്യങ്ങൾ ആരെക്കുറിച്ചാണോ പറയപ്പെടുന്നത്, അദ്ദേഹം മറ്റൊരു ഗോത്രത്തിൽ ഉൾപ്പെട്ടവനാണ്[a]; ആ ഗോത്രത്തിൽനിന്ന് ആരും യാഗപീഠത്തിൽ ശുശ്രൂഷ ചെയ്തിട്ടില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘മറ്റൊരു ഗോത്രത്തിൽ പങ്കുള്ളവനാണ്’ അല്ലെങ്കിൽ ‘മറ്റൊരു ഗോത്രത്തിൽനിന്ന് വന്നവനാണ്.’ ഗ്രീക്ക് ക്രിയ പങ്കാളിത്തത്തെയോ ബന്ധത്തെയോ സൂചിപ്പിക്കാം; ഇവിടെ ഉദ്ദേശിക്കുന്നത് ഗോത്രബന്ധമാണ്.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്ക് പ്രയോഗം യാഗപീഠവുമായി ബന്ധപ്പെട്ട പുരോഹിതപരമായ ഹാജരെയോ സേവനത്തെയോ സൂചിപ്പിക്കുന്നു; ‘യാഗപീഠത്തിന്റെ ശുശ്രൂഷയിൽ ഏർപ്പെട്ടിട്ടില്ല’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφ’ ὃν
  choice: ആരെക്കുറിച്ചാണോ
  rationale: λέγεται ταῦτα എന്നതോടൊപ്പം ഇവിടെ വ്യക്തിയെ സംബന്ധിച്ചുള്ള പരാമർശമാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികമായി ‘ആരെക്കുറിച്ചാണോ’ എന്നു നൽകാം.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാദത്തിനുള്ള വിശദീകരണാധാരം അവതരിപ്പിക്കുന്ന ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: λέγεται ταῦτα
  choice: ഈ കാര്യങ്ങൾ ... പറയപ്പെടുന്നത്
  rationale: വർത്തമാനകാല കർമണിപ്രയോഗവും ταῦτα എന്ന ബഹുവചനവും നിലനിർത്തുന്നു.
- source_word: φυλῆς ἑτέρας
  choice: മറ്റൊരു ഗോത്രം
  rationale: ഇസ്രായേലിലെ ഗോത്രങ്ങളിലൊന്നിനെയാണ് φυλή സൂചിപ്പിക്കുന്നത്; ἑτέρας മുമ്പ് ചർച്ച ചെയ്ത പുരോഹിതഗോത്രത്തിൽനിന്നുള്ള വ്യത്യാസം പ്രകടമാക്കുന്നു.
- source_word: μετέσχηκεν
  choice: ഉൾപ്പെട്ടവനാണ്
  rationale: പങ്കാളിത്തം/ബന്ധം എന്ന അടിസ്ഥാനാർഥം ഗോത്രബന്ധത്തിന്റെ പശ്ചാത്തലത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ‘വംശജനാണ്’ എന്നു പറഞ്ഞ് ഇറങ്ങിവരവിന്റെ ആശയം അധികമായി ചേർക്കുന്നില്ല.
- source_word: ἀφ’ ἧς
  choice: ആ ഗോത്രത്തിൽനിന്ന്
  rationale: ബന്ധസർവനാമത്തിന്റെ പൂർവപദമായ φυλή വ്യക്തമായി ആവർത്തിക്കുന്നത് മലയാളത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കുന്നു.
- source_word: οὐδεὶς
  choice: ആരും ... ഇല്ല
  rationale: സാർവത്രിക നിഷേധം സ്വാഭാവിക മലയാളരീതിയിൽ നൽകുന്നു.
- source_word: προσέσχηκεν τῷ θυσιαστηρίῳ
  choice: യാഗപീഠത്തിൽ ശുശ്രൂഷ ചെയ്തിട്ടില്ല
  rationale: യാഗപീഠവുമായി ബന്ധപ്പെട്ട പുരോഹിതപരമായ ഹാജർ/സേവനം വ്യക്തമാക്കുന്നു; നിർവഹിച്ച പ്രത്യേക കർമങ്ങൾ അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: θυσιαστηρίῳ
  choice: യാഗപീഠം
  rationale: ബലികർമസന്ദർഭത്തിലെ പതിവും വ്യക്തവുമായ മലയാള പദം.
theological_decisions:
- issue: പുരോഹിതത്വവാദത്തിൽ യേശുവിന് ലേവിയേതര ഗോത്രവുമായുള്ള ബന്ധം
  choice: ഗ്രീക്ക് പറയുന്നതുപോലെ മറ്റൊരു ഗോത്രത്തിൽ ഉൾപ്പെട്ടിരിക്കുന്നു എന്ന ഗോത്രബന്ധം മാത്രം പ്രസ്താവിച്ചു.
  alternative: ‘മറ്റൊരു ഗോത്രത്തിൽനിന്ന് വംശപരമായി വന്നവനാണ്’ എന്ന് വ്യാഖ്യാനാത്മകമായി നൽകുക.
  rationale: വാക്യത്തിന്റെ വാദം ലേവിയേതര ഗോത്രബന്ധത്തെ ആശ്രയിക്കുന്നുവെങ്കിലും, μετέσχηκεν തന്നെ വംശാവലി അഥവാ ഇറങ്ങിവരവ് നേരിട്ട് പ്രസ്താവിക്കുന്നില്ല; അതിനാൽ പാഠത്തേക്കാൾ അധികം നിർണ്ണയിക്കാതെ യഥാർഥ വ്യാപ്തി നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ വാദാത്മകവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഉൾപ്പെട്ടവനാണ്’ ഗോത്രബന്ധം വ്യക്തമാക്കുമ്പോഴും ഗ്രീക്കിലുള്ള പങ്കാളിത്ത/ബന്ധാർഥത്തിന്റെ തുറന്ന സ്വഭാവം പൂർണമായി ഇല്ലാതാക്കാതിരിക്കാൻ അടിക്കുറിപ്പ് ചേർത്തു. പ്രധാനപാഠത്തിലെ അടിക്കുറിപ്പുകൾ ബന്ധപ്പെട്ട ഘടകങ്ങൾക്ക് പിന്നാലെ [a], [b] എന്ന ക്രമത്തിൽ നൽകിയിരിക്കുന്നു.
