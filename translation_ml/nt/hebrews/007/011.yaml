id: HEB.7.11
reference: Hebrews 7:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εἰ μὲν οὖν τελείωσις διὰ τῆς Λευιτικῆς ἱερωσύνης ἦν, ὁ λαὸς γὰρ ἐπ’ ⸀αὐτῆς ⸀νενομοθέτηται, τίς ἔτι χρεία κατὰ τὴν τάξιν Μελχισέδεκ ἕτερον ἀνίστασθαι ἱερέα καὶ οὐ κατὰ τὴν τάξιν Ἀαρὼν λέγεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/011.yaml
  text: If perfection had been through the Levitical priesthood—for on its basis the people had received the law—what further need was there for another priest to arise according to the order of Melchizedek and not be spoken of according to the order of Aaron?[a][b]
translation:
  language: ml
  text: ലേവ്യപൗരോഹിത്യത്തിലൂടെ പൂർണത ലഭിക്കാമായിരുന്നെങ്കിൽ—അതിനെ അടിസ്ഥാനമാക്കിയാണല്ലോ ജനത്തിന് ന്യായപ്രമാണം നൽകപ്പെട്ടത്[a]—മൽക്കീസേദെക്കിന്റെ ക്രമപ്രകാരം മറ്റൊരു പുരോഹിതൻ എഴുന്നേൽക്കുകയും അഹരോന്റെ ക്രമപ്രകാരം എന്നു പറയപ്പെടാതിരിക്കുകയും ചെയ്യേണ്ട ആവശ്യം പിന്നെയും എന്തായിരുന്നു?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അതിന്റെ കീഴിലാണ് ജനത്തിന് ന്യായപ്രമാണം നൽകപ്പെട്ടത്.” ഗ്രീക്ക് പ്രയോഗം കൂടുതൽ ഔപചാരികമായി ഇങ്ങനെ പരിഭാഷപ്പെടുത്താം; ലേവ്യപൗരോഹിത്യത്തെ ആധാരമാക്കിയായിരുന്നു ഇസ്രായേലിന്റെ നിയമക്രമം എന്നതാണ് ആശയം.'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: “മൽക്കീസേദെക്കിന്റെ ക്രമപ്രകാരം മറ്റൊരു പുരോഹിതൻ എഴുന്നേൽക്കുകയും അഹരോന്റെ ക്രമപ്രകാരം എന്നു വിളിക്കപ്പെടാതിരിക്കുകയും ചെയ്യേണ്ട ആവശ്യം പിന്നെയും എന്തായിരുന്നു?”'
    reason: alternative_reading
lexical_decisions:
- source_word: τελείωσις
  choice: പൂർണത
  rationale: എബ്രായലേഖനത്തിലെ ആരാധനാപരവും രക്ഷാസംബന്ധവുമായ ഭാരം നിലനിർത്തുന്നു; ധാർമ്മിക പരിപൂർണതയെന്നോ വെറും പൂർത്തീകരണമെന്നോ മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: διὰ τῆς Λευιτικῆς ἱερωσύνης
  choice: ലേവ്യപൗരോഹിത്യത്തിലൂടെ
  rationale: ജനിറ്റീവോടുകൂടിയ διά സൂചിപ്പിക്കുന്ന മാർഗം അഥവാ ഉപാധി സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐπ’ αὐτῆς
  choice: അതിനെ അടിസ്ഥാനമാക്കി
  rationale: സ്ത്രീലിംഗ സർവനാമത്തിന്റെ ഏറ്റവും സ്വാഭാവികമായ പൂർവപദം ലേവ്യപൗരോഹിത്യമാണ്; നിയമക്രമം അതിനെ ആധാരമാക്കിയിരുന്നു എന്ന ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: νενομοθέτηται
  choice: ന്യായപ്രമാണം നൽകപ്പെട്ടത്
  rationale: പെർഫെക്റ്റ് പാസീവിന്റെ ഫലാവസ്ഥയും ജനത്തിനു നിയമം നൽകപ്പെട്ടുവെന്ന ആശയവും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: τίς ἔτι χρεία
  choice: ആവശ്യം പിന്നെയും എന്തായിരുന്നു
  rationale: തുടർന്നും ശേഷിക്കുന്ന ആവശ്യത്തെക്കുറിച്ചുള്ള വാചാടോപചോദ്യത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: κατὰ τὴν τάξιν Μελχισέδεκ
  choice: മൽക്കീസേദെക്കിന്റെ ക്രമപ്രകാരം
  rationale: τάξις സൂചിപ്പിക്കുന്ന ക്രമം, മാതൃക, വിഭാഗം എന്നീ സാധ്യതകൾ തുറന്നുവെക്കുന്ന സ്ഥാപിതമായ പ്രയോഗം.
- source_word: ἕτερον ... ἱερέα
  choice: മറ്റൊരു പുരോഹിതൻ
  rationale: തുടർന്നുള്ള അഹരോൻ–മൽക്കീസേദെക്ക് വൈരുധ്യം വ്യത്യസ്തത വ്യക്തമാക്കുന്നതിനാൽ സ്വാഭാവികമായ ഈ രൂപം മതിയാകുന്നു.
- source_word: ἀνίστασθαι
  choice: എഴുന്നേൽക്കേണ്ട
  rationale: ഒരു പുരോഹിതൻ രംഗത്തുവരികയോ നിയമിക്കപ്പെടുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; പുനരുത്ഥാനാർഥം നിർബന്ധിക്കുന്നില്ല.
- source_word: καὶ οὐ ... λέγεσθαι
  choice: അഹരോന്റെ ക്രമപ്രകാരം എന്നു പറയപ്പെടാതെ
  rationale: പുരോഹിതൻ എങ്ങനെ വിശേഷിപ്പിക്കപ്പെടുകയോ വർഗീകരിക്കപ്പെടുകയോ ചെയ്യുന്നു എന്ന λέγεσθαιയുടെ വിശാലത നിലനിർത്തുന്നു.
- source_word: Μελχισέδεκ / Ἀαρών
  choice: മൽക്കീസേദെക്ക് / അഹരോൻ
  rationale: ആധുനിക മലയാള ബൈബിൾ പ്രയോഗത്തിൽ തിരിച്ചറിയാവുന്ന ലിപ്യന്തരണങ്ങൾ ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: τελείωσις എന്നതിന്റെ അർഥം
  choice: പൂർണത
  alternative: പൂർത്തീകരണം; ദൈവസന്നിധിയിലേക്കുള്ള പൂർണ പ്രവേശനം
  rationale: ലേവ്യപൗരോഹിത്യത്തിന് ലക്ഷ്യസാഫല്യം നൽകാനായിരുന്നോ എന്ന വാദത്തിന്റെ ആരാധനാപരവും രക്ഷാസംബന്ധവുമായ പിരിമുറുക്ക് വിശദീകരിക്കാതെ നിലനിർത്തുന്നു.
- issue: ἐπ’ αὐτῆς എന്നതിലെ സർവനാമത്തിന്റെ സൂചന
  choice: ലേവ്യപൗരോഹിത്യത്തെ സൂചിപ്പിക്കുന്നതായി പരിഭാഷപ്പെടുത്തി
  alternative: ന്യായപ്രമാണം; വിശാലമായ ഉടമ്പടിക്രമം
  rationale: ഏറ്റവും അടുത്ത അനുയോജ്യമായ സ്ത്രീലിംഗ പൂർവപദം പൗരോഹിത്യമാണ്; ഇടയ്ക്കുള്ള വിശദീകരണവാക്യത്തിന്റെ തർക്കക്രമത്തിനും ഇതാണ് യോജിച്ചത്.
- issue: λέγεσθαιയിലെ വർഗീകരണഭാവം
  choice: എന്നു പറയപ്പെടാതെ
  alternative: എന്നു വിളിക്കപ്പെടാതെ
  rationale: വെറും പേര് വിളിക്കുന്നതിലുപരി ഏത് ക്രമത്തിൽ ഉൾപ്പെടുത്തി വിശേഷിപ്പിക്കുന്നു എന്ന ആശയം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ദീർഘമായ ഗ്രീക്ക് വാക്യത്തിന്റെ വാചാടോപചോദ്യരൂപം നിലനിർത്തി; പരാന്തസദൃശമായ γάρ ഉപവാക്യം ദീർഘരേഖകൾക്കുള്ളിൽ നൽകി. ‘ന്യായപ്രമാണം’ സാധാരണ ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായതിനാൽ നിലനിർത്തി; വിഭാഗീയ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
