revisions:
- from: ലേവ്യപൗരോഹിത്യത്തിലൂടെ പൂർണത കൈവരിക്കാമായിരുന്നെങ്കിൽ—അതിനെ അടിസ്ഥാനമാക്കിയാണല്ലോ ജനത്തിന് ന്യായപ്രമാണം നൽകപ്പെട്ടത്[a]—അഹരോന്റെ ക്രമപ്രകാരം എന്നു പറയപ്പെടാതെ, മൽക്കീസേദെക്കിന്റെ ക്രമപ്രകാരം മറ്റൊരു പുരോഹിതൻ എഴുന്നേൽക്കേണ്ട ആവശ്യം പിന്നെയും എന്തായിരുന്നു?[b]
  to: ലേവ്യപൗരോഹിത്യത്തിലൂടെ പൂർണത ലഭിക്കാമായിരുന്നെങ്കിൽ—അതിനെ അടിസ്ഥാനമാക്കിയാണല്ലോ ജനത്തിന് ന്യായപ്രമാണം നൽകപ്പെട്ടത്[a]—മൽക്കീസേദെക്കിന്റെ ക്രമപ്രകാരം മറ്റൊരു പുരോഹിതൻ എഴുന്നേൽക്കുകയും അഹരോന്റെ ക്രമപ്രകാരം എന്നു പറയപ്പെടാതിരിക്കുകയും ചെയ്യേണ്ട ആവശ്യം പിന്നെയും എന്തായിരുന്നു?[b]
  rationale: The revision restores the Greek order of the coordinated predicates—Melchizedek-order arising first, Aaron-order designation second—without adding interpretation. It also makes the Malayalam construction smoother and adjusts footnote a’s description of the alternative as a more formal rendering rather than an inaccurately word-for-word one.
