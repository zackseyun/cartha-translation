id: HEB.7.18
reference: Hebrews 7:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀθέτησις μὲν γὰρ γίνεται προαγούσης ἐντολῆς διὰ τὸ αὐτῆς ἀσθενὲς καὶ ἀνωφελές,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/018.yaml
  text: For there is indeed a setting aside of the former commandment because of its weakness and uselessness[b][a],
translation:
  language: ml
  text: കാരണം, മുമ്പുള്ള കല്പന അതിന്റെ ബലഹീനതയും പ്രയോജനമില്ലായ്മയും നിമിത്തം നീക്കിവെക്കപ്പെടുന്നു[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മുൻ കല്പന’ അല്ലെങ്കിൽ ‘മുമ്പുള്ള കല്പന.’
    reason: lexical_alternative
  - marker: b
    text: അതായത്, ചുറ്റുമുള്ള സന്ദർഭത്തിൽ പറയുന്ന പരിപൂർണത കൈവരുത്തുന്നതിൽ അത് ഫലപ്രദമായിരുന്നില്ല (എബ്രാ. 7:19 കാണുക); ദൈവത്തിന്റെ മുൻ വെളിപ്പാട് സ്വതവേ തിന്മയായിരുന്നുവെന്നല്ല.
    reason: cross_reference
lexical_decisions:
- source_word: ἀθέτησις
  choice: നീക്കിവെക്കപ്പെടുന്നു
  rationale: കല്പനയുടെ പ്രാബല്യം റദ്ദാക്കപ്പെടുകയോ അത് മാറ്റിവെക്കപ്പെടുകയോ ചെയ്യുന്നതാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്. നിയമപരമായ അർഥം നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി മനസ്സിലാകുന്ന പ്രയോഗമാണിത്.
- source_word: μὲν γὰρ
  choice: വാക്യഘടനയിലും തുടർന്നുവരുന്ന വിരുദ്ധതയിലും പ്രതിഫലിപ്പിച്ചു
  rationale: γάρ മുൻവാദത്തിന്റെ വിശദീകരണം നൽകുകയും μέν അടുത്ത വാക്യത്തിലെ വിരുദ്ധഘടകത്തിലേക്ക് സൂചിപ്പിക്കുകയും ചെയ്യുന്നു. മലയാളത്തിൽ ‘ഒരു വശത്ത്’ എന്ന് കൃത്രിമമായി ചേർക്കാതെ വാക്യത്തിന്റെ വിശദീകരണസ്വഭാവവും 7:19-ലെ തുടർച്ചയും നിലനിർത്തി.
- source_word: γίνεται
  choice: നീക്കിവെക്കപ്പെടുന്നു
  rationale: ഇവിടെ സംഭവിക്കുകയോ നിലവിൽ വരികയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന γίνεται, ἀθέτησις എന്ന നാമത്തോടൊപ്പം മലയാളത്തിൽ സ്വാഭാവികമായ ക്രിയാരൂപത്തിൽ ചേർത്തു.
- source_word: προαγούσης ἐντολῆς
  choice: മുമ്പുണ്ടായിരുന്ന കല്പന
  rationale: προαγούσης എന്നത് മുമ്പേ ഉണ്ടായിരുന്നതോ മുന്നേ പോയതോ ആയതിനെ സൂചിപ്പിക്കുന്നു. ‘മുമ്പുണ്ടായിരുന്ന’ എന്നത് കാലപരമായ മുൻഗണന വ്യക്തമാക്കുന്നു; ‘മുൻ കല്പന’ എന്നതിന്റെ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: ἀσθενές
  choice: ബലഹീനത
  rationale: ശക്തിയുടെയോ ഫലപ്രാപ്തിയുടെയോ അഭാവം സൂചിപ്പിക്കുന്ന മൂലപദത്തിന്റെ കാഠിന്യം മൃദൂകരിക്കാതെ നാമരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀνωφελές
  choice: പ്രയോജനമില്ലായ്മ
  rationale: ഉപകാരമോ പ്രയോജനമോ ഇല്ലാത്ത അവസ്ഥയെ നേരിട്ട് സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ ഇത് പരിപൂർണത കൈവരുത്താനുള്ള അപ്രാപ്തിയെ സംബന്ധിക്കുന്നുവെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: മുമ്പുണ്ടായിരുന്ന കല്പനയെക്കുറിച്ചുള്ള വിമർശനത്തിന്റെ പരിധി
  choice: കല്പനയുടെ ‘ബലഹീനതയും പ്രയോജനമില്ലായ്മയും’ എന്ന ശക്തമായ ഭാഷ അതേപടി നിലനിർത്തി; സന്ദർഭപരമായ പരിധി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: മോശൈക ന്യായപ്രമാണം മുഴുവനും എല്ലാ അർഥത്തിലും വിലയില്ലാത്തതാണെന്ന വിശാല വായന; അല്ലെങ്കിൽ വാക്യത്തിലെ യഥാർഥ നിഷേധാത്മക വിലയിരുത്തൽ മൃദൂകരിക്കുന്ന വായന.
  rationale: എബ്രായർ 7:11, 19 എന്നിവയിലെ അടുത്ത സന്ദർഭം മുൻ പുരോഹിതക്രമത്തിന് പരിപൂർണത കൈവരുത്താൻ കഴിയാത്തതിനെക്കുറിച്ചാണ്. അതിനാൽ മൂലവാക്യത്തിന്റെ തീക്ഷ്ണത നിലനിർത്തുകയും, ദൈവത്തിന്റെ മുൻ വെളിപ്പാട് സ്വതവേ ദോഷകരമായിരുന്നുവെന്ന അധിക നിഗമനം ഒഴിവാക്കുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലത്തിലെ ശക്തമായ വിലയിരുത്തൽ സംരക്ഷിച്ചിരിക്കുന്നു; എന്നാൽ സന്ദർഭത്തിന് അതീതമായ സഭാവിഭാഗപരമായ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ മുഖ്യപാഠത്തിൽ ക്രമമായി നൽകിയിരിക്കുന്നു.
