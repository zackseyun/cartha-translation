id: HEB.7.3
reference: Hebrews 7:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπάτωρ, ἀμήτωρ, ἀγενεαλόγητος, μήτε ἀρχὴν ἡμερῶν μήτε ζωῆς τέλος ἔχων, ἀφωμοιωμένος δὲ τῷ υἱῷ τοῦ θεοῦ, μένει ἱερεὺς εἰς τὸ διηνεκές.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/003.yaml
  text: without father[a], without mother, without genealogy, having neither beginning of days nor end of life, but being made like the Son of God[b], he remains a priest perpetually.
translation:
  language: ml
  text: പിതാവോ മാതാവോ വംശാവലിയോ ഇല്ലാത്തവൻ, ദിവസങ്ങളുടെ ആരംഭമോ ജീവന്റെ അവസാനമോ ഇല്ലാത്തവൻ[a], എന്നാൽ ദൈവപുത്രനോടു സദൃശനാക്കപ്പെട്ടവനായി, അവൻ എക്കാലവും പുരോഹിതനായി നിലനിൽക്കുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “രേഖപ്പെടുത്തിയ വംശാവലിയില്ലാത്തവൻ.” ഉല്പത്തിപ്പുസ്തകം മെൽക്കീസേദെക്കിന്റെ വംശാവലി രേഖപ്പെടുത്തുന്നില്ല; എബ്രായർക്കുള്ള ലേഖനം ഈ നിശ്ശബ്ദതയെ പ്രതിരൂപപരമായി ഉപയോഗിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “നിരന്തരം” അല്ലെങ്കിൽ “എന്നേക്കും.” തിരുവെഴുത്തിൽ അവതരിപ്പിക്കപ്പെട്ടിരിക്കുന്ന അവന്റെ പുരോഹിതത്വത്തിന്റെ നിലനിൽക്കുന്ന സ്വഭാവത്തെയാണ് ഈ പ്രയോഗം ഊന്നുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπάτωρ, ἀμήτωρ
  choice: പിതാവില്ലാത്തവനും മാതാവില്ലാത്തവനും
  rationale: ഗ്രീക്കിലെ സമാന്തരമായ നിഷേധവിശേഷണങ്ങളുടെ നേരിട്ടുള്ള ശക്തിയും ഔന്നത്യവും നിലനിർത്തുന്നു; യഥാർഥ മാതാപിതാക്കളില്ലെന്ന വ്യാഖ്യാനം നിർബന്ധമാക്കാതെ രേഖയിലെ നിശ്ശബ്ദതയെക്കുറിച്ചുള്ള സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀγενεαλόγητος
  choice: വംശാവലിയില്ലാത്തവനും
  rationale: വംശാവലിയോ അതിന്റെ രേഖയോ ഇല്ലാത്തത് എന്ന ഗ്രീക്ക് പദത്തിന്റെ അർഥം സംക്ഷിപ്തമായി നൽകുന്നു. ‘രേഖപ്പെടുത്തിയ വംശാവലി’ എന്ന സന്ദർഭപരമായ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: μήτε ἀρχὴν ἡμερῶν μήτε ζωῆς τέλος ἔχων
  choice: ദിവസങ്ങളുടെ ആരംഭമോ ജീവന്റെ അവസാനമോ ഇല്ലാത്തവനും
  rationale: ഇരട്ട നിഷേധവും ‘ദിവസങ്ങളുടെ ആരംഭം/ജീവന്റെ അവസാനം’ എന്ന ഉയർന്ന ശൈലിയിലുള്ള സമാന്തരതയും നിലനിർത്തുന്നു.
- source_word: ἀφωμοιωμένος
  choice: സദൃശനാക്കപ്പെട്ടവനുമായി
  rationale: പൂർണ്ണകാല കർമണിപ്രയോഗത്തിന്റെ ഭാവം സംരക്ഷിക്കുകയും മെൽക്കീസേദെക്കും പുത്രനും തമ്മിൽ ഐക്യതയല്ല, സാദൃശ്യമാണെന്ന് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: τῷ υἱῷ τοῦ θεοῦ
  choice: ദൈവപുത്രനോടു
  rationale: പരിചിതവും ഗൗരവമുള്ളതുമായ ക്രിസ്തുശാസ്ത്രപരമായ സ്ഥാനപ്പേര് സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: μένει ἱερεὺς
  choice: പുരോഹിതനായി നിലനിൽക്കുന്നു
  rationale: μένει സൂചിപ്പിക്കുന്ന തുടർന്നുനിൽക്കുന്ന അവസ്ഥയും ἱερεύς എന്ന പദത്തിന്റെ അടിസ്ഥാനാർഥവും സ്വാഭാവികമായി പകർത്തുന്നു.
- source_word: εἰς τὸ διηνεκές
  choice: എക്കാലവും
  rationale: തുടർച്ചയും സ്ഥിരതയും ഊന്നുന്ന പ്രയോഗം; സന്ദർഭം ആവശ്യപ്പെടുന്നതിലപ്പുറം തത്ത്വമീമാംസാപരമായ അവകാശവാദം നിർബന്ധമാക്കാതെ ദീർഘകാലികത പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: മെൽക്കീസേദെക്ക് അക്ഷരാർഥത്തിൽ മാതാപിതാക്കളില്ലാത്തവനും നിത്യജീവിയുമാണോ, അതോ തിരുവെഴുത്തിലെ അവതരണത്തിൽ അങ്ങനെ പ്രത്യക്ഷപ്പെടുന്ന പ്രതിരൂപമാണോ
  choice: മൂലവാക്യത്തിലെ ശക്തമായ വിശേഷണങ്ങൾ മുഖ്യപാഠത്തിൽ അതേപടി സംരക്ഷിച്ചു; ‘ദൈവപുത്രനോടു സദൃശനാക്കപ്പെട്ടവൻ’ എന്ന കർമണിപ്രയോഗത്തിലൂടെ പ്രതിരൂപപരമായ താരതമ്യം നിലനിർത്തി.
  alternative: മെൽക്കീസേദെക്ക് പുത്രന്റെ അവതാരപൂർവ പ്രത്യക്ഷതയാണ്, അല്ലെങ്കിൽ സ്വന്തം അസ്തിത്വത്തിൽ അക്ഷരാർഥത്തിൽ മാതാപിതാക്കളില്ലാത്തവനും നിത്യനുമാണ് എന്ന വായന.
  rationale: ἀφωμοιωμένος പുത്രനോടുള്ള സാദൃശ്യം സൂചിപ്പിക്കുന്നു, പുത്രനുമായുള്ള ഐക്യതയല്ല. അതേസമയം ഉല്പത്തിവിവരണത്തിലെ വംശാവലി-മരണ രേഖകളുടെ അഭാവത്തിൽ അധിഷ്ഠിതമായ എബ്രായലേഖനത്തിന്റെ വാദം വിവർത്തനം വിശദീകരിച്ച് ഇല്ലാതാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള തിരുവെഴുത്തുശൈലി. ഗ്രീക്കിലെ നിരനിരയായ വിശേഷണങ്ങളും സമാന്തര ഘടനയും നിലനിർത്തിയെങ്കിലും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പദങ്ങൾ ഉപയോഗിച്ചു. ഇംഗ്ലീഷ് പാളിയിലെ [b] ചിഹ്നം അർഥപരമായി യോജിക്കുന്ന εἰς τὸ διηνεκές എന്ന പ്രയോഗത്തോടു ചേർത്തു.
