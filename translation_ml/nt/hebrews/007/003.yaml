revisions:
- from: പിതാവില്ലാത്തവനും മാതാവില്ലാത്തവനും വംശാവലിയില്ലാത്തവനും[a], ദിവസങ്ങളുടെ ആരംഭമോ ജീവന്റെ അവസാനമോ ഇല്ലാത്തവനും, എന്നാൽ ദൈവപുത്രനോടു സദൃശനാക്കപ്പെട്ടവനുമായി, അവൻ എക്കാലവും[b] പുരോഹിതനായി നിലനിൽക്കുന്നു.
