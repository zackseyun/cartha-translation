source:
  edition: SBLGNT
  text: καὶ ⸂δι’ αὐτὴν⸃ ὀφείλει, καθὼς περὶ τοῦ λαοῦ, οὕτως καὶ περὶ ⸀αὑτοῦ προσφέρειν ⸀περὶ ἁμαρτιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/003.yaml
  text: And because of this he is obligated[a], just as for the people, so also for himself, to offer for sins.
translation:
  language: ml
  text: ഈ ബലഹീനത നിമിത്തം[a], ജനത്തിനുവേണ്ടി അർപ്പിക്കുന്നതുപോലെതന്നെ തനിക്കുവേണ്ടിയും പാപങ്ങൾക്കായി അർപ്പിക്കാൻ അവൻ ബാധ്യസ്ഥനാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘അതു നിമിത്തം’; മുൻവാക്യത്തിൽ പറഞ്ഞ മഹാപുരോഹിതന്റെ ബലഹീനതയെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ αὐτὴν
  choice: ഈ ബലഹീനത നിമിത്തം
  rationale: സ്ത്രീലിംഗ സർവനാമമായ αὐτήν മുൻവാക്യത്തിലെ ἀσθένεια (‘ബലഹീനത’)യെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ വെറും ‘ഇതു നിമിത്തം’ എന്നു പറഞ്ഞാൽ ബന്ധം അസ്പഷ്ടമാകുന്നതിനാൽ സൂചിത പദം ചേർത്ത് സ്വാഭാവികമാക്കി; അടിക്കുറിപ്പിൽ അക്ഷരാർഥം രേഖപ്പെടുത്തി.
- source_word: ὀφείλει
  choice: ബാധ്യസ്ഥനാണ്
  rationale: ഇത് വെറും ഉചിതത്വമല്ല, മഹാപുരോഹിതനുമേലുള്ള കടമയോ നിർബന്ധമോ ആണെന്ന ആശയം വ്യക്തമാക്കുന്നു.
- source_word: καθὼς ... οὕτως καὶ
  choice: എന്നതുപോലെതന്നെ ... -യും
  rationale: ഗ്രീക്കിലെ പരസ്പരബന്ധമുള്ള താരതമ്യഘടന സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τοῦ λαοῦ
  choice: ജനത്തിനുവേണ്ടി
  rationale: ലേവ്യ മഹാപുരോഹിതന്റെ പശ്ചാത്തലത്തിൽ ഉടമ്പടിജനത്തെ സൂചിപ്പിക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘ഇസ്രായേൽ’ എന്ന വിശദീകരണം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: περὶ αὑτοῦ
  choice: തനിക്കുവേണ്ടിയും
  rationale: പ്രതിഫലക അർഥവും ജനത്തിനുവേണ്ടി/തനിക്കുവേണ്ടി എന്ന സമാന്തരതയും വ്യക്തമായി നൽകുന്നു.
- source_word: προσφέρειν περὶ ἁμαρτιῶν
  choice: പാപങ്ങൾക്കായി അർപ്പിക്കാൻ
  rationale: മൂലവാക്യത്തിൽ അർപ്പിക്കപ്പെടുന്ന വസ്തുവിന്റെ വ്യക്തമായ കർമമില്ല; അതിനാൽ ‘യാഗങ്ങൾ’ എന്നു മുഖ്യപാഠത്തിൽ കൂട്ടിച്ചേർക്കാതെ, യാഗസന്ദർഭത്തിലെ ‘അർപ്പിക്കുക’ എന്ന ക്രിയ നിലനിർത്തി.
theological_decisions:
- issue: δι’ αὐτὴν എന്നതിന്റെ പൂർവപദം
  choice: മുൻവാക്യത്തിൽ പറഞ്ഞ മഹാപുരോഹിതന്റെ ബലഹീനത
  alternative: പുരോഹിതപദവിയെയോ സാഹചര്യത്തെയോ പൊതുവായി സൂചിപ്പിക്കുന്നു
  rationale: ഏറ്റവും അടുത്ത സ്ത്രീലിംഗ പൂർവപദം 5:2-ലെ ἀσθένεια ആണ്; ജനത്തിനുവേണ്ടി മാത്രമല്ല തനിക്കുവേണ്ടിയും അർപ്പിക്കേണ്ടതിന്റെ കാരണമായി ഇതു വാദത്തിന്റെ ഒഴുക്കിനോട് യോജിക്കുന്നു.
- issue: προσφέρειν എന്ന ക്രിയയ്ക്ക് കർമം ചേർക്കണമോ
  choice: വ്യക്തമായ കർമം ചേർക്കാതെ ‘അർപ്പിക്കാൻ’
  alternative: ‘യാഗങ്ങൾ അർപ്പിക്കാൻ’
  rationale: യാഗാർപ്പണം സന്ദർഭത്തിൽ വ്യക്തമായിരുന്നാലും ഈ വാക്യത്തിലെ ഗ്രീക്കിൽ ‘യാഗങ്ങൾ’ എന്ന കർമം ഇല്ല. അർഥം അനാവശ്യമായി നിർണ്ണയിക്കാതിരിക്കാനായി മൂലത്തിന്റെ സംക്ഷിപ്തത സംരക്ഷിച്ചു.
- issue: περὶ ἁμαρτιῶν എന്നതിന്റെ പരിഭാഷ
  choice: പാപങ്ങൾക്കായി
  alternative: പാപയാഗമായി / പാപങ്ങളെക്കുറിച്ച്
  rationale: യാഗസന്ദർഭത്തിലെ ബന്ധം സ്വാഭാവികമായി അറിയിക്കുന്നു; ‘പാപയാഗമായി’ എന്നത് ഗ്രീക്ക് നിർമാണത്തെക്കാൾ കൂടുതൽ പ്രത്യേകീകരിക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. പുരോഹിതകടമയുടെ നിർബന്ധസ്വഭാവം ‘ബാധ്യസ്ഥനാണ്’ എന്നതിലൂടെ നൽകി; ഗ്രീക്കിലെ ജനത്തിനുവേണ്ടി/തനിക്കുവേണ്ടി എന്ന സമാന്തര ഘടന സംരക്ഷിച്ചു.
