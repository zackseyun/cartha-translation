source:
  edition: SBLGNT
  text: καὶ οὐχ ἑαυτῷ τις λαμβάνει τὴν τιμήν, ἀλλὰ καλούμενος ὑπὸ τοῦ θεοῦ, ⸀καθώσπερ καὶ Ἀαρών.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/004.yaml
  text: And no one takes this honor for himself[a], but is called by God, just as Aaron also was.
translation:
  language: ml
  text: ആരും ഈ ബഹുമതി[a] സ്വയം ഏറ്റെടുക്കുന്നില്ല; മറിച്ച്, അഹരോനെപ്പോലെ ദൈവത്താൽ വിളിക്കപ്പെട്ടവൻ അത് ഏറ്റെടുക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “ബഹുമതി.” സന്ദർഭത്തിൽ ഇത് പുരോഹിതസ്ഥാനത്തിന്റെ മാന്യതയെയോ പദവിയെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: τις (οὐχ ... τις)
  choice: ആരും ... ഇല്ല
  rationale: നിഷേധത്തോടുകൂടിയ അനിശ്ചിത സർവനാമത്തെ സ്വാഭാവികമായ സാർവത്രിക നിഷേധമായി മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἑαυτῷ
  choice: സ്വയം
  rationale: ബഹുമതിയോ പദവിയോ ഒരാൾ തനിക്കായി കൈക്കൊള്ളുന്നു എന്ന സ്വയം-ഏറ്റെടുക്കലിന്റെ ആശയം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: λαμβάνει
  choice: ഏറ്റെടുക്കുന്നു
  rationale: ‘സ്വീകരിക്കുന്നു’ എന്നതിനെക്കാൾ, ദൈവിക വിളിക്കു വിരുദ്ധമായി സ്വയം അവകാശപ്പെടുകയോ കൈക്കൊള്ളുകയോ ചെയ്യുന്ന ആശയം ഇവിടെ വ്യക്തമായി നൽകുന്നു.
- source_word: τὴν τιμήν
  choice: ഈ ബഹുമതി
  rationale: τιμήയുടെ നേരിട്ടുള്ള അർഥമായ ‘ബഹുമതി’ നിലനിർത്തുകയും മുൻസന്ദർഭത്തിലെ മഹാപുരോഹിതപദവിയിലേക്കുള്ള സൂചന ‘ഈ’ എന്നതിലൂടെ സ്വാഭാവികമായി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: καλούμενος ὑπὸ τοῦ θεοῦ
  choice: ദൈവത്താൽ വിളിക്കപ്പെടുന്നവൻ
  rationale: ദൈവം വിളിയുടെ കർത്താവാണെന്ന നിഷ്ക്രിയപ്രയോഗവും വിളിക്കപ്പെട്ട നിലയുമാണ് ഇത് സംരക്ഷിക്കുന്നത്.
- source_word: καθώσπερ καὶ Ἀαρών
  choice: അഹരോനെപ്പോലെ
  rationale: അഹരോനും ദൈവത്താൽ വിളിക്കപ്പെട്ടു എന്ന ഗ്രീക്കിലെ സംക്ഷിപ്ത താരതമ്യം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: പുരോഹിതബഹുമതിയുടെ നിയമനം
  choice: ഈ ബഹുമതി സ്വയം ഏറ്റെടുക്കുന്നതല്ല; ദൈവത്താൽ വിളിക്കപ്പെട്ടവനാണ് അത് ഏറ്റെടുക്കുന്നത്, അഹരോൻ അതിന്റെ മാതൃകയാണ്.
  alternative: ഇത് പുരോഹിതപദവിയെക്കാൾ പൊതുവായ ബഹുമതിയെക്കുറിച്ചുള്ള പ്രസ്താവനയായി വായിക്കാം.
  rationale: എബ്രായർ 5:1–5-ലെ ഉടൻസന്ദർഭം മഹാപുരോഹിതപദവിയെക്കുറിച്ചുള്ളതാണ്. എങ്കിലും τιμήയെ നേരിട്ട് ‘പദവി’ എന്നു മാറ്റാതെ ‘ബഹുമതി’ എന്നു നിലനിർത്തുന്നത് പദത്തിന്റെ വിശാലതയും സന്ദർഭസൂചനയും ഒരുപോലെ സംരക്ഷിക്കുന്നു.
- issue: ഗ്രീക്ക് വാക്യത്തിലെ സംക്ഷിപ്തത
  choice: ‘അത് ഏറ്റെടുക്കുന്നത്’ എന്ന് സന്ദർഭത്തിൽനിന്ന് ആവർത്തിച്ച് ചേർത്ത് ബന്ധം വ്യക്തമാക്കുന്നു.
  alternative: ‘മറിച്ച്, ദൈവത്താൽ വിളിക്കപ്പെടുന്നു’ എന്ന സംക്ഷിപ്ത രൂപം മാത്രം ഉപയോഗിക്കാം.
  rationale: ഗ്രീക്കിൽ ἀλλάയ്ക്ക് ശേഷം മുഖ്യക്രിയ ആവർത്തിക്കാതെ participle ഉപയോഗിക്കുന്നു. അതേ സംക്ഷിപ്തത മലയാളത്തിൽ നിലനിർത്തിയാൽ ആശയബന്ധം അസ്പഷ്ടമാകുന്നതിനാൽ, പുതിയ ദൈവശാസ്ത്രവിവരം ചേർക്കാതെ മുൻക്രിയ ആവർത്തിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘മഹാപുരോഹിതപദവി’ എന്ന് മുഖ്യവാക്യത്തിൽ വിശദീകരിച്ച് മൂലപദത്തിന്റെ അർഥപരിധി ചുരുക്കാതെ, സന്ദർഭവ്യക്തത അടിക്കുറിപ്പിൽ നൽകുന്നു.
