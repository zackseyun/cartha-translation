  to: ഇത്ര കാലമായതിനാൽ നിങ്ങൾ അധ്യാപകരായിരിക്കേണ്ടവരാണ്; എന്നിട്ടും ദൈവത്തിന്റെ അരുളപ്പാടുകളുടെ ആരംഭത്തിലെ അടിസ്ഥാനഘടകങ്ങൾ എന്തൊക്കെയാണെന്ന് ഒരാൾ നിങ്ങളെ വീണ്ടും പഠിപ്പിക്കേണ്ട ആവശ്യം നിങ്ങൾക്കുണ്ട്. കട്ടിയായ ആഹാരമല്ല, പാലിന്റെ ആവശ്യമുള്ളവരായിത്തീർന്നിരിക്കുന്നു നിങ്ങൾ.
