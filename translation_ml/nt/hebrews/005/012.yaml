id: HEB.5.12
reference: Hebrews 5:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ γὰρ ὀφείλοντες εἶναι διδάσκαλοι διὰ τὸν χρόνον, πάλιν χρείαν ἔχετε τοῦ διδάσκειν ὑμᾶς ⸀τινὰ τὰ στοιχεῖα τῆς ἀρχῆς τῶν λογίων τοῦ θεοῦ, καὶ γεγόνατε χρείαν ἔχοντες γάλακτος, ⸀οὐ στερεᾶς τροφῆς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/012.yaml
  text: For although by this time you ought to be teachers[a], you again need someone to teach you the basic elements of the beginning of the oracles of God, and you have come to need milk[b], not solid food.
translation:
  language: ml
  text: ഇത്ര കാലമായതിനാൽ നിങ്ങൾ അധ്യാപകരായിരിക്കേണ്ടവരാണ്; എന്നിട്ടും ദൈവത്തിന്റെ അരുളപ്പാടുകളുടെ ആരംഭത്തിലെ അടിസ്ഥാനഘടകങ്ങൾ എന്തൊക്കെയാണെന്ന് ഒരാൾ നിങ്ങളെ വീണ്ടും പഠിപ്പിക്കേണ്ട ആവശ്യം നിങ്ങൾക്കുണ്ട്. കട്ടിയായ ആഹാരമല്ല, പാലിന്റെ ആവശ്യമുള്ളവരായിത്തീർന്നിരിക്കുന്നു നിങ്ങൾ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀφείλοντες εἶναι διδάσκαλοι
  choice: നിങ്ങൾ ഉപദേഷ്ടാക്കളായിരിക്കേണ്ടവരാണ്
  rationale: പ്രതീക്ഷിക്കപ്പെടുന്ന ബാധ്യതയെ സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു; διδάσκαλοι എന്നത് മറ്റുള്ളവരെ പഠിപ്പിക്കുന്നവരെ സൂചിപ്പിക്കുന്നു.
- source_word: διὰ τὸν χρόνον
  choice: ഇത്ര കാലമായതിനാൽ
  rationale: കടന്നുപോയ കാലത്തിന്റെ ദൈർഘ്യം മൂലം പക്വത പ്രതീക്ഷിക്കപ്പെട്ടിരുന്നു എന്ന ആശയം വ്യക്തമാക്കുന്നു.
- source_word: πάλιν χρείαν ἔχετε τοῦ διδάσκειν ὑμᾶς
  choice: ഒരാൾ നിങ്ങളെ വീണ്ടും പഠിപ്പിക്കേണ്ടിയിരിക്കുന്നു
  rationale: ഗ്രീക്കിലെ ആവശ്യകതയും ആവർത്തനമോ പിന്നോട്ടുപോക്കോ സൂചിപ്പിക്കുന്ന πάλιν എന്ന പദവും സ്വാഭാവികമായി നിലനിർത്തുന്നു; പഠിപ്പിക്കുന്ന വ്യക്തി മൂലപാഠത്തിൽ പരോക്ഷമാണ്.
- source_word: τινὰ τὰ στοιχεῖα τῆς ἀρχῆς
  choice: പ്രാരംഭപാഠങ്ങളായ അടിസ്ഥാനഘടകങ്ങൾ ഏതൊക്കെയെന്ന്
  rationale: τινάയെ ചോദനാർത്ഥത്തിൽ എടുത്ത് ‘ഏതൊക്കെയെന്ന്’ എന്നു നൽകുന്നു; στοιχεῖα, ἀρχή എന്നിവയിലെ അടിസ്ഥാനപരവും ആരംഭഘട്ടത്തിലുമുള്ള ഉപദേശത്തിന്റെ ആശയം നിലനിർത്തുന്നു.
- source_word: τῶν λογίων τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ അരുളപ്പാടുകൾ
  rationale: λόγια സാധാരണ വാക്കുകളെയല്ല, ദൈവികമായി അരുളിച്ചെയ്ത വചനങ്ങളെയോ വെളിപ്പാടുകളെയോ സൂചിപ്പിക്കുന്നതിനാൽ മാന്യവും ഗ്രാഹ്യവുമായ പദം തെരഞ്ഞെടുത്തു.
- source_word: γεγόνατε χρείαν ἔχοντες
  choice: നിങ്ങൾക്ക് ആവശ്യമായിത്തീർന്നിരിക്കുന്നു
  rationale: ഒരു അവസ്ഥയിലേക്കെത്തി ഇപ്പോഴും അതിൽ തുടരുന്നതിനെ സൂചിപ്പിക്കുന്ന perfect രൂപത്തിന്റെ ഫലം മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: γάλακτος, οὐ στερεᾶς τροφῆς
  choice: കട്ടിയായ ആഹാരമല്ല, പാലാണ്
  rationale: ആത്മീയ അപക്വതയും പക്വതയും സൂചിപ്പിക്കുന്ന മൂലരൂപകം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ അതേപടി നിലനിർത്തുന്നു.
theological_decisions:
- issue: പാലും കട്ടിയായ ആഹാരവും തമ്മിലുള്ള രൂപകവൈരുധ്യം
  choice: ആത്മീയ പഠനത്തിലെ അപക്വതയും പക്വതയും സൂചിപ്പിക്കുന്ന രൂപകം വിശദീകരണപരമായ പുനർവാചകമില്ലാതെ നിലനിർത്തി.
  alternative: ‘പ്രാഥമിക ഉപദേശം’, ‘ഉന്നത ഉപദേശം’ എന്നിങ്ങനെ രൂപകം നേരിട്ട് വ്യാഖ്യാനിക്കുക.
  rationale: വാക്യം പ്രത്യേകമായ ഒരു മതപഠനപദ്ധതി നിർവചിക്കുന്നില്ല; അതിനാൽ രൂപകത്തിന്റെ പ്രസംഗശക്തിയും ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും സംരക്ഷിക്കുന്നു.
- issue: τινὰ എന്ന പദത്തിന്റെ വ്യാകരണസാധ്യത
  choice: ‘ഏതൊക്കെയെന്ന്’ എന്ന ചോദനാർത്ഥ വായന സ്വീകരിച്ചു.
  alternative: ‘ചില അടിസ്ഥാനഘടകങ്ങൾ’ എന്ന അനിശ്ചിത സർവനാമ വായന.
  rationale: സന്ദർഭത്തിലും സാധാരണ ഗ്രീക്ക് ഘടനയിലും ‘അടിസ്ഥാനഘടകങ്ങൾ എന്തൊക്കെയെന്ന് പഠിപ്പിക്കുക’ എന്ന വായന സ്വാഭാവികമാണ്; മറുവായന അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായും ഗ്രാഹ്യവുമായ ശൈലി. ‘അരുളപ്പാടുകൾ’ എന്ന പദം λόγιαയുടെ ദൈവിക ഉച്ചാരണസ്വഭാവം നിലനിർത്തുന്നു; ‘ഉപദേഷ്ടാക്കൾ’ സഭാപദവിയെ നിർബന്ധമായി സൂചിപ്പിക്കാതെ പഠിപ്പിക്കുന്നവരെ വ്യക്തമാക്കുന്നു. ഇംഗ്ലീഷ് ഉപദേശപാളിയിലെ അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവയുടെ യഥാർത്ഥ വിഷയങ്ങളോടു ചേർത്താണ് മുഖ്യവാചകത്തിൽ സ്ഥാപിച്ചത്.
