lexical_decisions:
- source_word: καίπερ
  choice: ആയിരുന്നിട്ടും
  rationale: 'വാക്യത്തിലെ വിട്ടുവീഴ്ചാസൂചകമായ വൈരുധ്യം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു: പുത്രനായിരുന്നിട്ടും അവൻ കഷ്ടങ്ങളിലൂടെ അനുസരണം പഠിച്ചു.'
- source_word: ὢν υἱός
  choice: അവൻ പുത്രനായിരുന്നിട്ടും
  rationale: ὢν എന്ന വർത്തമാന കൃദന്തരൂപത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ ഉപവാക്യമാക്കി. υἱός എന്നതിന് ഗ്രീക്കിൽ നിർദേശക ഉപപദമില്ല; മലയാളത്തിൽ ‘പുത്രൻ’ എന്നു പറയുന്നത് ആ അവ്യക്തത നിലനിർത്തുന്നു.
- source_word: ἔμαθεν
  choice: പഠിച്ചു
  rationale: μανθάνω എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; വാക്യത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം വ്യാഖ്യാനിച്ച് മയപ്പെടുത്തുന്നില്ല.
- source_word: ἀφ’ ὧν
  choice: താൻ സഹിച്ച കഷ്ടങ്ങളിൽനിന്ന്
  rationale: ἀπό സൂചിപ്പിക്കുന്ന ഉറവിടമോ അനുഭവപരമായ അടിസ്ഥാനമോ ‘-യിൽനിന്ന്’ എന്ന രൂപം നിലനിർത്തുന്നു. നപുംസക ബഹുവചനബന്ധസർവനാമത്തിന്റെ ആശയം സ്വാഭാവികമാക്കാൻ ‘കഷ്ടങ്ങൾ’ ചേർത്തിരിക്കുന്നു.
- source_word: ἔπαθεν
  choice: സഹിച്ച
  rationale: πάσχω സൂചിപ്പിക്കുന്ന യഥാർഥ കഷ്ടാനുഭവത്തെ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: τὴν ὑπακοήν
  choice: അനുസരണം
  rationale: ദൈവഹിതത്തോടുള്ള അനുസരണത്തെ സൂചിപ്പിക്കുന്നു. അമൂർത്തനാമത്തോടുകൂടിയ ഗ്രീക്ക് നിർദേശക ഉപപദം മലയാളത്തിൽ പ്രത്യേകം വിവർത്തനം ചെയ്യേണ്ടതില്ല.
theological_decisions:
- issue: കഷ്ടങ്ങളിലൂടെ പഠിക്കുന്നതുമായി ക്രിസ്തുവിന്റെ പുത്രത്വത്തിനുള്ള ബന്ധം
  choice: അവൻ പുത്രനായിരുന്നിട്ടും
  alternative: അവൻ ആ പുത്രനായിരുന്നിട്ടും
  rationale: ഗ്രീക്കിലെ υἱός നിർദേശക ഉപപദമില്ലാത്ത വിധേയനാമമാണ്. ‘പുത്രൻ’ എന്ന രൂപം യേശുവിന്റെ പുത്രത്വം ഉറപ്പിക്കുമ്പോഴും ഗ്രീക്ക് വ്യാകരണത്തിൽ ഇല്ലാത്ത വ്യക്തനിർദേശം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
- issue: ‘അനുസരണം പഠിച്ചു’ എന്നത് മുമ്പുണ്ടായിരുന്ന അനുസരണക്കേടിനെ സൂചിപ്പിക്കുന്നുണ്ടോ
  choice: നേരിട്ടുള്ള ‘അനുസരണം പഠിച്ചു’ എന്ന പ്രയോഗം നിലനിർത്തി
  alternative: അനുസരണത്തിന്റെ വില അനുഭവിച്ചറിഞ്ഞു
  rationale: മൂലപാഠം അനുഭവത്തിലൂടെയുള്ള യഥാർഥ പഠനത്തെ പ്രസ്താവിക്കുന്നു. മുൻകാല അനുസരണക്കേടോ ധാർമികക്കുറവോ തിരുത്തിയെന്നു അത് നിർബന്ധമായി പറയുന്നില്ല; അതേസമയം ഈ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഭാഷയിൽ വ്യാഖ്യാനിച്ച് നീക്കരുത്.
