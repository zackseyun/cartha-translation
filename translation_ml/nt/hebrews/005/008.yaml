  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കഷ്ടങ്ങളിൽനിന്ന്’ എന്ന രൂപം മൂലത്തിലെ ഉറവിടസൂചന നിലനിർത്തുന്നു; ‘അനുസരണം പഠിച്ചു’ എന്ന നേരിട്ടുള്ള വാചകം ദൈവശാസ്ത്രപരമായ സംഘർഷം സംരക്ഷിക്കുന്നു.
