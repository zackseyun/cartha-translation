  text: τελείων δέ ἐστιν ἡ στερεὰ τροφή, τῶν διὰ τὴν ἕξιν τὰ αἰσθητήρια γεγυμνασμένα ἐχόντων πρὸς διάκρισιν καλοῦ τε καὶ κακοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/014.yaml
  text: But solid food is for the mature[b][a], who because of practice have their powers of discernment trained to distinguish both good and evil.
translation:
  language: ml
  text: എന്നാൽ കട്ടിയാഹാരം പക്വതയുള്ളവർക്കുള്ളതാണ്; അഭ്യാസംമൂലം[b] നന്മയും തിന്മയും വിവേചിച്ചറിയുന്നതിനായി തങ്ങളുടെ വിവേചനശേഷികൾ[a] പരിശീലിപ്പിക്കപ്പെട്ടിരിക്കുന്നവർക്കാണ് അത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ “ഇന്ദ്രിയങ്ങൾ”; ഇവിടെ ആന്തരികമായി ഗ്രഹിക്കുകയും വിവേചിക്കുകയും ചെയ്യുന്ന ശേഷികളെയാണ് രൂപകമായി സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: “അഭ്യാസംമൂലം” എന്നതിന് “ശീലംമൂലം” അല്ലെങ്കിൽ “പതിവായ ഉപയോഗംമൂലം” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: τελείων
  choice: പക്വതയുള്ളവർ
  rationale: തൊട്ടുമുമ്പുള്ള ശിശുക്കളോടുള്ള വൈരുധ്യം നിലനിർത്തുകയും പാപരഹിതമായ പൂർണത എന്ന ആശയം അനാവശ്യമായി സൂചിപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: στερεὰ τροφή
  choice: കട്ടിയുള്ള ആഹാരം
  rationale: പാലിനോടു വൈരുധ്യമുള്ള, ചവച്ചുകഴിക്കേണ്ട ഭക്ഷണം എന്ന രൂപകം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: διὰ τὴν ἕξιν
  choice: അഭ്യാസംമൂലം
  rationale: ἕξις സൂചിപ്പിക്കുന്ന ആവർത്തിച്ചുള്ള പ്രയോഗം, ശീലം, അതിലൂടെ നേടിയ നില എന്നിവ സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τὰ αἰσθητήρια
  choice: വിവേചനശേഷികൾ
  rationale: അക്ഷരാർഥത്തിലെ ഇന്ദ്രിയങ്ങൾ ഇവിടെ ആന്തരിക ഗ്രഹണശേഷികളെ സൂചിപ്പിക്കുന്ന രൂപകമായതിനാൽ സന്ദർഭോചിതമായ അർഥം നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: γεγυμνασμένα ἐχόντων
  choice: പരിശീലിപ്പിക്കപ്പെട്ടവരാണ്
  rationale: പരിശീലനത്തിന്റെ ഫലമായി ഇപ്പോൾ നിലനിൽക്കുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്ന perfect passive ആശയം നിലനിർത്തുന്നു.
- source_word: πρὸς διάκρισιν
  choice: തിരിച്ചറിയാൻ
  rationale: πρός സഹിതമുള്ള διάκρισις സൂചിപ്പിക്കുന്ന ലക്ഷ്യം സ്വാഭാവികമായ മലയാളത്തിൽ നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: καλοῦ τε καὶ κακοῦ
  choice: നന്മയും തിന്മയും
  rationale: τε καὶ ബന്ധിപ്പിക്കുന്ന ഇരട്ട ഘടനയും ധാർമിക വിവേചനത്തിന്റെ പരിചിതമായ ബൈബിൾഭാഷയും നിലനിർത്തുന്നു.
- source_word: δέ
  choice: എന്നാൽ
  rationale: മുമ്പത്തെ വാക്യത്തിലെ പാലും ശിശുത്വവും സംബന്ധിച്ച പ്രസ്താവനയോടുള്ള വൈരുധ്യം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ആത്മീയ വളർച്ചയുടെ പശ്ചാത്തലത്തിൽ τελείων എന്നതിന്റെ അർഥം
  choice: പക്വതയുള്ളവർ
  alternative: പൂർണതയുള്ളവർ / മുതിർന്നവർ
  rationale: സന്ദർഭം ധാർമികമായി പാപരഹിതരായ ഒരു വിഭാഗത്തെക്കാൾ വിവേചനത്തിൽ വളർന്നവരെ ശിശുക്കളോടു താരതമ്യം ചെയ്യുന്നു. അതിനാൽ പക്വത എന്ന വായന ആശയത്തെ അനാവശ്യമായി സിദ്ധാന്തവൽക്കരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. മൂലത്തിലെ ആഹാരരൂപകം നിലനിർത്തി; നീണ്ട ഗ്രീക്ക് വാക്യഘടന വായനാസൗകര്യത്തിനായി രണ്ട് മലയാളവാക്യങ്ങളാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദപ്രയോഗങ്ങൾക്ക് പിന്നാലെ പ്രധാനപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
