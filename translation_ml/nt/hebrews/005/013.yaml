id: HEB.5.13
reference: Hebrews 5:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πᾶς γὰρ ὁ μετέχων γάλακτος ἄπειρος λόγου δικαιοσύνης, νήπιος γάρ ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/013.yaml
  text: For everyone who partakes of milk is unskilled in the word of righteousness[b][a], for he is an infant.
translation:
  language: ml
  text: എന്തെന്നാൽ, പാൽ കുടിക്കുന്ന ഏവനും നീതിയുടെ വചനത്തിൽ[a][b] പരിചയമില്ലാത്തവനാണ്; കാരണം, അവൻ ശിശുവാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നീതിയെക്കുറിച്ചുള്ള സന്ദേശം” എന്നോ “നീതിയെക്കുറിച്ചുള്ള വചനം” എന്നോ വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: “നീതി” എന്നതിന് “ന്യായം” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς
  choice: ഏവനും
  rationale: വിവരിക്കുന്ന വിഭാഗത്തിലെ ഓരോ വ്യക്തിയെയും സൂചിപ്പിക്കുന്ന വിതരണാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὁ μετέχων
  choice: കുടിക്കുന്ന
  rationale: പാൽ ഉൾക്കൊള്ളുന്നയാളെ സൂചിപ്പിക്കുന്ന കർത്തൃവാചക വിശേഷണപ്രയോഗം ഭക്ഷണരൂപകം നിലനിർത്തി സ്വാഭാവികമായി നൽകുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘മാത്രം’ ചേർക്കുന്നില്ല.
- source_word: γάλακτος
  choice: പാൽ
  rationale: സന്ദർഭത്തിലെ ശിശുത്വത്തിന്റെയും ആത്മീയ പക്വതക്കുറവിന്റെയും രൂപകം അതേപടി നിലനിർത്തുന്നു.
- source_word: ἄπειρος
  choice: പരിചയമില്ലാത്തവൻ
  rationale: പൂർണമായ അജ്ഞത എന്നതിനെക്കാൾ അനുഭവമോ പ്രാവീണ്യമോ ഇല്ലാത്ത അവസ്ഥയാണ് പദം സൂചിപ്പിക്കുന്നത്.
- source_word: λόγου δικαιοσύνης
  choice: നീതിയുടെ വചനം
  rationale: ഗ്രീക്കിലെ സാന്ദ്രമായ ഷഷ്ഠീവിഭക്തിബന്ധവും അതിലെ വ്യാഖ്യാനസാധ്യതകളും ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: δικαιοσύνης
  choice: നീതി
  rationale: ദൈവസന്നിധിയിലെ ശരിത്വം, ധാർമിക നീതി, ന്യായം എന്നീ അർഥസാധ്യതകൾ ഉൾക്കൊള്ളാൻ കഴിയുന്ന പതിവ് മലയാള പദം; ‘ന്യായം’ അടിക്കുറിപ്പിൽ പര്യായമായി നൽകുന്നു.
- source_word: νήπιος
  choice: ശിശു
  rationale: പക്വതയില്ലായ്മയെ സൂചിപ്പിക്കുന്ന മൂർച്ചയുള്ള രൂപകം നിലനിർത്തുന്നു.
- source_word: γάρ
  choice: എന്തെന്നാൽ … കാരണം
  rationale: രണ്ടു പ്രയോഗങ്ങളുടെയും വിശദീകരണസ്വഭാവം മലയാളത്തിലെ സ്വാഭാവികമായ വ്യത്യസ്ത ബന്ധകങ്ങളിലൂടെ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: δικαιοσύνη എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: നീതി
  alternative: ന്യായം
  rationale: ഈ സന്ദർഭത്തിൽ ആത്മീയവും ധാർമികവുമായ ശരിത്വത്തെ സൂചിപ്പിക്കാൻ ‘നീതി’ യോജിക്കുന്നു; പദത്തിന്റെ ന്യായം/justice എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: λόγου δικαιοσύνης എന്ന ഷഷ്ഠീവിഭക്തിബന്ധം
  choice: നീതിയുടെ വചനം
  alternative: നീതിയെക്കുറിച്ചുള്ള സന്ദേശം; നീതിയെക്കുറിച്ചുള്ള വചനം
  rationale: വചനം നീതി നൽകുന്നതാണോ, നീതിയെക്കുറിച്ചുള്ളതാണോ, നീതിയാൽ വിശേഷിപ്പിക്കപ്പെടുന്നതാണോ എന്ന് മൂലപാഠം കൃത്യമായി നിർണയിക്കുന്നില്ല; പ്രധാനപാഠം ഈ തുറന്ന നില സംരക്ഷിക്കുന്നു.
- issue: νήπιος … ἐστιν എന്നതിലെ ലിംഗപ്രതിനിധാനം
  choice: അവൻ ശിശുവാണ്
  alternative: അങ്ങനെയുള്ളയാൾ ശിശുവാണ്
  rationale: ഗ്രീക്കിലെ വ്യാകരണപരമായ പുല്ലിംഗ ഏകവചനത്തെ ‘അവൻ’ പ്രതിഫലിപ്പിക്കുന്നു; ഇവിടെ അത് പൊതുവായ അർഥത്തിലാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. മുൻവാക്യത്തോടുള്ള വിശദീകരണബന്ധം ‘എന്തെന്നാൽ’ കൊണ്ടും വാക്യത്തിനുള്ളിലെ കാരണം ‘കാരണം’ കൊണ്ടും വ്യക്തമാക്കുന്നു. മൂലത്തിൽ ഇല്ലാത്ത ‘മാത്രം’ ചേർത്തിട്ടില്ല; λόγου δικαιοσύνης എന്ന പ്രയോഗത്തിന്റെ യഥാർഥ അനിശ്ചിതത്വം പ്രധാനപാഠത്തിലും അടിക്കുറിപ്പുകളിലും സംരക്ഷിച്ചിട്ടുണ്ട്.
