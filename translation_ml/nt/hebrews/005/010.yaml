  text: having been designated by God as a high priest according to the order of Melchizedek[a][b].
translation:
  language: ml
  text: മെൽക്കീസേദെക്കിന്റെ ക്രമപ്രകാരം മഹാപുരോഹിതനെന്നു ദൈവത്താൽ വിളിക്കപ്പെട്ടു[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘ദൈവത്താൽ മഹാപുരോഹിതനെന്നു പ്രഖ്യാപിക്കപ്പെട്ടു’ അല്ലെങ്കിൽ ‘ദൈവത്താൽ മഹാപുരോഹിതനായി നിയമിക്കപ്പെട്ടു.’'
    reason: lexical_alternative
  - marker: b
    text: ഇത് സങ്കീർത്തനം 110:4-നെ പ്രതിധ്വനിപ്പിക്കുന്നു; അവിടെ പുരോഹിതത്വത്തെ ‘മെൽക്കീസേദെക്കിന്റെ ക്രമപ്രകാരം’ എന്നു പറയുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: προσαγορευθεὶς
  choice: പ്രഖ്യാപിക്കപ്പെടുകയും ചെയ്തു
  rationale: προσαγορεύω എന്ന ക്രിയയുടെ aorist passive participle ദൈവം യേശുവിനെ മഹാപുരോഹിതനെന്ന് ഔപചാരികമായി വിളിക്കുകയോ പ്രഖ്യാപിക്കുകയോ ചെയ്തതിനെ സൂചിപ്പിക്കുന്നു. ‘പ്രഖ്യാപിക്കപ്പെട്ടു’ എന്നത് കർമണിപ്രയോഗവും ഔപചാരികമായ തിരിച്ചറിയിക്കലും നിലനിർത്തുന്നു; ‘നിയമിക്കപ്പെട്ടു’ എന്നതിലുണ്ടാകാവുന്ന സ്ഥാപനപരമായ അധിക അർഥം ഒഴിവാക്കുന്നു. മുൻവാക്യത്തോടുള്ള വ്യാകരണബന്ധം സ്വാഭാവികമാക്കാൻ ‘-ുകയും ചെയ്തു’ ഉപയോഗിച്ചു.
- source_word: ὑπὸ τοῦ θεοῦ
  choice: ദൈവത്താൽ
  rationale: കർമണിപ്രയോഗത്തിലെ പ്രവർത്തകനെ സൂചിപ്പിക്കുന്ന ὑπό + genitive കൃത്യമായി നൽകുന്നു. മൂലപാഠത്തിലില്ലാത്ത ‘പിതാവായ’ എന്ന വിശദീകരണം ചേർത്തിട്ടില്ല.
- source_word: ἀρχιερεὺς
  choice: മഹാപുരോഹിതൻ
  rationale: ἀρχιερεύς എന്ന പദത്തിന്റെ മലയാളത്തിലെ വ്യക്തവും പതിവുമായ സമാനപദമാണിത്.
- source_word: κατὰ
  choice: പ്രകാരം
  rationale: ഇവിടെ κατά അനുരൂപതയെയോ പൊരുത്തത്തെയോ സൂചിപ്പിക്കുന്നു; ‘പ്രകാരം’ മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: τὴν τάξιν
  choice: ക്രമം
  rationale: സങ്കീർത്തനം 110:4-ലേക്കുള്ള സൂചനയും എബ്രായലേഖനത്തിലെ പുരോഹിതത്വത്തിന്റെ മാതൃകയോ വിഭാഗമോ എന്ന ആശയവും നിലനിർത്തുന്ന പരമ്പരാഗതവും ഗ്രഹിക്കാവുന്നതുമായ പദം.
- source_word: Μελχισέδεκ
  choice: മെൽക്കീസേദെക്ക്
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം സ്വീകരിച്ചു; പേര് അർഥപരമായി വിവർത്തനം ചെയ്തിട്ടില്ല.
theological_decisions:
- issue: προσαγορευθεὶς എന്ന പദം പദവിയിലെ മാറ്റമോ ദൈവിക പ്രഖ്യാപനമോ സൂചിപ്പിക്കുന്നുവോ
  choice: മഹാപുരോഹിതനെന്നു ദൈവത്താൽ പ്രഖ്യാപിക്കപ്പെട്ടു
  alternative: മഹാപുരോഹിതനായി ദൈവത്താൽ നിയമിക്കപ്പെട്ടു / മഹാപുരോഹിതനെന്നു ദൈവത്താൽ വിളിക്കപ്പെട്ടു
  rationale: മൂലക്രിയ ദൈവികമായ വിളിക്കൽ, നാമകരണം, ഔപചാരിക പ്രഖ്യാപനം എന്നിവയ്ക്കിടയിൽ അർഥവ്യാപ്തിയുള്ളതാണ്. മുഖ്യപാഠത്തിലെ ‘പ്രഖ്യാപിക്കപ്പെട്ടു’ ദൈവത്തിന്റെ ഔപചാരിക തിരിച്ചറിയിക്കൽ നിലനിർത്തുന്നു; പദവിയിൽ അസ്തിത്വപരമായ മാറ്റമോ പ്രത്യേക സ്ഥാപനച്ചടങ്ങോ നിർബന്ധമായി വായിക്കുന്നില്ല. മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. വാക്യം മുൻവാക്യത്തിന്റെ തുടർച്ചയായതിനാൽ participle-ന്റെ ബന്ധം ‘-പ്പെടുകയും ചെയ്തു’ എന്ന രൂപത്തിൽ സ്വാഭാവികമാക്കി. ദൈവശാസ്ത്രപരമായ വ്യാഖ്യാനം മുഖ്യപാഠത്തിലേക്ക് ചേർക്കാതെ മൂലപാഠത്തിന്റെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
