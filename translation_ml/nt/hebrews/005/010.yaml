  naturalness: ‘മഹാപുരോഹിതനെന്നു ദൈവത്താൽ പ്രഖ്യാപിക്കപ്പെടുകയും ചെയ്തു’ is understandable, but its word order and ‘-ുകയും ചെയ്തു’ construction are less direct for this fragmentary verse. The revision is fluent modern standard Malayalam and works as a continuation of the preceding sentence.
