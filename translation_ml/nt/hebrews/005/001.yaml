id: HEB.5.1
reference: Hebrews 5:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Πᾶς γὰρ ἀρχιερεὺς ἐξ ἀνθρώπων λαμβανόμενος ὑπὲρ ἀνθρώπων καθίσταται τὰ πρὸς τὸν θεόν, ἵνα προσφέρῃ δῶρά τε καὶ θυσίας ὑπὲρ ἁμαρτιῶν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/001.yaml
  text: For every high priest[a], being taken from among men, is appointed on behalf of men in the things pertaining to God, so that he may offer both gifts and sacrifices for sins,
translation:
  language: ml
  text: എന്തെന്നാൽ, മനുഷ്യരിൽനിന്ന് എടുക്കപ്പെടുന്ന ഓരോ മഹാപുരോഹിതനും മനുഷ്യർക്കുവേണ്ടി ദൈവവുമായി ബന്ധപ്പെട്ട കാര്യങ്ങളിൽ, പാപങ്ങൾക്കുവേണ്ടി വഴിപാടുകളും യാഗങ്ങളും അർപ്പിക്കുന്നതിനായി നിയമിക്കപ്പെടുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πᾶς γὰρ ἀρχιερεὺς
  choice: എന്തെന്നാൽ ... ഓരോ മഹാപുരോഹിതനും
  rationale: Πᾶς എന്ന ഏകവചനവിതരണാർഥം ‘ഓരോ’ എന്ന് നൽകി; γὰρ മുൻവാദത്തിനുള്ള വിശദീകരണമെന്ന നിലയിൽ ‘എന്തെന്നാൽ’ എന്നും ἀρχιερεύς യഹൂദ പുരോഹിതപദവിയുടെ പതിവായ മലയാളരൂപമായ ‘മഹാപുരോഹിതൻ’ എന്നും വിവർത്തനം ചെയ്തു.
- source_word: ἐξ ἀνθρώπων λαμβανόμενος
  choice: മനുഷ്യരിൽനിന്ന് എടുക്കപ്പെടുന്ന
  rationale: വർത്തമാനകാല കർമണിപ്രയോഗത്തിലുള്ള participle-ന്റെ രൂപവും, മഹാപുരോഹിതൻ മനുഷ്യസമൂഹത്തിൽനിന്നുള്ളവനാണെന്ന ആശയവും നിലനിർത്തുന്നു. ഗ്രീക്ക് ἄνθρωπος ഇവിടെ മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കാനാകുന്നതിനാൽ സ്വാഭാവികമായ ‘മനുഷ്യർ’ തെരഞ്ഞെടുത്തു.
- source_word: ὑπὲρ ἀνθρώπων
  choice: മനുഷ്യർക്കുവേണ്ടി
  rationale: ὑπέρ പ്രതിനിധിത്വവും പ്രയോജനവും സൂചിപ്പിക്കുന്നു; ‘മനുഷ്യർക്കുവേണ്ടി’ മലയാളത്തിൽ ഈ മധ്യസ്ഥാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: καθίσταται τὰ πρὸς τὸν θεόν
  choice: ദൈവവുമായി ബന്ധപ്പെട്ട കാര്യങ്ങളിൽ നിയമിക്കപ്പെടുന്നത്
  rationale: καθίσταται ഒരു പദവിയിലേക്കുള്ള നിയമനം സൂചിപ്പിക്കുന്നു. τὰ πρὸς τὸν θεόν ദൈവാരാധനയും ദൈവസേവനവും സംബന്ധിച്ച കാര്യങ്ങളെ ഉൾക്കൊള്ളുന്ന ഇടിയമായതിനാൽ അതിന്റെ വിശാലത നിലനിർത്തി.
- source_word: ἵνα προσφέρῃ
  choice: അർപ്പിക്കാനാണ്
  rationale: ἵναയും subjunctive-ഉം പ്രകടിപ്പിക്കുന്ന ഉദ്ദേശ്യം മലയാളത്തിലെ സ്വാഭാവികമായ ഉദ്ദേശ്യഘടനയിലൂടെ വ്യക്തമാക്കി.
- source_word: δῶρά τε καὶ θυσίας
  choice: വഴിപാടുകളും യാഗങ്ങളും
  rationale: τε καὶ ബന്ധിപ്പിക്കുന്ന രണ്ട് ആരാധനാസംബന്ധിയായ നാമങ്ങളും വേർതിരിച്ചു നിലനിർത്തി. δῶρα-യ്ക്ക് ഈ സന്ദർഭത്തിൽ ‘വഴിപാടുകൾ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും കൃത്യവുമാണ്.
- source_word: ὑπὲρ ἁμαρτιῶν
  choice: പാപങ്ങൾക്കുവേണ്ടി
  rationale: യാഗസന്ദർഭത്തിൽ പാപങ്ങളെ സംബന്ധിച്ചും അവയ്ക്കായും അർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തവും ഉറവിടസമീപവുമായ പ്രയോഗം.
theological_decisions:
- issue: ἀνθρώπων എന്ന പദത്തിന്റെ പ്രതിനിധിപരമായ ലിംഗഭാഷ
  choice: രണ്ടിടത്തും ‘മനുഷ്യർ’
  alternative: ‘പുരുഷന്മാർ’
  rationale: ἄνθρωπος എന്ന ഗ്രീക്ക് പദത്തിന്റെ ബഹുവചനം സന്ദർഭത്തിൽ മനുഷ്യവർഗത്തെ പൊതുവായി സൂചിപ്പിക്കുന്നു. ചരിത്രപരമായി മഹാപുരോഹിതൻ പുരുഷനായിരുന്നുവെങ്കിലും ആദ്യപ്രയോഗം അവൻ മനുഷ്യരിൽ ഒരാളാണെന്നതും രണ്ടാമത്തേത് അവൻ മനുഷ്യർക്കുവേണ്ടി സേവിക്കുന്നതുമാണ് ഊന്നുന്നത്. ‘പുരുഷന്മാർ’ എന്ന് നൽകിയാൽ ഗ്രീക്കിൽ നിർബന്ധമല്ലാത്ത ലിംഗപരിമിതി മലയാളത്തിൽ വരാം.
- issue: ὑπὲρ ἁμαρτιῶν എന്നതിലെ യാഗസംബന്ധം
  choice: ‘പാപങ്ങൾക്കുവേണ്ടി’ എന്ന തുറന്ന പ്രയോഗം
  alternative: ‘പാപപരിഹാരത്തിനായി’
  rationale: ‘പാപപരിഹാരം’ സന്ദർഭപരമായി സാധുവായ വ്യാഖ്യാനമാണെങ്കിലും, ഈ വാക്യത്തിലെ ὑπέρ സൂചിപ്പിക്കുന്ന ബന്ധത്തെക്കാൾ നിർവചിതമായ യാഗശാസ്ത്രവ്യാഖ്യാനം പ്രധാനവാചകത്തിൽ ചേർക്കാതിരിക്കാൻ വിശാലമായ രൂപം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഗ്രീക്കിലെ ദീർഘവാക്യഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കിക്കൊണ്ട് കർമണിപ്രയോഗം, ഉദ്ദേശ്യബന്ധം, ആരാധനാസംബന്ധിയായ പദജോടി എന്നിവ നിലനിർത്തി.
