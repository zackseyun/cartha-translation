    rationale: Greek καθίσταται is a finite present passive (‘is appointed’), while ἵνα προσφέρῃ expresses the purpose of that appointment. A finite Malayalam main clause with ‘അർപ്പിക്കുന്നതിനായി’ represents this relationship more transparently and naturally.
