source:
  edition: SBLGNT
  text: Περὶ οὗ πολὺς ἡμῖν ὁ λόγος καὶ δυσερμήνευτος λέγειν, ἐπεὶ νωθροὶ γεγόνατε ταῖς ἀκοαῖς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/011.yaml
  text: About this we have much to say[a], and it is hard to explain[c][b], since you have become dull in hearing.
translation:
  language: ml
  text: ഇതിനെക്കുറിച്ച് ഞങ്ങൾക്ക് ഏറെ പറയാനുണ്ട്[a]. നിങ്ങൾ കേൾവിയിൽ മന്ദരായിത്തീർന്നതിനാൽ[c], അതു വിശദീകരിച്ചു പറയാൻ പ്രയാസമാണ്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അദ്ദേഹത്തെക്കുറിച്ച്’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് ആപേക്ഷിക സർവനാമം മെൽക്കീസേദെക്കിനെ വ്യക്തിപരമായി സൂചിപ്പിക്കാം; എന്നാൽ ഇവിടെ ചർച്ച ചെയ്യുന്ന വിശാലമായ വിഷയത്തെ സൂചിപ്പിക്കാനാണ് കൂടുതൽ സാധ്യത.
    reason: alternative_reading
  - marker: b
    text: ‘വ്യാഖ്യാനിക്കാൻ പ്രയാസമാണ്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: ‘കേൾവിയിൽ മന്ദർ’ എന്ന പ്രയോഗം ഉപദേശം കേട്ടു സ്വീകരിക്കുന്നതിൽ മന്ദതയോ പ്രതികരണക്കുറവോ ഉള്ളവരെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ οὗ
  choice: ഇതിനെക്കുറിച്ച്
  rationale: ഗ്രീക്ക് ആപേക്ഷിക സർവനാമം മെൽക്കീസേദെക്കിനെയോ ഇപ്പോൾ ചർച്ച ചെയ്യുന്ന വിഷയത്തെയോ സൂചിപ്പിക്കാം. സന്ദർഭത്തിൽ വിശാലമായ വിഷയത്തെ പരിചയപ്പെടുത്തുന്ന സ്വാഭാവിക മലയാളമായി ‘ഇതിനെക്കുറിച്ച്’ തിരഞ്ഞെടുത്തു; വ്യക്തിപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: πολὺς ἡμῖν ὁ λόγος
  choice: ഞങ്ങൾക്ക് ഏറെ പറയാനുണ്ട്
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘ഞങ്ങൾക്ക് വചനം വളരെ’ എന്ന ഘടനയ്ക്കുപകരം, അവതരിപ്പിക്കാനുള്ള കാര്യങ്ങൾ ധാരാളമാണെന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: δυσερμήνευτος λέγειν
  choice: വിശദീകരിച്ചു പറയാൻ പ്രയാസമാണ്
  rationale: δυσερμήνευτος എന്നതിലെ വ്യാഖ്യാനിക്കാനോ വിശദീകരിക്കാനോ ഉള്ള പ്രയാസവും λέγειν എന്നതിലെ പറയുക എന്ന ആശയവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: ἐπεὶ
  choice: എന്നാൽ ...തിനാൽ
  rationale: പ്രതിപാദനത്തിലെ തിരിവ് മലയാളത്തിൽ ‘എന്നാൽ’ വ്യക്തമാക്കുകയും, ἐπεὶ നൽകുന്ന കാരണബന്ധം ‘തിനാൽ’ കൃത്യമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: νωθροὶ
  choice: മന്ദരായിത്തീർന്ന
  rationale: പഠിപ്പിക്കൽ സ്വീകരിക്കുന്നതിലെ മന്ദതയും പ്രതികരണശൂന്യതയും സൂചിപ്പിക്കുന്നു; ‘മടിയന്മാർ’ എന്നു പറഞ്ഞ് വെറും ധാർമ്മിക കുറ്റമായി ചുരുക്കുന്നില്ല.
- source_word: γεγόνατε
  choice: ആയിത്തീർന്ന
  rationale: കാലക്രമത്തിൽ ഈ അവസ്ഥയിലെത്തി ഇപ്പോഴും അതിൽ തുടരുന്നു എന്ന പൂർണകാല ക്രിയയുടെ ഫലാവസ്ഥ സംരക്ഷിക്കുന്നു.
- source_word: ταῖς ἀκοαῖς
  choice: കേൾവിയിൽ
  rationale: വെറും ശാരീരിക ശ്രവണശേഷിയല്ല, ഉപദേശം കേട്ടു സ്വീകരിക്കുന്ന മനോഭാവമാണ് സന്ദർഭത്തിലെ രൂപകമെങ്കിലും, മൂലത്തിലെ ‘കേൾവി’ രൂപകം നിലനിർത്തുന്നു.
theological_decisions:
- issue: Περὶ οὗ എന്നതിന്റെ സൂചിതവിഷയം
  choice: പ്രധാന പാഠത്തിൽ ചർച്ച ചെയ്യുന്ന വിഷയത്തെ സൂചിപ്പിക്കുന്ന ‘ഇതിനെക്കുറിച്ച്’
  alternative: മെൽക്കീസേദെക്കിനെ വ്യക്തിപരമായി സൂചിപ്പിക്കുന്ന ‘അദ്ദേഹത്തെക്കുറിച്ച്’
  rationale: തൊട്ടുമുമ്പ് മെൽക്കീസേദെക്കിന്റെ പേര് വന്നതിനാൽ വ്യക്തിപരമായ സൂചന വ്യാകരണപരമായി സാധ്യമാണ്. എങ്കിലും തുടർന്നുള്ള വിശദീകരണത്തിന് വിശാലമായ വിഷയമാണ് ഇവിടെ അവതരിപ്പിക്കുന്നത്. പ്രധാന പാഠം സന്ദർഭത്തിന് യോജിച്ച വായന നൽകുമ്പോൾ അടിക്കുറിപ്പ് യഥാർഥമായ ദ്വയാർഥസാധ്യത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കേൾവിയിൽ’ എന്ന മൂലരൂപകം നിലനിർത്തി അതിന്റെ ആശയം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി. വാക്യക്രമം മലയാളത്തിന്റെ സ്വാഭാവിക കാരണഘടനയ്ക്ക് അനുസരിച്ച് ക്രമപ്പെടുത്തി.
