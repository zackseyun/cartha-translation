reference: Hebrews 5:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οὕτως καὶ ὁ Χριστὸς οὐχ ἑαυτὸν ἐδόξασεν γενηθῆναι ἀρχιερέα, ἀλλ’ ὁ λαλήσας πρὸς αὐτόν· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/005.yaml
  text: 'So also the Messiah did not glorify himself to become high priest[a], but the one who spoke to him: “You are my Son[c][b]; today I have begotten you.”'
translation:
  language: ml
  text: 'അതുപോലെതന്നെ, മഹാപുരോഹിതനാകാൻ മശീഹ[a] സ്വയം മഹത്ത്വപ്പെടുത്തിയില്ല[c]; മറിച്ച്, അവനോടു അരുളിച്ചെയ്തവൻ: “നീ എന്റെ പുത്രൻ; ഇന്നു ഞാൻ നിന്നെ ജനിപ്പിച്ചിരിക്കുന്നു.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘ക്രിസ്തു.’ ഗ്രീക്കിലെ Χριστός ഇവിടെ ഒരു പേരെന്നതിലുപരി സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നതിനാൽ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി.
    reason: alternative_reading
  - marker: b
    text: സങ്കീർത്തനം 2:7-ൽനിന്നുള്ള ഉദ്ധരണി.
    reason: cross_reference
  - marker: c
    text: അല്ലെങ്കിൽ ‘സ്വയം ബഹുമാനിച്ചില്ല.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘മഹത്ത്വപ്പെടുത്തുക’ എന്നും ‘ബഹുമാനിക്കുക’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὕτως καὶ
  choice: അതുപോലെതന്നെ
  rationale: മുൻവാക്യത്തിലെ പുരോഹിതനിയമനത്തെ മശീഹയോട് താരതമ്യം ചെയ്യുന്ന ബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὁ Χριστὸς
  choice: മശീഹ
  rationale: ഇവിടെ Χριστός ഒരു പേരെന്നതിലുപരി ദൈവത്താൽ നിയമിക്കപ്പെട്ട പദവിയെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നു.
- source_word: οὐχ ἑαυτὸν ἐδόξασεν
  choice: സ്വയം മഹത്ത്വപ്പെടുത്തിയില്ല
  rationale: δοξάζω എന്ന ക്രിയയിലെ ‘മഹത്ത്വപ്പെടുത്തുക/ബഹുമാനിക്കുക’ എന്ന അർഥവ്യാപ്തിയും പ്രതിഫലക പ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: γενηθῆναι ἀρχιερέα
  choice: മഹാപുരോഹിതനാകുന്നതിനായി
  rationale: ഒരു പദവിയിലേക്കു വരുന്നതിനെ സൂചിപ്പിക്കുന്ന γενηθῆναι എന്ന ക്രിയയും ἀρχιερεύς എന്ന പദവിനാമവും വ്യക്തമായി നൽകുന്നു.
- source_word: ἀλλ’ ὁ λαλήσας πρὸς αὐτόν
  choice: മറിച്ച്, അവനോട് ഇങ്ങനെ അരുളിച്ചെയ്തവനാണ്
  rationale: ഗ്രീക്കിലെ കർത്തൃവാചക കൃതന്തവും അവിടെ നിലനിൽക്കുന്ന ക്രിയാലോപവും സംരക്ഷിക്കുന്നു; ഉദ്ധരണിയുടെ പശ്ചാത്തലത്തിൽ സംസാരിക്കുന്നവൻ ദൈവമാണെന്നത് വ്യക്തമെങ്കിലും മുഖ്യവാചകത്തിൽ അധികമായി ചേർക്കുന്നില്ല.
- source_word: Υἱός μου εἶ σύ
  choice: നീ എന്റെ പുത്രൻ
  rationale: ഊന്നലുള്ള പ്രഖ്യാപനം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാള പദക്രമത്തിൽ നൽകുന്നു.
- source_word: ἐγὼ σήμερον γεγέννηκά σε
  choice: ഇന്നു ഞാൻ നിന്നെ ജനിപ്പിച്ചിരിക്കുന്നു
  rationale: സങ്കീർത്തനം 2:7-ലെ ഉദ്ധരണിയുടെ രൂപകവും ക്രിസ്തുശാസ്ത്രപരമായ അർഥതലങ്ങളിലെ തുറന്ന നിലയും വ്യാഖ്യാനപരമായ വിപുലീകരണമില്ലാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: പുരോഹിതപദവിയിലേക്കുള്ള ദൈവിക നിയമനത്തെക്കുറിച്ചുള്ള വാദത്തിൽ ഇത് സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നതിനാൽ ‘മശീഹ’ എന്ന് നൽകി; പരിചിതമായ മറ്റൊരു രൂപം അടിക്കുറിപ്പിൽ ചേർത്തു.
- issue: “ഇന്നു ഞാൻ നിന്നെ ജനിപ്പിച്ചിരിക്കുന്നു” എന്നതിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ സൂചന
  choice: സങ്കീർത്തന ഉദ്ധരണി വ്യാഖ്യാനവിപുലീകരണമില്ലാതെ നേരിട്ട് നിലനിർത്തി
  alternative: ഇത് സിംഹാസനാരോഹണം, പുനരുത്ഥാനം, അല്ലെങ്കിൽ നിത്യജനനം എന്നു മുഖ്യവാചകത്തിൽ പ്രത്യേകമായി വിശദീകരിക്കുക
  rationale: ഉദ്ധരണി തന്നെ ഏതെങ്കിലും പിൽക്കാല വ്യാഖ്യാനത്തെ നിർബന്ധിതമായി തീർപ്പാക്കുന്നില്ല; അതിനാൽ യഥാർഥമായ ദൈവശാസ്ത്രപരമായ സംഘർഷവും തുറന്ന നിലയും സംരക്ഷിച്ചു.
- issue: ἀλλ’ എന്നതിന് ശേഷമുള്ള ക്രിയാലോപം
  choice: “അവനോട് ഇങ്ങനെ അരുളിച്ചെയ്തവനാണ്” എന്ന അപൂർണത നിലനിർത്തി
  alternative: “അവനോട് അരുളിച്ചെയ്തവനാണ് അവനെ മഹത്ത്വപ്പെടുത്തിയത്” എന്നു ക്രിയ പൂരിപ്പിക്കുക
  rationale: ഗ്രീക്ക് വാചകത്തിൽ ‘മഹത്ത്വപ്പെടുത്തി’ എന്ന ക്രിയ വീണ്ടും രേഖപ്പെടുത്തിയിട്ടില്ല. അർഥം സന്ദർഭത്തിൽ വ്യക്തമാണെങ്കിലും മുഖ്യവാചകത്തിൽ അത് ചേർക്കാതെ സ്രോതസ്സിന്റെ വാക്യഘടനാപരമായ തുറന്ന നില സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം ഉപയോഗിച്ചു. ദൈവത്തിന്റെ സംസാരത്തെ സൂചിപ്പിക്കാൻ ‘അരുളിച്ചെയ്തു’ എന്ന മാന്യപ്രയോഗം സ്വീകരിച്ചു. സങ്കീർത്തന ഉദ്ധരണിയുടെ ഔപചാരിക ഭാവവും മുഖ്യവാചകത്തിലെ ഗ്രീക്ക് ക്രിയാലോപവും പരമാവധി സ്വാഭാവികമായി സംരക്ഷിച്ചു.
