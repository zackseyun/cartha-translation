revisions:
- from: അങ്ങനെ, പൂർണതയിലെത്തിക്കപ്പെട്ടശേഷം[a], തന്നെ അനുസരിക്കുന്ന എല്ലാവർക്കും നിത്യരക്ഷയുടെ ഉറവിടമായി അവൻ തീർന്നു[b].
  to: പൂർണനാക്കപ്പെട്ടശേഷം[a], അവൻ അവനെ അനുസരിക്കുന്ന എല്ലാവർക്കും നിത്യരക്ഷയുടെ ഉറവിടമായിത്തീർന്നു[b].
  rationale: The revision avoids making the bare Greek conjunction inferential, clarifies the object of obedience, and uses a more idiomatic passive expression for τελειωθείς. The footnotes retain the lexical and contextual clarification without importing doctrinal conclusions or using an ambiguous Malayalam title.
