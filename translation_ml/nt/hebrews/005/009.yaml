source:
  edition: SBLGNT
  text: καὶ τελειωθεὶς ἐγένετο ⸂πᾶσιν τοῖς ὑπακούουσιν αὐτῷ⸃ αἴτιος σωτηρίας αἰωνίου,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/009.yaml
  text: and[a], having been made perfect, he became the source of eternal salvation to all who obey him[b],
translation:
  language: ml
  text: പൂർണനാക്കപ്പെട്ടശേഷം[a], അവൻ അവനെ അനുസരിക്കുന്ന എല്ലാവർക്കും നിത്യരക്ഷയുടെ ഉറവിടമായിത്തീർന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പൂർത്തീകരിക്കപ്പെട്ടശേഷം’ അല്ലെങ്കിൽ ‘പൂർണതയിലെത്തിക്കപ്പെട്ടശേഷം’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഗ്രീക്ക് പദം ധാർമ്മികമായ കുറവിൽനിന്നുള്ള മെച്ചപ്പെടലിനേക്കാൾ, അവന്റെ പുരോഹിത-രക്ഷാകര ദൗത്യം അതിന്റെ പൂർണലക്ഷ്യത്തിലെത്തിയതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘നിത്യരക്ഷയുടെ കാരണമായി’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: അങ്ങനെ
  rationale: മുൻവാക്യവുമായി ബന്ധിപ്പിക്കുന്ന καὶ ഇവിടെ വെറും കൂട്ടിച്ചേർക്കൽ മാത്രമല്ല, മുൻപറഞ്ഞതിന്റെ ഫലത്തിലേക്കുള്ള സ്വാഭാവിക നീക്കമായും വായിക്കാം. മലയാളത്തിൽ ‘അങ്ങനെ’ ഈ ബന്ധം അമിതമായി വ്യാഖ്യാനിക്കാതെ സുഗമമാക്കുന്നു.
- source_word: τελειωθεὶς
  choice: പൂർണതയിലെത്തിക്കപ്പെട്ടശേഷം
  rationale: τελειόω എന്നതിന്റെ aorist passive participle രൂപം ഉദ്ദേശിച്ച ലക്ഷ്യത്തിലേക്കോ പൂർത്തീകരണത്തിലേക്കോ എത്തിക്കപ്പെടുക എന്ന ആശയം വഹിക്കുന്നു. യേശുവിൽ മുമ്പ് ധാർമ്മിക അപൂർണത ഉണ്ടായിരുന്നു എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കിക്കൊണ്ട്, അവന്റെ പുരോഹിത-രക്ഷാകര ദൗത്യത്തിന്റെ പൂർത്തീകരണം സൂചിപ്പിക്കുന്നു.
- source_word: ἐγένετο
  choice: തീർന്നു
  rationale: ഒരു പുതിയ ഫലാവസ്ഥയിലേക്കോ സ്ഥാനത്തിലേക്കോ വന്നതിനെ γίνομαι സൂചിപ്പിക്കുന്നു. ‘ആയിത്തീർന്നു’ എന്നതിന്റെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളരൂപമാണ് ‘തീർന്നു’.
- source_word: πᾶσιν τοῖς ὑπακούουσιν αὐτῷ
  choice: തന്നെ അനുസരിക്കുന്ന എല്ലാവർക്കും
  rationale: ദാതൃവിഭക്തി രക്ഷയുടെ ഗുണഭോക്താക്കളെ സൂചിപ്പിക്കുന്നു. ὑπακούωയിലെ അനുസരണത്തിന്റെ അർത്ഥം ‘വിശ്വസിക്കുന്ന’ എന്നാക്കി ചുരുക്കാതെ വ്യക്തമായി നിലനിർത്തുന്നു; present participle സൂചിപ്പിക്കുന്ന സ്വഭാവപരമായ/തുടരുന്ന അനുസരണവും മലയാളരൂപത്തിൽ നിലനിൽക്കുന്നു.
- source_word: αἴτιος
  choice: ഉറവിടം
  rationale: αἴτιος ഉത്തരവാദിയായ കാരണത്തെയോ ഉണ്ടാക്കുന്നവനെയോ സൂചിപ്പിക്കുന്നു. ‘കാരണം’ എന്നതിനെക്കാൾ വ്യക്തിപരമായ പ്രവർത്തകത്വം സ്വാഭാവികമായി അറിയിക്കുന്ന പദമാണ് ‘ഉറവിടം’; ‘കർത്താവ്’ എന്നത് സൃഷ്ടാവോ ഗ്രന്ഥകാരനോ എന്ന ആശയക്കുഴപ്പം സൃഷ്ടിക്കാം.
- source_word: σωτηρίας αἰωνίου
  choice: നിത്യരക്ഷയുടെ
  rationale: σωτηρίαയുടെ സ്ഥാപിതമായ ദൈവശാസ്ത്രപരമായ അർത്ഥം ‘രക്ഷ’ നിലനിർത്തുന്നു; αἰώνιος ഇവിടെ അതിന്റെ നിത്യസ്വഭാവം സൂചിപ്പിക്കുന്നതിനാൽ ‘നിത്യ’ സ്വാഭാവികമാണ്.
theological_decisions:
- issue: യേശുവിനെ സംബന്ധിച്ച τελειωθεὶς എന്നതിന്റെ അർത്ഥം
  choice: ‘പൂർണതയിലെത്തിക്കപ്പെട്ടശേഷം’ എന്നു നൽകി, ധാർമ്മികമായി മെച്ചപ്പെട്ടു എന്നതിനു പകരം ദൗത്യപരവും ലക്ഷ്യസംബന്ധവുമായ പൂർത്തീകരണം സൂചിപ്പിച്ചു.
  alternative: ‘പൂർണനാക്കപ്പെട്ടശേഷം’ അല്ലെങ്കിൽ ‘പരിപൂർണനാക്കപ്പെട്ടശേഷം’
  rationale: ഗ്രീക്ക് പദത്തിന്റെ passive-ഉം ലക്ഷ്യത്തിലെത്തുന്ന ആശയവും സംരക്ഷിക്കണം. അതേസമയം, യേശു മുമ്പ് പാപിയോ ധാർമ്മികമായി അപൂർണനോ ആയിരുന്നു എന്ന അർത്ഥം വിവർത്തനം അനാവശ്യമായി സൃഷ്ടിക്കരുത്.
- issue: ‘തന്നെ അനുസരിക്കുന്ന എല്ലാവർക്കും’ എന്നതിലെ വ്യാപ്തിയും നിബന്ധനയും
  choice: അനുസരണഭാഷ അതേപടി വ്യക്തമാക്കി.
  alternative: ‘തന്റെ വാക്കു കേൾക്കുന്ന എല്ലാവർക്കും’ അല്ലെങ്കിൽ ‘തന്നിൽ വിശ്വസിക്കുന്ന എല്ലാവർക്കും’
  rationale: ὑπακούω വ്യക്തമായി അനുസരിക്കുക എന്ന അർത്ഥം നൽകുന്നു. അതിനെ ‘വിശ്വസിക്കുക’ എന്നാക്കി മാറ്റുകയോ പ്രത്യേക ദൈവശാസ്ത്ര വ്യവസ്ഥയായി വികസിപ്പിക്കുകയോ ചെയ്യാതെ വാക്യത്തിലെ സംഘർഷം നിലനിർത്തുന്നു.
- issue: αἴτιος സൂചിപ്പിക്കുന്ന രക്ഷാകര കാരണത്വം
  choice: ‘ഉറവിടം’ എന്നു വിവർത്തനം ചെയ്തു.
  alternative: ‘കാരണം’ അല്ലെങ്കിൽ ‘കർത്താവ്’
  rationale: യേശു നിത്യരക്ഷയ്ക്ക് ഉത്തരവാദിയായ, അതിനെ സാധ്യമാക്കുന്നവൻ എന്ന ആശയം നിലനിർത്തുന്നു; കാരണത്വത്തിന്റെ കൃത്യ സ്വഭാവം അനാവശ്യമായി വിശദീകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പൂർണതയിലെത്തിക്കപ്പെട്ടശേഷം’ അല്പം ഔപചാരികമാണെങ്കിലും ഗ്രീക്കിലെ passive രൂപവും ലക്ഷ്യപൂർത്തീകരണവും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു. വാക്യത്തിന്റെ ഒഴുക്കിനായി ‘καὶ’ എന്നത് ‘അങ്ങനെ’ എന്നും ἐγένετο എന്നത് ‘തീർന്നു’ എന്നും നൽകി.
