id: HEB.5.6
reference: Hebrews 5:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καθὼς καὶ ἐν ἑτέρῳ λέγει· Σὺ ἱερεὺς εἰς τὸν αἰῶνα κατὰ τὴν τάξιν Μελχισέδεκ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/006.yaml
  text: just as he also says in another place[b][a], “You are a priest forever according to the order of Melchizedek,”
translation:
  language: ml
  text: 'അതുപോലെതന്നെ, മറ്റൊരിടത്തും[a] ഇങ്ങനെ പറയുന്നു: “നീ എന്നേക്കും മെൽക്കീസേദെക്കിന്റെ ക്രമപ്രകാരം[b] ഒരു പുരോഹിതനാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “മറ്റൊന്നിൽ.” ഗ്രീക്കിൽ അക്ഷരാർഥമായി “മറ്റൊന്നിൽ” എന്നാണ്; “ഇടം” എന്ന അർഥം ഉൾക്കൊള്ളപ്പെട്ടിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, “മെൽക്കീസേദെക്കിന്റെ ക്രമമനുസരിച്ച്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς καὶ
  choice: അതുപോലെ ... -ത്തും
  rationale: καθώς എന്ന താരതമ്യബന്ധവും καί നൽകുന്ന ‘കൂടി/യും’ എന്ന അർഥവും സ്വാഭാവികമായ മലയാളവാക്യത്തിൽ നിലനിർത്തുന്നു; മുൻ ഉദ്ധരണിയോടു സമാന്തരമായി മറ്റൊരു തിരുവെഴുത്ത് ഉദ്ധരണിയെ ഇത് അവതരിപ്പിക്കുന്നു.
- source_word: ἐν ἑτέρῳ
  choice: മറ്റൊരിടത്തും
  rationale: ഗ്രീക്കിൽ നാമം വ്യക്തമാക്കാതെ ‘മറ്റൊന്നിൽ’ എന്നാണ് അക്ഷരാർഥം; ഇവിടെ മറ്റൊരു തിരുവെഴുത്തുഭാഗം ഉദ്ദേശിക്കുന്നതിനാൽ ‘മറ്റൊരിടത്ത്’ എന്നത് സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: λέγει
  choice: ഇങ്ങനെ പറയുന്നു
  rationale: വർത്തമാനകാലത്തിലെ ജീവിക്കുന്ന തിരുവെഴുത്തുസ്വരം നിലനിർത്തുന്നു. ഗ്രീക്കിൽ കർത്താവ് പരസ്യമായി പറഞ്ഞിട്ടില്ലാത്തതിനാൽ മലയാളത്തിലും പ്രത്യേക കർത്താവിനെ കൂട്ടിച്ചേർത്തിട്ടില്ല; സന്ദർഭത്തിൽ ദൈവമാണ് സംസാരിക്കുന്നത്.
- source_word: Σὺ ἱερεὺς εἰς τὸν αἰῶνα
  choice: നീ എന്നേക്കും ... ഒരു പുരോഹിതനാകുന്നു
  rationale: രണ്ടാംപുരുഷ ഏകവചന അഭിസംബോധനയും കാലാതീതമായി തുടരുന്ന പൗരോഹിത്യവും വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: κατὰ τὴν τάξιν
  choice: ക്രമപ്രകാരം
  rationale: τάξις സൂചിപ്പിക്കുന്ന ക്രമം, വിഭാഗം, പൗരോഹിത്യപരമായ ബന്ധം എന്നിവയെ അതിയായി വ്യാഖ്യാനിക്കാതെ സംരക്ഷിക്കുന്ന സംക്ഷിപ്തമായ പ്രയോഗമാണിത്.
- source_word: Μελχισέδεκ
  choice: മെൽക്കീസേദെക്ക്
  rationale: ഗ്രീക്ക് നാമത്തിന്റെ ശബ്ദരൂപം മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്യുന്നു; പേരിന്റെ അർഥം വിവർത്തനം ചെയ്തിട്ടില്ല.
theological_decisions:
- issue: ഉദ്ധരണിയുടെ സംസാരിക്കുന്നവൻ
  choice: ഗ്രീക്കിലെന്നപോലെ കർത്താവിനെ പ്രത്യേകം പേരിട്ടു ചേർക്കാതെ ‘ഇങ്ങനെ പറയുന്നു’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘അവിടുന്ന് പറയുന്നു’ അല്ലെങ്കിൽ ‘ദൈവം പറയുന്നു’
  rationale: എബ്രായലേഖനം തിരുവെഴുത്തിനെ ദൈവത്തിന്റെ ഇപ്പോഴത്തെ വാക്കായി അവതരിപ്പിക്കുന്ന ശക്തി വർത്തമാനകാലം വഴി നിലനിർത്തുന്നു; അതേസമയം മൂലപാഠത്തിൽ പ്രകടമല്ലാത്ത കർത്താവിനെ മലയാളത്തിൽ അധികമായി ചേർക്കുന്നില്ല.
- issue: മെൽക്കീസേദെക്കുമായി ബന്ധപ്പെട്ട τάξις എന്ന പദത്തിന്റെ അർഥം
  choice: ‘ക്രമപ്രകാരം’—പൗരോഹിത്യക്രമത്തെയോ വിഭാഗത്തെയോ സൂചിപ്പിക്കുന്ന വിധത്തിൽ.
  alternative: ‘മാതൃകപ്രകാരം’ അല്ലെങ്കിൽ ‘രീതിപ്രകാരം’
  rationale: എബ്രായലേഖനത്തിന്റെ വാദത്തിൽ സങ്കീർത്തനം 110:4 മെൽക്കീസേദെക്കുമായി ബന്ധപ്പെട്ട സവിശേഷ പൗരോഹിത്യത്തെ അടിസ്ഥാനപ്പെടുത്തുന്നു. ‘ക്രമം’ ആ ബന്ധം സംരക്ഷിക്കുന്നു; വെറും പെരുമാറ്റരീതിയിലേക്കോ മാതൃകയിലേക്കോ അർഥം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ഗൗരവമുള്ള ശൈലി സ്വീകരിച്ചു. ഉദ്ധരണിയുടെ കാവ്യാത്മക സംക്ഷിപ്തത നിലനിർത്തിയപ്പോൾ മലയാളത്തിൽ സ്വാഭാവികമായ വിധത്തിൽ ‘ഒരു’ ചേർത്തു. ദൈവത്തെ കർത്താവായി തുറന്നുപറയാതിരുന്നത് മൂലപാഠത്തിലെ വ്യാകരണപരമായ പരോക്ഷത സംരക്ഷിക്കാനാണ്.
