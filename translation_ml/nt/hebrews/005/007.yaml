id: HEB.5.7
reference: Hebrews 5:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃς ἐν ταῖς ἡμέραις τῆς σαρκὸς αὐτοῦ δεήσεις τε καὶ ἱκετηρίας πρὸς τὸν δυνάμενον σῴζειν αὐτὸν ἐκ θανάτου μετὰ κραυγῆς ἰσχυρᾶς καὶ δακρύων προσενέγκας καὶ εἰσακουσθεὶς ἀπὸ τῆς εὐλαβείας,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/007.yaml
  text: who[a], in the days of his flesh, having offered up both prayers and petitions with loud cries and tears to the one able to save him from death, and having been heard because of his reverence[b],
translation:
  language: ml
  text: അവൻ[a] തന്റെ ജഡത്തിന്റെ നാളുകളിൽ, മരണത്തിൽനിന്ന് തന്നെ രക്ഷിക്കാൻ കഴിവുള്ളവനോട് ഉച്ചത്തിലുള്ള നിലവിളിയോടും കണ്ണുനീരോടുംകൂടെ പ്രാർഥനകളും യാചനകളും അർപ്പിച്ചു; തന്റെ ഭക്ത്യാദരം നിമിത്തം അവൻ കേൾക്കപ്പെടുകയും ചെയ്തു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ വാക്യം മുൻവാക്യത്തിലെ ക്രിസ്തുവിനെക്കുറിച്ചുള്ള വിവരണം തുടരുന്നു.
    reason: discourse_clarity
  - marker: b
    text: “ഭക്ത്യാദരം” എന്നതിന് “ദൈവഭയം” എന്നും വിവർത്തനം ചെയ്യാം. “മരണത്തിൽനിന്ന് രക്ഷിക്കുക” എന്നത് മരണം ഒഴിവാക്കുക എന്നോ, ഉയിർപ്പിലൂടെ മരണത്തിൽനിന്ന് പുറത്തേക്കു വിടുവിക്കുക എന്നോ മനസ്സിലാക്കാം.
    reason: lexical_and_interpretive_alternatives
lexical_decisions:
- source_word: ἐν ταῖς ἡμέραις τῆς σαρκὸς αὐτοῦ
  choice: തന്റെ ജഡജീവിതകാലത്ത്
  rationale: σάρξ എന്ന മൂർത്തമായ പദത്തിന്റെ ദേഹധാരണാപരമായ ഊന്നൽ നിലനിർത്തിക്കൊണ്ട്, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി യേശുവിന്റെ മർത്ത്യമായ ഭൂമിജീവിതത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: δεήσεις τε καὶ ἱκετηρίας
  choice: പ്രാർഥനകളും യാചനകളും
  rationale: 'രണ്ടു ഗ്രീക്ക് പദങ്ങളുടെയും വ്യത്യാസം നിലനിർത്തുന്നു: ആദ്യത്തേത് പ്രാർഥനാപരമായ അപേക്ഷകളെയും രണ്ടാമത്തേത് തീവ്രമായ അഭ്യർഥനകളെയും സൂചിപ്പിക്കുന്നു.'
- source_word: πρὸς τὸν δυνάμενον σῴζειν αὐτὸν ἐκ θανάτου
  choice: മരണത്തിൽനിന്ന് തന്നെ രക്ഷിക്കാൻ കഴിവുള്ളവനോട്
  rationale: ' substantival participle-നെ ‘കഴിവുള്ളവൻ’ എന്നു പ്രതിഫലിപ്പിക്കുകയും ἐκ θανάτου എന്നത് മരണം ഒഴിവാക്കുന്നതോ മരണത്തിൽനിന്ന് ഉയിർപ്പിലൂടെ വിടുവിക്കുന്നതോ എന്ന അവ്യക്തത നിലനിർത്തുകയും ചെയ്യുന്നു.'
- source_word: μετὰ κραυγῆς ἰσχυρᾶς καὶ δακρύων
  choice: ഉച്ചത്തിലുള്ള നിലവിളിയോടും കണ്ണുനീരോടുംകൂടെ
  rationale: κραυγή ഏകവചനമായതിനാൽ ‘നിലവിളി’ എന്നു നൽകുകയും അതിന്റെ തീവ്രത സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: προσενέγκας
  choice: അർപ്പിച്ചു
  rationale: προσφέρω എന്ന ക്രിയയുടെ സമർപ്പണപരവും സാധ്യതയുള്ള യാഗപരവുമായ അനുരണനം എബ്രായലേഖനത്തിന്റെ പുരോഹിതസന്ദർഭത്തിൽ നിലനിർത്തുന്നു.
- source_word: εἰσακουσθεὶς
  choice: അവന്റെ അപേക്ഷ കേൾക്കപ്പെടുകയും ചെയ്തു
  rationale: വെറും ശബ്ദം കേൾക്കുക എന്നതിലപ്പുറം അനുകൂലമായി കേൾക്കപ്പെട്ടു എന്ന ഭാവം വ്യക്തമാക്കുന്നു; എന്നാൽ മറുപടിയുടെ കൃത്യരൂപം നിർണ്ണയിക്കുന്നില്ല.
- source_word: ἀπὸ τῆς εὐλαβείας
  choice: തന്റെ ഭക്ത്യാദരം നിമിത്തം
  rationale: εὐλάβεια എന്നതിലെ ഭക്തി, ആദരം, ദൈവഭയം എന്നീ അർഥവ്യാപ്തികൾ ചുരുക്കാതെ, യേശുവിൽ അനുചിതമായ ഭയം ആരോപിക്കാത്ത സ്വാഭാവിക മലയാളപ്രയോഗം തിരഞ്ഞെടുക്കുന്നു.
theological_decisions:
- issue: ἀπὸ τῆς εὐλαβείας എന്നതിന്റെ അർഥം
  choice: തന്റെ ഭക്ത്യാദരം നിമിത്തം
  alternative: തന്റെ ദൈവഭയം നിമിത്തം
  rationale: മുഖ്യപാഠം ആദരപൂർവമായ ദൈവഭക്തി പ്രകടിപ്പിക്കുന്നു; ‘ദൈവഭയം’ എന്ന സാധുവായ മറ്റൊരു അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: σῴζειν αὐτὸν ἐκ θανάτου എന്നതിന്റെ വ്യാപ്തി
  choice: മരണത്തിൽനിന്ന് തന്നെ രക്ഷിക്കാൻ
  alternative: മരണത്തിൽനിന്ന് പുറത്തേക്കു വിടുവിക്കാൻ
  rationale: മരിക്കാതെയുള്ള രക്ഷയോ മരണത്തിലൂടെ ഉയിർപ്പിലുള്ള വിടുതലോ എന്ന് വാക്യം നിർണ്ണയിക്കാതെ ഗ്രീക്കിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും അവ്യക്തതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. വാക്യം ഗ്രീക്ക് മൂലത്തിലെ ആശ്രിതഘടനയുടെ തുടർച്ചയാണെന്നത് നിലനിർത്തുന്നു; മലയാളത്തിലെ വായനാസൗകര്യത്തിനായി അർധവിരാമം ഉപയോഗിച്ചു.
