  to: അവൻ[a] തന്റെ ജഡത്തിന്റെ നാളുകളിൽ, മരണത്തിൽനിന്ന് തന്നെ രക്ഷിക്കാൻ കഴിവുള്ളവനോട് ഉച്ചത്തിലുള്ള നിലവിളിയോടും കണ്ണുനീരോടുംകൂടെ പ്രാർഥനകളും യാചനകളും അർപ്പിച്ചു; തന്റെ ഭക്ത്യാദരം നിമിത്തം അവൻ കേൾക്കപ്പെടുകയും ചെയ്തു.[b]
  rationale: The revision removes an added singular object and directly renders the Greek passive participle as “അവൻ കേൾക്കപ്പെടുകയും ചെയ്തു.” It also replaces the more interpretive compressed expression for σάρξ with a closer Malayalam equivalent. The rendering retains the source’s ambiguity concerning deliverance from/out of death and εὐλάβεια.
