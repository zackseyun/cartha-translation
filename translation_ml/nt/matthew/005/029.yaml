  terminology: ‘ഗെഹെന്ന’ appropriately preserves γέεννα without importing a doctrinally narrowed equivalent. ‘അവയവം’ correctly renders μέλος in this comparison. The Gehenna explanatory note should be anchored directly after the term it explains.
