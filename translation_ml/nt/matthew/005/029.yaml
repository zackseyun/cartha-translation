  source_fidelity: The draft retains the explicit ‘right’ eye, the metaphor of causing someone to stumble, the forceful paired imperatives, the comparative construction, bodily-member language, and γέεννα as ‘ഗെഹെന്ന.’ ‘നിന്നിൽനിന്ന് എറിഞ്ഞുകളയുക’ conveys separation, though adding ‘അകലെ’ makes the separative force of ἀπὸ σοῦ clearer.
