id: MAT.5.29
reference: Matthew 5:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ δὲ ὁ ὀφθαλμός σου ὁ δεξιὸς σκανδαλίζει σε, ἔξελε αὐτὸν καὶ βάλε ἀπὸ σοῦ, συμφέρει γάρ σοι ἵνα ἀπόληται ἓν τῶν μελῶν σου καὶ μὴ ὅλον τὸ σῶμά σου βληθῇ εἰς γέενναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/029.yaml
  text: But if your right eye causes you to stumble[a], tear it out and throw it away from you[b]. For it is better for you that one of your members should perish than that your whole body should be thrown into Gehenna.
translation:
  language: ml
  text: എന്നാൽ നിന്റെ വലതുകണ്ണ് നിന്നെ ഇടറാൻ ഇടയാക്കുന്നുവെങ്കിൽ[a], അതു ചൂഴ്‌ന്നെടുത്ത് നിന്നിൽനിന്ന് അകലെ എറിഞ്ഞുകളയുക. നിന്റെ ശരീരം മുഴുവനും ഗെഹെന്നയിലേക്ക്[b] എറിയപ്പെടുന്നതിനെക്കാൾ നിന്റെ അവയവങ്ങളിൽ ഒന്ന് നശിച്ചുപോകുന്നതാണ് നിനക്കു നല്ലത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നിന്നെക്കൊണ്ട് പാപം ചെയ്യിക്കുന്നുവെങ്കിൽ.”'
    reason: lexical_alternative
  - marker: b
    text: “ഗെഹെന്ന” എന്നത് ഹിന്നോം താഴ്‌വരയുമായി ബന്ധപ്പെട്ട ഒരു പേരിന്റെ ഗ്രീക്ക് രൂപമാണ്; പരമ്പരാഗതമായി “നരകം” എന്നു പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്.
    reason: historical_and_translation_note
lexical_decisions:
- source_word: σκανδαλίζει
  choice: ഇടറിക്കുന്നു
  rationale: പാപത്തിലേക്കുള്ള വീഴ്ചയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് രൂപകം നിലനിർത്തുന്നു; ‘പാപം ചെയ്യിക്കുന്നു’ എന്ന വ്യാഖ്യാനപരമായ അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἔξελε
  choice: ചൂഴ്‌ന്നെടുക്കുക
  rationale: കണ്ണ് ബലമായി നീക്കിക്കളയുന്ന ശക്തവും അടിയന്തരവുമായ ദൃശ്യഭാവം സ്വാഭാവിക മലയാളത്തിൽ പകരുന്നു.
- source_word: βάλε ἀπὸ σοῦ
  choice: നിന്നിൽനിന്ന് എറിഞ്ഞുകളയുക
  rationale: എറിയുക എന്ന ആജ്ഞയുടെ ശക്തിയും സ്വയം വിട്ട് അകറ്റുക എന്ന ആശയവും നിലനിർത്തുന്നു.
- source_word: συμφέρει
  choice: നിനക്കു നല്ലത്
  rationale: പ്രയോജനമോ മേന്മയോ സൂചിപ്പിക്കുന്ന പദത്തെ താരതമ്യവാക്യത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἀπόληται
  choice: നശിച്ചുപോകുക
  rationale: ഒരു അവയവത്തിന്റെ നഷ്ടത്തെ ഗൗരവത്തോടെ സൂചിപ്പിക്കുന്നു; സമ്പൂർണ ഉന്മൂലനം എന്ന ആശയം അനാവശ്യമായി നിർബന്ധിക്കുന്നില്ല.
- source_word: μελῶν
  choice: അവയവങ്ങളിൽ
  rationale: കണ്ണിനെയും ഉൾക്കൊള്ളുന്ന ശരീരഭാഗം എന്ന വിശാല അർഥം കൃത്യമായി നൽകുന്നു.
- source_word: βληθῇ
  choice: എറിയപ്പെടുക
  rationale: βάλλω എന്ന ക്രിയയുടെ കർമണിപ്രയോഗവും ശക്തമായ ചലനഭാവവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: γέενναν
  choice: ഗെഹെന്ന
  rationale: പിന്നീടുള്ള പൊതുവായ ദൈവശാസ്ത്രപദത്തിലേക്ക് ലയിപ്പിക്കാതെ ഗ്രീക്കിലെ പ്രത്യേക സ്ഥലനാമം ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: ὁ δεξιὸς
  choice: വലതു
  rationale: മൂലപാഠത്തിൽ വ്യക്തമാക്കിയിരിക്കുന്ന വശം അതേപടി നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തോടുള്ള തുടർച്ചയോടുകൂടിയ മൃദുവായ വൈരുധ്യം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: γέεννα എന്നതിന്റെ വിവർത്തനം
  choice: ഗെഹെന്ന
  alternative: നരകം
  rationale: ചരിത്രപരവും ദൈവശാസ്ത്രപരവുമായ ബന്ധങ്ങളെ മുൻകൂട്ടി ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കാതെ യേശു ഉപയോഗിച്ച പ്രത്യേക പദം നിലനിർത്തുന്നു; വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: σκανδαλίζω എന്നതിലെ രൂപകഭാവം
  choice: ഇടറിക്കുന്നു
  alternative: പാപം ചെയ്യിക്കുന്നു
  rationale: സന്ദർഭം പാപത്തെ സംബന്ധിക്കുന്നതായിരിക്കുമ്പോഴും ഗ്രീക്കിലെ ഇടർച്ചയുടെ രൂപകം പ്രധാനപാഠത്തിൽ സംരക്ഷിക്കുന്നു; കൂടുതൽ വ്യാഖ്യാനാത്മകമായ അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലപാഠത്തിലെ കടുത്ത അതിശയോക്തിദൃശ്യവും ‘ഇടറുക’ എന്ന രൂപകവും സംരക്ഷിച്ചു. സാധാരണ വായനക്കാർക്ക് അപരിചിതമായ ‘ഗെഹെന്ന’ അടിക്കുറിപ്പിലൂടെ വിശദീകരിച്ചു.
