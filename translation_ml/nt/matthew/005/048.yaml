id: MAT.5.48
reference: Matthew 5:48
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἔσεσθε οὖν ὑμεῖς τέλειοι ⸀ὡς ὁ πατὴρ ὑμῶν ὁ ⸀οὐράνιος τέλειός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/048.yaml
  text: You[a], therefore, shall be perfect, as your heavenly Father is perfect.
translation:
  language: ml
  text: അതുകൊണ്ട്, നിങ്ങളുടെ സ്വർഗീയ പിതാവ് പരിപൂർണനായിരിക്കുന്നതുപോലെ നിങ്ങളും പരിപൂർണരായിരിക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സമ്പൂർണർ,” “മുഴുമയുള്ളവർ,” അല്ലെങ്കിൽ “പക്വതയുള്ളവർ” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ τέλειος എന്ന പദത്തിന് പരിപൂർണത എന്നതിനൊപ്പം സമ്പൂർണത, മുഴുമ, പക്വത എന്നീ ആശയങ്ങളും സൂചിപ്പിക്കാനാകും.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔσεσθε
  choice: ആയിരിക്കണം
  rationale: εἰμί എന്ന ക്രിയയുടെ ഭാവികാലരൂപമാണെങ്കിലും സന്ദർഭത്തിൽ ഇത് ആജ്ഞാപരമായ പ്രബോധനമായി പ്രവർത്തിക്കുന്നു. ആ ഗൗരവവും നിർബന്ധസ്വഭാവവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘ആയിരിക്കണം’ വ്യക്തമാക്കുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: ശത്രുക്കളെ സ്നേഹിക്കണമെന്ന മുൻപത്തെ ഉപദേശത്തിൽനിന്നുള്ള നിഗമനബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὑμεῖς
  choice: നിങ്ങളും
  rationale: ഗ്രീക്കിലെ വ്യക്തമായ സർവനാമത്തിനുള്ള ഊന്നൽ നിലനിർത്തുകയും പിതാവിനോടുള്ള താരതമ്യത്തിൽ ശിഷ്യരെയും ഉൾപ്പെടുത്തുകയും ചെയ്യുന്നു.
- source_word: τέλειοι / τέλειός
  choice: പരിപൂർണർ / പരിപൂർണൻ
  rationale: ഗ്രീക്കിലെ ആവർത്തനം മലയാളത്തിലും നിലനിർത്തി പിതാവിനും ശിഷ്യർക്കുമിടയിലെ താരതമ്യത്തിന്റെ വാചകശക്തി സംരക്ഷിക്കുന്നു. പദത്തിന്റെ സമ്പൂർണത, മുഴുമ, പക്വത എന്നീ അർഥസാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ὡς
  choice: ആയിരിക്കുന്നതുപോലെ
  rationale: പിതാവിന്റെ പരിപൂർണതയെ മാതൃകയാക്കുന്ന താരതമ്യം വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: πατὴρ ὑμῶν ὁ οὐράνιος
  choice: നിങ്ങളുടെ സ്വർഗീയപിതാവ്
  rationale: ഗ്രീക്ക് നാമവാക്യത്തിന്റെ അർഥം നേരിട്ട് നിലനിർത്തുന്ന, മലയാളത്തിൽ സ്ഥാപിതവും സ്വാഭാവികവുമായ പ്രയോഗം.
theological_decisions:
- issue: ധാർമിക പ്രബോധനത്തിലെ τέλειος എന്ന പദത്തിന്റെ അർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘പരിപൂർണൻ/പരിപൂർണർ’ എന്ന് നൽകി, വിപുലമായ അർഥപരിധി അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
  alternative: ‘സമ്പൂർണൻ/സമ്പൂർണർ,’ ‘മുഴുമയുള്ളവർ,’ അല്ലെങ്കിൽ ‘പക്വതയുള്ളവർ’
  rationale: മുഖ്യപരിഭാഷ ഗ്രീക്കിന്റെ ശക്തമായ ധാർമിക ആഹ്വാനവും പിതാവുമായുള്ള നേരിട്ടുള്ള താരതമ്യവും സംരക്ഷിക്കുന്നു. അതേസമയം, ഉടൻമുമ്പുള്ള സന്ദർഭത്തിൽ വിഭജിക്കപ്പെടാത്ത സമഗ്രസ്നേഹമാണ് പ്രധാനം എന്ന സാധ്യത അടിക്കുറിപ്പ് തുറന്നുവെക്കുന്നു; ദൈവത്തോടുള്ള സത്താപരമായ സമത്വമോ ഒരു പ്രത്യേക സിദ്ധാന്തപരമായ വ്യാഖ്യാനമോ വിവർത്തനം നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നിങ്ങളും’ എന്നത് ὑμεῖς എന്ന സർവനാമത്തിന്റെ ഊന്നൽ വാക്യത്തിൽ അനാവശ്യമായ കൃത്രിമത്വമില്ലാതെ നിലനിർത്തുന്നു. വാക്യക്രമം മലയാളത്തിന്റെ സ്വാഭാവിക താരതമ്യഘടന അനുസരിച്ചാണ്.
