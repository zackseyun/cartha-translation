id: MAT.5.15
reference: Matthew 5:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐδὲ καίουσιν λύχνον καὶ τιθέασιν αὐτὸν ὑπὸ τὸν μόδιον ἀλλ’ ἐπὶ τὴν λυχνίαν, καὶ λάμπει πᾶσιν τοῖς ἐν τῇ οἰκίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/015.yaml
  text: Nor do people light a lamp and put it under a basket[a], but on a lampstand[b], and it gives light to everyone in the house.
translation:
  language: ml
  text: ആളുകൾ വിളക്കു കൊളുത്തി അളവുപാത്രത്തിന്റെ കീഴിൽ വെക്കാറില്ല[a]; പകരം, വിളക്കുതണ്ടിന്മേലാണ് വെക്കുന്നത്. അപ്പോൾ അത് വീട്ടിലുള്ള എല്ലാവർക്കും വെളിച്ചം നൽകുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ധാന്യവും മറ്റും അളക്കാനുള്ള പാത്രത്തിന്റെ കീഴിൽ.’ ഗ്രീക്കിലെ μόδιος ഉണങ്ങിയ സാധനങ്ങൾക്കുള്ള ഒരു അളവിനെയും, അതിന്റെ അളവുപാത്രത്തെയും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അത് വീട്ടിലുള്ള എല്ലാവർക്കുമായി പ്രകാശിക്കുന്നു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: വെക്കാറില്ല
  rationale: മുൻവാക്യത്തോട് ചേർന്ന മറ്റൊരു നിഷേധാത്മക ഉദാഹരണമാണിത്. മലയാളത്തിലെ പതിവുപ്രയോഗരൂപമായ ‘-ആറില്ല’ ഈ പൊതുസത്യത്തിന്റെ നിഷേധം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: καίουσιν λύχνον
  choice: വിളക്കു കൊളുത്തി
  rationale: λύχνος മൂർത്തമായ എണ്ണവിളക്കിനെയും καίω ഇവിടെ അതു കൊളുത്തുന്നതിനെയും സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗം ‘വിളക്കു കൊളുത്തുക’ എന്നതാണ്.
- source_word: τιθέασιν αὐτὸν
  choice: വെക്കാറില്ല / വെക്കുന്നത്
  rationale: τίθημι എന്ന ലളിതമായ പ്രവൃത്തിയെ ആധുനിക മലയാളത്തിൽ നേരിട്ട് അവതരിപ്പിക്കുന്നു; സർവനാമം ആവർത്തിക്കാതെ മലയാളത്തിന്റെ സ്വാഭാവിക വാക്യഘടന പാലിക്കുന്നു.
- source_word: ὑπὸ τὸν μόδιον
  choice: അളവുപാത്രത്തിന്റെ കീഴിൽ
  rationale: μόδιος ഒരു ഉണങ്ങിയ സാധനങ്ങളുടെ അളവും, വിപുലീകരിച്ച അർഥത്തിൽ ആ അളവിനുള്ള പാത്രവും ആണ്. ‘അളവുപാത്രം’ ഈ സാംസ്കാരിക വസ്തുത സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἀλλ’ ἐπὶ τὴν λυχνίαν
  choice: പകരം, വിളക്കുതണ്ടിന്മേലാണ്
  rationale: λυχνία വിളക്ക് വയ്ക്കാനുള്ള തണ്ടോ പീഠമോ ആണ്. ‘വിളക്കുതണ്ട്’ സാധാരണ വായനക്കാരന് വ്യക്തമായതും ദൃശ്യരൂപം നിലനിർത്തുന്നതുമാണ്; ‘-ആണ്’ വിരോധാഭാസത്തിന് ഊന്നൽ നൽകുന്നു.
- source_word: λάμπει
  choice: വെളിച്ചം നൽകുന്നു
  rationale: λάμπω എന്നതിന് അക്ഷരാർഥത്തിൽ ‘പ്രകാശിക്കുന്നു’ എന്നു വരാമെങ്കിലും, തുടർന്നുള്ള ദത്തിവിഭക്തിയോടുകൂടെ ഇവിടെ വീട്ടിലുള്ളവർക്ക് ലഭിക്കുന്ന വെളിച്ചമാണ് ഊന്നൽ; ‘വെളിച്ചം നൽകുന്നു’ അത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: πᾶσιν τοῖς ἐν τῇ οἰκίᾳ
  choice: വീട്ടിലുള്ള എല്ലാവർക്കും
  rationale: πᾶσιν എന്നതിന്റെ സർവവ്യാപകതയും οἰκίαയുടെ സ്ഥലപരമായ അർഥവും വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ഗ്രീക്കിൽ പ്രത്യേകം പറയാത്ത പൊതുവായ മൂന്നാംപുരുഷ ബഹുവചന കർത്താവ്
  choice: ആളുകൾ വിളക്കു കൊളുത്തി... വെക്കാറില്ല
  alternative: ആരും വിളക്കു കൊളുത്തി... വെക്കാറില്ല
  rationale: ഗ്രീക്കിലെ കർത്താവില്ലാത്ത പൊതുവായ ബഹുവചന ക്രിയയെ ‘ആളുകൾ’ എന്നു നൽകുന്നത് പഴഞ്ചൊല്ലുസദൃശമായ പൊതുസ്വഭാവം നിലനിർത്തുന്നു; ഏകവചനത്തിലേക്കുള്ള അനാവശ്യ മാറ്റവും അവ്യക്തമായ ‘അവർ’ എന്ന പ്രയോഗവും ഒഴിവാക്കുന്നു.
- issue: λάμπει എന്ന ക്രിയയുടെ പ്രവർത്തനമോ ദൃശ്യപ്രകാശനമോ
  choice: അത് ... എല്ലാവർക്കും വെളിച്ചം നൽകുന്നു
  alternative: അത് ... എല്ലാവർക്കുമായി പ്രകാശിക്കുന്നു
  rationale: രണ്ടു വായനകളും ഗ്രീക്ക് അനുവദിക്കുന്നു. മുഖ്യപാഠം ദത്തിവിഭക്തിയിലൂടെ സൂചിപ്പിക്കുന്ന പ്രയോജനഫലം സ്വാഭാവികമായി നൽകുന്നു; കൂടുതൽ രൂപപരമായ പകരംവായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. പൊതുസത്യത്തിന്റെ ഭാവം ‘വെക്കാറില്ല’ എന്ന പതിവുപ്രയോഗത്തിലൂടെ നൽകി. സാംസ്കാരികമായി അപരിചിതമായ μόδιος എന്ന പദം ‘അളവുപാത്രം’ എന്നു വിവർത്തനം ചെയ്ത് വിശദീകരണം അടിക്കുറിപ്പിൽ ചേർത്തു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
