review_pass:
  verdict: approve
  source_fidelity: The Malayalam accurately conveys the generic negative saying, the concrete lamp, the measuring-container image of μόδιος, the contrastive placement on a lampstand, and the lamp's illumination of everyone in the house. The habitual form വെക്കാറില്ല appropriately expresses the proverbial/general force of the Greek present plural. ‘അപ്പോൾ’ makes explicit the natural result of placing the lamp on the stand and does not materially alter the sense.
  naturalness: The wording is clear, idiomatic modern standard Malayalam and maintains a simple, dignified register. ‘വിളക്കു കൊളുത്തി,’ ‘അളവുപാത്രത്തിന്റെ കീഴിൽ,’ and ‘വീട്ടിലുള്ള എല്ലാവർക്കും വെളിച്ചം നൽകുന്നു’ are readily understandable. ‘വിളക്കുതണ്ട്’ is an intelligible rendering of lampstand in this context.
  terminology: Key imagery is retained without importing interpretation. ‘അളവുപാത്രം’ is supported by the explanatory note, which correctly preserves the measure/container sense of μόδιος. The alternative for λάμπει (‘പ്രകാശിക്കുന്നു’) is appropriate and properly anchored.
