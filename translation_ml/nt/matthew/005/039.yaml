id: MAT.5.39
reference: Matthew 5:39
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν μὴ ἀντιστῆναι τῷ πονηρῷ· ἀλλ’ ὅστις σε ⸀ῥαπίζει ⸀εἰς τὴν δεξιὰν ⸀σιαγόνα, στρέψον αὐτῷ καὶ τὴν ἄλλην·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/039.yaml
  text: But I say to you[a], do not resist the evil person. Instead, if anyone slaps you on the right cheek[b], turn the other to him as well.
translation:
  language: ml
  text: 'എന്നാൽ ഞാൻ നിങ്ങളോടു പറയുന്നു: ദുഷ്ടനായവനെ എതിർക്കരുത്.[a] മറിച്ച്, ആരെങ്കിലും നിന്റെ വലത്തെ കവിളിൽ അടിച്ചാൽ, മറ്റേ കവിളും അയാൾക്കു നേരെ തിരിക്കുക.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “തിന്മയെ എതിർക്കരുത്”; മറ്റൊരു സാധ്യത: “ദുഷ്ടനെ എതിർക്കരുത്.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: എന്നാൽ ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: δέയുടെ വൈരുധ്യഭാവവും യേശുവിന്റെ ഊന്നലുള്ള പ്രഥമപുരുഷ പ്രയോഗവും സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: μὴ ἀντιστῆναι
  choice: എതിർക്കരുത്
  rationale: ἀνθίστημι എന്നതിന്റെ നേരിട്ടുള്ള ‘എതിർത്തുനിൽക്കുക/ചെറുക്കുക’ എന്ന അർഥം സൂക്ഷിക്കുന്നു; ‘തിരിച്ചടിക്കരുത്’ എന്നു ചുരുക്കി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: τῷ πονηρῷ
  choice: ദുഷ്ടനായ മനുഷ്യനെ
  rationale: രൂപം വ്യാകരണപരമായി ‘തിന്മ’, ‘ദുഷ്ടനായ വ്യക്തി’, ‘ദുഷ്ടൻ’ എന്നിങ്ങനെ ഗ്രഹിക്കാവുന്നതാണ്. പിന്നാലെയുള്ള മനുഷ്യാക്രമണത്തിന്റെ ഉദാഹരണം വ്യക്തിസൂചനയെ അനുകൂലിക്കുന്നതിനാൽ മുഖ്യപാഠത്തിൽ ഇത് തെരഞ്ഞെടുത്തു; യഥാർഥ സന്ദിഗ്ധത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: ῥαπίζει
  choice: അടിച്ചാൽ
  rationale: കവിളിൽ കൈകൊണ്ട് അടിക്കുന്ന പ്രവൃത്തിയെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘പ്രഹരിച്ചാൽ’ എന്നതിനെക്കാൾ സാധാരണ വായനക്കാർക്ക് ലളിതമാണ്.
- source_word: εἰς τὴν δεξιὰν σιαγόνα
  choice: നിന്റെ വലത്തെ കവിളിൽ
  rationale: σιαγών ‘താടിയെല്ല്’ എന്നും ‘കവിൾ’ എന്നും വരാമെങ്കിലും അടിയുടെ ഈ സന്ദർഭത്തിൽ ‘കവിൾ’ സ്വാഭാവികമാണ്.
- source_word: στρέψον αὐτῷ καὶ τὴν ἄλλην
  choice: മറ്റേ കവിളും അയാൾക്കു തിരിച്ചു കൊടുക്കുക
  rationale: στρέφωയുടെ ‘തിരിക്കുക’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുകയും സന്ദർഭത്തിൽ മനസ്സിലാകുന്ന ‘കവിൾ’ ആവർത്തിച്ച് മലയാളത്തിൽ വ്യക്തത വരുത്തുകയും ചെയ്യുന്നു; ‘നീട്ടിക്കൊടുക്കുക’ പോലുള്ള കൂടുതൽ വ്യാഖ്യാനാത്മക പദം ഒഴിവാക്കുന്നു.
- source_word: ὅστις
  choice: ആരെങ്കിലും
  rationale: അനിശ്ചിത വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാളസമം.
theological_decisions:
- issue: τῷ πονηρῷ എന്നതിന്റെ സൂചന
  choice: ദുഷ്ടനായ മനുഷ്യനെ
  alternative: തിന്മയെ; അല്ലെങ്കിൽ ദുഷ്ടനെ
  rationale: തുടർന്നുള്ള ‘ആരെങ്കിലും നിന്റെ കവിളിൽ അടിച്ചാൽ’ എന്ന ഉദാഹരണം മനുഷ്യനായ ദുഷ്പ്രവർത്തകനെ അനുകൂലിക്കുന്നു. എങ്കിലും ഗ്രീക്ക് രൂപം അമൂർത്തമായ തിന്മയെയോ വ്യക്തിപരമായ ‘ദുഷ്ടനെ’യോ സൂചിപ്പിക്കാമെന്നതിനാൽ ആ സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഏകവചന അഭിസംബോധനയായ σε ‘നിന്റെ’ എന്നു നിലനിർത്തി. മുഖ്യപാഠത്തിലെ [a] അടിക്കുറിപ്പ് τῷ πονηρῷ എന്നതിന്റെ യഥാർഥ വ്യാകരണ-അർഥസന്ദിഗ്ധത സംരക്ഷിക്കുന്നു.
