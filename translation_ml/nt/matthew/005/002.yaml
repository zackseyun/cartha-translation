  language: ml
  text: അവൻ വായ് തുറന്ന് അവരെ ഇങ്ങനെ പഠിപ്പിച്ചു:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: “അവൻ തന്റെ വായ് തുറന്ന്, പറഞ്ഞുകൊണ്ട് അവരെ പഠിപ്പിച്ചുകൊണ്ടിരുന്നു:”'
    reason: ἀνοίξας, ἐδίδασκεν, λέγων എന്നീ ക്രിയാരൂപങ്ങളുടെ കൃതന്ത-ഇംപെർഫെക്റ്റ് ഘടന കൂടുതൽ വ്യക്തമായി കാണിക്കുന്ന രൂപപരമായ പകരം.
lexical_decisions:
- source_word: καὶ
  choice: അവൻ
  rationale: മുൻവാക്യത്തോടുള്ള ലളിതമായ ബന്ധം മലയാളത്തിലെ വാക്യപ്രവാഹത്തിൽ സ്വാഭാവികമായി നിലനിൽക്കുന്നതിനാൽ καί പ്രത്യേകം ‘എന്നിട്ട്’ എന്നു ചേർത്തിട്ടില്ല; അങ്ങനെ ചേർത്താൽ ഗ്രീക്കിലുള്ളതിലധികം കാലക്രമസൂചന വരാം.
- source_word: ἀνοίξας τὸ στόμα αὐτοῦ
  choice: വായ് തുറന്ന്
  rationale: ‘തന്റെ വായ് തുറന്നശേഷം’ എന്ന പദാനുപദരൂപത്തേക്കാൾ സ്വാഭാവികമായ മലയാളമാണിത്; അതേസമയം ഔപചാരികമായ പ്രസംഗത്തിന്റെ ആരംഭം സൂചിപ്പിക്കുന്ന മൂലഭാഷയിലെ പ്രയോഗം ഒഴിവാക്കിയിട്ടില്ല.
- source_word: ἐδίδασκεν
  choice: പഠിപ്പിച്ചു
  rationale: ഇംപെർഫെക്റ്റിന്റെ പുരോഗമനസ്വഭാവം മലയാളത്തിൽ നിർബന്ധമായി ദീർഘരൂപത്തിൽ പ്രകടിപ്പിക്കുന്നത് അസ്വാഭാവികമാകും. വിവരണസന്ദർഭത്തിൽ ‘പഠിപ്പിച്ചു’ സ്വാഭാവികമാണ്; കൂടുതൽ രൂപപരമായ പകരം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: αὐτούς
  choice: അവരെ
  rationale: സർവനാമത്തിന്റെ സന്ദർഭപരമായ അവ്യക്തത സംരക്ഷിക്കുന്നു; ഈ വാക്യത്തിൽതന്നെ ഇല്ലാത്ത ‘ശിഷ്യന്മാർ’ അല്ലെങ്കിൽ ‘ജനങ്ങൾ’ എന്ന തിരിച്ചറിയൽ ചേർക്കുന്നില്ല.
- source_word: λέγων
  choice: ഇങ്ങനെ
  rationale: തുടർന്ന് വരുന്ന പഠിപ്പിക്കലിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന കൃതന്തത്തെ സ്വാഭാവിക മലയാളത്തിൽ ‘ഇങ്ങനെ’ എന്നു പ്രകടിപ്പിക്കുന്നു. ‘പറഞ്ഞുകൊണ്ട്’ എന്ന കൂടുതൽ രൂപപരമായ വിവർത്തനം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
