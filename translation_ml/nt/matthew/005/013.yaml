id: MAT.5.13
reference: Matthew 5:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὑμεῖς ἐστε τὸ ἅλας τῆς γῆς· ἐὰν δὲ τὸ ἅλας μωρανθῇ, ἐν τίνι ἁλισθήσεται; εἰς οὐδὲν ἰσχύει ἔτι εἰ μὴ ⸂βληθὲν ἔξω⸃ καταπατεῖσθαι ὑπὸ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/013.yaml
  text: You are the salt of the earth. But if the salt becomes tasteless[a], with what will it be made salty? It is no longer good for anything except to be thrown out and trampled underfoot by men.
translation:
  language: ml
  text: നിങ്ങൾ ഭൂമിയുടെ ഉപ്പാണ്. എന്നാൽ ഉപ്പിന് രുചി നഷ്ടപ്പെട്ടാൽ, എന്തിനാൽ അതിനെ ഉപ്പുരസമുള്ളതാക്കും? പുറത്തേക്ക് എറിയപ്പെട്ട് മനുഷ്യരാൽ ചവിട്ടിമെതിക്കപ്പെടാനല്ലാതെ പിന്നെ അത് ഒന്നിനും കൊള്ളുകയില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑμεῖς
  choice: നിങ്ങൾ
  rationale: ഗ്രീക്കിൽ സർവനാമം ഊന്നലോടെയാണ് വന്നിരിക്കുന്നത്. വാക്യാരംഭത്തിലെ ‘നിങ്ങൾ’ മലയാളത്തിൽ സ്വാഭാവികമായി ആ ഊന്നൽ നൽകുന്നു.
- source_word: τὸ ἅλας τῆς γῆς
  choice: ഭൂമിയുടെ ഉപ്പ്
  rationale: γῆ എന്നതിന് ഭൂമി, ദേശം, നിലം എന്നീ അർഥങ്ങളുണ്ടെങ്കിലും ഇവിടെ ഉപമയുടെ വിശാലമായ വ്യാപ്തിക്ക് ‘ഭൂമി’ യോജിക്കുന്നു.
- source_word: μωρανθῇ
  choice: രുചി നഷ്ടപ്പെട്ടാൽ
  rationale: മൂലക്രിയയ്ക്ക് ‘മൂഢമാകുക’ എന്ന പദബന്ധമുണ്ടെങ്കിലും ഉപ്പിനെക്കുറിച്ചുള്ള പ്രയോഗത്തിൽ ഉപ്പുരസം ഇല്ലാതാകുക, രുചിയറ്റതാകുക എന്നതാണ് പ്രസക്തമായ അർഥം.
- source_word: ἐν τίνι ἁλισθήσεται;
  choice: എന്തുകൊണ്ട് അതിന് വീണ്ടും ഉപ്പുരസം വരുത്തും?
  rationale: ഭാവികാല കർമണിപ്രയോഗം ഉപ്പിനെ ഏതു മാർഗത്താൽ വീണ്ടും ഉപ്പുള്ളതാക്കാനാകും എന്നു ചോദിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി ‘വീണ്ടും’ വ്യക്തമാക്കിയിരിക്കുന്നു.
- source_word: εἰς οὐδὲν ἰσχύει ἔτι
  choice: പിന്നെ അത് ഒന്നിനും കൊള്ളുകയില്ല
  rationale: ἰσχύω ഇവിടെ പ്രായോഗിക പ്രയോജനമോ ഫലപ്രാപ്തിയോ സൂചിപ്പിക്കുന്നു; ഈ മലയാളപ്രയോഗം അതിന്റെ ഉപയോഗശൂന്യത സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: εἰ μὴ βληθὲν ἔξω
  choice: പുറത്തേക്ക് എറിഞ്ഞ്
  rationale: ἔξωയുടെ സ്ഥലസൂചന നിലനിർത്തിക്കൊണ്ട് തുടർന്നുള്ള അനന്തരഫലവുമായി മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: καταπατεῖσθαι
  choice: ചവിട്ടിക്കളയാൻ
  rationale: കാലുകൊണ്ട് ചവിട്ടിമെതിക്കുക എന്ന ദൃശ്യതീവ്രത മലയാളത്തിലെ ഈ പ്രയോഗം നൽകുന്നു.
- source_word: ὑπὸ τῶν ἀνθρώπων
  choice: മനുഷ്യർ
  rationale: ἄνθρωποι ഇവിടെ പുരുഷന്മാരെ മാത്രം അല്ല, മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു. ‘മനുഷ്യർ’ ലിംഗഭേദമില്ലാതെ മൂലാർഥം കൃത്യമായി നൽകുന്നു.
theological_decisions:
- issue: ὑπὸ τῶν ἀνθρώπων എന്നതിലെ പൊതുമാനവ സൂചന
  choice: മനുഷ്യർ
  alternative: ആളുകൾ / മനുഷ്യരാൽ
  rationale: സന്ദർഭത്തിൽ ആൺവർഗത്തെ പ്രത്യേകമായി ചൂണ്ടിക്കാണിക്കുന്നില്ല; മനുഷ്യരെ പൊതുവായാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിലെ ‘മനുഷ്യർ’ ഈ പൊതുസൂചന നേരിട്ട് നിലനിർത്തുന്നു.
- issue: ഉപ്പിന്റെ μωρανθῇ എന്ന അവസ്ഥ
  choice: രുചി നഷ്ടപ്പെട്ടാൽ
  alternative: ഉപ്പുരസം നഷ്ടപ്പെട്ടാൽ / മൗഢ്യമുള്ളതായാൽ
  rationale: ഉപ്പുമായി ബന്ധപ്പെട്ടപ്പോൾ ക്രിയയുടെ സന്ദർഭാർഥം രുചിയറ്റതാകുക എന്നതാണ്. ‘മൗഢ്യമുള്ളതാകുക’ എന്ന വ്യുത്പത്തിപരമായ അർഥം പ്രധാനപാഠത്തിൽ കൊണ്ടുവരുന്നത് ഉപമയെ അസ്വാഭാവികമായി വ്യാഖ്യാനിക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഉപമയുടെ മൂർച്ച നിലനിർത്താൻ ‘ഭൂമിയുടെ ഉപ്പ്’, ‘ഉപ്പുരസം’, ‘ചവിട്ടിക്കളയാൻ’ എന്നീ സാധാരണക്കാർക്ക് വ്യക്തമായ പ്രയോഗങ്ങൾ ഉപയോഗിച്ചു; അനാവശ്യമായ സഭാപരമോ വിഭാഗീയമോ ആയ പദാവലി ഒഴിവാക്കി.
