id: MAT.5.22
reference: Matthew 5:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι πᾶς ὁ ὀργιζόμενος τῷ ἀδελφῷ ⸀αὐτοῦ ἔνοχος ἔσται τῇ κρίσει· ὃς δ’ ἂν εἴπῃ τῷ ἀδελφῷ αὐτοῦ· Ῥακά, ἔνοχος ἔσται τῷ συνεδρίῳ· ὃς δ’ ἂν εἴπῃ· Μωρέ, ἔνοχος ἔσται εἰς τὴν γέενναν τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/022.yaml
  text: But I say to you that everyone who is angry with his brother will be liable to the judgment[a]; and whoever says to his brother, ‘Raca,’ will be liable to the council; and whoever says[e][d][c][b], ‘Fool,’ will be liable to the Gehenna of fire.
translation:
  language: ml
  text: 'എന്നാൽ ഞാൻ നിങ്ങളോടു പറയുന്നു: തന്റെ സഹോദരനോടു കോപിക്കുന്ന ഏവനും ന്യായവിധിക്കു വിധേയനാകും[a][d]. തന്റെ സഹോദരനോട് ‘റാക്കാ’ എന്നു പറയുന്നവൻ ന്യായസഭയ്ക്കു വിധേയനാകും[b][c]. ‘മൂഢാ’ എന്നു പറയുന്നവൻ അഗ്നിയുടെ ഗെഹെന്നയ്ക്കു വിധേയനാകും[e].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികൾ ‘തന്റെ സഹോദരനോടു കോപിക്കുന്ന’ എന്നതിനു ശേഷം ‘കാരണമില്ലാതെ’ എന്നു ചേർക്കുന്നു. ഏറ്റവും പുരാതനവും മികച്ച സാക്ഷ്യപിന്തുണയുള്ളതുമായ പാഠത്തിൽ ഈ വാക്കില്ല.
    reason: textual_variant
  - marker: b
    text: ‘റാക്കാ’ എന്നത് ‘പൊള്ളത്തലയാ’ അല്ലെങ്കിൽ ‘ഒന്നിനും കൊള്ളാത്തവനേ’ എന്നതിന് ഏകദേശം തുല്യമായ ഒരു അരമായ നിന്ദാപദമാണ്.
    reason: cultural_note
  - marker: c
    text: അഥവാ ‘സൻഹെദ്രിൻ’; യഹൂദരുടെ ഭരണാധികാരസഭ.
    reason: alternative_reading
  - marker: d
    text: ‘സഹോദരൻ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നത് പുല്ലിംഗ ഏകവചന പദമാണ്; എന്നാൽ ഈ പ്രസ്താവന പുരുഷസഹോദരന്മാർക്കു മാത്രം പരിമിതമല്ല, വിശാലമായി ബാധകമാണ്.
    reason: lexical_alternative
  - marker: e
    text: അഥവാ ‘അഗ്നിനരകം.’ ‘ഗെഹെന്ന’ എന്നത് ഹിന്നോം താഴ്വരയുമായി ബന്ധപ്പെട്ടതും ന്യായവിധിയുടെ പ്രതീകഭാവം വഹിക്കുന്നതുമായ പ്രത്യേക പദമാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: എന്നാൽ ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: δέ സൂചിപ്പിക്കുന്ന വൈരുധ്യവും ἐγώ നൽകുന്ന ഊന്നലും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: πᾶς ὁ ὀργιζόμενος
  choice: കോപിക്കുന്ന ഏവനും
  rationale: വർത്തമാന കൃദന്തരൂപത്തിന്റെ പൊതുവായ, സദാകാലിക പ്രയോഗം അനാവശ്യമായി കാലഭേദം നിർണ്ണയിക്കാതെ പകർന്നു നൽകുന്നു.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: തന്റെ സഹോദരനോടു
  rationale: ὀργίζομαι-യോടൊപ്പമുള്ള ദത്തിവ് ബന്ധസൂചകമായി പകരുകയും ἀδελφός എന്ന പുല്ലിംഗ ഏകവചനത്തെ മുഖ്യപാഠത്തിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἔνοχος ἔσται
  choice: വിധേയനാകും
  rationale: വിധിയോ ശിക്ഷയോ നേരിടേണ്ട നിയമപരമായ ബാധ്യതയെ സൂചിപ്പിക്കുകയും വാക്യത്തിലെ മൂന്ന് മുന്നറിയിപ്പുകളുടെയും സമാന്തരത നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: τῇ κρίσει
  choice: ന്യായവിധിക്കു
  rationale: പ്രാദേശിക കോടതിയെയോ വിധിനടപടിയെയോ പ്രത്യേകം ഉറപ്പിക്കാതെ κρίσις എന്ന പദത്തിന്റെ ന്യായിക അർഥം സംരക്ഷിക്കുന്നു.
- source_word: Ῥακά
  choice: റാക്കാ
  rationale: ഗ്രീക്കിൽ ശബ്ദലിപിയായി സൂക്ഷിച്ചിരിക്കുന്ന അരമായ നിന്ദാപദം വിവർത്തനത്തിൽ ശബ്ദാന്തരം ചെയ്ത് അതിന്റെ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: τῷ συνεδρίῳ
  choice: ന്യായസഭയ്ക്കു
  rationale: συνέδριον എന്നതിന്റെ സഭ/കൗൺസിൽ എന്ന അർഥം പകരുന്നു; ഇത് നിർബന്ധമായും സൻഹെദ്രിനെയാണ് സൂചിപ്പിക്കുന്നതെന്ന നിർണ്ണയം മുഖ്യപാഠത്തിൽ ഒഴിവാക്കുന്നു.
- source_word: Μωρέ
  choice: മൂഢാ
  rationale: സംബോധനരൂപത്തിലുള്ള നേരിട്ടുള്ള നിന്ദയും അതിലെ ധാർമിക ഗൗരവവും dignified Malayalam-ൽ നിലനിർത്തുന്നു.
- source_word: εἰς τὴν γέενναν τοῦ πυρός
  choice: അഗ്നിയുടെ ഗെഹെന്നയ്ക്കു
  rationale: γέεννα എന്ന ചരിത്രപരവും യെഹൂദപശ്ചാത്തലമുള്ളതുമായ പദം ശബ്ദാന്തരം ചെയ്യുകയും τοῦ πυρός എന്ന ഷഷ്ഠീബന്ധം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: γέεννα എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ഗെഹെന്ന
  alternative: നരകം / അഗ്നിനരകം
  rationale: യേശു ഉപയോഗിച്ച ഹിന്നോം താഴ്‌വരയുമായി ബന്ധപ്പെട്ട പ്രത്യേക പ്രതീകവും ന്യായവിധിയുടെ പശ്ചാത്തലവും സംരക്ഷിക്കുന്നു; പിൽക്കാലത്തെ ‘നരകം’ എന്ന പദവുമായി ബന്ധപ്പെട്ട എല്ലാ ആശയങ്ങളും പാഠത്തിലേക്ക് മുൻകൂട്ടി കൊണ്ടുവരുന്നില്ല.
- issue: ἀδελφός എന്ന ലിംഗസൂചക പദം
  choice: സഹോദരൻ
  alternative: സഹോദരനോ സഹോദരിയോ / സഹവിശ്വാസി
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ഏകവചനം മുഖ്യപാഠത്തിൽ കൃത്യമായി നിലനിർത്തുന്നു; പ്രസ്താവനയുടെ വിശാലമായ പ്രതിനിധിപരമായ പ്രയോഗം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: τῇ κρίσει എന്നതിന്റെ പരിധി
  choice: ന്യായവിധി
  alternative: കോടതി
  rationale: പദത്തിന് ന്യായവിധിയോ ന്യായനടപടിയോ എന്ന അർഥമുണ്ടാകാം; പ്രത്യേക പ്രാദേശിക കോടതിയെ നിർബന്ധമായി നിശ്ചയിക്കാതെ മൂലപാഠത്തിലെ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. നിയമപരമായ മുന്നറിയിപ്പുകളുടെ ആവർത്തനവും വർധിച്ചുവരുന്ന തീവ്രതയും ഒരേ ‘വിധേയനാകും’ എന്ന രൂപത്തിലൂടെ നിലനിർത്തി. അരമായ ‘റാക്കാ’യും ചരിത്രഭാരമുള്ള ‘ഗെഹെന്ന’യും മുഖ്യപാഠത്തിൽ ശബ്ദാന്തരം ചെയ്ത് അടിക്കുറിപ്പുകളിൽ വിശദീകരിച്ചു.
