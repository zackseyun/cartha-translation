id: MAT.5.34
reference: Matthew 5:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν μὴ ὀμόσαι ὅλως· μήτε ἐν τῷ οὐρανῷ, ὅτι θρόνος ἐστὶν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/034.yaml
  text: 'But I say to you, do not swear at all: neither by heaven, because it is the throne of God;'
translation:
  language: ml
  text: 'എന്നാൽ ഞാൻ നിങ്ങളോടു പറയുന്നു: ഒട്ടും സത്യം ചെയ്യരുത്; സ്വർഗത്തെച്ചൊല്ലിയും അരുത്, കാരണം അത് ദൈവത്തിന്റെ സിംഹാസനമാണ്.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: എന്നാൽ ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: δὲ ഇവിടെ മുൻവാക്യത്തോടുള്ള വൈരുധ്യം സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ എന്നു നൽകി; ἐγώയുടെ ഊന്നലും സ്വാഭാവികമായ മലയാളക്രമത്തിൽ നിലനിർത്തി.
- source_word: μὴ ὀμόσαι ὅλως
  choice: ഒട്ടും സത്യം ചെയ്യരുത്
  rationale: ὀμόσαι എന്നത് സത്യപ്രതിജ്ഞ ചെയ്യുക എന്ന അർഥത്തിലാണെങ്കിലും, സാധാരണ മലയാളത്തിൽ ‘സത്യം ചെയ്യുക’ വ്യക്തവും സ്വാഭാവികവുമാണ്; ὅλωςയുടെ സമഗ്രനിഷേധം ‘ഒട്ടും’ സംരക്ഷിക്കുന്നു.
- source_word: μήτε ἐν τῷ οὐρανῷ
  choice: സ്വർഗത്തെച്ചൊല്ലിയും അരുത്
  rationale: ἐν എന്നത് ശപഥത്തിന്റെ ആധാരത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘സ്വർഗത്തെച്ചൊല്ലി’ എന്ന പ്രയോഗം അതിനെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു. μήτεയിലെ തുടർച്ചയായ നിഷേധം ‘യും അരുത്’ കൊണ്ട് നിലനിർത്തി.
- source_word: ὅτι
  choice: കാരണം
  rationale: ഇവിടെ ὅτι സ്വർഗത്തെച്ചൊല്ലി സത്യം ചെയ്യരുതെന്നതിനുള്ള കാരണം അവതരിപ്പിക്കുന്നു.
- source_word: θρόνος ἐστὶν τοῦ θεοῦ
  choice: അത് ദൈവത്തിന്റെ സിംഹാസനമാണ്
  rationale: ഉടമസ്ഥത സൂചിപ്പിക്കുന്ന τοῦ θεοῦയും തിരിച്ചറിയൽവാക്യത്തിന്റെ നേരായ അർഥവും സംരക്ഷിച്ചു.
theological_decisions:
- issue: μὴ ὀμόσαι ὅλως എന്ന കല്പനയുടെ വ്യാപ്തി
  choice: ‘ഒട്ടും സത്യം ചെയ്യരുത്’ എന്ന സമഗ്രരൂപം നിലനിർത്തി
  alternative: ‘കള്ളസത്യം ചെയ്യരുത്’ അല്ലെങ്കിൽ ‘ഇത്തരത്തിൽ സത്യം ചെയ്യരുത്’
  rationale: മൂലപാഠത്തിൽ കള്ളസത്യത്തെയോ പ്രത്യേക സാഹചര്യത്തെയോ പരിമിതപ്പെടുത്തുന്ന പദമില്ല; അതിനാൽ വ്യാഖ്യാനപരമായ നിയന്ത്രണം പരിഭാഷയിൽ ചേർത്തില്ല.
- issue: സ്വർഗത്തിന്റെ ദൈവബന്ധം
  choice: ‘കാരണം അത് ദൈവത്തിന്റെ സിംഹാസനമാണ്’
  alternative: ‘അത് ദൈവത്തിന്റെ സിംഹാസനമായതിനാൽ’
  rationale: രണ്ടും സാധുവാണെങ്കിലും, ὅτιയുടെ വിശദീകരണസ്വഭാവം നേരിട്ട് പ്രകടമാക്കാൻ സ്വതന്ത്ര കാരണവാക്യം തിരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘സത്യം ചെയ്യുക’, ‘സ്വർഗത്തെച്ചൊല്ലി’ എന്നീ പ്രയോഗങ്ങൾ സ്വാഭാവികതയും മൂലപാഠത്തിന്റെ അർഥവും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
