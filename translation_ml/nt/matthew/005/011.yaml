id: MAT.5.11
reference: Matthew 5:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μακάριοί ἐστε ὅταν ὀνειδίσωσιν ὑμᾶς καὶ διώξωσιν καὶ εἴπωσιν πᾶν ⸀πονηρὸν καθ’ ὑμῶν ψευδόμενοι ἕνεκεν ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/011.yaml
  text: Blessed are you when they insult you and persecute you and falsely say every kind of evil against you because of me[a][b][c].
translation:
  language: ml
  text: എന്നെ നിമിത്തം[c] ആളുകൾ നിങ്ങളെ അധിക്ഷേപിക്കുകയും[a] പീഡിപ്പിക്കുകയും നിങ്ങൾക്കെതിരായി എല്ലാത്തരം തിന്മകളും വ്യാജമായി പറയുകയും ചെയ്യുമ്പോൾ നിങ്ങൾ ഭാഗ്യവാന്മാർ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അപമാനിക്കുകയും” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: “എന്നെപ്രതി” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοί ἐστε
  choice: നിങ്ങൾ അനുഗൃഹീതർ
  rationale: മലയിലെ പ്രസംഗത്തിലെ അനുഗ്രഹപ്രഖ്യാപനത്തിന്റെ ഭാരം നിലനിർത്തുന്നു. കേവലം ലൗകികമായ ഭാഗ്യാവസ്ഥയേക്കാൾ ദൈവാനുഗ്രഹത്തിന്റെ ആശയം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ὅταν
  choice: ചെയ്യുമ്പോൾ
  rationale: തുടർന്നുള്ള ഉപവാക്യങ്ങൾ വിവരിക്കുന്ന പൊതുവായ ഭാവിസാഹചര്യം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ὀνειδίσωσιν
  choice: അധിക്ഷേപിക്കുകയും
  rationale: വാക്കുകളാലുള്ള നിന്ദയും അപമാനവും ഉൾക്കൊള്ളുന്ന, ആധുനിക ഔപചാരിക മലയാളത്തിൽ വ്യക്തമായ പദമാണ്.
- source_word: διώξωσιν
  choice: പീഡിപ്പിക്കുകയും
  rationale: യേശുവിനോടുള്ള ബന്ധം നിമിത്തമുള്ള ശത്രുതാപരമായ ഉപദ്രവത്തിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു; അതിനെ ശാരീരിക പീഡനത്തിലേക്ക് മാത്രം ചുരുക്കുന്നില്ല.
- source_word: εἴπωσιν πᾶν πονηρὸν καθ’ ὑμῶν
  choice: നിങ്ങൾക്കെതിരായി സകലവിധ തിന്മയും ... പറയുകയും
  rationale: κατάയുടെ എതിർദിശാസൂചനയും πᾶν πονηρόν എന്ന പ്രയോഗത്തിന്റെ വ്യാപകതയും വ്യക്തമാക്കുന്നു.
- source_word: ψευδόμενοι
  choice: കള്ളമായി
  rationale: അവർ പറയുന്ന ദോഷകാര്യങ്ങൾ അസത്യമാണെന്ന് സ്വാഭാവികമായ ക്രിയാവിശേഷണരൂപത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἕνεκεν ἐμοῦ
  choice: എന്നെ നിമിത്തം
  rationale: യേശുവുമായുള്ള ബന്ധമാണ് ഈ എതിർപ്പിനു കാരണമെന്ന് വ്യക്തമായി അറിയിക്കുകയും മൂലപാഠത്തിലെ കാരണസൂചന നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: വിവരിക്കപ്പെടുന്ന എതിർപ്പിന്റെ സ്വഭാവം
  choice: യേശുവിനെ നിമിത്തം നേരിടുന്ന അധിക്ഷേപം, പീഡനം, വ്യാജമായ ദുഷ്പ്രചാരണം എന്നിവയുടെ വിശാലത നിലനിർത്തി.
  alternative: പീഡനത്തെ ശാരീരിക അക്രമത്തിലേക്കു മാത്രം, അല്ലെങ്കിൽ മുഴുവൻ എതിർപ്പിനെയും അപവാദത്തിലേക്കു മാത്രം ചുരുക്കുക.
  rationale: പരസ്പരം ബന്ധിപ്പിച്ചിരിക്കുന്ന മൂന്നു ക്രിയകളും വ്യത്യസ്തവും പരസ്പരം മൂടിപ്പോകാവുന്നതുമായ ശത്രുതാരൂപങ്ങൾ സൂചിപ്പിക്കുന്നു; മൂലപാഠം അവയെ ഏതെങ്കിലും ഒരൊറ്റ രൂപത്തിലേക്ക് ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. അനുഗ്രഹവാക്യത്തിന്റെ ഗൗരവം നിലനിർത്താൻ “അനുഗൃഹീതർ” ഉപയോഗിച്ചു; ശത്രുതയുടെ വിവിധ രൂപങ്ങളെ ചുരുക്കാതെ വാക്യം നേരിട്ടും സ്വാഭാവികവുമായി സൂക്ഷിച്ചു.
