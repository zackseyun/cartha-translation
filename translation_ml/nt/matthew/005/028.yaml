id: MAT.5.28
reference: Matthew 5:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι πᾶς ὁ βλέπων γυναῖκα πρὸς τὸ ἐπιθυμῆσαι αὐτὴν ἤδη ἐμοίχευσεν αὐτὴν ἐν τῇ καρδίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/028.yaml
  text: But I say to you that everyone who looks at a woman in order to desire her has already committed adultery with her in his heart[a][b][c].
translation:
  language: ml
  text: 'എന്നാൽ ഞാൻ നിങ്ങളോടു പറയുന്നു: ഒരു സ്ത്രീയെ അവളെ മോഹിക്കണമെന്ന ഉദ്ദേശ്യത്തോടെ നോക്കുന്ന ഏവനും തന്റെ ഹൃദയത്തിൽ അവളുമായി ഇതിനകം വ്യഭിചാരം ചെയ്തിരിക്കുന്നു.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സ്ത്രീ’ എന്നതിനുപകരം ‘ഭാര്യ’ എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്ക് γυνή എന്ന പദത്തിന് സന്ദർഭമനുസരിച്ച് രണ്ടർഥവും വരാം.
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: ‘ഒരു സ്ത്രീയെ അവളെ കാമത്തോടെ ആഗ്രഹിക്കണമെന്ന ഉദ്ദേശ്യത്തോടെ നോക്കുന്ന ഏവനും.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: എന്നാൽ ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: δέ സൂചിപ്പിക്കുന്ന വൈരുധ്യവും ἐγώ നൽകുന്ന ഊന്നലും നിലനിർത്തുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: πᾶς ὁ βλέπων
  choice: നോക്കുന്ന ഏവനും
  rationale: πᾶς എന്നതിന്റെ സർവസാധാരണ വ്യാപ്തി ലിംഗം അനാവശ്യമായി കൂടുതൽ വ്യക്തമാക്കാതെ പ്രകടിപ്പിക്കുന്നു.
- source_word: γυναῖκα
  choice: ഒരു സ്ത്രീയെ
  rationale: γυνή എന്ന പദത്തിന് സന്ദർഭമനുസരിച്ച് ‘സ്ത്രീ’ എന്നും ‘ഭാര്യ’ എന്നും അർഥമാകാം. ഗ്രീക്ക് ഇവിടെ വിവാഹസ്ഥിതി വ്യക്തമാക്കാത്തതിനാൽ വിശാലമായ അർഥം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു.
- source_word: πρὸς τὸ ἐπιθυμῆσαι αὐτὴν
  choice: അവളെ മോഹിക്കാനായി
  rationale: πρὸς + articular infinitive സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യഭാവം ‘-ആനായി’ എന്ന പ്രയോഗത്തിലൂടെ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു. ‘മോഹിക്കുക’ ἐπιθυμέωയുടെ ആഗ്രഹഭാവത്തെയും ഈ സന്ദർഭത്തിലെ തെറ്റായ ലൈംഗിക ആഗ്രഹത്തെയും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἤδη ἐμοίχευσεν αὐτὴν
  choice: അവളുമായി ഇതിനകം വ്യഭിചാരം ചെയ്തിരിക്കുന്നു
  rationale: ἤδη എന്നതിന്റെ ‘ഇതിനകം’ എന്ന കാല-നൈതിക ഊന്നൽ കാത്തുസൂക്ഷിക്കുകയും μοιχεύωയെ സാധാരണ മലയാളത്തിലെ ‘വ്യഭിചാരം ചെയ്യുക’ എന്നു നൽകുകയും ചെയ്യുന്നു.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: തന്റെ ഹൃദയത്തിൽ
  rationale: കർതൃബന്ധം മലയാളത്തിൽ വ്യക്തമായി കാണിക്കാൻ ‘തന്റെ’ ഉപയോഗിക്കുന്നു; ‘ഹൃദയം’ ചിന്തയും ആഗ്രഹവും ഉൾപ്പെടുന്ന ആന്തരിക വ്യക്തിത്വത്തെ സൂചിപ്പിക്കുന്ന ബൈബിൾ രൂപകം നിലനിർത്തുന്നു.
theological_decisions:
- issue: γυνή എന്നത് ‘സ്ത്രീ’ എന്നോ ‘ഭാര്യ’ എന്നോ പരിഭാഷപ്പെടുത്തണമോ
  choice: സ്ത്രീ
  alternative: ഭാര്യ
  rationale: വ്യഭിചാരത്തിന്റെ സന്ദർഭം വിവാഹബന്ധത്തെ ഓർമിപ്പിച്ചാലും, മൂലപാഠം സ്ത്രീയുടെ വിവാഹസ്ഥിതി തുറന്നുപറയുന്നില്ല. അതിനാൽ പ്രസ്താവനയെ അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- issue: ἐπιθυμέω എന്നത് വിശാലമായ ‘മോഹിക്കുക’ എന്നോ കൂടുതൽ വ്യക്തമായ ‘കാമാസക്തിയോടെ ആഗ്രഹിക്കുക’ എന്നോ നൽകണമോ
  choice: മോഹിക്കുക
  alternative: കാമാസക്തിയോടെ ആഗ്രഹിക്കുക
  rationale: ക്രിയയുടെ വിശാലമായ പദാർഥം നിലനിർത്തുന്നു; ചുറ്റുമുള്ള വ്യഭിചാരഭാഷ ഇവിടെ തെറ്റായ ലൈംഗിക മോഹമാണെന്ന് വ്യക്തമാക്കുന്നു.
- issue: πρὸς τὸ ἐπιθυμῆσαι എന്നതിലെ ഉദ്ദേശ്യഭാവം നിലനിർത്തണമോ, നോക്കലിന്റെ രീതിയായി മാത്രം നൽകണമോ
  choice: അവളെ മോഹിക്കാനായി
  alternative: മോഹത്തോടെ
  rationale: ഗ്രീക്ക് ഘടന നോക്കലിന്റെ ലക്ഷ്യമോ ഉദ്ദേശ്യമോ മുന്നോട്ടുവയ്ക്കുന്നു. ‘മോഹത്തോടെ’ കൂടുതൽ ലളിതമായിരുന്നാലും ആ ഘടനയെ രീതിവാചകമാക്കി മാറ്റും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടനയാണ് ഉപയോഗിച്ചത്. ഉദ്ദേശ്യഭാവം നിലനിർത്താൻ ‘മോഹിക്കാനായി’ തെരഞ്ഞെടുത്തു; പരമ്പരാഗത ബൈബിൾ പദമായ ‘വ്യഭിചാരം’ സാധാരണ വായനക്കാർക്കും വ്യക്തമായതിനാൽ നിലനിർത്തി.
