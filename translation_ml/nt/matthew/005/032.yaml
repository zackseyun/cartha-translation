id: MAT.5.32
reference: Matthew 5:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι ⸂πᾶς ὁ ἀπολύων⸃ τὴν γυναῖκα αὐτοῦ παρεκτὸς λόγου πορνείας ποιεῖ αὐτὴν ⸀μοιχευθῆναι, καὶ ὃς ἐὰν ἀπολελυμένην γαμήσῃ μοιχᾶται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/032.yaml
  text: But I say to you that everyone who divorces his wife[a], except on the ground of sexual immorality, makes her commit adultery[b]; and whoever marries a divorced woman commits adultery.
translation:
  language: ml
  text: 'എന്നാൽ ഞാൻ നിങ്ങളോടു പറയുന്നു: ലൈംഗിക അധാർമികതയുടെ അടിസ്ഥാനത്തിലല്ലാതെ സ്വന്തം ഭാര്യയെ വിവാഹമോചനം ചെയ്യുന്ന ഏവനും അവളെ വ്യഭിചാരം ചെയ്യാൻ ഇടയാക്കുന്നു[b]; വിവാഹമോചിതയായ ഒരു സ്ത്രീയെ വിവാഹം ചെയ്യുന്നവനും വ്യഭിചാരം ചെയ്യുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, ‘അവൾ വ്യഭിചാരിണിയായിത്തീരാൻ ഇടയാക്കുന്നു.’ ഗ്രീക്ക് ക്രിയാരൂപം കർമണിയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολύων / ἀπολελυμένην
  choice: വിവാഹമോചനം ചെയ്യുന്ന / വിവാഹമോചിതയായ
  rationale: വിവാഹബന്ധത്തിന്റെ പശ്ചാത്തലത്തിൽ ἀπολύω എന്നതിന് പൊതുവായ ‘പറഞ്ഞയയ്ക്കുക’ എന്നതിലുപരി നിയമ-വൈവാഹിക അർഥമായ ‘വിവാഹമോചനം ചെയ്യുക’ എന്നതാണ് ഉചിതം. രണ്ടു രൂപങ്ങളിലും ഒരേ അർഥബന്ധം നിലനിർത്തുന്നു.
- source_word: γυναῖκα
  choice: ഭാര്യ
  rationale: γυνή എന്നതിന് ‘സ്ത്രീ’ എന്നും ‘ഭാര്യ’ എന്നും അർഥമുണ്ടെങ്കിലും, αὐτοῦ എന്ന ഉടമസ്ഥസൂചനയും വിവാഹമോചനസന്ദർഭവും ഇവിടെ ‘ഭാര്യ’ ആവശ്യപ്പെടുന്നു.
- source_word: παρεκτὸς λόγου πορνείας
  choice: ലൈംഗിക അധാർമികത എന്ന കാരണമൊഴികെ
  rationale: παρεκτός ഒരു യഥാർഥ ഒഴിവ് സൂചിപ്പിക്കുന്നു; λόγος ഇവിടെ കാരണം/അടിസ്ഥാനം എന്ന അർഥത്തിലാണ്. πορνεία നിരോധിതമായ വിവിധ ലൈംഗിക പ്രവൃത്തികളെ ഉൾക്കൊള്ളുന്ന വിശാലപദമായതിനാൽ അതിനെ വ്യഭിചാരത്തിലേക്ക് മാത്രം ചുരുക്കാതെ ‘ലൈംഗിക അധാർമികത’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: ποιεῖ αὐτὴν μοιχευθῆναι
  choice: അവളെ വ്യഭിചാരം ചെയ്യാൻ ഇടയാക്കുന്നു
  rationale: ποιέω + infinitive എന്ന ഘടന കാരണമാകുക/ഇടയാക്കുക എന്ന അർഥം നൽകുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ മുഖ്യവാചകം നൽകിയിരിക്കുമ്പോഴും, μοιχευθῆναι രൂപത്തിൽ കർമണി ആയതിനാൽ അതിന്റെ ഫലസൂചകമായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: ὃς ἐὰν ... γαμήσῃ
  choice: വിവാഹം ചെയ്യുന്നവൻ
  rationale: ἐάν ചേർന്ന അനിശ്ചിത ബന്ധവാക്യം പൊതുവായ വ്യവസ്ഥയാണ് സൂചിപ്പിക്കുന്നത്; ‘ചെയ്യുന്നവൻ’ അത് ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: μοιχᾶται
  choice: വ്യഭിചാരം ചെയ്യുന്നു
  rationale: വർത്തമാനകാല മധ്യ/കർമണി രൂപത്തിന്റെ സന്ദർഭോചിതവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗമാണിത്.
- source_word: πᾶς ὁ ἀπολύων
  choice: വിവാഹമോചനം ചെയ്യുന്ന ഏവനും
  rationale: പുരുഷലിംഗ ഏകവചന കൃദന്തരൂപം ഇവിടെ പൊതുവായ വിഭാഗത്തെ സൂചിപ്പിക്കുന്നു. ‘ഏവനും’ ആ പൊതുവ്യാപ്തി നൽകുന്നു; ‘സ്വന്തം ഭാര്യ’ എന്നത് സാമൂഹിക-വൈവാഹിക പശ്ചാത്തലം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: παρεκτὸς λόγου πορνείας എന്ന ഒഴിവുവാക്യത്തിന്റെ വ്യാപ്തി
  choice: ‘ലൈംഗിക അധാർമികത എന്ന കാരണമൊഴികെ’ എന്ന് യഥാർഥ ഒഴിവായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘അവിഹിതവിവാഹത്തിന്റെ സാഹചര്യത്തിലൊഴികെ’ എന്നിങ്ങനെ πορνείαയുടെ അർഥം ഒരു പ്രത്യേക സാഹചര്യത്തിലേക്ക് ചുരുക്കുക.
  rationale: ഗ്രീക്ക് വാക്യം വ്യക്തമായി ഒരു ഒഴിവ് അവതരിപ്പിക്കുന്നു; എന്നാൽ πορνείαയുടെ കൃത്യമായ പരിധി വാക്യം തന്നെ നിർവചിക്കുന്നില്ല. അതിനാൽ ഒഴിവിനെ മറയ്ക്കാതെയും അതിന്റെ വ്യാപ്തി സിദ്ധാന്തപരമായി മുൻകൂട്ടി തീരുമാനിക്കാതെയും പരിഭാഷപ്പെടുത്തി.
- issue: ποιεῖ αὐτὴν μοιχευθῆναι എന്നതിലെ കർമണി രൂപത്തിന്റെ ശക്തി
  choice: മുഖ്യവാചകത്തിൽ ‘അവളെ വ്യഭിചാരം ചെയ്യാൻ ഇടയാക്കുന്നു’ എന്ന സ്വാഭാവിക പ്രയോഗം നൽകി; കർമണി/ഫലസൂചക സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
  alternative: ‘അവൾ വ്യഭിചാരിണിയായിത്തീരാൻ ഇടയാക്കുന്നു’ എന്ന് മുഖ്യവാചകത്തിൽ നൽകുക.
  rationale: μοιχευθῆναι വ്യാകരണരൂപത്തിൽ കർമണിയാണെങ്കിലും, ഈ ഘടന സജീവപ്രവൃത്തിയെയോ ഉണ്ടായിത്തീരുന്ന നിലയെയോ മുൻനിർത്തുന്നുവോ എന്നതിൽ വ്യാഖ്യാനവ്യത്യാസമുണ്ട്. വ്യക്തതയ്ക്കൊപ്പം ആ സംഘർഷവും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള ശൈലി സ്വീകരിച്ചു. നിയമ-വൈവാഹിക ആശയത്തിന് ‘വിവാഹമോചനം’ എന്നും വിശാലമായ ലൈംഗിക നൈതികപദത്തിന് ‘ലൈംഗിക അധാർമികത’ എന്നും ഉപയോഗിച്ചു. വാക്യത്തിന്റെ കഠിനമായ ദൈവശാസ്ത്രപരമായ ഉന്നയിപ്പുകൾ വിശദീകരിച്ച് ലഘൂകരിക്കാതെ നിലനിർത്തി.
