source:
  edition: SBLGNT
  text: Μακάριοι οἱ πτωχοὶ τῷ πνεύματι, ὅτι αὐτῶν ἐστιν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/003.yaml
  text: Blessed are the poor in spirit[c][b][a], because the kingdom of heaven is theirs.
translation:
  language: ml
  text: “ആത്മാവിൽ ദരിദ്രരായവർ[b] അനുഗൃഹീതർ[a]; എന്തെന്നാൽ സ്വർഗരാജ്യം[c] അവരുടേതാണ്.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഭാഗ്യവാന്മാർ’, ‘സൗഭാഗ്യശാലികൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കുപദം വെറും സന്തോഷവികാരമല്ല, ദൈവിക പ്രസാദത്താൽ ലഭിക്കുന്ന അഭിലഷണീയമായ നിലയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘ആത്മാവിൽ ദരിദ്രർ’ എന്നത് ‘ആത്മീയമായി ദരിദ്രർ’ എന്നോ ‘തങ്ങളുടെ ആത്മീയ ആവശ്യം തിരിച്ചറിയുന്നവർ’ എന്നോ മനസ്സിലാക്കാം. ഗ്രീക്കിലെ തുറന്ന പ്രയോഗം അർഥം ചുരുക്കാതെ മുഖ്യപാഠത്തിൽ നിലനിർത്തിയിരിക്കുന്നു.
    reason: alternative_reading
  - marker: c
    text: അക്ഷരാർഥത്തിൽ ‘സ്വർഗങ്ങളുടെ രാജ്യം’; മത്തായിയുടെ സവിശേഷമായ ഈ പ്രയോഗം പതിവായി ‘സ്വർഗരാജ്യം’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μακάριοι
  choice: അനുഗൃഹീതർ
  rationale: ദൈവിക പ്രസാദത്താൽ ലഭിക്കുന്ന അഭിലഷണീയമായ നിലയെ സൂചിപ്പിക്കുന്നു; വെറും സന്തോഷവികാരമായി അർഥം ചുരുക്കുന്നില്ല.
- source_word: οἱ πτωχοὶ
  choice: ദരിദ്രരായവർ
  rationale: നാമപദമായി ഉപയോഗിച്ചിരിക്കുന്ന വിശേഷണത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ‘യാചകർ’ എന്നത് ഇവിടെ അത്യന്തം സങ്കുചിതമാണ്.
- source_word: τῷ πνεύματι
  choice: ആത്മാവിൽ
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തമായ ദത്തിവ് പ്രയോഗത്തിന്റെ വ്യാഖ്യാനതുറവ് നിലനിർത്തുന്നു; ‘ആത്മീയ ആവശ്യങ്ങൾ തിരിച്ചറിയുന്നവർ’ എന്ന വിശദീകരണം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: ὅτι
  choice: എന്തെന്നാൽ
  rationale: തുടർന്നുവരുന്നത് അനുഗൃഹീതാവസ്ഥയുടെ കാരണമാണെന്ന് വ്യക്തമായി സൂചിപ്പിക്കുന്ന, മാന്യവും സ്വാഭാവികവുമായ ബന്ധപദം.
- source_word: αὐτῶν ἐστιν
  choice: അവരുടേതാണ്
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാലവും ഉടമസ്ഥതയ്ക്ക് നൽകിയ ഊന്നലും മലയാളത്തിൽ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: സ്വർഗരാജ്യം
  rationale: രാജ്യം എന്നത് രാജകീയ ഭരണവും അതിന്റെ മണ്ഡലവും ഉൾക്കൊള്ളാൻ കഴിയുന്ന സ്ഥാപിത പദമാണ്; ഗ്രീക്കിലെ ബഹുവചനരൂപം മലയാളത്തിലെ സ്വാഭാവികവും സുപരിചിതവുമായ ഏകവചന സമാസത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ‘ആത്മാവിൽ ദരിദ്രർ’ എന്നതിന്റെ അർഥം
  choice: ‘ആത്മാവിൽ ദരിദ്രരായവർ’ എന്ന തുറന്ന പ്രയോഗം നിലനിർത്തി.
  alternative: ‘ആത്മീയമായി ദരിദ്രർ’, ‘വിനയമുള്ളവർ’, അല്ലെങ്കിൽ ‘തങ്ങളുടെ ആത്മീയ ആവശ്യം തിരിച്ചറിയുന്നവർ’.
  rationale: മൂലവാക്യം വ്യാഖ്യാനസമ്പന്നവും ഒരു പരിധിവരെ തുറന്നതുമാണ്. വിശദീകരിച്ചുപറയുന്നത് ഗ്രീക്ക് വ്യക്തമാക്കാതെ വിടുന്ന ദൈവശാസ്ത്രപരമായ സാധ്യതകളിൽ ഒന്ന് മാത്രം തിരഞ്ഞെടുക്കും.
- issue: രാജ്യത്തിന്റെ ഉടമസ്ഥതയുടെ കാലം
  choice: വർത്തമാനകാലത്തിൽ ‘അവരുടേതാണ്’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘അവരുടേതായിരിക്കും’.
  rationale: ἐστιν വർത്തമാനകാലത്തിലാണ്; അതിനെ ഭാവികാല പ്രതിഫലമായി മാത്രം മാറ്റുന്നത് മൂലപാഠത്തിന്റെ ബലം ചുരുക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘അനുഗൃഹീതർ’ ദൈവിക അനുഗ്രഹത്തിന്റെ ആശയം നിലനിർത്തുന്നു; ‘ആത്മാവിൽ ദരിദ്രരായവർ’ എന്ന രൂപം പരിചിതമായ വ്യാഖ്യാനങ്ങളിലൊന്നിലേക്ക് പാഠത്തെ ചുരുക്കുന്നില്ല.
