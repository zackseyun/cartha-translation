id: MAT.5.16
reference: Matthew 5:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὕτως λαμψάτω τὸ φῶς ὑμῶν ἔμπροσθεν τῶν ἀνθρώπων, ὅπως ἴδωσιν ὑμῶν τὰ καλὰ ἔργα καὶ δοξάσωσιν τὸν πατέρα ὑμῶν τὸν ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/016.yaml
  text: In the same way[a], let your light shine before men[b], so that they may see your good works and glorify your Father who is in the heavens.
translation:
  language: ml
  text: അതുപോലെ, നിങ്ങളുടെ വെളിച്ചം മനുഷ്യരുടെ മുമ്പിൽ പ്രകാശിക്കട്ടെ. അങ്ങനെ അവർ നിങ്ങളുടെ നല്ല പ്രവൃത്തികൾ കണ്ട് സ്വർഗങ്ങളിലുള്ള[a] നിങ്ങളുടെ പിതാവിനെ മഹത്ത്വപ്പെടുത്തട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സ്വർഗത്തിലുള്ള.’ ഗ്രീക്കിൽ ‘സ്വർഗങ്ങൾ’ എന്ന ബഹുവചനമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: അതുപോലെ
  rationale: മുൻവാക്യങ്ങളിലെ വിളക്കിന്റെയും വെളിച്ചത്തിന്റെയും ദൃഷ്ടാന്തവുമായി ഈ കല്പനയെ ബന്ധിപ്പിക്കുകയും രീതിയെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: λαμψάτω
  choice: പ്രകാശിക്കട്ടെ
  rationale: മൂന്നാം പുരുഷ ഏകവചനത്തിലുള്ള കല്പനയുടെ ശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τὸ φῶς ὑμῶν
  choice: നിങ്ങളുടെ വെളിച്ചം
  rationale: ഗ്രീക്കിലെ ഏകവചനവും ശിഷ്യരുടെ കൂട്ടായ ദൃശ്യസാക്ഷ്യം സൂചിപ്പിക്കുന്ന ഉടമസ്ഥരൂപവും നിലനിർത്തുന്നു.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: മനുഷ്യരുടെ മുമ്പിൽ
  rationale: ἀνθρώπων ഇവിടെ സ്ത്രീപുരുഷഭേദമില്ലാതെ മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘മനുഷ്യർ’ ഈ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὅπως
  choice: അങ്ങനെ
  rationale: തുടർന്നുള്ള പ്രവൃത്തികളുടെ ഉദ്ദേശ്യം/ഫലം മലയാളത്തിൽ വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: ἴδωσιν
  choice: കണ്ട്
  rationale: ὅπως-നോടു ചേർന്ന ഉപവാക്യത്തിന്റെ ആശ്രിതസ്വഭാവം സ്വാഭാവിക മലയാള വാക്യഘടനയിൽ നൽകുന്നു.
- source_word: τὰ καλὰ ἔργα
  choice: നിങ്ങളുടെ നല്ല പ്രവൃത്തികൾ
  rationale: καλά എന്നതിലെ നല്ലത്, ശ്രേഷ്ഠം, പ്രശംസനീയം എന്നീ ആശയങ്ങളിൽ സന്ദർഭത്തിന് ഏറ്റവും വ്യക്തവും പതിവുമായ പ്രയോഗം.
- source_word: δοξάσωσιν
  choice: മഹത്ത്വപ്പെടുത്തട്ടെ
  rationale: ദൈവത്തോടു ബന്ധപ്പെട്ട δοξάζωയുടെ ദൈവശാസ്ത്രപരമായ ഭാരവും ഉദ്ദേശ്യസൂചനയും നിലനിർത്തുന്നു.
- source_word: τὸν πατέρα ὑμῶν
  choice: നിങ്ങളുടെ പിതാവിനെ
  rationale: മത്തായിയുടെ സുവിശേഷത്തിലെ പ്രധാന ബന്ധഭാഷ സ്വാഭാവിക ഉടമസ്ഥരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: τὸν ἐν τοῖς οὐρανοῖς
  choice: സ്വർഗങ്ങളിലുള്ള
  rationale: മൂലപാഠത്തിലെ οὐρανοῖς എന്ന ബഹുവചനം നിലനിർത്തുന്നു; മലയാളത്തിൽ അല്പം അസാധാരണമായിരുന്നാലും അർഥം വ്യക്തമാണ്.
theological_decisions:
- issue: ἀνθρώπων എന്ന പദത്തിന്റെ പൊതുവായ മനുഷ്യസൂചന
  choice: മനുഷ്യരുടെ മുമ്പിൽ
  alternative: ആളുകളുടെ മുമ്പിൽ / മറ്റുള്ളവരുടെ മുമ്പിൽ
  rationale: ഗ്രീക്ക് പദം ഈ സന്ദർഭത്തിൽ പുരുഷന്മാരെ മാത്രം അല്ല, മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു. ‘മനുഷ്യർ’ ലിംഗപരമായി ഉൾക്കൊള്ളുന്നതും മൂലപദത്തോട് അടുത്തതുമാണ്.
- issue: οὐρανοῖς എന്ന ബഹുവചനം
  choice: സ്വർഗങ്ങളിലുള്ള
  alternative: സ്വർഗത്തിലുള്ള
  rationale: മൂലഗ്രീക്കിലെ ബഹുവചനം പ്രധാനപാഠത്തിൽ സംരക്ഷിക്കുന്നു; പതിവായ മലയാള ഏകവചനരൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: നല്ല പ്രവൃത്തികൾ കാണുന്നതിന്റെ അന്തിമലക്ഷ്യം
  choice: പിതാവിനെ മഹത്ത്വപ്പെടുത്തട്ടെ
  alternative: പിതാവിന് മഹത്ത്വം നൽകട്ടെ
  rationale: 'വാക്യത്തിലെ ഉദ്ദേശ്യക്രമം സംരക്ഷിക്കുന്നു: ശിഷ്യരുടെ പ്രവൃത്തികൾ അവരിലേക്കല്ല, പിതാവിലേക്കാണ് മഹത്ത്വം നയിക്കേണ്ടത്.'
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘പ്രകാശിക്കട്ടെ,’ ‘നല്ല പ്രവൃത്തികൾ,’ ‘മഹത്ത്വപ്പെടുത്തട്ടെ’ എന്നീ പരിചിതമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തിയപ്പോൾ, വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി ക്രമപ്പെടുത്തി.
