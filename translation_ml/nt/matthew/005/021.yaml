id: MAT.5.21
reference: Matthew 5:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἠκούσατε ὅτι ἐρρέθη τοῖς ἀρχαίοις· Οὐ φονεύσεις· ὃς δ’ ἂν φονεύσῃ, ἔνοχος ἔσται τῇ κρίσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/021.yaml
  text: You have heard that it was said to the ancients[a], ‘You shall not murder[c][b]; and whoever murders will be liable to judgment.’
translation:
  language: ml
  text: പണ്ടുള്ളവരോട്[a], ‘കൊല ചെയ്യരുത്; കൊല ചെയ്യുന്നവൻ ന്യായവിധിക്കു വിധേയനാകും’ എന്ന് പറയപ്പെട്ടതായി നിങ്ങൾ കേട്ടിട്ടുണ്ട്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പഴയകാലത്തെ ആളുകളോട്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἠκούσατε
  choice: നിങ്ങൾ കേട്ടിട്ടുണ്ടല്ലോ
  rationale: പ്രഭാഷണത്തിലെ ഈ സൂത്രവാക്യം, ശ്രോതാക്കൾ സ്വീകരിച്ചുപോന്ന ഉപദേശത്തെ സൂചിപ്പിക്കുന്നതിനാൽ, മലയാളത്തിൽ വർത്തമാനപ്രസക്തിയുള്ള ഭൂതകാലരൂപത്തിൽ സ്വാഭാവികമായി നൽകി.
- source_word: ἐρρέθη
  choice: അരുളിച്ചെയ്തതായി
  rationale: ദൈവിക കല്പന ഉദ്ധരിക്കുന്ന സന്ദർഭത്തിൽ സ്വാഭാവികവും മാന്യവുമായ നിഷ്ക്രിയാർഥം നൽകുന്നു; ആരാണ് പറഞ്ഞതെന്ന് വാക്യത്തിൽ പുതുതായി വ്യക്തമാക്കുന്നില്ല.
- source_word: τοῖς ἀρχαίοις
  choice: പണ്ടുള്ളവരോട്
  rationale: ദത്തിവ് ഇവിടെ പഴയകാലത്തെ ആളുകളെ വചനത്തിന്റെ സ്വീകർത്താക്കളായി സൂചിപ്പിക്കുന്നു; ‘പണ്ടുള്ളവരോട്’ ആ ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: Οὐ φονεύσεις
  choice: കൊല ചെയ്യരുത്
  rationale: φονεύω പൊതുവായ ‘കൊല്ലുക’ എന്നതിനെക്കാൾ അന്യായമായ മനുഷ്യവധത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘കൊല ചെയ്യുക’ ആ ചുരുങ്ങിയ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: ὃς δ’ ἂν φονεύσῃ
  choice: കൊല ചെയ്യുന്നവൻ
  rationale: ἄν സഹിതമുള്ള അനിശ്ചിത പൊതുനിബന്ധനയെ സ്വാഭാവികമായ മലയാള പൊതുപ്രസ്താവനയായി അവതരിപ്പിക്കുന്നു.
- source_word: ἔνοχος ἔσται τῇ κρίσει
  choice: ന്യായവിധിക്കു വിധേയനാകും
  rationale: നിയമപരമായി വിധിന്യായത്തിന് ഉത്തരവാദിയും അതിന്റെ പരിധിയിൽപ്പെടുന്നവനുമാകുക എന്ന അർഥം നൽകുന്നു; κρίσις കോടതിയെയോ ശിക്ഷാവിധിയെയോ മാത്രം എന്ന് അതിയായി നിർണ്ണയിക്കുന്നില്ല.
theological_decisions:
- issue: ആറാം കല്പനയിലെ φονεύω എന്ന ക്രിയയുടെ പരിധി
  choice: കൊല ചെയ്യരുത്
  alternative: കൊല്ലരുത്
  rationale: ഗ്രീക്ക് ക്രിയ എല്ലാ തരത്തിലുള്ള കൊല്ലലിനെയും പൊതുവായി നിരോധിക്കുന്നതല്ല; കൊലപാതകത്തെയാണ് പ്രത്യേകമായി സൂചിപ്പിക്കുന്നത്. അതിനാൽ വിശാലമായ ‘കൊല്ലരുത്’ എന്ന പരമ്പരാഗത രൂപം ഒഴിവാക്കി.
- issue: ἐρρέθη എന്ന നിഷ്ക്രിയരൂപത്തിലെ സംസാരിക്കുന്നവൻ
  choice: അരുളിച്ചെയ്തതായി
  alternative: ദൈവം അരുളിച്ചെയ്തതായി
  rationale: സന്ദർഭം ദൈവിക കല്പനയെ സൂചിപ്പിക്കുന്നുവെങ്കിലും ഗ്രീക്ക് വാക്യം കർത്താവിനെ തുറന്നുപറയുന്നില്ല; അതിനാൽ ‘ദൈവം’ എന്ന് ചേർക്കാതെ നിഷ്ക്രിയത്വം സംരക്ഷിച്ചു.
- issue: τῇ κρίσει എന്നതിന്റെ കൃത്യമായ സൂചന
  choice: ന്യായവിധിക്കു
  alternative: ന്യായസഭയ്ക്ക് / ശിക്ഷാവിധിക്ക്
  rationale: പദത്തിന് വിധിന്യായം, ന്യായനടപടി, കോടതി എന്നീ ബന്ധമുള്ള അർഥങ്ങൾ ഉണ്ടാകാം. പ്രത്യേക സ്ഥാപനമോ അന്തിമശിക്ഷയോ എന്ന് നിർബന്ധിച്ച് തീരുമാനിക്കാതെ മൂലത്തിലെ വ്യാപ്തി നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഉദ്ധരിച്ച കല്പനയും അതിന്റെ നിയമപരമായ ഫലവും ഒരൊറ്റ ഉദ്ധരണിയായി അർധവിരാമത്തോടെ നൽകിയിരിക്കുന്നു. ‘കേട്ടിട്ടുണ്ടല്ലോ’ എന്നത് ഗ്രീക്ക് പ്രഭാഷണസൂത്രത്തിന്റെ ഓർമ്മിപ്പിക്കുന്ന ഭാവം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
