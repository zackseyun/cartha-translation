id: MAT.5.12
reference: Matthew 5:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: χαίρετε καὶ ἀγαλλιᾶσθε, ὅτι ὁ μισθὸς ὑμῶν πολὺς ἐν τοῖς οὐρανοῖς· οὕτως γὰρ ἐδίωξαν τοὺς προφήτας τοὺς πρὸ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/012.yaml
  text: Rejoice and be very glad[a], because your reward is great in the heavens; for in this way they persecuted the prophets who were before you.
translation:
  language: ml
  text: സന്തോഷിക്കുവിൻ; അത്യന്തം ആനന്ദിക്കുവിൻ. എന്തെന്നാൽ, സ്വർഗത്തിൽ[a] നിങ്ങളുടെ പ്രതിഫലം വലുതാണ്. നിങ്ങൾക്കുമുമ്പുണ്ടായിരുന്ന പ്രവാചകന്മാരെയും അവർ ഇങ്ങനെതന്നെയാണ് പീഡിപ്പിച്ചത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘സ്വർഗങ്ങളിൽ’; മത്തായി പലപ്പോഴും ഈ പദത്തിന്റെ ബഹുവചനരൂപം ഉപയോഗിക്കുന്നു.
    reason: മലയാളത്തിൽ സ്വാഭാവികമായ ഏകവചനം ഉപയോഗിക്കുമ്പോഴും ഗ്രീക്ക് മൂലത്തിലെ ബഹുവചനരൂപം വായനക്കാരനെ അറിയിക്കാൻ.
lexical_decisions:
- source_word: χαίρετε
  choice: സന്തോഷിക്കുവിൻ
  rationale: വർത്തമാനകാല ബഹുവചന ആജ്ഞാരൂപം സജീവമായി സന്തോഷിക്കാൻ ആഹ്വാനം ചെയ്യുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: ἀγαλλιᾶσθε
  choice: അത്യന്തം ആനന്ദിക്കുവിൻ
  rationale: χαίρετε എന്നതിനെക്കാൾ തീവ്രമായ, കവിഞ്ഞൊഴുകുന്ന ആനന്ദം സൂചിപ്പിക്കുന്നതിനാൽ തീവ്രത നിലനിർത്തി ലളിതമായി വിവർത്തനം ചെയ്തു.
- source_word: μισθὸς
  choice: പ്രതിഫലം
  rationale: പദത്തിന് കൂലി എന്നും അർഥമുണ്ടെങ്കിലും, പീഡനം സഹിക്കുന്നവർക്കുള്ള ദൈവിക പ്രതിഫലമാണ് സന്ദർഭം; വാണിജ്യ ഇടപാടിന്റെ ധ്വനി ഒഴിവാക്കാൻ ‘പ്രതിഫലം’ അനുയോജ്യം.
- source_word: πολὺς
  choice: വലുതാണ്
  rationale: പ്രതിഫലത്തിന്റെ മഹത്ത്വമോ അളവോ ഊന്നിപ്പറയുന്ന വിധത്തിൽ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകിയിരിക്കുന്നു.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: സ്വർഗത്തിൽ[a]
  rationale: ഗ്രീക്കിൽ ബഹുവചനമാണെങ്കിലും മത്തായിയുടെ സെമിറ്റിക് സ്വാധീനമുള്ള പ്രയോഗത്തിന് മലയാളത്തിൽ സാധാരണ ഏകവചനമായ ‘സ്വർഗത്തിൽ’ സ്വാഭാവികമാണ്; മൂലരൂപം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
- source_word: οὕτως
  choice: ഇങ്ങനെതന്നെ
  rationale: ശിഷ്യന്മാർ നേരിടുന്ന പീഡനരീതിയും മുൻകാല പ്രവാചകന്മാർ നേരിട്ടതും തമ്മിലുള്ള സാമ്യം വ്യക്തമാക്കുന്നു.
- source_word: ἐδίωξαν
  choice: പീഡിപ്പിച്ചു
  rationale: സന്ദർഭത്തിൽ διώκω എന്നത് പിന്തുടരുക എന്ന പൊതുവർഥത്തിലല്ല, ശത്രുതാപരമായി ഉപദ്രവിക്കുക എന്ന അർഥത്തിലാണ്.
- source_word: τοὺς προφήτας τοὺς πρὸ ὑμῶν
  choice: നിങ്ങൾക്കുമുമ്പുണ്ടായിരുന്ന പ്രവാചകന്മാരെ
  rationale: ചരിത്രപരമായി ശിഷ്യന്മാർക്കു മുമ്പുണ്ടായിരുന്ന പ്രവാചകന്മാരെയാണ് ഈ വിശേഷണം സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: ‘സ്വർഗത്തിൽ’ എന്നതിന്റെ ഏകവചനവും ഗ്രീക്ക് മൂലത്തിലെ ബഹുവചനവും
  choice: പ്രധാന വാക്യത്തിൽ മലയാളത്തിലെ സ്വാഭാവിക ഏകവചനമായ ‘സ്വർഗത്തിൽ’ ഉപയോഗിച്ചു.
  alternative: ‘സ്വർഗങ്ങളിൽ’ എന്ന ഔപചാരികമായി അക്ഷരാനുസൃതമായ വിവർത്തനം.
  rationale: ഇത് ദൈവശാസ്ത്രപരമായ വ്യത്യാസം തീർപ്പാക്കുന്ന തീരുമാനമല്ല. മത്തായിയിൽ οὐρανοῖς എന്ന ബഹുവചനം പതിവായ സെമിറ്റിക് സ്വാധീനമുള്ള പ്രയോഗമാണ്; മലയാളത്തിൽ ഏകവചനം അതേ ആശയം കൂടുതൽ സ്വാഭാവികമായി അറിയിക്കുന്നു. മൂലത്തിലെ ബഹുവചനം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
- issue: പ്രതിഫലത്തിന്റെ സ്വഭാവം
  choice: μισθός എന്നത് ‘പ്രതിഫലം’ എന്നു നൽകി.
  alternative: ‘കൂലി’ അല്ലെങ്കിൽ ‘വേതനം’.
  rationale: വാക്യം പ്രതിഫലത്തിന്റെ കൃത്യമായ ദൈവശാസ്ത്ര സ്വഭാവം വിശദീകരിക്കുന്നില്ല; ‘പ്രതിഫലം’ ആ അവ്യക്തത നിലനിർത്തുകയും വെറും വാണിജ്യകരാർ എന്ന ധ്വനി ഒഴിവാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും മാന്യവുമായ ശൈലി. ആജ്ഞാരൂപങ്ങളിൽ തിരുവെഴുത്തുവായനയ്ക്ക് യോജിച്ച ‘-വിൻ’ രൂപം നിലനിർത്തി; അതേസമയം അപൂർവമോ അത്യന്തം പുരാതനമോ ആയ പദങ്ങൾ ഒഴിവാക്കി.
