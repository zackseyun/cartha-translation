id: MAT.5.31
reference: Matthew 5:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐρρέθη ⸀δέ· Ὃς ἂν ἀπολύσῃ τὴν γυναῖκα αὐτοῦ, δότω αὐτῇ ἀποστάσιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/031.yaml
  text: But it was said[a], ‘Whoever divorces his wife, let him give her a certificate of divorce.’
translation:
  language: ml
  text: എന്നാൽ, “തന്റെ ഭാര്യയെ വിവാഹമോചനം ചെയ്യുന്നവൻ അവൾക്ക് വിവാഹമോചനപത്രം കൊടുക്കട്ടെ” എന്ന് പറയപ്പെട്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “തന്റെ ഭാര്യയെ പറഞ്ഞയക്കുന്നവൻ അവൾക്ക് വേർപാടിന്റെ രേഖ കൊടുക്കട്ടെ.” ‘വിവാഹമോചനം ചെയ്യുക’ എന്നു പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘പറഞ്ഞയക്കുക’ എന്നും അർഥമാകാം; എന്നാൽ ഇവിടെ വിവാഹവുമായി ബന്ധപ്പെട്ട നിയമസന്ദർഭത്തിൽ അത് വിവാഹമോചനത്തെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐρρέθη
  choice: പറഞ്ഞിട്ടുണ്ടല്ലോ
  rationale: മത്തായിയിലെ ഉദ്ധരണി-ആമുഖത്തിന്റെ സ്വഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; കർത്താവിനെ വ്യക്തമാക്കാത്ത ഗ്രീക്ക് കർമണിപ്രയോഗവും അനാവശ്യമായി പൂരിപ്പിക്കുന്നില്ല.
- source_word: δέ
  choice: —ഉദ്ധരണി-ആമുഖത്തിലെ ‘എന്ന് ... ഉണ്ടല്ലോ’ എന്ന മാറ്റഭാവം
  rationale: δέ ഇവിടെ മുൻഭാഗത്തിൽനിന്നുള്ള മാറ്റം/വ്യത്യാസം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ വേറിട്ട ‘എന്നാൽ’ ചേർക്കുന്നതിനെക്കാൾ വാക്യത്തിന്റെ ആമുഖഘടനയിലൂടെ അത് സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: Ὃς ἂν
  choice: ചെയ്യുന്നവൻ
  rationale: അനിശ്ചിത പൊതുനിബന്ധനയെ മലയാളത്തിലെ സ്വാഭാവിക ബന്ധവാക്യരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἀπολύσῃ
  choice: വിവാഹമോചനം ചെയ്യുന്ന
  rationale: പദത്തിന് ‘അയച്ചുകളയുക’ എന്ന വിശാല അർഥമുണ്ടെങ്കിലും, ഭാര്യയും വിവാഹമോചനപത്രവും ഉൾപ്പെടുന്ന നിയമപരമായ സന്ദർഭത്തിൽ വിവാഹമോചനമാണ് ഉദ്ദേശ്യം.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: തന്റെ ഭാര്യയെ
  rationale: വിവാഹസന്ദർഭത്തിൽ γυνή എന്നത് ‘ഭാര്യ’ എന്നാണ്; ഉറവിടത്തിലെ പുരുഷകർത്താവിനോടുള്ള സ്വാമ്യബന്ധവും നിലനിർത്തുന്നു.
- source_word: δότω
  choice: കൊടുക്കട്ടെ
  rationale: മൂന്നാംപുരുഷ ആജ്ഞാരൂപത്തിന്റെ നിയമപ്രസ്താവനാസ്വഭാവം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: αὐτῇ
  choice: അവൾക്ക്
  rationale: പരോക്ഷ കർമത്തിന്റെ ദാതൃകാർഥം വ്യക്തമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀποστάσιον
  choice: വിവാഹമോചനപത്രം
  rationale: വിവാഹമോചനത്തെ നിയമപരമായി രേഖപ്പെടുത്തുന്ന എഴുതപ്പെട്ട പ്രമാണം എന്ന അർഥം സംക്ഷിപ്തവും വ്യക്തവുമായി നൽകുന്നു.
theological_decisions:
- issue: മോശൈക വിവാഹമോചന വ്യവസ്ഥയോടുള്ള യേശുവിന്റെ വാക്കുകളുടെ ബന്ധം
  choice: ഈ വാക്യം ഒരു നിയമപരമായ പ്രസ്താവനയുടെ ഉദ്ധരണിയായി മാത്രം അവതരിപ്പിച്ചു; യേശു അതിനെ അംഗീകരിക്കുന്നുവോ എതിർക്കുന്നുവോ എന്ന് ഈ വാക്യത്തിൽ മുൻകൂട്ടി നിർണ്ണയിച്ചില്ല.
  alternative: വിവാഹമോചന നടപടിയെ അംഗീകരിക്കുന്ന നേരിട്ടുള്ള കല്പനയായി വ്യാഖ്യാനിച്ച് പരിഭാഷപ്പെടുത്തുക.
  rationale: തുടർന്നുള്ള വാക്യത്തിൽ യേശു പ്രതികരിക്കാനിരിക്കുന്ന പരമ്പരാഗത നിയമപ്രസ്താവനയാണ് ഇവിടെ അവതരിപ്പിക്കുന്നത്. അതിനാൽ ഈ വാക്യം മാത്രം ആശ്രയിച്ച് വിശാലമായ വിവാഹമോചനധാർമ്മികത തീർപ്പാക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. നിയമപരമായ ഉദ്ധരണിയുടെ രൂപം നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പദങ്ങൾ ഉപയോഗിച്ചു.
