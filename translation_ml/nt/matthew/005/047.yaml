id: MAT.5.47
reference: Matthew 5:47
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐὰν ἀσπάσησθε τοὺς ⸀ἀδελφοὺς ὑμῶν μόνον, τί περισσὸν ποιεῖτε; οὐχὶ καὶ οἱ ⸀ἐθνικοὶ ⸂τὸ αὐτὸ⸃ ποιοῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/047.yaml
  text: And if you greet only your brothers[c][b][a], what are you doing that is extraordinary? Do not even the Gentiles do the same?
translation:
  language: ml
  text: നിങ്ങളുടെ സഹോദരന്മാരെ[a] മാത്രം അഭിവാദ്യം ചെയ്യുന്നുവെങ്കിൽ, നിങ്ങൾ എന്ത് അസാധാരണമായ കാര്യമാണ് ചെയ്യുന്നത്?[b] വിജാതീയരും[c] അതുതന്നെ ചെയ്യുന്നില്ലേ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സഹോദരീസഹോദരന്മാരെ’; ഗ്രീക്കിൽ ‘സഹോദരന്മാരെ’ എന്നാണ്, എന്നാൽ ഇവിടെ സ്വന്തം കൂട്ടത്തിൽപ്പെട്ടവരെ കൂടുതൽ വിശാലമായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘നിങ്ങൾ കൂടുതലായി എന്താണ് ചെയ്യുന്നത്?’
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘ജനതകളിൽപ്പെട്ടവരും’; ഇവിടെ യഹൂദരല്ലാത്തവരെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσησθε
  choice: അഭിവാദ്യം ചെയ്യുന്നുവെങ്കിൽ
  rationale: സാമൂഹികമായി ഒരാളെ കണ്ടുമുട്ടുമ്പോൾ ആശംസിക്കുന്ന പ്രവൃത്തിയാണ് ക്രിയ സൂചിപ്പിക്കുന്നത്; ആതിഥ്യമരുളുക എന്ന അധിക അർഥം ചേർക്കാതെ മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗം.
- source_word: ἀδελφοὺς
  choice: സഹോദരന്മാരെ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചനം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; സ്വന്തം കൂട്ടത്തിൽപ്പെട്ടവരെ വിശാലമായി സൂചിപ്പിക്കാനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: μόνον
  choice: മാത്രം
  rationale: അഭിവാദ്യം ഒരു പരിമിത വിഭാഗത്തോടു മാത്രമാണെന്ന നിയന്ത്രണം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τί περισσὸν ποιεῖτε
  choice: നിങ്ങൾ അസാധാരണമായി എന്താണ് ചെയ്യുന്നത്?
  rationale: περισσόν സാധാരണതിലധികമായതോ സവിശേഷമായതോ സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിലെ വാചാടോപപരമായ ചോദ്യത്തിന്റെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐθνικοὶ
  choice: ജനതകളിൽപ്പെട്ടവർ
  rationale: യഹൂദരല്ലാത്ത ജനവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ വംശീയ-ഉടമ്പടിപരമായ വ്യത്യാസം നിലനിർത്തുന്നു; 'വിജാതീയർ' എന്ന അപരിചിതമോ പ്രതികൂലമോ ആയി കേൾക്കാവുന്ന പദം ഒഴിവാക്കുന്നു.
- source_word: τὸ αὐτὸ
  choice: അതുതന്നെ
  rationale: മുൻപു പറഞ്ഞ അതേ പ്രവൃത്തിയെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ἀδελφοὺς എന്നതിന്റെ പരിധി
  choice: മുഖ്യപാഠത്തിൽ 'സഹോദരന്മാർ' എന്നു നൽകി.
  alternative: '''സഹോദരീസഹോദരന്മാർ'' അല്ലെങ്കിൽ ''സ്വന്തം കൂട്ടത്തിൽപ്പെട്ടവർ''.'
  rationale: വ്യാകരണപരമായ പുല്ലിംഗ ബഹുവചനം മറച്ചുവയ്ക്കാതെ നിലനിർത്തുന്നു; അതേസമയം സ്വന്തം ബന്ധുവൃന്ദത്തെയോ സമൂഹത്തെയോ വിശാലമായി ഉൾക്കൊള്ളാവുന്ന അർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: ἐθνικοὶ എന്നതിന്റെ അർഥം
  choice: '''ജനതകളിൽപ്പെട്ടവർ'' എന്നു നൽകി.'
  alternative: '''വിജാതീയർ'' അല്ലെങ്കിൽ ''ജാതികൾ''.'
  rationale: യഹൂദരല്ലാത്തവരെന്ന അടിസ്ഥാന അർഥവും ഉടമ്പടി സമൂഹത്തിന് പുറത്തുള്ളവരോടുള്ള സന്ദർഭപരമായ വ്യത്യാസവും നിലനിർത്തുന്നു; 'പുറജാതിക്കാർ/പേഗന്മാർ' പോലുള്ള ശക്തമായ മതപരമായ വിലയിരുത്തൽ അനാവശ്യമായി ചേർക്കുന്നില്ല.
- issue: περισσόν എന്നതിലെ നൈതിക താരതമ്യം
  choice: '''അസാധാരണമായി എന്താണ് ചെയ്യുന്നത്?'' എന്നു നൽകി.'
  alternative: '''കൂടുതലായി എന്താണ് ചെയ്യുന്നത്?'''
  rationale: ശിഷ്യരുടെ പെരുമാറ്റം സാധാരണ നിലവാരത്തെ കവിയണമെന്ന വാചാടോപപരമായ സമ്മർദം നിലനിർത്തുന്നു; എങ്കിലും അക്ഷരാർഥപരമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വാചാടോപപരമായ രണ്ട് ചോദ്യങ്ങളും ഗ്രീക്കിന്റെ ഊന്നലും നിലനിർത്തിയിരിക്കുന്നു; എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദങ്ങളോടോ വാക്യത്തോടോ ചേർത്തിരിക്കുന്നു.
