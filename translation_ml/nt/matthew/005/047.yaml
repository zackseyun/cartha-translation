review_pass:
  verdict: revise
  source_fidelity: 'The conditional clause, restrictive μόνος, rhetorical question, and concluding question are all retained. However, «ജനതകളിൽപ്പെട്ടവർ» is overly broad and does not clearly convey ἐθνικοί as non-Jews in this Jewish-context contrast. «വിജാതീയർ» is the established precise Malayalam equivalent. The middle question is more faithful when περισσόν modifies an expressed noun: “what extraordinary thing.”'
  naturalness: «നിങ്ങൾ അസാധാരണമായി എന്താണ് ചെയ്യുന്നത്?» can be read as asking how one acts unusually, rather than what exceptional action one performs. «നിങ്ങൾ എന്ത് അസാധാരണമായ കാര്യമാണ് ചെയ്യുന്നത്?» is clear, idiomatic modern standard Malayalam, and preserves the rhetorical force.
  terminology: «സഹോദരന്മാർ» appropriately preserves the masculine plural, with the broader-group possibility in a footnote. «വിജാതീയർ» is preferable to the vague «ജനതകളിൽപ്പെട്ടവർ» for ἐθνικοί; the note can specify “non-Jews” without importing “pagans.”
  issues:
  - severity: medium
    issue: Rendering of ἐθνικοί as «ജനതകളിൽപ്പെട്ടവർ»
    rationale: This phrase simply means people belonging to nations and can include Jews; it fails to mark the source term’s contextual reference to non-Jews. «വിജാതീയർ» is both idiomatic in Malayalam biblical register and semantically closer.
  - severity: low
    issue: Rendering of τί περισσὸν ποιεῖτε as «അസാധാരണമായി എന്താണ് ചെയ്യുന്നത്?»
    rationale: The adverbial Malayalam wording shifts the focus toward manner. Expressing “thing/action” better represents περισσόν and avoids ambiguity.
