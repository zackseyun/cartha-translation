id: MAT.5.38
reference: Matthew 5:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἠκούσατε ὅτι ἐρρέθη· Ὀφθαλμὸν ἀντὶ ὀφθαλμοῦ καὶ ὀδόντα ἀντὶ ὀδόντος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/038.yaml
  text: You have heard that it was said[a], ‘An eye for an eye and a tooth for a tooth.’
translation:
  language: ml
  text: “കണ്ണിനു പകരം കണ്ണും പല്ലിനു പകരം പല്ലും” എന്നു പറയപ്പെട്ടതായി നിങ്ങൾ കേട്ടിട്ടുണ്ട്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἠκούσατε
  choice: നിങ്ങൾ കേട്ടിട്ടുണ്ടല്ലോ
  rationale: മത്തായിയുടെ ആവർത്തിതമായ ഈ ആമുഖസൂത്രത്തിൽ, ഭൂതകാലത്തിൽ കേട്ടതും ഇപ്പോഴും അറിയപ്പെടുന്നതുമായ ഉപദേശത്തെ സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു; വാക്യത്തിന്റെ അഭിസംബോധനാഭാവവും നിലനിർത്തുന്നു.
- source_word: ὅτι
  choice: എന്നു
  rationale: കേട്ടതിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് ഘടകത്തിന് സ്വാഭാവികമായ മലയാള ഉദ്ധരണിസൂചകം.
- source_word: ἐρρέθη
  choice: പറഞ്ഞിട്ടുള്ളത്
  rationale: λέγω എന്ന ക്രിയയുടെ കർമണിപ്രയോഗം വ്യക്തമായ കർത്താവിനെ ചേർക്കാതെ നിലനിർത്തുന്നു; മുമ്പ് പ്രസ്താവിക്കപ്പെട്ടതും പ്രചാരത്തിലുള്ളതുമായ വാക്കെന്ന ആശയം നൽകുന്നു.
- source_word: Ὀφθαλμὸν ἀντὶ ὀφθαλμοῦ
  choice: കണ്ണിനു പകരം കണ്ണ്
  rationale: ἀντίയുടെ പകരംവെക്കൽ/തുല്യപ്രതികാരം എന്ന ബന്ധം വ്യക്തമായി നൽകുകയും നിയമസൂത്രത്തിന്റെ സംക്ഷിപ്തമായ സമാന്തരഘടന നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: καὶ
  choice: പല്ലിനു പകരം പല്ല്
  rationale: രണ്ടാമത്തെ സമാന്തരഘടകത്തെ ഒന്നാമത്തേതുമായി ബന്ധിപ്പിക്കുന്ന ‘ഉം/കൂടാതെ’ എന്ന അർഥം മലയാളത്തിലെ വിരാമവും സമാന്തരക്രമവും വഴി സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: ὀδόντα ἀντὶ ὀδόντος
  choice: പല്ലിനു പകരം പല്ല്
  rationale: ആദ്യ നിയമസൂത്രത്തിന്റെ അതേ ഘടന ആവർത്തിച്ച് ഗ്രീക്കിലെ തുലിതാളം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യേശു ഉദ്ധരിക്കുന്ന തുല്യപ്രതികാര നിയമസൂത്രത്തിന്റെ അവതരണം
  choice: കണ്ണിനു പകരം കണ്ണ്, പല്ലിനു പകരം പല്ല്
  alternative: കണ്ണിന് കണ്ണ്, പല്ലിന് പല്ല്
  rationale: ‘പകരം’ എന്നത് ἀντίയുടെ സ്ഥാനമാറ്റം/തുല്യത എന്ന അർഥം തുറന്നുവെക്കുന്നു. ഇത് പ്രതികാരം അക്ഷരാർഥത്തിലാണോ ആനുപാതികനിയന്ത്രണമാണോ എന്ന വ്യാഖ്യാനചോദ്യം വാക്യത്തിൽ തന്നെ തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ‘കേട്ടിട്ടുണ്ടല്ലോ’ എന്നത് മത്തായി 5-ലെ അഭിസംബോധനാസൂത്രത്തിന് സ്വാഭാവികമായ സംഭാഷണഗൗരവം നൽകുന്നു. ഉദ്ധരണിയിലെ നിയമവാക്യം സംക്ഷിപ്തവും ഓർമ്മിക്കാവുന്നതുമായി നിലനിർത്തിയിരിക്കുന്നു.
