  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἠκούσατε ὅτι ἐρρέθη· Οὐ μοιχεύσεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/027.yaml
  text: You have heard that it was said[a], ‘You shall not commit adultery.’
translation:
  language: ml
  text: “‘വ്യഭിചാരം ചെയ്യരുത്’ എന്ന് പറയപ്പെട്ടതായി നിങ്ങൾ കേട്ടിട്ടുണ്ട്.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: “നിങ്ങൾ കേട്ടു: ‘വ്യഭിചാരം ചെയ്യരുത്’ എന്ന് പറയപ്പെട്ടു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἠκούσατε
  choice: നിങ്ങൾ കേട്ടിട്ടുണ്ടല്ലോ
  rationale: സൂത്രവാക്യസദൃശമായ ഈ ആമുഖത്തിലെ aorist, മുമ്പ് കേട്ടതും ഇപ്പോഴും പരിചിതവുമായ കല്പനയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘കേട്ടിട്ടുണ്ടല്ലോ’ എന്നത് ഈ സംവാദഭാവവും നിലവിലെ പ്രസക്തിയും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὅτι
  choice: എന്ന്
  rationale: കേട്ടതിന്റെ ഉള്ളടക്കം പരിചയപ്പെടുത്തുന്ന ഗ്രീക്ക് പൂരകസംയോജകത്തിന് മലയാളത്തിലെ സ്വാഭാവികമായ പരോക്ഷവാക്യരൂപം.
- source_word: ἐρρέθη
  choice: അരുളിച്ചെയ്തതായി
  rationale: λέγω എന്ന ക്രിയയുടെ ഭൂതകാല കർമണിപ്രയോഗം. തിരുവെഴുത്തിലെ ദൈവിക കല്പനയെ ഉദ്ധരിക്കുന്ന സന്ദർഭത്തിൽ ‘അരുളിച്ചെയ്തു’ മാന്യവും സ്വാഭാവികവുമാണ്; കർത്താവിനെ പാഠത്തിൽ പുതുതായി ചേർക്കുന്നില്ല.
- source_word: Οὐ μοιχεύσεις
  choice: വ്യഭിചാരം ചെയ്യരുത്
  rationale: ഭാവികാല നിർദേശരൂപത്തിലുള്ള നിരോധനത്തിന്റെ കല്പനാഭാവം മലയാളത്തിൽ ‘ചെയ്യരുത്’ എന്ന രൂപം കൃത്യമായി നൽകുന്നു. ‘വ്യഭിചാരം’ μοιχεύω സൂചിപ്പിക്കുന്ന വിവാഹലംഘനത്തെ വ്യക്തമാക്കുന്ന നിലവാരമുള്ള പദമാണ്.
theological_decisions:
- issue: പത്തു കല്പനകളിലെ നിരോധനവാക്യവുമായുള്ള ബന്ധം
  choice: ‘വ്യഭിചാരം ചെയ്യരുത്’ എന്ന കല്പനാരൂപം നിലനിർത്തി.
  alternative: ‘വ്യഭിചാരം ചെയ്യാതിരിക്കുക’
  rationale: യേശു കല്പനാപാരമ്പര്യം ഉദ്ധരിക്കുന്നതിനാൽ നേരിട്ടുള്ള നിരോധനരൂപം അന്തർപാഠബന്ധം കാത്തുസൂക്ഷിക്കുന്നു; വ്യാഖ്യാനാത്മകമായ ഒന്നും ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനയ്ക്ക് എളുപ്പവുമായ മലയാളം. ‘ഉണ്ടല്ലോ’ എന്ന പ്രയോഗം യേശു ശ്രോതാക്കളുടെ പരിചിതജ്ഞാനത്തെ അഭിസംബോധന ചെയ്യുന്ന സംവാദഭാവം നൽകുന്നു; അടിക്കുറിപ്പ് ഗ്രീക്ക് aorist-ന്റെ കൂടുതൽ പദാനുപദമായ രൂപം രേഖപ്പെടുത്തുന്നു.
