id: MAT.5.25
reference: Matthew 5:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἴσθι εὐνοῶν τῷ ἀντιδίκῳ σου ταχὺ ἕως ὅτου εἶ ⸂μετ’ αὐτοῦ ἐν τῇ ὁδῷ⸃, μήποτέ σε παραδῷ ὁ ἀντίδικος τῷ κριτῇ, καὶ ὁ ⸀κριτὴς τῷ ὑπηρέτῃ, καὶ εἰς φυλακὴν βληθήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/025.yaml
  text: Be well-disposed toward your accuser quickly[a], while you are with him on the way, lest your accuser hand you over to the judge, and the judge to the officer, and you be thrown into prison.
translation:
  language: ml
  text: നിന്റെ എതിർകക്ഷിയോട് വേഗം അനുകൂലമായി പെരുമാറുക[a]—നീ അവനോടുകൂടെ വഴിയിൽ ആയിരിക്കുമ്പോൾ. അല്ലാത്തപക്ഷം, എതിർകക്ഷി നിന്നെ ന്യായാധിപന് ഏൽപ്പിക്കുകയും ന്യായാധിപൻ കോടതി ഉദ്യോഗസ്ഥന് ഏൽപ്പിക്കുകയും നീ തടവറയിൽ എറിയപ്പെടുകയും ചെയ്തേക്കാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഈ നിയമസന്ദർഭത്തിൽ കൂടുതൽ വ്യാവഹാരികമായി: ‘നിന്റെ എതിർകക്ഷിയുമായി വേഗം ഒത്തുതീർപ്പിലെത്തുക.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴσθι εὐνοῶν
  choice: അനുകൂലമനോഭാവം പുലർത്തുക
  rationale: εὐνοέω എന്ന പദത്തിന്റെ ‘അനുകൂലമായി ചിന്തിക്കുക/നല്ല മനോഭാവം പുലർത്തുക’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു. നിയമപരമായി ഒത്തുതീർപ്പിലെത്തുക എന്ന സൂചന സന്ദർഭത്തിലുണ്ടെങ്കിലും അത് മുഖ്യവാചകത്തിൽ അധികമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: ἀντιδίκῳ / ἀντίδικος
  choice: കുറ്റാരോപകൻ
  rationale: ന്യായാധിപൻ, ഉദ്യോഗസ്ഥൻ, തടവറ എന്നീ നിയമസന്ദർഭ സൂചനകളോട് യോജിക്കുന്ന വ്യക്തമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: ταχὺ
  choice: വേഗം
  rationale: കല്പനയിലെ അടിയന്തരത സ്വാഭാവികവും സംക്ഷിപ്തവുമായി അറിയിക്കുന്നു.
- source_word: ἕως ὅτου εἶ μετ’ αὐτοῦ ἐν τῇ ὁδῷ
  choice: നീ അവനോടൊപ്പം വഴിയിൽ ആയിരിക്കുമ്പോൾത്തന്നെ
  rationale: കോടതിയിലേക്കുള്ള വഴിയെന്ന് വ്യക്തമാക്കാതെ മൂലത്തിലെ ദൃശ്യരൂപം സംരക്ഷിക്കുന്നു; ‘ത്തന്നെ’ സമയപരിധിയുടെയും അടിയന്തരതയുടെയും ഭാവം നൽകുന്നു.
- source_word: μήποτέ
  choice: അല്ലെങ്കിൽ ... ചെയ്തേക്കാം
  rationale: മുന്നറിയിപ്പിന്റെയും സാധ്യതയുടെയും ശക്തി സ്വാഭാവിക മലയാളത്തിൽ പകരുന്നു.
- source_word: παραδῷ
  choice: ഏൽപ്പിക്കുക
  rationale: ന്യായനടപടിയിലെ ഒരാളിൽനിന്ന് മറ്റൊരാളിലേക്കുള്ള കൈമാറ്റം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: κριτῇ / κριτὴς
  choice: ന്യായാധിപൻ
  rationale: നിയമസന്ദർഭത്തിൽ κριτής എന്നതിന് നിലവാരമുള്ള വ്യക്തമായ മലയാളപദം.
- source_word: ὑπηρέτῃ
  choice: ഉദ്യോഗസ്ഥൻ
  rationale: ന്യായാധിപന്റെ ഉത്തരവ് നടപ്പാക്കുന്ന കീഴുദ്യോഗസ്ഥനെ പൊതുവായും സംസ്കാരവിശേഷം ചുമത്താതെയും സൂചിപ്പിക്കുന്നു.
- source_word: εἰς φυλακὴν
  choice: തടവറയിൽ
  rationale: നിയമപരമായ തടവിന്റെ ഗൗരവം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: βληθήσῃ
  choice: എറിയപ്പെടുക
  rationale: βάλλω എന്ന ക്രിയയുടെ ശക്തമായ ദൃശ്യഭാവം മൃദൂകരിക്കാതെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ആരംഭകല്പനയെ നിയമപരമായ ഒത്തുതീർപ്പായി വ്യാഖ്യാനിക്കണമോ, എതിരാളിയോടുള്ള അനുകൂല മനോഭാവമായി പദാനുസൃതമായി നൽകണമോ
  choice: മുഖ്യവാചകത്തിൽ ‘അനുകൂലമനോഭാവം പുലർത്തുക’ എന്ന് നൽകി εὐνοέωയുടെ അടിസ്ഥാനാർഥം നിലനിർത്തി.
  alternative: ‘നിന്റെ കുറ്റാരോപകനുമായി വേഗം ഒത്തുതീർപ്പിലെത്തുക.’
  rationale: നിയമസന്ദർഭം ഒത്തുതീർപ്പ് എന്ന പ്രായോഗിക അർഥം ശക്തമായി സൂചിപ്പിക്കുന്നുവെങ്കിലും, ഗ്രീക്ക് പദം നേരിട്ട് പറയുന്നത് അനുകൂല മനോഭാവമാണ്. അതിനാൽ വ്യാഖ്യാനാത്മകമായ നിയമാർഥം അടിക്കുറിപ്പിൽ നൽകി യഥാർഥമായ അർഥവ്യാപ്തിയും സംഘർഷവും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അനുകൂലമനോഭാവം’ പദാനുസൃത കൃത്യതയ്ക്കായി തിരഞ്ഞെടുത്തു; അടിക്കുറിപ്പ് നിയമസന്ദർഭത്തിലെ വ്യാവഹാരിക അർഥം വ്യക്തമാക്കുന്നു. നീണ്ട ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി രണ്ടു വാക്യങ്ങളാക്കി, എന്നാൽ ന്യായപരമായ കൈമാറ്റക്രമം മാറ്റിയിട്ടില്ല.
