  to: നിന്റെ എതിർകക്ഷിയോട് വേഗം അനുകൂലമായി പെരുമാറുക[a]—നീ അവനോടുകൂടെ വഴിയിൽ ആയിരിക്കുമ്പോൾ. അല്ലാത്തപക്ഷം, എതിർകക്ഷി നിന്നെ ന്യായാധിപന് ഏൽപ്പിക്കുകയും ന്യായാധിപൻ കോടതി ഉദ്യോഗസ്ഥന് ഏൽപ്പിക്കുകയും നീ തടവറയിൽ എറിയപ്പെടുകയും ചെയ്തേക്കാം.
