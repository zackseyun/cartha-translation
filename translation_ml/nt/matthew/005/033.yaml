    rationale: The Greek expression denotes those of old/former times. “പൂർവികർ” normally means ancestors and may imply a familial or specifically ancestral reference not present in the source.
  - severity: low
    issue: The phrase “കർത്താവിനു നിറവേറ്റണം” is syntactically less natural.
    rationale: Malayalam more idiomatically expresses this as fulfilling oaths made to the Lord, while retaining the source’s dative relationship and singular addressee.
