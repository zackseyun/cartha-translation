id: MAT.5.33
reference: Matthew 5:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Πάλιν ἠκούσατε ὅτι ἐρρέθη τοῖς ἀρχαίοις· Οὐκ ἐπιορκήσεις, ἀποδώσεις δὲ τῷ κυρίῳ τοὺς ὅρκους σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/033.yaml
  text: Again[a], you have heard that it was said to those of old, ‘You shall not swear falsely[b], but you shall fulfill your oaths to the Lord.’
translation:
  language: ml
  text: '“വീണ്ടും, പണ്ടുള്ളവരോടു ഇങ്ങനെ പറഞ്ഞതായി നിങ്ങൾ കേട്ടിട്ടുണ്ടല്ലോ: ‘വ്യാജമായി ആണയിടരുത്[a]; കർത്താവിനോടുള്ള നിന്റെ ശപഥങ്ങൾ നിറവേറ്റണം[b].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “ശപഥം ലംഘിക്കരുത്”; ഈ ക്രിയ വ്യാജമായി ആണയിടുന്നതിനെയോ എടുത്ത ശപഥം ലംഘിക്കുന്നതിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ “യഹോവയ്ക്ക്”; പഴയനിയമ പശ്ചാത്തലത്തിലെ ദൈവത്തിന്റെ ഉടമ്പടിനാമത്തെ ഇത് പ്രതിഫലിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: Πάλιν
  choice: വീണ്ടും
  rationale: മത്തായി 5-ലെ തുടർച്ചയായ ഉപദേശങ്ങളിൽ മറ്റൊരു ഉദാഹരണം അവതരിപ്പിക്കുന്ന പ്രയോഗം; ആശയത്തിന്റെ മുന്നേറ്റം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἠκούσατε
  choice: നിങ്ങൾ കേട്ടിട്ടുണ്ടല്ലോ
  rationale: മുമ്പ് കേട്ട ഉപദേശം ഇപ്പോഴും ശ്രോതാക്കൾക്ക് പ്രസക്തമാണെന്ന സൂചനയും ആവർത്തിക്കുന്ന സൂത്രവാക്യത്തിന്റെ ഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐρρέθη
  choice: പറഞ്ഞതായി
  rationale: ആരാണ് പറഞ്ഞതെന്ന് കൂട്ടിച്ചേർക്കാതെ ഗ്രീക്കിലെ കർമണിപ്രയോഗത്തിന്റെ അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
- source_word: τοῖς ἀρχαίοις
  choice: പൂർവികരോട്
  rationale: പ്രായമായവരെയല്ല, മുൻതലമുറകളിലെ ആളുകളെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് വ്യക്തവും സംക്ഷിപ്തവുമായി അറിയിക്കുന്നു.
- source_word: Οὐκ ἐπιορκήσεις
  choice: വ്യാജമായി ആണയിടരുത്
  rationale: ἐπιορκέω എന്നത് വ്യാജമായി ആണയിടുന്നതിനെയും എടുത്ത ശപഥം ലംഘിക്കുന്നതിനെയും സൂചിപ്പിക്കാം; മുഖ്യപാഠം ആദ്യ അർഥം നൽകുകയും മറ്റേ അർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἀποδώσεις
  choice: നിറവേറ്റണം
  rationale: ശപഥത്തിലൂടെ ഏറ്റെടുത്ത ബാധ്യത നിർവഹിക്കുക എന്ന സന്ദർഭാർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: τῷ κυρίῳ
  choice: കർത്താവിനു
  rationale: ഗ്രീക്ക് κύριος എന്ന പദത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുകയും ഇവിടെ ദൈവമാണ് ഉദ്ദേശിക്കപ്പെടുന്നതെന്ന് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: τοὺς ὅρκους σου
  choice: നിന്റെ ശപഥങ്ങൾ
  rationale: ὅρκος എന്നതിന്റെ പ്രത്യേക അർഥമായ സത്യപ്രതിജ്ഞയെയോ ആണയോടുകൂടിയ വാഗ്ദാനത്തെയോ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഇസ്രായേലിന്റെ തിരുവെഴുത്തുകളിലേക്കുള്ള സൂചനയിൽ κύριος എന്നതിന്റെ പരിഭാഷ
  choice: കർത്താവ്
  alternative: യഹോവ
  rationale: ഗ്രീക്ക് പാഠത്തിൽ κυρίῳ എന്നാണ്; അതിനാൽ മുഖ്യപാഠത്തിൽ ‘കർത്താവ്’ നിലനിർത്തുന്നു. എന്നാൽ പഴയനിയമ പശ്ചാത്തലത്തിൽ ഉടമ്പടിനാമം പ്രതിഫലിച്ചിരിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: ἐπιορκέω എന്ന ക്രിയയുടെ അർഥവ്യാപ്തി
  choice: വ്യാജമായി ആണയിടുക
  alternative: ശപഥം ലംഘിക്കുക
  rationale: ഈ ക്രിയയ്ക്ക് വ്യാജമായി സത്യം ചെയ്യുക എന്നും എടുത്ത ശപഥം ലംഘിക്കുക എന്നും അർഥമാകാം. ആധുനിക നിയമസാങ്കേതിക പദത്തിൽ ഒതുക്കാതെ ഈ അർഥതലങ്ങൾ മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഉദ്ധരണിയിലെ ഏകവചന അഭിസംബോധനയും പുറത്തെ ബഹുവചന അഭിസംബോധനയും ഗ്രീക്ക് വ്യാകരണത്തിന് അനുസരിച്ച് നിലനിർത്തിയിരിക്കുന്നു.
