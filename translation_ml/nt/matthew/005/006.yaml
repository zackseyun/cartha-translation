id: MAT.5.6
reference: Matthew 5:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μακάριοι οἱ πεινῶντες καὶ διψῶντες τὴν δικαιοσύνην, ὅτι αὐτοὶ χορτασθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/006.yaml
  text: Blessed are those who hunger and thirst for righteousness[a], because they will be filled.
translation:
  language: ml
  text: നീതിക്കായി[a] വിശക്കുകയും ദാഹിക്കുകയും ചെയ്യുന്നവർ ധന്യർ; എന്തെന്നാൽ അവർ തൃപ്തരാകും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നീതി’ എന്നതിനുപകരം ‘ന്യായം’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദത്തിന് നീതി, ന്യായം, അല്ലെങ്കിൽ ദൈവത്തിന്റെ മുമ്പാകെ ശരിയായത് എന്ന അർഥങ്ങൾ സൂചിപ്പിക്കാനാകും.
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριοι
  choice: അനുഗൃഹീതർ
  rationale: സന്തോഷമെന്ന മാനസികാവസ്ഥയെക്കാൾ ദൈവാനുഗ്രഹത്തിന്റെ പ്രഖ്യാപനസ്വഭാവം പ്രകടമാക്കുകയും ധന്യവാക്യങ്ങളുടെ ഗൗരവമുള്ള ശൈലി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: οἱ πεινῶντες καὶ διψῶντες
  choice: വിശക്കുകയും ദാഹിക്കുകയും ചെയ്യുന്നവർ
  rationale: വർത്തമാനകാല കൃദന്തരൂപങ്ങൾ സൂചിപ്പിക്കുന്ന തുടർച്ചയായ, തീവ്രമായ അഭിലാഷം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τὴν δικαιοσύνην
  choice: നീതിക്കായി
  rationale: δικαιοσύνη എന്ന പദത്തിന്റെ ധാർമ്മിക ശരിതനിമയും ന്യായവും ദൈവമുമ്പാകെയുള്ള ശരിയായ നിലയും ഉൾക്കൊള്ളാൻ കഴിയുന്ന സ്വാഭാവികമായ മലയാളപദമാണ് ‘നീതി’; വിഭക്തിപ്രയോഗം വിശപ്പിന്റെയും ദാഹത്തിന്റെയും ലക്ഷ്യം വ്യക്തമാക്കുന്നു.
- source_word: ὅτι
  choice: എന്തെന്നാൽ
  rationale: അനുഗ്രഹപ്രഖ്യാപനത്തിന്റെ കാരണം അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് ബന്ധകത്തിന്റെ വിശദീകരണബലം ഗൗരവമുള്ള, സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: αὐτοὶ
  choice: അവർ
  rationale: ഗ്രീക്കിൽ സർവനാമത്തിന് ഊന്നലുണ്ടെങ്കിലും ‘അവർ തന്നേ’ എന്നു ചേർക്കുന്നത് മലയാളത്തിൽ അനാവശ്യമായി ഭാരമുള്ളതാകും; സാധാരണ കർത്തൃരൂപം സന്ദർഭത്തിൽ മതിയായ വ്യക്തത നൽകുന്നു.
- source_word: χορτασθήσονται
  choice: തൃപ്തരാക്കപ്പെടും
  rationale: ഭക്ഷണംകൊണ്ട് നിറയുകയോ പൂർണമായി തൃപ്തിപ്പെടുകയോ ചെയ്യുക എന്ന ക്രിയയുടെ ഭാവികാല കർമണിപ്രയോഗം നിലനിർത്തുന്നു; വിശപ്പിന്റെയും ദാഹത്തിന്റെയും രൂപകം സ്വാഭാവികമായി പൂർത്തിയാക്കുന്നു.
theological_decisions:
- issue: δικαιοσύνη എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: നീതി
  alternative: ന്യായം; ദൈവമുമ്പാകെ ശരിയായത്
  rationale: ഇവിടെ പദം വ്യക്തിപരമായ ധാർമ്മികതയിൽ മാത്രം ഒതുങ്ങണമെന്നില്ല; ന്യായവും ശരിയായ ക്രമവും ദൈവഹിതാനുസൃതമായ നിലയും ഉൾക്കൊള്ളാം. പ്രധാനപാഠത്തിൽ വ്യാപകമായി ഗ്രഹിക്കാവുന്ന ‘നീതി’ നിലനിർത്തി ഈ അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: χορτασθήσονται എന്ന ദൈവിക കർമണിപ്രയോഗം
  choice: തൃപ്തരാക്കപ്പെടും
  alternative: തൃപ്തരാകും
  rationale: ഗ്രീക്ക് കർമണിപ്രയോഗം പ്രവർത്തകനെ പറയാതെ വിടുന്നു; സന്ദർഭത്തിൽ ദൈവമാണ് പ്രവർത്തകൻ എന്നു ഗ്രഹിക്കാമെങ്കിലും പ്രധാനപാഠത്തിൽ ‘ദൈവം’ എന്ന് ചേർത്ത് അവ്യക്തത നീക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ധന്യവാക്യശൈലി. സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പദങ്ങൾ ഉപയോഗിച്ചുകൊണ്ട് ഗ്രീക്ക് വാക്യത്തിന്റെ പ്രഖ്യാപനരീതിയും വിശപ്പ്–ദാഹം–തൃപ്തി എന്ന രൂപകബന്ധവും കർമണിപ്രയോഗത്തിലെ ദൈവസൂചനയും നിലനിർത്തിയിരിക്കുന്നു.
