  to: നീതിക്കായി[a] വിശക്കുകയും ദാഹിക്കുകയും ചെയ്യുന്നവർ ധന്യർ; എന്തെന്നാൽ അവർ തൃപ്തരാകും.
  rationale: The revision retains the source meaning and the English POB audit trail while using more idiomatic modern Malayalam for the beatitude declaration and its promised fulfillment. The footnote remains anchored to ‘നീതിക്കായി’ and preserves the contested semantic range of δικαιοσύνη without forcing an interpretation.
