id: MAT.5.37
reference: Matthew 5:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔστω δὲ ὁ λόγος ὑμῶν ναὶ ναί, οὒ οὔ· τὸ δὲ περισσὸν τούτων ἐκ τοῦ πονηροῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/037.yaml
  text: But let your word be[a], ‘Yes, yes,’ or ‘No, no.’ Anything beyond these is from the evil one.
translation:
  language: ml
  text: എന്നാൽ നിങ്ങളുടെ വാക്ക് ‘അതെ, അതെ’ എന്നോ ‘അല്ല, അല്ല’ എന്നോ ആയിരിക്കട്ടെ. ഇതിൽ കൂടുതലുള്ളത് ദുഷ്ടനിൽനിന്നാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “തിന്മയിൽനിന്നാണ്.” ഗ്രീക്കിലെ τοῦ πονηροῦ എന്ന പ്രയോഗം വ്യക്തിപരമായി “ദുഷ്ടൻ” എന്നും വ്യക്തിരഹിതമായി “തിന്മ” എന്നും മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔστω
  choice: ആയിരിക്കട്ടെ
  rationale: εἰμί എന്ന ക്രിയയുടെ മൂന്നാംപുരുഷ വർത്തമാനകാല ആജ്ഞാരൂപം; ഉപദേശാത്മകമായ ആഹ്വാനം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: λόγος
  choice: വാക്ക്
  rationale: ഇവിടെ സാധാരണ സംസാരത്തിൽ ഒരാൾ പറയുന്നതിനെ സൂചിപ്പിക്കുന്നു; വാക്യത്തിന്റെ സംക്ഷിപ്തവും പഴമൊഴിസദൃശവുമായ ശക്തി നിലനിർത്തുന്നു.
- source_word: ναὶ ναί, οὒ οὔ
  choice: ‘അതെ, അതെ’ എന്നോ ‘അല്ല, അല്ല’ എന്നോ
  rationale: ഗ്രീക്കിലെ ആവർത്തനവും ഊന്നലും താളവും നിലനിർത്തുന്നു; ‘എന്നോ ... എന്നോ’ എന്ന ഘടന വിരുദ്ധമായ രണ്ടു മറുപടികളെ സ്വാഭാവിക മലയാളത്തിൽ ബന്ധിപ്പിക്കുന്നു.
- source_word: περισσὸν
  choice: കൂടുതലുള്ളത്
  rationale: ലളിതമായ അതെ/അല്ല എന്നതിനെ അതിക്രമിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന നാമവൽക്കരിച്ച വിശേഷണത്തിന്റെ താരതമ്യഭാവം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: τούτων
  choice: ഇതിൽ
  rationale: മുമ്പ് പറഞ്ഞ ‘അതെ, അതെ’/‘അല്ല, അല്ല’ എന്ന പ്രതികരണങ്ങളെ കൂട്ടമായി തിരിഞ്ഞുനോക്കുന്നു; മലയാളത്തിൽ ‘ഇതിൽ കൂടുതലുള്ളത്’ സ്വാഭാവികമാണ്.
- source_word: ἐκ
  choice: നിന്നാണ്
  rationale: ഉറവിടത്തെയോ ഉത്ഭവത്തെയോ സൂചിപ്പിക്കുന്ന ἐκ എന്നതിന്റെ അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: τοῦ πονηροῦ
  choice: ദുഷ്ടൻ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ ഏകവചനരൂപത്തിന് ‘തിന്മ’ എന്നും ‘ദുഷ്ടൻ’ എന്നും അർഥമാകാം. മത്തായിയിൽ വ്യക്തിപരമായ പ്രയോഗം സാധ്യതയേറിയതിനാൽ മുഖ്യപാഠത്തിൽ ‘ദുഷ്ടൻ’ സ്വീകരിക്കുകയും മറ്റർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: τοῦ πονηροῦ എന്നത് വ്യക്തിപരമായ ‘ദുഷ്ടൻ’ ആണോ വ്യക്തിരഹിതമായ ‘തിന്മ’ ആണോ
  choice: ദുഷ്ടനിൽനിന്നാണ്
  alternative: തിന്മയിൽനിന്നാണ്
  rationale: ഗ്രീക്ക് വ്യാകരണപരമായി രണ്ടർഥത്തിനും ഇടനൽകുന്നു. മത്തായിയിലെ ὁ πονηρός എന്ന പ്രയോഗം വ്യക്തിപരമായി സാത്താനെ സൂചിപ്പിക്കാൻ പതിവുള്ളതിനാൽ മുഖ്യപാഠത്തിൽ ആ സാധ്യത സ്വീകരിക്കുന്നു; യഥാർഥമായ അർഥസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ഉപദേശശൈലി. ഗ്രീക്കിലെ ആവർത്തനവും വാക്യത്തിന്റെ പഴമൊഴിസദൃശമായ സംക്ഷിപ്തതയും നിലനിർത്തിയിരിക്കുന്നു.
