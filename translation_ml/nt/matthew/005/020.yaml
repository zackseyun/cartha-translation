id: MAT.5.20
reference: Matthew 5:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ὅτι ἐὰν μὴ περισσεύσῃ ⸂ὑμῶν ἡ δικαιοσύνη⸃ πλεῖον τῶν γραμματέων καὶ Φαρισαίων, οὐ μὴ εἰσέλθητε εἰς τὴν βασιλείαν τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/020.yaml
  text: For I tell you that unless your righteousness exceeds that of the scribes and Pharisees[a], you will certainly not enter the kingdom of heaven.
translation:
  language: ml
  text: 'കാരണം, ഞാൻ നിങ്ങളോടു പറയുന്നു: നിങ്ങളുടെ നീതി ശാസ്ത്രിമാരുടെയും പരീശന്മാരുടെയും നീതിയെ കവിയുന്നില്ലെങ്കിൽ, നിങ്ങൾ സ്വർഗരാജ്യത്തിൽ ഒരിക്കലും പ്രവേശിക്കുകയില്ല.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നീതി’ എന്നതിന് ‘നീതിനിഷ്ഠ’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്ക് പദത്തിന് നീതിയുള്ള നിലയെയോ നീതിയുള്ള ജീവിതത്തെയോ സൂചിപ്പിക്കാൻ കഴിയും; ഇവിടെ മത്തായി 5-ന്റെ സന്ദർഭത്തിൽ ‘നീതി’യാണ് യോജിച്ചത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: കാരണം, ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: γάρ-ന്റെ വിശദീകരണബന്ധവും λέγω-യുടെ നേരിട്ടുള്ള അഭിസംബോധനയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐὰν μὴ
  choice: ആകുന്നില്ലെങ്കിൽ
  rationale: ആവശ്യമായ നിഷേധവ്യവസ്ഥ മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: περισσεύσῃ ... πλεῖον
  choice: '...യെക്കാൾ ശ്രേഷ്ഠമാകുക'
  rationale: അളവിലോ ഗുണത്തിലോ അതിക്രമിക്കുക എന്ന താരതമ്യബലം ഇവിടെ നൈതികസന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὑμῶν ἡ δικαιοσύνη
  choice: നിങ്ങളുടെ നീതി
  rationale: δικαιοσύνη സൂചിപ്പിക്കുന്ന ദൈവഹിതാനുസൃതമായ ശരിയായ ജീവിതവും നീതിയും മലയാളത്തിലെ പതിവ് ബൈബിൾപദമായ ‘നീതി’ ഉൾക്കൊള്ളുന്നു; പദത്തിന്റെ അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: γραμματέων καὶ Φαρισαίων
  choice: ശാസ്ത്രിമാരുടെയും പരീശന്മാരുടെയും
  rationale: നിയമവിദഗ്ധരായ γραμματεῖς-ന് സ്ഥാപിതമായ ‘ശാസ്ത്രിമാർ’ എന്നും Φαρισαῖοι എന്ന സംഘനാമത്തിന് പതിവായ ‘പരീശന്മാർ’ എന്നും നൽകുന്നു.
- source_word: οὐ μὴ εἰσέλθητε
  choice: ഒരിക്കലും പ്രവേശിക്കുകയില്ല
  rationale: οὐ μή എന്ന ശക്തമായ നിഷേധം വ്യക്തവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: സ്വർഗരാജ്യം
  rationale: മത്തായിയുടെ സവിശേഷ പ്രയോഗത്തിന് സ്വാഭാവികവും സ്ഥാപിതവുമായ മലയാളസമാനപദം.
theological_decisions:
- issue: δικαιοσύνη എന്ന പദത്തിന്റെ നൈതിക-ദൈവശാസ്ത്രപരമായ അർത്ഥവ്യാപ്തി
  choice: നീതി
  alternative: നീതിനിഷ്ഠ / നീതിയുള്ള ജീവിതം
  rationale: ഇവിടെ വെറും നിയമപരമായ നിലയോ സാമൂഹികനീതിയോ മാത്രം അല്ല, ദൈവഹിതത്തോടൊത്ത ശരിയായ ജീവിതമാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്. ‘നീതി’ ആ അർത്ഥവ്യാപ്തി ചുരുക്കാതെ നിലനിർത്തുന്നു.
- issue: ശാസ്ത്രിമാരോടും പരീശന്മാരോടുമുള്ള താരതമ്യത്തിന്റെ ലക്ഷ്യം
  choice: അവരുടെ നീതിയെക്കാൾ ശ്രേഷ്ഠമാകുക
  alternative: അവരെക്കാൾ അധികം നീതി ഉണ്ടായിരിക്കുക
  rationale: ഗ്രീക്ക് വാക്യം വ്യക്തികളെയല്ല, ‘നിങ്ങളുടെ നീതി’യും സന്ദർഭത്തിൽ അനുമാനിക്കപ്പെടുന്ന ‘അവരുടെ നീതി’യും താരതമ്യം ചെയ്യുന്നു; മലയാളത്തിൽ ഇത് തുറന്നുപറയുന്നത് ആശയക്കുഴപ്പം ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. താരതമ്യത്തിലെ മറഞ്ഞിരിക്കുന്ന ‘അവരുടെ നീതി’ മലയാളത്തിൽ വ്യക്തമാക്കിയിട്ടുണ്ട്. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യവാക്യത്തിൽ ചേർത്തിരിക്കുന്നു.
