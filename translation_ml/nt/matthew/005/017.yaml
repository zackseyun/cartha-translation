id: MAT.5.17
reference: Matthew 5:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Μὴ νομίσητε ὅτι ἦλθον καταλῦσαι τὸν νόμον ἢ τοὺς προφήτας· οὐκ ἦλθον καταλῦσαι ἀλλὰ πληρῶσαι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/017.yaml
  text: Do not think that I came to abolish the Law or the Prophets[b][a]; I did not come to abolish them but to fulfill them.
translation:
  language: ml
  text: “ഞാൻ ന്യായപ്രമാണത്തെയോ പ്രവാചകന്മാരെയോ നീക്കിക്കളയാൻ വന്നതെന്നു കരുതരുത്. നീക്കിക്കളയാനല്ല, നിവർത്തിക്കാനാണ് ഞാൻ വന്നത്.[a][b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വന്നു’ എന്നതിന്റെ രണ്ടിടത്തും ‘വന്നിരിക്കുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘നിവർത്തിക്കുക’ എന്നത് ‘പൂർണമാക്കുക’ എന്നോ ‘പൂർണമായ പ്രകടനത്തിലെത്തിക്കുക’ എന്നോ മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ νομίσητε
  choice: കരുതരുത്
  rationale: μήയോടുകൂടിയ aorist subjunctive ഇവിടെ വിലക്കിനെ സൂചിപ്പിക്കുന്നു. ‘കരുതരുത്’ നേരിട്ടും സ്വാഭാവികമായും അതിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: ἦλθον
  choice: ഞാൻ വന്നത് / ഞാൻ വന്നു
  rationale: ഗ്രീക്കിലെ ലളിതമായ aorist രൂപത്തെ സ്വാഭാവിക മലയാളത്തിൽ ആവർത്തനഘടനയോടെ അവതരിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ ‘വന്നിരിക്കുന്നു’ എന്നും അർത്ഥമാക്കാം.
- source_word: καταλῦσαι
  choice: നീക്കിക്കളയാൻ
  rationale: ഇവിടെ ഭൗതികമായി നശിപ്പിക്കുക എന്നതിലുപരി പ്രാബല്യം ഇല്ലാതാക്കുക, റദ്ദാക്കുക എന്ന ആശയമാണ്. സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ‘നീക്കിക്കളയുക’ ആ അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὸν νόμον
  choice: ന്യായപ്രമാണം
  rationale: ‘പ്രവാചകന്മാർ’ എന്നതിനോടൊപ്പം വരുന്നതിനാൽ പൊതുവായ നിയമമല്ല, ഇസ്രായേലിന്റെ തിരുവെഴുത്തുകളിലെ തോറാ/മോശെയുടെ ന്യായപ്രമാണമാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: τοὺς προφήτας
  choice: പ്രവാചകന്മാർ
  rationale: ‘ന്യായപ്രമാണവും പ്രവാചകന്മാരും’ എന്ന തിരുവെഴുത്തുസമുച്ചയത്തിലെ അംഗീകൃത ഘടകത്തെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗതവും വ്യക്തവുമായ മലയാളപ്രയോഗം.
- source_word: ἀλλὰ πληρῶσαι
  choice: നിവർത്തിക്കാനാണ്
  rationale: πληρόω എന്ന പദത്തിന്റെ നിറവേറ്റുക, ഉദ്ദേശിച്ച പൂർണതയിലെത്തിക്കുക, പൂർണമായി പ്രകടമാക്കുക എന്നീ അർത്ഥവ്യാപ്തി നിലനിർത്തുന്ന, ദൈവശാസ്ത്രപരമായി അതിരുകുറുക്കാത്ത മലയാളപദമാണ് ‘നിവർത്തിക്കുക’.
theological_decisions:
- issue: ന്യായപ്രമാണത്തോടും പ്രവാചകന്മാരോടുമുള്ള യേശുവിന്റെ ബന്ധത്തിൽ πληρῶσαι എന്നതിന്റെ അർത്ഥം
  choice: ‘നിവർത്തിക്കുക’ എന്ന വിശാലമായ പദം നിലനിർത്തി
  alternative: പൂർണമാക്കുക; പൂർണമായ പ്രകടനത്തിലെത്തിക്കുക; സ്ഥിരീകരിക്കുക/സ്ഥാപിക്കുക
  rationale: ഈ പദത്തിന് വിവിധ ദൈവശാസ്ത്രവ്യാഖ്യാനങ്ങളുണ്ട്. ഒരു പ്രത്യേക പാരമ്പര്യത്തിന്റെ വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ പതിപ്പിക്കാതെ മൂലത്തിലെ അർത്ഥവ്യാപ്തിയും സംഘർഷവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ‘ന്യായപ്രമാണം’, ‘പ്രവാചകന്മാർ’, ‘നിവർത്തിക്കുക’ എന്നീ സ്ഥാപിത പദങ്ങൾ നിലനിർത്തി; വാക്യഘടന സ്വാഭാവികമാക്കി.
