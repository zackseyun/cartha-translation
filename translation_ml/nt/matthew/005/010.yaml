  source_fidelity: The perfect passive sense of οἱ δεδιωγμένοι is well represented by “പീഡിപ്പിക്കപ്പെട്ടവർ,” and the present-tense possession in ἐστιν is correctly retained in “അവരുടേതാണ്.” “നീതിനിമിത്തം” can convey δικαιοσύνης in its Matthean sense. However, the semicolon alone does not explicitly render ὅτι, which introduces the ground for the beatitude.
