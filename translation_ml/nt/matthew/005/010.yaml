id: MAT.5.10
reference: Matthew 5:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μακάριοι οἱ δεδιωγμένοι ἕνεκεν δικαιοσύνης, ὅτι αὐτῶν ἐστιν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/010.yaml
  text: Blessed are those who have been persecuted because of righteousness[a], for theirs is the kingdom of heaven.
translation:
  language: ml
  text: നീതിനിമിത്തം[a] പീഡിപ്പിക്കപ്പെട്ടവർ അനുഗൃഹീതർ; എന്തെന്നാൽ, സ്വർഗരാജ്യം അവരുടേതാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ന്യായത്തിനുവേണ്ടി.” ഗ്രീക്ക് പദത്തിന് ധാർമിക നീതിയുടെയും ദൈവഹിതത്തോടൊത്ത ശരിയായ നിലയുടെയും അർഥഭാവങ്ങൾ ഉൾക്കൊള്ളാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: അനുഗൃഹീതർ
  rationale: വെറും മാനസിക സന്തോഷമല്ല, ദൈവത്തിന്റെ അനുഗ്രഹം ലഭിച്ച നിലയെ പ്രഖ്യാപിക്കുന്ന ആശീർവചനത്തിന്റെ ഭാവം വ്യക്തമാക്കുന്നു.
- source_word: οἱ δεδιωγμένοι
  choice: പീഡിപ്പിക്കപ്പെട്ടവർ
  rationale: നിശ്ചയാർഥക ഉപപദത്തോടുകൂടിയ പൂർണകാല കർമണി കൃദന്തത്തിന്റെ നാമപ്രയോഗം സ്വാഭാവികമായി നൽകുന്നു; അവർ നേരിട്ട പീഡനവും അതിന്റെ തുടരുന്ന ഫലസ്ഥിതിയും ഉൾക്കൊള്ളുന്നു.
- source_word: ἕνεκεν
  choice: നിമിത്തം
  rationale: പീഡനത്തിന്റെ കാരണം സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: δικαιοσύνης
  choice: നീതി
  rationale: ദൈവഹിതത്തോടൊത്ത ശരിയായ നിലയെയും ജീവിതത്തെയും സൂചിപ്പിക്കുമ്പോൾ, ന്യായം എന്ന അർഥഭാവവും വഹിക്കാൻ കഴിയുന്ന വിശാലമായ മലയാളപദമാണ്.
- source_word: ὅτι
  choice: ;
  rationale: രണ്ടാം വാക്യഖണ്ഡം ആദ്യത്തെ അനുഗ്രഹപ്രഖ്യാപനത്തിന്റെ കാരണം നൽകുന്നു; മലയാളത്തിലെ അർദ്ധവിരാമവും വാക്യക്രമവും ആ വിശദീകരണബന്ധം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: αὐτῶν
  choice: അവരുടേതാണ്
  rationale: ഗ്രീക്കിലെ ഊന്നൽ നിലനിർത്തിക്കൊണ്ട് ഉടമസ്ഥതയെയോ പങ്കാളിത്തത്തെയോ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: സ്വർഗരാജ്യം
  rationale: മത്തായിയുടെ സവിശേഷ പ്രയോഗത്തെ പരിചിതവും കൃത്യവുമായ മലയാളത്തിൽ നൽകുന്നു; ദൈവത്തിന്റെ സ്വർഗീയ ഭരണത്തെയും രാജ്യത്തെയും സൂചിപ്പിക്കാൻ കഴിയും.
theological_decisions:
- issue: δικαιοσύνη എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: നീതി
  alternative: ന്യായം
  rationale: ഇവിടെ ദൈവഹിതത്തോടൊത്ത ശരിയായ നിലയും പെരുമാറ്റവും മുഖ്യമാണ്. എങ്കിലും സാമൂഹിക ന്യായത്തിന്റെ അർഥഭാവം ഗ്രീക്ക് പദത്തിൽ സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: സ്വർഗരാജ്യത്തിന്റെ കാലഭാവം
  choice: അവരുടേതാണ്
  alternative: അവർക്കുള്ളതായിരിക്കും
  rationale: ἐστιν വർത്തമാനകാലത്തിലാണ്; അതിനാൽ ഭാവികാലത്തിലേക്ക് മാറ്റാതെ ഇപ്പോഴുള്ള അവകാശപ്രഖ്യാപനം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആശീർവചനശൈലി. പരമ്പരാഗതമായി പരിചിതമായ “സ്വർഗരാജ്യം” നിലനിർത്തിയിട്ടുണ്ട്; “അനുഗൃഹീതർ” എന്നത് ആത്മനിഷ്ഠമായ സന്തോഷത്തേക്കാൾ ദൈവിക അനുഗ്രഹപ്രഖ്യാപനത്തെ മുൻനിർത്തുന്നു.
