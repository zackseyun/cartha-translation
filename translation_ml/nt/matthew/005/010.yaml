  terminology: “അനുഗൃഹീതർ,” “നീതിനിമിത്തം,” and “സ്വർഗരാജ്യം” are suitable register-consistent renderings. The footnote should distinguish the alternative justice-related nuance without suggesting that the main rendering is limited to social justice.
  issues:
