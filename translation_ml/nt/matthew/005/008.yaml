id: MAT.5.8
reference: Matthew 5:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μακάριοι οἱ καθαροὶ τῇ καρδίᾳ, ὅτι αὐτοὶ τὸν θεὸν ὄψονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/008.yaml
  text: Blessed are the pure in heart[b][a], because they will see God.
translation:
  language: ml
  text: ഹൃദയത്തിൽ നിർമലരായവർ[a] അനുഗൃഹീതർ; എന്തെന്നാൽ അവർ ദൈവത്തെ കാണും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഹൃദയത്തിൽ ശുദ്ധിയുള്ളവർ.’
    reason: lexical_alternative
  - marker: b
    text: ‘ദൈവത്തെ കാണും’ എന്ന വാഗ്ദാനം ദൈവസാന്നിധ്യത്തിലേക്കുള്ള നേരിട്ടുള്ള പ്രവേശനത്തെയും അതിന്റെ ഭാവിയിലെ പൂർണതയെയും സൂചിപ്പിക്കാം; അർഥം ചുരുക്കാതെ മൂലവാചകത്തിന്റെ പ്രയോഗം അതേപടി നിലനിർത്തിയിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριοι
  choice: അനുഗൃഹീതർ
  rationale: ദൈവിക അനുഗ്രഹവും അതിനാൽ ലഭിക്കുന്ന അഭിലഷണീയമായ നിലയും സൂചിപ്പിക്കുന്നു; വെറും വികാരപരമായ സന്തോഷമായി അർഥം ചുരുക്കുന്നില്ല.
- source_word: καθαροὶ
  choice: നിർമലരായവർ
  rationale: ഇവിടെ ഉദ്ദേശിക്കുന്ന ആന്തരികവും ധാർമികവുമായ നിർമലത സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ‘ശുദ്ധിയുള്ളവർ’ എന്നതും സാധ്യമായ പദപ്രയോഗമാണ്.
- source_word: τῇ καρδίᾳ
  choice: ഹൃദയത്തിൽ
  rationale: ദത്തിവ് സൂചിപ്പിക്കുന്ന ബന്ധമേഖലയെ നിലനിർത്തി, വികാരങ്ങൾ മാത്രം അല്ലാതെ മനുഷ്യന്റെ ആന്തരിക വ്യക്തിത്വത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: ὅτι
  choice: എന്തെന്നാൽ
  rationale: അനുഗൃഹീതരെന്ന പ്രഖ്യാപനത്തിനുള്ള കാരണമോ അടിസ്ഥാനമോ വ്യക്തമാക്കുന്നു.
- source_word: αὐτοὶ
  choice: അവർ
  rationale: വാഗ്ദാനം ലഭിക്കുന്നത് ഇവർ തന്നെയാണെന്ന ഗ്രീക്ക് സർവനാമത്തിന്റെ ഊന്നൽ സന്ദർഭത്തിൽ സ്വാഭാവികമായി നിലനിൽക്കുന്നു; ‘അവർതന്നെ’ എന്നു ചേർക്കുന്നത് മലയാളത്തിൽ അനാവശ്യമായി ഭാരമുള്ളതാകും.
- source_word: τὸν θεὸν
  choice: ദൈവത്തെ
  rationale: ὄψονται എന്ന ക്രിയയുടെ നേരിട്ടുള്ള കർമമായി ലളിതമായും കൃത്യമായും പരിഭാഷപ്പെടുത്തി.
- source_word: ὄψονται
  choice: കാണും
  rationale: ഭാവികാല വാഗ്ദാനം നേരിട്ട് നിലനിർത്തുന്നു; ദൈവസാന്നിധ്യം അനുഭവിക്കുക എന്നോ അന്ത്യകാല ദർശനം എന്നോ വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: ‘ദൈവത്തെ കാണും’ എന്നതിന്റെ അർഥം
  choice: വ്യാഖ്യാനപരമായ വിപുലീകരണമില്ലാതെ ‘ദൈവത്തെ കാണും’ എന്നു നിലനിർത്തി.
  alternative: ‘ദൈവസാന്നിധ്യം അനുഭവിക്കും’ അല്ലെങ്കിൽ ‘അന്ത്യകാലത്ത് ദൈവത്തെ ദർശിക്കും.’
  rationale: പ്രയോഗത്തിന് ദൈവസാന്നിധ്യത്തിലേക്കുള്ള നേരിട്ടുള്ള പ്രവേശനവും അതിന്റെ ഭാവിയിലെ പൂർണതയും ഉൾപ്പെടുന്ന ആഴമുണ്ടാകാം. എന്നാൽ ഗ്രീക്ക് വാചകം സംക്ഷിപ്തമായതിനാൽ അതിന്റെ യഥാർഥ ദൈവശാസ്ത്രപരമായ വിശാലതയും സംഘർഷവും പരിഭാഷയിൽ ചുരുക്കാതെ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. പരമ്പരാഗതമായെങ്കിലും വികാരപരമായി ചുരുങ്ങാവുന്ന ‘ഭാഗ്യവാന്മാർ’ എന്നതിനുപകരം ദൈവിക അനുഗ്രഹത്തിന്റെ ആശയം വ്യക്തമാക്കുന്ന ‘അനുഗൃഹീതർ’ ഉപയോഗിച്ചു. ‘ഹൃദയത്തിൽ’ എന്നത് ആന്തരിക വ്യക്തിത്വത്തെ സൂചിപ്പിക്കുന്നു.
