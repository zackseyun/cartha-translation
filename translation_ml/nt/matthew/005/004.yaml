source:
  edition: SBLGNT
  text: μακάριοι οἱ πενθοῦντες, ὅτι αὐτοὶ παρακληθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/004.yaml
  text: Blessed are those who mourn[a], because they will be comforted.
translation:
  language: ml
  text: ദുഃഖിക്കുന്നവർ അനുഗൃഹീതർ[a]; കാരണം, അവർ ആശ്വസിപ്പിക്കപ്പെടും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘വിലപിക്കുന്നവർ.’ ദുഃഖത്തിന്റെ കാരണം എന്താണെന്ന് ഗ്രീക്ക് പദം വ്യക്തമാക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: അനുഗൃഹീതർ
  rationale: വെറും വികാരപരമായ ‘സന്തോഷമുള്ളവർ’ എന്നതിനെക്കാൾ, ദൈവിക അംഗീകാരവും അനുഗ്രഹീതാവസ്ഥയും സൂചിപ്പിക്കുന്ന ധന്യവാക്യരൂപത്തിന്റെ വിലയിരുത്തൽശക്തി നിലനിർത്തുന്നു.
- source_word: οἱ πενθοῦντες
  choice: ദുഃഖിക്കുന്നവർ
  rationale: വിയോഗം, കഷ്ടത, പാപം, അല്ലെങ്കിൽ മറ്റേതെങ്കിലും കാരണത്താലുള്ള വിലാപം എന്നിങ്ങനെ ഗ്രീക്ക് പദത്തിനുള്ള വിശാലത കാരണം വ്യക്തമാക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὅτι
  choice: കാരണം
  rationale: അനുഗൃഹീതരെന്ന പ്രഖ്യാപനത്തിന്റെ അടിസ്ഥാനമോ കാരണമോ വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: αὐτοὶ
  choice: അവർ
  rationale: ഗ്രീക്കിലെ സർവനാമത്തിന് നേരിയ ഊന്നലുണ്ടെങ്കിലും ‘അവർ തന്നേ’ എന്ന് പരിഭാഷപ്പെടുത്തുന്നത് മലയാളത്തിൽ അനാവശ്യമായി അടയാളപ്പെടുത്തിയതായി തോന്നാം; ധന്യവാക്യത്തിന്റെ ഘടനയിൽ ആവശ്യമായ ഊന്നൽ നിലനിൽക്കുന്നു.
- source_word: παρακληθήσονται
  choice: ആശ്വസിപ്പിക്കപ്പെടും
  rationale: ഭാവികാല കർമണിപ്രയോഗം നിലനിർത്തിക്കൊണ്ട് ആശ്വാസം ലഭിക്കുന്നതെന്ന അർത്ഥം വ്യക്തവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു; പ്രവർത്തകനെ മൂലപാഠം പറയാത്തതിനാൽ പരിഭാഷയും പറയുന്നില്ല.
theological_decisions:
- issue: ധന്യവാക്യത്തിലെ ദുഃഖത്തിന്റെ വ്യാപ്തി
  choice: ദുഃഖത്തിന്റെ കാരണം വ്യക്തമാക്കാതെ ‘ദുഃഖിക്കുന്നവർ’ എന്നു വിശാലമായി പരിഭാഷപ്പെടുത്തുക.
  alternative: ‘പാപത്തെക്കുറിച്ചു ദുഃഖിക്കുന്നവർ,’ ‘പൊതുവെ ദുഃഖിക്കുന്നവർ,’ അല്ലെങ്കിൽ ‘ഇസ്രായേലിന്റെ അവസ്ഥയെക്കുറിച്ചു വിലപിക്കുന്നവർ’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കുക.
  rationale: ഗ്രീക്ക് വാക്യം ദുഃഖത്തിന്റെ വിഷയം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ വ്യക്തിനഷ്ടം, പാപം, പീഡനം, അല്ലെങ്കിൽ ഭാവിയിലെ ദൈവിക ഇടപെടലിനായുള്ള ആകാംക്ഷ എന്നിവയിൽ ഒന്നായി അർത്ഥം പരിമിതപ്പെടുത്താതെ അതിന്റെ ദൈവശാസ്ത്രപരവും ശുശ്രൂഷാപരവുമായ തുറന്ന സ്വഭാവം നിലനിർത്തുന്നു.
- issue: ആശ്വസിപ്പിക്കുന്ന പ്രവർത്തകൻ
  choice: മൂലത്തിലെ കർമണിപ്രയോഗം നിലനിർത്തി ‘ആശ്വസിപ്പിക്കപ്പെടും’ എന്നു നൽകുക.
  alternative: ‘ദൈവം അവരെ ആശ്വസിപ്പിക്കും’ എന്നു പ്രവർത്തകനെ വ്യക്തമാക്കുക.
  rationale: ഇത് ദൈവിക കർമണിപ്രയോഗമായി മനസ്സിലാക്കാവുന്നതാണെങ്കിലും ഗ്രീക്ക് പാഠം പ്രവർത്തകനെ നേരിട്ട് പറയുന്നില്ല; അതിനാൽ പ്രധാനപാഠത്തിൽ ആ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. പരമ്പരാഗത ധന്യവാക്യത്തിന്റെ ഗൗരവം നിലനിർത്താൻ ‘അനുഗൃഹീതർ’ ഉപയോഗിച്ചു; ദുഃഖത്തിന്റെ കാരണവും ആശ്വാസം നൽകുന്ന പ്രവർത്തകനും മൂലപാഠം പറയുന്നതിലപ്പുറം വ്യക്തമാക്കിയിട്ടില്ല.
