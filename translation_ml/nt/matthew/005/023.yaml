- from: അതുകൊണ്ട്, നീ നിന്റെ വഴിപാട് യാഗപീഠത്തിന്മേൽ അർപ്പിക്കുമ്പോൾ, നിന്റെ സഹോദരന് നിന്നോട് എന്തെങ്കിലും വിരോധമുണ്ടെന്ന് അവിടെവെച്ച് ഓർത്താൽ,[a]
