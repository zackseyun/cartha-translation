  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐὰν οὖν προσφέρῃς τὸ δῶρόν σου ἐπὶ τὸ θυσιαστήριον κἀκεῖ μνησθῇς ὅτι ὁ ἀδελφός σου ἔχει τι κατὰ σοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/023.yaml
  text: Therefore, if you are offering your gift on the altar, and there remember that your brother has something against you,
translation:
  language: ml
  text: അതുകൊണ്ട്, നീ നിന്റെ വഴിപാട് യാഗപീഠത്തിന്മേൽ അർപ്പിക്കുമ്പോൾ, അവിടെവെച്ച് നിന്റെ സഹോദരന്[a] നിന്നോട് എന്തെങ്കിലും വിരോധമുണ്ടെന്ന് ഓർക്കുന്നുവെങ്കിൽ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിന്റെ സഹോദരനോ സഹോദരിക്കോ’; ഗ്രീക്കിൽ പുല്ലിംഗ ഏകവചനമായ ‘സഹോദരൻ’ എന്നാണ്, എന്നാൽ സന്ദർഭത്തിൽ അത് പ്രതിനിധാനപരമായി ഉപയോഗിച്ചിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: അതുകൊണ്ട്, ... ഓർത്താൽ
  rationale: οὖν മുൻപുള്ള ഉപദേശത്തിൽനിന്നുള്ള നിഗമനബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ ‘അതുകൊണ്ട്’ എന്നു നൽകി; ἐὰν ആരംഭിക്കുന്ന നിബന്ധന മലയാളത്തിലെ സ്വാഭാവികമായ ‘-ആൽ’ രൂപത്തിൽ പ്രകടമാക്കി.
- source_word: προσφέρῃς τὸ δῶρόν σου
  choice: നീ നിന്റെ വഴിപാട് ... അർപ്പിക്കുമ്പോൾ
  rationale: προσφέρωയുടെ അർപ്പണസന്ദർഭവും നടന്നുകൊണ്ടിരിക്കുന്നതായി ചിത്രീകരിക്കുന്ന വർത്തമാനകാല നിബന്ധനയും ‘അർപ്പിക്കുമ്പോൾ’ സ്വാഭാവികമായി നൽകുന്നു. δῶρον ഇവിടെ യാഗപീഠത്തിൽ അർപ്പിക്കുന്ന ദാനമായതിനാൽ ‘വഴിപാട്’ എന്ന് പരിഭാഷപ്പെടുത്തി.
- source_word: ἐπὶ τὸ θυσιαστήριον
  choice: യാഗപീഠത്തിന്മേൽ
  rationale: ἐπί + accusative അർപ്പണം പീഠത്തിന്മേൽ വെക്കുന്നതിലേക്കുള്ള ദിശ/സ്ഥാനം സൂചിപ്പിക്കുന്നു; ‘യാഗപീഠത്തിന്മേൽ’ ഈ ദൃശ്യരൂപം നിലനിർത്തുന്നു.
- source_word: κἀκεῖ μνησθῇς
  choice: അവിടെവെച്ച് ഓർത്താൽ
  rationale: κἀκεῖയിലെ സ്ഥലസൂചനയും ബന്ധകശക്തിയും മലയാളത്തിൽ ‘അവിടെവെച്ച്’ നൽകുന്നു; μνησθῇς നിഷ്പക്ഷമായി ‘ഓർത്താൽ’ എന്നു പരിഭാഷപ്പെടുത്തി, ഓർമ സ്വയം വന്നതോ ഓർമിപ്പിക്കപ്പെട്ടതോ എന്ന് നിർണ്ണയിച്ചില്ല.
- source_word: ὁ ἀδελφός σου
  choice: നിന്റെ സഹോദരന്
  rationale: ἀδελφός പുല്ലിംഗ ഏകവചനമായതിനാൽ ഉറവിടരൂപം സംരക്ഷിച്ച് ‘സഹോദരൻ’ എന്ന പദത്തിന്റെ വിഭക്തിരൂപം ഉപയോഗിച്ചു; പ്രതിനിധാനപരമായ വിശാല പ്രയോഗസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: ἔχει τι κατὰ σοῦ
  choice: നിന്നോട് എന്തെങ്കിലും വിരോധമുണ്ട്
  rationale: κατά + genitive ഉൾപ്പെട്ട പ്രയോഗം ഒരാളോടുള്ള പരാതി, എതിർപ്പ്, അല്ലെങ്കിൽ വിരോധം സൂചിപ്പിക്കുന്നു. τιയുടെ അനിശ്ചിതത്വം ‘എന്തെങ്കിലും’ നിലനിർത്തുന്നു; കാരണം അല്ലെങ്കിൽ കുറ്റത്തിന്റെ സ്വഭാവം കൂട്ടിച്ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: ἀδελφός എന്ന ലിംഗസൂചക ബന്ധുപദത്തിന്റെ വ്യാപ്തി
  choice: നിന്റെ സഹോദരന്
  alternative: നിന്റെ സഹോദരനോ സഹോദരിക്കോ / മറ്റൊരു വിശ്വാസിക്ക്
  rationale: ഗ്രീക്ക് പാഠം പുല്ലിംഗ ഏകവചനമാണ്. അതിനെ പ്രധാനപാഠത്തിൽ ലിംഗനിരപേക്ഷമാക്കി വിപുലീകരിക്കാതെ രൂപപരമായ കൃത്യത സംരക്ഷിച്ചു; സന്ദർഭത്തിൽ ഈ പദം പ്രതിനിധാനപരമായി പ്രവർത്തിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
- issue: ἔχει τι κατὰ σοῦ എന്ന പ്രയോഗത്തിൽ പരാതിയുടെ ന്യായസാധുത
  choice: നിന്നോട് എന്തെങ്കിലും വിരോധമുണ്ട്
  alternative: നിന്നെക്കുറിച്ച് ന്യായമായ പരാതിയുണ്ട്
  rationale: മൂലപാഠം ആക്ഷേപം ന്യായമാണോ എന്നും തെറ്റ് ആരുടേതാണെന്നും വ്യക്തമാക്കുന്നില്ല. അതിനാൽ നൈതിക കുറ്റനിർണ്ണയം പരിഭാഷയിൽ ചേർത്തില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. യാഗസന്ദർഭം വ്യക്തമാക്കാൻ ‘വഴിപാട്’, ‘യാഗപീഠം’, ‘അർപ്പിക്കുക’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ ഉപയോഗിച്ചു. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്ന നിബന്ധനയായതിനാൽ അവസാനത്തിൽ അർധവിരാമമല്ല, കോമ നിലനിർത്തി; അടിക്കുറിപ്പ് ചിഹ്നം പ്രധാനപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
