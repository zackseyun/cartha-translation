id: MAT.5.44
reference: Matthew 5:44
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν, ἀγαπᾶτε τοὺς ἐχθροὺς ⸀ὑμῶν καὶ προσεύχεσθε ὑπὲρ ⸀τῶν διωκόντων ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/044.yaml
  text: But I say to you[a], love your enemies and pray for those who persecute you.
translation:
  language: ml
  text: 'എന്നാൽ ഞാൻ നിങ്ങളോടു പറയുന്നു: നിങ്ങളുടെ ശത്രുക്കളെ സ്നേഹിക്കുവിൻ; നിങ്ങളെ പീഡിപ്പിക്കുന്നവർക്കുവേണ്ടി പ്രാർഥിക്കുവിൻ.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങളെ പീഡിപ്പിക്കുന്നവർക്കുവേണ്ടി പ്രാർഥിക്കുവിൻ.’
    reason: ὑπέρ എന്ന പദത്തിന് ‘അവർക്കുവേണ്ടി’ അല്ലെങ്കിൽ ‘അവരുടെ പക്ഷമായി’ എന്ന സൂക്ഷ്മാർഥം പ്രകടമാക്കുന്ന പദപ്രയോഗവികൽപം.
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: എന്നാൽ ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: δέ സൂചിപ്പിക്കുന്ന വൈരുധ്യവും ἐγώ നൽകുന്ന ഊന്നലും നിലനിർത്തുന്നു; ഗിരിപ്രഭാഷണത്തിന്റെ ഗൗരവത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളമാണ്.
- source_word: ἀγαπᾶτε
  choice: സ്നേഹിക്കുവിൻ
  rationale: വർത്തമാനകാല ആജ്ഞയുടെ ശക്തി അതിരുകടന്ന് വ്യാഖ്യാനിക്കാതെ, ἀγαπάω എന്ന ക്രിയയുടെ സാധാരണ അർഥവും നേരിട്ടുള്ള കല്പനയും നൽകുന്നു.
- source_word: τοὺς ἐχθροὺς ὑμῶν
  choice: നിങ്ങളുടെ ശത്രുക്കളെ
  rationale: ἐχθρός സൂചിപ്പിക്കുന്ന ബന്ധപരമായ ശത്രുത മയപ്പെടുത്താതെ നേരിട്ടും സ്വാഭാവികമായും പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: προσεύχεσθε
  choice: പ്രാർഥിക്കുവിൻ
  rationale: പ്രാർഥിക്കാനുള്ള ആജ്ഞ വ്യക്തമായി നിലനിർത്തുന്ന പ്രമാണ മലയാള രൂപമാണ്; ഗ്രീക്കിലെ രൂപം അർഥത്തിൽ സജീവമായതിനാൽ വേറൊരു കർമണി രൂപം ആവശ്യമില്ല.
- source_word: ὑπὲρ
  choice: വേണ്ടി
  rationale: ജനിറ്റീവിനോടുകൂടിയ ὑπέρ ഇവിടെ മറ്റൊരാളുടെ നന്മയ്ക്കായോ അവർക്കുവേണ്ടിയോ പ്രാർഥിക്കുന്നതിനെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: τῶν διωκόντων ὑμᾶς
  choice: നിങ്ങളെ പീഡിപ്പിക്കുന്നവർ
  rationale: നാമീകരിച്ച വർത്തമാന കൃദന്തരൂപത്തിലെ തുടരുന്ന ശത്രുതാപരമായ പ്രവൃത്തിയെ മലയാളത്തിലെ സ്വാഭാവിക ബന്ധവാക്യമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ശത്രുക്കളോടുള്ള കല്പനയുടെ വ്യാപ്തി
  choice: ശത്രുക്കളെ സ്നേഹിക്കാനും പീഡിപ്പിക്കുന്നവർക്കുവേണ്ടി പ്രാർഥിക്കാനും ഉള്ള രണ്ടു കല്പനകളും വിശദീകരണവികാസങ്ങളില്ലാതെ നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: സ്നേഹത്തെ പ്രധാനമായും കാരുണ്യപ്രവൃത്തിയായി നിർവചിക്കുക, അല്ലെങ്കിൽ പ്രാർഥന അനുഗ്രഹത്തിനോ മാനസാന്തരത്തിനോ വേണ്ടിയാണെന്ന് വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്ക് വാക്യം സ്നേഹത്തിന്റെയും പ്രാർഥനയുടെയും എല്ലാ പ്രായോഗികമോ വികാരപരമോ ആയ അർഥവ്യാപ്തിയും നിർവചിക്കുന്നില്ല. അതിനാൽ അതിന്റെ ധാർമിക ശക്തിയും ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക പ്രമാണ മലയാളത്തിലെ ഗൗരവമുള്ള തിരുവെഴുത്തുശൈലി. ‘സ്നേഹിക്കുവിൻ’, ‘പ്രാർഥിക്കുവിൻ’ എന്നീ ബഹുവചന ആജ്ഞാരൂപങ്ങൾ മൂലപാഠത്തിലെ കല്പനാഭാവം വ്യക്തമാക്കുന്നു; അനാവശ്യമായ വിഭാഗീയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
