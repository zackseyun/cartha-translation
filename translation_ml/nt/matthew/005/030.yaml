id: MAT.5.30
reference: Matthew 5:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἰ ἡ δεξιά σου χεὶρ σκανδαλίζει σε, ἔκκοψον αὐτὴν καὶ βάλε ἀπὸ σοῦ, συμφέρει γάρ σοι ἵνα ἀπόληται ἓν τῶν μελῶν σου καὶ μὴ ὅλον τὸ σῶμά σου ⸂εἰς γέενναν ἀπέλθῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/030.yaml
  text: And if your right hand causes you to stumble[a], cut it off and throw it away[c][b]. For it is better for you that one of your members should perish than that your whole body should go into Gehenna.
translation:
  language: ml
  text: നിന്റെ വലതുകൈ നിന്നെ ഇടറിവീഴാൻ ഇടയാക്കുന്നുവെങ്കിൽ[a], അതു വെട്ടിമാറ്റി എറിഞ്ഞുകളയുക. നിന്റെ മുഴുവൻ ശരീരം ഗെഹെന്നായിലേക്കു[b] പോകുന്നതിനേക്കാൾ നിന്റെ അവയവങ്ങളിലൊന്നു നശിച്ചുപോകുന്നതു നിനക്കു നല്ലതാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്നെ പാപം ചെയ്യാൻ ഇടയാക്കുന്നുവെങ്കിൽ.” ഗ്രീക്ക് ക്രിയയുടെ അക്ഷരാർഥം ഇടറിവീഴാൻ കാരണമാകുക എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “നരകത്തിലേക്കു.” ‘ഗെഹെന്നാ’ എന്ന ഗ്രീക്ക് പദം ഹിന്നോം താഴ്വരയുടെ പേരിൽ നിന്നുള്ളതും അന്ത്യന്യായവിധിയെ സൂചിപ്പിക്കാൻ ഉപയോഗിക്കപ്പെടുന്നതുമാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: δεξιά ... χείρ
  choice: നിന്റെ വലതുകൈ
  rationale: ശരീരഭാഗത്തെ കൃത്യമായി സൂചിപ്പിക്കുകയും മുൻവാക്യത്തിലെ സമാന്തരമായ ദൃശ്യഭാഷ നിലനിർത്തുകയും ചെയ്യുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: σκανδαλίζει
  choice: നിന്നെ പാപത്തിലേക്കു വീഴ്ത്തുന്നുവെങ്കിൽ
  rationale: വീഴ്ചയുടെ രൂപകം നിലനിർത്തിക്കൊണ്ട് സന്ദർഭത്തിലെ ധാർമ്മിക അർഥം സാധാരണ വായനക്കാർക്കു വ്യക്തമാക്കുന്നു; കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: ἔκκοψον
  choice: വെട്ടിമാറ്റി
  rationale: നിർണായകവും ശക്തവുമായ ആജ്ഞയുടെ ഭാവം നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: βάλε ἀπὸ σοῦ
  choice: നിന്നിൽനിന്ന് ദൂരെ എറിഞ്ഞുകളയുക
  rationale: എറിഞ്ഞുകളയുക എന്ന ശക്തമായ പ്രവൃത്തിയും സ്വന്തം അടുക്കൽനിന്നുള്ള പൂർണമായ നീക്കവും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
- source_word: συμφέρει γάρ σοι
  choice: നിനക്കു നല്ലത്
  rationale: സാമ്പത്തിക ലാഭമല്ല, താരതമ്യേന ഉത്തമമായ ഫലമാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികമായ താരതമ്യഘടന.
- source_word: ἵνα ἀπόληται
  choice: നശിച്ചുപോകുന്നതാണ്
  rationale: ഒരു ശരീരാവയവത്തിന്റെ നഷ്ടം അല്ലെങ്കിൽ നാശം എന്ന ഗൗരവമുള്ള ആശയം സംരക്ഷിക്കുന്നു.
- source_word: ἓν τῶν μελῶν σου
  choice: നിന്റെ അവയവങ്ങളിലൊന്ന്
  rationale: μέλος എന്നത് കൈകാലുകളിൽ മാത്രം ഒതുങ്ങാത്ത ശരീരഭാഗത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അവയവം’ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: ὅλον τὸ σῶμά σου
  choice: നിന്റെ ശരീരം മുഴുവനും
  rationale: ഒരവയവവും മുഴുവൻ ശരീരവും തമ്മിലുള്ള ഉറവിടപാഠത്തിലെ വൈരുധ്യം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: εἰς γέενναν ἀπέλθῃ
  choice: ഗെഹെന്നായിലേക്കു പോകുന്നതിനെക്കാൾ
  rationale: ‘ഗെഹെന്നാ’ എന്ന ചരിത്രപരവും അന്ത്യന്യായവിധിയുമായി ബന്ധപ്പെട്ടതുമായ ഉറവിടപദം സംരക്ഷിക്കുന്നു; ἀπέλθῃ എന്നതിനെ ‘പോകുക’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു.
theological_decisions:
- issue: γέεννα എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ഗെഹെന്നാ
  alternative: നരകം
  rationale: ഹിന്നോം താഴ്വരയിൽനിന്നു രൂപപ്പെട്ടതും അന്ത്യന്യായവിധിയെ സൂചിപ്പിക്കുന്നതുമായ ഗ്രീക്ക് പദത്തിന്റെ ചരിത്ര-ദൈവശാസ്ത്രപരമായ പ്രത്യേകത ‘ഗെഹെന്നാ’ സംരക്ഷിക്കുന്നു. ‘നരകം’ സന്ദർഭോചിതമായ വ്യാഖ്യാനപരമായ പകരമാണ്; അത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: σκανδαλίζει എന്ന രൂപകത്തിന്റെ അവതരണം
  choice: പാപത്തിലേക്കു വീഴ്ത്തുന്നു
  alternative: ഇടർച്ച വരുത്തുന്നു
  rationale: പാപത്തിലേക്കുള്ള വീഴ്ചയാണ് സന്ദർഭത്തിലെ ആശയം; ‘വീഴ്ത്തുന്നു’ എന്നത് മൂലരൂപകവും നിലനിർത്തുന്നു. അക്ഷരാർഥത്തിനടുത്ത പകരം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും നേരിട്ടുള്ള മുന്നറിയിപ്പിന്റെ ശക്തിയും നിലനിർത്തി. ‘വലതുകൈ,’ ‘വെട്ടിമാറ്റി,’ ‘എറിഞ്ഞുകളയുക’ എന്നിവ സാധാരണ വായനക്കാർക്കു വ്യക്തമായ ദൃശ്യഭാഷ നൽകുന്നു. സാങ്കേതികമായ ‘ഗെഹെന്നാ’ മുഖ്യപാഠത്തിൽ നിലനിർത്തി, പരിചിതമായ ‘നരകം’ അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
