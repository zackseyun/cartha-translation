revisions:
- from: നിന്റെ വലതുകൈ നിന്നെ പാപത്തിലേക്കു വീഴ്ത്തുന്നുവെങ്കിൽ[a], അതു വെട്ടിമാറ്റി നിന്നിൽനിന്ന് ദൂരെ എറിഞ്ഞുകളയുക. നിന്റെ അവയവങ്ങളിലൊന്ന് നശിച്ചുപോകുന്നതാണ്, നിന്റെ ശരീരം മുഴുവനും ഗെഹെന്നായിലേക്കു[b] പോകുന്നതിനെക്കാൾ നിനക്കു നല്ലത്.
  to: നിന്റെ വലതുകൈ നിന്നെ ഇടറിവീഴാൻ ഇടയാക്കുന്നുവെങ്കിൽ[a], അതു വെട്ടിമാറ്റി എറിഞ്ഞുകളയുക. നിന്റെ മുഴുവൻ ശരീരം ഗെഹെന്നായിലേക്കു[b] പോകുന്നതിനേക്കാൾ നിന്റെ അവയവങ്ങളിലൊന്നു നശിച്ചുപോകുന്നതു നിനക്കു നല്ലതാണ്.
  rationale: The revision avoids adding the notion of distance, preserves σκανδαλίζει’s source-language metaphor in the main text, and retains the contextual ‘sin’ interpretation as an anchored lexical alternative. It also improves comparative syntax and retains the historically specific term ‘ഗെഹെന്നാ’ without imposing later doctrinal associations.
