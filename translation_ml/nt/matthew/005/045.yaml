id: MAT.5.45
reference: Matthew 5:45
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅπως γένησθε υἱοὶ τοῦ πατρὸς ὑμῶν τοῦ ⸀ἐν οὐρανοῖς, ὅτι τὸν ἥλιον αὐτοῦ ἀνατέλλει ἐπὶ πονηροὺς καὶ ἀγαθοὺς καὶ βρέχει ἐπὶ δικαίους καὶ ἀδίκους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/045.yaml
  text: so that you may become sons of your Father in heaven[a], because he makes his sun rise on evil and good[c][b], and sends rain on righteous and unrighteous.
translation:
  language: ml
  text: അങ്ങനെ നിങ്ങൾ സ്വർഗത്തിലുള്ള[b] നിങ്ങളുടെ പിതാവിന്റെ പുത്രന്മാരായിത്തീരേണ്ടതിന്[a], അവിടുന്ന് തന്റെ സൂര്യനെ ദുഷ്ടരുടെയും നല്ലവരുടെയും മേൽ ഉദിപ്പിക്കുകയും നീതിമാന്മാരുടെയും അനീതിമാന്മാരുടെയും മേൽ മഴ പെയ്യിക്കുകയും ചെയ്യുന്നു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങളുടെ പിതാവിന്റെ മക്കളായിത്തീരേണ്ടതിന്.’ ഗ്രീക്കിൽ ‘പുത്രന്മാർ’ എന്നാണ്; മൂലത്തിലെ പുത്രത്വഭാഷ നിലനിർത്താൻ അത് മുഖ്യപാഠത്തിൽ സൂക്ഷിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘സ്വർഗങ്ങളിൽ.’ ഈ മത്തായിപ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാളമായി ‘സ്വർഗത്തിൽ’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘നീതിമാന്മാരുടെയും അനീതിമാന്മാരുടെയും മേൽ മഴ പെയ്യിക്കുന്നു.’ ഇരു പ്രയോഗങ്ങളിലും ദൈവത്തിന്റെ പ്രവർത്തകത്വമാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως γένησθε
  choice: അങ്ങനെ ... പുത്രന്മാരായിത്തീരേണ്ടതിന്
  rationale: ὅπως എന്നതിന്റെ ഉദ്ദേശ്യ/ഫലസൂചനയും γένησθε എന്നതിലെ ‘ആയിത്തീരുക’ എന്ന ചലനാത്മക അർഥവും നിലനിർത്തുന്നു. മുൻവാക്യത്തിലെ കല്പനയുമായി ബന്ധപ്പെടുന്ന ആശ്രിതപ്രയോഗമായും ഇത് സ്വാഭാവികമാണ്.
- source_word: υἱοὶ
  choice: പുത്രന്മാർ
  rationale: ഗ്രീക്കിലെ വ്യക്തമായ പുത്രത്വപദം നിലനിർത്തുന്നു; ശിഷ്യന്മാരെ പൊതുവായി സൂചിപ്പിക്കുന്ന സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: τοῦ πατρὸς ὑμῶν τοῦ ἐν οὐρανοῖς
  choice: സ്വർഗത്തിലുള്ള നിങ്ങളുടെ പിതാവ്
  rationale: പിതാവുമായുള്ള ബന്ധവും അവിടത്തെ സ്വർഗീയ വാസസ്ഥലവും വേർതിരിച്ചുതന്നെ പ്രതിഫലിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ ഏകവചനമായ ‘സ്വർഗം’ മുഖ്യപാഠത്തിൽ ഉപയോഗിച്ചു.
- source_word: τὸν ἥλιον αὐτοῦ ἀνατέλλει
  choice: തന്റെ സൂര്യനെ ... ഉദിപ്പിക്കുന്നു
  rationale: αὐτοῦ എന്ന ഉടമസ്ഥസൂചനയും ദൈവത്തിന്റെ പ്രവർത്തകത്വവും കാരണാർത്ഥകമായ ‘ഉദിപ്പിക്കുന്നു’ എന്ന പ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: ἐπὶ πονηροὺς καὶ ἀγαθοὺς
  choice: ദുഷ്ടരുടെയും നല്ലവരുടെയും മേൽ
  rationale: നാമമായി പ്രവർത്തിക്കുന്ന വിരുദ്ധവിശേഷണങ്ങളെ സംക്ഷിപ്തവും സമാന്തരവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: βρέχει
  choice: മഴ പെയ്യിക്കുകയും ചെയ്യുന്നു
  rationale: ദൈവം കർത്താവായിരിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി പറയുന്നു; ‘മഴ അയക്കുന്നു’ എന്ന അർഥവ്യാഖ്യാനം അനാവശ്യമായി മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: ἐπὶ δικαίους καὶ ἀδίκους
  choice: നീതിമാന്മാരുടെയും അനീതിമാന്മാരുടെയും മേൽ
  rationale: δίκαιος/ἄδικος എന്ന സ്ഥാപിതമായ നൈതിക വിരുദ്ധജോടിയെ വ്യക്തവും സമതുലിതവുമായി പരിഭാഷപ്പെടുത്തുന്നു.
theological_decisions:
- issue: ലിംഗസൂചകമായ പുത്രത്വഭാഷ
  choice: നിങ്ങളുടെ പിതാവിന്റെ പുത്രന്മാർ
  alternative: നിങ്ങളുടെ പിതാവിന്റെ മക്കൾ
  rationale: മൂലപാഠത്തിൽ τέκνα അല്ല, υἱοί ആണ്. അതിനാൽ മുഖ്യപാഠത്തിൽ പുത്രത്വഭാഷ നിലനിർത്തുന്നു; എന്നാൽ സന്ദർഭത്തിൽ ഇത് യേശുവിന്റെ ശിഷ്യരെ പൊതുവായി ഉൾക്കൊള്ളുന്നുവെന്നത് അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- issue: γένησθε എന്നതും ദൈവമക്കളാകുന്നതും
  choice: പുത്രന്മാരായിത്തീരേണ്ടതിന്
  alternative: പുത്രന്മാരായിരിക്കേണ്ടതിന് / പുത്രന്മാരാണെന്ന് തെളിയേണ്ടതിന്
  rationale: ‘ആയിത്തീരുക’ എന്ന മൂലക്രിയയുടെ ശക്തി നിലനിർത്തുന്നു; അതേസമയം മനുഷ്യപ്രവൃത്തി ദൈവിക ദത്തെടുക്കലിന്റെ രീതി സൃഷ്ടിക്കുന്നു എന്ന വ്യാഖ്യാനം പാഠത്തിൽ ചേർക്കുന്നില്ല. പിതാവിന്റെ പക്ഷപാതരഹിതമായ നന്മ അനുകരിക്കുന്നതിലൂടെ പ്രകടമാകുന്ന ബന്ധപരവും നൈതികവുമായ ആശയം തുറന്ന നിലയിൽ വിടുന്നു.
- issue: ദുഷ്ടർക്കും നല്ലവർക്കും ലഭിക്കുന്ന ദൈവപരിപാലനം
  choice: ഇരുവിഭാഗത്തിന്മേലും സൂര്യനെ ഉദിപ്പിക്കുകയും മഴ പെയ്യിക്കുകയും ചെയ്യുന്നു
  alternative: നല്ലവർക്കുള്ള പ്രതിഫലവും ദുഷ്ടർക്കുള്ള അംഗീകാരവും എന്ന വ്യാഖ്യാനം
  rationale: വാക്യം പൊതുകൃപാപരമായ ദൈവിക ദാനത്തെ മാത്രം പ്രസ്താവിക്കുന്നു; അതിൽ അന്തിമവിധിയെയോ ദുഷ്ടതയുടെ അംഗീകാരമെയോ കുറിച്ചുള്ള അധിക നിഗമനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കത്തക്കവണ്ണം, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവത്തോടെ പരിഭാഷപ്പെടുത്തി. ദൈവത്തെ സൂചിപ്പിക്കാൻ ആദരസൂചകമായ ‘അവിടന്ന്’ ഉപയോഗിച്ചു. ഗ്രീക്കിലെ സമാന്തരഘടന—ദുഷ്ടർ/നല്ലവർ, നീതിമാന്മാർ/അനീതിമാന്മാർ—നിലനിർത്തി; ‘ആയിത്തീരുക’ എന്നതിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം വ്യാഖ്യാനിച്ച് ഇല്ലാതാക്കിയിട്ടില്ല.
