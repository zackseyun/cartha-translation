id: MAT.5.42
reference: Matthew 5:42
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τῷ αἰτοῦντί σε ⸀δός, καὶ τὸν θέλοντα ἀπὸ σοῦ δανίσασθαι μὴ ἀποστραφῇς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/042.yaml
  text: Give to the one who asks you[a], and do not turn away from the one who wants to borrow from you.
translation:
  language: ml
  text: നിന്നോടു ചോദിക്കുന്നവനു കൊടുക്കുക; നിന്നിൽനിന്നു കടം വാങ്ങാൻ ആഗ്രഹിക്കുന്നവനിൽനിന്നു മുഖം തിരിക്കരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “നിന്നിൽനിന്നു കടം വാങ്ങാൻ ആഗ്രഹിക്കുന്നവനെ നിരസിക്കരുത്.”'
    reason: ἀποστραφῇς എന്നത് അക്ഷരാർഥത്തിൽ ‘മുഖം തിരിക്കുക’ എന്നും സന്ദർഭാർഥത്തിൽ ‘നിരസിക്കുക’ എന്നും ഗ്രഹിക്കാവുന്നതിനാൽ പ്രധാന പാഠത്തിൽ ദൃശ്യരൂപം നിലനിർത്തി, വ്യാഖ്യാനാത്മക പകരം അടിക്കുറിപ്പിൽ നൽകി.
lexical_decisions:
- source_word: αἰτοῦντί
  choice: ചോദിക്കുന്നവനു
  rationale: ആർട്ടിക്കിളോടുകൂടിയ വർത്തമാനകാല കൃദന്തം പൊതുവായി ചോദിക്കുന്ന ഒരാളെ സൂചിപ്പിക്കുന്നു. ‘ചോദിക്കുന്നവനു’ എന്നത് സ്വാഭാവികവും മൂലത്തിന്റെ പൊതുവായ പ്രയോഗം നിലനിർത്തുന്നതുമാണ്.
- source_word: δός
  choice: കൊടുക്കുക
  rationale: δίδωμι എന്ന ക്രിയയുടെ aorist imperative ആയതിനാൽ, അധികമായ നിർബന്ധസൂചന ചേർക്കാതെ നേരിട്ടുള്ള കല്പനയായി പരിഭാഷപ്പെടുത്തി.
- source_word: θέλοντα
  choice: ആഗ്രഹിക്കുന്നവനെ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ വർത്തമാനകാല കൃദന്തമായ θέλοντα, ഇവിടെ കടം വാങ്ങാൻ ആഗ്രഹിക്കുന്ന വ്യക്തിയെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
- source_word: ἀπὸ σοῦ
  choice: നിന്നിൽനിന്നു
  rationale: കടം വാങ്ങുന്നതിന്റെ ഉറവിടം വ്യക്തമാക്കുന്ന സാധാരണമായ സ്രോതസ്സർഥം നിലനിർത്തുന്നു.
- source_word: δανίσασθαι
  choice: കടം വാങ്ങാൻ
  rationale: സന്ദർഭത്തിൽ infinitive-ന് ‘കടം വാങ്ങുക’ എന്ന അർഥമാണ്. മൂലത്തിൽ പണമെന്ന വസ്തു വ്യക്തമാക്കിയിട്ടില്ലാത്തതിനാൽ ‘പണം കടം വാങ്ങാൻ’ എന്ന് ചുരുക്കിയില്ല.
- source_word: μὴ ἀποστραφῇς
  choice: മുഖം തിരിക്കരുത്
  rationale: നിഷേധകല്പനയുടെ നേരിട്ടുള്ള ശക്തിയും ἀποστρέφω എന്ന ക്രിയയിലെ തിരിഞ്ഞുമാറുന്ന ദൃശ്യരൂപവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ നൈതിക കല്പനയുടെ വ്യാപ്തിയും ശക്തിയും
  choice: മൂലത്തിലുള്ള പൊതുവായ വ്യാപ്തി ചുരുക്കാതെയും കല്പനയുടെ ശക്തി മയപ്പെടുത്താതെയും രണ്ട് നേരിട്ടുള്ള കല്പനകളായി അവതരിപ്പിച്ചു.
  alternative: ‘അർഹരായവർക്കു മാത്രം കൊടുക്കുക’ എന്ന പരിധി ചേർക്കുക, അല്ലെങ്കിൽ രണ്ടാമത്തെ കല്പനയെ വ്യാഖ്യാനാത്മകമായി ‘നിരസിക്കരുത്’ എന്നു മാത്രം നൽകുക.
  rationale: വാക്യം അപേക്ഷകന്റെ അർഹതയെക്കുറിച്ചുള്ള നിയന്ത്രണം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ പിന്നീടുള്ള നൈതിക വ്യവസ്ഥകൾ വിവർത്തനത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതെ മൂലത്തിന്റെ പൊതുസ്വഭാവവും ഉദ്ദേശപൂർവമായ കടുപ്പവും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘മുഖം തിരിക്കരുത്’ എന്ന പ്രയോഗം സ്വാഭാവികമായിരിക്കെ ഗ്രീക്ക് ക്രിയയുടെ രൂപകവും സംരക്ഷിക്കുന്നു; ‘കടം’ പണത്തിലേക്ക് മാത്രം പരിമിതപ്പെടുത്തിയിട്ടില്ല.
