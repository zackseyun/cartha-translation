  source_fidelity: 'The Malayalam accurately renders both imperatives and preserves the generic substantival participles: “നിന്നോടു ചോദിക്കുന്നവനു” corresponds to τῷ αἰτοῦντί σε, and “നിന്നിൽനിന്നു കടം വാങ്ങാൻ ആഗ്രഹിക്കുന്നവനിൽനിന്നു മുഖം തിരിക്കരുത്” corresponds to τὸν θέλοντα ἀπὸ σοῦ δανίσασθαι μὴ ἀποστραφῇς. It does not add qualifications concerning the requester or borrower.'
  naturalness: The wording is clear, idiomatic modern Malayalam in a suitably dignified biblical register. “മുഖം തിരിക്കരുത്” naturally conveys the figurative force of ἀποστραφῇς without unnecessarily replacing it in the main text with the more interpretive “നിരസിക്കരുത്.”
  terminology: “കടം വാങ്ങാൻ” appropriately leaves the object of borrowing unspecified, as in Greek. The imperative “കൊടുക്കുക” is direct and faithful. The generic masculine participial forms are conventional and understandable in this register.
