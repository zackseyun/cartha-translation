id: MAT.5.18
reference: Matthew 5:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀμὴν γὰρ λέγω ὑμῖν, ἕως ἂν παρέλθῃ ὁ οὐρανὸς καὶ ἡ γῆ, ἰῶτα ἓν ἢ μία κεραία οὐ μὴ παρέλθῃ ἀπὸ τοῦ νόμου, ἕως ἂν πάντα γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/018.yaml
  text: For truly I say to you[a], until heaven and earth pass away[c][b], not one iota or one stroke will ever pass away from the law until all things happen.
translation:
  language: ml
  text: 'കാരണം, സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: ആകാശവും ഭൂമിയും കടന്നുപോകുന്നതുവരെ, ന്യായപ്രമാണത്തിൽനിന്ന് ഒരു യോതായോ ഒരു ചെറിയ വരയോ പോലും ഒരിക്കലും കടന്നുപോകുകയില്ല—എല്ലാം സംഭവിക്കുന്നതുവരെ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμὴν
  choice: സത്യമായി
  rationale: യേശുവിന്റെ ആധികാരികമായ ഉറപ്പുവാക്കിന്റെ ഗൗരവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തെ വിശദീകരിച്ച് പിന്തുണയ്ക്കുന്ന ബന്ധകശക്തി നിലനിർത്തുന്നു.
- source_word: λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: മൂലവാക്യത്തിന്റെ നേരിട്ടുള്ളതും ആധികാരികവുമായ ശൈലി സംരക്ഷിക്കുന്നു.
- source_word: ἕως ἂν παρέλθῃ ὁ οὐρανὸς καὶ ἡ γῆ
  choice: ആകാശവും ഭൂമിയും ഒഴിഞ്ഞുപോകുന്നതുവരെ
  rationale: ഭാവിയിൽ സംഭവിക്കാവുന്ന പരിധിയും παρέρχομαι എന്നതിന്റെ അവസാനിച്ചുപോകുക എന്ന ആശയവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἰῶτα ἓν
  choice: ഒരു യോതാ പോലും
  rationale: മൂലത്തിൽ പേരെടുത്തുപറയുന്ന ഏറ്റവും ചെറിയ അക്ഷരത്തെ നിലനിർത്തുന്നു; വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: μία κεραία
  choice: ഒരു ചെറിയ വര പോലും
  rationale: അക്ഷരങ്ങളെ വേർതിരിക്കുന്ന സൂക്ഷ്മമായ എഴുത്തടയാളത്തെ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: οὐ μὴ παρέλθῃ
  choice: ഒരിക്കലും ഒഴിഞ്ഞുപോകുകയില്ല
  rationale: οὐ μή ഘടനയുടെ ശക്തമായ നിഷേധം മലയാളത്തിൽ വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: ἀπὸ τοῦ νόμου
  choice: ന്യായപ്രമാണത്തിൽനിന്ന്
  rationale: സന്ദർഭത്തിലെ തിരുവെഴുത്തുസംബന്ധമായ ദൈവിക നിയമത്തെ സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ പദം ഉപയോഗിക്കുന്നു.
- source_word: ἕως ἂν πάντα γένηται
  choice: എല്ലാം സംഭവിക്കുന്നതുവരെ
  rationale: γίνομαι എന്നതിന്റെ സംഭവിക്കുക/നടക്കുക എന്ന വിശാലത നിലനിർത്തി, പൂർത്തീകരണത്തെ മാത്രം നിർബന്ധമായി മുൻനിർത്തുന്നില്ല.
theological_decisions:
- issue: νόμος എന്നതിന്റെ വ്യാപ്തി
  choice: ന്യായപ്രമാണം എന്ന തിരുവെഴുത്തുസംബന്ധമായ അർഥം
  alternative: പ്രത്യേകമായി തോറാ/പഞ്ചഗ്രന്ഥം; അല്ലെങ്കിൽ വിപുലമായ അർഥത്തിൽ പഴയനിയമ തിരുവെഴുത്തുകൾ
  rationale: മത്തായി 5:17–19-ലെ ‘ന്യായപ്രമാണവും പ്രവാചകന്മാരും’ എന്ന സന്ദർഭം തിരുവെഴുത്തിലെ ദൈവിക നിയമത്തെ സൂചിപ്പിക്കുന്നു; പരിഭാഷ അതിന്റെ കൃത്യമായ വ്യാപ്തി അധികമായി നിർണയിക്കുന്നില്ല.
- issue: πάντα γένηται എന്നതിന്റെ അർഥശക്തി
  choice: എല്ലാം സംഭവിക്കുന്നതുവരെ
  alternative: എല്ലാം നിവൃത്തിയാകുന്നതുവരെ / എല്ലാം സംഭവിച്ചുതീരുന്നതുവരെ
  rationale: സംഭവിക്കൽ, സാക്ഷാത്കാരം, പൂർത്തീകരണം എന്നീ സാധ്യതകൾ ഈ വാക്യത്തിൽ ഒത്തുചേരാം; മുഖ്യപാഠം വിശാലത നിലനിർത്തുകയും അടിക്കുറിപ്പ് സാധാരണമായ മറ്റൊരു വായന നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘യോതാ’ എന്ന മൂലത്തിലെ അക്ഷരനാമം നിലനിർത്തി അടിക്കുറിപ്പിലൂടെ വിശദീകരിച്ചു; ‘ന്യായപ്രമാണം’ എന്ന പദം തിരുവെഴുത്തുസന്ദർഭം വ്യക്തമാക്കുന്നു.
