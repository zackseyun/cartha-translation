  - marker: b
    text: ‘ഒരു ചെറിയ വര’ എന്നത് ഒരു അക്ഷരത്തിന്റെ അതിസൂക്ഷ്മമായ എഴുത്തുവരയെയോ കൊമ്പിനെയോ സൂചിപ്പിക്കുന്നു; ‘ഒരു കൊച്ചു അടയാളം’ എന്നും പരിഭാഷപ്പെടുത്താം.
