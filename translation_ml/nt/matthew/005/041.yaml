  yaml_path: translation/nt/matthew/005/041.yaml
  text: And whoever forces you to go one mile[c][b][a], go with him two miles.
translation:
  language: ml
  text: ആരെങ്കിലും നിന്നെ ഒരു മൈൽ ദൂരം പോകാൻ നിർബന്ധിച്ചാൽ[a], അയാളോടൊപ്പം രണ്ടു മൈൽ പോകുക[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിർബന്ധിത സേവനത്തിന് നിയോഗിച്ചാൽ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഈ ക്രിയ ഔദ്യോഗിക അധികാരത്തിന്റെ ബലത്തിൽ ഒരാളെ സേവനത്തിന് നിർബന്ധിക്കുന്നതിനെ സൂചിപ്പിക്കാം; റോമൻ ഭരണകാലത്തെ നിർബന്ധിത സേവനം ഇവിടെ പശ്ചാത്തലമായിരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘ഒരു മൈൽ … രണ്ട്’; രണ്ടാമത്തെ പ്രയോഗത്തിൽ ‘മൈൽ’ എന്നത് അധ്യാഹരിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: ആരെങ്കിലും
  rationale: പൊതുവായ ഒരു സാഹചര്യം അവതരിപ്പിക്കുന്ന അനിശ്ചിത ബന്ധസർവനാമത്തിന്റെ വ്യാപകത സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀγγαρεύσει
  choice: പോകാൻ നിർബന്ധിച്ചാൽ
  rationale: ഔദ്യോഗിക അധികാരത്താൽ ഒരാളെ നിർബന്ധിത സേവനത്തിന് നിയോഗിക്കുന്ന ക്രിയയുടെ ബലപ്രയോഗഭാവം വ്യക്തമാക്കുന്നു; സഞ്ചാരത്തിന്റെ ആശയം ദൂരസൂചനയിൽനിന്ന് ലഭിക്കുന്നു.
- source_word: μίλιον ἕν
  choice: ഒരു മൈൽ ദൂരം
  rationale: റോമൻ മൈലിനെ സൂചിപ്പിക്കുന്ന കൃത്യമായ അളവ് നിലനിർത്തുന്നു; ‘ദൂരം’ ചേർക്കുന്നത് മലയാളത്തിൽ പ്രയോഗം സ്വാഭാവികമാക്കുന്നു.
- source_word: ὕπαγε
  choice: പോകുക
  rationale: മുന്നോട്ടു പോകാനുള്ള ഏകവചന ആജ്ഞയെ ലളിതവും മാന്യവുമായ മലയാളത്തിൽ നേരിട്ട് അവതരിപ്പിക്കുന്നു.
- source_word: μετ’ αὐτοῦ
  choice: അയാളോടൊപ്പം
  rationale: μετά + genitive സൂചിപ്പിക്കുന്ന സഹഗമനം സ്വാഭാവികമായി നൽകുന്നു; ഗ്രീക്കിലെ പുരുഷലിംഗ സർവനാമത്തിന്റെ സന്ദർഭപരമായ രൂപവും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: δύο
  choice: രണ്ടു മൈൽ
  rationale: ഗ്രീക്കിൽ ‘രണ്ട്’ എന്നു മാത്രം വന്നിട്ടുണ്ടെങ്കിലും മുമ്പുള്ള ‘മൈൽ’ ഇവിടെ അധ്യാഹരിക്കപ്പെട്ടിരിക്കുന്നു; മലയാളത്തിലെ വ്യക്തതയ്ക്കും സ്വാഭാവികതയ്ക്കുമായി അളവുപദം ആവർത്തിക്കുന്നു.
theological_decisions:
- issue: അധികാരപ്രയോഗത്തിലൂടെയുള്ള നിർബന്ധിത സേവനത്തിന്റെ ചരിത്ര-സാമൂഹിക പശ്ചാത്തലം
  choice: പ്രധാനവാക്യത്തിൽ നിർബന്ധത്തിന്റെ ആശയം വ്യക്തമാക്കുന്നു; എന്നാൽ റോമൻ സൈനികരെയോ ചുമടുവഹിക്കലിനെയോ പ്രത്യേകം പരാമർശിക്കുന്നില്ല.
  alternative: റോമൻ സൈനികൻ നിർബന്ധിച്ചു ചുമടെടുപ്പിക്കുന്നതായി വ്യക്തമായി പരിഭാഷപ്പെടുത്തുക.
  rationale: ἀγγαρεύω എന്ന ക്രിയയും ‘മൈൽ’ എന്ന അളവും റോമൻ ഭരണകാലത്തെ നിർബന്ധിത സേവനം ഓർമിപ്പിക്കുന്നുവെങ്കിലും മൂലവാക്യം സൈനികനെയോ പ്രത്യേക ജോലിയെയോ പേരെടുത്ത് പറയുന്നില്ല. അതിനാൽ ചരിത്രസൂചന അടിക്കുറിപ്പിൽ നൽകുകയും പ്രധാനവാക്യത്തിലെ വ്യാപകത സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആജ്ഞാരൂപം ഉപയോഗിച്ചു. ‘അയാളോടൊപ്പം’ എന്നത് സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്. ചരിത്രപരമായ റോമൻ പശ്ചാത്തലം പ്രധാനവാക്യത്തിൽ അതിവ്യക്തമാക്കാതെ അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
