source:
  edition: SBLGNT
  text: μήτε ἐν τῇ γῇ, ὅτι ὑποπόδιόν ἐστιν τῶν ποδῶν αὐτοῦ· μήτε εἰς Ἱεροσόλυμα, ὅτι πόλις ἐστὶν τοῦ μεγάλου βασιλέως·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/035.yaml
  text: nor by the earth[a], because it is the footstool of his feet; nor by Jerusalem, because it is the city of the great King[d][c][b];
translation:
  language: ml
  text: ഭൂമിയെക്കൊണ്ടും ആണയിടരുത്; കാരണം, അത് അവന്റെ പാദങ്ങൾക്കുള്ള പാദപീഠമാണ്.[a] യെരൂശലേമിനെക്കൊണ്ടും ആണയിടരുത്;[b] കാരണം, അത് മഹാനായ രാജാവിന്റെ നഗരമാണ്.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'യെശയ്യാവ് 66:1-ലേക്കുള്ള സൂചന: “ഭൂമി എന്റെ പാദപീഠം.”'
    reason: cross_reference
  - marker: b
    text: യെരൂശലേമിനെക്കൊണ്ടും—ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “യെരൂശലേമിലേക്കും/യെരൂശലേമിന്റെ നേരെയും”; ഇവിടെ ആണയിടൽഭാഷയിലെ പ്രയോഗാർത്ഥമാണ് പരിഭാഷയിൽ നൽകിയിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: സങ്കീർത്തനം 48:2-ലേക്കുള്ള സൂചന; അവിടെ യെരൂശലേം “മഹാനായ രാജാവിന്റെ നഗരം” എന്നു വിളിക്കപ്പെടുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: μήτε
  choice: …കൊണ്ടും ആണയിടരുത്
  rationale: മുൻവാക്യത്തിൽ ആരംഭിച്ച നിരോധനം തുടരുന്ന μήτε എന്ന പദത്തിന്റെ സമന്വയബലം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ഗ്രീക്കിൽ വിട്ടുകളഞ്ഞിരിക്കുന്ന ‘ആണയിടരുത്’ എന്ന ക്രിയ സന്ദർഭത്തിൽനിന്ന് പൂരിപ്പിച്ചിരിക്കുന്നു.
- source_word: ἐν τῇ γῇ
  choice: ഭൂമിയെക്കൊണ്ടും
  rationale: സത്യപ്രതിജ്ഞയുടെ സൂത്രവാക്യത്തിൽ ἐν എന്നത് ‘എവിടെ’ എന്നല്ല, ആണയിടുന്നതിനുള്ള ആധാരം എന്ന അർഥത്തിലാണ്; ‘ഭൂമിയെക്കൊണ്ടും’ ആ അർഥവും സമാന്തരഘടനയും നിലനിർത്തുന്നു.
- source_word: γῇ
  choice: ഭൂമി
  rationale: സ്വർഗവും യെരൂശലേമും ഉൾപ്പെടുന്ന സന്ദർഭത്തിൽ ഇത് ഒരു പ്രത്യേക ദേശത്തെയല്ല, ഭൂമിയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ὅτι
  choice: കാരണം
  rationale: നിരോധനത്തിനുള്ള കാരണം വ്യക്തമാക്കുന്ന causal ബന്ധം ആധുനിക മലയാളത്തിൽ നേരിട്ട് നൽകുന്നു.
- source_word: ὑποπόδιον τῶν ποδῶν αὐτοῦ
  choice: അവന്റെ പാദങ്ങൾക്കുള്ള പാദപീഠം
  rationale: ‘പാദപീഠം’ മൂലരൂപകവും തിരുവെഴുത്തുസൂചനയും കാത്തുസൂക്ഷിക്കുന്നു; genitive ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി ‘പാദങ്ങൾക്കുള്ള’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: εἰς Ἱεροσόλυμα
  choice: യെരൂശലേമിനെക്കൊണ്ടും
  rationale: ഇവിടെ εἰς ആണയിടൽഭാഷയിൽ ‘യെരൂശലേമിനെച്ചൊല്ലി/യെരൂശലേമിനെക്കൊണ്ട്’ എന്ന പ്രയോഗാർത്ഥത്തിൽ വരുന്നു. ദിശാസൂചകമായ അക്ഷരാർഥം മുഖ്യവാചകത്തെ അസ്വാഭാവികമാക്കുന്നതിനാൽ പദഭേദം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: πόλις
  choice: നഗരം
  rationale: πόλις എന്നതിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളസമാനം.
- source_word: τοῦ μεγάλου βασιλέως
  choice: മഹാനായ രാജാവിന്റെ
  rationale: ഗ്രീക്കിലെ വിശേഷണവും possessive genitive-ഉം കാത്തുസൂക്ഷിക്കുകയും സങ്കീർത്തനം 48-ലെ ഉയർന്ന ശൈലി നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘അവന്റെ പാദങ്ങൾ’ എന്നതിലെ സർവനാമത്തിന്റെ സൂചിതവ്യക്തി
  choice: ‘അവന്റെ’ എന്നു തന്നെയാക്കി, ദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് സന്ദർഭം വ്യക്തമാക്കാൻ അനുവദിച്ചു.
  alternative: ‘ദൈവത്തിന്റെ പാദങ്ങൾ’ എന്ന് സൂചിതവ്യക്തിയെ മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കുക.
  rationale: αὐτοῦ എന്ന ഗ്രീക്ക് സർവനാമം ദൈവനാമം തുറന്നുപറയുന്നില്ല. യെശയ്യാവ് 66:1-ലേക്കുള്ള സൂചന ദൈവമാണ് ഉദ്ദേശിതനെന്ന് വ്യക്തമാക്കുന്നുവെങ്കിലും, മൂലത്തിലെ പരോക്ഷത പരിഭാഷയിൽ നിലനിർത്തി.
- issue: ‘മഹാനായ രാജാവ്’ എന്ന പ്രയോഗത്തിന്റെ സൂചിതവ്യക്തി
  choice: മൂലത്തിലെ ബഹുമാനപദവി അതേപടി നിലനിർത്തി; ദൈവം എന്ന് മുഖ്യവാചകത്തിൽ ചേർത്തില്ല.
  alternative: ‘മഹാനായ രാജാവായ ദൈവത്തിന്റെ’ എന്ന് വിശദീകരിക്കുക.
  rationale: സങ്കീർത്തനം 48:2-ലെ സൂചന ദൈവിക സൂചിതവ്യക്തിയെ വ്യക്തമാക്കുന്നു; എങ്കിലും ഗ്രീക്ക് വാചകം പറയുന്നതിലധികം മുഖ്യപാഠത്തിൽ ചേർക്കാതിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ഒറ്റവാക്യമായി വായിക്കുമ്പോൾ അർഥം വ്യക്തമാകാൻ മുൻവാക്യത്തിൽനിന്ന് ഗ്രീക്കിൽ അധ്യാഹരിക്കപ്പെടുന്ന ‘ആണയിടരുത്’ ഓരോ സമാന്തരഘടകത്തിലും പ്രകടമാക്കി. ‘പാദപീഠം,’ ‘മഹാനായ രാജാവ്’ എന്നീ പദങ്ങൾ തിരുവെഴുത്തുസൂചനകളുടെ ഉയർന്ന ഭാവം നിലനിർത്തുന്നു.
