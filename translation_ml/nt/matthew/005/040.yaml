id: MAT.5.40
reference: Matthew 5:40
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ τῷ θέλοντί σοι κριθῆναι καὶ τὸν χιτῶνά σου λαβεῖν, ἄφες αὐτῷ καὶ τὸ ἱμάτιον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/040.yaml
  text: And to the one who wants to sue you and take your tunic[b][a], let him have your cloak also.
translation:
  language: ml
  text: നിന്നെതിരെ കേസ് കൊടുത്ത് നിന്റെ അങ്കി[b] എടുക്കാൻ ആഗ്രഹിക്കുന്നവന് നിന്റെ മേലങ്കിയും വിട്ടുകൊടുക്കുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “അങ്കി” ശരീരത്തോട് ചേർന്ന് ധരിച്ചിരുന്ന ഉള്ളുടുപ്പിനെയും “മേലങ്കി” അതിനു മുകളിൽ ധരിച്ചിരുന്ന പുറംവസ്ത്രത്തെയും സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: τῷ θέλοντί
  choice: ആഗ്രഹിക്കുന്നവന്
  rationale: വർത്തമാനകാല കൃദന്തരൂപം ഇവിടെ പൊതുവായ ഒരാളെ സൂചിപ്പിക്കുന്നു; θέλω എന്നതിലെ ഇച്ഛയുടെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: σοι κριθῆναι
  choice: നിനക്കെതിരെ കേസ് നടത്തി
  rationale: നിയമപരമായ വിധിനിർണയത്തിലേക്കോ കോടതി നടപടിയിലേക്കോ പോകുന്നതാണ് സന്ദർഭത്തിലെ അർഥം. വസ്ത്രം കൈവശപ്പെടുത്താനുള്ള നിയമനടപടി ആണെന്നത് ഈ പ്രയോഗം വ്യക്തമായി അറിയിക്കുന്നു; പദശഃ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: χιτῶνά
  choice: അങ്കി
  rationale: χιτών ശരീരത്തോട് ചേർന്ന് ധരിച്ചിരുന്ന ഉള്ളുടുപ്പാണ്. ചരിത്രപരമായ വസ്ത്രഭേദം നിലനിർത്തുന്നതിനൊപ്പം സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന പദമാണ് ‘അങ്കി’.
- source_word: λαβεῖν
  choice: എടുക്കാൻ
  rationale: നിയമനടപടിയിലൂടെ വസ്ത്രം കൈവശപ്പെടുത്തുക എന്ന സന്ദർഭാർഥം നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: ἄφες
  choice: വിട്ടുകൊടുക്കുക
  rationale: ἀφίημι എന്ന ആജ്ഞാരൂപം ഇവിടെ അവകാശം ഉന്നയിക്കാതെ മറ്റെയാൾക്ക് കൈവശം നൽകുക എന്ന ശക്തമായ അർഥം വഹിക്കുന്നു. നേരിട്ടുള്ള ആജ്ഞയുടെ മൂർച്ച ഇതിൽ നിലനിൽക്കുന്നു.
- source_word: ἱμάτιον
  choice: മേലങ്കി
  rationale: ἱμάτιον ഉള്ളങ്കിയായ χιτών-ൽനിന്ന് വ്യത്യസ്തമായ പുറംവസ്ത്രമാണ്; ‘മേലങ്കി’ ഈ വ്യത്യാസം വ്യക്തവും സ്വാഭാവികവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: καὶ ... καὶ
  choice: … മേലങ്കിയും
  rationale: ആദ്യ καί മുൻവാക്യത്തോടുള്ള ബന്ധവും രണ്ടാമത്തേത് അധികമായി മേലങ്കി വിട്ടുകൊടുക്കുന്നതും സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘-യും’ ആ കൂട്ടിച്ചേർക്കൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: നിയമവ്യവഹാരത്തിൽ യേശുവിന്റെ നിർദേശത്തിന്റെ ധാർമ്മിക ശക്തി
  choice: പ്രതികാരം ചെയ്യാതെ അതിരുകടന്ന ഉദാരത കാണിക്കാനുള്ള നേരിട്ടുള്ള ആജ്ഞയായി പരിഭാഷപ്പെടുത്തി.
  alternative: സ്വന്തം അവകാശങ്ങൾ വിട്ടുകൊടുക്കുക എന്ന പൊതുതത്ത്വമായി മാത്രം അയവോടെ പരിഭാഷപ്പെടുത്തുക.
  rationale: ἄφες എന്ന ആജ്ഞാരൂപവും വ്യക്തമായ രണ്ടു വസ്ത്രങ്ങളുടെ ദൃശ്യവും ഉപദേശത്തിന്റെ മൂർച്ച നിലനിർത്തണമെന്ന് ആവശ്യപ്പെടുന്നു. അതിനെ രൂപകം മാത്രമാക്കുകയോ പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കുകയോ ചെയ്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘കേസ് നടത്തി’ സാധാരണ വായനക്കാർക്ക് നിയമസന്ദർഭം ഉടൻ വ്യക്തമാക്കുന്നു; ‘അങ്കി/മേലങ്കി’ എന്നീ പദങ്ങൾ പുരാതന വസ്ത്രങ്ങളിലെ ഉദ്ദേശ്യമായ വ്യത്യാസം നിലനിർത്തുന്നു.
