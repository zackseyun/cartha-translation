id: MAT.5.7
reference: Matthew 5:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μακάριοι οἱ ἐλεήμονες, ὅτι αὐτοὶ ἐλεηθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/007.yaml
  text: Blessed are the merciful[a], for they will be shown mercy.
translation:
  language: ml
  text: കരുണയുള്ളവർ അനുഗൃഹീതർ; കാരണം അവർക്കു കരുണ ലഭിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരോടു കരുണ കാണിക്കപ്പെടും.” ഗ്രീക്കിൽ ഇത് ഭാവികാല കർമണി ക്രിയയാണ്.
    reason: ഗ്രീക്കിലെ കർമണിരൂപം കൂടുതൽ അക്ഷരാർഥത്തിൽ കാണിക്കുന്ന പരിഭാഷാവികല്പം നൽകുന്നു.
lexical_decisions:
- source_word: μακάριοι
  choice: അനുഗൃഹീതർ
  rationale: ദൈവിക പ്രസാദവും അതിൽനിന്നുള്ള നന്മയും സൂചിപ്പിക്കുന്ന മംഗളവചനപദമായി ഇത് യോജിക്കുന്നു; കേവലമായ മാനസിക സന്തോഷം എന്ന അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: οἱ ἐλεήμονες
  choice: കരുണയുള്ളവർ
  rationale: നാമമായി പ്രവർത്തിക്കുന്ന ഗ്രീക്ക് വിശേഷണത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; തുടർന്നുള്ള കരുണ എന്ന പദവുമായുള്ള ശാബ്ദിക ബന്ധവും നിലനിർത്തുന്നു.
- source_word: ὅτι
  choice: കാരണം
  rationale: മംഗളപ്രഖ്യാപനത്തിന്റെ അടിസ്ഥാനമോ കാരണമോ വ്യക്തമാക്കുന്ന ഗ്രീക്ക് സംയോജകത്തിന്റെ കാര്യകാരണ അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: αὐτοὶ
  choice: അവർക്ക്
  rationale: കരുണയുള്ള അതേ ആളുകൾക്കുതന്നെയാണ് കരുണ ലഭിക്കുക എന്ന പ്രതിസാമ്യം മലയാളത്തിലെ സർവനാമം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἐλεηθήσονται
  choice: കരുണ ലഭിക്കും
  rationale: ἐλεάω എന്ന ക്രിയയുടെ ഭാവികാല കർമണി അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ആദ്യപാദത്തിലെ കരുണ എന്ന പദത്തിന്റെ ആവർത്തനം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: വാഗ്ദാനം ചെയ്യപ്പെട്ട കരുണയുടെ കർത്താവ്
  choice: കരുണ നൽകുന്ന കർത്താവിനെ വ്യക്തമാക്കാതെ “അവർക്കു കരുണ ലഭിക്കും” എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ദൈവം അവരോടു കരുണ കാണിക്കും.
  rationale: ഗ്രീക്കിലെ ഭാവികാല കർമണി ക്രിയ കർത്താവിനെ പ്രസ്താവിക്കുന്നില്ല. സന്ദർഭത്തിൽ ദൈവം ശക്തമായി സൂചിതനായാലും, മൂലപാഠം പറയുന്നതിലധികം വ്യക്തമാക്കാതിരിക്കാൻ കർത്താവിനെ അനിർദ്ദിഷ്ടമായി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ചുരുക്കവും ഗൗരവവുമുള്ള മംഗളവചനശൈലി. “ഭാഗ്യവാന്മാർ” എന്നത് ഭാഗ്യം എന്ന ആശയം മുൻനിർത്താൻ സാധ്യതയുള്ളതിനാൽ “അനുഗൃഹീതർ” തെരഞ്ഞെടുത്തു. മൂലത്തിലെ കരുണ-കരുണ എന്ന പദപ്രതിധ്വനി സൂക്ഷിച്ചു.
