id: MAT.5.14
reference: Matthew 5:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὑμεῖς ἐστε τὸ φῶς τοῦ κόσμου. οὐ δύναται πόλις κρυβῆναι ἐπάνω ὄρους κειμένη·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/014.yaml
  text: You are the light of the world[a]. A city set on a hill cannot be hidden.
translation:
  language: ml
  text: നിങ്ങൾ ലോകത്തിന്റെ വെളിച്ചമാണ്. മലമുകളിൽ സ്ഥിതിചെയ്യുന്ന ഒരു നഗരം മറഞ്ഞിരിക്കാനാവില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തോട് കൂടുതൽ അടുത്ത്: ‘മലമുകളിൽ കിടക്കുന്ന ഒരു നഗരത്തെ മറയ്ക്കാനാവില്ല.’'
    reason: κειμένη എന്നതിന് ‘കിടക്കുന്ന’ എന്നും κρυβῆναι എന്നതിന് ‘മറയ്ക്കാനാവില്ല’ എന്നും കൂടുതൽ രൂപപരമായി അടുത്ത പരിഭാഷ നൽകുന്നതിനായി.
lexical_decisions:
- source_word: Ὑμεῖς
  choice: നിങ്ങൾ
  rationale: ഗ്രീക്കിൽ ബഹുവചന സർവനാമം വ്യക്തമായും ഊന്നലോടെയും നൽകിയിരിക്കുന്നു. മലയാളത്തിലെ ‘നിങ്ങൾ’ ബഹുവചന അഭിസംബോധന സ്വാഭാവികമായി നിലനിർത്തുന്നു; ‘നിങ്ങൾ തന്നെയാണ്’ എന്നു ചേർക്കുന്നത് ആവശ്യത്തിലധികം ഊന്നൽ വരുത്താം.
- source_word: τὸ φῶς
  choice: വെളിച്ചം
  rationale: പ്രകാശത്തെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള രൂപകം മലയാളത്തിൽ സ്വാഭാവികമായി ‘വെളിച്ചം’ എന്നു നിലനിർത്തുന്നു. ‘ലോകത്തിന്റെ’ എന്ന സംബന്ധികപ്രയോഗത്തോടൊപ്പം നിർദിഷ്ടത വ്യക്തമാണ്.
- source_word: τοῦ κόσμου
  choice: ലോകത്തിന്റെ
  rationale: സംബന്ധികവിഭക്തിയുടെ സ്വാഭാവികവും ഔപചാരികമായി അടുത്തതുമായ പരിഭാഷയാണിത്; കൂടുതൽ വ്യാഖ്യാനാത്മകമായ ‘ലോകത്തിനുള്ള’ എന്ന വായന ഒഴിവാക്കുന്നു.
- source_word: οὐ δύναται
  choice: ആവില്ല
  rationale: കഴിവില്ലായ്മയെയോ അസാധ്യതയെയോ മലയാളത്തിൽ സംക്ഷിപ്തമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: πόλις
  choice: ഒരു പട്ടണം
  rationale: πόλις ഒരു നഗരത്തെയോ പട്ടണത്തെയോ സൂചിപ്പിക്കാം. ഈ ദൃശ്യരൂപത്തിൽ ഉയർന്ന സ്ഥലത്തുള്ള ജനവാസകേന്ദ്രത്തിന് ‘പട്ടണം’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: κρυβῆναι
  choice: മറഞ്ഞിരിക്കാൻ
  rationale: നിഷ്ക്രിയമായ ‘മറയ്ക്കപ്പെടുക’ എന്നതിനെക്കാൾ, സ്ഥിതിയെ സൂചിപ്പിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘മറഞ്ഞിരിക്കുക’ സ്വാഭാവിക മലയാളമാണ്; ദൃശ്യപ്പെടാതിരിക്കാനാവില്ല എന്ന അർഥം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: ἐπάνω ὄρους
  choice: മലമുകളിൽ
  rationale: ὄρος എന്നത് മല/പർവതം എന്ന വിശാല അർഥമുള്ള പദമാണ്. ഇവിടെ ‘മലമുകളിൽ’ സംക്ഷിപ്തവും ദൃശ്യവുമായ സമാനപദപ്രയോഗമാണ്.
- source_word: κειμένη
  choice: സ്ഥിതിചെയ്യുന്ന
  rationale: ‘കിടക്കുന്ന’ എന്ന അക്ഷരാർഥത്തേക്കാൾ ഒരു പട്ടണത്തിന്റെ സ്ഥാനത്തെ വിവരിക്കാൻ ‘സ്ഥിതിചെയ്യുന്ന’ സ്വാഭാവികവും കൃത്യവുമാണ്.
theological_decisions:
- issue: ശിഷ്യരെ ലോകത്തിന്റെ വെളിച്ചമായി നേരിട്ട് തിരിച്ചറിയുന്ന രൂപകം
  choice: ‘നിങ്ങൾ ലോകത്തിന്റെ വെളിച്ചമാണ്’ എന്ന നേരിട്ടുള്ള രൂപകം നിലനിർത്തി.
  alternative: ‘നിങ്ങൾ ലോകത്തിനുള്ള വെളിച്ചമാണ്.’
  rationale: τοῦ κόσμου എന്ന സംബന്ധികരൂപം വ്യാഖ്യാനാത്മകമായി ലക്ഷ്യാർത്ഥമാക്കാതെ നിലനിർത്തുന്നു. ശിഷ്യരുടെ പങ്കിനെക്കുറിച്ചുള്ള ദൈവശാസ്ത്രപരമായ വിശദീകരണം പരിഭാഷയിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, ഗൗരവമുള്ള ശൈലി. ആദ്യവാക്യത്തിലെ നേരിട്ടുള്ള രൂപകം സംരക്ഷിച്ചു; രണ്ടാം വാക്യത്തിൽ സ്വാഭാവിക മലയാളത്തിനായി ‘സ്ഥിതിചെയ്യുന്ന’ ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വാക്യത്തിന്റെ അവസാനം ചേർത്തിരിക്കുന്നു.
