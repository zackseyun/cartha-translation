id: MAT.5.46
reference: Matthew 5:46
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐὰν γὰρ ἀγαπήσητε τοὺς ἀγαπῶντας ὑμᾶς, τίνα μισθὸν ἔχετε; οὐχὶ καὶ οἱ τελῶναι ⸂τὸ αὐτὸ⸃ ποιοῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/046.yaml
  text: For if you love those who love you[a], what reward do you have? Do not even the tax collectors do the same?
translation:
  language: ml
  text: കാരണം, നിങ്ങളെ സ്നേഹിക്കുന്നവരെ നിങ്ങൾ സ്നേഹിക്കുന്നുവെങ്കിൽ, എന്തു പ്രതിഫലമാണ് നിങ്ങൾക്കുള്ളത്?[a] നികുതിപിരിവുകാരും അതുതന്നെ ചെയ്യുന്നില്ലേ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങൾക്ക് എന്തു കൂലിയാണുള്ളത്?” ഗ്രീക്കിലെ പദത്തിന് “കൂലി” എന്നും “പ്രതിഫലം” എന്നും അർഥമാകാം; ഇവിടെ യേശുവിന്റെ ഉപദേശത്തിന്റെ സന്ദർഭത്തിൽ പ്രതിഫലത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: '...ച്ചാൽ'
  rationale: ἐάν നിബന്ധന സൂചിപ്പിക്കുന്നു. γάρ മുൻവാക്യത്തിലെ കല്പനയ്ക്കുള്ള വിശദീകരണബന്ധം നൽകുന്നു; മലയാളത്തിൽ വാക്യപ്രവാഹം സ്വാഭാവികമാക്കാൻ ആ ബന്ധം പ്രത്യേക പദമില്ലാതെ നിബന്ധനാവാക്യത്തിലൂടെ പ്രകടമാക്കി.
- source_word: ἀγαπήσητε ... τοὺς ἀγαπῶντας ὑμᾶς
  choice: നിങ്ങളെ സ്നേഹിക്കുന്നവരെ മാത്രം നിങ്ങൾ സ്നേഹിച്ചാൽ
  rationale: ക്രിയയും കൃദ്‌രൂപവും തമ്മിലുള്ള ἀγαπάω എന്ന പദത്തിന്റെ ആവർത്തനം ‘സ്നേഹിക്കുക’ എന്ന ഒരേ പദത്തിലൂടെ നിലനിർത്തി. ‘മാത്രം’ പരസ്പരസ്നേഹത്തിന്റെ പരിമിതി സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; അത് മൂലപാഠത്തിന്റെ ആശയത്തിൽ അന്തർലീനമാണെങ്കിലും പ്രത്യേകം എഴുതിയ പദമല്ല.
- source_word: τίνα μισθὸν ἔχετε
  choice: നിങ്ങൾക്ക് എന്തു പ്രതിഫലമാണുള്ളത്?
  rationale: μισθός എന്നതിന് കൂലി, പ്രതിഫലം എന്നീ അർഥങ്ങൾ വരാം. മലയിലെ പ്രസംഗത്തിന്റെ ധാർമിക-ദൈവശാസ്ത്രപരമായ സന്ദർഭത്തിൽ ‘പ്രതിഫലം’ സ്വാഭാവികവും വിശാലവുമാണ്.
- source_word: οὐχὶ καὶ
  choice: '...യും ... ചെയ്യുന്നില്ലേ?'
  rationale: οὐχί അനുകൂലമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന അലങ്കാരചോദ്യമാണ്; മലയാളത്തിലെ ‘ചെയ്യുന്നില്ലേ?’ അതിന്റെ ശക്തി നിലനിർത്തുന്നു. καίയുടെ ഊന്നൽ ‘-ഉം’ മുഖേന അറിയിച്ചു.
- source_word: οἱ τελῶναι
  choice: നികുതിപിരിവുകാർ
  rationale: റോമൻ ഭരണസന്ദർഭത്തിൽ നികുതിയോ ചുങ്കമോ പിരിച്ചിരുന്ന സാമൂഹികമായി നിന്ദിക്കപ്പെട്ട വിഭാഗത്തെ ആധുനിക വായനക്കാർക്ക് വ്യക്തമായി സൂചിപ്പിക്കുന്ന പ്രയോഗം.
- source_word: τὸ αὐτὸ ποιοῦσιν
  choice: അതുതന്നെ ചെയ്യുന്നു
  rationale: ‘അതുതന്നെ’ മുൻപ് പറഞ്ഞ പരസ്പരസ്നേഹത്തെ കൃത്യമായി തിരിച്ചുകാട്ടുകയും ποιέωയുടെ പൊതുവായ അർഥം സ്വാഭാവികമായി നൽകുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ ധാർമിക ഉപദേശത്തിലെ μισθός എന്ന പദത്തിന്റെ അർഥം
  choice: പ്രതിഫലം
  alternative: കൂലി
  rationale: ‘പ്രതിഫലം’ ദൈവിക അംഗീകാരമോ പകരം ലഭിക്കുന്ന ഫലമോ ഉൾക്കൊള്ളാൻ കഴിയുന്ന വിശാലപദമാണ്; പ്രവൃത്തിമൂലമുള്ള യോഗ്യതയെക്കുറിച്ചുള്ള പ്രത്യേക സിദ്ധാന്തം ഇതിൽ അടിച്ചേൽപ്പിക്കുന്നില്ല. ‘കൂലി’ എന്ന സാധ്യമായ പദാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. അലങ്കാരചോദ്യത്തിന്റെ ശക്തിയും ‘സ്നേഹിക്കുക’ എന്ന മൂലപദത്തിന്റെ ആവർത്തനവും നിലനിർത്തി. ‘മാത്രം’ സ്വാഭാവിക മലയാളത്തിൽ പരസ്പരസ്നേഹത്തിന്റെ പരിമിതി വ്യക്തമാക്കുന്നു.
