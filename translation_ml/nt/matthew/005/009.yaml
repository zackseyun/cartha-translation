id: MAT.5.9
reference: Matthew 5:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μακάριοι οἱ εἰρηνοποιοί, ὅτι αὐτοὶ υἱοὶ θεοῦ κληθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/009.yaml
  text: Blessed are the peacemakers[a], because they will be called sons of God.
translation:
  language: ml
  text: സമാധാനം ഉണ്ടാക്കുന്നവർ അനുഗൃഹീതർ[a]; കാരണം അവർ ദൈവത്തിന്റെ പുത്രന്മാർ എന്നു വിളിക്കപ്പെടും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ദൈവത്തിന്റെ മക്കൾ.’ ഗ്രീക്കിൽ ‘ദൈവത്തിന്റെ പുത്രന്മാർ’ എന്നാണ്; പുല്ലിംഗ ബഹുവചനത്തിലുള്ള ഈ പുത്രബന്ധ ഭാഷ പ്രതിനിധിപരമായി ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: അനുഗൃഹീതർ
  rationale: വെറും മാനസിക സന്തോഷമല്ല, ദൈവാനുഗ്രഹം ലഭിച്ചവരുടെ ശ്രേഷ്ഠവും അഭിലഷണീയവുമായ നിലയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
- source_word: εἰρηνοποιοί
  choice: സമാധാനം ഉണ്ടാക്കുന്നവർ
  rationale: സമാധാനം ഇഷ്ടപ്പെടുന്നവർ എന്നതിലുപരി, അത് സജീവമായി സൃഷ്ടിക്കുകയും പുനഃസ്ഥാപിക്കുകയും ചെയ്യുന്നവർ എന്ന കർത്തൃഭാവം സംരക്ഷിക്കുന്നു.
- source_word: ὅτι
  choice: കാരണം
  rationale: അനുഗൃഹീതരെന്ന പ്രഖ്യാപനത്തിന്റെ കാരണമോ അടിസ്ഥാനമോ അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് ബന്ധകത്തിന്റെ കാരണാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: αὐτοὶ
  choice: അവർ
  rationale: ഗ്രീക്കിൽ സർവനാമത്തിന് ഊന്നലുണ്ടെങ്കിലും, മലയാളത്തിലെ ഈ വാക്യഘടനയിൽ ‘അവർ’ സ്വാഭാവികമായി ആവശ്യമായ കേന്ദ്രീകരണം നൽകുന്നു; ‘അവർ തന്നേ’ എന്നത് അനാവശ്യമായി അടയാളപ്പെടുത്തിയതായി തോന്നാം.
- source_word: υἱοὶ θεοῦ
  choice: ദൈവത്തിന്റെ പുത്രന്മാർ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചനമായ ‘പുത്രന്മാർ’ എന്ന ബന്ധഭാഷ നേരിട്ട് നിലനിർത്തുന്നു; അതിന്റെ പ്രതിനിധിപരവും എല്ലാവരെയും ഉൾക്കൊള്ളുന്നതുമായ പ്രയോഗം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: κληθήσονται
  choice: വിളിക്കപ്പെടും
  rationale: καλέω എന്ന ക്രിയയുടെ ഭാവികാല കർമണി രൂപം നേരിട്ട് സംരക്ഷിക്കുന്നു; ‘അംഗീകരിക്കപ്പെടും’ എന്ന വ്യാഖ്യാനത്തിലേക്ക് അർഥം ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: υἱοὶ θεοῦ എന്നതിലെ ലിംഗസൂചകമായ പുത്രബന്ധ ഭാഷ
  choice: ദൈവത്തിന്റെ പുത്രന്മാർ
  alternative: ദൈവത്തിന്റെ മക്കൾ
  rationale: മൂലപാഠത്തിലെ പുല്ലിംഗ ബഹുവചന പുത്രബന്ധ ഭാഷയും അതിനോടു ചേർന്നിരിക്കാവുന്ന പദവി/അവകാശബന്ധ സൂചനകളും പ്രധാനപാഠത്തിൽ സംരക്ഷിക്കുന്നു. ഈ പ്രയോഗത്തിന്റെ പ്രതിനിധിപരവും ഉൾക്കൊള്ളുന്നതുമായ വ്യാപ്തി അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സമാധാനപ്രവർത്തകർ’ എന്ന സങ്കുചിത നാമരൂപത്തേക്കാൾ ‘സമാധാനം ഉണ്ടാക്കുന്നവർ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും εἰρηνοποιοί എന്ന പദത്തിന്റെ സജീവ അർഥം കൃത്യമായി പ്രകടിപ്പിക്കുന്നതുമാണ്.
