id: MAT.5.5
reference: Matthew 5:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μακάριοι οἱ πραεῖς, ὅτι αὐτοὶ κληρονομήσουσι τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/005.yaml
  text: Blessed are the meek[b][a], because they will inherit the earth.
translation:
  language: ml
  text: സൗമ്യരായവർ[a] അനുഗൃഹീതർ; കാരണം അവർ ഭൂമിയെ അവകാശമായി പ്രാപിക്കും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വിനയവും സൗമ്യതയും ഉള്ളവർ’; ഇവിടെ സൗമ്യത ദൗർബല്യമല്ല, വിനയപൂർവമായ മൃദുത്വമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘ദേശത്തെ’; ഈ പ്രയോഗം സങ്കീർത്തനം 37:11-നെ പ്രതിധ്വനിപ്പിക്കുന്നതാകാം. അവിടെ വാഗ്ദത്തദേശത്തെക്കുറിച്ചുള്ള അർഥവും കൂടുതൽ വിശാലമായ അർഥവും കേൾക്കാവുന്നതാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριοι
  choice: അനുഗൃഹീതർ
  rationale: ദൈവിക അനുഗ്രഹവും യഥാർഥ സൗഭാഗ്യവും സൂചിപ്പിക്കുന്നു; വെറും വികാരപരമായ ‘സന്തുഷ്ടർ’ എന്ന അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: οἱ πραεῖς
  choice: സൗമ്യരായവർ
  rationale: തിമിരമോ ദൗർബല്യമോ അല്ല, വിനയത്തോടുകൂടിയ മൃദുത്വവും നിയന്ത്രിത ശക്തിയും സൂചിപ്പിക്കുന്ന πραεῖς എന്ന പദത്തിന്റെ ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὅτι
  choice: കാരണം
  rationale: ഈ അനുഗ്രഹപ്രഖ്യാപനത്തിന്റെ അടിസ്ഥാനമോ കാരണമോ വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: αὐτοὶ
  choice: അവർ
  rationale: ഗ്രീക്കിലെ ഊന്നൽ മലയാളത്തിൽ സന്ദർഭംകൊണ്ട് മതിയായവിധം പ്രകടമാകുന്നു; ‘അവർ തന്നേ’ എന്നു ചേർത്താൽ വാക്യം അനാവശ്യമായി ഭാരമുള്ളതാകും.
- source_word: κληρονομήσουσι
  choice: അവകാശമായി പ്രാപിക്കും
  rationale: κληρονομέω എന്ന പദത്തിലെ അവകാശം ലഭിക്കുന്നതിന്റെ അർഥവും വാഗ്ദത്ത-അവകാശ ഭാഷയും നിലനിർത്തുന്നു.
- source_word: τὴν γῆν
  choice: ഭൂമിയെ
  rationale: γῆ എന്നത് ‘ഭൂമി’ എന്നും ‘ദേശം’ എന്നും അർഥമാക്കാം. മുഖ്യപാഠത്തിൽ വിശാലമായ അർഥം സ്വാഭാവികമായി നൽകുകയും സങ്കീർത്തനം 37:11-ലെ ദേശസംബന്ധമായ പ്രതിധ്വനി അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: τὴν γῆν എന്നതിന്റെ വ്യാപ്തി
  choice: ഭൂമിയെ
  alternative: ദേശത്തെ
  rationale: γῆ എന്ന ഗ്രീക്കുപദം സാർവത്രികമായ ‘ഭൂമി’യെയോ ഉടമ്പടി-വാഗ്ദത്തവുമായി ബന്ധപ്പെട്ട ‘ദേശം’യെയോ സൂചിപ്പിക്കാം. മുഖ്യപാഠത്തിൽ ‘ഭൂമി’ എന്നു നൽകി വിശാലമായ വാഗ്ദത്തം വ്യക്തമാക്കുന്നു; സങ്കീർത്തനം 37:11-ലെ ദേശപരമായ അർഥസാധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. അനുഗ്രഹവാക്യത്തിന്റെ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ ശൈലി നിലനിർത്തിയിരിക്കുന്നു; ‘സൗമ്യർ’ എന്നത് ദൗർബല്യമായി തെറ്റിദ്ധരിക്കാതിരിക്കാൻ അടിക്കുറിപ്പ് നൽകിയിട്ടുണ്ട്.
