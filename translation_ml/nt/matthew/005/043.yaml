  yaml_path: translation/nt/matthew/005/043.yaml
  text: You have heard that it was said[a], ‘You shall love your neighbor and hate your enemy.’
translation:
  language: ml
  text: “‘നിന്റെ അയൽക്കാരനെ സ്നേഹിക്കണം; നിന്റെ ശത്രുവിനെ വെറുക്കണം’ എന്നു പറയപ്പെട്ടതായി നിങ്ങൾ കേട്ടിട്ടുണ്ട്.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ആദ്യഭാഗം ലേവ്യപുസ്തകം 19:18-നെ പ്രതിധ്വനിപ്പിക്കുന്നു. എന്നാൽ ‘നിന്റെ ശത്രുവിനെ വെറുക്കണം’ എന്ന രണ്ടാംഭാഗം പഴയനിയമത്തിൽനിന്നുള്ള നേരിട്ടുള്ള ഉദ്ധരണിയല്ല; യേശു തിരുത്തുന്ന, പ്രചാരത്തിലുണ്ടായിരുന്ന ഉപദേശത്തെയാണ് അത് പ്രതിഫലിപ്പിക്കുന്നത്.
    reason: cross_reference
lexical_decisions:
- source_word: Ἠκούσατε
  choice: നിങ്ങൾ കേട്ടിട്ടുണ്ടല്ലോ
  rationale: മുൻപ് സ്വീകരിച്ച ഉപദേശത്തെ ഓർമിപ്പിക്കുന്ന മത്തായിയുടെ ആവർത്തിത സൂത്രവാക്യം സ്വാഭാവികമായ മലയാളത്തിൽ വർത്തമാനപൂർണ ആശയത്തോടെ നൽകുന്നു; ‘അല്ലോ’ ശ്രോതാക്കളുടെ പരിചിതജ്ഞാനം സൂചിപ്പിക്കുന്നു.
- source_word: ἐρρέθη
  choice: എന്നു പറഞ്ഞിട്ടുള്ളത്
  rationale: കർമണിപ്രയോഗത്തിന്റെ അനിശ്ചിത കർത്തൃത്വം നിലനിർത്തുന്നു; ആരാണ് പറഞ്ഞതെന്ന് പരിഭാഷയിൽ നിർണ്ണയിക്കുന്നില്ല.
- source_word: Ἀγαπήσεις
  choice: സ്നേഹിക്കണം
  rationale: ഭാവികാലരൂപത്തിന്റെ കല്പനാത്മക ബലം ആധുനിക മലയാളത്തിലെ വ്യക്തമായ നിർദേശരൂപത്തിൽ നൽകുന്നു.
- source_word: τὸν πλησίον σου
  choice: നിന്റെ അയൽക്കാരനെ
  rationale: ലേവ്യപുസ്തകം 19:18-ലെ പ്രതിധ്വനിക്കും ഈ നൈതികസന്ദർഭത്തിനും യോജിക്കുന്ന പതിവും കൃത്യവുമായ പദം.
- source_word: μισήσεις
  choice: വെറുക്കണം
  rationale: ആദ്യ ക്രിയയോടു സമാന്തരമായ കല്പനാത്മക ഭാവം തുറന്നുകാട്ടുകയും ഗ്രീക്കിലെ ശക്തമായ വിരോധത്തെ മൃദൂകരിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: τὸν ἐχθρόν σου
  choice: നിന്റെ ശത്രുവിനെ
  rationale: ἐχθρός എന്ന പദത്തിന്റെ നേരിട്ടുള്ളതും സന്ദർഭോചിതവുമായ സമാനപദം.
theological_decisions:
- issue: ‘നിന്റെ ശത്രുവിനെ വെറുക്കണം’ എന്ന ഭാഗത്തിന്റെ പദവി
  choice: യേശു തന്റെ ശ്രോതാക്കൾ കേട്ടതായി പറയുന്ന ഒരൊറ്റ പ്രബോധനത്തിന്റെ ഭാഗമായി മുഖ്യവാചകത്തിൽ നിലനിർത്തി; മുഴുവനും തിരുവെഴുത്തിൽനിന്നുള്ള നേരിട്ടുള്ള ഉദ്ധരണിയാണെന്ന് സൂചിപ്പിച്ചില്ല.
  alternative: രണ്ടു ഭാഗങ്ങളും ഒരുപോലെ പഴയനിയമത്തിൽനിന്നുള്ള നേരിട്ടുള്ള ഉദ്ധരണികളായി അവതരിപ്പിക്കുക; അല്ലെങ്കിൽ രണ്ടാം ഭാഗത്തെ മുഖ്യവാചകത്തിൽ തന്നെ വ്യാഖ്യാനപാരമ്പര്യമെന്നു അടയാളപ്പെടുത്തുക.
  rationale: ഗ്രീക്ക് വാചകം രണ്ടുഭാഗങ്ങളെയും ‘എന്നു പറഞ്ഞിട്ടുള്ളത്’ എന്ന ഒരേ ആമുഖത്തിന് കീഴിൽ നൽകുന്നു. എന്നാൽ രണ്ടാം ഭാഗം പഴയനിയമത്തിലെ നേരിട്ടുള്ള കല്പനയല്ല; ഈ വ്യത്യാസം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നത് മൂലവാചകത്തിന്റെ ഘടനയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഏകവചനമായ ‘നിന്റെ’ ഉദ്ധരിച്ച കല്പനയുടെ രൂപം നിലനിർത്തുന്നു; ആമുഖത്തിലെ ‘നിങ്ങൾ’ യേശുവിന്റെ ബഹുവചന ശ്രോതാക്കളെ സൂചിപ്പിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
