id: MAT.5.19
reference: Matthew 5:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃς ἐὰν οὖν λύσῃ μίαν τῶν ἐντολῶν τούτων τῶν ἐλαχίστων καὶ διδάξῃ οὕτως τοὺς ἀνθρώπους, ἐλάχιστος κληθήσεται ἐν τῇ βασιλείᾳ τῶν οὐρανῶν· ὃς δ’ ἂν ποιήσῃ καὶ διδάξῃ, οὗτος μέγας κληθήσεται ἐν τῇ βασιλείᾳ τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/019.yaml
  text: Therefore[a], whoever relaxes one of the least of these commandments and teaches others to do so will be called least in the kingdom of heaven; but whoever does them and teaches them[b], this one will be called great in the kingdom of heaven.
translation:
  language: ml
  text: അതുകൊണ്ട്, ഈ ഏറ്റവും ചെറിയ കല്പനകളിൽ ഒന്നിനെ ലഘൂകരിക്കുകയും[a] അങ്ങനെ ചെയ്യാൻ ആളുകളെ പഠിപ്പിക്കുകയും ചെയ്യുന്നവൻ സ്വർഗരാജ്യത്തിൽ ഏറ്റവും ചെറിയവൻ എന്നു വിളിക്കപ്പെടും; എന്നാൽ അവ അനുഷ്ഠിക്കുകയും അവ പഠിപ്പിക്കുകയും ചെയ്യുന്നവൻ—അവൻ സ്വർഗരാജ്യത്തിൽ വലിയവൻ എന്നു വിളിക്കപ്പെടും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘നീക്കിവെക്കുകയും’ അല്ലെങ്കിൽ ‘ലംഘിക്കുകയും.’ ഗ്രീക്ക് ക്രിയയുടെ അക്ഷരാർഥം ‘അഴിക്കുക’ എന്നാണ്; ഇവിടെ ഒരു കല്പനയുടെ ശക്തി കുറയ്ക്കുന്നതിനെയോ അതിനെ ബാധകമല്ലെന്നു കരുതുന്നതിനെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ ന്യായപ്രമാണത്തിന്റെ നിലനിൽപ്പിൽനിന്നുള്ള നിഗമനബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: λύσῃ
  choice: ലഘൂകരിക്കുകയും
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘അഴിക്കുക’ എന്നതാണ്; ഇവിടെ ഒരു കല്പനയുടെ ബാധകതയെയോ ശക്തിയെയോ കുറയ്ക്കുക എന്ന നിയമപരമായ ആശയം സൂചിപ്പിക്കുന്നു. ‘ലംഘിക്കുക’ എന്നതിലേക്കു മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: μίαν τῶν ἐντολῶν τούτων τῶν ἐλαχίστων
  choice: ഈ ഏറ്റവും ചെറിയ കല്പനകളിൽ ഒന്നിനെ
  rationale: കല്പനകളിൽ ‘ഏറ്റവും ചെറിയവ’ എന്ന വിഭാഗത്തിൽപ്പെടുന്ന ഒന്നിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ഘടനയുടെ താരതമ്യഭാവം നിലനിർത്തുന്നു.
- source_word: διδάξῃ οὕτως τοὺς ἀνθρώπους
  choice: അങ്ങനെ ചെയ്യാൻ ആളുകളെ പഠിപ്പിക്കുകയും
  rationale: οὕτως മുൻപറഞ്ഞ കല്പന ലഘൂകരിക്കുന്ന പ്രവൃത്തിയിലേക്കു തിരിച്ചുചൂണ്ടുന്നു; ἀνθρώπους ഇവിടെ മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നതിനാൽ ‘ആളുകളെ’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: ἐλάχιστος κληθήσεται
  choice: ഏറ്റവും ചെറിയവൻ എന്നു വിളിക്കപ്പെടും
  rationale: ഭാവികാല കർമണിപ്രയോഗവും ‘ചെറിയവൻ’ എന്ന താരതമ്യസ്ഥാനവും നേരിട്ട് നിലനിർത്തുന്നു; പുറത്താക്കപ്പെടും എന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: സ്വർഗരാജ്യത്തിൽ
  rationale: മത്തായിയുടെ സ്ഥിരപ്രയോഗത്തിന് മലയാളത്തിൽ പ്രചാരമുള്ളതും സ്വാഭാവികവുമായ തുല്യപദമാണ്.
- source_word: ποιήσῃ καὶ διδάξῃ
  choice: അവ അനുഷ്ഠിക്കുകയും പഠിപ്പിക്കുകയും
  rationale: സന്ദർഭത്തിലെ പരോക്ഷ കർമം കല്പനകളാണ്. ‘അനുഷ്ഠിക്കുക’ അവ പ്രവർത്തിയിൽ നടപ്പാക്കുന്നതിനെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ‘പാലിക്കുക’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക പദം ഒഴിവാക്കുന്നു.
- source_word: οὗτος
  choice: അവൻ
  rationale: ഗ്രീക്കിലെ ഊന്നൽ മലയാളത്തിലെ വിരാമചിഹ്നത്തോടുകൂടിയ ‘അവൻ’ വഴി സ്വാഭാവികമായി നിലനിർത്തുന്നു; ‘ഇവൻ’ ഇവിടെ അസ്വാഭാവികമാകാം.
- source_word: μέγας
  choice: വലിയവൻ
  rationale: ἐλάχιστος എന്നതിനോടുള്ള നേരിട്ടുള്ള വൈരുധ്യം നിലനിർത്തുന്നു; ‘ഏറ്റവും വലിയവൻ’ എന്നു അതിശയോക്തിയാക്കുന്നില്ല.
theological_decisions:
- issue: രാജ്യത്തിൽ ‘ഏറ്റവും ചെറിയവൻ/വലിയവൻ’ എന്ന സ്ഥാനം
  choice: രാജ്യത്തിനുള്ളിലെ താരതമ്യസ്ഥാനമായി വാക്യം അതേപടി നിലനിർത്തി.
  alternative: ‘ഏറ്റവും ചെറിയവൻ’ എന്നത് രാജ്യത്തിൽനിന്നുള്ള പുറത്താക്കലായോ ‘വലിയവൻ’ എന്നത് പ്രതിഫലത്തിന്റെ സാങ്കേതിക പദവിയായോ വ്യാഖ്യാനിക്കുക.
  rationale: വാക്യം ‘സ്വർഗരാജ്യത്തിൽ’ എന്നു പറയുന്നു; രക്ഷ, പുറത്താക്കൽ, പ്രതിഫലം എന്നിവയെക്കുറിച്ചുള്ള വിപുലമായ സിദ്ധാന്തവിവാദം പരിഭാഷയിൽ തീർപ്പാക്കരുത്.
- issue: τοὺς ἀνθρώπους എന്ന പൊതുവായ പ്രയോഗം
  choice: ആളുകളെ
  alternative: പുരുഷന്മാരെ / മനുഷ്യരെ
  rationale: ഇവിടെ ഗ്രീക്ക് പദം പുരുഷന്മാരെ മാത്രം അല്ല, ആളുകളെ പൊതുവായി സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ ‘ആളുകളെ’ ഈ വ്യാപ്തി വ്യക്തമായി നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. നീണ്ട ഗ്രീക്ക് വാക്യത്തിന്റെ സമാന്തരഘടനയും വിരുദ്ധതയും സെമിക്കോളനും ഡാഷും ഉപയോഗിച്ച് നിലനിർത്തി. പ്രധാനപാഠത്തിലെ ഏക അടിക്കുറിപ്പുസൂചകം [a] അടിക്കുറിപ്പുപട്ടികയുമായി പൊരുത്തപ്പെടുന്നു.
