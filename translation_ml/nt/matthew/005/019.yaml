    rationale: ποιήσῃ καὶ διδάξῃ has the commandments as the understood object for both verbs. Although the current Malayalam can be understood this way, repeating ‘അവ’ before the second verb prevents ‘teaches’ from sounding objectless and preserves the Greek parallelism more clearly.
