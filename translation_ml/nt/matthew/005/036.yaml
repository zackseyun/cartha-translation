id: MAT.5.36
reference: Matthew 5:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μήτε ἐν τῇ κεφαλῇ σου ὀμόσῃς, ὅτι οὐ δύνασαι μίαν τρίχα λευκὴν ⸂ποιῆσαι ἢ μέλαιναν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/036.yaml
  text: Nor shall you swear by your head[a], because you are not able to make one hair white or black.
translation:
  language: ml
  text: നിന്റെ തലയെക്കൊണ്ട് സത്യം ചെയ്യരുത്; കാരണം, ഒരു മുടിയിഴയെപ്പോലും വെളുത്തതോ കറുത്തതോ ആക്കാൻ നിനക്കു കഴിയില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μήτε
  choice: ചെയ്യരുത്
  rationale: മുൻപുള്ള നിരോധനങ്ങളുടെ പരമ്പര തുടരുന്ന ഏകോപിത നിഷേധം മലയാളത്തിൽ സ്വാഭാവികമായ നിരോധനരൂപത്തിൽ നൽകി.
- source_word: ἐν τῇ κεφαλῇ σου
  choice: നിന്റെ തലയെക്കൊണ്ടും
  rationale: ὀμόσῃς എന്ന ക്രിയയോടൊപ്പം ശപഥത്തിൽ ആധാരമായി വിളിച്ചുപറയുന്ന വസ്തുവിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘—യെക്കൊണ്ട് സത്യം ചെയ്യുക’ എന്ന പ്രയോഗം ഇതിനെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὀμόσῃς
  choice: സത്യം ചെയ്യരുത്
  rationale: μήτε-യോടുള്ള aorist subjunctive നിരോധനം വ്യക്തവും ഗൗരവമുള്ളതുമായ ആധുനിക മലയാളത്തിൽ നേരിട്ട് അവതരിപ്പിക്കുന്നു.
- source_word: ὅτι
  choice: കാരണം
  rationale: നിരോധനത്തിനുള്ള കാരണം അവതരിപ്പിക്കുന്ന causal ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: οὐ δύνασαι
  choice: നിനക്കു കഴിയില്ല
  rationale: മനുഷ്യന്റെ കഴിവില്ലായ്മയെ കൃത്യമായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: μίαν τρίχα
  choice: ഒരു മുടിയിഴപോലും
  rationale: μίαν എന്ന ഏകത്വ-ഊന്നൽ ‘പോലും’ ഉപയോഗിച്ച് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: λευκὴν ... ἢ μέλαιναν
  choice: വെളുപ്പോ കറുപ്പോ
  rationale: മൂലപാഠത്തിലെ അടിസ്ഥാന വർണ്ണവൈരുധ്യം വ്യാഖ്യാനപരമായി മയപ്പെടുത്താതെ നിലനിർത്തുന്നു.
- source_word: ποιῆσαι
  choice: ആക്കാൻ
  rationale: ഒന്നിനെ ഒരു പ്രത്യേക അവസ്ഥയിലാക്കുക എന്ന causative അർത്ഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: ശപഥം ചെയ്യുന്നതിനെക്കുറിച്ചുള്ള നിരോധനത്തിന്റെ വ്യാപ്തി
  choice: സ്വന്തം തലയെ ആധാരമാക്കി സത്യം ചെയ്യുന്നതിനെക്കുറിച്ചുള്ള നേരിട്ടുള്ള നിരോധനമായി വിവർത്തനം ചെയ്തു.
  alternative: എല്ലാ സാഹചര്യങ്ങളിലുമുള്ള എല്ലാ ശപഥങ്ങളെയും നിരോധിക്കുന്ന സമ്പൂർണ ഉപദേശമായി വികസിപ്പിക്കുക; അല്ലെങ്കിൽ വഞ്ചനാപരമായ ശപഥസൂത്രങ്ങളെ മാത്രം കുറ്റപ്പെടുത്തുന്നതായി ചുരുക്കുക.
  rationale: ഈ വാക്യം പ്രത്യേകമായി തലയെക്കൊണ്ട് സത്യം ചെയ്യുന്നതിനെ വിലക്കുകയും അതിന് മനുഷ്യന്റെ പരിമിതിയെ കാരണമാക്കുകയും ചെയ്യുന്നു. വിപുലമായ ഉപദേശവിവാദം വിവർത്തനത്തിൽ തീർപ്പാക്കിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക സാധാരണ മലയാളത്തിൽ വായിക്കാൻ എളുപ്പമുള്ളതും തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ളതുമായ ശൈലി. ‘മുടിയിഴപോലും’ എന്നത് ഏകത്വത്തിലെ ഊന്നൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; മൂലപാഠത്തിൽ യഥാർത്ഥ പാഠഭേദമോ ഇവിടെ ആവശ്യമായ അർത്ഥവ്യത്യാസമോ ഇല്ലാത്തതിനാൽ അടിക്കുറിപ്പ് നൽകിയിട്ടില്ല.
