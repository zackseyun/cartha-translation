review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the prohibition, the oath object ('your head'), the causal clause, human inability, and the white/black contrast. However, the coordinated force of μήτε need not be represented by the enclitic -ഉം on 'തലയെക്കൊണ്ടും'; that addition is less idiomatic here and can imply 'also/even by your head.'
  naturalness: ‘നിന്റെ തലയെക്കൊണ്ട് സത്യം ചെയ്യരുത്’ is the more natural modern Malayalam oath idiom. ‘ഒരു മുടിയിഴയെപ്പോലും വെളുത്തതോ കറുത്തതോ ആക്കാൻ’ clearly links the singular hair with both predicate states and retains the emphatic sense.
  terminology: ‘സത്യം ചെയ്യുക’ suitably renders oath-taking in a clear, dignified modern register. No doctrinal expansion is introduced.
  issues:
  - severity: low
    issue: ‘തലയെക്കൊണ്ടും’ includes an unnecessary emphatic/coordinating enclitic.
    rationale: The Greek μήτε coordinates this prohibition with preceding ones, but attaching -ഉം to the oath object is not required and is less natural in Malayalam. The plain instrumental oath expression is preferable.
  - severity: low
    issue: The color predicates are elliptically expressed as ‘വെളുപ്പോ കറുപ്പോ ആക്കാൻ.’
    rationale: While understandable, ‘വെളുത്തതോ കറുത്തതോ ആക്കാൻ’ is clearer and more grammatically complete for making a hair white or black.
  revised_text: നിന്റെ തലയെക്കൊണ്ട് സത്യം ചെയ്യരുത്; കാരണം, ഒരു മുടിയിഴയെപ്പോലും വെളുത്തതോ കറുത്തതോ ആക്കാൻ നിനക്കു കഴിയില്ല.
  revised_footnotes: []
  revision_rationale: 'The revision preserves the direct, limited prohibition in the Greek and its causal grounding, while using smoother modern Malayalam. No footnote is needed: the English audit footnote reflects an English stylistic alternative (‘are not able’/‘cannot’) that does not create a material Malayalam ambiguity.'
