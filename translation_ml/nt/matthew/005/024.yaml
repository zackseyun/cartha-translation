id: MAT.5.24
reference: Matthew 5:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἄφες ἐκεῖ τὸ δῶρόν σου ἔμπροσθεν τοῦ θυσιαστηρίου καὶ ὕπαγε πρῶτον διαλλάγηθι τῷ ἀδελφῷ σου, καὶ τότε ἐλθὼν πρόσφερε τὸ δῶρόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/024.yaml
  text: leave your gift there before the altar[a], and go; first be reconciled to your brother[b], and then come and offer your gift.
translation:
  language: ml
  text: നിന്റെ വഴിപാട് അവിടെ യാഗപീഠത്തിന്റെ മുമ്പിൽ വെച്ചിട്ട് പോകുക; ആദ്യം നിന്റെ സഹോദരനുമായി[a] അനുരഞ്ജനപ്പെടുക; പിന്നെ വന്ന് നിന്റെ വഴിപാട് അർപ്പിക്കുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സഹോദരൻ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നത് ഗ്രീക്കിലെ പുല്ലിംഗ ഏകവചനപദമാണ്; ഈ സന്ദർഭത്തിലെ അനുരഞ്ജനതത്ത്വം സഹോദരിയുമായോ മറ്റുള്ളവരുമായോ ഉള്ള ബന്ധങ്ങൾക്കും ബാധകമായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφες ἐκεῖ
  choice: അവിടെ ... വെച്ചിട്ട്
  rationale: ഇവിടെ ἀφίημι എന്നത് വസ്തുവിനെ അതേ സ്ഥലത്ത് വിട്ടുപോകുക എന്ന അർഥത്തിലാണ്; മലയാളത്തിൽ ‘വെച്ചിട്ട്’ സ്വാഭാവികമായി ആ ആശയം നൽകുന്നു, ἐκεῖ ‘അവിടെ’ എന്ന സ്ഥലസൂചന നിലനിർത്തുന്നു.
- source_word: τὸ δῶρόν σου
  choice: നിന്റെ വഴിപാട്
  rationale: യാഗപീഠസന്ദർഭത്തിൽ δῶρον ദൈവത്തിന് കൊണ്ടുവരുന്ന സമർപ്പണത്തെ സൂചിപ്പിക്കുന്നു; ‘വഴിപാട്’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ആരാധനാസന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: ἔμπροσθεν τοῦ θυσιαστηρίου
  choice: യാഗപീഠത്തിന്റെ മുമ്പിൽ
  rationale: സ്ഥലബന്ധം ഔപചാരികമായും സ്വാഭാവികമായും സംരക്ഷിക്കുന്നു; θυσιαστήριον എന്നതിന് ‘യാഗപീഠം’ സ്ഥിരമായ മലയാള പദമാണ്.
- source_word: ὕπαγε
  choice: പോകുക
  rationale: ചലനത്തെ സൂചിപ്പിക്കുന്ന ആജ്ഞ ലളിതമായും നേരിട്ടും നൽകുന്നു.
- source_word: πρῶτον
  choice: ആദ്യം
  rationale: വഴിപാട് അർപ്പിക്കുന്നതിനു മുമ്പ് അനുരഞ്ജനത്തിനുള്ള മുൻഗണന കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: διαλλάγηθι
  choice: അനുരഞ്ജനപ്പെടുക
  rationale: അനുരഞ്ജിതമായ ബന്ധാവസ്ഥയിലേക്കു വരുക എന്ന പാസീവ് ആജ്ഞയുടെ ഭാവം നിലനിർത്തുന്നു; ‘ഒത്തുതീർപ്പാക്കുക’ എന്നതിനെക്കാൾ പരസ്പരബന്ധത്തിന്റെ പുനഃസ്ഥാപനം വ്യക്തമാക്കുന്നു.
- source_word: τῷ ἀδελφῷ σου
  choice: നിന്റെ സഹോദരനുമായി
  rationale: διαλλάγηθι-യോടൊപ്പമുള്ള ദത്തിവ് ബന്ധത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘-മായി’ എന്നു നൽകുന്നു; ἀδελφός എന്ന പുല്ലിംഗ ഏകവചനരൂപം സംരക്ഷിക്കുന്നു.
- source_word: καὶ τότε ἐλθὼν πρόσφερε
  choice: പിന്നെ വന്ന് ... അർപ്പിക്കുക
  rationale: τότε സൂചിപ്പിക്കുന്ന ക്രമവും, പ്രധാന ആജ്ഞയ്ക്കു കീഴിലുള്ള ἐλθών എന്ന കൃദന്തരൂപവും സ്വാഭാവിക മലയാള വാക്യക്രമത്തിൽ നിലനിർത്തുന്നു; πρόσφερε-യുടെ ആരാധനാപരമായ അർഥത്തിന് ‘അർപ്പിക്കുക’ യോജിക്കുന്നു.
theological_decisions:
- issue: ἀδελφός എന്ന പദത്തിന്റെ വ്യക്തിബന്ധപരമായ നൈതികസന്ദർഭത്തിലെ പരിഭാഷ
  choice: സഹോദരൻ
  alternative: സഹോദരനോ സഹോദരിയോ; സഹവിശ്വാസി
  rationale: ഗ്രീക്ക് പദം പുല്ലിംഗ ഏകവചനമാണ്; അതിനാൽ മൂലരൂപം പ്രധാന പാഠത്തിൽ സംരക്ഷിച്ചു. എന്നാൽ അനുരഞ്ജനത്തിന്റെ നൈതിക തത്ത്വം കൂടുതൽ വിപുലമായി ബാധകമാകാമെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: διαλλάγηθι എന്ന പാസീവ് ആജ്ഞയുടെ ബന്ധപരമായ ദിശ
  choice: സഹോദരനുമായി അനുരഞ്ജനപ്പെടുക
  alternative: സഹോദരനോട് അനുരഞ്ജനപ്പെടുക; സഹോദരനുമായി സമാധാനത്തിലാകുക
  rationale: ഗ്രീക്കിലെ പാസീവ് രൂപവും ദത്തിവ് ബന്ധവും പരിഹാരനടപടിയുടെ ഉത്തരവാദിത്വവും പരസ്പരബന്ധത്തിന്റെ പുനഃസ്ഥാപനവും ഒരുമിച്ച് തുറന്നുവെക്കുന്നു; ഏകപക്ഷീയ മാപ്പോ വെറും തർക്കപരിഹാരമോ എന്ന് ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായെങ്കിലും ഗൗരവമുള്ള ആജ്ഞാരൂപം ഉപയോഗിച്ചു. യാഗസന്ദർഭത്തിന് ‘വഴിപാട്’, ‘യാഗപീഠം’, ‘അർപ്പിക്കുക’ എന്നിവയും ബന്ധപുനഃസ്ഥാപനത്തിന് ‘അനുരഞ്ജനപ്പെടുക’ എന്ന കൃത്യമായ പദവും തിരഞ്ഞെടുത്തു. പ്രധാന പാഠത്തിലെ [a] അടിക്കുറിപ്പുസൂചകം ബന്ധപ്പെട്ട പദത്തോടു ചേർത്തിരിക്കുന്നു.
