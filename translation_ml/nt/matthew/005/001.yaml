id: MAT.5.1
reference: Matthew 5:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ τοὺς ὄχλους ἀνέβη εἰς τὸ ὄρος· καὶ καθίσαντος αὐτοῦ προσῆλθαν αὐτῷ οἱ μαθηταὶ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/001.yaml
  text: Seeing the crowds[a], he went up the mountain; and when he sat down[c][b], his disciples came to him.
translation:
  language: ml
  text: ജനക്കൂട്ടങ്ങളെ കണ്ടപ്പോൾ[a] അദ്ദേഹം മല കയറിപ്പോയി. അദ്ദേഹം ഇരുന്നപ്പോൾ[b] അദ്ദേഹത്തിന്റെ ശിഷ്യന്മാർ അദ്ദേഹത്തിന്റെ അടുക്കൽ വന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ജനക്കൂട്ടങ്ങളെ കണ്ടിട്ട്.”
    reason: Ἰδών എന്ന കൃദന്തരൂപം കാലസാഹചര്യമായോ മുൻപ്രവൃത്തിയായോ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കാം.
  - marker: b
    text: അഥവാ, “അദ്ദേഹം ഇരുന്നശേഷം.” ഗ്രീക്കിൽ സ്വതന്ത്ര ഷഷ്ഠീവിഭക്ത കൃദന്തഘടനയാണ്.
    reason: καθίσαντος αὐτοῦ എന്ന genitive absolute ഘടനയുടെ കാലബന്ധത്തിന് “ഇരുന്നപ്പോൾ” എന്നും “ഇരുന്നശേഷം” എന്നും സാധ്യതയുണ്ട്.
lexical_decisions:
- source_word: Ἰδὼν
  choice: കണ്ടപ്പോൾ
  rationale: ὁράω എന്ന ക്രിയയുടെ ഭൂതകാല കൃദന്തരൂപം മുഖ്യക്രിയയുടെ സാഹചര്യത്തെ സൂചിപ്പിക്കുന്നു. ‘കണ്ടപ്പോൾ’ സ്വാഭാവികമായ മലയാളത്തിൽ ആ ബന്ധം നിലനിർത്തുന്നു; കർശനമായ കാലക്രമം അടിച്ചേൽപ്പിക്കുന്നില്ല.
- source_word: δὲ
  choice: പ്രത്യേകമായി പരിഭാഷപ്പെടുത്തിയില്ല
  rationale: ഇവിടെ δέ നേരിയ ആഖ്യാനബന്ധമോ മാറ്റമോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ പ്രത്യേകം പദം ചേർക്കാതെ വാക്യക്രമംകൊണ്ട് ഈ ബന്ധം സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: τοὺς ὄχλους
  choice: ജനക്കൂട്ടങ്ങളെ
  rationale: ὄχλους ബഹുവചനമാണ്. ‘ജനക്കൂട്ടങ്ങളെ’ അതിന്റെ ബഹുവചനവും ജനസമൂഹങ്ങളെന്ന അർഥവും ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: മലമുകളിലേക്കു കയറിപ്പോയി
  rationale: ἀναβαίνωയും εἰς-ഉം മലയുടെ ഉയർന്ന ഭാഗത്തേക്കുള്ള ചലനം സൂചിപ്പിക്കുന്നു. ഈ പ്രയോഗം ദിശയും കയറ്റവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τὸ ὄρος
  choice: മല
  rationale: ὄρος എന്നതിന് സാധാരണയായി മല എന്നാണ് അർഥം. ഗ്രീക്കിലെ നിർദേശക ഉപപദത്തിന്റെ നിർദിഷ്ടത മലയാളത്തിൽ സന്ദർഭവും ‘മലമുകളിലേക്ക്’ എന്ന പ്രയോഗവും വഹിക്കുന്നു.
- source_word: καὶ καθίσαντος αὐτοῦ
  choice: അദ്ദേഹം ഇരുന്നപ്പോൾ
  rationale: ഇത് genitive absolute ഘടനയാണ്; തുടർന്നുള്ള പ്രവൃത്തിയോടുള്ള കാലസാഹചര്യം സൂചിപ്പിക്കുന്നു. ‘ഇരുന്നപ്പോൾ’ കർശനമായി ‘ഇരുന്നശേഷം’ എന്നു നിർണയിക്കാതെ ബന്ധം നിലനിർത്തുന്നു.
- source_word: προσῆλθαν αὐτῷ
  choice: അദ്ദേഹത്തിന്റെ അടുക്കൽ വന്നു
  rationale: προσέρχομαι ഇവിടെ ഒരാളുടെ അടുത്തേക്കു വരുക എന്ന സാധാരണ അർഥത്തിലാണ്. മലയാളത്തിലെ ഈ പ്രയോഗം ലളിതവും ആഖ്യാനത്തിന് യോജിച്ചതുമാണ്.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ശിഷ്യന്മാർ
  rationale: μαθηταί ഗുരുവിനെ അനുഗമിച്ചു പഠിക്കുന്ന ശിഷ്യരെ സൂചിപ്പിക്കുന്നു. ‘ശിഷ്യന്മാർ’ സുവിശേഷസന്ദർഭത്തിലെ കൃത്യവും പരിചിതവുമായ പദമാണ്; ഉടമസ്ഥബന്ധം സന്ദർഭത്തിലും വാക്യത്തിലും വ്യക്തമാണ്.
theological_decisions:
- issue: τὸ ὄρος എന്നതിലെ നിർദിഷ്ടത
  choice: മലമുകളിലേക്ക്
  alternative: ഒരു മലമുകളിലേക്ക് / മലഞ്ചരിവിലേക്ക്
  rationale: ഗ്രീക്കിൽ നിർദേശക ഉപപദമുണ്ട്; അതിനാൽ ഒരു അനിശ്ചിത മല എന്നു പരിഭാഷപ്പെടുത്തിയില്ല. എന്നാൽ ഈ പ്രയോഗം ഏതെങ്കിലും പേരുള്ള പ്രത്യേക മലയെ തിരിച്ചറിയുന്നു എന്നും നിർബന്ധിക്കുന്നില്ല.
- issue: καθίσαντος αὐτοῦ എന്ന ഘടനയുടെ കാലബന്ധം
  choice: അദ്ദേഹം ഇരുന്നപ്പോൾ
  alternative: അദ്ദേഹം ഇരുന്നശേഷം
  rationale: ഗ്രീക്ക് ഘടന കാലസാഹചര്യം സൂചിപ്പിക്കുന്നുവെങ്കിലും കർശനമായ അനന്തരക്രമം നിർബന്ധമാക്കുന്നില്ല. ഇരുന്നുകൊണ്ടുള്ള ഔപചാരിക അധ്യാപനഭാവം പോലുള്ള അധിക വ്യാഖ്യാനവും ചേർത്തിട്ടില്ല.
- issue: കർത്താവിന്റെ പേര് വ്യക്തമാക്കൽ
  choice: യേശു
  alternative: അദ്ദേഹം / അവൻ
  rationale: ഗ്രീക്കിൽ കർത്താവ് മുൻസന്ദർഭത്തിൽനിന്ന് ഗ്രഹിക്കപ്പെടുന്ന സർവനാമസംബന്ധമായ രൂപത്തിലാണ്. ഒറ്റവാക്യമായി വായിക്കുമ്പോൾ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ‘യേശു’ ചേർത്തു; ഇത് പുതിയ തിരിച്ചറിയൽ അല്ല, സന്ദർഭത്തിൽ വ്യക്തമായ കർത്താവിനെ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നതാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. യേശുവിനെ സൂചിപ്പിക്കാൻ ‘അദ്ദേഹം’ ഉപയോഗിച്ചു. ‘പുരുഷാരം’, ‘ആരോഹണം ചെയ്തു’ തുടങ്ങിയ പഴയതോ അത്യുച്ചമോ ആയ പദങ്ങൾ ഒഴിവാക്കി. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
