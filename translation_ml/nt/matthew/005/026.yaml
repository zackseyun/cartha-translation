  text: ἀμὴν λέγω σοι, οὐ μὴ ἐξέλθῃς ἐκεῖθεν ἕως ἂν ἀποδῷς τὸν ἔσχατον κοδράντην.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/026.yaml
  text: Truly I tell you[b][a], you will certainly not get out of there until you have paid the last quadrans.
translation:
  language: ml
  text: 'സത്യമായി ഞാൻ നിന്നോടു പറയുന്നു: അവസാനത്തെ കൊദ്രാന്ത് [a] അടച്ചുതീർക്കുംവരെ നീ അവിടെനിന്ന് ഒരിക്കലും പുറത്തുവരികയില്ല.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൊദ്രാന്ത് വളരെ ചെറിയ മൂല്യമുള്ള ഒരു റോമൻ നാണയമായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: ἀμὴν
  choice: സത്യമായി
  rationale: സിനോപ്റ്റിക് സുവിശേഷങ്ങളിലെ ഈ ആമുഖപ്രയോഗം തുടർന്നുവരുന്ന വാക്കിന്റെ ഗൗരവവും ഉറപ്പും സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ അതിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: λέγω σοι
  choice: ഞാൻ നിന്നോടു പറയുന്നു
  rationale: ഏകവചനത്തിലുള്ള നേരിട്ടുള്ള അഭിസംബോധനയും പ്രസ്താവനയുടെ അധികാരഭാവവും നിലനിർത്തുന്നു.
- source_word: οὐ μὴ ἐξέλθῃς
  choice: നീ ... ഒരിക്കലും പുറത്തുവരികയില്ല
  rationale: οὐ μήയും aorist subjunctive-ഉം ചേർന്ന ശക്തമായ നിഷേധം വ്യക്തമായി പകരുന്നു; തടവിന്റെ സന്ദർഭത്തിൽ 'പുറത്തുവരിക' സ്വാഭാവികമാണ്.
- source_word: ἐκεῖθεν
  choice: അവിടെനിന്ന്
  rationale: ആ സ്ഥലത്തുനിന്നുള്ള പുറപ്പെടലിനെ കൃത്യമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἕως ἂν ἀποδῷς
  choice: കൊടുത്തുതീർക്കുന്നതുവരെ
  rationale: ഭാവിയിലെ പരിധിയും തുക മുഴുവൻ അടച്ചുതീർക്കുന്ന സമാപ്തിഭാവവും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: τὸν ἔσχατον
  choice: അവസാനത്തെ
  rationale: കടത്തിന്റെ ഏറ്റവും ചെറിയ ശേഷിപ്പുപോലും ഉൾപ്പെടെ മുഴുവൻ തുകയും നൽകണം എന്ന വാചകഭാവം നിലനിർത്തുന്നു.
- source_word: κοδράντην
  choice: കൊദ്രാന്തേസ്‌
  rationale: ഗ്രീക്ക് κοδράντης സൂചിപ്പിക്കുന്ന പ്രത്യേക റോമൻ നാണയത്തിന്റെ പേര് മലയാളലിപിയിൽ നിലനിർത്തുന്നു; ആധുനിക നാണയമൂല്യവുമായി തെറ്റായ സമീകരണം ഒഴിവാക്കാൻ വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: ഈ വാക്കിനെ അന്തിമവിധി, ശുദ്ധീകരണം, അല്ലെങ്കിൽ ഒരു സാധാരണ നിയമ-തടവ് സാഹചര്യം എന്നിങ്ങനെ ഏതെങ്കിലും പ്രത്യേക വ്യാഖ്യാനത്തിലേക്ക് പരിഭാഷയിൽ തന്നെ ചുരുക്കണമോ
  choice: കടം മുഴുവൻ കൊടുത്തുതീർക്കുന്നതുവരെ തടവിൽനിന്ന് പുറത്തുവരാനാവില്ലെന്ന ദൃശ്യരൂപം മാത്രം നിലനിർത്തി.
  alternative: ഇത് ദൈവിക അന്തിമവിധിയെയോ മരണാനന്തര ശുദ്ധീകരണത്തെയോ വ്യക്തമായി സൂചിപ്പിക്കുന്നതായി വിവർത്തനം ചെയ്യുക.
  rationale: ഗ്രീക്ക് വാചകം അത്തരം സിദ്ധാന്തപരമായ തിരിച്ചറിയൽ നേരിട്ട് പ്രസ്താവിക്കുന്നില്ല. അതിനാൽ സന്ദർഭത്തിലെ മുന്നറിയിപ്പും വ്യാഖ്യാനസാധ്യതകളും തുറന്നുവെച്ചിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ശക്തമായ നിഷേധത്തിന് 'ഒരിക്കലും ... ഇല്ല' ഉപയോഗിച്ചു. പ്രത്യേക പുരാതന നാണയത്തിന്റെ പേര് നിലനിർത്തി സാംസ്കാരിക വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകി.
