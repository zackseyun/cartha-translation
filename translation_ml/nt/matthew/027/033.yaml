source:
  edition: SBLGNT
  text: Καὶ ἐλθόντες εἰς τόπον λεγόμενον Γολγοθᾶ, ὅ ἐστιν ⸂Κρανίου Τόπος λεγόμενος⸃,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/033.yaml
  text: And when they came to a place called Golgotha (which means Place of a Skull),[a]
translation:
  language: ml
  text: അവർ ഗൊൽഗോഥാ എന്നു വിളിക്കപ്പെടുന്ന ഒരു സ്ഥലത്ത് എത്തിയപ്പോൾ—അതായത്, “തലയോട്ടിയുടെ സ്ഥലം” എന്നു വിളിക്കപ്പെടുന്നു[a]—,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, കൂടുതൽ സ്വാഭാവികമായി: “അതിന്റെ അർഥം ‘തലയോട്ടിയുടെ സ്ഥലം’ എന്നാണ്.” ഗ്രീക്കിൽ ‘ഗൊൽഗോഥാ’ എന്ന പേരിനെ വിശദീകരിക്കുന്ന പ്രയോഗമാണിത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες
  choice: എത്തിയപ്പോൾ
  rationale: ആഖ്യാനത്തിന്റെ സ്വാഭാവിക കാലബന്ധം വ്യക്തമാക്കുന്ന വിധത്തിൽ ഏറിസ്റ്റ് കൃദന്തത്തെ കാലസൂചക ഉപവാക്യമായി പരിഭാഷപ്പെടുത്തി.
- source_word: τόπον
  choice: സ്ഥലത്ത്
  rationale: τόπος എന്നതിന്റെ സാധാരണ അർഥമായ ‘സ്ഥലം’ സ്വീകരിച്ചു; മലയാളത്തിലെ ക്രിയാസംബന്ധം അനുസരിച്ച് അധികരണവിഭക്തി ഉപയോഗിച്ചു.
- source_word: λεγόμενον
  choice: എന്നു വിളിക്കപ്പെടുന്ന
  rationale: പേരിട്ടു വിളിക്കപ്പെടുന്നു എന്ന ഗ്രീക്ക് പ്രയോഗം വ്യക്തമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: Γολγοθᾶ
  choice: ഗൊൽഗോഥാ
  rationale: സ്ഥലനാമം പരിഭാഷപ്പെടുത്താതെ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: ὅ ἐστιν
  choice: അതിന് … എന്നാണ് അർഥം
  rationale: ഗൊൽഗോഥാ എന്ന പേരിന്റെ അർഥം വിശദീകരിക്കുന്ന ഗ്രീക്ക് വ്യാഖ്യാനസ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ അറിയിച്ചു.
- source_word: Κρανίου Τόπος
  choice: തലയോട്ടിയുടെ സ്ഥലം
  rationale: κρανίον എന്നതിന് ‘തലയോട്ടി’യും τόπος എന്നതിന് ‘സ്ഥലം’യും നൽകി; ഗ്രീക്കിലെ ബന്ധഘടന സംരക്ഷിച്ചു.
- source_word: λεγόμενος
  choice: എന്നാണ് അർഥം
  rationale: മലയാളത്തിൽ ‘വിളിക്കപ്പെടുന്ന സ്ഥലം’ എന്ന് ആവർത്തിക്കുന്നത് അസ്വാഭാവികമായതിനാൽ, പേരിന്റെ വിശദീകരണബലം അർഥസൂചക പ്രയോഗത്തിലൂടെ അറിയിച്ചു.
