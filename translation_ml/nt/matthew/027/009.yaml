id: MAT.27.9
reference: Matthew 27:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τότε ἐπληρώθη τὸ ῥηθὲν διὰ Ἰερεμίου τοῦ προφήτου λέγοντος· Καὶ ἔλαβον τὰ τριάκοντα ἀργύρια, τὴν τιμὴν τοῦ τετιμημένου ὃν ἐτιμήσαντο ἀπὸ υἱῶν Ἰσραήλ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/009.yaml
  text: Then what was spoken through Jeremiah the prophet was fulfilled[a], saying, ‘And they took the thirty pieces of silver, the price of the one who had been valued[b], whom they valued from among the sons of Israel,’
translation:
  language: ml
  text: 'അപ്പോൾ യിരെമ്യാ പ്രവാചകൻ മുഖാന്തരം അരുളിച്ചെയ്യപ്പെട്ടത് നിറവേറി[a], ഇപ്രകാരം: “അവർ ആ മുപ്പത് വെള്ളിക്കാശുകൾ എടുത്തു—ഇസ്രായേൽമക്കളിൽ ചിലർ വില നിശ്ചയിച്ചവന്റെ വില[b]—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: മത്തായി ഈ പ്രവാചകവചനം യിരെമ്യാവിനോടാണ് ആപാദിക്കുന്നത്. എന്നാൽ ഇതിന്റെ വാക്കുകൾ സെഖര്യാവ് 11:12–13-നോടാണ് ഏറ്റവും അടുത്ത് സാമ്യമുള്ളത്. ഇത് സംയുക്ത ഉദ്ധരണമാണെന്നോ, യിരെമ്യാവിന്റെ പേരിൽ അറിയപ്പെട്ടിരുന്ന ഒരു പ്രവാചകഗ്രന്ഥസമാഹാരത്തെ സൂചിപ്പിക്കുന്നുവെന്നോ, പാഠപകർപ്പിലുണ്ടായ പ്രശ്നമാണെന്നോ വിവിധ വ്യാഖ്യാനങ്ങൾ ഉണ്ട്.
    reason: textual_variant
  - marker: b
    text: 'ഗ്രീക്ക് പ്രയോഗം ദുഷ്കരമാണ്. ഇവിടെ ‘ഇസ്രായേൽമക്കളിൽ ചിലർ’ എന്നത് ἀπό എന്ന പദത്തിന്റെ സാധ്യതയുള്ള ഭാഗികാർഥം പ്രതിഫലിപ്പിക്കുന്നു. അക്ഷരാർഥത്തോട് അടുത്ത മറ്റൊരു പരിഭാഷ: “ഇസ്രായേൽമക്കളിൽനിന്ന് അവർ വില നിശ്ചയിച്ചവന്റെ വില.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: അപ്പോൾ
  rationale: ആഖ്യാനത്തിലെ സംഭവക്രമം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἐπληρώθη
  choice: നിറവേറി
  rationale: മത്തായിയുടെ പ്രവചനനിവൃത്തി പ്രയോഗം സംക്ഷിപ്തമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: τὸ ῥηθὲν διὰ Ἰερεμίου τοῦ προφήτου
  choice: യിരെമ്യാ പ്രവാചകനിലൂടെ അരുളിച്ചെയ്യപ്പെട്ടത്
  rationale: διάയുടെ മധ്യസ്ഥതാഭാവം ‘ലൂടെ’ എന്നതിലൂടെ സൂക്ഷിക്കുന്നു; പ്രവാചകവചനസന്ദർഭത്തിന് ‘അരുളിച്ചെയ്യപ്പെട്ടത്’ യോജിക്കുന്നു.
- source_word: ἔλαβον
  choice: വാങ്ങി
  rationale: വിലയും വെള്ളിക്കാശുകളും ഉൾപ്പെടുന്ന ഉദ്ധരണിസന്ദർഭത്തിൽ ‘വാങ്ങി’ സ്വാഭാവികമാണ്; ‘എടുത്തു’ എന്നതും സാധ്യമാണ്.
- source_word: τὰ τριάκοντα ἀργύρια
  choice: ആ മുപ്പതു വെള്ളിക്കാശുകൾ
  rationale: ἀργύριαയെ അമൂർത്തമായ വെള്ളിയായി അല്ല, വെള്ളിനാണയങ്ങളായ പണമായി വ്യക്തമാക്കുന്നു.
- source_word: τὴν τιμὴν τοῦ τετιμημένου ὃν ἐτιμήσαντο
  choice: വിലയിട്ടവന്റെ വില, അവർ അവനു വിലയിട്ടത്
  rationale: τιμή/τιμάω എന്ന പദാവർത്തനവും വാണിജ്യപരമായ പരിഹാസഭാവവും കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: ἀπὸ υἱῶν Ἰσραήλ
  choice: ഇസ്രായേൽമക്കളിൽ ചിലർ
  rationale: ദുഷ്കരമായ ἀπό പ്രയോഗത്തിന്റെ സാധ്യതയുള്ള ഭാഗികാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; അക്ഷരാർഥപരമായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: വചനത്തിന്റെ ആശയം സെഖര്യാവ് 11:12–13-നോട് ഏറ്റവും അടുത്തിരിക്കെ യിരെമ്യാവിനോടുള്ള ആപാദനം
  choice: പ്രധാനപാഠത്തിൽ ‘യിരെമ്യാ പ്രവാചകൻ’ എന്ന SBLGNT വായന മാറ്റമില്ലാതെ നിലനിർത്തി.
  alternative: ‘സെഖര്യാ’ എന്നു തിരുത്തുക, പ്രവാചകഗ്രന്ഥസമാഹാരത്തെ സൂചിപ്പിക്കുന്നതായി വ്യാഖ്യാനിക്കുക, അല്ലെങ്കിൽ സംയുക്ത ഉദ്ധരണിയായി കാണുക.
  rationale: ഗ്രീക്ക് പാഠത്തിലെ വ്യക്തമായ ആപാദനം വിവർത്തനം തിരുത്തുകയോ പൊരുത്തപ്പെടുത്തുകയോ ചെയ്യരുത്; ചരിത്ര-പാഠവിമർശന പ്രശ്നം അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിലെ മാന്യവും വായനാസൗഹൃദവുമായ ശൈലി. ‘വില’/‘വിലയിട്ടു’ എന്ന ആവർത്തനം മൂലപാഠത്തിലെ τιμή/τιμάω ബന്ധം തെളിയിക്കുന്നു. ഉദ്ധരണം അടുത്ത വാക്യത്തിൽ തുടരുന്നതിനാൽ അവസാനത്തിൽ ദീർഘവിരാമചിഹ്നം ഉപയോഗിച്ചു.
