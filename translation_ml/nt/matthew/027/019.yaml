id: MAT.27.19
reference: Matthew 27:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καθημένου δὲ αὐτοῦ ἐπὶ τοῦ βήματος ἀπέστειλεν πρὸς αὐτὸν ἡ γυνὴ αὐτοῦ λέγουσα· Μηδὲν σοὶ καὶ τῷ δικαίῳ ἐκείνῳ, πολλὰ γὰρ ἔπαθον σήμερον κατ’ ὄναρ δι’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/019.yaml
  text: While he was sitting on the judgment seat[a], his wife sent word to him, saying, “Have nothing to do with that righteous man[b], for I have suffered greatly today in a dream because of him.”
translation:
  language: ml
  text: 'അവൻ ന്യായാസനത്തിൽ ഇരിക്കുമ്പോൾ, അവന്റെ ഭാര്യ അവന്റെ അടുക്കലേക്ക് സന്ദേശമയച്ച് ഇങ്ങനെ അറിയിച്ചു: “ആ നീതിമാന്റെ കാര്യത്തിൽ ഇടപെടരുത്[a]; അവൻ നിമിത്തം ഇന്ന് ഒരു സ്വപ്നത്തിൽ ഞാൻ വളരെയധികം കഷ്ടപ്പെട്ടു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആ നിരപരാധിയുടെ കാര്യത്തിൽ ഇടപെടരുത്.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് വിശേഷണത്തിന് ‘നീതിമാൻ,’ ‘നീതിയുള്ളവൻ,’ എന്നും നിയമസന്ദർഭത്തിൽ ‘നിരപരാധി’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καθημένου δὲ αὐτοῦ
  choice: അവൻ ... ഇരിക്കുമ്പോൾ
  rationale: വർത്തമാനകാല കൃദന്തരൂപത്തോടുകൂടിയ genitive absolute മുഖ്യസംഭവത്തോടൊപ്പം തുടരുന്ന സാഹചര്യത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഇരിക്കുമ്പോൾ’ അത് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐπὶ τοῦ βήματος
  choice: ന്യായാസനത്തിൽ
  rationale: വിചാരണാസന്ദർഭത്തിലെ βῆμα ഔദ്യോഗിക ന്യായവിധിയാസനത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ന്യായാസനം’ ചുരുക്കവും വ്യക്തവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: ἀπέστειλεν πρὸς αὐτὸν ... λέγουσα
  choice: അവന്റെ അടുക്കൽ ആളയച്ച് ഇങ്ങനെ അറിയിച്ചു
  rationale: സന്ദേശം മറ്റൊരാൾ മുഖേന അയച്ചുവെന്ന ആശയം വ്യക്തമാക്കുന്നു; സന്ദേശവാഹകനെ അനാവശ്യമായി പ്രത്യേകീകരിക്കുന്നില്ല.
- source_word: ἡ γυνὴ αὐτοῦ
  choice: അവന്റെ ഭാര്യ
  rationale: ബന്ധസന്ദർഭത്തിൽ γυνή ഇവിടെ വ്യക്തമായി ‘ഭാര്യ’ എന്നാണ്.
- source_word: Μηδὲν σοὶ καὶ τῷ δικαίῳ ἐκείνῳ
  choice: ആ നീതിമാന്റെ കാര്യത്തിൽ ഇടപെടരുത്
  rationale: ഈ ദീർഘവൃത്തമായ ഗ്രീക്ക് പ്രയോഗം ‘അയാളുമായി/അയാളുടെ കാര്യത്തിൽ യാതൊരു ഇടപാടും വേണ്ട’ എന്ന മുന്നറിയിപ്പാണ്; മലയാളത്തിൽ ‘കാര്യത്തിൽ ഇടപെടരുത്’ ന്യായവിചാരണാസന്ദർഭത്തോട് സ്വാഭാവികമായി ചേരുന്നു.
- source_word: τῷ δικαίῳ ἐκείνῳ
  choice: ആ നീതിമാൻ
  rationale: δίκαιος എന്ന പദത്തിന്റെ നൈതികവും ന്യായപരവുമായ വ്യാപ്തി ‘നീതിമാൻ’ നിലനിർത്തുന്നു; നിയമസന്ദർഭത്തിലെ ‘നിരപരാധി’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: πολλὰ ... ἔπαθον
  choice: ഞാൻ വളരെയധികം കഷ്ടപ്പെട്ടു
  rationale: πολλὰ πάσχω എന്ന പ്രയോഗത്തിന്റെ തീവ്രത സാധാരണ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പകരുന്നു.
- source_word: σήμερον κατ’ ὄναρ δι’ αὐτόν
  choice: അവൻ നിമിത്തം ഇന്ന് ഒരു സ്വപ്നത്തിൽ
  rationale: σήμερον എന്ന സമയസൂചനയും κατ’ ὄναρ എന്ന സ്വപ്നാനുഭവവും δι’ αὐτόν എന്ന കാരണബന്ധവും നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശുവിനെ വിശേഷിപ്പിക്കുന്ന δίκαιος എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: നീതിമാൻ
  alternative: നിരപരാധി; നീതിയുള്ളവൻ
  rationale: ‘നീതിമാൻ’ മത്തായിയുടെ നൈതിക-ദൈവശാസ്ത്രപരമായ ഭാഷ നിലനിർത്തുകയും വിചാരണാസന്ദർഭത്തിലെ നിരപരാധിത്വസൂചന ഇല്ലാതാക്കാതിരിക്കുകയും ചെയ്യുന്നു. നിയമപരമായ ‘നിരപരാധി’ എന്ന വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ന്യായാസനം,’ ‘നീതിമാൻ’ എന്നീ പദങ്ങൾ ഉറവിടത്തിലെ ന്യായപരവും നൈതികവുമായ ഭാവങ്ങൾ ഒരുമിച്ച് നിലനിർത്തുന്നു. ആവർത്തനഭാരം ഒഴിവാക്കാൻ സന്ദേശത്തിന്റെ അവതരണം മലയാളവാക്യഘടനയ്ക്ക് അനുസരിച്ച് ക്രമപ്പെടുത്തി.
