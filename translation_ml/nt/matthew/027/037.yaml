id: MAT.27.37
reference: Matthew 27:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐπέθηκαν ἐπάνω τῆς κεφαλῆς αὐτοῦ τὴν αἰτίαν αὐτοῦ γεγραμμένην· Οὗτός ἐστιν Ἰησοῦς ὁ βασιλεὺς τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/037.yaml
  text: 'And they placed above his head the charge against him[a], written: “This is Jesus[b], the King of the Jews.”'
translation:
  language: ml
  text: അവർ അവന്റെ തലയ്ക്ക് മുകളിൽ, “ഇവനാണ് യേശു, യെഹൂദന്മാരുടെ രാജാവ്[b]” എന്ന് എഴുതിയ അവനെതിരെയുള്ള കുറ്റാരോപണം[a] വെച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അവന്റെമേലുള്ള കുറ്റം.” ഇവിടെ ഗ്രീക്ക് αἰτία എന്ന പദത്തിന് നിയമപരമായ അർഥമുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “യെഹൂദ്യരുടെ രാജാവ്.” ഗ്രീക്ക് Ἰουδαίων എന്ന പദം സന്ദർഭമനുസരിച്ച് “യെഹൂദന്മാർ” എന്നോ “യെഹൂദ്യർ” എന്നോ അർഥമാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπέθηκαν
  choice: വെച്ചു
  rationale: ἐπιτίθημι എന്ന ക്രിയ ഇവിടെ എഴുത്തുപലക അവന്റെ തലയ്ക്കു മുകളിൽ സ്ഥാപിച്ച ഭൗതിക പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘വെച്ചു’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: ἐπάνω τῆς κεφαλῆς αὐτοῦ
  choice: അവന്റെ തലയ്ക്കു മുകളിൽ
  rationale: ἐπάνω + ഷഷ്ഠീവിഭക്തി തലയുടെ മുകളിലുള്ള സ്ഥാനം സൂചിപ്പിക്കുന്നു; പലക തലയിൽ തന്നെയായിരുന്നുവെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: τὴν αἰτίαν αὐτοῦ
  choice: അവനെതിരെയുള്ള കുറ്റാരോപണം
  rationale: αἰτίαയ്ക്ക് ഈ വധശിക്ഷാ സാഹചര്യത്തിൽ നിയമപരമായ കുറ്റം അഥവാ ആരോപണം എന്ന അർഥമുണ്ട്; ‘കുറ്റാരോപണം’ ആ ന്യായവ്യവഹാര ഭാവം നിലനിർത്തുന്നു.
- source_word: γεγραμμένην
  choice: എഴുതി
  rationale: γράφωയുടെ പൂർണ്ണ ഭൂതകാല നിഷ്ക്രിയ കൃദന്തരൂപം രേഖപ്പെടുത്തിയ വാക്കുകളെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഇങ്ങനെ എഴുതി വെച്ചു’ ഫലാവസ്ഥയും മുഖ്യക്രിയയുമായുള്ള ബന്ധവും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: Οὗτός ἐστιν
  choice: ഇവനാണ്
  rationale: ചൂണ്ടുപദവും അസ്തിത്വക്രിയയും ചേർന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപമാണിത്.
- source_word: Ἰησοῦς
  choice: യേശു
  rationale: പേരിന്റെ മലയാളത്തിലെ പ്രചാരത്തിലുള്ള മാനകരൂപം ഉപയോഗിക്കുന്നു.
- source_word: ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: യെഹൂദന്മാരുടെ രാജാവ്
  rationale: രാജകീയ-രാഷ്ട്രീയ ബിരുദത്തിന്റെ നേരിട്ടുള്ള അർഥം സംരക്ഷിക്കുന്നു; ബന്ധസൂചക ഘടന മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: Ἰουδαίων
  choice: യെഹൂദന്മാരുടെ
  rationale: ഈ പീഡാനുഭവവിവരണത്തിലെ രാജകീയ കുറ്റലിഖിതത്തിൽ ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്ന പതിവ് വായനയാണ്; പ്രദേശവാസികൾ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: കുരിശുമരണത്തിന്റെ എഴുത്തിലെ നിയമപരമായ പദപ്രയോഗം
  choice: അവനെതിരെയുള്ള കുറ്റാരോപണം
  alternative: അവന്റെമേലുള്ള കുറ്റം
  rationale: എഴുത്തുപലക വധശിക്ഷയ്ക്കു ചുമത്തപ്പെട്ട ഔദ്യോഗിക ആരോപണം പ്രസ്താവിക്കുന്നു; ഈ രൂപം നിയമപരമായ ശക്തി വ്യക്തമാക്കുന്നു, എന്നാൽ കുറ്റം യഥാർഥമാണെന്ന് വിധിക്കുന്നില്ല.
- issue: Ἰουδαίων എന്ന ജന-പ്രദേശ സൂചകപദം
  choice: യെഹൂദന്മാരുടെ
  alternative: യെഹൂദ്യരുടെ
  rationale: ഈ രാജകീയ-രാഷ്ട്രീയ കുറ്റലിഖിതത്തിൽ യെഹൂദജനത്തെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗതവും സന്ദർഭോചിതവുമായ വായനയാണ് മുഖ്യപാഠത്തിൽ; ഗ്രീക്ക് പദത്തിന്റെ പ്രദേശസൂചക സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള ശൈലി. ‘ഇങ്ങനെ എഴുതി വെച്ചു’ എന്ന ക്രമം മലയാളത്തിലെ സ്വാഭാവിക വാക്യഘടനയ്ക്കായി സ്വീകരിച്ചു; മൂലത്തിലെ നിയമപരവും ജന-പ്രദേശപരവുമായ അർഥസാധ്യതകൾ അടിക്കുറിപ്പുകളിൽ നിലനിർത്തി.
