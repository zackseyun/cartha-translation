revisions:
- from: അപ്പോൾ അവൻ ബറബ്ബാസിനെ അവർക്കു വിട്ടുകൊടുത്തു; എന്നാൽ യേശുവിനെ ചാട്ടവാറുകൊണ്ട് അടിപ്പിച്ചശേഷം, ക്രൂശിക്കേണ്ടതിന് ഏൽപ്പിച്ചുകൊടുത്തു.[a]
  to: അപ്പോൾ അവൻ ബറബ്ബാസിനെ അവർക്കു വിട്ടയച്ചു; എന്നാൽ യേശുവിനെ ചാട്ടവാറുകൊണ്ട് അടിപ്പിച്ചശേഷം[a] ക്രൂശിക്കപ്പെടാനായി കൈമാറിക്കൊടുത്തു.
