  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τότε ἀπέλυσεν αὐτοῖς τὸν Βαραββᾶν, τὸν δὲ Ἰησοῦν φραγελλώσας παρέδωκεν ἵνα σταυρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/026.yaml
  text: Then he released Barabbas to them[a], but after flogging Jesus, he handed him over to be crucified.
translation:
  language: ml
  text: അപ്പോൾ അവൻ ബറബ്ബാസിനെ അവർക്കു വിട്ടയച്ചു; എന്നാൽ യേശുവിനെ ചാട്ടവാറുകൊണ്ട് അടിപ്പിച്ചശേഷം[a] ക്രൂശിക്കപ്പെടാനായി കൈമാറിക്കൊടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ചാട്ടവാറുകൊണ്ട് അടിപ്പിച്ചു” എന്നതിന് “ചമ്മട്ടികൊണ്ട് അടിപ്പിച്ചു” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് ക്രിയ റോമൻ ശിക്ഷാരീതിയായ ചാട്ടവാറടിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: അപ്പോൾ
  rationale: കഥയുടെ സമയക്രമവും തുടർച്ചയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀπέλυσεν αὐτοῖς
  choice: അവർക്കു വിട്ടുകൊടുത്തു
  rationale: തടവുകാരനെ മോചിപ്പിച്ച് ജനങ്ങൾക്ക് വിട്ടുകൊടുക്കുന്ന ന്യായവിധിസന്ദർഭം നേരിട്ട് പ്രകടമാക്കുന്നു.
- source_word: Βαραββᾶν
  choice: ബറബ്ബാസിനെ
  rationale: വ്യക്തിനാമത്തിന്റെ പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: ബറബ്ബാസിന്റെ മോചനവും യേശുവിനോടുള്ള നടപടിയും തമ്മിലുള്ള വൈരുധ്യം നിലനിർത്തുന്നു.
- source_word: φραγελλώσας
  choice: ചാട്ടവാറുകൊണ്ട് അടിപ്പിച്ചശേഷം
  rationale: റോമൻ ശിക്ഷാരീതിയായ കഠിനമായ ചാട്ടവാറടി സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി അറിയിക്കുകയും, കർത്താവ് പീലാത്തൊസ് ആയതിനാൽ കാരണവാചക പ്രയോഗത്തിലൂടെ നിർവഹണാധികാരം സ്വാഭാവികമായി സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: παρέδωκεν
  choice: ഏൽപ്പിച്ചുകൊടുത്തു
  rationale: ഒരു നിർദിഷ്ട ശിക്ഷ നടപ്പാക്കാനായി യേശുവിനെ അധികാരികൾക്ക് കൈമാറിയ ന്യായവിധിസംബന്ധമായ അർഥം നിലനിർത്തുന്നു.
- source_word: ἵνα σταυρωθῇ
  choice: ക്രൂശിക്കേണ്ടതിന്
  rationale: ഗ്രീക്കിലെ ഉദ്ദേശ്യ/ഫലബന്ധവും കർമണിപ്രയോഗവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ ശിക്ഷാവിധിയിലെ സംഭവക്രമവും പ്രവർത്തകത്വവും
  choice: പീലാത്തോസ് ബറബ്ബാസിനെ വിട്ടുകൊടുത്തു; യേശുവിനെ ചാട്ടവാറുകൊണ്ട് അടിപ്പിച്ചശേഷം ക്രൂശിക്കാനായി ഏൽപ്പിച്ചുകൊടുത്തു.
  alternative: യേശുവിനെ ഏൽപ്പിച്ചുകൊടുത്തശേഷം ചാട്ടവാറുകൊണ്ട് അടിച്ചു.
  rationale: φραγελλώσας എന്ന അനിശ്ചിതഭൂതകാല കൃദന്തം പ്രധാനക്രിയയായ παρέδωκεν-നു മുമ്പുള്ള പ്രവൃത്തിയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു. റോമൻ നടപടിക്രമത്തെക്കുറിച്ചുള്ള അധിക വ്യാഖ്യാനം ചേർക്കാതെ ഗ്രീക്ക് വാക്യത്തിലെ ക്രമം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ‘ചമ്മട്ടികൊണ്ട് അടിച്ചു’ എന്നതിനെക്കാൾ വ്യാപകമായി മനസ്സിലാകുന്ന ‘ചാട്ടവാറുകൊണ്ട് അടിപ്പിച്ചു’ ഉപയോഗിച്ചു. വൈരുധ്യം വ്യക്തമാക്കാൻ ‘എന്നാൽ’ നിലനിർത്തി. അടിക്കുറിപ്പിന്റെ സൂചിക പ്രധാനവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
