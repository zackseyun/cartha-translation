  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. പഴഞ്ചൻ പദങ്ങളും മൂലത്തിൽ ഇല്ലാത്ത ശക്തമായ ബന്ധകവും ഒഴിവാക്കി.
