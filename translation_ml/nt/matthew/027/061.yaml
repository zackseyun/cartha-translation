id: MAT.27.61
reference: Matthew 27:61
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἦν δὲ ἐκεῖ ⸀Μαριὰμ ἡ Μαγδαληνὴ καὶ ἡ ἄλλη Μαρία καθήμεναι ἀπέναντι τοῦ τάφου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/061.yaml
  text: Mary Magdalene and the other Mary were there, sitting opposite the tomb.
translation:
  language: ml
  text: മഗ്ദലക്കാരി മറിയയും മറ്റേ മറിയയും അവിടെ കല്ലറയ്ക്ക് എതിർവശത്ത് ഇരിക്കുകയായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν ... ἐκεῖ
  choice: അവിടെ ... ഇരിക്കുകയായിരുന്നു
  rationale: രണ്ടു സ്ത്രീകളുടെ സാന്നിധ്യവും അവസ്ഥയും മലയാളത്തിൽ സ്വാഭാവികമായി ഒരൊറ്റ ക്രിയാപ്രയോഗത്തിൽ അറിയിക്കുന്നു; ഗ്രീക്കിലെ ഏകവചനക്രിയയെ യാന്ത്രികമായി പകർത്താതെ സംയുക്ത കർത്താവിനൊത്ത പ്രയോഗം സ്വീകരിച്ചു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: ഇവിടെ δέ ശക്തമായ വിരോധമല്ല, ലഘുവായ ആഖ്യാനബന്ധമാണ്. മലയാളത്തിൽ നിർബന്ധമായി ‘എന്നാൽ’ അല്ലെങ്കിൽ ‘അപ്പോൾ’ ചേർത്താൽ മൂലത്തിലില്ലാത്ത ഊന്നൽ വരാം; വാക്യക്രമം തന്നെ ബന്ധം വഹിക്കുന്നു.
- source_word: Μαριὰμ ἡ Μαγδαληνὴ
  choice: മഗ്ദലക്കാരി മറിയ
  rationale: വ്യക്തിയെ മഗ്ദല സ്വദേശിനിയായി തിരിച്ചറിയിക്കുന്ന വിശേഷണം സ്വാഭാവികമായ മലയാളരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἡ ἄλλη Μαρία
  choice: മറ്റേ മറിയ
  rationale: മഗ്ദലക്കാരി മറിയയിൽനിന്ന് ഈ മറിയയെ വേർതിരിക്കുന്ന ἄλλη എന്ന പദത്തിന്റെ അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: καθήμεναι
  choice: ഇരിക്കുകയായിരുന്നു
  rationale: അവർ ഇരുന്നുകൊണ്ടിരുന്ന നിലയെ സൂചിപ്പിക്കുന്ന വർത്തമാനകൃുദന്തരൂപത്തിന്റെ തുടർച്ചാഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἀπέναντι
  choice: എതിർവശത്ത്
  rationale: കല്ലറയ്ക്ക് അഭിമുഖമായോ മറുവശത്തായോ ഉള്ള സ്ഥാനബന്ധം അനാവശ്യമായി കൂടുതൽ കൃത്യമാക്കാതെ നിലനിർത്തുന്നു.
- source_word: τοῦ τάφου
  choice: കല്ലറയ്ക്ക്
  rationale: ശവസംസ്കാരസന്ദർഭത്തിലെ τάφος എന്ന പദത്തിന് സാധാരണവും വ്യക്തവുമായ ആധുനിക മലയാളപദമാണ് ‘കല്ലറ’.
