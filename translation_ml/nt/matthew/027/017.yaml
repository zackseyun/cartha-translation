id: MAT.27.17
reference: Matthew 27:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: συνηγμένων οὖν αὐτῶν εἶπεν αὐτοῖς ὁ Πιλᾶτος· Τίνα θέλετε ἀπολύσω ὑμῖν, ⸂Ἰησοῦν τὸν⸃ Βαραββᾶν ἢ Ἰησοῦν τὸν λεγόμενον χριστόν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/017.yaml
  text: 'So when they had gathered together[a], Pilate said to them, “Which one do you want me to release to you: Jesus Barabbas[b], or Jesus who is called Messiah?”'
translation:
  language: ml
  text: 'അവർ കൂടിവന്നപ്പോൾ പീലാത്തോസ് അവരോടു ചോദിച്ചു: “ഈ രണ്ടുപേരിൽ ആരെയാണ് ഞാൻ നിങ്ങൾക്കു വിട്ടയക്കണമെന്ന് നിങ്ങൾ ആഗ്രഹിക്കുന്നത്—യേശു ബറബ്ബാസിനെയോ[a], മശീഹാ എന്നു വിളിക്കപ്പെടുന്ന യേശുവിനെയോ[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ “യേശു ബറബ്ബാസ്” എന്നതിനുപകരം “ബറബ്ബാസ്” എന്നു മാത്രം കാണുന്നു.
    reason: textual_variant
  - marker: b
    text: അഥവാ, “ക്രിസ്തു.” ഗ്രീക്കിലെ പദം ക്രിസ്റ്റോസ് ആണ്; ഇവിടെ അത് ഒരു പദവിപ്പേരായി വരുന്നതിനാൽ “മശീഹാ” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: συνηγμένων
  choice: അവർ കൂടിവന്നപ്പോൾ
  rationale: സυνάγω എന്ന ക്രിയയുടെ പൂർണകാല കർമണി കൃദന്തരൂപം ഇവിടെ കാലസൂചകമായ genitive absolute ഘടനയിലാണ്. ചോദ്യം ഉന്നയിക്കുന്നതിന് മുമ്പ് ജനക്കൂട്ടം കൂടിവന്നിരുന്നു എന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: οὖν
  choice: അങ്ങനെ
  rationale: കഥയുടെ തുടർച്ചയും മുൻസാഹചര്യത്തിൽനിന്നുള്ള മുന്നേറ്റവും സൂചിപ്പിക്കുന്നു; ഔപചാരികത അധികമാക്കാതെ ബന്ധകശക്തി നിലനിർത്തുന്നു.
- source_word: Τίνα
  choice: ഇവരിൽ ആരെ
  rationale: പേരെടുത്തുപറയുന്ന രണ്ടുപേരിൽ ഒരാളെ തിരഞ്ഞെടുക്കാനുള്ള ചോദ്യമാണെന്ന് മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: θέλετε
  choice: നിങ്ങൾ ആഗ്രഹിക്കുന്നത്
  rationale: θέλω ഇവിടെ ഇഷ്ടമോ മുൻഗണനയോ ചോദിക്കുന്നു; അതിന്റെ അർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἀπολύσω
  choice: ഞാൻ ... നിങ്ങൾക്കു വിട്ടുതരണമെന്ന്
  rationale: തടവുകാരനെ മോചിപ്പിക്കുന്ന ന്യായപരമായ സന്ദർഭം പ്രകടിപ്പിക്കുന്നു; ‘മാപ്പുനൽകുക’ എന്ന പാഠത്തിൽ ഇല്ലാത്ത ആശയം ചേർക്കുന്നില്ല.
- source_word: Ἰησοῦν τὸν Βαραββᾶν
  choice: യേശു ബറബ്ബാസിനെ
  rationale: SBLGNT-യിലെ Ἰησοῦν ഉൾപ്പെടുത്തി, യേശു എന്ന പേരുള്ള രണ്ടുപേരിലുണ്ടാകുന്ന വാഗ്‌വൈരുധ്യം സംരക്ഷിക്കുന്നു.
- source_word: Ἰησοῦν τὸν λεγόμενον χριστόν
  choice: മശീഹ എന്നു വിളിക്കപ്പെടുന്ന യേശു
  rationale: λεγόμενον എന്നതിനെ നിഷ്പക്ഷമായി ‘എന്നു വിളിക്കപ്പെടുന്ന’ എന്നു നൽകുന്നു; χριστός ഇവിടെ വ്യക്തമായി ഒരു സ്ഥാനപ്പേരായതിനാൽ അതിന്റെ അർഥം ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
theological_decisions:
- issue: χριστός എന്ന സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ‘എന്നു വിളിക്കപ്പെടുന്ന’ എന്ന പ്രയോഗത്തിൽ χριστός പേരുപോലെയല്ല, സ്ഥാനപ്പേരായാണ് പ്രവർത്തിക്കുന്നത്. അതിനാൽ അതിന്റെ മശീഹാസംബന്ധമായ അർഥം പരിഭാഷയിൽ വ്യക്തമാക്കുന്നു; പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- issue: ബറബ്ബാസിനു മുമ്പുള്ള Ἰησοῦν ഉൾപ്പെടുത്തൽ
  choice: പ്രധാന പാഠത്തിൽ ‘യേശു ബറബ്ബാസ്’ ഉൾപ്പെടുത്തി
  alternative: ‘ബറബ്ബാസ്’ മാത്രം
  rationale: നൽകിയിരിക്കുന്ന SBLGNT പാഠത്തിൽ Ἰησοῦν ഉണ്ട്. അതിനാൽ പ്രധാന പാഠം അതിനെ പിന്തുടരുന്നു; ‘യേശു’ ഇല്ലാത്ത കൈയെഴുത്തുപ്രതി വായന അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം ഗൗരവമുള്ളതുമായ ശൈലി. പീലാത്തോസിന്റെ ചോദ്യം സ്വാഭാവിക മലയാള വാക്യക്രമത്തിൽ നൽകിയിരിക്കുന്നു. പ്രധാന പാഠത്തിലെ [a], [b] അടയാളങ്ങൾ അനുബന്ധ അടിക്കുറിപ്പുകളുമായി ശരിയായി ബന്ധിപ്പിച്ചിരിക്കുന്നു.
