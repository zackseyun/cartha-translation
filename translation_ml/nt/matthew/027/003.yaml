  revision_rationale: The sole substantive revision changes the reflexive «തന്നെ» to the explicit object «യേശുവിനെ», faithfully representing αὐτόν and preventing the Malayalam from saying that Judas betrayed himself. Commas around «ഖേദിച്ച്» clarify its participial relation to Judas's subsequent action without changing the meaning.
