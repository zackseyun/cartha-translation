id: MAT.27.3
reference: Matthew 27:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τότε ἰδὼν Ἰούδας ὁ ⸀παραδιδοὺς αὐτὸν ὅτι κατεκρίθη μεταμεληθεὶς ⸀ἔστρεψεν τὰ τριάκοντα ἀργύρια τοῖς ἀρχιερεῦσιν ⸀καὶ πρεσβυτέροις
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/003.yaml
  text: Then Judas[a], who had betrayed him, seeing that he had been condemned[b], regretted it and returned the thirty pieces of silver to the chief priests and elders.
translation:
  language: ml
  text: അപ്പോൾ, യേശുവിനെ ഒറ്റിക്കൊടുത്ത യൂദാസ്, യേശു കുറ്റംവിധിക്കപ്പെട്ടതായി കണ്ടപ്പോൾ, ഖേദിച്ച്, ആ മുപ്പത് വെള്ളിനാണയങ്ങൾ[a] മുഖ്യപുരോഹിതന്മാർക്കും മൂപ്പന്മാർക്കും തിരികെ നൽകി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മുപ്പത് വെള്ളിക്കഷണങ്ങൾ.’
    reason: ἀργύρια എന്നത് വെള്ളിപ്പണമോ വെള്ളിനാണയങ്ങളോ സൂചിപ്പിക്കാം; പരമ്പരാഗതവും അന്തർപാഠപരമായി പരിചിതവുമായ രൂപം സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: Τότε
  choice: അപ്പോൾ
  rationale: തുടർന്നുണ്ടായ സംഭവത്തെ പരിചയപ്പെടുത്തുന്ന സ്വാഭാവികമായ കാലസൂചകം.
- source_word: ἰδὼν
  choice: കണ്ടപ്പോൾ
  rationale: അയോറിസ്റ്റ് കൃദന്തരൂപത്തിന്റെ കാലബന്ധം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: Ἰούδας
  choice: യൂദാസ്
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ സ്ഥിരപ്പെട്ട വ്യക്തിനാമരൂപം.
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: തന്നെ ഒറ്റിക്കൊടുത്ത യൂദാസ്
  rationale: യൂദാസിനെ അവന്റെ പ്രവൃത്തിയാൽ തിരിച്ചറിയിക്കുന്ന കൃദന്തരൂപം; സന്ദർഭത്തിൽ παραδίδωμι എന്നതിന് ‘ഒറ്റിക്കൊടുക്കുക’ യോജിക്കുന്നു.
- source_word: ὅτι κατεκρίθη
  choice: യേശു കുറ്റം വിധിക്കപ്പെട്ടതായി
  rationale: ഗ്രീക്കിലെ കർമണിപ്രയോഗവും കുറ്റവിധിയുടെ ആശയവും നിലനിർത്തുന്നു; മലയാളത്തിൽ സർവനാമസന്ദിഗ്ധത ഒഴിവാക്കാൻ ‘യേശു’ വ്യക്തമാക്കുന്നു.
- source_word: μεταμεληθεὶς
  choice: അതിൽ ഖേദിച്ച്
  rationale: പശ്ചാത്താപം എന്ന ശക്തമായ ദൈവശാസ്ത്രപദം ഉപയോഗിക്കാതെ ഖേദം/മനോവേദന എന്ന അർഥം നൽകുന്നു.
- source_word: ἔστρεψεν
  choice: തിരികെ നൽകി
  rationale: പണം അതിന്റെ മുൻ കൈവശക്കാരിലേക്കു മടക്കിനൽകിയ പ്രവൃത്തി മലയാളത്തിൽ സ്വാഭാവികമായി പറയുന്നു.
- source_word: τὰ τριάκοντα ἀργύρια
  choice: ആ മുപ്പത് വെള്ളിനാണയങ്ങൾ
  rationale: വെള്ളിയിൽ നിർമിച്ച പണഘടകങ്ങളെന്ന ആശയം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; നിർദ്ദിഷ്ട ആർട്ടിക്കിൾ ‘ആ’ എന്നു പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: τοῖς ἀρχιερεῦσιν καὶ πρεσβυτέροις
  choice: മുഖ്യപുരോഹിതന്മാർക്കും മൂപ്പന്മാർക്കും
  rationale: യഹൂദനേതൃത്വത്തിലെ രണ്ടു വിഭാഗങ്ങളെയും വ്യത്യസ്തമായി നിലനിർത്തുന്ന സ്ഥിരമായ മലയാളപ്രയോഗം.
theological_decisions:
- issue: μεταμεληθεὶς എന്ന പദം യൂദാസിന്റെ പ്രതികരണത്തെ എങ്ങനെ വിശേഷിപ്പിക്കുന്നു
  choice: അതിൽ ഖേദിച്ച്
  alternative: പശ്ചാത്തപിച്ച് / മനസ്സുമാറ്റി
  rationale: μεταμέλομαι ഖേദമോ മനോവേദനയോ സൂചിപ്പിക്കുന്നു; യൂദാസിന്റെ ആത്മീയാവസ്ഥയെക്കുറിച്ച് വാക്യം പറയുന്നതിലധികം നിഗമനം വരുത്താതിരിക്കാൻ ‘ഖേദിച്ച്’ തെരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. നീണ്ട ഗ്രീക്ക് കൃദന്തരചന മലയാളത്തിലെ കാലവാക്യമായി സ്വാഭാവികമാക്കി; ഖേദവും പൂർണ പശ്ചാത്താപവും തമ്മിലുള്ള ദൈവശാസ്ത്രവ്യത്യാസം അനാവശ്യമായി തീർപ്പാക്കിയിട്ടില്ല.
