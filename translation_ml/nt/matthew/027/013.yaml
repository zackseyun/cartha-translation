id: MAT.27.13
reference: Matthew 27:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τότε λέγει αὐτῷ ὁ Πιλᾶτος· Οὐκ ἀκούεις πόσα σου καταμαρτυροῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/013.yaml
  text: Then Pilate says to him[a], “Do you not hear how many things they are testifying against you?”
translation:
  language: ml
  text: 'അപ്പോൾ പീലാത്തോസ് അവനോടു പറയുന്നു: “എത്ര കാര്യങ്ങളാണ് അവർ നിനക്കെതിരായി സാക്ഷ്യം പറയുന്നതെന്ന് നീ കേൾക്കുന്നില്ലേ?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു പരിഭാഷ: “അവർ നിനക്കെതിരായി സാക്ഷ്യം വഹിക്കുന്നു.” ഗ്രീക്ക് ക്രിയയ്ക്ക് നിയമ-ന്യായപരമായ ‘എതിരായി സാക്ഷ്യം പറയുക’ എന്ന അർഥമുണ്ട്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: അപ്പോൾ
  rationale: സംഭവക്രമത്തിലെ അടുത്ത ഘട്ടം അവതരിപ്പിക്കുന്ന സ്വാഭാവികമായ കാലസൂചകപ്രയോഗം.
- source_word: λέγει
  choice: ചോദിക്കുന്നു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനകാലത്തിന്റെ സജീവത നിലനിർത്തുന്നു; തുടർന്നുവരുന്നത് ചോദ്യം ആയതിനാൽ മലയാളത്തിൽ ‘ചോദിക്കുന്നു’ സ്വാഭാവികമാണ്.
- source_word: αὐτῷ
  choice: അവനോട്
  rationale: മൂലത്തിലെ സർവനാമരൂപം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അത് യേശുവിനെ സൂചിപ്പിക്കുന്നുവെന്ന് വ്യക്തമാണ്.
- source_word: ὁ Πιλᾶτος
  choice: പീലാത്തോസ്
  rationale: വ്യക്തിനാമത്തിന് മുമ്പുള്ള ഗ്രീക്ക് നിർദേശകപദം മലയാളത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്തേണ്ടതില്ല.
- source_word: Οὐκ ἀκούεις
  choice: നീ കേൾക്കുന്നില്ലേ
  rationale: നിഷേധചോദ്യത്തിന്റെ ശക്തിയും ἀκούω എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘കേൾക്കുക’ എന്നതും നിലനിർത്തുന്നു.
- source_word: πόσα
  choice: എത്ര കാര്യങ്ങളാണ്
  rationale: നപുംസകലിംഗ ബഹുവചനരൂപം ആരോപണങ്ങളുടെ എണ്ണത്തെ സൂചിപ്പിക്കുന്നു; ‘ആരോപണങ്ങൾ’ എന്ന് വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ മൂലത്തിന്റെ പൊതുവായ പ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: σου
  choice: നിനക്കെതിരായി
  rationale: καταμαρτυρέω എന്ന ക്രിയയോടൊപ്പം ഇവിടെ എതിർസാക്ഷ്യത്തിന്റെ ബന്ധമാണ്; മലയാളത്തിൽ അത് വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: καταμαρτυροῦσιν
  choice: സാക്ഷ്യം പറയുന്നതെന്ന്
  rationale: നിയമ-ന്യായപരമായ ‘എതിരായി സാക്ഷ്യം പറയുക’ എന്ന അർഥം നിലനിർത്തുന്നു; വെറും ‘കുറ്റം ചുമത്തുക’ എന്ന വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കുന്നില്ല.
theological_decisions: []
