  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ഗ്രീക്കിലെ ചരിത്രവർത്തമാനകാലം ‘ചോദിക്കുന്നു’ എന്ന രൂപത്തിൽ നിലനിർത്തിയിരിക്കുന്നു; നിയമപരമായ സാക്ഷ്യഭാവം വ്യക്തമായി പ്രകടിപ്പിച്ചിരിക്കുന്നു.
