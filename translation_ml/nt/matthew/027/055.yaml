source:
  edition: SBLGNT
  text: Ἦσαν δὲ ἐκεῖ γυναῖκες πολλαὶ ἀπὸ μακρόθεν θεωροῦσαι, αἵτινες ἠκολούθησαν τῷ Ἰησοῦ ἀπὸ τῆς Γαλιλαίας διακονοῦσαι αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/055.yaml
  text: There were many women there[a], watching from a distance, who had followed Jesus from Galilee[b], serving him.
translation:
  language: ml
  text: അവിടെ അകലെനിന്ന് നോക്കിക്കൊണ്ടിരുന്ന അനേകം സ്ത്രീകൾ ഉണ്ടായിരുന്നു[a]. അവർ ഗലീലയിൽനിന്ന് യേശുവിനെ അനുഗമിച്ചവരും അവനു സേവനം ചെയ്തുകൊണ്ടിരുന്നവരും ആയിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദൂരെനിന്ന് നോക്കിനിൽക്കുകയായിരുന്നു.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവനെ ശുശ്രൂഷിച്ചുകൊണ്ടിരുന്നവരും.’ ഗ്രീക്ക് ക്രിയ പ്രായോഗിക സേവനത്തെയോ പിന്തുണയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ ἐκεῖ
  choice: അവിടെ … ഉണ്ടായിരുന്നു / നോക്കിക്കൊണ്ടിരുന്നു
  rationale: Ἦσαν എന്ന അപൂർണഭൂതകാലരൂപവും ἐκεῖ എന്ന സ്ഥലസൂചകവും ദൃശ്യത്തിന്റെ പശ്ചാത്തലം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘അവിടെ … നോക്കിക്കൊണ്ടിരുന്നു’ എന്നു ചേർത്ത് പറയുന്നത് സ്വാഭാവികമാണ്. δέ ഒരു മൃദുവായ ബന്ധകമായതിനാൽ പ്രത്യേകം വിവർത്തനം ചെയ്യാതെയും ആശയം നിലനിൽക്കുന്നു.
- source_word: γυναῖκες πολλαὶ
  choice: അനേകം സ്ത്രീകൾ
  rationale: എണ്ണവും ലിംഗവും നേരിട്ട്, മാന്യവും സാധാരണവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀπὸ μακρόθεν θεωροῦσαι
  choice: അകലെനിന്ന് നോക്കിക്കൊണ്ടിരുന്നു
  rationale: ἀπὸ μακρόθεν സ്ഥലപരമായ അകലത്തെയും θεωροῦσαι തുടർന്നുനിൽക്കുന്ന ശ്രദ്ധാപൂർവമായ കാഴ്ചയെയും സൂചിപ്പിക്കുന്നു.
- source_word: αἵτινες ἠκολούθησαν τῷ Ἰησοῦ
  choice: അവർ … യേശുവിനെ അനുഗമിച്ച് … ചെയ്തുപോന്നവരായിരുന്നു
  rationale: αἵτινες ആ സ്ത്രീകളെ മുൻകാലംമുതൽ യേശുവിനെ അനുഗമിച്ചവരായി തിരിച്ചറിയിക്കുന്നു. മലയാളത്തിലെ ‘ചെയ്തുപോന്നവരായിരുന്നു’ ഇപ്പോഴത്തെ ക്രൂശിക്കൽദൃശ്യത്തിന് മുമ്പുള്ള തുടർച്ചയായ പശ്ചാത്തലം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: ഗലീലയിൽനിന്ന്
  rationale: അവർ യേശുവിനെ അനുഗമിച്ചുതുടങ്ങിയ ഭൂമിശാസ്ത്രപരമായ ആരംഭസ്ഥാനം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: διακονοῦσαι αὐτῷ
  choice: അവനു സേവനം ചെയ്തുപോന്നവർ
  rationale: διακονέω പ്രായോഗിക പരിചരണം, സഹായം, സേവനം എന്നിവ ഉൾക്കൊള്ളാം. ‘സേവനം’ ഈ അർത്ഥവ്യാപ്തി നിലനിർത്തുകയും ഔദ്യോഗിക സഭാപദവിയുടെ ആശയം അനാവശ്യമായി ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: സ്ത്രീകളുടെ പങ്കിനെ സൂചിപ്പിക്കുന്ന διακονοῦσαι എന്നതിന്റെ വിവർത്തനം
  choice: അവനു സേവനം ചെയ്തുപോന്നവർ
  alternative: അവനെ ശുശ്രൂഷിച്ചുപോന്നവർ
  rationale: മൂലപദം പ്രായോഗിക സേവനവും പിന്തുണയും ഉൾക്കൊള്ളുന്നു; അതിനെ വീട്ടുജോലിയായോ ഔദ്യോഗിക ശുശ്രൂഷാപദവിയായോ ചുരുക്കുന്നില്ല.
- issue: സ്ത്രീകൾ യേശുവിനെ അനുഗമിച്ചതിന്റെ കാലബന്ധം
  choice: അനുഗമിച്ച് … ചെയ്തുപോന്നവരായിരുന്നു
  alternative: അനുഗമിക്കുകയും … സേവിക്കുകയും ചെയ്തവർ
  rationale: ക്രൂശിക്കൽദൃശ്യത്തിന് മുമ്പ് ഗലീലയിൽ ആരംഭിച്ച അനുഗമനവും സേവനവും പശ്ചാത്തലപ്രവർത്തനമായി സൂചിപ്പിക്കുന്നു; അതേസമയം ഗ്രീക്കിൽ നിർബന്ധമല്ലാത്ത അധിക കാലവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി. നീണ്ട ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് മലയാളവാക്യങ്ങളാക്കിയെങ്കിലും സ്ത്രീകളെ തിരിച്ചറിയിക്കുന്ന ബന്ധവും സംഭവക്രമവും നിലനിർത്തിയിരിക്കുന്നു.
