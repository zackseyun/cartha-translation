id: MAT.27.38
reference: Matthew 27:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τότε σταυροῦνται σὺν αὐτῷ δύο λῃσταί, εἷς ἐκ δεξιῶν καὶ εἷς ἐξ εὐωνύμων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/038.yaml
  text: Then two robbers are crucified with him[a], one on the right and one on the left.
translation:
  language: ml
  text: അപ്പോൾ അവനോടൊപ്പം രണ്ടു കൊള്ളക്കാർ[a] ക്രൂശിക്കപ്പെട്ടു—ഒരാൾ വലതുവശത്തും മറ്റെയാൾ ഇടതുവശത്തും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കവർച്ചക്കാർ”; ഗ്രീക്ക് പദത്തിന് അക്രമാസക്തരായ കൊള്ളക്കാരെ സൂചിപ്പിക്കാനാകും; ചില സന്ദർഭങ്ങളിൽ അതിന്റെ അർഥം കലാപപ്രവർത്തനവുമായി ബന്ധപ്പെട്ടിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: അപ്പോൾ
  rationale: ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സംക്ഷിപ്തവുമായ കാലസൂചകം.
- source_word: σταυροῦνται
  choice: ക്രൂശിച്ചു
  rationale: ആഖ്യാനവർത്തമാനത്തിലുള്ള കർമണിപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായ ഭൂതകാല ആഖ്യാനമായി നൽകി; ക്രൂശിക്കലെന്ന അർഥം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: σὺν αὐτῷ
  choice: അവനോടൊപ്പം
  rationale: σύν എന്ന പദത്തിന്റെ സഹവർത്തിത്വാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: δύο λῃσταί
  choice: രണ്ടു കൊള്ളക്കാർ
  rationale: λῃστής സാധാരണയായി അക്രമം പ്രയോഗിക്കുന്ന കൊള്ളക്കാരനെയോ കവർച്ചക്കാരനെയോ സൂചിപ്പിക്കുന്നു; രാഷ്ട്രീയ കലാപകാരി എന്ന കൂടുതൽ നിർദിഷ്ടമായ അർഥം വാക്യത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: εἷς ἐκ δεξιῶν καὶ εἷς ἐξ εὐωνύμων
  choice: ഒരാളെ വലത്തും മറ്റെയാളെ ഇടത്തും
  rationale: വലതുവശത്തും ഇടതുവശത്തുമുള്ള സ്ഥാനവ്യത്യാസം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; ആവർത്തനം ഒഴിവാക്കിയിട്ടും അർഥം പൂർണമായി നിലനിൽക്കുന്നു.
theological_decisions:
- issue: λῃσταί എന്നവരുടെ തിരിച്ചറിയൽ
  choice: കൊള്ളക്കാർ
  alternative: കവർച്ചക്കാർ; ആയുധധാരികളായ കൊള്ളക്കാർ; കലാപകാരികൾ
  rationale: ഗ്രീക്ക് പദം അക്രമാസക്തരായ കൊള്ളക്കാരെയോ കവർച്ചക്കാരെയോ സൂചിപ്പിക്കാം; ചില സാഹചര്യങ്ങളിൽ കലാപപ്രവർത്തനവുമായി അർഥപരമായ മേളനമുണ്ടാകാമെങ്കിലും ഈ വാക്യം മാത്രം രാഷ്ട്രീയമായ തിരിച്ചറിയൽ നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ക്രൂശിച്ചു’ എന്ന പ്രചാരത്തിലുള്ള ബൈബിൾപദം നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട പദത്തിനു പിന്നാലെയല്ല, വാക്യാവസാനത്താണ് നൽകിയിരിക്കുന്നത്; അത് മുഴുവൻ വാക്യത്തിലെ ‘കൊള്ളക്കാർ’ എന്ന പദത്തെ വിശദീകരിക്കുന്നു.
