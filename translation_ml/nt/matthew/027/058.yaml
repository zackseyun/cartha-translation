source:
  edition: SBLGNT
  text: οὗτος προσελθὼν τῷ Πιλάτῳ ᾐτήσατο τὸ σῶμα τοῦ Ἰησοῦ. τότε ὁ Πιλᾶτος ἐκέλευσεν ⸀ἀποδοθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/058.yaml
  text: He went to Pilate and asked for the body of Jesus[a]. Then Pilate ordered it to be given to him.
translation:
  language: ml
  text: അവൻ പീലാത്തോസിന്റെ അടുക്കൽ ചെന്ന് യേശുവിന്റെ ശരീരം ചോദിച്ചു. അപ്പോൾ പീലാത്തോസ് അത് കൊടുക്കാൻ[a] കല്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കൈമാറിക്കൊടുക്കാൻ.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് ക്രിയയ്ക്ക് അടുത്ത അർഥങ്ങളിലുള്ള പല പരിഭാഷകളും സാധ്യമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: അവൻ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ അരിമഥ്യക്കാരനായ യോസേഫിനെയാണ് ഈ നിർദേശസർവനാമം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ സ്വാഭാവികമായ തുടർവിവരണത്തിൽ ‘അവൻ’ യോജിക്കുന്നു.
- source_word: προσελθὼν
  choice: അടുക്കൽ ചെന്ന്
  rationale: പീലാത്തോസിന്റെ സമീപത്തേക്കു ചെന്ന മുൻപ്രവൃത്തിയെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ᾐτήσατο
  choice: ചോദിച്ചു
  rationale: ഇവിടെ αἰτέω ഒരു വസ്തു ആവശ്യപ്പെടുക എന്ന അർഥത്തിലാണ്; ‘ശരീരം ചോദിച്ചു’ എന്ന പ്രയോഗം അഭ്യർഥനയുടെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: σῶμα
  choice: ശരീരം
  rationale: മരണപ്പെട്ട യേശുവിന്റെ ദേഹത്തെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിലും, മൂലത്തിലെ സാധാരണ പദത്തിന്റെ മാന്യതയും വ്യാപ്തിയും ‘ശരീരം’ നിലനിർത്തുന്നു.
- source_word: τότε
  choice: അപ്പോൾ
  rationale: തുടർന്നുണ്ടായ സംഭവത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ ആഖ്യാനബന്ധകമാണ്.
- source_word: ἐκέλευσεν
  choice: കല്പിച്ചു
  rationale: അധികാരപൂർവമായ ഉത്തരവിനെ സൂചിപ്പിക്കുന്ന κελεύω എന്ന പദത്തിന് ഈ ഭരണസന്ദർഭത്തിൽ യോജിച്ച, മാന്യമായ മലയാളരൂപം.
- source_word: ἀποδοθῆναι
  choice: കൊടുക്കാൻ
  rationale: ഈ കർമണി അനന്തക്രിയ ശരീരം മറ്റൊരാൾക്ക് നൽകുകയോ കൈമാറുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. മൂലത്തിൽ സ്വീകർത്താവിനെ തുറന്നു പറയാത്തതിനാൽ മലയാളത്തിലും അത് ചേർത്തിട്ടില്ല.
