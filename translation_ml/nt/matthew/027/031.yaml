reference: Matthew 27:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὅτε ἐνέπαιξαν αὐτῷ, ἐξέδυσαν αὐτὸν τὴν χλαμύδα καὶ ἐνέδυσαν αὐτὸν τὰ ἱμάτια αὐτοῦ καὶ ἀπήγαγον αὐτὸν εἰς τὸ σταυρῶσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/031.yaml
  text: And when they had mocked him[a], they stripped the cloak off him and put his own clothes on him, and led him away to crucify him.
translation:
  language: ml
  text: അവർ അവനെ പരിഹസിച്ചുകഴിഞ്ഞപ്പോൾ, ആ മേലങ്കി[a] അവന്റെ ദേഹത്തുനിന്ന് അഴിച്ചുമാറ്റി, അവന്റെ സ്വന്തം വസ്ത്രങ്ങൾ ധരിപ്പിച്ചു. പിന്നെ അവനെ ക്രൂശിക്കാനായി കൊണ്ടുപോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പുറംവസ്ത്രം.’ ഗ്രീക്കിലെ χλαμύς സാധാരണയായി ഒരു മേലങ്കിയെയോ പുറംവസ്ത്രത്തെയോ സൂചിപ്പിക്കുന്നു; ഈ സന്ദർഭത്തിൽ യേശുവിനെ വ്യാജരാജാവായി അവതരിപ്പിക്കാൻ ധരിപ്പിച്ച വസ്ത്രമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέπαιξαν
  choice: പരിഹസിച്ചുകഴിഞ്ഞപ്പോൾ
  rationale: ക്രൂരവും നിന്ദാപരവുമായ പരിഹാസമാണ് ക്രിയ സൂചിപ്പിക്കുന്നത്. ὅτε ചേർന്ന കാലവാക്യത്തിന്റെ പൂർത്തിയായ പ്രവൃത്തിയും തുടർന്നുള്ള സംഭവക്രമവും സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: χλαμύδα
  choice: മേലങ്കി
  rationale: χλαμύς സാധാരണയായി ശരീരത്തിനു മുകളിൽ ധരിക്കുന്ന പുറംവസ്ത്രത്തെയോ മേലങ്കിയെയോ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ ഇത് യേശുവിനെ വ്യാജരാജാവായി അവതരിപ്പിക്കാൻ ധരിപ്പിച്ച വസ്ത്രമാണ്. മൂലപദം നിർബന്ധമാക്കാത്ത ഔദ്യോഗിക രാജവസ്ത്രത്തിന്റെ ആശയം ഒഴിവാക്കുന്നു.
- source_word: ἐξέδυσαν αὐτὸν τὴν χλαμύδα
  choice: ആ മേലങ്കി അവന്റെ ദേഹത്തുനിന്ന് അഴിച്ചുമാറ്റി
  rationale: ἐκδύω വസ്ത്രം ഊരുകയോ അഴിച്ചുമാറ്റുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായി വസ്ത്രം അവനിൽനിന്ന് നീക്കിയതിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: ἐνέδυσαν αὐτὸν τὰ ἱμάτια αὐτοῦ
  choice: അവന്റെ സ്വന്തം വസ്ത്രങ്ങൾ ധരിപ്പിച്ചു
  rationale: ἐνδύω മറ്റൊരാളെ വസ്ത്രം ധരിപ്പിക്കുന്ന പ്രവൃത്തിയാണ്; αὐτοῦ വ്യക്തമാക്കുന്ന ഉടമസ്ഥതയും നേരത്തെ നീക്കിയ പരിഹാസവസ്ത്രത്തോടുള്ള വൈരുധ്യവും ‘സ്വന്തം’ എന്ന പദം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἱμάτια
  choice: വസ്ത്രങ്ങൾ
  rationale: ἱμάτια എന്ന പൊതുവായ ബഹുവചനപദത്തിന് ആധുനിക മാനകമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ തത്തുല്യപദമാണ്.
- source_word: ἀπήγαγον
  choice: കൊണ്ടുപോയി
  rationale: തടവുകാരനെ കാവലോടെ മറ്റൊരു സ്ഥലത്തേക്ക് നയിച്ചുകൊണ്ടുപോകുന്ന പ്രവൃത്തി സന്ദർഭോചിതവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: εἰς τὸ σταυρῶσαι
  choice: ക്രൂശിക്കാനായി
  rationale: εἰς ചേർന്ന articular infinitive ഉദ്ദേശ്യം പ്രകടിപ്പിക്കുന്നു; അവനെ കൊണ്ടുപോയതിന്റെ ലക്ഷ്യം നേരിട്ട് വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. മൂലവാക്യത്തിലെ സംഭവക്രമം നിലനിർത്തിക്കൊണ്ട് വായനാസൗകര്യത്തിനായി അവസാന ഏകോപിത വാക്യം രണ്ടായി തിരിച്ചു. ഇംഗ്ലീഷ് consultation layer-ൽ പരിഹാസക്രിയയ്ക്കു പിന്നാലെ വന്നിരുന്ന അടിക്കുറിപ്പ് ചിഹ്നം അടിക്കുറിപ്പിന്റെ യഥാർഥ വിഷയമായ χλαμύδα (‘മേലങ്കി’) എന്ന പദത്തിനു പിന്നാലെ സ്ഥാപിച്ചു.
