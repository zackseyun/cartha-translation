  text: And those passing by were blaspheming him[a], shaking their heads[b],
translation:
  language: ml
  text: അതുവഴി കടന്നുപോകുന്നവർ തല കുലുക്കിക്കൊണ്ട്[b] അവനെ ദൂഷിച്ചുപറഞ്ഞുകൊണ്ടിരുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവനെ നിന്ദിച്ചുകൊണ്ടിരുന്നു’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്ക് ക്രിയയ്ക്ക് ദൈവത്തിനെതിരായ ദൂഷണം മാത്രമല്ല, ഒരാളെ അധിക്ഷേപിക്കുകയോ അപകീർത്തിപ്പെടുത്തുകയോ ചെയ്യുക എന്ന അർഥവും വരാം.
    reason: lexical_alternative
  - marker: b
    text: ഇത് അവജ്ഞയുടെയോ പരിഹാസത്തിന്റെയോ ആംഗ്യമാണ്; സങ്കീർത്തനം 22:7 താരതമ്യം ചെയ്യുക.
    reason: cross_reference
lexical_decisions:
- source_word: οἱ δὲ
  choice: അതുവഴി … അവർ
  rationale: δέ ഇവിടെ ശക്തമായ വിരോധമല്ല, കഥയുടെ തുടർച്ച സൂചിപ്പിക്കുന്ന മൃദുവായ ബന്ധകമാണ്. മലയാളത്തിൽ പ്രത്യേക ബന്ധകപദം ചേർക്കാതെ വാക്യപ്രവാഹത്തിലൂടെ അത് സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; നിർദേശക കൃത്തിന്റെ നാമപ്രയോഗം ‘…വർ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: παραπορευόμενοι
  choice: കടന്നുപോകുന്നവർ
  rationale: വർത്തമാനകാല മധ്യ കൃതന്തം ക്രൂശീകരണസ്ഥലത്തിനരികിലൂടെ പോകുന്ന ആളുകളെ സൂചിപ്പിക്കുന്നു. ‘കടന്നുപോകുന്നവർ’ പ്രവൃത്തി നടന്നുകൊണ്ടിരിക്കുന്ന ഭാവവും നാമപ്രയോഗവും സ്വാഭാവികമായി സൂക്ഷിക്കുന്നു.
- source_word: ἐβλασφήμουν
  choice: ദൂഷിച്ചുപറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം ആവർത്തിച്ചോ തുടർന്നോ നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘കൊണ്ടിരുന്നു’ ഉപയോഗിച്ചു. βλασφημέω ദൈവദൂഷണം മാത്രമല്ല, ഒരാളെ അധിക്ഷേപിക്കുകയും അപകീർത്തിപ്പെടുത്തുകയും ചെയ്യുന്നതും സൂചിപ്പിക്കാം; ‘ദൂഷിച്ചുപറയുക’ അതിന്റെ ശക്തി ‘പരിഹസിക്കുക’ എന്നതിനെക്കാൾ നന്നായി നിലനിർത്തുന്നു.
- source_word: αὐτὸν
  choice: അവനെ
  rationale: യേശുവിനെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള കർമസർവനാമം.
- source_word: κινοῦντες
  choice: കുലുക്കിക്കൊണ്ട്
  rationale: മുഖ്യപ്രവൃത്തിയോടൊപ്പം നടന്ന പരിഹാസസൂചകമായ ചലനം സമകാലിക കൃതന്തരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: τὰς κεφαλὰς αὐτῶν
  choice: തല
  rationale: ഗ്രീക്കിൽ ബഹുവചനമാണെങ്കിലും, ഓരോരുത്തരും സ്വന്തം തല കുലുക്കുന്നതിനെ മലയാളത്തിൽ ‘തല കുലുക്കുക’ എന്ന ഏകവചനപ്രയോഗം കൂടുതൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; അർഥം നഷ്ടപ്പെടുന്നില്ല.
theological_decisions:
- issue: യേശുവിനെ ലക്ഷ്യമാക്കിയ βλασφημέω എന്ന പദത്തിന്റെ അർഥശക്തി
  choice: മുഖ്യവാചകത്തിൽ ‘ദൂഷിച്ചുപറഞ്ഞുകൊണ്ടിരുന്നു’ എന്ന് നൽകുക
  alternative: ‘നിന്ദിച്ചുകൊണ്ടിരുന്നു’ അഥവാ ‘അധിക്ഷേപിച്ചുകൊണ്ടിരുന്നു’
  rationale: പദം സാധാരണ പരിഹാസത്തേക്കാൾ ശക്തമായ അധിക്ഷേപം സൂചിപ്പിക്കുന്നു. എന്നാൽ മലയാളത്തിലെ ‘ദൈവദൂഷണം’ എന്ന് നൽകിയാൽ ദൈവത്തിനെതിരായ വാക്കുകൾ എന്ന സങ്കുചിത അർഥം വിവർത്തനം തന്നെ നിർബന്ധിച്ചേക്കാം. ‘ദൂഷിച്ചുപറയുക’ ശക്തി നിലനിർത്തുകയും യേശുവിന്റെ വ്യക്തിത്വത്തെക്കുറിച്ചുള്ള ദൈവശാസ്ത്രനിഗമനം വിവർത്തനത്തിലൂടെ അധികമായി ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന ശൈലി. അപൂർണ ഭൂതകാലത്തിന്റെ തുടർച്ചാഭാവം ‘ദൂഷിച്ചുപറഞ്ഞുകൊണ്ടിരുന്നു’ എന്നതിലൂടെ സൂക്ഷിച്ചു. ‘തല കുലുക്കുക’ എന്ന സ്വാഭാവിക മലയാളപ്രയോഗം ഉപയോഗിച്ചു.
