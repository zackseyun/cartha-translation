  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγοντες· Κύριε, ἐμνήσθημεν ὅτι ἐκεῖνος ὁ πλάνος εἶπεν ἔτι ζῶν· Μετὰ τρεῖς ἡμέρας ἐγείρομαι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/063.yaml
  text: saying[a], “Lord, we remember that that deceiver said while he was still alive[b], ‘After three days I rise.’”
translation:
  language: ml
  text: 'അവർ പറഞ്ഞു: “യജമാനനേ, ആ വഞ്ചകൻ ജീവിച്ചിരിക്കുമ്പോൾ, ‘മൂന്നു ദിവസത്തിനുശേഷം ഞാൻ ഉയിർത്തെഴുന്നേൽക്കുന്നു’[a] എന്നു പറഞ്ഞതായി ഞങ്ങൾ ഓർക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മൂന്നു ദിവസത്തിനുശേഷം ഞാൻ ഉയിർത്തെഴുന്നേൽക്കും” എന്നും “മൂന്നു ദിവസത്തിനുശേഷം ഞാൻ ഉയിർപ്പിക്കപ്പെടും” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിൽ വർത്തമാനകാല മധ്യമ/കർമണി രൂപമാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγοντες
  choice: അവർ പറഞ്ഞു
  rationale: വർത്തമാന കൃുദന്തരൂപം മുൻവാക്യത്തിലെ പ്രവൃത്തിയുമായി ബന്ധിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യബന്ധത്തിനായി പരിമിതക്രിയയായി നൽകി.
- source_word: Κύριε
  choice: യജമാനനേ
  rationale: പീലാത്തോസിനോടുള്ള ആദരപൂർവമായ സംബോധനമാണ്; ഇവിടെ ദൈവിക പദവി സൂചിപ്പിക്കാതെ κύριος എന്നതിന്റെ സന്ദർഭോചിതമായ അർഥം നൽകുന്നു.
- source_word: ἐμνήσθημεν
  choice: ഞങ്ങൾ ഓർക്കുന്നു
  rationale: ഗ്രീക്കിൽ ഭൂതകാലരൂപമാണെങ്കിലും ഓർമയുടെ ഇപ്പോഴത്തെ പ്രസക്തിയാണ് നേരിട്ടുള്ള സംഭാഷണത്തിൽ പ്രധാനമായത്; സ്വാഭാവിക മലയാളത്തിനായി വർത്തമാനരൂപം ഉപയോഗിച്ചു.
- source_word: ἐκεῖνος ὁ πλάνος
  choice: ആ വഞ്ചകൻ
  rationale: ἐκεῖνος എന്നതിന്റെ അകലം പാലിക്കുന്ന, നിന്ദാസൂചകമായ ഭാവവും πλάνος എന്നതിന്റെ ‘വഴിതെറ്റിക്കുന്നവൻ/വഞ്ചിക്കുന്നവൻ’ എന്ന അർഥവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἔτι ζῶν
  choice: ജീവിച്ചിരുന്നപ്പോൾ
  rationale: അവൻ മരിക്കുന്നതിന് മുമ്പാണ് പ്രസ്താവന നടത്തിയതെന്ന സമയബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: Μετὰ τρεῖς ἡμέρας
  choice: മൂന്നു ദിവസത്തിനുശേഷം
  rationale: μετά + ദ്വിതീയാവിഭക്തിയുടെ സാധാരണ അർഥമായ ‘ശേഷം’ കൃത്യമായി നൽകുന്നു; ‘മൂന്നാം ദിവസം’ എന്ന സമാന്തര പ്രയോഗവുമായി ഒത്തുചേർക്കുന്നില്ല.
- source_word: ἐγείρομαι
  choice: ഞാൻ ഉയിർത്തെഴുന്നേൽക്കുന്നു
  rationale: ഗ്രീക്കിലെ വർത്തമാനരൂപം നിലനിർത്തുകയും പുനരുത്ഥാനസന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളക്രിയ ഉപയോഗിക്കുകയും ചെയ്യുന്നു; മധ്യമ/കർമണി രൂപത്തിന്റെ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ പുനരുത്ഥാനപ്രവചനത്തിലെ ἐγείρομαι എന്ന ക്രിയയുടെ രൂപവും വാച്യവും
  choice: മൂന്നു ദിവസത്തിനുശേഷം ഞാൻ ഉയിർത്തെഴുന്നേൽക്കുന്നു
  alternative: മൂന്നു ദിവസത്തിനുശേഷം ഞാൻ ഉയിർത്തെഴുന്നേൽക്കും / ഞാൻ ഉയിർപ്പിക്കപ്പെടും
  rationale: മൂലപാഠത്തിലെ വർത്തമാനരൂപത്തെ ഭാവികാലമാക്കി നിശ്ശബ്ദമായി ലളിതീകരിക്കാതെയും മധ്യമ-കർമണി രൂപത്തിലെ യഥാർഥ അവ്യക്തത ഇല്ലാതാക്കാതെയും മുഖ്യപാഠവും അടിക്കുറിപ്പും ചേർന്ന് അർഥപരിധി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ നേരിട്ടുള്ള സംഭാഷണം. പീലാത്തോസിനുള്ള സംബോധനയിൽ ദൈവിക അർഥം അനാവശ്യമായി ചുമത്താതിരിക്കാൻ ‘യജമാനനേ’ ഉപയോഗിച്ചു; വിരോധികളുടെ നിന്ദാഭാവം ‘ആ വഞ്ചകൻ’ എന്നതിൽ നിലനിർത്തി.
