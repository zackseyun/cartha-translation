id: MAT.27.43
reference: Matthew 27:43
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πέποιθεν ἐπὶ τὸν θεόν, ῥυσάσθω ⸀νῦν εἰ θέλει αὐτόν· εἶπεν γὰρ ὅτι Θεοῦ εἰμι υἱός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/043.yaml
  text: He has trusted in God[a]; let God rescue him now, if he wants him, for he said[b], ‘I am the Son of God.’
translation:
  language: ml
  text: അവൻ ദൈവത്തിൽ ആശ്രയിച്ചിരിക്കുന്നു; ദൈവത്തിന് അവനെ വേണമെങ്കിൽ, ദൈവം ഇപ്പോൾ അവനെ വിടുവിക്കട്ടെ[a]. കാരണം, ‘ഞാൻ ദൈവപുത്രനാണ്’ എന്ന് അവൻ പറഞ്ഞല്ലോ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “അവനിൽ പ്രസാദമുണ്ടെങ്കിൽ.” ഈ വാക്കുകൾ സങ്കീർത്തനം 22:8-നെ അനുസ്മരിപ്പിക്കുന്നു; അവിടെ ദൈവത്തിന്റെ പ്രസാദം എന്ന അർഥനിറം ശക്തമാണ്.'
    reason: alternative_reading
  - marker: b
    text: ഈ പരിഹാസവാക്കുകൾ സങ്കീർത്തനം 22:8-നോട് അടുത്ത സാമ്യമുള്ളവയാണ്; അതുവഴി യേശുവിനെ ആ സങ്കീർത്തനത്തിലെ നീതിമാനായ കഷ്ടം അനുഭവിക്കുന്നവനുമായി ബന്ധിപ്പിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: πέποιθεν ἐπὶ τὸν θεόν
  choice: ദൈവത്തിൽ ആശ്രയിച്ചിരിക്കുന്നു
  rationale: പൂർണകാലരൂപം മുൻപ് വെച്ച ആശ്രയത്തിന്റെ ഫലമായി തുടരുന്ന ഉറച്ച നിലയെ സൂചിപ്പിക്കുന്നു. ‘ആശ്രയിച്ചിരിക്കുന്നു’ ഈ നിലനിൽക്കുന്ന ഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ῥυσάσθω νῦν
  choice: ഇപ്പോൾ അവനെ വിടുവിക്കട്ടെ
  rationale: ῥύομαι അപകടത്തിൽനിന്നോ കഷ്ടതയിൽനിന്നോ രക്ഷിച്ചെടുക്കുക എന്ന അർഥമുള്ളതാണ്; പരിഹാസപരമായ വെല്ലുവിളിയുടെ സന്ദർഭത്തിൽ ‘വിടുവിക്കുക’ യോജിക്കുന്നു. νῦν എന്നതിന്റെ അടിയന്തരത ‘ഇപ്പോൾ’ നിലനിർത്തുന്നു.
- source_word: εἰ θέλει αὐτόν
  choice: ദൈവത്തിന് അവനെ വേണമെങ്കിൽ
  rationale: θέλω എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘വേണമെങ്കിൽ’ നിലനിർത്തുന്നു. സങ്കീർത്തനം 22:8-ലെ അനുരണനം മൂലം ‘അവനിൽ പ്രസാദമുണ്ടെങ്കിൽ’ എന്ന അർഥനിറവും സാധ്യമാണ്; അത് അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: εἶπεν γὰρ
  choice: കാരണം ... അവൻ പറഞ്ഞല്ലോ
  rationale: γάρ നൽകുന്ന കാരണബന്ധം ‘കാരണം’ വ്യക്തമാക്കുന്നു; പരിഹാസികൾ യേശുവിന്റെ പ്രസ്താവന ചൂണ്ടിക്കാണിക്കുന്ന ഭാവം ‘പറഞ്ഞല്ലോ’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: Θεοῦ εἰμι υἱός
  choice: ഞാൻ ദൈവപുത്രനാണ്
  rationale: മത്തായിയുടെ സന്ദർഭത്തിൽ ഇത് പൊതുവായ ദൈവബന്ധമല്ല, ക്രിസ്തുവിനെക്കുറിച്ചുള്ള അംഗീകൃത സ്ഥാനനാമമാണ്. ‘ദൈവപുത്രൻ’ ആ സ്ഥാനനാമത്തിന്റെ ശക്തി ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: Θεοῦ εἰμι υἱός എന്ന ക്രിസ്തുശാസ്ത്രപരമായ പ്രയോഗം
  choice: ഞാൻ ദൈവപുത്രനാണ്
  alternative: ഞാൻ ദൈവത്തിന്റെ ഒരു പുത്രനാണ്
  rationale: ഗ്രീക്കിൽ υἱός-നു നിർദേശക ഉപപദമില്ലെങ്കിലും വിധേയപദഘടനയും മത്തായിയുടെ കഥാസന്ദർഭവും അനിശ്ചിതമായ ‘ഒരു പുത്രൻ’ എന്നതിനെക്കാൾ സ്ഥാനനാമപരമായ അർഥത്തെ പിന്തുണയ്ക്കുന്നു.
- issue: εἰ θέλει αὐτόν എന്നതിലെ θέλω-യുടെ അർഥം
  choice: ദൈവത്തിന് അവനെ വേണമെങ്കിൽ
  alternative: ദൈവത്തിന് അവനിൽ പ്രസാദമുണ്ടെങ്കിൽ
  rationale: പ്രധാനപാഠം θέλω-യുടെ സാധാരണ അർഥം സുതാര്യമായി നിലനിർത്തുന്നു. സങ്കീർത്തനം 22:8-ലേക്കുള്ള സൂചന മൂലമുള്ള ‘പ്രസാദം’ എന്ന അർഥനിറം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: ῥυσάσθω എന്ന ക്രിയയുടെ പരോക്ഷ കർത്താവ്
  choice: ദൈവം എന്ന കർത്താവിനെ മലയാള വാക്യത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുക
  alternative: അവനെ ഇപ്പോൾ വിടുവിക്കട്ടെ
  rationale: മുൻപുള്ള τὸν θεόν തന്നെയാണ് നിർദേശത്തിന്റെ മനസ്സിലാക്കപ്പെടുന്ന കർത്താവ്. ‘ദൈവത്തിന്’ എന്ന രൂപം തുടർന്നുള്ള ‘വിടുവിക്കട്ടെ’ എന്ന ക്രിയയോടും ബന്ധപ്പെട്ട് മലയാളത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. ‘ആശ്രയിച്ചിരിക്കുന്നു’ പൂർണകാലത്തിന്റെ നിലനിൽക്കുന്ന ഫലം സൂക്ഷിക്കുന്നു; ‘വിടുവിക്കട്ടെ’ ബൈബിൾസന്ദർഭത്തിന് യോജിച്ചെങ്കിലും അത്യന്തം പുരാതനമല്ലാത്ത പ്രയോഗമാണ്. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
