    text: അഥവാ, “ഒരുക്കദിവസത്തിനുശേഷം.” ഗ്രീക്ക് പദം ശബ്ബത്തിനു മുമ്പുള്ള ഒരുക്കദിവസത്തെ സൂചിപ്പിക്കാം; അതിനെ “വെള്ളിയാഴ്ച” എന്നു വിവർത്തനം ചെയ്യുന്നത് മൂലപാഠം ആവശ്യപ്പെടുന്നതിലധികം വ്യാഖ്യാനാത്മകമായിരിക്കും.
