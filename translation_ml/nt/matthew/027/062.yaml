  text: അടുത്ത ദിവസം[a]—അതായത്, ഒരുക്കദിവസത്തിനുശേഷം—മുഖ്യപുരോഹിതന്മാരും പരീശന്മാരും പീലാത്തൊസിന്റെ അടുക്കൽ ഒരുമിച്ചുകൂടി.
