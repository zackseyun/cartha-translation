lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: അടുത്ത ദിവസം
  rationale: കാലക്രമത്തിലെ അടുത്ത ദിവസത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു. δέയുടെ നേരിയ ബന്ധകഭാവം മലയാളത്തിൽ പ്രത്യേകം പദമാക്കാതെ വാക്യക്രമത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: ἥτις ἐστὶν μετὰ τὴν παρασκευήν
  choice: അതായത്, ഒരുക്കദിവസത്തിനു ശേഷമുള്ള ദിവസം
  rationale: ἥτις ഇവിടെ വിശദീകരണസ്വഭാവമുള്ള ഉപവാക്യം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘അതായത്’ ചേർക്കുന്നത് ആ വിശദീകരണബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: παρασκευήν
  choice: ഒരുക്കദിവസം
  rationale: ശബ്ബത്തിനു മുമ്പുള്ള ഒരുക്കദിവസത്തെ സൂചിപ്പിക്കുന്ന യെഹൂദ കലണ്ടർപ്രയോഗം നിലനിർത്തുന്നു; ‘വെള്ളിയാഴ്ച’ എന്നു വിവർത്തനം ചെയ്യുന്നത് മൂലപാഠത്തേക്കാൾ വ്യാഖ്യാനാത്മകമാകും.
- source_word: συνήχθησαν
  choice: ഒരുമിച്ചുകൂടി
  rationale: പ്രയോഗത്തിലെ അകർമകമായ ‘കൂടിവന്നു/ഒന്നിച്ചുകൂടി’ എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: οἱ ἀρχιερεῖς
  choice: മുഖ്യപുരോഹിതന്മാർ
  rationale: ഒരേയൊരു മഹാപുരോഹിതനെ അല്ല, പ്രമുഖ പുരോഹിതാധികാരികളെയാണ് ബഹുവചനം സൂചിപ്പിക്കുന്നത്.
- source_word: οἱ Φαρισαῖοι
  choice: പരീശന്മാർ
  rationale: യെഹൂദ മതവിഭാഗത്തിന്റെ മലയാളത്തിൽ സ്ഥാപിതമായ പേരുരൂപം.
- source_word: πρὸς Πιλᾶτον
  choice: പീലാത്തൊസിന്റെ അടുക്കൽ
  rationale: πρός ഇവിടെ ഒരാളുടെ അടുക്കലേക്കുള്ള കൂടിവരവ് സൂചിപ്പിക്കുന്നു. ‘മുമ്പാകെ’ എന്ന നിയമപരമായ ഭാവം നിർബന്ധമായി ചുമത്താതെ മൂലത്തിലെ ദിശാസംബന്ധം നിലനിർത്തുന്നു.
- source_word: Πιλᾶτον
  choice: പീലാത്തൊസ്
  rationale: Πιλᾶτος എന്ന വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം.
