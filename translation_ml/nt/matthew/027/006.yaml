id: MAT.27.6
reference: Matthew 27:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ ἀρχιερεῖς λαβόντες τὰ ἀργύρια εἶπαν· Οὐκ ἔξεστιν βαλεῖν αὐτὰ εἰς τὸν κορβανᾶν, ἐπεὶ τιμὴ αἵματός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/006.yaml
  text: But the chief priests[a], taking the silver pieces, said, “It is not lawful to put them into the temple treasury[b], since they are the price of blood.”
translation:
  language: ml
  text: 'എന്നാൽ മുഖ്യപുരോഹിതന്മാർ ആ വെള്ളിപ്പണം എടുത്ത് പറഞ്ഞു: “അത് ദൈവാലയഭണ്ഡാരത്തിൽ[a] ഇടുന്നത് നിയമാനുസൃതമല്ല; കാരണം ഈ പണം രക്തത്തിന്റെ വിലയാണ്[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഗ്രീക്ക്: കോർബാൻ; ദൈവാലയത്തിലെ വിശുദ്ധഭണ്ഡാരത്തെയോ വിശുദ്ധനിധിയെയോ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “രക്തപ്പണം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιερεῖς
  choice: മുഖ്യപുരോഹിതന്മാർ
  rationale: മുതിർന്ന പുരോഹിതാധികാരികളെ സൂചിപ്പിക്കുന്ന ബഹുവചനം; സുവിശേഷസന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവികവും മാന്യവുമായ മലയാളപ്രയോഗം.
- source_word: λαβόντες
  choice: എടുത്തിട്ട്
  rationale: പ്രധാനക്രിയയോടു ചേർന്ന മുൻകൃത്യത്തെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; സംഭവക്രമം അനാവശ്യമായി കടുപ്പിക്കുന്നില്ല.
- source_word: τὰ ἀργύρια
  choice: ആ വെള്ളിനാണയങ്ങൾ
  rationale: മുൻസന്ദർഭത്തിൽ പരാമർശിച്ച വെള്ളിപ്പണം തന്നെയാണെന്ന് സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിൽ പറയാത്ത പ്രത്യേക നാണയയിനം നിർണ്ണയിക്കാതെ അതിന്റെ മൂർത്തമായ പണസ്വഭാവം നിലനിർത്തുന്നു.
- source_word: Οὐκ ἔξεστιν
  choice: നിയമാനുസൃതമല്ല
  rationale: മതനിയമപരമായ അനുമതിയുടെയും ഔചിത്യത്തിന്റെയും അഭാവം സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: βαλεῖν
  choice: ഇടുന്നത്
  rationale: ഭണ്ഡാരസന്ദർഭത്തിൽ βάλλω എന്നതിന്റെ സ്വാഭാവിക അർഥം; ‘എറിയുക’ എന്ന അനാവശ്യ ദൃശ്യത ഒഴിവാക്കുന്നു.
- source_word: κορβανᾶν
  choice: ദൈവാലയഭണ്ഡാരം
  rationale: വിശുദ്ധ ആവശ്യങ്ങൾക്കുള്ള ദൈവാലയനിധിയെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി അറിയിക്കുന്നു; മൂലപദം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἐπεὶ
  choice: കാരണം
  rationale: വിലക്കിന്റെ കാരണം നേരിട്ടും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
- source_word: τιμὴ αἵματός
  choice: രക്തത്തിന്റെ വില
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തവും ഉദ്ദേശപൂർവം കടുപ്പമുള്ളതുമായ പ്രയോഗം അടുത്തായി നിലനിർത്തുന്നു; ‘രക്തപ്പണം’ എന്ന വ്യാഖ്യാനാത്മക സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: κορβανᾶν എന്ന ദൈവാലയനിധിസംബന്ധിയായ പദം എങ്ങനെ അവതരിപ്പിക്കണം
  choice: ദൈവാലയഭണ്ഡാരം
  alternative: കോർബാൻ; വിശുദ്ധനിധി
  rationale: ഇവിടെ പ്രാധാന്യം ദൈവാലയത്തിലെ വിശുദ്ധധനവും അതിൽ പണം ചേർക്കുന്നതിന്റെ മതനിയമപരമായ ഔചിത്യവുമാണ്. അർഥം വിവർത്തനം ചെയ്യുന്നത് വ്യക്തത നൽകുന്നു; പദത്തിന്റെ സാംസ്കാരിക രൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: τιμὴ αἵματός എന്ന പ്രയോഗത്തിലെ അർഥവ്യാപ്തി
  choice: രക്തത്തിന്റെ വില
  alternative: രക്തപ്പണം; രക്തച്ചൊരിച്ചിലിന്റെ വില
  rationale: മൂലവാക്യത്തിന്റെ രൂപവും അതിലെ നൈതിക സംഘർഷവും സംരക്ഷിക്കുന്നു; യൂദാസിന്റെ വഞ്ചനയ്ക്കു നൽകിയ പണമെന്ന സന്ദർഭാർഥം അതിരുകടന്ന് വിശദീകരിക്കാതെ ‘രക്തപ്പണം’ എന്ന സ്വാഭാവിക പര്യായം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. പുരോഹിതരുടെ മതനിയമപരമായ ഭാഷയും ‘രക്തത്തിന്റെ വില’ എന്ന മൂലത്തിലെ നൈതിക വൈരുധ്യവും നിലനിർത്തിയിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
