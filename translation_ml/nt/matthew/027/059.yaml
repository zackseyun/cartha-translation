  yaml_path: translation/nt/matthew/027/059.yaml
  text: And Joseph took the body and wrapped it in a clean linen cloth[b][a],
translation:
  language: ml
  text: യോസേഫ് ശരീരം എടുത്ത് വൃത്തിയുള്ള ഒരു ചണവസ്ത്രത്തിൽ പൊതിഞ്ഞു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സംസ്കാരത്തിനുള്ള വൃത്തിയുള്ള ഒരു ചണവസ്ത്രത്തിൽ പൊതിഞ്ഞു.’ ഗ്രീക്ക് പദം സംസ്കാരത്തിനുപയോഗിക്കുന്ന ചണവസ്ത്രത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: എടുത്ത്
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന ഏറിസ്റ്റ് കൃദന്തരൂപം. മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനശൈലിയിൽ ‘എടുത്ത് ... പൊതിഞ്ഞു’ എന്ന ക്രിയാശൃംഖല അതിന്റെ ക്രമം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: σῶμα
  choice: ശരീരം
  rationale: ഗ്രീക്കിൽ വ്യക്തമായ ഉടമസ്ഥസൂചകമില്ല; അതിനാൽ സന്ദർഭത്തിൽ യേശുവിന്റെ ശരീരമാണെന്ന് വ്യക്തമെങ്കിലും ‘അവന്റെ ശരീരം’ എന്നു ചേർക്കാതെ മൂലരൂപത്തോട് അടുത്തുനിൽക്കുന്നു.
- source_word: ἐνετύλιξεν
  choice: പൊതിഞ്ഞു
  rationale: ἐντυλίσσω എന്നത് ചുറ്റിപ്പൊതിയുക അഥവാ ആവരണം ചെയ്യുക എന്നർഥം നൽകുന്നു; സംസ്കാരസന്ദർഭത്തിൽ ‘പൊതിഞ്ഞു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: αὐτὸ
  choice: വാക്യത്തിൽ പ്രത്യേകം ആവർത്തിക്കാതെ ‘ശരീരം’ എന്ന കർമത്തിന്റെ തുടർച്ചയായി പ്രകടിപ്പിച്ചു
  rationale: നപുംസകലിംഗ ഏകവചന സർവനാമം σῶμα എന്ന പദത്തെ തിരിച്ചുസൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘അതിനെ’ എന്നു ആവർത്തിക്കുന്നത് കൃത്രിമമായി തോന്നുന്നതിനാൽ ക്രിയാശൃംഖലയിൽ അതേ കർമം സ്വാഭാവികമായി തുടരുന്നു.
- source_word: σινδόνι
  choice: ഒരു ചണവസ്ത്രത്തിൽ
  rationale: σινδών ചണനൂൽകൊണ്ടുള്ള തുണിയെയോ സംസ്കാരത്തിനുപയോഗിക്കുന്ന ചണവസ്ത്രത്തെയോ സൂചിപ്പിക്കാം. ‘ചണവസ്ത്രം’ വസ്തുവിനെ വ്യക്തമാക്കുകയും ‘കഫൻ’ എന്ന കൂടുതൽ പ്രത്യേക അർഥം മുഖ്യവാചകത്തിൽ നിർബന്ധിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: καθαρᾷ
  choice: വൃത്തിയുള്ള
  rationale: ഈ സംസ്കാരസന്ദർഭത്തിൽ καθαρός എന്നതിന്റെ സാധാരണ അർഥമായ ‘clean’ കൃത്യമായി നൽകുന്നു; ‘ശുദ്ധമായ’ എന്നത് അനാവശ്യമായ ആചാരപരമോ ദൈവശാസ്ത്രപരമോ ആയ സൂചന നൽകാം.
- source_word: καὶ ... ὁ Ἰωσὴφ
  choice: യോസേഫ്
  rationale: മുൻവാക്യത്തോടുള്ള καί എന്ന ബന്ധം മലയാളത്തിൽ വാക്യക്രമംകൊണ്ട് സ്വാഭാവികമായി പ്രകടമാകുന്നു; ‘അപ്പോൾ’ എന്നു ചേർത്താൽ മൂലത്തിൽ ഇല്ലാത്ത സമയവ്യാഖ്യാനം ശക്തമാകും.
