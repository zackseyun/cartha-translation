translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഗ്രീക്കിലെ കൃദന്തരൂപം സ്വാഭാവികമായ മലയാള ക്രിയാശൃംഖലയായി നൽകി. αὐτό എന്ന സർവനാമത്തിന്റെ വ്യാകരണബന്ധം മലയാളത്തിൽ അനാവശ്യമായി ‘അതിനെ’ എന്നു ആവർത്തിക്കാതെ സൂക്ഷിച്ചു; σινδών എന്ന പദത്തിന്റെ സംസ്കാരവസ്ത്രസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
