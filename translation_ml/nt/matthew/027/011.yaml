id: MAT.27.11
reference: Matthew 27:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς ⸀ἐστάθη ἔμπροσθεν τοῦ ἡγεμόνος· καὶ ἐπηρώτησεν αὐτὸν ὁ ἡγεμὼν λέγων· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων; ὁ δὲ Ἰησοῦς ⸀ἔφη· Σὺ λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/011.yaml
  text: Jesus stood before the governor[a], and the governor questioned him, saying, “Are you the King of the Jews?” And Jesus said[b], “You say so.”
translation:
  language: ml
  text: 'യേശു ഗവർണറുടെ മുമ്പിൽ നിന്നു. ഗവർണർ, “നീ യെഹൂദന്മാരുടെ[b] രാജാവാണോ?” എന്നു ചോദിച്ചു. യേശു പറഞ്ഞു: “നീ പറയുന്നു.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നീ അതു പറയുന്നു’ എന്നോ ‘നീ പറഞ്ഞതുപോലെതന്നെ’ എന്നോ പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിൽ യേശുവിന്റെ മറുപടി സംക്ഷിപ്തവും അല്പം അപൂർണോക്തിപരവുമാണ്.
    reason: alternative_reading
  - marker: b
    text: ‘യെഹൂദ്യപ്രദേശത്തുകാരുടെ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കുപദം പൊതുവായി യെഹൂദന്മാരെയോ ചില സന്ദർഭങ്ങളിൽ പ്രത്യേകിച്ച് യെഹൂദ്യപ്രദേശത്തുകാരെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐστάθη
  choice: നിന്നു
  rationale: സന്ദർഭത്തിൽ അകർമകമായ അർഥമാണ് സ്വാഭാവികം. ‘നിർത്തപ്പെട്ടു’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത കാരണപ്രയോഗം ചേർക്കും.
- source_word: ἔμπροσθεν
  choice: മുമ്പിൽ
  rationale: സ്ഥലപരമായ അർഥവും ഔദ്യോഗിക വിചാരണാസന്ദർഭവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἡγεμών / ἡγεμόνος
  choice: ഗവർണർ
  rationale: ഇവിടെ റോമൻ ഭരണപ്രതിനിധിയെയാണ് സൂചിപ്പിക്കുന്നത്. ആധുനിക വായനക്കാർക്ക് വ്യക്തവും ചരിത്രസന്ദർഭത്തിന് യോജിച്ചതുമായ പദമാണിത്.
- source_word: ἐπηρώτησεν
  choice: ചോദിച്ചു
  rationale: ഔദ്യോഗിക സാഹചര്യത്തിലെ ചോദ്യം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; ‘ചോദ്യംചെയ്തു’ എന്നത് ഗ്രീക്കിലുള്ളതിലധികം കടുപ്പമുള്ള ചോദ്യംചെയ്യൽ സൂചിപ്പിക്കാം.
- source_word: βασιλεὺς
  choice: രാജാവ്
  rationale: രാജകീയ പദവിയെ നേരിട്ട് സൂചിപ്പിക്കുന്ന സാധാരണവും കൃത്യവുമായ മലയാളപദം.
- source_word: τῶν Ἰουδαίων
  choice: യെഹൂദന്മാരുടെ
  rationale: ഈ രാഷ്ട്രീയ-ജനതാപരമായ കുറ്റാരോപണസന്ദർഭത്തിൽ വ്യാപകമായി മനസ്സിലാകുന്ന പരമ്പരാഗത അർഥം നൽകുന്നു; പ്രദേശവാസികളായ യെഹൂദ്യർ എന്ന അർഥവും പദത്തിന് ചില സന്ദർഭങ്ങളിൽ സാധ്യമാണ്.
- source_word: ἔφη
  choice: പറഞ്ഞു
  rationale: യേശുവിന്റെ മറുപടി അവതരിപ്പിക്കുന്ന ലളിതവും നേരിട്ടുള്ളതുമായ തുല്യപദം.
- source_word: Σὺ λέγεις
  choice: നീ പറയുന്നു
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തവും അപൂർണോക്തിസ്വഭാവമുള്ളതുമായ മറുപടി സ്ഥിരീകരണമോ നിഷേധമോ ആയി അതിരുകടന്ന് വ്യക്തമാക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: Σὺ λέγεις എന്ന യേശുവിന്റെ മറുപടിയുടെ സൂക്ഷ്മാർഥം
  choice: ‘നീ പറയുന്നു’ എന്ന പരോക്ഷവും നിയന്ത്രിതവുമായ മറുപടി
  alternative: ‘നീ പറഞ്ഞതുപോലെതന്നെ’ എന്ന കൂടുതൽ വ്യക്തമായ സ്ഥിരീകരണം
  rationale: യേശു പീലാത്തൊസിന്റെ രാഷ്ട്രീയ രൂപീകരണത്തെ തുറന്നുവെച്ച് നിഷേധിക്കുന്നില്ല; അതേസമയം അതേ രൂപീകരണത്തിൽ അവകാശവാദം നിർവ്യാജമായി ആവർത്തിക്കുന്നുമില്ല. മൂലത്തിലെ ഈ സംഘർഷവും സംക്ഷിപ്തതയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഗവർണർ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ഭരണപദമായി സ്വീകരിച്ചു. ഗ്രീക്കിലെ δέ വേറിട്ടൊരു ‘ഇപ്പോൾ’ പോലുള്ള കാലസൂചകമായി വിവർത്തനം ചെയ്തിട്ടില്ല; വാക്യക്രമം തന്നെ സന്ദർഭമാറ്റം വഹിക്കുന്നു. വായനാസൗകര്യത്തിനായി ആദ്യ ഗ്രീക്ക് വാക്യത്തിലെ ഏകോപനം മലയാളത്തിൽ രണ്ട് വാക്യങ്ങളാക്കി.
