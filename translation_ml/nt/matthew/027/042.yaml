id: MAT.27.42
reference: Matthew 27:42
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἄλλους ἔσωσεν, ἑαυτὸν οὐ δύναται σῶσαι· ⸀βασιλεὺς Ἰσραήλ ἐστιν, καταβάτω νῦν ἀπὸ τοῦ σταυροῦ καὶ πιστεύσομεν ἐπ’ ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/042.yaml
  text: He saved others; he cannot save himself. He is the King of Israel; let him come down now from the cross[a], and we will believe in him.
translation:
  language: ml
  text: “മറ്റുള്ളവരെ രക്ഷിച്ചു; തന്നെത്തന്നെ രക്ഷിക്കാൻ കഴിയുന്നില്ല. ഇവൻ ഇസ്രായേലിന്റെ രാജാവാണ്; ഇപ്പോൾ കുരിശിൽനിന്ന് ഇറങ്ങട്ടെ[a], ഞങ്ങൾ ഇവനിൽ വിശ്വസിക്കും.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “ഇവൻ ഇസ്രായേലിന്റെ രാജാവാണെങ്കിൽ, ഇപ്പോൾ കുരിശിൽനിന്ന് ഇറങ്ങട്ടെ; ഞങ്ങൾ ഇവനിൽ വിശ്വസിക്കും.” ചില ഇംഗ്ലീഷ് പരിഭാഷകൾ വ്യവസ്ഥാഭാവം ചേർത്ത് പരിഹാസം വ്യക്തമാക്കുന്നു; എന്നാൽ ഗ്രീക്ക് പാഠം ഈ പദവി നേരിട്ടാണ് പ്രസ്താവിക്കുന്നത്.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄλλους
  choice: മറ്റുള്ളവരെ
  rationale: കർമവിഭക്തിയിലുള്ള ബഹുവചന വിശേഷണം നാമമായി ഉപയോഗിച്ചിരിക്കുന്നു; ‘മറ്റുള്ളവരെ’ എന്നത് തന്നോടുള്ള പരിഹാസാത്മക വൈരുധ്യം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἔσωσεν
  choice: രക്ഷിച്ചു
  rationale: σῴζω എന്ന ക്രിയയുടെ അഓറിസ്റ്റ് രൂപം; വിടുതൽ, സൗഖ്യം, രക്ഷ എന്നീ അർഥവ്യാപ്തി ചുരുക്കാതെ സൂക്ഷിക്കുന്ന സാധാരണ മലയാളപദം.
- source_word: ἑαυτὸν
  choice: തന്നെത്താൻ
  rationale: പ്രതിഫലന സർവനാമത്തിന്റെ ഊന്നലും ‘മറ്റുള്ളവർ/താൻ’ എന്ന വൈരുധ്യവും വ്യക്തമാക്കുന്നു.
- source_word: οὐ δύναται σῶσαι
  choice: രക്ഷിക്കാൻ കഴിയുന്നില്ല
  rationale: δύναμαι + infinitive എന്ന ഘടനയുടെ സ്വാഭാവിക മലയാളരൂപം; പരിഹാസത്തിന്റെ നേരിട്ടുള്ള ശക്തി നിലനിർത്തുന്നു.
- source_word: βασιλεὺς Ἰσραήλ
  choice: ഇസ്രായേലിന്റെ രാജാവ്
  rationale: രാജകീയ പദവി നേരിട്ടുതന്നെ നൽകുന്നു; മൂലപാഠത്തിൽ ഇല്ലാത്ത വ്യവസ്ഥാസൂചകം പ്രധാനവാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: καταβάτω
  choice: ഇറങ്ങിവരട്ടെ
  rationale: മൂന്നാംപുരുഷ അഓറിസ്റ്റ് ആജ്ഞയുടെ വെല്ലുവിളിപരമായ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: νῦν
  choice: ഇപ്പോൾ
  rationale: പരിഹാസപൂർവമായ ആവശ്യത്തിന്റെ അടിയന്തരത സൂക്ഷിക്കുന്നു.
- source_word: ἀπὸ τοῦ σταυροῦ
  choice: കുരിശിൽനിന്ന്
  rationale: സന്ദർഭത്തിൽ σταυρός എന്നതിന്റെ കൃത്യവും പ്രചാരത്തിലുള്ളതുമായ മലയാളപരിഭാഷ.
- source_word: πιστεύσομεν ἐπ’ αὐτόν
  choice: ഞങ്ങൾ ഇവനിൽ വിശ്വസിക്കും
  rationale: ἐπί + accusative വ്യക്തിയിലേക്കു തിരിയുന്ന വിശ്വാസത്തെ സൂചിപ്പിക്കുന്നു; ‘ഇവനിൽ വിശ്വസിക്കും’ ആ ബന്ധം നിലനിർത്തുന്നു. പരിഹാസഭാവത്തിന് ‘ഇവൻ’ യോജിക്കുന്നു.
theological_decisions:
- issue: യേശുവിനെക്കുറിച്ചുള്ള പരിഹാസാത്മക രാജകീയ അവകാശവാദം
  choice: ഇവൻ ഇസ്രായേലിന്റെ രാജാവാണ്
  alternative: ഇവൻ ഇസ്രായേലിന്റെ രാജാവാണെങ്കിൽ
  rationale: ഗ്രീക്കിൽ ഇത് വ്യവസ്ഥാവാക്യമല്ല, ബന്ധകക്രിയയുള്ള നേരിട്ടുള്ള നാമവാക്യമാണ്. അതിനാൽ മൂലത്തിൽ ഇല്ലാത്ത ‘എങ്കിൽ’ പ്രധാനവാചകത്തിൽ ചേർക്കാതെ, പരിഹാസത്തോടെ ആവർത്തിക്കുന്ന പദവി നേരിട്ടുതന്നെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. പുരോഹിതമുഖ്യന്മാരുടെയും ശാസ്ത്രിമാരുടെയും മൂപ്പന്മാരുടെയും പരിഹാസവാക്കായതിനാൽ ‘ഇവൻ’, ‘തന്നെത്താൻ’, ‘ഇറങ്ങിവരട്ടെ’ എന്നീ രൂപങ്ങൾ വെല്ലുവിളിയും നിന്ദാഭാവവും നിലനിർത്തുന്നു; അതേസമയം അനാവശ്യമായ സംഭാഷണഭാഷ ഒഴിവാക്കിയിരിക്കുന്നു.
