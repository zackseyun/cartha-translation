    rationale: In this context τηρέω most directly denotes guarding. A footnote concerning the participle’s temporal sense is closer to the English audit trail and preserves the primary meaning.
  revised_text: അങ്ങനെ, അവർ അവിടെ ഇരുന്ന് അവനെ കാവലിരുന്നു.[a]
