translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. അപൂർണ്ണഭൂതകാലത്തിന്റെ തുടർച്ച ‘ചെയ്തുകൊണ്ടിരുന്നു’ എന്ന രൂപത്തിൽ പ്രകടമാക്കി.
