id: MAT.27.10
reference: Matthew 27:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἔδωκαν αὐτὰ εἰς τὸν ἀγρὸν τοῦ κεραμέως, καθὰ συνέταξέν μοι κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/010.yaml
  text: and they gave them for the potter's field[b][a], just as the Lord directed me.
translation:
  language: ml
  text: കർത്താവ് എന്നോടു[b] നിർദേശിച്ചതുപോലെ[a], അവർ ആ വെള്ളിക്കാശുകൾ കുശവന്റെ വയലിനായി കൊടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിർദേശിച്ചു’ എന്നതിന് ‘കൽപ്പിച്ചു’ എന്നോ ‘നിർദേശം നൽകി’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ഈ പ്രവചന ഉദ്ധരണി/സൂചനയിൽ മത്തായി പ്രഥമപുരുഷരൂപമായ ‘എന്നോടു’ എന്നത് നിലനിർത്തുന്നു; ചുറ്റുമുള്ള ആഖ്യാനസന്ദർഭത്തിന് ചേരുന്നവിധം അത് മാറ്റുന്നില്ല.
    reason: cross_reference
lexical_decisions:
- source_word: ἔδωκαν
  choice: കൊടുത്തു
  rationale: δίδωμι എന്ന ക്രിയയുടെ ലളിതമായ അർഥമായ ‘കൊടുത്തു’ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ‘വിലയായി നൽകി’ എന്ന ആശയം ഉണ്ടെങ്കിലും ‘വാങ്ങി’ എന്ന വ്യാഖ്യാനം പാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: αὐτὰ
  choice: ആ പണം
  rationale: നപുംസകലിംഗ ബഹുവചന സർവനാമം മുൻസന്ദർഭത്തിലെ വെള്ളിനാണയങ്ങളെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘അവ’ എന്നതിനെക്കാൾ ‘ആ പണം’ സ്വാഭാവികവും സൂചനയിൽ വ്യക്തവുമാണ്; പണത്തിന്റെ കൂട്ടാർഥം സംരക്ഷിക്കുന്നു.
- source_word: εἰς τὸν ἀγρὸν
  choice: വയലിനായി
  rationale: δίδωμι എന്ന ക്രിയയോടും വാങ്ങൽ/വിനിയോഗ സന്ദർഭത്തോടും ചേർന്ന εἰς ഇവിടെ ലക്ഷ്യമോ പ്രതിഫലമോ സൂചിപ്പിക്കുന്നു; അതിനാൽ അക്ഷരാർഥമായ ‘വയലിലേക്ക്’ എന്നതിനെക്കാൾ ‘വയലിനായി’ യോജിക്കുന്നു.
- source_word: τοῦ κεραμέως
  choice: കുശവന്റെ
  rationale: κεραμεύς എന്നതിന്റെ ഷഷ്ഠീവിഭക്തി ഉടമസ്ഥബന്ധമായി സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
- source_word: καθὰ
  choice: …പോലെ
  rationale: തുടർന്നുവരുന്ന കാര്യവുമായി കൃത്യമായ അനുരൂപത സൂചിപ്പിക്കുന്ന താരതമ്യബലം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: συνέταξέν
  choice: നിർദേശിച്ചു
  rationale: συντάσσωയിലെ അധികാരപൂർവമായ നിർദേശം എന്ന ആശയം ആധുനികവും മാന്യവുമായ ഭാഷയിൽ നൽകുന്നു; ‘കല്പിച്ചു’ എന്ന ശക്തമായ വികല്പവും അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: μοι
  choice: എന്നോട്
  rationale: ഗ്രീക്കിലെ പ്രഥമപുരുഷ ഏകവചന ദാതിവ് രൂപം വ്യക്തമായി നിലനിർത്തുന്നു; ആഖ്യാനസന്ദർഭത്തോട് ഒത്തുവരുത്താൻ അതിനെ മാറ്റുന്നില്ല.
- source_word: κύριος
  choice: കർത്താവ്
  rationale: κύριος എന്ന ദൈവസംബോധനയ്ക്ക് മലയാള ബൈബിൾ ഭാഷയിൽ സ്വാഭാവികവും മാന്യവുമായ സമാനപദം.
theological_decisions:
- issue: ഉദ്ധരണി/സൂചനയിലെ പ്രഥമപുരുഷ പരാമർശം
  choice: ഗ്രീക്കിലുള്ള μοι അനുസരിച്ച് ‘എന്നോട്’ നിലനിർത്തി.
  alternative: ആഖ്യാനസന്ദർഭത്തിനോ പഴയനിയമത്തിലെ ഉറവിടവാചകത്തിനോ അനുസരിച്ച് വാചകം മിനുക്കുക.
  rationale: മത്തായി സംരക്ഷിച്ചിരിക്കുന്ന പ്രഥമപുരുഷ രൂപം മാറ്റാതെ വെക്കുന്നത് ഉറവിടപാഠത്തോടുള്ള സുതാര്യതയും ഉദ്ധരണിയുമായി ബന്ധപ്പെട്ട വ്യാഖ്യാനപരവും ദൈവശാസ്ത്രപരവുമായ പിരിമുറുക്കവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ വാക്യഘടന. ‘ആ പണം’ മുൻസന്ദർഭത്തിലെ വെള്ളിനാണയങ്ങളെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു. അടിക്കുറിപ്പുകളുടെ ക്രമം മുഖ്യപാഠത്തിലെ [a][b] എന്ന ക്രമവുമായി ഒത്തിരിക്കുന്നു.
