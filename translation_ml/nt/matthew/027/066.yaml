id: MAT.27.66
reference: Matthew 27:66
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ πορευθέντες ἠσφαλίσαντο τὸν τάφον σφραγίσαντες τὸν λίθον μετὰ τῆς κουστωδίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/066.yaml
  text: So they went and secured the tomb by sealing the stone with the guard.
translation:
  language: ml
  text: അങ്ങനെ അവർ പോയി കാവൽസംഘത്തോടൊപ്പം കല്ലിന് മുദ്രയിട്ട് കല്ലറ സുരക്ഷിതമാക്കി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കല്ലിന് മുദ്രയിടുകയും കാവൽ നിർത്തുകയും ചെയ്ത്.’ ഗ്രീക്ക് പ്രയോഗം സംക്ഷിപ്തമായതിനാൽ, കാവൽസംഘം മുദ്രയിടുമ്പോൾ ഒപ്പമുണ്ടായിരുന്നുവെന്നോ കാവൽ നിർത്തിയത് വേറൊരു നടപടിയായിരുന്നുവെന്നോ മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ πορευθέντες
  choice: അങ്ങനെ അവർ പോയി
  rationale: πορευθέντες എന്ന കൃദന്തരൂപത്തെ മുഖ്യക്രിയയോടു ചേർന്ന തുടർപ്രവൃത്തിയായി സ്വാഭാവിക മലയാളത്തിൽ ക്രിയാരൂപത്തിൽ അവതരിപ്പിക്കുന്നു; δέ ഇവിടെ കഥയുടെ തുടർച്ച സൂചിപ്പിക്കുന്നു.
- source_word: ἠσφαλίσαντο
  choice: സുരക്ഷിതമാക്കി
  rationale: ἀσφαλίζω എന്നത് ഉറപ്പുള്ളതാക്കുക, സുരക്ഷിതമാക്കുക എന്ന അർഥം നൽകുന്നു; കല്ലറയിൽ കൃത്രിമം നടക്കാതിരിക്കാനുള്ള നടപടിയാണ് സന്ദർഭം.
- source_word: τὸν τάφον
  choice: കല്ലറ
  rationale: യേശുവിനെ സംസ്കരിച്ച സ്ഥലത്തെയാണ് τάφος സൂചിപ്പിക്കുന്നത്; ‘കല്ലറ’ ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: σφραγίσαντες
  choice: മുദ്രവെച്ച്
  rationale: അയോറിസ്റ്റ് കൃദന്തം കല്ലറ സുരക്ഷിതമാക്കിയ രീതി അല്ലെങ്കിൽ അതോടൊപ്പമുള്ള പ്രവൃത്തി സൂചിപ്പിക്കുന്നു; ‘മുദ്രവെച്ച്’ ഈ ബന്ധം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: τὸν λίθον
  choice: കല്ലിനു
  rationale: കല്ലറയുടെ പ്രവേശനത്തിൽ വെച്ചിരുന്ന കല്ലാണ് ഉദ്ദേശ്യം; മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘വാതിൽക്കൽ’ പോലുള്ള വിശദീകരണം ചേർക്കുന്നില്ല.
- source_word: μετὰ τῆς κουστωδίας
  choice: കാവൽസംഘത്തോടൊപ്പം
  rationale: κουστωδία ഒരു കാവൽസംഘത്തെയോ കാവൽവിഭാഗത്തെയോ സൂചിപ്പിക്കുന്ന ലത്തീൻ വായ്പാപദമാണ്. μετά + ഷഷ്ഠി സാധാരണയായി സഹവർത്തിത്വം സൂചിപ്പിക്കുന്നതിനാൽ, കാവൽസംഘം സന്നിഹിതമായോ പങ്കാളിയായോ ഉണ്ടായിരുന്നുവെന്ന അർഥം നിലനിർത്തുന്നു; അവർ റോമൻ സൈനികരാണോ മറ്റൊരു വിഭാഗമാണോ എന്ന് നിർണയിക്കുന്നില്ല.
theological_decisions:
- issue: μετὰ τῆς κουστωδίας എന്ന പ്രയോഗം കല്ലറ സുരക്ഷിതമാക്കിയ നടപടിയുമായി എങ്ങനെ ബന്ധപ്പെട്ടിരിക്കുന്നു
  choice: കാവൽസംഘത്തോടൊപ്പം കല്ലിനു മുദ്രവെച്ച് കല്ലറ സുരക്ഷിതമാക്കി
  alternative: കല്ലിനു മുദ്രവെക്കുകയും കാവൽ ഏർപ്പെടുത്തുകയും ചെയ്ത് കല്ലറ സുരക്ഷിതമാക്കി
  rationale: ഗ്രീക്ക് പ്രയോഗം സംക്ഷിപ്തമാണ്; ഇത് കാവൽസംഘത്തിന്റെ സഹവർത്തിത്വമോ പങ്കാളിത്തമോ സൂചിപ്പിക്കാം, അല്ലെങ്കിൽ കാവൽ ഏർപ്പെടുത്തൽ വേറൊരു നടപടിയായിരുന്നുവെന്ന ആശയവും നൽകാം. മുഖ്യവിവർത്തനം പ്രത്യേക നടപടിക്രമം കൂട്ടിച്ചേർക്കാതെ ഈ അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. ‘കാവൽസംഘം’ എന്ന കൂട്ടനാമം മൂലത്തിലെ κουστωδίαയുടെ അർഥം അനാവശ്യമായി പ്രത്യേക സൈനികവിഭാഗമായി നിർവചിക്കാതെ നൽകുന്നു. അടിക്കുറിപ്പ് ചുരുക്കമുള്ള ഗ്രീക്ക് ഘടനയിലെ യഥാർഥ അനിശ്ചിതത്വം വ്യക്തമാക്കുന്നു.
