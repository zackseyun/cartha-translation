id: MAT.27.30
reference: Matthew 27:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐμπτύσαντες εἰς αὐτὸν ἔλαβον τὸν κάλαμον καὶ ἔτυπτον εἰς τὴν κεφαλὴν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/030.yaml
  text: And after spitting on him[b][a], they took the reed and kept striking his head.
translation:
  language: ml
  text: അവർ അവന്റെമേൽ തുപ്പിയ ശേഷം, ആ ഞാങ്ങണക്കോൽ[b] എടുത്ത് അവന്റെ തലയിൽ വീണ്ടും വീണ്ടും അടിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവന്റെ തലയിൽ അടിച്ചുകൊണ്ടിരുന്നു.’ ഗ്രീക്കിലെ അപൂർണഭൂതകാല ക്രിയാരൂപം ആവർത്തിച്ചോ തുടർന്നുകൊണ്ടിരുന്നോ നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിലെ κάλαμος എന്ന പദത്തിന് ‘ഞാങ്ങണ’ എന്നും, വിപുലാർഥത്തിൽ ‘ഞാങ്ങണപോലുള്ള കോൽ’ എന്നും അർഥമുണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμπτύσαντες εἰς αὐτόν
  choice: അവന്റെമേൽ തുപ്പിയശേഷം
  rationale: ഏറിസ്റ്റ് കൃദന്തം മുഖ്യക്രിയകൾക്കു മുമ്പുണ്ടായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ἐμπτύω എന്ന ക്രിയയോടുകൂടിയ εἰς + ദ്വിതീയാവിഭക്തി ഒരാളുടെമേൽ തുപ്പുക എന്ന സ്വാഭാവിക അർഥം നൽകുന്നു.
- source_word: ἔλαβον
  choice: എടുത്ത്
  rationale: λαμβάνω എന്നതിന്റെ സാധാരണ അർഥം സന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; തുടർന്നുള്ള ക്രിയയുമായി മലയാളത്തിൽ ചേർത്തുപറയുന്നത് പ്രവാഹമുള്ള വിവർത്തനമാണ്.
- source_word: τὸν κάλαμον
  choice: ആ കോൽ
  rationale: κάλαμος ഞാങ്ങണയെയോ ഞാങ്ങണപോലുള്ള കോലിനെയോ സൂചിപ്പിക്കാം. മുൻസന്ദർഭത്തിൽ യേശുവിന്റെ കയ്യിൽ കൊടുത്ത വസ്തുവിലേക്കുള്ള നിർദ്ദിഷ്ട പരാമർശം നിലനിർത്താൻ ‘ആ’ എന്നും, അടിക്കാൻ ഉപയോഗിക്കുന്ന വസ്തുവെന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകാൻ ‘കോൽ’ എന്നും തെരഞ്ഞെടുത്തു.
- source_word: ἔτυπτον
  choice: വീണ്ടും വീണ്ടും അടിച്ചു
  rationale: അപൂർണഭൂതകാലരൂപം ആവർത്തിച്ചോ തുടർന്നുകൊണ്ടിരുന്നോ നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘വീണ്ടും വീണ്ടും’ ഈ ഘടകം വ്യക്തമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: εἰς τὴν κεφαλὴν αὐτοῦ
  choice: അവന്റെ തലയിൽ
  rationale: εἰς ഇവിടെ പ്രഹരങ്ങളുടെ ലക്ഷ്യസ്ഥാനത്തെ സൂചിപ്പിക്കുന്നു; ‘തലയിൽ’ എന്നത് അതിന്റെ സ്വാഭാവിക മലയാളരൂപമാണ്.
theological_decisions:
- issue: യേശുവിനോടുള്ള പടയാളികളുടെ അപമാനവും ആവർത്തിച്ചുള്ള മർദനവും
  choice: പ്രവൃത്തികളെ ലളിതമായും മൂർത്തമായും അവതരിപ്പിച്ച്, ἔτυπτον എന്ന അപൂർണഭൂതകാലത്തിന്റെ ആവർത്തനസ്വഭാവം ‘വീണ്ടും വീണ്ടും അടിച്ചു’ എന്നു വ്യക്തമാക്കുക.
  alternative: ‘അവന്റെ തലയിൽ അടിച്ചുകൊണ്ടിരുന്നു’ എന്നു വിവർത്തനം ചെയ്ത് പ്രവൃത്തിയുടെ തുടർച്ചയ്ക്ക് കൂടുതൽ ഊന്നൽ നൽകുക.
  rationale: വാക്യം ഉപദേശപരമായ വിശദീകരണമല്ല, സംഭവവിവരണമാണ്. അതിനാൽ ക്രൂരതയെ മയപ്പെടുത്താതെയും ഉറവിടത്തിൽ ഇല്ലാത്ത വിശദാംശങ്ങൾ ചേർക്കാതെയും ആവർത്തിച്ചുള്ള അതിക്രമം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ സംഭവവിവരണശൈലി. ‘ഞാങ്ങണക്കോൽ’ എന്ന കൂടുതൽ രൂപപരമായ പദത്തിനു പകരം സന്ദർഭത്തിൽ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ ‘കോൽ’ ഉപയോഗിച്ചു; ഗ്രീക്ക് പദത്തിന്റെ അർഥവ്യാപ്തി lexical decision-ൽ രേഖപ്പെടുത്തി.
