revisions:
- from: ഉടനെ അവരിൽ ഒരാൾ ഓടിച്ചെന്ന് ഒരു നീർപ്പഞ്ഞി എടുത്ത് പുളിച്ച വീഞ്ഞുകൊണ്ട് നിറച്ചു, അത് ഒരു ഞാങ്ങണത്തണ്ടിൽ വെച്ച് യേശുവിനു കുടിക്കാൻ കൊടുത്തു.[a]
  to: ഉടനെ അവരിൽ ഒരാൾ ഓടി, ഒരു സ്പോഞ്ച് എടുത്ത് അതിൽ പുളിച്ച വീഞ്ഞ് നിറച്ച്, അതിനെ ഒരു ഞാങ്ങണത്തണ്ടിൽ വെച്ച്, അവന് കുടിക്കാൻ കൊടുത്തുകൊണ്ടിരുന്നു.[a]
