id: MAT.27.48
reference: Matthew 27:48
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εὐθέως δραμὼν εἷς ἐξ αὐτῶν καὶ λαβὼν σπόγγον πλήσας τε ὄξους καὶ περιθεὶς καλάμῳ ἐπότιζεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/048.yaml
  text: And immediately one of them ran[a], took a sponge, filled it with sour wine, put it on a reed[b], and gave him a drink.
translation:
  language: ml
  text: ഉടനെ അവരിൽ ഒരാൾ ഓടി, ഒരു സ്പോഞ്ച് എടുത്ത് അതിൽ പുളിച്ച വീഞ്ഞ് നിറച്ച്, അതിനെ ഒരു ഞാങ്ങണത്തണ്ടിൽ വെച്ച്, അവന് കുടിക്കാൻ കൊടുത്തുകൊണ്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കുടിക്കാൻ കൊടുത്തു” എന്നും വിവർത്തനം ചെയ്യാം. “പുളിച്ച വീഞ്ഞ്” എന്നതിനുള്ള ഗ്രീക്ക് പദം “വീഞ്ഞുവിനാഗിരി” എന്നും അർഥമാക്കാം.
    reason: lexical_and_aspectual_alternatives
lexical_decisions:
- source_word: εὐθέως
  choice: ഉടനെ
  rationale: പ്രവൃത്തിയുടെ തൽക്ഷണസ്വഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: δραμὼν
  choice: ഓടിച്ചെന്ന്
  rationale: തുടർന്നുള്ള പ്രവൃത്തിയിലേക്കുള്ള അടിയന്തരമായ നീക്കം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: εἷς ἐξ αὐτῶν
  choice: അവരിൽ ഒരാൾ
  rationale: ഭാഗസൂചകമായ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ലളിതവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: λαβὼν σπόγγον
  choice: ഒരു നീർപ്പഞ്ഞി എടുത്ത്
  rationale: σπόγγος എന്നത് ദ്രാവകം വലിച്ചെടുക്കുന്ന സ്പോഞ്ചിനെ സൂചിപ്പിക്കുന്നു; ‘നീർപ്പഞ്ഞി’ സാധാരണ വായനക്കാർക്ക് അർത്ഥം വ്യക്തമാക്കുന്നു.
- source_word: πλήσας τε ὄξους
  choice: പുളിച്ച വീഞ്ഞുകൊണ്ട് നിറച്ചു
  rationale: ὄξος പുളിച്ച വീഞ്ഞിനെയോ വീഞ്ഞിൽനിന്നുള്ള അമ്ലപാനീയത്തെയോ സൂചിപ്പിക്കുന്നു; ആധുനിക ‘വിനാഗിരി’ എന്ന പാചകവസ്തുവിന്റെ തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: περιθεὶς καλάμῳ
  choice: അത് ഒരു ഞാങ്ങണത്തണ്ടിൽ വെച്ച്
  rationale: κάλαμος എന്നതിന്റെ നേരിട്ടുള്ള അർത്ഥം നിലനിർത്തിക്കൊണ്ട് സ്പോഞ്ച് തണ്ടിൽ വെച്ചതെന്ന പ്രവർത്തി സ്വാഭാവികമായി പറയുന്നു.
- source_word: ἐπότιζεν αὐτόν
  choice: യേശുവിനു കുടിക്കാൻ കൊടുത്തു
  rationale: ποτίζωയുടെ കാരണാർത്ഥം വ്യക്തമായി നൽകുന്നു. സന്ദർഭത്തിൽ imperfect രൂപം പുരോഗമിക്കുന്നതോ ശ്രമിച്ചതോ ആയ പ്രവർത്തിയായി ഗ്രഹിക്കാമെങ്കിലും മലയാളത്തിൽ ലളിതഭൂതകാലം കൂടുതൽ സ്വാഭാവികമാണ്; ആ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശുവിനു നൽകിയ പാനീയത്തിന്റെ സ്വഭാവം
  choice: പുളിച്ച വീഞ്ഞ്
  alternative: വീഞ്ഞുവിനാഗിരി / വിനാഗിരി
  rationale: ὄξος പുളിച്ച വീഞ്ഞിനെയോ വീഞ്ഞിൽനിന്നുള്ള അമ്ലപാനീയത്തെയോ സൂചിപ്പിക്കുന്നു. ‘പുളിച്ച വീഞ്ഞ്’ എന്നത് ഗ്രീക്ക് പദത്തിന്റെ പാനീയസന്ദർഭം കാത്തുസൂക്ഷിക്കുകയും ആധുനിക പാചകവിനാഗിരിയെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- issue: ἐπότιζεν എന്ന imperfect ക്രിയയുടെ ഭാവം
  choice: കുടിക്കാൻ കൊടുത്തു
  alternative: കുടിപ്പിച്ചുകൊണ്ടിരുന്നു / കുടിക്കാൻ കൊടുക്കാൻ ശ്രമിച്ചു
  rationale: ഇവിടെ imperfect രൂപം പുരോഗമിക്കുന്നതോ ശ്രമിച്ചതോ ആയ പ്രവർത്തിയെ സൂചിപ്പിക്കാം; എന്നാൽ നിർബന്ധമായി ആവർത്തനം അർത്ഥമാക്കുന്നില്ല. പ്രധാനപാഠത്തിൽ സ്വാഭാവിക മലയാളം ഉപയോഗിച്ച് ഭാവസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ പങ്കാളിക്രിയകളുടെ ശൃംഖല മലയാളത്തിൽ സ്വാഭാവികമായ ക്രിയാക്രമമായി നൽകിയിരിക്കുന്നു. വ്യക്തതയ്ക്കായി ‘അവന്’ എന്നതിനുപകരം ‘യേശുവിനു’ ഉപയോഗിച്ചു.
