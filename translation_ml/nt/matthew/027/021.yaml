revisions:
- from: 'എന്നാൽ ഗവർണർ അവരോടു ചോദിച്ചു: “ഈ രണ്ടുപേരിൽ ആരെയാണ് ഞാൻ നിങ്ങൾക്കുവേണ്ടി വിട്ടയക്കേണ്ടത്?” അവർ പറഞ്ഞു: “ബറബ്ബാസിനെ.”'
  to: 'എന്നാൽ ഗവർണർ അവരോടു മറുപടി പറഞ്ഞു: “ആ രണ്ടുപേരിൽ ആരെയാണ് ഞാൻ നിങ്ങൾക്കുവേണ്ടി വിട്ടയക്കണമെന്ന് നിങ്ങൾ ആഗ്രഹിക്കുന്നത്?” അവർ പറഞ്ഞു: “ബറബ്ബാസിനെ.”'
  rationale: The revision preserves the mild narrative turn marked by δέ, explicitly conveys θέλετε as the crowd’s desire, and reflects ἀποκριθείς idiomatically. No textual-critical ambiguity or footnote is required for this verse.
