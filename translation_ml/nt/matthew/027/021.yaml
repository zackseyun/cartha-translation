id: MAT.27.21
reference: Matthew 27:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ ἡγεμὼν εἶπεν αὐτοῖς· Τίνα θέλετε ἀπὸ τῶν δύο ἀπολύσω ὑμῖν; οἱ δὲ εἶπαν· ⸀Τὸν Βαραββᾶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/021.yaml
  text: But the governor answered them, “Which of the two do you want me to release for you?” And they said, “Barabbas.”
translation:
  language: ml
  text: 'എന്നാൽ ഗവർണർ അവരോടു മറുപടി പറഞ്ഞു: “ആ രണ്ടുപേരിൽ ആരെയാണ് ഞാൻ നിങ്ങൾക്കുവേണ്ടി വിട്ടയക്കണമെന്ന് നിങ്ങൾ ആഗ്രഹിക്കുന്നത്?” അവർ പറഞ്ഞു: “ബറബ്ബാസിനെ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ ἡγεμὼν εἶπεν αὐτοῖς
  choice: എന്നാൽ ഗവർണർ അവരോടു ചോദിച്ചു
  rationale: ἀποκριθείς + εἶπεν എന്ന ഗ്രീക്ക് പ്രയോഗം മറുപടിയായി സംസാരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ആവർത്തനമില്ലാതെ സ്വാഭാവികമായി ‘ചോദിച്ചു’ എന്നു നൽകിയിരിക്കുന്നു, കാരണം പിന്നാലെ നേരിട്ടുള്ള ചോദ്യം വരുന്നു. δέയുടെ മൃദുവായ കഥാഗതിമാറ്റം ‘എന്നാൽ’ നിലനിർത്തുന്നു.
- source_word: Τίνα
  choice: ആരെയാണ്
  rationale: രണ്ടു വ്യക്തികളിൽ ഒരാളെ തിരഞ്ഞെടുക്കാനുള്ള ചോദ്യമായതിനാൽ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: θέλετε
  choice: നിങ്ങൾ ... വേണ്ടത്
  rationale: θέλω ഇവിടെ ആഗ്രഹമോ മുൻഗണനയോ സൂചിപ്പിക്കുന്നു; ചോദ്യം മലയാളത്തിൽ നേരിട്ടും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἀπὸ τῶν δύο
  choice: ഈ രണ്ടുപേരിൽ
  rationale: നിർദിഷ്ടരായ രണ്ടു വ്യക്തികളിൽനിന്നുള്ള തിരഞ്ഞെടുപ്പ് എന്ന ഭാഗികാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: ἀπολύσω ὑμῖν
  choice: ഞാൻ നിങ്ങൾക്കുവേണ്ടി വിട്ടയക്കേണ്ടത്
  rationale: നിയമപരമായ സാഹചര്യത്തിൽ ἀπολύω ‘സ്വതന്ത്രനാക്കി വിട്ടയയ്ക്കുക’ എന്നർഥം നൽകുന്നു; ὑμῖν എന്ന ദത്തിവ് ജനക്കൂട്ടത്തിനുവേണ്ടിയുള്ള വിടുതലായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: οἱ δὲ εἶπαν
  choice: അവർ പറഞ്ഞു
  rationale: ജനക്കൂട്ടത്തിന്റെ മറുപടി ലളിതമായ കഥാതുടർച്ചയായി നൽകുന്നു; രണ്ടാമത്തെ δέ മലയാളത്തിൽ പ്രത്യേകം അടയാളപ്പെടുത്താതെ സ്വാഭാവികമായി കൈകാര്യം ചെയ്യുന്നു.
- source_word: Τὸν Βαραββᾶν
  choice: ബറബ്ബാസിനെ
  rationale: വ്യക്തിനാമം മലയാളത്തിൽ പ്രചാരത്തിലുള്ള ലിപ്യന്തരണത്തിൽ നൽകി; ഗ്രീക്ക് കർമവിഭക്തി മലയാളത്തിലെ ‘-നെ’ വഴി പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗ്രീക്കിലെ ‘മറുപടി പറഞ്ഞുകൊണ്ട് പറഞ്ഞു’ എന്ന ഘടന പദാനുപദമായി ആവർത്തിക്കാതെ, സന്ദർഭത്തിലെ ചോദ്യസ്വഭാവം അനുസരിച്ച് സ്വാഭാവികമാക്കി.
