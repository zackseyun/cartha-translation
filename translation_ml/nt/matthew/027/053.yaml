id: MAT.27.53
reference: Matthew 27:53
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐξελθόντες ἐκ τῶν μνημείων μετὰ τὴν ἔγερσιν αὐτοῦ εἰσῆλθον εἰς τὴν ἁγίαν πόλιν καὶ ἐνεφανίσθησαν πολλοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/053.yaml
  text: And coming out of the tombs after his resurrection[c][b][a], they entered the holy city and appeared to many.
translation:
  language: ml
  text: അവന്റെ ഉയിർത്തെഴുന്നേൽപ്പിനുശേഷം കല്ലറകളിൽനിന്ന് പുറത്തുവന്ന അവർ വിശുദ്ധനഗരത്തിൽ പ്രവേശിച്ചു, അനേകർക്കു പ്രത്യക്ഷരായി.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു വാക്യക്രമം: “അവർ കല്ലറകളിൽനിന്ന് പുറത്തുവന്ന്, അവന്റെ ഉയിർത്തെഴുന്നേൽപ്പിനുശേഷം വിശുദ്ധനഗരത്തിൽ പ്രവേശിച്ചു, അനേകർക്കു പ്രത്യക്ഷരായി.” ഗ്രീക്കിൽ “അവന്റെ ഉയിർത്തെഴുന്നേൽപ്പിനുശേഷം” എന്ന വാക്കുകൾ “കല്ലറകളിൽനിന്ന് പുറത്തുവന്ന” എന്നതിനും “അവർ പ്രവേശിച്ചു” എന്നതിനും ഇടയിലാണ്.'
    reason: alternative_reading
  - marker: b
    text: “വിശുദ്ധനഗരം” എന്നത് യെരൂശലേമിനെ സൂചിപ്പിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: ἐξελθόντες
  choice: പുറത്തുവന്ന അവർ
  rationale: അയോറിസ്റ്റ് കൃദന്തരൂപത്തിന്റെ മുൻകാലബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; തുടർന്ന് വരുന്ന പ്രധാന ക്രിയകളുമായുള്ള ബന്ധവും നിലനിർത്തുന്നു.
- source_word: μνημείων
  choice: കല്ലറകളിൽനിന്ന്
  rationale: സന്ദർഭത്തിലെ തുറക്കപ്പെട്ട സംസ്കാരസ്ഥലങ്ങളെ സൂചിപ്പിക്കാൻ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ പദം.
- source_word: μετὰ τὴν ἔγερσιν αὐτοῦ
  choice: അവന്റെ ഉയിർത്തെഴുന്നേൽപ്പിനുശേഷം
  rationale: μετά + accusative എന്നതിന്റെ കാലസൂചനയും ἔγερσις എന്നതിന്റെ ഉയിർത്തെഴുന്നേൽപ്പ് അർത്ഥവും സംരക്ഷിക്കുന്നു; ‘അവന്റെ’ എന്ന സർവനാമത്തിന്റെ സന്ദർഭപരമായ സൂചന നിർബന്ധമായി വിശദീകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: εἰσῆλθον
  choice: പ്രവേശിച്ച്
  rationale: ആഖ്യാനത്തിലെ ലളിതമായ പ്രവേശനക്രിയ സ്വാഭാവിക മലയാള വാക്യക്രമത്തിൽ അടുത്ത പ്രധാന ക്രിയയോട് ചേർക്കുന്നു.
- source_word: τὴν ἁγίαν πόλιν
  choice: വിശുദ്ധനഗരത്തിൽ
  rationale: ബൈബിൾ പ്രയോഗം നിലനിർത്തുന്നു; നഗരത്തെ മുഖ്യവാക്യത്തിൽ നേരിട്ട് ‘യെരൂശലേം’ എന്നു മാറ്റാതെ ഉറവിടത്തിന്റെ രൂപം സംരക്ഷിക്കുന്നു.
- source_word: ἐνεφανίσθησαν
  choice: പ്രത്യക്ഷരായി
  rationale: മറ്റുള്ളവർക്ക് ദൃശ്യമാകുക/കാണപ്പെടുക എന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: πολλοῖς
  choice: അനേകർക്കു
  rationale: ഗ്രീക്കിലെ അനിശ്ചിത ബഹുവചന ദത്തിവിന്റെ സംക്ഷിപ്തത സംരക്ഷിക്കുന്നു; ‘ആളുകൾ’ എന്നത് അനാവശ്യമായി ചേർക്കുന്നില്ല.
theological_decisions:
- issue: കല്ലറകളിൽനിന്നുള്ള പുറപ്പെടലും ‘അവന്റെ ഉയിർത്തെഴുന്നേൽപ്പിനുശേഷം’ എന്ന കാലവാക്യവും തമ്മിലുള്ള ബന്ധം
  choice: കാലവാക്യം ‘പുറത്തുവന്ന’ എന്ന കൃദന്തക്രിയയോട് ചേർത്ത്, ഉയിർത്തെഴുന്നേൽപ്പിനുശേഷമാണ് അവരുടെ പുറപ്പെടലും തുടർന്നുള്ള നഗരപ്രവേശവും സംഭവിച്ചതെന്ന ഗ്രീക്ക് വാക്യക്രമത്തിന്റെ സ്വാഭാവിക വായന നിലനിർത്തി.
  alternative: മുൻവാക്യവുമായി കൂടുതൽ ചേർത്ത്, യേശുവിന്റെ മരണസമയത്ത് കല്ലറകൾ തുറന്നെങ്കിലും വിശുദ്ധർ ഉയിർത്തെഴുന്നേൽപ്പിനുശേഷം മാത്രമാണ് പുറത്തുവന്നതെന്ന് വ്യക്തമായി വ്യാഖ്യാനിക്കാം; അല്ലെങ്കിൽ കാലവാക്യം പ്രധാനക്രിയയായ നഗരപ്രവേശനത്തോട് ബന്ധിപ്പിക്കാം.
  rationale: μετὰ τὴν ἔγερσιν αὐτοῦ എന്ന ഘടകം ἐξελθόντες ἐκ τῶν μνημείων എന്ന കൃദന്തഘടകത്തിനു പിന്നാലെയാണ്. വിവർത്തനം ഈ സമീപബന്ധം സംരക്ഷിക്കുന്നു; എന്നാൽ സംഭവക്രമത്തെക്കുറിച്ച് വാക്യം പറയുന്നതിലധികം വിശദീകരണം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗ്രീക്ക് ഘടനയിലെ കാലബന്ധം പരമാവധി സംരക്ഷിക്കുമ്പോൾ മലയാളത്തിലെ അസ്വാഭാവികമായ ആവർത്തനം ഒഴിവാക്കി. ‘വിശുദ്ധനഗരം’ എന്ന ബൈബിൾപ്രയോഗം നിലനിർത്തി വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകി.
