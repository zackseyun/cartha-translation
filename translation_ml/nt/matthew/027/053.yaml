  source_fidelity: 'മുഖ്യപാഠം ഗ്രീക്കിലെ ഘടകങ്ങളെയും കാലസൂചനയെയും വിശ്വസ്തമായി അറിയിക്കുന്നു: യേശുവിന്റെ ഉയിർത്തെഴുന്നേൽപ്പിനുശേഷം കല്ലറകളിൽനിന്ന് പുറത്തുവന്നവർ വിശുദ്ധനഗരത്തിൽ പ്രവേശിക്കുകയും പലർക്കു പ്രത്യക്ഷരാകുകയും ചെയ്തു. എന്നാൽ ‘പ്രവേശിച്ച്’ എന്നത് ഗ്രീക്കിലെ εἰσῆλθον, ἐνεφανίσθησαν എന്നീ രണ്ടു സമന്വിത ആഖ്യാനക്രിയകളിൽ ആദ്യത്തേതിനെ മലയാളത്തിൽ ആശ്രിതക്രിയയാക്കുന്നു. അവ രണ്ടും സ്വതന്ത്ര ക്രിയകളായി നൽകുന്നതാണ് കൂടുതൽ കൃത്യം.'
  naturalness: വാക്യം ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ സ്വാഭാവികമാണ്. ‘അവർ വിശുദ്ധനഗരത്തിൽ പ്രവേശിച്ചു, അനേകർക്കു പ്രത്യക്ഷരായി’ എന്ന സമന്വയരൂപം വായനയെ കൂടുതൽ സുഗമമാക്കുകയും മൂലത്തിലെ ക്രിയാസമന്വയം നിലനിർത്തുകയും ചെയ്യുന്നു.
