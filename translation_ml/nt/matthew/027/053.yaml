  to: അവന്റെ ഉയിർത്തെഴുന്നേൽപ്പിനുശേഷം കല്ലറകളിൽനിന്ന് പുറത്തുവന്ന അവർ വിശുദ്ധനഗരത്തിൽ പ്രവേശിച്ചു, അനേകർക്കു പ്രത്യക്ഷരായി.[a][b]
  rationale: തിരുത്തൽ εἰσῆλθον, ἐνεφανίσθησαν എന്നീ സമന്വിത പ്രധാനക്രിയകളെ മലയാളത്തിലും സമന്വിത ഭൂതകാലക്രിയകളായി പുനഃസ്ഥാപിക്കുന്നു. ‘അവന്റെ ഉയിർത്തെഴുന്നേൽപ്പിനുശേഷം’ എന്ന ഘടകം കല്ലറകളിൽനിന്നുള്ള പുറപ്പെടലുമായി ബന്ധിപ്പിച്ച മുഖ്യവായന നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് ഗ്രീക്ക് പദക്രമം രേഖപ്പെടുത്തുമ്പോൾ സംഭവക്രമത്തെക്കുറിച്ച് അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
