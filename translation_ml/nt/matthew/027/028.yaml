  text: And after stripping him[a], they put a scarlet cloak on him,
translation:
  language: ml
  text: അവർ അവന്റെ വസ്ത്രങ്ങൾ അഴിച്ചുമാറ്റിയശേഷം, കടുംചുവപ്പുനിറമുള്ള ഒരു മേലങ്കി[a] അവനെ ധരിപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “പുറംവസ്ത്രം.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദം കൂടുതൽ പൊതുവായി ഒരു പുറംവസ്ത്രത്തെയോ മേൽവസ്ത്രത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκδύσαντες
  choice: വസ്ത്രങ്ങൾ അഴിച്ചുമാറ്റി
  rationale: ἐκδύω എന്ന ക്രിയയുടെ വസ്ത്രം അഴിക്കുക/ഉരിയുക എന്ന അർഥവും, പ്രധാനക്രിയയ്ക്കു മുമ്പ് നടന്ന പ്രവൃത്തിയെന്ന aorist participle-ന്റെ ബന്ധവും സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: χλαμύδα
  choice: മേലങ്കി
  rationale: χλαμύς സാധാരണയായി സൈനികരോ ഉദ്യോഗസ്ഥരോ ധരിച്ചിരുന്ന പുറംവസ്ത്രത്തെയോ ചെറു മേലങ്കിയെയോ സൂചിപ്പിക്കുന്നു. വസ്ത്രത്തിന്റെ സ്വഭാവം അതിരുകടന്ന് നിർണയിക്കാതെ പൊതുവായ അർഥം നൽകുന്നു.
- source_word: κοκκίνην
  choice: കടുംചുവപ്പുനിറമുള്ള
  rationale: κόκκινος സൂചിപ്പിക്കുന്ന തെളിഞ്ഞ കടുംചുവപ്പ് വർണം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും വ്യക്തവുമായി അറിയിക്കുന്നു.
- source_word: περιέθηκαν αὐτῷ
  choice: അവനെ ധരിപ്പിച്ചു
  rationale: περιτίθημι ദത്തിവിനോടൊപ്പം ഇവിടെ ഒരാളുടെ മേൽ വസ്ത്രം ഇടുക എന്ന അർഥത്തിലാണ്. മലയാളത്തിൽ ‘ധരിപ്പിച്ചു’ ആ പ്രവൃത്തിയെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: καὶ
  choice: അവർ
  rationale: മുൻവാക്യത്തോടുള്ള καί എന്ന ബന്ധകത്തിന്റെ തുടർച്ച മലയാളത്തിലെ വാക്യക്രമത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു; ഒറ്റവാക്യമായി വായിക്കുമ്പോൾ അനാവശ്യമായ ‘പിന്നെ’ ചേർത്ത് കാലക്രമം ശക്തമാക്കുന്നില്ല.
theological_decisions:
- issue: പരിഹാസപരമായ രാജവേഷധാരണത്തിൽ ഉപയോഗിച്ച വസ്ത്രത്തിന്റെ സ്വഭാവം
  choice: കടുംചുവപ്പുനിറമുള്ള മേലങ്കി
  alternative: കടുംചുവപ്പുനിറമുള്ള അങ്കി
  rationale: χλαμύς എന്ന പദത്തിന്റെ പുറംവസ്ത്രം എന്ന അടിസ്ഥാനാർഥം സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിലുള്ള രാജകീയ പരിഹാസത്തെ സൂചിപ്പിക്കുന്നതിലപ്പുറം പ്രത്യേക രാജവസ്ത്രമാണെന്ന് വിവർത്തനംകൊണ്ട് നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഉരിഞ്ഞുമാറ്റി’ എന്നതിനെക്കാൾ കുറച്ച് ദൃശ്യതീവ്രതയുള്ള ‘വസ്ത്രങ്ങൾ അഴിച്ചുമാറ്റി’ തിരഞ്ഞെടുത്തു; ഗ്രീക്കിലെ വസ്ത്രം അഴിക്കൽ വ്യക്തമായി നിലനിർത്തുന്നു. ‘മേലങ്കി’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും χλαμύς എന്ന പദത്തിന്റെ പരിധി അനാവശ്യമായി ചുരുക്കാത്തതുമാണ്.
