translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ചരിത്രപരമായ ‘പ്രെത്തോറിയം’ മുഖ്യപാഠത്തിൽ നിലനിർത്തി അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു; ‘σπεῖρα’യുടെ സൈനിക സാങ്കേതികത വായനാസൗകര്യത്തിനായി ‘സൈനികഗണം’ എന്നു നൽകി.
