id: MAT.27.27
reference: Matthew 27:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τότε οἱ στρατιῶται τοῦ ἡγεμόνος παραλαβόντες τὸν Ἰησοῦν εἰς τὸ πραιτώριον συνήγαγον ἐπ’ αὐτὸν ὅλην τὴν σπεῖραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/027.yaml
  text: Then the governor’s soldiers took Jesus into the praetorium and gathered the whole cohort around him[a][b].
translation:
  language: ml
  text: അപ്പോൾ ദേശാധിപതിയുടെ പടയാളികൾ യേശുവിനെ പ്രെത്തോറിയത്തിനകത്തേക്കു കൊണ്ടുപോയി, സൈനികഗണം മുഴുവനെയും അദ്ദേഹത്തിന്റെ ചുറ്റും കൂട്ടിച്ചേർത്തു[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദേശാധിപതിയുടെ ആസ്ഥാനമന്ദിരം.’ ‘പ്രെത്തോറിയം’ എന്ന ഗ്രീക്കുപദം റോമൻ ദേശാധിപതിയുടെ ഔദ്യോഗിക വസതിയെയോ സൈനിക ആസ്ഥാനത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘സൈനികഗണം’ ഒരു റോമൻ സൈനികഘടകത്തെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ പരിഭാഷയാണ്; പൂർണ അംഗസംഖ്യയുള്ള ആ ഘടകത്തിലെ ഓരോ പടയാളിയും അവിടെ സന്നിഹിതനായിരുന്നു എന്ന് ഇത് നിർബന്ധമായും അർത്ഥമാക്കുന്നില്ല.
    reason: cultural_note
lexical_decisions:
- source_word: Τότε
  choice: അപ്പോൾ
  rationale: സംഭവക്രമത്തിലെ അടുത്ത ഘട്ടം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്ന ആധുനിക മലയാള പ്രയോഗം.
- source_word: στρατιῶται τοῦ ἡγεμόνος
  choice: ദേശാധിപതിയുടെ പടയാളികൾ
  rationale: റോമൻ പ്രവിശ്യാഭരണാധികാരിയോടുള്ള ബന്ധം വ്യക്തമാക്കുകയും ഗ്രീക്കിലെ സംബന്ധിക ഷഷ്ഠിവിഭക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἡγεμόνος
  choice: ദേശാധിപതി
  rationale: ഈ സന്ദർഭത്തിലെ റോമൻ പ്രവിശ്യാഭരണാധികാരിയെ സൂചിപ്പിക്കുന്നു; മൂലപദം അനുവദിക്കുന്നതിലധികം കൃത്യമായ ഔദ്യോഗിക പദവി ചുമത്തുന്നില്ല.
- source_word: παραλαβόντες ... εἰς τὸ πραιτώριον
  choice: യേശുവിനെ പ്രെത്തോറിയത്തിനകത്തേക്കു കൊണ്ടുപോയി
  rationale: കർത്തൃസമാനകാലിക കൃദന്തരൂപത്തെ സ്വാഭാവിക മലയാള വാക്യക്രമത്തിലാക്കി, യേശുവിനെ കൂടെ കൊണ്ടുപോയതും അകത്തേക്കുള്ള ചലനവും സംരക്ഷിക്കുന്നു.
- source_word: πραιτώριον
  choice: പ്രെത്തോറിയം
  rationale: റോമൻ ഭരണ-സൈനിക പശ്ചാത്തലമുള്ള ചരിത്രപരമായ പദം ലിപ്യന്തരണം ചെയ്ത് നിലനിർത്തുന്നു; അർത്ഥവിവരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: συνήγαγον ἐπ’ αὐτὸν
  choice: അദ്ദേഹത്തിന്റെ ചുറ്റും കൂട്ടിച്ചേർത്തു
  rationale: സൈനികർ യേശുവിന്റെ അടുത്തേക്ക് ഒത്തുകൂടി ചുറ്റിനിൽക്കുന്ന ദൃശ്യത്തിന് യോജിക്കുന്നു; ἐπίയുടെ സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὅλην τὴν σπεῖραν
  choice: സൈനികഗണം മുഴുവനെയും
  rationale: σπεῖρα ഒരു റോമൻ സൈനികഘടകമാണെന്ന അർത്ഥം സംരക്ഷിക്കുന്നു; മലയാള വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പദം ഉപയോഗിച്ച് സാങ്കേതിക വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
