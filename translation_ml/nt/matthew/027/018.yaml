  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ᾔδει γὰρ ὅτι διὰ φθόνον παρέδωκαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/018.yaml
  text: For he knew that they had handed him over because of envy[a].
translation:
  language: ml
  text: കാരണം, അസൂയ നിമിത്തമാണ് അവർ അവനെ ഏൽപ്പിച്ചുകൊടുത്തതെന്ന് അവന് അറിയാമായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അസൂയകൊണ്ടാണ്’ അല്ലെങ്കിൽ ‘ഈർഷ്യ നിമിത്തമാണ്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: അവന് അറിയാമായിരുന്നു
  rationale: οἶδα ഇവിടെ അറിവിനെയോ ബോധ്യത്തെയോ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിലെ കർത്താവായ പീലാത്തോസിനെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കാൻ ഈ രൂപം യോജിക്കുന്നു.
- source_word: γὰρ
  choice: വാക്യത്തിന്റെ വിശദീകരണബന്ധത്തിലൂടെ പ്രകടിപ്പിച്ചു
  rationale: γάρ മുൻവാക്യത്തിന് കാരണം/വിശദീകരണം നൽകുന്നു. ഒറ്റവാക്യമായി വായിക്കുമ്പോൾ അസ്വാഭാവികമായ ‘എന്തെന്നാൽ’ ഒഴിവാക്കി, മലയാള വാക്യഘടനയിൽ വിശദീകരണഭാവം നിലനിർത്തി.
- source_word: ὅτι
  choice: എന്ന്
  rationale: പീലാത്തോസിന് അറിയാമായിരുന്നതിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നതിനാൽ മലയാളത്തിലെ ‘എന്ന്’ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: διὰ φθόνον
  choice: അസൂയ നിമിത്തമാണ്
  rationale: διά + accusative കാരണമോ പ്രേരണയോ സൂചിപ്പിക്കുന്നു; φθόνος മറ്റൊരാളുടെ സ്ഥാനത്തോടോ നേട്ടത്തോടോ ഉള്ള അസൂയയും വിരോധഭാവവും സൂചിപ്പിക്കുന്നു.
- source_word: παρέδωκαν
  choice: ഏല്പിച്ചുകൊടുത്തത്
  rationale: παραδίδωμι ഇവിടെ ഒരാളെ അധികാരികളുടെ കയ്യിൽ ഏല്പിക്കുന്ന പ്രവൃത്തിയാണ്; ‘ഒറ്റിക്കൊടുത്തു’ എന്നു വിവർത്തനം ചെയ്താൽ അർഥം അനാവശ്യമായി വഞ്ചനയിലേക്ക് ചുരുങ്ങാം.
- source_word: αὐτόν
  choice: അവനെ
  rationale: യേശുവിനെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള കർമസർവനാമം.
theological_decisions:
- issue: യേശുവിനെ കുറ്റം ചുമത്തിയവരുടെ പ്രേരണ
  choice: അവർ യേശുവിനെ ഏല്പിച്ചുകൊടുത്തതിന്റെ കാരണം അസൂയയാണെന്ന് പീലാത്തോസ് അറിഞ്ഞിരുന്നു.
  alternative: അവരുടെ പ്രേരണയെ ‘ഈർഷ്യ’ എന്നു വിശേഷിപ്പിക്കുക.
  rationale: φθόνος എന്ന പദത്തിന്റെ ധാർമികവും മാനസികവുമായ ശക്തി ‘അസൂയ’ വ്യക്തമായി നിലനിർത്തുന്നു; വാക്യത്തിൽ പറയാത്ത കൂടുതൽ ദൈവശാസ്ത്ര വിശദീകരണം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗ്രീക്കിലെ കാരണബന്ധവും കൈമാറിക്കൊടുക്കൽ എന്ന നിയമ-കഥാസന്ദർഭവും നിലനിർത്തിയിരിക്കുന്നു.
