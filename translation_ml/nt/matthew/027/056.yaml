  text: ἐν αἷς ἦν Μαρία ἡ Μαγδαληνὴ καὶ Μαρία ἡ τοῦ Ἰακώβου καὶ ⸀Ἰωσὴφ μήτηρ καὶ ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/056.yaml
  text: among whom were Mary Magdalene[a], and Mary the mother of James and Joseph, and the mother of the sons of Zebedee.
translation:
  language: ml
  text: അവരിൽ മഗ്ദലക്കാരിയായ മറിയയും യാക്കോബിന്റെയും യോസേഫിന്റെയും അമ്മയായ മറിയയും സെബെദിയുടെ പുത്രന്മാരുടെ അമ്മയും ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν αἷς
  choice: അവരിൽ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ സ്ത്രീകളുടെ കൂട്ടത്തിൽ ഇവരും ഉൾപ്പെട്ടിരുന്നു എന്ന ആപേക്ഷികബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: Μαρία ἡ Μαγδαληνὴ
  choice: മഗ്ദലക്കാരിയായ മറിയ
  rationale: മറിയയെ മഗ്ദല സ്വദേശിനിയായി തിരിച്ചറിയിക്കുന്ന ഗ്രീക്ക് വിശേഷണം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: Μαρία ἡ τοῦ Ἰακώβου καὶ Ἰωσὴφ μήτηρ
  choice: യാക്കോബിന്റെയും യോസേഫിന്റെയും അമ്മയായ മറിയ
  rationale: ബന്ധസൂചകമായ ഗ്രീക്ക് ഘടന നിലനിർത്തി ഈ മറിയയെ അവളുടെ മക്കളുടെ പേരിലൂടെ വ്യക്തമായി തിരിച്ചറിയിക്കുന്നു.
- source_word: Ἰωσὴφ
  choice: യോസേഫ്
  rationale: SBLGNT-യിലെ Ἰωσήφ എന്ന വായനയുടെ പതിവായ മലയാള ലിപ്യന്തരണം; മറ്റൊരു പാഠവായന അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου
  choice: സെബെദിയുടെ പുത്രന്മാരുടെ അമ്മ
  rationale: ഗ്രീക്കിലെ ബന്ധസൂചക ഘടനയോട് അടുത്തുനിൽക്കുന്നതും മലയാളത്തിൽ വ്യക്തവുമായ പ്രയോഗം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. വ്യക്തിനാമങ്ങൾ മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപങ്ങളിൽ നൽകിയിരിക്കുന്നു; വാക്യത്തിലെ പട്ടികാസ്വഭാവവും മുൻവാക്യത്തോടുള്ള ബന്ധവും നിലനിർത്തിയിരിക്കുന്നു.
