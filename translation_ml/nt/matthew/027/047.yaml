source:
  edition: SBLGNT
  text: τινὲς δὲ τῶν ἐκεῖ ⸀ἑστηκότων ἀκούσαντες ἔλεγον ὅτι Ἠλίαν φωνεῖ οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/047.yaml
  text: But some of those standing there[a], when they heard it, were saying[b], “This man is calling Elijah.”
translation:
  language: ml
  text: എന്നാൽ അവിടെ നിന്നിരുന്നവരിൽ ചിലർ അതു കേട്ടപ്പോൾ, “ഇയാൾ ഏലിയാവിനെ വിളിക്കുകയാണ്” എന്നു പറഞ്ഞുകൊണ്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: മുൻവാക്യത്തിലെ യേശുവിന്റെ നിലവിളി കേട്ടവർ അതിനെ ഏലിയാവിനോടുള്ള വിളിയായി തെറ്റിദ്ധരിച്ചിരിക്കാം.
    reason: cross_reference
lexical_decisions:
- source_word: τινὲς δὲ
  choice: എന്നാൽ ... ചിലർ
  rationale: τινὲς അനിശ്ചിതമായ ഒരു ഉപവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു; δὲ മുൻവാക്യത്തിൽനിന്നുള്ള നേരിയ വിരുദ്ധതയോ കഥാഗതിയിലെ വഴിത്തിരിവോ അടയാളപ്പെടുത്തുന്നു.
- source_word: τῶν ἐκεῖ ἑστηκότων
  choice: അവിടെ നിന്നിരുന്നവരിൽ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ perfect participle അവിടെ സന്നിഹിതരായി നിന്നിരുന്ന ആളുകളെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായും ദൃശ്യഭാവം നിലനിർത്തിയും വിവർത്തനം ചെയ്തു.
- source_word: ἀκούσαντες
  choice: അതു കേട്ടപ്പോൾ
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുണ്ടായ പ്രവൃത്തിയെ aorist participle സൂചിപ്പിക്കുന്നു. കർമം ഗ്രീക്കിൽ വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും മുൻവാക്യത്തിലെ യേശുവിന്റെ നിലവിളിയാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്; അതിനാൽ ‘അതു’ ചേർത്തു.
- source_word: ἔλεγον
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: Imperfect രൂപത്തിന്റെ തുടർച്ചാപരമായ ഭാവം നിലനിർത്തുന്നു; നിർബന്ധമായും ആവർത്തിച്ചു പറഞ്ഞു എന്ന അധിക അർഥം ചുമത്തുന്നില്ല.
- source_word: Ἠλίαν φωνεῖ
  choice: ഏലിയാവിനെ വിളിക്കുകയാണ്
  rationale: φωνεῖ എന്ന വർത്തമാനകാലക്രിയയും അതിന്റെ വ്യക്തിവാചക കർമവും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു. ‘സഹായത്തിനായി വിളിക്കുന്നു’ എന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: οὗτος
  choice: ഇയാൾ
  rationale: അടുത്തോ ദൃശ്യമായി ചൂണ്ടിക്കാണിക്കപ്പെടുന്ന പുരുഷനെ സൂചിപ്പിക്കുന്ന demonstrative force സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ‘അവൻ’ എന്നതിനെക്കാൾ ഗ്രീക്കിനോട് അടുത്തതാണ്.
theological_decisions:
- issue: കേട്ടുനിന്നവരുടെ വാക്കുകൾ യേശു യഥാർഥത്തിൽ ഏലിയാവിനെ വിളിച്ചു എന്ന പ്രസ്താവനയായി അവതരിപ്പിക്കണമോ, അവരുടെ ധാരണയായി മാത്രം അവതരിപ്പിക്കണമോ
  choice: 'അവരുടെ നേരിട്ടുള്ള വാക്കുകളായി: “ഇയാൾ ഏലിയാവിനെ വിളിക്കുകയാണ്”'
  alternative: “ഇയാൾ ഏലിയാവിന്റെ സഹായത്തിനായി വിളിക്കുകയാണ്” / അവർ യേശുവിന്റെ നിലവിളി തെറ്റിദ്ധരിച്ചു എന്നു മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കുക
  rationale: ഗ്രീക്ക് വാചകം കേട്ടുനിന്നവർ പറഞ്ഞത് മാത്രം റിപ്പോർട്ട് ചെയ്യുന്നു. അവരുടെ ധാരണ ശരിയോ തെറ്റോ എന്നു മുഖ്യപാഠം തീർപ്പാക്കാതെ കഥയിലെ ആശയസംഘർഷം നിലനിർത്തുന്നു; സാധ്യതയുള്ള തെറ്റിദ്ധാരണ അടിക്കുറിപ്പിൽ മാത്രം ചൂണ്ടിക്കാണിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ imperfect ഭാവത്തിന് ‘പറഞ്ഞുകൊണ്ടിരുന്നു’ എന്നും demonstrative ആയ οὗτος ന് ‘ഇയാൾ’ എന്നും നൽകി. അടിക്കുറിപ്പ് മാർക്കർ മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
