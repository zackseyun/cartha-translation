id: MAT.27.2
reference: Matthew 27:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ δήσαντες αὐτὸν ἀπήγαγον καὶ ⸀παρέδωκαν Πιλάτῳ τῷ ἡγεμόνι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/002.yaml
  text: And after binding him[b][a], they led him away and handed him over to Pilate the governor.
translation:
  language: ml
  text: അവർ അവനെ കെട്ടിയശേഷം[a] കൊണ്ടുപോയി ഗവർണറായ പീലാത്തൊസിന് ഏൽപ്പിച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവനെ കെട്ടി.”
    reason: δήσαντες എന്ന aorist participle-ന്റെ സാധ്യമായ സംക്ഷിപ്ത അവതരണം; പ്രധാന ക്രിയകൾക്കു മുമ്പുള്ള പ്രവൃത്തി സൂചിപ്പിക്കുന്നു.
  - marker: b
    text: അഥവാ, “കൈമാറി.”
    reason: παρέδωκαν എന്ന പദത്തിന് ഒരാളെ മറ്റൊരാളുടെ അധികാരത്തിലേക്കോ കസ്റ്റഡിയിലേക്കോ കൈമാറുക എന്ന അർഥമുള്ള സ്വാഭാവിക മലയാള പകരം.
lexical_decisions:
- source_word: δήσαντες
  choice: കെട്ടിയശേഷം
  rationale: δέω എന്ന ക്രിയയുടെ aorist participle പ്രധാന ക്രിയകൾക്കു മുമ്പ് നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘കെട്ടിയശേഷം’ ആ മുൻകാലബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുകയും ശരീരമായി ബന്ധിച്ചെന്ന മൂർത്തമായ അർഥം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἀπήγαγον
  choice: കൊണ്ടുപോയി
  rationale: ἀπάγω എന്നത് ഒരാളെ നയിച്ചോ കാവലിൽ കൊണ്ടോ അകറ്റിക്കൊണ്ടുപോകുന്നതിനെ സൂചിപ്പിക്കാം. ഈ നീതിന്യായ-കസ്റ്റഡി സന്ദർഭത്തിൽ ‘കൊണ്ടുപോയി’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: παρέδωκαν
  choice: ഏൽപ്പിച്ചുകൊടുത്തു
  rationale: παραδίδωμι ഇവിടെ ഒരാളെ മറ്റൊരാളുടെ അധികാരത്തിലോ കസ്റ്റഡിയിലോ ഏൽപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ഏൽപ്പിച്ചുകൊടുത്തു’ നിയമപരമായ ഉടൻസന്ദർഭം വ്യക്തമാക്കുമ്പോഴും ക്രിസ്തുവിന്റെ പീഡാനുഭവവിവരണത്തിലെ വിശാലമായ ധ്വനി ഇല്ലാതാക്കുന്നില്ല.
- source_word: Πιλάτῳ
  choice: പീലാത്തോസിന്
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്ത് dative ബന്ധം ‘-ന്’ ഉപയോഗിച്ച് പ്രകടിപ്പിച്ചു.
- source_word: τῷ ἡγεμόνι
  choice: നാടുവാഴിയായ
  rationale: ἡγεμών പൊതുവായി ഭരണാധികാരിയെ സൂചിപ്പിക്കുന്നു. ‘നാടുവാഴി’ സാധാരണ മലയാള വായനക്കാർക്ക് പരിചിതമായ പദമാണ്; ‘പ്രിഫെക്റ്റ്’ എന്നു നൽകി ഗ്രീക്ക് പദത്തേക്കാൾ ചരിത്രപരമായി അതിവിശദമാക്കുന്നത് ഒഴിവാക്കി.
theological_decisions:
- issue: പീഡാനുഭവവിവരണത്തിൽ παραδίδωμι എന്ന പദത്തിന്റെ അവതരണം
  choice: ഏൽപ്പിച്ചുകൊടുത്തു
  alternative: കൈമാറി
  rationale: ഈ വാക്യത്തിൽ ഉടൻ പ്രസക്തമായത് യേശുവിനെ പീലാത്തോസിന്റെ അധികാരത്തിന് ഏൽപ്പിച്ചതാണ്. ‘ഏൽപ്പിച്ചുകൊടുത്തു’ ആ നിയമ-കസ്റ്റഡി അർഥം നിലനിർത്തുന്നു; അതേസമയം പദത്തിന്റെ വിശാലമായ ദൈവശാസ്ത്രധ്വനി ഏകപക്ഷീയമായി നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി സ്വീകരിച്ചു. ഗ്രീക്ക് വാക്യത്തിലെ പ്രവൃത്തികളുടെ ക്രമം—കെട്ടുക, കൊണ്ടുപോകുക, അധികാരിക്ക് ഏൽപ്പിക്കുക—വ്യക്തമായി നിലനിർത്തി. ‘നാടുവാഴി’ എന്ന പ്രചാരത്തിലുള്ള ബൈബിൾ-ഭരണപദം ഉപയോഗിച്ചെങ്കിലും വാക്യഘടന ലളിതമാക്കി.
