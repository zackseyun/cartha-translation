- from: അവർ അവനെ കെട്ടിയശേഷം[a] കൊണ്ടുപോയി നാടുവാഴിയായ പീലാത്തോസിന് ഏൽപ്പിച്ചുകൊടുത്തു[b].
  to: അവർ അവനെ കെട്ടിയശേഷം[a] കൊണ്ടുപോയി ഗവർണറായ പീലാത്തൊസിന് ഏൽപ്പിച്ചു[b].
  rationale: ഭരണപദം ആധുനികവും സ്രോതസ്സിനോട് കൂടുതൽ ചേർന്നതുമായ «ഗവർണറായ» എന്നു തിരുത്തി. കൈമാറൽ/കസ്റ്റഡി എന്ന അർഥം നിലനിർത്തിക്കൊണ്ട് «ഏൽപ്പിച്ചുകൊടുത്തു» എന്ന അനാവശ്യ ആവർത്തനം «ഏൽപ്പിച്ചു» എന്നു ലളിതമാക്കി. മറ്റു വാക്യക്രമവും participle സൂചിപ്പിക്കുന്ന മുൻപ്രവൃത്തിയും നിലനിർത്തി.
