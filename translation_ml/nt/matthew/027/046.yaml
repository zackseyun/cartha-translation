  to: 'ഏകദേശം ഒമ്പതാം മണിക്കൂറിൽ യേശു ഉച്ചത്തിൽ നിലവിളിച്ചു: “ഏലീ, ഏലീ, ലെമാ സബഖ്താനി?”[a] അതിന്റെ അർഥം: “എന്റെ ദൈവമേ, എന്റെ ദൈവമേ, അങ്ങ് എന്നെ കൈവിട്ടതെന്ത്?”[b]'
