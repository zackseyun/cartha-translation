id: MAT.27.46
reference: Matthew 27:46
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: περὶ δὲ τὴν ἐνάτην ὥραν ⸀ἀνεβόησεν ὁ Ἰησοῦς φωνῇ μεγάλῃ λέγων· ⸂Ἠλὶ ἠλὶ⸃ λεμὰ σαβαχθάνι; τοῦτ’ ἔστιν· Θεέ μου θεέ μου, ἱνατί με ἐγκατέλιπες;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/046.yaml
  text: About the ninth hour Jesus cried out with a loud voice[a], saying, “Eli, Eli, lema sabachthani?” that is, “My God, my God[b], why have you forsaken me?”
translation:
  language: ml
  text: 'ഏകദേശം ഒമ്പതാം മണിക്കൂറിൽ യേശു ഉച്ചത്തിൽ നിലവിളിച്ചു: “ഏലീ, ഏലീ, ലെമാ സബഖ്താനി?”[a] അതിന്റെ അർഥം: “എന്റെ ദൈവമേ, എന്റെ ദൈവമേ, അങ്ങ് എന്നെ കൈവിട്ടതെന്ത്?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ വാക്കുകൾ സങ്കീർത്തനം 22:1-നെ പ്രതിധ്വനിപ്പിക്കുന്നു.
    reason: cross_reference
  - marker: b
    text: “എന്തിന് അങ്ങ് എന്നെ കൈവിട്ടു?” എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്ക് ക്രിയ അയോറിസ്റ്റ് രൂപത്തിലാണ്; മുഖ്യപാഠത്തിലെ മലയാളഘടന നിലവിളിയുടെ സ്വാഭാവിക ശക്തിയും സങ്കീർത്തനപ്രതിധ്വനിയും നിലനിർത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ τὴν ἐνάτην ὥραν
  choice: ഏകദേശം ഒമ്പതാം മണിക്കൂറിൽ
  rationale: περί സമയത്തിന്റെ ഏകദേശത സൂചിപ്പിക്കുന്നു. δέ ഇവിടെ നേരിയ ബന്ധകമായതിനാൽ പ്രത്യേകമായ ഒരു മുന്നുര ചേർക്കാതെ വാക്യത്തിന്റെ ഒഴുക്കിൽ ഉൾപ്പെടുത്തി.
- source_word: ἀνεβόησεν ... φωνῇ μεγάλῃ
  choice: ഉച്ചസ്വരത്തിൽ നിലവിളിച്ചുകൊണ്ട് പറഞ്ഞു
  rationale: ക്രിയയിലെ ശക്തമായ നിലവിളിയും φωνῇ μεγάλῃ എന്നതിലെ ശബ്ദത്തിന്റെ ഊന്നലും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; λέγων ഉദ്ധരണിയെ പരിചയപ്പെടുത്തുന്നു.
- source_word: Ἠλὶ ἠλὶ λεμὰ σαβαχθάνι
  choice: ഏലീ, ഏലീ, ലെമാ സബക്താനീ?
  rationale: മത്തായി സെമിറ്റിക് നിലവിളി ആദ്യം അതേപടി രേഖപ്പെടുത്തി പിന്നെ അതിന്റെ അർഥം നൽകുന്നതിനാൽ, ശബ്ദരൂപം മലയാളലിപിയിൽ നിലനിർത്തി.
- source_word: τοῦτ’ ἔστιν
  choice: അതിന്റെ അർഥം
  rationale: മുൻപുള്ള സെമിറ്റിക് വാക്കുകളുടെ വിവർത്തനം/വിശദീകരണം ഇതിനു പിന്നാലെയാണെന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: Θεέ μου θεέ μου
  choice: എന്റെ ദൈവമേ, എന്റെ ദൈവമേ
  rationale: നേരിട്ടുള്ള സംബോധനയും ആവർത്തനവും സങ്കീർത്തനം 22:1-നോടുള്ള പ്രതിധ്വനിയും സംരക്ഷിക്കുന്നു.
- source_word: ἱνατί με ἐγκατέλιπες
  choice: അങ്ങ് എന്നെ കൈവിട്ടതെന്ത്?
  rationale: ἱνατί എന്ന കാരണചോദ്യവും ἐγκαταλείπω എന്നതിന്റെ ഉപേക്ഷിക്കൽ/കൈവിടൽ എന്ന ശക്തിയും ഗൗരവമുള്ള, സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. ഈ ഘടന ഗ്രീക്ക് അയോറിസ്റ്റിന്റെ കാലസൂക്ഷ്മതയെ അനാവശ്യമായി തീർപ്പാക്കുന്നില്ല.
theological_decisions:
- issue: യേശുവിന്റെ നിലവിളിയും സങ്കീർത്തനം 22:1-ഉം തമ്മിലുള്ള ബന്ധം
  choice: നിലവിളിയെ യഥാർഥമായ കൈവിടപ്പെട്ടതിന്റെ ചോദ്യമായി നേരിട്ട് വിവർത്തനം ചെയ്യുകയും സങ്കീർത്തനപ്രതിധ്വനി നിലനിർത്തുകയും ചെയ്തു.
  alternative: ഇത് സങ്കീർത്തനത്തിലേക്കുള്ള സൂചന മാത്രമാണെന്നവിധം മൃദൂകരിക്കുകയോ കൈവിടലിന്റെ അനുഭവബലം പരാവർത്തനം ചെയ്ത് കുറയ്ക്കുകയോ ചെയ്യുക.
  rationale: ഗ്രീക്ക് പാഠം വ്യാഖ്യാനപരമായ വിശദീകരണമില്ലാതെ നിലവിളിയും അതിന്റെ വിവർത്തനവും നൽകുന്നു. അതിനാൽ അതിന്റെ ദൈവശാസ്ത്രപരമായ സംഘർഷം വിവർത്തനം തന്നെ പരിഹരിക്കുന്നില്ല.
- issue: സെമിറ്റിക് നിലവിളി മുഖ്യപാഠത്തിൽ നിലനിർത്തൽ
  choice: സെമിറ്റിക് വാക്കുകൾ മലയാളലിപിയിൽ നിലനിർത്തി, പിന്നാലെ അവയുടെ അർഥം നൽകി.
  alternative: അർഥം മാത്രം മലയാളത്തിൽ നൽകുക.
  rationale: മത്തായിയുടെ അവതരണക്രമം ഇതുതന്നെയാണ്; ചുറ്റുപാടിലുള്ളവർ ‘ഏലീ’ എന്നത് തെറ്റിദ്ധരിക്കുന്ന തുടർവിവരണത്തിനും ഈ രൂപം പ്രസക്തമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ദൈവത്തോടുള്ള സംബോധനയിൽ മാന്യമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു. സെമിറ്റിക് നിലവിളി ഗ്രീക്ക് പാഠത്തിലെ ക്രമം അനുസരിച്ച് മലയാളലിപിയിൽ നൽകിയിരിക്കുന്നു.
