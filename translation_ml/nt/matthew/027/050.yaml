id: MAT.27.50
reference: Matthew 27:50
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς πάλιν κράξας φωνῇ μεγάλῃ ἀφῆκεν τὸ πνεῦμα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/050.yaml
  text: But Jesus cried out again with a loud voice and gave up his spirit[a].
translation:
  language: ml
  text: എന്നാൽ യേശു വീണ്ടും വലിയ ശബ്ദത്തിൽ വിളിച്ച് തന്റെ ആത്മാവിനെ വിട്ടു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവസാനശ്വാസം വിട്ടു.’ ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘ആത്മാവിനെ വിട്ടു’ എന്നാണ്; ഇത് മരണം സൂചിപ്പിക്കുന്ന ഒരു പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: δέ ഇവിടെ വിവരണത്തിന്റെ തുടർച്ചയോടൊപ്പം നേരിയ വൈരുധ്യവും പുതിയ വഴിത്തിരിവും സൂചിപ്പിക്കുന്നു; ‘എന്നാൽ’ അത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: πάλιν ആവർത്തനത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്നു; ‘വീണ്ടും’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: κράξας
  choice: നിലവിളിച്ച്
  rationale: κράζω ഉച്ചത്തിലുള്ള ശക്തമായ വിളിയെ സൂചിപ്പിക്കുന്നു; കർത്തൃസമാനകാലിക ക്രിയാവിശേഷണരൂപമായ ‘നിലവിളിച്ച്’ മുഖ്യക്രിയയുമായുള്ള ബന്ധവും നിലനിർത്തുന്നു.
- source_word: φωνῇ μεγάλῃ
  choice: ഉച്ചത്തിൽ
  rationale: ശബ്ദത്തിന്റെ ശക്തി സൂചിപ്പിക്കുന്ന ഈ ദത്തിവാക്യത്തെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായി ‘ഉച്ചത്തിൽ’ എന്നു നൽകുന്നു.
- source_word: ἀφῆκεν
  choice: വിട്ടു
  rationale: ἀφίημι എന്നതിന്റെ ‘വിടുക, വിട്ടയക്കുക’ എന്ന അടിസ്ഥാനഭാവം τὸ πνεῦμα എന്നതിനോടൊപ്പം നിലനിർത്തുന്നു; മരണത്തെ വ്യാഖ്യാനാത്മകമായി മാത്രം പറഞ്ഞുതീർക്കുന്നില്ല.
- source_word: τὸ πνεῦμα
  choice: തന്റെ ആത്മാവിനെ
  rationale: ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘ആത്മാവിനെ’ എന്നാണ്. മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗത്തിനായി കർത്താവിലേക്കു തിരിച്ചുപോകുന്ന ‘തന്റെ’ ചേർത്തു; πνεῦμα എന്നതിന്റെ ആത്മാവ്/ശ്വാസം എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ἀφῆκεν τὸ πνεῦμα എന്ന മരണപ്രയോഗത്തിന്റെ പരിഭാഷ
  choice: തന്റെ ആത്മാവിനെ വിട്ടു
  alternative: അന്ത്യശ്വാസം വിട്ടു
  rationale: ‘അന്ത്യശ്വാസം വിട്ടു’ എന്നത് മരണത്തെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുമെങ്കിലും πνεῦμα എന്ന പദത്തെ ‘ശ്വാസം’ എന്ന ഒരർഥത്തിലേക്ക് ചുരുക്കുന്നു. ‘തന്റെ ആത്മാവിനെ വിട്ടു’ ഉറവിടത്തിലെ പദപ്രയോഗവും അതിലുള്ള ദൈവശാസ്ത്രപരമായ ഭാരം കൂടാതെ അർഥവ്യാപ്തിയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളം. ഗ്രീക്ക് വാക്യത്തിന്റെ സംക്ഷിപ്തതയും ക്രിയാക്രമവും കഴിയുന്നത്ര നിലനിർത്തിയിരിക്കുന്നു.
