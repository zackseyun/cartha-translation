  to: 'തന്റെ ശ്രമംകൊണ്ട് ഒരു പ്രയോജനവുമില്ലെന്നും പകരം ഒരു കലാപം പൊട്ടിപ്പുറപ്പെടുകയാണെന്നും പീലാത്തോസ് കണ്ടപ്പോൾ, വെള്ളമെടുത്ത് ജനക്കൂട്ടത്തിന്റെ മുമ്പിൽ കൈകൾ കഴുകി പറഞ്ഞു: “ഈ രക്തത്തിന്റെ ഉത്തരവാദിത്വത്തിൽനിന്ന് ഞാൻ നിരപരാധിയാണ്[a]; നിങ്ങൾതന്നെ അതിന്റെ കാര്യം നോക്കിക്കൊള്ളുക[b].”'
