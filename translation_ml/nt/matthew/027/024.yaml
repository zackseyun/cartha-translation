id: MAT.27.24
reference: Matthew 27:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Πιλᾶτος ὅτι οὐδὲν ὠφελεῖ ἀλλὰ μᾶλλον θόρυβος γίνεται λαβὼν ὕδωρ ἀπενίψατο τὰς χεῖρας ⸀ἀπέναντι τοῦ ὄχλου λέγων· Ἀθῷός εἰμι ἀπὸ τοῦ ⸀αἵματος τούτου· ὑμεῖς ὄψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/024.yaml
  text: So when Pilate saw that he was gaining nothing[a], but rather that a riot was developing, he took water and washed his hands before the crowd, saying, “I am innocent of this blood[c][b]; you yourselves will see to it.”
translation:
  language: ml
  text: 'തന്റെ ശ്രമംകൊണ്ട് ഒരു പ്രയോജനവുമില്ലെന്നും പകരം ഒരു കലാപം പൊട്ടിപ്പുറപ്പെടുകയാണെന്നും പീലാത്തോസ് കണ്ടപ്പോൾ, വെള്ളമെടുത്ത് ജനക്കൂട്ടത്തിന്റെ മുമ്പിൽ കൈകൾ കഴുകി പറഞ്ഞു: “ഈ രക്തത്തിന്റെ ഉത്തരവാദിത്വത്തിൽനിന്ന് ഞാൻ നിരപരാധിയാണ്[a]; നിങ്ങൾതന്നെ അതിന്റെ കാര്യം നോക്കിക്കൊള്ളുക[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “ഈ രക്തത്തിൽനിന്ന് ഞാൻ നിരപരാധിയാണ്.” ഒരാളുടെ മരണത്തിനുള്ള ഉത്തരവാദിത്വത്തിൽനിന്ന് ഒഴിഞ്ഞുനിൽക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: “നിങ്ങൾതന്നെ അതു കണ്ടുകൊള്ളുക”; അക്ഷരാർഥം: “നിങ്ങൾ കാണും.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ ὁ Πιλᾶτος
  choice: പീലാത്തോസ് കണ്ടപ്പോൾ
  rationale: δέ ഇവിടെ ആഖ്യാനത്തിന്റെ അടുത്ത ഘട്ടത്തിലേക്കുള്ള മൃദുവായ മാറ്റമാണ്; മലയാളത്തിലെ ഉപവാക്യക്രമം ഈ ബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നതിനാൽ പ്രത്യേക സംയോജകം ആവശ്യമില്ല.
- source_word: ὅτι οὐδὲν ὠφελεῖ
  choice: തന്റെ ശ്രമംകൊണ്ട് ഒരു പ്രയോജനവുമില്ലെന്ന്
  rationale: അക്ഷരാർഥം ‘ഒന്നും പ്രയോജനപ്പെടുന്നില്ല’ എന്നാണ്. സന്ദർഭത്തിൽ പീലാത്തോസിന്റെ ഇടപെടൽ ഫലിക്കുന്നില്ലെന്ന സൂചന വ്യക്തമാക്കാൻ ‘തന്റെ ശ്രമംകൊണ്ട്’ ചേർത്തു.
- source_word: ἀλλὰ μᾶλλον θόρυβος γίνεται
  choice: പകരം ഒരു കലാപം പൊട്ടിപ്പുറപ്പെടുകയാണെന്ന്
  rationale: θόρυβος എന്നത് കോലാഹലം, പ്രക്ഷോഭം, കലാപം എന്നിവ സൂചിപ്പിക്കാം; ഇവിടെ വർധിച്ചുവരുന്ന ജനക്കൂട്ടക്കുഴപ്പം ‘കലാപം പൊട്ടിപ്പുറപ്പെടുന്നു’ എന്ന് സ്വാഭാവികമായി നൽകി.
- source_word: λαβὼν ὕδωρ ἀπενίψατο τὰς χεῖρας
  choice: വെള്ളമെടുത്ത് ... കൈ കഴുകിക്കൊണ്ട്
  rationale: വെള്ളം എടുത്ത ശേഷമുള്ള പ്രതീകാത്മക പ്രവൃത്തി ലളിതവും ദൃശ്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀπέναντι τοῦ ὄχλου
  choice: ജനക്കൂട്ടത്തിന്റെ മുമ്പിൽ
  rationale: പ്രവൃത്തി ജനങ്ങൾ കാണത്തക്കവിധം പരസ്യമായി നടന്നുവെന്ന സ്ഥലപരവും പൊതുവുമായ അർഥം സംരക്ഷിക്കുന്നു.
- source_word: Ἀθῷός εἰμι ἀπὸ τοῦ αἵματος τούτου
  choice: ഈ രക്തത്തിന്റെ ഉത്തരവാദിത്വത്തിൽനിന്ന് ഞാൻ നിരപരാധിയാണ്
  rationale: ഗ്രീക്കിലെ ‘ഈ രക്തത്തിൽനിന്ന് നിരപരാധി’ എന്ന പ്രയോഗം ഒരാളുടെ മരണത്തിനുള്ള കുറ്റബാധ്യതയെ സൂചിപ്പിക്കുന്നു. ‘ഈ രക്തം’ നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ ഉദ്ദേശ്യം ഗ്രഹിക്കാവുന്നവിധം ഉത്തരവാദിത്വം വ്യക്തമാക്കി.
- source_word: ὑμεῖς ὄψεσθε
  choice: നിങ്ങൾതന്നെ നോക്കിക്കൊള്ളുക
  rationale: അക്ഷരാർഥം ‘നിങ്ങൾ കാണും’ എന്നാണെങ്കിലും ഇവിടെ ഉത്തരവാദിത്വം ഏറ്റെടുക്കാൻ പറയുന്ന പ്രയോഗമാണ്; ὑμεῖς എന്ന ഊന്നൽ ‘നിങ്ങൾതന്നെ’ എന്ന് സംരക്ഷിച്ചു.
theological_decisions:
- issue: പീലാത്തോസ് പ്രഖ്യാപിക്കുന്ന നിരപരാധിത്വം
  choice: പീലാത്തോസിന്റെ സ്വന്തം ഉത്തരവാദിത്വനിഷേധമായി നേരിട്ടുള്ള ഉദ്ധരണിയിൽ നിലനിർത്തി.
  alternative: ‘ഈ രക്തത്തിൽനിന്ന് ഞാൻ നിരപരാധിയാണ്’ എന്ന കൂടുതൽ അക്ഷരാനുസൃത രൂപം.
  rationale: വിവർത്തനം പീലാത്തോസിന്റെ അവകാശവാദം സത്യമാണെന്ന് അംഗീകരിക്കുന്നില്ല; അതേ സമയം ആഖ്യാനത്തിലെ ധാർമികവും ദൈവശാസ്ത്രപരവുമായ സംഘർഷം തീർപ്പാക്കാതെയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവമുള്ള മലയാളം. നിയമപരമായ ഉത്തരവാദിത്വനിഷേധവും ജനക്കൂട്ടത്തിനു മുമ്പിലെ പ്രതീകാത്മക പ്രവൃത്തിയും വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു.
