review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Pilate's recognition that his efforts were ineffective, the escalating public disturbance, his public handwashing, his disclaimer of responsibility, and the emphatic transfer to the crowd. The idiomatic force of ὑμεῖς ὄψεσθε is appropriately rendered as a charge to the crowd to take responsibility. A small revision is needed because the Greek presents washing his hands as completed before he speaks, whereas കൈ കഴുകിക്കൊണ്ട് പറഞ്ഞു can imply that he spoke while washing.
  naturalness: The Malayalam is modern and generally natural. കൈകൾ കഴുകി പറഞ്ഞു gives the action sequence more naturally and precisely. നിങ്ങൾതന്നെ അതിന്റെ കാര്യം നോക്കിക്കൊള്ളുക makes the idiomatic Malayalam sense explicit without obscuring the source's responsibility-implying expression.
  terminology: പീലാത്തോസ്, ജനക്കൂട്ടം, കലാപം, നിരപരാധി, and ഉത്തരവാദിത്വം fit the register. “ഈ രക്തത്തിന്റെ ഉത്തരവാദിത്വത്തിൽനിന്ന് ഞാൻ നിരപരാധിയാണ്” responsibly explains the Greek idiom while retaining “this blood”; the footnote preserves the literal wording.
  issues:
  - severity: low
    issue: The participial wording കൈ കഴുകിക്കൊണ്ട് പറഞ്ഞു can suggest simultaneous washing and speaking.
    rationale: λαβὼν and the aorist main verb ἀπενίψατο narrate the washing before λέγων introduces Pilate's speech. Malayalam should reflect this sequence.
  - severity: low
    issue: The responsibility idiom in the final clause can be slightly clearer.
    rationale: നോക്കിക്കൊള്ളുക is acceptable, but അതിന്റെ കാര്യം makes clear that the crowd is being told to take care of or assume responsibility for the matter, while the footnote retains the literal alternative.
