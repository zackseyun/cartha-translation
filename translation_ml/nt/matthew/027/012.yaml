  source_fidelity: 'The Malayalam accurately conveys the contemporaneous passive accusation (ἐν τῷ κατηγορεῖσθαι αὐτόν) through an idiomatic active restructuring: the chief priests and elders were bringing accusations against him. “ഒന്നും മറുപടി പറഞ്ഞില്ല” faithfully represents οὐδὲν ἀπεκρίνατο. The omitted sentence-initial equivalent of καί is natural in Malayalam narrative flow and introduces no added contrast.'
