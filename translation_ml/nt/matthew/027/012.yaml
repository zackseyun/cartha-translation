id: MAT.27.12
reference: Matthew 27:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐν τῷ κατηγορεῖσθαι αὐτὸν ὑπὸ τῶν ἀρχιερέων ⸀καὶ πρεσβυτέρων οὐδὲν ἀπεκρίνατο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/012.yaml
  text: And while he was being accused by the chief priests and elders[a], he answered nothing.
translation:
  language: ml
  text: മുഖ്യപുരോഹിതന്മാരും മൂപ്പന്മാരും അവന്റെമേൽ കുറ്റം ചുമത്തിക്കൊണ്ടിരുന്നപ്പോൾ, അവൻ ഒന്നും മറുപടി പറഞ്ഞില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൻ ഒരു ഉത്തരവും നൽകിയില്ല.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ κατηγορεῖσθαι
  choice: കുറ്റം ചുമത്തിക്കൊണ്ടിരുന്നപ്പോൾ
  rationale: ἐν + വർത്തമാനകാല articular infinitive ഒരേ സമയത്ത് തുടരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ഈ പ്രയോഗം അതിന്റെ കാലികവും ദൈർഘ്യാത്മകവുമായ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: κατηγορεῖσθαι
  choice: അവന്റെമേൽ കുറ്റം ചുമത്തിക്കൊണ്ടിരുന്ന
  rationale: നിഷ്ക്രിയരൂപം യേശുവിനെതിരെ കുറ്റാരോപണങ്ങൾ ഉന്നയിക്കപ്പെട്ടുകൊണ്ടിരുന്നതായി വ്യക്തമാക്കുന്നു; ‘കുറ്റം ചുമത്തുക’ നിയമസന്ദർഭത്തിന് യോജിച്ച സാധാരണ മലയാളമാണ്.
- source_word: ὑπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων
  choice: മുഖ്യപുരോഹിതന്മാരും മൂപ്പന്മാരും
  rationale: സുവിശേഷങ്ങളിലെ ἀρχιερεῖς മുഖ്യപുരോഹിത നേതൃത്വത്തെയും πρεσβύτεροι മൂപ്പന്മാരെയും സൂചിപ്പിക്കുന്നു; മലയാള ബൈബിൾ ഭാഷയിലും പൊതുവായ ഉപയോഗത്തിലും ഈ പദങ്ങൾ വ്യക്തമാണ്.
- source_word: οὐδὲν
  choice: ഒന്നും
  rationale: ἀπεκρίνατοയുടെ ആശയപൂരകമായി ‘ഒന്നും’ എന്നത് ഗ്രീക്കിന്റെ നേരിട്ടുള്ള നിഷേധം സംരക്ഷിക്കുന്നു.
- source_word: ἀπεκρίνατο
  choice: മറുപടി പറഞ്ഞില്ല
  rationale: ‘ഉത്തരം പറഞ്ഞു’ എന്നതിനെക്കാൾ ഈ സാഹചര്യത്തിൽ സ്വാഭാവികമായ മലയാളപ്രയോഗമാണിത്; οὐδὲν സഹിതമുള്ള ‘ഒന്നും മറുപടി പറഞ്ഞില്ല’ മൂലവാക്യത്തിന്റെ അർത്ഥം വ്യാഖ്യാനാതിക്രമമില്ലാതെ നൽകുന്നു.
- source_word: καὶ
  choice: വാക്യക്രമത്തിലൂടെ ബന്ധം നിലനിർത്തി; പ്രത്യേകം ‘അപ്പോൾ/എന്നാൽ’ ചേർത്തില്ല
  rationale: ഗ്രീക്കിലെ καὶ ലളിതമായ ആഖ്യാനബന്ധമാണ്. മലയാളത്തിൽ മുൻവാക്യവുമായി ബന്ധം സ്വാഭാവികമായി തുടരുന്നതിനാൽ തുടക്കത്തിൽ നിർബന്ധമായി ഒരു ബന്ധകപദം ചേർക്കേണ്ടതില്ല; വിരോധഭാവവും ഇറക്കുമതി ചെയ്യുന്നില്ല.
theological_decisions:
- issue: കുറ്റാരോപകരുടെ മുമ്പിലെ യേശുവിന്റെ മൗനം
  choice: പ്രവചനനിവൃത്തി സംബന്ധിച്ച വിശദീകരണം ചേർക്കാതെ സംഭവത്തെ നേരിട്ടുള്ള ആഖ്യാനമായി വിവർത്തനം ചെയ്തു.
  alternative: യെശയ്യാവ് 53-ന്റെ പ്രതിധ്വനി കൂടുതൽ വ്യക്തമാക്കുന്ന വിധത്തിൽ ‘അവൻ മൗനം പാലിച്ചു’ എന്നു വ്യാഖ്യാനാത്മകമായി നൽകുക.
  rationale: ഈ വാക്യം യേശു മറുപടി പറഞ്ഞില്ല എന്ന സംഭവവിവരം മാത്രം നേരിട്ട് പ്രസ്താവിക്കുന്നു; പ്രവചനബന്ധം ഇവിടെ വ്യക്തമായി പറയാത്തതിനാൽ അത് വിവർത്തനത്തിലേക്ക് ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘മുഖ്യപുരോഹിതന്മാർ’, ‘മൂപ്പന്മാർ’ എന്നീ സ്ഥാപിത ബൈബിൾ പദങ്ങൾ നിലനിർത്തി; ബാക്കി വാക്യഘടന സ്വാഭാവിക മലയാളത്തിലാക്കി. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
