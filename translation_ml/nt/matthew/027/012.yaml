  terminology: “മുഖ്യപുരോഹിതന്മാർ” and “മൂപ്പന്മാർ” are established, understandable biblical terms for ἀρχιερεῖς and πρεσβύτεροι. No doctrinal interpretation is imported. The footnote gives a legitimate natural alternative without changing the sense.
