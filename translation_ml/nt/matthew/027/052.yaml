  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ τὰ μνημεῖα ἀνεῴχθησαν καὶ πολλὰ σώματα τῶν κεκοιμημένων ἁγίων ⸀ἠγέρθησαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/052.yaml
  text: And the tombs were opened[a], and many bodies of the saints who had fallen asleep were raised,
translation:
  language: ml
  text: കല്ലറകൾ തുറക്കപ്പെട്ടു, നിദ്ര പ്രാപിച്ചിരുന്ന വിശുദ്ധരുടെ അനേകം ശരീരങ്ങളും ഉയിർപ്പിക്കപ്പെട്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നിദ്ര പ്രാപിച്ചിരുന്ന” എന്നത് “മരിച്ചിരുന്ന” എന്ന അർഥത്തിൽ ഉപയോഗിക്കുന്ന ഒരു സാധാരണ പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ μνημεῖα
  choice: കല്ലറകൾ
  rationale: ശവസംസ്കാരസ്ഥലങ്ങളെ സൂചിപ്പിക്കുന്ന μνημεῖον എന്ന പദത്തിന് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭോചിതവുമായ തത്തുല്യം.
- source_word: ἀνεῴχθησαν
  choice: തുറക്കപ്പെട്ടു
  rationale: ക്രിയയുടെ അയോറിസ്റ്റ് കർമണി രൂപം നിലനിർത്തുന്നു; കല്ലറകൾ എങ്ങനെ തുറന്നു എന്നത് കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: πολλὰ σώματα
  choice: അനേകം ശരീരങ്ങൾ
  rationale: σῶμα എന്ന നിഷ്പക്ഷ പദത്തിന്റെ അർഥം സംരക്ഷിക്കുന്നു; ‘മൃതശരീരങ്ങൾ’ എന്നു വ്യാഖ്യാനിച്ച് കടുപ്പിക്കുന്നില്ല.
- source_word: τῶν κεκοιμημένων
  choice: നിദ്രപ്രാപിച്ചിരുന്ന
  rationale: മരണത്തെ സൂചിപ്പിക്കുന്ന κοιμάομαι എന്ന പ്രയോഗശൈലി മലയാളത്തിൽ മാന്യവും ഗ്രഹിക്കാവുന്നതുമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἁγίων
  choice: വിശുദ്ധരുടെ
  rationale: ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ടവരെ സൂചിപ്പിക്കുന്ന ἅγιοι എന്ന നാമപ്രയോഗത്തിന് പുതിയ നിയമത്തിലുടനീളം ഉപയോഗിക്കാവുന്ന സാധാരണ തത്തുല്യം.
- source_word: ἠγέρθησαν
  choice: ഉയിർപ്പിക്കപ്പെട്ടു
  rationale: ἐγείρω എന്ന ക്രിയയുടെ കർമണി രൂപവും മരണത്തിൽനിന്ന് എഴുന്നേൽപ്പിക്കപ്പെടുന്ന അർഥവും നൽകുന്നു; സംഭവത്തിന്റെ അന്തിമ ദൈവശാസ്ത്രസ്വഭാവം പ്രത്യേകം നിർവചിക്കുന്നില്ല.
theological_decisions:
- issue: ἠγέρθησαν സൂചിപ്പിക്കുന്ന സംഭവത്തിന്റെ സ്വഭാവം
  choice: ഉയിർപ്പിക്കപ്പെട്ടു
  alternative: പുനരുത്ഥാനം പ്രാപിച്ചു
  rationale: ക്രിയയുടെ പുനരുജ്ജീവനാർഥം വ്യക്തമാക്കുമ്പോഴും ഇത് അന്തിമ പുനരുത്ഥാനമാണോ താൽക്കാലികമായി ജീവനിലേക്കുള്ള മടക്കമാണോ എന്ന ചോദ്യം ഈ വാക്യത്തിൽ മാത്രം തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ ഏകോപിത വാക്യഘടന മലയാളത്തിലെ വിരാമചിഹ്നം ഉപയോഗിച്ച് വായനാസൗകര്യത്തോടെ അവതരിപ്പിച്ചിരിക്കുന്നു; ആരംഭത്തിലെ καὶ മുൻവാക്യത്തോടുള്ള ബന്ധമാണെന്നതിനാൽ ഒറ്റവാക്യ ഉദ്ധരണിയിൽ നിർബന്ധിതമായി ‘എന്നിട്ട്’ ചേർത്തിട്ടില്ല.
