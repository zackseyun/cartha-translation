  to: കല്ലറകൾ തുറക്കപ്പെട്ടു, നിദ്ര പ്രാപിച്ചിരുന്ന വിശുദ്ധരുടെ അനേകം ശരീരങ്ങളും ഉയിർപ്പിക്കപ്പെട്ടു.[a]
  rationale: The revision retains every source element and the deliberately neutral passive «ഉയിർപ്പിക്കപ്പെട്ടു». It improves modern Malayalam flow, represents the coordinated Greek clauses more clearly, and corrects the explanatory note without resolving any theological question beyond the verse.
