id: MAT.27.57
reference: Matthew 27:57
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὀψίας δὲ γενομένης ἦλθεν ἄνθρωπος πλούσιος ἀπὸ Ἁριμαθαίας, τοὔνομα Ἰωσήφ, ὃς καὶ αὐτὸς ⸀ἐμαθητεύθη τῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/057.yaml
  text: When evening had come[a], a rich man from Arimathea came, named Joseph[b], who himself also had become a disciple of Jesus.
translation:
  language: ml
  text: സന്ധ്യയായപ്പോൾ, അരിമഥ്യയിൽനിന്നുള്ള യോസേഫ് എന്നു പേരുള്ള ഒരു ധനികൻ വന്നു. അദ്ദേഹവും യേശുവിന്റെ ശിഷ്യനായിത്തീർന്നിരുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് ക്രിയയെ “യേശുവിന്റെ ശിഷ്യനാക്കപ്പെട്ടിരുന്നു” എന്നോ “യേശുവിന്റെ ശിഷ്യനായിരുന്നു” എന്നോ പരിഭാഷപ്പെടുത്താനും കഴിയും.
    reason: മൂലത്തിലെ ἐμαθητεύθη എന്ന പാസീവ് ക്രിയ ശിഷ്യനായിത്തീരുക, ശിഷ്യനാക്കപ്പെടുക, ശിഷ്യനായിരിക്കുക എന്നീ അടുത്ത അർഥസാധ്യതകൾ അനുവദിക്കുന്നു.
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: സന്ധ്യയായപ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് രൂപത്തിലുള്ള സമയസൂചനയെ സ്വാഭാവികമായ മലയാള കാലവാക്യമായി നൽകുന്നു. δέ സൂചിപ്പിക്കുന്ന മൃദുവായ ആഖ്യാനമാറ്റം സന്ദർഭത്തിലൂടെ വ്യക്തമാകുന്നതിനാൽ പ്രത്യേക ബന്ധകപദം ചേർത്തിട്ടില്ല.
- source_word: ἦλθεν
  choice: വന്നു
  rationale: ἔρχομαι എന്ന ക്രിയയുടെ ലളിതമായ ആഖ്യാനപ്രയോഗത്തിന് നേരിട്ടും സ്വാഭാവികവുമായ തുല്യപദം.
- source_word: ἄνθρωπος πλούσιος
  choice: ഒരു ധനികൻ
  rationale: ലിംഗവും സമ്പന്നതയും സ്വാഭാവികവും സംക്ഷിപ്തവുമായി വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ ‘മനുഷ്യൻ’ പ്രത്യേകം ചേർക്കേണ്ടതില്ല.
- source_word: ἀπὸ Ἁριμαθαίας
  choice: അരിമഥ്യയിൽനിന്നുള്ള
  rationale: ἀπό സൂചിപ്പിക്കുന്ന സ്ഥലമൂലത്തെ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: τοὔνομα Ἰωσήφ
  choice: യോസേഫ് എന്നു പേരുള്ള
  rationale: തിരിച്ചറിയൽ നൽകുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: ὃς καὶ αὐτὸς
  choice: അദ്ദേഹവും
  rationale: καί, αὐτός എന്നിവ ചേർന്നുള്ള ‘അയാളും/അദ്ദേഹവും കൂടെ’ എന്ന ഊന്നൽ സ്വാഭാവികമായി നൽകുന്നു. ‘സ്വയം’ എന്നു ചേർത്താൽ മറ്റാരുടെയും സഹായമില്ലാതെ എന്ന അനാവശ്യ അർഥം വരാം.
- source_word: ἐμαθητεύθη τῷ Ἰησοῦ
  choice: യേശുവിന്റെ ശിഷ്യനായിത്തീർന്നിരുന്നു
  rationale: മുൻകാലത്തുതന്നെ ഉണ്ടായ ശിഷ്യത്വസ്ഥിതിയെ വ്യക്തമാക്കുകയും, ശിഷ്യനാകുക എന്നും ശിഷ്യനാക്കപ്പെടുക എന്നും ഗ്രഹിക്കാവുന്ന പാസീവ് ക്രിയയുടെ അർഥപരിധി പ്രധാനവാചകത്തിൽ അതിരുകടന്ന് നിർണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ἐμαθητεύθη എന്ന പാസീവ് ക്രിയ യേശുവുമായുള്ള ബന്ധത്തിൽ എങ്ങനെ ഗ്രഹിക്കണം
  choice: യേശുവിന്റെ ശിഷ്യനായിത്തീർന്നിരുന്നു
  alternative: യേശുവിന്റെ ശിഷ്യനാക്കപ്പെട്ടിരുന്നു; യേശുവിന്റെ ശിഷ്യനായിരുന്നു
  rationale: വാക്യം യോസേഫിനെ യേശുവിന്റെ ശിഷ്യരിൽ ഒരാളായി തിരിച്ചറിയുന്നു. അവൻ ശിഷ്യത്വത്തിലേക്കു വന്ന പ്രക്രിയയെക്കുറിച്ചോ യേശു നേരിട്ട് അവനെ പഠിപ്പിച്ചുവെന്നതിനെക്കുറിച്ചോ ആവശ്യത്തിലധികം നിർണയിക്കാതെ, ഗ്രീക്ക് പാസീവിലെ യഥാർഥ വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അദ്ദേഹവും’ എന്ന രൂപം യോസേഫിനുള്ള ഗ്രീക്ക് ഊന്നൽ സ്വാഭാവികമായി വഹിക്കുന്നു. ഗ്രീക്കിലെ ഒറ്റ ദീർഘവാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് മലയാളവാക്യങ്ങളാക്കി.
