    issue: ‘വേണ്ട’ for Ἄφες
    rationale: Ἄφες is an imperative telling someone to leave off or let be. ‘വേണ്ട’ is not itself an imperative of cessation and can alter the speech act. ‘വിടൂ’ retains the imperative while preserving the Greek’s unexpressed object.
