id: MAT.27.49
reference: Matthew 27:49
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ λοιποὶ ⸀ἔλεγον· Ἄφες ἴδωμεν εἰ ἔρχεται Ἠλίας σώσων ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/049.yaml
  text: But the rest said[a], “Leave him alone[b]. Let us see whether Elijah is coming to save him.”
translation:
  language: ml
  text: 'എന്നാൽ മറ്റുള്ളവർ പറഞ്ഞു[a]: “വിടൂ; ഏലിയാവ് അവനെ രക്ഷിക്കാൻ വരുന്നുണ്ടോ[b] എന്നു നമുക്കു നോക്കാം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ശേഷിച്ചവർ പറഞ്ഞുകൊണ്ടിരുന്നു.’
    reason: λοιποί എന്നതിന് ‘ശേഷിച്ചവർ’ എന്നും അപൂർണ്ണ ഭൂതകാലമായ ἔλεγον എന്നതിന് തുടർച്ചയോ ആവർത്തനമോ സൂചിപ്പിക്കുന്ന ‘പറഞ്ഞുകൊണ്ടിരുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം.
  - marker: b
    text: അഥവാ, ‘ഏലിയാവ് വന്ന് അവനെ രക്ഷിക്കുമോ എന്നു നമുക്കു നോക്കാം.’ പരോക്ഷചോദ്യത്തിൽ ഗ്രീക്ക് വർത്തമാനകാലരൂപമായ ‘വരുന്നു’ എന്നാണ് ഉപയോഗിക്കുന്നത്.
    reason: εἰ ἔρχεται എന്നതിലെ വർത്തമാനകാലത്തിന്റെ അടിയന്തരഭാവവും മലയാളത്തിൽ സാധ്യമായ ഭാവികാലാർഥമുള്ള സ്വാഭാവിക പകരവും വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: οἱ δὲ λοιποὶ
  choice: എന്നാൽ മറ്റുള്ളവർ
  rationale: δέ സൂചിപ്പിക്കുന്ന വൈരുധ്യം ‘എന്നാൽ’ നിലനിർത്തുന്നു; λοιποί മുൻപ് പ്രവർത്തിച്ച വ്യക്തിയിൽനിന്നു വേർതിരിച്ചുള്ള ശേഷിച്ച ആളുകളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘മറ്റുള്ളവർ’ സ്വാഭാവികമാണ്.
- source_word: ἔλεγον
  choice: പറഞ്ഞു
  rationale: അപൂർണ്ണ ഭൂതകാലരൂപത്തിന് തുടർച്ചയോ ആവർത്തനമോ സൂചിപ്പിക്കാനാകുമെങ്കിലും, ഈ വിവരണത്തിൽ ലളിതമായ ‘പറഞ്ഞു’ സ്വാഭാവികവും അതിവ്യാഖ്യാനം ഒഴിവാക്കുന്നതുമാണ്.
- source_word: Ἄφες
  choice: വേണ്ട
  rationale: ഏകവചന ആജ്ഞാരൂപമായ Ἄφες ഇവിടെ പുളിച്ച വീഞ്ഞ് കൊടുക്കാൻ ശ്രമിക്കുന്നയാളോട് ഇടപെടൽ നിർത്താൻ പറയുന്നതാണ്. മലയാളത്തിലെ ‘വേണ്ട’ ആ സാഹചര്യാർഥം ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു; ‘അവനെ വിട്ടേക്കൂ’ എന്നത് യേശുവിനെ പിടിച്ചുവെച്ചിരിക്കുന്നുവെന്ന അനാവശ്യ ധ്വനി സൃഷ്ടിക്കാം.
- source_word: ἴδωμεν
  choice: നമുക്കു നോക്കാം
  rationale: ഒന്നാംപുരുഷ ബഹുവചന ഹോർട്ടേറ്ററി സബ്ജങ്ക്റ്റീവിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളപ്രയോഗം.
- source_word: εἰ ἔρχεται
  choice: വരുന്നുണ്ടോ എന്നു
  rationale: εἰ പരോക്ഷചോദ്യത്തെ അവതരിപ്പിക്കുന്നു; വർത്തമാനകാലമായ ἔρχεται സംഭവരംഗത്തിന്റെ അടിയന്തരത നിലനിർത്തുന്ന വിധം ‘വരുന്നുണ്ടോ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: Ἠλίας
  choice: ഏലിയാവ്
  rationale: പ്രവാചകന്റെ പേരിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം.
- source_word: σώσων αὐτόν
  choice: അവനെ രക്ഷിക്കാൻ
  rationale: ഭാവികാല കൃദന്തരൂപം വരവിന്റെ ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു. ‘രക്ഷിക്കാൻ’ σῴζω എന്ന പദത്തിന്റെ സാധാരണ അർഥവും പീഡാനുഭവവിവരണത്തിലെ പരിഹാസധ്വനിയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ക്രൂശീകരണസന്ദർഭത്തിൽ σῴζω എന്ന പദത്തിനുള്ള ദൈവശാസ്ത്രപരമായ അനുരണനം
  choice: ‘അവനെ രക്ഷിക്കാൻ’ എന്ന് പരിഭാഷപ്പെടുത്തി; ഉടനെയുള്ള സന്ദർഭത്തിൽ ഇത് ക്രൂശിൽനിന്നും മരണത്തിൽനിന്നുമുള്ള ദൃശ്യമായ വിടുതലിനെ സൂചിപ്പിക്കുന്നു.
  alternative: ‘അവനെ വിടുവിക്കാൻ’
  rationale: സംസാരിക്കുന്നവർ നിത്യരക്ഷയെക്കുറിച്ച് ഉപദേശിക്കുകയല്ല; അവർ ഏലിയാവിലൂടെ ഉണ്ടാകുമെന്നു കരുതുന്ന ഭൗതിക വിടുതലിനെ പരിഹസിച്ചുകൊണ്ട് കാത്തിരിക്കുകയാണ്. എങ്കിലും ‘രക്ഷിക്കാൻ’ മൂലപദത്തിന്റെ വിശാലതയും പീഡാനുഭവവിവരണത്തിലെ ഉദ്ദേശ്യപൂർവമായ ദൈവശാസ്ത്രപരമായ സംഘർഷവും പരിഹാസവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ മാന്യമായ മലയാളം. സംഭാഷണത്തിലെ പരിഹാസവും രംഗത്തിന്റെ അടിയന്തരതയും നിലനിർത്തി; മൂലത്തിൽ വ്യക്തമല്ലാത്ത കർമത്തെ അനാവശ്യമായി പൂരിപ്പിക്കാതെ Ἄφες എന്നത് സന്ദർഭോചിതമായി ‘വേണ്ട’ എന്നു നൽകി. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
