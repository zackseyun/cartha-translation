  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς πᾶς ὁ λαὸς εἶπεν· Τὸ αἷμα αὐτοῦ ἐφ’ ἡμᾶς καὶ ἐπὶ τὰ τέκνα ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/025.yaml
  text: And all the people answered[a], “His blood be on us and on our children.”
translation:
  language: ml
  text: 'ജനമെല്ലാം മറുപടി പറഞ്ഞു[a]: “അവന്റെ രക്തം ഞങ്ങളുടെമേലും ഞങ്ങളുടെ മക്കളുടെമേലും ആയിരിക്കട്ടെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അതായത്, ഈ സംഭവരംഗത്തിൽ കൂടിയിരുന്ന ജനങ്ങളാണ് ഇങ്ങനെ പറഞ്ഞത്. എല്ലാ തലമുറകളിലുമുള്ള എല്ലാ യഹൂദർക്കും സ്ഥിരമായ കുറ്റം ചുമത്തുന്നതായി ഈ വാക്കുകൾ മനസ്സിലാക്കരുത്.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: മറുപടി പറഞ്ഞു
  rationale: ἀποκρίνομαι എന്ന ക്രിയയുടെ കൃതന്തവും εἶπεν എന്ന ക്രിയയും ചേർന്നുള്ള ഗ്രീക്ക് പ്രയോഗം ഒരു പ്രതികരണം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായി ‘മറുപടി പറഞ്ഞു’ എന്ന് വിവർത്തനം ചെയ്യാം.
- source_word: πᾶς ὁ λαὸς
  choice: ജനമെല്ലാം
  rationale: ഏകവചനത്തിലെ നിർദിഷ്ടനാമത്തോടു ചേർന്ന πᾶς സമൂഹത്തെ ഒന്നാകെ സൂചിപ്പിക്കുന്നു. ‘ജനമെല്ലാം’ ഈ കൂട്ടായ അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ ജനക്കൂട്ടത്തെ തന്നെയാണ് ഇത് പരാമർശിക്കുന്നത്.
- source_word: Τὸ αἷμα αὐτοῦ
  choice: അവന്റെ രക്തം
  rationale: മരണത്തിനുള്ള ഉത്തരവാദിത്വത്തിന്റെ ആശയം ഇവിടെ സൂചനയായി ഉണ്ടെങ്കിലും, ഗ്രീക്കിലെ രക്തം എന്ന ദൃശ്യഭാഷ വിശദീകരിച്ചു വികസിപ്പിക്കാതെ അതേപടി നിലനിർത്തുന്നു.
- source_word: ἐφ’ ἡμᾶς
  choice: ഞങ്ങളുടെമേൽ … ആയിരിക്കട്ടെ
  rationale: ഗ്രീക്കിൽ ക്രിയ വ്യക്തമാക്കിയിട്ടില്ല. പ്രസ്താവനയുടെ സ്വയം ഏറ്റെടുക്കുന്ന ആശംസാത്മക/ശാപാത്മക ഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കാൻ ‘ആയിരിക്കട്ടെ’ ചേർത്തു.
- source_word: ἐπὶ τὰ τέκνα ἡμῶν
  choice: ഞങ്ങളുടെ മക്കളുടെമേലും
  rationale: τέκνα എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘മക്കൾ’ സ്വീകരിച്ചു; ‘പിൻതലമുറകൾ’ എന്നു വികസിപ്പിച്ചില്ല. ആവർത്തിച്ച ἐπί നൽകുന്ന സമാന്തരത ‘മേലും’ എന്ന രൂപത്തിൽ നിലനിർത്തി.
theological_decisions:
- issue: πᾶς ὁ λαὸς എന്ന പ്രയോഗത്തെ യഹൂദവിരുദ്ധമായി അതിവ്യാപിപ്പിക്കാനുള്ള സാധ്യത
  choice: കഥാസന്ദർഭത്തിൽ അവിടെ കൂടിയിരുന്ന ജനങ്ങളുടെ കൂട്ടായ പ്രതികരണമായി ‘ജനമെല്ലാം’ എന്ന് വിവർത്തനം ചെയ്തു.
  alternative: ‘ജനക്കൂട്ടം മുഴുവൻ’ എന്ന് നൽകി ഉടനെയുള്ള കൂട്ടത്തെ കൂടുതൽ വ്യക്തമാക്കുക.
  rationale: മൂലപാഠത്തിന്റെ കൂട്ടായ പ്രയോഗം മൃദൂകരിക്കരുത്; അതേസമയം എല്ലാ കാലങ്ങളിലുമുള്ള എല്ലാ യഹൂദർക്കും സ്ഥിരമായ കുറ്റം ചുമത്തുന്ന അവകാശവാദം വാക്യത്തിലേക്ക് ഇറക്കുമതി ചെയ്യരുത്. പ്രധാനപാഠം നിലനിർത്തി അടിക്കുറിപ്പിൽ സന്ദർഭപരിധി വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അവന്റെ രക്തം … മേൽ ആയിരിക്കട്ടെ’ എന്ന ബൈബിൾസംബന്ധമായ ദൃശ്യപ്രയോഗം നിലനിർത്തിയെങ്കിലും വാക്യക്രമം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നവിധം രൂപപ്പെടുത്തി.
