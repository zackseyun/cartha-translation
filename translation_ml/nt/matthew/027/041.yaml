source:
  edition: SBLGNT
  text: ὁμοίως ⸀καὶ οἱ ἀρχιερεῖς ἐμπαίζοντες μετὰ τῶν γραμματέων καὶ ⸀πρεσβυτέρων ἔλεγον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/041.yaml
  text: Likewise[a], the chief priests also, mocking him with the scribes and elders, were saying,
translation:
  language: ml
  text: 'അതുപോലെതന്നെ[a], മഹാപുരോഹിതന്മാരും ശാസ്ത്രിമാരും മൂപ്പന്മാരും ചേർന്ന് അവനെ പരിഹസിച്ചുകൊണ്ട് ഇങ്ങനെ പറഞ്ഞുകൊണ്ടിരുന്നു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സമാനമായി’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοίως
  choice: അതുപോലെതന്നെ
  rationale: മുൻവാക്യത്തിൽ വിവരിച്ച പരിഹാസത്തോടുള്ള താരതമ്യം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: καὶ
  choice: -ഉം
  rationale: മുമ്പ് പരാമർശിച്ച പരിഹസിച്ചവരോടൊപ്പം മഹാപുരോഹിതന്മാരെയും ചേർക്കുന്ന സങ്കലനാർഥം പ്രകടമാക്കുന്നു.
- source_word: ἀρχιερεῖς
  choice: മഹാപുരോഹിതന്മാർ
  rationale: യഹൂദരുടെ പ്രമുഖ പുരോഹിതാധികാരികളെ സൂചിപ്പിക്കുന്ന പതിവും സന്ദർഭോചിതവുമായ വിവർത്തനം.
- source_word: ἐμπαίζοντες
  choice: അവനെ പരിഹസിച്ചുകൊണ്ട്
  rationale: അവഹേളനപരമായ പരിഹാസം സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ യേശുവാണ് കർമമെന്നത് വ്യക്തമായതിനാൽ ‘അവനെ’ ചേർത്തിരിക്കുന്നു.
- source_word: μετὰ
  choice: -ഓടും ... -ഓടുംകൂടെ
  rationale: ശാസ്ത്രിമാരും മൂപ്പന്മാരും പരിഹാസത്തിൽ പങ്കുചേർന്നുവെന്ന സഹവർത്തിത്വാർഥം വ്യക്തമാക്കുന്നു.
- source_word: γραμματέων
  choice: ശാസ്ത്രിമാർ
  rationale: സുവിശേഷസന്ദർഭത്തിലെ γραμματεῖς എന്ന പദത്തിനുള്ള സ്ഥാപിതവും നേരിട്ടുള്ളതുമായ മലയാളപ്രയോഗം.
- source_word: πρεσβυτέρων
  choice: മൂപ്പന്മാർ
  rationale: പ്രായമുള്ള പുരുഷന്മാരെ പൊതുവായി അല്ല, അംഗീകൃത യഹൂദനേതാക്കളെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
- source_word: ἔλεγον
  choice: ഇങ്ങനെ പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: ഇംപർഫെക്റ്റ് ക്രിയയുടെ തുടർന്നുകൊണ്ടിരുന്ന സംസാരഭാവം സംരക്ഷിക്കുന്നു; ‘ഇങ്ങനെ’ അടുത്ത വാക്യത്തിലെ ഉദ്ധരണിയിലേക്ക് സ്വാഭാവികമായി നയിക്കുന്നു.
theological_decisions:
- issue: പരിഹാസത്തിൽ പങ്കെടുത്തവരുടെ തിരിച്ചറിയൽ
  choice: മഹാപുരോഹിതന്മാർ ശാസ്ത്രിമാരോടും മൂപ്പന്മാരോടുംകൂടെ യേശുവിനെ പരിഹസിച്ചു.
  alternative: മഹാപുരോഹിതന്മാർ ശാസ്ത്രിമാരുടെയും മൂപ്പന്മാരുടെയും സാന്നിധ്യത്തിൽ മാത്രം പരിഹസിച്ചു.
  rationale: μετὰ + സമ്ബന്ധിക വിഭക്തി ഇവിടെ വെറും സാന്നിധ്യത്തെക്കാൾ പ്രവർത്തനത്തിലെ കൂട്ടായ പങ്കാളിത്തമാണ് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ബൈബിൾ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ പങ്കാളിത്തക്രിയയും ഇംപർഫെക്റ്റ് മുഖ്യക്രിയയും മലയാളത്തിൽ ‘പരിഹസിച്ചുകൊണ്ട് ... പറഞ്ഞുകൊണ്ടിരുന്നു’ എന്നു വേർതിരിച്ച് സംരക്ഷിച്ചു.
