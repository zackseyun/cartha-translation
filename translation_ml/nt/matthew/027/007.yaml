id: MAT.27.7
reference: Matthew 27:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: συμβούλιον δὲ λαβόντες ἠγόρασαν ἐξ αὐτῶν τὸν Ἀγρὸν τοῦ Κεραμέως εἰς ταφὴν τοῖς ξένοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/007.yaml
  text: So after taking counsel[b][a], they bought the Potter’s Field with them as a burial place for foreigners.
translation:
  language: ml
  text: അങ്ങനെ, അവർ കൂടിയാലോചിച്ചശേഷം, അവകൊണ്ട്[a] കുശവന്റെ നിലം പരദേശികളെ[b] അടക്കംചെയ്യാനുള്ള സ്ഥലമായി വാങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആ പണംകൊണ്ട്”; ഗ്രീക്കിൽ അക്ഷരാർഥം “അവയിൽനിന്ന്” എന്നാണ്. മുൻസന്ദർഭത്തിൽ പറഞ്ഞ വെള്ളിനാണയങ്ങളെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അപരിചിതരെ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συμβούλιον ... λαβόντες
  choice: കൂടിയാലോചിച്ചശേഷം
  rationale: ‘ആലോചന കൈക്കൊണ്ടശേഷം’ എന്ന അക്ഷരാർഥത്തേക്കാൾ സ്വാഭാവികമായി, കൂട്ടായ തീരുമാനചർച്ചയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം നൽകുന്നു.
- source_word: δὲ
  choice: അങ്ങനെ
  rationale: ഇവിടെ ശക്തമായ വൈരുധ്യമല്ല, മുൻസന്ദർഭത്തിൽനിന്നുള്ള കഥാതുടർച്ചയും ഫലബന്ധവുമാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἠγόρασαν
  choice: വാങ്ങി
  rationale: ἀγοράζω എന്ന ക്രിയയുടെ ലളിതവും സ്വാഭാവികവുമായ മലയാള പരിഭാഷ.
- source_word: ἐξ αὐτῶν
  choice: അവകൊണ്ട്
  rationale: നപുംസക ബഹുവചന സർവനാമം മുൻസന്ദർഭത്തിലെ വെള്ളിനാണയങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘അവകൊണ്ട്’ എന്നത് സർവനാമപരമായ പരാമർശം നിലനിർത്തുകയും മലയാളത്തിൽ ഉപകരണാർഥം സ്വാഭാവികമായി അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: τὸν Ἀγρὸν τοῦ Κεραμέως
  choice: കുശവന്റെ നിലം
  rationale: ജനിതകബന്ധം നേരായും സ്വാഭാവികമായും പുനരാവിഷ്കരിക്കുന്നു; സന്ദർഭത്തിൽ ഒരു പ്രത്യേക സ്ഥലനാമസദൃശ പ്രയോഗമാണിത്.
- source_word: εἰς ταφὴν
  choice: അടക്കുന്നതിനുള്ള സ്ഥലമായി
  rationale: εἰς + ταφή സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യം വ്യക്തമായി നൽകുന്നു; മൃതദേഹം സംസ്കരിക്കുന്നതിനുള്ള സ്ഥലം എന്ന അർഥം സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാം.
- source_word: τοῖς ξένοις
  choice: പരദേശികളെ
  rationale: പ്രദേശത്തിന് പുറത്തുനിന്നുള്ളവരെയോ അന്യദേശക്കാരെയോ സൂചിപ്പിക്കുന്ന ξένοις എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി ‘പരദേശികൾ’ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἐξ αὐτῶν എന്നതിലെ സർവനാമത്തിന്റെ സൂചിതവിഷയം
  choice: മുൻസന്ദർഭത്തിലെ വെള്ളിനാണയങ്ങളെ സൂചിപ്പിക്കുന്നതായി ‘അവകൊണ്ട്’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: വ്യക്തതയ്ക്കായി ‘ആ പണംകൊണ്ട്’ എന്നു വികസിപ്പിക്കാം.
  rationale: അടുത്ത മുൻസന്ദർഭം വെള്ളിനാണയങ്ങളെ വ്യക്തമായി നൽകുന്നു. സർവനാമം നിലനിർത്തുന്നത് മൂലപാഠത്തിന്റെ രൂപത്തോട് അടുത്തുനിൽക്കുമ്പോഴും മലയാളത്തിൽ അർഥം ഗ്രഹിക്കാവുന്നതാക്കുന്നു.
- issue: τοῖς ξένοις എന്നതിന്റെ അർഥവ്യാപ്തി
  choice: പരദേശികൾ
  alternative: അപരിചിതർ / അന്യർ
  rationale: ഇവിടെ കേവലം പരിചയമില്ലാത്ത വ്യക്തികളെന്നതിലുപരി പുറത്തുനിന്നെത്തിയവരോ അന്യദേശക്കാരോ എന്ന ആശയം സാധ്യതയേറിയതാണ്; എങ്കിലും പദത്തിന്റെ വിപുലമായ സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി സ്വീകരിച്ചു. ‘കൂടിയാലോചിച്ചശേഷം’, ‘വാങ്ങി’, ‘അടക്കുന്നതിനുള്ള സ്ഥലമായി’ എന്നീ പ്രയോഗങ്ങൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; മൂലപാഠത്തിലെ സർവനാമപരമായ പരാമർശവും ξένοις എന്ന പദത്തിന്റെ അർഥസമ്മർദവും അടിക്കുറിപ്പുകളോടെ സംരക്ഷിച്ചു.
