source:
  edition: SBLGNT
  text: λέγων· Ἥμαρτον παραδοὺς αἷμα ⸀ἀθῷον. οἱ δὲ εἶπαν· Τί πρὸς ἡμᾶς; σὺ ⸀ὄψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/004.yaml
  text: saying, “I have sinned by betraying innocent blood.” But they said, “What is that to us? You will see to it.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “നിരപരാധിയുടെ രക്തം ഒറ്റിക്കൊടുത്ത് ഞാൻ പാപം ചെയ്തു.”[a] എന്നാൽ അവർ പറഞ്ഞു: “അതിൽ ഞങ്ങൾക്കെന്ത്? നീ തന്നെ നോക്കിക്കൊള്ളുക.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “നിരപരാധിയുടെ രക്തം ഒറ്റിക്കൊടുത്ത് ഞാൻ പാപം ചെയ്തു.”'
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “നീ തന്നെ നോക്കിക്കൊള്ളും”; ഇവിടെ “അത് നിന്റെ ഉത്തരവാദിത്വമാണ്” എന്ന നിരാകരണഭാവമുള്ള പ്രയോഗം.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἥμαρτον
  choice: ഞാൻ പാപം ചെയ്തു
  rationale: ഗ്രീക്ക് ഏയോറിസ്റ്റ് ക്രിയയെ സ്വാഭാവികമായ മലയാള ഭൂതകാലത്തിൽ നൽകി; കുറ്റസമ്മതത്തിന്റെ നേരിട്ടുള്ള ശക്തി നിലനിർത്തുന്നു.
- source_word: παραδοὺς
  choice: ഒറ്റിക്കൊടുത്തതിലൂടെ
  rationale: സന്ദർഭത്തിൽ യൂദാസ് യേശുവിനെ ശത്രുക്കൾക്ക് ഏല്പിച്ച വഞ്ചനാപരമായ പ്രവൃത്തിയെയാണ് സൂചിപ്പിക്കുന്നത്; ക്രിയാവിശേഷണരൂപത്തിന്റെ കാരണ/മാർഗ അർഥവും ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: αἷμα ἀθῷον
  choice: നിഷ്കളങ്കരക്തം
  rationale: മരണത്തിനിടയാക്കിയ അന്യായകുറ്റത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക്-ബൈബിൾ പ്രയോഗത്തിന്റെ സംക്ഷിപ്തതയും നിയമ-ധാർമിക ഭാവവും സംരക്ഷിക്കുന്നു; യേശു എന്ന പരാമർശം മൂലപാഠത്തിൽ ഇല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല.
- source_word: Τί πρὸς ἡμᾶς;
  choice: അതിൽ ഞങ്ങൾക്കെന്ത്?
  rationale: ഉത്തരവാദിത്വവും താൽപര്യവും തള്ളിക്കളയുന്ന ഗ്രീക്ക് ശൈലിക്ക് സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാള തുല്യം.
- source_word: σὺ ὄψῃ
  choice: നീ തന്നെ നോക്കിക്കൊള്ളുക
  rationale: രൂപത്തിൽ ഭാവികാലമാണെങ്കിലും സന്ദർഭത്തിൽ ഉത്തരവാദിത്വം യൂദാസിലേക്കുതന്നെ തള്ളുന്ന രൂക്ഷമായ ആജ്ഞാസദൃശ പ്രയോഗമാണ്; മലയാളത്തിൽ അതിന്റെ പ്രയോഗാർഥം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: ‘നിഷ്കളങ്കരക്തം’ ആരുടേതാണെന്ന് വ്യക്തമായി ചേർക്കണമോ
  choice: യേശു എന്നോ നിഷ്കളങ്കനായ ഒരുവന്റെ രക്തം എന്നോ മുഖ്യപാഠത്തിൽ ചേർക്കാതെ ‘നിഷ്കളങ്കരക്തം’ എന്നു നിലനിർത്തുക
  alternative: നിഷ്കളങ്കനായ ഒരുവന്റെ രക്തം / യേശുവിന്റെ നിഷ്കളങ്കരക്തം
  rationale: ഗ്രീക്ക് മൂലപാഠം പരാമർശിതനെ ഈ പ്രയോഗത്തിൽ അപ്രത്യക്ഷമായി വിടുന്നു. കൂടുതൽ വ്യക്തമാക്കുന്നത് ശരിയായ സന്ദർഭബോധം നൽകുമെങ്കിലും മൂലപാഠത്തിന്റെ സംക്ഷിപ്തതയും ബൈബിൾപ്രയോഗവും മാറ്റും.
- issue: σὺ ὄψῃ എന്നതിന്റെ വ്യാകരണരൂപവും പ്രയോഗാർഥവും
  choice: മുഖ്യപാഠത്തിൽ ആജ്ഞാസദൃശമായ ‘നീ തന്നെ നോക്കിക്കൊള്ളുക’
  alternative: നീ തന്നെ നോക്കിക്കൊള്ളും
  rationale: ഭാവികാലരൂപത്തെ അക്ഷരാർഥത്തിൽ നൽകിയാൽ മലയാളത്തിൽ പ്രവചനമായി തെറ്റിദ്ധരിക്കാം; ഇവിടെ അത് ‘അത് നിന്റെ ഉത്തരവാദിത്വം’ എന്ന നിരാകരണഭാവമുള്ള ശൈലിയാണ്. രൂപസാദ്ധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘നിഷ്കളങ്കരക്തം’ എന്ന ബൈബിൾ-നിയമപരമായ സംയുക്തപ്രയോഗം സംരക്ഷിച്ചു; പുരോഹിതരുടെ മറുപടിയിലെ രൂക്ഷമായ ഉത്തരവാദിത്വനിരാകരണം സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
