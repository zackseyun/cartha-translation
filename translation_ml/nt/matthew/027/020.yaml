id: MAT.27.20
reference: Matthew 27:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οἱ δὲ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι ἔπεισαν τοὺς ὄχλους ἵνα αἰτήσωνται τὸν Βαραββᾶν τὸν δὲ Ἰησοῦν ἀπολέσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/020.yaml
  text: But the chief priests and the elders persuaded the crowds to ask for Barabbas[a], but to destroy Jesus.
translation:
  language: ml
  text: എന്നാൽ മുഖ്യപുരോഹിതന്മാരും മൂപ്പന്മാരും ബറബ്ബാസിനെ ആവശ്യപ്പെടാനും യേശുവിനെ നശിപ്പിക്കാനും[a] ജനക്കൂട്ടങ്ങളെ പ്രേരിപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യേശുവിനെ കൊന്നുകളയാനും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവിവരണത്തോടുള്ള വൈരുധ്യം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀρχιερεῖς
  choice: മുഖ്യപുരോഹിതന്മാർ
  rationale: യെരൂശലേമിലെ പുരോഹിതനേതൃത്വത്തെ സൂചിപ്പിക്കുന്ന അംഗീകൃതവും കൃത്യവുമായ പ്രയോഗം.
- source_word: πρεσβύτεροι
  choice: മൂപ്പന്മാർ
  rationale: അംഗീകൃത യഹൂദനേതാക്കളെന്ന സ്ഥാപനപരവും ചരിത്രപരവുമായ അർഥം നിലനിർത്തുന്നു.
- source_word: ἔπεισαν
  choice: പ്രേരിപ്പിച്ചു
  rationale: ജനക്കൂട്ടങ്ങളുടെ തീരുമാനത്തെ സ്വാധീനിച്ച പൂർത്തിയായ പ്രവൃത്തിയെ സ്വാഭാവികമായി അറിയിക്കുന്നു; ‘സമ്മതിപ്പിച്ചു’ എന്നതിനെക്കാൾ തുടർന്നുള്ള രണ്ടു പ്രവർത്തനങ്ങളുമായി നന്നായി ചേരുന്നു.
- source_word: τοὺς ὄχλους
  choice: ജനക്കൂട്ടങ്ങളെ
  rationale: ഗ്രീക്കിലെ ബഹുവചനം നിലനിർത്തുകയും കൂടിയിരുന്ന ജനസമൂഹങ്ങളെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: αἰτήσωνται τὸν Βαραββᾶν
  choice: ബറബ്ബാസിനെ ആവശ്യപ്പെടാൻ
  rationale: ബറബ്ബാസിനെ തങ്ങൾക്കായി ചോദിക്കണമെന്ന ആശയം നേരിട്ട് നൽകുന്നു; ‘വിട്ടുകൊടുക്കണമെന്ന്’ എന്ന സന്ദർഭസൂചന മൂലപാഠത്തിലേക്ക് ചേർക്കുന്നില്ല.
- source_word: ἀπολέσωσιν
  choice: നശിപ്പിക്കാൻ
  rationale: ഒരാളെ നാശത്തിലാക്കുക അഥവാ ഇല്ലാതാക്കുക എന്ന ഗ്രീക്ക് ക്രിയയുടെ വിശാലമായ ശക്തി നിലനിർത്തുന്നു; വധശിക്ഷയുടെ സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: τὸν δὲ Ἰησοῦν
  choice: യേശുവിനെ … ആക്കാനും
  rationale: ബറബ്ബാസിനെ ആവശ്യപ്പെടുന്നതും യേശുവിനെ നശിപ്പിക്കുന്നതും തമ്മിലുള്ള ആവർത്തിത δέ-യുടെ വൈരുധ്യം മലയാളത്തിലെ സമാന്തര ഘടനയിലൂടെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ന്യായവിധിയുടെയും വധത്തിന്റെയും സന്ദർഭത്തിൽ ἀπολέσωσιν എന്നതിന്റെ പരിഭാഷ
  choice: യേശുവിനെ നശിപ്പിക്കാൻ
  alternative: യേശുവിനെ കൊന്നുകളയാൻ
  rationale: ക്രിയ ഒരു സാങ്കേതിക വധശിക്ഷാപദത്തേക്കാൾ വിശാലമാണ്; അതിനാൽ മുഖ്യപാഠം അതിന്റെ പദാർഥശക്തി നിലനിർത്തുന്നു. ഈ സന്ദർഭത്തിലെ വ്യക്തമായ മരണാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ ബഹുവചനവും ബറബ്ബാസ്–യേശു വൈരുധ്യവും നിലനിർത്തിയിരിക്കുന്നു. അടിക്കുറിപ്പ് അതുമായി ബന്ധപ്പെട്ട ‘നശിപ്പിക്കാനും’ എന്ന പദത്തിനുശേഷം ചേർത്തിരിക്കുന്നു.
