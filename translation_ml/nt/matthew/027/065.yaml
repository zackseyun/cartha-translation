id: MAT.27.65
reference: Matthew 27:65
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ἔφη αὐτοῖς ὁ Πιλᾶτος· Ἔχετε κουστωδίαν· ὑπάγετε ἀσφαλίσασθε ὡς οἴδατε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/065.yaml
  text: Pilate said to them[a], “You have a guard. Go[b], make it secure as you know how.”
translation:
  language: ml
  text: 'പീലാത്തോസ് അവരോടു പറഞ്ഞു: “നിങ്ങൾക്ക് ഒരു കാവൽസംഘമുണ്ട്.[a] പോകുവിൻ; നിങ്ങൾക്കറിയാവുന്ന വിധം അതു ഭദ്രമാക്കുവിൻ.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരു കാവൽസംഘത്തെ എടുത്തുകൊള്ളുവിൻ”; ഒരുപക്ഷേ, “നിങ്ങൾക്കു സ്വന്തമായി ഒരു കാവൽസംഘമുണ്ട്.” പീലാത്തോസ് ഒരു കാവൽസംഘത്തെ അനുവദിക്കുകയാണോ, അവർക്കു നേരത്തേ ലഭ്യമായിരുന്ന കാവലിനെ സൂചിപ്പിക്കുകയാണോ എന്നു ഗ്രീക്കിൽനിന്ന് രണ്ടുവിധം മനസ്സിലാക്കാം.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, “നിങ്ങൾക്കാവുന്നതുപോലെ അതു ഭദ്രമാക്കുവിൻ.”
    reason: alternative_rendering
lexical_decisions:
- source_word: ἔφη αὐτοῖς
  choice: അവരോടു പറഞ്ഞു
  rationale: φημί എന്ന സാധാരണ ആഖ്യാനക്രിയയും ദാതിവിലുള്ള αὐτοῖς എന്ന പരോക്ഷകർമവും സ്വാഭാവികമായ മലയാളത്തിൽ ചേർത്തു നൽകുന്നു.
- source_word: Ἔχετε
  choice: നിങ്ങൾക്ക് ... ഉണ്ടല്ലോ
  rationale: വർത്തമാനകാല രൂപത്തിന്റെ നേരിട്ടുള്ള അർഥമായ ‘നിങ്ങൾക്ക് ഉണ്ട്’ നിലനിർത്തുന്നു; അതേസമയം ഇത് കാവൽ അനുവദിക്കുന്നതാണോ ഇതിനകം ലഭ്യമായതിനെ സൂചിപ്പിക്കുന്നതാണോ എന്ന സന്ദർഭപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: κουστωδίαν
  choice: ഒരു കാവൽസംഘം
  rationale: ലത്തീൻ custodiaയിൽനിന്നുള്ള ഈ പദം ഇവിടെ കാവൽ നിൽക്കുന്ന സൈനികസംഘത്തെ സൂചിപ്പിക്കുന്നു; ‘കാവൽസംഘം’ എന്നത് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: ὑπάγετε
  choice: പോകുവിൻ
  rationale: പുറപ്പെട്ടു പോകാനുള്ള ബഹുവചന ആജ്ഞയെ ചുരുക്കമായും ഗൗരവമുള്ള ആധുനിക ശൈലിയിലും നൽകുന്നു.
- source_word: ἀσφαλίσασθε
  choice: അതു സുരക്ഷിതമാക്കുവിൻ
  rationale: കല്ലറയെ ഭദ്രമാക്കുക എന്ന ആജ്ഞയുടെ അർഥം വ്യക്തമായി പകർന്നു നൽകുന്നു; മധ്യപ്രയോഗത്തിന്റെ പ്രവർത്തനകേന്ദ്രിതമായ ഭാവം മലയാള ആജ്ഞാരൂപത്തിൽ സ്വാഭാവികമായി വരുന്നു.
- source_word: ὡς οἴδατε
  choice: നിങ്ങൾക്കറിയാവുന്നതുപോലെ
  rationale: അവരുടെ അറിവിനോ കഴിവിനോ അനുസരിച്ച് എന്ന ആശയം അതിരുകടന്ന് വ്യാഖ്യാനിക്കാതെ മൂലപാഠത്തിന്റെ രൂപത്തോട് അടുത്തുനിൽക്കുന്നു.
theological_decisions:
- issue: Ἔχετε κουστωδίαν എന്നത് പീലാത്തോസ് റോമൻ കാവൽസംഘത്തെ അനുവദിക്കുന്നതാണോ, മതനേതാക്കൾക്ക് ഇതിനകം ലഭ്യമായിരുന്ന കാവലിനെ ചൂണ്ടിക്കാണിക്കുന്നതാണോ
  choice: പ്രധാനപാഠത്തിൽ ‘നിങ്ങൾക്ക് ഒരു കാവൽസംഘമുണ്ടല്ലോ’ എന്ന് താരതമ്യേന നിഷ്പക്ഷമായി നൽകി
  alternative: ‘ഒരു കാവൽസംഘത്തെ കൊണ്ടുപോകുവിൻ’ അല്ലെങ്കിൽ ‘നിങ്ങൾക്കു സ്വന്തമായി ഒരു കാവൽസംഘമുണ്ടല്ലോ’
  rationale: Ἔχετε എന്ന രൂപം പ്രസ്താവനയായും സന്ദർഭത്തിൽ അനുമതി നൽകുന്ന പ്രയോഗമായും മനസ്സിലാക്കാം. ചരിത്രപരമായി വിവാദമായ കാര്യം തീർപ്പാക്കാതെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ആഖ്യാനശൈലി. ബഹുവചന ആജ്ഞയിൽ ‘പോകുവിൻ’, ‘സുരക്ഷിതമാക്കുവിൻ’ എന്നിവ ഉപയോഗിച്ചു. ‘കാവൽ’ എന്നതിനെക്കാൾ സൈനികരുടെ ഒരു വിഭാഗം എന്ന അർഥം വ്യക്തമാക്കാൻ ‘കാവൽസംഘം’ തിരഞ്ഞെടുത്തു; മൂലപാഠത്തിലെ പ്രധാന അനിശ്ചിതത്വം അടിക്കുറിപ്പിലാക്കി.
