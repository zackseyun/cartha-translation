translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. സ്ഥലനാമം ഉദ്ധരണിചിഹ്നങ്ങളിൽ നൽകി; വാക്യത്തിലെ ‘വയൽ’ എന്ന പദവും പേരിലെ ‘വയൽ’ എന്ന ഘടകവും തമ്മിലുള്ള ബന്ധം സംരക്ഷിച്ചു.
