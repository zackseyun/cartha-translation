id: MAT.27.8
reference: Matthew 27:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διὸ ἐκλήθη ὁ ἀγρὸς ἐκεῖνος Ἀγρὸς Αἵματος ἕως τῆς σήμερον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/008.yaml
  text: Therefore that field has been called Field of Blood to this day.
translation:
  language: ml
  text: അതുകൊണ്ട് ആ വയലിന് ഇന്നുവരെ “രക്തവയൽ” എന്നു പേരുണ്ട്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὸ
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യത്തിലെ സംഭവവിവരണത്തിൽനിന്നുള്ള ഫലമോ നിഗമനമോ സൂചിപ്പിക്കുന്ന ബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐκλήθη
  choice: പേരുണ്ട്
  rationale: അയോറിസ്റ്റ് പാസീവ് രൂപത്തിന്റെ പേരിടൽ അർഥവും ἕως τῆς σήμερον സൂചിപ്പിക്കുന്ന ഇന്നുവരെയുള്ള തുടർച്ചയും ചേർത്ത് മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ὁ ἀγρὸς ἐκεῖνος
  choice: ആ വയലിന്
  rationale: ἀγρός എന്ന പദത്തിന്റെ അടിസ്ഥാന അർഥമായ ‘വയൽ’ നിലനിർത്തുകയും ἐκεῖνος എന്ന നിർദേശകപദം ‘ആ’ എന്നു നൽകുകയും ചെയ്യുന്നു.
- source_word: Ἀγρὸς Αἵματος
  choice: രക്തവയൽ
  rationale: സ്ഥലനാമമായി മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ സംയുക്തരൂപം; ἀγρός എന്ന പദം മുൻഭാഗത്തോടുള്ള ആവർത്തനബന്ധവും നിലനിർത്തുന്നു.
- source_word: αἵματος
  choice: രക്ത
  rationale: αἷμα എന്നതിന്റെ ഷഷ്ഠീവ്യാകരണബന്ധം മലയാള സംയുക്തപദത്തിലെ ‘രക്ത-’ എന്ന രൂപത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἕως τῆς σήμερον
  choice: ഇന്നുവരെ
  rationale: എഴുത്തുകാരന്റെ കാലംവരെ ആ പേര് ഉപയോഗത്തിലുണ്ടായിരുന്നുവെന്ന കാലപരിധി ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
