reference: Matthew 27:40
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ λέγοντες· Ὁ καταλύων τὸν ναὸν καὶ ἐν τρισὶν ἡμέραις οἰκοδομῶν, σῶσον σεαυτόν· εἰ υἱὸς εἶ τοῦ θεοῦ, ⸀κατάβηθι ἀπὸ τοῦ σταυροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/040.yaml
  text: and saying[a], “You who would destroy the temple and build it in three days, save yourself! If you are the Son of God, come down from the cross.”
translation:
  language: ml
  text: 'അവർ ഇങ്ങനെ പറഞ്ഞു: “ദൈവാലയം പൊളിച്ച് മൂന്നു ദിവസത്തിനുള്ളിൽ അതു പണിയുന്നവനേ[a], നിന്നെത്തന്നെ രക്ഷിക്കൂ! നീ ദൈവപുത്രനാണെങ്കിൽ ക്രൂശിൽനിന്ന് ഇറങ്ങിവാ!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “അതു വീണ്ടും പണിയുന്നവനേ.” ഗ്രീക്ക് ക്രിയയുടെ നേരിട്ടുള്ള അർഥം “പണിയുക” എന്നാണ്; എന്നാൽ പരിഹാസത്തിന്റെ സന്ദർഭം വീണ്ടും പണിയുന്നതിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: അവർ ഇങ്ങനെ പറഞ്ഞു
  rationale: മുൻവാക്യത്തിലെ പ്രവർത്തനത്തോടു ചേർന്നുനിൽക്കുന്ന വർത്തമാന കൃദന്തരൂപമാണ്. മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യമായി അവതരിപ്പിക്കുമ്പോൾ പരിഹാസവാക്കുകളുടെ ആമുഖം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: Ὁ καταλύων
  choice: പൊളിച്ച് ... പണിയുന്നവനേ
  rationale: നിർദേശകപദത്തോടുകൂടിയ കൃദന്തം ഇവിടെ നേരിട്ടുള്ള സംബോധനയായി പ്രവർത്തിക്കുന്നു. ആരോപണത്തെ ഉദ്ധരിക്കുന്ന പരിഹാസഭാവം ഈ രൂപം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: καταλύω
  choice: പൊളിക്കുക
  rationale: ദൈവാലയത്തെ സംബന്ധിച്ച് ഘടന തകർക്കുക എന്ന ആശയം ലളിതവും കൃത്യവുമായി അറിയിക്കുന്നു.
- source_word: ναός
  choice: ദൈവാലയം
  rationale: ναός കൂടുതൽ പ്രത്യേകമായി വിശുദ്ധമന്ദിരഭാഗത്തെ സൂചിപ്പിക്കാമെങ്കിലും, ഈ പരിഹാസവാക്കിൽ മുഴുവൻ ആലയത്തെ സാധാരണ വായനക്കാരന് വ്യക്തമായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക പദമാണിത്.
- source_word: ἐν τρισὶν ἡμέραις
  choice: മൂന്നു ദിവസത്തിനുള്ളിൽ
  rationale: നിശ്ചിത കാലപരിധിക്കുള്ളിൽ പ്രവൃത്തി പൂർത്തിയാക്കുക എന്ന സമയാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: οἰκοδομῶν
  choice: അതു പണിയുന്നവനേ
  rationale: ഗ്രീക്ക് ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘പണിയുക’ എന്നതാണ്. സന്ദർഭം ‘വീണ്ടും പണിയുക’ എന്നു സൂചിപ്പിക്കാമെങ്കിലും അത് മുഖ്യപാഠത്തിൽ നിർബന്ധമായി ചേർക്കാതെ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: σῶσον σεαυτόν
  choice: നിന്നെത്തന്നെ രക്ഷിക്കൂ
  rationale: ആജ്ഞാരൂപവും പ്രതിഫലന സർവനാമവും നേരിട്ട് നിലനിർത്തുന്ന, പരിഹാസവെല്ലുവിളിക്ക് യോജിച്ച പ്രയോഗം.
- source_word: εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: നീ ദൈവപുത്രനാണെങ്കിൽ
  rationale: നിബന്ധനാപരമായ പരിഹാസവും ക്രിസ്തുവിനെ സംബന്ധിക്കുന്ന പദവിയും കൂട്ടിച്ചേർക്കലില്ലാതെ നിലനിർത്തുന്നു.
- source_word: κατάβηθι
  choice: ഇറങ്ങിവാ
  rationale: ഉയർന്നിരിക്കുന്ന ഒരാളോടു താഴേക്ക് വരാൻ പറയുന്ന ആജ്ഞ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: σταυρός
  choice: ക്രൂശ്
  rationale: പീഡാനുഭവവിവരണത്തിലെ ഉപകരണത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരവും സന്ദർഭോചിതവുമായ മലയാള പദം.
theological_decisions:
- issue: പരിഹാസസന്ദർഭത്തിലെ υἱὸς τοῦ θεοῦ എന്ന ക്രിസ്തുശാസ്ത്രപരമായ പദവി
  choice: ദൈവപുത്രൻ
  alternative: ദൈവത്തിന്റെ പുത്രൻ
  rationale: പരിഹസിക്കുന്നവർ യേശുവിന്റെ വ്യക്തിത്വത്തെ വെല്ലുവിളിക്കുന്നതാണ് വാക്യം രേഖപ്പെടുത്തുന്നത്. ‘ദൈവപുത്രൻ’ എന്നത് പദവിയുടെ ശക്തി കുറയ്ക്കാതെയും പാഠത്തിനപ്പുറം വിശദീകരിക്കാതെയും അതിനെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളം. പരിഹാസത്തിന്റെ നേരിട്ടുള്ള സംബോധനയും വെല്ലുവിളിയുടെ തീക്ഷ്ണതയും നിലനിർത്തി; അനാവശ്യ സാങ്കേതികമോ സഭാവിഭാഗപരമോ ആയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
