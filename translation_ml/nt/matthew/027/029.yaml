reference: Matthew 27:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ πλέξαντες στέφανον ἐξ ἀκανθῶν ἐπέθηκαν ἐπὶ ⸂τῆς κεφαλῆς⸃ αὐτοῦ καὶ κάλαμον ⸂ἐν τῇ δεξιᾷ⸃ αὐτοῦ, καὶ γονυπετήσαντες ἔμπροσθεν αὐτοῦ ⸀ἐνέπαιξαν αὐτῷ λέγοντες· Χαῖρε, ⸀βασιλεῦ τῶν Ἰουδαίων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/029.yaml
  text: And after weaving a crown of thorns[a], they put it on his head, and a reed in his right hand; and kneeling before him, they mocked him, saying, “Hail, King of the Jews!”
translation:
  language: ml
  text: മുള്ളുകൾകൊണ്ട് ഒരു കിരീടം മെടഞ്ഞശേഷം അവർ അത് അവന്റെ തലയിൽ വെക്കുകയും അവന്റെ വലതുകൈയിൽ ഒരു ഞാങ്ങണ വെക്കുകയും ചെയ്തു. പിന്നെ അവർ അവന്റെ മുമ്പിൽ മുട്ടുകുത്തി, “വാഴ്ക, യഹൂദന്മാരുടെ[a] രാജാവേ!” എന്നു പറഞ്ഞ് അവനെ പരിഹസിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “യഹൂദന്മാർ” എന്നതിന് “യെഹൂദ്യർ” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ Ἰουδαίων എന്ന പദം യഹൂദന്മാരെയോ യെഹൂദ്യരെയോ സൂചിപ്പിക്കാം; ഇവിടെ യേശുവിനെ പരിഹസിച്ചുകൊണ്ട് ഉപയോഗിച്ച രാജകീയ ശീർഷകത്തിലാണ് അത് വരുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλέξαντες
  choice: മെടഞ്ഞശേഷം
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുണ്ടായ പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്ന aorist participle സ്വാഭാവികമായ മലയാള ക്രമത്തിൽ അവതരിപ്പിക്കുന്നു; മുള്ളുകൾ കൂട്ടിപ്പിണഞ്ഞുണ്ടാക്കിയ പ്രവൃത്തിയും വ്യക്തമാക്കുന്നു.
- source_word: στέφανον ἐξ ἀκανθῶν
  choice: മുള്ളുകൾകൊണ്ട് ഒരു കിരീടം
  rationale: στέφανος എന്നത് മാലയെയോ വിജയകിരീടത്തെയോ സൂചിപ്പിക്കാമെങ്കിലും, ഇവിടെ രാജത്വത്തെ പരിഹസിക്കുന്ന സന്ദർഭമായതിനാൽ ‘കിരീടം’ യോജിക്കുന്നു; ἐξ ἀκανθῶν അതിന്റെ വസ്തു വ്യക്തമാക്കുന്നു.
- source_word: ἐπέθηκαν ἐπὶ τῆς κεφαλῆς αὐτοῦ
  choice: അവർ അത് അവന്റെ തലയിൽ വെച്ചു
  rationale: ഇടുന്നതിന്റെ പ്രവൃത്തിയും സ്ഥാനവും ലളിതവും കൃത്യവുമായി നൽകുന്നു.
- source_word: κάλαμον
  choice: ഒരു ഞാങ്ങണ
  rationale: രാജദണ്ഡത്തിന്റെ പരിഹാസരൂപമായിരിക്കാമെങ്കിലും മൂലപദം സൂചിപ്പിക്കുന്ന യഥാർഥ വസ്തു നിലനിർത്തുന്നു; ‘രാജദണ്ഡ്’ എന്ന് വ്യാഖ്യാനിച്ചുചേർക്കുന്നില്ല.
- source_word: ἐν τῇ δεξιᾷ αὐτοῦ
  choice: അവന്റെ വലതുകൈയിൽ
  rationale: ദത്തിവ് പ്രയോഗം വസ്തു അവന്റെ വലതുകൈയിൽ വെച്ചതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: γονυπετήσαντες ἔμπροσθεν αὐτοῦ
  choice: അവന്റെ മുമ്പിൽ മുട്ടുകുത്തി
  rationale: പരിഹാസപൂർവമായ രാജകീയ വണക്കത്തിന്റെ ശരീരഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐνέπαιξαν αὐτῷ
  choice: അവനെ പരിഹസിച്ചു
  rationale: അവരുടെ വാക്കുകളും പ്രവൃത്തികളും പ്രകടിപ്പിക്കുന്ന നിന്ദാപൂർവമായ പരിഹാസം കൃത്യമായി നൽകുന്നു.
- source_word: Χαῖρε
  choice: ജയിച്ചാലും!
  rationale: സാധാരണ അഭിവാദനത്തെക്കാൾ ഇവിടെ പരിഹാസപൂർവമായ രാജകീയ അഭിവാദനമാണ്; മലയാളത്തിലെ ഗൗരവമുള്ള അഭിവാദനരൂപം അതിന്റെ ഔപചാരികതയും വിരോധാഭാസവും നിലനിർത്തുന്നു.
- source_word: βασιλεῦ τῶν Ἰουδαίων
  choice: യഹൂദന്മാരുടെ രാജാവേ
  rationale: സംബോധനാവിഭക്തി ‘രാജാവേ’ എന്ന രൂപത്തിൽ നൽകുന്നു; Ἰουδαίων എന്നത് ഈ പീഡാനുഭവസന്ദർഭത്തിലെ പരിചിതമായ ജന-മതപരമായ രാജശീർഷകമായി പരിഭാഷപ്പെടുത്തുന്നു.
theological_decisions:
- issue: പരിഹാസപൂർവമായ രാജകീയ അഭിവാദനത്തിലെ വിരോധാഭാസം
  choice: “യഹൂദന്മാരുടെ രാജാവേ, ജയിച്ചാലും!”
  alternative: “യഹൂദന്മാരുടെ രാജാവേ, അഭിവാദ്യം!”
  rationale: സൈനികർ യഥാർഥ ആദരവ് അർപ്പിക്കുന്നില്ല; രാജാവിനുള്ള ഔപചാരിക വണക്കത്തെ അനുകരിച്ച് പരിഹസിക്കുകയാണ്. ‘ജയിച്ചാലും’ ആ രാജകീയ ശൈലിയും പരിഹാസത്തിന്റെ മുറിപ്പാടും നിലനിർത്തുന്നു.
- issue: Ἰουδαίων എന്ന പദത്തിന്റെ പരിധി
  choice: യഹൂദന്മാർ
  alternative: യെഹൂദ്യർ
  rationale: പദത്തിന് പ്രദേശപരമായി ‘യെഹൂദ്യർ’ എന്ന അർഥവും സാധ്യമാണെങ്കിലും, ഇവിടെ യേശുവിനെതിരായ രാജത്വാരോപണവുമായി ബന്ധപ്പെട്ട സ്ഥിരമായ ശീർഷകത്തിൽ വിശാലമായ ജന-മതപരമായ അർഥമാണ് കൂടുതൽ സാദ്ധ്യം. മറ്റുവായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. രാജകീയ പരിഹാസത്തിന്റെ ദൃശ്യരൂപം നിലനിർത്തിയിട്ടുണ്ട്; ‘ഞാങ്ങണ’യെ ‘രാജദണ്ഡ്’ എന്ന് വ്യാഖ്യാനിച്ചിട്ടില്ല. അടിക്കുറിപ്പ്-ചിഹ്നം പ്രധാനവാചകത്തിൽ ഉൾപ്പെടുത്തി.
