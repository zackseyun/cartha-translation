  naturalness: ‘മുഖ്യപുരോഹിതന്മാരും ജനത്തിന്റെ മൂപ്പന്മാരും എല്ലാവരും’ എന്ന ക്രമം ആധുനിക നിലവാരമലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികവും വ്യക്തവുമാണ്. ‘യേശുവിനെ വധിക്കുന്നതിനായി അദ്ദേഹത്തിനെതിരെ ആലോചന നടത്തി’ എന്ന പ്രയോഗം ഔപചാരികവും വായനാസുഗമവുമാണ്.
  terminology: ‘മുഖ്യപുരോഹിതന്മാർ,’ ‘ജനത്തിന്റെ മൂപ്പന്മാർ,’ ‘ആലോചന നടത്തി,’ ‘വധിക്കുക’ എന്നിവ സന്ദർഭത്തിനും സുവിശേഷപരിഭാഷയുടെ ഗൗരവമുള്ള രജിസ്റ്ററിനും അനുയോജ്യമാണ്. ‘ഗൂഢാലോചന’ പോലുള്ള അധികാർഥമുള്ള പദം ഒഴിവാക്കിയിരിക്കുന്നത് ഉചിതമാണ്.
  issues:
