id: MAT.27.1
reference: Matthew 27:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Πρωΐας δὲ γενομένης συμβούλιον ἔλαβον πάντες οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ κατὰ τοῦ Ἰησοῦ ὥστε θανατῶσαι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/001.yaml
  text: When morning came[b][a], all the chief priests and the elders of the people took counsel against Jesus so as to put him to death.
translation:
  language: ml
  text: പ്രഭാതമായപ്പോൾ, മുഖ്യപുരോഹിതന്മാരും ജനത്തിന്റെ മൂപ്പന്മാരും എല്ലാവരും യേശുവിനെ വധിക്കുന്നതിനായി അദ്ദേഹത്തിനെതിരെ ആലോചന നടത്തി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρωΐας δὲ γενομένης
  choice: പ്രഭാതമായപ്പോൾ
  rationale: കാലസൂചകമായ ഈ genitive absolute പ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു. δέ വേറൊരു പദമായി ചേർക്കാതെ സംഭവപരിവർത്തനത്തിലൂടെ സൂചിപ്പിക്കുന്നു.
- source_word: συμβούλιον ἔλαβον
  choice: ആലോചന നടത്തി
  rationale: കൂടിയാലോചനയുടെയും ഔപചാരിക പരിഗണനയുടെയും അർഥം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം; ‘ഗൂഢാലോചന നടത്തി’ എന്നു പറഞ്ഞ് മൂലപാഠത്തിലധികമായ അർഥം ചേർക്കുന്നില്ല.
- source_word: πάντες
  choice: എല്ലാ
  rationale: നേതൃസംഘത്തിന്റെ സമഗ്രമായ പങ്കാളിത്തം മൂലപാഠം ഊന്നുന്നതിനാൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: οἱ ἀρχιερεῖς
  choice: മുഖ്യപുരോഹിതന്മാർ
  rationale: സുവിശേഷങ്ങളിലെ യെരൂശലേമിലെ പുരോഹിതനേതൃത്വത്തെ സൂചിപ്പിക്കുന്ന പതിവും വ്യക്തവുമായ മലയാളപദം.
- source_word: οἱ πρεσβύτεροι τοῦ λαοῦ
  choice: ജനത്തിന്റെ മൂപ്പന്മാർ
  rationale: ഔപചാരിക നേതൃസ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന മൂലഭാഷയിലെ ബന്ധം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: κατὰ τοῦ Ἰησοῦ
  choice: യേശുവിനെതിരെ
  rationale: ഈ ശത്രുതാപരമായ സന്ദർഭത്തിൽ κατά + genitive വെറും ‘യേശുവിനെക്കുറിച്ച്’ എന്നല്ല, എതിർപ്പിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ὥστε
  choice: വധിക്കേണ്ടതിന്
  rationale: തുടർന്നുള്ള infinitive-നോടൊപ്പം ഉദ്ദേശ്യവും ലക്ഷ്യമിട്ട ഫലവും സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ഉദ്ദേശ്യബന്ധമായി അവതരിപ്പിക്കുന്നു.
- source_word: θανατῶσαι αὐτόν
  choice: അദ്ദേഹത്തെ വധിക്കുക
  rationale: ന്യായവിചാരണാസന്ദർഭത്തിന് ചേരുന്ന ഗൗരവവും ഔപചാരികതയും നിലനിർത്തുന്നു; ‘കൊല്ലുക’ എന്നതിനെക്കാൾ ഔപചാരികവും ‘വധശിക്ഷ നടപ്പാക്കുക’ എന്നതിനെക്കാൾ കുറച്ച് വ്യാഖ്യാനാത്മകവുമാണ്.
theological_decisions:
- issue: യേശുവിനോടുള്ള നേതാക്കളുടെ നടപടിയുടെ സ്വഭാവം
  choice: ‘യേശുവിനെ വധിക്കേണ്ടതിന് അദ്ദേഹത്തിനെതിരെ ആലോചന നടത്തി’ എന്ന ശത്രുതാപരമായ കൂടിയാലോചനയും മരണലക്ഷ്യവും വ്യക്തമായി പരിഭാഷപ്പെടുത്തുന്നു.
  alternative: ‘യേശുവിനെക്കുറിച്ച് ആലോചിച്ചു’ എന്ന ദുർബലമായ രൂപമോ ‘യേശുവിനെതിരെ ഗൂഢാലോചന നടത്തി’ എന്ന കൂടുതൽ ശക്തമായ രൂപമോ.
  rationale: κατὰ τοῦ Ἰησοῦ എതിർപ്പും ὥστε θανατῶσαι αὐτόν മരണലക്ഷ്യവും വ്യക്തമാക്കുന്നു. എന്നാൽ συμβούλιον ἔλαβον സ്വതവേ രഹസ്യമായ ഗൂഢാലോചന എന്നു നിർബന്ധിക്കുന്നില്ല; അതിനാൽ മൂലപാഠത്തിന്റെ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് അധിക അർഥം ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഭാഷ ഉപയോഗിച്ചിട്ടും ന്യായവിചാരണാസന്ദർഭത്തിന്റെ ഔപചാരിക ഭാവം നിലനിർത്തുന്നു.
