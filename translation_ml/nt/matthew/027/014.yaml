  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ οὐκ ἀπεκρίθη αὐτῷ πρὸς οὐδὲ ἓν ῥῆμα, ὥστε θαυμάζειν τὸν ἡγεμόνα λίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/014.yaml
  text: And he did not answer him with even one word[b][a], so that the governor was greatly amazed.
translation:
  language: ml
  text: അദ്ദേഹം അദ്ദേഹത്തോട് ഒരു വാക്കുപോലും മറുപടി പറഞ്ഞില്ല; അതിനാൽ ഭരണാധികാരി വളരെ അത്ഭുതപ്പെട്ടു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη αὐτῷ
  choice: അദ്ദേഹം ... മറുപടി പറഞ്ഞില്ല
  rationale: ἀποκρίνομαι എന്ന ക്രിയയുടെ സ്വാഭാവിക അർഥമായ ‘മറുപടി പറയുക’ നിലനിർത്തുന്നു. αὐτῷ സൂചിപ്പിക്കുന്ന വ്യക്തി സന്ദർഭത്തിൽ പീലാത്തൊസ് തന്നെയാണെങ്കിലും, മലയാളത്തിൽ ആവർത്തനം ഒഴിവാക്കി ക്രിയാപ്രയോഗത്തിലൂടെ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാകുന്നു.
- source_word: πρὸς οὐδὲ ἓν ῥῆμα
  choice: ഒരു വാക്കുപോലും
  rationale: οὐδὲ ἓν എന്ന ഊന്നിയ നിഷേധവും ῥῆμα എന്നതിന്റെ സാധാരണ അർഥമായ ‘വാക്ക്/പ്രസ്താവന’യും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പകരുന്നു.
- source_word: ὥστε
  choice: അതിനാൽ
  rationale: ഇവിടെ ὥστε പരിചയപ്പെടുത്തുന്ന ഫലബന്ധം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἡγεμόνα
  choice: നാടുവാഴി
  rationale: റോമൻ പ്രവിശ്യാഭരണാധികാരിയായ പീലാത്തൊസിന്റെ ഔദ്യോഗിക സ്ഥാനം സൂചിപ്പിക്കുന്ന, ബൈബിൾ ഭാഷയിൽ പരിചിതവും മാന്യവുമായ മലയാളപദം.
- source_word: θαυμάζειν ... λίαν
  choice: അത്യന്തം ആശ്ചര്യപ്പെട്ടു
  rationale: λίαν നൽകുന്ന ശക്തമായ അളവും θαυμάζω സൂചിപ്പിക്കുന്ന വിസ്മയപ്രതികരണവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ ഊന്നിയ നിഷേധവും ഫലബന്ധവും നിലനിർത്തി; വ്യാഖ്യാനപരമായ വിപുലീകരണം ഒഴിവാക്കി.
