id: MAT.27.45
reference: Matthew 27:45
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀπὸ δὲ ἕκτης ὥρας σκότος ἐγένετο ἐπὶ πᾶσαν τὴν γῆν ἕως ὥρας ἐνάτης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/045.yaml
  text: From the sixth hour darkness came over all the land until the ninth hour[a][b].
translation:
  language: ml
  text: ആറാം മണിക്കൂർ മുതൽ ഒമ്പതാം മണിക്കൂർ വരെ ദേശമെങ്ങും ഇരുട്ട് ഉണ്ടായി.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ആറാം മണിക്കൂർ ഏകദേശം ഉച്ചയ്ക്കും ഒമ്പതാം മണിക്കൂർ ഏകദേശം ഉച്ചകഴിഞ്ഞ് മൂന്നുമണിക്കും തുല്യമാണ്.
    reason: cultural_note
  - marker: b
    text: അഥവാ, “ഭൂമി മുഴുവൻ.” ഗ്രീക്ക് പദത്തിന് “ദേശം” എന്നും “ഭൂമി” എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ
  choice: മുതൽ
  rationale: ἀπό സമയത്തിന്റെ ആരംഭബിന്ദുവിനെ സൂചിപ്പിക്കുന്നു. δέ മൃദുവായ ബന്ധകമായതിനാൽ മലയാളത്തിൽ പ്രത്യേകം പദമാക്കാതെ സ്വാഭാവികമായ വാക്യപ്രവാഹത്തിൽ ഉൾപ്പെടുത്തി.
- source_word: ἕκτης ὥρας
  choice: ആറാം മണിക്കൂർ
  rationale: മൂലഭാഷയിലെ സമയഗണന അതേപടി നിലനിർത്തുന്നു; ആധുനിക സമയസമാനം അടിക്കുറിപ്പിൽ വിശദീകരിക്കുന്നു.
- source_word: σκότος
  choice: ഇരുട്ട്
  rationale: ഇവിടെ പദത്തിന്റെ നേരിട്ടുള്ള അർഥമായ ഇരുട്ടിനെയാണ് സൂചിപ്പിക്കുന്നത്; ലളിതവും ശക്തവുമായ മലയാളപ്രയോഗം.
- source_word: ἐγένετο
  choice: ഉണ്ടായി
  rationale: ഒരു അവസ്ഥ ആരംഭിച്ചതിനെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐπὶ πᾶσαν τὴν γῆν
  choice: ദേശമെങ്ങും
  rationale: γῆ എന്നതിന് ‘ദേശം’ എന്നും ‘ഭൂമി’ എന്നും അർഥമാകാം. സന്ദർഭപരമായി നിയന്ത്രിതമായ ‘ദേശമെങ്ങും’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; വിശാലമായ മറ്റർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: ἕως ὥρας ἐνάτης
  choice: ഒമ്പതാം മണിക്കൂർവരെ
  rationale: മൂലപാഠത്തിലെ സമയപ്രയോഗം സംരക്ഷിക്കുന്നു; ഇന്നത്തെ സമയക്രമത്തിലെ ഏകദേശം തുല്യസമയം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: ഇരുട്ടിന്റെ വ്യാപ്തിയെ സൂചിപ്പിക്കുന്ന γῆ എന്ന പദം
  choice: ദേശം
  alternative: ഭൂമി മുഴുവൻ
  rationale: γῆ എന്ന ഗ്രീക്ക് പദത്തിന് ഇരു സാധ്യതകളും ഉണ്ട്. ‘ദേശം’ ഉടനെയുള്ള സംഭവസന്ദർഭത്തെ നിലനിർത്തുന്നു; ആഗോള വ്യാപ്തി നിർബന്ധമായി ചുമത്തുന്നില്ല. എന്നാൽ വിശ്വവ്യാപകമായ അർഥസാധ്യത നഷ്ടപ്പെടാതിരിക്കാൻ ‘ഭൂമി മുഴുവൻ’ അടിക്കുറിപ്പിൽ ചേർത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ആറാം മണിക്കൂർ’, ‘ഒമ്പതാം മണിക്കൂർ’ എന്നീ പുരാതന സമയപ്രയോഗങ്ങൾ മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ച് വിശദീകരണം അടിക്കുറിപ്പിലാക്കി. വാക്യാവസാനത്തിലെ രണ്ട് അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ നൽകിയിരിക്കുന്നു.
