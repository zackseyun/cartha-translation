id: MAT.27.54
reference: Matthew 27:54
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὁ δὲ ἑκατόνταρχος καὶ οἱ μετ’ αὐτοῦ τηροῦντες τὸν Ἰησοῦν ἰδόντες τὸν σεισμὸν καὶ τὰ ⸀γενόμενα ἐφοβήθησαν σφόδρα λέγοντες· Ἀληθῶς ⸂θεοῦ υἱὸς⸃ ἦν οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/054.yaml
  text: When the centurion and those with him who were guarding Jesus saw the earthquake and the things that had happened[a], they were greatly afraid and said[c][b], “Truly this was the Son of God.”
translation:
  language: ml
  text: ശതാധിപനും അവനോടൊപ്പമിരുന്ന് യേശുവിനെ കാവൽ കാത്തിരുന്നവരും ഭൂകമ്പവും സംഭവിച്ച കാര്യങ്ങളും കണ്ടപ്പോൾ അത്യന്തം ഭയപ്പെട്ട്, “സത്യമായും ഇവൻ ദൈവപുത്രനായിരുന്നു[a]” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഒരു ദൈവപുത്രനായിരുന്നു” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിൽ θεοῦ υἱός എന്ന പ്രയോഗത്തിന് നിർദേശക ആർട്ടിക്കിൾ ഇല്ല; എന്നാൽ മത്തായിയുടെ സന്ദർഭത്തിൽ ഇവിടെ അത് യേശുവിന്റെ പദവിയായ “ദൈവപുത്രൻ” എന്നു മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἑκατόνταρχος
  choice: ശതാധിപൻ
  rationale: ഒരു റോമൻ സൈനികശതകത്തിന്റെ ചുമതലയുള്ള ഉദ്യോഗസ്ഥനെ സൂചിപ്പിക്കുന്ന കൃത്യവും മലയാള ബൈബിൾഭാഷയിൽ പരിചിതവുമായ പദം.
- source_word: τηροῦντες
  choice: കാവൽ നിന്നിരുന്നവർ
  rationale: വധസ്ഥലത്ത് യേശുവിനെ നിരീക്ഷിച്ചുകൊണ്ട് കാത്തുസൂക്ഷിച്ചിരുന്ന സൈനികരുടെ ചുമതലയാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്; വെറുതെ നോക്കിനിന്നു എന്ന അർഥമല്ല.
- source_word: ἰδόντες
  choice: കണ്ടപ്പോൾ
  rationale: പ്രധാനക്രിയയോടുള്ള കാലബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്ന വിധത്തിൽ ഭൂതകാല പങ്കാളിക്രിയയെ കാലവാക്യമായി പരിഭാഷപ്പെടുത്തി.
- source_word: σεισμόν
  choice: ഭൂകമ്പം
  rationale: σεισμός എന്ന പദത്തിന്റെ ഈ സന്ദർഭത്തിലെ നേരിട്ടുള്ള അർഥം.
- source_word: τὰ γενόμενα
  choice: സംഭവിച്ച കാര്യങ്ങൾ
  rationale: ഭൂകമ്പം മാത്രമല്ല, അതിനോടനുബന്ധിച്ച് നടന്ന സംഭവങ്ങളെയും ഉൾക്കൊള്ളുന്ന ഗ്രീക്ക് ബഹുവചനപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: ἐφοβήθησαν σφόδρα
  choice: അത്യന്തം ഭയപ്പെട്ടു
  rationale: σφόδρα നൽകുന്ന ശക്തമായ തീവ്രത സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: Ἀληθῶς
  choice: സത്യമായും
  rationale: പ്രസ്താവനയുടെ ഉറപ്പും ഗൗരവവും നിലനിർത്തുന്നു; സംസാരിച്ചവരുടെ ദൈവശാസ്ത്രബോധത്തിന്റെ വ്യാപ്തി അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: θεοῦ υἱὸς
  choice: ദൈവപുത്രൻ
  rationale: മത്തായിയുടെ വിവരണസന്ദർഭത്തിൽ യേശുവിനുള്ള പദവിയായി വായിക്കുന്നത് ശക്തമാണ്. മലയാളത്തിൽ നിർദേശക ഉപപദമില്ലാതെയും ‘ദൈവപുത്രൻ’ സ്വാഭാവികമായി പദവിയർഥം നൽകുന്നു; അനിശ്ചിതമായ വായന അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: οὗτος
  choice: ഇവൻ
  rationale: ഗ്രീക്ക് ചൂണ്ടുപേരിന്റെ നേരിട്ടുള്ളതും തത്സമയവുമായ സ്വഭാവം സംരക്ഷിക്കുന്നു; ‘ഈ മനുഷ്യൻ’ എന്നു മൂലത്തിൽ ഇല്ലാത്ത നാമം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: θεοῦ υἱὸς എന്ന പ്രയോഗത്തിന്റെ നിർദിഷ്ടമോ അനിർദിഷ്ടമോ ആയ അർഥം
  choice: ദൈവപുത്രൻ
  alternative: ഒരു ദൈവപുത്രൻ
  rationale: ഗ്രീക്കിൽ പദത്തിന് നിർദേശക ഉപപദമില്ലെങ്കിലും വിധേയനാമത്തിന്റെ ഈ ഘടനയും മത്തായിയുടെ ക്രിസ്തുശാസ്ത്രപരമായ സന്ദർഭവും പദവിയർഥത്തിലുള്ള വായനയെ ശക്തമായി പിന്തുണയ്ക്കുന്നു. എന്നാൽ വ്യാകരണരൂപം മാത്രം അനിർദിഷ്ട വായനയെ പൂർണമായി അസാധ്യമാക്കാത്തതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, ഗൗരവമുള്ള ശൈലി. ‘ശതാധിപൻ’ സൈനികപദത്തിന്റെ കൃത്യത നിലനിർത്തുന്നു; വാക്യഘടന ഗ്രീക്കിലെ കൂട്ടുകർത്താവിനെയും സംഭവക്രമത്തെയും വ്യക്തമായി പിന്തുടരുന്നു.
