  text: At that time they had a notorious prisoner called Jesus Barabbas[a].
translation:
  language: ml
  text: അക്കാലത്ത് യേശു ബറബ്ബാസ് എന്നു വിളിക്കപ്പെട്ടിരുന്ന കുപ്രസിദ്ധനായ ഒരു തടവുകാരൻ അവരുടെ തടങ്കലിൽ ഉണ്ടായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില ഹസ്തപ്രതികൾ ‘യേശു’ ഒഴിവാക്കി ‘ബറബ്ബാസ്’ എന്നു മാത്രം വായിക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: εἶχον
  choice: അവരുടെ കസ്റ്റഡിയിൽ ഉണ്ടായിരുന്നു
  rationale: അവ്യക്തമായ ബഹുവചന കർത്താവിനെയും തടവുകാരനെ അധികാരികൾ കൈവശം വെച്ചിരുന്നതെന്ന ആശയത്തെയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: മൃദുവായ ആഖ്യാനബന്ധം മലയാളത്തിലെ വാക്യക്രമത്തിൽ സ്വാഭാവികമായി പ്രകടമാകുന്നു; ‘എന്നാൽ’ എന്നു ചേർത്താൽ ആവശ്യമില്ലാത്ത വൈരുധ്യഭാവം വരാം.
- source_word: τότε
  choice: അക്കാലത്ത്
  rationale: വ്യക്തമായ കാലസൂചന സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: δέσμιον
  choice: തടവുകാരൻ
  rationale: ന്യായവിസ്താരത്തിന്റെയും കസ്റ്റഡിയുടെയും പശ്ചാത്തലത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ആധുനിക പദം.
- source_word: ἐπίσημον
  choice: കുപ്രസിദ്ധനായ
  rationale: പദത്തിന് ‘പ്രശസ്തൻ/ശ്രദ്ധേയൻ’ എന്ന നിഷ്പക്ഷ സാധ്യതയുണ്ടെങ്കിലും, തടവുകാരനെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ ദുഷ്പേരുള്ളവൻ എന്ന അർഥമാണ് കൂടുതൽ സാധ്യതയുള്ളത്.
- source_word: λεγόμενον
  choice: എന്നു വിളിക്കപ്പെട്ടിരുന്ന
  rationale: പേരോ വിശേഷണമോ പരിചയപ്പെടുത്തുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: Ἰησοῦν Βαραββᾶν
  choice: യേശു ബറബ്ബാസ്
  rationale: നൽകിയിരിക്കുന്ന SBLGNT പാഠത്തിൽ രണ്ട് പേരുകളും ഉള്ളതിനാൽ അവ രണ്ടും മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ബറബ്ബാസിന്റെ പൂർണനാമത്തിന്റെ പാഠരൂപം
  choice: മുഖ്യപാഠത്തിൽ ‘യേശു ബറബ്ബാസ്’ ഉൾപ്പെടുത്തി.
  alternative: ‘യേശു’ ഒഴിവാക്കി ‘ബറബ്ബാസ്’ എന്നു മാത്രം വായിക്കുക.
  rationale: നൽകിയിരിക്കുന്ന മൂലഭാഷാപാഠം Ἰησοῦν Βαραββᾶν എന്നാണ്. അതിനാൽ അതിനെ നേരിട്ട് വിവർത്തനം ചെയ്യുകയും ശ്രദ്ധേയമായ ഹസ്തപ്രതി വ്യത്യാസം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അവർക്കുണ്ടായിരുന്നു’ എന്ന അസ്വാഭാവികമായ ഉടമസ്ഥപ്രയോഗത്തിനു പകരം തടങ്കൽസന്ദർഭം വ്യക്തമാക്കുന്ന ‘അവരുടെ കസ്റ്റഡിയിൽ ഉണ്ടായിരുന്നു’ ഉപയോഗിച്ചു.
