id: MAT.27.44
reference: Matthew 27:44
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τὸ δ’ αὐτὸ καὶ οἱ λῃσταὶ οἱ συσταυρωθέντες ⸀σὺν αὐτῷ ὠνείδιζον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/044.yaml
  text: In the same way[b][a], even the robbers who had been crucified with him were insulting him.
translation:
  language: ml
  text: അതുപോലെതന്നെ[a], അവനോടൊപ്പം ക്രൂശിക്കപ്പെട്ട കവർച്ചക്കാരും അവനെ അധിക്ഷേപിച്ചുകൊണ്ടിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അതേ കാര്യംതന്നെ”; അവരും മുമ്പ് പറഞ്ഞവരെപ്പോലെ അവനോടു പെരുമാറിയെന്നാണ് ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “നിന്ദിച്ചുകൊണ്ടിരുന്നു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ δ’ αὐτὸ
  choice: അതുപോലെതന്നെ
  rationale: മുമ്പ് വിവരിച്ച അതേ തരത്തിലുള്ള പരിഹാസത്തെ സൂചിപ്പിക്കുന്ന ക്രിയാവിശേഷണപരമായ ഗ്രീക്ക് പ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ ഇങ്ങനെ നൽകുന്നു.
- source_word: καὶ
  choice: -ഉം
  rationale: മുമ്പ് പറഞ്ഞവരോടൊപ്പം കവർച്ചക്കാരും അതിൽ ചേർന്നുവെന്ന അർഥം സന്ദർഭത്തിൽ വ്യക്തമായി നൽകുന്നു; ‘പോലും’ എന്നു ചേർത്ത് മൂലത്തിൽ ഉറപ്പില്ലാത്ത അധിക ഊന്നൽ വരുത്തുന്നില്ല.
- source_word: λῃσταὶ
  choice: കവർച്ചക്കാർ
  rationale: λῃστής എന്നത് കവർച്ചക്കാരനെയോ കൊള്ളക്കാരനെയോ സൂചിപ്പിക്കുന്നു; രാഷ്ട്രീയ കലാപകാരികൾ എന്ന അർഥം അനാവശ്യമായി നിർണയിക്കാത്ത വ്യക്തമായ പദമാണിത്.
- source_word: οἱ συσταυρωθέντες σὺν αὐτῷ
  choice: അവനോടൊപ്പം ക്രൂശിക്കപ്പെട്ട
  rationale: കവർച്ചക്കാരെ വിശേഷിപ്പിക്കുന്ന aorist passive participle-ന്റെ സഹക്രൂശീകരണവും കർമണിപ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: ὠνείδιζον
  choice: അധിക്ഷേപിച്ചുകൊണ്ടിരുന്നു
  rationale: അപമാനകരമായി നിന്ദിക്കുക എന്ന അർഥവും imperfect ക്രിയയുടെ തുടർച്ചയായ പ്രവൃത്തിസ്വഭാവവും വ്യക്തമാക്കുന്നു.
- source_word: αὐτόν
  choice: അവനെ
  rationale: നേരിട്ടുള്ള കർമം യേശുവിനെയാണ് സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: ലൂക്കായുടെ വിവരണത്തിൽ ഒരു കുറ്റവാളി വ്യത്യസ്തമായി സംസാരിക്കുന്നതുമായി ഒത്തുചേർക്കണോ
  choice: മത്തായിയുടെ ബഹുവചനപ്രസ്താവന യാതൊരു മൃദൂകരണവുമില്ലാതെ നിലനിർത്തി.
  alternative: ബഹുവചനം മയപ്പെടുത്തുകയോ ഒരാൾ മാത്രമാണ് അധിക്ഷേപിച്ചതെന്ന ധ്വനി നൽകുകയോ ചെയ്യുക.
  rationale: ഗ്രീക്ക് പാഠത്തിൽ λῃσταὶ എന്ന ബഹുവചനവും അതിനൊത്ത ὠνείδιζον എന്ന ക്രിയയും വ്യക്തമാണ്. സുവിശേഷവിവരണങ്ങൾക്കിടയിലെ പ്രത്യക്ഷമായ സംഘർഷം വിവർത്തനം സ്വയം പരിഹരിക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ക്രൂശിക്കപ്പെട്ട’ എന്ന പരിചിത ബൈബിൾപദം നിലനിർത്തി; imperfect-ന്റെ ദൈർഘ്യസ്വഭാവം ‘-കൊണ്ടിരുന്നു’ വഴി പ്രകടമാക്കി. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ നൽകിയിരിക്കുന്നു.
