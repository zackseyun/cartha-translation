id: MAT.27.5
reference: Matthew 27:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ῥίψας τὰ ἀργύρια ⸂εἰς τὸν ναὸν⸃ ἀνεχώρησεν, καὶ ἀπελθὼν ἀπήγξατο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/005.yaml
  text: And throwing the silver into the temple[a], he departed[b], and went and hanged himself.
translation:
  language: ml
  text: ആ വെള്ളിനാണയങ്ങൾ ദേവാലയത്തിനുള്ളിലേക്ക്[a] എറിഞ്ഞിട്ട് അവൻ അവിടെനിന്നു പോയി[b]; പിന്നെ ചെന്ന് തൂങ്ങിമരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വിശുദ്ധമന്ദിരത്തിനുള്ളിലേക്ക്.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്കുപദമായ ναός, ദേവാലയവളപ്പു മുഴുവനെയല്ല, പലപ്പോഴും ദേവാലയത്തിലെ വിശുദ്ധമന്ദിരത്തെയാണ് പ്രത്യേകം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവൻ പിൻവാങ്ങി; പിന്നെ അകന്നുചെന്ന് തൂങ്ങിമരിച്ചു.’ ഗ്രീക്കിൽ പിരിഞ്ഞുപോകുന്നതിനെ സൂചിപ്പിക്കുന്ന രണ്ടു ക്രിയാരൂപങ്ങളുണ്ട്.
    reason: previous_rendering
lexical_decisions:
- source_word: ῥίψας
  choice: എറിഞ്ഞിട്ട്
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള പ്രവൃത്തിയെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; എറിയുക എന്ന ക്രിയയുടെ ശക്തിയും നിലനിർത്തുന്നു.
- source_word: τὰ ἀργύρια
  choice: ആ വെള്ളിനാണയങ്ങൾ
  rationale: പദശഃ ‘ആ വെള്ളി’ എന്നാണെങ്കിലും, സന്ദർഭത്തിൽ തിരികെ നൽകിയ പ്രതിഫലത്തുകയിലെ നാണയങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘വെള്ളിനാണയങ്ങൾ’ സാധാരണ വായനക്കാർക്ക് അർഥം വ്യക്തമാക്കുന്നു.
- source_word: εἰς τὸν ναὸν
  choice: ദേവാലയത്തിനുള്ളിലേക്ക്
  rationale: ναός വിശാലമായ ദേവാലയവളപ്പിനെക്കാൾ വിശുദ്ധമന്ദിരത്തെ പ്രത്യേകം സൂചിപ്പിക്കാം. വായനാസൗകര്യത്തിനായി മുഖ്യപാഠത്തിൽ ‘ദേവാലയം’ ഉപയോഗിച്ച് കൂടുതൽ കൃത്യമായ അർഥം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: ἀνεχώρησεν
  choice: അവിടെനിന്നു പോയി
  rationale: പിരിഞ്ഞുപോകുക, പിൻവാങ്ങുക എന്നീ അർഥങ്ങളുള്ള ക്രിയയെ സന്ദർഭത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἀπελθὼν
  choice: പിന്നെ ചെന്ന്
  rationale: ἀνεχώρησεν എന്ന ആദ്യ ഗമനക്രിയയിൽനിന്ന് വേറിട്ട രണ്ടാമത്തെ ചലനം പൂർണമായി ലയിപ്പിക്കാതെ, മലയാളത്തിലെ സ്വാഭാവിക ക്രമത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀπήγξατο
  choice: തൂങ്ങിമരിച്ചു
  rationale: മധ്യമപ്രയോഗം സ്വയം ചെയ്ത പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ഈ സന്ദർഭത്തിൽ തൂങ്ങി ആത്മഹത്യ ചെയ്തു എന്ന സാധാരണ അർഥം വ്യക്തമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
theological_decisions:
- issue: ναός എന്ന പദത്തിന്റെ പ്രത്യേക അർഥവും പൊതുവായ ദേവാലയപദവും
  choice: മുഖ്യപാഠത്തിൽ ‘ദേവാലയത്തിനുള്ളിലേക്ക്’; അടിക്കുറിപ്പിൽ ‘വിശുദ്ധമന്ദിരത്തിനുള്ളിലേക്ക്’ എന്ന കൃത്യമായ സാദ്ധ്യത
  alternative: ‘വിശുദ്ധമന്ദിരത്തിനുള്ളിലേക്ക്’ എന്നു മുഖ്യപാഠത്തിൽ നേരിട്ട് നൽകുക
  rationale: ഇത് പ്രത്യേക മതസിദ്ധാന്തത്തെ നിർണയിക്കുന്ന കാര്യമല്ലെങ്കിലും സ്ഥലപരമായ കൃത്യത പ്രധാനമാണ്. മുഖ്യപാഠം എളുപ്പം വായിക്കാവുന്നതാക്കി, ഗ്രീക്കുപദത്തിന്റെ കൂടുതൽ പ്രത്യേകമായ സൂചന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ സംഭവത്തിന്റെ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. ‘അവിടെനിന്നു പോയി; പിന്നെ ചെന്ന്’ എന്ന ക്രമം ഗ്രീക്കിലെ രണ്ടു ഗമനപ്രയോഗങ്ങളെയും മലയാളത്തിൽ അമിതമായ ആവർത്തനമില്ലാതെ സംരക്ഷിക്കുന്നു.
