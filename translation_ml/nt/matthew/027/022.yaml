id: MAT.27.22
reference: Matthew 27:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς ὁ Πιλᾶτος· Τί οὖν ποιήσω Ἰησοῦν τὸν λεγόμενον χριστόν; ⸀λέγουσιν πάντες· Σταυρωθήτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/022.yaml
  text: Pilate said to them[a], “What then should I do with Jesus who is called Messiah?” They all said, “Let him be crucified.”
translation:
  language: ml
  text: 'പീലാത്തോസ് അവരോടു ചോദിച്ചു: “അങ്ങനെയെങ്കിൽ, മശീഹാ എന്നു വിളിക്കപ്പെടുന്ന യേശുവിനെ ഞാൻ എന്തു ചെയ്യണം?” എല്ലാവരും പറഞ്ഞു: “അവനെ ക്രൂശിക്കട്ടെ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τί οὖν ποιήσω
  choice: അങ്ങനെയെങ്കിൽ ... ഞാൻ എന്തു ചെയ്യണം?
  rationale: οὖν-ന്റെ നിഗമനാത്മകമായ ബന്ധം ‘അങ്ങനെയെങ്കിൽ’ എന്നു പ്രകടമാക്കുന്നു; deliberative aorist subjunctive ആയ ποιήσω സ്വാഭാവിക മലയാളത്തിൽ ‘ഞാൻ എന്തു ചെയ്യണം?’ എന്നു നൽകി.
- source_word: Ἰησοῦν
  choice: യേശുവിനെ
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പ്രമാണരൂപത്തിൽ ലിപ്യന്തരിച്ചു; വാക്യത്തിലെ കർമവിഭക്തി നിലനിർത്തി.
- source_word: τὸν λεγόμενον χριστόν
  choice: മശീഹാ എന്നു വിളിക്കപ്പെടുന്ന
  rationale: λεγόμενον എന്ന വർത്തമാനകാല കർമണി കൃദന്തരൂപം ‘വിളിക്കപ്പെടുന്ന’ എന്നു നിലനിർത്തി. ഇവിടെ χριστός ഒരു സ്ഥാനപ്പേരായതിനാൽ അതിന്റെ യഹൂദ മശീഹാപരമായ അർഥം വ്യക്തമാക്കുന്ന ‘മശീഹാ’ സ്വീകരിച്ചു.
- source_word: λέγουσιν πάντες
  choice: എല്ലാവരും പറഞ്ഞു
  rationale: ചരിത്രവർത്തമാനമായ λέγουσιν മലയാള ആഖ്യാനശൈലിയിൽ ഭൂതകാലമായി നൽകി; πάντες-ന്റെ സമഗ്രത ‘എല്ലാവരും’ സംരക്ഷിക്കുന്നു.
- source_word: Σταυρωθήτω
  choice: അവനെ ക്രൂശിക്കട്ടെ
  rationale: മൂന്നാംപുരുഷ ഏകവചന aorist passive imperative-ന്റെ ആജ്ഞാർഥവും കർമണിഭാവവും മലയാളത്തിലെ ‘ക്രൂശിക്കട്ടെ’ എന്ന രൂപം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: ഈ സന്ദർഭത്തിൽ പദം യേശുവിന്റെ പേരിന്റെ ഭാഗമെന്നതിലുപരി ‘എന്നു വിളിക്കപ്പെടുന്ന’ ഒരു സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നു. അതിനാൽ മൂലപദത്തിന്റെ അഭിഷിക്ത-രാജാവിനോടു ബന്ധപ്പെട്ട യഹൂദ ആശയം വ്യക്തമാക്കുന്ന ‘മശീഹാ’ ഉപയോഗിച്ചു; പരമ്പരാഗതമായ ‘ക്രിസ്തു’ സാധുവായ മറ്റൊരു അവതരണമാണ്.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ചോദ്യം സംഭാഷണസൗകര്യത്തോടെ അവതരിപ്പിച്ചിരിക്കുന്നു; അവസാന ആജ്ഞയിൽ മൂലത്തിലെ കർമണിരൂപവും കടുത്ത കൂട്ടായ ആവശ്യവും നിലനിർത്തിയിരിക്കുന്നു.
