id: MAT.27.51
reference: Matthew 27:51
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ τὸ καταπέτασμα τοῦ ναοῦ ἐσχίσθη ⸂ἀπ’ ἄνωθεν ἕως κάτω εἰς δύο⸃, καὶ ἡ γῆ ἐσείσθη, καὶ αἱ πέτραι ἐσχίσθησαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/051.yaml
  text: And behold[a], the curtain of the temple was torn in two from top to bottom, and the earth shook, and the rocks were split.
translation:
  language: ml
  text: ഇതാ, ദൈവാലയത്തിലെ തിരശ്ശീല[a] മുകളിൽനിന്ന് താഴെവരെ രണ്ടായി കീറപ്പെട്ടു; ഭൂമി കുലുങ്ങി, പാറകൾ പിളർന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വിശുദ്ധമന്ദിരത്തിലെ മറശ്ശീല.’ ഗ്രീക്കിലെ καταπέτασμα ദൈവാലയത്തിന്റെ ഉള്ളിലെ തിരശ്ശീലയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: പെട്ടെന്നുള്ള ശ്രദ്ധയും നാടകീയ ഊന്നലും നൽകുന്ന ആഖ്യാനസൂചകം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: καταπέτασμα τοῦ ναοῦ
  choice: ദൈവാലയത്തിലെ തിരശ്ശീല
  rationale: καταπέτασμα എന്നത് വിശുദ്ധമന്ദിരത്തിലെ മറശ്ശീലയെ സൂചിപ്പിക്കാം; സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ‘തിരശ്ശീല’ ഉപയോഗിച്ചു. ναός-ന്റെ കൂടുതൽ നിർദിഷ്ടമായ വിശുദ്ധമന്ദിര അർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἐσχίσθη
  choice: കീറിപ്പോയി
  rationale: തുണിയെ സംബന്ധിച്ച് സ്വാഭാവികമായ പ്രയോഗമാണിത്; ഗ്രീക്കിലെ കർമണിപ്രയോഗത്തിന്റെ സംഭവകേന്ദ്രിത സ്വഭാവം നിലനിർത്തുകയും പ്രവർത്തകനെ വ്യക്തമാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀπ’ ἄνωθεν ἕως κάτω εἰς δύο
  choice: മുകളിൽനിന്ന് താഴെവരെ രണ്ടായി
  rationale: കീറലിന്റെ ദിശയ്ക്കുള്ള ആഖ്യാന ഊന്നൽ വ്യക്തമായി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളം.
- source_word: ἡ γῆ ἐσείσθη
  choice: ഭൂമി കുലുങ്ങി
  rationale: വ്യാപകമായ ഭൂകമ്പസൂചനയ്ക്ക് അനുയോജ്യവും സ്വാഭാവികവുമായ വിവർത്തനം; ‘ദേശം’ എന്ന പ്രാദേശിക അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: αἱ πέτραι ἐσχίσθησαν
  choice: പാറകൾ പിളർന്നു
  rationale: വലിയ ശിലാഭാഗങ്ങളെ സൂചിപ്പിക്കാൻ ‘പാറകൾ’ അനുയോജ്യം; σχίζω എന്ന ക്രിയ പാറകളെ സംബന്ധിച്ച് സ്വാഭാവികമായി ‘പിളർന്നു’ എന്നു നൽകിയിരിക്കുന്നു.
theological_decisions:
- issue: ദൈവാലയത്തിലെ അടയാളത്തിന്റെ സ്വഭാവം
  choice: തിരശ്ശീല കീറിയ സംഭവവും അതിനോടൊപ്പമുള്ള അടയാളങ്ങളും വിവരണാത്മകമായി മാത്രം അവതരിപ്പിക്കുന്നു.
  alternative: ദൈവസന്നിധിയിലേക്കുള്ള പ്രവേശനത്തിന്റെ പ്രതീകം എന്നോ ദൈവാലയവ്യവസ്ഥയ്ക്കുമേലുള്ള ന്യായവിധി എന്നോ മുഖ്യപാഠത്തിൽ വിശദീകരിക്കുക.
  rationale: വാക്യം സംഭവത്തിന്റെ ദൈവശാസ്ത്രപരമായ അർഥം നേരിട്ട് വിശദീകരിക്കുന്നില്ല. അതിനാൽ വ്യാഖ്യാനം ചേർക്കാതെ ഉള്ളിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും തുറന്ന നിലയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ആഖ്യാനശൈലി. ‘അപ്പോൾ ഇതാ’ എന്നത് καὶ ἰδοὺ എന്ന തുടർച്ചയും പെട്ടെന്നുള്ള ഊന്നലും ഒരുമിച്ച് നൽകുന്നു; ചെറുവാക്യങ്ങളുടെ താളം മൂലപാഠത്തിലെ സംഭവപരമ്പര നിലനിർത്തുന്നു.
