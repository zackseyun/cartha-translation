    issue: “അപ്പോൾ” in “അപ്പോൾ ഇതാ”
    rationale: καὶ ἰδού is a connective plus an attention-getting particle (“and behold/look”), not specifically a temporal “then.” Removing “അപ്പോൾ” avoids adding a temporal relation.
  - severity: low
    issue: “കീറിപ്പോയി” for ἐσχίσθη
    rationale: Though understandable, this can sound like an unmarked intransitive occurrence. “കീറപ്പെട്ടു” more clearly reflects the Greek passive while leaving the agent unstated.
