id: MAT.27.34
reference: Matthew 27:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔδωκαν αὐτῷ πιεῖν ⸀οἶνον μετὰ χολῆς μεμιγμένον· καὶ γευσάμενος οὐκ ⸀ἠθέλησεν πιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/034.yaml
  text: They gave him wine mixed with gall to drink[a], but after tasting it, he was unwilling to drink.
translation:
  language: ml
  text: അവർ അവന് കുടിക്കാൻ പിത്തരസം കലർത്തിയ വീഞ്ഞ് കൊടുത്തു[a]. എന്നാൽ അത് രുചിച്ചു നോക്കിയശേഷം കുടിക്കാൻ അവൻ മനസ്സുവെച്ചില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: χոլή എന്ന ഗ്രീക്ക് പദത്തിന് ‘പിത്തരസം’ എന്നും കൂടുതൽ പൊതുവായി ‘കയ്പുള്ള വസ്തു’ എന്നും അർഥമാകാം. മത്തായിയുടെ പദപ്രയോഗം പ്രതിഫലിപ്പിക്കാൻ ഇവിടെ ‘പിത്തരസം’ എന്നു നൽകിയിരിക്കുന്നു; ബന്ധപ്പെട്ട പീഡാനുഭവവിവരണമായ മാർക്കോസ് 15:23-ൽ ‘മൂർ’ എന്നാണ് പറയുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκαν αὐτῷ πιεῖν
  choice: അവർ അവന് കുടിക്കാൻ ... കൊടുത്തു
  rationale: δίδωμι എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥമായ ‘കൊടുത്തു’ നിലനിർത്തുന്നു; ദാതൃവിഭക്തിയിലുള്ള αὐτῷ പരോക്ഷ കർമമായും πιεῖν ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന അനന്തരൂപമായും സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: οἶνον
  choice: വീഞ്ഞ്
  rationale: മുന്തിരിവീഞ്ഞിനെ സൂചിപ്പിക്കുന്ന സാധാരണ ഗ്രീക്ക് പദത്തിന് വ്യക്തവും നിലവാരമുള്ളതുമായ മലയാള സമാനപദം.
- source_word: μετὰ χολῆς μεμιγμένον
  choice: പിത്തരസം കലർത്തിയ
  rationale: μεμιγμένον എന്നതിലെ കലർത്തപ്പെട്ട അവസ്ഥ വ്യക്തമാക്കുന്നു. χολήയുടെ പ്രാഥമികമായ ‘പിത്തരസം’ എന്ന അർഥം നിലനിർത്തുകയും അതിന് കൂടുതൽ പൊതുവായ ‘കയ്പുള്ള വസ്തു’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: καὶ γευσάμενος
  choice: എന്നാൽ അത് രുചിച്ചുനോക്കിയശേഷം
  rationale: γευσάμενος എന്ന മുൻകാലക്രിയയുടെ ‘രുചിച്ചുനോക്കിയശേഷം’ എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു; തുടർന്നുള്ള കുടിക്കാതിരിക്കലുമായുള്ള പ്രസംഗപരമായ വൈരുധ്യം കണക്കിലെടുത്ത് καίയെ ‘എന്നാൽ’ എന്നു വിവർത്തനം ചെയ്യുന്നു.
- source_word: οὐκ ἠθέλησεν πιεῖν
  choice: അവൻ കുടിക്കാൻ ഇഷ്ടപ്പെട്ടില്ല
  rationale: θέλωയിലെ ഇച്ഛയുടെയും മനസ്സിന്റെയും ഭാവം നിലനിർത്തുന്നു; ‘നിരസിച്ചു’ എന്നതുപോലെ പ്രവൃത്തിയെ കൂടുതൽ ശക്തമാക്കി വ്യാഖ്യാനിക്കുന്നില്ല.
theological_decisions:
- issue: പീഡാനുഭവവിവരണത്തിലും സങ്കീർത്തനപ്രതിധ്വനിയിലും χολήയുടെ അവതരണം
  choice: പിത്തരസം
  alternative: കയ്പുള്ള വസ്തു
  rationale: χոլήയ്ക്ക് ശരീരത്തിലെ പിത്തരസം എന്നും വിപുലമായ അർഥത്തിൽ കയ്പുള്ള വസ്തു എന്നും വരാം. പ്രധാന പാഠത്തിൽ കൂടുതൽ നിർദിഷ്ടമായ പദം നിലനിർത്തുന്നത് മത്തായിയുടെ വാക്കും സാധ്യതയുള്ള തിരുവെഴുത്തുപ്രതിധ്വനിയും സംരക്ഷിക്കുന്നു; അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു. മാർക്കോസ് 15:23-ലെ ‘മൂറ്’ ഇതുമായി മൗനമായി സമീകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ‘പിത്തരസം’ കൃത്യവും പരിചിതവുമായ പദമായി ഉപയോഗിച്ചു; ‘ഇഷ്ടപ്പെട്ടില്ല’ θέλωയുടെ ഇച്ഛാഭാവം അതിശക്തമാക്കാതെ സംരക്ഷിക്കുന്നു.
