review_pass:
  verdict: revise
  source_fidelity: The draft faithfully conveys Joseph's placing of Jesus' body in his own new rock-cut tomb and his subsequent departure. However, “പ്രവേശനകവാടത്തിങ്കൽ” means ‘near/by the entrance’ and weakens the directional, closing action of προσκυλίσας ... τῇ θύρᾳ. A directional rendering better represents rolling the stone into position at the tomb entrance.
  naturalness: The Malayalam is generally clear and modern. “കല്ലറയുടെ പ്രവേശനദ്വാരത്തിലേക്ക്” is more idiomatic and precise here than the heavier “പ്രവേശനകവാടത്തിങ്കൽ.”
  terminology: “കല്ലറ,” “പാറയിൽ വെട്ടിയുണ്ടാക്കിയ,” “പുതിയ,” and “വലിയ കല്ല്” are appropriate for the burial setting and preserve the source terminology without adding interpretive detail.
  issues:
  - severity: medium
    issue: The stone is said to be rolled ‘at/near’ the entrance rather than to the entrance/doorway.
    rationale: The dative τῇ θύρᾳ with προσκυλίσας depicts the stone being rolled into position at the tomb's door or entrance. “ത്തിങ്കൽ” can merely locate the act nearby and does not adequately express this directional, obstructing placement.
  revised_text: അവൻ ആ ശരീരം പാറയിൽ വെട്ടിയുണ്ടാക്കിയ തന്റെ പുതിയ കല്ലറയിൽ വെച്ചു. പിന്നെ കല്ലറയുടെ പ്രവേശനദ്വാരത്തിലേക്ക് ഒരു വലിയ കല്ല് ഉരുട്ടിവെച്ചശേഷം അവൻ പോയി.
  revised_footnotes: []
  revision_rationale: The revision changes only the spatial expression for the stone, replacing a static ‘near the entrance’ formulation with a directional phrase that naturally conveys rolling it into place at the tomb entrance. The source's simple narrative sequence, Joseph's ownership of the new tomb, and the rock-hewn setting are retained.
