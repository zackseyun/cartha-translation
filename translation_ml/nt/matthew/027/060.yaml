id: MAT.27.60
reference: Matthew 27:60
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἔθηκεν αὐτὸ ἐν τῷ καινῷ αὐτοῦ μνημείῳ ὃ ἐλατόμησεν ἐν τῇ πέτρᾳ, καὶ προσκυλίσας λίθον μέγαν τῇ θύρᾳ τοῦ μνημείου ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/060.yaml
  text: and placed it in his own new tomb[a], which he had cut into the rock. And after rolling a large stone to the entrance of the tomb, he went away.
translation:
  language: ml
  text: അവൻ ആ ശരീരം പാറയിൽ വെട്ടിയുണ്ടാക്കിയ തന്റെ പുതിയ കല്ലറയിൽ വെച്ചു. പിന്നെ കല്ലറയുടെ പ്രവേശനദ്വാരത്തിലേക്ക് ഒരു വലിയ കല്ല് ഉരുട്ടിവെച്ചശേഷം അവൻ പോയി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔθηκεν αὐτό
  choice: ആ ശരീരം ... വെച്ചു
  rationale: αὐτό യേശുവിന്റെ ശരീരത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ പരാമർശം വ്യക്തമാക്കാൻ ‘ആ ശരീരം’ എന്നും, τίθημι എന്ന ലളിതമായ പ്രവർത്തിക്ക് സ്വാഭാവികമായ ‘വെച്ചു’ എന്നും വിവർത്തനം ചെയ്തു.
- source_word: ἐν τῷ καινῷ αὐτοῦ μνημείῳ
  choice: തന്റെ പുതിയ കല്ലറയിൽ
  rationale: μνημεῖον ഇവിടെ പാറയിൽ വെട്ടിയുണ്ടാക്കിയ ശവസംസ്കാരസ്ഥലമാണ്; അതിനാൽ ‘കല്ലറ’ യോജിക്കുന്നു. καινός എന്നത് നേരിട്ട് ‘പുതിയ’ എന്നാണ്; ‘ഉപയോഗിക്കാത്ത’ എന്ന സൂചന പാഠത്തിൽ കൂട്ടിച്ചേർത്തിട്ടില്ല. αὐτοῦ ഉടമസ്ഥത വ്യക്തമാക്കുന്നതിനാൽ ‘തന്റെ’ എന്നു നൽകി.
- source_word: ὃ ἐλατόμησεν ἐν τῇ πέτρᾳ
  choice: പാറയിൽ വെട്ടിയുണ്ടാക്കിയ
  rationale: λατομέω പാറ വെട്ടി/കൊത്തി രൂപപ്പെടുത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘വെട്ടിയുണ്ടാക്കിയ’ എന്നത് പാറക്കല്ലറയുടെ നിർമ്മാണം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ബന്ധവാക്യത്തിന്റെ കർത്താവ് യോസേഫാണെന്നത് സന്ദർഭത്തിൽ നിലനിൽക്കുന്നു.
- source_word: προσκυλίσας λίθον μέγαν
  choice: ഒരു വലിയ കല്ല് ഉരുട്ടിവെച്ചശേഷം
  rationale: ആഓറിസ്റ്റ് കൃതന്തം മുഖ്യക്രിയയ്ക്കു മുമ്പുള്ള പ്രവർത്തിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ശേഷം’ ഉപയോഗിച്ചു. προσκυλίωയിലെ ഉരുട്ടുന്ന പ്രവൃത്തിയും കല്ല് സ്ഥാനത്ത് വെച്ചതും ‘ഉരുട്ടിവെച്ചു’ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: τῇ θύρᾳ τοῦ μνημείου
  choice: കല്ലറയുടെ പ്രവേശനകവാടത്തിങ്കൽ
  rationale: θύραയ്ക്ക് ‘വാതിൽ’ എന്നും ‘പ്രവേശനം/കവാടം’ എന്നും അർഥമാകാം. പാറയിൽ വെട്ടിയ കല്ലറയുടെ തുറവിനെ ആധുനിക hinged door ആയി തെറ്റിദ്ധരിക്കാതിരിക്കാൻ ‘പ്രവേശനകവാടം’ തെരഞ്ഞെടുത്തു; ദത്തിവ് സ്ഥാനബന്ധമായി ‘ത്തിങ്കൽ’ കൊണ്ടു പ്രകടിപ്പിച്ചു.
- source_word: ἀπῆλθεν
  choice: അവൻ പോയി
  rationale: ἀπέρχομαι ഇവിടെ ലളിതമായ പുറപ്പെട്ടുപോകലാണ് സൂചിപ്പിക്കുന്നത്. ‘അവൻ പോയി’ ആധുനിക മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനപ്രയോഗമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. മൂലപാഠത്തിലെ പ്രവർത്തനക്രമം സൂക്ഷിച്ചു. ‘കല്ലറ’യും ‘പ്രവേശനകവാടം’യും പാറയിൽ വെട്ടിയ ശവസംസ്കാരസ്ഥലത്തിന്റെ സാഹചര്യം വ്യക്തമായി അറിയിക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘ഉപയോഗിക്കാത്ത’ പോലുള്ള വിശദീകരണം ചേർത്തിട്ടില്ല.
