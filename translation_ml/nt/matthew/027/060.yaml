revisions:
- from: അവൻ ആ ശരീരം പാറയിൽ വെട്ടിയുണ്ടാക്കിയ തന്റെ പുതിയ കല്ലറയിൽ വെച്ചു. പിന്നെ കല്ലറയുടെ പ്രവേശനകവാടത്തിങ്കൽ ഒരു വലിയ കല്ല് ഉരുട്ടിവെച്ചശേഷം അവൻ പോയി.
  to: അവൻ ആ ശരീരം പാറയിൽ വെട്ടിയുണ്ടാക്കിയ തന്റെ പുതിയ കല്ലറയിൽ വെച്ചു. പിന്നെ കല്ലറയുടെ പ്രവേശനദ്വാരത്തിലേക്ക് ഒരു വലിയ കല്ല് ഉരുട്ടിവെച്ചശേഷം അവൻ പോയി.
  rationale: The revision changes only the spatial expression for the stone, replacing a static ‘near the entrance’ formulation with a directional phrase that naturally conveys rolling it into place at the tomb entrance. The source's simple narrative sequence, Joseph's ownership of the new tomb, and the rock-hewn setting are retained.
