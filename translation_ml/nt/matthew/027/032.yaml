revisions:
- from: അവർ പുറത്തേക്കു പോകുമ്പോൾ, കുറേനക്കാരനായ ശിമോൻ എന്നു പേരുള്ള ഒരു മനുഷ്യനെ കണ്ടു. അവന്റെ[b] കുരിശ് ചുമക്കാൻ അവർ അയാളെ നിർബന്ധിച്ചു[a].
  to: അവർ പുറത്തേക്കു പോകുമ്പോൾ, കുറേനക്കാരനായ ശിമോൻ എന്നു പേരുള്ള ഒരു മനുഷ്യനെ കണ്ടു. യേശുവിന്റെ[b] കുരിശ് ചുമക്കാൻ അവർ അയാളെ നിർബന്ധിച്ചു[a].
  rationale: യേശുവിനെ സൂചിപ്പിക്കുന്ന αὐτοῦ-വിനെ മലയാളത്തിൽ ‘അവന്റെ’ എന്നു നിലനിർത്തുന്നത് ശിമോനിലേക്കുള്ള തെറ്റായ സമീപസൂചന ഉണ്ടാക്കുന്നു. അതിനാൽ പ്രധാനപാഠത്തിൽ ‘യേശുവിന്റെ’ എന്നു വ്യക്തമാക്കി, ഗ്രീക്കിലെ സർവനാമപ്രയോഗം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി. മറ്റെല്ലാ വായനകളും നിലനിർത്തിയിരിക്കുന്നു.
