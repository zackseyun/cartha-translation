id: MAT.27.32
reference: Matthew 27:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐξερχόμενοι δὲ εὗρον ἄνθρωπον Κυρηναῖον ὀνόματι Σίμωνα· τοῦτον ἠγγάρευσαν ἵνα ἄρῃ τὸν σταυρὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/032.yaml
  text: And as they were going out[a], they found a man of Cyrene named Simon[b]. They compelled him to carry his cross.
translation:
  language: ml
  text: അവർ പുറത്തേക്കു പോകുമ്പോൾ, കുറേനക്കാരനായ ശിമോൻ എന്നു പേരുള്ള ഒരു മനുഷ്യനെ കണ്ടു. യേശുവിന്റെ[b] കുരിശ് ചുമക്കാൻ അവർ അയാളെ നിർബന്ധിച്ചു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അധികാരബലത്തിൽ നിർബന്ധിച്ചു’ അല്ലെങ്കിൽ ‘നിർബന്ധിത സേവനത്തിന് നിയോഗിച്ചു’ എന്നും പരിഭാഷപ്പെടുത്താം. അധികാരമുള്ളവർ ചുമത്തുന്ന നിർബന്ധിത സേവനത്തെയാണ് ഗ്രീക്ക് ക്രിയ സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ ‘അവന്റെ കുരിശ്’ എന്നാണ്. സന്ദർഭത്തിൽ ഈ സർവനാമം യേശുവിനെ സൂചിപ്പിക്കുന്നു.
    reason: referent_clarification
lexical_decisions:
- source_word: Ἐξερχόμενοι
  choice: അവർ പുറത്തേക്കു പോകുമ്പോൾ
  rationale: വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ സമകാലികമായ കാലാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; മൂലപാഠത്തിൽ പറയാത്ത സ്ഥലം ചേർക്കുന്നില്ല.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയില്ല
  rationale: ഇവിടെ ശക്തമായ വിരോധമല്ല, ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്ന മൃദുവായ ബന്ധകമാണ്; മലയാളത്തിലെ വാക്യക്രമം തന്നെ ആ ബന്ധം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: εὗρον
  choice: കണ്ടു
  rationale: εὑρίσκω എന്ന ക്രിയയുടെ സന്ദർഭോചിതവും ലളിതവുമായ മലയാളസമാനം.
- source_word: ἄνθρωπον Κυρηναῖον
  choice: കുറേനക്കാരനായ ... ഒരു മനുഷ്യനെ
  rationale: കുറേന എന്ന സ്ഥലത്തോടുള്ള ഭൂമിശാസ്ത്രപരമായ ബന്ധം വ്യക്തമായി സൂക്ഷിക്കുന്നു.
- source_word: ὀνόματι Σίμωνα
  choice: ശിമോൻ എന്നു പേരുള്ള
  rationale: പേരിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവികമായ ആധുനിക മലയാളരൂപം.
- source_word: τοῦτον
  choice: അയാളെ
  rationale: മുൻപ് പരാമർശിച്ച ശിമോനെ വ്യക്തമായി തിരിച്ചുകാട്ടുകയും മലയാളത്തിൽ അനാവശ്യമായ ആവർത്തനം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: ἠγγάρευσαν
  choice: നിർബന്ധിച്ചു
  rationale: അധികാരപ്രയോഗത്തിലൂടെ ഒരാളെ നിർബന്ധിത സേവനത്തിന് നിയോഗിക്കുന്ന ക്രിയയുടെ ബലപ്രയോഗാർഥം സംക്ഷിപ്തമായി നൽകുന്നു; പ്രത്യേക നിഴലർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἵνα ἄρῃ
  choice: ചുമക്കാൻ
  rationale: ἵνα സഹിതമുള്ള വിധിലിംഗരൂപത്തിന്റെ ഉദ്ദേശ്യാർഥം മലയാളത്തിലെ ക്രിയാനാമപ്രയോഗത്തിലൂടെ സ്വാഭാവികമായി നൽകുന്നു; αἴρω ഇവിടെ എടുത്തുചുമക്കുക എന്നർഥത്തിലാണ്.
- source_word: τὸν σταυρὸν
  choice: കുരിശ്
  rationale: σταυρός എന്ന പദത്തിന്റെ സ്ഥാപിതവും സന്ദർഭത്തിന് യോജിച്ചതുമായ മലയാളസമാനം; മൂലപാഠം നിർബന്ധിക്കാത്ത ‘കുറുകെമരം’ എന്ന ചുരുക്കാർഥം ചേർക്കുന്നില്ല.
- source_word: αὐτοῦ
  choice: അവന്റെ
  rationale: ഗ്രീക്കിലെ സർവനാമരൂപം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അത് യേശുവിനെ സൂചിപ്പിക്കുന്നുവെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: αὐτοῦ (‘അവന്റെ’) എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: പ്രധാനപാഠത്തിൽ ‘അവന്റെ’ എന്ന സർവനാമം നിലനിർത്തി, അത് യേശുവിനെ സൂചിപ്പിക്കുന്നതായി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: പ്രധാനപാഠത്തിൽ ‘യേശുവിന്റെ കുരിശ്’ എന്ന് വ്യക്തമായി എഴുതുക.
  rationale: ആഖ്യാനസന്ദർഭത്തിൽ കുരിശ് യേശുവിന്റേതാണെന്ന് വ്യക്തമാണ്. എങ്കിലും മൂലപാഠത്തിലെ സർവനാമം നേരിട്ട് ഒരു പേര് ഉപയോഗിച്ച് മാറ്റാതെ സൂക്ഷിക്കുന്നത് രൂപവും സന്ദർഭവും ഒരുപോലെ മാനിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. പരമ്പരാഗതമായി പരിചിതമായ ‘കുറേനക്കാരൻ’, ‘ശിമോൻ’, ‘കുരിശ്’ എന്നീ രൂപങ്ങൾ നിലനിർത്തി; മൂലപാഠത്തിൽ ഇല്ലാത്ത സ്ഥലം അല്ലെങ്കിൽ ചരിത്രവിശദീകരണം ചേർത്തിട്ടില്ല.
