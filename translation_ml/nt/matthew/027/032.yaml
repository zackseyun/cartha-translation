  verdict: revise
  source_fidelity: ഗ്രീക്കിലെ ἠγγάρευσαν എന്നത് അധികാരബലത്താൽ നിർബന്ധിത സേവനത്തിനു നിയോഗിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘നിർബന്ധിച്ചു’യും അതിനോടനുബന്ധിച്ച അടിക്കുറിപ്പും ഇത് യഥാവിധി നൽകുന്നു. ‘കുറേനക്കാരനായ ശിമോൻ’ എന്നതും ‘ചുമക്കാൻ’ എന്നതും മൂലപാഠത്തോട് വിശ്വസ്തമാണ്. എന്നാൽ മലയാളത്തിൽ ‘അവന്റെ കുരിശ്’ എന്നത് തൊട്ടുമുമ്പ് പരാമർശിക്കപ്പെട്ട ശിമോന്റെ കുരിശായി സ്വാഭാവികമായി വായിക്കപ്പെടാൻ സാധ്യതയുണ്ട്. ഇവിടെ αὐτοῦ-വിന്റെ സന്ദർഭനിർണിത സൂചിതവ്യക്തി യേശുവാണ്; അതിനാൽ പ്രധാനപാഠത്തിൽ അത് വ്യക്തമാക്കുന്നതാണ് സുരക്ഷിതം.
  naturalness: വാക്യക്രമവും രജിസ്റ്ററും ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികമാണ്. ‘പുറത്തേക്കു പോകുമ്പോൾ’ എന്നത് പങ്കുപ്രയോഗത്തിന്റെ കാലബന്ധം നന്നായി നൽകുന്നു. ‘യേശുവിന്റെ കുരിശ്’ എന്ന് ഉപയോഗിക്കുന്നത് മലയാളത്തിലെ ആശയസൂചന കൂടുതൽ വ്യക്തവും സ്വാഭാവികവുമാക്കും.
  terminology: ‘കുറേനക്കാരനായ’, ‘ശിമോൻ’, ‘കുരിശ്’ എന്നിവ സ്ഥാപിതവും അനുയോജ്യവുമായ രൂപങ്ങളാണ്. ‘നിർബന്ധിത സേവനത്തിന് നിയോഗിച്ചു’ എന്ന അടിക്കുറിപ്പ് ἀγγαρεύω-യുടെ പ്രത്യേക ഭരണാധികാര-നിർബന്ധന നിഴലർഥം നന്നായി രേഖപ്പെടുത്തുന്നു.
  issues:
