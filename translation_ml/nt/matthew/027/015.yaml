- from: ഉത്സവസമയത്ത് ജനക്കൂട്ടം ആഗ്രഹിക്കുന്ന ഒരു തടവുകാരനെ അവർക്കു വിട്ടുകൊടുക്കുന്നത് നാടുവാഴിയുടെ പതിവായിരുന്നു.
  to: ഉത്സവസമയത്ത് ജനക്കൂട്ടം ആഗ്രഹിക്കുന്ന ഒരു തടവുകാരനെ മോചിപ്പിക്കുന്നത് ഗവർണറുടെ പതിവായിരുന്നു.
