id: MAT.27.15
reference: Matthew 27:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Κατὰ δὲ ἑορτὴν εἰώθει ὁ ἡγεμὼν ἀπολύειν ἕνα τῷ ὄχλῳ δέσμιον ὃν ἤθελον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/015.yaml
  text: At the feast the governor was accustomed to release to the crowd one prisoner[a], whom they wanted.
translation:
  language: ml
  text: ഉത്സവസമയത്ത് ജനക്കൂട്ടം ആഗ്രഹിക്കുന്ന ഒരു തടവുകാരനെ മോചിപ്പിക്കുന്നത് ഗവർണറുടെ പതിവായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κατὰ δὲ ἑορτὴν
  choice: ഉത്സവസമയത്ത്
  rationale: κατά + accusative ഇവിടെ കാലസൂചനയാണ്; δέയുടെ ലഘുവായ ആഖ്യാനബന്ധം മലയാളത്തിൽ പ്രത്യേക പദം ചേർക്കാതെ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: ἑορτὴν
  choice: ഉത്സവം
  rationale: ἑορτή മതപരമായ ഉത്സവത്തെയോ പെരുന്നാളിനെയോ സൂചിപ്പിക്കുന്നു; ആധുനിക സാധാരണ മലയാളത്തിൽ ‘ഉത്സവം’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: εἰώθει
  choice: പതിവായിരുന്നു
  rationale: അപൂർണകാല ക്രിയാരൂപത്തിലെ ആവർത്തിച്ചിരുന്ന പഴയ പതിവ് വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ὁ ἡγεμὼν
  choice: നാടുവാഴി
  rationale: റോമൻ പ്രവിശ്യാഭരണാധികാരിയെ സൂചിപ്പിക്കുന്ന ἡγεμών എന്ന പദത്തിന് ബൈബിൾസന്ദർഭത്തിൽ പരിചിതവും മാന്യവുമായ മലയാളരൂപം.
- source_word: ἀπολύειν
  choice: വിട്ടുകൊടുക്കുന്നത്
  rationale: തടങ്കലിൽനിന്നു മോചിപ്പിച്ച് ജനക്കൂട്ടത്തിന് വിട്ടുനൽകുന്ന അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἕνα ... δέσμιον
  choice: ഒരു തടവുകാരനെ
  rationale: എണ്ണവും തടങ്കലിലായ വ്യക്തിയെന്ന അർഥവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: τῷ ὄχλῳ
  choice: അവർക്കു
  rationale: മുൻപുള്ള ‘ജനക്കൂട്ടം’ എന്നതിലേക്കു മടങ്ങുന്ന ദാതൃവിഭക്തി; അനാവശ്യ ആവർത്തനം ഒഴിവാക്കുന്ന സ്വാഭാവിക മലയാളം.
- source_word: ὃν ἤθελον
  choice: ജനക്കൂട്ടം ആഗ്രഹിക്കുന്ന
  rationale: ഏത് തടവുകാരനെന്ന തിരഞ്ഞെടുപ്പ് ജനക്കൂട്ടത്തിന്റേതാണെന്ന് വ്യക്തമാക്കുന്നു; ഗ്രീക്കിലെ ഏകവചനബന്ധം നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വാക്യക്രമം മലയാളത്തിന്റെ സ്വാഭാവികതയ്ക്കായി ക്രമീകരിച്ചിട്ടും ഉറവിടത്തിലെ പതിവ്, ഒരാൾ, ജനക്കൂട്ടത്തിന്റെ തിരഞ്ഞെടുപ്പ് എന്നീ ഘടകങ്ങൾ സംരക്ഷിച്ചിട്ടുണ്ട്.
