  text: അവർ അവനെ ക്രൂശിച്ചശേഷം[a], നറുക്കിട്ട് അവന്റെ വസ്ത്രങ്ങൾ പങ്കിട്ടെടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
