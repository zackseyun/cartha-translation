    text: 'കൂടുതൽ പദാനുസൃതമായി: “അവനെ ക്രൂശിച്ചശേഷം അവർ അവന്റെ വസ്ത്രങ്ങൾ നറുക്കിട്ടുകൊണ്ട് വിഭജിച്ചു.”'
    reason: σταυρώσαντες എന്ന മുൻകാല participle-ന്റെയും βάλλοντες κλῆρον എന്ന മാർഗസൂചക participial phrase-ന്റെയും കൂടുതൽ രൂപാനുസൃതമായ അവതരണം നൽകുന്നു.
lexical_decisions:
- source_word: σταυρώσαντες
  choice: ക്രൂശിച്ചശേഷം
  rationale: പ്രധാനക്രിയയായ വസ്ത്രങ്ങൾ പങ്കിടുന്നതിനു മുമ്പ് ക്രൂശിക്കൽ നടന്നുവെന്ന് സൂചിപ്പിക്കുന്ന aorist participle-ന്റെ കാലക്രമബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇവിടെ δέ കഥ മുന്നോട്ടുകൊണ്ടുപോകുന്ന മൃദുവായ ബന്ധകമാണ്. മലയാളത്തിലെ വാക്യക്രമവും മുൻസന്ദർഭവും ആ ബന്ധം സ്വാഭാവികമായി വഹിക്കുന്നതിനാൽ പ്രത്യേകമായി ‘പിന്നെ’ എന്നോ ‘എന്നാൽ’ എന്നോ ചേർക്കുന്നത് അനാവശ്യമാണ്.
- source_word: διεμερίσαντο
  choice: പങ്കിട്ടെടുത്തു
  rationale: വസ്ത്രങ്ങൾ തങ്ങൾക്കിടയിൽ വിഭജിച്ചെടുത്ത concrete action-നെ സ്വാഭാവികമായി അറിയിക്കുന്നു; ‘വിഭജിച്ചു’ എന്നതിനേക്കാൾ ഈ സന്ദർഭത്തിൽ സാധാരണ വായനക്കാർക്ക് സുതാര്യമാണ്.
- source_word: τὰ ἱμάτια αὐτοῦ
  choice: അവന്റെ വസ്ത്രങ്ങൾ
  rationale: ἱμάτια എന്ന പൊതുവായ ബഹുവചനത്തിന് അനാവശ്യമായി ‘മേൽവസ്ത്രങ്ങൾ’ എന്ന പ്രത്യേകത നൽകാതെ, dignified and current Malayalam നൽകുന്നു.
- source_word: βάλλοντες κλῆρον
  choice: നറുക്കിട്ട്
  rationale: κλῆρον ഏകവചനമായിരിക്കുമ്പോഴും ഇത് നറുക്കെടുപ്പിലൂടെ തീരുമാനിക്കുന്ന പതിവിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘നറുക്കിട്ട്’ എന്നത് പങ്കിടലിന്റെ മാർഗം ചുരുക്കമായും വ്യക്തമായും അറിയിക്കുന്നു.
theological_decisions:
- issue: βάλλοντες κλῆρον എന്ന participial phrase-നും διεμερίσαντο എന്ന പ്രധാനക്രിയയ്ക്കുമിടയിലെ ബന്ധം
  choice: ‘നറുക്കിട്ട് ... പങ്കിട്ടെടുത്തു’ എന്നു നൽകി, നറുക്കിടൽ വസ്ത്രങ്ങൾ പങ്കിടാനുള്ള മാർഗമായിരുന്നെന്ന് പ്രകടമാക്കി.
  alternative: ‘അവന്റെ വസ്ത്രങ്ങൾ പങ്കിട്ടെടുത്തു; അവർ നറുക്കിട്ടു’ അല്ലെങ്കിൽ ‘നറുക്കിട്ടുകൊണ്ട് പങ്കിട്ടെടുത്തു.’
  rationale: ഗ്രീക്ക് participle പ്രധാനക്രിയയെ സ്വാഭാവികമായി വിശേഷിപ്പിച്ച് പങ്കിടൽ എങ്ങനെ നടന്നു എന്നു വ്യക്തമാക്കുന്നു. ‘നറുക്കിട്ട്’ ഈ ബന്ധം അധിക ദൈവശാസ്ത്രവ്യാഖ്യാനം ചേർക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ‘ക്രൂശിച്ചു’ എന്ന പരിചിതമായ പാഷൻ-വിവരണ പദം നിലനിർത്തി; ‘വസ്ത്രങ്ങൾ’, ‘നറുക്കിട്ട്’, ‘പങ്കിട്ടെടുത്തു’ എന്നിവ സ്വാഭാവികവും അമിതപുരാതനമല്ലാത്തതുമാണ്.
