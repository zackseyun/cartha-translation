revisions:
- from: 'എന്നാൽ അവൻ ചോദിച്ചു[a]: “അവൻ എന്തു തിന്മയാണ് ചെയ്തത്?” പക്ഷേ അവർ കൂടുതൽ ഉച്ചത്തിൽ നിലവിളിച്ചുകൊണ്ടിരുന്നു: “അവൻ ക്രൂശിക്കപ്പെടട്ടെ!”[b]'
  to: 'എന്നാൽ അവൻ പറഞ്ഞു: “അവൻ എന്തു തിന്മയാണ് ചെയ്തത്?”[a] എന്നാൽ അവർ കൂടുതൽ ശക്തമായി ആർത്തുവിളിച്ചുകൊണ്ടിരുന്നു: “അവൻ ക്രൂശിക്കപ്പെടട്ടെ!”[b]'
  rationale: ἔφη-യുടെ അർഥം ‘പറഞ്ഞു’ എന്നാക്കി തിരുത്തി. περισσῶς-നെ ശബ്ദത്തിന്റെ അളവായി പരിമിതപ്പെടുത്താതെ പ്രതികരണത്തിന്റെ തീവ്രതയായി പരിഭാഷപ്പെടുത്തി. അപൂർണഭൂതകാലമായ ἔκραζον-ന്റെ തുടരുന്ന ഭാവം ‘ആർത്തുവിളിച്ചുകൊണ്ടിരുന്നു’ എന്നും നിഷ്ക്രിയ ആജ്ഞാരൂപം ‘ക്രൂശിക്കപ്പെടട്ടെ’ എന്നും നിലനിർത്തി. അടിക്കുറിപ്പ് a ഇപ്പോൾ യഥാർത്ഥത്തിൽ പ്രസക്തമായ γάρ-ന്റെ വ്യാഖ്യാനപരമായ ബദലിനോട് ബന്ധിപ്പിച്ചിരിക്കുന്നു.
