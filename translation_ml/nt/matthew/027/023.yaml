id: MAT.27.23
reference: Matthew 27:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ ἔφη· Τί γὰρ κακὸν ἐποίησεν; οἱ δὲ περισσῶς ἔκραζον λέγοντες· Σταυρωθήτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/023.yaml
  text: But he said[a], “What evil has he done?” But they cried out all the more, saying[b], “Let him be crucified.”
translation:
  language: ml
  text: 'എന്നാൽ അവൻ പറഞ്ഞു: “അവൻ എന്തു തിന്മയാണ് ചെയ്തത്?”[a] എന്നാൽ അവർ കൂടുതൽ ശക്തമായി ആർത്തുവിളിച്ചുകൊണ്ടിരുന്നു: “അവൻ ക്രൂശിക്കപ്പെടട്ടെ!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്തെന്നാൽ, അവൻ എന്തു തിന്മയാണ് ചെയ്തത്?” ഇവിടെ ഗ്രീക്കിലെ γάρ ചോദ്യം ഉന്നയിക്കുന്ന വെല്ലുവിളിയുടെ ഭാവം നൽകുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'കൂടുതൽ സാധാരണമായ സക്രിയപ്രയോഗം: “അവനെ ക്രൂശിക്കുക!” ഗ്രീക്കിൽ നിഷ്ക്രിയ ആജ്ഞാരൂപമാണ്: “അവൻ ക്രൂശിക്കപ്പെടട്ടെ!”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφη
  choice: ചോദിച്ചു
  rationale: φημί എന്ന ക്രിയയുടെ ആഖ്യാനപരമായ അർഥം സാധാരണയായി ‘പറഞ്ഞു’ എന്നാണെങ്കിലും, ഇവിടെ നേരിട്ട് ഒരു ചോദ്യം വരുന്നതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ‘ചോദിച്ചു’ എന്നു നൽകുന്നത് സംസാരപ്രവൃത്തിയെ കൃത്യമായി വ്യക്തമാക്കുന്നു.
- source_word: Τί γὰρ κακὸν ἐποίησεν;
  choice: അവൻ എന്തു തിന്മയാണ് ചെയ്തത്?
  rationale: τί ... κακόν എന്ന ഘടന ‘എന്തു തിന്മ’ എന്നു നേരിട്ട് നൽകുന്നു. γάρ ഇവിടെ മുൻവാക്കിനോടുള്ള വെല്ലുവിളിപരമായ പ്രതികരണം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ പ്രത്യേക ബന്ധകപദം ചേർക്കാതെ ചോദ്യം തന്നിലൂടെ ആ ഭാവം സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: κακὸν
  choice: തിന്മ
  rationale: ധാർമ്മിക ഗൗരവമുള്ള ‘തിന്മ’ എന്ന പദം κακόν എന്നതിന്റെ ശക്തി നിലനിർത്തുന്നു; ‘തെറ്റ്’ എന്നത് താരതമ്യേന മൃദുവായിരിക്കും.
- source_word: περισσῶς
  choice: കൂടുതൽ ഉച്ചത്തിൽ
  rationale: ജനക്കൂട്ടത്തിന്റെ പ്രതികരണത്തിലെ വർധനവ് വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം. സന്ദർഭത്തിൽ നിലവിളിയുടെ തീവ്രതയും ശബ്ദവും വർധിച്ചതായി ഇത് പ്രകടമാക്കുന്നു.
- source_word: ἔκραζον
  choice: നിലവിളിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലരൂപത്തിന്റെ തുടരുന്ന സ്വഭാവം ‘-കൊണ്ടിരുന്നു’ എന്ന രൂപം സംരക്ഷിക്കുന്നു; κράζωയുടെ ശക്തമായ വിളിയെ ‘നിലവിളിച്ചു’ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: λέγοντες
  choice: പ്രത്യേകമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: 'മലയാളത്തിൽ ‘നിലവിളിച്ചുകൊണ്ടിരുന്നു: ...’ എന്ന നേരിട്ടുള്ള ഉദ്ധരണിഘടന λέγοντες എന്ന സമകാലിക പങ്കാളിക്രിയയുടെ പ്രവർത്തനം സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു; ‘പറഞ്ഞുകൊണ്ട്’ ചേർത്താൽ അനാവശ്യ ആവർത്തനം ഉണ്ടാകും.'
- source_word: Σταυρωθήτω
  choice: അവൻ ക്രൂശിക്കപ്പെടട്ടെ
  rationale: മൂന്നാംപുരുഷ ഏകവചന നിഷ്ക്രിയ ആജ്ഞാരൂപം മലയാളത്തിലെ ‘-പ്പെടട്ടെ’ എന്ന നിഷ്ക്രിയ ആജ്ഞാരൂപത്തിലൂടെ സുതാര്യമായി സംരക്ഷിക്കുന്നു.
- source_word: ὁ δὲ ... οἱ δὲ
  choice: എന്നാൽ അവൻ ... പക്ഷേ അവർ
  rationale: രണ്ടു δέകളും സൂചിപ്പിക്കുന്ന തുടർച്ചയും വൈരുധ്യവും സ്വാഭാവിക മലയാളത്തിലെ ‘എന്നാൽ’ എന്നും ‘പക്ഷേ’ എന്നും പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ക്രൂശീകരണത്തിനായുള്ള ജനക്കൂട്ടത്തിന്റെ ആവശ്യം നിഷ്ക്രിയമായോ സക്രിയമായോ നൽകുക
  choice: അവൻ ക്രൂശിക്കപ്പെടട്ടെ
  alternative: അവനെ ക്രൂശിക്കുക
  rationale: σταυρωθήτω നിഷ്ക്രിയ ആജ്ഞാരൂപമാണ്. ‘ക്രൂശിക്കപ്പെടട്ടെ’ എന്നത് അതിന്റെ നിഷ്ക്രിയ രൂപവും ആജ്ഞാബലവും നിലനിർത്തുന്നു; പ്രവർത്തകനെ പാഠം വ്യക്തമാക്കാത്തിടത്ത് പരിഭാഷയും വ്യക്തമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവും വായിച്ചുകേൾപ്പിക്കാൻ അനുയോജ്യവുമായ ശൈലി. ‘തിന്മ’, ‘നിലവിളിച്ചുകൊണ്ടിരുന്നു’, ‘ക്രൂശിക്കപ്പെടട്ടെ’ എന്നീ പദങ്ങൾ മൂലപാഠത്തിന്റെ ധാർമ്മിക ശക്തി, അപൂർണഭൂതകാലത്തിന്റെ തുടർച്ച, നിഷ്ക്രിയ ആജ്ഞാരൂപം എന്നിവ സംരക്ഷിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
