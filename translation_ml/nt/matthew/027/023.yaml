  verdict: revise
  source_fidelity: 'മുഖ്യമായ തിരുത്തൽ ആവശ്യമാണ്: ἔφη സാധാരണ ആഖ്യാനപരമായ ‘പറഞ്ഞു’ എന്നതാണ്; പിന്നാലെ ചോദ്യം വരുന്നു എന്നതുമാത്രം അതിനെ ‘ചോദിച്ചു’ എന്നു മാറ്റാൻ മതിയായ കാരണമല്ല. περισσῶς ‘കൂടുതൽ ഉച്ചത്തിൽ’ എന്ന് കൊടുക്കുന്നത് ശബ്ദനിലയെ അനാവശ്യമായി വ്യക്തമാക്കുന്നു; ‘കൂടുതൽ ശക്തമായി’ പ്രതികരണത്തിന്റെ തീവ്രത സംരക്ഷിക്കുന്നു. ἔκραζον-ന്റെ അപൂർണഭൂതകാലവും σταυρωθήτω-യുടെ നിഷ്ക്രിയ ആജ്ഞാരൂപവും പരിഷ്കൃത പാഠത്തിൽ നിലനിർത്തിയിട്ടുണ്ട്.'
  naturalness: ‘എന്നാൽ അവൻ പറഞ്ഞു’യും ‘കൂടുതൽ ശക്തമായി ആർത്തുവിളിച്ചുകൊണ്ടിരുന്നു’യും ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും വായിച്ചുകേൾപ്പിക്കാൻ അനുയോജ്യവുമാണ്. നേരിട്ടുള്ള ഉദ്ധരണിക്കു മുമ്പുള്ള കോളൻ λέγοντες-ന്റെ പ്രവർത്തനം സ്വാഭാവികമായി ഉൾക്കൊള്ളിക്കുന്നു.
  terminology: ‘തിന്മ’ κακόν-ന്റെ ധാർമ്മികഭാരം നിലനിർത്തുന്നു. ‘ക്രൂശിക്കപ്പെടട്ടെ’ σταυρωθήτω-യുടെ മൂന്നാംപുരുഷ നിഷ്ക്രിയ ആജ്ഞാരൂപം സംരക്ഷിക്കുന്നു; പ്രവർത്തകനെ ചേർക്കുന്നില്ല.
  issues:
  - severity: medium
    issue: ἔφη-യെ ‘ചോദിച്ചു’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    rationale: φημί ഇവിടെ ലളിതമായ സംഭാഷണ-ആമുഖമാണ്, ‘അവൻ പറഞ്ഞു’ എന്നാണ് രൂപസമീപവും സന്ദർഭാനുസൃതവുമായ പരിഭാഷ. ചോദ്യം ഉച്ചരിക്കുന്നതുകൊണ്ട് മാത്രം ക്രിയയുടെ അർഥം ‘ചോദിച്ചു’ ആകുന്നില്ല.
