id: MAT.27.64
reference: Matthew 27:64
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: κέλευσον οὖν ἀσφαλισθῆναι τὸν τάφον ἕως τῆς τρίτης ἡμέρας, μήποτε ἐλθόντες οἱ μαθηταὶ ⸀αὐτοῦ κλέψωσιν αὐτὸν καὶ εἴπωσιν τῷ λαῷ· Ἠγέρθη ἀπὸ τῶν νεκρῶν, καὶ ἔσται ἡ ἐσχάτη πλάνη χείρων τῆς πρώτης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/064.yaml
  text: Therefore[a], order the tomb to be secured until the third day, lest his disciples come and steal him and say to the people[b], ‘He has been raised from the dead,’ and the last deception will be worse than the first.
translation:
  language: ml
  text: അതുകൊണ്ട്, മൂന്നാം ദിവസം വരെ കല്ലറ സുരക്ഷിതമാക്കാൻ കൽപ്പിക്കണമേ; അവന്റെ ശിഷ്യന്മാർ വന്ന് അവനെ കവർന്നെടുത്ത് ജനത്തോടു, ‘അവൻ മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിക്കപ്പെട്ടു’[b] എന്നു പറയാതിരിക്കാൻ. അപ്പോൾ അവസാനത്തെ വഞ്ചന ആദ്യത്തേതിനെക്കാൾ മോശമായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: അഥവാ, ‘അവൻ മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നു.’ ഗ്രീക്കിൽ ക്രിയ കർമണിരൂപത്തിലാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: κέλευσον
  choice: കല്പിക്കണമേ
  rationale: പീലാത്തൊസിന്റെ ഔദ്യോഗിക അധികാരത്തെ അഭ്യർഥിക്കുന്ന ഏകവചന ആജ്ഞാരൂപത്തിന്റെ ബലം നിലനിർത്തുന്നു; സന്ദർഭത്തിന് യോജിച്ച ആദരസൂചകമായ മലയാളപ്രയോഗമാണ്.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ കാരണത്തിൽനിന്നുള്ള നിഗമനബന്ധം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἀσφαλισθῆναι
  choice: ഭദ്രമാക്കാൻ
  rationale: കാവൽ ഏർപ്പെടുത്തൽ എന്നൊരു മാർഗത്തിൽ മാത്രം അർഥം ചുരുക്കാതെ, കല്ലറ സുരക്ഷിതമാക്കുക എന്ന വിശാലമായ ആശയം നൽകുന്നു.
- source_word: τὸν τάφον
  choice: കല്ലറ
  rationale: യേശുവിനെ അടക്കിയ പാറയിൽ വെട്ടിയ ശവകുടീരത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്ന സാധാരണ മലയാളപദം.
- source_word: ἕως τῆς τρίτης ἡμέρας
  choice: മൂന്നാം ദിവസംവരെ
  rationale: ഗ്രീക്കിലെ സമയപരിധിയും ഉയിർത്തെഴുന്നേൽപ്പിനെക്കുറിച്ചുള്ള മുൻപ്രസ്താവനയുമായുള്ള പദബന്ധവും നിലനിർത്തുന്നു.
- source_word: μήποτε
  choice: അല്ലെങ്കിൽ
  rationale: ഒഴിവാക്കാൻ ഉദ്ദേശിക്കുന്ന, ഭയപ്പെടുന്ന സാധ്യതയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἐλθόντες
  choice: വന്ന്
  rationale: പ്രധാനക്രിയകൾക്ക് മുമ്പുള്ള പങ്കാളിക്രിയയെ മലയാളത്തിലെ സ്വാഭാവിക ക്രിയാനുബന്ധരൂപത്തിൽ നൽകുന്നു; മൂലപാഠത്തിലില്ലാത്ത ‘രാത്രിയിൽ’ ചേർത്തിട്ടില്ല.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: അവന്റെ ശിഷ്യന്മാർ
  rationale: ഉടമസ്ഥബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: κλέψωσιν αὐτόν
  choice: അവനെ മോഷ്ടിക്കുകയും
  rationale: ഗ്രീക്ക് പാഠത്തിലെ വ്യക്തിപ്രത്യയം നിലനിർത്തുന്നു; അതിനെ വ്യാഖ്യാനപരമായി ‘ശരീരം’ എന്നു മാറ്റുന്നില്ല.
- source_word: εἴπωσιν τῷ λαῷ
  choice: ജനത്തോട് … എന്നു പറയുകയും
  rationale: λαός എന്നത് അന്നേരത്തെ ഒരു ജനക്കൂട്ടത്തെക്കാൾ പൊതുവായി ജനത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ജനത്തോട്’ എന്നു നൽകി.
- source_word: Ἠγέρθη
  choice: ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: ഗ്രീക്കിലെ കർമണിപ്രയോഗം സംരക്ഷിക്കുകയും, ഉയിർപ്പിച്ച കർത്താവിനെ പാഠം വ്യക്തമാക്കാത്തതിനാൽ കൂട്ടിച്ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀπὸ τῶν νεκρῶν
  choice: മരിച്ചവരിൽനിന്ന്
  rationale: ഉയിർത്തെഴുന്നേൽപ്പുസന്ദർഭത്തിലെ ഗ്രീക്ക് ബഹുവചനപ്രയോഗത്തെ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἡ ἐσχάτη πλάνη χείρων τῆς πρώτης
  choice: അവസാനത്തെ വഞ്ചന ആദ്യത്തേതിനെക്കാൾ മോശമായിരിക്കും
  rationale: താരതമ്യഘടനയും എതിരാളികൾ ഉന്നയിക്കുന്ന ‘വഞ്ചന’ എന്ന വിലയിരുത്തലും അതേപടി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഉയിർത്തെഴുന്നേൽപ്പിനെക്കുറിച്ചുള്ള ഉദ്ധരിച്ച അവകാശവാദത്തിന്റെ രൂപം
  choice: അവൻ മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നു
  alternative: അവൻ മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിക്കപ്പെട്ടു
  rationale: Ἠγέρθη കർമണിരൂപമാണ്. കർമണി നിലനിർത്തുന്നത് ഉയിർപ്പിച്ച കർത്താവിനെ മൂലപാഠത്തിനപ്പുറം പേരെടുത്തുപറയാതെ തന്നെ പുതിയനിയമത്തിലെ ഉയിർത്തെഴുന്നേൽപ്പുഭാഷയുടെ ദൈവശാസ്ത്രപരമായ ഭാരം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി സ്വീകരിച്ചു. പീലാത്തൊസിനോടുള്ള അഭ്യർഥനയിൽ ‘കല്പിക്കണമേ’ എന്ന ആദരസൂചക രൂപം ഉപയോഗിച്ചു. ദീർഘമായ ഗ്രീക്ക് വാക്യം മലയാളത്തിലെ വ്യക്തതയ്ക്കായി രണ്ട് വാക്യങ്ങളാക്കി; എന്നാൽ കാരണം, ഭയപ്പെടുന്ന സാധ്യത, ഫലം എന്നീ ആശയബന്ധങ്ങൾ സംരക്ഷിച്ചു.
