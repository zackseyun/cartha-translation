revisions:
- from: അതുകൊണ്ട്, മൂന്നാം ദിവസംവരെ കല്ലറ ഭദ്രമാക്കാൻ കല്പിക്കണമേ; അല്ലെങ്കിൽ അവന്റെ ശിഷ്യന്മാർ വന്ന്[a] അവനെ മോഷ്ടിക്കുകയും ജനത്തോട്, ‘അവൻ മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നു’[b] എന്നു പറയുകയും ചെയ്യും. അപ്പോൾ അവസാനത്തെ വഞ്ചന ആദ്യത്തേതിനെക്കാൾ മോശമായിരിക്കും.
  to: അതുകൊണ്ട്, മൂന്നാം ദിവസം വരെ കല്ലറ സുരക്ഷിതമാക്കാൻ കൽപ്പിക്കണമേ; അവന്റെ ശിഷ്യന്മാർ വന്ന് അവനെ കവർന്നെടുത്ത് ജനത്തോടു, ‘അവൻ മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിക്കപ്പെട്ടു’[b] എന്നു പറയാതിരിക്കാൻ. അപ്പോൾ അവസാനത്തെ വഞ്ചന ആദ്യത്തേതിനെക്കാൾ മോശമായിരിക്കും.
  rationale: The revision makes the feared/preventative force of μήποτε explicit in idiomatic Malayalam, uses a more natural verb for stealing a person’s remains without adding ‘body,’ and renders the aorist passive as ‘ഉയിർപ്പിക്കപ്പെട്ടു.’ Footnote a is corrected so that it accurately reports the added ‘by night’ variant without reversing its meaning. Footnote marker a is removed from the main text because the variant concerns an omitted phrase rather than a word that remains in the adopted reading; marker b remains attached to the resurrection clause.
  reviewer_model: gpt-5.6-terra
