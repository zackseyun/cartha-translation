id: MAT.15.33
reference: Matthew 15:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ λέγουσιν αὐτῷ οἱ ⸀μαθηταί· Πόθεν ἡμῖν ἐν ἐρημίᾳ ἄρτοι τοσοῦτοι ὥστε χορτάσαι ὄχλον τοσοῦτον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/033.yaml
  text: And the disciples said to him[c][b][a], “Where could we get enough bread in this desolate place to satisfy so large a crowd?”
translation:
  language: ml
  text: 'ശിഷ്യന്മാർ അവനോടു പറഞ്ഞു: “ഈ വിജനപ്രദേശത്ത് ഇത്ര വലിയ ജനക്കൂട്ടത്തെ വയറുനിറയെ ഭക്ഷിപ്പിക്കാൻ വേണ്ടത്ര അപ്പം നമുക്ക് എവിടെനിന്നു കിട്ടും?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγουσιν
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനകാലം മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനശൈലിയിൽ ഭൂതകാലമായി നൽകി.
- source_word: μαθηταί
  choice: ശിഷ്യന്മാർ
  rationale: സന്ദർഭത്തിൽ നേരത്തേ അറിയപ്പെടുന്ന നിർദിഷ്ട സംഘത്തെ സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത ‘അവന്റെ’ എന്നത് ചേർത്തില്ല.
- source_word: Πόθεν ἡμῖν
  choice: നമുക്ക് എവിടെനിന്നു കിട്ടും
  rationale: സ്രോതസ്സിനെക്കുറിച്ചുള്ള ചോദ്യവും ἡμῖν എന്ന ദത്തിവിന്റെ ആശയവും സ്വാഭാവിക മലയാളത്തിൽ ഒരുമിച്ചു പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐν ἐρημίᾳ
  choice: ഈ വിജനപ്രദേശത്ത്
  rationale: ജനവാസമില്ലാത്തതോ ഒറ്റപ്പെട്ടതോ ആയ പ്രദേശം എന്ന അർഥം നിലനിർത്തുന്നു; ‘മരുഭൂമി’ എന്ന് അനാവശ്യമായി പ്രത്യേകീകരിക്കുന്നില്ല.
- source_word: ἄρτοι τοσοῦτοι
  choice: വേണ്ടത്ര അപ്പം
  rationale: ἄρτοι അക്ഷരാർഥത്തിൽ ബഹുവചനമായ ‘അപ്പങ്ങൾ’ ആണെങ്കിലും ഇവിടെ ഭക്ഷണമായ അപ്പത്തിന്റെ ആവശ്യമായ അളവാണ് ഉദ്ദേശ്യം; മലയാളത്തിൽ ഏകവചന കൂട്ടനാമപ്രയോഗം സ്വാഭാവികമാണ്.
- source_word: ὥστε χορτάσαι
  choice: വയറുനിറയെ ഭക്ഷിപ്പിക്കാൻ
  rationale: χορτάζω വെറും ഭക്ഷണം നൽകുക എന്നതിലുപരി തൃപ്തിയാകുവോളം ഭക്ഷിപ്പിക്കുക എന്ന ആശയം വഹിക്കുന്നു; മലയാളത്തിൽ അത് വ്യക്തവും സ്വാഭാവികവുമായി നൽകി.
- source_word: ὄχλον τοσοῦτον
  choice: ഇത്ര വലിയ ജനക്കൂട്ടത്തെ
  rationale: τοσοῦτον നൽകുന്ന അളവിലെ ഊന്നൽ ‘ഇത്ര വലിയ’ എന്ന പ്രയോഗത്തിൽ സംരക്ഷിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ ചോദ്യഭാവവും അസാധ്യതയെ സൂചിപ്പിക്കുന്ന ആശങ്കയും നിലനിർത്തി; വ്യാഖ്യാനപരമായ മതസിദ്ധാന്ത ഘടകങ്ങൾ ചേർത്തിട്ടില്ല.
