revisions:
- from: അതുകൊണ്ട്, സംസാരശേഷിയില്ലാത്തവർ സംസാരിക്കുന്നതും[a], അംഗവൈകല്യമുള്ളവർ സൗഖ്യമുള്ളവരായിരിക്കുന്നതും[b], മുടന്തർ നടക്കുന്നതും അന്ധർ കാണുന്നതും കണ്ട് ജനക്കൂട്ടം ആശ്ചര്യപ്പെട്ടു; അവർ ഇസ്രായേലിന്റെ ദൈവത്തെ മഹത്ത്വപ്പെടുത്തി.
  to: അതുകൊണ്ട് ജനക്കൂട്ടം, സംസാരശേഷിയില്ലാത്തവർ സംസാരിക്കുന്നതും[a], അംഗവൈകല്യമുള്ളവർ സുഖമായിരിക്കുന്നതും[b], മുടന്തർ നടക്കുന്നതും അന്ധർ കാണുന്നതും കണ്ട് ആശ്ചര്യപ്പെട്ടു; അവർ ഇസ്രായേലിന്റെ ദൈവത്തെ മഹത്ത്വപ്പെടുത്തി.
