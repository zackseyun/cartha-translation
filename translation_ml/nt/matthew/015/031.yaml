id: MAT.15.31
reference: Matthew 15:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὥστε ⸂τὸν ὄχλον⸃ θαυμάσαι βλέποντας κωφοὺς λαλοῦντας ⸂κυλλοὺς ὑγιεῖς⸃ ⸀καὶ χωλοὺς περιπατοῦντας καὶ τυφλοὺς βλέποντας· καὶ ἐδόξασαν τὸν θεὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/031.yaml
  text: so that the crowd marveled as they saw the mute speaking, the crippled made well, the lame walking, and the blind seeing; and they glorified the God of Israel.
translation:
  language: ml
  text: അതുകൊണ്ട് ജനക്കൂട്ടം, സംസാരശേഷിയില്ലാത്തവർ സംസാരിക്കുന്നതും[a], അംഗവൈകല്യമുള്ളവർ സുഖമായിരിക്കുന്നതും[b], മുടന്തർ നടക്കുന്നതും അന്ധർ കാണുന്നതും കണ്ട് ആശ്ചര്യപ്പെട്ടു; അവർ ഇസ്രായേലിന്റെ ദൈവത്തെ മഹത്ത്വപ്പെടുത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ബധിരർ സംസാരിക്കുന്നതും.” ഗ്രീക്കുപദത്തിന് ‘ബധിരർ’ എന്നും ‘സംസാരശേഷിയില്ലാത്തവർ’ എന്നും അർഥമാകാം; ഇവിടെ ‘സംസാരിക്കുന്നതും’ എന്ന തുടർപദം കാരണം രണ്ടാമത്തെ അർഥമാണ് മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അംഗഭംഗം വന്നവർ പൂർണരായിരിക്കുന്നതും.” ഗ്രീക്കുപദം കൈകാലുകൾക്ക് വൈകല്യമോ അംഗഭംഗമോ ഉണ്ടായിരുന്നവരെ സൂചിപ്പിക്കുന്നു; അവർ സുഖമായ നിലയിലായിരുന്നതാണ് അടുത്ത പദം വ്യക്തമാക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യത്തിൽ വിവരിച്ച സൗഖ്യപ്പെടുത്തലുകളുടെ ഫലമാണ് ഇവിടെ അവതരിപ്പിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികമായി ആ ഫലബന്ധം അറിയിക്കുന്നു.
- source_word: τὸν ὄχλον
  choice: ജനക്കൂട്ടം
  rationale: കഥാസന്ദർഭത്തിലെ കൂട്ടത്തെ സൂചിപ്പിക്കുന്ന വ്യക്തവും ആധുനികവുമായ പ്രയോഗം.
- source_word: θαυμάσαι
  choice: ആശ്ചര്യപ്പെട്ടു
  rationale: അത്ഭുതകരമായ കാഴ്ചകളോടുള്ള വിസ്മയപ്രതികരണം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: βλέποντας
  choice: കണ്ട്
  rationale: ജനക്കൂട്ടത്തിന്റെ ആശ്ചര്യത്തിന് കാരണമായ നേരിട്ടുള്ള ദർശനം വ്യക്തമാക്കുന്നു.
- source_word: κωφοὺς
  choice: സംസാരശേഷിയില്ലാത്തവർ
  rationale: κωφός എന്നതിന് ബധിരർ എന്നും ഊമർ എന്നും അർഥമാകാം; പിന്നാലെയുള്ള ‘സംസാരിക്കുന്നതും’ എന്ന വാക്കിനോടുള്ള നേർവൈരുധ്യം കണക്കിലെടുത്ത് സംസാരശേഷിയില്ലാത്തവർ എന്നു തിരഞ്ഞെടുത്തു.
- source_word: λαλοῦντας
  choice: സംസാരിക്കുന്നതും
  rationale: λαλέω എന്നതിന്റെ നേരിട്ടുള്ളതും സന്ദർഭോചിതവുമായ പരിഭാഷ.
- source_word: κυλλοὺς
  choice: അംഗവൈകല്യമുള്ളവർ
  rationale: വികലമായതോ ഗുരുതരമായി ക്ഷതപ്പെട്ടതോ ആയ കൈകാലുകളുള്ളവരെ സൂചിപ്പിക്കുന്ന κυλλός എന്ന പദത്തിന്റെ അർഥം മാന്യവും വ്യക്തവുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: ὑγιεῖς
  choice: സൗഖ്യമുള്ളവരായിരിക്കുന്നതും
  rationale: ഗ്രീക്കിലെ വിശേഷണരൂപം നിലനിർത്തിക്കൊണ്ട് അവർ ഇപ്പോൾ സുഖസ്ഥിതിയിലാണെന്ന ഫലം വ്യക്തമാക്കുന്നു.
- source_word: χωλοὺς
  choice: മുടന്തർ
  rationale: നടക്കാൻ കഴിയാത്തവരെയോ പ്രയാസത്തോടെ നടക്കുന്നവരെയോ സൂചിപ്പിക്കുന്ന പതിവായ ബൈബിൾ-മലയാള പ്രയോഗം.
- source_word: περιπατοῦντας
  choice: നടക്കുന്നതും
  rationale: ഈ രോഗസൗഖ്യപ്പട്ടികയിൽ പദത്തിന്റെ അക്ഷരാർഥം തന്നെയാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: τυφλοὺς
  choice: അന്ധർ
  rationale: τυφλός എന്നതിന്റെ വ്യക്തവും മാന്യവുമായ സാധാരണ മലയാളപരിഭാഷ.
- source_word: βλέποντας
  choice: കാണുന്നതും
  rationale: അന്ധർക്ക് ലഭിച്ച ദർശനശേഷിയെ ഗ്രീക്കിലെ ലളിതമായ പങ്കാളിത്തരൂപത്തിനു സമമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἐδόξασαν
  choice: മഹത്ത്വപ്പെടുത്തി
  rationale: ദൈവത്തിന് മഹത്ത്വം അർപ്പിക്കുന്ന പ്രതികരണത്തെ δοξάζω എന്ന പദത്തിന്റെ ശക്തിയോടെ സംരക്ഷിക്കുന്നു.
- source_word: τὸν θεὸν Ἰσραήλ
  choice: ഇസ്രായേലിന്റെ ദൈവത്തെ
  rationale: ഗ്രീക്കിലെ ബന്ധപ്രയോഗം സ്വാഭാവികവും കൃത്യവുമായി നൽകുന്നു.
theological_decisions:
- issue: κωφοὺς λαλοῦντας എന്നതിലെ κωφός എന്ന പദത്തിന്റെ അർഥം
  choice: സംസാരശേഷിയില്ലാത്തവർ സംസാരിക്കുന്നതും
  alternative: ബധിരർ സംസാരിക്കുന്നതും
  rationale: κωφός എന്ന പദത്തിന് ബധിരൻ അല്ലെങ്കിൽ സംസാരശേഷിയില്ലാത്തവൻ എന്നിങ്ങനെ രണ്ടർഥം വരാം. ഇവിടെ ‘സംസാരിക്കുന്നവർ’ എന്ന തുടർപദം സംസാരശേഷി വീണ്ടെടുത്തതിലേക്കാണ് ഏറ്റവും നേരിട്ട് വിരൽചൂണ്ടുന്നത്; എങ്കിലും മറ്റർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: κυλλοὺς ὑγιεῖς എന്ന പ്രയോഗത്തിന്റെ അവതരണം
  choice: അംഗവൈകല്യമുള്ളവർ സൗഖ്യമുള്ളവരായിരിക്കുന്നതും
  alternative: അംഗഭംഗം വന്നവർ പൂർണരായിരിക്കുന്നതും
  rationale: κυλλός കൈകാലുകളുടെ വൈകല്യമോ അംഗഭംഗമോ സൂചിപ്പിക്കാം; ὑγιής അവരുടെ ആരോഗ്യകരമായ നിലയെ സൂചിപ്പിക്കുന്നു. മൂലപാഠത്തിൽ ഇല്ലാത്ത പ്രത്യേക പുനഃസ്ഥാപനരീതി നിർബന്ധിക്കാതെ വിശാലമായ അർഥം സംരക്ഷിച്ചു.
- issue: ദൈവത്തോടു ബന്ധപ്പെട്ട δοξάζω എന്ന ക്രിയ
  choice: മഹത്ത്വപ്പെടുത്തി
  alternative: സ്തുതിച്ചു
  rationale: അത്ഭുതപ്രവൃത്തികൾ കണ്ട് ദൈവത്തിന് മഹത്ത്വം അർപ്പിക്കുന്ന ശക്തമായ ദൈവശാസ്ത്രപരമായ ആശയം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. വ്യക്തികളെ അവഹേളിക്കാവുന്ന പഴയ പദങ്ങൾക്ക് പകരം ‘സംസാരശേഷിയില്ലാത്തവർ’, ‘അംഗവൈകല്യമുള്ളവർ’ എന്നീ വ്യക്തികേന്ദ്രിത പ്രയോഗങ്ങൾ ഉപയോഗിച്ചു; ‘മുടന്തർ’, ‘അന്ധർ’ എന്നിവ വാക്യത്തിന്റെ സമാന്തര ഘടനയും വായനാസൗകര്യവും കണക്കിലെടുത്ത് നിലനിർത്തി. ഗ്രീക്കിലെ ദൃശ്യങ്ങളുടെ പട്ടികയും അവസാനത്തെ ദൈവമഹത്ത്വപ്പെടുത്തലും വ്യക്തമായി സംരക്ഷിച്ചു.
