id: MAT.15.23
reference: Matthew 15:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ οὐκ ἀπεκρίθη αὐτῇ λόγον. καὶ προσελθόντες οἱ μαθηταὶ αὐτοῦ ⸀ἠρώτουν αὐτὸν λέγοντες· Ἀπόλυσον αὐτήν, ὅτι κράζει ὄπισθεν ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/023.yaml
  text: But he did not answer her a word[a]. And his disciples came and kept asking him, saying, “Send her away[b], because she is crying out behind us.”
translation:
  language: ml
  text: 'എന്നാൽ അവൻ അവളോട് ഒരു വാക്കുപോലും മറുപടി പറഞ്ഞില്ല. അവന്റെ ശിഷ്യന്മാർ അടുത്തുവന്ന് അവനോട് വീണ്ടുംവീണ്ടും അപേക്ഷിച്ചു: “അവളെ പറഞ്ഞയയ്ക്കണമേ[a]; അവൾ നമ്മുടെ പിന്നാലെ[b] നിലവിളിച്ചുകൊണ്ടിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അവളെ ഒഴിവാക്കി അയയ്ക്കണമേ.’ ശിഷ്യന്മാർ ഉദ്ദേശിച്ചത് അവളുടെ അപേക്ഷ സാധിച്ചുകൊടുത്ത് അയയ്ക്കണമെന്നാണോ, അതോ അവളെ തങ്ങളിൽനിന്ന് അകറ്റണമെന്നാണോ എന്നു അവരുടെ വാക്കുകൾ വ്യക്തമാക്കുന്നില്ല.
    reason: alternative_reading
  - marker: b
    text: അഥവാ ‘നമ്മുടെ പിന്നിൽ.’ ഗ്രീക്ക് പ്രയോഗം പിന്നിലുള്ള സ്ഥാനം അല്ലെങ്കിൽ പിന്നാലെയുള്ള പിന്തുടരൽ—ഇവയിൽ ഏതും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτῇ λόγον
  choice: അവളോട് ഒരു വാക്കുപോലും മറുപടി പറഞ്ഞില്ല
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിലെ പൂർണമായ മൗനത്തിനുള്ള ഊന്നൽ സ്വാഭാവികമായ മലയാളത്തിൽ ‘ഒരു വാക്കുപോലും’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: προσελθόντες
  choice: അടുത്തുവന്ന്
  rationale: ശിഷ്യന്മാർ യേശുവിന്റെ അടുത്തേക്ക് നീങ്ങിയതിനെ വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: ἠρώτουν
  choice: വീണ്ടുംവീണ്ടും അപേക്ഷിച്ചു
  rationale: അപൂർണഭൂതകാലരൂപം സൂചിപ്പിക്കുന്ന തുടർച്ചയോ ആവർത്തനമോ നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ അഭ്യർഥനാഭാവത്തിന് ‘അപേക്ഷിച്ചു’ യോജിക്കുന്നു, എന്നാൽ അതിരുകടന്ന യാചനാഭാവം വരുത്തുന്നില്ല.
- source_word: Ἀπόλυσον αὐτήν
  choice: അവളെ പറഞ്ഞയയ്ക്കണമേ
  rationale: അവളുടെ അപേക്ഷ നിറവേറ്റിയശേഷം അയയ്ക്കണമെന്നോ വെറുതെ അകറ്റണമെന്നോ ഗ്രീക്ക് വ്യക്തമാക്കാത്തതിനാൽ, ആ അവ്യക്തത നിലനിർത്തുന്ന നിഷ്പക്ഷമായ പ്രയോഗം തെരഞ്ഞെടുത്തു.
- source_word: κράζει
  choice: നിലവിളിച്ചുകൊണ്ടിരിക്കുന്നു
  rationale: ഉച്ചത്തിലുള്ള തുടർച്ചയായ വിളിയെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὄπισθεν ἡμῶν
  choice: നമ്മുടെ പിന്നാലെ
  rationale: സ്ഥാനം സൂചിപ്പിക്കുന്ന ‘പിന്നിൽ’ എന്നും പിന്തുടരൽ സൂചിപ്പിക്കുന്ന ‘പിന്നാലെ’ എന്നും അർഥമാകാം; ഈ സഞ്ചാരസന്ദർഭത്തിൽ ‘പിന്നാലെ’ സ്വാഭാവികമാണ്, മറ്റർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: Ἀπόλυσον αὐτήν എന്നതിൽ ശിഷ്യന്മാരുടെ ഉദ്ദേശ്യം
  choice: ‘അവളെ പറഞ്ഞയയ്ക്കണമേ’ എന്ന് നിഷ്പക്ഷമായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘അവളുടെ അപേക്ഷ സാധിച്ചുകൊടുത്ത് അയയ്ക്കണമേ’ അല്ലെങ്കിൽ ‘അവളെ ഇവിടെനിന്ന് അകറ്റണമേ.’
  rationale: ആജ്ഞാരൂപം അവളെ എങ്ങനെ പറഞ്ഞയയ്ക്കണമെന്ന് വ്യക്തമാക്കുന്നില്ല. അതിനാൽ ശിഷ്യന്മാരുടെ ഉദ്ദേശ്യം വ്യാഖ്യാനത്തിലൂടെ തീർപ്പാക്കാതെ കഥയിലെ അർഥപിരിമുറുക്കം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ മാന്യമായ മലയാളം. ‘മറുപടി പറഞ്ഞില്ല,’ ‘അടുത്തുവന്ന്,’ ‘പറഞ്ഞയയ്ക്കണമേ’ തുടങ്ങിയ സ്വാഭാവിക കഥനപ്രയോഗങ്ങൾ ഉപയോഗിച്ചു; ആവർത്തിത അഭ്യർഥനയും മൂലത്തിലെ യഥാർഥ അവ്യക്തതകളും നിലനിർത്തി.
