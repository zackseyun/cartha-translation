id: MAT.15.3
reference: Matthew 15:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Διὰ τί καὶ ὑμεῖς παραβαίνετε τὴν ἐντολὴν τοῦ θεοῦ διὰ τὴν παράδοσιν ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/003.yaml
  text: But he answered and said to them[a], “Why do you also transgress the commandment of God for the sake of your tradition?”
translation:
  language: ml
  text: 'അവൻ അവരോടു മറുപടിയായി പറഞ്ഞു: “നിങ്ങളുടെ പാരമ്പര്യം നിമിത്തം നിങ്ങളും ദൈവത്തിന്റെ കല്പന ലംഘിക്കുന്നത് എന്തുകൊണ്ട്?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: മറുപടിയായി പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ കൃദന്തരൂപവും മുഖ്യക്രിയയും ചേർന്ന പ്രയോഗത്തിന്റെ മറുപടി എന്ന ഘടകവും ‘പറഞ്ഞു’ എന്ന ഘടകവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Διὰ τί
  choice: എന്തുകൊണ്ട്
  rationale: കാരണത്തെ ചോദിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാള തുല്യം.
- source_word: καὶ ὑμεῖς
  choice: നിങ്ങളും
  rationale: മുമ്പ് ശിഷ്യന്മാർക്കെതിരെ ഉന്നയിച്ച ആരോപണത്തോടുള്ള പ്രത്യാരോപണത്തിന്റെ ബന്ധം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: παραβαίνετε
  choice: ലംഘിക്കുന്നത്
  rationale: ഒരു കല്പനയുടെ അതിർ കടക്കുക അഥവാ അതിനെ ലംഘിക്കുക എന്ന ക്രിയയുടെ അർഥം വ്യക്തവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: τὴν ἐντολὴν τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ കല്പന
  rationale: ἐντολήയുടെ ആജ്ഞാത്മകവും തിരുവെഴുത്തുസംബന്ധവുമായ ഭാവം ‘കല്പന’ നിലനിർത്തുന്നു; ദൈവിക അധികാരവും മനുഷ്യപാരമ്പര്യവും തമ്മിലുള്ള നേർവ്യത്യാസവും വ്യക്തമാണ്.
- source_word: διὰ τὴν παράδοσιν ὑμῶν
  choice: നിങ്ങളുടെ പാരമ്പര്യം നിമിത്തം
  rationale: διά + accusative ഇവിടെ കാരണം, പ്രേരക അടിസ്ഥാനം, അല്ലെങ്കിൽ അതിനുവേണ്ടിയുള്ള പ്രവർത്തനം എന്ന സൂക്ഷ്മത വഹിക്കാം. ‘നിമിത്തം’ ഈ പരിധി അമിതമായി ചുരുക്കാതെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ദൈവത്തിന്റെ കല്പനയും മനുഷ്യർ കൈമാറിയ പാരമ്പര്യവും തമ്മിലുള്ള വൈരുധ്യം
  choice: ‘ദൈവത്തിന്റെ കല്പന’ എന്നും ‘നിങ്ങളുടെ പാരമ്പര്യം’ എന്നും നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ദൈവത്തിന്റെ ആജ്ഞ’ / ‘നിങ്ങളുടെ ആചാരം’ അല്ലെങ്കിൽ ‘പാരമ്പര്യോപദേശം’
  rationale: മൂലപാഠം എല്ലാ പാരമ്പര്യങ്ങളെയും പൊതുവായി കുറ്റപ്പെടുത്തുന്നില്ല; സംബോധിതരുടെ പ്രത്യേക പാരമ്പര്യം ദൈവകല്പന ലംഘിക്കുന്നതിന് കാരണമാകുന്നതാണ് വിമർശനം. അതിനാൽ ഉടമസ്ഥസർവനാമമായ ‘നിങ്ങളുടെ’ നിലനിർത്തി.
- issue: διὰ τὴν παράδοσιν ὑμῶν എന്നതിലെ കാരണവും ലക്ഷ്യവും തമ്മിലുള്ള സൂക്ഷ്മത
  choice: ‘നിങ്ങളുടെ പാരമ്പര്യം നിമിത്തം’
  alternative: ‘നിങ്ങളുടെ പാരമ്പര്യം കാരണം’ അല്ലെങ്കിൽ ‘നിങ്ങളുടെ പാരമ്പര്യത്തിനുവേണ്ടി’
  rationale: ‘കാരണം’ ശുദ്ധകാരണത്തിലേക്കും ‘വേണ്ടി’ ലക്ഷ്യം/പ്രയോജനം എന്ന വായനയിലേക്കും വാചകത്തെ കൂടുതൽ ചായിച്ചേക്കാം. ‘നിമിത്തം’ മൂലത്തിലെ പ്രസക്തമായ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യം. ‘മറുപടിയായി പറഞ്ഞു’ എന്നത് മൂലത്തിലെ ഇരട്ട ക്രിയാഭാവം അസ്വാഭാവികമായ ആവർത്തനമില്ലാതെ സൂക്ഷിക്കുന്നു. ഈ മലയാള കരടിൽ അടിക്കുറിപ്പ് ആവശ്യമില്ല; ‘നിമിത്തം’ തന്നിൽ പ്രധാന അർഥസൂക്ഷ്മത ഉൾക്കൊള്ളുന്നു.
