id: MAT.15.13
reference: Matthew 15:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Πᾶσα φυτεία ἣν οὐκ ἐφύτευσεν ὁ πατήρ μου ὁ οὐράνιος ἐκριζωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/013.yaml
  text: But he answered and said[a], “Every plant that my heavenly Father did not plant will be uprooted.”
translation:
  language: ml
  text: 'അവൻ മറുപടിയായി പറഞ്ഞു: “എന്റെ സ്വർഗീയ പിതാവ് നട്ടിട്ടില്ലാത്ത ഓരോ ചെടിയും വേരോടെ പിഴുതെറിയപ്പെടും.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “എന്റെ സ്വർഗീയ പിതാവ് നട്ടിട്ടില്ലാത്ത ഓരോ നടീലും വേരോടെ പിഴുതെറിയപ്പെടും.”'
    reason: φυτεία എന്ന പദത്തിന് ‘ചെടി’ എന്നും ‘നടീൽ’ എന്നും അർഥമാകാവുന്നതിനാൽ മറ്റൊരു പദാർത്ഥസാധ്യത നൽകുന്നു.
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: മറുപടിയായി പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ രണ്ടു ക്രിയകളടങ്ങിയ സാധാരണ ആഖ്യാനപ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ അർഥനഷ്ടമില്ലാതെ നിലനിർത്തുന്നു.
- source_word: Πᾶσα
  choice: ഓരോ
  rationale: ഏകവചന നാമത്തോടൊപ്പമുള്ള വിതരണാർഥം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: φυτεία
  choice: ചെടി
  rationale: നട്ടത് എന്ന വിശാലാർഥമുള്ള ഈ നാമത്തിന്, പിന്നീട് വേരോടെ പിഴുതെറിയപ്പെടുന്ന കാർഷികരൂപകം സ്വാഭാവികമായി നിലനിർത്തുന്ന പദമാണിത്.
- source_word: ἐφύτευσεν
  choice: നട്ടിട്ടില്ലാത്ത
  rationale: φυτεία എന്ന നാമത്തോടുള്ള പദബന്ധവും കാർഷികരൂപകവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: ὁ πατήρ μου ὁ οὐράνιος
  choice: എന്റെ സ്വർഗീയപിതാവ്
  rationale: ‘എന്റെ’ എന്ന ബന്ധവും ‘സ്വർഗീയ’ എന്ന വിശേഷണവും സംക്ഷിപ്തവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐκριζωθήσεται
  choice: വേരോടെ പിഴുതെറിയപ്പെടും
  rationale: ഭാവികാല കർമണിപ്രയോഗവും വേരോടെ നീക്കപ്പെടുന്ന ശക്തമായ ന്യായവിധിരൂപകവും വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ‘ഓരോ ചെടിയും’ എന്ന രൂപകത്തിന്റെ സൂചിതവിഷയം
  choice: ഉപദേശങ്ങൾ, പാരമ്പര്യങ്ങൾ, അല്ലെങ്കിൽ ആളുകൾ എന്ന് വ്യക്തമാക്കാതെ രൂപകം അതേപടി നിലനിർത്തി.
  alternative: ഓരോ ഉപദേശവും / ഓരോ പാരമ്പര്യവും / പിതാവ് നട്ടിട്ടില്ലാത്ത ഓരോ വ്യക്തിയും
  rationale: ഗ്രീക്ക് പാഠം രൂപകത്തിന്റെ കൃത്യമായ സൂചിതവിഷയം തുറന്നുവെക്കുന്നു; അതിനാൽ വ്യാഖ്യാനപരമായ ഒരു തീരുമാനം പരിഭാഷയിൽ അടിച്ചേൽപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. കാർഷികരൂപകവും കർമണിപ്രയോഗവും ദൈവശാസ്ത്രപരമായ അനിശ്ചിതത്വവും സംരക്ഷിച്ചിരിക്കുന്നു.
