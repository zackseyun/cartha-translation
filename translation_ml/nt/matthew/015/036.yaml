id: MAT.15.36
reference: Matthew 15:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ἔλαβεν τοὺς ἑπτὰ ἄρτους καὶ τοὺς ἰχθύας ⸀καὶ εὐχαριστήσας ἔκλασεν καὶ ⸀ἐδίδου τοῖς ⸀μαθηταῖς οἱ δὲ μαθηταὶ ⸂τοῖς ὄχλοις⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/036.yaml
  text: He took the seven loaves and the fish[a], and after giving thanks he broke them and kept giving them to the disciples, and the disciples to the crowds.
translation:
  language: ml
  text: അവൻ ഏഴ് അപ്പങ്ങളും മീനും എടുത്തു; നന്ദി അർപ്പിച്ചശേഷം അപ്പങ്ങൾ മുറിച്ച് ശിഷ്യന്മാർക്കു കൊടുത്തുകൊണ്ടിരുന്നു; ശിഷ്യന്മാർ ജനക്കൂട്ടങ്ങൾക്കു കൊടുത്തുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλαβεν
  choice: എടുത്തു
  rationale: ഭക്ഷണം അനുഗ്രഹിച്ച് വിതരണം ചെയ്യുന്നതിനു മുമ്പ് യേശു കൈയിലെടുക്കുന്ന പ്രവൃത്തിയെ സന്ദർഭോചിതവും സ്വാഭാവികവുമായി വ്യക്തമാക്കുന്നു.
- source_word: τοὺς ἑπτὰ ἄρτους
  choice: ആ ഏഴ് അപ്പം
  rationale: ἄρτος ഇവിടെ എണ്ണാവുന്ന അപ്പങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സംഖ്യയ്ക്കുശേഷം ഏകവചനരൂപമായ ‘അപ്പം’ സ്വാഭാവികമാണ്.
- source_word: τοὺς ἰχθύας
  choice: മീൻ
  rationale: സന്ദർഭത്തിൽ ഒന്നിലധികം മീനുകളെ സൂചിപ്പിച്ചാലും, ‘മീൻ’ എന്ന രൂപം മലയാളത്തിൽ കൂട്ടമായ അർഥത്തിൽ സ്വാഭാവികമാണ്.
- source_word: εὐχαριστήσας
  choice: നന്ദി അർപ്പിച്ചശേഷം
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പ് നടന്ന പ്രവൃത്തിയെന്ന aorist participle-ന്റെ കാലബന്ധം വ്യക്തമാക്കുന്നു; ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത കർമം ചേർക്കുന്നില്ല.
- source_word: ἔκλασεν
  choice: അവ മുറിച്ച്
  rationale: അപ്പം വിതരണത്തിനായി ഭാഗങ്ങളാക്കുന്ന പ്രവൃത്തി സൂചിപ്പിക്കുന്നു; ‘അവ’ സന്ദർഭത്തിൽനിന്ന് മനസ്സിലാകുന്ന കർമം വ്യക്തമാക്കുന്നു.
- source_word: ἐδίδου
  choice: കൊടുത്തുകൊണ്ടിരുന്നു
  rationale: imperfect രൂപത്തിന്റെ തുടർച്ചയായതോ ആവർത്തിച്ചുള്ളതോ ആയ വിതരണഭാവം മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τοῖς μαθηταῖς
  choice: ശിഷ്യന്മാർക്കു
  rationale: ദാതിവ് സൂചിപ്പിക്കുന്ന സ്വീകരിക്കുന്നവരെ നേരിട്ട് വ്യക്തമാക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘തന്റെ’ ചേർക്കുന്നില്ല.
- source_word: οἱ δὲ μαθηταὶ τοῖς ὄχλοις
  choice: ശിഷ്യന്മാർ അവ ജനക്കൂട്ടങ്ങൾക്കും കൊടുത്തു
  rationale: ഗ്രീക്കിലെ ക്രിയാലോപം മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി പൂരിപ്പിക്കുന്നു; ὄχλοι എന്ന ബഹുവചനം ‘ജനക്കൂട്ടങ്ങൾ’ എന്നു നിലനിർത്തുന്നു.
theological_decisions:
- issue: εὐχαριστήσας എന്ന പദത്തിന്റെ സാധ്യതയുള്ള കർത്തൃഭോജനസംബന്ധിയായ അനുരണനം
  choice: ‘നന്ദി അർപ്പിച്ചശേഷം’ എന്ന സാധാരണ ആഖ്യാനപ്രയോഗം
  alternative: കർത്തൃഭോജനത്തിന്റെ അർഥം മുൻനിർത്തുന്ന കൂടുതൽ ആരാധനാക്രമപരമായ ഭാഷ
  rationale: ഇവിടെ ഭക്ഷണത്തിന്മേൽ നന്ദി അർപ്പിക്കുന്ന പ്രവൃത്തിയാണ് നേരിട്ട് പറയുന്നത്. സാധ്യതയുള്ള കർത്തൃഭോജന അനുരണനം നിഷേധിക്കാതെയും പാഠത്തിൽ ഇല്ലാത്ത കൂദാശാവ്യാഖ്യാനം ചേർക്കാതെയും വിവർത്തനം ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ തുടർച്ചാഭാവം ‘കൊടുത്തുകൊണ്ടിരുന്നു’ എന്നും ക്രിയാലോപം സ്വാഭാവികമായി പൂരിപ്പിച്ചും അവതരിപ്പിച്ചു. ഈ വാക്യത്തിന് പ്രസിദ്ധീകരണാവശ്യമായ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല; ഇംഗ്ലീഷ് പാളിയിലെ [a] അടയാളവും കുറിപ്പും തമ്മിൽ ഉള്ളടക്കപരമായ പൊരുത്തക്കേട് മൂലം അത് ആവർത്തിച്ചിട്ടില്ല.
