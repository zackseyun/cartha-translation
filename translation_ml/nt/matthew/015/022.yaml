  to: 'ഇതാ, ആ പ്രദേശങ്ങളിൽനിന്ന് പുറത്തുവന്ന ഒരു കനാന്യസ്ത്രീ ഇങ്ങനെ നിലവിളിച്ചുകൊണ്ടിരുന്നു: “കർത്താവേ, ദാവീദിന്റെ പുത്രാ, എന്നോടു കരുണ കാണിക്കണമേ! എന്റെ മകളെ ഒരു ഭൂതം കഠിനമായി പീഡിപ്പിക്കുന്നു.”[a]'
