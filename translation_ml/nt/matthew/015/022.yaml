id: MAT.15.22
reference: Matthew 15:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ γυνὴ Χαναναία ἀπὸ τῶν ὁρίων ἐκείνων ἐξελθοῦσα ⸀ἔκραζεν λέγουσα· Ἐλέησόν με, κύριε ⸀υἱὸς Δαυίδ· ἡ θυγάτηρ μου κακῶς δαιμονίζεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/022.yaml
  text: And behold[a], a Canaanite woman from those regions came out and was crying out, saying, “Have mercy on me, Lord, Son of David; my daughter is badly demon-possessed.”
translation:
  language: ml
  text: 'ഇതാ, ആ പ്രദേശങ്ങളിൽനിന്ന് പുറത്തുവന്ന ഒരു കനാന്യസ്ത്രീ ഇങ്ങനെ നിലവിളിച്ചുകൊണ്ടിരുന്നു: “കർത്താവേ, ദാവീദിന്റെ പുത്രാ, എന്നോടു കരുണ കാണിക്കണമേ! എന്റെ മകളെ ഒരു ഭൂതം കഠിനമായി പീഡിപ്പിക്കുന്നു.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “എന്റെ മകൾ കടുത്ത ഭൂതബാധയാൽ വലയുന്നു” / “എന്റെ മകൾ ഒരു ഭൂതത്തിന്റെ അധീനതയിലാണ്.”'
    reason: δαιμονίζεται എന്ന ക്രിയ ഭൂതത്തിന്റെ അധീനതയെയോ പീഡനത്തെയോ സൂചിപ്പിക്കാം; അതിന്റെ കൃത്യമായ അനുഭവസ്വഭാവം ഗ്രീക്ക് പദം കൂടുതൽ നിർവചിക്കുന്നില്ല.
lexical_decisions:
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: ആഖ്യാനത്തിൽ ശ്രദ്ധ ക്ഷണിക്കുകയും സംഭവത്തിന് സജീവത നൽകുകയും ചെയ്യുന്ന വ്യവഹാരസൂചകത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: Χαναναία
  choice: കനാന്യസ്ത്രീ
  rationale: മത്തായി ഉപയോഗിക്കുന്ന ചരിത്രപരമായ ജനവിഭാഗനാമം അതേപടി സംരക്ഷിക്കുന്നു; മർക്കോസിലെ സമാന്തരവിവരണത്തിലുള്ള ‘സുറോഫൊയ്നീക്യ’ ഇവിടെ കൊണ്ടുവരുന്നില്ല.
- source_word: ἀπὸ τῶν ὁρίων ἐκείνων
  choice: ആ പ്രദേശങ്ങളിൽനിന്ന്
  rationale: ὅρια എന്ന പദത്തിന്റെ പ്രദേശം/അതിർത്തിപ്രദേശം എന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുകയും ബഹുവചനഭാവം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐξελθοῦσα
  choice: പുറത്തുവന്ന
  rationale: അഓറിസ്റ്റ് കൃദന്തരൂപത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണകൃദന്തരൂപമായി നൽകുന്നു; അവൾ എവിടെനിന്നാണ് പുറത്തുവന്നത് എന്ന വാക്യഘടനയിലെ ചെറിയ തുറന്ന നിലയും നിലനിർത്തുന്നു.
- source_word: ἔκραζεν
  choice: നിലവിളിച്ചുകൊണ്ടിരുന്നു
  rationale: ഇംപെർഫെക്റ്റ് രൂപത്തിലെ തുടരുന്ന അഥവാ ആവർത്തിതമായ പ്രവൃത്തിയെ വ്യക്തമാക്കുന്നു.
- source_word: Ἐλέησόν με
  choice: എന്നോടു കരുണ തോന്നണമേ
  rationale: അടിയന്തരമായ അപേക്ഷയും കരുണയുടെ ബൈബിൾപരമായ പദസമ്പത്തും സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: κύριε
  choice: കർത്താവേ
  rationale: ‘ദാവീദിന്റെ പുത്രാ’ എന്ന മശീഹാപരമായ അഭിസംബോധനയോടൊപ്പം വരുന്ന κύριε-യുടെ ആദരപൂർവവും ഉയർന്നതുമായ ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: υἱὸς Δαυίδ
  choice: ദാവീദിന്റെ പുത്രാ
  rationale: ദാവീദീയ രാജത്വവും മശീഹാപരമായ പ്രാധാന്യവും വഹിക്കുന്ന പദവി അക്ഷരാർഥത്തോട് ചേർന്ന് നൽകുന്നു.
- source_word: κακῶς
  choice: കഠിനമായി
  rationale: മകളുടെ അവസ്ഥയുടെ തീവ്രത വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണ്.
- source_word: δαιμονίζεται
  choice: ഒരു ഭൂതം ... പീഡിപ്പിക്കുന്നു
  rationale: ഭൂതത്തിന്റെ അധീനതയെയോ ദുഷ്പ്രഭാവത്തെയോ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ക്രിയയെ, അതിന്റെ കൃത്യമായ അനുഭവസ്വഭാവം അനാവശ്യമായി നിർണയിക്കാതെ, വായനാസൗകര്യമുള്ള മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: മശീഹാപരമായ അഭിസംബോധനയിൽ κύριε എന്നതിന്റെ വിവർത്തനം
  choice: കർത്താവേ
  alternative: യജമാനനേ / അങ്ങേ
  rationale: ‘ദാവീദിന്റെ പുത്രാ’ എന്ന അഭിസംബോധനയോടു ചേർന്നതിനാൽ വെറും വിനയസൂചകമായ വിളിയേക്കാൾ ഉയർന്ന ആദരവും സാധ്യതയുള്ള മശീഹാപരമായ ഭാവവും ‘കർത്താവേ’ നിലനിർത്തുന്നു; അതേസമയം സ്ത്രീയുടെ ക്രിസ്തുശാസ്ത്രബോധത്തിന്റെ പൂർണതയെ വാചകം നിർണയിക്കുന്നില്ല.
- issue: δαιμονίζεται എന്നതിന്റെ അർഥവ്യാപ്തി
  choice: ഒരു ഭൂതം കഠിനമായി പീഡിപ്പിക്കുന്നു
  alternative: ഭൂതബാധയാൽ കഠിനമായി വലയുന്നു / ഒരു ഭൂതത്തിന്റെ അധീനതയിലാണ്
  rationale: വാചകം ഭൂതപരമായ പ്രവർത്തനം വ്യക്തമായി പ്രസ്താവിക്കുന്നുവെങ്കിലും ‘possession’ എന്ന സാങ്കേതിക ആശയം മാത്രം നിർബന്ധിക്കുന്നില്ല. പ്രധാനവാചകം പീഡനം എന്ന സ്വാഭാവിക മലയാളരൂപം സ്വീകരിക്കുകയും മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഇതാ’, ‘കർത്താവേ’, ‘ദാവീദിന്റെ പുത്രാ’ എന്നിവ മൂലപാഠത്തിന്റെ ശ്രദ്ധാകർഷകവും മശീഹാപരവുമായ ഭാവം നിലനിർത്തുന്നു. തുടരുന്ന നിലവിളി ഇംപെർഫെക്റ്റിന് അനുസരിച്ച് ‘നിലവിളിച്ചുകൊണ്ടിരുന്നു’ എന്നു നൽകി.
