id: MAT.15.34
reference: Matthew 15:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς ὁ Ἰησοῦς· Πόσους ἄρτους ἔχετε; οἱ δὲ εἶπαν· Ἑπτά, καὶ ὀλίγα ἰχθύδια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/034.yaml
  text: And Jesus said to them[a], “How many loaves do you have?” And they said, “Seven, and a few small fish.”
translation:
  language: ml
  text: 'യേശു അവരോടു ചോദിച്ചു: “നിങ്ങളുടെ പക്കൽ എത്ര അപ്പങ്ങളുണ്ട്?” അവർ പറഞ്ഞു: “ഏഴ് അപ്പങ്ങളും കുറച്ച് ചെറിയ മീനുകളും[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “മീനുകളും”; ഗ്രീക്കിൽ ‘മീൻ’ എന്ന പദത്തിന്റെ ലഘുരൂപമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; അത് ചെറിയ മീനുകളെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: ചോദിച്ചു
  rationale: ഗ്രീക്കിൽ ചരിത്രവർത്തമാനമായ ‘പറയുന്നു’ എന്നാണ്; എന്നാൽ ഇവിടെ ചോദ്യം അവതരിപ്പിക്കുന്നതിനാൽ ആഖ്യാനശൈലിയിൽ സ്വാഭാവികമായ ഭൂതകാലരൂപമായ ‘ചോദിച്ചു’ ആശയവും സംഭാഷണപ്രവർത്തനവും കൃത്യമായി നൽകുന്നു.
- source_word: Πόσους ἄρτους
  choice: എത്ര അപ്പങ്ങൾ
  rationale: ἄρτους എണ്ണാവുന്ന അപ്പങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘എത്ര അപ്പങ്ങൾ’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: ἔχετε
  choice: നിങ്ങളുടെ പക്കൽ ... ഉണ്ട്
  rationale: കൈവശമുള്ളതിനെക്കുറിച്ചുള്ള വർത്തമാനകാല ചോദ്യം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: οἱ δὲ εἶπαν
  choice: അവർ പറഞ്ഞു
  rationale: δέ ഇവിടെ ശക്തമായ വിരോധമല്ല, സംഭാഷണത്തിന്റെ തുടർച്ചയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ മലയാളത്തിൽ അധിക ബന്ധകമില്ലാത്ത രൂപം സ്വാഭാവികമാണ്.
- source_word: Ἑπτά
  choice: ഏഴ്
  rationale: സംഖ്യയുടെ നേരിട്ടുള്ള പരിഭാഷ.
- source_word: ὀλίγα
  choice: കുറച്ച്
  rationale: അനിശ്ചിതമായ ചെറിയ എണ്ണത്തെ സാധാരണ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἰχθύδια
  choice: ചെറിയ മീനുകൾ
  rationale: ദിമിന്യൂട്ടീവ് രൂപം മീനുകളുടെ ചെറിയ വലുപ്പത്തെ സൂചിപ്പിക്കാം; ആ സൂചന പ്രധാനപാഠത്തിൽ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ ചരിത്രവർത്തമാനം സ്വാഭാവികമായ മലയാള ഭൂതകാലത്തിലാക്കി; ἰχθύδιαയുടെ ദിമിന്യൂട്ടീവ് സൂചന പാഠത്തിലും അതിന്റെ സാധ്യതാപരമായ സ്വഭാവം അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
