  to: 'എന്നാൽ അവൾ വന്ന് അവന്റെ മുമ്പിൽ മുട്ടുകുത്തിക്കൊണ്ട്[a] പറഞ്ഞു: “കർത്താവേ, എന്നെ സഹായിക്കണമേ.”'
  rationale: 'The revision makes only two fidelity-focused adjustments: it renders ἐλθοῦσα directly as ‘വന്ന്’ and reflects the imperfect προσεκύνει with ‘മുട്ടുകുത്തിക്കൊണ്ട്.’ The ambiguity of προσκυνέω remains preserved in the footnote, and the meaning, register, direct address, and footnote anchor are retained.'
