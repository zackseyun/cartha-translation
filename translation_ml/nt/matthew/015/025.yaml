id: MAT.15.25
reference: Matthew 15:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἡ δὲ ἐλθοῦσα ⸀προσεκύνει αὐτῷ λέγουσα· Κύριε, βοήθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/025.yaml
  text: But she came and knelt before him[a], saying, “Lord, help me.”
translation:
  language: ml
  text: 'എന്നാൽ അവൾ വന്ന് അവന്റെ മുമ്പിൽ മുട്ടുകുത്തിക്കൊണ്ട്[a] പറഞ്ഞു: “കർത്താവേ, എന്നെ സഹായിക്കണമേ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അവനെ ആരാധിച്ചു.” സന്ദർഭമനുസരിച്ച്, ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് ക്രിയയ്ക്ക് ആദരപൂർവം കുനിയുക, പ്രണാമം അർപ്പിക്കുക, ആരാധിക്കുക എന്നീ അർത്ഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻ സംഭാഷണത്തിനു പിന്നാലെ സ്ത്രീ പിന്മാറാതെ വീണ്ടും അപേക്ഷിക്കുന്നതിലെ നേരിയ വൈരുധ്യം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἐλθοῦσα
  choice: അടുത്തുവന്ന്
  rationale: യേശുവിന്റെ അടുക്കലേക്കുള്ള ചലനം സൂചിപ്പിക്കുന്ന ഭൂതകാല ക്രിയാവിശേഷണത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: προσεκύνει αὐτῷ
  choice: അവന്റെ മുമ്പിൽ മുട്ടുകുത്തി[a]
  rationale: προσκυνέω സൂചിപ്പിക്കാവുന്ന ശാരീരികമായ വണക്കം വ്യക്തമായി നൽകുന്നു; അതിനെ ആരാധനയെന്നു മാത്രം നിർണയിക്കാതെ സാധുവായ മറ്റർത്ഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: λέγουσα
  choice: പറഞ്ഞു
  rationale: നേരിട്ടുള്ള വാക്കുകൾ പരിചയപ്പെടുത്തുന്ന ഗ്രീക്ക് വർത്തമാന ക്രിയാവിശേഷണത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ സമാപ്തക്രിയയായി നൽകുന്നു.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: യേശുവിനോടുള്ള ആദരവും ഭാരവുമുള്ള അഭിസംബോധന നിലനിർത്തുന്ന പതിവായ മലയാളരൂപം.
- source_word: βοήθει μοι
  choice: എന്നെ സഹായിക്കണമേ
  rationale: അപേക്ഷയുടെ അടിയന്തരതയും ചുരുക്കവും മാന്യമായ ആധുനിക മലയാളത്തിൽ നേരിട്ട് പകരുന്നു.
theological_decisions:
- issue: യേശുവിനോടുള്ള προσκυνέω എന്ന ക്രിയയുടെ വിവർത്തനം
  choice: അവന്റെ മുമ്പിൽ മുട്ടുകുത്തി
  alternative: അവനെ ആരാധിച്ചു
  rationale: ഈ ക്രിയയ്ക്ക് ആദരപൂർവം കുനിയുക, സാഷ്ടാംഗം വീഴുക, ആരാധിക്കുക എന്നീ അർത്ഥങ്ങൾ സന്ദർഭമനുസരിച്ച് വരാം. മുഖ്യപാഠം ദൃശ്യമായ ശരീരഭാവം നൽകുന്നു; യേശുവിനെ ആരാധിച്ചു എന്ന സാധുവായ ദൈവശാസ്ത്രപര സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. സ്ത്രീയുടെ ഉറച്ച അപേക്ഷയും വാക്യത്തിന്റെ ചുരുക്കവും നിലനിർത്തിയിരിക്കുന്നു; προσκυνέω എന്ന പദത്തിലെ യഥാർഥ അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചിരിക്കുന്നു.
