id: MAT.15.28
reference: Matthew 15:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τότε ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτῇ· Ὦ γύναι, μεγάλη σου ἡ πίστις· γενηθήτω σοι ὡς θέλεις. καὶ ἰάθη ἡ θυγάτηρ αὐτῆς ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/028.yaml
  text: Then Jesus answered her[a], “O woman, great is your faith[b]; let it be done for you as you desire.” And her daughter was healed from that hour.
translation:
  language: ml
  text: 'അപ്പോൾ യേശു മറുപടിയായി അവളോടു പറഞ്ഞു: “സ്ത്രീയേ, നിന്റെ വിശ്വാസം[a] വലുതാണ്; നീ ആഗ്രഹിക്കുന്നതുപോലെ നിനക്കു സംഭവിക്കട്ടെ.” ആ സമയംമുതൽ[b] അവളുടെ മകൾ സൗഖ്യം പ്രാപിച്ചു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വിശ്വാസപൂർവമായ ആശ്രയം.’ ഗ്രീക്ക് πίστις എന്ന പദത്തിന് ‘വിശ്വാസം,’ ‘ആശ്രയം,’ അല്ലെങ്കിൽ ‘വിശ്വസ്തത’ എന്ന അർഥനിറങ്ങൾ ഉണ്ടാകാം; ഇവിടെ ‘വിശ്വാസം’ എന്നാണ് പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ആ നിമിഷംമുതൽ.’ ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘ആ മണിക്കൂർ മുതൽ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: അപ്പോൾ
  rationale: മുൻപത്തെ സംഭാഷണത്തോടു യേശുവിന്റെ മറുപടിയെ ബന്ധിപ്പിക്കുന്ന സ്വാഭാവികമായ കാലസൂചകം.
- source_word: ἀποκριθεὶς ... εἶπεν αὐτῇ
  choice: യേശു അവളോടു പറഞ്ഞു
  rationale: ഗ്രീക്കിൽ മറുപടി പറയുന്നതിനെ സൂചിപ്പിക്കുന്ന പങ്കാളിക്രിയയും മുഖ്യക്രിയയും ചേർന്നുള്ള പ്രയോഗം മലയാളത്തിൽ അനാവശ്യ ആവർത്തനമില്ലാതെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; αὐτῇ എന്നത് ‘അവളോടു’ എന്നതിൽ നിലനിൽക്കുന്നു.
- source_word: Ὦ γύναι
  choice: സ്ത്രീയേ
  rationale: നേരിട്ടുള്ള സംബോധനവും അതിലെ ഊന്നലും നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് നിന്ദാസൂചകമല്ല.
- source_word: μεγάλη σου ἡ πίστις
  choice: നിന്റെ വിശ്വാസം വലുതാണ്
  rationale: πίστις എന്നതിന് സന്ദർഭോചിതമായ പതിവു പരിഭാഷയായ ‘വിശ്വാസം’ ഉപയോഗിക്കുകയും μεγάλη എന്ന ഊന്നൽ വ്യക്തമായി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: γενηθήτω σοι
  choice: നിനക്കു സംഭവിക്കട്ടെ
  rationale: γίνομαι എന്ന ക്രിയയുടെ ആജ്ഞാത്മകവും ഫലസിദ്ധി പ്രഖ്യാപിക്കുന്നതുമായ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὡς θέλεις
  choice: നീ ആഗ്രഹിക്കുന്നതുപോലെ
  rationale: θέλω എന്നതിലെ ഇച്ഛയുടെയും ആഗ്രഹത്തിന്റെയും അർഥം മാന്യവും സാധാരണ വായനക്കാർക്കു വ്യക്തവുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: ἰάθη
  choice: സൗഖ്യം പ്രാപിച്ചു
  rationale: രോഗമുക്തിയെ സൂചിപ്പിക്കുന്ന അകർമകവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗം; ഗ്രീക്കിലെ കർമണിഭാവത്തിന്റെ അർഥം നിലനിർത്തുന്നു.
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: ആ നാഴികമുതൽ
  rationale: ഗ്രീക്കിലെ ‘ആ മണിക്കൂർ മുതൽ’ എന്ന രൂപത്തോട് അടുത്തുനിൽക്കുന്ന, മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതമായ കാലപ്രയോഗം.
theological_decisions:
- issue: യേശു പ്രശംസിക്കുന്ന πίστις എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: വിശ്വാസം
  alternative: ആശ്രയം
  rationale: ഈ സന്ദർഭത്തിൽ സ്ത്രീ യേശുവിൽ വെച്ച വിശ്വാസപൂർവമായ ആശ്രയമാണ് മുഖ്യം. ‘വിശ്വാസം’ പദത്തിന്റെ പതിവായ ദൈവശാസ്ത്രപരമായ വ്യാപ്തി സംരക്ഷിക്കുന്നു; ‘ആശ്രയം’ സാധ്യമായ അർഥനിറമായി അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘സ്ത്രീയേ’ എന്ന നേരിട്ടുള്ള സംബോധനം ഗ്രീക്കിന്റെ രൂപം നിലനിർത്തുന്നു; അത് പരുഷമായി വായിക്കേണ്ടതല്ല. ‘നാഴിക’ മൂലത്തിലെ കാലപ്രയോഗത്തോട് അടുപ്പം പുലർത്തുന്നതിനാൽ മുഖ്യവാചകത്തിൽ ഉപയോഗിച്ചു; ഇന്നത്തെ സ്വാഭാവിക അർഥമായ ‘നിമിഷം’ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
