  rationale: “മറുപടിയായി” ചേർത്ത് ἀποκριθεὶς എന്ന പ്രതികരണസൂചന നിലനിർത്തി. “ആ നാഴികമുതൽ” എന്നതിനുപകരം ആധുനികവും അർഥവ്യക്തവുമായ “ആ സമയംമുതൽ” ഉപയോഗിച്ചു; മൂലത്തിലെ അക്ഷരാർഥമായ ‘മണിക്കൂർ’ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു. πίστις-ന്റെ ബദൽ അർഥം കൂടുതൽ കൃത്യമായി വ്യക്തമാക്കി.
