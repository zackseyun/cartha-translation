id: MAT.15.15
reference: Matthew 15:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ· Φράσον ἡμῖν τὴν παραβολὴν ⸀ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/015.yaml
  text: But Peter answered and said to him[a], “Explain this parable to us.”
translation:
  language: ml
  text: 'എന്നാൽ പത്രോസ് അവനോടു മറുപടിയായി പറഞ്ഞു: “ഈ ഉപമ ഞങ്ങൾക്ക് വിശദീകരിച്ചുതരണമേ[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഈ ഉപമ ഞങ്ങളോടു പറഞ്ഞുതരണമേ” അല്ലെങ്കിൽ “ഈ ഉപമ ഞങ്ങൾക്ക് വ്യക്തമാക്കിത്തരണമേ.”
    reason: φράζω എന്ന ക്രിയയ്ക്ക് ‘പറഞ്ഞുതരുക,’ ‘വ്യക്തമാക്കുക,’ ‘വിശദീകരിക്കുക’ എന്നീ അർഥനിറങ്ങൾ സാധ്യമാണ്.
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ ... εἶπεν
  choice: എന്നാൽ ... എന്നു പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ മറുപടി-സൂചകമായ പങ്കുപദവും മുഖ്യക്രിയയും ചേർന്ന പ്രയോഗം മലയാളത്തിൽ ‘മറുപടി പറഞ്ഞുകൊണ്ട് പറഞ്ഞു’ എന്ന് ആവർത്തിക്കാതെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; δέ സൂചിപ്പിക്കുന്ന നേരിയ വഴിത്തിരിവ് ‘എന്നാൽ’ നിലനിർത്തുന്നു.
- source_word: ὁ Πέτρος
  choice: പത്രോസ്
  rationale: മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ സുപരിചിതമായ വ്യക്തിനാമരൂപം ഉപയോഗിക്കുന്നു.
- source_word: αὐτῷ
  choice: അവനോട്
  rationale: സംസാരത്തിന്റെ പരോക്ഷ കർമത്തെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; സന്ദർഭത്തിൽ ഇത് യേശുവിനെ സൂചിപ്പിക്കുന്നു.
- source_word: Φράσον
  choice: വിശദീകരിച്ചുതരണമേ
  rationale: φράζω എന്ന ക്രിയയുടെ ‘വ്യക്തമാക്കുക, വിശദീകരിക്കുക’ എന്ന സന്ദർഭോചിത അർഥം പ്രകടമാക്കുന്നു; അഭ്യർഥനയുടെ ഭാവവും മാന്യമായ ആജ്ഞാരൂപവും നിലനിർത്തുന്നു.
- source_word: ἡμῖν
  choice: ഞങ്ങൾക്ക്
  rationale: വിശദീകരണം ലഭിക്കുന്നവരെ സൂചിപ്പിക്കുന്ന ദത്തിവ് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὴν παραβολὴν ταύτην
  choice: ഈ ഉപമ
  rationale: παραβολή എന്ന സുവിശേഷപരമായ പദത്തിന് ‘ഉപമ’ ഉപയോഗിക്കുകയും ταύτην സൂചിപ്പിക്കുന്ന സമീപസൂചന ‘ഈ’ എന്നതിലൂടെ നിലനിർത്തുകയും ചെയ്യുന്നു.
