translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ ആവർത്തനാത്മകമായ ‘മറുപടി പറഞ്ഞ് പറഞ്ഞു’ എന്ന ഘടന സ്വാഭാവിക മലയാളത്തിനായി ചുരുക്കിയിരിക്കുന്നു; അർഥം നഷ്ടപ്പെട്ടിട്ടില്ല. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ക്രിയയ്ക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
