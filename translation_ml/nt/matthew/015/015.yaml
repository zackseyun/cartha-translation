  terminology: ‘പത്രോസ്’ and ‘ഉപമ’ are suitable and familiar in modern Malayalam biblical register. ‘വിശദീകരിച്ചുതരണമേ’ is a sound contextual rendering of Φράσον. The footnote’s alternatives appropriately reflect the lexical range without asserting a doctrinal interpretation.
