reference: Matthew 15:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἡ δὲ εἶπεν· Ναί, κύριε, καὶ γὰρ τὰ κυνάρια ἐσθίει ἀπὸ τῶν ψιχίων τῶν πιπτόντων ἀπὸ τῆς τραπέζης τῶν κυρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/027.yaml
  text: She said[a], “Yes, Lord[b], for even the little dogs eat from the crumbs that fall from their masters’ table.”
translation:
  language: ml
  text: 'അവൾ പറഞ്ഞു: “അതേ, കർത്താവേ[b]; കാരണം കുഞ്ഞുനായ്ക്കൾപോലും[a] തങ്ങളുടെ യജമാനന്മാരുടെ മേശയിൽനിന്ന് വീഴുന്ന നുറുക്കുകൾ തിന്നുന്നുണ്ടല്ലോ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ചെറിയ നായ്ക്കൾ,” “വീട്ടുനായ്ക്കൾ.” ഗ്രീക്കിൽ ലഘുരൂപമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; അത് വീട്ടിൽ വളർത്തുന്ന ചെറുനായ്ക്കളെയോ കുഞ്ഞുനായ്ക്കളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “കർത്താവേ” എന്നത് ഇവിടെ ആദരപൂർവമായ “യജമാനനേ” എന്ന അർഥത്തിലും മനസ്സിലാക്കാം; എന്നാൽ κύριος എന്ന പദത്തിന് സുവിശേഷങ്ങളിൽ പതിവായി നൽകുന്ന പരിഭാഷയാണ് മുഖ്യപാഠത്തിൽ നിലനിർത്തിയിരിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: Ναί
  choice: അതേ
  rationale: സ്ത്രീ യേശുവിന്റെ വാക്കിനോടു യോജിച്ചുകൊണ്ട് മറുപടി പറയുന്നതിനെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: κύριε
  choice: കർത്താവേ
  rationale: യേശുവിനോടുള്ള ആദരപൂർവമായ സംബോധനയും അദ്ദേഹത്തിന്റെ അധികാരത്തെക്കുറിച്ചുള്ള കൂടുതൽ ആഴമുള്ള അംഗീകാരസാധ്യതയും ഒരുപോലെ നിലനിർത്തുന്നു.
- source_word: καὶ γὰρ
  choice: കാരണം ... പോലും
  rationale: 'γάρ എന്നതിന്റെ വിശദീകരണസ്വഭാവവും καί നൽകുന്ന ഉൾപ്പെടുത്തൽ/ഊന്നൽ അർഥവും ചേർത്ത് പ്രകടിപ്പിക്കുന്നു: സ്ത്രീ ഉപമ അംഗീകരിച്ചുകൊണ്ടുതന്നെ അതിൽനിന്ന് തന്റെ അപേക്ഷയ്ക്ക് അനുകൂലമായി വാദിക്കുന്നു.'
- source_word: κυνάρια
  choice: കുഞ്ഞുനായ്ക്കൾ
  rationale: ഗ്രീക്കിലെ ലഘുരൂപത്തിന്റെ സൂചന നിലനിർത്തുന്നു; വീട്ടിൽ വളർത്തുന്ന ചെറുനായ്ക്കളെയോ കുഞ്ഞുനായ്ക്കളെയോ സൂചിപ്പിക്കാമെങ്കിലും വെറും ‘നായ്ക്കൾ’ എന്നതിനെക്കാൾ ഈ രൂപം മൂലപദത്തോട് അടുത്തതാണ്.
- source_word: ἐσθίει
  choice: തിന്നുന്നുണ്ടല്ലോ
  rationale: നപുംസകലിംഗ ബഹുവചന കർത്താവിനോടൊപ്പം ഏകവചന ക്രിയ ഉപയോഗിക്കുന്ന ഗ്രീക്ക് വ്യാകരണരീതി മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചനപ്രയോഗമായി മാറ്റുന്നു; ‘-ല്ലോ’ സ്ത്രീയുടെ വിശദീകരണവാദത്തിന്റെ ഭാവം നൽകുന്നു.
- source_word: ψιχίων
  choice: നുറുക്കുകൾ
  rationale: മേശയിൽനിന്ന് വീഴുന്ന ചെറിയ ഭക്ഷണക്കഷണങ്ങൾ എന്ന ദൃശ്യത്തെ കൃത്യമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: τῶν πιπτόντων
  choice: വീഴുന്ന
  rationale: വർത്തമാന കൃദന്തരൂപത്തിന്റെ പൊതുവായ/തുടരുന്ന പ്രവർത്തനസൂചന സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: τραπέζης
  choice: മേശ
  rationale: ഗൃഹാന്തരീക്ഷത്തിലുള്ള ഉപമയുടെ സാധാരണ അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: τῶν κυρίων αὐτῶν
  choice: തങ്ങളുടെ യജമാനന്മാരുടെ
  rationale: ഇവിടെ κύριος ദൈവിക ബിരുദമല്ല, നായ്ക്കളുടെ മേൽ അധികാരമുള്ള വീട്ടുടമകളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘യജമാനന്മാർ’ ആ ബന്ധം വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: യേശുവിനെ നേരിട്ട് സംബോധന ചെയ്യുന്ന κύριε എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: കർത്താവേ
  alternative: യജമാനനേ / അങ്ങുന്നേ
  rationale: ഇത് ആദരപൂർവമായ ‘സാർ’ എന്ന അർഥത്തിലും ഗ്രഹിക്കാവുന്നതാണ്; എന്നാൽ മത്തായിയുടെ സുവിശേഷത്തിൽ യേശുവിനോടുള്ള സംബോധനയിൽ ഉണ്ടാകാവുന്ന ദൈവശാസ്ത്രപരമായ ആഴം നഷ്ടപ്പെടുത്താതെ ‘കർത്താവേ’ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- issue: κυνάρια എന്ന ലഘുരൂപത്തിന്റെ ശക്തി
  choice: കുഞ്ഞുനായ്ക്കൾ
  alternative: നായ്ക്കൾ / വീട്ടുനായ്ക്കൾ
  rationale: ഉപമയുടെ കഠിനത ഇല്ലാതാക്കാതെയും മൂലപാഠത്തേക്കാൾ കഠിനമാക്കാതെയും ഗ്രീക്കിലെ ലഘുരൂപം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ സംഭാഷണശൈലി. ‘കാരണം ... പോലും’ എന്ന ഘടന സ്ത്രീയുടെ സമ്മതവും അതിനെ അടിസ്ഥാനമാക്കിയുള്ള പ്രതിവാദവും നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദങ്ങൾക്കു പിന്നാലെ മുഖ്യപാഠത്തിൽ നൽകിയിരിക്കുന്നു.
