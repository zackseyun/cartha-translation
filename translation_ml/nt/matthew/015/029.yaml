source:
  edition: SBLGNT
  text: Καὶ μεταβὰς ἐκεῖθεν ὁ Ἰησοῦς ἦλθεν παρὰ τὴν θάλασσαν τῆς Γαλιλαίας, καὶ ἀναβὰς εἰς τὸ ὄρος ἐκάθητο ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/029.yaml
  text: And departing from there[a], Jesus came along the Sea of Galilee, and after going up on the mountain[b], he sat there.
translation:
  language: ml
  text: അവിടെനിന്ന് പുറപ്പെട്ടശേഷം യേശു ഗലീലക്കടലിന്റെ തീരത്തുകൂടെ[a] വന്നു; മലയിൽ കയറി അവിടെ ഇരിക്കുകയായിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഗലീലക്കടലിന്റെ തീരത്തിനരികെ വന്നു” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ പദപ്രയോഗം തീരത്തുകൂടെയുള്ള സഞ്ചാരത്തെയോ തീരത്തിനരികെയുള്ള വരവിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “അവിടെ ഇരുന്നു” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ ക്രിയാരൂപം കഴിഞ്ഞകാലത്ത് തുടരുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നതിനാൽ മുഖ്യപാഠത്തിൽ “ഇരിക്കുകയായിരുന്നു” എന്നു നൽകിയിരിക്കുന്നു.
    reason: aspectual_alternative
lexical_decisions:
- source_word: μεταβὰς ἐκεῖθεν
  choice: അവിടെനിന്ന് പുറപ്പെട്ടശേഷം
  rationale: Aorist participle and locative adverb together indicate departure from the prior location before the main action; this Malayalam phrasing naturally preserves that sequence.
- source_word: ἦλθεν
  choice: വന്നു
  rationale: The narrative aorist of ἔρχομαι is rendered directly and naturally as വന്നു.
- source_word: παρὰ τὴν θάλασσαν τῆς Γαλιλαίας
  choice: ഗലീലക്കടലിന്റെ തീരത്തുകൂടെ
  rationale: With a motion verb, παρά plus the accusative can describe movement along the shoreline. തീരത്തുകൂടെ preserves that sense while the footnote retains the possible destination sense, ‘to/beside the shore.’
- source_word: ἀναβὰς εἰς τὸ ὄρος
  choice: മലയിൽ കയറി
  rationale: This idiomatic Malayalam rendering conveys ascent to or onto the mountain without implying that the mountain is named.
- source_word: ἐκάθητο ἐκεῖ
  choice: അവിടെ ഇരിക്കുകയായിരുന്നു
  rationale: The imperfect ἐκάθητο presents an ongoing past posture or state; ഇരിക്കുകയായിരുന്നു preserves that imperfective force more clearly than the simple ഇരുന്നു.
