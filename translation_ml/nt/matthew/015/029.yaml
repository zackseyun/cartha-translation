  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘ഗലീലക്കടൽ’ സാധാരണ ബൈബിൾ ഭൂമിശാസ്ത്രനാമമായി നിലനിർത്തി; participial sequence സ്വാഭാവികമായ മലയാള ക്രിയാശൃംഖലയായി അവതരിപ്പിച്ചു.
