source:
  edition: SBLGNT
  text: Τότε προσέρχονται τῷ ⸀Ἰησοῦ ἀπὸ Ἱεροσολύμων ⸂Φαρισαῖοι καὶ γραμματεῖς⸃ λέγοντες
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/001.yaml
  text: Then Pharisees and scribes from Jerusalem come to Jesus[a], saying[b],
translation:
  language: ml
  text: 'അപ്പോൾ യെരൂശലേമിൽനിന്ന് പരീശന്മാരും ശാസ്ത്രിമാരും[a] യേശുവിന്റെ അടുക്കൽ വന്ന് പറയുന്നു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ശാസ്ത്രിമാർ’ എന്നത് ഈ സന്ദർഭത്തിൽ ‘ന്യായപ്രമാണപണ്ഡിതർ’ എന്നോ ‘ന്യായപ്രമാണാധ്യാപകർ’ എന്നോ അർത്ഥമാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: അപ്പോൾ
  rationale: അടുത്ത സംഭവത്തിലേക്കുള്ള കാലസൂചകമായ ആഖ്യാനബന്ധം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നിലനിർത്തുന്നു.
- source_word: προσέρχονται
  choice: അടുക്കൽ വന്ന്
  rationale: യേശുവിനെ സമീപിക്കുന്ന ചലനം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; മുഖ്യക്രിയയായ ‘പറയുന്നു’യോടു ബന്ധിപ്പിക്കാൻ ക്രിയാവിശേഷണരൂപം ഉപയോഗിച്ചു.
- source_word: τῷ Ἰησοῦ
  choice: യേശുവിന്റെ അടുക്കൽ
  rationale: προσέρχομαι എന്ന ക്രിയയോടുള്ള ദത്തിവിഭക്തി സൂചിപ്പിക്കുന്ന സമീപനലക്ഷ്യം വ്യക്തമായി നൽകുന്നു.
- source_word: ἀπὸ Ἱεροσολύμων
  choice: യെരൂശലേമിൽനിന്ന്
  rationale: ἀπό സൂചിപ്പിക്കുന്ന ഉത്ഭവസ്ഥലം കൃത്യമായി നിലനിർത്തുന്നു; ഔദ്യോഗികമായി അയക്കപ്പെട്ടവർ എന്ന അധികാർത്ഥം ചേർക്കുന്നില്ല.
- source_word: Φαρισαῖοι
  choice: പരീശന്മാർ
  rationale: ചരിത്രപരവും മതപരവുമായ ഈ യഹൂദസംഘത്തിന്റെ മലയാളത്തിൽ സുപരിചിതമായ പേരാണ്.
- source_word: γραμματεῖς
  choice: ശാസ്ത്രിമാർ
  rationale: സുവിശേഷസന്ദർഭത്തിൽ പതിവായി ഉപയോഗിക്കുന്ന പദം; ഇവർ വെറും എഴുത്തുകാരല്ല, ന്യായപ്രമാണവിദഗ്ധരുമായിരുന്നു എന്ന അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: καὶ
  choice: -ഉം … -ഉം
  rationale: രണ്ടു വിഭാഗങ്ങളെയും മലയാളത്തിലെ സ്വാഭാവിക സമുച്ചയഘടനയിൽ ബന്ധിപ്പിക്കുന്നു.
- source_word: λέγοντες
  choice: പറയുന്നു
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വാക്കുകളെ പരിചയപ്പെടുത്തുന്നു; ഗ്രീക്കിലെ സജീവമായ ആഖ്യാനവർത്തമാനം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ആഖ്യാനവർത്തമാനകാലം
  choice: ‘പറയുന്നു’ എന്ന വർത്തമാനകാലരൂപം നിലനിർത്തി
  alternative: ‘പറഞ്ഞു’ എന്ന ഭൂതകാലരൂപം ഉപയോഗിക്കുക
  rationale: ഗ്രീക്ക് പാഠത്തിലെ ചരിത്രവർത്തമാനം സംഭവത്തിന് നൽകുന്ന സജീവത മലയാളത്തിലും വായനാസൗകര്യം നഷ്ടപ്പെടുത്താതെ സംരക്ഷിക്കുന്നു.
- issue: γραμματεῖς എന്നവരുടെ പങ്ക്
  choice: മുഖ്യപാഠത്തിൽ ‘ശാസ്ത്രിമാർ’
  alternative: ‘ന്യായപ്രമാണപണ്ഡിതർ’ അല്ലെങ്കിൽ ‘ന്യായപ്രമാണാധ്യാപകർ’
  rationale: മൂലപദത്തോടുള്ള ഔപചാരികബന്ധവും സുവിശേഷങ്ങളിലെ പരിചിതമായ പ്രയോഗവും നിലനിർത്തുന്നു; അവരുടെ നിയമവിദഗ്ധപങ്ക് അടിക്കുറിപ്പിൽ നൽകുന്നു, എന്നാൽ ഒരേയൊരു നിർവചനത്തിലേക്ക് അർത്ഥം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘യെരൂശലേം,’ ‘പരീശന്മാർ,’ ‘ശാസ്ത്രിമാർ’ എന്നീ ബൈബിൾസന്ദർഭത്തിൽ പരിചിതമായ രൂപങ്ങൾ നിലനിർത്തി; അനാവശ്യമായ ഔദ്യോഗിക നിയോഗമോ വിഭാഗീയ വ്യാഖ്യാനമോ ചേർത്തിട്ടില്ല.
