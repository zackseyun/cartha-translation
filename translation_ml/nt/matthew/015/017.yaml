id: MAT.15.17
reference: Matthew 15:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀οὐ νοεῖτε ὅτι πᾶν τὸ εἰσπορευόμενον εἰς τὸ στόμα εἰς τὴν κοιλίαν χωρεῖ καὶ εἰς ἀφεδρῶνα ἐκβάλλεται;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/017.yaml
  text: Do you not understand that everything entering into the mouth goes into the stomach and is expelled into the latrine?[a]
translation:
  language: ml
  text: വായിലേക്കു കടക്കുന്നതെല്ലാം വയറ്റിലേക്കു ചെല്ലുകയും പിന്നെ കക്കൂസിലേക്കു പുറന്തള്ളപ്പെടുകയും ചെയ്യുന്നു എന്നു നിങ്ങൾക്കു മനസ്സിലാകുന്നില്ലേ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “വായിലേക്കു കടക്കുന്നതെന്തും ... അഴുക്കുചാലിലേക്കോ മലവിസർജനസ്ഥലത്തേക്കോ പുറന്തള്ളപ്പെടുന്നു.”'
    reason: ἀφεδρών എന്ന പദത്തിന് കക്കൂസ്/മലവിസർജനസ്ഥലം എന്നും അഴുക്കുചാൽ എന്നും സന്ദർഭാനുസൃതമായി നൽകാവുന്ന അർഥവികല്പങ്ങൾ രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: νοεῖτε
  choice: മനസ്സിലാകുന്നു
  rationale: ഇവിടെ νοέω ഇന്ദ്രിയഗ്രഹണമല്ല, യേശുവിന്റെ ആശയം ബുദ്ധിപരമായി ഗ്രഹിക്കുന്നതിനെയാണ് സൂചിപ്പിക്കുന്നത്. ശാസനയുടെ ഭാവമുള്ള ചോദ്യത്തിൽ ഈ പ്രയോഗം സ്വാഭാവികമാണ്.
- source_word: πᾶν τὸ εἰσπορευόμενον
  choice: കടക്കുന്നതെല്ലാം
  rationale: നപുംസക ഏകവചനത്തിലുള്ള ആർട്ടിക്കുലർ പാർട്ടിസിപ്പിൾ പൊതുവായി വായിലൂടെ അകത്തു ചെല്ലുന്ന എന്തിനെയും സൂചിപ്പിക്കുന്നു; ‘കടക്കുന്നതെല്ലാം’ ആ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: εἰς τὸ στόμα
  choice: വായിലേക്കു
  rationale: εἰς സൂചിപ്പിക്കുന്ന അകത്തേക്കുള്ള ചലനം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: κοιλίαν
  choice: വയറ്റ്
  rationale: സന്ദർഭത്തിൽ ദഹനാവയവമാണ് ഉദ്ദേശ്യം. ആധുനിക സാധാരണ മലയാളത്തിൽ ‘വയറ്റ്’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: χωρεῖ
  choice: ചെല്ലുന്നു
  rationale: ദഹനസന്ദർഭത്തിൽ ഭക്ഷണം വയറ്റിലേക്കു നീങ്ങുന്നതിനെ ലളിതവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: ἀφεδρῶνα
  choice: കക്കൂസ്
  rationale: മലവിസർജനത്തിനുള്ള സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന ἀφεδρών എന്ന പദത്തിന് ആധുനിക മലയാളത്തിൽ സാധാരണ വായനക്കാർക്കു വ്യക്തമായ സമാനപദമാണിത്; ‘അഴുക്കുചാൽ’ എന്ന സാധ്യത കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: ἐκβάλλεται
  choice: പുറന്തള്ളപ്പെടുന്നു
  rationale: നിഷ്ക്രിയരൂപവും ശരീരത്തിൽനിന്നുള്ള പുറത്താക്കലിന്റെ ഭൗതികബലവും നിലനിർത്തുന്നു; അനാവശ്യമായി പരുഷമാകുന്നില്ല.
theological_decisions:
- issue: ആചാരശുദ്ധിനിയമങ്ങളുമായുള്ള യേശുവിന്റെ വാക്കിന്റെ ബന്ധം
  choice: ശാരീരിക ദഹനപ്രക്രിയയെ വാക്യത്തിലുള്ളതുപോലെ നേരിട്ട് വിവർത്തനം ചെയ്തു; എല്ലാ ഭക്ഷണവും ശുദ്ധമാണെന്ന വ്യാഖ്യാനവികാസം ചേർത്തില്ല.
  alternative: എല്ലാ ഭക്ഷണവും ഇതുവഴി ശുദ്ധമായി പ്രഖ്യാപിക്കപ്പെടുന്നു എന്നു സൂചിപ്പിക്കുന്ന വിശദീകരണം വാക്യത്തിൽ ചേർക്കുക.
  rationale: ഈ വാക്യം അശുദ്ധിയേക്കുറിച്ചുള്ള യേശുവിന്റെ വാദത്തെ പിന്തുണയ്ക്കുന്നുവെങ്കിലും, മർക്കോസ് 7:19-ലെ വ്യാഖ്യാനപരമായ പരാമർശം മത്തായിയുടെ ഈ വാക്യത്തിൽ തുറന്നുപറയുന്നില്ല. അതിനാൽ അത്തരം നിഗമനം വിവർത്തനത്തിലേക്ക് ഇറക്കുമതി ചെയ്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി. ‘കക്കൂസ്’ സാധാരണ വായനക്കാർക്കു ഉടൻ മനസ്സിലാകുന്ന പദമായി ഉപയോഗിച്ചു; കുറിപ്പിൽ കൂടുതൽ ഔപചാരികവും വിശാലവുമായ അർഥവികല്പങ്ങൾ നൽകി. ചോദ്യത്തിന്റെ ശാസനാഭാവവും ദഹനപ്രക്രിയയുടെ നേരിട്ടുള്ള ചിത്രീകരണവും നിലനിർത്തി.
