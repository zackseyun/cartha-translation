id: MAT.15.8
reference: Matthew 15:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂Ὁ λαὸς οὗτος⸃ τοῖς χείλεσίν με τιμᾷ, ἡ δὲ καρδία αὐτῶν πόρρω ἀπέχει ἀπ’ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/008.yaml
  text: This people honors me with their lips[a], but their heart is far from me.
translation:
  language: ml
  text: ഈ ജനം അധരങ്ങൾകൊണ്ട് എന്നെ ബഹുമാനിക്കുന്നു; എന്നാൽ അവരുടെ ഹൃദയം[a] എന്നിൽനിന്ന് അകലെയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവരുടെ ഹൃദയങ്ങൾ.’ ഗ്രീക്കിൽ ‘ഹൃദയം’ ഏകവചനത്തിലാണ്; ജനത്തെ ഒന്നാകെ സൂചിപ്പിക്കുന്ന കൂട്ടായ പ്രയോഗമായിരിക്കാം ഇത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ λαὸς οὗτος
  choice: ഈ ജനം
  rationale: λαός ഒരു സമൂഹത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു; οὗτος എന്നതിന്റെ നിർദ്ദേശകബലം ‘ഈ’ നിലനിർത്തുന്നു. ‘ജനം’ പ്രവാചകവചനത്തിന്റെ ഗൗരവവും കൂട്ടായ അർഥവും സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: τοῖς χείλεσίν
  choice: അധരങ്ങൾകൊണ്ട്
  rationale: ദത്തിവ് ഇവിടെ ഉപകരണാർഥത്തിലാണ്. ‘അധരങ്ങൾകൊണ്ട്’ എന്നത് χείλη എന്ന ശരീരാവയവത്തിന്റെ ദൃശ്യബിംബം നിലനിർത്തുന്നു; ‘വാക്കുകൾകൊണ്ട്’ എന്ന് അമൂർത്തമാക്കുന്നില്ല.
- source_word: με
  choice: എന്നെ
  rationale: τιμᾷ എന്ന ക്രിയയുടെ നേരിട്ടുള്ള കർമം; സ്വാഭാവികമായ മലയാള പരിഭാഷ.
- source_word: τιμᾷ
  choice: ബഹുമാനിക്കുന്നു
  rationale: τιμάω ഇവിടെ ആദരിക്കുകയോ ബഹുമാനം പ്രകടിപ്പിക്കുകയോ ചെയ്യുന്നതാണ്; ‘മഹത്ത്വപ്പെടുത്തുന്നു’ എന്നതിലധികം കൃത്യവും സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവുമാണ്.
- source_word: ἡ δὲ καρδία αὐτῶν
  choice: എന്നാൽ അവരുടെ ഹൃദയം
  rationale: δέ ഇവിടെ വിരോധം സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ എന്നു നൽകി. καρδία ഏകവചനത്തിലായതിനാൽ ജനത്തെ ഒരു കൂട്ടായ ശരീരമായി അവതരിപ്പിക്കുന്ന ‘അവരുടെ ഹൃദയം’ നിലനിർത്തി.
- source_word: πόρρω
  choice: വളരെ അകലെ
  rationale: πόρρω ഗണ്യമായ അകലം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘വളരെ അകലെ’ എന്നത് അതിന്റെ ഊന്നൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀπέχει ἀπ’ ἐμοῦ
  choice: എന്നിൽനിന്ന് ... അകലെയാണ്
  rationale: ἀπέχω ἀπό എന്ന പ്രയോഗം ഒരാളിൽനിന്നുള്ള അകലം സൂചിപ്പിക്കുന്നു. ഈ മലയാളരൂപം സ്ഥലപരമായ ബിംബത്തോടൊപ്പം ബന്ധപരമായ അകൽച്ചയും തുറന്നുവെക്കുന്നു.
theological_decisions:
- issue: കൂട്ടായ ഏകവചനമായ ‘ഹൃദയം’ ആണോ വ്യക്തികളെ സൂചിപ്പിക്കുന്ന ബഹുവചനമായ ‘ഹൃദയങ്ങൾ’ ആണോ
  choice: 'ഗ്രീക്കിലെ ഏകവചനം നിലനിർത്തി: ‘അവരുടെ ഹൃദയം’'
  alternative: ‘അവരുടെ ഹൃദയങ്ങൾ’
  rationale: καρδία ഏകവചനമാണ്; ജനത്തിന്റെ ആന്തരിക മനോഭാവത്തെ കൂട്ടായി അവതരിപ്പിക്കാനാണ് സാധ്യത. ഏകവചനം നിലനിർത്തുന്നത് പ്രവാചക ഉദ്ധരണിയുടെ വാചകശക്തി സംരക്ഷിക്കുകയും വ്യാഖ്യാനപരമായ മിനുക്കൽ ഒഴിവാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അധരങ്ങൾ’ എന്ന ദൃശ്യബിംബവും ‘ഹൃദയം’ എന്ന കൂട്ടായ ഏകവചനവും മൂലപാഠാനുസൃതമായി നിലനിർത്തി; അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടുണ്ട്.
