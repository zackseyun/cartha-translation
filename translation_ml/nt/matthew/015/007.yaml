revisions:
- from: 'കപടഭക്തരേ, നിങ്ങളെക്കുറിച്ച് യെശയ്യാവ് ശരിയായിത്തന്നെ പ്രവചിച്ചു[a]. അദ്ദേഹം പറഞ്ഞു:'
  to: 'കപടന്മാരേ, നിങ്ങളെക്കുറിച്ച് യെശയ്യാവ് ശരിയായിത്തന്നെ ഇങ്ങനെ പ്രവചിച്ചു[a]:'
  rationale: The revision removes the added religious-specific sense from the vocative, retains the strong direct address, and uses an idiomatic Malayalam quotation introduction that corresponds to λέγων. The footnote is aligned more closely with the English audit trail’s lexical alternative while leaving the main rendering intact.
