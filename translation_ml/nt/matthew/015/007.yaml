id: MAT.15.7
reference: Matthew 15:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὑποκριταί, καλῶς ἐπροφήτευσεν περὶ ὑμῶν Ἠσαΐας λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/007.yaml
  text: 'Hypocrites[a], Isaiah rightly prophesied about you, saying:'
translation:
  language: ml
  text: 'കപടന്മാരേ, നിങ്ങളെക്കുറിച്ച് യെശയ്യാവ് ശരിയായിത്തന്നെ ഇങ്ങനെ പ്രവചിച്ചു[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നന്നായി പ്രവചിച്ചു.”
    reason: καλῶς എന്നതിന് ‘ശരിയായിത്തന്നെ’ എന്നതിനൊപ്പം ‘നന്നായി’ എന്നും അർഥമാക്കാം.
lexical_decisions:
- source_word: ὑποκριταί
  choice: കപടഭക്തരേ
  rationale: ബഹുവചന സംബോധനയുടെ നേരിട്ടുള്ള ശാസനാഭാവം നിലനിർത്തുന്നു. ഈ മതപരമായ സന്ദർഭത്തിൽ വെറും ‘അഭിനേതാക്കൾ’ എന്ന പദാർത്ഥത്തെക്കാൾ കപടമായ ഭക്തിയെ കുറ്റപ്പെടുത്തുന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: καλῶς
  choice: ശരിയായിത്തന്നെ
  rationale: യെശയ്യാവിന്റെ പ്രവചനം ഇവരെ സംബന്ധിച്ച് യോജിച്ചതും സത്യമായും ബാധകവുമാണെന്ന ഊന്നൽ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘നന്നായി’ എന്നതിലുണ്ടാകാവുന്ന ശൈലീപരമായ അവ്യക്തത ഒഴിവാക്കുന്നു.
- source_word: ἐπροφήτευσεν
  choice: പ്രവചിച്ചു
  rationale: പ്രവാചകപ്രസംഗത്തിന്റെ സ്വഭാവവും യെശയ്യാവുമായുള്ള ബന്ധവും നേരിട്ട് സംരക്ഷിക്കുന്ന സാധാരണ മലയാള പ്രയോഗം.
- source_word: περὶ ὑμῶν
  choice: നിങ്ങളെക്കുറിച്ച്
  rationale: περί + genitive എന്ന ഘടനയുടെ ‘നിങ്ങളെ സംബന്ധിച്ച്’ എന്ന ആശയം സ്വാഭാവികവും വ്യക്തവുമായി നൽകുന്നു.
- source_word: Ἠσαΐας
  choice: യെശയ്യാവ്
  rationale: പ്രവാചകന്റെ പേരിന്റെ മലയാളത്തിൽ സ്ഥാപിതമായ രൂപം ഉപയോഗിക്കുന്നു.
- source_word: λέγων
  choice: 'അദ്ദേഹം പറഞ്ഞു:'
  rationale: തുടർന്നുവരുന്ന ഉദ്ധരണിയെ പരിചയപ്പെടുത്തുന്ന വർത്തമാന കൃതന്തത്തിന്റെ പ്രവർത്തനം മലയാളത്തിൽ സ്വാഭാവികമായ സ്വതന്ത്ര വാക്യമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ നേരിട്ടുള്ള കുറ്റപ്പെടുത്തലിന്റെ ശക്തി
  choice: ‘കപടഭക്തരേ’ എന്ന ശക്തമായ സംബോധനം
  alternative: ‘കപടന്മാരേ’ അല്ലെങ്കിൽ മൃദുവായ ‘നാട്യക്കാരേ’
  rationale: ὑποκριταί ഇവിടെ ധാർമികവും മതപരവുമായ ശക്തമായ കുറ്റാരോപണമാണ്. ‘കപടഭക്തരേ’ സന്ദർഭത്തിലെ പുറമേയുള്ള ഭക്തിയും ഉള്ളിലെ വിരോധവും സൂചിപ്പിക്കുമ്പോൾ ശാസനയുടെ തീക്ഷ്ണത കുറയ്ക്കുന്നില്ല.
- issue: καλῶς എന്നതിന്റെ അർഥവ്യാപ്തി
  choice: പ്രവചനം ഇവരോടു കൃത്യമായി ചേരുന്നു എന്ന നിലയിൽ ‘ശരിയായിത്തന്നെ’
  alternative: ‘നന്നായി’ അല്ലെങ്കിൽ ‘ഉചിതമായിത്തന്നെ’
  rationale: ഗ്രീക്ക് പദം പ്രവചനത്തിന്റെ പ്രസക്തി, യോജ്യത, ശരിത്വം എന്നിവ ഉൾക്കൊള്ളാം. പ്രധാന പാഠം സ്വാഭാവികമായി ശരിത്വം പ്രകടിപ്പിക്കുന്നു; പദത്തിന്റെ യോജ്യതാഭാവം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളം. നേരിട്ടുള്ള ശാസനയുടെ തീക്ഷ്ണതയും അടുത്ത വാക്യത്തിലെ യെശയ്യാ ഉദ്ധരണിയിലേക്കുള്ള സുതാര്യമായ മാറ്റവും നിലനിർത്തിയിരിക്കുന്നു.
