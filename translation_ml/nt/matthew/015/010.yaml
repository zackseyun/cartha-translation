  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ προσκαλεσάμενος τὸν ὄχλον εἶπεν αὐτοῖς· Ἀκούετε καὶ συνίετε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/010.yaml
  text: And calling the crowd to him[a], he said to them, “Listen and understand.”
translation:
  language: ml
  text: 'അവൻ ജനക്കൂട്ടത്തെ തന്റെ അടുക്കലേക്ക് വിളിച്ച് അവരോടു പറഞ്ഞു: “കേൾക്കുക; മനസ്സിലാക്കുക.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: (വാക്യബന്ധത്തിലൂടെ സൂചിപ്പിച്ചു; പ്രത്യേകമായി ‘പിന്നെ’ ചേർത്തില്ല)
  rationale: καί ആഖ്യാനം മുന്നോട്ടു കൊണ്ടുപോകുന്ന ലളിതമായ സംയോജകമാണ്. മലയാളത്തിൽ ഈ വാക്യത്തിൽ പ്രത്യേക സംയോജകപദമില്ലാതെയും ബന്ധം സ്വാഭാവികമായി നിലനിൽക്കുന്നു; ‘പിന്നെ’ എന്നു ചേർത്താൽ ഗ്രീക്കിൽ ഇല്ലാത്ത കാലക്രമസൂചന ശക്തമാകും.
- source_word: προσκαλεσάμενος
  choice: അടുത്തേക്ക് വിളിച്ച്
  rationale: ആഓറിസ്റ്റ് മിഡിൽ പാർട്ടിസിപ്പിൾ പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള അനുബന്ധ പ്രവർത്തിയെ സൂചിപ്പിക്കുന്നു. ‘അടുത്തേക്ക് വിളിച്ച്’ എന്നത് ദിശാബോധവും പ്രവർത്തികളുടെ ക്രമവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τὸν ὄχλον
  choice: ജനക്കൂട്ടത്തെ
  rationale: ὄχλος ഇവിടെ കൂടിയിരിക്കുന്ന ജനസമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ജനക്കൂട്ടം’ ആധുനികവും വ്യക്തവുമായ പ്രയോഗമാണ്.
- source_word: εἶπεν αὐτοῖς
  choice: അവരോടു പറഞ്ഞു
  rationale: λέγωയും ദാതിവ് സർവനാമവും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: Ἀκούετε
  choice: കേൾക്കുക
  rationale: വർത്തമാനകാല ബഹുവചന ആജ്ഞാരൂപത്തിന്റെ നിർദേശശക്തി നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ ഇത് വെറും ശബ്ദഗ്രഹണമല്ല, ശ്രദ്ധയോടെ കേൾക്കാനുള്ള ആഹ്വാനമാണ്.
- source_word: συνίετε
  choice: മനസ്സിലാക്കുക
  rationale: കേട്ടതിന്റെ അർഥം ഗ്രഹിക്കണമെന്ന ആഹ്വാനമാണ്; ‘മനസ്സിലാക്കുക’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും കൃത്യവുമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. രണ്ടു ബഹുവചന ആജ്ഞാരൂപങ്ങളും ‘കേൾക്കുകയും മനസ്സിലാക്കുകയും ചെയ്യുക’ എന്ന സമാന്തര ഘടനയിൽ അവതരിപ്പിച്ചു. മൂലപാഠത്തിൽ യഥാർഥ പാഠഭേദമോ വ്യാഖ്യാനപരമായ ദൈവശാസ്ത്രപ്രശ്നമോ ഇല്ലാത്തതിനാൽ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല; നൽകിയ ഇംഗ്ലീഷ് അടിക്കുറിപ്പിന്റെ ഉള്ളടക്കം പ്രസിദ്ധീകരിച്ച ഇംഗ്ലീഷ് മുഖ്യവാചകവുമായി പൊരുത്തപ്പെടാത്തതിനാൽ അത് ആവർത്തിച്ചില്ല.
