id: MAT.15.30
reference: Matthew 15:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ προσῆλθον αὐτῷ ὄχλοι πολλοὶ ἔχοντες μεθ’ ἑαυτῶν ⸂κωφούς, τυφλούς, χωλούς, κυλλούς⸃, καὶ ἑτέρους πολλούς, καὶ ἔρριψαν αὐτοὺς παρὰ τοὺς πόδας ⸀αὐτοῦ, καὶ ἐθεράπευσεν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/030.yaml
  text: And large crowds came to him[a], bringing with them the mute, the blind, the lame, the crippled, and many others, and they laid them at his feet[b], and he healed them.
translation:
  language: ml
  text: വലിയ ജനക്കൂട്ടങ്ങൾ അവന്റെ അടുക്കൽ വന്നു. സംസാരിക്കാൻ കഴിയാത്തവരെയും[a] അന്ധരെയും മുടന്തരെയും കൈകാലുകൾക്ക് വൈകല്യമുള്ളവരെയും[b] മറ്റു പലരെയും അവർ കൂടെ കൊണ്ടുവന്ന് അവന്റെ കാൽക്കൽ വെച്ചു; അവൻ അവരെ സൗഖ്യമാക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കേൾക്കാൻ കഴിയാത്തവർ.” ഗ്രീക്കിലെ κωφούς എന്ന പദം സന്ദർഭമനുസരിച്ച് ബധിരരെയോ മൂകരെയോ രണ്ടും ഉള്ളവരെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിലെ κυλλούς എന്ന പദം കൈകാലുകൾക്ക് രൂപഭേദമോ പ്രവർത്തനവൈകല്യമോ ഉള്ളവരെ വിശാലമായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθον αὐτῷ
  choice: അവന്റെ അടുക്കൽ വന്നു
  rationale: യേശുവിനെ സമീപിച്ചുള്ള ആഖ്യാനചലനം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὄχλοι πολλοὶ
  choice: വലിയ ജനക്കൂട്ടങ്ങൾ
  rationale: ബഹുവചനവും ജനങ്ങളുടെ വലിയ തോതും ഒരുപോലെ നിലനിർത്തുന്നു.
- source_word: ἔχοντες μεθ’ ἑαυτῶν
  choice: അവർ കൂടെ കൊണ്ടുവന്ന്
  rationale: അക്ഷരാർഥത്തിലെ ‘തങ്ങളോടുകൂടെ ഉണ്ടായിരുന്ന’ എന്ന ആശയം സന്ദർഭോചിതമായ പ്രവർത്തനമായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: κωφούς
  choice: സംസാരിക്കാൻ കഴിയാത്തവർ
  rationale: κωφός എന്ന പദത്തിന് ബധിരർ, മൂകർ, അല്ലെങ്കിൽ രണ്ടും എന്ന അർഥസാധ്യതയുണ്ട്. പ്രധാന പാഠത്തിൽ മൗനത്വസംബന്ധമായ അർഥം വ്യക്തവും മാന്യവുമായ വ്യക്തികേന്ദ്രിത ഭാഷയിൽ നൽകി, മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: τυφλούς
  choice: അന്ധർ
  rationale: τυφλός എന്ന പദത്തിന്റെ നേരിട്ടുള്ളതും പ്രചാരത്തിലുള്ളതുമായ മലയാള പരിഭാഷ.
- source_word: χωλούς
  choice: മുടന്തർ
  rationale: നടപ്പിലെ വൈകല്യം സൂചിപ്പിക്കുന്ന χωλός എന്ന പദത്തിന് സംക്ഷിപ്തവും പരിചിതവുമായ മലയാളപ്രയോഗം.
- source_word: κυλλούς
  choice: കൈകാലുകൾക്ക് വൈകല്യമുള്ളവർ
  rationale: വളഞ്ഞതോ രൂപഭേദം വന്നതോ പ്രവർത്തനശേഷി കുറഞ്ഞതോ ആയ കൈകാലുകളെ സൂചിപ്പിക്കുന്ന വിശാലമായ അർഥം അപമാനകരമല്ലാത്ത ആധുനിക ഭാഷയിൽ നൽകുന്നു.
- source_word: ἑτέρους πολλούς
  choice: മറ്റു പലരെയും
  rationale: പട്ടികയിൽ പറയാത്ത അനേകം രോഗബാധിതരെയും ഉൾക്കൊള്ളുന്ന ഗ്രീക്ക് പ്രയോഗം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἔρριψαν
  choice: കിടത്തി
  rationale: പദത്തിന് അക്ഷരാർഥത്തിൽ ‘എറിഞ്ഞു/ഇട്ടു’ എന്നു വരാമെങ്കിലും, ഈ സന്ദർഭത്തിൽ യേശുവിന്റെ കാൽക്കൽ രോഗികളെ കിടത്തിയതെന്ന അർഥമാണ് സ്വാഭാവികം; അനാവശ്യമായ പരുഷത ഒഴിവാക്കുന്നു.
- source_word: παρὰ τοὺς πόδας αὐτοῦ
  choice: അവന്റെ കാൽക്കൽ
  rationale: യേശുവിന്റെ തൊട്ടടുത്ത് കൊണ്ടുവെച്ചെന്ന ദൃശ്യരൂപം മലയാളത്തിലെ പതിവായ പ്രയോഗത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐθεράπευσεν αὐτούς
  choice: അവൻ അവരെ സൗഖ്യമാക്കി
  rationale: സുവിശേഷങ്ങളിലെ θεραπεύω എന്ന രോഗശാന്തിക്രിയയ്ക്ക് സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം.
