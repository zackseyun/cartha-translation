translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വൈകല്യമുള്ളവരെക്കുറിച്ച് സാധ്യമായിടത്ത് വ്യക്തികേന്ദ്രിത ഭാഷ ഉപയോഗിച്ചു; പട്ടികയുടെ സംക്ഷിപ്തത നിലനിർത്താൻ ‘അന്ധർ’, ‘മുടന്തർ’ എന്നീ പരിചിത രൂപങ്ങൾ സൂക്ഷിച്ചു. ഗ്രീക്ക് പദങ്ങളുടെ യഥാർഥ അർഥവ്യാപ്തി അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
