  source_fidelity: 'പ്രധാനപാഠം ഗ്രീക്ക് വാക്യത്തിന്റെ ഘടനയും ആശയവും വിശ്വസ്തമായി നൽകുന്നു: വലിയ ജനക്കൂട്ടങ്ങൾ യേശുവിന്റെ അടുക്കൽ വന്നു, വിവിധ വൈകല്യങ്ങളുള്ളവരെയും മറ്റുള്ളവരെയും കൊണ്ടുവന്നു, അവന്റെ കാൽക്കൽ വെച്ചു, അവൻ അവരെ സൗഖ്യമാക്കി. എന്നാൽ κυλλούς സംബന്ധിച്ച അടിക്കുറിപ്പിലെ ‘കൈകാലുകൾ മുറിഞ്ഞവർ’ എന്ന പരാമർശം പദത്തിന്റെ ആവശ്യമായ അർഥത്തേക്കാൾ ഇടുങ്ങിയതും ശക്തവുമാണ്; ഈ പദം പൊതുവേ കൈകാലുകളുടെ വൈകല്യമോ രൂപഭേദമോ സൂചിപ്പിക്കുന്നു, അനിവാര്യമായി അംഗഛേദം അല്ല.'
  naturalness: ‘സംസാരിക്കാൻ കഴിയാത്തവർ,’ ‘കൈകാലുകൾക്ക് വൈകല്യമുള്ളവർ,’ ‘അവന്റെ കാൽക്കൽ വെച്ചു,’ ‘സൗഖ്യമാക്കി’ എന്നിവ ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ വ്യക്തവും മാന്യവുമാണ്. ‘വെച്ചു’ എന്നത് ἔρριψαν എന്ന ക്രിയയുടെ ഈ സന്ദർഭത്തിലെ ‘laid/placed’ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
