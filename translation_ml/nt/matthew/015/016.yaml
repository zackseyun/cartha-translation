id: MAT.15.16
reference: Matthew 15:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ εἶπεν· Ἀκμὴν καὶ ὑμεῖς ἀσύνετοί ἐστε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/016.yaml
  text: But he said[a], “Are you also still without understanding?”
translation:
  language: ml
  text: 'എന്നാൽ അദ്ദേഹം പറഞ്ഞു: “നിങ്ങൾക്കും ഇനിയും മനസ്സിലായിട്ടില്ലേ?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ εἶπεν
  choice: എന്നാൽ അദ്ദേഹം പറഞ്ഞു
  rationale: ὁ എന്ന പദം സന്ദർഭത്തിൽ യേശുവിനെ സൂചിപ്പിക്കുന്ന സർവനാമപ്രയോഗമാണ്; δὲ ശിഷ്യന്മാരുടെ ചോദ്യത്തിൽനിന്ന് യേശുവിന്റെ മറുപടിയിലേക്കുള്ള നേരിയ പ്രതികൂല തിരിവ് സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ എന്നു നൽകി.
- source_word: Ἀκμὴν
  choice: ഇനിയും
  rationale: മുമ്പ് ലഭിച്ച ഉപദേശത്തിനുശേഷവും ഗ്രാഹ്യമില്ലായ്മ തുടരുന്നു എന്ന ‘still/even now’ എന്ന കാലപരമായ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ ഇതു നൽകുന്നു.
- source_word: καὶ ὑμεῖς
  choice: നിങ്ങളും
  rationale: വ്യക്തമായി നൽകിയിരിക്കുന്ന ὑμεῖς എന്ന സർവനാമത്തിന്റെയും ഉൾപ്പെടുത്തൽ സൂചിപ്പിക്കുന്ന καὶ എന്ന പദത്തിന്റെയും ഊന്നൽ ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: ἀσύνετοί ἐστε
  choice: വിവേകമില്ലാത്തവരാണോ
  rationale: ഗ്രഹണശേഷിയോ ഉൾക്കാഴ്ചയോ ഇല്ലാത്ത അവസ്ഥയെ സൂചിപ്പിക്കുന്ന ചോദ്യം; ‘മൂഢർ’ എന്ന കൂടുതൽ കടുത്ത ധാർമിക കുറ്റപ്പെടുത്തൽ ഒഴിവാക്കി ശാസനയുടെ മൂർച്ച നിലനിർത്തുന്നു.
theological_decisions:
- issue: ശിഷ്യന്മാരോടുള്ള യേശുവിന്റെ ശാസനയുടെ സ്വരം
  choice: തുടർന്നുനിൽക്കുന്ന ഗ്രാഹ്യമില്ലായ്മയെക്കുറിച്ചുള്ള മൂർച്ചയുള്ള ചോദ്യമായി വിവർത്തനം ചെയ്തു.
  alternative: “നിങ്ങളും ഇനിയും ഇത്ര മന്ദബുദ്ധികളാണോ?”
  rationale: ഗ്രീക്ക് വാചകം ശാസനാത്മകമാണെങ്കിലും അതിനെ അതിരുകടന്ന അപലപനമാക്കി മാറ്റുന്നില്ല; ‘ഇനിയും’ തുടർച്ചയെ വ്യക്തമാക്കുകയും ‘വിവേകമില്ലാത്തവർ’ അർത്ഥപരമായ പിരിമുറുക്ക് നിലനിർത്തുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ചോദ്യം നേരിട്ടും ശാസനാത്മകമായും നിലനിർത്തിയിട്ടുണ്ട്; അനാവശ്യമായ വിശദീകരണം വാക്യത്തിൽ ചേർത്തിട്ടില്ല.
