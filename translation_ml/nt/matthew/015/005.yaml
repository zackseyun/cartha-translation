id: MAT.15.5
reference: Matthew 15:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ λέγετε· Ὃς ἂν εἴπῃ τῷ πατρὶ ἢ τῇ μητρί· Δῶρον ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/005.yaml
  text: But you say[a], ‘Whoever says to his father or his mother, “Whatever you would have benefited from me is a gift,”’
translation:
  language: ml
  text: 'എന്നാൽ നിങ്ങൾ പറയുന്നത്: ‘ആരെങ്കിലും തന്റെ അപ്പനോടോ അമ്മയോടോ, “എന്നിൽനിന്ന് നിങ്ങൾക്കു ലഭിക്കുമായിരുന്ന ഏതു സഹായവും ഒരു വഴിപാടാണ്”[a] എന്നു പറഞ്ഞാൽ,’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഒരു സമ്മാനമാണ്.” മാതാപിതാക്കളെ സഹായിക്കാൻ ഉപയോഗിക്കാമായിരുന്നതിനെ ദൈവത്തിനു സമർപ്പിച്ചതായി പ്രഖ്യാപിക്കുന്നതാണ് ഇവിടെ ഉദ്ദേശ്യം. “കൊർബാൻ” എന്ന പദം ഉപയോഗിക്കുന്ന മർക്കോസ് 7:11 താരതമ്യം ചെയ്യുക.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δὲ λέγετε
  choice: എന്നാൽ നിങ്ങൾ പറയുന്നത്
  rationale: δὲ മുൻവാക്യത്തിലെ ദൈവകല്പനയുമായി വ്യക്തമായ വൈരുധ്യം സൂചിപ്പിക്കുന്നു; λέγετε പൊതുവായ വർത്തമാനപ്രയോഗമായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: Ὃς ἂν εἴπῃ
  choice: ആരെങ്കിലും ... എന്നു പറഞ്ഞാൽ
  rationale: ബന്ധസർവനാമവും ἄν ചേർന്ന aorist subjunctive-ഉം അനിശ്ചിതമായ പൊതുനിബന്ധനയാണ്; മലയാളത്തിൽ ‘ആരെങ്കിലും ... പറഞ്ഞാൽ’ അതിന്റെ സ്വാഭാവിക തുല്യപ്രയോഗമാണ്.
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: തന്റെ അപ്പനോടോ അമ്മയോടോ
  rationale: ദാതൃവിഭക്തിയുടെ പരോക്ഷകർമബന്ധവും വ്യക്തിയുടെ സ്വന്തം മാതാപിതാക്കളെന്ന അർഥവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Δῶρον
  choice: ഒരു വഴിപാട്
  rationale: δῶρον എന്നത് സമ്മാനം എന്നും വഴിപാട് എന്നും അർഥമാക്കാം; ഇവിടെ ദൈവത്തിനു സമർപ്പിച്ചതായി പ്രഖ്യാപിക്കുന്ന വസ്തുവാണ് ഉദ്ദേശ്യം. സന്ദർഭത്തിൽ ‘വഴിപാട്’ സ്വാഭാവികവും കൃത്യവുമാണ്; പദത്തിന്റെ വിപുലമായ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς
  choice: എന്നിൽനിന്ന് നിങ്ങൾക്കു ലഭിക്കേണ്ടിയിരുന്ന സഹായം
  rationale: ἐξ ἐμοῦ എന്ന ഉറവിടബന്ധവും ὠφεληθῇς എന്ന ‘സഹായം/പ്രയോജനം ലഭിക്കുക’ എന്ന ആശയവും മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; മാതാപിതാവിനു ലഭിക്കാമായിരുന്നെങ്കിലും ലഭിക്കാതെ പോയ പിന്തുണയെന്ന സന്ദർഭസൂചന ‘ലഭിക്കേണ്ടിയിരുന്ന’ എന്നതിൽ പ്രതിഫലിക്കുന്നു.
theological_decisions:
- issue: മത്തായിയുടെ പാഠത്തിൽ മർക്കോസ് 7:11-ലെ സാങ്കേതികപദമായ ‘കൊർബാൻ’ ചേർക്കണമോ
  choice: മത്തായി ഉപയോഗിക്കുന്ന δῶρον എന്ന പദം ‘ഒരു വഴിപാട്’ എന്നു വിവർത്തനം ചെയ്യുന്നു
  alternative: ‘കൊർബാൻ’ അല്ലെങ്കിൽ ‘ദൈവത്തിനു സമർപ്പിച്ച വഴിപാട്’ എന്നു മുഖ്യപാഠത്തിൽ വികസിപ്പിക്കുക
  rationale: മത്തായി κορβᾶν എന്ന പദം ഉപയോഗിക്കുന്നില്ല. അതിനാൽ മത്തായിയുടെ യഥാർഥ പദപ്രയോഗം നിലനിർത്തുകയും സമർപ്പണത്തിന്റെ സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. മാതാപിതാക്കളോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയിൽ ബഹുമാനസൂചകമായ ‘നിങ്ങൾക്കു’ ഉപയോഗിച്ചു. വാക്യം അടുത്ത വാക്യത്തിൽ തുടരുന്നതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തി.
