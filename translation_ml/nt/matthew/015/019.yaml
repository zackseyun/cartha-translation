    issue: Finite verb rendered by a nominalized focus construction
    rationale: ‘പുറപ്പെടുന്നത്’ with ‘-ആണ്’ is grammatical, but the direct finite ‘പുറപ്പെടുന്നു’ is more natural here and more closely matches ἐξέρχονται.
  - severity: low
