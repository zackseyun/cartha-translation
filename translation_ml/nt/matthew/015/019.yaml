id: MAT.15.19
reference: Matthew 15:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐκ γὰρ τῆς καρδίας ἐξέρχονται διαλογισμοὶ πονηροί, φόνοι, μοιχεῖαι, πορνεῖαι, κλοπαί, ψευδομαρτυρίαι, βλασφημίαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/019.yaml
  text: For out of the heart come evil thoughts[a], murders, adulteries, sexual immoralities, thefts, false testimonies, and blasphemies.
translation:
  language: ml
  text: കാരണം, ഹൃദയത്തിൽനിന്ന് ദുഷിച്ച ചിന്തകൾ, കൊലപാതകങ്ങൾ, വ്യഭിചാരങ്ങൾ, ലൈംഗിക അധാർമിക പ്രവൃത്തികൾ, മോഷണങ്ങൾ, കള്ളസാക്ഷ്യങ്ങൾ, ദൂഷണങ്ങൾ[a] എന്നിവ പുറപ്പെടുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ദൈവദൂഷണങ്ങൾ.’ ഗ്രീക്ക് പദം സന്ദർഭമനുസരിച്ച് മനുഷ്യർക്കെതിരായ അപവാദത്തെയോ ദൈവത്തിനെതിരായ ദൂഷണവാക്കുകളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ γὰρ τῆς καρδίας
  choice: കാരണം, ഹൃദയത്തിൽനിന്നാണ്
  rationale: γάρ എന്നതിന്റെ വിശദീകരണസ്വഭാവം ‘കാരണം’ കൊണ്ടും ἐκ എന്നതിന്റെ ഉറവിടാർഥം ‘-യിൽനിന്ന്’ കൊണ്ടും വ്യക്തമാക്കുന്നു. καρδία സൂചിപ്പിക്കുന്ന ആന്തരിക വ്യക്തിത്വത്തെ ബൈബിൾസഹജമായ ‘ഹൃദയം’ എന്ന രൂപകത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: ἐξέρχονται
  choice: പുറപ്പെടുന്നത്
  rationale: ഉള്ളിൽനിന്ന് പുറത്തേക്കു വരുക എന്ന ക്രിയയുടെ ദൃശ്യഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: διαλογισμοὶ πονηροί
  choice: ദുഷിച്ച ചിന്തകൾ
  rationale: διαλογισμοί എന്നത് ചിന്തകൾ, ആലോചനകൾ, വിചാരങ്ങൾ എന്നിവയെ സൂചിപ്പിക്കാം. സന്ദർഭത്തിൽ അതിനെ ഗൂഢാലോചനകളായി അനാവശ്യമായി ചുരുക്കാതെ ധാർമികമായി ദുഷിച്ച ആന്തരിക ചിന്തകൾ എന്ന വിശാലാർഥം നൽകുന്നു.
- source_word: φόνοι
  choice: കൊലപാതകങ്ങൾ
  rationale: നിയമവിരുദ്ധവും ധാർമികമായി കുറ്റകരവുമായ മനുഷ്യഹത്യകൾ എന്ന പദത്തിന്റെ ഭാരം ‘കൊലപാതകങ്ങൾ’ കൃത്യമായി നൽകുന്നു.
- source_word: μοιχεῖαι
  choice: വ്യഭിചാരങ്ങൾ
  rationale: വിവാഹബന്ധത്തിന്റെ ലംഘനമായ വ്യഭിചാരത്തെ സൂചിപ്പിക്കുന്ന ബഹുവചനരൂപം നിലനിർത്തുന്നു.
- source_word: πορνεῖαι
  choice: ലൈംഗിക അധാർമികതകൾ
  rationale: πορνεῖαι ഉൾക്കൊള്ളുന്ന വിവിധതരം അധാർമിക ലൈംഗിക പെരുമാറ്റങ്ങളുടെ വിശാലതയും ബഹുവചനവും നിലനിർത്തുന്നു; അർഥം ഒരു പ്രത്യേക പ്രവൃത്തിയിലേക്കു ചുരുക്കുന്നില്ല.
- source_word: κλοπαί
  choice: മോഷണങ്ങൾ
  rationale: മോഷണപ്രവൃത്തികളെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ ബഹുവചനപ്രയോഗം.
- source_word: ψευδομαρτυρίαι
  choice: കള്ളസാക്ഷ്യങ്ങൾ
  rationale: തെറ്റായ സാക്ഷ്യം നൽകുന്നതിലെ സാക്ഷ്യപരവും നിയമപരവുമായ ഭാവം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: βλασφημίαι
  choice: ദൂഷണങ്ങൾ
  rationale: പദത്തിന് മനുഷ്യർക്കെതിരായ അപവാദമോ ദൈവത്തിനെതിരായ ദൂഷണമോ സൂചിപ്പിക്കാനാകും. പൊതുവായ ദോഷപ്പട്ടികയായ ഈ സന്ദർഭത്തിൽ ‘ദൂഷണങ്ങൾ’ വിശാലത നിലനിർത്തുന്നു; ദൈവദൂഷണം എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: ദോഷപ്പട്ടികയിലെ βλασφημίαι എന്ന പദത്തിന്റെ ലക്ഷ്യം
  choice: പ്രധാനപാഠത്തിൽ ‘ദൂഷണങ്ങൾ’
  alternative: ‘ദൈവദൂഷണങ്ങൾ’
  rationale: സന്ദർഭം ദൈവത്തിനെതിരായ കുറ്റങ്ങളെ മാത്രം പ്രത്യേകമായി പറയുന്നില്ല. അതിനാൽ മനുഷ്യർക്കെതിരായ അപവാദത്തെയും ദൈവത്തിനെതിരായ ദൂഷണത്തെയും ഉൾക്കൊള്ളാനാകുന്ന വിശാലമായ വിവർത്തനം പ്രധാനപാഠത്തിൽ നൽകി, കൂടുതൽ പരിമിതമായ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ ദോഷപ്പട്ടികയുടെ ബഹുവചനഘടന കഴിയുന്നത്ര നിലനിർത്തിയിരിക്കുന്നു. ‘എന്നിവ’ ഉപയോഗിച്ച് നീണ്ട പട്ടിക മലയാളത്തിൽ സ്വാഭാവികമായി ക്രിയയുമായി ബന്ധിപ്പിക്കുന്നു. അടിക്കുറിപ്പ് സൂചകം അതു വിശദീകരിക്കുന്ന ‘ദൂഷണങ്ങൾ’ എന്ന പദത്തിനുശേഷം വെച്ചിരിക്കുന്നു.
