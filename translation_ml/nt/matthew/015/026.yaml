id: MAT.15.26
reference: Matthew 15:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Οὐκ ἔστιν καλὸν λαβεῖν τὸν ἄρτον τῶν τέκνων καὶ βαλεῖν τοῖς κυναρίοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/026.yaml
  text: But he answered[a], “It is not right to take the children's bread and throw it to the little dogs.”
translation:
  language: ml
  text: 'എന്നാൽ അവൻ മറുപടി പറഞ്ഞു: “മക്കളുടെ അപ്പം എടുത്ത് ചെറിയ നായ്ക്കൾക്ക്[a] എറിഞ്ഞുകൊടുക്കുന്നത് ഉചിതമല്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “വീട്ടുനായ്ക്കൾ” അല്ലെങ്കിൽ “നായ്ക്കുട്ടികൾ”; ഗ്രീക്കിൽ ലഘുരൂപമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്. അതിനാൽ തെരുവുനായകളെക്കാൾ ചെറിയ നായകളെയോ വീട്ടിൽ വളർത്തുന്ന നായകളെയോ സൂചിപ്പിച്ചേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: മറുപടി പറഞ്ഞു
  rationale: പങ്കാളിക്രിയയും സമാപികാക്രിയയും ചേർന്ന ഈ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ പ്രതികരണസ്വഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: καλὸν
  choice: ഉചിതം
  rationale: ഇവിടെ പദം പൊതുവായ നന്മയെക്കാൾ യോജ്യതയെയോ ഔചിത്യത്തെയോ സൂചിപ്പിക്കുന്നു; ‘ഉചിതം’ ആ ആശയം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: λαβεῖν
  choice: എടുത്ത്
  rationale: അപ്പം കൈക്കലാക്കുകയോ അതിന്റെ സ്ഥാനത്തുനിന്ന് എടുക്കുകയോ ചെയ്യുന്ന ദൃശ്യാർഥം നിലനിർത്തുന്നു.
- source_word: ἄρτον
  choice: അപ്പം
  rationale: മൂലത്തിലെ ഭക്ഷണചിത്രം വ്യാഖ്യാനപരമായി പൊതുവൽക്കരിക്കാതെ നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: τέκνων
  choice: മക്കളുടെ
  rationale: τέκνα ലിംഗഭേദമില്ലാതെ കുട്ടികളെയോ മക്കളെയോ സൂചിപ്പിക്കുന്നു; ‘മക്കളുടെ’ എന്നത് ബന്ധവും കുടുംബസന്ദർഭവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: βαλεῖν
  choice: എറിഞ്ഞുകൊടുക്കുക
  rationale: βάλλωയുടെ ‘എറിയുക’ എന്ന സജീവ ദൃശ്യത്തെ നിലനിർത്തുകയും മലയാളത്തിൽ സ്വീകരിക്കുന്നവർക്കു നൽകുന്ന പ്രവൃത്തിയും വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: κυναρίοις
  choice: നായ്ക്കുട്ടികൾക്ക്
  rationale: κυνάριον എന്ന ലഘുരൂപത്തിന്റെ ചെറുനായ/വീട്ടുനായ എന്ന സൂചന ‘നായ്ക്കുട്ടികൾ’ സ്വാഭാവികമായി വഹിക്കുന്നു; തെരുവുനായകളെന്ന അർഥം നിർബന്ധിക്കുന്നില്ല.
theological_decisions:
- issue: മക്കളും നായ്ക്കുട്ടികളും ഉൾപ്പെടുന്ന രൂപകം വംശീയമോ ഭാവപരമോ ആയ അധികവ്യാഖ്യാനം ചേർക്കാതെ നിലനിർത്തൽ
  choice: ‘മക്കളുടെ അപ്പം’ എന്നും ‘നായ്ക്കുട്ടികൾ’ എന്നും രൂപകം നേരിട്ട് നിലനിർത്തി.
  alternative: ‘മക്കളുടെ അപ്പം എടുത്ത് വീട്ടുനായ്ക്കൾക്ക് എറിഞ്ഞുകൊടുക്കുന്നത് ഉചിതമല്ല.’
  rationale: ഈ വാക്യം തന്നെ രൂപകത്തിലെ ആളുകളെ തുറന്നു തിരിച്ചറിയിക്കുന്നില്ല. അതിനാൽ സന്ദർഭം സൃഷ്ടിക്കുന്ന ദൈവശാസ്ത്രപരമായ സംഘർഷവും യഥാർഥ അസ്പഷ്ടതയും മുഖ്യപാഠത്തിൽ പരിഹരിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ഉചിതമല്ല’ ഔചിത്യത്തിന്റെ ആശയം വ്യക്തമാക്കുന്നു; രൂപകത്തിന്റെ മൂർച്ച മയപ്പെടുത്താതിരിക്കാൻ ‘എറിഞ്ഞുകൊടുക്കുക’ ഉപയോഗിച്ചു.
