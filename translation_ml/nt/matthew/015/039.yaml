    reason: textual_variant
lexical_decisions:
- source_word: ἀπολύσας
  choice: പിരിച്ചയച്ചശേഷം
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പ് നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന ഭൂതകാല കൃദന്തത്തിന്റെ ക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ജനക്കൂട്ടത്തെ വിട്ടയച്ചതെന്ന സന്ദർഭാർഥവും നിലനിർത്തുന്നു.
- source_word: τοὺς ὄχλους
  choice: ജനക്കൂട്ടങ്ങളെ
  rationale: ബഹുവചനരൂപം നിലനിർത്തിക്കൊണ്ട് സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ പദപ്രയോഗം നൽകുന്നു.
- source_word: ἐνέβη εἰς τὸ πλοῖον
  choice: പടകിൽ കയറി
  rationale: പടകിൽ പ്രവേശിച്ച് യാത്ര തിരിക്കുന്ന പ്രവൃത്തിയെ മലയാളത്തിൽ സ്വാഭാവികവും മൂർത്തവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἦλθεν εἰς τὰ ὅρια
  choice: പ്രദേശത്ത് എത്തി
  rationale: ὅρια എന്ന ബഹുവചനം ഇവിടെ അതിർത്തിരേഖകളെ മാത്രം അല്ല, ഒരു ഭൂവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. യാത്രാവിവരണത്തിൽ ἦλθεν എന്നതിന്റെ ലക്ഷ്യസ്ഥാനത്തെത്തിയെന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: Μαγαδάν
  choice: മഗദാൻ
  rationale: നൽകിയിരിക്കുന്ന SBLGNT പാഠത്തിലെ സ്ഥലനാമം മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്യുന്നു; പാഠഭേദം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: വാക്യാവസാനത്തിലെ സ്ഥലനാമത്തിന്റെ പാഠരൂപം
  choice: മഗദാൻ
  alternative: മഗ്ദല
  rationale: ഇത് ദൈവശാസ്ത്രപരമായ വ്യാഖ്യാനപ്രശ്നമല്ല, പാഠഭേദമാണ്. നൽകിയിരിക്കുന്ന മൂലപാഠം Μαγαδάν എന്നു വായിക്കുന്നതിനാൽ മുഖ്യപാഠം അതിനെ പിന്തുടരുന്നു; മറ്റൊരു പ്രധാന പാഠരൂപം സുതാര്യതയ്ക്കായി അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ പ്രവൃത്തിക്രമവും സ്ഥലനാമത്തിലെ പാഠഭേദവും വ്യക്തമായി സംരക്ഷിച്ചിരിക്കുന്നു.
