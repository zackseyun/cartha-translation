id: MAT.15.4
reference: Matthew 15:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ γὰρ θεὸς ⸀εἶπεν· Τίμα τὸν πατέρα καὶ τὴν μητέρα, καί· Ὁ κακολογῶν πατέρα ἢ μητέρα θανάτῳ τελευτάτω·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/004.yaml
  text: For God said[a], ‘Honor your father and your mother,’ and, ‘Whoever speaks evil of father or mother must surely die.’
translation:
  language: ml
  text: 'കാരണം ദൈവം പറഞ്ഞിരിക്കുന്നു: “നിന്റെ പിതാവിനെയും മാതാവിനെയും ബഹുമാനിക്കുക,” എന്നും, “പിതാവിനെയോ മാതാവിനെയോ ദുഷിച്ചു പറയുന്നവൻ തീർച്ചയായും മരിക്കണം,” എന്നും.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പിതാവിനെയോ മാതാവിനെയോ ശപിക്കുന്നവൻ മരണശിക്ഷ ലഭിക്കണം.”
    reason: κακολογῶν-ന്റെ ‘ശപിക്കുക’ എന്ന ശക്തമായ അർഥസാധ്യതയും θανάτῳ τελευτάτω-യുടെ നിയമപരമായ മരണദണ്ഡസൂചനയും കാണിക്കുന്ന പരിഭാഷാവികൽപം.
lexical_decisions:
- source_word: ὁ γὰρ θεὸς
  choice: കാരണം ദൈവം
  rationale: γάρ യേശുവിന്റെ വാദത്തിന്റെ കാരണം അവതരിപ്പിക്കുന്നു; ‘കാരണം’ ആ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: εἶπεν
  choice: അരുളിച്ചെയ്തത്
  rationale: തിരുവെഴുത്തിലെ ദൈവവചനം ഉദ്ധരിക്കുന്ന സന്ദർഭത്തിന് യോജിച്ച മാന്യമായ പ്രയോഗം; ‘കല്പിച്ചു’ എന്ന അധികബലം ചേർക്കുന്നില്ല.
- source_word: Τίμα
  choice: ബഹുമാനിക്കുക
  rationale: τιμάω സൂചിപ്പിക്കുന്ന അർഹമായ ആദരവും കടമയുടെ ഗൗരവവും നിലനിർത്തുന്നു.
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: നിന്റെ അപ്പനെയും അമ്മയെയും
  rationale: ഉദ്ധരിക്കപ്പെടുന്ന കല്പനയിലെ രണ്ടാംപുരുഷ ഉടമസ്ഥത സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘അപ്പൻ, അമ്മ’ സാധാരണ വായനക്കാർക്ക് നേരിട്ടും സ്വാഭാവികവുമാണ്.
- source_word: Ὁ κακολογῶν
  choice: ശപിക്കുന്നവൻ
  rationale: κακολογέω ഇവിടെ മാതാപിതാക്കൾക്കെതിരെ ദുഷിച്ചു പറയുക, അധിക്ഷേപിക്കുക, ശപിക്കുക എന്നീ അർഥപരിധിയുള്ളതാണ്; നിയമോദ്ധരണിയുടെ പശ്ചാത്തലത്തിൽ ‘ശപിക്കുക’ സംക്ഷിപ്തവും ശക്തവുമായ തിരഞ്ഞെടുപ്പാണ്.
- source_word: πατέρα ἢ μητέρα
  choice: അപ്പനെയോ അമ്മയെയോ
  rationale: ἢ യുടെ വൈരുധ്യാത്മക ‘അല്ലെങ്കിൽ’ ബന്ധം ‘-യോ ... -യോ’ എന്ന സ്വാഭാവിക മലയാളഘടനയിൽ സംരക്ഷിക്കുന്നു.
- source_word: θανάτῳ τελευτάτω
  choice: മരണശിക്ഷ അനുഭവിക്കണം
  rationale: ഇത് മരണദണ്ഡം നിർദേശിക്കുന്ന ഗൗരവമുള്ള നിയമസൂത്രമാണെന്ന് വ്യക്തമായി അറിയിക്കുന്നു; ഗ്രീക്കിൽ വധനിർവഹണത്തിന്റെ കർത്താവ് നേരിട്ട് പറഞ്ഞിട്ടില്ലാത്തതിനാൽ ‘കൊല്ലപ്പെടണം’ ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: നിയമപരമായ മരണദണ്ഡസൂത്രത്തിന്റെ പരിഭാഷ
  choice: മരണശിക്ഷ അനുഭവിക്കണം
  alternative: നിശ്ചയമായും മരിക്കണം
  rationale: θανάτῳ τελευτάτω നിയമപരമായ മരണദണ്ഡസൂത്രമാണെന്ന് മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കുന്നു; അതേസമയം വധത്തിന്റെ മാനുഷിക കർത്താവിനെ ഗ്രീക്ക് നേരിട്ട് നിർദേശിക്കുന്നതിലധികം വ്യക്തമാക്കുന്നില്ല.
- issue: κακολογῶν എന്നതിന്റെ വ്യാപ്തി
  choice: ശപിക്കുന്നവൻ
  alternative: ദുഷിച്ചു പറയുന്നവൻ
  rationale: നിയമോദ്ധരണിയുടെ പശ്ചാത്തലവും പദത്തിന്റെ ശക്തിയും ‘ശപിക്കുന്നവൻ’ നന്നായി പകരുന്നു; വിശാലമായ പദാർത്ഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ദൈവവചനോദ്ധരണിക്ക് ‘അരുളിച്ചെയ്തത്’ ഉപയോഗിച്ചു; ‘ആണല്ലോ’ γάρ അവതരിപ്പിക്കുന്ന വിശദീകരണബന്ധം മലയാളത്തിൽ സ്വാഭാവികമാക്കുന്നു. ഉദ്ധരണികളുടെ വേർതിരിവും [a] അടിക്കുറിപ്പ് ചിഹ്നവും മുഖ്യപാഠത്തിൽ വ്യക്തമാണ്.
