    rationale: Greek καὶ τὸ περισσεῦον τῶν κλασμάτων ἦραν ἑπτὰ σπυρίδας πλήρεις means that they took up leftover fragments, amounting to seven full baskets. The collectors remain the implied subject of ἦραν.
