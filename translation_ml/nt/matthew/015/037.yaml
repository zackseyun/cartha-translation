id: MAT.15.37
reference: Matthew 15:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἔφαγον πάντες καὶ ἐχορτάσθησαν, καὶ ⸂τὸ περισσεῦον τῶν κλασμάτων ἦραν⸃ ἑπτὰ σπυρίδας πλήρεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/037.yaml
  text: And they all ate and were satisfied[a], and they picked up seven full baskets of the leftover pieces.
translation:
  language: ml
  text: എല്ലാവരും ഭക്ഷിച്ചു തൃപ്തരായി; ശേഷിച്ച കഷണങ്ങൾ ഏഴു കൊട്ടകൾ[a] നിറയെ അവർ ശേഖരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഏഴു വലിയ കൊട്ടകൾ നിറയെ.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദമായ സ്പ്യുരിസ് (σπυρίς), മറ്റു ഭക്ഷണവിതരണ വിവരണങ്ങളിൽ പറയുന്ന കൊട്ടകളെക്കാൾ വലിയ ഒരിനം കൊട്ടയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφαγον
  choice: ഭക്ഷിച്ചു
  rationale: ക്രിയയ്ക്ക് ഗ്രീക്കിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ല; അതിനാൽ ലളിതവും സ്വാഭാവികവുമായി ‘ഭക്ഷിച്ചു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: πάντες
  choice: എല്ലാവരും
  rationale: ജനക്കൂട്ടത്തിലെ സകലരെയും ഉൾക്കൊള്ളുന്ന സർവവ്യാപക അർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἐχορτάσθησαν
  choice: തൃപ്തരായി
  rationale: വയറുനിറയെ ഭക്ഷിച്ച് മതിയായ അവസ്ഥയിലെത്തി എന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: τὸ περισσεῦον τῶν κλασμάτων
  choice: ശേഷിച്ച കഷണങ്ങൾ
  rationale: ഭക്ഷണശേഷം ബാക്കിയായ പൊട്ടിയ ഭാഗങ്ങളെ സൂചിപ്പിക്കുന്ന പ്രയോഗം സംക്ഷിപ്തമായും വ്യക്തമായും പകർത്തുന്നു.
- source_word: ἦραν
  choice: ശേഖരിച്ചപ്പോൾ
  rationale: ഈ സന്ദർഭത്തിൽ αἴρω എന്നത് ശേഷിച്ച കഷണങ്ങൾ എടുത്തുകൂട്ടുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളവാക്യത്തിന്റെ സ്വാഭാവികതയ്ക്കായി കാലബന്ധമുള്ള ഘടന ഉപയോഗിച്ചു.
- source_word: ἑπτὰ σπυρίδας πλήρεις
  choice: ഏഴു കൊട്ടകൾ നിറഞ്ഞു
  rationale: എണ്ണവും കൊട്ടകൾ നിറഞ്ഞിരുന്നുവെന്ന ഫലവും വ്യക്തമായി നൽകുന്നു; σπυρίς സൂചിപ്പിക്കാവുന്ന വലുപ്പവ്യത്യാസം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
