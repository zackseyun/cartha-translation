translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിന്റെ അർഥക്രമം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ അസ്വാഭാവികമായ പദക്രമം ഒഴിവാക്കി.
