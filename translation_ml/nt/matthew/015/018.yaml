    issue: Unneeded emphatic/nominalized construction
    rationale: “അവയാണ് മനുഷ്യനെ അശുദ്ധനാക്കുന്നത്” is understandable, but κἀκεῖνα κοινοῖ is more directly and naturally represented by “അവ മനുഷ്യനെ അശുദ്ധനാക്കുന്നു.” This avoids adding copular emphasis and preserves the source’s finite verbal progression.
  revised_text: എന്നാൽ വായിൽനിന്ന് പുറപ്പെടുന്നവ ഹൃദയത്തിൽനിന്ന് വരുന്നു; അവ മനുഷ്യനെ അശുദ്ധനാക്കുന്നു.[a]
