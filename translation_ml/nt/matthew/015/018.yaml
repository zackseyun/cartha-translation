id: MAT.15.18
reference: Matthew 15:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τὰ δὲ ἐκπορευόμενα ἐκ τοῦ στόματος ἐκ τῆς καρδίας ἐξέρχεται, κἀκεῖνα κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/018.yaml
  text: But the things that come out of the mouth come from the heart[a], and those defile the man.
translation:
  language: ml
  text: എന്നാൽ വായിൽനിന്ന് പുറപ്പെടുന്നവ ഹൃദയത്തിൽനിന്ന് വരുന്നു; അവ മനുഷ്യനെ അശുദ്ധനാക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മനുഷ്യനെ മലിനനാക്കുന്നു.’ ഗ്രീക്കിൽ ‘മനുഷ്യനെ’ എന്നത് പൊതുവായി മനുഷ്യരെ പ്രതിനിധീകരിക്കുന്ന ഏകവചനപ്രയോഗമാണ്.
    reason: ‘അശുദ്ധനാക്കുന്നു’ എന്നതിന് ‘മലിനനാക്കുന്നു’ എന്ന പദവികൽപ്പം നൽകുകയും ἄνθρωπον എന്നതിന്റെ പ്രതിനിധാനപരമായ ഏകവചനം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
lexical_decisions:
- source_word: τὰ ... ἐκπορευόμενα
  choice: പുറപ്പെടുന്നവ
  rationale: നപുംസകലിംഗ ബഹുവചന കൃദന്തരൂപം വസ്തുവാചകമായി ഉപയോഗിച്ചിരിക്കുന്നു. ‘പുറപ്പെടുന്നവ’ എന്നത് ബഹുവചനവും പുറത്തേക്കുള്ള ചലനചിത്രവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἐκ τοῦ στόματος
  choice: വായിൽനിന്നു
  rationale: സംസാരത്തെ സൂചിപ്പിക്കുന്ന ശരീരാവയവത്തിന്റെ ദൃശ്യരൂപം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἐκ τῆς καρδίας
  choice: ഹൃദയത്തിൽനിന്നാണ്
  rationale: καρδία ഇവിടെ ചിന്തകളും ധാർമിക ഉദ്ദേശ്യങ്ങളും ഉൾപ്പെടുന്ന ആന്തരിക മനുഷ്യനെ സൂചിപ്പിക്കുന്നു. ‘ഹൃദയം’ ഈ ബൈബിൾപ്രയോഗത്തിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു; ‘ആണ്’ ഉറവിടത്തെ ഊന്നുന്നു.
- source_word: ἐξέρχεται
  choice: വരുന്നത്
  rationale: നപുംസകലിംഗ ബഹുവചന കർത്താവിനോടൊപ്പം ഏകവചന ക്രിയ വന്നിരിക്കുന്ന ഗ്രീക്ക് നിർമ്മിതി കൂട്ടമായ അർത്ഥം വഹിക്കുന്നു. മലയാളത്തിലെ ‘വരുന്നത്’ ഉറവിടബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: κἀκεῖνα
  choice: അവയാണ്
  rationale: ‘അവയും/അവ തന്നെയും’ എന്ന അന്വയാർഥത്തിൽ, മുമ്പ് പറഞ്ഞ വായിൽനിന്നു പുറപ്പെടുന്നവയിലേക്കുള്ള നിർദ്ദേശം വ്യക്തമായി നിലനിർത്തുന്നു; ‘ആണ്’ അവ തന്നെയാണ് അശുദ്ധിയുണ്ടാക്കുന്നതെന്ന ഊന്നൽ നൽകുന്നു.
- source_word: κοινοῖ
  choice: അശുദ്ധനാക്കുന്നത്
  rationale: ശുദ്ധി-അശുദ്ധി പശ്ചാത്തലത്തിൽ κοινόω ഒരാളെ അശുദ്ധനാക്കുക എന്നർത്ഥം നൽകുന്നു. മലയാളത്തിൽ ‘അശുദ്ധനാക്കുക’ ആ ആശയം നേരിട്ടും മനസ്സിലാകുന്ന രീതിയിലും അറിയിക്കുന്നു.
- source_word: τὸν ἄνθρωπον
  choice: മനുഷ്യനെ
  rationale: ഏകവചനത്തിലുള്ള ἄνθρωπος ഇവിടെ പ്രതിനിധാനപരവും പൊതുവുമായ പ്രയോഗമാണ്. ‘മനുഷ്യനെ’ അതിന്റെ ഏകവചനവും മാനവസാമാന്യ അർത്ഥവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ധാർമിക അശുദ്ധിയുടെ ആന്തരിക ഉറവിടം
  choice: അശുദ്ധിയുണ്ടാക്കുന്നത് ഹൃദയത്തിൽനിന്ന് വായിലൂടെ പുറപ്പെടുന്നതാണെന്ന് വിവർത്തനം ചെയ്തു.
  alternative: വാക്കുകൾ മൂലമുള്ള ആചാരപരമായ അശുദ്ധിയിലേക്കു മാത്രം അർത്ഥം ചുരുക്കുക.
  rationale: അടുത്ത സന്ദർഭം പുറത്തുനിന്നു പ്രവേശിക്കുന്ന ഭക്ഷണത്തെയും ഉള്ളിൽനിന്നു പുറപ്പെടുന്നതിനെയും വിപരീതമായി നിർത്തുന്നു. ‘ഹൃദയം’, ‘അശുദ്ധനാക്കുന്നു’ എന്നീ പദങ്ങൾ ഈ സംഘർഷം നിലനിർത്തുന്നു; എന്നാൽ വാക്യം പറയുന്നതിലധികം വിശദീകരണം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
- issue: പ്രതിനിധാനപരമായ ഏകവചന ἄνθρωπον
  choice: മനുഷ്യനെ
  alternative: പുരുഷനെ
  rationale: സ്രോതസ്സിലെ ἄνθρωπος വ്യാകരണപരമായി ഏകവചനമാണെങ്കിലും ഇവിടെ പുരുഷലിംഗത്തെ മാത്രം സൂചിപ്പിക്കുന്നില്ല; മനുഷ്യനെ പൊതുവായി പ്രതിനിധീകരിക്കുന്നു. ‘മനുഷ്യനെ’ ഏകവചനവും സർവമാനവ വ്യാപ്തിയും ഒരുമിച്ച് നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘വായിൽനിന്ന്—ഹൃദയത്തിൽനിന്ന്’ എന്ന സമാന്തര ദൃശ്യരൂപവും വാക്യത്തിന്റെ കാരണ-ഫലക്രമവും സംരക്ഷിച്ചു.
