id: MAT.15.2
reference: Matthew 15:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Διὰ τί οἱ μαθηταί σου παραβαίνουσιν τὴν παράδοσιν τῶν πρεσβυτέρων; οὐ γὰρ νίπτονται τὰς χεῖρας ⸀αὐτῶν ὅταν ἄρτον ἐσθίωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/002.yaml
  text: Why do your disciples break the tradition of the elders? For they do not wash their hands when they eat bread[a][b].
translation:
  language: ml
  text: “നിന്റെ ശിഷ്യന്മാർ മൂപ്പന്മാരുടെ പാരമ്പര്യം ലംഘിക്കുന്നത് എന്തുകൊണ്ട്? കാരണം, അപ്പം[b] കഴിക്കുമ്പോൾ അവർ കൈകൾ[a] കഴുകുന്നില്ല.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇത് വെറും സാധാരണ ശുചിത്വത്തെക്കുറിച്ചല്ല; മൂപ്പന്മാരുടെ പാരമ്പര്യം നിർദേശിച്ചിരുന്ന കൈകഴുകൽ ആചാരത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
  - marker: b
    text: അഥവാ, “ഭക്ഷണം കഴിക്കുമ്പോൾ.” ഇവിടെ “അപ്പം” എന്ന ഗ്രീക്ക് പദം ചിലപ്പോൾ ഭക്ഷണത്തെയോ ഊണിനെയോ പൊതുവായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τί
  choice: എന്തുകൊണ്ട്
  rationale: കാരണം ചോദിക്കുന്ന പ്രയോഗത്തിന് സ്വാഭാവികമായ ആധുനിക മലയാള തുല്യം.
- source_word: οἱ μαθηταί σου
  choice: നിന്റെ ശിഷ്യന്മാർ
  rationale: രണ്ടാംപുരുഷ ഏകവചന ഉടമസ്ഥതയും ബഹുവചന കർത്താവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: παραβαίνουσιν
  choice: ലംഘിക്കുന്നത്
  rationale: അധികാരബോധമുള്ള പാരമ്പര്യത്തെ അതിക്രമിക്കുക അഥവാ ലംഘിക്കുക എന്ന ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: τὴν παράδοσιν
  choice: പാരമ്പര്യം
  rationale: കൈമാറിക്കിട്ടിയ ആചാര-പഠനസംഹിത എന്ന അർഥം നിലനിർത്തുന്നു; ‘പതിവ്’ എന്നതിനെക്കാൾ അതിന്റെ അധികാരബലം വ്യക്തമാക്കുന്നു.
- source_word: τῶν πρεσβυτέρων
  choice: പൂർവികരുടെ
  rationale: ഇവിടെ വെറും പ്രായമായ ആളുകളെയല്ല, പാരമ്പര്യം കൈമാറിയ മുൻകാല യഹൂദ അധികാരികളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘പൂർവികർ’ സാധാരണ വായനക്കാർക്ക് ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമാണ്.
- source_word: οὐ γὰρ νίπτονται τὰς χεῖρας αὐτῶν
  choice: അവർ കൈ കഴുകുന്നില്ലല്ലോ
  rationale: γάρ ഇവിടെ മുൻചോദ്യത്തിനുള്ള തെളിവോ വിശദീകരണമോ നൽകുന്നു; മലയാളത്തിലെ ‘ഇല്ലല്ലോ’ ആ ബന്ധവും ചോദ്യം ഉന്നയിക്കുന്നവരുടെ ആക്ഷേപഭാവവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὅταν
  choice: അപ്പോൾ / -ുമ്പോൾ
  rationale: പതിവായി സംഭവിക്കുന്ന സാഹചര്യത്തെ മലയാളത്തിലെ ‘-ുമ്പോൾ’ രൂപം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἄρτον
  choice: അപ്പം
  rationale: ഗ്രീക്കിലെ അക്ഷരാർഥം നിലനിർത്തുന്നു; വിശാലമായ ‘ഭക്ഷണം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἐσθίωσιν
  choice: ഭക്ഷിക്കുമ്പോൾ
  rationale: ὅταν സഹിതമുള്ള പൊതുവായ ആവർത്തനസാഹചര്യം മലയാളത്തിൽ ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: കൈ കഴുകലിന്റെ സ്വഭാവം
  choice: മുഖ്യവാചകത്തിൽ കൈ കഴുകൽ എന്നു മാത്രം നൽകി, തർക്കം പൂർവികരുടെ പാരമ്പര്യത്തെക്കുറിച്ചാണെന്ന് നിലനിർത്തി.
  alternative: ‘ആചാരപ്രകാരം കൈ ശുദ്ധീകരിക്കുക’ എന്ന് മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കുക; അല്ലെങ്കിൽ സാധാരണ ശുചിത്വമായി വ്യാഖ്യാനിക്കുക.
  rationale: വാക്യം തന്നെ ഇതിനെ പൂർവികരുടെ പാരമ്പര്യവുമായി ബന്ധിപ്പിക്കുന്നുവെങ്കിലും, ആചാരശുദ്ധിയുടെയും സാധാരണ ശുചിത്വത്തിന്റെയും വിശദീകരണം മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല. സാംസ്കാരിക പശ്ചാത്തലം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: ἄρτον എന്നതിന്റെ വ്യാപ്തി
  choice: മുഖ്യവാചകത്തിൽ ‘അപ്പം’ എന്ന അക്ഷരാർഥം നിലനിർത്തി.
  alternative: ‘ഭക്ഷണം’ അല്ലെങ്കിൽ ‘ആഹാരം കഴിക്കുമ്പോൾ’ എന്നു പരിഭാഷപ്പെടുത്തുക.
  rationale: മൂലപദത്തിന്റെ പ്രത്യേകത സംരക്ഷിക്കുമ്പോഴും, അത് പൊതുവായി ഭക്ഷണത്തെയോ ഊണിനെയോ സൂചിപ്പിക്കാവുന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ചോദ്യം-ആക്ഷേപ ശൈലി. ‘പാരമ്പര്യം’, ‘ലംഘിക്കുക’ എന്നീ പദങ്ങൾ വാചകത്തിന്റെ അധികാരപരവും തർക്കാത്മകവുമായ ഭാവം നിലനിർത്തുന്നു. ‘ഇല്ലല്ലോ’ γάρ നൽകുന്ന വിശദീകരണബന്ധത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
