    issue: “പൂർവികരുടെ” for τῶν πρεσβυτέρων
    rationale: The Greek refers to ‘the elders,’ not generically to ancestors. Although the phrase concerns inherited tradition, ‘ancestors’ alters the referent and weakens the association with recognized authorities.
  - severity: low
    issue: Singular “കൈ” for plural τὰς χεῖρας
    rationale: Malayalam can use a singular generic expression, but “കൈകൾ” preserves the explicit plural of the source while remaining idiomatic.
  - severity: low
    issue: Footnote anchors occur only at the end of the sentence
    rationale: Placing the cultural note at ‘കൈകൾ’ and the lexical note at ‘അപ്പം’ makes each note’s referent unambiguous.
