id: MAT.15.12
reference: Matthew 15:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τότε προσελθόντες οἱ ⸀μαθηταὶ ⸀λέγουσιν αὐτῷ· Οἶδας ὅτι οἱ Φαρισαῖοι ἀκούσαντες τὸν λόγον ἐσκανδαλίσθησαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/012.yaml
  text: Then the disciples came and said to him[b][a], “Do you know that the Pharisees were offended when they heard this word?”
translation:
  language: ml
  text: 'അപ്പോൾ ശിഷ്യന്മാർ അടുത്തുവന്ന് അവനോടു പറഞ്ഞു: “പരീശന്മാർ ആ വാക്കു കേട്ടപ്പോൾ ഇടർച്ചപ്പെട്ടു[a] എന്ന് നിനക്കറിയാമോ?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അതിൽ അസ്വസ്ഥരായി” അല്ലെങ്കിൽ “നീരസപ്പെട്ടു”; കൂടുതൽ അക്ഷരാർഥത്തിൽ, “ഇടർച്ചപ്പെട്ടു.”
    reason: lexical_alternative
  - marker: b
    text: “ആ വാക്ക്” എന്നത് യേശു തൊട്ടുമുമ്പ് പറഞ്ഞ പ്രസ്താവനയെ സൂചിപ്പിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: Τότε
  choice: അപ്പോൾ
  rationale: സംഭവക്രമത്തിലെ അടുത്ത ഘട്ടത്തെ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്ന കാലസൂചകമായി ഉപയോഗിച്ചു.
- source_word: προσελθόντες
  choice: അടുത്തുവന്ന്
  rationale: προσέρχομαι എന്ന ക്രിയയുടെ സമീപിച്ചുവരുന്ന ഭാവം നിലനിർത്തുകയും തുടർന്നുള്ള മുഖ്യക്രിയയോടു സ്വാഭാവികമായി ചേരുകയും ചെയ്യുന്നു.
- source_word: οἱ μαθηταὶ
  choice: ശിഷ്യന്മാർ
  rationale: ഗ്രീക്കിൽ ഉടമസ്ഥസൂചകമില്ലാത്തതിനാൽ ‘അവന്റെ ശിഷ്യന്മാർ’ എന്നു വികസിപ്പിക്കാതെ നിർദിഷ്ട കൂട്ടത്തെ സൂചിപ്പിച്ചു.
- source_word: λέγουσιν αὐτῷ
  choice: അവനോടു പറഞ്ഞു
  rationale: ചരിത്രവർത്തമാനത്തെ മലയാള ആഖ്യാനത്തിൽ സ്വാഭാവികമായ ഭൂതകാലമായി അവതരിപ്പിച്ചു.
- source_word: Οἶδας
  choice: നിനക്കറിയാമോ
  rationale: നേരിട്ടുള്ള ചോദ്യത്തിന്റെ അർഥവും സ്വാഭാവിക മലയാള പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: οἱ Φαρισαῖοι
  choice: പരീശന്മാർ
  rationale: മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ പരിചിതമായ സമൂഹനാമം ഉപയോഗിച്ചു.
- source_word: ἀκούσαντες τὸν λόγον
  choice: ആ വാക്കു കേട്ടപ്പോൾ
  rationale: λόγος എന്ന പദത്തിന് ഔപചാരികമായി അടുത്ത ‘വാക്ക്’ ഉപയോഗിച്ചു; ‘ആ’ മുൻപുള്ള യേശുവിന്റെ പ്രസ്താവനയിലേക്കുള്ള സന്ദർഭസൂചന വ്യക്തമാക്കുന്നു.
- source_word: ἐσκανδαλίσθησαν
  choice: ഇടറിപ്പോയി
  rationale: സ്കാൻഡലിസോമൈ എന്ന പദത്തിന്റെ രൂപകാത്മകമായ ‘ഇടറുക’ എന്ന അടിസ്ഥാനചിത്രം സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ ‘മനസ്സിടറി/അപമാനിതരായി’ എന്ന പ്രതികരണവും ഉൾക്കൊള്ളാവുന്ന വിധത്തിൽ യഥാർഥ ആശയവ്യാപ്തി തുറന്നുവയ്ക്കുന്നു.
theological_decisions:
- issue: ഉപദേശത്തോടുള്ള പരീശന്മാരുടെ പ്രതികരണത്തിൽ σκανδαλίζω എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ഇടറിപ്പോയി
  alternative: മനസ്സിലേറ്റു; നീരസപ്പെട്ടു
  rationale: പദത്തെ വെറും വികാരപരമായ അപമാനമായി പരിമിതപ്പെടുത്താതെ അതിലെ ‘ഇടർച്ച’ എന്ന രൂപകവും സന്ദർഭത്തിലെ എതിർപ്രതികരണവും നിലനിർത്തുന്നു; രക്ഷയോ വിശ്വാസത്യാഗമോ സംബന്ധിച്ച അധിക നിഗമനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ പങ്കാളിക്രിയാസംരചന ‘അടുത്തുവന്ന് ... പറഞ്ഞു’ എന്ന സ്വാഭാവിക മലയാളക്രമത്തിൽ നൽകി. അടിക്കുറിപ്പു ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട പദത്തിനും വാക്യത്തിനും പിന്നാലെ ചേർത്തിരിക്കുന്നു.
