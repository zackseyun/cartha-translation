id: MAT.15.11
reference: Matthew 15:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐ τὸ εἰσερχόμενον εἰς τὸ στόμα κοινοῖ τὸν ἄνθρωπον, ἀλλὰ τὸ ἐκπορευόμενον ἐκ τοῦ στόματος τοῦτο κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/011.yaml
  text: It is not what enters into the mouth that defiles the man[b][a], but what comes out of the mouth—this defiles the man.
translation:
  language: ml
  text: വായിലേക്കു ചെല്ലുന്നതല്ല മനുഷ്യനെ അശുദ്ധനാക്കുന്നത്[a][b]; വായിൽനിന്നു പുറത്തുവരുന്നതാണ് മനുഷ്യനെ അശുദ്ധനാക്കുന്നത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അശുദ്ധനാക്കുന്നു’ എന്നതിന് ‘മലിനനാക്കുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കുപദം ശുദ്ധി-അശുദ്ധി സംബന്ധമായ നിലയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘മനുഷ്യനെ’ എന്ന ഏകവചനം ഇവിടെ ഏതൊരു മനുഷ്യനെയും പൊതുവായി പ്രതിനിധീകരിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: κοινοῖ
  choice: അശുദ്ധനാക്കുന്നു
  rationale: ശുദ്ധി-അശുദ്ധി പശ്ചാത്തലത്തിൽ ഒരാളെ അശുദ്ധനായി കണക്കാക്കപ്പെടുന്ന നിലയിലാക്കുക എന്ന അർഥം വ്യക്തമാക്കുന്നു; വെറും അഴുക്കാക്കുക എന്ന ശാരീരിക അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: τὸ εἰσερχόμενον εἰς τὸ στόμα
  choice: വായിലേക്കു ചെല്ലുന്നത്
  rationale: നാമവാചകമായി പ്രവർത്തിക്കുന്ന വർത്തമാനകൃ ദന്തരൂപത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുകയും εἰς സൂചിപ്പിക്കുന്ന അകത്തേക്കുള്ള ദിശ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: τὸ ἐκπορευόμενον ἐκ τοῦ στόματος
  choice: വായിൽനിന്നു പുറത്തുവരുന്നത്
  rationale: ἐκπορευόμενον, ἐκ എന്നിവയിലെ പുറത്തേക്കുള്ള ചലനം വ്യക്തവും സ്വാഭാവികവുമായി പകരുന്നു.
- source_word: ἄνθρωπον
  choice: മനുഷ്യനെ
  rationale: ഗ്രീക്കിലെ ഏകവചന പ്രതിനിധിപദത്തിന്റെ മനുഷ്യനെ പൊതുവായി സൂചിപ്പിക്കുന്ന ബലം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: τοῦτο
  choice: ആണ്
  rationale: രണ്ടാം ഘടകത്തിന്മേലുള്ള ഊന്നൽ മലയാളത്തിലെ ‘ആണ്’ എന്ന കേന്ദ്രീകരണഘടനയിലൂടെ നിലനിർത്തുന്നു; ആവർത്തിച്ചുള്ള ‘ഇതാണ്’ ഒഴിവാക്കി സ്വാഭാവികത കാക്കുന്നു.
- source_word: οὐ ... ἀλλὰ
  choice: അല്ല ... ആണ്
  rationale: ഗ്രീക്കിലെ വ്യക്തമായ നിഷേധ-വൈരുധ്യഘടന മലയാളത്തിൽ നേരിട്ടും സ്വാഭാവികമായും പകരുന്നു.
theological_decisions:
- issue: κοινόω എന്ന പദത്തിലെ ശുദ്ധി-അശുദ്ധി ഭാഷ
  choice: ‘അശുദ്ധനാക്കുന്നു’ എന്നു പരിഭാഷപ്പെടുത്തി ആചാരപരവും ധാർമികവുമായ അശുദ്ധിയുടെ അർഥസാധ്യത നിലനിർത്തുന്നു.
  alternative: ‘മലിനനാക്കുന്നു’
  rationale: ‘അശുദ്ധനാക്കുന്നു’ എന്നത് ഈ ഭാഗത്തിലെ ശുദ്ധിനിയമ പശ്ചാത്തലവുമായി നേരിട്ട് ബന്ധപ്പെടുന്നു; അതേസമയം ആശയം ശാരീരിക മലിനതയായി മാത്രം ചുരുക്കുന്നില്ല.
- issue: ἄνθρωπον എന്ന ഏകവചന പ്രതിനിധിപദം
  choice: ‘മനുഷ്യനെ’ എന്നു നൽകി ഏതു മനുഷ്യനെയും പൊതുവായി സൂചിപ്പിക്കുന്ന ബലം നിലനിർത്തുന്നു.
  alternative: ‘പുരുഷനെ’
  rationale: ഇവിടെ ἄνθρωπος പുരുഷലിംഗത്തിലുള്ള ഒരാളെ മാത്രം സൂചിപ്പിക്കുന്നതല്ല; മനുഷ്യനെ പൊതുവായി പ്രതിനിധീകരിക്കുന്നു. ‘പുരുഷനെ’ എന്നത് അർഥം അനാവശ്യമായി പരിമിതപ്പെടുത്തും.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ ആവർത്തനവും ശക്തമായ വൈരുധ്യവും നിലനിർത്തിയിട്ടുണ്ട്; ‘അശുദ്ധനാക്കുന്നു’ ശുദ്ധി-അശുദ്ധി പശ്ചാത്തലം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ പകരുന്നു.
