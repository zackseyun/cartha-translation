id: MAT.15.9
reference: Matthew 15:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μάτην δὲ σέβονταί με, διδάσκοντες διδασκαλίας ἐντάλματα ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/009.yaml
  text: But they worship me in vain[b][a], teaching as doctrines the commandments of men.
translation:
  language: ml
  text: എന്നാൽ അവർ എന്നെ വ്യർഥമായി ആരാധിക്കുന്നു; മനുഷ്യരുടെ കല്പനകളെ ഉപദേശങ്ങളായി പഠിപ്പിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “മനുഷ്യകല്പനകളെ ഉപദേശങ്ങളായി പഠിപ്പിക്കുന്നു.”'
    reason: ഗ്രീക്കിലെ സംക്ഷിപ്ത പദബന്ധത്തിന്റെ സ്വാഭാവികമായ മറ്റൊരു അവതരണം.
lexical_decisions:
- source_word: μάτην
  choice: വ്യർഥമായി
  rationale: ‘ഫലമില്ലാതെ/നിഷ്ഫലമായി’ എന്ന അർഥം നൽകുകയും പ്രവാചകീയ ശാസനയുടെ ഗൗരവം നിലനിർത്തുകയും ചെയ്യുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: സന്ദർഭത്തിലെ നേരിയ വൈരുധ്യവും ശാസനാഭാവവും പ്രകടമാക്കുന്നു.
- source_word: σέβονταί με
  choice: അവർ എന്നെ ആരാധിക്കുന്നു
  rationale: ദൈവത്തോടുള്ള ഭക്തിയെയും ആരാധനയെയും സൂചിപ്പിക്കുന്ന σέβομαι എന്ന ക്രിയയും അതിന്റെ നേരിട്ടുള്ള കർമമായ με-യും സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: διδάσκοντες
  choice: പഠിപ്പിക്കുന്നു
  rationale: വർത്തമാന കൃദന്തരൂപം ആരാധന വ്യർഥമാകുന്ന രീതിയോ അനുബന്ധ സാഹചര്യവുമോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സമാന്തര ക്രിയയായി നൽകുന്നത് സ്വാഭാവികമാണ്.
- source_word: διδασκαλίας
  choice: ഉപദേശങ്ങളായി
  rationale: ἐντάλματα എന്നതുമായുള്ള സംക്ഷിപ്ത ബന്ധം വ്യക്തമാക്കി, മനുഷ്യകല്പനകൾ ആധികാരിക ഉപദേശങ്ങളെന്ന നിലയിൽ പഠിപ്പിക്കപ്പെടുന്നു എന്ന ആശയം പ്രകടമാക്കുന്നു.
- source_word: ἐντάλματα
  choice: കല്പനകളെ
  rationale: മതപരമായ ഔപചാരികതയുള്ള നിർദേശങ്ങളെയോ ആജ്ഞകളെയോ സൂചിപ്പിക്കുന്ന പദം.
- source_word: ἀνθρώπων
  choice: മനുഷ്യരുടെ
  rationale: ഇത് പുരുഷന്മാരെ മാത്രം സൂചിപ്പിക്കുന്നതല്ല; ദൈവിക ഉത്ഭവത്തോടു വിപരീതമായി മനുഷ്യോത്ഭവം സൂചിപ്പിക്കുന്ന പൊതുവായ പദമാണ്.
theological_decisions:
- issue: διδασκαλίας ἐντάλματα ἀνθρώπων എന്ന സംക്ഷിപ്ത പദബന്ധത്തിന്റെ അവതരണം
  choice: മനുഷ്യരുടെ കല്പനകളെ ഉപദേശങ്ങളായി പഠിപ്പിക്കുന്നു
  alternative: മനുഷ്യകല്പനകളെ ഉപദേശങ്ങളായി പഠിപ്പിക്കുന്നു
  rationale: മനുഷ്യർ നൽകിയ കല്പനകൾ ഉപദേശങ്ങളെന്ന അധികാരത്തോടെ പഠിപ്പിക്കപ്പെടുന്നു എന്ന ഗ്രീക്ക് വാക്യഘടനയുടെ സാധ്യത വ്യക്തമാക്കുന്നു; അതേസമയം മനുഷ്യോത്ഭവവും ദൈവിക ഉത്ഭവവും തമ്മിലുള്ള സംഘർഷം നിലനിർത്തുന്നു.
- issue: ἀνθρώπων എന്നതിന്റെ പൊതുവായ മനുഷ്യസൂചന
  choice: മനുഷ്യരുടെ
  alternative: മനുഷ്യകല്പനകളെ
  rationale: ഗ്രീക്കിലെ പദം ലിംഗനിർദ്ദിഷ്ടമല്ല; അതിനാൽ ആധുനിക മലയാളത്തിൽ കൃത്യവും സ്വാഭാവികവുമായ പൊതുവായ മനുഷ്യസൂചന ഉപയോഗിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ തിരുവെഴുത്തുശൈലി. ‘വ്യർഥമായി’, ‘ആരാധിക്കുന്നു’, ‘കല്പനകൾ’, ‘ഉപദേശങ്ങൾ’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും മൂലത്തിന്റെ മതപരമായ ഭാവം നിലനിർത്തുന്നതുമാണ്.
