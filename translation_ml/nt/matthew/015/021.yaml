id: MAT.15.21
reference: Matthew 15:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἐξελθὼν ἐκεῖθεν ὁ Ἰησοῦς ἀνεχώρησεν εἰς τὰ μέρη Τύρου καὶ Σιδῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/021.yaml
  text: And Jesus went out from there and withdrew to the region of Tyre and Sidon[a].
translation:
  language: ml
  text: യേശു അവിടെനിന്ന് പുറപ്പെട്ട് സോരിന്റെയും സീദോന്റെയും പ്രദേശത്തേക്ക് പിൻവാങ്ങി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “സോരിന്റെയും സീദോന്റെയും പ്രദേശത്തേക്ക് പോയി.” ഗ്രീക്ക് ക്രിയയെ കൂടുതൽ നിഷ്പക്ഷമായി ഇങ്ങനെ പരിഭാഷപ്പെടുത്താം; എന്നാൽ മത്തായിയിൽ ഈ ക്രിയയുടെ ആവർത്തിച്ചുള്ള പ്രയോഗം ‘പിൻവാങ്ങി’ എന്ന അർത്ഥസൂചനയെ പിന്തുണയ്ക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: '[പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല]'
  rationale: ഗ്രീക്കിലെ ലളിതമായ ആഖ്യാനബന്ധകമാണ്. മലയാളത്തിൽ വാക്യാരംഭത്തിൽ ‘പിന്നെ’ അല്ലെങ്കിൽ ‘അപ്പോൾ’ ചേർത്താൽ മൂലത്തിൽ ഇല്ലാത്ത കാലക്രമമോ ഊന്നലോ തോന്നാം; അതിനാൽ സ്വാഭാവികമായ ആഖ്യാനപ്രവാഹത്തിൽ പ്രത്യേകം പദമായി നൽകാതെ ബന്ധം നിലനിർത്തി.
- source_word: ἐξελθὼν
  choice: പുറപ്പെട്ട്
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള സഞ്ചാരത്തെ സൂചിപ്പിക്കുന്ന aorist participle. ‘പുറത്തിറങ്ങി’ എന്നതിനെക്കാൾ മലയാളത്തിൽ സ്ഥലത്തുനിന്നുള്ള യാത്ര സ്വാഭാവികമായി അറിയിക്കുകയും ഉദ്ദേശ്യം അധികമായി വ്യാഖ്യാനിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐκεῖθεν
  choice: അവിടെനിന്ന്
  rationale: മുൻപ് പരാമർശിച്ച സ്ഥലത്തുനിന്നുള്ള പുറപ്പെടൽ നേരായും സ്വാഭാവികമായും സൂചിപ്പിക്കുന്നു.
- source_word: ἀνεχώρησεν
  choice: പിൻവാങ്ങിപ്പോയി
  rationale: മത്തായിയിൽ ആവർത്തിച്ചു കാണുന്ന ‘ഒഴിഞ്ഞുമാറുക/പിൻവാങ്ങുക’ എന്ന സൂക്ഷ്മഭാവം നിലനിർത്തുന്നു. ‘പോയി’ എന്നതിലുപരി അർത്ഥസൂചന നൽകുമ്പോഴും, ഭയന്ന് ‘പലായനം ചെയ്തു’ എന്ന അതിശക്തമായ ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: εἰς τὰ μέρη
  choice: പ്രദേശത്തേക്ക്
  rationale: നഗരങ്ങളിലേക്കു തന്നെയല്ല, അവയുമായി ബന്ധപ്പെട്ട പൊതുഭൂവിഭാഗത്തിലേക്കുള്ള സഞ്ചാരമാണ് μέρη സൂചിപ്പിക്കുന്നത്. ഏകവചനമായ ‘പ്രദേശം’ മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: Τύρου καὶ Σιδῶνος
  choice: സോരിന്റെയും സീദോന്റെയും
  rationale: കേരളത്തിലെ ബൈബിൾ വായനയിൽ പരിചിതമായ ആധുനിക മലയാള സ്ഥലനാമരൂപങ്ങൾ ഉപയോഗിച്ചു; രണ്ടും ‘പ്രദേശം’ എന്ന പദത്തെ വിശേഷിപ്പിക്കുന്ന ജനിറ്റീവ് രൂപങ്ങളാണ്.
theological_decisions:
- issue: ജനതകളുമായി ബന്ധപ്പെട്ട പ്രദേശത്തേക്കുള്ള യേശുവിന്റെ സഞ്ചാരത്തിന്റെ ആഖ്യാനസൂക്ഷ്മത
  choice: ἀνεχώρησεν എന്നത് ‘പിൻവാങ്ങിപ്പോയി’ എന്നു പരിഭാഷപ്പെടുത്തി; അതിന്റെ കാരണം വ്യക്തമാക്കിയില്ല.
  alternative: ‘പോയി’ അല്ലെങ്കിൽ ‘യാത്രയായി’ എന്ന കൂടുതൽ നിഷ്പക്ഷമായ പരിഭാഷ; അതല്ലെങ്കിൽ ‘പലായനം ചെയ്തു’ എന്ന ശക്തമായ പരിഭാഷ.
  rationale: ക്രിയയ്ക്ക് തന്ത്രപരമായി ഒഴിഞ്ഞുമാറുന്ന സൂചന ഉണ്ടാകാം, പ്രത്യേകിച്ച് മത്തായിയുടെ പ്രയോഗത്തിൽ. എന്നാൽ യേശുവിന്റെ ഉദ്ദേശ്യമോ മാനസികാവസ്ഥയോ വാക്യം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ സൂക്ഷ്മഭാവം സംരക്ഷിക്കുമ്പോഴും ദൈവശാസ്ത്രപരമായ പ്രേരണ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പിൻവാങ്ങിപ്പോയി’ എന്ന രൂപം മൂലത്തിലെ സൂക്ഷ്മത സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നൽകുന്നു. ‘സോർ/സീദോൻ’ എന്നീ രൂപങ്ങൾക്കുപകരം മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ വ്യാപകമായി പരിചിതമായ ‘സോർ/സീദോൻ’ കുടുംബത്തിലെ ‘സോരിന്റെയും സീദോന്റെയും’ വിഭക്തിരൂപങ്ങൾ തിരഞ്ഞെടുത്തു.
