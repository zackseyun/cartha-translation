  text: And after instructing the crowd to recline on the ground,[a]
translation:
  language: ml
  text: ജനക്കൂട്ടത്തോടു നിലത്ത് ഇരിക്കാൻ നിർദേശിച്ചശേഷം, [a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിലത്ത് ചാരിയിരിക്കാൻ.” ഗ്രീക്ക് ക്രിയ ഭക്ഷണം കഴിക്കാനായി സ്ഥാനം സ്വീകരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; പലപ്പോഴും അതിൽ ചാരിയിരിക്കുന്ന ഭാവവും ഉൾപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: അവൻ
  rationale: ഈ വാക്യം അടുത്ത വാക്യത്തിലെ മുഖ്യക്രിയയോട് ചേർന്നുനിൽക്കുന്ന ഒരു പങ്കുപദപ്രയോഗമാണ്. മലയാളത്തിൽ സ്വാഭാവികമായ പൂർണ്ണവാക്യമായി അവതരിപ്പിക്കുമ്പോൾ സന്ദർഭത്തിൽ വ്യക്തമായ കർത്താവിനെ ‘അവൻ’ എന്നു രേഖപ്പെടുത്തി; καί-യുടെ തുടർച്ച വാക്യക്രമത്തിലൂടെ പ്രകടമാകുന്നു.
- source_word: παραγγείλας
  choice: നിർദേശിച്ചു
  rationale: അധികാരത്തോടെയുള്ള നിർദേശം എന്ന ഭാവം നിലനിർത്തുകയും ‘കല്പിച്ചു’ എന്നതിനെക്കാൾ സാധാരണ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി കേൾക്കുകയും ചെയ്യുന്നു.
- source_word: τῷ ὄχλῳ
  choice: ജനക്കൂട്ടത്തോട്
  rationale: ഏകവചന ദത്തിവാചകമായ ‘ജനക്കൂട്ടത്തിന്/ജനക്കൂട്ടത്തോട്’ എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀναπεσεῖν
  choice: ഭക്ഷണത്തിനായി ഇരിക്കാൻ
  rationale: ഭക്ഷണം കഴിക്കാനായി സ്ഥാനം സ്വീകരിക്കുക, പലപ്പോഴും ചാരിക്കിടക്കുക, എന്ന സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു. മലയാളത്തിൽ ‘ചാരിക്കിടക്കുക’ മാത്രം ഉപയോഗിച്ചാൽ അസ്വാഭാവികമോ തെറ്റിദ്ധരിപ്പിക്കുന്നതോ ആയേക്കുന്നതിനാൽ പ്രധാനവാചകത്തിൽ സ്വാഭാവികമായ ‘ഇരിക്കാൻ’ നൽകി സൂക്ഷ്മത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: ἐπὶ τὴν γῆν
  choice: നിലത്ത്
  rationale: ഇവിടെ γῆ ഭൂഗോളം എന്നല്ല, ആളുകൾ ഇരിക്കുന്ന നിലത്തിന്റെ ഉപരിതലം എന്ന അർഥത്തിലാണ്; ‘നിലത്ത്’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും പൊതുവായ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ഗ്രീക്ക് വാക്യം അടുത്ത വാക്യത്തിലേക്കു നീളുന്ന പങ്കുപദഘടനയായതിനാൽ ഈ വാക്യം മലയാളത്തിൽ സ്വാഭാവികമായ പൂർണ്ണവാക്യമായി നൽകി. ഭക്ഷണസന്ദർഭം ‘ഭക്ഷണത്തിനായി’ എന്ന പ്രയോഗത്തിലൂടെ വ്യക്തമാക്കി; ശരീരനിലയുടെ മൂലഭാഷാ സൂക്ഷ്മത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
