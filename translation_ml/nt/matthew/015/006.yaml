id: MAT.15.6
reference: Matthew 15:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀οὐ μὴ ⸀τιμήσει τὸν πατέρα ⸀αὐτοῦ· καὶ ἠκυρώσατε ⸂τὸν λόγον⸃ τοῦ θεοῦ διὰ τὴν παράδοσιν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/006.yaml
  text: he certainly need not honor his father[b][a]. And you have nullified the word of God for the sake of your tradition.
translation:
  language: ml
  text: അവൻ തന്റെ പിതാവിനെ ബഹുമാനിക്കേണ്ടതേയില്ല[b]. അങ്ങനെ, നിങ്ങളുടെ പാരമ്പര്യം നിമിത്തം ദൈവത്തിന്റെ വചനത്തെ[a] നിങ്ങൾ അസാധുവാക്കിയിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘ദൈവത്തിന്റെ വചനം’ എന്നതിനുപകരം ‘ദൈവത്തിന്റെ കല്പന’ എന്നു കാണുന്നു.
    reason: textual_variant
  - marker: b
    text: ഇവിടെ ‘ബഹുമാനിക്കുക’ എന്നതിൽ ആദരവ് കാണിക്കുക മാത്രമല്ല, മാതാപിതാക്കളുടെ ആവശ്യങ്ങൾ നിറവേറ്റുകയും അവരെ പരിപാലിക്കുകയും ചെയ്യുക എന്ന പ്രായോഗിക കടമയും ഉൾപ്പെട്ടിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μὴ
  choice: ബഹുമാനിക്കേണ്ടതേയില്ല
  rationale: οὐ μή എന്ന ഊന്നലോടുകൂടിയ നിഷേധം ഇവിടെ പിതാവിനെ ബഹുമാനിക്കാനുള്ള ബാധ്യത ഒഴിവാക്കുന്നതായി അവതരിപ്പിക്കുന്നു. ‘-തേയില്ല’ ആ ഊന്നൽ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τιμήσει
  choice: ബഹുമാനിക്കുക
  rationale: τιμάω എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘ബഹുമാനിക്കുക’ എന്നാണ്. സന്ദർഭത്തിൽ മാതാപിതാക്കൾക്കുള്ള പ്രായോഗികവും സാമ്പത്തികവുമായ കരുതൽ ഉൾപ്പെടാമെങ്കിലും, മുഖ്യപാഠത്തിൽ അതിനെ ‘പോറ്റുക’ എന്ന ചുരുങ്ങിയ അർഥത്തിലേക്ക് മാറ്റിയിട്ടില്ല.
- source_word: τὸν πατέρα αὐτοῦ
  choice: തന്റെ പിതാവിനെ
  rationale: ഗ്രീക്കുപാഠത്തിലുള്ള ഏകവചനമായ ‘അവന്റെ പിതാവ്’ കൃത്യമായി നിലനിർത്തുന്നു; ചുറ്റുപാടിലുള്ള ‘പിതാവോ മാതാവോ’ എന്ന ആശയം ഇവിടെ ചേർത്തിട്ടില്ല.
- source_word: ἠκυρώσατε
  choice: അസാധുവാക്കിയിരിക്കുന്നു
  rationale: ἀκυρόω എന്നത് അസാധുവാക്കുക, പ്രാബല്യമില്ലാതാക്കുക എന്ന ശക്തമായ കുറ്റാരോപണം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമായ പ്രയോഗമാണിത്.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ വചനം
  rationale: SBLGNT-യിലെ λόγον എന്ന വായന നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു. ‘ദൈവത്തിന്റെ കല്പന’ എന്ന പാഠഭേദം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: διὰ τὴν παράδοσιν ὑμῶν
  choice: നിങ്ങളുടെ പാരമ്പര്യം നിമിത്തം
  rationale: Accusative-നോടുകൂടിയ διά ഇവിടെ കാരണം സൂചിപ്പിക്കുന്നു. ‘നിമിത്തം’ അവരുടെ പാരമ്പര്യമാണ് ദൈവവചനം അസാധുവാക്കുന്നതിനുള്ള കാരണമെന്ന് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ‘ബഹുമാനിക്കുക’ എന്നതിൽ മാതാപിതാക്കൾക്കുള്ള സാമ്പത്തിക സഹായം വ്യക്തമായി ചേർക്കണമോ
  choice: മുഖ്യപാഠത്തിൽ ‘ബഹുമാനിക്കുക’ നിലനിർത്തി, പ്രായോഗിക പരിപാലനത്തിന്റെ സൂചന അടിക്കുറിപ്പിൽ നൽകുന്നു.
  alternative: ‘പോറ്റുക’ അല്ലെങ്കിൽ ‘പരിപാലിക്കുക’ എന്ന് പരിഭാഷപ്പെടുത്തുക.
  rationale: ഈ തർക്കത്തിൽ മാതാപിതാക്കൾക്കുള്ള ഭൗതിക സഹായം ഉൾപ്പെട്ടിട്ടുണ്ടെങ്കിലും, ഗ്രീക്ക് ക്രിയയുടെ വിശാലമായ അർഥവും കല്പനയുമായുള്ള പദബന്ധവും നിലനിർത്തുന്നതാണ് ഉചിതം.
- issue: സമീപസന്ദർഭത്തോടോ പാഠഭേദത്തോടോ ഒത്താക്കാൻ മുഖ്യപാഠം വികസിപ്പിക്കണമോ
  choice: SBLGNT-യിലെ ‘തന്റെ പിതാവ്’, ‘ദൈവത്തിന്റെ വചനം’ എന്നീ വായനകൾ നിലനിർത്തുന്നു.
  alternative: ‘പിതാവിനെയോ മാതാവിനെയോ’ എന്ന് വികസിപ്പിക്കുക; അല്ലെങ്കിൽ ‘ദൈവത്തിന്റെ കല്പന’ എന്ന പാഠഭേദം മുഖ്യപാഠത്തിൽ സ്വീകരിക്കുക.
  rationale: നൽകിയിരിക്കുന്ന ഗ്രീക്കുപാഠത്തിനാണ് മുൻഗണന. ശ്രദ്ധേയമായ പാഠഭേദം മുഖ്യപാഠത്തിൽ ചേർക്കാതെ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ബഹുമാനിക്കേണ്ടതേയില്ല’ എന്ന രൂപം emphatic negation-ഉം ബാധ്യത ഒഴിവാക്കുന്ന സന്ദർഭാർഥവും ഒരുമിച്ച് നൽകുന്നു. വാക്യബന്ധത്തിന് καὶയുടെ സന്ദർഭപരമായ ഫലം പ്രകടമാക്കാൻ ‘അങ്ങനെ’ ഉപയോഗിച്ചു.
