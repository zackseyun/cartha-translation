reference: Matthew 15:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ ἐσθίοντες ἦσαν τετρακισχίλιοι ἄνδρες χωρὶς γυναικῶν καὶ παιδίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/038.yaml
  text: Those who had eaten were four thousand men[a], besides women and children.
translation:
  language: ml
  text: ഭക്ഷിച്ചവർ നാലായിരം പുരുഷന്മാരായിരുന്നു, സ്ത്രീകളെയും കുട്ടികളെയും കൂടാതെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സ്ത്രീകളെയും കുട്ടികളെയും എണ്ണത്തിൽ ഉൾപ്പെടുത്താതെ.”
    reason: χωρίς എന്നതിന്റെ അർഥം കൂടുതൽ വ്യക്തമായി പറയുന്ന പകരം പ്രയോഗം.
lexical_decisions:
- source_word: οἱ δὲ ἐσθίοντες
  choice: ഭക്ഷിച്ചവർ
  rationale: നാമവാചകമായി പ്രവർത്തിക്കുന്ന വർത്തമാനകാല കൃദന്തം ഭക്ഷണത്തിൽ പങ്കെടുത്തവരെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ ഭക്ഷണം പൂർത്തിയായതിനാൽ മലയാളത്തിൽ ‘ഭക്ഷിച്ചവർ’ സ്വാഭാവികമാണ്. δέ-യുടെ മൃദുവായ ബന്ധകശക്തി അനാവശ്യമായ വൈരുധ്യപദം ചേർക്കാതെ വാക്യബന്ധത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἦσαν τετρακισχίλιοι
  choice: നാലായിരം … ആയിരുന്നു
  rationale: കോപുലയോടുകൂടിയ സംഖ്യാവിവരം മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിൽ നേരിട്ട് നൽകുന്നു.
- source_word: ἄνδρες
  choice: പുരുഷന്മാർ
  rationale: ἀνήρ ഇവിടെ പൊതുവായ ‘ആളുകൾ’ എന്നല്ല, സ്ത്രീകളിൽനിന്നും കുട്ടികളിൽനിന്നും വേർതിരിച്ച പുരുഷന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: χωρὶς γυναικῶν καὶ παιδίων
  choice: സ്ത്രീകളെയും കുട്ടികളെയും കൂടാതെ
  rationale: χωρίς പ്രസ്താവിച്ച നാലായിരം എന്ന എണ്ണത്തിൽ സ്ത്രീകളും കുട്ടികളും ഉൾപ്പെട്ടിട്ടില്ലെന്നും അവർ അതിനുപുറമേ ഉണ്ടായിരുന്നെന്നും വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: എണ്ണത്തിൽ ലിംഗ-പ്രായ വിഭാഗങ്ങളുടെ വേർതിരിവ്
  choice: ‘പുരുഷന്മാർ’ എന്നു നിലനിർത്തി സ്ത്രീകളെയും കുട്ടികളെയും വേറിട്ട അധിക വിഭാഗങ്ങളായി വ്യക്തമാക്കുന്നു.
  alternative: എല്ലാവരെയും ഉൾപ്പെടുത്തി ‘ആളുകൾ’ എന്നു വിവർത്തനം ചെയ്യുക.
  rationale: ഗ്രീക്ക് പാഠം ἄνδρες എന്നു പ്രത്യേകിച്ച് പുരുഷന്മാരെ പറയുന്നു; തുടർന്ന് സ്ത്രീകളെയും കുട്ടികളെയും വേർതിരിച്ചു പരാമർശിക്കുന്നു. ‘ആളുകൾ’ എന്നത് ഈ ഉറവിടഭേദം മായ്ച്ചുകളയും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ഉറവിടത്തിലെ പുരുഷന്മാർ/സ്ത്രീകൾ/കുട്ടികൾ എന്ന വ്യക്തമായ വേർതിരിവും, നാലായിരം എന്ന എണ്ണം പുരുഷന്മാരെ മാത്രം സംബന്ധിക്കുന്നതുമാണ് നിലനിർത്തിയത്.
