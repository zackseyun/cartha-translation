base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/020.yaml
  text: These are the things that defile the man[b][a], but to eat with unwashed hands does not defile the man.
translation:
  language: ml
  text: ഇവയാണ് മനുഷ്യനെ അശുദ്ധനാക്കുന്ന കാര്യങ്ങൾ[a][b]; എന്നാൽ കഴുകാത്ത കൈകളോടെ ഭക്ഷണം കഴിക്കുന്നത് മനുഷ്യനെ അശുദ്ധനാക്കുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘മലിനനാക്കുന്ന.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് ഒരാളെ ആചാരപരമായി അശുദ്ധനാക്കുക എന്ന അർഥമുണ്ടാകാം; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ‘അശുദ്ധനാക്കുക’ എന്നത് ശുദ്ധി-അശുദ്ധി സംബന്ധിച്ച സന്ദർഭത്തെയും യേശുവിന്റെ ഉപദേശത്തിലെ വിശാലമായ ധാർമിക അർഥത്തെയും തുറന്നുവെക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘മനുഷ്യനെ’ എന്ന ഏകവചനം ഇവിടെ പ്രതിനിധാനപരമാണ്; പൊതുവായി ഏതൊരു മനുഷ്യനെയും കുറിച്ചുള്ള സത്യം അത് പ്രസ്താവിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: κοινοῦντα / κοινοῖ
  choice: അശുദ്ധനാക്കുന്ന / അശുദ്ധനാക്കുന്നില്ല
  rationale: ശുദ്ധി-അശുദ്ധി സംബന്ധിച്ച തർക്കത്തിന്റെ പശ്ചാത്തലത്തിൽ κοινόω ഒരാളെ അശുദ്ധനാക്കുക എന്നർഥം നൽകുന്നു. മലയാളത്തിലെ ‘അശുദ്ധനാക്കുക’ ആചാരപരമായ അശുദ്ധിയെയും യേശുവിന്റെ ഉപദേശത്തിലെ വിശാലമായ ധാർമിക അർഥത്തെയും ഉൾക്കൊള്ളാൻ കഴിവുള്ളതാണ്.
- source_word: ἄνθρωπον
  choice: മനുഷ്യനെ
  rationale: ഗ്രീക്കിലെ നിർദിഷ്ട ഏകവചനം ഇവിടെ പ്രതിനിധാനപരമായി പൊതുവായ മനുഷ്യനെ സൂചിപ്പിക്കുന്നു. ‘മനുഷ്യനെ’ എന്നത് ഏകവചനവും പൊതുവായ പ്രയോഗവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἀνίπτοις χερσὶν
  choice: കഴുകാത്ത കൈകളോടെ
  rationale: ദത്തിവ് പ്രയോഗത്തിന്റെ അർഥവും സന്ദർഭത്തിലെ കൈകഴുകൽ വിഷയവും വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: φαγεῖν
  choice: ഭക്ഷണം കഴിക്കുന്നത്
  rationale: ഗ്രീക്ക് അനന്തക്രിയയെ ആധുനിക മലയാളത്തിൽ നാമവൽക്കരിച്ച ക്രിയാരൂപമായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ταῦτά ἐστιν τὰ
  choice: ഇവയാണ് ... കാര്യങ്ങൾ
  rationale: ചൂണ്ടിക്കാണിക്കലിലെ ഊന്നലും വാക്യത്തിന്റെ വിധേയഘടനയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: δέ
  choice: എന്നാൽ
  rationale: യഥാർഥത്തിൽ അശുദ്ധമാക്കുന്ന കാര്യങ്ങളും കഴുകാത്ത കൈകളോടെ ഭക്ഷണം കഴിക്കുന്നതും തമ്മിലുള്ള വൈരുധ്യം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ശുദ്ധി സംബന്ധിച്ച തർക്കത്തിൽ κοινόω എന്ന ക്രിയയുടെ അർഥവ്യാപ്തി
  choice: ‘അശുദ്ധനാക്കുക’ എന്ന് പരിഭാഷപ്പെടുത്തി; ആചാരപരവും ധാർമികവുമായ അർഥവ്യാപ്തി തുറന്നുവെച്ചു.
  alternative: ‘മലിനനാക്കുക’
  rationale: സന്ദർഭം ആചാരപരമായ ശുദ്ധിയെക്കുറിച്ചാണെങ്കിലും യേശുവിന്റെ വാദം മനുഷ്യനെ യഥാർഥത്തിൽ ദുഷിപ്പിക്കുന്നതിലേക്കും വ്യാപിക്കുന്നു. ‘അശുദ്ധനാക്കുക’ ഈ ശുദ്ധി-അശുദ്ധി പശ്ചാത്തലം നേരിട്ട് നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് വിശാലമായ അർഥസാധ്യത വ്യക്തമാക്കുന്നു.
- issue: പൊതുവായ അർഥമുള്ള ഏകവചന ἄνθρωπον
  choice: ‘മനുഷ്യനെ’ എന്ന ഏകവചനം നിലനിർത്തി.
  alternative: ‘ഒരാളെ’ അല്ലെങ്കിൽ ‘മനുഷ്യരെ’
  rationale: മൂലഭാഷയിലെ പ്രതിനിധാനപരമായ ഏകവചനം സംരക്ഷിക്കുമ്പോഴും പ്രസ്താവന എല്ലാ മനുഷ്യർക്കും ബാധകമാണെന്ന് സ്വാഭാവികമായി ഗ്രഹിക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘അശുദ്ധനാക്കുക’ എന്ന ആവർത്തനം ഗ്രീക്ക് മൂലത്തിലെ ഒരേ ക്രിയയുടെ ആവർത്തനവും വാക്യത്തിലെ ശക്തമായ വൈരുധ്യവും സംരക്ഷിക്കുന്നു.
