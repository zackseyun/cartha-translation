id: MAT.15.14
reference: Matthew 15:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἄφετε αὐτούς· ⸂τυφλοί εἰσιν ὁδηγοὶ τυφλῶν⸃· τυφλὸς δὲ τυφλὸν ἐὰν ὁδηγῇ, ἀμφότεροι εἰς βόθυνον πεσοῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/014.yaml
  text: Leave them alone[a]; they are blind guides of the blind. But if a blind man guides a blind man[c][b], both will fall into a pit.
translation:
  language: ml
  text: അവരെ വിട്ടേക്കുക. അവർ അന്ധർക്കുള്ള അന്ധരായ വഴികാട്ടികളാണ്.[a] എന്നാൽ അന്ധൻ[b] അന്ധനെ നയിച്ചാൽ, ഇരുവരും ഒരു കുഴിയിൽ[c] വീഴും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു വിവർത്തനം: “അവർ അന്ധരുടെ അന്ധരായ വഴികാട്ടികളാണ്.”'
    reason: lexical_alternative
  - marker: b
    text: “അന്ധൻ” എന്ന ഏകവചനരൂപം പഴഞ്ചൊല്ലിൽ പ്രതിനിധിപരമായി ഉപയോഗിച്ചിരിക്കുന്നു; ഈ വാക്ക് പുരുഷന്മാർക്കു മാത്രമല്ല, പൊതുവായി എല്ലാവർക്കും ബാധകമാണ്.
    reason: cultural_note
  - marker: c
    text: അഥവാ, “ചാലിൽ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφετε αὐτούς
  choice: അവരെ വിട്ടേക്കുക
  rationale: ഇവിടെ ἀφίημι എന്ന ക്രിയയ്ക്ക് ‘ക്ഷമിക്കുക’ എന്നല്ല, ‘അവരെ അവരുടെ വഴിക്കു വിടുക; ഇടപെടാതിരിക്കുക’ എന്ന അർഥമാണ്. ‘വിട്ടേക്കുക’ ആജ്ഞയുടെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ ഭാവം നൽകുന്നു.
- source_word: τυφλοί
  choice: അന്ധരായ
  rationale: ആത്മീയമായ തിരിച്ചറിവില്ലായ്മ സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിലെ രൂപകം വിശദീകരിച്ചു ചുരുക്കാതെ അതേപടി നിലനിർത്തുന്നു.
- source_word: ὁδηγοὶ τυφλῶν
  choice: അന്ധരുടെ ... വഴികാട്ടികൾ
  rationale: ὁδηγός എന്നതിന്റെ ദൃശ്യരൂപകം ‘വഴികാട്ടികൾ’ എന്നതിലൂടെ സംരക്ഷിക്കുന്നു; τυφλῶν എന്ന ബഹുവചന ഷഷ്ഠിവിഭക്തിയെ ‘അന്ധരുടെ’ എന്നു നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: τυφλὸς ... τυφλὸν
  choice: അന്ധൻ അന്ധനെ
  rationale: ഗ്രീക്കിലെ ഏകവചനവും പുരുഷലിംഗരൂപവുമായ പഴഞ്ചൊല്ലിന്റെ ചുരുക്കവും പ്രഹരശക്തിയും മലയാളത്തിലും നിലനിർത്തുന്നു. ഇത് പൊതുവായ പ്രയോഗമാണെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐὰν ὁδηγῇ
  choice: നയിച്ചാൽ
  rationale: ἐάν സഹിതമുള്ള വർത്തമാനകാല subjunctive പൊതുവായ നിബന്ധനയാണ്; മലയാളത്തിൽ ‘നയിച്ചാൽ’ അതിനെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἀμφότεροι
  choice: ഇരുവരും
  rationale: രണ്ടുപേരെയും ഉൾക്കൊള്ളുന്ന അർഥം വ്യക്തവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: εἰς βόθυνον
  choice: ഒരു കുഴിയിൽ
  rationale: βόθυνος എന്നത് കുഴി, ചാൽ, കിടങ്ങ് തുടങ്ങിയ താഴ്ന്ന ഇടം സൂചിപ്പിക്കാം. ‘കുഴി’ വിശാലവും സ്വാഭാവികവുമായ മലയാള പദമാണ്; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: πεσοῦνται
  choice: വീഴും
  rationale: നിബന്ധനയുടെ ഉറപ്പുള്ള ഭാവിഫലം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘അന്ധൻ’ എന്നതിന്റെ രൂപകാർഥം
  choice: ആത്മീയമായ തിരിച്ചറിവില്ലായ്മയെ സൂചിപ്പിക്കുന്ന ‘അന്ധൻ’ എന്ന രൂപകം വിശദീകരണം ചേർക്കാതെ നിലനിർത്തി.
  alternative: ‘ആത്മീയമായി അന്ധൻ’ അല്ലെങ്കിൽ ‘തിരിച്ചറിവില്ലാത്ത നേതാവ്’
  rationale: മൂലപാഠം അർഥം വ്യാഖ്യാനിച്ച് പറയാതെ രൂപകവും പഴഞ്ചൊല്ലും ഉപയോഗിക്കുന്നു. വിശദീകരണം മുഖ്യപാഠത്തിൽ ചേർത്താൽ വാക്യത്തിന്റെ ദൃശ്യശക്തി കുറയുകയും ഒരു വ്യാഖ്യാനം നിർബന്ധിതമാകുകയും ചെയ്യും.
- issue: പഴഞ്ചൊല്ലിലെ ലിംഗവും ഏകവചനവും
  choice: ‘അന്ധൻ അന്ധനെ’ എന്ന പുരുഷലിംഗ ഏകവചനരൂപം നിലനിർത്തി.
  alternative: ‘അന്ധനായ ഒരാൾ അന്ധനായ മറ്റൊരാളെ’ അല്ലെങ്കിൽ ലിംഗനിരപേക്ഷമായ ഒരു ബഹുവചനരൂപം
  rationale: ഗ്രീക്കിലെ രൂപം വ്യാകരണപരമായി പുരുഷലിംഗ ഏകവചനമാണെങ്കിലും പഴഞ്ചൊല്ലിൽ അത് പ്രതിനിധിപരമായി പൊതുവായ സത്യം അറിയിക്കുന്നു. രൂപവും പൊതുവായ പ്രയോഗവും ഒരുപോലെ സംരക്ഷിക്കാൻ അടിക്കുറിപ്പ് ചേർത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവമുള്ള മലയാളമാണ് ഉപയോഗിച്ചത്. ‘അന്ധൻ അന്ധനെ’ എന്ന ചുരുക്കമുള്ള പഴഞ്ചൊല്ലുരൂപവും ‘വഴികാട്ടികൾ’ എന്ന ദൃശ്യരൂപകവും നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും അവ വിശദീകരിക്കുന്ന പദപ്രയോഗത്തിനരികെ മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
