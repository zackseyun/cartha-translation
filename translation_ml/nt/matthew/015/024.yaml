revisions:
- from: 'എന്നാൽ അദ്ദേഹം മറുപടി പറഞ്ഞു: “ഇസ്രായേൽഗൃഹത്തിലെ കാണാതെപോയ ആടുകളുടെ അടുക്കലേക്കല്ലാതെ ഞാൻ അയയ്ക്കപ്പെട്ടിട്ടില്ല.”[a]'
  to: 'എന്നാൽ അവൻ മറുപടി പറഞ്ഞു: “ഇസ്രായേൽ ഭവനത്തിലെ നഷ്ടപ്പെട്ട ആടുകളുടെ അടുക്കലേക്കു മാത്രമാണ് എന്നെ അയച്ചത്.”[a]'
  rationale: The revision renders the aorist passive as a completed sending/commissioning event, preserves εἰ μή through «മാത്രമാണ്», and retains the lost-sheep and house-of-Israel imagery. The footnote gives the source's negative-exception structure without imposing an interpretation of the saying's scope.
