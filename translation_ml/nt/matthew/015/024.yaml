id: MAT.15.24
reference: Matthew 15:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Οὐκ ἀπεστάλην εἰ μὴ εἰς τὰ πρόβατα τὰ ἀπολωλότα οἴκου Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/024.yaml
  text: But he answered[a], “I was sent only to the lost sheep of the house of Israel.”
translation:
  language: ml
  text: 'എന്നാൽ അവൻ മറുപടി പറഞ്ഞു: “ഇസ്രായേൽ ഭവനത്തിലെ നഷ്ടപ്പെട്ട ആടുകളുടെ അടുക്കലേക്കു മാത്രമാണ് എന്നെ അയച്ചത്.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, കൂടുതൽ അക്ഷരാർത്ഥത്തിൽ: “ഇസ്രായേൽ ഭവനത്തിലെ നഷ്ടപ്പെട്ട ആടുകളുടെ അടുക്കലേക്കല്ലാതെ ഞാൻ അയക്കപ്പെട്ടതല്ല.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: മറുപടി പറഞ്ഞു
  rationale: കൃ ൽ പങ്കാളിക്രിയയും മുഖ്യക്രിയയും ചേർന്ന ഗ്രീക്ക് പ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ ‘മറുപടി പറഞ്ഞു’ എന്നു സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: Οὐκ ἀπεστάλην
  choice: ഞാൻ അയയ്ക്കപ്പെട്ടിട്ടില്ല
  rationale: ἀποστέλλω എന്ന ക്രിയയുടെ aorist passive ദൗത്യത്തിനായി അയയ്ക്കപ്പെട്ടതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ഈ ദൗത്യത്തിന്റെ നിലനിൽക്കുന്ന പ്രസക്തി സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ ഭൂതകാല passive-നോട് ചേർന്ന ‘അയയ്ക്കപ്പെട്ടിട്ടില്ല’ ഉപയോഗിച്ചു.
- source_word: εἰ μὴ
  choice: അല്ലാതെ
  rationale: Οὐκ ... εἰ μὴ എന്ന ഒഴിവാക്കൽ-പരിമിതി ഘടന ‘...അല്ലാതെ ...ഇല്ല’ എന്ന രൂപത്തിൽ നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: πρόβατα
  choice: ആടുകൾ
  rationale: മൂലത്തിലെ ആടുകളുടെ രൂപകം വ്യാഖ്യാനപരമായി ‘ജനങ്ങൾ’ എന്നു മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: ἀπολωλότα
  choice: കാണാതെപോയ
  rationale: വഴിതെറ്റി നഷ്ടപ്പെട്ട ആടുകളുടെ സന്ദർഭോചിതമായ അർത്ഥം നൽകുന്നു; അന്തിമനാശം എന്ന ആശയം അനാവശ്യമായി ചുമത്തുന്നില്ല.
- source_word: οἴκου Ἰσραήλ
  choice: ഇസ്രായേൽഗൃഹം
  rationale: ഉടമ്പടി-ദേശീയ പശ്ചാത്തലമുള്ള ബൈബിൾ പ്രയോഗം ‘ഇസ്രായേൽഗൃഹം’ എന്ന നിലയിൽ സംരക്ഷിക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭത്തോടുള്ള മൃദുവായ വൈരുധ്യവും മറുപടിയിലെ തിരിവും വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ഈ വചനത്തിൽ യേശു പ്രസ്താവിക്കുന്ന ദൗത്യത്തിന്റെ പരിധി
  choice: Οὐκ ... εἰ μὴ എന്ന വ്യക്തമായ പരിമിതി ‘...അല്ലാതെ ഞാൻ അയയ്ക്കപ്പെട്ടിട്ടില്ല’ എന്നു നിലനിർത്തി.
  alternative: ഇസ്രായേലിന് മുൻഗണന മാത്രമെന്ന് സൂചിപ്പിക്കുന്ന മൃദുവാക്കിയ പരിഭാഷ, അല്ലെങ്കിൽ ജാതികളിലേക്കുള്ള പിന്നീടുള്ള ദൗത്യം ഈ വചനത്തിൽ ചേർക്കുന്ന വ്യാഖ്യാനപരമായ രൂപം.
  rationale: പ്രസ്താവനയിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഭാഷയിൽ പരിഹരിക്കാതെ, ഈ കഥാസന്ദർഭത്തിൽ ഉച്ചരിച്ചിരിക്കുന്നതുപോലെ സംരക്ഷിക്കണം.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ‘ഇസ്രായേൽഗൃഹം’ എന്ന ബൈബിൾ സ്വരം നിലനിർത്തുകയും മൂലത്തിലെ ആടുകളുടെ രൂപകവും ദൗത്യപരിമിതിയും സംരക്ഷിക്കുകയും ചെയ്തു.
