id: MAT.15.32
reference: Matthew 15:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς προσκαλεσάμενος τοὺς μαθητὰς αὐτοῦ εἶπεν· Σπλαγχνίζομαι ἐπὶ τὸν ὄχλον, ὅτι ἤδη ἡμέραι τρεῖς προσμένουσίν μοι καὶ οὐκ ἔχουσιν τί φάγωσιν· καὶ ἀπολῦσαι αὐτοὺς νήστεις οὐ θέλω, μήποτε ἐκλυθῶσιν ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/032.yaml
  text: Then Jesus called his disciples to him and said[a], “I have compassion on the crowd, because they have already remained with me for three days and have nothing to eat. And I do not want to send them away hungry[d][c][b], lest they collapse on the way.”
translation:
  language: ml
  text: 'പിന്നെ യേശു തന്റെ ശിഷ്യന്മാരെ അടുക്കലേക്കു വിളിച്ച് പറഞ്ഞു: “ഈ ജനക്കൂട്ടത്തോട് എനിക്ക് മനസ്സലിവു തോന്നുന്നു[a]. ഇവർ ഇതിനകം മൂന്നു ദിവസമായി എന്നോടുകൂടെ കഴിയുന്നു[b]; ഇവർക്കു ഭക്ഷിക്കാൻ ഒന്നുമില്ല. ഇവരെ വിശന്നിരിക്കെ[c] പറഞ്ഞയയ്ക്കാൻ എനിക്ക് ഇഷ്ടമില്ല; വഴിയിൽ അവർ തളർന്നുപോയേക്കാം[d].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഈ ജനക്കൂട്ടത്തെക്കുറിച്ച് എനിക്ക് ആഴമായ അനുകമ്പ തോന്നുന്നു.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ഇവർ മൂന്നു ദിവസമായി എന്നോടൊപ്പം താമസിക്കുന്നു.”
    reason: lexical_alternative
  - marker: c
    text: νήστεις എന്ന പദത്തിന്റെ അക്ഷരാർഥം “ഉപവസിക്കുന്നവരായി” അഥവാ “ഭക്ഷണമില്ലാതെ” എന്നാണ്. ഇവിടെ മതപരമായ ഉപവാസമല്ല, ഭക്ഷണം കിട്ടാതെ കഴിഞ്ഞ അവസ്ഥയാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
  - marker: d
    text: അഥവാ, “വഴിയിൽ അവർ ബോധംകെട്ടു വീണേക്കാം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: അടുത്തേക്കു വിളിച്ച്
  rationale: മധ്യപ്രയോഗത്തിലുള്ള കൃദന്തം യേശു ശിഷ്യന്മാരെ തന്റെ അടുക്കലേക്കു വിളിച്ചതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ദിശാഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: Σπλαγχνίζομαι
  choice: എനിക്ക് മനസ്സലിവു തോന്നുന്നു
  rationale: ആഴമുള്ള അനുകമ്പയെ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ വൈകാരിക ശക്തി സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὄχλον
  choice: ജനക്കൂട്ടം
  rationale: ആഖ്യാനസന്ദർഭത്തിൽ ὄχλος എന്നതിന്റെ സ്വാഭാവികവും സമകാലികവുമായ മലയാളരൂപം.
- source_word: ἤδη ἡμέραι τρεῖς προσμένουσίν μοι
  choice: ഇവർ ഇപ്പോൾ മൂന്നു ദിവസമായി എന്നോടുകൂടെ കഴിയുന്നു
  rationale: യേശുവിനോടൊപ്പം തുടർന്നു കഴിയുക എന്ന προσμένωയുടെ ആശയവും മൂന്നു ദിവസത്തെ ദൈർഘ്യവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: οὐκ ἔχουσιν τί φάγωσιν
  choice: ഇവർക്കു ഭക്ഷിക്കാൻ ഒന്നുമില്ല
  rationale: ഭക്ഷണം ഇല്ലെന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ വ്യക്തവും സ്വാഭാവികവുമായ തത്തുല്യം.
- source_word: ἀπολῦσαι
  choice: പറഞ്ഞയയ്ക്കാൻ
  rationale: കൂടിയിരുന്ന ജനത്തെ പിരിച്ചയയ്ക്കുക എന്ന സന്ദർഭാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: νήστεις
  choice: വിശന്നവരായി
  rationale: പദത്തിന് അക്ഷരാർഥത്തിൽ ഉപവാസത്തിലോ ഭക്ഷണമില്ലാതെയോ എന്ന അർഥമുണ്ടെങ്കിലും ഇവിടെ മതപരമായ ഉപവാസമല്ല; ഭക്ഷണം കിട്ടാതെ വിശന്നിരിക്കുന്ന അവസ്ഥയാണ്.
- source_word: μήποτε ἐκλυθῶσιν
  choice: തളർന്നുപോയേക്കാം
  rationale: ഭയപ്പെടുന്ന സാധ്യതയെ സൂചിപ്പിക്കുന്ന μήποτεയും ക്ഷീണിച്ച് ശക്തിയറ്റുപോകുക എന്ന ἐκλύομαιയുടെ സന്ദർഭാർഥവും ചേർത്ത് സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἐν τῇ ὁδῷ
  choice: വഴിയിൽ
  rationale: മടങ്ങിപ്പോകുന്ന യാത്രയ്ക്കിടെ എന്ന സന്ദർഭം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
