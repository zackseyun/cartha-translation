translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘മനസ്സലിവ്’, ‘പറഞ്ഞയയ്ക്കുക’, ‘തളർന്നുപോകുക’ എന്നീ പ്രയോഗങ്ങൾ സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതും മൂലത്തിലെ വൈകാരികതയും ആശങ്കയും നിലനിർത്തുന്നതുമാണ്. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദപ്രയോഗത്തിനു പിന്നാലെ പ്രധാനവാക്യത്തിൽ ചേർത്തിരിക്കുന്നു.
