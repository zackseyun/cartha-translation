id: MAT.9.30
reference: Matthew 9:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἠνεῴχθησαν αὐτῶν οἱ ὀφθαλμοί. καὶ ⸀ἐνεβριμήθη αὐτοῖς ὁ Ἰησοῦς λέγων· Ὁρᾶτε μηδεὶς γινωσκέτω·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/030.yaml
  text: And their eyes were opened[a]. And Jesus sternly warned them, saying[b], “See that no one knows.”
translation:
  language: ml
  text: 'അവരുടെ കണ്ണുകൾ തുറന്നു. യേശു അവർക്കു കർശനമായി മുന്നറിയിപ്പ് നൽകി[a]: “ആരും അറിയാതിരിക്കാൻ നോക്കുക[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കർശനമായി കല്പിച്ചു’ അല്ലെങ്കിൽ ‘ശക്തമായി താക്കീതു നൽകി’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കു ക്രിയ ശക്തമായ വികാരവും മുന്നറിയിപ്പിന്റെ നിർബന്ധസ്വഭാവവും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥത്തോട് അടുത്ത രൂപം: ‘ആരും അറിയാതിരിക്കാൻ നോക്കുക.’ എന്താണ് അറിയരുതെന്ന കർമം ഗ്രീക്കിൽ പറയാതെ സന്ദർഭത്തിൽ സൂചിപ്പിച്ചിരിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνεῴχθησαν
  choice: തുറന്നു
  rationale: ἀνοίγω എന്ന ക്രിയയുടെ ഭൂതകാല കർമണിപ്രയോഗമാണ്. മലയാളത്തിൽ ‘അവരുടെ കണ്ണുകൾ തുറന്നു’ എന്ന സ്വാഭാവിക പ്രയോഗം കാഴ്ച ലഭിച്ചതിനെ വ്യക്തമാക്കുന്നു; പ്രവർത്തകനെ അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: οἱ ὀφθαλμοί
  choice: അവരുടെ കണ്ണുകൾ
  rationale: ഗ്രീക്കിലെ ഉടമസ്ഥബന്ധം ആധുനിക മലയാളത്തിൽ നേരായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: ἐνεβριμήθη
  choice: കർശനമായി മുന്നറിയിപ്പു നൽകി
  rationale: ഈ ക്രിയ ശക്തമായ വികാരത്തോടെയും നിർബന്ധബോധത്തോടെയും നൽകുന്ന താക്കീതിനെ സൂചിപ്പിക്കുന്നു. തുടർന്നുവരുന്ന വിലക്കിന്റെ പശ്ചാത്തലത്തിൽ ഈ പരിഭാഷ അതിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: Ὁρᾶτε
  choice: സൂക്ഷിച്ചുകൊള്ളുക
  rationale: ഇവിടെ ‘കാണുക’ എന്ന അക്ഷരാർഥത്തേക്കാൾ ജാഗ്രതയോടെ ഉറപ്പാക്കുക എന്ന ആജ്ഞാർഥമാണ്; മലയാളത്തിൽ ‘സൂക്ഷിച്ചുകൊള്ളുക’ അതിനെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: μηδεὶς γινωσκέτω
  choice: ആരും അറിയാതിരിക്കാൻ
  rationale: μηδείς സഹിതമുള്ള മൂന്നാംപുരുഷ ആജ്ഞാരൂപം ശക്തമായ വിലക്കാണ്. ഗ്രീക്കിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ലാത്തതിനാൽ മലയാളത്തിലും ‘ഇത്’ ചേർക്കാതെ സന്ദർഭത്തിൽനിന്ന് അർഥം ഗ്രഹിക്കാവുന്ന രൂപം തെരഞ്ഞെടുത്തു.
- source_word: λέγων
  choice: 'മുന്നറിയിപ്പു നൽകി:'
  rationale: സമകാലിക കൃദന്തരൂപത്തിന്റെ ഉദ്ധരണി-പരിചയപ്പെടുത്തൽ പ്രവർത്തനം മലയാളത്തിൽ കോളൺ ഉപയോഗിച്ച് സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു; ‘പറഞ്ഞുകൊണ്ട്’ എന്ന ഭാരമുള്ള ആവർത്തനം ഒഴിവാക്കി.
theological_decisions:
- issue: രോഗസൗഖ്യത്തിനുശേഷമുള്ള യേശുവിന്റെ കല്പനയുടെ ശക്തി
  choice: സംഭവം പരസ്യമാകരുതെന്ന ശക്തമായ വിലക്കായി പരിഭാഷപ്പെടുത്തി; അതിന്റെ കാരണം വിശദീകരിച്ചില്ല.
  alternative: ‘അവരെ ശാസിച്ചു’ അല്ലെങ്കിൽ ‘അവരോട് കർശനമായി കല്പിച്ചു’
  rationale: വാക്യം കല്പനയുടെ ശക്തി പ്രകടമാക്കുന്നുവെങ്കിലും യേശുവിന്റെ ഉദ്ദേശ്യം വിശദീകരിക്കുന്നില്ല. അതിനാൽ ശക്തി നിലനിർത്തുകയും ഉദ്ദേശ്യത്തെക്കുറിച്ചുള്ള ദൈവശാസ്ത്രപരമായ അനുമാനം ഒഴിവാക്കുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘അപ്പോൾ’ ഗ്രീക്കിലെ καί-യുടെ കഥനതുടർച്ച സ്വാഭാവികമായി നൽകുന്നു. കർമമായി ‘ഇത്’ ചേർക്കാതെ മൂലത്തിലെ പരോക്ഷത നിലനിർത്തി; എന്നാൽ വാക്യം മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന വിധം ക്രമപ്പെടുത്തി.
