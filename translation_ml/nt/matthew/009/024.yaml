id: MAT.9.24
reference: Matthew 9:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ἔλεγεν· Ἀναχωρεῖτε, οὐ γὰρ ἀπέθανεν τὸ κοράσιον ἀλλὰ καθεύδει· καὶ κατεγέλων αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/024.yaml
  text: He was saying[a], “Go away, for the girl has not died, but is sleeping.” And they were laughing at him.
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞുകൊണ്ടിരുന്നു: “മാറിപ്പോകൂ; പെൺകുട്ടി മരിച്ചിട്ടില്ല, പക്ഷേ ഉറങ്ങുകയാണ്.” അവർ അവനെ പരിഹസിച്ചു ചിരിക്കുകയായിരുന്നു.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവർ അവനെ നോക്കി പരിഹാസത്തോടെ ചിരിക്കുകയായിരുന്നു.” ഗ്രീക്ക് ക്രിയയ്ക്ക് ഒരാളെ പരിഹസിച്ചുകൊണ്ട് ചിരിക്കുക എന്ന അർഥമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: അവൻ പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലരൂപം രംഗത്തിൽ തുടർന്നോ ആവർത്തിച്ചോ നടന്ന സംസാരത്തെ സൂചിപ്പിക്കാം; ‘പറഞ്ഞുകൊണ്ടിരുന്നു’ ആ ഭാവം നിലനിർത്തുന്നു.
- source_word: Ἀναχωρεῖτε
  choice: മാറിപ്പോകൂ
  rationale: ബഹുവചന ആജ്ഞയുടെ ശക്തി സാധാരണ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: οὐ γὰρ ἀπέθανεν
  choice: പെൺകുട്ടി മരിച്ചിട്ടില്ല
  rationale: γάρ നൽകുന്ന കാരണബന്ധം മലയാളത്തിലെ വാക്യക്രമത്തിലും വിരാമചിഹ്നത്തിലും സ്വാഭാവികമായി വ്യക്തമാണ്; ἀπέθανεν മരണത്തെ ഒരു സംഭവമായി അവതരിപ്പിക്കുന്നതിനാൽ ‘മരിച്ചിട്ടില്ല’ അനുയോജ്യമാണ്.
- source_word: τὸ κοράσιον
  choice: പെൺകുട്ടി
  rationale: പ്രായം കുറഞ്ഞ ഒരു പെൺകുട്ടിയെ സൂചിപ്പിക്കുന്ന പദം; ‘കൊച്ചുപെൺകുട്ടി’ എന്നു ചേർത്ത് ഉറവിടത്തിൽ വ്യക്തമല്ലാത്ത ഊന്നൽ നൽകാതെ ലളിതമായി പരിഭാഷപ്പെടുത്തി.
- source_word: ἀλλὰ καθεύδει
  choice: ഉറങ്ങുകയാണ്
  rationale: വർത്തമാനകാലത്തിലുള്ള ഉറക്കത്തിന്റെ നില/പ്രവൃത്തി നിലനിർത്തുകയും യേശുവിന്റെ വാക്കുകളിലെ രൂപകാത്മക സാധ്യത തുറന്നുവെക്കുകയും ചെയ്യുന്നു.
- source_word: κατεγέλων αὐτοῦ
  choice: അവർ അവനെ പരിഹസിച്ചു ചിരിക്കുകയായിരുന്നു
  rationale: ക്രിയയിലെ ‘ആരെയെങ്കിലും നോക്കി പരിഹാസത്തോടെ ചിരിക്കുക’ എന്ന അർഥവും അപൂർണഭൂതകാലത്തിലെ തുടരുന്ന പ്രവൃത്തിയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: പെൺകുട്ടി ‘മരിച്ചിട്ടില്ല, ഉറങ്ങുകയാണ്’ എന്ന യേശുവിന്റെ പ്രസ്താവന
  choice: ‘ഉറങ്ങുകയാണ്’ എന്ന പദപ്രയോഗം വ്യാഖ്യാനപരമായ വിശദീകരണമില്ലാതെ അതേപടി നിലനിർത്തി.
  alternative: ‘ഉറങ്ങുന്നതുപോലെയാണ്’ എന്നോ ‘മരണം ഉറക്കമെന്ന അർഥത്തിലാണ്’ എന്നോ വ്യാഖ്യാനിച്ച് പരിഭാഷപ്പെടുത്തുക.
  rationale: മൂലപാഠം സൃഷ്ടിക്കുന്ന കഥാപരവും ദൈവശാസ്ത്രപരവുമായ പിരിമുറുക്കം പരിഭാഷയിൽ തീർപ്പാക്കരുത്; ഇത് രൂപകമാണോ, പ്രതീക്ഷാപൂർവമായ പ്രസ്താവനയാണോ എന്നത് പാഠം ഇവിടെ വിശദീകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. അപൂർണഭൂതകാലത്തിന്റെ തുടരുന്ന ഭാവം കഴിയുന്നത്ര നിലനിർത്തി; അതേസമയം വാക്യം അനാവശ്യമായി ഭാരപ്പെടുത്താതിരിക്കാൻ ശ്രദ്ധിച്ചു.
