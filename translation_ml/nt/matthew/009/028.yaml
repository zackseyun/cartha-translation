id: MAT.9.28
reference: Matthew 9:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐλθόντι δὲ εἰς τὴν οἰκίαν προσῆλθον αὐτῷ οἱ τυφλοί, καὶ λέγει αὐτοῖς ὁ Ἰησοῦς· Πιστεύετε ὅτι δύναμαι τοῦτο ποιῆσαι; λέγουσιν αὐτῷ· Ναί, κύριε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/028.yaml
  text: When he entered the house[a], the blind men approached him, and Jesus said to them, “Do you believe that I am able to do this?” They said to him, “Yes[b], Lord.”
translation:
  language: ml
  text: 'അവൻ വീട്ടിൽ പ്രവേശിച്ചപ്പോൾ, അന്ധരായ ആ മനുഷ്യർ അവന്റെ അടുക്കൽ വന്നു. യേശു അവരോടു ചോദിക്കുന്നു: “എനിക്ക് ഇതു ചെയ്യാൻ കഴിയുമെന്ന് നിങ്ങൾ വിശ്വസിക്കുന്നുവോ?” അവർ അവനോടു പറയുന്നു: “അതേ, കർത്താവേ.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അതേ, അയ്യാ.” ഇവിടെ κύριε എന്ന ഗ്രീക്ക് പദം മാന്യമായ അഭിസംബോധനയായിരിക്കാം; അതേസമയം യേശുവിന്റെ അധികാരത്തെ അംഗീകരിക്കുന്ന അർഥവും അതിനുണ്ടാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλθόντι δὲ εἰς τὴν οἰκίαν
  choice: അവൻ വീട്ടിൽ പ്രവേശിച്ചപ്പോൾ
  rationale: കാലസൂചകമായ aorist participle സ്വാഭാവികമായ മലയാളത്തിൽ ‘പ്രവേശിച്ചപ്പോൾ’ എന്നു നൽകി; εἰς എന്ന ദിശാഭാവവും ഇതിൽ നിലനിൽക്കുന്നു.
- source_word: προσῆλθον αὐτῷ
  choice: അവന്റെ അടുക്കൽ വന്നു
  rationale: προσέρχομαι ഒരാളുടെ സമീപത്തേക്കു വരുക എന്നർഥം നൽകുന്നു; ലളിതവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: οἱ τυφλοί
  choice: അന്ധരായ ആ മനുഷ്യർ
  rationale: സന്ദർഭത്തിലെ രണ്ടു പുരുഷന്മാരെയാണ് substantival adjective സൂചിപ്പിക്കുന്നത്; വ്യക്തികളെ അപമാനകരമായി ഒരു അവസ്ഥകൊണ്ട് മാത്രം വിളിക്കാതെയും അർഥം വ്യക്തമാക്കിയും പരിഭാഷപ്പെടുത്തി.
- source_word: λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: യേശു അവരോടു ചോദിക്കുന്നു
  rationale: λέγει എന്ന ചരിത്രവർത്തമാനം നിലനിർത്തി; പിന്നാലെയുള്ള നേരിട്ടുള്ള ചോദ്യം കണക്കിലെടുത്ത് മലയാളത്തിൽ സ്വാഭാവികമായ ‘ചോദിക്കുന്നു’ ഉപയോഗിച്ചു.
- source_word: Πιστεύετε ὅτι δύναμαι τοῦτο ποιῆσαι
  choice: എനിക്ക് ഇതു ചെയ്യാൻ കഴിയുമെന്ന് നിങ്ങൾ വിശ്വസിക്കുന്നുവോ?
  rationale: വിശ്വാസത്തെയും യേശുവിന്റെ കഴിവിനെയും സംബന്ധിച്ച ഗ്രീക്ക് ചോദ്യത്തിന്റെ ഘടനയും ഊന്നലും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: λέγουσιν αὐτῷ· Ναί
  choice: 'അവർ അവനോടു പറയുന്നു: “അതേ”'
  rationale: ചരിത്രവർത്തമാനമായ λέγουσιν നിലനിർത്തി; Ναί എന്ന ലളിതമായ സമ്മതത്തെ ‘അതേ’ എന്നു നൽകി.
- source_word: κύριε
  choice: കർത്താവേ
  rationale: κύριος എന്ന പദത്തിന്റെ പതിവ് ദൈവശാസ്ത്രഭാരം സംരക്ഷിക്കുമ്പോഴും, ഇവിടെ മാന്യമായ അഭിസംബോധന എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശുവിനോടുള്ള അഭിസംബോധനയായ κύριε
  choice: കർത്താവേ
  alternative: യജമാനനേ / അങ്ങുന്നേ
  rationale: യേശുവിന്റെ അധികാരത്തെ അംഗീകരിക്കുന്ന സാധ്യത നഷ്ടപ്പെടുത്താതെ κύριος എന്ന പദത്തിന്റെ പതിവ് പരിഭാഷ നിലനിർത്തുന്നു; എന്നാൽ ഇത് മാന്യമായ സാധാരണ അഭിസംബോധനയായിരിക്കാമെന്ന യഥാർഥ സന്ദിഗ്ധത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: λέγει, λέγουσιν എന്നീ ചരിത്രവർത്തമാനങ്ങൾ
  choice: ചോദിക്കുന്നു / പറയുന്നു
  alternative: ചോദിച്ചു / പറഞ്ഞു
  rationale: മത്തായിയുടെ ഗ്രീക്ക് ആഖ്യാനത്തിലെ സജീവമായ ചരിത്രവർത്തമാന രൂപം മലയാളത്തിലും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ ചരിത്രവർത്തമാനം ഉദ്ദേശപൂർവം നിലനിർത്തിയിരിക്കുന്നു. ഇംഗ്ലീഷ് പാഠത്തിലെ അടിക്കുറിപ്പ്-മാർക്കറുകൾ ഉള്ളടക്കവുമായി പൊരുത്തപ്പെടാത്തതിനാൽ, മൂലഭാഷയിലെ യഥാർഥ സന്ദിഗ്ധതയായ κύριε എന്നതിന് മാത്രം [a] നൽകി.
