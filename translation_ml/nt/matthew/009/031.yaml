id: MAT.9.31
reference: Matthew 9:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ ἐξελθόντες διεφήμισαν αὐτὸν ἐν ὅλῃ τῇ γῇ ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/031.yaml
  text: But after they went out[a], they spread the news about him throughout that whole region.
translation:
  language: ml
  text: എന്നാൽ അവർ പുറത്തുപോയശേഷം, ആ പ്രദേശത്തെങ്ങും അവനെക്കുറിച്ചുള്ള വാർത്ത പ്രചരിപ്പിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആ നാട്ടിലെങ്ങും.” ഗ്രീക്കിലെ γῆ എന്ന പദത്തിന് “നാട്,” “പ്രദേശം,” “ഭൂവിഭാഗം” എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിൽ യേശു നൽകിയ കർശനനിർദേശത്തിന് വിരുദ്ധമായി അവർ പ്രവർത്തിച്ചെന്ന മൃദുവായ വൈരുധ്യം വ്യക്തമാക്കുന്നു.
- source_word: ἐξελθόντες
  choice: അവർ പുറത്തുപോയശേഷം
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പ് നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന aorist participle-ന്റെ സമയക്രമം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: διεφήμισαν
  choice: വാർത്ത പ്രചരിപ്പിച്ചു
  rationale: വ്യാപകമായി അറിയിക്കുക, വാർത്ത പരത്തുക എന്ന ക്രിയയുടെ അർഥം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: αὐτὸν
  choice: അവനെക്കുറിച്ചുള്ള
  rationale: ഗ്രീക്കിൽ നേരിട്ടുള്ള കർമമായിരുന്നാലും, മലയാളത്തിൽ ‘വാർത്ത പ്രചരിപ്പിച്ചു’ എന്ന പ്രയോഗത്തോടൊപ്പം ഉദ്ദേശിക്കുന്ന ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἐν ὅλῃ τῇ γῇ ἐκείνῃ
  choice: ആ പ്രദേശത്തെങ്ങും
  rationale: ἐν-ന്റെ വ്യാപകതയും ὅλῃ-യുടെ സമഗ്രതയും സംക്ഷിപ്തമായി നൽകുന്നു; പ്രാദേശിക ഭൂമിശാസ്ത്രസന്ദർഭത്തിൽ γῆയ്ക്ക് ‘പ്രദേശം’ യോജിക്കുന്നു.
theological_decisions:
- issue: γῆ സൂചിപ്പിക്കുന്ന ഭൂമിശാസ്ത്രപരമായ വ്യാപ്തി
  choice: പ്രദേശം
  alternative: ദേശം / ആ നാട്ടിലെങ്ങും
  rationale: സന്ദർഭം യേശുവിനെക്കുറിച്ചുള്ള വാർത്ത പ്രാദേശികമായി പരന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പ്രദേശം’ വ്യാപ്തി അതിരുകടന്ന് ദേശീയമോ സാർവത്രികമോ ആക്കാതെ ഗ്രീക്കിലെ അർഥവ്യാപ്തി നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. മുൻവാക്യത്തോടുള്ള വൈരുധ്യവും പ്രവർത്തികളുടെ സമയക്രമവും വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു.
