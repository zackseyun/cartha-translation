id: MAT.9.38
reference: Matthew 9:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: δεήθητε οὖν τοῦ κυρίου τοῦ θερισμοῦ ὅπως ἐκβάλῃ ἐργάτας εἰς τὸν θερισμὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/038.yaml
  text: Therefore pray earnestly to the Lord of the harvest that he would send out workers into his harvest[a].
translation:
  language: ml
  text: അതുകൊണ്ട്, കൊയ്ത്തിന്റെ കർത്താവിനോട് തന്റെ കൊയ്ത്തിലേക്കു വേലക്കാരെ അയയ്ക്കാൻ ഉത്സാഹത്തോടെ പ്രാർഥിക്കുവിൻ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വേലക്കാരെ ഇറക്കിവിടാൻ’ എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്ക് ക്രിയയ്ക്ക് വെറും ‘അയയ്ക്കുക’ എന്നതിനെക്കാൾ ശക്തമായ ഭാവമുണ്ട്. ഇവിടെ കൊയ്ത്തിലേക്കു വേലക്കാരെ നിയോഗിച്ച് അയയ്ക്കുന്നതാണ് അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεήθητε
  choice: ഉത്സാഹത്തോടെ പ്രാർഥിക്കുവിൻ
  rationale: δέομαι എന്ന ക്രിയയുടെ അപേക്ഷയിലെ തീവ്രതയും പ്രാർഥനാസന്ദർഭവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യത്തിലെ ‘കൊയ്ത്തു വളരെ, വേലക്കാർ ചുരുക്കം’ എന്ന പ്രസ്താവനയിൽനിന്നുള്ള നിഗമനബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: τοῦ κυρίου τοῦ θερισμοῦ
  choice: കൊയ്ത്തിന്റെ കർത്താവിനോട്
  rationale: കൊയ്ത്തിന്മേലുള്ള അധികാരം സൂചിപ്പിക്കുന്ന κύριος എന്ന പദവും കൊയ്ത്തിന്റെ രൂപകവും നിലനിർത്തുന്നു.
- source_word: ὅπως
  choice: …അയയ്ക്കാൻ
  rationale: പ്രാർഥനയുടെ ഉള്ളടക്കമോ ഉദ്ദേശ്യമോ മലയാളത്തിലെ സ്വാഭാവികമായ അനന്തരൂപത്തിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: ἐκβάλῃ
  choice: അയയ്ക്കാൻ
  rationale: ഈ സന്ദർഭത്തിൽ വേലക്കാരെ കൊയ്ത്തിലേക്കു നിയോഗിച്ച് അയയ്ക്കുന്നതാണ് ഉദ്ദേശ്യം; ഗ്രീക്ക് ക്രിയയുടെ കൂടുതൽ ശക്തമായ ഭാവം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἐργάτας
  choice: വേലക്കാരെ
  rationale: കൊയ്ത്തിൽ പ്രവർത്തിക്കുന്നവരെ സൂചിപ്പിക്കുന്ന, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ബൈബിൾഭാഷയിൽ സ്വാഭാവികവുമായ പദം.
- source_word: εἰς τὸν θερισμὸν αὐτοῦ
  choice: തന്റെ കൊയ്ത്തിലേക്കു
  rationale: εἰς സൂചിപ്പിക്കുന്ന ലക്ഷ്യദിശയും αὐτοῦ എന്ന ഉടമസ്ഥസൂചനയും നിലനിർത്തുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘വയൽ’ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ‘കൊയ്ത്തിന്റെ കർത്താവ്’ ആരെന്ന തിരിച്ചറിയൽ
  choice: ‘കൊയ്ത്തിന്റെ കർത്താവ്’ എന്നു മാത്രമായി വിവർത്തനം ചെയ്തു; ആരെയാണ് പ്രത്യേകമായി സൂചിപ്പിക്കുന്നതെന്ന് നിർണയിച്ചില്ല.
  alternative: പിതാവിനെ പ്രത്യേകമായി സൂചിപ്പിക്കുക; അല്ലെങ്കിൽ യേശുവിനെ പ്രത്യേകമായി സൂചിപ്പിക്കുക.
  rationale: വാക്യം തന്നെ ഈ വിശേഷണത്തിന്റെ സൂചിതനെ കൂടുതൽ വ്യക്തമായി തിരിച്ചറിയിക്കുന്നില്ല. അതിനാൽ പിതാവ്, യേശു, അല്ലെങ്കിൽ ദൈവം എന്നിങ്ങനെ ഒരു വായനയെ വിവർത്തനത്തിൽ നിർബന്ധിക്കാതെ മൂലത്തിലെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനയ്ക്ക് എളുപ്പവുമായ മലയാളം. ‘കൊയ്ത്ത്’ എന്ന ദൗത്യ/ശേഖരണ രൂപകം വിശദീകരിച്ച് ലഘൂകരിക്കാതെ നിലനിർത്തി. ബഹുവചന കല്പനാരൂപമായ ‘പ്രാർഥിക്കുവിൻ’ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവത്തോടെ ഉപയോഗിച്ചു.
