id: MAT.9.2
reference: Matthew 9:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ προσέφερον αὐτῷ παραλυτικὸν ἐπὶ κλίνης βεβλημένον. καὶ ἰδὼν ὁ Ἰησοῦς τὴν πίστιν αὐτῶν εἶπεν τῷ παραλυτικῷ· Θάρσει, τέκνον· ⸀ἀφίενταί ⸂σου αἱ ἁμαρτίαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/002.yaml
  text: And behold[a], they brought to him a paralytic lying on a bed. And when Jesus saw their faith, he said to the paralytic, “Take courage, child[c][b]; your sins are forgiven.”
translation:
  language: ml
  text: ഇതാ, കിടക്കയിൽ കിടന്നിരുന്ന ഒരു തളർവാതരോഗിയെ അവർ യേശുവിന്റെ അടുക്കൽ കൊണ്ടുവന്നു. യേശു അവരുടെ വിശ്വാസം[a] കണ്ടിട്ട് തളർവാതരോഗിയോട്, “മകനേ, ധൈര്യപ്പെടുക; നിന്റെ പാപങ്ങൾ ക്ഷമിക്കപ്പെട്ടിരിക്കുന്നു[b],” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവരുടെ’ എന്ന ബഹുവചനം രോഗിയെ കൊണ്ടുവന്നവരെ മാത്രം സൂചിപ്പിക്കാമോ, രോഗിയെയും അവരോടൊപ്പം ഉൾക്കൊള്ളാമോ എന്ന് ഗ്രീക്ക് വാക്യം വ്യക്തമാക്കുന്നില്ല.
    reason: alternative_reading
  - marker: b
    text: അഥവാ “നിന്റെ പാപങ്ങൾ ക്ഷമിക്കപ്പെടുന്നു.” ഗ്രീക്ക് രൂപം ഇപ്പോഴത്തെ മോചനപ്രഖ്യാപനത്തെ സൂചിപ്പിക്കുന്നു; പ്രവർത്തകനെ പറയുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: സംഭവത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന മത്തായിയുടെ സജീവമായ ആഖ്യാനസൂചകം നിലനിർത്തുന്നു.
- source_word: προσέφερον
  choice: കൊണ്ടുവന്നു
  rationale: προσφέρω എന്ന ക്രിയയുടെ സന്ദർഭോചിതമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ഗ്രീക്കിലെ അപൂർണഭൂതകാലത്തിന്റെ പുരോഗമനഭാവം ഇവിടെ നിർബന്ധമായി പ്രത്യേകം പ്രകടിപ്പിക്കേണ്ടതില്ല.
- source_word: παραλυτικὸν
  choice: ഒരു തളർവാതരോഗിയെ
  rationale: നാമമായി ഉപയോഗിച്ചിരിക്കുന്ന വിശേഷണത്തെ വ്യക്തവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ രീതിയിൽ നൽകുന്നു.
- source_word: ἐπὶ κλίνης βεβλημένον
  choice: കിടക്കയിൽ കിടന്നിരുന്ന
  rationale: ആ വ്യക്തിയുടെ സ്ഥിതിയും സ്ഥാനവും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; κλίνη എന്നതിന് ഉറപ്പില്ലാതെ ‘പായ’ എന്നു ചുരുക്കുന്നില്ല.
- source_word: πίστιν
  choice: വിശ്വാസം
  rationale: πίστις എന്ന പദത്തിന്റെ പതിവായ അർഥം നിലനിർത്തുന്നു; പ്രവൃത്തിയിൽ പ്രകടമായ ആശ്രയവും വിശ്വാസവും ഈ സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: Θάρσει
  choice: ധൈര്യപ്പെടുക
  rationale: ആശ്വസിപ്പിക്കുകയും ധൈര്യം പകരുകയും ചെയ്യുന്ന ആജ്ഞയുടെ നേരിട്ടുള്ള ശക്തി നിലനിർത്തുന്നു.
- source_word: τέκνον
  choice: മകനേ
  rationale: സ്നേഹപൂർവമായ അഭിസംബോധന മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; സന്ദർഭത്തിലെ പുരുഷലിംഗസൂചനയോടും ഇത് യോജിക്കുന്നു.
- source_word: ἀφίενταί σου αἱ ἁμαρτίαι
  choice: നിന്റെ പാപങ്ങൾ ക്ഷമിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: കർത്താവിനെ വ്യക്തമാക്കാത്ത ഗ്രീക്ക് കർമണിപ്രയോഗവും ഇപ്പോഴത്തെ പ്രഖ്യാപനത്തിന്റെ ഭാവവും നിലനിർത്തുന്നു.
- source_word: ἁμαρτίαι
  choice: പാപങ്ങൾ
  rationale: ബഹുവചനത്തിലുള്ള വ്യക്തമായ തെറ്റുകളുടെ അർഥം പരാവർത്തനം ചെയ്യാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: τὴν πίστιν αὐτῶν എന്നതിൽ ‘അവരുടെ’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: ബഹുവചനം അതേപടി ‘അവരുടെ വിശ്വാസം’ എന്നു നിലനിർത്തി.
  alternative: രോഗിയെ കൊണ്ടുവന്നവരുടെ വിശ്വാസം മാത്രം; അല്ലെങ്കിൽ രോഗിയെയും കൊണ്ടുവന്നവരെയും ഉൾക്കൊള്ളുന്ന കൂട്ടത്തിന്റെ വിശ്വാസം.
  rationale: αὐτῶν ബഹുവചനമാണ്; എന്നാൽ രോഗി അതിൽ ഉൾപ്പെടുന്നുണ്ടോ എന്ന് വാക്യം തീർച്ചപ്പെടുത്തുന്നില്ല. പരിഭാഷ ആ അവ്യക്തത പരിഹരിക്കുന്നില്ല.
- issue: പാപമോചനപ്രഖ്യാപനത്തിന്റെ സ്വഭാവം
  choice: കർത്താവിനെ പറയാത്ത കർമണിപ്രയോഗമായി ‘ക്ഷമിക്കപ്പെട്ടിരിക്കുന്നു’ എന്നു നൽകി.
  alternative: ‘ദൈവം നിന്റെ പാപങ്ങൾ ക്ഷമിച്ചിരിക്കുന്നു’ എന്നു കർത്താവിനെ വ്യക്തമാക്കുക; അല്ലെങ്കിൽ ‘ഞാൻ നിന്റെ പാപങ്ങൾ ക്ഷമിക്കുന്നു’ എന്നു യേശുവിനെ നേരിട്ട് കർത്താവാക്കുക.
  rationale: ഗ്രീക്ക് വാക്യം പ്രവർത്തകനെ വ്യക്തമാക്കാതെ മോചനം പ്രഖ്യാപിക്കുന്നു. അതിനാൽ യേശുവിന്റെ അധികാരത്തെക്കുറിച്ചുള്ള ആഖ്യാനപരമായ ദൈവശാസ്ത്രസംഘർഷം വിശദീകരിച്ച് തീർക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഇതാ’ എന്നത് മൂലത്തിലെ ശ്രദ്ധാകർഷകസൂചകം നിലനിർത്തുന്നു. ‘മകനേ’ സ്നേഹപൂർവമായ അഭിസംബോധനയായി ഉപയോഗിച്ചു; അതിപുരാതനമായ വാക്യക്രമവും അനാവശ്യമായ സാങ്കേതികഭാഷയും ഒഴിവാക്കി.
