id: MAT.9.11
reference: Matthew 9:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἰδόντες οἱ Φαρισαῖοι ⸀ἔλεγον τοῖς μαθηταῖς αὐτοῦ· Διὰ τί μετὰ τῶν τελωνῶν καὶ ἁμαρτωλῶν ἐσθίει ὁ διδάσκαλος ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/011.yaml
  text: And when the Pharisees saw it[a], they were saying to his disciples, “Why does your teacher eat with tax collectors and sinners?”
translation:
  language: ml
  text: 'ഫരിസേയർ അതു[a] കണ്ടപ്പോൾ അവന്റെ ശിഷ്യന്മാരോടു ചോദിച്ചു: “നിങ്ങളുടെ ഗുരു നികുതി പിരിക്കുന്നവരോടും പാപികളോടുംകൂടെ ഭക്ഷണം കഴിക്കുന്നത് എന്തുകൊണ്ടാണ്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ ഔപചാരികമായി: “ഇതു കണ്ട ഫരിസേയർ…” ഗ്രീക്കിൽ ‘കണ്ടു’ എന്നതിന്റെ കർമം വ്യക്തമാക്കിയിട്ടില്ല; സന്ദർഭത്തിലെ ഭക്ഷണരംഗത്തെയാണ് അത് സൂചിപ്പിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: അതു കണ്ടപ്പോൾ
  rationale: സന്ദർഭത്തിലെ വിരുന്നുദൃശ്യം കണ്ടതിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ഭൂതകാല കൃദന്തം സ്വാഭാവികമായ മലയാളത്തിൽ കാലസൂചക ഉപവാക്യമായി നൽകി. ഗ്രീക്കിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ലാത്തതിനാൽ ‘അതു’ എന്ന പദത്തിന് അടിക്കുറിപ്പ് ചേർത്തു.
- source_word: ἔλεγον
  choice: ചോദിച്ചു
  rationale: രൂപത്തിൽ അപൂർണഭൂതകാലമാണെങ്കിലും ഇവിടെ നേരിട്ടുള്ള ചോദ്യത്തെ പരിചയപ്പെടുത്തുന്നതിനാൽ മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനശൈലിയിൽ ‘ചോദിച്ചു’ എന്നു നൽകി. ‘ചോദിച്ചുകൊണ്ടിരുന്നു’ ആവർത്തനമോ ദീർഘതയോ അനാവശ്യമായി ഊന്നാം.
- source_word: μαθηταῖς
  choice: ശിഷ്യന്മാരോട്
  rationale: ഗുരു–ശിഷ്യ ബന്ധം നിലനിർത്തുന്ന, സുവിശേഷസന്ദർഭത്തിൽ പതിവും വ്യക്തവുമായ മലയാളപദം.
- source_word: Διὰ τί
  choice: എന്തുകൊണ്ടാണ്
  rationale: കാരണം ചോദിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: τελωνῶν
  choice: ചുങ്കം പിരിക്കുന്നവർ
  rationale: റോമൻ ഭരണസന്ദർഭത്തിലെ ചുങ്കം/നികുതി പിരിവുകാരെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി സൂചിപ്പിക്കുന്നു; തൊഴിൽവിഭാഗത്തോടുണ്ടായിരുന്ന സാമൂഹിക അപകീർത്തി വാചകത്തിൽ കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: ἁμαρτωλῶν
  choice: പാപികൾ
  rationale: ഗ്രീക്ക് പദത്തിന്റെ നേരിട്ടുള്ളതും സ്ഥാപിതവുമായ തർജമ; സാമൂഹികമായും ധാർമികമായും അടയാളപ്പെടുത്തിയ കൂട്ടം എന്ന സന്ദർഭസൂചനയെ വിശദീകരിച്ച് ചേർത്തിട്ടില്ല.
- source_word: ἐσθίει
  choice: ഭക്ഷണം കഴിക്കുന്നത്
  rationale: വർത്തമാനകാല ചോദ്യത്തിന്റെ അടിസ്ഥാന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘വിരുന്നുണ്ണുക’ പോലുള്ള അധിക ഔപചാരികത ഒഴിവാക്കുന്നു.
- source_word: διδάσκαλος
  choice: ഗുരു
  rationale: ഈ സന്ദർഭത്തിലെ പഠിപ്പിക്കുന്നവനും ശിഷ്യന്മാരുമായുള്ള ബന്ധം ചുരുക്കത്തിലും സ്വാഭാവികമായും പ്രകടമാക്കുന്നു; ‘റബ്ബി’ എന്ന ലിപ്യന്തരണം ഗ്രീക്കിൽ ഇല്ലാത്ത പ്രത്യേകത ചേർക്കും.
theological_decisions:
- issue: ‘കണ്ടു’ എന്ന ക്രിയയുടെ വ്യക്തമാക്കാത്ത കർമം
  choice: പ്രധാനവാചകത്തിൽ ‘അതു’ ചേർത്ത്, ഗ്രീക്കിൽ കർമം വ്യക്തമല്ലെന്ന് അടിക്കുറിപ്പിൽ അറിയിച്ചു.
  alternative: ‘ഇതു കണ്ട ഫരിസേയർ’ അല്ലെങ്കിൽ ‘കണ്ടപ്പോൾ’ എന്നു മാത്രം നൽകുക.
  rationale: മലയാളത്തിൽ ‘അതു കണ്ടപ്പോൾ’ സ്വാഭാവികമാണ്; ‘അതു’ മുൻസന്ദർഭത്തിലെ ഭക്ഷണരംഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്. അടിക്കുറിപ്പ് മൂലപാഠത്തിലെ പരോക്ഷത സംരക്ഷിക്കുന്നു.
- issue: ἔλεγον എന്ന അപൂർണഭൂതകാലത്തിന്റെ ഭാവം
  choice: സ്വാഭാവികമായ സംഭാഷണപരിചയപ്പെടുത്തലായി ‘ചോദിച്ചു’ എന്നു നൽകി.
  alternative: ‘ചോദിച്ചുകൊണ്ടിരുന്നു’ അല്ലെങ്കിൽ ‘പറയുകയായിരുന്നു’.
  rationale: ഇവിടെ അപൂർണഭൂതകാലം തുടർച്ചയോ ആവർത്തനമോ നിർബന്ധമായി പഠിപ്പിക്കുന്നില്ല. പുരോഗമനരൂപം മലയാളത്തിൽ അനാവശ്യമായ ആവർത്തനധ്വനി സൃഷ്ടിക്കാം; അതിനാൽ ആഖ്യാനത്തിലെ ചോദ്യം വ്യക്തമായി നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. പഴയ ബൈബിൾഭാഷയിലെ ദുർഗ്രഹമായ രൂപങ്ങൾ ഒഴിവാക്കി; എന്നാൽ ‘ശിഷ്യൻ’, ‘ഗുരു’, ‘പാപി’ എന്നീ സ്ഥാപിതവും സന്ദർഭോചിതവുമായ പദങ്ങൾ നിലനിർത്തി.
