id: MAT.9.29
reference: Matthew 9:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τότε ἥψατο τῶν ὀφθαλμῶν αὐτῶν λέγων· Κατὰ τὴν πίστιν ὑμῶν γενηθήτω ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/029.yaml
  text: Then he touched their eyes[a], saying, “According to your faith, let it be done for you.”
translation:
  language: ml
  text: 'അപ്പോൾ അവൻ അവരുടെ കണ്ണുകൾ തൊട്ട് പറഞ്ഞു: “നിങ്ങളുടെ വിശ്വാസത്തിന്[a] അനുസരിച്ച് നിങ്ങൾക്കു സംഭവിക്കട്ടെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നിങ്ങളുടെ ആശ്രയത്തിന് അനുസരിച്ച് നിങ്ങൾക്കു സംഭവിക്കട്ടെ.” ഗ്രീക്ക് പദമായ പിസ്റ്റിസിന് ‘ആശ്രയം’ എന്നും ചില സന്ദർഭങ്ങളിൽ ‘വിശ്വസ്തത’ എന്നും അർഥമാകാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: അപ്പോൾ
  rationale: സംഭവക്രമത്തിലെ അടുത്ത നടപടി സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സംക്ഷിപ്തവുമായ ആഖ്യാനപ്രയോഗം.
- source_word: ἥψατο τῶν ὀφθαλμῶν αὐτῶν
  choice: അവരുടെ കണ്ണുകളിൽ തൊട്ടുകൊണ്ട്
  rationale: ἅπτομαι എന്ന ക്രിയയുടെ ഭൗതികമായ ‘തൊടുക’ എന്ന അർഥവും ഗ്രീക്കിലെ കണ്ണുകളെ സൂചിപ്പിക്കുന്ന ജനിറ്റീവ് ബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ പകർന്നു നൽകുന്നു.
- source_word: λέγων
  choice: പറഞ്ഞു
  rationale: പ്രധാനക്രിയയോടൊപ്പം നടക്കുന്ന സംസാരത്തെ സ്വാഭാവിക മലയാള ആഖ്യാനശൈലിയിൽ അവതരിപ്പിക്കുന്നു; ‘തൊട്ടുകൊണ്ട്’ എന്ന രൂപം പ്രവൃത്തികളുടെ സമകാലികബന്ധം നിലനിർത്തുന്നു.
- source_word: Κατὰ τὴν πίστιν ὑμῶν
  choice: നിങ്ങളുടെ വിശ്വാസത്തിന് അനുസരിച്ച്
  rationale: κατά ഇവിടെ അളവിനോ പൊരുത്തത്തിനോ അനുസൃതമായ അർഥം നൽകുന്നു; കാരണം എന്ന ശക്തമായ ആശയം ചേർക്കാതെ അത് നിലനിർത്തുന്നു. πίστις-ന് മുഖ്യപാഠത്തിൽ പതിവായ ‘വിശ്വാസം’ ഉപയോഗിച്ചു.
- source_word: γενηθήτω ὑμῖν
  choice: നിങ്ങൾക്കു സംഭവിക്കട്ടെ
  rationale: γίνομαι എന്ന ക്രിയയുടെ അർഥവും മൂന്നാംപുരുഷ ആജ്ഞാരൂപത്തിന്റെ പ്രഖ്യാപനസ്വഭാവവും മലയാളത്തിലെ ‘സംഭവിക്കട്ടെ’ നിലനിർത്തുന്നു; ὑμῖν ഗുണഭോക്താവിനെ ‘നിങ്ങൾക്കു’ എന്നു വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: രോഗശാന്തിസന്ദർഭത്തിലെ πίστις എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: വിശ്വാസം
  alternative: ആശ്രയം / വിശ്വാസ്യത
  rationale: സന്ദർഭത്തിൽ അന്ധന്മാർ യേശുവിൽ വെച്ച ആശ്രയവും ഉറപ്പുമാണ് മുൻനിൽക്കുന്നത്. എങ്കിലും πίστις എന്ന പദത്തിന്റെ പതിവായും വ്യാപകമായും ഉള്ള അർഥം നിലനിർത്താൻ മുഖ്യപാഠത്തിൽ ‘വിശ്വാസം’ സ്വീകരിച്ചു; ‘ആശ്രയം’ എന്ന പ്രസക്തമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു. ‘വിശ്വാസ്യത’ ഇവിടെ നിഘണ്ടുപരമായി സാധ്യമെങ്കിലും ഈ സന്ദർഭത്തിൽ സാധ്യത കുറവാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ വാക്യക്രമം യാന്ത്രികമായി അനുകരിക്കാതെ, പ്രവൃത്തിയും സംസാരവും തമ്മിലുള്ള ബന്ധം ‘തൊട്ടുകൊണ്ട് പറഞ്ഞു’ എന്ന സ്വാഭാവിക ഘടനയിൽ നൽകി. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
