id: MAT.9.9
reference: Matthew 9:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ παράγων ὁ Ἰησοῦς ἐκεῖθεν εἶδεν ἄνθρωπον καθήμενον ἐπὶ τὸ τελώνιον, Μαθθαῖον λεγόμενον, καὶ λέγει αὐτῷ· Ἀκολούθει μοι· καὶ ἀναστὰς ἠκολούθησεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/009.yaml
  text: And as Jesus was passing on from there[a], he saw a man called Matthew sitting at the tax booth, and he says to him[c][b], “Follow me.” And he rose and followed him.
translation:
  language: ml
  text: യേശു അവിടെനിന്ന് കടന്നുപോകുമ്പോൾ, ചുങ്കം പിരിക്കുന്ന സ്ഥലത്ത് ഇരിക്കുന്ന മത്തായി എന്നു പേരുള്ള[a] ഒരു മനുഷ്യനെ കണ്ടു. യേശു അവനോട്, “എന്നെ അനുഗമിക്കുക,” എന്നു പറയുന്നു[b]. അവൻ എഴുന്നേറ്റ്[c] യേശുവിനെ അനുഗമിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “മത്തായി എന്നു വിളിക്കപ്പെടുന്ന.”'
    reason: lexical_alternative
  - marker: b
    text: “പറഞ്ഞു” എന്നും വിവർത്തനം ചെയ്യാം; ഗ്രീക്കിൽ കഥയ്ക്ക് സജീവത നൽകുന്ന ചരിത്രവർത്തമാനകാലമാണ് (“പറയുന്നു”) ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: 'അഥവാ: “അവൻ എഴുന്നേറ്റു യേശുവിനെ അനുഗമിച്ചു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: παράγων ... ἐκεῖθεν
  choice: അവിടെനിന്ന് കടന്നുപോകുമ്പോൾ
  rationale: വർത്തമാനകാല കൃദന്തരൂപം സൂചിപ്പിക്കുന്ന തുടർന്നുകൊണ്ടിരുന്ന ചലനവും ἐκεῖθεν എന്ന സ്ഥലസൂചനയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἄνθρωπον
  choice: ഒരു മനുഷ്യനെ
  rationale: ഒരു നിർദിഷ്ട പുരുഷനെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘മനുഷ്യൻ’ സ്വാഭാവികവും മൂലപദത്തോട് അടുത്തതുമാണ്.
- source_word: καθήμενον ἐπὶ τὸ τελώνιον
  choice: ചുങ്കപ്പിരിവുസ്ഥലത്ത് ഇരിക്കുന്ന
  rationale: τελώνιον നികുതിയോ ചുങ്കമോ പിരിക്കുന്ന ഇരിപ്പിടത്തെ സൂചിപ്പിക്കുന്നു. പുരാതന പശ്ചാത്തലത്തിൽ ‘നികുതി ഓഫീസ്’ എന്ന ആധുനിക സ്ഥാപനധ്വനി ഒഴിവാക്കാൻ ‘ചുങ്കപ്പിരിവുസ്ഥലം’ ഉപയോഗിച്ചു.
- source_word: Μαθθαῖον λεγόμενον
  choice: മത്തായി എന്നു പേരുള്ള
  rationale: അയാൾ അറിയപ്പെട്ടിരുന്ന പേര് സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘മത്തായി എന്നു വിളിക്കപ്പെടുന്ന’ എന്ന കൂടുതൽ അക്ഷരാർഥപരമായ രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: λέγει αὐτῷ
  choice: യേശു അവനോട് ... എന്നു പറയുന്നു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനകാലം കഥയ്ക്ക് നൽകുന്ന സജീവത നിലനിർത്താൻ ‘പറയുന്നു’ ഉപയോഗിച്ചു. മലയാളത്തിൽ സർവനാമസന്ദിഗ്ധത ഒഴിവാക്കാൻ കർത്താവായ യേശുവിന്റെ പേര് ആവർത്തിച്ചു.
- source_word: Ἀκολούθει μοι
  choice: എന്നെ അനുഗമിക്കുക
  rationale: യേശുവിന്റെ നേരിട്ടുള്ള ആഹ്വാനം അധിക വിശദീകരണം ചേർക്കാതെ വിവർത്തനം ചെയ്യുന്നു; ശിഷ്യത്വത്തിന്റെ സൂചന ക്രിയയിൽത്തന്നെ നിലനിൽക്കുന്നു.
- source_word: ἀναστὰς
  choice: അവൻ എഴുന്നേറ്റ്
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള ഉടനെയുള്ള പ്രവർത്തനക്രമം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἠκολούθησεν αὐτῷ
  choice: യേശുവിനെ അനുഗമിച്ചു
  rationale: അക്ഷരാർഥത്തിലുള്ള പിന്തുടരലും ശിഷ്യത്വസൂചനയും ഒരുപോലെ നിലനിർത്തുന്നു. മലയാളത്തിൽ ‘അവനെ’ എന്നതുകൊണ്ട് ഉണ്ടാകാവുന്ന സൂചനാസന്ദിഗ്ധത ഒഴിവാക്കാൻ യേശുവിന്റെ പേര് ഉപയോഗിച്ചു.
theological_decisions:
- issue: മത്തായിയോടുള്ള യേശുവിന്റെ ആഹ്വാനത്തിന്റെ സ്വഭാവം
  choice: Ἀκολούθει μοι എന്നത് ‘എന്നെ അനുഗമിക്കുക’ എന്നു ലളിതമായി വിവർത്തനം ചെയ്തു.
  alternative: ‘വന്ന് എന്റെ ശിഷ്യനാകുക’ / ‘എന്നോടു ചേരുക’
  rationale: ഈ സംഭവം ശിഷ്യത്വത്തിലേക്കുള്ള വിളിയാണെങ്കിലും, ഗ്രീക്കിൽ നേരിട്ട് ഇല്ലാത്ത വിശദീകരണം ചേർക്കാതെ ആഹ്വാനത്തിന്റെ തുറന്നതും ശക്തവുമായ രൂപം സംരക്ഷിക്കുന്നു.
- issue: ചരിത്രവർത്തമാനകാലത്തിന്റെ അവതരണം
  choice: λέγει എന്നത് ‘പറയുന്നു’ എന്നു വർത്തമാനകാലത്തിൽ നിലനിർത്തി.
  alternative: ‘പറഞ്ഞു’
  rationale: കഥാവിവരണത്തിൽ ഗ്രീക്ക് ഉപയോഗിക്കുന്ന ചരിത്രവർത്തമാനകാലത്തിന്റെ സജീവത സംരക്ഷിക്കുന്നു; ഭൂതകാലരൂപവും അർഥപരമായി സാധ്യമാണെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി ഉപയോഗിച്ചു. ‘ചുങ്കപ്പിരിവുസ്ഥലം’ പുരാതന നികുതി/ചുങ്ക ശേഖരണകേന്ദ്രത്തെ സാധാരണ വായനക്കാരന് വ്യക്തമാക്കുന്നു. സർവനാമങ്ങളുടെ സാധ്യതയുള്ള ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ രണ്ടു സ്ഥലങ്ങളിൽ ‘യേശു’ എന്ന പേര് ആവർത്തിച്ചിട്ടുണ്ടെങ്കിലും മൂലവാക്യത്തിന്റെ അർഥക്രമം മാറ്റിയിട്ടില്ല.
