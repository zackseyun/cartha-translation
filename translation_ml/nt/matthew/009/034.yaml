id: MAT.9.34
reference: Matthew 9:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι ἔλεγον· Ἐν τῷ ἄρχοντι τῶν δαιμονίων ἐκβάλλει τὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/034.yaml
  text: But the Pharisees were saying[a], “By the ruler of the demons he casts out the demons.”
translation:
  language: ml
  text: 'എന്നാൽ പരീശന്മാർ പറഞ്ഞുകൊണ്ടിരുന്നു: “ഭൂതങ്ങളുടെ അധിപനെക്കൊണ്ടാണ് ഇവൻ ഭൂതങ്ങളെ പുറത്താക്കുന്നത്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ ജനക്കൂട്ടത്തിന്റെ അനുകൂല പ്രതികരണത്തോട് പരീശന്മാരുടെ വിരുദ്ധമായ വ്യാഖ്യാനത്തെ ബന്ധിപ്പിക്കുന്ന പ്രതികൂല ഭാവം വ്യക്തമാക്കുന്നു.
- source_word: Φαρισαῖοι
  choice: പരീശന്മാർ
  rationale: ഈ യഹൂദ മതവിഭാഗത്തിന് ആധുനിക മലയാള ബൈബിൾ ഭാഷയിൽ സുപരിചിതവും സ്വാഭാവികവുമായ രൂപം.
- source_word: ἔλεγον
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണ്ണഭൂതകാലത്തിന്റെ തുടർച്ചയായതോ ആവർത്തിച്ചിരുന്നതോ ആയ ഭാവം നിലനിർത്തുന്നു.
- source_word: Ἐν τῷ ἄρχοντι
  choice: അധിപനെക്കൊണ്ടാണ്
  rationale: ἐν + ചതുർത്ഥി ഇവിടെ ഉപാധി അഥവാ പ്രവർത്തനശക്തിയുടെ ഉറവിടം സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘-നെക്കൊണ്ട്’ അത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἄρχοντι
  choice: അധിപൻ
  rationale: അധികാരമുള്ള ഭരണാധികാരി അഥവാ തലവൻ എന്ന അർഥം വ്യക്തമായി നൽകുന്നു; രാജകീയ പദവി അനാവശ്യമായി സൂചിപ്പിക്കുന്നില്ല.
- source_word: τῶν δαιμονίων / τὰ δαιμόνια
  choice: ഭൂതങ്ങളുടെ / ഭൂതങ്ങളെ
  rationale: δαιμόνια എന്ന പദത്തെ ‘ദുരാത്മാക്കൾ’ എന്നു പൊതുവാക്കാതെ, അതിന്റെ പ്രത്യേകമായ അതീന്ദ്രിയ അർഥം നിലനിർത്തുന്ന പരിചിത മലയാളപദം.
- source_word: ἐκβάλλει
  choice: പുറത്താക്കുന്നു
  rationale: ഭൂതോച്ചാടനസന്ദർഭത്തിലെ ബലപ്രയോഗത്തോടെ നീക്കുക എന്ന അർഥം വ്യക്തവും സ്വാഭാവികവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: δαιμόνια എന്ന പദത്തിന്റെ ഭൂതോച്ചാടനസന്ദർഭത്തിലെ വിവർത്തനം
  choice: ഭൂതങ്ങൾ
  alternative: ദുരാത്മാക്കൾ
  rationale: മൂലപദം πνεύματα അല്ല, δαιμόνια തന്നെയാണ്; അതിനാൽ പാഠത്തിലെ പ്രത്യേക അതീന്ദ്രിയ അവകാശവാദം മയപ്പെടുത്താതെ ‘ഭൂതങ്ങൾ’ എന്ന് നൽകുന്നു.
- issue: യേശുവിന്റെ ശക്തിയുടെ ഉറവിടത്തെക്കുറിച്ചുള്ള പരീശന്മാരുടെ ആരോപണം
  choice: ‘അധിപനെക്കൊണ്ടാണ്’ എന്ന ഉപാധിസൂചന നേരിട്ട് നിലനിർത്തി
  alternative: ‘അധിപന്റെ ശക്തിയാൽ’
  rationale: പരീശന്മാരുടെ ആരോപണം വിശദീകരിച്ച് വിപുലീകരിക്കാതെ, ἐν τῷ ἄρχοντι എന്നതിലെ ഉപാധി/കാര്യകർത്തൃഭാവം സംക്ഷിപ്തമായി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. ‘പറഞ്ഞുകൊണ്ടിരുന്നു’ എന്നത് ഗ്രീക്ക് അപൂർണ്ണഭൂതകാലത്തിന്റെ ഭാവം സൂക്ഷിക്കുന്നു. ‘ഇവൻ’ സന്ദർഭത്തിലെ വിരോധപരമായ പരാമർശഭാവം സ്വാഭാവികമായി നൽകുന്നു; അപമാനഭാവം അതിരുകടത്തി ചേർക്കുന്നില്ല.
