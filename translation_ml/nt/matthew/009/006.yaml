id: MAT.9.6
reference: Matthew 9:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἵνα δὲ εἰδῆτε ὅτι ἐξουσίαν ἔχει ὁ υἱὸς τοῦ ἀνθρώπου ἐπὶ τῆς γῆς ἀφιέναι ἁμαρτίας— τότε λέγει τῷ παραλυτικῷ· ⸀Ἐγερθεὶς ἆρόν σου τὴν κλίνην καὶ ὕπαγε εἰς τὸν οἶκόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/006.yaml
  text: But so that you may know that the Son of Man has authority on earth to forgive sins”—then he says to the paralytic[a], “Get up, pick up your bed[b], and go to your house.”
translation:
  language: ml
  text: '“എന്നാൽ ഭൂമിയിൽ പാപങ്ങൾ ക്ഷമിക്കാൻ മനുഷ്യപുത്രന് അധികാരമുണ്ടെന്ന് നിങ്ങൾ അറിയേണ്ടതിന്”—അപ്പോൾ അവൻ തളർവാതം ബാധിച്ചവനോട്[a] പറയുന്നു: “എഴുന്നേറ്റ് നിന്റെ കിടക്ക[b] എടുത്ത് നിന്റെ വീട്ടിലേക്കു പോകുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തളർവാതം ബാധിച്ചവൻ’ എന്നതിന് ‘പക്ഷാഘാതം ബാധിച്ചവൻ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘കിടക്ക’ എന്നതിന് ‘പായ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദം കിടക്ക, മഞ്ചം, അല്ലെങ്കിൽ കിടക്കാനുള്ള പായ എന്നിവയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ εἰδῆτε
  choice: എന്നാൽ … നിങ്ങൾ അറിയേണ്ടതിന്
  rationale: δέ സൂചിപ്പിക്കുന്ന നേരിയ വൈരുധ്യവും ἵνα അവതരിപ്പിക്കുന്ന ഉദ്ദേശ്യവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐξουσίαν ἔχει
  choice: അധികാരമുണ്ട്
  rationale: ഇവിടെ ഉദ്ദേശിക്കുന്നത് വെറും കഴിവല്ല, പാപങ്ങൾ ക്ഷമിക്കാനുള്ള സാധുവായ അധികാരമാണ്.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: യേശുവിന്റെ സ്ഥാപിതമായ സ്വയംവിശേഷണവും ദാനിയേൽ 7-നോടുള്ള സാധ്യതയുള്ള പ്രതിധ്വനിയും സംരക്ഷിക്കുന്നു.
- source_word: ἐπὶ τῆς γῆς
  choice: ഭൂമിയിൽ
  rationale: ഈ സന്ദർഭത്തിലെ സ്ഥലപരമായ അർഥം നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: ἀφιέναι ἁμαρτίας
  choice: പാപങ്ങൾ ക്ഷമിക്കാൻ
  rationale: ഈ സന്ദർഭത്തിൽ ἀφίημι എന്നതിന്റെ വ്യക്തമായ അർഥം പാപങ്ങൾ ക്ഷമിക്കുക എന്നതാണ്.
- source_word: τότε λέγει
  choice: അപ്പോൾ അവൻ … പറയുന്നു
  rationale: τότε എന്നതിന്റെ ക്രമസൂചനയും λέγει എന്ന ചരിത്രവർത്തമാനത്തിന്റെ ആഖ്യാനസജീവതയും നിലനിർത്തുന്നു.
- source_word: τῷ παραλυτικῷ
  choice: തളർവാതം ബാധിച്ചവനോട്
  rationale: നാമമായി ഉപയോഗിച്ചിരിക്കുന്ന വിശേഷണത്തെ സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അവതരിപ്പിക്കുന്നു; മൂലത്തിൽ ലിംഗസൂചന നൽകുന്ന നാമം ആവർത്തിക്കുന്നില്ല.
- source_word: Ἐγερθεὶς
  choice: എഴുന്നേറ്റ്
  rationale: രൂപത്തിൽ ഭൂതകാല കൃദന്തമായിരുന്നാലും തുടർന്നുള്ള കല്പനകളോടൊപ്പം കല്പനാസമാനമായ അർഥത്തിലാണ്; മലയാളത്തിൽ ‘എഴുന്നേറ്റ്’ അതു സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἆρόν
  choice: എടുത്ത്
  rationale: കിടക്ക ഉയർത്തിയെടുത്ത് കൊണ്ടുപോകാനുള്ള കല്പനയെ ലളിതമായി അറിയിക്കുന്നു.
- source_word: κλίνην
  choice: കിടക്ക
  rationale: κλίνη എന്ന പദത്തിന്റെ കിടക്ക, ശയനപ്പലക, പായ തുടങ്ങിയ അർഥങ്ങളിൽ ഏറ്റവും വിശാലവും സ്വാഭാവികവുമായ മലയാളപദം.
- source_word: ὕπαγε
  choice: പോകുക
  rationale: നേരിട്ടുള്ള യാത്രാകല്പനയെ മാന്യവും വ്യക്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: εἰς τὸν οἶκόν σου
  choice: നിന്റെ വീട്ടിലേക്കു
  rationale: οἶκος എന്നതിന്റെ സ്ഥലപരമായ അർഥവും σου എന്ന ഉടമസ്ഥസൂചനയും വ്യക്തമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου എന്ന ക്രിസ്തുശാസ്ത്രപരമായ വിശേഷണം
  choice: മനുഷ്യപുത്രൻ
  alternative: മനുഷ്യനായവൻ
  rationale: പരമ്പരാഗത വിശേഷണം യേശുവിന്റെ സ്വയംവിശേഷണസ്വഭാവവും ദാനിയേൽ 7-നോടുള്ള അന്തർപാഠബന്ധത്തിന്റെ സാധ്യതയും നിലനിർത്തുന്നു; വ്യാഖ്യാനപരമായ പരാവർത്തനത്തിലൂടെ അർഥം ചുരുക്കുന്നില്ല.
- issue: പാപങ്ങൾ ക്ഷമിക്കുന്നതിലെ ἐξουσίαയുടെ സ്വഭാവം
  choice: അധികാരം
  alternative: ശക്തി / അവകാശം
  rationale: വാക്യം ഊന്നുന്നത് അത്ഭുതം ചെയ്യാനുള്ള കഴിവിൽ മാത്രമല്ല, പാപങ്ങൾ ക്ഷമിക്കാനുള്ള സാധുവായ അധികാരത്തിലാണ്; അതിനാൽ ‘അധികാരം’ അർഥപരിധി കൃത്യമായി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ചരിത്രവർത്തമാനം ‘പറയുന്നു’ എന്നു നിലനിർത്തി. മൂലവാക്യത്തിലെ ഇടയ്ക്കുള്ള വാക്യഭംഗം ദീർഘരേഖയിലൂടെ സൂക്ഷിച്ചു; തലക്കെട്ടിന്റെയും κλίνηയുടെയും യഥാർഥ പദവ്യാപ്തി അടിക്കുറിപ്പുകളിൽ രേഖപ്പെടുത്തി.
