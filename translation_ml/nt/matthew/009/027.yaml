  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ παράγοντι ἐκεῖθεν τῷ Ἰησοῦ ἠκολούθησαν ⸀αὐτῷ δύο τυφλοὶ κράζοντες καὶ λέγοντες· Ἐλέησον ἡμᾶς, ⸀υἱὲ Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/027.yaml
  text: And as Jesus was passing on from there[a], two blind men followed him, crying out and saying, “Have mercy on us, Son of David.”
translation:
  language: ml
  text: 'യേശു അവിടെനിന്ന് മുന്നോട്ടു പോകുമ്പോൾ, കാഴ്ചയില്ലാത്ത രണ്ടു പുരുഷന്മാർ അവനെ അനുഗമിച്ച് ഉറക്കെ വിളിച്ചുപറഞ്ഞു: “ദാവീദിന്റെ പുത്രാ,[a] ഞങ്ങളോടു കരുണ കാണിക്കണമേ!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ദാവീദിന്റെ പുത്രൻ” എന്നത് രാജകീയ-മശിഹാ തലക്കെട്ടാണ്; ദാവീദിന്റെ വംശത്തിൽനിന്ന് വരുമെന്ന് വാഗ്ദാനം ചെയ്യപ്പെട്ട അവകാശിയായി ഇത് യേശുവിനെ തിരിച്ചറിയിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: παράγοντι ἐκεῖθεν
  choice: അവിടെനിന്ന് യാത്ര തുടരുമ്പോൾ
  rationale: വർത്തമാനകാല കൃദന്തരൂപം യേശു ആ സ്ഥലത്തുനിന്ന് മുന്നോട്ടു നീങ്ങിക്കൊണ്ടിരിക്കെ നടന്ന സമകാലിക സംഭവത്തെ സൂചിപ്പിക്കുന്നു. ‘യാത്ര തുടരുമ്പോൾ’ ആഖ്യാനത്തിന്റെ ഒഴുക്ക് സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἠκολούθησαν αὐτῷ
  choice: അവനെ അനുഗമിച്ച്
  rationale: ഇവിടെ ἀκολουθέω ശാരീരികമായി പിന്നാലെ ചെല്ലുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘അനുഗമിച്ച്’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: δύο τυφλοὶ
  choice: കാഴ്ചയില്ലാത്ത രണ്ടു പുരുഷന്മാർ
  rationale: പുരുഷലിംഗ ബഹുവചന വിശേഷണത്തിൽ അന്തർലീനമായ നാമം വ്യക്തമാക്കാൻ ‘പുരുഷന്മാർ’ ചേർത്തു. ‘കാഴ്ചയില്ലാത്ത’ എന്നത് ആധുനിക മലയാളത്തിൽ മാന്യവും വ്യക്തവുമായ പ്രയോഗമാണ്.
- source_word: κράζοντες καὶ λέγοντες
  choice: ഉറക്കെ വിളിച്ചുപറഞ്ഞു
  rationale: രണ്ടു കൃദന്തരൂപങ്ങളുടെയും ഉച്ചത്തിലുള്ള അടിയന്തര അഭ്യർഥന എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ ഒറ്റ സംയുക്തക്രിയയിലൂടെ സംരക്ഷിക്കുന്നു.
- source_word: Ἐλέησον ἡμᾶς
  choice: ഞങ്ങളോടു കരുണ കാണിക്കണമേ
  rationale: കരുണാപൂർവമായ പ്രവൃത്തിക്കായുള്ള നേരിട്ടുള്ള അഭ്യർഥനയെ മാന്യമായ അപേക്ഷാരൂപത്തിൽ കൃത്യമായി അവതരിപ്പിക്കുന്നു.
- source_word: υἱὲ Δαυίδ
  choice: ദാവീദിന്റെ പുത്രാ
  rationale: മത്തായിയിൽ രാജകീയ-മശിഹാ പ്രാധാന്യമുള്ള പരമ്പരാഗത അഭിസംബോധന അതേ തലക്കെട്ടായി സംരക്ഷിക്കുന്നു; വെറും വംശജനെന്ന വിശദീകരണത്തിലേക്ക് ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: ‘ദാവീദിന്റെ പുത്രൻ’ എന്ന അഭിസംബോധനയുടെ മശിഹാ പ്രാധാന്യം
  choice: മുഖ്യപാഠത്തിൽ ‘ദാവീദിന്റെ പുത്രാ’ എന്ന തലക്കെട്ട് നിലനിർത്തി
  alternative: ‘ദാവീദിന്റെ വംശജനേ’ അല്ലെങ്കിൽ ‘മശിഹയായ ദാവീദിന്റെ പുത്രാ’
  rationale: ഗ്രീക്ക് പാഠം വിശദീകരണം ചേർക്കാതെ പരമ്പരാഗത തലക്കെട്ടാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ മശിഹാ അവകാശവാദത്തിന്റെ ഭാരം നിലനിർത്തുകയും അധിക വ്യാഖ്യാനം അടിച്ചേൽപ്പിക്കാതിരിക്കുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. അപേക്ഷയിൽ ‘ണമേ’ ഉപയോഗിച്ച് അടിയന്തരതയും ആദരവും നിലനിർത്തി; അനാവശ്യമായ സഭാപരമോ വിഭാഗീയമോ ആയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
