id: MAT.9.13
reference: Matthew 9:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πορευθέντες δὲ μάθετε τί ἐστιν· Ἔλεος θέλω καὶ οὐ θυσίαν· οὐ γὰρ ἦλθον καλέσαι δικαίους ἀλλὰ ⸀ἁμαρτωλούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/013.yaml
  text: 'But go and learn what this means: ‘I desire mercy and not sacrifice.’ For I did not come to call the righteous[c][b][a], but sinners.'
translation:
  language: ml
  text: എന്നാൽ, ‘കരുണയാണ് ഞാൻ ആഗ്രഹിക്കുന്നത്, യാഗമല്ല’ എന്നതിന്റെ അർഥം എന്തെന്നു പോയി പഠിക്കുവിൻ.[a][b] കാരണം, നീതിമാന്മാരെയല്ല, പാപികളെയാണ് വിളിക്കാനായി ഞാൻ വന്നത്.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദശഃ: “ഇത് എന്താണ് എന്നു പഠിക്കുവിൻ.”'
    reason: lexical_alternative
  - marker: b
    text: ഹോശേയ 6:6-ൽ നിന്നുള്ള ഉദ്ധരണി.
    reason: cross_reference
  - marker: c
    text: അഥവാ, “തങ്ങൾ നീതിമാന്മാരാണെന്ന് കരുതുന്നവരെ” എന്ന ആശയം ഇവിടെ ഉണ്ടായേക്കാം; ഗ്രീക്കിൽ “നീതിമാന്മാരെ” എന്നു മാത്രമാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: πορευθέντες δὲ
  choice: എന്നാൽ നിങ്ങൾ പോയി
  rationale: തുടർന്നുള്ള ആജ്ഞയായ μάθετε-യോടു ചേർന്ന് ആജ്ഞാസ്വഭാവത്തിൽ വരുന്ന ഗ്രീക്ക് പ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ ‘പോയി ... പഠിക്കുവിൻ’ എന്നു നൽകി; δὲ സന്ദർഭത്തിലെ എതിർഭാവം സൂചിപ്പിക്കാൻ ‘എന്നാൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: μάθετε τί ἐστιν
  choice: എന്നതിന്റെ അർഥം എന്തെന്നു പഠിക്കുവിൻ
  rationale: പദശഃ ‘ഇത് എന്താകുന്നു’ എന്നതിലുപരി ഉദ്ധരണിയുടെ പ്രസക്തി ഗ്രഹിക്കാൻ ആവശ്യപ്പെടുന്ന ശാസനാഭാവം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; കൂടുതൽ പദശഃ രൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: Ἔλεος
  choice: കരുണ
  rationale: ἔλεος സൂചിപ്പിക്കുന്ന ദയയും അനുകമ്പാപൂർവമായ പ്രവൃത്തിയും സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; ഹോശേയയിലെ പ്രവാചകീയ നൈതിക ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: θέλω
  choice: ഞാൻ ആഗ്രഹിക്കുന്നത്
  rationale: ദൈവിക ഇച്ഛയെ മാന്യവും സ്വാഭാവികവുമായ ഭാഷയിൽ പ്രകടമാക്കുന്നു.
- source_word: θυσίαν
  choice: യാഗം
  rationale: ബലികർമത്തെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗതവും വ്യാപകമായി മനസ്സിലാകുന്നതുമായ പദം; ഗ്രീക്കിലെ ഏകവചനം നിലനിർത്തുന്നു.
- source_word: οὐ γὰρ ἦλθον καλέσαι
  choice: വിളിക്കാനല്ല ... ഞാൻ വന്നത്
  rationale: യേശുവിന്റെ ദൗത്യത്തെക്കുറിച്ചുള്ള ലളിത ഭൂതകാല പ്രസ്താവനയും καλέω-യുടെ വിശാലമായ വിളി/ക്ഷണം എന്ന സാധ്യതയും നിലനിർത്തുന്നു.
- source_word: δικαίους
  choice: നീതിമാന്മാരെ
  rationale: ഗ്രീക്കിലെ substantival adjective നേരിട്ട് നൽകുന്നു; യഥാർഥ നീതിമാന്മാരോ സ്വയം നീതിമാന്മാരെന്ന് കരുതുന്നവരോ എന്ന് മുഖ്യപാഠത്തിൽ തീരുമാനിക്കുന്നില്ല.
- source_word: ἁμαρτωλούς
  choice: പാപികളെ
  rationale: ഗ്രീക്കിലെ തീവ്രമായ നൈതിക വൈരുധ്യം ചുരുക്കമായും പതിവായും പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ഹോശേയ 6:6-ലെ ഉദ്ധരണിയുടെ വ്യാപ്തി
  choice: ‘കരുണയാണ് ഞാൻ ആഗ്രഹിക്കുന്നത്, യാഗമല്ല’ എന്ന പ്രവാചകീയ വൈരുധ്യം നേരിട്ട് നിലനിർത്തി.
  alternative: ദൈവം എല്ലാത്തരം യാഗങ്ങളെയും സമ്പൂർണമായി നിരസിക്കുന്നു എന്നോ, ഇവിടെ കരുണയ്ക്ക് ചെറിയ മുൻഗണന മാത്രമാണെന്നോ വിശദീകരിച്ച് പരിഭാഷപ്പെടുത്തുക.
  rationale: ഗ്രീക്ക് വാചകം കരുണയും യാഗവും തമ്മിലുള്ള മൂർച്ചയുള്ള മുൻഗണന നിലനിർത്തുന്നു; എന്നാൽ എല്ലാ യാഗങ്ങളെയും കുറിച്ചുള്ള സമ്പൂർണ ദൈവശാസ്ത്രവിധി വാചകത്തിലേക്ക് ചേർക്കുന്നില്ല.
- issue: ‘നീതിമാന്മാർ’ എന്നതിന്റെ സൂചന
  choice: മുഖ്യപാഠത്തിൽ ‘നീതിമാന്മാർ’ എന്നു മാത്രം നൽകി.
  alternative: ‘തങ്ങൾ നീതിമാന്മാരാണെന്ന് കരുതുന്നവർ’ അഥവാ ‘സ്വയനീതിക്കാർ’ എന്നു വ്യാഖ്യാനിച്ചു നൽകുക.
  rationale: സന്ദർഭത്തിൽ പരിഹാസമോ പരോക്ഷവിമർശനമോ ഉണ്ടായേക്കാം; എങ്കിലും ഗ്രീക്ക് പദം അതു തുറന്നു പറയാത്തതിനാൽ യഥാർഥ ആശയദ്വയാർത്ഥം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച മാന്യഭാഷയാണ് ഉപയോഗിച്ചത്. ഉദ്ധരണിയിൽ ഗൗരവം നിലനിർത്തുകയും, ‘നീതിമാന്മാർ’ എന്നതിലെ വ്യാഖ്യാനസാധ്യത മുഖ്യപാഠത്തിൽ തീർപ്പാക്കാതെ അടിക്കുറിപ്പിലാക്കുകയും ചെയ്തു.
