  naturalness: ‘എന്നതിന്റെ അർഥം എന്തെന്നു പോയി പഠിക്കുവിൻ’ ആധുനിക നിലവാര മലയാളത്തിൽ സ്വാഭാവികവും, ശാസനാഭാവത്തിന് യോജിച്ചതുമാണ്. ‘നീതിമാന്മാരെയല്ല, പാപികളെയാണ്’ എന്ന സമാന്തരഘടന ഗ്രീക്കിലെ പ്രതിവിരുദ്ധത കൂടുതൽ വ്യക്തമായും സ്വാഭാവികമായും നൽകുന്നു.
