id: MAT.9.18
reference: Matthew 9:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ταῦτα αὐτοῦ λαλοῦντος αὐτοῖς ἰδοὺ ἄρχων εἷς ⸀ἐλθὼν προσεκύνει αὐτῷ λέγων ὅτι Ἡ θυγάτηρ μου ἄρτι ἐτελεύτησεν· ἀλλὰ ἐλθὼν ἐπίθες τὴν χεῖρά σου ἐπ’ αὐτήν, καὶ ζήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/018.yaml
  text: While he was saying these things to them, look, a ruler came and bowed down before him, saying, “My daughter has just died. But come and lay your hand on her, and she will live.”
translation:
  language: ml
  text: 'അവൻ അവരോടു ഈ കാര്യങ്ങൾ സംസാരിച്ചുകൊണ്ടിരിക്കുമ്പോൾ, ഇതാ, ഒരു പ്രമാണി വന്ന് അവന്റെ മുമ്പിൽ കുമ്പിട്ടു പറഞ്ഞു: “എന്റെ മകൾ ഇപ്പോഴേ മരിച്ചുപോയി. എങ്കിലും നീ വന്ന് അവളുടെമേൽ കൈ വെക്കണമേ; അവൾ ജീവിക്കും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: സംഭവത്തിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവികവും മാന്യവുമായ മലയാളരൂപം.
- source_word: ἄρχων
  choice: പ്രമാണി
  rationale: ഏതു പ്രത്യേക പദവിയാണെന്ന് വാക്യം വ്യക്തമാക്കാത്തതിനാൽ പൊതുവായ അധികാരസ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന പദം തിരഞ്ഞെടുത്തു.
- source_word: προσεκύνει
  choice: അവന്റെ മുമ്പിൽ കുമ്പിട്ടുകൊണ്ട്
  rationale: ശാരീരികമായി ആദരപൂർവം കുനിയുക/വണങ്ങുക എന്ന അർഥം നിലനിർത്തുന്നു; ഇവിടെ ആരാധന എന്ന ദൈവശാസ്ത്രപരമായ അർഥം നിർബന്ധമായി ചേർക്കുന്നില്ല.
- source_word: ἄρτι ἐτελεύτησεν
  choice: ഇപ്പോൾ മരിച്ചുപോയി
  rationale: ἄρτιയുടെ സമീപകാലസൂചനയും ἐτελεύτησεν എന്ന മരണപ്രസ്താവനയും നേരിട്ട് പകരുന്നു.
- source_word: καὶ ζήσεται
  choice: എന്നാൽ അവൾ ജീവിക്കും
  rationale: കൈ വെക്കുന്നതിനു പിന്നാലെയുള്ള ഉറച്ച പ്രതീക്ഷ പ്രകടമാക്കുന്നു; ഭാവികാലം നിലനിർത്തുന്നു.
theological_decisions:
- issue: προσκυνέω എന്ന ക്രിയയുടെ ദൈവശാസ്ത്രപരമായ പരിധി
  choice: കുമ്പിട്ടു
  alternative: ആരാധിച്ചു
  rationale: സന്ദർഭത്തിൽ ഭരണാധികാരി യേശുവിന്റെ മുമ്പിൽ ആദരപൂർവം കുനിയുന്നതാണ് വ്യക്തം; ‘ആരാധിച്ചു’ എന്നു പരിഭാഷപ്പെടുത്തി വാക്യം തന്നെ നിർണ്ണയിക്കാത്ത ദൈവശാസ്ത്ര നിഗമനം ചുമത്താതിരിക്കാൻ ഈ രൂപം സ്വീകരിച്ചു.
- issue: പ്രമാണിയുടെ മകളെക്കുറിച്ചുള്ള പ്രസ്താവന
  choice: മരിച്ചുപോയി
  alternative: മരിക്കാറായിരിക്കുന്നു
  rationale: മത്തായിയുടെ ἐτελεύτησεν വ്യക്തമായി മരണം സംഭവിച്ചതായി പറയുന്നു; സമാന്തര സുവിശേഷവിവരണങ്ങളുമായി ഒത്തുചേരാൻ ഈ വാചകം മൃദൂകരിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ഗ്രീക്ക് വാക്യത്തിന്റെ ശ്രദ്ധാകർഷകമായ ‘ഇതാ’യും പ്രമാണിയുടെ അപേക്ഷയിലെ ഉറപ്പും നിലനിർത്തി; അനാവശ്യ സാങ്കേതികമോ സഭാവിഭാഗപരമോ ആയ പദങ്ങൾ ഒഴിവാക്കി.
