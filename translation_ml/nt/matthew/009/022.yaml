id: MAT.9.22
reference: Matthew 9:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀στραφεὶς καὶ ἰδὼν αὐτὴν εἶπεν· Θάρσει, θύγατερ· ἡ πίστις σου σέσωκέν σε. καὶ ἐσώθη ἡ γυνὴ ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/022.yaml
  text: But Jesus[a], turning and seeing her, said, “Take courage, daughter[d][c][b]; your faith has saved you.” And the woman was healed from that hour.
translation:
  language: ml
  text: 'എന്നാൽ യേശു തിരിഞ്ഞ് അവളെ കണ്ടപ്പോൾ പറഞ്ഞു: “മകളേ, ധൈര്യപ്പെടൂ; നിന്റെ വിശ്വാസം[a] നിന്നെ രക്ഷിച്ചിരിക്കുന്നു.[b]” ആ സമയം മുതൽ ആ സ്ത്രീ സൗഖ്യം പ്രാപിച്ചു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വിശ്വാസം’ എന്നതിന് ഇവിടെ ‘വിശ്വാസപൂർവമായ ആശ്രയം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
  - marker: b
    text: ‘രക്ഷിച്ചിരിക്കുന്നു’ എന്നതിന് ‘സൗഖ്യമാക്കിയിരിക്കുന്നു’ അല്ലെങ്കിൽ ‘സുഖപ്പെടുത്തിയിരിക്കുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് ക്രിയയ്ക്ക് രക്ഷിക്കുക, സൗഖ്യമാക്കുക, സുഖപ്പെടുത്തുക എന്നീ അർത്ഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς καὶ ἰδὼν αὐτήν
  choice: തിരിഞ്ഞ് അവളെ കണ്ടപ്പോൾ
  rationale: രണ്ട് ഗ്രീക്ക് കൃദന്തരൂപങ്ങളുടെയും തുടർച്ചയായ പ്രവർത്തനം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; തിരിഞ്ഞ ദിശ അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: Θάρσει
  choice: ധൈര്യമായിരിക്കൂ
  rationale: ആത്മവിശ്വാസത്തോടെയും ധൈര്യത്തോടെയും ഇരിക്കാനുള്ള ആജ്ഞ സാധാരണ വായനക്കാർക്ക് നേരിട്ട് മനസ്സിലാകുന്ന വിധത്തിൽ നൽകുന്നു.
- source_word: θύγατερ
  choice: മകളേ
  rationale: സംബോധനയുടെ കുടുംബസ്നേഹവും ആർദ്രതയും അധിക വിശേഷണം ചേർക്കാതെ നിലനിർത്തുന്നു.
- source_word: πίστις
  choice: വിശ്വാസം
  rationale: ഇവിടെ യേശുവിലുള്ള ആശ്രയവിശ്വാസമാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; ‘വിശ്വാസം’ ഗ്രീക്ക് പദത്തിന്റെ വ്യാപകവും സ്ഥിരവുമായ അർത്ഥപരിധി നിലനിർത്തുന്നു.
- source_word: σέσωκέν σε
  choice: നിന്നെ രക്ഷിച്ചിരിക്കുന്നു
  rationale: σῴζω എന്ന ക്രിയയുടെ രക്ഷിക്കുക, സൗഖ്യമാക്കുക എന്നീ അർത്ഥസാധ്യതകളിൽ വിശാലമായ അർത്ഥം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; ഗ്രീക്ക് പൂർണകാലത്തിന്റെ നിലവിലുള്ള ഫലവും പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: ἐσώθη
  choice: സൗഖ്യം പ്രാപിച്ചു
  rationale: വിവരണത്തിന്റെ ഈ ഭാഗത്ത് സ്ത്രീയുടെ ശാരീരിക രോഗശാന്തിയാണ് നേരിട്ടുള്ള ഫലം; അതിനാൽ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: ആ സമയംമുതൽ
  rationale: ഗ്രീക്കിലെ സമയസൂചനയുടെ അർത്ഥം നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἡ γυνή
  choice: ആ സ്ത്രീ
  rationale: മുൻപ് പരാമർശിച്ച സ്ത്രീയിലേക്കുള്ള നിർദ്ദിഷ്ട സൂചന മലയാളത്തിൽ വ്യക്തമായി തിരിച്ചുകൊണ്ടുവരുന്നു.
theological_decisions:
- issue: πίστις എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: വിശ്വാസം
  alternative: ആശ്രയം / ഭരമേൽപ്പിക്കൽ
  rationale: സന്ദർഭത്തിൽ സജീവമായ ആശ്രയം ഉൾപ്പെട്ടിട്ടുണ്ടെങ്കിലും ‘വിശ്വാസം’ പദത്തിന്റെ വിശാലമായ ദൈവശാസ്ത്രപരവും സന്ദർഭപരവുമായ അർത്ഥം ചുരുക്കുന്നില്ല; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- issue: യേശുവിന്റെ വാക്കുകളിലും വിവരണപരമായ സമാപനത്തിലും σῴζω എന്ന ക്രിയയുടെ പരിഭാഷ
  choice: യേശുവിന്റെ വാക്കുകളിൽ ‘രക്ഷിച്ചിരിക്കുന്നു’; വിവരണത്തിൽ ‘സൗഖ്യം പ്രാപിച്ചു’
  alternative: രണ്ടിടത്തും ‘സൗഖ്യമാക്കി’ അല്ലെങ്കിൽ രണ്ടിടത്തും ‘രക്ഷിച്ചു’
  rationale: ആദ്യ പ്രയോഗത്തിൽ രക്ഷയുടെയും സൗഖ്യത്തിന്റെയും വിശാല അർത്ഥപ്രതിധ്വനി നിലനിർത്തുകയും രണ്ടാമത്തേതിൽ ഉടനെയുള്ള ശാരീരിക ഫലം വ്യക്തമാക്കുകയും ചെയ്യുന്നു; അതുവഴി ഗ്രീക്കിലെ അർത്ഥസംഘർഷം ഇല്ലാതാക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ബൈബിൾ ശൈലി. ‘മകളേ’ എന്ന സംബോധനത്തിലെ ആർദ്രതയും ‘രക്ഷിച്ചിരിക്കുന്നു’ എന്നതിലെ വിശാല അർത്ഥവും നിലനിർത്തി; അവസാന വാക്യത്തിൽ ശാരീരിക സൗഖ്യം വ്യക്തമായി പറഞ്ഞു.
