  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ⸀ἐμβὰς ⸀εἰς πλοῖον διεπέρασεν καὶ ἦλθεν εἰς τὴν ἰδίαν πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/001.yaml
  text: And after getting into a boat[a], he crossed over and came to his own city.
translation:
  language: ml
  text: അവൻ ഒരു പടകിൽ കയറി, മറുകര കടന്ന്, തന്റെ സ്വന്തം പട്ടണത്തിൽ[a] എത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവന്റെ ജന്മനാട്.’ ഗ്രീക്കിൽ ‘തന്റെ സ്വന്തം പട്ടണം’ എന്നാണ്. ആഖ്യാനത്തിന്റെ ഈ ഘട്ടത്തിൽ യേശുവുമായി ബന്ധപ്പെട്ടിരുന്ന പട്ടണത്തെയാകാം ഇത് സൂചിപ്പിക്കുന്നത്; സാധ്യതയേറിയത് കഫർന്നഹൂമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ... καὶ
  choice: പിന്നെ ... -ന്ന്
  rationale: ആവർത്തിച്ചുള്ള καί പ്രവൃത്തികളെ ലളിതമായ ആഖ്യാനക്രമത്തിൽ ബന്ധിപ്പിക്കുന്നു. മലയാളത്തിൽ ആദ്യത്തേത് ‘പിന്നെ’ എന്നും തുടർന്നുള്ളത് ക്രിയാവിന്യാസത്തിലൂടെയും സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
- source_word: ἐμβὰς
  choice: ഒരു പടകിൽ കയറി
  rationale: പ്രധാനക്രിയകൾക്കു മുമ്പ് നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന aorist participle ആണ്. ‘കയറി’ എന്ന രൂപം ആ മുൻക്രമം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: πλοῖον
  choice: ഒരു പടക്
  rationale: ഗലീലക്കടലിന്റെ പശ്ചാത്തലത്തിൽ പൊതുവായ ജലയാനത്തെ സൂചിപ്പിക്കാൻ ‘പടക്’ സ്വാഭാവികമാണ്; അനിശ്ചിതമായ നാമരൂപം ‘ഒരു’ എന്ന് നൽകി.
- source_word: διεπέρασεν
  choice: മറുകരയിലേക്കു കടന്നു
  rationale: ഒരു വശത്തുനിന്ന് മറുവശത്തേക്കു ജലമാർഗം കടക്കുന്നതെന്ന ദിശാസൂചന മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἦλθεν
  choice: എത്തി
  rationale: ഇവിടെ ἔρχομαι ലക്ഷ്യസ്ഥാനത്ത് വന്നെത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാള ആഖ്യാനത്തിൽ ‘എത്തി’ ഏറ്റവും സ്വാഭാവികമാണ്.
- source_word: τὴν ἰδίαν πόλιν
  choice: തന്റെ പട്ടണം
  rationale: ἴδιος നൽകുന്ന വ്യക്തിപരമായ ബന്ധം ‘തന്റെ’ എന്നതിലൂടെ നിലനിർത്തുന്നു; പട്ടണം ഏതെന്ന് മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കാതെ ഗ്രീക്ക് വാചകത്തിന്റെ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ‘തന്റെ പട്ടണം’ ഏതു പട്ടണമെന്ന ചോദ്യം
  choice: മുഖ്യപാഠത്തിൽ പട്ടണത്തിന്റെ പേര് പറയാതെ ‘തന്റെ പട്ടണം’ എന്നു വിവർത്തനം ചെയ്തു.
  alternative: മത്തായിയുടെ ആഖ്യാനസന്ദർഭം അടിസ്ഥാനമാക്കി ‘കഫർന്നഹൂം’ എന്നോ ‘അവന്റെ താമസസ്ഥലം’ എന്നോ വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്ക് മൂലപാഠം പട്ടണത്തിന്റെ പേര് പറയുന്നില്ല. സന്ദർഭം കഫർന്നഹൂമിനെ ശക്തമായി സൂചിപ്പിച്ചാലും, ആ തിരിച്ചറിയൽ മുഖ്യപാഠത്തിലേക്ക് ചേർക്കാതെ മൂലത്തിലെ തുറന്ന നില സംരക്ഷിക്കണം.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം ഉപയോഗിച്ചു. ഗ്രീക്കിലെ പങ്കാളിക്രിയാക്രമം മലയാളത്തിലെ തുടർക്രിയകളിലൂടെ സ്വാഭാവികമായി പുനരാവിഷ്കരിച്ചു; പട്ടണത്തിന്റെ തിരിച്ചറിയൽ മുഖ്യപാഠത്തിൽ നിർണ്ണയിച്ചിട്ടില്ല.
