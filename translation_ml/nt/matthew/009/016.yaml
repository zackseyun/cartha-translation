  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐδεὶς δὲ ἐπιβάλλει ἐπίβλημα ῥάκους ἀγνάφου ἐπὶ ἱματίῳ παλαιῷ· αἴρει γὰρ τὸ πλήρωμα αὐτοῦ ἀπὸ τοῦ ἱματίου, καὶ χεῖρον σχίσμα γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/016.yaml
  text: But no one puts a patch of unshrunk cloth on an old garment, for the patch pulls away from the garment, and a worse tear results.
translation:
  language: ml
  text: എന്നാൽ ചുരുക്കാത്ത തുണിക്കഷണം[a] ആരും പഴയ വസ്ത്രത്തിൽ ചേർക്കുന്നില്ല; കാരണം ആ കഷണം വസ്ത്രത്തിൽനിന്ന് വലിഞ്ഞുമാറുകയും കീറൽ കൂടുതൽ വഷളാകുകയും ചെയ്യും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പാകപ്പെടുത്താത്ത തുണിക്കഷണം.’ ഗ്രീക്കുപദം ഫുള്ളിങ് എന്ന പാകപ്പെടുത്തൽ പ്രക്രിയയിലൂടെ ഇനിയും ചുരുക്കാത്ത തുണിയെ സൂചിപ്പിക്കുന്നു; അതിനാൽ അത് പിന്നീട് ചുരുങ്ങുമ്പോൾ പഴയ വസ്ത്രത്തിൽ വലിവുണ്ടാക്കും.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς δὲ
  choice: എന്നാൽ ... ആരും ... ഇല്ല
  rationale: δὲ സൂചിപ്പിക്കുന്ന മൃദുവായ വൈരുധ്യവും οὐδεὶς എന്നതിന്റെ സർവസാധാരണ നിഷേധവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐπιβάλλει ἐπίβλημα
  choice: കഷണം ... ഒട്ടിച്ചുചേർക്കുന്നില്ല
  rationale: ἐπιβάλλει എന്നത് അക്ഷരാർഥത്തിൽ ‘മേൽ വെക്കുന്നു/ചേർക്കുന്നു’ എന്നാണ്; വസ്ത്രത്തിലെ കീറൽ അടയ്ക്കുന്ന കഷണമെന്ന സന്ദർഭം വ്യക്തമാക്കാൻ ‘ഒട്ടിച്ചുചേർക്കുക’ ഉപയോഗിച്ചു, എന്നാൽ ‘തുന്നുന്നു’ എന്ന മൂലത്തിൽ പറയാത്ത പ്രത്യേക പ്രവർത്തി ഒഴിവാക്കി.
- source_word: ῥάκους ἀγνάφου
  choice: ചുരുങ്ങാത്ത തുണിയുടെ കഷണം
  rationale: ἄγναφος സംസ്കരിക്കുകയോ ചുരുക്കുകയോ ചെയ്തിട്ടില്ലാത്ത തുണിയെ സൂചിപ്പിക്കുന്നു; ദൃഷ്ടാന്തത്തിലെ പ്രായോഗിക ഫലം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്ന പ്രയോഗമാണിത്.
- source_word: ἐπὶ ἱματίῳ παλαιῷ
  choice: പഴയ വസ്ത്രത്തിൽ
  rationale: ἱμάτιον എന്ന പൊതുവായ വസ്ത്രപദവും παλαιός എന്ന ‘പഴയ’ അർഥവും നേരിട്ട്, സ്വാഭാവികമായി നൽകുന്നു.
- source_word: αἴρει ... ἀπὸ τοῦ ἱματίου
  choice: വസ്ത്രത്തിൽനിന്ന് വലിഞ്ഞുമാറുകയും
  rationale: വേർപെടലും തുണിയിൽ ഉണ്ടാകുന്ന വലിവും പ്രകടമാക്കുന്നു; ‘കീറിയുമാറുന്നു’ എന്ന് പറഞ്ഞ് ഫലത്തെ ക്രിയയ്ക്കുള്ളിൽ അമിതമായി ചേർക്കുന്നില്ല.
- source_word: τὸ πλήρωμα αὐτοῦ
  choice: ആ കഷണം
  rationale: അക്ഷരാർഥം ‘അതിന്റെ നിറവ്/നിറയ്ക്കുന്ന ഭാഗം’; ഈ സന്ദർഭത്തിൽ കീറൽ നിറയ്ക്കുന്ന തുണിക്കഷണത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: χεῖρον σχίσμα γίνεται
  choice: കീറൽ കൂടുതൽ വഷളാകുകയും ചെയ്യും
  rationale: χείρων എന്ന താരതമ്യവും γίνεται എന്ന ഫലാവസ്ഥയും മലയാളത്തിൽ സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
