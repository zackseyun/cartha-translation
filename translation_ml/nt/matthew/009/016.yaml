translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. പുരാതന വസ്ത്രപ്പണിയുടെ സാങ്കേതികത വ്യക്തമാക്കാൻ പ്രധാനവാചകത്തിൽ ‘ചുരുങ്ങാത്ത’ എന്നും അടിക്കുറിപ്പിൽ കൂടുതൽ അക്ഷരാർഥമുള്ള ‘സംസ്കരിക്കാത്ത’ എന്നും നൽകി.
