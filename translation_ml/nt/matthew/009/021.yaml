id: MAT.9.21
reference: Matthew 9:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔλεγεν γὰρ ἐν ἑαυτῇ· Ἐὰν μόνον ἅψωμαι τοῦ ἱματίου αὐτοῦ σωθήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/021.yaml
  text: For she was saying to herself[a], “If only I touch his garment, I will be saved.”
translation:
  language: ml
  text: 'കാരണം, അവൾ തന്നോടുതന്നെ പറഞ്ഞുകൊണ്ടിരുന്നു: “അവന്റെ വസ്ത്രത്തിൽ ഒന്നു തൊട്ടാൽ ഞാൻ രക്ഷിക്കപ്പെടും[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ സൗഖ്യം പ്രാപിക്കും” അല്ലെങ്കിൽ “എനിക്ക് സുഖമാകും.” ഗ്രീക്കിൽ “ഞാൻ രക്ഷിക്കപ്പെടും” എന്നാണ്; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ക്രിയയ്ക്ക് സന്ദർഭത്തിൽ സൗഖ്യം പ്രാപിക്കുക എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലക്രിയയായതിനാൽ തുടരുന്നതോ ആവർത്തിക്കുന്നതോ ആയ ഉള്ളിലെ വാക്കുകളെ സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻസന്ദർഭത്തിലെ സംഭവത്തിന് വിശദീകരണം നൽകുന്ന ബന്ധകത്തിന്റെ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: ἐν ἑαυτῇ
  choice: തന്നോടുതന്നെ
  rationale: ഉള്ളിൽ പറയുകയോ ചിന്തിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാള തുല്യം.
- source_word: Ἐὰν μόνον
  choice: ഒന്നു … മാത്രം
  rationale: തൊടുക എന്ന ഏറ്റവും കുറഞ്ഞ വ്യവസ്ഥയിലുള്ള ഊന്നൽ സ്വാഭാവികമായ മലയാള വാക്യക്രമത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἅψωμαι
  choice: തൊട്ടാൽ
  rationale: ἐάν-നോടുകൂടിയ സബ്ജങ്ക്ടീവ് വ്യവസ്ഥയെ മലയാളത്തിലെ വ്യവസ്ഥാരൂപം സ്വാഭാവികമായി പ്രതിനിധീകരിക്കുന്നു; ഇവിടെ അർഥം പിടിക്കുക എന്നതിലുപരി തൊടുക എന്നതാണ്.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: അവന്റെ വസ്ത്രത്തിൽ
  rationale: ἱμάτιον പുറംവസ്ത്രത്തെ സൂചിപ്പിക്കാമെങ്കിലും, സന്ദർഭം ആവശ്യപ്പെടുന്നതിലധികം പ്രത്യേകമാക്കാതെ വിശാലമായ പദം ഉപയോഗിക്കുന്നു.
- source_word: σωθήσομαι
  choice: ഞാൻ രക്ഷിക്കപ്പെടും
  rationale: ശാരീരിക സൗഖ്യമാണ് തത്സന്ദർഭമെങ്കിലും σῴζω എന്ന ക്രിയയുടെ വിശാലമായ ‘രക്ഷിക്കുക’ എന്ന അർഥവും ദൈവശാസ്ത്രപരമായ അനുരണനവും പ്രധാനപാഠത്തിൽ സംരക്ഷിക്കുന്നു; സൗഖ്യസൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: സൗഖ്യലഭനത്തിന്റെ സന്ദർഭത്തിലെ σωθήσομαι എന്നതിന്റെ പരിഭാഷ
  choice: ഞാൻ രക്ഷിക്കപ്പെടും
  alternative: ഞാൻ സൗഖ്യം പ്രാപിക്കും / എനിക്ക് സുഖമാകും
  rationale: വാക്യം പ്രതീക്ഷിക്കുന്ന ശാരീരിക സൗഖ്യത്തെക്കുറിച്ചാണെങ്കിലും ഗ്രീക്ക് പദം അതിനേക്കാൾ വിശാലമാണ്. ‘രക്ഷിക്കപ്പെടും’ എന്നത് ആ പദവ്യാപ്തിയും സാധ്യമായ ദൈവശാസ്ത്രപരമായ അനുരണനവും അനാവശ്യമായി തീർപ്പാക്കാതെ നിലനിർത്തുന്നു; സന്ദർഭോചിതമായ സൗഖ്യാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. തുടർച്ചാസൂചകമായ ‘പറഞ്ഞുകൊണ്ടിരുന്നു’ ഗ്രീക്ക് അപൂർണ ഭൂതകാലത്തെ നിലനിർത്തുന്നു. പ്രധാനപാഠത്തിലെ ‘രക്ഷിക്കപ്പെടും’ മൂലപദത്തിന്റെ അർഥവ്യാപ്തി കാത്തുസൂക്ഷിക്കുന്നു; അടിക്കുറിപ്പ് ഉടനെയുള്ള രോഗസൗഖ്യസന്ദർഭം വ്യക്തമാക്കുന്നു.
