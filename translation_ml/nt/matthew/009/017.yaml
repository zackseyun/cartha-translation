id: MAT.9.17
reference: Matthew 9:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐδὲ βάλλουσιν οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μή γε, ῥήγνυνται οἱ ἀσκοί, καὶ ὁ οἶνος ἐκχεῖται καὶ οἱ ἀσκοὶ ⸀ἀπόλλυνται· ἀλλὰ βάλλουσιν οἶνον νέον εἰς ἀσκοὺς καινούς, καὶ ἀμφότεροι συντηροῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/017.yaml
  text: Nor do they put new wine into old wineskins. Otherwise[a], the wineskins burst, and the wine is spilled, and the wineskins are ruined. Rather, they put new wine into fresh wineskins, and both are preserved.
translation:
  language: ml
  text: പുതുവീഞ്ഞ് പഴയ തോൽക്കുടങ്ങളിൽ നിറയ്ക്കാറുമില്ല. അങ്ങനെ ചെയ്താൽ തോൽക്കുടങ്ങൾ പൊട്ടുകയും വീഞ്ഞ് ഒഴുകിപ്പോകുകയും തോൽക്കുടങ്ങൾ നശിക്കുകയും ചെയ്യും. മറിച്ച്, പുതുവീഞ്ഞ് പുത്തൻ തോൽക്കുടങ്ങളിലാണ്[a] നിറയ്ക്കുന്നത്; അപ്പോൾ രണ്ടും കേടുകൂടാതെ ഇരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ വീഞ്ഞിനെ വിശേഷിപ്പിക്കാൻ νέος (‘പുതിയത്/പുതുതായി ഉണ്ടായത്’) എന്നും തോൽക്കുടങ്ങളെ വിശേഷിപ്പിക്കാൻ καινός (‘പുതിയത്/പുത്തൻ അവസ്ഥയിലുള്ളത്’) എന്നും വ്യത്യസ്ത പദങ്ങളാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: നിറയ്ക്കാറുമില്ല
  rationale: മുൻ ഉപമയോടു മറ്റൊരു നിഷേധാത്മക ഉദാഹരണം കൂട്ടിച്ചേർക്കുന്ന ബന്ധം ‘-ഉമില്ല’ എന്ന പ്രയോഗം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: βάλλουσιν
  choice: നിറയ്ക്കുന്നു
  rationale: വീഞ്ഞ് തോൽക്കുടത്തിൽ ഇടുന്നതിനെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്ന സന്ദർഭോചിതമായ പ്രയോഗം.
- source_word: οἶνον νέον
  choice: പുതുവീഞ്ഞ്
  rationale: പുതുതായി ഉണ്ടാക്കിയ വീഞ്ഞെന്ന അർഥം ലളിതവും പരമ്പരാഗതവുമായ രീതിയിൽ നൽകുന്നു.
- source_word: ἀσκούς
  choice: തോൽക്കുടങ്ങൾ
  rationale: വീഞ്ഞ് സൂക്ഷിക്കാൻ ഉപയോഗിച്ചിരുന്ന മൃഗത്തോൽകൊണ്ടുള്ള പാത്രങ്ങളെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: παλαιούς
  choice: പഴയ
  rationale: പ്രായവും ഉപയോഗാവസ്ഥയും സംബന്ധിച്ച καινούς എന്നതുമായുള്ള വൈരുധ്യം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: εἰ δὲ μή γε
  choice: അങ്ങനെ ചെയ്താൽ
  rationale: ഗ്രീക്കിലെ വ്യവസ്ഥാപരമായ മുന്നറിയിപ്പിനെ മലയാളത്തിൽ സ്വാഭാവികമായ കാരണ-ഫല ബന്ധമായി അവതരിപ്പിക്കുന്നു.
- source_word: ῥήγνυνται
  choice: പൊട്ടുകയും
  rationale: സമ്മർദത്താൽ തോൽക്കുടങ്ങൾ പിളർന്നുപോകുന്നതിനെ വ്യക്തവും ദൃശ്യവുമായ ഭാഷയിൽ അറിയിക്കുന്നു.
- source_word: ἐκχεῖται
  choice: ഒഴുകിപ്പോകുകയും
  rationale: തോൽക്കുടം പൊട്ടിയതിനെത്തുടർന്ന് വീഞ്ഞ് നഷ്ടപ്പെടുന്നതാണ് സന്ദർഭം; ‘ഒഴുകിപ്പോകുക’ അത് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἀπόλλυνται
  choice: നശിക്കുകയും
  rationale: തോൽക്കുടങ്ങൾ ഉപയോഗശൂന്യമാകുന്നതിനെ നേരിട്ട് സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ അതിനെ അസ്തിത്വനാശമായി അതിവ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: ἀλλὰ
  choice: മറിച്ച്
  rationale: തെറ്റായ രീതിക്കു പകരമുള്ള ശരിയായ രീതിയെ അവതരിപ്പിക്കുന്ന തിരുത്തൽപരമായ വൈരുധ്യം നിലനിർത്തുന്നു.
- source_word: καινούς
  choice: പുത്തൻ
  rationale: പുതിയ അവസ്ഥയിലുള്ള, ഉപയോഗിക്കാത്ത തോൽക്കുടങ്ങൾ എന്ന സൂചന നൽകുകയും νέος എന്നതിന് ഉപയോഗിച്ച ‘പുതു-’ എന്ന രൂപത്തിൽനിന്ന് ശൈലീപരമായ വ്യത്യാസം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἀμφότεροι συντηροῦνται
  choice: രണ്ടും കേടുകൂടാതെ ഇരിക്കും
  rationale: വീഞ്ഞും തോൽക്കുടങ്ങളും ഒരുപോലെ സംരക്ഷിക്കപ്പെടുന്നു എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ഒരേ വാക്യത്തിലെ νέος, καινός എന്നീ വിശേഷണങ്ങളുടെ വ്യത്യാസം
  choice: νέος എന്നത് ‘പുതു-’ എന്നും καινός എന്നത് ‘പുത്തൻ’ എന്നും പരിഭാഷപ്പെടുത്തി, വ്യത്യാസം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
  alternative: രണ്ടും ‘പുതിയ’ എന്നു പരിഭാഷപ്പെടുത്തുക.
  rationale: ഗ്രീക്ക് വ്യത്യസ്ത വിശേഷണങ്ങൾ ഉപയോഗിക്കുന്നു. അവയുടെ അർഥപരിധികൾ തമ്മിൽ മൂടിച്ചേരുന്നുണ്ടെങ്കിലും, വീഞ്ഞിന്റെ പുതുമയും തോൽക്കുടങ്ങളുടെ പുതിയ അവസ്ഥയും തമ്മിലുള്ള സൂക്ഷ്മവ്യത്യാസം വായനക്കാരനു കാണാൻ ഈ രൂപഭേദവും അടിക്കുറിപ്പും സഹായിക്കുന്നു; അതിൽനിന്ന് പ്രത്യേക സിദ്ധാന്താർഥം നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന ഗൗരവമുള്ള ശൈലി. ‘തോൽക്കുടം’ ചരിത്രപരമായ പാത്രത്തെ കൃത്യമായി സൂചിപ്പിക്കുന്നു. പൊതുവായ മനുഷ്യപ്രവൃത്തിയെ മലയാളത്തിലെ പതിവുസൂചകമായ ‘നിറയ്ക്കാറുമില്ല’ എന്ന രൂപത്തിൽ അവതരിപ്പിച്ചു.
