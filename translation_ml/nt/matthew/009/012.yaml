id: MAT.9.12
reference: Matthew 9:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ ἀκούσας ⸀εἶπεν· Οὐ χρείαν ἔχουσιν οἱ ἰσχύοντες ἰατροῦ ἀλλὰ οἱ κακῶς ἔχοντες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/012.yaml
  text: But when he heard it[a], he said, “Those who are well have no need of a physician, but those who are sick do.”
translation:
  language: ml
  text: 'അതു കേട്ടപ്പോൾ അദ്ദേഹം പറഞ്ഞു: “ആരോഗ്യമുള്ളവർക്കല്ല വൈദ്യനെ ആവശ്യം, രോഗികൾക്കാണ്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσας
  choice: അതു കേട്ടപ്പോൾ
  rationale: സന്ദർഭത്തിൽ യേശു മുമ്പത്തെ ചോദ്യം കേട്ടതാണെന്ന് വ്യക്തമാകുന്നതിനാൽ, ഗ്രീക്കിൽ പരോക്ഷമായിരിക്കുന്ന കർമം മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി ‘അതു’ എന്നു ചേർത്തു; aorist participle-ന്റെ കാലസംബന്ധവും ‘കേട്ടപ്പോൾ’ നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: വാക്യക്രമത്തിലൂടെ പ്രകടമാക്കുന്നു
  rationale: δέ മൃദുവായ പ്രതികരണമോ വഴിത്തിരിവോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ പ്രത്യേകമായി ‘എന്നാൽ’ ചേർക്കുന്നത് ഇവിടെ ഭാരമുള്ളതായി തോന്നുന്നതിനാൽ, പ്രതികരണാത്മകമായ വാക്യക്രമംകൊണ്ട് അതിന്റെ പ്രവർത്തനം സ്വാഭാവികമായി പ്രകടമാക്കി.
- source_word: εἶπεν
  choice: പറഞ്ഞു
  rationale: സാധാരണമായ സംസാരക്രിയയായ λέγω-യെ വ്യാഖ്യാനാത്മകമായ ‘മറുപടി പറഞ്ഞു’ എന്നതിലേക്കു വികസിപ്പിക്കാതെ നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: Οὐ χρείαν ἔχουσιν
  choice: ആവശ്യമില്ല / ആവശ്യം ...ക്കാണ്
  rationale: χρείαν ἔχειν എന്ന പ്രയോഗത്തിന്റെ ‘ആവശ്യമുണ്ടാകുക’ എന്ന അർഥം സ്വാഭാവികമായ മലയാള വിരുദ്ധഘടനയിൽ നൽകി.
- source_word: οἱ ἰσχύοντες
  choice: ആരോഗ്യമുള്ളവർ
  rationale: ἰσχύω അടിസ്ഥാനമായി ശക്തിയുള്ളവരെയാണു സൂചിപ്പിക്കുന്നതെങ്കിലും, വൈദ്യൻ–രോഗികൾ എന്ന വൈദ്യസന്ദർഭത്തിലെ പ്രയോഗാർഥം ‘ആരോഗ്യമുള്ളവർ’ എന്നാണ്; ഇത് മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: ἰατροῦ
  choice: വൈദ്യനെ
  rationale: ἰατρός എന്നതിന് യോജിക്കുന്ന, മാന്യവും സാധാരണ വായനക്കാർക്ക് പരിചിതവുമായ മലയാളപദം.
- source_word: οἱ κακῶς ἔχοντες
  choice: രോഗികൾ
  rationale: κακῶς ἔχω എന്നത് ഈ വൈദ്യസന്ദർഭത്തിൽ ‘രോഗിയായിരിക്കുക’ എന്ന ഇടിയമാണ്; ‘രോഗികൾ’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
theological_decisions:
- issue: പഴഞ്ചൊല്ലിന്റെ ശാരീരിക അർഥവും രൂപകപ്രയോഗവും
  choice: പ്രധാനവാചകത്തിൽ വൈദ്യശാസ്ത്രപരമായ ദൃശ്യരൂപം മാത്രം നേരിട്ട് നിലനിർത്തി.
  alternative: ‘പാപികൾക്ക് ആത്മീയ സൗഖ്യം ആവശ്യമുണ്ട്’ എന്ന സന്ദർഭപ്രയോഗം വാക്യത്തിൽ തുറന്നുപറയുക.
  rationale: തുടർന്നുള്ള സന്ദർഭം യേശുവിന്റെ ആത്മീയ പ്രയോഗം വ്യക്തമാക്കുന്നു; എന്നാൽ ഈ ഗ്രീക്ക് വാക്യം തന്നിൽ വൈദ്യപരമായ പഴഞ്ചൊല്ലാണ്. അതിനാൽ രൂപകത്തെ വ്യാഖ്യാനിച്ച് തീർക്കാതെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക മാനക മലയാളം; ലളിതവും മാന്യവും ഉദ്ധരണിയുടെ പഴഞ്ചൊല്ലുസ്വഭാവം നിലനിർത്തുന്നതുമായ ശൈലി. ലിംഗസൂചന നിർബന്ധമല്ലാത്ത ‘അദ്ദേഹം’ ഉപയോഗിച്ചു. അനാവശ്യമായ വ്യാഖ്യാനപദങ്ങൾ ഒഴിവാക്കി.
