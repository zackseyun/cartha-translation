source:
  edition: SBLGNT
  text: τότε λέγει τοῖς μαθηταῖς αὐτοῦ· Ὁ μὲν θερισμὸς πολύς, οἱ δὲ ἐργάται ὀλίγοι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/037.yaml
  text: Then he says to his disciples[a], “The harvest indeed is plentiful[b], but the workers are few.”
translation:
  language: ml
  text: അപ്പോൾ അവൻ തന്റെ ശിഷ്യന്മാരോടു പറയുന്നു:[a] “കൊയ്ത്ത് ധാരാളമാണ്; പക്ഷേ വേലക്കാർ ചുരുക്കം.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഗ്രീക്കിൽ ഇവിടെ ആഖ്യാനവർത്തമാനകാലമാണ്: “പറയുന്നു.” ചില പരിഭാഷകൾ “പറഞ്ഞു” എന്നു നൽകുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: അപ്പോൾ
  rationale: ആഖ്യാനത്തിലെ സംഭവക്രമം സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാള പ്രയോഗം.
- source_word: λέγει
  choice: പറയുന്നു
  rationale: ഗ്രീക്കിലെ ആഖ്യാനവർത്തമാനകാലം അതേപടി നിലനിർത്തി വാക്യത്തിന്റെ സജീവത സംരക്ഷിക്കുന്നു.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: തന്റെ ശിഷ്യന്മാരോട്
  rationale: αὐτοῦ എന്ന ഉടമസ്ഥസൂചനയും μαθηταῖς എന്നതിന്റെ പതിവും കൃത്യവുമായ അർഥവും നിലനിർത്തുന്നു.
- source_word: Ὁ μὲν ... οἱ δὲ
  choice: …; പക്ഷേ …
  rationale: μέν…δέ നൽകുന്ന വൈരുധ്യം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; കൃത്രിമമായ ‘ഒരു വശത്ത്… മറുവശത്ത്’ എന്ന ഘടന ഒഴിവാക്കുന്നു.
- source_word: θερισμός
  choice: കൊയ്ത്ത്
  rationale: കാർഷിക രൂപകം വ്യാഖ്യാനിച്ച് മാറ്റാതെ മലയാളത്തിൽ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: πολύς
  choice: ധാരാളമാണ്
  rationale: കൊയ്ത്തിന്റെ സമൃദ്ധിയെ വ്യക്തവും സാധാരണവുമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ἐργάται
  choice: വേലക്കാർ
  rationale: കൊയ്ത്തിൽ അധ്വാനിക്കുന്നവരെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും ഉൾക്കൊള്ളാവുന്നതുമായ മലയാളപദം.
- source_word: ὀλίγοι
  choice: ചുരുക്കം
  rationale: πολύς എന്നതോടുള്ള സംഖ്യാത്മക വൈരുധ്യം ചുരുക്കമായും കൃത്യമായും നൽകുന്നു.
theological_decisions:
- issue: കൊയ്ത്ത് എന്ന രൂപകത്തിന്റെ അർഥം
  choice: കാർഷിക രൂപകം വിശദീകരിക്കാതെ അതേപടി നിലനിർത്തി.
  alternative: കൊയ്ത്ത് ആളുകളെയോ ദൗത്യത്തിനുള്ള അവസരത്തെയോ സൂചിപ്പിക്കുന്നു എന്ന് മുഖ്യവാക്യത്തിൽ തുറന്നുപറയുക.
  rationale: ഈ വാക്യം രൂപകത്തെ സ്വയം വിശദീകരിക്കുന്നില്ല; അതിനാൽ സന്ദർഭത്തിൽനിന്നുള്ള ഒരു പ്രത്യേക വ്യാഖ്യാനം പരിഭാഷയിൽ ചേർക്കുന്നത് ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. ‘കൊയ്ത്ത്’ എന്ന പരിചിതമായ കാർഷികരൂപകവും ഗ്രീക്കിലെ ആഖ്യാനവർത്തമാനകാലവും സംരക്ഷിച്ചു.
