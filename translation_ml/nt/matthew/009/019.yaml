translation_notes:
  register: ലളിതവും മാന്യവുമായ ആധുനിക നിലവാരമലയാളം ഉപയോഗിച്ചു. ഗ്രീക്കിലെ സംക്ഷിപ്തമായ ആഖ്യാനശൈലി നിലനിർത്തിക്കൊണ്ട്, മലയാളത്തിൽ അസ്വാഭാവികമായ ക്രിയാലോപം ‘അങ്ങനെതന്നെ ചെയ്തു’ എന്ന പ്രയോഗത്തിലൂടെ സ്വാഭാവികമാക്കി.
