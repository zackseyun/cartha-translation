  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐγερθεὶς ὁ Ἰησοῦς ⸀ἠκολούθει αὐτῷ καὶ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/019.yaml
  text: And Jesus rose and followed him, and his disciples did too.
translation:
  language: ml
  text: യേശു എഴുന്നേറ്റ് അവനെ അനുഗമിച്ചു; യേശുവിന്റെ ശിഷ്യന്മാരും അങ്ങനെതന്നെ ചെയ്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγερθεὶς
  choice: എഴുന്നേറ്റ്
  rationale: ἐγείρω എന്ന ക്രിയയുടെ ഇവിടെ വരുന്ന കർത്തൃവാചകസദൃശമായ അകർമക പ്രയോഗം ഇരുന്നിടത്തുനിന്ന് എഴുന്നേറ്റ് അടുത്ത പ്രവൃത്തിയിലേക്കു കടക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘എഴുന്നേറ്റ്’ ആ ക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἠκολούθει
  choice: അനുഗമിച്ചു
  rationale: അപൂർണഭൂതകാലരൂപം തുടരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കാമെങ്കിലും, ഈ ആഖ്യാനസന്ദർഭത്തിൽ മലയാളത്തിലെ സാധാരണ ഭൂതകാലം സംഭവത്തെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു. ‘അനുഗമിച്ചു’ പിന്നാലെ പോകുക എന്ന അർഥം വ്യക്തമായി സൂക്ഷിക്കുന്നു.
- source_word: αὐτῷ
  choice: അവനെ
  rationale: ἀκολουθέω എന്ന ക്രിയയോടുകൂടിയ ദത്തിവിഭക്തി സർവനാമം മലയാളത്തിൽ നേരിട്ടുള്ള കർമമായി സ്വാഭാവികമായി വരുന്നു. മുൻവാക്യത്തിലെ ഭരണാധികാരിയാണ് ഇതിന്റെ സൂചിതപൂർവപദം.
- source_word: μαθηταὶ
  choice: ശിഷ്യന്മാർ
  rationale: സുവിശേഷങ്ങളിലെ ഗുരു–ശിഷ്യബന്ധം നിലനിർത്തുന്ന, ആധുനിക മലയാളത്തിൽ സ്ഥാപിതവും വ്യക്തവുമായ പദമാണ് ‘ശിഷ്യന്മാർ’.
- source_word: καὶ οἱ μαθηταὶ αὐτοῦ
  choice: യേശുവിന്റെ ശിഷ്യന്മാരും അങ്ങനെതന്നെ ചെയ്തു
  rationale: ഗ്രീക്കിൽ രണ്ടാമത്തെ ഉപവാക്യത്തിൽ ക്രിയ ആവർത്തിക്കാതെ വിട്ടിരിക്കുന്നു. ‘അങ്ങനെതന്നെ ചെയ്തു’ ആ സമാന്തര ക്രിയയെ സ്വാഭാവിക മലയാളത്തിൽ പൂരിപ്പിക്കുന്നു; ‘യേശുവിന്റെ’ എന്നു വ്യക്തമാക്കുന്നത് αὐτοῦ ആരെ സൂചിപ്പിക്കുന്നു എന്നത് മലയാളത്തിൽ സംശയരഹിതമാക്കുന്നു.
