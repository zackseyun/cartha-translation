source:
  edition: SBLGNT
  text: καὶ ἐκβληθέντος τοῦ δαιμονίου ἐλάλησεν ὁ κωφός. καὶ ἐθαύμασαν οἱ ὄχλοι λέγοντες· Οὐδέποτε ἐφάνη οὕτως ἐν τῷ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/033.yaml
  text: And when the demon had been cast out[a], the mute man spoke. And the crowds were amazed, saying, “Never has anything like this appeared in Israel.”
translation:
  language: ml
  text: 'ഭൂതത്തെ പുറത്താക്കിയപ്പോൾ[a], സംസാരിക്കാൻ കഴിയാതിരുന്ന ആ മനുഷ്യൻ സംസാരിച്ചു. ജനക്കൂട്ടങ്ങൾ ആശ്ചര്യപ്പെട്ട് പറഞ്ഞു: “ഇതുപോലൊന്ന് ഇസ്രായേലിൽ ഒരിക്കലും പ്രത്യക്ഷപ്പെട്ടിട്ടില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ബധിരനായ മനുഷ്യൻ.” ഗ്രീക്ക് പദത്തിന് “ബധിരൻ” എന്നും “സംസാരിക്കാൻ കഴിയാത്തവൻ” എന്നും അർത്ഥമാകാം; എന്നാൽ ഇവിടെ അവൻ സംസാരിച്ചു എന്നതിനാണ് ഊന്നൽ, അതിനാൽ സന്ദർഭം രണ്ടാമത്തെ അർത്ഥത്തെ അനുകൂലിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβληθέντος
  choice: പുറത്താക്കിയപ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ടിലുള്ള അയോറിസ്റ്റ് പാസീവ് പാർട്ടിസിപ്പിൾ മുഖ്യക്രിയയ്ക്കു മുമ്പുള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ കാലബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: δαιμονίου
  choice: ഭൂതത്തെ
  rationale: സുവിശേഷങ്ങളിലെ ഭൂതോച്ചാടനസന്ദർഭത്തിൽ δαιμόνιον എന്ന പദത്തിന്റെ നേരിട്ടുള്ളതും പതിവായതുമായ മലയാളസമാനപദം.
- source_word: ἐλάλησεν
  choice: സംസാരിച്ചു
  rationale: λαλέω എന്ന ക്രിയയുടെ ലളിതമായ അയോറിസ്റ്റ് അർത്ഥം നൽകുന്നു; ‘സംസാരിക്കാൻ തുടങ്ങി’ എന്ന മൂലത്തിൽ വ്യക്തമല്ലാത്ത ആരംഭഭാവം ചേർക്കുന്നില്ല.
- source_word: ὁ κωφός
  choice: സംസാരിക്കാൻ കഴിയാതിരുന്ന ആ മനുഷ്യൻ
  rationale: κωφός എന്നതിന് ‘ബധിരൻ’ എന്നും ‘ഊമൻ/സംസാരിക്കാൻ കഴിയാത്തവൻ’ എന്നും അർത്ഥമാകാം. ഉടൻ പറയുന്ന ‘സംസാരിച്ചു’ എന്ന ഫലം ഇവിടെ സംസാരശേഷിയില്ലായ്മയാണ് ഊന്നുന്നതെന്ന് സൂചിപ്പിക്കുന്നു; ആധുനികവും മാന്യവുമായ വ്യക്തികേന്ദ്രിത പ്രയോഗമാണ് തിരഞ്ഞെടുത്തത്.
- source_word: ἐθαύμασαν
  choice: ആശ്ചര്യപ്പെട്ടു
  rationale: ജനക്കൂട്ടത്തിന്റെ വിസ്മയവും അമ്പരപ്പും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: οἱ ὄχλοι
  choice: ജനക്കൂട്ടങ്ങൾ
  rationale: ഗ്രീക്കിലെ ബഹുവചനരൂപം നിലനിർത്തുന്നു.
- source_word: Οὐδέποτε
  choice: ഒരിക്കലും ... ഇല്ല
  rationale: ‘ഒരിക്കലും/ഒരിക്കലും ഇതുവരെ ഇല്ല’ എന്ന ശക്തമായ നിഷേധാർത്ഥം മലയാളവാക്യഘടനയിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐφάνη
  choice: പ്രത്യക്ഷപ്പെട്ടിട്ടില്ല
  rationale: φαίνωയുടെ പാസീവ് രൂപത്തിന് ഇവിടെ ‘പ്രത്യക്ഷപ്പെടുക’ എന്ന അർത്ഥം നേരിട്ട് നിലനിർത്തുന്നു; ‘കാണപ്പെട്ടിട്ടില്ല’ എന്ന സന്ദർഭോചിതമായ മറ്റൊരു വായനയും സാധ്യമാണ്.
- source_word: οὕτως
  choice: ഇതുപോലൊന്ന്
  rationale: മുമ്പ് നടന്ന സംഭവത്തിന്റെ സ്വഭാവത്തെയോ രീതിയെയോ ചൂണ്ടിക്കാണിക്കുന്ന οὕτως മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐν τῷ Ἰσραήλ
  choice: ഇസ്രായേലിൽ
  rationale: ജനത്തെയോ അവരുടെ പരിധിയെയോ സൂചിപ്പിക്കാവുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സംക്ഷിപ്തവും സാധാരണവുമായ തർജമ.
theological_decisions:
- issue: സൗഖ്യപ്പെടുത്തൽ/ഭൂതോച്ചാടനസന്ദർഭത്തിലെ κωφός എന്ന പദത്തിന്റെ അർത്ഥപരിധി
  choice: സംസാരിക്കാൻ കഴിയാതിരുന്ന ആ മനുഷ്യൻ
  alternative: ബധിരനായ മനുഷ്യൻ
  rationale: പദത്തിന് രണ്ടു അർത്ഥങ്ങളും ഉണ്ടെങ്കിലും, ‘അവൻ സംസാരിച്ചു’ എന്ന തൊട്ടടുത്ത ഫലം സംസാരശേഷിയില്ലായ്മയെയാണ് ഈ വാക്യം ഊന്നുന്നതെന്ന് സൂചിപ്പിക്കുന്നു. രണ്ടാമൊരു വൈകല്യം അനാവശ്യമായി ചേർക്കാതിരിക്കാനും യഥാർഥ അർത്ഥദ്വയത്വം അടിക്കുറിപ്പിൽ നിലനിർത്താനും ഈ രൂപം സ്വീകരിച്ചു.
- issue: ἐφάνη എന്ന പാസീവ് രൂപത്തിന്റെ സന്ദർഭാർത്ഥം
  choice: പ്രത്യക്ഷപ്പെട്ടിട്ടില്ല
  alternative: കാണപ്പെട്ടിട്ടില്ല
  rationale: മൂലപദത്തിന്റെ ‘പ്രത്യക്ഷപ്പെടുക’ എന്ന രൂപം നിലനിർത്തുന്നു; ഈ പ്രസ്താവനയിൽ ‘കാണപ്പെടുക’ എന്ന ഭാഷാപ്രയോഗപരമായ അർത്ഥവും സാധ്യമാണെങ്കിലും അതിലേക്കു മാത്രം അർത്ഥം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മാന്യവുമായ ഭാഷ ഉപയോഗിച്ചു. ‘ഊമൻ’ എന്ന ചുരുക്കപ്പേരിനു പകരം വ്യക്തികേന്ദ്രിതമായ ‘സംസാരിക്കാൻ കഴിയാതിരുന്ന ആ മനുഷ്യൻ’ സ്വീകരിച്ചു. മൂലത്തിലെ രണ്ടു καί ബന്ധകങ്ങളും മലയാളത്തിന്റെ സ്വാഭാവിക പ്രവാഹത്തിനനുസരിച്ച് വാക്യക്രമത്തിലൂടെ പ്രകടിപ്പിച്ചു.
