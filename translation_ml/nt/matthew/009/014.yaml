id: MAT.9.14
reference: Matthew 9:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τότε προσέρχονται αὐτῷ οἱ μαθηταὶ Ἰωάννου λέγοντες· Διὰ τί ἡμεῖς καὶ οἱ Φαρισαῖοι νηστεύομεν ⸀πολλά, οἱ δὲ μαθηταί σου οὐ νηστεύουσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/014.yaml
  text: Then John's disciples came to him[a], saying, “Why do we and the Pharisees fast often, but your disciples do not fast?”
translation:
  language: ml
  text: 'അപ്പോൾ യോഹന്നാന്റെ ശിഷ്യന്മാർ യേശുവിന്റെ അടുക്കൽ വന്ന് ചോദിച്ചു: “ഞങ്ങളും പരീശന്മാരും പലപ്പോഴും ഉപവസിക്കുന്നു[a]; എന്നാൽ അങ്ങയുടെ ശിഷ്യന്മാർ ഉപവസിക്കാത്തത് എന്തുകൊണ്ട്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വളരെയധികം ഉപവസിക്കുന്നു” അല്ലെങ്കിൽ “പല പ്രാവശ്യം ഉപവസിക്കുന്നു”; ഗ്രീക്കിലെ πολλά ഇവിടെ ഉപവാസത്തിന്റെ പതിവായ ആവർത്തനത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: അപ്പോൾ
  rationale: തുടർന്നുണ്ടാകുന്ന സംഭവത്തെ പരിചയപ്പെടുത്തുന്ന കാലസൂചകമായി സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
- source_word: προσέρχονται αὐτῷ
  choice: അവന്റെ അടുക്കൽ വന്ന്
  rationale: യേശുവിന്റെ അടുത്തേക്കുള്ള ചലനം നിലനിർത്തിക്കൊണ്ട് προσέρχομαι എന്നതിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: οἱ μαθηταὶ Ἰωάννου
  choice: യോഹന്നാന്റെ ശിഷ്യന്മാർ
  rationale: ഗ്രീക്കിലെ ബന്ധസൂചക ഷഷ്ഠിയെ മലയാളത്തിലെ സ്വാഭാവികമായ ഉടമസ്ഥരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: λέγοντες
  choice: ചോദിച്ചു
  rationale: തുടർന്നുവരുന്നത് നേരിട്ടുള്ള ചോദ്യമായതിനാൽ ‘വന്ന് ചോദിച്ചു’ എന്നത് സമകാലിക പങ്കാളിക്രിയയുടെ പ്രവർത്തനം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: Διὰ τί
  choice: എന്തുകൊണ്ട്
  rationale: കാരണം അന്വേഷിക്കുന്ന ഗ്രീക്ക് ചോദ്യപ്രയോഗത്തിന്റെ സാധാരണ മലയാള തുല്യരൂപമാണ്.
- source_word: ἡμεῖς καὶ οἱ Φαρισαῖοι
  choice: ഞങ്ങളും പരീശന്മാരും
  rationale: ഊന്നലോടെയുള്ള ‘ഞങ്ങൾ’ എന്നതും താരതമ്യത്തിലുള്ള പരീശന്മാരും രണ്ടും നിലനിർത്തുന്നു.
- source_word: νηστεύομεν
  choice: ഉപവസിക്കുന്നു
  rationale: ഭക്തിപരമായ ആവശ്യത്തിനായി ആഹാരം വർജിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന നിലവാരമുള്ള മലയാള പദമാണ്.
- source_word: πολλά
  choice: പലപ്പോഴും
  rationale: νηστεύω എന്ന ക്രിയയോടൊപ്പം πολλά ക്രിയാവിശേഷണമായി വന്ന് പതിവായ ആവർത്തനത്തെ സൂചിപ്പിക്കുന്നു; ‘പലപ്പോഴും’ അതിന്റെ സ്വാഭാവിക മലയാളാവിഷ്കാരമാണ്.
- source_word: οἱ δὲ μαθηταί σου
  choice: എന്നാൽ അങ്ങയുടെ ശിഷ്യന്മാർ
  rationale: δέ സൂചിപ്പിക്കുന്ന വൈരുധ്യം ‘എന്നാൽ’ കൊണ്ടു വ്യക്തമാക്കുന്നു; യേശുവിനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയ്ക്ക് മാന്യവും ആധുനികവുമായ ‘അങ്ങയുടെ’ ഉപയോഗിക്കുന്നു.
- source_word: οὐ νηστεύουσιν
  choice: ഉപവസിക്കാത്തത്
  rationale: ഒരു പ്രത്യേക നിമിഷത്തിലെ പ്രവൃത്തിയെന്നതിലുപരി പതിവായ ആചാരത്തിലെ വ്യത്യാസം ചോദ്യരൂപത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഉപവാസത്തെക്കുറിച്ചുള്ള പരാതിയുടെ സ്വഭാവം
  choice: പതിവായ മതാചാരത്തിലെ വ്യത്യാസത്തെക്കുറിച്ചുള്ള താരതമ്യചോദ്യമായി വിവർത്തനം ചെയ്തു.
  alternative: യേശുവിന്റെ ശിഷ്യന്മാർ നിർബന്ധമായ ഒരു ആചാരം ലംഘിക്കുന്നു എന്ന കുറ്റാരോപണമായി, അല്ലെങ്കിൽ ഒരൊറ്റ പ്രത്യേക ഉപവാസസന്ദർഭമായി അവതരിപ്പിക്കുക.
  rationale: വർത്തമാനകാല ക്രിയകളും πολλά എന്ന ക്രിയാവിശേഷണപ്രയോഗവും പൊതുവായ പതിവിനെ സൂചിപ്പിക്കുന്നു. മൂലപാഠം പറയുന്നതിലധികം കുറ്റാരോപണമോ പ്രത്യേക അവസരമോ വിവർത്തനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം ഉപയോഗിച്ചു. നേരിട്ടുള്ള ചോദ്യത്തിന്റെ സ്വാഭാവികതയ്ക്കായി ‘പറഞ്ഞു’ എന്നതിനു പകരം ‘ചോദിച്ചു’ ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് ചർച്ച ചെയ്യുന്ന ‘പലപ്പോഴും’ എന്ന പദത്തിന് പിന്നാലെയാണ് [a] അടയാളം നൽകിയിരിക്കുന്നത്.
