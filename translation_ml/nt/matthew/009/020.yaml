source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ γυνὴ αἱμορροοῦσα δώδεκα ἔτη προσελθοῦσα ὄπισθεν ἥψατο τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/020.yaml
  text: And behold[b][a], a woman who had been suffering from bleeding for twelve years came up behind him and touched the fringe of his garment.
translation:
  language: ml
  text: അപ്പോൾ ഇതാ, പന്ത്രണ്ടു വർഷമായി രക്തസ്രാവം അനുഭവിച്ചിരുന്ന ഒരു സ്ത്രീ പിന്നിലൂടെ അടുത്തുവന്ന് അവന്റെ വസ്ത്രത്തിന്റെ തൊങ്ങലിൽ[a][b] തൊട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കുഞ്ചലം’ അല്ലെങ്കിൽ ‘വസ്ത്രത്തിന്റെ അരിക്’; ഗ്രീക്ക് പദം വസ്ത്രത്തിന്റെ അരികോ അതിലെ തൊങ്ങൽപോലുള്ള ഭാഗമോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ഇസ്രായേലിന്റെ ന്യായപ്രമാണത്തിലെ വസ്ത്രത്തൊങ്ങലുകളുടെ പശ്ചാത്തലത്തിനായി സംഖ്യാപുസ്തകം 15:38; ആവർത്തനം 22:12 കാണുക.
    reason: cross_reference
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: അപ്പോൾ ഇതാ
  rationale: καί എന്ന ആഖ്യാനബന്ധവും ἰδού എന്ന ശ്രദ്ധയാകർഷിക്കുന്ന, സംഭവത്തിന്റെ പെട്ടെന്നുള്ള വരവ് സൂചിപ്പിക്കുന്ന പ്രയോഗവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: γυνὴ
  choice: ഒരു സ്ത്രീ
  rationale: ആദ്യമായി പരാമർശിക്കപ്പെടുന്ന അനിശ്ചിത വ്യക്തിയെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: αἱμορροοῦσα δώδεκα ἔτη
  choice: പന്ത്രണ്ടു വർഷമായി രക്തസ്രാവം അനുഭവിച്ചിരുന്ന
  rationale: വളരെക്കാലം തുടർന്ന രക്തസ്രാവാവസ്ഥയും കാലദൈർഘ്യവും വ്യക്തമാക്കുന്നു; പെട്ടെന്നുണ്ടായ കടുത്ത രക്തസ്രാവം എന്ന തെറ്റായ ധാരണ ഒഴിവാക്കുന്നു.
- source_word: προσελθοῦσα ὄπισθεν
  choice: പിന്നിലൂടെ അടുത്തുവന്ന്
  rationale: സ്ത്രീ യേശുവിന്റെ പിന്നിൽനിന്ന് സമീപിച്ചതും മുഖ്യക്രിയയ്ക്കു മുമ്പുണ്ടായ ചലനവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἥψατο
  choice: തൊട്ടു
  rationale: ഈ സന്ദർഭത്തിൽ മധ്യമരൂപമായ ἅπτω സാധാരണ സ്പർശത്തെ സൂചിപ്പിക്കുന്നു; പിടിച്ചുവെന്നോ മുറുകെപ്പിടിച്ചുവെന്നോ അധികമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: τοῦ κρασπέδου
  choice: തൊങ്ങലിൽ
  rationale: വസ്ത്രത്തിന്റെ അരികിലെ തൂങ്ങുന്ന അലങ്കാരഭാഗം അഥവാ തൊങ്ങൽ എന്ന സാധ്യത മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; കൃത്യമായി 'അരിക്' അല്ലെങ്കിൽ നിയമാനുസൃത 'കുഞ്ചലം' എന്നു മാത്രം നിശ്ചയിക്കുന്നില്ല.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: അവന്റെ വസ്ത്രത്തിന്റെ
  rationale: ἱμάτιον എന്ന പൊതുവായ പുറംവസ്ത്രപദത്തെ മേലങ്കി, അങ്കി തുടങ്ങിയ കൂടുതൽ നിർദ്ദിഷ്ട രൂപങ്ങളാക്കി ചുരുക്കാതെ പരിഭാഷപ്പെടുത്തുന്നു.
theological_decisions:
- issue: κράσπεδον എന്ന പദത്തിന് യഹൂദവസ്ത്രത്തിലെ നിയമാനുസൃത തൊങ്ങൽ/കുഞ്ചലം എന്ന സാംസ്കാരിക സൂചന ഉണ്ടാകാമോ എന്നത്
  choice: മുഖ്യവാചകത്തിൽ പൊതുവായ 'തൊങ്ങൽ' ഉപയോഗിക്കുക
  alternative: '''കുഞ്ചലം'' എന്നു നൽകി സംഖ്യാപുസ്തകം 15:38; ആവർത്തനം 22:12 എന്നിവയുമായുള്ള ബന്ധം കൂടുതൽ മുൻനിരയിൽ കൊണ്ടുവരുക, അല്ലെങ്കിൽ ''വസ്ത്രത്തിന്റെ അരിക്'' എന്നു നൽകുക'
  rationale: ഗ്രീക്ക് പദം വസ്ത്രത്തിന്റെ അരിക്, തൊങ്ങൽ, കുഞ്ചലം എന്നീ അർത്ഥസാധ്യതകൾ വഹിക്കുന്നു. വാക്യം തന്നെയാകട്ടെ നിയമപരമായ പ്രതീകത്തെ വ്യക്തമായി വിശദീകരിക്കുന്നില്ല. അതിനാൽ മുഖ്യവാചകം സാധ്യത തുറന്നുവെക്കുകയും അടിക്കുറിപ്പുകൾ പദപരവും സാംസ്കാരികവുമായ പശ്ചാത്തലം നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഇതാ’ മൂലത്തിലെ ശ്രദ്ധയാകർഷിക്കുന്ന പ്രയോഗം നിലനിർത്തുന്നു. ‘രക്തസ്രാവം അനുഭവിച്ചിരുന്ന’ എന്നത് രോഗാവസ്ഥയെ മാന്യമായും വ്യക്തമായും അറിയിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട ‘തൊങ്ങലിൽ’ എന്ന പദത്തിന് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
