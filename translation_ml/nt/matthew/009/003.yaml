id: MAT.9.3
reference: Matthew 9:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἰδού τινες τῶν γραμματέων εἶπαν ἐν ἑαυτοῖς· Οὗτος βλασφημεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/003.yaml
  text: And behold[a], some of the scribes said among themselves, “This man is blaspheming.”
translation:
  language: ml
  text: 'അപ്പോൾ ഇതാ, ശാസ്ത്രിമാരിൽ ചിലർ തങ്ങളോടുതന്നെ[a] പറഞ്ഞു: “ഇവൻ ദൈവദൂഷണം പറയുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “തമ്മിൽ പറഞ്ഞു.” ഗ്രീക്ക് പ്രയോഗം സ്വകാര്യമായി സംസാരിക്കുന്നതിനെയോ ഉള്ളിൽ ആലോചിക്കുന്നതിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: അപ്പോൾ
  rationale: ആഖ്യാനത്തിന്റെ തുടർച്ച സ്വാഭാവികമായ മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു; ഇവിടെ καὶ-യുടെ ലളിതമായ ബന്ധകപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: ἰδού
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗ്രീക്ക് വ്യവഹാരചിഹ്നത്തിന്റെ ശക്തിയും ആഖ്യാനത്തിന്റെ സജീവതയും നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: τινες τῶν γραμματέων
  choice: ശാസ്ത്രിമാരിൽ ചിലർ
  rationale: അനിശ്ചിതമായ ഒരു ഉപവിഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; γραμματεῖς എന്ന സുവിശേഷപരമായ പദത്തിന് പതിവായ മലയാളരൂപമായ ‘ശാസ്ത്രിമാർ’ ഉപയോഗിച്ചു.
- source_word: εἶπαν ἐν ἑαυτοῖς
  choice: തങ്ങളോടുതന്നെ പറഞ്ഞു
  rationale: ‘പറഞ്ഞു’ എന്ന ക്രിയയും സ്വകാര്യമായോ ആന്തരികമായോ ഉള്ള ആലോചനയും ഒരുപോലെ പ്രതിഫലിപ്പിക്കുന്നു; അതിനെ വെറും ‘ചിന്തിച്ചു’ എന്നു തീർപ്പാക്കുന്നില്ല.
- source_word: Οὗτος
  choice: ഇവൻ
  rationale: സന്ദർഭത്തിലെ ചൂണ്ടിക്കാട്ടലും അല്പം അവഹേളനപരമായ ഭാവവും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: βλασφημεῖ
  choice: ദൈവദൂഷണം പറയുന്നു
  rationale: ദൈവത്തെ അപമാനിക്കുന്ന വാക്ക് പറയുന്നു എന്ന കുറ്റാരോപണം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; വർത്തമാനകാലത്തിന്റെ തുടരുന്ന സ്വഭാവവും സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: യേശുവിനെതിരായ ശാസ്ത്രിമാരുടെ കുറ്റാരോപണം
  choice: ഇവൻ ദൈവദൂഷണം പറയുന്നു
  alternative: ഇവൻ ദൂഷണം പറയുന്നു / ഇവൻ ദൈവത്തെ ദുഷിക്കുന്നു
  rationale: കുറ്റാരോപണത്തിന്റെ നേരിട്ടുള്ള ശക്തി നിലനിർത്തുന്നു; അത് ശരിയോ തെറ്റോ എന്ന പിന്നീടുള്ള ദൈവശാസ്ത്രപരമായ വിശദീകരണം ഈ വാക്യത്തിലേക്ക് കൊണ്ടുവരാതെ ആഖ്യാനത്തിലെ സംഘർഷം സംരക്ഷിക്കുന്നു.
- issue: ἐν ἑαυτοῖς സ്വകാര്യസംഭാഷണമോ ആന്തരികചിന്തയോ എന്നത്
  choice: തങ്ങളോടുതന്നെ പറഞ്ഞു
  alternative: തമ്മിൽ പറഞ്ഞു / മനസ്സിൽ പറഞ്ഞു
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിൽ സ്വകാര്യമായി തമ്മിൽ പറയുന്നതും ഉള്ളിൽ ആലോചിക്കുന്നതും സാധ്യതകളാണ്; മുഖ്യപാഠവും അടിക്കുറിപ്പും ചേർന്ന് ഈ യഥാർഥ സന്ദിഗ്ധത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ മലയാളം. ‘ഇതാ’ മൂലപാഠത്തിലെ ശ്രദ്ധാകർഷക ചിഹ്നം നിലനിർത്തുന്നു; ‘ശാസ്ത്രിമാർ’ സുവിശേഷസന്ദർഭത്തിലെ പരിചിതമായ പദമാണ്.
