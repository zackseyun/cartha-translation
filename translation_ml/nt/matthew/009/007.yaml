translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ സംക്ഷിപ്തതയും പ്രവർത്തനക്രമവും നിലനിർത്തി; അനാവശ്യമായ വ്യാഖ്യാനമോ കാലസൂചനയോ ചേർത്തിട്ടില്ല.
