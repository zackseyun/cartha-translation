id: MAT.9.7
reference: Matthew 9:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐγερθεὶς ἀπῆλθεν εἰς τὸν οἶκον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/007.yaml
  text: And he got up and went away to his house[a].
translation:
  language: ml
  text: അവൻ എഴുന്നേറ്റ് തന്റെ വീട്ടിലേക്കു പോയി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തന്റെ വീട്ടിലേക്കു പുറപ്പെട്ടു.’
    reason: ἀπῆλθεν എന്ന പദത്തിലെ ‘അവിടെനിന്നു പുറപ്പെടുക’ എന്ന അർഥനിറം കൂടുതൽ വ്യക്തമായി നൽകുന്ന പരിഭാഷാവികല്പം.
lexical_decisions:
- source_word: καὶ
  choice: അവൻ
  rationale: ഗ്രീക്കിലെ καὶ മുൻവിവരണത്തോടുള്ള ലളിതമായ ബന്ധം സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനപ്രവാഹത്തിൽ പ്രത്യേകമായി ‘പിന്നെ/അപ്പോൾ’ ചേർക്കാതെ, കർത്താവിനെ വ്യക്തമാക്കുന്ന ‘അവൻ’ കൊണ്ടാണ് വാക്യം ആരംഭിച്ചത്; ഇതിലൂടെ ഗ്രീക്കിൽ ഇല്ലാത്ത അധിക കാലസൂചന ഒഴിവാക്കുന്നു.
- source_word: ἐγερθεὶς
  choice: എഴുന്നേറ്റ്
  rationale: ἐγείρω എന്ന ക്രിയയുടെ aorist passive participle ഇവിടെ അകർമക അർഥത്തിലാണ്. ‘എഴുന്നേറ്റ്’ എന്നത് മുൻക്രിയയും തുടർന്നുള്ള പ്രധാനക്രിയയും തമ്മിലുള്ള ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: ἀπῆλθεν
  choice: പോയി
  rationale: ἀπέρχομαι ഇവിടെ ആ സ്ഥലത്തുനിന്നുള്ള പുറപ്പെടൽ സൂചിപ്പിക്കുന്നു. ‘പോയി’ എന്നത് സന്ദർഭത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്; ‘പുറപ്പെട്ടുപോയി’ എന്നത് സാധ്യമെങ്കിലും അനാവശ്യമായി ഭാരമുള്ളതാണ്.
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: തന്റെ വീട്ടിലേക്കു
  rationale: εἰς ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ചലനവും οἶκος വാസസ്ഥലവും സൂചിപ്പിക്കുന്നു. ഒരേ കർത്താവിലേക്കുള്ള മടക്കസൂചന മലയാളത്തിൽ സ്വാഭാവികമായി നൽകാൻ αὐτοῦ എന്നത് ‘തന്റെ’ എന്നും, ലക്ഷ്യം സൂചിപ്പിക്കാൻ ‘വീട്ടിലേക്കു’ എന്നും പരിഭാഷപ്പെടുത്തി.
