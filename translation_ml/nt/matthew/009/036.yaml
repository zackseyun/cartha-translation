id: MAT.9.36
reference: Matthew 9:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ τοὺς ὄχλους ἐσπλαγχνίσθη περὶ αὐτῶν ὅτι ἦσαν ἐσκυλμένοι καὶ ἐρριμμένοι ⸀ὡσεὶ πρόβατα μὴ ἔχοντα ποιμένα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/036.yaml
  text: And when he saw the crowds[a], he had compassion on them, because they were harassed and cast down, like sheep without a shepherd.
translation:
  language: ml
  text: അവൻ ജനക്കൂട്ടങ്ങളെ കണ്ടപ്പോൾ അവരോടു കരുണ തോന്നി; കാരണം, അവർ ഇടയനില്ലാത്ത ആടുകളെപ്പോലെ കഷ്ടപ്പെടുത്തപ്പെട്ടവരും തള്ളിയിടപ്പെട്ടവരുമായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഉപദ്രവിക്കപ്പെട്ടവരും നിസ്സഹായരുമായിരുന്നു.” ഗ്രീക്ക് പദങ്ങൾ ജനക്കൂട്ടം വല്ലാതെ ക്ഷീണിച്ചവരും സ്വയം പരിപാലിക്കാൻ കഴിയാത്തവരുമായിരുന്നു എന്ന അർത്ഥത്തിലും ഗ്രഹിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδὼν δὲ τοὺς ὄχλους
  choice: ജനക്കൂട്ടങ്ങളെ കണ്ടപ്പോൾ
  rationale: ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്ന δέ മലയാളത്തിൽ പ്രത്യേകമായി വിവർത്തനം ചെയ്യാതെ, aorist participle-ന്റെ കാലബന്ധം ‘കണ്ടപ്പോൾ’ എന്നു സ്വാഭാവികമായി നൽകി; ὄχλοι എന്ന ബഹുവചനത്തിന് ‘ജനക്കൂട്ടങ്ങൾ’ അനുയോജ്യം.
- source_word: ἐσπλαγχνίσθη περὶ αὐτῶν
  choice: അവരോട് അവന് മനസ്സലിവു തോന്നി
  rationale: σπλαγχνίζομαι സൂചിപ്പിക്കുന്ന ആഴമുള്ള കരുണയെ ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὅτι
  choice: കാരണം
  rationale: യേശുവിന്റെ മനസ്സലിവിനുള്ള കാരണം അവതരിപ്പിക്കുന്ന ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἐσκυλμένοι
  choice: പീഡിപ്പിക്കപ്പെട്ടവർ
  rationale: σκύλλω എന്ന പദത്തിലെ ഉപദ്രവിക്കപ്പെടുക, വല്ലാതെ ബുദ്ധിമുട്ടിക്കപ്പെടുക, ക്ഷീണിപ്പിക്കപ്പെടുക എന്നീ ആശയങ്ങളിൽ പീഡനത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: ἐρριμμένοι
  choice: നിലത്തുവീഴ്ത്തപ്പെട്ടവർ
  rationale: ῥίπτω എന്നതിന്റെ ‘എറിഞ്ഞിടുക/വീഴ്ത്തുക’ എന്ന ദൃശ്യബിംബവും perfect passive രൂപത്തിലെ അവസ്ഥയും സംരക്ഷിക്കുന്നു; ‘നിസ്സഹായർ’ എന്ന വ്യാഖ്യാനപരമായ പരിഭാഷയെ മുഖ്യപാഠത്തിൽ ഒഴിവാക്കുന്നു.
- source_word: ὡσεὶ πρόβατα μὴ ἔχοντα ποιμένα
  choice: ഇടയനില്ലാത്ത ആടുകളെപ്പോലെ
  rationale: നേതൃത്വവും സംരക്ഷണവും ഇല്ലാത്ത അവസ്ഥയുടെ ഇടയരൂപകം ചുരുക്കവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ കരുണയെ സൂചിപ്പിക്കുന്ന ഭാഷ
  choice: അവരോട് അവന് മനസ്സലിവു തോന്നി
  alternative: അവരോടു കരുണ തോന്നി / അവർക്കുവേണ്ടി അവൻ കരുണകൊണ്ട് ഉള്ളലിഞ്ഞു
  rationale: യേശുവിന്റെ ആഴമുള്ള കരുണ നിലനിർത്തുമ്പോഴും ഗ്രീക്ക് ശരീരാവയവപ്രയോഗം കൃത്രിമമായി പകർത്തുകയോ പരമ്പരാഗതമായ പഴഞ്ചൻ ഭാഷ ഉപയോഗിക്കുകയോ ചെയ്യുന്നില്ല.
- issue: ജനക്കൂട്ടങ്ങളുടെ അവസ്ഥ
  choice: പീഡിപ്പിക്കപ്പെട്ടവരും നിലത്തുവീഴ്ത്തപ്പെട്ടവരും
  alternative: ക്ഷീണിതരും നിസ്സഹായരും / അലഞ്ഞും ചിതറിയും പോയവർ
  rationale: രണ്ട് passive participles-ലുമുള്ള ഉപദ്രവത്തിന്റെയും വീഴ്ത്തപ്പെട്ട അവസ്ഥയുടെയും ശക്തമായ ദൃശ്യബിംബം സംരക്ഷിക്കുന്നു. ‘നിസ്സഹായർ’ സാധ്യമായ അർത്ഥവ്യാഖ്യാനമാണെങ്കിലും മുഖ്യപാഠത്തിൽ അത് മാത്രം ഉറപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘മനസ്സലിവ്’, ‘ഇടയൻ’ തുടങ്ങിയ സാധാരണ ബൈബിൾസന്ദർഭ പദങ്ങൾ നിലനിർത്തി; ദുഷ്കരമായ participles-ന്റെ ദൃശ്യശക്തി മുഖ്യപാഠത്തിലും കൂടുതൽ വ്യാഖ്യാനപരമായ സാധ്യത അടിക്കുറിപ്പിലും നൽകി.
