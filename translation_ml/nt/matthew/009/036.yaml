    rationale: “നിലത്തുവീഴ്ത്തപ്പെട്ടവരും” specifies being brought to the ground. The Greek can evoke being thrown down or cast aside, but the immediate shepherd metaphor supports wording that preserves the image without introducing that extra physical detail.
