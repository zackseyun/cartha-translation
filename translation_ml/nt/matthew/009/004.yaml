id: MAT.9.4
reference: Matthew 9:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸀εἰδὼς ὁ Ἰησοῦς τὰς ἐνθυμήσεις αὐτῶν εἶπεν· ⸀Ἱνατί ἐνθυμεῖσθε πονηρὰ ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/004.yaml
  text: And Jesus[a], knowing their thoughts, said, “Why are you thinking evil in your hearts?”
translation:
  language: ml
  text: 'യേശു അവരുടെ ചിന്തകൾ അറിഞ്ഞ്[a] പറഞ്ഞു: “നിങ്ങൾ നിങ്ങളുടെ ഹൃദയങ്ങളിൽ തിന്മ ചിന്തിക്കുന്നത് എന്തിന്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരുടെ ചിന്തകൾ തിരിച്ചറിഞ്ഞ്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: അറിഞ്ഞ്
  rationale: ഈ കൃന്തം യേശുവിന് അവരുടെ ഉള്ളിലെ ചിന്തകൾ അറിയാമായിരുന്നു എന്നു സ്വാഭാവികവും സംക്ഷിപ്തവുമായി അറിയിക്കുന്നു; ‘ഗ്രഹിച്ച്’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἐνθυμήσεις
  choice: ചിന്തകൾ
  rationale: മനസ്സിനുള്ളിലെ ആലോചനകളെയും വിചാരങ്ങളെയും സൂചിപ്പിക്കുന്ന പദത്തിന് ആധുനിക മലയാളത്തിലെ സ്വാഭാവികമായ സമാനപദമാണിത്.
- source_word: Ἱνατί
  choice: എന്തിന്
  rationale: കാരണത്തെയോ ഉദ്ദേശ്യത്തെയോ ചോദിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം മലയാളത്തിൽ നേരിട്ടും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἐνθυμεῖσθε
  choice: ചിന്തിക്കുന്നത്
  rationale: തുടരുന്ന ആന്തരിക ചിന്താപ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്ന വർത്തമാനകാല ഭാവം നിലനിർത്തുന്നു.
- source_word: πονηρὰ
  choice: തിന്മ
  rationale: നപുംസകലിംഗ ബഹുവചന വിശേഷണം നാമവാചകമായി ഉപയോഗിച്ചിരിക്കുന്നു. മലയാളത്തിൽ ‘തിന്മ ചിന്തിക്കുക’ എന്ന പ്രയോഗം അനാവശ്യമായ വിശദീകരണം ചേർക്കാതെ ദുഷ്ടമായ ചിന്തകളെയോ ഉദ്ദേശ്യങ്ങളെയോ ഉൾക്കൊള്ളുന്നു.
- source_word: καρδίαις
  choice: ഹൃദയങ്ങളിൽ
  rationale: ചിന്തയും ഉദ്ദേശ്യവും ഉൾപ്പെടുന്ന ആന്തരിക മനുഷ്യനെ സൂചിപ്പിക്കുന്ന ഉറവിടരൂപകം നിലനിർത്തുന്നു; അതിനെ ‘മനസ്സുകളിൽ’ എന്നു ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: പറയപ്പെടാത്ത ആന്തരിക ചിന്തകളെക്കുറിച്ചുള്ള യേശുവിന്റെ അറിവ്
  choice: യേശു അവരുടെ ചിന്തകൾ അറിഞ്ഞ്
  alternative: യേശു അവരുടെ ചിന്തകൾ ഗ്രഹിച്ച്
  rationale: അവരുടെ ഉള്ളിലെ ആലോചന യേശുവിന് അറിയാമായിരുന്നുവെന്ന വാക്യത്തിന്റെ അവകാശവാദം നിലനിർത്തുന്നു; അതിനെക്കുറിച്ച് വാക്യം പറയുന്നതിലധികം സിദ്ധാന്തപരമായ വിശദീകരണം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘ഹൃദയങ്ങളിൽ’ എന്ന ബൈബിൾരൂപകം സംരക്ഷിക്കുകയും ‘ചിന്തകൾ/ചിന്തിക്കുന്നത്’ എന്ന ആവർത്തനം ഗ്രീക്കിലെ പദബന്ധത്തെ പ്രതിഫലിപ്പിക്കുന്ന പരിധിയിൽ നിലനിർത്തുകയും ചെയ്തു.
