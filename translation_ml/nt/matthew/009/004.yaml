  to: 'യേശു അവരുടെ ചിന്തകൾ അറിഞ്ഞ്[a] പറഞ്ഞു: “നിങ്ങൾ നിങ്ങളുടെ ഹൃദയങ്ങളിൽ തിന്മ ചിന്തിക്കുന്നത് എന്തിന്?”'
