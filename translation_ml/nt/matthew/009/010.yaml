revisions:
- from: അവൻ ആ വീട്ടിൽ[a] ഭക്ഷണത്തിനായി ചാരിക്കിടക്കുമ്പോൾ[b], അതാ, അനേകം നികുതിപിരിവുകാരും പാപികളും വന്ന് യേശുവിനോടും അവന്റെ ശിഷ്യന്മാരോടുംകൂടെ ഭക്ഷണത്തിനായി ചാരിക്കിടന്നു.
  to: അവൻ ആ വീട്ടിൽ[a] ഭക്ഷണത്തിനായി ചാഞ്ഞുകിടക്കുമ്പോൾ[b], അതാ, അനേകം നികുതിപിരിവുകാരും പാപികളും വന്ന് യേശുവും അവന്റെ ശിഷ്യന്മാരുംകൂടെ ഭക്ഷണത്തിനായി ചാഞ്ഞുകിടന്നു.
  rationale: The revision retains every source-level element and the deliberate ambiguity concerning the house. It improves the idiomatic expression of historical meal reclining and recasts the final accompaniment phrase so that shared table fellowship with both Jesus and his disciples is grammatically clear in modern standard Malayalam.
