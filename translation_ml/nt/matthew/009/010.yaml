id: MAT.9.10
reference: Matthew 9:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο αὐτοῦ ἀνακειμένου ἐν τῇ οἰκίᾳ, ⸀καὶ ἰδοὺ πολλοὶ τελῶναι καὶ ἁμαρτωλοὶ ἐλθόντες συνανέκειντο τῷ Ἰησοῦ καὶ τοῖς μαθηταῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/010.yaml
  text: And as he was reclining at table in the house[a], behold[b], many tax collectors and sinners came and were reclining at table with Jesus and his disciples.
translation:
  language: ml
  text: അവൻ ആ വീട്ടിൽ[a] ഭക്ഷണത്തിനായി ചാഞ്ഞുകിടക്കുമ്പോൾ[b], അതാ, അനേകം നികുതിപിരിവുകാരും പാപികളും വന്ന് യേശുവും അവന്റെ ശിഷ്യന്മാരുംകൂടെ ഭക്ഷണത്തിനായി ചാഞ്ഞുകിടന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ വാക്യം വീട് ആരുടേതാണെന്ന് വ്യക്തമാക്കുന്നില്ല; മൂലപാഠത്തിൽ ‘ആ വീട്ടിൽ’ എന്നു മാത്രമേയുള്ളൂ.
    reason: alternative_reading
  - marker: b
    text: 'കൂടുതൽ സ്വാഭാവികമായി: ‘ഭക്ഷണം കഴിച്ചുകൊണ്ടിരിക്കുമ്പോൾ.’ അക്കാലത്തെ പതിവനുസരിച്ച് ഭക്ഷണത്തിനായി ചാഞ്ഞുകിടക്കുന്ന ശരീരനിലയാണ് ഗ്രീക്ക് ക്രിയ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: —ക്കുമ്പോൾ
  rationale: καὶ ἐγένετο ഇവിടെ ആഖ്യാനത്തിലെ സമയബന്ധം സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. മലയാളത്തിൽ ‘സംഭവിച്ചു’ എന്നു വാക്കിന് വാക്കായി ചേർക്കാതെ ആശ്രിതകാലവാക്യമായി നൽകുന്നത് സ്വാഭാവികവും അർഥസൂക്ഷ്മത കാത്തുസൂക്ഷിക്കുന്നതുമാണ്.
- source_word: αὐτοῦ ἀνακειμένου
  choice: അവൻ ... ഭക്ഷണത്തിനായി ചാരിക്കിടക്കുമ്പോൾ
  rationale: ἀνάκειμαι വിരുന്നുസന്ദർഭത്തിൽ ഭക്ഷണം കഴിക്കാനായി ചാരിക്കിടക്കുന്ന അന്നത്തെ പതിവായ ശരീരനിലയെ സൂചിപ്പിക്കുന്നു. ‘അവൻ’ എന്ന സർവനാമം മൂലപാഠത്തിലെ αὐτοῦയുടെ രൂപം നിലനിർത്തുന്നു.
- source_word: ἐν τῇ οἰκίᾳ
  choice: ആ വീട്ടിൽ
  rationale: നിശ്ചയാർഥകമായ τῇ οἰκίᾳയെ സ്വാഭാവിക മലയാളത്തിൽ ‘ആ വീട്ടിൽ’ എന്നു നൽകി; വീട് ആരുടേതാണെന്ന് മൂലപാഠം ഈ വാക്യത്തിൽ വ്യക്തമാക്കാത്തതിനാൽ അത് കൂട്ടിച്ചേർത്തിട്ടില്ല.
- source_word: ἰδοὺ
  choice: അതാ
  rationale: തുടർന്ന് വരുന്നതിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന ἰδού എന്ന ആഖ്യാനചിഹ്നത്തിന്റെ ജീവന്തത ‘അതാ’ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: τελῶναι
  choice: നികുതിപിരിവുകാർ
  rationale: റോമൻ ഭരണക്രമത്തിനുവേണ്ടി നികുതി പിരിച്ചിരുന്നവരെയും അവരോടു ബന്ധപ്പെട്ട സാമൂഹിക അപകീർത്തിയെയും വ്യക്തമായി സൂചിപ്പിക്കുന്ന സാധാരണ മലയാളപദം.
- source_word: ἁμαρτωλοὶ
  choice: പാപികൾ
  rationale: ഇവിടെ നാമവൽക്കരിക്കപ്പെട്ട വിശേഷണമാണ്; സാമൂഹിക-മതപരമായ വർഗീകരണത്തിന്റെ മൂർച്ച മൃദൂകരിക്കാതെ ‘പാപികൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: ἐλθόντες
  choice: വന്ന്
  rationale: അയോറിസ്റ്റ് കൃദന്തരൂപം മുഖ്യക്രിയയ്ക്കു മുമ്പുള്ള വരവിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘വന്ന്’ ആ ക്രമം സംക്ഷിപ്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: συνανέκειντο
  choice: —നോടും ... —നോടുംകൂടെ ഭക്ഷണത്തിനായി ചാരിക്കിടന്നു
  rationale: συνανάκειμαι ഒരുമിച്ച് വിരുന്നിൽ ചാരിക്കിടക്കുന്നതും അതുവഴിയുള്ള മേശക്കൂട്ടായ്മയും സൂചിപ്പിക്കുന്നു. ‘ഭക്ഷണം കഴിച്ചു’ എന്ന പൊതുവായ രൂപത്തേക്കാൾ ഈ പരിഭാഷ ചരിത്രപരമായ ഭക്ഷണഭാവം നിലനിർത്തുന്നു.
- source_word: τῷ Ἰησοῦ
  choice: യേശുവിനോട്
  rationale: പേരിന്റെ നിലവാരമുള്ള മലയാളരൂപമായ ‘യേശു’ ഉപയോഗിച്ചു; σύν ഘടകത്തിന്റെ സഹവാസാർഥം ‘—നോടുകൂടെ’ എന്ന ഘടനയിൽ പ്രകടമാക്കുന്നു.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: അവന്റെ ശിഷ്യന്മാർ
  rationale: μαθηταίയിലെ ഗുരു-ശിഷ്യബന്ധം നിലനിർത്തുന്ന സ്ഥാപിതവും വ്യക്തവുമായ മലയാളപ്രയോഗമാണ് ‘ശിഷ്യന്മാർ’.
theological_decisions:
- issue: ഭക്ഷണവേളയിലെ ശരീരനിലയും മേശക്കൂട്ടായ്മയും
  choice: ‘ഭക്ഷണത്തിനായി ചാരിക്കിടക്കുക’ എന്ന ദൃശ്യഭാഷ നിലനിർത്തി.
  alternative: ‘ഭക്ഷണം കഴിക്കുക’ അഥവാ ‘വിരുന്നുണ്ണുക’
  rationale: യേശുവും സാമൂഹികമായി ഒറ്റപ്പെടുത്തപ്പെട്ടവരും പങ്കിട്ട മേശക്കൂട്ടായ്മയാണ് സന്ദർഭത്തിൽ പ്രാധാന്യമുള്ളത്. മൂലപാഠത്തിലെ ചാരിക്കിടക്കുന്ന ഭാവം നിലനിർത്തുന്നത് ഈ ദൃശ്യവും സാമൂഹികസൂചനയും സംരക്ഷിക്കുന്നു; അധികമായ ദൈവശാസ്ത്രവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: ‘ആ വീട്’ ആരുടേതെന്ന തിരിച്ചറിയൽ
  choice: വീടിന്റെ ഉടമയെ മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കിയില്ല.
  alternative: ‘മത്തായിയുടെ വീട്ടിൽ’ അഥവാ ‘അവന്റെ വീട്ടിൽ’
  rationale: ἐν τῇ οἰκίᾳ എന്നത് ‘ആ വീട്ടിൽ’ എന്നു മാത്രമാണ് പറയുന്നത്. വിശാലസന്ദർഭത്തിൽ നിന്ന് ഉടമയെ അനുമാനിക്കാമെങ്കിലും ഈ വാക്യത്തിൽ ഇല്ലാത്ത തിരിച്ചറിയൽ പരിഭാഷയിൽ ചേർക്കാതിരിക്കുന്നത് യഥാർഥമായ അവ്യക്തത സംരക്ഷിക്കുന്നു.
- issue: ആദ്യത്തെ αὐτοῦയുടെ വ്യക്തിസൂചന
  choice: ‘അവൻ’ എന്ന സർവനാമം നിലനിർത്തി.
  alternative: ‘യേശു’ എന്നു വ്യക്തമായി ആവർത്തിക്കുക
  rationale: മൂലപാഠം ആദ്യം സർവനാമവും പിന്നീട് τῷ Ἰησοῦ എന്ന വ്യക്തമായ പേരും ഉപയോഗിക്കുന്നു. സന്ദർഭം ആശ്രയിക്കുന്ന ഈ ഘടന പരിഭാഷയിൽ നിലനിർത്തുന്നത് മൂലത്തിന്റെ വിവരക്രമം അനാവശ്യമായി തീർപ്പാക്കാതിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ചരിത്രപരമായ വിരുന്നുഭാവം വ്യക്തമാക്കാൻ ‘ഭക്ഷണത്തിനായി ചാരിക്കിടക്കുക’ ഉപയോഗിച്ചപ്പോൾ, വായനാസൗകര്യത്തിനായി അതിന്റെ സാധാരണ മലയാളരൂപം അടിക്കുറിപ്പിൽ നൽകി. ‘അതാ’ ഉപയോഗിച്ച് ἰδούയുടെ ശ്രദ്ധാകർഷക സ്വഭാവം നിലനിർത്തി.
