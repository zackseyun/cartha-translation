id: MAT.9.8
reference: Matthew 9:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ ὄχλοι ⸀ἐφοβήθησαν καὶ ἐδόξασαν τὸν θεὸν τὸν δόντα ἐξουσίαν τοιαύτην τοῖς ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/008.yaml
  text: But when the crowds saw it[a], they were afraid and glorified God[b], who had given such authority to men.
translation:
  language: ml
  text: എന്നാൽ ജനക്കൂട്ടങ്ങൾ അതു കണ്ടപ്പോൾ അവർ ഭയപ്പെട്ടു[a]; മനുഷ്യർക്ക്[b] ഇങ്ങനെയുള്ള അധികാരം നൽകിയ ദൈവത്തെ അവർ മഹത്ത്വപ്പെടുത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഭക്തിപൂർവമായ വിസ്മയം തോന്നി.” ഗ്രീക്ക് ക്രിയയുടെ കൂടുതൽ അക്ഷരാർഥം “ഭയപ്പെട്ടു” എന്നാണ്; എന്നാൽ ഈ ഭയത്തിൽ ഭക്തിപൂർവമായ വിസ്മയവും ഉൾപ്പെട്ടിരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ജനങ്ങൾക്ക്” അല്ലെങ്കിൽ “മനുഷ്യവർഗത്തിന്.” ഗ്രീക്കിൽ “മനുഷ്യർക്ക്” എന്നാണ്; ഈ പദം പൊതുവേ മനുഷ്യരെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: അതു കണ്ടപ്പോൾ
  rationale: ὁράω എന്ന ക്രിയയുടെ aorist participle സ്വാഭാവിക മലയാളത്തിൽ കാലസൂചക ഉപവാക്യമായി നൽകി. സന്ദർഭത്തിൽ സൂചിതമായ സൗഖ്യപ്പെടുത്തൽ/പാപമോചന സംഭവത്തെയാണ് ‘അതു’ സൂചിപ്പിക്കുന്നത്.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: δέ ഇവിടെ ആഖ്യാനത്തിലെ മാറ്റവും നേരിയ വൈരുധ്യവും അടയാളപ്പെടുത്തുന്നു; ‘എന്നാൽ’ അത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: οἱ ὄχλοι
  choice: ജനക്കൂട്ടങ്ങൾ
  rationale: ഗ്രീക്കിലെ ബഹുവചനം നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ പദം ഉപയോഗിച്ചു.
- source_word: ἐφοβήθησαν
  choice: ഭയപ്പെട്ടു
  rationale: φοβέομαι എന്നതിന്റെ നേരിട്ടുള്ള അർഥം ‘ഭയപ്പെടുക’ എന്നാണ്. ഭക്തിപൂർവമായ വിസ്മയം ഉൾപ്പെട്ടിരിക്കാമെങ്കിലും ആ അർഥത്തിലേക്ക് മാത്രം ചുരുക്കാതെ മൂലപാഠത്തിലെ സംഘർഷം നിലനിർത്തി.
- source_word: ἐδόξασαν
  choice: മഹത്ത്വപ്പെടുത്തി
  rationale: δοξάζω എന്ന പ്രധാന ദൈവശാസ്ത്രപദത്തിന്റെ ‘glorify’ എന്ന അർഥവും ഗൗരവവും നിലനിർത്തുന്നു.
- source_word: τὸν θεὸν
  choice: ദൈവത്തെ
  rationale: ἐδόξασαν എന്ന ക്രിയയുടെ നേരിട്ടുള്ള കർമം; മലയാളത്തിലെ സാധാരണ രൂപം.
- source_word: τὸν δόντα
  choice: നൽകിയ
  rationale: θεόν-നെ വിശേഷിപ്പിക്കുന്ന articular aorist participle മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണരൂപത്തിൽ നൽകി; ജനങ്ങളുടെ പ്രതികരണത്തിനു മുമ്പുള്ള ദാനത്തെ സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: ἐξουσίαν
  choice: അധികാരം
  rationale: ἐξουσία വെറും ശക്തിയേക്കാൾ അധികാരം/അവകാശം എന്ന ആശയം സൂചിപ്പിക്കുന്നു; പാപങ്ങൾ ക്ഷമിക്കാനുള്ള യേശുവിന്റെ അധികാരമെന്ന സന്ദർഭത്തിൽ ഇത് നിർണായകമാണ്.
- source_word: τοιαύτην
  choice: ഇങ്ങനെയുള്ള
  rationale: ἐξουσίαν-നെ വിശേഷിപ്പിക്കുന്ന τοιαύτην എന്നതിന്റെ സ്വാഭാവിക മലയാള പരിഭാഷ.
- source_word: τοῖς ἀνθρώποις
  choice: മനുഷ്യർക്ക്
  rationale: ἄνθρωποι വ്യാകരണപരമായി പുരുഷലിംഗ ബഹുവചനമാണെങ്കിലും മനുഷ്യരെ പൊതുവായി പ്രതിനിധീകരിക്കാം. ‘മനുഷ്യർക്ക്’ എന്നത് ആ വ്യാപ്തി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; യേശുവിന്റെ പ്രവൃത്തിയോടുള്ള ജനങ്ങളുടെ പ്രതികരണത്തിൽ അധികാരം മനുഷ്യർക്കു നൽകിയെന്ന ആഖ്യാനപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ജനക്കൂട്ടത്തിന്റെ പ്രതികരണത്തെ ഭയം എന്നോ ഭക്തിപൂർവമായ വിസ്മയം എന്നോ പരിഭാഷപ്പെടുത്തുക
  choice: അവർ ഭയപ്പെട്ടു
  alternative: അവർ ഭക്തിപൂർവമായ വിസ്മയത്താൽ നിറഞ്ഞു
  rationale: ഗ്രീക്ക് ക്രിയയുടെ അടിസ്ഥാന അർഥം ഭയപ്പെടുക എന്നാണ്. സന്ദർഭത്തിൽ ഭക്തിപൂർവമായ വിസ്മയം ഉണ്ടായിരിക്കാമെങ്കിലും അതിനെ മാത്രം മുഖ്യപാഠമാക്കി അർഥം നിർണയിച്ചില്ല.
- issue: τοῖς ἀνθρώποις എന്നതിന്റെ വ്യാപ്തി
  choice: മനുഷ്യർക്ക്
  alternative: പുരുഷന്മാർക്ക്
  rationale: ἄνθρωποι ഇവിടെ മനുഷ്യരെ പൊതുവായി പ്രതിനിധീകരിക്കാൻ കഴിയും. ആധുനിക മലയാളത്തിൽ ‘പുരുഷന്മാർക്ക്’ എന്നത് അനാവശ്യമായി പുരുഷന്മാർക്കു മാത്രമായി അർഥം ചുരുക്കാൻ സാധ്യതയുള്ളതിനാൽ ‘മനുഷ്യർക്ക്’ തെരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ ബഹുവചനമായ ‘ജനക്കൂട്ടങ്ങൾ’ നിലനിർത്തി. ഭയം/ഭക്തിപൂർവമായ വിസ്മയം എന്ന അർഥവ്യാപ്തി മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു; ‘മനുഷ്യർക്ക്’ എന്ന രൂപം ἄνθρωποι എന്നതിന്റെ സന്ദർഭോചിതമായ പൊതുമാനവ വ്യാപ്തി നൽകുന്നു.
