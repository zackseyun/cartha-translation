id: MAT.9.25
reference: Matthew 9:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτε δὲ ἐξεβλήθη ὁ ὄχλος, εἰσελθὼν ἐκράτησεν τῆς χειρὸς αὐτῆς, καὶ ἠγέρθη τὸ κοράσιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/025.yaml
  text: But when the crowd had been put outside[a], he went in and took her by the hand, and the girl rose.
translation:
  language: ml
  text: എന്നാൽ ജനക്കൂട്ടം പുറത്താക്കപ്പെട്ടശേഷം, അവൻ അകത്തു ചെന്ന് അവളുടെ കൈ പിടിച്ചു; പെൺകുട്ടി എഴുന്നേറ്റു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പെൺകുട്ടി എഴുന്നേൽപ്പിക്കപ്പെട്ടു.” ഗ്രീക്ക് ക്രിയയെ ഇവിടെ രണ്ടു വിധത്തിലും മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτε δὲ
  choice: എന്നാൽ … ശേഷം
  rationale: ὅτε സൂചിപ്പിക്കുന്ന സമയബന്ധം ‘ശേഷം’കൊണ്ടും δέ സൂചിപ്പിക്കുന്ന മൃദുവായ ആഖ്യാനമാറ്റം ‘എന്നാൽ’കൊണ്ടും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐξεβλήθη ὁ ὄχλος
  choice: ജനക്കൂട്ടം പുറത്താക്കപ്പെട്ടശേഷം
  rationale: ἐκβάλλωയുടെ അയോറിസ്റ്റ് കർമണിപ്രയോഗം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അനാവശ്യമായ ബലപ്രയോഗധ്വനി ചേർക്കാതെ ആളുകളെ പുറത്താക്കിയതെന്ന അർഥം നൽകുന്നു.
- source_word: εἰσελθὼν
  choice: അകത്തു ചെന്ന്
  rationale: പ്രധാന ക്രിയയ്ക്കു മുമ്പുള്ള തുടർച്ചയായ പ്രവൃത്തിയെ മലയാളത്തിലെ സ്വാഭാവിക ക്രിയാവിശേഷണരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἐκράτησεν τῆς χειρὸς αὐτῆς
  choice: അവളുടെ കൈ പിടിച്ചു
  rationale: κρατέωയും ഷഷ്ഠീവിഭക്തിയും ചേർന്നുള്ള ‘കൈയിൽ പിടിക്കുക/കൈ പിടിക്കുക’ എന്ന അർഥം ലളിതവും കൃത്യവുമായി നൽകുന്നു.
- source_word: ἠγέρθη
  choice: എഴുന്നേറ്റു
  rationale: സന്ദർഭത്തിൽ സ്വാഭാവികമായ ഫലപ്രവൃത്തിയായി വായിക്കാവുന്ന മലയാളപ്രയോഗമാണിത്; ഗ്രീക്കിലെ കർമണിസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: τὸ κοράσιον
  choice: പെൺകുട്ടി
  rationale: κοράσιον സൂചിപ്പിക്കുന്ന പ്രായം കുറഞ്ഞ പെൺകുട്ടിയെ ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: മരണത്തിൽനിന്നുള്ള പുനരുജ്ജീവനസന്ദർഭത്തിൽ ἠγέρθη എന്നതിന്റെ പ്രയോഗം
  choice: എഴുന്നേറ്റു
  alternative: എഴുന്നേൽപ്പിക്കപ്പെട്ടു
  rationale: ‘എഴുന്നേറ്റു’ ഉടനെയുള്ള ദൃശ്യഫലം സ്വാഭാവികമായി വിവരിക്കുന്നു; ‘എഴുന്നേൽപ്പിക്കപ്പെട്ടു’ എന്ന കർമണിവായനയും ഗ്രീക്കിൽ സാധ്യമായതിനാൽ അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു. ഇങ്ങനെ കർത്തൃത്വത്തെ വാക്യം പറയുന്നതിലധികം നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. വാക്യക്രമം ഗ്രീക്ക് ആഖ്യാനത്തിന്റെ പ്രവൃത്തിതുടർച്ച നിലനിർത്തുന്നു; സാങ്കേതികമോ സഭാവിഭാഗവിശേഷമുള്ളതോ ആയ പദങ്ങൾ ഒഴിവാക്കിയിരിക്കുന്നു.
