id: MAT.9.5
reference: Matthew 9:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τί γάρ ἐστιν εὐκοπώτερον, εἰπεῖν· ⸀Ἀφίενταί σου αἱ ἁμαρτίαι, ἢ εἰπεῖν· ⸀Ἔγειρε καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/005.yaml
  text: 'For which is easier: to say[a], ‘Your sins are forgiven,’ or to say, ‘Get up and walk’?”'
translation:
  language: ml
  text: എന്തെന്നാൽ, ‘നിന്റെ പാപങ്ങൾ ക്ഷമിക്കപ്പെട്ടിരിക്കുന്നു’[a] എന്നു പറയുന്നതോ, ‘എഴുന്നേറ്റു നടക്കുക’ എന്നു പറയുന്നതോ—ഏതാണ് എളുപ്പം?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്റെ പാപങ്ങൾ ക്ഷമിക്കപ്പെടുന്നു.” ഗ്രീക്കിലെ വർത്തമാനകാല കർമണിരൂപം ഫലാവസ്ഥയെ സൂചിപ്പിക്കുന്നതായും മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γάρ ἐστιν εὐκοπώτερον
  choice: എന്തെന്നാൽ ... ഏതാണ് എളുപ്പം?
  rationale: τίയും താരതമ്യരൂപമായ εὐκοπώτερονഉം രണ്ട് സാധ്യതകളിൽ ഏതാണ് എളുപ്പമെന്ന ചോദ്യം ഉന്നയിക്കുന്നു. γάρ മുൻവാക്യത്തോടുള്ള വിശദീകരണബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്തെന്നാൽ’ എന്നു നിലനിർത്തി.
- source_word: εἰπεῖν
  choice: എന്നു പറയുന്നതോ
  rationale: രണ്ട് ഉപവാക്യങ്ങളിലും സാധാരണ സംസാരപ്രവൃത്തിയാണ് ഉദ്ദേശിക്കുന്നത്; സമാന്തരഘടനയും വ്യക്തതയും നിലനിർത്തുന്നു.
- source_word: Ἀφίενταί σου αἱ ἁμαρτίαι
  choice: നിന്റെ പാപങ്ങൾ ക്ഷമിക്കപ്പെടുന്നു
  rationale: വർത്തമാനകാല കർമണിപ്രയോഗത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; ഇത് പുരോഗമിക്കുന്ന പ്രവൃത്തിയായോ പൂർത്തിയായ ഫലാവസ്ഥയായോ നിർബന്ധിച്ച് വ്യാഖ്യാനിക്കാതെ ഗ്രീക്കിലെ കാലസംബന്ധിയായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
- source_word: ἁμαρτίαι
  choice: പാപങ്ങൾ
  rationale: സന്ദർഭത്തിന് യോജിച്ച സാധാരണവും വ്യക്തവുമായ തുല്യപദം.
- source_word: Ἔγειρε
  choice: എഴുന്നേറ്റു
  rationale: സൗഖ്യദാനസന്ദർഭത്തിലെ ആജ്ഞയായി സ്വാഭാവികമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: καὶ περιπάτει
  choice: നടക്കുക
  rationale: എഴുന്നേറ്റതിനുശേഷം നടക്കാനുള്ള ആജ്ഞയെ സ്വാഭാവികമായി അറിയിക്കുന്നു; καί മലയാളത്തിലെ സംയുക്ത ആജ്ഞാരൂപത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: σου
  choice: നിന്റെ
  rationale: രണ്ടാംപുരുഷ ഏകവചന ഉടമസ്ഥരൂപം നേരിട്ട് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ പാപക്ഷമാപ്രഖ്യാപനത്തിലെ കാലസൂചന
  choice: നിന്റെ പാപങ്ങൾ ക്ഷമിക്കപ്പെടുന്നു
  alternative: നിന്റെ പാപങ്ങൾ ക്ഷമിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: ഗ്രീക്ക് വർത്തമാനകാല കർമണിരൂപം ഫലാവസ്ഥയായി മനസ്സിലാക്കാനാകുമെങ്കിലും അത് മാത്രം നിർബന്ധിക്കുന്നില്ല. പ്രധാനപാഠത്തിൽ നേരിട്ടുള്ള വർത്തമാന കർമണിപ്രയോഗം സ്വീകരിച്ച് സമയത്തെക്കുറിച്ചുള്ള ദൈവശാസ്ത്രപരമായ നിഗമനം അടിച്ചേൽപ്പിക്കാതെ, മറ്റുസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ചോദ്യഘടന ഉപയോഗിച്ചു. ഉദ്ധരിച്ചിരിക്കുന്ന രണ്ട് വാക്കുകളും തമ്മിലുള്ള സമാന്തരത നിലനിർത്തി; സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പദങ്ങൾ തിരഞ്ഞെടുത്തു.
