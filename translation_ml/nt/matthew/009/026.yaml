translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘വാർത്ത പരന്നു’ എന്ന സ്വാഭാവിക പ്രയോഗം സ്വീകരിച്ചുകൊണ്ട് മൂലത്തിലെ വ്യാപനത്തിന്റെ ആശയം നിലനിർത്തി; γῆയുടെ യഥാർഥ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
