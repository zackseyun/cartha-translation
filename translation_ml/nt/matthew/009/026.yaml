  edition: SBLGNT
  text: καὶ ἐξῆλθεν ἡ φήμη αὕτη εἰς ὅλην τὴν γῆν ἐκείνην.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/026.yaml
  text: And this report went out into all that region[a].
translation:
  language: ml
  text: ഈ വാർത്ത ആ പ്രദേശമൊട്ടാകെ പരന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ആ ദേശമൊട്ടാകെ’ അല്ലെങ്കിൽ ‘ആ ജില്ലയിലാകെ.’ ഗ്രീക്കിലെ γῆ എന്ന പദത്തിന് ഭൂമി, ദേശം, പ്രദേശം എന്നീ അർഥങ്ങൾ വരാം; ഇവിടെ ഭൂമി മുഴുവനെയല്ല, ചുറ്റുമുള്ള പ്രദേശത്തെയാണ് ഉദ്ദേശിക്കുന്നതെന്നു തോന്നുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: ഈ വാക്യത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയില്ല
  rationale: മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനപ്രവാഹത്തിൽ വാക്യാരംഭത്തിലെ καί നിർബന്ധമായി ‘പിന്നെ/അങ്ങനെ’ എന്നു ചേർക്കേണ്ടതില്ല; അങ്ങനെ ചേർത്താൽ മൂലത്തിൽ ഇല്ലാത്ത കാലക്രമമോ ഫലബന്ധമോ സൂചിപ്പിക്കാം.
- source_word: ἐξῆλθεν
  choice: പരന്നു
  rationale: അക്ഷരാർഥത്തിൽ ‘പുറപ്പെട്ടു/പുറത്തേക്കു പോയി’ എന്നാണെങ്കിലും, വാർത്തയെക്കുറിച്ച് മലയാളത്തിൽ ‘പരന്നു’ എന്നതാണ് സ്വാഭാവികവും അർഥവിശ്വസ്തവുമായ പ്രയോഗം.
- source_word: ἡ φήμη αὕτη
  choice: ഈ വാർത്ത
  rationale: φήμη ഇവിടെ സംഭവത്തെക്കുറിച്ച് പ്രചരിച്ച വിവരം എന്നർഥത്തിലാണ്. ‘കിംവദന്തി’ വിശ്വാസ്യതയില്ലായ്മ സൂചിപ്പിക്കാം; ‘വാർത്ത’ നിഷ്പക്ഷവും സന്ദർഭോചിതവുമാണ്. αὕτη ‘ഈ’ എന്നു നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: εἰς ὅλην τὴν γῆν ἐκείνην
  choice: ആ പ്രദേശമൊട്ടാകെ
  rationale: γῆയ്ക്ക് ഭൂമി, ദേശം, പ്രദേശം എന്നീ അർഥങ്ങൾ വരാം. ഇവിടെ പ്രാദേശികമായ ആഖ്യാനസന്ദർഭം കണക്കിലെടുത്ത് ‘പ്രദേശം’ തെരഞ്ഞെടുത്തു; ὅλην എന്ന സമഗ്രത ‘മൊട്ടാകെ’ പ്രകടമാക്കുന്നു.
