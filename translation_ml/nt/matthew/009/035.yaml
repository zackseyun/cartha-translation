revisions:
- from: യേശു എല്ലാ പട്ടണങ്ങളിലും ഗ്രാമങ്ങളിലും ചുറ്റിസഞ്ചരിച്ച്, അവരുടെ സിനഗോഗുകളിൽ പഠിപ്പിക്കുകയും രാജ്യത്തിന്റെ സുവാർത്ത[a] പ്രസംഗിക്കുകയും എല്ലാ രോഗവും എല്ലാ ബലഹീനതയും[b] സൗഖ്യമാക്കുകയും ചെയ്തു.
  to: യേശു എല്ലാ പട്ടണങ്ങളിലൂടെയും ഗ്രാമങ്ങളിലൂടെയും ചുറ്റിസഞ്ചരിച്ചുകൊണ്ട്, അവിടത്തെ സിനഗോഗുകളിൽ പഠിപ്പിക്കുകയും രാജ്യത്തിന്റെ സുവാർത്ത[a] പ്രസംഗിക്കുകയും എല്ലാ രോഗവും എല്ലാ അസുഖവും[b] സൗഖ്യമാക്കുകയും ചെയ്തു.
  rationale: The revision retains the verse’s coordinated actions and repeated “every,” while making the ongoing travel sense more explicit. It uses “അസുഖം” as the primary medical-context equivalent for μαλακία and retains “ബലഹീനത” in a footnote as a legitimate lexical alternative. No disputed textual or theological interpretation has been introduced.
