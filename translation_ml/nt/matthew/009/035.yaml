id: MAT.9.35
reference: Matthew 9:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ περιῆγεν ὁ Ἰησοῦς τὰς πόλεις πάσας καὶ τὰς κώμας, διδάσκων ἐν ταῖς συναγωγαῖς αὐτῶν καὶ κηρύσσων τὸ εὐαγγέλιον τῆς βασιλείας καὶ θεραπεύων πᾶσαν νόσον καὶ πᾶσαν ⸀μαλακίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/035.yaml
  text: And Jesus went throughout all the cities and villages[b][a], teaching in their synagogues and proclaiming the good news of the kingdom and healing every disease and every sickness.
translation:
  language: ml
  text: യേശു എല്ലാ പട്ടണങ്ങളിലൂടെയും ഗ്രാമങ്ങളിലൂടെയും ചുറ്റിസഞ്ചരിച്ചുകൊണ്ട്, അവിടത്തെ സിനഗോഗുകളിൽ പഠിപ്പിക്കുകയും രാജ്യത്തിന്റെ സുവാർത്ത[a] പ്രസംഗിക്കുകയും എല്ലാ രോഗവും എല്ലാ അസുഖവും[b] സൗഖ്യമാക്കുകയും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “രാജ്യത്തിന്റെ സുവിശേഷം.”
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, “എല്ലാ രോഗവും എല്ലാ ബലഹീനതയും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περιῆγεν
  choice: ചുറ്റിസഞ്ചരിച്ച്
  rationale: അപൂർണഭൂതകാല ക്രിയ സൂചിപ്പിക്കുന്ന തുടർച്ചയായ സഞ്ചാരപ്രവർത്തനം സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: πόλεις πάσας καὶ τὰς κώμας
  choice: എല്ലാ പട്ടണങ്ങളിലും ഗ്രാമങ്ങളിലും
  rationale: വലിയ ജനവാസകേന്ദ്രങ്ങളും ചെറിയ ഗ്രാമങ്ങളും തമ്മിലുള്ള ഗ്രീക്ക് പദവ്യത്യാസം നിലനിർത്തുന്നു; πάσας എന്നതിന്റെ സമഗ്രതയും പ്രകടമാക്കുന്നു.
- source_word: διδάσκων
  choice: പഠിപ്പിക്കുകയും
  rationale: യേശുവിന്റെ സഞ്ചാരത്തോടൊപ്പം നടന്നുകൊണ്ടിരുന്ന പ്രവർത്തനമായി കൃദന്തരൂപത്തിന്റെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: συναγωγαῖς αὐτῶν
  choice: അവരുടെ സിനഗോഗുകളിൽ
  rationale: ചരിത്രപരമായ യഹൂദ ആരാധനാസ്ഥാപനത്തെ സൂചിപ്പിക്കുന്ന പദം പൊതുവായ ‘പള്ളി’ എന്നാക്കി അവ്യക്തമാക്കാതെ, αὐτῶν എന്ന സർവനാമവും നിലനിർത്തുന്നു.
- source_word: κηρύσσων
  choice: പ്രസംഗിക്കുകയും
  rationale: പരസ്യമായി പ്രഖ്യാപിക്കുക എന്ന κηρύσσωയുടെ ആശയം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: τὸ εὐαγγέλιον τῆς βασιλείας
  choice: രാജ്യത്തിന്റെ സുവാർത്ത
  rationale: εὐαγγέλιον എന്നതിന്റെ അടിസ്ഥാന അർഥം സുതാര്യമായി നൽകുകയും ‘രാജ്യത്തിന്റെ’ എന്ന ജനിറ്റീവ് ബന്ധം വ്യാഖ്യാനിച്ച് ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: θεραπεύων
  choice: സൗഖ്യമാക്കുകയും
  rationale: സുവിശേഷങ്ങളിലെ രോഗശാന്തിസന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവികവും ആദരണീയവുമായ പ്രയോഗം.
- source_word: πᾶσαν νόσον
  choice: എല്ലാ രോഗവും
  rationale: πᾶσαν എന്ന പദത്തിന്റെ സമഗ്രവ്യാപ്തിയും νόσος എന്നതിന്റെ രോഗസംബന്ധമായ അർഥവും നിലനിർത്തുന്നു.
- source_word: πᾶσαν μαλακίαν
  choice: എല്ലാ ബലഹീനതയും
  rationale: μαλακίαയുടെ ‘ബലഹീനത/ദൗർബല്യം/അസുഖം’ എന്ന അർഥപരിധിയിൽ നിന്ന് νόσος എന്ന പദത്തോടുള്ള വ്യത്യാസം കഴിയുന്നത്ര നിലനിർത്തുന്നു.
theological_decisions:
- issue: εὐαγγέλιον എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: സുവാർത്ത
  alternative: സുവിശേഷം
  rationale: പരമ്പരാഗത സാങ്കേതികപദം നിർബന്ധമാക്കാതെ ‘നല്ല വാർത്ത’ എന്ന മൂലാർഥം ആധുനിക വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; അടിക്കുറിപ്പിൽ പരമ്പരാഗത പരിഭാഷയും സൂക്ഷിക്കുന്നു.
- issue: πᾶσαν νόσον καὶ πᾶσαν μαλακίαν എന്നതിലെ രോഗശാന്തിയുടെ വ്യാപ്തി
  choice: എല്ലാ രോഗവും എല്ലാ ബലഹീനതയും
  alternative: എല്ലാ രോഗവും എല്ലാ അസുഖവും
  rationale: ആവർത്തിക്കുന്ന πᾶσαν രണ്ടിടത്തും ‘എല്ലാ’ എന്നു നൽകി പ്രസ്താവനയുടെ സമഗ്രത നിലനിർത്തുന്നു; νόσος, μαλακία എന്നീ പദങ്ങളിലെ അർഥവ്യത്യാസവും മായ്ച്ചുകളയുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ആദരണീയവുമായ ശൈലി. ‘സിനഗോഗ്’ എന്ന ചരിത്രപരമായ പദം മതസ്ഥാപനത്തെ തെറ്റായി തിരിച്ചറിയാതിരിക്കാൻ നിലനിർത്തി. വാക്യത്തിലെ സമാന്തര പ്രവർത്തനങ്ങൾ ‘പഠിപ്പിക്കുകയും … പ്രസംഗിക്കുകയും … സൗഖ്യമാക്കുകയും’ എന്ന ഘടനയിൽ അവതരിപ്പിച്ചു.
