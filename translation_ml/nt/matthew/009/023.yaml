source:
  edition: SBLGNT
  text: καὶ ἐλθὼν ὁ Ἰησοῦς εἰς τὴν οἰκίαν τοῦ ἄρχοντος καὶ ἰδὼν τοὺς αὐλητὰς καὶ τὸν ὄχλον θορυβούμενον
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/023.yaml
  text: And when Jesus came into the ruler's house and saw the flute players and the crowd making a commotion[c][b][a],
translation:
  language: ml
  text: യേശു നേതാവിന്റെ[a] വീട്ടിൽ വന്ന് കുഴലൂതുന്നവരെയും[b] ബഹളം വെച്ചുകൊണ്ടിരുന്ന[c] ജനക്കൂട്ടത്തെയും കണ്ടപ്പോൾ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അധികാരി’ എന്നും പരിഭാഷപ്പെടുത്താം; സമാന്തരവിവരണങ്ങളുമായി താരതമ്യം ചെയ്യുമ്പോൾ ‘സിനഗോഗ് നേതാവ്’ എന്നും മനസ്സിലാക്കാം. എന്നാൽ മത്തായി ഇവിടെ പൊതുവായ ഒരു നേതാവിനെ മാത്രമാണ് പറയുന്നത്.
    reason: alternative_reading
  - marker: b
    text: ശവസംസ്കാരവേളകളിലെ പതിവനുസരിച്ച് കുഴലൂതുന്നവർ ഉൾപ്പെടെയുള്ള തൊഴിൽപരമായ വിലാപക്കാർ ഇതിനകം അവിടെ എത്തിയിരുന്നു.
    reason: cultural_note
  - marker: c
    text: അഥവാ, ‘കോലാഹലത്തിലായിരുന്ന’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: എത്തി … കണ്ടപ്പോൾ
  rationale: കാലക്രമം സൂചിപ്പിക്കുന്ന ഭൂതകാല കൃദന്തരൂപത്തെ സ്വാഭാവികമായ മലയാള ഉപവാക്യമായി അവതരിപ്പിക്കുന്നു; യേശു വീട്ടിലെത്തിയതിനു പിന്നാലെ കണ്ടത് എന്ന ബന്ധം നിലനിർത്തുന്നു.
- source_word: οἰκίαν
  choice: വീട്ടിൽ
  rationale: കഥാസന്ദർഭത്തിൽ οἰκίαയുടെ നേരിട്ടും സ്വാഭാവികവുമായ അർഥം.
- source_word: ἄρχοντος
  choice: അധികാരിയുടെ
  rationale: മത്തായി ഉപയോഗിക്കുന്ന പൊതുവായ പദവിനാമം നിലനിർത്തുന്നു; സമാന്തരവിവരണങ്ങളിൽ നിന്നുള്ള ‘സിനഗോഗ് നേതാവ്’ എന്ന കൂടുതൽ പ്രത്യേകമായ തിരിച്ചറിയൽ മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: ἰδὼν
  choice: കണ്ടപ്പോൾ
  rationale: ἐλθὼν എന്നതിനോടുള്ള വാക്യബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്ന ലളിതമായ ആഖ്യാനരൂപം.
- source_word: αὐλητὰς
  choice: കുഴലൂതുന്നവരെ
  rationale: കുഴൽ/പൈപ്പ് വായിക്കുന്നവരെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ആധുനിക വായനക്കാർക്ക് വ്യക്തമായ പ്രയോഗം.
- source_word: ὄχλον
  choice: ജനക്കൂട്ടത്തെ
  rationale: ആഖ്യാനസന്ദർഭത്തിൽ ὄχλος എന്നതിന്റെ സാധാരണവും വ്യക്തവുമായ മലയാള പരിഭാഷ.
- source_word: θορυβούμενον
  choice: ബഹളം വെച്ചുകൊണ്ടിരുന്ന
  rationale: തുടർന്നുകൊണ്ടിരുന്ന ശബ്ദകോലാഹലം സൂചിപ്പിക്കുന്നു; ദുഃഖത്തിന്റെ വികാരം മൂലപാഠത്തേക്കാൾ അധികമായി നിർവചിക്കുന്നില്ല.
theological_decisions:
- issue: വീട്ടുടമയുടെ പദവി/തിരിച്ചറിയൽ
  choice: അധികാരി
  alternative: ഉദ്യോഗസ്ഥൻ; സമാന്തരവിവരണങ്ങളുടെ അടിസ്ഥാനത്തിൽ ‘സിനഗോഗ് നേതാവ്’
  rationale: ഗ്രീക്ക് പാഠത്തിലെ ἄρχων ഇവിടെ പൊതുവായി ‘അധികാരി/നേതാവ്’ എന്നേ പറയുന്നുള്ളൂ. സമാന്തരവിവരണത്തിൽ നിന്നുള്ള കൂടുതൽ പ്രത്യേകമായ തിരിച്ചറിയൽ മുഖ്യവാചകത്തിലേക്ക് കൊണ്ടുവരാതെ മൂലപാഠത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനത്തിൽ അർധവിരാമസ്വഭാവമുള്ള കോമ നിലനിർത്തിയിരിക്കുന്നു. അടിക്കുറിപ്പുകൾ ബന്ധപ്പെട്ട പദങ്ങൾക്ക് തൊട്ടുപിന്നാലെ ക്രമമായി ചേർത്തിരിക്കുന്നു.
