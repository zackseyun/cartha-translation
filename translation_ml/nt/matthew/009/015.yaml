  terminology: ‘മണവാളൻ,’ ‘ദുഃഖിക്കുക,’ and ‘ഉപവസിക്കുക’ are appropriate, dignified, and natural biblical-register Malayalam terms. The footnotes retain both the literal idiom and the passive-force nuance without making a doctrinal inference.
