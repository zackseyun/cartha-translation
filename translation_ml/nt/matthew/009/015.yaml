id: MAT.9.15
reference: Matthew 9:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μὴ δύνανται οἱ υἱοὶ τοῦ νυμφῶνος πενθεῖν ἐφ’ ὅσον μετ’ αὐτῶν ἐστιν ὁ νυμφίος; ἐλεύσονται δὲ ἡμέραι ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος, καὶ τότε νηστεύσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/015.yaml
  text: And Jesus said to them[a], “The wedding attendants cannot mourn as long as the bridegroom is with them, can they? But days will come when the bridegroom is taken away from them[b], and then they will fast.”
translation:
  language: ml
  text: 'യേശു അവരോടു പറഞ്ഞു: “മണവാളൻ അവരോടുകൂടെ ഉള്ളിടത്തോളം വിവാഹാഘോഷത്തിലെ കൂട്ടുകാർക്ക്[a] ദുഃഖിക്കാൻ കഴിയുമോ? എന്നാൽ മണവാളൻ അവരിൽനിന്ന് എടുത്തുമാറ്റപ്പെടുന്ന ദിവസങ്ങൾ വരും[b]; അപ്പോൾ അവർ ഉപവസിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘വിവാഹമുറിയുടെ പുത്രന്മാർ’; മണവാളന്റെ കൂട്ടുകാരെയോ വിവാഹാഘോഷത്തിൽ പങ്കെടുക്കുന്നവരെയോ സൂചിപ്പിക്കുന്ന ഒരു പ്രയോഗം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘മണവാളൻ അവരിൽനിന്ന് നീക്കപ്പെടുന്ന.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന കർമണിപ്രയോഗം സാധാരണ വേർപാടിനെക്കാൾ ശക്തമായ ഒരു നീക്കത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱοὶ τοῦ νυμφῶνος
  choice: വിവാഹസഹചാരികൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘വിവാഹമുറിയുടെ പുത്രന്മാർ’ എന്ന സെമിറ്റിക് ശൈലിയാണിത്. വിവാഹാഘോഷത്തിൽ മണവാളനോടൊപ്പം നിൽക്കുന്ന കൂട്ടുകാരെയോ പരിചാരകരെയോ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: πενθεῖν
  choice: ദുഃഖിക്കുക
  rationale: വിലപിക്കുകയോ ദുഃഖാചരണം നടത്തുകയോ ചെയ്യുന്ന ആശയം നൽകുന്നു; ഉപവാസത്തോടുള്ള സന്ദർഭപരമായ ബന്ധവും നിലനിർത്തുന്നു.
- source_word: ἐφ’ ὅσον
  choice: ഉള്ളിടത്തോളം
  rationale: കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: νυμφίος
  choice: മണവാളൻ
  rationale: വിവാഹരൂപകത്തിന്റെ ഗൗരവവും ആവർത്തനവും നിലനിർത്തുന്ന സാധാരണ മലയാളപദം.
- source_word: ἀπαρθῇ
  choice: എടുത്തുമാറ്റപ്പെടുന്ന
  rationale: വെറും യാത്രപോകലിനേക്കാൾ ശക്തമായ, മറ്റൊരാളാൽ നീക്കം ചെയ്യപ്പെടുന്നുവെന്ന കർമണിപ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: νηστεύσουσιν
  choice: അവർ ഉപവസിക്കും
  rationale: ഭാവികാലത്തിലെ ഉപവാസത്തെ നേരിട്ടും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
- source_word: Μὴ δύνανται ... ;
  choice: '... ദുഃഖിക്കാനാകുമോ?'
  rationale: നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്ന ഗ്രീക്ക് അലങ്കാരചോദ്യത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം; സന്ദർഭത്തിൽ ‘അാകില്ല’ എന്ന പ്രതീക്ഷ വ്യക്തമാണ്.
- source_word: ἐλεύσονται δὲ ἡμέραι
  choice: എന്നാൽ ... ദിവസങ്ങൾ വരും
  rationale: δέയുടെ മൃദുവായ വൈരുധ്യവും വരാനിരിക്കുന്ന കാലഘട്ടത്തെക്കുറിച്ചുള്ള സ്വാഭാവിക പ്രയോഗവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: മണവാളൻ എന്ന രൂപകത്തിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ പ്രാധാന്യം
  choice: ‘മണവാളൻ’ എന്ന രൂപകം വിശദീകരണപരമായി വികസിപ്പിക്കാതെ അതേപടി നിലനിർത്തി.
  alternative: യേശുവിനെ മിശിഹായായ മണവാളനെന്ന് പരിഭാഷയിൽത്തന്നെ വ്യക്തമായി തിരിച്ചറിയിക്കുക.
  rationale: വാക്യം ആ തിരിച്ചറിയൽ വിശദമായി പ്രസ്താവിക്കുന്നില്ല; അതിനാൽ വായനക്കാർക്ക് സൂചന ഗ്രഹിക്കാൻ ഇടനൽകിക്കൊണ്ട് പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
- issue: മണവാളൻ എടുത്തുമാറ്റപ്പെടുന്നതിലെ കർമണിപ്രയോഗം
  choice: ‘എടുത്തുമാറ്റപ്പെടുന്ന’ എന്ന് കർമണിയും ശക്തമായ നീക്കത്തിന്റെ സൂചനയും നിലനിർത്തി.
  alternative: ‘പോകുന്ന’ അല്ലെങ്കിൽ ‘വിട്ടുപിരിയുന്ന’ എന്ന് സാധാരണ യാത്രയായി അവതരിപ്പിക്കുക.
  rationale: ഗ്രീക്ക് ἀπαρθῇ സാധാരണ പുറപ്പെടലിനേക്കാൾ നിർബന്ധിതമായ നീക്കം സൂചിപ്പിക്കാം; യേശുവിന്റെ മരണത്തിലേക്കുള്ള സാധ്യതയുള്ള സൂചന വ്യക്തമാക്കിപ്പറയാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘വിവാഹസഹചാരികൾ’ അപരിചിതമായ അക്ഷരാർഥപ്രയോഗം ഒഴിവാക്കി സാമൂഹികപങ്ക് വ്യക്തമാക്കുന്നു; അടിക്കുറിപ്പ് മൂലഭാഷയിലെ രൂപം സംരക്ഷിക്കുന്നു. വാക്യത്തിലെ അലങ്കാരചോദ്യവും മണവാളൻ-ഉപവാസം വൈരുധ്യവും നിലനിർത്തിയിട്ടുണ്ട്.
