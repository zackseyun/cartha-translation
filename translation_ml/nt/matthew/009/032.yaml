  yaml_path: translation/nt/matthew/009/032.yaml
  text: As they were going out[a], behold, they brought to him a mute[c][b], demon-possessed man.
translation:
  language: ml
  text: അവർ പുറത്തേക്കു പോകുമ്പോൾ, ഇതാ, അവർ സംസാരിക്കാൻ കഴിയാത്ത[a], ഭൂതബാധിതനായ[b] ഒരു മനുഷ്യനെ അവന്റെ അടുക്കൽ കൊണ്ടുവന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കേൾക്കാൻ കഴിയാത്തവൻ.” ഗ്രീക്ക് പദത്തിന് സന്ദർഭമനുസരിച്ച് സംസാരിക്കാൻ കഴിയാത്തവൻ എന്നോ കേൾക്കാൻ കഴിയാത്തവൻ എന്നോ അർഥമാകാം. അടുത്ത വാക്യത്തിൽ അയാൾ സംസാരിച്ചതായി പറയുന്നതിനാൽ ഇവിടെ “സംസാരിക്കാൻ കഴിയാത്തവൻ” എന്നു പരിഭാഷപ്പെടുത്തി.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “ഭൂതത്തിന്റെ അധീനതയിലായവൻ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτῶν δὲ ἐξερχομένων
  choice: അവർ പുറത്തേക്കു പോകുമ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് ഘടനയുടെ സമയബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; δέ ഇവിടെ പുതിയ രംഗത്തിലേക്കുള്ള മാറ്റം സൂചിപ്പിക്കുന്നതിനാൽ പ്രത്യേകമായി പരിഭാഷപ്പെടുത്തേണ്ടതില്ല.
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: സംഭവത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്നതും വിവരണത്തിന് സജീവത നൽകുന്നതുമായ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: προσήνεγκαν αὐτῷ
  choice: ആളുകൾ അവന്റെ അടുക്കൽ കൊണ്ടുവന്നു
  rationale: അവ്യക്തമായ ബഹുവചന കർത്താവിനെ സ്വാഭാവിക മലയാളത്തിനായി ‘ആളുകൾ’ എന്നു വ്യക്തമാക്കുകയും αὐτῷ എന്ന പരാമർശം ‘അവന്റെ അടുക്കൽ’ എന്നു നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἄνθρωπον
  choice: ഒരു മനുഷ്യനെ
  rationale: ഇവിടെ ഒരു വ്യക്തിയെ സൂചിപ്പിക്കുന്ന പൊതുവായതും മാന്യവുമായ മലയാള പ്രയോഗമാണിത്.
- source_word: κωφὸν
  choice: സംസാരിക്കാൻ കഴിയാത്തവനുമായ
  rationale: അടുത്ത വാക്യത്തിൽ അയാൾ സംസാരിച്ചതാണ് പ്രത്യേകം പറയുന്നത്; അതിനാൽ ഈ സന്ദർഭത്തിൽ മൗനതയാണ് ഏറ്റവും സാധ്യതയുള്ള അർഥം. എന്നാൽ ഗ്രീക്ക് പദത്തിന് ‘കേൾക്കാൻ കഴിയാത്ത’ എന്ന അർഥവും വരാമെന്നത് അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: δαιμονιζόμενον
  choice: ഭൂതബാധിതനും
  rationale: സുവിശേഷങ്ങളിലെ പൈശാചിക ബാധയെ സൂചിപ്പിക്കുന്ന പ്രയോഗത്തിന് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളം; ബാധയുടെ കൃത്യമായ സ്വഭാവത്തെക്കുറിച്ച് വാക്യം പറയുന്നതിലധികം വിശദീകരിക്കുന്നില്ല.
theological_decisions:
- issue: പൈശാചിക ബാധയെ സൂചിപ്പിക്കുന്ന ഭാഷ
  choice: ഭൂതബാധിതൻ
  alternative: ഭൂതത്തിന്റെ അധീനതയിലായവൻ
  rationale: വാക്യം പൈശാചിക ബാധയെ യാഥാർഥ്യമായ അവസ്ഥയായി അവതരിപ്പിക്കുന്നു. ‘ഭൂതബാധിതൻ’ എന്നത് അതു വ്യക്തമായി അറിയിക്കുമ്പോഴും ബാധയുടെയോ അധീനതയുടെയോ കൃത്യമായ രീതി സംബന്ധിച്ച അധിക സിദ്ധാന്തം ചേർക്കുന്നില്ല.
- issue: സംസാരശേഷിയില്ലായ്മയും ഭൂതബാധയും തമ്മിലുള്ള ബന്ധം
  choice: രണ്ടിനെയും സമാന്തര വിശേഷണങ്ങളായി അവതരിപ്പിച്ചു
  alternative: ഭൂതബാധ നിമിത്തം സംസാരിക്കാൻ കഴിയാത്തവൻ
  rationale: ഗ്രീക്കിൽ κωφὸν, δαιμονιζόμενον എന്നിവ ἄνθρωπον എന്ന പദത്തെ വിശേഷിപ്പിക്കുന്നു; ഭൂതബാധ തന്നെയാണ് സംസാരശേഷിയില്ലായ്മയുടെ കാരണം എന്നു ഈ വാക്യത്തിന്റെ വ്യാകരണം തുറന്നുപറയുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളമാണ് ഉപയോഗിച്ചത്. ‘ഊമൻ’ എന്ന ചുരുക്കപ്പദത്തിനു പകരം ‘സംസാരിക്കാൻ കഴിയാത്തവൻ’ എന്നു നൽകി; ‘ഇതാ’ എന്ന ശ്രദ്ധാകർഷക പ്രയോഗം മൂലപാഠത്തിന്റെ ആഖ്യാനസജീവത നിലനിർത്തുന്നു.
