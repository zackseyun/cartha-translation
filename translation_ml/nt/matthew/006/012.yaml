id: MAT.6.12
reference: Matthew 6:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἄφες ἡμῖν τὰ ὀφειλήματα ἡμῶν, ὡς καὶ ἡμεῖς ⸀ἀφήκαμεν τοῖς ὀφειλέταις ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/012.yaml
  text: And forgive us our debts[b][a], as we also have forgiven our debtors.
translation:
  language: ml
  text: ഞങ്ങളുടെ കടങ്ങൾ[a] ഞങ്ങൾക്കു ക്ഷമിച്ചുതരണമേ; ഞങ്ങളോടു കടപ്പെട്ടവരോടു ഞങ്ങളും ക്ഷമിച്ചിരിക്കുന്നതുപോലെ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അതിക്രമങ്ങൾ’ അല്ലെങ്കിൽ ‘പാപങ്ങൾ.’ അക്ഷരാർഥത്തിൽ ‘കടങ്ങൾ’; ഇവിടെ ഗ്രീക്ക് ദൈവത്തോടുള്ള പാപങ്ങളെയോ കുറ്റങ്ങളെയോ കൊടുക്കാനുള്ള കടമായി ചിത്രീകരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘ക്ഷമിച്ചതുപോലെ.’ ഗ്രീക്കിലെ aorist ക്രിയയെ ലളിത ഭൂതകാലമായി വിവർത്തനം ചെയ്യാം; ‘ക്ഷമിച്ചിരിക്കുന്നതുപോലെ’ എന്നത് പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ പ്രസക്തി സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφες
  choice: ക്ഷമിച്ചുതരണമേ
  rationale: പ്രാർഥനാസന്ദർഭത്തിലെ aorist imperative ആയതിനാൽ, ‘വിട്ടുകളയുക’ എന്ന അക്ഷരാർഥത്തേക്കാൾ പാപമോചനത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്ന ആദരപൂർവമായ അപേക്ഷാരൂപം യോജിക്കുന്നു.
- source_word: τὰ ὀφειλήματα
  choice: കടങ്ങൾ
  rationale: ‘കൊടുക്കാനുള്ളത്’ എന്ന മൂലാർഥവും വാക്യത്തിലെ കടത്തിന്റെ രൂപകവും നിലനിർത്തുന്നു; ‘പാപങ്ങൾ’ എന്നു വ്യാഖ്യാനിച്ച് രൂപകം ഇല്ലാതാക്കുന്നില്ല.
- source_word: ὡς
  choice: …തുപോലെ
  rationale: ദൈവത്തോടു ചോദിക്കുന്ന ക്ഷമയും മറ്റുള്ളവർക്കു നൽകിയ ക്ഷമയും തമ്മിലുള്ള താരതമ്യം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀφήκαμεν
  choice: ക്ഷമിച്ചിരിക്കുന്നു
  rationale: aorist സൂചിപ്പിക്കുന്ന പൂർത്തിയായ പ്രവൃത്തിയെ, ഇപ്പോഴത്തെ പ്രസക്തിയോടുകൂടി മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; ലളിത ഭൂതകാലമായ ‘ക്ഷമിച്ചു’ എന്നും വിവർത്തനം ചെയ്യാം.
- source_word: τοῖς ὀφειλέταις ἡμῶν
  choice: ഞങ്ങളുടെ കടക്കാരോട്
  rationale: ὀφειλήματα എന്നതുമായുള്ള പദബന്ധവും കടത്തിന്റെ രൂപകവും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: καὶ ἡμεῖς
  choice: ഞങ്ങളും
  rationale: രണ്ടാമത്തെ καὶ നൽകുന്ന ഉൾപ്പെടുത്തൽ/ഊന്നൽ വ്യക്തമായി പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ὀφειλήματα എന്ന ധാർമിക രൂപകം
  choice: പ്രധാന പാഠത്തിൽ ‘കടങ്ങൾ’ നിലനിർത്തുക
  alternative: ‘അതിക്രമങ്ങൾ’ അല്ലെങ്കിൽ ‘പാപങ്ങൾ’
  rationale: ഗ്രീക്ക് പാഠം പാപത്തെ കടമായി ചിത്രീകരിക്കുന്നു. ആ രൂപകം നിലനിർത്തുന്നത് മൂലപാഠത്തോടുള്ള സുതാര്യത ഉറപ്പാക്കുകയും ധനകാര്യ കടം മാത്രമാണെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ അടിക്കുറിപ്പ് സഹായിക്കുകയും ചെയ്യുന്നു.
- issue: ἀφήκαμεν എന്ന ക്രിയയുടെ കാലസൂക്ഷ്മത
  choice: ‘ക്ഷമിച്ചിരിക്കുന്നു’
  alternative: ‘ക്ഷമിച്ചു’
  rationale: പ്രവൃത്തി പൂർത്തിയായതും അതിന് ഇപ്പോഴത്തെ പ്രസക്തിയുള്ളതുമായ വായന മലയാളത്തിൽ പ്രകടമാക്കുന്നു; എന്നാൽ ഗ്രീക്ക് aorist ലളിത ഭൂതകാലമായും വിവർത്തനം ചെയ്യാവുന്നതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന ആദരപൂർവമായ പ്രാർഥനാഭാഷ. ‘കടങ്ങൾ/കടക്കാർ’ എന്ന ആവർത്തനം ഗ്രീക്കിലെ cognate ബന്ധം നിലനിർത്തുന്നു; ‘ണമേ’ എന്ന രൂപം അപേക്ഷയുടെ ഗൗരവം സ്വാഭാവികമായി നൽകുന്നു.
