revisions:
- from: അങ്ങനെ, ദരിദ്രർക്കുള്ള നിന്റെ ദാനം രഹസ്യത്തിലായിരിക്കും; രഹസ്യത്തിൽ കാണുന്ന നിന്റെ പിതാവ് നിനക്കു പ്രതിഫലം നൽകും.[a]
  to: നീ ദരിദ്രർക്കു നൽകുന്ന ദാനം രഹസ്യത്തിലായിരിക്കേണ്ടതിന്, രഹസ്യത്തിൽ കാണുന്ന നിന്റെ പിതാവ് നിനക്കു പ്രതിഫലം നൽകും.[a]
  rationale: The revision restores the telic force of ὅπως ᾖ with ‘രഹസ്യത്തിലായിരിക്കേണ്ടതിന്.’ It also uses a more natural explicit Malayalam expression for almsgiving to the poor. The repeated ‘രഹസ്യത്തിൽ,’ the unexpanded title ‘നിന്റെ പിതാവ്,’ and the open-ended positive sense of divine recompense are retained.
