id: MAT.6.4
reference: Matthew 6:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅπως ᾖ σου ἡ ἐλεημοσύνη ἐν τῷ κρυπτῷ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ ⸀κρυπτῷ ἀποδώσει ⸀σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/004.yaml
  text: so that your giving to the poor may be in secret[b][a]; and your Father who sees in secret will reward you.
translation:
  language: ml
  text: നീ ദരിദ്രർക്കു നൽകുന്ന ദാനം രഹസ്യത്തിലായിരിക്കേണ്ടതിന്, രഹസ്യത്തിൽ കാണുന്ന നിന്റെ പിതാവ് നിനക്കു പ്രതിഫലം നൽകും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിനക്കു തിരിച്ചുനൽകും.’
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως ᾖ
  choice: അങ്ങനെ ... ആയിരിക്കും
  rationale: മുൻവാക്യത്തിലെ നിർദേശവുമായി ബന്ധിപ്പിക്കുന്ന ഉദ്ദേശ്യഫലം സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ἐλεημοσύνη
  choice: ദരിദ്രർക്കുള്ള നിന്റെ ദാനം
  rationale: പൊതുവായ കരുണയെയല്ല, ദരിദ്രർക്കു നൽകുന്ന ദാനത്തെയാണ് ഗ്രീക്ക് പദം പ്രത്യേകമായി സൂചിപ്പിക്കുന്നത്.
- source_word: ἐν τῷ κρυπτῷ
  choice: രഹസ്യത്തിൽ
  rationale: പൊതുജനങ്ങളുടെ കാഴ്ചയിൽനിന്ന് മറഞ്ഞിരിക്കുന്നതെന്ന ആശയം നൽകുകയും രണ്ടു ഉപവാക്യങ്ങളിലുമുള്ള ആവർത്തനം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ὁ πατήρ σου
  choice: നിന്റെ പിതാവ്
  rationale: മൂലപാഠത്തിലുള്ള 'നിന്റെ പിതാവ്' എന്ന പ്രയോഗം മാത്രം പരിഭാഷപ്പെടുത്തി; ഇവിടെ ഇല്ലാത്ത 'സ്വർഗീയ' എന്ന വിശേഷണം ചേർത്തിട്ടില്ല.
- source_word: ὁ βλέπων
  choice: കാണുന്ന
  rationale: ഗ്രീക്ക് കർത്തൃവാചക കൃുദന്തത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണ ഉപവാക്യമായി നൽകുന്നു.
- source_word: ἀποδώσει σοι
  choice: നിനക്കു പ്രതിഫലം നൽകും
  rationale: ദൈവത്തിന്റെ അനുകൂല പ്രതികരണം വ്യക്തമാക്കുന്നു; പ്രതിഫലത്തിന്റെ സ്വഭാവമോ സമയമോ നിർവചിക്കുന്നില്ല.
theological_decisions:
- issue: ἀποδώσει സൂചിപ്പിക്കുന്ന ദൈവിക പ്രതിഫലത്തിന്റെ സ്വഭാവം
  choice: നിനക്കു പ്രതിഫലം നൽകും
  alternative: നിനക്കു തിരികെ നൽകും
  rationale: പ്രതിഫലം ഭൗതികമോ ആത്മീയമോ, ഈ കാലത്തേതോ വരാനിരിക്കുന്നതോ എന്ന് വാക്യം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ അനുകൂലമായ ദൈവിക പ്രതികരണം മാത്രം അറിയിച്ച് ആ അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘ദാനം’ എന്നതിനെ ‘ദരിദ്രർക്കുള്ള’ എന്ന് വ്യക്തമാക്കി ἐλεημοσύνηയുടെ പ്രത്യേക അർഥം മുഖ്യപാഠത്തിൽ തന്നെയാക്കി; അതിനാൽ അതിന് വേറൊരു പദപരമായ അടിക്കുറിപ്പ് ആവശ്യമില്ല. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ‘പ്രതിഫലം നൽകും’ എന്ന പ്രയോഗത്തിനു ശേഷം വെച്ചിരിക്കുന്നു.
