review_pass:
  verdict: revise
  source_fidelity: The warning, public-display purpose, and plural ‘heavens’ are substantially retained. However, ‘നിങ്ങളുടെ നീതി ആചരിക്കുക’ is not idiomatic Malayalam for doing/practising righteousness, and ‘ലഭിക്കുകയില്ല’ shifts the Greek present assertion (‘you have no reward’) into a future statement.
  naturalness: The sentence is understandable, but ‘നീതി ആചരിക്കുക’ is awkward in modern standard Malayalam. ‘നീതിപ്രവൃത്തികൾ ചെയ്യുക’ naturally communicates righteous practice in this context.
  terminology: ‘നീതിപ്രവൃത്തികൾ’ preserves the broad practical force of δικαιοσύνη without restricting it to almsgiving. The textual variant for almsgiving remains explicitly footnoted. ‘ആകാശങ്ങളിലുള്ള’ appropriately retains the source plural.
  issues:
  - severity: medium
    issue: ‘നീതി ആചരിക്കുക’ is unnatural and unclear in Malayalam.
    rationale: Malayalam normally speaks of doing righteous deeds/practices rather than ‘observing righteousness’; the current phrase risks sounding like one observes a rule or ritual.
  - severity: low
    issue: ‘പ്രതിഫലം ലഭിക്കുകയില്ല’ renders the consequence as future.
    rationale: 'The Greek οὐκ ἔχετε is present: ‘you have no reward.’ A present Malayalam construction better reflects the source.'
