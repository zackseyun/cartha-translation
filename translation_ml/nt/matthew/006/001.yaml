id: MAT.6.1
reference: Matthew 6:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Προσέχετε ⸀δὲ τὴν ⸀δικαιοσύνην ὑμῶν μὴ ποιεῖν ἔμπροσθεν τῶν ἀνθρώπων πρὸς τὸ θεαθῆναι αὐτοῖς· εἰ δὲ μή γε, μισθὸν οὐκ ἔχετε παρὰ τῷ πατρὶ ὑμῶν τῷ ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/001.yaml
  text: But be careful not to practice your righteousness before people in order to be seen by them[a]; otherwise[b], you have no reward from your Father in the heavens.
translation:
  language: ml
  text: എന്നാൽ, മനുഷ്യർ കാണേണ്ടതിനായി അവരുടെ മുമ്പിൽ നിങ്ങളുടെ നീതിപ്രവൃത്തികൾ ചെയ്യാതിരിക്കാൻ ശ്രദ്ധിക്കുക[a]. അല്ലാത്തപക്ഷം, ആകാശങ്ങളിലുള്ള നിങ്ങളുടെ പിതാവിൽനിന്ന് നിങ്ങൾക്കു പ്രതിഫലമില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിങ്ങളുടെ നീതി’ എന്നും വിവർത്തനം ചെയ്യാം. ഒരു പാഠഭേദത്തിൽ ‘നിങ്ങളുടെ ദാനധർമ്മം’ എന്നാണ്.
    reason: textual_variant
  - marker: b
    text: ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘ആകാശങ്ങളിൽ’ എന്ന ബഹുവചനമാണ്; പല പരിഭാഷകളും ‘സ്വർഗത്തിൽ’ എന്നു നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε
  choice: ജാഗ്രത പാലിക്കുക
  rationale: വർത്തമാനകാല ബഹുവചന ആജ്ഞയുടെ തുടർച്ചയായ കരുതലും മുന്നറിയിപ്പിന്റെ ശക്തിയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുമ്പുള്ള ഉപദേശത്തിൽനിന്നുള്ള മാറ്റവും ഇവിടെ തുടങ്ങുന്ന മുന്നറിയിപ്പിന്റെ വൈരുധ്യഭാവവും സൂചിപ്പിക്കുന്നു.
- source_word: δικαιοσύνην
  choice: നീതി
  rationale: SBLGNT-യിലെ വിശാലമായ പദത്തെ ദാനധർമ്മത്തിലേക്ക് മാത്രം ചുരുക്കാതെ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് നീതിനിഷ്ഠമായ ആചരണത്തെയും ഉൾക്കൊള്ളുന്നു.
- source_word: μὴ ποιεῖν
  choice: ആചരിക്കാതിരിക്കാൻ
  rationale: നീതി വെറും ഒറ്റ പ്രവൃത്തിയായി ‘ചെയ്യുക’ എന്നതിലുപരി ജീവിതാചരണമായി നടപ്പാക്കുന്നതാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: മനുഷ്യരുടെ മുമ്പിൽ
  rationale: പുരുഷന്മാരെ മാത്രം അല്ല, പൊതുവേ മനുഷ്യനിരീക്ഷകരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: πρὸς τὸ θεαθῆναι αὐτοῖς
  choice: മനുഷ്യർ കാണേണ്ടതിനായി
  rationale: ഗ്രീക്കിലെ ഉദ്ദേശ്യാർഥവും മറ്റുള്ളവരാൽ കാണപ്പെടുക എന്ന നിഷ്ക്രിയ ആശയവും വ്യക്തമായി നൽകുന്നു.
- source_word: εἰ δὲ μή γε
  choice: അല്ലെങ്കിൽ
  rationale: നിബന്ധനാപരമായ മുന്നറിയിപ്പിന്റെ ഫലം സ്വാഭാവികമായ മലയാളത്തിൽ സംക്ഷിപ്തമായി അറിയിക്കുന്നു.
- source_word: μισθὸν
  choice: പ്രതിഫലം
  rationale: ഈ സന്ദർഭത്തിലെ ദൈവികമായ പകരംനൽകലിനെ കൂലി എന്ന പരിമിത ധ്വനിയില്ലാതെ വ്യക്തമാക്കുന്നു.
- source_word: παρὰ τῷ πατρὶ ὑμῶν
  choice: നിങ്ങളുടെ പിതാവിൽനിന്ന്
  rationale: παρά എന്നതിലെ സാമീപ്യ/ഉറവിട സാധ്യതകളിൽ, പ്രതിഫലം നൽകുന്ന ഉറവിടം എന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: τῷ ἐν τοῖς οὐρανοῖς
  choice: ആകാശങ്ങളിലുള്ള
  rationale: ഗ്രീക്കിലെ ബഹുവചനരൂപവും മത്തായിയുടെ ശൈലിയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: δικαιοσύνην എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: പ്രധാനപാഠത്തിൽ വിശാലമായ ‘നീതി’
  alternative: ‘നീതിപ്രവൃത്തികൾ’ അല്ലെങ്കിൽ പാഠഭേദപ്രകാരം ‘ദാനധർമ്മം’
  rationale: SBLGNT δικαιοσύνην എന്നാണ് വായിക്കുന്നത്. സമീപസന്ദർഭം ദാനധർമ്മത്തെ ഉൾക്കൊള്ളുന്നുവെങ്കിലും പദത്തെ അതിലേക്കു മാത്രം ചുരുക്കാതെ, വ്യത്യസ്ത സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: ἀνθρώπων എന്നതിന്റെ സൂചന
  choice: മനുഷ്യർ
  alternative: പുരുഷന്മാർ
  rationale: ഇവിടെ എല്ലാ മനുഷ്യനിരീക്ഷകരുമാണ് ഉദ്ദേശിക്കപ്പെടുന്നത്; പുരുഷന്മാർ മാത്രം അല്ല.
- issue: τοῖς οὐρανοῖς എന്നതിന്റെ ബഹുവചനം
  choice: ആകാശങ്ങൾ
  alternative: സ്വർഗം
  rationale: മത്തായിയിലെ ഗ്രീക്ക് ബഹുവചനത്തെ നിലനിർത്തുകയും അതിൽനിന്ന് അധികമായ പ്രപഞ്ചശാസ്ത്ര നിഗമനങ്ങൾ വരുത്താതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. ‘ജാഗ്രത പാലിക്കുക’ മുന്നറിയിപ്പിന്റെ ഭാവം നൽകുന്നു; ‘നീതി ആചരിക്കുക’ എന്ന പ്രയോഗം അമൂർത്തമായ δικαιοσύνηയും അതിന്റെ പ്രായോഗിക നടപ്പാക്കലും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിലെ ‘ആകാശങ്ങൾ’ എന്ന ബഹുവചനം പ്രധാനപാഠത്തിൽ സംരക്ഷിച്ചു.
