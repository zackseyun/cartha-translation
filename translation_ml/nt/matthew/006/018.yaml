id: MAT.6.18
reference: Matthew 6:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅπως μὴ φανῇς τοῖς ἀνθρώποις νηστεύων ἀλλὰ τῷ πατρί σου τῷ ἐν τῷ ⸀κρυφαίῳ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ ⸁κρυφαίῳ ἀποδώσει σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/018.yaml
  text: so that you may not appear to men to be fasting[a], but to your Father who is in secret[b]; and your Father who sees in secret will reward you.
translation:
  language: ml
  text: അങ്ങനെ, നീ ഉപവസിക്കുന്നതായി മനുഷ്യർക്കു കാണപ്പെടാതിരിക്കാനും, രഹസ്യത്തിലുള്ള നിന്റെ പിതാവിനു കാണപ്പെടാനും; രഹസ്യത്തിൽ കാണുന്ന നിന്റെ പിതാവ് നിനക്കു പ്രതിഫലം നൽകും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπως
  choice: അങ്ങനെ
  rationale: മുൻവാക്യത്തിലെ നിർദേശത്തിന്റെ ഉദ്ദേശ്യം/ഫലം അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ വാക്യബന്ധം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: μὴ φανῇς
  choice: കാണപ്പെടാതെ
  rationale: φαίνω എന്ന ക്രിയയുടെ നിഷ്ക്രിയ അർഥവും മറ്റുള്ളവരുടെ മുമ്പിലുള്ള ബാഹ്യപ്രകടനത്തെക്കുറിച്ചുള്ള സന്ദർഭവും സംരക്ഷിക്കുന്നു.
- source_word: τοῖς ἀνθρώποις
  choice: മനുഷ്യർക്കു
  rationale: ഇവിടെ പദം പുരുഷന്മാരെ മാത്രം അല്ല, പൊതുവായി മനുഷ്യനിരീക്ഷകരെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘മനുഷ്യർ’ ഈ പൊതുവായ അർഥം കൃത്യമായി നൽകുന്നു.
- source_word: νηστεύων
  choice: ഉപവസിക്കുന്നതായി
  rationale: കാണപ്പെടുന്ന പ്രവൃത്തി ഉപവാസമാണെന്ന് മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: ἀλλὰ τῷ πατρί σου
  choice: നിന്റെ പിതാവിനു കാണപ്പെടും
  rationale: ഗ്രീക്കിൽ രണ്ടാമത്തെ ക്രിയ സൂചിതമായിരിക്കുന്നതിനാൽ, മലയാളത്തിൽ അർഥവ്യക്തതയ്ക്കായി ‘കാണപ്പെടും’ ആവർത്തിക്കുന്നു; മനുഷ്യരും പിതാവും തമ്മിലുള്ള വൈരുധ്യം നിലനിർത്തുന്നു.
- source_word: τῷ ἐν τῷ κρυφαίῳ
  choice: രഹസ്യത്തിലുള്ള
  rationale: സ്ഥലപരമോ രീതിപരമോ ആയ അർഥം അമിതമായി നിർണയിക്കാതെ പിതാവിന്റെ മറഞ്ഞിരിക്കുന്ന സാന്നിധ്യം സൂചിപ്പിക്കുന്നു.
- source_word: ὁ βλέπων ἐν τῷ κρυφαίῳ
  choice: രഹസ്യത്തിൽ കാണുന്ന
  rationale: മൂലത്തിലെ സംക്ഷിപ്തതയും κρυφαίῳ എന്ന പദത്തിന്റെ ആവർത്തനവും സംരക്ഷിക്കുന്നു; ‘രഹസ്യത്തിൽ ചെയ്യുന്നതെല്ലാം’ എന്ന വിശദീകരണം ചേർക്കുന്നില്ല.
- source_word: ἀποδώσει σοι
  choice: നിനക്കു പ്രതിഫലം നൽകും
  rationale: ഭക്തിപ്രവൃത്തിക്കുള്ള ദൈവിക പ്രതികരണത്തിന്റെ സന്ദർഭത്തിൽ ἀποδίδωμι സൂചിപ്പിക്കുന്ന പ്രതിഫലാർഥം വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: ἀνθρώποις എന്നതിന്റെ പൊതുവായ മനുഷ്യസൂചന
  choice: ‘മനുഷ്യർക്കു’ എന്ന് വിവർത്തനം ചെയ്തു.
  alternative: ‘പുരുഷന്മാർക്ക്’ അല്ലെങ്കിൽ ‘മറ്റുള്ളവർക്ക്’
  rationale: സന്ദർഭത്തിൽ ലിംഗഭേദമില്ലാതെ മനുഷ്യനിരീക്ഷകരെയാണ് ഉദ്ദേശിക്കുന്നത്; മലയാളത്തിൽ ‘മനുഷ്യർ’ മൂലാർഥം സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
- issue: κρυφαίῳ എന്നതിന്റെ രണ്ടു പ്രയോഗങ്ങൾ
  choice: ‘രഹസ്യത്തിലുള്ള’ എന്നും ‘രഹസ്യത്തിൽ’ എന്നും ഒരേ ആശയബന്ധത്തോടെ നൽകി.
  alternative: ‘മറഞ്ഞ സ്ഥലത്തിലുള്ള/മറഞ്ഞ സ്ഥലത്ത്’ അല്ലെങ്കിൽ ‘സ്വകാര്യമായി’
  rationale: ഒരു നിർദിഷ്ട ഭൗതികസ്ഥലം അനാവശ്യമായി നിർണ്ണയിക്കാതെ, മറഞ്ഞ ഭക്തിയും പിതാവിന്റെ ദർശനവും തമ്മിലുള്ള വാചകബന്ധം നിലനിർത്തുന്നു.
- issue: μὴ ... ἀλλὰ എന്ന വൈരുധ്യത്തിലെ സൂചിതക്രിയ
  choice: ആദ്യഭാഗത്ത് ‘കാണപ്പെടാതെ’ എന്നും പിതാവിനെ സംബന്ധിച്ച ഭാഗത്ത് ‘കാണപ്പെടും’ എന്നും വ്യക്തമാക്കി.
  alternative: ‘മനുഷ്യർക്കല്ല, പിതാവിനാണ് ഉപവസിക്കുന്നതായി കാണപ്പെടേണ്ടത്’
  rationale: ഗ്രീക്കിലെ ക്രിയാസൂചന മലയാളത്തിൽ തുറന്നുപറയുന്നത് അർഥം മാറ്റാതെ സ്വാഭാവികത നൽകുന്നു; ഉപവാസം ദൈവത്തിനായി ചെയ്യുന്നതാണെന്ന ആശയം അതിരുകടന്ന് വ്യാഖ്യാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ഉപവസിക്കുക’, ‘പിതാവ്’, ‘പ്രതിഫലം’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തിയപ്പോൾ, വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി ക്രമപ്പെടുത്തി.
