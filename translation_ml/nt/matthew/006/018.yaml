revisions:
- from: അങ്ങനെ, നീ ഉപവസിക്കുന്നതായി മനുഷ്യർക്കു കാണപ്പെടാതെ, രഹസ്യത്തിലുള്ള നിന്റെ പിതാവിനു കാണപ്പെടും; രഹസ്യത്തിൽ കാണുന്ന നിന്റെ പിതാവ് നിനക്കു പ്രതിഫലം നൽകും.
  to: അങ്ങനെ, നീ ഉപവസിക്കുന്നതായി മനുഷ്യർക്കു കാണപ്പെടാതിരിക്കാനും, രഹസ്യത്തിലുള്ള നിന്റെ പിതാവിനു കാണപ്പെടാനും; രഹസ്യത്തിൽ കാണുന്ന നിന്റെ പിതാവ് നിനക്കു പ്രതിഫലം നൽകും.
