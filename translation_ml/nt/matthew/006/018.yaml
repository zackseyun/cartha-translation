review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys fasting, human observers, the Father's hiddenness, his seeing in secret, and future recompense. However, the supplied finite future «നിന്റെ പിതാവിനു കാണപ്പെടും» is not warranted by the Greek. The verb is elided after μὴ φανῇς ... ἀλλὰ and remains within the purpose clause; it should be expressed in Malayalam as a coordinated purposive form, not as an independent future assertion.
  naturalness: Most wording is modern and clear. «രഹസ്യത്തിലുള്ള നിന്റെ പിതാവ്» and «രഹസ്യത്തിൽ കാണുന്ന» are natural enough in a biblical register. Recasting the first clause with coordinated infinitives makes the contrast clear and avoids the incorrect future-tense shift.
  terminology: «ഉപവസിക്കുന്നതായി», «മനുഷ്യർക്കു», «പിതാവ്», and «പ്രതിഫലം നൽകും» are appropriate modern-standard Malayalam renderings. «മനുഷ്യർക്കു» naturally has the generic human sense required by ἀνθρώποις. The repeated «രഹസ്യ...» wording preserves the rhetorical link in κρυφαίῳ without over-specifying a physical location.
  issues:
  - severity: high
    issue: «നിന്റെ പിതാവിനു കാണപ്പെടും» introduces an independent future verb.
    rationale: Greek φανῇς is an aorist passive subjunctive governed by ὅπως, and the contrast introduced by ἀλλά carries that verbal idea forward elliptically. The Malayalam future «കാണപ്പെടും» changes the clause's grammatical force and can imply a prediction rather than the intended purpose.
  - severity: low
    issue: The contrast is clearer when both audiences are linked within the same purposive construction.
    rationale: A coordinated «കാണപ്പെടാതിരിക്കാനും ... കാണപ്പെടാനും» faithfully represents μὴ ... ἀλλὰ while reading naturally in Malayalam.
  revised_text: അങ്ങനെ, നീ ഉപവസിക്കുന്നതായി മനുഷ്യർക്കു കാണപ്പെടാതിരിക്കാനും, രഹസ്യത്തിലുള്ള നിന്റെ പിതാവിനു കാണപ്പെടാനും; രഹസ്യത്തിൽ കാണുന്ന നിന്റെ പിതാവ് നിനക്കു പ്രതിഫലം നൽകും.
  revised_footnotes: []
  revision_rationale: 'The revision removes the unsupported future tense in the first occurrence of «കാണപ്പെടും» and renders the Greek purpose clause and its not-but contrast with parallel Malayalam purposive forms. No footnotes are required: «മനുഷ്യർക്കു» adequately communicates the generic reference, and the repeated «രഹസ്യ...» language retains the source''s ambiguity and rhetorical repetition.'
