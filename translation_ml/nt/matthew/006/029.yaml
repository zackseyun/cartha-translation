id: MAT.6.29
reference: Matthew 6:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι οὐδὲ Σολομὼν ἐν πάσῃ τῇ δόξῃ αὐτοῦ περιεβάλετο ὡς ἓν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/029.yaml
  text: But I tell you that not even Solomon in all his glory was clothed like one of these[a].
translation:
  language: ml
  text: 'എന്നാൽ ഞാൻ നിങ്ങളോടു പറയുന്നു: ശലോമോൻപോലും തന്റെ സകല മഹത്വത്തോടുംകൂടെ ഇവയിൽ ഒന്നിനെപ്പോലെ അണിഞ്ഞിരുന്നില്ല.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തന്റെ സകല പ്രതാപത്തോടുംകൂടെ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: എന്നാൽ ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: λέγω with the dative is naturally expressed as ‘നിങ്ങളോടു പറയുന്നു.’ δέ marks a mild contrast with the preceding observation, so ‘എന്നാൽ’ fits the discourse without overstating the contrast.
- source_word: οὐδὲ
  choice: പോലും ... ഇല്ല
  rationale: The Malayalam focus particle ‘പോലും’ together with negation conveys the emphatic ‘not even.’
- source_word: Σολομὼν
  choice: ശലോമോൻ
  rationale: Uses the established Malayalam biblical form of the personal name.
- source_word: ἐν πάσῃ τῇ δόξῃ αὐτοῦ
  choice: തന്റെ സർവമഹത്ത്വത്തിലും
  rationale: In this context δόξα denotes Solomon’s royal magnificence. ‘മഹത്ത്വം’ preserves biblical resonance while the full phrase naturally indicates the height of his splendor.
- source_word: περιεβάλετο
  choice: അണിഞ്ഞിരുന്നില്ല
  rationale: The verb in context describes how Solomon was clothed or arrayed. ‘അണിഞ്ഞിരുന്നു’ is dignified, natural Malayalam and retains the clothing imagery.
- source_word: ὡς ἓν τούτων
  choice: ഇവയിൽ ഒന്നിനെപ്പോലും
  rationale: Refers back to the flowers in the immediate context and preserves the singular comparison. Here the ‘പോലും’ also naturally carries the force of οὐδέ in Malayalam.
theological_decisions:
- issue: Nature of δόξα in reference to Solomon
  choice: ‘സർവമഹത്ത്വം’ എന്നത് രാജകീയ പ്രൗഢിയെയും ശോഭയെയും സൂചിപ്പിക്കുന്നതായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘സർവപ്രതാപം’ അല്ലെങ്കിൽ ‘സകല ശോഭയും’
  rationale: The context concerns earthly royal magnificence rather than divine glory. ‘മഹത്ത്വം’ remains lexically broad and biblically resonant without importing a specifically divine sense.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അണിഞ്ഞിരുന്നു’ എന്ന പ്രയോഗം പൂക്കളുടെ വസ്ത്രധാരണരൂപകവുമായി ബന്ധം നിലനിർത്തുന്നു; ‘ഇവയിൽ ഒന്ന്’ എന്ന ഏകവചനതുലനം സംരക്ഷിച്ചിരിക്കുന്നു.
