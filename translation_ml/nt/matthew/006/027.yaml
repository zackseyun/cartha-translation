id: MAT.6.27
reference: Matthew 6:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τίς δὲ ἐξ ὑμῶν μεριμνῶν δύναται προσθεῖναι ἐπὶ τὴν ἡλικίαν αὐτοῦ πῆχυν ἕνα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/027.yaml
  text: And which of you[a], by being anxious, can add one cubit to his stature?
translation:
  language: ml
  text: ഉത്കണ്ഠപ്പെടുന്നതിലൂടെ നിങ്ങളിൽ ആർക്കാണ് തന്റെ ആയുസ്സിലേക്ക്[a] ഒരു മുഴം കൂട്ടിച്ചേർക്കാൻ കഴിയുക?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “തന്റെ ഉയരത്തിലേക്ക് ഒരു മുഴം.” ഗ്രീക്ക് പദത്തിന് “ആയുസ്സ്” അല്ലെങ്കിൽ “പ്രായം” എന്നും “ഉയരം” എന്നും അർഥമാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: τίς δὲ ἐξ ὑμῶν
  choice: നിങ്ങളിൽ ആർക്കാണ്
  rationale: τίς ἐξ ὑμῶν എന്ന പ്രയോഗത്തിന്റെ സ്വാഭാവിക അർഥം ‘നിങ്ങളിൽ ആർ’ എന്നാണ്. δέ ഇവിടെ നേരിയ ബന്ധകമായതിനാൽ മലയാളത്തിൽ പ്രത്യേക ബന്ധകപദം ചേർക്കാതിരിക്കുന്നത് സ്വാഭാവികമായ പ്രവാഹം നൽകുന്നു.
- source_word: μεριμνῶν
  choice: ഉത്കണ്ഠപ്പെടുന്നതുകൊണ്ട്
  rationale: μεριμνάω ആശങ്കയോ ഉത്കണ്ഠയോ അനുഭവിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; കൃദ്യന്തത്തിന്റെ മാർഗം/ഉപാധി എന്ന ഭാവം ‘-കൊണ്ട്’ നിലനിർത്തുന്നു.
- source_word: δύναται
  choice: കഴിയുക
  rationale: δύναμαι കഴിവിനെ സൂചിപ്പിക്കുന്നു; ചോദ്യവാക്യത്തിൽ ‘കഴിയുക’ സ്വാഭാവികമായ ആധുനിക മലയാളമാണ്.
- source_word: προσθεῖναι
  choice: കൂട്ടാൻ
  rationale: προστίθημι എന്നതിന്റെ ‘ചേർക്കുക/വർധിപ്പിക്കുക’ എന്ന മൂർത്തമായ ദൃശ്യഭാവം ‘കൂട്ടുക’ നിലനിർത്തുന്നു.
- source_word: ἐπὶ τὴν ἡλικίαν αὐτοῦ
  choice: തന്റെ ആയുസ്സിനോട്
  rationale: ἡλικίαയ്ക്ക് ‘ആയുസ്സ്/പ്രായം’ എന്നും ‘ഉയരം’ എന്നും അർഥമാകാം. ജീവനെക്കുറിച്ചുള്ള സമീപസന്ദർഭത്തിൽ ‘ആയുസ്സ്’ യോജിക്കുന്നു; യഥാർഥമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു. αὐτοῦയുടെ പ്രതിനിധിപരമായ ഏകവചനഭാവം ‘തന്റെ’ നൽകുന്നു.
- source_word: πῆχυν ἕνα
  choice: ഒരു മുഴം
  rationale: πῆχυς ഒരു പുരാതന നീളയളവായ ‘മുഴം’ ആണ്. ആധുനിക അളവിലേക്ക് മാറ്റാതെ മൂലത്തിലെ അളവുദൃശ്യം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἡλικία എന്ന പദത്തിന്റെ അർഥം
  choice: ആയുസ്സ്
  alternative: ഉയരം
  rationale: ഉത്കണ്ഠകൊണ്ട് ജീവകാലം നീട്ടാനാകില്ല എന്ന വായന ജീവനെക്കുറിച്ചുള്ള വാദവുമായി നന്നായി ചേരുന്നു. എന്നാൽ ‘ഒരു മുഴം’ എന്ന നീളയളവിനൊപ്പം ‘ഉയരം’ എന്ന വായനയും ഭാഷാപരമായി യഥാർഥ സാധ്യതയാണ്; അതിനാൽ അതിനെ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ചോദ്യരൂപം ഉപയോഗിച്ചു. ‘ഉത്കണ്ഠ’ സന്ദർഭത്തിലെ ആശങ്കയെ കൃത്യമായി അറിയിക്കുന്നു; ‘ഒരു മുഴം’ മൂലത്തിലെ പുരാതന അളവും രൂപകവും നിലനിർത്തുന്നു.
