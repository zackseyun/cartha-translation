    rationale: The construction ‘ആയുസ്സിനോട് ... കൂട്ടാൻ’ is less idiomatic than ‘ആയുസ്സിലേക്ക് ... കൂട്ടിച്ചേർക്കാൻ’ for προσθεῖναι ἐπὶ.
  - severity: low
    issue: Footnote wording can be clearer
    rationale: ‘ആയുസ്സ്/പ്രായം’ is compressed and may sound like a single gloss. Stating ‘ആയുസ്സ് അല്ലെങ്കിൽ പ്രായം’ clearly preserves the lexical range of ἡλικία.
