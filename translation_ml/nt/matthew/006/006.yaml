id: MAT.6.6
reference: Matthew 6:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: σὺ δὲ ὅταν προσεύχῃ, εἴσελθε εἰς τὸ ταμεῖόν σου καὶ κλείσας τὴν θύραν σου πρόσευξαι τῷ πατρί σου τῷ ἐν τῷ κρυπτῷ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ κρυπτῷ ἀποδώσει ⸀σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/006.yaml
  text: But when you pray[a], go into your inner room, and after shutting your door, pray to your Father who is in secret; and your Father, who sees in secret[b], will reward you.
translation:
  language: ml
  text: എന്നാൽ നീ പ്രാർഥിക്കുമ്പോൾ, നിന്റെ അകത്തെ മുറിയിൽ[a] കടന്ന് വാതിൽ അടച്ചശേഷം, മറവിലിരിക്കുന്ന നിന്റെ പിതാവിനോടു പ്രാർഥിക്കുക; മറവിൽ കാണുന്ന നിന്റെ പിതാവ് നിനക്കു പ്രതിഫലം നൽകും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സ്വകാര്യ മുറി,’ ‘കലവറ,’ അല്ലെങ്കിൽ പരമ്പരാഗതമായി ‘അറ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദം സ്വകാര്യതയ്ക്കോ സാധനങ്ങൾ സൂക്ഷിക്കാനോ ഉപയോഗിച്ചിരുന്ന ഒരു ഉൾമുറിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘നിനക്കു തിരികെ നൽകും’ അല്ലെങ്കിൽ ‘നിനക്കു പ്രത്യുപകാരം ചെയ്യും’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് ക്രിയയ്ക്ക് സന്ദർഭമനുസരിച്ച് ‘തിരികെ നൽകുക,’ ‘പ്രത്യുപകാരം ചെയ്യുക,’ ‘പ്രതിഫലം നൽകുക’ എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ δὲ
  choice: എന്നാൽ നീ
  rationale: മുൻവാക്യത്തിലെ കപടഭക്തരോടുള്ള വൈരുധ്യം δέയും ഊന്നലുള്ള σὺയും സൂചിപ്പിക്കുന്നു; ‘എന്നാൽ നീ’ അത് സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ὅταν προσεύχῃ
  choice: നീ പ്രാർഥിക്കുമ്പോൾ
  rationale: ὅταν കൂടിയുള്ള subjunctive പൊതുവായതോ ആവർത്തിക്കാവുന്നതോ ആയ സമയസൂചന നൽകുന്നു; ഈ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: εἴσελθε εἰς τὸ ταμεῖόν σου
  choice: നിന്റെ അകത്തെ മുറിയിൽ കടന്ന്
  rationale: ταμεῖον സ്വകാര്യതയ്ക്കോ സാധനങ്ങൾ സൂക്ഷിക്കാനോ ഉപയോഗിച്ചിരുന്ന ഉൾമുറിയെ സൂചിപ്പിക്കാം; ‘അകത്തെ മുറി’ അതിന്റെ ഒറ്റപ്പെട്ട ഉൾസ്ഥലഭാവം അനാവശ്യമായി ചുരുക്കാതെ നൽകുന്നു.
- source_word: κλείσας τὴν θύραν σου
  choice: വാതിൽ അടച്ചശേഷം
  rationale: aorist participle മുഖ്യ കല്പനയ്ക്കു മുമ്പുള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ക്രമം വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: πρόσευξαι τῷ πατρί σου
  choice: നിന്റെ പിതാവിനോടു പ്രാർഥിക്കുക
  rationale: മൂലപാഠത്തിലെ ലളിതമായ കല്പനയും ദൈവത്തെക്കുറിച്ചുള്ള ബന്ധസൂചകമായ ‘പിതാവ്’ എന്ന അഭിസംബോധനയും വിപുലീകരണമില്ലാതെ നിലനിർത്തുന്നു.
- source_word: τῷ ἐν τῷ κρυπτῷ
  choice: മറവിലിരിക്കുന്ന
  rationale: κρυπτός സൂചിപ്പിക്കുന്ന മറഞ്ഞതും പൊതുദൃഷ്ടിക്കു പുറത്തുള്ളതുമായ ഭാവം നിലനിർത്തുന്നു; അതിനെ വെറും ഭൗതിക സ്ഥാനമായി മാത്രം നിർവചിക്കുന്നില്ല.
- source_word: ὁ βλέπων ἐν τῷ κρυπτῷ
  choice: മറവിൽ കാണുന്ന
  rationale: മൂലത്തിലെ ἐν τῷ κρυπτῷ എന്ന ആവർത്തനം ‘മറവിൽ’ എന്നു വീണ്ടും നൽകി പൊതുപ്രദർശനത്തോടുള്ള വൈരുധ്യം സംരക്ഷിക്കുന്നു.
- source_word: ἀποδώσει σοι
  choice: നിനക്കു പ്രതിഫലം നൽകും
  rationale: സന്ദർഭത്തിൽ ἀποδίδωμι ദൈവം നൽകുന്ന അനുകൂലമായ പ്രതികരണത്തെ സൂചിപ്പിക്കുന്നു; ‘പ്രതിഫലം നൽകും’ സ്വാഭാവികമാണ്, എന്നാൽ ക്രിയയുടെ ‘തിരികെ നൽകുക/പ്രതിഫലിക്കുക’ എന്ന വിശാലത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ἐν τῷ κρυπτῷ എന്ന ആവർത്തിച്ച പ്രയോഗത്തിന്റെ അർഥം
  choice: രണ്ടിടത്തും ‘മറവ്’ എന്ന ഒരേ ആശയപദം ഉപയോഗിച്ച് ‘മറവിലിരിക്കുന്ന’ എന്നും ‘മറവിൽ കാണുന്ന’ എന്നും പരിഭാഷപ്പെടുത്തി.
  alternative: ‘രഹസ്യസ്ഥാനത്തിരിക്കുന്ന’; ‘സ്വകാര്യമായി’; ‘രഹസ്യത്തിൽ ചെയ്യുന്നതു കാണുന്ന’
  rationale: ഈ പ്രയോഗം സ്ഥാനത്തെയും പൊതുദൃഷ്ടിയിൽനിന്നുള്ള മറവിനെയും സൂചിപ്പിക്കാവുന്നതാണ്. ഒരൊറ്റ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതെ മൂലത്തിലെ ആവർത്തനവും പരസ്യപ്രദർശനത്തോടുള്ള വൈരുധ്യവും നിലനിർത്തുന്നു.
- issue: ദൈവത്തെ πατήρ എന്നു വിശേഷിപ്പിക്കുന്നത്
  choice: പിതാവ്
  alternative: സ്വർഗീയ പിതാവ്
  rationale: ഈ വാക്യത്തിൽ മൂലപാഠം ‘നിന്റെ പിതാവ്’ എന്നേ പറയുന്നുള്ളൂ; സമീപസന്ദർഭത്തിൽ നിന്നുള്ള ‘സ്വർഗീയ’ എന്ന വിശേഷണം ചേർക്കാതെ ബന്ധസൂചകമായ ഭാഷ നേരിട്ട് സംരക്ഷിക്കുന്നു.
- issue: ἀποδώσει എന്ന ക്രിയയുടെ ദൈവശാസ്ത്രപരമായ ഭാവം
  choice: പ്രതിഫലം നൽകും
  alternative: തിരികെ നൽകും; പ്രത്യുപകാരം ചെയ്യും
  rationale: പ്രാർഥനയ്ക്കുള്ള ദൈവിക പ്രതികരണത്തെ അനുകൂലമായി അവതരിപ്പിക്കുന്ന സന്ദർഭത്തിന് ‘പ്രതിഫലം’ യോജിക്കുന്നു; പ്രതിഫലത്തിന്റെ രൂപമോ അടിസ്ഥാനമോ പരിഭാഷയിൽ കൂടുതൽ നിർവചിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കല്പനാശൈലി ഉപയോഗിച്ചു. ‘പ്രാർഥിക്കുക,’ ‘പിതാവ്,’ ‘പ്രതിഫലം’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്കു വ്യക്തവും തിരുവെഴുത്തിന്റെ ഗൗരവത്തിനു യോജിച്ചതുമാണ്. ‘മറവിൽ’ എന്ന ആവർത്തനം അല്പം സാന്ദ്രമായിരുന്നാലും മൂലത്തിലെ ഉദ്ദേശ്യപൂർവമായ ആവർത്തനവും അർഥവ്യാപ്തിയും സംരക്ഷിക്കുന്നു.
