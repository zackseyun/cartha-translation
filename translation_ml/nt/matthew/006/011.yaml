  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τὸν ἄρτον ἡμῶν τὸν ἐπιούσιον δὸς ἡμῖν σήμερον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/011.yaml
  text: Give us today our daily bread[a].
translation:
  language: ml
  text: ഞങ്ങളുടെ അനുദിന അപ്പം ഇന്ന് ഞങ്ങൾക്കു തരണമേ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇന്നത്തേക്കുള്ള ഞങ്ങളുടെ അപ്പം,’ ‘വരാനിരിക്കുന്ന ദിവസത്തേക്കുള്ള ഞങ്ങളുടെ അപ്പം,’ അല്ലെങ്കിൽ ‘ഞങ്ങൾക്ക് ആവശ്യമായ അപ്പം.’ ἐπιούσιον എന്ന ഗ്രീക്ക് വിശേഷണം അപൂർവമാണ്; അതിന്റെ കൃത്യമായ അർഥത്തെക്കുറിച്ച് അഭിപ്രായഭേദമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρτον
  choice: അപ്പം
  rationale: ἄρτος എന്നതിന്റെ മൂർത്തമായ അർഥമായ ‘അപ്പം’ നിലനിർത്തുന്നു; ഇവിടെ അത് ആഹാരത്തെയോ ഉപജീവനത്തെയോ വിശാലമായി സൂചിപ്പിക്കാമെങ്കിലും മുഖ്യപാഠത്തിൽ ദൃശ്യരൂപം സംരക്ഷിക്കുന്നു.
- source_word: ἡμῶν
  choice: ഞങ്ങളുടെ
  rationale: ‘അപ്പം’ എന്നതിനെ വിശേഷിപ്പിക്കുന്ന ഉടമസ്ഥതാസൂചക ഷഷ്ഠി സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: ἐπιούσιον
  choice: അനുദിന
  rationale: അപൂർവവും അർഥവിവാദമുള്ളതുമായ ഈ പദത്തിന് പ്രാർഥനാഭാഷയിൽ സ്ഥാപിതവും സ്വാഭാവികവുമായ പരിഭാഷയാണ് ‘അനുദിന’; കൃത്യമായ അർഥത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: δὸς
  choice: തരണമേ
  rationale: δίδωμι എന്ന ക്രിയയുടെ ആജ്ഞാരൂപം പ്രാർഥനയുടെ വിനയപൂർവവും നേരിട്ടതുമായ അഭ്യർഥനയായി ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἡμῖν
  choice: ഞങ്ങൾക്കു
  rationale: ആജ്ഞാക്രിയയുടെ പരോക്ഷ കർമമായ ദത്തിവ് സർവനാമത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: σήμερον
  choice: ഇന്ന്
  rationale: σήμερον എന്നതിന്റെ സമയസൂചന വ്യക്തവും സ്വാഭാവികവുമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: കർത്താവിന്റെ പ്രാർഥനയിലെ ἐπιούσιον എന്ന പദത്തിന്റെ അർഥം
  choice: അനുദിന
  alternative: ഇന്നത്തേക്കുള്ള; വരാനിരിക്കുന്ന ദിവസത്തേക്കുള്ള; ഞങ്ങൾക്ക് ആവശ്യമായ
  rationale: ഈ വിശേഷണത്തിന് ഇന്നത്തേക്കുള്ള അപ്പം, അടുത്ത ദിവസത്തേക്കുള്ള അപ്പം, അല്ലെങ്കിൽ നിലനിൽപ്പിന് ആവശ്യമായ അപ്പം എന്നിങ്ങനെ വ്യാഖ്യാനസാധ്യതകളുണ്ട്. ‘അനുദിന’ എന്നത് ദൈവത്തിൽ ദിനംപ്രതിയുള്ള ആശ്രയത്തെ സ്വാഭാവികമായി അറിയിക്കുന്നു; എന്നാൽ ഒരു വ്യാഖ്യാനത്തെ മാത്രം അന്തിമമാക്കാതിരിക്കാൻ പ്രധാന പകരങ്ങൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ പ്രാർഥനാശൈലി. ‘തരണമേ’ വിനയപൂർവമായ അഭ്യർഥനാഭാവം നൽകുന്നു; അപൂർവമായ ഗ്രീക്ക് പദത്തിന്റെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിലൂടെ നിലനിർത്തുന്നു.
