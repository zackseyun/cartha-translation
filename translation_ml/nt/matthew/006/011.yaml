  source_fidelity: ഗ്രീക്ക് വാക്യത്തിലെ അപേക്ഷാരൂപം (δὸς), ‘ഞങ്ങൾക്ക്’ എന്ന ദത്തിവ് (ἡμῖν), ‘ഇന്ന്’ (σήμερον), അപ്പത്തിന്റെ മൂർത്തചിത്രം (ἄρτος), ഉടമസ്ഥതാസൂചന (ἡμῶν) എന്നിവ കൃത്യമായി നിലനിൽക്കുന്നു. ἐπιούσιον-നുള്ള ‘അനുദിന’ എന്ന മുഖ്യവായന സ്ഥാപിതമായ വിവർത്തനമാണ്; അതിന്റെ യഥാർഥ അർഥാനിശ്ചിതത്വം അടിക്കുറിപ്പ് സംരക്ഷിക്കുന്നു.
  naturalness: ‘ഞങ്ങളുടെ അനുദിന അപ്പം ഇന്ന് ഞങ്ങൾക്കു തരണമേ’ ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും പ്രാർഥനയുടെ ഗൗരവത്തിനൊത്തതുമാണ്. ‘തരണമേ’ വിനീതമായ അപേക്ഷാഭാവം വ്യക്തമായി നൽകുന്നു.
