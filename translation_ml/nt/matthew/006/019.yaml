id: MAT.6.19
reference: Matthew 6:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Μὴ θησαυρίζετε ὑμῖν θησαυροὺς ἐπὶ τῆς γῆς, ὅπου σὴς καὶ βρῶσις ἀφανίζει, καὶ ὅπου κλέπται διορύσσουσιν καὶ κλέπτουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/019.yaml
  text: Do not store up for yourselves treasures on earth[a], where moth and decay destroy[b], and where thieves break in and steal.
translation:
  language: ml
  text: നിങ്ങൾക്കായി ഭൂമിയിൽ നിധികൾ കൂട്ടിവെക്കരുത്; അവിടെ വസ്ത്രപ്പുഴുവും ക്ഷയവും[a] നശിപ്പിക്കുന്നു; അവിടെ കള്ളന്മാർ ചുമർ തുരന്ന്[b] മോഷ്ടിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തുരുമ്പ്’; ഗ്രീക്ക് പദം ലോഹത്തിലെ തുരുമ്പിനെ മാത്രമല്ല, തിന്നുതീർക്കുന്ന നാശത്തെയോ വിശാലമായ ക്ഷയത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘തുരന്നുകടക്കുന്നു’; കള്ളന്മാർ മൺചുമർ തുരന്ന് അകത്തുകയറുന്നതിനെ ഇത് സൂചിപ്പിച്ചിരിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: Μὴ θησαυρίζετε
  choice: സ്വരൂപിക്കരുത്
  rationale: μήയോടുകൂടിയ വർത്തമാനകാല ആജ്ഞാരൂപം വിലക്കിനെ സൂചിപ്പിക്കുന്നു. ‘സ്വരൂപിക്കുക’ എന്നത് സമ്പത്ത് കൂട്ടിവയ്ക്കുന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὑμῖν
  choice: നിങ്ങൾക്കായി
  rationale: ഇവിടെ ദാതൃകാരകം പ്രതിഫലനാർഥത്തിലാണ്; സ്വന്തം പ്രയോജനത്തിനോ കൈവശത്തിനോ വേണ്ടി സ്വരൂപിക്കുന്നതിനെ ഇത് വ്യക്തമാക്കുന്നു.
- source_word: θησαυροὺς
  choice: നിക്ഷേപങ്ങൾ
  rationale: വിലയേറിയ സമ്പാദ്യങ്ങളെയും സൂക്ഷിച്ചുവച്ച സമ്പത്തിനെയും ഉൾക്കൊള്ളുന്ന, സാധാരണ മലയാളത്തിൽ വ്യക്തമായ പദം.
- source_word: ἐπὶ τῆς γῆς
  choice: ഭൂമിയിൽ
  rationale: തുടർന്നുള്ള വാക്യത്തിലെ സ്വർഗീയ സ്ഥാനത്തോടുള്ള വ്യത്യാസം നിലനിർത്തുന്ന സ്വാഭാവിക സ്ഥാനസൂചകം.
- source_word: σὴς
  choice: പുഴു
  rationale: വസ്ത്രങ്ങളെയും സൂക്ഷിച്ചുവച്ച സാധനങ്ങളെയും തിന്നുനശിപ്പിക്കുന്ന moth-നെ മലയാള ബൈബിൾസന്ദർഭത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: βρῶσις
  choice: ജീർണത
  rationale: പദത്തിന്റെ അടിസ്ഥാനമായ തിന്നുതീർക്കൽ/ക്ഷയം എന്ന വിശാല അർഥം നിലനിർത്തുന്നു; ലോഹത്തിന്റെ തുരുമ്പിൽ മാത്രം അർഥം പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: ἀφανίζει
  choice: നശിപ്പിക്കുന്നു
  rationale: ഇല്ലാതാക്കുക, പാഴാക്കുക എന്ന ക്രിയയുടെ ശക്തി സംക്ഷിപ്തമായി നൽകുന്നു; പുഴുവിനും ജീർണതയ്ക്കും ഒരുപോലെ ചേരുന്നു.
- source_word: κλέπται
  choice: കള്ളന്മാർ
  rationale: മോഷണം നടത്തുന്നവരെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള സാധാരണ മലയാള തുല്യപദം.
- source_word: διορύσσουσιν
  choice: ചുമർ തുരന്ന്
  rationale: ‘തുരന്നുകടക്കുക’ എന്ന മൂലരൂപത്തിന്റെ ദൃശ്യത നിലനിർത്തുകയും മൺചുമരുകൾ തുരന്ന് കയറുന്ന പുരാതന മോഷണരീതിയെ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: κλέπτουσιν
  choice: മോഷ്ടിക്കുന്നു
  rationale: മോഷണക്രിയയ്ക്കുള്ള നേരിട്ടുള്ള ആധുനിക മലയാള പ്രയോഗം.
theological_decisions:
- issue: γῆയുടെ വ്യാപ്തിയും സ്വർഗത്തോടുള്ള വ്യത്യാസവും
  choice: ഭൂമിയിൽ
  alternative: ഈ ലോകത്തിൽ
  rationale: ‘ഭൂമിയിൽ’ എന്നത് അടുത്ത വാക്യത്തിലെ ‘സ്വർഗത്തിൽ’ എന്ന സ്ഥാനപരമായ വ്യത്യാസം കാത്തുസൂക്ഷിക്കുന്നു; ‘ഈ ലോകത്തിൽ’ എന്നു പറഞ്ഞ് അധിക വ്യാഖ്യാനഭാരം ചേർക്കുന്നില്ല.
- issue: βρῶσις എന്ന പദത്തിന്റെ അർഥം
  choice: ജീർണത
  alternative: തുരുമ്പ്
  rationale: ഗ്രീക്ക് പദം തിന്നുതീർക്കൽ, ക്ഷയം, നാശകരമായ ജീർണിക്കൽ എന്നിവയെ വിശാലമായി സൂചിപ്പിക്കാം. ‘ജീർണത’ ആ വ്യാപ്തി നിലനിർത്തുന്നു; പരമ്പരാഗതമായ ‘തുരുമ്പ്’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. വാക്യത്തിന്റെ സമാന്തര ഘടനയും ഭൂമി–സ്വർഗം വ്യത്യാസത്തിനുള്ള പശ്ചാത്തലവും നിലനിർത്തി. ‘ചുമർ തുരന്ന്’ എന്ന പ്രയോഗം മൂലഭാഷയിലെ സാംസ്കാരിക ദൃശ്യത സംരക്ഷിക്കുന്നു.
