revisions:
- from: ഈ കാര്യങ്ങളെല്ലാം ജനതകൾ[a] ഉത്സാഹത്തോടെ അന്വേഷിക്കുന്നു[b]; ഇവയെല്ലാം നിങ്ങൾക്ക് ആവശ്യമാണെന്ന് നിങ്ങളുടെ സ്വർഗീയപിതാവ് അറിയുന്നുവല്ലോ.
  to: കാരണം, ജനതകൾ[a] ഈ കാര്യങ്ങളെല്ലാം തേടുന്നു[b]; കാരണം, ഇവയെല്ലാം നിങ്ങൾക്കു ആവശ്യമാണെന്ന് നിങ്ങളുടെ സ്വർഗീയ പിതാവ് അറിയുന്നു.
