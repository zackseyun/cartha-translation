id: MAT.6.32
reference: Matthew 6:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πάντα γὰρ ταῦτα τὰ ἔθνη ⸀ἐπιζητοῦσιν· οἶδεν γὰρ ὁ πατὴρ ὑμῶν ὁ οὐράνιος ὅτι χρῄζετε τούτων ἁπάντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/032.yaml
  text: For the Gentiles eagerly seek all these things; for your heavenly Father knows that you need all these things.
translation:
  language: ml
  text: കാരണം, ജനതകൾ[a] ഈ കാര്യങ്ങളെല്ലാം തേടുന്നു[b]; കാരണം, ഇവയെല്ലാം നിങ്ങൾക്കു ആവശ്യമാണെന്ന് നിങ്ങളുടെ സ്വർഗീയ പിതാവ് അറിയുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വിജാതീയർ.’ ഗ്രീക്ക് പദത്തിന് പൊതുവേ ‘ജനതകൾ’ എന്നർഥമുണ്ടെങ്കിലും, ഇവിടെ അത് യേശുവിന്റെ ശിഷ്യസമൂഹത്തിനു പുറത്തുള്ള ജനങ്ങളെ സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, ‘തേടിക്കൊണ്ടിരിക്കുന്നു’ അല്ലെങ്കിൽ ‘നേടാൻ ശ്രമിക്കുന്നു.’ ഗ്രീക്ക് ക്രിയ നിരന്തരമോ ഉത്സുകമോ ആയ തിരച്ചിൽ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἔθνη
  choice: ജനതകൾ
  rationale: ഗ്രീക്ക് പദത്തിന്റെ അടിസ്ഥാന അർഥമായ ‘ജനതകൾ’ നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിൽ യേശുവിന്റെ ശിഷ്യസമൂഹത്തിനു പുറത്തുള്ള ജനങ്ങളെ സൂചിപ്പിക്കുന്നതായി അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു. ‘വിജാതീയർ’ എന്നത് സാമൂഹിക-ഉടമ്പടിപരമായ വ്യത്യാസം കൂടുതൽ നേരിട്ട് പ്രകടിപ്പിക്കുമെങ്കിലും ആധുനിക മലയാളത്തിൽ അന്യവൽക്കരണത്തിന്റെ അധികനിറം കൈവരാം.
- source_word: ἐπιζητοῦσιν
  choice: ഉത്സാഹത്തോടെ അന്വേഷിക്കുന്നു
  rationale: ἐπιζητέω സൂചിപ്പിക്കുന്ന ലക്ഷ്യബോധമുള്ള, തീവ്രമായ അന്വേഷിക്കൽ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; വെറും ‘അന്വേഷിക്കുന്നു’ എന്നതിനെക്കാൾ മൂലപദത്തിന്റെ ശക്തി വ്യക്തമാക്കുന്നു, എന്നാൽ ‘പാടുപെടുന്നു’ എന്നതുപോലെ ശ്രമത്തിന്റെ അളവ് അതിരുകടത്തി പറയുന്നില്ല.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: നിങ്ങളുടെ സ്വർഗീയപിതാവ്
  rationale: സ്വർഗീയമായ വിശേഷണവും ‘നിങ്ങളുടെ’ എന്ന ബന്ധവും സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: οἶδεν
  choice: അറിയുന്നു
  rationale: രൂപത്തിൽ perfect ആയ οἶδα ഇവിടെ വർത്തമാനകാല അർഥത്തിലാണ് പ്രവർത്തിക്കുന്നത്; ‘അറിയുന്നു’ അതിന്റെ സ്വാഭാവിക മലയാളരൂപമാണ്.
- source_word: χρῄζετε
  choice: നിങ്ങൾക്ക് ആവശ്യമാണെന്ന്
  rationale: ‘നിങ്ങൾക്ക് ഇവയുടെ ആവശ്യമുണ്ട്’ എന്ന അർഥം വ്യക്തവും ആധുനികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: πάντα γὰρ ταῦτα ... τούτων ἁπάντων
  choice: ഈ കാര്യങ്ങളെല്ലാം ... ഇവയെല്ലാം
  rationale: മൂലത്തിലെ ആവർത്തനവും ഊന്നലും നിലനിർത്തുന്നു; ഒരേ ദീർഘപ്രയോഗം യാന്ത്രികമായി ആവർത്തിക്കാതെ മലയാളത്തിലെ സ്വാഭാവിക സൂചനാപദം രണ്ടാം സ്ഥാനത്ത് ഉപയോഗിക്കുന്നു.
- source_word: γὰρ ... γὰρ
  choice: …; …വല്ലോ
  rationale: ആദ്യ γάρ മുൻവാക്യത്തോടുള്ള വിശദീകരണബന്ധമായി സന്ദർഭത്തിൽ സ്വാഭാവികമായി ഗ്രഹിക്കപ്പെടുന്നു; രണ്ടാം γάρ നൽകുന്ന കാരണവിവരണം ‘അറിയുന്നുവല്ലോ’ എന്ന മലയാള കണികയിലൂടെ പ്രകടമാക്കുന്നു. രണ്ടിടത്തും ‘കാരണം’ ആവർത്തിക്കുന്നത് മലയാളത്തിൽ കൃത്രിമമാകും.
theological_decisions:
- issue: യേശുവിന്റെ ഉപദേശത്തിൽ τὰ ἔθνη എന്നതിന്റെ സൂചന
  choice: പ്രധാനപാഠത്തിൽ ‘ജനതകൾ’ എന്നു നൽകി, ഈ സന്ദർഭത്തിലെ ഉടമ്പടിപരവും സാമൂഹികവുമായ വൈരുധ്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: ‘വിജാതീയർ’ അല്ലെങ്കിൽ ‘ദൈവത്തെ അറിയാത്തവർ’
  rationale: ‘ജനതകൾ’ ഗ്രീക്കിലെ യഥാർഥമായ അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു. ‘വിജാതീയർ’ സന്ദർഭപരമായ സൂചന കൂടുതൽ നേരിട്ട് നൽകുന്നുവെങ്കിലും, ‘ദൈവത്തെ അറിയാത്തവർ’ എന്നത് മതപരമായ വ്യാഖ്യാനം പാഠത്തിലേക്ക് കൂടുതലായി ചേർക്കും. എല്ലാ യഹൂദേതരരെയും കുറിച്ചുള്ള സമ്പൂർണ ധാർമ്മിക വിധിയായി വാക്യം അവതരിപ്പിക്കാതിരിക്കാനും ഈ തിരഞ്ഞെടുപ്പ് സഹായിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. മൂലത്തിലെ രണ്ടു വിശദീകരണഘടകങ്ങളുടെ ബന്ധം അർധവിരാമവും ‘വല്ലോ’ എന്ന കണികയുംകൊണ്ട് സ്വാഭാവികമായി അവതരിപ്പിച്ചു; ആവർത്തനവും പിതാവിനെക്കുറിച്ചുള്ള ഉറപ്പും നിലനിർത്തി.
