id: MAT.6.23
reference: Matthew 6:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐὰν δὲ ὁ ὀφθαλμός σου πονηρὸς ᾖ, ὅλον τὸ σῶμά σου σκοτεινὸν ἔσται. εἰ οὖν τὸ φῶς τὸ ἐν σοὶ σκότος ἐστίν, τὸ σκότος πόσον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/023.yaml
  text: But if your eye is bad[a], your whole body will be dark. If then the light in you is darkness, how great is the darkness!
translation:
  language: ml
  text: എന്നാൽ നിന്റെ കണ്ണ് മോശമാണെങ്കിൽ[a], നിന്റെ ശരീരം മുഴുവനും ഇരുണ്ടതായിരിക്കും. അപ്പോൾ നിന്നിലുള്ള വെളിച്ചം ഇരുട്ടാണെങ്കിൽ, ഇരുട്ട് എത്ര വലുത്!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ദുഷ്ടമാണെങ്കിൽ,” “അനാരോഗ്യമുള്ളതാണെങ്കിൽ”; ‘കണ്ണ്’ എന്ന പ്രയോഗവും ചുറ്റുപാടുള്ള സന്ദർഭവും പരിഗണിക്കുമ്പോൾ “പിശുക്കുള്ളതാണെങ്കിൽ” അല്ലെങ്കിൽ “ഉദാരമല്ലാത്തതാണെങ്കിൽ” എന്ന അർഥവും സാധ്യതയുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηρὸς
  choice: മോശം
  rationale: ‘ദുഷ്ടം,’ ‘അനാരോഗ്യമുള്ളത്,’ അല്ലെങ്കിൽ സന്ദർഭത്തിൽ ‘പിശുക്കുള്ളത്/ഉദാരമല്ലാത്തത്’ എന്നിങ്ങനെ വ്യത്യസ്ത സൂചനകൾക്കു സാധ്യതയുണ്ട്. ‘മോശം’ എന്ന വിശാലമായ പദം രൂപകത്തിന്റെ അർഥം ഒറ്റ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: σκοτεινὸν
  choice: ഇരുണ്ടത്
  rationale: ഗ്രീക്കിലെ വിശേഷണത്തിന്റെ വിധേയപ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: φῶς
  choice: വെളിച്ചം
  rationale: അകത്തെ ധാർമികമോ ആത്മീയമോ ആയ ഗ്രഹണത്തെ സൂചിപ്പിക്കുന്ന രൂപകമാണെങ്കിലും, മൂലപാഠത്തിലെ വെളിച്ചം–ഇരുട്ട് വൈരുധ്യം അതേപടി സൂക്ഷിക്കുന്നു.
- source_word: σκότος
  choice: ഇരുട്ട്
  rationale: φῶς എന്ന ‘വെളിച്ച’ത്തോടുള്ള രൂപകാത്മക വൈരുധ്യവും അവസാന വാക്യത്തിലെ ഊന്നലും നിലനിർത്തുന്നു.
- source_word: πόσον
  choice: എത്ര വലുത്
  rationale: അളവിന്റെയോ തീവ്രതയുടെയോ ആശ്ചര്യോക്തിപരമായ ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὀφθαλμός
  choice: കണ്ണ്
  rationale: ഗ്രഹണം, ഉദ്ദേശ്യം, ധാർമിക ദിശ എന്നിവയിലേക്കു വിരൽചൂണ്ടുന്ന ശരീരരൂപകം അക്ഷുണ്ണമായി സൂക്ഷിക്കുന്നു.
- source_word: ὅλον τὸ σῶμά σου
  choice: നിന്റെ ശരീരം മുഴുവനും
  rationale: ὅλον നൽകുന്ന സമഗ്രതയുടെ ഊന്നൽ വ്യക്തവും സ്വാഭാവികവുമായി പകരുന്നു.
- source_word: τὸ φῶς τὸ ἐν σοὶ
  choice: നിന്നിലുള്ള വെളിച്ചം
  rationale: ‘ആന്തരിക വെളിച്ചം’ എന്ന വ്യാഖ്യാനാത്മക വികസനം ഒഴിവാക്കി ഗ്രീക്ക് പ്രയോഗത്തോട് അടുത്തുനിൽക്കുന്നു.
theological_decisions:
- issue: ‘മോശമായ കണ്ണ്’ എന്ന രൂപകത്തിന്റെ അർഥം
  choice: പ്രധാന പാഠത്തിൽ വിശാലമായ ‘മോശം’ എന്ന പദം ഉപയോഗിച്ച് രൂപകത്തിന്റെ ബഹുവിധ സൂചനകൾ തുറന്നുവെച്ചു.
  alternative: ‘ദുഷ്ടമായ കണ്ണ്,’ ‘അനാരോഗ്യമുള്ള കണ്ണ്,’ അല്ലെങ്കിൽ സന്ദർഭത്തിലെ സെമിറ്റിക് പ്രയോഗമനുസരിച്ച് ‘പിശുക്കുള്ള/ഉദാരമല്ലാത്ത കണ്ണ്.’
  rationale: മത്തായി 6:19–24 എന്ന സന്ദർഭം ധാർമിക ദുഷ്ടത, വികലമായ ഗ്രഹണം, ഉദാരതയില്ലായ്മ എന്നീ പരസ്പരം മൂടിനിൽക്കുന്ന സൂചനകൾ അനുവദിക്കുന്നു. അതിനാൽ മുഖ്യപാഠം ഒരു അർഥം മാത്രം നിർബന്ധിക്കുന്നില്ല; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ മാന്യമായ മലയാളം. മൂലത്തിലെ വെളിച്ചം–ഇരുട്ട് രൂപകവും അവസാനത്തെ ആശ്ചര്യോക്തിപരമായ ഊന്നലും നിലനിർത്തിയിരിക്കുന്നു.
