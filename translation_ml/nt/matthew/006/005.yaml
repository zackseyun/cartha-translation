  terminology: കപടഭക്തർ appropriately conveys ὑποκριταί in this context without importing a doctrinal interpretation. സിനഗോഗുകൾ, പ്രാർഥിക്കുക, and പ്രതിഫലം are appropriate standard terms. The footnotes are correctly anchored and preserve the lexical alternatives.
