id: MAT.6.5
reference: Matthew 6:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ὅταν ⸂προσεύχησθε, οὐκ ἔσεσθε ὡς⸃ οἱ ὑποκριταί· ὅτι φιλοῦσιν ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς γωνίαις τῶν πλατειῶν ἑστῶτες προσεύχεσθαι, ⸀ὅπως φανῶσιν τοῖς ἀνθρώποις· ἀμὴν λέγω ⸀ὑμῖν, ἀπέχουσι τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/005.yaml
  text: And whenever you pray[a], you shall not be like the hypocrites, because they love to stand and pray in the synagogues and on the corners of the broad streets, so that they may be seen by people. Truly I say to you[c][b], they have received their reward.
translation:
  language: ml
  text: 'നിങ്ങൾ പ്രാർഥിക്കുമ്പോഴൊക്കെയും കപടഭക്തരെപ്പോലെ ആകരുത്. കാരണം, ആളുകൾ അവരെ കാണേണ്ടതിന് അവർ സിനഗോഗുകളിലും വിശാലമായ തെരുവുകളുടെ കോണുകളിലും[a] നിന്നുകൊണ്ട് പ്രാർഥിക്കാൻ ഇഷ്ടപ്പെടുന്നു. സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: അവർക്ക് അവരുടെ പ്രതിഫലം ലഭിച്ചുകഴിഞ്ഞു.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “തെരുവുമൂലകളിലും.” ഗ്രീക്കിൽ കൂടുതൽ അക്ഷരാർഥമായി, “വിശാലമായ തെരുവുകളുടെ കോണുകളിലും” എന്നാണ്.'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: “അവർ തങ്ങളുടെ പ്രതിഫലം കൈപ്പറ്റിക്കഴിഞ്ഞു.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് ക്രിയയ്ക്ക് പണം മുഴുവനായി കൈപ്പറ്റിയെന്ന വാണിജ്യപരമായ ധ്വനി ഉണ്ടാകാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν προσεύχησθε
  choice: നിങ്ങൾ പ്രാർഥിക്കുമ്പോഴൊക്കെയും
  rationale: ὅταν എന്നതിന്റെ അനിശ്ചിതവും ആവർത്തകവുമായ കാലാർഥം ‘എപ്പോഴൊക്കെയും’ എന്ന പ്രയോഗം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: οὐκ ἔσεσθε ὡς
  choice: പോലെ ആകരുത്
  rationale: ഭാവികാലരൂപത്തിലുള്ള ഗ്രീക്ക് വിലക്കിന്റെ പ്രബോധനശക്തി ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ നിർദേശമായി നൽകുന്നു.
- source_word: ὑποκριταί
  choice: കപടഭക്തർ
  rationale: ഭക്തി മറ്റുള്ളവരുടെ മുമ്പിൽ പ്രദർശിപ്പിക്കുന്നവരെ ഈ സന്ദർഭത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി സൂചിപ്പിക്കുന്നു; ‘അഭിനേതാക്കൾ’ എന്ന പദോത്പത്തിപരമായ വിവർത്തനം ഇവിടെ തെറ്റിദ്ധരിപ്പിക്കാം.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: സിനഗോഗുകളിൽ
  rationale: ഒന്നാം നൂറ്റാണ്ടിലെ യഹൂദ പശ്ചാത്തലത്തിലെ പ്രത്യേക സ്ഥാപനത്തെ ചരിത്രപരമായി നിലനിർത്തുന്നു.
- source_word: ἐν ταῖς γωνίαις τῶν πλατειῶν
  choice: വിശാലമായ തെരുവുകളുടെ കോണുകളിൽ
  rationale: പൊതുജനങ്ങൾ സഞ്ചരിക്കുന്ന വീതിയേറിയ തെരുവുകൾ എന്ന πλατεῖαയുടെ അർഥം ഔപചാരികമായും വായനാസൗകര്യത്തോടെയും നിലനിർത്തുന്നു.
- source_word: ἑστῶτες προσεύχεσθαι
  choice: നിന്നുകൊണ്ട് പ്രാർഥിക്കാൻ
  rationale: നിൽക്കുക എന്ന കൃതന്തം പ്രാർഥനയുടെ രീതിയെ വിശേഷിപ്പിക്കുന്ന ഗ്രീക്ക് ഘടന സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: ὅπως φανῶσιν τοῖς ἀνθρώποις
  choice: ആളുകൾ തങ്ങളെ കാണേണ്ടതിന്
  rationale: ലക്ഷ്യാർഥം വ്യക്തമായി നൽകുകയും ἀνθρώποις ഇവിടെ പുരുഷന്മാർക്ക് മാത്രമല്ല, പൊതുവെ മനുഷ്യർക്കാണ് ബാധകമെന്നത് അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: യേശുവിന്റെ ഗൗരവമുള്ള ഉറപ്പിക്കൽ സൂത്രവാക്യം ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀπέχουσι τὸν μισθὸν αὐτῶν
  choice: അവർക്ക് അവരുടെ പ്രതിഫലം ലഭിച്ചുകഴിഞ്ഞു
  rationale: ἀπέχω എന്ന ക്രിയയുടെ വാണിജ്യപരമായ ‘ലഭിച്ചു/കൈപ്പറ്റി’ എന്ന സന്ദർഭാർഥവും ഇനി വേറൊരു പ്രതിഫലം പ്രതീക്ഷിക്കാനില്ലെന്ന പൂർത്തീകരണസൂചനയും അതിരുകടന്ന വിശദീകരണമില്ലാതെ നൽകുന്നു.
theological_decisions:
- issue: ἀνθρώποις എന്ന പൊതുവാചകത്തിന്റെ പരിധി
  choice: ആളുകൾ
  alternative: മനുഷ്യർ / പുരുഷന്മാർ
  rationale: ഇവിടെ പദം മനുഷ്യനിരീക്ഷകരെ പൊതുവായി സൂചിപ്പിക്കുന്നു; പുരുഷന്മാർക്ക് മാത്രമായി അർഥം ചുരുക്കുന്നില്ല.
- issue: പ്രതിഫലം ലഭിച്ചതിന്റെ പൂർത്തീകരണശക്തി
  choice: ലഭിച്ചുകഴിഞ്ഞു
  alternative: അവരുടെ പ്രതിഫലം അവർക്കുണ്ട്
  rationale: അവരുടെ പൊതുപ്രശംസ തന്നെയാണ് അവർ തേടിയതും നേടിയതുമായ പ്രതിഫലം എന്ന വാക്യത്തിന്റെ ശക്തി സംരക്ഷിക്കുന്നു; ‘പൂർണമായി’ എന്ന് മുഖ്യപാഠത്തിൽ ചേർത്ത് വ്യാഖ്യാനം കടത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ചരിത്രപരമായ പ്രത്യേകത നിലനിർത്താൻ ‘സിനഗോഗ്’ ഉപയോഗിച്ചു. ‘കപടഭക്തർ’ സന്ദർഭത്തിലെ മതപരമായ കപടപ്രകടനം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു. ഗ്രീക്കിലെ ദീർഘവാക്യം മലയാളത്തിലെ വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി.
