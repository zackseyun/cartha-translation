id: MAT.6.3
reference: Matthew 6:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: σοῦ δὲ ποιοῦντος ἐλεημοσύνην μὴ γνώτω ἡ ἀριστερά σου τί ποιεῖ ἡ δεξιά σου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/003.yaml
  text: But when you give to the needy[a], do not let your left hand know what your right hand is doing,
translation:
  language: ml
  text: എന്നാൽ നീ ദരിദ്രർക്കു ദാനം ചെയ്യുമ്പോൾ[a], നിന്റെ വലതുകൈ ചെയ്യുന്നത് എന്തെന്ന് നിന്റെ ഇടതുകൈ അറിയരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ധർമ്മദാനം ചെയ്യുമ്പോൾ’; ഗ്രീക്ക് പദം ദരിദ്രർക്കുള്ള കാരുണ്യദാനത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: σοῦ δὲ ποιοῦντος
  choice: എന്നാൽ നീ ... ചെയ്യുമ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് ഘടനയും δέ സൂചിപ്പിക്കുന്ന മുൻവാക്യത്തോടുള്ള വൈരുധ്യവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐλεημοσύνην
  choice: ദരിദ്രർക്കു ദാനം
  rationale: ഈ പദം ഇവിടെ ദരിദ്രർക്കുള്ള ധർമ്മദാനത്തെ സൂചിപ്പിക്കുന്നു. ‘ദാനം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; ‘ദരിദ്രർക്കു’ എന്നത് അതിന്റെ പ്രത്യേക സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു.
- source_word: μὴ γνώτω
  choice: അറിയരുത്
  rationale: മൂന്നാംപുരുഷ ആജ്ഞാരൂപത്തിലുള്ള നിരോധനം മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുകയും കൈകളുടെ വ്യക്തിവൽക്കരണം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἡ ἀριστερά σου
  choice: നിന്റെ ഇടതുകൈ
  rationale: മൂലത്തിലെ സ്മരണീയമായ രൂപകവും സമാന്തരഘടനയും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: τί ποιεῖ ἡ δεξιά σου
  choice: നിന്റെ വലതുകൈ ചെയ്യുന്നത് എന്തെന്ന്
  rationale: ποιεῖ എന്ന വർത്തമാനകാല ക്രിയയുടെ പുരോഗമിക്കുന്ന പ്രവർത്തനഭാവം സ്വാഭാവികമായ മലയാളവാക്യഘടനയിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ഇടതുകൈയും വലതുകൈയും സംബന്ധിച്ച വചനത്തിന്റെ വ്യാഖ്യാനം
  choice: ദാനത്തിലെ അതീവ രഹസ്യസ്വഭാവത്തെയും ആത്മപ്രദർശനമില്ലായ്മയെയും ഊന്നുന്ന രൂപകം അതേപടി നിലനിർത്തി.
  alternative: ഇത് പൊതുവായ വിനയത്തിനുള്ള അതിശയോക്തിയായി വ്യാഖ്യാനിക്കുക; അല്ലെങ്കിൽ എല്ലാ പരസ്യമായ ദാനവും നിരോധിക്കുന്നതായി വ്യക്തമാക്കുക.
  rationale: വാക്യം വ്യക്തിവൽക്കരണവും അതിശയോക്തിയും ഉപയോഗിക്കുന്നു. വ്യാഖ്യാനപരമായ ഒരു കർശന നിഗമനം പരിഭാഷയിൽ ചേർക്കാതെ, മൂലത്തിലെ ദൃശ്യരൂപവും ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘ഇടതുകൈ/വലതുകൈ’ എന്ന പരിചിത രൂപകം നിലനിർത്തിയിരിക്കുന്നു; ‘ധർമ്മം ചെയ്യുക’ എന്നതിന് ഉണ്ടാകാവുന്ന വിശാലമോ ആചാരപരമോ ആയ അർഥഭ്രമം ഒഴിവാക്കാൻ പ്രധാനപാഠത്തിൽ ‘ദരിദ്രർക്കു ദാനം’ ഉപയോഗിച്ചു.
