    text: അഥവാ, “ഓരോ ദിവസത്തിനും അന്നന്നത്തെ തിന്മ മതി.” ഗ്രീക്ക് പദത്തിന് “തിന്മ” എന്നും അർഥമാകാം; എന്നാൽ ഇവിടെ അത് ആ ദിവസത്തെ കഷ്ടതയെയോ ദുരിതത്തെയോ സൂചിപ്പിക്കുന്നതായിരിക്കാം.
