  to: അതുകൊണ്ട് നാളെയെക്കുറിച്ച് ആകുലപ്പെടരുത്; നാളെ സ്വന്തം കാര്യത്തെക്കുറിച്ച് ആകുലപ്പെടും. ഓരോ ദിവസത്തിനും അന്നന്നത്തെ കഷ്ടത മതി.[a]
