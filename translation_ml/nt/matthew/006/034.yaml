id: MAT.6.34
reference: Matthew 6:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μὴ οὖν μεριμνήσητε εἰς τὴν αὔριον, ἡ γὰρ αὔριον μεριμνήσει ⸀αὑτῆς· ἀρκετὸν τῇ ἡμέρᾳ ἡ κακία αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/034.yaml
  text: Therefore do not worry about tomorrow[a], for tomorrow will worry about itself. Each day has enough trouble of its own.
translation:
  language: ml
  text: അതുകൊണ്ട് നാളെയെക്കുറിച്ച് ആകുലപ്പെടരുത്; നാളെ സ്വന്തം കാര്യത്തെക്കുറിച്ച് ആകുലപ്പെടും. ഓരോ ദിവസത്തിനും അന്നന്നത്തെ കഷ്ടത മതി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഓരോ ദിവസത്തിനും അന്നന്നത്തെ തിന്മ മതി.” ഗ്രീക്ക് പദത്തിന് “തിന്മ” എന്നും അർഥമാകാം; എന്നാൽ ഇവിടെ അത് ആ ദിവസത്തെ കഷ്ടതയെയോ ദുരിതത്തെയോ സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεριμνήσητε
  choice: ആകുലപ്പെടരുത്
  rationale: ഈ പ്രസംഗഭാഗത്തിൽ ക്രിയ സൂചിപ്പിക്കുന്നത് സാധാരണ പരിഗണനയെയല്ല, ഉത്കണ്ഠ നിറഞ്ഞ ആകുലതയെയാണ്. ‘ആകുലപ്പെടരുത്’ ആ അർഥം സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: εἰς τὴν αὔριον
  choice: നാളെയെക്കുറിച്ച്
  rationale: μεριμνάω എന്ന ക്രിയയോടുകൂടെ εἰς ഭാവിദിനത്തിലേക്കു തിരിഞ്ഞിരിക്കുന്ന ഉത്കണ്ഠയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘നാളെയെക്കുറിച്ച്’ എന്നത് സ്വാഭാവികമാണ്.
- source_word: ἡ αὔριον
  choice: നാളെ
  rationale: ഗ്രീക്കിൽ ‘നാളെ’ അടുത്ത വാക്യത്തിന്റെ വ്യക്തിവൽക്കരിച്ച കർത്താവാണ്; മലയാളത്തിലും ‘നാളെ ... ആകുലപ്പെടും’ എന്ന രൂപം ആ അലങ്കാരം നിലനിർത്തുന്നു.
- source_word: μεριμνήσει αὑτῆς
  choice: അതിനെക്കുറിച്ചുതന്നെ ആകുലപ്പെടും
  rationale: ആദ്യ ക്രിയയുമായുള്ള പദബന്ധവും ‘നാളെ’ എന്നതിന്റെ വ്യക്തിവൽക്കരണവും നിലനിർത്തുന്നു. αὑτῆς എന്ന പ്രതിഫലനസർവനാമത്തിന്റെ ബലം ‘അതിനെക്കുറിച്ചുതന്നെ’ എന്നു നൽകുന്നു.
- source_word: ἀρκετὸν τῇ ἡμέρᾳ
  choice: ഓരോ ദിവസത്തിനും ... മതി
  rationale: ‘ആ ദിവസത്തിന് മതിയായത്’ എന്ന ഗ്രീക്ക് ആശയം മലയാളത്തിലെ സ്വാഭാവികമായ വിതരണപ്രയോഗത്തിൽ നൽകുന്നു.
- source_word: ἡ κακία αὐτῆς
  choice: അന്നന്നത്തെ കഷ്ടത
  rationale: κακία എന്നതിന് ‘തിന്മ’ എന്നും അർഥമുണ്ടെങ്കിലും, ഉത്കണ്ഠയെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ ഓരോ ദിവസത്തിന്റെയും ദുരിതം അഥവാ കഷ്ടതയാണ് പ്രധാന സൂചന. ‘അന്നന്നത്തെ’ αὐτῆς എന്ന ബന്ധവും ദിനംപ്രതിയുള്ള ആശയവും ചുരുക്കമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: κακία എന്ന പദത്തിന്റെ സന്ദർഭോചിത അർഥം
  choice: കഷ്ടത
  alternative: തിന്മ
  rationale: വാക്യം ഭാവിയെക്കുറിച്ചുള്ള ആകുലതയെ വിലക്കുകയും ഓരോ ദിവസത്തിനും അതിന്റേതായ ഭാരം ഉണ്ടെന്ന് പറയുകയും ചെയ്യുന്നു. അതിനാൽ ‘കഷ്ടത’ സന്ദർഭത്തിലെ പ്രായോഗിക അർഥം നൽകുന്നു; എന്നാൽ ‘തിന്മ’ എന്ന യഥാർഥ നിഘണ്ടുപരമായ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ ‘നാളെ’ എന്ന വ്യക്തിവൽക്കരണവും ആവർത്തിച്ചുള്ള ആകുലതാ-ക്രിയയും നിലനിർത്തി; അവസാനത്തെ ജ്ഞാനോക്തി മലയാളത്തിൽ വ്യക്തവും ചൊല്ലുപോലെയും ആക്കി.
