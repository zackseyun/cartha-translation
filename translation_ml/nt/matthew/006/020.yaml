id: MAT.6.20
reference: Matthew 6:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: θησαυρίζετε δὲ ὑμῖν θησαυροὺς ἐν οὐρανῷ, ὅπου οὔτε σὴς οὔτε βρῶσις ἀφανίζει, καὶ ὅπου κλέπται οὐ διορύσσουσιν οὐδὲ κλέπτουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/020.yaml
  text: But store up for yourselves treasures in heaven[a], where neither moth nor decay destroys[b], and where thieves do not break in and steal.
translation:
  language: ml
  text: എന്നാൽ നിങ്ങൾക്കായി സ്വർഗത്തിൽ നിധികൾ ശേഖരിച്ചുവെക്കുക; അവിടെ പാറ്റയോ ക്ഷയമോ[a] അവയെ നശിപ്പിക്കുന്നില്ല; അവിടെ കള്ളന്മാർ തുരന്നുകയറുകയോ[b] മോഷ്ടിക്കുകയോ ചെയ്യുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തുരുമ്പോ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദം തിന്നുതീർക്കുന്ന ക്ഷയത്തെയോ നശീകരണത്തെയോ കൂടുതൽ വ്യാപകമായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘തുരന്നുകടക്കുക.’ അക്കാലത്തെ വീടുകളുടെ ചുമർ തുരന്ന് കള്ളന്മാർ അകത്തു കടക്കുന്നതിനെ ഇത് സൂചിപ്പിക്കുന്നതാകാം.
    reason: cultural_note
lexical_decisions:
- source_word: θησαυρίζετε
  choice: സ്വരൂപിച്ചുവെക്കുക
  rationale: വർത്തമാനകാല ആജ്ഞയുടെ തുടർച്ചയായ പ്രവർത്തനഭാവവും നിക്ഷേപം കൂട്ടിവെക്കുന്നതെന്ന രൂപകവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ വിലക്കിനോടുള്ള വ്യക്തമായ വൈരുധ്യം സൂചിപ്പിക്കുന്നു.
- source_word: ὑμῖν
  choice: നിങ്ങൾക്കായി
  rationale: സ്വന്തം പ്രയോജനത്തിനായി എന്ന ദത്തിവ് അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: θησαυροὺς
  choice: നിക്ഷേപങ്ങൾ
  rationale: ബഹുവചനവും വിലമതിക്കുന്ന സമ്പത്ത് സംഭരിക്കുന്നതെന്ന രൂപകവും നിലനിർത്തുന്നു.
- source_word: ἐν οὐρανῷ
  choice: സ്വർഗത്തിൽ
  rationale: ഏകവചന സ്ഥാനസൂചനയുടെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: σὴς
  choice: പുഴു
  rationale: സംഭരിച്ച വസ്ത്രാദികളെ നശിപ്പിക്കുന്ന വസ്ത്രപ്പുഴുവിനെ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: βρῶσις
  choice: ജീർണത
  rationale: ‘തിന്നൽ,’ ‘ക്ഷയം,’ ‘തുരുമ്പ്’ എന്നിവ ഉൾക്കൊള്ളാവുന്ന വ്യാപകമായ നശീകരണഭാവം നിലനിർത്തുന്നു; ലോഹത്തിലെ തുരുമ്പിലേക്കു മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: ἀφανίζει
  choice: നശിപ്പിക്കുന്നില്ല
  rationale: അപ്രത്യക്ഷമാക്കുക, ഇല്ലാതാക്കുക എന്ന ഫലം വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: διορύσσουσιν
  choice: ചുമർ തുരന്ന്
  rationale: മൺചുമർ തുരന്ന് അകത്തു കടക്കുന്ന പുരാതന മോഷണരീതിയെ മൂലപദത്തോട് അടുത്തുനിന്ന് വ്യക്തമാക്കുന്നു.
- source_word: κλέπτουσιν
  choice: മോഷ്ടിക്കുന്നുമില്ല
  rationale: ക്രിയയുടെ ലളിതവും നേരിട്ടുള്ളതുമായ അർഥം നൽകുന്നു.
theological_decisions:
- issue: ‘സ്വർഗത്തിലെ നിക്ഷേപങ്ങൾ’ എന്നതിന്റെ സ്വഭാവം
  choice: രൂപകം വിശദീകരിക്കാതെ ‘സ്വർഗത്തിൽ ... നിക്ഷേപങ്ങൾ’ എന്നു നിലനിർത്തി.
  alternative: ‘സ്വർഗീയ പ്രതിഫലങ്ങൾ’ അല്ലെങ്കിൽ ‘ആത്മീയ സമ്പത്ത്’
  rationale: മൂലപാഠം ഏതു പ്രത്യേക പ്രതിഫലസിദ്ധാന്തത്തെയും വിശദീകരിക്കുന്നില്ല; അതിനാൽ യഥാർഥ രൂപകവും അതിലെ ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും സംരക്ഷിച്ചു.
- issue: βρῶσις എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: ‘ജീർണത’
  alternative: ‘തുരുമ്പ്’ അല്ലെങ്കിൽ ‘ക്ഷയം’
  rationale: ഭൗതിക വസ്തുക്കളെ തിന്നുതീർക്കുകയോ ക്ഷയിപ്പിക്കുകയോ ചെയ്യുന്ന ശക്തിയെ വ്യാപകമായി സൂചിപ്പിക്കുന്നു; അർഥം ലോഹക്ഷയത്തിലേക്ക് മാത്രം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മൂലത്തിലെ വൈരുധ്യവും രൂപകവും ബഹുവചനവും സംരക്ഷിച്ചിരിക്കുന്നു. പ്രധാനവാക്യത്തിൽ ‘ചുമർ’ എന്നത് സന്ദർഭവ്യക്തതയ്ക്കായി ചേർത്തിട്ടുണ്ടെങ്കിലും അതിന്റെ സാംസ്കാരിക പശ്ചാത്തലം അടിക്കുറിപ്പിൽ വിശദീകരിക്കുന്നു.
