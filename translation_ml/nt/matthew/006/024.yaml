review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the universal incapacity, the two parallel alternatives, the contrast of God and Mammon, and the non-divine sense of κύριοι as ‘masters.’ A small revision better represents ἀντέξεται (‘hold fast/be devoted’) and καταφρονήσει (‘despise/look down on’).
  naturalness: The Malayalam is generally clear and suitably dignified. ‘ഒരാളോടു പറ്റിച്ചേരുക’ is less idiomatic in this relational context, and ‘നിന്ദിക്കുക’ can suggest verbally insulting rather than regarding with contempt. ‘ചേർന്നുനിൽക്കുക’ and ‘അവജ്ഞയോടെ കാണുക’ are natural modern alternatives.
  terminology: ‘യജമാനന്മാർ,’ ‘സേവിക്കുക,’ ‘ദൈവം,’ and the retained loanword ‘മാമോൻ’ are appropriate. The footnote should state more directly that the loanword can portray wealth as a rival master.
  issues:
  - severity: medium
    issue: ‘ഒരാളോടു പറ്റിച്ചേരുകയും’ for ἑνὸς ἀνθέξεται
    rationale: This can sound physically attached or colloquial. ‘ഒരാളോടു ചേർന്നുനിൽക്കുകയും’ naturally conveys adherence and loyalty without overstating the metaphor.
  - severity: medium
    issue: ‘മറ്റെയാളെ നിന്ദിക്കുകയും’ for τοῦ ἑτέρου καταφρονήσει
    rationale: ‘നിന്ദിക്കുക’ commonly denotes speaking abuse or reproach. καταφρονέω here is to despise or hold in contempt; ‘അവജ്ഞയോടെ കാണുക’ more directly conveys that stance.
  - severity: low
    issue: Footnote wording ‘വ്യക്തിവൽക്കരിക്കാം’
    rationale: The wording is slightly imprecise about the rhetorical effect. It is clearer to say that the term may portray wealth as a rival master.
