id: MAT.6.24
reference: Matthew 6:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οὐδεὶς δύναται δυσὶ κυρίοις δουλεύειν· ἢ γὰρ τὸν ἕνα μισήσει καὶ τὸν ἕτερον ἀγαπήσει, ἢ ἑνὸς ἀνθέξεται καὶ τοῦ ἑτέρου καταφρονήσει. οὐ δύνασθε θεῷ δουλεύειν καὶ μαμωνᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/024.yaml
  text: No one is able to serve two masters[a], for either he will hate the one and love the other, or he will be devoted to one and despise the other. You are not able to serve God and mammon.
translation:
  language: ml
  text: ആർക്കും രണ്ടു യജമാനന്മാരെ സേവിക്കാൻ കഴിയില്ല. കാരണം, അയാൾ ഒന്നുകിൽ ഒരാളെ വെറുക്കുകയും മറ്റെയാളെ സ്നേഹിക്കുകയും ചെയ്യും; അല്ലെങ്കിൽ ഒരാളോടു ചേർന്നുനിൽക്കുകയും മറ്റെയാളെ അവജ്ഞയോടെ കാണുകയും ചെയ്യും. നിങ്ങൾക്ക് ദൈവത്തെയും മാമോനെയും[a] സേവിക്കാൻ കഴിയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സമ്പത്ത്’ അല്ലെങ്കിൽ ‘പണം.’ ഗ്രീക്കിൽ അരമായയിൽനിന്നുള്ള ‘മാമോൻ’ എന്ന കടംവാക്കാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; ഇത് സമ്പത്തിനെ ദൈവത്തിന് എതിരാളിയായ ഒരു യജമാനനെപ്പോലെ അവതരിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδεὶς
  choice: ആർക്കും … കഴിയില്ല
  rationale: ഗ്രീക്കിലെ സാർവത്രിക നിഷേധം മലയാളത്തിൽ സ്വാഭാവികമായി ക്രിയയോടു ചേർന്ന നിഷേധഘടനയിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: δύναται / δύνασθε
  choice: കഴിയില്ല
  rationale: കേവലമായ വിലക്കല്ല, കഴിവില്ലായ്മയോ അസാധ്യതയോ ആണ് ക്രിയ സൂചിപ്പിക്കുന്നത്; രണ്ടു പ്രയോഗങ്ങളിലും ആവർത്തനം നിലനിർത്തുന്നു.
- source_word: δυσὶ κυρίοις
  choice: രണ്ടു യജമാനന്മാരെ
  rationale: δουλεύειν എന്ന അടിമസേവനത്തിന്റെ പശ്ചാത്തലത്തിൽ κύριοι എന്നത് ദൈവിക പദവിയായ ‘കർത്താക്കന്മാർ’ എന്നതിലുപരി അധികാരമുള്ള ‘യജമാനന്മാർ’ എന്നാണ്.
- source_word: δουλεύειν
  choice: സേവിക്കാൻ
  rationale: അടിമയായി സേവിക്കുക എന്ന ശക്തമായ മൂലാർഥം ‘യജമാനന്മാർ’ എന്ന സന്ദർഭപദം കൂടി വഹിക്കുന്നു; മലയാളത്തിൽ ഈ വാക്യത്തിൽ ‘സേവിക്കുക’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: μισήσει
  choice: വെറുക്കുകയും ചെയ്യും
  rationale: ‘കുറച്ചു സ്നേഹിക്കുക’ എന്നു മൃദൂകരിക്കാതെ, സ്നേഹിക്കുക എന്ന വിരുദ്ധക്രിയയോടുള്ള ശക്തമായ വൈരുധ്യം അതേപടി നിലനിർത്തുന്നു.
- source_word: ἀγαπήσει
  choice: സ്നേഹിക്കുകയും ചെയ്യും
  rationale: ἀγαπάω എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥവും ‘വെറുക്കുക’ എന്നതിനോടുള്ള വൈരുധ്യവും സംരക്ഷിക്കുന്നു.
- source_word: ἑνὸς ἀνθέξεται
  choice: ഒരാളോടു പറ്റിച്ചേരുകയും
  rationale: ἀντέχομαι സൂചിപ്പിക്കുന്ന മുറുകെപ്പിടിക്കൽ, ചേർന്നുനിൽക്കൽ, വിശ്വസ്തമായ അഭിമുഖത എന്നിവയിൽ ദൃശ്യവും ബന്ധപരവുമായ ഭാവം ‘പറ്റിച്ചേരുക’ നിലനിർത്തുന്നു.
- source_word: καταφρονήσει
  choice: നിന്ദിക്കുകയും ചെയ്യും
  rationale: മറ്റെയാളെ വിലകുറച്ചു കാണുകയും അവജ്ഞയോടെ പെരുമാറുകയും ചെയ്യുന്നതിന്റെ ശക്തി സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: θεῷ
  choice: ദൈവത്തെ
  rationale: δουλεύειν എന്ന ക്രിയയുടെ ദത്തിവിഭക്തിയിലുള്ള കർമം മലയാളത്തിൽ നേരിട്ടുള്ള കർമരൂപത്തിൽ സ്വാഭാവികമായി വരുന്നു.
- source_word: μαμωνᾷ
  choice: മാമോനെ
  rationale: അരമായ കടംവാക്ക് നിലനിർത്തുന്നത് ദൈവത്തോടു മത്സരിക്കുന്ന മറ്റൊരു യജമാനനെപ്പോലെയുള്ള വ്യക്തിവൽക്കരണശക്തി സംരക്ഷിക്കുന്നു; അർഥവ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: ദൈവികമല്ലാത്ത സാമൂഹിക സന്ദർഭത്തിൽ κύριος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: യജമാനന്മാർ
  alternative: കർത്താക്കന്മാർ
  rationale: ബഹുവചനവും അടിമസേവനത്തിന്റെ ചിത്രവും ഇവിടെ ഉടമസ്ഥാധികാരമുള്ള യജമാനന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്. ‘കർത്താക്കന്മാർ’ ദൈവിക പദവിയുമായി അനാവശ്യമായ ആശയക്കുഴപ്പം സൃഷ്ടിക്കാം.
- issue: μαμωνᾶς എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മാമോൻ
  alternative: സമ്പത്ത് / പണം
  rationale: ദൈവവും മാമോനും മത്സരിക്കുന്ന സേവനവസ്തുക്കളായി അവതരിപ്പിക്കപ്പെടുന്നു. കടംവാക്ക് നിലനിർത്തുന്നത് മാമോനെ ഒരു എതിരാളിയായ യജമാനനെപ്പോലെ അവതരിപ്പിക്കുന്ന വാക്യത്തിന്റെ ശക്തി സംരക്ഷിക്കുന്നു; സാധാരണ അർഥങ്ങൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: μισέω എന്ന ക്രിയയുടെ ശക്തി
  choice: വെറുക്കുക
  alternative: കുറച്ചു സ്നേഹിക്കുക
  rationale: സെമിറ്റിക് താരതമ്യപ്രയോഗത്തിന്റെ സാധ്യത പൂർണമായി നിഷേധിക്കാതിരുന്നാലും, ഇവിടെ ‘സ്നേഹിക്കുക’ എന്നും ‘നിന്ദിക്കുക’ എന്നും ഉള്ള സമാന്തരവൈരുധ്യം ശക്തമായ നേരിട്ടുള്ള പരിഭാഷയെ പിന്തുണയ്ക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ രണ്ടു സമാന്തര വിരുദ്ധജോടികൾ ‘ഒന്നുകിൽ …; അല്ലെങ്കിൽ …’ എന്ന ഘടനയിൽ വ്യക്തമായി നിലനിർത്തി. ‘മാമോൻ’ എന്ന അപരിചിതമായ കടംവാക്കിന് പ്രധാനവാചകത്തിൽ [a] അടിക്കുറിപ്പുസൂചകം ചേർത്തു.
