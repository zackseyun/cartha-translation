id: MAT.6.8
reference: Matthew 6:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μὴ οὖν ὁμοιωθῆτε αὐτοῖς, οἶδεν γὰρ ⸀ὁ πατὴρ ὑμῶν ὧν χρείαν ἔχετε πρὸ τοῦ ὑμᾶς αἰτῆσαι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/008.yaml
  text: Therefore[a], do not become like them, for your Father knows what you need before you ask him.
translation:
  language: ml
  text: അതുകൊണ്ട്, അവരെപ്പോലെയാകരുത്[a]. നിങ്ങൾ അവനോടു ചോദിക്കുന്നതിനുമുമ്പുതന്നെ നിങ്ങൾക്ക് എന്താണ് ആവശ്യമെന്ന് നിങ്ങളുടെ പിതാവ് അറിയുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തോട് കൂടുതൽ അടുത്ത മറ്റൊരു പരിഭാഷ: “അവരോട് സദൃശരാക്കപ്പെടരുത്”; അല്ലെങ്കിൽ, “അവരെപ്പോലെയിരിക്കരുത്.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ οὖν
  choice: അതുകൊണ്ട്, ... അരുത്
  rationale: οὖν സൂചിപ്പിക്കുന്ന മുൻവാക്യത്തോടുള്ള നിഗമനബന്ധവും μή ഉൾപ്പെട്ട നിരോധനവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὁμοιωθῆτε
  choice: അവരെപ്പോലെയാകരുത്
  rationale: അയോറിസ്റ്റ് പാസീവ് സബ്ജങ്ക്ടീവിന്റെ നിരോധനാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; അവരുടെ മാതൃകയിലേക്കു ചേരുന്നതോ അവരോടു സാദൃശ്യമുള്ളവരാകുന്നതോ വിലക്കുന്നു.
- source_word: αὐτοῖς
  choice: അവരെ
  rationale: സമീപസന്ദർഭത്തിൽ മുമ്പ് പറഞ്ഞ ജാതികളിലേക്കാണ് സർവനാമം വിരൽചൂണ്ടുന്നത്; മൂലപാഠത്തിലെ ലളിതമായ സർവനാമപ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: οἶδεν
  choice: അറിയുന്നു
  rationale: രൂപത്തിൽ പൂർണകാലമായ οἶδα ഇവിടെ വർത്തമാനാർഥത്തിലാണ് പ്രവർത്തിക്കുന്നത്.
- source_word: ὁ πατὴρ ὑμῶν
  choice: നിങ്ങളുടെ പിതാവ്
  rationale: ഗ്രീക്കിൽ ഇവിടെ ‘സ്വർഗീയ’ എന്ന വിശേഷണം ഇല്ലാത്തതിനാൽ അത് ചേർക്കാതെ കൃത്യമായി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: ὧν χρείαν ἔχετε
  choice: നിങ്ങൾക്ക് എന്താണ് ആവശ്യമെന്ന്
  rationale: ആവശ്യത്തിന്റെ ഉള്ളടക്കം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: πρὸ τοῦ ὑμᾶς αἰτῆσαι αὐτόν
  choice: നിങ്ങൾ അവനോടു ചോദിക്കുന്നതിനുമുമ്പുതന്നെ
  rationale: πρὸ τοῦ + ഇൻഫിനിറ്റീവ് സൂചിപ്പിക്കുന്ന മുൻകാലബന്ധം ‘മുമ്പ്’ എന്നും അതിന്റെ ഊന്നൽ സ്വാഭാവികമായി ‘തന്നെ’ എന്നും നൽകുന്നു; αὐτόν വ്യക്തിപരമായ അഭ്യർഥനയുടെ ലക്ഷ്യമായി ‘അവനോടു’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
theological_decisions:
- issue: പ്രാർഥനയോടുള്ള ബന്ധത്തിൽ ദൈവത്തിന്റെ മുൻകൂട്ടിയുള്ള അറിവ്
  choice: ശിഷ്യർ ചോദിക്കുന്നതിനുമുമ്പേ അവരുടെ ആവശ്യങ്ങൾ പിതാവ് അറിയുന്നു എന്ന പ്രസ്താവന വിശദീകരണം ചേർക്കാതെ നേരിട്ട് നൽകുന്നു.
  alternative: പ്രാർഥന വിവരം അറിയിക്കാനല്ല, ബന്ധത്തിനുവേണ്ടിയാണെന്ന വ്യാഖ്യാനം ചേർക്കുക; അല്ലെങ്കിൽ സമഗ്രമായ ദൈവിക മുൻജ്ഞാനം പ്രത്യേകം ഊന്നുന്ന പദപ്രയോഗം ഉപയോഗിക്കുക.
  rationale: വാക്യം പിതാവിന്റെ മുൻകൂട്ടിയുള്ള അറിവും പ്രാർഥിക്കാനുള്ള ആഹ്വാനവും തമ്മിലുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷം സ്വയം നിലനിർത്തുന്നു; പരിഭാഷ അത് പരിഹരിക്കുകയോ പ്രത്യേക സിദ്ധാന്തത്തിലേക്കു ചായിക്കുകയോ ചെയ്യരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘അവരോട് സദൃശരാക്കപ്പെടരുത്’ എന്ന കൃത്രിമമായി തോന്നാവുന്ന പാസീവ് രൂപത്തിനു പകരം മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായ ‘അവരെപ്പോലെയാകരുത്’ ഉപയോഗിച്ചു; രൂപപരമായ മറ്റുവായന അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
