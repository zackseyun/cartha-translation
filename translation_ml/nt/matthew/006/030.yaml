id: MAT.6.30
reference: Matthew 6:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ δὲ τὸν χόρτον τοῦ ἀγροῦ σήμερον ὄντα καὶ αὔριον εἰς κλίβανον βαλλόμενον ὁ θεὸς οὕτως ἀμφιέννυσιν, οὐ πολλῷ μᾶλλον ὑμᾶς, ὀλιγόπιστοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/030.yaml
  text: But if God so clothes the grass of the field[a], which is here today and tomorrow is thrown into an oven, will he not much more clothe you[b], you of little faith?
translation:
  language: ml
  text: എന്നാൽ, ഇന്നുള്ളതും നാളെ അടുപ്പിലേക്കു[a] എറിയപ്പെടുന്നതുമായ വയലിലെ പുല്ലിനെ ദൈവം ഇങ്ങനെ ഉടുപ്പിക്കുന്നുവെങ്കിൽ, നിങ്ങളെ അവൻ അതിലും എത്രയോ അധികം ഉടുപ്പിക്കുകയില്ലയോ, അല്പവിശ്വാസികളേ[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘അടുപ്പ്’ അപ്പം ചുടാനുള്ള അടുപ്പാണ്; ഉണങ്ങിയ പുല്ലും വയൽസസ്യങ്ങളും അതിൽ ഇന്ധനമായി ഉപയോഗിക്കാമായിരുന്നു.
    reason: cultural_note
  - marker: b
    text: അഥവാ ‘വിശ്വാസം കുറഞ്ഞവരേ.’ ഗ്രീക്കിലെ ὀλιγόπιστοι അപര്യാപ്തമായ ആശ്രയത്തെ ശാസനാഭാവത്തോടെ ചൂണ്ടിക്കാണിക്കുന്ന നേരിട്ടുള്ള സംബോധനയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: χόρτον τοῦ ἀγροῦ
  choice: വയലിലെ പുല്ല്
  rationale: χόρτος പുല്ലിനെയോ പൊതുവായി ചെറുസസ്യങ്ങളെയോ സൂചിപ്പിക്കാം. ക്ഷണികമായ വയൽസസ്യങ്ങളുടെ ദൃശ്യത്തിൽ ‘വയലിലെ പുല്ല്’ സ്വാഭാവികവും അർഥം അനാവശ്യമായി ചുരുക്കാത്തതുമായ പ്രയോഗമാണ്.
- source_word: σήμερον ὄντα
  choice: ഇന്നുള്ളത്
  rationale: ὄντα എന്നതിന്റെ നിലനിൽപ്പുസൂചന ലളിതമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; ‘ജീവിച്ചിരിക്കുന്നത്’ എന്ന അധിക ജൈവസൂചന ചേർക്കുന്നില്ല.
- source_word: αὔριον εἰς κλίβανον βαλλόμενον
  choice: നാളെ അടുപ്പിലേക്കു എറിയപ്പെടുന്നത്
  rationale: κλίβανος അപ്പം ചുടാനുള്ള അടുപ്പിനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ചൂള’ എന്നു പറഞ്ഞാൽ വ്യാവസായികമോ ലോഹസംസ്കരണപരമോ ആയ ചിത്രം ഉണ്ടാകാം. βαλλόμενον എന്ന വർത്തമാനകാല നിഷ്ക്രിയ കൃദന്തത്തിന്റെ ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നിഷ്ക്രിയരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: οὕτως ἀμφιέννυσιν
  choice: ഇങ്ങനെ ഉടുപ്പിക്കുന്നു
  rationale: ἀμφιέννυμι എന്ന ക്രിയയുടെ വസ്ത്രധാരണരൂപകം നേരിട്ട് നിലനിർത്തുന്നു; ‘അലങ്കരിക്കുന്നു’ എന്നു വിവർത്തനം ചെയ്ത് അലങ്കാരഭാവം അമിതമാക്കുന്നില്ല.
- source_word: οὐ πολλῷ μᾶλλον
  choice: അതിലും എത്രയധികം ... ഇല്ല?
  rationale: ചെറിയതിൽനിന്ന് വലിയതിലേക്കുള്ള യുക്തിയും നിഷേധരൂപത്തിലുള്ള വാചാടോപചോദ്യവും മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὑμᾶς
  choice: നിങ്ങളെ
  rationale: ബഹുവചന ദ്വിതീയപുരുഷ സർവനാമത്തെ നേരിട്ട് നൽകുന്നു; അർഥവ്യക്തതയ്ക്കായി മുൻപുള്ള ‘ഉടുപ്പിക്കുന്നു’ എന്ന ക്രിയ ആവർത്തിക്കുന്നു.
- source_word: ὀλιγόπιστοι
  choice: അല്പവിശ്വാസികളേ
  rationale: ഇത് അപര്യാപ്തമായ വിശ്വാസത്തെ ശാസനാഭാവത്തോടെ ചൂണ്ടിക്കാണിക്കുന്ന ബഹുവചന സംബോധനയാണ്. സംബോധനരൂപവും വാക്കിന്റെ സംക്ഷിപ്തതയും നിലനിർത്തുന്നു.
- source_word: εἰ δὲ
  choice: എന്നാൽ ... എങ്കിൽ
  rationale: δέ സൂചിപ്പിക്കുന്ന മൃദുവായ വൈരുധ്യവും εἰ അവതരിപ്പിക്കുന്ന വ്യവസ്ഥയും സ്വാഭാവിക മലയാളവാക്യഘടനയിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ചെറിയതിൽനിന്ന് വലിയതിലേക്കുള്ള ദൈവിക പരിപാലനത്തിന്റെ വാദം
  choice: ക്ഷണികമായ വയൽപ്പുല്ലിനെ ദൈവം ഉടുപ്പിക്കുന്നുവെങ്കിൽ ശിഷ്യരെ അതിലും അധികം ഉടുപ്പിക്കുകയില്ലയോ എന്ന വാചാടോപചോദ്യമായി നിലനിർത്തി.
  alternative: ചോദ്യത്തെ ‘അവൻ തീർച്ചയായും നിങ്ങളെ ഉടുപ്പിക്കും’ എന്ന പ്രസ്താവനയായി മാറ്റുക.
  rationale: ഗ്രീക്കിലെ οὐ കൊണ്ടുള്ള ചോദ്യം അനുകൂലമായ ഉത്തരം പ്രതീക്ഷിക്കുന്നുവെങ്കിലും, അതിനെ പ്രസ്താവനയാക്കാതെ ചോദ്യരൂപം നിലനിർത്തുന്നത് യേശുവിന്റെ ശാസനയുടെയും പ്രോത്സാഹനത്തിന്റെയും സംയുക്തബലം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘ഉടുപ്പിക്കുന്നു’ എന്ന രൂപകം ആവർത്തിച്ച് മൂലത്തിലെ ബന്ധം നിലനിർത്തി. മുഖ്യവാചകത്തിലെ അടിക്കുറിപ്പുസൂചകങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങളോടു ചേർത്തു; ലഭിച്ച ഇംഗ്ലീഷ് പാളിയിലെ സൂചക-വിവരണ ക്രമക്കേട് തിരുത്തി.
