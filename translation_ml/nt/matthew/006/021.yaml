id: MAT.6.21
reference: Matthew 6:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅπου γάρ ἐστιν ὁ θησαυρός ⸀σου, ἐκεῖ ἔσται καὶ ἡ καρδία ⸁σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/021.yaml
  text: For where your treasure is[a], there your heart will be also.
translation:
  language: ml
  text: എന്തെന്നാൽ നിന്റെ നിക്ഷേപം എവിടെയാണോ, അവിടെ നിന്റെ ഹൃദയവും ആയിരിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നിന്റെ നിക്ഷേപം എവിടെയാണോ, അവിടെ നിന്റെ ഹൃദയവും ഉണ്ട്.” ചില പരിഭാഷകൾ ഇത് കാലാതീതമായ പൊതുസത്യമായി വർത്തമാനകാലത്തിൽ നൽകുന്നു; എന്നാൽ ഗ്രീക്കിലെ ക്രിയ ഭാവികാലത്തിലാണ് (“ആയിരിക്കും”).'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπου
  choice: എവിടെയാണോ
  rationale: സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന ആപേക്ഷിക ഉപവാക്യം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുകയും ἐκεῖയോടുള്ള ‘എവിടെ… അവിടെ’ സമാന്തരത നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: γάρ
  choice: എന്തെന്നാൽ
  rationale: മുമ്പുള്ള നിക്ഷേപത്തെക്കുറിച്ചുള്ള ഉപദേശത്തിന് ഈ വാക്യം നൽകുന്ന വിശദീകരണബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: θησαυρός
  choice: നിക്ഷേപം
  rationale: സമ്പാദിച്ചുവെച്ച വിലപ്പെട്ട സമ്പത്തും രൂപകാത്മകമായി ഒരാൾ ഏറ്റവും വിലമതിക്കുന്നതും സൂചിപ്പിക്കാൻ സന്ദർഭത്തിൽ സ്വാഭാവികമായ പദം; ‘ഖജനാവ്’ എന്നത് ഇവിടെ സ്ഥലമോ ഭണ്ഡാരമോ എന്ന അർഥത്തിലേക്ക് വഴുതാം.
- source_word: σου
  choice: നിന്റെ
  rationale: നിക്ഷേപത്തോടും ഹൃദയത്തോടും ചേർന്ന ഏകവചന ദ്വിതീയപുരുഷ ഉടമസ്ഥത കൃത്യമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐκεῖ
  choice: അവിടെ
  rationale: ὅπουയുമായി ചേർന്ന ‘എവിടെ… അവിടെ’ എന്ന സംക്ഷിപ്ത സ്ഥലസംബന്ധ സമാന്തരത സംരക്ഷിക്കുന്നു.
- source_word: ἔσται
  choice: ആയിരിക്കും
  rationale: εἰμίയുടെ ഭാവികാലരൂപം വ്യക്തമായി നിലനിർത്തുന്നു; പൊതുസത്യമായി വർത്തമാനകാലത്തിലേക്ക് മിനുക്കുന്നില്ല.
- source_word: καρδία
  choice: ഹൃദയം
  rationale: ആഗ്രഹം, വിശ്വസ്തത, ആന്തരിക ദിശാബോധം എന്നിവ ഉൾക്കൊള്ളുന്ന ഉറവിടപദത്തിന്റെ വിശാല അർഥപരിധി നിലനിർത്തുന്ന സ്ഥാപിതമായ തർജമ.
- source_word: καὶ
  choice: -വും
  rationale: നിക്ഷേപത്തോടൊപ്പം ഹൃദയത്തെയും ബന്ധിപ്പിക്കുന്ന കൂട്ടിച്ചേർക്കൽ ഊന്നൽ മലയാളത്തിലെ സ്വാഭാവിക അനുബന്ധപ്രത്യയംകൊണ്ട് പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ജ്ഞാനവാക്യസദൃശമായ പ്രസ്താവനയിലെ ἔσταιയുടെ കാലസൂചന
  choice: ഭാവികാലം വ്യക്തമായി നിലനിർത്തി ‘ആയിരിക്കും’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: കാലാതീതമായ പൊതുസത്യം സൂചിപ്പിക്കാൻ ‘ആണ്’ എന്നു വർത്തമാനകാലത്തിൽ പരിഭാഷപ്പെടുത്തുക.
  rationale: ഗ്രീക്കിൽ ഭാവികാലക്രിയയാണ് ഉള്ളത്. അത് നിലനിർത്തുന്നത് നിക്ഷേപവും ഹൃദയവും തമ്മിലുള്ള സ്ഥിരബന്ധം മാത്രമല്ല, ഹൃദയം നിക്ഷേപമുള്ളിടത്തേക്ക് ചായുന്ന ദിശാത്മകതയും തുറന്നുവയ്ക്കുന്നു; അതേസമയം ഈ സൂചനയെക്കാൾ അപ്പുറം ഒരു പ്രത്യേക ഉപദേശസമ്പ്രദായം അടിച്ചേൽപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘എവിടെയാണോ… അവിടെ’ എന്ന ഘടന ഗ്രീക്കിലെ സമാന്തരത നിലനിർത്തുന്നു. ഏകവചന അഭിസംബോധനയ്ക്കായി ‘നിന്റെ’ ഉപയോഗിച്ചു; ‘നിക്ഷേപം’ സന്ദർഭത്തിലെ വസ്തുവാചകവും രൂപകാത്മകവുമായ ശക്തി ഒരുമിച്ച് വഹിക്കുന്നു.
