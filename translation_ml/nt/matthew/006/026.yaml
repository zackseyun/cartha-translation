id: MAT.6.26
reference: Matthew 6:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐμβλέψατε εἰς τὰ πετεινὰ τοῦ οὐρανοῦ ὅτι οὐ σπείρουσιν οὐδὲ θερίζουσιν οὐδὲ συνάγουσιν εἰς ἀποθήκας, καὶ ὁ πατὴρ ὑμῶν ὁ οὐράνιος τρέφει αὐτά· οὐχ ὑμεῖς μᾶλλον διαφέρετε αὐτῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/026.yaml
  text: Look at the birds of the sky[a], that they do not sow or reap or gather into barns, and your heavenly Father feeds them[b]. Are you not of much more value than they are?
translation:
  language: ml
  text: 'ആകാശത്തിലെ പക്ഷികളെ[a] നോക്കുക: അവ വിതയ്ക്കുന്നില്ല, കൊയ്യുന്നില്ല, കളപ്പുരകളിൽ ശേഖരിക്കുന്നുമില്ല; എന്നിട്ടും നിങ്ങളുടെ സ്വർഗീയ പിതാവ് അവയ്ക്ക് ആഹാരം നൽകുന്നു. അവയെക്കാൾ നിങ്ങൾ എത്രയോ വിലയേറിയവരല്ലയോ?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘ആകാശത്തിന്റെ പക്ഷികൾ’; പരമ്പരാഗതമായി ‘വായുവിലെ പക്ഷികൾ’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ ‘അവയെക്കാൾ നിങ്ങൾ ഏറെ പ്രാധാന്യമുള്ളവരല്ലയോ?’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβλέψατε
  choice: നോക്കുക
  rationale: ദൃഷ്ടി കേന്ദ്രീകരിക്കാൻ ആഹ്വാനം ചെയ്യുന്ന ആജ്ഞാരൂപം സ്വാഭാവികവും നേരിട്ടുമായി പകർന്നു.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: ആകാശത്തിലെ പക്ഷികൾ
  rationale: കാണാവുന്ന ആകാശത്ത് പറക്കുന്ന പക്ഷികളെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; ‘ആകാശത്തിലെ’ എന്നത് τοῦ οὐρανοῦ എന്നതിന്റെ സ്വാഭാവികമായ മലയാളരൂപമാണ്.
- source_word: ὅτι
  choice: ഉദ്ധരണചിഹ്നമായ ദ്വിബിന്ദുവിലൂടെ തുടർന്നുള്ള നിരീക്ഷണം അവതരിപ്പിച്ചു
  rationale: 'ὅτι ഇവിടെ പക്ഷികളെ നോക്കേണ്ടതിന്റെ വിശദീകരണം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘നോക്കുക: അവ...’ എന്ന ഘടന ഗ്രീക്കിലെ ബന്ധം അമിതമായി വ്യാഖ്യാനിക്കാതെ വ്യക്തമായി നൽകുന്നു.'
- source_word: σπείρουσιν ... θερίζουσιν ... συνάγουσιν εἰς ἀποθήκας
  choice: വിതയ്ക്കുന്നില്ല, കൊയ്യുന്നില്ല, കളപ്പുരകളിൽ ശേഖരിക്കുന്നുമില്ല
  rationale: മൂന്നു കാർഷിക ക്രിയകളുടെയും സമാന്തരതയും ദൃശ്യബിംബവും നിലനിർത്തുന്നു; ἀποθήκας കാർഷിക വിളകൾ സൂക്ഷിക്കുന്ന കളപ്പുരകളായി പകർന്നു.
- source_word: καὶ
  choice: എന്നിട്ടും
  rationale: പക്ഷികൾ ഈ കാർഷിക പ്രവർത്തനങ്ങൾ ചെയ്യാത്തതും പിതാവ് അവയെ പോഷിപ്പിക്കുന്നതും തമ്മിലുള്ള സന്ദർഭസഹജമായ വിരുദ്ധബന്ധം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: നിങ്ങളുടെ സ്വർഗീയ പിതാവ്
  rationale: ബന്ധസൂചകമായ ‘പിതാവ്’ എന്ന പദവും οὐράνιος എന്ന വിശേഷണവും സംക്ഷിപ്തമായും പരിചിതമായും സംരക്ഷിക്കുന്നു.
- source_word: τρέφει
  choice: ആഹാരം നൽകുന്നു
  rationale: ഈ സന്ദർഭത്തിൽ പക്ഷികൾക്ക് ഭക്ഷണം നൽകുക എന്ന നേരിട്ടുള്ള അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: οὐχ ὑμεῖς μᾶλλον διαφέρετε αὐτῶν;
  choice: അവയെക്കാൾ നിങ്ങൾ എത്രയോ വിലയേറിയവരല്ലയോ?
  rationale: അനുകൂല ഉത്തരമാണ് പ്രതീക്ഷിക്കുന്ന വാചാടോപചോദ്യത്തിന്റെ രൂപവും μᾶλλον സൂചിപ്പിക്കുന്ന ശക്തമായ താരതമ്യവും διαφέρωയുടെ മൂല്യസൂചനയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ വാദത്തിൽ മനുഷ്യർക്കും പക്ഷികൾക്കും ഇടയിലുള്ള താരതമ്യമൂല്യം
  choice: ശ്രോതാക്കൾ പക്ഷികളെക്കാൾ ഏറെ വിലയുള്ളവരാണെന്ന് വാക്യം പറയുന്നതായി വിവർത്തനം ചെയ്തു; അതിന്റെ ദൈവശാസ്ത്രപരമായ കാരണം വിശദീകരിച്ചില്ല.
  alternative: ദൈവത്തിന്റെ സ്വരൂപത്തിൽ സൃഷ്ടിക്കപ്പെട്ടതിനാലോ ഉടമ്പടിബന്ധം മൂലമോ മനുഷ്യർ കൂടുതൽ വിലയുള്ളവരാണെന്ന് വിവർത്തനത്തിൽ വ്യക്തമാക്കുക.
  rationale: വാക്യം താരതമ്യമൂല്യം ഉറപ്പിക്കുന്നു, എന്നാൽ അതിന്റെ അടിസ്ഥാനമായി ഒരു പ്രത്യേക ദൈവശാസ്ത്രകാരണം ഇവിടെ പ്രസ്താവിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. കാർഷിക ദൃശ്യബിംബവും വാചാടോപചോദ്യത്തിന്റെ ഊന്നലും നിലനിർത്തി; സാധാരണ വായനയിൽ അസ്വാഭാവികമാകുന്ന പദാനുപദഘടന ഒഴിവാക്കി.
