id: MAT.6.9
reference: Matthew 6:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οὕτως οὖν προσεύχεσθε ὑμεῖς· Πάτερ ἡμῶν ὁ ἐν τοῖς οὐρανοῖς· ἁγιασθήτω τὸ ὄνομά σου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/009.yaml
  text: 'Therefore[a], you should pray like this: Our Father in the heavens, may your name be treated as holy[b],'
translation:
  language: ml
  text: 'അതുകൊണ്ട് നിങ്ങൾ ഇങ്ങനെ പ്രാർഥിക്കുക: “സ്വർഗങ്ങളിലുള്ള ഞങ്ങളുടെ പിതാവേ[a], അങ്ങയുടെ നാമം വിശുദ്ധമായി ആദരിക്കപ്പെടട്ടെ[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പരമ്പരാഗതമായി, “സ്വർഗത്തിലുള്ള ഞങ്ങളുടെ പിതാവേ.” ഗ്രീക്കിൽ “സ്വർഗങ്ങളിൽ” എന്ന ബഹുവചനമാണ്.
    reason: lexical_alternative
  - marker: b
    text: പരമ്പരാഗതമായി, “അങ്ങയുടെ നാമം വിശുദ്ധീകരിക്കപ്പെടട്ടെ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὕτως
  choice: ഇങ്ങനെ
  rationale: പ്രാർഥിക്കേണ്ട രീതിയെയോ മാതൃകയെയോ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻപത്തെ ഉപദേശത്തിൽനിന്നുള്ള നിഗമനബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: προσεύχεσθε ὑμεῖς
  choice: നിങ്ങൾ ... പ്രാർഥിക്കുക
  rationale: ബഹുവചന ആജ്ഞയുടെ നിർദേശസ്വഭാവവും പ്രത്യേകം ചേർത്ത ὑμεῖς എന്ന സർവനാമത്തിന്റെ ഊന്നലും വായനാസൗകര്യത്തോടെ നിലനിർത്തുന്നു.
- source_word: Πάτερ ἡμῶν
  choice: ഞങ്ങളുടെ പിതാവേ
  rationale: വിളിവിഭക്തിയിലുള്ള നേരിട്ടുള്ള അഭിസംബോധനയും സമൂഹപരമായ ബഹുവചന ഉടമസ്ഥതയും സംരക്ഷിക്കുന്നു.
- source_word: ὁ ἐν τοῖς οὐρανοῖς
  choice: സ്വർഗങ്ങളിലുള്ള
  rationale: ഗ്രീക്കിലെ ബഹുവചനമായ τοῖς οὐρανοῖς സംരക്ഷിക്കുകയും ὁ എന്നതിന്റെ ബന്ധവാചകശക്തി മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ἁγιασθήτω
  choice: വിശുദ്ധമായി ആദരിക്കപ്പെടട്ടെ
  rationale: ദൈവനാമം വിശുദ്ധമെന്നു കണക്കാക്കി ആദരിക്കപ്പെടണമെന്ന അപേക്ഷാഭാവം ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; passive petitionary force നിലനിർത്തുന്നു.
- source_word: τὸ ὄνομά σου
  choice: അങ്ങയുടെ നാമം
  rationale: മൂലത്തിലെ ‘നാമം’ എന്ന പദം നിലനിർത്തുന്നു; ദൈവത്തോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയ്ക്ക് മാന്യവും ആധുനികവുമായ മലയാളരൂപമായി ‘അങ്ങയുടെ’ ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: കർത്താവിന്റെ പ്രാർഥനയുടെ ആരംഭത്തിൽ ദൈവത്തിന്റെ പിതൃത്വവും അതീതത്വവും അവതരിപ്പിക്കൽ
  choice: സ്വർഗങ്ങളിലുള്ള ഞങ്ങളുടെ പിതാവേ
  alternative: സ്വർഗത്തിലുള്ള ഞങ്ങളുടെ പിതാവേ; ഞങ്ങളുടെ സ്വർഗീയപിതാവേ
  rationale: മൂലപാഠത്തിലെ ‘സ്വർഗങ്ങൾ’ എന്ന ബഹുവചനം സംരക്ഷിക്കുന്നു. ‘സ്വർഗീയപിതാവ്’ എന്ന വിശേഷണരൂപം മൂലത്തിലെ സ്ഥലസൂചനയെ വ്യാഖ്യാനിച്ച് മാറ്റുന്നതിനാൽ ഒഴിവാക്കി.
- issue: ἁγιασθήτω എന്ന അപേക്ഷയുടെ അവതരണം
  choice: അങ്ങയുടെ നാമം വിശുദ്ധമായി ആദരിക്കപ്പെടട്ടെ
  alternative: അങ്ങയുടെ നാമം വിശുദ്ധീകരിക്കപ്പെടട്ടെ
  rationale: ദൈവനാമം മുമ്പ് അശുദ്ധമായിരുന്നു എന്ന ധാരണ വരുത്താതെ, അത് വിശുദ്ധമെന്നു അംഗീകരിച്ച് ആദരിക്കപ്പെടണമെന്ന അപേക്ഷ വ്യക്തമാക്കുന്നു. അതേസമയം മൂലത്തിലെ passive അപേക്ഷാഭാവം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ പ്രാർഥനാഭാഷയാണ് ഉപയോഗിച്ചത്. ‘പ്രാർഥിക്കുക’ എന്ന രൂപം വ്യക്തമായ നിർദേശം നൽകുന്നു; ‘അങ്ങയുടെ’ എന്ന ആദരസൂചക രൂപം ദൈവത്തോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയിൽ മലയാളത്തിൽ സ്വാഭാവികമാണ്. തുടർന്നുവരുന്ന പ്രാർഥനയുടെ ഭാഗമാണെന്നതിനാൽ അവസാന ഉദ്ധരണിചിഹ്നം ഈ വാക്യത്തിൽ അടച്ചിട്ടില്ല.
