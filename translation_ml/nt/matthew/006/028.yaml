id: MAT.6.28
reference: Matthew 6:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ περὶ ἐνδύματος τί μεριμνᾶτε; καταμάθετε τὰ κρίνα τοῦ ἀγροῦ πῶς ⸂αὐξάνουσιν· οὐ κοπιῶσιν οὐδὲ νήθουσιν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/028.yaml
  text: 'And why are you anxious about clothing? Consider the lilies of the field[a], how they grow: they do not labor[c][b], nor do they spin.'
translation:
  language: ml
  text: വസ്ത്രത്തെക്കുറിച്ച് നിങ്ങൾ എന്തിന് ഉത്കണ്ഠപ്പെടുന്നു? വയലിലെ ലില്ലിപ്പൂക്കൾ എങ്ങനെ വളരുന്നു എന്നു ശ്രദ്ധിച്ചുനോക്കൂ.[a] അവ അധ്വാനിക്കുന്നില്ല; നൂൽ നൂൽക്കുന്നതുമില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ലില്ലിപ്പൂക്കൾ’ എന്നത് ഇവിടെ പൊതുവായി ‘കാട്ടുപൂക്കൾ’ എന്നും മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ ἐνδύματος
  choice: വസ്ത്രത്തെക്കുറിച്ച്
  rationale: ἔνδυμα ഇവിടെ ഒരു പ്രത്യേക ഉടുപ്പിനെയല്ല, പൊതുവായി ധരിക്കാനുള്ള വസ്ത്രത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: τί μεριμνᾶτε
  choice: നിങ്ങൾ എന്തിന് ഉത്കണ്ഠപ്പെടുന്നു?
  rationale: μεριμνάω ഈ സന്ദർഭത്തിൽ സാധാരണ ചിന്തയേക്കാൾ ഉത്കണ്ഠാഭരിതമായ കരുതലിനെ സൂചിപ്പിക്കുന്നു; τί ഇവിടെ സ്വാഭാവികമായി ‘എന്തിന്’ എന്നു വരുന്നു.
- source_word: καταμάθετε
  choice: ശ്രദ്ധിച്ചുനോക്കൂ
  rationale: ഈ ആജ്ഞാരൂപം സൂക്ഷ്മമായി നിരീക്ഷിച്ച് മനസ്സിലാക്കുക എന്ന ഭാവം വഹിക്കുന്നു; ആ അർഥം സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὰ κρίνα τοῦ ἀγροῦ
  choice: വയലിലെ ലില്ലിപ്പൂക്കൾ
  rationale: κρίνα എന്നതിന്റെ നേരിട്ടുള്ള അർഥം ‘ലില്ലിപ്പൂക്കൾ’ ആണ്; τοῦ ἀγροῦ അവ വയലിൽ സ്വാഭാവികമായി വളരുന്നവയാണെന്ന് വ്യക്തമാക്കുന്നു. വിശാലമായ ‘കാട്ടുപൂക്കൾ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: πῶς αὐξάνουσιν
  choice: എങ്ങനെ വളരുന്നു
  rationale: αὐξάνω ഇവിടെ സസ്യങ്ങളുടെ സ്വാഭാവിക വളർച്ചയെ സൂചിപ്പിക്കുന്നു.
- source_word: οὐ κοπιῶσιν
  choice: അവ അധ്വാനിക്കുന്നില്ല
  rationale: κοπιάω കഠിനമായി പണിയെടുക്കുക, അധ്വാനിക്കുക എന്ന അർഥം നൽകുന്നു.
- source_word: οὐδὲ νήθουσιν
  choice: നൂൽ നൂൽക്കുന്നതുമില്ല
  rationale: νήθω നാരിൽനിന്ന് നൂൽ ഉണ്ടാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘നൂൽക്കുക’ എന്ന ക്രിയയ്ക്ക് വസ്തു ചേർത്തത് ആധുനിക വായനക്കാർക്ക് അർഥം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ ഉപദേശത്തിൽ μεριμνάω എന്ന പദത്തിന്റെ ഭാവം
  choice: ഉത്കണ്ഠപ്പെടുന്നു
  alternative: ആകുലപ്പെടുന്നു / വിഷമിക്കുന്നു
  rationale: ഇവിടെ കുറ്റപ്പെടുത്തുന്നത് ഉത്തരവാദിത്വമുള്ള കരുതലിനെയല്ല, ഭൗതിക ആവശ്യങ്ങളെച്ചൊല്ലിയുള്ള ഉത്കണ്ഠയെയാണ്. അതിനാൽ അർഥം അനാവശ്യമായി വിപുലീകരിക്കാതെ മാനസിക അസ്വസ്ഥതയുടെ ഭാവം നിലനിർത്തുന്നു.
- issue: κρίνα എന്ന സസ്യനാമത്തിന്റെ വ്യാപ്തി
  choice: ലില്ലിപ്പൂക്കൾ
  alternative: കാട്ടുപൂക്കൾ
  rationale: പ്രാഥമിക നിഘണ്ടു അർഥം ‘ലില്ലികൾ’ ആയതിനാൽ മുഖ്യപാഠത്തിൽ അതു നിലനിർത്തുന്നു; കൃത്യമായ സസ്യവർഗം അനിശ്ചിതമായിരിക്കാമെന്നതിനാൽ വിശാലമായ വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഗ്രീക്കിലെ ചോദ്യം, ആജ്ഞ, തുടർന്ന് വരുന്ന സമാന്തര നിഷേധങ്ങൾ എന്നിവ സ്വാഭാവിക മലയാളവാക്യക്രമത്തിൽ നിലനിർത്തിയിരിക്കുന്നു.
