id: MAT.6.13
reference: Matthew 6:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ μὴ εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν, ἀλλὰ ῥῦσαι ἡμᾶς ἀπὸ τοῦ ⸀πονηροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/013.yaml
  text: And do not lead us into temptation[b][a], but deliver us from evil.
translation:
  language: ml
  text: ഞങ്ങളെ പ്രലോഭനത്തിലേക്കു നയിക്കരുതേ[a]; ദുഷ്ടനിൽനിന്നു ഞങ്ങളെ വിടുവിക്കണമേ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘പരീക്ഷണത്തിലേക്കു’ അല്ലെങ്കിൽ ‘കഠിനപരീക്ഷയിലേക്കു.’ ഗ്രീക്ക് പദം പാപത്തിലേക്കുള്ള പ്രലോഭനത്തെയോ ഒരാളെ പരീക്ഷിക്കുന്ന അനുഭവത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘തിന്മയിൽനിന്നു.’ ഗ്രീക്ക് പ്രയോഗം വ്യക്തിപരമായി ‘ദുഷ്ടൻ’ എന്നോ അവ്യക്തിപരമായി ‘തിന്മ’ എന്നോ മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ εἰσενέγκῃς
  choice: നയിക്കരുതേ
  rationale: μή ചേർന്ന aorist subjunctive ഇവിടെ പ്രാർഥനയിലെ നിഷേധാത്മക അപേക്ഷയാണ്. ‘നയിക്കരുതേ’ എന്നത് അപേക്ഷയുടെ നേരിട്ടുള്ള രൂപം നിലനിർത്തുന്നു; ‘നയിക്കപ്പെടാൻ അനുവദിക്കരുതേ’ എന്ന വ്യാഖ്യാനപരമായ വിപുലീകരണം ഒഴിവാക്കുന്നു.
- source_word: πειρασμόν
  choice: പ്രലോഭനം
  rationale: πειρασμός പാപത്തിലേക്കുള്ള പ്രലോഭനത്തെയും പരീക്ഷണത്തെയോ കഠിനപരീക്ഷയെയോ സൂചിപ്പിക്കാം. മുഖ്യപാഠത്തിൽ സ്വാഭാവികവും പരിചിതവുമായ ‘പ്രലോഭനം’ സ്വീകരിച്ച് വിശാലമായ അർഥപരിധി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ῥῦσαι
  choice: വിടുവിക്കണമേ
  rationale: ῥῦσαι സജീവമായ രക്ഷയെയോ മോചനത്തെയോ അഭ്യർഥിക്കുന്നു. ‘വിടുവിക്കണമേ’ പ്രാർഥനാഭാഷയിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: τοῦ πονηροῦ
  choice: ദുഷ്ടനിൽനിന്നു
  rationale: ആർട്ടിക്കിളോടുകൂടിയ ഈ genitive രൂപം പുല്ലിംഗമായി ‘ദുഷ്ടൻ’ എന്നും നപുംസകലിംഗമായി ‘തിന്മ’ എന്നും ഗ്രഹിക്കാം. വ്യക്തിപരമായ വായന മുഖ്യപാഠത്തിൽ സ്വീകരിക്കുകയും യഥാർഥമായ വ്യാകരണ-അർഥസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: τοῦ πονηροῦ എന്നതിന്റെ വ്യക്തിപരമോ അവ്യക്തിപരമോ ആയ അർഥം
  choice: ദുഷ്ടനിൽനിന്നു
  alternative: തിന്മയിൽനിന്നു
  rationale: ഗ്രീക്ക് രൂപം ‘ദുഷ്ടൻ’ എന്നും ‘തിന്മ’ എന്നും സ്വാഭാവികമായി വായിക്കാവുന്നതാണ്. പ്രലോഭനത്തോടുള്ള ബന്ധത്തിൽ വ്യക്തിപരമായ എതിരാളിയെ സൂചിപ്പിക്കുന്ന വായന ശക്തമായതിനാൽ അത് മുഖ്യപാഠത്തിൽ സ്വീകരിക്കുന്നു; എന്നാൽ സന്ദിഗ്ധത തീർപ്പാക്കാതെ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ പ്രാർഥനയ്ക്കു യോജിച്ച ഗൗരവമുള്ള ശൈലി. ‘രുതേ/ണമേ’ രൂപങ്ങൾ അപേക്ഷയുടെ ഭാവം നിലനിർത്തുന്നു. ഗ്രീക്കിലെ καί മലയാളത്തിലെ ഒറ്റപ്പെട്ട വാക്യത്തിൽ നിർബന്ധമായി ‘കൂടാതെ’ എന്നു ചേർക്കാതെ, മുൻസന്ദർഭത്തോടു ചേരുന്ന പ്രാർഥനാക്രമം വാക്യഘടനയിലൂടെ നിലനിർത്തിയിരിക്കുന്നു.
