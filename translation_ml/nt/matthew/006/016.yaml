revisions:
- from: 'നിങ്ങൾ ഉപവസിക്കുമ്പോഴെല്ലാം, കപടഭക്തരെപ്പോലെ മ്ലാനമുഖരാകരുത്. തങ്ങൾ ഉപവസിക്കുന്നതായി ആളുകൾക്കു തോന്നേണ്ടതിന് അവർ തങ്ങളുടെ മുഖം വിരൂപമാക്കുന്നു. സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: അവർ തങ്ങളുടെ പ്രതിഫലം പൂർണമായി വാങ്ങിക്കഴിഞ്ഞു.'
  to: 'നിങ്ങൾ ഉപവസിക്കുമ്പോഴെല്ലാം, കപടന്മാരെപ്പോലെ വിഷാദഭാവമുള്ളവരാകരുത്. അവർ ഉപവസിക്കുന്നവരാണെന്ന് ആളുകൾക്കു കാണപ്പെടേണ്ടതിന് അവർ തങ്ങളുടെ മുഖങ്ങൾ വിരൂപമാക്കുന്നു. സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: അവർ തങ്ങളുടെ പ്രതിഫലം പൂർണമായി വാങ്ങിക്കഴിഞ്ഞു.'
