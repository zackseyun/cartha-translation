id: MAT.6.16
reference: Matthew 6:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὅταν δὲ νηστεύητε, μὴ γίνεσθε ⸀ὡς οἱ ὑποκριταὶ σκυθρωποί, ἀφανίζουσιν γὰρ τὰ πρόσωπα αὐτῶν ὅπως φανῶσιν τοῖς ἀνθρώποις νηστεύοντες· ἀμὴν λέγω ⸀ὑμῖν, ἀπέχουσιν τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/016.yaml
  text: And whenever you fast[a], do not become gloomy like the hypocrites, for they disfigure their faces so that they may appear to people to be fasting. Truly I say to you, they have received their reward in full.
translation:
  language: ml
  text: 'നിങ്ങൾ ഉപവസിക്കുമ്പോഴെല്ലാം, കപടന്മാരെപ്പോലെ വിഷാദഭാവമുള്ളവരാകരുത്. അവർ ഉപവസിക്കുന്നവരാണെന്ന് ആളുകൾക്കു കാണപ്പെടേണ്ടതിന് അവർ തങ്ങളുടെ മുഖങ്ങൾ വിരൂപമാക്കുന്നു. സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: അവർ തങ്ങളുടെ പ്രതിഫലം പൂർണമായി വാങ്ങിക്കഴിഞ്ഞു.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅταν δὲ νηστεύητε
  choice: നിങ്ങൾ ഉപവസിക്കുമ്പോഴെല്ലാം
  rationale: ὅταν എന്ന അനിശ്ചിതവും ആവർത്തനസ്വഭാവമുള്ളതുമായ കാലപ്രയോഗം ‘എപ്പോഴെല്ലാം’ എന്ന അർഥത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; δέ-യുടെ ബന്ധകസ്വഭാവം മലയാളവാക്യപ്രവാഹത്തിൽ പ്രത്യേകം പദമാക്കാതെ നിലനിർത്തുന്നു.
- source_word: μὴ γίνεσθε ... σκυθρωποί
  choice: മ്ലാനമുഖരാകരുത്
  rationale: γίνεσθε-യിലെ ഒരു ഭാവം കൈക്കൊള്ളുന്ന അർഥവും σκυθρωποί സൂചിപ്പിക്കുന്ന ദുഃഖഭാവമുള്ള മുഖപ്രകടനവും ഒരുമിച്ച് സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: ὡς οἱ ὑποκριταί
  choice: കപടഭക്തരെപ്പോലെ
  rationale: മതഭക്തി പ്രദർശിപ്പിക്കുന്ന ഈ സന്ദർഭത്തിൽ ὑποκριταί എന്നതിന്റെ കപടനടിപ്പിനെ വ്യക്തമായി അറിയിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: ἀφανίζουσιν ... τὰ πρόσωπα αὐτῶν
  choice: അവർ തങ്ങളുടെ മുഖം വിരൂപമാക്കുന്നു
  rationale: മുഖത്തിന്റെ രൂപഭാവം മനപ്പൂർവം മാറ്റുകയോ മോശമാക്കുകയോ ചെയ്യുന്നതെന്ന സന്ദർഭാർഥം നിലനിർത്തുന്നു; ‘മുഖം’ എന്ന മൂർത്തമായ ദൃശ്യം സംരക്ഷിക്കുന്നു.
- source_word: ὅπως φανῶσιν τοῖς ἀνθρώποις νηστεύοντες
  choice: തങ്ങൾ ഉപവസിക്കുന്നതായി ആളുകൾക്കു തോന്നേണ്ടതിന്
  rationale: ὅπως-ന്റെ ഉദ്ദേശ്യാർഥവും φανῶσιν-ന്റെ ‘കാണപ്പെടുക/തോന്നുക’ എന്ന അർഥവും നൽകുന്നു. ἄνθρωποι ഇവിടെ പൊതുവായി മനുഷ്യരെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ആളുകൾ’ സ്വാഭാവികമാണ്.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: യേശുവിന്റെ ഗൗരവപൂർണവും അധികാരസൂചകവുമായ പ്രഖ്യാപനസൂത്രം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἀπέχουσιν τὸν μισθὸν αὐτῶν
  choice: അവർ തങ്ങളുടെ പ്രതിഫലം പൂർണമായി വാങ്ങിക്കഴിഞ്ഞു
  rationale: ἀπέχω എന്ന വ്യാപാരപരമായ പ്രയോഗത്തിലെ ‘മുഴുവൻ ലഭിച്ചു; ഇനി അവകാശപ്പെടാനില്ല’ എന്ന പൂർത്തീകരണഭാവം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: τοῖς ἀνθρώποις എന്നതിന്റെ പ്രതിനിധാനപരമായ അർഥം
  choice: ആളുകൾക്ക്
  alternative: മനുഷ്യർക്ക് / മറ്റുള്ളവർക്ക്
  rationale: ഇവിടെ ἄνθρωποι ലിംഗഭേദമില്ലാതെ പൊതുവായി മനുഷ്യരെ സൂചിപ്പിക്കുന്നു. ‘ആളുകൾക്ക്’ ആ ഉൾക്കൊള്ളുന്ന അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- issue: ἀπέχουσιν τὸν μισθὸν αὐτῶν എന്ന പ്രയോഗത്തിന്റെ പൂർണത
  choice: പ്രതിഫലം പൂർണമായി വാങ്ങിക്കഴിഞ്ഞു
  alternative: പ്രതിഫലം ലഭിച്ചിരിക്കുന്നു
  rationale: മനുഷ്യരിൽനിന്നുള്ള അംഗീകാരമാണ് അവർക്കു ലഭിച്ച മുഴുവൻ പ്രതിഫലമെന്നും അതിനപ്പുറം മറ്റൊരു പ്രതിഫലത്തിനുള്ള അവകാശം ശേഷിക്കുന്നില്ലെന്നുമുള്ള വാക്യത്തിന്റെ സംഘർഷം അമിതവ്യാഖ്യാനം കൂടാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പദങ്ങൾ ഉപയോഗിച്ചുകൊണ്ട് മൂലത്തിലെ ദൃശ്യം, ഉദ്ദേശ്യം, വ്യാപാരപരമായ പ്രയോഗം എന്നിവ സംരക്ഷിച്ചു. ഈ വാക്യത്തിന് ആവശ്യമായ പാഠഭേദമോ നിർബന്ധമായ വ്യാഖ്യാനക്കുറിപ്പോ ഇല്ലാത്തതിനാൽ അടിക്കുറിപ്പുകൾ ചേർത്തിട്ടില്ല.
