  source_fidelity: Greek σὺ δέ is appropriately represented by «എന്നാൽ നീ», retaining the contrast and singular emphasis. The adverbial participle νηστεύων is naturally rendered «ഉപവസിക്കുമ്പോൾ». «നിന്റെ തലയിൽ എണ്ണ പുരട്ടുകയും … മുഖം കഴുകുകയും ചെയ്യുക» faithfully conveys the two imperatives ἄλειψαι and νίψαι, without importing a ritual sense.
  naturalness: The Malayalam is clear, idiomatic modern standard usage. The coordinated imperative construction is natural, and the possessive «നിന്റെ» is readily understood with both head and face in context.
  terminology: «ഉപവസിക്കുക», «എണ്ണ പുരട്ടുക», and «മുഖം കഴുകുക» are accurate and appropriately non-archaic. Avoiding «അഭിഷേകം ചെയ്യുക» is sound because that term could suggest a ritual action not required by the context.
