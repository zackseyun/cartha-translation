id: MAT.6.17
reference: Matthew 6:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: σὺ δὲ νηστεύων ἄλειψαί σου τὴν κεφαλὴν καὶ τὸ πρόσωπόν σου νίψαι,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/017.yaml
  text: But you[a], when you fast, anoint your head and wash your face[b],
translation:
  language: ml
  text: എന്നാൽ നീ ഉപവസിക്കുമ്പോൾ, നിന്റെ തലയിൽ എണ്ണ പുരട്ടുകയും[a] മുഖം കഴുകുകയും ചെയ്യുക[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘തലയിൽ എണ്ണ പുരട്ടുക’ എന്നർഥമുണ്ട്; ഇത് സാധാരണ ശരീരപരിപാലനത്തിന്റെ ഭാഗമായുള്ള എണ്ണപുരട്ടലിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അതായത്, ഉപവസിക്കുന്നുവെന്നത് മറ്റുള്ളവർക്കു വ്യക്തമാക്കാതെ പതിവുപോലെയുള്ള രൂപം നിലനിർത്തുക.
    reason: cultural_note
lexical_decisions:
- source_word: σὺ δὲ
  choice: എന്നാൽ നീ
  rationale: മുൻവാക്യത്തിലെ കപടഭക്തരോടുള്ള വ്യത്യാസം δέ സൂചിപ്പിക്കുകയും, വ്യക്തമായ σὺ ഏകവചനമായ ‘നീ’ക്ക് ഊന്നൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: νηστεύων
  choice: ഉപവസിക്കുമ്പോൾ
  rationale: വർത്തമാനകാല കൃദന്തം ഇവിടെ കാലസൂചകമായി പ്രവർത്തിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഉപവസിക്കുമ്പോൾ’ എന്നു നൽകാം.
- source_word: ἄλειψαί σου τὴν κεφαλήν
  choice: നിന്റെ തലയിൽ എണ്ണ പുരട്ടുക
  rationale: ἀλείφω ശരീരത്തിൽ എണ്ണ പുരട്ടുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘അഭിഷേകം ചെയ്യുക’ എന്നത് മലയാളത്തിൽ അനാവശ്യമായി ആചാരപരമായ അർഥം ഉണർത്താനിടയുള്ളതിനാൽ, സാധാരണ ശുചീകരണ-പരിപാലന പ്രവൃത്തിയെ വ്യക്തമാക്കുന്ന ഈ പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: καὶ
  choice: -ഉം … -ഉം
  rationale: രണ്ട് ആജ്ഞകളെയും മലയാളത്തിലെ സ്വാഭാവിക സമുച്ചയഘടനയിൽ ബന്ധിപ്പിക്കുന്നു.
- source_word: τὸ πρόσωπόν σου νίψαι
  choice: മുഖം കഴുകുക
  rationale: νίπτω ശരീരത്തിന്റെ ഒരു ഭാഗം കഴുകുന്നതിനെ സൂചിപ്പിക്കുന്നു; ഇവിടെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാള പ്രയോഗമാണിത്.
theological_decisions:
- issue: ഉപവാസസമയത്തെ ബാഹ്യരൂപത്തെക്കുറിച്ചുള്ള നിർദേശം
  choice: ഉപവാസം മറ്റുള്ളവർക്കു പ്രകടമാക്കാതിരിക്കാനായി പതിവുപോലെ വ്യക്തിപരമായ ശുചിത്വവും പരിപാലനവും തുടരാനുള്ള നിർദേശമായി വിവർത്തനം ചെയ്തു.
  alternative: ഇത് ഒരു ആചാരപരമായ അഭിഷേകത്തിനുള്ള നിർദേശമാണെന്നോ പൊതുസ്ഥലത്തെ ഉപവാസം തന്നെയാണ് വിലക്കുന്നതെന്നോ വായിക്കാം.
  rationale: തൊട്ടുമുൻപുള്ള സന്ദർഭം മുഖം വിരൂപമാക്കി ഉപവാസം പ്രകടിപ്പിക്കുന്ന കപടഭക്തരോടാണ് ഈ നിർദേശത്തെ താരതമ്യം ചെയ്യുന്നത്. എന്നാൽ വ്യാഖ്യാനം മുഖ്യവാക്യത്തിൽ ചേർക്കാതെ സാംസ്കാരിക വിശദീകരണം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, ഏകവചന അഭിസംബോധനയും മുൻസന്ദർഭത്തോടുള്ള വൈരുധ്യവും നിലനിർത്തി. ‘അഭിഷേകം’ എന്ന ആചാരനിറമുള്ള പദത്തിനു പകരം സാധാരണ വായനക്കാരന് വ്യക്തമായ ‘എണ്ണ പുരട്ടുക’ ഉപയോഗിച്ചു.
