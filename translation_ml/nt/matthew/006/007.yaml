id: MAT.6.7
reference: Matthew 6:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Προσευχόμενοι δὲ μὴ βατταλογήσητε ὥσπερ οἱ ἐθνικοί, δοκοῦσιν γὰρ ὅτι ἐν τῇ πολυλογίᾳ αὐτῶν εἰσακουσθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/007.yaml
  text: And when you pray[a], do not heap up empty words like the Gentiles[b], for they think that they will be heard because of their many words.
translation:
  language: ml
  text: പ്രാർഥിക്കുമ്പോൾ, വിജാതീയരെപ്പോലെ[a] അർഥമില്ലാത്ത വാക്കുകൾ കൂട്ടിക്കൂട്ടി പറയരുത്[b]; അവരുടെ വാക്കുകളുടെ പെരുപ്പംകൊണ്ട് അവർ കേൾക്കപ്പെടും എന്നു അവർ കരുതുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ജനതകളെപ്പോലെ.’ ഗ്രീക്ക് പദം ഇവിടെ യഹൂദ ജനതയ്ക്ക് പുറത്തുള്ള ജനവിഭാഗങ്ങളിലുള്ളവരെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘വ്യർഥമായി പുലമ്പരുത്’ അല്ലെങ്കിൽ ‘അർഥമില്ലാതെ ആവർത്തിക്കരുത്.’ ഗ്രീക്ക് ക്രിയ അപൂർവമാണ്; ആത്മാർഥമായ ആവർത്തിച്ചുള്ള പ്രാർഥനയെയല്ല, അർഥശൂന്യവും യാന്ത്രികവും വാചാലവുമായ സംസാരത്തെയായിരിക്കാം അത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσευχόμενοι δὲ
  choice: പ്രാർഥിക്കുമ്പോൾ
  rationale: സന്ദർഭത്തിൽ ഈ ക്രിയാവിശേഷണസദൃശമായ വർത്തമാന കൃദന്തം കല്പന നടക്കുന്ന സാഹചര്യം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘പ്രാർഥിക്കുമ്പോൾ’ സ്വാഭാവികവും വ്യക്തവുമാണ്; δέ ഇവിടെ പുതിയ ഉപദേശം തുടരുന്നതിനാൽ പ്രത്യേകമായൊരു ബന്ധകപദം ചേർക്കേണ്ടതില്ല.
- source_word: μὴ βατταλογήσητε
  choice: അർഥമില്ലാത്ത വാക്കുകൾ കൂട്ടിക്കൂട്ടി പറയരുത്
  rationale: അപൂർവമായ βατταλογέω അർഥശൂന്യവും യാന്ത്രികവും വാചാലവുമായ സംസാരത്തെ സൂചിപ്പിക്കുന്നതായി തോന്നുന്നു. ഈ പരിഭാഷ വെറും ആവർത്തനമെന്നതിലുപരി ശൂന്യമായ വാക്കുപെരുപ്പത്തെ മുൻനിർത്തുന്നു.
- source_word: ὥσπερ οἱ ἐθνικοί
  choice: ജനതകളെപ്പോലെ
  rationale: ἐθνικοί യഹൂദസന്ദർഭത്തിൽ ഉടമ്പടിജനത്തിനു പുറത്തുള്ള ജനതകളെ, അഥവാ വിജാതീയരെ, സൂചിപ്പിക്കുന്നു. ‘ജനതകൾ’ മൂലപദത്തിന്റെ ആശയം നിലനിർത്തുന്നു; കൂടുതൽ പരിചിതമായ മറ്റൊരു പദം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: δοκοῦσιν
  choice: അവർ കരുതുന്നു
  rationale: അവരുടെ ധാരണയെയോ അനുമാനത്തെയോ ലളിതവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐν τῇ πολυλογίᾳ αὐτῶν
  choice: തങ്ങളുടെ വാക്കുകളുടെ പെരുപ്പംകൊണ്ട്
  rationale: πολυλογία വളരെ സംസാരിക്കൽ അഥവാ വാചാലത എന്നാണ്. ഇവിടെ ദൈവം കേൾക്കുമെന്ന അവരുടെ പ്രതീക്ഷയുടെ തെറ്റായ അടിസ്ഥാനത്തെ കാരണാർഥത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: εἰσακουσθήσονται
  choice: തങ്ങൾ കേൾക്കപ്പെടുമെന്ന്
  rationale: അനുകൂലമായി കേൾക്കപ്പെടുക എന്ന നിഷ്ക്രിയരൂപം സംരക്ഷിക്കുന്നു; ‘ഉത്തരം ലഭിക്കും’ എന്ന കൂടുതൽ ശക്തമായ അർഥം അനാവശ്യമായി ചേർക്കുന്നില്ല.
theological_decisions:
- issue: യേശു പ്രാർഥനയിലെ എല്ലാ ആവർത്തനവും വിലക്കുന്നുവോ, അതോ അർഥശൂന്യമായ വാക്കുപെരുപ്പത്തെയോ
  choice: പ്രധാനപാഠത്തിൽ ‘അർഥമില്ലാത്ത വാക്കുകൾ കൂട്ടിക്കൂട്ടി പറയരുത്’ എന്ന് നൽകിയിരിക്കുന്നു.
  alternative: ‘വ്യർഥമായി പുലമ്പരുത്’ അല്ലെങ്കിൽ ‘അർഥമില്ലാതെ ആവർത്തിക്കരുത്.’
  rationale: അപൂർവമായ ഗ്രീക്ക് ക്രിയയുടെ അർഥപരിധി നിലനിർത്തിക്കൊണ്ട്, ആത്മാർഥമായ ആവർത്തിച്ചുള്ള പ്രാർഥനയും ഇവിടെ വിലക്കപ്പെടുന്നു എന്ന തെറ്റായ നിഗമനം ഒഴിവാക്കുന്നു. ദൈവശ്രദ്ധ നേടാനുള്ള മാർഗമായി ശൂന്യമായ വാക്കുപെരുപ്പത്തെ ആശ്രയിക്കുന്നതാണ് വിമർശിക്കപ്പെടുന്നത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘കൂട്ടിക്കൂട്ടി’ എന്ന പ്രയോഗം സാധാരണ വായനക്കാർക്ക് വാക്കുപെരുപ്പവും ആവർത്തനഭാവവും ഒരുമിച്ച് മനസ്സിലാകുന്ന വിധത്തിൽ തിരഞ്ഞെടുത്തു; അപൂർവമായ മൂലക്രിയയുടെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
