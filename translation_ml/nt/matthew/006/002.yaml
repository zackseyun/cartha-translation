id: MAT.6.2
reference: Matthew 6:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὅταν οὖν ποιῇς ἐλεημοσύνην, μὴ σαλπίσῃς ἔμπροσθέν σου, ὥσπερ οἱ ὑποκριταὶ ποιοῦσιν ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς ῥύμαις, ὅπως δοξασθῶσιν ὑπὸ τῶν ἀνθρώπων· ἀμὴν λέγω ὑμῖν, ἀπέχουσιν τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/002.yaml
  text: Therefore[a], whenever you give alms, do not sound a trumpet before you, as the hypocrites do in the synagogues and in the streets, so that they may be glorified by people. Truly I say to you[e][d][c][b], they have received their reward in full.
translation:
  language: ml
  text: 'അതുകൊണ്ട്, നീ ധർമ്മദാനം ചെയ്യുമ്പോഴെല്ലാം[a], കപടന്മാർ സിനഗോഗുകളിലും തെരുവുകളിലും ചെയ്യുന്നതുപോലെ നിന്റെ മുമ്പിൽ കാഹളം മുഴക്കരുത്[b]; ആളുകൾ തങ്ങളെ മഹത്ത്വപ്പെടുത്തേണ്ടതിനാണ്[c] അവർ അങ്ങനെ ചെയ്യുന്നത്. സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: അവർ തങ്ങളുടെ പ്രതിഫലം മുഴുവനായി ലഭിച്ചുകഴിഞ്ഞു[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദരിദ്രർക്കോ ആവശ്യത്തിലിരിക്കുന്നവർക്കോ ദാനം നൽകുമ്പോൾ’ അല്ലെങ്കിൽ ‘കരുണാപ്രവൃത്തി ചെയ്യുമ്പോൾ.’ ഗ്രീക്ക് പ്രയോഗം ധർമ്മദാനത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘കാഹളം മുഴക്കി അത് വിളംബരം ചെയ്യരുത്.’ ഈ വാക്കുകൾ അതിശയോക്തിയോ രൂപകമോ ആയിരിക്കാം; എന്നാൽ ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘കാഹളം മുഴക്കരുത്’ എന്നാണ്.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘ആളുകൾ തങ്ങളെ പുകഴ്ത്തേണ്ടതിന്’ അല്ലെങ്കിൽ ‘ആദരിക്കേണ്ടതിന്.’ ഗ്രീക്ക് ക്രിയയുടെ അക്ഷരാർഥം ‘മഹത്ത്വപ്പെടുത്തുക’ എന്നാണ്.
    reason: lexical_alternative
  - marker: d
    text: '‘പ്രതിഫലം മുഴുവനായി ലഭിച്ചുകഴിഞ്ഞു’ എന്നത് വാണിജ്യരംഗത്തെ ഒരു പ്രയോഗത്തെ പ്രതിഫലിപ്പിക്കുന്നു: അവർക്കു ലഭിക്കാനുള്ള പ്രതിഫലം മുഴുവൻ ഇതിനകം ലഭിച്ചു എന്നതാണ് ആശയം.'
    reason: cultural_note
lexical_decisions:
- source_word: Ὅταν οὖν
  choice: അതുകൊണ്ട്, ... ചെയ്യുമ്പോഴെല്ലാം
  rationale: οὖν മുൻവാക്യങ്ങളുമായുള്ള യുക്തിബന്ധം സൂചിപ്പിക്കുന്നു; ὅταν + subjunctive ആവർത്തിക്കാവുന്ന പൊതുസാഹചര്യം സൂചിപ്പിക്കുന്നതിനാൽ ‘ചെയ്യുമ്പോഴെല്ലാം’ എന്നു നൽകി.
- source_word: ποιῇς ἐλεημοσύνην
  choice: നീ ദരിദ്രർക്കു ദാനം നൽകുമ്പോൾ
  rationale: ഇത് ആവശ്യത്തിലിരിക്കുന്നവർക്കുള്ള ധർമ്മദാനത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗമാണ്. ആധുനിക മലയാളത്തിൽ അർത്ഥം ഉടൻ വ്യക്തമാകാൻ സ്വീകരിക്കുന്നവരെയും വ്യക്തമാക്കി.
- source_word: μὴ σαλπίσῃς ἔμπροσθέν σου
  choice: നിന്റെ മുമ്പിൽ കാഹളം മുഴക്കരുത്
  rationale: മൂലത്തിലെ ശക്തമായ ദൃശ്യരൂപം വ്യാഖ്യാനിച്ച് മൃദൂകരിക്കാതെ നിലനിർത്തി; ἔμπροσθέν σου സ്വാഭാവികമായി ‘നിന്റെ മുമ്പിൽ’ എന്നു നൽകി.
- source_word: ὑποκριταὶ
  choice: കപടഭക്തർ
  rationale: ഭക്തിപ്രവൃത്തിയെ ജനങ്ങൾക്കു കാണിക്കാനായി അഭിനയിക്കുന്നവരെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; മലയാള ബൈബിൾ-മതഭാഷയിൽ പരിചിതവും സന്ദർഭോചിതവുമായ പദം.
- source_word: συναγωγαῖς καὶ ῥύμαις
  choice: സിനഗോഗുകളിലും തെരുവുകളിലും
  rationale: യഹൂദരുടെ പ്രത്യേക സമ്മേളനസ്ഥലത്തെ പൊതുവായ ‘യോഗസ്ഥലം’ എന്നു ലയിപ്പിക്കാതെ ചരിത്രപരമായ പദം നിലനിർത്തി; ῥύμαις സ്വാഭാവികമായി ‘തെരുവുകൾ’ എന്നു നൽകി.
- source_word: ὅπως δοξασθῶσιν ὑπὸ τῶν ἀνθρώπων
  choice: ആളുകൾ തങ്ങളെ മഹത്ത്വപ്പെടുത്തേണ്ടതിന്
  rationale: ഗ്രീക്കിലെ passive ഘടന മലയാളത്തിൽ സ്വാഭാവികമായ active ഘടനയാക്കി; δοξάζω എന്ന ശക്തമായ പദത്തിന് ‘മഹത്ത്വപ്പെടുത്തുക’ നിലനിർത്തി, ἀνθρώπων ലിംഗസൂചനയില്ലാത്ത പൊതുവായ ‘ആളുകൾ’ എന്നു നൽകി.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: യേശുവിന്റെ ഗൗരവമുള്ള ഉറപ്പുവാക്കിന്റെ ശക്തിയും നേരിട്ടുള്ള പ്രസ്താവനയും നിലനിർത്തുന്നു.
- source_word: ἀπέχουσιν τὸν μισθὸν αὐτῶν
  choice: അവർ തങ്ങളുടെ പ്രതിഫലം മുഴുവനായി ലഭിച്ചുകഴിഞ്ഞു
  rationale: ἀπέχουσιν എന്ന വാണിജ്യപ്രയോഗം ലഭിക്കാനുള്ളത് പൂർണമായി ലഭിച്ചുവെന്ന അർത്ഥം വഹിക്കുന്നു; ‘മുഴുവനായി’ ചേർത്ത് ആ ഭാവം വ്യക്തമാക്കി.
theological_decisions:
- issue: ഏകവചനത്തിൽനിന്ന് ബഹുവചനത്തിലേക്കുള്ള മാറ്റം
  choice: ‘നീ/നിന്റെ’ എന്നും തുടർന്ന് ‘നിങ്ങളോടു’ എന്നും
  alternative: വാക്യം മുഴുവൻ ‘നിങ്ങൾ/നിങ്ങളുടെ’ എന്നു ഏകീകരിക്കുക
  rationale: ποιῇς, σου എന്നിവ ഏകവചനവും ὑμῖν ബഹുവചനവുമാണ്. മലയാളത്തിൽ ഈ വ്യത്യാസം വ്യക്തമായി പ്രകടിപ്പിക്കാനാകുന്നതിനാൽ മൂലരൂപം സംരക്ഷിച്ചു.
- issue: δοξασθῶσιν എന്നതിന്റെ ശക്തി
  choice: മഹത്ത്വപ്പെടുത്തുക
  alternative: പുകഴ്ത്തുക / പ്രശംസിക്കുക
  rationale: മനുഷ്യരുടെ പൊതുപ്രശംസയാണ് സന്ദർഭമെങ്കിലും, മൂലത്തിലെ ശക്തമായ ‘മഹത്ത്വപ്പെടുത്തുക’ എന്ന ആശയം മൃദൂകരിക്കാതെ നിലനിർത്തി.
- issue: ἀνθρώπων എന്ന പൊതുവായ പരാമർശം
  choice: ആളുകൾ
  alternative: മനുഷ്യർ / പുരുഷന്മാർ
  rationale: ഇവിടെ എല്ലാ മനുഷ്യസാക്ഷികളെയും പൊതുവായി സൂചിപ്പിക്കുന്നു; പുരുഷന്മാരെ മാത്രം സൂചിപ്പിക്കുന്ന വിവർത്തനം മൂലത്തിന്റെ വ്യാപ്തി തെറ്റിക്കും.
- issue: പ്രതിഫലം ലഭിച്ചതിന്റെ പൂർണത
  choice: മുഴുവനായി ലഭിച്ചുകഴിഞ്ഞു
  alternative: പ്രതിഫലം ലഭിക്കുന്നു / ലഭിച്ചിട്ടുണ്ട്
  rationale: വാണിജ്യപരമായ ἀπέχω പ്രയോഗത്തിലെ ‘പൂർണമായി കൈപ്പറ്റി; ഇനി ശേഷിക്കുന്നില്ല’ എന്ന സൂചന സംരക്ഷിച്ചു; ദൈവിക പ്രതിഫലത്തെക്കുറിച്ചുള്ള ചുറ്റുപാടിലെ സംഘർഷം അധികമായി വിശദീകരിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘സിനഗോഗ്’, ‘കാഹളം’, ‘പ്രതിഫലം’ തുടങ്ങിയ പരിചിതമായ പദങ്ങൾ ചരിത്ര-സാംസ്കാരിക വ്യക്തതയ്ക്കായി നിലനിർത്തി. മൂലത്തിലെ ഏകവചന അഭിസംബോധനയും തുടർന്ന് വരുന്ന ബഹുവചന പ്രഖ്യാപനവും സംരക്ഷിച്ചു.
