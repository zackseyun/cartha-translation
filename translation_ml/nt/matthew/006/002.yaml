revisions:
- from: 'അതുകൊണ്ട്, നീ ദരിദ്രർക്കു ദാനം നൽകുമ്പോഴെല്ലാം[a], കപടഭക്തർ ആളുകൾ തങ്ങളെ മഹത്ത്വപ്പെടുത്തേണ്ടതിന്[c] സിനഗോഗുകളിലും തെരുവുകളിലും ചെയ്യുന്നതുപോലെ, നിന്റെ മുമ്പിൽ കാഹളം മുഴക്കരുത്[b]. സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: അവർ തങ്ങളുടെ പ്രതിഫലം മുഴുവനായി ലഭിച്ചുകഴിഞ്ഞു[d].'
  to: 'അതുകൊണ്ട്, നീ ധർമ്മദാനം ചെയ്യുമ്പോഴെല്ലാം[a], കപടന്മാർ സിനഗോഗുകളിലും തെരുവുകളിലും ചെയ്യുന്നതുപോലെ നിന്റെ മുമ്പിൽ കാഹളം മുഴക്കരുത്[b]; ആളുകൾ തങ്ങളെ മഹത്ത്വപ്പെടുത്തേണ്ടതിനാണ്[c] അവർ അങ്ങനെ ചെയ്യുന്നത്. സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: അവർ തങ്ങളുടെ പ്രതിഫലം മുഴുവനായി ലഭിച്ചുകഴിഞ്ഞു[d].'
  rationale: The correction removes an unsupported nuance from ‘കപടഭക്തർ’ and uses a more direct equivalent for the Greek charitable-giving idiom. The sentence is lightly reorganized to make the purpose clause explicit and idiomatic in Malayalam, while retaining every element of the source text and all footnote anchors.
