review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the inferential οὖν, the general/repeated force of Ὅταν, the singular address followed by the plural assurance, the literal trumpet image, the public locations, the purpose clause, and the commercial-force conclusion of ἀπέχουσιν. However, ‘കപടഭക്തർ’ adds a specifically devotional qualification not expressed by ὑποκριταί; the source says ‘hypocrites/pretenders.’ ‘ധർമ്മദാനം’ renders ποιεῖν ἐλεημοσύνην more directly and avoids unnecessarily restricting the recipients to ‘the poor.’
  naturalness: The revision keeps a modern, dignified Malayalam biblical register. Reordering the purpose clause after the description of the hypocrites’ actions produces a clearer and more natural sentence flow.
  terminology: Use ‘ധർമ്മദാനം’ for charitable almsgiving and ‘കപടന്മാർ’ for ὑποκριταί. ‘സിനഗോഗുകൾ,’ ‘തെരുവുകൾ,’ ‘കാഹളം,’ and ‘പ്രതിഫലം’ are suitable. ‘മഹത്ത്വപ്പെടുത്തുക’ retains the lexical strength of δοξάζω without imposing theological interpretation.
