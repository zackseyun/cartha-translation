id: MAT.6.33
reference: Matthew 6:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ζητεῖτε δὲ πρῶτον τὴν ⸀βασιλείαν καὶ τὴν δικαιοσύνην αὐτοῦ, καὶ ταῦτα πάντα προστεθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/033.yaml
  text: But seek first his kingdom and his righteousness[a], and all these things will be added to you.
translation:
  language: ml
  text: എന്നാൽ ആദ്യം അവന്റെ രാജ്യവും അവന്റെ നീതിയും[a] അന്വേഷിക്കുവിൻ; ഇവയെല്ലാം നിങ്ങൾക്കു കൂട്ടിച്ചേർക്കപ്പെടും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവന്റെ നീതിനിഷ്ഠ” അല്ലെങ്കിൽ “അവന്റെ ന്യായം.” ഗ്രീക്ക് പദം ദൈവഹിതത്തോടൊത്ത ശരിയായ നിലയും പെരുമാറ്റവും ന്യായവും സൂചിപ്പിക്കാം; ഇവിടെ അതിന്റെ വിശാലമായ അർഥം നിലനിർത്താൻ “നീതി” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητεῖτε
  choice: അന്വേഷിക്കുവിൻ
  rationale: വർത്തമാനകാല ബഹുവചന ആജ്ഞ സജീവവും തുടർച്ചയുള്ളതുമായ അന്വേഷണമെന്ന ആശയം നൽകുന്നു. ‘അന്വേഷിക്കുവിൻ’ ഗൗരവമുള്ള ആധുനിക മലയാളത്തിൽ ആ സജീവ പിന്തുടർച്ച നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുമ്പുള്ള ഉത്കണ്ഠയോടും ഭൗതിക ആവശ്യങ്ങൾക്കായുള്ള വ്യഗ്രമായ തിരച്ചിലോടും ഉള്ള വൈരുധ്യപരമായ തിരിവ് സൂചിപ്പിക്കുന്നു.
- source_word: πρῶτον
  choice: ആദ്യം
  rationale: ക്രമത്തെയും മുൻഗണനയെയും ഒരുപോലെ തുറന്നുവെക്കുന്ന നേരിട്ടുള്ള പരിഭാഷയാണ്.
- source_word: βασιλείαν
  choice: രാജ്യം
  rationale: ദൈവത്തിന്റെ രാജകീയ ഭരണവും അതിന്റെ മണ്ഡലവും ഉൾക്കൊള്ളാൻ കഴിയുന്ന, മത്തായിയിൽ സ്വാഭാവികവും സ്ഥാപിതവുമായ പദമാണ്.
- source_word: δικαιοσύνην
  choice: നീതി
  rationale: മലയാളത്തിൽ ‘നീതി’ ദൈവഹിതത്തോടൊത്ത ശരിയായ നിലയും പെരുമാറ്റവും ന്യായവും ഉൾക്കൊള്ളാൻ കഴിയുന്നു; കേവലം നിയമവിധിയിലേക്കോ സാമൂഹിക ന്യായത്തിലേക്കോ അർഥം ചുരുക്കുന്നില്ല. വിശാലത വ്യക്തമാക്കാൻ അടിക്കുറിപ്പ് ചേർത്തിരിക്കുന്നു.
- source_word: αὐτοῦ
  choice: അവന്റെ
  rationale: ഗ്രീക്കിലെ സർവനാമരൂപം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് ദൈവത്തെ/പിതാവിനെ സൂചിപ്പിക്കുന്നു.
- source_word: ταῦτα πάντα
  choice: ഇവയെല്ലാം
  rationale: തൊട്ടുമുമ്പ് പറഞ്ഞ ഭക്ഷണം, പാനം, വസ്ത്രം എന്നീ ആവശ്യങ്ങളിലേക്കുള്ള സൂചന സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: προστεθήσεται
  choice: കൂട്ടിച്ചേർക്കപ്പെടും
  rationale: ഭാവികാല കർമണിപ്രയോഗവും ‘കൂടുതലായി ചേർക്കുക’ എന്ന മൂലക്രിയാഭാവവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: ὑμῖν
  choice: നിങ്ങൾക്കു
  rationale: ബഹുവചന ദാതൃവിഭക്തിയുടെ സ്വാഭാവിക മലയാളരൂപമാണ്.
theological_decisions:
- issue: δικαιοσύνην എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: നീതി
  alternative: നീതിനിഷ്ഠ; ന്യായം
  rationale: ഇവിടെ പദം ദൈവഹിതത്തോടൊത്ത നിലയെയും ജീവിതച്ചര്യയെയും ഉൾക്കൊള്ളുന്നു. ‘ന്യായം’ മാത്രം ഉപയോഗിച്ചാൽ സാമൂഹികമോ ന്യായാധിപത്യപരമോ ആയ അർഥത്തിലേക്ക് ചുരുങ്ങാൻ ഇടയുണ്ട്; ‘നീതി’ മലയാളത്തിൽ ആവശ്യമായ അർഥവ്യാപ്തി കൂടുതൽ സ്വാഭാവികമായി വഹിക്കുന്നു.
- issue: αὐτοῦ എന്ന സർവനാമത്തിന്റെ സൂചിതൻ
  choice: അവന്റെ
  alternative: ദൈവത്തിന്റെ
  rationale: സന്ദർഭത്തിൽ സൂചിതൻ ദൈവം/പിതാവ് ആണെങ്കിലും, മൂലപാഠത്തിലെ സർവനാമം നിലനിർത്തി അനാവശ്യമായ വിശദീകരണം പ്രധാനവാക്യത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള തിരുവെഴുത്തുശൈലി. ‘അന്വേഷിക്കുവിൻ’ എന്ന ബഹുവചന ആജ്ഞയും ‘കൂട്ടിച്ചേർക്കപ്പെടും’ എന്ന കർമണിരൂപവും മൂലപാഠത്തിന്റെ വ്യാകരണരൂപം നിലനിർത്തുന്നു; വാക്യം സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന വിധത്തിൽ സംക്ഷിപ്തമാണ്.
