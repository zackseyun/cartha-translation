id: MAT.6.22
reference: Matthew 6:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὁ λύχνος τοῦ σώματός ἐστιν ὁ ὀφθαλμός. ἐὰν οὖν ⸂ᾖ ὁ ὀφθαλμός σου ἁπλοῦς⸃, ὅλον τὸ σῶμά σου φωτεινὸν ἔσται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/022.yaml
  text: The eye is the lamp of the body. Therefore[a], if your eye is healthy, your whole body will be full of light.
translation:
  language: ml
  text: ശരീരത്തിന്റെ വിളക്ക് കണ്ണാണ്. അതിനാൽ, നിന്റെ കണ്ണ് ആരോഗ്യ്യമുള്ളതാണെങ്കിൽ[a], നിന്റെ ശരീരം മുഴുവനും പ്രകാശം നിറഞ്ഞതായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഏകമായ,” “തെളിഞ്ഞ,” അല്ലെങ്കിൽ “സുസ്ഥമായ.” ഗ്രീക്ക് പദത്തിന് “വിഭജിക്കപ്പെടാത്ത” എന്ന ആശയവും ചില സന്ദർഭങ്ങളിൽ “ഉദാരമായ” എന്ന അർഥവും ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: λύχνος
  choice: വിളക്ക്
  rationale: അമൂർത്തമായ ‘വെളിച്ചം’ എന്നതിലുപരി, ശരീരത്തിന് പ്രകാശം നൽകുന്ന ഉറവിടമായി കണ്ണിനെ ചിത്രീകരിക്കുന്ന മൂർത്തമായ രൂപകം നിലനിർത്തുന്നു.
- source_word: σῶμα
  choice: ശരീരം
  rationale: ശാരീരിക ദൃശ്യരൂപം സ്വാഭാവികമായി നിലനിർത്തുന്ന സാധാരണ തത്തുല്യം.
- source_word: ὀφθαλμός
  choice: കണ്ണ്
  rationale: ശാരീരിക അർഥത്തിനും ധാർമിക രൂപകത്തിനും യോജിക്കുന്ന നേരിട്ടുള്ള പരിഭാഷ.
- source_word: ἐὰν οὖν
  choice: അതുകൊണ്ട്, ... ആയിരുന്നാൽ
  rationale: οὖν സൂചിപ്പിക്കുന്ന നിഗമനബന്ധം ‘അതുകൊണ്ട്’ എന്നതിലൂടെ വ്യക്തമാക്കുകയും ἐὰν എന്ന വ്യവസ്ഥ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἁπλοῦς
  choice: നന്നായിരുന്നാൽ
  rationale: കണ്ണിന്റെ പ്രവർത്തനവും ശരീരത്തിന്റെ പ്രകാശവും തമ്മിലുള്ള തത്സമയ രൂപകത്തിൽ, ശരിയായി പ്രവർത്തിക്കുന്ന കണ്ണ് എന്ന ആശയം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി നൽകുന്നു; പദത്തിന്റെ ‘ഏകാഗ്രമായ/നിർമ്മലമായ’ തുടങ്ങിയ സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ὅλον
  choice: മുഴുവൻ
  rationale: സമഗ്രതയുടെ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: φωτεινὸν
  choice: പ്രകാശമുള്ളത്
  rationale: ‘പ്രകാശിതം/തെളിച്ചമുള്ളത്’ എന്ന ഗ്രീക്ക് വിശേഷണത്തിന്റെ ദൃശ്യരൂപം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: ἔσται
  choice: ആയിരിക്കും
  rationale: ഗ്രീക്കിലെ ഭാവികാലം വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: കണ്ണിനെക്കുറിച്ചുള്ള രൂപകത്തിൽ ἁπλοῦς എന്നതിന്റെ അർഥം
  choice: പ്രധാനപാഠത്തിൽ ‘നന്നായിരുന്നാൽ’
  alternative: ‘ഏകാഗ്രമായിരുന്നാൽ,’ ‘നിർമ്മലമായിരുന്നാൽ,’ ‘ശരിയായിരുന്നാൽ,’ അല്ലെങ്കിൽ ചില സന്ദർഭങ്ങളിൽ ‘ഉദാരമായിരുന്നാൽ’
  rationale: തുടർന്നുള്ള മോശമായ കണ്ണുമായുള്ള വൈരുധ്യവും ശരീരത്തിലെ പ്രകാശത്തെക്കുറിച്ചുള്ള രൂപകവും കണക്കിലെടുക്കുമ്പോൾ, ശരിയായി പ്രവർത്തിക്കുന്ന കണ്ണ് എന്ന അർഥം ഇവിടെ ഏറ്റവും നേരിട്ട് ഗ്രഹിക്കാവുന്നതാണ്. എങ്കിലും ἁπλοῦς എന്ന പദത്തിലെ ഏകത്വം, വിഭജിക്കപ്പെടാത്ത മനസ്സ്, ചില സന്ദർഭങ്ങളിലെ ഉദാരത എന്നിവയുടെ സാധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘ശരീരത്തിന്റെ വിളക്ക് കണ്ണാണ്’ എന്ന വാക്യക്രമം മൂലത്തിലെ രൂപകവും ഊന്നലും നിലനിർത്തുന്നു. പ്രധാനപാഠത്തിലെ ‘നന്നായിരുന്നാൽ’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്; ഗ്രീക്ക് പദത്തിന്റെ യഥാർഥ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചിരിക്കുന്നു.
