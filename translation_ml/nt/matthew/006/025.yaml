id: MAT.6.25
reference: Matthew 6:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Διὰ τοῦτο λέγω ὑμῖν· μὴ μεριμνᾶτε τῇ ψυχῇ ὑμῶν τί ⸀φάγητε, μηδὲ τῷ σώματι ὑμῶν τί ἐνδύσησθε· οὐχὶ ἡ ψυχὴ πλεῖόν ἐστι τῆς τροφῆς καὶ τὸ σῶμα τοῦ ἐνδύματος;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/025.yaml
  text: Therefore I tell you[a], do not worry about your life, what you will eat, or about your body, what you will wear. Is not life more than food, and the body than clothing?
translation:
  language: ml
  text: 'അതുകൊണ്ട് ഞാൻ നിങ്ങളോടു പറയുന്നു: എന്തു ഭക്ഷിക്കുമെന്നോർത്ത് നിങ്ങളുടെ ജീവനെയും, എന്തു ധരിക്കുമെന്നോർത്ത് നിങ്ങളുടെ ശരീരത്തെയും കുറിച്ച് ആകുലപ്പെടരുത്. ജീവൻ ആഹാരത്തെക്കാളും ശരീരം വസ്ത്രത്തെക്കാളും കൂടുതൽ പ്രാധാന്യമുള്ളതല്ലേ?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: അതുകൊണ്ട്
  rationale: മുൻപുള്ള ഉപദേശത്തിൽനിന്നുള്ള നിഗമനബന്ധം സ്വാഭാവികവും വ്യക്തവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: μεριμνᾶτε
  choice: ആകുലപ്പെടരുത്
  rationale: ഉത്കണ്ഠയോടെയുള്ള വ്യഗ്രതയെ സൂചിപ്പിക്കുന്നു; സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ ആധുനിക പ്രയോഗമാണിത്.
- source_word: ψυχῇ / ψυχὴ
  choice: ജീവൻ
  rationale: ഭക്ഷണംകൊണ്ട് നിലനിൽക്കുന്ന വ്യക്തിയുടെ ജീവിതമാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്; ദേഹത്തിൽനിന്നു വേറിട്ട ആത്മാവെന്ന അർഥം നിർബന്ധിക്കുന്നില്ല.
- source_word: τί φάγητε
  choice: എന്തു ഭക്ഷിക്കുമെന്ന്
  rationale: ആകുലതയുടെ ഭാവിമുഖമായ ഉള്ളടക്കം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: σώματι
  choice: ശരീരം
  rationale: വസ്ത്രവുമായി താരതമ്യം ചെയ്യപ്പെടുന്ന ഭൗതിക ശരീരത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: τί ἐνδύσησθε
  choice: എന്തു ധരിക്കുമെന്ന്
  rationale: വസ്ത്രം അണിയുക എന്ന ആശയം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: οὐχὶ
  choice: അല്ലേ?
  rationale: അനുകൂല ഉത്തരം പ്രതീക്ഷിക്കുന്ന ഗ്രീക്ക് ആലങ്കാരിക ചോദ്യത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: πλεῖόν
  choice: വിലയേറിയത്
  rationale: ഇവിടെ വെറും അളവല്ല, ജീവനും ശരീരവും അവയെ പോഷിപ്പിക്കുന്ന വസ്തുക്കളെക്കാൾ പ്രധാനമാണെന്ന താരതമ്യമാണ്; മലയാളത്തിൽ സ്വാഭാവികമായി അതു വ്യക്തമാക്കുന്നു.
- source_word: τροφῆς
  choice: ആഹാരം
  rationale: ജീവനെ നിലനിർത്തുന്ന ഭക്ഷണത്തെ സൂചിപ്പിക്കുന്ന വ്യക്തവും മാന്യവുമായ പദം.
- source_word: ἐνδύματος
  choice: വസ്ത്രം
  rationale: പൊതുവായ ധരിക്കാനുള്ള വസ്തുവിനെ സൂചിപ്പിക്കുകയും ആഹാരത്തോടുള്ള സമാന്തരഘടന നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ψυχή എന്ന പദത്തിന്റെ സന്ദർഭാർഥം
  choice: ജീവൻ
  alternative: ആത്മാവ്
  rationale: ഭക്ഷണം, ശരീരം, വസ്ത്രം എന്നീ ഭൗതിക ആവശ്യങ്ങളാണ് സമീപസന്ദർഭം. അതിനാൽ ψυχή ഇവിടെ വ്യക്തിയുടെ ജീവൻ/ജീവിതം എന്ന അർഥത്തിലാണ്; ദേഹത്തിൽനിന്നു വേറിട്ട ആത്മാവിനെക്കുറിച്ചുള്ള സിദ്ധാന്തപരമായ അർഥം വാക്യത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: πλεῖόν എന്ന താരതമ്യത്തിന്റെ സ്വഭാവം
  choice: വിലയേറിയത്
  alternative: കൂടുതലുള്ളത് / വലുതായത്
  rationale: ജീവനും ശരീരവും ആഹാരത്തെയും വസ്ത്രത്തെയുംക്കാൾ പ്രാധാന്യമുള്ളവയാണെന്ന ആലങ്കാരിക വാദം മലയാളത്തിൽ വ്യക്തമായി പകരുന്നു; ദൈവം വലിയ ദാനം നൽകിയെങ്കിൽ ചെറിയ ആവശ്യങ്ങളും നിറവേറ്റുമെന്ന തുടർവാദത്തിന് ഇത് യോജിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ സമാന്തരഘടനയും ആലങ്കാരിക ചോദ്യവും നിലനിർത്തിയിരിക്കുന്നു; ഇടയ്ക്കുള്ള ആശയഭാഗങ്ങൾ വ്യക്തമാക്കാൻ ദീർഘവിരാമചിഹ്നങ്ങൾ ഉപയോഗിച്ചു.
