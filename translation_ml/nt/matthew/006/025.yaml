revisions:
- from: 'അതുകൊണ്ട് ഞാൻ നിങ്ങളോടു പറയുന്നു: നിങ്ങളുടെ ജീവനെക്കുറിച്ച്—എന്തു ഭക്ഷിക്കുമെന്ന്—ആകുലപ്പെടരുത്; നിങ്ങളുടെ ശരീരത്തെക്കുറിച്ച്—എന്തു ധരിക്കുമെന്ന്—ആകുലപ്പെടരുത്. ജീവൻ[a] ആഹാരത്തെക്കാളും ശരീരം വസ്ത്രത്തെക്കാളും വിലയേറിയതല്ലേ?'
  to: 'അതുകൊണ്ട് ഞാൻ നിങ്ങളോടു പറയുന്നു: എന്തു ഭക്ഷിക്കുമെന്നോർത്ത് നിങ്ങളുടെ ജീവനെയും, എന്തു ധരിക്കുമെന്നോർത്ത് നിങ്ങളുടെ ശരീരത്തെയും കുറിച്ച് ആകുലപ്പെടരുത്. ജീവൻ ആഹാരത്തെക്കാളും ശരീരം വസ്ത്രത്തെക്കാളും കൂടുതൽ പ്രാധാന്യമുള്ളതല്ലേ?'
  rationale: The revision retains every source-level element and the existing ψυχή footnote, while making the paired prohibition more idiomatic in modern Malayalam. It also replaces the more interpretively specific ‘വിലയേറിയത്’ with a neutral comparison of importance that better reflects πλεῖον in context.
