id: MAT.6.10
reference: Matthew 6:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐλθέτω ἡ βασιλεία σου, γενηθήτω τὸ θέλημά σου, ὡς ἐν οὐρανῷ καὶ ⸀ἐπὶ γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/010.yaml
  text: May your kingdom come; may your will be done[a], as in heaven, so also on earth.
translation:
  language: ml
  text: അങ്ങയുടെ രാജ്യം വരട്ടെ; അങ്ങയുടെ ഇഷ്ടം സ്വർഗത്തിൽ എന്നപോലെ ഭൂമിയിലും നിറവേറട്ടെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അങ്ങയുടെ രാജ്യം വരട്ടെ; അങ്ങയുടെ ഇഷ്ടം നിറവേറട്ടെ—സ്വർഗത്തിൽ എന്നപോലെ ഭൂമിയിലും’ എന്നു വായിക്കാം; ഇവിടെ ‘സ്വർഗത്തിൽ എന്നപോലെ ഭൂമിയിലും’ എന്നത് രണ്ടു അപേക്ഷകൾക്കും ബാധകമാണെന്നു മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλθέτω
  choice: വരട്ടെ
  rationale: ἔρχομαι എന്ന ക്രിയയുടെ മൂന്നാംപുരുഷ ഏകവചന ആജ്ഞാരൂപം ദൈവത്തോടുള്ള അപേക്ഷയായി വരുന്നു. മലയാളത്തിൽ ‘വരട്ടെ’ ഈ അപേക്ഷാഭാവവും ആജ്ഞാരൂപത്തിന്റെ ഘടനയും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: βασιλεία
  choice: രാജ്യം
  rationale: βασιλεία എന്നത് രാജഭരണം, വാഴ്ച, രാജ്യം എന്നീ അർഥങ്ങൾ വഹിക്കാം. മത്തായിയുടെ സന്ദർഭത്തിലും കർത്താവിന്റെ പ്രാർഥനയുടെ പരിചിതമായ മലയാള പ്രയോഗത്തിലും ‘രാജ്യം’ സ്വാഭാവികമാണ്; ദൈവത്തിന്റെ രാജകീയ വാഴ്ച എന്ന ആശയവും ഇതിൽ ഉൾക്കൊള്ളാം.
- source_word: γενηθήτω
  choice: നിറവേറട്ടെ
  rationale: γίνομαι എന്ന ക്രിയയുടെ മൂന്നാംപുരുഷ ഏകവചന ആജ്ഞാരൂപമാണിത്. θέλημα എന്നതിനോടൊപ്പം ‘ഇഷ്ടം നിറവേറട്ടെ’ എന്നത് സംഭവിക്കുക, പ്രാബല്യത്തിൽ വരുക, നടപ്പാകുക എന്നീ അർഥങ്ങൾ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘ചെയ്യപ്പെടട്ടെ’ എന്ന യാന്ത്രിക രൂപത്തേക്കാൾ പ്രാർഥനാഭാഷയിൽ സുതാര്യമാണ്.
- source_word: θέλημα
  choice: ഇഷ്ടം
  rationale: θέλημα ഒരാൾ ഇച്ഛിക്കുന്നതോ ഉദ്ദേശിക്കുന്നതോ സൂചിപ്പിക്കുന്നു. ‘ഇഷ്ടം’ ദൈവത്തിന്റെ ആഗ്രഹത്തെയും ഉദ്ദേശ്യത്തെയും അമിതമായി വ്യാഖ്യാനിക്കാതെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: ὡς
  choice: എന്നപോലെ
  rationale: ὡς അവതരിപ്പിക്കുന്ന താരതമ്യം മലയാളത്തിൽ ‘എന്നപോലെ’ സ്വാഭാവികവും വ്യക്തവുമാക്കുന്നു.
- source_word: ἐν οὐρανῷ
  choice: സ്വർഗത്തിൽ
  rationale: ἐν സഹിതമുള്ള ഏകവചന οὐρανῷ ഇവിടെ ദൈവത്തിന്റെ സ്വർഗീയ മണ്ഡലത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘സ്വർഗത്തിൽ’ സന്ദർഭോചിതമാണ്.
- source_word: ἐπὶ γῆς
  choice: ഭൂമിയിലും
  rationale: ἐπί + γῆς എന്നത് ‘ഭൂമിയിൽ/ഭൂമിയുടെ മേൽ’ എന്ന സ്ഥലം സൂചിപ്പിക്കുന്നു. മുൻപുള്ള താരതമ്യവുമായി καί ബന്ധിപ്പിക്കുന്നതിനാൽ ‘ഭൂമിയിലും’ എന്ന രൂപം ‘so also on earth’ എന്ന അർഥം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: σου
  choice: അങ്ങയുടെ
  rationale: രണ്ടാംപുരുഷ ഏകവചന ഉടമസ്ഥരൂപത്തെ ദൈവത്തോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയായി ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ ‘അങ്ങയുടെ’ എന്നു നൽകിയിരിക്കുന്നു.
theological_decisions:
- issue: ὡς ἐν οὐρανῷ καὶ ἐπὶ γῆς എന്ന താരതമ്യപദസമുച്ചയത്തിന്റെ വ്യാപ്തി
  choice: മുഖ്യപാഠത്തിൽ ഇത് ഏറ്റവും അടുത്തുള്ള ‘അങ്ങയുടെ ഇഷ്ടം ... നിറവേറട്ടെ’ എന്ന അപേക്ഷയോടു ചേർത്തിരിക്കുന്നു.
  alternative: ‘സ്വർഗത്തിൽ എന്നപോലെ ഭൂമിയിലും’ എന്നത് ‘അങ്ങയുടെ രാജ്യം വരട്ടെ’ എന്നും ‘അങ്ങയുടെ ഇഷ്ടം നിറവേറട്ടെ’ എന്നും ഉള്ള രണ്ടു അപേക്ഷകൾക്കും ഒരുപോലെ ബാധകമാണെന്നു മനസ്സിലാക്കാം.
  rationale: ഗ്രീക്ക് കൈയെഴുത്തുപ്രതികളിലെ വിരാമചിഹ്നങ്ങൾ ഈ വ്യാപ്തി നിർണയിക്കുന്നില്ല; ആധുനിക പതിപ്പുകളിലെ വിരാമം സമ്പാദകീയമാണ്. ഏറ്റവും അടുത്ത വാക്യത്തോടുള്ള ബന്ധം വ്യാകരണപരമായി സ്വാഭാവികമാണെങ്കിലും, രണ്ടു അപേക്ഷകളിലേക്കും വ്യാപിപ്പിക്കുന്ന വായനയും സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ പ്രാർഥനാശൈലി ഉപയോഗിച്ചു. ‘വരട്ടെ’, ‘നിറവേറട്ടെ’ എന്നീ രൂപങ്ങൾ ഗ്രീക്കിലെ മൂന്നാംപുരുഷ ആജ്ഞാരൂപങ്ങളുടെ അപേക്ഷാഭാവം നിലനിർത്തുന്നു. നേരിട്ടുള്ള ദൈവാഭിസംബോധനയിൽ മാന്യതയ്ക്കായി ‘അങ്ങയുടെ’ തിരഞ്ഞെടുത്തു; ഭാഷ അത്യന്തം പുരാതനമോ പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റേതോ ആക്കുന്നത് ഒഴിവാക്കി.
