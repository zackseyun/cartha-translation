id: MAT.6.14
reference: Matthew 6:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐὰν γὰρ ἀφῆτε τοῖς ἀνθρώποις τὰ παραπτώματα αὐτῶν, ἀφήσει καὶ ὑμῖν ὁ πατὴρ ὑμῶν ὁ οὐράνιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/014.yaml
  text: For if you forgive people their trespasses[b][a], your heavenly Father will also forgive you.
translation:
  language: ml
  text: കാരണം, മനുഷ്യരുടെ അതിക്രമങ്ങൾ നിങ്ങൾ ക്ഷമിച്ചാൽ, നിങ്ങളുടെ സ്വർഗീയ പിതാവും നിങ്ങളോടു ക്ഷമിക്കും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: കാരണം, ... എങ്കിൽ/ചെയ്താൽ
  rationale: γάρ മുൻവാക്യത്തിലെ പ്രാർഥനയോടുള്ള വിശദീകരണബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ ‘കാരണം’ നിലനിർത്തി; ἐάν സഹിതമുള്ള ഉപാധി മലയാളത്തിൽ സ്വാഭാവികമായ ‘ചെയ്താൽ’ എന്ന രൂപത്തിൽ നൽകി.
- source_word: ἀφῆτε
  choice: ക്ഷമിച്ചാൽ
  rationale: വ്യക്തികൾ തമ്മിലുള്ള ധാർമിക അതിക്രമങ്ങളുടെ സന്ദർഭത്തിൽ ἀφίημι ‘ക്ഷമിക്കുക’ എന്നാണ്; വാക്യത്തിലെ രണ്ടാമത്തെ ἀφίημι രൂപവുമായുള്ള പദബന്ധവും നിലനിർത്തുന്നു.
- source_word: τοῖς ἀνθρώποις
  choice: മനുഷ്യരോട്
  rationale: ἄνθρωποι പുരുഷന്മാരെ മാത്രം അല്ല, പൊതുവായി മനുഷ്യരെ സൂചിപ്പിക്കുന്നു; ‘മനുഷ്യരോട്’ അർത്ഥവും ദത്തിവ് ബന്ധവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὰ παραπτώματα αὐτῶν
  choice: അവരുടെ അതിക്രമങ്ങൾ
  rationale: παράπτωμα ധാർമികമായ വഴുതൽ, ലംഘനം, കുറ്റം എന്നിവയെ സൂചിപ്പിക്കുന്നു. ‘അതിക്രമങ്ങൾ’ ഈ ധാർമിക-ബന്ധപരമായ ഭാരം വ്യക്തമായി വഹിക്കുന്നു.
- source_word: ἀφήσει καὶ ὑμῖν
  choice: നിങ്ങളുടെ ... പിതാവും നിങ്ങളോടു ക്ഷമിക്കും
  rationale: ἀφίημι രണ്ടിടത്തും ‘ക്ഷമിക്കുക’ എന്ന ഒരേ പദംകൊണ്ട് നൽകി. καί സൂചിപ്പിക്കുന്ന അനുരൂപത ‘പിതാവും’ എന്ന ചേർക്കൽവഴി സ്വാഭാവികമായി പ്രകടമാക്കി.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: നിങ്ങളുടെ സ്വർഗീയപിതാവ്
  rationale: ആർട്ടിക്കിളോടുകൂടിയ വിശേഷണപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികവും ഭക്തിഗൗരവമുള്ളതുമായ ‘സ്വർഗീയപിതാവ്’ എന്നു നൽകി; ‘നിങ്ങളുടെ’ എന്ന ബന്ധസൂചനയും സംരക്ഷിച്ചു.
theological_decisions:
- issue: മനുഷ്യർ ക്ഷമിക്കുന്നതും ദൈവം ക്ഷമിക്കുന്നതും തമ്മിലുള്ള ഉപാധിബന്ധം
  choice: മൂലഗ്രീക്കിലുള്ള യഥാർഥ ഉപാധിപ്രസ്താവന നേരിട്ട് നിലനിർത്തി.
  alternative: മനുഷ്യന്റെ ക്ഷമ ദൈവക്ഷമ സമ്പാദിക്കുന്നു എന്ന ശക്തമായ കാരണവായന; അല്ലെങ്കിൽ മുൻകൂട്ടിയുള്ള ദൈവക്ഷമയുടെ തെളിവു മാത്രമാണ് മനുഷ്യന്റെ ക്ഷമ എന്ന വായന.
  rationale: ഗ്രീക്ക് വാക്യം ഒരു വ്യക്തമായ ഉപാധി അവതരിപ്പിക്കുന്നു. ഏതെങ്കിലും പ്രത്യേക സിദ്ധാന്തചട്ടക്കൂടനുസരിച്ച് അതിനെ കാരണമെന്നോ തെളിവെന്നോ നിർണയിക്കാതെ അതിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, ഗൗരവമുള്ള ശൈലി. ‘സ്വർഗീയപിതാവ്’ മത്തായിയുടെ പ്രയോഗത്തിന് യോജിച്ച സ്വാഭാവിക സംയുക്തപദമായി ഉപയോഗിച്ചു. പ്രസിദ്ധീകരണപാഠത്തിൽ അടിക്കുറിപ്പുകളില്ലാത്തതിനാൽ മുഖ്യപാഠത്തിൽ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളുമില്ല.
