revisions:
- from: കാരണം, നിങ്ങൾ മനുഷ്യരോട് അവരുടെ അതിക്രമങ്ങൾ ക്ഷമിച്ചാൽ, നിങ്ങളുടെ സ്വർഗീയപിതാവും നിങ്ങളോടു ക്ഷമിക്കും.
  to: കാരണം, മനുഷ്യരുടെ അതിക്രമങ്ങൾ നിങ്ങൾ ക്ഷമിച്ചാൽ, നിങ്ങളുടെ സ്വർഗീയ പിതാവും നിങ്ങളോടു ക്ഷമിക്കും.
