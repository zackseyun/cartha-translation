id: MAT.6.31
reference: Matthew 6:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μὴ οὖν μεριμνήσητε λέγοντες· Τί φάγωμεν; ἤ· Τί πίωμεν; ἤ· Τί περιβαλώμεθα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/031.yaml
  text: Therefore do not worry[a], saying, ‘What will we eat?’ or ‘What will we drink?’ or ‘What will we wear?’
translation:
  language: ml
  text: അതുകൊണ്ട്, ‘നാം എന്തു കഴിക്കും?’ അല്ലെങ്കിൽ ‘എന്തു കുടിക്കും?’ അല്ലെങ്കിൽ ‘എന്തു ധരിക്കും?’ എന്നു പറഞ്ഞ് ആകുലപ്പെടരുത്[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ഉത്കണ്ഠപ്പെടരുത്.’
    reason: μεριμνάω എന്ന പദത്തിന്റെ സന്ദർഭോചിതമായ മറ്റൊരു മലയാള പരിഭാഷ.
lexical_decisions:
- source_word: μὴ οὖν μεριμνήσητε
  choice: അതുകൊണ്ട് ... ആകുലപ്പെടരുത്
  rationale: οὖν മുൻവാദത്തിൽനിന്നുള്ള നിഗമനത്തെ ‘അതുകൊണ്ട്’ എന്നു വ്യക്തമാക്കുന്നു. μεριμνάω ഇവിടെ ജീവിതാവശ്യങ്ങളെക്കുറിച്ചുള്ള ഉത്കണ്ഠാഭരിതമായ ചിന്തയെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ആകുലപ്പെടരുത്’ നിരോധനത്തിന്റെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: λέγοντες
  choice: എന്നു പറഞ്ഞ്
  rationale: ആകുലത പ്രകടമാകുന്ന രീതിയും അതിന്റെ ഉള്ളടക്കവും വ്യക്തമാക്കുന്ന ഗ്രീക്ക് വർത്തമാന കൃദന്തരൂപത്തെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: Τί
  choice: എന്തു
  rationale: അടിസ്ഥാന ആവശ്യങ്ങളെക്കുറിച്ചുള്ള നേരിട്ടുള്ള ചോദ്യങ്ങൾക്ക് ലളിതവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: φάγωμεν
  choice: നാം എന്തു കഴിക്കും?
  rationale: ആലോചനാത്മകമായ aorist subjunctive ഭാവിയിലെ ഉപജീവനത്തെക്കുറിച്ചുള്ള ആശങ്ക പ്രകടിപ്പിക്കുന്നു; ‘കഴിക്കും’ അത് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: πίωμεν
  choice: എന്തു കുടിക്കും?
  rationale: φάγωμεν എന്നതിനോടു സമാന്തരമായ ആലോചനാത്മക ചോദ്യം; മലയാളത്തിൽ ആവർത്തിച്ച ‘നാം’ ഒഴിവാക്കിയാലും ബഹുവചന കർത്താവ് വ്യക്തമാണ്.
- source_word: περιβαλώμεθα
  choice: എന്തു ധരിക്കും?
  rationale: സന്ദർഭത്തിൽ περιβάλλω വസ്ത്രം ധരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ധരിക്കും’ അക്ഷരാർഥത്തിലെ പ്രത്യാവർത്തനഭാവം കൃത്രിമമായി ഇറക്കുമതി ചെയ്യാതെ അർഥം കൃത്യമായി നൽകുന്നു.
- source_word: ἤ ... ἤ ... ἤ
  choice: അല്ലെങ്കിൽ ... അല്ലെങ്കിൽ
  rationale: മൂന്നു ആശങ്കാചോദ്യങ്ങൾക്കിടയിലെ ഗ്രീക്ക് വികൽപബന്ധം മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു; ആദ്യ ചോദ്യത്തിനു മുമ്പുള്ള ഗ്രീക്ക് ἤ-യ്ക്ക് മലയാളഘടനയിൽ പ്രത്യേക പദം ആവശ്യമില്ല.
theological_decisions:
- issue: ഭൗതിക ആവശ്യങ്ങളെക്കുറിച്ചുള്ള യേശുവിന്റെ നിരോധനത്തിന്റെ സ്വഭാവം
  choice: μεριμνήσητε എന്നത് ഉത്തരവാദിത്തമുള്ള മുൻകരുതലിനെ മുഴുവനായി നിരോധിക്കുന്നതല്ല, ഉത്കണ്ഠാഭരിതമായ ആകുലതയെ നിരോധിക്കുന്നതായി വിവർത്തനം ചെയ്തു.
  alternative: ഒട്ടും ചിന്തിക്കരുത്
  rationale: ഉടൻമുമ്പും പിന്നാലെയുമുള്ള സന്ദർഭം ആഹാരം, പാനം, വസ്ത്രം എന്നിവയുടെ ലഭ്യതയെക്കുറിച്ചുള്ള ഉത്കണ്ഠയാണ് കൈകാര്യം ചെയ്യുന്നത്. ‘ആകുലപ്പെടരുത്’ വാക്യത്തിന്റെ ശക്തി നിലനിർത്തുകയും പാഠത്തിൽ ഇല്ലാത്ത സമ്പൂർണ ആസൂത്രണനിരോധനം ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ യേശുവിന്റെ ഉപദേശത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. മൂന്നു നേരിട്ടുള്ള ചോദ്യങ്ങളുടെ ആവർത്തനഘടനയും വാക്യത്തിന്റെ നിഗമനസ്വഭാവവും സംരക്ഷിച്ചു.
