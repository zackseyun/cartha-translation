id: MAT.6.15
reference: Matthew 6:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐὰν δὲ μὴ ἀφῆτε τοῖς ⸀ἀνθρώποις, οὐδὲ ὁ πατὴρ ὑμῶν ἀφήσει τὰ παραπτώματα ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/015.yaml
  text: But if you do not forgive people[a], neither will your Father forgive your trespasses.
translation:
  language: ml
  text: എന്നാൽ നിങ്ങൾ മനുഷ്യരോടു ക്ഷമിക്കാതിരുന്നാൽ, നിങ്ങളുടെ പിതാവും നിങ്ങളുടെ അതിക്രമങ്ങൾ ക്ഷമിക്കുകയില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν δὲ μὴ
  choice: എന്നാൽ ... ഇല്ലെങ്കിൽ
  rationale: ἐάν നിബന്ധനയും δέ മുൻവാക്യത്തോടുള്ള വൈരുധ്യവും μή നിഷേധവും സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ നിബന്ധനാരൂപം ഉപയോഗിച്ചു.
- source_word: ἀφῆτε
  choice: ക്ഷമിക്കാതിരുന്നാൽ
  rationale: ഇവിടെ ἀφίημι മനുഷ്യർ ചെയ്ത തെറ്റുകൾ ക്ഷമിക്കുക എന്ന അർഥത്തിലാണ്; നിബന്ധനയിലെ നിഷേധം ക്രിയയോടു ചേർത്തു.
- source_word: τοῖς ἀνθρώποις
  choice: മനുഷ്യരോട്
  rationale: ἄνθρωποι ലിംഗഭേദമില്ലാതെ മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു; അതിനാൽ ‘മനുഷ്യർ’ എന്ന പൊതുപദം നിലനിർത്തി.
- source_word: οὐδὲ
  choice: പിതാവും ... ഇല്ല
  rationale: നിഷേധാത്മകമായ അനുരൂപത മലയാളത്തിലെ ‘-ഉം ... ഇല്ല’ ഘടനയിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കി.
- source_word: ὁ πατὴρ ὑμῶν
  choice: നിങ്ങളുടെ പിതാവ്
  rationale: ഗ്രീക്കിൽ ‘സ്വർഗീയ’ എന്ന വിശേഷണം ഇല്ലാത്തതിനാൽ അത് ചേർക്കാതെ നേരിട്ട് വിവർത്തനം ചെയ്തു.
- source_word: ἀφήσει
  choice: ക്ഷമിക്കുകയില്ല
  rationale: ആദ്യത്തെ ἀφίημι എന്ന ക്രിയയുമായുള്ള പദപരമായ ആവർത്തനവും പരസ്പരഘടനയും നിലനിർത്താൻ ‘ക്ഷമിക്കുക’ തന്നെയുപയോഗിച്ചു.
- source_word: τὰ παραπτώματα ὑμῶν
  choice: നിങ്ങളുടെ അതിക്രമങ്ങൾ
  rationale: παράπτωμα ധാർമികമായ തെറ്റ്, ലംഘനം, അതിക്രമം എന്നിവ സൂചിപ്പിക്കുന്നു; ആ ഗൗരവം സ്വാഭാവിക മലയാളത്തിൽ ‘അതിക്രമങ്ങൾ’ നിലനിർത്തുന്നു.
theological_decisions:
- issue: മനുഷ്യർ ക്ഷമിക്കുന്നതും ദൈവം ക്ഷമിക്കുന്നതും തമ്മിലുള്ള നിബന്ധനാപരമായ ബന്ധം
  choice: വാക്യത്തിലെ നേരിട്ടുള്ള നിബന്ധനയും അതിന്റെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും അതേപടി നിലനിർത്തി.
  alternative: ഇത് മനുഷ്യന്റെ ക്ഷമ ദൈവക്ഷമയുടെ തെളിവു മാത്രമാണെന്നോ, ദൈവവുമായുള്ള കൂട്ടായ്മയുടെ നഷ്ടം മാത്രമാണെന്നോ വ്യാഖ്യാനിച്ച് മൃദൂകരിക്കുക.
  rationale: ഗ്രീക്ക് വാചകം നേരിട്ടുള്ള നിബന്ധനയാണ് അവതരിപ്പിക്കുന്നത്. വിവർത്തനം വിശാലമായ ദൈവശാസ്ത്രവാദങ്ങൾ പരിഹരിക്കാൻ ശ്രമിക്കാതെ വാചകത്തിന്റെ അവകാശവാദം അതേപടി അറിയിക്കണം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘മനുഷ്യർ’ ലിംഗഭേദമില്ലാത്ത പൊതുപദമാണ്. ഉറവിടത്തിൽ ‘അവരുടെ തെറ്റുകൾ’ എന്ന കർമപദം പ്രത്യക്ഷമായി ഇല്ലെങ്കിലും ἀφῆτε τοῖς ἀνθρώποις എന്നതിന്റെ സന്ദർഭാർഥം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാക്കാൻ അത് തുറന്നുപറഞ്ഞു; രണ്ടാമത്തെ ഭാഗത്തിലെ ‘അതിക്രമങ്ങൾ’ ഉറവിടത്തിലെ παράπτωμα നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
