id: MAT.28.3
reference: Matthew 28:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἦν δὲ ἡ εἰδέα αὐτοῦ ⸀ὡς ἀστραπὴ καὶ τὸ ἔνδυμα αὐτοῦ λευκὸν ὡς χιών.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/003.yaml
  text: His appearance was like lightning[a], and his clothing white as snow.
translation:
  language: ml
  text: അവന്റെ രൂപം മിന്നൽപോലെയും[a] അവന്റെ വസ്ത്രം മഞ്ഞുപോലെ വെളുത്തതുമായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘രൂപം’ എന്നതിന് ‘കാഴ്ച’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയില്ല
  rationale: ഇവിടെ δέ ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്ന മൃദുവായ ബന്ധകമാണ്; മലയാളത്തിൽ വാക്യക്രമംതന്നെ ആ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: εἰδέα
  choice: രൂപം
  rationale: കാണപ്പെടുന്ന ബാഹ്യരൂപം അഥവാ ദൃശ്യമാനം എന്ന അർഥം നൽകുന്നു; സാധാരണ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: ὡς ἀστραπή
  choice: മിന്നൽപോലെ
  rationale: ὡς സൂചിപ്പിക്കുന്ന ഉപമ ചുരുക്കമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: ἔνδυμα
  choice: വസ്ത്രം
  rationale: പ്രത്യേക വസ്ത്രതരം നിർണ്ണയിക്കാതെ പൊതുവായ അർഥം സംരക്ഷിക്കുന്നു.
- source_word: λευκόν
  choice: വെളുത്തത്
  rationale: മൂലത്തിലെ ലളിതമായ വർണവിവരണം അധിക തീവ്രത ചേർക്കാതെ നൽകുന്നു.
- source_word: ὡς χιών
  choice: മഞ്ഞുപോലെ
  rationale: വസ്ത്രത്തിന്റെ വെണ്മയെ മഞ്ഞിനോട് താരതമ്യപ്പെടുത്തുന്ന രണ്ടാമത്തെ ഉപമ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: αὐτοῦ എന്ന സർവനാമത്തിന്റെ സൂചിതവ്യക്തി
  choice: മുൻവാക്യത്തിൽ പറഞ്ഞ കർത്താവിന്റെ ദൂതനെയാണ് സർവനാമം സൂചിപ്പിക്കുന്നത്; എങ്കിലും മൂലപാഠംപോലെ ഇവിടെ ‘അവന്റെ’ എന്നു മാത്രം നിലനിർത്തി.
  alternative: പുനരുത്ഥാനസന്ദർഭം കാരണം ഇത് യേശുവിനെ സൂചിപ്പിക്കുന്നതായി തെറ്റിദ്ധരിക്കാം; വ്യക്തതയ്ക്കായി ‘ദൂതന്റെ’ എന്നു ചേർക്കാമായിരുന്നു.
  rationale: ഏറ്റവും അടുത്ത പൂർവപദം മത്തായി 28:2-ലെ കർത്താവിന്റെ ദൂതനാണ്. എന്നാൽ ഈ വാക്യത്തിൽ ഗ്രീക്ക് നാമം ആവർത്തിക്കാത്തതിനാൽ പരിഭാഷയിലും സർവനാമം സംരക്ഷിക്കുന്നത് മൂലത്തിന്റെ ഘടനയും സന്ദർഭാശ്രിതത്വവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. സമാന്തരമായ രണ്ട് ഉപമകളും ‘മിന്നൽപോലെ’, ‘മഞ്ഞുപോലെ’ എന്ന രൂപത്തിൽ നിലനിർത്തി; ദൂതനെന്ന നാമം മൂലത്തിൽ ഇല്ലാത്തതിനാൽ വാക്യത്തിൽ ചേർത്തിട്ടില്ല.
