id: MAT.28.12
reference: Matthew 28:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ συναχθέντες μετὰ τῶν πρεσβυτέρων συμβούλιόν τε λαβόντες ἀργύρια ἱκανὰ ἔδωκαν τοῖς στρατιώταις
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/012.yaml
  text: And after gathering with the elders and taking counsel[a], they gave a considerable sum of silver to the soldiers,
translation:
  language: ml
  text: അവർ മൂപ്പന്മാരോടൊപ്പം കൂടിവന്ന് ആലോചിച്ചശേഷം സൈനികർക്ക് ഗണ്യമായ അളവിൽ വെള്ളിപ്പണം കൊടുത്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συναχθέντες
  choice: കൂടിവന്ന്
  rationale: സυνάγω എന്ന ക്രിയയുടെ ഭൂതകാല പങ്കാളിത്തരൂപം ഇവിടെ ഒരുമിച്ചുകൂടിയതിനെ സൂചിപ്പിക്കുന്നു; മുഖ്യക്രിയയ്ക്കു മുമ്പുള്ള സംഭവക്രമം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: μετὰ τῶν πρεσβυτέρων
  choice: മൂപ്പന്മാരോടൊപ്പം
  rationale: μετά + genitive സഹവർത്തിത്വം സൂചിപ്പിക്കുന്നു; ഈ നേതൃത്വസന്ദർഭത്തിൽ πρεσβύτεροι എന്നതിന് ‘മൂപ്പന്മാർ’ എന്നത് പതിവും യോജിച്ചതുമായ പരിഭാഷയാണ്.
- source_word: συμβούλιόν τε λαβόντες
  choice: ആലോചിച്ചശേഷം
  rationale: συμβούλιον λαμβάνω എന്ന പ്രയോഗം കൂടിയാലോചിക്കുകയോ പദ്ധതി രൂപപ്പെടുത്തുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആശയവിനിമയത്തിന്റെ കൂട്ടായ സ്വഭാവം സന്ദർഭം നൽകുന്നതിനാൽ മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അവതരിപ്പിച്ചു.
- source_word: ἀργύρια ἱκανὰ
  choice: ഗണ്യമായൊരു തുക വെള്ളിപ്പണം
  rationale: ἀργύρια വെള്ളിപ്പണമെന്ന ഭൗതിക-ധനാർഥം വഹിക്കുന്നു; ἱκανὰ ഇവിടെ അളവ് ഗണ്യമോ വലുതോ ആയിരുന്നുവെന്ന് സൂചിപ്പിക്കുന്നു. ‘തുക’ ചേർക്കുന്നത് മലയാളത്തിൽ സ്വാഭാവികമാക്കുന്നു.
- source_word: ἔδωκαν
  choice: കൊടുത്തു
  rationale: δίδωμι എന്ന ലളിതമായ മുഖ്യക്രിയയുടെ നേരിട്ടുള്ള, സ്വാഭാവിക മലയാളരൂപം.
- source_word: τοῖς στρατιώταις
  choice: പടയാളികൾക്ക്
  rationale: στρατιώτης എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘പടയാളി’ ആണ്; സന്ദർഭത്തിലെ കാവൽചുമതല മാത്രം മുൻനിർത്തി ‘കാവൽക്കാർ’ എന്നു പരിമിതപ്പെടുത്തുന്നില്ല.
theological_decisions:
- issue: വ്യക്തമായി പറയാത്ത കർത്താവിന്റെ തിരിച്ചറിയൽ
  choice: ‘അവർ’ മുൻവാക്യത്തിലെ മുഖ്യപുരോഹിതന്മാരെ സൂചിപ്പിക്കുന്നു
  alternative: വ്യക്തമായി തിരിച്ചറിയാത്ത ഒരു സംഘം
  rationale: പങ്കാളിത്തരൂപങ്ങളും മുഖ്യക്രിയയും പുല്ലിംഗ ബഹുവചനത്തിലാണ്; മത്തായി 28:11-ലെ മുഖ്യപുരോഹിതന്മാരാണ് തുടർന്നുള്ള കർത്താവ്. എങ്കിലും ഗ്രീക്ക് അവരെ വീണ്ടും പേരെടുത്തുപറയാത്തതിനാൽ പരിഭാഷയും ‘അവർ’ എന്നു മാത്രം പറയുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം ഗൗരവമുള്ളതുമായ ശൈലി. പങ്കാളിത്തഘടനയുടെ സംഭവക്രമം സ്വാഭാവിക മലയാളവാക്യമായി പുനഃക്രമീകരിച്ചു. ഇംഗ്ലീഷ് പാഠത്തിലെ [a] അടിക്കുറിപ്പ് വാക്യത്തിലെ തെറ്റായ സ്ഥാനത്താണെന്ന് തോന്നുന്നു; അതിന്റെ ഉള്ളടക്കം ‘considerable silver’ എന്നതിന്റെ തന്നെ പുനർവ്യാഖ്യാനമായതിനാൽ ഇവിടെ പ്രത്യേകം അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
