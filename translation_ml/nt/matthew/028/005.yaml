  terminology: ‘ദൂതൻ,’ ‘സ്ത്രീകൾ,’ ‘ക്രൂശിക്കപ്പെട്ട,’ and ‘യേശു’ are suitable and consistent biblical Malayalam terminology. The explicit ‘നിങ്ങൾ’ appropriately retains the emphasis of ὑμεῖς without introducing an unwarranted contrast.
