id: MAT.28.5
reference: Matthew 28:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ ἄγγελος εἶπεν ταῖς γυναιξίν· Μὴ φοβεῖσθε ὑμεῖς, οἶδα γὰρ ὅτι Ἰησοῦν τὸν ἐσταυρωμένον ζητεῖτε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/005.yaml
  text: But the angel answered and said to the women[a], “Do not be afraid[b]; for I know that you are seeking Jesus who has been crucified.”
translation:
  language: ml
  text: 'എന്നാൽ ദൂതൻ സ്ത്രീകളോടു മറുപടിയായി പറഞ്ഞു: “നിങ്ങൾ ഭയപ്പെടേണ്ടാ[a]. കാരണം, ക്രൂശിക്കപ്പെട്ട യേശുവിനെയാണ് നിങ്ങൾ അന്വേഷിക്കുന്നതെന്ന് എനിക്കറിയാം[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ‘നിങ്ങൾ’ എന്ന സർവനാമം പ്രത്യേകം ചേർത്തിരിക്കുന്നത് ഈ ആശ്വാസം സ്ത്രീകളോടുതന്നെ ഊന്നിപ്പറയുന്നതായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ക്രൂശിക്കപ്പെട്ടവനായ യേശുവിനെയാണ് നിങ്ങൾ അന്വേഷിക്കുന്നത്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν
  choice: എന്നാൽ ... മറുപടിയായി പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ സാധാരണ ആഖ്യാനപ്രയോഗമായ ‘ഉത്തരം പറഞ്ഞുകൊണ്ട് പറഞ്ഞു’ എന്ന ഘടനയുടെ അർഥം നിലനിർത്തിക്കൊണ്ട്, മലയാളത്തിൽ സ്വാഭാവികമായ ‘മറുപടിയായി പറഞ്ഞു’ എന്നു നൽകി; δέ സൂചിപ്പിക്കുന്ന മൃദുവായ വഴിത്തിരിവിന് ‘എന്നാൽ’ ഉപയോഗിച്ചു.
- source_word: ὁ ἄγγελος
  choice: ദൂതൻ
  rationale: ഈ ഉയിർത്തെഴുന്നേൽപ്പ്-സന്ദർഭത്തിൽ മനുഷ്യസന്ദേശവാഹകനല്ല, ദൈവിക ദൂതനാണ് ഉദ്ദേശിക്കുന്നത്; മലയാള ബൈബിൾഭാഷയിൽ ‘ദൂതൻ’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: ταῖς γυναιξίν
  choice: സ്ത്രീകളോട്
  rationale: γυνή എന്ന പദത്തിന്റെ ബഹുവചനത്തിന് ഈ സന്ദർഭത്തിൽ ‘ഭാര്യമാർ’ എന്നല്ല, പ്രായപൂർത്തിയായ സ്ത്രീകൾ എന്ന പൊതുവായ അർഥമാണ്.
- source_word: Μὴ φοβεῖσθε ὑμεῖς
  choice: നിങ്ങൾ ഭയപ്പെടേണ്ടാ
  rationale: നിഷേധാത്മക കല്പനയെ സ്വാഭാവികമായ ആശ്വാസവാക്യമായി നൽകി. ഗ്രീക്കിൽ നിർബന്ധമില്ലാത്ത കർത്തൃസർവനാമം വ്യക്തമായി വന്നിരിക്കുന്നതിനാൽ മലയാളത്തിലും ‘നിങ്ങൾ’ നിലനിർത്തി.
- source_word: οἶδα γὰρ ὅτι
  choice: …എന്ന് എനിക്കറിയാം
  rationale: γάρ നൽകുന്ന കാരണബന്ധം മലയാളത്തിലെ വാക്യക്രമത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; ὅτι അറിവിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു.
- source_word: Ἰησοῦν τὸν ἐσταυρωμένον
  choice: ക്രൂശിക്കപ്പെട്ട യേശുവിനെ
  rationale: പൂർണമായ ക്രൂശിക്കൽപ്രവൃത്തിയും അതിന്റെ നിലനിൽക്കുന്ന ഫലവും സൂചിപ്പിക്കുന്ന perfect passive participle-നെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ζητεῖτε
  choice: നിങ്ങൾ അന്വേഷിക്കുന്നു
  rationale: വർത്തമാനകാലത്തിലുള്ള തുടരുന്ന തിരച്ചിലിനെ ‘അന്വേഷിക്കുന്നു’ എന്നു നൽകി; ലക്ഷ്യത്തെ ഊന്നാൻ ‘യേശുവിനെയാണ്’ എന്ന രൂപം ഉപയോഗിച്ചു.
theological_decisions:
- issue: ὑμεῖς എന്ന ഊന്നലുള്ള സർവനാമം
  choice: മുഖ്യവാക്യത്തിൽ ‘നിങ്ങൾ’ വ്യക്തമായി നിലനിർത്തി; അടിക്കുറിപ്പിൽ ഊന്നൽ വിശദീകരിച്ചു.
  alternative: ‘ഭയപ്പെടേണ്ടാ’ എന്നു മാത്രം പറയുക; അല്ലെങ്കിൽ ‘നിങ്ങളോ ഭയപ്പെടേണ്ടാ’ എന്നു ശക്തമായ വിരോധസൂചന നൽകുക.
  rationale: ഗ്രീക്ക് സ്ത്രീകളെ പ്രത്യേകമായി അഭിസംബോധന ചെയ്യുന്നു; എന്നാൽ ആരോടുള്ള വ്യക്തമായ വിരോധമാണെന്ന് വാക്യം നിർണ്ണയിക്കുന്നില്ല. അതിനാൽ ‘നിങ്ങളോ’ എന്ന അധികവ്യാഖ്യാനം ഒഴിവാക്കി യഥാർഥ ഊന്നൽ മാത്രം സൂക്ഷിച്ചു.
- issue: τὸν ἐσταυρωμένον എന്ന perfect passive participle
  choice: ‘ക്രൂശിക്കപ്പെട്ട യേശു’
  alternative: ‘ക്രൂശിക്കപ്പെട്ടവനായ യേശു’; ‘ക്രൂശിക്കപ്പെട്ടിരുന്ന യേശു’
  rationale: ക്രൂശിക്കൽ പൂർത്തിയായ സംഭവമാണെന്ന അർഥം നിലനിർത്തുന്നു; ‘ഇരുന്ന’ എന്ന രൂപം അനാവശ്യമായ കാലാർഥമോ ഇപ്പോൾ അതല്ലെന്ന ധ്വനിയോ സൃഷ്ടിക്കാവുന്നതിനാൽ ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. പരമ്പരാഗതമായെങ്കിലും സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ‘ദൂതൻ’, ‘ക്രൂശിക്കപ്പെട്ട’ എന്നീ പദങ്ങൾ നിലനിർത്തി; ഗ്രീക്ക് വാക്യഘടനയുടെ കൃത്രിമമായ അനുകരണം ഒഴിവാക്കി.
