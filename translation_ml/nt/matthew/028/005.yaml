  - severity: low
    issue: The imperative ending ‘ഭയപ്പെടേണ്ടാ’ is somewhat less current than necessary for the specified modern-standard register.
    rationale: ‘ഭയപ്പെടേണ്ട’ retains the same reassurance and has more neutral contemporary standard usage.
