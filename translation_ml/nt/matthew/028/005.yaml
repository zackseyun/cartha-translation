  source_fidelity: The draft accurately represents the angel’s response, the women, the explicit emphatic ‘you,’ Jesus as the crucified one, and their ongoing seeking. However, γάρ (‘for’) is only implicit in the current Malayalam wording; adding ‘കാരണം’ preserves the stated explanatory connection without altering the meaning.
