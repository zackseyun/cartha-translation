lexical_decisions:
- source_word: ἰδόντες
  choice: കണ്ടപ്പോൾ
  rationale: ὁράω എന്ന ക്രിയയുടെ aorist participle ഇവിടെ പ്രധാനക്രിയകളോടുള്ള കാലബന്ധം സൂചിപ്പിക്കുന്നു; ‘കണ്ടപ്പോൾ’ അത് സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: προσεκύνησαν
  choice: ആരാധിച്ചു
  rationale: προσκυνέω എന്നതിന് സാഷ്ടാംഗം വീഴുക, ആദരാഞ്ജലി അർപ്പിക്കുക, ആരാധിക്കുക എന്നീ അർത്ഥങ്ങൾ വരാം. ഉയിർത്തെഴുന്നേറ്റ യേശുവിനോടുള്ള പ്രവൃത്തിയായ ഈ സന്ദർഭത്തിൽ ‘ആരാധിച്ചു’ എന്നത് പദത്തിന്റെ ഭക്തിപൂർവമായ ശക്തി ഏറ്റവും നന്നായി പ്രകടിപ്പിക്കുന്നു.
- source_word: οἱ δὲ
  choice: എന്നാൽ ചിലർ
  rationale: ലേഖനപദത്തോടുകൂടിയ δέ ഇവിടെ മുമ്പ് പറഞ്ഞ കൂട്ടത്തിലെ ഒരു വിഭാഗത്തെ വിരുദ്ധമായി വേർതിരിച്ചുകാട്ടുന്ന അപൂർണ പ്രയോഗമാണ്; മലയാളത്തിൽ ‘എന്നാൽ ചിലർ’ എന്നു പറയുന്നത് ആ വിഭാഗാർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἐδίστασαν
  choice: സംശയിച്ചു
  rationale: διστάζω എന്നതിന് സംശയിക്കുക, മടിക്കുക, ചാഞ്ചാടുക എന്നീ അർത്ഥങ്ങളുണ്ട്. ‘സംശയിച്ചു’ പ്രധാനാർഥം നൽകുന്നു; ഉറച്ച അവിശ്വാസമല്ലാതെ അനിശ്ചിതത്വമോ മടിയോ ആയിരിക്കാമെന്ന സൂക്ഷ്മത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഉയിർത്തെഴുന്നേറ്റ യേശുവിനോടുള്ള προσκυνέω എന്ന പദത്തിന്റെ ശക്തി
  choice: ‘ആരാധിച്ചു’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: ‘അവന്റെ മുമ്പിൽ കുമ്പിട്ടു’ അല്ലെങ്കിൽ ‘അവന് ആദരാഞ്ജലി അർപ്പിച്ചു’
  rationale: പുനരുത്ഥാനാനന്തരമായ മത്തായിയുടെ ആഖ്യാനസന്ദർഭത്തിൽ, യേശുവിനെയാണ് പ്രവൃത്തി ലക്ഷ്യമാക്കുന്നത്; അതിനാൽ ഗ്രീക്ക് പദത്തിന്റെ പരിധി ലംഘിക്കാതെ അതിന്റെ ദൈവശാസ്ത്രപരമായ ഭാരം ‘ആരാധിച്ചു’ സംരക്ഷിക്കുന്നു.
- issue: διστάζω എന്ന പദത്തിലെ സംശയവും മടിയും തമ്മിലുള്ള സൂക്ഷ്മത
  choice: പ്രധാനപാഠത്തിൽ ‘സംശയിച്ചു’
  alternative: ‘മടിച്ചു’ അല്ലെങ്കിൽ ‘ചാഞ്ചാടി’
  rationale: ഗ്രീക്ക് പദം ഉറച്ച അവിശ്വാസത്തെക്കാൾ മടിച്ചുനിൽക്കുന്നതോ അനിശ്ചിതത്വത്തിൽ ചാഞ്ചാടുന്നതോ സൂചിപ്പിക്കാം. പ്രധാനപാഠം പരിചിതമായ അർത്ഥം നൽകുമ്പോൾ അടിക്കുറിപ്പ് യഥാർഥമായ അർത്ഥവ്യാപ്തിയും ആഖ്യാനത്തിലെ പിരിമുറുക്കവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘അവനെ’ എന്ന ആവർത്തനം ഗ്രീക്കിലെ αὐτόν എന്ന നേരിട്ടുള്ള സൂചനയും യേശുവാണ് ആരാധനയുടെ ലക്ഷ്യമെന്ന വ്യക്തതയും നിലനിർത്തുന്നു. അടിക്കുറിപ്പിന്റെ അടയാളം അർത്ഥവൈകല്യം ബാധിക്കുന്ന ‘സംശയിച്ചു’ എന്ന പദത്തിന് പിന്നാലെ വെച്ചിരിക്കുന്നു.
