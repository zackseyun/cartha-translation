id: MAT.28.7
reference: Matthew 28:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ταχὺ πορευθεῖσαι εἴπατε τοῖς μαθηταῖς αὐτοῦ ὅτι Ἠγέρθη ἀπὸ τῶν νεκρῶν, καὶ ἰδοὺ προάγει ὑμᾶς εἰς τὴν Γαλιλαίαν, ἐκεῖ αὐτὸν ὄψεσθε· ἰδοὺ εἶπον ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/007.yaml
  text: And go quickly and tell his disciples, ‘He has been raised from the dead, and look, he is going ahead of you into Galilee. There you will see him.’ Look, I have told you.
translation:
  language: ml
  text: 'വേഗം പോയി അവന്റെ ശിഷ്യന്മാരോട് പറയുക: ‘അവൻ മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നു. ഇതാ, അവൻ നിങ്ങൾക്കുമുമ്പായി ഗലീലയിലേക്കു പോകുന്നു; അവിടെ നിങ്ങൾ അവനെ കാണും.’ ഇതാ, ഞാൻ നിങ്ങളോടു പറഞ്ഞിരിക്കുന്നു.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταχὺ πορευθεῖσαι
  choice: വേഗം പോയി
  rationale: സ്ത്രീകളെ അഭിസംബോധന ചെയ്യുന്ന ഗ്രീക്ക് പങ്കാളിക്രിയയുടെ പ്രവർത്തനവും അടിയന്തരതയും സ്വാഭാവികമായ മലയാളത്തിൽ പകർത്തുന്നു; മലയാളത്തിൽ ലിംഗസൂചന ആവശ്യമില്ല.
- source_word: Ἠγέρθη
  choice: ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: ദൈവിക കർമകർത്താവിനെ വ്യക്തമാക്കാതെ നിൽക്കുന്ന ഗ്രീക്ക് കർമണിപ്രയോഗം സംരക്ഷിക്കുന്നു; ‘ഉയിർത്തെഴുന്നേറ്റു’ എന്നു മാറ്റി സ്വയംകർതൃഭാവം ചേർക്കുന്നില്ല.
- source_word: προάγει ὑμᾶς
  choice: അവൻ നിങ്ങൾക്കുമുമ്പായി ... പോകുന്നു
  rationale: മുന്നേ പോകുക എന്ന സ്ഥലപരവും ക്രമപരവുമായ അർത്ഥം വ്യക്തമായി നൽകുന്നു.
- source_word: ἰδού
  choice: ഇതാ
  rationale: വാക്യത്തിലെ രണ്ടു സന്ദർഭങ്ങളിലും ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ആവർത്തനം നിലനിർത്തുന്ന സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളം.
- source_word: ὄψεσθε
  choice: നിങ്ങൾ ... കാണും
  rationale: ലളിതമായ ഭാവികാല അർത്ഥം നേരിട്ട് പകർത്തുന്നു.
theological_decisions:
- issue: Ἠγέρθη എന്ന ദൈവിക കർമണി
  choice: അവൻ ... ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നു
  alternative: അവൻ ഉയിർത്തെഴുന്നേറ്റിരിക്കുന്നു
  rationale: പുനരുത്ഥാനത്തിന്റെ കർമകർത്താവിനെ ഗ്രീക്ക് വാക്യം തുറന്നു പറയുന്നില്ല; കർമണിരൂപം ആ തുറന്ന നിലയും ദൈവിക പ്രവർത്തനത്തിന്റെ സൂചനയും സംരക്ഷിക്കുന്നു.
- issue: പ്രോആഗോ എന്ന ക്രിയയുടെ അർത്ഥം
  choice: നിങ്ങൾക്കുമുമ്പായി ഗലീലയിലേക്കു പോകുന്നു
  alternative: നിങ്ങളെ ഗലീലയിലേക്കു നയിക്കുന്നു
  rationale: ഈ സന്ദർഭത്തിൽ യേശു അവർക്കുമുമ്പേ ഗലീലയിലേക്കു പോകുന്നു എന്ന അർത്ഥമാണ് സ്വാഭാവികം; ‘നയിക്കുന്നു’ എന്നു പറഞ്ഞാൽ ഇവിടെ ഇല്ലാത്ത നേരിട്ടുള്ള നേതൃത്വഭാവം വരാം.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പമുള്ള, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. കല്പനയുടെ അടിയന്തരതയും ἰδού എന്ന പദത്തിന്റെ ഇരട്ട ആവർത്തനവും ഗ്രീക്ക് കർമണിപ്രയോഗവും സൂക്ഷിച്ചിരിക്കുന്നു.
