id: MAT.28.19
reference: Matthew 28:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πορευθέντες ⸀οὖν μαθητεύσατε πάντα τὰ ἔθνη, ⸀βαπτίζοντες αὐτοὺς εἰς τὸ ὄνομα τοῦ πατρὸς καὶ τοῦ υἱοῦ καὶ τοῦ ἁγίου πνεύματος,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/019.yaml
  text: Therefore[a], go and make disciples of all the nations, baptizing them into the name of the Father and of the Son and of the Holy Spirit,
translation:
  language: ml
  text: അതുകൊണ്ട്, പോയി എല്ലാ ജനതകളെയും പിതാവിന്റെയും പുത്രന്റെയും പരിശുദ്ധാത്മാവിന്റെയും നാമത്തിലേക്ക്[a] സ്നാനപ്പെടുത്തിക്കൊണ്ട് ശിഷ്യരാക്കുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നാമത്തിൽ.’ ഗ്രീക്കിൽ അക്ഷരാർഥം ‘നാമത്തിലേക്ക്’ എന്നാണ്; ഇത് ബന്ധത്തിലേക്കോ തിരിച്ചറിയലിലേക്കോ പ്രവേശിക്കുന്നതിന് ഊന്നൽ നൽകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: πορευθέντες
  choice: നിങ്ങൾ പോയി
  rationale: പ്രധാന കല്പനയായ μαθητεύσατε-യ്ക്കു മുമ്പിലുള്ള aorist participle ഇവിടെ അനുബന്ധ-കല്പനാസ്വഭാവം വഹിക്കുന്നു. അതിനാൽ ‘പോയവരായി’ എന്ന കൃത്രിമരൂപത്തേക്കാൾ കമ്മീഷന്റെ ശക്തി സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്ന ‘നിങ്ങൾ പോയി’ തെരഞ്ഞെടുത്തു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യത്തിൽ യേശു പ്രഖ്യാപിച്ച സകല അധികാരത്തിൽനിന്നുള്ള നിഗമനബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: μαθητεύσατε
  choice: ശിഷ്യരാക്കുക
  rationale: ആരെയെങ്കിലും ശിഷ്യനാക്കുക എന്ന causative അർഥം നേരിട്ടും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: πάντα τὰ ἔθνη
  choice: എല്ലാ ജനതകളെയും
  rationale: ἔθνη എന്നത് ഇവിടെ യഹൂദേതരരെ മാത്രം സൂചിപ്പിക്കുന്നതല്ല; സാർവത്രികമായ ജനവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്നു. ‘ജനതകൾ’ ആ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: βαπτίζοντες
  choice: സ്നാനപ്പെടുത്തുക
  rationale: സ്ഥിരപ്പെട്ട ക്രൈസ്തവ കർമത്തെ സൂചിപ്പിക്കുമ്പോഴും അതിന്റെ രീതിയെ ‘മുക്കുക’ എന്നിങ്ങനെ അനാവശ്യമായി നിർണയിക്കാത്ത പദപ്രയോഗം.
- source_word: εἰς τὸ ὄνομα
  choice: നാമത്തിലേക്ക്
  rationale: εἰς-ന്റെ ‘അകത്തേക്ക്/ബന്ധത്തിലേക്ക്’ എന്ന ദിശാസൂചന നിലനിർത്തി, ബന്ധത്തിലേക്കോ തിരിച്ചറിയലിലേക്കോ പ്രവേശിക്കുന്ന ഭാവം സംരക്ഷിക്കുന്നു. കൂടുതൽ പതിവായ ‘നാമത്തിൽ’ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: τοῦ πατρὸς
  choice: പിതാവിന്റെ
  rationale: ത്രയാത്മക സൂത്രവാക്യത്തിൽ ദൈവിക വ്യക്തിപദവിയെ സൂചിപ്പിക്കുന്നു.
- source_word: τοῦ υἱοῦ
  choice: പുത്രന്റെ
  rationale: പിതാവിനോടും പരിശുദ്ധാത്മാവിനോടും ഏകോപിപ്പിച്ചിരിക്കുന്ന ദൈവിക പുത്രപദവി സംരക്ഷിക്കുന്നു.
- source_word: τοῦ ἁγίου πνεύματος
  choice: പരിശുദ്ധാത്മാവിന്റെ
  rationale: ദൈവിക വ്യക്തിയെ സൂചിപ്പിക്കുന്ന, ആധുനിക മലയാളത്തിൽ പ്രചാരമുള്ള മാന്യമായ രൂപം.
theological_decisions:
- issue: ത്രിത്വ സ്നാനസൂത്രത്തിലെ εἰς എന്ന ഉപസർഗത്തിന്റെ വിവർത്തനം
  choice: നാമത്തിലേക്ക്
  alternative: നാമത്തിൽ
  rationale: εἰς സാധാരണയായി ഒരു ദിശയിലേക്കോ ബന്ധത്തിലേക്കോ ഉള്ള പ്രവേശനം സൂചിപ്പിക്കുന്നു. ഇവിടെ പിതാവും പുത്രനും പരിശുദ്ധാത്മാവും പങ്കിടുന്ന ഏക ‘നാമ’ത്തോടുള്ള ബന്ധമോ തിരിച്ചറിയലോ സൂചിപ്പിക്കാമെന്ന പാഠഭാവം ഇത് നിലനിർത്തുന്നു; എന്നാൽ പ്രത്യേക സക്രാമെന്റൽ സിദ്ധാന്തം വിവർത്തനത്തിലേക്ക് ചേർക്കുന്നില്ല.
- issue: പിതാവ്, പുത്രൻ, പരിശുദ്ധാത്മാവ് എന്നീ പദങ്ങളുടെ വ്യക്തിപരവും ദൈവികവുമായ വായന
  choice: പിതാവിന്റെയും പുത്രന്റെയും പരിശുദ്ധാത്മാവിന്റെയും
  alternative: പിതാവിന്റെയും മകന്റെയും വിശുദ്ധ ആത്മാവിന്റെയും
  rationale: ഏകവചനമായ ‘നാമം’ എന്നതിനുശേഷമുള്ള മൂന്നു സമാന്തര genitive പദങ്ങൾ ത്രയാത്മക സ്നാനസൂത്രം രൂപപ്പെടുത്തുന്നു. മലയാള ക്രൈസ്തവ പ്രയോഗത്തിൽ ദൈവിക വ്യക്തിപദവികൾ വ്യക്തമായി പ്രകടിപ്പിക്കുന്ന രൂപങ്ങൾ തെരഞ്ഞെടുത്തു; പാഠത്തിൽ ഇല്ലാത്ത വിശദീകരണം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ, പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യവും സ്വാഭാവികവുമായ ശൈലി. പ്രധാന കല്പനയായ ‘ശിഷ്യരാക്കുക’ വ്യക്തമായി നിലനിർത്തുകയും, സ്നാനത്തിന്റെ രീതിയെക്കുറിച്ചുള്ള സഭാവിഭാഗപരമായ നിർണയം ഒഴിവാക്കുകയും ചെയ്തു.
