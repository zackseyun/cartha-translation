revisions:
- from: അതുകൊണ്ട്, നിങ്ങൾ പോയി എല്ലാ ജനതകളെയും ശിഷ്യരാക്കുക; പിതാവിന്റെയും പുത്രന്റെയും പരിശുദ്ധാത്മാവിന്റെയും നാമത്തിലേക്ക്[a] അവരെ സ്നാനപ്പെടുത്തുക.
  to: അതുകൊണ്ട്, പോയി എല്ലാ ജനതകളെയും പിതാവിന്റെയും പുത്രന്റെയും പരിശുദ്ധാത്മാവിന്റെയും നാമത്തിലേക്ക്[a] സ്നാനപ്പെടുത്തിക്കൊണ്ട് ശിഷ്യരാക്കുക.
  rationale: വാക്യത്തിലെ പ്രധാന കല്പനയും അതോടു ബന്ധപ്പെട്ട കൃദ്‌വാചകങ്ങളും തമ്മിലുള്ള ഗ്രീക്ക് ഘടന മലയാളത്തിൽ സംരക്ഷിക്കാൻ വാക്യക്രമം തിരുത്തി. εἰς-ന്റെ ദിശാസൂചനയായ ‘നാമത്തിലേക്ക്’ നിലനിർത്തുകയും, പതിവായ ‘നാമത്തിൽ’ എന്ന സാധുവായ പരിഭാഷ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുകയും ചെയ്തു.
