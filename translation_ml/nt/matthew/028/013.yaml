source:
  edition: SBLGNT
  text: λέγοντες· Εἴπατε ὅτι Οἱ μαθηταὶ αὐτοῦ νυκτὸς ἐλθόντες ἔκλεψαν αὐτὸν ἡμῶν κοιμωμένων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/013.yaml
  text: saying[a], “Say[b], ‘His disciples came by night and stole him while we were sleeping.’”
translation:
  language: ml
  text: 'ഇങ്ങനെ പറഞ്ഞുകൊണ്ട്, “നിങ്ങൾ പറയുക: ‘ഞങ്ങൾ ഉറങ്ങിക്കൊണ്ടിരിക്കുമ്പോൾ അവന്റെ ശിഷ്യന്മാർ രാത്രിയിൽ[a] വന്ന് അവനെ[b] മോഷ്ടിച്ചുകൊണ്ടുപോയി.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “രാത്രിസമയത്ത്.” ഗ്രീക്കിലെ νυκτός അവർ വന്ന സമയം സൂചിപ്പിക്കുന്ന ക്രിയാവിശേഷണപരമായ ഷഷ്ഠീവിഭക്തിയാണ്.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ “അവനെ” എന്നാണ്; “അവന്റെ ശരീരം” എന്നല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: ഇങ്ങനെ പറഞ്ഞുകൊണ്ട്
  rationale: വർത്തമാനകാല കൃദന്തരൂപം തുടർന്നുവരുന്ന നിർദേശത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ആഖ്യാനബന്ധം നിലനിർത്തുന്നു.
- source_word: Εἴπατε
  choice: നിങ്ങൾ പറയുക
  rationale: രണ്ടാം പുരുഷ ബഹുവചനത്തിലുള്ള ആജ്ഞയുടെ നേരിട്ടുള്ള ശക്തി അധികവാക്കുകൾ ചേർക്കാതെ നിലനിർത്തുന്നു.
- source_word: ὅτι
  choice: ഉദ്ധരണിഘടനയിലൂടെ ഉള്ളടക്കസൂചകം
  rationale: ὅτι തുടർന്നുവരുന്ന പ്രസ്താവനയുടെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ നേരിട്ടുള്ള ഉദ്ധരണി ഇതിന്റെ പ്രവർത്തനം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: Οἱ μαθηταὶ αὐτοῦ
  choice: അവന്റെ ശിഷ്യന്മാർ
  rationale: ഗ്രീക്കിലെ സാധാരണ ഉടമസ്ഥബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: νυκτὸς
  choice: രാത്രിയിൽ
  rationale: സമയം സൂചിപ്പിക്കുന്ന ക്രിയാവിശേഷണപരമായ ഷഷ്ഠീവിഭക്തിയുടെ ലളിതവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: ἐλθόντες
  choice: വന്ന്
  rationale: പ്രധാന ക്രിയയ്ക്കു മുമ്പുള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന കൃദന്തരൂപം മലയാളത്തിലെ ക്രിയാവിന്യാസത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἔκλεψαν
  choice: മോഷ്ടിച്ചുകൊണ്ടുപോയി
  rationale: മോഷണത്തിന്റെ അർഥം നിലനിർത്തുകയും ഒരാളെ അവിടെനിന്ന് എടുത്തുകൊണ്ടുപോയെന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: αὐτὸν
  choice: അവനെ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സർവനാമം തന്നെയാണ് നിലനിർത്തുന്നത്; ‘അവന്റെ ശരീരം’ എന്ന വ്യാഖ്യാനവികാസം ചേർക്കുന്നില്ല.
- source_word: ἡμῶν κοιμωμένων
  choice: ഞങ്ങൾ ഉറങ്ങിക്കൊണ്ടിരിക്കുമ്പോൾ
  rationale: ഷഷ്ഠീ അബ്സല്യൂട്ട് ഘടനയുടെ സമകാലിക സാഹചര്യാർഥം വ്യക്തമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: കെട്ടിച്ചമച്ച റിപ്പോർട്ടിലെ αὐτόν എന്നതിന്റെ സൂചിതവസ്തു
  choice: ‘അവന്റെ ശരീരം’ എന്നു വികസിപ്പിക്കാതെ ‘അവനെ’ എന്ന വ്യക്തിസർവനാമം നിലനിർത്തി.
  alternative: അവന്റെ ശരീരം
  rationale: ഗ്രീക്ക് പാഠത്തിൽ αὐτόν എന്ന വ്യക്തിസർവനാമമാണ് ഉള്ളത്. ‘ശരീരം’ എന്നു ചേർക്കുന്നത് മൂലപാഠത്തിൽ ഇല്ലാത്ത വിശദീകരണമാണ്; സന്ദർഭം സൂചിതവ്യക്തിയെ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. നിർദേശത്തിനുള്ളിലെ കെട്ടിച്ചമച്ച പ്രസ്താവന ഉദ്ധരണിക്കുള്ളിലെ ഉദ്ധരണിയായി വ്യക്തമായി നൽകിയിരിക്കുന്നു; മൂലപാഠത്തിലെ വ്യക്തിസർവനാമവും സമയസൂചനയും വ്യാഖ്യാനാതിശയമില്ലാതെ സംരക്ഷിച്ചിട്ടുണ്ട്.
