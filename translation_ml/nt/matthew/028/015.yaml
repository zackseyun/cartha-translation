id: MAT.28.15
reference: Matthew 28:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ λαβόντες ⸀τὰ ἀργύρια ἐποίησαν ὡς ἐδιδάχθησαν. Καὶ διεφημίσθη ὁ λόγος οὗτος παρὰ Ἰουδαίοις μέχρι τῆς σήμερον ⸀ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/015.yaml
  text: So they took the silver and did as they had been instructed[a]. And this story has been spread among the Jews to this day.
translation:
  language: ml
  text: അവർ ആ വെള്ളിപ്പണം ഏറ്റുവാങ്ങി, അവരോടു നിർദേശിച്ചതുപോലെ ചെയ്തു. ഈ വാർത്ത[a] യെഹൂദന്മാരുടെ ഇടയിൽ ഇന്നുവരെ പ്രചരിച്ചിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഈ വിവരണം.” ഗ്രീക്കിലെ λόγος എന്ന പദത്തിന് സന്ദർഭമനുസരിച്ച് “വാക്ക്,” “വാർത്ത,” “വിവരണം,” “കഥ” എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντες
  choice: വാങ്ങി
  rationale: മുൻവാക്യത്തിൽ പുരോഹിതന്മാർ പണം കൊടുത്തതിനെ തുടർന്നുള്ള സ്വീകരണത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ ‘സ്വീകരിച്ച്’ എന്നതിനെക്കാൾ ഒഴുക്കുള്ള പ്രയോഗം.
- source_word: τὰ ἀργύρια
  choice: വെള്ളിപ്പണം
  rationale: ἀργύρια എന്നതിലെ വെള്ളി/പണം എന്ന അർഥം നിലനിർത്തുന്നു; ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത ‘നാണയങ്ങൾ’ എന്ന പ്രത്യേകത ചേർക്കുന്നില്ല.
- source_word: ἐποίησαν
  choice: ചെയ്തു
  rationale: ποιέωയുടെ സാധാരണ അർഥം നേരിട്ട് നൽകുകയും തുടർന്നുള്ള നിർദേശവാക്യവുമായി സ്വാഭാവികമായി ചേരുകയും ചെയ്യുന്നു.
- source_word: ὡς ἐδιδάχθησαν
  choice: തങ്ങളോട് നിർദേശിച്ചതുപോലെ
  rationale: ഇവിടെ എന്തു പറയണം എന്ന നിർദേശം ലഭിച്ചതാണ് സന്ദർഭം; അതിനാൽ അക്ഷരാർഥമായ ‘പഠിപ്പിച്ചതുപോലെ’ എന്നതിനെക്കാൾ ‘നിർദേശിച്ചതുപോലെ’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: διεφημίσθη
  choice: പ്രചരിച്ചിരിക്കുന്നു
  rationale: വാർത്ത വ്യാപകമായി പരന്നതും എഴുത്തുകാരന്റെ കാലംവരെ അതിന്റെ പ്രചാരം തുടർന്നതും സമാപ്തകാലരൂപം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὁ λόγος οὗτος
  choice: ഈ വാർത്ത
  rationale: λόγος ഇവിടെ കാവൽക്കാർ പ്രചരിപ്പിച്ച വിശദീകരണത്തെ സൂചിപ്പിക്കുന്നു. ‘വാർത്ത’ മലയാളത്തിൽ സ്വാഭാവികമാണ്; ‘വിവരണം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: παρὰ Ἰουδαίοις
  choice: യെഹൂദന്മാരുടെ ഇടയിൽ
  rationale: παρά + dative എന്നതിന്റെ സമൂഹത്തിനുള്ളിലെ പ്രചാരം എന്ന ആശയം നേരിട്ട് നൽകുന്നു; വിവരണസന്ദർഭത്തിനപ്പുറമുള്ള പൊതുവായ കുറ്റപ്പെടുത്തൽ ചേർക്കുന്നില്ല.
- source_word: μέχρι τῆς σήμερον ἡμέρας
  choice: ഇന്നുവരെ
  rationale: എഴുത്തുകാരന്റെ വർത്തമാനകാലംവരെ തുടർന്ന നിലയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളരൂപം.
theological_decisions:
- issue: Ἰουδαίοις എന്ന സമൂഹനാമം വിവർത്തനം ചെയ്യുമ്പോൾ അനാവശ്യമായ യെഹൂദവിരുദ്ധ പൊതുവത്കരണം ഒഴിവാക്കൽ
  choice: യെഹൂദന്മാരുടെ ഇടയിൽ
  alternative: യെഹൂദജനത്തിന്റെ ഇടയിൽ; യെഹൂദ്യരുടെ ഇടയിൽ
  rationale: വാക്യം ഒരു റിപ്പോർട്ട് യെഹൂദസമൂഹത്തിനുള്ളിൽ പ്രചരിച്ചതിനെക്കുറിച്ചാണ് പറയുന്നത്. ‘യെഹൂദന്മാരുടെ ഇടയിൽ’ എന്നത് നേരിട്ടുള്ള അർഥം നൽകുന്നു; ‘യെഹൂദ്യർ’ എന്നത് ഇവിടെ അനാവശ്യമായി പ്രാദേശിക തിരിച്ചറിയലിലേക്ക് ചുരുക്കാം. വിവർത്തനം മത്തായിയുടെ ഈ പ്രത്യേക വിവരണത്തിനപ്പുറം കുറ്റാരോപണം വ്യാപിപ്പിക്കുന്നില്ല.
- issue: λόγος എന്ന പദത്തിന്റെ സന്ദർഭാർഥം
  choice: വാർത്ത
  alternative: വിവരണം; കഥ; വാക്ക്
  rationale: ഇവിടെ കാവൽക്കാർ പറഞ്ഞ് പ്രചരിപ്പിച്ച റിപ്പോർട്ടാണ് ഉദ്ദേശ്യം. ‘വാർത്ത’ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു; എന്നാൽ പദത്തിന്റെ യഥാർഥ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി. ‘വെള്ളിപ്പണം’ മൂലത്തിലെ konkrete wording നിലനിർത്തുന്നു; ‘പ്രചരിച്ചിരിക്കുന്നു’ ഇന്നുവരെ തുടരുന്ന ഫലം പ്രകടിപ്പിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ‘വാർത്ത’ എന്ന പദത്തിനു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
