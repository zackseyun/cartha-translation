revisions:
- from: പതിനൊന്ന് ശിഷ്യന്മാർ ഗലീലയിലേക്ക്, യേശു അവർക്കായി നിശ്ചയിച്ചിരുന്ന മലയിൽ ചെന്നു.[a]
  to: പതിനൊന്ന് ശിഷ്യന്മാർ ഗലീലയിലേക്ക്, യേശു അവർക്കു നിർദേശിച്ചിരുന്ന മലയിലേക്ക് പോയി.[a]
  rationale: The revision changes «അവർക്കായി» to «അവർക്കു» to preserve the Greek dative and changes «മലയിൽ ചെന്നു» to «മലയിലേക്ക് പോയി» to represent the explicit directional phrase εἰς τὸ ὄρος. The footnote is aligned with the revised primary rendering while preserving the lexical alternative “had appointed/designated.”
