source:
  edition: SBLGNT
  text: Οἱ δὲ ἕνδεκα μαθηταὶ ἐπορεύθησαν εἰς τὴν Γαλιλαίαν εἰς τὸ ὄρος οὗ ἐτάξατο αὐτοῖς ὁ Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/016.yaml
  text: The eleven disciples went to Galilee[a], to the mountain where Jesus had directed them,
translation:
  language: ml
  text: പതിനൊന്ന് ശിഷ്യന്മാർ ഗലീലയിലേക്ക്, യേശു അവർക്കു നിർദേശിച്ചിരുന്ന മലയിലേക്ക് പോയി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യേശു അവർക്കു നിശ്ചയിച്ചിരുന്ന മലയിലേക്ക്.” ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘നിശ്ചയിക്കുക,’ ‘നിർദേശിക്കുക,’ അല്ലെങ്കിൽ ‘നിയോഗിക്കുക’ എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: ഇത് നേരിയ ആഖ്യാനബന്ധകമാണ്; മലയാളത്തിൽ വാക്യക്രമവും സന്ദർഭവും തന്നെ ആ ബന്ധം സ്വാഭാവികമായി നൽകുന്നതിനാൽ ‘എന്നാൽ’ എന്നു ചേർത്ത് അനാവശ്യമായ വൈരുധ്യം സൃഷ്ടിച്ചിട്ടില്ല.
- source_word: ἕνδεκα μαθηταὶ
  choice: പതിനൊന്ന് ശിഷ്യന്മാർ
  rationale: യൂദാസിന്റെ അഭാവത്തിനു ശേഷമുള്ള നിർദിഷ്ട ശിഷ്യസംഘത്തെ കൃത്യമായി സൂചിപ്പിക്കുന്നു; μαθηταί എന്നതിന് സുവിശേഷസന്ദർഭത്തിലെ പതിവും മാന്യവുമായ പദമാണ് ‘ശിഷ്യന്മാർ’.
- source_word: ἐπορεύθησαν
  choice: ചെന്നു
  rationale: സ്ഥലത്തേക്കുള്ള നീക്കത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘യാത്ര ചെയ്തു’ ഇവിടെ അനാവശ്യമായി ഔപചാരികമാണ്.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: ഗലീലയിലേക്ക്
  rationale: ഒരു പ്രദേശത്തേക്കുള്ള ഗതി സൂചിപ്പിക്കുന്ന εἰς എന്നതിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: εἰς τὸ ὄρος
  choice: മലയിൽ
  rationale: ലക്ഷ്യസ്ഥാനത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; നിർദിഷ്ടമായ സ്ഥലം എന്ന ആശയം അനുബന്ധ ഉപവാക്യം വ്യക്തമാക്കുന്നു.
- source_word: οὗ
  choice: —യിൽ
  rationale: സ്ഥലസംബന്ധിയായ οὗ എന്നതിന്റെ അർഥം ‘യേശു ... നിശ്ചയിച്ചിരുന്ന മലയിൽ’ എന്ന മലയാളഘടനയിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: ἐτάξατο
  choice: നിശ്ചയിച്ചിരുന്ന
  rationale: τάσσω എന്ന ക്രിയയുടെ ‘ക്രമീകരിക്കുക/നിയോഗിക്കുക/നിശ്ചയിക്കുക’ എന്ന അർഥപരിധിയിൽ, മുൻകൂട്ടി കൂടിക്കാഴ്ചയുടെ സ്ഥലം നിർദേശിച്ചെന്ന സന്ദർഭം വ്യക്തമാക്കുന്നു; ഔദ്യോഗിക നിയമനമെന്ന അധിക ആശയം ചേർക്കുന്നില്ല.
- source_word: αὐτοῖς
  choice: അവർക്കായി
  rationale: യേശു ശിഷ്യർക്കുവേണ്ടി ആ സ്ഥലം നിശ്ചയിച്ചുവെന്ന ദാതൃബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὁ Ἰησοῦς
  choice: യേശു
  rationale: പേരിന്റെ നിലവാരമുള്ള മലയാള ലിപ്യന്തരണം.
theological_decisions:
- issue: യേശു കൂടിക്കാഴ്ചയുടെ സ്ഥലം മുൻകൂട്ടി നിർദേശിച്ചതിന്റെ സ്വഭാവം
  choice: ‘നിശ്ചയിച്ചിരുന്ന’ എന്ന് പരിഭാഷപ്പെടുത്തി
  alternative: ‘കൽപ്പിച്ചിരുന്ന’ / ‘നിയമിച്ചിരുന്ന’
  rationale: വാക്യം പ്രധാനമായി മുൻകൂട്ടി നിർദിഷ്ടമാക്കിയ സ്ഥലത്തെക്കുറിച്ചാണ് പറയുന്നത്. ‘കൽപ്പിച്ചിരുന്ന’ എന്നത് ആജ്ഞയുടെ ശക്തി കൂട്ടുകയും ‘നിയമിച്ചിരുന്ന’ എന്നത് ഔദ്യോഗിക സ്ഥാനനിയമനത്തിന്റെ ധ്വനി നൽകുകയും ചെയ്യാം; ‘നിശ്ചയിച്ചിരുന്ന’ മൂലപദത്തിന്റെ സന്ദർഭോചിതമായ അർഥവും അതിലെ സാധ്യതാപരിധിയും സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ നേരിയ ബന്ധകമായ δὲ പ്രത്യേകം പദമാക്കി ചേർത്തിട്ടില്ല. പ്രധാനവാക്യത്തിലെ [a] അടയാളം അനുബന്ധ പദവികല്പം വ്യക്തമാക്കുന്നു.
