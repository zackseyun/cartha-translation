id: MAT.28.1
reference: Matthew 28:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὀψὲ δὲ σαββάτων, τῇ ἐπιφωσκούσῃ εἰς μίαν σαββάτων, ἦλθεν ⸀Μαριὰμ ἡ Μαγδαληνὴ καὶ ἡ ἄλλη Μαρία θεωρῆσαι τὸν τάφον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/001.yaml
  text: After the Sabbath[a], as it was dawning toward the first day of the week, Mary Magdalene and the other Mary came to look at the tomb.
translation:
  language: ml
  text: ശബ്ബത്തിനുശേഷം[a], ആഴ്ചയുടെ ഒന്നാം ദിവസം പുലരാറായപ്പോൾ, മഗ്ദലക്കാരി മറിയയും മറ്റേ മറിയയും കല്ലറ കാണാൻ വന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ശബ്ബത്തിന്റെ അവസാനവേളയിൽ, ആഴ്ചയുടെ ഒന്നാം ദിവസം പുലരാറായപ്പോൾ.’ ആരംഭത്തിലെ ഗ്രീക്ക് പ്രയോഗം ‘ശബ്ബത്തിനുശേഷം’ എന്നും ‘ശബ്ബത്തിന്റെ അവസാനവേളയിൽ’ എന്നും മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὀψὲ δὲ σαββάτων
  choice: ശബ്ബത്തിനുശേഷം
  rationale: ജനിറ്റീവിനോടുകൂടിയ ὀψέ ഒരു സംഭവത്തിനുശേഷമുള്ള സമയത്തെ സൂചിപ്പിക്കാം. പുനരുത്ഥാനവിവരണത്തിന്റെ പശ്ചാത്തലത്തിൽ ശബ്ബത്ത് അവസാനിച്ചതിനുശേഷം എന്ന അർഥമാണ് മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചത്. σαββάτων രൂപത്തിൽ ബഹുവചനമാണെങ്കിലും ഇവിടെ യഹൂദ-ഗ്രീക്ക് പ്രയോഗത്തിൽ ഏകവചനമായ ‘ശബ്ബത്ത്’ എന്ന അർഥം നൽകുന്നു. δέ-യുടെ ലഘുവായ ബന്ധകസ്വഭാവം മലയാളത്തിൽ പ്രത്യേകം പദമാക്കാതെ സ്വാഭാവികമായ വാക്യപ്രവാഹത്തിൽ ഉൾപ്പെടുത്തി.
- source_word: τῇ ἐπιφωσκούσῃ εἰς μίαν σαββάτων
  choice: ആഴ്ചയുടെ ഒന്നാം ദിവസം പുലരാറായപ്പോൾ
  rationale: ἐπιφώσκω ഇവിടെ പകൽവെളിച്ചം വരുന്നതിനെ സൂചിപ്പിക്കുന്നു; εἰς നൽകുന്ന ‘അടുത്തുവരുന്ന’ ഭാവം ‘പുലരാറായപ്പോൾ’ എന്ന പ്രയോഗത്തിൽ നിലനിർത്തുന്നു. μίαν σαββάτων എന്ന സെമിറ്റിക് പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ ‘ആഴ്ചയുടെ ഒന്നാം ദിവസം’ എന്നു നൽകി.
- source_word: Μαριὰμ ἡ Μαγδαληνὴ
  choice: മഗ്ദലക്കാരി മറിയ
  rationale: മഗ്ദല സ്വദേശിനിയായ മറിയയെ സൂചിപ്പിക്കുന്ന വിശേഷണം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകി.
- source_word: ἡ ἄλλη Μαρία
  choice: മറ്റേ മറിയ
  rationale: ἄλλη സൂചിപ്പിക്കുന്ന കഥാസന്ദർഭത്തിലെ വേർതിരിവ് ലളിതമായി നിലനിർത്തുന്നു.
- source_word: θεωρῆσαι
  choice: കാണാൻ
  rationale: θεωρέω ഉദ്ദേശപൂർവം നോക്കുക/കാണുക എന്നർഥം നൽകുന്നു. ‘പരിശോധിക്കാൻ’ എന്നു നൽകുന്നത് മൂലപാഠത്തേക്കാൾ ശക്തമായ അർഥം വരുത്തുമെന്നതിനാൽ ഒഴിവാക്കി.
- source_word: τὸν τάφον
  choice: കല്ലറ
  rationale: യേശുവിന്റെ സംസ്കാരസ്ഥലത്തെ സൂചിപ്പിക്കുന്ന τάφος-ന് ആധുനിക മലയാളത്തിൽ വ്യക്തവും സാധാരണവുമായ തുല്യപദം.
theological_decisions:
- issue: പുനരുത്ഥാനവിവരണത്തിന്റെ ആരംഭത്തിലെ സമയസൂചന
  choice: ശബ്ബത്ത് അവസാനിച്ചതിനുശേഷം, ആഴ്ചയുടെ ഒന്നാം ദിവസം പുലരുന്ന സമയത്താണ് സ്ത്രീകൾ വന്നതെന്ന് മുഖ്യപാഠത്തിൽ നൽകി.
  alternative: ‘ശബ്ബത്തിന്റെ അവസാനവേളയിൽ, ആഴ്ചയുടെ ഒന്നാം ദിവസം പുലരാറായപ്പോൾ’ എന്നും ഗ്രീക്ക് ആരംഭവാക്യം മനസ്സിലാക്കാം.
  rationale: ὀψὲ σαββάτων എന്ന പ്രയോഗത്തിന് രണ്ടു വ്യാഖ്യാനസാധ്യതകളുണ്ട്. തുടർന്നുള്ള പുലർച്ചസൂചനയുമായി ചേർത്ത് ‘ശബ്ബത്തിനുശേഷം’ എന്ന വായന മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചെങ്കിലും യഥാർഥമായ ഭാഷാപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. സമയസൂചന സ്വാഭാവിക മലയാളക്രമത്തിൽ നൽകി; മൂലഗ്രീക്കിലെ യഥാർഥ അനിശ്ചിതത്വം [a] അടിക്കുറിപ്പിലൂടെ നിലനിർത്തി.
