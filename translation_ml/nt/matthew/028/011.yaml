source:
  edition: SBLGNT
  text: Πορευομένων δὲ αὐτῶν ἰδού τινες τῆς κουστωδίας ἐλθόντες εἰς τὴν πόλιν ἀπήγγειλαν τοῖς ἀρχιερεῦσιν ἅπαντα τὰ γενόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/011.yaml
  text: While they were going[a], behold[b], some of the guard came into the city and reported to the chief priests everything that had happened.
translation:
  language: ml
  text: അവർ പോകുമ്പോൾ[a], ഇതാ[b], കാവൽസംഘത്തിൽ ചിലർ നഗരത്തിലെത്തി സംഭവിച്ചതെല്ലാം മുഖ്യപുരോഹിതന്മാരോട് അറിയിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവർ പോയിക്കൊണ്ടിരിക്കുമ്പോൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. അടുത്ത സംഭവം നടക്കുന്ന കാലപശ്ചാത്തലം സൂചിപ്പിക്കുന്ന ജനിറ്റീവ് ആബ്സല്യൂട്ട് ഘടനയാണ് ഗ്രീക്കിലുള്ളത്.
    reason: lexical_alternative
  - marker: b
    text: ‘ഇതാ’ എന്നത് ഗ്രീക്കിലെ ἰδού എന്ന ശ്രദ്ധാകർഷകപദത്തെ പരിഭാഷപ്പെടുത്തുന്നു; കഥനത്തിൽ പെട്ടെന്നുള്ളതോ ശ്രദ്ധേയമായതോ ആയ ഒരു സംഭവത്തിലേക്ക് ഇത് ശ്രദ്ധ ക്ഷണിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πορευομένων δὲ αὐτῶν
  choice: അവർ പോകുമ്പോൾ
  rationale: Genitive absolute നൽകുന്ന പശ്ചാത്തലകാലബന്ധം സ്വാഭാവികമായി നിലനിർത്തുന്നു; അവർ എവിടേക്കാണ് പോയതെന്ന് മൂലപാഠം പറയാത്തതിനാൽ ലക്ഷ്യസ്ഥാനം ചേർത്തിട്ടില്ല.
- source_word: ἰδού
  choice: ഇതാ
  rationale: പെട്ടെന്നുള്ളതോ ശ്രദ്ധേയമായതോ ആയ കഥാവികാസത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗ്രീക്ക് സൂചകത്തിന്റെ പ്രവർത്തനം നിലനിർത്തുന്നു.
- source_word: τινες τῆς κουστωδίας
  choice: കാവൽസംഘത്തിൽ ചിലർ
  rationale: കല്ലറയ്ക്കൽ നിയോഗിക്കപ്പെട്ട കാവൽക്കാരുടെ സംഘത്തിൽപ്പെട്ട ചിലരെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും വ്യക്തവുമായ പ്രയോഗം.
- source_word: ἐλθόντες εἰς τὴν πόλιν
  choice: നഗരത്തിൽ ചെന്ന്
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള aorist participle-നെ മലയാളത്തിൽ സ്വാഭാവികമായ മുൻക്രമപ്രവർത്തിയായി അവതരിപ്പിക്കുന്നു.
- source_word: ἀπήγγειλαν
  choice: അറിയിച്ചു
  rationale: അധികാരസ്ഥാനത്തുള്ളവർക്കു വിവരം എത്തിച്ചുകൊടുക്കുക എന്ന അർഥം സന്ദർഭാനുസൃതമായി നൽകുന്നു.
- source_word: τοῖς ἀρχιερεῦσιν
  choice: മുഖ്യപുരോഹിതന്മാരെ
  rationale: രണ്ടാം ദേവാലയകാല യഹൂദ നേതൃത്വത്തിലെ ἀρχιερεῖς എന്ന ബഹുവചനപദത്തിന് മലയാളത്തിൽ പ്രചാരമുള്ള തുല്യപ്രയോഗം; ‘അറിയിച്ചു’ എന്ന ക്രിയയോടൊപ്പം കർമരൂപം സ്വാഭാവികമാണ്.
- source_word: ἅπαντα τὰ γενόμενα
  choice: സംഭവിച്ചതെല്ലാം
  rationale: ἅπαντα നൽകുന്ന സമഗ്രതയും τὰ γενόμενα സൂചിപ്പിക്കുന്ന കഴിഞ്ഞ സംഭവങ്ങളും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
