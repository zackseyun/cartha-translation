  source_fidelity: The draft accurately renders the location statement, the passive form of ἠγέρθη, the correspondence expressed by καθὼς εἶπεν, and the invitation to inspect the place. However, rendering γάρ solely by a semicolon leaves its explicit causal force unrepresented; Malayalam can express it naturally with “കാരണം”.
  naturalness: The wording is clear, modern, and appropriately dignified. “വരൂ, … കാണൂ” is natural. Adding “കാരണം” improves both clarity and sentence flow without making the rendering stiff.
  terminology: “ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നു” appropriately preserves the Greek passive voice. “ഉയിർത്തെഴുന്നേറ്റിരിക്കുന്നു” is suitable as a clearly marked alternative. “കിടന്നിരുന്ന സ്ഥലം” naturally conveys the stative imperfect sense of ἔκειτο.
