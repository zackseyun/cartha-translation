id: MAT.28.6
reference: Matthew 28:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐκ ἔστιν ὧδε, ἠγέρθη γὰρ καθὼς εἶπεν· δεῦτε ἴδετε τὸν τόπον ὅπου ⸀ἔκειτο·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/006.yaml
  text: He is not here[a], for he has been raised, just as he said. Come[b], see the place where he was lying.
translation:
  language: ml
  text: അവൻ ഇവിടെയില്ല, കാരണം താൻ പറഞ്ഞതുപോലെ അവൻ ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നു.[a] വരൂ, അവൻ കിടന്നിരുന്ന സ്ഥലം കാണൂ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘അവൻ ഉയിർത്തെഴുന്നേറ്റിരിക്കുന്നു.’ ഗ്രീക്ക് ക്രിയ രൂപത്തിൽ നിഷ്ക്രിയമാണ് (‘ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നു’); എന്നാൽ പരമ്പരാഗത പരിഭാഷകളിൽ പലപ്പോഴും സജീവരൂപമാണ് ഉപയോഗിക്കുന്നത്.
    reason: alternative_reading
  - marker: b
    text: അല്ലെങ്കിൽ, ‘അവൻ കിടന്ന സ്ഥലം’ അഥവാ ‘അവനെ കിടത്തിയിരുന്ന സ്ഥലം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔστιν ὧδε
  choice: അവൻ ഇവിടെയില്ല
  rationale: വ്യക്തമായ സന്ദർഭസൂചന അനുസരിച്ച് കർത്താവായ ‘അവൻ’ ചേർത്തു; ὧδε എന്ന സ്ഥലസൂചന സ്വാഭാവികമായി ‘ഇവിടെ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: ἠγέρθη
  choice: അവൻ ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: ἐγείρω എന്ന ക്രിയയുടെ ഭൂതകാല നിഷ്ക്രിയരൂപം നിലനിർത്തുകയും, സംഭവത്തിന്റെ ഇപ്പോഴുള്ള ഫലം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: γὰρ
  choice: ;
  rationale: മുൻവാക്യത്തിന്റെ കാരണം തുടർന്നുള്ള വാക്യം വ്യക്തമാക്കുന്നു. മലയാളത്തിൽ പ്രത്യേക കാരണബന്ധപദം ചേർക്കാതെ അർധവിരാമത്തിലൂടെ ഈ ബന്ധം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: καθὼς εἶπεν
  choice: താൻ പറഞ്ഞതുപോലെ
  rationale: യേശു മുമ്പ് പറഞ്ഞതും ഇപ്പോൾ സംഭവിച്ചതും തമ്മിലുള്ള കൃത്യമായ പൊരുത്തം നിലനിർത്തുന്നു; ‘താൻ’ എന്നത് സന്ദർഭത്തിലെ അതേ കർത്താവിനെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: δεῦτε
  choice: വരൂ
  rationale: ക്ഷണവും ആഹ്വാനവും ഉൾക്കൊള്ളുന്ന δεῦτε എന്ന പദത്തിന് ആധുനികവും ആദരസൂചകവുമായ സ്വാഭാവിക മലയാളരൂപം.
- source_word: ἴδετε
  choice: കാണൂ
  rationale: ഉടൻ നേരിട്ട് പരിശോധിക്കാനുള്ള ആഹ്വാനം ലളിതവും സ്വാഭാവികവുമായ ആജ്ഞാരൂപത്തിൽ നൽകുന്നു.
- source_word: τὸν τόπον
  choice: സ്ഥലം
  rationale: കല്ലറയ്ക്കുള്ളിൽ ശരീരം കിടന്നിരുന്ന നിർദിഷ്ട ഭൗതിക ഇടത്തെ സാധാരണ വായനക്കാർക്കു വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: ὅπου ἔκειτο
  choice: അവൻ കിടന്നിരുന്ന
  rationale: κεῖμαι എന്ന ക്രിയയുടെ നിലാസൂചക അർത്ഥവും അപൂർണ്ണഭൂതകാല ഭാവവും നിലനിർത്തുന്നു; ശരീരം അവിടെ കിടന്നിരുന്നുവെന്ന ആശയം അനാവശ്യമായി കൂടുതൽ വ്യാഖ്യാനിക്കുന്നില്ല.
theological_decisions:
- issue: ഉയിർപ്പിന്റെ പ്രസ്താവനയിലെ ക്രിയാവാചകവും കർത്തൃത്വവും
  choice: അവൻ ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നു
  alternative: അവൻ ഉയിർത്തെഴുന്നേറ്റിരിക്കുന്നു
  rationale: ἠγέρθη രൂപത്തിൽ നിഷ്ക്രിയമാണ്. നിഷ്ക്രിയരൂപം നിലനിർത്തുന്നത് ഉയിർപ്പ് അവനിൽ നിർവഹിക്കപ്പെട്ട പ്രവൃത്തിയായി വാക്യം അവതരിപ്പിക്കുന്ന വിധം സംരക്ഷിക്കുന്നു; അതേസമയം പുതിയ നിയമത്തിലെ മറ്റു പ്രസ്താവനകളിലുള്ള യേശുവിന്റെ കർത്തൃത്വത്തെ ഇത് നിഷേധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘വരൂ… കാണൂ’ എന്ന രൂപങ്ങൾ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്. ഗ്രീക്കിലെ നിഷ്ക്രിയരൂപം മൂലം അല്പം ഔപചാരികമാകുന്ന ‘ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നു’ ബോധപൂർവം നിലനിർത്തി. വിശദീകരിക്കുന്ന കുറിപ്പിന്റെ സൂചനയായ [a] അത് സംബന്ധിക്കുന്ന ഉയിർപ്പ് പ്രസ്താവനയ്ക്കു പിന്നാലെയാണ് നൽകിയിരിക്കുന്നത്.
