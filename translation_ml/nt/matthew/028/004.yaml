revisions:
- from: അവനെക്കുറിച്ചുള്ള ഭയം നിമിത്തം കാവൽക്കാർ വിറച്ച് മരിച്ചവരെപ്പോലെയായി[a].
  to: അവനോടുള്ള ഭയത്താൽ കാവൽക്കാർ വിറയ്ക്കുകയും മരിച്ചവരെപ്പോലെയാകുകയും ചെയ്തു[a].
  rationale: The revision replaces an ambiguous Malayalam expression with the idiomatic «അവനോടുള്ള ഭയത്താൽ» and preserves the Greek coordination by using «വിറയ്ക്കുകയും ... ആകുകയും ചെയ്തു.» The referent remains the angel in the preceding context, without adding an explicit identification not present in this verse.
