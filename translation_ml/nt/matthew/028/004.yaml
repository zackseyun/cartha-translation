id: MAT.28.4
reference: Matthew 28:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπὸ δὲ τοῦ φόβου αὐτοῦ ἐσείσθησαν οἱ τηροῦντες καὶ ἐγενήθησαν ⸀ὡς νεκροί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/004.yaml
  text: And from fear of him the guards shook and became like dead men[a].
translation:
  language: ml
  text: അവനോടുള്ള ഭയത്താൽ കാവൽക്കാർ വിറയ്ക്കുകയും മരിച്ചവരെപ്പോലെയാകുകയും ചെയ്തു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, «അവനെ ഭയന്നതിനാൽ കാവൽക്കാർ വിറച്ചു; മരിച്ചവരെപ്പോലെയായി.»
    reason: ἀπό with the genitive can express cause; ἐσείσθησαν may be rendered ‘വിറച്ചു’ or ‘കുലുങ്ങി.’
lexical_decisions:
- source_word: ἀπὸ
  choice: നിമിത്തം
  rationale: ജനിറ്റീവിനോടുകൂടിയ ἀπό ഇവിടെ പ്രതികരണത്തിന്റെ കാരണത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘നിമിത്തം’ ആ കാരണബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയില്ല
  rationale: δέ മൃദുവായ ആഖ്യാനബന്ധകമാണ്. ഈ വാക്യത്തിൽ മലയാളത്തിന്റെ സ്വാഭാവിക പ്രവാഹം നിലനിർത്താൻ അതിനെ പ്രത്യേകമായി പദീകരിക്കേണ്ടതില്ല.
- source_word: φόβου αὐτοῦ
  choice: അവനെക്കുറിച്ചുള്ള ഭയം
  rationale: φόβος എന്നതിന്റെ നേരായ അർഥം ‘ഭയം’ ആണ്; αὐτοῦ മുൻവാക്യത്തിലെ ദൂതനെ സൂചിപ്പിക്കുന്നു. ‘അവനെക്കുറിച്ചുള്ള’ എന്നത് ആ വ്യക്തിയോടുള്ള ഭയത്തെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ἐσείσθησαν
  choice: വിറച്ച്
  rationale: σείωയുടെ ഈ രൂപം ശരീരം കുലുങ്ങുന്ന പ്രതികരണത്തെ, അഥവാ വിറയലിനെ, സൂചിപ്പിക്കുന്നു. ‘വിറച്ച്’ സജീവവും സ്വാഭാവികവുമായ മലയാളമാണ്.
- source_word: οἱ τηροῦντες
  choice: കാവൽക്കാർ
  rationale: അക്ഷരാർഥത്തിൽ ‘കാവൽ നിന്നിരുന്നവർ’; സന്ദർഭത്തിൽ കല്ലറ കാത്തിരുന്ന സൈനികരെയാണ് സൂചിപ്പിക്കുന്നത്. ‘കാവൽക്കാർ’ സംക്ഷിപ്തവും വ്യക്തവുമാണ്.
- source_word: ἐγενήθησαν
  choice: ആയി
  rationale: γίνομαι ഇവിടെ അവസ്ഥാമാറ്റം സൂചിപ്പിക്കുന്നു; ‘ആയി’ ആ മാറ്റം മലയാളത്തിൽ നേരായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὡς νεκροί
  choice: മരിച്ചവരെപ്പോലെ
  rationale: ὡς ഉപമയാണ്, യഥാർഥ മരണമല്ല. ‘മരിച്ചവരെപ്പോലെ’ ആ ഉപമ കൃത്യമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: αὐτοῦ (‘അവൻ’) എന്ന സർവനാമത്തിന്റെ സൂചന
  choice: മുൻവാക്യത്തിൽ വിവരിച്ച ദൂതനെ സൂചിപ്പിക്കുന്നതായി പരിഭാഷപ്പെടുത്തി.
  alternative: സ്വർഗീയ സംഭവത്തെ പൊതുവായി സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം.
  rationale: ഏറ്റവും അടുത്ത സന്ദർഭപൂർവപദം മിന്നൽപോലെയുള്ള രൂപമുള്ള ദൂതനാണ്. ഇത് സന്ദർഭാധിഷ്ഠിതമായ തീരുമാനമാണ്; പ്രത്യേക മതസിദ്ധാന്തം ഇതിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായതും ഗൗരവമുള്ളതുമായ മലയാളം. ഗ്രീക്കിലെ കാരണബന്ധവും ഉപമയും സംരക്ഷിച്ചുകൊണ്ട് സ്വാഭാവിക വാക്യഘടന ഉപയോഗിച്ചു.
