id: MAT.28.10
reference: Matthew 28:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τότε λέγει αὐταῖς ὁ Ἰησοῦς· Μὴ φοβεῖσθε· ὑπάγετε ἀπαγγείλατε τοῖς ἀδελφοῖς μου ἵνα ἀπέλθωσιν εἰς τὴν Γαλιλαίαν, κἀκεῖ με ὄψονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/010.yaml
  text: Then Jesus said to them[a], “Do not be afraid. Go, tell my brothers to go to Galilee[c][b], and there they will see me.”
translation:
  language: ml
  text: 'അപ്പോൾ യേശു അവരോടു പറഞ്ഞു: “ഭയപ്പെടേണ്ട. നിങ്ങൾ പോയി എന്റെ സഹോദരന്മാരോട്[a] ഗലീലയിലേക്കു പോകാൻ പറയുക; അവിടെ അവർ എന്നെ കാണും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “എന്റെ സഹോദരന്മാർ” എന്നു പറയുന്നത് ഇവിടെ യേശുവിന്റെ ശിഷ്യന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്. ഗ്രീക്കിൽ ഇത് പുല്ലിംഗ ബഹുവചനമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε λέγει αὐταῖς
  choice: അപ്പോൾ യേശു അവരോടു പറഞ്ഞു
  rationale: τότε കഥയിലെ തുടർച്ചയെ ‘അപ്പോൾ’ എന്നു സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു. λέγει ചരിത്രവർത്തമാനമാണെങ്കിലും മലയാളത്തിലെ കഥനശൈലിക്കനുസരിച്ച് ഭൂതകാലമായ ‘പറഞ്ഞു’ ഉപയോഗിച്ചു. αὐταῖς സ്ത്രീലിംഗ ബഹുവചനമാണെങ്കിലും സന്ദർഭത്തിൽ മുൻപറഞ്ഞ സ്ത്രീകളെ സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവികമായ ‘അവരോടു’ മതിയാകുന്നു.
- source_word: Μὴ φοβεῖσθε
  choice: ഭയപ്പെടേണ്ട
  rationale: നിഷേധാത്മക ആജ്ഞയുടെ അർത്ഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ആശ്വാസദായകവുമായ രീതിയിൽ നൽകുന്നു.
- source_word: ὑπάγετε ἀπαγγείλατε
  choice: നിങ്ങൾ പോയി ... പറയുക
  rationale: രണ്ട് ആജ്ഞകളും നിലനിർത്തുന്നു; ἀπαγγέλλω സന്ദേശം അറിയിക്കുന്നതിനെ സൂചിപ്പിക്കുമ്പോഴും ഇവിടെ ‘പറയുക’ എന്നത് സാധാരണ വായനക്കാർക്ക് കൂടുതൽ സ്വാഭാവികമാണ്.
- source_word: τοῖς ἀδελφοῖς μου
  choice: എന്റെ സഹോദരന്മാരോട്
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചനം കൃത്യമായി നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് യേശുവിന്റെ ശിഷ്യന്മാരെ സൂചിപ്പിക്കുന്നുവെങ്കിലും മുഖ്യപാഠത്തിൽ ‘ശിഷ്യന്മാർ’ എന്നു വ്യാഖ്യാനിച്ച് മാറ്റുന്നില്ല.
- source_word: ἵνα ἀπέλθωσιν εἰς τὴν Γαλιλαίαν
  choice: ഗലീലയിലേക്കു പോകാൻ
  rationale: ἵνα സഹിതമുള്ള ഉപവാക്യം ഇവിടെ അറിയിക്കേണ്ട പരോക്ഷ ആജ്ഞയുടെ ഉള്ളടക്കമാണ്; മലയാളത്തിൽ ‘പോകാൻ പറയുക’ അതിനെ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: κἀκεῖ με ὄψονται
  choice: അവിടെ അവർ എന്നെ കാണും
  rationale: κἀκεῖയിലെ സ്ഥലസൂചനയും ὄψονταιയുടെ ഭാവികാല അർത്ഥമായ ‘കാണും’ എന്നതും നേരിട്ട് നിലനിർത്തുന്നു; ‘കണ്ടുമുട്ടും’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക രൂപം ഒഴിവാക്കി.
theological_decisions:
- issue: ‘എന്റെ സഹോദരന്മാർ’ എന്നതിന്റെ സൂചിതർ
  choice: കുടുംബബന്ധസൂചകമായ ‘എന്റെ സഹോദരന്മാർ’ എന്ന മൂലപദപ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തി; സന്ദർഭത്തിൽ അത് യേശുവിന്റെ ശിഷ്യന്മാരെ സൂചിപ്പിക്കുന്നതായി അടിക്കുറിപ്പിൽ അറിയിച്ചു.
  alternative: മുഖ്യപാഠത്തിൽ ‘എന്റെ ശിഷ്യന്മാർ’ എന്നു പരിഭാഷപ്പെടുത്തുക, അല്ലെങ്കിൽ എല്ലാ അനുയായികളെയും ഉൾക്കൊള്ളുന്ന വിശാലമായ അർത്ഥം നൽകുക.
  rationale: സമീപസന്ദർഭം ശിഷ്യന്മാരിലേക്കാണ് വിരൽചൂണ്ടുന്നത്. എന്നാൽ ‘സഹോദരന്മാർ’ എന്ന ബന്ധപദത്തിന്റെ ദൈവശാസ്ത്രപരമായ ഊഷ്മളതയും ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചനവും വ്യാഖ്യാനിച്ച് ഇല്ലാതാക്കാതെ സംരക്ഷിക്കണം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ കഥനശൈലി. ‘പോകാൻ പറയുക’ എന്ന സ്വാഭാവിക പരോക്ഷ ആജ്ഞ ഉപയോഗിച്ചെങ്കിലും, ‘സഹോദരന്മാർ’ എന്നും ‘കാണും’ എന്നും മൂലപാഠത്തിന്റെ നിർണായക പദങ്ങൾ വ്യാഖ്യാനാത്മകമായി മാറ്റാതെ നിലനിർത്തി.
