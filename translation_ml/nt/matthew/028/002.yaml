  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ σεισμὸς ἐγένετο μέγας· ἄγγελος γὰρ κυρίου καταβὰς ἐξ οὐρανοῦ ⸀καὶ προσελθὼν ἀπεκύλισε τὸν ⸀λίθον καὶ ἐκάθητο ἐπάνω αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/002.yaml
  text: And behold, there was a great earthquake, for an angel of the Lord had come down from heaven and came up and rolled away the stone and was sitting on it.
translation:
  language: ml
  text: ഇതാ, വലിയൊരു ഭൂകമ്പം ഉണ്ടായി; കാരണം, കർത്താവിന്റെ ഒരു ദൂതൻ സ്വർഗത്തിൽനിന്ന് ഇറങ്ങിവന്ന് അടുത്തുചെന്ന് കല്ല് ഉരുട്ടിമാറ്റി അതിന്റെമേൽ ഇരിക്കുകയായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: സംഭവത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗ്രീക്ക് അവതരണസൂചനയെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: σεισμὸς ... μέγας
  choice: വലിയൊരു ഭൂകമ്പം
  rationale: μέγας എന്ന വിശേഷണത്തിന്റെ ശക്തിയും σεισμός എന്ന പദത്തിന്റെ സാധാരണ അർഥവും നേരിട്ട് പകരുന്നു.
- source_word: ἄγγελος ... κυρίου
  choice: കർത്താവിന്റെ ഒരു ദൂതൻ
  rationale: അനിശ്ചിതമായ ἄγγελος എന്ന നാമത്തെയും κύριος എന്ന ദൈവസംബന്ധിയായ വിശേഷണത്തെയും കൂട്ടിച്ചേർത്ത് സ്വാഭാവികമായി പകരുന്നു; മൂലത്തിൽ വ്യക്തിനാമമില്ല.
- source_word: καταβὰς ἐξ οὐρανοῦ
  choice: സ്വർഗത്തിൽനിന്ന് ഇറങ്ങിവന്ന്
  rationale: aorist participle-ന്റെ മുൻകാല/സഹചര പ്രവർത്തനത്തെ മലയാളത്തിലെ ക്രിയാശൃംഖലയായി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: προσελθὼν
  choice: കല്ലിനരികെ ചെന്ന്
  rationale: ‘അടുത്തേക്കു വരുക/ചെല്ലുക’ എന്ന അർഥം വ്യക്തമാക്കുന്നു; സന്ദർഭത്തിൽ സമീപിച്ചത് കല്ലിനെയാണ് എന്ന് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἀπεκύλισε τὸν λίθον
  choice: കല്ല് ഉരുട്ടിമാറ്റി
  rationale: ἀποκυλίω എന്ന ക്രിയയിലെ ‘ഉരുട്ടി അകറ്റുക’ എന്ന ചലനവും ഫലവും ഒരുമിച്ച് പകരുന്നു.
- source_word: ἐκάθητο ἐπάνω αὐτοῦ
  choice: അതിന്മേൽ ഇരിക്കുകയായിരുന്നു
  rationale: imperfect രൂപത്തിലെ തുടരുന്ന അവസ്ഥയും αὐτοῦ എന്ന സർവനാമത്തിന്റെ കല്ലിലേക്കുള്ള സ്വാഭാവിക സൂചനയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഭൂകമ്പവും ദൂതന്റെ ഇറക്കവും തമ്മിലുള്ള γάρ ബന്ധം
  choice: രണ്ട് വാക്യങ്ങളാക്കിയെങ്കിലും രണ്ടാമത്തെ വാക്യം സംഭവത്തിന്റെ വിശദീകരണമായി തുടർച്ചയിൽ നിലനിർത്തി
  alternative: ‘കാരണം’ എന്ന് തുറന്നുപറഞ്ഞ് ദൂതന്റെ പ്രവർത്തനമാണ് ഭൂകമ്പത്തിന്റെ നേരിട്ടുള്ള കാരണം എന്ന് നിർണ്ണയിക്കുക
  rationale: γάρ വിശദീകരണപരമോ കാരണപരമോ ആകാം. മലയാളത്തിൽ കർശനമായ കാരണബന്ധം ചേർക്കാതെ മൂലത്തിലെ ബന്ധവും സാധ്യതയുള്ള അർഥവ്യാപ്തിയും സംരക്ഷിക്കുന്നു.
- issue: ദൂതൻ കല്ല് മാറ്റിയത് യേശുവിനെ പുറത്തുവിടാനാണോ
  choice: ഉദ്ദേശ്യം ചേർക്കാതെ പ്രവർത്തനം മാത്രം വിവർത്തനം ചെയ്തു
  alternative: യേശു പുറത്തുവരേണ്ടതിന് ദൂതൻ കല്ല് മാറ്റി എന്നു വിശദീകരിക്കുക
  rationale: അത്തരം ഉദ്ദേശ്യം ഈ വാക്യം പ്രസ്താവിക്കുന്നില്ല; വ്യാഖ്യാനപരമായ ദൈവശാസ്ത്ര നിഗമനം വാചകത്തിലേക്ക് ഇറക്കുമതി ചെയ്യരുത്.
translation_notes:
  register: ആധുനിക സ്റ്റാൻഡേർഡ് മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി. ‘അപ്പോൾ ഇതാ’ കഥാസന്ദർഭത്തിലെ അപ്രതീക്ഷിത ശ്രദ്ധാകർഷണം നിലനിർത്തുന്നു. ഗ്രീക്ക് participle-കളെ ഭാരമുള്ള നാമവൽക്കരണങ്ങളാക്കാതെ മലയാളത്തിലെ ക്രിയാശൃംഖലയായി അവതരിപ്പിച്ചു.
