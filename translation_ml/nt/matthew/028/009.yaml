id: MAT.28.9
reference: Matthew 28:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀καὶ ⸀ἰδοὺ Ἰησοῦς ⸀ὑπήντησεν αὐταῖς λέγων· Χαίρετε· αἱ δὲ προσελθοῦσαι ἐκράτησαν αὐτοῦ τοὺς πόδας καὶ προσεκύνησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/009.yaml
  text: And behold[a], Jesus met them, saying, “Greetings!” And they came up, took hold of his feet[b], and worshiped him.
translation:
  language: ml
  text: അപ്പോൾ, ഇതാ, യേശു അവരെ കണ്ടുമുട്ടി, “സന്തോഷിക്കുവിൻ!”[a] എന്നു പറഞ്ഞു. അവർ അടുത്തുചെന്ന് അവന്റെ കാലുകൾ മുറുകെപ്പിടിച്ച് അവനെ ആരാധിച്ചു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ “നമസ്കാരം!” ഗ്രീക്കിൽ ഇത് അക്ഷരാർഥത്തിൽ ബഹുവചന ആജ്ഞാരൂപമാണ്: “സന്തോഷിക്കുവിൻ”; എന്നാൽ ഇവിടെ അത് ഒരു അഭിവാദനമായി പ്രവർത്തിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “അവന്റെ മുമ്പിൽ കുമ്പിട്ടു” / “അവനു പ്രണാമം അർപ്പിച്ചു.” ഗ്രീക്ക് പദത്തിന് കുമ്പിടുക, പ്രണാമം അർപ്പിക്കുക, ആരാധിക്കുക എന്നീ അർഥങ്ങൾ വരാം; ഉയിർത്തെഴുന്നേൽപ്പിന്റെ ഈ സന്ദർഭത്തിൽ “ആരാധിച്ചു” എന്ന ശക്തമായ അർഥം യോജിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും ആഖ്യാനത്തിന് സജീവത നൽകുകയും ചെയ്യുന്ന വ്യവഹാരസൂചകത്തിന്റെ ശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὑπήντησεν
  choice: എതിരേറ്റു
  rationale: യേശു വഴിയിൽ അവരെ കണ്ടുമുട്ടിയെന്ന അർഥം ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു; ക്രിയയിൽ വ്യക്തമല്ലാത്ത അധിക ദിശാസൂചന ചേർക്കുന്നില്ല.
- source_word: Χαίρετε
  choice: നിങ്ങൾക്കു സന്തോഷം!
  rationale: ബഹുവചന ആജ്ഞാരൂപത്തിന്റെ ‘സന്തോഷിക്കുക’ എന്ന പദബന്ധവും അഭിവാദനധർമവും ഒരുമിച്ച് കേൾക്കാവുന്ന, dignified Malayalam formulation; ഇത് വെറും ആധുനിക ‘ഹലോ’യേക്കാൾ മൂലപദത്തിന്റെ ശബ്ദാർഥം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: προσελθοῦσαι
  choice: അടുത്തുചെന്ന്
  rationale: തുടർന്നുള്ള പ്രവൃത്തികൾക്കു മുമ്പായി അവർ യേശുവിന്റെ അടുത്തേക്ക് നീങ്ങിയ ക്രമം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἐκράτησαν αὐτοῦ τοὺς πόδας
  choice: അവന്റെ കാലുകൾ മുറുകെപ്പിടിച്ച്
  rationale: κρατέω സൂചിപ്പിക്കുന്ന ഉറച്ച ശാരീരിക പിടിത്തം വ്യക്തമാക്കുന്നു; ‘പിടിച്ചെടുത്തു’ എന്നതിലെ കടുപ്പമോ ആക്രമണഭാവമോ ഒഴിവാക്കുന്നു.
- source_word: προσεκύνησαν αὐτῷ
  choice: അവനെ ആരാധിച്ചു
  rationale: ഉയിർത്തെഴുന്നേറ്റ യേശുവിനെ സംബന്ധിക്കുന്ന ഈ സന്ദർഭത്തിൽ മതപരമായ ശക്തി സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു; അതേസമയം പാദപ്രണാമം/ബഹുമാനാർപ്പണം എന്ന പദസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ഉയിർത്തെഴുന്നേറ്റ യേശുവിനോടുള്ള προσκυνέω എന്ന പ്രവൃത്തിയുടെ വിവർത്തനം
  choice: അവനെ ആരാധിച്ചു
  alternative: അവന്റെ മുമ്പിൽ കുമ്പിട്ടു / അവനു പ്രണാമം അർപ്പിച്ചു
  rationale: മത്തായിയുടെ ഉയിർപ്പുവിവരണസന്ദർഭത്തിൽ ഈ പ്രവൃത്തിക്ക് കേവലമായ ആദരവിനേക്കാൾ ശക്തമായ മതപരമായ ഭാരം ഉണ്ടാകാം. ‘ആരാധിച്ചു’ അതിനെ പ്രതിഫലിപ്പിക്കുന്നു; എങ്കിലും ഗ്രീക്ക് പദത്തിന്റെ വിശാലമായ അർഥപരിധി അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ തിരുവെഴുത്തുവായനയ്ക്ക് യോജിച്ച ഗൗരവമുള്ള മലയാളം. ‘ഇതാ’ ആഖ്യാനത്തിന്റെ സജീവത കാത്തുസൂക്ഷിക്കുന്നു. Χαίρετε എന്നതിലെ അഭിവാദനവും സന്തോഷിക്കാനുള്ള ആഹ്വാനവും തമ്മിലുള്ള ഉദ്ദേശ്യപൂർവമായ അർഥതന്മയത്വം മുഖ്യവാചകത്തിലും അടിക്കുറിപ്പിലും നിലനിർത്തിയിരിക്കുന്നു.
