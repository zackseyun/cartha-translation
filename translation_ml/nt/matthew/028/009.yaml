revisions:
- from: അപ്പോൾ ഇതാ, യേശു അവരെ എതിരേറ്റുകൊണ്ട്, “നിങ്ങൾക്കു സന്തോഷം!”[a] എന്നു പറഞ്ഞു. അവർ അടുത്തുചെന്ന് അവന്റെ കാലുകൾ മുറുകെപ്പിടിച്ച് അവനെ ആരാധിച്ചു.[b]
  to: അപ്പോൾ, ഇതാ, യേശു അവരെ കണ്ടുമുട്ടി, “സന്തോഷിക്കുവിൻ!”[a] എന്നു പറഞ്ഞു. അവർ അടുത്തുചെന്ന് അവന്റെ കാലുകൾ മുറുകെപ്പിടിച്ച് അവനെ ആരാധിച്ചു.[b]
  rationale: The revision restores the Greek clause structure by making Jesus’ meeting them the main action, replaces an unidiomatic greeting with a literal and register-appropriate imperative whose greeting force is documented in the note, and narrows the alternative note so it does not specify a posture beyond what προσκυνέω states. The contextual rendering “ആരാധിച്ചു” is retained while the lexical ambiguity remains accessible in the footnote.
  reviewer_model: gpt-5.6-terra
