id: MAT.28.20
reference: Matthew 28:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διδάσκοντες αὐτοὺς τηρεῖν πάντα ὅσα ἐνετειλάμην ὑμῖν· καὶ ἰδοὺ ἐγὼ μεθ’ ὑμῶν εἰμι πάσας τὰς ἡμέρας ἕως τῆς συντελείας τοῦ ⸀αἰῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/020.yaml
  text: teaching them to keep all that I commanded you. And behold[a], I am with you all the days, until the end of the age.
translation:
  language: ml
  text: ഞാൻ നിങ്ങളോടു കല്പിച്ചതെല്ലാം പാലിക്കാൻ അവരെ പഠിപ്പിച്ചുകൊണ്ട്. ഇതാ, യുഗത്തിന്റെ സമാപ്തിവരെ[a] എല്ലാ ദിവസവും ഞാൻ നിങ്ങളോടുകൂടെ ഉണ്ട്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘യുഗത്തിന്റെ അവസാനംവരെ.’ പരമ്പരാഗതമായി ‘ലോകാവസാനംവരെ’ എന്നും പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്. എന്നാൽ ഗ്രീക്കിൽ ഭൗതികലോകത്തെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നതല്ല, യുഗത്തിന്റെ സമാപ്തിയെയാണ് (αἰών) പറയുന്നത്.
    reason: പര്യായ പരിഭാഷ വ്യക്തമാക്കാനും ‘യുഗം’ എന്ന ഗ്രീക്ക് പദത്തെ ‘ലോകം’ എന്നു തെറ്റിദ്ധരിക്കുന്നത് ഒഴിവാക്കാനും.
lexical_decisions:
- source_word: διδάσκοντες
  choice: പഠിപ്പിച്ചുകൊണ്ട്
  rationale: വർത്തമാനകാല പങ്കുപദത്തിന്റെ തുടർച്ചയും മുൻവാക്യത്തിലെ ശിഷ്യരാക്കൽ എങ്ങനെ നടപ്പാക്കണം എന്ന ബന്ധവും നിലനിർത്തുന്നു.
- source_word: τηρεῖν
  choice: പാലിക്കാൻ
  rationale: കല്പനകളെ സൂക്ഷ്മമായി അനുസരിക്കുകയും ആചരിക്കുകയും ചെയ്യുക എന്ന ഇരട്ടഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: πάντα ὅσα
  choice: കല്പിച്ചതെല്ലാം
  rationale: ഗ്രീക്കിലെ സമഗ്രമായ വ്യാപ്തി സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടമാക്കുന്നു.
- source_word: ἐνετειλάμην
  choice: കല്പിച്ചതെല്ലാം
  rationale: യേശുവിന്റെ നിർദേശത്തിനുള്ള അധികാരഭാവം ‘കല്പിച്ചു’ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗൗരവമുള്ള വ്യവഹാരചിഹ്നത്തിന് മലയാളത്തിലെ സ്വാഭാവികവും പരമ്പരാഗതവുമായ തുല്യം.
- source_word: μεθ’ ὑμῶν εἰμι
  choice: ഞാൻ നിങ്ങളോടുകൂടെ ഉണ്ട്
  rationale: ശിഷ്യരോടുള്ള സാന്നിധ്യം നേരിട്ടും വ്യക്തമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: πάσας τὰς ἡμέρας
  choice: എല്ലാ ദിവസവും
  rationale: അക്ഷരാർഥത്തിലെ ‘എല്ലാ ദിവസങ്ങളും’ എന്ന ദിവസംതോറുമുള്ള തുടർച്ച സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: συντελείας
  choice: സമാപ്തി
  rationale: വെറും പെട്ടെന്നുള്ള അവസാനം എന്നതിലുപരി ഒരു കാലഘട്ടം അതിന്റെ പൂർത്തിയായ പര്യവസാനത്തിലെത്തുന്നു എന്ന ഭാവം നിലനിർത്തുന്നു.
- source_word: αἰῶνος
  choice: യുഗം
  rationale: ഭൗതികലോകത്തെ സൂചിപ്പിക്കുന്ന ‘ലോകം’ എന്നതിനു പകരം കാലഘട്ടം എന്ന ഗ്രീക്ക് അർഥം കൃത്യമായി നൽകുന്നു.
theological_decisions:
- issue: ἕως τῆς συντελείας τοῦ αἰῶνος എന്ന കാലസൂചക പ്രയോഗം
  choice: യുഗത്തിന്റെ സമാപ്തിവരെ
  alternative: യുഗത്തിന്റെ അവസാനംവരെ; ലോകാവസാനംവരെ
  rationale: ഇത് ഭൗതികപ്രപഞ്ചത്തിന്റെ നാശം എന്ന് നിർബന്ധമായി പറയുന്നില്ല; ഒരു യുഗത്തിന്റെ പര്യവസാനമാണ് ഗ്രീക്ക് പ്രയോഗം സൂചിപ്പിക്കുന്നത്. ‘സമാപ്തി’ συντέλεια എന്നതിലെ പൂർത്തീകരണഭാവവും ‘യുഗം’ αἰών എന്നതിലെ കാലഘട്ടഭാവവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. മുൻവാക്യത്തോടുള്ള വ്യാകരണബന്ധം നിലനിർത്താൻ ‘പഠിപ്പിച്ചുകൊണ്ട്’ ഉപയോഗിച്ചു; ദിവസംതോറുമുള്ള സാന്നിധ്യം വ്യക്തമാക്കാൻ ‘എല്ലാ ദിവസവും’ തെരഞ്ഞെടുത്തു.
