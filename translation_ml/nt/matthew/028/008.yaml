id: MAT.28.8
reference: Matthew 28:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸀ἀπελθοῦσαι ταχὺ ἀπὸ τοῦ μνημείου μετὰ φόβου καὶ χαρᾶς μεγάλης ἔδραμον ἀπαγγεῖλαι τοῖς μαθηταῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/008.yaml
  text: And leaving the tomb quickly[a], with fear and great joy, they ran to report to his disciples.
translation:
  language: ml
  text: അവർ കല്ലറയിൽനിന്ന് വേഗം പുറപ്പെട്ട്, ഭയത്തോടും വലിയ സന്തോഷത്തോടും കൂടി[a], അവന്റെ ശിഷ്യന്മാരെ അറിയിക്കാനായി ഓടി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വിസ്മയഭയത്തോടും വലിയ സന്തോഷത്തോടും കൂടി.’ ഇവിടെ ‘ഭയം’ എന്നു പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്ക് പദത്തിന് ഭക്തിപൂർവമായ വിസ്മയഭയത്തിന്റെ അർഥവും ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπελθοῦσαι ταχὺ ἀπὸ τοῦ μνημείου
  choice: കല്ലറയിൽനിന്ന് വേഗം പുറപ്പെട്ട്
  rationale: സ്ത്രീകളെ സൂചിപ്പിക്കുന്ന aorist participle-ഉം ταχύ എന്ന വേഗസൂചനയും സ്വാഭാവികമായ മലയാളത്തിൽ ക്രമവും ആശയവും നിലനിർത്തി നൽകുന്നു.
- source_word: μνημείου
  choice: കല്ലറ
  rationale: ഉയിർത്തെഴുന്നേൽപ്പിന്റെ സന്ദർഭത്തിൽ μνημεῖον ശവസംസ്കാരസ്ഥലത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ‘കല്ലറ’ വ്യക്തവും പതിവുമായ പദമാണ്.
- source_word: μετὰ φόβου καὶ χαρᾶς μεγάλης
  choice: ഭയത്തോടും വലിയ സന്തോഷത്തോടുംകൂടെ
  rationale: φόβος, χαρά എന്നീ രണ്ടുവികാരങ്ങളുടെയും ഒത്തുചേരൽ മത്തായി ഉദ്ദേശപൂർവം നിലനിർത്തുന്നു; ഒന്നിനെ മറ്റൊന്നായി ലഘൂകരിക്കുന്നില്ല.
- source_word: ἔδραμον
  choice: ഓടി
  rationale: τρέχω എന്ന ക്രിയയുടെ വ്യക്തമായ ശാരീരിക പ്രവർത്തനം ‘ഓടി’ നേരിട്ട് പകർന്നു നൽകുന്നു; ‘തിടുക്കപ്പെട്ടു’ എന്നതിനെക്കാൾ ദൃശ്യത നിലനിർത്തുന്നു.
- source_word: ἀπαγγεῖλαι
  choice: അറിയിക്കാനായി
  rationale: ഇത് ἔδραμον എന്ന ക്രിയയ്ക്കുശേഷമുള്ള ഉദ്ദേശ്യസൂചക infinitive ആണ്. ഗ്രീക്കിൽ നേരിട്ടുള്ള കർമം പ്രകടമല്ലാത്തതിനാൽ മലയാളത്തിലും അനാവശ്യമായി ‘അത്’ ചേർക്കുന്നില്ല.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: അവന്റെ ശിഷ്യന്മാരെ
  rationale: ἀπαγγέλλω എന്ന ആശയത്തോടൊപ്പം മലയാളത്തിൽ ‘ആരെ അറിയിക്കുക’ എന്ന പ്രയോഗം സ്വാഭാവികമാണ്; μαθηταί എന്ന ബന്ധപദത്തിന് ‘ശിഷ്യന്മാർ’ അനുയോജ്യം.
theological_decisions:
- issue: സ്ത്രീകളുടെ പ്രതികരണത്തിലെ വികാരപരമായ സംഘർഷം
  choice: ഭയത്തോടും വലിയ സന്തോഷത്തോടുംകൂടെ
  alternative: ഭക്ത്യാദരത്തോടും വലിയ സന്തോഷത്തോടുംകൂടെ
  rationale: φόβος എന്നതിന് ഈ സന്ദർഭത്തിൽ ഭക്ത്യാദരമോ വിസ്മയഭയമോ ഉൾക്കൊള്ളാമെങ്കിലും, മൂലപാഠത്തിലെ ‘ഭയം–സന്തോഷം’ എന്ന ഉദ്ദേശപൂർവമായ സംഘർഷം മുഖ്യപാഠത്തിൽ തുറന്ന നിലയിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. സ്ത്രീകൾ എന്ന കർത്താവ് മുൻസന്ദർഭത്തിൽനിന്ന് മനസ്സിലാകുന്നതിനാൽ ‘അവർ’ ഉപയോഗിച്ചു. വികാരങ്ങളുടെ കൂട്ടായ്മയും ഓട്ടത്തിന്റെ സജീവതയും സംരക്ഷിച്ചു.
