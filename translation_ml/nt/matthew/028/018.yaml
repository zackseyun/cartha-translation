- source_word: Ἐδόθη μοι
  choice: എനിക്കു നൽകപ്പെട്ടിരിക്കുന്നു
  rationale: aorist passive-നെ പൂർത്തിയായെങ്കിലും ഇപ്പോഴും പ്രാബല്യമുള്ള ദാനമായി മലയാളത്തിൽ അവതരിപ്പിക്കുകയും കർമണിപ്രയോഗം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: πᾶσα ἐξουσία
  choice: സകല അധികാരവും
  rationale: ഏകവചനമായ ഭാവനാമത്തോടുകൂടിയ πᾶσα സമഗ്രത സൂചിപ്പിക്കുന്നു; ἐξουσία വെറും ശക്തിയേക്കാൾ അവകാശപൂർവമായ ഭരണാധികാരത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: ἐν οὐρανῷ καὶ ἐπὶ τῆς γῆς
  choice: സ്വർഗത്തിലും ഭൂമിയിലുമുള്ള
  rationale: രണ്ടു മേഖലകളെയും ഉൾക്കൊള്ളുന്ന സമാന്തരപ്രയോഗം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശുവിന് സാർവത്രിക അധികാരം ലഭിച്ചതിന്റെ സ്വഭാവം
  choice: സകല അധികാരവും എനിക്കു നൽകപ്പെട്ടിരിക്കുന്നു
  alternative: സകല അധികാരവും എനിക്കു നൽകപ്പെട്ടു
  rationale: ദൈവിക കർമകർത്താവിനെ വാക്യം വ്യക്തമാക്കാത്തതിനാൽ അത് ചേർക്കുന്നില്ല; passive രൂപം സംരക്ഷിക്കുന്നു. ‘നൽകപ്പെട്ടിരിക്കുന്നു’ പൂർത്തിയായ ദാനത്തിന്റെ ഇപ്പോഴത്തെ പ്രാബല്യം വ്യക്തമാക്കുന്നു; ലളിതഭൂതകാലവും വ്യാകരണപരമായി സാധ്യമാണ്.
- issue: ἐξουσίαയുടെ അർഥം
  choice: അധികാരം
  alternative: ശക്തി
  rationale: ഇവിടെ പദം പ്രധാനമായി കഴിവോ ബലമോ അല്ല, ന്യായമായ അധികാരവും ഭരണാവകാശവുമാണ് സൂചിപ്പിക്കുന്നത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അവരുടെ അടുത്തേക്ക്’ സ്ഥലപരമായ അർഥം വ്യക്തമാക്കുന്നു; ‘അധികാരം’ ἐξουσίαയുടെ ഭരണാവകാശസൂചന കൃത്യമായി നൽകുന്നു. നേരിട്ടുള്ള ഉദ്ധരണിക്ക് മുമ്പ് ‘പറഞ്ഞുകൊണ്ട്’ എന്ന അസ്വാഭാവിക ആവർത്തനത്തിനു പകരം കോളൻ ഉപയോഗിച്ചു.
