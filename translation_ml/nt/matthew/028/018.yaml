  yaml_path: translation/nt/matthew/028/018.yaml
  text: And Jesus came near and spoke to them[a], saying[b], “All authority in heaven and on earth has been given to me.”
translation:
  language: ml
  text: 'യേശു അവരുടെ അടുത്തേക്ക് വന്ന് അവരോടു സംസാരിച്ചു: “സ്വർഗത്തിലും ഭൂമിയിലുമുള്ള സകല അധികാരവും എനിക്കു നൽകപ്പെട്ടിരിക്കുന്നു.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “എനിക്കു നൽകപ്പെട്ടു.” ഗ്രീക്കിലെ ഭൂതകാല കർമണിരൂപം ഇങ്ങനെ കൂടുതൽ രൂപസമാനമായി പരിഭാഷപ്പെടുത്താം; പ്രധാനപാഠത്തിലെ “നൽകപ്പെട്ടിരിക്കുന്നു” പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ പ്രാബല്യം വ്യക്തമാക്കുന്നു.
    reason: lexical_alternative
