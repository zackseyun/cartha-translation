source:
  edition: SBLGNT
  text: καὶ ἐὰν ἀκουσθῇ τοῦτο ⸀ἐπὶ τοῦ ἡγεμόνος, ἡμεῖς πείσομεν ⸀αὐτὸν καὶ ὑμᾶς ἀμερίμνους ποιήσομεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/014.yaml
  text: And if this is heard by the governor, we will persuade him and keep you out of trouble.
translation:
  language: ml
  text: ഇക്കാര്യം ഗവർണറുടെ ശ്രദ്ധയിൽപ്പെട്ടാൽ[a], ഞങ്ങൾ അദ്ദേഹത്തെ സമ്മതിപ്പിച്ച് നിങ്ങളെ കുഴപ്പത്തിൽപ്പെടാതെ നോക്കിക്കൊള്ളാം.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇക്കാര്യം ഗവർണർ കേട്ടാൽ.’
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘നിങ്ങളെ ആശങ്കയില്ലാത്തവരാക്കും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκουσθῇ ... ἐπὶ τοῦ ἡγεμόνος
  choice: ഗവർണറുടെ ശ്രദ്ധയിൽപ്പെട്ടാൽ
  rationale: ഇവിടെ ἀκούωയുടെ നിഷ്ക്രിയരൂപവും ἐπί + സമ്പ്രദാനസംബന്ധിയായ പ്രയോഗവും ചേർന്ന് കാര്യം ഗവർണർ അറിയുന്നതിനെ സൂചിപ്പിക്കുന്നു. പദാനുപദമായ ‘ഗവർണർ കേട്ടാൽ’ എന്നതിനെക്കാൾ സന്ദർഭാർത്ഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἡγεμόνος
  choice: ഗവർണർ
  rationale: റോമൻ ഭരണസന്ദർഭത്തിൽ ἡγεμών പ്രവിശ്യാ ഗവർണറെയാണ്, ഇവിടെ പീലാത്തൊസിനെയാണ്, സൂചിപ്പിക്കുന്നത്.
- source_word: πείσομεν αὐτόν
  choice: ഞങ്ങൾ അദ്ദേഹത്തെ സമ്മതിപ്പിച്ച്
  rationale: πείθωയുടെ സാധാരണ അർത്ഥമായ ‘സമ്മതിപ്പിക്കുക’ നിലനിർത്തുന്നു; എങ്ങനെ സമ്മതിപ്പിക്കുമെന്നത് വാക്യം വ്യക്തമാക്കാത്തതിനാൽ അതിനെ വിശദീകരിക്കുന്നില്ല.
- source_word: ὑμᾶς ἀμερίμνους ποιήσομεν
  choice: നിങ്ങളെ കുഴപ്പത്തിൽപ്പെടാതെ നോക്കിക്കൊള്ളാം
  rationale: അക്ഷരാർഥത്തിൽ ‘നിങ്ങളെ ആശങ്കയില്ലാത്തവരാക്കും’ എന്നാണെങ്കിലും, കാവൽക്കാർക്ക് ശിക്ഷാനടപടി നേരിടേണ്ടിവരാതിരിക്കാൻ നോക്കുമെന്ന സന്ദർഭപരമായ ഫലം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘നോക്കിക്കൊള്ളാം’ എന്ന പ്രയോഗം ഉറപ്പുനൽകുന്ന ഭാവി വാഗ്ദാനത്തെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; മൂലത്തിലെ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
