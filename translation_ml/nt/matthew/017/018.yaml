id: MAT.17.18
reference: Matthew 17:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐπετίμησεν αὐτῷ ὁ Ἰησοῦς, καὶ ἐξῆλθεν ἀπ’ αὐτοῦ τὸ δαιμόνιον· καὶ ἐθεραπεύθη ὁ παῖς ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/018.yaml
  text: And Jesus rebuked it[a], and the demon came out of him; and the boy was healed from that hour.
translation:
  language: ml
  text: യേശു അതിനെ ശാസിച്ചു; ഭൂതം അവനിൽനിന്ന് പുറത്തുവന്നു. ആ സമയം മുതൽ ബാലൻ സുഖം പ്രാപിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπετίμησεν
  choice: ശാസിച്ചു
  rationale: അധികാരത്തോടെ ശക്തമായി വിലക്കുകയോ ശാസിക്കുകയോ ചെയ്യുന്നതാണ് ἐπιτιμάω സൂചിപ്പിക്കുന്നത്. ഭൂതബാധ ഒഴിപ്പിക്കുന്ന ഈ സന്ദർഭത്തിൽ “ശാസിച്ചു” എന്നത് പദത്തിന്റെ ശക്തി സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: αὐτῷ
  choice: അതിനെ
  rationale: ഗ്രീക്കിലെ സർവനാമം വ്യാകരണപരമായി ബാലനെയോ ഭൂതത്തെയോ സൂചിപ്പിക്കാൻ കഴിയുമെങ്കിലും, പിന്നാലെ ഭൂതം അവനിൽനിന്ന് പുറത്തുവന്നുവെന്നതിനാൽ ഇവിടെ ഭൂതമാണ് ഏറ്റവും സ്വാഭാവികമായ സൂചന. മലയാളത്തിൽ ഭൂതത്തെ സൂചിപ്പിക്കാൻ “അതിനെ” ഉപയോഗിച്ചു.
- source_word: τὸ δαιμόνιον
  choice: ഭൂതം
  rationale: δαιμόνιον എന്നതിന് മലയാളത്തിൽ സാധാരണവും നേരിട്ടുള്ളതുമായ തുല്യപദമാണ് “ഭൂതം.” “അശുദ്ധാത്മാവ്” എന്നു വിവർത്തനം ചെയ്താൽ മൂലപാഠത്തിൽ ഇല്ലാത്ത വിശേഷണം ചേർക്കപ്പെടും.
- source_word: ἐξῆλθεν ἀπ’ αὐτοῦ
  choice: അവനിൽനിന്ന് പുറത്തുവന്നു
  rationale: മൂലത്തിലെ വ്യക്തവും ദൃശ്യവുമായ പ്രയോഗം നിലനിർത്തുന്ന, സ്വാഭാവികമായ മലയാളരൂപമാണിത്.
- source_word: ἐθεραπεύθη
  choice: സുഖം പ്രാപിച്ചു
  rationale: θεραπεύω എന്ന ക്രിയയുടെ രോഗശാന്തി എന്ന അർഥം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി നൽകുന്നു; കർത്തരി സ്വഭാവമുള്ള മലയാളപ്രയോഗമായിരുന്നാലും ഗ്രീക്കിലെ ഫലാവസ്ഥ കൃത്യമായി അറിയിക്കുന്നു.
- source_word: ὁ παῖς
  choice: ബാലൻ
  rationale: παῖς എന്നതിന് കുട്ടി, ബാലൻ, ദാസൻ എന്നീ അർഥങ്ങൾ ഉണ്ടാകാം. പിതാവിന്റെ മകനെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ “ബാലൻ” കൃത്യവും ഗൗരവമുള്ളതുമാണ്.
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: ആ സമയംമുതൽ
  rationale: പദാനുപദമായി “ആ മണിക്കൂർമുതൽ” എന്നു പറയുന്നത് ആധുനിക മലയാളത്തിൽ അസ്വാഭാവികമാകാം. “ആ സമയംമുതൽ” മൂലത്തിലെ കാലസൂചനയും തുടർന്നുള്ള ഫലവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശു ശാസിച്ചതിന്റെ സൂചനാവിഷയം (αὐτῷ)
  choice: ഭൂതം—“അതിനെ”
  alternative: ബാലൻ—“അവനെ”
  rationale: സർവനാമരൂപത്തിൽ വ്യാകരണപരമായ സാധ്യത നിലനിൽക്കുന്നുണ്ടെങ്കിലും, ഉടനെത്തുടരുന്ന “ഭൂതം അവനിൽനിന്ന് പുറത്തുവന്നു” എന്ന വാക്യം യേശുവിന്റെ ശാസന ഭൂതത്തോടായിരുന്നു എന്ന് ശക്തമായി സൂചിപ്പിക്കുന്നു. അതിനാൽ സന്ദർഭപരമായി ഏറ്റവും സാധ്യതയുള്ള വായന മുഖ്യപാഠത്തിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ വചനത്തിന് യോജിച്ച ഗൗരവമുള്ള മലയാളം. ചെറുവാക്യങ്ങളും അർദ്ധവിരാമവും ഉപയോഗിച്ച് ഗ്രീക്കിലെ സംഭവക്രമം വ്യക്തമായി നിലനിർത്തി.
