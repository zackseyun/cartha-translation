  terminology: “ഭൂതം” is the established direct rendering of δαιμόνιον and does not import “unclean.” “ബാലൻ” fits παῖς in the immediate narrative context. Rendering the rebuked referent as “അതിനെ” appropriately reflects the contextually likely demon without introducing doctrinal interpretation.
