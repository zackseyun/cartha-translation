  source_fidelity: The rendering accurately conveys ὀλιγοπιστία as deficient rather than absent faith, retains the historical present of λέγει, preserves the mustard-seed comparison, the imperative to the mountain, and the unrestricted closing statement. The initial Malayalam ‘എന്നാൽ’ gives δέ an unnecessarily adversative force in this immediate answer-to-question context; omitting it better reflects the weak connective without losing meaning.
  naturalness: The revised wording is fluent modern standard Malayalam with an appropriately serious scriptural register. ‘നിങ്ങൾക്കു ഒന്നും അസാധ്യമാകുകയില്ല’ is a slightly more natural word order than the draft’s closing while retaining the Greek sense.
  terminology: ‘അല്പവിശ്വാസം’ suitably represents ὀλιγοπιστία, and ‘വിശ്വാസം’ for πίστις is faithful and non-sectarian. ‘കടുകുമണി’ and ‘മാറുക’ are clear, conventional choices for the image and the mountain’s relocation.
  issues:
  - severity: low
    issue: ‘എന്നാൽ’ at the opening overstates the force of δέ.
    rationale: In this narrative response, δέ functions as a light connective rather than a marked contrast. Malayalam can omit it naturally; this avoids an implication of adversative contrast not required by the Greek.
