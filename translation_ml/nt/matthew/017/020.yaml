id: MAT.17.20
reference: Matthew 17:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀λέγει αὐτοῖς· Διὰ τὴν ⸀ὀλιγοπιστίαν ὑμῶν· ἀμὴν γὰρ λέγω ὑμῖν, ἐὰν ἔχητε πίστιν ὡς κόκκον σινάπεως, ἐρεῖτε τῷ ὄρει τούτῳ· ⸂Μετάβα ἔνθεν⸃ ἐκεῖ, καὶ μεταβήσεται, καὶ οὐδὲν ἀδυνατήσει ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/020.yaml
  text: But he says to them[a], “Because of your little faith. For truly I say to you, if you have faith like a mustard seed, you will say to this mountain, ‘Move from here to there,’ and it will move[c][b], and nothing will be impossible for you.”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറയുന്നു: “നിങ്ങളുടെ അല്പവിശ്വാസം നിമിത്തമാണ്.[a] സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: നിങ്ങൾക്കു കടുകുമണിപോലെയുള്ള വിശ്വാസമുണ്ടെങ്കിൽ,[b] ഈ മലയോട്, ‘ഇവിടെനിന്ന് അങ്ങോട്ടു മാറുക’ എന്നു നിങ്ങൾ പറയും; അതു മാറും. നിങ്ങൾക്കു ഒന്നും അസാധ്യമാകുകയില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നിങ്ങളുടെ വിശ്വാസക്കുറവ് നിമിത്തം” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദം പൂർണമായ അവിശ്വാസത്തെക്കാൾ കുറവുള്ളതോ അപര്യാപ്തമായതോ ആയ വിശ്വാസത്തെയാണ് കൂടുതൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥത്തിൽ: “കടുകുമണിയെപ്പോലെ വിശ്വാസം.” ഉപമ വളരെ ചെറിയ ഒന്നിലേക്കാണ് വിരൽചൂണ്ടുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: പറയുന്നു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനകാലം നിലനിർത്തി മത്തായിയുടെ ആഖ്യാനശൈലിയിലെ സജീവത സംരക്ഷിക്കുന്നു.
- source_word: Διὰ τὴν ὀλιγοπιστίαν ὑμῶν
  choice: നിങ്ങളുടെ അല്പവിശ്വാസം നിമിത്തമാണ്
  rationale: ὀλιγοπιστία പൂർണമായ അവിശ്വാസത്തെക്കാൾ കുറവുള്ളതോ അപര്യാപ്തമായതോ ആയ വിശ്വാസത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘അല്പവിശ്വാസം’ ആ വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: ἀμὴν
  choice: സത്യമായി
  rationale: ഗൗരവമുള്ള ഉറപ്പുവാക്കിന് തുടക്കമിടുന്ന പ്രയോഗത്തിന്റെ ഊന്നൽ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: πίστιν
  choice: വിശ്വാസം
  rationale: ഇവിടെ ദൈവത്തിന്റെ ശക്തിയിലുള്ള ആശ്രയവും ഉറപ്പുമാണ് സന്ദർഭാർഥം; ‘വിശ്വാസം’ അനാവശ്യമായ സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കാതെ പദത്തിന്റെ സാധാരണ അർഥം നൽകുന്നു.
- source_word: ὡς κόκκον σινάπεως
  choice: കടുകുമണിപോലെയുള്ള
  rationale: ഉപമ നിലനിർത്തുകയും വളരെ ചെറുതായ കടുകുമണിയിലേക്കുള്ള സൂചന സ്വാഭാവികമായി അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: Μετάβα ἔνθεν ἐκεῖ
  choice: ഇവിടെനിന്ന് അങ്ങോട്ടു മാറുക
  rationale: മലയോടുള്ള കല്പനയായതിനാൽ μεταβαίνω സൂചിപ്പിക്കുന്ന സ്ഥാനമാറ്റം ‘മാറുക’ എന്നതിലൂടെ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: μεταβήσεται
  choice: അതു മാറും
  rationale: ഭാവികാല മധ്യരൂപം ഇവിടെ അകർമകമായ സ്ഥാനമാറ്റത്തെ സൂചിപ്പിക്കുന്നു; മല തന്നെയാണ് മാറുന്നതെന്ന് പരിഭാഷ വ്യക്തമാക്കുന്നു.
- source_word: οὐδὲν ἀδυνατήσει ὑμῖν
  choice: ഒന്നും നിങ്ങൾക്ക് അസാധ്യമാകുകയില്ല
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ആശയം വ്യക്തമായ, പതിവായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: അത്ഭുതത്തിന്റെ സന്ദർഭത്തിലെ πίστις എന്ന പദത്തിന്റെ അർഥം
  choice: വിശ്വാസം
  alternative: ആശ്രയം; വിശ്വസ്തത
  rationale: സന്ദർഭം ശിഷ്യന്മാർക്ക് ദൈവശക്തിയിലുള്ള വിശ്വാസം അപര്യാപ്തമായിരുന്നതിനെക്കുറിച്ചാണ്. രക്ഷാകരവിശ്വാസത്തെക്കുറിച്ചോ മനുഷ്യന്റെ വിശ്വസ്തതയെക്കുറിച്ചോ ഉള്ള പ്രത്യേക സിദ്ധാന്തനിഗമനം വാക്യത്തിൽ ചേർക്കുന്നില്ല.
- issue: മല നീക്കുന്നതിനെ അക്ഷരാർഥത്തിലോ രൂപകാലങ്കാരമായോ പരിമിതപ്പെടുത്തൽ
  choice: മൂലപാഠത്തിലെ ശക്തമായ ദൃശ്യഭാഷ വിശദീകരണമില്ലാതെ നിലനിർത്തി
  alternative: ‘വലിയ തടസ്സങ്ങൾ നീക്കുക’ എന്ന വ്യാഖ്യാനപരമായ പരിഭാഷ
  rationale: യേശുവിന്റെ വാക്കുകൾ അസാധ്യമായി തോന്നുന്നതിനെ സൂചിപ്പിക്കുന്ന ശക്തമായ ദൃശ്യഭാഷ ഉപയോഗിക്കുന്നു. അതിന്റെ പ്രയോഗപരിധി പരിഭാഷയിൽ മുൻകൂട്ടി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ചരിത്രവർത്തമാനകാലമായ ‘പറയുന്നു’ നിലനിർത്തി; δέയെ സന്ദർഭമാറ്റം സൂചിപ്പിക്കുന്ന മൃദുവായ ‘എന്നാൽ’ എന്നു നൽകി. സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പദങ്ങൾ ഉപയോഗിച്ചെങ്കിലും മൂലത്തിലെ ഉപമയും വിശ്വാസത്തെക്കുറിച്ചുള്ള ഉദ്ദേശ്യപൂർവമായ സംഘർഷവും ലഘൂകരിച്ചിട്ടില്ല.
