source:
  edition: SBLGNT
  text: καὶ προσήνεγκα αὐτὸν τοῖς μαθηταῖς σου, καὶ οὐκ ἠδυνήθησαν αὐτὸν θεραπεῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/016.yaml
  text: And I brought him to your disciples[a], and they were not able to heal him.
translation:
  language: ml
  text: ഞാൻ അവനെ അങ്ങയുടെ ശിഷ്യന്മാരുടെ അടുക്കൽ കൊണ്ടുവന്നു; അവനെ സൗഖ്യമാക്കാൻ അവർക്കു കഴിഞ്ഞില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവനെ സൗഖ്യമാക്കാൻ അവർക്കായില്ല.’
    reason: οὐκ ἠδυνήθησαν എന്നതിന്റെ കൂടുതൽ ചുരുക്കമുള്ള സ്വാഭാവിക മലയാളരൂപം; അർഥത്തിൽ മാറ്റമില്ല.
lexical_decisions:
- source_word: προσήνεγκα
  choice: അടുക്കൽ കൊണ്ടുവന്നു
  rationale: προσφέρω എന്ന ക്രിയയുടെ ഈ സന്ദർഭത്തിലെ അർഥം ഒരാളെ മറ്റൊരാളുടെ അടുക്കൽ കൊണ്ടുവരിക എന്നതാണ്. ദത്തിവ് ഘടനയുടെ ബന്ധവും മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: μαθηταῖς σου
  choice: അങ്ങയുടെ ശിഷ്യന്മാർ
  rationale: സുവിശേഷസന്ദർഭത്തിൽ μαθητής ഒരു ഗുരുവിന്റെ പ്രതിബദ്ധരായ പഠിതാക്കളെയും അനുയായികളെയും സൂചിപ്പിക്കുന്നു; ‘ശിഷ്യന്മാർ’ എന്നത് വ്യക്തവും പതിവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: οὐκ ἠδυνήθησαν
  choice: അവർക്കു കഴിഞ്ഞില്ല
  rationale: δύναμαι കഴിവിനെയോ പ്രാപ്തിയെയോ സൂചിപ്പിക്കുന്നു. ‘കഴിഞ്ഞില്ല’ ആ ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: θεραπεῦσαι
  choice: സൗഖ്യമാക്കാൻ
  rationale: ഈ സന്ദർഭത്തിൽ θεραπεύω രോഗബാധിതനായ ബാലനെ സുഖപ്പെടുത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘സൗഖ്യമാക്കുക’ സുവിശേഷങ്ങളിലെ രോഗശാന്തിസന്ദർഭത്തിന് യോജിച്ച, മാന്യമായ പ്രയോഗമാണ്.
- source_word: καὶ ... καὶ
  choice: ഞാൻ ... കൊണ്ടുവന്നു; എന്നാൽ ... കഴിഞ്ഞില്ല
  rationale: ആദ്യ καί മുൻവാക്യത്തിന്റെ തുടർച്ചയാണ്; ഒറ്റവാക്യമായി ഉദ്ധരിക്കുമ്പോൾ മലയാളത്തിൽ അത് പ്രത്യേകം ‘കൂടാതെ’ എന്ന് നൽകാതിരിക്കുന്നതാണ് സ്വാഭാവികം. രണ്ടാമത്തെ καί സന്ദർഭത്തിൽ ഫലത്തിലെ വിരോധം സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ എന്ന ബന്ധകം മലയാളത്തിൽ പ്രവാഹം വ്യക്തമാക്കുന്നു; പരാജയത്തിന്റെ കാരണം ഇതിലൂടെ കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: αὐτόν
  choice: അവനെ
  rationale: സമീപസന്ദർഭത്തിലെ പീഡിതനായ മകനെയോ ബാലനെയോ സൂചിപ്പിക്കുന്ന പുരുഷലിംഗ ഏകവചന സർവനാമത്തിന്റെ നേരിട്ടുള്ള മലയാളരൂപമാണ്.
theological_decisions:
- issue: ശിഷ്യന്മാരുടെ പരാജയത്തിന്റെ സ്വഭാവം
  choice: അവർക്ക് ബാലനെ സൗഖ്യമാക്കാൻ കഴിഞ്ഞില്ല എന്നു മാത്രം പറയുന്നു.
  alternative: പിശാചിനെ പുറത്താക്കാൻ കഴിഞ്ഞില്ലെന്നോ അവിശ്വാസം മൂലമാണ് പരാജയപ്പെട്ടതെന്നോ ഈ വാക്യത്തിൽത്തന്നെ വ്യക്തമാക്കുക.
  rationale: ഈ വാക്യം പരാജയത്തിന്റെ കാരണം വിശദീകരിക്കാതെ സൗഖ്യമാക്കാനുള്ള അശക്തി മാത്രമാണ് പ്രസ്താവിക്കുന്നത്. ചുറ്റുപാടിലുള്ള വാക്യങ്ങളുടെ വിശദീകരണം ഇതിലേക്ക് ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. യേശുവിനോടുള്ള അഭിസംബോധനയിൽ ആദരസൂചകമായ ‘അങ്ങയുടെ’ ഉപയോഗിച്ചു. ഗ്രീക്കിലെ നേരിട്ടുള്ള പ്രസ്താവന നിലനിർത്തി; പരാജയത്തിന്റെ കാരണം വ്യാഖ്യാനമായി ചേർത്തിട്ടില്ല.
