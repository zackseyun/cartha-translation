id: MAT.17.2
reference: Matthew 17:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ μετεμορφώθη ἔμπροσθεν αὐτῶν, καὶ ἔλαμψεν τὸ πρόσωπον αὐτοῦ ὡς ὁ ἥλιος, τὰ δὲ ἱμάτια αὐτοῦ ⸀ἐγένετο λευκὰ ὡς τὸ φῶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/002.yaml
  text: And he was transfigured before them[a], and his face shone like the sun, and his clothes became white as the light.
translation:
  language: ml
  text: അവരുടെ മുമ്പാകെ അവൻ രൂപാന്തരപ്പെട്ടു[a]. അവന്റെ മുഖം സൂര്യനെപ്പോലെ തിളങ്ങി; അവന്റെ വസ്ത്രങ്ങൾ വെളിച്ചംപോലെ വെളുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “രൂപം മാറി.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μετεμορφώθη
  choice: രൂപം മാറി
  rationale: μεταμορφόομαι എന്ന ക്രിയയുടെ ഭൂതകാല കർമണി രൂപം ദൃശ്യമായ രൂപാന്തരത്തെ സൂചിപ്പിക്കുന്നു. സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഇത് വ്യക്തമായി അറിയിക്കുന്നു; കർമണിഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാകുന്ന വിധത്തിലാണ് രൂപപ്പെടുത്തിയത്.
- source_word: ἔμπροσθεν αὐτῶν
  choice: അവരുടെ മുമ്പിൽവെച്ച്
  rationale: സംഭവം അവരുടെ സാന്നിധ്യത്തിൽ, അവരുടെ കൺമുമ്പിൽ നടന്നുവെന്ന സ്ഥലപരവും സാക്ഷ്യപരവുമായ അർഥം നിലനിർത്തുന്നു.
- source_word: ἔλαμψεν
  choice: തിളങ്ങി
  rationale: λάμπω സൂചിപ്പിക്കുന്ന പ്രകാശിക്കൽ നേരിട്ടും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: τὸ πρόσωπον αὐτοῦ
  choice: അവന്റെ മുഖം
  rationale: ഇവിടെ πρόσωπον ശരീരത്തിലെ മുഖത്തെയാണ് സൂചിപ്പിക്കുന്നത്; സാധാരണ വായനക്കാർക്ക് ഏറ്റവും വ്യക്തമായ പദപ്രയോഗമാണിത്.
- source_word: ὡς ὁ ἥλιος
  choice: സൂര്യനെപ്പോലെ
  rationale: ὡς കൊണ്ടുള്ള ഉപമ കൃത്യവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: τὰ ἱμάτια αὐτοῦ
  choice: അവന്റെ വസ്ത്രങ്ങൾ
  rationale: ἱμάτια എന്ന പൊതുവായ വസ്ത്രസൂചനയ്ക്ക് മാന്യവും സാധാരണവുമായ മലയാളസമാനപദം.
- source_word: ἐγένετο λευκὰ
  choice: വെളുത്തതായി
  rationale: അവസ്ഥാമാറ്റം അറിയിക്കുന്ന ἐγένετοയും വെളുപ്പിനെ സൂചിപ്പിക്കുന്ന λευκάയും അധിക തീവ്രത ചേർക്കാതെ പ്രകടിപ്പിക്കുന്നു.
- source_word: ὡς τὸ φῶς
  choice: വെളിച്ചംപോലെ
  rationale: φῶς എന്ന നാമപദവും ὡς കൊണ്ടുള്ള ഉപമയും ‘പ്രകാശമുള്ള’ എന്ന വിശേഷണമായി ചുരുക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: രൂപാന്തരസംഭവത്തിന്റെ വിവർത്തനം
  choice: രൂപം മാറി
  alternative: രൂപാന്തരപ്പെട്ടു
  rationale: വാക്യം യേശുവിൽ ദൃശ്യമായുണ്ടായ മാറ്റത്തെ വിവരിക്കുന്നു. ‘രൂപം മാറി’ മൂലപദത്തിന്റെ വിശാലമായ അർഥം വ്യക്തമായി നൽകുന്നു; സംഭവത്തിന്റെ സ്വഭാവത്തെക്കുറിച്ച് പാഠം പറയുന്നതിലധികം സിദ്ധാന്തപരമായ വിശദീകരണം ചേർക്കുന്നില്ല. പരമ്പരാഗത സാങ്കേതികപദം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ രണ്ടു καί ഘടകങ്ങളെ മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിനായി പൂർണ്ണവിരാമവും അർധവിരാമവും ഉപയോഗിച്ച് ബന്ധിപ്പിച്ചു; ഉപമകളും ദൃശ്യവിവരണവും നിലനിർത്തി.
