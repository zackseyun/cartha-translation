id: MAT.17.27
reference: Matthew 17:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἵνα δὲ μὴ σκανδαλίσωμεν αὐτούς, πορευθεὶς ⸀εἰς θάλασσαν βάλε ἄγκιστρον καὶ τὸν ⸀ἀναβάντα πρῶτον ἰχθὺν ἆρον, καὶ ἀνοίξας τὸ στόμα αὐτοῦ εὑρήσεις στατῆρα· ἐκεῖνον λαβὼν δὸς αὐτοῖς ἀντὶ ἐμοῦ καὶ σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/027.yaml
  text: But so that we may not offend them[a], go to the sea, cast in a hook, and take the first fish that comes up. And when you open its mouth, you will find a stater[b]. Take that and give it to them for me and for yourself.
translation:
  language: ml
  text: എന്നാൽ നാം അവർക്കു അപ്രീതിയുണ്ടാക്കാതിരിക്കേണ്ടതിന്[a], കടലിലേക്കു പോയി ചൂണ്ടയിടുക. ആദ്യം കയറിവരുന്ന മീനിനെ എടുക്കുക. അതിന്റെ വായ് തുറന്നാൽ ഒരു സ്റ്റാറ്റേർ നാണയം[b] കാണും. അത് എടുത്ത് എനിക്കും നിനക്കും വേണ്ടി അവർക്കു കൊടുക്കുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നാം അവർക്കു ഇടർച്ചയുണ്ടാക്കാതിരിക്കേണ്ടതിന്” / “അവർക്കു എതിർപ്പുണ്ടാക്കാതിരിക്കേണ്ടതിന്.”'
    reason: lexical_alternative
  - marker: b
    text: ഒരു സ്റ്റാറ്റേർ ഏകദേശം നാല് ദ്രഹ്മകൾ മൂല്യമുള്ള നാണയമായിരുന്നു; രണ്ടുപേരുടെ ദേവാലയനികുതി അടയ്ക്കാൻ അത് മതിയായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: σκανδαλίσωμεν
  choice: ഇടർച്ചയുണ്ടാക്കുക
  rationale: പദത്തിന്റെ രൂപകാർഥവും ഇവിടെ ഉദ്ദേശിക്കുന്ന അനാവശ്യമായ എതിർപ്പിനോ അപ്രീതിക്കോ കാരണമാകുക എന്ന പ്രായോഗിക അർഥവും നിലനിർത്തുന്നു; മറ്റൊരു സ്വാഭാവിക വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: θάλασσαν
  choice: കടൽ
  rationale: ഗ്രീക്കിലെ പൊതുപദം നേരിട്ട് നിലനിർത്തുന്നു; ഇവിടെ ഗലീലക്കടലാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἄγκιστρον
  choice: ചൂണ്ട
  rationale: മീൻപിടിത്തസന്ദർഭത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ ആധുനിക മലയാളപദം.
- source_word: ἀναβάντα πρῶτον ἰχθὺν
  choice: ആദ്യം കയറിവരുന്ന മീൻ
  rationale: വെള്ളത്തിൽനിന്ന് ചൂണ്ടയിൽ ആദ്യം മുകളിലേക്കു വരുന്ന മീനെന്ന ക്രമവും ചലനവും സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: ἆρον
  choice: എടുക്കുക
  rationale: പിടിക്കപ്പെട്ട മീനിനെ എടുത്തുകൊള്ളുക എന്ന സന്ദർഭാർഥം ചുരുക്കത്തിലും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: στατῆρα
  choice: ഒരു സ്റ്റാത്തേർ നാണയം
  rationale: ഗ്രീക്കിൽ പേരെടുത്തുപറയുന്ന പ്രത്യേക നാണയം ലിപ്യന്തരണം ചെയ്ത് നിലനിർത്തുകയും വായനക്കാരന് അത് നാണയമാണെന്ന് മുഖ്യവാക്യത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു; മൂല്യം അടിക്കുറിപ്പിൽ വിശദീകരിക്കുന്നു.
- source_word: ἀντὶ ἐμοῦ καὶ σοῦ
  choice: എനിക്കും നിനക്കും വേണ്ടി
  rationale: ഇരുവരുടെയും നികുതി അടയ്ക്കുന്നതിനായി എന്ന പ്രതിനിധി/പകരംനിൽപ്പ് അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: πορευθεὶς
  choice: പോയി
  rationale: തുടർന്നുള്ള ആജ്ഞകൾക്കുമുമ്പുള്ള അനുബന്ധപ്രവർത്തിയായി കൃത്യവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: δὸς αὐτοῖς
  choice: അവർക്കു കൊടുക്കുക
  rationale: മുൻപ് പറഞ്ഞ നാണയമാണ് കർമമെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നു; നികുതിപണം നൽകുന്നതെന്ന അർഥവും നിലനിൽക്കുന്നു.
theological_decisions:
- issue: ദേവാലയനികുതി നൽകുന്നതുമായി ബന്ധപ്പെട്ട σκανδαλίζω എന്ന പദത്തിന്റെ അർഥം
  choice: മുൻവാക്യങ്ങളിൽ പുത്രന്മാർ സ്വതന്ത്രരാണെന്ന ആശയം പിൻവലിക്കാതെ, പിരിവുകാരുടെ ഇടർച്ചയ്ക്കോ എതിർപ്പിനോ അനാവശ്യമായി കാരണമാകാതിരിക്കാൻ നികുതി നൽകുന്നു.
  alternative: യേശു നികുതി നൽകാൻ പൂർണമായി ബാധ്യസ്ഥനാണെന്നോ, ധാർമിക പ്രസക്തിയില്ലാത്ത ഒരു അത്ഭുതപ്രകടനം മാത്രമാണിതെന്നോ വായിക്കുക.
  rationale: 17:24–26-ലെ പുത്രന്മാരുടെ സ്വാതന്ത്ര്യവും 17:27-ലെ പ്രായോഗിക വഴങ്ങലും തമ്മിലുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിച്ചുകളയാതെ വാക്യം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ആജ്ഞകളുടെ ക്രമം ചുരുക്കവും വ്യക്തവുമാക്കി. നൽകിയ ഇംഗ്ലീഷ് കരടിൽ അടിക്കുറിപ്പുകളുടെ ഉള്ളടക്കവും മാർക്കറുകളും തമ്മിൽ മറിച്ചിടപ്പെട്ടിരുന്നതായി തോന്നുന്നതിനാൽ, മുഖ്യവാക്യത്തിലെ യഥാർത്ഥ സ്ഥാനങ്ങളനുസരിച്ച് [a] σκανδαλίσωμεν-ന്റെ പദവികൽപത്തിനും [b] സ്റ്റാത്തേറിന്റെ സാംസ്കാരിക വിശദീകരണത്തിനും ചേർത്തു.
