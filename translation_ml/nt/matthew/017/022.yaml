id: MAT.17.22
reference: Matthew 17:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀Συστρεφομένων δὲ αὐτῶν ἐν τῇ Γαλιλαίᾳ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μέλλει ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοσθαι εἰς χεῖρας ἀνθρώπων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/022.yaml
  text: While they were gathering together in Galilee[a], Jesus said to them[c][b], “The Son of Man is about to be delivered into the hands of men,”
translation:
  language: ml
  text: 'അവർ ഗലീലയിൽ ഒരുമിച്ചുകൂടിക്കൊണ്ടിരിക്കുമ്പോൾ[a], യേശു അവരോടു പറഞ്ഞു: “മനുഷ്യപുത്രൻ മനുഷ്യരുടെ[c] കൈകളിൽ ഏൽപ്പിക്കപ്പെടാനിരിക്കുന്നു[b],”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരുമിച്ചിരിക്കുമ്പോൾ” അല്ലെങ്കിൽ “ഒത്തുകൂടിക്കൊണ്ടിരിക്കുമ്പോൾ.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “കൈമാറിക്കൊടുക്കപ്പെടാനിരിക്കുന്നു.”
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “ആളുകളുടെ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Συστρεφομένων
  choice: ഒരുമിച്ചുകൂടിക്കൊണ്ടിരിക്കുമ്പോൾ
  rationale: സυστρέφω എന്ന ക്രിയയുടെ കൂട്ടമായി ചേരുക/ഒന്നിച്ചിരിക്കുക എന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; സഞ്ചാരമോ താമസമോ അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്താതെ ‘-ക്കൊണ്ടിരിക്കുമ്പോൾ’ എന്ന ഘടനയിൽ ഉൾപ്പെടുത്തി
  rationale: δέ ഇവിടെ സാഹചര്യത്തെ യേശുവിന്റെ വാക്കുകളുമായി ബന്ധിപ്പിക്കുന്നു; മലയാളത്തിലെ കാലസംബന്ധിയായ ഉപവാക്യം ഈ ബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: ഗലീലയിൽ
  rationale: സ്ഥലസൂചക പ്രയോഗത്തിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: εἶπεν αὐτοῖς
  choice: യേശു അവരോടു പറഞ്ഞു
  rationale: λέγω + പരോക്ഷ കർമത്തിന്റെ അർഥവും വാക്യക്രമവും വ്യക്തമായി നൽകുന്നു.
- source_word: Μέλλει
  choice: -പ്പെടാനിരിക്കുന്നു
  rationale: സംഭവിക്കാൻ പോകുന്ന, അടുത്തുവരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന μέλλωയുടെ ഭാവം വിധിനിശ്ചയം അധികമായി ചേർക്കാതെ നൽകുന്നു.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: സുവിശേഷങ്ങളിലെ യേശുവിന്റെ വിശേഷണത്തിന്റെ പരമ്പരാഗതവും രൂപപരമായി സുതാര്യവുമായ പരിഭാഷ; അതിന്റെ തിരുവെഴുത്തുസംബന്ധവും ദൈവശാസ്ത്രപരവുമായ പ്രതിധ്വനി നിലനിർത്തുന്നു.
- source_word: παραδίδοσθαι
  choice: ഏൽപ്പിക്കപ്പെടാൻ
  rationale: നിഷ്ക്രിയരൂപം നിലനിർത്തുകയും ‘വഞ്ചിക്കപ്പെടുക’ എന്ന് മാത്രം ചുരുക്കാതെ കൈമാറ്റം/ഒപ്പിച്ചുകൊടുക്കൽ എന്ന വിശാലമായ അർഥം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: εἰς χεῖρας ἀνθρώπων
  choice: മനുഷ്യരുടെ കൈകളിൽ
  rationale: ‘കൈകളിൽ’ എന്ന മൂലരൂപകം നിലനിർത്തുന്നു; മനുഷ്യപുത്രൻ—മനുഷ്യർ എന്ന വാചകബന്ധവും മലയാളത്തിൽ ദൃശ്യമാക്കുന്നു.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου എന്ന വിശേഷണത്തിന്റെ പരിഭാഷ
  choice: മനുഷ്യപുത്രൻ
  alternative: മനുഷ്യനായവൻ
  rationale: സ്ഥിരമായ സുവിശേഷപ്രയോഗവും ദാനീയേൽ ഗ്രന്ഥവുമായി ബന്ധപ്പെട്ട പ്രതിധ്വനിയും നിലനിർത്താൻ അക്ഷരാർഥത്തോട് ചേർന്ന പരമ്പരാഗത രൂപം സ്വീകരിച്ചു.
- issue: παραδίδοσθαι എന്ന പീഡാനുഭവപ്രവചന പദത്തിന്റെ വ്യാപ്തി
  choice: ഏൽപ്പിക്കപ്പെടാൻ
  alternative: കൈമാറിക്കൊടുക്കപ്പെടാൻ; വഞ്ചിച്ചുകൊടുക്കപ്പെടാൻ
  rationale: മനുഷ്യരുടെ പ്രവർത്തനവും വ്യക്തമാക്കപ്പെടാത്ത വിശാലമായ ഏജൻസിയും ഉൾക്കൊള്ളാൻ കഴിയുന്ന നിഷ്ക്രിയപ്രയോഗം നിലനിർത്തുന്നു; യൂദാസിന്റെ വഞ്ചനയിലേക്കു മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- issue: ἀνθρώπων എന്ന ബഹുവചനത്തിന്റെ അവതരണം
  choice: മനുഷ്യരുടെ
  alternative: ആളുകളുടെ; പുരുഷന്മാരുടെ
  rationale: ഇവിടെ പദം മനുഷ്യരായ പ്രവർത്തകരെ പൊതുവായി സൂചിപ്പിക്കുന്നു. ‘മനുഷ്യപുത്രൻ’ എന്നതോടുള്ള വാചകപരമായ വൈരുധ്യവും ‘മനുഷ്യരുടെ’ എന്ന രൂപം കാത്തുസൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മനുഷ്യപുത്രൻ’, ‘മനുഷ്യരുടെ കൈകളിൽ’ എന്നീ രൂപങ്ങൾ മൂലത്തിലെ പദബന്ധവും രൂപകവും നിലനിർത്തുന്നു. വാക്യം അടുത്ത വാക്യത്തിൽ തുടരുന്നതിനാൽ അവസാനത്തെ കോമ സംരക്ഷിച്ചു.
