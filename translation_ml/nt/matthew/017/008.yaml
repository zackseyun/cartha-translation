revisions:
- from: അവർ കണ്ണുകളുയർത്തി നോക്കിയപ്പോൾ, യേശുവിനെ മാത്രം അല്ലാതെ മറ്റാരെയും കണ്ടില്ല.[a]
  to: അവർ കണ്ണുകളുയർത്തിയപ്പോൾ, യേശുവിനെത്തന്നെ മാത്രമല്ലാതെ മറ്റാരെയും കണ്ടില്ല.[a]
  rationale: The revision preserves the Greek narrative sequence and the strong exclusive sense while using a clear, idiomatic Malayalam negative-exception construction. It represents αὐτόν with ‘തന്നെ’ and μόνον with ‘മാത്രം,’ without drawing conclusions beyond the scene described.
  reviewer_model: gpt-5.6-terra
