id: MAT.17.8
reference: Matthew 17:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐπάραντες δὲ τοὺς ὀφθαλμοὺς αὐτῶν οὐδένα εἶδον εἰ μὴ ⸀αὐτὸν Ἰησοῦν μόνον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/008.yaml
  text: And lifting up their eyes[a], they saw no one except Jesus alone.
translation:
  language: ml
  text: അവർ കണ്ണുകളുയർത്തിയപ്പോൾ, യേശുവിനെത്തന്നെ മാത്രമല്ലാതെ മറ്റാരെയും കണ്ടില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ‘അവനെത്തന്നെ’ എന്ന ഊന്നൽസർവനാമവും ‘മാത്രം’ എന്ന പദവും ചേർന്ന്, യേശുവിനെ മാത്രമാണ് അവർ കണ്ടത് എന്നത് ശക്തമായി ഊന്നുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπάραντες
  choice: കണ്ണുകളുയർത്തി നോക്കിയപ്പോൾ
  rationale: അയോറിസ്റ്റ് കൃദന്തരൂപം മുഖ്യക്രിയയ്ക്കു മുമ്പുള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘നോക്കിയപ്പോൾ’ ചേർക്കുന്നത് കണ്ണുയർത്തുക എന്ന ദേഹചലനവും തുടർന്നുള്ള കാഴ്ചയും സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: ഇവിടെ δέ മൃദുവായ ആഖ്യാനബന്ധകമാണ്; മലയാളത്തിലെ വാക്യക്രമവും സന്ദർഭവും ആ ബന്ധം സ്വാഭാവികമായി നൽകുന്നതിനാൽ ‘എന്നാൽ’ എന്ന ശക്തമായ വിരുദ്ധഭാവം ഒഴിവാക്കി.
- source_word: τοὺς ὀφθαλμοὺς αὐτῶν
  choice: അവർ കണ്ണുകൾ
  rationale: ഗ്രീക്കിലെ മൂർത്തമായ ദേഹപ്രയോഗം നിലനിർത്തുന്നു; ‘ദൃഷ്ടി’ എന്ന അമൂർത്ത പദത്തിലേക്കു മാറ്റുന്നില്ല.
- source_word: οὐδένα
  choice: മറ്റാരെയും
  rationale: നിഷേധവാക്യത്തിൽ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന οὐδένα എന്നതിന്റെ സ്വാഭാവിക മലയാളരൂപം; ഒഴിവാക്കൽപ്രയോഗത്തോടൊപ്പം ‘മറ്റാരെയും’ വ്യക്തത നൽകുന്നു.
- source_word: εἶδον
  choice: കണ്ടില്ല
  rationale: ὁράω എന്ന ക്രിയയുടെ ലളിതമായ ഭൂതകാല അർഥം നിഷേധത്തോടുകൂടെ നേരിട്ട് നൽകുന്നു.
- source_word: εἰ μὴ
  choice: അല്ലാതെ
  rationale: നിഷേധത്തിനു ശേഷമുള്ള ഒഴിവാക്കൽ അർഥം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: αὐτὸν Ἰησοῦν μόνον
  choice: യേശുവിനെ മാത്രം
  rationale: αὐτόν ഉം μόνον ഉം ചേർന്നുള്ള ശക്തമായ ഏകാന്തതാ ഊന്നൽ മലയാളത്തിലെ സ്വാഭാവികമായ ‘യേശുവിനെ മാത്രം’ എന്ന രൂപത്തിൽ നൽകുന്നു; അസ്വാഭാവികമായ ഇരട്ട ഊന്നൽ മുഖ്യവാചകത്തിൽ നിർബന്ധിക്കുന്നില്ല.
theological_decisions:
- issue: ദർശനത്തിനു ശേഷം കാണപ്പെട്ട ഏക വ്യക്തിയായി യേശുവിനുള്ള ഊന്നൽ
  choice: ‘യേശുവിനെ മാത്രം അല്ലാതെ മറ്റാരെയും കണ്ടില്ല’ എന്നു നൽകി ഏകാന്തതയുടെ ഊന്നൽ നിലനിർത്തി
  alternative: ‘യേശുവിനെ തന്നെയല്ലാതെ മറ്റാരെയും കണ്ടില്ല’ അല്ലെങ്കിൽ ‘യേശുവിനെ മാത്രം കണ്ടു’
  rationale: εἰ μὴ + αὐτόν + μόνον എന്ന കൂട്ടം മോശെയും ഏലിയാവും ഇനി ദൃശ്യമല്ലെന്നും യേശു മാത്രമാണ് ശേഷിച്ചതെന്നും ശക്തമായി പറയുന്നു. അതിനപ്പുറമുള്ള സിദ്ധാന്തപരമായ നിഗമനം വാക്യത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ കൃദന്തരൂപം സ്വാഭാവികമായ കാലവാക്യമായി നൽകി; ഏകാന്തതയുടെ ഇരട്ട ഊന്നൽ മുഖ്യവാചകത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
