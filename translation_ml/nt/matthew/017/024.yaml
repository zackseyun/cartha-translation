id: MAT.17.24
reference: Matthew 17:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐλθόντων δὲ αὐτῶν εἰς Καφαρναοὺμ προσῆλθον οἱ τὰ δίδραχμα λαμβάνοντες τῷ Πέτρῳ καὶ εἶπαν· Ὁ διδάσκαλος ὑμῶν οὐ τελεῖ τὰ δίδραχμα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/024.yaml
  text: When they came to Capernaum[a], those who collected the two-drachma tax came to Peter and said[b], “Does your teacher not pay the two-drachma tax?”
translation:
  language: ml
  text: 'അവർ കഫർന്നഹൂമിൽ എത്തിയപ്പോൾ, രണ്ടു ദ്രഹ്മ നികുതി പിരിക്കുന്നവർ പത്രോസിന്റെ അടുക്കൽ വന്ന് ചോദിച്ചു: “നിങ്ങളുടെ ഗുരു രണ്ടു ദ്രഹ്മ നികുതി അടയ്ക്കുന്നില്ലേ?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘രണ്ടു ദ്രഹ്മ’ എന്നു പറയുന്നത് സാധാരണയായി ക്ഷേത്രത്തിനായി അടച്ചിരുന്ന രണ്ടു ദ്രഹ്മ നികുതിയെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐλθόντων δὲ αὐτῶν
  choice: അവർ ... എത്തിയപ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് സൂചിപ്പിക്കുന്ന കാലസാഹചര്യം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; δέ ഇവിടെ പ്രത്യേക സംയോജകപദമില്ലാതെ വാക്യപരിവർത്തനത്തിൽ പ്രതിഫലിക്കുന്നു.
- source_word: Καφαρναοὺμ
  choice: കഫർന്നഹൂം
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ സ്ഥലനാമരൂപം സ്വീകരിച്ചു.
- source_word: οἱ τὰ δίδραχμα λαμβάνοντες
  choice: രണ്ടു ദ്രഹ്മ നികുതി പിരിക്കുന്നവർ
  rationale: പങ്കാളിത്തപ്രയോഗം ആ കൂട്ടത്തെ അവരുടെ പ്രവർത്തനത്താൽ തിരിച്ചറിയിക്കുന്നു. λαμβάνοντες എന്നത് ഈ സന്ദർഭത്തിൽ നികുതി പിരിക്കലാണ്.
- source_word: τῷ Πέτρῳ
  choice: പത്രോസിന്റെ അടുക്കൽ
  rationale: προσῆλθον സഹിതമുള്ള ദാതൃരൂപത്തിന്റെ ഗതിസൂചന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: Ὁ διδάσκαλος ὑμῶν
  choice: നിങ്ങളുടെ ഗുരു
  rationale: διδάσκαλος എന്നതിന് ആദരസൂചകവും സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവുമായ സമാനപദം.
- source_word: οὐ τελεῖ
  choice: അടയ്ക്കുന്നില്ലേ?
  rationale: നികുതി സംബന്ധിച്ച τελέω എന്ന ക്രിയയുടെ ‘അടയ്ക്കുക’ എന്ന അർഥവും, അനുകൂല മറുപടി പ്രതീക്ഷിക്കാവുന്ന നിഷേധചോദ്യത്തിന്റെ രൂപവും നിലനിർത്തുന്നു.
- source_word: δίδραχμα
  choice: രണ്ടു ദ്രഹ്മ നികുതി
  rationale: തുകയുടെ അളവും സന്ദർഭത്തിലെ നികുതിസ്വഭാവവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു; സാങ്കേതിക ലിപ്യന്തരണം മാത്രം ഉപയോഗിക്കുന്നതിനെക്കാൾ ഗ്രഹിക്കാൻ എളുപ്പമാണ്.
theological_decisions:
- issue: δίδραχμα എന്നത് നാണയങ്ങളോ നികുതിയോ എന്ന തിരിച്ചറിയൽ
  choice: മുഖ്യവാചകത്തിൽ ‘രണ്ടു ദ്രഹ്മ നികുതി’
  alternative: ‘രണ്ടു ദ്രഹ്മകൾ’ അഥവാ ‘ദിദ്രഹ്മ നികുതി’
  rationale: സന്ദർഭം നാണയങ്ങൾ കൈകാര്യം ചെയ്യുന്നതിനെക്കുറിച്ചല്ല, നിർബന്ധിതമായ ഒരു തുക അടയ്ക്കുന്നതിനെക്കുറിച്ചാണ്. ‘നികുതി’ എന്നത് സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു; ക്ഷേത്രനികുതി എന്ന ചരിത്രപരമായ തിരിച്ചറിയൽ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ നിഷേധചോദ്യരൂപം ‘അടയ്ക്കുന്നില്ലേ?’ എന്നു നിലനിർത്തി. സാംസ്കാരിക വിശദീകരണം മുഖ്യവാചകത്തിൽ ചേർക്കാതെ അടിക്കുറിപ്പിൽ നൽകി.
