id: MAT.17.19
reference: Matthew 17:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τότε προσελθόντες οἱ μαθηταὶ τῷ Ἰησοῦ κατ’ ἰδίαν εἶπον· Διὰ τί ἡμεῖς οὐκ ἠδυνήθημεν ἐκβαλεῖν αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/019.yaml
  text: Then the disciples came to Jesus privately and said[a], “Why were we not able to cast it out?”
translation:
  language: ml
  text: 'അപ്പോൾ ശിഷ്യന്മാർ യേശുവിന്റെ അടുക്കൽ സ്വകാര്യമായി വന്ന് പറഞ്ഞു: “എന്തുകൊണ്ടാണ് ഞങ്ങൾക്ക് അതിനെ[a] പുറത്താക്കാൻ കഴിയാതിരുന്നത്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “അവനെ,” ഈ സർവനാമം ബാലനെ സൂചിപ്പിക്കുന്നതായി എടുക്കുന്നുവെങ്കിൽ.
    reason: alternative_reading
lexical_decisions:
- source_word: Τότε
  choice: അപ്പോൾ
  rationale: തുടർന്നുണ്ടായ സംഭവത്തെ പരിചയപ്പെടുത്തുന്ന സ്വാഭാവികമായ കാലസൂചകപ്രയോഗം.
- source_word: προσελθόντες
  choice: അടുക്കൽ ... വന്ന്
  rationale: προσέρχομαι എന്നതിന്റെ സമീപിക്കുക/അടുക്കൽ വരുക എന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: οἱ μαθηταὶ
  choice: ശിഷ്യന്മാർ
  rationale: സുവിശേഷസന്ദർഭത്തിൽ യേശുവിന്റെ μαθηταί എന്നതിന് പതിവും വ്യക്തവുമായ മലയാളപദം.
- source_word: τῷ Ἰησοῦ
  choice: യേശുവിന്റെ അടുക്കൽ
  rationale: προσέρχομαι-യോടൊപ്പമുള്ള ദത്തിവിന്റെ ദിശാസംബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: κατ’ ἰδίαν
  choice: സ്വകാര്യമായി
  rationale: മറ്റുള്ളവരിൽനിന്ന് വേറിട്ട്, സ്വകാര്യമായി എന്ന ആശയം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: εἶπον
  choice: ചോദിച്ചു
  rationale: മൂലക്രിയയുടെ അടിസ്ഥാനാർഥം ‘പറഞ്ഞു’ എന്നാണെങ്കിലും പിന്നാലെയുള്ള ഉള്ളടക്കം നേരിട്ടുള്ള ചോദ്യമായതിനാൽ ആ സംസാരപ്രവൃത്തിയെ സ്വാഭാവിക മലയാളത്തിൽ ‘ചോദിച്ചു’ എന്നു നൽകുന്നു.
- source_word: Διὰ τί
  choice: എന്തുകൊണ്ടാണ്
  rationale: കാരണത്തെ അന്വേഷിക്കുന്ന ചോദ്യത്തിന് സാധാരണ ആധുനിക മലയാളപ്രയോഗം.
- source_word: ἡμεῖς
  choice: ഞങ്ങൾക്ക്
  rationale: വ്യക്തമായ ഒന്നാംപുരുഷ ബഹുവചന സർവനാമം നിലനിർത്തുന്നു; മലയാളത്തിലെ ശേഷിസംരചനയ്ക്ക് ദത്തിവുരൂപം സ്വാഭാവികമാണ്.
- source_word: οὐκ ἠδυνήθημεν
  choice: കഴിയാതിരുന്നത്
  rationale: കഴിഞ്ഞ സംഭവത്തിലെ അശക്തിയെ മലയാളത്തിൽ വ്യക്തമായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐκβαλεῖν
  choice: പുറത്താക്കാൻ
  rationale: ഭൂതത്തെ ബലമായി നീക്കുക എന്ന സുവിശേഷസന്ദർഭത്തിലെ അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: αὐτό
  choice: അതിനെ
  rationale: നപുംസകലിംഗ ഏകവചന സർവനാമം സാധ്യതയേറിയ ഭൂതസൂചനയായി നിലനിർത്തുന്നു; ബാലനെ സൂചിപ്പിക്കുന്ന മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
theological_decisions:
- issue: ഭൂതോച്ചാടനസന്ദർഭത്തിൽ αὐτό ആരെ/എന്തിനെ സൂചിപ്പിക്കുന്നു
  choice: ഭൂതത്തെ സൂചിപ്പിക്കുന്നതായി എടുത്ത് ‘അതിനെ’ എന്നു വിവർത്തനം ചെയ്തു.
  alternative: ബാലനെ സൂചിപ്പിക്കുന്നതായി എടുത്ത് ‘അവനെ’ എന്നു വിവർത്തനം ചെയ്യാം.
  rationale: സമീപസന്ദർഭത്തിൽ ശിഷ്യന്മാരുടെ പരാജയം ഭൂതത്തെ പുറത്താക്കുന്നതിലാണ്; കൂടാതെ ἐκβάλλω ഭൂതോച്ചാടനവിവരണങ്ങളിൽ സാധാരണയായി ഭൂതത്തെ കർമമായി സ്വീകരിക്കുന്നു. എന്നാൽ ഗ്രീക്ക് സർവനാമത്തിന്റെ സാധ്യതയുള്ള മറ്റൊരു സൂചന അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. വാക്യക്രമം വായനാസൗകര്യത്തിന് മലയാളരീതിയിലാക്കി; മൂലത്തിലെ സ്വകാര്യസന്ദർഭവും ശിഷ്യന്മാരുടെ അശക്തിയും സർവനാമത്തിലെ യഥാർഥ സന്ദിഗ്ധതയും സംരക്ഷിച്ചു.
