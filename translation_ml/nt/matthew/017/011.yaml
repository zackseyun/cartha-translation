id: MAT.17.11
reference: Matthew 17:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ ἀποκριθεὶς ⸀εἶπεν· Ἠλίας μὲν ⸀ἔρχεται καὶ ἀποκαταστήσει πάντα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/011.yaml
  text: He answered[a], “Elijah indeed is coming and will restore all things.”
translation:
  language: ml
  text: 'അവൻ മറുപടി പറഞ്ഞു: “ഏലിയാവ് തീർച്ചയായും വരുന്നു[a]; അവൻ സകലവും പുനഃസ്ഥാപിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വരുകയും സകലവും പുനഃസ്ഥാപിക്കുകയും ചെയ്യും.” ഗ്രീക്കിലെ “വരുന്നു” എന്ന വർത്തമാനകാല ക്രിയയ്ക്ക് ഇവിടെ ഭാവിമുഖമായ അർഥമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: മറുപടി പറഞ്ഞു
  rationale: പങ്കാളിക്രിയയും സമാപകക്രിയയും ചേർന്ന ഈ സെമിറ്റിക് സ്വാധീനമുള്ള ഗ്രീക്ക് പ്രയോഗത്തിന്റെ പ്രതികരണാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ അനാവശ്യ ആവർത്തനമില്ലാതെ നൽകുന്നു.
- source_word: Ἠλίας
  choice: ഏലിയാവ്
  rationale: മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ സുപരിചിതമായ വ്യക്തിനാമരൂപം ഉപയോഗിക്കുന്നു.
- source_word: μέν
  choice: തീർച്ചയായും
  rationale: അടുത്ത വാക്യത്തിൽ വരാനിരിക്കുന്ന വൈരുധ്യത്തിലേക്കുള്ള മുന്നൊരുക്കവും ഇവിടെയുള്ള ഊന്നലും സൂചിപ്പിക്കുന്നു; ‘ഒരു വശത്ത്’ എന്ന അക്ഷരാർഥപ്രയോഗത്തേക്കാൾ സ്വാഭാവികമാണ്.
- source_word: ἔρχεται
  choice: വരുന്നു
  rationale: വർത്തമാനകാല രൂപത്തിന്റെ സജീവത നിലനിർത്തുകയും സന്ദർഭത്തിലെ ഭാവിമുഖമായ അർഥം അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ἀποκαταστήσει
  choice: പുനഃസ്ഥാപിക്കും
  rationale: ഭാവികാല പ്രവർത്തനവും മുമ്പുണ്ടായിരുന്ന നിലയിലേക്കു കൊണ്ടുവരുക എന്ന പുനഃസ്ഥാപനാർഥവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: πάντα
  choice: സകലവും
  rationale: നപുംസകലിംഗ ബഹുവചനത്തിന്റെ വിശാലവും സമഗ്രവുമായ വ്യാപ്തി, വ്യക്തമാക്കാത്ത കർമവിഷയം കൂട്ടിച്ചേർക്കാതെ, സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ഏലിയാവിന്റെ പുനഃസ്ഥാപനപ്രവർത്തനത്തിന്റെ സ്വഭാവവും വ്യാപ്തിയും
  choice: “സകലവും പുനഃസ്ഥാപിക്കും” എന്നു വിശാലമായിത്തന്നെ നിലനിർത്തുക
  alternative: “എല്ലാം ശരിയാക്കും” അല്ലെങ്കിൽ ആത്മീയ നവീകരണം/അന്ത്യകാല ക്രമീകരണം എന്നിങ്ങനെ പ്രത്യേകമായി വ്യാഖ്യാനിക്കുക
  rationale: ഈ വാക്യം പുനഃസ്ഥാപനത്തിന്റെ കൃത്യമായ സ്വഭാവമോ പരിധിയോ നിർവചിക്കുന്നില്ല. അതിനാൽ അതിനെ ഒരു പ്രത്യേക ദൈവശാസ്ത്ര പദ്ധതിയിലേക്ക് ചുരുക്കാതെ മൂലപാഠത്തിലെ വിശാലതയും പിരിമുറുക്കവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പുനഃസ്ഥാപിക്കും’ എന്ന പദം പ്രവചനാത്മക ഗൗരവവും മൂലപാഠത്തിന്റെ വിശാലതയും നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് വർത്തമാനകാല രൂപത്തിലെ ഭാവിമുഖത വ്യക്തമാക്കുന്നു.
