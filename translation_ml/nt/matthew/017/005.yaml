id: MAT.17.5
reference: Matthew 17:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔτι αὐτοῦ λαλοῦντος ἰδοὺ νεφέλη φωτεινὴ ἐπεσκίασεν αὐτούς, καὶ ἰδοὺ φωνὴ ἐκ τῆς νεφέλης λέγουσα· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ἐν ᾧ εὐδόκησα· ⸂ἀκούετε αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/005.yaml
  text: While he was still speaking[a], behold, a bright cloud overshadowed them, and behold, a voice from the cloud said, “This is my beloved Son, with whom I am well pleased[c][b]; listen to him.”
translation:
  language: ml
  text: 'അവൻ ഇനിയും സംസാരിച്ചുകൊണ്ടിരിക്കുമ്പോൾ, ഇതാ, പ്രകാശമുള്ള ഒരു മേഘം അവരുടെമേൽ നിഴലിട്ടു[c]; ഇതാ, മേഘത്തിൽനിന്ന് ഒരു ശബ്ദം പറഞ്ഞു: “ഇവൻ എന്റെ പ്രിയ പുത്രൻ; ഇവനിൽ ഞാൻ പ്രസാദിച്ചിരിക്കുന്നു. ഇവനെ കേൾക്കുവിൻ.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇവന്റെ വാക്കു കേൾക്കുവിൻ.” ഗ്രീക്ക് ആജ്ഞയ്ക്ക് കേൾക്കുക എന്നതിനൊപ്പം ചെവിക്കൊള്ളുക, അനുസരിക്കുക എന്ന ഭാവവും ഉണ്ടാകാം.
    reason: lexical_alternative
  - marker: b
    text: “ഇതാ” എന്നത് ഗ്രീക്കിലെ ἰδού എന്ന ശ്രദ്ധ ക്ഷണിക്കുന്ന പദത്തെ പരിഭാഷപ്പെടുത്തുന്നു; ഈ വാക്യത്തിൽ അത് രണ്ടുതവണ വന്ന് രംഗത്തിന്റെ നാടകീയത വർധിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: “നിഴലിട്ടു” എന്ന പ്രയോഗം ദൈവത്തിന്റെ പ്രത്യക്ഷസാന്നിധ്യവുമായി ബന്ധപ്പെട്ട ബൈബിളിലെ ദൈവപ്രത്യക്ഷ ഭാഷയെ അനുസ്മരിപ്പിക്കുന്നതാകാം.
    reason: cross_reference
lexical_decisions:
- source_word: ἔτι αὐτοῦ λαλοῦντος
  choice: അവൻ ഇനിയും സംസാരിച്ചുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: സമകാലിക പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന genitive absolute സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുകയും ἔτι നൽകുന്ന ഇടയിൽ സംഭവിച്ച തടസ്സത്തിന്റെ ഭാവം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: രണ്ടുതവണ വരുന്ന ശ്രദ്ധ ക്ഷണിക്കുന്ന ആഖ്യാനചിഹ്നത്തിന്റെ നാടകീയത നിലനിർത്തുന്ന, മലയാളത്തിൽ പരിചിതവും ഗൗരവമുള്ളതുമായ പ്രയോഗം.
- source_word: νεφέλη φωτεινὴ
  choice: പ്രകാശമുള്ള ഒരു മേഘം
  rationale: φωτεινή എന്നതിന്റെ തെളിച്ചം നേരിട്ട് അറിയിക്കുന്നു; ദൈവശാസ്ത്രപരമായ പ്രതീകാർഥം മുഖ്യവാചകത്തിൽ അധികമായി ചേർക്കുന്നില്ല.
- source_word: ἐπεσκίασεν
  choice: അവരുടെമേൽ നിഴലിട്ടു
  rationale: മേഘം അവരെ മൂടിയെന്ന ദൃശ്യഭാവവും ദൈവസാന്നിധ്യവുമായി ബന്ധപ്പെട്ടിരിക്കാവുന്ന പ്രതിധ്വനിയും നിലനിർത്തുന്നു.
- source_word: φωνὴ ἐκ τῆς νεφέλης λέγουσα
  choice: മേഘത്തിൽനിന്ന് ഒരു ശബ്ദം പറഞ്ഞു
  rationale: ഗ്രീക്ക് participle-നെ സ്വാഭാവികമായ മലയാള ക്രിയാവാക്യമായി നൽകുന്നു.
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: എന്റെ പ്രിയപുത്രൻ
  rationale: പുത്രബന്ധവും ἀγαπητός സൂചിപ്പിക്കുന്ന സ്നേഹവും തിരഞ്ഞെടുപ്പിന്റെ ഭാവവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἐν ᾧ εὐδόκησα
  choice: ഇവനിൽ ഞാൻ പ്രസാദിച്ചിരിക്കുന്നു
  rationale: ἐν ᾧ എന്ന രൂപം നിലനിർത്തുകയും അഓറിസ്റ്റിന്റെ പ്രഖ്യാപനഭാവം മലയാളത്തിലെ സ്വാഭാവിക സമ്പൂർണരൂപത്തിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: ἀκούετε αὐτοῦ
  choice: ഇവന്റെ വാക്കു കേൾക്കുവിൻ
  rationale: വെറും ശ്രവണത്തേക്കാൾ ശ്രദ്ധിച്ചുകേട്ട് അനുസരിക്കുന്ന ഭാവമുള്ള ആജ്ഞയെ വ്യക്തമാക്കുന്നു; ‘അനുസരിക്കുവിൻ’ എന്ന് മാത്രം പറഞ്ഞ് അർഥം അതിയായി നിർണയിക്കുന്നില്ല.
theological_decisions:
- issue: യേശുവിനെക്കുറിച്ചുള്ള ദൈവിക പ്രഖ്യാപനം
  choice: ഇവൻ എന്റെ പ്രിയപുത്രൻ; ഇവനിൽ ഞാൻ പ്രസാദിച്ചിരിക്കുന്നു
  alternative: ഇവൻ എന്റെ പുത്രൻ, പ്രിയനായവൻ; ഇവനിൽ ഞാൻ പ്രസാദിച്ചു
  rationale: പിതാവ് യേശുവിനെ പുത്രനായി നേരിട്ട് തിരിച്ചറിയുന്നതും ἀγαπητός, εὐδόκησα എന്നിവയുടെ സ്നേഹ-പ്രസാദ ഭാഷയും സംരക്ഷിക്കുന്നു; പാഠത്തിലില്ലാത്ത പിൽക്കാല സാങ്കേതിക പദങ്ങൾ ചേർക്കുന്നില്ല.
- issue: ἀκούετε αὐτοῦ എന്ന ആജ്ഞയുടെ ശക്തി
  choice: ഇവന്റെ വാക്കു കേൾക്കുവിൻ
  alternative: ഇവനെ കേൾക്കുവിൻ
  rationale: ശ്രദ്ധിച്ചുകേൾക്കുകയും ചെവിക്കൊള്ളുകയും ചെയ്യുന്ന അർഥസാധ്യത നിലനിർത്തുന്നു; ‘അനുസരിക്കുവിൻ’ എന്ന വ്യാഖ്യാനപരമായ വിപുലീകരണം ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഇതാ’, ‘കേൾക്കുവിൻ’ എന്നിവ ഉയർന്നെങ്കിലും പൊതുവായി മനസ്സിലാകുന്ന തിരുവെഴുത്ത്-പ്രഖ്യാപന രജിസ്റ്റർ നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
