  rationale: ഗ്രീക്കിൽ ഇല്ലാത്ത ‘വാക്ക്’ എന്ന പദം മുഖ്യവാചകത്തിൽനിന്ന് നീക്കി, ἀκούετε αὐτοῦ-യുടെ വ്യക്തിയെ ലക്ഷ്യമാക്കുന്ന രൂപം “ഇവനെ കേൾക്കുവിൻ” എന്ന് പുനഃസ്ഥാപിച്ചു. അതേസമയം ശ്രദ്ധയോടെയും അനുസരണഭാവത്തോടെയും കേൾക്കുക എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി. രണ്ടാമത്തെ ἰδού-വിനോട് വായനയിൽ അടുത്തായി വരുന്നതിനായി [b] ചിഹ്നവും വാക്യത്തിനുള്ളിൽ സ്ഥാപിച്ചു.
