  naturalness: വാചകം ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമാണ്. “എന്റെ പ്രിയ പുത്രൻ” എന്ന വേർതിരിച്ച രൂപം സമകാലിക വായനയിൽ “പ്രിയപുത്രൻ” എന്ന സംയുക്തരൂപത്തേക്കാൾ അല്പം സ്വാഭാവികമാണ്; എന്നാൽ ഇരുരൂപങ്ങളും സ്വീകാര്യമാണ്. “ഇവനെ കേൾക്കുവിൻ” തിരുവെഴുത്തു-പ്രഖ്യാപന ശൈലിയിൽ സ്വാഭാവികമാണ്.
  terminology: “പ്രിയ പുത്രൻ,” “പ്രസാദിച്ചിരിക്കുന്നു,” “കേൾക്കുവിൻ” എന്നിവ യഥാക്രമം ὁ ἀγαπητός, εὐδόκησα, ἀκούετε എന്നിവയുടെ അർഥപരിധി സംരക്ഷിക്കുന്നു. ‘അനുസരിക്കുവിൻ’ എന്ന് മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല; അടിക്കുറിപ്പിൽ അതിന്റെ സാധ്യതയുള്ള ഭാവം മാത്രം വ്യക്തമാക്കുന്നു.
