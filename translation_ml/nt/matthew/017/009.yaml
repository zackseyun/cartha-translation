id: MAT.17.9
reference: Matthew 17:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ καταβαινόντων αὐτῶν ἐκ τοῦ ὄρους ἐνετείλατο αὐτοῖς ὁ Ἰησοῦς λέγων· Μηδενὶ εἴπητε τὸ ὅραμα ἕως οὗ ὁ υἱὸς τοῦ ἀνθρώπου ἐκ νεκρῶν ⸀ἐγερθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/009.yaml
  text: And as they were coming down from the mountain[a], Jesus commanded them, saying[b], “Tell the vision to no one until the Son of Man is raised from the dead.”
translation:
  language: ml
  text: 'അവർ മലയിൽനിന്ന് ഇറങ്ങിവരുമ്പോൾ യേശു അവരോട് ഇങ്ങനെ കല്പിച്ചു: “മനുഷ്യപുത്രൻ മരിച്ചവരിൽനിന്ന്[b] ഉയിർപ്പിക്കപ്പെടുന്നതുവരെ ഈ ദർശനം[a] ആരോടും പറയരുത്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങൾ കണ്ടത്.” ഗ്രീക്കിൽ “ദർശനം” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, “മരിച്ചവരുടെ ഇടയിൽനിന്ന്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβαινόντων αὐτῶν
  choice: അവർ ... ഇറങ്ങിവരുമ്പോൾ
  rationale: വർത്തമാനകാല കൃദന്തരൂപം സൂചിപ്പിക്കുന്ന, അതേ സമയത്ത് നടന്നുകൊണ്ടിരുന്ന പ്രവൃത്തി സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἐκ τοῦ ὄρους
  choice: മലയിൽനിന്ന്
  rationale: മുമ്പ് പരാമർശിച്ച നിർദിഷ്ട മലയെ സൂചിപ്പിക്കുന്ന ലളിതവും സന്ദർഭോചിതവുമായ പ്രയോഗം.
- source_word: ἐνετείλατο αὐτοῖς ... λέγων
  choice: യേശു അവരോട് ഇങ്ങനെ കല്പിച്ചു
  rationale: കല്പനയുടെ ശക്തി നിലനിർത്തുകയും λέγων എന്ന സംഭാഷണ-ആമുഖത്തെ സ്വാഭാവിക മലയാളത്തിൽ ‘ഇങ്ങനെ’ എന്നതിലൂടെ പ്രതിഫലിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: Μηδενὶ εἴπητε
  choice: ആരോടും പറയരുത്
  rationale: നിഷേധകല്പനയെ കൃത്യവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: τὸ ὅραμα
  choice: ഈ ദർശനം
  rationale: ὅραμα എന്ന പദത്തിന്റെ ദൈവിക വെളിപ്പാടുമായി ബന്ധപ്പെട്ട ഭാവം ‘ദർശനം’ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇപ്പോൾ കണ്ട സംഭവത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഈ’ സ്വാഭാവികമാണ്.
- source_word: ἕως οὗ
  choice: വരെ
  rationale: കല്പന ബാധകമായിരിക്കുന്ന സമയപരിധി ലളിതമായി വ്യക്തമാക്കുന്നു.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: യേശുവിന്റെ സ്വയംവിശേഷണത്തിന്റെ പരമ്പരാഗതവും അർത്ഥസമ്പന്നവുമായ മലയാളരൂപം; അതിന്റെ ദാനിയേൽസംബന്ധിയായ പ്രതിധ്വനി സംരക്ഷിക്കുന്നു.
- source_word: ἐκ νεκρῶν
  choice: മരിച്ചവരിൽനിന്ന്
  rationale: മരിച്ചവരുടെ കൂട്ടത്തിൽനിന്നോ മരണത്തിന്റെ മണ്ഡലത്തിൽനിന്നോ ഉള്ള ഉയിർപ്പിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തോട് അടുത്തുനിൽക്കുന്നു.
- source_word: ἐγερθῇ
  choice: ഉയിർപ്പിക്കപ്പെടുന്നതുവരെ
  rationale: ഗ്രീക്കിലെ ഏറിസ്റ്റ് പാസീവ് സബ്ജങ്ക്റ്റീവിന്റെ കർമണിപ്രയോഗം നിലനിർത്തുന്നു; പ്രവർത്തകനെ വാക്യം പറയുന്നതിലധികം വ്യക്തമാക്കുന്നില്ല.
theological_decisions:
- issue: പുനരുത്ഥാനപ്രയോഗവും കർമണിരൂപവും
  choice: മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിക്കപ്പെടുന്നതുവരെ
  alternative: മരിച്ചവരിൽനിന്ന് ഉയിർത്തെഴുന്നേൽക്കുന്നതുവരെ
  rationale: ἐγερθῇ കർമണിരൂപമാണ്. ‘ഉയിർപ്പിക്കപ്പെടുക’ ആ രൂപം സംരക്ഷിക്കുകയും ദൈവിക പ്രവർത്തനത്തിന്റെ സൂചന നിലനിർത്തുകയും ചെയ്യുന്നു; എന്നാൽ പ്രവർത്തകനെ തുറന്നുപറഞ്ഞ് വാക്യത്തേക്കാൾ അധികം വ്യാഖ്യാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കല്പിച്ചു,’ ‘മനുഷ്യപുത്രൻ,’ ‘ദർശനം’ എന്നീ പദങ്ങൾ മൂലപാഠത്തിന്റെ ശക്തിയും ദൈവശാസ്ത്രപരമായ പ്രതിധ്വനിയും നിലനിർത്തുന്നു; വാക്യഘടന സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതാണ്.
