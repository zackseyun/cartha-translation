id: MAT.17.23
reference: Matthew 17:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀποκτενοῦσιν αὐτόν, καὶ τῇ τρίτῃ ἡμέρᾳ ἐγερθήσεται. καὶ ἐλυπήθησαν σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/023.yaml
  text: and they will kill him[a], and on the third day he will be raised. And they were deeply grieved.
translation:
  language: ml
  text: അവർ അവനെ കൊല്ലും; മൂന്നാം ദിവസം അവൻ ഉയിർപ്പിക്കപ്പെടും.[a] അവർ അത്യന്തം ദുഃഖിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, “അവൻ ഉയിർത്തെഴുന്നേൽക്കും.” ഗ്രീക്ക് ക്രിയ നിഷ്ക്രിയരൂപത്തിലാണ്: “അവൻ ഉയിർപ്പിക്കപ്പെടും.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκτενοῦσιν αὐτόν
  choice: അവർ അവനെ കൊല്ലും
  rationale: ഭാവികാല സജീവക്രിയയും അതിന്റെ കർമവും നേരിട്ടും സ്വാഭാവികമായും പരിഭാഷപ്പെടുത്തുന്നു. ‘വധിക്കും’ എന്നത് സാധ്യമെങ്കിലും കൂടുതൽ ഔപചാരികമാണ്; ‘കൊലപ്പെടുത്തും’ എന്നത് മൂലക്രിയയിൽ നിർബന്ധമായില്ലാത്ത ധാർമിക ഊന്നൽ നൽകാം.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: മൂന്നാം ദിവസം
  rationale: സമയത്തെ സൂചിപ്പിക്കുന്ന ദത്തിവിഭക്തിയുടെ സ്വാഭാവിക മലയാളരൂപം; മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘അതിന് ശേഷം’ പോലുള്ള വിശദീകരണം ചേർക്കുന്നില്ല.
- source_word: ἐγερθήσεται
  choice: അവൻ ഉയിർപ്പിക്കപ്പെടും
  rationale: ഭാവികാല നിഷ്ക്രിയരൂപം നിലനിർത്തുന്നു. ഇത് ദൈവിക പ്രവർത്തനത്തിന്റെ സൂചന സംരക്ഷിക്കുമ്പോഴും പ്രവർത്തകനെ മൂലപാഠത്തേക്കാൾ വ്യക്തമാക്കുന്നില്ല.
- source_word: ἐλυπήθησαν σφόδρα
  choice: അവർ അത്യന്തം ദുഃഖിച്ചു
  rationale: ἐλυπήθησαν സൂചിപ്പിക്കുന്ന ദുഃഖവും σφόδρα നൽകുന്ന ശക്തമായ തീവ്രതയും ആധുനികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: καὶ ... καὶ ... καὶ
  choice: വാക്യക്രമവും ബന്ധവും നിലനിർത്തുന്ന ലളിതമായ അനുക്രമം
  rationale: ഗ്രീക്കിലെ ലളിതമായ സമാന്തര വാക്യഘടന അനാവശ്യമായ കാലസൂചനകളോ കാരണബന്ധങ്ങളോ ചേർക്കാതെ മലയാളത്തിലെ വിരാമചിഹ്നങ്ങളിലൂടെ സ്വാഭാവികമാക്കി.
theological_decisions:
- issue: പുനരുത്ഥാന പ്രവചനത്തിലെ നിഷ്ക്രിയ-സജീവ രൂപഭേദം
  choice: അവൻ ഉയിർപ്പിക്കപ്പെടും
  alternative: അവൻ ഉയിർത്തെഴുന്നേൽക്കും
  rationale: ഗ്രീക്ക് ക്രിയ ഭാവികാല നിഷ്ക്രിയരൂപത്തിലാണ്. നിഷ്ക്രിയരൂപം നിലനിർത്തുന്നത് പുനരുത്ഥാനം ദൈവത്തിന്റെ പ്രവൃത്തിയെന്ന സൂചന സംരക്ഷിക്കുന്നു; അതേസമയം പ്രവർത്തകനെ പാഠത്തിൽ ഇല്ലാത്ത വിധം പേരെടുത്ത് പറയുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. സന്ദർഭത്തിൽ വ്യത്യസ്ത കൂട്ടങ്ങളെ സൂചിപ്പിക്കാവുന്ന ആവർത്തിത ‘അവർ’ എന്ന സർവനാമം മൂലപാഠത്തിന്റെ സംക്ഷിപ്തതയും സന്ദർഭാശ്രിതത്വവും നിലനിർത്തുന്നു.
