  yaml_path: translation/nt/matthew/017/026.yaml
  text: When he said[a], “From strangers,” Jesus said to him[c][b], “Then the sons are free.”
translation:
  language: ml
  text: '“അന്യരിൽനിന്ന്,” എന്ന് അവൻ പറഞ്ഞപ്പോൾ, യേശു അവനോടു പറഞ്ഞു: “അങ്ങനെയെങ്കിൽ പുത്രന്മാർ സ്വതന്ത്രരാണ്[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നികുതിയിൽനിന്ന് ഒഴിവുള്ളവരാണ്.” ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “സ്വതന്ത്രരാണ്” എന്നാണ്; ഈ സന്ദർഭത്തിൽ നികുതി നൽകേണ്ട ബാധ്യതയിൽനിന്നുള്ള സ്വാതന്ത്ര്യമാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰπόντος δέ
  choice: എന്ന് അവൻ പറഞ്ഞപ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ടിന്റെ കാലസംബന്ധമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; δέ ഇവിടെ സംഭാഷണത്തിലെ മാറ്റം സൂചിപ്പിക്കുന്നതിനാൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്തേണ്ടതില്ല.
- source_word: ἀπὸ τῶν ἀλλοτρίων
  choice: അന്യരിൽനിന്ന്
  rationale: രാജാവിന്റെ സ്വന്തം പുത്രന്മാരല്ലാത്തവരെ സൂചിപ്പിക്കുന്ന ബന്ധപരമായ വൈരുധ്യം നിലനിർത്തുന്നു; ‘വിദേശികൾ’ എന്നത് ദേശീയതയെ അനാവശ്യമായി മുൻനിർത്താം.
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: യേശു അവനോടു പറഞ്ഞു
  rationale: φημί എന്ന സാധാരണ ആഖ്യാനക്രിയയുടെ നേരായ, സ്വാഭാവിക പരിഭാഷ.
- source_word: Ἄρα γε
  choice: അങ്ങനെയെങ്കിൽ
  rationale: പത്രോസിന്റെ മറുപടിയിൽനിന്ന് യേശു നിഗമനം വരുത്തുന്നതിനെ വ്യക്തവും സ്വാഭാവികവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἐλεύθεροί
  choice: സ്വതന്ത്രരാണ്
  rationale: മൂലപദത്തിന്റെ വിശാലമായ ‘സ്വതന്ത്രർ’ എന്ന അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ നികുതിബാധ്യതയിൽനിന്നുള്ള ഒഴിവ് ഉൾപ്പെടുന്നുവെങ്കിലും ‘ഒഴിവുള്ളവർ’ എന്നു മാത്രം പറഞ്ഞ് അർഥം ചുരുക്കുന്നില്ല.
- source_word: οἱ υἱοί
  choice: പുത്രന്മാർ
  rationale: രാജാവിന്റെ പുത്രന്മാരും അന്യരും തമ്മിലുള്ള ഗൃഹപരവും നിയമപരവുമായ വൈരുധ്യം നിലനിർത്തുകയും ഗ്രീക്കിലെ വ്യക്തമായ പുല്ലിംഗ ബഹുവചനം കൃത്യമായി പ്രതിഫലിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: οἱ υἱοί എന്ന പദത്തിലെ പുത്രത്വഭാഷയും പ്രതിനിധാനസാധ്യതയും
  choice: പുത്രന്മാർ
  alternative: മക്കൾ
  rationale: ഉടൻപിന്നിലുള്ള ഉപമ രാജാവിന്റെ പുത്രന്മാർക്ക് നികുതിയോടുള്ള ബന്ധത്തെക്കുറിച്ചാണ്; അതിനാൽ മൂലത്തിലെ പുല്ലിംഗവും പുത്രത്വത്തിന്റെ ദൈവശാസ്ത്രപരമായ അനുരണനവും നിലനിർത്തുന്നു, അതേസമയം വാക്യത്തിന്റെ പ്രയോഗപരിധി പരിഭാഷയിൽ വികസിപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അന്യർ,’ ‘പുത്രന്മാർ,’ ‘സ്വതന്ത്രർ’ എന്നീ പദങ്ങൾ മൂലത്തിലെ രാജഗൃഹ-വൈരുധ്യവും പുത്രത്വഭാഷയും നിലനിർത്തുന്നു.
