id: MAT.17.25
reference: Matthew 17:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγει· Ναί. καὶ ⸀ἐλθόντα εἰς τὴν οἰκίαν προέφθασεν αὐτὸν ὁ Ἰησοῦς λέγων· Τί σοι δοκεῖ, Σίμων; οἱ βασιλεῖς τῆς γῆς ἀπὸ τίνων λαμβάνουσιν τέλη ἢ κῆνσον; ἀπὸ τῶν υἱῶν αὐτῶν ἢ ἀπὸ τῶν ἀλλοτρίων;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/025.yaml
  text: He said[a], “Yes.” And when he came into the house, Jesus spoke to him first, saying, “What do you think[b], Simon? From whom do the kings of the earth collect duties or poll tax—from their own sons or from others?”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “അതെ.” അവൻ വീട്ടിൽ കയറിയപ്പോൾ, യേശു അവനോടു മുൻകൈയെടുത്ത് പറഞ്ഞു: “ശിമോനേ, നിനക്ക് എന്തു തോന്നുന്നു? ഭൂമിയിലെ രാജാക്കന്മാർ ചുങ്കമോ തലവരിയോ[a] ആരിൽനിന്നാണ് ഈടാക്കുന്നത്—സ്വന്തം പുത്രന്മാരിൽനിന്നോ മറ്റുള്ളവരിൽനിന്നോ[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ചുങ്കം” എന്നത് തീരുവയോ കസ്റ്റംസ് നികുതിയോ എന്നും വിവർത്തനം ചെയ്യാം; ഗ്രീക്ക് പാഠം ഇതിനെ “തലവരി”യിൽനിന്ന് വേർതിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “മറ്റുള്ളവർ” എന്നതിന് “അന്യർ” എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്ക് പദം സ്വന്തം കുടുംബത്തിൽപ്പെടാത്ത പുറത്തുള്ളവരെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ναί
  choice: അതെ
  rationale: ലളിതമായ സമ്മതം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നേരിട്ട് നൽകുന്നു.
- source_word: ἐλθόντα εἰς τὴν οἰκίαν
  choice: അവൻ വീട്ടിൽ എത്തിയപ്പോൾ
  rationale: കർതൃസൂചന പത്രോസിലേക്കാണെന്നത് വ്യക്തമാക്കിക്കൊണ്ട് കൃുദന്തരൂപത്തെ സ്വാഭാവികമായ കാലവാക്യമായി നൽകുന്നു.
- source_word: προέφθασεν αὐτὸν ὁ Ἰησοῦς λέγων
  choice: യേശു അവനോടു ആദ്യം ചോദിച്ചു
  rationale: പത്രോസ് സംസാരിക്കുന്നതിന് മുമ്പ് യേശു സംഭാഷണത്തിന് തുടക്കമിട്ടുവെന്ന സന്ദർഭാർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു; തുടർന്നുവരുന്നത് ചോദ്യമായതിനാൽ ‘ചോദിച്ചു’ യോജിക്കുന്നു.
- source_word: Τί σοι δοκεῖ
  choice: നിനക്ക് എന്തു തോന്നുന്നു?
  rationale: ശിമോന്റെ വിലയിരുത്തൽ തേടുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സാധാരണ മലയാളരൂപം.
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: ഭൂമിയിലെ രാജാക്കന്മാർ
  rationale: γῆയുടെ വിശാലമായ അർഥം പ്രത്യേക ദേശമായി ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: τέλη
  choice: ചുങ്കം
  rationale: പരോക്ഷ നികുതി, കസ്റ്റംസ്, തീരുവ എന്നിവ ഉൾക്കൊള്ളുന്ന പദമായി മലയാളത്തിൽ സ്വാഭാവികവും κῆνσον എന്നതിൽനിന്ന് വേർതിരിക്കാവുന്നതുമാണ്.
- source_word: κῆνσον
  choice: തലവരി
  rationale: വ്യക്തികളുടെ മേൽ ചുമത്തുന്ന തലനികുതി/കപ്പം എന്ന പ്രത്യേക അർഥം ചുരുക്കമായി നൽകുകയും τέληയിൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: υἱῶν αὐτῶν
  choice: സ്വന്തം പുത്രന്മാരിൽനിന്ന്
  rationale: υἱοί എന്നതിന്റെ പുരുഷലിംഗ കുടുംബഭാഷയും രാജാവിന്റെ സ്വന്തം കുടുംബവും പുറത്തുള്ളവരും തമ്മിലുള്ള വൈരുധ്യവും സംരക്ഷിക്കുന്നു.
- source_word: ἀλλοτρίων
  choice: മറ്റുള്ളവരിൽനിന്ന്
  rationale: സ്വന്തം കുടുംബത്തിൽപ്പെടാത്ത പുറത്തുള്ളവരെ സൂചിപ്പിക്കുന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു; കൂടുതൽ അക്ഷരാർഥമായ സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ ഉപമയിലെ ‘പുത്രന്മാർ’ എന്ന കുടുംബഭാഷയിൽനിന്നുള്ള ദൈവശാസ്ത്രപരമായ സൂചന
  choice: ‘സ്വന്തം പുത്രന്മാർ’ എന്ന അക്ഷരാർഥ കുടുംബഭാഷ നിലനിർത്തി, മുഖ്യപാഠത്തിൽ ക്രിസ്തുശാസ്ത്രപരമായ വിശദീകരണം ചേർക്കുന്നില്ല.
  alternative: സ്വന്തം മക്കൾ; പ്രജകൾ
  rationale: രാജാവിന്റെ സ്വന്തം കുടുംബത്തിന് നികുതിയിളവുണ്ടെന്നതാണ് ഉടൻ പ്രസക്തമായ ആശയം; അടുത്ത വാക്യത്തിലെ പുത്രനെക്കുറിച്ചുള്ള സൂചനയ്ക്കുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷവും തുറന്ന നിലയിൽ തുടരുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. നികുതിവകകളുടെ വ്യത്യാസം ‘ചുങ്കം/തലവരി’ എന്ന ജോടിയിലൂടെ സംരക്ഷിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട വൈരുധ്യങ്ങൾക്ക് പിന്നാലെ മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
