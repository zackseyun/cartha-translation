id: MAT.17.4
reference: Matthew 17:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν τῷ Ἰησοῦ· Κύριε, καλόν ἐστιν ἡμᾶς ὧδε εἶναι· εἰ θέλεις, ⸀ποιήσω ὧδε τρεῖς σκηνάς, σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ ⸂Ἠλίᾳ μίαν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/004.yaml
  text: 'Then Peter answered and said to Jesus[a], “Lord, it is good for us to be here. If you wish, I will make three shelters here: one for you, one for Moses, and one for Elijah.”'
translation:
  language: ml
  text: 'അപ്പോൾ പത്രോസ് യേശുവിനോടു മറുപടിയായി പറഞ്ഞു: “കർത്താവേ, നാം ഇവിടെ ഇരിക്കുന്നത് നല്ലതാണ്. അങ്ങേക്ക് ഇഷ്ടമാണെങ്കിൽ, ഞാൻ ഇവിടെ മൂന്ന് കൂടാരങ്ങൾ[a] ഉണ്ടാക്കാം—അങ്ങേക്കായി ഒന്ന്, മോശയ്ക്കായി ഒന്ന്, ഏലിയാവിനായി ഒന്ന്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിലെ സ്കീനാസ് (σκηνάς) എന്ന പദം “കുടിലുകൾ,” “തമ്പുകൾ,” അല്ലെങ്കിൽ “പന്തലുകൾ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν
  choice: അപ്പോൾ പത്രോസ് ... പറഞ്ഞു
  rationale: ἀποκριθεὶς ... εἶπεν എന്ന ഗ്രീക്ക് സംഭാഷണസൂത്രം പദാനുപദമായി ആവർത്തിക്കുന്നത് മലയാളത്തിൽ കൃത്രിമമാകും. δέയുടെ ആഖ്യാനപുരോഗതി ‘അപ്പോൾ’ കൊണ്ടും പ്രസ്താവനയുടെ സ്വാഭാവികത ‘പറഞ്ഞു’ കൊണ്ടും നൽകുന്നു.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: യേശുവിനെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്ന κύριος എന്ന പദത്തിന്റെ ആദരവും സാധ്യമായ ദൈവശാസ്ത്രപരമായ ഭാരവും നിലനിർത്തുന്നു.
- source_word: καλόν ἐστιν ἡμᾶς ὧδε εἶναι
  choice: നാം ഇവിടെ ആയിരിക്കുന്നത് നല്ലതാണ്
  rationale: ഗ്രീക്കിലെ ഉൾക്കൊള്ളുന്ന ബഹുവചനവും infinitival construction-ഉം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അടുപ്പത്തോടെ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: εἰ θέλεις
  choice: അങ്ങേക്ക് ഇഷ്ടമാണെങ്കിൽ
  rationale: θέλω ആഗ്രഹത്തെയോ മനസ്സിനെയോ സൂചിപ്പിക്കാം. ആദരപൂർവമായ നേരിട്ടുള്ള അഭിസംബോധനയിൽ ഈ പ്രയോഗം സ്വാഭാവികമാണ്.
- source_word: ποιήσω
  choice: ഞാൻ ... ഉണ്ടാക്കാം
  rationale: ഒന്നാംപുരുഷ ഏകവചനത്തിലുള്ള പത്രോസിന്റെ വാഗ്ദാനസന്നദ്ധത വ്യക്തമാക്കുന്നു; താത്കാലിക ഘടനകളുടെ നിർമാണത്തിന് യോജിക്കുന്ന വിശാലമായ ക്രിയയാണ് ‘ഉണ്ടാക്കുക’.
- source_word: σκηνάς
  choice: കൂടാരങ്ങൾ
  rationale: σκηνήയുടെ അടിസ്ഥാന അർഥമായ താത്കാലിക പാർപ്പിടഘടനയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ഉത്സവപരമായ ബന്ധം ഉറപ്പിച്ച് ചേർക്കാതെ അതിനുള്ള സാധ്യതയും പൂർണമായി ഇല്ലാതാക്കുന്നില്ല.
- source_word: σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ Ἠλίᾳ μίαν
  choice: അങ്ങേക്കായി ഒന്ന്, മോശയ്ക്കായി ഒന്ന്, ഏലിയാവിനായി ഒന്ന്
  rationale: μίαν എന്ന പദത്തിന്റെ മൂന്നുതവണത്തെ ആവർത്തനം നിലനിർത്തി, ഓരോ വ്യക്തിക്കും ഓരോ കൂടാരം എന്ന വിതരണ ഊന്നൽ വ്യക്തമാക്കുന്നു.
- source_word: ὧδε
  choice: ഇവിടെ
  rationale: ഗ്രീക്കിലെ രണ്ട് പ്രയോഗങ്ങളും മലയാളത്തിൽ ‘ഇവിടെ’ എന്നു നൽകി ആവർത്തനം നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശുവിനെ അഭിസംബോധന ചെയ്യുന്ന κύριος
  choice: കർത്താവേ
  alternative: ഗുരുവേ / യജമാനനേ
  rationale: ‘കർത്താവ്’ ആദരസൂചനയും പദത്തിനുള്ള ദൈവശാസ്ത്രപരമായ സാധ്യതയും ഒരുമിച്ച് നിലനിർത്തുന്നു; ‘ഗുരു’ എന്നു മാത്രം നൽകിയാൽ അർഥപരിധി ചുരുങ്ങും.
- issue: രൂപാന്തരീകരണസന്ദർഭത്തിലെ σκηνάς
  choice: കൂടാരങ്ങൾ
  alternative: കുടിലുകൾ / തമ്പുകൾ / പന്തലുകൾ
  rationale: വാക്യം ഈ ഘടനകളെ കൂടാരപ്പെരുന്നാളുമായി വ്യക്തമായി സമീകരിക്കുന്നില്ല. അതിനാൽ പ്രധാനപാഠത്തിൽ സാധാരണവും വിശാലവുമായ പദം ഉപയോഗിച്ച്, മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ആദരപൂർവവും വായനാസൗകര്യമുള്ളതുമായ ശൈലി. യേശുവിനോടുള്ള അഭിസംബോധനയിൽ ‘അങ്ങ്’ രൂപം ഉപയോഗിച്ചിരിക്കുന്നു; എന്നാൽ വാക്യത്തിന്റെ ലാളിത്യവും നേരിട്ടുള്ള സംഭാഷണസ്വഭാവവും നിലനിർത്തുന്നു.
