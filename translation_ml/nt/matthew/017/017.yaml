revisions:
- from: 'അപ്പോൾ യേശു മറുപടി പറഞ്ഞു: “അവിശ്വാസവും വഴിതെറ്റിയതുമായ തലമുറയേ,[a] എത്രകാലം ഞാൻ നിങ്ങളോടുകൂടെ ഇരിക്കും? എത്രകാലം ഞാൻ നിങ്ങളെ സഹിക്കും? അവനെ ഇവിടെ എന്റെ അടുക്കൽ കൊണ്ടുവരൂ.”'
