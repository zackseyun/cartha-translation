id: MAT.17.17
reference: Matthew 17:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Ὦ γενεὰ ἄπιστος καὶ διεστραμμένη, ἕως πότε ⸂μεθ’ ὑμῶν ἔσομαι⸃; ἕως πότε ἀνέξομαι ὑμῶν; φέρετέ μοι αὐτὸν ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/017.yaml
  text: But Jesus answered[a], “O unbelieving and perverse generation[c][b], how long will I be with you? How long will I bear with you? Bring him here to me.”
translation:
  language: ml
  text: 'യേശു മറുപടി പറഞ്ഞു: “വിശ്വാസമില്ലാത്തതും വഴിതെറ്റിയതുമായ തലമുറയേ,[a] എത്രകാലം ഞാൻ നിങ്ങളോടുകൂടെ ഉണ്ടായിരിക്കും? എത്രകാലം ഞാൻ നിങ്ങളെ സഹിക്കും? അവനെ ഇവിടെ എന്റെ അടുക്കൽ കൊണ്ടുവരൂ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വിശ്വാസമില്ലാത്തതും വഴിതെറ്റിയതുമായ” എന്നതിന് “അവിശ്വസ്തവും വക്രമായതുമായ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν
  choice: അപ്പോൾ യേശു മറുപടി പറഞ്ഞു
  rationale: ἀποκριθείς ... εἶπεν എന്നത് സ്വാഭാവിക മലയാളത്തിൽ ‘മറുപടി പറഞ്ഞു’ എന്ന് നൽകുന്നു; δέ ഇവിടെ മൃദുവായ ആഖ്യാനമാറ്റം സൂചിപ്പിക്കുന്നതിനാൽ ‘അപ്പോൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: Ὦ γενεὰ
  choice: തലമുറയേ
  rationale: വിളിസംബോധനയുടെ ഗൗരവവും പ്രവാചകശൈലിയും നിലനിർത്തുന്നു; മലയാളത്തിൽ പ്രത്യേകം ‘ഓ’ ചേർക്കാതെ സംബോധനപ്രത്യയം സ്വാഭാവികമായി Ὦ-യുടെ ധർമ്മം വഹിക്കുന്നു.
- source_word: ἄπιστος
  choice: അവിശ്വാസവും … ആയ
  rationale: സന്ദർഭത്തിലെ വിശ്വാസക്കുറവ് നേരിട്ട് പ്രകടമാക്കുന്നു; ‘വിശ്വാസവഞ്ചന’ എന്ന ഉടമ്പടിസംബന്ധമായ കൂടുതൽ നിർദിഷ്ട അർഥം അടിച്ചേൽപ്പിക്കുന്നില്ല.
- source_word: διεστραμμένη
  choice: വഴിതെറ്റിയതുമായ
  rationale: വളച്ചൊടിക്കപ്പെട്ടതോ ശരിയായ വഴിയിൽനിന്ന് മാറിയതോ ആയ അവസ്ഥയെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ അറിയിക്കുന്നു; പദത്തിന്റെ നൈതിക തീവ്രതയും നിലനിർത്തുന്നു.
- source_word: ἕως πότε μεθ’ ὑμῶν ἔσομαι
  choice: എത്രകാലം ഞാൻ നിങ്ങളോടുകൂടെ ഇരിക്കും?
  rationale: ഭാവികാലവും ആവർത്തിക്കുന്ന ‘എത്രകാലം’ എന്ന ആക്ഷേപചോദ്യവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: ἕως πότε ἀνέξομαι ὑμῶν
  choice: എത്രകാലം ഞാൻ നിങ്ങളെ സഹിക്കും?
  rationale: ἀνέχομαι എന്നതിന്റെ ‘സഹിക്കുക/ക്ഷമയോടെ താങ്ങുക’ എന്ന അർഥം ആക്ഷേപത്തിന്റെ തീവ്രത കുറയ്ക്കാതെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: φέρετέ μοι αὐτὸν ὧδε
  choice: അവനെ ഇവിടെ എന്റെ അടുക്കൽ കൊണ്ടുവരൂ
  rationale: ആൺകുട്ടിയെ യേശുവിന്റെ അടുക്കൽ കൊണ്ടുവരാനുള്ള ബഹുവചന ആജ്ഞയുടെ സന്ദർഭാർഥം വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: ἄπιστος എന്ന വിശേഷണത്തിന്റെ അർഥപരിധി
  choice: അവിശ്വാസമുള്ള
  alternative: വിശ്വാസമില്ലാത്ത / വിശ്വസ്തതയില്ലാത്ത
  rationale: തൊട്ടുമുമ്പുള്ള സംഭവത്തിൽ വിശ്വാസത്തിന്റെ അപര്യാപ്തതയാണ് പ്രധാനം. എങ്കിലും ‘അവിശ്വാസം’ അവിശ്വസ്തതയുടെ എല്ലാ സാധ്യതകളും നിർവചിച്ചു തീർക്കുന്നില്ല; അതിനാൽ മൂലത്തിലെ അർഥപിരിമുറുക്കം അമിതമായി തീർപ്പാക്കുന്നില്ല.
- issue: διεστραμμένη എന്നതിലെ നൈതികവും ദിശാസംബന്ധവുമായ രൂപകം
  choice: വഴിതെറ്റിയ
  alternative: വക്രമായ / ദുഷിച്ച
  rationale: ‘വഴിതെറ്റിയ’ ശരിയായ നിലയിൽനിന്നുള്ള വ്യതിചലനം പ്രകടമാക്കുകയും, ലൈംഗിക അർഥസൂചനയുള്ള ആധുനിക ഉപയോഗം അനാവശ്യമായി വരുത്താവുന്ന പദങ്ങൾ ഒഴിവാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. യേശുവിന്റെ ദുഃഖവും ശാസനയും പ്രകടമാകുന്നു; അതേസമയം സംഭാഷണം അതിപുരാതനമോ അതിസാധാരണമോ ആക്കുന്ന പ്രയോഗങ്ങൾ ഒഴിവാക്കി.
