  to: അപ്പോൾ, അവൻ തങ്ങളോടു പറഞ്ഞത് സ്നാപകനായ യോഹന്നാനെക്കുറിച്ചാണെന്ന് ശിഷ്യന്മാർ മനസ്സിലാക്കി.[a]
