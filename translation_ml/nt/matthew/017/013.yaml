id: MAT.17.13
reference: Matthew 17:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τότε συνῆκαν οἱ μαθηταὶ ὅτι περὶ Ἰωάννου τοῦ βαπτιστοῦ εἶπεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/013.yaml
  text: Then the disciples understood that he had spoken to them about John the Baptist[a].
translation:
  language: ml
  text: അപ്പോൾ, അവൻ തങ്ങളോടു പറഞ്ഞത് സ്നാപകനായ യോഹന്നാനെക്കുറിച്ചാണെന്ന് ശിഷ്യന്മാർ മനസ്സിലാക്കി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സ്നാനം നൽകുന്ന യോഹന്നാൻ.”
    reason: βαπτιστής എന്ന പദത്തിന്റെ പ്രവർത്തനാർഥമുള്ള പരിഭാഷാവികൽപം നൽകുന്നു.
lexical_decisions:
- source_word: τότε
  choice: അപ്പോൾ
  rationale: ശിഷ്യന്മാർ ആ നിമിഷത്തിൽ കാര്യം ഗ്രഹിച്ചതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സംക്ഷിപ്തവുമായ ആഖ്യാനബന്ധകമാണ്.
- source_word: συνῆκαν
  choice: മനസ്സിലാക്കി
  rationale: അവർ പറഞ്ഞതിന്റെ അർഥം ഗ്രഹിച്ചു എന്ന ആശയം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: οἱ μαθηταὶ
  choice: ശിഷ്യന്മാർ
  rationale: സുവിശേഷവിവരണത്തിൽ യേശുവിന്റെ അനുയായികളെ സൂചിപ്പിക്കുന്ന പതിവും സുലഭവുമായ മലയാളപ്രയോഗം.
- source_word: ὅτι
  choice: എന്ന്
  rationale: അവർ മനസ്സിലാക്കിയ കാര്യത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു; കാരണാർഥമല്ല.
- source_word: περὶ
  choice: കുറിച്ച്
  rationale: ജനിറ്റീവിനോടുകൂടിയ περί ഇവിടെ സംസാരവിഷയത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  choice: സ്നാപകനായ യോഹന്നാൻ
  rationale: യോഹന്നാനെ തിരിച്ചറിയിക്കുന്ന βαπτιστής എന്ന വിശേഷണത്തിന് മലയാള ബൈബിൾഭാഷയിൽ സുപരിചിതമായ രൂപം; പ്രവർത്തനാർഥമുള്ള മറ്റൊരു പരിഭാഷ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: εἶπεν αὐτοῖς
  choice: യേശു തങ്ങളോടു പറഞ്ഞത്
  rationale: ഗ്രീക്കിലെ കർത്താവ് സന്ദർഭത്തിൽ യേശുവാണെന്ന് വ്യക്തമാണ്; മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി പേര് വ്യക്തമാക്കുന്നു. മുൻപ് നടന്ന സംസാരത്തെ ‘പറഞ്ഞത്’ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഉടൻമുമ്പുള്ള സന്ദർഭത്തിലെ ഏലിയാവിനെക്കുറിച്ചുള്ള പരാമർശത്തിന്റെ തിരിച്ചറിയൽ
  choice: യേശു പറഞ്ഞത് സ്നാപകനായ യോഹന്നാനെക്കുറിച്ചാണെന്ന് ശിഷ്യന്മാർ മനസ്സിലാക്കിയതായി നേരിട്ട് പ്രസ്താവിക്കുന്നു.
  alternative: ഏലിയാവും യോഹന്നാനും തമ്മിലുള്ള ബന്ധം വിശദീകരിച്ച് വികസിപ്പിക്കുക.
  rationale: ഈ വാക്യം ശിഷ്യന്മാരുടെ ധാരണയെ വ്യക്തമായി രേഖപ്പെടുത്തുന്നു; അതിനപ്പുറം ബന്ധത്തിന്റെ സ്വഭാവം വിശദീകരിക്കുന്നത് പരിഭാഷകന്റെ വ്യാഖ്യാനം ചേർക്കുന്നതായിരിക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘സ്നാപകൻ’ എന്ന സുപരിചിത ബൈബിൾപദം നിലനിർത്തി, അതിന്റെ പ്രവർത്തനാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
