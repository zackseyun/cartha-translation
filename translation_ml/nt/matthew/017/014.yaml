  text: And when they came to the crowd[a], a man came up to him, kneeling before him[b],
translation:
  language: ml
  text: അപ്പോൾ, അവർ ജനക്കൂട്ടത്തിന്റെ അടുത്തേക്ക് എത്തിയപ്പോൾ, ഒരു മനുഷ്യൻ യേശുവിന്റെ അടുത്തുചെന്ന് അവന്റെ മുമ്പിൽ മുട്ടുകുത്തി[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യേശുവിന്റെ മുമ്പിൽ മുട്ടിന്മേൽ വീണു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: അപ്പോൾ
  rationale: മുൻവിവരണവുമായി ബന്ധിപ്പിക്കുന്ന സാധാരണ ആഖ്യാനസംയോജകമായി സ്വാഭാവിക മലയാളത്തിൽ കാലസൂചനയോടുകൂടി നൽകുന്നു.
- source_word: ἐλθόντων
  choice: അവർ ... അടുത്തെത്തിയപ്പോൾ
  rationale: സന്ദർഭത്തിൽനിന്ന് മനസ്സിലാകുന്ന ബഹുവചന കർത്താവോടുകൂടിയ genitive absolute-ന്റെ കാലാർഥം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: πρὸς τὸν ὄχλον
  choice: ജനക്കൂട്ടത്തിന്റെ അടുത്ത്
  rationale: ὄχλος എന്നതിന്റെ സാധാരണ അർഥമായ ‘ജനക്കൂട്ടം’ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; πρός സൂചിപ്പിക്കുന്ന സമീപനദിശയും നിലനിർത്തുന്നു.
- source_word: προσῆλθεν αὐτῷ
  choice: അവന്റെ അടുത്തുവന്നു
  rationale: ആ മനുഷ്യൻ യേശുവിനെ സമീപിച്ചതെന്ന ചലനാർഥം ലളിതവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἄνθρωπος
  choice: ഒരു മനുഷ്യൻ
  rationale: ഇവിടെ ഒരു പ്രത്യേക പുരുഷവ്യക്തിയെയാണ് പദം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘ഒരു മനുഷ്യൻ’ ഉറവിടത്തിന്റെ രൂപവും സന്ദർഭവും യോജിച്ചുനിൽക്കുന്നു.
- source_word: γονυπετῶν αὐτὸν
  choice: അവന്റെ മുമ്പിൽ മുട്ടുകുത്തി
  rationale: യേശുവിന്റെ മുമ്പിൽ മുട്ടുകുത്തുന്ന ശാരീരിക പ്രവൃത്തി വ്യക്തമാക്കുന്നു; ആരാധനയെന്ന അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ἄνθρωπος എന്ന പദം ഒരു പ്രത്യേക വ്യക്തിയെ സൂചിപ്പിക്കുന്നത്
  choice: ഒരു മനുഷ്യൻ
  alternative: ഒരാൾ
  rationale: വാക്യത്തിൽ ഒരു നിർദിഷ്ട പുരുഷവ്യക്തിയെയാണ് പരാമർശിക്കുന്നത്; ‘ഒരു മനുഷ്യൻ’ അത് കൃത്യമായി നിലനിർത്തുന്നു, എന്നാൽ പൊതുവായ മനുഷ്യസ്വഭാവത്തെക്കുറിച്ചുള്ള ആശയം ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: γονυπετῶν എന്ന പ്രവൃത്തിയുടെ സ്വഭാവം
  choice: അവന്റെ മുമ്പിൽ മുട്ടുകുത്തി
  alternative: അവന്റെ മുമ്പിൽ മുട്ടിന്മേൽ വീണു
  rationale: ഉറവിടം ശരീരഭാവം വ്യക്തമാക്കുന്നു, എന്നാൽ അതിനെ നിർബന്ധമായി ആരാധനയായി വ്യാഖ്യാനിക്കുന്നില്ല; അതിനാൽ നിഷ്പക്ഷമായ പ്രവൃത്തിവിവരണം തെരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ആവർത്തിക്കുന്ന αὐτός സർവനാമങ്ങളെ ഉറവിടത്തോട് ചേർന്ന് ‘അവൻ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു; മുൻസന്ദർഭം അത് യേശുവാണെന്ന് വ്യക്തമാക്കുന്നു.
