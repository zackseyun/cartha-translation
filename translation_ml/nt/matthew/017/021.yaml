source:
  edition: robinson-pierpont-2005-byzantine
  text: Τοῦτο δὲ τὸ γένος οὐκ ἐκπορεύεται εἰ μὴ ἐν προσευχῇ καὶ νηστείᾳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/021.yaml
  text: But[a] this kind does not come out except by prayer and fasting.
translation:
  language: ml
  text: എന്നാൽ[a] ഈ ഇനം പ്രാർത്ഥനയാലും ഉപവാസത്താലും അല്ലാതെ പുറത്തുപോകുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ വാക്യം ഏറ്റവും പഴക്കമുള്ള ഗ്രീക്ക് കൈയെഴുത്തുപ്രതികളിൽ—നാലാം നൂറ്റാണ്ടിലെ സീനായിറ്റിക്കസ്, വത്തിക്കാനസ് എന്നിവ ഉൾപ്പെടെ—കാണുന്നില്ല; പുരാതന സുറിയാനി, കോപ്റ്റിക് വിവർത്തനങ്ങളിലും ഇത് ഇല്ല. എന്നാൽ ബൈസാന്തിയൻ ഭൂരിപക്ഷപാഠപരമ്പരയിലും ലത്തീൻ പാരമ്പര്യത്തിലും മിക്ക സുറിയാനി സാക്ഷ്യങ്ങളിലും ഇത് കാണുന്നു. മർക്കോസ് 9:29-നോട് ഒത്തുചേർക്കാൻ പിൽക്കാല പകർപ്പെഴുത്തുകാർ ഇത് ചേർത്തതാകാം.
    reason: textual_critical
lexical_decisions:
- source_word: γένος
  choice: ഇനം
  rationale: സന്ദർഭത്തിൽ ഇത് ഭൂതങ്ങളുടെ ഒരു വിഭാഗത്തെയോ തരത്തെയോ സൂചിപ്പിക്കുന്നു; ആ അർഥം സ്വാഭാവികമായി നൽകുന്ന പദമാണ് ‘ഇനം’.
- source_word: ἐκπορεύεται
  choice: പുറത്തുപോകുന്നു
  rationale: ബാധിതനായ വ്യക്തിയിൽനിന്ന് ഭൂതം പുറത്താകുന്നതിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ക്രിയയുടെ ദിശാത്മക അർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: εἰ μὴ
  choice: അല്ലാതെ
  rationale: പ്രാർഥനയും ഉപവാസവും മാത്രമാണ് അപവാദമെന്ന് വ്യക്തമാക്കുന്ന exclusive പ്രയോഗത്തിന് മലയാളത്തിൽ സ്വാഭാവികമായ തുല്യരൂപം.
- source_word: προσευχῇ καὶ νηστείᾳ
  choice: പ്രാർഥനയാലും ഉപവാസത്താലും
  rationale: ἐν എന്ന ഉപസർഗത്തിന്റെ മാർഗം/സാധനം സൂചിപ്പിക്കുന്ന ഭാവം മലയാളത്തിലെ ‘-ആൽ’ രൂപത്തിലൂടെ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: ‘ഈ ഇനം’ എന്തിനെ സൂചിപ്പിക്കുന്നു
  choice: വാക്യത്തിൽ ഉള്ള പരോക്ഷസൂചന അതേപടി നിലനിർത്തി
  alternative: ‘ഈ ഇനം ഭൂതം’ എന്ന് വ്യക്തമാക്കുക
  rationale: ഗ്രീക്ക് മൂലത്തിൽ ‘ഭൂതം’ എന്ന നാമം ഈ വാക്യത്തിൽ പ്രത്യക്ഷമല്ല; സന്ദർഭം അതു സൂചിപ്പിച്ചാലും വിവർത്തനത്തിൽ അത് ചേർത്ത് മൂലത്തിലെ സംക്ഷിപ്തതയും പരോക്ഷതയും ഇല്ലാതാക്കിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘എന്നാൽ’ ഗ്രീക്കിലെ δέ-യുടെ ലഘുവായ വൈരുധ്യഭാവം നൽകുന്നു. ‘പ്രാർഥന’ എന്ന നിലവാരരൂപവും ‘ഉപവാസം’ എന്ന വ്യാപകമായി മനസ്സിലാകുന്ന പദവും ഉപയോഗിച്ചു.
