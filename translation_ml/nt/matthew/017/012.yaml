- from: 'എന്നാൽ ഞാൻ നിങ്ങളോടു പറയുന്നു: ഏലിയാവ് ഇതിനകം വന്നുകഴിഞ്ഞു. അവർ അദ്ദേഹത്തെ തിരിച്ചറിഞ്ഞില്ല[a]; പകരം, തങ്ങൾ ആഗ്രഹിച്ചതെല്ലാം അദ്ദേഹത്തോടു ചെയ്തു[b]. അതുപോലെതന്നെ മനുഷ്യപുത്രനും അവരുടെ കൈകളാൽ കഷ്ടം അനുഭവിക്കാനിരിക്കുകയാണ്[c].'
  to: 'എന്നാൽ ഞാൻ നിങ്ങളോടു പറയുന്നു: ഏലിയാവ് ഇതിനകം വന്നുകഴിഞ്ഞു. അവർ അദ്ദേഹത്തെ തിരിച്ചറിഞ്ഞില്ല[a]; പകരം, അദ്ദേഹത്തോട് തങ്ങൾ ആഗ്രഹിച്ചതെല്ലാം ചെയ്തു[b]. അതുപോലെതന്നെ മനുഷ്യപുത്രനും അവരാൽ കഷ്ടം അനുഭവിക്കാനിരിക്കുന്നു[c].'
