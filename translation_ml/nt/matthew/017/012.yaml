id: MAT.17.12
reference: Matthew 17:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι Ἠλίας ἤδη ἦλθεν, καὶ οὐκ ἐπέγνωσαν αὐτὸν ἀλλὰ ἐποίησαν ἐν αὐτῷ ὅσα ἠθέλησαν· οὕτως καὶ ὁ υἱὸς τοῦ ἀνθρώπου μέλλει πάσχειν ὑπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/012.yaml
  text: But I tell you that Elijah has already come[a], and they did not recognize him, but did to him whatever they wanted[c][b]. So also the Son of Man is about to suffer at their hands.
translation:
  language: ml
  text: 'എന്നാൽ ഞാൻ നിങ്ങളോടു പറയുന്നു: ഏലിയാവ് ഇതിനകം വന്നുകഴിഞ്ഞു. അവർ അദ്ദേഹത്തെ തിരിച്ചറിഞ്ഞില്ല[a]; പകരം, അദ്ദേഹത്തോട് തങ്ങൾ ആഗ്രഹിച്ചതെല്ലാം ചെയ്തു[b]. അതുപോലെതന്നെ മനുഷ്യപുത്രനും അവരാൽ കഷ്ടം അനുഭവിക്കാനിരിക്കുന്നു[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അദ്ദേഹത്തെ അറിഞ്ഞില്ല’ അല്ലെങ്കിൽ ‘അദ്ദേഹത്തെ അംഗീകരിച്ചില്ല.’ ഗ്രീക്ക് പദത്തിന് അദ്ദേഹത്തെ ശരിയായി തിരിച്ചറിയാതിരിക്കുക എന്ന അർഥം വരാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘തങ്ങൾക്കിഷ്ടമുള്ളവിധം അദ്ദേഹത്തോടു പെരുമാറി’ അല്ലെങ്കിൽ ‘തങ്ങൾ ആഗ്രഹിച്ചതെല്ലാം അദ്ദേഹത്തിനെതിരെ ചെയ്തു.’ ഈ ഗ്രീക്ക് പ്രയോഗം അദ്ദേഹത്തോടുള്ള അവരുടെ ഇഷ്ടാനുസൃതമായ നടപടിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘കഷ്ടം അനുഭവിക്കാൻ പോകുകയാണ്.’ ഗ്രീക്ക് പ്രയോഗം കഷ്ടാനുഭവം ആസന്നമാണെന്ന ഭാവം നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: എന്നാൽ ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: δέ മുൻപറഞ്ഞ പ്രതീക്ഷയോടുള്ള വ്യത്യാസം സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ എന്നു നൽകി; λέγω ... ὑμῖν എന്ന നേരിട്ടുള്ള പ്രസ്താവന സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Ἠλίας ἤδη ἦλθεν
  choice: ഏലിയാവ് ഇതിനകം വന്നുകഴിഞ്ഞു
  rationale: ἤδηയും aorist ἦλθενഉം സൂചിപ്പിക്കുന്ന, ഇപ്പോഴത്തെ പ്രസക്തിയുള്ള പൂർത്തിയായ വരവ് ‘വന്നുകഴിഞ്ഞു’ എന്ന പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: οὐκ ἐπέγνωσαν αὐτόν
  choice: അവർ അദ്ദേഹത്തെ തിരിച്ചറിഞ്ഞില്ല
  rationale: സന്ദർഭത്തിൽ ἐπιγινώσκω പരിചയമില്ലായ്മയേക്കാൾ അദ്ദേഹത്തിന്റെ വ്യക്തിത്വമോ പങ്കോ ശരിയായി തിരിച്ചറിയാതിരുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: ἐποίησαν ἐν αὐτῷ ὅσα ἠθέλησαν
  choice: തങ്ങൾ ആഗ്രഹിച്ചതെല്ലാം അദ്ദേഹത്തോടു ചെയ്തു
  rationale: ποιέω ἐν എന്ന ഗ്രീക്ക് പ്രയോഗം ഒരാളോടു പ്രവർത്തിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ὅσα ἠθέλησαν അവരുടെ ഇഷ്ടപ്രകാരമുള്ള നിയന്ത്രണമില്ലാത്ത നടപടിയെ വ്യക്തമാക്കുന്നു. സന്ദർഭത്തിലെ ശത്രുത നിലനിർത്തിക്കൊണ്ട് ഗ്രീക്കിനേക്കാൾ അധികമായി പ്രത്യേക പീഡനം ചേർക്കുന്നില്ല.
- source_word: οὕτως καὶ
  choice: അതുപോലെതന്നെ
  rationale: ഏലിയാവിനോടുണ്ടായതും മനുഷ്യപുത്രനോടുണ്ടാകാനിരിക്കുന്നതും തമ്മിലുള്ള സാദൃശ്യം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: ശീർഷകപ്രയോഗത്തിന്റെ സ്ഥാപിതമായ മലയാളരൂപം; അതിന്റെ തിരുവെഴുത്തുപരമായ അനുരണനം സംരക്ഷിക്കുന്നു.
- source_word: μέλλει πάσχειν
  choice: കഷ്ടം അനുഭവിക്കാനിരിക്കുകയാണ്
  rationale: μέλλω + infinitive സൂചിപ്പിക്കുന്ന ആസന്നമായ ഭാവിയെ നിലനിർത്തുന്നു; ഗ്രീക്ക് നേരിട്ട് പറയാത്ത ശക്തമായ വിധിനിർണയമോ നിർബന്ധമോ ചേർക്കുന്നില്ല.
- source_word: ὑπ’ αὐτῶν
  choice: അവരുടെ കൈകളാൽ
  rationale: ὑπό + genitive സൂചിപ്പിക്കുന്ന കർത്തൃത്വം, കഷ്ടാനുഭവത്തിന്റെ സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളശൈലിയിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ഏലിയാവിന്റെ വരവിന്റെ തിരിച്ചറിയൽ
  choice: വാക്യത്തിൽ ഉള്ളതുപോലെ ‘ഏലിയാവ്’ എന്നു മാത്രം നൽകി; യോഹന്നാൻ സ്നാപകനെന്ന തിരിച്ചറിയൽ മുഖ്യപാഠത്തിൽ ചേർത്തില്ല.
  alternative: ‘യോഹന്നാൻ സ്നാപകനായി ഏലിയാവ് വന്നുകഴിഞ്ഞു’ എന്ന വിശദീകരണപരമായ പരിഭാഷ.
  rationale: ഉടൻതുടരുന്ന സന്ദർഭം ആ തിരിച്ചറിയൽ വ്യക്തമാക്കുന്നുവെങ്കിലും ഈ വാക്യം തന്നെ ഏലിയാവിനെയാണ് പേരെടുത്തുപറയുന്നത്. അതിനാൽ വ്യാഖ്യാനം മുൻകൂട്ടി പാഠത്തിൽ ചേർക്കാതെ സന്ദർഭത്തിന് വിട്ടു.
- issue: മനുഷ്യപുത്രന്റെ കഷ്ടാനുഭവവുമായി ബന്ധപ്പെട്ട μέλλει എന്നതിന്റെ ബലം
  choice: ആസന്നമായ ഭാവിയെ സൂചിപ്പിക്കുന്ന ‘കഷ്ടം അനുഭവിക്കാനിരിക്കുകയാണ്’ എന്നു നൽകി.
  alternative: ‘കഷ്ടം അനുഭവിക്കാൻ വിധിക്കപ്പെട്ടിരിക്കുന്നു’ എന്ന ശക്തമായ ദൈവിക അനിവാര്യതാസൂചന.
  rationale: ഈ ഉപവാക്യം വരാനിരിക്കുന്ന കഷ്ടാനുഭവം പറയുന്നു; എന്നാൽ അതിന്റെ ദൈവശാസ്ത്രപരമായ അനിവാര്യതയെ ഇവിടെ നേരിട്ട് വിശദീകരിക്കുന്നില്ല. അതിനാൽ ഗ്രീക്കിലില്ലാത്ത ശക്തമായ നിർണയഭാവം ചേർത്തില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ദൈവിക/ബൈബിൾ ശീർഷകമായ ‘മനുഷ്യപുത്രൻ’ നിലനിർത്തി. ‘അദ്ദേഹം’ ആദരസൂചകമായി ഉപയോഗിച്ചെങ്കിലും വാക്യഘടന അമിതമായി ഔപചാരികമാക്കിയിട്ടില്ല. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
