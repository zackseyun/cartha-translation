source:
  edition: SBLGNT
  text: καὶ ἀκούσαντες οἱ μαθηταὶ ἔπεσαν ἐπὶ πρόσωπον αὐτῶν καὶ ἐφοβήθησαν σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/006.yaml
  text: And when the disciples heard it[c][b][a], they fell on their faces and were greatly afraid.
translation:
  language: ml
  text: ശിഷ്യന്മാർ അതു കേട്ടപ്പോൾ[a] കവിണ്ണുവീണു[b]; അവർ അത്യന്തം ഭയപ്പെട്ടു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കേട്ടശേഷം’; ഗ്രീക്കിലെ aorist participle കാലബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ ‘കേട്ടപ്പോൾ’ എന്നോ ‘കേട്ടശേഷം’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘അവരുടെ മുഖത്തേക്കു [വീണു]’; അതായത് മുഖം നിലത്താകുന്നവിധം വീണു.
    reason: lexical_alternative
  - marker: c
    text: അതായത് അവർ വളരെ തീവ്രമായി ഭയപ്പെട്ടു; ‘അത്യന്തം’ എന്നത് σφόδρα എന്ന ക്രിയാവിശേഷണത്തെ പരിഭാഷപ്പെടുത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: അതു കേട്ടപ്പോൾ
  rationale: നാമവിശേഷണരൂപത്തിലുള്ള ഗ്രീക്ക് aorist participle ഇവിടെ കാലസൂചനയായി സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തുന്നു. മുൻവാക്യത്തിലെ സ്വർഗീയശബ്ദമാണ് സൂചിത കർമം; അതിനാൽ ‘അതു’ ചേർക്കുന്നത് സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: οἱ μαθηταὶ
  choice: ശിഷ്യന്മാർ
  rationale: സുവിശേഷങ്ങളിലെ μαθηταί എന്ന പദത്തിന്റെ പതിവും സന്ദർഭോചിതവുമായ മലയാളരൂപം; ഇവിടെ യേശുവിന്റെ ശിഷ്യന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἔπεσαν ἐπὶ πρόσωπον αὐτῶν
  choice: കവിണ്ണുവീണു
  rationale: മുഖം നിലത്താകുന്നവിധം വീഴുക എന്ന ശരീരനില മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; ബോധക്ഷയമോ മനഃപൂർവമായ ആരാധനയോ പ്രത്യേകം ആരോപിക്കുന്നില്ല.
- source_word: ἐφοβήθησαν
  choice: ഭയപ്പെട്ടു
  rationale: φοβέομαι എന്ന ക്രിയയുടെ നേരിട്ടുള്ള, ആധുനികവും സ്വാഭാവികവുമായ മലയാളപരിഭാഷ.
- source_word: σφόδρα
  choice: അത്യന്തം
  rationale: ഭയത്തിന്റെ തീവ്രത വ്യക്തമാക്കുന്ന ശക്തമായ ക്രിയാവിശേഷണം; ഗൗരവമുള്ള ആഖ്യാനശൈലി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദൈവികശബ്ദത്തോടുള്ള ശിഷ്യന്മാരുടെ പ്രതികരണത്തിന്റെ സ്വഭാവം
  choice: മുഖം നിലത്താകുന്ന ശരീരനിലയും അതിതീവ്രമായ ഭയവും മാത്രം പ്രസ്താവിക്കുന്നു.
  alternative: ഇത് പ്രധാനമായും ആരാധനാപൂർവമായ ഭക്തിയെന്നോ പ്രധാനമായും ദൈവപ്രത്യക്ഷതയ്ക്കുമുന്നിലെ ഭീതിയെന്നോ വ്യാഖ്യാനിക്കാം.
  rationale: ഗ്രീക്ക് വാക്യം ശരീരനിലയും ഭയവും രേഖപ്പെടുത്തുന്നുവെങ്കിലും അതിനെ ആരാധന, ഭീകരത, ഭക്ത്യാദരഭയം എന്നിവയിൽ ഏതെങ്കിലും ഒന്നായി വ്യക്തമായി നിർവചിക്കുന്നില്ല. പരിഭാഷ ആ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘കവിണ്ണുവീണു’ ശരീരനില വ്യക്തമായി അറിയിക്കുമ്പോഴും ആരാധനയോ ഭീതിയോ എന്ന വ്യാഖ്യാനം മുൻകൂട്ടി നിർണയിക്കുന്നില്ല. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
