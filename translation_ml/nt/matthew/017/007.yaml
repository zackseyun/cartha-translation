id: MAT.17.7
reference: Matthew 17:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸂προσῆλθεν ὁ Ἰησοῦς καὶ ἁψάμενος αὐτῶν⸃ εἶπεν· Ἐγέρθητε καὶ μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/007.yaml
  text: And Jesus came near and touched them and said[a], “Get up[c][b], and do not be afraid.”
translation:
  language: ml
  text: 'യേശു അവരുടെ അടുത്തെത്തി, അവരെ തൊട്ട് പറഞ്ഞു: “എഴുന്നേൽക്കൂ; ഭയപ്പെടേണ്ടാ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσῆλθεν
  choice: അടുത്തെത്തി
  rationale: προσέρχομαι ഇവിടെ ശിഷ്യന്മാരുടെ അടുക്കലേക്കുള്ള യേശുവിന്റെ ചലനം സൂചിപ്പിക്കുന്നു. ‘അടുത്തെത്തി’ ആ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἁψάμενος αὐτῶν
  choice: അവരെ തൊട്ടുകൊണ്ട്
  rationale: ἅπτω എന്ന ക്രിയയുടെ പങ്കാളിത്തരൂപം ‘തൊടുക’ എന്ന അർഥത്തിലാണ്. ‘കൈവെച്ചു’ എന്നു പറയുന്നത് മൂലപാഠത്തിലില്ലാത്ത വിശദാംശം ചേർക്കുന്നതിനാൽ ഒഴിവാക്കി.
- source_word: εἶπεν
  choice: പറഞ്ഞു
  rationale: λέγωയുടെ സാധാരണവും നേരിട്ടുള്ളതുമായ മലയാള പരിഭാഷയാണ് ‘പറഞ്ഞു’.
- source_word: Ἐγέρθητε
  choice: എഴുന്നേൽക്കൂ
  rationale: നിലത്തു വീണുകിടന്ന ശിഷ്യന്മാരോട് എഴുന്നേൽക്കാനുള്ള കല്പനയാണിത്. അന്തിമ ശരീരനില അനാവശ്യമായി നിർവചിക്കാതെ സ്വാഭാവികമായി അർഥം നൽകുന്നു.
- source_word: μὴ φοβεῖσθε
  choice: ഭയപ്പെടേണ്ടാ
  rationale: φοβέομαιയുടെ ‘ഭയപ്പെടുക’ എന്ന അർഥം സ്വാഭാവികമായ ആശ്വാസകല്പനയായി നൽകുന്നു. ‘ഭയപ്പെടുന്നത് നിർത്തൂ’ എന്നത് വർത്തമാനകാല ആജ്ഞാരൂപത്തിന്റെ സാധ്യതയുള്ള തുടർച്ചാഭാവം ഇവിടെ അനാവശ്യമായി ശക്തമാക്കും.
- source_word: καὶ
  choice: ഉം / സംയോജനവും ക്രമവും
  rationale: ആവർത്തിച്ചുള്ള καί സംഭവങ്ങളുടെ ലളിതമായ ക്രമം ബന്ധിപ്പിക്കുന്നു. മലയാളത്തിലെ ക്രിയാവിന്യാസവും അർധവിരാമവും ഉപയോഗിച്ച് അധിക കാലസൂചന ചേർക്കാതെ ആ പ്രവാഹം നിലനിർത്തി.
theological_decisions:
- issue: യേശുവിന്റെ ആശ്വാസകരമായ ആജ്ഞയിൽ അധികമായ ഇടയപരിപാലനമോ ഉപദേശപരമായ വ്യാഖ്യാനമോ ചേർക്കാതിരിക്കുക
  choice: “എഴുന്നേൽക്കൂ; ഭയപ്പെടേണ്ടാ.”
  alternative: “എഴുന്നേറ്റുനിൽക്കൂ; ഭയപ്പെടുന്നത് നിർത്തൂ.”
  rationale: മൂലപാഠം യേശുവിന്റെ സമീപനം, സ്പർശം, നേരിട്ടുള്ള ആശ്വാസവചനം എന്നിവ ലളിതമായി അവതരിപ്പിക്കുന്നു. തെരഞ്ഞെടുത്ത പരിഭാഷ അന്തിമ ശരീരനിലയെയോ ഭയത്തിന്റെ ദൈർഘ്യത്തെയോ മൂലപാഠത്തേക്കാൾ കൂടുതൽ നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ ശൈലി. ഈ വാക്യത്തിന് പ്രസിദ്ധീകരണത്തിൽ അനിവാര്യമായ അർഥവ്യത്യാസം സൃഷ്ടിക്കുന്ന അടിക്കുറിപ്പ് ആവശ്യമില്ല.
