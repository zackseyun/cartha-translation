  to: 'എന്നിട്ട് ഇങ്ങനെ പറഞ്ഞു: “കർത്താവേ, എന്റെ മകനോടു കരുണ കാണിക്കണമേ. അവന് പിടിവലിവുകൾ ഉണ്ടാകുന്നു[a], അവൻ വളരെ കഠിനമായി കഷ്ടപ്പെടുകയും ചെയ്യുന്നു; കാരണം അവൻ പലപ്പോഴും തീയിലും പലപ്പോഴും വെള്ളത്തിലും വീഴുന്നു.”'
