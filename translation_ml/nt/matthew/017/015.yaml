id: MAT.17.15
reference: Matthew 17:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ λέγων· Κύριε, ἐλέησόν μου τὸν υἱόν, ὅτι σεληνιάζεται καὶ κακῶς ⸀πάσχει, πολλάκις γὰρ πίπτει εἰς τὸ πῦρ καὶ πολλάκις εἰς τὸ ὕδωρ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/015.yaml
  text: and saying[a], “Lord, have mercy on my son, because he is epileptic and suffers terribly; for he often falls into the fire and often into the water.”
translation:
  language: ml
  text: 'എന്നിട്ട് ഇങ്ങനെ പറഞ്ഞു: “കർത്താവേ, എന്റെ മകനോടു കരുണ കാണിക്കണമേ. അവന് പിടിവലിവുകൾ ഉണ്ടാകുന്നു[a], അവൻ വളരെ കഠിനമായി കഷ്ടപ്പെടുകയും ചെയ്യുന്നു; കാരണം അവൻ പലപ്പോഴും തീയിലും പലപ്പോഴും വെള്ളത്തിലും വീഴുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘ചന്ദ്രന്റെ സ്വാധീനത്തിലാണ്.’ പുരാതന പ്രയോഗത്തിൽ ഈ ഗ്രീക്ക് പദം പിടിവലിവുപോലുള്ള ഒരു അവസ്ഥയെ സൂചിപ്പിച്ചിരുന്നു; ‘അപസ്മാരബാധയുണ്ട്’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: പദത്തിന്റെ ചന്ദ്രബന്ധിതമായ അക്ഷരാർഥവും പുരാതന പ്രയോഗവും വ്യക്തമാക്കുന്നു; അതേസമയം മുഖ്യവാചകത്തിൽ ആധുനിക വൈദ്യനിർണയമോ ചന്ദ്രൻ കാരണമാണെന്ന വാദമോ ചുമത്തുന്നില്ല.
lexical_decisions:
- source_word: καὶ λέγων
  choice: എന്നിട്ട് ഇങ്ങനെ പറഞ്ഞു
  rationale: മുൻവാക്യത്തിലെ പ്രവൃത്തിയോടു ബന്ധിപ്പിക്കുന്ന καίയും വർത്തമാന കൃദന്തരൂപമായ λέγωνഉം സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലിയിൽ പ്രകടമാക്കുന്നു.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: യേശുവിനോടുള്ള ബഹുമാനപൂർവമായ സംബോധനയും κύριος എന്ന പദത്തിന്റെ പതിവായ തിരുവെഴുത്തുപ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: ἐλέησόν μου τὸν υἱόν
  choice: എന്റെ മകനോടു കരുണ കാണിക്കണമേ
  rationale: ἐλέησόν എന്ന സഹായം അഭ്യർഥിക്കുന്ന ഗൗരവമുള്ള അപേക്ഷയും υἱόν എന്നതിന്റെ വ്യക്തമായ ‘മകൻ’ എന്ന അർഥവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: σεληνιάζεται
  choice: അവനു കോച്ചിവലിവ് ഉണ്ടാകുന്നു
  rationale: പുരാതന ചന്ദ്രബന്ധിത പ്രയോഗത്തെ അക്ഷരാർഥത്തിൽ കാരണവ്യാഖ്യാനമാക്കാതെയും ആധുനിക വൈദ്യനിർണയം ചുമത്താതെയും കാണപ്പെടുന്ന seizure-like അവസ്ഥ വ്യക്തമാക്കുന്നു.
- source_word: κακῶς πάσχει
  choice: അവൻ അതികഠിനമായി കഷ്ടപ്പെടുന്നു
  rationale: κακῶς നൽകുന്ന തീവ്രതയും πάσχει എന്ന അനുഭവിക്കുന്ന കഷ്ടതയും വ്യക്തവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ കൈമാറുന്നു.
- source_word: πολλάκις γὰρ πίπτει εἰς τὸ πῦρ καὶ πολλάκις εἰς τὸ ὕδωρ
  choice: അവൻ പലപ്പോഴും തീയിലും പലപ്പോഴും വെള്ളത്തിലും വീഴുന്നു
  rationale: πολλάκις എന്ന ആവർത്തനം രണ്ടിടത്തും നിലനിർത്തുകയും തീയും വെള്ളവും തമ്മിലുള്ള ഗ്രീക്ക് സമാന്തരഘടന സംക്ഷിപ്തമായി പുനരാവിഷ്കരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: സൗഖ്യപ്പെടുത്തൽ/ഭൂതോച്ചാടന പശ്ചാത്തലത്തിലെ σεληνιάζεται എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: കാണപ്പെടുന്ന ലക്ഷണത്തെ സൂചിപ്പിക്കുന്ന ‘കോച്ചിവലിവ് ഉണ്ടാകുന്നു’
  alternative: ‘അപസ്മാരബാധയുണ്ട്’ അല്ലെങ്കിൽ അക്ഷരാർഥത്തിൽ ‘ചന്ദ്രബാധയുണ്ട്’
  rationale: ഈ വാക്യത്തിൽ പിതാവ് മകന്റെ അവസ്ഥ വിവരിക്കുകയാണ്; കൃത്യമായ ആധുനിക വൈദ്യനിർണയമോ ചന്ദ്രൻ കാരണമാണെന്ന അംഗീകാരമോ ഇവിടെ നൽകുന്നില്ല. അതിനാൽ ലക്ഷണാധിഷ്ഠിത വിവർത്തനം മൂലപാഠത്തിലെ പരിധിയും തുടർന്നുള്ള സന്ദർഭത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും അനാവശ്യമായി തീർപ്പാക്കാതെ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന, എന്നാൽ പ്രാർഥനയുടെ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. ‘കരുണ കാണിക്കണമേ’ എന്ന വിനയപൂർവമായ രൂപവും ആവർത്തിച്ചുള്ള ‘പലപ്പോഴും’ എന്ന ഘടനയും മൂലത്തിന്റെ ഭാവവും ഊന്നലും സംരക്ഷിക്കുന്നു.
