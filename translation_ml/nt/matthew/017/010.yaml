id: MAT.17.10
reference: Matthew 17:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐπηρώτησαν αὐτὸν οἱ ⸀μαθηταὶ λέγοντες· Τί οὖν οἱ γραμματεῖς λέγουσιν ὅτι Ἠλίαν δεῖ ἐλθεῖν πρῶτον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/010.yaml
  text: And the disciples asked him, saying, “Why then do the scribes say that Elijah must come first?”
translation:
  language: ml
  text: 'ശിഷ്യന്മാർ അവനോടു ചോദിച്ചു: “അങ്ങനെയെങ്കിൽ, ഏലിയാവ് ആദ്യം വരേണ്ടതാണെന്ന് ശാസ്ത്രിമാർ പറയുന്നത് എന്തുകൊണ്ട്?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτησαν
  choice: ചോദിച്ചു
  rationale: നേരിട്ടുള്ള ചോദ്യം അവതരിപ്പിക്കുന്ന ഭൂതകാല ക്രിയയ്ക്ക് സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: οἱ μαθηταὶ
  choice: ശിഷ്യന്മാർ
  rationale: സന്ദർഭത്തിൽ ഇതിനകം അറിയപ്പെടുന്ന നിശ്ചിത സംഘത്തെ സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത ‘അവന്റെ’ ചേർത്തിട്ടില്ല.
- source_word: λέγοντες
  choice: 'ചോദിച്ചു:'
  rationale: ഗ്രീക്കിലെ പങ്കുപദം ചോദ്യത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു. ‘എന്നു പറഞ്ഞുകൊണ്ട്’ എന്ന അക്ഷരാർഥരൂപത്തേക്കാൾ മലയാളത്തിൽ കോളനോടുകൂടിയ നേരിട്ടുള്ള ചോദ്യം സ്വാഭാവികമാണ്; ചോദിക്കുന്ന പ്രവൃത്തി പ്രധാനക്രിയയിൽ നിലനിൽക്കുന്നു.
- source_word: Τί οὖν
  choice: അങ്ങനെയെങ്കിൽ ... എന്തുകൊണ്ട്?
  rationale: ഇവിടെ τί കാരണം ചോദിക്കുന്ന പ്രയോഗമാണ്; οὖν മുൻസന്ദർഭത്തിൽനിന്നുള്ള നിഗമനബന്ധം സൂചിപ്പിക്കുന്നു.
- source_word: οἱ γραμματεῖς
  choice: ശാസ്ത്രിമാർ
  rationale: യഹൂദ തിരുവെഴുത്തുകളിലും ന്യായപ്രമാണത്തിലും പ്രാവീണ്യമുള്ള γραμματεῖς എന്ന സംഘത്തിനുള്ള സ്ഥാപിതവും സംക്ഷിപ്തവുമായ മലയാളപദം.
- source_word: λέγουσιν ὅτι
  choice: '...എന്ന് ... പറയുന്നത്'
  rationale: വർത്തമാനകാല പ്രസ്താവനയും അതിന്റെ ഉള്ളടക്കവും മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: Ἠλίαν
  choice: ഏലിയാവ്
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാള ബൈബിൾപാരമ്പര്യത്തിൽ സുപരിചിതമായ ലിപ്യന്തരണം.
- source_word: δεῖ ἐλθεῖν
  choice: വരേണ്ടതാണ്
  rationale: δεῖ സൂചിപ്പിക്കുന്ന അനിവാര്യത വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: πρῶτον
  choice: ആദ്യം
  rationale: സംഭവക്രമത്തിലെ മുൻഗണന നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഏലിയാവിന്റെ വരവിനെക്കുറിച്ചുള്ള ശാസ്ത്രിമാരുടെ ഉപദേശത്തോടുള്ള ചോദ്യത്തിന്റെ നിലപാട്
  choice: ശാസ്ത്രിമാരുടെ വാദം അംഗീകരിക്കുന്നതോ ചോദ്യംചെയ്യുന്നതോ ഭാഗികമായി തിരുത്തുന്നതോ എന്ന് ഈ വാക്യത്തിൽ തീരുമാനിക്കാതെ ചോദ്യം അതേപടി നിലനിർത്തി.
  alternative: ചോദ്യത്തിൽ ശാസ്ത്രിമാരോടുള്ള സംശയം ശക്തമായി സൂചിപ്പിക്കുകയോ മലാഖി പ്രവചനത്തിന്റെ പശ്ചാത്തലം വാക്യത്തിൽ വിശദീകരിച്ചുചേർക്കുകയോ ചെയ്യാം.
  rationale: തുടർന്നുള്ള വാക്യങ്ങളിലെ യേശുവിന്റെ മറുപടി മുൻകൂട്ടി ചേർക്കാതെ മൂലവാക്യത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും അവ്യക്തതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ശാസ്ത്രിമാർ’ എന്ന സ്ഥാപിത ബൈബിൾപദം നിലനിർത്തിയെങ്കിലും വാക്യഘടന സംസാരഭാഷാസ്വാഭാവികതയോട് ചേർത്തിരിക്കുന്നു.
