source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ⸀ὤφθη αὐτοῖς Μωϋσῆς καὶ Ἠλίας ⸂συλλαλοῦντες μετ’ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/003.yaml
  text: And behold[a], Moses and Elijah appeared to them, talking with him.
translation:
  language: ml
  text: അപ്പോൾ ഇതാ[a], മോശെയും ഏലിയാവും അവർക്കു പ്രത്യക്ഷരായി; അവർ അവനോടു സംസാരിച്ചുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അവർ അവർക്കു കാണപ്പെട്ടു.’ ഗ്രീക്ക് ക്രിയ വ്യാകരണപരമായി പാസീവ് രൂപത്തിലാണ്; എന്നാൽ മലയാളത്തിൽ ‘പ്രത്യക്ഷരായി’ എന്നതാണ് കൂടുതൽ സ്വാഭാവികം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും സംഭവത്തിന്റെ പെട്ടെന്നുള്ള ദൃശ്യതയും സജീവതയും നിലനിർത്തുകയും ചെയ്യുന്ന സ്വാഭാവികമായ ആധുനിക മലയാള പ്രയോഗം.
- source_word: ὤφθη
  choice: പ്രത്യക്ഷരായി
  rationale: ὁράω എന്ന ക്രിയയുടെ ഔറിസ്റ്റ് പാസീവ് രൂപം ഇവിടെ ദൃശ്യമായി വെളിപ്പെടുക എന്ന അർഥത്തിൽ സ്വാഭാവികമായി ഉപയോഗിച്ചിരിക്കുന്നു; മലയാളത്തിൽ ‘പ്രത്യക്ഷരായി’ സംഭവം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: αὐτοῖς
  choice: അവർക്കു
  rationale: പ്രത്യക്ഷത കണ്ട സാക്ഷികളെ സൂചിപ്പിക്കുന്ന ദാതൃവിഭക്തിയുടെ നേരിട്ടുള്ള മലയാള രൂപം.
- source_word: Μωϋσῆς
  choice: മോശെ
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ സുപരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: Ἠλίας
  choice: ഏലിയാവ്
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ സുപരിചിതമായ വ്യക്തിനാമരൂപം; വാക്യത്തിൽ ‘ഏലിയാവും’ എന്നായി വിഭക്തിചേർത്ത് ഉപയോഗിക്കുന്നു.
- source_word: συλλαλοῦντες
  choice: സംസാരിച്ചുകൊണ്ടിരുന്നു
  rationale: പരസ്പരം സംസാരിക്കുക എന്ന പങ്കാളിത്ത അർഥവും, പ്രത്യക്ഷതയോടൊപ്പം നടന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയെന്ന പങ്കുവഹിക്കുന്ന ക്രിയാരൂപത്തിന്റെ സ്വഭാവവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: μετ’ αὐτοῦ
  choice: അവനോടു
  rationale: μετά + ജനിറ്റീവ് സൂചിപ്പിക്കുന്ന സഹവർത്തിത്വം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; സന്ദർഭത്തിൽ സർവനാമം യേശുവിനെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: αὐτοῦ എന്ന സർവനാമത്തിന്റെ സൂചിതൻ
  choice: ‘അവൻ’ എന്നത് സന്ദർഭത്തിൽ യേശുവിനെ സൂചിപ്പിക്കുന്നു
  alternative: സർവനാമത്തിനു പകരം ‘യേശുവിനോടു’ എന്നു വ്യക്തമാക്കുക
  rationale: രൂപാന്തരീകരണത്തിന്റെ സമീപസന്ദർഭം സൂചിതനെ വ്യക്തമാക്കുന്നു. എങ്കിലും ഗ്രീക്കിലെ സർവനാമം നിലനിർത്തി വ്യാഖ്യാനപരമായ പകരംവെപ്പ് ഒഴിവാക്കുന്നു.
- issue: മോശെയുടെയും ഏലിയാവിന്റെയും പ്രത്യക്ഷതയുടെ സ്വഭാവം
  choice: അവർ ദൃശ്യമായി പ്രത്യക്ഷപ്പെട്ടു എന്ന കഥനവാദം മാത്രം നിലനിർത്തുന്നു
  alternative: ‘അവർ അവരാൽ കാണപ്പെട്ടു’ എന്നു ഔപചാരിക പാസീവായി വിവർത്തനം ചെയ്യുക
  rationale: വാക്യം അവരുടെ ദൃശ്യപ്രത്യക്ഷത പറയുന്നു; ആ സാന്നിധ്യത്തിന്റെ രീതി സംബന്ധിച്ച അധിക ദൈവശാസ്ത്ര വിശദീകരണം മൂലപാഠത്തിൽ ഇല്ലാത്തതിനാൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ‘ഇതാ’ ശ്രദ്ധാകർഷക ഘടകം നിലനിർത്തുന്നു; വ്യക്തിനാമങ്ങൾക്ക് മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപങ്ങൾ ഉപയോഗിച്ചു.
