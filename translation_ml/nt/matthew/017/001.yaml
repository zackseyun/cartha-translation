id: MAT.17.1
reference: Matthew 17:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ μεθ’ ἡμέρας ἓξ παραλαμβάνει ὁ Ἰησοῦς τὸν Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην τὸν ἀδελφὸν αὐτοῦ, καὶ ἀναφέρει αὐτοὺς εἰς ὄρος ὑψηλὸν κατ’ ἰδίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/001.yaml
  text: And after six days Jesus takes Peter[a], James, and John his brother[c][b], and leads them up onto a high mountain by themselves.
translation:
  language: ml
  text: ആറു ദിവസം കഴിഞ്ഞ് യേശു പത്രോസിനെയും യാക്കോബിനെയും അവന്റെ സഹോദരനായ യോഹന്നാനെയും കൂട്ടിക്കൊണ്ട്, അവരെ വേറിട്ടു ഒരു ഉയർന്ന മലയിലേക്കു കയറ്റിക്കൊണ്ടുപോകുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεθ’ ἡμέρας ἓξ
  choice: ആറു ദിവസം കഴിഞ്ഞ്
  rationale: μετά + accusative സൂചിപ്പിക്കുന്ന കാലാനന്തരബന്ധം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായും മൂലവാചകത്തോട് അടുത്തും അവതരിപ്പിക്കുന്നു.
- source_word: παραλαμβάνει
  choice: കൂട്ടിക്കൊണ്ട്
  rationale: ഒരാളെ തന്നോടൊപ്പം കൊണ്ടുപോകുക എന്ന παραλαμβάνωയുടെ അർഥം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; തുടർന്നുള്ള ἀναφέρειയുമായി അനാവശ്യ ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην
  choice: പത്രോസിനെയും യാക്കോബിനെയും ... യോഹന്നാനെയും
  rationale: മലയാള ബൈബിൾ വായനയിൽ സ്ഥാപിതവും തിരിച്ചറിയാവുന്നതുമായ പേരുരൂപങ്ങൾ ഉപയോഗിക്കുന്നു.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: അവന്റെ സഹോദരനായ
  rationale: ഗ്രീക്കിലെ ഏകവചന സർവനാമരൂപം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ യാക്കോബിന്റെ സഹോദരനായ യോഹന്നാനെയാണ് സ്വാഭാവികമായി വിശേഷിപ്പിക്കുന്നത്, എങ്കിലും സർവനാമത്തെ പേരിട്ട് വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: ἀναφέρει
  choice: കയറ്റിക്കൊണ്ടുപോകുന്നു
  rationale: മുകളിലേക്കുള്ള ചലനവും ലക്ഷ്യസ്ഥാനത്തേക്കു നയിക്കുന്നതും ഒരുമിച്ച് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: εἰς ὄρος ὑψηλὸν
  choice: ഒരു ഉയർന്ന മലയിലേക്ക്
  rationale: εἰς സൂചിപ്പിക്കുന്ന ലക്ഷ്യസ്ഥാനവും ὑψηλόν സൂചിപ്പിക്കുന്ന ഉയരവും നേരിട്ട് നൽകുന്നു.
- source_word: κατ’ ἰδίαν
  choice: അവരെ മാത്രം
  rationale: മറ്റുള്ളവരിൽനിന്ന് വേർതിരിച്ച് ഈ മൂന്നു ശിഷ്യന്മാരെ മാത്രമാണ് യേശു കൊണ്ടുപോയത് എന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു; യേശു അവരോടൊപ്പം ഇല്ലെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: സുവിശേഷകഥനത്തിലെ ചരിത്രവർത്തമാനകാലം
  choice: ‘കൂട്ടിക്കൊണ്ട് ... കയറ്റിക്കൊണ്ടുപോകുന്നു’ എന്ന വർത്തമാനകാല കഥനരൂപം നിലനിർത്തി
  alternative: ‘കൂട്ടിക്കൊണ്ട് ... കയറ്റിക്കൊണ്ടുപോയി’ എന്ന ഭൂതകാലരൂപം
  rationale: παραλαμβάνει, ἀναφέρει എന്നീ ഗ്രീക്ക് വർത്തമാനകാല ക്രിയകളുടെ കഥനസജീവത മലയാളത്തിലും ഗ്രാഹ്യമായി നിലനിർത്താം.
- issue: τὸν ἀδελφὸν αὐτοῦയിലെ സർവനാമബന്ധം
  choice: ‘അവന്റെ സഹോദരനായ യോഹന്നാൻ’ എന്ന മൂലരൂപത്തോട് അടുത്ത ഘടന
  alternative: ‘യാക്കോബിന്റെ സഹോദരനായ യോഹന്നാൻ’ എന്ന് ബന്ധം വ്യക്തമാക്കുക
  rationale: സന്ദർഭം യാക്കോബിനെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിലും, αὐτοῦ എന്ന സർവനാമത്തെ നേരിട്ട് ‘യാക്കോബിന്റെ’ എന്നു മാറ്റാതെ മൂലത്തിലെ രൂപപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ദീർഘമായ ഗ്രീക്ക് വാക്യത്തിന്റെ പ്രവാഹം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ കർമവിഭക്തിയും ക്രിയാസംയോജനവും സ്വാഭാവികമാക്കി.
