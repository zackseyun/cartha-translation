id: MAT.11.9
reference: Matthew 11:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλὰ τί ἐξήλθατε⸂; προφήτην ἰδεῖν⸃; ναί, λέγω ὑμῖν, καὶ περισσότερον προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/009.yaml
  text: But what did you go out to see? A prophet? Yes[a], I tell you, and more than a prophet.
translation:
  language: ml
  text: എന്നാൽ നിങ്ങൾ എന്തു കാണാനാണ് പുറപ്പെട്ടുപോയത്? ഒരു പ്രവാചകനെയോ? അതെ, ഞാൻ നിങ്ങളോടു പറയുന്നു, ഒരു പ്രവാചകനേക്കാൾ അധികമായ ഒരാളെ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരു പ്രവാചകനേക്കാൾ വലിയ ഒരാളെ.’ ഗ്രീക്കിൽ കൂടുതൽ അക്ഷരാർഥമായി ‘ഒരു പ്രവാചകനേക്കാൾ അധികം’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: എന്നാൽ
  rationale: മുമ്പുള്ള അലങ്കാരചോദ്യങ്ങളോടുള്ള വൈരുധ്യം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ അടയാളപ്പെടുത്തുന്നു.
- source_word: τί ἐξήλθατε
  choice: നിങ്ങൾ എന്തു കാണാനാണ് പുറപ്പെട്ടുപോയത്
  rationale: τί എന്നത് ‘എന്ത്’ എന്ന കർമസംബന്ധമായ ചോദ്യം തന്നെയാണ്; ‘എന്തിനാണ്’ എന്ന് കാരണചോദ്യമാക്കി മാറ്റാതെ, പിന്നാലെയുള്ള ഉദ്ദേശ്യസൂചകമായ ἰδεῖν-നോടു ചേർത്ത് സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἰδεῖν
  choice: കാണാൻ
  rationale: ἐξήλθατε-നു പിന്നാലെയുള്ള ഉദ്ദേശ്യാർഥക ക്രിയാരൂപത്തിന്റെ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: προφήτην
  choice: ഒരു പ്രവാചകനെ
  rationale: ആർട്ടിക്കിൾ ഇല്ലാത്ത ഏകവചന നാമം ഈ അലങ്കാരചോദ്യത്തിൽ അനിശ്ചിതരൂപത്തിൽ സ്വാഭാവികമാണ്.
- source_word: ναί
  choice: അതെ
  rationale: മുൻചോദ്യത്തിനുള്ള നേരിട്ടുള്ള ഉറപ്പായ മറുപടി ലളിതമായി നിലനിർത്തുന്നു.
- source_word: λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: ഗ്രീക്കിലെ സാധാരണ പ്രഭാഷണസൂത്രം മാന്യവും സ്വാഭാവികവുമായ മലയാളത്തിൽ അടുത്തായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: καὶ περισσότερον προφήτου
  choice: ഒരു പ്രവാചകനിലുമധികമായവനെ
  rationale: താരതമ്യജനിറ്റീവിന്റെ ‘ഒരു പ്രവാചകനേക്കാൾ കൂടുതൽ’ എന്ന അർഥം നിലനിർത്തുകയും മലയാളത്തിൽ വാക്യം പൂർത്തിയാക്കാൻ സന്ദർഭത്തിൽ സൂചിതമായ വ്യക്തിയെ ‘-വനെ’ എന്ന രൂപത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു; അധികമായിരിക്കുന്നത് എങ്ങനെ എന്നത് വിശദീകരിക്കുന്നില്ല.
theological_decisions:
- issue: യോഹന്നാൻ സ്നാപകന്റെ പ്രവാചകസ്ഥാനത്തേക്കാൾ ഉയർന്ന പദവി
  choice: ഒരു പ്രവാചകനിലുമധികമായവനെ
  alternative: ഒരു പ്രവാചകനേക്കാൾ വലിയവനെ
  rationale: വാക്യം യോഹന്നാനെ പ്രവാചകൻ എന്ന വിഭാഗത്തിനു മീതെ ഉയർത്തുന്നു; എന്നാൽ ഏതു വിധത്തിലാണ് എന്ന് ഈ ഉപവാക്യം പറയുന്നില്ല. ‘അധികമായവൻ’ എന്ന ഭാഷ ഗ്രീക്കിലെ περισσότερον എന്നതിന്റെ തുറന്ന അർഥവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. അലങ്കാരചോദ്യങ്ങളുടെ താളം നിലനിർത്തിയിരിക്കുന്നു; വ്യാഖ്യാനപരമായ ദൈവശാസ്ത്രവികാസം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
