id: MAT.11.1
reference: Matthew 11:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς διατάσσων τοῖς δώδεκα μαθηταῖς αὐτοῦ, μετέβη ἐκεῖθεν τοῦ διδάσκειν καὶ κηρύσσειν ἐν ταῖς πόλεσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/001.yaml
  text: And when Jesus had finished instructing his twelve disciples[b][a], he went on from there to teach and preach in their cities.
translation:
  language: ml
  text: യേശു തന്റെ പന്ത്രണ്ട് ശിഷ്യന്മാർക്ക് നിർദേശങ്ങൾ നൽകിക്കഴിഞ്ഞപ്പോൾ[a], അവിടെനിന്ന് അവരുടെ പട്ടണങ്ങളിൽ[b] പഠിപ്പിക്കാനും പ്രസംഗിക്കാനും പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തന്റെ പന്ത്രണ്ട് ശിഷ്യന്മാർക്ക് ആജ്ഞകൾ നൽകിക്കഴിഞ്ഞപ്പോൾ.’
    reason: lexical_alternative
  - marker: b
    text: ‘അവരുടെ പട്ടണങ്ങൾ’ എന്ന ഗ്രീക്ക് പ്രയോഗം ആരുടെ പട്ടണങ്ങളാണെന്ന് വ്യക്തമാക്കുന്നില്ല; അത് ശിഷ്യന്മാരുടെ പട്ടണങ്ങളെയോ പൊതുവായി ചുറ്റുമുള്ള ജനങ്ങളുടെ പട്ടണങ്ങളെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: …കഴിഞ്ഞപ്പോൾ
  rationale: മത്തായിയുടെ സെമിറ്റിക് സ്വഭാവമുള്ള ഈ ആഖ്യാനസൂത്രം ഇവിടെ സമയബന്ധവും അടുത്ത സംഭവത്തിലേക്കുള്ള മാറ്റവും സൂചിപ്പിക്കുന്നു. ‘അപ്പോൾ സംഭവിച്ചത്’ എന്ന അക്ഷരാർഥരൂപത്തേക്കാൾ ഈ മലയാളപ്രയോഗം സ്വാഭാവികമാണ്.
- source_word: ἐτέλεσεν
  choice: നൽകിക്കഴിഞ്ഞപ്പോൾ
  rationale: തുടർന്നുള്ള പ്രവൃത്തിക്കുമുമ്പ് നിർദേശങ്ങൾ പൂർത്തിയായതായി സന്ദർഭം സൂചിപ്പിക്കുന്നു; ‘കഴിഞ്ഞപ്പോൾ’ ആ മുൻകാലപൂർത്തീകരണം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: διατάσσων
  choice: നിർദേശങ്ങൾ നൽകുക
  rationale: പദം അധികാരപൂർവമായ നിർദേശമോ ആജ്ഞയോ നൽകുന്നതിനെ സൂചിപ്പിക്കുന്നു. പ്രസംഗസന്ദർഭത്തിൽ ‘നിർദേശങ്ങൾ നൽകുക’ സ്വാഭാവികമാണ്; ‘ആജ്ഞകൾ നൽകുക’ എന്ന ശക്തമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: τοῖς δώδεκα μαθηταῖς αὐτοῦ
  choice: തന്റെ പന്ത്രണ്ട് ശിഷ്യന്മാർക്ക്
  rationale: μαθηταί എന്നതിന് സുവിശേഷസന്ദർഭത്തിൽ സ്ഥാപിതവും കൃത്യവുമായ മലയാളപദം ‘ശിഷ്യന്മാർ’ ആണ്; ഉടമസ്ഥബന്ധവും പന്ത്രണ്ട് എന്ന സംഖ്യയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: μετέβη ἐκεῖθεν
  choice: അവിടെനിന്ന് … പോയി
  rationale: ഒരു സ്ഥലത്തുനിന്ന് മറ്റൊരിടത്തേക്കുള്ള നീക്കത്തെയും ആഖ്യാനത്തിന്റെ തുടർച്ചയെയും ലളിതമായ ആധുനിക മലയാളത്തിൽ പകർത്തുന്നു.
- source_word: τοῦ διδάσκειν καὶ κηρύσσειν
  choice: പഠിപ്പിക്കാനും പ്രസംഗിക്കാനും
  rationale: ആർട്ടിക്കുലർ ഇൻഫിനിറ്റീവുകൾ ഉദ്ദേശ്യം പ്രകടിപ്പിക്കുന്നു. രണ്ട് വ്യത്യസ്ത പ്രവർത്തനങ്ങളും മലയാളത്തിൽ വേർതിരിച്ച് നിലനിർത്തുന്നു.
- source_word: ἐν ταῖς πόλεσιν αὐτῶν
  choice: അവരുടെ പട്ടണങ്ങളിൽ
  rationale: πόλις സന്ദർഭമനുസരിച്ച് നഗരമോ പട്ടണമോ ആകാം; ഗലീലാസന്ദർഭത്തിൽ ‘പട്ടണങ്ങൾ’ സ്വാഭാവികമാണ്. αὐτῶν എന്ന സർവനാമത്തിന്റെ അവ്യക്തമായ സൂചന ‘അവരുടെ’ എന്നതിലൂടെ പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἐν ταῖς πόλεσιν αὐτῶν എന്നതിലെ αὐτῶν ആരെ സൂചിപ്പിക്കുന്നു
  choice: ‘അവരുടെ പട്ടണങ്ങളിൽ’ എന്ന് അവ്യക്തത നിലനിർത്തുക
  alternative: ‘ശിഷ്യന്മാരുടെ പട്ടണങ്ങളിൽ’ അല്ലെങ്കിൽ ‘ആ പ്രദേശത്തെ പട്ടണങ്ങളിൽ’ എന്ന് വ്യക്തീകരിക്കുക
  rationale: ഗ്രീക്ക് സർവനാമം ആരെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് വാക്യം തുറന്നുപറയുന്നില്ല. ശിഷ്യന്മാരുടെ പട്ടണങ്ങളെയോ ചുറ്റുമുള്ള ജനങ്ങളുടെ/പ്രദേശത്തിന്റെ പട്ടണങ്ങളെയോ സൂചിപ്പിക്കാം; വിവർത്തനം ഒരു വ്യാഖ്യാനം നിർബന്ധമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘പഠിപ്പിക്കുക’, ‘പ്രസംഗിക്കുക’, ‘ശിഷ്യന്മാർ’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന ലളിതമാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
