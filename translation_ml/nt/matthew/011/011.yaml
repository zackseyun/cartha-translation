id: MAT.11.11
reference: Matthew 11:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, οὐκ ἐγήγερται ἐν γεννητοῖς γυναικῶν μείζων Ἰωάννου τοῦ βαπτιστοῦ· ὁ δὲ μικρότερος ἐν τῇ βασιλείᾳ τῶν οὐρανῶν μείζων αὐτοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/011.yaml
  text: Truly I say to you[a], among those born of women no one greater than John the Baptist has arisen[c][b]; yet the least in the kingdom of heaven is greater than he.
translation:
  language: ml
  text: '“സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: സ്ത്രീകളിൽ നിന്ന് ജനിച്ചവരിൽ[b] സ്നാപകനായ യോഹന്നാനെക്കാൾ വലിയവൻ ആരും ഉയർന്നുവന്നിട്ടില്ല.[a] എങ്കിലും സ്വർഗരാജ്യത്തിലെ ഏറ്റവും ചെറിയവൻ[c] അവനെക്കാൾ വലിയവനാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എഴുന്നേൽപ്പിക്കപ്പെട്ടിട്ടില്ല.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘ഉയർന്നുവന്നു’ എന്നും ‘എഴുന്നേൽപ്പിക്കപ്പെട്ടു’ എന്നും അർഥമാകാം; ഇവിടെ പുനരുത്ഥാനത്തെയല്ല, ചരിത്രരംഗത്ത് പ്രത്യക്ഷപ്പെടുന്നതിനെയാണു മിക്കവാറും സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘സ്ത്രീകളിൽ നിന്ന് ജനിച്ചവർ’ എന്നത് മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്ന ഒരു സെമിറ്റിക് പ്രയോഗമാണ്.
    reason: cultural_note
  - marker: c
    text: അഥവാ, ‘കുറഞ്ഞവൻ’ / ‘ചെറിയവൻ.’ ഗ്രീക്കിൽ താരതമ്യരൂപമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; ഇവിടെ സ്വർഗരാജ്യത്തിൽ ഏറ്റവും കുറഞ്ഞ സ്ഥാനമോ പദവിയോ ഉള്ളവൻ എന്ന അർഥമാണു സാധ്യതയേറിയത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: സത്യമായി
  rationale: ഗൗരവവും അധികാരവും നിറഞ്ഞ പ്രസ്താവനയ്ക്ക് തുടക്കം കുറിക്കുന്ന പദം. ‘ആമേൻ’ എന്ന ലിപ്യന്തരണത്തേക്കാൾ ആധുനിക മലയാളത്തിൽ അർഥം നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: മൂലത്തിലെ നേരിട്ടുള്ള പ്രസംഗസൂത്രം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: οὐκ ἐγήγερται
  choice: ആരും ഉയർന്നുവന്നിട്ടില്ല
  rationale: ചരിത്രരംഗത്ത് ഒരാൾ ഉദയംചെയ്യുക അഥവാ പ്രത്യക്ഷപ്പെടുക എന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; പുനരുത്ഥാനമെന്ന അർഥത്തിലേക്ക് അനാവശ്യമായി ചുരുക്കുന്നില്ല. ക്രിയയുടെ സാധ്യതയുള്ള മറ്റൊരു വായന അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἐν γεννητοῖς γυναικῶν
  choice: സ്ത്രീകളിൽനിന്നു ജനിച്ചവരിൽ
  rationale: മനുഷ്യരെ സൂചിപ്പിക്കുന്ന സെമിറ്റിക് പ്രയോഗത്തിന്റെ ദൃശ്യഭാഷ സംരക്ഷിക്കുന്നു; അതിന്റെ സാംസ്കാരിക അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: μείζων Ἰωάννου τοῦ βαπτιστοῦ
  choice: സ്നാപകനായ യോഹന്നാനെക്കാൾ വലിയവൻ
  rationale: താരതമ്യഘടന വ്യക്തവും സ്വാഭാവികവുമായി പുനരാവിഷ്കരിക്കുന്നു. ‘സ്നാപകൻ’ മലയാള ബൈബിൾഭാഷയിൽ തിരിച്ചറിയപ്പെടുന്ന സ്ഥാനപ്പേരാണ്.
- source_word: ὁ δὲ μικρότερος
  choice: എങ്കിലും ... ഏറ്റവും ചെറിയവൻ
  rationale: രൂപത്തിൽ താരതമ്യപദമായ μικρότερος ഇവിടെ രാജ്യത്തിലെ ഏറ്റവും കുറഞ്ഞ സ്ഥാനമോ പദവിയോ ഉള്ളവനെ സൂചിപ്പിക്കാം. സ്വാഭാവിക മലയാളത്തിനായി ‘ഏറ്റവും ചെറിയവൻ’ ഉപയോഗിച്ച് രൂപപരമായ സാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: സ്വർഗരാജ്യത്തിലെ
  rationale: മത്തായിയുടെ സവിശേഷ പ്രയോഗത്തിന് സ്ഥാപിതവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: μείζων αὐτοῦ ἐστιν
  choice: അവനെക്കാൾ വലിയവനാണ്
  rationale: വാക്യത്തിലെ വൈരുധ്യാത്മക താരതമ്യം വിശദീകരിച്ചു തീർക്കാതെ നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: യോഹന്നാന്റെ മഹത്വവും സ്വർഗരാജ്യത്തിലെ ഏറ്റവും ചെറിയവന്റെ മഹത്വവും തമ്മിലുള്ള ബന്ധം
  choice: താരതമ്യം വിശദീകരിക്കാതെ വാക്യത്തിലെ വൈരുധ്യാത്മകമായ പ്രസ്താവന അതേപടി നിലനിർത്തി.
  alternative: യോഹന്നാൻ പഴയ ഉടമ്പടിയുടെ കാലഘട്ടത്തിൽപ്പെട്ടവനാണെന്നും രാജ്യത്തിലുള്ളവർ പുതിയ ഉടമ്പടിയുടെ പ്രത്യേകാവകാശം അനുഭവിക്കുന്നവരാണെന്നും വ്യാഖ്യാനിച്ച് പരിഭാഷപ്പെടുത്തുക.
  rationale: ആ താരതമ്യത്തിന്റെ കാരണം ഈ വാക്യം തന്നെ വിശദീകരിക്കുന്നില്ല. അതിനാൽ രക്ഷാചരിത്രത്തിലെ സ്ഥാനം, വ്യക്തിപരമായ വിശുദ്ധി, ശിഷ്യത്വം തുടങ്ങിയ ഏതെങ്കിലും പ്രത്യേക വ്യാഖ്യാനം പരിഭാഷയിൽ ചേർക്കാതെ യഥാർഥ ദൈവശാസ്ത്രപരമായ സംഘർഷം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. പരിചിതമായ ‘സ്വർഗരാജ്യം’, ‘സ്നാപകനായ യോഹന്നാൻ’ എന്നീ രൂപങ്ങൾ നിലനിർത്തി; മൂലത്തിലെ ആവർത്തനവും വൈരുധ്യാത്മക താരതമ്യവും ലളിതമാക്കാതെ സംരക്ഷിച്ചു.
