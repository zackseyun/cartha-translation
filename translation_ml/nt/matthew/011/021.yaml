    reason: lexical_alternative
  revision_rationale: The revision makes the prophetic woe idiomatic in modern Malayalam, uses a clearer rendering for δυνάμεις, and restores the source’s concise “in sackcloth and ashes” idiom without interpretive expansion. The contrary-to-fact conditional and the lexical alternative footnote are preserved.
