revisions:
- from: കോരസീനേ, നിനക്കു ഹാ കഷ്ടം! ബേത്‌സയിദേ, നിനക്കു ഹാ കഷ്ടം! നിങ്ങളുടെ ഇടയിൽ നടന്ന ശക്തിപ്രവൃത്തികൾ[a] സോരിലും സീദോനിലും നടന്നിരുന്നെങ്കിൽ, അവർ ചാക്കുവസ്ത്രം ധരിച്ച് ചാരത്തിലിരുന്ന് പണ്ടേ മാനസാന്തരപ്പെടുമായിരുന്നു.
  to: അയ്യോ, കോരസീനേ! അയ്യോ, ബേത്‌സയിദേ! നിങ്ങളുടെ ഇടയിൽ നടന്ന ശക്തിയുള്ള പ്രവൃത്തികൾ[a] സോരിലും സീദോനിലും നടന്നിരുന്നെങ്കിൽ, അവർ ചാക്കുവസ്ത്രത്തിലും ചാരത്തിലും പണ്ടേ മാനസാന്തരപ്പെട്ടേനെ.
  rationale: The revision makes the prophetic woe idiomatic in modern Malayalam, uses a clearer rendering for δυνάμεις, and restores the source’s concise “in sackcloth and ashes” idiom without interpretive expansion. The contrary-to-fact conditional and the lexical alternative footnote are preserved.
