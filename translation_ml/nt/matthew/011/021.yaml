reference: Matthew 11:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οὐαί σοι, Χοραζίν· οὐαί σοι, Βηθσαϊδά· ὅτι εἰ ἐν Τύρῳ καὶ Σιδῶνι ἐγένοντο αἱ δυνάμεις αἱ γενόμεναι ἐν ὑμῖν, πάλαι ἂν ἐν σάκκῳ καὶ σποδῷ μετενόησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/021.yaml
  text: Woe to you[a], Chorazin! Woe to you, Bethsaida! For if the mighty works done among you had taken place in Tyre and Sidon, they would have repented long ago in sackcloth and ashes.
translation:
  language: ml
  text: അയ്യോ, കോരസീനേ! അയ്യോ, ബേത്‌സയിദേ! നിങ്ങളുടെ ഇടയിൽ നടന്ന ശക്തിയുള്ള പ്രവൃത്തികൾ[a] സോരിലും സീദോനിലും നടന്നിരുന്നെങ്കിൽ, അവർ ചാക്കുവസ്ത്രത്തിലും ചാരത്തിലും പണ്ടേ മാനസാന്തരപ്പെട്ടേനെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അത്ഭുതങ്ങൾ”; ഗ്രീക്കിൽ, ശക്തി പ്രകടമാക്കുന്ന പ്രവൃത്തികൾ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαί σοι
  choice: നിനക്കു ഹാ കഷ്ടം
  rationale: പ്രവാചകീയമായ അപലപനവും ദുഃഖവും വരാനിരിക്കുന്ന ന്യായവിധിയുടെ ഗൗരവവും ഒരുമിച്ച് നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: Χοραζίν / Βηθσαϊδά / Τύρῳ / Σιδῶνι
  choice: കോരസീൻ / ബേത്‌സയിദ / സോർ / സീദോൻ
  rationale: മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ സ്ഥലനാമരൂപങ്ങൾ സ്വീകരിച്ചു; നേരിട്ടുള്ള അഭിസംബോധനയിൽ കോരസീനേ, ബേത്‌സയിദേ എന്നീ രൂപങ്ങൾ ഉപയോഗിച്ചു.
- source_word: αἱ δυνάμεις
  choice: ശക്തിപ്രവൃത്തികൾ
  rationale: ദൈവിക ശക്തി വെളിപ്പെടുത്തുന്ന പ്രവൃത്തികൾ എന്ന അർഥം സംരക്ഷിക്കുന്നു; ‘അത്ഭുതങ്ങൾ’ എന്ന സാധുവായ, എന്നാൽ അർഥപരിധി അല്പം ചുരുക്കുന്ന പരിഭാഷ അടിക്കുറിപ്പിൽ നൽകി.
- source_word: ἐν ὑμῖν
  choice: നിങ്ങളുടെ ഇടയിൽ
  rationale: നഗരവാസികളുടെ ഉള്ളിൽ എന്നല്ല, അവരുടെ മധ്യേ നടന്ന പ്രവൃത്തികൾ എന്നാണ് ബഹുവചനപ്രയോഗത്തിന്റെ സന്ദർഭാർഥം.
- source_word: πάλαι ἂν ... μετενόησαν
  choice: പണ്ടേ മാനസാന്തരപ്പെടുമായിരുന്നു
  rationale: πάλαιയുടെ കാലസൂചനയും ἄν സഹിതമുള്ള ഭൂതകാല വിരുദ്ധവാസ്തവ നിബന്ധനയും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; μετενόησαν എന്നത് വെറും അഭിപ്രായമാറ്റമല്ല, മാനസാന്തരമാണ്.
- source_word: ἐν σάκκῳ καὶ σποδῷ
  choice: ചാക്കുവസ്ത്രം ധരിച്ച് ചാരത്തിലിരുന്ന്
  rationale: ദുഃഖത്തിന്റെയും മാനസാന്തരത്തിന്റെയും പുരാതന ദൃശ്യചിഹ്നം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: സോരിനോടും സീദോനോടുമുള്ള യേശുവിന്റെ വിരുദ്ധവാസ്തവ താരതമ്യം
  choice: യേശുവിന്റെ ശക്തിപ്രവൃത്തികൾ കണ്ടിട്ടും മാനസാന്തരപ്പെടാത്ത കോരസീനും ബേത്‌സയിദയും കൂടുതൽ കുറ്റക്കാരാണെന്ന യഥാർഥ താരതമ്യം നിലനിർത്തി.
  alternative: യഥാർഥ താരതമ്യവിധിയില്ലാത്ത ശുദ്ധമായ വാചാടോപാതിശയോക്തി.
  rationale: ഗ്രീക്ക് വാക്യം വിരുദ്ധവാസ്തവ നിബന്ധനയിലൂടെ ധാർമിക വൈരുധ്യം ശക്തമാക്കുന്നു. അതിൽനിന്ന് അധികമായ ഉപദേശനിഗമനങ്ങൾ ചേർക്കാതെയും അതിനെ വെറും അതിശയോക്തിയായി ലഘൂകരിക്കാതെയും പരിഭാഷപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, പൊതുവായ വായനയ്ക്ക് ഗ്രഹിക്കാവുന്നതും ആരാധനാവായനയ്ക്ക് യോജിച്ച ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഹാ കഷ്ടം’ പ്രവാചകീയ അപലപനത്തിന്റെ ശക്തി സൂക്ഷിക്കുന്നു; സാംസ്കാരിക ദൃശ്യം വിശദീകരിച്ചെങ്കിലും വാക്യത്തിൽ അനാവശ്യ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
