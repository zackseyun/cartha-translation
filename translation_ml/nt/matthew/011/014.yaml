  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἰ θέλετε δέξασθαι, αὐτός ἐστιν Ἠλίας ὁ μέλλων ἔρχεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/014.yaml
  text: And if you are willing to accept it[b][a], he is Elijah who is to come.
translation:
  language: ml
  text: നിങ്ങൾ ഇത് സ്വീകരിക്കാൻ തയ്യാറാണെങ്കിൽ,[a] വരാനിരിക്കുന്ന ഏലിയാവ് ഇവനാണ്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങൾ ഇത് കൈക്കൊള്ളാൻ തയ്യാറാണെങ്കിൽ.’
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ സ്നാപകയോഹന്നാനെ വാഗ്ദത്തം ചെയ്യപ്പെട്ട ഏലിയാവായി തിരിച്ചറിയുന്നു; മലാഖി 4:5; മത്തായി 17:10–13 താരതമ്യം ചെയ്യുക.
    reason: cross_reference
lexical_decisions:
- source_word: εἰ θέλετε δέξασθαι
  choice: നിങ്ങൾ ഇതു സ്വീകരിക്കാൻ മനസ്സുള്ളവരെങ്കിൽ
  rationale: θέλετε സഹിതമുള്ള infinitive സന്നദ്ധതയെ സൂചിപ്പിക്കുന്നു; δέξασθαι ഇവിടെ യേശുവിന്റെ പ്രസ്താവനയെ അംഗീകരിച്ചെടുക്കുക എന്ന ആശയത്തിലാണ്. ഗ്രീക്കിൽ വ്യക്തമാക്കാത്ത കർമം മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി ‘ഇതു’ എന്നു ചേർത്തു.
- source_word: αὐτός
  choice: ഇവൻ തന്നെയാണ്
  rationale: സർവനാമം യോഹന്നാനെയാണ് സൂചിപ്പിക്കുന്നത്. αὐτός-ന്റെ സാധ്യതയുള്ള ഊന്നൽ ‘തന്നെയാണ്’ എന്നതിലൂടെ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἐστιν Ἠλίας
  choice: ഏലിയാവ് ... ആണ്
  rationale: ഗ്രീക്ക് വാക്യം നൽകുന്ന നേരിട്ടുള്ള തിരിച്ചറിയൽ മയപ്പെടുത്താതെ നിലനിർത്തി; ‘ഏലിയാവിനെപ്പോലെയുള്ളവൻ’ എന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: ὁ μέλλων ἔρχεσθαι
  choice: വരാനിരിക്കുന്ന
  rationale: പ്രതീക്ഷിക്കപ്പെട്ട ഭാവിവരവിനെ സൂചിപ്പിക്കുന്ന substantival ഘടന മലയാളത്തിൽ വിശേഷണരൂപത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: καὶ
  choice: —
  rationale: ഒറ്റവാക്യമായി ഉദ്ധരിക്കുമ്പോൾ ഗ്രീക്കിലെ ബന്ധകമായ καὶ മലയാളത്തിൽ നിർബന്ധമായി പ്രകടിപ്പിക്കേണ്ടതില്ല; ‘കൂടാതെ’ അല്ലെങ്കിൽ ‘അപ്പോൾ’ എന്നു ചേർക്കുന്നത് ബന്ധത്തിന്റെ സ്വഭാവം അനാവശ്യമായി നിർണ്ണയിക്കും.
theological_decisions:
- issue: സ്നാപകയോഹന്നാനെ ഏലിയാവായി തിരിച്ചറിയുന്നത്
  choice: ‘വരാനിരിക്കുന്ന ഏലിയാവ് ഇവൻ തന്നെയാണ്’ എന്ന നേരിട്ടുള്ള തിരിച്ചറിയൽ നിലനിർത്തി.
  alternative: ‘അവൻ ഏലിയാവിന്റെ പങ്ക് നിറവേറ്റുന്നവനാണ്’ / ‘അവൻ ഏലിയാവിനെപ്പോലെയാണ്.’
  rationale: αὐτός ἐστιν Ἠλίας എന്നത് വ്യക്തമായ തിരിച്ചറിയലാണ്; എന്നാൽ εἰ θέλετε δέξασθαι എന്ന നിബന്ധനാപരമായ ആഹ്വാനം അതോടൊപ്പം നിലനിൽക്കുന്നു. പ്രവചനവുമായി ഇതിന്റെ ബന്ധം എങ്ങനെ മനസ്സിലാക്കണമെന്നത് മുഖ്യപാഠത്തിൽ തീർപ്പാക്കാതെ ഈ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘മനസ്സുള്ളവരെങ്കിൽ’ സന്നദ്ധതയെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി അറിയിക്കുന്നു; ‘ഇവൻ തന്നെയാണ്’ തിരിച്ചറിയലിന്റെ ഊന്നൽ കാത്തുസൂക്ഷിക്കുന്നു.
