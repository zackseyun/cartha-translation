id: MAT.11.3
reference: Matthew 11:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν αὐτῷ· Σὺ εἶ ὁ ἐρχόμενος ἢ ἕτερον προσδοκῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/003.yaml
  text: and said to him, “Are you the Coming One, or should we expect another?”
translation:
  language: ml
  text: 'അവനോട് പറഞ്ഞു: “വരാനിരിക്കുന്നവൻ[a] അങ്ങുതന്നെയാണോ, അതോ ഞങ്ങൾ മറ്റൊരാളെ പ്രതീക്ഷിക്കണമോ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “വരുന്നവൻ” അല്ലെങ്കിൽ “വരേണ്ടവൻ.” ഈ ഗ്രീക്ക് പ്രയോഗം മശീഹായെ സൂചിപ്പിക്കുന്ന ഒരു ബിരുദമായി ഉപയോഗിക്കപ്പെടാം.
    reason: പദാർഥപരമായ മറ്റുവായനകളും മശീഹാസൂചനയും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: εἶπεν αὐτῷ
  choice: അവനോട് പറഞ്ഞു
  rationale: അയോറിസ്റ്റ് ക്രിയയായ εἶπεν എന്നതിന്റെ നേരായ അർഥം ‘പറഞ്ഞു’ എന്നാണ്; αὐτῷ പരോക്ഷ കർമമായി ‘അവനോട്’ എന്നു പരിഭാഷപ്പെടുത്തി. വാക്യം മുൻവാക്യത്തിന്റെ തുടർച്ചയായതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായി ചേരുന്ന രൂപം ഉപയോഗിച്ചു.
- source_word: Σὺ εἶ
  choice: അങ്ങുതന്നെയാണോ
  rationale: പ്രകടമായ σύ നൽകുന്ന ഊന്നൽ ‘തന്നെ’കൊണ്ട് നിലനിർത്തി; യേശുവിനെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്നതിനാൽ മാന്യവും ആധുനികവുമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു.
- source_word: ὁ ἐρχόμενος
  choice: വരാനിരിക്കുന്നവൻ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ വർത്തമാന കൃദന്തരൂപം വ്യക്തിയെ സൂചിപ്പിക്കുകയും സന്ദർഭത്തിൽ പ്രതീക്ഷിക്കപ്പെട്ട മശീഹായുടെ സ്ഥാനനാമംപോലെ പ്രവർത്തിക്കുകയും ചെയ്യുന്നു. ‘വരാനിരിക്കുന്നവൻ’ മലയാളത്തിൽ സ്വാഭാവികമായി ഈ പ്രതീക്ഷാസൂചന നിലനിർത്തുന്നു; ‘മശീഹാ’ എന്ന് നേരിട്ട് ചേർത്ത് അർഥം അതിരുകടന്ന് നിർണയിക്കുന്നില്ല.
- source_word: ἢ
  choice: അതോ
  rationale: രണ്ടാമത്തെ പര്യായചോദ്യത്തെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്ന മലയാള സംയോജകം.
- source_word: ἕτερον
  choice: മറ്റൊരാളെ
  rationale: ‘വേറൊരാൾ/മറ്റൊരാൾ’ എന്ന അർഥം നൽകുന്ന പദം; പ്രതീക്ഷിക്കുക എന്ന ക്രിയയുടെ കർമമായതിനാൽ ‘മറ്റൊരാളെ’ എന്നു രൂപപ്പെടുത്തി.
- source_word: προσδοκῶμεν
  choice: ഞങ്ങൾ പ്രതീക്ഷിക്കണമോ
  rationale: രൂപത്തിൽ വർത്തമാന നിർദേശകമായിരുന്നാലും ഈ ആലോചനാത്മക ചോദ്യത്തിൽ ‘ഞങ്ങൾ പ്രതീക്ഷിക്കണമോ’ എന്നതാണ് സ്വാഭാവികം. ‘കാത്തിരിക്കണമോ’ എന്നത് അർഥത്തെ കാത്തിരിപ്പിലേക്കു മാത്രം ചുരുക്കാം.
theological_decisions:
- issue: ὁ ἐρχόμενος എന്ന പ്രയോഗത്തിന്റെ മശീഹാസംബന്ധിയായ സ്ഥാനനാമസ്വഭാവം
  choice: വരാനിരിക്കുന്നവൻ
  alternative: വരുന്നവൻ; വരേണ്ടവൻ; പ്രതീക്ഷിക്കപ്പെട്ടവൻ
  rationale: യോഹന്നാന്റെ ചോദ്യം യേശു പ്രതീക്ഷിക്കപ്പെട്ട ആ വ്യക്തിയാണോ എന്നതാണ്. സന്ദർഭം മശീഹാസൂചനയെ പിന്തുണയ്ക്കുമ്പോഴും ഗ്രീക്ക് പ്രയോഗം സാധാരണ കൃദന്തരൂപമായും വായിക്കാം. അതിനാൽ ‘മശീഹാ’ എന്നു വ്യക്തമാക്കാതെ സ്ഥാനനാമസദൃശമായ രൂപം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘അങ്ങുതന്നെ’ പ്രകടമായ സർവനാമത്തിന്റെ ഊന്നൽ സ്വാഭാവികമായി സൂക്ഷിക്കുന്നു; ദൈവശാസ്ത്രപരമായ അർഥം അമിതമായി നിർണയിക്കുന്ന പദങ്ങൾ ഒഴിവാക്കി.
