id: MAT.11.24
reference: Matthew 11:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πλὴν λέγω ὑμῖν ὅτι γῇ Σοδόμων ἀνεκτότερον ἔσται ἐν ἡμέρᾳ κρίσεως ἢ σοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/024.yaml
  text: But I tell you that it will be more tolerable for the land of Sodom on the day of judgment than for you[a].
translation:
  language: ml
  text: 'എന്നാൽ ഞാൻ നിന്നോടു പറയുന്നു: ന്യായവിധിദിവസത്തിൽ നിന്നെക്കാൾ സൊദോമിന്റെ ദേശത്തിന് കൂടുതൽ സഹനീയമായിരിക്കും.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കൂടുതൽ സഹിക്കാവുന്നതായിരിക്കും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തോടുള്ള ശക്തമായ വൈരുധ്യവും ഗൗരവമുള്ള തുടർച്ചയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: λέγω ὑμῖν
  choice: ഞാൻ നിന്നോടു പറയുന്നു
  rationale: സുവിശേഷങ്ങളിലെ നേരിട്ടുള്ള പ്രസ്താവനാരീതി നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ അഭിസംബോധന ചെയ്യപ്പെടുന്ന പട്ടണം ഏകവചനമായതിനാൽ മലയാളത്തിലും ഏകവചനം ഉപയോഗിച്ചു.
- source_word: γῇ Σοδόμων
  choice: സൊദോമിന്റെ ദേശത്തിന്
  rationale: γῇ എന്നതിലെ ‘ദേശം’ എന്ന വ്യക്തമായ ഘടകം ഒഴിവാക്കാതെ, സൊദോമുമായി ബന്ധപ്പെട്ട പ്രദേശത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: ἀνεκτότερον
  choice: സഹിക്കാവുന്നതായിരിക്കും
  rationale: താരതമ്യത്തിന്റെ അർത്ഥം മലയാളത്തിലെ ‘നിന്നെക്കാൾ’ എന്ന ഘടനയോടൊപ്പം സ്വാഭാവികമായി നൽകുന്നു; വിധിയുടെ അനുഭവം കൂടുതൽ സഹനീയമായിരിക്കുമെന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: ἔσται
  choice: ആയിരിക്കും
  rationale: ലളിതമായ ഭാവികാല സംയോജകക്രിയയെ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: ന്യായവിധിദിവസത്തിൽ
  rationale: അന്ത്യന്യായവിധിയുടെ ദിവസം എന്ന കാലസൂചന കൃത്യവും വായനാസൗകര്യമുള്ളതുമായ രീതിയിൽ നൽകുന്നു.
- source_word: ἢ σοί
  choice: നിന്നെക്കാൾ
  rationale: താരതമ്യപ്രയോഗവും ഗ്രീക്കിലെ ഏകവചന അഭിസംബോധനയും മലയാളത്തിൽ നേരിട്ട് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ഏകവചനമായ σοί ആരെ സൂചിപ്പിക്കുന്നു
  choice: പട്ടണത്തെ വ്യക്തിവൽക്കരിച്ചുള്ള നേരിട്ടുള്ള ഏകവചന അഭിസംബോധനയായി ‘നിന്നെക്കാൾ’ നിലനിർത്തി.
  alternative: ‘നിങ്ങളെക്കാൾ’ അല്ലെങ്കിൽ ‘നിങ്ങളുടെ ജനത്തെക്കാൾ’ എന്നു ബഹുവചനമായി വികസിപ്പിക്കുക.
  rationale: ഗ്രീക്ക് പാഠം ഏകവചനമാണ്; ചുറ്റുപാടിലുള്ള പ്രവാചകശൈലിയിലെ പട്ടണാഭിസംബോധനയുടെ വാചകശക്തി വ്യാഖ്യാനപരമായി വികസിപ്പിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘സൊദോമിന്റെ ദേശം’ എന്ന രൂപം മൂലപാഠത്തിലെ γῇ വ്യക്തമാക്കുന്നു; ഏകവചനമായ ‘നിന്നോട്/നിന്നെക്കാൾ’ പട്ടണത്തോടുള്ള നേരിട്ടുള്ള അഭിസംബോധന നിലനിർത്തുന്നു.
