  to: അപ്പോൾ, തന്റെ ശക്തിപ്രവൃത്തികളിൽ മിക്കതും നടന്ന പട്ടണങ്ങൾ മാനസാന്തരപ്പെടാതിരുന്നതിനാൽ, അവൻ അവയെ കുറ്റപ്പെടുത്തിത്തുടങ്ങി:[a]
  rationale: The revision corrects the attachment of “മിക്കതും” so that it modifies Jesus’ powerful deeds, as in the Greek, and uses a more source-appropriate verb for Jesus’ reproach of the cities. The causal relation, metonymic reference to the cities, and δυνάμεις footnote are retained.
