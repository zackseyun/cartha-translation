id: MAT.11.20
reference: Matthew 11:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τότε ⸀ἤρξατο ὀνειδίζειν τὰς πόλεις ἐν αἷς ἐγένοντο αἱ πλεῖσται δυνάμεις αὐτοῦ, ὅτι οὐ μετενόησαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/020.yaml
  text: Then he began to reproach the cities in which most of his mighty works had been done[a], because they did not repent.
translation:
  language: ml
  text: അപ്പോൾ, തന്റെ ശക്തിപ്രവൃത്തികളിൽ മിക്കതും നടന്ന പട്ടണങ്ങൾ മാനസാന്തരപ്പെടാതിരുന്നതിനാൽ, അവൻ അവയെ കുറ്റപ്പെടുത്തിത്തുടങ്ങി:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“ശക്തിപ്രവൃത്തികൾ” എന്നതിന് “അത്ഭുതങ്ങൾ” എന്നോ “ശക്തിയുടെ പ്രവൃത്തികൾ” എന്നോ പരിഭാഷപ്പെടുത്താം (ഗ്രീക്ക്: ദ്യുനാമെയ്‌സ്).'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: അപ്പോൾ
  rationale: അടുത്ത സംഭവഘട്ടത്തെ അവതരിപ്പിക്കുന്ന കാലസൂചകമായി സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: ἤρξατο ὀνειδίζειν
  choice: ശാസിച്ചുതുടങ്ങി
  rationale: ἤρξατοയുടെ ആരംഭാർഥം നിലനിർത്തുന്നു; ὀνειδίζειν സൂചിപ്പിക്കുന്ന കുറ്റം ചൂണ്ടിക്കാട്ടിയുള്ള നിന്ദയും ശാസനയും അതിരുകടന്ന ഔപചാരിക വിധിപ്രഖ്യാപനമില്ലാതെ അറിയിക്കുന്നു.
- source_word: τὰς πόλεις
  choice: പട്ടണങ്ങൾ
  rationale: സന്ദർഭത്തിലെ ഗലീലാപ്രദേശങ്ങളിലെ ജനവാസകേന്ദ്രങ്ങൾക്ക് ആധുനിക മലയാളത്തിൽ ‘പട്ടണങ്ങൾ’ സ്വാഭാവികമാണ്; πόλις എന്നതിന്റെ നഗരം/പട്ടണം എന്ന അർഥപരിധിയോട് യോജിക്കുന്നു.
- source_word: ἐν αἷς ἐγένοντο
  choice: നടന്ന
  rationale: ശക്തിപ്രവൃത്തികൾ ആ സ്ഥലങ്ങളിൽ സംഭവിച്ചു എന്ന ഗ്രീക്ക് പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: αἱ πλεῖσται
  choice: ഏറിയപങ്കും
  rationale: ‘ഭൂരിഭാഗവും/മിക്കവയും’ എന്ന superlative അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: δυνάμεις αὐτοῦ
  choice: തന്റെ ശക്തിപ്രവൃത്തികൾ
  rationale: δυνάμεις എന്നതിലെ ശക്തിയുടെ ആശയം നിലനിർത്തുകയും യേശുവിന്റെ അത്ഭുതകരമായ പ്രവൃത്തികളെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് സന്ദർഭോചിതമായി അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: ὅτι οὐ μετενόησαν
  choice: മാനസാന്തരപ്പെടാതിരുന്നതിനാൽ
  rationale: ശാസനയുടെ കാരണം വ്യക്തമാക്കുന്നു; μετανοέωയുടെ ധാർമിക-ആത്മീയ ഭാരം സഭാപാരമ്പര്യത്തിൽ പരിചിതവും കൃത്യവുമായ ‘മാനസാന്തരപ്പെടുക’ എന്ന പദത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: അത്ഭുതപ്രവൃത്തികളുടെ സന്ദർഭത്തിൽ δυνάμεις വിവർത്തനം ചെയ്യൽ
  choice: ശക്തിപ്രവൃത്തികൾ
  alternative: അത്ഭുതങ്ങൾ; ശക്തിയുടെ പ്രവൃത്തികൾ
  rationale: ഗ്രീക്കിലെ ‘ശക്തി’ എന്ന ഊന്നൽ സംരക്ഷിച്ചുകൊണ്ട്, ഈ സന്ദർഭത്തിൽ യേശുവിന്റെ അസാധാരണ പ്രവൃത്തികളെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് വ്യക്തമാക്കുന്നു; ‘അത്ഭുതങ്ങൾ’ എന്ന കൂടുതൽ വിഭാഗീകരിച്ച പദത്തിലേക്ക് മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- issue: μετενόησαν വിവർത്തനം ചെയ്യൽ
  choice: മാനസാന്തരപ്പെടാതിരുന്നതിനാൽ
  alternative: മനം മാറ്റാതിരുന്നതിനാൽ; തിരിഞ്ഞുവരാതിരുന്നതിനാൽ
  rationale: യേശുവിന്റെ പ്രവൃത്തികളോടുള്ള ധാർമികവും ആത്മീയവുമായ പ്രതികരണത്തിന്റെ അഭാവം പാഠത്തിൽ ഉള്ളത്ര ഭാരത്തോടെ നൽകുന്നു; ഏതെങ്കിലും പ്രത്യേക സമ്പ്രദായവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. ഗ്രീക്കിന്റെ കാരണബന്ധവും ആരംഭാർഥവും നിലനിർത്തിയിട്ടുണ്ട്. പ്രധാന പദമായ δυνάμεις-ന്റെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
