id: MAT.11.10
reference: Matthew 11:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀οὗτός ἐστιν περὶ οὗ γέγραπται· Ἰδοὺ ἐγὼ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου, ὃς κατασκευάσει τὴν ὁδόν σου ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/010.yaml
  text: 'This is he about whom it is written: ‘Behold[a], I am sending my messenger before your face, who will prepare your way before you.’'
translation:
  language: ml
  text: 'ഇവനെക്കുറിച്ചാണ് എഴുതപ്പെട്ടിരിക്കുന്നത്: “ഇതാ, ഞാൻ എന്റെ ദൂതനെ നിന്റെ മുഖത്തിനുമുമ്പായി അയയ്ക്കുന്നു; അവൻ നിന്റെ വഴി നിനക്കുമുമ്പിൽ ഒരുക്കും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτός
  choice: ഇവനെക്കുറിച്ചാണ്
  rationale: തുടർന്നുവരുന്ന περὶ οὗ എന്ന ബന്ധവാക്യത്തോടൊപ്പം സ്വാഭാവിക മലയാളത്തിൽ ഊന്നലോടെയുള്ള തിരിച്ചറിയൽ നിലനിർത്തുന്നു.
- source_word: περὶ οὗ γέγραπται
  choice: ഇവനെക്കുറിച്ചാണ് ഇങ്ങനെ എഴുതിയിരിക്കുന്നത്
  rationale: περίയുടെ ‘കുറിച്ച്’ എന്ന അർഥവും തിരുവെഴുത്ത് ഉദ്ധരണിക്കുള്ള perfect passive സൂത്രവാക്യത്തിന്റെ നിലവിലുള്ള പ്രാബല്യവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: Ἰδοὺ
  choice: ഇതാ
  rationale: പ്രവാചകീയ ഉദ്ധരണിയുടെ ശ്രദ്ധയാകർഷിക്കുന്നതും ഗൗരവമുള്ളതുമായ ഭാവം ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀποστέλλω
  choice: അയയ്ക്കുന്നു
  rationale: ഗ്രീക്ക് വർത്തമാനകാലത്തിന്റെ സജീവതയും സന്ദർഭത്തിലെ ആസന്നമായ പ്രവർത്തനഭാവവും മലയാള വർത്തമാനരൂപത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἄγγελόν
  choice: ദൂതനെ
  rationale: ഇവിടെ പരാമർശിക്കുന്നത് മനുഷ്യനായ മുന്നോടിയെയാണ്; ‘ദൂതൻ’ എന്നത് സന്ദേശവാഹകൻ എന്ന അർഥം നൽകുകയും അനാവശ്യമായി സ്വർഗീയ ദൂതനായി നിർണ്ണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: πρὸ προσώπου σου
  choice: നിന്റെ മുഖത്തിനുമുമ്പായി
  rationale: ഉദ്ധരണിയിലെ മൂർത്തമായ ‘മുഖത്തിനുമുമ്പിൽ’ എന്ന പ്രയോഗം നിലനിർത്തുകയും പിന്നീടുള്ള ἔμπροσθέν σου എന്ന വ്യത്യസ്തമായ പദപ്രയോഗവുമായി ലയിപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: κατασκευάσει
  choice: ഒരുക്കും
  rationale: വഴി മുൻകൂട്ടി സജ്ജമാക്കുക എന്ന ഭാവി പ്രവർത്തനം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τὴν ὁδόν σου
  choice: നിന്റെ വഴി
  rationale: ὁδός എന്നതിന്റെ ഭൗതികവും രൂപകാത്മകവുമായ സാധ്യതകൾ രണ്ടും സംരക്ഷിക്കുന്നു.
- source_word: ἔμπροσθέν σου
  choice: നിനക്കുമുമ്പിൽ
  rationale: ‘നിന്റെ മുമ്പിൽ’ എന്ന സ്ഥാനബന്ധം ഗൗരവമുള്ളതും വ്യക്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: തിരുവെഴുത്ത് ഉദ്ധരണിയിലെ ആവർത്തിത സ്ഥാനസൂചനകൾ
  choice: ‘നിന്റെ മുഖത്തിനുമുമ്പായി’ എന്നും ‘നിനക്കുമുമ്പിൽ’ എന്നും രണ്ടും നിലനിർത്തി
  alternative: രണ്ടും ‘നിനക്കുമുമ്പായി’ എന്ന ഒറ്റ സ്വാഭാവിക പ്രയോഗത്തിലേക്ക് മിനുക്കുക
  rationale: ഗ്രീക്കിൽ πρὸ προσώπου σου, ἔμπροσθέν σου എന്നീ രണ്ടുതരം പ്രയോഗങ്ങളുണ്ട്. രണ്ടും നിലനിർത്തുന്നത് ഉദ്ധരണിയുടെ ഔപചാരിക ഘടനയും ഊന്നലും സംരക്ഷിക്കുന്നു; ആവർത്തനം നിശ്ശബ്ദമായി നീക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. ‘മുഖത്തിനുമുമ്പായി’ എന്നത് ദൈനംദിനഭാഷയെക്കാൾ ഔപചാരികമാണെങ്കിലും മൂലത്തിലെ തിരുവെഴുത്ത്-ഉദ്ധരണിയുടെ മൂർത്തമായ ശൈലി ഉദ്ദേശപൂർവം സംരക്ഷിക്കുന്നു.
