id: MAT.11.17
reference: Matthew 11:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀λέγουσιν· Ηὐλήσαμεν ὑμῖν καὶ οὐκ ὠρχήσασθε· ⸀ἐθρηνήσαμεν καὶ οὐκ ἐκόψασθε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/017.yaml
  text: They say[a], ‘We played the flute for you, and you did not dance; we sang a lament[c][b], and you did not mourn.’
translation:
  language: ml
  text: 'അവർ പറയുന്നു: ‘ഞങ്ങൾ നിങ്ങൾക്കായി കുഴൽ വായിച്ചു; നിങ്ങൾ നൃത്തം ചെയ്തില്ല. ഞങ്ങൾ വിലാപഗാനം പാടി; നിങ്ങൾ മാറത്തടിച്ചില്ല[a].’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘നിങ്ങൾ നിങ്ങളെത്തന്നെ അടിച്ചില്ല’; ദുഃഖസൂചകമായി മാറത്തടിക്കുന്ന പതിവിനെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: λέγουσιν
  choice: അവർ പറയുന്നു
  rationale: ഉദാഹരണരംഗത്തിലെ കുട്ടികളുടെ പരാതി സജീവമായി അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് വർത്തമാനകാലം നിലനിർത്തുന്നു.
- source_word: Ηὐλήσαμεν
  choice: ഞങ്ങൾ കുഴൽ വായിച്ചു
  rationale: αὐλέω പൊതുവായി സംഗീതം വായിക്കുന്നതല്ല, കുഴൽ അഥവാ പൈപ്പ് വായിക്കുന്നതിനെ പ്രത്യേകം സൂചിപ്പിക്കുന്നു.
- source_word: ὑμῖν
  choice: നിങ്ങൾക്കായി
  rationale: പ്രകടനം മറ്റുള്ളവരെ ഉദ്ദേശിച്ചായിരുന്നുവെന്ന സന്ദർഭാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὠρχήσασθε
  choice: നിങ്ങൾ നൃത്തം ചെയ്തില്ല
  rationale: മധ്യരൂപത്തിന് ഇവിടെ പ്രത്യേക ആത്മനിഷ്ഠാർഥം നൽകേണ്ടതില്ല; സാധാരണയായി ‘നൃത്തം ചെയ്യുക’ എന്നതാണ് അർഥം.
- source_word: ἐθρηνήσαμεν
  choice: ഞങ്ങൾ വിലാപഗാനം പാടി
  rationale: θρηνέω ശവസംസ്കാരസന്ദർഭവുമായി ബന്ധപ്പെട്ട വിലാപത്തെ സൂചിപ്പിക്കാം; ആദ്യവാക്യത്തിലെ സംഗീതപ്രകടനത്തോടുള്ള സമാന്തരതയും ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: ἐκόψασθε
  choice: നിങ്ങൾ മാറത്തടിച്ച് വിലപിച്ചില്ല
  rationale: κόπτω എന്നതിന്റെ മധ്യരൂപം ഇവിടെ ദുഃഖാചരണത്തിന്റെ ഭാഗമായി സ്വയം അടിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘മാറത്തടിച്ച് വിലപിക്കുക’ അർഥവും ആചാരചിത്രവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
