translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ സംഭാഷണശൈലി ഉപയോഗിച്ചു. ഗ്രീക്കിലെ രണ്ടു സമാന്തര പ്രകടനങ്ങളായ കുഴൽവായനയും വിലാപഗാനവും വ്യക്തമായി നിലനിർത്തി; അവസാന ക്രിയയിലെ ദുഃഖാചാരചിത്രം മുഖ്യവാചകത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
