- from: എന്നാൽ ഈ തലമുറയെ ഞാൻ എന്തിനോടു ഉപമിക്കണം? ചന്തസ്ഥലങ്ങളിൽ[a] ഇരുന്ന് മറ്റുള്ളവരെ[b] വിളിച്ചുപറയുന്ന കുട്ടികളെപ്പോലെയാണ് അത്,
