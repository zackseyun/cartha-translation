  text: Τίνι δὲ ὁμοιώσω τὴν γενεὰν ταύτην; ὁμοία ἐστὶν παιδίοις ⸂καθημένοις ἐν ταῖς ἀγοραῖς ἃ προσφωνοῦντα τοῖς ἑτέροις⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/016.yaml
  text: But to what shall I compare this generation? It is like children sitting in the marketplaces[a], calling out to the others[b],
translation:
  language: ml
  text: എന്നാൽ ഈ തലമുറയെ ഞാൻ എന്തിനോടു ഉപമിക്കണം? ചന്തസ്ഥലങ്ങളിൽ[a] ഇരുന്ന് മറ്റുള്ളവരോടു[b] വിളിച്ചുപറയുന്ന കുട്ടികളെപ്പോലെയാണ് അത്,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ചന്തമൈതാനങ്ങളിൽ.’ ആളുകൾ കൂടിയിരുന്ന പൊതുചന്തപ്രദേശങ്ങളെയാണ് ഗ്രീക്ക് പദമായ ἀγοραῖς സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘മറ്റു കുട്ടികളോടു.’ ഗ്രീക്കിൽ ‘മറ്റുള്ളവരോടു’ എന്നാണുള്ളത്; അവർ ആരാണെന്നത് ഉപമയുടെ സന്ദർഭത്തിൽനിന്ന് മനസ്സിലാകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίνι ... ὁμοιώσω
  choice: എന്തിനോടു ഉപമിക്കണം
  rationale: ദത്തിവിലുള്ള ചോദ്യം താരതമ്യത്തിന്റെ മാനദണ്ഡം ചോദിക്കുന്നു. ഭാവികാല ക്രിയയുടെ ആലോചനാത്മക-വാചാടോപ ശക്തി മലയാളത്തിൽ ‘ഉപമിക്കണം’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: ലഘുവായ മാറ്റമോ വൈരുധ്യമോ സൂചിപ്പിക്കുന്ന δέ-യുടെ വാചാടോപ തിരിവ് അതിശക്തമാക്കാതെ പ്രകടിപ്പിക്കുന്നു.
- source_word: γενεὰν ταύτην
  choice: ഈ തലമുറയെ
  rationale: യേശുവിന്റെ സമകാലികരായ ആളുകളെ ഒരു കൂട്ടമായി സൂചിപ്പിക്കുന്ന γενεά എന്ന പദത്തിന്റെ സ്ഥാപിതവും കൃത്യവുമായ മലയാള രൂപം.
- source_word: ὁμοία ἐστὶν
  choice: '...പോലെയാണ് അത്'
  rationale: ലളിതമായ സാദൃശ്യപ്രസ്താവന സ്വാഭാവിക മലയാള വാക്യക്രമത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: παιδίοις
  choice: കുട്ടികളെ
  rationale: സന്ദർഭം ആവശ്യപ്പെടാത്ത അധിക diminutive ഭാവം ചേർക്കാതെ പൊതുവായി കുട്ടികളെ സൂചിപ്പിക്കുന്നു.
- source_word: καθημένοις
  choice: ഇരുന്ന്
  rationale: കുട്ടികളുടെ നിലയും രംഗത്തിന്റെ തുടർച്ചയും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: ചന്തസ്ഥലങ്ങളിൽ
  rationale: ἀγορά എന്നത് സാധനങ്ങൾ വിൽക്കുന്ന ഇടം മാത്രമല്ല, ആളുകൾ കൂടുന്ന പൊതുചന്തപ്രദേശവും സൂചിപ്പിക്കുന്നു; ‘ചന്തസ്ഥലങ്ങൾ’ ആ പൊതുസന്ദർഭം നിലനിർത്തുന്നു.
- source_word: προσφωνοῦντα
  choice: വിളിച്ചുപറയുന്ന
  rationale: ശബ്ദമുയർത്തിയുള്ള അഭിസംബോധന എന്ന ആശയം പൊതുസ്ഥലത്തെ കുട്ടികളുടെ രംഗത്തിന് യോജിച്ചവിധം വ്യക്തമാക്കുന്നു.
- source_word: τοῖς ἑτέροις
  choice: മറ്റുള്ളവരെ
  rationale: ഗ്രീക്ക് മൂലത്തിലെ ‘മറ്റുള്ളവർ’ എന്ന അനിശ്ചിതത്വം നിലനിർത്തുന്നു; അവർ മറ്റു കുട്ടികളാണെന്നത് ഉപമയുടെ സന്ദർഭത്തിൽനിന്ന് മനസ്സിലാകുന്നു.
