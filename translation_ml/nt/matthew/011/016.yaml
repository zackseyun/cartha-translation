  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. മൂലത്തിലെ വാചാടോപചോദ്യവും ‘മറ്റുള്ളവർ’ എന്ന സന്ദർഭാധീനമായ പരാമർശവും നിലനിർത്തിയിരിക്കുന്നു. അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്ന വിരാമചിഹ്നമായി അവസാനത്തിൽ കോമ ഉപയോഗിച്ചു.
