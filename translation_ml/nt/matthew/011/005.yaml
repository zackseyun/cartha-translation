id: MAT.11.5
reference: Matthew 11:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τυφλοὶ ἀναβλέπουσιν καὶ χωλοὶ περιπατοῦσιν, λεπροὶ καθαρίζονται καὶ κωφοὶ ἀκούουσιν, ⸀καὶ νεκροὶ ἐγείρονται καὶ πτωχοὶ εὐαγγελίζονται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/005.yaml
  text: The blind receive sight and the lame walk[a], lepers are cleansed and the deaf hear[b], and the dead are raised and the poor have good news proclaimed to them.
translation:
  language: ml
  text: അന്ധർ കാഴ്ച പ്രാപിക്കുന്നു; മുടന്തർ നടക്കുന്നു; കുഷ്ഠരോഗികൾ ശുദ്ധരാക്കപ്പെടുന്നു; ബധിരർ കേൾക്കുന്നു; മരിച്ചവർ ഉയിർപ്പിക്കപ്പെടുന്നു; ദരിദ്രരോടു സുവാർത്ത അറിയിക്കപ്പെടുന്നു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “ദരിദ്രരോടു സുവിശേഷം പ്രസംഗിക്കപ്പെടുന്നു.” ഗ്രീക്ക് ക്രിയ കർമണഭാവത്തിലാണ്: അവർ സുവാർത്തയുടെ സ്വീകർത്താക്കളാകുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: ഈ പട്ടിക യെശയ്യാവ് 35:5–6; 61:1 എന്നിവയെ പ്രതിധ്വനിപ്പിക്കുകയും മശീഹായുടെ പ്രവർത്തനത്തോടു ബന്ധപ്പെട്ട അടയാളങ്ങൾ അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: τυφλοὶ ἀναβλέπουσιν
  choice: അന്ധർ കാഴ്ച പ്രാപിക്കുന്നു
  rationale: രോഗശാന്തിയുടെ സന്ദർഭത്തിൽ ἀναβλέπω എന്നത് വെറുതെ ‘മേലോട്ടു നോക്കുന്നു’ എന്നല്ല, കാഴ്ച ലഭിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ചുരുക്കവും സ്വാഭാവികവുമായ പ്രയോഗം ഗ്രീക്ക് വാക്യത്തിന്റെ പട്ടികാശൈലി നിലനിർത്തുന്നു.
- source_word: χωλοὶ περιπατοῦσιν
  choice: മുടന്തർ നടക്കുന്നു
  rationale: χωλός നടക്കാനുള്ള ശേഷി നഷ്ടപ്പെട്ടതോ പരിമിതപ്പെട്ടതോ ആയവരെ സൂചിപ്പിക്കുന്നു; περιπατέω ഇവിടെ അക്ഷരാർഥത്തിൽ ‘നടക്കുക’ എന്നാണ്.
- source_word: λεπροὶ καθαρίζονται
  choice: കുഷ്ഠരോഗികൾ ശുദ്ധരാക്കപ്പെടുന്നു
  rationale: καθαρίζονται എന്ന കർമണിപ്രയോഗം ശാരീരിക സൗഖ്യത്തോടൊപ്പം ശുദ്ധീകരണത്തിന്റെ ആചാരപരമായ അർഥവും നിലനിർത്തുന്നതിനാൽ ‘സുഖപ്പെടുന്നു’ എന്നതിനെക്കാൾ ‘ശുദ്ധരാക്കപ്പെടുന്നു’ യോജിക്കുന്നു.
- source_word: κωφοὶ ἀκούουσιν
  choice: ബധിരർ കേൾക്കുന്നു
  rationale: κωφός എന്നതിന് ബധിരൻ എന്നും ഊമൻ എന്നും അർഥമാകാമെങ്കിലും, ἀκούουσιν എന്ന ക്രിയയോടുള്ള ബന്ധം ഇവിടെ ‘ബധിരർ’ എന്ന അർഥം വ്യക്തമാക്കുന്നു.
- source_word: νεκροὶ ἐγείρονται
  choice: മരിച്ചവർ ഉയിർപ്പിക്കപ്പെടുന്നു
  rationale: ἐγείρονται കർമണിരൂപമായതിനാൽ മരിച്ചവരിൽ പ്രവർത്തിക്കുന്ന ബാഹ്യമായ—സന്ദർഭത്തിൽ ദൈവികമായ—പ്രവർത്തനം വിവർത്തനം നിലനിർത്തുന്നു.
- source_word: πτωχοὶ εὐαγγελίζονται
  choice: ദരിദ്രരോടു സുവാർത്ത അറിയിക്കപ്പെടുന്നു
  rationale: εὐαγγελίζονται എന്ന കർമണഭാവം ദരിദ്രർ സുവാർത്തയുടെ സ്വീകർത്താക്കളാണെന്നത് പ്രകടമാക്കുന്നു. ‘സുവാർത്ത’ എന്നത് പദത്തിന്റെ അടിസ്ഥാനാർഥവും യെശയ്യാവിലെ പ്രതിധ്വനിയും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: εὐαγγελίζονται എന്ന പദത്തിന്റെ സുവിശേഷപരമായ അർഥം
  choice: ദരിദ്രരോടു സുവാർത്ത അറിയിക്കപ്പെടുന്നു
  alternative: ദരിദ്രരോടു സുവിശേഷം പ്രസംഗിക്കപ്പെടുന്നു
  rationale: പ്രധാനപാഠത്തിലെ തിരഞ്ഞെടുപ്പ് ഗ്രീക്കിലെ കർമണഭാവവും ‘നല്ല വാർത്ത’ എന്ന പദാർഥവും നിലനിർത്തുന്നു; പിന്നീടുള്ള സഭാപരമായ സാങ്കേതിക അർഥം അനാവശ്യമായി ചുരുക്കിച്ചേർക്കുന്നില്ല.
- issue: അത്ഭുതങ്ങളുടെ പട്ടികയും മശീഹാപരമായ നിവൃത്തിയും
  choice: നിവൃത്തി എന്ന് വിശദീകരിക്കാതെ പ്രവൃത്തികളെ നേരിട്ട് പ്രസ്താവിക്കുന്നു
  alternative: ഇവ യെശയ്യാവിന്റെ പ്രവചനനിവൃത്തിയാണെന്ന് പ്രധാനപാഠത്തിൽ വ്യക്തമാക്കുക
  rationale: യെശയ്യാവിലേക്കുള്ള സൂചന ശക്തമാണെങ്കിലും, ഗ്രീക്ക് വാക്യം നിവൃത്തി എന്ന വ്യാഖ്യാനം നേരിട്ട് ചേർക്കുന്നില്ല. അതിനാൽ ആ ബന്ധം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ഗ്രീക്കിലെ സമാന്തര പട്ടികാരൂപവും കർമണപ്രയോഗങ്ങളും കഴിയുന്നത്ര നിലനിർത്തി; പ്രത്യേക സഭാവിഭാഗങ്ങളുടെ സാങ്കേതിക പദാവലി പ്രധാനപാഠത്തിൽ ഒഴിവാക്കി.
