id: MAT.11.2
reference: Matthew 11:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰωάννης ἀκούσας ἐν τῷ δεσμωτηρίῳ τὰ ἔργα τοῦ χριστοῦ πέμψας ⸀διὰ τῶν μαθητῶν αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/002.yaml
  text: When John heard in prison about the works of the Messiah[a], he sent word through his disciples
translation:
  language: ml
  text: യോഹന്നാൻ തടവറയിൽ വച്ച് മശീഹയുടെ[a] പ്രവൃത്തികളെക്കുറിച്ച് കേട്ടപ്പോൾ, തന്റെ ശിഷ്യന്മാരിലൂടെ സന്ദേശം അയച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ക്രിസ്തുവിന്റെ പ്രവൃത്തികൾ’.
    reason: Χριστός എന്ന ഗ്രീക്ക് സ്ഥാനപ്പേരിന്റെ പരമ്പരാഗതമായ മറ്റൊരു മലയാളരൂപം നൽകുന്നു.
lexical_decisions:
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയില്ല
  rationale: ഇത് ആഖ്യാനത്തിലെ ഒരു മാറ്റം സൂചിപ്പിക്കുന്ന മൃദുവായ ബന്ധകമാണ്; മലയാളവാക്യത്തിന്റെ സ്വാഭാവിക പ്രവാഹത്തിൽ അത് പ്രത്യേകം ചേർക്കേണ്ടതില്ല.
- source_word: ἀκούσας
  choice: കേട്ടപ്പോൾ
  rationale: മുൻകൃത്യത്തെ സൂചിപ്പിക്കുന്ന അരിസ്റ്റ് കൃദന്തത്തെ സ്വാഭാവികമായ കാലവാക്യമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἐν τῷ δεσμωτηρίῳ
  choice: തടവറയിൽവെച്ച്
  rationale: യോഹന്നാൻ തടവിലായിരുന്ന സ്ഥലസാഹചര്യം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: τὰ ἔργα
  choice: പ്രവൃത്തികളെക്കുറിച്ച്
  rationale: ἔργα എന്നതിന്റെ വിശാലമായ അർഥം നിലനിർത്തി, മശീഹയുടെ പ്രവർത്തനങ്ങളും ശക്തിപ്രവൃത്തികളും ഉൾക്കൊള്ളാൻ ഇടവരുത്തുന്നു.
- source_word: τοῦ χριστοῦ
  choice: മശീഹയുടെ
  rationale: ഇവിടെ Χριστός വ്യക്തിനാമത്തേക്കാൾ അഭിഷിക്തനായ രാജാവിനെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നു.
- source_word: πέμψας
  choice: ആളയച്ചു
  rationale: ശിഷ്യന്മാരെ ദൂതരായി അയച്ചുവെന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; സന്ദേശത്തിന്റെ ഉള്ളടക്കം അടുത്ത വാക്യത്തിൽ വരുന്നതിനാൽ ഇവിടെ അത് മുൻകൂട്ടി ചേർക്കുന്നില്ല.
- source_word: διὰ τῶν μαθητῶν αὐτοῦ
  choice: തന്റെ ശിഷ്യന്മാർ മുഖാന്തരം
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന ഇടനിലക്കാരായുള്ള പ്രവർത്തനം കൃത്യമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: സന്ദർഭത്തിൽ ഇത് യേശുവിന്റെ മശീഹാപരമായ പ്രവൃത്തികളെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരാണ്; പരമ്പരാഗതമായ ‘ക്രിസ്തു’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘തടവറ’, ‘പ്രവൃത്തികൾ’, ‘മുഖാന്തരം’ എന്നിവ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും മൂലപാഠത്തിന്റെ ഘടനയും അർഥവും നിലനിർത്തുന്നതുമാണ്.
