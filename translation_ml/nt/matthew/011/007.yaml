id: MAT.11.7
reference: Matthew 11:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τούτων δὲ πορευομένων ἤρξατο ὁ Ἰησοῦς λέγειν τοῖς ὄχλοις περὶ Ἰωάννου· Τί ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι; κάλαμον ὑπὸ ἀνέμου σαλευόμενον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/007.yaml
  text: 'As these men were going away[b][a], Jesus began to speak to the crowds about John: “What did you go out into the wilderness to look at? A reed being shaken by the wind?”'
translation:
  language: ml
  text: 'അവർ പോകുമ്പോൾ, യേശു യോഹന്നാനെക്കുറിച്ച് ജനക്കൂട്ടങ്ങളോടു സംസാരിക്കാൻ തുടങ്ങി: “നിങ്ങൾ എന്തു കാണാനാണ് മരുഭൂമിയിലേക്കു പോയത്? കാറ്റിൽ ആടിയുലയുന്ന ഒരു ഞാങ്ങണയോ?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കാറ്റിൽ ആടിയുലയുന്ന ഞാങ്ങണ അസ്ഥിരതയെയോ ചാഞ്ചാട്ടത്തെയോ സൂചിപ്പിക്കാം. യോഹന്നാൻ അങ്ങനെയുള്ളവനല്ല എന്ന നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്ന ചോദ്യമാണിത്.
    reason: cultural_note
lexical_decisions:
- source_word: Τούτων δὲ πορευομένων
  choice: അവർ പോകുമ്പോൾ
  rationale: ജനിതിവ് അബ്സല്യൂട്ട് സമകാലികമായി നടക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. മുൻസന്ദർഭത്തിൽ ഇവർ യോഹന്നാന്റെ ശിഷ്യന്മാരാണെങ്കിലും, ഗ്രീക്കിലെ സർവനാമത്തിന്റെ ലളിതത്വം നിലനിർത്താൻ ‘അവർ’ എന്നു നൽകി.
- source_word: ἤρξατο ... λέγειν
  choice: സംസാരിക്കാൻ തുടങ്ങി
  rationale: ἄρχομαι + infinitive എന്ന ഘടനയുടെ ആരംഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: τοῖς ὄχλοις
  choice: ജനക്കൂട്ടങ്ങളോട്
  rationale: ഗ്രീക്കിലെ ബഹുവചനം നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി കേൾക്കുകയും ചെയ്യുന്നു.
- source_word: περὶ Ἰωάννου
  choice: യോഹന്നാനെക്കുറിച്ച്
  rationale: περί + genitive ഇവിടെ സംസാരവിഷയത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: Τί ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι;
  choice: നിങ്ങൾ എന്തു കാണാനാണ് മരുഭൂമിയിലേക്കു പോയത്?
  rationale: τί എന്നത് ‘എന്ത്?’ എന്ന ചോദ്യവും θεάομαι എന്നത് ഉദ്ദേശപൂർവം കാണുന്നതും സൂചിപ്പിക്കുന്നു. ‘എന്തു കാണാനാണ്’ ഈ രണ്ടും സ്വാഭാവികമായി ചേർത്തുനൽകുന്നു.
- source_word: κάλαμον
  choice: ഒരു ഞാങ്ങണ
  rationale: κάλαμος എന്ന പദത്തിന്റെ സാധാരണ അർഥമായ reed-ന് മലയാളത്തിൽ യോജിക്കുന്ന സസ്യനാമം; ഏകവചനം നിലനിർത്തുന്നു.
- source_word: ὑπὸ ἀνέμου σαλευόμενον
  choice: കാറ്റിൽ ആടിയുലയുന്ന
  rationale: കാറ്റിനാൽ ചലിപ്പിക്കപ്പെടുന്ന ഞാങ്ങണയുടെ ദൃശ്യവും വർത്തമാന മധ്യ/കർമണി പങ്കാളികത്തിന്റെ തുടർച്ചാഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: Τούτων എന്നതിന്റെ പരാമർശവിഷയം
  choice: ‘അവർ’ എന്നു നൽകി; മുൻസന്ദർഭം യോഹന്നാന്റെ ശിഷ്യന്മാരെ തിരിച്ചറിയാൻ അനുവദിക്കുന്നു
  alternative: ‘ആ ശിഷ്യന്മാർ’ എന്നു വ്യക്തമായി ചേർക്കുക
  rationale: മൂലത്തിലെ പരാമർശരീതിയും സന്ദർഭാധീനതയും സംരക്ഷിച്ച് അനാവശ്യമായ വിശദീകരണം മുഖ്യവാചകത്തിൽ ചേർക്കാതിരിക്കുന്നു.
- issue: കാറ്റിൽ ആടുന്ന ഞാങ്ങണയുടെ സൂചന
  choice: രൂപകം വ്യാഖ്യാനിക്കാതെ വാചകത്തിൽ നിലനിർത്തി; വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകി
  alternative: അസ്ഥിരത സൂചിപ്പിക്കുന്ന വാക്കുകൾ മുഖ്യവാചകത്തിൽ ചേർക്കുക
  rationale: യേശുവിന്റെ ആലങ്കാരിക ചോദ്യത്തിന്റെ ശക്തിയും വ്യാഖ്യാനസാധ്യതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘മരുഭൂമി’, ‘ഞാങ്ങണ’ എന്നീ പദങ്ങൾ യെഹൂദ്യ പശ്ചാത്തലത്തിലെ ദൃശ്യത്തെ വ്യക്തമായി നിലനിർത്തുന്നു.
