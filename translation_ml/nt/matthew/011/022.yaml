id: MAT.11.22
reference: Matthew 11:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πλὴν λέγω ὑμῖν, Τύρῳ καὶ Σιδῶνι ἀνεκτότερον ἔσται ἐν ἡμέρᾳ κρίσεως ἢ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/022.yaml
  text: But I tell you[a], it will be more tolerable for Tyre and Sidon on the day of judgment than for you.
translation:
  language: ml
  text: 'എന്നാൽ ഞാൻ നിങ്ങളോടു പറയുന്നു: ന്യായവിധിദിവസത്തിൽ നിങ്ങളെക്കാൾ സോരിനും സീദോനും സഹിക്കാൻ എളുപ്പമായിരിക്കും.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കൂടുതൽ സഹനീയമായിരിക്കും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: എന്നാൽ
  rationale: മുൻപത്തെ ശാസനയോടുള്ള ശക്തമായ വൈരുധ്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: വ്യക്തിപരമായ അഭിസംബോധനയും ഗൗരവവും നിലനിർത്തുന്ന സ്വാഭാവിക മലയാള പ്രയോഗം.
- source_word: Τύρῳ καὶ Σιδῶνι
  choice: സോരിനും സീദോനും
  rationale: താരതമ്യനിർമ്മിതിയിലെ ദത്തിവ്, വിധി സഹിക്കേണ്ട കക്ഷികളെ സൂചിപ്പിക്കുന്നതായി മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἀνεκτότερον
  choice: സഹിക്കാൻ എളുപ്പമായിരിക്കും
  rationale: സഹിച്ചുനിൽക്കാവുന്നതിന്റെ താരതമ്യഭാവം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; 'കൂടുതൽ സഹനീയമായിരിക്കും' എന്ന ഔപചാരിക ബദൽ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἔσται
  choice: ആയിരിക്കും
  rationale: ഭാവികാലത്തിലുള്ള കോപുലാർ ക്രിയയെ മലയാള വാക്യഘടനയിൽ സ്വാഭാവികമായി ചേർക്കുന്നു.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: ന്യായവിധിദിവസത്തിൽ
  rationale: ഭാവിയിലെ ന്യായവിധിയുടെ സമയത്തെ വ്യക്തമായും സംക്ഷിപ്തമായും സൂചിപ്പിക്കുന്നു.
- source_word: ἢ ὑμῖν
  choice: നിങ്ങളെക്കാൾ
  rationale: അഭിസംബോധിതരോടുള്ള താരതമ്യം മലയാളത്തിൽ നേരിട്ടും സ്വാഭാവികമായും പൂർത്തിയാക്കുന്നു.
theological_decisions:
- issue: വരാനിരിക്കുന്ന വിധിയുടെ സ്വഭാവം
  choice: ന്യായവിധിദിവസത്തിൽ
  alternative: ഒരു ന്യായവിധിദിവസത്തിൽ
  rationale: ഗ്രീക്കിൽ ആർട്ടിക്കിൾ ഇല്ലെങ്കിലും മത്തായിയുടെ ഈ സന്ദർഭത്തിൽ അറിയപ്പെടുന്ന അന്തിമ ന്യായവിധിയെയാണ് പ്രയോഗം സൂചിപ്പിക്കുന്നത്. അധികമായ സിദ്ധാന്തവിവരങ്ങൾ ചേർക്കാതെ ആ അർഥം മലയാളത്തിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. സ്ഥലനാമങ്ങൾക്ക് മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ പരിചിതമായ ‘സോർ’ എന്നതിനു പകരം ഗ്രീക്ക് Τύρος-നോട് അടുത്ത ‘സോർ’/‘സോരു’ സാധ്യതകൾ പരിശോധിച്ചപ്പോൾ, പ്രസിദ്ധീകരണരീതിയിൽ സാധാരണമായ ‘സോർ’ തിരഞ്ഞെടുക്കേണ്ടതായിരുന്നു; എന്നാൽ സമർപ്പിത പാഠത്തിൽ ‘സോരിനും’ എന്ന വിഭക്തിരൂപം ഉപയോഗിച്ചിരിക്കുന്നു. ‘സഹിക്കാൻ എളുപ്പം’ മൂലപദത്തിന്റെ അനുഭവാത്മക അർഥം സുതാര്യമാക്കുന്നു.
