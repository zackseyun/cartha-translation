id: MAT.11.6
reference: Matthew 11:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ μακάριός ἐστιν ὃς ⸀ἐὰν μὴ σκανδαλισθῇ ἐν ἐμοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/006.yaml
  text: And blessed is the one who is not offended by me[a].
translation:
  language: ml
  text: എന്നെച്ചൊല്ലി ഇടറാത്തവൻ ഭാഗ്യവാൻ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്നെച്ചൊല്ലി മനസ്സിടറാത്തവൻ” / “ഞാൻ നിമിത്തം ഇടറാത്തവൻ.”
    reason: σκανδαλισθῇ ἐν ἐμοί എന്ന പ്രയോഗത്തിന് ‘യേശുവിനെച്ചൊല്ലി ഇടറുക,’ ‘മനസ്സിടറുക/അപമാനബോധം തോന്നുക,’ ‘യേശു നിമിത്തം ഇടറുക’ എന്നീ അടുത്ത അർത്ഥസാധ്യതകളുണ്ട്.
lexical_decisions:
- source_word: καί
  choice: —
  rationale: മുൻസന്ദർഭത്തോടുള്ള ബന്ധം മലയാളത്തിലെ പ്രവാഹത്തിൽ വേറൊരു ‘കൂടാതെ/എന്നും’ ചേർക്കാതെ സ്വാഭാവികമായി നിലനിൽക്കുന്നു; വാക്യാരംഭത്തിലെ ‘എന്നിൽ’ ആ ബന്ധം മുറിക്കുന്നില്ല.
- source_word: μακάριος
  choice: അനുഗൃഹീതൻ
  rationale: സാധാരണ വികാരമായ ‘സന്തോഷവാൻ’ എന്നതിലുപരി ദൈവിക അംഗീകാരവും അനുഗ്രഹാവസ്ഥയും സൂചിപ്പിക്കുന്ന മക്കാര്യോസ് എന്ന പദത്തിന്റെ മതപരമായ ഭാരം നിലനിർത്തുന്നു.
- source_word: ὃς ἐὰν μὴ
  choice: ഇടറിപ്പോകാത്തവൻ
  rationale: അനിശ്ചിതവും പൊതുവുമായ വ്യവസ്ഥയെ ഏകവചന പ്രതിനിധിരൂപത്തിൽ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: σκανδαλισθῇ
  choice: ഇടറിപ്പോകാത്ത
  rationale: ക്രിയയുടെ ഇടർച്ച എന്ന രൂപകം നിലനിർത്തുകയും വെറും മാനസിക അസന്തോഷമായി അർത്ഥം ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു; സന്ദർഭത്തിൽ വിശ്വാസത്തിൽ തടസ്സപ്പെടുകയോ പിന്മാറുകയോ ചെയ്യുന്നതിന്റെ സാധ്യതയും തുറന്നുവയ്ക്കുന്നു.
- source_word: ἐν ἐμοί
  choice: എന്നിൽ
  rationale: 'ഗ്രീക്ക് ἐν ἐμοίയുടെ ബന്ധപരമായ അസ്പഷ്ടത പരമാവധി കാത്തുസൂക്ഷിക്കുന്നു: യേശുവിനെ സംബന്ധിച്ചോ അവൻ നിമിത്തമോ ഇടറുക എന്ന ആശയം ഉൾക്കൊള്ളാം.'
theological_decisions:
- issue: യേശുവിനോടുള്ള പ്രതികരണത്തിൽ σκανδαλισθῇ എന്നതിന്റെ ശക്തി
  choice: 'ഇടർച്ചയുടെ രൂപകം മുഖ്യവാചകത്തിൽ നിലനിർത്തി: ‘എന്നിൽ ഇടറിപ്പോകാത്തവൻ.’'
  alternative: ‘എന്നെച്ചൊല്ലി മനസ്സിടറാത്തവൻ’ / ‘ഞാൻ നിമിത്തം വിശ്വാസത്തിൽ തടസ്സപ്പെടാത്തവൻ’
  rationale: ഇത് വെറും വികാരപരമായ അപമാനബോധമെന്നാക്കി ചുരുക്കാതെ, യേശുവും അവന്റെ പ്രവൃത്തികളും ഒരാൾക്കു വിശ്വാസതടസ്സമാകാവുന്ന ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അനുഗൃഹീതൻ’ സുവിശേഷങ്ങളിലെ അനുഗ്രഹപ്രഖ്യാപനത്തിന് യോജിച്ച മതപരമായ ഭാരം നൽകുന്നു; ‘ഇടറിപ്പോകുക’ മൂലഭാഷയിലെ രൂപകം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നിലനിർത്തുന്നു.
