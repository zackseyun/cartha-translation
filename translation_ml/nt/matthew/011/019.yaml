id: MAT.11.19
reference: Matthew 11:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἦλθεν ὁ υἱὸς τοῦ ἀνθρώπου ἐσθίων καὶ πίνων, καὶ λέγουσιν· Ἰδοὺ ἄνθρωπος φάγος καὶ οἰνοπότης, τελωνῶν φίλος καὶ ἁμαρτωλῶν. καὶ ἐδικαιώθη ἡ σοφία ἀπὸ τῶν ⸀ἔργων αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/019.yaml
  text: The Son of Man came eating and drinking[a], and they say, ‘Look, a glutton and a drunkard[b], a friend of tax collectors and sinners!’ And wisdom was justified by her works.
translation:
  language: ml
  text: 'മനുഷ്യപുത്രൻ തിന്നുകയും കുടിക്കുകയും ചെയ്തുകൊണ്ട് വന്നു, അവർ പറയുന്നു: ‘ഇതാ, ഒരു പെരുന്തീനിയും മദ്യപാനിയും, ചുങ്കക്കാരുടെയും പാപികളുടെയും സുഹൃത്ത്!’ ജ്ഞാനം തന്റെ പ്രവൃത്തികളാൽ നീതീകരിക്കപ്പെട്ടു.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ജ്ഞാനം തന്റെ പ്രവൃത്തികളാൽ ശരിയാണെന്ന് തെളിയിക്കപ്പെട്ടു.’
    reason: lexical_alternative
  - marker: b
    text: 'ചില കൈയെഴുത്തുപ്രതികളിൽ ‘പ്രവൃത്തികൾ’ എന്നതിനുപകരം ‘മക്കൾ’ എന്നു വായിക്കുന്നു: ‘ജ്ഞാനം തന്റെ മക്കളാൽ നീതീകരിക്കപ്പെട്ടു.’'
    reason: textual_variant
lexical_decisions:
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: യേശുവിന്റെ സ്വയംപരാമർശമായ പദവിയുടെ സെമിറ്റിക് പശ്ചാത്തലവും സ്ഥാപിതമായ ബൈബിൾപ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: ἐσθίων καὶ πίνων
  choice: തിന്നുകയും കുടിക്കുകയും ചെയ്തുകൊണ്ട്
  rationale: യോഹന്നാന്റെ സന്ന്യാസസദൃശമായ ജീവിതരീതിയോടുള്ള സന്ദർഭപരമായ വൈരുധ്യം അതിശയോക്തിയില്ലാതെ നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: Ἰδοὺ
  choice: ഇതാ
  rationale: പരസ്യമായ കുറ്റാരോപണത്തിന്റെ ചൂണ്ടിക്കാട്ടുന്ന, ഉദ്‌ഘോഷാത്മകമായ ശക്തി സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: φάγος
  choice: തീറ്റപ്രിയൻ
  rationale: അമിതമായി ഭക്ഷിക്കുന്നവൻ എന്ന നിന്ദാത്മകമായ ആരോപണം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: οἰνοπότης
  choice: മദ്യപാനി
  rationale: ഇത് വെറും വീഞ്ഞു കുടിക്കുന്നവൻ എന്ന നിഷ്പക്ഷ പ്രസ്താവനയല്ല, അമിതപാനത്തെക്കുറിച്ചുള്ള നിന്ദയാണ്; ‘മദ്യപാനി’ ആ ആരോപണത്തിന്റെ ഭാവം നൽകുന്നു.
- source_word: τελωνῶν φίλος καὶ ἁμαρτωλῶν
  choice: ചുങ്കക്കാരുടെയും പാപികളുടെയും സുഹൃത്ത്
  rationale: മൂലത്തിലെ ജനിറ്റീവ് ഘടനയും സാമൂഹിക-മതപരമായ മുദ്രകുത്തലിന്റെ ശക്തിയും നിലനിർത്തുന്നു.
- source_word: ἐδικαιώθη
  choice: നീതീകരിക്കപ്പെട്ടു
  rationale: ശരിയെന്നോ നീതിയുള്ളതെന്നോ തെളിയിക്കപ്പെട്ടു എന്ന സന്ദർഭാർഥത്തോടൊപ്പം δικαιόω എന്ന ക്രിയയുടെ വിശാലമായ ബൈബിൾബന്ധവും സംരക്ഷിക്കുന്നു; കൂടുതൽ വ്യാഖ്യാനാത്മകമായ രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἡ σοφία
  choice: ജ്ഞാനം
  rationale: ജ്ഞാനത്തെ വ്യക്തിവൽക്കരിക്കുന്ന പ്രയോഗം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ അതേപടി നിലനിർത്തുന്നു.
- source_word: ἀπὸ τῶν ἔργων αὐτῆς
  choice: തന്റെ പ്രവൃത്തികളാൽ
  rationale: SBLGNT-യിലെ ‘പ്രവൃത്തികൾ’ എന്ന വായന പിന്തുടരുകയും വ്യക്തിവൽക്കരിച്ച ജ്ഞാനത്തിന്റെ സ്വന്തം പ്രവർത്തനങ്ങൾ അതിനെ ശരിവയ്ക്കുന്നു എന്ന ആശയം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: അവസാന വാക്യഭാഗത്തിലെ ‘ജ്ഞാനം’ ആരെയോ എന്തിനെയോ സൂചിപ്പിക്കുന്നു എന്ന ചോദ്യം
  choice: ‘ജ്ഞാനം’ എന്ന വ്യക്തിവൽക്കരിച്ച പ്രയോഗം വിശദീകരിച്ചു ചുരുക്കാതെ നിലനിർത്തി.
  alternative: ഇത് യേശുവിനെയോ ദൈവത്തിന്റെ രക്ഷാപദ്ധതിയെയോ നേരിട്ട് സൂചിപ്പിക്കുന്നു എന്ന് വ്യക്തമാക്കുക.
  rationale: വാക്യം ആ തിരിച്ചറിയൽ തുറന്നുപറയുന്നില്ല; അതിനാൽ സാഹിത്യപരവും ദൈവശാസ്ത്രപരവുമായ പിരിമുറുക്കം സംരക്ഷിക്കുന്നു.
- issue: അവസാന വാക്യഭാഗത്തിന്റെ പാഠരൂപം
  choice: SBLGNT അനുസരിച്ച് ‘പ്രവൃത്തികൾ’ പ്രധാന പാഠത്തിൽ സ്വീകരിച്ചു.
  alternative: ചില കൈയെഴുത്തുപ്രതികളിലെ ‘മക്കൾ’ എന്ന വായന സ്വീകരിക്കുക.
  rationale: നൽകിയിരിക്കുന്ന മൂലപാഠം ἔργων എന്നാണ് വായിക്കുന്നത്; പ്രസിദ്ധമായ τέκνων എന്ന പാഠഭേദം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. കുറ്റാരോപണങ്ങളിലെ നിന്ദാഭാവം നിലനിർത്തിയെങ്കിലും അനാവശ്യമായി കടുപ്പിച്ചില്ല. ‘ജ്ഞാനം’ എന്ന വ്യക്തിവൽക്കരണം ‘തന്റെ’ എന്ന പ്രയോഗത്തിലൂടെ സൂക്ഷിച്ചു.
