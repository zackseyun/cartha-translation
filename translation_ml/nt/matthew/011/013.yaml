  source_fidelity: ഗ്രീക്കിലെ πάντες γὰρ οἱ προφῆται καὶ ὁ νόμος ἕως Ἰωάννου ἐπροφήτευσαν എന്ന വാക്യത്തിന്റെ ഘടകങ്ങളും ബന്ധകശക്തിയും കൃത്യമായി നിലനിർത്തിയിട്ടുണ്ട്. ‘ന്യായപ്രമാണം’ എന്ന ഏകവചനകർതൃവും ‘പ്രവാചകന്മാർ’ എന്ന ബഹുവചനകർതൃവും ഒരേ ‘പ്രവചിച്ചു’ എന്ന ക്രിയയോടു ചേരുന്നതിലൂടെ മൂലത്തിലെ വ്യക്തിവൽക്കരണവും സംരക്ഷിക്കുന്നു. ‘യോഹന്നാൻവരെ’ ἕως Ἰωάννου-യുടെ ഉൾക്കൊള്ളൽ/അതിർത്തി സംബന്ധമായ അവ്യക്തത നിർബന്ധിതമായി തീർപ്പാക്കുന്നില്ല.
