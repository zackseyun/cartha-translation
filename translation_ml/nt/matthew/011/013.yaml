  text: πάντες γὰρ οἱ προφῆται καὶ ὁ νόμος ἕως Ἰωάννου ἐπροφήτευσαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/013.yaml
  text: For all the prophets and the Law prophesied until John[a].
translation:
  language: ml
  text: എന്തെന്നാൽ, എല്ലാ പ്രവാചകന്മാരും ന്യായപ്രമാണവും യോഹന്നാൻവരെ പ്രവചിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “യോഹന്നാനോളം” അല്ലെങ്കിൽ “യോഹന്നാന്റെ കാലംവരെ.” ഈ പ്രയോഗം യോഹന്നാനെ പ്രവാചകസാക്ഷ്യത്തിന്റെ പര്യവസാനമായി അവതരിപ്പിക്കുകയോ അതിന്റെ പരിവർത്തനഘട്ടത്തെ അടയാളപ്പെടുത്തുന്ന അതിർത്തിയായി കാണിക്കുകയോ ചെയ്യാം.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: എല്ലാ
  rationale: οἱ προφῆται എന്ന മുഴുവൻ കൂട്ടത്തെയും സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ മലയാള പ്രയോഗം.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിന് വിശദീകരണമോ അടിസ്ഥാനമോ നൽകുന്ന ബന്ധകശക്തി നിലനിർത്തുന്നു.
- source_word: οἱ προφῆται
  choice: പ്രവാചകന്മാർ
  rationale: ദൈവത്തിന്റെ പേരിൽ പ്രവചനസന്ദേശം അറിയിക്കുന്നവരെ സൂചിപ്പിക്കുന്ന സ്ഥിരവും സ്വാഭാവികവുമായ മലയാള പദം.
- source_word: ὁ νόμος
  choice: ന്യായപ്രമാണം
  rationale: പൊതുവായ നിയമത്തെയല്ല, ഇസ്രായേലിന്റെ അംഗീകൃത തിരുവെഴുത്തുസമുച്ചയമായ മോശെയുടെ ന്യായപ്രമാണത്തെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
- source_word: ἕως Ἰωάννου
  choice: യോഹന്നാൻവരെ
  rationale: കാലപരിധി സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുമ്പോഴും യോഹന്നാൻ പ്രവാചകസാക്ഷ്യത്തിന്റെ പര്യവസാനത്തിൽ ഉൾപ്പെടുന്നുവോ അതിന്റെ അതിർത്തി കുറിക്കുന്നുവോ എന്ന അവ്യക്തത നിലനിർത്തുന്നു.
- source_word: ἐπροφήτευσαν
  choice: പ്രവചിച്ചു
  rationale: ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നൽകുകയും പ്രവാചകന്മാരോടൊപ്പം ന്യായപ്രമാണവും പ്രവചനസാക്ഷ്യം വഹിച്ചു എന്ന വ്യക്തിവൽക്കരണം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ὁ νόμος എന്നത് പൊതുവായ നിയമമായോ തിരുവെഴുത്തുസമുച്ചയമായോ വിവർത്തനം ചെയ്യണോ
  choice: ന്യായപ്രമാണം
  alternative: നിയമം
  rationale: ‘പ്രവാചകന്മാരും ന്യായപ്രമാണവും’ എന്ന കൂട്ടുപ്രയോഗത്തിൽ ഇസ്രായേലിന്റെ അംഗീകൃത തിരുവെഴുത്തുസാക്ഷ്യമാണ് ഉദ്ദേശിക്കുന്നത്; പൊതുവായ നിയമതത്ത്വമല്ല.
- issue: ἕως Ἰωάννου എന്നത് യോഹന്നാനെ പ്രവാചകയുഗത്തിൽ ഉൾപ്പെടുത്തുന്നുവോ അതിന്റെ അവസാന അതിർത്തിയായി മാത്രം കാണിക്കുന്നുവോ
  choice: യോഹന്നാൻവരെ
  alternative: യോഹന്നാന്റെ കാലംവരെ
  rationale: ഗ്രീക്ക് പ്രയോഗം വ്യാഖ്യാനപ്രശ്നം പൂർണമായി തീർപ്പാക്കുന്നില്ല. തിരഞ്ഞെടുത്ത രൂപം കാലപരിധി നിലനിർത്തുകയും ഏതെങ്കിലും ദൈവശാസ്ത്രപരമായ നിഗമനം നിർബന്ധിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ന്യായപ്രമാണം’ എന്ന പരിചിതമായ തിരുവെഴുത്തുപദം നിലനിർത്തി; ഗ്രീക്കിലെ ന്യായപ്രമാണത്തിന്റെ വ്യക്തിവൽക്കരണവും യോഹന്നാനെക്കുറിച്ചുള്ള കാലപരിധിയുടെ യഥാർഥ അവ്യക്തതയും സംരക്ഷിച്ചു.
