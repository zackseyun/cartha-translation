id: MAT.11.12
reference: Matthew 11:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπὸ δὲ τῶν ἡμερῶν Ἰωάννου τοῦ βαπτιστοῦ ἕως ἄρτι ἡ βασιλεία τῶν οὐρανῶν βιάζεται, καὶ βιασταὶ ἁρπάζουσιν αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/012.yaml
  text: But from the days of John the Baptist until now[a], the kingdom of heaven suffers violence, and violent men seize it.
translation:
  language: ml
  text: എന്നാൽ സ്നാപകനായ യോഹന്നാന്റെ നാളുകൾ മുതൽ ഇന്നുവരെ സ്വർഗരാജ്യം അക്രമത്തിനിരയാകുന്നു; അക്രമികൾ അതിനെ പിടിച്ചെടുക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “സ്വർഗരാജ്യം ശക്തിയോടെ മുന്നേറുന്നു; ബലപ്രയോഗം ചെയ്യുന്നവർ അതിനെ പിടിച്ചെടുക്കുന്നു.” ‘അക്രമത്തിനിരയാകുന്നു’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ഗ്രീക്ക് ക്രിയയെ മധ്യാർത്ഥത്തിലും മനസ്സിലാക്കാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπὸ δὲ
  choice: എന്നാൽ ... മുതൽ
  rationale: ἀπό സൂചിപ്പിക്കുന്ന ആരംഭബിന്ദു ‘മുതൽ’ എന്നു നിലനിർത്തുന്നു; δέയിലെ മൃദുവായ വ്യവഹാരമാറ്റം ‘എന്നാൽ’കൊണ്ട് പ്രകടമാക്കുന്നു.
- source_word: τῶν ἡμερῶν Ἰωάννου τοῦ βαπτιστοῦ
  choice: സ്നാപകനായ യോഹന്നാന്റെ നാളുകൾ
  rationale: ഗ്രീക്കിലെ ‘നാളുകൾ’ എന്ന കാലസൂചക പ്രയോഗം നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἕως ἄρτι
  choice: ഇന്നുവരെ
  rationale: യോഹന്നാന്റെ നാളുകൾമുതൽ യേശു സംസാരിക്കുന്ന ഇപ്പോഴത്തെ സമയംവരെയുള്ള തുടർച്ച സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: സ്വർഗരാജ്യം
  rationale: മത്തായിയുടെ സവിശേഷ പ്രയോഗത്തിന് മലയാളത്തിൽ സ്ഥാപിതവും സ്വാഭാവികവുമായ തുല്യപദം; രാജത്വം/രാജ്യം എന്ന അർത്ഥവ്യാപ്തി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: βιάζεται
  choice: അക്രമം സഹിക്കുന്നു
  rationale: മധ്യ/കർമണി രൂപത്തിലെ പ്രസിദ്ധമായ ദ്വയാർഥതയിൽ കർമണി വായന മുഖ്യപാഠത്തിൽ സ്വീകരിക്കുന്നു. തുടർന്നുള്ള βιασταί എന്ന പദവുമായി ഇത് സ്വാഭാവികമായി ബന്ധപ്പെടുന്നു; മധ്യാർത്ഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: βιασταὶ
  choice: അക്രമികൾ
  rationale: ബലം അല്ലെങ്കിൽ അക്രമം പ്രയോഗിക്കുന്നവരെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപദം. ഗ്രീക്കിലെ പുരുഷലിംഗ ബഹുവചനം മലയാളത്തിൽ നിർബന്ധമായി പുരുഷന്മാർക്കു മാത്രമായി ചുരുക്കാതെ വ്യക്തികളെ സൂചിപ്പിക്കുന്നു.
- source_word: ἁρπάζουσιν αὐτήν
  choice: അതിനെ ബലമായി പിടിച്ചെടുക്കുന്നു
  rationale: ἁρπάζωയിലെ ബലപ്രയോഗത്തോടെയുള്ള പിടിച്ചെടുക്കൽ എന്ന ശക്തമായ ഭാവം വ്യക്തമാക്കുന്നു; വെറും ‘പിടിക്കുന്നു’ എന്നതിനെക്കാൾ ഉറവിടത്തോട് ചേർന്നതാണ്.
theological_decisions:
- issue: രാജ്യത്തോടുള്ള ബന്ധത്തിൽ βιάζεται എന്ന ക്രിയയുടെ വ്യാഖ്യാനം
  choice: 'മുഖ്യപാഠത്തിൽ കർമണി അർത്ഥം: ‘സ്വർഗരാജ്യം അക്രമം സഹിക്കുന്നു’'
  alternative: 'മധ്യ/അകർമക അർത്ഥം: ‘സ്വർഗരാജ്യം ശക്തിയോടെ മുന്നേറുന്നു; ശക്തിയുള്ളവർ അതിനെ കൈവശമാക്കുന്നു’'
  rationale: ഗ്രീക്ക് രൂപം കർമണി അർത്ഥത്തിലോ മധ്യ/അകർമക അർത്ഥത്തിലോ മനസ്സിലാക്കാവുന്നതാണ്. പിന്നാലെയുള്ള ‘അക്രമികൾ ... ബലമായി പിടിച്ചെടുക്കുന്നു’ എന്ന വാക്യഭാഗത്തോട് കർമണി വായന നന്നായി ചേരുന്നതിനാൽ അത് മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; യഥാർഥമായ വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സ്നാപകൻ’, ‘സ്വർഗരാജ്യം’ എന്നീ പരിചിത ബൈബിൾപദങ്ങൾ നിലനിർത്തി; വിവാദമായ ഗ്രീക്ക് ക്രിയയുടെ ദ്വയാർഥത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
