id: MAT.11.25
reference: Matthew 11:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐν ἐκείνῳ τῷ καιρῷ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν· Ἐξομολογοῦμαί σοι, πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς, ὅτι ⸀ἔκρυψας ταῦτα ἀπὸ σοφῶν καὶ συνετῶν, καὶ ἀπεκάλυψας αὐτὰ νηπίοις·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/025.yaml
  text: At that time Jesus answered and said[a], “I praise you, Father, Lord of heaven and earth, because you hid these things from the wise and understanding[b], and revealed them to little children.”
translation:
  language: ml
  text: 'ആ സമയത്ത് യേശു മറുപടിയായി പറഞ്ഞു: “പിതാവേ, സ്വർഗത്തിന്റെയും ഭൂമിയുടെയും കർത്താവേ, ഞാൻ അങ്ങയെ സ്തുതിക്കുന്നു[a], കാരണം ജ്ഞാനികളിൽനിന്നും വിവേകികളിൽനിന്നും ഈ കാര്യങ്ങൾ മറച്ചുവെക്കുകയും ശിശുക്കൾക്ക്[b] അവ വെളിപ്പെടുത്തുകയും ചെയ്തിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഞാൻ അങ്ങേക്കു നന്ദി പറയുന്നു” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് ക്രിയയ്ക്ക് സ്തുതി, നന്ദി, പരസ്യമായ അംഗീകാരം എന്നീ അർഥഭാവങ്ങൾ പ്രകടിപ്പിക്കാനാകും.
    reason: lexical_alternative
  - marker: b
    text: “ശിശുക്കൾ” എന്നത് അക്ഷരാർഥത്തിൽ വളരെ ചെറിയ കുട്ടികളെയോ കുഞ്ഞുങ്ങളെയോ സൂചിപ്പിക്കാം; ഇവിടെ വിനയത്തോടെയും കുട്ടികളെപ്പോലെയുള്ള സ്വീകാര്യതയോടെയും ഉള്ളവരെ രൂപകമായി സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: ആ സമയത്ത്
  rationale: ആഖ്യാനത്തിലെ കാലസൂചന സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു; നിമിഷതലത്തിലുള്ള ഉടൻതന്നെയെന്ന അർഥം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: മറുപടിയായി പറഞ്ഞു
  rationale: രണ്ട് ഗ്രീക്ക് ക്രിയകളുടെയും പ്രതികരണസ്വഭാവവും സംസാരപ്രവൃത്തിയും സ്വാഭാവിക മലയാളത്തിൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; നേരിട്ടൊരു ചോദ്യം ഇല്ലെങ്കിലും സൂത്രപ്രയോഗത്തിന്റെ ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: Ἐξομολογοῦμαί σοι
  choice: ഞാൻ അങ്ങയെ സ്തുതിക്കുന്നു
  rationale: ഇവിടെ പിതാവിനോടുള്ള പരസ്യമായ അംഗീകാരവും സ്തുതിയും പ്രകടമാകുന്നു. പാപസമ്മതം എന്ന തെറ്റായ ധാരണ ഒഴിവാക്കുന്നു; നന്ദി അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς
  choice: പിതാവേ, സ്വർഗത്തിന്റെയും ഭൂമിയുടെയും കർത്താവേ
  rationale: രണ്ടു സംബോധനകളും ദൈവിക പരമാധികാരവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: ὅτι
  choice: ചെയ്തതിനാൽ
  rationale: സ്തുതിയുടെ കാരണത്തെ വ്യക്തമാക്കുന്ന ഗ്രീക്ക് ബന്ധത്തിന്റെ കാരണാർഥം സ്വാഭാവിക മലയാള വാക്യഘടനയിൽ നൽകുന്നു.
- source_word: ἔκρυψας
  choice: മറച്ചുവെക്കുകയും
  rationale: പിതാവിനെ കർത്താവായി നിലനിർത്തുന്ന സജീവക്രിയ നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: ταῦτα ... αὐτά
  choice: ഈ കാര്യങ്ങൾ ... അവ
  rationale: പരാമർശിക്കുന്നത് എന്താണെന്ന ഉറവിടത്തിലെ തുറന്ന നില സംരക്ഷിക്കുന്നു.
- source_word: ἀπὸ σοφῶν καὶ συνετῶν
  choice: ജ്ഞാനികളിൽനിന്നും വിവേകികളിൽനിന്നും
  rationale: ജ്ഞാനവും ഗ്രഹണശേഷി/വിവേചനവും സൂചിപ്പിക്കുന്ന സമാന്തര നാമീകൃത വിശേഷണങ്ങളെ വേർതിരിച്ച് നിലനിർത്തുന്നു.
- source_word: ἀπεκάλυψας
  choice: വെളിപ്പെടുത്തുകയും ചെയ്തു
  rationale: ദൈവിക വെളിപ്പെടുത്തലിനെ സൂചിപ്പിക്കുന്ന സാധാരണവും ദൈവശാസ്ത്രപരമായി യോജിച്ചതുമായ പദപ്രയോഗം.
- source_word: νηπίοις
  choice: ശിശുക്കൾക്ക്
  rationale: ഗ്രീക്കിലെ ശക്തമായ ശിശു-രൂപകം വ്യാഖ്യാനപരമായി ‘വിനീതർ’ എന്നു മാറ്റാതെ നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ രൂപകാലങ്കാരസാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: മറയ്ക്കുന്നതിലും വെളിപ്പെടുത്തുന്നതിലും ദൈവിക കർത്തൃത്വം
  choice: “മറച്ചുവെക്കുകയും ... വെളിപ്പെടുത്തുകയും ചെയ്തതിനാൽ” എന്ന നേരിട്ടുള്ള ദൈവിക കർത്തൃത്വം നിലനിർത്തി.
  alternative: “മറഞ്ഞിരിക്കാൻ അനുവദിച്ചു” എന്ന അനുമതിസൂചകമായ മൃദൂകരണം.
  rationale: ഗ്രീക്കിൽ പിതാവാണ് രണ്ടു സജീവക്രിയകളുടെയും നേരിട്ടുള്ള കർത്താവ്. അതിനാൽ മുൻനിർണ്ണയം, ന്യായവിധിജന്യ കാഠിന്യം തുടങ്ങിയ വ്യവസ്ഥാപിത വിശദീകരണങ്ങൾ ചേർക്കാതെയും വാചകത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നീക്കാതെയും അത് സംരക്ഷിക്കുന്നു.
- issue: νηπίοις എന്നതിന്റെ അർഥം
  choice: “ശിശുക്കൾക്ക്” എന്ന ദൃശ്യരൂപകം നിലനിർത്തി.
  alternative: “വിനീതർക്ക്” എന്ന വ്യാഖ്യാനപരമായ അമൂർത്തീകരണം, അല്ലെങ്കിൽ “കൊച്ചുകുട്ടികൾക്ക്” എന്ന പ്രായസൂചന കൂടുതൽ വിശാലമാക്കുന്ന പരിഭാഷ.
  rationale: ഈ പദം അക്ഷരാർഥത്തിൽ ശിശുക്കളെ സൂചിപ്പിക്കാമെങ്കിലും ഇവിടെ രൂപകാലങ്കാരപരമായ പ്രയോഗം സാധ്യതയുള്ളതാണ്. പരിഭാഷ ആ രൂപകത്തെ നിലനിർത്തുകയും അടിക്കുറിപ്പ് അതിന്റെ സന്ദർഭാർഥം സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ദൈവത്തോടുള്ള സംബോധനയിൽ ആദരസൂചകമായ “അങ്ങ്” ഉപയോഗിച്ചു. ഉറവിടത്തിലെ സജീവ ദൈവിക കർത്തൃത്വവും ‘ശിശുക്കൾ’ എന്ന രൂപകവും വ്യാഖ്യാനിച്ച് ലഘൂകരിക്കാതെ നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട വാക്കുകൾക്ക് സമീപം ചേർത്തിരിക്കുന്നു.
