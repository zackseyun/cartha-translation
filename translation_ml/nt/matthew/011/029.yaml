id: MAT.11.29
reference: Matthew 11:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἄρατε τὸν ζυγόν μου ἐφ’ ὑμᾶς καὶ μάθετε ἀπ’ ἐμοῦ, ὅτι πραΰς εἰμι καὶ ταπεινὸς τῇ καρδίᾳ, καὶ εὑρήσετε ἀνάπαυσιν ταῖς ψυχαῖς ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/029.yaml
  text: Take my yoke upon you and learn from me[a], because I am gentle and humble in heart, and you will find rest for your souls.
translation:
  language: ml
  text: എന്റെ നുകം നിങ്ങളുടെമേൽ എടുത്തുകൊള്ളുവിൻ; എന്നിൽനിന്ന് പഠിക്കുവിൻ[a]. എന്തെന്നാൽ, ഞാൻ സൗമ്യനും ഹൃദയത്തിൽ താഴ്മയുള്ളവനും ആകുന്നു; അങ്ങനെ നിങ്ങളുടെ ജീവന് വിശ്രമം ലഭിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ സൗമ്യനും ഹൃദയത്തിൽ എളിയവനും ആകുന്നു.”
    reason: πραΰς ... ταπεινὸς τῇ καρδίᾳ എന്ന പ്രയോഗത്തിന് ഇംഗ്ലീഷ് POB രേഖപ്പെടുത്തുന്ന ‘meek and lowly in heart’ എന്ന ലെക്സിക്കൽ ബദൽ മലയാളത്തിൽ രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: ἄρατε τὸν ζυγόν μου ἐφ’ ὑμᾶς
  choice: എന്റെ നുകം നിങ്ങളുടെമേൽ ഏറ്റുകൊണ്ട്
  rationale: നുകം ചുമക്കുക/സ്വീകരിക്കുക എന്ന രൂപകം നിലനിർത്തിക്കൊണ്ട്, αἴρωയും ἐπί + accusative-ഉം ചേർന്ന പ്രയോഗത്തിന്റെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: μάθετε ἀπ’ ἐμοῦ
  choice: എന്നിൽനിന്നു പഠിക്കുവിൻ
  rationale: യേശുവിൽനിന്നു പഠിക്കാനുള്ള ബഹുവചന ആജ്ഞ നേരിട്ടും മാന്യമായും നൽകുന്നു.
- source_word: ὅτι
  choice: എന്തെന്നാൽ
  rationale: തുടർന്നുള്ള സ്വഭാവവിവരണം പഠിക്കാനുള്ള ആഹ്വാനത്തിന്റെ കാരണം ആണെന്ന വിശദീകരണബന്ധം നിലനിർത്തുന്നു.
- source_word: πραΰς
  choice: സൗമ്യൻ
  rationale: ബലഹീനത എന്ന അനാവശ്യ ധ്വനി ഒഴിവാക്കി, കാഠിന്യമില്ലാത്ത മൃദുസ്വഭാവം വ്യക്തമാക്കുന്നു.
- source_word: ταπεινὸς τῇ καρδίᾳ
  choice: ഹൃദയത്തിൽ താഴ്മയുള്ളവൻ
  rationale: ταπεινός എന്നതിന്റെ താഴ്മയും τῇ καρδίᾳ സൂചിപ്പിക്കുന്ന ആന്തരിക മനോഭാവവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: εὑρήσετε ἀνάπαυσιν
  choice: വിശ്രമം കണ്ടെത്തും
  rationale: ഭാവികാല വാഗ്ദാനവും തിരുവെഴുത്തിലെ വിശ്രമരൂപകവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: ταῖς ψυχαῖς ὑμῶν
  choice: നിങ്ങളുടെ പ്രാണന്
  rationale: ψυχήയെ വെറും വേർതിരിക്കപ്പെട്ട ആത്മാവായി ചുരുക്കാതെ വ്യക്തിയുടെ ആന്തരിക ജീവൻ/സ്വയം എന്ന വിശാല അർഥം വഹിക്കുന്ന പരമ്പരാഗത മലയാള പദം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: πραΰς ... καὶ ταπεινὸς τῇ καρδίᾳ എന്ന യേശുവിന്റെ സ്വഭാവവിവരണം
  choice: ഞാൻ സൗമ്യനും ഹൃദയത്തിൽ താഴ്മയുള്ളവനും ആകുന്നു
  alternative: ഞാൻ ശാന്തനും ഹൃദയത്തിൽ എളിയവനും ആകുന്നു
  rationale: യേശുവിന്റെ സ്വയംവിവരണം ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; ‘സൗമ്യൻ’ കാഠിന്യമില്ലായ്മയും ‘താഴ്മയുള്ളവൻ’ ആന്തരിക വിനയവും അറിയിക്കുന്നു, ഏതെങ്കിലും പ്രത്യേക സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കാതെ.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. കേന്ദ്രമായ ‘നുകം’ എന്ന രൂപകം വിവർത്തനത്തിൽ സംരക്ഷിച്ചിട്ടുണ്ട്; ആജ്ഞകൾക്ക് തിരുവെഴുത്തുശൈലിയിലുള്ള ബഹുവചന ആദരരൂപം ഉപയോഗിച്ചു.
