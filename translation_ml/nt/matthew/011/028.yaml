review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the invitation, its universal scope, and the promised rest. However, “ഭാരം ചുമക്കുകയും” presents πεφορτισμένοι as actively carrying a burden, whereas the Greek perfect passive denotes people who have been burdened/loaded down and remain so.
  naturalness: “അധ്വാനിക്കുകയും ഭാരം ചുമക്കുകയും ചെയ്യുന്നവരേ, നിങ്ങൾ എല്ലാവരും” is somewhat redundant and syntactically less natural. A coordinated description followed by “എല്ലാവരും” is clear, modern, and dignified.
  terminology: “വിശ്രമം നൽകും” is an appropriate broad rendering of ἀναπαύσω. The lexical-alternative footnote belongs at this expression, not at the end of the sentence. “ഭാരപ്പെട്ടിരിക്കുന്ന” suitably conveys the resultant state of the Greek perfect passive without adding interpretive specificity.
  issues:
  - severity: medium
    issue: Active rendering of πεφορτισμένοι
    rationale: '“ഭാരം ചുമക്കുകയും” means ‘carry a burden’ and can imply the subjects’ active action. πεφορτισμένοι is perfect passive: ‘having been burdened/loaded down,’ with the resulting state continuing.'
  - severity: low
    issue: Footnote anchor placement
    rationale: The footnote explains the verb ἀναπαύσω, so its anchor should immediately follow “വിശ്രമം നൽകും.”
  - severity: low
    issue: Redundant and awkward addressee construction
    rationale: The vocative phrase followed by “നിങ്ങൾ എല്ലാവരും” repeats the inclusive addressee and is less smooth than a single inclusive noun phrase.
