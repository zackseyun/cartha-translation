id: MAT.11.28
reference: Matthew 11:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Δεῦτε πρός με πάντες οἱ κοπιῶντες καὶ πεφορτισμένοι, κἀγὼ ἀναπαύσω ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/028.yaml
  text: Come to me[a], all who labor and are burdened[b], and I will give you rest.
translation:
  language: ml
  text: അധ്വാനിക്കുകയും ഭാരപ്പെട്ടിരിക്കുകയും ചെയ്യുന്ന എല്ലാവരും, എന്റെ അടുക്കൽ വരുവിൻ; ഞാൻ നിങ്ങൾക്കു വിശ്രമം നൽകും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ നിങ്ങളെ ഉന്മേഷിപ്പിക്കും” അല്ലെങ്കിൽ “ആശ്വസിപ്പിക്കും.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ക്രിയയ്ക്ക് ഒരാളെ വിശ്രമിപ്പിക്കുക, ഉന്മേഷിപ്പിക്കുക, അല്ലെങ്കിൽ ആശ്വസിപ്പിക്കുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δεῦτε πρός με
  choice: എന്റെ അടുക്കൽ വരുവിൻ
  rationale: ക്ഷണരൂപത്തിലുള്ള ആജ്ഞയും ഒരു വ്യക്തിയുടെ അടുക്കലേക്കുള്ള ചലനവും സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: πάντες
  choice: നിങ്ങൾ എല്ലാവരും
  rationale: ക്ഷണത്തിന്റെ സമഗ്രമായ വ്യാപ്തി നിലനിർത്തുകയും ഗ്രീക്കിലെ ബഹുവചനത്തെ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: οἱ κοπιῶντες
  choice: അധ്വാനിക്കുകയും
  rationale: തുടർച്ചയായി പ്രയത്നിക്കുന്നവരെ സൂചിപ്പിക്കുന്ന സജീവ വർത്തമാന കൃദന്തരൂപത്തിന്റെ ആശയം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: πεφορτισμένοι
  choice: ഭാരം ചുമക്കുകയും ചെയ്യുന്നവരേ
  rationale: ഭാരം ചുമത്തപ്പെട്ടതിന്റെ ഫലമായി ആ അവസ്ഥയിൽ തുടരുന്നവരെ സൂചിപ്പിക്കുന്ന പൂർണ്ണ നിഷ്ക്രിയ കൃദന്തരൂപം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: κἀγὼ
  choice: ഞാൻ
  rationale: ഗ്രീക്കിലെ വ്യക്തമായ കർത്താവിനെ നിലനിർത്തുന്നു; മലയാളത്തിലെ വാക്യക്രമവും വിരാമചിഹ്നവും വാഗ്ദാനത്തിലെ ഊന്നൽ സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: ἀναπαύσω ὑμᾶς
  choice: ഞാൻ നിങ്ങൾക്കു വിശ്രമം നൽകും
  rationale: വിശ്രമിപ്പിക്കുക, ആശ്വാസം നൽകുക, ഉന്മേഷപ്പെടുത്തുക എന്നീ അർഥസാധ്യതകളിൽ ഒന്നിലേക്ക് അനാവശ്യമായി ചുരുക്കാതെ വിശാലമായ വാഗ്ദാനം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἀναπαύσω സൂചിപ്പിക്കുന്ന വിശ്രമത്തിന്റെ സ്വഭാവം
  choice: ഞാൻ നിങ്ങൾക്കു വിശ്രമം നൽകും
  alternative: ഞാൻ നിങ്ങളെ ആശ്വസിപ്പിക്കും / ഉന്മേഷപ്പെടുത്തും
  rationale: ഈ വാക്യം വിശ്രമം ആത്മീയമോ ശാരീരികമോ മാനസികമോ യുഗാന്ത്യപരമോ എന്ന് പ്രത്യേകം നിർവചിക്കുന്നില്ല. അതിനാൽ അതിന്റെ ദൈവശാസ്ത്രപരമായ സമൃദ്ധിയും തുറന്ന അർഥപരിധിയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ മാന്യമായ മലയാളം. “വരുവിൻ” എന്ന രൂപം ക്ഷണത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു; ശേഷിക്കുന്ന പദപ്രയോഗം അനാവശ്യമായ പുരാതനഭാവം ഒഴിവാക്കുന്നു.
