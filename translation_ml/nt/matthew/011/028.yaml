  to: അധ്വാനിക്കുകയും ഭാരപ്പെട്ടിരിക്കുകയും ചെയ്യുന്ന എല്ലാവരും, എന്റെ അടുക്കൽ വരുവിൻ; ഞാൻ നിങ്ങൾക്കു വിശ്രമം നൽകും.[a]
