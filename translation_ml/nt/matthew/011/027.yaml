id: MAT.11.27
reference: Matthew 11:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Πάντα μοι παρεδόθη ὑπὸ τοῦ πατρός μου, καὶ οὐδεὶς ἐπιγινώσκει τὸν υἱὸν εἰ μὴ ὁ πατήρ, οὐδὲ τὸν πατέρα τις ἐπιγινώσκει εἰ μὴ ὁ υἱὸς καὶ ᾧ ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/027.yaml
  text: All things have been handed over to me by my Father[a], and no one knows the Son except the Father[b], nor does anyone know the Father except the Son and anyone to whom the Son chooses to reveal him.
translation:
  language: ml
  text: എന്റെ പിതാവ് സകലവും എനിക്കു ഏൽപ്പിച്ചിരിക്കുന്നു. പിതാവല്ലാതെ ആരും പുത്രനെ അറിയുന്നില്ല[a]. പുത്രനും, പിതാവിനെ ആർക്കു വെളിപ്പെടുത്തിക്കൊടുക്കാൻ പുത്രൻ തിരഞ്ഞെടുക്കുന്നുവോ അവരും അല്ലാതെ, ആരും പിതാവിനെ അറിയുന്നില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പൂർണമായി അറിയുന്നില്ല’ അല്ലെങ്കിൽ ‘യഥാർഥമായി അറിയുന്നില്ല’ എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്ക് ക്രിയയ്ക്ക് പൂർണമായോ അടുത്തറിവോടെയോ അറിയുക എന്ന ആശയം സൂചിപ്പിക്കാനാകും. പിതാവിനെക്കുറിച്ചുള്ള അടുത്ത വാക്യത്തിനും ഇതേ സാധ്യത ബാധകമാണ്.
    reason: lexical_alternative
  - marker: b
    text: 'അല്ലെങ്കിൽ: ‘പിതാവിനെ ആർക്കു വെളിപ്പെടുത്താൻ പുത്രൻ ഇച്ഛിക്കുന്നുവോ അവരും.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντα
  choice: സകലവും
  rationale: നപുംസകലിംഗ ബഹുവചനമായ പദത്തിന്റെ സമഗ്രമായ വ്യാപ്തി നിലനിർത്തുന്നു; അതിന്റെ പരിധി അനാവശ്യമായി നിർവചിക്കുന്നില്ല.
- source_word: παρεδόθη
  choice: ഏൽപ്പിച്ചിരിക്കുന്നു
  rationale: പിതാവിൽനിന്ന് പുത്രനിലേക്കുള്ള കൈമാറ്റം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ ഫലവും സൂചിപ്പിക്കുന്നു.
- source_word: ἐπιγινώσκει
  choice: അറിയുന്നില്ല
  rationale: സന്ദർഭത്തിലെ വ്യക്തിപരവും അനന്യവുമായ അറിവ് വ്യക്തമാക്കുന്നു; ഗ്രീക്ക് ക്രിയയിൽ നിർബന്ധമായും ഇല്ലാത്ത ‘പൂർണമായി’ എന്ന തീവ്രത മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: εἰ μὴ
  choice: അല്ലാതെ
  rationale: നിഷേധവാക്യത്തിനു ശേഷമുള്ള ഒഴിവാക്കൽ സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: βούληται
  choice: തിരഞ്ഞെടുക്കുന്ന
  rationale: പുത്രന്റെ യഥാർഥ ഇച്ഛാപൂർവമായ തീരുമാനവും വെളിപ്പെടുത്തലിലെ മുൻകൈയും വ്യക്തമാക്കുന്നു; വെറും ആഗ്രഹമായി ചുരുക്കുന്നില്ല.
- source_word: ἀποκαλύψαι
  choice: വെളിപ്പെടുത്തിക്കൊടുക്കാൻ
  rationale: മറ്റൊരാൾക്കു പിതാവിനെ അറിയിച്ചുകൊടുക്കുന്ന ദൈവിക വെളിപ്പെടുത്തൽ എന്ന ആശയം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: പിതാവും പുത്രനും തമ്മിലുള്ള അനന്യമായ അറിവിൽ ἐπιγινώσκω എന്ന ക്രിയയുടെ ശക്തി
  choice: മുഖ്യപാഠത്തിൽ ‘അറിയുന്നു’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: ‘പൂർണമായി അറിയുന്നു’ അല്ലെങ്കിൽ ‘യഥാർഥമായി അറിയുന്നു’
  rationale: ക്രിയയ്ക്ക് സന്ദർഭത്തിൽ ആഴമുള്ളതോ പൂർണമായതോ ആയ അറിവ് സൂചിപ്പിക്കാനാകുമെങ്കിലും തീവ്രത നിർബന്ധമായി പദത്തിൽ അടങ്ങിയിട്ടില്ല. അതിനാൽ മുഖ്യപാഠം അതിനെ അതിവ്യാഖ്യാനിക്കാതെ അനന്യത നിലനിർത്തുന്നു; സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: βούληται എന്ന പദത്തിലെ ഇച്ഛാപൂർവത
  choice: ‘തിരഞ്ഞെടുക്കുന്ന’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: ‘വെളിപ്പെടുത്താൻ ഇച്ഛിക്കുന്ന’
  rationale: വെളിപ്പെടുത്തലിൽ പുത്രനുള്ള ഇച്ഛയും മുൻകൈയും നിലനിർത്തുന്നു; പ്രത്യേക മതവിഭാഗത്തിന്റെ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: അവസാന ഉപവാക്യത്തിൽ ἀποκαλύψαι എന്ന ക്രിയയുടെ വ്യക്തമാക്കാത്ത കർമം
  choice: ‘പിതാവിനെ’ എന്നു സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാക്കി
  alternative: കർമം പറയാതെ ‘വെളിപ്പെടുത്താൻ’ എന്നു മാത്രം നൽകുക
  rationale: ഗ്രീക്കിൽ കർമം വ്യാകരണപരമായി വ്യക്തമാക്കാതെ വിട്ടിട്ടുണ്ടെങ്കിലും ഉടൻ മുമ്പുള്ള ‘പിതാവ്’ തന്നെയാണ് അർത്ഥസൂചന. മലയാളത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ അത് വ്യക്തമാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന ശൈലി. ഗ്രീക്കിലെ ദീർഘമായ സമാന്തരവാക്യം മലയാളത്തിലെ വ്യക്തതയ്ക്കായി മൂന്ന് വാക്യങ്ങളാക്കി; പിതാവ്–പുത്രൻ പരസ്പരബന്ധവും ഒഴിവാക്കൽഘടനയും നിലനിർത്തി.
