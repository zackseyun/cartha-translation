revisions:
- from: സകലവും എന്റെ പിതാവ് എന്നെ ഏൽപ്പിച്ചിരിക്കുന്നു. പിതാവല്ലാതെ ആരും പുത്രനെ അറിയുന്നില്ല[a]. അതുപോലെ, പുത്രനും പിതാവിനെ വെളിപ്പെടുത്തിക്കൊടുക്കാൻ പുത്രൻ തിരഞ്ഞെടുക്കുന്നവരും[b] അല്ലാതെ ആരും പിതാവിനെ അറിയുന്നില്ല.
  to: എന്റെ പിതാവ് സകലവും എനിക്കു ഏൽപ്പിച്ചിരിക്കുന്നു. പിതാവല്ലാതെ ആരും പുത്രനെ അറിയുന്നില്ല[a]. പുത്രനും, പിതാവിനെ ആർക്കു വെളിപ്പെടുത്തിക്കൊടുക്കാൻ പുത്രൻ തിരഞ്ഞെടുക്കുന്നുവോ അവരും അല്ലാതെ, ആരും പിതാവിനെ അറിയുന്നില്ല[b].
  rationale: The revision corrects the essential dative relationship in μοι and recasts the final coordinated exception so that the Father is explicitly the one revealed to persons chosen by the Son. It retains the source’s present-tense mutual-knowledge statements, the comprehensive scope of Πάντα, and the non-sectarian volitional force of βούληται. Footnote anchors remain attached to the respective knowledge and choice/revelation expressions.
