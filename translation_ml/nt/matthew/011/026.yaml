id: MAT.11.26
reference: Matthew 11:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ναί, ὁ πατήρ, ὅτι οὕτως ⸂εὐδοκία ἐγένετο⸃ ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/026.yaml
  text: Yes[a], Father, because this was pleasing in your sight.
translation:
  language: ml
  text: അതേ[a], പിതാവേ, ഇങ്ങനെ ആയത് അങ്ങയുടെ ദൃഷ്ടിയിൽ പ്രസാദകരമായിരുന്നതുകൊണ്ടാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തീർച്ചയായും’; ‘അതേ, പിതാവേ, ഇങ്ങനെ ആയത് അങ്ങയുടെ പ്രസാദമായിരുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: ναί-യുടെ ഉറപ്പിക്കൽഭാവവും εὐδοκία ἐγένετο എന്ന പ്രയോഗത്തിൽ ‘പ്രസാദകരമായിരുന്നു’ എന്നതിനും ‘അങ്ങയുടെ പ്രസാദമായിരുന്നു’ എന്നതിനും ഉള്ള സ്വാഭാവിക മലയാള വ്യത്യാസവും സൂചിപ്പിക്കാൻ.
lexical_decisions:
- source_word: ναί
  choice: അതേ
  rationale: പ്രാർഥനാസന്ദർഭത്തിലെ സമ്മതവും ഉറപ്പും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὁ πατήρ
  choice: പിതാവേ
  rationale: ആളെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്ന ഗ്രീക്ക് പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായ സംബോധനരൂപത്തിൽ നൽകി.
- source_word: ὅτι
  choice: കാരണം സൂചിപ്പിക്കുന്ന വാക്യബന്ധം
  rationale: മലയാളത്തിൽ പ്രത്യേകമായി ‘കാരണം’ ചേർക്കാതെ വാക്യഘടനയിലൂടെ തന്നെ മുൻപുള്ള സമ്മതത്തിന്റെ അടിസ്ഥാനം സ്വാഭാവികമായി വ്യക്തമാകുന്നു.
- source_word: οὕτως
  choice: ഇങ്ങനെ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ വെളിപ്പെടുത്തലിന്റെയും മറച്ചുവെക്കലിന്റെയും രീതിയിലേക്കു തിരിച്ചുചൂണ്ടുന്നു.
- source_word: εὐδοκία ἐγένετο
  choice: പ്രസാദകരമായിരുന്നു
  rationale: അംഗീകാരവും പ്രസാദവും സൂചിപ്പിക്കുന്നു; ദൈവിക ഉത്തരവ് അഥവാ നിർണയിച്ച പദ്ധതി എന്ന ശക്തമായ ആശയം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: ἔμπροσθέν σου
  choice: അങ്ങേക്കു
  rationale: ‘അങ്ങയുടെ മുമ്പിൽ/ദൃഷ്ടിയിൽ’ എന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തിപരമായ ദാതൃരൂപത്തിലൂടെ നൽകുന്നു; ദൈവത്തെ അഭിസംബോധന ചെയ്യുന്നതിനൊത്ത ആദരസൂചക രൂപമാണ്.
theological_decisions:
- issue: εὐδοκία എന്നത് ദൈവിക നിർണയം/പദ്ധതി എന്നോ ദൈവത്തിന്റെ പ്രസാദം/അംഗീകാരം എന്നോ പരിഭാഷപ്പെടുത്തണമോ
  choice: ‘പ്രസാദകരമായിരുന്നു’ എന്ന് നൽകി ദൈവത്തിന്റെ പ്രസാദവും അംഗീകാരവും മുൻനിർത്തി.
  alternative: ‘അങ്ങയുടെ ഹിതമായിരുന്നു’ അല്ലെങ്കിൽ ‘അങ്ങയുടെ സദുദ്ദേശമായിരുന്നു’
  rationale: ഗ്രീക്ക് വാചകം ദൈവത്തിന്റെ ഇഷ്ടത്തെയോ പ്രസാദത്തെയോ സൂചിപ്പിക്കുന്നുണ്ടെങ്കിലും, ‘സദുദ്ദേശം’ എന്നത് ഇവിടെ ആവശ്യത്തിലധികം നിർണയാത്മകമായ അർഥം വരുത്താം. പരിഭാഷ ദൈവത്തിന്റെ പ്രവർത്തനരീതി അവിടുത്തേക്കു പ്രസാദകരമായിരുന്നു എന്ന ആശയം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ പ്രാർഥനാഭാഷ. ‘അങ്ങ്’ എന്ന ആദരസൂചക സർവനാമം ഉപയോഗിച്ചു; അത്യന്തം പുരാതനമായ പദാവലി ഒഴിവാക്കി.
