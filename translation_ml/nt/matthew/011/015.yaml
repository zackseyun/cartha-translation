id: MAT.11.15
reference: Matthew 11:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ ἔχων ⸀ὦτα ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/015.yaml
  text: The one who has ears[a], let him hear.
translation:
  language: ml
  text: കേൾക്കാൻ ചെവികളുള്ളവൻ കേൾക്കട്ടെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കേൾക്കാൻ ചെവികളുള്ള ആരും കേൾക്കട്ടെ.” ഗ്രീക്കിൽ പൊതുവായ അർഥത്തിൽ ഏകവചനപ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων
  choice: ഉള്ളവൻ
  rationale: നിശ്ചയാർഥക ഉപപദത്തോടുകൂടിയ വർത്തമാനകാല കൃദന്തം വ്യക്തിയെ പൊതുവായി സൂചിപ്പിക്കുന്നു. ‘ഉള്ളവൻ’ ഏകവചനവും പ്രതിനിധാനപരമായ പുരുഷലിംഗരൂപവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὦτα
  choice: ചെവികൾ
  rationale: ഗ്രീക്കിൽ ഇത് ബഹുവചനമാണ്. ‘ചെവികൾ’ രൂപപരമായി കൃത്യവും ശ്രദ്ധയോടെ ഗ്രഹിക്കാനുള്ള ആഹ്വാനം ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക പ്രയോഗവുമാണ്.
- source_word: ἀκουέτω
  choice: കേൾക്കട്ടെ
  rationale: മൂന്നാംപുരുഷ ഏകവചന വർത്തമാനകാല ആജ്ഞാരൂപത്തെ ‘കേൾക്കട്ടെ’ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു. കേൾക്കുക എന്നതോടൊപ്പം ശ്രദ്ധിച്ചു ഗ്രഹിക്കുകയും അനുസരിക്കുകയും ചെയ്യുക എന്ന വിശാലസാധ്യതയും ഇത് തുറന്നുവെക്കുന്നു.
theological_decisions:
- issue: പൊതുവായ അർഥത്തിലുള്ള പുരുഷലിംഗ ഏകവചനപ്രയോഗം
  choice: കേൾക്കാൻ ചെവികളുള്ളവൻ കേൾക്കട്ടെ.
  alternative: കേൾക്കാൻ ചെവികളുള്ള ആരും കേൾക്കട്ടെ.
  rationale: ഗ്രീക്ക് വാക്യം വ്യാകരണപരമായി പുരുഷലിംഗ ഏകവചനമാണെങ്കിലും അർഥത്തിൽ പൊതുവായ ആഹ്വാനമാണ്. പ്രധാനപാഠം ആ ഏകവചനരൂപം നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് അതിന്റെ സർവസാധാരണമായ അർഥം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. ‘കേൾക്കാൻ ചെവികളുള്ളവൻ’ എന്ന സ്വാഭാവിക രൂപം വാച്യമായ കേൾവിയെക്കാൾ ശ്രദ്ധാപൂർവമായ ഗ്രഹണത്തിലേക്കുള്ള ആഹ്വാനവും നിലനിർത്തുന്നു.
