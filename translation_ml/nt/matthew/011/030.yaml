id: MAT.11.30
reference: Matthew 11:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ γὰρ ζυγός μου χρηστὸς καὶ τὸ φορτίον μου ἐλαφρόν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/030.yaml
  text: For my yoke is kind, and my burden is light.
translation:
  language: ml
  text: എന്തെന്നാൽ, എന്റെ നുകം ദയാപൂർവമായതും എന്റെ ചുമട് ലഘുവുമാണ്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ യേശുവിന്റെ ക്ഷണത്തിനും ആശ്വാസവാഗ്ദാനത്തിനും ഈ വാക്യം കാരണം നൽകുന്നതായി വ്യക്തമാക്കുന്നു.
- source_word: ζυγός
  choice: നുകം
  rationale: ഭാരം വഹിക്കാനോ വലിക്കാനോ മൃഗങ്ങളിൽ വെക്കുന്ന ഉപകരണത്തെ സൂചിപ്പിക്കുന്ന മൂലരൂപകം അതേപടി നിലനിർത്തുന്നു.
- source_word: χρηστός
  choice: ദയയുള്ളത്
  rationale: χρηστός എന്ന പദത്തിന്റെ ‘ദയാപൂർവമായ, കനിവുള്ള, ഉപകാരപ്രദമായ’ അർത്ഥവ്യാപ്തി സംരക്ഷിക്കുന്നു; ‘എളുപ്പമുള്ളത്’ എന്നു പറഞ്ഞ് ആശയം ചുരുക്കുന്നില്ല.
- source_word: φορτίον
  choice: ചുമട്
  rationale: വഹിക്കേണ്ട ഭാരത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ സൂചിപ്പിക്കുകയും നുകത്തിന്റെ രൂപകവുമായി പൊരുത്തപ്പെടുകയും ചെയ്യുന്നു.
- source_word: ἐλαφρόν
  choice: ഭാരം കുറഞ്ഞത്
  rationale: ‘ലഘുവായത്’ എന്ന അർത്ഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: χρηστός എന്ന പദം നുകത്തിന്റെ ലാഘവമോ അതിന്റെ ദയാപൂർവ സ്വഭാവമോ സൂചിപ്പിക്കുന്നുവോ
  choice: ദയയുള്ളത്
  alternative: എളുപ്പമുള്ളത് / സുഖകരമായത്
  rationale: മൂലപദത്തിന്റെ നൈതികവും ബന്ധപരവുമായ ‘kind/good’ ഭാവം നിലനിർത്തുന്നു. തുടർന്നുള്ള ἐλαφρόν ഇതിനകം ചുമടിന്റെ ലാഘവം വ്യക്തമാക്കുന്നതിനാൽ രണ്ടിനെയും ഒരേ ആശയമായി ലയിപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘നുകം’ എന്ന ബൈബിൾരൂപകം നിലനിർത്തി; ‘ചുമട് ഭാരം കുറഞ്ഞത്’ സാധാരണ വായനയിൽ ഉടൻ ഗ്രഹിക്കാവുന്ന പ്രയോഗമാണ്.
