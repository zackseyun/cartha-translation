id: MAT.11.18
reference: Matthew 11:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἦλθεν γὰρ Ἰωάννης μήτε ἐσθίων μήτε πίνων, καὶ λέγουσιν· Δαιμόνιον ἔχει·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/018.yaml
  text: For John came neither eating nor drinking[a], and they say, ‘He has a demon.’
translation:
  language: ml
  text: കാരണം, യോഹന്നാൻ തിന്നാതെയും കുടിക്കാതെയും വന്നു; അവർ, ‘അവനു ഒരു ഭൂതമുണ്ട്,’ എന്നു പറയുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, ‘അവൻ ഭൂതബാധിതനാണ്.’ ഗ്രീക്കിൽ അക്ഷരാർഥം: ‘അവനു ഒരു ഭൂതമുണ്ട്.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: വന്നു
  rationale: ἔρχομαι എന്ന ക്രിയയുടെ ഭൂതകാലരൂപം യോഹന്നാന്റെ വരവിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘വന്നു’ സ്വാഭാവികവും നേരിട്ടുള്ളതുമാണ്.
- source_word: γὰρ
  choice: -തുകൊണ്ട്
  rationale: മുൻവാക്യത്തെ വിശദീകരിക്കുന്ന γάρ എന്ന ബന്ധത്തിന്റെ കാരണാത്മക ഭാവം മലയാളത്തിൽ വാക്യഘടനയോട് ചേർന്ന ‘-തുകൊണ്ട്’ വഴി സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: Ἰωάννης
  choice: യോഹന്നാൻ
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ സ്ഥിരപ്പെട്ട വ്യക്തിനാമരൂപം.
- source_word: μήτε ἐσθίων μήτε πίνων
  choice: തിന്നാതെയും കുടിക്കാതെയും
  rationale: μήτε...μήτε എന്ന സമാന്തര നിഷേധഘടന നിലനിർത്തുന്നു. ഗ്രീക്കിൽ അപ്പം, വീഞ്ഞ് എന്നിവ വ്യക്തമാക്കിയിട്ടില്ലാത്തതിനാൽ അവ ചേർക്കുന്നില്ല; യോഹന്നാന്റെ തപോനിഷ്ഠമായ ജീവിതരീതിയെ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തപ്രയോഗം അതേപടി സംരക്ഷിക്കുന്നു.
- source_word: καὶ λέγουσιν
  choice: എന്ന് അവർ പറയുന്നു
  rationale: λέγουσιν എന്ന വർത്തമാനകാലത്തിന്റെ സജീവവും പൊതുവൽക്കരിക്കുന്നതുമായ ഭാവം ‘അവർ പറയുന്നു’ എന്നു നിലനിർത്തുന്നു; കർത്താവിനെ കൂടുതൽ നിർവചിക്കുന്നില്ല.
- source_word: Δαιμόνιον ἔχει
  choice: അവനിൽ ഒരു ഭൂതമുണ്ട്
  rationale: ‘ഒരു ഭൂതം ഉണ്ട്’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ രൂപവും അർത്ഥവും സ്വാഭാവിക മലയാളത്തിൽ അടുത്തായി നിലനിർത്തുന്നു; ‘ഭൂതബാധിതനാണ്’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക രൂപം മുഖ്യപാഠത്തിൽ ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: δαιμόνιον സംബന്ധിച്ച ആരോപണത്തിന്റെ വിവർത്തനം
  choice: അവനിൽ ഒരു ഭൂതമുണ്ട്
  alternative: അവൻ ഭൂതബാധിതനാണ്
  rationale: ഇത് യോഹന്നാനെക്കുറിച്ചുള്ള ആളുകളുടെ ആരോപണമാണെന്നും വിവരണകർത്താവിന്റെ സ്ഥിരീകരണമല്ലെന്നും ഉദ്ധരണിചിഹ്നങ്ങൾ വ്യക്തമാക്കുന്നു. ഗ്രീക്കിലെ ‘ഒരു ഭൂതമുണ്ട്’ എന്ന ഭാഷ നിലനിർത്തുന്നത് വ്യാഖ്യാനഭാരം കൂട്ടാതെ ദൈവശാസ്ത്രപരമായ സംഘർഷം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ഗ്രീക്കിലെ സംക്ഷിപ്തതയും ആരോപണത്തിന്റെ നേരിട്ടുള്ള സ്വഭാവവും നിലനിർത്തിയിരിക്കുന്നു.
