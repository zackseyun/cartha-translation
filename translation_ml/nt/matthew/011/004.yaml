id: MAT.11.4
reference: Matthew 11:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτοῖς· Πορευθέντες ἀπαγγείλατε Ἰωάννῃ ἃ ἀκούετε καὶ βλέπετε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/004.yaml
  text: And Jesus answered them[a], “Go and report to John what you hear and see:”
translation:
  language: ml
  text: 'യേശു അവരോടു മറുപടി പറഞ്ഞു[a]: “നിങ്ങൾ പോയി നിങ്ങൾ കേൾക്കുകയും കാണുകയും ചെയ്യുന്ന കാര്യങ്ങൾ യോഹന്നാനെ അറിയിക്കുവിൻ:”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, “യേശു അവരോടു മറുപടി പറഞ്ഞ് പറഞ്ഞു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: '[പ്രത്യേക പദമായി ചേർത്തില്ല]'
  rationale: മുൻവിവരണത്തോടുള്ള ലളിതമായ ബന്ധം മലയാളത്തിലെ സ്വാഭാവിക വാക്യപ്രവാഹത്തിലൂടെ വ്യക്തമാകുന്നതിനാൽ തുടക്കത്തിലെ καί പ്രത്യേകം ‘അപ്പോൾ’ എന്നു പരിഭാഷപ്പെടുത്തി കാലസൂചന കൂട്ടിച്ചേർത്തില്ല.
- source_word: ἀποκριθεὶς ... εἶπεν αὐτοῖς
  choice: യേശു അവരോടു മറുപടി പറഞ്ഞു
  rationale: ഗ്രീക്ക് വിവരണശൈലിയിലെ ‘മറുപടി പറഞ്ഞുകൊണ്ട് ... പറഞ്ഞു’ എന്ന ഇരട്ടപ്രയോഗത്തിന്റെ സംവാദധർമ്മവും സംസാരത്തിന്റെ ആമുഖവും സ്വാഭാവികമായ മലയാളത്തിൽ ഒരുമിച്ചു നിലനിർത്തുന്നു.
- source_word: Πορευθέντες
  choice: നിങ്ങൾ പോയി
  rationale: ആജ്ഞാപദത്തിനു മുന്നിലുള്ള പങ്കാളിക്രിയ ഇവിടെ അനുബന്ധ ആജ്ഞയുടെ ബലം വഹിക്കുന്നു; ‘പോയി ... അറിയിക്കൂ’ എന്നത് ക്രമവും നിർദേശവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀπαγγείλατε
  choice: അറിയിക്കൂ
  rationale: കണ്ടുകേട്ട കാര്യങ്ങൾ യോഹന്നാന്റെ അടുക്കൽ തിരികെ അറിയിക്കണമെന്ന സന്ദർഭത്തിൽ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും കൃത്യവുമായ പ്രയോഗം.
- source_word: Ἰωάννῃ
  choice: യോഹന്നാനെ
  rationale: മലയാളത്തിൽ ‘അറിയിക്കുക’ എന്ന ക്രിയയോടൊപ്പം വിവരം ലഭിക്കുന്ന വ്യക്തിയെ കർമവിഭക്തിയിൽ അവതരിപ്പിക്കുന്നത് സ്വാഭാവികമാണ്.
- source_word: ἃ ἀκούετε καὶ βλέπετε
  choice: കേൾക്കുന്നതും കാണുന്നതും
  rationale: വർത്തമാനകാലത്തെ നേരിട്ടുള്ള അനുഭവവും രണ്ടു ക്രിയകളുടെ സമാന്തരതയും സംക്ഷിപ്തമായ മലയാളരൂപത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἀποκριθεὶς ... εἶπεν എന്ന വിവരണസൂത്രത്തിന്റെ പരിഭാഷ
  choice: യേശു അവരോടു മറുപടി പറഞ്ഞു
  alternative: യേശു അവരോടു മറുപടിയായി പറഞ്ഞു
  rationale: ഇത് ഉപദേശപരമായ തീരുമാനമല്ല, ഭാഷാശൈലിയുമായി ബന്ധപ്പെട്ടതാണ്. ഗ്രീക്കിലെ പങ്കാളിക്രിയയും പ്രധാനക്രിയയും മലയാളത്തിൽ യാന്ത്രികമായി ഇരട്ടിപ്പിക്കാതെ മറുപടിയുടെ സ്വഭാവവും തുടർന്ന് വരുന്ന നേരിട്ടുള്ള വാക്കുകളുടെ ആമുഖവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘റിപ്പോർട്ട് ചെയ്യുക’ പോലുള്ള അനാവശ്യ ആംഗലേയഭാവത്തിനു പകരം ‘അറിയിക്കൂ’ ഉപയോഗിച്ചു. ഗ്രീക്കിൽ ഇല്ലാത്ത വ്യാഖ്യാനമോ വിഭാഗീയ ദൈവശാസ്ത്രസൂചനയോ ചേർത്തിട്ടില്ല.
