id: MAT.11.23
reference: Matthew 11:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ σύ, Καφαρναούμ, ⸂μὴ ἕως οὐρανοῦ ὑψωθήσῃ⸃; ἕως ᾅδου ⸀καταβήσῃ· ὅτι εἰ ἐν Σοδόμοις ⸀ἐγενήθησαν αἱ δυνάμεις αἱ γενόμεναι ἐν σοί, ⸀ἔμεινεν ἂν μέχρι τῆς σήμερον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/023.yaml
  text: And you[a], Capernaum, will you be exalted to heaven? You will go down to Hades. For if the mighty works done in you had happened in Sodom, it would have remained until today.
translation:
  language: ml
  text: കഫർന്നഹൂമേ, നീ സ്വർഗംവരെ ഉയർത്തപ്പെടുമെന്നോ? നീ ഹാദേസിലേക്ക്[a] ഇറങ്ങിപ്പോകും. നിന്നിൽ നടന്ന ശക്തിപ്രവൃത്തികൾ സൊദോമിൽ നടന്നിരുന്നെങ്കിൽ, അത് ഇന്നുവരെ നിലനിൽക്കുമായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘മരിച്ചവരുടെ ലോകത്തിലേക്ക്.’ ഗ്രീക്കിൽ ‘ഹാദേസ്’; ഇത് ‘ഗെഹെന്ന’ എന്ന പദമല്ല.
    reason: ᾅδης എന്ന ഗ്രീക്കുപദത്തിന്റെ അർഥം വ്യക്തമാക്കുകയും അതിനെ ഗെഹെന്നയുമായി കലർത്താതിരിക്കുകയും ചെയ്യാൻ.
lexical_decisions:
- source_word: Καφαρναούμ
  choice: കഫർന്നഹൂം
  rationale: സ്ഥലനാമം മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണരീതിയിൽ നൽകി; സംബോധനരൂപത്തിൽ ‘കഫർന്നഹൂമേ’ എന്നു പ്രയോഗിച്ചു.
- source_word: μὴ ἕως οὐρανοῦ ὑψωθήσῃ;
  choice: നീ സ്വർഗംവരെ ഉയർത്തപ്പെടുമെന്നോ?
  rationale: μή ചേർന്ന ഈ പ്രയോഗം നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്ന അലങ്കാരചോദ്യമായി നിലനിർത്തുന്നു. ‘ഉയർത്തപ്പെടുക’ എന്നത് passive രൂപവും സ്ഥാനമഹത്വത്തിന്റെ സൂചനയും സംരക്ഷിക്കുന്നു.
- source_word: ἕως ᾅδου καταβήσῃ
  choice: നീ ഹാദേസിലേക്ക് ഇറങ്ങിപ്പോകും
  rationale: καταβαίνω എന്നതിന്റെ താഴേക്കുള്ള ചലനം ‘ഇറങ്ങിപ്പോകും’ എന്നു നൽകി. ᾅδης എന്ന പദത്തെ ഗെഹെന്നയുമായോ പൊതുവായ ‘നരകം’ എന്ന ആശയവുമായോ കലർത്താതിരിക്കാൻ ‘ഹാദേസ്’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: δυνάμεις
  choice: ശക്തിപ്രവൃത്തികൾ
  rationale: യേശു ചെയ്ത ശക്തിയുള്ള പ്രവൃത്തികളെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ ‘ശക്തി’, ‘പ്രവൃത്തി’ എന്നീ രണ്ടു ഘടകങ്ങളും സംരക്ഷിക്കുന്നു; ‘അത്ഭുതങ്ങൾ’ എന്നു മാത്രം പറഞ്ഞ് അർഥം ചുരുക്കുന്നില്ല.
- source_word: γενόμεναι ἐν σοί
  choice: നിന്നിൽ നടന്ന
  rationale: നഗരത്തെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്ന രൂപവും അതിനുള്ളിൽ സംഭവിച്ച പ്രവൃത്തികൾ എന്ന സ്ഥാനസൂചനയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐγενήθησαν
  choice: നടന്നിരുന്നെങ്കിൽ
  rationale: സംഭവിക്കാതിരുന്ന ഒരു ഭൂതകാലസാഹചര്യം സങ്കൽപ്പിക്കുന്ന വ്യവസ്ഥ മലയാളത്തിലെ പ്രതിവാസ്തവ രൂപത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἔμεινεν ἂν
  choice: അത് നിലനിൽക്കുമായിരുന്നു
  rationale: സൊദോമിനെ ഏകവചനത്തിലുള്ള നഗരമായി എടുത്ത്, ἄν അടയാളപ്പെടുത്തുന്ന സംഭവിക്കാതിരുന്ന ഫലം സംരക്ഷിക്കുന്നു.
- source_word: μέχρι τῆς σήμερον
  choice: ഇന്നുവരെ
  rationale: കാലപരിധി ലളിതവും സ്വാഭാവികവുമായ ആധുനിക മലയാളത്തിൽ നേരിട്ട് നൽകുന്നു.
theological_decisions:
- issue: ᾅδης എന്നതിന്റെ പരിഭാഷ
  choice: ഹാദേസ്
  alternative: മരിച്ചവരുടെ ലോകം; പാതാളം; നരകം
  rationale: ഗ്രീക്കിലെ ᾅδης എന്ന പദത്തെ ‘നരകം’ എന്നു പരിഭാഷപ്പെടുത്തി അന്തിമശിക്ഷയെക്കുറിച്ചുള്ള പ്രത്യേക അർഥം മുൻകൂട്ടി ചുമത്തുന്നില്ല. ലിപ്യന്തരണം മൂലപദത്തിന്റെ വ്യത്യസ്തത നിലനിർത്തുന്നു; വിശദീകരണപരമായ അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. അലങ്കാരചോദ്യവും നഗരത്തോടുള്ള നേരിട്ടുള്ള സംബോധനവും നിലനിർത്തി. സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വാക്യഘടന ഉപയോഗിച്ചെങ്കിലും ᾅδης സംബന്ധിച്ച ദൈവശാസ്ത്രപരമായ വ്യത്യാസം ലഘൂകരിച്ചില്ല.
