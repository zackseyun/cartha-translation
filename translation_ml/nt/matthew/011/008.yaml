  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വാഗ്മിതാശൈലി. ചോദ്യങ്ങളുടെ ആവർത്തനഘടനയും ‘മൃദുവായ’ എന്ന ഗ്രീക്ക് പദത്തിന്റെ ആവർത്തനവും നിലനിർത്തിയിട്ടുണ്ട്; ‘ഭവനം’ ഔപചാരികമെങ്കിലും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാണ്.
