  text: ἀλλὰ τί ἐξήλθατε ἰδεῖν; ἄνθρωπον ἐν ⸀μαλακοῖς ἠμφιεσμένον; ἰδοὺ οἱ τὰ μαλακὰ φοροῦντες ἐν τοῖς οἴκοις τῶν ⸀βασιλέων ⸀εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/008.yaml
  text: But what did you go out to see? A man dressed in soft clothes? Look[b][a], those who wear soft clothes are in the houses of kings.
translation:
  language: ml
  text: എന്നാൽ നിങ്ങൾ എന്തു കാണാനാണ് പുറപ്പെട്ടത്? നേർത്ത വസ്ത്രം ധരിച്ച ഒരു മനുഷ്യനെയോ?[a] നോക്കൂ, നേർത്ത വസ്ത്രം ധരിക്കുന്നവർ രാജാക്കന്മാരുടെ ഭവനങ്ങളിലാണ്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മൃദുവായ വസ്ത്രം ധരിച്ച’ / ‘ആഡംബരവസ്ത്രം ധരിച്ച.’ ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘മൃദുവായ വസ്ത്രങ്ങൾ/വസ്ത്രവകകൾ’ എന്നാണ്; ഇവിടെ നേർത്തതോ ആഡംബരപൂർണമോ ആയ വസ്ത്രമാണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘രാജകൊട്ടാരങ്ങളിലാണ്.’ ഗ്രീക്കിൽ കൂടുതൽ അക്ഷരാർഥമായി, ‘രാജാക്കന്മാരുടെ ഭവനങ്ങളിലാണ്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: എന്നാൽ
  rationale: മുൻചോദ്യത്തിൽനിന്നുള്ള യേശുവിന്റെ വൈരുധ്യാത്മകമായ വാഗ്മിതാ തുടർച്ച സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: τί ἐξήλθατε ἰδεῖν
  choice: നിങ്ങൾ എന്തു കാണാനാണ് പുറപ്പെട്ടുപോയത്
  rationale: τί എന്നതിലെ ‘എന്ത്’ എന്ന ചോദ്യവും ἐξήλθατε + ἰδεῖν എന്ന ഉദ്ദേശ്യപ്രയോഗവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: ἄνθρωπον
  choice: ഒരു മനുഷ്യനെ
  rationale: യോഹന്നാനെ സൂചിപ്പിക്കുന്ന ഏകവചന പുല്ലിംഗരൂപം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: ἐν μαλακοῖς ἠμφιεσμένον
  choice: മൃദുവായ വസ്ത്രം ധരിച്ച
  rationale: μαλακοῖς എന്നതിന്റെ അക്ഷരാർഥമായ ‘മൃദുവായ’ എന്ന ഭാവം സംരക്ഷിക്കുമ്പോൾ സന്ദർഭത്തിലെ വിശിഷ്ടമോ ആഡംബരപൂർണമോ ആയ വസ്ത്രത്തിന്റെ സൂചനയും വായനക്കാരന് ഗ്രഹിക്കാം.
- source_word: ἰδοὺ
  choice: നോക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗ്രീക്ക് കണികയുടെ വാഗ്മിതാശക്തി ആധുനികവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: οἱ τὰ μαλακὰ φοροῦντες
  choice: മൃദുവായ വസ്ത്രം ധരിക്കുന്നവർ
  rationale: φοροῦντες സൂചിപ്പിക്കുന്ന പതിവായ ധാരണയും മുമ്പത്തെ μαλακοῖς എന്ന പദവുമായുള്ള ആവർത്തനബന്ധവും നിലനിർത്തുന്നു.
- source_word: ἐν τοῖς οἴκοις τῶν βασιλέων εἰσίν
  choice: രാജാക്കന്മാരുടെ ഭവനങ്ങളിലാണ്
  rationale: ‘രാജാക്കന്മാരുടെ ഭവനങ്ങൾ’ എന്ന ഗ്രീക്കിലെ ബഹുവചനഘടന ഔപചാരികമായി സംരക്ഷിക്കുന്നു; ‘രാജകൊട്ടാരങ്ങൾ’ എന്ന സ്വാഭാവിക അർഥവികൽപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
