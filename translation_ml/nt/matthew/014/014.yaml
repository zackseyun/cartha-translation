id: MAT.14.14
reference: Matthew 14:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸀ἐξελθὼν εἶδεν πολὺν ὄχλον, καὶ ἐσπλαγχνίσθη ἐπ’ αὐτοῖς καὶ ἐθεράπευσεν τοὺς ἀρρώστους αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/014.yaml
  text: And when he went ashore[a], he saw a large crowd[b], and he had compassion on them and healed their sick.
translation:
  language: ml
  text: അവൻ കരയ്ക്കിറങ്ങിയപ്പോൾ[a] ഒരു വലിയ ജനക്കൂട്ടത്തെ കണ്ടു. അവരോടു മനസ്സലിഞ്ഞ് അവരുടെ ഇടയിലെ രോഗികളെ സുഖപ്പെടുത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘പുറത്തുവന്നപ്പോൾ.’ ഈ സന്ദർഭത്തിൽ പടകിൽനിന്ന് കരയ്ക്കിറങ്ങിയതായിരിക്കാം ഉദ്ദേശ്യം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: കരയ്ക്കിറങ്ങിയപ്പോൾ
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥം ‘പുറത്തുവന്നപ്പോൾ’ എന്നാണെങ്കിലും, പടകിലെ യാത്രയുടെ സന്ദർഭത്തിൽ കരയ്ക്കിറങ്ങുന്നതാണ് ഉദ്ദേശ്യമെന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; അതിനാൽ സന്ദർഭാനുസൃതമായ ഈ പ്രയോഗം സ്വീകരിച്ചു.
- source_word: εἶδεν
  choice: കണ്ടു
  rationale: ὁράω എന്ന ക്രിയയുടെ സാധാരണ അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: πολὺν ὄχλον
  choice: ഒരു വലിയ ജനക്കൂട്ടത്തെ
  rationale: πολύς എന്നതിന്റെ അളവുസൂചനയും ὄχλος എന്നതിന്റെ ‘ജനക്കൂട്ടം’ എന്ന അർഥവും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἐσπλαγχνίσθη ἐπ’ αὐτοῖς
  choice: അവരോടു മനസ്സലിഞ്ഞ്
  rationale: σπλαγχνίζομαι സൂചിപ്പിക്കുന്ന ആഴമായ അനുകമ്പയെ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു; തുടർന്നുള്ള സൗഖ്യമാക്കലുമായുള്ള ബന്ധവും നിലനിർത്തുന്നു.
- source_word: ἐθεράπευσεν
  choice: സുഖപ്പെടുത്തി
  rationale: ഈ സന്ദർഭത്തിൽ θεραπεύω ശാരീരിക രോഗസൗഖ്യത്തെ സൂചിപ്പിക്കുന്നു; ‘സുഖപ്പെടുത്തി’ ആധുനിക മലയാളത്തിലെ സ്വാഭാവികമായ പ്രയോഗമാണ്.
- source_word: τοὺς ἀρρώστους αὐτῶν
  choice: അവരുടെ ഇടയിലെ രോഗികളെ
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തമായ ‘അവരുടെ രോഗികൾ’ എന്ന ഘടനയുടെ അർഥം—ജനക്കൂട്ടത്തിൽപ്പെട്ട രോഗികൾ—മലയാളത്തിൽ അസ്വാഭാവികതയില്ലാതെ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ വൈകാരിക പ്രതികരണത്തിന്റെ വിവർത്തനം
  choice: അവരോടു മനസ്സലിഞ്ഞ്
  alternative: അവരോടു ആഴമായ അനുകമ്പ തോന്നി
  rationale: വാക്യം യേശുവിന്റെ കരുണയെ സൗഖ്യമാക്കലിലേക്കു നയിച്ച പ്രതികരണമായി അവതരിപ്പിക്കുന്നു. തിരുവെഴുത്തിൽ ഇല്ലാത്ത തീവ്രതയോ സിദ്ധാന്തപരമായ വ്യാഖ്യാനമോ ചേർക്കാതെ ആ പ്രാധാന്യം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്ക് വാക്യത്തിന്റെ സംഭവക്രമവും കരുണയിൽനിന്ന് സൗഖ്യമാക്കലിലേക്കുള്ള ആശയബന്ധവും നിലനിർത്തിയിരിക്കുന്നു.
