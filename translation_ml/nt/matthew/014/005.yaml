id: MAT.14.5
reference: Matthew 14:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ θέλων αὐτὸν ἀποκτεῖναι ἐφοβήθη τὸν ὄχλον, ὅτι ὡς προφήτην αὐτὸν εἶχον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/005.yaml
  text: And wanting to kill him[a], he feared the crowd[b], because they regarded him as a prophet.
translation:
  language: ml
  text: അവനെ കൊല്ലാൻ ആഗ്രഹിച്ചെങ്കിലും[a], അവൻ ജനക്കൂട്ടത്തെ ഭയപ്പെട്ടു; കാരണം അവർ അവനെ ഒരു പ്രവാചകനായി കരുതിയിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “അവനെ കൊല്ലാൻ ആഗ്രഹിച്ചുകൊണ്ട്, അവൻ ജനക്കൂട്ടത്തെ ഭയപ്പെട്ടു.” സന്ദർഭത്തിൽ ഈ കൃദന്തരൂപത്തെ വഴങ്ങൽസൂചകമായി, “അവനെ കൊല്ലാൻ ആഗ്രഹിച്ചെങ്കിലും” എന്നു മനസ്സിലാക്കാം.'
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അവർ അവനെ ഒരു പ്രവാചകനായി കണക്കാക്കിയിരുന്നു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλων
  choice: ആഗ്രഹിച്ചിരുന്നെങ്കിലും
  rationale: 'വർത്തമാന കൃദന്തരൂപം പ്രധാനക്രിയയായ ἐφοβήθηയോടുള്ള സന്ദർഭബന്ധത്തിൽ വഴങ്ങൽസൂചകമായി മനസ്സിലാക്കാം: കൊല്ലാൻ ആഗ്രഹമുണ്ടായിരുന്നിട്ടും ജനക്കൂട്ടത്തെ ഭയപ്പെട്ടു. മലയാളത്തിൽ ഈ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.'
- source_word: ἀποκτεῖναι
  choice: കൊല്ലാൻ
  rationale: ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘കൊല്ലുക’ എന്നാണ്. ‘വധിക്കാൻ’ എന്നതിനെക്കാൾ സാധാരണവും വ്യക്തവുമാണ്; ‘കൊലപ്പെടുത്താൻ’ എന്നതിലെ അധിക നൈതിക ഊന്നൽ ചേർക്കുന്നില്ല.
- source_word: ἐφοβήθη
  choice: ഭയപ്പെട്ടു
  rationale: φοβέομαι എന്ന ക്രിയയുടെ ഭൂതകാലരൂപത്തിന് സ്വാഭാവികവും കൃത്യവുമായ മലയാള തുല്യം.
- source_word: τὸν ὄχλον
  choice: ജനക്കൂട്ടത്തെ
  rationale: ὄχλος ഇവിടെ ഒരുമിച്ചുകൂടിയ ആളുകളുടെ സമൂഹത്തെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘ജനക്കൂട്ടം’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: ὅτι
  choice: കാരണം
  rationale: ഹെരോദാവിന്റെ ഭയത്തിനുള്ള കാരണം അവതരിപ്പിക്കുന്ന ബന്ധകമായി ὅτι പ്രവർത്തിക്കുന്നു.
- source_word: ὡς προφήτην
  choice: ഒരു പ്രവാചകനായി
  rationale: ὡς സഹിതമുള്ള വിധേയ ദ്വിതീയാവിഭക്തി യോഹന്നാനെ ജനക്കൂട്ടം ഏതു നിലയിൽ കണക്കാക്കി എന്നു വ്യക്തമാക്കുന്നു.
- source_word: αὐτὸν εἶχον
  choice: അവർ അവനെ … കരുതിയിരുന്നു
  rationale: ἔχωയും വിധേയ ദ്വിതീയാവിഭക്തിയും ചേർന്ന പ്രയോഗം ‘ഒരാളായി കണക്കാക്കുക/കരുതുക’ എന്ന അർഥത്തിലാണ്; ‘കരുതിയിരുന്നു’ സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമാണ്.
theological_decisions:
- issue: ഗ്രീക്ക് വിവരണത്തിൽ സർവനാമങ്ങളായി മാത്രം വരുന്ന കർത്താവിന്റെയും കർമത്തിന്റെയും വ്യക്തിത്വം
  choice: വാക്യത്തിൽ പേരുകൾ ചേർക്കാതെ ‘അവൻ’, ‘അവനെ’ എന്നീ സർവനാമങ്ങൾ നിലനിർത്തി
  alternative: ‘ഹെരോദാവ് യോഹന്നാനെ കൊല്ലാൻ ആഗ്രഹിച്ചിരുന്നെങ്കിലും…’ എന്ന് പേരുകൾ വ്യക്തമാക്കി വിവർത്തനം ചെയ്യുക
  rationale: സമീപസന്ദർഭം ഹെരോദാവിനെയും യോഹന്നാനെയും തിരിച്ചറിയിക്കുന്നു. പേരുകൾ ചേർക്കുന്നത് വായന എളുപ്പമാക്കുമെങ്കിലും മൂലപാഠത്തേക്കാൾ കൂടുതൽ വ്യക്തത ചേർക്കും; അതിനാൽ ഗ്രീക്കിന്റെ രൂപവും സന്ദർഭാശ്രയത്വവും നിലനിർത്തി.
- issue: θέλων എന്ന കൃദന്തരൂപവും ἐφοβήθη എന്ന പ്രധാനക്രിയയും തമ്മിലുള്ള ബന്ധം
  choice: സന്ദർഭത്തിൽ വഴങ്ങൽസൂചകമായി ‘ആഗ്രഹിച്ചിരുന്നെങ്കിലും’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: അക്ഷരാർഥത്തോട് അടുത്ത് ‘അവനെ കൊല്ലാൻ ആഗ്രഹിച്ചുകൊണ്ട്, അവൻ ജനക്കൂട്ടത്തെ ഭയപ്പെട്ടു’ എന്നു പരിഭാഷപ്പെടുത്തുക
  rationale: ഗ്രീക്കിൽ ബന്ധം വ്യാകരണപരമായി തുറന്ന നിലയിലാണെങ്കിലും, കൊല്ലാനുള്ള ആഗ്രഹത്തിന് വിരുദ്ധമായി ജനക്കൂട്ടത്തോടുള്ള ഭയം തടസ്സമായെന്ന സന്ദർഭബന്ധം മലയാളത്തിൽ ‘എങ്കിലും’ സ്വാഭാവികമായി അറിയിക്കുന്നു. യഥാരൂപത്തിലെ അസ്പഷ്ടത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി ഉപയോഗിച്ചു. മൂലത്തിലെ സർവനാമങ്ങൾ നിലനിർത്തി; സന്ദർഭം ആവശ്യപ്പെടാത്ത പേരുകളോ സഭാപാരമ്പര്യപരമായ വ്യാഖ്യാനങ്ങളോ ചേർത്തിട്ടില്ല.
