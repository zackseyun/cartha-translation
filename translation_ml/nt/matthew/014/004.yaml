reference: Matthew 14:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔλεγεν γὰρ ⸂αὐτῷ ὁ Ἰωάννης⸃· Οὐκ ἔξεστίν σοι ἔχειν αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/004.yaml
  text: For John had been saying to him[a], “It is not lawful for you to have her.”
translation:
  language: ml
  text: കാരണം, യോഹന്നാൻ അവനോട്, “അവളെ ഭാര്യയായി സ്വീകരിച്ചിരിക്കുന്നത് നിനക്കു നിയമാനുസൃതമല്ല[a],” എന്നു പറഞ്ഞുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവളെ ഭാര്യയായി സ്വീകരിക്കാൻ നിനക്കു അനുവാദമില്ല.”
    reason: ἔξεστιν എന്ന പദം നിയമാനുസൃതതയെയും അനുവദനീയതയെയും സൂചിപ്പിക്കാം. ‘ഭാര്യയായി’ എന്നത് ഈ സന്ദർഭത്തിൽ ἔχειν എന്ന പ്രയോഗത്തിന്റെ വൈവാഹിക അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: ἔλεγεν
  choice: പറഞ്ഞുവരികയായിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം മുൻകാലത്ത് തുടർന്നതോ ആവർത്തിച്ചതോ ആയ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ രൂപം ആ ദൈർഘ്യസ്വഭാവം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻസന്ദർഭത്തിലെ സംഭവത്തിന് വിശദീകരണപരമായ പശ്ചാത്തലം നൽകുന്ന ബന്ധകശക്തി വ്യക്തമാക്കുന്നു.
- source_word: αὐτῷ
  choice: അവനോട്
  rationale: λέγω എന്ന ക്രിയയോടുകൂടിയ ദത്തിവിഭക്തിയുടെ സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്.
- source_word: ὁ Ἰωάννης
  choice: യോഹന്നാൻ
  rationale: ഗ്രീക്കിൽ ഉള്ളതുപോലെ പേരുമാത്രം നൽകുന്നു; ‘സ്നാപകൻ’ എന്ന വിശദീകരണം വാക്യത്തിൽ കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: Οὐκ ἔξεστίν
  choice: നിയമാനുസൃതമല്ല
  rationale: അനുവദനീയതയുടെയും നിയമസാധുതയുടെയും ധാർമിക-നിയമപരമായ ശക്തി നിലനിർത്തുന്നു.
- source_word: σοι
  choice: നിനക്കു
  rationale: അനുവദനീയത സൂചിപ്പിക്കുന്ന നിരപേക്ഷ പ്രയോഗത്തോടുകൂടിയ ദത്തിവിഭക്തിയെ നേരിട്ട്, സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἔχειν
  choice: വെച്ചുകൊള്ളുന്നത്
  rationale: ഈ ബന്ധസന്ദർഭത്തിൽ ഒരാളെ തന്റേതായി കൂടെ നിലനിർത്തുക എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു; ‘ഭാര്യയായി’ എന്നു ചേർത്ത് മൂലത്തിൽ വ്യക്തമല്ലാത്തത് വാചകത്തിൽ ഉൾപ്പെടുത്തുന്നില്ല.
- source_word: αὐτήν
  choice: അവളെ
  rationale: ഹെരോദ്യയെ സൂചിപ്പിക്കുന്ന സ്ത്രീലിംഗ സർവനാമത്തിന്റെ നേരിട്ടുള്ള പരിഭാഷയാണ്.
theological_decisions:
- issue: യോഹന്നാന്റെ ശാസനയുടെ സ്വഭാവം
  choice: “നിയമാനുസൃതമല്ല” എന്ന നിയമപരവും ധാർമികവുമായ നിരോധനം
  alternative: “ശരിയല്ല” എന്ന പൊതുവായ ധാർമിക വിലയിരുത്തൽ
  rationale: ἔξεστιν അനുവദനീയതയെയും നിയമസാധുതയെയും സൂചിപ്പിക്കുന്നു. അതിനാൽ പൊതുവായ ‘ശരിയല്ല’ എന്നതിനേക്കാൾ മൂലത്തിന്റെ മൂർച്ചയുള്ള നിയമ-ധാർമിക ശക്തി ഈ പരിഭാഷ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘പറഞ്ഞുവരികയായിരുന്നു’ എന്നത് ആവർത്തിതമോ തുടർച്ചയായതോ ആയ മുൻകാലപ്രവൃത്തിയെ സൂക്ഷിക്കുന്നു; ‘വെച്ചുകൊള്ളുന്നത്’ ബന്ധസന്ദർഭം നിലനിർത്തുമ്പോഴും ‘ഭാര്യയായി’ എന്ന വ്യാഖ്യാനവികാസം ഒഴിവാക്കുന്നു.
