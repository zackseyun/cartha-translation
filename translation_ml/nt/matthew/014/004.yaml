revisions:
- from: കാരണം യോഹന്നാൻ അവനോട്, “അവളെ വെച്ചുകൊള്ളുന്നത് നിനക്കു നിയമാനുസൃതമല്ല[a],” എന്നു പറഞ്ഞുവരികയായിരുന്നു.
  to: കാരണം, യോഹന്നാൻ അവനോട്, “അവളെ ഭാര്യയായി സ്വീകരിച്ചിരിക്കുന്നത് നിനക്കു നിയമാനുസൃതമല്ല[a],” എന്നു പറഞ്ഞുകൊണ്ടിരുന്നു.
  rationale: The revision preserves the explanatory force of γάρ, the durative force of ἔλεγεν, and the legal-moral force of οὐκ ἔξεστιν. It replaces unnatural wording with idiomatic modern Malayalam while making explicit only the marital sense already required by the immediate context.
