language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀποκριθεὶς δὲ ⸂αὐτῷ ὁ Πέτρος εἶπεν⸃· Κύριε, εἰ σὺ εἶ, κέλευσόν με ⸂ἐλθεῖν πρὸς σὲ⸃ ἐπὶ τὰ ὕδατα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/028.yaml
  text: And Peter answered him[a], “Lord, if it is you, command me to come to you on the waters.”
translation:
  language: ml
  text: 'പത്രോസ് അവനോടു മറുപടി പറഞ്ഞു: “കർത്താവേ, അങ്ങുതന്നെയാണെങ്കിൽ, വെള്ളത്തിന്മീതെ[a] അങ്ങയുടെ അടുക്കൽ വരാൻ എന്നോടു കല്പിക്കണമേ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “വെള്ളങ്ങൾക്കുമീതെ”; ഗ്രീക്കിൽ “വെള്ളം” എന്ന പദം ബഹുവചനത്തിലാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ αὐτῷ ὁ Πέτρος εἶπεν
  choice: അപ്പോൾ പത്രോസ് അവനോട് മറുപടി പറഞ്ഞു
  rationale: δέ സഹിതമുള്ള ഈ സാധാരണ ആഖ്യാനപ്രയോഗത്തെ സ്വാഭാവികമായ മലയാള വാക്യക്രമത്തിൽ അവതരിപ്പിക്കുന്നു; αὐτῷ എന്ന ദത്തിവിഭക്തിയുടെ ബന്ധം ‘അവനോട്’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: നേരിട്ടുള്ള സംബോധനവും ബഹുമാനവും സാധ്യമായ ക്രിസ്തുശാസ്ത്രപരമായ ഭാരവും നിലനിർത്തുന്ന പതിവ് മലയാള പരിഭാഷ.
- source_word: εἰ σὺ εἶ
  choice: അത് അങ്ങാണെങ്കിൽ
  rationale: സന്ദർഭത്തിലെ വ്യക്തിതിരിച്ചറിയൽ സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു; നിബന്ധനയുടെ സ്വരം തീർപ്പാക്കാതെ നിലനിർത്തുന്നു.
- source_word: κέλευσόν με
  choice: എന്നോട് കല്പിക്കണമേ
  rationale: κελεύω സൂചിപ്പിക്കുന്ന അധികാരപൂർവമായ നിർദേശം നിലനിർത്തുന്നു; അപേക്ഷാഭാവമുള്ള ഗ്രീക്ക് ആജ്ഞാരൂപത്തിന് സ്വാഭാവികമായ മലയാള വിനയപ്രയോഗം ഉപയോഗിക്കുന്നു.
- source_word: ἐλθεῖν πρὸς σὲ
  choice: അങ്ങയുടെ അടുക്കൽ വരാൻ
  rationale: യേശുവിലേക്കുള്ള ചലനം വ്യക്തമാക്കുകയും ‘വരുക’ എന്ന സന്ദർഭോചിത ദൃഷ്ടികോണം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐπὶ τὰ ὕδατα
  choice: വെള്ളത്തിന്മീതെ
  rationale: ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ ഏകവചനസമൂഹനാമം ഉപയോഗിക്കുന്നു; ഗ്രീക്കിലെ ബഹുവചനരൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
theological_decisions:
- issue: യേശുവിനെ κύριε എന്നു സംബോധന ചെയ്യുന്നതിന്റെ ശക്തി
  choice: കർത്താവേ
  alternative: ഗുരോ / യജമാനനേ
  rationale: ഇത് വെറും വിനയസംബോധനയായി ചുരുക്കാതെ, മത്തായിയുടെ സുവിശേഷത്തിൽ ഉണ്ടായേക്കാവുന്ന ദൈവശാസ്ത്രപരമായ ഭാരം തുറന്ന നിലയിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. യേശുവിനോടുള്ള ബഹുമാനസൂചകമായി ‘അങ്ങ്’ ഉപയോഗിച്ചു. ഗ്രീക്കിലെ ബഹുവചനമായ ‘വെള്ളങ്ങൾ’ മുഖ്യവാക്യത്തിൽ അസ്വാഭാവികമാകുന്നതിനാൽ ‘വെള്ളം’ എന്ന സമൂഹനാമമായി പരിഭാഷപ്പെടുത്തി, രൂപപരമായ വിവരം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
