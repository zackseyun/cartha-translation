id: MAT.14.3
reference: Matthew 14:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὁ γὰρ Ἡρῴδης κρατήσας τὸν Ἰωάννην ἔδησεν ⸀αὐτὸν καὶ ⸂ἐν φυλακῇ ἀπέθετο⸃ διὰ Ἡρῳδιάδα τὴν γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/003.yaml
  text: For Herod had arrested John[a], bound him, and put him in prison because of Herodias, the wife of Philip his brother,
translation:
  language: ml
  text: എന്തെന്നാൽ, ഹെരോദാവ് യോഹന്നാനെ പിടികൂടി[a] ബന്ധിച്ച്, തന്റെ സഹോദരനായ ഫിലിപ്പിന്റെ ഭാര്യ ഹെരോദ്യ നിമിത്തം തടവിലിട്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യോഹന്നാനെ പിടിച്ച്, ബന്ധിച്ച്, തടവിലിട്ടു.’
    reason: κρατήσας എന്ന പദത്തിന്റെ കൂടുതൽ അക്ഷരാർഥപരമായ പരിഭാഷയും അതിനെ തുടർന്നുള്ള participial ഘടനയും കാണിക്കുന്ന പദപരമായ ബദൽ.
lexical_decisions:
- source_word: γὰρ
  choice: മുൻസന്ദർഭത്തോടുള്ള വിശദീകരണബന്ധം മലയാളത്തിലെ വാക്യക്രമത്തിലൂടെ സൂചിപ്പിച്ചു
  rationale: ഒറ്റവാക്യമായി വായിക്കുമ്പോൾ ‘എന്തെന്നാൽ’ എന്നത് അസ്വാഭാവികമാകാം; ഗ്രീക്കിലെ γὰρ നൽകുന്ന വിശദീകരണബന്ധം മുൻവാക്യത്തെ തുടർന്നുള്ള വായനയിൽ സ്വാഭാവികമായി തെളിയുന്നു.
- source_word: κρατήσας
  choice: പിടികൂടി
  rationale: അധികാരികൾ ഒരാളെ കസ്റ്റഡിയിലെടുക്കുന്ന സന്ദർഭത്തിന് യോജിക്കുകയും ‘പിടിച്ചെടുക്കുക’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുകയും ചെയ്യുന്നു; ‘അറസ്റ്റുചെയ്തു’ എന്ന നിയമസാങ്കേതിക പദത്തേക്കാൾ ഉറവിടത്തോട് അടുത്തതാണ്.
- source_word: ἔδησεν
  choice: ബന്ധിച്ച്
  rationale: δέω എന്ന പദത്തിന്റെ മൂർത്തമായ അർഥം നിലനിർത്തുന്നു; ചങ്ങലയോ കയറോ എന്ന് അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: ἐν φυλακῇ ἀπέθετο
  choice: തടവിലാക്കിയിരുന്നു
  rationale: ഈ പ്രയോഗത്തിന്റെ തടവിലിടുക എന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; പ്രധാന ക്രിയകൾ മുൻകാല സംഭവത്തെ വിവരിക്കുന്നതിനാൽ ‘ഇരുന്നു’ ഉപയോഗിച്ചു.
- source_word: διὰ Ἡρῳδιάδα
  choice: ഹെരോദ്യ നിമിത്തം
  rationale: διά + accusative ഇവിടെ കാരണമോ നിമിത്തമോ സൂചിപ്പിക്കുന്നു; ബന്ധത്തിന്റെ ധാർമ്മിക വിലയിരുത്തൽ മുൻകൂട്ടി ചേർക്കുന്നില്ല.
- source_word: γυναῖκα
  choice: ഭാര്യ
  rationale: ഫിലിപ്പുമായുള്ള ബന്ധം സൂചിപ്പിക്കുന്ന ഈ ഘടനയിൽ γυνήയുടെ സന്ദർഭോചിത അർഥം ‘ഭാര്യ’ ആണ്.
- source_word: Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ
  choice: തന്റെ സഹോദരനായ ഫിലിപ്പിന്റെ
  rationale: ഫിലിപ്പ് ഹെരോദാവിന്റെ സഹോദരനാണെന്ന ഗ്രീക്കിലെ appositional ബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: ഫിലിപ്പുമായുള്ള ഹെരോദ്യയുടെ ബന്ധത്തിന്റെ ചരിത്ര-ധാർമ്മിക അവതരണം
  choice: ‘തന്റെ സഹോദരനായ ഫിലിപ്പിന്റെ ഭാര്യ ഹെരോദ്യ’ എന്ന് നിഷ്പക്ഷമായി തിരിച്ചറിയിച്ചു
  alternative: ‘സഹോദരനായ ഫിലിപ്പിന്റെ ഭാര്യയെ സ്വന്തമാക്കിയ ഹെരോദാവ്’ എന്നിങ്ങനെ നിയമവിരുദ്ധത ഈ വാക്യത്തിൽത്തന്നെ വ്യക്തമാക്കുക
  rationale: ഈ വാക്യം ഹെരോദ്യയെ ഫിലിപ്പിന്റെ ഭാര്യയായി തിരിച്ചറിയുന്നു; ബന്ധത്തിന്റെ നിയമവിരുദ്ധത അടുത്ത വാക്യത്തിലാണ് തുറന്നുപറയുന്നത്. അതിനാൽ ആ വിധി ഇവിടെ മുൻകൂട്ടി ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. കഥനത്തിന്റെ മുൻകാലക്രമം ‘തടവിലാക്കിയിരുന്നു’ എന്ന രൂപത്തിൽ വ്യക്തമാക്കി. വ്യക്തിനാമങ്ങൾ സാധാരണ മലയാള ബൈബിൾ പ്രയോഗത്തിന് ചേർന്ന ‘ഹെരോദാവ്’, ‘യോഹന്നാൻ’, ‘ഫിലിപ്പ്’, ‘ഹെരോദ്യ’ എന്നീ രൂപങ്ങളിൽ നൽകി.
