revisions:
- from: അവന്റെ വസ്ത്രത്തിന്റെ അരികിൽ[a] ഒന്നു തൊടാൻ മാത്രം അനുവദിക്കണമെന്നു അവർ അവനോടു യാചിച്ചുകൊണ്ടിരുന്നു. തൊട്ടവരെല്ലാം സൗഖ്യം പ്രാപിച്ചു.[b]
  to: അവന്റെ വസ്ത്രത്തിന്റെ അരികു[a] മാത്രം തൊടാൻ അവർ അവനോടു യാചിച്ചുകൊണ്ടിരുന്നു. അങ്ങനെ തൊട്ടവരെല്ലാം സൗഖ്യം പ്രാപിച്ചു.[b]
  rationale: The revision removes the unsupported permission element while retaining the imperfect sense of repeated pleading. It also renders μόνον directly as “അരികു മാത്രം,” preserving the sense that mere contact with the garment’s border was sought. The healing wording and both lexical footnotes remain sound.
