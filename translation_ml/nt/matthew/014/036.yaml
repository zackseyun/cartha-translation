id: MAT.14.36
reference: Matthew 14:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ παρεκάλουν αὐτὸν ἵνα μόνον ἅψωνται τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ· καὶ ὅσοι ἥψαντο διεσώθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/036.yaml
  text: And they begged him that they might only touch the fringe of his garment[b][a], and as many as touched it were healed.
translation:
  language: ml
  text: അവന്റെ വസ്ത്രത്തിന്റെ അരികു[a] മാത്രം തൊടാൻ അവർ അവനോടു യാചിച്ചുകൊണ്ടിരുന്നു. അങ്ങനെ തൊട്ടവരെല്ലാം സൗഖ്യം പ്രാപിച്ചു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അരികു’ എന്നതിന് പകരം ‘വിളുമ്പ്’ അല്ലെങ്കിൽ ‘തൊങ്ങൽ’ എന്നും വിവർത്തനം ചെയ്യാം; ഗ്രീക്ക് പദം വസ്ത്രത്തിന്റെ അതിരിനെയോ അതിലുള്ള തൊങ്ങലിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘പൂർണമായി സുഖപ്പെട്ടു’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘രക്ഷിക്കപ്പെട്ടു’ അഥവാ ‘വീണ്ടെടുക്കപ്പെട്ടു’ എന്ന വിശാലമായ അർഥവും ഉണ്ടാകാം; ഇവിടെ സന്ദർഭം ശാരീരിക സൗഖ്യമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκάλουν
  choice: യാചിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലരൂപം തുടർച്ചയായോ ആവർത്തിച്ചോ ഉള്ള അപേക്ഷയെ സൂചിപ്പിക്കുന്നു; ‘യാചിച്ചുകൊണ്ടിരുന്നു’ അതിന്റെ തീവ്രതയും ദൈർഘ്യവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἵνα μόνον ἅψωνται
  choice: ഒന്നു തൊടാൻ മാത്രം അനുവദിക്കണമെന്നു
  rationale: ἵνα സഹിതമുള്ള ഉപവാക്യം അപേക്ഷയുടെ ഉള്ളടക്കം വ്യക്തമാക്കുന്നു; μόνον സൂചിപ്പിക്കുന്ന ‘തൊടുക മാത്രം’ എന്ന ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു. ‘അനുവദിക്കണമെന്നു’ എന്നത് അപേക്ഷയിൽ അന്തർലീനമായ അനുമതിയുടെ ആശയം വ്യക്തമാക്കുന്നു.
- source_word: κρασπέδου
  choice: അരികിൽ
  rationale: κράσπεδον വസ്ത്രത്തിന്റെ അരിക്, വിളുമ്പ്, തൊങ്ങൽ എന്നിവയെ സൂചിപ്പിക്കാം. ‘അരിക്’ പൊതുവായ അർഥം നിലനിർത്തുകയും ‘തൊങ്ങൽ’ എന്നു അതിവിശദമാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: അവന്റെ വസ്ത്രത്തിന്റെ
  rationale: ἱμάτιον പൊതുവായി വസ്ത്രത്തെയോ മേൽവസ്ത്രത്തെയോ സൂചിപ്പിക്കുന്നു; ‘വസ്ത്രം’ അനാവശ്യമായ പ്രത്യേകീകരണം ഒഴിവാക്കുന്നു.
- source_word: ὅσοι
  choice: തൊട്ടവരെല്ലാം
  rationale: ὅσοι എന്നതിന്റെ പരിധിവാചകവും സമഗ്രവുമായ അർഥം മലയാളത്തിൽ ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: ἥψαντο
  choice: തൊട്ടവർ
  rationale: മുൻപ് പറഞ്ഞ വസ്ത്രത്തിന്റെ അരികാണ് കർമമെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നതിനാൽ മലയാളത്തിൽ അത് വീണ്ടും ആവർത്തിക്കാതെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: διεσώθησαν
  choice: സൗഖ്യം പ്രാപിച്ചു
  rationale: διασῴζω രക്ഷിക്കപ്പെടുക, സുരക്ഷിതനാകുക, പൂർണസൗഖ്യം പ്രാപിക്കുക എന്നീ വ്യാപക അർഥങ്ങൾ വഹിക്കാം; ഇവിടെ രോഗശാന്തിയുടെ സന്ദർഭത്തിൽ ‘സൗഖ്യം പ്രാപിച്ചു’ യോജിക്കുന്നു, എന്നാൽ പദത്തിന്റെ വിപുലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: രോഗശാന്തിയുടെ സന്ദർഭത്തിലെ διεσώθησαν എന്ന പദത്തിന്റെ അർഥം
  choice: ശാരീരികമായി ‘സൗഖ്യം പ്രാപിച്ചു’
  alternative: ‘രക്ഷിക്കപ്പെട്ടു’ അല്ലെങ്കിൽ ‘പൂർണമായി സുഖപ്പെട്ടു’
  rationale: തൊട്ടവരുടെ ശാരീരിക രോഗശാന്തിയാണ് തൊട്ടുമുമ്പുള്ള സന്ദർഭം. അതിനാൽ പ്രധാനപാഠത്തിൽ ‘സൗഖ്യം പ്രാപിച്ചു’ എന്നു നൽകുന്നു; എന്നാൽ ക്രിയയുടെ വിശാലമായ രക്ഷ/വീണ്ടെടുപ്പ് അർഥസാധ്യത അടിക്കുറിപ്പിലൂടെ മറച്ചുവയ്ക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘യാചിച്ചുകൊണ്ടിരുന്നു’ എന്ന രൂപം ക്രിയയുടെ തുടർച്ചാഭാവം സംരക്ഷിക്കുന്നു. ‘വസ്ത്രത്തിന്റെ അരിക്’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കുമ്പോൾ സാധ്യതയുള്ള തൊങ്ങൽ/വിളുമ്പ് അർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
