id: MAT.14.27
reference: Matthew 14:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀εὐθὺς δὲ ἐλάλησεν ⸂αὐτοῖς ὁ Ἰησοῦς⸃ λέγων· Θαρσεῖτε, ἐγώ εἰμι· μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/027.yaml
  text: But immediately Jesus spoke to them[a], saying, “Take courage; it is I. Do not be afraid.”
translation:
  language: ml
  text: 'എന്നാൽ ഉടനെ യേശു അവരോടു സംസാരിച്ചു: “ധൈര്യപ്പെടുവിൻ; ഞാനാണ്[a]. ഭയപ്പെടേണ്ടാ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, “ഞാൻ ആകുന്നു.” ഇവിടെ ഗ്രീക്ക് പ്രയോഗം സാധാരണ സ്വയം തിരിച്ചറിയിക്കലായി പ്രവർത്തിക്കാം; എന്നാൽ ദൈവിക സ്വയംപ്രഖ്യാപനത്തിന്റെ ഒരു സാധ്യതയുള്ള പ്രതിധ്വനി ചില വായനക്കാർ ഇതിൽ കേൾക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθύς
  choice: ഉടനെ
  rationale: സംഭവത്തിന്റെ തൽക്ഷണത ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായും വ്യക്തമായും അറിയിക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ ശിഷ്യന്മാരുടെ ഭയത്തോടുള്ള മൃദുവായ വൈരുധ്യവും ആഖ്യാനത്തിലെ വഴിത്തിരിവും സൂചിപ്പിക്കുന്നു.
- source_word: ἐλάλησεν αὐτοῖς ὁ Ἰησοῦς λέγων
  choice: യേശു അവരോടു സംസാരിച്ചു
  rationale: ഗ്രീക്കിലെ ‘സംസാരിച്ചു ... പറഞ്ഞുകൊണ്ട്’ എന്ന ഘടന മലയാളത്തിൽ അനാവശ്യ ആവർത്തനമാകുന്നതിനാൽ, നേരിട്ടുള്ള ഉദ്ധരണിക്ക് മുമ്പായി സ്വാഭാവികമായി ചുരുക്കിയിരിക്കുന്നു.
- source_word: Θαρσεῖτε
  choice: ധൈര്യപ്പെടുവിൻ
  rationale: ബഹുവചന ആജ്ഞയുടെ പ്രോത്സാഹനസ്വരം നിലനിർത്തുന്ന, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ പ്രയോഗം.
- source_word: ἐγώ εἰμι
  choice: ഞാനാണ്
  rationale: ഈ സന്ദർഭത്തിലെ സ്വയം തിരിച്ചറിയിക്കൽ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; അതേസമയം ‘ഞാൻ ആകുന്നു’ എന്ന കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള രൂപവും അതിന്റെ സാധ്യതയുള്ള ദൈവശാസ്ത്രപരമായ പ്രതിധ്വനിയും അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: μὴ φοβεῖσθε
  choice: ഭയപ്പെടേണ്ടാ
  rationale: നിഷേധാത്മക ബഹുവചന ആജ്ഞയെ സ്വാഭാവികവും ആശ്വാസദായകവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ക്രിയയുടെ കാലഭാവത്തെ ‘ഇനി ഭയപ്പെടരുത്’ എന്നു അതിവ്യക്തമാക്കുന്നില്ല.
theological_decisions:
- issue: ἐγώ εἰμι എന്നത് സാധാരണ സ്വയം തിരിച്ചറിയിക്കലായോ ദൈവിക ‘ഞാൻ ആകുന്നു’ എന്ന സ്വയംപ്രഖ്യാപനത്തിന്റെ പ്രതിധ്വനിയോടെയോ അവതരിപ്പിക്കേണ്ടതുണ്ടോ
  choice: പ്രധാന പാഠത്തിൽ സന്ദർഭോചിതമായ ‘ഞാനാണ്’
  alternative: ‘ഞാൻ ആകുന്നു’ എന്ന കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള പരിഭാഷ
  rationale: ഭയന്ന ശിഷ്യന്മാരെ ആശ്വസിപ്പിക്കാൻ യേശു സ്വയം തിരിച്ചറിയിക്കുന്നതാണ് ഉടൻ കാണുന്ന അർഥം. എന്നാൽ ഗ്രീക്കിന്റെ കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള രൂപത്തിൽ ചില വായനക്കാർ കേൾക്കുന്ന ദൈവിക സ്വയംപ്രഖ്യാപനത്തിന്റെ സാധ്യത നിശ്ശബ്ദമായി ഇല്ലാതാക്കാതിരിക്കാൻ അത് അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ധൈര്യപ്പെടുവിൻ’ എന്നത് ബഹുവചന ആജ്ഞയും ഉത്സാഹപ്പെടുത്തുന്ന സ്വരവും നിലനിർത്തുന്നു. നേരിട്ടുള്ള ഉദ്ധരണിക്ക് മുമ്പുള്ള ഗ്രീക്ക് ആവർത്തനഘടന മലയാളത്തിലെ സ്വാഭാവിക പ്രവാഹത്തിനായി ചുരുക്കിയിരിക്കുന്നു.
