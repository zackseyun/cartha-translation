id: MAT.14.26
reference: Matthew 14:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂οἱ δὲ μαθηταὶ ἰδόντες αὐτὸν⸃ ἐπὶ ⸂τῆς θαλάσσης⸃ περιπατοῦντα ἐταράχθησαν λέγοντες ὅτι Φάντασμά ἐστιν, καὶ ἀπὸ τοῦ φόβου ἔκραξαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/026.yaml
  text: But when the disciples saw him walking on the sea[a], they were terrified, saying, “It is a ghost!” And they cried out from fear.
translation:
  language: ml
  text: എന്നാൽ ശിഷ്യന്മാർ അവൻ കടലിന്മേൽ നടക്കുന്നതു കണ്ടപ്പോൾ പരിഭ്രാന്തരായി. “ഇത് ഒരു പ്രേതമാണ്![a]” എന്നു പറഞ്ഞ് അവർ ഭയത്താൽ നിലവിളിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഒരു പ്രേതരൂപം” അല്ലെങ്കിൽ “ഒരു പ്രതിഭാസം.”
    reason: φάντασμα എന്ന ഗ്രീക്കുപദം പ്രേതസദൃശമായ ഒരു പ്രത്യക്ഷതയെയോ പ്രതിഭാസത്തെയോ സൂചിപ്പിക്കാം. ഇവിടെ ശിഷ്യന്മാരുടെ ഭയത്തോടെയുള്ള ധാരണയാണ് വിവരിക്കുന്നത്.
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിൽനിന്നുള്ള നേരിയ ആഖ്യാനവ്യത്യാസവും ശിഷ്യന്മാരുടെ പെട്ടെന്നുള്ള ഭയപ്രതികരണവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: οἱ μαθηταὶ ἰδόντες αὐτὸν
  choice: അവനെ ... കണ്ടപ്പോൾ ശിഷ്യന്മാർ
  rationale: ഗ്രീക്കിലെ aorist participle സ്വാഭാവികമായ മലയാളത്തിൽ കാലസൂചക ഉപവാക്യമായി നൽകി; definite ആയ μαθηταί-നെ ‘ശിഷ്യന്മാർ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: ἐπὶ τῆς θαλάσσης περιπατοῦντα
  choice: കടലിന്മേൽ നടക്കുന്നതായി
  rationale: ἐπί + genitive ഇവിടെ കടലിന്റെ ഉപരിതലത്തിന്മേലുള്ള നടത്തത്തെ സൂചിപ്പിക്കുന്നു; ‘കടലിന്മേൽ’ മൂലപദമായ θάλασσα-യോട് അടുത്തതും വ്യക്തവുമാണ്.
- source_word: ἐταράχθησαν
  choice: പരിഭ്രാന്തരായി
  rationale: ταράσσω സൂചിപ്പിക്കുന്ന ഉള്ളിലെ കലക്കവും ഈ സന്ദർഭത്തിലെ ശക്തമായ ഭയവും ഒരുമിച്ച് പകർത്തുന്നു; ‘ഭയപ്പെട്ടു’ എന്നതിനെക്കാൾ ശക്തവും ‘ഭീതിവിവശരായി’ എന്നതിനെക്കാൾ സ്വാഭാവികവുമാണ്.
- source_word: Φάντασμά ἐστιν
  choice: അത് ഒരു ഭൂതമാണ്!
  rationale: φάντασμα എന്നത് പ്രേതസദൃശമായ പ്രത്യക്ഷരൂപത്തെയോ apparition-നെയോ സൂചിപ്പിക്കുന്നു. സാധാരണ വായനക്കാർക്ക് ശിഷ്യന്മാരുടെ ഭയന്നുള്ള നിഗമനം നേരിട്ട് മനസ്സിലാകാൻ ‘ഭൂതം’ അനുയോജ്യം; പദത്തിന്റെ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἀπὸ τοῦ φόβου ἔκραξαν
  choice: അവർ ഭയംകൊണ്ട് നിലവിളിച്ചു
  rationale: ἀπό ഇവിടെ കാരണത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഭയംകൊണ്ട്’ എന്നു നൽകി; κράζω-യുടെ ഉച്ചത്തിലുള്ള വിളി ‘നിലവിളിച്ചു’ സ്വാഭാവികമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: φάντασμα എന്ന പദം സൂചിപ്പിക്കുന്നതിന്റെ സ്വഭാവം
  choice: പ്രധാനവാചകത്തിൽ ‘ഭൂതം’ എന്നു നൽകി
  alternative: ‘പ്രേതരൂപം’ അല്ലെങ്കിൽ ‘ഒരു ദൃശ്യം’
  rationale: ഇത് യേശുവിനെ കണ്ടപ്പോൾ ശിഷ്യന്മാർ ഭയന്ന് നടത്തിയ തെറ്റായ തിരിച്ചറിയലാണ്; ആത്മാക്കളെക്കുറിച്ചുള്ള ഒരു സത്താപരമായോ സിദ്ധാന്തപരമായോ പ്രഖ്യാപനമല്ല. അതിനാൽ അവരുടെ ധാരണയായി മാത്രം വാചകം അവതരിപ്പിക്കുകയും പദത്തിന്റെ വ്യാപ്തി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘പരിഭ്രാന്തരായി’, ‘ഭയംകൊണ്ട് നിലവിളിച്ചു’ എന്നീ പ്രയോഗങ്ങൾ മൂലത്തിലെ ഭയത്തിന്റെ തീവ്രത നിലനിർത്തുന്നു. അടിക്കുറിപ്പിന്റെ സൂചകം അതുമായി ബന്ധപ്പെട്ട ‘ഭൂതമാണ്’ എന്ന പദത്തിനുശേഷം തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
