revisions:
- from: എന്നാൽ അവൻ കടലിന്മേൽ നടക്കുന്നതായി കണ്ടപ്പോൾ ശിഷ്യന്മാർ പരിഭ്രാന്തരായി. “അത് ഒരു ഭൂതമാണ്![a]” എന്നു പറഞ്ഞ് അവർ ഭയംകൊണ്ട് നിലവിളിച്ചു.
  to: എന്നാൽ ശിഷ്യന്മാർ അവൻ കടലിന്മേൽ നടക്കുന്നതു കണ്ടപ്പോൾ പരിഭ്രാന്തരായി. “ഇത് ഒരു പ്രേതമാണ്![a]” എന്നു പറഞ്ഞ് അവർ ഭയത്താൽ നിലവിളിച്ചു.
  rationale: The opening has been reordered so that ‘ശിഷ്യന്മാർ’ unambiguously governs ‘കണ്ടപ്പോൾ,’ as in the Greek. ‘പ്രേതം’ replaces ‘ഭൂതം’ to communicate φάντασμα as a ghost/apparition without inviting an unintended demon sense. The footnote retains viable lexical alternatives and remains anchored immediately after the term it explains.
  reviewer_model: gpt-5.6-terra
