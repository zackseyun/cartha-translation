source:
  edition: SBLGNT
  text: τὸ δὲ πλοῖον ἤδη ⸂σταδίους πολλοὺς ἀπὸ τῆς γῆς ἀπεῖχεν⸃, βασανιζόμενον ὑπὸ τῶν κυμάτων, ἦν γὰρ ἐναντίος ὁ ἄνεμος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/024.yaml
  text: But the boat was already many stadia from the land[a], being battered by the waves[c][b], for the wind was against it.
translation:
  language: ml
  text: എന്നാൽ വള്ളം അപ്പോഴേക്കും കരയിൽനിന്ന് അനേകം സ്റ്റേഡിയ അകലെയായിരുന്നു[a][b]. കാറ്റ് എതിരായിരുന്നതിനാൽ തിരമാലകൾ അതിനെ ശക്തമായി ആഞ്ഞടിച്ചുകൊണ്ടിരുന്നു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘നിലത്തുനിന്ന്’; ഇവിടെ ‘കരയിൽനിന്ന്’ എന്നാണ് അർഥം.
    reason: lexical_alternative
  - marker: b
    text: സ്റ്റേഡിയ പുരാതനകാലത്തെ ഒരു ദൂരയളവായിരുന്നു. ഒരു സ്റ്റേഡിയ ഏകദേശം 185 മീറ്റർ (607 അടി) വരും.
    reason: cultural_note
  - marker: c
    text: അഥവാ ‘തിരമാലകളാൽ ഉലച്ചുകൊണ്ടിരുന്നു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πλοῖον
  choice: വള്ളം
  rationale: ഗലീലക്കടലിലെ ഈ യാത്രാസന്ദർഭത്തിൽ πλοῖον സൂചിപ്പിക്കുന്ന ജലയാനത്തിന് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും അളവ് അതിശയിപ്പിക്കാത്തതുമായ പദം.
- source_word: ἤδη
  choice: അപ്പോഴേക്കും
  rationale: കഥയിലെ ഈ ഘട്ടമാകുമ്പോൾ സ്ഥിതി നേരത്തേ രൂപപ്പെട്ടിരുന്നു എന്ന കാലസൂചന സ്വാഭാവികമായി നൽകുന്നു.
- source_word: σταδίους πολλοὺς
  choice: അനേകം സ്റ്റേഡിയ
  rationale: മൂലപാഠത്തിലെ പുരാതന ദൂരയളവ് പൊതുവായ ‘വളരെ ദൂരം’ എന്നാക്കി മാറ്റാതെ സുതാര്യമായി നിലനിർത്തുന്നു.
- source_word: ἀπὸ τῆς γῆς
  choice: കരയിൽനിന്ന്
  rationale: γῆ അക്ഷരാർഥത്തിൽ ‘നിലം’ എന്നായാലും ജലത്തിനോടുള്ള വ്യത്യാസം സൂചിപ്പിക്കുന്ന ഈ സന്ദർഭത്തിൽ മലയാളത്തിൽ ‘കര’യാണ് സ്വാഭാവികം; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
- source_word: ἀπεῖχεν
  choice: അകലെയായിരുന്നു
  rationale: സ്ഥലപരമായ അകലം മലയാളത്തിലെ സ്വാഭാവിക വാക്യഘടനയിൽ വ്യക്തമാക്കുന്നു.
- source_word: βασανιζόμενον
  choice: ശക്തമായി ആഞ്ഞടിച്ചുകൊണ്ടിരുന്നു
  rationale: βασανίζωയുടെ കഠിനമായി പീഡിപ്പിക്കുക എന്ന ശക്തി, വള്ളത്തിന്മേൽ തിരമാലകൾ ഏൽപ്പിക്കുന്ന ഭൗതിക പ്രഹരമായി സന്ദർഭാനുസൃതമായി അവതരിപ്പിക്കുന്നു.
- source_word: ὑπὸ τῶν κυμάτων
  choice: തിരമാലകൾ അതിനെ
  rationale: ഗ്രീക്കിലെ കർമണിപ്രയോഗം മലയാളത്തിലെ സ്വാഭാവിക കർത്തരിപ്രയോഗമായി മാറ്റി; പ്രവർത്തകൻ തിരമാലകളാണെന്ന് നിലനിർത്തുന്നു.
- source_word: ἐναντίος
  choice: എതിരായിരുന്നതിനാൽ
  rationale: കാറ്റ് യാത്രയുടെ ദിശയ്ക്ക് വിരുദ്ധമായിരുന്നു എന്ന ആശയം വ്യക്തമാക്കുന്നു; ഗ്രീക്കിൽ പരോക്ഷമായിരിക്കുന്ന ബന്ധം സന്ദർഭത്തിൽനിന്ന് മനസ്സിലാകുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: യേശു കരയിൽ ആയിരുന്നതിൽനിന്ന് വള്ളത്തിന്റെ ദുരവസ്ഥയിലേക്കുള്ള മൃദുവായ വൈരുധ്യപരമായ കഥാമാറ്റം സൂചിപ്പിക്കുന്നു.
- source_word: γάρ
  choice: -തിനാൽ
  rationale: വള്ളത്തെ തിരമാലകൾ ആഞ്ഞടിച്ചതിന്റെ കാരണം കാറ്റിന്റെ എതിർദിശയാണെന്ന് സ്വാഭാവിക മലയാളത്തിൽ കാരണബന്ധമായി പ്രകടിപ്പിക്കുന്നു.
