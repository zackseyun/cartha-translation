translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥാശൈലി. പുരാതന അളവുപദമായ ‘സ്റ്റേഡിയ’ വിശദീകരണ അടിക്കുറിപ്പോടെ നിലനിർത്തി. ഗ്രീക്കിലെ participial ഘടനയും γάρ കാരണബന്ധവും മലയാളത്തിൽ ഒഴുക്കുള്ള രണ്ട് വാക്യങ്ങളായി പുനഃക്രമീകരിച്ചു.
