id: MAT.14.23
reference: Matthew 14:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀπολύσας τοὺς ὄχλους ἀνέβη εἰς τὸ ὄρος κατ’ ἰδίαν προσεύξασθαι. ὀψίας δὲ γενομένης μόνος ἦν ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/023.yaml
  text: And after dismissing the crowds[a], he went up on the mountain by himself to pray. When evening came, he was there alone.
translation:
  language: ml
  text: ജനക്കൂട്ടങ്ങളെ പറഞ്ഞയച്ചശേഷം, പ്രാർഥിക്കാനായി അവൻ തനിച്ച്[a] മലയിലേക്കു കയറിപ്പോയി. സന്ധ്യയായപ്പോൾ അവൻ അവിടെ ഏകനായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സ്വകാര്യമായി.”
    reason: κατ’ ἰδίαν എന്നതിന് ‘തനിച്ച്’ എന്നും ‘സ്വകാര്യമായി’ എന്നും അർഥമാകാം; യഥാർഥമായ ഈ പദാർഥസാധ്യത നിലനിർത്തുന്നു.
lexical_decisions:
- source_word: ἀπολύσας
  choice: പറഞ്ഞയച്ചശേഷം
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പ് നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന aorist participle-ന്റെ കാലസംബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ജനക്കൂട്ടത്തെ പിരിച്ചയച്ച സന്ദർഭത്തിനും യോജിക്കുന്നു.
- source_word: τοὺς ὄχλους
  choice: ജനക്കൂട്ടങ്ങളെ
  rationale: ഗ്രീക്കിലെ ബഹുവചനം നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ gathered crowds എന്ന ആശയം സ്വാഭാവികമായി അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: മലയിലേക്കു കയറിപ്പോയി
  rationale: മലയിലേക്കുള്ള മുകളോട്ടുള്ള നീക്കം വ്യക്തമായി പ്രകടിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: κατ’ ἰδίαν
  choice: തനിച്ച്
  rationale: മറ്റുള്ളവരിൽനിന്ന് വേറിട്ട്, തനിയെ എന്ന അർഥം സന്ദർഭോചിതമായി നൽകുന്നു; ‘സ്വകാര്യമായി’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: προσεύξασθαι
  choice: പ്രാർഥിക്കാനായി
  rationale: കയറിപ്പോയതിന്റെ ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന infinitive of purpose മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ὀψίας δὲ γενομένης
  choice: സന്ധ്യയായപ്പോൾ
  rationale: genitive absolute സൂചിപ്പിക്കുന്ന കാലസാഹചര്യം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: μόνος ἦν ἐκεῖ
  choice: അവൻ അവിടെ ഏകനായിരുന്നു
  rationale: μόνος ഊന്നിപ്പറയുന്ന ഏകാന്തത നിലനിർത്തുകയും κατ’ ἰδίαν എന്ന മുൻപ്രയോഗവുമായി അനാവശ്യമായ പദാവർത്തനം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
