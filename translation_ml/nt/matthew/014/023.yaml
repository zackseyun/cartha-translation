translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ ക്രമവും പ്രവർത്തികളുടെ കാലബന്ധവും കഴിയുന്നത്ര നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ മലയാളവാക്യഘടന ഉപയോഗിച്ചു.
