id: MAT.14.25
reference: Matthew 14:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τετάρτῃ δὲ φυλακῇ τῆς νυκτὸς ⸀ἦλθεν πρὸς ⸀αὐτοὺς περιπατῶν ἐπὶ ⸂τὴν θάλασσαν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/025.yaml
  text: And in the fourth watch of the night he came to them[b][a], walking on the sea.
translation:
  language: ml
  text: രാത്രിയുടെ നാലാം യാമത്തിൽ[b] അവൻ കടലിന്മേൽ നടന്ന്[a] അവരുടെ അടുക്കൽ വന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കടലിന്മീതെ നടന്ന്’ എന്നും പരിഭാഷപ്പെടുത്താം. ചിലർ ഈ പ്രയോഗം ‘കടൽത്തീരത്തുകൂടെ നടന്ന്’ എന്ന് മനസ്സിലാക്കിയിട്ടുണ്ടെങ്കിലും, സന്ദർഭം വെള്ളത്തിന്മേലുള്ള സഞ്ചാരത്തെയാണ് ശക്തമായി സൂചിപ്പിക്കുന്നത്.
    reason: alternative_reading
  - marker: b
    text: ‘രാത്രിയുടെ നാലാം യാമം’ റോമൻ രീതിയിലെ അവസാന രാത്രികാവൽ സമയമാണ്—ഏകദേശം പുലർച്ചെ 3 മുതൽ 6 മണിവരെ.
    reason: cultural_note
lexical_decisions:
- source_word: τετάρτῃ ... φυλακῇ τῆς νυκτός
  choice: രാത്രിയുടെ നാലാം യാമത്തിൽ
  rationale: ദത്തിവ് പ്രയോഗം സംഭവത്തിന്റെ സമയം സൂചിപ്പിക്കുന്നു. ചരിത്രപരമായ രാത്രികാവൽ വിഭജനം നിലനിർത്താൻ ‘യാമം’ ഉപയോഗിച്ചു; ആധുനിക വായനക്കാർക്കായി സമയം അടിക്കുറിപ്പിൽ വിശദീകരിക്കുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയില്ല
  rationale: ഇവിടെ δέ കഥ മുന്നോട്ടുകൊണ്ടുപോകുന്ന മൃദുവായ ബന്ധകമാണ്. മലയാളത്തിൽ വാക്യക്രമം തന്നെ ആ ബന്ധം സ്വാഭാവികമായി നൽകുന്നതിനാൽ ‘എന്നാൽ’ പോലുള്ള വിരുദ്ധാർഥസൂചന ഒഴിവാക്കി.
- source_word: ἦλθεν πρὸς αὐτούς
  choice: അവരുടെ അടുക്കൽ വന്നു
  rationale: πρός സഹിതമുള്ള ἦλθεν ശിഷ്യന്മാരുടെ ദിശയിലേക്കുള്ള നീക്കം സൂചിപ്പിക്കുന്നു. ‘അവരുടെ അടുക്കൽ വന്നു’ മലയാളത്തിൽ സ്വാഭാവികവും ദിശാസൂചന നിലനിർത്തുന്നതുമാണ്.
- source_word: περιπατῶν
  choice: നടന്ന്
  rationale: വർത്തമാനകാല കൃദന്തം മുഖ്യക്രിയയോടൊപ്പം നടക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘നടന്ന്’ അത് സംക്ഷിപ്തമായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐπὶ τὴν θάλασσαν
  choice: കടലിന്മേൽ
  rationale: സന്ദർഭത്തിൽ ἐπί + accusative ജലോപരിതലത്തിലൂടെയുള്ള സഞ്ചാരമാണ് സൂചിപ്പിക്കുന്നത്. θάλασσα എന്ന പദത്തിന്റെ രൂപം നിലനിർത്താൻ ‘തടാകം’ എന്നതിനു പകരം ‘കടൽ’ തിരഞ്ഞെടുത്തു.
theological_decisions:
- issue: യേശു വെള്ളത്തിന്മേൽ നടന്നുവെന്ന അത്ഭുതവിവരണം
  choice: കടലിന്മേൽ നടന്ന്
  alternative: കടൽത്തീരത്തുകൂടെ നടന്ന്
  rationale: περιπατῶν ἐπὶ τὴν θάλασσαν എന്ന പ്രയോഗവും സമീപസന്ദർഭവും ജലത്തിന്റെ ഉപരിതലത്തിലുള്ള സഞ്ചാരത്തെയാണ് ശക്തമായി സൂചിപ്പിക്കുന്നത്. അത്ഭുതസ്വഭാവം കുറയ്ക്കാതെയും ഗ്രീക്കിൽ ഇല്ലാത്ത വിശദാംശങ്ങൾ ചേർക്കാതെയും പാഠത്തിന്റെ നേരാർഥം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. ‘യാമം’ എന്ന ചരിത്രപദം മുഖ്യപാഠത്തിൽ നിലനിർത്തി, അതിന്റെ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട പ്രയോഗങ്ങൾക്ക് തൊട്ടുപിന്നിൽ ചേർത്തു.
