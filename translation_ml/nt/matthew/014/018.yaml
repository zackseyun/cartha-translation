  text: ὁ δὲ εἶπεν· Φέρετέ μοι ⸂ὧδε αὐτούς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/018.yaml
  text: But he said[a], “Bring them here to me.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “അവയെ[a] ഇവിടെ എന്റെ അടുക്കൽ കൊണ്ടുവരൂ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അതായത്, മുൻവാക്യത്തിൽ പറഞ്ഞ അപ്പങ്ങളും മീനുകളും.
    reason: cross_reference
lexical_decisions:
- source_word: δὲ
  choice: അവൻ പറഞ്ഞു
  rationale: δέ ഇവിടെ ശിഷ്യന്മാരുടെ മുൻവാക്കിനോടുള്ള പ്രതികരണം സൂചിപ്പിക്കുന്ന മൃദുവായ ബന്ധകമാണ്. മലയാളത്തിൽ പ്രത്യേകം ‘എന്നാൽ’ ചേർക്കാതെ വാക്യക്രമത്തിലൂടെ ഈ ബന്ധം സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: εἶπεν
  choice: പറഞ്ഞു
  rationale: λέγω എന്ന ക്രിയയുടെ ലളിതമായ ഭൂതകാലപ്രയോഗം നേരിട്ട് ‘പറഞ്ഞു’ എന്നു പരിഭാഷപ്പെടുത്തി; ക്രിയയിൽ സ്വതവേ ഇല്ലാത്ത ആജ്ഞാപനഭാവം വിവരണക്രിയയിൽ ചേർത്തിട്ടില്ല.
- source_word: Φέρετέ
  choice: കൊണ്ടുവരൂ
  rationale: രണ്ടാംപുരുഷ ബഹുവചന ആജ്ഞയായ φέρετε, വസ്തുക്കൾ സംസാരിക്കുന്നവന്റെ അടുക്കലേക്കു കൊണ്ടുവരാനുള്ള നിർദേശം നൽകുന്നു. ആധുനിക മലയാളത്തിൽ ‘കൊണ്ടുവരൂ’ സ്വാഭാവികവും ആദരസൂചക ബഹുവചനത്തോടും പൊരുത്തപ്പെടുന്നതുമാണ്.
- source_word: μοι
  choice: എന്റെ അടുക്കൽ
  rationale: ദാതൃവിഭക്തിയിലുള്ള μοι പ്രവർത്തനത്തിന്റെ വ്യക്തിപരമായ ലക്ഷ്യം സൂചിപ്പിക്കുന്നു; ‘എന്റെ അടുക്കൽ’ അത് വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ὧδε
  choice: ഇവിടെ
  rationale: സ്ഥലസൂചകമായ ὧδε എന്നതിന്റെ നേരിട്ടുള്ള അർഥം ‘ഇവിടെ’ എന്നാണ്.
- source_word: αὐτούς
  choice: അവ
  rationale: സന്ദർഭത്തിൽ ഈ സർവനാമം മുൻവാക്യത്തിലെ അപ്പങ്ങളെയും മീനുകളെയും കൂട്ടമായി സൂചിപ്പിക്കുന്നു. ജീവരഹിത വസ്തുക്കൾക്കുള്ള സ്വാഭാവിക മലയാള സർവനാമമായ ‘അവ’ ഉപയോഗിച്ച് പ്രധാനവാചകത്തിലെ പരാമർശം നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, ആധുനികവും മാന്യവുമായ മലയാളം. ഗ്രീക്കിലെ ചുരുക്കവും ആജ്ഞയുടെ നേരിട്ടുള്ള സ്വഭാവവും നിലനിർത്തിയിരിക്കുന്നു; അടിക്കുറിപ്പ് ചിഹ്നം പരാമർശസർവനാമത്തിനു ശേഷമല്ല, ഉദ്ധരണിയുടെ അവസാനം ചേർത്തിരിക്കുന്നു.
