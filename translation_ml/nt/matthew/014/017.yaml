source:
  edition: SBLGNT
  text: οἱ δὲ λέγουσιν αὐτῷ· Οὐκ ἔχομεν ὧδε εἰ μὴ πέντε ἄρτους καὶ δύο ἰχθύας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/017.yaml
  text: But they said to him[a], “We have nothing here except five loaves and two fish.”
translation:
  language: ml
  text: 'എന്നാൽ അവർ അവനോടു പറഞ്ഞു: “അഞ്ച് അപ്പവും രണ്ട് മീനും അല്ലാതെ ഇവിടെ ഞങ്ങളുടെ പക്കൽ ഒന്നുമില്ല.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: എന്നാൽ അവർ
  rationale: οἱ മുൻസന്ദർഭത്തിലെ ശിഷ്യന്മാരെ സൂചിപ്പിക്കുന്നു; δέ യേശുവിന്റെ മുൻനിർദേശത്തോടുള്ള മൃദുവായ വൈരുധ്യം അടയാളപ്പെടുത്തുന്നതിനാൽ സ്വാഭാവികമായ മലയാളത്തിൽ ‘എന്നാൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: λέγουσιν αὐτῷ
  choice: അവർ അവനോടു പറഞ്ഞു
  rationale: ഗ്രീക്കിൽ ചരിത്രവർത്തമാനകാലമാണെങ്കിലും, മലയാള ആഖ്യാനശൈലിയിൽ ഭൂതകാലമായ ‘പറഞ്ഞു’ കൂടുതൽ സ്വാഭാവികമാണ്.
- source_word: Οὐκ ἔχομεν ὧδε εἰ μὴ
  choice: അല്ലാതെ ഇവിടെ ഞങ്ങളുടെ പക്കൽ ഒന്നുമില്ല
  rationale: നിഷേധവാക്യത്തിനു ശേഷമുള്ള εἰ μή ‘അല്ലാതെ’ എന്ന ഒഴിവാക്കൽ അർഥം നൽകുന്നു. ἔχομεν എന്ന കൈവശബന്ധം മലയാളത്തിൽ ‘ഞങ്ങളുടെ പക്കൽ’ എന്നു സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു; ὧδε ‘ഇവിടെ’ എന്നു നിലനിർത്തി.
- source_word: πέντε ἄρτους
  choice: അഞ്ച് അപ്പം
  rationale: ἄρτος ഇവിടെ എണ്ണാവുന്ന അപ്പങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. സംഖ്യയ്ക്കുശേഷം മലയാളത്തിൽ നാമം ഏകവചനരൂപത്തിൽ ഉപയോഗിക്കുന്നത് സ്വാഭാവികമാണ്.
- source_word: δύο ἰχθύας
  choice: രണ്ട് മീൻ
  rationale: ἰχθύας എന്നതിന്റെ സാധാരണ മലയാളരൂപം ‘മീൻ’; സംഖ്യയ്ക്കുശേഷമുള്ള ഏകവചനരൂപം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ നിഷേധം-ഒഴിവാക്കൽ ഘടനയുടെ അർഥം സ്വാഭാവികമായ മലയാള പദക്രമത്തിൽ സംരക്ഷിച്ചു.
