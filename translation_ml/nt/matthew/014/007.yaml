  to: അതുകൊണ്ട്, അവൾ എന്തു ചോദിച്ചാലും കൊടുക്കാമെന്ന് അവൻ അവളോടു ശപഥത്തോടെ വാഗ്ദാനം ചെയ്തു.[a]
