id: MAT.14.7
reference: Matthew 14:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅθεν μετὰ ὅρκου ὡμολόγησεν αὐτῇ δοῦναι ὃ ⸀ἐὰν αἰτήσηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/007.yaml
  text: Therefore he promised with an oath to give her whatever she might ask[a].
translation:
  language: ml
  text: അതുകൊണ്ട്, അവൾ എന്തു ചോദിച്ചാലും കൊടുക്കാമെന്ന് അവൻ അവളോടു ശപഥത്തോടെ വാഗ്ദാനം ചെയ്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവൾ എന്തു ചോദിക്കുമോ അതെല്ലാം.’ ഗ്രീക്കിലെ അനിശ്ചിത ബന്ധവാക്യം (ὃ ἐὰν αἰτήσηται) അവൾ ഭാവിയിൽ ഉന്നയിക്കാവുന്ന, മുൻകൂട്ടി നിർണയിക്കപ്പെടാത്ത ഏത് അഭ്യർഥനയെയും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: അതുകൊണ്ട്
  rationale: മുൻവിവരണത്തിൽനിന്നുള്ള ഫലമോ നിഗമനമോ സൂചിപ്പിക്കുന്ന ബന്ധപദം; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി കാരണ-ഫലബന്ധം നിലനിർത്തുന്നു.
- source_word: μετὰ ὅρκου
  choice: ആണയിട്ടു
  rationale: വാഗ്ദാനം ശപഥത്തോടുകൂടിയാണ് ചെയ്തതെന്ന ആശയം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ὡμολόγησεν
  choice: വാഗ്ദാനം ചെയ്തു
  rationale: ഇവിടെ പരസ്യമായോ ഉറച്ചതായോ ഉള്ള പ്രതിജ്ഞാബദ്ധതയാണ് അർഥം; ‘ഏറ്റുപറഞ്ഞു’ എന്ന സാധാരണ അർഥം സന്ദർഭത്തിന് യോജിക്കുന്നില്ല.
- source_word: αὐτῇ
  choice: അവളോട്
  rationale: പെൺകുട്ടിയെ സൂചിപ്പിക്കുന്ന പരോക്ഷ കർമം മലയാളത്തിൽ ‘അവളോട്’ എന്നു സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: δοῦναι
  choice: കൊടുക്കാമെന്ന്
  rationale: വാഗ്ദാനത്തിന്റെ ഉള്ളടക്കം മലയാളത്തിലെ ഉദ്ധരണിപൂരക രൂപത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὃ ἐὰν αἰτήσηται
  choice: എന്തു ചോദിച്ചാലും
  rationale: ἐάν സഹിതമുള്ള അനിശ്ചിത ബന്ധവാക്യം ഭാവിയിലെ തുറന്ന, നിബന്ധനാപരമായ അഭ്യർഥനയെ സൂചിപ്പിക്കുന്നു; ഈ മലയാളപ്രയോഗം അതിനെ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കഥനശൈലി. ‘ആണയിട്ടു വാഗ്ദാനം ചെയ്തു’ എന്ന പ്രയോഗം ശപഥവും ഉറച്ച വാഗ്ദാനവും രണ്ടും വ്യക്തമായി നിലനിർത്തുന്നു.
