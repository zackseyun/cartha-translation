id: MAT.14.8
reference: Matthew 14:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἡ δὲ προβιβασθεῖσα ὑπὸ τῆς μητρὸς αὐτῆς· Δός μοι, φησίν, ὧδε ἐπὶ πίνακι τὴν κεφαλὴν Ἰωάννου τοῦ βαπτιστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/008.yaml
  text: And she, having been prompted by her mother, says, “Give me here on a platter the head of John the Baptizer.”
translation:
  language: ml
  text: അവളാകട്ടെ, അമ്മയുടെ പ്രേരണയാൽ, “സ്നാനം നൽകുന്ന യോഹന്നാന്റെ[a] തല ഇവിടെ ഒരു താലത്തിൽ എനിക്കു തരിക” എന്നു പറയുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, പാരമ്പര്യമായി, “സ്നാപക യോഹന്നാന്റെ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προβιβασθεῖσα
  choice: പ്രേരണയനുസരിച്ച്
  rationale: അമ്മ മുമ്പേ അവളെ സ്വാധീനിച്ച് ആവശ്യപ്പെടാൻ പ്രേരിപ്പിച്ചതാണ് കർമണിപ്രയോഗത്തിലുള്ള കൃുദന്തരൂപം സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ സ്വാഭാവികമായി ആ മുൻപ്രേരണയും മാതാവിന്റെ പങ്കും അറിയിക്കുന്നു.
- source_word: ὑπὸ τῆς μητρὸς αὐτῆς
  choice: അമ്മയുടെ
  rationale: ὑπό + ഷഷ്ഠി കർമണിപ്രയോഗത്തിലെ വ്യക്തിപരമായ കർത്താവിനെ സൂചിപ്പിക്കുന്നു; ‘അമ്മയുടെ പ്രേരണ’ എന്ന ഘടനയിൽ ആ കാരകബന്ധം സ്വാഭാവികമായി നിലനിൽക്കുന്നു.
- source_word: Δός μοι
  choice: എനിക്കു തരിക
  rationale: δίδωμι എന്ന ക്രിയയുടെ ഭൂതകാല ആജ്ഞാരൂപത്തിന്റെ നേരിട്ടുള്ള ആവശ്യപ്പെടൽ വ്യക്തവും മാന്യവുമായ മലയാളത്തിൽ പകർന്നു.
- source_word: φησίν
  choice: എന്നു പറയുന്നു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനകാലം നിലനിർത്തി ആഖ്യാനത്തിന്റെ സജീവത സംരക്ഷിക്കുന്നു.
- source_word: ὧδε
  choice: ഇവിടെ
  rationale: സ്ഥലത്തെയോ ഉടനടിയുള്ള സാന്നിധ്യത്തെയോ ചൂണ്ടിക്കാണിക്കുന്ന അവ്യയത്തിന്റെ ലളിതവും നേരിട്ടുള്ളതുമായ പരിഭാഷ.
- source_word: ἐπὶ πίνακι
  choice: ഒരു താലത്തിൽ
  rationale: വിരുന്നിന്റെ പശ്ചാത്തലത്തിൽ πίναξ ഭക്ഷണം വിളമ്പുന്ന പരന്ന വലിയ പാത്രത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘താലം’ ആ ദൃശ്യത്തെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὴν κεφαλὴν
  choice: തല
  rationale: മൂലത്തിലെ ഭീകരമായ വ്യക്തത മയപ്പെടുത്താതെ നേരിട്ട് പകർന്നു.
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  choice: സ്നാനം നൽകുന്ന യോഹന്നാന്റെ
  rationale: βαπτιστής എന്ന കർത്തൃനാമത്തിന്റെ പ്രവർത്തനവിവരണം മലയാളത്തിൽ സുതാര്യമായി പകർന്നു; പാരമ്പര്യമായ രൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
theological_decisions:
- issue: യോഹന്നാന്റെ βαπτιστής എന്ന വിശേഷണത്തിന്റെ പരിഭാഷ
  choice: സ്നാനം നൽകുന്ന യോഹന്നാൻ
  alternative: സ്നാപകയോഹന്നാൻ
  rationale: ഗ്രീക്ക് പദം യോഹന്നാന്റെ പ്രവർത്തനം വിവരിക്കുന്ന കർത്തൃനാമമാണ്. പ്രധാനപാഠം അതിന്റെ വിവരണാത്മക അർത്ഥം വ്യക്തമാക്കുന്നു; മലയാള വായനക്കാർക്ക് പരിചിതമായ പാരമ്പര്യരൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ചരിത്രവർത്തമാനമായ ‘പറയുന്നു’ നിലനിർത്തിയിട്ടുണ്ട്; ആവശ്യം ഉന്നയിക്കുന്ന വാക്കുകൾ നേരിട്ടും ഭീകരത മയപ്പെടുത്താതെയും നൽകിയിരിക്കുന്നു.
