  to: അവളാകട്ടെ, അമ്മയുടെ പ്രേരണയാൽ, “സ്നാനം നൽകുന്ന യോഹന്നാന്റെ[a] തല ഇവിടെ ഒരു താലത്തിൽ എനിക്കു തരിക” എന്നു പറയുന്നു.
