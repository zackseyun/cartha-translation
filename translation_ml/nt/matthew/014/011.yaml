id: MAT.14.11
reference: Matthew 14:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἠνέχθη ἡ κεφαλὴ αὐτοῦ ἐπὶ πίνακι καὶ ἐδόθη τῷ κορασίῳ, καὶ ἤνεγκεν τῇ μητρὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/011.yaml
  text: And his head was brought on a platter and given to the girl[a], and she brought it to her mother.
translation:
  language: ml
  text: അവന്റെ തല ഒരു തളികയിൽ[a] കൊണ്ടുവന്ന് പെൺകുട്ടിക്കു കൊടുത്തു; അവൾ അത് തന്റെ അമ്മയുടെ അടുക്കലേക്ക് കൊണ്ടുപോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ട്രേയിൽ’ അല്ലെങ്കിൽ ‘വിളമ്പുപാത്രത്തിൽ’. ഗ്രീക്ക് πίναξ എന്നത് ഭക്ഷണം വിളമ്പാനുള്ള തളികയെയോ ട്രേയെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνέχθη
  choice: വെച്ച് കൊണ്ടുവന്ന്
  rationale: φέρω എന്ന ക്രിയയുടെ ഭൂതകാല നിഷ്ക്രിയരൂപമാണിത്. മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യഘടനയ്ക്കായി, തല തളികയിൽ വച്ച നിലയിൽ കൊണ്ടുവന്നുവെന്ന അർഥം വ്യക്തമാക്കുന്ന സംയുക്തപ്രയോഗം സ്വീകരിച്ചു; നിഷ്ക്രിയഭാവം തുടർന്നുള്ള ‘കൊടുത്തു’ എന്ന സംയുക്തക്രിയയോടൊപ്പം പ്രകടമാകുന്നു.
- source_word: ἡ κεφαλὴ αὐτοῦ
  choice: അവന്റെ തല
  rationale: ഗ്രീക്ക് നാമപദസമുച്ചയത്തിന്റെ നേരിട്ടുള്ള പരിഭാഷ; മൂലപാഠത്തിലെ കടുപ്പം മയപ്പെടുത്തുന്ന ശിഷ്ടോക്തി ഒഴിവാക്കി.
- source_word: ἐπὶ πίνακι
  choice: ഒരു തളികയിൽ
  rationale: πίναξ ഭക്ഷണം വിളമ്പാനുള്ള വലിയ തളികയെയോ ട്രേയെയോ സൂചിപ്പിക്കാം. ഈ സന്ദർഭത്തിൽ സാധാരണ മലയാളവായനക്കാർക്ക് സ്വാഭാവികവും ദൃശ്യവുമായ ‘തളിക’ തിരഞ്ഞെടുത്തു.
- source_word: ἐδόθη
  choice: കൊടുത്തു
  rationale: δίδωμι എന്ന ക്രിയയുടെ ഭൂതകാല നിഷ്ക്രിയരൂപം. ഗ്രീക്കിലെ രണ്ട് നിഷ്ക്രിയക്രിയകളെ മലയാളത്തിലെ സ്വാഭാവികമായ സംയുക്തവാക്യമായി ‘കൊണ്ടുവന്ന് ... കൊടുത്തു’ എന്നു അവതരിപ്പിച്ചു; നിർവഹിച്ച ആളെ മൂലപാഠം പറയാത്തത് നിലനിർത്തി.
- source_word: τῷ κορασίῳ
  choice: പെൺകുട്ടിക്കു
  rationale: κοράσιον എന്നത് പെൺകുട്ടിയെ സൂചിപ്പിക്കുന്നു. ‘കന്യക’ പോലുള്ള പുരാതനമോ അധിക അർഥഭാരമുള്ളതോ ആയ പദങ്ങൾ ഒഴിവാക്കി.
- source_word: ἤνεγκεν
  choice: അവൾ അത് ... കൊണ്ടുപോയി
  rationale: ഇവിടെ ചലനം അമ്മയുടെ അടുക്കലേക്കായതിനാൽ മലയാളത്തിൽ ‘കൊണ്ടുപോയി’ സ്വാഭാവികമാണ്. കർത്താവായ പെൺകുട്ടിയെ ‘അവൾ’ എന്നും മുൻവാക്യത്തിലെ തലയെ ‘അത്’ എന്നും വ്യക്തമാക്കി.
- source_word: τῇ μητρὶ αὐτῆς
  choice: അമ്മയുടെ അടുക്കൽ
  rationale: ദാതൃവിഭക്തിയുടെ ലക്ഷ്യാർഥം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു. αὐτῆς പെൺകുട്ടിയുടെ അമ്മയെയാണ് സൂചിപ്പിക്കുന്നത്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി. മൂലപാഠത്തിലെ ക്രൂരമായ ദൃശ്യം ശിഷ്ടോക്തിയാൽ മയപ്പെടുത്തിയിട്ടില്ല. ഈ വാക്യത്തിൽ പാഠപരമോ ദൈവശാസ്ത്രപരമോ ആയ പ്രത്യേക അനിശ്ചിതത്വമില്ല; അതിനാൽ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
