id: MAT.14.33
reference: Matthew 14:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ ἐν τῷ ⸀πλοίῳ προσεκύνησαν αὐτῷ λέγοντες· Ἀληθῶς θεοῦ υἱὸς εἶ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/033.yaml
  text: Then those in the boat worshiped him[a], saying[b], “Truly you are the Son of God.”
translation:
  language: ml
  text: അപ്പോൾ പടകിലുണ്ടായിരുന്നവർ അവനെ ആരാധിച്ച്[a], “സത്യമായും നീ ദൈവപുത്രനാണ്[b]” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അവനെ കുമ്പിട്ട്” / “അവന് പ്രണാമം അർപ്പിച്ച്.” ഗ്രീക്ക് ക്രിയ മുട്ടുകുത്തിയോ സാഷ്ടാംഗം വീണോ പ്രകടിപ്പിക്കുന്ന ആദരത്തെ സൂചിപ്പിക്കാം; ഇവിടെ സന്ദർഭം “ആരാധിച്ച്” എന്ന അർഥത്തെ പിന്തുണയ്ക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “ദൈവത്തിന്റെ പുത്രനാണ്.” ഗ്രീക്കിൽ “ദൈവം” എന്ന പദത്തിന് മുമ്പ് നിർദേശകപദമില്ലെങ്കിലും, സന്ദർഭത്തിൽ ഈ പ്രയോഗം “ഒരു ദൈവപുത്രൻ” എന്നല്ല, ഒരു പദവിയായാണ് പ്രവർത്തിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ
  choice: അപ്പോൾ … ഉണ്ടായിരുന്നവർ
  rationale: δέ ഇവിടെ ശക്തമായ വിരോധമല്ല, കഥയുടെ തുടർച്ച സൂചിപ്പിക്കുന്ന മൃദുവായ ബന്ധകമാണ്; സന്ദർഭത്തിലെ പ്രതികരണം സ്വാഭാവികമായി അവതരിപ്പിക്കാൻ ‘അപ്പോൾ’ യോജിക്കുന്നു.
- source_word: ἐν τῷ πλοίῳ
  choice: പടകിലുണ്ടായിരുന്നവർ
  rationale: ἐν τῷ πλοίῳ എന്നത് പടകിനകത്ത്/പടകിൽ ഉണ്ടായിരുന്നവരെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ സംയുക്തപ്രയോഗം സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: προσεκύνησαν αὐτῷ
  choice: അവനെ ആരാധിച്ച്
  rationale: προσκυνέω കുമ്പിടൽ, പ്രണാമം, ആരാധന എന്നിവ സൂചിപ്പിക്കാം. കടലിന്മേലുള്ള യേശുവിന്റെ അധികാരപ്രകടനത്തിനും തുടർന്നുള്ള ദൈവപുത്രസ്വീകരണത്തിനും ശേഷം ഇവിടെ ‘ആരാധിച്ചു’ എന്ന അർഥമാണ് സന്ദർഭത്തിന് ഏറ്റവും യോജിച്ചത്.
- source_word: λέγοντες
  choice: എന്നു പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ പങ്കാളിത്തക്രിയ മലയാളത്തിലെ സ്വാഭാവികമായ ഉദ്ധരണിഘടനയായി മാറ്റിയിരിക്കുന്നു; ഇതിലൂടെ പ്രവൃത്തിയും വാക്കുകളും തമ്മിലുള്ള ബന്ധം നിലനിൽക്കുന്നു.
- source_word: Ἀληθῶς
  choice: സത്യമായും
  rationale: ഗൗരവമുള്ള ഉറച്ച സ്ഥിരീകരണമാണ് ഈ ക്രിയാവിശേഷണം പ്രകടിപ്പിക്കുന്നത്; ‘സത്യമായും’ ആ ഭാരം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: θεοῦ υἱὸς
  choice: ദൈവപുത്രൻ
  rationale: ഗ്രീക്കിൽ θεοῦ-ന് നിർദേശകപദമില്ലെങ്കിലും ഈ വിധേയനാമഘടന സന്ദർഭത്തിൽ അനിശ്ചിതമായ ‘ഒരു ദൈവപുത്രൻ’ എന്നല്ല, അംഗീകൃതമായ ഒരു പദവിയായാണ് പ്രവർത്തിക്കുന്നത്. ‘ദൈവപുത്രൻ’ മലയാളത്തിൽ അതിനെ സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: εἶ
  choice: നീ … ആണ്
  rationale: രണ്ടാംപുരുഷ ഏകവചനത്തിലുള്ള ‘ആകുന്നു’ എന്ന ക്രിയയെ മലയാളത്തിലെ സ്വാഭാവിക പ്രത്യക്ഷസംബോധനയായി വ്യക്തമാക്കിയിരിക്കുന്നു.
theological_decisions:
- issue: യേശുവിനോടുള്ള προσκυνέω എന്ന ക്രിയയുടെ ശക്തി
  choice: ‘അവനെ ആരാധിച്ച്’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: ‘അവനെ കുമ്പിട്ട്’ / ‘അവന് പ്രണാമം അർപ്പിച്ച്’
  rationale: ഈ ക്രിയ ശരീരഭാവത്തിലുള്ള കുമ്പിടലിനെയോ ആദരാഞ്ജലിയെയോ ആരാധനയെയോ സൂചിപ്പിക്കാം. എന്നാൽ പ്രകൃതിയിന്മേലുള്ള യേശുവിന്റെ അധികാരപ്രകടനവും അതിനോടൊപ്പമുള്ള ദൈവപുത്രസ്വീകരണവും ഇവിടെ ‘ആരാധിച്ചു’ എന്ന വായനയെ ശക്തിപ്പെടുത്തുന്നു; പദത്തിന്റെ വിശാലത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: θεοῦ υἱὸς എന്ന പ്രയോഗത്തിന്റെ നിർദിഷ്ടത
  choice: ‘ദൈവപുത്രൻ’ എന്നു പദവിയായി പരിഭാഷപ്പെടുത്തി
  alternative: ‘ദൈവത്തിന്റെ പുത്രൻ’ / ‘ഒരു ദൈവപുത്രൻ’
  rationale: നിർദേശകപദത്തിന്റെ അഭാവം ഗ്രീക്കിൽ അനിശ്ചിതത്വം നിർബന്ധിക്കുന്നില്ല. മത്തായിയുടെ ഈ സമ്മതവാക്യസന്ദർഭത്തിൽ ഇത് വെറും ‘ഒരു പുത്രൻ’ എന്ന വർഗ്ഗീകരണമല്ല, പ്രത്യേക പദവിയായാണ് പ്രവർത്തിക്കുന്നത്; എങ്കിലും ‘ദൈവത്തിന്റെ പുത്രൻ’ എന്ന ഘടനാപരമായ മറ്റൊരു രൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി സ്വീകരിച്ചു. ‘ആരാധിച്ച്’ എന്നും ‘ദൈവപുത്രൻ’ എന്നും ഉള്ള പരിഭാഷകൾ സന്ദർഭത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; യഥാർത്ഥ ഗ്രീക്ക് പദങ്ങളുടെ സാധ്യതാവ്യാപ്തി അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
