id: MAT.14.31
reference: Matthew 14:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εὐθέως δὲ ὁ Ἰησοῦς ἐκτείνας τὴν χεῖρα ἐπελάβετο αὐτοῦ καὶ λέγει αὐτῷ· Ὀλιγόπιστε, εἰς τί ἐδίστασας;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/031.yaml
  text: Immediately Jesus stretched out his hand[a], took hold of him, and said to him, “You of little faith, why did you doubt?”
translation:
  language: ml
  text: 'ഉടനെ യേശു കൈ നീട്ടി അവനെ പിടിച്ചു അവനോടു പറഞ്ഞു: “അൽപവിശ്വാസിയേ, നീ എന്തിനു സംശയിച്ചു[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ചാഞ്ചാടിയോ?” ഈ ഗ്രീക്ക് ക്രിയയ്ക്ക് സംശയിക്കുക എന്നതിനുപുറമേ മടിക്കുക, മനസ്സിൽ ചാഞ്ചാടുക എന്നീ അർത്ഥങ്ങളും ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: ഉടനെ
  rationale: പ്രവൃത്തിയുടെ തൽക്ഷണതയും ആഖ്യാനത്തിലെ അടിയന്തരതയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയില്ല
  rationale: ഇവിടെ ഇത് ലഘുവായ തുടർച്ച/വിരുദ്ധഭാവം സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ വാക്യക്രമവും സന്ദർഭവും ആ ബന്ധം സ്വാഭാവികമായി നൽകുന്നതിനാൽ പ്രത്യേക സംയോജകം ചേർക്കുന്നത് അനാവശ്യമാണ്.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: കൈ നീട്ടി
  rationale: പ്രവൃത്തിയുടെ ദൃശ്യസ്വഭാവവും തുടർന്നുള്ള ക്രമവും ലളിതവും കൃത്യവുമായി നിലനിർത്തുന്നു.
- source_word: ἐπελάβετο αὐτοῦ
  choice: അവനെ പിടിച്ചുകൊണ്ട്
  rationale: അവനെ കൈവിട്ടുപോകാതെ പിടിച്ചെടുക്കുന്ന അർത്ഥം നൽകുന്നു; ‘രക്ഷിച്ചു’ എന്ന സന്ദർഭസൂചന പാഠത്തിലേക്ക് നേരിട്ട് ചേർക്കാതെ മൂലക്രിയയുടെ അർത്ഥപരിധി പാലിക്കുന്നു.
- source_word: λέγει αὐτῷ
  choice: അവനോടു പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനത്തെ മലയാളത്തിലെ സ്വാഭാവികമായ ഭൂതകാല ആഖ്യാനരീതിയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: Ὀλιγόπιστε
  choice: അല്പവിശ്വാസിയേ
  rationale: നേരിട്ടുള്ള സംബോധനയും വിശ്വാസത്തിന്റെ അപര്യാപ്തതയും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; പൂർണമായ അവിശ്വാസം എന്ന അതിശക്തമായ അർത്ഥം വരുത്തുന്നില്ല.
- source_word: εἰς τί
  choice: എന്തിനു
  rationale: ഈ സന്ദർഭത്തിലെ കാരണചോദ്യം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἐδίστασας
  choice: സംശയിച്ചു
  rationale: പ്രധാന അർത്ഥം വ്യക്തമായി നൽകുന്നു; മടിക്കൽ അല്ലെങ്കിൽ മനസ്സിൽ ചാഞ്ചാടൽ എന്ന സാധ്യമായ സൂക്ഷ്മഭാവം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: Ὀλιγόπιστε എന്ന പദത്തിൽ πίστις-ന്റെ ആശയം
  choice: അല്പവിശ്വാസിയേ
  alternative: വിശ്വാസം കുറഞ്ഞവനേ
  rationale: പത്രോസിന്റെ പരാജയത്തെ സമ്പൂർണ അവിശ്വാസമായി ചിത്രീകരിക്കാതെ, അവന്റെ വിശ്വാസത്തിന്റെ കുറവിലേക്കാണ് ശാസന വിരൽചൂണ്ടുന്നതെന്ന ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു.
- issue: ἐδίστασας എന്ന ക്രിയയുടെ അർത്ഥവ്യാപ്തി
  choice: സംശയിച്ചു
  alternative: ചാഞ്ചാടിപ്പോയി / മടിച്ചു
  rationale: ‘സംശയിച്ചു’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; എന്നാൽ ക്രിയയിൽ ആശയക്കുഴപ്പം, മടിക്കൽ, ചാഞ്ചാട്ടം എന്നീ ഭാവങ്ങളും ഉണ്ടാകാമെന്നതിനാൽ അവ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ മലയാളം. വാക്യം ആഖ്യാനത്തിന്റെ അടിയന്തരത നിലനിർത്തുന്നു; സംബോധനത്തിന് ബൈബിൾഭാഷയിലെ ഗൗരവം സൂക്ഷിച്ചെങ്കിലും പഴഞ്ചൻ ഘടനകൾ ഒഴിവാക്കി.
