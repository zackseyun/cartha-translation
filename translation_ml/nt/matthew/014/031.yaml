  to: 'ഉടനെ യേശു കൈ നീട്ടി അവനെ പിടിച്ചു അവനോടു പറഞ്ഞു: “അൽപവിശ്വാസിയേ, നീ എന്തിനു സംശയിച്ചു[a]?”'
  rationale: 'A small revision improves fidelity and Malayalam narrative style: the decisive act of taking hold is rendered by «അവനെ പിടിച്ചു» rather than a continuative construction. The footnote retains the source verb’s disputed/elastic nuance without changing the primary translation.'
