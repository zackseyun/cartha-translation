id: MAT.14.15
reference: Matthew 14:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὀψίας δὲ γενομένης προσῆλθον αὐτῷ οἱ ⸀μαθηταὶ λέγοντες· Ἔρημός ἐστιν ὁ τόπος καὶ ἡ ὥρα ἤδη παρῆλθεν· ἀπόλυσον τοὺς ὄχλους, ἵνα ἀπελθόντες εἰς τὰς κώμας ἀγοράσωσιν ἑαυτοῖς βρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/015.yaml
  text: When evening came[a], the disciples came to him and said, “The place is deserted, and the hour is already late. Send the crowds away[b], so that they may go into the villages and buy food for themselves.”
translation:
  language: ml
  text: 'സന്ധ്യയായപ്പോൾ ശിഷ്യന്മാർ അവന്റെ അടുക്കൽ വന്ന് പറഞ്ഞു: “ഈ സ്ഥലം വിജനമാണ്[a]; നേരവും ഇതിനകം വൈകിയിരിക്കുന്നു[b]. ജനക്കൂട്ടങ്ങളെ പിരിച്ചയയ്ക്കുക; അങ്ങനെ അവർ ഗ്രാമങ്ങളിലേക്ക് പോയി തങ്ങൾക്കു ഭക്ഷണം വാങ്ങട്ടെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇത് ജനവാസമില്ലാത്ത ഒരു സ്ഥലമാണ്.”
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “സമയം ഇതിനകം കടന്നുപോയിരിക്കുന്നു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀψίας δὲ γενομένης
  choice: സന്ധ്യയായപ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് സൂചിപ്പിക്കുന്ന സമയമാറ്റം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു. δέയുടെ ആഖ്യാനതുടർച്ച പ്രത്യേകം ഒരു പദം ചേർക്കാതെ വാക്യക്രമത്തിലൂടെ പ്രകടമാകുന്നു.
- source_word: προσῆλθον αὐτῷ
  choice: അവന്റെ അടുക്കൽ വന്ന്
  rationale: προσέρχομαι എന്നതിന്റെ ‘അടുക്കൽ വരുക/സമീപിക്കുക’ എന്ന അർഥം സ്വാഭാവികമായ ആഖ്യാനഭാഷയിൽ നൽകുന്നു.
- source_word: οἱ μαθηταὶ
  choice: ശിഷ്യന്മാർ
  rationale: സന്ദർഭത്തിൽ അറിയപ്പെടുന്ന യേശുവിന്റെ ശിഷ്യസംഘത്തെയാണ് നിർദ്ദിഷ്ട ആർട്ടിക്കിൾ സൂചിപ്പിക്കുന്നത്; ഗ്രീക്കിൽ ഇല്ലാത്ത ഉടമസ്ഥസർവനാമം ചേർത്തിട്ടില്ല.
- source_word: Ἔρημός ἐστιν ὁ τόπος
  choice: ഈ സ്ഥലം വിജനമാണ്
  rationale: ἔρημος ഇവിടെ സമീപത്ത് ജനവാസമില്ലാത്തതോ ഒറ്റപ്പെട്ടതോ ആയ സ്ഥലത്തെ സൂചിപ്പിക്കുന്നു. ‘വിജനം’ സംക്ഷിപ്തവും സ്വാഭാവികവും ഭൂമിശാസ്ത്രപരമായ മരുഭൂമി എന്ന അനാവശ്യ ധാരണ ഒഴിവാക്കുന്നതുമാണ്.
- source_word: ἡ ὥρα ἤδη παρῆλθεν
  choice: നേരവും ഇതിനകം വൈകിയിരിക്കുന്നു
  rationale: അക്ഷരാർഥത്തിൽ ‘സമയം ഇതിനകം കടന്നുപോയിരിക്കുന്നു’ എന്ന പ്രയോഗം ദിവസത്തിന്റെ നേരം വൈകിയെന്ന ആശയമാണ് നൽകുന്നത്; മലയാളത്തിൽ അതിന്റെ സ്വാഭാവിക തുല്യം ഉപയോഗിച്ചു.
- source_word: ἀπόλυσον τοὺς ὄχλους
  choice: ജനക്കൂട്ടങ്ങളെ പിരിച്ചയയ്ക്കുക
  rationale: ഈ സന്ദർഭത്തിൽ ἀπολύω എന്നത് ജനങ്ങളെ വിട്ടയയ്ക്കുക അഥവാ പിരിച്ചയയ്ക്കുക എന്നാണ്; അഭ്യർഥനയുടെ പ്രായോഗിക അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: ἵνα ἀπελθόντες
  choice: അങ്ങനെ അവർ ... പോയി
  rationale: ἵναയും പങ്കുപദവും ചേർന്ന ഉദ്ദേശ്യഘടന മലയാളത്തിൽ സ്വാഭാവികമായ ഫലോദ്ദേശ്യബന്ധമായി നൽകുന്നു.
- source_word: εἰς τὰς κώμας
  choice: ഗ്രാമങ്ങളിൽ പോയി
  rationale: κώμηയുടെ സാധാരണ അർഥമായ ‘ഗ്രാമം’ നിലനിർത്തുന്നു; മൂലത്തിൽ വ്യക്തമല്ലാത്ത ‘അടുത്തുള്ള’ എന്ന ആശയം ചേർത്തിട്ടില്ല.
- source_word: ἀγοράσωσιν ἑαυτοῖς βρώματα
  choice: തങ്ങൾക്കു ഭക്ഷണം വാങ്ങട്ടെ
  rationale: βρώματαയെ പൊതുവായ ‘ഭക്ഷണം’ എന്നും ἑαυτοῖς എന്ന പ്രതിഫലനസർവനാമത്തെ ‘തങ്ങൾക്കു’ എന്നും വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പദങ്ങൾ തിരഞ്ഞെടുത്തു; മൂലത്തിലെ സമയക്രമവും ഉദ്ദേശ്യബന്ധവും നിലനിർത്തി. നൽകിയ ഇംഗ്ലീഷ് consultation layer-ൽ അടിക്കുറിപ്പുകളുടെ സൂചകങ്ങൾ ബന്ധപ്പെട്ട വാക്യഭാഗങ്ങളിൽ നിന്ന് മാറിയിരുന്നതിനാൽ, [a] ‘വിജനമാണ്’ എന്നതിനും [b] ‘വൈകിയിരിക്കുന്നു’ എന്നതിനും പിന്നാലെ യഥാസ്ഥാനത്ത് ചേർത്തു.
