id: MAT.14.9
reference: Matthew 14:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸂λυπηθεὶς ὁ βασιλεὺς διὰ⸃ τοὺς ὅρκους καὶ τοὺς συνανακειμένους ἐκέλευσεν δοθῆναι,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/009.yaml
  text: And the king[a], though grieved, because of his oaths and those dining with him[b], commanded it to be given.
translation:
  language: ml
  text: രാജാവ് ദുഃഖിതനായെങ്കിലും, തന്റെ ശപഥങ്ങളും തന്നോടൊപ്പം ഭക്ഷണം കഴിച്ചുകൊണ്ടിരുന്നവരും[a] നിമിത്തം, അത് കൊടുക്കാൻ കല്പിച്ചു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തന്നോടൊപ്പം മേശയ്ക്കരികിൽ ചാരിക്കിടന്നവർ.’ അക്കാലത്തെ പതിവായിരുന്ന ഭക്ഷണരീതിയാണ് ഗ്രീക്ക് പ്രയോഗത്തിൽ പ്രതിഫലിക്കുന്നത്.
    reason: cultural_note
  - marker: b
    text: ‘കൊടുക്കാൻ’ എന്നതിന്റെ കർമം ഗ്രീക്കിൽ വ്യക്തമാക്കിയിട്ടില്ല; മുൻവാക്യത്തിൽ പറഞ്ഞ അഭ്യർഥനയാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπηθεὶς
  choice: ദുഃഖിതനായെങ്കിലും
  rationale: സന്ദർഭത്തിലെ വിരുദ്ധത സ്വാഭാവികമായി പ്രകടമാക്കിക്കൊണ്ട്, ദുഃഖിതനായിട്ടും രാജാവ് കല്പന നൽകിയെന്ന concessive ഭാവം നിലനിർത്തുന്നു.
- source_word: ὁ βασιλεὺς
  choice: രാജാവ്
  rationale: βασιλεύς എന്ന പദത്തിന്റെ നേരിട്ടുള്ളതും സന്ദർഭോചിതവുമായ മലയാള പരിഭാഷ.
- source_word: διὰ τοὺς ὅρκους
  choice: തന്റെ ശപഥങ്ങൾ നിമിത്തം
  rationale: διά + accusative ഇവിടെ കാരണത്തെ സൂചിപ്പിക്കുന്നു. ശപഥങ്ങൾ രാജാവിന്റേതാണെന്ന് മുൻസന്ദർഭത്തിൽനിന്ന് വ്യക്തമായതിനാൽ ‘തന്റെ’ എന്നു ചേർത്തു.
- source_word: τοὺς συνανακειμένους
  choice: തന്നോടൊപ്പം ഭക്ഷണം കഴിച്ചുകൊണ്ടിരുന്നവർ
  rationale: അന്നത്തെ പതിവുപോലെ മേശയ്ക്കരികിൽ ചാരിക്കിടന്ന് ഒരുമിച്ചു ഭക്ഷണം കഴിച്ചിരുന്നവരെയാണ് സൂചിപ്പിക്കുന്നത്; മുഖ്യവാചകത്തിൽ ആധുനിക വായനക്കാർക്ക് സ്വാഭാവികമായ പ്രയോഗം ഉപയോഗിച്ചു.
- source_word: ἐκέλευσεν
  choice: കല്പിച്ചു
  rationale: κελεύω എന്നതിന്റെ അധികാരപൂർവമായ ആജ്ഞ നൽകുക എന്ന അർഥം ചുരുക്കമായും ഗൗരവത്തോടെയും നൽകുന്നു.
- source_word: δοθῆναι
  choice: അത് കൊടുക്കാൻ
  rationale: ഗ്രീക്കിലെ കർമം വ്യക്തമാക്കാത്ത passive infinitive-ന്റെ അർഥം നിലനിർത്തുന്നു; ‘അത്’ എന്താണെന്നത് മുൻസന്ദർഭത്തിൽനിന്ന് മനസ്സിലാക്കണം.
