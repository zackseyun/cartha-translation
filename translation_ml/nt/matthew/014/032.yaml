id: MAT.14.32
reference: Matthew 14:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸀ἀναβάντων αὐτῶν εἰς τὸ πλοῖον ἐκόπασεν ὁ ἄνεμος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/032.yaml
  text: And when they got into the boat[a], the wind ceased.
translation:
  language: ml
  text: അവർ പടകിൽ കയറിയപ്പോൾ[a] കാറ്റ് അടങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘അവർ പടകിലേക്കു കയറിയശേഷം.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναβάντων αὐτῶν
  choice: അവർ … കയറിയപ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് സ്വാഭാവികമായ മലയാളത്തിൽ കാലസൂചക ഉപവാക്യമായി നൽകി. ἀναβαίνω എന്നതിന് അക്ഷരാർഥത്തിൽ ‘മുകളിലേക്കു കയറുക’ എന്നാണെങ്കിലും, εἰς τὸ πλοῖον എന്ന സന്ദർഭത്തിൽ ‘പടകിൽ കയറുക’ എന്നതാണ് സ്വാഭാവികം.
- source_word: πλοῖον
  choice: പടക്
  rationale: ഗലീലക്കടലിലെ ശിഷ്യന്മാരുടെ ജലയാനത്തെ സൂചിപ്പിക്കാൻ ആധുനിക മലയാളത്തിൽ ‘പടക്’ യോജിക്കുന്നു; ‘കപ്പൽ’ അനാവശ്യമായി വലിയ ജലയാനത്തെ സൂചിപ്പിച്ചേക്കാം.
- source_word: ἐκόπασεν
  choice: അടങ്ങി
  rationale: κοπάζω കാറ്റ് നിലയ്ക്കുകയോ ശമിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘അടങ്ങി’ മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവും ആകുന്നു; ക്രമേണ ശാന്തമായെന്ന ആശയം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: ὁ ἄνεμος
  choice: കാറ്റ്
  rationale: ഗ്രീക്കിലെ നിർദിഷ്ട കർത്താവിന്റെ നേരിട്ടുള്ള, സ്വാഭാവിക മലയാള പരിഭാഷ.
- source_word: καὶ
  choice: പ്രത്യേകമായി പദാന്തരം ചെയ്തിട്ടില്ല
  rationale: മലയാളത്തിലെ വാക്യക്രമവും മുൻസന്ദർഭത്തിലെ ആഖ്യാനതുടർച്ചയും ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു. ‘പിന്നെ’ എന്നു ചേർത്താൽ ഗ്രീക്കിലുള്ളതിലധികം കാലക്രമ ഊന്നൽ വരാം.
theological_decisions:
- issue: പ്രകൃതിയിന്മേലുള്ള യേശുവിന്റെ അധികാരത്തെക്കുറിച്ചുള്ള ആഖ്യാനസൂചന
  choice: കാറ്റ് അടങ്ങിയ സംഭവത്തെ വിശദീകരണം ചേർക്കാതെ നേരിട്ട് വിവർത്തനം ചെയ്തു.
  alternative: അത്ഭുതകരമായ അധികാരത്തെ മുൻനിർത്തുന്ന വ്യാഖ്യാനപരമായ പരിഭാഷ.
  rationale: യേശുവും പത്രോസും പടകിൽ കയറിയപ്പോൾ കാറ്റ് അടങ്ങിയെന്ന് വാക്യം വിവരിക്കുന്നു. അതിന്റെ ദൈവശാസ്ത്രപരമായ പ്രാധാന്യം സന്ദർഭത്തിൽ വ്യക്തമാണെങ്കിലും, ഗ്രീക്കിൽ ഇല്ലാത്ത വിശദീകരണം മുഖ്യപാഠത്തിൽ ചേർക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവും ആഖ്യാനപരവുമായ ശൈലി. സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന പദങ്ങൾ ഉപയോഗിച്ചു; മൂലപാഠത്തിന്റെ സംക്ഷിപ്തത നിലനിർത്തി.
