id: MAT.14.22
reference: Matthew 14:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ εὐθέως ⸀ἠνάγκασεν τοὺς μαθητὰς ἐμβῆναι ⸀εἰς πλοῖον καὶ προάγειν αὐτὸν εἰς τὸ πέραν, ἕως οὗ ἀπολύσῃ τοὺς ὄχλους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/022.yaml
  text: And immediately he compelled the disciples to get into the boat and go on ahead of him to the other side[a], until he should dismiss the crowds.
translation:
  language: ml
  text: ഉടനെ യേശു ശിഷ്യന്മാരെ വള്ളത്തിൽ കയറി, താൻ ജനക്കൂട്ടങ്ങളെ പറഞ്ഞയയ്ക്കുന്നതുവരെ[a] തനിക്കുമുമ്പേ മറുകരയിലേക്കു പോകാൻ നിർബന്ധിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ജനക്കൂട്ടങ്ങളെ അയച്ചുവിടുന്നതുവരെ.”
    reason: ἀπολύσῃയുടെ സന്ദർഭോചിതമായ മറ്റൊരു പദപരമായ വിവർത്തനം സൂചിപ്പിക്കുന്നു.
lexical_decisions:
- source_word: εὐθέως
  choice: ഉടനെതന്നെ
  rationale: സംഭവങ്ങൾക്കിടയിലെ പെട്ടെന്നുള്ള തുടർച്ചയും പ്രവൃത്തിയുടെ തൽക്ഷണതയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἠνάγκασεν
  choice: നിർബന്ധിച്ചു
  rationale: ἀναγκάζω സൂചിപ്പിക്കുന്ന ശക്തമായ നിർദേശം അഥവാ സമ്മർദം നിലനിർത്തുന്നു; ശാരീരിക ബലപ്രയോഗം അനാവശ്യമായി ധ്വനിപ്പിക്കുന്നില്ല.
- source_word: τοὺς μαθητάς
  choice: ശിഷ്യന്മാരെ
  rationale: നിശ്ചിതമായി അറിയപ്പെടുന്ന ശിഷ്യസംഘത്തെയാണ് ഗ്രീക്ക് നിർദേശിക്കുന്നത്; മലയാളത്തിൽ സന്ദർഭം നിശ്ചിതത്വം വ്യക്തമാക്കുന്നു.
- source_word: ἐμβῆναι εἰς πλοῖον
  choice: വള്ളത്തിൽ കയറി
  rationale: വള്ളത്തിൽ പ്രവേശിക്കുക/കയറുക എന്ന അർഥം സ്വാഭാവികമായ മലയാളപ്രയോഗത്തിൽ നൽകുന്നു.
- source_word: πλοῖον
  choice: വള്ളം
  rationale: ഗലീലക്കടലിലെ ചെറുജലവാഹനത്തിന് സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും സന്ദർഭോചിതവുമായ പദമാണ്.
- source_word: προάγειν αὐτόν
  choice: തനിക്കു മുമ്പേ ... പോകാൻ
  rationale: ശിഷ്യന്മാർ യേശുവിനെക്കാൾ മുമ്പായി പുറപ്പെടണം എന്ന ആശയം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: εἰς τὸ πέραν
  choice: മറുകരയിലേക്ക്
  rationale: ജലാശയത്തിന്റെ എതിർവശത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ശൈലിയുടെ സ്വാഭാവിക മലയാള തുല്യപ്രയോഗമാണിത്.
- source_word: ἕως οὗ ἀπολύσῃ
  choice: അതതിനിടെ ... പറഞ്ഞയയ്ക്കാനായിരുന്നു
  rationale: പ്രധാന കല്പനയോട് ബന്ധപ്പെട്ട് യേശു ജനത്തെ പറഞ്ഞയയ്ക്കുന്ന ഇടക്കാല പ്രവൃത്തി ലക്ഷ്യമാക്കിയിരുന്നതായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἀπολύσῃ τοὺς ὄχλους
  choice: ജനക്കൂട്ടങ്ങളെ പറഞ്ഞയയ്ക്കുക
  rationale: ἀπολύωയുടെ സന്ദർഭോചിതമായ ‘അയച്ചുവിടുക/പിരിച്ചുവിടുക’ എന്ന അർഥം അധിക ഔപചാരികതയില്ലാതെ വ്യക്തമാക്കുന്നു.
- source_word: ὄχλους
  choice: ജനക്കൂട്ടങ്ങളെ
  rationale: ഗ്രീക്കിലെ ബഹുവചനം നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി കേൾക്കുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ വിവരണശൈലി. ഗ്രീക്കിൽ കർത്താവ് സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാകുന്നതിനാൽ മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി ‘യേശു’ എന്നും ‘അദ്ദേഹം’ എന്നും വ്യക്തമാക്കിയിരിക്കുന്നു. ‘നിർബന്ധിച്ചു’ എന്നത് മൂലത്തിലെ ശക്തി നിലനിർത്തുന്നു.
