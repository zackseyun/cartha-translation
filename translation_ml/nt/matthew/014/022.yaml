    reason: ἀπολύσῃയുടെ സന്ദർഭോചിതമായ മറ്റൊരു പദപരമായ വിവർത്തനം സൂചിപ്പിക്കുന്നു.
  revision_rationale: The revision preserves the Greek temporal construction ἕως οὗ with a natural Malayalam “...വരെ,” while retaining the original sequence and force of the principal actions. The footnote is moved to and anchored on the phrase translating ἀπολύσῃ.
