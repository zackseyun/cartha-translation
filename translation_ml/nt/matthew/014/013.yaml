id: MAT.14.13
reference: Matthew 14:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂Ἀκούσας δὲ⸃ ὁ Ἰησοῦς ἀνεχώρησεν ἐκεῖθεν ἐν πλοίῳ εἰς ἔρημον τόπον κατ’ ἰδίαν· καὶ ἀκούσαντες οἱ ὄχλοι ἠκολούθησαν αὐτῷ πεζῇ ἀπὸ τῶν πόλεων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/013.yaml
  text: When Jesus heard this[a], he withdrew from there by boat to a desolate place by himself. But when the crowds heard[b], they followed him on foot from the towns.
translation:
  language: ml
  text: യേശു ഇതു കേട്ടപ്പോൾ, അവിടെനിന്ന് വള്ളത്തിൽ ഒരു വിജനസ്ഥലത്തേക്ക്[a] തനിച്ചായി പിൻവാങ്ങി. എന്നാൽ ജനക്കൂട്ടങ്ങൾ ഇതു കേട്ടപ്പോൾ, പട്ടണങ്ങളിൽനിന്ന്[b] കാൽനടയായി അദ്ദേഹത്തെ പിന്തുടർന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആളൊഴിഞ്ഞ സ്ഥലത്തേക്ക്’ അല്ലെങ്കിൽ ‘ഏകാന്തമായ സ്ഥലത്തേക്ക്’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പ്രയോഗം മണൽമരുഭൂമിയെ നിർബന്ധമായും സൂചിപ്പിക്കുന്നില്ല; ജനവാസമില്ലാത്തതോ ഒറ്റപ്പെട്ടതോ ആയ പ്രദേശത്തെയാണ് വിവരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘നഗരങ്ങളിൽനിന്ന്’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദം സന്ദർഭമനുസരിച്ച് പട്ടണങ്ങളെയോ നഗരങ്ങളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσας δὲ
  choice: യേശു ഇതു കേട്ടപ്പോൾ
  rationale: ഏറിസ്റ്റ് കൃദന്തത്തിന്റെ കാലസംബന്ധമായ അർഥം ‘കേട്ടപ്പോൾ’ എന്നു സ്വാഭാവികമായി നൽകുന്നു. δέ ഇവിടെ ശക്തമായ വൈരുധ്യമല്ല, ആഖ്യാനത്തിന്റെ മുന്നേറ്റമാണ്; അതിനാൽ ആദ്യവാക്യത്തിൽ പ്രത്യേക ബന്ധകപദം ചേർത്തിട്ടില്ല. സന്ദർഭത്തിൽ കേട്ട വാർത്തയെയാണ് ‘ഇതു’ സൂചിപ്പിക്കുന്നത്.
- source_word: ἀνεχώρησεν
  choice: പിൻവാങ്ങി
  rationale: മത്തായിയിൽ ഈ ക്രിയയ്ക്ക് സാഹചര്യത്തോടുള്ള പ്രതികരണമായി മാറിനിൽക്കുക അഥവാ അകന്നുപോകുക എന്ന സൂക്ഷ്മതയുണ്ട്. എന്നാൽ കാരണം—സുരക്ഷ, ദുഃഖം, പ്രാർഥന—വിവർത്തനത്തിൽ നിർണയിക്കുന്നില്ല.
- source_word: ἐν πλοίῳ
  choice: വള്ളത്തിൽ
  rationale: യാത്രയുടെ മാർഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; πλοῖον എന്നത് ഈ സന്ദർഭത്തിൽ ചെറിയ ജലയാനത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: εἰς ἔρημον τόπον
  choice: ഒരു വിജനസ്ഥലത്തേക്ക്
  rationale: ἔρημος മണൽമരുഭൂമി എന്നതിലുപരി ജനവാസമില്ലാത്തതോ ഒറ്റപ്പെട്ടതോ ആയ പ്രദേശത്തെ സൂചിപ്പിക്കുന്നു. ‘വിജനസ്ഥലം’ ആ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: κατ’ ἰδίαν
  choice: തനിച്ചായി
  rationale: മറ്റുള്ളവരിൽനിന്ന് വേറിട്ട്, സ്വകാര്യമായി എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു; ആരൊക്കെ കൂടെയുണ്ടായിരുന്നുവെന്നത് ഇതിലൂടെ അനാവശ്യമായി വിശദീകരിക്കുന്നില്ല.
- source_word: οἱ ὄχλοι
  choice: ജനക്കൂട്ടങ്ങൾ
  rationale: ഗ്രീക്കിലെ ബഹുവചനം നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ വ്യക്തമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: ἠκολούθησαν αὐτῷ
  choice: അദ്ദേഹത്തെ പിന്തുടർന്നു
  rationale: ഇവിടെ യാഥാർഥ്യമായ യാത്രയെ സൂചിപ്പിക്കുന്ന സാധാരണ അർഥം നൽകുന്നു; ശിഷ്യത്വത്തെക്കുറിച്ചുള്ള അധിക ദൈവശാസ്ത്രാർഥം ചുമത്തുന്നില്ല.
- source_word: πεζῇ
  choice: കാൽനടയായി
  rationale: വള്ളത്തിലൂടെയുള്ള യേശുവിന്റെ യാത്രയ്ക്ക് വിപരീതമായി കരയിലൂടെ നടന്നുള്ള യാത്ര വ്യക്തമായി നൽകുന്നു.
- source_word: ἀπὸ τῶν πόλεων
  choice: പട്ടണങ്ങളിൽനിന്ന്
  rationale: πόλις സന്ദർഭാനുസരണം പട്ടണമോ നഗരമോ ആകാം. ഗലീലാസന്ദർഭത്തിൽ ‘പട്ടണങ്ങൾ’ സ്വാഭാവികമാണ്; പകരംവിവർത്തനം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: യേശു പിൻവാങ്ങിയതിന്റെ ഉദ്ദേശ്യം
  choice: ക്രിയയെ ‘പിൻവാങ്ങി’ എന്നു നിഷ്പക്ഷമായി പരിഭാഷപ്പെടുത്തി; ഉദ്ദേശ്യം വ്യക്തമാക്കിയില്ല.
  alternative: സുരക്ഷയ്ക്കായി പിന്മാറി; ദുഃഖിക്കാനോ പ്രാർഥിക്കാനോ ഏകാന്തത തേടി; യാത്രയ്ക്കായി മാത്രം അവിടെനിന്നു പോയി.
  rationale: വാർത്ത കേട്ടശേഷം യേശു വിജനസ്ഥലത്തേക്ക് തനിച്ചായി പോയെന്നു വാക്യം പറയുന്നു; എന്നാൽ അതിന്റെ കൃത്യമായ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ വ്യാഖ്യാനസാധ്യതകൾ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അദ്ദേഹത്തെ’ എന്ന ആദരസൂചക സർവനാമം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ ആദരഭാവം നൽകുന്നു. ഗ്രീക്കിലെ ആദ്യ δέ-യ്ക്ക് കൃത്രിമമായ ബന്ധകം ചേർക്കാതെ, രണ്ടാമത്തെ καί-യുടെ സംഭവവികാസ/ലഘുവൈരുധ്യഭാവം ‘എന്നാൽ’ വഴി നൽകുന്നു. അടിക്കുറിപ്പുകളുടെ ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദപ്രയോഗങ്ങൾക്ക് പിന്നാലെ തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
