reference: Matthew 14:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ἐλθέ. καὶ καταβὰς ἀπὸ τοῦ ⸀πλοίου Πέτρος περιεπάτησεν ἐπὶ τὰ ὕδατα ⸂καὶ ἦλθεν⸃ πρὸς τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/029.yaml
  text: And he said[a], “Come.” So Peter got down from the boat, walked on the water, and came toward Jesus.
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “വരിക.” അപ്പോൾ പത്രോസ് വള്ളത്തിൽനിന്ന് ഇറങ്ങി, വെള്ളത്തിന്മേൽ നടന്നു, യേശുവിന്റെ നേരെ ചെന്നു.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യേശുവിന്റെ അടുക്കൽ ചെന്നു.” ഗ്രീക്കിലെ പ്രയോഗം യേശുവിന്റെ ദിശയിലേക്കുള്ള നീക്കത്തിന് ഊന്നൽ നൽകുന്നു; എത്തിച്ചേർന്നുവെന്ന് നിർബന്ധമായി പറയുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐλθέ
  choice: വരിക
  rationale: ἔρχομαι എന്ന ക്രിയയുടെ ഏകവചന ആജ്ഞാരൂപമാണിത്. ഗ്രീക്കിലെ നേരിട്ടുള്ള ക്ഷണം അധികവാക്കുകൾ ചേർക്കാതെ സ്വാഭാവികവും മാന്യവുമായി നൽകുന്നു.
- source_word: καταβὰς ἀπὸ τοῦ πλοίου
  choice: വള്ളത്തിൽനിന്ന് ഇറങ്ങി
  rationale: καταβὰς താഴേക്ക് ഇറങ്ങുന്ന പ്രവൃത്തിയെയും തുടർന്നുള്ള സംഭവങ്ങൾക്ക് മുമ്പുള്ള ക്രമത്തെയും സൂചിപ്പിക്കുന്നു. ഗലീലക്കടലിലെ സന്ദർഭത്തിൽ πλοῖον എന്നതിന് ‘വള്ളം’ സ്വാഭാവികമാണ്.
- source_word: περιεπάτησεν
  choice: നടന്നു
  rationale: ഈ സന്ദർഭത്തിൽ περιπατέω സാധാരണ അർഥമായ ‘നടക്കുക’ എന്നതുതന്നെയാണ്; ‘നടക്കാൻ തുടങ്ങി’ എന്ന അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: ἐπὶ τὰ ὕδατα
  choice: വെള്ളത്തിന്മേൽ
  rationale: ἐπί കൂടെ കർമവിഭക്തി ഇവിടെ വെള്ളത്തിന്റെ ഉപരിതലത്തിന്മേലുള്ള ചലനത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ഏകവചനസമാനമായ ‘വെള്ളം’ സ്വാഭാവികമാണ്.
- source_word: καὶ ἦλθεν πρὸς τὸν Ἰησοῦν
  choice: യേശുവിന്റെ അടുത്തേക്കു ചെന്നു
  rationale: πρός യേശുവിന്റെ ദിശയിലേക്കുള്ള നീക്കം സൂചിപ്പിക്കുന്നു. ‘അടുത്തേക്ക്’ എന്ന പ്രയോഗം ലക്ഷ്യദിശ നിലനിർത്തുകയും എത്തിച്ചേർന്നുവെന്ന് അനിവാര്യമായി പ്രസ്താവിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: δὲ
  choice: അവൻ പറഞ്ഞു
  rationale: δέ ഇവിടെ ശക്തമായ വിരോധമല്ല, ലഘുവായ ആഖ്യാനബന്ധമാണ്. മുൻവാക്യത്തോടുള്ള ബന്ധം മലയാളത്തിലെ വാക്യക്രമത്തിൽ സ്വാഭാവികമായി നിലനിൽക്കുന്നതിനാൽ പ്രത്യേക സംയോജകപദം ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: പത്രോസ് യേശുവിന്റെ അടുത്തേക്കു നീങ്ങിയതിന്റെ വിവരണം
  choice: യേശുവിന്റെ അടുത്തേക്കു ചെന്നു
  alternative: യേശുവിന്റെ അടുക്കൽ ചെന്നു
  rationale: πρός പ്രധാനമായും യേശുവിന്റെ ദിശയിലേക്കുള്ള നീക്കമാണ് അടയാളപ്പെടുത്തുന്നത്; പത്രോസ് യേശുവിന്റെ അടുക്കൽ എത്തിച്ചേർന്നുവെന്ന കൂടുതൽ നിർണായകമായ അർഥം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല. ഇതിലൂടെ ആഖ്യാനത്തിലെ സംഘർഷവും തുടർന്നുള്ള സംഭവവികാസത്തിനുള്ള തുറന്ന നിലയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘വള്ളം,’ ‘വെള്ളത്തിന്മേൽ,’ ‘അടുത്തേക്ക്’ എന്നീ സാധാരണ പ്രയോഗങ്ങൾ സ്വീകരിച്ചു; ഗ്രീക്കിലെ പ്രവർത്തനക്രമവും ലക്ഷ്യദിശയിലെ സൂക്ഷ്മതയും നിലനിർത്തി.
