- from: 'അവൻ പറഞ്ഞു: “വരിക.” അപ്പോൾ പത്രോസ് വള്ളത്തിൽനിന്ന് ഇറങ്ങി വെള്ളത്തിന്മേൽ നടന്നു യേശുവിന്റെ അടുത്തേക്കു ചെന്നു.[a]'
  to: 'അവൻ പറഞ്ഞു: “വരിക.” അപ്പോൾ പത്രോസ് വള്ളത്തിൽനിന്ന് ഇറങ്ങി, വെള്ളത്തിന്മേൽ നടന്നു, യേശുവിന്റെ നേരെ ചെന്നു.[a]'
  rationale: “യേശുവിന്റെ നേരെ ചെന്നു” preserves the directional force of πρὸς more clearly than “യേശുവിന്റെ അടുത്തേക്കു ചെന്നു,” while remaining idiomatic Malayalam. Commas clarify the three sequential, coordinated actions represented in the Greek narrative.
