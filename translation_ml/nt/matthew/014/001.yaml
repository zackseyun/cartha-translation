lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: ആ സമയത്ത്
  rationale: ഈ പ്രയോഗം സമയത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ ഭാഷാശൈലിയാണ്; ഗ്രീക്കിലെ അർഥം ആധുനിക മലയാളത്തിൽ നേരിട്ട് നൽകുന്നു.
- source_word: ἤκουσεν
  choice: കേട്ടു
  rationale: ἀκούω എന്ന ക്രിയയുടെ ലളിതമായ അർഥം നിലനിർത്തുന്നു; ‘അറിഞ്ഞു’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ വിവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: Ἡρῴδης
  choice: ഹെരോദാവ്
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം ഉപയോഗിക്കുന്നു.
- source_word: ὁ τετραάρχης
  choice: ചതുർഭരണാധികാരി
  rationale: പ്രത്യേകമായ ചരിത്ര-രാഷ്ട്രീയ പദവിയെ സൂചിപ്പിക്കുന്ന τετραάρχης എന്ന പദം അർഥസൂചനയോടെ പരിഭാഷപ്പെടുത്തുന്നു; പൊതുവായ ‘ഭരണാധികാരി’ എന്നു മാത്രം നൽകി കൃത്യത നഷ്ടപ്പെടുത്തുന്നില്ല.
- source_word: τὴν ἀκοὴν
  choice: വാർത്ത
  rationale: ഇവിടെ ἀκοή കേൾവിശക്തിയെയല്ല, കേൾക്കപ്പെട്ട വിവരം അഥവാ വാർത്തയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘വാർത്ത’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്.
- source_word: Ἰησοῦ
  choice: യേശുവിനെക്കുറിച്ചുള്ള
  rationale: ἀκοή-യോടൊപ്പമുള്ള ജനിറ്റീവ്, വാർത്തയുടെ വിഷയം യേശുവാണെന്ന് സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘യേശുവിനെക്കുറിച്ചുള്ള’ എന്നത് സ്വാഭാവികമായി ആ ബന്ധം വ്യക്തമാക്കുന്നു.
