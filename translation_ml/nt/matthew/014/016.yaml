id: MAT.14.16
reference: Matthew 14:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Οὐ χρείαν ἔχουσιν ἀπελθεῖν· δότε αὐτοῖς ὑμεῖς φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/016.yaml
  text: But Jesus said to them[a], “They have no need to go away; you yourselves give them something to eat.”
translation:
  language: ml
  text: 'എന്നാൽ യേശു അവരോടു പറഞ്ഞു: “അവർ പോകേണ്ട ആവശ്യമില്ല; നിങ്ങൾതന്നെ അവർക്ക് ഭക്ഷിക്കാൻ എന്തെങ്കിലും കൊടുക്കുക.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: ശിഷ്യന്മാർ നിർദേശിച്ച പരിഹാരത്തോടുള്ള മൃദുവായ വൈരുധ്യം സൂചിപ്പിക്കുന്നു; അതേസമയം ആഖ്യാനത്തിന്റെ സ്വാഭാവിക തുടർച്ച നിലനിർത്തുന്നു.
- source_word: εἶπεν αὐτοῖς
  choice: അവരോടു പറഞ്ഞു
  rationale: λέγω എന്ന ക്രിയയും ദത്തിവിഭക്തിയിലുള്ള പരോക്ഷ കർമവും ലളിതമായ ആഖ്യാനശൈലിയിൽ കൃത്യമായി നൽകുന്നു.
- source_word: Οὐ χρείαν ἔχουσιν ἀπελθεῖν
  choice: അവർ പോകേണ്ട ആവശ്യമില്ല
  rationale: ἔχω χρείαν എന്ന പ്രയോഗത്തിന്റെ അർത്ഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ἀπέρχομαι ഇവിടെ സ്ഥലത്തുനിന്ന് പോകുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: δότε αὐτοῖς
  choice: അവർക്ക് ... കൊടുക്കുക
  rationale: രണ്ടാം പുരുഷ ബഹുവചന ആജ്ഞാരൂപത്തെ നേരിട്ടുള്ള കല്പനയായി നൽകുന്നു; αὐτοῖς ജനക്കൂട്ടത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ὑμεῖς
  choice: നിങ്ങൾതന്നെ
  rationale: ഗ്രീക്കിലെ വ്യക്തമായി ചേർത്തിരിക്കുന്ന സർവനാമത്തിന്റെ ഊന്നൽ സംരക്ഷിക്കുന്നു; ഭക്ഷണം നൽകേണ്ടവർ ശിഷ്യന്മാർ തന്നെയാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: φαγεῖν
  choice: ഭക്ഷിക്കാൻ
  rationale: δίδωμι + infinitive എന്ന ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഭക്ഷിക്കാൻ കൊടുക്കുക’ എന്നു നൽകാം; ഗ്രീക്കിൽ ഇല്ലാത്ത പ്രത്യേക നാമപദം അനാവശ്യമായി ചേർക്കുന്നില്ല.
theological_decisions:
- issue: യേശുവിന്റെ കല്പനയിൽ ശിഷ്യന്മാരുടെ പങ്കിനുള്ള ഊന്നൽ
  choice: ὑμεῖς എന്നത് ‘നിങ്ങൾതന്നെ’ എന്ന് ഊന്നലോടെ പരിഭാഷപ്പെടുത്തി.
  alternative: ‘നിങ്ങൾ’ എന്നു മാത്രം നൽകുക.
  rationale: ഗ്രീക്കിൽ കർത്തൃസർവനാമം പ്രത്യേകം ചേർത്തിരിക്കുന്നത് യഥാർഥ ഊന്നൽ നൽകുന്നു. ഇതു സംരക്ഷിക്കുമ്പോഴും അതിനപ്പുറം ഒരു പ്രത്യേക ദൈവശാസ്ത്ര വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ഭക്ഷിക്കാൻ കൊടുക്കുക’ എന്നത് മൂലത്തിലെ ഘടനയ്ക്ക് അടുത്തും മലയാളത്തിൽ സ്വാഭാവികവുമാണ്. പ്രസിദ്ധീകരണവാചകത്തിൽ അടിക്കുറിപ്പ് ആവശ്യമില്ല; നൽകിയ ഇംഗ്ലീഷ് അടിക്കുറിപ്പ് ഇംഗ്ലീഷിലെ ശൈലിവ്യത്യാസം മാത്രമാണ്, മലയാളത്തിൽ വേറൊരു അർത്ഥവ്യത്യാസം സൃഷ്ടിക്കുന്നില്ല.
