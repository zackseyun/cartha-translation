  text: Καὶ διαπεράσαντες ἦλθον ⸂ἐπὶ τὴν γῆν εἰς⸃ Γεννησαρέτ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/034.yaml
  text: And after crossing over[a], they came to the land of Gennesaret.
translation:
  language: ml
  text: അവർ അക്കരെ കടന്ന് ഗെന്നേസരെത്ത് ദേശത്ത് എത്തി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവർ ഗെന്നേസരെത്ത് ദേശത്തിന്റെ കരയിൽ എത്തി.’ ഗ്രീക്കിൽ ‘നിലത്തേക്ക്’ എന്നും ‘ഗെന്നേസരെത്തിലേക്ക്’ എന്നും ചേർത്തുപറയുന്നു; ഇതിലൂടെ ഗെന്നേസരെത്ത് പ്രദേശത്തെ കരയിൽ എത്തിയതിന്റെ ആശയം പ്രകടമാകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαπεράσαντες
  choice: അക്കരെ കടന്ന്
  rationale: കടൽ കടന്നുള്ള സഞ്ചാരത്തെ സൂചിപ്പിക്കുന്ന മുൻകാലിക ഏറിസ്റ്റ് കൃദന്തരൂപം; മലയാളത്തിൽ പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള പ്രവൃത്തിയായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἦλθον
  choice: എത്തി
  rationale: ἔρχομαι എന്ന ക്രിയയുടെ ഏറിസ്റ്റ് രൂപം. ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള വരവ് ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἐπὶ τὴν γῆν εἰς Γεννησαρέτ
  choice: ഗെന്നേസരെത്ത് പ്രദേശത്തെ കരയിൽ
  rationale: ‘നിലത്തിന്മേലേക്ക്’ എന്നും ‘ഗെന്നേസരെത്തിലേക്ക്’ എന്നും ഉള്ള ഗ്രീക്ക് ഘടനയുടെ സംയുക്ത അർഥം നിലനിർത്തി, വള്ളയാത്രയുടെ പശ്ചാത്തലത്തിൽ കരയിലെത്തിയതും ആ കര ഗെന്നേസരെത്ത് പ്രദേശത്തേതാണെന്നും വ്യക്തമാക്കുന്നു.
- source_word: Γεννησαρέτ
  choice: ഗെന്നേസരെത്ത്
  rationale: സ്ഥലനാമം മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
