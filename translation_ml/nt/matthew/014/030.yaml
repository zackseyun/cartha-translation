id: MAT.14.30
reference: Matthew 14:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: βλέπων δὲ τὸν ἄνεμον ⸀ἰσχυρὸν ἐφοβήθη, καὶ ἀρξάμενος καταποντίζεσθαι ἔκραξεν λέγων· Κύριε, σῶσόν με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/030.yaml
  text: But seeing the strong wind[a], he became afraid, and beginning to sink, he cried out, saying, “Lord[b], save me.”
translation:
  language: ml
  text: എന്നാൽ ശക്തമായ കാറ്റ് കണ്ട് അവൻ ഭയപ്പെട്ടു. മുങ്ങാൻ തുടങ്ങിയപ്പോൾ അവൻ, “കർത്താവേ, എന്നെ രക്ഷിക്കണമേ!” എന്നു നിലവിളിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βλέπων
  choice: കണ്ടപ്പോൾ
  rationale: വർത്തമാനകാല പങ്കുപദം മുഖ്യക്രിയയോടൊപ്പമുള്ള ഗ്രഹണത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ കാലബന്ധം ‘കണ്ടപ്പോൾ’ വ്യക്തമാക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുമ്പ് വെള്ളത്തിന്മേൽ നടന്നുകൊണ്ടിരുന്ന സംഭവത്തിൽനിന്നുള്ള വൈരുധ്യാത്മക വഴിത്തിരിവ് വ്യക്തമാക്കുന്നു.
- source_word: τὸν ἄνεμον ἰσχυρόν
  choice: ശക്തമായ കാറ്റ്
  rationale: ἰσχυρός കാറ്റിന്റെ ശക്തിയെ നേരിട്ട് വിശേഷിപ്പിക്കുന്നു; ‘ശക്തമായ’ എന്നത് കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: ἐφοβήθη
  choice: ഭയപ്പെട്ടു
  rationale: ഭയം ആരംഭിച്ചതിനെ സന്ദർഭവും ‘കണ്ടപ്പോൾ’ എന്ന ഘടനയും സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: ἀρξάμενος καταποντίζεσθαι
  choice: മുങ്ങിത്തുടങ്ങിയപ്പോൾ
  rationale: മുങ്ങൽ ആരംഭിച്ചുകൊണ്ടിരിക്കുന്ന ഘട്ടമാണ് വാക്യം സൂചിപ്പിക്കുന്നത്; ‘മുങ്ങിമരിക്കുക’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് അർഥം അതിരുകടത്തും.
- source_word: ἔκραξεν λέγων
  choice: എന്നു നിലവിളിച്ചു
  rationale: അടിയന്തരവും ഉച്ചത്തിലുള്ളതുമായ അപേക്ഷ മലയാളത്തിലെ സ്വാഭാവിക നേരിട്ടുള്ള സംഭാഷണഘടനയിൽ നൽകുന്നു.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: യേശുവിനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയിൽ κύριος എന്ന പദത്തിന്റെ അർഥവും ക്രിസ്തുശാസ്ത്രപരമായ ഭാരവും നിലനിർത്തുന്നു.
- source_word: σῶσόν με
  choice: എന്നെ രക്ഷിക്കണമേ
  rationale: ഉടനെയുള്ള അപകടത്തിൽനിന്നുള്ള വിടുതലും σῴζω എന്ന പദത്തിന്റെ വിശാലമായ അർഥപ്രതിധ്വനിയും ഒരുപോലെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യേശുവിനെ κύριος എന്നു നേരിട്ട് അഭിസംബോധന ചെയ്യുന്നത്
  choice: കർത്താവേ
  alternative: ഗുരുവേ / യജമാനനേ
  rationale: ‘കർത്താവേ’ മൂലപദത്തിന്റെ സാധാരണ അർഥവും മത്തായിയുടെ വിവരണത്തിലെ ക്രിസ്തുശാസ്ത്രപരമായ സാധ്യതയും നിലനിർത്തുന്നു; അതേസമയം വാക്യം പറയുന്നതിലധികം വിശദീകരണം ചേർക്കുന്നില്ല.
- issue: ഉടനെയുള്ള ശാരീരിക അപകടത്തിന്റെ സന്ദർഭത്തിൽ σῴζω പരിഭാഷപ്പെടുത്തുന്നത്
  choice: എന്നെ രക്ഷിക്കണമേ
  alternative: എന്നെ അപകടത്തിൽനിന്ന് വിടുവിക്കണമേ
  rationale: സന്ദർഭത്തിലെ അടിയന്തര രക്ഷ വ്യക്തമാണ്; ‘രക്ഷിക്കുക’ എന്നത് പദത്തിന്റെ വിശാലമായ അർഥസാധ്യത അനാവശ്യമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ പങ്കുപദഘടനകൾ വാക്കുതോറും പകർത്താതെ സ്വാഭാവികമായ ‘കണ്ടപ്പോൾ’, ‘മുങ്ങിത്തുടങ്ങിയപ്പോൾ’ എന്നീ ഘടനകളാക്കി. അടിയന്തരത പ്രകടമാക്കാൻ നേരിട്ടുള്ള വാക്കുകളിൽ ആശ്ചര്യചിഹ്നം ഉപയോഗിച്ചു.
