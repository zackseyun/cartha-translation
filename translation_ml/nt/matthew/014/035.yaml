translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ പുരുഷലിംഗസൂചന നിലനിർത്തി; അന്തർലീനമായ കർമത്തെ മലയാളത്തിൽ ലഘുവായി വ്യക്തമാക്കിയെങ്കിലും അടിക്കുറിപ്പിലൂടെ മൂലപാഠത്തിലെ അനിശ്ചിതത്വം സംരക്ഷിച്ചു.
