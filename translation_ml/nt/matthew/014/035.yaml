source:
  edition: SBLGNT
  text: καὶ ἐπιγνόντες αὐτὸν οἱ ἄνδρες τοῦ τόπου ἐκείνου ἀπέστειλαν εἰς ὅλην τὴν περίχωρον ἐκείνην, καὶ προσήνεγκαν αὐτῷ πάντας τοὺς κακῶς ἔχοντας,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/035.yaml
  text: And when the men of that place recognized him[a], they sent into that whole surrounding region and brought to him all who were sick[b],
translation:
  language: ml
  text: ആ സ്ഥലത്തെ പുരുഷന്മാർ അവനെ തിരിച്ചറിഞ്ഞപ്പോൾ, ചുറ്റുമുള്ള ആ പ്രദേശത്തെല്ലാം അയച്ചു[a]; രോഗികളായ എല്ലാവരെയും അവന്റെ അടുക്കൽ കൊണ്ടുവന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “ചുറ്റുമുള്ള ആ പ്രദേശത്തെല്ലാം അയച്ചു”; എന്താണ് അഥവാ ആരെയാണ് അയച്ചതെന്ന് ഗ്രീക്കിൽ വ്യക്തമാക്കിയിട്ടില്ല. സന്ദേശമോ ദൂതന്മാരെയോ അയച്ചു എന്നായിരിക്കാം അർത്ഥം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “മോശമായ അവസ്ഥയിൽ ഉണ്ടായിരുന്ന എല്ലാവരെയും”; രോഗികളെയോ അസുഖബാധിതരെയോ സൂചിപ്പിക്കുന്ന ഒരു പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνόντες
  choice: തിരിച്ചറിഞ്ഞപ്പോൾ
  rationale: സന്ദർഭത്തിൽ യേശുവിനെ കണ്ടറിഞ്ഞത് സൂചിപ്പിക്കുന്ന ഭൂതകാല കൃതന്തത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: οἱ ἄνδρες τοῦ τόπου ἐκείνου
  choice: ആ സ്ഥലത്തെ പുരുഷന്മാർ
  rationale: ἀνήρ എന്ന പദത്തിന്റെ പുരുഷലിംഗസൂചന നിലനിർത്തുകയും τόπος എന്നത് പ്രാദേശികമായ ‘സ്ഥലം’ ആയി നൽകുകയും ചെയ്യുന്നു.
- source_word: ἀπέστειλαν εἰς ὅλην τὴν περίχωρον ἐκείνην
  choice: ചുറ്റുമുള്ള ആ പ്രദേശത്തെല്ലാം ആളയച്ചു
  rationale: ഗ്രീക്കിൽ അയച്ചതിന്റെ കർമം വ്യക്തമല്ല. മലയാളത്തിൽ ‘ആളയച്ചു’ സന്ദേശവാഹകരെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക പ്രയോഗമാണ്; എന്നാൽ കർമം ഗ്രീക്കിൽ അന്തർലീനമാണെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: προσήνεγκαν αὐτῷ
  choice: അവന്റെ അടുക്കൽ കൊണ്ടുവന്നു
  rationale: വ്യക്തികളെ യേശുവിന്റെ അടുത്തേക്ക് കൊണ്ടുവരുന്നതാണ് ഇവിടെ അർത്ഥം; യാഗാർപ്പണത്തിന്റെ അർത്ഥമില്ല.
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: രോഗികളായ എല്ലാവരെയും
  rationale: ‘മോശമായ അവസ്ഥയിൽ ഇരിക്കുക’ എന്ന ഗ്രീക്ക് ശൈലി രോഗികളായിരിക്കുക എന്ന അർത്ഥത്തിലാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
