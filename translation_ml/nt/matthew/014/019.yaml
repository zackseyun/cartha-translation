  to: പിന്നെ ജനക്കൂട്ടങ്ങളോട് പുല്ലിന്മേൽ ചാരിയിരിക്കാൻ കൽപിച്ചശേഷം, അവൻ ആ അഞ്ച് അപ്പവും രണ്ട് മീനും എടുത്ത് സ്വർഗത്തിലേക്ക് നോക്കി അനുഗ്രഹിച്ചു[a]. അപ്പങ്ങൾ നുറുക്കിയശേഷം അവൻ അവ ശിഷ്യന്മാർക്കു കൊടുത്തു; ശിഷ്യന്മാർ ജനക്കൂട്ടങ്ങൾക്കു കൊടുത്തു.
