id: MAT.14.19
reference: Matthew 14:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ κελεύσας τοὺς ὄχλους ἀνακλιθῆναι ἐπὶ ⸂τοῦ χόρτου⸃, λαβὼν τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας, ἀναβλέψας εἰς τὸν οὐρανὸν εὐλόγησεν καὶ κλάσας ἔδωκεν τοῖς μαθηταῖς τοὺς ἄρτους οἱ δὲ μαθηταὶ τοῖς ὄχλοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/019.yaml
  text: And after ordering the crowds to recline on the grass[a], he took the five loaves and the two fish, looked up to heaven, blessed, and after breaking the loaves he gave them to the disciples, and the disciples to the crowds.
translation:
  language: ml
  text: പിന്നെ ജനക്കൂട്ടങ്ങളോട് പുല്ലിന്മേൽ ചാരിയിരിക്കാൻ കൽപിച്ചശേഷം, അവൻ ആ അഞ്ച് അപ്പവും രണ്ട് മീനും എടുത്ത് സ്വർഗത്തിലേക്ക് നോക്കി അനുഗ്രഹിച്ചു[a]. അപ്പങ്ങൾ നുറുക്കിയശേഷം അവൻ അവ ശിഷ്യന്മാർക്കു കൊടുത്തു; ശിഷ്യന്മാർ ജനക്കൂട്ടങ്ങൾക്കു കൊടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദൈവത്തെ വാഴ്ത്തി’ / ‘അനുഗ്രഹവചനം ചൊല്ലി.’ ഗ്രീക്കിൽ ‘അനുഗ്രഹിച്ചു’ എന്നു മാത്രമേ പറയുന്നുള്ളൂ; അതിന്റെ കർമം വ്യക്തമാക്കിയിട്ടില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: κελεύσας
  choice: കല്പിച്ചശേഷം
  rationale: ആജ്ഞയുടെ ശക്തിയും മുഖ്യപ്രവൃത്തിക്ക് മുമ്പുള്ള ക്രമവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀνακλιθῆναι
  choice: ഭക്ഷണത്തിനിരിക്കാൻ
  rationale: ഭക്ഷണത്തിനായി ചാരിക്കിടക്കുന്ന പുരാതന പതിവാണ് ക്രിയ സൂചിപ്പിക്കുന്നത്; അക്ഷരാർഥത്തിലുള്ള ‘ചാരിക്കിടക്കുക’ സാധാരണ മലയാളത്തിൽ തെറ്റിദ്ധാരണയ്ക്കിടയാക്കുന്നതിനാൽ ഭക്ഷണസന്ദർഭം വ്യക്തമാക്കി.
- source_word: ἐπὶ τοῦ χόρτου
  choice: പുല്ലിന്മേൽ
  rationale: സ്ഥലം നേരിട്ട് സൂചിപ്പിക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘പച്ച’ എന്ന വിശേഷണം ചേർക്കുന്നില്ല.
- source_word: ἄρτους
  choice: അപ്പങ്ങൾ
  rationale: ഈ ഭക്ഷണസന്ദർഭത്തിൽ ἄρτοι അപ്പങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാള ബൈബിൾ ഭാഷയിലും സാധാരണ വായനയിലും സ്വാഭാവികം.
- source_word: ἰχθύας
  choice: മീൻ
  rationale: എണ്ണത്തിന് ശേഷം മലയാളത്തിൽ ഏകവചനരൂപം സ്വാഭാവികമായതിനാൽ ‘രണ്ട് മീൻ’ എന്നു നൽകി.
- source_word: ἀναβλέψας εἰς τὸν οὐρανόν
  choice: സ്വർഗത്തിലേക്ക് നോക്കി
  rationale: ദിശയും പ്രവൃത്തിയും ലളിതമായ ആധുനിക മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: εὐλόγησεν
  choice: അനുഗ്രഹിച്ചു
  rationale: ഗ്രീക്കിലെ ക്രിയയെ നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു; കർമം മൂലത്തിൽ വ്യക്തമാക്കിയിട്ടില്ലാത്തതിനാൽ മലയാളത്തിലും ചേർത്തിട്ടില്ല.
- source_word: κλάσας
  choice: അപ്പങ്ങൾ നുറുക്കിയശേഷം
  rationale: കൊടുക്കുന്നതിന് മുമ്പുള്ള പ്രവൃത്തിക്രമം സംരക്ഷിക്കുകയും സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്ന കർമം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: οἱ δὲ μαθηταὶ τοῖς ὄχλοις
  choice: ശിഷ്യന്മാർ ജനക്കൂട്ടങ്ങൾക്കും കൊടുത്തു
  rationale: ഗ്രീക്കിൽ മുൻവാക്യത്തിൽനിന്ന് മനസ്സിലാക്കുന്ന ‘കൊടുത്തു’ എന്ന ക്രിയ മലയാളത്തിലെ വ്യക്തതയ്ക്കായി ആവർത്തിച്ചു.
theological_decisions:
- issue: εὐλόγησεν എന്നതിന്റെ വ്യക്തമാക്കാത്ത കർമം
  choice: ‘അനുഗ്രഹിച്ചു’ എന്ന് കർമമില്ലാതെ നിലനിർത്തി
  alternative: ‘ദൈവത്തെ വാഴ്ത്തി’ / ‘അനുഗ്രഹവചനം ചൊല്ലി’ / അപ്പവും മീനും ‘അനുഗ്രഹിച്ചു’
  rationale: ഗ്രീക്ക് വാചകം ആരെയോ എന്തിനെയോ അനുഗ്രഹിച്ചു എന്ന് വ്യക്തമാക്കുന്നില്ല. ഒരു വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ ഉറപ്പിക്കാതെ യഥാർഥമായ അനിശ്ചിതത്വം നിലനിർത്തി, സാധ്യതകൾ അടിക്കുറിപ്പിൽ അറിയിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. പുരാതന ഭക്ഷണഭാവം കൃത്രിമമായി തോന്നാതിരിക്കാൻ ἀνακλιθῆναι ‘ഭക്ഷണത്തിനിരിക്കാൻ’ എന്നു വിവർത്തനം ചെയ്തു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ‘അനുഗ്രഹിച്ചു’ എന്ന പദത്തിനരികിൽ ചേർത്തു.
