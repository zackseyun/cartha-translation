id: MAT.14.12
reference: Matthew 14:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ προσελθόντες οἱ μαθηταὶ αὐτοῦ ἦραν τὸ ⸀πτῶμα καὶ ἔθαψαν ⸀αὐτόν, καὶ ἐλθόντες ἀπήγγειλαν τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/012.yaml
  text: And his disciples came[a], took the body, and buried him; then they went and reported it to Jesus.
translation:
  language: ml
  text: അവന്റെ ശിഷ്യന്മാർ വന്ന് മൃതദേഹം[a] എടുത്ത് അവനെ അടക്കം ചെയ്തു. പിന്നെ അവർ യേശുവിന്റെ അടുക്കൽ ചെന്ന് വിവരം അറിയിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ശവം’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദം മരിച്ച ശരീരത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: വന്ന്
  rationale: സന്ദർഭത്തിൽ ശിഷ്യന്മാർ അടുത്തെത്തി തുടർന്നുള്ള പ്രവൃത്തി ചെയ്തതിനെ സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലിയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: μαθηταὶ αὐτοῦ
  choice: അവന്റെ ശിഷ്യന്മാർ
  rationale: μαθηταί എന്ന ബന്ധപരവും പഠനപരവുമായ ആശയം ‘ശിഷ്യന്മാർ’ നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ ‘അവന്റെ’ എന്നത് യോഹന്നാനെ സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിലെ സർവനാമരൂപവും ഇതിലൂടെ സംരക്ഷിക്കുന്നു.
- source_word: ἦραν
  choice: എടുത്ത്
  rationale: αἴρω എന്ന പദത്തിന്റെ ‘എടുക്കുക/ഉയർത്തുക’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; ‘കൊണ്ടുപോയി’ എന്നു ചേർത്താൽ മൂലത്തിൽ വ്യക്തമാക്കാത്ത ചലനം കൂടുതൽ വ്യാഖ്യാനിക്കപ്പെടും.
- source_word: πτῶμα
  choice: മൃതദേശം
  rationale: മരിച്ച ശരീരത്തെ സൂചിപ്പിക്കുന്ന πτῶμα എന്ന പദത്തിന് മാന്യവും വ്യക്തവും ആധുനികവുമായ മലയാളപ്രയോഗമാണിത്.
- source_word: ἔθαψαν αὐτόν
  choice: അവനെ അടക്കം ചെയ്തു
  rationale: θάπτω എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘അടക്കം ചെയ്യുക’ നൽകുന്നു; കല്ലറയെക്കുറിച്ചുള്ള മൂലത്തിൽ പറയാത്ത വിശദാംശം ചേർക്കുന്നില്ല.
- source_word: ἐλθόντες
  choice: പിന്നെ അവർ ... അടുക്കൽ ചെന്ന്
  rationale: അടുത്ത പ്രവൃത്തിയിലേക്കുള്ള ക്രമവും യേശുവിന്റെ അടുത്തേക്കുള്ള നീക്കവും മലയാളത്തിൽ സ്വാഭാവികമായ സമാപകക്രിയയായി വ്യക്തമാക്കുന്നു.
- source_word: ἀπήγγειλαν
  choice: വിവരം അറിയിച്ചു
  rationale: ἀπαγγέλλω എന്നതിലെ റിപ്പോർട്ട് ചെയ്യുക/അറിയിക്കുക എന്ന ആശയം നൽകുന്നു. അറിയിച്ച കാര്യത്തിന്റെ ഉള്ളടക്കം സന്ദർഭത്തിൽനിന്ന് മനസ്സിലാകുന്നതിനാൽ അത് പ്രത്യേകം വിശദീകരിക്കുന്നില്ല.
- source_word: τῷ Ἰησοῦ
  choice: യേശുവിന്റെ അടുക്കൽ
  rationale: Ἰησοῦς എന്ന പേരിന്റെ സ്ഥാപിത മലയാളരൂപമായ ‘യേശു’ ഉപയോഗിക്കുകയും ദത്തിവ് സൂചിപ്പിക്കുന്ന സ്വീകർത്താവിനെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘അവന്റെ ശിഷ്യന്മാർ’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: സന്ദർഭത്തിൽ യോഹന്നാൻ സ്നാപകന്റെ ശിഷ്യന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്; പാഠത്തിൽ ‘അവന്റെ ശിഷ്യന്മാർ’ എന്നു നിലനിർത്തുന്നു.
  alternative: യേശുവിന്റെ ശിഷ്യന്മാർ; അല്ലെങ്കിൽ വ്യക്തതയ്ക്കായി പാഠത്തിൽ നേരിട്ട് ‘യോഹന്നാന്റെ ശിഷ്യന്മാർ’ എന്നു നൽകുക.
  rationale: തൊട്ടുമുമ്പുള്ള സന്ദർഭം യോഹന്നാന്റെ മരണത്തെക്കുറിച്ചായതിനാൽ αὐτοῦ സ്വാഭാവികമായി യോഹന്നാനെ സൂചിപ്പിക്കുന്നു. അതേസമയം ഗ്രീക്കിലെ സർവനാമം അനാവശ്യമായി പേരാക്കി മാറ്റാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ആഖ്യാനമലയാളം. ‘മൃതദേശം’, ‘അടക്കം ചെയ്തു’, ‘വിവരം അറിയിച്ചു’ എന്നീ പ്രയോഗങ്ങൾ കൃത്യതയും സ്വാഭാവികതയും സമന്വയിപ്പിക്കുന്നു.
