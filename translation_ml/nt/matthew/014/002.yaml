reference: Matthew 14:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἶπεν τοῖς παισὶν αὐτοῦ· Οὗτός ἐστιν Ἰωάννης ὁ βαπτιστής· αὐτὸς ἠγέρθη ἀπὸ τῶν νεκρῶν, καὶ διὰ τοῦτο αἱ δυνάμεις ἐνεργοῦσιν ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/002.yaml
  text: And he said to his servants[a], “This is John the Baptist. He has been raised from the dead, and for this reason these powers are at work in him.”
translation:
  language: ml
  text: 'അവൻ തന്റെ പരിചാരകരോടു പറഞ്ഞു: “ഇവൻ സ്നാപകനായ യോഹന്നാനാണ്. അവൻ മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നു. അതുകൊണ്ടാണ് ഈ ശക്തികൾ[a] അവനിൽ പ്രവർത്തിക്കുന്നത്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഈ അത്ഭുതശക്തികൾ.” കൂടുതൽ വ്യാഖ്യാനാത്മകമായി, “ഈ അത്ഭുതങ്ങൾ.” ഗ്രീക്കിൽ “ശക്തികൾ” (αἱ δυνάμεις) എന്നാണ്; മഹത്തായ പ്രവൃത്തികളിൽ പ്രകടമാകുന്ന അമാനുഷിക ശക്തിയെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: παισὶν
  choice: പരിചാരകരോട്
  rationale: παῖς എന്നതിന് സന്ദർഭാനുസരണം കുട്ടി, ദാസൻ, പരിചാരകൻ എന്നീ അർഥങ്ങൾ വരാം. ഇവിടെ ഹെരോദാവിന്റെ വീട്ടിലോ കൊട്ടാരത്തിലോ സേവിക്കുന്നവരെയാണ് ഉദ്ദേശിക്കുന്നത്; ‘പരിചാരകർ’ സാമൂഹികബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു, പദവിയെ അനാവശ്യമായി കൃത്യമാക്കുന്നില്ല.
- source_word: ὁ βαπτιστής
  choice: സ്നാപകനായ
  rationale: യോഹന്നാന്റെ അറിയപ്പെടുന്ന വിശേഷണത്തെ മാന്യവും പ്രചാരത്തിലുള്ളതുമായ മലയാളരൂപത്തിൽ നൽകുന്നു; ക്രിയാത്മകമായ ‘സ്നാനം കഴിപ്പിക്കുന്നവൻ’ എന്ന ദീർഘരൂപം ഒഴിവാക്കുന്നു.
- source_word: ἠγέρθη
  choice: ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: ἐγείρω എന്ന ക്രിയയുടെ aorist passive രൂപം സംരക്ഷിച്ച്, യോഹന്നാൻ സ്വയം ഉയിർത്തെഴുന്നേറ്റു എന്ന സൂചന ഒഴിവാക്കുന്നു. മലയാളത്തിൽ സംഭവത്തിന്റെ ഇപ്പോഴുള്ള ഫലവും സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: ἀπὸ τῶν νεκρῶν
  choice: മരിച്ചവരിൽനിന്ന്
  rationale: ബഹുവചനമായ τῶν νεκρῶν എന്നതിന്റെ ‘മരിച്ചവരുടെ ഇടയിൽനിന്ന്’ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: διὰ τοῦτο
  choice: അതുകൊണ്ടാണ്
  rationale: മുൻവാക്യത്തെ തുടർന്നുള്ള കാരണനിഗമനം വ്യക്തമായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: αἱ δυνάμεις
  choice: ഈ ശക്തികൾ
  rationale: δύναμις എന്ന നാമത്തിന്റെ ‘ശക്തി’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ അത്ഭുതപ്രവൃത്തികളായി വെളിപ്പെടുന്ന അമാനുഷിക ശക്തികളെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിലും, മുഖ്യപാഠത്തിൽ അതിനെ നേരിട്ട് ‘അത്ഭുതങ്ങൾ’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: ἐνεργοῦσιν
  choice: പ്രവർത്തിക്കുന്നത്
  rationale: ἐνεργέω സൂചിപ്പിക്കുന്ന സജീവവും ഫലപ്രദവുമായ പ്രവർത്തനത്തെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐν αὐτῷ
  choice: അവനിൽ
  rationale: ἐν എന്ന ഉപസർഗത്തിന്റെ നേരിട്ടുള്ള സ്ഥല/വ്യാപ്തി അർഥം സംരക്ഷിക്കുന്നു; ‘അവനിലൂടെ’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ രൂപം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: യോഹന്നാന്റെ ഉയിർപ്പിന്റെ സ്വഭാവം
  choice: അവൻ മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നു
  alternative: അവൻ മരിച്ചവരിൽനിന്ന് ഉയിർത്തെഴുന്നേറ്റിരിക്കുന്നു
  rationale: ഗ്രീക്കിലെ passive രൂപമായ ἠγέρθη സംരക്ഷിക്കുന്നു. ഇത് പ്രവർത്തകനെ വ്യക്തമാക്കാതെ ദൈവിക passive ആയിരിക്കാവുന്ന വ്യാകരണസൂചന നിലനിർത്തുന്നു; ഹെരോദാവിന്റെ വാക്കുകൾക്കപ്പുറം ഒരു സിദ്ധാന്തനിഗമനവും ചേർക്കുന്നില്ല.
- issue: δυνάμεις എന്നതിന്റെ സന്ദർഭാർഥം
  choice: ഈ ശക്തികൾ അവനിൽ പ്രവർത്തിക്കുന്നത്
  alternative: ഈ അത്ഭുതശക്തികൾ അവനിൽ പ്രവർത്തിക്കുന്നത് / അത്ഭുതങ്ങൾ അവനിലൂടെ നടക്കുന്നത്
  rationale: സന്ദർഭത്തിൽ അത്ഭുതകരമായ ശക്തിപ്രകടനമാണ് ഉദ്ദേശ്യമെങ്കിലും, ‘ശക്തികൾ’ എന്ന മുഖ്യപരിഭാഷ ഗ്രീക്കിലെ നാമത്തിന്റെ രൂപവും ആശയപരമായ തുറന്ന നിലയും സംരക്ഷിക്കുന്നു. അടിക്കുറിപ്പ് സാധ്യതയുള്ള വ്യാഖ്യാനം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഹെരോദാവിന്റെ വാക്കുകളുടെ നേരിട്ടുള്ള സ്വഭാവം നിലനിർത്തി. ‘ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നു’ എന്ന passive രൂപവും ‘അവനിൽ’ എന്ന നേരിട്ടുള്ള ഉപസർഗാർഥവും സംരക്ഷിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ‘ശക്തികൾ’ എന്ന പദത്തിനു പിന്നാലെ വെച്ചു.
