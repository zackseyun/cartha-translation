id: MAT.14.6
reference: Matthew 14:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂γενεσίοις δὲ γενομένοις⸃ τοῦ Ἡρῴδου ὠρχήσατο ἡ θυγάτηρ τῆς Ἡρῳδιάδος ἐν τῷ μέσῳ καὶ ἤρεσεν τῷ Ἡρῴδῃ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/006.yaml
  text: But when Herod’s birthday came[a], the daughter of Herodias danced in the midst and pleased Herod[b],
translation:
  language: ml
  text: എന്നാൽ ഹെരോദാവിന്റെ ജന്മദിനാഘോഷം വന്നപ്പോൾ[a], ഹെരോദ്യയുടെ മകൾ നടുവിൽ നൃത്തം ചെയ്ത്[b] ഹെരോദാവിനെ പ്രസാദിപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഹെരോദാവിന്റെ ജന്മദിനം വന്നപ്പോൾ’ അല്ലെങ്കിൽ ‘ഹെരോദാവിന്റെ ജന്മദിനവിരുന്നിൽ.’ ഗ്രീക്ക് പ്രയോഗം ഹെരോദാവിന്റെ ജന്മദിനാചരണത്തിന്റെ അവസരത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം, ‘മധ്യത്തിൽ’ അല്ലെങ്കിൽ ‘നടുവിൽ.’ സന്ദർഭത്തിൽ ഇത് ആഘോഷത്തിനായി കൂടിയിരുന്നവരുടെ മധ്യത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενεσίοις ... γενομένοις
  choice: ഹെരോദാവിന്റെ ജന്മദിനാഘോഷം വന്നപ്പോൾ
  rationale: γενέσια എന്നത് ഇവിടെ വെറും കലണ്ടർ തീയതിയെയല്ല, ജന്മദിനാചരണത്തിന്റെ അവസരത്തെയാണ് സൂചിപ്പിക്കുന്നത്. γενομένοις ചേർന്ന കാലസൂചക പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി ‘വന്നപ്പോൾ’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിൽനിന്നുള്ള കഥാഗതിയിലെ മാറ്റവും നേരിയ വൈരുധ്യഭാവവും നിലനിർത്തുന്നു.
- source_word: ὠρχήσατο
  choice: നൃത്തം ചെയ്ത്
  rationale: ക്രിയയുടെ ലളിതമായ അർഥം ‘നൃത്തം ചെയ്തു’ എന്നതാണ്; പ്രകടനത്തിന്റെ സ്വഭാവത്തെക്കുറിച്ച് പാഠത്തിൽ ഇല്ലാത്ത വിശദാംശം ചേർക്കുന്നില്ല.
- source_word: ἡ θυγάτηρ τῆς Ἡρῳδιάδος
  choice: ഹെരോദ്യയുടെ മകൾ
  rationale: ഗ്രീക്കിലെ ബന്ധം നേരിട്ട് നൽകുന്നു; പാഠത്തിൽ പറയാത്ത പരമ്പരാഗത പേരൊന്നും ചേർക്കുന്നില്ല.
- source_word: ἐν τῷ μέσῳ
  choice: കൂടിവന്നവരുടെ നടുവിൽ
  rationale: അക്ഷരാർഥം ‘നടുവിൽ’ എന്നാണ്. സന്ദർഭത്തിൽ അത് ആഘോഷത്തിനായി കൂടിയിരുന്നവരുടെ മധ്യത്തിൽ എന്നർഥമാക്കുന്നതിനാൽ, മലയാളത്തിൽ ഗ്രഹിക്കാൻ ആവശ്യമായ സൂചന പരിമിതമായി വ്യക്തമാക്കിയിരിക്കുന്നു; അടിക്കുറിപ്പിൽ അക്ഷരാർഥം സംരക്ഷിക്കുന്നു.
- source_word: ἤρεσεν τῷ Ἡρῴδῃ
  choice: ഹെരോദാവിനെ പ്രസാദിപ്പിച്ചു
  rationale: ἀρέσκω ദത്തിവിനോടുകൂടെ ‘പ്രസാദിപ്പിക്കുക’ എന്നാണ്; അലങ്കാരമില്ലാതെ സ്വാഭാവികമായ മലയാളം നൽകുന്നു.
- source_word: Ἡρῴδου / Ἡρῴδῃ
  choice: ഹെരോദാവ്
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ബൈബിൾ ലിപ്യന്തരണം ഉപയോഗിച്ചു.
