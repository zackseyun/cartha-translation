id: MAT.14.21
reference: Matthew 14:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ ἐσθίοντες ἦσαν ἄνδρες ὡσεὶ πεντακισχίλιοι χωρὶς γυναικῶν καὶ παιδίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/021.yaml
  text: Those who ate were about five thousand men[a], besides women and children.
translation:
  language: ml
  text: ഭക്ഷിച്ചവർ ഏകദേശം അയ്യായിരം പുരുഷന്മാരായിരുന്നു,[a] സ്ത്രീകളെയും കുട്ടികളെയും കണക്കിൽപ്പെടുത്താതെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സ്ത്രീകളെയും കുട്ടികളെയും ഒഴികെ.”
    reason: χωρὶς എന്ന പദത്തിന്റെ ‘വേർതിരിച്ച്/ഒഴിവാക്കി’ എന്ന ആശയം പ്രകടിപ്പിക്കുന്ന മറ്റൊരു വിവർത്തനം.
lexical_decisions:
- source_word: οἱ δὲ ἐσθίοντες
  choice: ഭക്ഷിച്ചവർ
  rationale: വർത്തമാനകാല കൃതന്തം നാമപദമായി പ്രവർത്തിച്ച് ഭക്ഷണത്തിൽ പങ്കെടുത്തവരെ സൂചിപ്പിക്കുന്നു. ‘ഭക്ഷിച്ചവർ’ മലയാളത്തിൽ സ്വാഭാവികമാണ്; δέയുടെ ലഘുവായ ആഖ്യാനബന്ധം പ്രത്യേകം പദമാക്കി അതിവിവർത്തനം ചെയ്തിട്ടില്ല.
- source_word: ἦσαν
  choice: ആയിരുന്നു
  rationale: εἰμίയുടെ അപൂർണഭൂതകാലരൂപം ഇവിടെ എണ്ണത്തെക്കുറിച്ചുള്ള ലളിതമായ പ്രസ്താവനയാണ്; ‘ആയിരുന്നു’ അതിന്റെ സ്വാഭാവിക മലയാളസമാനമാണ്.
- source_word: ἄνδρες
  choice: പുരുഷന്മാർ
  rationale: ഈ പദം പൊതുവായി ആളുകളെയല്ല, പുരുഷലിംഗത്തിലുള്ള വ്യക്തികളെയാണ് സൂചിപ്പിക്കുന്നത്; സ്ത്രീകളെയും കുട്ടികളെയും തുടർന്ന് പ്രത്യേകം പറയുന്നതിനാൽ ആ വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: ὡσεὶ
  choice: ഏകദേശം
  rationale: സംഖ്യ കൃത്യമല്ല, ഏകദേശമാണെന്ന് സൂചിപ്പിക്കുന്നു.
- source_word: πεντακισχίλιοι
  choice: അയ്യായിരം
  rationale: ഗ്രീക്ക് സംഖ്യയുടെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: χωρὶς
  choice: കൂടാതെ
  rationale: സ്ത്രീകളും കുട്ടികളും പറഞ്ഞ അയ്യായിരത്തിന്റെ കണക്കിൽ ഉൾപ്പെട്ടിട്ടില്ലെന്ന വേർതിരിവ് ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: γυναικῶν
  choice: സ്ത്രീകളെ
  rationale: ഇവിടെ വിവാഹബന്ധം സൂചിപ്പിക്കുന്നില്ല; അതിനാൽ ‘ഭാര്യമാർ’ എന്നതിലുപരി ‘സ്ത്രീകൾ’ യോജിക്കുന്നു.
- source_word: παιδίων
  choice: കുട്ടികളെ
  rationale: പ്രായം അനാവശ്യമായി ചുരുക്കാതെ παιδίον എന്നതിന്റെ സാധാരണ അർഥം നൽകുന്നു.
theological_decisions:
- issue: സ്ത്രീകളും കുട്ടികളും ഉൾപ്പെട്ട ജനക്കൂട്ടത്തിൽ ലിംഗനിർദ്ദിഷ്ടമായ എണ്ണൽപദം
  choice: ἄνδρες എന്നത് ‘പുരുഷന്മാർ’ എന്നു വിവർത്തനം ചെയ്ത് സ്ത്രീകളെയും കുട്ടികളെയും കണക്കിൽനിന്ന് വേർതിരിക്കുന്ന വാക്യഭാഗം നിലനിർത്തി.
  alternative: ‘ആളുകൾ’ അല്ലെങ്കിൽ ‘വ്യക്തികൾ’ എന്നു വിവർത്തനം ചെയ്യുക.
  rationale: ഗ്രീക്ക് പാഠം പുരുഷന്മാരെ പ്രത്യേകമായി എണ്ണുകയും സ്ത്രീകളെയും കുട്ടികളെയും വേർതിരിച്ച് പറയുകയും ചെയ്യുന്നു. ‘ആളുകൾ’ എന്നു നൽകിയാൽ ഈ പദസൂക്ഷ്മത നഷ്ടപ്പെടും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ ഏകദേശസംഖ്യയും പുരുഷന്മാർ, സ്ത്രീകൾ, കുട്ടികൾ എന്ന വ്യക്തമായ വേർതിരിവും നിലനിർത്തി.
