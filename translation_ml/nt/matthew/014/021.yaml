    issue: ‘കൂടാതെ’ does not clearly convey exclusion from the numerical count.
    rationale: In Malayalam, ‘X-നെയും കൂടാതെ’ often means ‘in addition to X.’ The Greek χωρὶς γυναικῶν καὶ παιδίων specifies that women and children are not included in the five-thousand figure. ‘കണക്കിൽപ്പെടുത്താതെ’ makes this explicit.
