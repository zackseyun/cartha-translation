  text: And he sent and beheaded John in the prison[a].
translation:
  language: ml
  text: അവൻ ആളയച്ച് തടവറയിൽ വച്ച് യോഹന്നാന്റെ തല വെട്ടിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: ‘അയച്ചിട്ട് അവൻ തടവറയിൽ വച്ച് യോഹന്നാന്റെ തല വെട്ടി.’ ഗ്രീക്കിൽ ആഒറിസ്റ്റ് പങ്കുപദത്തിനു പിന്നാലെ മുഖ്യക്രിയ വരുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: അവൻ
  rationale: വാക്യം മുൻവിവരണത്തിന്റെ തുടർച്ചയായതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ ആഖ്യാനത്തിനായി καί വേറിട്ട് ‘പിന്നെ’ എന്നു പരിഭാഷപ്പെടുത്താതെ കർത്താവിനോടൊപ്പം വാക്യം തുടരുന്നു.
- source_word: πέμψας
  choice: ആളയച്ച്
  rationale: πέμπω എന്ന ക്രിയയുടെ aorist participle ഇവിടെ ഒരാളെ അയച്ചതിനെ സൂചിപ്പിക്കുന്നു. ‘ആളയച്ച്’ എന്നത് ഹെരോദാവ് നേരിട്ട് വധം നടത്തിയതല്ല, നിയോഗിച്ച ആളിലൂടെയാണ് നടത്തിയതെന്ന സൂചന സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἀπεκεφάλισεν
  choice: തല വെട്ടിച്ചു
  rationale: ἀποκεφαλίζω എന്നത് തല വെട്ടിക്കളയുക എന്ന പ്രത്യേക അർഥമുള്ള ക്രിയയാണ്. causative ആയ ‘വെട്ടിച്ചു’ ഗ്രീക്കിൽ പ്രവൃത്തി കർത്താവിന് ആരോപിക്കപ്പെടുന്നതും, മുൻപുള്ള ‘ആളയച്ച്’ സൂചിപ്പിക്കുന്ന പരോക്ഷ നിർവഹണവും സ്വാഭാവിക മലയാളത്തിൽ ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: τὸν Ἰωάννην
  choice: യോഹന്നാന്റെ
  rationale: മലയാളത്തിലെ ‘തല വെട്ടിച്ചു’ എന്ന സ്വാഭാവിക ഘടനയിൽ വ്യക്തിയെ സംബന്ധികാവിഭക്തിയിൽ നൽകുന്നു. സന്ദർഭം വ്യക്തമായതിനാൽ മൂലപാഠത്തിലില്ലാത്ത ‘സ്നാപകൻ’ ചേർത്തിട്ടില്ല.
- source_word: ἐν τῇ φυλακῇ
  choice: തടവറയിൽവെച്ച്
  rationale: φυλακή ഇവിടെ തടവിലാക്കുന്ന സ്ഥലത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘തടവറയിൽവെച്ച്’ സംഭവത്തിന്റെ സ്ഥലസൂചന വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: ഹെരോദാവിന്റെ പ്രവർത്തക ഉത്തരവാദിത്വവും വധത്തിന്റെ പരോക്ഷ നിർവഹണവും
  choice: ‘ആളയച്ച് ... തല വെട്ടിച്ചു’
  alternative: ‘ആളയച്ച് ... തല വെട്ടി’
  rationale: ഗ്രീക്ക് മുഖ്യക്രിയ പ്രവൃത്തിയെ കർത്താവിനോട് ബന്ധിപ്പിക്കുമ്പോഴും πέμψας മറ്റൊരാളെ അയച്ചതിനെ സൂചിപ്പിക്കുന്നു. മലയാള causative രൂപം ഹെരോദാവിന്റെ ഉത്തരവാദിത്വം ഇല്ലാതാക്കാതെ നിർവഹണം പ്രതിനിധിയിലൂടെയായിരുന്നുവെന്ന സൂചന സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ശിരഛേദം ചെയ്തു’ എന്ന ഔപചാരിക പ്രയോഗത്തേക്കാൾ സാധാരണ വായനക്കാർക്ക് നേരിട്ട് മനസ്സിലാകുന്ന ‘തല വെട്ടിച്ചു’ തിരഞ്ഞെടുത്തു; എന്നാൽ സംസാരഭാഷാപരമായ ലാഘവം ഒഴിവാക്കി.
