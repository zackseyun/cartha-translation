  terminology: “കഷണങ്ങൾ” is an appropriate rendering of κλάσματα. Since the Greek term can specifically denote broken pieces/fragments, a brief lexical footnote is suitable. “കൊട്ട” appropriately renders κόφινος without unwarranted specification.
