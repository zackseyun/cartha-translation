  text: καὶ ἔφαγον πάντες καὶ ἐχορτάσθησαν, καὶ ἦραν τὸ περισσεῦον τῶν κλασμάτων δώδεκα κοφίνους πλήρεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/020.yaml
  text: And they all ate and were satisfied[a], and they picked up twelve full baskets of the leftover pieces.
translation:
  language: ml
  text: എല്ലാവരും ഭക്ഷിച്ചു തൃപ്തരായി; ശേഷിച്ച കഷണങ്ങൾ[a] പന്ത്രണ്ട് കൊട്ട നിറയെ അവർ പെറുക്കിയെടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പൊട്ടിയ കഷണങ്ങൾ” അല്ലെങ്കിൽ “ശകലങ്ങൾ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφαγον
  choice: ഭക്ഷിച്ചു
  rationale: ആഖ്യാനക്രമത്തിലുള്ള aorist ക്രിയയെ സ്വാഭാവികമായ ലളിതഭൂതകാലത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: πάντες
  choice: എല്ലാവരും
  rationale: ജനക്കൂട്ടത്തെ മുഴുവനായി ഉൾക്കൊള്ളുന്ന സർവവ്യാപക അർഥം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἐχορτάσθησαν
  choice: തൃപ്തരായി
  rationale: വയറുനിറയെ ഭക്ഷിച്ച് മതിയായെന്ന χορτάζω എന്ന ക്രിയയുടെ സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἦραν
  choice: പെറുക്കിയെടുത്തു
  rationale: ശേഷിച്ച കഷണങ്ങൾ എടുത്തുകൂട്ടുന്ന സന്ദർഭത്തിൽ αἴρω എന്നതിന്റെ സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: τὸ περισσεῦον τῶν κλασμάτων
  choice: ശേഷിച്ച അപ്പക്കഷണങ്ങൾ
  rationale: ശേഷിച്ചവ എന്ന കൂട്ടാർഥവും κλάσματα എന്ന പൊട്ടിച്ച കഷണങ്ങളുടെ അർഥവും വ്യക്തമാക്കുന്നു; സന്ദർഭത്തിൽ ഇവ അപ്പത്തിന്റെ കഷണങ്ങളാണ്.
- source_word: δώδεκα κοφίνους πλήρεις
  choice: പന്ത്രണ്ട് കൊട്ട നിറയെ
  rationale: കൊട്ടകളുടെ എണ്ണവും അവ നിറഞ്ഞിരുന്നതും സ്വാഭാവിക മലയാളക്രമത്തിൽ കൃത്യമായി നൽകുന്നു.
theological_decisions:
- issue: അത്ഭുതഭക്ഷണത്തിന്റെ ഫലം സാധാരണ പൂർണതൃപ്തിയുടെ ഭാഷയിൽ വിവരിക്കുന്നത്
  choice: തൃപ്തരായി
  alternative: വയറുനിറഞ്ഞു
  rationale: ഗ്രീക്കിലെ പൂർണമായി ഭക്ഷണം ലഭിച്ചെന്ന അർഥം നിലനിർത്തുകയും അത്ഭുതത്തെക്കുറിച്ച് വാചകത്തിൽ ഇല്ലാത്ത വ്യാഖ്യാനഭാഷ ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അപ്പക്കഷണങ്ങൾ’ സന്ദർഭം വ്യക്തമാക്കുന്നു; ‘പെറുക്കിയെടുത്തു’ ശേഷിപ്പുകൾ ശേഖരിക്കുന്ന പ്രവർത്തിയെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
