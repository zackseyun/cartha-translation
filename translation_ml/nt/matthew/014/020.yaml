  - severity: low
    issue: The existing footnote proposes a syntactic alternative not needed by the source and is not anchored to the lexical item it discusses.
    rationale: The Greek syntax is straightforward. A footnote on κλάσματα as ‘broken pieces/fragments’ better reflects the English audit trail and the relevant source ambiguity.
