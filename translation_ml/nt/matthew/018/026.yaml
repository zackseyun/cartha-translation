id: MAT.18.26
reference: Matthew 18:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πεσὼν οὖν ὁ δοῦλος προσεκύνει αὐτῷ λέγων· ⸀Μακροθύμησον ἐπ’ ⸀ἐμοί, καὶ πάντα ⸂ἀποδώσω σοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/026.yaml
  text: So the servant fell down before him and kept pleading[a], saying, ‘Be patient with me, and I will repay you everything.’
translation:
  language: ml
  text: അതുകൊണ്ട് ആ അടിമ അവന്റെ മുമ്പിൽ വീണു വണങ്ങിക്കൊണ്ട്, ‘എന്നോട് ക്ഷമ കാണിക്കണമേ; ഞാൻ എല്ലാം അങ്ങേക്കു തിരിച്ചടച്ചുതരാം’ എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεσὼν
  choice: വീണു
  rationale: πίπτω എന്ന ക്രിയയുടെ aorist participle ദാസൻ സംസാരിക്കുന്നതിനുമുമ്പ് നിലത്തു വീണ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘വീണു’ സ്വാഭാവികമായി ആ ശരീരഭാവം നിലനിർത്തുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യത്തിലെ സംഭവത്തിന്റെ ഫലമായി ഈ പ്രതികരണം ഉണ്ടായെന്ന അനുമാനബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: δοῦλος
  choice: അടിമ
  rationale: കടബാധ്യതയും യജമാനന്റെ പൂർണ അധികാരവും പ്രധാനമായ ഈ ഉപമയിൽ δοῦλος സൂചിപ്പിക്കുന്ന ബന്ധിത സാമൂഹിക പദവി ‘അടിമ’ വ്യക്തമായി പകർന്നു നൽകുന്നു.
- source_word: προσεκύνει
  choice: നമസ്കരിച്ചുകൊണ്ട്
  rationale: മനുഷ്യനായ യജമാനന്റെ മുമ്പിലുള്ള ആദരപൂർവമായ സാഷ്ടാംഗവന്ദനമാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്. Imperfect രൂപത്തിന്റെ തുടരുന്ന ഭാവം ‘-കൊണ്ട്’ എന്ന ഘടനയിൽ സ്വാഭാവികമായി പ്രതിഫലിക്കുന്നു; മതാരാധന എന്ന അർഥം നിർബന്ധമായി ചുമത്തുന്നില്ല.
- source_word: λέγων
  choice: എന്നു പറഞ്ഞു
  rationale: നേരിട്ടുള്ള വാക്കുകൾ അവതരിപ്പിക്കുന്ന participle മലയാളത്തിലെ സ്വാഭാവിക ഉദ്ധരണിഘടനയായി മാറ്റിയിരിക്കുന്നു.
- source_word: Μακροθύμησον ἐπ’ ἐμοί
  choice: എന്നോട് ക്ഷമയോടെ കാത്തിരിക്കണമേ
  rationale: വിധിയോ ശിക്ഷയോ നടപ്പാക്കുന്നത് നീട്ടിവെച്ച് സഹനത്തോടെ കാത്തിരിക്കണമെന്ന അപേക്ഷ കടക്കാരൻ–കടംകൊടുത്തവൻ സന്ദർഭത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: πάντα
  choice: എല്ലാം
  rationale: നപുംസകലിംഗ ബഹുവചനത്തിന്റെ സമഗ്രത സ്വാഭാവികമായ മലയാളത്തിൽ പകരുന്നു.
- source_word: ἀποδώσω σοι
  choice: ഞാൻ എല്ലാം അങ്ങേക്കു തിരിച്ചുതരാം
  rationale: കടത്തിന്റെ പശ്ചാത്തലത്തിൽ ἀποδίδωμι ‘തിരിച്ചടയ്ക്കുക/തിരിച്ചുതരുക’ എന്നാണ്; ‘അങ്ങേക്കു’ യജമാനനോടുള്ള ആദരസൂചനയും ‘തിരിച്ചുതരാം’ ഭാവികാല വാഗ്ദാനവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: മനുഷ്യനായ യജമാനനോടുള്ള προσκυνέω എന്ന പ്രവൃത്തിയുടെ അർഥം
  choice: ആദരപൂർവമായ സാഷ്ടാംഗനമസ്കാരമായി വിവർത്തനം ചെയ്തു
  alternative: ‘അവനെ ആരാധിച്ചു’
  rationale: ഉപമയുടെ കഥാലോകത്തിൽ ഈ പ്രവൃത്തി മനുഷ്യനായ രാജാവിനോടോ യജമാനനോടോ ഉള്ള വിനീതമായ പ്രണാമമാണ്. ‘ആരാധിച്ചു’ എന്നു വിവർത്തനം ചെയ്താൽ സന്ദർഭം നിർബന്ധിക്കാത്ത മതപരമായ അർഥം വായനക്കാരൻ ഗ്രഹിക്കാനിടയുണ്ട്; ‘നമസ്കരിച്ചു’ ശരീരഭാവവും ആദരവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. അടിമയുടെ അപേക്ഷയിൽ ‘ണമേ’ എന്നും യജമാനനെ അഭിസംബോധന ചെയ്യുമ്പോൾ ‘അങ്ങേക്കു’ എന്നും ഉപയോഗിച്ച് വിനയഭാവം നിലനിർത്തിയിരിക്കുന്നു.
