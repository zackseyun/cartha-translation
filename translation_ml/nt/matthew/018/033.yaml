  to: ഞാനും നിന്നോടു കരുണ കാണിച്ചതുപോലെ, നീയും നിന്റെ സഹദാസനോടു കരുണ കാണിക്കേണ്ടതായിരുന്നില്ലേ?
  rationale: 'The sole main-text revision explicitly renders κἀγώ with “ഞാനും,” preserving the source’s reciprocal parallel: the master also showed mercy, so the servant also ought to have done so. The footnote is tightened to reflect the lexical force of σύνδουλος while retaining the idiomatic main-text rendering.'
