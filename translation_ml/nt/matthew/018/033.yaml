id: MAT.18.33
reference: Matthew 18:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐκ ἔδει καὶ σὲ ἐλεῆσαι τὸν σύνδουλόν σου, ὡς κἀγὼ σὲ ἠλέησα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/033.yaml
  text: Should you not also have had mercy on your fellow servant[a], as I also had mercy on you?
translation:
  language: ml
  text: ഞാനും നിന്നോടു കരുണ കാണിച്ചതുപോലെ, നീയും നിന്റെ സഹദാസനോടു കരുണ കാണിക്കേണ്ടതായിരുന്നില്ലേ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἔδει
  choice: കാണിക്കേണ്ടതായിരുന്നില്ലേ?
  rationale: ἔδει സൂചിപ്പിക്കുന്ന ധാർമിക ബാധ്യതയും οὐκ ചേർന്ന ആലങ്കാരിക ചോദ്യത്തിന്റെ ശാസനാസ്വരവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: καὶ σὲ
  choice: നീയും
  rationale: പ്രതീക്ഷിക്കപ്പെട്ട പ്രവൃത്തിയെ രാജാവ് മുമ്പ് ചെയ്ത പ്രവൃത്തിയോടു ചേർത്തുനിർത്തുന്ന καί-യുടെ ‘കൂടി/യും’ എന്ന ആശയം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: ἐλεῆσαι / ἠλέησα
  choice: കരുണ കാണിക്കുക / കരുണ കാണിച്ചു
  rationale: ἐλεέω എന്ന ഒരേ ക്രിയയുടെ ആവർത്തനം രണ്ടു ഉപവാക്യങ്ങളിലും ഒരേ മലയാളപ്രയോഗത്തിലൂടെ സംരക്ഷിക്കുന്നു; ‘കരുണ കാണിക്കുക’ ധാർമികവും ദൈവശാസ്ത്രപരവുമായ ഭാരം നിലനിർത്തുന്ന സ്വാഭാവിക പ്രയോഗമാണ്.
- source_word: τὸν σύνδουλόν σου
  choice: നിന്റെ സഹദാസനോട്
  rationale: σύνδουλος ഒരേ യജമാനന്റെ കീഴിലുള്ള സഹ-അടിമയെയോ സഹ-ദാസനെയോ സൂചിപ്പിക്കുന്നു. ‘സഹദാസൻ’ പങ്കിട്ട അധീനസ്ഥാനം സൂക്ഷിക്കുകയും ആധുനിക മലയാളത്തിൽ ഗൗരവത്തോടെയും സ്വാഭാവികമായും വായിക്കപ്പെടുകയും ചെയ്യുന്നു; അടിമത്തത്തിന്റെ ശക്തമായ അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὡς κἀγὼ σὲ ἠλέησα
  choice: ഞാൻ നിന്നോടു കരുണ കാണിച്ചതുപോലെ
  rationale: ὡς-ന്റെ താരതമ്യവും κἀγώ ഉൾക്കൊള്ളുന്ന സമാന്തരതയും വ്യക്തമായി നൽകുന്നു. മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിനായി താരതമ്യ ഉപവാക്യം ആദ്യം വെച്ചിരിക്കുന്നു.
theological_decisions:
- issue: σύνδουλος എന്ന δοῦλος-കുടുംബപദത്തിന്റെ പരിഭാഷ
  choice: സഹദാസൻ
  alternative: സഹ അടിമ / ഒരേ യജമാനന്റെ കീഴിലുള്ള ദാസൻ
  rationale: ഉപമയിലെ യജമാന-അധീന ബന്ധം മറയ്ക്കാതെയും മലയാളത്തിൽ അനാവശ്യമായി അസ്വാഭാവികമാകാതെയും ‘സഹദാസൻ’ ഉപയോഗിച്ചു. ഗ്രീക്ക് പദം ഒരേ യജമാനന്റെ കീഴിലുള്ള ബന്ധിത സഹപ്രവർത്തകനെ സൂചിപ്പിക്കാമെന്ന അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: ἔδει-യിലെ ധാർമിക അനിവാര്യത
  choice: കാണിക്കേണ്ടതായിരുന്നില്ലേ?
  alternative: കരുണ കാണിക്കേണ്ടത് നിനക്കും ആവശ്യമായിരുന്നില്ലേ?
  rationale: വെറും പ്രായോഗിക ആവശ്യകതയല്ല, ലഭിച്ച കരുണയ്ക്കനുസരിച്ച് പ്രവർത്തിക്കാനുള്ള ധാർമിക ബാധ്യതയാണ് ചോദ്യത്തിൽ ഉള്ളത്. ആലങ്കാരിക ശാസനയുടെ ശക്തി നിലനിർത്താൻ ‘വേണ്ടതായിരുന്നില്ലേ’ തിരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശാസനാസ്വരം. താരതമ്യ ഉപവാക്യം ആദ്യം വെച്ചത് മലയാളവാക്യത്തിന്റെ ഒഴുക്ക് മെച്ചപ്പെടുത്തുന്നു. ‘കരുണ കാണിക്കുക’ എന്ന ആവർത്തനം മൂലപാഠത്തിലെ ἐλεέω-യുടെ ആവർത്തനം നിലനിർത്തുന്നു.
