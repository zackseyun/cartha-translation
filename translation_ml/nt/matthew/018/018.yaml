id: MAT.18.18
reference: Matthew 18:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ὅσα ⸀ἐὰν δήσητε ἐπὶ τῆς γῆς ἔσται δεδεμένα ⸀ἐν οὐρανῷ καὶ ὅσα ἐὰν λύσητε ἐπὶ τῆς γῆς ἔσται λελυμένα ⸁ἐν οὐρανῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/018.yaml
  text: Truly I tell you[a], whatever you bind on earth will have been bound in heaven, and whatever you loose on earth will have been loosed in heaven.
translation:
  language: ml
  text: '“സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: നിങ്ങൾ ഭൂമിയിൽ ബന്ധിക്കുന്നതെല്ലാം സ്വർഗത്തിൽ ബന്ധിക്കപ്പെട്ടതായിരിക്കും; നിങ്ങൾ ഭൂമിയിൽ അഴിക്കുന്നതെല്ലാം സ്വർഗത്തിൽ അഴിക്കപ്പെട്ടതായിരിക്കും.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'പരമ്പരാഗതമായി: “സ്വർഗത്തിൽ ബന്ധിക്കപ്പെടും … സ്വർഗത്തിൽ അഴിക്കപ്പെടും.” ഗ്രീക്ക് രൂപം ഇങ്ങനെയും പരിഭാഷപ്പെടുത്താം. എന്നാൽ ഭാവികാല ക്രിയയോടൊപ്പം പൂർണ്ണ നിഷ്ക്രിയ പങ്കുപദം ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ, സ്വർഗത്തിൽ ഇതിനകം സ്ഥാപിക്കപ്പെട്ട ഒരു നിലയെ അതു സൂചിപ്പിക്കുന്നതായും മനസ്സിലാക്കാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: സത്യമായി
  rationale: അധികാരപൂർവമായ ഗൗരവപ്രഖ്യാപനം ആരംഭിക്കുന്ന പദത്തിന്റെ ശക്തി ആധുനിക മലയാളത്തിൽ സുതാര്യമായി നൽകുന്നു.
- source_word: λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: നേരിട്ടുള്ള അഭിസംബോധനയും പ്രസ്താവനയുടെ അധികാരഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὅσα ἐὰν
  choice: എന്തെല്ലാം ... വോ
  rationale: അനിശ്ചിതവും സമഗ്രവുമായ വ്യാപ്തി മലയാളത്തിലെ സ്വാഭാവിക ബന്ധവാക്യഘടനയിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: δήσητε
  choice: ബന്ധിക്കുന്നുവോ
  rationale: ‘കെട്ടുക/ബന്ധിക്കുക’ എന്ന രൂപകവും അതിന്റെ ന്യായാധികാരപരമായ സാധ്യതയും നിലനിർത്തുന്നു; ‘വിലക്കുക’ എന്ന ഒറ്റ അർത്ഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: ἐπὶ τῆς γῆς
  choice: ഭൂമിയിൽ
  rationale: ഭൗമികവും സ്വർഗീയവുമായ മണ്ഡലങ്ങളുടെ വൈരുധ്യം ലളിതമായി നൽകുന്നു.
- source_word: ἔσται δεδεμένα
  choice: ബന്ധിക്കപ്പെട്ടവയായിരിക്കും
  rationale: ഭാവികാല ക്രിയയും പൂർണ്ണ നിഷ്ക്രിയ പങ്കുപദവും ചേർന്ന ഗ്രീക്ക് ഘടനയിലെ ഫലസ്ഥിതി നിലനിർത്തുന്നു; എന്നാൽ മലയാളത്തിൽ മുൻകാലപ്രവർത്തനം ഇംഗ്ലീഷ് future perfect പോലെ വ്യക്തമായി അടയാളപ്പെടുത്താൻ പ്രയാസമുള്ളതിനാൽ അനുബന്ധ വായന കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐν οὐρανῷ
  choice: സ്വർഗത്തിൽ
  rationale: ദൈവിക മണ്ഡലത്തെ സൂചിപ്പിക്കുന്ന ഏകവചന പ്രയോഗത്തിന്റെ പതിവും വ്യക്തവുമായ മലയാളരൂപം.
- source_word: λύσητε
  choice: അഴിക്കുന്നുവോ
  rationale: ‘ബന്ധിക്കുക’ എന്നതിനോടുള്ള രൂപകപരമായ വിരുദ്ധജോടി കാത്തുസൂക്ഷിക്കുന്നു; ‘അനുവദിക്കുക’ എന്ന നിയമപരമായ അർത്ഥത്തിലേക്ക് മാത്രമായി ചുരുക്കുന്നില്ല.
- source_word: ἔσται λελυμένα
  choice: അഴിക്കപ്പെട്ടവയായിരിക്കും
  rationale: പൂർണ്ണ നിഷ്ക്രിയ പങ്കുപദം സൂചിപ്പിക്കുന്ന ഫലസ്ഥിതി സംരക്ഷിക്കുകയും ആദ്യ ഘടകവുമായി സമാന്തരത പാലിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ബന്ധിക്കൽ–അഴിക്കൽ സൂത്രത്തിന്റെ കാലപരവും ദൈവശാസ്ത്രപരവുമായ ശക്തി
  choice: സ്വർഗത്തിൽ ഇതിനകം സ്ഥാപിക്കപ്പെട്ട ഫലസ്ഥിതിയോടുള്ള പൊരുത്തം ഉൾക്കൊള്ളാവുന്ന വിധത്തിൽ ‘ബന്ധിക്കപ്പെട്ടവയായിരിക്കും / അഴിക്കപ്പെട്ടവയായിരിക്കും’ എന്നു വിവർത്തനം ചെയ്തു; മുൻകാലസൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: ‘സ്വർഗത്തിൽ ബന്ധിക്കപ്പെടും / അഴിക്കപ്പെടും’
  rationale: ἔσται + perfect passive participle എന്ന ഘടന മുൻപ് സംഭവിച്ച പ്രവൃത്തിയുടെ നിലനിൽക്കുന്ന ഫലത്തെ സൂചിപ്പിക്കാം. അതേസമയം സാധാരണ ഭാവി നിഷ്ക്രിയ വായനയും വ്യാകരണപരമായി സാധ്യമാണ്. ഒരു പ്രത്യേക സഭാധികാരസിദ്ധാന്തം അടിച്ചേൽപ്പിക്കാതെ ഈ പിരിമുറുക്കം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ബന്ധിക്കുക/അഴിക്കുക’ എന്ന പരമ്പരാഗത രൂപകജോടി വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തി. ബഹുവചനമായ ὑμῖν, δήσητε, λύσητε എന്നിവ ‘നിങ്ങൾ’ എന്ന രൂപത്തിൽ സംരക്ഷിച്ചു.
