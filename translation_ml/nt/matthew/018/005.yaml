id: MAT.18.5
reference: Matthew 18:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἐὰν δέξηται ⸂ἓν παιδίον τοιοῦτο⸃ ἐπὶ τῷ ὀνόματί μου, ἐμὲ δέχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/005.yaml
  text: And whoever receives one such child in my name receives me[a][b].
translation:
  language: ml
  text: എന്റെ നാമത്തിൽ ഇങ്ങനെയുള്ള ഒരു കുട്ടിയെ സ്വീകരിക്കുന്നവൻ എന്നെ സ്വീകരിക്കുന്നു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സ്വാഗതം ചെയ്യുന്നവൻ … സ്വാഗതം ചെയ്യുന്നു.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘സ്വീകരിക്കുക,’ ‘സ്വാഗതം ചെയ്യുക,’ ‘അംഗീകരിക്കുക’ എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘ഇങ്ങനെയുള്ള ഒരു കുട്ടി.’ ഈ വാക്യത്തിലെ ഗ്രീക്കിൽ ‘ചെറിയ’ എന്ന വിശേഷണം ഇല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἐὰν
  choice: സ്വീകരിക്കുന്നവൻ
  rationale: ആപേക്ഷിക സർവനാമവും ἐάν-ഉം ചേർന്നുള്ള പൊതുവായ, അനിശ്ചിത വ്യവസ്ഥയെ മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; ആരായാലും എന്ന ഉൾക്കൊള്ളുന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: δέξηται / δέχεται
  choice: സ്വീകരിക്കുന്നവൻ / സ്വീകരിക്കുന്നു
  rationale: ഒരേ ഗ്രീക്ക് ക്രിയയുടെ ആവർത്തനം മലയാളത്തിലും നിലനിർത്തി, കുട്ടിയെ സ്വീകരിക്കുന്നതും യേശുവിനെ സ്വീകരിക്കുന്നതും തമ്മിലുള്ള നേരിട്ടുള്ള ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: ἓν παιδίον τοιοῦτο
  choice: ഇങ്ങനെയുള്ള ഒരു കുട്ടിയെ
  rationale: τοιοῦτο എന്നതിന്റെ ‘ഇങ്ങനെയുള്ള’ എന്ന സൂചനയും ἓν എന്നതിന്റെ ഏകവചനബലവും സംരക്ഷിക്കുന്നു. ഈ വാക്യത്തിൽ μικρόν ഇല്ലാത്തതിനാൽ ‘ചെറിയ’ എന്നു ചേർത്തിട്ടില്ല.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: എന്റെ നാമത്തിൽ
  rationale: യേശുവിന്റെ നാമത്തോടും അധികാരത്തോടും അവനോടുള്ള ബന്ധത്തോടും ബന്ധപ്പെട്ട് ചെയ്യുന്ന സ്വീകരണത്തെ സൂചിപ്പിക്കുന്ന, സ്വാഭാവികവും അർഥപരിധി അനാവശ്യമായി ചുരുക്കാത്തതുമായ പ്രയോഗം.
- source_word: ἐμὲ
  choice: എന്നെ
  rationale: ഊന്നലുള്ള ഗ്രീക്ക് സർവനാമത്തിന് സ്വാഭാവികമായ മലയാള കർമരൂപം; വാക്യാവസാനത്തിലെ ആശയസമത്വം തന്നെ ആവശ്യമായ ഊന്നൽ നൽകുന്നു.
theological_decisions:
- issue: കുട്ടിയും യേശുവും തമ്മിലുള്ള പ്രതിനിധിത്വപരമായ ഐക്യപ്പെടുത്തൽ
  choice: ഇങ്ങനെയുള്ള ഒരു കുട്ടിയെ യേശുവിന്റെ നാമത്തിൽ സ്വീകരിക്കുന്നത് യേശുവിനെത്തന്നെ സ്വീകരിക്കുന്നതാണെന്ന് നേരിട്ട് പ്രസ്താവിക്കുന്നു.
  alternative: അത്തരം സ്വീകരണം യേശുവിനെ ആദരിക്കുന്നതുമാത്രമാണെന്നു മൃദൂകരിക്കുക.
  rationale: രണ്ടു ഉപവാക്യങ്ങളിലും δέχομαι എന്ന ഒരേ ക്രിയ ഉപയോഗിച്ച് കർമം ‘കുട്ടി’യിൽനിന്ന് ‘എന്നെ’യിലേക്കു മാറുന്നത് ശക്തമായ പ്രതിനിധിത്വപരമായ ഐക്യപ്പെടുത്തൽ പ്രകടമാക്കുന്നു. പാഠത്തിൽ ഇല്ലാത്ത സഭാപരമോ കൂദാശാപരമോ ആയ വിശദീകരണങ്ങൾ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ ക്രിയാവർത്തനം സംരക്ഷിച്ചിരിക്കുന്നു; ‘കുഞ്ഞ്’ എന്നതിനെക്കാൾ പ്രായപരിധി അനാവശ്യമായി ചുരുക്കാത്ത ‘കുട്ടി’ തിരഞ്ഞെടുത്തു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ നൽകിയിരിക്കുന്നു.
