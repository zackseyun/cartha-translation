id: MAT.18.28
reference: Matthew 18:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐξελθὼν δὲ ὁ δοῦλος ἐκεῖνος εὗρεν ἕνα τῶν συνδούλων αὐτοῦ ὃς ὤφειλεν αὐτῷ ἑκατὸν δηνάρια, καὶ κρατήσας αὐτὸν ἔπνιγεν λέγων· ⸀Ἀπόδος εἴ τι ὀφείλεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/028.yaml
  text: But when that servant went out[a], he found one of his fellow servants who owed him a hundred denarii, and seizing him, he began choking him, saying[b], ‘Pay back whatever you owe.’
translation:
  language: ml
  text: എന്നാൽ ആ അടിമ പുറത്തേക്കു പോയപ്പോൾ, തനിക്ക് നൂറ് ദിനാറ[a] കടപ്പെട്ടിരുന്ന സഹ അടിമകളിൽ ഒരാളെ കണ്ടു. അവനെ പിടിച്ച് കഴുത്തുഞെരിക്കാൻ തുടങ്ങി; “നീ കടപ്പെട്ടിരിക്കുന്നതെന്തും തിരിച്ചുതരിക”[b] എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഒരു ദിനാറ ഒരു സാധാരണ തൊഴിലാളിയുടെയോ സൈനികന്റെയോ ഒരു ദിവസത്തെ പതിവുകൂലിയായിരുന്നു.
    reason: cultural_note
  - marker: b
    text: 'കൂടുതൽ പദാനുപദമായി: “നീ എന്തെങ്കിലും കടപ്പെട്ടിട്ടുണ്ടെങ്കിൽ തിരിച്ചുതരിക.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλος
  choice: അടിമ
  rationale: ഉടമസ്ഥതയ്ക്കും നിർബന്ധിത അധീനതയ്ക്കും കീഴിലുള്ള സാമൂഹികനില ഈ ഉപമയിൽ പ്രസക്തമായതിനാൽ, മൃദുവായ ‘ദാസൻ’ എന്നതിനെക്കാൾ ‘അടിമ’ മൂലപദത്തിന്റെ ശക്തി വ്യക്തമാക്കുന്നു.
- source_word: ἐξελθὼν δὲ
  choice: എന്നാൽ ... പുറത്തേക്കു പോയപ്പോൾ
  rationale: δέ സൂചിപ്പിക്കുന്ന കഥാഗതിയിലെ വൈരുധ്യപരമായ തിരിവും aorist participle-ന്റെ കാലബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: συνδούλων
  choice: സഹ അടിമകളിൽ
  rationale: σύν- എന്ന ഘടകത്തിലെ ‘കൂടെ/സഹ’ എന്ന അർഥവും δοῦλος എന്നതിനു തിരഞ്ഞെടുത്ത ‘അടിമ’ എന്ന പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: ὤφειλεν
  choice: കടപ്പെട്ടിരുന്ന
  rationale: സാമ്പത്തിക ബാധ്യതയെ സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: ἑκατὸν δηνάρια
  choice: നൂറ് ദിനാറ
  rationale: ചരിത്രപരമായ നാണയനാമം നിലനിർത്തി, മുൻപു പറഞ്ഞ അതിവലിയ കടവുമായുള്ള അളവിലെ വ്യത്യാസം മായ്ച്ചുകളയുന്നില്ല.
- source_word: κρατήσας
  choice: അവനെ പിടിച്ച്
  rationale: ബലപ്രയോഗത്തോടെയുള്ള ശാരീരിക പിടിത്തം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἔπνιγεν
  choice: കഴുത്തുഞെരിക്കാൻ തുടങ്ങി
  rationale: അപൂർണ ഭൂതകാലരൂപം സൂചിപ്പിക്കുന്ന തുടരുന്ന അഥവാ ആരംഭിച്ചുകൊണ്ടിരിക്കുന്ന അക്രമത്തെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: Ἀπόδος
  choice: തിരിച്ചുതരിക
  rationale: കടം മടക്കിനൽകണമെന്ന മൂർച്ചയുള്ള ആജ്ഞയെ നേരിട്ട് അറിയിക്കുന്നു.
- source_word: εἴ τι ὀφείλεις
  choice: നീ കടപ്പെട്ടിരിക്കുന്നതെന്തും
  rationale: εἴ τι എന്ന അനിശ്ചിത പ്രയോഗത്തെ നിർദിഷ്ടമായ ഒരു തുകയാക്കി ചുരുക്കാതെ ‘എന്തും’ എന്ന തുറന്ന അർഥത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഉപമയിലെ δοῦλος എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: അടിമ / സഹ അടിമകൾ
  alternative: ദാസൻ / സഹദാസന്മാർ
  rationale: ഈ വാക്യത്തിൽ യജമാനന്റെ അധീനത, കടബാധ്യത, ബലപ്രയോഗം എന്നിവ പ്രധാനമായതിനാൽ ചരിത്രസാമൂഹിക യാഥാർഥ്യം മറച്ചുവയ്ക്കാത്ത ‘അടിമ’ എന്ന പദം തിരഞ്ഞെടുത്തു.
- issue: εἴ τι ὀφείλεις എന്നതിലെ അനിശ്ചിതത്വം
  choice: നീ കടപ്പെട്ടിരിക്കുന്നതെന്തും
  alternative: നീ കടപ്പെട്ടിരിക്കുന്നത് / നീ എന്തെങ്കിലും കടപ്പെട്ടിട്ടുണ്ടെങ്കിൽ
  rationale: ആവശ്യം നിർദിഷ്ട തുകയെ മാത്രം സൂചിപ്പിക്കുന്നതായി തീർപ്പാക്കാതെ, മൂലഭാഷയിലെ ‘എന്തെങ്കിലും/എന്തും’ എന്ന അനിശ്ചിത ഭാവം പ്രധാനവാചകത്തിൽ നിലനിർത്തി; കൂടുതൽ പദാനുപദ രൂപം അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം ഉപയോഗിച്ചു. അക്രമത്തിന്റെ ശക്തി മൃദൂകരിക്കാതെയും ചരിത്രനാണയനാമം നിലനിർത്തിയും വാക്യം സ്വാഭാവികമായി വിഭജിച്ചു. ഇംഗ്ലീഷ് consultation layer-ൽ അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ഉള്ളടക്കവുമായി പൊരുത്തപ്പെടാത്ത സ്ഥാനങ്ങളിലായിരുന്നതിനാൽ, സാംസ്കാരിക കുറിപ്പ് ‘ദിനാറ’യ്ക്കും പദവികൽപ്പ കുറിപ്പ് ആവശ്യവാക്യത്തിനും ചേർത്തു.
