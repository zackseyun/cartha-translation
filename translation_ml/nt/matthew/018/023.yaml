id: MAT.18.23
reference: Matthew 18:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Διὰ τοῦτο ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ βασιλεῖ ὃς ἠθέλησεν συνᾶραι λόγον μετὰ τῶν δούλων αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/023.yaml
  text: For this reason the kingdom of heaven has become like a king who wanted to settle accounts with his servants[a][b].
translation:
  language: ml
  text: അതുകൊണ്ട്, തന്റെ അടിമകളുമായി കണക്കുതീർക്കാൻ ആഗ്രഹിച്ച ഒരു രാജാവിനോട് സ്വർഗരാജ്യം ഉപമിക്കപ്പെട്ടു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അടിമകൾ’ എന്നതിന് ‘ദാസന്മാർ’ അല്ലെങ്കിൽ ‘സേവകർ’ എന്നും വിവർത്തനം ചെയ്യാം; ഗ്രീക്കിലെ δοῦλοι രാജാവിന്റെ അധികാരത്തിനു കീഴിലുള്ള അവരുടെ ബന്ധിതസ്ഥാനം ഊന്നിപ്പറയുന്നു.
    reason: alternative_reading
  - marker: b
    text: 'ഗ്രീക്ക്: ‘ഉപമിക്കപ്പെട്ടു’ അഥവാ ‘താരതമ്യം ചെയ്യപ്പെട്ടു.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: അതുകൊണ്ട്
  rationale: മുൻപുള്ള ഉപദേശവുമായി ഈ ഉപമയ്ക്കുള്ള നിഗമനാത്മകവും കാരണപരവുമായ ബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὡμοιώθη
  choice: ഉപമിക്കപ്പെട്ടു
  rationale: ὁμοιόω എന്ന ക്രിയയുടെ ഭൂതകാല കർമണിപ്രയോഗം നിലനിർത്തുകയും ‘തുല്യമായി കാണിക്കപ്പെട്ടു/താരതമ്യം ചെയ്യപ്പെട്ടു’ എന്ന ആശയം സ്വാഭാവികമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: സ്വർഗരാജ്യം
  rationale: മത്തായിയുടെ സവിശേഷ പ്രയോഗത്തിന്റെ അർഥം നിലനിർത്തുന്ന, മലയാള ബൈബിൾ ഭാഷയിലും പൊതുവായ ഉപയോഗത്തിലും പരിചിതമായ പദം.
- source_word: ἀνθρώπῳ βασιλεῖ
  choice: ഒരു രാജാവിനോട്
  rationale: അക്ഷരാർഥത്തിൽ ‘ഒരു മനുഷ്യനോട്—ഒരു രാജാവിനോട്’ എന്നാണെങ്കിലും βασιλεῖ മുൻപുള്ള പദത്തെ വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ ‘ഒരു രാജാവ്’ എന്ന് ചുരുക്കുന്നത് അർഥനഷ്ടമില്ലാതെ സ്വാഭാവികമാണ്.
- source_word: ἠθέλησεν
  choice: ആഗ്രഹിച്ച
  rationale: രാജാവിന്റെ ഇച്ഛയെയും ഉദ്ദേശ്യത്തെയും സൂചിപ്പിക്കുന്ന θέλωയുടെ അർഥം ലളിതവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: συνᾶραι λόγον
  choice: കണക്കുതീർക്കാൻ
  rationale: സാമ്പത്തിക കണക്കുകൾ പരിശോധിച്ച് തീർപ്പാക്കുക, ഉത്തരവാദിത്വം ചോദിക്കുക എന്നീ സന്ദർഭാർഥങ്ങൾ ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: μετὰ τῶν δούλων αὐτοῦ
  choice: തന്റെ അടിമകളുമായി
  rationale: δοῦλοι ഇവിടെ രാജാവിന്റെ അധികാരത്തിനു കീഴിലുള്ള ബന്ധിതരായ ആളുകളെ സൂചിപ്പിക്കുന്നു; കടവും ശിക്ഷാധികാരവും ഉൾപ്പെടുന്ന തുടർസന്ദർഭം അവരുടെ അടിമസ്ഥാനം പ്രസക്തമാക്കുന്നു.
theological_decisions:
- issue: രാജകീയ-സാമ്പത്തിക ഉപമയിലെ δοῦλος എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: അടിമകൾ
  alternative: ദാസന്മാർ / സേവകർ
  rationale: രാജാവിന്റെ ഉടമസ്ഥാധികാരവും കടത്തിന്റെ പേരിലുള്ള കണക്കുതീർപ്പും തുടർവാക്യങ്ങളിലെ വിൽപ്പനാധികാരവും ബന്ധിതമായ സ്ഥാനം വ്യക്തമാക്കുന്നതിനാൽ ‘അടിമകൾ’ മൂലപദത്തിന്റെ സാമൂഹിക യാഥാർഥ്യം കൂടുതൽ തുറന്നുവെക്കുന്നു. എന്നാൽ ‘ദാസന്മാർ’ അല്ലെങ്കിൽ ‘സേവകർ’ എന്ന പരമ്പരാഗത വിവർത്തനസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: ὡμοιώθη എന്ന കർമണിപ്രയോഗത്തിന്റെ സൂക്ഷ്മത
  choice: ഉപമിക്കപ്പെട്ടു
  alternative: പോലെയാണ് / സദൃശമായി
  rationale: മൂലത്തിലെ കർമണിരൂപവും ഉപമ സ്ഥാപിക്കുന്ന സംഭവസ്വഭാവവും നിലനിർത്തുന്നു; ലളിതമായ ‘പോലെയാണ്’ കർമണിസൂക്ഷ്മതയെ മായ്ച്ചുകളയും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സ്വർഗരാജ്യം’, ‘കണക്കുതീർക്കുക’ എന്നീ പരിചിതവും വ്യക്തവുമായ പ്രയോഗങ്ങൾ ഉപയോഗിച്ചു. മൂലത്തിലെ കർമണിസൂക്ഷ്മതയും δοῦλος എന്ന പദത്തിന്റെ ബന്ധിത സാമൂഹികസ്ഥാനവും മറച്ചുവെച്ചിട്ടില്ല.
