id: MAT.18.29
reference: Matthew 18:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πεσὼν οὖν ὁ σύνδουλος ⸀αὐτοῦ παρεκάλει αὐτὸν λέγων· Μακροθύμησον ἐπ’ ⸀ἐμοί, καὶ ἀποδώσω σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/029.yaml
  text: So his fellow servant fell down and pleaded with him[a], saying, ‘Be patient with me, and I will repay you.’
translation:
  language: ml
  text: 'അപ്പോൾ അവന്റെ സഹഅടിമ നിലത്തു വീണ് അവനോട് അപേക്ഷിച്ചു: “എന്നോടു ക്ഷമ കാണിക്കണമേ; ഞാൻ നിനക്കു തിരിച്ചുതരാം.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύνδουλος
  choice: സഹ അടിമ
  rationale: ഒരേ യജമാനന്റെ കീഴിലുള്ള മറ്റൊരു അടിമയെ സൂചിപ്പിക്കുന്ന സംയുക്തപദമാണ്. ഉപമയിലെ യജമാനൻ–അടിമ ബന്ധം വ്യക്തമായി നിലനിർത്താൻ ‘സഹ അടിമ’ ഉപയോഗിച്ചു.
- source_word: πεσὼν
  choice: നിലത്തുവീണ്
  rationale: യാചനയോടുകൂടിയ ശാരീരികമായി താഴെ വീഴുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘കാൽക്കൽ’ എന്ന ആശയം ചേർത്തിട്ടില്ല.
- source_word: οὖν
  choice: അപ്പോൾ
  rationale: ഇവിടെ കഥയുടെ തുടർച്ചയും സംഭവക്രമവും സ്വാഭാവികമായി മുന്നോട്ടുകൊണ്ടുപോകുന്നു.
- source_word: παρεκάλει
  choice: അപേക്ഷിച്ചു
  rationale: കടം സംബന്ധിച്ച കരുണയ്ക്കായുള്ള ഗൗരവമുള്ള അഭ്യർഥനയെ ആധുനികവും മാന്യവുമായ ഭാഷയിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: Μακροθύμησον ἐπ’ ἐμοί
  choice: എന്നോട് ക്ഷമയോടെ കാത്തിരിക്കണമേ
  rationale: കടം തിരിച്ചടയ്ക്കാൻ സമയം അനുവദിച്ചുകൊണ്ട് സഹിഷ്ണുത കാണിക്കണമെന്ന അഭ്യർഥനയെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀποδώσω
  choice: തിരിച്ചുതരാം
  rationale: കടം തിരിച്ചടയ്ക്കുമെന്ന വാഗ്ദാനം സന്ദർഭത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: σύνδουλος എന്ന ദാസ്യത്വപദത്തിന്റെ പരിഭാഷ
  choice: പ്രധാന പാഠത്തിൽ ‘സഹ അടിമ’
  alternative: ‘സഹദാസൻ’ അല്ലെങ്കിൽ ‘കൂടെ സേവിക്കുന്നവൻ’
  rationale: രാജാവ്, കടം, അധികാരത്തിനു കീഴിലുള്ളവർ എന്നിവ ഉൾപ്പെടുന്ന ഉപമയിൽ ബന്ധിതമായ അടിമസ്ഥിതി പ്രസക്തമാണ്. അതിനാൽ മൃദുവായ ‘സേവകൻ’ എന്നതിനേക്കാൾ ‘അടിമ’ മൂലപദത്തിന്റെ സാമൂഹിക യാഥാർഥ്യം വ്യക്തമായി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ കഥനശൈലി. അപേക്ഷയിലെ വിനയഭാവം ‘-ണമേ’ എന്ന രൂപത്തിലൂടെ നിലനിർത്തി; മൂലത്തിൽ ഇല്ലാത്ത ദൃശ്യവിശദാംശങ്ങൾ ചേർത്തിട്ടില്ല.
