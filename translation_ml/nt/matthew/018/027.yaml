source:
  edition: SBLGNT
  text: σπλαγχνισθεὶς δὲ ὁ κύριος τοῦ δούλου ἐκείνου ἀπέλυσεν αὐτόν, καὶ τὸ δάνειον ἀφῆκεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/027.yaml
  text: Then the master of that servant[a], moved with compassion[b], released him and forgave him the debt.
translation:
  language: ml
  text: അപ്പോൾ ആ അടിമയുടെ യജമാനന്[a] അവനോടു മനസ്സലിവ് തോന്നി; അയാൾ അവനെ വിട്ടയയ്ക്കുകയും വായ്പയായി നൽകിയ തുക[b] എഴുതിത്തള്ളുകയും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ‘കർത്താവ്’ എന്നും പരിഭാഷപ്പെടുത്താവുന്ന κύριος എന്ന പദമാണ്; ഇവിടെ അത് ഉപമയിലെ മനുഷ്യയജമാനനെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘വായ്പ’; സന്ദർഭത്തിൽ തിരിച്ചടയ്ക്കാനുള്ള കടബാധ്യതയാണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
lexical_decisions:
- source_word: σπλαγχνισθεὶς
  choice: മനസ്സലിവു തോന്നി
  rationale: ആഴമായ അനുകമ്പയെയോ കരുണയെയോ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ ഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: δὲ
  choice: അപ്പോൾ
  rationale: ഇവിടെ വിരോധത്തേക്കാൾ കഥയുടെ തുടർച്ചയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ആഖ്യാനപുരോഗതിക്ക് ‘അപ്പോൾ’ യോജിക്കുന്നു.
- source_word: κύριος
  choice: യജമാനൻ
  rationale: ഉടമസ്ഥാധികാരമുള്ള മനുഷ്യയജമാനനെയാണ് ഉപമയിൽ നേരിട്ട് പരാമർശിക്കുന്നത്; ദൈവിക ബിരുദമെന്ന തെറ്റായ ധാരണ ഒഴിവാക്കുന്നു.
- source_word: δοῦλος
  choice: അടിമ
  rationale: കടവും അധികാരവും കേന്ദ്രമായ ഈ സന്ദർഭത്തിൽ ബന്ധിതമായ സാമൂഹിക നില പ്രസക്തമായതിനാൽ ‘ദാസൻ’ എന്നതിനെക്കാൾ വ്യക്തമായ പദം ഉപയോഗിച്ചു.
- source_word: ἀπέλυσεν αὐτόν
  choice: അവനെ വിട്ടയച്ചു
  rationale: ഉടൻ നേരിട്ടിരുന്ന തടങ്കലിൽനിന്നോ ബാധ്യതാപരമായ പിടിയിൽനിന്നോ പോകാൻ അനുവദിച്ചതിനെ, അനാവശ്യമായ വ്യാഖ്യാനം ചേർക്കാതെ വ്യക്തമാക്കുന്നു.
- source_word: τὸ δάνειον
  choice: വായ്പയായി നൽകിയ തുക
  rationale: δάνειον പൊതുവായ കടത്തെക്കാൾ പ്രത്യേകമായി വായ്പയെയോ വായ്പയായി നൽകിയതിനെയോ സൂചിപ്പിക്കുന്നു.
- source_word: ἀφῆκεν αὐτῷ
  choice: എഴുതിത്തള്ളി
  rationale: സാമ്പത്തിക ബാധ്യത റദ്ദാക്കിയെന്ന അർഥം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു; ഉപമയുടെ ക്ഷമാ-പ്രതിധ്വനി സന്ദർഭത്തിലൂടെ നിലനിൽക്കുന്നു.
theological_decisions:
- issue: κύριος എന്ന പദത്തെ ദൈവിക ബിരുദമായി അതിവായിക്കാനുള്ള സാധ്യത
  choice: മനുഷ്യനായ ‘യജമാനൻ’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: ‘കർത്താവ്’
  rationale: ഉടൻ വരുന്ന ആഖ്യാനസന്ദർഭത്തിൽ അടിമയുടെ മനുഷ്യയജമാനനാണ് ഉദ്ദേശ്യം. ഉപമയുടെ ദൈവശാസ്ത്രപരമായ പ്രയോഗം നിലനിൽക്കുമ്പോഴും വാക്യത്തിൽ നേരിട്ടുള്ള ദൈവതാദാത്മ്യം ചേർക്കുന്നില്ല.
- issue: δοῦλος എന്ന പദത്തിന്റെ സാമൂഹിക യാഥാർഥ്യം
  choice: ‘അടിമ’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: ‘ദാസൻ’ അല്ലെങ്കിൽ ‘ശുശ്രൂഷകൻ’
  rationale: കടം, ഉടമസ്ഥാധികാരം, വിട്ടയയ്ക്കൽ എന്നിവ ചേർന്ന ഈ ഉപമയിൽ അസമമായ ബന്ധിതാവസ്ഥ പ്രധാനമാണ്.
- issue: ἀφίημι എന്നതിലെ ക്ഷമയും സാമ്പത്തിക റദ്ദാക്കലും തമ്മിലുള്ള ബന്ധം
  choice: ‘എഴുതിത്തള്ളി’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: ‘ക്ഷമിച്ചു’
  rationale: ഇവിടെ നേരിട്ടുള്ള കർമ്മം വായ്പയായതിനാൽ സാമ്പത്തിക അർഥം വ്യക്തമായി നൽകുന്നു; അതേസമയം മത്തായിയിലെ ക്ഷമയുടെ വിശാലമായ പ്രതിധ്വനി ഉപമയിൽനിന്ന് ഇല്ലാതാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘മനസ്സലിവു തോന്നി’ വികാരത്തിന്റെ ആഴം ലളിതമായി നൽകുന്നു; ‘വായ്പയായി നൽകിയ തുക എഴുതിത്തള്ളി’ നിയമ-സാമ്പത്തിക ആശയം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
