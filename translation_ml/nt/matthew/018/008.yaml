id: MAT.18.8
reference: Matthew 18:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εἰ δὲ ἡ χείρ σου ἢ ὁ πούς σου σκανδαλίζει σε, ἔκκοψον ⸀αὐτὸν καὶ βάλε ἀπὸ σοῦ· καλόν σοί ἐστιν εἰσελθεῖν εἰς τὴν ζωὴν ⸂κυλλὸν ἢ χωλόν⸃, ἢ δύο χεῖρας ἢ δύο πόδας ἔχοντα βληθῆναι εἰς τὸ πῦρ τὸ αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/008.yaml
  text: And if your hand or your foot causes you to stumble[a], cut it off and throw it away from you. It is better for you to enter into life maimed or lame than, having two hands or two feet, to be thrown into the eternal fire.
translation:
  language: ml
  text: നിന്റെ കൈയോ കാലോ നിന്നെ ഇടറാൻ ഇടയാക്കുന്നുവെങ്കിൽ[a], അതു വെട്ടിക്കളഞ്ഞ് നിന്നിൽനിന്ന് എറിഞ്ഞുകളയുക. രണ്ടു കൈകളോ രണ്ടു കാലുകളോ ഉള്ളവനായി നിത്യമായ തീയിലേക്ക് എറിയപ്പെടുന്നതിനെക്കാൾ, അംഗഹീനനായോ മുടന്തനായോ ജീവനിലേക്ക് പ്രവേശിക്കുന്നത് നിനക്കു മെച്ചമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിന്നെ പാപം ചെയ്യാൻ ഇടയാക്കുന്നുവെങ്കിൽ.’ ഗ്രീക്ക് ക്രിയയുടെ അക്ഷരാർഥം ‘[നിന്നെ] ഇടറാൻ ഇടയാക്കുക’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκανδαλίζει
  choice: ഇടറിപ്പിക്കുന്നു
  rationale: പാപത്തിലേക്കോ വീഴ്ചയിലേക്കോ നയിക്കുന്നതിനെ ‘ഇടറിക്കൽ’ എന്ന മൂലരൂപകംകൊണ്ട് നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ ധാർമിക അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἔκκοψον
  choice: വെട്ടിക്കളയുക
  rationale: കൈയെയോ കാലിനെയോ സംബന്ധിച്ച ശക്തവും മൂർത്തവുമായ ആജ്ഞയുടെ കാഠിന്യം സംരക്ഷിക്കുന്നു.
- source_word: βάλε ἀπὸ σοῦ
  choice: നിന്നിൽനിന്ന് എറിഞ്ഞുകളയുക
  rationale: ബലമായി നീക്കി അകറ്റുക എന്ന പ്രവൃത്തിയും വേർപാടും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: καλόν σοί ἐστιν
  choice: നിനക്കു നല്ലത്
  rationale: ἤ കൊണ്ടുള്ള താരതമ്യഘടനയിൽ ‘നിനക്കു നല്ലത്’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികമായി ‘അതിനെക്കാൾ മെച്ചം’ എന്ന അർഥം നൽകുന്നു.
- source_word: εἰσελθεῖν εἰς τὴν ζωὴν
  choice: ജീവനിലേക്ക് പ്രവേശിക്കുക
  rationale: ഗ്രീക്കിലെ ‘ജീവൻ’ എന്ന പദം വികസിപ്പിച്ച് ‘നിത്യജീവൻ’ ആക്കാതെ, അന്ത്യകാലസംബന്ധിയായ ഭാരം സന്ദർഭം വഹിക്കാൻ അനുവദിക്കുന്നു.
- source_word: κυλλὸν
  choice: അംഗഹീനൻ
  rationale: അവയവം വെട്ടിമാറ്റപ്പെട്ട അവസ്ഥയെ സൂചിപ്പിക്കുന്ന κυλλός എന്ന പദത്തിന്റെ സന്ദർഭോചിതമായ അർഥം നൽകുന്നു.
- source_word: χωλόν
  choice: മുടന്തൻ
  rationale: കാലിനോ നടത്തത്തിനോ ബാധയുള്ള അവസ്ഥയെ സൂചിപ്പിക്കുന്ന χωλός എന്ന പദത്തിന് നേരിട്ടും സാധാരണക്കാർക്ക് മനസ്സിലാകുന്നതുമായ തുല്യപദം.
- source_word: βληθῆναι
  choice: എറിയപ്പെടുക
  rationale: βάλλω എന്ന ക്രിയയുടെ നിഷ്ക്രിയവും ശക്തവുമായ രൂപം സംരക്ഷിക്കുന്നു.
- source_word: τὸ πῦρ τὸ αἰώνιον
  choice: നിത്യമായ തീ
  rationale: വിധിന്യായസന്ദർഭത്തിലെ αἰώνιος എന്നതിന്റെ സ്വാഭാവിക അർഥം ‘നിത്യമായ’ എന്നു നൽകുന്നു.
theological_decisions:
- issue: σκανδαλίζει എന്നതിലെ ഇടറൽരൂപകം നിലനിർത്തണോ, ‘പാപം ചെയ്യിക്കുന്നു’ എന്നു ധാർമികമായി വ്യാഖ്യാനിക്കണോ
  choice: ഇടറിപ്പിക്കുന്നു
  alternative: പാപം ചെയ്യാൻ ഇടയാക്കുന്നു
  rationale: മൂലപാഠത്തിലെ രൂപകം പ്രധാനവാചകത്തിൽ സംരക്ഷിച്ച് അതിന്റെ ധാർമിക സൂചന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: εἰς τὴν ζωὴν എന്നതിലെ ‘ജീവൻ’ വികസിപ്പിക്കണമോ
  choice: ജീവൻ
  alternative: നിത്യജീവൻ
  rationale: അന്ത്യകാല അർഥം സന്ദർഭത്തിൽ വ്യക്തമായിരുന്നാലും, മൂലത്തിൽ ഇല്ലാത്ത ‘നിത്യ’ എന്ന വിശേഷണം ഇവിടെ ചേർക്കുന്നില്ല.
- issue: ശരീരാവയവം വെട്ടിമാറ്റാനുള്ള ആജ്ഞയെ വ്യാഖ്യാനിച്ച് മൃദൂകരിക്കണമോ
  choice: ആജ്ഞയുടെ മൂർത്തവും കഠിനവുമായ ഭാഷ അതേപടി നിലനിർത്തുന്നു
  alternative: തീവ്രമായ മാനസാന്തരത്തിനുള്ള ആലങ്കാരിക ആഹ്വാനമായി പരാവർത്തനം ചെയ്യുക
  rationale: ഇത് അതിശയോക്തിയാണോ എന്ന വ്യാഖ്യാനവിധി വിവർത്തനം തന്നെ തീർപ്പാക്കാതെ, പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. വാക്യത്തിന്റെ കഠിനമായ ദൃശ്യഭാഷ മൃദൂകരിച്ചിട്ടില്ല; ‘ജീവൻ’ എന്ന മൂലപദവും ‘ഇടറിക്കൽ’ എന്ന രൂപകവും നിലനിർത്തിയിരിക്കുന്നു.
