id: MAT.18.15
reference: Matthew 18:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐὰν δὲ ἁμαρτήσῃ ⸂εἰς σὲ⸃ ὁ ἀδελφός σου, ⸀ὕπαγε ἔλεγξον αὐτὸν μεταξὺ σοῦ καὶ αὐτοῦ μόνου. ἐάν σου ἀκούσῃ, ἐκέρδησας τὸν ἀδελφόν σου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/015.yaml
  text: But if your brother sins against you[a], go and reprove him between you and him alone. If he listens to you[c][b], you have gained your brother.
translation:
  language: ml
  text: എന്നാൽ നിന്റെ സഹോദരൻ[b] നിനക്കെതിരായി പാപം ചെയ്താൽ[a], നീ ചെന്ന്, നീയും അവനും മാത്രം ആയിരിക്കെ, അവന്റെ തെറ്റ് അവനോടു ചൂണ്ടിക്കാണിക്കുക[c]. അവൻ നിന്റെ വാക്കു കേട്ടാൽ, നീ നിന്റെ സഹോദരനെ നേടിയിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘നിനക്കെതിരായി’ എന്ന വാക്കുകൾ ഇല്ല; അവയിൽ ‘നിന്റെ സഹോദരൻ പാപം ചെയ്താൽ’ എന്നാണ് വായന.
    reason: textual_variant
  - marker: b
    text: ‘സഹോദരൻ’ എന്നത് ഗ്രീക്കിൽ വ്യാകരണപരമായി പുല്ലിംഗ ഏകവചനമാണ്; സന്ദർഭത്തിൽ ഇത് ഒരു സഹശിഷ്യനെ കൂടുതൽ വ്യാപകമായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘അവനെ ശാസിക്കുക’, ‘അവന്റെ തെറ്റ് അവനു കാണിച്ചുകൊടുക്കുക’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁμαρτήσῃ
  choice: പാപം ചെയ്താൽ
  rationale: ἐὰν-നോടുകൂടിയ aorist subjunctive പൊതുവായ വ്യവസ്ഥ സൂചിപ്പിക്കുന്നു. ‘പാപം ചെയ്താൽ’ എന്നത് അതിന്റെ ധാർമിക-മതപരമായ ശക്തിയും സ്വാഭാവികമായ മലയാള വ്യവസ്ഥാരൂപവും നിലനിർത്തുന്നു.
- source_word: εἰς σέ
  choice: നിനക്കെതിരായി
  rationale: ഇവിടെ εἰς + accusative കുറ്റം കേൾവിക്കാരനെ ലക്ഷ്യമാക്കുന്നതായി വ്യക്തമാക്കുന്നു. ഈ വാക്യഭാഗം SBLGNT-യിൽ ഉള്ളതിനാൽ മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി; പാഠഭേദം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: ἀδελφός σου
  choice: നിന്റെ സഹോദരൻ
  rationale: ഗ്രീക്ക് പദം വ്യാകരണപരമായി പുല്ലിംഗ ഏകവചനമാണ്. സന്ദർഭത്തിൽ സഹശിഷ്യനെ സൂചിപ്പിക്കാമെങ്കിലും, ഉറവിടരൂപം വ്യാഖ്യാനപരമായി വിപുലീകരിക്കാതെ മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ചു.
- source_word: ὕπαγε
  choice: നീ ചെന്ന്
  rationale: നടപടി ആരംഭിക്കാൻ കല്പിക്കുന്ന ὕπαγε-യുടെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളരൂപം.
- source_word: ἔλεγξον
  choice: അവന്റെ തെറ്റ് അവനു ബോധ്യപ്പെടുത്തുക
  rationale: ἐλέγχω ഇവിടെ തെറ്റ് വെളിച്ചത്തുകൊണ്ടുവന്ന് കുറ്റക്കാരനെ അത് തിരിച്ചറിയിക്കാൻ ശ്രമിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ശാസിക്കുക’ എന്നത് അനാവശ്യമായി കടുപ്പം കൂട്ടാം; ഈ പ്രയോഗം അർത്ഥം വ്യക്തമായി കൈമാറുന്നു.
- source_word: μεταξὺ σοῦ καὶ αὐτοῦ μόνου
  choice: നീയും അവനും മാത്രമായിരിക്കുമ്പോൾ
  rationale: കാര്യത്തെ മറ്റാരുടെയും സാന്നിധ്യമില്ലാതെ സ്വകാര്യമായി കൈകാര്യം ചെയ്യണമെന്ന ഏകാന്തതയും പരിമിതിയും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀκούσῃ
  choice: നിന്റെ വാക്കു കേട്ടാൽ
  rationale: ἀκούω ഇവിടെ വെറും ശബ്ദം കേൾക്കുന്നതിലുപരി പറഞ്ഞത് ശ്രദ്ധിച്ച് സ്വീകരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘അനുസരിച്ചാൽ’ എന്ന് പറഞ്ഞ് പൂർണ അനുസരണം അതിൽ ചേർക്കുന്നില്ല.
- source_word: ἐκέρδησας
  choice: നേടിയിരിക്കുന്നു
  rationale: κερδαίνω-യിലെ ‘നേടുക/സമ്പാദിക്കുക’ എന്ന രൂപകം നിലനിർത്തുന്നു. ‘വീണ്ടെടുത്തു’ എന്നു വിവർത്തനം ചെയ്താൽ ഉറവിടത്തിൽ വ്യക്തമല്ലാത്ത ഒരു മുൻബന്ധനഷ്ടത്തിന്റെ ആശയം ചേർന്നേക്കാം.
theological_decisions:
- issue: εἰς σέ എന്ന വാക്യഭാഗത്തിന്റെ പാഠവിമർശനസ്ഥിതി
  choice: മുഖ്യപാഠത്തിൽ ‘നിനക്കെതിരായി’ ഉൾപ്പെടുത്തി
  alternative: ‘നിന്റെ സഹോദരൻ പാപം ചെയ്താൽ’ എന്ന ചുരുങ്ങിയ വായന
  rationale: നൽകിയ SBLGNT പാഠത്തിൽ εἰς σέ ഉണ്ട്. ഈ പാഠഭേദം ഉപദേശം വ്യക്തിപരമായ കുറ്റത്തോട് മാത്രമാണോ കൂടുതൽ പൊതുവായ പാപത്തോടുമാണോ ബന്ധപ്പെട്ടത് എന്ന വായനയെ ബാധിക്കുന്നതിനാൽ, ചുരുങ്ങിയ വായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: ἀδελφός എന്ന പദത്തിന്റെ പ്രയോഗപരമായ വ്യാപ്തി
  choice: നിന്റെ സഹോദരൻ
  alternative: നിന്റെ സഹോദരനോ സഹോദരിയോ / ഒരു സഹവിശ്വാസി
  rationale: മുഖ്യപാഠം ഗ്രീക്കിലെ വ്യാകരണപരമായ പുല്ലിംഗ ഏകവചനം നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ ഇത് ഒരു സഹശിഷ്യനെ കൂടുതൽ വ്യാപകമായി സൂചിപ്പിക്കാമെന്ന കാര്യം അടിക്കുറിപ്പിൽ പറയുന്നു; വ്യാഖ്യാനപരമായ ഉൾക്കൊള്ളിക്കൽ മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
- issue: ἔλεγξον എന്നതിലെ തിരുത്തലിന്റെ സ്വഭാവം
  choice: അവന്റെ തെറ്റ് അവനു ബോധ്യപ്പെടുത്തുക
  alternative: അവനെ ശാസിക്കുക / അവനെ നേരിടുക
  rationale: ഈ സന്ദർഭത്തിൽ ലക്ഷ്യം ശിക്ഷാഭാവമുള്ള ശാസനയെന്നതിലുപരി തെറ്റ് തുറന്നുകാട്ടി സഹോദരനെ തിരിച്ചുകൊണ്ടുവരികയാണ്. അതേസമയം, കുറ്റത്തെ മൃദൂകരിക്കാതെ നേരിട്ടുള്ള തിരുത്തൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘പാപം’, ‘സഹോദരൻ’, ‘നേടിയിരിക്കുന്നു’ എന്നീ ഉറവിടത്തിന്റെ ധാർമികവും രൂപകാത്മകവുമായ ഘടകങ്ങൾ നിലനിർത്തി. സ്വകാര്യ സംഭാഷണത്തിന്റെ ആശയം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ രീതിയിൽ അവതരിപ്പിച്ചു.
