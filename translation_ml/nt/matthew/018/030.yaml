source:
  edition: SBLGNT
  text: ὁ δὲ οὐκ ἤθελεν, ἀλλὰ ἀπελθὼν ἔβαλεν αὐτὸν εἰς φυλακὴν ἕως ⸀οὗ ἀποδῷ τὸ ὀφειλόμενον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/030.yaml
  text: But he was not willing[a]; instead[c][b], he went away and threw him into prison until he should pay what was owed.
translation:
  language: ml
  text: എന്നാൽ അവൻ സന്നദ്ധനായില്ല[a]. പകരം, അവൻ പോയി, അയാൾ കൊടുക്കാനുള്ളത്[c] അടച്ചുതീർക്കുന്നതുവരെ അയാളെ തടവറയിലേക്കു തള്ളിയിട്ടു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അവൻ നിരസിച്ചു’; ഗ്രീക്കിൽ അക്ഷരാർഥം ‘അവൻ സന്നദ്ധനായില്ല.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘അയാളെ തടവിലാക്കി’; ഗ്രീക്ക് ക്രിയ കൂടുതൽ ശക്തമാണ്—അക്ഷരാർഥത്തിൽ ‘തടവറയിലേക്കു എറിഞ്ഞു/തള്ളിയിട്ടു.’
    reason: lexical_alternative
  - marker: c
    text: ‘കൊടുക്കാനുള്ളത്’ എന്നതിന് ‘കൊടുക്കാനുണ്ടായിരുന്ന തുക’ എന്നോ ‘കടം’ എന്നോ വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: എന്നാൽ അവൻ
  rationale: δέ സൂചിപ്പിക്കുന്ന വൈരുധ്യം സ്വാഭാവികമായി നിലനിർത്തുകയും, substantival article മുൻപ് പറഞ്ഞ ദാസനെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് മലയാള സർവനാമത്തിലൂടെ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: οὐκ ἤθελεν
  choice: അതിന് മനസ്സായില്ല
  rationale: θέλω എന്ന പദത്തിന്റെ ഇച്ഛയോ സന്നദ്ധതയോ സംബന്ധിച്ച ഭാവം നിലനിർത്തുന്നു; ‘നിരസിച്ചു’ എന്ന കൂടുതൽ ശക്തമായ വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ അടിച്ചേൽപ്പിക്കുന്നില്ല.
- source_word: ἀλλὰ
  choice: പകരം
  rationale: മുൻപുണ്ടായ അപേക്ഷയോടുള്ള ശക്തമായ വൈരുധ്യം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀπελθὼν
  choice: അവൻ പോയി
  rationale: ഗ്രീക്ക് aorist participle-നെ സ്വാഭാവികമായ finite clause ആയി നൽകുന്നു; തുടർന്നുള്ള പ്രവൃത്തിക്ക് മുമ്പുള്ള നീക്കം നിലനിർത്തുന്നു.
- source_word: ἔβαλεν αὐτὸν εἰς φυλακήν
  choice: അയാളെ തടവറയിലേക്കു തള്ളിയിട്ടു
  rationale: βάλλω എന്ന ക്രിയയുടെ ബലപ്രയോഗവും പ്രവൃത്തിയുടെ കാഠിന്യവും ‘തള്ളിയിട്ടു’ നിലനിർത്തുന്നു; ‘തടവിലാക്കി’ എന്ന നിഷ്പക്ഷമായ വിവർത്തനത്തേക്കാൾ മൂലപദത്തോട് അടുത്തതാണ്.
- source_word: ἕως οὗ
  choice: വരെ
  rationale: തടവിന്റെ സമയപരിധി ലളിതവും സ്വാഭാവികവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἀποδῷ
  choice: കൊടുത്തുതീർക്കുന്നതുവരെ
  rationale: ἀποδίδωയുടെ തിരിച്ചുകൊടുക്കൽ/അടച്ചുതീർക്കൽ ഭാവവും aorist subjunctive സൂചിപ്പിക്കുന്ന പ്രതീക്ഷിത പൂർത്തീകരണവും ഒരുമിച്ച് നൽകുന്നു.
- source_word: τὸ ὀφειλόμενον
  choice: കൊടുക്കാനുള്ളത്
  rationale: substantival participle-ന്റെ ‘കടപ്പെട്ടിരിക്കുന്നത്/കൊടുക്കാനുള്ളത്’ എന്ന പൊതുവായ അർഥം നിലനിർത്തുന്നു; നിർബന്ധമായി ‘കടം’ എന്ന നാമത്തിലേക്ക് ചുരുക്കുന്നില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘മനസ്സായില്ല’ ഇച്ഛാഭാവം സംരക്ഷിക്കുന്നു; ‘തള്ളിയിട്ടു’ മൂലക്രിയയിലെ കാഠിന്യം നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട മുഖ്യവാചകഭാഗങ്ങളിൽ ചേർത്തിരിക്കുന്നു.
