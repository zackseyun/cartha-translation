  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Οὐ λέγω σοι ἕως ἑπτάκις ἀλλὰ ἕως ἑβδομηκοντάκις ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/022.yaml
  text: Jesus says to him[a], “I do not say to you, up to seven times, but up to seventy times seven.
translation:
  language: ml
  text: 'യേശു അവനോടു പറയുന്നു: “ഏഴു പ്രാവശ്യം വരെ എന്നു ഞാൻ നിന്നോടു പറയുന്നില്ല; എഴുപത്തേഴു പ്രാവശ്യം വരെ എന്നാണ് ഞാൻ പറയുന്നത്.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “എഴുപത് ഗുണം ഏഴ് പ്രാവശ്യം വരെ.”
    reason: ഗ്രീക്കിലെ ἑβδομηκοντάκις ἑπτά എന്ന സംഖ്യാത്മക പ്രയോഗത്തിന് സാധ്യമായ മറ്റൊരു വായന.
lexical_decisions:
- source_word: λέγει
  choice: പറയുന്നു
  rationale: ഗ്രീക്കിലെ ആഖ്യാനവർത്തമാനകാലം നിലനിർത്തുന്നു; മലയാളത്തിൽ സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവികമായ രൂപമാണിത്.
- source_word: αὐτῷ
  choice: അവനോട്
  rationale: മുൻസന്ദർഭത്തിലെ പത്രോസിനെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിലും, ഗ്രീക്കിലുള്ള സർവനാമം പേരാക്കി മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: Οὐ λέγω σοι
  choice: എന്നു ഞാൻ നിന്നോടു പറയുന്നു എന്നല്ല
  rationale: നിഷേധവും ‘നിന്നോട്’ എന്ന പരോക്ഷകർമ്മവും നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ ഉദ്ധരണിഘടനയ്ക്ക് സ്വാഭാവികമായി ക്രമീകരിക്കുന്നു.
- source_word: ἕως
  choice: വരെ
  rationale: എണ്ണത്തിന്റെ പരിധി സൂചിപ്പിക്കുന്ന ഈ സന്ദർഭത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗം.
- source_word: ἑπτάκις
  choice: ഏഴു പ്രാവശ്യം
  rationale: ആവർത്തനസംഖ്യയെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: ἀλλὰ
  choice: എന്നല്ല … എന്നു
  rationale: ഗ്രീക്കിലെ വിരുദ്ധത മലയാളത്തിൽ സ്വാഭാവികമായ ‘എന്നല്ല … എന്നു’ ഘടനയിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: ἑβδομηκοντάκις ἑπτά
  choice: എഴുപത്തേഴു പ്രാവശ്യം
  rationale: വാക്യഘടനയ്ക്ക് സാധ്യമായ നേരിട്ടുള്ള വായനയായി ‘എഴുപത്തേഴു പ്രാവശ്യം’ സ്വീകരിക്കുന്നു; ‘എഴുപത് ഏഴ് പ്രാവശ്യം’ എന്ന മറ്റൊരു പുരാതനവും വ്യാപകവുമായ വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ക്ഷമയെക്കുറിച്ചുള്ള യേശുവിന്റെ ഉപദേശത്തിലെ സംഖ്യാത്മക പ്രയോഗത്തിന്റെ ദ്വയാർഥത
  choice: എഴുപത്തേഴു പ്രാവശ്യം
  alternative: എഴുപത് ഏഴ് പ്രാവശ്യം
  rationale: ἑβδομηκοντάκις ἑπτά എന്ന ഗ്രീക്ക് പ്രയോഗം ‘എഴുപത്തേഴു’ എന്നും ‘എഴുപത് ഗുണം ഏഴ്’ എന്നും മനസ്സിലാക്കപ്പെട്ടിട്ടുണ്ട്. മുഖ്യപാഠത്തിൽ ആദ്യവായന സ്വീകരിക്കുകയും മറ്റേ വായന അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നത് യഥാർഥമായ അവ്യക്തത സംരക്ഷിക്കുന്നു; ക്ഷമയ്ക്ക് കർശനമായ പരമാവധി കണക്കാക്കുന്ന വ്യാഖ്യാനം വിവർത്തനത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഗ്രീക്കിലെ ആഖ്യാനവർത്തമാനകാലവും സർവനാമവും നിലനിർത്തിയിരിക്കുന്നു. സംഖ്യാത്മക പ്രയോഗത്തിന്റെ യഥാർഥ ദ്വയാർഥത അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുന്നു.
