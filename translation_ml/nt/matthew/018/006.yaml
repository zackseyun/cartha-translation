id: MAT.18.6
reference: Matthew 18:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὃς δ’ ἂν σκανδαλίσῃ ἕνα τῶν μικρῶν τούτων τῶν πιστευόντων εἰς ἐμέ, συμφέρει αὐτῷ ἵνα κρεμασθῇ μύλος ὀνικὸς ⸀εἰς τὸν τράχηλον αὐτοῦ καὶ καταποντισθῇ ἐν τῷ πελάγει τῆς θαλάσσης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/006.yaml
  text: But whoever causes one of these little ones who believe in me to stumble[c][b][a], it is better for him that a donkey millstone be hung around his neck and that he be drowned in the open sea.
translation:
  language: ml
  text: എന്നാൽ, എന്നിൽ വിശ്വസിക്കുന്ന ഈ ചെറിയവരിൽ ഒരാളെ ആരെങ്കിലും ഇടറിച്ചാൽ[a], അവന്റെ കഴുത്തിൽ കഴുതയെക്കൊണ്ട് തിരിക്കുന്ന വലിയ തിരികല്ല്[b] കെട്ടി, അവൻ നടുക്കടലിൽ[c] മുങ്ങിപ്പോകുന്നതാണ് അവനു കൂടുതൽ നല്ലത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പാപത്തിലേക്കു നയിച്ചാൽ.” ഗ്രീക്ക് ക്രിയയ്ക്ക് ഒരാളെ ഇടറിക്കുകയോ വിശ്വാസത്തിൽനിന്ന് വീഴ്ത്തുകയോ പാപത്തിലേക്കു നയിക്കുകയോ ചെയ്യുക എന്നർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “കഴുതയുടെ തിരികല്ല്”; അതായത്, കഴുതയെക്കൊണ്ട് തിരിപ്പിച്ചിരുന്ന വലിയ തിരികല്ല്.
    reason: cultural_note
  - marker: c
    text: അഥവാ, “കടലിന്റെ ആഴത്തിൽ.” ഗ്രീക്ക് പദം പ്രത്യേകിച്ച് തുറന്ന കടൽപ്രദേശത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκανδαλίσῃ
  choice: ഇടറിച്ചാൽ
  rationale: ആത്മീയമായി ഇടറുക, വിശ്വാസത്തിൽനിന്ന് വീഴുക, പാപത്തിലേക്കു നയിക്കപ്പെടുക എന്നീ സാധ്യതകൾ ഉൾക്കൊള്ളുന്ന മൂലരൂപകം നിലനിർത്തുന്നു.
- source_word: μικρῶν τούτων
  choice: ഈ ചെറിയവരിൽ
  rationale: കുട്ടികൾക്ക് മാത്രമായി അർഥം ചുരുക്കാതെ, താഴ്മയുള്ളവരോ ദുർബലരായി കണക്കാക്കപ്പെടുന്നവരോ ആയ വിശ്വാസികളെയും ഉൾക്കൊള്ളാവുന്ന വിശാലത സംരക്ഷിക്കുന്നു.
- source_word: τῶν πιστευόντων εἰς ἐμέ
  choice: എന്നിൽ വിശ്വസിക്കുന്ന
  rationale: വ്യക്തിയെ ലക്ഷ്യമാക്കിയ πιστεύω εἰς എന്ന പ്രയോഗത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: συμφέρει αὐτῷ
  choice: അവനു കൂടുതൽ നല്ലത്
  rationale: ഭയാനകമായ രണ്ടു ഫലങ്ങളുടെ താരതമ്യം സൂചിപ്പിക്കുന്ന സന്ദർഭത്തിൽ ‘കൂടുതൽ നല്ലത്’ താരതമ്യഭാവം വ്യക്തമാക്കുന്നു.
- source_word: μύλος ὀνικὸς
  choice: കഴുത തിരിക്കുന്ന വലിയ തിരികല്ല്
  rationale: കൈകൊണ്ട് തിരിക്കുന്ന ചെറിയ കല്ലല്ല, കഴുത ഉപയോഗിച്ച് തിരിക്കുന്ന വലിയ തിരികല്ലാണെന്ന സാംസ്കാരിക ദൃശ്യം വ്യക്തമാക്കുന്നു.
- source_word: εἰς τὸν τράχηλον αὐτοῦ
  choice: അവന്റെ കഴുത്തിൽ ... കെട്ടി
  rationale: തൂക്കിയിടുന്ന ദൃശ്യം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: καταποντισθῇ
  choice: മുക്കിക്കളയുന്നത്
  rationale: വെള്ളത്തിന്റെ ആഴത്തിലേക്കു താഴ്ത്തി മുങ്ങിക്കുന്ന നിഷ്ക്രിയ ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: ἐν τῷ πελάγει τῆς θαλάσσης
  choice: നടുക്കടലിൽ
  rationale: കരയിൽനിന്ന് അകലെയുള്ള തുറന്ന കടൽ എന്ന πέλαγος എന്ന പദത്തിന്റെ ആശയം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: ‘ചെറിയവർ’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: ‘ഈ ചെറിയവരിൽ’ എന്നു വിശാലമായി നിലനിർത്തി
  alternative: ‘ഈ ചെറിയ കുട്ടികളിൽ’
  rationale: സമീപസന്ദർഭത്തിൽ ഒരു കുട്ടിയുണ്ടെങ്കിലും ‘എന്നിൽ വിശ്വസിക്കുന്ന’ എന്ന വിശേഷണം താഴ്മയുള്ളവരോ ദുർബലരോ ആയ ശിഷ്യരിലേക്കും സൂചന വ്യാപിപ്പിക്കാം; പരിഭാഷ ആ സാധ്യത ചുരുക്കുന്നില്ല.
- issue: σκανδαλίζω എന്ന ക്രിയയുടെ ആത്മീയ വ്യാപ്തി
  choice: ‘ഇടറിച്ചാൽ’ എന്ന രൂപകം നിലനിർത്തി
  alternative: ‘പാപം ചെയ്യിച്ചാൽ’
  rationale: ‘പാപം ചെയ്യിക്കുക’ എന്നത് സാധ്യമായ അർഥമാണെങ്കിലും വിശ്വാസത്തിൽനിന്ന് വീഴ്ത്തുക അല്ലെങ്കിൽ ആത്മീയ നാശത്തിലേക്കു നയിക്കുക എന്ന വിശാലമായ ഭീഷണിയെ ചുരുക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഇടറിക്കുക’ എന്ന ബൈബിൾപരിചിതമായ രൂപകം സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന വിധത്തിൽ അടിക്കുറിപ്പിലൂടെ വിശദീകരിച്ചു; ‘ചെറിയവർ’ എന്നതിന്റെ ഉദ്ദേശ്യപൂർവമായ വിശാലത സംരക്ഷിച്ചു.
