  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τότε προσκαλεσάμενος αὐτὸν ὁ κύριος αὐτοῦ λέγει αὐτῷ· Δοῦλε πονηρέ, πᾶσαν τὴν ὀφειλὴν ἐκείνην ἀφῆκά σοι, ἐπεὶ παρεκάλεσάς με·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/032.yaml
  text: Then his master summoned him and said to him[a], ‘Wicked servant[b], I forgave you all that debt because you pleaded with me.’
translation:
  language: ml
  text: 'അപ്പോൾ അവന്റെ യജമാനൻ അവനെ വിളിച്ചുവരുത്തി അവനോടു പറഞ്ഞു: “ദുഷ്ടനായ അടിമേ, നീ എന്നോടു അപേക്ഷിച്ചതുകൊണ്ട് ആ കടം മുഴുവനും ഞാൻ നിനക്കു ക്ഷമിച്ചുതന്നു.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ആ കടം മുഴുവനും ഞാൻ നിനക്കു ഒഴിവാക്കിത്തന്നു.” ഗ്രീക്ക് ക്രിയയ്ക്ക് കടം വിട്ടുകൊടുക്കുക, ഇളവുചെയ്യുക എന്നീ അർഥങ്ങളും ക്ഷമിക്കുക എന്ന അർഥവും വരാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: അപ്പോൾ
  rationale: ഉപമയിലെ സംഭവക്രമം സ്വാഭാവികമായി തുടരുന്ന കാലസൂചക പ്രയോഗം.
- source_word: προσκαλεσάμενος
  choice: വിളിച്ചുവരുത്തി
  rationale: ഒരാളെ തന്റെ അടുക്കലേക്കു അധികാരപൂർവം വിളിപ്പിക്കുന്ന അർഥം സന്ദർഭോചിതമായി നൽകുന്നു.
- source_word: ὁ κύριος αὐτοῦ
  choice: അവന്റെ യജമാനൻ
  rationale: ഇവിടെ ദൈവിക സ്ഥാനപ്പേരല്ല, അടിമയുടെ മേലധികാരിയും ഉടമയുമായ വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: λέγει αὐτῷ
  choice: അവനോടു പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനത്തെ സ്വാഭാവിക മലയാള ആഖ്യാനത്തിൽ ഭൂതകാലമായി അവതരിപ്പിക്കുന്നു.
- source_word: Δοῦλε πονηρέ
  choice: ദുഷ്ടനായ അടിമേ
  rationale: δοῦλος സൂചിപ്പിക്കുന്ന ബന്ധിതമായ യജമാനൻ–അടിമ ബന്ധവും πονηρός നൽകുന്ന നൈതിക കുറ്റവിധിയും നിലനിർത്തുന്നു.
- source_word: πᾶσαν τὴν ὀφειλὴν ἐκείνην
  choice: ആ കടം മുഴുവനും
  rationale: കടത്തിന്റെ സമ്പൂർണ തുകയും ഇളവുചെയ്തെന്ന ഊന്നൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἀφῆκά σοι
  choice: ഞാൻ നിനക്കു ക്ഷമിച്ചുതന്നു
  rationale: കടം ഇളവുചെയ്യുക എന്ന തൽസന്ദർഭാർത്ഥത്തോടൊപ്പം മത്തായിയിലെ ക്ഷമ എന്ന ദൈവശാസ്ത്രപരമായ പ്രതിധ്വനിയും സംരക്ഷിക്കുന്നു.
- source_word: ἐπεὶ παρεκάλεσάς με
  choice: നീ എന്നോടു അപേക്ഷിച്ചതുകൊണ്ട്
  rationale: യജമാനന്റെ നടപടിക്കുള്ള കാരണവും അടിമയുടെ ഗൗരവമുള്ള അഭ്യർത്ഥനയും അതിശയോക്തിയില്ലാതെ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: δοῦλος എന്ന പദം യജമാനൻ–അടിമ ബന്ധത്തിൽ പരിഭാഷപ്പെടുത്തൽ
  choice: അടിമ
  alternative: ദാസൻ / സേവകൻ
  rationale: കടബാധ്യതയും യജമാനന്റെ നിയമപരവും സാമ്പത്തികവുമായ അധികാരവും ഉപമയിൽ നിർണായകമായതിനാൽ ബന്ധിതസ്ഥിതി തുറന്നുകാട്ടുന്ന ‘അടിമ’ കൂടുതൽ കൃത്യമാണ്.
- issue: കടത്തിന്റെ സന്ദർഭത്തിൽ ἀφίημι പരിഭാഷപ്പെടുത്തൽ
  choice: ക്ഷമിച്ചുതന്നു
  alternative: ഒഴിവാക്കിത്തന്നു / എഴുതിത്തള്ളി
  rationale: തൽസന്ദർഭത്തിലെ കടമോചനവും ഉപമ ചൂണ്ടുന്ന ക്ഷമയുടെ വിശാലമായ ആശയവും ഒരുമിച്ച് നിലനിർത്തുന്നു; വാണിജ്യാർത്ഥത്തിലേക്ക് മാത്രം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. ചരിത്രപരമായ യജമാനൻ–അടിമ ബന്ധം മയപ്പെടുത്താതെ അവതരിപ്പിച്ചിരിക്കുന്നു; കടമോചനവും ക്ഷമയും തമ്മിലുള്ള ഉദ്ദേശ്യപൂർവമായ അർഥസമ്മിശ്രത അടിക്കുറിപ്പോടെ നിലനിർത്തിയിരിക്കുന്നു.
