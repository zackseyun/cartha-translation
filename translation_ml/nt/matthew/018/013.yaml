id: MAT.18.13
reference: Matthew 18:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐὰν γένηται εὑρεῖν αὐτό, ἀμὴν λέγω ὑμῖν ὅτι χαίρει ἐπ’ αὐτῷ μᾶλλον ἢ ἐπὶ τοῖς ἐνενήκοντα ἐννέα τοῖς μὴ πεπλανημένοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/013.yaml
  text: And if he happens to find it[a], truly I tell you[b], he rejoices over it more than over the ninety-nine that have not gone astray.
translation:
  language: ml
  text: അവൻ അതിനെ കണ്ടെത്താനിടയായാൽ, സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു, വഴിതെറ്റിപ്പോകാതിരുന്ന തൊണ്ണൂറ്റൊമ്പതിനെക്കാൾ അതിനെക്കുറിച്ച് അവൻ കൂടുതൽ സന്തോഷിക്കുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: അങ്ങനെ
  rationale: മുൻവാക്യത്തിലെ ഇടയന്റെ തിരച്ചിലുമായി ഈ ഫലത്തെ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു; ഗ്രീക്കിലെ ലളിതമായ ബന്ധകത്തിന്റെ സന്ദർഭാനുസൃതമായ മലയാളരൂപം.
- source_word: ἐὰν γένηται εὑρεῖν αὐτό
  choice: അതിനെ കണ്ടെത്താൻ ഇടയായാൽ
  rationale: കണ്ടെത്തൽ ഉറപ്പാണെന്നല്ല, സംഭവിച്ചേക്കാവുന്ന കാര്യമാണെന്ന ഗ്രീക്ക് പ്രയോഗത്തിലെ സാന്ദർഭികതയും അനിശ്ചിതത്വവും നിലനിർത്തുന്നു.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: യേശുവിന്റെ ഗൗരവവും ഉറപ്പും നിറഞ്ഞ പ്രസ്താവനാസൂത്രം ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: χαίρει ἐπ’ αὐτῷ
  choice: അതിനെക്കുറിച്ച് അവൻ കൂടുതൽ സന്തോഷിക്കുന്നു
  rationale: χαίρω എന്നതിന്റെ സന്തോഷഭാവം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; ἐπί സൂചിപ്പിക്കുന്ന സന്തോഷത്തിന്റെ വിഷയവും വ്യക്തമാക്കുന്നു.
- source_word: μᾶλλον ἢ
  choice: …നെയുംകാൾ … കൂടുതൽ
  rationale: ഒന്നിനെക്കാൾ മറ്റൊന്നിലുള്ള സന്തോഷത്തിന്റെ യഥാർഥ താരതമ്യം മയപ്പെടുത്താതെയും ഒഴിവാക്കാതെയും നിലനിർത്തുന്നു.
- source_word: τοῖς ἐνενήκοντα ἐννέα
  choice: തൊണ്ണൂറ്റൊമ്പതിനെയും
  rationale: ഗ്രീക്കിൽ ‘ആടുകൾ’ വീണ്ടും പറയാത്തതിനാൽ മലയാളത്തിലും സന്ദർഭത്തിൽനിന്ന് മനസ്സിലാകുന്ന നാമം ആവർത്തിക്കാതെ വിടുന്നു.
- source_word: τοῖς μὴ πεπλανημένοις
  choice: വഴിതെറ്റിപ്പോകാതിരുന്ന
  rationale: പൂർണ്ണകൃതന്തം സൂചിപ്പിക്കുന്ന നിലയും ആടുകളുടെ ദൃശ്യത്തിന് യോജിക്കുന്ന ‘വഴിതെറ്റുക’ എന്ന അർഥവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഇടയന്റെ സന്തോഷത്തിലെ താരതമ്യത്തിന്റെ വ്യാഖ്യാനബലം
  choice: കണ്ടെത്തപ്പെട്ട ഒന്നിനെക്കുറിച്ച് വഴിതെറ്റാത്ത തൊണ്ണൂറ്റൊമ്പതിനേക്കാൾ കൂടുതൽ സന്തോഷിക്കുന്നു എന്ന താരതമ്യം നേരിട്ട് നിലനിർത്തി.
  alternative: തൊണ്ണൂറ്റൊമ്പതിനോടുള്ള കരുതൽ കുറവാണെന്ന ധാരണ ഒഴിവാക്കാൻ താരതമ്യം മയപ്പെടുത്തുക; അല്ലെങ്കിൽ അവയ്ക്ക് മൂല്യം കുറവാണെന്ന് വ്യക്തമാക്കുക.
  rationale: μᾶλλον ἢ ഒരു യഥാർഥ താരതമ്യം പ്രകടിപ്പിക്കുന്നു. തൊണ്ണൂറ്റൊമ്പതിനോടുള്ള കരുതലിനെക്കുറിച്ചോ ആപേക്ഷിക മൂല്യത്തെക്കുറിച്ചോ വാക്യം പറയാത്തതിനാൽ ആ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘കണ്ടെത്താൻ ഇടയായാൽ’ എന്ന പ്രയോഗം മൂലത്തിലെ contingency നിലനിർത്തുന്നു. വായനാസൗകര്യത്തിനായി ഗൗരവപ്രസ്താവനയ്ക്കുശേഷം ദ്വിബിന്ദു ഉപയോഗിച്ചു; മൂലത്തിൽ ആവർത്തിക്കാത്ത ‘ആടുകൾ’ ചേർത്തിട്ടില്ല.
