- from: 'അങ്ങനെ അതിനെ കണ്ടെത്താൻ ഇടയായാൽ, സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: വഴിതെറ്റിപ്പോകാതിരുന്ന തൊണ്ണൂറ്റൊമ്പതിനെയുംകാൾ അതിനെക്കുറിച്ച് അവൻ കൂടുതൽ സന്തോഷിക്കുന്നു.'
  to: അവൻ അതിനെ കണ്ടെത്താനിടയായാൽ, സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു, വഴിതെറ്റിപ്പോകാതിരുന്ന തൊണ്ണൂറ്റൊമ്പതിനെക്കാൾ അതിനെക്കുറിച്ച് അവൻ കൂടുതൽ സന്തോഷിക്കുന്നു.
