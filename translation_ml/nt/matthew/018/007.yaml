  to: ഇടർച്ചകൾ[a] നിമിത്തം ലോകത്തിന് അയ്യോ കഷ്ടം! കാരണം, ഇടർച്ചകൾ വരേണ്ടത് അനിവാര്യമാണ്; എങ്കിലും ആരിലൂടെയാണോ ഇടർച്ച വരുന്നത്, ആ മനുഷ്യന് അയ്യോ കഷ്ടം![b]
  rationale: മുഖ്യപാഠത്തിൽ γάρ-ന്റെ വിശദീകരണസ്വഭാവം ‘കാരണം’ വഴി വ്യക്തമാക്കി. σκάνδαλον-നെക്കുറിച്ചുള്ള അടിക്കുറിപ്പിലെ തെറ്റിദ്ധരിപ്പിക്കാവുന്ന ‘കുറ്റപ്പെടുത്തി’ എന്ന പ്രയോഗം നീക്കി, അപമാനം, പ്രലോഭനം, പാപത്തിനുള്ള അവസരം എന്നീ സ്രോതസ്സനുസൃതമായ വിശാല അർഥസാധ്യതകൾ നൽകി. അനിവാര്യതയുടെ അടിസ്ഥാനം നിർവചിക്കാതെയും മനുഷ്യന്റെ ഉത്തരവാദിത്വത്തെ ഒഴിവാക്കാതെയും മൂലത്തിലെ സംഘർഷം നിലനിർത്തിയിരിക്കുന്നു.
