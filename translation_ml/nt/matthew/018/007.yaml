id: MAT.18.7
reference: Matthew 18:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐαὶ τῷ κόσμῳ ἀπὸ τῶν σκανδάλων· ἀνάγκη ⸀γὰρ ἐλθεῖν τὰ σκάνδαλα, πλὴν οὐαὶ τῷ ⸀ἀνθρώπῳ δι’ οὗ τὸ σκάνδαλον ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/007.yaml
  text: Woe to the world because of stumbling blocks[a]; for it is necessary that the stumbling blocks come[b], but woe to the man through whom the stumbling block comes.
translation:
  language: ml
  text: ഇടർച്ചകൾ[a] നിമിത്തം ലോകത്തിന് അയ്യോ കഷ്ടം! കാരണം, ഇടർച്ചകൾ വരേണ്ടത് അനിവാര്യമാണ്; എങ്കിലും ആരിലൂടെയാണോ ഇടർച്ച വരുന്നത്, ആ മനുഷ്യന് അയ്യോ കഷ്ടം![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അപമാനങ്ങൾ,” “പാപത്തിന് കാരണമാകുന്നവ,” അല്ലെങ്കിൽ “കെണികൾ” എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്കിലെ σκάνδαλον/σκάνδαλα ഒരാളെ അപമാനത്തിലൂടെയോ പ്രലോഭനത്തിലൂടെയോ പാപത്തിനുള്ള അവസരത്തിലൂടെയോ ഇടറാൻ ഇടയാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “മനുഷ്യൻ” എന്ന പദം ഗ്രീക്കിൽ പുല്ലിംഗ ഏകവചനമാണ്; ഇവിടെ അത്തരം ഇടർച്ച വരാൻ കാരണമാകുന്ന ഏതൊരു വ്യക്തിയെയും അത് പ്രതിനിധീകരിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: οὐαί
  choice: അയ്യോ കഷ്ടം!
  rationale: പ്രവാചകീയമായ അപലപനത്തിന്റെയും ന്യായവിധിമുന്നറിയിപ്പിന്റെയും ശക്തി നിലനിർത്തുന്ന, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗം; രണ്ടു വാക്യഭാഗങ്ങളിലും ആവർത്തനം കാത്തുസൂക്ഷിച്ചു.
- source_word: κόσμῳ
  choice: ലോകത്തിന്
  rationale: ഭൗതിക സൃഷ്ടിയെ മാത്രം സൂചിപ്പിക്കാതെ പാപബാധിതമായ മനുഷ്യലോകത്തെ വിശാലമായി ഉൾക്കൊള്ളുന്നു.
- source_word: ἀπὸ
  choice: നിമിത്തം
  rationale: ഇവിടെ ദുരിതത്തിന്റെ കാരണമോ ഉറവിടമോ സൂചിപ്പിക്കുന്ന ബന്ധം സംക്ഷിപ്തമായും ഗൗരവത്തോടെയും നൽകുന്നു.
- source_word: σκάνδαλα / σκάνδαλον
  choice: ഇടർച്ചകൾ / ഇടർച്ച
  rationale: ഒരാളെ തട്ടിവീഴ്ത്തുന്നതെന്ന രൂപകം നിലനിർത്തിക്കൊണ്ട് പാപപ്രലോഭനം, കുറ്റപ്പെടൽ, പാപഹേതു എന്നീ വിശാല അർഥസാധ്യതകൾ തുറന്നുവെക്കുന്നു; മൂലത്തിലെ ബഹുവചന-ഏകവചന വ്യത്യാസവും പാലിക്കുന്നു.
- source_word: ἀνάγκη
  choice: അനിവാര്യമാണ്
  rationale: ആവശ്യകതയെയോ ഒഴിവാക്കാനാകാത്ത സംഭവത്തെയോ വ്യക്തമാക്കുന്നു; അതിന്റെ അടിസ്ഥാനം ദൈവിക നിർണയമാണോ സാഹചര്യപരമായ അനിവാര്യതയാണോ എന്ന് അധികമായി നിർവചിക്കുന്നില്ല.
- source_word: γάρ
  choice: (വാക്യക്രമത്തിലൂടെ വിശദീകരണബന്ധം)
  rationale: മലയാളത്തിൽ പ്രത്യേകം 'എന്തെന്നാൽ' ചേർക്കുന്നത് വാക്യത്തെ കൃത്രിമമാക്കാം; മുൻപ്രഖ്യാപനത്തിന്റെ വിശദീകരണമെന്ന ബന്ധം തുടർച്ചയും അർധവിരാമവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐλθεῖν ... ἔρχεται
  choice: വരേണ്ടത് ... വരുന്നത്
  rationale: ഗ്രീക്കിലെ ഒരേ ക്രിയയുടെ ആവർത്തനവും സജീവമായ വരവ്-രൂപകവും മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: πλήν
  choice: എങ്കിലും
  rationale: ഇടർച്ചകളുടെ അനിവാര്യതയിൽനിന്ന് അവയ്ക്ക് ഇടയാക്കുന്ന വ്യക്തിയിലേക്കുള്ള ശക്തമായ വിരുദ്ധതിരിവ് വ്യക്തമാക്കുന്നു.
- source_word: ἀνθρώπῳ
  choice: ആ മനുഷ്യന്
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ഏകവചനരൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; അത് പ്രതിനിധിപരമായി ഏതൊരു വ്യക്തിയെയും ഉൾക്കൊള്ളുന്നതാണെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: δι’ οὗ
  choice: ആരിലൂടെയാണോ
  rationale: ഇടർച്ച വരുന്നതിന്റെ മനുഷ്യ മാധ്യമത്തെയോ പ്രവർത്തകനെയോ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ἀνάγκη γὰρ ἐλθεῖν τὰ σκάνδαλα എന്നതിലെ അനിവാര്യതയുടെ സ്വഭാവം
  choice: “വരേണ്ടത് അനിവാര്യമാണ്” എന്ന് വിവർത്തനം ചെയ്ത് അനിവാര്യത നിലനിർത്തി, അതിന്റെ കാരണം വ്യക്തമാക്കാതെ വിട്ടു.
  alternative: “ഇടർച്ചകൾ വരാതെ തരമില്ല” എന്ന പ്രായോഗിക അനിവാര്യതാഭാവം, അല്ലെങ്കിൽ ദൈവിക നിർണയം കൂടുതൽ സൂചിപ്പിക്കാവുന്ന “വന്നേ മതിയാകൂ.”
  rationale: ഗ്രീക്ക് അനിവാര്യത പ്രസ്താവിക്കുന്നുവെങ്കിലും അതിന്റെ അടിസ്ഥാനം വിശദീകരിക്കുന്നില്ല. അതിനാൽ ദൈവം നേരിട്ട് ഇടർച്ചകൾക്ക് കാരണമാകുന്നു എന്ന ആശയം ഇറക്കുമതി ചെയ്യാതെയും മൂലത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം മായ്ക്കാതെയും ഭാഷാന്തരം ചെയ്യുന്നു.
- issue: ἀνθρώπῳ എന്നതിന്റെ പ്രതിനിധിപരമായ പ്രയോഗം
  choice: മുഖ്യപാഠത്തിൽ “ആ മനുഷ്യന്” എന്നു പുല്ലിംഗ ഏകവചനം നിലനിർത്തി; പൊതുവ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: “ആ വ്യക്തിക്ക്” അല്ലെങ്കിൽ “ആർക്കുവഴിയാണോ.”
  rationale: മൂലരൂപം പുല്ലിംഗ ഏകവചനമാണ്; അതേസമയം മുന്നറിയിപ്പ് ഏതൊരു വ്യക്തിക്കും ബാധകമായ പ്രതിനിധിപരമായ അർഥം വഹിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. “ഇടർച്ച” എന്ന ബൈബിൾപരിചിതമായ രൂപകം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു. “അയ്യോ കഷ്ടം!” എന്ന ആവർത്തനം മൂലത്തിലെ വാചാടോപസമത്വവും മുന്നറിയിപ്പിന്റെ ശക്തിയും കാത്തുസൂക്ഷിക്കുന്നു.
