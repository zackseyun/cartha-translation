revisions:
- from: അവൻ കണക്കുകൾ തീർക്കാൻ തുടങ്ങിയപ്പോൾ, പതിനായിരം താലന്ത് കടപ്പെട്ടിരുന്ന ഒരു കടക്കാരനെ അവന്റെ അടുക്കൽ കൊണ്ടുവന്നു.[a]
  to: അവൻ കണക്കുകൾ തീർക്കാൻ തുടങ്ങിയപ്പോൾ, പതിനായിരം താലന്ത് കടപ്പെട്ടിരുന്ന ഒരാളെ അവന്റെ അടുക്കൽ കൊണ്ടുവന്നു.[a]
  rationale: The revision preserves every source-level element while removing a redundant expression and making the debtor reference more precise in modern standard Malayalam. The cultural note retains the English audit trail’s point that the amount is extraordinarily large, without asserting a disputed modern monetary conversion.
