id: MAT.18.24
reference: Matthew 18:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀρξαμένου δὲ αὐτοῦ συναίρειν ⸀προσηνέχθη ⸂αὐτῷ εἷς⸃ ὀφειλέτης μυρίων ταλάντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/024.yaml
  text: And when he began to settle accounts[a], one debtor who owed ten thousand talents was brought to him.
translation:
  language: ml
  text: അവൻ കണക്കുകൾ തീർക്കാൻ തുടങ്ങിയപ്പോൾ, പതിനായിരം താലന്ത് കടപ്പെട്ടിരുന്ന ഒരാളെ അവന്റെ അടുക്കൽ കൊണ്ടുവന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: താലന്ത് വളരെ വലിയ മൂല്യമുള്ള ഒരു ധനഘടകമായിരുന്നു; ഈ ഉപമയുടെ പശ്ചാത്തലത്തിൽ ‘പതിനായിരം താലന്ത്’ എന്നത് സങ്കൽപ്പിക്കാനാവാത്തത്ര വലിയ കടത്തെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: ἀρξαμένου δὲ αὐτοῦ συναίρειν
  choice: അവൻ കണക്കുകൾ തീർക്കാൻ തുടങ്ങിയപ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് മുഖ്യസംഭവത്തിന്റെ സമയസാഹചര്യം സൂചിപ്പിക്കുന്നു. സാമ്പത്തിക പശ്ചാത്തലത്തിൽ συναίρειν എന്നത് കണക്കുകൾ ഒത്തുതീർക്കുന്നതിനെ സൂചിപ്പിക്കുന്നതിനാൽ, ആ അർഥവും സ്വാഭാവികമായ മലയാളവും ഈ പരിഭാഷ നിലനിർത്തുന്നു.
- source_word: προσηνέχθη
  choice: കൊണ്ടുവന്നു
  rationale: അയാളെ മറ്റുള്ളവർ രാജാവിന്റെ സന്നിധിയിലേക്കു കൊണ്ടുവന്നുവെന്ന എയോറിസ്റ്റ് കർമണിപ്രയോഗത്തിന്റെ അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: αὐτῷ
  choice: അവന്റെ അടുക്കൽ
  rationale: προσφέρω എന്ന ക്രിയയുടെ കർമണിപ്രയോഗത്തോടൊപ്പമുള്ള ദത്തിവിന്റെ ദിശാസൂചന സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ‘അവന്റെ മുമ്പാകെ’ എന്നതും സാധ്യമാണ്.
- source_word: εἷς ὀφειλέτης
  choice: ഒരു കടക്കാരനെ
  rationale: εἷς ഒരു പ്രത്യേക വ്യക്തിയെ അനേകരിൽനിന്ന് പരിചയപ്പെടുത്തുന്നു. മലയാളത്തിൽ ‘ഒരു’ ഈ അർഥം സ്വാഭാവികമായി നൽകുന്നു; ὀφειλέτης എന്നതിന് ‘കടക്കാരൻ’ നേരിട്ടുള്ള സമാനപദമാണ്.
- source_word: μυρίων ταλάντων
  choice: പതിനായിരം താലന്ത്
  rationale: μύριοι എന്നതിന്റെ സംഖ്യാമൂല്യം ‘പതിനായിരം’ എന്നാണ്. താലന്ത് ചരിത്രപരമായ ഭാര-ധനമൂല്യഘടകമായതിനാലും ആധുനിക നാണയത്തിലേക്കുള്ള കൃത്യപരിവർത്തനം വിവാദമായതിനാലും പേര് ലിപ്യന്തരണം ചെയ്തു നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ചരിത്രപരമായ ‘താലന്ത്’ എന്ന പദം നിലനിർത്തി സാംസ്കാരിക വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകി.
