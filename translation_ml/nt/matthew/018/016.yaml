id: MAT.18.16
reference: Matthew 18:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐὰν δὲ μὴ ἀκούσῃ, παράλαβε μετὰ σοῦ ἔτι ἕνα ἢ δύο, ἵνα ἐπὶ στόματος δύο μαρτύρων ἢ τριῶν σταθῇ πᾶν ῥῆμα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/016.yaml
  text: But if he does not listen[a], take one or two others with you[b], so that by the mouth of two or three witnesses every matter may be established.
translation:
  language: ml
  text: എന്നാൽ അവൻ ചെവിക്കൊള്ളുന്നില്ലെങ്കിൽ, ഒന്നോ രണ്ടോ പേരെക്കൂടി നിന്നോടൊപ്പം കൊണ്ടുപോകുക; അങ്ങനെ രണ്ടോ മൂന്നോ സാക്ഷികളുടെ വായ്മൊഴിയാൽ[a] ഓരോ കാര്യവും ഉറപ്പിക്കപ്പെടേണ്ടതിന്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, കൂടുതൽ വ്യാഖ്യാനപരമായി: ‘രണ്ടോ മൂന്നോ സാക്ഷികളുടെ സാക്ഷ്യത്താൽ.’'
    reason: lexical_alternative
  - marker: b
    text: ആവർത്തനം 19:15-ലേക്കുള്ള സൂചന; അവിടെ ഒരു കാര്യം രണ്ടോ മൂന്നോ സാക്ഷികളുടെ അടിസ്ഥാനത്തിൽ ഉറപ്പിക്കപ്പെടുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: ἀκούσῃ
  choice: ചെവിക്കൊള്ളുന്നില്ലെങ്കിൽ
  rationale: ഈ ശാസനാസന്ദർഭത്തിൽ ക്രിയ വെറും ശബ്ദം കേൾക്കുന്നതിനെക്കാൾ ശ്രദ്ധിച്ചു കേട്ട് അനുസരിക്കുക എന്ന ആശയം നൽകുന്നു.
- source_word: παράλαβε μετὰ σοῦ ἔτι ἕνα ἢ δύο
  choice: ഒന്നോ രണ്ടോ പേരെക്കൂടി നിന്നോടൊപ്പം കൂട്ടിക്കൊണ്ടുപോകുക
  rationale: παράλαβε എന്ന ആജ്ഞയുടെ പ്രവർത്തനബലവും μετὰ σοῦ എന്ന സഹഗമനവും ἔτι സൂചിപ്പിക്കുന്ന അധികപേരെന്ന ആശയവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐπὶ στόματος
  choice: വായ്മൊഴിയാൽ
  rationale: ആവർത്തനം 19:15-ലെ സെമിറ്റിക് നിയമപ്രയോഗമായ ‘വായാൽ’ എന്ന രൂപകത്തെ മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന വിധം സംരക്ഷിക്കുന്നു; ‘സാക്ഷ്യത്താൽ’ എന്ന വ്യാഖ്യാനപരമായ രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: μαρτύρων
  choice: സാക്ഷികളുടെ
  rationale: വസ്തുതയോ കാര്യമോ സ്ഥിരീകരിക്കുന്നവരെ സൂചിപ്പിക്കുന്ന സാധാരണ നിയമപരമായ പദം.
- source_word: σταθῇ
  choice: ഉറപ്പിക്കപ്പെടേണ്ടതിനാണ്
  rationale: നിയമപരമായ പശ്ചാത്തലത്തിൽ ‘നിലനിൽക്കുക’ എന്നതിന്റെ സ്ഥിരീകരിക്കപ്പെടുക/സ്ഥാപിക്കപ്പെടുക എന്ന അർഥം നൽകുകയും ἵνα-യുടെ ഉദ്ദേശ്യഭാവം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: πᾶν ῥῆμα
  choice: ഓരോ കാര്യവും
  rationale: അക്ഷരാർഥമായ ‘ഓരോ വാക്കും’ എന്നതിലുപരി, ആവർത്തനപുസ്തകത്തിലെ നിയമസന്ദർഭത്തിൽ പരിഗണനയിലുള്ള ഓരോ വിഷയത്തെയും സൂചിപ്പിക്കുന്നു; ‘കുറ്റാരോപണം’ എന്നതിലേക്കു അനാവശ്യമായി ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: പഴയനിയമത്തിലെ സാക്ഷിവ്യവസ്ഥയിലേക്കുള്ള സൂചനയും സമൂഹശാസനത്തിന്റെ സന്ദർഭവും
  choice: നിയമപരമായ അർഥം വ്യക്തമായി നൽകിക്കൊണ്ട് ‘വായ്മൊഴിയാൽ’ എന്ന ബൈബിൾപ്രയോഗത്തിന്റെ രൂപകഭാവം സംരക്ഷിച്ചു.
  alternative: ‘രണ്ടോ മൂന്നോ സാക്ഷികളുടെ സാക്ഷ്യത്താൽ ഓരോ കാര്യവും സ്ഥിരീകരിക്കപ്പെടേണ്ടതിന്’ എന്ന് കൂടുതൽ വ്യാഖ്യാനപരമായി പരിഭാഷപ്പെടുത്താം.
  rationale: വാക്യം ആവർത്തനം 19:15-ലെ രണ്ടോ മൂന്നോ സാക്ഷികളുടെ തത്ത്വം സമൂഹത്തിലെ തിരുത്തൽ നടപടിയിൽ പ്രയോഗിക്കുന്നു. പരിഭാഷ അതിനെ ‘കുറ്റാരോപണം’ എന്ന ഒറ്റ ആശയത്തിലേക്ക് ചുരുക്കാതെയും നിയമപരമായ ശക്തി നഷ്ടപ്പെടുത്താതെയും അവതരിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ചെവിക്കൊള്ളുക’ പ്രതികരണപരമായി കേൾക്കുക എന്ന ഭാവവും ‘വായ്മൊഴിയാൽ’ മൂലത്തിലെ നിയമപരമായ ബൈബിൾപ്രയോഗവും നിലനിർത്തുന്നു.
