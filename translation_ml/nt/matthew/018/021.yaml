id: MAT.18.21
reference: Matthew 18:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τότε προσελθὼν ⸂αὐτῷ ὁ Πέτρος εἶπεν⸃· Κύριε, ποσάκις ἁμαρτήσει εἰς ἐμὲ ὁ ἀδελφός μου καὶ ἀφήσω αὐτῷ; ἕως ἑπτάκις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/021.yaml
  text: Then Peter came up to him and said[a], “Lord, how many times will my brother sin against me, and I forgive him? Up to seven times?”
translation:
  language: ml
  text: 'അപ്പോൾ പത്രോസ് യേശുവിന്റെ അടുക്കൽ വന്ന് പറഞ്ഞു: “കർത്താവേ, എന്റെ സഹോദരൻ[a] എനിക്കെതിരേ പാപം ചെയ്യുമ്പോൾ ഞാൻ അവനോടു എത്ര പ്രാവശ്യം ക്ഷമിക്കണം? ഏഴു പ്രാവശ്യംവരെയോ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “എന്റെ സഹോദരനോ സഹോദരിയോ.” ഗ്രീക്കിൽ “എന്റെ സഹോദരൻ” എന്നു പുല്ലിംഗ ഏകവചനത്തിലാണ്; എന്നാൽ സന്ദർഭത്തിൽ ഇത് ഒരു സഹശിഷ്യനെ പൊതുവായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: അപ്പോൾ
  rationale: കാലക്രമവും വിവരണത്തിന്റെ തുടർച്ചയും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: προσελθὼν αὐτῷ
  choice: യേശുവിന്റെ അടുക്കൽ വന്ന്
  rationale: προσέρχομαι എന്നതിലെ സമീപിച്ചുവരുന്ന ചലനം നിലനിർത്തുന്നു; സർവനാമത്തിന്റെ സൂചിതവ്യക്തിയായ യേശുവിനെ മലയാളത്തിൽ വ്യക്തമായി പറയുന്നു.
- source_word: ὁ Πέτρος εἶπεν
  choice: പത്രോസ് ... പറഞ്ഞു
  rationale: പേരും സാധാരണ സംസാരക്രിയയും നേരിട്ട് പുനരാവിഷ്കരിക്കുന്നു; ചോദ്യരൂപം ഉള്ളടക്കത്തിൽ വ്യക്തമാകുന്നു.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: κύριος എന്ന അഭിസംബോധനയുടെ ആദരവും ദൈവശാസ്ത്രപരമായ അനുരണനവും നിലനിർത്തുന്ന പതിവ് മലയാളരൂപം.
- source_word: ποσάκις
  choice: എത്ര പ്രാവശ്യംവരെ
  rationale: തുടർന്നുള്ള സംഖ്യാത്മക പരിധിയുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു; ‘വരെ’ എന്നത് ἕως ഉന്നയിക്കുന്ന പരിധിയിലേക്കുള്ള ചോദ്യം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἁμαρτήσει εἰς ἐμὲ
  choice: എനിക്കെതിരേ പാപം ചെയ്യുകയും
  rationale: ഭാവാർഥവും εἰς ἐμέ സൂചിപ്പിക്കുന്ന വ്യക്തിക്കെതിരായ കുറ്റവും സംരക്ഷിക്കുന്നു.
- source_word: ὁ ἀδελφός μου
  choice: എന്റെ സഹോദരൻ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ഏകവചനരൂപം നേരിട്ട് നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ വിശാല പ്രയോഗസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: καὶ ἀφήσω αὐτῷ
  choice: ഞാൻ അവനോടു ക്ഷമിക്കുകയും ചെയ്യുന്നത്
  rationale: ἀφίημι എന്നതിന്റെ നൈതികസന്ദർഭത്തിലുള്ള ‘ക്ഷമിക്കുക’ എന്ന അർഥവും ഏകോപിത ഘടനയും സംരക്ഷിക്കുന്നു.
- source_word: ἕως ἑπτάκις
  choice: ഏഴു പ്രാവശ്യംവരെയോ?
  rationale: പത്രോസ് നിർദേശിക്കുന്ന പരമാവധി പരിധി ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
theological_decisions:
- issue: സന്ദർഭത്തിൽ ἀδελφός എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: മുഖ്യവാചകത്തിൽ ‘എന്റെ സഹോദരൻ’
  alternative: ‘എന്റെ സഹോദരനോ സഹോദരിയോ’; ‘സഹശിഷ്യൻ’
  rationale: മൂലപദം പുല്ലിംഗ ഏകവചനമാണെങ്കിലും സന്ദർഭത്തിൽ സഹശിഷ്യരെ പൊതുവായി സൂചിപ്പിക്കാം. ആ സാധ്യത വാചകത്തിൽ നിർബന്ധിച്ച് തീർപ്പാക്കാതെ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ഭാഷ. ‘കർത്താവേ’, ‘പാപം’, ‘ക്ഷമിക്കുക’ എന്നീ പരിചിതമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തി; ഗ്രീക്ക് വാക്യത്തിലെ ഭാവാർഥവും പരിധിയെക്കുറിച്ചുള്ള ചോദ്യവും മലയാളത്തിൽ വായനാസൗകര്യത്തോടെ അവതരിപ്പിച്ചു.
