id: MAT.18.14
reference: Matthew 18:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὕτως οὐκ ἔστιν θέλημα ⸀ἔμπροσθεν τοῦ πατρὸς ⸀ὑμῶν τοῦ ἐν οὐρανοῖς ἵνα ἀπόληται ⸀ἓν τῶν μικρῶν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/014.yaml
  text: In the same way, it is not the will of your Father in heaven that even one of these little ones should perish.
translation:
  language: ml
  text: അതുപോലെ, ഈ ചെറിയവരിൽ ഒരാൾപോലും നശിച്ചുപോകുന്നത് സ്വർഗസ്ഥനായ നിങ്ങളുടെ പിതാവിന്റെ ഇഷ്ടമല്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഈ ചെറിയവരിൽ ഒരാൾപോലും നഷ്ടമാകുന്നത്.” ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘നശിക്കുക’ എന്നും ‘നഷ്ടമാകുക’ എന്നും അർഥമാകാം; തൊട്ടുമുൻപുള്ള വഴിതെറ്റിയ ആടിന്റെ സന്ദർഭം രണ്ടാമത്തെ അർഥത്തെ പിന്തുണയ്ക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: അതുപോലെ
  rationale: മുൻപുള്ള വഴിതെറ്റിയ ആടിന്റെ ഉപമയോടുള്ള ബന്ധവും താരതമ്യഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: οὐκ ἔστιν θέλημα ἔμπροσθεν τοῦ πατρὸς
  choice: പിതാവിന്റെ ഇഷ്ടമല്ല
  rationale: ἔμπροσθεν എന്നതിന്റെ അക്ഷരാർഥം ‘മുമ്പാകെ’ എന്നാണെങ്കിലും, ഈ ഗ്രീക്ക് പ്രയോഗം പിതാവിന്റെ ഇഷ്ടം/ആഗ്രഹം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘പിതാവിന്റെ മുമ്പാകെയുള്ള ഇഷ്ടമല്ല’ എന്നത് അസ്വാഭാവികമാണ്.
- source_word: πατρὸς ὑμῶν τοῦ ἐν οὐρανοῖς
  choice: സ്വർഗസ്ഥനായ നിങ്ങളുടെ പിതാവ്
  rationale: ‘സ്വർഗങ്ങളിൽ ഉള്ള നിങ്ങളുടെ പിതാവ്’ എന്ന അക്ഷരാർഥത്തെ ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἵνα ἀπόληται
  choice: നശിച്ചുപോകുന്നത്
  rationale: ἀπόλλυμι ഇവിടെ ‘നശിക്കുക’ എന്നും ‘നഷ്ടപ്പെടുക/വഴിതെറ്റിപ്പോകുക’ എന്നും ഗ്രഹിക്കാം. പ്രധാനപാഠം ഫലത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു; സന്ദർഭസൂചനയായ മറ്റർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἓν τῶν μικρῶν τούτων
  choice: ഈ ചെറിയവരിൽ ഒരാൾപോലും
  rationale: μικροί എന്നത് കുട്ടികളെ മാത്രം നിർബന്ധമായി സൂചിപ്പിക്കാതെ ശിഷ്യത്വസന്ദർഭത്തിലെ ‘ചെറിയവർ’ എന്ന വിശാലത നിലനിർത്തുന്നു. ‘ഒരാൾപോലും’ ഏകവചനത്തിന്റെ സന്ദർഭപരമായ ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ἀπόληται എന്നതിന്റെ അർഥം വഴിതെറ്റിയ ആടിന്റെ തൊട്ടുമുൻപുള്ള സന്ദർഭത്തിൽ
  choice: നശിച്ചുപോകുന്നത്
  alternative: നഷ്ടപ്പെട്ടുപോകുന്നത് / വഴിതെറ്റിപ്പോകുന്നത്
  rationale: ഈ ക്രിയ അന്തിമനാശത്തെയും നഷ്ടപ്പെടൽ/വഴിതെറ്റൽ എന്ന ആശയത്തെയും സൂചിപ്പിക്കാം. മുന്നറിയിപ്പിന്റെ ഗൗരവം പ്രധാനപാഠത്തിൽ നിലനിർത്തിക്കൊണ്ട്, ഉപമയുമായി അടുത്ത ബന്ധമുള്ള മറ്റർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ചെറിയവർ’ എന്ന പ്രയോഗം പ്രായത്തെ മാത്രം നിർണ്ണയിക്കാതെ മൂലപാഠത്തിലെ രൂപകപരവും ബന്ധപരവുമായ വ്യാപ്തി നിലനിർത്തുന്നു.
