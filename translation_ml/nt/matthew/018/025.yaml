  to: എന്നാൽ, തിരിച്ചടയ്ക്കാൻ അയാൾക്കു കഴിയാതിരുന്നതിനാൽ, അയാളെയും അയാളുടെ ഭാര്യയെയും മക്കളെയും അയാൾക്കുണ്ടായിരുന്നതെല്ലാം വിൽക്കാനും[a], തിരിച്ചടവ് നടത്താനും യജമാനൻ കല്പിച്ചു.
