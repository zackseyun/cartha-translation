id: MAT.18.25
reference: Matthew 18:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μὴ ἔχοντος δὲ αὐτοῦ ἀποδοῦναι ἐκέλευσεν αὐτὸν ὁ ⸀κύριος πραθῆναι καὶ τὴν ⸀γυναῖκα καὶ τὰ τέκνα καὶ πάντα ὅσα ⸀ἔχει καὶ ἀποδοθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/025.yaml
  text: But since he was unable to repay[a], the master ordered that he be sold, along with his wife and children and all that he had[b], and that payment be made.
translation:
  language: ml
  text: എന്നാൽ, തിരിച്ചടയ്ക്കാൻ അയാൾക്കു കഴിയാതിരുന്നതിനാൽ, അയാളെയും അയാളുടെ ഭാര്യയെയും മക്കളെയും അയാൾക്കുണ്ടായിരുന്നതെല്ലാം വിൽക്കാനും[a], തിരിച്ചടവ് നടത്താനും യജമാനൻ കല്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ ഉപമയിൽ പ്രതിഫലിക്കുന്ന കാലത്തെ സാമൂഹിക-നിയമപരമായ സാഹചര്യത്തിൽ, കടം ഈടാക്കുന്നതിനായി കടക്കാരനെയും കുടുംബത്തെയും അടിമകളായി വിൽക്കുകയും അയാളുടെ സ്വത്തുക്കൾ വിറ്റഴിക്കുകയും ചെയ്യാമായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: μὴ ἔχοντος δὲ αὐτοῦ ἀποδοῦναι
  choice: എന്നാൽ തിരിച്ചടയ്ക്കാൻ അയാൾക്കു കഴിയാതിരുന്നതിനാൽ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് കടം തിരിച്ചടയ്ക്കാൻ ആവശ്യമായ വക അയാൾക്കില്ലായിരുന്ന സാഹചര്യം/കാരണം സൂചിപ്പിക്കുന്നു. ‘കഴിയാതിരുന്നതിനാൽ’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികമായി ഈ അർഥം നൽകുന്നു; ‘ഒന്നും ഇല്ലാതിരുന്നതിനാൽ’ എന്നു പറഞ്ഞാൽ തുടർന്നുള്ള ‘അയാൾക്കുണ്ടായിരുന്നതെല്ലാം’ എന്ന വാക്യഭാഗവുമായി അനാവശ്യമായ വൈരുധ്യം തോന്നാം.
- source_word: ἐκέλευσεν
  choice: കല്പിച്ചു
  rationale: അധികാരപൂർവമായ ഉത്തരവാണ് κελεύω സൂചിപ്പിക്കുന്നത്; ‘കല്പിച്ചു’ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ പ്രയോഗമാണ്.
- source_word: ὁ κύριος
  choice: യജമാനൻ
  rationale: ഉപമയിലെ ദാസന്റെ മനുഷ്യാധികാരിയെയാണ് ഇവിടെ κύριος സൂചിപ്പിക്കുന്നത്. ‘യജമാനൻ’ സന്ദർഭോചിതവും സ്വാഭാവികവും ആണ്; നേരിട്ടുള്ള ദൈവിക പദവിയായി തെറ്റിദ്ധരിക്കപ്പെടുന്നത് ഒഴിവാക്കുന്നു.
- source_word: πραθῆναι
  choice: വിൽക്കാൻ
  rationale: നിഷ്ക്രിയ അനന്തക്രിയയായ πραθῆναι, കടം തീർക്കുന്നതിനായി ആ മനുഷ്യനെ വിൽക്കാനുള്ള ഉത്തരവിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ സംയുക്ത പട്ടികയിൽ നിഷ്ക്രിയത്വം സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: τὴν γυναῖκα καὶ τὰ τέκνα
  choice: അയാളുടെ ഭാര്യയെയും മക്കളെയും
  rationale: ഗ്രീക്കിലെ നിർദ്ദേശക ആർട്ടിക്കിളുകൾ മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധസൂചക സർവനാമത്തിലൂടെ അവതരിപ്പിക്കുന്നു.
- source_word: πάντα ὅσα ἔχει
  choice: അയാൾക്കുണ്ടായിരുന്നതെല്ലാം
  rationale: അയാളുടെ സകല സ്വത്തുവകകളെയും ഉൾക്കൊള്ളുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ വ്യാപ്തി കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: καὶ ἀποδοθῆναι
  choice: തുക തിരിച്ചടയ്ക്കാനും
  rationale: വിൽപ്പനയിലൂടെ പണം ലഭ്യമാക്കി തിരിച്ചടവ് നടത്തുക എന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ഗ്രീക്കിൽ വ്യക്തമാക്കാത്ത കടത്തിന്റെ പൂർണ തീർപ്പിനെ പ്രസ്താവിക്കുന്നില്ല.
theological_decisions:
- issue: ഉപമയിലെ κύριος എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: യജമാനൻ
  alternative: കർത്താവ്
  rationale: കഥയ്ക്കുള്ളിലെ ദാസന്റെ മനുഷ്യാധികാരിയെയാണ് ഈ പദം നേരിട്ട് സൂചിപ്പിക്കുന്നത്. ‘കർത്താവ്’ എന്നത് ഇവിടെ നേരിട്ടുള്ള ദൈവിക/ക്രിസ്തുവിശേഷ പദവിയാണെന്ന ധാരണ സൃഷ്ടിക്കാം; ‘യജമാനൻ’ പദത്തിന്റെ സാമൂഹികബന്ധവും ഉപമയുടെ തലവും വ്യക്തമാക്കുന്നു.
- issue: വിൽപ്പനയും തിരിച്ചടവും തമ്മിലുള്ള ബന്ധം
  choice: വിൽക്കാനും തുക തിരിച്ചടയ്ക്കാനും
  alternative: വിറ്റ് കടം മുഴുവനായി വീട്ടാനും
  rationale: ἀποδοθῆναι തിരിച്ചടവ് നടത്തണമെന്ന് പറയുന്നു; വിൽപ്പനയിൽനിന്ന് മുഴുവൻ കടവും തീർന്നുവെന്ന് ഗ്രീക്ക് ഉറപ്പിക്കുന്നില്ല. അതിനാൽ ‘മുഴുവനായി’ ചേർക്കാതെ ഉള്ളിലെ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള സാധാരണ മലയാളം. ‘യജമാനൻ’, ‘കല്പിച്ചു’, ‘തിരിച്ചടയ്ക്കുക’ എന്നീ പദങ്ങൾ ഉപമയുടെ സാമൂഹികവും സാമ്പത്തികവുമായ പശ്ചാത്തലം വ്യക്തമായി നിലനിർത്തുന്നു.
