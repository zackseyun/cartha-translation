id: MAT.18.17
reference: Matthew 18:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐὰν δὲ παρακούσῃ αὐτῶν, εἰπὸν τῇ ἐκκλησίᾳ· ἐὰν δὲ καὶ τῆς ἐκκλησίας παρακούσῃ, ἔστω σοι ὥσπερ ὁ ἐθνικὸς καὶ ὁ τελώνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/017.yaml
  text: But if he refuses to listen to them[a], tell it to the assembly. And if he also refuses to listen to the assembly, let him be to you like the Gentile and the tax collector.
translation:
  language: ml
  text: എന്നാൽ അവരെ കേൾക്കാൻ അവൻ വിസമ്മതിച്ചാൽ, ആ കാര്യം സഭയോടു പറയുക.[a] സഭയെയും കേൾക്കാൻ അവൻ വിസമ്മതിച്ചാൽ, അവൻ നിനക്ക് വിജാതീയനെയും ചുങ്കക്കാരനെയും പോലെ ആയിരിക്കട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“സഭ” എന്നതിന്, കൂടിവരുന്ന സമൂഹം എന്ന അർഥത്തിൽ, “കൂട്ടായ്മ,” “സഭാസമൂഹം,” “ചർച്ച്,” അല്ലെങ്കിൽ “കോൺഗ്രിഗേഷൻ” എന്നും പരിഭാഷപ്പെടുത്താം (ഗ്രീക്ക്: എക്ക്ലേസിയ).'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακούσῃ
  choice: വാക്കു കേൾക്കാൻ വിസമ്മതിച്ചാൽ
  rationale: കേവലം കേൾക്കാതിരിക്കുക എന്നതിലുപരി, പറഞ്ഞത് ചെവിക്കൊള്ളാൻ മനപ്പൂർവം വിസമ്മതിക്കുന്ന അർഥം ഈ ശാസനാസന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: εἰπὸν
  choice: ആ കാര്യം ... പറയുക
  rationale: സന്ദർഭത്തിൽ സൂചിതമായ വിഷയത്തെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: ἐκκλησίᾳ / ἐκκλησίας
  choice: സഭ / സഭയുടെ
  rationale: കൂടിവരുന്ന വിശ്വാസസമൂഹത്തെ സൂചിപ്പിക്കുന്ന, ആധുനിക മലയാളത്തിൽ പരിചിതവും ഗൗരവമുള്ളതുമായ പദം. സ്ഥാപനപരമായ പ്രത്യേക സഭാവിഭാഗധാരണ ഇവിടെ ചേർക്കുന്നില്ല.
- source_word: ἔστω σοι
  choice: അവൻ നിനക്ക് ... ആയിരിക്കട്ടെ
  rationale: ഗ്രീക്കിലെ ആജ്ഞാർഥബലവും σοι എന്ന ഏകവചന ദത്തിവിഭക്തിയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ὥσπερ
  choice: '...പോലെ'
  rationale: ഉപമയെ വ്യാഖ്യാനിച്ച് നടപടിക്രമമാക്കി മാറ്റാതെ അതേ രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὁ ἐθνικὸς
  choice: വിജാതീയൻ
  rationale: യഹൂദസന്ദർഭത്തിൽ ഉടമ്പടിസമൂഹത്തിനു പുറത്തുള്ള ജനവിഭാഗാംഗത്തെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗതവും മനസ്സിലാകുന്നതുമായ മലയാളപദം.
- source_word: ὁ τελώνης
  choice: ചുങ്കക്കാരൻ
  rationale: റോമൻ കാലത്തെ നികുതി/ചുങ്കം പിരിക്കുന്നയാളെ സൂചിപ്പിക്കുന്ന ബൈബിൾസന്ദർഭത്തിന് യോജിച്ച മലയാളപ്രയോഗം.
theological_decisions:
- issue: പുനരുത്ഥാനത്തിനു മുമ്പുള്ള മത്തായിയുടെ ശാസനാസന്ദർഭത്തിൽ ἐκκλησία എന്നതിന്റെ പരിഭാഷ
  choice: സഭ
  alternative: കൂട്ടായ്മ / സഭാസമൂഹം
  rationale: മലയാള ബൈബിൾഭാഷയിൽ ‘സഭ’ കൂടിവരുന്ന വിശ്വാസസമൂഹത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു. പ്രത്യേക സ്ഥാപനമോ സഭാവിഭാഗമോ ഇതിൽ നിർബന്ധമായി വായിച്ചുചേർക്കുന്നില്ല; പദത്തിന്റെ സമൂഹപരമായ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: അനുതപിക്കാത്ത വ്യക്തിയെ പുറത്തുള്ളവനെന്ന നിലയിൽ കാണുന്നതിന്റെ ശക്തി
  choice: അവൻ നിനക്ക് വിജാതീയനെയും ചുങ്കക്കാരനെയുംപോലെ ആയിരിക്കട്ടെ
  alternative: അവനെ വിജാതീയനെയും ചുങ്കക്കാരനെയുംപോലെ പരിഗണിക്കുക
  rationale: മൂലത്തിലെ ഉപമയും ἔστω σοι എന്ന പ്രയോഗവും നിലനിർത്തി, വാക്യം പറയുന്നതിലധികമായ ഒരു സമ്പൂർണ ബഹിഷ്കരണനടപടി പരിഭാഷയിൽ ചേർക്കാതിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അവൻ’, ‘നിനക്ക്’ എന്നീ ഏകവചനരൂപങ്ങൾ ഗ്രീക്ക് വചനത്തിന്റെ വ്യാകരണസവിശേഷത നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം പ്രധാനവാചകത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
