id: MAT.18.20
reference: Matthew 18:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὗ γάρ εἰσιν δύο ἢ τρεῖς συνηγμένοι εἰς τὸ ἐμὸν ὄνομα, ἐκεῖ εἰμι ἐν μέσῳ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/020.yaml
  text: For where two or three are gathered in my name[a], there I am in their midst.
translation:
  language: ml
  text: എന്തെന്നാൽ, രണ്ടോ മൂന്നോ പേർ എന്റെ നാമത്തിൽ ഒരുമിച്ചുകൂടിയിരിക്കുന്നിടത്ത്, അവിടെ ഞാൻ അവരുടെ നടുവിലുണ്ട്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവരുടെ ഇടയിലുണ്ട്.’
    reason: ἐν μέσῳ αὐτῶν എന്ന പ്രയോഗത്തിന്റെ സ്വാഭാവികമായ മറ്റൊരു മലയാളപരിഭാഷ.
lexical_decisions:
- source_word: οὗ
  choice: ഒരുമിച്ചുകൂടിയിരിക്കുന്നിടത്ത്
  rationale: സ്ഥലസൂചകമായ ഉപവാക്യം സ്വാഭാവിക മലയാളത്തിൽ ‘...ഇടത്ത്’ എന്ന രൂപത്തിൽ അവതരിപ്പിക്കുന്നു; ‘എവിടെയൊക്കെയോ’ എന്ന വിപുലമായ അർഥം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: γάρ
  choice: എന്തെന്നാൽ
  rationale: മുൻസന്ദർഭത്തോടുള്ള വിശദീകരണബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: δύο ἢ τρεῖς
  choice: രണ്ടോ മൂന്നോ പേർ
  rationale: സംഖ്യാവാചകം നേരിട്ട് നിലനിർത്തുകയും വ്യക്തികളെ സൂചിപ്പിക്കാൻ മലയാളത്തിൽ ആവശ്യമായ ‘പേർ’ ചേർക്കുകയും ചെയ്യുന്നു.
- source_word: συνηγμένοι
  choice: ഒരുമിച്ചുകൂടിയിരിക്കുന്ന
  rationale: പൂർണ്ണകാല കർമണി പങ്കുപദം സൂചിപ്പിക്കുന്ന, കൂടിച്ചേർന്നതിന്റെ തുടരുന്ന അവസ്ഥ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘കൂട്ടപ്പെട്ടിരിക്കുന്ന’ എന്ന കൃത്രിമമായ പ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: εἰς τὸ ἐμὸν ὄνομα
  choice: എന്റെ നാമത്തിൽ
  rationale: യേശുവിന്റെ നാമത്തെ ആധാരമാക്കി, അതിന്റെ അധികാരത്തിലും ബന്ധത്തിലും കൂടിവരുന്നതിനെ സൂചിപ്പിക്കുന്ന പതിവും ഗൗരവമുള്ളതുമായ മലയാളപ്രയോഗം.
- source_word: ἐκεῖ
  choice: അവിടെ
  rationale: οὗ എന്ന സ്ഥലസൂചനയോടുള്ള ‘എവിടെ/അവിടെ’ ബന്ധം നിലനിർത്തുന്നു.
- source_word: εἰμι
  choice: ഞാൻ ... ഉണ്ട്
  rationale: ഗ്രീക്കിലെ ലളിതമായ വർത്തമാനകാല അസ്തിത്വപ്രസ്താവന നേരിട്ട് നൽകുന്നു; ‘സന്നിഹിതനാണ്’ എന്ന വ്യാഖ്യാനപരമായ വികസനം ഒഴിവാക്കുന്നു.
- source_word: ἐν μέσῳ αὐτῶν
  choice: അവരുടെ നടുവിൽ
  rationale: ഗ്രീക്കിലെ സ്ഥലപരമായ ദൃശ്യഭാവം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; ‘അവരുടെ ഇടയിൽ’ എന്നതും സാധുവായ മറ്റൊരു പരിഭാഷയാണ്.
theological_decisions:
- issue: തന്റെ നാമത്തിൽ കൂടിവരുന്നവരുടെ നടുവിലുള്ള യേശുവിന്റെ സാന്നിധ്യം
  choice: ‘ഞാൻ അവരുടെ നടുവിലുണ്ട്’ എന്ന് നേരിട്ട് പരിഭാഷപ്പെടുത്തി യേശുവിന്റെ സാന്നിധ്യത്തെ ഉറപ്പിക്കുന്നു; അതിന്റെ രീതി നിർവചിക്കുന്നില്ല.
  alternative: ‘ഞാൻ അവരോടൊപ്പം സന്നിഹിതനാണ്’ എന്ന കൂടുതൽ വ്യാഖ്യാനപരമായ പരിഭാഷ, അല്ലെങ്കിൽ പ്രത്യേക സഭാപരമോ കൂദാശാപരമോ ആയ സിദ്ധാന്തത്തോട് ബന്ധിപ്പിച്ച വായന.
  rationale: വാക്യം യേശുവിന്റെ യഥാർഥ സാന്നിധ്യം പ്രസ്താവിക്കുന്നുവെങ്കിലും ആ സാന്നിധ്യത്തിന്റെ തത്ത്വശാസ്ത്രപരമായ രീതി വ്യക്തമാക്കുന്നില്ല. അതിനാൽ അവകാശവാദം നിലനിർത്തുകയും പിൽക്കാല സഭാവിഭാഗീയ നിർവചനങ്ങൾ ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവം നിലനിർത്തുന്നു. ‘ഒരുമിച്ചുകൂടിയിരിക്കുന്ന’ എന്ന രൂപം ഗ്രീക്ക് പൂർണ്ണകാല പങ്കുപദത്തിന്റെ ഫലാവസ്ഥ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ‘നാമത്തിൽ’ എന്ന പരമ്പരാഗതവും ഇന്നും ഗ്രാഹ്യവുമായ പ്രയോഗം സംരക്ഷിക്കുന്നു.
