id: MAT.18.1
reference: Matthew 18:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐν ἐκείνῃ τῇ ὥρᾳ προσῆλθον οἱ μαθηταὶ τῷ Ἰησοῦ λέγοντες· Τίς ἄρα μείζων ἐστὶν ἐν τῇ βασιλείᾳ τῶν οὐρανῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/001.yaml
  text: At that time the disciples came to Jesus, saying, “Who then is greater in the kingdom of heaven?”
translation:
  language: ml
  text: ആ സമയത്ത് ശിഷ്യന്മാർ യേശുവിന്റെ അടുക്കൽ വന്ന്, “അപ്പോൾ, സ്വർഗരാജ്യത്തിൽ വലിയവൻ ആരാണ്?” എന്നു ചോദിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: ആ സമയത്ത്
  rationale: ഗ്രീക്ക് സമയസൂചനയുടെ അർഥം സ്വാഭാവികവും ചുരുക്കവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: προσῆλθον ... τῷ Ἰησοῦ
  choice: യേശുവിന്റെ അടുക്കൽ വന്ന്
  rationale: യേശുവിനെ സമീപിച്ചു എന്ന ദത്തിവ് ഘടനയുടെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: λέγοντες
  choice: ചോദിച്ചു
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള ചോദ്യം പരിഗണിച്ച്, അക്ഷരാർഥമായ ‘പറഞ്ഞുകൊണ്ട്’ എന്നതിനെക്കാൾ സ്വാഭാവികമായ സംഭാഷണരൂപം ഉപയോഗിക്കുന്നു.
- source_word: Τίς ἄρα μείζων ἐστὶν
  choice: ആരാണ് വലിയവൻ?
  rationale: മείζων എന്ന താരതമ്യരൂപത്തെ ‘വലിയവൻ’ എന്നു നൽകി, മൂലപാഠത്തിലെ താരതമ്യനിറം ‘ഏറ്റവും വലിയവൻ’ എന്നു ശക്തിപ്പെടുത്താതെ സംരക്ഷിക്കുന്നു.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: സ്വർഗരാജ്യം
  rationale: മത്തായിയുടെ സ്ഥിരപ്രയോഗത്തിന് മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും അർഥസമ്പന്നവുമായ സംയുക്തപദം.
theological_decisions:
- issue: മείζων എന്ന താരതമ്യവിശേഷണത്തിന്റെ അർഥം
  choice: വലിയവൻ
  alternative: ഏറ്റവും വലിയവൻ
  rationale: ഗ്രീക്കിൽ രൂപപരമായി താരതമ്യപദമാണ്; സന്ദർഭത്തിൽ അത്യുത്തമാർഥം സാധ്യമെങ്കിലും അത് നിർബന്ധമായി നിശ്ചയിക്കാതെ മൂലത്തിലെ അർഥതുറപ്പ് നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. നേരിട്ടുള്ള ചോദ്യത്തിന്റെ സ്വാഭാവിക ഒഴുക്ക് സംരക്ഷിച്ചിരിക്കുന്നു.
