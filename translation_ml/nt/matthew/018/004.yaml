id: MAT.18.4
reference: Matthew 18:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅστις οὖν ταπεινώσει ἑαυτὸν ὡς τὸ παιδίον τοῦτο, οὗτός ἐστιν ὁ μείζων ἐν τῇ βασιλείᾳ τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/004.yaml
  text: Therefore, whoever humbles himself like this child, he is the greatest in the kingdom of heaven.
translation:
  language: ml
  text: അതുകൊണ്ട്, ഈ കുട്ടിയെപ്പോലെ സ്വയം താഴ്ത്തുന്നവൻ ആരായാലും, അവനാണ് സ്വർഗരാജ്യത്തിൽ ഏറ്റവും വലിയവൻ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταπεινώσει ἑαυτόν
  choice: സ്വയം താഴ്ത്തുന്നവൻ
  rationale: സ്വമേധയാ തന്നെ താഴ്ത്തുക, വിനയാന്വിതനാകുക എന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: ὡς τὸ παιδίον τοῦτο
  choice: ഈ കുട്ടിയെപ്പോലെ
  rationale: ὡς എന്ന ഉപമാസൂചകവും τοῦτο എന്ന സമീപസൂചകവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ὁ μείζων
  choice: ഏറ്റവും വലിയവൻ
  rationale: സന്ദർഭത്തിലെ താരതമ്യത്തിന്റെ പരമപ്രാധാന്യാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: സ്വർഗരാജ്യം
  rationale: മത്തായിയുടെ സവിശേഷ പ്രയോഗത്തിന് മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും സംക്ഷിപ്തവുമായ തുല്യപദം.
theological_decisions:
- issue: ὅστις ... οὗτος എന്ന ഊന്നൽ
  choice: ആരോ, അവൻ
  alternative: ആരെങ്കിലും ... ആകുന്നു
  rationale: വ്യവസ്ഥ നിറവേറ്റുന്ന വ്യക്തിയെയാണ് തുടർന്നുള്ള സൂചകസർവനാമം ഊന്നിപ്പറയുന്നത്; ഉറവിടത്തിലെ ഈ ഘടന കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- issue: ഭാവികാലരൂപമായ ταπεινώσει
  choice: താഴ്ത്തുന്നവൻ
  alternative: താഴ്ത്തുമോ
  rationale: ഗ്രീക്കിലെ ഭാവികാലം ഇവിടെ പൊതുവായ വ്യവസ്ഥാപരമായ അർഥത്തിൽ വരുന്നു; മലയാളത്തിലെ വർത്തമാന പങ്കാളിത്തരൂപം ആ പൊതുസത്യത്തെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം; വാക്യത്തിലെ ‘അവൻ’ എന്ന ആവർത്തനം ഉറവിടത്തിലെ οὗτος ἐστιν എന്ന ഊന്നൽ സംരക്ഷിക്കാൻ നിലനിർത്തി.
