id: MAT.18.34
reference: Matthew 18:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὀργισθεὶς ὁ κύριος αὐτοῦ παρέδωκεν αὐτὸν τοῖς βασανισταῖς ἕως οὗ ἀποδῷ πᾶν τὸ ⸀ὀφειλόμενον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/034.yaml
  text: And in anger his master handed him over to the torturers until he should pay all that was owed[a][b].
translation:
  language: ml
  text: കോപിച്ച അവന്റെ യജമാനൻ, അവൻ കൊടുക്കാനുള്ളതെല്ലാം കൊടുത്തുതീർക്കുന്നതുവരെ, അവനെ പീഡിപ്പിക്കുന്നവരുടെ കൈയിൽ ഏൽപ്പിച്ചു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കർത്താവ്.” ഗ്രീക്ക് പദം κύριος ആണ്. ഇവിടെ അത് ഉപമയിലെ ദാസന്റെ യജമാനനെ സൂചിപ്പിക്കുന്നതിനാൽ മുഖ്യപാഠത്തിൽ “യജമാനൻ” എന്നു നൽകിയിരിക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: അഥവാ “യാതനിപ്പിക്കുന്നവർ”; കാഠിന്യം കുറച്ച്, “ജയിൽകാവൽക്കാർ.” ഗ്രീക്ക് പദം വെറും സാധാരണ കാവൽക്കാരെയല്ല, പീഡനം ഏൽപ്പിക്കുന്നവരെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀργισθεὶς
  choice: കോപിച്ച്
  rationale: ആഓറിസ്റ്റ് പങ്കുപദത്തിന്റെ ക്രിയാവിശേഷണപരമായ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ ചുരുക്കമായും വികാരത്തിന്റെ കാരണബലം നിലനിർത്തിയും അവതരിപ്പിക്കുന്നു.
- source_word: κύριος
  choice: യജമാനൻ
  rationale: ഉപമയ്ക്കുള്ളിൽ ഇത് ദാസന്റെ മനുഷ്യാധികാരിയെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ദൈവിക ബിരുദമായ ‘കർത്താവ്’ എന്നതിനെക്കാൾ സന്ദർഭോചിതം ‘യജമാനൻ’ ആണ്.
- source_word: παρέδωκεν
  choice: കൈയിൽ ഏല്പിച്ചു
  rationale: മറ്റൊരാളുടെ അധികാരത്തിലേക്ക് കൈമാറുക എന്ന നീതിന്യായപരമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: βασανισταῖς
  choice: പീഡകർ
  rationale: വെറും കാവൽക്കാരെയല്ല, പീഡനം ഏല്പിക്കുന്നവരെയാണ് ഗ്രീക്ക് പദം സൂചിപ്പിക്കുന്നത്; ‘പീഡകർ’ അതിന്റെ കാഠിന്യം നിലനിർത്തുന്നു.
- source_word: ἕως οὗ
  choice: വരെ
  rationale: പ്രതീക്ഷിക്കപ്പെടുന്ന അവസാനബിന്ദുവിനെ സൂചിപ്പിക്കുന്ന സാധാരണ കാലപരിധിപ്രയോഗം.
- source_word: ἀποδῷ
  choice: കൊടുത്തുതീർക്കുന്നതു
  rationale: ബാധ്യതയായ തുക പൂർണമായി തിരിച്ചുകൊടുക്കുക എന്ന അർഥവും, ἕως οὗ-നുശേഷമുള്ള prospective subjunctive ഭാവവും സന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: πᾶν τὸ ὀφειλόμενον
  choice: കൊടുക്കാനുള്ളത് മുഴുവൻ
  rationale: ‘കടം’ എന്ന നാമം മൂലത്തിൽ ഇല്ലാത്തതിനാൽ അത് ചേർക്കാതെ, ബാധ്യതയായതെല്ലാം എന്ന വിശാലമായ പങ്കുപദപ്രയോഗം നിലനിർത്തുന്നു.
theological_decisions:
- issue: κύριος എന്നത് ‘കർത്താവ്’ എന്ന ദൈവിക ബിരുദമായി പരിഭാഷപ്പെടുത്തണമോ
  choice: യജമാനൻ
  alternative: കർത്താവ്
  rationale: ഇവിടെ ഉപമയിലെ ദാസന്റെ മനുഷ്യാധികാരിയാണ് നേരിട്ടുള്ള സൂചന. ‘യജമാനൻ’ ആ കഥാസന്ദർഭം നിലനിർത്തുകയും ദൈവശാസ്ത്രപരമായ സൂചന നിർബന്ധിച്ച് ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: βασανισταῖς എന്ന പദത്തിന്റെ ശിക്ഷാതീവ്രത
  choice: പീഡകർ
  alternative: ജയിൽകാവൽക്കാർ; ദണ്ഡിപ്പിക്കുന്നവർ
  rationale: മൂലപദം സാധാരണ കാവലിനേക്കാൾ പീഡനമേല്പിക്കൽ സൂചിപ്പിക്കുന്നു. ‘പീഡകർ’ ഉപമയുടെ കടുത്ത മുന്നറിയിപ്പ് നിലനിർത്തുന്നു; എന്നാൽ ഇതിലൂടെ അന്തിമവിധിയെക്കുറിച്ചുള്ള വിപുലമായ സിദ്ധാന്തപ്രശ്നങ്ങൾ തീരുമാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ‘കൊടുക്കാനുള്ളത് മുഴുവൻ കൊടുത്തുതീർക്കുന്നതുവരെ’ എന്ന പ്രയോഗം മൂലത്തിലെ ബാധ്യതയും പൂർത്തീകരണപരിധിയും നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
