  terminology: “ഇടറിപ്പോകാൻ ഇടയാക്കുക,” “ജീവനിലേക്ക്,” “അഗ്നിയുടെ ഗെഹെന്ന,” and “എറിയപ്പെടുക” are suitable modern-standard Malayalam equivalents. The retained transliteration “ഗെഹെന്ന” appropriately preserves γέεννα’s specificity.
