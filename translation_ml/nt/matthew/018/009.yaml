id: MAT.18.9
reference: Matthew 18:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἰ ὁ ὀφθαλμός σου σκανδαλίζει σε, ἔξελε αὐτὸν καὶ βάλε ἀπὸ σοῦ· καλόν σοί ἐστιν μονόφθαλμον εἰς τὴν ζωὴν εἰσελθεῖν, ἢ δύο ὀφθαλμοὺς ἔχοντα βληθῆναι εἰς τὴν γέενναν τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/009.yaml
  text: And if your eye causes you to stumble[a], tear it out and throw it away from you. It is better for you to enter into life with one eye than, having two eyes[b], to be thrown into the Gehenna of fire.
translation:
  language: ml
  text: നിന്റെ കണ്ണ് നിന്നെ ഇടറിപ്പോകാൻ ഇടയാക്കുന്നുവെങ്കിൽ[a], അതു ചൂഴ്ന്നെടുത്ത് നിന്നിൽനിന്ന് എറിഞ്ഞുകളയുക. രണ്ടു കണ്ണുകളോടുകൂടെ അഗ്നിയുടെ ഗെഹെന്നയിലേക്ക്[b] എറിയപ്പെടുന്നതിനെക്കാൾ, ഒറ്റക്കണ്ണോടെ ജീവനിലേക്ക് പ്രവേശിക്കുന്നതാണ് നിനക്കു നല്ലത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്നെ പാപം ചെയ്യാൻ ഇടയാക്കുന്നുവെങ്കിൽ.” ഗ്രീക്ക് ക്രിയയ്ക്ക് ഒരാളെ ഇടറിക്കാനോ വീഴാനോ പാപം ചെയ്യാനോ ഇടയാക്കുക എന്നർഥം വരാം.
    reason: lexical_alternative
  - marker: b
    text: “ഗെഹെന്ന” അന്തിമ ന്യായവിധിയുടെ സ്ഥലത്തെ സൂചിപ്പിക്കുന്നു; പരമ്പരാഗതമായി “നരകം” എന്നു പരിഭാഷപ്പെടുത്താറുണ്ട്.
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζει
  choice: ഇടറിപ്പോകാൻ ഇടയാക്കുന്നു
  rationale: പാപത്തിൽ വീഴുക എന്ന സന്ദർഭാർഥം ഉൾക്കൊള്ളുമ്പോഴും, ഇടറുകയോ വീഴുകയോ ചെയ്യിക്കുന്നതെന്ന ഗ്രീക്ക് രൂപകം നിലനിർത്തുന്നു.
- source_word: ἔξελε
  choice: ചൂഴ്ന്നെടുക്കുക
  rationale: കണ്ണ് നീക്കിക്കളയുന്നതിന്റെ ശക്തവും അടിയന്തരവുമായ ദൃശ്യഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ പകരുന്നു.
- source_word: βάλε ἀπὸ σοῦ
  choice: നിന്നിൽനിന്ന് എറിഞ്ഞുകളയുക
  rationale: പൂർണമായും നിർണായകമായും അകറ്റിക്കളയുക എന്ന ആശയം സംരക്ഷിക്കുന്നു.
- source_word: καλόν σοί ἐστιν
  choice: നിനക്കു നല്ലത്
  rationale: തുടർന്നുള്ള ἤ താരതമ്യഘടനയിൽ, മറ്റൊരു ഫലത്തെക്കാൾ അഭികാമ്യമെന്ന അർഥം നൽകുന്നു.
- source_word: μονόφθαλμον
  choice: ഒറ്റക്കണ്ണനായി
  rationale: ഗ്രീക്കിലെ വിശേഷണത്തിന്റെ ശരീരസംബന്ധമായ ദൃശ്യം നേരിട്ടും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: εἰς τὴν ζωὴν
  choice: ജീവനിലേക്ക്
  rationale: ഗ്രീക്കിൽ ഇല്ലാത്ത ‘നിത്യ’ എന്ന വിശേഷണം ചേർക്കാതെ, യുഗാന്ത്യസൂചനയ്ക്കുള്ള തുറവ് നിലനിർത്തുന്നു.
- source_word: βληθῆναι
  choice: എറിയപ്പെടുക
  rationale: βάλλωയുടെ കർമണിപ്രയോഗം വ്യക്തമായ ആധുനിക മലയാളത്തിൽ പകരുന്നു.
- source_word: γέενναν
  choice: ഗെഹെന്ന
  rationale: പൊതുവായ ഒരു ദൈവശാസ്ത്രപദമായി ലയിപ്പിക്കാതെ ഗ്രീക്കിലെ പ്രത്യേക നാമവും അതിന്റെ യഹൂദ-യുഗാന്ത്യ പശ്ചാത്തലവും നിലനിർത്തുന്നു.
- source_word: τοῦ πυρός
  choice: അഗ്നിയുടെ
  rationale: ‘അഗ്നിയുടെ ഗെഹെന്ന’ എന്ന മൂലപാഠത്തിലെ ഷഷ്ഠീബന്ധവും തീവ്രമായ ദൃശ്യവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: γέεννα എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ഗെഹെന്ന
  alternative: നരകം
  rationale: മൂലപാഠം പൊതുവായ അധോലോകപദമല്ല, പ്രത്യേകമായ γέεννα ആണ് ഉപയോഗിക്കുന്നത്; ലിപ്യന്തരണം അതിന്റെ ചരിത്രപരവും യുഗാന്ത്യപരവുമായ പ്രത്യേകത സംരക്ഷിക്കുന്നു.
- issue: εἰς τὴν ζωὴν എന്ന പ്രയോഗത്തിന്റെ പരിഭാഷ
  choice: ജീവനിലേക്ക്
  alternative: നിത്യജീവനിലേക്ക്
  rationale: സന്ദർഭത്തിൽ യുഗാന്ത്യജീവൻ സൂചിപ്പിക്കാമെങ്കിലും ഗ്രീക്കിൽ ‘നിത്യ’ എന്നു വ്യക്തമാക്കിയിട്ടില്ല; അതു ചേർക്കാതിരിക്കുന്നത് പാഠത്തിന്റെ സംക്ഷിപ്തതയും ദൈവശാസ്ത്രപരമായ തുറവും നിലനിർത്തുന്നു.
- issue: കടുത്ത ശരീരദൃശ്യം
  choice: ചൂഴ്ന്നെടുത്ത് എറിഞ്ഞുകളയുക എന്ന രൂപം മാറ്റമില്ലാതെ നിലനിർത്തുക
  alternative: പാപകാരണം പൂർണമായി ഒഴിവാക്കുക എന്നു വിശദീകരിച്ച് മൃദൂകരിക്കുക
  rationale: വാക്യത്തിന്റെ ഞെട്ടിപ്പിക്കുന്ന അതിശയോക്തിപരമായ ശക്തി പരിഭാഷയിൽ മുൻകൂട്ടി വ്യാഖ്യാനിച്ചോ മൃദൂകരിച്ചോ കളയരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഇടറിപ്പോകുക’ എന്ന രൂപകം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധം നിലനിർത്തി അടിക്കുറിപ്പിൽ പാപസംബന്ധമായ അർഥം വ്യക്തമാക്കി. ‘ഗെഹെന്ന’ ലിപ്യന്തരിച്ചു വിശദീകരണ അടിക്കുറിപ്പ് നൽകി. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
