id: MAT.18.19
reference: Matthew 18:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Πάλιν ⸀ἀμὴν λέγω ὑμῖν ὅτι ἐὰν δύο ⸂συμφωνήσωσιν ἐξ ὑμῶν⸃ ἐπὶ τῆς γῆς περὶ παντὸς πράγματος οὗ ἐὰν αἰτήσωνται, γενήσεται αὐτοῖς παρὰ τοῦ πατρός μου τοῦ ἐν οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/019.yaml
  text: Again[a], truly I tell you, if two of you agree on earth about any matter they ask for[c][b], it will be done for them by my Father in heaven.
translation:
  language: ml
  text: 'വീണ്ടും, സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: ഭൂമിയിൽ നിങ്ങളിൽ രണ്ടുപേർ[a] തങ്ങൾ അപേക്ഷിക്കുന്ന ഏതൊരു കാര്യത്തെക്കുറിച്ചും[c] യോജിച്ചാൽ, സ്വർഗത്തിലുള്ള[b] എന്റെ പിതാവ് അത് അവർക്കുവേണ്ടി ചെയ്തുതരും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങളുടെ ഇടയിൽനിന്നുള്ള രണ്ടുപേർ ഒരേ അഭിപ്രായത്തിലായാൽ.’
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ ‘സ്വർഗങ്ങളിൽ’; മലയാളത്തിൽ പതിവുപോലെ ‘സ്വർഗത്തിൽ’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: സന്ദർഭത്തിൽ, സമൂഹത്തിന്റെ അധികാരത്തെയും ശിക്ഷണത്തെയും കുറിച്ചുള്ള യേശുവിന്റെ ഉപദേശത്തിന് (18:15–18) പിന്നാലെയാണ് ഈ വാക്കുകൾ വരുന്നത്; എന്നാൽ ഈ വാക്യത്തിന്റെ ഭാഷ യോജിച്ചുള്ള അപേക്ഷകളെ വിശാലമായി പരാമർശിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: Πάλιν
  choice: വീണ്ടും
  rationale: മുൻപത്തെ ഉപദേശത്തോടു ബന്ധപ്പെട്ടു മറ്റൊരു ഗൗരവമുള്ള പ്രസ്താവന ആരംഭിക്കുന്നതിനെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: യേശുവിന്റെ ഗൗരവവും ഉറപ്പും നിറഞ്ഞ ആമുഖസൂത്രത്തിന്റെ ഊന്നൽ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἐὰν δύο συμφωνήσωσιν ἐξ ὑμῶν
  choice: നിങ്ങളിൽ രണ്ടുപേർ ... യോജിച്ചാൽ
  rationale: συμφωνέω ഇവിടെ ഒരേ അഭിപ്രായത്തിലോ ഉദ്ദേശ്യത്തിലോ എത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു; ἐξ ὑμῶν എന്നത് ‘നിങ്ങളിൽ’ എന്നു സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: ἐπὶ τῆς γῆς
  choice: ഭൂമിയിൽ
  rationale: സ്വർഗത്തിലുള്ള പിതാവിനോടുള്ള സ്ഥാനപരമായ വൈരുധ്യം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: περὶ παντὸς πράγματος
  choice: ഏതൊരു കാര്യത്തെക്കുറിച്ചും
  rationale: πρᾶγμα എന്ന പദത്തിന്റെ വിശാലമായ ‘കാര്യം/വിഷയം’ എന്ന അർഥം അനാവശ്യമായി ചുരുക്കാതെ നൽകുന്നു.
- source_word: οὗ ἐὰν αἰτήσωνται
  choice: തങ്ങൾ അപേക്ഷിക്കുന്ന
  rationale: അനിശ്ചിത സാപേക്ഷഘടനയെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുകയും αἰτέωയുടെ അപേക്ഷിക്കുക/ചോദിക്കുക എന്ന അർഥം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: γενήσεται αὐτοῖς
  choice: അത് അവർക്കുവേണ്ടി ചെയ്തുതരും
  rationale: തുടർന്നുള്ള പിതാവിനെ സൂചിപ്പിക്കുന്ന കർത്തൃ/ഉറവിടപ്രയോഗത്തോടു ചേർന്ന് ദൈവിക പ്രവർത്തനത്തിന്റെ ഫലം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: παρὰ τοῦ πατρός μου
  choice: എന്റെ പിതാവ്
  rationale: παρά + genitive ഇവിടെ ഉറവിടമോ പ്രവർത്തകനോ സൂചിപ്പിക്കാം; മലയാളവാക്യത്തിൽ പിതാവിനെ കർത്താവാക്കി പറയുന്നത് ‘അവർക്കുവേണ്ടി ചെയ്തുതരും’ എന്നതോടു സ്വാഭാവികമായി ചേരുന്നു.
- source_word: τοῦ ἐν οὐρανοῖς
  choice: സ്വർഗത്തിലുള്ള
  rationale: ഗ്രീക്കിലെ ബഹുവചനരൂപം മലയാളത്തിലെ പതിവായ ഏകവചനമായ ‘സ്വർഗം’ ഉപയോഗിച്ച് ഭാഷാപരമായി സ്വാഭാവികമാക്കുന്നു.
theological_decisions:
- issue: വാഗ്ദാനത്തിന്റെ സന്ദർഭപരമായ വ്യാപ്തി
  choice: സഭാസമൂഹത്തിലെ ശിക്ഷണനടപടികളിലേക്കു മാത്രം പരിമിതപ്പെടുത്താതെയും ഏതൊരു പ്രാർഥനയ്ക്കുമുള്ള നിബന്ധനയില്ലാത്ത ഉറപ്പായി വികസിപ്പിക്കാതെയും വാക്യത്തിന്റെ വിശാലമായ ഭാഷ അതേപടി നിലനിർത്തി.
  alternative: ഇത് സഭാശിക്ഷണ തീരുമാനങ്ങൾക്ക് മാത്രമുള്ള വാഗ്ദാനമെന്നോ, യോജിച്ചുള്ള ഏതു പ്രാർഥനയ്ക്കും സ്വതവേ ലഭിക്കുന്ന ഉറപ്പെന്നോ വിവർത്തനത്തിൽ വ്യക്തമാക്കുക.
  rationale: 18:15–18-ലെ സന്ദർഭം സമൂഹത്തിന്റെ അധികാരത്തെയും ശിക്ഷണത്തെയും സംബന്ധിക്കുന്നുവെങ്കിലും, ഈ വാക്യം തന്നെ അപേക്ഷകളെ വിശാലമായി പരാമർശിക്കുന്നു. അതിനാൽ സന്ദർഭവും വാചകത്തിന്റെ വിശാലതയും തമ്മിലുള്ള ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം വിവർത്തനം തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ആദരപൂർവവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘സത്യമായി’ എന്നത് solemn formulaയുടെ ഊന്നൽ സൂക്ഷിക്കുന്നു; ‘അപേക്ഷിക്കുന്ന’ എന്നത് പ്രാർഥനാസന്ദർഭം സാധ്യമാക്കുമ്പോഴും അതിനെ വ്യാഖ്യാനമായി നിർബന്ധിക്കുന്നില്ല.
