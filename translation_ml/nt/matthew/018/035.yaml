id: MAT.18.35
reference: Matthew 18:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οὕτως καὶ ὁ πατήρ μου ὁ ⸀οὐράνιος ποιήσει ὑμῖν ἐὰν μὴ ἀφῆτε ἕκαστος τῷ ἀδελφῷ αὐτοῦ ἀπὸ τῶν καρδιῶν ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/035.yaml
  text: So also my heavenly Father will do to you[b][a], if each of you does not forgive his brother from your hearts.
translation:
  language: ml
  text: നിങ്ങളിൽ ഓരോരുത്തനും സ്വന്തം സഹോദരനോടു[a] ഹൃദയപൂർവം ക്ഷമിക്കാതിരുന്നാൽ, എന്റെ സ്വർഗീയ പിതാവും നിങ്ങളോടു ഇങ്ങനെതന്നെ ചെയ്യും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സഹോദരൻ” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ഗ്രീക്കുപദം പുല്ലിംഗ ഏകവചനമാണ്; ഈ സന്ദർഭത്തിൽ അത് ഓരോ സഹശിഷ്യനെയോ സഹവിശ്വാസിയെയോ പ്രതിനിധീകരിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: Οὕτως καὶ
  choice: ഇങ്ങനെതന്നെ
  rationale: മുമ്പുള്ള ഉപമയിൽ യജമാനൻ ചെയ്തതിനോടുള്ള താരതമ്യവും അതിന്റെ പ്രയോഗവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὁ πατήρ μου ὁ οὐράνιος
  choice: എന്റെ സ്വർഗീയപിതാവ്
  rationale: ‘എന്റെ’ എന്ന ഉടമസ്ഥബന്ധവും οὐράνιος എന്ന വിശേഷണവും നേരിട്ട് സംരക്ഷിക്കുന്ന, മലയാളത്തിൽ പരിചിതമായ പ്രയോഗം.
- source_word: ποιήσει ὑμῖν
  choice: നിങ്ങളോടു ... ചെയ്യും
  rationale: മുമ്പുള്ള യജമാനന്റെ നടപടിയിലേക്കു മടങ്ങിച്ചൂണ്ടുന്ന ποιέωയുടെ വിശാലമായ അർഥം നിലനിർത്തുന്നു; വിധിയുടെ സ്വഭാവം വാക്യത്തിനകത്ത് അധികമായി വിശദീകരിക്കുന്നില്ല.
- source_word: ἐὰν μὴ
  choice: '... ക്ഷമിക്കാതിരുന്നാൽ'
  rationale: നിഷേധാത്മക വ്യവസ്ഥയെ മലയാളത്തിലെ സ്വാഭാവികമായ സോപാധിക രൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἀφῆτε
  choice: ക്ഷമിക്കുക
  rationale: വ്യക്തികൾ തമ്മിലുള്ള കുറ്റവും കടത്തിന്റെ ഉപമയും ഉൾപ്പെടുന്ന ഈ സന്ദർഭത്തിൽ ἀφίημι എന്നതിന്റെ യോജിച്ച അർഥം.
- source_word: ἕκαστος
  choice: നിങ്ങളിൽ ഓരോരുത്തനും
  rationale: ഏകവചന വിതരണാർഥവും ബഹുവചന ശ്രോതാക്കളിൽ ഓരോ വ്യക്തിക്കുമുള്ള ബാധ്യതയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: സ്വന്തം സഹോദരനോടു
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ഏകവചനം സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിലെ പ്രതിനിധാനാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀπὸ τῶν καρδιῶν ὑμῶν
  choice: ഹൃദയപൂർവം
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘നിങ്ങളുടെ ഹൃദയങ്ങളിൽനിന്ന്’ എന്ന ആശയമായ ആന്തരികവും ആത്മാർഥവുമായ ക്ഷമയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: മുന്നറിയിപ്പിന്റെ വ്യാപ്തിയും ശക്തിയും
  choice: ഉപമയിലെ യജമാനന്റെ നടപടിയോടു ചേർന്ന ദൈവിക നടപടിയെക്കുറിച്ചുള്ള നേരിട്ടുള്ള, ഗൗരവമുള്ള സോപാധിക മുന്നറിയിപ്പായി പരിഭാഷപ്പെടുത്തി.
  alternative: വിധിയെ മൃദൂകരിച്ച് ‘അതുപോലെ നിങ്ങളോടു പെരുമാറും’ എന്നു പറയുക, അല്ലെങ്കിൽ നിത്യശിക്ഷയോ പ്രതിഫലനഷ്ടമോ എന്ന് സിദ്ധാന്തപരമായി വികസിപ്പിക്കുക.
  rationale: ഗ്രീക്ക് വാക്യം ഗൗരവമുള്ള മുന്നറിയിപ്പ് നൽകുന്നു; എന്നാൽ ആ വിധിയുടെ സമ്പൂർണ സിദ്ധാന്തപരമായ വിഭാഗം ഈ വാക്യത്തിൽ നിർവചിക്കുന്നില്ല. അതിനാൽ അതിന്റെ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
- issue: ἀδελφῷ എന്ന പദത്തിലെ ലിംഗസൂചന
  choice: സഹോദരൻ
  alternative: സഹോദരനോ സഹോദരിയോ; സഹവിശ്വാസി
  rationale: മൂലപാഠം പുല്ലിംഗ ഏകവചനമാണ്. പ്രധാനപാഠത്തിൽ അതു സംരക്ഷിച്ച്, സഹശിഷ്യനെയോ സഹവിശ്വാസിയെയോ പ്രതിനിധീകരിക്കുന്ന പ്രയോഗമാണെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഹൃദയപൂർവം’ എന്നത് വാക്കുതോറുമുള്ള രൂപത്തേക്കാൾ സ്വാഭാവികമായി ആന്തരിക ആത്മാർഥത വ്യക്തമാക്കുന്നു. വാക്യക്രമം വ്യവസ്ഥ ആദ്യം വരുന്നതായി ക്രമപ്പെടുത്തി; മലയാളത്തിൽ ഇത് സുതാര്യമാണ്, അർഥബന്ധം മാറ്റുന്നില്ല.
