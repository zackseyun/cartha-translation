  terminology: ‘സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു’ and ‘സ്വർഗരാജ്യം’ are established, comprehensible Malayalam biblical expressions. ‘കുട്ടികളെപ്പോലെ’ rightly avoids adding interpretive qualities such as innocence or humility. The footnote correctly explains the intensified Greek negation and is anchored at the relevant clause.
