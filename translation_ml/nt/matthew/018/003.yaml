id: MAT.18.3
reference: Matthew 18:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἶπεν· Ἀμὴν λέγω ὑμῖν, ἐὰν μὴ στραφῆτε καὶ γένησθε ὡς τὰ παιδία, οὐ μὴ εἰσέλθητε εἰς τὴν βασιλείαν τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/003.yaml
  text: And he said[a], “Truly I say to you, unless you turn and become like children[c][b], you will certainly not enter the kingdom of heaven.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: നിങ്ങൾ തിരിഞ്ഞ് കുട്ടികളെപ്പോലെ ആയിത്തീരുന്നില്ലെങ്കിൽ, സ്വർഗരാജ്യത്തിൽ ഒരിക്കലും പ്രവേശിക്കുകയില്ല.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “തീർച്ചയായും പ്രവേശിക്കുകയില്ല.” ഗ്രീക്കിൽ ഊന്നിയ നിഷേധപ്രയോഗമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν
  choice: സത്യമായി
  rationale: ഗൗരവവും അധികാരവുമുള്ള ആമുഖപ്രയോഗത്തിന്റെ ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: στραφῆτε
  choice: തിരിഞ്ഞ്
  rationale: നിർണായകമായ ദിശാമാറ്റം സൂചിപ്പിക്കുമ്പോഴും കർത്തൃത്വം ആരുടേതെന്ന് അനാവശ്യമായി നിർണയിക്കുന്നില്ല; ‘മാനസാന്തരപ്പെടുക’ പോലുള്ള സാങ്കേതിക ദൈവശാസ്ത്രപദവും ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: γένησθε
  choice: ആയിത്തീരുന്നില്ലെങ്കിൽ
  rationale: അവസ്ഥാമാറ്റം സൂചിപ്പിക്കുന്ന γίνομαιയുടെ അർഥം സ്വാഭാവികമായി പകർത്തുകയും മുൻക്രിയയുമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ὡς τὰ παιδία
  choice: കുട്ടികളെപ്പോലെ
  rationale: ഗ്രീക്കിലെ താരതമ്യം വ്യക്തമായി നിലനിർത്തുന്നു; ‘നിഷ്കളങ്കർ’ അല്ലെങ്കിൽ ‘വിനയമുള്ളവർ’ എന്നിങ്ങനെ ഉദ്ദേശിക്കുന്ന ഗുണം വ്യാഖ്യാനിച്ച് ചേർക്കുന്നില്ല. മലയാളത്തിൽ ബഹുവചനത്തെ പൊതുവർഗമായി പറയുമ്പോൾ നിർദേശക ലേഖനം വേർതിരിച്ച് പ്രതിഫലിപ്പിക്കാത്തതാണ് സ്വാഭാവികം.
- source_word: οὐ μὴ εἰσέλθητε
  choice: ഒരിക്കലും പ്രവേശിക്കുകയില്ല
  rationale: οὐ μή എന്ന ഊന്നിയ നിഷേധത്തിന്റെ ശക്തി വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പകർത്തുന്നു.
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: സ്വർഗരാജ്യം
  rationale: മത്തായിയുടെ സവിശേഷ പ്രയോഗത്തിന് അർഥവ്യക്തവും മലയാള ബൈബിൾ ഭാഷയിൽ സുപരിചിതവുമായ സംക്ഷിപ്ത രൂപം.
theological_decisions:
- issue: στραφῆτε എന്ന പദത്തിലെ പരിവർത്തനസദൃശമായ ആശയം
  choice: തിരിഞ്ഞ്
  alternative: തിരിക്കപ്പെട്ട്; മാനസാന്തരപ്പെട്ട്
  rationale: ഗ്രീക്ക് പദം നിർണായകമായ തിരിവ് ആവശ്യപ്പെടുന്നു; എന്നാൽ പിൽക്കാല സാങ്കേതിക പരിവർത്തനപദം നിർബന്ധിക്കുന്നില്ല. സജീവമോ പരോക്ഷമോ ആയ ഭാവത്തിലെ സൂക്ഷ്മതയും ഇതിലൂടെ അമിതമായി തീർപ്പാക്കുന്നില്ല.
- issue: παιδία എന്നതിലൂടെ ഉദ്ദേശിക്കുന്ന ശിഷ്യത്വഗുണം
  choice: കുട്ടികളെപ്പോലെ
  alternative: ഈ കുട്ടികളെപ്പോലെ; കൊച്ചുകുട്ടികളെപ്പോലെ; നിഷ്കളങ്കരായി
  rationale: വാക്യം കുട്ടികളോടാണ് ഉപമിക്കുന്നത്; കുട്ടികളുടെ ഏത് ഗുണമാണ് ഉദ്ദേശിക്കുന്നതെന്ന് ഇവിടെ തന്നെ വ്യക്തമാക്കുന്നില്ല. അതിനാൽ വിനയം, നിഷ്കളങ്കത തുടങ്ങിയ വ്യാഖ്യാനങ്ങൾ മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം ഗൗരവമുള്ളതുമായ ശൈലി. ‘സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു’, ‘സ്വർഗരാജ്യം’ എന്നീ പ്രയോഗങ്ങൾ വചനത്തിന്റെ ഔപചാരിക ഭാവം നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
