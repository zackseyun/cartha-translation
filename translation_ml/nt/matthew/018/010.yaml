id: MAT.18.10
reference: Matthew 18:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὁρᾶτε μὴ καταφρονήσητε ἑνὸς τῶν μικρῶν τούτων, λέγω γὰρ ὑμῖν ὅτι οἱ ἄγγελοι αὐτῶν ἐν οὐρανοῖς διὰ παντὸς βλέπουσι τὸ πρόσωπον τοῦ πατρός μου τοῦ ἐν ⸀οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/010.yaml
  text: See that you do not despise one of these little ones[c][b][a], for I tell you that their angels in heaven continually see the face of my Father who is in heaven.
translation:
  language: ml
  text: ഈ ചെറിയവരിൽ ഒരാളെപ്പോലും അവജ്ഞയോടെ കാണാതിരിക്കാൻ ശ്രദ്ധിക്കുക.[a] എന്തെന്നാൽ, സ്വർഗത്തിലുള്ള അവരുടെ ദൂതന്മാർ[b] സ്വർഗത്തിലുള്ള എന്റെ പിതാവിന്റെ മുഖം എപ്പോഴും കാണുന്നു[c] എന്നു ഞാൻ നിങ്ങളോടു പറയുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘ഈ ചെറിയവരിൽ ഒരാളെപ്പോലും വിലകുറച്ചുകാണാതിരിക്കാൻ ശ്രദ്ധിക്കുക.’'
    reason: lexical_alternative
  - marker: b
    text: ‘അവരുടെ ദൂതന്മാർ’ എന്നത് ഈ ചെറിയവരുമായി ബന്ധപ്പെട്ടവരോ അവരെ പ്രതിനിധീകരിക്കുന്നവരോ ആയ ദൂതന്മാരെ സൂചിപ്പിക്കാം; വ്യക്തിഗത കാവൽദൂതന്മാരെക്കുറിച്ചുള്ള സമ്പൂർണ സിദ്ധാന്തം ഈ വാക്യം മാത്രം നിർണയിക്കുന്നില്ല.
    reason: alternative_reading
  - marker: c
    text: ഗ്രീക്കിൽ ‘സ്വർഗങ്ങളിൽ’ / ‘സ്വർഗങ്ങളിൽ ഉള്ളവൻ’ എന്നാണ്; മലയാളത്തിൽ സ്വാഭാവികമായി ‘സ്വർഗത്തിൽ’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁρᾶτε μὴ καταφρονήσητε
  choice: നിന്ദിക്കാതിരിക്കാൻ സൂക്ഷിച്ചുകൊള്ളുക
  rationale: Ὁρᾶτε എന്ന ജാഗ്രതയോടുകൂടിയ ആഹ്വാനവും μή സഹിതമുള്ള നിരോധനവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഒരുമിച്ചു പ്രകടിപ്പിക്കുന്നു. καταφρονέω എന്നതിന് അവജ്ഞയോടെ കാണുക, വിലകുറച്ചുകാണുക എന്ന അർഥവ്യാപ്തിയുണ്ട്.
- source_word: ἑνὸς τῶν μικρῶν τούτων
  choice: ഈ ചെറിയവരിൽ ഒരാളെയും
  rationale: μικρῶν പ്രായത്തിലും നിലയിലും ഉള്ള ചെറുപ്പം/ചെറുമ എന്ന അർഥസാധ്യത നിലനിർത്തുന്നു; ‘കുട്ടികൾ’ എന്നു മാത്രം പറഞ്ഞ് സൂചന ചുരുക്കുന്നില്ല. ഗ്രീക്കിലെ ഏകവചനത്തെ മലയാളത്തിലെ നിരോധനവാക്യത്തിൽ സ്വാഭാവികമായി ‘ഒരാളെയും’ എന്നു നൽകി.
- source_word: λέγω γὰρ ὑμῖν
  choice: എന്തെന്നാൽ ... എന്നു ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: γάρ നൽകുന്ന വിശദീകരണബന്ധവും യേശുവിന്റെ ഊന്നലുള്ള പ്രസ്താവനാരീതിയും നിലനിർത്തുന്നു.
- source_word: οἱ ἄγγελοι αὐτῶν
  choice: അവരുടെ ദൂതന്മാർ
  rationale: ഉടമസ്ഥതയോ ബന്ധമോ സൂചിപ്പിക്കുന്ന αὐτῶν നേരിട്ട് നിലനിർത്തുന്നു; വ്യക്തിഗത കാവൽദൂതന്മാരെക്കുറിച്ചുള്ള സമ്പൂർണ സിദ്ധാന്തം വിവർത്തനത്തിൽ ചേർക്കുന്നില്ല.
- source_word: ἐν οὐρανοῖς
  choice: സ്വർഗത്തിലുള്ള
  rationale: ഗ്രീക്കിൽ ബഹുവചനമായിരുന്നാലും ഈ പ്രയോഗത്തിൽ മലയാളത്തിലെ സ്വാഭാവിക ഏകവചനമായ ‘സ്വർഗം’ ഉപയോഗിക്കുന്നു.
- source_word: διὰ παντὸς
  choice: എപ്പോഴും
  rationale: ‘എല്ലാ സമയത്തും, നിരന്തരം’ എന്ന ഇടിയത്തിന്റെ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളരൂപം.
- source_word: βλέπουσι τὸ πρόσωπον
  choice: മുഖം ... കാണുന്നു
  rationale: ദൈവസന്നിധിയിലേക്കുള്ള നേരിട്ടുള്ള പ്രവേശനത്തിന്റെ ബൈബിൾദൃശ്യം വ്യാഖ്യാനിച്ച് ലഘൂകരിക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: സ്വർഗത്തിലുള്ള എന്റെ പിതാവിന്റെ
  rationale: ‘എന്റെ പിതാവ്’ എന്ന യേശുവിന്റെ ബന്ധഭാഷയും പിതാവിനെ വിശേഷിപ്പിക്കുന്ന സ്ഥലസൂചനയും കൃത്യമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘അവരുടെ ദൂതന്മാർ’ എന്നതിന്റെ അർഥം
  choice: ‘അവരുടെ ദൂതന്മാർ’ എന്ന ബന്ധപ്രയോഗം അതേപടി നിലനിർത്തി; ഓരോരുത്തർക്കും പ്രത്യേകം കാവൽദൂതൻ ഉണ്ടെന്ന സിദ്ധാന്തമായി നിർവചിച്ചില്ല.
  alternative: ഇത് ഓരോ കുട്ടിക്കോ വിശ്വാസിക്കോ നിയോഗിക്കപ്പെട്ട വ്യക്തിഗത കാവൽദൂതന്മാരെ സൂചിപ്പിക്കുന്നു എന്നു വ്യക്തമാക്കുക; അല്ലെങ്കിൽ ഇവരെ പ്രതിനിധീകരിക്കുന്നതോ ശുശ്രൂഷിക്കുന്നതോ ആയ ദൂതന്മാർ എന്നു പൊതുവായി വ്യാഖ്യാനിക്കുക.
  rationale: ഗ്രീക്ക് പാഠം ‘അവരുടെ ദൂതന്മാർ’ എന്നു പറയുന്നു; എന്നാൽ ആ ബന്ധത്തിന്റെ കൃത്യമായ സ്വഭാവം വിശദീകരിക്കുന്നില്ല. അതിനാൽ പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ചെറിയവർ’, ‘അവരുടെ ദൂതന്മാർ’, ‘പിതാവിന്റെ മുഖം കാണുന്നു’ എന്നീ മൂലപാഠത്തിലെ ഉദ്ദേശപൂർവമായ വിശാലതയും ദൃശ്യഭാഷയും സംരക്ഷിച്ചിരിക്കുന്നു.
