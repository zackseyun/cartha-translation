  to: നിങ്ങൾക്ക് എന്തു തോന്നുന്നു? ഒരു മനുഷ്യന് നൂറ് ആടുകളുണ്ടെങ്കിൽ, അവയിൽ ഒന്ന് വഴിതെറ്റിപ്പോയാൽ[a], അവൻ തൊണ്ണൂറ്റൊമ്പതിനെയും മലകളിൽ[b] വിട്ടിട്ട്, വഴിതെറ്റിക്കൊണ്ടിരിക്കുന്ന ആടിനെ[c] പോയി അന്വേഷിക്കുകയില്ലയോ?
