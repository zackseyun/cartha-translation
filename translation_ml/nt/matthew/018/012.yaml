id: MAT.18.12
reference: Matthew 18:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τί ὑμῖν δοκεῖ; ἐὰν γένηταί τινι ἀνθρώπῳ ἑκατὸν πρόβατα καὶ πλανηθῇ ἓν ἐξ αὐτῶν, οὐχὶ ⸀ἀφήσει τὰ ἐνενήκοντα ἐννέα ἐπὶ τὰ ὄρη ⸀καὶ πορευθεὶς ζητεῖ τὸ πλανώμενον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/012.yaml
  text: What do you think? If a man has a hundred sheep[a], and one of them goes astray[c][b], will he not leave the ninety-nine on the mountains and go and seek the one going astray?
translation:
  language: ml
  text: നിങ്ങൾക്ക് എന്തു തോന്നുന്നു? ഒരു മനുഷ്യന് നൂറ് ആടുകളുണ്ടെങ്കിൽ, അവയിൽ ഒന്ന് വഴിതെറ്റിപ്പോയാൽ[a], അവൻ തൊണ്ണൂറ്റൊമ്പതിനെയും മലകളിൽ[b] വിട്ടിട്ട്, വഴിതെറ്റിക്കൊണ്ടിരിക്കുന്ന ആടിനെ[c] പോയി അന്വേഷിക്കുകയില്ലയോ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അലഞ്ഞുപോയാൽ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘വഴിതെറ്റുക,’ ‘അലയുക,’ ചില സന്ദർഭങ്ങളിൽ ‘തെറ്റിക്കപ്പെടുക’ എന്നീ അർത്ഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: ‘കുന്നിൻപ്രദേശത്ത്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ ‘വഴിതെറ്റിക്കൊണ്ടിരിക്കുന്നതിനെ’; പരമ്പരാഗതമായി ‘നഷ്ടപ്പെട്ട ആടിനെ’ എന്നു പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ὑμῖν δοκεῖ
  choice: നിങ്ങൾക്ക് എന്തു തോന്നുന്നു?
  rationale: ശ്രോതാക്കളുടെ വിലയിരുത്തൽ ക്ഷണിക്കുന്ന ഗ്രീക്ക് ചോദ്യത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: ἐὰν γένηταί τινι ἀνθρώπῳ
  choice: ഒരു മനുഷ്യന് ... ഉണ്ടെങ്കിൽ
  rationale: γίνομαι എന്ന ക്രിയയും സമ്പ്രദാനവിഭക്തിയും ചേർന്ന പ്രയോഗം ഇവിടെ കൈവശമുണ്ടായിരിക്കുക എന്ന ആശയം നൽകുന്നു; ἀνθρώπῳ എന്ന ഏകവചന പുല്ലിംഗരൂപവും നിലനിർത്തുന്നു.
- source_word: ἑκατὸν πρόβατα
  choice: നൂറ് ആടുകൾ
  rationale: സംഖ്യയും πρόβατα എന്ന പൊതുവായ മൃഗനാമവും ലളിതമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: πλανηθῇ ἓν ἐξ αὐτῶν
  choice: അവയിൽ ഒന്ന് വഴിതെറ്റിപ്പോയാൽ
  rationale: πλανάω എന്നതിലെ വഴിതെറ്റുക/അലഞ്ഞുപോകുക എന്ന അർത്ഥം സംരക്ഷിക്കുന്നു; പുറത്തുനിന്നുള്ള ആരെങ്കിലും തെറ്റിച്ചുവെന്ന കാരണബന്ധം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: οὐχὶ ἀφήσει
  choice: വിട്ടിട്ട് ... പോകുകയില്ലയോ?
  rationale: οὐχί അനുകൂലമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന ചോദ്യമാണെന്ന് മലയാളത്തിലെ നിഷേധചോദ്യരൂപം വ്യക്തമാക്കുന്നു; ἀφίημι ഇവിടെ ഉപേക്ഷിക്കുക എന്നതിലുപരി താൽക്കാലികമായി വിട്ടുപോകുക എന്നാണ്.
- source_word: τὰ ἐνενήκοντα ἐννέα
  choice: തൊണ്ണൂറ്റൊമ്പതിനെയും
  rationale: മുമ്പ് പറഞ്ഞ ആടുകളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളത്തിലെ സംഖ്യാനാമപ്രയോഗം.
- source_word: ἐπὶ τὰ ὄρη
  choice: മലകളിൽ
  rationale: ὄρη എന്ന ബഹുവചനത്തിലെ ഭൂപ്രകൃതിചിത്രം നിലനിർത്തുന്നു; മലയാളത്തിൽ സ്ഥലസൂചനയ്ക്ക് ‘മലകളിൽ’ സ്വാഭാവികമാണ്.
- source_word: καὶ πορευθεὶς ζητεῖ
  choice: അന്വേഷിക്കാൻ പോകുന്നു
  rationale: പോയി അന്വേഷിക്കുക എന്ന തുടർച്ചയായ പ്രവർത്തിയെ മലയാളത്തിൽ സ്വാഭാവികമായ ക്രിയാസംയോജനമായി അവതരിപ്പിക്കുന്നു; ζητέωയുടെ ഉദ്ദേശപൂർവമായ തിരച്ചിൽ നിലനിർത്തുന്നു.
- source_word: τὸ πλανώμενον
  choice: വഴിതെറ്റി അലയുന്ന ആടിനെ
  rationale: വർത്തമാന കൃദന്തരൂപത്തിലെ തുടരുന്ന അവസ്ഥയും മുമ്പത്തെ πλανάωയുമായുള്ള പദബന്ധവും നിലനിർത്തുന്നു; ‘നഷ്ടപ്പെട്ടത്’ എന്ന വ്യത്യസ്തമായ പദാശയം ഇറക്കുമതി ചെയ്യുന്നില്ല.
theological_decisions:
- issue: ἀνθρώπῳ എന്ന പൊതുവാചക പുല്ലിംഗരൂപം
  choice: ഒരു മനുഷ്യന്
  alternative: ഒരാൾക്ക്
  rationale: ഗ്രീക്കിലെ ഏകവചന പുല്ലിംഗരൂപം പ്രതിനിധാനപരമായി ഉപയോഗിച്ചിരിക്കുന്നതിനെ മറച്ചുവയ്ക്കാതെ മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- issue: ആടിന്റെ ഉപമയിലെ πλανάωയുടെ അർത്ഥനിറം
  choice: വഴിതെറ്റിപ്പോകുക / വഴിതെറ്റി അലയുക
  alternative: തെറ്റിക്കപ്പെടുക / നഷ്ടപ്പെടുക
  rationale: ആട് വഴിതെറ്റുന്ന ദൃശ്യവും സദാചാരപരമായ പ്രതിധ്വനിയും നിലനിർത്തുമ്പോൾ, അതിനെ മറ്റൊരാൾ തെറ്റിച്ചുവിട്ടുവെന്നോ അത് പൂർണമായി നഷ്ടപ്പെട്ടുവെന്നോ പാഠത്തിൽ ഇല്ലാത്ത വിധത്തിൽ നിർണ്ണയിക്കുന്നില്ല.
- issue: οὐχί ഉള്ള ചോദ്യത്തിന്റെ പ്രതീക്ഷിത ഉത്തരം
  choice: പോകുകയില്ലയോ?
  alternative: പോകുമോ?
  rationale: അവൻ അങ്ങനെ പോകും എന്ന സമ്മതം പ്രതീക്ഷിക്കുന്ന ഗ്രീക്ക് ചോദ്യത്തിന്റെ വാക്ചാതുര്യം മലയാളത്തിലെ നിഷേധചോദ്യത്തിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ മാന്യമായ മലയാളം. ചോദ്യത്തിന്റെ നേരിട്ടുള്ള ഭാവവും ഇടയജീവിതത്തിന്റെ ദൃശ്യവും ഗ്രീക്കിലെ πλανάω എന്ന പദത്തിന്റെ ആവർത്തനവും കഴിയുന്നത്ര നിലനിർത്തിയിരിക്കുന്നു.
