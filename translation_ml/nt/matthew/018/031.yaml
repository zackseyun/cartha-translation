id: MAT.18.31
reference: Matthew 18:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἰδόντες ⸀οὖν οἱ σύνδουλοι αὐτοῦ τὰ γενόμενα ἐλυπήθησαν σφόδρα, καὶ ἐλθόντες διεσάφησαν τῷ κυρίῳ ἑαυτῶν πάντα τὰ γενόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/031.yaml
  text: Therefore[a], when his fellow servants saw what had happened, they were deeply grieved[b], and they came and reported to their lord everything that had happened.
translation:
  language: ml
  text: അതുകൊണ്ട്, അവന്റെ സഹദാസന്മാർ സംഭവിച്ചത് കണ്ടപ്പോൾ വളരെ ദുഃഖിതരായി; അവർ ചെന്നു തങ്ങളുടെ യജമാനനോട് സംഭവിച്ച കാര്യങ്ങളെല്ലാം വിശദമായി അറിയിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻ സംഭവത്തിൽനിന്നുള്ള നിഗമനബന്ധവും ആഖ്യാനത്തിന്റെ തുടർച്ചയും നിലനിർത്തുന്നു.
- source_word: σύνδουλοι
  choice: സഹദാസന്മാർ
  rationale: ഒരേ യജമാനന്റെ കീഴിലുള്ള ദാസസ്ഥാനം പങ്കിടുന്നവരെ സൂചിപ്പിക്കുന്ന സംയുക്തപദത്തിന്റെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τὰ γενόμενα / πάντα τὰ γενόμενα
  choice: സംഭവിച്ചതെല്ലാം / സംഭവിച്ചതെല്ലാം
  rationale: γίνομαι എന്ന ക്രിയയുടെ substantival participle-നെ സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തുന്നു; πάντα നൽകുന്ന സമഗ്രത 'എല്ലാം' വ്യക്തമാക്കുന്നു. ആദ്യ പ്രയോഗത്തിലും സന്ദർഭാനുസൃതമായി സമഗ്രത മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: ἐλυπήθησαν σφόδρα
  choice: വളരെ ദുഃഖിതരായി
  rationale: λυπέω സൂചിപ്പിക്കുന്ന ദുഃഖവും σφόδραയുടെ തീവ്രതയും ലളിതവും ഗൗരവമുള്ളതുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: ἐλθόντες
  choice: അവർ ചെന്ന്
  rationale: പ്രധാനക്രിയയ്ക്കുമുമ്പുള്ള attendant-circumstance participle ആഖ്യാനക്രമം പാലിച്ച് സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: διεσάφησαν
  choice: വിശദമായി അറിയിച്ചു
  rationale: വെറും അറിയിക്കൽ മാത്രമല്ല, കാര്യം വ്യക്തമാക്കി സമഗ്രമായി റിപ്പോർട്ട് ചെയ്യുക എന്ന ക്രിയയുടെ ശക്തി നിലനിർത്തുന്നു.
- source_word: τῷ κυρίῳ ἑαυτῶν
  choice: തങ്ങളുടെ യജമാനനോട്
  rationale: മനുഷ്യനായ അധികാരിയെ സൂചിപ്പിക്കുന്ന ഈ ഉപമാസന്ദർഭത്തിൽ κύριος എന്നതിന് 'യജമാനൻ' സ്വാഭാവികവും ബന്ധം വ്യക്തമാക്കുന്നതുമാണ്.
theological_decisions:
- issue: ഉപമയിലെ δοῦλος-കുടുംബപദത്തിന്റെ പരിഭാഷ
  choice: സഹദാസന്മാർ
  alternative: കൂടെ സേവിക്കുന്നവർ / സഹഭൃത്യന്മാർ
  rationale: സേവനം ചെയ്യുന്നവർ എന്ന പൊതുവായ ആശയത്തേക്കാൾ, ഒരേ യജമാനന്റെ കീഴിലുള്ള ബന്ധിത ദാസസ്ഥാനം σύνδουλοι വ്യക്തമാക്കുന്നു. 'സഹദാസന്മാർ' ആ സാമൂഹികബന്ധം മൃദൂകരിക്കാതെ നിലനിർത്തുന്നു.
- issue: മനുഷ്യനായ മേലധികാരിക്കുള്ള κύριος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: യജമാനൻ
  alternative: പ്രഭു / കർത്താവ്
  rationale: ഇവിടെ ദൈവിക പദവി ഉദ്ദേശിക്കുന്നില്ല; ഉപമയിലെ ദാസന്മാരുടെ മനുഷ്യനായ ഉടമയെയും അധികാരിയെയും 'യജമാനൻ' വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഉപമയുടെ സാമൂഹികവും വികാരപരവുമായ ഭാരം നിലനിർത്തുന്ന ഗൗരവമുള്ള ശൈലി. മൂലത്തിൽ യഥാർത്ഥ പാഠഭേദമോ നിർബന്ധമായ വിശദീകരണകുറിപ്പോ ഇല്ലാത്തതിനാൽ അടിക്കുറിപ്പുകൾ ചേർത്തിട്ടില്ല.
