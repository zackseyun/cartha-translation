  naturalness: The Malayalam is clear, modern, and appropriately dignified. “സഹദാസന്മാർ,” “യജമാനൻ,” and “വിശദമായി അറിയിച്ചു” are natural in this parabolic context. The revised wording remains fluent while restoring the source distinction.
  terminology: “സഹദാസന്മാർ” suitably reflects σύνδουλοι without softening the shared slave status. “യജമാനൻ” is an appropriate contextual rendering of the human κύριος. No theological or textual footnote is required.
