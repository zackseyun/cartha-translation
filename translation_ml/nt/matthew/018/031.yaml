  revised_text: അതുകൊണ്ട്, അവന്റെ സഹദാസന്മാർ സംഭവിച്ചത് കണ്ടപ്പോൾ വളരെ ദുഃഖിതരായി; അവർ ചെന്നു തങ്ങളുടെ യജമാനനോട് സംഭവിച്ച കാര്യങ്ങളെല്ലാം വിശദമായി അറിയിച്ചു.
