lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: അടുക്കൽ വിളിച്ച്
  rationale: ആളെ സ്വന്തം അടുക്കലേക്കു വിളിക്കുക എന്ന മധ്യമപ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: παιδίον
  choice: ഒരു കുട്ടിയെ
  rationale: ലിംഗം നിർണയിക്കാത്ത പൊതുവായ പദമായതിനാൽ ആൺകുട്ടി/പെൺകുട്ടി എന്നു പ്രത്യേകപ്പെടുത്താതെ പരിഭാഷപ്പെടുത്തി.
- source_word: ἔστησεν
  choice: നിർത്തി
  rationale: സകർമകമായ ‘നിൽക്കുമാറാക്കി/നിർത്തി’ എന്ന അർഥം നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐν μέσῳ αὐτῶν
  choice: അവരുടെ നടുവിൽ
  rationale: കൂട്ടത്തിന്റെ മധ്യസ്ഥാനം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം.
