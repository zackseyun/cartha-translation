id: MAT.24.34
reference: Matthew 24:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ⸀ὅτι οὐ μὴ παρέλθῃ ἡ γενεὰ αὕτη ἕως ἂν πάντα ταῦτα γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/034.yaml
  text: Truly I tell you that this generation will certainly not pass away until all these things happen[a].
translation:
  language: ml
  text: 'സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: ഇതെല്ലാം സംഭവിക്കുന്നതുവരെ ഈ തലമുറ ഒരിക്കലും കടന്നുപോകുകയില്ല.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഈ ജനം’ അല്ലെങ്കിൽ ‘ഈ വംശം.’ ഗ്രീക്ക് പദത്തിന് കൂടുതൽ വിശാലമായ അർത്ഥമുണ്ടാകാം; എന്നാൽ ഇവിടെ ഏറ്റവും നേരിട്ടുള്ള പരിഭാഷ ‘തലമുറ’ എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: സത്യമായി
  rationale: യേശുവിന്റെ ഗൗരവപൂർവമായ ഉറപ്പുവാക്കിനെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; ലിപ്യന്തരണം ചെയ്ത ‘ആമേൻ’ എന്നതിനെക്കാൾ അർത്ഥം നേരിട്ട് ഗ്രഹിക്കാം.
- source_word: λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: നേരിട്ടുള്ള അഭിസംബോധനയും പ്രസ്താവനയുടെ ഔപചാരിക ഗൗരവവും നിലനിർത്തുന്നു.
- source_word: ὅτι
  choice: ':'
  rationale: മലയാളത്തിൽ ഉദ്ധരണിസ്വഭാവമുള്ള ഉള്ളടക്കവാക്യം ദ്വിബിന്ദുവിലൂടെ സ്വാഭാവികമായി ബന്ധിപ്പിക്കാം; ‘എന്ന്’ ചേർക്കുന്നത് ഇവിടെ വാക്യഘടനയെ അനാവശ്യമായി ഭാരപ്പെടുത്തും.
- source_word: οὐ μὴ παρέλθῃ
  choice: ഒരിക്കലും കടന്നുപോകുകയില്ല
  rationale: οὐ μή എന്ന ശക്തമായ നിഷേധം ‘ഒരിക്കലും … ഇല്ല’ എന്ന പ്രയോഗത്തിലൂടെ വ്യക്തമായി നിലനിർത്തുന്നു; παρέρχομαι എന്ന ക്രിയയുടെ രൂപകസ്വഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: ἡ γενεὰ αὕτη
  choice: ഈ തലമുറ
  rationale: γενεάയുടെ ഏറ്റവും നേരിട്ടുള്ള സന്ദർഭോചിത അർത്ഥം നൽകുന്നു; വിവാദമായ അന്ത്യകാല വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ തീർപ്പാക്കുന്നില്ല.
- source_word: ἕως ἂν
  choice: സംഭവിക്കുന്നതുവരെ
  rationale: ഭാവിയിൽ സംഭവിക്കേണ്ട കാര്യങ്ങളാൽ നിർണ്ണയിക്കപ്പെടുന്ന പരിധിയെ മലയാളത്തിലെ ‘വരെ’ ഘടന സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: πάντα ταῦτα
  choice: ഇതെല്ലാം
  rationale: നപുംസക ബഹുവചനത്തിന്റെ സമഗ്രത സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: γένηται
  choice: സംഭവിക്കുക
  rationale: സംഭവങ്ങൾ നടക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന γίνομαιയുടെ സന്ദർഭോചിത അർത്ഥം ലളിതമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: അന്ത്യകാലപ്രസംഗത്തിലെ ἡ γενεὰ αὕτη എന്നതിന്റെ അർത്ഥം
  choice: ഈ തലമുറ
  alternative: ഈ ജനം; ഈ വംശം
  rationale: ‘ഈ തലമുറ’ എന്നത് ഗ്രീക്കിന്റെ ഏറ്റവും നേരിട്ടുള്ള അർത്ഥമാണ്. മറ്റ് വിശാല അർത്ഥങ്ങൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചുകൊണ്ട്, പ്രത്യേക അന്ത്യകാല സിദ്ധാന്തത്തെ മുഖ്യവാചകത്തിൽ ഇറക്കുമതി ചെയ്യാതെ വ്യാഖ്യാനപരമായ പിരിമുറുക്കം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. യേശുവിന്റെ ഉറപ്പുവാക്കിന്റെ ശക്തി നിലനിർത്തിയിട്ടുണ്ട്; സാങ്കേതികമോ വിഭാഗീയമോ ആയ അന്ത്യകാല പദാവലി ഒഴിവാക്കിയിരിക്കുന്നു.
