id: MAT.24.21
reference: Matthew 24:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔσται γὰρ τότε θλῖψις μεγάλη οἵα οὐ γέγονεν ἀπ’ ἀρχῆς κόσμου ἕως τοῦ νῦν οὐδ’ οὐ μὴ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/021.yaml
  text: For then there will be great tribulation[a], such as has not happened from the beginning of the world until now, and never will happen again.
translation:
  language: ml
  text: കാരണം, അന്ന് വലിയ കഷ്ടത[a] ഉണ്ടാകും—ലോകത്തിന്റെ ആരംഭം മുതൽ ഇന്നുവരെ ഉണ്ടായിട്ടില്ലാത്തതും ഇനിമേൽ ഒരിക്കലും ഉണ്ടാകാത്തതുമായ കഷ്ടത.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വലിയ ദുരിതം’ അല്ലെങ്കിൽ ‘വലിയ പീഡനം.’ ഗ്രീക്കുപദം കടുത്ത കഷ്ടപ്പാട്, സമ്മർദം, അല്ലെങ്കിൽ അടിച്ചമർത്തൽ എന്നിവയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ τότε
  choice: എന്തെന്നാൽ, അന്ന്
  rationale: γάρ-ന്റെ വിശദീകരണബന്ധവും τότε-യുടെ കാലസൂചനയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: θλῖψις μεγάλη
  choice: വലിയ കഷ്ടത
  rationale: കടുത്ത ദുരിതം, സമ്മർദം, പീഡനം എന്നീ അർഥവ്യാപ്തിയുള്ള θλῖψις-നെ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ഗൗരവമുള്ളതുമായ ഭാഷയിൽ നൽകുന്നു; μεγάλη നേരിട്ട് ‘വലിയ’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: οἵα οὐ γέγονεν
  choice: ഉണ്ടായിട്ടില്ലാത്തതും
  rationale: മുമ്പൊരിക്കലും ഉണ്ടായിട്ടില്ലാത്ത തരത്തിലുള്ള കഷ്ടത എന്ന ഗുണപരമായ താരതമ്യം മലയാളത്തിലെ ബന്ധവാക്യരൂപത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀπ’ ἀρχῆς κόσμου ἕως τοῦ νῦν
  choice: ലോകാരംഭംമുതൽ ഇന്നുവരെ
  rationale: κόσμος എന്നത് ‘ലോകം’ എന്നും മുഴുവൻ കാലപരിധി സംക്ഷിപ്തവും വ്യക്തവുമായി നൽകുന്നു.
- source_word: οὐδ’ οὐ μὴ γένηται
  choice: ഇനിയൊരിക്കലും ഉണ്ടാകാത്തതുമായ
  rationale: οὐ μή എന്ന ശക്തമായ ഭാവിനിഷേധം ‘ഇനിയൊരിക്കലും’ എന്നു പ്രകടിപ്പിക്കുന്നു; ഗ്രീക്കിലെ γίνομαι-യുമായി യോജിച്ച് ‘ഉണ്ടാകുക’ ആവർത്തിക്കുന്നു.
theological_decisions:
- issue: θλῖψις എന്ന പദത്തിന്റെ അന്ത്യകാലസംബന്ധിയായ ഭാരം
  choice: കഷ്ടത
  alternative: മഹാപീഡനം / വലിയ ദുരിതം
  rationale: ‘കഷ്ടത’ മൂലപദത്തിന്റെ വിശാലമായ അർഥപരിധിയും വാക്യത്തിന്റെ ഗൗരവവും സംരക്ഷിക്കുന്നു; ‘മഹാപീഡനം’ ഒരു സാങ്കേതിക അന്ത്യകാലപദമായി വായിക്കപ്പെടാനുള്ള സാധ്യതയുള്ളതിനാൽ അത് മുഖ്യപാഠത്തിൽ ഒഴിവാക്കുന്നു.
- issue: അവസാനത്തെ ശക്തമായ ഭാവിനിഷേധം
  choice: ഇനിയൊരിക്കലും ഉണ്ടാകാത്തത്
  alternative: വീണ്ടും സംഭവിക്കുകയില്ല
  rationale: οὐ μή-യുടെ ഊന്നൽ നിലനിർത്തുകയും ‘വീണ്ടും’ എന്ന ആശയം മാത്രം മുൻനിർത്താതെ ഭാവിയിലെ സമ്പൂർണ നിഷേധം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ബന്ധവാക്യത്തിന്റെ നീളം നിയന്ത്രിക്കാൻ സെമിക്കോളൺ ഉപയോഗിച്ചു; സാങ്കേതികമോ മതവിഭാഗസവിശേഷമോ ആയ പദപ്രയോഗം ഒഴിവാക്കി.
