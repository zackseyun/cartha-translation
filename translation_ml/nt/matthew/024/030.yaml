id: MAT.24.30
reference: Matthew 24:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ τότε φανήσεται τὸ σημεῖον τοῦ υἱοῦ τοῦ ἀνθρώπου ἐν ⸀τῷ οὐρανῷ, καὶ τότε κόψονται πᾶσαι αἱ φυλαὶ τῆς γῆς καὶ ὄψονται τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ μετὰ δυνάμεως καὶ δόξης πολλῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/030.yaml
  text: And then the sign of the Son of Man will appear in heaven[a], and then all the tribes of the earth will mourn[c][b], and they will see the Son of Man coming on the clouds of heaven with power and great glory.
translation:
  language: ml
  text: അപ്പോൾ മനുഷ്യപുത്രന്റെ അടയാളം ആകാശത്തിൽ[a] പ്രത്യക്ഷപ്പെടും. അപ്പോൾ ഭൂമിയിലെ സകല ഗോത്രങ്ങളും വിലപിക്കും[b]. മനുഷ്യപുത്രൻ ശക്തിയോടും മഹത്തായ തേജസ്സോടും കൂടെ ആകാശത്തിലെ മേഘങ്ങളുടെമേൽ വരുന്നത്[c] അവർ കാണും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “സ്വർഗത്തിൽ.” ഗ്രീക്ക് പദത്തിന് സന്ദർഭമനുസരിച്ച് “ആകാശം” എന്നും “സ്വർഗം” എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ “ദേശത്തിലെ സകല ഗോത്രങ്ങളും.” ഗ്രീക്ക് പദത്തിന് “ഭൂമി” എന്നും “ദേശം” എന്നും അർഥമാകാം.
    reason: alternative_reading
  - marker: c
    text: “ആകാശത്തിലെ മേഘങ്ങളുടെമേൽ വരുന്നത്” എന്ന പ്രയോഗം ദാനിയേൽ 7:13-നെ പ്രതിധ്വനിപ്പിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: φανήσεται
  choice: പ്രത്യക്ഷപ്പെടും
  rationale: ദൃശ്യമായി വെളിപ്പെടുന്ന സംഭവത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: σημεῖον
  choice: അടയാളം
  rationale: അപോകലിപ്റ്റിക സന്ദർഭത്തിൽ അധിക വ്യാഖ്യാനം ചേർക്കാതെ ഗ്രീക്കിലെ പൊതുവായ അർഥം നിലനിർത്തുന്നു.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രന്റെ
  rationale: അടയാളം മനുഷ്യപുത്രനുമായി എങ്ങനെ ബന്ധപ്പെട്ടിരിക്കുന്നു എന്ന ജനിറ്റീവ് അവ്യക്തത പരിഹരിക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: ἐν τῷ οὐρανῷ
  choice: ആകാശത്തിൽ
  rationale: ഈ ദൃശ്യവും മേഘങ്ങളുമായി ബന്ധപ്പെട്ടതുമായ സന്ദർഭത്തിൽ സ്വാഭാവികം; 'സ്വർഗത്തിൽ' എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: κόψονται
  choice: വിലപിക്കും
  rationale: ശോകാചരണത്തിന്റെ പ്രത്യേക ശാരീരിക ഭാവം നിർബന്ധിക്കാതെ ഈ ഇടിയത്തിന്റെ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: πᾶσαι αἱ φυλαὶ τῆς γῆς
  choice: ഭൂമിയിലെ സകല ഗോത്രങ്ങളും
  rationale: φυλαί എന്നതിന്റെ ഗോത്രപരമായ രൂപവും γῆയുടെ വിശ്വവ്യാപക സാധ്യതയും നിലനിർത്തുന്നു.
- source_word: ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: ആകാശമേഘങ്ങളുടെമേൽ
  rationale: ദാനിയേൽ 7:13-ലെ പ്രതിധ്വനി കാത്തുകൊണ്ട് ἐπίയുടെ സ്ഥാനസൂചക അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: μετὰ δυνάμεως καὶ δόξης πολλῆς
  choice: ശക്തിയോടും മഹത്തായ തേജസ്സോടുംകൂടെ
  rationale: πολλῆς നേരിട്ട് 'തേജസ്സിനെ' വിശേഷിപ്പിക്കുന്ന ഗ്രീക്ക് ഘടന സ്വാഭാവിക മലയാളത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: '''മനുഷ്യപുത്രന്റെ അടയാളം'' എന്നതിന്റെ അർഥം'
  choice: ജനിറ്റീവ് ബന്ധം 'മനുഷ്യപുത്രന്റെ അടയാളം' എന്നു അവ്യക്തമായിത്തന്നെ നിലനിർത്തി.
  alternative: മനുഷ്യപുത്രനോടു ബന്ധപ്പെട്ട അടയാളം; അല്ലെങ്കിൽ മനുഷ്യപുത്രൻ തന്നെയാകുന്ന അടയാളം.
  rationale: ഗ്രീക്ക് പദഘടന ഈ വ്യാഖ്യാനങ്ങളിൽ ഒന്നിനെ നിർബന്ധിക്കുന്നില്ല; അതിനാൽ വിവാദമായ അന്ത്യകാലവിശദാംശം പരിഭാഷയിൽ തീർപ്പാക്കിയിട്ടില്ല.
- issue: γῆ എന്നതിന്റെ വ്യാപ്തി
  choice: മുഖ്യപാഠത്തിൽ 'ഭൂമി' എന്ന വിശ്വവ്യാപക അർഥം സ്വീകരിച്ചു.
  alternative: '''ദേശം'', പ്രത്യേകിച്ച് ഇസ്രായേൽദേശം.'
  rationale: സമീപസന്ദർഭത്തിലെ ആകാശീയവും അപോകലിപ്റ്റികവുമായ ദൃശ്യഭാവം 'ഭൂമി'യെ പിന്തുണയ്ക്കുന്നു; എങ്കിലും ദേശകേന്ദ്രിത വായന അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ദർശനാത്മക ഗൗരവം നിലനിർത്തുന്ന ശൈലി. 'മനുഷ്യപുത്രൻ', 'തേജസ്സ്' എന്നീ സ്ഥാപിത ബൈബിൾ പദങ്ങൾ നിലനിർത്തി; അതിപുരാതനമായ വാക്യക്രമം ഒഴിവാക്കി.
