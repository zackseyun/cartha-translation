  text: γρηγορεῖτε οὖν, ὅτι οὐκ οἴδατε ποίᾳ ⸀ἡμέρᾳ ὁ κύριος ὑμῶν ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/042.yaml
  text: Therefore stay awake[c][b][a], because you do not know on what day your Lord is coming.
translation:
  language: ml
  text: അതുകൊണ്ട് ജാഗരൂകരായിരിക്കുക[a]; നിങ്ങളുടെ കർത്താവ് ഏതു ദിവസമാണ് വരുന്നതെന്ന്[b] നിങ്ങൾ അറിയുന്നില്ലല്ലോ.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഉണർന്നിരിക്കുക,’ ‘കാവലിരിക്കുക.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘ഏത് ദിവസത്തിൽ.’
    reason: lexical_alternative
  - marker: c
    text: ‘വരുന്നു’ എന്നും ‘വരും’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്കിൽ വർത്തമാനകാല ക്രിയാരൂപമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: ജാഗരൂകരായിരിക്കുക
  rationale: വർത്തമാനകാല ബഹുവചന ആജ്ഞ തുടർച്ചയായ ജാഗ്രത ആവശ്യപ്പെടുന്നു. ഉറക്കമുണർന്നിരിക്കുക എന്ന മൂലരൂപകത്തിന്റെ ഭാവം നിലനിർത്തിക്കൊണ്ട് ആന്തരിക സജ്ജതയും കാവലും സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻപുള്ള ഉപദേശത്തിൽനിന്നുള്ള നിഗമനം വ്യക്തമാക്കുന്നു.
- source_word: ὅτι
  choice: —ല്ലോ
  rationale: ആജ്ഞയ്ക്കുള്ള കാരണം മലയാളത്തിൽ സ്വാഭാവികമായി പിൻവാക്യത്തിലെ ‘അറിയുന്നില്ലല്ലോ’ എന്ന രൂപത്തിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: οὐκ οἴδατε
  choice: നിങ്ങൾ അറിയുന്നില്ല
  rationale: അറിയുക എന്ന ക്രിയയുടെ ലളിതമായ നിഷേധം; മൂലപാഠത്തിലില്ലാത്ത ഉറപ്പിനെയോ അനിശ്ചിതത്വത്തിന്റെ അളവിനെയോ ചേർക്കുന്നില്ല.
- source_word: ποίᾳ ἡμέρᾳ
  choice: ഏതു ദിവസമാണ്
  rationale: കാലസൂചകമായ ദത്തിവിഭക്തിയുടെ അർഥവും അറിയപ്പെടാത്ത പ്രത്യേക ദിവസത്തെക്കുറിച്ചുള്ള ചോദനഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὁ κύριος ὑμῶν
  choice: നിങ്ങളുടെ കർത്താവ്
  rationale: അധികാരത്തെയും പുതിയനിയമത്തിലെ അംഗീകൃത ബിരുദപ്രയോഗത്തെയും നിലനിർത്തുന്ന സ്വാഭാവിക ഉടമസ്ഥരൂപം.
- source_word: ἔρχεται
  choice: വരുന്നത്
  rationale: ‘വരുന്നു/വരികയാണ്’ എന്ന വർത്തമാനകാലരൂപത്തിന്റെ ഭാവം ആശ്രിതവാക്യത്തിൽ മലയാളത്തിന് സ്വാഭാവികമായ ‘വരുന്നത്’ എന്ന രൂപത്തിൽ സൂക്ഷിക്കുന്നു; ഭാവികാലമെന്നു മാത്രം നിർണ്ണയിക്കുന്നില്ല.
theological_decisions:
- issue: ἔρχεται എന്ന വർത്തമാനകാലരൂപത്തിന്റെ അന്ത്യകാലസംബന്ധമായ ശക്തി
  choice: വരുന്നത്
  alternative: വരും
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാലരൂപം നൽകുന്ന സജീവ പ്രതീക്ഷ നിലനിർത്തുന്നു; കർത്താവിന്റെ വരവിന്റെ കൃത്യസമയത്തെക്കുറിച്ചുള്ള പ്രത്യേക സിദ്ധാന്തം പാഠത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ജാഗരൂകരായിരിക്കുക’ സഭാപരമായ പരിചിതത്വവും പൊതുവായ ഗ്രാഹ്യതയും സമന്വയിപ്പിക്കുന്നു. കാരണം സൂചിപ്പിക്കുന്ന ὅτι മലയാളവാക്യത്തിന്റെ സ്വാഭാവിക ഒഴുക്കിനായി ‘—ല്ലോ’ എന്ന വാക്യാന്തരൂപത്തിൽ നൽകിയിരിക്കുന്നു.
