  text: ὁ οὐρανὸς καὶ ἡ γῆ ⸀παρελεύσεται, οἱ δὲ λόγοι μου οὐ μὴ παρέλθωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/035.yaml
  text: Heaven and earth will pass away[a], but my words will certainly not pass away.
translation:
  language: ml
  text: ആകാശവും ഭൂമിയും കടന്നുപോകും; എന്നാൽ എന്റെ വാക്കുകൾ ഒരിക്കലും കടന്നുപോകുകയില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തീർച്ചയായും കടന്നുപോകുകയില്ല.” ഗ്രീക്കിൽ ശക്തമായ നിഷേധപ്രയോഗമാണ് (οὐ μή) ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ οὐρανὸς
  choice: ആകാശം
  rationale: γῆയോടൊപ്പമുള്ള ഈ അന്ത്യകാലസന്ദർഭത്തിലെ സ്ഥിരപ്രയോഗത്തിൽ സൃഷ്ടിക്കപ്പെട്ട ആകാശത്തെയാണ് സൂചിപ്പിക്കുന്നത്; വെറും ദൃശ്യമായ ആകാശമെന്ന പരിധിയിലല്ല.
- source_word: ἡ γῆ
  choice: ഭൂമി
  rationale: ‘ആകാശവും ഭൂമിയും’ എന്ന സമഗ്രപ്രയോഗത്തിൽ ഒരു പ്രത്യേക ദേശമല്ല, ഭൂമിയെയും നിലവിലെ സൃഷ്ടിവ്യവസ്ഥയെയും സൂചിപ്പിക്കുന്നു.
- source_word: παρελεύσεται
  choice: ഒഴിഞ്ഞുപോകും
  rationale: παρέρχομαι ഇവിടെ നിലവിലെ സൃഷ്ടിവ്യവസ്ഥയുടെ കടന്നുപോകലിനെ സൂചിപ്പിക്കുന്നു. ‘ഒഴിഞ്ഞുപോകും’ എന്നത് അതിന്റെ ഗൗരവവും ആവർത്തനത്തിലെ ബന്ധവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: ആകാശത്തിന്റെയും ഭൂമിയുടെയും ക്ഷണികതയും യേശുവിന്റെ വാക്കുകളുടെ സ്ഥിരതയും തമ്മിലുള്ള വൈരുധ്യം വ്യക്തമാക്കുന്നു.
- source_word: οἱ λόγοι μου
  choice: എന്റെ വാക്കുകൾ
  rationale: യേശുവിന്റെ പ്രസ്താവനകളെയും ഉപദേശങ്ങളെയും വിശാലമായി ഉൾക്കൊള്ളുന്ന നേരിട്ടുള്ള സ്വാഭാവിക പരിഭാഷയാണ്.
- source_word: οὐ μὴ παρέλθωσιν
  choice: ഒരിക്കലും ഒഴിഞ്ഞുപോകുകയില്ല
  rationale: οὐ μήയും aorist subjunctive-ഉം ചേർന്ന ശക്തമായ നിഷേധം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ വാക്കുകളുടെ സ്ഥിരതയെക്കുറിച്ചുള്ള അവകാശവാദത്തിന്റെ ശക്തി
  choice: കടന്നുപോകുന്ന സൃഷ്ടിവ്യവസ്ഥയ്ക്കും ഒരിക്കലും കടന്നുപോകാത്ത യേശുവിന്റെ വാക്കുകൾക്കും ഇടയിലെ ശക്തമായ വൈരുധ്യം നേരിട്ട് നിലനിർത്തി.
  alternative: യേശുവിന്റെ വാക്കുകൾ ‘തീർച്ചയായും ഒഴിഞ്ഞുപോകുകയില്ല’ എന്നു വിവർത്തനം ചെയ്യുക, അല്ലെങ്കിൽ ദൈവിക അധികാരത്തെ വിശദീകരിക്കുന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക ഭാഷ ചേർക്കുക.
  rationale: മൂലവാക്യം യേശുവിന്റെ വാക്കുകളുടെ ഉറപ്പും സ്ഥിരതയും ശക്തമായി അവകാശപ്പെടുന്നു. അധികമായ സിദ്ധാന്തവിശദീകരണം ചേർക്കാതെ ആ ദൈവശാസ്ത്രഭാരം പരിഭാഷ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഒഴിഞ്ഞുപോകും/ഒഴിഞ്ഞുപോകുകയില്ല’ എന്ന ആവർത്തനം ഗ്രീക്ക് ക്രിയയുടെ ആവർത്തനവും വാക്യത്തിലെ ശക്തമായ വൈരുധ്യവും നിലനിർത്തുന്നു.
