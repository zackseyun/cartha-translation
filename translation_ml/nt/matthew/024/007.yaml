id: MAT.24.7
reference: Matthew 24:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐγερθήσεται γὰρ ἔθνος ἐπὶ ἔθνος καὶ βασιλεία ἐπὶ βασιλείαν, καὶ ἔσονται ⸀λιμοὶ καὶ σεισμοὶ κατὰ τόπους·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/007.yaml
  text: For nation will rise against nation[a], and kingdom against kingdom[b], and there will be famines and earthquakes in various places.
translation:
  language: ml
  text: കാരണം, ജനത ജനതയ്ക്കെതിരെയും[a] രാജ്യം രാജ്യത്തിനെതിരെയും എഴുന്നേൽക്കും; പല സ്ഥലങ്ങളിലും[b] ക്ഷാമങ്ങളും ഭൂകമ്പങ്ങളും ഉണ്ടാകും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ജനത ജനതയ്ക്കുമേൽ ഉയർന്നുവരും.’ ഗ്രീക്ക് പ്രയോഗം ജനസമൂഹങ്ങൾ തമ്മിലുള്ള ശത്രുത പൊട്ടിപ്പുറപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘വ്യത്യസ്ത സ്ഥലങ്ങളിൽ’ അല്ലെങ്കിൽ ‘സ്ഥലംതോറും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθήσεται
  choice: എഴുന്നേൽക്കും
  rationale: ഈ ശത്രുതാസൂചക പ്രയോഗത്തിൽ ക്രിയയുടെ അർഥം മറ്റൊരു ജനതയ്ക്കെതിരെ പോരാട്ടത്തിനായി ഉയർന്നുവരുക എന്നതാണ്. ദൈവിക കാരണത്വം കൂട്ടിച്ചേർക്കാതെ സംഘർഷം പൊട്ടിപ്പുറപ്പെടുന്നതിനെ ഈ രൂപം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻസന്ദർഭത്തിലെ പ്രസ്താവനയ്ക്ക് വിശദീകരണം നൽകുന്ന ബന്ധം മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἔθνος
  choice: ജനത
  rationale: രാഷ്ട്രീയവും വംശീയവുമായ സമൂഹങ്ങളെ ഉൾക്കൊള്ളാൻ കഴിയുന്ന പദമാണിത്; സമാന്തരമായ ‘രാജ്യം’ എന്ന പദത്തോടും യോജിക്കുന്നു. ‘ജാതി’ എന്ന പദത്തിന് ആധുനിക മലയാളത്തിൽ ഉണ്ടാകാവുന്ന വർണവ്യവസ്ഥാസംബന്ധിയായ തെറ്റിദ്ധാരണയും ഒഴിവാക്കുന്നു.
- source_word: ἐπὶ ἔθνος
  choice: ജനതയ്ക്കെതിരെ
  rationale: ἐπί + accusative ഇവിടെ ശത്രുതയെയും എതിർപ്പിനെയും സൂചിപ്പിക്കുന്നതിനാൽ ‘എതിരെ’ എന്നത് സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: βασιλεία
  choice: രാജ്യം
  rationale: ഇവിടെ രാജാധികാരത്തിന്റെ അമൂർത്ത ആശയത്തേക്കാൾ രാഷ്ട്രീയ ഭൂപ്രദേശമോ ഭരണകൂടമോ ആണ് ഉദ്ദേശ്യം; ‘ജനത’യോടുള്ള സമാന്തരതയും ഇത് കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: ἔσονται
  choice: ഉണ്ടാകും
  rationale: εἰμίയുടെ അസ്തിത്വസൂചക ഭാവിയെ മലയാളത്തിൽ ലളിതവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: λιμοὶ
  choice: ക്ഷാമങ്ങൾ
  rationale: ഗുരുതരമായ ഭക്ഷ്യക്ഷാമങ്ങളെ സൂചിപ്പിക്കുന്ന ബഹുവചനത്തെ നിലനിർത്തുന്നു.
- source_word: σεισμοὶ
  choice: ഭൂകമ്പങ്ങൾ
  rationale: ഈ സന്ദർഭത്തിൽ σεισμός എന്നതിന്റെ വ്യക്തവും പതിവുമായ അർഥം ഭൂകമ്പമാണ്; മൂലത്തിലെ ബഹുവചനവും നിലനിർത്തുന്നു.
- source_word: κατὰ τόπους
  choice: പല സ്ഥലങ്ങളിലും
  rationale: സംഭവങ്ങൾ ഒരു സ്ഥലത്തല്ല, വ്യത്യസ്ത സ്ഥലങ്ങളിൽ വിതരണംചെയ്ത് ഉണ്ടാകുമെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: അന്ത്യകാല സംഘർഷവചനത്തിലെ ἔθνος എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: ജനത
  alternative: രാജ്യം; ജാതി; അന്യജാതി
  rationale: രാഷ്ട്രീയ-വംശീയ സമൂഹങ്ങളെ പൊതുവായി സൂചിപ്പിക്കുന്ന മൂലപദത്തിന്റെ വ്യാപ്തി ‘ജനത’ നിലനിർത്തുന്നു. ‘അന്യജാതി’ എന്നത് ഇല്ലാത്ത പ്രത്യേക മതപരമായ അർഥം ചേർക്കും; ‘ജാതി’ ആധുനിക മലയാളത്തിൽ തെറ്റായ സാമൂഹിക അർഥം ഉണർത്താം.
- issue: ἐγερθήσεται എന്ന ഭാവി passive/middle രൂപത്തിന്റെ പ്രാബല്യം
  choice: എഴുന്നേൽക്കും
  alternative: എഴുന്നേൽപ്പിക്കപ്പെടും; ഉയർന്നുവരും
  rationale: പ്രയോഗം സംഘർഷം ആരംഭിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘എഴുന്നേൽപ്പിക്കപ്പെടും’ എന്ന് വിവർത്തനം ചെയ്താൽ മൂലവാക്യം വ്യക്തമാക്കാത്ത ദൈവികമോ ബാഹ്യമോ ആയ കാരണത്വം വായനയിൽ വരാൻ ഇടയുണ്ട്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ജനത’ രാഷ്ട്രീയ-വംശീയ വ്യാപ്തി നിലനിർത്തുന്നു; ‘ക്ഷാമങ്ങൾ’, ‘ഭൂകമ്പങ്ങൾ’ എന്നീ ബഹുവചനങ്ങൾ ഗ്രീക്ക് രൂപങ്ങളെ പിന്തുടരുന്നു. വായനാസൗകര്യത്തിനായി രണ്ടാമത്തെ καί അർധവിരാമത്തിലൂടെ ബന്ധിപ്പിച്ചിരിക്കുന്നു; എല്ലാ അടിക്കുറിപ്പ് സൂചകങ്ങളും മുഖ്യപാഠത്തിൽ നൽകിയിട്ടുണ്ട്.
