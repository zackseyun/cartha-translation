id: MAT.24.43
reference: Matthew 24:43
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐκεῖνο δὲ γινώσκετε ὅτι εἰ ᾔδει ὁ οἰκοδεσπότης ποίᾳ φυλακῇ ὁ κλέπτης ἔρχεται, ἐγρηγόρησεν ἂν καὶ οὐκ ἂν εἴασεν διορυχθῆναι τὴν οἰκίαν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/043.yaml
  text: 'But know this: if the master of the house had known in what watch the thief was coming[b][a], he would have stayed awake and would not have let his house be broken into.'
translation:
  language: ml
  text: 'എന്നാൽ ഇതു മനസ്സിലാക്കുക: ഏതു രാത്രിയാമത്തിലാണ്[a] കള്ളൻ വരുന്നതെന്ന് വീട്ടുടമ അറിഞ്ഞിരുന്നെങ്കിൽ, അയാൾ ഉണർന്നിരിക്കുമായിരുന്നു; കള്ളൻ തന്റെ വീട് തുരന്ന് അകത്തു കടക്കാൻ അനുവദിക്കുകയുമില്ലായിരുന്നു.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘രാത്രിയാമം’ എന്നത് രാത്രിയെ കാവലിനായി വിഭജിച്ചിരുന്ന സമയഘട്ടങ്ങളിൽ ഒന്നിനെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘തന്റെ വീട് തുരക്കപ്പെടാൻ’; പുരാതന വീടുകളുടെ മതിലിലൂടെ തുരന്ന് കള്ളൻ അകത്തു കടക്കുന്നതിനെ ഇത് സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνο δὲ γινώσκετε
  choice: എന്നാൽ ഇതു മനസ്സിലാക്കുക
  rationale: δέ സൂചിപ്പിക്കുന്ന ആശയമാറ്റവും γινώσκετε എന്ന നേരിട്ടുള്ള ആഹ്വാനവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: οἰκοδεσπότης
  choice: വീട്ടുടമ
  rationale: വീടിന്റെയോ കുടുംബത്തിന്റെയോ ചുമതലയുള്ള ആളെ സന്ദർഭത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്ന, സാധാരണക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന പദം.
- source_word: ποίᾳ φυλακῇ
  choice: ഏതു രാത്രിയാമത്തിൽ
  rationale: φυλακή ഇവിടെ രാത്രിയെ വിഭജിച്ചിരുന്ന കാവൽയാമത്തെ സൂചിപ്പിക്കുന്നു; ‘രാത്രിയാമം’ കാലപരവും സാംസ്കാരികവുമായ പ്രത്യേകത നിലനിർത്തുന്നു.
- source_word: ὁ κλέπτης ἔρχεται
  choice: കള്ളൻ വരുന്നതെന്ന്
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാലരൂപം അതേപടി നിലനിർത്തുകയും സാങ്കൽപ്പിക നിബന്ധനാവാക്യത്തിൽ സ്വാഭാവികമായി ചേരുകയും ചെയ്യുന്നു.
- source_word: ἐγρηγόρησεν ἂν
  choice: ഉണർന്നിരിക്കുമായിരുന്നു
  rationale: രാത്രിയിലെ കള്ളന്റെ ദൃശ്യസന്ദർഭത്തിൽ γρηγορέω എന്നതിന്റെ ‘ഉണർന്നിരിക്കുക’ എന്ന അർഥം നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: οὐκ ἂν εἴασεν
  choice: അനുവദിക്കുകയുമില്ലായിരുന്നു
  rationale: അനുവാദമോ അവസരമോ നൽകാതിരിക്കുക എന്ന ആശയം ഗൗരവമുള്ള, സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: διορυχθῆναι τὴν οἰκίαν αὐτοῦ
  choice: തന്റെ വീട് തുരന്നുകയറാൻ
  rationale: διορύσσω എന്നതിലെ ‘തുരക്കുക’ എന്ന ദൃശ്യവിശദാംശവും മോഷണത്തിനായി അകത്തു കടക്കുക എന്ന സന്ദർഭാർഥവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
theological_decisions:
- issue: വീട്ടുകാരന്റെ രൂപകം എങ്ങനെ അവതരിപ്പിക്കണം
  choice: വീട്ടുടമ
  alternative: വീട്ടിന്റെ യജമാനൻ
  rationale: ഇത് ഉപമാപരമായ ഒരു ഉദാഹരണമാണ്, ദൈവശാസ്ത്രപരമായ ഔദ്യോഗിക സ്ഥാനനാമമല്ല. ‘വീട്ടുടമ’ അർഥം വ്യക്തമായി നൽകുന്നു; അനാവശ്യമായ മതപരമായ നിറം ചേർക്കുന്നില്ല.
- issue: പുരാതനകാലത്തെ മോഷണരീതി എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: വീട് തുരന്നുകയറാൻ
  alternative: വീട്ടിൽ അതിക്രമിച്ചുകയറാൻ
  rationale: മതിൽ തുരന്ന് അകത്തു കടക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന മൂലപദത്തിന്റെ വ്യക്തമായ ദൃശ്യരൂപം പ്രധാന പാഠത്തിൽത്തന്നെ കാത്തുസൂക്ഷിക്കുന്നു; അതോടൊപ്പം മോഷണപ്രവേശനത്തിന്റെ ഉദ്ദേശ്യവും മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. നിബന്ധനാവാക്യത്തിലെ സാങ്കൽപ്പിക ഭൂതകാലബന്ധം ‘അറിഞ്ഞിരുന്നെങ്കിൽ … ഇരിക്കുമായിരുന്നു’ എന്ന ഘടനയിൽ വ്യക്തമായി നൽകിയിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
