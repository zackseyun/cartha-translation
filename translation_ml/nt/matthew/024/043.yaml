  naturalness: ആദ്യഭാഗം സ്വാഭാവികവും ആധുനിക നിലവാരമലയാളത്തിനൊത്തതുമാണ്. രണ്ടാം ഭാഗത്തിലെ ക്രിയാവിന്യാസം കള്ളനെ വ്യക്തമാക്കുന്നതിലൂടെ കൂടുതൽ സുഗമവും വ്യാകരണപരമായി തെളിച്ചമുള്ളതുമാകുന്നു. അടിക്കുറിപ്പ് a അതു വിശദീകരിക്കുന്ന ‘രാത്രിയാമം’ എന്ന പദത്തോടു ചേർത്ത് സ്ഥാപിച്ചിരിക്കുന്നു.
