id: MAT.24.46
reference: Matthew 24:46
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μακάριος ὁ δοῦλος ἐκεῖνος ὃν ἐλθὼν ὁ κύριος αὐτοῦ εὑρήσει ⸂οὕτως ποιοῦντα⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/046.yaml
  text: Blessed is that servant whom his lord, when he comes, will find doing so.
translation:
  language: ml
  text: യജമാനൻ വരുമ്പോൾ അങ്ങനെ ചെയ്തുകൊണ്ടിരിക്കുന്നതായി കണ്ടെത്തുന്ന ആ ദാസൻ ഭാഗ്യവാൻ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριος
  choice: അനുഗൃഹീതൻ
  rationale: ദൈവാനുകൂല്യവും ഭാഗ്യകരമായ നിലയും സൂചിപ്പിക്കുന്ന മകരിയോസ് എന്ന പദത്തിന്റെ ഗൗരവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δοῦλος
  choice: ദാസൻ
  rationale: അന്നത്തെ യജമാനൻ–ദാസൻ ബന്ധം വ്യക്തമാക്കുന്ന നേരിട്ടുള്ള പദം.
- source_word: κύριος
  choice: യജമാനൻ
  rationale: αὐτοῦ എന്ന ബന്ധസൂചനയോടുകൂടിയ ഉപമാസന്ദർഭത്തിൽ ദാസന്റെ അധികാരിയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ഇവിടെ ദൈവനാമസൂചന നിർബന്ധമായി ചേർക്കുന്നില്ല.
- source_word: οὕτως ποιοῦντα
  choice: അങ്ങനെ ചെയ്യുന്നതായി
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ ചുമതല നിർവഹിക്കുന്നതിലേക്കുള്ള οὕτως എന്ന സൂചന സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: κύριος എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: യജമാനൻ
  alternative: കർത്താവ്
  rationale: ഉപമയിലെ ദാസന്റെ യജമാനനെയാണ് നേരിട്ടുള്ള തലത്തിൽ പദം സൂചിപ്പിക്കുന്നത്. അതേസമയം ഉപമയുടെ ക്രിസ്തുസംബന്ധിയായ പ്രയോഗം വിവർത്തനം തടയുന്നില്ല.
- issue: μακάριος എന്നതിലെ അനുഗ്രഹത്തിന്റെ സ്വഭാവം
  choice: അനുഗൃഹീതൻ
  alternative: ഭാഗ്യവാൻ
  rationale: വെറും ഭാഗ്യത്തെക്കാൾ അംഗീകാരവും അനുഗ്രഹീതമായ നിലയും പ്രകടമാക്കുന്നു; പ്രതിഫലത്തിന്റെ വിശദാംശങ്ങൾ വാക്യത്തിലേക്ക് കൂട്ടിച്ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. ഗ്രീക്ക് വാക്യത്തിന്റെ ഊന്നലും സംക്ഷിപ്തതയും നിലനിർത്തി; അനാവശ്യമായ വ്യാഖ്യാനപദങ്ങൾ ചേർത്തിട്ടില്ല.
