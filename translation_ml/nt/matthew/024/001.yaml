reference: Matthew 24:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἐξελθὼν ὁ Ἰησοῦς ⸂ἀπὸ τοῦ ἱεροῦ ἐπορεύετο⸃, καὶ προσῆλθον οἱ μαθηταὶ αὐτοῦ ἐπιδεῖξαι αὐτῷ τὰς οἰκοδομὰς τοῦ ἱεροῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/001.yaml
  text: And Jesus went out from the temple and was going away[a], and his disciples came to show him the buildings of the temple.
translation:
  language: ml
  text: യേശു ദൈവാലയത്തിൽനിന്ന് പുറത്തുവന്ന് പോകുകയായിരുന്നു; അപ്പോൾ ശിഷ്യന്മാർ ദൈവാലയത്തിന്റെ കെട്ടിടങ്ങൾ അദ്ദേഹത്തിന് കാണിച്ചുകൊടുക്കാൻ അടുത്തുവന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘ദൈവാലയം’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ഗ്രീക്ക് പദമായ ἱερόν, അകത്തെ വിശുദ്ധമന്ദിരത്തെ മാത്രം അല്ല, ദൈവാലയസമുച്ചയത്തെയും അതിന്റെ പരിസരങ്ങളെയും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: പുറത്തുവന്ന്
  rationale: ἐξέρχομαι എന്ന ക്രിയയുടെ ഏറിസ്റ്റ് കൃദന്തം മുഖ്യക്രിയയ്ക്കു മുമ്പുള്ള അനുബന്ധ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘പുറത്തുവന്ന്’ ദിശാബോധവും പ്രവൃത്തികളുടെ ക്രമവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἱεροῦ
  choice: ദൈവാലയം
  rationale: ἱερόν അകത്തെ വിശുദ്ധമന്ദിരത്തെ മാത്രം അല്ല, വിശാലമായ ദൈവാലയസമുച്ചയത്തെ സൂചിപ്പിക്കുന്നു. മലയാള ബൈബിൾഭാഷയിൽ സ്വാഭാവികവും വായനക്കാർക്ക് പരിചിതവുമായ ‘ദൈവാലയം’ മുഖ്യപാഠത്തിൽ ഉപയോഗിച്ച് കൃത്യമായ വ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐπορεύετο
  choice: അവിടെനിന്ന് പോകുകയായിരുന്നു
  rationale: ഇംപർഫെക്റ്റ് രൂപം തുടരുന്ന സഞ്ചാരത്തെ സൂചിപ്പിക്കുന്നു. ‘പോകുകയായിരുന്നു’ ആ അപൂർണ്ണകാലഭാവം നിലനിർത്തുന്നു; ‘അവിടെനിന്ന്’ പുറപ്പെട്ടുപോകുന്ന ദിശ വ്യക്തമാക്കുന്നു.
- source_word: προσῆλθον
  choice: അടുത്തുവന്നു
  rationale: προσέρχομαι എന്ന പദത്തിന്റെ സമീപിക്കുന്ന ചലനം ‘അടുത്തുവന്നു’ എന്നതിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രതിഫലിക്കുന്നു.
- source_word: ἐπιδεῖξαι
  choice: കാണിക്കാനായി
  rationale: ഇൻഫിനിറ്റീവ് ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു; ശിഷ്യന്മാർ അടുത്തുവന്നതിന്റെ ലക്ഷ്യം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: οἰκοδομὰς
  choice: കെട്ടിടങ്ങൾ
  rationale: οἰκοδομή ഇവിടെ നിർമ്മിത കെട്ടിടങ്ങളെയോ ഘടനകളെയോ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ ‘കെട്ടിടങ്ങൾ’ ഏറ്റവും വ്യക്തമായ സാധാരണപ്രയോഗമാണ്.
- source_word: τοῦ ἱεροῦ
  choice: ദൈവാലയത്തിന്റെ
  rationale: കെട്ടിടങ്ങൾ ദൈവാലയസമുച്ചയത്തിന്റേതാണെന്ന് ജനിറ്റീവ് വ്യക്തമാക്കുന്നു; ഗ്രീക്കിലെ ആവർത്തനവും ആഖ്യാനത്തിലെ ഊന്നലും പരിഭാഷയിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἱερόν എന്ന പദവും ναός എന്ന പദവും തമ്മിലുള്ള വ്യത്യാസം
  choice: മുഖ്യപാഠത്തിൽ ‘ദൈവാലയം’; അടിക്കുറിപ്പിൽ ‘ദൈവാലയസമുച്ചയം/പരിസരം’ എന്ന വ്യാപ്തി വ്യക്തമാക്കുന്നു
  alternative: മുഖ്യപാഠത്തിൽ ‘ദൈവാലയസമുച്ചയം’
  rationale: ഈ വാക്യത്തിലെ ἱερόν അകത്തെ വിശുദ്ധമന്ദിരത്തെ മാത്രം അല്ല, മുഴുവൻ ദൈവാലയപരിസരത്തെയാണ് സൂചിപ്പിക്കുന്നത്. വായനാസൗകര്യത്തിനായി പതിവായ ‘ദൈവാലയം’ നിലനിർത്തുകയും പദത്തിന്റെ കൃത്യമായ വ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ പ്രവൃത്തിക്രമവും ἐπορεύετο എന്ന ക്രിയയുടെ തുടരുന്ന ഭാവവും നിലനിർത്തി. ‘അദ്ദേഹത്തെ’ എന്ന രൂപം സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ആദരസൂചകവുമാണ്.
