  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τότε ⸂δύο ἔσονται⸃ ἐν τῷ ἀγρῷ, ⸀εἷς παραλαμβάνεται καὶ ⸁εἷς ἀφίεται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/040.yaml
  text: Then two men will be in the field; one is taken and one is left.
translation:
  language: ml
  text: അപ്പോൾ രണ്ടു പുരുഷന്മാർ വയലിലായിരിക്കും; ഒരാൾ കൊണ്ടുപോകപ്പെടും[a], മറ്റേയാൾ വിട്ടുകളയപ്പെടും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഒരാൾ കൂടെ കൂട്ടിക്കൊണ്ടുപോകപ്പെടും’ എന്നും പരിഭാഷപ്പെടുത്താം. ഈ ക്രിയതന്നെ, കൊണ്ടുപോകുന്നത് രക്ഷയ്ക്കായാണോ ന്യായവിധിക്കായാണോ എന്നു വ്യക്തമാക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: അപ്പോൾ
  rationale: മുമ്പുള്ള അന്ത്യകാലസന്ദർഭവുമായി ഈ വാക്യത്തെ ബന്ധിപ്പിക്കുന്ന സ്വാഭാവികവും സംക്ഷിപ്തവുമായ കാലസൂചകം.
- source_word: δύο ἔσονται
  choice: രണ്ടു പുരുഷന്മാർ ... ആയിരിക്കും
  rationale: ഗ്രീക്കിൽ സംഖ്യാവാചകം മാത്രമാണെങ്കിലും തുടർന്നുള്ള εἷς ... εἷς എന്നീ പുല്ലിംഗരൂപങ്ങളും അടുത്ത വാക്യത്തിലെ സ്ത്രീകളെക്കുറിച്ചുള്ള സമാന്തരദൃശ്യവും ഇവിടെ പുരുഷന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്. അതിനാൽ ഉറവിടത്തിലെ ലിംഗവ്യത്യാസം വ്യക്തമാക്കുന്നു.
- source_word: ἐν τῷ ἀγρῷ
  choice: വയലിൽ
  rationale: സ്ഥാനത്തെ നേരിട്ടും സ്വാഭാവികമായും സൂചിപ്പിക്കുന്ന പ്രയോഗം.
- source_word: εἷς ... εἷς
  choice: ഒരാൾ ... മറ്റേയാൾ
  rationale: രണ്ടുപേരും തമ്മിലുള്ള വിരുദ്ധഫലം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു; രണ്ടാമത്തെ εἷς-നെ ‘മറ്റേയാൾ’ എന്നു നൽകുന്നത് അർഥം കൂട്ടാതെ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: παραλαμβάνεται
  choice: കൊണ്ടുപോകപ്പെടും
  rationale: ഭാവിസന്ദർഭത്തിൽ ഉപയോഗിച്ചിരിക്കുന്ന വർത്തമാനകാല കർമണിപ്രയോഗം. ‘കൊണ്ടുപോകപ്പെടും’ എന്നത് രക്ഷയ്ക്കായാണോ ന്യായവിധിക്കായാണോ കൊണ്ടുപോകുന്നത് എന്നു സ്വയം നിർണയിക്കാതെ ക്രിയയുടെ സന്ദർഭപരമായ അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
- source_word: ἀφίεται
  choice: വിട്ടേക്കപ്പെടും
  rationale: ഇവിടെ ‘ശേഷിക്കും’ എന്നതിനെക്കാൾ ഗ്രീക്ക് കർമണിപ്രയോഗത്തോട് അടുത്തതും, ‘ഉപേക്ഷിക്കപ്പെടും’ എന്നതുപോലെ അമിതമായ ഭാവം ചേർക്കാത്തതുമായ സ്വാഭാവിക മലയാളം.
theological_decisions:
- issue: παραλαμβάνεται എന്നത് രക്ഷയ്ക്കായി കൊണ്ടുപോകുന്നതാണോ ന്യായവിധിക്കായി കൊണ്ടുപോകുന്നതാണോ
  choice: പ്രധാനപാഠത്തിൽ നിഷ്പക്ഷമായ ‘കൊണ്ടുപോകപ്പെടും’ നിലനിർത്തി.
  alternative: ‘രക്ഷയ്ക്കായി കൂട്ടിക്കൊണ്ടുപോകപ്പെടും’ അല്ലെങ്കിൽ ‘ന്യായവിധിക്കായി പിടിച്ചുകൊണ്ടുപോകപ്പെടും’.
  rationale: നോഹയുടെ കാലത്തെക്കുറിച്ചുള്ള സമീപസന്ദർഭം വ്യത്യസ്ത വ്യാഖ്യാനങ്ങൾക്ക് ഇടനൽകുന്നു. ഒരു പ്രത്യേക അന്ത്യകാലവ്യവസ്ഥയെ വിവർത്തനംകൊണ്ട് ഉറപ്പിക്കാതെ മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തണം.
- issue: δύο എന്നതിലെ പുരുഷസൂചന മലയാളത്തിൽ വ്യക്തമാക്കണമോ
  choice: ‘രണ്ടു പുരുഷന്മാർ’ എന്നു നൽകി.
  alternative: ലിംഗം വ്യക്തമാക്കാത്ത ‘രണ്ടുപേർ’.
  rationale: δύο എന്ന പദം സ്വതവേ ‘പുരുഷന്മാർ’ എന്നു പറയുന്നില്ലെങ്കിലും εἷς ... εἷς എന്നീ പുല്ലിംഗരൂപങ്ങളും അടുത്ത വാക്യത്തിലെ സ്ത്രീകളെക്കുറിച്ചുള്ള സമാന്തരവും ഈ ദൃശ്യത്തിലെ പുരുഷസൂചനയെ പിന്തുണയ്ക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കൊണ്ടുപോകപ്പെടും’/‘വിട്ടേക്കപ്പെടും’ എന്ന സമാന്തര കർമണിരൂപങ്ങൾ മൂലപാഠത്തിന്റെ സംക്ഷിപ്തമായ വിരുദ്ധഘടന നിലനിർത്തുന്നു.
