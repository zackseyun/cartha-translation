id: MAT.24.6
reference: Matthew 24:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μελλήσετε δὲ ἀκούειν πολέμους καὶ ἀκοὰς πολέμων· ὁρᾶτε, μὴ θροεῖσθε· δεῖ ⸀γὰρ γενέσθαι, ἀλλ’ οὔπω ἐστὶν τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/006.yaml
  text: And you are going to hear of wars and reports of wars. See that you are not alarmed[a], for it must happen, but the end is not yet.
translation:
  language: ml
  text: നിങ്ങൾ യുദ്ധങ്ങളെക്കുറിച്ചും യുദ്ധവാർത്തകളെക്കുറിച്ചും കേൾക്കാനിരിക്കുന്നു. പരിഭ്രമിക്കാതിരിക്കാൻ ശ്രദ്ധിക്കുക; ഇവ സംഭവിക്കേണ്ടതാണ്, എന്നാൽ അവസാനം ഇനിയും വന്നിട്ടില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യുദ്ധങ്ങളെക്കുറിച്ചുള്ള കേൾവികൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പ്രയോഗത്തിന് വാർത്തകൾ, റിപ്പോർട്ടുകൾ, അല്ലെങ്കിൽ അഭ്യൂഹങ്ങൾ എന്നിങ്ങനെ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: μελλήσετε
  choice: കേൾക്കാനിരിക്കുന്നു
  rationale: μέλλωയുടെ പ്രതീക്ഷിക്കപ്പെടുന്ന ഭാവികാലബലം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ഉടൻതന്നെ എന്ന ആശയം അനാവശ്യമായി ശക്തമാക്കുന്നില്ല.
- source_word: ἀκούειν πολέμους
  choice: യുദ്ധങ്ങളെക്കുറിച്ച് ... കേൾക്കുക
  rationale: നേരിട്ടുള്ള ശബ്ദാനുഭവമല്ല, യുദ്ധങ്ങളെ സംബന്ധിച്ച വിവരം ലഭിക്കുന്നതാണ് സന്ദർഭത്തിലെ അർഥം.
- source_word: ἀκοὰς πολέμων
  choice: യുദ്ധവാർത്തകൾ
  rationale: ἀκοή ഇവിടെ വാർത്ത, റിപ്പോർട്ട്, കേൾവി എന്നീ അർഥങ്ങൾ ഉൾക്കൊള്ളാം. ‘യുദ്ധവാർത്തകൾ’ വ്യാജമാണെന്ന സൂചന നൽകാതെ വിശാലമായ അർഥം നിലനിർത്തുന്നു.
- source_word: ὁρᾶτε, μὴ θροεῖσθε
  choice: പരിഭ്രമിക്കാതിരിക്കാൻ സൂക്ഷിച്ചുകൊള്ളുക
  rationale: ὁρᾶτε നൽകുന്ന ജാഗ്രതാനിർദേശവും θροεῖσθε സൂചിപ്പിക്കുന്ന മനസ്സുകലക്കമോ പരിഭ്രമമോ ഒരുമിച്ച് സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: δεῖ γὰρ γενέσθαι
  choice: ഇവ സംഭവിക്കേണ്ടതാണ്
  rationale: δεῖയുടെ അനിവാര്യത നിലനിർത്തുന്നു. γενέσθαιയ്ക്ക് ഗ്രീക്കിൽ വ്യക്തമായി പറഞ്ഞ കർത്താവില്ലാത്തതിനാൽ, മുൻപറഞ്ഞ യുദ്ധങ്ങളും വാർത്തകളും സൂചിപ്പിക്കുന്ന ‘ഇവ’ മലയാളത്തിലെ വ്യക്തതയ്ക്കായി ചേർക്കുന്നു.
- source_word: ἀλλ’ οὔπω ἐστὶν τὸ τέλος
  choice: എന്നാൽ അവസാനം ഇനിയും ആയിട്ടില്ല
  rationale: τὸ τέλος എന്നതിന്റെ വിശാലമായ അന്ത്യകാലസൂചന ചുരുക്കുകയോ പ്രത്യേക വ്യാഖ്യാനപദ്ധതിയോട് ബന്ധിപ്പിക്കുകയോ ചെയ്യാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: τὸ τέλος എന്ന അന്ത്യകാലപ്രയോഗം
  choice: അവസാനം
  alternative: അന്തിമ സമാപ്തി
  rationale: ഗ്രീക്കിലെ വിശാലത സംരക്ഷിക്കുകയും പ്രത്യേക സഹസ്രാബ്ദമോ കഷ്ടകാലക്രമമോ പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: δεῖ സൂചിപ്പിക്കുന്ന അനിവാര്യത
  choice: സംഭവിക്കേണ്ടതാണ്
  alternative: സംഭവിക്കും
  rationale: വെറും പ്രവചനഭാവിക്കപ്പുറം മൂലപാഠത്തിലുള്ള അനിവാര്യത നിലനിർത്തുന്നു; അതിന്റെ ദൈവശാസ്ത്രപരമായ സ്വഭാവം അധികമായി വിശദീകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പരിഭ്രമിക്കുക’, ‘അവസാനം’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും മൂലപാഠത്തിന്റെ തീവ്രതയും വിശാലതയും നിലനിർത്തുന്നതുമാണ്.
