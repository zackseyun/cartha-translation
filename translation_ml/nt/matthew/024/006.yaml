revisions:
- from: നിങ്ങൾ യുദ്ധങ്ങളെക്കുറിച്ചും യുദ്ധവാർത്തകളെക്കുറിച്ചും കേൾക്കാനിരിക്കുന്നു. പരിഭ്രമിക്കാതിരിക്കാൻ സൂക്ഷിച്ചുകൊള്ളുക; ഇവ സംഭവിക്കേണ്ടതാണ്. എന്നാൽ അവസാനം ഇനിയും ആയിട്ടില്ല.[a]
  to: നിങ്ങൾ യുദ്ധങ്ങളെക്കുറിച്ചും യുദ്ധവാർത്തകളെക്കുറിച്ചും കേൾക്കാനിരിക്കുന്നു. പരിഭ്രമിക്കാതിരിക്കാൻ ശ്രദ്ധിക്കുക; ഇവ സംഭവിക്കേണ്ടതാണ്, എന്നാൽ അവസാനം ഇനിയും വന്നിട്ടില്ല.[a]
