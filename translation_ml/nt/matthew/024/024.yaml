id: MAT.24.24
reference: Matthew 24:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐγερθήσονται γὰρ ψευδόχριστοι καὶ ψευδοπροφῆται, καὶ δώσουσιν σημεῖα μεγάλα καὶ τέρατα ὥστε ⸀πλανῆσαι εἰ δυνατὸν καὶ τοὺς ἐκλεκτούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/024.yaml
  text: For false messiahs and false prophets will arise[a], and they will perform great signs and wonders so as to lead astray, if possible[c][b], even the elect.
translation:
  language: ml
  text: കാരണം വ്യാജ മിശിഹാമാരും[a] വ്യാജപ്രവാചകന്മാരും എഴുന്നേൽക്കും; സാധ്യമെങ്കിൽ[c], തിരഞ്ഞെടുക്കപ്പെട്ടവരെപ്പോലും വഴിതെറ്റിക്കത്തക്കവണ്ണം[b] അവർ വലിയ അടയാളങ്ങളും അത്ഭുതങ്ങളും പ്രവർത്തിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വ്യാജക്രിസ്തുക്കൾ.’ ഗ്രീക്കിൽ ക്രിസ്റ്റോസ് (Christos) എന്ന സ്ഥാനപ്പേരാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; ഇവിടെ അത് പേരിനെക്കാൾ സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നതിനാൽ ‘മിശിഹാമാർ’ എന്നു പരിഭാഷപ്പെടുത്തി.
    reason: alternative_reading
  - marker: b
    text: ‘വഴിതെറ്റിക്കുക’ എന്നതിന് ‘വഞ്ചിക്കുക’ എന്നും പരിഭാഷപ്പെടുത്താം. മൂലക്രിയയ്ക്ക് ഒരാളെ ശരിയായ വഴിയിൽനിന്ന് തെറ്റിക്കുക എന്ന അർഥവുമുണ്ട്.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘സാധ്യമായിരുന്നെങ്കിൽ.’ ഗ്രീക്കിൽ ‘സാധ്യമെങ്കിൽ’ എന്നു മാത്രമാണ്; അതിന്റെ ദൈവശാസ്ത്രപരമായ സൂചന വ്യക്തമാക്കാതെ വിടുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγερθήσονται
  choice: എഴുന്നേൽക്കും
  rationale: ഇവിടെ ക്രിയ ആളുകൾ രംഗത്തുവരുകയോ പ്രത്യക്ഷപ്പെടുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്; പുനരുത്ഥാനമെന്ന അർഥം വരുത്താതെ മൂലത്തിലെ രൂപകഭാവം നിലനിർത്തുന്നു.
- source_word: ψευδόχριστοι
  choice: വ്യാജമിശിഹാമാർ
  rationale: Χριστός ഇവിടെ പേരുപോലെയല്ല, സ്ഥാനപ്പേരായാണ് പ്രവർത്തിക്കുന്നത്; അതിനാൽ ‘മിശിഹാ’ യഹൂദ മിശിഹാപശ്ചാത്തലം വ്യക്തമാക്കുന്നു.
- source_word: ψευδοπροφῆται
  choice: വ്യാജപ്രവാചകന്മാർ
  rationale: സംയുക്തനാമത്തിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ മലയാള പരിഭാഷ.
- source_word: δώσουσιν
  choice: പ്രവർത്തിക്കും
  rationale: σημεῖα, τέρατα എന്നിവയോടൊപ്പമുള്ള δίδωμι എന്ന പ്രയോഗത്തിന് മലയാളത്തിൽ ‘പ്രവർത്തിക്കും’ സ്വാഭാവികമാണ്; അക്ഷരാർഥമായ ‘നൽകും’ ഇവിടെ യോജിക്കില്ല.
- source_word: σημεῖα μεγάλα καὶ τέρατα
  choice: വലിയ അടയാളങ്ങളും അത്ഭുതങ്ങളും
  rationale: ‘അടയാളങ്ങൾ’ എന്നത് σημεῖαയുടെ സൂചനാത്മക സ്വഭാവം നിലനിർത്തുന്നു; ‘അത്ഭുതങ്ങൾ’ τέραταയുടെ വിസ്മയജനക സ്വഭാവം നൽകുന്നു.
- source_word: ὥστε πλανῆσαι
  choice: വഴിതെറ്റിക്കത്തക്കവിധം
  rationale: ὥστε + infinitive ഉദ്ദേശ്യമോ ഫലമോ എന്നത് കർശനമായി തീർപ്പാക്കാതെ ഇരുവരുടെയും സാധ്യത നിലനിർത്തുന്നു.
- source_word: πλανῆσαι
  choice: വഴിതെറ്റിക്കുക
  rationale: വെറും തെറ്റായ വിവരം നൽകുന്നതിലധികം, ശരിയായ വഴിയിൽനിന്ന് അകറ്റുക എന്ന πλανάωയുടെ ദിശാഭാവം പകർത്തുന്നു.
- source_word: εἰ δυνατὸν
  choice: സാധ്യമെങ്കിൽ
  rationale: ഗ്രീക്കിലെ ചുരുക്കമുള്ള വ്യവസ്ഥ അതേപടി നിലനിർത്തുന്നു; പ്രതിവാസ്തവികത സൂചിപ്പിക്കുന്ന അധിക അർഥം ചേർക്കുന്നില്ല.
- source_word: καὶ τοὺς ἐκλεκτούς
  choice: തിരഞ്ഞെടുക്കപ്പെട്ടവരെപ്പോലും
  rationale: καίയുടെ ഊന്നൽ ‘പോലും’ കൊണ്ടും ἐκλεκτούς എന്നതിന്റെ അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ‘തിരഞ്ഞെടുക്കപ്പെട്ടവർ’ കൊണ്ടും നൽകുന്നു.
theological_decisions:
- issue: ψευδόχριστοι എന്നതിലെ Χριστός സ്ഥാനപ്പേരായി വിവർത്തനം ചെയ്യൽ
  choice: വ്യാജമിശിഹാമാർ
  alternative: വ്യാജക്രിസ്തുക്കൾ
  rationale: സന്ദർഭത്തിൽ പലരും മിശിഹാ അവകാശവാദവുമായി വരുന്നതാണ് ആശയം; ‘മിശിഹാ’ എന്ന സ്ഥാനപ്പേര് ഇത് വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- issue: തിരഞ്ഞെടുക്കപ്പെട്ടവരെ സംബന്ധിച്ച εἰ δυνατὸν എന്ന വ്യവസ്ഥയുടെ ശക്തി
  choice: സാധ്യമെങ്കിൽ
  alternative: സാധ്യമായിരുന്നെങ്കിൽ
  rationale: തിരഞ്ഞെടുക്കപ്പെട്ടവർ അന്തിമമായി വഴിതെറ്റിക്കപ്പെടുമോ എന്ന ദൈവശാസ്ത്രചർച്ചയ്ക്ക് വാക്യം തന്നെ തീർപ്പുനൽകുന്നുവെന്ന് കരുതാതെ, ഗ്രീക്കിലെ തുറന്ന വ്യവസ്ഥ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘വ്യാജമിശിഹാമാർ,’ ‘തിരഞ്ഞെടുക്കപ്പെട്ടവർ’ എന്നീ രൂപങ്ങൾ സാങ്കേതിക ആശയം നിലനിർത്തിക്കൊണ്ട് വ്യക്തത നൽകുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടുണ്ട്.
