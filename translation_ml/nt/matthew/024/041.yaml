  naturalness: ‘തിരികല്ലിൽ ധാന്യം പൊടിച്ചുകൊണ്ടിരിക്കും’ പൊതുവേ ഗ്രാഹ്യമാണ്; എങ്കിലും ‘ധാന്യം’ ഒഴിവാക്കി ‘തിരികല്ലിൽ അരച്ചുകൊണ്ടിരിക്കും’ എന്നു പറയുന്നത് കൂടുതൽ സംക്ഷിപ്തവും ഉറവിടനിഷ്ഠവുമാണ്. ‘വിട്ടേക്കപ്പെടും’ എന്നത് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമല്ല; ‘വിടും’ കൂടുതൽ സ്വാഭാവികമാണ്.
