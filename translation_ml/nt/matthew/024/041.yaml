id: MAT.24.41
reference: Matthew 24:41
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: δύο ἀλήθουσαι ἐν τῷ ⸀μύλῳ, μία παραλαμβάνεται καὶ μία ἀφίεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/041.yaml
  text: Two women will be grinding at the mill[c][b][a]; one is taken and one is left.
translation:
  language: ml
  text: രണ്ടു സ്ത്രീകൾ തിരികല്ലിൽ അരച്ചുകൊണ്ടിരിക്കും; ഒരുവളെ കൊണ്ടുപോകും, ഒരുവളെ വിടും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ‘ഒരുവളെ കൊണ്ടുപോകും, ഒരുവളെ വിടും’ എന്നുമാത്രമാണ്; കൊണ്ടുപോകപ്പെടുന്നത് രക്ഷയ്ക്കാണോ ന്യായവിധിക്കാണോ എന്ന് ഇവിടെ വ്യക്തമാക്കുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: δύο ἀλήθουσαι
  choice: രണ്ടു സ്ത്രീകൾ ... ധാന്യം പൊടിച്ചുകൊണ്ടിരിക്കും
  rationale: സ്ത്രീലിംഗ ബഹുവചനമായ ἀλήθουσαι സ്ത്രീകളെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി ‘സ്ത്രീകൾ’ വ്യക്തമാക്കുകയും, സന്ദർഭത്തിലെ പ്രവർത്തനം വ്യക്തമാക്കാൻ ‘ധാന്യം’ ചേർക്കുകയും ചെയ്തു.
- source_word: ἐν τῷ μύλῳ
  choice: തിരികല്ലിൽ
  rationale: μύλος അരയ്ക്കുന്ന ഉപകരണമോ കല്ലോ സൂചിപ്പിക്കാം. ഗാർഹികമായി ധാന്യം അരയ്ക്കുന്ന ഈ രംഗത്തിന് ആധുനിക മലയാളത്തിൽ ‘തിരികല്ല്’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: μία ... καὶ μία
  choice: ഒരുവൾ ... ഒരുവൾ
  rationale: രണ്ടു സ്ത്രീകൾക്കിടയിലെ വിതരണാത്മകമായ വൈരുധ്യം മലയാളത്തിലെ സ്ത്രീലിംഗരൂപംകൊണ്ട് കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: παραλαμβάνεται
  choice: സ്വീകരിക്കപ്പെടും
  rationale: παραλαμβάνω എന്നതിന് ‘കൂടെ സ്വീകരിക്കുക/കൊണ്ടുപോകുക’ എന്ന അർത്ഥവ്യാപ്തിയുണ്ട്. ‘സ്വീകരിക്കപ്പെടും’ കർമ്മണിപ്രയോഗം നിലനിർത്തുകയും ആരാണ് സ്വീകരിക്കുന്നതെന്നും അന്തിമഫലം എന്തെന്നും വ്യക്തമാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: καὶ
  choice: —
  rationale: ഗ്രീക്കിലെ ലളിതമായ ഏകോപനം മലയാളത്തിൽ അർദ്ധവിരാമത്തിനുശേഷമുള്ള സമാന്തര ഘടനയിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; ‘എന്നാൽ’ എന്ന വിരുദ്ധഭാവം ചേർത്തിട്ടില്ല.
- source_word: ἀφίεται
  choice: വിട്ടേക്കപ്പെടും
  rationale: ἀφίημι എന്നതിന്റെ നേരിട്ടുള്ള കർമ്മണിയർത്ഥം നൽകുന്നു. ‘ഉപേക്ഷിക്കപ്പെടും’ പോലുള്ള ശക്തമായ വ്യാഖ്യാനാത്മക പദം ഒഴിവാക്കി.
theological_decisions:
- issue: സ്ത്രീലിംഗ ബഹുവചനമായ കൃുദന്തരൂപത്തിൽ അന്തർനിഹിതമായ കർത്താക്കളെ വ്യക്തമാക്കണമോ
  choice: ‘രണ്ടു സ്ത്രീകൾ’ എന്ന് വ്യക്തമായി പരിഭാഷപ്പെടുത്തി
  alternative: ‘രണ്ടുപേർ തിരികല്ലിൽ പൊടിച്ചുകൊണ്ടിരിക്കും’
  rationale: ἀλήθουσαι സ്ത്രീലിംഗ ബഹുവചനമായതിനാൽ സ്ത്രീകളാണെന്ന ഉറവിടഭാഷയിലെ വിവരം മലയാളത്തിലും നിലനിർത്തണം.
- issue: παραλαμβάνεται / ἀφίεται രക്ഷയെയോ ന്യായവിധിയെയോ സൂചിപ്പിക്കുന്നുവെന്ന് വ്യക്തമാക്കണമോ
  choice: ‘സ്വീകരിക്കപ്പെടും’ / ‘വിട്ടേക്കപ്പെടും’ എന്ന വ്യാഖ്യാനനിരപേക്ഷമായ ഭാഷ നിലനിർത്തി
  alternative: ‘ഒരുവൾ രക്ഷയ്ക്കായി കൊണ്ടുപോകപ്പെടും, മറ്റവൾ ന്യായവിധിക്കായി ശേഷിക്കും’ അല്ലെങ്കിൽ അതിന്റെ വിപരീതം
  rationale: ഈ വാക്യം തന്നെ ഓരോ പ്രവൃത്തിയുടെയും അന്തിമ ദൈവശാസ്ത്രപരമായ ഫലം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ തർക്കവിഷയമായ അർത്ഥം മുഖ്യപാഠത്തിൽ തീർപ്പാക്കാതെ പിരിവിന്റെ സംഘർഷം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ‘തിരികല്ല്’ ഗാർഹിക ധാന്യപൊടിക്കൽ രംഗം സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു. വാക്യത്തിന്റെ ദൈവശാസ്ത്രപരമായ അവ്യക്തത അടിക്കുറിപ്പോടെ സംരക്ഷിച്ചിട്ടുണ്ട്.
