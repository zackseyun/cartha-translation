id: MAT.24.29
reference: Matthew 24:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εὐθέως δὲ μετὰ τὴν θλῖψιν τῶν ἡμερῶν ἐκείνων ὁ ἥλιος σκοτισθήσεται, καὶ ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς, καὶ οἱ ἀστέρες πεσοῦνται ἀπὸ τοῦ οὐρανοῦ, καὶ αἱ δυνάμεις τῶν οὐρανῶν σαλευθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/029.yaml
  text: But immediately after the tribulation of those days[a], the sun will be darkened, and the moon will not give its light, and the stars will fall from heaven[b], and the powers of the heavens will be shaken.
translation:
  language: ml
  text: എന്നാൽ ആ നാളുകളിലെ കഷ്ടത കഴിഞ്ഞ ഉടനെ സൂര്യൻ ഇരുണ്ടുപോകും; ചന്ദ്രൻ തന്റെ വെളിച്ചം നൽകുകയില്ല; നക്ഷത്രങ്ങൾ ആകാശത്തുനിന്ന് വീഴും[a]; ആകാശങ്ങളിലെ ശക്തികൾ ഇളക്കപ്പെടും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആകാശത്തുനിന്ന്’ എന്നതിന് ‘സ്വർഗത്തിൽനിന്ന്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘ആകാശങ്ങളിലെ ശക്തികൾ’ എന്നത് പ്രപഞ്ചശക്തികളെയോ ജ്യോതിർഗോളങ്ങളെയോ സ്വർഗീയ ശക്തികളെയോ സൂചിപ്പിക്കാം; ഗ്രീക്ക് പ്രയോഗത്തിന്റെ വിശാലത ഇവിടെ നിലനിർത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐθέως δὲ μετὰ
  choice: എന്നാൽ ... കഴിഞ്ഞ ഉടനെ
  rationale: δὲ സൂചിപ്പിക്കുന്ന നേരിയ വൈരുധ്യത്തോടുകൂടിയ തുടർച്ചയെ ‘എന്നാൽ’ എന്നും, Εὐθέως μετὰ എന്ന ശക്തമായ കാലസമീപ്യതയെ സ്വാഭാവിക മലയാളത്തിൽ ‘കഴിഞ്ഞ ഉടനെ’ എന്നും അവതരിപ്പിക്കുന്നു.
- source_word: τὴν θλῖψιν τῶν ἡμερῶν ἐκείνων
  choice: ആ നാളുകളിലെ കഷ്ടത
  rationale: θλῖψις എന്നത് കഷ്ടത, ദുരിതം, പീഡനം എന്നിവയെ സൂചിപ്പിക്കാം. ‘കഷ്ടത’ സന്ദർഭത്തിന്റെ ഗൗരവം നിലനിർത്തുകയും അർഥം പീഡനത്തിലേക്കു മാത്രം ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു; ഗ്രീക്കിലെ ബന്ധവും വ്യക്തമായി നിലനിൽക്കുന്നു.
- source_word: ὁ ἥλιος σκοτισθήσεται
  choice: സൂര്യൻ ഇരുണ്ടുപോകും
  rationale: ഗ്രീക്കിലെ ഭാവികാല നിഷ്ക്രിയരൂപത്തിന്റെ ഫലം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു; ‘ഇരുട്ടാക്കപ്പെടും’ എന്ന കൃത്രിമമായ പ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς
  choice: ചന്ദ്രൻ തന്റെ വെളിച്ചം നൽകുകയില്ല
  rationale: ചന്ദ്രൻ വെളിച്ചം നൽകാതിരിക്കുന്നതെന്ന മൂലപാഠത്തിലെ ദൃശ്യരൂപം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: οἱ ἀστέρες πεσοῦνται ἀπὸ τοῦ οὐρανοῦ
  choice: നക്ഷത്രങ്ങൾ ആകാശത്തുനിന്ന് വീഴും
  rationale: πεσοῦνται എന്ന ലളിതഭാവിയെ നേരിട്ട് നൽകുന്നു. ഈ സന്ദർഭത്തിൽ οὐρανός എന്നതിന് ‘ആകാശം’ മലയാളത്തിൽ ദൃശ്യമാനമായ ആകാശത്തെയും വിശാലമായ സ്വർഗീയ മേഖലയെയും തുറന്നുവെക്കുന്ന സ്വാഭാവിക പദമാണ്.
- source_word: αἱ δυνάμεις τῶν οὐρανῶν
  choice: ആകാശങ്ങളിലെ ശക്തികൾ
  rationale: δυνάμεις എന്നതിന്റെ വിശാലമായ ‘ശക്തികൾ’ എന്ന അർഥവും οὐρανῶν എന്ന ബഹുവചനവും കഴിയുന്നത്ര നിലനിർത്തുന്നു; ജ്യോതിർഗോളങ്ങൾ, പ്രപഞ്ചശക്തികൾ, സ്വർഗീയ ശക്തികൾ എന്നിവയിൽ ഒന്നായി മാത്രം വ്യാഖ്യാനം ചുരുക്കുന്നില്ല.
- source_word: σαλευθήσονται
  choice: ഇളക്കപ്പെടും
  rationale: ഭാവികാല നിഷ്ക്രിയരൂപവും ശക്തമായി കുലുക്കപ്പെടുകയോ അസ്ഥിരമാകുകയോ ചെയ്യുന്ന ആശയവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: അന്ത്യകാലപ്രസംഗത്തിലെ പ്രപഞ്ചസൂചനകളുടെ സ്വഭാവം
  choice: ദൃശ്യരൂപങ്ങൾ നേരിട്ട് നിലനിർത്തി, അവ അക്ഷരാർഥത്തിലുള്ള ജ്യോതിശാസ്ത്രസംഭവങ്ങളോ പ്രവാചക-പ്രതീകാത്മക ഭാഷയോ രണ്ടും ചേർന്നതോ എന്നു തീരുമാനിക്കാതെ വിടുന്നു.
  alternative: ഇവയെ പൂർണമായും അക്ഷരാർഥത്തിലുള്ള പ്രപഞ്ചകലക്കമായോ, പൂർണമായും രാഷ്ട്രീയ-ന്യായവിധി പ്രതീകങ്ങളായോ വ്യക്തമാക്കുക.
  rationale: മൂലപാഠം സ്ഥാപിതമായ പ്രവാചക-അപോകലിപ്റ്റിക് ദൃശ്യഭാഷ ഉപയോഗിക്കുന്നു; പരിഭാഷ ഏതെങ്കിലും പ്രത്യേക അന്ത്യകാലവ്യവസ്ഥ ചുമത്താതെ അതിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം സംരക്ഷിക്കണം.
- issue: ‘ആകാശങ്ങളിലെ ശക്തികൾ’ എന്ന പ്രയോഗത്തിന്റെ സൂചന
  choice: പദപ്രയോഗത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
  alternative: അതിനെ ദൂതന്മാർ, ജ്യോതിർഗോളങ്ങൾ, അല്ലെങ്കിൽ നിർവ്യക്തമായ പ്രപഞ്ചശക്തികൾ എന്നൊന്നായി മാത്രം വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്ക് പ്രയോഗം ഈ സാധ്യതകളിൽ ഒന്ന് നിർബന്ധമായി തിരഞ്ഞെടുത്തിട്ടില്ല; അതിനാൽ മുഖ്യവാചകവും അടിക്കുറിപ്പും അർഥപരിധി തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന, എന്നാൽ പ്രവാചകപ്രസംഗത്തിന്റെ ഗൗരവം നിലനിർത്തുന്ന ശൈലി. അർദ്ധവിരാമങ്ങൾ സമാന്തരമായ നാല് പ്രപഞ്ചപ്രസ്താവനകളുടെ താളം വ്യക്തമാക്കുന്നു. നൽകിയ ഇംഗ്ലീഷ് കരടിൽ അടിക്കുറിപ്പ് [a] ‘those days’ എന്നതിനു ശേഷവും [b] ‘heaven’ എന്നതിനു ശേഷവും കാണിച്ചിരുന്നെങ്കിലും അടിക്കുറിപ്പുകളുടെ ഉള്ളടക്കമനുസരിച്ച് [a] ‘ആകാശത്തുനിന്ന്’ എന്നതിനുശേഷവും [b] ‘ആകാശങ്ങളിലെ ശക്തികൾ’ എന്നതിനുശേഷവും യുക്തിയായി സ്ഥാപിച്ചു.
