  naturalness: വാചകം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്. അർദ്ധവിരാമങ്ങളിലൂടെ നാലു പ്രപഞ്ചസൂചനകളുടെ സമാന്തര താളം വ്യക്തമാണ്. ‘ഇളക്കപ്പെടും’ ഇവിടെ ‘shaken’ എന്നതിന് സ്വീകാര്യവും ഗ്രഹിക്കാവുന്നതുമായ പ്രയോഗമാണ്.
  terminology: ‘കഷ്ടത’ θλῖψις-ന്റെ സന്ദർഭോചിതവും മതപരമായ പ്രത്യേക വ്യാഖ്യാനം ചുമത്താത്തതുമായ പരിഭാഷയാണ്. ‘ആകാശം’/‘സ്വർഗം’ എന്ന പദവ്യത്യാസം അടിക്കുറിപ്പിലൂടെ ശരിയായി സൂചിപ്പിക്കുന്നു. ‘ആകാശങ്ങളിലെ ശക്തികൾ’ ഗ്രീക്ക് ബഹുവചനവും അപോകലിപ്റ്റിക് അവ്യക്തതയും സംരക്ഷിക്കുന്നു; അടിക്കുറിപ്പ് അതിനെ ദൂതന്മാർ എന്നു മാത്രം പരിമിതപ്പെടുത്തുന്നില്ല.
