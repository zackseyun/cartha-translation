id: MAT.24.33
reference: Matthew 24:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ὅταν ἴδητε ⸂πάντα ταῦτα⸃, γινώσκετε ὅτι ἐγγύς ἐστιν ἐπὶ θύραις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/033.yaml
  text: So also you[a], when you see all these things, know that it is near, at the doors.
translation:
  language: ml
  text: അതുപോലെ നിങ്ങളും, ഇവയെല്ലാം കാണുമ്പോൾ, അത് വാതിലുകൾക്കരികിൽത്തന്നെ അടുത്തിരിക്കുന്നു എന്ന് അറിഞ്ഞുകൊള്ളുക.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൻ അടുത്തിരിക്കുന്നു.” ഗ്രീക്കിൽ കർത്തൃപദം വ്യക്തമായി പറഞ്ഞിട്ടില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: അതുപോലെ നിങ്ങളും
  rationale: മുമ്പുള്ള അത്തിവൃക്ഷത്തിന്റെ ഉപമയോടുള്ള താരതമ്യവും ശിഷ്യന്മാർക്കുള്ള ഊന്നലും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὅταν ἴδητε
  choice: കാണുമ്പോൾ
  rationale: ഭാവിയിൽ സംഭവിക്കാനിരിക്കുന്ന നിരീക്ഷണത്തെ സൂചിപ്പിക്കുന്ന സമയപ്രയോഗം; ആവർത്തനാർഥം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: πάντα ταῦτα
  choice: ഇവയെല്ലാം
  rationale: ഗ്രീക്കിലെ നപുംസകലിംഗ ബഹുവചനത്തെ സംക്ഷിപ്തവും വ്യക്തവുമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: γινώσκετε
  choice: അറിഞ്ഞുകൊള്ളുക
  rationale: ആജ്ഞാരൂപത്തിന്റെ ശക്തി നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗം നൽകുന്നു.
- source_word: ἐγγύς
  choice: അടുത്ത്
  rationale: സമീപതയെ നേരിട്ട് സൂചിപ്പിക്കുന്ന സാധാരണ മലയാളപദം.
- source_word: ἐπὶ θύραις
  choice: വാതിലുകൾക്കരികിൽത്തന്നെ
  rationale: ഗ്രീക്കിലെ ബഹുവചനം നിലനിർത്തുകയും അത്യന്തം അടുത്തിരിക്കുന്നു എന്ന പ്രയോഗാർഥം ‘തന്നെ’ വഴി സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐγγύς ἐστιν
  choice: അത് അടുത്ത്
  rationale: ഗ്രീക്കിൽ കർത്താവ് വ്യക്തമല്ല. മലയാളത്തിൽ ‘അത്’ ഉപയോഗിക്കുന്നത് സംഭവം/സമയം പോലുള്ള സാധ്യതകളെ തുറന്നുവെച്ച് ‘അവൻ’ എന്നു നിർണ്ണയിക്കുന്നത് ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: ἐγγύς ἐστιν എന്നതിലെ അപ്രകടമായ കർത്താവ്
  choice: ‘അത് അടുത്ത്’ എന്ന് വിവർത്തനം ചെയ്തു; [a] അടിക്കുറിപ്പിൽ മറ്റൊരു സാധ്യത നൽകി
  alternative: ‘അവൻ അടുത്ത്’
  rationale: ഗ്രീക്ക് വാക്യം കർത്താവിനെ വ്യക്തമാക്കുന്നില്ല. മനുഷ്യപുത്രനെയോ വരാനിരിക്കുന്ന സംഭവത്തെയോ പൂർത്തീകരണത്തെയോ ഉദ്ദേശിക്കുന്നുവെന്ന വ്യാഖ്യാനങ്ങളിൽ ഒന്നിനെ മുഖ്യവാചകം നിർബന്ധമായി തിരഞ്ഞെടുക്കാതിരിക്കാൻ ഈ അവ്യക്തത സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ‘വാതിലുകൾക്കരികിൽത്തന്നെ’ എന്നത് മൂലത്തിലെ ബഹുവചനവും സമീപതയുടെ ഊന്നലും നിലനിർത്തുന്നു; ഡാഷുകൾ വായനാസൗകര്യത്തിനായി ഇടവാക്യത്തെ വേർതിരിക്കുന്നു.
