revisions:
- from: അതുപോലെ നിങ്ങളും, ഇവയെല്ലാം കാണുമ്പോൾ, അത് അടുത്ത്—വാതിലുകൾക്കരികിൽത്തന്നെ—എന്ന് അറിഞ്ഞുകൊള്ളുക.[a]
  to: അതുപോലെ നിങ്ങളും, ഇവയെല്ലാം കാണുമ്പോൾ, അത് വാതിലുകൾക്കരികിൽത്തന്നെ അടുത്തിരിക്കുന്നു എന്ന് അറിഞ്ഞുകൊള്ളുക.[a]
  rationale: The revision retains the source’s ambiguity concerning the implicit subject, the plural ‘doors,’ and the emphatic extreme-nearness idiom, while improving Malayalam syntax. The footnote is corrected to refer unambiguously to an unstated grammatical subject rather than potentially to ‘the Lord.’
