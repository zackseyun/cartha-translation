id: MAT.24.22
reference: Matthew 24:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἰ μὴ ἐκολοβώθησαν αἱ ἡμέραι ἐκεῖναι, οὐκ ἂν ἐσώθη πᾶσα σάρξ· διὰ δὲ τοὺς ἐκλεκτοὺς κολοβωθήσονται αἱ ἡμέραι ἐκεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/022.yaml
  text: And if those days had not been cut short[a], no flesh would have been saved; but for the sake of the elect[b], those days will be cut short.
translation:
  language: ml
  text: ആ ദിവസങ്ങൾ ചുരുക്കപ്പെട്ടിരുന്നില്ലെങ്കിൽ[a], ഒരു മനുഷ്യനും[b] രക്ഷിക്കപ്പെടുമായിരുന്നില്ല; എന്നാൽ തിരഞ്ഞെടുക്കപ്പെട്ടവർക്കുവേണ്ടി ആ ദിവസങ്ങൾ ചുരുക്കപ്പെടും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വെട്ടിച്ചുരുക്കപ്പെട്ടിരുന്നില്ലെങ്കിൽ … വെട്ടിച്ചുരുക്കപ്പെടും.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘ചുരുക്കുക’ എന്നും ‘വെട്ടിക്കുറയ്ക്കുക’ എന്നും അർഥം വരാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘ഒരു ജഡവും’ അഥവാ ‘സകല ജഡവും.’ ഇവിടെ അത് മനുഷ്യരിൽ ഒരാളും ഇല്ല എന്നർഥമുള്ള ബൈബിൾപ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκολοβώθησαν / κολοβωθήσονται
  choice: വെട്ടിച്ചുരുക്കിയിരുന്നില്ലെങ്കിൽ / വെട്ടിച്ചുരുക്കപ്പെടും
  rationale: κολοβόω എന്ന ക്രിയയിൽ ‘ചുരുക്കുക’ എന്ന അർഥത്തോടൊപ്പം ‘വെട്ടിക്കുറയ്ക്കുക’ എന്ന ശക്തിയും ഉണ്ട്. ‘വെട്ടിച്ചുരുക്കുക’ ദിവസങ്ങളുടെ ദൈർഘ്യം കുറയ്ക്കുന്നതിനെ സ്വാഭാവികമായും ശക്തമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: οὐκ ἂν ἐσώθη
  choice: രക്ഷിക്കപ്പെടുമായിരുന്നില്ല
  rationale: ഇത് യാഥാർഥ്യവിരുദ്ധമായ നിബന്ധനയുടെ ഫലത്തെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ ജീവൻ നിലനിർത്തൽ മുൻനിരയിലാണെങ്കിലും, ‘രക്ഷിക്കപ്പെടുക’ σῴζω എന്ന പദത്തിന്റെ വിശാലമായ അർഥപരിധി നിലനിർത്തുന്നു.
- source_word: πᾶσα σάρξ
  choice: ഒരു ജഡവും
  rationale: ഇവിടെ σάρξ മനുഷ്യജീവനെ സൂചിപ്പിക്കുന്ന ബൈബിൾപ്രയോഗമാണ്; ‘ഒരു ജഡവും’ എന്ന രൂപം മൂലത്തിലെ ദൃശ്യബലവും ഉദ്ദേശ്യമായ അസ്പഷ്ടതയും നിലനിർത്തുന്നു.
- source_word: διὰ δὲ τοὺς ἐκλεκτούς
  choice: എന്നാൽ തിരഞ്ഞെടുക്കപ്പെട്ടവർക്കുവേണ്ടി
  rationale: διά + accusative ഇവിടെ കാരണം/പ്രയോജനം സൂചിപ്പിക്കുന്നു. ‘വേണ്ടി’ അതിനെ സ്വാഭാവികമായി നൽകുന്നു; ἐκλεκτοί എന്നത് ആരെന്നത് വ്യാഖ്യാനിച്ച് പരിമിതപ്പെടുത്താതെ ‘തിരഞ്ഞെടുക്കപ്പെട്ടവർ’ എന്നു നിലനിർത്തുന്നു.
- source_word: αἱ ἡμέραι ἐκεῖναι
  choice: ആ ദിവസങ്ങൾ
  rationale: ഗ്രീക്കിലെ നിർദ്ദേശകപ്രയോഗത്തിന്റെ സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ മലയാളരൂപം.
theological_decisions:
- issue: അന്ത്യകാലപ്രഭാഷണത്തിലെ ‘തിരഞ്ഞെടുക്കപ്പെട്ടവർ’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: ‘തിരഞ്ഞെടുക്കപ്പെട്ടവർ’ എന്ന പദം വ്യാഖ്യാനവികാസമില്ലാതെ നിലനിർത്തുക
  alternative: ദൈവത്തിന്റെ തിരഞ്ഞെടുക്കപ്പെട്ട ജനം / വിശ്വാസികൾ / വിശ്വസ്ത ശേഷിപ്പ്
  rationale: ഈ വാക്യം ആ വിഭാഗത്തിന്റെ പൂർണമായ ദൈവശാസ്ത്രപരിധി വ്യക്തമാക്കുന്നില്ല. അതിനാൽ ഇസ്രായേൽ, സഭ, ശേഷിപ്പ് എന്നിവയിൽ ഏതെങ്കിലും ഒന്നായി വിവർത്തനത്തിൽ തീർപ്പാക്കുന്നില്ല.
- issue: ഈ സന്ദർഭത്തിലെ σῴζωയുടെ അർഥം
  choice: ‘രക്ഷിക്കപ്പെടുക’ എന്നു പരിഭാഷപ്പെടുത്തി, ശാരീരിക ജീവരക്ഷയുടെ സന്ദർഭസൂചന നിലനിർത്തുക
  alternative: ജീവിച്ചിരിക്കുമായിരുന്നില്ല / അതിജീവിക്കുമായിരുന്നില്ല
  rationale: ഉടൻസന്ദർഭം മഹാകഷ്ടത്തിൽ ജീവൻ നിലനിൽക്കുന്നതിനെ സൂചിപ്പിച്ചാലും, ‘അതിജീവിക്കുക’ എന്നത് ഗ്രീക്ക് പദത്തിന്റെ അർഥം അനാവശ്യമായി ചുരുക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും മൂലപാഠത്തിന്റെ ഘടനയും നിലനിർത്തി. ‘ഒരു ജഡവും’ എന്ന ബൈബിൾപ്രയോഗത്തിന് വായനാസഹായമായി അടിക്കുറിപ്പ് നൽകി; ‘തിരഞ്ഞെടുക്കപ്പെട്ടവർ’ എന്നത് സഭാപരമോ സമുദായപരമോ ആയ വ്യാഖ്യാനം ചേർക്കാതെ സൂക്ഷിച്ചു.
