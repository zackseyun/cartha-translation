  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἡ ἀστραπὴ ἐξέρχεται ἀπὸ ἀνατολῶν καὶ φαίνεται ἕως δυσμῶν, οὕτως ⸀ἔσται ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/027.yaml
  text: For just as the lightning comes from the east and is seen as far as the west[a], so will the coming of the Son of Man be.
translation:
  language: ml
  text: എന്തെന്നാൽ, മിന്നൽ കിഴക്കുനിന്ന് പുറപ്പെട്ട് പടിഞ്ഞാറുവരെ കാണപ്പെടുന്നതുപോലെ, മനുഷ്യപുത്രന്റെ വരവും[a] അങ്ങനെതന്നെ ആയിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സാന്നിധ്യം.’ παρουσία എന്ന ഗ്രീക്ക് പദത്തിന് ‘സാന്നിധ്യം’ അല്ലെങ്കിൽ ‘ആഗമനം’ എന്നും അർഥമാകാം; എന്നാൽ ഇവിടെ സന്ദർഭം മനുഷ്യപുത്രന്റെ ഭാവിയിലെ വരവിനെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: പോലെതന്നെ
  rationale: ὥσπερ എന്ന താരതമ്യം സ്വാഭാവികമായി നൽകുന്നു. γάρ ഇവിടെ മുൻസന്ദർഭത്തിലെ വിശദീകരണബന്ധം വഹിക്കുന്നുവെങ്കിലും ഒറ്റവാക്യമായ മലയാളത്തിൽ പ്രത്യേകമായി ‘എന്തെന്നാൽ’ ചേർക്കുന്നത് ഭാരമുള്ളതിനാൽ താരതമ്യത്തിന്റെ ഊന്നലിൽ ഉൾപ്പെടുത്തി.
- source_word: ἀστραπή
  choice: മിന്നൽ
  rationale: ഉപമയിൽ ഉദ്ദേശിക്കുന്ന ദൃശ്യപ്രതിഭാസത്തെ നേരായും സ്വാഭാവികമായും സൂചിപ്പിക്കുന്നു.
- source_word: ἐξέρχεται
  choice: പുറപ്പെട്ട്
  rationale: ‘പുറത്തുവരുന്നു/പുറപ്പെടുന്നു’ എന്ന ഉദ്ഭവഗതി നിലനിർത്തുകയും തുടർന്നുള്ള ക്രിയയുമായി സ്വാഭാവികമായി ചേരുകയും ചെയ്യുന്നു.
- source_word: ἀπὸ ἀνατολῶν
  choice: കിഴക്കുനിന്ന്
  rationale: ദിശാസൂചകമായ കിഴക്ക്–പടിഞ്ഞാറ് വൈരുധ്യം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: φαίνεται
  choice: കാണപ്പെടുന്നു
  rationale: രൂപത്തിന്റെ ദൃശ്യവും പരസ്യവുമായ സ്വഭാവം നിലനിർത്തുന്ന passive അർഥം നൽകുന്നു; ‘പ്രകാശിക്കുന്നു’ എന്ന അധിക അർഥം ചേർക്കുന്നില്ല.
- source_word: ἕως δυσμῶν
  choice: പടിഞ്ഞാറുവരെ
  rationale: ἕως സൂചിപ്പിക്കുന്ന വ്യാപ്തിയും കിഴക്കുമുതൽ പടിഞ്ഞാറുവരെയുള്ള പൂർണ്ണ ദിശാവിസ്താരവും സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: οὕτως ἔσται
  choice: അതുപോലെതന്നെ ... ആയിരിക്കും
  rationale: താരതമ്യത്തിന്റെ മറുപകുതിയും ഭാവികാലവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: παρουσία
  choice: വരവ്
  rationale: ഈ ഭാവികാല അന്ത്യകാലസന്ദർഭത്തിൽ സംഭവാത്മകമായ വരവ്/ആഗമനം ഏറ്റവും വ്യക്തമാണ്; ‘സാന്നിധ്യം’ എന്ന സാധ്യമായ പദാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: ദാനിയേൽ 7-നോടുള്ള അന്തർപാഠബന്ധവും യേശു ഉപയോഗിക്കുന്ന സ്ഥാനനാമത്തിന്റെ പാരമ്പര്യരൂപവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: അന്ത്യകാലവചനത്തിലെ παρουσίαയുടെ വിവർത്തനം
  choice: വരവ്
  alternative: സാന്നിധ്യം; ആഗമനം
  rationale: മിന്നലിന്റെ വ്യക്തവും പരസ്യവുമായ പ്രത്യക്ഷതയോട് താരതമ്യം ചെയ്യുന്ന ഈ സന്ദർഭത്തിൽ ഭാവിയിലെ സംഭവമായി ‘വരവ്’ ഏറ്റവും സ്വാഭാവികമാണ്. അതേസമയം παρουσίαയ്ക്ക് ‘സാന്നിധ്യം’ എന്ന അർഥവും സാധ്യമായതിനാൽ ആ പദാർഥവൈവിധ്യം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു; പ്രത്യേക അന്ത്യകാല സിദ്ധാന്തം ഒന്നും ഇതിൽ ചുമത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ മിന്നൽ, ദിശാവ്യാപ്തി, ദൃശ്യത, ഭാവികാല താരതമ്യം എന്നിവ സംരക്ഷിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ‘വരവ്’ എന്ന പദത്തിനുശേഷം ചേർത്തിരിക്കുന്നു.
