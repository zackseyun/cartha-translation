  source_fidelity: The draft accurately conveys the lightning simile, the east-to-west extent, the future comparison, and παρουσία as the Son of Man’s coming. However, the explicit explanatory force of γάρ is omitted, and the Malayalam apodosis can more clearly express ‘so will be.’
