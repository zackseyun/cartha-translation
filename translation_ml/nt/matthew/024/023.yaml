id: MAT.24.23
reference: Matthew 24:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τότε ἐάν τις ὑμῖν εἴπῃ· Ἰδοὺ ὧδε ὁ χριστός, ἤ· Ὧδε, μὴ πιστεύσητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/023.yaml
  text: Then if anyone says to you[a], ‘Look, here is the Messiah!’ or[b], ‘There he is!’ do not believe it.
translation:
  language: ml
  text: അപ്പോൾ ആരെങ്കിലും നിങ്ങളോട്, “നോക്കൂ, മശീഹാ ഇവിടെ ഉണ്ട്!” എന്നോ “ഇവിടെ!” എന്നോ പറഞ്ഞാൽ അതു വിശ്വസിക്കരുത്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: അപ്പോൾ
  rationale: മുൻപുള്ള അന്ത്യകാലപ്രസംഗത്തോടുള്ള കാലക്രമബന്ധം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നിലനിർത്തുന്നു.
- source_word: ἐάν τις ὑμῖν εἴπῃ
  choice: ആരെങ്കിലും നിങ്ങളോട് ... പറഞ്ഞാൽ
  rationale: അനിശ്ചിത കർത്താവോടുകൂടിയ സോപാധികപ്രയോഗത്തെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: Ἰδοὺ
  choice: നോക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന നിർദേശകപദത്തിന്റെ ശക്തി പഴഞ്ചൻ ശൈലിയില്ലാതെ നിലനിർത്തുന്നു.
- source_word: ὧδε
  choice: ഇവിടെ / അവിടെ
  rationale: ആദ്യത്തേതിൽ സ്ഥലസൂചന നേരിട്ട് ‘ഇവിടെ’ എന്നു നൽകി; ആവർത്തിച്ചുള്ള രണ്ടാമത്തെ എലിപ്റ്റിക്കൽ പ്രയോഗം സംഭാഷണസന്ദർഭത്തിൽ സ്വാഭാവികമാക്കാൻ ‘അതാ, അവിടെ!’ എന്നു നൽകി, അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: ὁ χριστός
  choice: മശീഹാ
  rationale: നിശ്ചയാർഥക ഉപപദവും വ്യാജ തിരിച്ചറിയൽസന്ദർഭവും ഇത് വ്യക്തിപേരിനേക്കാൾ അഭിഷിക്തനായ പ്രതീക്ഷിത രക്ഷകന്റെ സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നുവെന്ന് കാണിക്കുന്നു.
- source_word: μὴ πιστεύσητε
  choice: അതു വിശ്വസിക്കരുത്
  rationale: നിഷേധാത്മക കല്പനയുടെ ശക്തി നിലനിർത്തുകയും ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത വ്യക്തിയെ കർമമായി ചേർക്കാതെ പ്രസ്താവിച്ച അവകാശവാദത്തെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: Χριστός എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മശീഹാ
  alternative: ക്രിസ്തു / അഭിഷിക്തൻ
  rationale: ഇവിടെ യേശുവിന്റെ പേരുപോലുള്ള പ്രയോഗമല്ല, പ്രതീക്ഷിക്കപ്പെട്ട അഭിഷിക്ത രക്ഷകനെക്കുറിച്ചുള്ള സ്ഥാനപ്പേരാണ്. അതിനാൽ ‘മശീഹാ’ അർഥവും ചരിത്രപരമായ പ്രതീക്ഷയും കൂടുതൽ വ്യക്തമായി കാത്തുസൂക്ഷിക്കുന്നു.
- issue: രണ്ടാമത്തെ Ὧδε എന്ന എലിപ്റ്റിക്കൽ വാക്യഭാഗം
  choice: “അതാ, അവിടെ!”
  alternative: “ഇവിടെ!” / “അവൻ ഇവിടെ!”
  rationale: മൂലത്തിൽ കർത്താവും ക്രിയയും ആവർത്തിക്കാതെ സ്ഥലം മാത്രം സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ നേരിട്ടുള്ള സംസാരത്തിൽ സ്വാഭാവികതയ്ക്കായി അല്പം വികസിപ്പിച്ചെങ്കിലും, മൂലത്തിലെ സംക്ഷിപ്തതയും യഥാർഥ അക്ഷരാർഥവും അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ സംസാരശൈലി. ‘നോക്കൂ’ ശ്രദ്ധാകർഷകപ്രയോഗമായി ഉപയോഗിച്ചു; ‘വിശ്വസിക്കരുത്’ വ്യക്തവും പൊതുവായ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമാണ്. ‘മശീഹാ’ സ്ഥാനപ്പേരായി നിലനിർത്തി.
