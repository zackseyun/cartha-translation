id: MAT.24.12
reference: Matthew 24:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ διὰ τὸ πληθυνθῆναι τὴν ἀνομίαν ψυγήσεται ἡ ἀγάπη τῶν πολλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/012.yaml
  text: And because lawlessness will be multiplied[b][a], the love of many will grow cold.
translation:
  language: ml
  text: അധർമ്മം പെരുകുന്നതിനാൽ[a] അനേകരുടെ[b] സ്നേഹം തണുത്തുപോകും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അധർമ്മത്തിന്റെ വർധന നിമിത്തം.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘പലരുടെയും സ്നേഹം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸ πληθυνθῆναι
  choice: പെരുകുന്നതിനാൽ
  rationale: διάയോടുകൂടിയ articular infinitive കാരണത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ കാരണവാക്യരൂപം ഉപയോഗിച്ചുകൊണ്ട് πληθυνθῆναιയുടെ വർധന എന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: ἀνομίαν
  choice: അധർമ്മം
  rationale: ദൈവിക ന്യായത്തോടുള്ള അവഗണനയെയും ലംഘനത്തെയും സൂചിപ്പിക്കുന്ന ἀνομίαയ്ക്ക് ആധുനിക മലയാളത്തിൽ ഗൗരവവും ഗ്രാഹ്യതയും ഉള്ള നേരിട്ടുള്ള പദമാണ് ‘അധർമ്മം’.
- source_word: ψυγήσεται
  choice: തണുത്തുപോകും
  rationale: സ്നേഹത്തിന്റെ മാനസിക-ബന്ധപരമായ ശൈഥില്യത്തെ സൂചിപ്പിക്കുന്ന മൂലരൂപകം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἀγάπη
  choice: സ്നേഹം
  rationale: ἀγάπηയുടെ സാധാരണവും കൃത്യവും എല്ലാവർക്കും ഗ്രാഹ്യവുമായ മലയാളപരിഭാഷയാണ് ‘സ്നേഹം’.
- source_word: τῶν πολλῶν
  choice: അനേകരുടെ
  rationale: നിശ്ചിത സമൂഹത്തെയോ ഭൂരിപക്ഷത്തെയോ അനാവശ്യമായി നിർണ്ണയിക്കാതെ ഗ്രീക്കിലെ വിശാലവും അനിശ്ചിതവുമായ പരിധി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘അനേകരുടെ സ്നേഹം’ എന്നതിന്റെ പരിധി
  choice: മനുഷ്യരെ പൊതുവിലാണോ, ശിഷ്യരെയാണോ, സമ്മിശ്രമായ ഒരു കൂട്ടത്തെയാണോ ഉദ്ദേശിക്കുന്നതെന്ന് വ്യക്തമാക്കാതെ ‘അനേകരുടെ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘വിശ്വാസികളുടെ സ്നേഹം’ അല്ലെങ്കിൽ ‘സമൂഹത്തിലെ മനുഷ്യസ്നേഹം’
  rationale: τῶν πολλῶν എന്ന പ്രയോഗം പ്രസ്തുത കൂട്ടത്തെ വ്യക്തമായി തിരിച്ചറിയിക്കുന്നില്ല; അതിനാൽ വ്യാഖ്യാനപരമായ ദൈവശാസ്ത്രനിഗമനം പരിഭാഷയിൽ ചേർക്കുന്നില്ല.
- issue: πληθυνθῆναιയുടെ വാച്യഭാവം
  choice: സ്വാഭാവിക മലയാളത്തിൽ ‘പെരുകുന്നതിനാൽ’ എന്നു നൽകി.
  alternative: ‘വർധിപ്പിക്കപ്പെടുന്നതിനാൽ’
  rationale: ഗ്രീക്ക് രൂപം വ്യാകരണപരമായി passive ആണെങ്കിലും ഇവിടെ വർധന എന്ന അകർമ്മക ആശയമാണ് പ്രസക്തം; കർത്താവിനെ അനുമാനിപ്പിക്കുന്ന കൃത്രിമമായ passive മലയാളം ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ കാരണബന്ധവും ‘സ്നേഹം തണുക്കുക’ എന്ന രൂപകവും സംരക്ഷിച്ചിട്ടുണ്ട്; പരാമർശിക്കപ്പെടുന്ന കൂട്ടത്തിന്റെ പരിധി വ്യാഖ്യാനിച്ച് ചുരുക്കിയിട്ടില്ല.
