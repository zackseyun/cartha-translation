source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτοῖς· Βλέπετε μή τις ὑμᾶς πλανήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/004.yaml
  text: And Jesus answered them[a], “See that no one leads you astray.”
translation:
  language: ml
  text: 'യേശു അവരോടു മറുപടി പറഞ്ഞു: “ആരും നിങ്ങളെ വഴിതെറ്റിക്കാതിരിക്കാൻ സൂക്ഷിച്ചുകൊള്ളുക.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ആരും നിങ്ങളെ വഞ്ചിക്കാതിരിക്കാൻ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν αὐτοῖς
  choice: അവരോടു മറുപടി പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ സെമിറ്റിക് സ്വാധീനമുള്ള ‘മറുപടി പറഞ്ഞുകൊണ്ട് ... അവരോടു പറഞ്ഞു’ എന്ന ഘടനയുടെ പ്രതികരണഭാവവും സംസാരക്രിയയും സ്വാഭാവിക മലയാളത്തിൽ അനാവശ്യ ആവർത്തനമില്ലാതെ അറിയിക്കുന്നു.
- source_word: Βλέπετε
  choice: സൂക്ഷിച്ചുകൊള്ളുക
  rationale: ഇവിടെ വർത്തമാനകാല ആജ്ഞാരൂപത്തിന് ജാഗ്രത പാലിക്കുക, കരുതിയിരിക്കുക എന്ന പ്രയോഗാർഥമാണ്. തുടർന്നുള്ള μή-ഉപവാക്യത്തോടൊപ്പം ‘സൂക്ഷിച്ചുകൊള്ളുക’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: μή τις
  choice: ആരും ... -ാതിരിക്കാൻ
  rationale: ആജ്ഞയ്ക്കുശേഷമുള്ള μήയും വിധിലിംഗവും തടയൽ അഥവാ പ്രതിരോധം സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ഈ ഘടന ‘ഒരാളും അങ്ങനെ ചെയ്യാതിരിക്കാൻ ശ്രദ്ധിക്കുക’ എന്ന അർഥം നൽകുന്നു.
- source_word: πλανήσῃ
  choice: വഴിതെറ്റിക്കുക
  rationale: πλανάω എന്നതിലെ വഞ്ചനയുടെയും ശരിയായ വഴിയിൽനിന്നു തെറ്റിച്ചുകളയുന്നതിന്റെയും വിശാലമായ ആശയം സംരക്ഷിക്കുന്നു; വെറും ബൗദ്ധിക വഞ്ചനയായി അർഥം ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: πλανήσῃ എന്ന മുന്നറിയിപ്പിന്റെ സ്വഭാവം
  choice: വഞ്ചിക്കപ്പെടുന്നതും ശരിയായ വഴിയിൽനിന്നു തെറ്റിപ്പോകുന്നതും ഉൾക്കൊള്ളുന്ന ‘വഴിതെറ്റിക്കുക’
  alternative: ‘വഞ്ചിക്കുക’
  rationale: അന്ത്യകാല അവകാശവാദങ്ങളുടെ പശ്ചാത്തലത്തിൽ തെറ്റായ മാർഗനിർദേശത്തിനെതിരായ വിശാല മുന്നറിയിപ്പാണ് ഇവിടെ. ‘വഴിതെറ്റിക്കുക’ എന്നത് വഞ്ചനയും വ്യതിചലനവും ഉൾക്കൊള്ളുന്ന ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ഗ്രീക്കിലെ ആവർത്തനഘടന മലയാളത്തിൽ ചുരുക്കിയെങ്കിലും പ്രതികരണഭാവം നിലനിർത്തിയിരിക്കുന്നു.
