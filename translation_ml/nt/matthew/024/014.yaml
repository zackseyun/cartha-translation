id: MAT.24.14
reference: Matthew 24:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ κηρυχθήσεται τοῦτο τὸ εὐαγγέλιον τῆς βασιλείας ἐν ὅλῃ τῇ οἰκουμένῃ εἰς μαρτύριον πᾶσιν τοῖς ἔθνεσιν, καὶ τότε ἥξει τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/014.yaml
  text: And this good news of the kingdom will be proclaimed throughout the whole world as a testimony to all the nations[c][b][a], and then the end will come.
translation:
  language: ml
  text: രാജ്യത്തിന്റെ ഈ സുവാർത്ത[a] ലോകമെങ്ങും[b] സകല ജനതകൾക്കും[c] സാക്ഷ്യമായി പ്രസംഗിക്കപ്പെടും; അപ്പോൾ അവസാനം വരും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘രാജ്യത്തിന്റെ ഈ സുവിശേഷം.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘മനുഷ്യവാസമുള്ള ലോകമെങ്ങും.’
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘സകല ജാതികൾക്കും’ അല്ലെങ്കിൽ ‘സകല രാജ്യങ്ങൾക്കും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρυχθήσεται
  choice: പ്രസംഗിക്കപ്പെടും
  rationale: ഭാവികാല കർമണിപ്രയോഗം നിലനിർത്തുകയും പരസ്യമായി അറിയിക്കുന്നതിന്റെ ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: εὐαγγέλιον
  choice: സുവാർത്ത
  rationale: ‘നല്ല വാർത്ത’ എന്ന അടിസ്ഥാന അർഥവും ബൈബിൾസന്ദർഭത്തിലെ പരിചിതമായ ഗൗരവവും ഒരുമിച്ച് നൽകുന്ന ആധുനിക മലയാളപ്രയോഗം.
- source_word: τῆς βασιλείας
  choice: രാജ്യത്തിന്റെ
  rationale: ഗ്രീക്കിലെ ഷഷ്ഠീവ്യാകരണബന്ധം നേരിട്ട് നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ദൈവത്തിന്റെ രാജഭരണത്തെക്കുറിച്ചുള്ള സുവാർത്ത എന്ന അർഥം വഹിക്കുന്നു.
- source_word: ἐν ὅλῃ τῇ οἰκουμένῃ
  choice: ലോകമെങ്ങും
  rationale: മനുഷ്യവാസമുള്ള മുഴുവൻ ലോകം എന്ന വ്യാപ്തി സ്വാഭാവികവും സംക്ഷിപ്തവുമായി അറിയിക്കുന്നു.
- source_word: εἰς μαρτύριον
  choice: സാക്ഷ്യമായി
  rationale: പ്രഖ്യാപനം സാക്ഷ്യമായി പ്രവർത്തിക്കുന്നു എന്ന ഉദ്ദേശ്യ/ഫലഭാവം നിലനിർത്തുന്നു; അത് അനുകൂലമോ പ്രതികൂലമോ എന്നു നിർണയിക്കുന്നില്ല.
- source_word: πᾶσιν τοῖς ἔθνεσιν
  choice: സകല ജനതകൾക്കും
  rationale: ἔθνη എന്നതിന്റെ രാജ്യങ്ങൾ/ജനവിഭാഗങ്ങൾ എന്ന വിശാലത സൂചിപ്പിക്കുന്നു; യഹൂദരല്ലാത്തവർക്ക് മാത്രം എന്നു ചുരുക്കുന്നില്ല.
- source_word: ἥξει
  choice: വരും
  rationale: അന്ത്യകാലസന്ദർഭത്തിൽ ലളിതവും സ്വാഭാവികവുമായ തുല്യപ്രയോഗം.
- source_word: τὸ τέλος
  choice: അവസാനം
  rationale: സാങ്കേതികമായ ഒരു അന്ത്യകാലക്രമം ചേർക്കാതെ മൂലത്തിലെ തുറന്നതും ഗൗരവമുള്ളതുമായ അർഥം നിലനിർത്തുന്നു.
theological_decisions:
- issue: οἰκουμένη, ἔθνη എന്നിവയുടെ അന്ത്യകാലസന്ദർഭത്തിലെ വ്യാപ്തി
  choice: ‘ലോകമെങ്ങും’ എന്നും ‘സകല ജനതകൾക്കും’ എന്നും ആഗോളവ്യാപ്തിയോടെ പരിഭാഷപ്പെടുത്തി.
  alternative: ‘മനുഷ്യവാസമുള്ള ലോകമെങ്ങും’; ‘സകല ജാതികൾക്കും’ അല്ലെങ്കിൽ ‘സകല രാജ്യങ്ങൾക്കും’.
  rationale: റോമാസാമ്രാജ്യത്തിലേക്ക് മാത്രം ചുരുക്കാതെയും ഒരു പ്രത്യേക ആധുനിക മിഷൻസിദ്ധാന്തമോ അന്ത്യകാലക്രമമോ ചേർക്കാതെയും വാക്യത്തിന്റെ സർവവ്യാപകതയും ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സുവാർത്ത’ സാധാരണ വായനക്കാർക്ക് സുതാര്യമാണ്; ‘സുവിശേഷം’ അടിക്കുറിപ്പിൽ സഭാപരമായി പരിചിതമായ പദമായി നൽകിയിരിക്കുന്നു. അടിക്കുറിപ്പുകൾ ബന്ധപ്പെട്ട പദക്രമത്തിൽ [a][b][c] ആയി മുഖ്യവാക്യത്തിൽ ചേർത്തിരിക്കുന്നു.
