id: MAT.24.20
reference: Matthew 24:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: προσεύχεσθε δὲ ἵνα μὴ γένηται ἡ φυγὴ ὑμῶν χειμῶνος μηδὲ σαββάτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/020.yaml
  text: But pray that your flight may not happen in winter or on a Sabbath[a].
translation:
  language: ml
  text: എന്നാൽ, നിങ്ങളുടെ ഓടിപ്പോകൽ ശീതകാലത്തോ ഒരു ശബ്ബത്തുദിവസത്തിലോ സംഭവിക്കാതിരിക്കാൻ പ്രാർത്ഥിക്കുവിൻ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσεύχεσθε
  choice: പ്രാർഥിക്കുവിൻ
  rationale: വർത്തമാനകാല ബഹുവചന ആജ്ഞയെ ആധുനികവും മാന്യവുമായ മലയാള ആജ്ഞാരൂപത്തിൽ അവതരിപ്പിക്കുന്നു; തുടർച്ച എന്ന ഭാവം സന്ദർഭത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ മുന്നറിയിപ്പിൽനിന്നുള്ള മൃദുവായ വൈരുധ്യവും ആശയമാറ്റവും സൂചിപ്പിക്കുന്നു.
- source_word: ἵνα μὴ γένηται
  choice: സംഭവിക്കാതിരിക്കാൻ
  rationale: പ്രാർഥനയുടെ ഉള്ളടക്കമോ ലക്ഷ്യമോ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുകയും γίνομαι എന്ന ക്രിയയുടെ സംഭവാർഥം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἡ φυγὴ ὑμῶν
  choice: നിങ്ങളുടെ ഓടിപ്പോകൽ
  rationale: φυγή സൂചിപ്പിക്കുന്ന പലായനപ്രവൃത്തിയെ വ്യക്തമാക്കുന്നു; വിജയകരമായ രക്ഷപ്പെടൽ എന്ന അധിക അർഥം ചേർക്കുന്നില്ല.
- source_word: χειμῶνος
  choice: ശീതകാലത്ത്
  rationale: കാലസൂചക ഷഷ്ഠിയെ സ്വാഭാവിക മലയാള കാലപ്രയോഗമായി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: μηδὲ σαββάτῳ
  choice: ഒരു ശബ്ബത്തിലോ
  rationale: രണ്ടാമത്തെ നിഷേധാത്മക സാഹചര്യം ഏകോപിപ്പിക്കുകയും, ഗ്രീക്കിൽ നിർദ്ദേശക ഉപപദമില്ലാത്ത രൂപം അനാവശ്യമായി നിർണ്ണയിക്കാതെ നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: σαββάτῳ എന്നതിനെ നിർദ്ദിഷ്ടതയോടെ പരിഭാഷപ്പെടുത്തണമോ എന്നത്
  choice: ഒരു ശബ്ബത്തിൽ
  alternative: ശബ്ബത്തിൽ
  rationale: ഗ്രീക്കിൽ നിർദ്ദേശക ഉപപദമില്ലാത്തതിനാൽ മുഖ്യപാഠം അനിർദ്ദിഷ്ടരൂപം നിലനിർത്തുന്നു. എന്നാൽ ശബ്ബത്തുദിനത്തെ പൊതുവായി സൂചിപ്പിക്കുന്ന നിർദ്ദിഷ്ടമായ അർഥവും വ്യാകരണപരമായി സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ആരാധനാപരമായ വായനയ്ക്ക് യോജിച്ച മാന്യവുമായ മലയാളം. ‘പലായനം’ എന്ന ഔപചാരിക പദത്തിനുപകരം ‘ഓടിപ്പോകൽ’ ഉപയോഗിച്ച് ദുരന്തസാഹചര്യത്തിലെ അടിയന്തരത സ്വാഭാവികമായി പ്രകടമാക്കി.
