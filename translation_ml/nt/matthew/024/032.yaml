- from: അത്തിമരത്തിൽനിന്ന് ഈ ഉപമ പഠിക്കുവിൻ:[a] അതിന്റെ കൊമ്പ് ഇളയതാകുകയും ഇലകൾ തളിർക്കുകയും ചെയ്യുമ്പോൾ,[b] വേനൽ അടുത്തിരിക്കുന്നുവെന്ന് നിങ്ങൾ അറിയുന്നു.[c]
  to: അത്തിമരത്തിൽനിന്ന് ഉപമ പഠിക്കുവിൻ:[a] അതിന്റെ കൊമ്പ് മൃദുവാകുകയും ഇലകൾ തളിർക്കുകയും ചെയ്യുമ്പോൾ,[b] വേനൽ അടുത്തിരിക്കുന്നുവെന്ന് നിങ്ങൾ അറിയുന്നു.[c]
