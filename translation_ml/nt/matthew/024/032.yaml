id: MAT.24.32
reference: Matthew 24:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀπὸ δὲ τῆς συκῆς μάθετε τὴν παραβολήν· ὅταν ἤδη ὁ κλάδος αὐτῆς γένηται ἁπαλὸς καὶ τὰ φύλλα ἐκφύῃ, γινώσκετε ὅτι ἐγγὺς τὸ θέρος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/032.yaml
  text: 'Learn the parable from the fig tree: as soon as its branch becomes tender and puts out leaves[c][b][a], you know that summer is near.'
translation:
  language: ml
  text: അത്തിമരത്തിൽനിന്ന് ഉപമ പഠിക്കുവിൻ:[a] അതിന്റെ കൊമ്പ് മൃദുവാകുകയും ഇലകൾ തളിർക്കുകയും ചെയ്യുമ്പോൾ,[b] വേനൽ അടുത്തിരിക്കുന്നുവെന്ന് നിങ്ങൾ അറിയുന്നു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഉപമ’ എന്നതിന് ‘പാഠം’ അല്ലെങ്കിൽ ‘ദൃഷ്ടാന്തം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഇലകൾ പുറപ്പെടുവിക്കുകയും ചെയ്യുമ്പോൾ.’
    reason: lexical_alternative
  - marker: c
    text: θέρος എന്ന പദത്തിന് ‘വേനൽ’ എന്നും ചില സന്ദർഭങ്ങളിൽ ‘കൊയ്ത്തുകാലം’ എന്നും അർത്ഥമാകാം; ഇവിടെ അത്തിമരത്തിന്റെ കാലാവസ്ഥാസൂചനയോട് ‘വേനൽ’ നന്നായി യോജിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ τῆς συκῆς
  choice: അത്തിമരത്തിൽനിന്ന്
  rationale: ἀπό സഹിതമുള്ള ഷഷ്ഠീവിഭക്തി പഠനത്തിന്റെ ഉറവിടം സൂചിപ്പിക്കുന്നു. δέയുടെ നേരിയ ബന്ധകസ്വഭാവം മലയാളത്തിൽ പ്രത്യേക പദം ചേർക്കാതെ വാക്യപ്രവാഹത്തിൽ നിലനിർത്തുന്നു.
- source_word: μάθετε
  choice: പഠിക്കുവിൻ
  rationale: μανθάνωയുടെ ഭൂതകാല ആജ്ഞാരൂപമായതിനാൽ നേരിട്ടുള്ള ബഹുവചന കല്പനയായി പരിഭാഷപ്പെടുത്തി.
- source_word: τὴν παραβολήν
  choice: ഈ ഉപമ
  rationale: παραβολήയുടെ സുവിശേഷങ്ങളിലെ പതിവായ അർത്ഥം ‘ഉപമ’ എന്നാണ്. മലയാളത്തിൽ സന്ദർഭത്തിൽ പറയുന്ന താരതമ്യത്തെ സ്വാഭാവികമായി ചൂണ്ടിക്കാണിക്കാൻ ‘ഈ’ ചേർത്തു.
- source_word: ὅταν ἤδη
  choice: ചെയ്യുമ്പോൾ
  rationale: ὅταν പൊതുവായ കാലസാഹചര്യം സൂചിപ്പിക്കുന്നു; ἤδη വളർച്ച ആരംഭിച്ച നിലയെ ശക്തിപ്പെടുത്തുന്നു. മലയാളത്തിൽ തുടർന്നുള്ള ‘ഇളയതാകുകയും… തളിർക്കുകയും’ എന്ന പ്രയോഗം ആ ആരംഭബോധം നൽകുന്നു.
- source_word: ὁ κλάδος αὐτῆς γένηται ἁπαλὸς
  choice: അതിന്റെ കൊമ്പ് ഇളയതാകുകയും
  rationale: γένηται അവസ്ഥാമാറ്റവും ἁπαλός പുതിയ വളർച്ചയുടെ മൃദുത്വവും സൂചിപ്പിക്കുന്നു. സസ്യസന്ദർഭത്തിൽ ‘കൊമ്പ് ഇളയതാകുക’ സ്വാഭാവികമായ മലയാളമാണ്.
- source_word: καὶ τὰ φύλλα ἐκφύῃ
  choice: ഇലകൾ തളിർക്കുകയും ചെയ്യുമ്പോൾ
  rationale: ἐκφύῃ മുളയ്ക്കുക/പുറപ്പെടുവിക്കുക എന്ന സസ്യവളർച്ചയെ സൂചിപ്പിക്കുന്നു; ‘ഇലകൾ തളിർക്കുക’ അതിന്റെ സ്വാഭാവിക മലയാളരൂപമാണ്.
- source_word: γινώσκετε
  choice: നിങ്ങൾ അറിയുന്നു
  rationale: രണ്ടാംപുരുഷ ബഹുവചന വർത്തമാന നിർദേശരൂപം പൊതുവായ തിരിച്ചറിവിനെ പ്രസ്താവിക്കുന്നു; അതിനെ കല്പനാരൂപമാക്കിയിട്ടില്ല.
- source_word: ἐγγὺς τὸ θέρος
  choice: വേനൽ അടുത്തിരിക്കുന്നു
  rationale: അത്തിമരത്തിന്റെ കാലാവസ്ഥാസൂചനയായ ഈ സന്ദർഭത്തിൽ θέρος പ്രധാനമായി ‘വേനൽ’ എന്നാണ്; ἐγγύς സമീപ്യത സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: അത്തിമരത്തിന്റെ പ്രതീകാർഥം
  choice: കാലത്തിന്റെ സമീപ്യത തിരിച്ചറിയാനുള്ള പ്രകൃതിദത്ത ഉപമയായി മാത്രം വാക്യം പരിഭാഷപ്പെടുത്തി; അത്തിമരത്തിന് പ്രത്യേക പ്രതീകപരമായ തിരിച്ചറിയൽ നൽകിയില്ല.
  alternative: അത്തിമരം ഇസ്രായേലിനെ പ്രതിനിധീകരിക്കുന്നു എന്ന് പരിഭാഷയിൽ വ്യക്തമാക്കുക.
  rationale: ഈ വാക്യത്തിലെ ഗ്രീക്ക് പാഠം അത്തിമരത്തിന്റെ നിരീക്ഷിക്കാവുന്ന വളർച്ചയെ അടിസ്ഥാനമാക്കിയുള്ള താരതമ്യം നൽകുന്നു; അതിന്റെ വിശാലമായ യുഗാന്ത്യ വ്യാഖ്യാനം ഇവിടെ നിർണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ബഹുവചന കല്പനയ്ക്ക് തിരുവെഴുത്തുശൈലിയോട് ചേരുന്ന ‘പഠിക്കുവിൻ’ ഉപയോഗിച്ചു; ശേഷിക്കുന്ന വാക്യം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി ഗ്രഹിക്കാവുന്ന രീതിയിൽ നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
