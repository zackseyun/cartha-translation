  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τίς ἄρα ἐστὶν ὁ πιστὸς δοῦλος καὶ φρόνιμος ὃν κατέστησεν ὁ ⸀κύριος ἐπὶ τῆς ⸀οἰκετείας αὐτοῦ τοῦ ⸀δοῦναι αὐτοῖς τὴν τροφὴν ἐν καιρῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/045.yaml
  text: Who then is the faithful and wise servant[b][a], whom the master has appointed over his household to give them their food at the proper time?
translation:
  language: ml
  text: “അങ്ങനെയെങ്കിൽ, തന്റെ വീട്ടിലുള്ളവരുടെ മേൽ, അവർക്കു തക്കസമയത്ത് ഭക്ഷണം കൊടുക്കേണ്ടതിന്, യജമാനൻ നിയമിച്ച വിശ്വസ്തനും വിവേകിയുമായ അടിമ[a] ആരാണ്?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ദാസൻ.” ഗ്രീക്ക് പദം സന്ദർഭമനുസരിച്ച് “അടിമ” എന്നോ “ദാസൻ” എന്നോ അർത്ഥമാക്കാം; ഇവിടെ യജമാനന്റെ അധികാരത്തിൻ കീഴിലുള്ള ഒരാളെന്ന ശക്തമായ ഭാവം നിലനിർത്താൻ “അടിമ” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίς ἄρα
  choice: അങ്ങനെയെങ്കിൽ ... ആരാണ്?
  rationale: ἄρα മുൻപത്തെ ഉപദേശത്തിൽനിന്നുള്ള നിഗമനസ്വഭാവമുള്ള തുടർച്ച സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘അങ്ങനെയെങ്കിൽ’ ആ പ്രഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: πιστὸς
  choice: വിശ്വസ്തൻ
  rationale: ഏൽപ്പിച്ച ചുമതല ആശ്രയയോഗ്യമായി നിർവഹിക്കുന്ന സ്വഭാവം സൂചിപ്പിക്കുകയും പദത്തിന്റെ ധാർമിക അനുരണനം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: δοῦλος
  choice: അടിമ
  rationale: യജമാനന്റെ അധികാരത്തിൻ കീഴിലുള്ള ബന്ധിത നില ഈ ഗൃഹോപമയിൽ പ്രസക്തമായതിനാൽ, മൃദുവായ ‘ദാസൻ/സേവകൻ’ എന്നതിനെക്കാൾ ഉറവിടപദത്തിന്റെ ശക്തമായ അർത്ഥം നിലനിർത്തുന്നു.
- source_word: φρόνιμος
  choice: വിവേകി
  rationale: പ്രായോഗിക ജ്ഞാനവും സൂക്ഷ്മബുദ്ധിയുമാണ് സന്ദർഭത്തിലെ ആശയം; ‘വിവേകി’ ആ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: κατέστησεν
  choice: നിയമിച്ച
  rationale: ഉത്തരവാദിത്വമുള്ള സ്ഥാനത്ത് ഒരാളെ നിയോഗിക്കുക എന്ന അർത്ഥം കൃത്യമായി നൽകുന്നു.
- source_word: κύριος
  choice: യജമാനൻ
  rationale: ഗൃഹനിർവഹണത്തിന്റെ ഉപമാസന്ദർഭത്തിൽ ദാസന്മാരുടെ ഉടമയും അധികാരിയുമായ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക പദം.
- source_word: οἰκετείας
  choice: വീട്ടിലുള്ളവർ
  rationale: οἰκετεία ഇവിടെ ഗൃഹത്തിലെ ആളുകളെയോ ഗൃഹപരിവാരത്തെയോ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള αὐτοῖς എന്ന ബഹുവചന സർവനാമത്തോട് വ്യക്തമായി പൊരുത്തപ്പെടുന്നു.
- source_word: τοῦ δοῦναι
  choice: കൊടുക്കേണ്ടതിന്
  rationale: ആർട്ടിക്കുലർ ഇൻഫിനിറ്റീവിന്റെ ഉദ്ദേശ്യഭാവം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τροφὴν
  choice: ഭക്ഷണം
  rationale: τροφὴ എന്നതിന്റെ അടിസ്ഥാന അർത്ഥമായ ഭക്ഷണം/പോഷണം അനാവശ്യമായ വിശദീകരണമില്ലാതെ നൽകുന്നു.
- source_word: ἐν καιρῷ
  choice: തക്കസമയത്ത്
  rationale: വെറും കാലസൂചനയല്ല, അനുയോജ്യവും നിശ്ചിതവുമായ സമയം എന്ന καιρός-ന്റെ ഭാവം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഗൃഹോപമയുടെ സന്ദർഭത്തിൽ κύριος എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: യജമാനൻ
  alternative: കർത്താവ്
  rationale: വാക്യത്തിന്റെ ഉപരിതലചിത്രം ഗൃഹനിർവഹണവും യജമാനൻ–അടിമ ബന്ധവുമാണ്. അതിനാൽ ‘യജമാനൻ’ ഉടനെയുള്ള സന്ദർഭം കൃത്യമായി നൽകുന്നു; വിശാലസന്ദർഭത്തിലെ കർത്താവിനോടുള്ള ഉപമാസൂചനയെ നിഷേധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ചോദ്യംരൂപം. ഗൃഹോപമയിലെ സാമൂഹികബന്ധം വ്യക്തമാക്കാൻ ‘യജമാനൻ’, ‘അടിമ’ എന്നിവ ഉപയോഗിച്ചു; οἰκετεία-യുടെ വ്യക്തിസമൂഹഭാവം വ്യക്തമാക്കാൻ ‘വീട്ടിലുള്ളവർ’ തെരഞ്ഞെടുത്തു.
