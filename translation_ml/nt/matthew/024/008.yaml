lexical_decisions:
- source_word: πάντα … ταῦτα
  choice: ഇവയെല്ലാം
  rationale: മുമ്പ് പറഞ്ഞ സംഭവങ്ങളെയെല്ലാം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുമ്പുള്ള സംഭവപ്പട്ടികയിൽനിന്ന് യേശുവിന്റെ വിലയിരുത്തലിലേക്കുള്ള മൃദുവായ വ്യത്യാസവും ആശയമാറ്റവും സൂചിപ്പിക്കുന്നു.
- source_word: ἀρχὴ
  choice: ആരംഭം
  rationale: ഇവ അന്ത്യം തന്നെയല്ല, തുടക്കഘട്ടമാണെന്ന ഉറവിടപാഠത്തിന്റെ ആശയം അധിക വ്യാഖ്യാനം ചേർക്കാതെ നൽകുന്നു.
- source_word: ὠδίνων
  choice: പ്രസവവേദനകളുടെ
  rationale: പ്രസവസമയത്തെ വേദനകൾ എന്ന ഗ്രീക്ക് രൂപകം വ്യക്തവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ അതേപടി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ὠδίνων എന്ന പദത്തിലെ പ്രസവരൂപകം
  choice: “പ്രസവവേദനകൾ” എന്നു രൂപകം നിലനിർത്തുക
  alternative: “കഷ്ടതകൾ” അല്ലെങ്കിൽ “ദുരിതങ്ങൾ” എന്നു പൊതുവാക്കുക
  rationale: മുമ്പ് പറഞ്ഞ കലഹങ്ങൾ വരാനിരിക്കുന്ന ദുരിതത്തിന്റെ ആരംഭഘട്ടമാണെന്ന സൂചന രൂപകം നൽകുന്നു; എന്നാൽ വാക്യം പറയുന്നതിലധികമായ ഒരു പ്രത്യേക അന്ത്യകാലക്രമം ഇതിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. “മാത്രം” പോലുള്ള ഊന്നൽപദം ഗ്രീക്കിൽ നേരിട്ട് ഇല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല.
