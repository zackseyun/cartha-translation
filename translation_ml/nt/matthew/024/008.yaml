translation:
  language: ml
  text: എന്നാൽ ഇവയെല്ലാം പ്രസവവേദനകളുടെ ആരംഭമാണ്[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പ്രസവനോവുകൾ” എന്നും വിവർത്തനം ചെയ്യാം. വരാനിരിക്കുന്ന ദുരിതത്തിന്റെ ആരംഭഘട്ടത്തെ പ്രസവവേദനകളുടെ രൂപകത്തിലൂടെയാണ് ഗ്രീക്ക് പദം ചിത്രീകരിക്കുന്നത്.
