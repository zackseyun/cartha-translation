id: MAT.24.26
reference: Matthew 24:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐὰν οὖν εἴπωσιν ὑμῖν· Ἰδοὺ ἐν τῇ ἐρήμῳ ἐστίν, μὴ ἐξέλθητε· Ἰδοὺ ἐν τοῖς ταμείοις, μὴ πιστεύσητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/026.yaml
  text: Therefore[a], if they say to you, ‘Look, he is in the wilderness,’ do not go out; ‘Look[c][b], he is in the inner rooms,’ do not believe it.
translation:
  language: ml
  text: അതുകൊണ്ട്, അവർ നിങ്ങളോട്, ‘നോക്കൂ, അവൻ വിജനപ്രദേശത്താണ്[a]’ എന്നു പറഞ്ഞാൽ, പുറത്തേക്കു പോകരുത്; ‘നോക്കൂ, അവൻ അകത്തെ മുറികളിലാണ്[b]’ എന്നു പറഞ്ഞാൽ, അതു വിശ്വസിക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘മരുഭൂമിയിലാണ്.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘സംഭരണമുറികളിലാണ്’ അല്ലെങ്കിൽ ‘സ്വകാര്യ മുറികളിലാണ്.’ ഗ്രീക്ക് പദം അകത്തെ, സ്വകാര്യ, അല്ലെങ്കിൽ സംഭരണ മുറികളെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: അതുകൊണ്ട്, ... പറഞ്ഞാൽ
  rationale: οὖν മുൻവാക്യത്തിലെ മുന്നറിയിപ്പിൽനിന്നുള്ള നിഗമനബന്ധവും ἐὰν സോപാധിക സാഹചര്യവും സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ ഘടന രണ്ടും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: εἴπωσιν ὑμῖν
  choice: അവർ നിങ്ങളോട് ... പറഞ്ഞാൽ
  rationale: മൂന്നാം പുരുഷ ബഹുവചനം നിർദിഷ്ടമല്ലാത്ത ‘അവർ’ എന്ന നിലയിൽ നിലനിർത്തുന്നു.
- source_word: Ἰδοὺ
  choice: നോക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ἰδούയുടെ തത്സമയസ്വഭാവം ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐν τῇ ἐρήμῳ
  choice: വിജനപ്രദേശത്ത്
  rationale: ἔρημος ജനവാസമില്ലാത്ത പ്രദേശത്തെയോ മരുഭൂമിയെയോ സൂചിപ്പിക്കാം; ‘വിജനപ്രദേശം’ മണൽമരുഭൂമി എന്ന അനാവശ്യ പരിമിതി ഒഴിവാക്കുന്നു.
- source_word: ἐστίν
  choice: അവൻ ... ആണ്
  rationale: ഗ്രീക്കിൽ കർത്താവ് പരോക്ഷമാണ്; സന്ദർഭത്തിൽ അവകാശപ്പെടപ്പെടുന്ന പുരുഷനെ സൂചിപ്പിക്കാൻ മലയാളത്തിൽ ‘അവൻ’ ആവശ്യമാണ്, എന്നാൽ യേശു/മശീഹാ എന്ന പദവി ചേർത്തിട്ടില്ല.
- source_word: μὴ ἐξέλθητε
  choice: പുറത്തേക്കു പോകരുത്
  rationale: μήയോടുകൂടിയ aorist subjunctive നിരോധനം പ്രകടിപ്പിക്കുന്നു; ἐξέρχομαιയിലെ പുറത്തേക്കുള്ള ചലനവും നിലനിർത്തുന്നു.
- source_word: ἐν τοῖς ταμείοις
  choice: അകത്തെ മുറികളിൽ
  rationale: ταμεῖον അകത്തെ, സ്വകാര്യ, സംഭരണ മുറി എന്നിവയെ സൂചിപ്പിക്കാം; ‘അകത്തെ മുറികൾ’ രഹസ്യത്വം അനാവശ്യമായി ശക്തമാക്കാതെ വിശാലമായ അർഥം നൽകുന്നു.
- source_word: μὴ πιστεύσητε
  choice: അതു വിശ്വസിക്കരുത്
  rationale: വിശ്വസിക്കരുതെന്നത് പ്രസ്താവിച്ച അവകാശവാദത്തെക്കുറിച്ചാണ്; മലയാളത്തിൽ ‘അതു’ ചേർക്കുന്നത് ഈ അർഥം വ്യക്തവും സ്വാഭാവികവുമാക്കുന്നു.
theological_decisions:
- issue: ἐστίν എന്നതിന്റെ പരോക്ഷ കർത്താവ്
  choice: പദവിയൊന്നും ചേർക്കാതെ ‘അവൻ’ എന്നു നൽകി.
  alternative: ‘മശീഹാ അവിടെയുണ്ട്’ അല്ലെങ്കിൽ ‘യേശു അവിടെയുണ്ട്’
  rationale: അടുത്ത സന്ദർഭം വ്യാജമായ സാന്നിധ്യാവകാശവാദങ്ങളെക്കുറിച്ചാണെങ്കിലും, ഈ ഉപവാക്യത്തിൽ ഗ്രീക്ക് പ്രത്യേക പദവി പറയുന്നില്ല; അതിനാൽ പരാമർശം വ്യക്തമാക്കാൻ വേണ്ട ഏറ്റവും കുറഞ്ഞ പൂരണം മാത്രം നൽകി.
- issue: രണ്ട് ഉദ്ധരിച്ച അവകാശവാദങ്ങൾ തമ്മിലുള്ള ബന്ധം
  choice: ഗ്രീക്കിലെ സമാന്തര ഘടന നിലനിർത്തി; ഇല്ലാത്ത ‘അല്ലെങ്കിൽ’ ചേർത്തില്ല.
  alternative: രണ്ടാമത്തെ അവകാശവാദത്തിനു മുമ്പ് ‘അല്ലെങ്കിൽ’ ചേർക്കുക
  rationale: മൂലപാഠം Ἰδοὺ ആവർത്തിക്കുന്നുവെങ്കിലും വ്യക്തമായ disjunctive conjunction ഇല്ല; വിരാമചിഹ്നവും ആവർത്തിച്ച ‘എന്നു പറഞ്ഞാൽ’ ഘടനയും ബന്ധം സ്വാഭാവികമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഉദ്ധരണികളുടെ സമാന്തരത വ്യക്തമാക്കാൻ ഓരോ അവകാശവാദത്തോടും ‘എന്നു പറഞ്ഞാൽ’ ആവർത്തിച്ചു; ഗ്രീക്കിൽ ഇല്ലാത്ത ‘അല്ലെങ്കിൽ’ ചേർത്തിട്ടില്ല. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ നൽകിയിരിക്കുന്നു.
