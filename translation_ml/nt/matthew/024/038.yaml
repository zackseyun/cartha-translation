reference: Matthew 24:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ὡς γὰρ ἦσαν ἐν ταῖς ⸀ἡμέραις ταῖς πρὸ τοῦ κατακλυσμοῦ τρώγοντες καὶ πίνοντες, γαμοῦντες καὶ ⸀γαμίζοντες, ἄχρι ἧς ἡμέρας εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/038.yaml
  text: For as in the days before the flood they were eating and drinking[a], marrying and giving in marriage, until the day Noah entered the ark,
translation:
  language: ml
  text: പ്രളയത്തിനു മുമ്പുള്ള ദിവസങ്ങളിൽ, നോഹ പെട്ടകത്തിൽ പ്രവേശിച്ച ദിവസംവരെ, അവർ തിന്നും കുടിച്ചും വിവാഹം കഴിച്ചും വിവാഹത്തിനു കൊടുത്തും[a] ഇരുന്നതുപോലെ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വിവാഹം കഴിച്ചും വിവാഹത്തിനു നൽകപ്പെട്ടും.” ഗ്രീക്കിൽ γαμοῦντες, γαμίζοντες എന്നീ രണ്ടു വ്യത്യസ്ത ക്രിയകളാണ്; രണ്ടാമത്തേതിന് ഒരാളെ വിവാഹത്തിനു കൊടുക്കുക എന്നോ വിവാഹത്തിനു നൽകപ്പെടുക എന്നോ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς γὰρ
  choice: …ഇരുന്നതുപോലെ
  rationale: γάρ മുൻവാക്യത്തിന്റെ വിശദീകരണപരമായ താരതമ്യം തുടരുന്നു; മലയാളത്തിൽ വാക്യാന്തത്തിലെ ‘പോലെ’ താരതമ്യം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു. ഈ വാക്യം അടുത്ത വാക്യത്തിൽ പൂർത്തിയാകുന്നതിനാൽ പ്രത്യേകമായി ‘എന്തെന്നാൽ’ ചേർത്തില്ല.
- source_word: ἐν ταῖς ἡμέραις ταῖς πρὸ τοῦ κατακλυσμοῦ
  choice: പ്രളയത്തിനു മുമ്പുള്ള ദിവസങ്ങളിൽ
  rationale: കാലസൂചനയും നോഹയുടെ പ്രളയത്തോടുള്ള വ്യക്തമായ ബന്ധവും ലളിതവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: τρώγοντες καὶ πίνοντες
  choice: തിന്നും കുടിച്ചും
  rationale: സാധാരണയായി തുടരുന്ന പ്രവർത്തനങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; അതിരുകടക്കലോ പാപപരമായ ഭാവമോ മൂലപാഠത്തിൽ ഇല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല.
- source_word: γαμοῦντες καὶ γαμίζοντες
  choice: വിവാഹം കഴിച്ചും വിവാഹം കഴിപ്പിച്ചും
  rationale: 'രണ്ടു ഗ്രീക്ക് ക്രിയകളുടെയും വ്യത്യാസം സംരക്ഷിക്കുന്നു: സ്വയം വിവാഹം കഴിക്കൽ, മറ്റൊരാളെ വിവാഹം കഴിപ്പിക്കൽ. രണ്ടാമത്തെ ക്രിയയുടെ മറ്റൊരു വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകുന്നു.'
- source_word: ἄχρι ἧς ἡμέρας
  choice: …ദിവസംവരെ
  rationale: തുടർന്നുകൊണ്ടിരുന്ന പ്രവർത്തനങ്ങളുടെ കാലപരിധി സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν
  choice: നോഹ പെട്ടകത്തിൽ പ്രവേശിച്ച
  rationale: നിർണായകമായ സംഭവത്തെ കൃത്യമായി അവതരിപ്പിക്കുന്നു; κιβωτός എന്നതിന് നോഹയുടെ വിവരണത്തിൽ സ്ഥാപിതമായ മലയാളപദമായ ‘പെട്ടകം’ ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: പറഞ്ഞിരിക്കുന്ന പ്രവർത്തനങ്ങളെ പാപകരമായ അതിരുകടക്കലായോ ന്യായവിധി അറിയാതെ തുടരുന്ന സാധാരണ ജീവിതമായോ അവതരിപ്പിക്കണമോ
  choice: സാധാരണ മനുഷ്യപ്രവർത്തനങ്ങളായി നിഷ്പക്ഷമായി പരിഭാഷപ്പെടുത്തി
  alternative: ഭോഗാസക്തിയുടെയോ ധാർമിക അശ്രദ്ധയുടെയോ സൂചന ചേർക്കുക
  rationale: ഗ്രീക്ക് കൃദന്തങ്ങൾ ഭക്ഷണം, പാനം, വിവാഹം എന്നീ സാധാരണ പ്രവർത്തനങ്ങൾ മാത്രമാണ് പറയുന്നത്; അവയെ സ്വതവേ പാപകരമാക്കുന്ന വിശേഷണം മൂലപാഠത്തിലില്ല. അതിനാൽ സന്ദർഭത്തിലെ അപ്രതീക്ഷിത ന്യായവിധിയുടെ ഊന്നൽ നിലനിർത്തി, അധികമായ അപലപനം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. വാക്യം 39-ാം വാക്യത്തിൽ പൂർത്തിയാകുന്ന താരതമ്യഘടനയായതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തി. ‘വിവാഹം കഴിപ്പിച്ചും’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും ഗ്രീക്കിലെ ക്രിയാഭേദം സംരക്ഷിക്കുന്നതുമാണ്.
