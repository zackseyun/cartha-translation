id: MAT.24.47
reference: Matthew 24:47
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ὅτι ἐπὶ πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ καταστήσει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/047.yaml
  text: Truly I say to you that he will appoint him over all his possessions[a].
translation:
  language: ml
  text: 'സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: അവൻ തന്റെ സകല സ്വത്തിന്മേലും അവനെ നിയമിക്കും.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തനിക്കുള്ള സകലത്തിന്മേൽ.’
    reason: τοῖς ὑπάρχουσιν αὐτοῦ എന്ന പ്രയോഗത്തിന്റെ കൂടുതൽ പദാനുപദമായ ബദൽ പരിഭാഷ.
lexical_decisions:
- source_word: ἀμὴν
  choice: സത്യമായി
  rationale: യേശുവിന്റെ ഗൗരവപൂർണവും ആധികാരികവുമായ പ്രഖ്യാപനസൂത്രം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: മൂലത്തിലെ വർത്തമാനകാല ക്രിയയും ബഹുവചന ദാതൃസർവനാമവും നേരിട്ടും ഗൗരവത്തോടെയും പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: ὅτι
  choice: ':'
  rationale: മലയാളത്തിൽ ഉദ്ധരണിയുടെ ഉള്ളടക്കം സ്വാഭാവികമായി അവതരിപ്പിക്കാൻ കോളൺ ഉപയോഗിച്ചു; പ്രത്യേകമായ ‘എന്ന്’ ചേർക്കാതെയും ബന്ധം വ്യക്തമാണ്.
- source_word: ἐπὶ πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ
  choice: തന്റെ സകല സമ്പത്തിന്റെയും മേൽ
  rationale: ἐπί എന്നതിലെ ചുമതലയുടെ പരിധിയും τοῖς ὑπάρχουσιν എന്നതിലെ ഒരാളുടെ ഉടമസ്ഥതയിലുള്ള വസ്തുക്കളും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: καταστήσει
  choice: നിയമിക്കും
  rationale: ഇവിടെ ശാരീരികമായി വെക്കുക എന്നതിലുപരി മേൽനോട്ടസ്ഥാനത്തേക്ക് നിയോഗിക്കുക എന്ന ഭരണപരമായ അർഥമാണ്.
- source_word: αὐτόν
  choice: അവനെ
  rationale: മുൻസന്ദർഭത്തിലെ വിശ്വസ്തനും വിവേകിയുമായ ദാസനെ സൂചിപ്പിക്കുന്ന പുല്ലിംഗ ഏകവചനത്തെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: യജമാനൻ നൽകുന്ന പ്രതിഫലത്തിന്റെയോ ചുമതലപ്പെടുത്തലിന്റെയോ സ്വഭാവം
  choice: ഉപമയുടെ നേരിട്ടുള്ള അർഥത്തിൽ, യജമാനന്റെ സമ്പത്തിന്റെ മേൽ ദാസനെ നിയമിക്കുന്നതായി വിവർത്തനം ചെയ്തു.
  alternative: സഭാധികാരത്തിന്റെയോ അന്ത്യകാല സ്വർഗീയ പ്രതിഫലത്തിന്റെയോ പ്രത്യേക രൂപകമായി വ്യാഖ്യാനിക്കുക.
  rationale: വാക്യം കൂടുതൽ വിപുലമായ കാര്യവിചാരണ ഏൽപ്പിക്കുന്നതിനെ മാത്രം വ്യക്തമാക്കുന്നു; അതിനപ്പുറമുള്ള സഭാശാസ്ത്രപരമോ അന്ത്യകാലപരമോ ആയ വ്യാഖ്യാനം വിവർത്തനത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവപൂർണവുമായ ശൈലി. യേശുവിന്റെ പ്രഖ്യാപനസൂത്രത്തിന്റെ ഔപചാരികത നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പദങ്ങൾ ഉപയോഗിച്ചു.
