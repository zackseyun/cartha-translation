review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly conveys the rhetorical question, the solemn affirmation, the locative ‘here,’ and the prediction that no stone will remain upon another. However, the relative clause is more naturally and precisely expressed in Malayalam as modifying the remaining stone: no stone will remain on another without being demolished.'
  naturalness: ‘ഇടിച്ചുകളയപ്പെടാത്ത ഒരു കല്ലും മറ്റൊരു കല്ലിന്മേൽ ഇവിടെ ശേഷിക്കുകയില്ല’ is understandable, but its word order is somewhat heavy and the negative participial modifier is less idiomatic. Moving ‘ഇവിടെ’ forward and using ‘ഇടിച്ചുനീക്കപ്പെടാതെ ശേഷിക്കുകയില്ല’ produces a smoother modern-standard Malayalam sentence while retaining the source syntax and emphasis.
  terminology: ‘സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു’ is appropriate for ἀμὴν λέγω ὑμῖν. ‘ഇടിച്ചുനീക്കുക’ suitably conveys structural demolition (καταλυθήσεται) without narrowing the sense to a particular method. The footnote retains ‘പൊളിക്കപ്പെടുക’ as a valid lexical alternative.
  issues:
  - severity: low
    issue: The placement and form of the relative clause are somewhat awkward in Malayalam.
    rationale: The Greek says that no stone will remain upon another which will not be demolished. Malayalam reads more naturally when the ‘not without being demolished’ condition follows ‘remain,’ rather than preceding ‘a stone.’
