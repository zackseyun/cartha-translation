id: MAT.24.2
reference: Matthew 24:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀ἀποκριθεὶς εἶπεν αὐτοῖς· Οὐ βλέπετε ⸂ταῦτα πάντα⸃; ἀμὴν λέγω ὑμῖν, οὐ μὴ ἀφεθῇ ὧδε λίθος ἐπὶ λίθον ὃς οὐ καταλυθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/002.yaml
  text: But he answered and said to them[a], “Do you not see all these things? Truly I tell you, not one stone here will be left upon another that will not be thrown down.”
translation:
  language: ml
  text: 'അവൻ അവരോടു മറുപടിയായി പറഞ്ഞു: “ഇവയെല്ലാം നിങ്ങൾ കാണുന്നില്ലേ? സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: ഇവിടെ ഒരു കല്ലും മറ്റൊരു കല്ലിന്മേൽ ഇടിച്ചുനീക്കപ്പെടാതെ[a] ശേഷിക്കുകയില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “പൊളിക്കപ്പെടാതെ.” ഗ്രീക്ക് ക്രിയയ്ക്ക് ഒരു കെട്ടിടം പൊളിച്ചുനീക്കുക, ഇടിച്ചുതകർക്കുക എന്നീ അർഥങ്ങൾ വരാം; “ഇടിച്ചുനീക്കപ്പെടാതെ” എന്നത് കല്ലുകൾ അവയുടെ സ്ഥാനത്തുനിന്ന് നീക്കപ്പെടുന്ന ദൃശ്യഭാവം നിലനിർത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: മറുപടിയായി പറഞ്ഞു
  rationale: പങ്കാളിക്രിയയും മുഖ്യക്രിയയും ചേർന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ‘മറുപടി പറഞ്ഞു’ എന്നതിനെക്കാൾ പ്രവാഹമുള്ളതാണ്.
- source_word: Οὐ βλέπετε
  choice: നിങ്ങൾ കാണുന്നില്ലേ?
  rationale: സമ്മതം പ്രതീക്ഷിക്കുന്ന നിഷേധരൂപത്തിലുള്ള വാചാടോപചോദ്യത്തിന്റെ ഭാവവും നേരിട്ടുള്ള കാഴ്ചയുടെ അർഥവും സംരക്ഷിക്കുന്നു.
- source_word: ταῦτα πάντα
  choice: ഇവയെല്ലാം
  rationale: മുമ്പ് പരാമർശിച്ച ദേവാലയകെട്ടിടങ്ങളെയെല്ലാം സൂചിപ്പിക്കുന്ന നപുംസക ബഹുവചനത്തിന്റെ സമഗ്രത ചുരുക്കമായും വ്യക്തമായും നൽകുന്നു.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: യേശുവിന്റെ ഗൗരവപൂർണമായ ഉറപ്പുവാക്കിനെ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മാന്യവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: οὐ μὴ ἀφεθῇ
  choice: ഒരു കല്ലും ... ശേഷിക്കുകയില്ല
  rationale: οὐ μή എന്ന ഊന്നിയ നിഷേധം ‘ഒരു കല്ലും ... ഇല്ല’ എന്ന സമ്പൂർണ നിഷേധഘടനയിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: ὧδε
  choice: ഇവിടെ
  rationale: തൽസന്ദർഭത്തിലെ ദേവാലയപരിസരത്തെ സൂചിപ്പിക്കുന്ന സ്ഥലവാചകത്തിന്റെ നേരിട്ടുള്ള വിവർത്തനം.
- source_word: λίθος ἐπὶ λίθον
  choice: ഒരു കല്ലും മറ്റൊരു കല്ലിന്മേൽ
  rationale: കല്ലിന്മേൽ കല്ല് ശേഷിക്കാത്ത സമ്പൂർണ പൊളിച്ചുനീക്കലിന്റെ ദൃശ്യരൂപം മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: καταλυθήσεται
  choice: ഇടിച്ചുകളയപ്പെടാത്ത
  rationale: കെട്ടിടം പൊളിക്കുകയോ ഇടിച്ചുനീക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ ശാരീരികവും വാസ്തുവിദ്യാപരവുമായ ദൃശ്യഭാവം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ദേവാലയത്തെക്കുറിച്ചുള്ള യേശുവിന്റെ പ്രവചനത്തിന്റെ പരിധിയും ശക്തിയും
  choice: കല്ലുകൾ ഒന്നിന്മേൽ മറ്റൊന്ന് ശേഷിക്കാത്തവിധമുള്ള സമ്പൂർണ ഭൗതിക ഇടിച്ചുനീക്കലിന്റെ വ്യക്തമായ പ്രവചനമായി അവതരിപ്പിച്ചു.
  alternative: ഇത് പ്രധാനമായും ന്യായവിധിയുടെ പ്രതീകമാണെന്നോ ഒരു പ്രത്യേക അന്ത്യകാലക്രമവുമായി നിർബന്ധമായി ബന്ധിപ്പിക്കണമെന്നോ വിവർത്തനത്തിൽ വ്യക്തമാക്കുക.
  rationale: വാക്യത്തിലെ ഭാഷ മൂർത്തവും വാസ്തുവിദ്യാപരവുമാണ്. അതിന്റെ ശക്തി നിലനിർത്തുമ്പോഴും വാക്യം തന്നെ പറയാത്ത ഒരു പ്രത്യേക യുഗാന്തശാസ്ത്ര വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്ക് വാക്യത്തിന്റെ ഊന്നിയ നിഷേധവും കല്ലുകൾ ഇടിച്ചുനീക്കുന്ന മൂർത്തദൃശ്യവും സ്വാഭാവികമായ മലയാളവാക്യക്രമത്തിൽ സംരക്ഷിച്ചു. അടിക്കുറിപ്പിന്റെ സൂചകം അതുമായി ബന്ധപ്പെട്ട ‘ഇടിച്ചുകളയപ്പെടാത്ത’ എന്ന പദത്തോടു ചേർത്തിരിക്കുന്നു.
