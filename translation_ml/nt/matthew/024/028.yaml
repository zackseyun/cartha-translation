reference: Matthew 24:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ὅπου ἐὰν ᾖ τὸ πτῶμα, ἐκεῖ συναχθήσονται οἱ ἀετοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/028.yaml
  text: Wherever the corpse is[a], there the vultures will gather.
translation:
  language: ml
  text: ശവം എവിടെയുണ്ടോ, അവിടെ കഴുകന്മാർ കൂടിവരും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ സാധാരണയായി “eagles” എന്നർഥമുള്ള പദം. എന്നാൽ ശവത്തിനു ചുറ്റും പക്ഷികൾ കൂടിവരുന്ന ഈ ദൃശ്യത്തിൽ “കഴുകന്മാർ” എന്ന വിവർത്തനമാണ് കൂടുതൽ യോജിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἐὰν ᾖ
  choice: എവിടെയുണ്ടോ
  rationale: ὅπου + ἐάν + subjunctive നൽകുന്ന അനിശ്ചിത സ്ഥാനാർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘എവിടെയുണ്ടോ’ എന്ന് പ്രകടമാക്കുന്നു.
- source_word: πτῶμα
  choice: ശവം
  rationale: മരിച്ച ശരീരത്തെ സൂചിപ്പിക്കുന്ന πτῶμαയ്ക്ക് കൃത്യവും സാധാരണക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളപദമാണ് ‘ശവം’; ചിത്രം മനുഷ്യശരീരത്തിലോ മൃഗശരീരത്തിലോ മാത്രം പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: συναχθήσονται
  choice: കൂടിവരും
  rationale: ഭാവികാല passive രൂപത്തിന്റെ സന്ദർഭോചിതമായ അകർമക അർഥം പക്ഷികളെ വിഷയമാക്കി സ്വാഭാവികമായി നൽകുന്നു; ‘കൂട്ടിച്ചേർക്കപ്പെടും’ എന്ന യാന്ത്രിക വിവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: ἀετοί
  choice: കഴുകന്മാർ
  rationale: ശവത്തിനു ചുറ്റും കൂട്ടംകൂടുന്ന പക്ഷികളുടെ സന്ദർഭത്തിൽ carrion-eating vultures എന്ന ആശയം ‘കഴുകന്മാർ’ സ്വാഭാവികമായി നൽകുന്നു. ഗ്രീക്കുപദത്തിന്റെ ‘പരുന്തുകൾ/eagles’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: പഴഞ്ചൊല്ലുസദൃശമായ ദൃശ്യത്തിന്റെ അന്ത്യകാലസംബന്ധിയായ വ്യാഖ്യാനം
  choice: ശവവും പക്ഷികളും അടങ്ങിയ ദൃശ്യം മാത്രം നേരിട്ട് വിവർത്തനം ചെയ്യുക; അവ എന്തിനെ പ്രതിനിധാനം ചെയ്യുന്നു എന്ന് നിർണയിക്കാതിരിക്കുക.
  alternative: ഇത് അനിവാര്യമായ ന്യായവിധിയെയോ മനുഷ്യപുത്രന്റെ വരവിന്റെ പ്രകടതയെയോ യെരൂശലേമിന്റെ നാശത്തെയോ റോമൻ പതാകകളെയോ സൂചിപ്പിക്കുന്നതായി വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്ക് വാക്യം ദൃശ്യത്തിന്റെ പ്രതീകാർഥം വെളിപ്പെടുത്തുന്നില്ല. അതിനാൽ പ്രത്യേക അന്ത്യകാല വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർക്കാതെ അതിലെ ഉദ്ദേശ്യപൂർവമായ തുറന്നത്വവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. ‘എവിടെയുണ്ടോ ... അവിടെ’ എന്ന സ്വാഭാവിക ഘടന മൂലപാഠത്തിലെ അനിശ്ചിത ബന്ധാർഥം സംരക്ഷിക്കുന്നു. ‘കൂടിവരും’ ദൃശ്യത്തിന്റെ സജീവത നിലനിർത്തുന്നു; പ്രത്യേക പ്രതീകവ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
