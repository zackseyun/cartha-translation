id: MAT.24.44
reference: Matthew 24:44
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διὰ τοῦτο καὶ ὑμεῖς γίνεσθε ἕτοιμοι, ὅτι ᾗ ⸂οὐ δοκεῖτε ὥρᾳ⸃ ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/044.yaml
  text: For this reason[a], you also must be ready, because the Son of Man is coming at an hour you do not expect.
translation:
  language: ml
  text: അതുകൊണ്ട് നിങ്ങളും ഒരുങ്ങിയിരിക്കണം; കാരണം, നിങ്ങൾ പ്രതീക്ഷിക്കാത്ത[a] സമയത്താണ് മനുഷ്യപുത്രൻ വരുന്നത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങൾ വിചാരിക്കാത്ത സമയത്ത്.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘വിചാരിക്കുക,’ ‘കരുതുക’ എന്നീ അർഥങ്ങളും സന്ദർഭത്തിൽ ‘പ്രതീക്ഷിക്കുക’ എന്ന ആശയവും വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: അതുകൊണ്ട്
  rationale: മുൻപുള്ള മുന്നറിയിപ്പിൽനിന്നുള്ള നിഗമനവും കാരണബന്ധവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: καὶ ὑμεῖς
  choice: നിങ്ങളും
  rationale: καί എന്നതിന്റെ ഉൾപ്പെടുത്തൽഭാവവും വ്യക്തമായ ὑμεῖς എന്ന സർവനാമത്തിന്റെ ഊന്നലും അതിശയോക്തിയില്ലാതെ നിലനിർത്തുന്നു.
- source_word: γίνεσθε ἕτοιμοι
  choice: ഒരുങ്ങിയിരിക്കണം
  rationale: വർത്തമാനകാല ബഹുവചന ആജ്ഞ സൂചിപ്പിക്കുന്ന തുടർച്ചയായ സന്നദ്ധാവസ്ഥയും ആജ്ഞയുടെ നിർബന്ധസ്വഭാവവും സ്വാഭാവിക മലയാളത്തിൽ പകരുന്നു.
- source_word: ὅτι
  choice: കാരണം
  rationale: ഇവിടെ ὅτι കല്പനയ്ക്കുള്ള കാരണം അവതരിപ്പിക്കുന്നതിനാൽ കാരണാർഥം നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: ᾗ οὐ δοκεῖτε ὥρᾳ
  choice: നിങ്ങൾ പ്രതീക്ഷിക്കാത്ത സമയത്ത്
  rationale: ദത്തിവിലുള്ള കാലസൂചക പ്രയോഗത്തെ സ്വാഭാവികമായി പകരുന്നു. δοκεῖτε എന്നതിന് ‘വിചാരിക്കുക/കരുതുക’ എന്നും അർഥമുണ്ടെങ്കിലും സന്ദർഭത്തിൽ അപ്രതീക്ഷിതത്വം വ്യക്തമാക്കാൻ ‘പ്രതീക്ഷിക്കുക’ യോജിക്കുന്നു; മറ്റർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: സുവിശേഷങ്ങളിൽ സ്ഥാപിതമായ പദവിയുടെ പദാനുസൃത രൂപവും അതിന്റെ സെമിറ്റിക്, ദാനീയേൽസംബന്ധിയായ അനുരണനങ്ങളും സംരക്ഷിക്കുന്നു.
- source_word: ἔρχεται
  choice: വരുന്നത്
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാലത്തിന്റെ സജീവത മലയാളത്തിലെ ഊന്നൽവാക്യഘടനയിൽ നിലനിർത്തുന്നു; ലളിതഭാവികാലത്തിലേക്ക് മാറ്റുന്നില്ല.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου എന്ന ക്രിസ്തുശാസ്ത്രപരമായ പദവിയുടെ പരിഭാഷ
  choice: മനുഷ്യപുത്രൻ
  alternative: മനുഷ്യനായവൻ
  rationale: ‘മനുഷ്യപുത്രൻ’ മൂലപദവിയുടെ രൂപവും സുവിശേഷങ്ങളിലെ സ്ഥാപിത ഉപയോഗവും ദാനീയേൽസംബന്ധിയായ സാധ്യതയുള്ള അനുരണനവും സംരക്ഷിക്കുന്നു. ബദൽ രൂപം വ്യാഖ്യാനാത്മകമായതിനാൽ മുഖ്യപാഠത്തിന് അത്യധികം പരാവർത്തനപരമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഒരുങ്ങിയിരിക്കണം’ തുടർച്ചയായ സന്നദ്ധതയും ആജ്ഞയുടെ ശക്തിയും ചേർത്ത് നൽകുന്നു. ‘സമയത്താണ് … വരുന്നത്’ എന്ന ഊന്നൽഘടന അപ്രതീക്ഷിതമായ സമയത്തെ മുൻനിർത്തുകയും ഗ്രീക്ക് വർത്തമാനകാലത്തിന്റെ സജീവത നിലനിർത്തുകയും ചെയ്യുന്നു.
