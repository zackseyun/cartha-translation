id: MAT.24.11
reference: Matthew 24:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ πολλοὶ ψευδοπροφῆται ἐγερθήσονται καὶ πλανήσουσιν πολλούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/011.yaml
  text: And many false prophets will arise and will lead many astray[a][b].
translation:
  language: ml
  text: അനേകം കള്ളപ്രവാചകന്മാർ എഴുന്നേൽക്കുകയും അനേകരെ വഴിതെറ്റിക്കുകയും ചെയ്യും[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘അനേകരെ വഞ്ചിക്കുകയും ചെയ്യും.’
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘എഴുന്നേൽപ്പിക്കപ്പെടുകയും ചെയ്യും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: അനേകം
  rationale: വലിയൊരു എണ്ണത്തെ സൂചിപ്പിക്കുന്ന സാധാരണ വിശേഷണം; മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രയോഗം.
- source_word: ψευδοπροφῆται
  choice: കള്ളപ്രവാചകന്മാർ
  rationale: വ്യാജരോ വഞ്ചകരോ ആയ പ്രവാചകരെ സൂചിപ്പിക്കുന്ന സംയുക്തപദത്തിന്റെ അർഥവും ബൈബിൾ പ്രയോഗപരമ്പരയും നിലനിർത്തുന്നു.
- source_word: ἐγερθήσονται
  choice: എഴുന്നേൽക്കും
  rationale: ഇവിടെ ചില വ്യക്തികൾ രംഗത്തുവരുകയോ ഉയർന്നുവരുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക പ്രയോഗം; പുനരുത്ഥാനം എന്ന അനാവശ്യ സൂചന ഒഴിവാക്കുന്നു, എന്നാൽ ഗ്രീക്കിലെ കർമണിരൂപസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: πλανήσουσιν
  choice: വഴിതെറ്റിക്കും
  rationale: അലഞ്ഞുപോകാൻ ഇടയാക്കുക, തെറ്റിദ്ധരിപ്പിക്കുക, വഞ്ചിക്കുക എന്നീ അർഥവ്യാപ്തികളുള്ള ക്രിയയുടെ വഴിതെറ്റിക്കൽ രൂപകം നിലനിർത്തുന്നു.
- source_word: πολλούς
  choice: അനേകരെ
  rationale: ക്രിയയുടെ നേരിട്ടുള്ള കർമമായി വരുന്ന പദത്തിന് സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: καὶ ... καὶ
  choice: -ുകയും ... -ുകയും
  rationale: രണ്ട് ഭാവികാല പ്രവർത്തനങ്ങളെയും ഗ്രീക്കിലെ ആവർത്തിത καί പോലെ നേരിട്ട് ഏകോപിപ്പിക്കുന്നു.
theological_decisions:
- issue: πλανήσουσιν സൂചിപ്പിക്കുന്ന വഴിതെറ്റിക്കലിന്റെ സ്വഭാവം
  choice: കള്ളപ്രവാചകന്മാർ അനേകരെ പൊതുവായ അർഥത്തിൽ വഴിതെറ്റിക്കുമെന്ന് പറയുന്നു; അതിന്റെ കൃത്യമായ മാർഗമോ വ്യാപ്തിയോ വ്യക്തമാക്കുന്നില്ല.
  alternative: ഇത് പ്രധാനമായും ഉപദേശപരമായ വഞ്ചനയെയോ ധാർമികമോ അന്ത്യകാലസംബന്ധമോ ആയ വഴിതെറ്റിക്കലെയോ സൂചിപ്പിക്കുന്നു.
  rationale: πλανάω എന്ന ക്രിയയ്ക്ക് ഉപദേശപരവും ധാർമികവും ആത്മീയവുമായ തെറ്റിദ്ധരിപ്പിക്കൽ ഉൾക്കൊള്ളാവുന്ന വിശാലതയുണ്ട്; പരിഭാഷ അതിനെ ഒരു വിഭാഗത്തിലേക്ക് ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ബൈബിൾ ശൈലി. ‘കള്ളപ്രവാചകന്മാർ’ പരിചിതമായ പദപ്രയോഗമാണ്; ‘വഴിതെറ്റിക്കും’ മൂലഭാഷയിലെ രൂപകവും അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു.
