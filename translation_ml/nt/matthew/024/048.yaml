id: MAT.24.48
reference: Matthew 24:48
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐὰν δὲ εἴπῃ ὁ κακὸς δοῦλος ἐκεῖνος ἐν τῇ καρδίᾳ αὐτοῦ· Χρονίζει ⸂μου ὁ κύριος⸃,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/048.yaml
  text: But if that wicked servant says in his heart[b][a], ‘My master is delaying,’
translation:
  language: ml
  text: എന്നാൽ ആ ദുഷ്ടനായ ദാസൻ[a] തന്റെ ഹൃദയത്തിൽ, ‘എന്റെ യജമാനൻ[b] വൈകുന്നു’ എന്നു പറഞ്ഞാൽ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ആ ദുഷ്ടനായ അടിമ.’ ഗ്രീക്കിലെ doulos എന്ന പദത്തിന് സന്ദർഭമനുസരിച്ച് ‘ദാസൻ’ എന്നോ ‘അടിമ’ എന്നോ അർത്ഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘എന്റെ കർത്താവ്.’ ഇവിടെ ഉപമയുടെ ഗൃഹപരമായ പശ്ചാത്തലം കണക്കിലെടുത്താണ് ഗ്രീക്കിലെ kyrios എന്ന പദം ‘യജമാനൻ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: എന്നാൽ … പറഞ്ഞാൽ
  rationale: δέയുടെ മൃദുവായ വൈരുധ്യവും ἐὰν സഹിതമുള്ള വ്യവസ്ഥയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: εἴπῃ
  choice: പറഞ്ഞാൽ
  rationale: ἐὰν-നോടുകൂടിയ aorist subjunctive സൂചിപ്പിക്കുന്ന സാദ്ധ്യതാപരമായ വ്യവസ്ഥയെ മലയാളത്തിലെ വ്യവസ്ഥാരൂപം വ്യക്തമായി നൽകുന്നു.
- source_word: ὁ κακὸς δοῦλος ἐκεῖνος
  choice: ആ ദുഷ്ടനായ ദാസൻ
  rationale: κακός എന്നതിന്റെ നൈതികമായ ദുഷ്ടതയും ἐκεῖνος എന്ന നിർദ്ദേശക ഊന്നലും നിലനിർത്തുന്നു. ഗൃഹപരമായ ഉപമയിൽ ഏൽപ്പിക്കപ്പെട്ട ചുമതലയാണ് മുൻനിരയിൽ വരുന്നത് എന്നതിനാൽ δοῦλος എന്നതിന് ‘ദാസൻ’ തിരഞ്ഞെടുത്തു; ‘അടിമ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: തന്റെ ഹൃദയത്തിൽ
  rationale: ഉള്ളിലെ ചിന്തയെയോ ആത്മസംഭാഷണത്തെയോ സൂചിപ്പിക്കുന്ന മൂലഭാഷയിലെ ഹൃദയരൂപകം പരിചിതവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: Χρονίζει
  choice: വൈകുന്നു
  rationale: താമസം തുടരുന്നു എന്ന വർത്തമാനകാല അർത്ഥം ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു; ‘വരാൻ’ പോലുള്ള മൂലപാഠത്തിലില്ലാത്ത പൂരകം ചേർക്കുന്നില്ല.
- source_word: μου ὁ κύριος
  choice: എന്റെ യജമാനൻ
  rationale: ഈ ഉപമയിലെ ഗൃഹപരമായ ബന്ധത്തിൽ κύριος മനുഷ്യനായ മേലധികാരിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘യജമാനൻ’ സന്ദർഭോചിതമാണ്; μου എന്ന ഉടമസ്ഥസർവനാമം ‘എന്റെ’ എന്നു നേരിട്ട് നൽകുന്നു.
theological_decisions:
- issue: ഗൃഹപരമായ ഉപമയിൽ κύριος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: യജമാനൻ
  alternative: കർത്താവ്
  rationale: വിശാലമായ പ്രസംഗസന്ദർഭത്തിൽ ഉപമയ്ക്ക് ക്രിസ്തുസംബന്ധമായ സൂചന ഉണ്ടായിരിക്കാമെങ്കിലും, കഥാപാത്രത്തിന്റെ നേരിട്ടുള്ള വാക്കുകളിൽ ഉടൻ ഉദ്ദേശിക്കപ്പെടുന്നത് ദാസന്റെ ഗൃഹനാഥനാണ്. അതിനാൽ കഥാതലത്തിലെ അർത്ഥം പരിഭാഷയിൽ മുൻനിർത്തുകയും മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- issue: ഈ വാക്യത്തിൽ δοῦλος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ദാസൻ
  alternative: അടിമ
  rationale: ഇവിടെ ബന്ധിതസ്ഥിതിയേക്കാൾ ഏൽപ്പിക്കപ്പെട്ട ഗൃഹചുമതലയും പെരുമാറ്റവുമാണ് ഉപമയുടെ ശ്രദ്ധാകേന്ദ്രം. അതിനാൽ ‘ദാസൻ’ സ്വാഭാവികമാണ്; ‘അടിമ’ എന്ന കൂടുതൽ കർശനമായ സാമൂഹിക അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘ഹൃദയത്തിൽ’ എന്ന ബൈബിൾരൂപകം സംരക്ഷിച്ചു. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനത്തിൽ അർധവിരാമസദൃശമായ തുടർച്ച സൂചിപ്പിക്കാൻ കോമ നിലനിർത്തി.
