  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ διχοτομήσει αὐτὸν καὶ τὸ μέρος αὐτοῦ μετὰ τῶν ὑποκριτῶν θήσει· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/051.yaml
  text: and will cut him in two and assign his place with the hypocrites[b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: ml
  text: അവനെ രണ്ടായി വെട്ടുകയും കപടന്മാരോടൊപ്പം അവന്റെ ഓഹരി നിശ്ചയിക്കുകയും ചെയ്യും.[a][b] അവിടെ കരച്ചിലും പല്ലുകടിയും ഉണ്ടാകും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, ആശയപരമായി: ‘അവനെ കഠിനമായി ശിക്ഷിക്കും.’ ഗ്രീക്ക് ക്രിയയുടെ അക്ഷരാർഥം ‘രണ്ടായി വെട്ടും’ എന്നാണ്.'
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥത്തിൽ: ‘കപടന്മാരോടൊപ്പം അവന്റെ ഭാഗം (അഥവാ ഓഹരി) നിശ്ചയിക്കും.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: διχοτομήσει
  choice: അവനെ രണ്ടായി വെട്ടും
  rationale: ക്രിയയുടെ നേരിട്ടുള്ള അർഥമായ ‘രണ്ടായി വെട്ടുക’ നിലനിർത്തുന്നു. ‘കഠിനമായി ശിക്ഷിക്കും’ എന്ന രൂപകസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ച് മുഖ്യപാഠത്തിലെ തീക്ഷ്ണമായ ദൃശ്യഭാഷ സംരക്ഷിക്കുന്നു.
- source_word: μέρος
  choice: ഓഹരി
  rationale: μέρος എന്ന പദത്തിന്റെ ‘ഭാഗം/ഓഹരി’ എന്ന അർഥവും ഒരാൾക്കു വിധിക്കപ്പെട്ട ഗതി എന്ന സന്ദർഭസൂചനയും അമിതമായി വ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്നു.
- source_word: ὑποκριτῶν
  choice: കപടഭക്തർ
  rationale: മത്തായിയുടെ സന്ദർഭത്തിൽ പുറത്തു ഭക്തി പ്രകടിപ്പിച്ചിട്ടും ഉള്ളിൽ അതിനൊത്തവരല്ലാത്തവരെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും പരിചിതവുമായ മലയാളപദം.
- source_word: ἐκεῖ
  choice: അവിടെ
  rationale: മുമ്പ് പറഞ്ഞ ന്യായവിധിയുടെ അവസ്ഥയിലേക്കോ സ്ഥാനത്തിലേക്കോ നേരിട്ട് ചൂണ്ടുന്ന ഗ്രീക്ക് ക്രിയാവിശേഷണത്തിന്റെ ലളിതമായ സമാനപദം.
- source_word: κλαυθμός
  choice: കരച്ചിൽ
  rationale: മത്തായിയിൽ ആവർത്തിക്കുന്ന ന്യായവിധിവാക്യത്തിലെ വിലാപത്തെ സ്വാഭാവികമായി അറിയിക്കുന്ന പദം.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: പല്ലുകടി
  rationale: പല്ലുകൾ കടിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ശക്തവും സംക്ഷിപ്തവുമായ മലയാളപ്രയോഗം; ആവർത്തിക്കുന്ന മത്തായി വാക്യശൈലിയോടും യോജിക്കുന്നു.
theological_decisions:
- issue: διχοτομήσει എന്നത് അക്ഷരാർഥത്തിലോ പൊതുവായ ശിക്ഷാസൂചനയായോ പരിഭാഷപ്പെടുത്തണമോ
  choice: മുഖ്യപാഠത്തിൽ ‘രണ്ടായി വെട്ടും’ എന്ന മൂർത്തമായ ഭാഷ നിലനിർത്തി
  alternative: ‘കഠിനമായി ശിക്ഷിക്കും’
  rationale: ഗ്രീക്ക് ക്രിയയുടെ നേരിട്ടുള്ള അർഥവും മുന്നറിയിപ്പിന്റെ തീക്ഷ്ണതയും സംരക്ഷിക്കുന്നു; അതിനെ ഒരു പ്രത്യേക അന്തിമശിക്ഷാസിദ്ധാന്തമായി വിശദീകരിക്കുന്നില്ല. രൂപകവായന അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
- issue: τὸ μέρος αὐτοῦ ... θήσει സൂചിപ്പിക്കുന്ന വിധി എങ്ങനെ പ്രകടിപ്പിക്കണം
  choice: ‘കപടഭക്തരോടൊപ്പം അവന്റെ ഓഹരി നിശ്ചയിക്കും’
  alternative: ‘കപടഭക്തരോടൊപ്പം അവന്റെ സ്ഥാനം നിശ്ചയിക്കും’
  rationale: ‘ഓഹരി’ എന്നത് ഗ്രീക്കിലെ μέρος-ന്റെ തുറന്ന അർഥപരിധി സംരക്ഷിക്കുന്നു; അത് സ്ഥലമാണോ വിധിക്കപ്പെട്ട ഗതിയാണോ പങ്കാണോ എന്ന് അനാവശ്യമായി തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്നതുമായ ശൈലി. ഗ്രീക്കിലെ ശക്തമായ ദൃശ്യഭാഷയും ‘ഓഹരി’ എന്ന പദത്തിലെ അർഥതുറപ്പും നിലനിർത്തിയിരിക്കുന്നു.
