id: MAT.24.50
reference: Matthew 24:50
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἥξει ὁ κύριος τοῦ δούλου ἐκείνου ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ καὶ ἐν ὥρᾳ ᾗ οὐ γινώσκει,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/050.yaml
  text: the master of that servant will come on a day he does not expect and at an hour he does not know[b][a],
translation:
  language: ml
  text: ആ അടിമയുടെ[a] യജമാനൻ[b], അവൻ പ്രതീക്ഷിക്കാത്ത ഒരു ദിവസത്തിലും അവൻ അറിയാത്ത ഒരു മണിക്കൂറിലും വരും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ആ ദാസന്റെ യജമാനൻ.’ ഗ്രീക്ക് δοῦλος ബന്ധിതമായ സേവനബന്ധത്തിലുള്ള ഒരാളെ സൂചിപ്പിക്കുന്നു; ഇവിടെ ആ നില പ്രസക്തമായതിനാൽ ‘അടിമ’ എന്നു വിവർത്തനം ചെയ്തിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘യജമാനൻ’ എന്നതിനുപകരം ‘കർത്താവ്’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്ക് κύριος എന്ന പദത്തിന് രണ്ടർഥങ്ങളും വരാം; ഇവിടെ അത് ഉപമയിലെ മനുഷ്യനായ മേലധികാരിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥξει
  choice: വരും
  rationale: ἥκωയുടെ ഭാവികാലരൂപം വരുകയോ എത്തിച്ചേരുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; അപ്രതീക്ഷിതമായ മടങ്ങിവരവിന്റെ സന്ദർഭത്തിൽ ‘വരും’ സ്വാഭാവികവും നേരിട്ടുള്ളതുമാണ്.
- source_word: ὁ κύριος τοῦ δούλου ἐκείνου
  choice: ആ അടിമയുടെ യജമാനൻ
  rationale: κύριος ഇവിടെ ഉപമയിലെ മനുഷ്യനായ മേലധികാരിയെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ‘യജമാനൻ’ അനുയോജ്യം. ἐκείνου പ്രത്യേകമായി മുമ്പ് പറഞ്ഞ അടിമയിലേക്കു ചൂണ്ടുന്നതിനാൽ ‘ആ’ എന്നു നൽകി.
- source_word: δοῦλος
  choice: അടിമ
  rationale: δοῦλος ബന്ധിതമായ സേവന-അധീനതയെ സൂചിപ്പിക്കുന്നു. യജമാനൻ–അടിമ ബന്ധം ഈ ഗൃഹോപമയിൽ പ്രസക്തമായതിനാൽ ‘അടിമ’ അതിന്റെ സാമൂഹികബലം നിലനിർത്തുന്നു.
- source_word: ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ
  choice: അവൻ പ്രതീക്ഷിക്കാത്ത ഒരു ദിവസത്തിൽ
  rationale: അനിശ്ചിതമായ സമയവും അടിമയുടെ പ്രതീക്ഷയില്ലായ്മയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἐν ὥρᾳ ᾗ οὐ γινώσκει
  choice: അവൻ അറിയാത്ത ഒരു മണിക്കൂറിൽ
  rationale: ‘ദിവസം–മണിക്കൂർ’ എന്ന ഗ്രീക്ക് സമാന്തരഘടനയും γινώσκωയുടെ ലളിതമായ ‘അറിയുക’ എന്ന അർഥവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ഉപമയിലെ κύριος എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: യജമാനൻ
  alternative: കർത്താവ്
  rationale: ഉടൻ കാണുന്ന കഥാസന്ദർഭത്തിൽ ഇത് അടിമയുടെ മനുഷ്യനായ മേലധികാരിയെ സൂചിപ്പിക്കുന്നു. ‘കർത്താവ്’ എന്നു നൽകിയാൽ ഉപമയുടെ വിശാലമായ അന്ത്യകാലസൂചനയെ ഈ പദത്തിന്റെ നേരിട്ടുള്ള ദൈവിക പട്ടമായി തെറ്റായി ഉറപ്പിക്കാനുള്ള സാധ്യതയുണ്ട്.
- issue: δοῦλος എന്ന പദത്തിന്റെ സാമൂഹികബലം
  choice: അടിമ
  alternative: ദാസൻ / സേവകൻ
  rationale: ഇവിടെ യജമാനൻ–അടിമ അധികാരബന്ധം തുറന്നുകാണുന്നതിനാൽ ബന്ധിത അധീനതയുടെ ശക്തി ‘അടിമ’ കൂടുതൽ കൃത്യമായി പ്രകടിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. ‘ഒരു ദിവസം/ഒരു മണിക്കൂർ’ എന്ന അനിശ്ചിതത്വവും രണ്ട് സമയപ്രയോഗങ്ങളുടെ സമാന്തരതയും നിലനിർത്തി. വായനാസൗകര്യത്തിനായി കർത്താവിനും അതിനെ വിശേഷിപ്പിക്കുന്ന സമയഘടകങ്ങൾക്കും ഇടയിൽ അൽപവിരാമം ചേർത്തു.
