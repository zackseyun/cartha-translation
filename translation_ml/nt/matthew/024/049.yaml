  yaml_path: translation/nt/matthew/024/049.yaml
  text: and begins to beat his fellow servants[a], and eats and drinks with drunkards[b],
translation:
  language: ml
  text: സഹദാസന്മാരെ[a] അടിക്കാൻ തുടങ്ങുകയും മദ്യലഹരിയിലാകുന്നവരോടൊപ്പം[b] ഭക്ഷിക്കുകയും കുടിക്കുകയും ചെയ്താൽ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘കൂടെ ദാസന്മാരായവർ’; ഒരേ യജമാനന്റെ കീഴിലുള്ള അവരുടെ പൊതുനിലയാണ് ഗ്രീക്ക് പദം ഊന്നിപ്പറയുന്നത്. ചില കൈയെഴുത്തുപ്രതികളിൽ ‘തന്റെ’ എന്ന പദവും ഉണ്ട്.
    reason: alternative_reading
  - marker: b
    text: അഥവാ ‘മദ്യപന്മാരോടൊപ്പം.’ ഗ്രീക്ക് രൂപം മദ്യലഹരിയിലാകുന്ന പ്രവൃത്തിയിൽ ഏർപ്പെടുന്നവരെയോ അതുകൊണ്ട് വിശേഷിപ്പിക്കപ്പെടുന്നവരെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρξηται τύπτειν
  choice: അടിക്കാൻ തുടങ്ങുകയും
  rationale: ἄρξηται എന്ന ക്രിയയും τύπτειν എന്ന അനന്തക്രിയയും ചേർന്ന് പ്രവൃത്തിയുടെ ആരംഭം സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ τύπτω ആവർത്തിച്ചുള്ള ശാരീരിക പീഡനത്തെ സൂചിപ്പിക്കാവുന്നതിനാൽ ‘അടിക്കുക’ സ്വാഭാവികവും ശക്തവുമായ പരിഭാഷയാണ്.
- source_word: τοὺς συνδούλους αὐτοῦ
  choice: തന്റെ സഹദാസന്മാരെ
  rationale: σύνδουλος ഒരേ യജമാനന്റെ കീഴിലുള്ള ‘കൂടെ ദാസനായവൻ’ എന്ന ബന്ധം സൂചിപ്പിക്കുന്നു. ‘സഹദാസന്മാർ’ ആ പങ്കിട്ട നില സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; αὐτοῦ സ്വാഭാവികമായി ‘തന്റെ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: ἐσθίῃ δὲ καὶ πίνῃ
  choice: തിന്നുകയും കുടിക്കുകയും
  rationale: വർത്തമാനകാല ക്രിയാരൂപങ്ങൾ തുടരുന്നതോ പതിവായതോ ആയ പെരുമാറ്റത്തെ അവതരിപ്പിക്കുന്നു. മൂലത്തിലെ ലളിതമായ ക്രിയാജോടി അധിക വ്യാഖ്യാനം ചേർക്കാതെ നിലനിർത്തി.
- source_word: μετὰ τῶν μεθυόντων
  choice: മദ്യപിച്ചു ലഹരിപിടിക്കുന്നവരോടൊപ്പം
  rationale: μεθύω വെറും കുടിക്കുന്നതല്ല, മദ്യലഹരിയിലാകുന്നതാണ്. വർത്തമാന കർത്തൃവാചക രൂപം അത്തരം പ്രവൃത്തിയിൽ ഏർപ്പെടുന്നവരെയോ അതുകൊണ്ട് വിശേഷിപ്പിക്കപ്പെടുന്നവരെയോ സൂചിപ്പിക്കാം; ഈ പരിഭാഷ ആ ചലനാത്മക അർത്ഥം നിലനിർത്തുന്നു.
- source_word: δὲ καὶ
  choice: -കയും ... -കയും
  rationale: ഇവിടെ δέ ശക്തമായ വൈരുധ്യംക്കാൾ തുടർച്ചയായ മറ്റൊരു ദുഷ്പ്രവൃത്തി ചേർക്കുന്നു. മലയാളത്തിലെ സമുച്ചയക്രിയാരൂപം ആ ബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: σύνδουλος എന്ന പദത്തിലെ ദാസ്യബന്ധം
  choice: സഹദാസന്മാർ
  alternative: കൂടെ സേവിക്കുന്നവർ
  rationale: ഉപമയിലെ എല്ലാവരും ഒരേ യജമാനന്റെ അധികാരത്തിൻ കീഴിലാണെന്ന സാമൂഹികവും നൈതികവുമായ ആശയം ‘സഹദാസന്മാർ’ വ്യക്തമായി സൂക്ഷിക്കുന്നു. ‘കൂടെ സേവിക്കുന്നവർ’ ആ ബന്ധത്തിന്റെ ശക്തി കുറയ്ക്കാം.
- issue: μεθυόντων എന്നതിന്റെ സ്വഭാവസൂചന
  choice: മദ്യപിച്ചു ലഹരിപിടിക്കുന്നവർ
  alternative: മദ്യപന്മാർ
  rationale: പങ്കാളിത്തരൂപം പ്രവൃത്തിയിൽ ഏർപ്പെടുന്നവരെയും പതിവായി അങ്ങനെ ചെയ്യുന്നവരെയും സൂചിപ്പിക്കാമെന്ന തുറന്ന നില ഈ ക്രിയാത്മക പരിഭാഷ നിലനിർത്തുന്നു; സ്ഥിരമായ ഒരു വ്യക്തിത്വമുദ്ര മാത്രം ചാർത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മുൻവാക്യത്തിലെ സോപാധിക ഘടന തുടരുന്നതിനാൽ ‘ചെയ്താൽ’ എന്നും അവസാനം അൽപ്പവിരാമവും നിലനിർത്തി.
