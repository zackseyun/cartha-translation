id: MAT.24.5
reference: Matthew 24:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πολλοὶ γὰρ ἐλεύσονται ἐπὶ τῷ ὀνόματί μου λέγοντες· Ἐγώ εἰμι ὁ χριστός, καὶ πολλοὺς πλανήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/005.yaml
  text: For many will come in my name[a], saying, ‘I am the Messiah,’ and they will lead many astray.
translation:
  language: ml
  text: കാരണം, ‘ഞാനാണ് മശീഹാ[a]’ എന്നു പറഞ്ഞുകൊണ്ട് അനേകർ എന്റെ നാമത്തിൽ വരുകയും അനേകരെ വഴിതെറ്റിക്കുകയും ചെയ്യും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഞാനാണ് ക്രിസ്തു.’ ഗ്രീക്കിൽ ഉപയോഗിച്ചിരിക്കുന്ന പദവി ὁ χριστός ആണ്.
    reason: Χριστός എന്ന ഗ്രീക്ക് പദവിയുടെ പരമ്പരാഗത മലയാളരൂപമായ ‘ക്രിസ്തു’ എന്ന പകരം പരിഭാഷ രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: πολλοὶ
  choice: അനേകർ
  rationale: ആളുകളെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ബഹുവചന വിശേഷണത്തിന് സ്വാഭാവികവും മാന്യവുമായ മലയാളരൂപം.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ മുന്നറിയിപ്പിന് ഈ വാക്യം നൽകുന്ന വിശദീകരണബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: ἐλεύσονται
  choice: വരും
  rationale: ἔρχομαι എന്ന ക്രിയയുടെ ഭാവികാലാർഥം മലയാളത്തിൽ ലളിതമായ ഭാവിരൂപത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: എന്റെ നാമത്തിൽ
  rationale: യേശുവിന്റെ നാമവും അധികാരവും അവകാശപ്പെട്ട് വരുന്നതിനെ സൂചിപ്പിക്കുന്ന, മൂലത്തിലെ വ്യഞ്ജനപരിധി നിലനിർത്തുന്ന പ്രയോഗം.
- source_word: λέγοντες
  choice: എന്നു പറഞ്ഞുകൊണ്ട്
  rationale: വരുന്നതിനോടൊപ്പം നടക്കുന്ന അവകാശവാദത്തെ പങ്കാളിക്രിയയുടെ ബലം നിലനിർത്തി അവതരിപ്പിക്കുന്നു.
- source_word: Ἐγώ εἰμι ὁ χριστός
  choice: ഞാനാണ് മശീഹാ
  rationale: ഊന്നൽപ്രയോഗമായ ἐγώയും നിർദ്ദിഷ്ട പദവിയായ ὁ χριστόςയും സ്വാഭാവിക മലയാളത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: πλανήσουσιν
  choice: വഴിതെറ്റിക്കും
  rationale: വഞ്ചനയും ശരിയായ വഴിയിൽനിന്നുള്ള വ്യതിചലനവും ഉൾക്കൊള്ളുന്ന πλανάωയുടെ രൂപകബലം സംരക്ഷിക്കുന്നു.
- source_word: πολλοὺς
  choice: അനേകരെ
  rationale: ക്രിയയുടെ വ്യക്തിസൂചക കർമത്തെ സംക്ഷിപ്തവും വ്യക്തവുമായി നൽകുന്നു.
theological_decisions:
- issue: തെറ്റായ മശീഹാവകാശവാദത്തിലെ Χριστός എന്ന പദവിയുടെ പരിഭാഷ
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ χριστός ഒരു പേരിന്റെ ഭാഗമല്ല, അഭിഷിക്തനായ വാഗ്ദത്ത വ്യക്തിയുടെ പദവിയാണ്; അതിനാൽ അർത്ഥപരമായ ‘മശീഹാ’ പ്രധാനവാചകത്തിൽ നൽകി, പരിചിതമായ ‘ക്രിസ്തു’ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പവും ഗൗരവമുള്ളതുമായ മലയാളം. ‘എന്റെ നാമത്തിൽ’ എന്ന ബൈബിൾപരിചിത പ്രയോഗം മൂലത്തിലെ അധികാരം/തിരിച്ചറിയൽ സംബന്ധമായ സാധ്യതകൾ തുറന്നുവെക്കുന്നു; ‘വഴിതെറ്റിക്കുക’ πλανάωയിലെ വഞ്ചനയും വ്യതിചലനവും ഒരുമിച്ച് സൂക്ഷിക്കുന്നു.
