id: MAT.24.15
reference: Matthew 24:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὅταν οὖν ἴδητε τὸ βδέλυγμα τῆς ἐρημώσεως τὸ ῥηθὲν διὰ Δανιὴλ τοῦ προφήτου ⸀ἑστὸς ἐν τόπῳ ἁγίῳ, ὁ ἀναγινώσκων νοείτω,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/015.yaml
  text: So when you see the abomination of desolation spoken of through Daniel the prophet standing in a holy place—let the reader understand—[a][b]
translation:
  language: ml
  text: അതുകൊണ്ട്, ദാനിയേൽ പ്രവാചകൻ മുഖാന്തരം പറഞ്ഞിരിക്കുന്ന ‘നാശത്തിന്റെ മ്ലേച്ഛത’ ഒരു വിശുദ്ധ സ്ഥലത്ത് നിൽക്കുന്നതു നിങ്ങൾ കാണുമ്പോൾ—വായിക്കുന്നവൻ മനസ്സിലാക്കട്ടെ—[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, കൂടുതൽ പരമ്പരാഗതമായി: “ആ വിശുദ്ധ സ്ഥലത്ത്.”'
    reason: alternative_reading
  - marker: b
    text: 'അല്ലെങ്കിൽ: “നാശം വരുത്തുന്ന മ്ലേച്ഛത” അഥവാ “ശൂന്യമാക്കുന്ന മ്ലേച്ഛത”; ഇത് ദാനിയേലിലെ പ്രയോഗത്തെ പ്രതിധ്വനിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν οὖν
  choice: അതുകൊണ്ട് ... കാണുമ്പോൾ
  rationale: οὖν മുൻപ്രസംഗവുമായി ബന്ധിപ്പിക്കുന്ന നിഗമനാത്മകമായ മാറ്റം സൂചിപ്പിക്കുന്നു; ὅταν ഭാവിയിലെ സാഹചര്യം അവതരിപ്പിക്കുന്നതിനാൽ ‘കാണുമ്പോൾ’ സ്വാഭാവികമാണ്.
- source_word: ἴδητε
  choice: നിങ്ങൾ കാണുമ്പോൾ
  rationale: ὁράω എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുകയും ബഹുവചന അഭിസംബോധന വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: τὸ βδέλυγμα τῆς ἐρημώσεως
  choice: ‘ശൂന്യമാക്കലിന്റെ മ്ലേച്ഛത’
  rationale: ഗ്രീക്കിലെ ഷഷ്ഠീബന്ധവും ദാനിയേലിലേക്കുള്ള അന്തർപാഠബന്ധവും വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു; ‘മ്ലേച്ഛത’ ആരാധനാപരമായി വെറുപ്പുളവാക്കുന്ന അശുദ്ധവസ്തുവിനെയോ പ്രവൃത്തിയെയോ സൂചിപ്പിക്കുന്നു.
- source_word: τὸ ῥηθὲν διὰ Δανιὴλ τοῦ προφήτου
  choice: ദാനിയേൽ പ്രവാചകനിലൂടെ അരുളിച്ചെയ്യപ്പെട്ട
  rationale: διά + genitive എന്നത് പ്രവാചകസന്ദേശത്തിന്റെ മാധ്യമത്തെ സൂചിപ്പിക്കുന്നു. ‘അരുളിച്ചെയ്യപ്പെട്ട’ ദൈവിക പ്രവചനസന്ദർഭം സ്വാഭാവികവും മാന്യവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἑστὸς
  choice: നിൽക്കുന്നതു
  rationale: ἵστημι എന്നതിന്റെ perfect participle നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു; ‘സ്ഥാപിക്കപ്പെട്ടത്’ എന്നു വ്യാഖ്യാനിച്ച് അർഥം ചുരുക്കുന്നില്ല.
- source_word: ἐν τόπῳ ἁγίῳ
  choice: ഒരു വിശുദ്ധസ്ഥലത്ത്
  rationale: ഗ്രീക്കിൽ τόπῳ-ന് article ഇല്ലാത്തതിനാൽ അനിശ്ചിതത്വം നിലനിർത്തുന്നു; ക്ഷേത്രത്തെ മാത്രം നിർബന്ധമായി സൂചിപ്പിക്കുന്നതായി മുഖ്യപാഠം തീരുമാനിക്കുന്നില്ല.
- source_word: ὁ ἀναγινώσκων νοείτω
  choice: വായിക്കുന്നവൻ മനസ്സിലാക്കട്ടെ
  rationale: മൂലത്തിലെ മൂന്നാംപുരുഷ ആജ്ഞാർത്ഥവും പരാന്തരവാക്യസ്വഭാവവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἐν τόπῳ ἁγίῳ എന്നതിന്റെ നിർദിഷ്ടതയും ക്ഷേത്രകേന്ദ്രിത വ്യാഖ്യാനവും
  choice: ഒരു വിശുദ്ധസ്ഥലത്ത്
  alternative: വിശുദ്ധസ്ഥലത്ത്
  rationale: ഈ പ്രയോഗം ക്ഷേത്രത്തെയോ വിശുദ്ധീകരിക്കപ്പെട്ട ഒരു സ്ഥാനത്തെയോ ഓർമിപ്പിക്കാമെങ്കിലും, article ഇല്ലാത്ത ഗ്രീക്ക് രൂപം നിർദിഷ്ടമായ ഒരേയൊരു സ്ഥലത്തെ നിർബന്ധിക്കുന്നില്ല. അതിനാൽ മുഖ്യപാഠത്തിൽ അനിശ്ചിതത്വം സംരക്ഷിക്കുകയും പരമ്പരാഗത വായന അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
- issue: βδέλυγμα τῆς ἐρημώσεως എന്ന ദാനിയേൽപ്രയോഗത്തിന്റെ അർഥബന്ധം
  choice: ശൂന്യമാക്കലിന്റെ മ്ലേച്ഛത
  alternative: ശൂന്യമാക്കുന്ന മ്ലേച്ഛത / ശൂന്യത വരുത്തുന്ന മ്ലേച്ഛത
  rationale: ഷഷ്ഠീപ്രയോഗം ഫലമോ പ്രവർത്തനമോ സൂചിപ്പിക്കാം. മുഖ്യപാഠം ആ ബന്ധം വിശദീകരിച്ച് തീർപ്പാക്കാതെ സൂക്ഷിക്കുന്നു; വ്യാഖ്യാനാത്മക സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ദാനിയേൽപ്രയോഗത്തിന്റെ ഔപചാരികതയും അപോകലിപ്റ്റിക് അസ്പഷ്ടതയും സംരക്ഷിച്ചിട്ടുണ്ട്; ‘ഒരു വിശുദ്ധസ്ഥലം’ എന്ന പ്രയോഗം ക്ഷേത്രത്തെ മാത്രം നിർബന്ധമായി നിർണ്ണയിക്കുന്നില്ല.
