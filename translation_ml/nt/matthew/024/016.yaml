- source_word: Ἰουδαίᾳ
  choice: യെഹൂദ്യ
  rationale: ഭൂമിശാസ്ത്രനാമത്തിന്റെ മലയാളത്തിൽ പരിചിതമായ ബൈബിൾരൂപം നിലനിർത്തുന്നു.
- source_word: φευγέτωσαν
  choice: ഓടിപ്പോകണം
  rationale: മൂന്നാംപുരുഷ ബഹുവചന വർത്തമാനകാല ആജ്ഞാരൂപത്തിന്റെ അടിയന്തരമായ നിർദേശസ്വരം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ἐπὶ τὰ ὄρη
  choice: മലകളിലേക്ക്
  rationale: ചലനക്രിയയോടൊപ്പമുള്ള ἐπί + accusative ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള നീക്കം സൂചിപ്പിക്കുന്നു; ὄρη എന്ന ബഹുവചനവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: അന്ത്യകാല മുന്നറിയിപ്പിലെ ആജ്ഞയുടെ ശക്തി
  choice: നേരിട്ടും അടിയന്തരവുമായ നിർദേശമായി ‘ഓടിപ്പോകണം’
  alternative: കൂടുതൽ രൂപാനുസൃതമായി ‘മലകളിലേക്ക് ഓടിപ്പോകട്ടെ’
  rationale: ഇത് പ്രായോഗികമായ ഒരു ആജ്ഞയാണ്; പ്രത്യേക അന്ത്യകാല വ്യാഖ്യാനം ചേർക്കാതെ അതിന്റെ അടിയന്തരത സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. ‘ഓടിപ്പോകണം’ അടിയന്തര ആജ്ഞയെ സ്വാഭാവികമായി അറിയിക്കുന്നു; അടിക്കുറിപ്പ് ഗ്രീക്ക് മൂന്നാംപുരുഷ ആജ്ഞാരൂപത്തിന്റെ കൂടുതൽ രൂപാനുസൃത സാധ്യത നൽകുന്നു.
