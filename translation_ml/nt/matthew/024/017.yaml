id: MAT.24.17
reference: Matthew 24:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ ἐπὶ τοῦ δώματος μὴ ⸀καταβάτω ἆραι τὰ ἐκ τῆς οἰκίας αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/017.yaml
  text: Let the one on the housetop not go down to take the things out of his house,[a]
translation:
  language: ml
  text: വീടിന്റെ മട്ടുപ്പാവിലുള്ളവൻ തന്റെ വീട്ടിൽനിന്നുള്ള സാധനങ്ങൾ എടുക്കാൻ താഴേക്ക് ഇറങ്ങരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘മേൽക്കൂരയിൽ.’ ഇവിടെ ഗ്രീക്ക് പദം വീടിന്റെ പരന്നതും ഉപയോഗിക്കാവുന്നതുമായ മേൽക്കൂരഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ἐπὶ τοῦ δώματος
  choice: വീടിന്റെ മട്ടുപ്പാവിലുള്ളവൻ
  rationale: നാമവാചകമായി പ്രവർത്തിക്കുന്ന ഈ പ്രയോഗം ‘വീടിന്റെ മട്ടുപ്പാവിലുള്ളവൻ’ എന്ന പ്രതിനിധാന ഏകവചനത്തെ സൂചിപ്പിക്കുന്നു; മൂലത്തിലെ പുരുഷലിംഗ ഏകവചനരൂപവും നിലനിർത്തുന്നു.
- source_word: δώματος
  choice: മട്ടുപ്പാവ്
  rationale: പുരാതന വീടുകളുടെ പരന്നതും ഉപയോഗിക്കാവുന്നതുമായ മേൽക്കൂരഭാഗമാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്; മലയാളത്തിൽ ‘മട്ടുപ്പാവ്’ ഈ വാസ്തുവിദ്യാ പശ്ചാത്തലം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: μὴ καταβάτω
  choice: താഴേക്ക് ഇറങ്ങരുത്
  rationale: അടിയന്തരമായ വിലക്ക് സ്വാഭാവികവും വ്യക്തവുമായി നൽകുന്നു; മട്ടുപ്പാവിൽനിന്നുള്ള താഴോട്ടുള്ള ചലനവും പ്രകടമാക്കുന്നു.
- source_word: ἆραι
  choice: എടുക്കാൻ
  rationale: താഴേക്ക് ഇറങ്ങുന്നതിന്റെ ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന infinitive-നെ ലളിതമായ ഉദ്ദേശ്യരൂപത്തിൽ പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: τὰ ἐκ τῆς οἰκίας αὐτοῦ
  choice: തന്റെ വീട്ടിൽനിന്നുള്ള സാധനങ്ങൾ
  rationale: ἐκ + genitive ഉള്ള സംക്ഷിപ്ത പ്രയോഗം വീട്ടിൽനിന്ന് എടുക്കേണ്ട വസ്തുക്കളെ സൂചിപ്പിക്കുന്നു; ‘സാധനങ്ങൾ’ അർത്ഥം വ്യക്തമാക്കുമ്പോഴും ‘സ്വത്തുക്കൾ’ എന്നതുപോലെ അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: οἰκίας
  choice: വീട്
  rationale: മേൽക്കൂരയിൽനിന്ന് ഇറങ്ങി വസ്തുക്കൾ എടുക്കുന്ന ഭൗതിക കെട്ടിടമാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്.
- source_word: αὐτοῦ
  choice: തന്റെ
  rationale: വാക്യത്തിലെ ഏകവചന കർത്താവിലേക്കുതന്നെ മടങ്ങിച്ചൂണ്ടുന്ന മലയാളത്തിലെ സ്വാഭാവിക പ്രത്യയരൂപമാണിത്; പ്രതിനിധാന ഏകവചനത്തെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: പ്രതിനിധാന പുരുഷലിംഗ ഏകവചന പരാമർശം
  choice: ‘ഉള്ളവൻ’ എന്ന ഏകവചന പുരുഷലിംഗരൂപവും ‘തന്റെ’ എന്ന പ്രത്യയവും നിലനിർത്തി
  alternative: ‘ഉള്ളവർ’ / ബഹുവചന-ലിംഗനിരപേക്ഷ രൂപം
  rationale: ഗ്രീക്ക് വാക്യം പ്രതിനിധാനപരമായ പുരുഷലിംഗ ഏകവചനമാണ് ഉപയോഗിക്കുന്നത്. ഇത് ലിംഗത്തെക്കുറിച്ചുള്ള ഉപദേശപരമായ പ്രസ്താവനയല്ല; എങ്കിലും മൂലരൂപം അനാവശ്യമായി ബഹുവചനമാക്കാതെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിർദേശശൈലി. ‘മട്ടുപ്പാവ്’ ഒന്നാം നൂറ്റാണ്ടിലെ പരന്ന, ഉപയോഗയോഗ്യമായ മേൽക്കൂരയുടെ സാംസ്കാരിക പശ്ചാത്തലം നൽകുന്നു; അടിക്കുറിപ്പ് കൂടുതൽ പൊതുവായ ‘മേൽക്കൂര’ എന്ന സാധ്യത വ്യക്തമാക്കുന്നു.
