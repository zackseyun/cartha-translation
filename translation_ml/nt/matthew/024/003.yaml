id: MAT.24.3
reference: Matthew 24:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καθημένου δὲ αὐτοῦ ἐπὶ τοῦ Ὄρους τῶν Ἐλαιῶν προσῆλθον αὐτῷ οἱ μαθηταὶ κατ’ ἰδίαν λέγοντες· Εἰπὸν ἡμῖν πότε ταῦτα ἔσται, καὶ τί τὸ σημεῖον τῆς σῆς παρουσίας ⸀καὶ συντελείας τοῦ αἰῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/003.yaml
  text: As he was sitting on the Mount of Olives[a], the disciples came to him privately, saying, “Tell us, when will these things be[b], and what will be the sign of your coming and of the end of the age?”
translation:
  language: ml
  text: 'അവൻ ഒലിവുമലയിൽ ഇരിക്കുമ്പോൾ, ശിഷ്യന്മാർ വേറിട്ട് അവന്റെ അടുക്കൽ വന്ന് ചോദിച്ചു: “ഞങ്ങളോടു പറയുക, ഇവ എപ്പോൾ സംഭവിക്കും? അങ്ങയുടെ വരവിന്റെയും[a] യുഗസമാപ്തിയുടെയും[b] അടയാളം എന്തായിരിക്കും?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സാന്നിധ്യത്തിന്റെയും” അല്ലെങ്കിൽ “ആഗമനത്തിന്റെയും.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “യുഗത്തിന്റെ അവസാനത്തിന്റെയും”; പരമ്പരാഗതമായി, “ലോകാവസാനത്തിന്റെയും.”
    reason: alternative_reading
lexical_decisions:
- source_word: Καθημένου δὲ αὐτοῦ
  choice: അവൻ ... ഇരിക്കുമ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് ഘടനയെ സ്വാഭാവികമായ കാലസൂചക ഉപവാക്യമായി നൽകി; ഇരിപ്പിന്റെ തുടരുന്ന ഭാവം നിലനിർത്തുന്നു.
- source_word: Ὄρους τῶν Ἐλαιῶν
  choice: ഒലിവുമല
  rationale: സ്ഥലനാമത്തെ ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: προσῆλθον αὐτῷ
  choice: അവന്റെ അടുക്കൽ വന്ന്
  rationale: യേശുവിന്റെ അടുത്തേക്കുള്ള ശിഷ്യന്മാരുടെ നീക്കം ലളിതവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: κατ’ ἰδίαν
  choice: സ്വകാര്യമായി
  rationale: മറ്റുള്ളവരിൽനിന്ന് വേർപെട്ട് സംസാരിച്ചതെന്ന അർഥം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: λέγοντες· Εἰπὸν ἡμῖν
  choice: 'ചോദിച്ചു: “ഞങ്ങളോടു പറയുക'
  rationale: λέγοντες എന്നതിന്റെ സംഭാഷണപരമായ പ്രവർത്തനം ‘ചോദിച്ചു’ വ്യക്തമാക്കുന്നു; കല്പനാരൂപമായ Εἰπὸν ἡμῖν മാന്യമായ നേരിട്ടുള്ള അഭ്യർഥനയായി നിലനിർത്തുന്നു.
- source_word: πότε ταῦτα ἔσται
  choice: ഇവ എപ്പോൾ സംഭവിക്കും?
  rationale: ഗ്രീക്കിലെ വിശാലമായ ഭാവികാല അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: σημεῖον
  choice: അടയാളം
  rationale: ഭാവിയിലെ സംഭവത്തെ തിരിച്ചറിയിക്കുന്ന സൂചന എന്ന സന്ദർഭാർഥത്തിന് സാധാരണവും വ്യക്തവുമായ പദം.
- source_word: παρουσίας
  choice: വരവ്
  rationale: പദത്തിന് സാന്നിധ്യം, ആഗമനം എന്നീ അർഥങ്ങളും ഉണ്ടെങ്കിലും ഇവിടെ ഭാവിയെക്കുറിച്ചുള്ള ചോദ്യത്തിൽ ‘വരവ്’ സന്ദർഭോചിതമാണ്; മറ്റർഥങ്ങൾ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: συντελείας τοῦ αἰῶνος
  choice: യുഗസമാപ്തി
  rationale: ഒരു യുഗത്തിന്റെ പൂർത്തീകരണം/അവസാനം എന്ന ഗ്രീക്ക് ആശയം സംക്ഷിപ്തമായി നൽകുന്നു; ഭൗതിക ലോകത്തിന്റെ നാശം എന്ന് അധികമായി നിർണയിക്കുന്നില്ല.
theological_decisions:
- issue: അന്ത്യകാലസന്ദർഭത്തിലെ παρουσίαയുടെ വിവർത്തനം
  choice: വരവ്
  alternative: സാന്നിധ്യം; ആഗമനം
  rationale: ഭാവിയെ ഉദ്ദേശിച്ചുള്ള ശിഷ്യന്മാരുടെ ചോദ്യത്തിൽ ‘വരവ്’ വ്യക്തമാണ്; എന്നാൽ ഗ്രീക്ക് പദത്തിന്റെ യഥാർഥമായ മറ്റു അർഥസാധ്യതകൾ അടിക്കുറിപ്പിലൂടെ നിലനിർത്തുന്നു.
- issue: συντελείας τοῦ αἰῶνος എന്ന പ്രയോഗത്തിന്റെ വിവർത്തനം
  choice: യുഗസമാപ്തി
  alternative: യുഗത്തിന്റെ അവസാനം; ലോകാവസാനം
  rationale: ഗ്രീക്ക് വാചകം ഭൗതിക ലോകത്തെക്കാൾ ഒരു യുഗത്തിന്റെ പൂർത്തീകരണത്തെയാണ് നേരിട്ട് സൂചിപ്പിക്കുന്നത്. പരമ്പരാഗതമായ ‘ലോകാവസാനം’ പാഠത്തിൽ ഇറക്കുമതി ചെയ്യാതെ അടിക്കുറിപ്പിൽ പരാമർശിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ബൈബിൾ ഗദ്യം. ‘അങ്ങയുടെ’ എന്ന ആദരസൂചക രൂപം നേരിട്ടുള്ള അഭിസംബോധനയിൽ ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ രണ്ട് ചോദ്യഘടകങ്ങളും വേർതിരിച്ച് വ്യക്തമായി നൽകി; യഥാർഥമായ ശബ്ദാർഥവൈകല്യങ്ങൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
