id: MAT.24.9
reference: Matthew 24:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τότε παραδώσουσιν ὑμᾶς εἰς θλῖψιν καὶ ἀποκτενοῦσιν ὑμᾶς, καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων τῶν ἐθνῶν διὰ τὸ ὄνομά μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/009.yaml
  text: Then they will hand you over to affliction and kill you[c][b][a], and you will be hated by all the nations because of my name.
translation:
  language: ml
  text: അപ്പോൾ അവർ നിങ്ങളെ കഷ്ടതയ്ക്ക്[a] ഏൽപ്പിക്കുകയും നിങ്ങളെ കൊല്ലുകയും ചെയ്യും; എന്റെ നാമം നിമിത്തം[c] എല്ലാ ജനതകളാലും[b] നിങ്ങൾ വെറുക്കപ്പെടും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കഷ്ടതയ്ക്ക്’ എന്നതിന് ‘പീഡനത്തിന്’ അല്ലെങ്കിൽ ‘ഞെരുക്കത്തിലേക്ക്’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കുപദത്തിന് ദുരിതം, അടിച്ചമർത്തൽ, കഠിന ഞെരുക്കം എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: ‘എല്ലാ ജനതകളാലും’ എന്നതിന് ‘സകല ജാതികളാലും’ എന്നും പരിഭാഷപ്പെടുത്താം; ഈ സന്ദർഭത്തിൽ സാധ്യത കുറവാണെങ്കിലും ‘എല്ലാ വിജാതീയരാലും’ എന്ന അർഥവും ഗ്രീക്കുപദത്തിനുണ്ട്.
    reason: lexical_alternative
  - marker: c
    text: 'അക്ഷരാർഥം: ‘എന്റെ നാമം നിമിത്തം.’ അതായത്, യേശുവിനോടുള്ള കൂറും അവന്റെ നാമം പ്രതിനിധാനം ചെയ്യുന്ന കാര്യങ്ങളും നിമിത്തം.'
    reason: explanatory
lexical_decisions:
- source_word: Τότε
  choice: അപ്പോൾ
  rationale: യേശുവിന്റെ പ്രഭാഷണത്തിലെ സംഭവക്രമം സൂചിപ്പിക്കുന്ന കാലവാചകത്തെ ചുരുക്കമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: παραδώσουσιν ὑμᾶς
  choice: അവർ നിങ്ങളെ … ഏൽപ്പിക്കും
  rationale: മറ്റൊരാളുടെ അധികാരത്തിലേക്കോ നിയന്ത്രണത്തിലേക്കോ കൈമാറുക എന്ന ശത്രുതാപരമായ അർഥം നൽകുന്നു; ‘ഒറ്റിക്കൊടുക്കും’ എന്നു പറഞ്ഞ് വഞ്ചന എന്ന ആശയം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: εἰς θλῖψιν
  choice: കഷ്ടതയ്ക്ക്
  rationale: θλῖψις സൂചിപ്പിക്കുന്ന കഷ്ടത, ഞെരുക്കം, പീഡനം എന്നീ അർഥവ്യാപ്തി ഒരു പരിധിവരെ തുറന്നുവെക്കുന്നു; ഒരു പ്രത്യേക അന്ത്യകാല സാങ്കേതികപദമായി മാത്രം ചുരുക്കുന്നില്ല.
- source_word: ἀποκτενοῦσιν ὑμᾶς
  choice: നിങ്ങളെ കൊല്ലുകയും ചെയ്യും
  rationale: ഭാവികാല ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നൽകുന്നു; ‘വധിക്കും’ എന്നതിനെക്കാൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: ἔσεσθε μισούμενοι
  choice: നിങ്ങൾ വെറുക്കപ്പെടും
  rationale: ഗ്രീക്കിലെ ഭാവികാല കർമണിപ്രയോഗം മലയാളത്തിലും നിലനിർത്തുന്നു.
- source_word: ὑπὸ πάντων τῶν ἐθνῶν
  choice: എല്ലാ ജനതകളാലും
  rationale: ἔθνη എന്നതിന് ഇവിടെ ആഗോള വ്യാപ്തിയുള്ള ‘ജനതകൾ’ യോജിക്കുന്നു; സന്ദർഭം നിർബന്ധിക്കാത്ത യഹൂദർ–ജാതികൾ എന്ന വംശീയ വേർതിരിവ് ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: διὰ τὸ ὄνομά μου
  choice: എന്റെ നാമം നിമിത്തം
  rationale: διά + accusative സൂചിപ്പിക്കുന്ന കാരണം വ്യക്തമാക്കുകയും ‘നാമം’ എന്ന ബൈബിൾ ആശയം പരാവർത്തനം ചെയ്ത് ഇല്ലാതാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: അന്ത്യകാല പ്രഭാഷണത്തിൽ θλῖψις എന്ന പദത്തിന്റെ അർഥം
  choice: കഷ്ടത
  alternative: പീഡനം; മഹാകഷ്ടം; ഞെരുക്കം
  rationale: ഈ സന്ദർഭത്തിലെ പീഡനവും ദുരിതവും ഉൾക്കൊള്ളുന്ന അർഥം നൽകുന്നു; എന്നാൽ ഒരു പ്രത്യേക അന്ത്യകാല വ്യവസ്ഥയുടെ സാങ്കേതികപദമായി വാക്യത്തെ നിർണയിക്കുന്നില്ല.
- issue: ἔθνη എന്ന പദത്തിന്റെ പരിധി
  choice: ജനതകൾ
  alternative: ജാതികൾ; വിജാതീയർ
  rationale: ‘എല്ലാ ജനതകളും’ എന്ന ആഗോള എതിർപ്പാണ് ഇവിടെ കൂടുതൽ സ്വാഭാവികം; ‘വിജാതീയർ’ എന്നു പരിഭാഷപ്പെടുത്തി യഹൂദർ–യഹൂദേതരർ എന്ന വൈരുധ്യം അനാവശ്യമായി ഉറപ്പിക്കുന്നില്ല.
- issue: ‘എന്റെ നാമം നിമിത്തം’ എന്ന പ്രയോഗം
  choice: രൂപകം അതേപടി നിലനിർത്തി
  alternative: എന്നിലുള്ള വിശ്വാസം നിമിത്തം; എന്നോടുള്ള കൂറ് നിമിത്തം
  rationale: യേശുവിനോടുള്ള ബന്ധവും അവന്റെ നാമം പ്രതിനിധാനം ചെയ്യുന്നതും ഇതിൽ ഉൾപ്പെടുന്നു; എന്നാൽ മൂലപാഠത്തിലെ സമ്പന്നമായ ‘നാമം’ എന്ന ആശയം ഒരൊറ്റ വ്യാഖ്യാനമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന ശൈലി. ‘ഏൽപ്പിക്കും’, ‘നാമം നിമിത്തം’, കർമണിപ്രയോഗമായ ‘വെറുക്കപ്പെടും’ എന്നിവ മൂലപാഠത്തിന്റെ ഘടനയും ബൈബിൾ പ്രയോഗത്തിന്റെ ഭാവവും സംരക്ഷിക്കുന്നു.
