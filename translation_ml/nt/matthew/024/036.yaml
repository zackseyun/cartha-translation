  text: Περὶ δὲ τῆς ἡμέρας ἐκείνης καὶ ὥρας οὐδεὶς οἶδεν, οὐδὲ οἱ ἄγγελοι τῶν οὐρανῶν ⸂οὐδὲ ὁ υἱός⸃, εἰ μὴ ὁ ⸀πατὴρ μόνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/036.yaml
  text: But concerning that day and hour[a], no one knows—not even the angels of heaven, nor the Son—except the Father alone.
translation:
  language: ml
  text: എന്നാൽ ആ ദിവസത്തെയും മണിക്കൂറിനെയും കുറിച്ച് ആരും അറിയുന്നില്ല—സ്വർഗത്തിലെ ദൂതന്മാർപോലും, പുത്രനും[a] അറിയുന്നില്ല; പിതാവ് മാത്രം അറിയുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘പുത്രനും’ എന്ന വാക്കുകൾ ഇല്ല. മുഖ്യവാചകം SBLGNT-യിലെ പാഠം പിന്തുടരുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: Περὶ δὲ
  choice: എന്നാൽ … കുറിച്ച്
  rationale: περί + ജനിറ്റീവ് വിഷയം അവതരിപ്പിക്കുന്നതിനാൽ ‘കുറിച്ച്’ എന്നു പരിഭാഷപ്പെടുത്തി; δέ സൂചിപ്പിക്കുന്ന നേരിയ മാറ്റമോ വൈരുധ്യമോ ‘എന്നാൽ’ നിലനിർത്തുന്നു.
- source_word: τῆς ἡμέρας ἐκείνης καὶ ὥρας
  choice: ആ ദിവസത്തെയും മണിക്കൂറിനെയും
  rationale: ഒരൊറ്റ ἐκείνης ഏകോപിതമായ മുഴുവൻ പദസമുച്ചയത്തെയും വിശേഷിപ്പിക്കുന്നു. മലയാളത്തിലെ സ്വാഭാവിക ഏകോപനത്തിനായി ‘-ത്തെയും … -നെയും’ ഉപയോഗിച്ചു.
- source_word: οὐδεὶς οἶδεν
  choice: ആരും അറിയുന്നില്ല
  rationale: οὐδείς-ന്റെ സാർവത്രിക നിഷേധവും οἶδα-യുടെ വർത്തമാനാർഥമായ ‘അറിയുക’ എന്നതും വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: οὐδὲ οἱ ἄγγελοι τῶν οὐρανῶν
  choice: സ്വർഗത്തിലെ ദൂതന്മാർപോലും … അറിയുന്നില്ല
  rationale: οὐδέ-യുടെ ഊന്നൽ ‘പോലും’ വഴി പ്രകടമാക്കുന്നു; τῶν οὐρανῶν മലയാളത്തിൽ സ്വാഭാവികമായി ‘സ്വർഗത്തിലെ’ എന്നു നൽകി.
- source_word: οὐδὲ ὁ υἱός
  choice: പുത്രനും … അറിയുന്നില്ല
  rationale: മുമ്പത്തെ നിഷേധത്തോടുള്ള ഏകോപനം ‘-ഉം … അറിയുന്നില്ല’ എന്ന ഘടനയിൽ നിലനിർത്തുന്നു. ആർട്ടിക്കിളോടുകൂടിയ υἱός അംഗീകൃത പദവിയായതിനാൽ ‘പുത്രൻ’ എന്നു നൽകി; വാചകത്തിലെ ക്രിസ്തുശാസ്ത്രപരമായ സംഘർഷം മയപ്പെടുത്തിയിട്ടില്ല.
- source_word: εἰ μὴ
  choice: … മാത്രം
  rationale: നിഷേധവാക്യത്തിനു ശേഷമുള്ള εἰ μή ഇവിടെ വ്യവസ്ഥയല്ല, ഒഴിവാക്കൽ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ ‘പിതാവ് മാത്രം അറിയുന്നു’ എന്ന ഘടന അതേ അർഥം നൽകുന്നു.
- source_word: ὁ πατὴρ μόνος
  choice: പിതാവ് മാത്രം അറിയുന്നു
  rationale: μόνος അറിവ് പിതാവിൽ മാത്രമായി പരിമിതപ്പെടുത്തുന്നു. വ്യക്തതയ്ക്കും മലയാളത്തിന്റെ സ്വാഭാവികതയ്ക്കുമായി ഗ്രീക്കിൽ മുൻപേ വന്ന ‘അറിയുന്നു’ എന്ന ക്രിയ ഇവിടെ ആവർത്തിച്ചു.
theological_decisions:
- issue: ‘പുത്രനും അറിയുന്നില്ല’ എന്നതിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ സൂചന
  choice: SBLGNT-യിലെ οὐδὲ ὁ υἱός മുഖ്യവാചകത്തിൽ ‘പുത്രനും അറിയുന്നില്ല’ എന്നു പൂർണമായി നിലനിർത്തി.
  alternative: ചില കൈയെഴുത്തുപ്രതികൾ ഈ വാക്കുകൾ ഒഴിവാക്കുന്നു; പ്രത്യക്ഷമായ ദൈവശാസ്ത്രപരമായ സംഘർഷം കുറയ്ക്കാൻ ചില വ്യാഖ്യാനപരമായ പരിഭാഷകൾ അവയെ മയപ്പെടുത്താം.
  rationale: നൽകപ്പെട്ട ഗ്രീക്ക് പാഠത്തിൽ ഈ വാക്കുകൾ ഉള്ളതിനാൽ അവ ഒഴിവാക്കുകയോ വിശദീകരണപരമായി ദുർബലപ്പെടുത്തുകയോ ചെയ്തിട്ടില്ല. ദൈവശാസ്ത്രപരമായ സമന്വയം പരിഭാഷയിൽ അടിച്ചേൽപ്പിക്കാതെ വാചകത്തിലെ യഥാർഥ സംഘർഷം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ നിഷേധങ്ങളുടെ ക്രമവും ഊന്നലും നിലനിർത്തിക്കൊണ്ട്, മലയാളത്തിൽ അസ്വാഭാവികമായ ‘ഒഴികെ’ ഘടന ഒഴിവാക്കി അവസാന ഉപവാക്യത്തിൽ ‘അറിയുന്നു’ ആവർത്തിച്ചു. പാഠഭേദക്കുറിപ്പിന്റെ അടയാളം വ്യത്യാസമുള്ള ‘പുത്രനും’ എന്ന വാക്കിനോടു നേരിട്ട് ചേർത്തു.
