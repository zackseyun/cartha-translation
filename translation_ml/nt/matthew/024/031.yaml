language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀποστελεῖ τοὺς ἀγγέλους αὐτοῦ μετὰ ⸀σάλπιγγος μεγάλης, καὶ ἐπισυνάξουσιν τοὺς ἐκλεκτοὺς αὐτοῦ ἐκ τῶν τεσσάρων ἀνέμων ἀπ’ ἄκρων οὐρανῶν ἕως ⸀τῶν ἄκρων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/031.yaml
  text: And he will send out his angels with a loud trumpet[a], and they will gather his chosen ones from the four winds[d][c][b], from one end of the heavens to the other.
translation:
  language: ml
  text: അവൻ ഉച്ചത്തിലുള്ള കാഹളനാദത്തോടുകൂടെ[a] തന്റെ ദൂതന്മാരെ അയയ്ക്കും. അവർ നാലു കാറ്റുകളിൽനിന്ന്[c], ആകാശങ്ങളുടെ ഒരറ്റംമുതൽ മറ്റേ അറ്റംവരെ[d], അവന്റെ തിരഞ്ഞെടുക്കപ്പെട്ടവരെ[b] ഒരുമിച്ചുകൂട്ടും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “വലിയ കാഹളത്തോടുകൂടെ” അല്ലെങ്കിൽ “കാഹളനാദത്തോടുകൂടെ.”'
    reason: lexical_alternative
  - marker: b
    text: “തിരഞ്ഞെടുക്കപ്പെട്ടവർ” എന്നതിന് പരമ്പരാഗതമായി “വൃതന്മാർ” എന്നും പറയാറുണ്ട്.
    reason: lexical_alternative
  - marker: c
    text: “നാലു കാറ്റുകൾ” എന്നത് എല്ലാ ദിക്കുകളിലുമുള്ള അതിദൂരപ്രദേശങ്ങളെ സൂചിപ്പിക്കുന്ന ഒരു പ്രയോഗമാണ്.
    reason: cultural_note
  - marker: d
    text: 'ഗ്രീക്ക് പദശഃ: “ആകാശങ്ങളുടെ അറ്റങ്ങളിൽനിന്ന് അവയുടെ അറ്റങ്ങൾവരെ”; അതായത്, ഒരറ്റംമുതൽ മറ്റേ അറ്റംവരെ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστελεῖ
  choice: അയയ്ക്കും
  rationale: ഭാവികാല സജീവരൂപത്തിന്റെ നേരായ അർഥം നൽകുന്നു; സന്ദർഭത്തിൽ ദൂതന്മാരെ നിയോഗിച്ചയയ്ക്കുന്നതാണ് ഉദ്ദേശ്യം.
- source_word: ἀγγέλους
  choice: ദൂതന്മാർ
  rationale: ഈ അന്ത്യകാലസന്ദർഭത്തിൽ മനുഷ്യസന്ദേശവാഹകരല്ല, സ്വർഗീയ ദൂതന്മാരാണ് ഉദ്ദേശിക്കപ്പെടുന്നത്.
- source_word: μετὰ σάλπιγγος μεγάλης
  choice: ഉച്ചത്തിലുള്ള കാഹളനാദത്തോടുകൂടെ
  rationale: μετά ഇവിടെ അനുഗമനത്തെ സൂചിപ്പിക്കുന്നു. σάλπιγξ എന്ന കാഹളത്തിന്റെ ദൃശ്യബിംബവും μεγάλη സൂചിപ്പിക്കുന്ന ശക്തമായ ശബ്ദവും സ്വാഭാവിക മലയാളത്തിൽ ചേർത്തു നൽകുന്നു; പദശഃ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἐπισυνάξουσιν
  choice: ഒരുമിച്ചുകൂട്ടും
  rationale: ചിതറിക്കിടക്കുന്നവരെ ഒരു കൂട്ടമായി ചേർക്കുക എന്ന സംയുക്തക്രിയയുടെ ശക്തി വ്യക്തമായി നൽകുന്നു; കർത്താവ് ദൂതന്മാരാണ്.
- source_word: ἐκλεκτούς
  choice: തിരഞ്ഞെടുക്കപ്പെട്ടവർ
  rationale: ദൈവം തിരഞ്ഞെടുത്തവർ എന്ന മൂലപദത്തിന്റെ അർഥം, പിന്നീടുള്ള സിദ്ധാന്തസംവിധാനങ്ങളെ വാക്യത്തിലേക്ക് ഇറക്കാതെ, ആധുനികവും വ്യക്തവുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: ἐκ τῶν τεσσάρων ἀνέμων
  choice: നാലു കാറ്റുകളിൽനിന്ന്
  rationale: എല്ലാ ദിക്കുകളിലുമുള്ള അതിദൂരപ്രദേശങ്ങളെ സൂചിപ്പിക്കുന്ന ബൈബിൾ ദൃശ്യബിംബം വ്യാഖ്യാനപരമായി ‘നാലു ദിക്കുകൾ’ എന്നു മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: ἀπ’ ἄκρων οὐρανῶν ἕως τῶν ἄκρων αὐτῶν
  choice: ആകാശങ്ങളുടെ ഒരറ്റംമുതൽ മറ്റേ അറ്റംവരെ
  rationale: മുഴുവൻ വ്യാപ്തിയെയും സൂചിപ്പിക്കുന്ന പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും οὐρανῶν എന്ന ബഹുവചനം ‘ആകാശങ്ങൾ’ ആയി നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: അന്ത്യകാലസന്ദർഭത്തിൽ ἐκλεκτούς എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: തിരഞ്ഞെടുക്കപ്പെട്ടവർ
  alternative: വൃതർ
  rationale: ആരാണ് തിരഞ്ഞെടുക്കപ്പെട്ടവർ എന്നതിനെക്കുറിച്ചുള്ള ഒരു പ്രത്യേക സമ്പ്രദായത്തിന്റെ വിശദീകരണം ഈ വാക്യം നൽകുന്നില്ല. അതിനാൽ അടിസ്ഥാന പദാർഥം വ്യക്തമായി നിലനിർത്തുകയും പരമ്പരാഗത പദം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
- issue: ഒരുമിച്ചുകൂട്ടലിന്റെ വ്യാപ്തി
  choice: നാലു കാറ്റുകളിൽനിന്ന്, ആകാശങ്ങളുടെ ഒരറ്റംമുതൽ മറ്റേ അറ്റംവരെ
  alternative: എല്ലാ ദിക്കുകളിൽനിന്നും
  rationale: മൂലപാഠത്തിലെ വിശാലമായ പ്രപഞ്ചദൃശ്യവും പ്രയോഗപരമായ സംഘർഷവും ചുരുക്കി ഭൂമിശാസ്ത്രപരമായ വ്യാഖ്യാനമാക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ദൂതന്മാർ’, ‘കാഹളം’, ‘നാലു കാറ്റുകൾ’, ‘ആകാശങ്ങൾ’ എന്നീ ബൈബിൾ ദൃശ്യപദങ്ങൾ നിലനിർത്തി; ദുഷ്കരമായ പരമ്പരാഗത പദമായ ‘വൃതർ’ മുഖ്യപാഠത്തിനു പകരം അടിക്കുറിപ്പിൽ മാത്രം നൽകി.
