  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὥσπερ ⸀γὰρ αἱ ἡμέραι τοῦ Νῶε, οὕτως ⸀ἔσται ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/037.yaml
  text: For just as the days of Noah were[a], so the coming of the Son of Man will be.
translation:
  language: ml
  text: എന്തെന്നാൽ, നോഹയുടെ കാലം എങ്ങനെയായിരുന്നുവോ, അതുപോലെതന്നെ മനുഷ്യപുത്രന്റെ വരവും[a] ആയിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സാന്നിധ്യം.” ഗ്രീക്കുപദത്തിന് “സാന്നിധ്യം” എന്നോ “ആഗമനം” എന്നോ അർത്ഥമാകാം; ഇവിടെ അത് മനുഷ്യപുത്രന്റെ ഭാവിയിലെ വരവിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ ... οὕτως
  choice: എങ്ങനെയായിരുന്നുവോ, അതുപോലെതന്നെ
  rationale: ഗ്രീക്കിലെ പരസ്പരബന്ധമുള്ള താരതമ്യഘടന സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: γὰρ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയില്ല
  rationale: ഇത് മുൻവാക്യത്തെ വിശദീകരിക്കുന്ന ബന്ധകമാണ്. ഒറ്റവാക്യമായി വായിക്കുമ്പോൾ മലയാളത്തിൽ ‘എന്തെന്നാൽ’ ചേർക്കുന്നത് കൃത്രിമമാകാം; താരതമ്യഘടന തന്നെ വിശദീകരണബന്ധം സൂചിപ്പിക്കുന്നു.
- source_word: αἱ ἡμέραι τοῦ Νῶε
  choice: നോഹയുടെ കാലം
  rationale: അക്ഷരാർഥത്തിലെ ‘നോഹയുടെ ദിവസങ്ങൾ’ എന്നതിനെക്കാൾ ആ കാലഘട്ടത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക ആധുനിക മലയാളപ്രയോഗം.
- source_word: Νῶε
  choice: നോഹ
  rationale: മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ സ്ഥിരപ്പെട്ട വ്യക്തിനാമരൂപം.
- source_word: ἔσται
  choice: ആയിരിക്കും
  rationale: εἰμί എന്ന ക്രിയയുടെ ഭാവികാലാർത്ഥം ലളിതമായും കൃത്യമായും നൽകുന്നു; ആദ്യ ഉപവാക്യത്തിലെ ഒഴിവാക്കിയിരിക്കുന്ന ക്രിയയും മലയാള താരതമ്യരൂപത്തിൽ സ്വാഭാവികമായി പൂർത്തിയാക്കുന്നു.
- source_word: παρουσία
  choice: വരവ്
  rationale: ഈ അന്ത്യകാലസന്ദർഭത്തിൽ ഭാവിയിലെ ആഗമനത്തെ സ്വാഭാവികമായി അറിയിക്കുന്നു; ‘സാന്നിധ്യം’ എന്ന സാധ്യമായ അർത്ഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: ദാനിയേൽസംബന്ധിയായ പ്രതിധ്വനിയും യേശുവിന്റെ സ്ഥിരപ്പെട്ട സ്വയംവിശേഷണത്തിന്റെ ദൈവശാസ്ത്രഭാരവും സംരക്ഷിക്കുന്ന മലയാളരൂപം.
theological_decisions:
- issue: അന്ത്യകാലവചനത്തിലെ παρουσία എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: വരവ്
  alternative: സാന്നിധ്യം; ആഗമനം
  rationale: സന്ദർഭം മനുഷ്യപുത്രന്റെ ഭാവിയിലെ പ്രത്യക്ഷാഗമനത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘വരവ്’ വ്യക്തവും സ്വാഭാവികവുമാണ്. എങ്കിലും പദത്തിന്റെ വിശാലമായ അർത്ഥപരിധി മറയ്ക്കാതിരിക്കാൻ ‘സാന്നിധ്യം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നോഹയുടെ കാലം’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്; ‘മനുഷ്യപുത്രൻ’ സ്ഥാപിതമായ ബൈബിൾ ശീർഷകമായി നിലനിർത്തുന്നു.
