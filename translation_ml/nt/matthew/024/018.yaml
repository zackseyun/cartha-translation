id: MAT.24.18
reference: Matthew 24:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὁ ἐν τῷ ἀγρῷ μὴ ἐπιστρεψάτω ὀπίσω ἆραι ⸂τὸ ἱμάτιον⸃ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/018.yaml
  text: And let the one in the field not turn back to take his cloak[a].
translation:
  language: ml
  text: വയലിലുള്ളയാൾ തന്റെ മേലങ്കി[a] എടുക്കാൻ തിരിച്ചുപോകരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വസ്ത്രം’ അല്ലെങ്കിൽ ‘പുറവസ്ത്രം’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἐν τῷ ἀγρῷ
  choice: വയലിലുള്ളവൻ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ പദസമുച്ചയം വയലിൽ ഉള്ള ഒരാളെ പ്രതിനിധാനപരമായ ഏകവചനത്തിൽ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ഈ രൂപം സ്വാഭാവികമായി പൊതുവായ അർഥം നൽകുന്നു; പുരുഷന്മാരിലേക്കു മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: μὴ ἐπιστρεψάτω ὀπίσω
  choice: പിന്നിലേക്കു മടങ്ങരുത്
  rationale: μή ചേർന്ന അയോറിസ്റ്റ് ആജ്ഞാരൂപത്തിന്റെ അടിയന്തരമായ വിലക്ക് നിലനിർത്തുന്നു. ὀπίσω ഇവിടെ ἐπιστρέφωയോടൊപ്പം മുൻസ്ഥലത്തേക്കു തിരികെ പോകുക എന്ന അർഥത്തിലാണ്.
- source_word: ἆραι
  choice: എടുക്കാൻ
  rationale: 'ചലനക്രിയയ്ക്കു പിന്നാലെയുള്ള അയോറിസ്റ്റ് ഇൻഫിനിറ്റീവ് ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു: മേലങ്കി എടുക്കുന്നതിനായി മടങ്ങുക.'
- source_word: τὸ ἱμάτιον αὐτοῦ
  choice: തന്റെ മേലങ്കി
  rationale: ἱμάτιον സാധാരണയായി പുറമേ ധരിക്കുന്ന വസ്ത്രത്തെയോ മേലങ്കിയെയോ സൂചിപ്പിക്കുന്നു. കർത്താവിലേക്കുള്ള പ്രതിബിംബബന്ധം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ αὐτοῦ എന്നത് ‘തന്റെ’ എന്നു പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: സബ്സ്റ്റാന്റീവായ പുൽലിംഗ ആർട്ടിക്കിളിന്റെ ലിംഗപ്രതിനിധാനം
  choice: വയലിലുള്ളവൻ
  alternative: വയലിലുള്ള പുരുഷൻ
  rationale: ഗ്രീക്കിൽ രൂപം വ്യാകരണപരമായി പുൽലിംഗമാണെങ്കിലും ഈ മുന്നറിയിപ്പിൽ അത് പ്രതിനിധാനപരവും പൊതുവായതുമാണ്. മലയാളത്തിലെ ‘വയലിലുള്ളവൻ’ ഏകവചനസ്വഭാവം നിലനിർത്തുകയും പുരുഷന്മാർക്കു മാത്രമായി പരാമർശം ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആജ്ഞാഭാഷ ഉപയോഗിച്ചു. അടിയന്തരതയ്ക്കായി ചുരുക്കമുള്ള വാക്യഘടനയും മൂലത്തിലെ വാക്കുകളുടെ ക്രമത്തോട് അടുത്ത വിന്യാസവും നിലനിർത്തി.
