review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the prohibition, the person located in the field, the purposive infinitive ('to take'), and ἱμάτιον as an outer garment. ‘പിന്നിലേക്കു മടങ്ങരുത്’ is understandable, but ‘തിരിച്ചുപോകരുത്’ more idiomatically expresses ἐπιστρέψαι ὀπίσω (‘go/turn back’) in this context.
  naturalness: ‘വയലിലുള്ളവൻ’ is comprehensible, but ‘വയലിലുള്ളയാൾ’ is a more natural modern-standard, gender-inclusive singular expression. ‘തിരിച്ചുപോകരുത്’ is more idiomatic Malayalam than the spatially literal ‘പിന്നിലേക്കു മടങ്ങരുത്.’
  terminology: ‘മേലങ്കി’ is a suitable contextual rendering of ἱμάτιον. The footnote’s ‘പുറങ്കുപ്പായം’ can suggest a shirt and is less precise than ‘പുറവസ്ത്രം’ for an outer garment/cloak.
  issues:
  - severity: low
    issue: The wording ‘പിന്നിലേക്കു മടങ്ങരുത്’ is overly spatial/literal.
    rationale: With ἐπιστρεψάτω ὀπίσω, the Greek idiom prohibits returning to the prior place. ‘തിരിച്ചുപോകരുത്’ conveys this naturally without altering the urgency or purpose clause.
  - severity: low
    issue: The footnote uses ‘പുറങ്കുപ്പായം’ for an outer garment.
    rationale: ‘കുപ്പായം’ commonly denotes a shirt; ‘പുറവസ്ത്രം’ more accurately preserves the lexical range of ἱμάτιον.
  revised_text: വയലിലുള്ളയാൾ തന്റെ മേലങ്കി[a] എടുക്കാൻ തിരിച്ചുപോകരുത്.
  revised_footnotes:
