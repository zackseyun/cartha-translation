  text: But the one who endures to the end will be saved[a][b].
translation:
  language: ml
  text: എന്നാൽ അവസാനത്തോളം സഹിച്ചുനിൽക്കുന്നവൻ രക്ഷിക്കപ്പെടും[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘അവസാനംവരെ.’'
    reason: lexical_alternative
  - marker: b
    text: 'അല്ലെങ്കിൽ: ‘വിടുവിക്കപ്പെടും.’ ഗ്രീക്ക് പദത്തിന് വിടുതൽ എന്നും രക്ഷ എന്നും അർഥമാകാം; സന്ദർഭം അർഥത്തെ ഒന്നിലേക്കു മാത്രം ചുരുക്കേണ്ടതില്ലാത്തതിനാൽ മുഖ്യപാഠത്തിൽ വിശാലമായ പ്രയോഗം നിലനിർത്തിയിരിക്കുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ... ὑπομείνας
  choice: സഹിച്ചുനിൽക്കുന്നവൻ
  rationale: നിശ്ചയാർഥകപദത്തോടുകൂടിയ കൃതന്തം ഒരാളെ സൂചിപ്പിക്കുന്ന നാമപ്രയോഗമാണ്. ലിംഗം അനാവശ്യമായി മുൻനിർത്താതെ, പരീക്ഷകളിൽ ഉറച്ചുനിൽക്കുന്ന വ്യക്തിയെ സ്വാഭാവിക മലയാളത്തിൽ ഈ രൂപം വ്യക്തമാക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യങ്ങളിലെ വീഴ്ചയുടെയും വഞ്ചനയുടെയും മുന്നറിയിപ്പുകളോട് ഇവിടെ നേരിയ വൈരുധ്യം സൂചിപ്പിക്കുന്നു.
- source_word: ὑπομείνας (ὑπομένω)
  choice: സഹിച്ചുനിൽക്കുന്ന
  rationale: കഷ്ടതയുടെയോ സമ്മർദത്തിന്റെയോ കീഴിൽ പിന്മാറാതെ നിലകൊള്ളുക എന്ന ആശയം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: εἰς τέλος
  choice: അവസാനത്തോളം
  rationale: ഒരു അന്തിമബിന്ദുവരെ തുടർന്നുനിൽക്കുക എന്ന അർഥം മലയാളത്തിൽ സംക്ഷിപ്തമായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: οὗτος
  choice: -വൻ (സഹിച്ചുനിൽക്കുന്നവൻ)
  rationale: ഗ്രീക്കിലെ പുനരുക്തമായ ഊന്നൽ മലയാളത്തിലെ നാമീകൃത ബന്ധവാക്യഘടനയിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു; വേറിട്ട് ‘അവൻ തന്നെയാണ്’ എന്നു ചേർത്താൽ അനാവശ്യമായി ഭാരമുള്ളതാകും.
- source_word: σωθήσεται
  choice: രക്ഷിക്കപ്പെടും
  rationale: ഭാവികാല കർമണി രൂപവും ‘രക്ഷിക്കുക/വിടുവിക്കുക’ എന്ന വിശാല അർഥപരിധിയും നിലനിർത്തുന്നു; സന്ദർഭം അനുവദിക്കുന്നതിലധികം അർഥം ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: അവസാനംവരെ സഹിച്ചുനിൽക്കുന്ന സാഹചര്യത്തിൽ ‘രക്ഷിക്കപ്പെടും’ എന്നതിന്റെ വ്യാപ്തി
  choice: ‘രക്ഷിക്കപ്പെടും’ എന്ന വിശാല പ്രയോഗം നിലനിർത്തി.
  alternative: ‘വിടുവിക്കപ്പെടും’ എന്നും, ‘അന്തിമരക്ഷ പ്രാപിക്കും’ എന്നും വ്യാഖ്യാനിക്കാം.
  rationale: ഇത് മഹാകഷ്ടത്തിൽനിന്നുള്ള വിടുതലിനെയോ അന്തിമമായ രക്ഷയെയോ രണ്ടിനെയുമോ സൂചിപ്പിക്കുന്നുവെന്ന് വാക്യം തന്നെ കൃത്യമായി നിർണയിക്കുന്നില്ല. അതിനാൽ ദൈവശാസ്ത്രപരമായ ഈ തുറന്ന നില പരിഭാഷയിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, മാന്യവും സംക്ഷിപ്തവുമായ ശൈലി. ‘സഹിച്ചുനിൽക്കുക’ പരീക്ഷകളിൽ സ്ഥിരതയോടെ നിലകൊള്ളുന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു; ‘രക്ഷിക്കപ്പെടും’ എന്നത് ഉദ്ദേശപൂർവം വിശാലമായി സൂക്ഷിച്ചിരിക്കുന്നു.
