  naturalness: വാക്യം സംക്ഷിപ്തവും ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവുമാണ്. ‘അവസാനത്തോളം’യും ‘സഹിച്ചുനിൽക്കുന്നവൻ’യും ഈ സന്ദർഭത്തിൽ വ്യക്തവും മാന്യമായ രജിസ്റ്ററിലുള്ളതുമാണ്. οὗτος-ന്റെ പുനരുക്ത ഊന്നൽ പ്രത്യേകം ചേർക്കാതിരിക്കുന്നത് മലയാളശൈലിക്ക് യോജിക്കുന്നു; അർഥനഷ്ടമുണ്ടാക്കുന്നില്ല.
