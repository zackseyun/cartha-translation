id: MAT.24.10
reference: Matthew 24:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ τότε σκανδαλισθήσονται πολλοὶ καὶ ἀλλήλους παραδώσουσιν καὶ μισήσουσιν ἀλλήλους·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/010.yaml
  text: And then many will fall away[b][a], and they will betray one another and hate one another.
translation:
  language: ml
  text: അപ്പോൾ പലരും വിശ്വാസത്തിൽനിന്ന് പിന്മാറും[a]; അവർ പരസ്പരം ഒറ്റിക്കൊടുക്കുകയും[b] പരസ്പരം വെറുക്കുകയും ചെയ്യും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ഇടറിപ്പോകും’ അഥവാ ‘മനസ്സിടറും.’
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘പരസ്പരം കൈമാറിക്കൊടുക്കും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: അപ്പോൾ
  rationale: യേശുവിന്റെ പ്രഭാഷണത്തിലെ സംഭവക്രമം സൂചിപ്പിക്കുന്ന കാലവാചകമായി സ്വാഭാവികവും കൃത്യവുമായ പ്രയോഗം.
- source_word: σκανδαλισθήσονται
  choice: വിശ്വാസത്തിൽനിന്ന് പിന്മാറും
  rationale: പീഡനത്തിന്റെ പശ്ചാത്തലത്തിൽ വെറും മനോവിഷമത്തേക്കാൾ ഗൗരവമുള്ള പതനമോ കൂറുമാറ്റമോ ആണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്. എന്നാൽ ഗ്രീക്ക് പദത്തിന്റെ ‘ഇടറുക/വ്രണപ്പെടുക’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: πολλοὶ
  choice: പലരും
  rationale: നാമപദമായി ഉപയോഗിച്ച അളവുസൂചക വിശേഷണത്തിന്റെ നേരിട്ടുള്ള, സ്വാഭാവികമായ പരിഭാഷ.
- source_word: ἀλλήλους
  choice: പരസ്പരം
  rationale: പ്രവൃത്തിയുടെ അന്യോന്യത വ്യക്തമായി പ്രകടിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം; മൂലത്തിലെ ആവർത്തനം രണ്ടിടത്തും നിലനിർത്തി.
- source_word: παραδώσουσιν
  choice: ഒറ്റിക്കൊടുക്കും
  rationale: παραδίδωμι എന്ന പദത്തിന്റെ ‘കൈമാറുക/ഏല്പിച്ചുകൊടുക്കുക’ എന്ന അടിസ്ഥാനാർഥത്തോടൊപ്പം ഈ ശത്രുതാപരമായ സന്ദർഭത്തിലെ വഞ്ചനയും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: μισήσουσιν
  choice: വെറുക്കും
  rationale: സജീവമായ ശത്രുതയെ നേരിട്ട് സൂചിപ്പിക്കുന്ന ലളിതവും കൃത്യവുമായ പരിഭാഷ.
- source_word: καὶ τότε ... καὶ ... καὶ ...
  choice: അപ്പോൾ ...; അവർ ... ചെയ്യുകയും ... ചെയ്യുകയും ചെയ്യും
  rationale: മലയാളത്തിന്റെ സ്വാഭാവിക വാക്യഘടന പാലിക്കുമ്പോഴും സംഭവങ്ങളുടെ ക്രമവും തുടർച്ചയായി കനക്കുന്ന പ്രവൃത്തികളുടെ ഏകോപനവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: അന്ത്യകാല പീഡനത്തിന്റെ പശ്ചാത്തലത്തിൽ σκανδαλισθήσονται എന്നതിന്റെ അർഥം
  choice: വിശ്വാസത്തിൽനിന്ന് പിന്മാറും
  alternative: ഇടറിപ്പോകും; വ്രണപ്പെട്ട് എതിർക്കും
  rationale: തുടർന്ന് വരുന്ന ഒറ്റിക്കൊടുക്കലും വെറുപ്പും പരിഗണിക്കുമ്പോൾ, സമ്മർദത്തിൽ സംഭവിക്കുന്ന ഗൗരവമുള്ള കൂറുമാറ്റമാണ് പ്രധാനമായി ഉദ്ദേശിക്കപ്പെടുന്നത്. ‘വിശ്വാസത്തിൽനിന്ന് പിന്മാറും’ ഈ ഗൗരവം വ്യക്തമാക്കുന്നു; എന്നാൽ പ്രത്യേകമായൊരു മതസിദ്ധാന്തം നിർബന്ധിക്കുന്നില്ല, മറ്റു ശബ്ദാർഥസാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായതും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഒറ്റിക്കൊടുക്കുക’ എന്ന പ്രയോഗം സംസാരഭാഷാസൗകര്യവും സന്ദർഭത്തിലെ വഞ്ചനയുടെ ശക്തിയും ഒരുമിച്ച് നൽകുന്നു; മൂലത്തിലെ ഇരട്ട ἀλλήλους അനുസരിച്ച് ‘പരസ്പരം’ രണ്ടുതവണ നിലനിർത്തിയിരിക്കുന്നു.
