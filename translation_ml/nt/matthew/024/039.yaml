id: MAT.24.39
reference: Matthew 24:39
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ οὐκ ἔγνωσαν ἕως ἦλθεν ὁ κατακλυσμὸς καὶ ἦρεν ἅπαντας, οὕτως ἔσται ⸀καὶ ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/039.yaml
  text: And they did not know until the flood came and swept them all away; so also will be the coming of the Son of Man.
translation:
  language: ml
  text: പ്രളയം വന്ന് എല്ലാവരെയും ഒഴുക്കിക്കൊണ്ടുപോകുന്നതുവരെ അവർ അറിഞ്ഞില്ല. മനുഷ്യപുത്രന്റെ വരവും അങ്ങനെതന്നെയായിരിക്കും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἔγνωσαν
  choice: അവർ അറിഞ്ഞില്ല
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ അർഥം നിലനിർത്തുന്നു; അവർ ഗ്രഹിച്ചില്ല എന്ന വ്യാഖ്യാനം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: ὁ κατακλυσμός
  choice: പ്രളയം
  rationale: നോഹയുടെ കാലത്തെ മഹാപ്രളയത്തെ സൂചിപ്പിക്കുന്ന പതിവും വ്യക്തവുമായ മലയാളപദം.
- source_word: ἦρεν ἅπαντας
  choice: എല്ലാവരെയും ഒഴുക്കിക്കൊണ്ടുപോയി
  rationale: αἴρω എന്നതിന് ഇവിടെ പ്രളയജലം ആളുകളെ നീക്കിക്കൊണ്ടുപോയി എന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു; ന്യായവിധിയുടെ ഫലം മങ്ങിപ്പോകുന്നില്ല.
- source_word: ἡ παρουσία
  choice: വരവ്
  rationale: സന്ദർഭത്തിൽ മനുഷ്യപുത്രന്റെ ഭാവിയിലെ ആഗമനത്തെ സൂചിപ്പിക്കുന്ന വ്യക്തവും വിഭാഗീയഭാരം കുറഞ്ഞതുമായ പരിഭാഷ.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രന്റെ
  rationale: സുവിശേഷങ്ങളിൽ യേശു ഉപയോഗിക്കുന്ന പദവിയുടെ അംഗീകൃതവും ഔപചാരികവുമായ മലയാളരൂപം.
theological_decisions:
- issue: അറിവില്ലായ്മയുടെ സ്വഭാവം
  choice: അവർ അറിഞ്ഞില്ല
  alternative: അവർ തിരിച്ചറിഞ്ഞില്ല / അവർ ശ്രദ്ധിച്ചില്ല
  rationale: മൂലപാഠം അവരുടെ അറിവില്ലായ്മയുടെ കാരണം വ്യക്തമാക്കുന്നില്ല; അതിനാൽ അശ്രദ്ധയോ അവിശ്വാസമോ വിവർത്തനത്തിൽ ചേർത്തിട്ടില്ല.
- issue: പ്രളയം അവരെ കൊണ്ടുപോയതിന്റെ അർഥം
  choice: ഒഴുക്കിക്കൊണ്ടുപോയി
  alternative: എടുത്തുകൊണ്ടുപോയി
  rationale: സന്ദർഭം ന്യായവിധിയിൽ നശിച്ചവരെക്കുറിച്ചാണ്; ‘ഒഴുക്കിക്കൊണ്ടുപോയി’ എന്നത് പ്രളയസന്ദർഭം വ്യക്തമാക്കുന്നു, എന്നാൽ പിന്നീടുള്ള വാക്യങ്ങളിലെ ‘എടുക്കപ്പെടുക’ എന്ന ഭാഷയുമായി അനാവശ്യമായ ദൈവശാസ്ത്രസമീകരണം സൃഷ്ടിക്കുന്നില്ല.
- issue: καί എന്ന പാഠഘടകത്തിന്റെ പ്രതിഫലനം
  choice: അങ്ങനെതന്നെ
  alternative: അതുപോലെതന്നെ കൂടെ
  rationale: οὕτως ... καί എന്ന താരതമ്യഘടനയുടെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ ‘അങ്ങനെതന്നെ’ ഉൾക്കൊള്ളുന്നു; കൃത്രിമമായി ‘കൂടെയും’ ചേർക്കേണ്ടതില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പമുള്ള, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. വാക്യത്തിന്റെ മുന്നറിയിപ്പുസ്വരം സംക്ഷിപ്തമായും നേരിട്ടും സൂക്ഷിച്ചിരിക്കുന്നു.
