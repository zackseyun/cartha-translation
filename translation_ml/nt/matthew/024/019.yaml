lexical_decisions:
- source_word: οὐαί
  choice: അയ്യോ കഷ്ടം!
  rationale: വരാനിരിക്കുന്ന ദുരിതത്തെക്കുറിച്ചുള്ള വിലാപവും ശക്തമായ മുന്നറിയിപ്പും ഒരുമിച്ച് പ്രകടമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിൽനിന്നുള്ള നേരിയ ആശയമാറ്റം സൂചിപ്പിക്കുന്നു; അതിരുകടന്ന വൈരുധ്യം സൃഷ്ടിക്കുന്നില്ല.
- source_word: ταῖς ἐν γαστρὶ ἐχούσαις
  choice: ഗർഭിണികൾക്കും
  rationale: ἐν γαστρὶ ἔχω എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: ταῖς θηλαζούσαις
  choice: മുലയൂട്ടുന്നവർക്കും
  rationale: ഗ്രീക്കിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ലാത്തതിനാൽ അതു കൂട്ടിച്ചേർക്കാതെ, ശിശുവിനു മുലയൂട്ടുന്ന അവസ്ഥയെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: ആ ദിവസങ്ങളിൽ
  rationale: കാലസൂചനയെ നേരിട്ടും സ്വാഭാവികമായും പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: സ്ത്രീലിംഗ ദത്തിവ് രൂപങ്ങളുടെയും കൃദന്തരൂപങ്ങളുടെയും സൂചിതർ
  choice: ഗർഭിണികൾ, മുലയൂട്ടുന്നവർ എന്ന നിലാവസ്ഥകൾകൊണ്ട് സൂചിതരെ അവതരിപ്പിച്ചു.
  alternative: ഗർഭിണികളായ സ്ത്രീകൾ, കുഞ്ഞുങ്ങളെ മുലയൂട്ടുന്ന സ്ത്രീകൾ
  rationale: ഗ്രീക്ക് രൂപങ്ങൾ സ്ത്രീകളെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിലും, മലയാളത്തിൽ ഈ നിലാവസ്ഥാപദങ്ങൾതന്നെ അർഥം വ്യക്തമായി നൽകുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘സ്ത്രീകൾ’ എന്ന നാമം മുഖ്യവാചകത്തിൽ ചേർക്കേണ്ടതില്ല.
