revisions:
- from: അന്നുമുതൽ യേശു തന്റെ ശിഷ്യന്മാർക്ക് താൻ യെരൂശലേമിലേക്കു പോകേണ്ടതുണ്ടെന്നും മൂപ്പന്മാർ, മുഖ്യപുരോഹിതന്മാർ, ശാസ്ത്രിമാർ എന്നിവരിൽനിന്ന് അനേകം കഷ്ടങ്ങൾ സഹിക്കേണ്ടതുണ്ടെന്നും[a] കൊല്ലപ്പെടേണ്ടതുണ്ടെന്നും[b] മൂന്നാം ദിവസം ഉയിർപ്പിക്കപ്പെടേണ്ടതുണ്ടെന്നും[c] കാണിച്ചുതുടങ്ങി.
  to: അന്നുമുതൽ യേശു തന്റെ ശിഷ്യന്മാർക്ക് താൻ യെരൂശലേമിലേക്കു പോകുകയും മൂപ്പന്മാർ, മുഖ്യപുരോഹിതന്മാർ, ശാസ്ത്രിമാർ എന്നിവരുടെ ഭാഗത്തുനിന്ന് പലതും സഹിക്കുകയും കൊല്ലപ്പെടുകയും മൂന്നാം ദിവസം ഉയിർപ്പിക്കപ്പെടുകയും ചെയ്യേണ്ടതുണ്ടെന്ന് വ്യക്തമാക്കിത്തുടങ്ങി.[a][b][c]
  rationale: The revision retains every major syntactic and semantic element of the Greek while improving Malayalam idiom. It gives δεῖ one governing expression of necessity, preserves the coordinated infinitives, renders πολλὰ without unnecessarily narrowing it to ‘sufferings,’ and retains the passive ‘be raised.’ Footnote anchors are placed consecutively at the end of the relevant full prediction, avoiding the draft’s interrupted and nonsequential [a] [b] [c] placement while each note remains clearly tied to its corresponding expression.
