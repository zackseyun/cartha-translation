id: MAT.16.21
reference: Matthew 16:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀπὸ τότε ἤρξατο ⸂ὁ Ἰησοῦς⸃ δεικνύειν τοῖς μαθηταῖς αὐτοῦ ὅτι δεῖ αὐτὸν ⸂εἰς Ἱεροσόλυμα ἀπελθεῖν⸃ καὶ πολλὰ παθεῖν ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων καὶ ἀποκτανθῆναι καὶ τῇ τρίτῃ ἡμέρᾳ ἐγερθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/021.yaml
  text: From that time Jesus began to show his disciples that he must go to Jerusalem and suffer many things from the elders and chief priests and scribes[a], and be killed[c][b], and on the third day be raised.
translation:
  language: ml
  text: അന്നുമുതൽ യേശു തന്റെ ശിഷ്യന്മാർക്ക് താൻ യെരൂശലേമിലേക്കു പോകുകയും മൂപ്പന്മാർ, മുഖ്യപുരോഹിതന്മാർ, ശാസ്ത്രിമാർ എന്നിവരുടെ ഭാഗത്തുനിന്ന് പലതും സഹിക്കുകയും കൊല്ലപ്പെടുകയും മൂന്നാം ദിവസം ഉയിർപ്പിക്കപ്പെടുകയും ചെയ്യേണ്ടതുണ്ടെന്ന് വ്യക്തമാക്കിത്തുടങ്ങി.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വളരെയധികം സഹിക്കേണ്ടതുണ്ടെന്ന്.” ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “പലതും സഹിക്കുക” എന്നാണ്; അത് അനുഭവിക്കേണ്ടിവരുന്ന കാര്യങ്ങളുടെ വൈവിധ്യത്തിന് ഊന്നൽ നൽകാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “മൂപ്പന്മാരുടെയും മുഖ്യപുരോഹിതന്മാരുടെയും ശാസ്ത്രിമാരുടെയും കൈകളാൽ.”
    reason: alternative_reading
  - marker: c
    text: 'അഥവാ, “ഉയിർത്തെഴുന്നേൽക്കുക.” ഗ്രീക്കിലെ രൂപം കർമണിയാണ്: “ഉയിർപ്പിക്കപ്പെടുക.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ τότε
  choice: അന്നുമുതൽ
  rationale: കഥയിലെ പുതിയ വഴിത്തിരിവും അന്നാരംഭിച്ച് തുടരുന്ന കാലസൂചനയും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἤρξατο δεικνύειν
  choice: കാണിച്ചുതുടങ്ങി
  rationale: ആരംഭത്തെ സൂചിപ്പിക്കുന്ന ἤρξατοയും അറിയിച്ചുകൊടുക്കുക എന്ന δεικνύειν എന്ന ക്രിയയുടെ അടിസ്ഥാനഭാവവും നിലനിർത്തുന്നു.
- source_word: δεῖ αὐτὸν
  choice: താൻ ... പോകേണ്ടതുണ്ടെന്നും ... സഹിക്കേണ്ടതുണ്ടെന്നും ... കൊല്ലപ്പെടേണ്ടതുണ്ടെന്നും ... ഉയിർപ്പിക്കപ്പെടേണ്ടതുണ്ടെന്നും
  rationale: δεῖ സൂചിപ്പിക്കുന്ന അനിവാര്യത വ്യക്തമാക്കുന്നു; അതിന്റെ ദൈവശാസ്ത്രപരമായ ഉറവിടം വാക്യത്തിൽ ഇല്ലാത്തതിനാൽ വിശദീകരിച്ചുചേർക്കുന്നില്ല.
- source_word: εἰς Ἱεροσόλυμα ἀπελθεῖν
  choice: യെരൂശലേമിലേക്കു പോകുക
  rationale: ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ഗതിയെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പറയുന്നു.
- source_word: πολλὰ παθεῖν
  choice: അനേകം കഷ്ടങ്ങൾ സഹിക്കുക
  rationale: πολλά എന്ന ബഹുവചനത്തിന്റെ ‘പല കാര്യങ്ങൾ’ എന്ന ഭാവവും കഷ്ടാനുഭവങ്ങളുടെ വൈവിധ്യവും നിലനിർത്തുന്നു.
- source_word: πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων
  choice: മൂപ്പന്മാർ, മുഖ്യപുരോഹിതന്മാർ, ശാസ്ത്രിമാർ
  rationale: അന്നത്തെ യഹൂദ നേതൃത്വത്തിലെ മൂന്ന് വിഭാഗങ്ങളെയും വേർതിരിച്ചു കാണിക്കുന്ന നേരിട്ടുള്ള, പ്രചാരത്തിലുള്ള പദങ്ങൾ.
- source_word: ἀποκτανθῆναι
  choice: കൊല്ലപ്പെടുക
  rationale: ഗ്രീക്കിലെ കർമണിപ്രയോഗം വ്യക്തവും നേരിട്ടുമായി നിലനിർത്തുന്നു.
- source_word: τῇ τρίτῃ ἡμέρᾳ ἐγερθῆναι
  choice: മൂന്നാം ദിവസം ഉയിർപ്പിക്കപ്പെടുക
  rationale: ἐγερθῆναι എന്ന കർമണിരൂപം നിലനിർത്തുകയും സമയസൂചന നേരിട്ട് പകർന്നുനൽകുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: δεῖ എന്ന പദത്തിലെ അനിവാര്യത
  choice: ‘വേണ്ടതുണ്ട്’ എന്നു നൽകി അനിവാര്യത നിലനിർത്തുക
  alternative: ദൈവഹിതപ്രകാരം നിർബന്ധമായിരുന്നു എന്ന് വിശദീകരിക്കുക
  rationale: ഗ്രീക്ക് വാക്യം അനിവാര്യത പറയുന്നു; എന്നാൽ അതിന്റെ ഉറവിടം ഈ ഉപവാക്യത്തിൽ തുറന്നു വിശദീകരിക്കുന്നില്ല. അതിനാൽ ദൈവിക നിർണയം, തിരുവെഴുത്തുനിവൃത്തി, ചരിത്രപരമായ അനിവാര്യത എന്നിവയിൽ ഒന്ന് മാത്രം തെരഞ്ഞെടുത്ത് ചേർക്കുന്നില്ല.
- issue: ἐγερθῆναι എന്ന ക്രിയയുടെ വാച്യം
  choice: കർമണിയായി ‘ഉയിർപ്പിക്കപ്പെടുക’
  alternative: ‘ഉയിർത്തെഴുന്നേൽക്കുക’
  rationale: മൂലപാഠത്തിലെ കർമണിരൂപം സംരക്ഷിച്ച് പ്രവർത്തകനെ ഈ വാക്യത്തിൽ പ്രത്യേകം നിശ്ചയിക്കാതെ വിടുന്നു.
- issue: ἀπό എന്നതിലെ ഉറവിടം/കർതൃത്വബന്ധം
  choice: ‘എന്നിവരിൽനിന്ന്’
  alternative: ‘എന്നിവരുടെ കൈകളാൽ’
  rationale: ἀπόയുടെ നേരിട്ടുള്ള ഉറവിടഭാവം നിലനിർത്തുന്നു; ‘കൈകളാൽ’ എന്നത് സന്ദർഭോചിതമായെങ്കിലും കൂടുതൽ വ്യാഖ്യാനാത്മകമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വാക്യഘടന സ്വീകരിച്ചു. ‘മൂപ്പന്മാർ’, ‘മുഖ്യപുരോഹിതന്മാർ’, ‘ശാസ്ത്രിമാർ’ എന്നീ പരിചിതമായ ബൈബിൾ-ചരിത്ര പദങ്ങൾ നിലനിർത്തി. നീണ്ട ഗ്രീക്ക് വാക്യത്തിന്റെ സമാന്തര ഘടന മലയാളത്തിൽ ആവർത്തിക്കുന്ന ‘വേണ്ടതുണ്ടെന്നും’ എന്ന രൂപത്തിലൂടെ വ്യക്തമായി സൂക്ഷിച്ചു.
