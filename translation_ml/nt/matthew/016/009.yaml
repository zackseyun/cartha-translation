id: MAT.16.9
reference: Matthew 16:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὔπω νοεῖτε, οὐδὲ μνημονεύετε τοὺς πέντε ἄρτους τῶν πεντακισχιλίων καὶ πόσους κοφίνους ἐλάβετε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/009.yaml
  text: Do you still not understand[a], nor do you remember the five loaves for the five thousand[b], and how many baskets you gathered?
translation:
  language: ml
  text: നിങ്ങൾക്ക് ഇപ്പോഴും മനസ്സിലാകുന്നില്ലേ,[a] അയ്യായിരം പേർക്കുള്ള ആ അഞ്ച് അപ്പങ്ങളും നിങ്ങൾ എത്ര കൊട്ടകൾ എടുത്തുവെന്നും[b] ഓർക്കുന്നില്ലേ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇതുവരെ മനസ്സിലാകുന്നില്ലേ.’
    reason: lexical_alternative
  - marker: b
    text: ‘എടുത്തു’ എന്നതിന് ഈ സന്ദർഭത്തിൽ ‘ശേഖരിച്ചു’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔπω
  choice: ഇപ്പോഴും ... ഇല്ലേ
  rationale: യേശുവിന്റെ ശാസന അടങ്ങിയ ചോദ്യത്തിൽ ‘ഇതുവരെ ഇല്ലേ’ എന്ന കാലസൂചന സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: νοεῖτε
  choice: മനസ്സിലാകുന്നില്ലേ
  rationale: മുൻ സംഭവങ്ങളുടെ പ്രാധാന്യം ഗ്രഹിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘മനസ്സിലാകുക’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: οὐδὲ μνημονεύετε
  choice: ഓർക്കുന്നില്ലേ
  rationale: രണ്ടാമത്തെ നിഷേധാത്മക ചോദ്യം മലയാളത്തിൽ സ്വാഭാവികമായ സമാന്തര ഘടനയിൽ നൽകുന്നു.
- source_word: τοὺς πέντε ἄρτους
  choice: ആ അഞ്ച് അപ്പം
  rationale: ഭക്ഷണവിവരണത്തിലെ എണ്ണാവുന്ന അപ്പങ്ങളെ സൂചിപ്പിക്കുന്നു; സംഖ്യയ്ക്കുശേഷമുള്ള മലയാള നാമത്തിന്റെ സ്വാഭാവിക ഏകവചനരൂപം ഉപയോഗിച്ചു.
- source_word: τῶν πεντακισχιλίων
  choice: അയ്യായിരം പേർക്കുവേണ്ടിയുള്ള
  rationale: ഷഷ്ഠിവിഭക്തിയുടെ സന്ദർഭബന്ധം അയ്യായിരം പേർക്ക് ഭക്ഷണം നൽകിയ സംഭവത്തോടാണെന്ന് വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടമാക്കുന്നു.
- source_word: πόσους κοφίνους
  choice: എത്ര കൊട്ടകൾ
  rationale: κόφινος എന്നത് ഒരു തരത്തിലുള്ള കൊട്ടയാണ്; ചോദ്യം ശേഷിപ്പുകൾ നിറച്ച കൊട്ടകളുടെ എണ്ണത്തെക്കുറിച്ചാണ്.
- source_word: ἐλάβετε
  choice: എടുത്തു
  rationale: λαμβάνω എന്ന ക്രിയയുടെ അടിസ്ഥാനമായ ‘എടുക്കുക’ എന്ന അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ശേഷിപ്പുകൾ കൊട്ടകളിലാക്കി എടുത്തതിനെ സൂചിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ചോദ്യംരൂപം ഉപയോഗിച്ചു. മൂലത്തിലെ രണ്ട് നിഷേധാത്മക ക്രിയകളുടെ സമാന്തരത നിലനിർത്തി; οὔπω എന്ന പദത്തിന്റെ കാലസൂചനയും ἐλάβετε എന്നതിന്റെ അർഥവ്യാപ്തിയും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
