id: MAT.16.18
reference: Matthew 16:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: κἀγὼ δέ σοι λέγω ὅτι σὺ εἶ Πέτρος, καὶ ἐπὶ ταύτῃ τῇ πέτρᾳ οἰκοδομήσω μου τὴν ἐκκλησίαν, καὶ πύλαι ᾅδου οὐ κατισχύσουσιν αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/018.yaml
  text: And I also say to you that you are Peter[a], and on this rock I will build my church[b], and the gates of Hades will not prevail against it.
translation:
  language: ml
  text: 'ഞാനും നിന്നോടു പറയുന്നു: നീ പത്രോസ് ആകുന്നു; ഈ പാറമേൽ[a] ഞാൻ എന്റെ സഭ പണിയും; മൃതലോകത്തിന്റെ[b] കവാടങ്ങൾ അതിനെ കീഴടക്കുകയില്ല.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ‘പത്രോസ്’ (Πέτρος) എന്ന പേരിനും ‘പാറ’ (πέτρα) എന്ന പദത്തിനും ഇടയിൽ ഒരു പദബന്ധമുണ്ട്. ‘ഈ പാറ’ പത്രോസിനെയോ, അവന്റെ വിശ്വാസപ്രഖ്യാപനത്തെയോ, വിശ്വാസം പ്രഖ്യാപിക്കുന്ന പ്രതിനിധി അപ്പൊസ്തലനായ പത്രോസിനെയോ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം.
    reason: alternative_reading
  - marker: b
    text: 'ഗ്രീക്ക്: ‘ഹാദേസ്’; അതായത്, മരിച്ചവരുടെ ലോകം. പരമ്പരാഗതമായി ‘നരകം’ എന്നും പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ δέ
  choice: ഞാനും
  rationale: κἀγώ നൽകുന്ന ഊന്നലും പത്രോസിന്റെ വാക്കുകളോടുള്ള യേശുവിന്റെ പ്രതികരണഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; δέ ഇവിടെ ശക്തമായ വൈരുധ്യമല്ല, സംഭാഷണത്തിന്റെ തുടർച്ചയാണ്.
- source_word: σοι λέγω
  choice: നിന്നോടു പറയുന്നു
  rationale: നേരിട്ടുള്ള അഭിസംബോധനയും λέγω എന്നതിന്റെ സാധാരണ അർഥവും മാന്യവും സ്വാഭാവികവുമായ ഭാഷയിൽ സൂക്ഷിക്കുന്നു.
- source_word: Πέτρος
  choice: പത്രോസ്
  rationale: പുതിയനിയമത്തിലെ ഈ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം ഉപയോഗിക്കുന്നു. ഗ്രീക്കിലെ Πέτρος–πέτρα പദബന്ധം മലയാളത്തിൽ പൂർണമായി പുനരാവിഷ്കരിക്കാനാകാത്തതിനാൽ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐπὶ ταύτῃ τῇ πέτρᾳ
  choice: ഈ പാറമേൽ
  rationale: ἐπίയും ταύτῃയും നൽകുന്ന ‘ഈ പാറയുടെ മേൽ’ എന്ന സ്ഥലരൂപകം ചുരുക്കവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു; ‘പാറ’ ആരെയോ എന്തിനെയോ സൂചിപ്പിക്കുന്നു എന്ന വ്യാഖ്യാനവിവാദം മുഖ്യവാചകത്തിൽ തീർപ്പാക്കുന്നില്ല.
- source_word: οἰκοδομήσω
  choice: ഞാൻ ... പണിയും
  rationale: οἰκοδομέωയിലെ നിർമാണരൂപകം നേരിട്ട് നിലനിർത്തുന്നു; ‘സ്ഥാപിക്കും’ എന്ന വ്യാഖ്യാനാത്മക പദത്തേക്കാൾ മൂലരൂപകത്തോട് അടുത്തതാണ്.
- source_word: μου τὴν ἐκκλησίαν
  choice: എന്റെ സഭ
  rationale: ἐκκλησία ഇവിടെ യേശുവിനുള്ള സമൂഹത്തെ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാള ക്രൈസ്തവ പ്രയോഗത്തിൽ ‘സഭ’ സ്വാഭാവികവും വിശാലമായി മനസ്സിലാക്കപ്പെടുന്നതുമാണ്; μου എന്ന ഉടമസ്ഥതാബോധവും വ്യക്തമാണ്.
- source_word: πύλαι ᾅδου
  choice: മൃതലോകത്തിന്റെ കവാടങ്ങൾ
  rationale: ᾅδης അന്തിമശിക്ഷയുടെ സ്ഥലമായ ‘നരകം’ എന്നതിലുപരി മരിച്ചവരുടെ ലോകത്തെ സൂചിപ്പിക്കുന്നു. ‘മൃതലോകം’ ഈ അർഥം സാധാരണ വായനക്കാർക്ക് സുതാര്യമാക്കുന്നു; ഗ്രീക്ക് പദം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: οὐ κατισχύσουσιν αὐτῆς
  choice: അതിനെ കീഴടക്കുകയില്ല
  rationale: κατισχύωയുടെ മേൽക്കൈ നേടുക, ജയിക്കുക, കീഴ്പ്പെടുത്തുക എന്ന പ്രതിയോഗിതാഭാവം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; αὐτῆς സഭയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അതിനെ’ എന്നു പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: ‘ഈ പാറ’ (πέτρα) ആരെ അല്ലെങ്കിൽ എന്തിനെ സൂചിപ്പിക്കുന്നു
  choice: മുഖ്യവാചകത്തിൽ ‘ഈ പാറ’ എന്നുതന്നെ നിലനിർത്തി, സൂചന നിർണയിച്ചില്ല.
  alternative: പത്രോസ് തന്നെയോ, പത്രോസിന്റെ വിശ്വാസപ്രഖ്യാപനമോ, വിശ്വാസം പ്രഖ്യാപിക്കുന്ന പ്രതിനിധി അപ്പൊസ്തലനായ പത്രോസോ എന്നു വ്യക്തമായി നിർണയിക്കുക.
  rationale: Πέτρος–πέτρα എന്ന പദബന്ധം ഗ്രീക്കിൽ വ്യക്തമാണ്; എങ്കിലും അതിന്റെ കൃത്യമായ വ്യാഖ്യാനപരമായ സൂചനയെ വാക്യം തുറന്ന നിലയിൽ വിടുന്നു. ഒരു സഭാപാരമ്പര്യത്തിന്റെ തീരുമാനം പരിഭാഷയിൽ കയറ്റാതെ യഥാർഥമായ ദൈവശാസ്ത്രപരമായ സംഘർഷം സൂക്ഷിച്ചു.
- issue: ᾅδης എന്നതിന്റെ വിവർത്തനം
  choice: മൃതലോകം
  alternative: ഹാദേസ്; പാതാളം; നരകം
  rationale: ഇവിടെ ᾅδης മരിച്ചവരുടെ ലോകമാണ്; അന്തിമശിക്ഷയെ സൂചിപ്പിക്കുന്ന ‘നരകം’ എന്ന പദം ഉപയോഗിക്കുന്നത് അനാവശ്യമായ ദൈവശാസ്ത്രാർഥം ഇറക്കുമതി ചെയ്യാം. ‘മൃതലോകം’ അർഥം സുതാര്യമാക്കുന്നു; മൂലപദം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ആകുന്നു’ വാക്യത്തിന് തിരുവെഴുത്തിനൊത്ത ഗൗരവം നൽകുമ്പോഴും ഗ്രഹിക്കാവുന്നതാണ്. അർദ്ധവിരാമങ്ങൾ മൂലവാക്യത്തിലെ പരസ്പരം ബന്ധമുള്ള മൂന്നു പ്രഖ്യാപനങ്ങളെ വ്യക്തമായി വേർതിരിക്കുന്നു; വ്യാഖ്യാനപരമായ അനിശ്ചിതത്വങ്ങൾ അടിക്കുറിപ്പുകളിലാക്കി മുഖ്യവാചകം സംക്ഷിപ്തമായി സൂക്ഷിച്ചു.
