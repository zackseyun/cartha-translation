id: MAT.16.10
reference: Matthew 16:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐδὲ τοὺς ἑπτὰ ἄρτους τῶν τετρακισχιλίων καὶ πόσας σπυρίδας ἐλάβετε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/010.yaml
  text: Or the seven loaves for the four thousand[a], and how many large baskets you picked up?
translation:
  language: ml
  text: നാലായിരം പേർക്കുള്ള ഏഴ് അപ്പങ്ങളെയും, നിങ്ങൾ എത്ര വലിയ കൊട്ടകൾ എടുത്തുവെന്നതും ഓർക്കുന്നില്ലേ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നാലായിരം പേരുടേതായ ഏഴ് അപ്പങ്ങളെയും, നിങ്ങൾ എത്ര വലിയ കൊട്ടകൾ എടുത്തുവെന്നതും ഓർക്കുന്നില്ലേ?”'
    reason: τῶν τετρακισχιλίων എന്ന ജനിറ്റീവ് ഘടനയെ ‘നാലായിരം പേരുടേതായ’ എന്ന് കൂടുതൽ രൂപസമാനമായി പരിഭാഷപ്പെടുത്താവുന്നതാണ്.
lexical_decisions:
- source_word: οὐδὲ
  choice: '...ഓ ...എന്നതോ ഓർക്കുന്നില്ലേ?'
  rationale: മുൻവാക്യത്തിലെ ഓർമ്മിപ്പിക്കുന്ന ചോദ്യത്തിന്റെ ദീർഘവൃത്തമായ തുടർച്ചയാണ് ഇത്. ഒറ്റവാക്യമായും സ്വാഭാവികമാകാൻ നിഷേധാത്മക ചോദ്യഭാവം പുനഃസ്ഥാപിച്ചു; οὐδέ സൂചിപ്പിക്കുന്ന പരമ്പരയിലെ അടുത്ത ഇനം ‘-ഓ’ എന്ന ഘടനയിലൂടെ പ്രകടമാക്കി.
- source_word: τοὺς ἑπτὰ ἄρτους
  choice: ഏഴ് അപ്പങ്ങൾ
  rationale: ഭക്ഷണവിതരണത്തിന്റെ സന്ദർഭത്തിൽ ἄρτος അപ്പത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ സ്വാഭാവികവും വ്യക്തവുമായ സമാനപദം ‘അപ്പം’ ആണ്.
- source_word: τῶν τετρακισχιλίων
  choice: നാലായിരം പേർക്കായി ഉണ്ടായിരുന്ന
  rationale: ജനസമൂഹവുമായി അപ്പങ്ങൾക്കുള്ള സന്ദർഭബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ഗ്രീക്കിലെ സംക്ഷിപ്തമായ ജനിറ്റീവ് ബന്ധത്തെ അതിലധികം നിർവചിക്കുന്നില്ല.
- source_word: πόσας
  choice: എത്ര
  rationale: σπυρίδας എന്ന നാമത്തെ വിശേഷിപ്പിക്കുന്ന നേരിട്ടുള്ള ചോദ്യപദം.
- source_word: σπυρίδας
  choice: വലിയ കൊട്ടകൾ
  rationale: σπυρίς സാധാരണയായി κόφινος-നേക്കാൾ വലിയ കൊട്ടയെ സൂചിപ്പിക്കുന്നു; ആ പദവ്യത്യാസം ‘വലിയ’ എന്നു ചേർത്ത് നിലനിർത്തി.
- source_word: ἐλάβετε
  choice: നിങ്ങൾ ... എടുത്തു
  rationale: ശേഷിച്ച ഭക്ഷണം കൊട്ടകളിലായി എടുത്ത സംഭവത്തെ സൂചിപ്പിക്കുന്ന ലളിതവും സ്വാഭാവികവുമായ പ്രയോഗം; ക്രിയയിൽ ഇല്ലാത്ത ‘ശേഖരിച്ചു’ എന്ന ആശയം നിർബന്ധമായി ചേർക്കുന്നില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. മുൻവാക്യത്തിൽ ആശ്രയിക്കുന്ന ഗ്രീക്ക് ദീർഘവൃത്തം ഒറ്റവാക്യമായും വ്യക്തമായിരിക്കാനായി ‘ഓർക്കുന്നില്ലേ?’ പുനഃസ്ഥാപിച്ചു. പ്രധാനവാചകത്തിലെ [a] അടിക്കുറിപ്പ് ചിഹ്നം നിർബന്ധമായി ഉൾപ്പെടുത്തി.
