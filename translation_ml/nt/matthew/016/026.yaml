- from: ഒരു മനുഷ്യൻ ലോകം മുഴുവൻ നേടിയാലും സ്വന്തം ജീവൻ നഷ്ടപ്പെടുത്തിയാൽ, അതുകൊണ്ട് അയാൾക്ക് എന്തു പ്രയോജനം? അല്ലെങ്കിൽ, സ്വന്തം ജീവന് പകരമായി ഒരു മനുഷ്യൻ എന്തു കൊടുക്കും?[a]
  to: ഒരു മനുഷ്യൻ ലോകം മുഴുവൻ നേടിയാലും സ്വന്തം ജീവൻ നഷ്ടപ്പെട്ടാൽ, അതുകൊണ്ട് അയാൾക്ക് എന്തു പ്രയോജനം? അല്ലെങ്കിൽ, സ്വന്തം ജീവന് പകരമായി ഒരു മനുഷ്യൻ എന്തു കൊടുക്കും?[a]
  rationale: ζημιωθῇയുടെ നിഷ്ക്രിയമായ ‘നഷ്ടം അനുഭവിക്കുക/നഷ്ടപ്പെടുക’ എന്ന ആശയം കൃത്യമായി നൽകാൻ ‘നഷ്ടപ്പെടുത്തിയാൽ’ എന്നതിന് പകരം ‘നഷ്ടപ്പെട്ടാൽ’ ഉപയോഗിച്ചു. മറ്റെല്ലാ പദപ്രയോഗങ്ങളും മൂലപാഠത്തോടും ആധുനിക നിലവാരമലയാളത്തിന്റെ സ്വാഭാവികതയോടും യോജിക്കുന്നതിനാൽ നിലനിർത്തി.
