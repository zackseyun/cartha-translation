id: MAT.16.26
reference: Matthew 16:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τί γὰρ ⸀ὠφεληθήσεται ἄνθρωπος ἐὰν τὸν κόσμον ὅλον κερδήσῃ τὴν δὲ ψυχὴν αὐτοῦ ζημιωθῇ; ἢ τί δώσει ἄνθρωπος ἀντάλλαγμα τῆς ψυχῆς αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/026.yaml
  text: For what will it profit a man if he gains the whole world but forfeits his life? Or what will a man give in exchange for his life?[a]
translation:
  language: ml
  text: ഒരു മനുഷ്യൻ ലോകം മുഴുവൻ നേടിയാലും സ്വന്തം ജീവൻ നഷ്ടപ്പെട്ടാൽ, അതുകൊണ്ട് അയാൾക്ക് എന്തു പ്രയോജനം? അല്ലെങ്കിൽ, സ്വന്തം ജീവന് പകരമായി ഒരു മനുഷ്യൻ എന്തു കൊടുക്കും?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ജീവൻ’ എന്ന രണ്ടു പ്രയോഗങ്ങൾക്കും ‘ആത്മാവ്’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ ψυχή എന്ന പദത്തിന് സന്ദർഭമനുസരിച്ച് ‘ജീവൻ,’ ‘സ്വയം,’ അല്ലെങ്കിൽ ‘ആത്മാവ്’ എന്നിങ്ങനെ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ
  choice: അതുകൊണ്ട് ... എന്തു
  rationale: τί ഉന്നയിക്കുന്ന ചോദ്യം ‘എന്തു’ എന്നു നിലനിർത്തുന്നു; γάρ മുൻവാക്യത്തിലെ ഉപദേശവുമായി നൽകുന്ന വിശദീകരണബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി ‘അതുകൊണ്ട്’ എന്ന പ്രയോഗത്തിലൂടെ സൂചിപ്പിക്കുന്നു.
- source_word: ὠφεληθήσεται
  choice: അയാൾക്ക് ... പ്രയോജനം
  rationale: ലഭിക്കുന്ന നേട്ടമോ പ്രയോജനമോ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ അർഥം സ്വാഭാവികമായ മലയാള ചോദ്യരൂപത്തിൽ നൽകുന്നു.
- source_word: ἄνθρωπος
  choice: ഒരു മനുഷ്യൻ / അയാൾ
  rationale: ഗ്രീക്കിലെ ഏകവചന പൊതുപ്രതിനിധിയെ ‘ഒരു മനുഷ്യൻ’ എന്നു നിലനിർത്തുകയും ആവർത്തനം ഒഴിവാക്കേണ്ടിടത്ത് ‘അയാൾ’ ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: τὸν κόσμον ὅλον
  choice: ലോകം മുഴുവൻ
  rationale: κόσμος എന്നതിന്റെ സമഗ്രതയെ ὅλον ഊന്നുന്നതിനാൽ ‘ലോകം മുഴുവൻ’ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: κερδήσῃ
  choice: നേടിയാലും
  rationale: κερδαίνω സൂചിപ്പിക്കുന്ന സമ്പാദിക്കൽ/നേട്ടം എന്ന ആശയം നിബന്ധനാപരമായ സാഹചര്യത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ψυχή
  choice: ജീവൻ
  rationale: ഈ സന്ദർഭത്തിൽ ψυχή വ്യക്തിയുടെ ജീവൻ അഥവാ സ്വയം എന്ന വിശാല അർഥം വഹിക്കാം. സാങ്കേതികമായ ശരീരം–ആത്മാവ് വേർതിരിവ് നിർബന്ധിക്കാതെ ‘ജീവൻ’ മുഖ്യപാഠത്തിൽ സ്വീകരിക്കുന്നു; ‘ആത്മാവ്’ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ζημιωθῇ
  choice: നഷ്ടപ്പെടുത്തിയാൽ
  rationale: ζημιόω ഇവിടെ ഏറ്റവും വിലയേറിയത് നഷ്ടമാകുന്നതിനെ സൂചിപ്പിക്കുന്നു; ലോകം നേടുന്നതുമായുള്ള വൈരുധ്യം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἀντάλλαγμα
  choice: പകരമായി
  rationale: തിരിച്ചുകൊടുക്കുന്ന വിലയെയോ കൈമാറ്റത്തെയോ സൂചിപ്പിക്കുന്ന വാണിജ്യരൂപകം ‘പകരമായി’ എന്നതിലൂടെ അതിവ്യാഖ്യാനം കൂടാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: അന്തിമമായ നഷ്ടത്തെക്കുറിച്ചുള്ള വചനത്തിൽ ψυχή എന്നതിന്റെ പരിഭാഷ
  choice: ജീവൻ
  alternative: ആത്മാവ്; സ്വയം
  rationale: ഈ വചനം ψυχήയെ ശരീരത്തിൽനിന്നു വേറിട്ട അമൂർത്ത ആത്മാവ് എന്ന സാങ്കേതിക അർഥത്തിലേക്ക് നിർബന്ധമായി ചുരുക്കുന്നില്ല. ‘ജീവൻ’ വ്യക്തിയുടെ സമഗ്രമായ ജീവനും അസ്തിത്വമൂല്യവും പ്രകടമാക്കുന്നു; പാരമ്പര്യപരവും സാധുവുമായ ‘ആത്മാവ്’ എന്ന വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവമുള്ള ചോദ്യരൂപം. ‘പ്രയോജനം,’ ‘പകരമായി’ എന്നീ പ്രയോഗങ്ങൾ മൂലത്തിലെ ലാഭ–നഷ്ട, കൈമാറ്റ രൂപകങ്ങൾ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
