review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the two parallel rhetorical questions, the comprehensive scope of ‘the whole world,’ and the exchange metaphor. However, ‘നഷ്ടപ്പെടുത്തിയാൽ’ is causative/transitive (‘causes to lose’/‘forfeits’) and does not most directly reflect the passive ζημιωθῇ (‘suffers loss of/is deprived of’).
  naturalness: The wording is otherwise clear, dignified, and natural in modern standard Malayalam. Replacing the causative verb with the intransitive passive-result expression ‘നഷ്ടപ്പെട്ടാൽ’ improves both idiomatic clarity and alignment with the Greek.
  terminology: ‘ജീവൻ’ is a defensible main-text rendering of ψυχή here and is consistently used. The footnote appropriately preserves ‘ആത്മാവ്’ as a viable alternative without imposing a technical anthropological reading. ‘പ്രയോജനം’ and ‘പകരമായി’ preserve the source’s benefit/loss and exchange imagery.
  issues:
  - severity: medium
    issue: ‘നഷ്ടപ്പെടുത്തിയാൽ’ renders ζημιωθῇ with a causative verb.
    rationale: 'ζημιωθῇ is an aorist passive subjunctive: the person suffers the loss of, or is deprived of, his ψυχή. ‘സ്വന്തം ജീവൻ നഷ്ടപ്പെട്ടാൽ’ expresses this result without suggesting that the person causes someone or something else to lose it.'
  revised_text: ഒരു മനുഷ്യൻ ലോകം മുഴുവൻ നേടിയാലും സ്വന്തം ജീവൻ നഷ്ടപ്പെട്ടാൽ, അതുകൊണ്ട് അയാൾക്ക് എന്തു പ്രയോജനം? അല്ലെങ്കിൽ, സ്വന്തം ജീവന് പകരമായി ഒരു മനുഷ്യൻ എന്തു കൊടുക്കും?[a]
