id: MAT.16.23
reference: Matthew 16:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ στραφεὶς εἶπεν τῷ Πέτρῳ· Ὕπαγε ὀπίσω μου, Σατανᾶ· σκάνδαλον ⸂εἶ ἐμοῦ⸃, ὅτι οὐ φρονεῖς τὰ τοῦ θεοῦ ἀλλὰ τὰ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/023.yaml
  text: But he turned and said to Peter[a], “Go behind me, Satan! You are a stumbling block to me, because you are not setting your mind on the things of God[b], but on the things of men.”
translation:
  language: ml
  text: 'എന്നാൽ അവൻ തിരിഞ്ഞ് പത്രൊസിനോടു പറഞ്ഞു: “എന്റെ പിന്നിലേക്കു പോകൂ, സാത്താനേ![a] നീ എനിക്ക് ഇടർച്ചക്കല്ലാണ്; കാരണം, നീ മനസ്സുവെക്കുന്നത് ദൈവത്തിന്റെ കാര്യങ്ങളിലല്ല, മനുഷ്യരുടെ കാര്യങ്ങളിലാണ്.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'പരമ്പരാഗതമായി: “എന്റെ പിന്നിൽ പോകൂ, സാത്താനേ!”'
    reason: ‘പിന്നിലേക്കു പോകൂ’ എന്ന സ്ഥലസൂചനയുള്ള പ്രയോഗത്തിന് കൂടുതൽ പരമ്പരാഗതമായ മലയാളരൂപം നൽകുന്നു.
  - marker: b
    text: “മനുഷ്യരുടെ കാര്യങ്ങൾ” എന്നു പറയുന്നത് ദൈവത്തിന്റെ കാര്യങ്ങൾക്ക് വിരുദ്ധമായ വെറും മാനുഷിക ചിന്തകളും താത്പര്യങ്ങളും സൂചിപ്പിക്കുന്നു.
    reason: ഗ്രീക്കിലെ പൊതുവായ മനുഷ്യസൂചനയും പ്രയോഗത്തിന്റെ സാഹചര്യാർഥവും വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: στραφεὶς
  choice: തിരിഞ്ഞ്
  rationale: ശാരീരികമായി തിരിഞ്ഞശേഷം സംസാരിച്ചതെന്ന ക്രിയാക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Ὕπαγε ὀπίσω μου
  choice: എന്റെ പിന്നിലേക്കു പോകൂ
  rationale: Ὕπαγε എന്നതിന്റെ ‘പോകുക’ എന്ന ആജ്ഞയും ὀπίσω μου എന്നതിന്റെ സ്ഥലസൂചനയും നിലനിർത്തുന്നു; പ്രയോഗത്തിന്റെ ശാസനാത്മക ശക്തിയും നഷ്ടപ്പെടുന്നില്ല.
- source_word: Σατανᾶ
  choice: സാത്താനേ
  rationale: സംബോധനരൂപത്തിലുള്ള അംഗീകൃത നാമം നിലനിർത്തി, ‘എതിരാളി’ എന്നു വ്യാഖ്യാനിച്ച് അർഥം ചുരുക്കുന്നില്ല.
- source_word: σκάνδαλον
  choice: ഇടർച്ചക്കല്ല്
  rationale: വഴിയിൽ തട്ടി വീഴാൻ ഇടയാക്കുന്ന തടസ്സത്തിന്റെ രൂപകം മലയാളത്തിൽ വ്യക്തമായി പകർന്നുനൽകുന്നു.
- source_word: ἐμοῦ
  choice: എനിക്ക്
  rationale: σκάνδαλον എന്നതിനോടൊപ്പമുള്ള ജനിറ്റീവിനെ, യേശുവിനോടുള്ള ബന്ധത്തിൽ പത്രൊസ് ഒരു തടസ്സമാണെന്ന അർഥത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: φρονεῖς
  choice: മനസ്സുവെക്കുന്നത്
  rationale: വെറും ചിന്തയല്ല, മനോഭാവവും ശ്രദ്ധയുടെ ദിശയും ഉൾക്കൊള്ളുന്ന φρονέωയുടെ ആശയം പകർന്നുനൽകുന്നു.
- source_word: τὰ τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ കാര്യങ്ങൾ
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തമായ ഉടമസ്ഥതാപ്രയോഗവും തുടർന്നുള്ള വിരുദ്ധസമാന്തരതയും നിലനിർത്തുന്നു.
- source_word: τὰ τῶν ἀνθρώπων
  choice: മനുഷ്യരുടെ കാര്യങ്ങൾ
  rationale: ἄνθρωπος ഇവിടെ മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ലിംഗപരമായി അതിവ്യാഖ്യാനം ചെയ്യാത്തതുമായ രൂപമാണിത്.
theological_decisions:
- issue: പത്രൊസിനോടുള്ള ‘സാത്താനേ’ എന്ന അഭിസംബോധനയുടെ അർഥവ്യാപ്തി
  choice: ‘സാത്താനേ’ എന്ന നേരിട്ടുള്ള അഭിസംബോധന മാറ്റമില്ലാതെ നിലനിർത്തുന്നു.
  alternative: ‘എതിരാളിയേ’ എന്നു വിവർത്തനം ചെയ്യുക, അല്ലെങ്കിൽ പത്രൊസിലൂടെ പ്രവർത്തിക്കുന്ന സാത്താനെയാണെന്ന് വിശദീകരിക്കുക.
  rationale: പത്രൊസിനെ സാത്താനോടുതന്നെ തുല്യപ്പെടുത്തുന്നുവോ, സാത്താനികമായ എതിർപ്പിന്റെ ഉപകരണമെന്നോ, ‘എതിരാളി’ എന്ന പൊതുവായ അർഥത്തിലോ എന്നത് വിവർത്തനം തീർപ്പാക്കുന്നില്ല; ഗ്രീക്കിലെ കടുപ്പവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിൽക്കുന്നു.
- issue: ‘ദൈവത്തിന്റെ കാര്യങ്ങൾ’ എന്നും ‘മനുഷ്യരുടെ കാര്യങ്ങൾ’ എന്നും ഉള്ള വിരോധം
  choice: ഇരുവശവും സമാന്തരമായ ഉടമസ്ഥതാപ്രയോഗങ്ങളായി നിലനിർത്തുന്നു.
  alternative: ‘ദൈവത്തിന്റെ താത്പര്യങ്ങൾ’ എന്നും ‘മാനുഷിക താത്പര്യങ്ങൾ’ എന്നും വ്യാഖ്യാനപരമായി നൽകുക.
  rationale: മനോഭാവം, പദ്ധതി, താത്പര്യം, ആശങ്ക എന്നിവയിൽ ഏതാണു മുൻനിൽക്കുന്നതെന്ന യഥാർഥ സംക്ഷിപ്തതയും വ്യാപ്തിയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ശാസനയുടെ കടുപ്പം നിലനിർത്തിയെങ്കിലും അനാവശ്യമായി പഴഞ്ചനായ പദക്രമം ഒഴിവാക്കി. മുഖ്യവാചകത്തിലെ [a], [b] അടയാളങ്ങൾ അനുബന്ധ അടിക്കുറിപ്പുകളുമായി കൃത്യമായി പൊരുത്തപ്പെടുന്നു.
