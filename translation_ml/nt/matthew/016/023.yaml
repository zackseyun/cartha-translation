  source_fidelity: 'ഗ്രീക്കിലെ ക്രമവും മുഖ്യഅർഥവും വിശ്വസ്തമായി പകർന്നിരിക്കുന്നു: στραφεὶς ‘തിരിഞ്ഞ്,’ Ὕπαγε ὀπίσω μου എന്ന സ്ഥലസൂചനയുള്ള ആജ്ഞ, Σατανᾶ എന്ന കഠിനമായ സംബോധന, σκάνδαλον എന്ന രൂപകം, φρονεῖς എന്ന മനോഭാവ/ശ്രദ്ധാവിഷയം, ദൈവത്തിന്റെയും മനുഷ്യരുടെയും കാര്യങ്ങൾ തമ്മിലുള്ള വിരോധം എന്നിവ നിലനിൽക്കുന്നു. ‘സാത്താനേ’ എന്ന സംബോധനത്തിന്റെ വ്യാഖ്യാനപരമായ അവ്യക്തതയും സംരക്ഷിച്ചിട്ടുണ്ട്.'
  naturalness: വാചകം ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ സ്വാഭാവികവും വായനാസുഗമവുമാണ്. ‘എന്റെ പിന്നിലേക്കു പോകൂ’ എന്നത് ചില പരമ്പരാഗത രൂപങ്ങളെക്കാൾ നേരിട്ടുള്ള സ്ഥലസൂചന നൽകുന്നു; സന്ദർഭത്തിലെ ശാസനയുടെ ശക്തിക്കും ഇത് യോജിക്കുന്നു. ‘നീ മനസ്സുവെക്കുന്നത് ...’ എന്ന ഘടനയിൽ അവസാനഭാഗത്തെ ക്രിയാലോപം മലയാളത്തിൽ സ്വാഭാവികമാണ്.
  terminology: ‘പത്രൊസ്,’ ‘സാത്താനേ,’ ‘ഇടർച്ചക്കല്ല്,’ ‘ദൈവത്തിന്റെ കാര്യങ്ങൾ,’ ‘മനുഷ്യരുടെ കാര്യങ്ങൾ’ എന്നിവ സ്ഥാപിതവും ഉചിതവുമായ പദപ്രയോഗങ്ങളാണ്. ἀνθρώπων-നെ ‘മനുഷ്യരുടെ’ എന്നു നൽകുന്നത് ഗ്രീക്കിലെ പൊതുമനുഷ്യസൂചനയെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു; ലിംഗപരമായ അനാവശ്യ നിർവചനം വരുത്തുന്നില്ല.
