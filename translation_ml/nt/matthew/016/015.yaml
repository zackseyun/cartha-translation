  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ചരിത്രവർത്തമാനത്തിന്റെ സജീവത സംരക്ഷിച്ചു; ഗ്രീക്ക് വാക്യഘടനയുടെ അസ്വാഭാവികമായ പദാനുപദ പകർപ്പ് മുഖ്യവാചകത്തിൽ ഒഴിവാക്കി.
