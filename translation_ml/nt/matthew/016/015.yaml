  text: He says to them[a], “But who do you say that I am?”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറയുന്നു: “എന്നാൽ, ഞാൻ ആരാണെന്നാണ് നിങ്ങൾ പറയുന്നത്?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ ഔപചാരികമായി: “എന്നാൽ നിങ്ങൾ എന്നെ ആരാണെന്നു പറയുന്നു?” ഗ്രീക്കിൽ ‘എന്നെ ... ആയിരിക്കാൻ’ എന്ന തരത്തിലുള്ള accusative-and-infinitive ഘടനയാണ്; മലയാളത്തിൽ അതിനെ സ്വാഭാവികമായി “ഞാൻ ആരാണെന്നാണ്” എന്നു നൽകിയിരിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: ചോദിക്കുന്നു
  rationale: λέγει എന്നത് അക്ഷരാർഥത്തിൽ ‘പറയുന്നു’ എന്നാണ്; എന്നാൽ നേരിട്ടുള്ള ചോദ്യം അവതരിപ്പിക്കുന്ന ഈ സാഹചര്യത്തിൽ സ്വാഭാവികമായ മലയാളം ‘ചോദിക്കുന്നു’ എന്നതാണ്. ഗ്രീക്കിലെ ചരിത്രവർത്തമാനകാലത്തിന്റെ സജീവത നിലനിർത്താൻ വർത്തമാനകാലം ഉപയോഗിച്ചു.
- source_word: αὐτοῖς
  choice: അവരോടു
  rationale: സംസാരത്തിന്റെ പരോക്ഷ കർമമായ ദത്തിവ് ബഹുവചന സർവനാമത്തെ സ്വാഭാവിക മലയാളത്തിൽ ‘അവരോടു’ എന്നു നൽകി.
- source_word: Ὑμεῖς
  choice: നിങ്ങൾ
  rationale: ഗ്രീക്കിലെ വ്യക്തമായി ചേർത്തിരിക്കുന്ന സർവനാമത്തിന് ഊന്നലുണ്ട്. മുൻപറഞ്ഞ മറ്റുള്ളവരുടെ അഭിപ്രായത്തോടുള്ള വൈരുധ്യം ‘എന്നാൽ’ എന്നതിനോടൊപ്പം ‘നിങ്ങൾ’ എന്ന വ്യക്തമായ പ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭത്തിലെ ജനങ്ങളുടെ അഭിപ്രായവും ശിഷ്യന്മാരുടെ സ്വന്തം വിലയിരുത്തലും തമ്മിലുള്ള വൈരുധ്യം സൂചിപ്പിക്കുന്നു.
- source_word: τίνα
  choice: ആർ
  rationale: അസ്തിത്വക്രിയയോടു ചേർന്ന വിധേയപൂരകമായതിനാൽ ആധുനിക മലയാളത്തിൽ ‘ആർ’ സ്വാഭാവികമാണ്.
- source_word: με
  choice: ഞാൻ
  rationale: ഗ്രീക്കിൽ infinitive-ന്റെ accusative subject ആയ με, മലയാളത്തിലെ പരോക്ഷവാക്യഘടനയിൽ ‘ഞാൻ’ എന്ന കർത്തൃരൂപമായി സ്വാഭാവികമായി മാറുന്നു.
- source_word: λέγετε
  choice: നിങ്ങൾ പറയുന്നത്
  rationale: രണ്ടാംപുരുഷ ബഹുവചന വർത്തമാനക്രിയയുടെ അർഥം മലയാളത്തിലെ ‘എന്നാണ് ... പറയുന്നത്?’ എന്ന ചോദ്യഘടനയിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: εἶναι
  choice: ആണെന്നാണ്
  rationale: ഗ്രീക്കിലെ accusative-and-infinitive പരോക്ഷവാക്യഘടനയെ മലയാളത്തിൽ സ്വാഭാവികമായ finite reported-clause രൂപമായ ‘ആണെന്നാണ്’ എന്നു പുനഃസംഘടിപ്പിച്ചു.
theological_decisions:
- issue: ശിഷ്യന്മാരുടെ സ്വന്തം വിലയിരുത്തലിനുള്ള ഊന്നൽ
  choice: “എന്നാൽ ഞാൻ ആരാണെന്നാണ് നിങ്ങൾ പറയുന്നത്?”
  alternative: “എന്നാൽ നിങ്ങൾ, ഞാൻ ആരാണെന്നു പറയുന്നു?”
  rationale: ഈ വാക്യം മറ്റുള്ളവരുടെ അഭിപ്രായത്തിൽനിന്ന് ശിഷ്യന്മാരുടെ നിലപാടിലേക്കു തിരിയുന്നു. തെരഞ്ഞെടുത്ത രൂപം ആ വൈരുധ്യവും ‘നിങ്ങൾ’ എന്ന ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; അടുത്ത വാക്യത്തിലെ വിശ്വാസപ്രഖ്യാപനം മുൻകൂട്ടി ചേർക്കുന്നില്ല.
