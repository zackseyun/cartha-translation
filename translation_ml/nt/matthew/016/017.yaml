source:
  edition: SBLGNT
  text: ⸂ἀποκριθεὶς δὲ⸃ ὁ Ἰησοῦς εἶπεν αὐτῷ· Μακάριος εἶ, Σίμων Βαριωνᾶ, ὅτι σὰρξ καὶ αἷμα οὐκ ἀπεκάλυψέν σοι ἀλλ’ ὁ πατήρ μου ὁ ἐν τοῖς οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/017.yaml
  text: And Jesus answered him[a], “Blessed are you, Simon Bar-Jonah, because flesh and blood did not reveal this to you[c][b], but my Father who is in heaven did.”
translation:
  language: ml
  text: 'യേശു അവനോടു മറുപടി പറഞ്ഞു: “ശിമോൻ ബർ-യോനാ[a], നീ ധന്യൻ! എന്തെന്നാൽ, ഇതു നിനക്കു വെളിപ്പെടുത്തിയത് മാംസവും രക്തവുമല്ല[b], സ്വർഗത്തിലുള്ള[c] എന്റെ പിതാവാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘യോനായുടെ മകൻ ശിമോൻ.’ ഗ്രീക്ക് പാഠം അരമായ പിതൃനാമരൂപമായ ‘ബർ-യോനാ’ നിലനിർത്തുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘മാംസവും രക്തവും’ എന്നത് മനുഷ്യരെയോ കേവലം മാനുഷികമായ ഉറവിടത്തെയോ സൂചിപ്പിക്കുന്ന ഒരു ശൈലീപ്രയോഗമാണ്.
    reason: cultural_note
  - marker: c
    text: അക്ഷരാർഥത്തിൽ ‘സ്വർഗങ്ങളിൽ ഉള്ളവൻ’; സ്വാഭാവിക മലയാളപ്രയോഗമായി പ്രധാനപാഠത്തിൽ ‘സ്വർഗത്തിലുള്ള’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν αὐτῷ
  choice: അപ്പോൾ യേശു അവനോടു മറുപടി പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ പങ്കാളിക്രിയയും സമാപികക്രിയയും ചേർന്ന പ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘മറുപടി പറഞ്ഞു’ എന്നു നൽകി; δέ ആഖ്യാനത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്ന ‘അപ്പോൾ’ എന്നതിലൂടെ പ്രതിഫലിപ്പിച്ചു.
- source_word: Μακάριος
  choice: ധന്യൻ
  rationale: ‘സന്തോഷവാൻ’ എന്ന മാനസികാവസ്ഥയെക്കാൾ വിശാലമായ അനുഗൃഹീതാവസ്ഥയും ആദരണീയമായ വേദപുസ്തകശൈലിയും ‘ധന്യൻ’ നിലനിർത്തുന്നു; ദൈവിക പ്രവർത്തനം വ്യാകരണത്തിൽ അനാവശ്യമായി കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: Σίμων Βαριωνᾶ
  choice: ശിമോൻ ബർ-യോനാ
  rationale: ഗ്രീക്ക് പാഠത്തിൽ സംരക്ഷിക്കപ്പെട്ടിരിക്കുന്ന അരമായ പിതൃനാമരൂപം ലിപ്യന്തരണം ചെയ്തു; അതിന്റെ അർഥം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: ὅτι
  choice: എന്തെന്നാൽ
  rationale: ശിമോൻ ധന്യനാണെന്ന പ്രഖ്യാപനത്തിന്റെ കാരണം ഇവിടെ അവതരിപ്പിക്കുന്നതിനാൽ കാരണബന്ധം വ്യക്തമായി സൂചിപ്പിച്ചു.
- source_word: σὰρξ καὶ αἷμα
  choice: മാംസവും രക്തവും
  rationale: മനുഷ്യരെയോ കേവലം മാനുഷികമായ ഉറവിടത്തെയോ സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിലെ ദൃശ്യമായ ശൈലീപ്രയോഗം അതേ രൂപത്തിൽ നിലനിർത്തി.
- source_word: ἀπεκάλυψέν σοι
  choice: ഇതു നിനക്കു വെളിപ്പെടുത്തിയത്
  rationale: ἀποκαλύπτω എന്നതിന്റെ വെളിപ്പെടുത്തൽസൂചന നിലനിർത്തി; സന്ദർഭത്തിൽ വ്യക്തമായ മുൻപ്രസ്താവനയെ ചൂണ്ടാൻ മലയാളത്തിൽ ആവശ്യമായ ‘ഇതു’ ചേർത്തു.
- source_word: ἀλλ’ ὁ πατήρ μου
  choice: സ്വർഗത്തിലുള്ള എന്റെ പിതാവാണ്
  rationale: മാനുഷിക ഉറവിടവും പിതാവും തമ്മിലുള്ള ശക്തമായ വൈരുധ്യം ‘അല്ല ... ആണ്’ എന്ന സ്വാഭാവിക മലയാളഘടനയിൽ വ്യക്തമാക്കി.
- source_word: ὁ ἐν τοῖς οὐρανοῖς
  choice: സ്വർഗത്തിലുള്ള
  rationale: ഗ്രീക്കിൽ ബഹുവചനമാണെങ്കിലും സാധാരണ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ ഏകവചനരൂപം പ്രധാനപാഠത്തിൽ ഉപയോഗിച്ചു; മൂലരൂപം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
theological_decisions:
- issue: പത്രോസിന്റെ ഏറ്റുപറച്ചിലിന്റെ അറിവുറവിടം
  choice: ‘മാംസവും രക്തവും’ എന്ന മാനുഷിക ഉറവിടത്തെ പിതാവിന്റെ വെളിപ്പെടുത്തലുമായി വൈരുധ്യപ്പെടുത്തി.
  alternative: ഇത് പത്രോസിന്റെ സ്വന്തം സ്വാഭാവിക ചിന്തയെ മാത്രം സൂചിപ്പിക്കുന്നു; അല്ലെങ്കിൽ ഒരു മനുഷ്യഗുരുവിനെയോ അധികാരിയെയോ മാത്രം സൂചിപ്പിക്കുന്നു.
  rationale: ശൈലീപ്രയോഗം മാനുഷിക ഉറവിടത്തെ പൊതുവായി ഒഴിവാക്കുന്നു; വെളിപ്പെടുത്തലിന്റെ ഒരു സമ്പൂർണ സിദ്ധാന്തം ഇവിടെ നിർവചിക്കാതെ, ഈ പ്രത്യേക അറിവ് പിതാവിൽനിന്നാണെന്ന പാഠത്തിന്റെ അവകാശവാദം മാത്രം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തോടൊപ്പം ഗൗരവവും വേദപുസ്തകയോഗ്യമായ ഭാവവും നിലനിർത്തി. ‘ധന്യൻ,’ ‘വെളിപ്പെടുത്തിയത്,’ ‘എന്റെ പിതാവ്’ തുടങ്ങിയ പദങ്ങൾ തത്ത്വശാസ്ത്രഭാരം സംരക്ഷിക്കുമ്പോഴും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാണ്. അരമായ പേരുരൂപവും ‘മാംസവും രക്തവും’ എന്ന മൂലശൈലീപ്രയോഗവും സംരക്ഷിച്ച് ആവശ്യമായ വിശദീകരണം അടിക്കുറിപ്പുകളിൽ നൽകി.
