id: MAT.16.25
reference: Matthew 16:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃς γὰρ ⸀ἐὰν θέλῃ τὴν ψυχὴν αὐτοῦ σῶσαι ἀπολέσει αὐτήν· ὃς δ’ ἂν ἀπολέσῃ τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ εὑρήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/025.yaml
  text: For whoever wants to save his life will lose it[a], but whoever loses his life for my sake will find it.
translation:
  language: ml
  text: എന്തെന്നാൽ, തന്റെ ജീവൻ രക്ഷിക്കാൻ ആഗ്രഹിക്കുന്നവൻ അതു നഷ്ടപ്പെടുത്തും; എന്നാൽ എനിക്കുവേണ്ടി തന്റെ ജീവൻ നഷ്ടപ്പെടുത്തുന്നവൻ അതു കണ്ടെത്തും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ വാക്യത്തിലുടനീളം ‘ജീവൻ’ എന്നതിനു പകരം ‘പ്രാണൻ’ എന്നും പരിഭാഷപ്പെടുത്താം; ψυχή എന്ന ഗ്രീക്ക് പദത്തിന് സന്ദർഭമനുസരിച്ച് ‘ജീവൻ,’ ‘സ്വയം,’ ‘ആത്മാവ്’ എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς γὰρ ἐὰν / ὃς δ’ ἂν
  choice: എന്തെന്നാൽ, ... ആഗ്രഹിക്കുന്നവൻ / എന്നാൽ ... നഷ്ടപ്പെടുത്തുന്നവൻ
  rationale: അനിശ്ചിത പൊതുനിബന്ധന മലയാളത്തിൽ ‘...വൻ’ എന്ന ഘടനയിൽ സ്വാഭാവികമായി വരുന്നു. γάρ മുൻവാക്യത്തോടുള്ള ബന്ധമായി ‘എന്തെന്നാൽ’ എന്നും δέ വിരുദ്ധത സൂചിപ്പിക്കാൻ ‘എന്നാൽ’ എന്നും പരിഭാഷപ്പെടുത്തി.
- source_word: θέλῃ
  choice: ആഗ്രഹിക്കുന്ന
  rationale: ഇവിടെ θέλω ഇച്ഛയെയോ മനസ്സിനെയോ സൂചിപ്പിക്കുന്നു; ‘ആഗ്രഹിക്കുന്ന’ ആ അർഥം മാന്യവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ψυχὴν
  choice: ജീവൻ
  rationale: ശിഷ്യത്വത്തിന്റെയും മരണം നേരിടുന്നതിന്റെയും പശ്ചാത്തലത്തിൽ ψυχή ഒരാളുടെ ജീവനെ സൂചിപ്പിക്കുന്നു. ‘രക്ഷിക്കുക—നഷ്ടപ്പെടുത്തുക—കണ്ടെത്തുക’ എന്ന വിരോധാഭാസത്തോടും ‘ജീവൻ’ നന്നായി ചേരുന്നു; ‘പ്രാണൻ/ആത്മാവ്’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: σῶσαι
  choice: രക്ഷിക്കാൻ
  rationale: σῴζω എന്നതിന്റെ അടിസ്ഥാനമായ ‘രക്ഷിക്കുക/കാത്തുസൂക്ഷിക്കുക’ എന്ന അർഥം നേരിട്ട് നൽകുകയും തുടർന്നുള്ള ‘നഷ്ടപ്പെടുത്തുക’ എന്നതിനോടുള്ള വൈരുധ്യം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀπολέσει / ἀπολέσῃ
  choice: നഷ്ടപ്പെടുത്തും / നഷ്ടപ്പെടുത്തുന്നവൻ
  rationale: ഈ സന്ദർഭത്തിൽ ἀπόλλυμι നശിപ്പിക്കൽ എന്നതിലുപരി ജീവൻ നഷ്ടപ്പെടുന്നതാണ് സൂചിപ്പിക്കുന്നത്. ആദ്യത്തേതിലെ ഭാവികാലവും രണ്ടാമത്തേതിലെ പൊതുനിബന്ധനയും മലയാളത്തിൽ സ്വാഭാവികമായി വേർതിരിച്ചു.
- source_word: ἕνεκεν ἐμοῦ
  choice: എനിക്കുവേണ്ടി
  rationale: ἕνεκεν ἐμοῦ കാരണമോ നിമിത്തമോ സൂചിപ്പിക്കുന്നു; ‘എനിക്കുവേണ്ടി’ യേശുവിനോടുള്ള വ്യക്തിപരമായ നിഷ്ഠയുടെ ആശയം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: εὑρήσει
  choice: കണ്ടെത്തും
  rationale: εὑρίσκωയുടെ നേരിട്ടുള്ള അർഥമായ ‘കണ്ടെത്തുക’ നിലനിർത്തി വാക്യത്തിലെ വിരോധാഭാസത്തിന് വ്യാഖ്യാനവിപുലീകരണം ചേർക്കുന്നില്ല.
- source_word: αὐτοῦ / αὐτήν
  choice: തന്റെ / അതു
  rationale: ആവർത്തിക്കുന്ന ഏകവചന പൊതുസൂചനയ്ക്ക് മലയാളത്തിലെ ലിംഗനിരപേക്ഷമായ ‘തന്റെ’ സ്വാഭാവികമാണ്; ‘അതു’ മുമ്പുള്ള ‘ജീവൻ’ എന്നതിലേക്കു വ്യക്തമായി മടങ്ങുന്നു.
theological_decisions:
- issue: ശിഷ്യത്വസംബന്ധമായ വിരോധാഭാസത്തിൽ ψυχήയുടെ പരിഭാഷ
  choice: ജീവൻ
  alternative: പ്രാണൻ; ആത്മാവ്; സ്വയം
  rationale: ഈ വാക്യത്തിൽ ψυχήയെ രക്ഷിക്കുക, നഷ്ടപ്പെടുത്തുക, കണ്ടെത്തുക എന്ന ക്രിയകളോടൊപ്പം ഉപയോഗിക്കുന്നതിനാൽ ‘ജീവൻ’ സന്ദർഭത്തിന് ഏറ്റവും യോജിക്കുന്നു. എന്നാൽ ഈ ഗ്രീക്ക് പദത്തിന്റെ അർഥവ്യാപ്തി ഭൗതികജീവിതത്തിൽ മാത്രം ഒതുങ്ങാത്തതിനാൽ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘തന്റെ’ എന്ന പ്രയോഗം ഗ്രീക്കിലെ പ്രതിനിധിയായ ഏകവചനത്തെ ലിംഗഭാരം കൂടാതെ സ്വാഭാവികമായി നൽകുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം വാക്യാവസാനത്ത് ചേർത്ത് പദത്തിന്റെ മുഴുവൻ വാക്യത്തിലുമുള്ള ആവർത്തനത്തെ സൂചിപ്പിക്കുന്നു.
