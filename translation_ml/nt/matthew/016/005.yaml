translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഗ്രീക്ക് വാക്യത്തിന്റെ ആഖ്യാനക്രമവും സംക്ഷിപ്തതയും നിലനിർത്തി; അനാവശ്യമായി സൂചിപ്പിച്ച കർത്തൃസർവനാമം ഒഴിവാക്കാതെ പ്രധാന ക്രിയയിൽ ‘അവർ’ ചേർത്തത് വ്യക്തതയ്ക്കാണ്.
