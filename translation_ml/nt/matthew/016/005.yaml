  source_fidelity: ഗ്രീക്ക് വാക്യത്തിലെ കാലബന്ധം (‘എത്തിയപ്പോൾ’), സ്ഥലസൂചന (‘മറുകരയിൽ’), കർത്താവ് (‘ശിഷ്യന്മാർ’), മറവിയുടെ മുൻകാലഭാവം (‘മറന്നുപോയിരുന്നു’), യാത്രയ്ക്കായി അപ്പം കൂടെ എടുക്കാതിരുന്നതിന്റെ ആശയം എന്നിവ വിശ്വസ്തമായി പകരുന്നു. ‘കൊണ്ടുപോകാൻ’ λαβεῖν-ന്റെ സന്ദർഭോചിതമായ ‘കൂടെ എടുക്കുക’ എന്ന അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു.
  naturalness: വാചകം ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ ലളിതവും ഒഴുക്കുള്ളതുമാണ്. ‘അവർ’ ചേർക്കുന്നത് അനാവശ്യമായ ഭാരമുണ്ടാക്കുന്നില്ല; കർത്തൃവ്യക്തത നിലനിർത്തുന്നു.
  terminology: ‘ശിഷ്യന്മാർ’ സുവിശേഷസന്ദർഭത്തിന് സ്ഥാപിതവും യോജിച്ചതുമായ പദമാണ്. ‘അപ്പം’ മലയാള ബൈബിൾപ്രയോഗത്തിൽ bread എന്ന പൊതുവായ അർത്ഥത്തിൽ സ്വീകാര്യമാണ്; ഗ്രീക്കിലെ ബഹുവചനത്തെ മലയാളത്തിലെ പൊതുഭക്ഷണനാമപ്രയോഗത്തിലൂടെ സ്വാഭാവികമായി അവതരിപ്പിച്ചിരിക്കുന്നു. അധിക അടിക്കുറിപ്പ് നിർബന്ധമല്ല.
