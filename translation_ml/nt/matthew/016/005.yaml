id: MAT.16.5
reference: Matthew 16:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἐλθόντες οἱ ⸀μαθηταὶ εἰς τὸ πέραν ἐπελάθοντο ἄρτους λαβεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/005.yaml
  text: And when the disciples came to the other side[a], they had forgotten to take bread.
translation:
  language: ml
  text: ശിഷ്യന്മാർ മറുകരയിൽ എത്തിയപ്പോൾ, അപ്പം കൊണ്ടുപോകാൻ അവർ മറന്നുപോയിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθόντες
  choice: എത്തിയപ്പോൾ
  rationale: പ്രധാന ക്രിയയോടുള്ള കാലസംബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്ന വിധത്തിൽ ഭൂതകാല ക്രിയാവിശേഷണരൂപം പരിഭാഷപ്പെടുത്തി.
- source_word: οἱ μαθηταὶ
  choice: ശിഷ്യന്മാർ
  rationale: സുവിശേഷസന്ദർഭത്തിൽ യേശുവിന്റെ ശിഷ്യരെ സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾ ഭാഷയിലും പൊതുവ്യവഹാരത്തിലും സ്ഥാപിതമായ പദം.
- source_word: εἰς τὸ πέραν
  choice: മറുകരയിൽ
  rationale: തടാകത്തിന്റെ അപ്പുറത്തെ കരയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന് സ്വാഭാവികവും സന്ദർഭോചിതവുമായ മലയാളരൂപം.
- source_word: ἐπελάθοντο
  choice: മറന്നുപോയിരുന്നു
  rationale: അവർ എത്തിയ സമയത്തിനു മുമ്പേ അപ്പം എടുക്കാതെ പോയെന്ന ആഖ്യാനക്രമം മലയാളത്തിലെ പൂർവഭൂതകാലസദൃശ രൂപം വ്യക്തമാക്കുന്നു.
- source_word: ἄρτους
  choice: അപ്പം
  rationale: ഗ്രീക്കിൽ ബഹുവചനമായിരുന്നാലും, ഭക്ഷണസാധനത്തെ പൊതുവായി സൂചിപ്പിക്കുമ്പോൾ മലയാളത്തിൽ ഏകവചന ദ്രവ്യനാമസദൃശമായ ‘അപ്പം’ സ്വാഭാവികമാണ്; അർത്ഥം നഷ്ടപ്പെടുന്നില്ല.
- source_word: λαβεῖν
  choice: കൊണ്ടുപോകാൻ
  rationale: യാത്രയിൽ കൂടെ എടുക്കുക എന്ന സന്ദർഭാർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘എടുക്കാൻ’ എന്നതിനെക്കാൾ ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള കൊണ്ടുപോക്ക് ഇവിടെ വ്യക്തമാണ്.
