id: MAT.16.7
reference: Matthew 16:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ διελογίζοντο ἐν ἑαυτοῖς λέγοντες ὅτι Ἄρτους οὐκ ἐλάβομεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/007.yaml
  text: And they were discussing among themselves[a], saying, “We did not bring bread.”
translation:
  language: ml
  text: 'അവർ തമ്മിൽ ഇങ്ങനെ ചർച്ചചെയ്തുകൊണ്ടിരുന്നു: “നാം അപ്പം കൊണ്ടുവന്നില്ല.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നാം അപ്പം കൂടെ എടുത്തില്ല.”
    reason: λαμβάνω എന്ന ക്രിയയുടെ കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള, യാത്രയ്ക്കൊപ്പം എടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന പരിഭാഷ രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: οἱ δὲ
  choice: അവർ
  rationale: δέ ഇവിടെ ശക്തമായ വൈരുധ്യമല്ല, കഥയുടെ ഒഴുക്കിലെ മൃദുവായ ബന്ധകമാണ്; മലയാളത്തിൽ പ്രത്യേക ബന്ധകപദം ചേർക്കാതിരിക്കുന്നത് സ്വാഭാവികമാണ്.
- source_word: διελογίζοντο
  choice: ആലോചിച്ചുകൊണ്ട്
  rationale: അപൂർണ ഭൂതകാലരൂപം തുടരുന്ന പരസ്പര വിചാരവിനിമയത്തെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ ‘ആലോചിച്ചുകൊണ്ട്’ എന്നത് ചർച്ചയും നിഗമനശ്രമവും സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: ἐν ἑαυτοῖς
  choice: തമ്മിൽ
  rationale: ശിഷ്യന്മാർ സ്വന്തം കൂട്ടത്തിനുള്ളിൽ നടത്തിയ സംഭാഷണമാണെന്ന് ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: λέγοντες
  choice: എന്നു പറഞ്ഞു
  rationale: അവരുടെ ആലോചനയുടെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന പങ്കാളിക്രിയയെ സ്വാഭാവിക മലയാള ആഖ്യാനരീതിയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ὅτι
  choice: ഉദ്ധരിച്ച വാക്കുകളുടെ ആമുഖമായി ‘എന്നു’
  rationale: ഇവിടെ ὅτι അവരുടെ ആലോചനയുടെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു. ‘അതുകൊണ്ടാണ്’ എന്ന കാരണവ്യാഖ്യാനം മൂലപാഠത്തിൽ പ്രകടമല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല.
- source_word: Ἄρτους
  choice: അപ്പം
  rationale: ഗ്രീക്കിൽ ബഹുവചനമാണെങ്കിലും ഇവിടെ യാത്രയ്ക്കുള്ള ഭക്ഷണസാധനമായി അപ്പത്തെ പൊതുവായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഏകവചന സമാഹാരപ്രയോഗം സ്വാഭാവികമാണ്.
- source_word: οὐκ ἐλάβομεν
  choice: കൂടെ കൊണ്ടുവന്നില്ല
  rationale: യാത്രാസന്ദർഭത്തിൽ λαμβάνω എന്നത് ‘കൂടെ എടുക്കുക/കൊണ്ടുവരുക’ എന്ന അർഥം നൽകുന്നു. ‘കൊണ്ടുവന്നില്ല’ മലയാളത്തിൽ ഉദ്ദേശ്യം വ്യക്തമായി അറിയിക്കുന്നു; ‘എടുത്തില്ല’ എന്നത് ‘ഭക്ഷിച്ചില്ല’ എന്നും തെറ്റിദ്ധരിക്കപ്പെടാം.
theological_decisions:
- issue: ὅτι സൂചിപ്പിക്കുന്ന ബന്ധം
  choice: അവരുടെ വാക്കുകളുടെ ഉള്ളടക്കം മാത്രം അവതരിപ്പിക്കുക
  alternative: “അപ്പം കൊണ്ടുവരാതിരുന്നതുകൊണ്ടാണ്” എന്ന് വ്യക്തമായ കാരണബന്ധമായി വിപുലീകരിക്കുക
  rationale: വാക്യസന്ദർഭം കാരണനിഗമനം സൂചിപ്പിക്കാമെങ്കിലും, ഈ വാക്യത്തിലെ ഗ്രീക്ക് വാചകം ‘നാം അപ്പം എടുത്തില്ല’ എന്ന അവരുടെ വാക്കുകൾ മാത്രമാണ് നേരിട്ട് നൽകുന്നത്. അതിനാൽ വ്യാഖ്യാനാത്മകമായ കാരണം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. തുടരുന്ന പരസ്പര ആലോചനയെ നിലനിർത്തുകയും, മൂലപാഠത്തിൽ തുറന്നുപറയാത്ത കാരണവ്യാഖ്യാനം ഒഴിവാക്കുകയും ചെയ്തു.
