id: MAT.16.8
reference: Matthew 16:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: γνοὺς δὲ ὁ Ἰησοῦς ⸀εἶπεν· Τί διαλογίζεσθε ἐν ἑαυτοῖς, ὀλιγόπιστοι, ὅτι ἄρτους οὐκ ⸀ἐλάβετε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/008.yaml
  text: But Jesus[a], knowing this, said, “Why are you discussing among yourselves, you of little faith, that you have no bread?”
translation:
  language: ml
  text: 'ഇതു മനസ്സിലാക്കിയ യേശു പറഞ്ഞു: “അല്പവിശ്വാസികളേ, അപ്പം എടുത്തില്ലെന്നതിനെക്കുറിച്ച് നിങ്ങൾ തമ്മിൽ ചർച്ച ചെയ്യുന്നത് എന്തിന്?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അപ്പങ്ങൾ കൊണ്ടുവന്നില്ലെന്നതിനെക്കുറിച്ച്.”
    reason: ἄρτους എന്നത് അക്ഷരാർഥത്തിൽ ബഹുവചനമായ ‘അപ്പങ്ങൾ’ എന്നും, οὐκ ἐλάβετε ഈ സന്ദർഭത്തിൽ ‘കൊണ്ടുവന്നില്ല’ എന്നും മനസ്സിലാക്കാം.
lexical_decisions:
- source_word: γνοὺς
  choice: ഇതു മനസ്സിലാക്കിയ
  rationale: വസ്തു ഗ്രീക്കിൽ വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും മുൻസന്ദർഭത്തിലെ ശിഷ്യന്മാരുടെ ചർച്ചയെയാണ് സൂചിപ്പിക്കുന്നത്. അഓറിസ്റ്റ് കൃതന്തത്തിന്റെ മുൻകാലബന്ധവും യേശുവിന്റെ ഗ്രഹിക്കലും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ലഘുവായ ആഖ്യാനമാറ്റം സൂചിപ്പിക്കുന്ന δὲ മലയാളത്തിലെ വാക്യക്രമത്തിൽ സ്വാഭാവികമായി പ്രകടമാകുന്നു; ‘എന്നാൽ’ ചേർത്താൽ ഇവിടെ ആവശ്യത്തിലധികം ശക്തമായ വൈരുധ്യം തോന്നാം.
- source_word: εἶπεν
  choice: പറഞ്ഞു
  rationale: നേരിട്ടുള്ള ചോദ്യത്തിന് മുമ്പുള്ള സാധാരണ ആഖ്യാനപ്രയോഗം.
- source_word: Τί
  choice: എന്തിന്
  rationale: διαλογίζεσθε എന്ന ക്രിയയോടും ὅτι-വാക്യത്തോടും ചേർന്ന് ചർച്ചയുടെ കാരണമാണ് ചോദിക്കുന്നത്; അതിനാൽ മലയാളത്തിൽ ‘എന്തിന്’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: διαλογίζεσθε
  choice: ചർച്ച ചെയ്യുന്നത്
  rationale: ശിഷ്യന്മാർ പരസ്പരം ആലോചിക്കുന്നതോ ചർച്ച ചെയ്യുന്നതോ ആണ് സന്ദർഭം. ഈ രൂപം സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമാണ്.
- source_word: ἐν ἑαυτοῖς
  choice: നിങ്ങൾ തമ്മിൽ
  rationale: ‘തങ്ങളുടെയുള്ളിൽ’ എന്നും ‘പരസ്പരം’ എന്നും അർത്ഥസാധ്യതയുണ്ടെങ്കിലും മുൻസന്ദർഭത്തിലെ കൂട്ടചർച്ചയ്ക്ക് ‘നിങ്ങൾ തമ്മിൽ’ യോജിക്കുന്നു.
- source_word: ὀλιγόπιστοι
  choice: അല്പവിശ്വാസികളേ
  rationale: മത്തായിയുടെ സവിശേഷമായ നേരിട്ടുള്ള ശാസനയും വിശ്വാസത്തിന്റെ അപര്യാപ്തതയെന്ന ആശയവും ചുരുക്കമായും ഗൗരവത്തോടെയും നിലനിർത്തുന്നു.
- source_word: ὅτι
  choice: എന്നതിനെക്കുറിച്ച്
  rationale: ശിഷ്യന്മാരുടെ ചർച്ചയുടെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നതായി എടുത്തിരിക്കുന്നു. മലയാളത്തിൽ ‘എന്നതിനെക്കുറിച്ച്’ എന്ന ഘടന ചോദ്യം സ്വാഭാവികമാക്കുന്നു.
- source_word: ἄρτους
  choice: അപ്പം
  rationale: ഗ്രീക്കിൽ ബഹുവചനമാണെങ്കിലും മലയാളത്തിൽ ഭക്ഷ്യവസ്തുവിനെ പൊതുവായി സൂചിപ്പിക്കാൻ ഏകവചനസമാനമായ ‘അപ്പം’ സ്വാഭാവികമാണ്; അക്ഷരാർഥമായ ബഹുവചനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: οὐκ ἐλάβετε
  choice: എടുത്തില്ല
  rationale: λαμβάνω എന്നതിന്റെ അടിസ്ഥാനമായ ‘എടുക്കുക’ എന്ന ആശയം നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ കൂടെ കൊണ്ടുവരാതിരുന്നതാണ് ഉദ്ദേശ്യമാകാമെങ്കിലും അതിനെ മുഖ്യവാചകത്തിൽ നിർബന്ധമായി വ്യാഖ്യാനിക്കുന്നില്ല.
theological_decisions:
- issue: ὀλιγόπιστοι എന്ന ശാസനയുടെ ശക്തി
  choice: ‘അല്പവിശ്വാസികളേ’ എന്നു നേരിട്ടുള്ള ശാസനയായി നിലനിർത്തി.
  alternative: വിശ്വാസത്തെ പരാമർശിക്കാതെ വെറും തെറ്റിദ്ധാരണയെ സൂചിപ്പിക്കുന്ന മൃദുവായ വിവർത്തനം.
  rationale: ഈ പദം സാഹചര്യത്തിലെ ശിഷ്യന്മാരുടെ അപര്യാപ്തമായ വിശ്വാസത്തെയോ ആശ്രയത്തെയോ നേരിട്ട് വിമർശിക്കുന്നു; അതിനപ്പുറമുള്ള സിദ്ധാന്തവ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
- issue: οὐκ ἐλάβετε എന്നതിന്റെ സന്ദർഭാർഥം
  choice: ‘എടുത്തില്ല’ എന്ന കൂടുതൽ രൂപസമീപമായ പരിഭാഷ മുഖ്യവാചകത്തിൽ നൽകി.
  alternative: ‘കൊണ്ടുവന്നില്ല’ അല്ലെങ്കിൽ ‘അപ്പം ഇല്ല’ എന്ന് സന്ദർഭാർഥം തുറന്നുപറയുക.
  rationale: ഗ്രീക്ക് ക്രിയയുടെ ‘എടുക്കുക/സ്വീകരിക്കുക’ എന്ന വ്യാപ്തി നിലനിർത്തുകയും, അപ്പം കൂടെ കൊണ്ടുവരാതിരുന്നതെന്ന സാധ്യത അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗ്രീക്കിലെ ചോദ്യം നേരായ രീതിയിൽ നിലനിർത്തി; സന്ദർഭവ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ അമിതമായി ചേർക്കാതെ അടിക്കുറിപ്പിൽ നൽകി.
