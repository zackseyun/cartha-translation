id: MAT.16.4
reference: Matthew 16:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Γενεὰ πονηρὰ καὶ μοιχαλὶς σημεῖον ἐπιζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον ⸀Ἰωνᾶ. καὶ καταλιπὼν αὐτοὺς ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/004.yaml
  text: An evil and adulterous generation seeks a sign[a], and no sign will be given to it except the sign of Jonah. And leaving them[b], he went away.
translation:
  language: ml
  text: ദുഷ്ടയും വ്യഭിചാരിണിയുമായ[a] ഒരു തലമുറ അടയാളം അന്വേഷിക്കുന്നു; യോനായുടെ അടയാളമല്ലാതെ[b] അതിനു ഒരു അടയാളവും നൽകപ്പെടുകയില്ല. അവരെ വിട്ട് അവൻ പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവിശ്വസ്തമായ തലമുറ.’ ഗ്രീക്കിൽ അക്ഷരാർഥം ‘വ്യഭിചാരിണി’ എന്നാണ്; ഉടമ്പടിയോടുള്ള അവിശ്വസ്തതയെ വ്യഭിചാരമായി ചിത്രീകരിക്കുന്ന പ്രവാചകഭാഷയുടെ പ്രതിധ്വനി ഇതിലുണ്ടാകാം.
    reason: lexical_alternative
  - marker: b
    text: '‘യോനായുടെ അടയാളം’ മത്തായി 12:39–40-ൽ വിശദീകരിക്കുന്നു: യോനാ വലിയ മത്സ്യത്തിന്റെ വയറ്റിൽ മൂന്നു രാവും മൂന്നു പകലും ആയിരുന്നതിന്റെ മാതൃക അവിടെ മനുഷ്യപുത്രനോടു ബന്ധപ്പെടുത്തി പ്രയോഗിക്കുന്നു.'
    reason: cross_reference
lexical_decisions:
- source_word: Γενεὰ
  choice: തലമുറ
  rationale: മത്തായിയിൽ ഇപ്പോഴത്തെ അവിശ്വാസികളായ ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്ന γενεάയുടെ പതിവാർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: πονηρὰ
  choice: ദുഷ്ടം
  rationale: ധാർമ്മിക തിന്മയെ സൂചിപ്പിക്കുന്ന πονηρός എന്ന പദത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാള പരിഭാഷ.
- source_word: μοιχαλὶς
  choice: വ്യഭിചാരിണി
  rationale: ഗ്രീക്കിലെ വ്യഭിചാരരൂപകം അതിന്റെ കാഠിന്യത്തോടുകൂടെ നിലനിർത്തുന്നു; പ്രവാചകസാഹിത്യത്തിലെ ഉടമ്പടിയോടുള്ള അവിശ്വസ്തതയുടെ പ്രതിധ്വനിയും തുറന്നുവയ്ക്കുന്നു.
- source_word: σημεῖον
  choice: അടയാളം
  rationale: സാക്ഷ്യപ്പെടുത്തുന്ന അത്ഭുതം സന്ദർഭത്തിൽ ഉൾക്കൊള്ളാമെങ്കിലും, ഗ്രീക്ക് വ്യക്തമാക്കാത്ത ‘അത്ഭുത’ എന്ന വിശേഷണം ചേർക്കാതെ അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു.
- source_word: ἐπιζητεῖ
  choice: അന്വേഷിക്കുന്നു
  rationale: തീവ്രമായി തേടുക അല്ലെങ്കിൽ ആവശ്യപ്പെടുക എന്ന അർഥസാധ്യതയുള്ള ക്രിയയ്ക്ക് സന്ദർഭത്തെ അതിവ്യാഖ്യാനിക്കാത്ത സ്വാഭാവിക പരിഭാഷ.
- source_word: δοθήσεται
  choice: നൽകപ്പെടുകയില്ല
  rationale: δίδωμι എന്ന ക്രിയയുടെ ഭാവികാല കർമണിപ്രയോഗത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: αὐτῇ
  choice: അതിനു
  rationale: സ്ത്രീലിംഗ ഏകവചന സർവനാമം γενεάയെയാണ് സൂചിപ്പിക്കുന്നത്; ‘തലമുറ’ എന്ന കൂട്ടനാമത്തോട് ചേർന്ന സ്വാഭാവിക മലയാള പ്രയോഗം.
- source_word: εἰ μὴ
  choice: അല്ലാതെ
  rationale: ഒരു അടയാളം മാത്രമാണ് ഒഴിവ് എന്ന അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: τὸ σημεῖον Ἰωνᾶ
  choice: യോനായുടെ അടയാളം
  rationale: ജനിറ്റീവ് ഘടനയും വാക്യത്തിലുള്ള വ്യാഖ്യാനതുറപ്പില്ലായ്മയും നിലനിർത്തുന്നു.
- source_word: καταλιπὼν
  choice: അവരെ വിട്ട്
  rationale: പ്രധാനക്രിയയ്ക്ക് മുമ്പുള്ള aorist participle സൂചിപ്പിക്കുന്ന മുൻപ്രവർത്തനം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀπῆλθεν
  choice: പോയി
  rationale: അവരിൽനിന്നുള്ള യേശുവിന്റെ പുറപ്പെടൽ ലളിതവും ആധുനികവുമായ ഭാഷയിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ‘വ്യഭിചാരിണിയായ തലമുറ’ എന്നതിന്റെ അർഥം
  choice: വ്യഭിചാരരൂപകം മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
  alternative: ‘അവിശ്വസ്തമായ തലമുറ’ എന്ന് വ്യാഖ്യാനപരമായി പരിഭാഷപ്പെടുത്തുക.
  rationale: പ്രയോഗത്തിന് ആത്മീയമോ ഉടമ്പടിസംബന്ധമായോ അവിശ്വസ്തതയുടെ പ്രതിധ്വനി ഉണ്ടായേക്കാം; എങ്കിലും ഗ്രീക്ക് ഉപയോഗിക്കുന്ന രൂപകം നിലനിർത്തുന്നത് അതിന്റെ ധാർമ്മികവും ദൈവശാസ്ത്രപരവുമായ അർഥവ്യാപ്തി ചുരുക്കാതിരിക്കാൻ സഹായിക്കുന്നു.
- issue: ‘യോനായുടെ അടയാളം’ എന്നതിന്റെ അർഥം
  choice: മുഖ്യപാഠത്തിൽ വിശദീകരണം ചേർക്കാതെ പദപ്രയോഗം നിലനിർത്തി.
  alternative: യേശുവിന്റെ മരണം, അടക്കം, പുനരുത്ഥാനം എന്നിവയെക്കുറിച്ചുള്ള വ്യക്തമായ പരാമർശമായി വികസിപ്പിക്കുക.
  rationale: മത്തായി 12:39–40 ഈ പ്രയോഗത്തിന് വിശദീകരണം നൽകുന്നുവെങ്കിലും, ഈ വാക്യം തന്നെ അത് ചുരുക്കമായി വിടുന്നു; അതിനാൽ വ്യാഖ്യാനം മുഖ്യപാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വ്യഭിചാരിണി’ എന്ന ശക്തമായ രൂപകവും ‘യോനായുടെ അടയാളം’ എന്ന വ്യാഖ്യാനതുറപ്പില്ലാത്ത പ്രയോഗവും സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
