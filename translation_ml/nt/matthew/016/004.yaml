revisions:
- from: ദുഷ്ടവും വ്യഭിചാരിണിയുമായ ഒരു തലമുറ അടയാളം അന്വേഷിക്കുന്നു[a]. എന്നാൽ യോനായുടെ അടയാളമല്ലാതെ മറ്റൊരു അടയാളവും അതിനു നൽകപ്പെടുകയില്ല. പിന്നെ അവൻ അവരെ വിട്ട് പോയി.[b]
