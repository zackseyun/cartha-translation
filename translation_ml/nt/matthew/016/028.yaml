id: MAT.16.28
reference: Matthew 16:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ⸀ὅτι εἰσίν τινες ⸂τῶν ὧδε ἑστώτων⸃ οἵτινες οὐ μὴ γεύσωνται θανάτου ἕως ἂν ἴδωσιν τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐν τῇ βασιλείᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/028.yaml
  text: Truly I tell you[c][b][a], there are some standing here who will certainly not taste death until they see the Son of Man coming in his kingdom.
translation:
  language: ml
  text: '“സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: ഇവിടെ നിൽക്കുന്നവരിൽ ചിലർ മനുഷ്യപുത്രൻ തന്റെ രാജ്യത്തിൽ[c] വരുന്നത്[b] കാണുന്നതുവരെ തീർച്ചയായും മരണം രുചിക്കുകയില്ല[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഒരുവിധത്തിലും മരണം രുചിക്കുകയില്ല” എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്കിൽ ഊന്നിയ നിഷേധമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: “മനുഷ്യപുത്രൻ തന്റെ രാജ്യത്തിൽ വരുന്നത്” രൂപാന്തരം, പുനരുത്ഥാനവും മഹത്വീകരണവും, യെരൂശലേമിന്മേലുള്ള ന്യായവിധി, അല്ലെങ്കിൽ അന്ത്യകാല വരവ് എന്നിവയിൽ ഏതിനെ സൂചിപ്പിക്കുന്നു എന്നു വാക്യം തന്നെ വ്യക്തമാക്കുന്നില്ല.
    reason: alternative_reading
  - marker: c
    text: “തന്റെ രാജവാഴ്ചയിൽ” അല്ലെങ്കിൽ “തന്റെ രാജകീയ ഭരണത്തിൽ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: സത്യമായി
  rationale: അധികാരപൂർവമായ ഒരു ഗൗരവപ്രഖ്യാപനത്തിന് തുടക്കം കുറിക്കുന്ന ഉറപ്പിക്കൽപദത്തിന്റെ ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: നേരിട്ടുള്ള അഭിസംബോധനയും വർത്തമാനകാല പ്രഖ്യാപനത്തിന്റെ ഗൗരവവും നിലനിർത്തുന്നു.
- source_word: εἰσίν τινες τῶν ὧδε ἑστώτων
  choice: ഇവിടെ നിൽക്കുന്നവരിൽ ചിലർ
  rationale: ഗ്രീക്കിലെ അംശസൂചകമായ പ്രയോഗം കൃത്യവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: οὐ μὴ γεύσωνται θανάτου
  choice: തീർച്ചയായും മരണം രുചിക്കുകയില്ല
  rationale: οὐ μή എന്ന ഊന്നിയ നിഷേധത്തിന്റെ ശക്തിയും ‘മരണം രുചിക്കുക’ എന്ന സജീവമായ രൂപകവും ഒരുപോലെ സംരക്ഷിക്കുന്നു.
- source_word: ἕως ἂν ἴδωσιν
  choice: കാണുന്നതുവരെ
  rationale: ഭാവിയിലെ ഒരു സംഭവത്തെ സൂചിപ്പിക്കുന്ന കാലപരിധി മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: യേശുവിന്റെ സ്ഥിരമായ സ്വയംവിശേഷണവും അതിന്റെ അന്ത്യകാലസംബന്ധിയായ പ്രതിധ്വനിയും വ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്നു.
- source_word: ἐρχόμενον
  choice: വരുന്നതു
  rationale: മൂലത്തിലെ വർത്തമാന കൃദന്തരൂപത്തെ നേരിട്ട് നൽകുന്നു; സമാന്തരവാക്യങ്ങളിൽനിന്ന് ‘ശക്തിയോടെ’ പോലുള്ള ആശയങ്ങൾ ചേർക്കുന്നില്ല.
- source_word: ἐν τῇ βασιλείᾳ αὐτοῦ
  choice: തന്റെ രാജ്യത്തിൽ
  rationale: βασιλεία എന്ന പദത്തിന്റെ രാജ്യം/രാജവാഴ്ച എന്നീ അർഥസാധ്യതകൾ ചുരുക്കിക്കളയാതെ പരമ്പരാഗതമായ ദൃശ്യഭാവം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘മനുഷ്യപുത്രൻ തന്റെ രാജ്യത്തിൽ വരുന്നത്’ ഏത് സംഭവത്തെ സൂചിപ്പിക്കുന്നു
  choice: ഒരു പ്രത്യേക സംഭവമായി തിരിച്ചറിയാതെ വാക്യം നേരിട്ട് പരിഭാഷപ്പെടുത്തുക
  alternative: രൂപാന്തരീകരണം, പുനരുത്ഥാനം/മഹത്വീകരണം, പെന്തെക്കൊസ്ത്, യെരൂശലേമിന്മേലുള്ള ന്യായവിധി, അല്ലെങ്കിൽ അന്ത്യകാല മടങ്ങിവരവ് എന്നു വ്യക്തമാക്കുക
  rationale: ഗ്രീക്ക് വാക്യം ഏത് സംഭവമാണെന്ന് കൃത്യമായി പറയുന്നില്ല; അതിനാൽ വ്യാഖ്യാനവിവാദവും ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും പരിഭാഷയിൽ നിലനിർത്തുന്നു.
- issue: βασιλεία എന്ന പദത്തിന്റെ ഭാവം
  choice: രാജ്യം
  alternative: രാജവാഴ്ച അല്ലെങ്കിൽ രാജകീയ ഭരണം
  rationale: ‘രാജ്യം’ മൂലത്തിലെ ദൃശ്യവും പരമ്പരാഗതവുമായ ഭാഷ സംരക്ഷിക്കുന്നു; ഭരണപ്രവർത്തനം എന്ന അമൂർത്തമായ അർഥത്തിലേക്ക് മാത്രം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടനയാണ് ഉപയോഗിച്ചത്. ‘മരണം രുചിക്കുക’ എന്ന ബൈബിൾരൂപകം വായനാസൗകര്യം നഷ്ടപ്പെടുത്താതെ നിലനിർത്തി; വിവാദമായ സംഭവസൂചന പരിഭാഷയിൽ തീർപ്പാക്കിയിട്ടില്ല.
