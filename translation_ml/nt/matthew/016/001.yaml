id: MAT.16.1
reference: Matthew 16:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ προσελθόντες οἱ Φαρισαῖοι καὶ Σαδδουκαῖοι πειράζοντες ἐπηρώτησαν αὐτὸν σημεῖον ἐκ τοῦ οὐρανοῦ ἐπιδεῖξαι αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/001.yaml
  text: And the Pharisees and Sadducees came and[a], testing him, asked him to show them a sign from heaven.
translation:
  language: ml
  text: ഫരിസേയരും സദൂക്യരും അടുത്തുവന്ന്, യേശുവിനെ പരീക്ഷിച്ചുകൊണ്ട്[a], ആകാശത്തുനിന്നുള്ള ഒരു അടയാളം അവർക്കു കാണിച്ചുതരാൻ അദ്ദേഹത്തോടു ചോദിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘അദ്ദേഹത്തെ പ്രലോഭിപ്പിച്ചുകൊണ്ട്’ അല്ലെങ്കിൽ ‘അദ്ദേഹത്തെ കുടുക്കാൻ ശ്രമിച്ചുകൊണ്ട്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: അടുത്തുവന്ന്
  rationale: യേശുവിന്റെ അടുക്കലേക്കുള്ള നീക്കം സൂചിപ്പിക്കുന്ന മുൻകാല പങ്കാളിക്രിയയെ സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: Φαρισαῖοι
  choice: ഫരിസേയർ
  rationale: ഈ യഹൂദ മതവിഭാഗത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: Σαδδουκαῖοι
  choice: സദൂക്യർ
  rationale: ഈ യഹൂദ മതവിഭാഗത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: πειράζοντες
  choice: യേശുവിനെ പരീക്ഷിച്ചുകൊണ്ട്
  rationale: πειράζω എന്ന പദത്തിന്റെ പരീക്ഷിക്കുക എന്ന അടിസ്ഥാനാർഥവും സന്ദർഭത്തിലെ പ്രതികൂല ഉദ്ദേശ്യത്തിന്റെ സാധ്യതയും നിലനിർത്തുന്നു; ‘കുടുക്കാൻ ശ്രമിച്ച്’ എന്ന് വ്യാഖ്യാനിച്ച് ഉറപ്പിക്കുന്നില്ല.
- source_word: ἐπηρώτησαν
  choice: ആവശ്യപ്പെട്ടു
  rationale: ഇവിടെ തുടർന്നുവരുന്ന infinitive-നോടൊപ്പം ഒരു കാര്യം ചെയ്തുതരാൻ ചോദിക്കുന്ന അഭ്യർഥനയാണ്; മലയാളത്തിൽ ‘കാണിച്ചുതരണമെന്ന് ... ആവശ്യപ്പെട്ടു’ സ്വാഭാവികമാണ്.
- source_word: σημεῖον
  choice: ഒരു അടയാളം
  rationale: അത്ഭുതകരമായ സ്ഥിരീകരണചിഹ്നം സന്ദർഭത്തിൽ സൂചിതമാണെങ്കിലും, മൂലപദം നേരിട്ട് ‘അടയാളം’ എന്നാണ്; അതിനാൽ അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: ആകാശത്തുനിന്നുള്ള
  rationale: അടയാളത്തിന്റെ ഉറവിടം മുകളിൽനിന്നാണെന്ന് വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം; ‘സ്വർഗത്തിൽനിന്നുള്ള’ എന്ന സാധ്യതയേക്കാൾ ദൃശ്യമായ ആകാശസൂചനയും മൂലത്തിലെ അർഥവ്യാപ്തിയും ഇവിടെ നിലനിർത്തുന്നു.
- source_word: ἐπιδεῖξαι
  choice: കാണിച്ചുതരണമെന്ന്
  rationale: മറ്റൊരാൾക്കായി കാണിച്ചുകൊടുക്കുക എന്ന ക്രിയാഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഫരിസേയരുടെയും സദൂക്യരുടെയും അഭ്യർഥനയിലെ പ്രതികൂല ഉദ്ദേശ്യം
  choice: πειράζοντες എന്നത് ‘പരീക്ഷിച്ചുകൊണ്ട്’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘പ്രലോഭിപ്പിച്ചുകൊണ്ട്’ അല്ലെങ്കിൽ ‘കുടുക്കാൻ ശ്രമിച്ചുകൊണ്ട്’
  rationale: വാക്യത്തിൽ എതിർപ്പുനിറഞ്ഞ ഉദ്ദേശ്യം ഉണ്ടെങ്കിലും അതിന്റെ കൃത്യസ്വഭാവം മൂലപദം പൂർണമായി നിർണയിക്കുന്നില്ല. ‘പരീക്ഷിച്ചുകൊണ്ട്’ എന്നത് പദാർഥവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു; ‘കുടുക്കാൻ’ എന്നത് ഉദ്ദേശ്യം കൂടുതൽ വ്യാഖ്യാനിച്ച് ഉറപ്പിക്കും.
- issue: ἐκ τοῦ οὐρανοῦ എന്നതിലെ οὐρανός എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി
  choice: ‘ആകാശത്തുനിന്നുള്ള’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘സ്വർഗത്തിൽനിന്നുള്ള’
  rationale: οὐρανός എന്നതിന് ആകാശം, സ്വർഗം എന്നീ അർഥങ്ങൾ ഉണ്ടാകാം. ഈ സന്ദർഭത്തിൽ ആവശ്യപ്പെടുന്നത് ആകാശീയമായ ഒരു അടയാളമാണെന്ന വായന സ്വാഭാവികമാണ്; എന്നാൽ ദൈവിക ഉറവിടത്തിന്റെ സൂചന ഇല്ലാതാക്കാതിരിക്കാൻ പദശ:സ്വഭാവമുള്ള രൂപം തെരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക സാധാരണ മലയാളത്തിൽ വായിക്കാൻ എളുപ്പമുള്ളതും അതേസമയം തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ളതുമായ ശൈലി. ‘അദ്ദേഹത്തോട്’ എന്ന സർവനാമം യേശുവിനെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു; മൂലത്തിലെ ‘അവനോട്’ എന്ന രൂപം മലയാളത്തിൽ ഉണ്ടാക്കാവുന്ന അസ്പഷ്ടത ഒഴിവാക്കുന്നു.
