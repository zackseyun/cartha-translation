revisions:
- from: 'പത്രോസ് അവനെ മാറ്റിനിർത്തി ശാസിക്കാൻ തുടങ്ങി: “കർത്താവേ, അങ്ങേക്ക് ഇതൊരിക്കലും സംഭവിക്കാതിരിക്കട്ടെ![a]” എന്നു പറഞ്ഞു.'
  to: പത്രോസ് അവനെ മാറ്റിനിർത്തി, “കർത്താവേ, അങ്ങയോടു കരുണയുണ്ടാകട്ടെ[a]; ഇത് അങ്ങേക്ക് ഒരിക്കലും സംഭവിക്കുകയില്ല” എന്നു പറഞ്ഞ് അവനെ ശാസിക്കാൻ തുടങ്ങി.
  rationale: 'The revision restores both elements of Peter’s Greek protest in the main text: the elliptical Ἵλεώς σοι is represented with a mercy/favor expression, and οὐ μή is retained as the emphatic “ഒരിക്കലും സംഭവിക്കുകയില്ല.” The footnote gives natural idiomatic alternatives, including one with an explicit reference to God only as an alternative, since θεός is absent from the Greek wording.'
