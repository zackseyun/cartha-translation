id: MAT.16.22
reference: Matthew 16:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ προσλαβόμενος αὐτὸν ὁ Πέτρος ἤρξατο ἐπιτιμᾶν αὐτῷ λέγων· Ἵλεώς σοι, κύριε· οὐ μὴ ἔσται σοι τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/022.yaml
  text: And Peter took him aside and began to rebuke him[a], saying, “Far be it from you, Lord; this will certainly not happen to you.”
translation:
  language: ml
  text: പത്രോസ് അവനെ മാറ്റിനിർത്തി, “കർത്താവേ, അങ്ങയോടു കരുണയുണ്ടാകട്ടെ[a]; ഇത് അങ്ങേക്ക് ഒരിക്കലും സംഭവിക്കുകയില്ല” എന്നു പറഞ്ഞ് അവനെ ശാസിക്കാൻ തുടങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “കർത്താവേ, അങ്ങേക്ക് അത് വരാതിരിക്കട്ടെ” അല്ലെങ്കിൽ “ദൈവം അനുവദിക്കരുതേ, കർത്താവേ.” ഗ്രീക്കിലെ പ്രയോഗം ശൈലിപരവും അപൂർണ്ണവുമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσλαβόμενος
  choice: മാറ്റിനിർത്തി
  rationale: മധ്യപ്രയോഗത്തിലുള്ള ഈ കൃദന്തം, പത്രോസ് യേശുവിനെ സ്വകാര്യമായി തന്നിലേക്കു ചേർത്തു മാറ്റിനിർത്തിയെന്ന സന്ദർഭസൂചന സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἤρξατο ἐπιτιμᾶν
  choice: ശാസിക്കാൻ തുടങ്ങി
  rationale: ἄρχομαι + അനന്തക്രിയയുടെ ആരംഭാർഥവും ἐπιτιμάωയുടെ ശക്തമായ ശാസനാർഥവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: Ἵλεώς σοι
  choice: അങ്ങേക്ക് ഇതൊരിക്കലും സംഭവിക്കാതിരിക്കട്ടെ
  rationale: വാചകം അപൂർണ്ണരൂപത്തിലുള്ള ഒരു ഗ്രീക്ക് ശൈലിപ്രയോഗമാണ്. മലയാളത്തിൽ പ്രാർത്ഥനാപരമായ ശക്തമായ നിരാകരണമായി സ്വാഭാവികമായി നൽകുന്നു; ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത ‘ദൈവം’ എന്ന കർത്താവിനെ പ്രധാനവാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: κύριε
  choice: കർത്താവേ
  rationale: യേശുവിനോടുള്ള ആദരപൂർവമായ സംബോധനയും സുവിശേഷത്തിലെ ക്രിസ്തുശാസ്ത്രപരമായ അനുരണനവും സംരക്ഷിക്കുന്നു.
- source_word: οὐ μὴ ἔσται σοι τοῦτο
  choice: ഇതൊരിക്കലും സംഭവിക്കുകയില്ല
  rationale: οὐ μή + ഭാവികാലത്തിന്റെ ഊന്നിയ നിഷേധം ‘ഒരിക്കലും ... ഇല്ല’ എന്ന സ്വാഭാവിക മലയാളത്തിലൂടെ പ്രകടമാക്കുന്നു. മുൻവാക്യവുമായി ചേർന്ന ആവർത്തനസ്വഭാവം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: പത്രോസിന്റെ പ്രതിഷേധത്തിൽ ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത ദൈവപരാമർശം ചേർക്കണമോ
  choice: പ്രധാനവാചകത്തിൽ ‘ദൈവം’ ചേർക്കാതെ, ശക്തമായ ആശംസാരൂപത്തിലുള്ള നിരാകരണം
  alternative: “ദൈവം അങ്ങയോടു കരുണ കാണിക്കട്ടെ, കർത്താവേ” / “ദൈവം അനുവദിക്കരുതേ, കർത്താവേ”
  rationale: Ἵλεώς σοι എന്നത് ശൈലിപരവും അപൂർണ്ണവുമായ പ്രയോഗമാണ്. ദൈവിക കരുണയിലേക്കുള്ള സൂചന ഉണ്ടായിരിക്കാമെങ്കിലും θεός എന്ന പദം പ്രത്യക്ഷമല്ല; അതിനാൽ വ്യാഖ്യാനത്തെ പ്രധാനവാചകത്തിൽ ഉറപ്പിക്കാതെ അടിക്കുറിപ്പിൽ ഭിന്നസാധ്യതകൾ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. യേശുവിനോടുള്ള സംബോധനയിൽ ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു. ഗ്രീക്കിലെ രണ്ട് ഘട്ടങ്ങളായ ശക്തമായ പ്രതിഷേധം മലയാളത്തിൽ സ്വാഭാവികമായ ഒറ്റ ആശംസാവാക്യമായി നൽകി; അതിന്റെ കൂടുതൽ രൂപപരമായ പ്രതിഫലനം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
