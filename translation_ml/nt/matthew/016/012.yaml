- from: 'അപ്പോൾ അവർക്കു മനസ്സിലായി: അപ്പത്തിന്റെ പുളിമാവിനെക്കുറിച്ച് സൂക്ഷിക്കണമെന്നല്ല, പരീശന്മാരുടെയും സദൂക്യരുടെയും ഉപദേശത്തെക്കുറിച്ച് സൂക്ഷിക്കണമെന്നാണ് അവൻ പറഞ്ഞത്.[a]'
