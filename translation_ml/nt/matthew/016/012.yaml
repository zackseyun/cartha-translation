reference: Matthew 16:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τότε συνῆκαν ὅτι οὐκ εἶπεν προσέχειν ἀπὸ τῆς ζύμης ⸂τῶν ἄρτων⸃ ἀλλὰ ἀπὸ τῆς διδαχῆς τῶν Φαρισαίων καὶ Σαδδουκαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/012.yaml
  text: Then they understood that he had not said to beware of the leaven of bread[a], but of the teaching of the Pharisees and Sadducees.
translation:
  language: ml
  text: അപ്പോൾ, അവൻ അപ്പത്തിന്റെ പുളിമാവിൽനിന്ന് ജാഗ്രത പാലിക്കാനല്ല, പരീശന്മാരുടെയും സദൂക്യരുടെയും ഉപദേശത്തിൽനിന്ന് ജാഗ്രത പാലിക്കാനാണ് പറഞ്ഞതെന്ന് അവർ മനസ്സിലാക്കി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘അപ്പങ്ങളുടെ’; ഗ്രീക്കിൽ ഇവിടെ നാമം ബഹുവചനത്തിലാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: അപ്പോൾ
  rationale: ശിഷ്യന്മാർ യേശുവിന്റെ അർഥം ഗ്രഹിച്ച സമയബിന്ദുവിനെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: συνῆκαν
  choice: അവർക്കു മനസ്സിലായി
  rationale: ഗ്രഹണത്തിലേക്കെത്തിയതിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ക്രിയയുടെ ഭൂതകാലഭാവം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: οὐκ εἶπεν
  choice: എന്നല്ല ... എന്നാണ് അവൻ പറഞ്ഞത്
  rationale: ഗ്രീക്കിലെ നിഷേധ-വൈരുധ്യ ഘടനയായ οὐκ ... ἀλλὰ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: προσέχειν ἀπό
  choice: എന്നതിനെക്കുറിച്ച് സൂക്ഷിക്കുക
  rationale: മുന്നറിയിപ്പിന്റെ സന്ദർഭത്തിൽ ജാഗ്രത പാലിക്കുക എന്ന അർഥം നൽകുന്നു; ഉപമയെയും അതിന്റെ വിശദീകരണത്തെയും ഒരേ ഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: ζύμη
  choice: പുളിമാവ്
  rationale: അപ്പം പുളിപ്പിക്കുന്ന വസ്തുവിനെയും സന്ദർഭത്തിലെ ഉപമയെയും മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്ന സാധാരണ പദം.
- source_word: τῶν ἄρτων
  choice: അപ്പത്തിന്റെ
  rationale: ഗ്രീക്കിൽ ബഹുവചനമാണെങ്കിലും മലയാളത്തിൽ ഇവിടെ ഏകവചന പൊതുനാമമാണ് സ്വാഭാവികം; ബഹുവചനരൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: διδαχῆς
  choice: ഉപദേശം
  rationale: പഠിപ്പിക്കപ്പെടുന്ന ആശയസമുച്ചയത്തെ സൂചിപ്പിക്കുന്ന, ആധുനിക മലയാളത്തിൽ വായനാസൗകര്യമുള്ള പദം.
- source_word: Φαρισαίων καὶ Σαδδουκαίων
  choice: പരീശന്മാരുടെയും സദൂക്യരുടെയും
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ സമൂഹനാമങ്ങൾ ഉപയോഗിച്ച് ഗ്രീക്കിലെ ബന്ധവും സംയോജനവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘പുളിമാവ്’ എന്ന ഉപമയുടെ വ്യാപ്തി
  choice: ഉപമയെ വാക്യം തന്നെ വ്യക്തമാക്കുന്നത്ര മാത്രം—പരീശന്മാരുടെയും സദൂക്യരുടെയും ‘ഉപദേശം’—വിശദീകരിച്ചു.
  alternative: ‘കപടഭക്തി,’ ‘ദുഷിച്ച ഉപദേശം’ തുടങ്ങിയ വ്യാഖ്യാനപരമായ വിപുലീകരണം പ്രധാനപാഠത്തിൽ ചേർക്കുക.
  rationale: ഈ വാക്യം പുളിമാവിനെ ഉപദേശവുമായി ബന്ധിപ്പിക്കുന്നുവെങ്കിലും അതിന്റെ ധാർമിക സ്വഭാവം കൂടുതൽ നിർവചിക്കുന്നില്ല; അതിനാൽ പാഠത്തിന്റെ യഥാർഥ വ്യാഖ്യാനപരിധി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ഗൗരവമുള്ളതും സ്വാഭാവികവുമായ ശൈലി. നിഷേധവും വൈരുധ്യവും വ്യക്തമായി സൂക്ഷിച്ചു; ഉപമയ്ക്ക് പാഠത്തിൽ ഇല്ലാത്ത പ്രത്യേക വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
