id: MAT.16.20
reference: Matthew 16:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τότε ⸀διεστείλατο τοῖς ⸀μαθηταῖς ἵνα μηδενὶ εἴπωσιν ὅτι αὐτός ⸀ἐστιν ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/020.yaml
  text: Then he strictly instructed the disciples to tell no one that he is the Messiah[a].
translation:
  language: ml
  text: അപ്പോൾ, താൻ മശീഹയാണെന്ന് ആരോടും പറയരുതെന്ന് യേശു ശിഷ്യന്മാരോട് കർശനമായി നിർദേശിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ക്രിസ്തു.” ഗ്രീക്കിലെ Χριστός ഇവിടെ ഒരു പദവിയാണ്; അതിന്റെ അർഥം നിലനിർത്താൻ “മശീഹ” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: അപ്പോൾ
  rationale: ആഖ്യാനത്തിലെ സംഭവക്രമം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: διεστείλατο
  choice: കർശനമായി നിർദേശിച്ചു
  rationale: ശക്തമായ വിലക്കോടുകൂടിയ നിർദേശം എന്ന മധ്യപ്രയോഗത്തിന്റെ ഭാവം നിലനിർത്തുന്നു; ‘മുന്നറിയിപ്പു നൽകി’ എന്നത് അപകടസൂചന അനാവശ്യമായി ഉണർത്താം.
- source_word: τοῖς μαθηταῖς
  choice: ശിഷ്യന്മാരോട്
  rationale: സന്ദർഭത്തിൽ അറിയപ്പെടുന്ന യേശുവിന്റെ അനുയായിസംഘത്തെയാണ് നിർദ്ദിഷ്ട ബഹുവചനം സൂചിപ്പിക്കുന്നത്.
- source_word: ἵνα μηδενὶ εἴπωσιν
  choice: ആരോടും പറയരുതെന്ന്
  rationale: ἵναയും ഉപവിധിക്രിയയും ചേർന്ന് നിർദേശത്തിന്റെ ഉള്ളടക്കമായ സമ്പൂർണ വിലക്ക് പ്രകടിപ്പിക്കുന്നു.
- source_word: ὅτι αὐτός ἐστιν
  choice: താൻ ... ആണെന്ന്
  rationale: യേശുവിന്റെ വാക്കല്ല, യേശുവിനെക്കുറിച്ചുള്ള ആഖ്യാതാവിന്റെ പരോക്ഷപ്രസ്താവനയാണെന്ന് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; αὐτός ഇവിടെ നിർബന്ധമായും ‘അവൻ തന്നെയാണ്’ എന്ന ഊന്നൽ ആവശ്യപ്പെടുന്നില്ല.
- source_word: ὁ χριστός
  choice: മശീഹ
  rationale: Χριστός ഇവിടെ വ്യക്തിനാമമല്ല, അഭിഷിക്തനായ പ്രതീക്ഷിത രാജാവിനെ സൂചിപ്പിക്കുന്ന പദവിയാണ്; മലയാളത്തിൽ ഈ പദവിയുടെ യഹൂദ പശ്ചാത്തലം ‘മശീഹ’ നിലനിർത്തുന്നു.
theological_decisions:
- issue: Χριστός എന്ന പദവിയുടെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: സന്ദർഭത്തിൽ Χριστός പേരുപോലുള്ള തിരിച്ചറിയൽപദമല്ല, അംഗീകൃത മശീഹാപദവിയാണ്. ‘മശീഹ’ എന്ന് നൽകുന്നത് അതിന്റെ ശീർഷകസ്വഭാവവും എബ്രായ-യഹൂദ ആശയപശ്ചാത്തലവും വ്യക്തമാക്കുന്നു; പരിചിതമായ ‘ക്രിസ്തു’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: αὐτός എന്ന സർവനാമത്തിന്റെ ഊന്നൽ
  choice: താൻ
  alternative: താൻ തന്നെയാണ്
  rationale: ഗ്രീക്കിൽ സർവനാമം വ്യക്തമാണെങ്കിലും ഈ വാക്യത്തിൽ ശക്തമായ വൈരുധ്യഊന്നൽ നിർബന്ധമല്ല; ‘താൻ തന്നെയാണ്’ എന്ന് ചേർത്താൽ മൂലത്തിൽ അനിശ്ചിതമായ ഊന്നൽ അമിതമായി ഉറപ്പിക്കപ്പെടാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. പരോക്ഷവാക്യത്തിൽ ‘താൻ’ ഉപയോഗിച്ച് പരാമർശം വ്യക്തമായി സൂക്ഷിച്ചു; കർശനമായ നിർദേശത്തിന്റെ ശക്തിയും മശീഹാപദവിയുടെ സ്വഭാവവും നിലനിർത്തി.
