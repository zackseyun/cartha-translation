id: MAT.16.13
reference: Matthew 16:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐλθὼν δὲ ὁ Ἰησοῦς εἰς τὰ μέρη Καισαρείας τῆς Φιλίππου ἠρώτα τοὺς μαθητὰς αὐτοῦ λέγων· ⸀Τίνα λέγουσιν οἱ ἄνθρωποι εἶναι τὸν υἱὸν τοῦ ἀνθρώπου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/013.yaml
  text: When Jesus came into the region of Caesarea Philippi[a], he was asking his disciples, saying[b], “Who do people say the Son of Man is?”
translation:
  language: ml
  text: 'യേശു കൈസര്യ ഫിലിപ്പിയുടെ പ്രദേശത്ത് എത്തിയപ്പോൾ, ശിഷ്യന്മാരോട് ഇങ്ങനെ ചോദിച്ചുകൊണ്ടിരുന്നു: “മനുഷ്യപുത്രൻ[a] ആരെന്നാണ് ആളുകൾ പറയുന്നത്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “മനുഷ്യപുത്രൻ” എന്നത് യേശു തന്നെക്കുറിച്ച് പതിവായി ഉപയോഗിക്കുന്ന സ്വയംവിശേഷണമാണ്; ഇതിനെ “മനുഷ്യനായവൻ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐλθὼν δὲ
  choice: എത്തിയപ്പോൾ
  rationale: അയോറിസ്റ്റ് കൃദന്തം പുതിയ രംഗത്തിലേക്കുള്ള മൃദുവായ മാറ്റത്തോടൊപ്പം സമയബന്ധവും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘എത്തിയപ്പോൾ’ സ്വാഭാവികമായി ആ സമയബന്ധം നൽകുന്നു; δέ-യ്ക്ക് വേറൊരു കൃത്രിമ സംയോജകം ചേർക്കേണ്ടതില്ല.
- source_word: εἰς τὰ μέρη
  choice: പ്രദേശത്ത്
  rationale: μέρη ഇവിടെ അക്ഷരാർഥത്തിലുള്ള ‘ഭാഗങ്ങൾ’ അല്ല, ഒരു സ്ഥലത്തിന്റെ ചുറ്റുപാടോ മേഖലയോ ആണ്; ‘പ്രദേശം’ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: Καισαρείας τῆς Φιλίππου
  choice: കൈസര്യ ഫിലിപ്പി
  rationale: ചരിത്രപ്രസിദ്ധമായ സ്ഥലനാമം മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു; വാക്യത്തിൽ ബന്ധം വ്യക്തമാക്കാൻ ‘കൈസര്യ ഫിലിപ്പിയുടെ’ എന്നു ഉപയോഗിച്ചു.
- source_word: ἠρώτα
  choice: ചോദിച്ചുകൊണ്ടിരുന്നു
  rationale: ഇംപെർഫെക്റ്റ് ക്രിയയുടെ തുടർച്ചാപരമായ ഭാവം നിലനിർത്തുന്നു; ലളിതമായ ‘ചോദിച്ചു’ എന്നതിനെക്കാൾ സ്രോതസ്സിന്റെ ദൃശ്യഭാവത്തോട് അടുത്തതാണ്.
- source_word: τοὺς μαθητὰς αὐτοῦ
  choice: ശിഷ്യന്മാരോട്
  rationale: μαθητής എന്നതിന് സുവിശേഷസന്ദർഭത്തിൽ പതിവും കൃത്യവുമായ മലയാളപദം ‘ശിഷ്യൻ’ ആണ്. കർത്താവായി യേശു നേരത്തേ വ്യക്തമാകുന്നതിനാൽ αὐτοῦ-വിന്റെ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളപ്പെടുന്നു.
- source_word: λέγων
  choice: ഇങ്ങനെ
  rationale: നേരിട്ടുള്ള ഉദ്ധരണിക്ക് മുമ്പ് λέγων-നെ അക്ഷരാർഥത്തിൽ ‘പറഞ്ഞുകൊണ്ട്’ എന്നു ആവർത്തിക്കുന്നത് മലയാളത്തിൽ അസ്വാഭാവികമാണ്. ‘ഇങ്ങനെ ചോദിച്ചുകൊണ്ടിരുന്നു’ കൃദന്തരൂപത്തിന്റെ ഉദ്ധരണി-പരിചയപ്പെടുത്തൽ ധർമ്മം നിലനിർത്തുന്നു.
- source_word: Τίνα λέγουσιν οἱ ἄνθρωποι εἶναι
  choice: ആരെന്നാണ് ആളുകൾ പറയുന്നത്
  rationale: ഗ്രീക്ക് പരോക്ഷവാക്യഘടനയെ സ്വാഭാവികമായ മലയാള ചോദ്യംരൂപത്തിൽ അവതരിപ്പിക്കുന്നു. ἄνθρωποι പൊതുവായി മനുഷ്യരെ സൂചിപ്പിക്കുന്നതിനാൽ ലിംഗനിരപേക്ഷമായ ‘ആളുകൾ’ തിരഞ്ഞെടുത്തു.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: യേശുവിന്റെ സവിശേഷ സ്വയംവിശേഷണത്തിന്റെ പരമ്പരാഗത മലയാളരൂപം നിലനിർത്തുന്നു; ദാനീയേൽ 7-നോടുള്ള അന്തർപാഠബന്ധവും പദത്തിന്റെ അർഥതലങ്ങളിലെ സംഘർഷവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου എന്ന പ്രയോഗത്തിന്റെ വിവർത്തനം
  choice: മനുഷ്യപുത്രൻ
  alternative: മനുഷ്യനായവൻ
  rationale: ഈ പ്രയോഗം സാധാരണ മനുഷ്യസൂചനയും സ്ഥാനനാമസദൃശമായ ദാനീയേൽപരമായ പ്രതിധ്വനിയും ഒരുമിച്ച് വഹിക്കുന്നു. ‘മനുഷ്യപുത്രൻ’ ആ അന്തർപാഠബന്ധവും സുവിശേഷങ്ങളിലെ യേശുവിന്റെ സ്വയംവിശേഷണവും വ്യാഖ്യാനിച്ച് തീർക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ചോദിച്ചുകൊണ്ടിരുന്നു’ എന്ന രൂപം ഗ്രീക്കിലെ ഇംപെർഫെക്റ്റ് ഭാവം നിലനിർത്തുന്നു. നേരിട്ടുള്ള ഉദ്ധരണിക്ക് മുമ്പുള്ള ‘ഇങ്ങനെ’ മലയാളത്തിലെ അസ്വാഭാവിക ആവർത്തനം ഒഴിവാക്കുന്നു.
