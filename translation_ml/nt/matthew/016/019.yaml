id: MAT.16.19
reference: Matthew 16:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀δώσω σοι τὰς ⸀κλεῖδας τῆς βασιλείας τῶν οὐρανῶν, καὶ ὃ ⸀ἐὰν δήσῃς ἐπὶ τῆς γῆς ἔσται δεδεμένον ἐν τοῖς οὐρανοῖς, καὶ ὃ ⸁ἐὰν λύσῃς ἐπὶ τῆς γῆς ἔσται λελυμένον ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/019.yaml
  text: I will give you the keys of the kingdom of heaven[a], and whatever you bind on earth will have been bound in heaven[c][b], and whatever you loose on earth will have been loosed in heaven.
translation:
  language: ml
  text: സ്വർഗരാജ്യത്തിന്റെ[a] താക്കോലുകൾ ഞാൻ നിനക്കു തരും. നീ ഭൂമിയിൽ എന്തു ബന്ധിച്ചാലും, അതു സ്വർഗത്തിൽ ബന്ധിക്കപ്പെട്ടിട്ടുണ്ടായിരിക്കും[b][c]; നീ ഭൂമിയിൽ എന്തു അഴിച്ചാലും, അതു സ്വർഗത്തിൽ അഴിക്കപ്പെട്ടിട്ടുണ്ടായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, ‘സ്വർഗങ്ങളുടെ രാജ്യം.’ മത്തായി ഈ പ്രയോഗം പലപ്പോഴും ഉപയോഗിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: പരമ്പരാഗത പരിഭാഷകളിൽ പലതും ‘സ്വർഗത്തിൽ ബന്ധിക്കപ്പെടും … അഴിക്കപ്പെടും’ എന്നു വായിക്കുന്നു. ഗ്രീക്ക് ഘടനയെ കൂടുതൽ കൃത്യമായി ‘ബന്ധിക്കപ്പെട്ടിട്ടുണ്ടായിരിക്കും … അഴിക്കപ്പെട്ടിട്ടുണ്ടായിരിക്കും’ എന്നു മനസ്സിലാക്കാം.
    reason: alternative_reading
  - marker: c
    text: ‘ബന്ധിക്കുക’, ‘അഴിക്കുക’ എന്നീ പദങ്ങൾക്ക് വിലക്കുക, അനുവദിക്കുക എന്നീ അർഥങ്ങളോ ബാധ്യത ചുമത്തുക, നീക്കുക എന്നീ അർഥങ്ങളോ വഹിക്കാം; എങ്കിലും പരിഭാഷ ഗ്രീക്കിലെ രൂപകം നിലനിർത്തുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: δώσω σοι
  choice: ഞാൻ നിനക്കു തരും
  rationale: ഭാവികാലത്തിലെ നേരിട്ടുള്ള വാഗ്ദാനം സ്വാഭാവികമായ മലയാള പദക്രമത്തിൽ നൽകുന്നു.
- source_word: τὰς κλεῖδας
  choice: താക്കോലുകൾ
  rationale: മൂലത്തിലെ ബഹുവചനരൂപവും രൂപകവും വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ അതേപടി നിലനിർത്തുന്നു.
- source_word: τῆς βασιλείας τῶν οὐρανῶν
  choice: സ്വർഗരാജ്യത്തിന്റെ
  rationale: മത്തായിയുടെ പ്രയോഗത്തിന് മലയാളത്തിൽ സ്വാഭാവികവും സുപരിചിതവുമായ രൂപം; ഗ്രീക്കിലെ ‘സ്വർഗങ്ങൾ’ എന്ന ബഹുവചനം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ὃ ἐὰν δήσῃς
  choice: എന്തു ബന്ധിച്ചാലും
  rationale: അനിശ്ചിത ആപേക്ഷിക ഘടനയും ഭാവിസാധ്യതയും മലയാളത്തിലെ സോപാധിക രൂപത്തിൽ നൽകുന്നു; ‘ബന്ധിക്കുക’ എന്ന രൂപകം സംരക്ഷിക്കുന്നു.
- source_word: ἐπὶ τῆς γῆς
  choice: ഭൂമിയിൽ
  rationale: സ്വർഗം–ഭൂമി വൈരുധ്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἔσται δεδεμένον
  choice: ബന്ധിക്കപ്പെട്ടിട്ടുള്ളതായിരിക്കും
  rationale: εἰμί എന്നതിന്റെ ഭാവികാലവും പൂർണ നിഷ്ക്രിയ കൃദന്തരൂപവും ചേർന്ന ഘടന സൂചിപ്പിക്കുന്ന, മുമ്പേ പൂർത്തിയായ പ്രവൃത്തിയുടെ ഫലാവസ്ഥ പരമാവധി നിലനിർത്തുന്നു.
- source_word: ὃ ἐὰν λύσῃς
  choice: എന്തു അഴിച്ചാലും
  rationale: ‘ബന്ധിക്കുക’ എന്നതിനോടുള്ള രൂപകാത്മക സമാന്തര്യം നിലനിർത്തി λύωയെ ‘അഴിക്കുക’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: ἔσται λελυμένον
  choice: അഴിക്കപ്പെട്ടിട്ടുള്ളതായിരിക്കും
  rationale: മുൻവാക്യത്തിലെ ഭാവി + പൂർണ നിഷ്ക്രിയ ഘടനയോടുള്ള സമാന്തര്യം കാത്ത്, പൂർത്തിയായ അഴിക്കലിന്റെ ഫലാവസ്ഥ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ബന്ധിക്കുകയും അഴിക്കുകയും ചെയ്യുന്ന വാക്യത്തിലെ കാലഭാവവും ദൈവശാസ്ത്രപരമായ സൂചനയും
  choice: ‘സ്വർഗത്തിൽ ബന്ധിക്കപ്പെട്ടിട്ടുള്ളതായിരിക്കും / അഴിക്കപ്പെട്ടിട്ടുള്ളതായിരിക്കും’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘സ്വർഗത്തിൽ ബന്ധിക്കപ്പെടും / അഴിക്കപ്പെടും’
  rationale: ἔσται + പൂർണ നിഷ്ക്രിയ കൃദന്തം എന്ന ഗ്രീക്ക് ഘടന, ഭൂമിയിലെ നടപടി സ്വർഗീയ തീരുമാനത്തിനു കാരണമാകുന്നു എന്നു നിർബന്ധമായി പറയുന്നതിനെക്കാൾ മുമ്പേ പൂർത്തിയായ പ്രവൃത്തിയുടെ ഫലാവസ്ഥയെ സൂചിപ്പിക്കാൻ കഴിയും. ഒരു പ്രത്യേക സഭാധികാരസിദ്ധാന്തം അടിച്ചേൽപ്പിക്കാതെ വ്യാകരണപരമായ സംഘർഷം നിലനിർത്തുന്നു.
- issue: സ്വർഗരാജ്യത്തിന്റെ താക്കോലുകളുടെ അർഥം
  choice: ‘താക്കോലുകൾ’ എന്ന രൂപകം വ്യാഖ്യാനവികാസമില്ലാതെ നിലനിർത്തി.
  alternative: പ്രവേശിപ്പിക്കാനും ഒഴിവാക്കാനുമുള്ള അധികാരം / കാര്യവിചാരകന്റെ അധികാരം
  rationale: ഈ ചിത്രം അധികാരത്തെ സൂചിപ്പിച്ചേക്കാമെങ്കിലും, വാക്യം തന്നിൽ രൂപകമാണ് ഉപയോഗിക്കുന്നത്. പ്രത്യേക സഭാശാസ്ത്രസംവിധാനം പരിഭാഷയിൽ ചേർക്കാതിരിക്കാൻ അതു സംരക്ഷിക്കുന്നു.
- issue: ‘ബന്ധിക്കുക’, ‘അഴിക്കുക’ എന്നീ പദങ്ങളുടെ അധികാരപരമായ അർഥവ്യാപ്തി
  choice: രൂപകത്തെ മുഖ്യവാചകത്തിൽ നിലനിർത്തി, സാധ്യതയുള്ള വിലക്കൽ–അനുവദിക്കൽ അർഥം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
  alternative: വിലക്കുക / അനുവദിക്കുക
  rationale: പദങ്ങൾക്ക് നിയമപരമോ അധ്യാപനാധികാരപരമോ ആയ പ്രയോഗം ഉണ്ടാകാമെങ്കിലും, അതിലൊന്നിനെ മാത്രം മുഖ്യവാചകത്തിൽ ഉറപ്പിക്കുന്നത് മൂലത്തിലെ അർഥവ്യാപ്തി ചുരുക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി ഉപയോഗിച്ചു. ‘ബന്ധിക്കപ്പെട്ടിട്ടുള്ളതായിരിക്കും’ പോലുള്ള രൂപങ്ങൾ സാധാരണ സംസാരഭാഷയെക്കാൾ ഔപചാരികമാണെങ്കിലും, ഗ്രീക്കിലെ പൂർണ നിഷ്ക്രിയ ഫലാവസ്ഥ നഷ്ടപ്പെടാതിരിക്കാനാണ് അവ തെരഞ്ഞെടുത്തത്. ‘നിനക്കു’ എന്ന ഏകവചനരൂപം σοι/രണ്ടാംപുരുഷ ഏകവചനത്തെ വ്യക്തമാക്കുന്നു.
