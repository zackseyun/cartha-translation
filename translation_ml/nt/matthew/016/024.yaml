- from: 'അപ്പോൾ യേശു തന്റെ ശിഷ്യന്മാരോടു പറഞ്ഞു: “ആരെങ്കിലും എന്റെ പിന്നാലെ വരാൻ ആഗ്രഹിക്കുന്നെങ്കിൽ, അവൻ തന്നെത്തന്നെ ത്യജിച്ച് തന്റെ ക്രൂശ് എടുത്ത് എന്നെ അനുഗമിക്കട്ടെ.”'
  to: 'അപ്പോൾ യേശു തന്റെ ശിഷ്യന്മാരോടു പറഞ്ഞു: “ആരെങ്കിലും എന്റെ പിന്നാലെ വരാൻ ആഗ്രഹിക്കുന്നെങ്കിൽ, അവൻ സ്വയം നിഷേധിക്കട്ടെ, തന്റെ ക്രൂശ് എടുത്തുകൊള്ളട്ടെ, എന്നെ അനുഗമിക്കട്ടെ.”'
