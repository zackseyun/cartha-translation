id: MAT.16.24
reference: Matthew 16:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τότε ὁ Ἰησοῦς εἶπεν τοῖς μαθηταῖς αὐτοῦ· Εἴ τις θέλει ὀπίσω μου ἐλθεῖν, ἀπαρνησάσθω ἑαυτὸν καὶ ἀράτω τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθείτω μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/024.yaml
  text: Then Jesus said to his disciples[a], “If anyone wants to come after me, let him deny himself and take up his cross and follow me.”
translation:
  language: ml
  text: 'അപ്പോൾ യേശു തന്റെ ശിഷ്യന്മാരോടു പറഞ്ഞു: “ആരെങ്കിലും എന്റെ പിന്നാലെ വരാൻ ആഗ്രഹിക്കുന്നെങ്കിൽ, അവൻ സ്വയം നിഷേധിക്കട്ടെ, തന്റെ ക്രൂശ് എടുത്തുകൊള്ളട്ടെ, എന്നെ അനുഗമിക്കട്ടെ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: അപ്പോൾ
  rationale: തുടർന്നുണ്ടാകുന്ന സംഭവത്തെ പരിചയപ്പെടുത്തുന്ന കാലസൂചകമായി സ്വാഭാവികവും സംക്ഷിപ്തവുമായ പ്രയോഗം.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: തന്റെ ശിഷ്യന്മാരോട്
  rationale: μαθηταί സൂചിപ്പിക്കുന്ന ഗുരു-ശിഷ്യബന്ധം നിലനിർത്തുന്ന, സുവിശേഷസന്ദർഭത്തിൽ സ്ഥാപിതമായ മലയാളപദം.
- source_word: Εἴ τις θέλει
  choice: ആരെങ്കിലും ... ആഗ്രഹിക്കുന്നെങ്കിൽ
  rationale: τις എന്ന അനിശ്ചിത സർവനാമത്തിന്റെ പൊതുവ്യാപ്തിയും θέλω എന്നതിലെ മനസ്സോ സന്നദ്ധതയോ വ്യക്തമായി നൽകുന്നു.
- source_word: ὀπίσω μου ἐλθεῖν
  choice: എന്റെ പിന്നാലെ വരാൻ
  rationale: ശിഷ്യത്വത്തിന്റെ ദൃശ്യരൂപകം നിലനിർത്തുകയും അവസാനം വരുന്ന ἀκολουθείτω എന്ന ക്രിയയുമായി അനാവശ്യമായി ലയിപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀπαρνησάσθω ἑαυτὸν
  choice: അവൻ തന്നെത്തന്നെ ത്യജിച്ച്
  rationale: നിർണായകമായ സ്വയംനിഷേധത്തെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; ഏകവചന ഘടനയും നിലനിർത്തുന്നു.
- source_word: ἀράτω τὸν σταυρὸν αὐτοῦ
  choice: തന്റെ ക്രൂശ് എടുത്ത്
  rationale: ക്രൂശ് ചുമക്കാനായി ഏറ്റെടുക്കുക എന്ന ആശയം ഗൗരവത്തോടെയും ചുരുക്കമായും നൽകുന്നു; വ്യക്തിപരമായ ഉടമസ്ഥതാസൂചനയും സംരക്ഷിക്കുന്നു.
- source_word: ἀκολουθείτω μοι
  choice: എന്നെ അനുഗമിക്കട്ടെ
  rationale: വർത്തമാനകാല ആജ്ഞയുടെ തുടർച്ചയുള്ള ശിഷ്യത്വഭാവം മലയാളത്തിലെ സ്വാഭാവിക ആജ്ഞാരൂപത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: പൊതുവ്യാപ്തിയുള്ള ഏകവചനവും വ്യാകരണപരമായ പുരുഷലിംഗരൂപവും
  choice: “ആരെങ്കിലും ... അവൻ തന്നെത്തന്നെ ... തന്റെ” എന്ന ഏകവചന പ്രതിനിധിരൂപം
  alternative: “ആരെങ്കിലും ... അവർ തങ്ങളെത്തന്നെ ... അവരുടെ” എന്ന ലിംഗനിരപേക്ഷ ബഹുവചനരൂപം
  rationale: ഗ്രീക്ക് വാക്യം ഏകവചനത്തിലാണ്; എന്നാൽ അതിന്റെ ആഹ്വാനം എല്ലാവർക്കും ബാധകമാണ്. മലയാളത്തിൽ “ആരെങ്കിലും ... അവൻ” എന്നത് ഏകവചന വ്യാകരണവും പൊതുവ്യാപ്തിയും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- issue: “സ്വയം നിഷേധിക്കുക” എന്ന പ്രയോഗത്തിന്റെ അർത്ഥപരിധി
  choice: “തന്നെത്തന്നെ ത്യജിക്കുക”
  alternative: “സ്വയം നിഷേധിക്കുക”
  rationale: വ്യക്തിയുടെ അസ്തിത്വം നിഷേധിക്കുക എന്ന തെറ്റായ ധാരണ ഒഴിവാക്കി, സ്വന്തം അവകാശവാദവും സ്വകേന്ദ്രിത നിയന്ത്രണവും ഉപേക്ഷിക്കുക എന്ന ശിഷ്യത്വാവശ്യത്തിന്റെ ശക്തി നൽകുന്നു; പ്രത്യേക സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലത്തിലെ മൂന്ന് ഘട്ടങ്ങളായ തന്നെത്തന്നെ ത്യജിക്കൽ, ക്രൂശ് എടുക്കൽ, യേശുവിനെ അനുഗമിക്കൽ എന്നിവയുടെ ക്രമവും തീവ്രതയും സംരക്ഷിച്ചിട്ടുണ്ട്.
