id: MAT.16.14
reference: Matthew 16:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν· Οἱ μὲν Ἰωάννην τὸν βαπτιστήν, ἄλλοι δὲ Ἠλίαν, ἕτεροι δὲ Ἰερεμίαν ἢ ἕνα τῶν προφητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/014.yaml
  text: And they said[a], “Some say John the Baptist, others Elijah, and others Jeremiah or one of the prophets.”
translation:
  language: ml
  text: 'അവർ പറഞ്ഞു: “ചിലർ സ്നാപക യോഹന്നാൻ എന്നും, മറ്റു ചിലർ ഏലിയാവ് എന്നും, വേറെ ചിലർ യിരെമ്യാവോ പ്രവാചകന്മാരിൽ ഒരാളോ എന്നും പറയുന്നു.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ വ്യക്തമായി: “ചിലർ നീ സ്നാപക യോഹന്നാൻ ആണെന്നും, മറ്റു ചിലർ ഏലിയാവ് ആണെന്നും, വേറെ ചിലർ യിരെമ്യാവോ പ്രവാചകന്മാരിൽ ഒരാളോ ആണെന്നും പറയുന്നു.”'
    reason: മൂലഗ്രീക്കിൽ സന്ദർഭത്തിൽനിന്ന് മനസ്സിലാകുന്ന ‘നീ ... ആണെന്ന്’ എന്ന ആശയം തുറന്നുപറയുന്ന വിവർത്തനസാധ്യത.
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: അവർ പറഞ്ഞു
  rationale: δέ ഇവിടെ ശക്തമായ വൈരുധ്യമല്ല, സംഭാഷണത്തിന്റെ തുടർച്ചയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ പ്രത്യേക സംയോജകം ചേർക്കാതിരിക്കുന്നത് സ്വാഭാവികമാണ്. εἶπαν എന്നതിന് ‘പറഞ്ഞു’ യോജിക്കുന്നു.
- source_word: Οἱ μὲν
  choice: ചിലർ ... എന്നും ... പറയുന്നു
  rationale: μέν തുടർന്നുവരുന്ന ἄλλοι/ἕτεροι എന്നിവയോടൊപ്പം വ്യത്യസ്ത കൂട്ടങ്ങളെ നിരത്തുന്നു. മലയാളത്തിലെ ഉദ്ധരണാത്മക ‘എന്നും ... പറയുന്നു’ ഘടന അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: Ἰωάννην τὸν βαπτιστήν
  choice: സ്നാപകയോഹന്നാൻ
  rationale: βαπτιστής എന്ന വിശേഷണത്തോടുകൂടിയ യോഹന്നാനെ സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതവും സംക്ഷിപ്തവുമായ പേര്.
- source_word: ἄλλοι δὲ
  choice: മറ്റു ചിലർ
  rationale: പട്ടികയിലെ രണ്ടാമത്തെ കൂട്ടത്തെ വ്യക്തമായി വേർതിരിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: Ἠλίαν
  choice: ഏലിയാവ്
  rationale: പ്രവാചകന്റെ പേരിന്റെ മലയാളത്തിൽ സ്ഥാപിതമായ രൂപം.
- source_word: ἕτεροι δὲ
  choice: വേറെ ചിലർ
  rationale: മൂന്നാമത്തെ കൂട്ടത്തെ സൂചിപ്പിക്കുന്ന ἕτεροι എന്ന പദത്തിന്റെ വിതരണാത്മക ഭാവം നിലനിർത്തുന്നു.
- source_word: Ἰερεμίαν
  choice: യിരെമ്യാവ്
  rationale: പ്രവാചകന്റെ പേരിന്റെ മലയാളത്തിൽ പരിചിതമായ രൂപം.
- source_word: ἢ ἕνα τῶν προφητῶν
  choice: എന്നോ പ്രവാചകന്മാരിൽ ഒരാൾ എന്നോ
  rationale: ἤ സൂചിപ്പിക്കുന്ന ബദൽ തിരിച്ചറിയൽ ‘എന്നോ ... എന്നോ’ എന്ന ഘടനയിൽ നിലനിർത്തുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘മറ്റു’ എന്ന ആശയം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: തിരിച്ചറിയലുകളുടെ സൂചിത വിഷയം
  choice: ആളുകൾ യേശുവിനെ ആരെന്നു പറയുന്നു എന്നത് മുൻവാക്യത്തിന്റെ പശ്ചാത്തലത്തിൽ ആശ്രയിച്ചുകൊണ്ട്, ‘നീ ... ആണെന്ന്’ എന്നത് മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
  alternative: “ചിലർ നീ സ്നാപകയോഹന്നാൻ ആണെന്നും...”
  rationale: ഗ്രീക്ക് വാക്യം തിരിച്ചറിയലുകൾ സംക്ഷിപ്തമായി മാത്രം നിരത്തുന്നു. മലയാളത്തിൽ അർത്ഥസുതാര്യതയ്ക്കായി ‘എന്നും ... പറയുന്നു’ ചേർത്തിട്ടുണ്ടെങ്കിലും, സൂചിതമായ ‘നീ ... ആണെന്ന്’ മുഖ്യവാചകത്തിൽ തുറന്നെഴുതാതെ മൂലത്തിലെ ദീർഘലോപം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. പേരുകൾ മലയാള ക്രൈസ്തവ വായനയിൽ പരിചിതമായ രൂപങ്ങളിൽ നൽകിയിരിക്കുന്നു; ഗ്രീക്കിലെ പട്ടികാസ്വഭാവവും ദീർഘലോപവും കഴിയുന്നത്ര നിലനിർത്തിയിരിക്കുന്നു.
