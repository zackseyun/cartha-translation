  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· ⸂Ὀψίας γενομένης λέγετε· Εὐδία, πυρράζει γὰρ ὁ οὐρανός·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/002.yaml
  text: But he answered and said to them[a], “When evening comes, you say, ‘Fair weather, for the sky is red.’
translation:
  language: ml
  text: 'അവൻ അവരോട് ഉത്തരം പറഞ്ഞു: “സന്ധ്യയാകുമ്പോൾ, ‘ആകാശം ചുവന്നിരിക്കുന്നു; കാലാവസ്ഥ നല്ലതായിരിക്കും’ എന്നു നിങ്ങൾ പറയുന്നു.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില പുരാതന കൈയെഴുത്തുപ്രതികളിൽ ഇവിടെമുതൽ 3-ാം വാക്യത്തിന്റെ അവസാനംവരെയുള്ള ഭാഗം കാണുന്നില്ല.
    reason: textual_variant
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: ഉത്തരം പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ പതിവ് ഇരട്ട പ്രയോഗത്തിന്റെ മറുപടി എന്ന സംവാദധർമ്മവും ‘പറഞ്ഞു’ എന്ന വാക്യാവതരണവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Ὀψίας γενομένης
  choice: സന്ധ്യയാകുമ്പോൾ
  rationale: കാലസൂചകമായ genitive absolute-നെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: λέγετε
  choice: നിങ്ങൾ പറയുന്നു
  rationale: വർത്തമാനകാലരൂപം ഇവിടെ പതിവായി പറയുന്ന കാലാവസ്ഥാനിരീക്ഷണത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: Εὐδία
  choice: നല്ല കാലാവസ്ഥയായിരിക്കും
  rationale: അനുകൂലവും തെളിഞ്ഞതുമായ കാലാവസ്ഥ എന്ന അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; മലയാളത്തിലെ പ്രവചനസ്വഭാവമുള്ള കാലാവസ്ഥാ ചൊല്ലിനൊത്ത് ഭാവിസൂചന ചേർക്കുന്നു.
- source_word: πυρράζει
  choice: ചുവന്നിരിക്കുന്നു
  rationale: ആകാശത്തിന്റെ ചുവപ്പുനിറം അതിശയോക്തിയില്ലാതെ നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: οὐρανός
  choice: ആകാശം
  rationale: കാലാവസ്ഥാസന്ദർഭത്തിൽ ദൃശ്യമായ ആകാശമാണ് ഉദ്ദേശിക്കുന്നത്; മലയാളത്തിലെ ‘ആകാശം’ ഈ അർഥവും മൂലപദത്തിന്റെ സാധ്യതാപരമായ വിശാലതയും സ്വാഭാവികമായി വഹിക്കുന്നു.
