id: MAT.16.11
reference: Matthew 16:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πῶς οὐ νοεῖτε ὅτι οὐ περὶ ⸀ἄρτων εἶπον ὑμῖν; ⸂προσέχετε δὲ⸃ ἀπὸ τῆς ζύμης τῶν Φαρισαίων καὶ Σαδδουκαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/011.yaml
  text: How do you not understand that I did not speak to you about bread? But beware of the leaven of the Pharisees and Sadducees[a][b].
translation:
  language: ml
  text: അപ്പത്തെക്കുറിച്ചല്ല ഞാൻ നിങ്ങളോടു പറഞ്ഞതെന്ന് നിങ്ങൾ എങ്ങനെ മനസ്സിലാക്കുന്നില്ല? എന്നാൽ പരീശന്മാരുടെയും സദൂക്യരുടെയും പുളിപ്പിനെതിരെ ജാഗ്രത പാലിക്കുക.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പരീശന്മാരുടെയും സദൂക്യരുടെയും പുളിപ്പിൽനിന്ന് സൂക്ഷിച്ചുകൊള്ളുക.’
    reason: lexical_alternative
  - marker: b
    text: ‘പുളിപ്പ്’ ഇവിടെ ഒരു രൂപകമാണ്; അടുത്ത വാക്യത്തിൽ അത് പരീശന്മാരുടെയും സദൂക്യരുടെയും ഉപദേശമാണെന്ന് വിശദീകരിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: πῶς οὐ νοεῖτε
  choice: നിങ്ങൾ എങ്ങനെ മനസ്സിലാക്കുന്നില്ല?
  rationale: πῶς, οὐ, νοεῖτε എന്നിവ ചേർന്നുള്ള ശാസനാഭാവമുള്ള അലങ്കാരചോദ്യത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവുമാണ്.
- source_word: ὅτι οὐ περὶ ἄρτων εἶπον ὑμῖν
  choice: അപ്പത്തെക്കുറിച്ചല്ല ഞാൻ നിങ്ങളോടു പറഞ്ഞതെന്ന്
  rationale: ἄρτων വ്യാകരണപരമായി ബഹുവചനമാണെങ്കിലും ഈ സന്ദർഭത്തിൽ മലയാളത്തിൽ പൊതുവായ അർഥം സ്വാഭാവികമായി നൽകുന്നത് ‘അപ്പം’ എന്ന ഏകവചനരൂപമാണ്. εἶπον ὑμῖν എന്നത് നേരിട്ട് ‘ഞാൻ നിങ്ങളോടു പറഞ്ഞത്’ എന്നു നൽകി.
- source_word: προσέχετε δὲ
  choice: എന്നാൽ ... സൂക്ഷിച്ചുകൊള്ളുക
  rationale: προσέχετε ഇവിടെ വെറും ശ്രദ്ധ ക്ഷണിക്കുകയല്ല, അപകടത്തിൽനിന്നു കരുതിയിരിക്കാനുള്ള ആജ്ഞയാണ്. δέ തിരുത്തലോടുകൂടിയ നേരിയ വൈരുധ്യം സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ എന്നു നൽകി.
- source_word: ἀπὸ τῆς ζύμης
  choice: പുളിപ്പിനെ സൂക്ഷിച്ചുകൊള്ളുക
  rationale: προσέχετε ... ἀπό എന്ന ഘടനയിൽ എന്തിൽനിന്നു കരുതിയിരിക്കണം എന്ന മുന്നറിയിപ്പാണ്. ‘പുളിപ്പ്’ രൂപകം നിലനിർത്തുകയും സാധാരണ മലയാളത്തിൽ ഗ്രഹിക്കാവുന്നതാവുകയും ചെയ്യുന്നു.
- source_word: τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: പരീശന്മാരുടെയും സദൂക്യരുടെയും
  rationale: ഈ യെഹൂദമതവിഭാഗങ്ങളുടെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണങ്ങൾ ഉപയോഗിച്ചു; ജനിറ്റീവ് ബന്ധം ‘-ഉടെ’ രൂപത്തിലൂടെ നിലനിർത്തി.
theological_decisions:
- issue: ‘പുളിപ്പ്’ എന്ന രൂപകത്തിന്റെ അർഥം
  choice: പ്രധാനവാക്യത്തിൽ രൂപകം അതേപടി നിലനിർത്തി.
  alternative: ‘പരീശന്മാരുടെയും സദൂക്യരുടെയും ഉപദേശത്തെ സൂക്ഷിച്ചുകൊള്ളുക’ എന്നു രൂപകത്തിന്റെ അർഥം നേരിട്ട് പറയുക.
  rationale: അടുത്ത വാക്യം പുളിപ്പ് അവരുടെ ഉപദേശമാണെന്ന് വിശദീകരിക്കുന്നുവെങ്കിലും ഈ വാക്യം ζύμη എന്ന രൂപകമാണ് ഉപയോഗിക്കുന്നത്. ഇവിടെത്തന്നെ ‘ഉപദേശം’ എന്നു മാറ്റുന്നത് മൂലപാഠത്തിലെ രൂപകവും അതിന്റെ ക്രമാനുസൃത വെളിപ്പെടുത്തലും ഇല്ലാതാക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ശാസനാഭാവമുള്ള ചോദ്യം നേരിട്ട് നിലനിർത്തി; അപരിചിതമായ സാങ്കേതിക പദങ്ങൾ ഒഴിവാക്കി. രൂപകത്തെ വ്യാഖ്യാനിച്ച് മാറ്റാതെ പ്രധാനപാഠത്തിൽ സംരക്ഷിച്ചു.
