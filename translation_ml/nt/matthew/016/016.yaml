id: MAT.16.16
reference: Matthew 16:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ Σίμων Πέτρος εἶπεν· Σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ τοῦ ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/016.yaml
  text: Simon Peter answered[a], “You are the Messiah, the Son of the living God.”
translation:
  language: ml
  text: 'ശിമോൻ പത്രോസ് മറുപടി പറഞ്ഞു: “അങ്ങാണ് മശീഹാ[a], ജീവനുള്ള ദൈവത്തിന്റെ പുത്രൻ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ക്രിസ്തു.” ഗ്രീക്കിലെ Χριστός എന്ന പദവി “ക്രിസ്തു” എന്നും പരിഭാഷപ്പെടുത്താം; ഇവിടെ അതിന്റെ പദവിസ്വഭാവവും യഹൂദ മശീഹാപശ്ചാത്തലവും നിലനിർത്താൻ “മശീഹാ” എന്നു നൽകിയിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: മറുപടി പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ‘മറുപടി പറഞ്ഞ് പറഞ്ഞു’ എന്ന വാചകഘടന മലയാളത്തിൽ സ്വാഭാവികമായി ഒറ്റ പ്രയോഗത്തിലൂടെ അവതരിപ്പിക്കുന്നു; പ്രതികരണത്തിന്റെ ഭാവം നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: പ്രത്യേകമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: ഇവിടെ δέ നേരിയ ആഖ്യാനത്തുടർച്ച സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ വാക്യക്രമം തന്നെ ആ തുടർച്ച സ്വാഭാവികമായി നൽകുന്നു.
- source_word: Σίμων Πέτρος
  choice: ശിമോൻ പത്രോസ്
  rationale: വ്യക്തിനാമങ്ങൾ മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: Σὺ
  choice: അങ്ങ്
  rationale: പ്രകടമായ സർവനാമം നൽകുന്ന ഊന്നൽ നിലനിർത്തുകയും യേശുവിനെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്ന സന്ദർഭത്തിന് യോജിച്ച ആദരസൂചകമായ ആധുനിക മലയാളരൂപം ഉപയോഗിക്കുകയും ചെയ്തു.
- source_word: ὁ χριστὸς
  choice: മശീഹാ
  rationale: ഇവിടെ Χριστός വ്യക്തിനാമമല്ല, അഭിഷിക്തനായ പ്രതീക്ഷിത രാജാവിനെ സൂചിപ്പിക്കുന്ന പദവിയാണ്; ‘മശീഹാ’ ആ യഹൂദ മശീഹാസന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: ὁ υἱὸς
  choice: പുത്രൻ
  rationale: നിശ്ചിതവും പദവിസ്വഭാവമുള്ളതുമായ പുത്രബന്ധം നിലനിർത്തുന്നു; അനിശ്ചിതമായ ‘ഒരു പുത്രൻ’ എന്ന അർഥം ഒഴിവാക്കുന്നു.
- source_word: τοῦ θεοῦ τοῦ ζῶντος
  choice: ജീവനുള്ള ദൈവത്തിന്റെ
  rationale: വർത്തമാന കർത്തൃവാചക വിശേഷണത്തിന്റെ ഗുണസൂചകബലം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: Χριστός എന്ന പദത്തെ പദവിയായോ പേരുപോലുള്ള രൂപമായോ അവതരിപ്പിക്കൽ
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: പത്രോസിന്റെ പ്രഖ്യാപനത്തിൽ Χριστός വ്യക്തമായി ഒരു പദവിയായി പ്രവർത്തിക്കുന്നു. ‘മശീഹാ’ എന്നത് ആ പദവിയുടെയും യഹൂദ പ്രതീക്ഷയുടെയും ഭാവം നിലനിർത്തുന്നു; പരിചിതമായ ‘ക്രിസ്തു’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ‘ദൈവത്തിന്റെ പുത്രൻ’ എന്ന പ്രയോഗത്തിന്റെ വ്യാപ്തി
  choice: ജീവനുള്ള ദൈവത്തിന്റെ പുത്രൻ
  alternative: വ്യാഖ്യാനാത്മകമായ കൂടുതൽ വികസനം
  rationale: ഗ്രീക്കിലെ പ്രഖ്യാപനരൂപം അതേപടി സംരക്ഷിക്കുന്നു; പിന്നീടുള്ള ദൈവശാസ്ത്രപരമായ നിർവചനങ്ങൾ വാക്യത്തിലേക്ക് ചേർത്ത് അതിന്റെ അർഥം മുൻകൂട്ടി പരിഹരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവും പൊതുവായ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ ശൈലി. യേശുവിനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയിൽ ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു; ഗ്രീക്കിലെ വ്യക്തമായ Σὺ നൽകുന്ന ഊന്നലും ഇതിലൂടെ നിലനിൽക്കുന്നു.
