revisions:
- from: രാവിലെയാകട്ടെ, ‘ആകാശം ചുവന്ന് ഇരുണ്ടുമൂടിയിരിക്കുന്നതിനാൽ ഇന്ന് കൊടുങ്കാറ്റായിരിക്കും’ എന്നും നിങ്ങൾ പറയുന്നു. ആകാശത്തിന്റെ ഭാവം[a] തിരിച്ചറിയാൻ നിങ്ങൾക്കറിയാം; എന്നാൽ കാലങ്ങളുടെ അടയാളങ്ങൾ[b] തിരിച്ചറിയാൻ നിങ്ങൾക്കു കഴിയുന്നില്ല.[c]
  to: രാവിലെയാകട്ടെ, ‘ആകാശം ചുവന്നും മ്ലാനമായും ഇരിക്കുന്നതിനാൽ ഇന്ന് മോശം കാലാവസ്ഥയായിരിക്കും’ എന്നും നിങ്ങൾ പറയുന്നു. ആകാശത്തിന്റെ രൂപഭാവം[a] തിരിച്ചറിയാൻ നിങ്ങൾക്കറിയാം; എന്നാൽ കാലങ്ങളുടെ അടയാളങ്ങൾ[b] തിരിച്ചറിയാൻ നിങ്ങൾക്കു കഴിയുന്നില്ല.[c]
  rationale: The revision avoids specifying a literal storm where the Greek more broadly denotes adverse weather, makes the description of the red and gloomy sky more idiomatic, and corrects the scope of the manuscript-variation note. It preserves the repeated verb ‘തിരിച്ചറിയാൻ,’ the ability/inability contrast, and the intentional breadth of ‘കാലങ്ങളുടെ അടയാളങ്ങൾ.’
