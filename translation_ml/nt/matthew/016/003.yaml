id: MAT.16.3
reference: Matthew 16:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ πρωΐ· Σήμερον χειμών, πυρράζει γὰρ στυγνάζων ὁ οὐρανός. ⸀τὸ μὲν πρόσωπον τοῦ οὐρανοῦ γινώσκετε διακρίνειν, τὰ δὲ σημεῖα τῶν καιρῶν οὐ δύνασθε.⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/003.yaml
  text: And in the morning[a], ‘Today, stormy weather, for the sky is red and overcast.’ You know how to discern the appearance of the sky[b], but you are not able to discern the signs of the times.
translation:
  language: ml
  text: രാവിലെയാകട്ടെ, ‘ആകാശം ചുവന്നും മ്ലാനമായും ഇരിക്കുന്നതിനാൽ ഇന്ന് മോശം കാലാവസ്ഥയായിരിക്കും’ എന്നും നിങ്ങൾ പറയുന്നു. ആകാശത്തിന്റെ രൂപഭാവം[a] തിരിച്ചറിയാൻ നിങ്ങൾക്കറിയാം; എന്നാൽ കാലങ്ങളുടെ അടയാളങ്ങൾ[b] തിരിച്ചറിയാൻ നിങ്ങൾക്കു കഴിയുന്നില്ല.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'പദശഃ: ‘ആകാശത്തിന്റെ മുഖം.’'
    reason: lexical_alternative
  - marker: b
    text: ‘കാലങ്ങളുടെ അടയാളങ്ങൾ’ എന്നത് യേശുവിന്റെ മശീഹീയ പ്രവൃത്തികൾ ഉൾപ്പെടെ അന്നത്തെ സമയത്തിന്റെ ആത്മീയ പ്രാധാന്യത്തെ കൂടുതൽ പ്രത്യേകമായി സൂചിപ്പിക്കാം.
    reason: alternative_reading
  - marker: c
    text: മത്തായി 16:2-3-ലെ കാലാവസ്ഥയെക്കുറിച്ചുള്ള ഈ വാക്കുകൾ ചില പുരാതന കൈയെഴുത്തുപ്രതികളിൽ ഇല്ല.
    reason: textual_variant
lexical_decisions:
- source_word: πρωΐ
  choice: രാവിലെയാകട്ടെ
  rationale: ഇത് രാവിലെയുള്ള സമയത്തെ സൂചിപ്പിക്കുന്ന ക്രിയാവിശേഷണമാണ്; മുൻവാക്യത്തിലെ സായാഹ്നത്തോടുള്ള വൈരുധ്യം സ്വാഭാവികമായി നിലനിർത്താൻ ‘രാവിലെയാകട്ടെ’ എന്നു നൽകി.
- source_word: χειμών
  choice: കൊടുങ്കാറ്റായിരിക്കും
  rationale: ഇവിടെ ഋതുവായ ‘ശീതകാലം’ അല്ല, പ്രതികൂലമായ കൊടുങ്കാറ്റുള്ള കാലാവസ്ഥയാണ് ഉദ്ദേശ്യം.
- source_word: πυρράζει
  choice: ചുവന്ന്
  rationale: ആകാശത്തിന്റെ ചുവപ്പുനിറമുള്ള ദൃശ്യഭാവം ലളിതവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: στυγνάζων
  choice: ഇരുണ്ടുമൂടിയിരിക്കുന്നതിനാൽ
  rationale: ആകാശം മ്ലാനമായി, ഭീഷണിപ്പെടുത്തുന്നതുപോലെ ഇരുണ്ടിരിക്കുന്ന ഭാവമാണ് പങ്കാളിപദം സൂചിപ്പിക്കുന്നത്; കാലാവസ്ഥാസന്ദർഭത്തിൽ ഈ പ്രയോഗം സ്വാഭാവികമാണ്.
- source_word: πρόσωπον τοῦ οὐρανοῦ
  choice: ആകാശത്തിന്റെ ഭാവം
  rationale: പദശഃ ‘ആകാശത്തിന്റെ മുഖം’ എന്നാണെങ്കിലും ഇവിടെ ദൃശ്യരൂപമോ പ്രത്യക്ഷഭാവമോ ആണ് അർത്ഥം; ‘ഭാവം’ രണ്ടിന്റെയും സൂചന നിലനിർത്തുന്നു.
- source_word: γινώσκετε διακρίνειν
  choice: തിരിച്ചറിയാൻ നിങ്ങൾക്കറിയാം
  rationale: അറിവിനെയും വിവേചിച്ചറിയാനുള്ള അഭ്യസിത കഴിവിനെയും ഒരുമിച്ച് പ്രകടിപ്പിക്കുന്നു.
- source_word: σημεῖα
  choice: അടയാളങ്ങൾ
  rationale: മത്തായിയുടെ വിശാലമായ പ്രയോഗത്തിൽ തെളിവും വെളിപ്പെടുത്തലും ഉൾക്കൊള്ളാവുന്ന സാധാരണ ബൈബിൾപദം.
- source_word: καιρῶν
  choice: കാലങ്ങളുടെ
  rationale: വെറും കാലാവസ്ഥാ ഋതുക്കളല്ല, പ്രത്യേക പ്രാധാന്യമുള്ള സമയങ്ങളെയോ ഘട്ടങ്ങളെയോ സൂചിപ്പിക്കുന്ന വിശാലത നിലനിർത്തുന്നു.
- source_word: οὐ δύνασθε
  choice: നിങ്ങൾക്കു കഴിയുന്നില്ല
  rationale: ഗ്രീക്കിലെ കഴിവില്ലായ്മയെ വ്യക്തമായി നിലനിർത്തുന്നു; മുൻഖണ്ഡത്തിലെ ‘തിരിച്ചറിയാൻ’ എന്ന ക്രിയ രണ്ടാമത്തെ ഖണ്ഡത്തിലും സ്വാഭാവികമായി ആവർത്തിക്കുന്നു.
theological_decisions:
- issue: ‘കാലങ്ങളുടെ അടയാളങ്ങൾ’ എന്നതിന്റെ പരിധി
  choice: പ്രയോഗത്തെ വിശാലമായി അതേപടി നിലനിർത്തി
  alternative: ‘മശീഹയുടെ കാലത്തിന്റെ അടയാളങ്ങൾ’ അല്ലെങ്കിൽ ‘അന്ത്യകാല അടയാളങ്ങൾ’ എന്നു വ്യക്തമാക്കുക
  rationale: യേശുവിന്റെ പ്രവൃത്തികളിലൂടെ വെളിവാകുന്ന ഇപ്പോഴത്തെ നിമിഷത്തിന്റെ ആത്മീയ-മശീഹീയ പ്രാധാന്യം ഇതിൽ ഉൾപ്പെടാം; എന്നാൽ ഗ്രീക്ക് പ്രയോഗം അതിനെ മശീഹീയമോ അന്ത്യകാലപരമോ എന്ന ഒറ്റ അർത്ഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- issue: മുൻവാക്യത്തിൽനിന്ന് മനസ്സിലാക്കേണ്ട ‘നിങ്ങൾ പറയുന്നു’
  choice: മലയാളത്തിൽ പൂർണ്ണവും സ്വാഭാവികവുമായ വാക്യത്തിനായി ആവർത്തിച്ചു
  alternative: ഗ്രീക്കിലെപ്പോലെ ‘എന്നും’ എന്നു മാത്രം നൽകി മുൻവാക്യത്തെ ആശ്രയിക്കുക
  rationale: ഗ്രീക്കിൽ പറയുന്ന ക്രിയ മുൻസന്ദർഭത്തിൽനിന്ന് മനസ്സിലാക്കപ്പെടുന്നു. വാക്യവിഭജനത്തിൽ മലയാളം അപൂർണ്ണമാകാതിരിക്കാൻ അതിനെ തുറന്നുപറയുന്നത് അർത്ഥം മാറ്റുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. കാലാവസ്ഥാ നിരീക്ഷണവും ആത്മീയ വിവേചനവും തമ്മിലുള്ള വാചകസമാന്തര്യം നിലനിർത്താൻ ‘തിരിച്ചറിയാൻ’ രണ്ടിടത്തും ആവർത്തിച്ചു. ‘കാലങ്ങൾ’ എന്ന പദത്തിന്റെ മശീഹീയവും വിപുലമായ സന്ദർഭപരവുമായ സാധ്യതകൾ നിർവചനത്തിലൂടെ ചുരുക്കിയിട്ടില്ല.
