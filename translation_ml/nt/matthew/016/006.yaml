id: MAT.16.6
reference: Matthew 16:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Ὁρᾶτε καὶ προσέχετε ἀπὸ τῆς ζύμης τῶν Φαρισαίων καὶ Σαδδουκαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/006.yaml
  text: But Jesus said to them[a], “Watch out and beware of the leaven of the Pharisees and Sadducees.”
translation:
  language: ml
  text: 'എന്നാൽ യേശു അവരോട് പറഞ്ഞു: “ശ്രദ്ധിക്കുക; പരീശന്മാരുടെയും സദൂക്യരുടെയും പുളിച്ചമാവിനെ[a] സംബന്ധിച്ച് ജാഗ്രത പാലിക്കുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യീസ്റ്റ്.” ഗ്രീക്കിൽ “പുളിച്ചമാവ്” എന്ന രൂപകമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; തുടർന്നുള്ള സന്ദർഭത്തിൽ യേശു അതിനെ പരീശന്മാരുടെയും സദൂക്യരുടെയും ഉപദേശവുമായി ബന്ധപ്പെടുത്തി വിശദീകരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭത്തോടുള്ള മൃദുവായ വൈരുധ്യമോ സംഭാഷണത്തിലെ വഴിത്തിരിവോ സൂചിപ്പിക്കുന്നു.
- source_word: εἶπεν αὐτοῖς
  choice: അവരോട് പറഞ്ഞു
  rationale: λέγω എന്ന ക്രിയയും പരോക്ഷ കർമവും സ്വാഭാവികവും ഉറവിടത്തോട് സുതാര്യവുമായ രീതിയിൽ നൽകുന്നു.
- source_word: Ὁρᾶτε
  choice: ശ്രദ്ധിക്കുക!
  rationale: ഇവിടെ ὁράω എന്നതിന്റെ ആജ്ഞാരൂപം അക്ഷരാർഥത്തിലുള്ള ‘കാണുക’ എന്നതിലുപരി മുന്നറിയിപ്പായി പ്രവർത്തിക്കുന്നു; സ്വതന്ത്രമായ ഉദ്ഗാരവാക്യം അതിന്റെ ജാഗ്രതപ്പെടുത്തുന്ന ശക്തി നിലനിർത്തുന്നു.
- source_word: προσέχετε ἀπὸ
  choice: സൂക്ഷിച്ചുകൊള്ളുക
  rationale: മുന്നറിയിപ്പിന്റെയും അപകടത്തിൽനിന്ന് അകന്നുനിൽക്കുന്നതിന്റെയും ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; Ὁρᾶτε എന്നതിനോടൊപ്പമുള്ള ഇരട്ട ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: ζύμης
  choice: പുളിച്ചമാവ്
  rationale: അപ്പം മുഴുവൻ പുളിപ്പിക്കുന്ന മാവിനെയും അതിന്റെ രൂപകശക്തിയെയും സൂചിപ്പിക്കുന്നതിനാൽ ‘പുളിച്ചമാവ്’ തെരഞ്ഞെടുത്തു; പൊതുവായ ‘യീസ്റ്റ്’ എന്നതിനെക്കാൾ ദൃശ്യരൂപകം വ്യക്തമാക്കുന്നു.
- source_word: Φαρισαίων
  choice: പരീശന്മാർ
  rationale: ഈ യഹൂദ മതവിഭാഗത്തിന്റെ മലയാളത്തിൽ സ്ഥാപിതമായ പേരുരൂപം.
- source_word: Σαδδουκαίων
  choice: സദൂക്യർ
  rationale: ഈ യഹൂദ മതവിഭാഗത്തിന്റെ മലയാളത്തിൽ സ്ഥാപിതമായ പേരുരൂപം.
theological_decisions:
- issue: ‘പുളിച്ചമാവ്’ എന്ന രൂപകത്തിന്റെ അർഥം
  choice: രൂപകം മുഖ്യവാചകത്തിൽ വിശദീകരിക്കാതെ അതേപടി നിലനിർത്തി.
  alternative: ‘ഉപദേശം’ അല്ലെങ്കിൽ ‘സ്വാധീനം’ എന്ന് നേരിട്ട് പരിഭാഷപ്പെടുത്തുക.
  rationale: ഈ വാക്യം ζύμη എന്ന രൂപകപദം തന്നെയാണ് ഉപയോഗിക്കുന്നത്; തുടർന്നുള്ള സന്ദർഭം അതിനെ ഉപദേശവുമായി ബന്ധിപ്പിക്കുന്നു. ആ വിശദീകരണം ഇവിടെ മുൻകൂട്ടി ചേർക്കാതെ സാഹിത്യപരമായ വികാസവും അർഥസമ്മർദവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി. തുടർച്ചയായ രണ്ടു ആജ്ഞകളുടെ ഊന്നൽ ‘ശ്രദ്ധിക്കുക!’ എന്നും ‘സൂക്ഷിച്ചുകൊള്ളുക’ എന്നും നിലനിർത്തിയിരിക്കുന്നു. അടിക്കുറിപ്പിന്റെ ചിഹ്നം അത് വിശദീകരിക്കുന്ന ‘പുളിച്ചമാവ്’ എന്ന പദത്തോടു ചേർത്തിരിക്കുന്നു.
