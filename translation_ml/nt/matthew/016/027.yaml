id: MAT.16.27
reference: Matthew 16:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μέλλει γὰρ ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεσθαι ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ μετὰ τῶν ἀγγέλων αὐτοῦ, καὶ τότε ἀποδώσει ἑκάστῳ κατὰ τὴν πρᾶξιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/027.yaml
  text: For the Son of Man is about to come in the glory of his Father with his angels[b][a], and then he will repay each one according to his deed.
translation:
  language: ml
  text: കാരണം, മനുഷ്യപുത്രൻ തന്റെ പിതാവിന്റെ മഹത്വത്തിൽ തന്റെ ദൂതന്മാരോടുകൂടെ വരാനിരിക്കുന്നു[a]; അപ്പോൾ അവൻ ഓരോരുത്തനും അവന്റെ പ്രവൃത്തിക്കനുസരിച്ച് അർഹിക്കുന്നതു നൽകും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വരും” അല്ലെങ്കിൽ “വരാൻ പോകുന്നു.” ഗ്രീക്കിൽ “വരാനിരിക്കുന്നു” എന്നാണ്; അത് ആസന്നതയുടെ ഭാവം നിലനിർത്തുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ഓരോരുത്തനും അവൻ ചെയ്തതനുസരിച്ച് നൽകും.” ഗ്രീക്കിൽ “പ്രവൃത്തി” എന്ന ഏകവചനമാണ്; ഓരോ വ്യക്തിയുടെയും പ്രവൃത്തിയെ വിതരണാർഥത്തിൽ സൂചിപ്പിക്കുന്നു. ഇവിടെ “നൽകും” എന്നത് നന്മയ്ക്കുള്ള പ്രതിഫലം മാത്രമല്ല, അർഹിക്കുന്നതു നൽകുക എന്ന അർഥവും ഉൾക്കൊള്ളുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: μέλλει
  choice: വരാനിരിക്കുകയാണ്
  rationale: μέλλω + infinitive സൂചിപ്പിക്കുന്ന ആസന്നതയോ സംഭവിക്കാൻ പോകുന്ന നിലയോ ലളിതഭാവിയാക്കി ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തോടുള്ള കാരണബന്ധം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: സ്ഥിരപ്രയോഗമായ പദവിയും ദാനീയേൽ ഗ്രന്ഥസംബന്ധിയായ പ്രതിധ്വനിയും സംരക്ഷിക്കുന്നു.
- source_word: ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ
  choice: തന്റെ പിതാവിന്റെ മഹത്ത്വത്തിൽ
  rationale: ἐν എന്നതിന്റെ മേഖലയോ പ്രത്യക്ഷീകരണമോ സൂചിപ്പിക്കുന്ന ഭാവവും പിതാവുമായുള്ള ഷഷ്ഠീബന്ധവും നിലനിർത്തുന്നു.
- source_word: μετὰ τῶν ἀγγέλων αὐτοῦ
  choice: തന്റെ ദൂതന്മാരോടുകൂടെ
  rationale: μετά + genitive സൂചിപ്പിക്കുന്ന സഹഗമനവും αὐτοῦ എന്ന ഉടമസ്ഥബന്ധവും നേരിട്ട് നൽകുന്നു.
- source_word: καὶ τότε
  choice: അപ്പോൾ
  rationale: വരവിനുശേഷമുള്ള ന്യായപ്രതിഫലത്തിന്റെ കാലക്രമം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀποδώσει
  choice: പ്രതിഫലം നൽകും
  rationale: അർഹമായതു തിരികെ നൽകുക എന്ന ന്യായവിധിസംബന്ധിയായ അർഥം ഉൾക്കൊള്ളുന്നു; ഇത് അനുകൂലമായ പാരിതോഷികത്തിൽ മാത്രം പരിമിതപ്പെടുന്നില്ലെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: ἑκάστῳ
  choice: ഓരോരുത്തനും
  rationale: ദാതൃക ഏകവചനത്തിന്റെ വ്യക്തിവിതരണശക്തി നിലനിർത്തുന്നു.
- source_word: κατὰ τὴν πρᾶξιν αὐτοῦ
  choice: അവന്റെ പ്രവൃത്തിക്കനുസരിച്ച്
  rationale: πρᾶξις എന്ന ഏകവചനം നിലനിർത്തി, ഓരോ വ്യക്തിയുടെയും ചെയ്തതോ ജീവിതനടപ്പോ എന്ന വിതരണാർഥം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: മനുഷ്യപുത്രന്റെ വരവിനോടു ബന്ധപ്പെട്ട μέλλει എന്നതിന്റെ കാലസൂചന
  choice: വരാനിരിക്കുകയാണ്
  alternative: വരും; വരാൻ പോകുന്നു
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിലെ ആസന്നതയുടെ സംഘർഷം ലളിതഭാവിയാക്കി ഇല്ലാതാക്കാതെ സംരക്ഷിക്കുന്നു; സംഭവസമയത്തെക്കുറിച്ചുള്ള വ്യാഖ്യാനവിവാദം പരിഭാഷയിൽ തീർപ്പാക്കുന്നില്ല.
- issue: പ്രവൃത്തിക്കനുസരിച്ചുള്ള ന്യായവിധിപ്രതിഫലം
  choice: ഓരോരുത്തനും അവന്റെ പ്രവൃത്തിക്കനുസരിച്ച് പ്രതിഫലം നൽകും
  alternative: ഓരോരുത്തനും അവൻ ചെയ്തതനുസരിച്ച് നൽകും; ഓരോരുത്തന്റെയും പ്രവൃത്തികൾക്കനുസരിച്ച് പകരം നൽകും
  rationale: വാക്യത്തിലെ വ്യക്തിഗത ന്യായവിധിയും അർഹമായ ഫലവും സംരക്ഷിക്കുന്നു; രക്ഷയുടെയും പ്രവൃത്തികളുടെയും ബന്ധത്തെക്കുറിച്ചുള്ള വിപുലമായ ഒരു സിദ്ധാന്തം ഇതിലേക്ക് ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. “മനുഷ്യപുത്രൻ,” “മഹത്ത്വം,” “ദൂതന്മാർ” എന്നീ സ്ഥാപിത ബൈബിൾ പദങ്ങൾ നിലനിർത്തി. മൂലത്തിലെ ആസന്നതയും ന്യായവിധിയുടെ തുറന്ന സ്വഭാവവും വ്യാഖ്യാനപരമായി തീർപ്പാക്കാതെ സംരക്ഷിച്ചു.
