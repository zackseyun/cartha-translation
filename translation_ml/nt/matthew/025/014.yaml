id: MAT.25.14
reference: Matthew 25:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὥσπερ γὰρ ἄνθρωπος ἀποδημῶν ἐκάλεσεν τοὺς ἰδίους δούλους καὶ παρέδωκεν αὐτοῖς τὰ ὑπάρχοντα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/014.yaml
  text: For it is like a man going on a journey[a], who called his own servants and entrusted his possessions to them.
translation:
  language: ml
  text: കാരണം, യാത്രയ്ക്കു പുറപ്പെടുന്ന ഒരു മനുഷ്യൻ തന്റെ സ്വന്തം അടിമകളെ[a] വിളിച്ച് തന്റെ സ്വത്തുവകകൾ അവർക്ക് ഏൽപ്പിച്ചതുപോലെയാണ് ഇത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സ്വന്തം ദാസന്മാരെ” അല്ലെങ്കിൽ “സ്വന്തം സേവകരെ.” ഗ്രീക്കിലെ δοῦλος എന്ന പദത്തിന് സന്ദർഭമനുസരിച്ച് അടിമയെയോ സേവകനെയോ സൂചിപ്പിക്കാം; ഇവിടെ യജമാനന്റെ ഉടമസ്ഥതയും അധികാരവും മുൻനിൽക്കുന്നതിനാൽ “അടിമകൾ” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὥσπερ γὰρ
  choice: കാരണം, … പോലെയാണ് ഇത്
  rationale: മുൻവാക്യത്തെ വിശദീകരിക്കുന്ന ഉപമാസംബന്ധം നിലനിർത്തുന്നു. ഗ്രീക്കിലെ അപൂർണമായ താരതമ്യപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായ പൂർണവാക്യമാക്കാൻ ‘ഇത്’ ചേർത്തിരിക്കുന്നു.
- source_word: ἄνθρωπος ἀποδημῶν
  choice: യാത്രയ്ക്കു പുറപ്പെടുന്ന ഒരു മനുഷ്യൻ
  rationale: പുരുഷനായ ഉപമാകഥാപാത്രത്തെയും മറ്റൊരു സ്ഥലത്തേക്കുള്ള യാത്രയ്ക്കായി പോകുന്നതെന്ന ക്രിയാഭാവത്തെയും അനാവശ്യമായി ‘വിദേശത്തേക്ക്’ എന്നു പരിമിതപ്പെടുത്താതെ പ്രകടിപ്പിക്കുന്നു.
- source_word: τοὺς ἰδίους δούλους
  choice: തന്റെ സ്വന്തം അടിമകളെ
  rationale: ἰδίους സൂചിപ്പിക്കുന്ന സ്വന്തം ബന്ധവും δοῦλος സൂചിപ്പിക്കുന്ന യജമാനന്റെ ഉടമസ്ഥതയ്ക്കും അധികാരത്തിനും കീഴിലുള്ള നിലയും വ്യക്തമാക്കുന്നു.
- source_word: παρέδωκεν
  choice: ഏൽപ്പിച്ചു
  rationale: വെറുതെ കൈമാറുക എന്നതിലുപരി ഉത്തരവാദിത്വത്തോടെ ഭരമേൽപ്പിക്കുന്ന സന്ദർഭോചിതമായ അർഥം നൽകുന്നു.
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: തന്റെ സ്വത്തുവകകൾ
  rationale: ആ മനുഷ്യനു സ്വന്തമായിരുന്ന വസ്തുവകകളെ വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഉപമയിലെ δοῦλος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: അടിമകൾ
  alternative: ദാസന്മാർ / സേവകർ
  rationale: ഈ ഉപമയിൽ യജമാനന്റെ ഉടമസ്ഥതയും അധികാരവും പ്രധാനമായതിനാൽ ‘അടിമകൾ’ സാമൂഹികബന്ധത്തിന്റെ കാഠിന്യം മയപ്പെടുത്താതെ നിലനിർത്തുന്നു. എങ്കിലും സന്ദർഭമനുസരിച്ച് ഈ ഗ്രീക്കുപദത്തിന് സേവകൻ എന്ന അർഥവും വരാമെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ ഉപമാത്മക വാക്യഘടന മലയാളത്തിൽ വ്യക്തമാക്കുമ്പോഴും അതിന്റെ വിശദീകരണസ്വഭാവവും സാമൂഹിക യാഥാർഥ്യവും നിലനിർത്തിയിരിക്കുന്നു.
