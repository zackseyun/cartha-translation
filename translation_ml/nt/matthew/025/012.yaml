reference: Matthew 25:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Ἀμὴν λέγω ὑμῖν, οὐκ οἶδα ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/012.yaml
  text: But he answered[a], ‘Truly I tell you, I do not know you.’
translation:
  language: ml
  text: 'എന്നാൽ അവൻ മറുപടി പറഞ്ഞു: “സത്യമായി, ഞാൻ നിങ്ങളോടു പറയുന്നു: എനിക്ക് നിങ്ങളെ അറിയില്ല[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “ഞാൻ നിങ്ങളെ തിരിച്ചറിയുന്നില്ല.” ഗ്രീക്കിൽ കൂടുതൽ അക്ഷരാർഥമായി, “എനിക്ക് നിങ്ങളെ അറിയില്ല” എന്നാണ്; സന്ദർഭത്തിൽ ഇത് ബന്ധപരമായ തിരിച്ചറിയാതിരിക്കലിനെയോ നിരാകരണത്തെയോ സൂചിപ്പിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: എന്നാൽ അവൻ അവരോടു മറുപടി പറഞ്ഞു
  rationale: പങ്കാളിക്രിയയും സമാപികക്രിയയും ചേർന്ന ഗ്രീക്ക് ആഖ്യാനപ്രയോഗത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ ‘മറുപടി പറഞ്ഞു’ എന്നു ചുരുക്കി. δέ മുൻപത്തെ അപേക്ഷയോടുള്ള വൈരുധ്യം സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ എന്നു നൽകി.
- source_word: Ἀμὴν
  choice: സത്യമായി
  rationale: സിനോപ്റ്റിക് സുവിശേഷങ്ങളിലെ solemn formula മലയാളവായനക്കാർക്ക് സുതാര്യമായി നൽകുന്നു; ഏകവചന Ἀμήν ആയതിനാൽ ആവർത്തനം ചേർത്തിട്ടില്ല.
- source_word: λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: നേരിട്ടുള്ള അഭിസംബോധനയും ഗൗരവവും നിലനിർത്തുന്ന സ്വാഭാവിക ആധുനിക മലയാളപ്രയോഗം.
- source_word: οὐκ οἶδα
  choice: എനിക്ക് ... അറിയില്ല
  rationale: οἶδα എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘അറിയുക’ നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ തിരിച്ചറിയാതിരിക്കലോ ബന്ധപരമായ നിരാകരണമോ സൂചിപ്പിക്കാമെങ്കിലും അത് മുഖ്യവാചകത്തിൽ വിശദീകരിച്ച് അർഥം ചുരുക്കുന്നില്ല.
- source_word: ὑμᾶς
  choice: നിങ്ങളെ
  rationale: രണ്ടാംപുരുഷ ബഹുവചന കർമത്തെ മലയാളത്തിൽ നേരിട്ട് പ്രതിനിധീകരിക്കുന്നു; സന്ദർഭം കൂട്ടത്തെ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ഉപമയിലെ ‘എനിക്ക് നിങ്ങളെ അറിയില്ല’ എന്നതിന്റെ പ്രാബല്യം
  choice: ബന്ധപരമായി ഗൗരവമുള്ളതും എന്നാൽ പാഠത്തോട് ചേർന്നതുമായ ‘എനിക്ക് നിങ്ങളെ അറിയില്ല’ എന്ന രൂപം നിലനിർത്തി.
  alternative: ‘ഞാൻ നിങ്ങളെ തിരിച്ചറിയുന്നില്ല’ അല്ലെങ്കിൽ ‘നിങ്ങളുമായി എനിക്ക് ബന്ധമില്ല’
  rationale: സന്ദർഭത്തിൽ ഈ വാക്കുകൾ പുറത്താക്കലും ബന്ധപരമായ നിരാകരണവും വഹിക്കുന്നു. എങ്കിലും വാക്യംതന്നെ പറയുന്നതിലപ്പുറം രക്ഷയെക്കുറിച്ചുള്ള സമ്പൂർണ സിദ്ധാന്തപ്രസ്താവന വിവർത്തനത്തിൽ ചേർക്കരുത്; ഗ്രീക്ക് പാഠത്തിലെ അർഥസാധ്യതയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു’ എന്ന ഗൗരവമുള്ള സൂത്രവാക്യം നിലനിർത്തി; ‘അറിയില്ല’ എന്നതിലെ ഉദ്ദേശ്യപൂർവമായ അർഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ സൂചിപ്പിച്ചു.
