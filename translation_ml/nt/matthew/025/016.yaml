id: MAT.25.16
reference: Matthew 25:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀πορευθεὶς ὁ τὰ πέντε τάλαντα λαβὼν ἠργάσατο ἐν αὐτοῖς καὶ ⸀ἐκέρδησεν ἄλλα ⸀πέντε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/016.yaml
  text: The one who had received the five talents went and worked with them[b][a], and gained another five.
translation:
  language: ml
  text: അഞ്ചു താലന്ത്[a] ലഭിച്ചവൻ പോയി, അവകൊണ്ട് ഇടപാടു നടത്തി[b], മറ്റൊരു അഞ്ചു താലന്ത് നേടി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘താലന്ത്’ സ്വാഭാവിക കഴിവല്ല; പുരാതനകാലത്തെ വലിയൊരു ധനമൂല്യഘടകമാണ്.
    reason: cultural_note
  - marker: b
    text: അഥവാ ‘അവ ഉപയോഗിച്ച് പ്രവർത്തിച്ചു’; പണം ലാഭത്തിനായി സജീവമായി ഉപയോഗിച്ചതാണ് ഗ്രീക്ക് പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευθεὶς
  choice: പോയി
  rationale: മുൻപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് കൃദന്തരൂപം മലയാളത്തിൽ സ്വാഭാവികമായ ക്രിയാശൃംഖലയായി നൽകി. മൂലത്തിൽ ഇല്ലാത്ത ‘ഉടൻ’ എന്ന ആശയം ചേർത്തിട്ടില്ല.
- source_word: ὁ τὰ πέντε τάλαντα λαβὼν
  choice: അഞ്ചു താലന്ത് ലഭിച്ചവൻ
  rationale: ആർട്ടിക്കുലർ പാർട്ടിസിപ്പിൾ ലഭിച്ച തുകയാൽ ആ ദാസനെ തിരിച്ചറിയിക്കുന്നു; മലയാളത്തിൽ ഈ രൂപം സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: τάλαντα
  choice: താലന്ത്
  rationale: പുരാതന വലിയ ധനമൂല്യഘടകത്തെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗത പദം നിലനിർത്തി; സ്വാഭാവിക കഴിവ് എന്ന ആധുനിക അർഥവുമായി തെറ്റിക്കാതിരിക്കാൻ അടിക്കുറിപ്പ് നൽകി.
- source_word: ἠργάσατο ἐν αὐτοῖς
  choice: അവ ഉപയോഗിച്ച് പ്രവർത്തിച്ച്
  rationale: പണം ലാഭത്തിനായി സജീവമായി ഉപയോഗിച്ചതാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്. ‘വ്യാപാരം ചെയ്തു’ എന്നു പറഞ്ഞ് പ്രവർത്തനരീതി അനാവശ്യമായി നിർണ്ണയിക്കാതെ ഗ്രീക്കിന്റെ വിശാലമായ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: ἐκέρδησεν
  choice: നേടി
  rationale: κερδαίνω ഇവിടെ ലാഭമായി അധികം സമ്പാദിക്കുക എന്ന ഫലത്തെ സൂചിപ്പിക്കുന്നു; ‘നേടി’ അതിനെ ലളിതമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἄλλα πέντε
  choice: വേറെ അഞ്ചു താലന്ത്
  rationale: ആദ്യത്തെ അഞ്ചിനുപുറമേ അതേ അളവിൽകൂടി ലഭിച്ചതെന്ന കൂട്ടിച്ചേർക്കൽ വ്യക്തമായി നൽകുന്നു.
