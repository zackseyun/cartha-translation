translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. മൂലത്തിലെ പ്രവർത്തനക്രമം സ്വാഭാവികമായ മലയാള ക്രിയാശൃംഖലയായി നൽകി; മൂലത്തിൽ ഇല്ലാത്ത ‘ഉടൻ’ ചേർത്തിട്ടില്ല. ‘പ്രവർത്തിച്ച്’ എന്ന വിശാലമായ പദം നിലനിർത്തിക്കൊണ്ട് വാണിജ്യസന്ദർഭം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
