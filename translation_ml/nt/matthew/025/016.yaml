  revised_text: അഞ്ചു താലന്ത്[a] ലഭിച്ചവൻ പോയി, അവകൊണ്ട് ഇടപാടു നടത്തി[b], മറ്റൊരു അഞ്ചു താലന്ത് നേടി.
