id: MAT.25.36
reference: Matthew 25:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: γυμνὸς καὶ περιεβάλετέ με, ἠσθένησα καὶ ἐπεσκέψασθέ με, ἐν φυλακῇ ἤμην καὶ ἤλθατε πρός με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/036.yaml
  text: I was naked and you clothed me[a]; I was sick and you visited me[b]; I was in prison and you came to me.
translation:
  language: ml
  text: ഞാൻ വസ്ത്രമില്ലാത്തവനായിരുന്നു; നിങ്ങൾ എന്നെ ഉടുപ്പിച്ചു. ഞാൻ രോഗിയായിരുന്നു; നിങ്ങൾ എന്നെ സന്ദർശിച്ചു[a]. ഞാൻ തടവിലായിരുന്നു; നിങ്ങൾ എന്റെ അടുക്കൽ വന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്നെ കരുതലോടെ നോക്കി.” ഗ്രീക്ക് ക്രിയയ്ക്ക് കരുതലോടെയോ പരിചരണത്തോടെയോ സന്ദർശിക്കുക എന്ന അർഥവും ഉൾക്കൊള്ളാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυμνὸς
  choice: വസ്ത്രമില്ലാത്തവൻ
  rationale: അക്ഷരാർഥം വ്യക്തമായി നൽകുകയും, തുടർന്നുള്ള ‘ഉടുപ്പിച്ചു’ എന്ന പ്രവൃത്തിയുമായുള്ള നേരിട്ടുള്ള ബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: περιεβάλετέ
  choice: ഉടുപ്പിച്ചു
  rationale: ഒരാൾക്ക് വസ്ത്രം ധരിപ്പിക്കുക എന്ന περιβάλλωയുടെ സന്ദർഭോചിത അർഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: ἠσθένησα
  choice: ഞാൻ രോഗിയായിരുന്നു
  rationale: ക്രിയയ്ക്ക് പൊതുവായി ബലഹീനത എന്ന അർഥവും ഉണ്ടെങ്കിലും, കരുണാപ്രവൃത്തികളുടെ ഈ സന്ദർഭത്തിൽ രോഗാവസ്ഥയാണ് ഏറ്റവും സാധ്യതയുള്ള അർഥം.
- source_word: ἐπεσκέψασθέ
  choice: സന്ദർശിച്ചു
  rationale: ἐπισκέπτομαι എന്നത് കരുതലോടെയുള്ള സന്ദർശനത്തെയും പരിചരണത്തെയും സൂചിപ്പിക്കാം; ‘സന്ദർശിച്ചു’ എന്നത് അതിന്റെ നേരിട്ടുള്ള അർഥം സംരക്ഷിക്കുന്നു, കരുതലിന്റെ ഭാവം സന്ദർഭം നൽകുന്നു.
- source_word: φυλακῇ
  choice: തടവിൽ
  rationale: തടങ്കലിലായ അവസ്ഥയെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; ഒരു പ്രത്യേകതരം ജയിൽസ്ഥാപനത്തിലേക്ക് അർഥം ചുരുക്കുന്നില്ല.
- source_word: ἤλθατε πρός με
  choice: നിങ്ങൾ എന്റെ അടുക്കൽ വന്നു
  rationale: ഗ്രീക്കിലെ ലളിതമായ ‘എന്റെ അടുക്കൽ വന്നു’ എന്ന പ്രയോഗം അതേപടി നിലനിർത്തുകയും ‘സന്ദർശിക്കാൻ’ പോലുള്ള വ്യാഖ്യാനവികാസം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: കരുണാപ്രവൃത്തികളുടെ ഭാഷയിൽ വ്യാഖ്യാനവികാസത്തിന്റെ അളവ്
  choice: ‘ഉടുപ്പിച്ചു,’ ‘സന്ദർശിച്ചു,’ ‘എന്റെ അടുക്കൽ വന്നു’ എന്നീ മൂർത്തമായ പ്രവൃത്തികൾ നിലനിർത്തി.
  alternative: ‘പരിചരിച്ചു,’ ‘എന്നെ കാണാൻ വന്നു’ എന്നിങ്ങനെ വികസിപ്പിച്ച് പരിഭാഷപ്പെടുത്തുക.
  rationale: മൂലവാക്യം ലളിതമായ പ്രവൃത്തികളെയാണ് പറയുന്നത്. അവയെ വിശദീകരിച്ച് ദൈവശാസ്ത്രപരമോ ഇടയപരിപാലനപരമോ ആയ അധിക ആശയം ചേർക്കാതെ മൂലത്തിലെ ലാളിത്യവും സാധ്യതയുള്ള അർഥവ്യാപ്തിയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. സമാന്തരവാക്യങ്ങളുടെ താളം നിലനിർത്തിയിരിക്കുന്നു. ഇംഗ്ലീഷ് നൽകിയ അടിക്കുറിപ്പുകളിൽ മാർക്കർ-ഉള്ളടക്ക പൊരുത്തക്കേട് ഉണ്ടായതിനാൽ, ἐπεσκέψασθέ എന്ന പദത്തിന്റെ യഥാർഥ ലെക്സിക്കൽ വ്യത്യാസത്തിന് [a] ചേർത്തു; ἤλθατε πρός με ഇതിനകം അക്ഷരാർഥത്തിൽ പരിഭാഷപ്പെടുത്തിയതിനാൽ അതിന് വേറെ അടിക്കുറിപ്പ് ആവശ്യമില്ല.
