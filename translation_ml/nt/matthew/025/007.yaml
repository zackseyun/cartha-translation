  text: τότε ἠγέρθησαν πᾶσαι αἱ παρθένοι ἐκεῖναι καὶ ἐκόσμησαν τὰς λαμπάδας ⸀ἑαυτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/007.yaml
  text: Then all those virgins got up and trimmed their lamps[a].
translation:
  language: ml
  text: അപ്പോൾ ആ കന്യകമാർ എല്ലാവരും എഴുന്നേറ്റ് തങ്ങളുടെ വിളക്കുകൾ[a] ഒരുക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘പന്തങ്ങൾ’. ‘വിളക്കുകൾ’ എന്നു പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്ക് പദം കൈയിൽ കൊണ്ടുനടക്കുന്ന വെളിച്ചസ്രോതസ്സിനെയും സൂചിപ്പിക്കാം; എണ്ണയുടെയും ഒരുക്കത്തിന്റെയും സന്ദർഭത്തിൽ രണ്ടും സാധ്യമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: അപ്പോൾ
  rationale: സംഭവക്രമത്തിലെ അടുത്ത ഘട്ടത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἠγέρθησαν
  choice: എഴുന്നേറ്റ്
  rationale: ഉറക്കത്തിൽനിന്നോ കിടന്ന നിലയിൽനിന്നോ എഴുന്നേൽക്കുന്നതിനെ സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കുന്നു; ‘ഉണർത്തപ്പെട്ടു’ എന്ന നിർവചനത്തെ അനാവശ്യമായി ഉറപ്പിക്കുന്നില്ല.
- source_word: πᾶσαι αἱ παρθένοι ἐκεῖναι
  choice: ആ കന്യകമാർ എല്ലാവരും
  rationale: παρθένοι എന്ന പദത്തിന്റെ വിവാഹസന്ദർഭത്തിലുള്ള നേരിട്ടുള്ള അർഥവും ἐκεῖναι, πᾶσαι എന്നിവയുടെ സൂചനയും സമഗ്രതയും നിലനിർത്തുന്നു.
- source_word: ἐκόσμησαν
  choice: ഒരുക്കി
  rationale: കൊസ്മέω എന്നതിന്റെ ‘ക്രമപ്പെടുത്തുക, സജ്ജമാക്കുക’ എന്ന അർഥം വിളക്കുകളുടെ സന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; തിരി വെട്ടിയൊരുക്കുക മാത്രം എന്നതിലേക്ക് പ്രവൃത്തിയെ ചുരുക്കുന്നില്ല.
- source_word: λαμπάδας
  choice: വിളക്കുകൾ
  rationale: എണ്ണയുടെയും ഒരുക്കത്തിന്റെയും സമീപസന്ദർഭത്തിൽ സ്വാഭാവികമായ തിരഞ്ഞെടുപ്പ്; കൈയിൽ കൊണ്ടുനടക്കുന്ന പന്തങ്ങൾ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἑαυτῶν
  choice: തങ്ങളുടെ
  rationale: കർതൃസംബന്ധിയായ പ്രത്യയത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം; അവർക്കുതന്നെ ഉടമസ്ഥതയുള്ള വിളക്കുകളാണെന്ന് വ്യക്തമാക്കുന്നു.
