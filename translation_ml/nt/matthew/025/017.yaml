  text: Likewise[a], the one with the two gained two more.
translation:
  language: ml
  text: അതുപോലെതന്നെ, രണ്ടു താലന്തുള്ളവൻ രണ്ടു താലന്ത് കൂടി നേടി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡσαύτως
  choice: അതുപോലെതന്നെ
  rationale: മുൻവാക്യത്തിലെ ദാസന്റെ പ്രവൃത്തിയോടുള്ള താരതമ്യബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὁ τὰ δύο
  choice: രണ്ടു താലന്ത് ഉണ്ടായിരുന്നവൻ
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തമായ പ്രയോഗം സന്ദർഭത്തിൽ പറഞ്ഞിരിക്കുന്ന രണ്ടു താലന്തിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ അർത്ഥവ്യക്തതയ്ക്കായി സന്ദർഭത്തിൽനിന്നുള്ള ‘താലന്ത്’ ചേർത്തിരിക്കുന്നു, എന്നാൽ ‘ലഭിച്ച’ എന്നു ചേർത്ത് മൂലവാക്യത്തെ അനാവശ്യമായി വികസിപ്പിച്ചിട്ടില്ല.
- source_word: ἐκέρδησεν
  choice: നേടി
  rationale: സാമ്പത്തിക പ്രവർത്തനത്തിലൂടെ അധികമായി ലഭിച്ചതിനെ സൂചിപ്പിക്കുന്നതും ‘കൂലിയായി സമ്പാദിച്ചു’ എന്ന ആശയം നിർബന്ധിക്കാത്തതുമായ സ്വാഭാവിക പദമാണ്.
- source_word: ἄλλα δύο
  choice: വേറെ രണ്ടു താലന്ത്
  rationale: അതേ ഇനത്തിൽപ്പെട്ട രണ്ടെണ്ണംകൂടി എന്ന അർത്ഥം വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ നാമം ആവർത്തിക്കുന്നത് വായനാസൗകര്യം നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘താലന്ത്’ എന്ന സന്ദർഭനാമം വ്യക്തമാക്കിയെങ്കിലും ഗ്രീക്കിലെ സംക്ഷിപ്തതയും പ്രവർത്തനക്രമവും സാധ്യമായത്ര നിലനിർത്തി.
