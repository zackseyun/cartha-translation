id: MAT.25.44
reference: Matthew 25:44
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τότε ἀποκριθήσονται καὶ αὐτοὶ λέγοντες· Κύριε, πότε σε εἴδομεν πεινῶντα ἢ διψῶντα ἢ ξένον ἢ γυμνὸν ἢ ἀσθενῆ ἢ ἐν φυλακῇ καὶ οὐ διηκονήσαμέν σοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/044.yaml
  text: Then they too will answer, saying, ‘Lord, when did we see you hungry or thirsty or a stranger or naked or sick or in prison, and not serve you?’
translation:
  language: ml
  text: 'അപ്പോൾ അവരും മറുപടി പറഞ്ഞുകൊണ്ട്: ‘കർത്താവേ, അങ്ങ് വിശന്നവനായോ ദാഹിച്ചവനായോ അന്യനായോ വസ്ത്രമില്ലാത്തവനായോ രോഗിയായോ തടവിലായവനായോ ആയിരിക്കെ ഞങ്ങൾ അങ്ങയെ കണ്ട് അങ്ങേക്കു ശുശ്രൂഷ ചെയ്യാതിരുന്നത് എപ്പോഴാണ്?[a]’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“അങ്ങേക്കു സേവിക്കുക” അല്ലെങ്കിൽ “അങ്ങയെ പരിചരിക്കുക” എന്നും പരിഭാഷപ്പെടുത്താം (ഗ്രീക്ക്: διακονέω).'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: അപ്പോൾ
  rationale: ന്യായവിധിയുടെ സംഭവക്രമത്തിലെ അടുത്ത പ്രതികരണത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: καὶ αὐτοὶ
  choice: അവരും
  rationale: മുമ്പത്തെ കൂട്ടത്തെപ്പോലെ ഈ കൂട്ടവും മറുപടി പറയുന്നുവെന്ന ഉൾപ്പെടുത്തലും ലഘുവായ ഊന്നലും നിലനിർത്തുന്നു.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: κύριος എന്ന അഭിസംബോധനയുടെ ആദരസൂചകവും ക്രിസ്തുശാസ്ത്രപരവുമായ അനുരണനം നിലനിർത്തുന്ന പതിവ് മലയാളരൂപം.
- source_word: ξένον
  choice: അപരിചിതനായോ
  rationale: വംശീയതയെ അതിയായി നിർണ്ണയിക്കാതെ, സ്വീകരണം ആവശ്യമായ അന്യനെന്ന സാമൂഹിക അർത്ഥം നൽകുന്നു.
- source_word: γυμνὸν
  choice: വസ്ത്രമില്ലാത്തവനായോ
  rationale: ആധുനിക മലയാളത്തിൽ മാന്യവും വ്യക്തവുമായ രീതിയിൽ വസ്ത്രരാഹിത്യത്തെ സൂചിപ്പിക്കുന്നു; അപര്യാപ്ത വസ്ത്രധാരണവും സന്ദർഭത്തിൽ ഉൾക്കൊള്ളാം.
- source_word: ἀσθενῆ
  choice: രോഗിയായോ
  rationale: ശാരീരികവും സാമൂഹികവുമായ ആവശ്യങ്ങളുടെ പട്ടികയിൽ ‘രോഗി’ എന്ന അർത്ഥമാണ് ഏറ്റവും സ്വാഭാവികം.
- source_word: ἐν φυλακῇ
  choice: തടവിലായോ
  rationale: തടവറയിൽ കഴിയുന്ന അവസ്ഥയെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: διηκονήσαμέν σοι
  choice: അങ്ങേക്കു ശുശ്രൂഷ ചെയ്യാതിരുന്നു
  rationale: διακονέω സൂചിപ്പിക്കുന്ന പ്രായോഗിക സേവനത്തിന്റെയും പരിചരണത്തിന്റെയും വ്യാപ്തി നിലനിർത്തുന്ന മാന്യമായ മലയാളപ്രയോഗം.
theological_decisions:
- issue: യേശുവിനുള്ള κύριος എന്ന അഭിസംബോധന
  choice: കർത്താവേ
  alternative: നാഥാ / യജമാനനേ
  rationale: ആദരപൂർവമായ നേരിട്ടുള്ള അഭിസംബോധനയും ക്രിസ്തുശാസ്ത്രപരമായ അനുരണനവും നിലനിർത്തുന്നു; പാഠം പറയുന്നതിലധികം നിർവചിക്കുന്നില്ല.
- issue: διακονέω എന്ന ക്രിയയുടെ വ്യാപ്തി
  choice: ശുശ്രൂഷ ചെയ്യുക
  alternative: സേവിക്കുക / പരിചരിക്കുക
  rationale: സഹായം, പരിചരണം, സേവനം എന്നിവയുടെ അർത്ഥവ്യാപ്തി ഒരൊറ്റ സങ്കുചിത ആശയത്തിലേക്ക് ചുരുക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നേരിട്ടുള്ള അഭിസംബോധനയിൽ ‘അങ്ങ്’ രൂപം ഉപയോഗിച്ചു; ഗ്രീക്ക് വാക്യത്തിന്റെ ചോദ്യംചെയ്യുന്ന ഘടനയും ആവശ്യാവസ്ഥകളുടെ പട്ടികയും നിലനിർത്തി.
