review_pass:
  verdict: revise
  source_fidelity: The draft accurately reflects the sequence, future response, address to the Lord, and the paired questions of seeing him hungry and feeding him / thirsty and giving him drink. The repeated ‘കണ്ടു’ in the second clause is a permissible explicit rendering of the Greek ellipsis.
  naturalness: ‘കുടിക്കാൻ നൽകിയത്’ is understandable, but ‘കുടിക്കാൻ കൊടുത്തത്’ is more idiomatic modern Malayalam in this context and naturally leaves the supplied drink implicit, as the Greek does.
  terminology: ‘നീതിമാന്മാർ’ appropriately renders οἱ δίκαιοι, and ‘കർത്താവേ’ is the established, suitably respectful rendering of Κύριε. ‘അങ്ങയെ’ appropriately maintains the honorific address within the quotation.
  issues:
  - severity: low
    issue: Idiomatic phrasing for ἐποτίσαμεν
    rationale: The expression ‘കുടിക്കാൻ നൽകിയത്’ is somewhat stiff. Replacing it with ‘കുടിക്കാൻ കൊടുത്തത്’ gives natural Malayalam while retaining the source sense ‘gave [you] drink’ without adding a specific beverage.
  revised_text: 'അപ്പോൾ നീതിമാന്മാർ അവനോടു മറുപടി പറയും: “കർത്താവേ, എപ്പോഴാണ് ഞങ്ങൾ അങ്ങയെ വിശന്നവനായി കണ്ടു ഭക്ഷണം നൽകിയത്, അല്ലെങ്കിൽ ദാഹിച്ചവനായി കണ്ടു കുടിക്കാൻ കൊടുത്തത്?”'
