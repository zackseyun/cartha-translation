id: MAT.25.37
reference: Matthew 25:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τότε ἀποκριθήσονται αὐτῷ οἱ δίκαιοι λέγοντες· Κύριε, πότε σε εἴδομεν πεινῶντα καὶ ἐθρέψαμεν, ἢ διψῶντα καὶ ἐποτίσαμεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/037.yaml
  text: Then the righteous will answer him[a], saying, ‘Lord, when did we see you hungry and feed you, or thirsty and give you drink?’
translation:
  language: ml
  text: 'അപ്പോൾ നീതിമാന്മാർ അവനോടു മറുപടി പറയും: “കർത്താവേ, എപ്പോഴാണ് ഞങ്ങൾ അങ്ങയെ വിശന്നവനായി കണ്ടു ഭക്ഷണം നൽകിയത്, അല്ലെങ്കിൽ ദാഹിച്ചവനായി കണ്ടു കുടിക്കാൻ കൊടുത്തത്?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: അപ്പോൾ
  rationale: സംഭാഷണത്തിലെ സംഭവക്രമം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἀποκριθήσονται αὐτῷ
  choice: അവനോടു മറുപടി പറയും
  rationale: ഭാവികാല അർഥവും ദത്തിവിഭക്തിയിലെ പരോക്ഷ കർമബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: οἱ δίκαιοι
  choice: നീതിമാന്മാർ
  rationale: സുബ്സ്റ്റാന്റീവായി ഉപയോഗിച്ച വിശേഷണത്തെ, ഈ രംഗത്തിൽ നീതിയുള്ളവരായി തിരിച്ചറിയപ്പെടുന്ന ആളുകൾ എന്ന നിലയിൽ സംക്ഷിപ്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: λέγοντες
  choice: 'മറുപടി പറയും:'
  rationale: ഗ്രീക്കിലെ സംസാരത്തെ പരിചയപ്പെടുത്തുന്ന പാർട്ടിസിപ്പിന്റെ പ്രവർത്തനം മലയാളത്തിലെ നേരിട്ടുള്ള ഉദ്ധരണിയുടെ ചിഹ്നവും മുഖ്യക്രിയയും ചേർന്ന് സ്വാഭാവികമായി വഹിക്കുന്നു; അനാവശ്യമായ ‘പറഞ്ഞുകൊണ്ട്’ ഒഴിവാക്കുന്നു.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: നേരിട്ടുള്ള അഭിസംബോധനയും κύριος എന്ന പദത്തിന്റെ ബഹുമാനപരവും ക്രിസ്തുസംബന്ധവുമായ പ്രതിധ്വനിയും നിലനിർത്തുന്ന സ്ഥാപിത മലയാളരൂപം.
- source_word: πότε σε εἴδομεν
  choice: എപ്പോഴാണ് ഞങ്ങൾ അങ്ങയെ ... കണ്ടത്
  rationale: നേരിട്ടുള്ള കാലസംബന്ധിയായ ചോദ്യത്തെ സ്വാഭാവിക മലയാളവാക്യക്രമത്തിൽ അവതരിപ്പിക്കുന്നു; അഭിസംബോധനയുടെ ബഹുമാനനിലയ്ക്കനുസരിച്ച് ‘അങ്ങയെ’ ഉപയോഗിക്കുന്നു.
- source_word: πεινῶντα καὶ ἐθρέψαμεν
  choice: വിശന്നവനായി കണ്ടു ഭക്ഷണം നൽകിയത്
  rationale: വർത്തമാന പാർട്ടിസിപ്പിന്റെ അവസ്ഥയും τρέφω സൂചിപ്പിക്കുന്ന ഭക്ഷണം കൊടുക്കുന്ന സാക്ഷാൽ പ്രവൃത്തിയും വ്യക്തമായി നൽകുന്നു.
- source_word: ἢ διψῶντα καὶ ἐποτίσαμεν
  choice: അല്ലെങ്കിൽ ദാഹിച്ചവനായി കണ്ടു കുടിക്കാൻ നൽകിയത്
  rationale: സമാന്തര ഘടന സംരക്ഷിച്ച് ποτίζω എന്ന ക്രിയയുടെ ‘കുടിക്കാൻ കൊടുക്കുക’ എന്ന സ്വാഭാവിക മലയാള അർഥം നൽകുന്നു.
theological_decisions:
- issue: യേശുവിനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയിൽ κύριος എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: കർത്താവേ
  alternative: യജമാനനേ
  rationale: ‘കർത്താവേ’ ബഹുമാനപരമായ അഭിസംബോധനയും മത്തായിയുടെ സന്ദർഭത്തിലെ ക്രിസ്തുസംബന്ധമായ പ്രതിധ്വനിയും സംരക്ഷിക്കുന്നു; പാഠം പറയുന്നതിലധികം വ്യാഖ്യാനഭാരം ചേർക്കുന്നില്ല.
- issue: οἱ δίκαιοι എന്ന വിശേഷണത്തിന്റെ സാരവാചകപ്രയോഗം
  choice: നീതിമാന്മാർ
  alternative: നീതിയുള്ളവർ
  rationale: രംഗത്തിൽ നീതിമാന്മാരായി തിരിച്ചറിയപ്പെടുന്ന കൂട്ടത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും ഗൗരവമുള്ളതുമായ രൂപമാണ്; അവർ എങ്ങനെ നീതിമാന്മാരായി എന്ന ചോദ്യം വിവർത്തനം സ്വയം തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗ്രീക്കിലെ സമാന്തര ചോദ്യം നിലനിർത്തിയിട്ടുണ്ട്. ഇംഗ്ലീഷ് നൽകിയ അടിക്കുറിപ്പ് ἐποτίσαμεν-നോട് ബന്ധപ്പെട്ടതുപോലെ തോന്നുന്നുവെങ്കിലും അതിന്റെ marker ‘him’ എന്നിടത്ത് പൊരുത്തക്കേടോടെ നിൽക്കുന്നു; മലയാളത്തിൽ ‘കുടിക്കാൻ നൽകിയത്’ നേരിട്ടും സ്വാഭാവികവുമായതിനാൽ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
