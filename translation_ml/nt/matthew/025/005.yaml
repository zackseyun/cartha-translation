  text: χρονίζοντος δὲ τοῦ νυμφίου ἐνύσταξαν πᾶσαι καὶ ἐκάθευδον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/005.yaml
  text: But while the bridegroom was delayed[b][a], they all became drowsy and fell asleep.
translation:
  language: ml
  text: എന്നാൽ മണവാളൻ വൈകിയപ്പോൾ[a], അവർക്കെല്ലാം മയക്കം വന്നു; അവർ ഉറങ്ങിപ്പോയി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘മണവാളൻ ഏറെ സമയമെടുത്തപ്പോൾ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘അവർക്കെല്ലാം മയക്കം വന്നു; അവർ ഉറങ്ങിക്കൊണ്ടിരുന്നു.’ ‘മയക്കം വന്നു’ (ἐνύσταξαν) എന്നതും ‘ഉറങ്ങിക്കൊണ്ടിരുന്നു’ (ἐκάθευδον) എന്നതും ഗ്രീക്ക് വേർതിരിച്ചുപറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: χρονίζοντος
  choice: വൈകിയപ്പോൾ
  rationale: χρονίζω സൂചിപ്പിക്കുന്ന താമസം അഥവാ പ്രതീക്ഷിച്ചതിലും കൂടുതൽ സമയമെടുക്കൽ സ്വാഭാവികമായ മലയാളത്തിൽ സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു. ഗ്രീക്കിലെ genitive absolute-ന്റെ സമയബന്ധവും നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവിവരണത്തിൽനിന്നുള്ള നേരിയ വഴിത്തിരിവും താമസത്തിന്റെ ഫലമായ സംഭവവികാസവും വ്യക്തമാക്കുന്നു.
- source_word: νυμφίου
  choice: മണവാളൻ
  rationale: വിവാഹസന്ദർഭത്തിലെ νυμφίος എന്ന പദത്തിന്റെ കൃത്യവും മലയാള ബൈബിൾഭാഷയിൽ സുപരിചിതവുമായ സമാനപദമാണിത്.
- source_word: ἐνύσταξαν
  choice: മയക്കം വന്നു
  rationale: ഉറക്കത്തിലേക്കു നീങ്ങുന്ന ആദ്യഘട്ടത്തെ സൂചിപ്പിക്കുകയും തുടർന്ന് വരുന്ന യഥാർഥ ഉറക്കത്തിൽനിന്ന് അതിനെ വേർതിരിക്കുകയും ചെയ്യുന്ന സ്വാഭാവിക പ്രയോഗം.
- source_word: πᾶσαι
  choice: അവർക്കെല്ലാം … അവർ
  rationale: പത്ത് കന്യകമാരെയും ഉൾക്കൊള്ളുന്ന സ്ത്രീലിംഗ ബഹുവചനത്തിന്റെ സമഗ്രത മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἐκάθευδον
  choice: ഉറങ്ങിപ്പോയി
  rationale: മയക്കം വന്നതിൽനിന്ന് യഥാർഥ ഉറക്കത്തിലേക്കുള്ള പുരോഗതി വായനാസൗകര്യത്തോടെ നൽകുന്നു; ഗ്രീക്ക് imperfect രൂപം ‘ഉറങ്ങിക്കൊണ്ടിരുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താവുന്നതാണ്, അത് അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: മണവാളന്റെ ഉപമാചിത്രം
  choice: ‘മണവാളൻ’ എന്ന ഉപമാചിത്രം വ്യാഖ്യാനവികാസമില്ലാതെ നിലനിർത്തി.
  alternative: ‘വരൻ’ എന്നു പൊതുവായി പരിഭാഷപ്പെടുത്തുക, അല്ലെങ്കിൽ മണവാളനെ ക്രിസ്തുവായി വാക്യത്തിനുള്ളിൽ തന്നെ വ്യക്തമായി തിരിച്ചറിയിക്കുക.
  rationale: മത്തായിയുടെ വിശാലസന്ദർഭത്തിൽ ഈ ചിത്രത്തിന് ക്രിസ്തുസംബന്ധമായ പ്രതിധ്വനി ഉണ്ടെങ്കിലും, ഈ വാക്യം ഉപമയിലെ കഥാപാത്രത്തെ മാത്രമാണ് നേരിട്ട് അവതരിപ്പിക്കുന്നത്. അതിനാൽ അന്തർലീനമായ ദൈവശാസ്ത്രാർത്ഥം വിവർത്തനത്തിൽ വിശദീകരിച്ച് തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘മണവാളൻ’ ഉപമയുടെ വിവാഹപശ്ചാത്തലവും പരമ്പരാഗത ഗൗരവവും നിലനിർത്തുന്നു; ‘മയക്കം വന്നു; അവർ ഉറങ്ങിപ്പോയി’ എന്ന ക്രമം രണ്ട് ഗ്രീക്ക് ക്രിയകളിലെ ആശയപുരോഗതി സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
