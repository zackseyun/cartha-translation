  source_fidelity: ‘മണവാളൻ വൈകിയപ്പോൾ’ χρονίζοντος τοῦ νυμφίου എന്ന genitive absolute-ന്റെ സമയസൂചനയും വൈകലിന്റെ ആശയവും കൃത്യമായി നൽകുന്നു. ‘അവർക്കെല്ലാം മയക്കം വന്നു; അവർ ഉറങ്ങിപ്പോയി’ πᾶσαι, ἐνύσταξαν, ἐκάθευδον എന്നിവയിലെ എല്ലാവരെയും ഉൾക്കൊള്ളുന്ന സ്വഭാവവും മയക്കത്തിൽനിന്ന് ഉറക്കത്തിലേക്കുള്ള ക്രമവും വിശ്വസ്തമായി പ്രതിഫലിപ്പിക്കുന്നു. ‘ഉറങ്ങിപ്പോയി’ imperfect-ന്റെ തുടർച്ചാഭാവത്തെ പൂർണമായി രൂപപരമായി പകർത്തുന്നില്ലെങ്കിലും, ഇംഗ്ലീഷ് POB-യിലെ ‘fell asleep’ എന്ന അംഗീകൃത വ്യാഖ്യാനത്തോടു ചേർന്ന, സന്ദർഭയോഗ്യമായ സ്വാഭാവിക അവതരണമാണ്; തുടർച്ചാഭാവം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
