id: MAT.25.23
reference: Matthew 25:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ κύριος αὐτοῦ· Εὖ, δοῦλε ἀγαθὲ καὶ πιστέ, ἐπὶ ὀλίγα ἦς πιστός, ἐπὶ πολλῶν σε καταστήσω· εἴσελθε εἰς τὴν χαρὰν τοῦ κυρίου σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/023.yaml
  text: His master said to him[a], ‘Well done, good and faithful servant. You were faithful over a few things; I will put you over many things. Enter into the joy of your master.’
translation:
  language: ml
  text: 'അവന്റെ യജമാനൻ അവനോടു പറഞ്ഞു: “കൊള്ളാം, നല്ലവനും വിശ്വസ്തനുമായ ദാസനേ![a] കുറച്ചു കാര്യങ്ങളിൽ നീ വിശ്വസ്തനായിരുന്നു; അനേകം കാര്യങ്ങളുടെ ചുമതല ഞാൻ നിന്നെ ഏൽപ്പിക്കും. നിന്റെ യജമാനന്റെ സന്തോഷത്തിലേക്കു പ്രവേശിക്കുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അടിമയേ.” ഗ്രീക്കിലെ δοῦλος എന്ന പദത്തിന് സന്ദർഭമനുസരിച്ച് ദാസനെയോ അടിമയെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφη
  choice: പറഞ്ഞു
  rationale: നേരിട്ടുള്ള വാക്കുകൾ അവതരിപ്പിക്കുന്ന സാധാരണ ആഖ്യാനപ്രയോഗമായി സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: κύριος
  choice: യജമാനൻ
  rationale: ഉപമയിലെ ദാസന്റെ മാനുഷിക അധികാരിയെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ‘കർത്താവ്’ എന്ന ദൈവിക സ്ഥാനപ്പേര് അനാവശ്യമായി മുൻനിർത്താതെയും അധികാരബന്ധം വ്യക്തമാക്കിയും ഈ പദം പ്രവർത്തിക്കുന്നു.
- source_word: δοῦλε
  choice: ദാസനേ
  rationale: യജമാനന്റെ അധികാരത്തിൻ കീഴിലുള്ള വ്യക്തിയെ സൂചിപ്പിക്കുന്ന δοῦλος എന്ന പദത്തിന്റെ ബന്ധപരവും പദവിപരവുമായ അർത്ഥം ‘ദാസൻ’ നിലനിർത്തുന്നു; ‘അടിമ’ എന്ന ശക്തമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: Εὖ
  choice: കൊള്ളാം
  rationale: അംഗീകാരവും പ്രശംസയും പ്രകടിപ്പിക്കുന്ന εὖ എന്ന ആശയം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀγαθὲ καὶ πιστέ
  choice: നല്ലവനും വിശ്വസ്തനുമായ
  rationale: രണ്ട് അഭിസംബോധനാ വിശേഷണങ്ങളും നിലനിർത്തുന്നു; πιστός എന്ന പദത്തിന്റെ ആവർത്തനം ‘വിശ്വസ്തൻ’ എന്നതിലൂടെ വാക്യത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἐπὶ ὀλίγα
  choice: കുറച്ചു കാര്യങ്ങളിൽ
  rationale: ഏൽപ്പിക്കപ്പെട്ട പരിമിത ഉത്തരവാദിത്വമേഖലയെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: πιστός
  choice: വിശ്വസ്തനായിരുന്നു
  rationale: വിശ്വാസ്യതയോടെയും ഉത്തരവാദിത്വത്തോടെയും പ്രവർത്തിച്ചു എന്ന അർത്ഥം നൽകുകയും മുമ്പുള്ള πιστέ-യുമായുള്ള പദബന്ധം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐπὶ πολλῶν σε καταστήσω
  choice: അനേകം കാര്യങ്ങളുടെ ചുമതല ഞാൻ നിന്നെ ഏൽപ്പിക്കും
  rationale: καθίστημι ഇവിടെ കൂടുതൽ കാര്യങ്ങളുടെ മേൽ നിയമിക്കുകയോ ചുമതലപ്പെടുത്തുകയോ ചെയ്യുന്നതാണ്; മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ ഉത്തരവാദിത്വഭാഷ ഉപയോഗിക്കുന്നു.
- source_word: εἴσελθε εἰς τὴν χαρὰν
  choice: സന്തോഷത്തിലേക്കു പ്രവേശിക്കുക
  rationale: പ്രവേശനത്തിന്റെ രൂപകം ചുരുക്കാതെ നിലനിർത്തുന്നു; വെറും ‘സന്തോഷത്തിൽ പങ്കുചേരുക’ എന്നു വ്യാഖ്യാനിച്ച് സമതലപ്പെടുത്തുന്നില്ല.
- source_word: τοῦ κυρίου σου
  choice: നിന്റെ യജമാനന്റെ
  rationale: വാക്യത്തിന്റെ ആദ്യഭാഗത്തിലെ κύριος-നോടുള്ള സന്ദർഭപരവും പദപരവുമായ ഏകീകരണം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഉപമയിലെ κύριος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: യജമാനൻ
  alternative: കർത്താവ്
  rationale: കഥയ്ക്കുള്ളിലെ നേരിട്ടുള്ള സൂചകം ദാസന്റെ മാനുഷിക അധികാരിയാണ്. അതിനാൽ ‘യജമാനൻ’ കഥാസന്ദർഭം വ്യക്തമാക്കുന്നു; ഉപമയുടെ ദൈവശാസ്ത്രപരമായ സൂചനയെ ഇല്ലാതാക്കുകയോ κύριος-നെ നേരിട്ട് ദൈവിക സ്ഥാനപ്പേരാക്കി തീർക്കുകയോ ചെയ്യുന്നില്ല.
- issue: δοῦλος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ദാസൻ
  alternative: അടിമ
  rationale: ഇവിടെ ഊന്നൽ വിശ്വസ്തമായ കാര്യനിർവഹണത്തിലും യജമാനൻ–ദാസൻ ബന്ധത്തിലുമാണ്. ‘ദാസൻ’ സ്വാഭാവികവും മാന്യവുമായ മുഖ്യവായന നൽകുന്നു; പദത്തിന്റെ നിയമപരമോ ബന്ധിതമോ ആയ ശക്തമായ അർത്ഥസാധ്യത ‘അടിമ’ എന്ന അടിക്കുറിപ്പിലൂടെ തുറന്നുവെക്കുന്നു.
- issue: εἴσελθε εἰς τὴν χαρὰν എന്ന പ്രയോഗത്തിന്റെ രൂപകം
  choice: സന്തോഷത്തിലേക്കു പ്രവേശിക്കുക
  alternative: സന്തോഷത്തിൽ പങ്കുചേരുക
  rationale: മൂലത്തിലെ ചലനവും പ്രവേശനരൂപകവും സംരക്ഷിക്കുന്നു. ‘പങ്കുചേരുക’ സാധ്യമായ അർത്ഥവ്യാഖ്യാനമാണെങ്കിലും അത് രൂപകത്തെ വിശദീകരിച്ച് ചുരുക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ദാസൻ,’ ‘യജമാനൻ,’ ‘വിശ്വസ്തൻ’ എന്നിവ സാധാരണ വായനക്കാർക്കു ഗ്രാഹ്യമായിരിക്കെ മൂലത്തിലെ അധികാരബന്ധവും പദാവർത്തനവും നിലനിർത്തുന്നു. ഉദ്ധരണിക്കുള്ളിലെ അഭിസംബോധനയും കല്പനാരൂപവും ഗൗരവത്തോടെ നൽകിയിരിക്കുന്നു.
