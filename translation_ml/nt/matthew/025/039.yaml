  text: And when did we see you sick or in prison and come to you?[a]
translation:
  language: ml
  text: എപ്പോഴാണ് ഞങ്ങൾ അങ്ങയെ രോഗിയായോ തടവിലോ കണ്ടതും അങ്ങയുടെ അടുക്കൽ വന്നതും?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അങ്ങയെ സന്ദർശിച്ചത്?” ഗ്രീക്കിൽ കൂടുതൽ അക്ഷരാർഥത്തിൽ, “അങ്ങയുടെ അടുക്കൽ വന്നത്?” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: πότε
  choice: എപ്പോഴാണ്
  rationale: പ്രവൃത്തിയുടെ സമയം ചോദിക്കുന്ന ചോദ്യക്രിയാവിശേഷണത്തിന് സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: δέ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയില്ല
  rationale: തുടർച്ചയായ ചോദ്യങ്ങളെ മൃദുവായി ബന്ധിപ്പിക്കുന്ന ഘടകം; മലയാളത്തിൽ ചോദ്യത്തിന്റെ സ്വാഭാവിക ഒഴുക്ക് തന്നെയാണ് ഇതിന്റെ പ്രവർത്തനം വഹിക്കുന്നത്.
- source_word: εἴδομεν
  choice: ഞങ്ങൾ ... കണ്ടിട്ട്
  rationale: ഭൂതകാല ദർശനത്തെയും തുടർന്ന് വന്ന പ്രവൃത്തിയുമായുള്ള ബന്ധത്തെയും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀσθενοῦντα
  choice: രോഗിയായി
  rationale: സന്ദർഭത്തിൽ ശാരീരിക രോഗാവസ്ഥയാണ് ഉദ്ദേശിക്കുന്നത്; ‘ബലഹീനനായി’ എന്നത് അനാവശ്യമായി വിശാലമാണ്.
- source_word: ἐν φυλακῇ
  choice: തടവിൽ
  rationale: തടങ്കൽസ്ഥിതിയെ സംക്ഷിപ്തവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἤλθομεν πρός σε
  choice: അങ്ങയുടെ അടുക്കൽ വന്നത്
  rationale: ഗ്രീക്കിലെ ‘അങ്ങയുടെ അടുത്തേക്കു വന്നു’ എന്ന ലളിതമായ ചലനപ്രയോഗം നിലനിർത്തുന്നു; ‘സന്ദർശിച്ചു’ എന്ന വ്യാഖ്യാനപരമായ പ്രത്യേകത മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ἤλθομεν πρός σε എന്നത് ‘സന്ദർശിച്ചു’ എന്നോ കൂടുതൽ അക്ഷരാർഥത്തിൽ ‘അടുക്കൽ വന്നു’ എന്നോ പരിഭാഷപ്പെടുത്തണോ
  choice: അങ്ങയുടെ അടുക്കൽ വന്നത്
  alternative: അങ്ങയെ സന്ദർശിച്ചത്
  rationale: കരുണാപ്രവൃത്തികളാണ് വിപുലമായ സന്ദർഭമെങ്കിലും, ഇവിടെ ഗ്രീക്ക് പ്രത്യേകമായി ‘സന്ദർശിക്കുക’ എന്ന ക്രിയ ഉപയോഗിക്കുന്നില്ല. അതിനാൽ ഉറവിടത്തിന്റെ തുറന്ന അർഥം മുഖ്യവാചകത്തിൽ സൂക്ഷിച്ച് വ്യാഖ്യാനപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നേരിട്ടുള്ള ചോദ്യം. യേശുവിനെ അഭിസംബോധന ചെയ്യുന്നതിനാൽ ആദരസൂചകമായ ‘അങ്ങ്’ രൂപം ഉപയോഗിച്ചു; ഗ്രീക്കിലെ ഏകവചന രണ്ടാംപുരുഷത്തെ നിലനിർത്തി.
