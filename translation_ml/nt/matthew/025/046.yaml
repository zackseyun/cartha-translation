source:
  edition: SBLGNT
  text: καὶ ἀπελεύσονται οὗτοι εἰς κόλασιν αἰώνιον, οἱ δὲ δίκαιοι εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/046.yaml
  text: And these will go away into eternal punishment[a], but the righteous into eternal life.
translation:
  language: ml
  text: ഇവർ നിത്യശിക്ഷയിലേക്കു[a] പോകും; എന്നാൽ നീതിമാന്മാർ നിത്യജീവനിലേക്കു പോകും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘യുഗദൈർഘ്യമുള്ള ശിക്ഷയിലേക്കു’ … ‘യുഗദൈർഘ്യമുള്ള ജീവനിലേക്കു.’ αἰώνιος എന്ന വിശേഷണത്തിന്റെ അർത്ഥം ചില സന്ദർഭങ്ങളിൽ ചർച്ചചെയ്യപ്പെടുന്നു. എന്നാൽ ഇവിടെ ഒരേ പദം ‘ശിക്ഷ’യെയും ‘ജീവൻ’നെയും വിശേഷിപ്പിക്കുന്നതിനാൽ പ്രധാനപാഠത്തിൽ രണ്ടിടത്തും ‘നിത്യ’ എന്നു നൽകി സമാന്തരത നിലനിർത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπελεύσονται
  choice: പോകും
  rationale: ἀπέρχομαι എന്ന ക്രിയയുടെ ഭാവികാലരൂപം ഇവിടെ ഒരു അന്തിമസ്ഥാനത്തേക്കുള്ള പുറപ്പെടലിനെ സൂചിപ്പിക്കുന്നു. ലക്ഷ്യസ്ഥാനം വ്യക്തമാക്കിയിരിക്കുന്നതിനാൽ ‘പോകും’ എന്നത് സ്വാഭാവികവും അർത്ഥസമ്പൂർണ്ണവുമായ മലയാളമാണ്.
- source_word: οὗτοι
  choice: ഇവർ
  rationale: മുമ്പ് വിവരിച്ച കൂട്ടത്തെ ചൂണ്ടിക്കാണിക്കുന്ന സർവനാമം. ‘ഇവർ’ എന്നത് സംക്ഷിപ്തമായി ആ സൂചന നിലനിർത്തുന്നു.
- source_word: κόλασιν
  choice: ശിക്ഷ
  rationale: അന്തിമവിധിയുടെ ഈ സന്ദർഭത്തിൽ κόλασις ശിക്ഷാത്മകമായ ഫലത്തെയാണ് സൂചിപ്പിക്കുന്നത്. പരിഹാരപരമായ ശിക്ഷണം എന്ന് അനാവശ്യമായി വ്യാഖ്യാനിക്കാതെ ‘ശിക്ഷ’ അർത്ഥം നേരിട്ട് നൽകുന്നു.
- source_word: αἰώνιον
  choice: നിത്യ
  rationale: ഒരേ വിശേഷണം ‘ശിക്ഷ’യെയും ‘ജീവൻ’നെയും വിശേഷിപ്പിക്കുന്നതിനാൽ രണ്ടു ഭാഗങ്ങളിലും ‘നിത്യ’ ഉപയോഗിച്ച് ഗ്രീക്കിലെ സമാന്തരത സംരക്ഷിക്കുന്നു. ‘യുഗദൈർഘ്യമുള്ള’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: δίκαιοι
  choice: നീതിമാന്മാർ
  rationale: നീതിയുള്ളവരെന്നോ നീതിമാന്മാരായി കണക്കാക്കപ്പെടുന്നവരെന്നോ ഉള്ള നാമവാചകപ്രയോഗം. ആധുനിക മലയാളത്തിൽ ‘നീതിമാന്മാർ’ സ്വാഭാവികവും ബൈബിൾസന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: ζωὴν
  choice: ജീവൻ
  rationale: ζωήയുടെ സാധാരണവും സന്ദർഭോചിതവുമായ പരിഭാഷയാണ് ‘ജീവൻ’; വിശദീകരണപരമായ കൂട്ടിച്ചേർക്കൽ ആവശ്യമില്ല.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: രണ്ടു കൂട്ടരെയും അവരുടെ അന്തിമഫലങ്ങളെയും തമ്മിൽ വ്യത്യസ്തമാക്കുന്ന വിരുദ്ധബന്ധം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: κόλασιν αἰώνιον, ζωὴν αἰώνιον എന്നീ സമാന്തര പ്രയോഗങ്ങളിലെ αἰώνιον എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: രണ്ടിടത്തും ‘നിത്യ’ എന്നു പരിഭാഷപ്പെടുത്തുക
  alternative: രണ്ടിടത്തും ‘യുഗദൈർഘ്യമുള്ള’ എന്നു പരിഭാഷപ്പെടുത്തുക
  rationale: ഗ്രീക്കിൽ ഒരേ വിശേഷണം ശിക്ഷയെയും ജീവനെയും വിശേഷിപ്പിക്കുന്നു. അവയുടെ ദൈർഘ്യമോ സ്വഭാവമോ പരിഭാഷയിൽ വ്യത്യസ്തമാക്കാതെ സമാന്തരത കാത്തുസൂക്ഷിക്കണം. ‘നിത്യ’ ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമായ പ്രധാന പരിഭാഷയാണ്; പദത്തിന്റെ ചർച്ചചെയ്യപ്പെടുന്ന മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ വിരുദ്ധബന്ധം ‘എന്നാൽ’ എന്നതിലൂടെ വ്യക്തമാക്കുകയും മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി രണ്ടാം ഭാഗത്തും ‘പോകും’ ആവർത്തിക്കുകയും ചെയ്തു.
