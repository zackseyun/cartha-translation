  text: ὕστερον δὲ ἔρχονται καὶ αἱ λοιπαὶ παρθένοι λέγουσαι· Κύριε κύριε, ἄνοιξον ἡμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/011.yaml
  text: Later[a], the other virgins also come, saying, ‘Lord, lord[c][b], open to us.’
translation:
  language: ml
  text: പിന്നീട് ശേഷിച്ച കന്യകമാരും[a] വന്ന്, ‘കർത്താവേ, കർത്താവേ[b], ഞങ്ങൾക്കു തുറന്നുതരണമേ[c]’ എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘മറ്റു കന്യകമാരും.’
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ ‘യജമാനനേ, യജമാനനേ’ അല്ലെങ്കിൽ ‘അയ്യാ, അയ്യാ.’ ഗ്രീക്ക്: ‘ക്യുറിയേ, ക്യുറിയേ.’'
    reason: alternative_reading
  - marker: c
    text: ഗ്രീക്കിൽ ‘ഞങ്ങൾക്കു തുറക്കണമേ’ എന്നു മാത്രമാണ്; ‘വാതിൽ’ എന്നത് സന്ദർഭത്തിൽ സൂചിതമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕστερον
  choice: പിന്നീട്
  rationale: കഥയിലെ തുടർന്നുള്ള സംഭവത്തെ സൂചിപ്പിക്കുന്ന കാലവാചക ക്രിയാവിശേഷണം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇത് നേരിയ ബന്ധകമാണ്; ‘പിന്നീട്’ എന്ന തുടക്കം സംഭവമാറ്റം സ്വാഭാവികമായി അറിയിക്കുന്നതിനാൽ വേറെ ബന്ധകം ചേർത്തിട്ടില്ല.
- source_word: ἔρχονται
  choice: വന്ന്
  rationale: ഗ്രീക്കിലെ ആഖ്യാനവർത്തമാനം മലയാളകഥനത്തിൽ സ്വാഭാവികമായ ഭൂതകാലഘടനയായി നൽകി; തുടർന്നുള്ള ‘പറഞ്ഞു’ എന്ന ക്രിയയുമായി ചേർന്ന് വരവിനെയും സംസാരത്തെയും വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: καὶ
  choice: -ഉം
  rationale: മറ്റു കന്യകമാരും രംഗത്തിലെത്തുന്നു എന്ന സങ്കലനാർഥം മലയാളത്തിലെ ചേർക്കൽപ്രത്യയം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: αἱ λοιπαὶ παρθένοι
  choice: ശേഷിച്ച കന്യകമാർ
  rationale: λοιπαί എന്നത് ‘ശേഷിച്ചവർ/മറ്റുള്ളവർ’ എന്നർഥം വഹിക്കുന്നു; സന്ദർഭത്തിൽ മുമ്പ് പുറത്തുനിന്നുപോയ കൂട്ടത്തിലെ ശേഷിച്ച കന്യകമാരെയാണ് സൂചിപ്പിക്കുന്നത്. παρθένοι എന്നതിന്റെ നേരിട്ടുള്ള അർഥം ‘കന്യകമാർ’ എന്നു നിലനിർത്തുന്നു.
- source_word: λέγουσαι
  choice: എന്നു പറഞ്ഞു
  rationale: നേരിട്ടുള്ള ഉദ്ധരണിയെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്ന കഥനരൂപം.
- source_word: Κύριε κύριε
  choice: കർത്താവേ, കർത്താവേ
  rationale: κύριος എന്ന അഭിസംബോധനയുടെ ബഹുമാനാർഥവും മത്തായിയിലെ ദൈവശാസ്ത്രപരമായ പ്രതിധ്വനിയും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു; ആവർത്തനം അടിയന്തരത പ്രകടമാക്കുന്നതിനാൽ അതേപടി നിലനിർത്തുന്നു.
- source_word: ἄνοιξον ἡμῖν
  choice: ഞങ്ങൾക്കു തുറന്നുതരണമേ
  rationale: ആജ്ഞാരൂപത്തിലെ അഭ്യർഥനയും ἡμῖν എന്ന ദാതൃവിഭക്തിയുടെ പ്രയോജന/പ്രവേശനാർഥവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. ‘വാതിൽ’ സന്ദർഭത്തിൽ വ്യക്തമായിരുന്നാലും ഗ്രീക്കിൽ പ്രകടമല്ലാത്തതിനാൽ മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: κύριος എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അഭിസംബോധനയിലെ വിവർത്തനം
  choice: കർത്താവേ
  alternative: യജമാനനേ / പ്രഭോ
  rationale: ഉടനെയുള്ള ഉപമാസന്ദർഭത്തിൽ ഇത് ബഹുമാനപൂർവമായ അഭിസംബോധനയായിരിക്കാം; അതേസമയം മത്തായിയുടെ വിപുലമായ പ്രയോഗത്തിൽ ദൈവശാസ്ത്രപരമായ ഭാരം വഹിക്കാനും കഴിയും. ‘കർത്താവേ’ ഈ ഉദ്ദേശപൂർവമായ അർഥസാധ്യത ചുരുക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി ഉപയോഗിച്ചു. മുഖ്യപാഠത്തിൽ ഗ്രീക്കിൽ പ്രകടമല്ലാത്ത ‘വാതിൽ’ ചേർത്തിട്ടില്ല; എന്നാൽ മലയാളത്തിലെ വിനീതമായ അഭ്യർഥനയ്ക്ക് യോജിച്ച ‘തരണമേ’ രൂപം ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദപ്രയോഗങ്ങൾക്ക് പിന്നാലെ നൽകിയിരിക്കുന്നു.
