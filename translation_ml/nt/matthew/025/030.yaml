id: MAT.25.30
reference: Matthew 25:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ τὸν ἀχρεῖον δοῦλον ἐκβάλετε εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/030.yaml
  text: And throw the worthless servant into the outer darkness[a]. In that place there will be weeping and gnashing of teeth.
translation:
  language: ml
  text: ഒന്നിനും കൊള്ളാത്ത ആ അടിമയെ[a] പുറത്തെ ഇരുട്ടിലേക്ക് എറിഞ്ഞുകളയുക. അവിടെ കരച്ചിലും പല്ലുകടിയും ഉണ്ടാകും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘ദാസനെ.’ ഗ്രീക്ക് പദമായ doulos എന്നതിന് ‘അടിമ’ എന്നും ‘ദാസൻ’ എന്നും അർഥമാകാം; ഈ ഉപമയിൽ യജമാനനോടുള്ള ബന്ധിത നില പ്രധാനമായതിനാൽ ഇവിടെ ‘അടിമ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀχρεῖον
  choice: ഒന്നിനും കൊള്ളാത്ത
  rationale: യജമാനന്റെ വിലയിരുത്തലിൽ പ്രയോജനമോ മൂല്യമോ ഇല്ലാത്തവൻ എന്ന കടുത്ത അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; വെറും സാമ്പത്തിക ‘ലാഭമില്ലായ്മ’യായി അർഥം ചുരുക്കുന്നില്ല.
- source_word: δοῦλον
  choice: അടിമ
  rationale: ഉപമയിലെ യജമാനൻ–അടിമ സാമൂഹികബന്ധവും ബന്ധിത നിലയും ഇവിടെ പ്രസക്തമായതിനാൽ ‘ദാസൻ’ എന്നതിനെക്കാൾ ‘അടിമ’ മൂലപദത്തിന്റെ ശക്തി വ്യക്തമായി നൽകുന്നു.
- source_word: ἐκβάλετε
  choice: എറിഞ്ഞുകളയുക
  rationale: ബലമായ ആജ്ഞയും പെട്ടെന്നുള്ള പുറത്താക്കലും സ്വാഭാവികവും ദൃശ്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: σκότος τὸ ἐξώτερον
  choice: പുറത്തെ ഇരുട്ട്
  rationale: അനുഗ്രഹത്തിന്റെയും ആഘോഷത്തിന്റെയും ഇടത്തിൽനിന്നുള്ള പുറത്താക്കലിനെ സൂചിപ്പിക്കുന്ന മത്തായിയുടെ സ്ഥിരപ്രയോഗം വ്യാഖ്യാനം കൂട്ടാതെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἐκεῖ
  choice: അവിടെ
  rationale: തൊട്ടുമുമ്പ് പറഞ്ഞ ‘പുറത്തെ ഇരുട്ട്’ എന്ന സ്ഥലത്തേക്ക് ലളിതമായും വ്യക്തമായും വിരൽചൂണ്ടുന്നു.
- source_word: κλαυθμὸς
  choice: കരച്ചിൽ
  rationale: ദുഃഖത്തിന്റെ പ്രകടനത്തെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; വിലാപത്തിന്റെ തീവ്രതയെ അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: പല്ലുകടി
  rationale: വേദനയോ ക്രോധമോ രണ്ടും ഉൾക്കൊള്ളാവുന്ന മൂലപ്രയോഗത്തിന്റെ ദൃശ്യശക്തിയും അർഥവ്യാപ്തിയും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഉപമയിലെ ന്യായവിധിയുടെ ദൃശ്യത്തിന്റെ സ്വഭാവം
  choice: പുറത്താക്കലിന്റെയും ദാരുണാവസ്ഥയുടെയും ദൃശ്യം അതേപടി നിലനിർത്തുന്നു; അത് നരകമോ അന്തിമ ന്യായവിധിയോ മറ്റൊരു ശിക്ഷയോ എന്ന് വിവർത്തനത്തിൽ വ്യക്തമാക്കുന്നില്ല.
  alternative: ഇത് നരകത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്നു എന്ന് ചേർക്കുക; അല്ലെങ്കിൽ താൽക്കാലികമോ വെറും രൂപകാത്മകമോ ആയ പുറത്താക്കലായി വ്യക്തമാക്കുക.
  rationale: ഇത് മത്തായിയിൽ ആവർത്തിക്കുന്ന ന്യായവിധിഭാഷയാണെങ്കിലും, വാക്യം തന്നെ നൽകുന്ന ദൃശ്യത്തിനപ്പുറം ഒരു പ്രത്യേക സിദ്ധാന്തവ്യാഖ്യാനം വിവർത്തനത്തിലേക്ക് കൊണ്ടുവരാതിരിക്കുന്നത് യഥാർഥമായ വ്യാഖ്യാനസമ്മർദം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഒന്നിനും കൊള്ളാത്ത’ എന്ന പ്രയോഗം വിധിയുടെ കാഠിന്യം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു. ‘കരച്ചിലും പല്ലുകടിയും’ എന്ന സംക്ഷിപ്ത സമാന്തരഘടന മൂലത്തിലെ ആവർത്തനസൂത്രത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
