revisions:
- from: 'രണ്ട് താലന്ത് ലഭിച്ചവനും അടുത്തുവന്ന് പറഞ്ഞു: “കർത്താവേ[a], അങ്ങ് എനിക്ക് രണ്ട് താലന്ത് ഏൽപ്പിച്ചല്ലോ. നോക്കൂ, ഞാൻ വേറെ രണ്ട് താലന്ത് കൂടി നേടി.”[b]'
  to: 'രണ്ട് താലന്ത് ലഭിച്ചവനും അടുത്തുവന്ന് പറഞ്ഞു: “കർത്താവേ[a], അങ്ങ് എനിക്ക് രണ്ട് താലന്ത് ഏൽപ്പിച്ചു. നോക്കൂ, ഞാൻ മറ്റൊരു രണ്ട് താലന്ത് നേടി.”[b]'
