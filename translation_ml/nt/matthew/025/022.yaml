id: MAT.25.22
reference: Matthew 25:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: προσελθὼν ⸀δὲ καὶ ὁ τὰ δύο ⸀τάλαντα εἶπεν· Κύριε, δύο τάλαντά μοι παρέδωκας· ἴδε ἄλλα δύο τάλαντα ⸀ἐκέρδησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/022.yaml
  text: Then the one who had received the two talents also came forward and said[a], ‘Lord, you handed over to me two talents. Look[b], I gained two more talents.’
translation:
  language: ml
  text: 'രണ്ട് താലന്ത് ലഭിച്ചവനും അടുത്തുവന്ന് പറഞ്ഞു: “കർത്താവേ[a], അങ്ങ് എനിക്ക് രണ്ട് താലന്ത് ഏൽപ്പിച്ചു. നോക്കൂ, ഞാൻ മറ്റൊരു രണ്ട് താലന്ത് നേടി.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “യജമാനനേ.” ഗ്രീക്കിലെ κύριος എന്ന അഭിസംബോധന സാധാരണയായി “കർത്താവ്” എന്നു പരിഭാഷപ്പെടുത്തുന്നു; ഈ ഉപമയിൽ അത് യജമാനനോടുള്ള ആദരപൂർവമായ അഭിസംബോധനയായും വരാം.
    reason: alternative_reading
  - marker: b
    text: താലന്ത് എന്നത് സ്വാഭാവിക കഴിവല്ല, വലിയൊരു തൂക്ക-ധനമൂല്യ ഏകകമായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: προσελθὼν
  choice: അടുത്തുവന്ന്
  rationale: προσέρχομαι എന്ന ക്രിയയുടെ സമീപിച്ചുവരുക എന്ന അർഥവും തുടർന്ന് സംസാരിക്കുന്ന ആഖ്യാനക്രമവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: δὲ καὶ
  choice: -വനും
  rationale: മുൻ ദാസന്റെ വരവിനോടുള്ള തുടർച്ചയും ഈ ദാസനും അതുപോലെ വന്നുവെന്ന കൂട്ടിച്ചേർക്കലും മലയാളത്തിലെ ‘-ഉം’ ഘടന സംക്ഷിപ്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: ὁ τὰ δύο τάλαντα
  choice: രണ്ട് താലന്ത് ലഭിച്ചവൻ
  rationale: ഗ്രീക്കിലെ substantival ഘടന സന്ദർഭമനുസരിച്ച് വ്യക്തമായി തിരിച്ചറിയിക്കുന്നു; ‘ലഭിച്ച’ എന്നത് ഉപമയുടെ മുൻസന്ദർഭത്തിൽനിന്നുള്ള സ്വാഭാവിക പൂരിപ്പിക്കലാണ്.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: κύριος എന്ന അഭിസംബോധനയുടെ പതിവായ മലയാള പരിഭാഷ നിലനിർത്തുന്നു; ഈ ഉപമയിൽ ‘യജമാനനേ’ എന്നും അർഥമാകാമെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: παρέδωκας
  choice: ഏൽപ്പിച്ചല്ലോ
  rationale: പരിപാലനത്തിനായി കൈമാറി എന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘-ല്ലോ’ മുമ്പ് ഏൽപ്പിച്ച കാര്യം ഓർമിപ്പിക്കുന്ന പ്രസ്താവനയുടെ ഭാവം പ്രകടിപ്പിക്കുന്നു.
- source_word: ἴδε
  choice: നോക്കൂ
  rationale: ഫലത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന ആജ്ഞാർഥക പ്രയോഗത്തിന്റെ ശക്തി ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἄλλα δύο τάλαντα
  choice: വേറെ രണ്ട് താലന്ത് കൂടി
  rationale: ആദ്യത്തെ രണ്ടിനുപുറമേ തുല്യമായ മറ്റൊരു രണ്ട് എന്ന അർഥം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐκέρδησα
  choice: നേടി
  rationale: κερδαίνω എന്നതിന്റെ ‘ലാഭമായി നേടുക’ എന്ന അർഥം നിലനിർത്തുന്നു; സമ്പാദിച്ച രീതി അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: τάλαντα
  choice: താലന്ത്
  rationale: പുരാതന വലിയ തൂക്ക-ധനമൂല്യ ഏകകത്തിന്റെ പരമ്പരാഗത നാമം നിലനിർത്തുന്നു; സ്വാഭാവിക കഴിവല്ലെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ഉപമയിലെ κύριος എന്ന അഭിസംബോധന
  choice: കർത്താവേ
  alternative: യജമാനനേ
  rationale: ‘കർത്താവ്’ κύριος എന്ന പദത്തിന്റെ പതിവായ സമാനപദമാണ്; എന്നാൽ ഈ സാമൂഹിക സന്ദർഭത്തിൽ യജമാനനോടുള്ള ആദരപൂർവമായ അഭിസംബോധനയുമാകാമെന്ന യഥാർഥ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘താലന്ത്’ എന്ന പരമ്പരാഗത സാംസ്കാരിക പദം വിശദീകരണ അടിക്കുറിപ്പോടെ നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
