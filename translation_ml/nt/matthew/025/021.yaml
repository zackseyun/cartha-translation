revisions:
- from: 'അവന്റെ യജമാനൻ[a] അവനോടു പറഞ്ഞു: “കൊള്ളാം, നല്ലവനും വിശ്വസ്തനുമായ ദാസാ[b]! കുറച്ചു കാര്യങ്ങളിൽ നീ വിശ്വസ്തനായിരുന്നു; അനേകം കാര്യങ്ങളുടെ ചുമതല ഞാൻ നിന്നെ ഏൽപ്പിക്കും. നിന്റെ യജമാനന്റെ സന്തോഷത്തിലേക്കു പ്രവേശിക്കുക.”'
  to: 'അവന്റെ യജമാനൻ[a] അവനോടു പറഞ്ഞു: “നന്നായി, നല്ലവനും വിശ്വസ്തനുമായ ദാസാ[b]! കുറച്ചു കാര്യങ്ങളുടെ മേൽ നീ വിശ്വസ്തനായിരുന്നു; അനേകം കാര്യങ്ങളുടെ മേൽ ഞാൻ നിന്നെ നിയമിക്കും. നിന്റെ യജമാനന്റെ സന്തോഷത്തിലേക്കു പ്രവേശിക്കുക.”'
  rationale: The revision strengthens the opening commendation and renders the appointment-over-many construction more directly, while retaining the draft’s faithful handling of κύριος, δοῦλος, the repeated ‘faithful,’ and the entrance metaphor. Footnote markers remain attached to the corresponding lexical items.
