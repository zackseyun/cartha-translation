id: MAT.25.21
reference: Matthew 25:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ἔφη αὐτῷ ὁ κύριος αὐτοῦ· Εὖ, δοῦλε ἀγαθὲ καὶ πιστέ, ἐπὶ ὀλίγα ἦς πιστός, ἐπὶ πολλῶν σε καταστήσω· εἴσελθε εἰς τὴν χαρὰν τοῦ κυρίου σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/021.yaml
  text: His master said to him[a], ‘Well done, good and faithful servant. You were faithful over a few things; I will appoint you over many things[b]. Enter into the joy of your master.’
translation:
  language: ml
  text: 'അവന്റെ യജമാനൻ[a] അവനോടു പറഞ്ഞു: “നന്നായി, നല്ലവനും വിശ്വസ്തനുമായ ദാസാ[b]! കുറച്ചു കാര്യങ്ങളുടെ മേൽ നീ വിശ്വസ്തനായിരുന്നു; അനേകം കാര്യങ്ങളുടെ മേൽ ഞാൻ നിന്നെ നിയമിക്കും. നിന്റെ യജമാനന്റെ സന്തോഷത്തിലേക്കു പ്രവേശിക്കുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിലെ κύριος എന്ന പദം ഇവിടെ ‘കർത്താവ്’ എന്നും പരിഭാഷപ്പെടുത്താം; എന്നാൽ ദാസനും യജമാനനും തമ്മിലുള്ള ഉപമയിലെ ബന്ധത്തിന് ‘യജമാനൻ’ കൂടുതൽ യോജിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘അടിമയേ.’ ഗ്രീക്കിലെ δοῦλος എന്ന പദത്തിന് സന്ദർഭമനുസരിച്ച് ‘ദാസൻ’ എന്നും ‘അടിമ’ എന്നും അർഥമാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφη
  choice: പറഞ്ഞു
  rationale: നേരിട്ടുള്ള സംഭാഷണം അവതരിപ്പിക്കുന്ന സാധാരണ ആഖ്യാനപ്രയോഗം; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: κύριος
  choice: യജമാനൻ
  rationale: ഉപമയുടെ തൽക്ഷണസന്ദർഭത്തിൽ ദാസന്റെ അധികാരിയെയാണ് സൂചിപ്പിക്കുന്നത്. അതിനാൽ ഇവിടെ ‘കർത്താവ്’ എന്നതിനെക്കാൾ കഥാതലത്തിലുള്ള ബന്ധം ‘യജമാനൻ’ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: δοῦλε
  choice: ദാസാ
  rationale: അധീനതയും സേവനബന്ധവും നിലനിർത്തിക്കൊണ്ട് മലയാള ബൈബിൾഭാഷയിൽ സ്വാഭാവികമായി കേൾക്കുന്ന സംബോധന. ‘അടിമ’ എന്ന സാമൂഹിക അർഥവും സാധ്യമാകുന്നതിനാൽ അത് അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: Εὖ
  choice: കൊള്ളാം
  rationale: അംഗീകാരവും അഭിനന്ദനവും പ്രകടിപ്പിക്കുന്ന εὖ എന്ന പ്രയോഗത്തിന് സ്വാഭാവികമായ ആധുനിക മലയാള സമാനത.
- source_word: ἀγαθὲ καὶ πιστέ
  choice: നല്ലവനും വിശ്വസ്തനുമായ
  rationale: രണ്ട് വിശേഷണങ്ങളും വേർതിരിച്ചും അവയുടെ പ്രശംസാത്മക ശക്തി നിലനിർത്തിയും പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: ἐπὶ ὀλίγα ἦς πιστός
  choice: കുറച്ചു കാര്യങ്ങളിൽ നീ വിശ്വസ്തനായിരുന്നു
  rationale: ഏൽപ്പിക്കപ്പെട്ട പരിമിതമായ ഉത്തരവാദിത്വമേഖലയെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; πιστός എന്ന പദത്തിന്റെ ആവർത്തനം ‘വിശ്വസ്തൻ’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: ἐπὶ πολλῶν σε καταστήσω
  choice: അനേകം കാര്യങ്ങളുടെ ചുമതല ഞാൻ നിന്നെ ഏൽപ്പിക്കും
  rationale: καθίστημι ഇവിടെ കൂടുതൽ ഉത്തരവാദിത്വത്തിലേക്കുള്ള നിയമനത്തെ സൂചിപ്പിക്കുന്നു. അക്ഷരാർഥത്തിലുള്ള ‘മേൽ നിയമിക്കും’ എന്നതിനെക്കാൾ ഈ രൂപം ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: εἴσελθε εἰς τὴν χαρὰν
  choice: സന്തോഷത്തിലേക്കു പ്രവേശിക്കുക
  rationale: ‘പ്രവേശിക്കുക’ എന്ന മൂലരൂപകം സംരക്ഷിക്കുന്നു; വെറും ‘സന്തോഷത്തിൽ പങ്കുചേരുക’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: ഉപമയിലെ κύριος ദൈവത്തെയോ ക്രിസ്തുവിനെയോ പ്രതീകാത്മകമായി സൂചിപ്പിച്ചേക്കാവുന്നിടത്തെ പരിഭാഷ
  choice: യജമാനൻ
  alternative: കർത്താവ്
  rationale: ഉപമയുടെ കഥാതലത്തിൽ ഇത് ദാസന്റെ യജമാനനെയാണ് നേരിട്ട് സൂചിപ്പിക്കുന്നത്. ‘യജമാനൻ’ ആ ബന്ധം സംരക്ഷിക്കുകയും, വായനക്കാർക്ക് പ്രതീകാത്മക ദൈവശാസ്ത്രസൂചന തിരിച്ചറിയാനുള്ള സാധ്യത തുറന്നുവെക്കുകയും ചെയ്യുന്നു.
- issue: δοῦλος എന്ന പദത്തിലെ സേവകനും അടിമയും ഉൾപ്പെടുന്ന അർഥവ്യാപ്തി
  choice: ദാസൻ
  alternative: അടിമ
  rationale: ഈ പ്രശംസാവാക്യത്തിൽ ‘ദാസൻ’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്; എന്നാൽ മൂലപദം നിയമപരമായ അധീനസ്ഥിതിയിലുള്ള ‘അടിമ’യെയും സൂചിപ്പിക്കാമെന്ന അർഥം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. പരമ്പരാഗതമായി ഗ്രഹിക്കാവുന്ന ‘ദാസൻ,’ ‘വിശ്വസ്തൻ,’ ‘പ്രവേശിക്കുക’ എന്നീ പദങ്ങൾ നിലനിർത്തിയപ്പോൾ, ഉത്തരവാദിത്വനിയമനത്തെ ‘ചുമതല ഏൽപ്പിക്കുക’ എന്ന് വ്യക്തമായി അവതരിപ്പിച്ചു.
