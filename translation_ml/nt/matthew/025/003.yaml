source:
  edition: SBLGNT
  text: ⸂αἱ γὰρ⸃ μωραὶ λαβοῦσαι τὰς λαμπάδας αὐτῶν οὐκ ἔλαβον μεθ’ ἑαυτῶν ἔλαιον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/003.yaml
  text: For the foolish[a], when they took their lamps, did not take oil with them.
translation:
  language: ml
  text: കാരണം, ബുദ്ധിയില്ലാത്തവർ തങ്ങളുടെ വിളക്കുകൾ[a] എടുത്തപ്പോൾ, കൂടെ എണ്ണ എടുത്തില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ ‘പന്തങ്ങൾ’ (ഗ്രീക്ക്: λαμπάδας).'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ പ്രസ്താവനയ്ക്ക് വിശദീകരണം നൽകുന്ന ബന്ധകത്തിന്റെ ശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: μωραὶ
  choice: ബുദ്ധിയില്ലാത്തവർ
  rationale: സ്ത്രീലിംഗ ബഹുവചന വിശേഷണം ഉപമയിലെ കന്യകമാരെ സൂചിപ്പിക്കുന്നു; മുൻസന്ദർഭം ആവർത്തിക്കാതെ അവരുടെ സ്വഭാവനിർണ്ണയം വ്യക്തമാക്കുന്നു.
- source_word: λαβοῦσαι
  choice: എടുത്തപ്പോൾ
  rationale: പ്രധാന ക്രിയയോടു ബന്ധപ്പെട്ട മുൻകാലിക പങ്കാളിക്രിയയുടെ കാലസംബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: λαμπάδας
  choice: വിളക്കുകൾ
  rationale: എണ്ണയെക്കുറിച്ചുള്ള ഉടൻപിന്നാലെയുള്ള പരാമർശത്തോടു ചേരുന്ന പരമ്പരാഗതവും സ്വാഭാവികവുമായ വിവർത്തനം; ‘പന്തങ്ങൾ’ എന്ന അർഥവും സാധ്യമാണ്.
- source_word: οὐκ ἔλαβον
  choice: എടുത്തില്ല
  rationale: λαβοῦσαι/ἔλαβον എന്ന ഗ്രീക്ക് ക്രിയാപദ ആവർത്തനം ‘എടുത്തപ്പോൾ/എടുത്തില്ല’ എന്ന രൂപത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: μεθ’ ἑαυτῶν
  choice: കൂടെ
  rationale: പ്രതിഫലനസർവനാമമുള്ള ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാള തുല്യം.
- source_word: ἔλαιον
  choice: എണ്ണ
  rationale: വിളക്കുകൾക്കുള്ള എണ്ണയെ നേരിട്ട് സൂചിപ്പിക്കുന്ന സാധാരണ മലയാളപദം.
