id: MAT.25.41
reference: Matthew 25:41
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τότε ἐρεῖ καὶ τοῖς ἐξ εὐωνύμων· Πορεύεσθε ἀπ’ ἐμοῦ ⸀οἱ κατηραμένοι εἰς τὸ πῦρ τὸ αἰώνιον τὸ ἡτοιμασμένον τῷ διαβόλῳ καὶ τοῖς ἀγγέλοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/041.yaml
  text: Then he will also say to those on the left[a], ‘Go away from me, you cursed, into the eternal fire prepared for the devil and his angels.’
translation:
  language: ml
  text: 'അപ്പോൾ അവൻ ഇടതുവശത്തുള്ളവരോടും പറയും: ‘ശപിക്കപ്പെട്ടവരേ, എന്നെ വിട്ട് പിശാചിനും അവന്റെ ദൂതന്മാർക്കുമായി ഒരുക്കിയിരിക്കുന്ന നിത്യാഗ്നിയിലേക്കു പോകുവിൻ.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: അപ്പോൾ
  rationale: ന്യായവിധിദൃശ്യത്തിലെ സംഭവക്രമം സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ കാലസൂചകപ്രയോഗം.
- source_word: ἐρεῖ
  choice: പറയും
  rationale: ഭാവികാലത്തിലുള്ള λέγωയുടെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: τοῖς ἐξ εὐωνύμων
  choice: ഇടതുവശത്തുള്ളവരോട്
  rationale: രാജാവിന്റെ ഇടതുവശത്ത് നിൽക്കുന്ന കൂട്ടത്തെ സന്ദർഭാനുസൃതമായി വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: Πορεύεσθε ἀπ’ ἐμοῦ
  choice: എന്നെ വിട്ട് ... പോകുവിൻ
  rationale: പ്രസംഗകന്റെ സന്നിധിയിൽനിന്നുള്ള വേർപാടും അകന്നുപോകാനുള്ള കല്പനയും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: οἱ κατηραμένοι
  choice: ശപിക്കപ്പെട്ടവരേ
  rationale: പൂർണ്ണ നിഷ്ക്രിയ കൃദന്തരൂപത്തിന്റെ അഭിസംബോധനാഭാവം സംക്ഷിപ്തമായും ഗൗരവത്തോടെയും പകരുന്നു.
- source_word: εἰς τὸ πῦρ τὸ αἰώνιον
  choice: നിത്യാഗ്നിയിലേക്ക്
  rationale: εἰς സൂചിപ്പിക്കുന്ന ലക്ഷ്യത്തിലേക്കുള്ള ചലനവും αἰώνιον എന്നതിന്റെ സാധാരണ സന്ദർഭാർഥവും സംരക്ഷിക്കുന്നു.
- source_word: τὸ ἡτοιμασμένον
  choice: ഒരുക്കിയിരിക്കുന്ന
  rationale: മുൻകൂട്ടിയുള്ള ഒരുക്കത്തിന്റെ ഫലമായി ഇപ്പോൾ നിലനിൽക്കുന്ന അവസ്ഥയെ പൂർണ്ണ നിഷ്ക്രിയ കൃദന്തത്തിന് യോജിച്ച് പ്രകടിപ്പിക്കുന്നു.
- source_word: τῷ διαβόλῳ
  choice: പിശാചിന്
  rationale: ഈ അന്ത്യന്യായവിധി സന്ദർഭത്തിൽ διάβολος സാത്താന്റെ സ്ഥിരപ്പെട്ട വ്യക്തിനാമസൂചനയായി പ്രവർത്തിക്കുന്നു.
- source_word: τοῖς ἀγγέλοις αὐτοῦ
  choice: അവന്റെ ദൂതന്മാർക്ക്
  rationale: ഇവിടെ ἄγγελοι മനുഷ്യസന്ദേശവാഹകരെയല്ല, പിശാചിനോടു ചേർന്ന അതീന്ദ്രിയജീവികളെയാണ് സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: ന്യായവിധിയുടെ സന്ദർഭത്തിൽ αἰώνιον എന്നതിന്റെ പരിഭാഷ
  choice: നിത്യ
  alternative: യുഗാന്തരമായ / എന്നേക്കുമുള്ള
  rationale: ഈ സന്ദർഭത്തിലെ സാധാരണ കൊയ്നേ പ്രയോഗത്തിന് ‘നിത്യ’ യോജിക്കുന്നു; വാക്യം പറയുന്നതിലപ്പുറം ഒരു പ്രത്യേക സിദ്ധാന്തവ്യവസ്ഥ അടിച്ചേൽപ്പിക്കുന്നില്ല.
- issue: διάβολος, ἄγγελοι എന്നിവയുടെ സൂചിതർ
  choice: പിശാചും അവന്റെ ദൂതന്മാരും
  alternative: അപവാദിയും അവന്റെ സന്ദേശവാഹകരും
  rationale: അന്ത്യന്യായവിധിയുടെ സന്ദർഭത്തിൽ ഇവ സാത്താനെയും അവനോടു ചേർന്ന അതീന്ദ്രിയദൂതന്മാരെയും സൂചിപ്പിക്കുന്ന സ്ഥിരപ്പെട്ട പ്രയോഗങ്ങളാണ്.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിൽ, പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള നേരിട്ടുള്ള ശൈലി. നേരിട്ടുള്ള അഭിസംബോധനയുടെ ന്യായവിധിസ്വരം നിലനിർത്താൻ ‘പോകുവിൻ’ ഉപയോഗിച്ചു; കൃത്രിമമായ അതിപുരാതന പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
