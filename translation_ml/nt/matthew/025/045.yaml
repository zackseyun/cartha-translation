id: MAT.25.45
reference: Matthew 25:45
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τότε ἀποκριθήσεται αὐτοῖς λέγων· Ἀμὴν λέγω ὑμῖν, ἐφ’ ὅσον οὐκ ἐποιήσατε ἑνὶ τούτων τῶν ἐλαχίστων, οὐδὲ ἐμοὶ ἐποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/045.yaml
  text: Then he will answer them[a], saying, ‘Truly I say to you, insofar as you did not do it for one of the least of these[b], neither did you do it for me.’
translation:
  language: ml
  text: 'അപ്പോൾ അവൻ അവരോടു മറുപടി പറയും: “സത്യമായി[a] ഞാൻ നിങ്ങളോടു പറയുന്നു: ഈ ഏറ്റവും എളിയവരിൽ ഒരാൾക്കു നിങ്ങൾ ഇതു ചെയ്യാതെ പോയ അളവിൽ, എനിക്കും നിങ്ങൾ അതു ചെയ്തില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, കൂടുതൽ അക്ഷരാർഥത്തിൽ: “ആമേൻ, ഞാൻ നിങ്ങളോടു പറയുന്നു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: അപ്പോൾ
  rationale: ന്യായവിധിയുടെ രംഗത്തിലെ സംഭവക്രമം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἀποκριθήσεται αὐτοῖς λέγων
  choice: അവൻ അവരോടു മറുപടി പറയും
  rationale: ഭാവികാലവും മറുപടിയുടെ അർഥവും നിലനിർത്തിക്കൊണ്ട്, ഗ്രീക്കിലെ പ്രസംഗസൂചക കൃദന്തം മലയാളത്തിൽ സ്വാഭാവികമായ ക്രിയാരൂപത്തിലാക്കി.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: യേശുവിന്റെ ഗൗരവപൂർണമായ ഉറപ്പിക്കൽ സൂത്രവാക്യത്തിന്റെ ഊന്നൽ വ്യക്തവും ആധുനികവുമായ മലയാളത്തിൽ പകരുന്നു; ‘ആമേൻ’ എന്ന കൂടുതൽ രൂപപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἐφ’ ὅσον
  choice: ചെയ്യാതിരുന്നിടത്തോളം
  rationale: അളവ്/പരിധി സൂചിപ്പിക്കുന്ന പ്രയോഗത്തിന്റെ സൂക്ഷ്മത ‘കാരണം’ എന്നു ചുരുക്കാതെ മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: οὐκ ἐποιήσατε
  choice: നിങ്ങൾ ഇതു ചെയ്യാതിരുന്നു
  rationale: മുൻസന്ദർഭത്തിൽ പറഞ്ഞ പ്രവൃത്തികളെ സൂചിപ്പിക്കുന്ന അന്തർലീന കർമം ‘ഇതു’ എന്നതിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: ἑνὶ τούτων τῶν ἐλαχίστων
  choice: ഈ ഏറ്റവും എളിയവരിൽ ഒരാൾക്ക്
  rationale: കൂട്ടത്തിലെ പ്രതിനിധിയായ ഏകവചനവും ἐλάχιστος എന്ന അത്യുത്തമാവസ്ഥയും സംരക്ഷിക്കുന്ന, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന രൂപം.
- source_word: οὐδὲ ἐμοὶ ἐποιήσατε
  choice: എനിക്കും നിങ്ങൾ അതു ചെയ്തില്ല
  rationale: നിഷേധാത്മകമായ സമാന്തര നിഗമനവും ആവർത്തനത്തിന്റെ വാചാടോപബലവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘ഈ ഏറ്റവും എളിയവർ’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: 'പരിഭാഷ ആ വിഭാഗത്തെ കൂടുതൽ നിർവചിക്കാതെ വാക്യത്തിലെ നേരിട്ടുള്ള പ്രസ്താവന നിലനിർത്തുന്നു: അവരിൽ ഒരാൾക്കു ചെയ്യാതിരുന്നത് യേശുവിനും ചെയ്യാതിരുന്നതാണ്.'
  alternative: ഇത് പ്രത്യേകമായി യേശുവിന്റെ ശിഷ്യന്മാരെയോ ദൂതന്മാരെയോ സൂചിപ്പിക്കുന്നു; അല്ലെങ്കിൽ കൂടുതൽ വിശാലമായി താഴ്ന്നവരെയും ആവശ്യത്തിലിരിക്കുന്നവരെയും സൂചിപ്പിക്കുന്നു.
  rationale: ഈ വാക്യം യേശുവുമായുള്ള തിരിച്ചറിയൽ വ്യക്തമാക്കുന്നുവെങ്കിലും, പരാമർശിക്കപ്പെട്ട കൂട്ടത്തിന്റെ പരിധി വിവർത്തനത്തിൽ തീർപ്പാക്കാൻ ആവശ്യമായത്ര കൃത്യമായി നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘അപ്പോൾ’, ‘മറുപടി പറയും’, ‘സത്യമായി’ എന്നീ പ്രയോഗങ്ങൾ ന്യായവിധി പ്രസംഗത്തിന്റെ ഔപചാരികത നിലനിർത്തുന്നു; അനാവശ്യമായ സഭാപരമോ വിഭാഗീയമോ ആയ പദാവലി ഒഴിവാക്കി.
