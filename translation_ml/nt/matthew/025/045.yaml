- from: 'അപ്പോൾ അവൻ അവരോടു മറുപടി പറയും: “സത്യമായി[a] ഞാൻ നിങ്ങളോടു പറയുന്നു: ഈ ഏറ്റവും എളിയവരിൽ ഒരാൾക്ക്[b] നിങ്ങൾ ഇതു ചെയ്യാതിരുന്നിടത്തോളം, എനിക്കും നിങ്ങൾ അതു ചെയ്തില്ല.”'
  to: 'അപ്പോൾ അവൻ അവരോടു മറുപടി പറയും: “സത്യമായി[a] ഞാൻ നിങ്ങളോടു പറയുന്നു: ഈ ഏറ്റവും എളിയവരിൽ ഒരാൾക്കു നിങ്ങൾ ഇതു ചെയ്യാതെ പോയ അളവിൽ, എനിക്കും നിങ്ങൾ അതു ചെയ്തില്ല.”'
  rationale: 'Only the Malayalam rendering of ἐφ’ ὅσον has been adjusted to clarify its correlative extent: failure to act for one of these least ones is, to that same extent, failure to act for Jesus. The text continues to leave the identity of ‘these least ones’ unspecified, and both original footnote anchors are retained.'
