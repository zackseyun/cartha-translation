  text: ἐπείνασα γὰρ καὶ ἐδώκατέ μοι φαγεῖν, ἐδίψησα καὶ ἐποτίσατέ με, ξένος ἤμην καὶ συνηγάγετέ με,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/035.yaml
  text: For I was hungry and you gave me something to eat[a]; I was thirsty and you gave me something to drink; I was a stranger and you welcomed me,
translation:
  language: ml
  text: എന്തെന്നാൽ, എനിക്ക് വിശന്നു; നിങ്ങൾ എനിക്ക് ഭക്ഷിക്കാൻ എന്തെങ്കിലും തന്നു. എനിക്ക് ദാഹിച്ചു; നിങ്ങൾ എനിക്ക് കുടിക്കാൻ എന്തെങ്കിലും തന്നു. ഞാൻ അപരിചിതനായിരുന്നു; നിങ്ങൾ എന്നെ സ്വീകരിച്ചു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘നിങ്ങൾ എന്നെ അകത്തു ചേർത്തു.’ ഗ്രീക്ക് ക്രിയയുടെ അക്ഷരാർഥം ‘ഒരുമിച്ചുകൂട്ടി’ എന്നാണ്; ഇവിടെ അപരിചിതനായ ഒരാളെ അതിഥിസൽക്കാരത്തോടെ സ്വീകരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπείνασα
  choice: എനിക്ക് വിശന്നു
  rationale: πεινάω എന്ന ക്രിയയുടെ ഭൂതകാലാനുഭവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിനുള്ള വിശദീകരണം അവതരിപ്പിക്കുന്ന γάρ എന്ന ബന്ധകത്തിന്റെ അർഥം നിലനിർത്തുന്നു.
- source_word: ἐδώκατέ μοι φαγεῖν
  choice: നിങ്ങൾ എനിക്ക് ഭക്ഷിക്കാൻ തന്നു
  rationale: δίδωμι + ദത്തിവ് + അനന്തക്രിയ എന്ന ഘടനയുടെ ‘ഒരാൾക്ക് ഭക്ഷിക്കാൻ കൊടുക്കുക’ എന്ന അർഥം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἐδίψησα
  choice: എനിക്ക് ദാഹിച്ചു
  rationale: ദാഹം അനുഭവിച്ച ഭൂതകാലാവസ്ഥയെ സാധാരണ മലയാളത്തിൽ കൃത്യമായി അറിയിക്കുന്നു.
- source_word: ἐποτίσατέ με
  choice: നിങ്ങൾ എനിക്ക് കുടിക്കാൻ തന്നു
  rationale: ποτίζω എന്നതിന്റെ സന്ദർഭോചിതമായ ‘കുടിക്കാൻ കൊടുക്കുക’ എന്ന അർഥം മുൻവാക്യത്തോടുള്ള സമാന്തരതയോടെ നൽകുന്നു; ‘വെള്ളം’ എന്ന് അനാവശ്യമായി പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: ξένος
  choice: അപരിചിതൻ
  rationale: ξένος ഇവിടെ പരിചയമോ സാധാരണ സാമൂഹികബന്ധമോ ഇല്ലാത്ത വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; ‘വിദേശി’ എന്നു പറഞ്ഞ് ദേശീയതയിലേക്കോ നിയമപദവിയിലേക്കോ അർഥം ചുരുക്കുന്നില്ല.
- source_word: συνηγάγετέ με
  choice: നിങ്ങൾ എന്നെ സ്വീകരിച്ചു
  rationale: συνάγω എന്നതിന്റെ അക്ഷരാർഥം ‘ഒരുമിച്ചുകൂട്ടുക’ ആണെങ്കിലും ξένος എന്ന പദത്തോടൊപ്പം ഇവിടെ അതിഥിസൽക്കാരത്തോടെ സ്വീകരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘സ്വീകരിച്ചു’ എന്നത് അതിന്റെ സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: ξένος ... συνηγάγετέ με എന്നതിലെ അതിഥിസൽക്കാരഭാഷ
  choice: ‘ഞാൻ അപരിചിതനായിരുന്നു; നിങ്ങൾ എന്നെ സ്വീകരിച്ചു’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ഞാൻ പരദേശിയായിരുന്നു; നിങ്ങൾ എന്നെ വീട്ടിൽ ചേർത്തു’
  rationale: ദുർബലനായ അപരിചിതനോടുള്ള വ്യക്തിപരമായ കരുണയും സ്വീകരണവും മുൻനിർത്തുന്നു; ആധുനിക രാഷ്ട്രീയമോ നിയമപരമോ ആയ വിഭാഗങ്ങൾ പാഠത്തിൽ ചേർക്കുന്നില്ല. അതേസമയം ‘വീട്ടിൽ’ എന്നത് ഗ്രീക്കിൽ വ്യക്തമല്ലാത്തതിനാൽ മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ആവർത്തിക്കുന്ന ഗ്രീക്ക് ഘടനകളുടെ സമാന്തരത നിലനിർത്തിയിട്ടുണ്ട്; വാക്യത്തിന്റെ വിശദീകരണബന്ധം ‘എന്തെന്നാൽ’ വഴി പ്രകടമാക്കി.
