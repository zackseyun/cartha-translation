source:
  edition: SBLGNT
  text: ἔδει ⸂σε οὖν⸃ βαλεῖν ⸂τὰ ἀργύριά⸃ μου τοῖς τραπεζίταις, καὶ ἐλθὼν ἐγὼ ἐκομισάμην ἂν τὸ ἐμὸν σὺν τόκῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/027.yaml
  text: Therefore[a], you should have deposited my money with the bankers, and when I came, I would have received what was mine with interest.
translation:
  language: ml
  text: അതുകൊണ്ട്, നീ എന്റെ പണം ബാങ്കുകാരുടെ പക്കൽ നിക്ഷേപിക്കേണ്ടതായിരുന്നു.[a] അങ്ങനെ ഞാൻ വന്നപ്പോൾ, എന്റേത് പലിശയോടുകൂടെ തിരികെ ലഭിക്കുമായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “എന്റെ വെള്ളി ബാങ്കുകാരുടെ പക്കൽ ഇടേണ്ടതായിരുന്നു.”'
    reason: ἀργύριαയുടെ ‘വെള്ളി’ എന്ന അക്ഷരാർഥവും βαλεῖνയുടെ ‘ഇടുക’ എന്ന കൂടുതൽ അക്ഷരാർഥപരമായ വികൽപവും രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: ἔδει
  choice: നിക്ഷേപിക്കേണ്ടതായിരുന്നു
  rationale: ഭൂതകാലത്തിൽ ചെയ്യേണ്ടിയിരുന്നെങ്കിലും ചെയ്യാതിരുന്ന കടമയെയോ ഉചിതമായ നടപടിയെയോ സൂചിപ്പിക്കുന്ന ἔδειയുടെ ശാസനാഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻപത്തെ കുറ്റപ്പെടുത്തലിൽനിന്നുള്ള നിഗമനത്തെ വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: βαλεῖν
  choice: നിക്ഷേപിക്കുക
  rationale: അക്ഷരാർഥത്തിൽ ‘ഇടുക’ എന്നാണെങ്കിലും ബാങ്കുകാരും പലിശയും ഉൾപ്പെടുന്ന സാമ്പത്തിക സന്ദർഭത്തിൽ പണം ഏൽപ്പിച്ചുവെക്കുന്നതാണ് ഉദ്ദേശ്യം.
- source_word: τὰ ἀργύριά μου
  choice: എന്റെ പണം
  rationale: ἀργύριον ‘വെള്ളി’ എന്നും ‘പണം’ എന്നും അർഥമാക്കാം; ഇവിടെ വാണിജ്യസന്ദർഭത്തിന് ‘പണം’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: τραπεζίταις
  choice: ബാങ്കുകാരുടെ പക്കൽ
  rationale: പണം സ്വീകരിച്ച് പലിശ നൽകുന്നവരെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; ‘നാണയം മാറ്റുന്നവർ’ എന്നതിനെക്കാൾ ‘ബാങ്കുകാർ’ യോജിക്കുന്നു.
- source_word: ἐλθὼν ἐγὼ
  choice: ഞാൻ വന്നപ്പോൾ
  rationale: കർത്താവിന്റെ വരവും തുടർന്ന് പണം തിരികെ ലഭിക്കുന്നതുമായ കാലക്രമം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: ἐκομισάμην ἂν
  choice: തിരികെ ലഭിക്കുമായിരുന്നു
  rationale: മധ്യപ്രയോഗത്തിലെ ‘സ്വന്തമായി തിരിച്ചുപ്രാപിക്കുക’ എന്ന ഭാവവും ἄν സൂചിപ്പിക്കുന്ന സംഭവിക്കാതിരുന്ന സാങ്കൽപ്പിക ഫലവും നിലനിർത്തുന്നു.
- source_word: τὸ ἐμὸν
  choice: എനിക്കുള്ളത്
  rationale: യജമാനന് സ്വന്തമായിരുന്ന മുതലിനെ സൂചിപ്പിക്കുന്ന substantivized possessiveന്റെ ഊന്നൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: σὺν τόκῳ
  choice: പലിശയോടുകൂടെ
  rationale: τόκος ഇവിടെ പണത്തിന്മേലുള്ള പലിശയാണ്; ചൂഷണപരമായ പലിശ എന്ന അധിക അർഥം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ഉപമയിലെ പലിശസംബന്ധമായ ഭാഷയെ ധാർമിക വിധിയായി വായിക്കാനുള്ള സാധ്യത
  choice: സാമ്പത്തിക പദങ്ങൾ ഉപമയുടെ ചിത്രീകരണത്തിന്റെ ഭാഗമായി നിഷ്പക്ഷമായി പരിഭാഷപ്പെടുത്തുക
  alternative: ‘കൊള്ളപ്പലിശ’ പോലുള്ള ധാർമികമായി ഭാരമുള്ള പദം ഉപയോഗിക്കുക
  rationale: വാക്യം എല്ലാ പലിശയിടപാടുകളെയും അംഗീകരിക്കുകയോ അപലപിക്കുകയോ ചെയ്യുന്നില്ല; പിന്നീട് രൂപപ്പെട്ട തർക്കങ്ങൾ വിവർത്തനത്തിലേക്ക് ഇറക്കുമതി ചെയ്യരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. സാമ്പത്തിക സന്ദർഭം വ്യക്തമാക്കാൻ ‘നിക്ഷേപിക്കുക’, ‘ബാങ്കുകാർ’, ‘പലിശ’ എന്നിവ ഉപയോഗിച്ചു. മുഖ്യവാചകത്തിലെ [a] അടയാളം വാക്യാവസാനത്ത് ചേർത്ത് മുഴുവൻ കൂടുതൽ അക്ഷരാർഥപരമായ വികൽപത്തിന് കുറിപ്പ് നൽകി.
