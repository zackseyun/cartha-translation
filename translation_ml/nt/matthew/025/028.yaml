id: MAT.25.28
reference: Matthew 25:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἄρατε οὖν ἀπ’ αὐτοῦ τὸ τάλαντον καὶ δότε τῷ ἔχοντι τὰ δέκα τάλαντα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/028.yaml
  text: Therefore take the talent from him and give it to the one who has the ten talents[a][b].
translation:
  language: ml
  text: അതുകൊണ്ട്, അവനിൽനിന്ന് ആ താലന്ത് എടുത്ത്[a] പത്തു താലന്തുള്ളവന് കൊടുക്കുക.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘എടുത്തുമാറ്റി’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്ക് ആജ്ഞാരൂപത്തിന് ഈ രണ്ടു പ്രയോഗങ്ങളും സാധ്യമാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘താലന്ത്’ വലിയൊരു തൂക്കയളവായിരുന്നു; അതിന്റെ അടിസ്ഥാനത്തിൽ പണമൂല്യത്തിന്റെ അളവായും ഉപയോഗിച്ചു.
    reason: cultural_note
lexical_decisions:
- source_word: ἄρατε
  choice: എടുത്ത്
  rationale: αἴρω എന്ന ക്രിയയുടെ ഭൂതകാലസൂചക ആജ്ഞാരൂപം ഇവിടെ ഒരാളിൽനിന്ന് വസ്തു നീക്കിയെടുക്കാനുള്ള നേരിട്ടുള്ള കല്പനയാണ്. തുടർന്നുള്ള ‘കൊടുക്കുക’ എന്ന ആജ്ഞയുമായി സ്വാഭാവികമായി ചേരാൻ ‘എടുത്ത്’ എന്നു നൽകി; ‘എടുത്തുമാറ്റി’ എന്നും വിവർത്തനം ചെയ്യാം.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുമ്പ് പ്രസ്താവിച്ച വിധിയിൽനിന്നുള്ള നിഗമനത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അതുകൊണ്ട്’ യുക്തിബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἀπ’ αὐτοῦ
  choice: അവനിൽനിന്ന്
  rationale: ἀπό + ഷഷ്ഠീവിഭക്തി വേർപെടുത്തലിനെ സൂചിപ്പിക്കുന്നു; ഉപമയിൽ ഇപ്പോൾ ശിക്ഷിക്കപ്പെട്ട ദാസനെയാണ് ‘അവൻ’ സൂചിപ്പിക്കുന്നത്.
- source_word: τὸ τάλαντον
  choice: ആ താലന്ത്
  rationale: τάλαντον വലിയൊരു തൂക്കയളവും അതനുസരിച്ചുള്ള പണമൂല്യവുമായിരുന്നു. ‘ആ’ എന്ന നിർദ്ദേശകം ഗ്രീക്കിലെ നിർദ്ദിഷ്ടതയും മുമ്പ് പറഞ്ഞ പ്രത്യേക തുകയും സൂചിപ്പിക്കുന്നു; ചരിത്രപരമായ പദം വ്യാഖ്യാനിച്ച് ‘കഴിവ്’ എന്നു മാറ്റിയിട്ടില്ല.
- source_word: δότε
  choice: കൊടുക്കുക
  rationale: δίδωμι എന്ന ക്രിയയുടെ ഭൂതകാലസൂചക ആജ്ഞാരൂപത്തിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ മലയാള വിവർത്തനം.
- source_word: τῷ ἔχοντι
  choice: ഉള്ളവന്
  rationale: നാമവൽക്കരിച്ച വർത്തമാനകൃതന്തം കൈവശമുള്ള വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. ‘ഉള്ളവന്’ മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: τὰ δέκα τάλαντα
  choice: പത്തു താലന്ത്
  rationale: മുമ്പ് പരാമർശിച്ച നിർദ്ദിഷ്ട പത്തു താലന്തുകളെയാണ് ഗ്രീക്ക് ലേഖം സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ‘പത്തു താലന്തുള്ളവന്’ എന്ന ഘടന ഈ നിർദ്ദിഷ്ട വ്യക്തിയെ സ്വാഭാവികമായി തിരിച്ചറിയിക്കുന്നു.
theological_decisions:
- issue: ഉപമയിലെ τάλαντον എന്ന പദത്തിന്റെ അർഥം
  choice: ചരിത്രപരമായ പണ/തൂക്കയളവായ ‘താലന്ത്’ എന്നു നിലനിർത്തി.
  alternative: പണം; വലിയൊരു തുക; സ്വാഭാവിക കഴിവ്
  rationale: ഈ ഉപമയിൽ ഏൽപ്പിച്ച സാമ്പത്തിക മൂല്യവും കണക്കുതീർപ്പുമാണ് നേരിട്ടുള്ള പശ്ചാത്തലം. ‘കഴിവ്’ എന്നു വിവർത്തനം ചെയ്യുന്നത് പിൽക്കാലത്തെ രൂപകാർഥം വാക്യത്തിലേക്ക് ഇറക്കുമതി ചെയ്യും; ‘താലന്ത്’ മൂലപാഠത്തിന്റെ ചരിത്രപരമായ രൂപവും ഉപമയിലെ വ്യാഖ്യാനസാധ്യതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ആജ്ഞാശൈലി ഉപയോഗിച്ചു. മൂലത്തിലെ രണ്ടു ബഹുവചന ആജ്ഞാരൂപങ്ങളും മലയാളത്തിൽ സ്വാഭാവികമായ ഏകവചനസദൃശ ആജ്ഞാരൂപങ്ങളായി വരുന്നു. ചരിത്രപദമായ ‘താലന്ത്’ നിലനിർത്തി സാംസ്കാരിക വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകി.
