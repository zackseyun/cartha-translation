  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ φοβηθεὶς ἀπελθὼν ἔκρυψα τὸ τάλαντόν σου ἐν τῇ γῇ· ἴδε ἔχεις τὸ σόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/025.yaml
  text: And being afraid[a], I went away and hid your talent in the ground. Look, you have what is yours.
translation:
  language: ml
  text: ഭയപ്പെട്ടതിനാൽ ഞാൻ പോയി, അങ്ങയുടെ താലന്ത്[a] നിലത്തിൽ ഒളിപ്പിച്ചുവച്ചു. ഇതാ, അങ്ങയുടേത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വലിയൊരു തുക’; താലന്ത് ഉയർന്ന മൂല്യമുള്ള പണത്തിന്റെ ഒരു തൂക്ക-ഏകകമായിരുന്നു; ഇവിടെ അത് സ്വാഭാവിക കഴിവിനെ സൂചിപ്പിക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβηθεὶς
  choice: ഭയപ്പെട്ടതിനാൽ
  rationale: കർത്താവിനെക്കുറിച്ചുള്ള ഭയമാണ് തുടർന്നുള്ള പ്രവൃത്തിയുടെ കാരണമെന്ന് സന്ദർഭിക കൃതന്തപ്രയോഗം സൂചിപ്പിക്കുന്നു; ഭക്ത്യാദരമെന്ന വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: ἀπελθὼν
  choice: ഞാൻ പോയി
  rationale: ἔκρυψα എന്ന മുഖ്യക്രിയയ്ക്കു മുമ്പുള്ള പ്രവർത്തനക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ സംയോജിപ്പിക്കുന്നു.
- source_word: ἔκρυψα
  choice: ഒളിപ്പിച്ചുവച്ചു
  rationale: κρύπτω എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ഒളിപ്പിക്കുക/മറയ്ക്കുക നിലനിർത്തുന്നു; നിലത്തിൽ കുഴിച്ചിട്ടു എന്നത് ക്രിയയിൽ അധികമായി ചേർക്കുന്നില്ല.
- source_word: τὸ τάλαντόν σου
  choice: അങ്ങയുടെ താലന്ത്
  rationale: ചരിത്രപരമായ ഉയർന്ന മൂല്യമുള്ള തൂക്ക-നാണയ ഏകകത്തെ ലിപ്യന്തരണം ചെയ്ത് നിലനിർത്തുന്നു; സ്വാഭാവിക കഴിവ് എന്ന ആധുനിക അർഥവുമായി കുഴയാതിരിക്കാൻ അടിക്കുറിപ്പ് നൽകുന്നു.
- source_word: ἐν τῇ γῇ
  choice: നിലത്തിൽ
  rationale: ഒളിപ്പിച്ച സ്ഥലമായ മണ്ണ്/നിലം എന്ന അർഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: ἴδε
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും മുന്നിലുള്ള വസ്തുവിനെ ചൂണ്ടിക്കാട്ടുകയും ചെയ്യുന്ന ἴδε എന്ന പ്രയോഗത്തിന് മലയാളത്തിലെ സ്വാഭാവിക സമാനപദം.
- source_word: ἔχεις τὸ σόν
  choice: അങ്ങയുടേത് അങ്ങേക്കുതന്നെ
  rationale: അക്ഷരാർഥത്തിലെ അപൂർണമായ ‘നിനക്കു നിന്റേത് ഉണ്ട്’ എന്ന ഘടനയെ സ്വാഭാവിക മലയാളത്തിലാക്കി, ഉടമസ്ഥതയ്ക്കുള്ള ഊന്നൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: τάλαντον എന്നത് സ്വാഭാവിക കഴിവിനെയാണോ പണത്തെയാണോ സൂചിപ്പിക്കുന്നത്
  choice: മുഖ്യപാഠത്തിൽ ചരിത്രപരമായ പണ/തൂക്ക ഏകകമായ ‘താലന്ത്’ നിലനിർത്തി, അതിന്റെ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
  alternative: വലിയൊരു തുക; വലിയ മൂല്യമുള്ള പണ ഏകകം
  rationale: ഗ്രീക്ക് പദം ഇവിടെ സ്വാഭാവിക കഴിവിനെയല്ല, ഉയർന്ന മൂല്യമുള്ള തൂക്ക-നാണയ ഏകകത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ലിപ്യന്തരണം ഉപമയുടെ ചരിത്രഭാവം നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ ശൈലി. ദാസൻ യജമാനനോട് സംസാരിക്കുന്നതിനാൽ ആദരസൂചകമായ ‘അങ്ങ്’ രൂപങ്ങൾ ഉപയോഗിച്ചു.
