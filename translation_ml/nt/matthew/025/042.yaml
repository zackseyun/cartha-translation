- source_word: φαγεῖν
  choice: ഭക്ഷിക്കാൻ
  rationale: ഇൻഫിനിറ്റീവിന്റെ ക്രിയാത്മക സ്വഭാവം ‘ഭക്ഷണം’ എന്നു നാമവൽക്കരിക്കാതെ സംരക്ഷിക്കുന്നു.
