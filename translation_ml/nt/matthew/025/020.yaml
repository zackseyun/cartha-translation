id: MAT.25.20
reference: Matthew 25:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ προσελθὼν ὁ τὰ πέντε τάλαντα λαβὼν προσήνεγκεν ἄλλα πέντε τάλαντα λέγων· Κύριε, πέντε τάλαντά μοι παρέδωκας· ἴδε ἄλλα πέντε τάλαντα ⸀ἐκέρδησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/020.yaml
  text: And the one who had received the five talents came forward and brought another five talents[a], saying, ‘Lord, you delivered five talents to me; look[b], I have gained another five talents.’
translation:
  language: ml
  text: 'അഞ്ചു താലന്ത്[b] ലഭിച്ചവൻ അടുത്തുവന്ന് കൂടി അഞ്ചു താലന്ത് കൊണ്ടുവന്നു പറഞ്ഞു: “കർത്താവേ,[a] അങ്ങ് എനിക്ക് അഞ്ചു താലന്ത് ഏൽപ്പിച്ചല്ലോ; ഇതാ, ഞാൻ കൂടി അഞ്ചു താലന്ത് നേടിയിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ “യജമാനനേ.” ഗ്രീക്ക്: ക്യൂരിയോസ് (Kyrios).'
    reason: alternative_reading
  - marker: b
    text: ഒരു താലന്ത് വലിയ മൂല്യമുള്ള പണത്തിന്റെ ഒരു അളവായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: προσελθὼν
  choice: അടുത്തുവന്ന്
  rationale: προσέρχομαι എന്ന ക്രിയയുടെ സമീപിച്ചുവരുക എന്ന അർഥം അവതരണസന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὁ τὰ πέντε τάλαντα λαβὼν
  choice: അഞ്ചു താലന്ത് ലഭിച്ചവൻ
  rationale: മുമ്പ് പണം ലഭിച്ച ദാസനെ തിരിച്ചറിയിക്കുന്ന ഗ്രീക്ക് participial construction സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘മനുഷ്യൻ’ എന്ന പദം ചേർക്കുന്നില്ല.
- source_word: τάλαντα
  choice: താലന്ത്
  rationale: τάλαντον വലിയൊരു തൂക്ക-പണ അളവായിരുന്നു. പരമ്പരാഗത സ്രോതപദം നിലനിർത്തുകയും ‘സ്വർണസഞ്ചി’ പോലുള്ള പരിധികുറഞ്ഞ വ്യാഖ്യാനം ഒഴിവാക്കുകയും ചെയ്യുന്നു; സാംസ്കാരിക അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: προσήνεγκεν
  choice: കൊണ്ടുവന്നു
  rationale: കൂടുതലായി നേടിയ തുക യജമാനന്റെ മുമ്പിലേക്ക് കൊണ്ടുവരുന്നതാണ് സന്ദർഭം; ആരാധനാപരമായ ‘അർപ്പിച്ചു’ എന്ന ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: ἄλλα πέντε τάλαντα
  choice: വേറെ അഞ്ചു താലന്ത്
  rationale: ἄλλα ഒരേ അളവിലുള്ള അധിക തുകയെ സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിലെ ആവർത്തനവും സമാന്തരതയും നിലനിർത്തുന്നു.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: κύριος എന്ന അഭിസംബോധനയുടെ ‘കർത്താവ്/യജമാനൻ’ അർഥവ്യാപ്തിയും മത്തായിയുടെ വിശാലമായ ആഖ്യാനധ്വനിയും നിലനിർത്തുന്നു; സന്ദർഭപരമായ മറ്റൊരു വിവർത്തനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: παρέδωκας
  choice: ഏൽപ്പിച്ചല്ലോ
  rationale: παραδίδωμι എന്നതിന്റെ ‘കൈമാറുക/ഏൽപ്പിക്കുക’ എന്ന ആശയം സാമ്പത്തിക ചുമതലയുടെ സന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; -ല്ലോ നേരത്തെ അറിയാവുന്ന കാര്യത്തെ ഓർമിപ്പിക്കുന്ന പ്രസ്താവനയുടെ ഭാവം പ്രകടിപ്പിക്കുന്നു.
- source_word: ἴδε
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും മുന്നിലുള്ള ഫലം ചൂണ്ടിക്കാണിക്കുകയും ചെയ്യുന്ന ἴδε എന്ന പദത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: ἐκέρδησα
  choice: നേടിയിരിക്കുന്നു
  rationale: κερδαίνω എന്നതിന്റെ ലാഭം നേടുക എന്ന അർഥവും പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ ഫലവും മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ഉപമയിലെ അഭിസംബോധനയായ κύριος എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: കർത്താവേ
  alternative: യജമാനനേ
  rationale: ഉപമയുടെ നേരിട്ടുള്ള സാഹചര്യത്തിൽ ദാസൻ തന്റെ യജമാനനെയാണ് അഭിസംബോധന ചെയ്യുന്നത്. എങ്കിലും ‘കർത്താവേ’ എന്നത് ആ സാമൂഹിക അർഥം വഹിക്കുന്നതോടൊപ്പം മത്തായിയുടെ ആഖ്യാനത്തിലെ വിശാലമായ ധ്വനി മുൻകൂട്ടി തീർപ്പാക്കാതെ നിലനിർത്തുന്നു; സന്ദർഭപരമായ പകരം അടിക്കുറിപ്പിൽ ചേർക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നേരിട്ടുള്ള സംഭാഷണശൈലി. ‘അങ്ങ്’ ആദരസൂചകമായി ഉപയോഗിച്ചു. സ്രോതപദമായ ‘താലന്ത്’ നിലനിർത്തി അതിന്റെ പുരാതന സാമ്പത്തിക അർഥം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
