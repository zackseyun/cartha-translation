id: MAT.25.18
reference: Matthew 25:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ τὸ ἓν λαβὼν ἀπελθὼν ὤρυξεν ⸀γῆν καὶ ⸀ἔκρυψεν τὸ ἀργύριον τοῦ κυρίου αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/018.yaml
  text: But the one who had received the one talent went away[a], dug in the ground, and hid his master's money.
translation:
  language: ml
  text: എന്നാൽ ഒരു താലന്ത് ലഭിച്ചവൻ പോയി നിലം കുഴിച്ച് തന്റെ യജമാനന്റെ പണം[a] ഒളിപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “തന്റെ യജമാനന്റെ വെള്ളി.”'
    reason: ἀργύριον എന്ന പദത്തിന്റെ ‘വെള്ളി’ എന്ന കൂടുതൽ അക്ഷരാർഥപരമായ സാധ്യത സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: ὁ δὲ τὸ ἓν λαβὼν
  choice: എന്നാൽ ഒരു താലന്ത് ലഭിച്ചവൻ
  rationale: δέ മുൻപറഞ്ഞ ദാസന്മാരുടെ പ്രവർത്തനത്തോടുള്ള വൈരുധ്യം സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ എന്നു നൽകി. τὸ ἓν സന്ദർഭത്തിൽ ഒരു താലന്തിനെ സൂചിപ്പിക്കുന്നതിനാൽ വ്യക്തതയ്ക്കായി ‘താലന്ത്’ ചേർത്തു; λαβών-ന്റെ മുൻകാല പ്രവർത്തനം സ്വാഭാവികമായി ‘ലഭിച്ചവൻ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: ἀπελθὼν
  choice: പോയി
  rationale: തുടർന്നുള്ള പ്രവൃത്തികൾക്കുമുമ്പുള്ള അകന്നുപോകൽ ലളിതവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: ὤρυξεν γῆν
  choice: നിലത്ത് കുഴിച്ച്
  rationale: ഗ്രീക്കിലെ ‘നിലം കുഴിക്കുക’ എന്ന ആശയം അനാവശ്യമായി ‘കുഴി’ ചേർക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἔκρυψεν
  choice: ഒളിപ്പിച്ചുവെച്ചു
  rationale: വസ്തു മറച്ചുവെച്ച തുടർച്ചയായ ഫലം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τὸ ἀργύριον
  choice: പണം
  rationale: ἀργύριον എന്നത് വെള്ളിയെയോ പണത്തെയോ സൂചിപ്പിക്കാം; ഏൽപ്പിച്ച സമ്പത്തിന്റെ ഈ സന്ദർഭത്തിൽ ‘പണം’ സാധാരണ വായനക്കാർക്ക് ഏറ്റവും വ്യക്തമാണ്. ‘വെള്ളി’ എന്ന പദാർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: τοῦ κυρίου αὐτοῦ
  choice: തന്റെ യജമാനന്റെ
  rationale: ഇവിടെ κύριος കഥയിലെ ദാസന്റെ മനുഷ്യ യജമാനനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘യജമാനൻ’ അധികാരബന്ധം വ്യക്തമായി നൽകുകയും ദൈവിക ശീർഷകം അനാവശ്യമായി ഇറക്കുമതി ചെയ്യാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ഉപമയിലെ മനുഷ്യനെ സൂചിപ്പിക്കുന്ന κύριος-ന്റെ പരിഭാഷ
  choice: യജമാനൻ
  alternative: കർത്താവ്
  rationale: ഈ വാക്യത്തിന്റെ കഥാതലത്തിൽ പരാമർശം ദാസന്റെ മനുഷ്യ മേലധികാരിയോടാണ്. അതിനാൽ ‘യജമാനൻ’ സന്ദർഭോചിതമാണ്; ‘കർത്താവ്’ എന്ന് നൽകുന്നത് ഉടൻതന്നെ ദൈവിക ശീർഷകമായി വായിക്കപ്പെടാൻ ഇടയാക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. ‘താലന്ത്’ അടുത്ത സന്ദർഭത്തിൽ പറഞ്ഞ നാണയ/ഭാരമൂല്യ ഏകകത്തെ നിലനിർത്തുന്നു; ‘പണം’ അർഥം വ്യക്തമാക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വാചകത്തിന്റെ അവസാനം നൽകിയിരിക്കുന്നു.
