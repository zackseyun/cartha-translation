id: MAT.25.2
reference: Matthew 25:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πέντε δὲ ⸂ἐξ αὐτῶν ἦσαν⸃ ⸂μωραὶ καὶ πέντε φρόνιμοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/002.yaml
  text: And five of them were foolish, and five were wise.
translation:
  language: ml
  text: അവരിൽ അഞ്ചുപേർ വിവേകമില്ലാത്തവരും അഞ്ചുപേർ വിവേകമുള്ളവരും ആയിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πέντε
  choice: അഞ്ചുപേർ
  rationale: മുമ്പ് പരാമർശിച്ച പത്തു കന്യകമാരിൽപ്പെട്ട വ്യക്തികളെ എണ്ണുന്നതിനാൽ മലയാളത്തിൽ വ്യക്തിവാചകമായ ‘പേർ’ ചേർത്തു; ഗ്രീക്കിലെ സമതുലിതമായ ആവർത്തനം നിലനിർത്താൻ രണ്ടു വിഭാഗങ്ങളിലും ആവർത്തിച്ചു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയില്ല
  rationale: ഇവിടെ δέ നേരിയ വിവരണബന്ധമാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിലെ വാക്യപ്രവാഹത്തിൽ അതിന് പ്രത്യേകം ‘എന്നാൽ’ അല്ലെങ്കിൽ ‘പിന്നെ’ ചേർത്താൽ അനാവശ്യമായ വിരോധമോ ഘട്ടമാറ്റമോ തോന്നാം.
- source_word: ἐξ αὐτῶν
  choice: അവരിൽ
  rationale: മുമ്പ് പറഞ്ഞ സംഘത്തിൽനിന്നുള്ള ഉപവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളപ്രയോഗം.
- source_word: ἦσαν
  choice: ആയിരുന്നു
  rationale: εἰμί എന്ന ക്രിയയുടെ അപൂർണഭൂതകാലരൂപം ഇവിടെ വിവരണാത്മകമായ ബന്ധകക്രിയയാണ്; രണ്ടു സമാന്തര വിശേഷണങ്ങളോടും ചേർന്ന് വാക്യാവസാനത്തിൽ ഒരിക്കൽ നൽകിയിരിക്കുന്നു.
- source_word: μωραὶ
  choice: വിവേകമില്ലാത്തവർ
  rationale: μωρός ഇവിടെ വേണ്ടത്ര ബുദ്ധിപൂർവമായ മുൻകരുതൽ ഇല്ലാത്തവരെ സൂചിപ്പിക്കുന്നു. ‘വിവേകമില്ലാത്തവർ’ ആ അർഥം സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: φρόνιμοι
  choice: വിവേകമുള്ളവർ
  rationale: φρόνιμος എന്നത് വിവേകമുള്ള, സൂക്ഷ്മബുദ്ധിയുള്ള, പ്രായോഗികമായി ബുദ്ധിപൂർവം പ്രവർത്തിക്കുന്ന എന്ന അർഥപരിധിയുള്ളതാണ്. ‘വിവേകമുള്ളവർ’ വിരുദ്ധജോടിയുടെ സമാന്തരതയും സന്ദർഭവും നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഗ്രീക്കിലെ അഞ്ചും അഞ്ചും എന്ന സമതുലിത ഘടനയും μωραί/φρόνιμοι എന്ന വിരുദ്ധജോടിയും വ്യക്തമായി നിലനിർത്തി.
