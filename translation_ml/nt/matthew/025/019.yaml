id: MAT.25.19
reference: Matthew 25:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μετὰ δὲ ⸂πολὺν χρόνον⸃ ἔρχεται ὁ κύριος τῶν δούλων ἐκείνων καὶ συναίρει ⸂λόγον μετ’ αὐτῶν⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/019.yaml
  text: After a long time[a], the master of those servants comes and settles accounts with them.
translation:
  language: ml
  text: വളരെക്കാലത്തിനുശേഷം, ആ അടിമകളുടെ യജമാനൻ വന്ന് അവരുമായി കണക്കുതീർക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യജമാനൻ’ എന്നതിന് ‘കർത്താവ്’ എന്നും ‘അടിമകൾ’ എന്നതിന് ‘ദാസന്മാർ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ κύριος എന്ന പദത്തിന് ‘കർത്താവ്’ അല്ലെങ്കിൽ ‘യജമാനൻ’ എന്നും δοῦλοι എന്നതിന് ‘ദാസന്മാർ’ അല്ലെങ്കിൽ ‘അടിമകൾ’ എന്നും അർഥമാകാം; ഈ ഉപമയിലെ ഗാർഹിക-സാമ്പത്തിക ബന്ധം വ്യക്തമാക്കാൻ മുഖ്യപാഠത്തിൽ ‘യജമാനൻ’, ‘അടിമകൾ’ എന്നിങ്ങനെ നൽകിയിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ δὲ πολὺν χρόνον
  choice: വളരെക്കാലത്തിനുശേഷം
  rationale: μετά + accusative കാലക്രമത്തിൽ ‘ശേഷം’ എന്നർഥം നൽകുന്നു. δέ ഇവിടെ നേരിയ ആഖ്യാനബന്ധകമായതിനാൽ പ്രത്യേകമായി ‘എന്നാൽ’ എന്നു ചേർക്കാതെ മലയാളത്തിലെ സ്വാഭാവിക കാലസൂചനയിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: ἔρχεται
  choice: വന്ന്
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനത്തിന്റെ ആഖ്യാനസജീവത തുടർന്നുള്ള ‘കണക്കുതീർക്കുന്നു’ എന്ന വർത്തമാനക്രിയയോടൊപ്പം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὁ κύριος
  choice: യജമാനൻ
  rationale: ഇവിടെ κύριος നേരിട്ടുള്ള ദൈവിക സ്ഥാനപ്പേരല്ല; അടിമകളോടുള്ള അധികാരബന്ധത്തിൽ വീട്ടുടമ/യജമാനൻ എന്ന ആഖ്യാനപങ്കാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: τῶν δούλων ἐκείνων
  choice: ആ അടിമകളുടെ
  rationale: δοῦλος എന്ന പദത്തിൽ ഈ സാമ്പത്തിക-ഗാർഹിക സാഹചര്യത്തിൽ ബന്ധിത ഉടമസ്ഥതയുടെ നില പ്രസക്തമായതിനാൽ മൃദുവായ ‘ദാസന്മാർ/സേവകർ’ എന്നതിനെക്കാൾ ‘അടിമകൾ’ മൂലാർത്ഥം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: συναίρει λόγον μετ’ αὐτῶν
  choice: അവരുമായി കണക്കുതീർക്കുന്നു
  rationale: ഈ ഗ്രീക്ക് പ്രയോഗം ഒരാളുമായി കണക്കുകൾ ഒത്തുതീർക്കുക, കണക്ക് ചോദിക്കുക എന്ന അർഥമുള്ളതാണ്; ഉപമയിലെ സാമ്പത്തിക പശ്ചാത്തലം സ്വാഭാവിക മലയാളത്തിൽ ഇതിലൂടെ വ്യക്തമാകുന്നു.
theological_decisions:
- issue: ഉപമയിൽ κύριος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: യജമാനൻ
  alternative: കർത്താവ്
  rationale: വാക്യത്തിനുള്ളിൽ പരാമർശിക്കുന്നത് ഉപമയിലെ അടിമകളുടെ അധികാരിയെയാണ്. ‘കർത്താവ്’ എന്നു നൽകിയാൽ നേരിട്ടുള്ള ദൈവിക/ക്രിസ്തുശാസ്ത്രപരമായ സ്ഥാനപ്പേര് വാചകത്തിലേക്ക് കൊണ്ടുവരാം; ഉപമയുടെ വിശാലമായ ദൈവശാസ്ത്രസൂചന സന്ദർഭം തന്നെയാണ് വഹിക്കുന്നത്.
- issue: δοῦλος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: അടിമകൾ
  alternative: ദാസന്മാർ / സേവകർ
  rationale: യജമാനൻ-അടിമ സാമ്പത്തികബന്ധം ഇവിടെ വ്യക്തമായതിനാൽ ബന്ധിത സാമൂഹികനില മറച്ചുവയ്ക്കാത്ത ‘അടിമകൾ’ തിരഞ്ഞെടുക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ ചരിത്രവർത്തമാനം നിലനിർത്തി; അനാവശ്യമായ പ്രാരംഭ ബന്ധകപദം ചേർത്തിട്ടില്ല. അടിക്കുറിപ്പുകുറി ബന്ധപ്പെട്ട പദപ്രയോഗത്തിനുശേഷം വാക്യാവസാനത്തിൽ നൽകിയിരിക്കുന്നു.
