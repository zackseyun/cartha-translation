id: MAT.25.31
reference: Matthew 25:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὅταν δὲ ἔλθῃ ὁ υἱὸς τοῦ ἀνθρώπου ἐν τῇ δόξῃ αὐτοῦ καὶ πάντες ⸀οἱ ἄγγελοι μετ’ αὐτοῦ, τότε καθίσει ἐπὶ θρόνου δόξης αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/031.yaml
  text: But when the Son of Man comes in his glory[a], and all the angels with him, then he will sit on his glorious throne.
translation:
  language: ml
  text: എന്നാൽ മനുഷ്യപുത്രൻ തന്റെ മഹത്ത്വത്തിൽ, എല്ലാ ദൂതന്മാരോടുംകൂടെ, വരുമ്പോൾ, അന്നു അവൻ തന്റെ മഹത്ത്വത്തിന്റെ സിംഹാസനത്തിൽ[a] ഇരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തന്റെ മഹത്ത്വമുള്ള സിംഹാസനത്തിൽ.”
    reason: ജനിറ്റീവ് ഘടനയുടെ സ്വാഭാവികമായ വിശേഷണപരമായ പകരം പരിഭാഷ.
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: എന്നാൽ ... വരുമ്പോൾ
  rationale: δὲ സൂചിപ്പിക്കുന്ന മൃദുവായ ആശയമാറ്റം ‘എന്നാൽ’ നിലനിർത്തുന്നു; ὅταν കൂടിയുള്ള ഭാവിസൂചന മലയാളത്തിൽ സ്വാഭാവികമായി ‘വരുമ്പോൾ’ എന്നു വരുന്നു.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: ദാനീയേൽ ഗ്രന്ഥവുമായുള്ള ബന്ധവും യേശുവിന്റെ സ്ഥാപിതമായ സ്വയംവിശേഷണത്തിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ ഭാരവും നിലനിർത്തുന്ന പരമ്പരാഗത ബൈബിൾപദം.
- source_word: ἐν τῇ δόξῃ αὐτοῦ
  choice: തന്റെ മഹത്ത്വത്തിൽ
  rationale: δόξα ഇവിടെ വെളിപ്പെടുന്ന രാജകീയ മഹിമയും ബഹുമാനവും സൂചിപ്പിക്കുന്നു; ‘മഹത്ത്വം’ ആ അർഥവും ബൈബിൾപ്രതിധ്വനിയും സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: πάντες οἱ ἄγγελοι μετ’ αὐτοῦ
  choice: എല്ലാ ദൂതന്മാരും അവനോടുകൂടെ
  rationale: മൂലപാഠത്തിലെ ‘എല്ലാ ദൂതന്മാരും’ എന്ന പ്രയോഗം നിലനിർത്തുന്നു; അവിടെ ഇല്ലാത്ത ‘അവന്റെ’ എന്ന ഉടമസ്ഥസൂചന ചേർക്കുന്നില്ല. μετ’ αὐτοῦ ലളിതമായ സഹഗമനം സൂചിപ്പിക്കുന്നു.
- source_word: τότε καθίσει
  choice: അവൻ ... ഇരിക്കും
  rationale: τότε സൂചിപ്പിക്കുന്ന തുടർച്ച മലയാളത്തിലെ പ്രധാനവാക്യത്തിന്റെ ക്രമത്തിൽ വ്യക്തമാണ്; καθίσει എന്ന ഭാവികാല സജീവക്രിയ നേരിട്ട് ‘ഇരിക്കും’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: ἐπὶ θρόνου δόξης αὐτοῦ
  choice: തന്റെ മഹത്ത്വത്തിന്റെ സിംഹാസനത്തിൽ
  rationale: ἐπίയുടെ സ്ഥാനാർഥം ‘-ത്തിൽ’ കൊണ്ടും, ദ്വയാർഥസാധ്യതയുള്ള ഗ്രീക്ക് ജനിറ്റീവ് ഘടന ഔപചാരികമായി നിലനിർത്തിയും പരിഭാഷപ്പെടുത്തി. ഇത് ‘മഹത്ത്വമുള്ള സിംഹാസനം’ എന്ന വിശേഷണപരമായ വായനയിലേക്ക് മാത്രം അർഥം ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου എന്ന ക്രിസ്തുശാസ്ത്രപരമായ ശീർഷകം
  choice: മനുഷ്യപുത്രൻ
  alternative: മനുഷ്യനായവൻ
  rationale: സ്ഥാപിതമായ ശീർഷകം ദാനീയേൽ 7-ന്റെ പശ്ചാത്തലവും ഈ ഭാഗത്തിലെ മശീഹാപരവും ന്യായവിധിപരവുമായ പങ്കും നിലനിർത്തുന്നു; വ്യാഖ്യാനാത്മകമായ പകരം പ്രയോഗം ഒഴിവാക്കുന്നു.
- issue: θρόνου δόξης αὐτοῦ എന്ന ജനിറ്റീവ് ഘടന
  choice: തന്റെ മഹത്ത്വത്തിന്റെ സിംഹാസനം
  alternative: തന്റെ മഹത്ത്വമുള്ള സിംഹാസനം
  rationale: മൂലഘടനയിലെ ബന്ധം തുറന്ന നിലയിൽ സൂക്ഷിക്കുന്നു. വിശേഷണപരമായ പകരം വായന മലയാളത്തിൽ കൂടുതൽ പതിവാണെങ്കിലും, അത് ‘മഹത്ത്വത്തിന്റെ സിംഹാസനം’ എന്ന ഔപചാരികവും ദൈവശാസ്ത്രപരമായി സമ്പന്നവുമായ സാധ്യതയെ ചുരുക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ബൈബിൾശൈലി. ‘മനുഷ്യപുത്രൻ’, ‘മഹത്ത്വം’, ‘ദൂതന്മാർ’, ‘സിംഹാസനം’ എന്നീ പരിചിതമായ പദങ്ങൾ നിലനിർത്തി. ആവർത്തിക്കുന്ന ‘വരുമ്പോൾ’ മലയാളത്തിൽ അനുബന്ധവാക്യങ്ങളുടെ സമാന്തരതയും എല്ലാ ദൂതന്മാരുടെയും സഹഗമനവും വ്യക്തമാക്കുന്നു.
