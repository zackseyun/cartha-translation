review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the title «മനുഷ്യപുത്രൻ», the coming in his glory, all the angels, and the throne-of-glory construction. However, «എല്ലാ ദൂതന്മാരും അവനോടുകൂടെ വരുമ്പോൾ» unnecessarily supplies a second finite ‘come’ clause and repeats «വരുമ്പോൾ», whereas Greek has one coming verb with ‘all the angels with him’ as an accompanying phrase. «τότε» should also be represented explicitly.
  naturalness: The repeated «വരുമ്പോൾ» is awkward and can suggest two coordinated temporal events. Using the comitative form «എല്ലാ ദൂതന്മാരോടുംകൂടെ» makes the single Greek clause clear and idiomatic in modern standard Malayalam.
  terminology: «മനുഷ്യപുത്രൻ», «മഹത്ത്വം», «ദൂതന്മാർ», and «സിംഹാസനം» are appropriate established biblical terms. «തന്റെ മഹത്ത്വത്തിന്റെ സിംഹാസനം» appropriately preserves the source genitive without prematurely narrowing it to an adjectival reading.
  issues:
  - severity: medium
    issue: The accompanying angels are rendered as a second temporal clause.
    rationale: The source reads ‘the Son of Man comes ... and all the angels with him,’ with only one verb of coming. The draft’s second «വരുമ്പോൾ» adds verbal structure not present in Greek and makes the Malayalam sentence less natural.
  - severity: low
    issue: The sequential adverb τότε is not explicit.
    rationale: «അന്നു» naturally represents the consequent temporal force of τότε and clarifies the sentence sequence.
  revised_text: എന്നാൽ മനുഷ്യപുത്രൻ തന്റെ മഹത്ത്വത്തിൽ, എല്ലാ ദൂതന്മാരോടുംകൂടെ, വരുമ്പോൾ, അന്നു അവൻ തന്റെ മഹത്ത്വത്തിന്റെ സിംഹാസനത്തിൽ[a] ഇരിക്കും.
