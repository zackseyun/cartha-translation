id: MAT.25.9
reference: Matthew 25:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν δὲ αἱ φρόνιμοι λέγουσαι· Μήποτε ⸂οὐ μὴ⸃ ἀρκέσῃ ἡμῖν καὶ ὑμῖν· ⸀πορεύεσθε μᾶλλον πρὸς τοὺς πωλοῦντας καὶ ἀγοράσατε ἑαυταῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/009.yaml
  text: But the wise answered[a], saying, ‘No, lest there not be enough for us and for you. Go instead to those who sell, and buy for yourselves.’
translation:
  language: ml
  text: 'എന്നാൽ വിവേകമുള്ളവർ മറുപടിയായി പറഞ്ഞു: “വേണ്ട; ഞങ്ങൾക്കും നിങ്ങൾക്കും തികയാതെ വന്നേക്കാം.[a] പകരം, വിൽക്കുന്നവരുടെ അടുത്ത് പോയി നിങ്ങൾക്കുവേണ്ടി വാങ്ങിക്കൊള്ളൂ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുസൃതമായി: “ഞങ്ങൾക്കും നിങ്ങൾക്കും ഒരുവിധത്തിലും തികയാതെ വന്നേക്കാം.” ‘വന്നേക്കാം’ എന്ന ആശങ്കാസൂചക പ്രയോഗത്തോടൊപ്പം ഗ്രീക്ക് ശക്തമായ നിഷേധം ഉപയോഗിക്കുന്നു; ഉള്ളത് മതിയാകാതെ പോകുമെന്ന ഗൗരവമായ ആശങ്കയാണ് ഇതിലൂടെ പ്രകടമാകുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: മറുപടിയായി പറഞ്ഞു
  rationale: ആഖ്യാനത്തിലെ പ്രതികരണക്രിയയും തുടർന്നുള്ള λέγουσαι എന്ന സംസാരപരിചയപ്പെടുത്തലും സ്വാഭാവികമായ മലയാളത്തിൽ ഒരുമിച്ചു പ്രകടിപ്പിക്കുന്നു.
- source_word: αἱ φρόνιμοι
  choice: വിവേകമുള്ളവർ
  rationale: നാമപദമായി പ്രവർത്തിക്കുന്ന വിശേഷണത്തിന്റെ അർഥം നിലനിർത്തുന്നു; മൂലവാക്യത്തിൽ ആവർത്തിക്കാത്ത ‘കന്യകമാർ’ എന്ന നാമം ഇവിടെ ചേർക്കുന്നില്ല.
- source_word: Μήποτε ⸂οὐ μὴ⸃ ἀρκέσῃ
  choice: വേണ്ട; ... തികയാതെ വന്നേക്കാം
  rationale: എണ്ണ പങ്കിടാനുള്ള അഭ്യർഥനയോടുള്ള സൂചിതമായ നിരാകരണവും ഇരുകൂട്ടർക്കും മതിയാകില്ലെന്ന ശക്തമായ ആശങ്കയും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ഗ്രീക്കിലെ ഊന്നൽ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἡμῖν καὶ ὑμῖν
  choice: ഞങ്ങൾക്കും നിങ്ങൾക്കും
  rationale: ഇരുകൂട്ടരുടെയും ആവശ്യത്തിനുള്ള മതിപ്പിനെ സൂചിപ്പിക്കുന്ന ദത്തിവ് മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: πορεύεσθε μᾶλλον
  choice: പകരം ... പോയി
  rationale: നിർദേശിക്കുന്ന ബദൽ നടപടി ആധുനിക മലയാളത്തിൽ നേരിട്ടും സ്വാഭാവികമായും പറയുന്നു.
- source_word: πρὸς τοὺς πωλοῦντας
  choice: വിൽക്കുന്നവരുടെ അടുത്ത്
  rationale: നാമപദമായി ഉപയോഗിച്ചിരിക്കുന്ന വർത്തമാന കൃദന്തത്തെ അധിക വസ്തുനാമം ചേർക്കാതെ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: ἀγοράσατε ἑαυταῖς
  choice: നിങ്ങൾക്കുവേണ്ടി വാങ്ങിക്കൊള്ളൂ
  rationale: ആജ്ഞയും സ്വപ്രയോജനാർഥമായ പ്രത്യയത്തിന്റെ അർഥവും സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ സംഭാഷണശൈലി. ‘വാങ്ങിക്കൊള്ളൂ’ ആജ്ഞയായിരിക്കുമ്പോഴും സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക ബഹുവചനരൂപമാണ്; മൂലത്തിൽ വ്യക്തമല്ലാത്ത ‘എണ്ണ’ മുഖ്യവാക്യത്തിൽ ചേർത്തിട്ടില്ല.
