id: MAT.25.40
reference: Matthew 25:40
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ βασιλεὺς ἐρεῖ αὐτοῖς· Ἀμὴν λέγω ὑμῖν, ἐφ’ ὅσον ἐποιήσατε ἑνὶ τούτων τῶν ἀδελφῶν μου τῶν ἐλαχίστων, ἐμοὶ ἐποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/040.yaml
  text: And the King will answer them[a], ‘Truly I say to you, insofar as you did it to one of the least of these brothers of mine[b], you did it to me.’
translation:
  language: ml
  text: 'രാജാവ് അവരോടു മറുപടി പറഞ്ഞുകൊണ്ട് പറയും: “സത്യമായി[a] ഞാൻ നിങ്ങളോടു പറയുന്നു: എന്റെ ഈ ഏറ്റവും ചെറിയ സഹോദരന്മാരിൽ ഒരുവന് നിങ്ങൾ ചെയ്തതുപോലെതന്നെ, എനിക്കും ചെയ്തു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “ആമേൻ, ഞാൻ നിങ്ങളോടു പറയുന്നു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς … ἐρεῖ
  choice: മറുപടി പറയും
  rationale: ക്രിയാവിശേഷണരൂപവും ഭാവികാലക്രിയയും ചേർന്ന് നൽകുന്ന ‘മറുപടിയായി പറയും’ എന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ ഒരൊറ്റ പ്രയോഗമായി നൽകി.
- source_word: ὁ βασιλεὺς
  choice: രാജാവ്
  rationale: ഗ്രീക്കിലെ വ്യക്തമായ രാജകീയ പദവി അതേപടി നിലനിർത്തുന്നു; മലയാളത്തിൽ ആദരസൂചകമായി അനാവശ്യ വലിയക്ഷരവ്യത്യാസമില്ല.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: യേശുവിന്റെ ഗൗരവപൂർണമായ ഉറപ്പിക്കൽ സൂത്രവാക്യത്തിന്റെ അർഥവും ഔപചാരിക ഭാവവും ആധുനിക വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: ἐφ’ ὅσον
  choice: എന്തെല്ലാം ചെയ്തുവോ, അതെല്ലാം
  rationale: അളവ്/വ്യാപ്തി സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം മലയാളത്തിലെ സ്വാഭാവിക അനുബന്ധഘടനയിലൂടെ പുനരാവിഷ്കരിക്കുന്നു; ചെയ്ത പ്രവൃത്തികളുടെ മുഴുവൻ വ്യാപ്തിയും നിലനിർത്തുന്നു.
- source_word: ἑνὶ τούτων τῶν ἀδελφῶν μου τῶν ἐλαχίστων
  choice: എന്റെ ഈ ഏറ്റവും ചെറിയ സഹോദരന്മാരിൽ ഒരുവന്
  rationale: ‘ഈ,’ ‘എന്റെ,’ ‘ഏറ്റവും ചെറിയ,’ ‘സഹോദരന്മാരിൽ ഒരുവൻ’ എന്നീ ഘടകങ്ങളെല്ലാം സംരക്ഷിക്കുകയും പരാമർശിക്കപ്പെടുന്ന കൂട്ടത്തിന്റെ തിരിച്ചറിയൽ തുറന്നുവെക്കുകയും ചെയ്യുന്നു.
- source_word: ἐμοὶ ἐποιήσατε
  choice: എനിക്കാണ് ചെയ്തത്
  rationale: ἐμοί എന്ന ഊന്നൽ മലയാളത്തിലെ ‘ആണ്’ ഘടനയിലൂടെ പ്രകടമാക്കി, അവർക്കു ചെയ്ത പ്രവൃത്തി രാജാവിനുതന്നെ ചെയ്തതാണെന്ന സമാന്തരത നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘എന്റെ ഈ സഹോദരന്മാർ’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: വാക്യത്തിന്റെ നേരിട്ടുള്ള ബന്ധപദം നിലനിർത്തി, ആരെന്നത് മുഖ്യപാഠത്തിൽ നിർണ്ണയിക്കാതെ വെച്ചു.
  alternative: യേശുവിന്റെ ശിഷ്യന്മാർ/ദൂതന്മാർ മാത്രം; വിശ്വാസികൾ പൊതുവെ; അല്ലെങ്കിൽ ദുർബലരും ആവശ്യത്തിലിരിക്കുന്നവരും പൊതുവെ എന്ന് വ്യക്തമായി നിർവചിക്കുക.
  rationale: ഈ വാക്യം മാത്രം പരാമർശത്തിന്റെ പരിധി തീർച്ചപ്പെടുത്തുന്നില്ല. അതിനാൽ വ്യാഖ്യാനപരവും ദൈവശാസ്ത്രപരവുമായ സംഘർഷം വിവർത്തനം മായ്ച്ചുകളയുന്നില്ല.
- issue: ἀδελφῶν എന്ന പുല്ലിംഗ ബഹുവചനത്തിന്റെ വിവർത്തനം
  choice: സഹോദരന്മാർ
  alternative: സഹോദരീസഹോദരന്മാർ; സഹോദരങ്ങൾ
  rationale: മൂലപദത്തിന്റെ വ്യാകരണപരമായ പുല്ലിംഗരൂപം കൃത്യമായി നിലനിർത്തുന്നു. കൂട്ടത്തിന്റെ പരിധി വിവാദമായതിനാൽ ലിംഗസമാവേശിയായ വിപുലീകരണം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. നേരിട്ടുള്ള പ്രസംഗത്തിന്റെ ഔപചാരികത നിലനിർത്തിയെങ്കിലും, ‘എന്തെല്ലാം… അതെല്ലാം’ എന്ന പ്രയോഗം വഴി വാക്യം സാധാരണ വായനക്കാർക്ക് സുതാര്യമാക്കി.
