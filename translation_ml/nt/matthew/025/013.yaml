base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/013.yaml
  text: Therefore[a], stay awake, because you do not know the day or the hour.
translation:
  language: ml
  text: അതുകൊണ്ട് ജാഗരിച്ചിരിക്കുവിൻ[a]; കാരണം, ആ ദിവസമോ ആ മണിക്കൂറോ നിങ്ങൾ അറിയുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കാവലിരിക്കുവിൻ” അല്ലെങ്കിൽ “ജാഗ്രത പാലിക്കുവിൻ.” ഗ്രീക്കിലെ ആജ്ഞ തുടർച്ചയായ ജാഗ്രതയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: ജാഗരിച്ചിരിക്കുവിൻ
  rationale: വർത്തമാനകാല ബഹുവചന ആജ്ഞ തുടർച്ചയായ ജാഗ്രതയെ സൂചിപ്പിക്കുന്നു. ഉപമയിലെ ഉറക്കം–ജാഗരണം എന്ന ദൃശ്യഭാവം നിലനിർത്തിക്കൊണ്ട് ഗൗരവമുള്ള സ്വാഭാവിക മലയാളം നൽകുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻപുള്ള ഉപമയിൽനിന്നുള്ള നിഗമനം വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാള ബന്ധപദം.
- source_word: ὅτι
  choice: കാരണം വ്യാകരണഘടനയിലൂടെ സൂചിപ്പിക്കുന്നു
  rationale: മലയാളത്തിൽ ആജ്ഞയ്ക്കു പിന്നാലെയുള്ള കാരണവാക്യം സ്വാഭാവികമായി ചേർക്കുന്നതിനായി വേറൊരു 'കാരണം' എന്ന പദം ചേർക്കാതെ അർത്ഥബന്ധം നിലനിർത്തുന്നു.
- source_word: οὐκ οἴδατε
  choice: നിങ്ങൾ അറിയുന്നില്ല
  rationale: രണ്ടാംപുരുഷ ബഹുവചനത്തിലുള്ള നിഷേധിത അറിവിന്റെ ക്രിയയെ അധിക വ്യാഖ്യാനമില്ലാതെ നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: τὴν ἡμέραν
  choice: ആ ദിവസം
  rationale: നിശ്ചയാർഥകത നിലനിർത്തുന്നു; ദിവസം എന്തിനെ സൂചിപ്പിക്കുന്നു എന്ന് വാക്യത്തിൽ ഇല്ലാത്തവിധം വിശദീകരിക്കുന്നില്ല.
- source_word: οὐδὲ τὴν ὥραν
  choice: ആ മണിക്കൂറോ
  rationale: നിഷേധവാക്യത്തിൽ 'ദിവസമോ മണിക്കൂറോ അറിയുന്നില്ല' എന്ന മലയാള സമുച്ചയഘടന οὐδέയുടെ ഏകോപനാർഥം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: ജാഗ്രതയ്ക്കുള്ള ആജ്ഞയിലെ ദൃശ്യഭാവം
  choice: ജാഗരിച്ചിരിക്കുവിൻ
  alternative: കാവലിരിക്കുവിൻ; ജാഗ്രതയോടിരിക്കുവിൻ
  rationale: ഉപമയിലെ ഉറക്കം–ജാഗരണം എന്ന രൂപകം സംരക്ഷിക്കുകയും അതിനെ വെറും അമൂർത്തമായ ശ്രദ്ധയായി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: '''ദിവസമോ മണിക്കൂറോ'' എന്നതിന്റെ വ്യാപ്തി'
  choice: വ്യാഖ്യാനപരമായ വിപുലീകരണമില്ലാതെ പ്രയോഗം നിലനിർത്തുക
  alternative: മനുഷ്യപുത്രന്റെ വരവിന്റെ ദിവസമോ മണിക്കൂറോ; നിശ്ചയിക്കപ്പെട്ട സമയമോ
  rationale: വിശാലമായ സന്ദർഭം അന്തിമ ന്യായവിധിയെയും മനുഷ്യപുത്രന്റെ വരവിനെയും സംബന്ധിച്ചിരുന്നാലും, ഈ വാക്യം പറയുന്നത് ദിവസം, മണിക്കൂർ എന്നുമാത്രമാണ്; അതിനാൽ വ്യക്തമല്ലാത്ത വിശദീകരണം പരിഭാഷയിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ബൈബിൾ ശൈലി. ബഹുവചന ആജ്ഞയ്ക്കായി ‘ജാഗരിച്ചിരിക്കുവിൻ’ ഉപയോഗിച്ചു; ഇത് സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതും ഉപമയുടെ രൂപകം നിലനിർത്തുന്നതുമാണ്.
