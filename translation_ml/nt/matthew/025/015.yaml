source:
  edition: SBLGNT
  text: καὶ ᾧ μὲν ἔδωκεν πέντε τάλαντα ᾧ δὲ δύο ᾧ δὲ ἕν, ἑκάστῳ κατὰ τὴν ἰδίαν δύναμιν, καὶ ἀπεδήμησεν. εὐθέως
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/015.yaml
  text: And to one he gave five talents[a], to another two, and to another one, to each according to his own ability[b]; and he went away immediately.
translation:
  language: ml
  text: ഒരാൾക്ക് അഞ്ച് താലന്ത്[a], മറ്റൊരാൾക്ക് രണ്ട്, വേറൊരാൾക്ക് ഒന്ന് എന്നിങ്ങനെ, ഓരോരുത്തരുടെയും കഴിവനുസരിച്ച് അവൻ കൊടുത്തു; പിന്നെ അവൻ യാത്രയായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വലിയ തുകകൾ’; ഒരു താലന്ത് വളരെ വലിയ ധനമൂല്യ ഏകകമായിരുന്നു; അത് സ്വാഭാവിക കഴിവോ പ്രതിഭയോ അല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: τάλαντα
  choice: താലന്ത്
  rationale: വലിയൊരു തൂക്ക-ധനമൂല്യ ഏകകത്തെ സൂചിപ്പിക്കുന്ന ചരിത്രപരമായ പദം നിലനിർത്തുന്നു; ആധുനിക അർഥത്തിലുള്ള സ്വാഭാവിക പ്രതിഭയല്ലെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: ᾧ μὲν ... ᾧ δὲ ... ᾧ δὲ
  choice: ഒരാൾക്ക് ... മറ്റൊരാൾക്ക് ... വേറൊരാൾക്ക്
  rationale: വ്യത്യസ്ത സ്വീകർത്താക്കൾക്കിടയിലെ വിതരണക്രമവും വൈരുധ്യവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἕν
  choice: ഒന്ന്
  rationale: മുൻപുള്ള ‘താലന്ത്’ എന്ന നാമം ഇവിടെ അധ്യാഹരിക്കപ്പെടുന്നതിനാൽ അനാവശ്യ ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: ἑκάστῳ
  choice: ഓരോരുത്തനും
  rationale: ദാതിവ് ഏകവചനത്തിന്റെ വിതരണാർഥം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: κατὰ τὴν ἰδίαν δύναμιν
  choice: അവനവന്റെ കഴിവനുസരിച്ച്
  rationale: δύναμις ഇവിടെ അത്ഭുതശക്തിയല്ല, വ്യക്തിഗത ശേഷിയോ കഴിവോ ആണ്; ‘അവനവന്റെ’ എന്നത് ഏകവചന വിതരണാർഥം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἀπεδήμησεν
  choice: യാത്രയായി
  rationale: വീടുവിട്ട് അകലേക്ക് യാത്രതിരിക്കുന്നതെന്ന ക്രിയയുടെ യാത്രാനുഭാവം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: εὐθέως
  choice: ഉടനെ
  rationale: പ്രക്ഷേപിത വാചകക്രമത്തിൽ യാത്രതിരിച്ചതിനെ വിശേഷിപ്പിക്കുന്ന സമയക്രിയാവിശേഷണമായി എടുത്തിരിക്കുന്നു.
- source_word: καὶ
  choice: കൊടുത്തിട്ട്
  rationale: മുൻവാക്യത്തിലെ പ്രധാന പ്രവർത്തനത്തോടുള്ള തുടർച്ച മലയാളത്തിലെ ക്രിയാശൃംഖലയിലൂടെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: വിതരണപ്രസ്താവനയിലെ ഏകവചന പുംലിംഗ സൂചന
  choice: അവനവന്റെ കഴിവനുസരിച്ച്
  alternative: ഓരോരുത്തരുടെയും കഴിവനുസരിച്ച്
  rationale: ഗ്രീക്കിലെ ഏകവചന വിതരണഘടന നിലനിർത്തുമ്പോഴും മലയാളത്തിൽ വ്യക്തികളെ ഓരോരുത്തരായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക പ്രയോഗമാണിത്.
- issue: ഉപമയിലെ τάλαντα എന്നതിന്റെ അർഥം
  choice: ധനമൂല്യ ഏകകമായ താലന്ത്
  alternative: വലിയ തുകകൾ
  rationale: സന്ദർഭം ഏൽപ്പിച്ച സമ്പത്തെയും അതിന്റെ കൈകാര്യത്തെയും കുറിച്ചാണ്; അതിനാൽ ആധുനിക അർഥത്തിലുള്ള സ്വാഭാവിക പ്രതിഭയായി തെറ്റിദ്ധരിക്കാതിരിക്കണം.
- issue: εὐθέως ഏതിനോടാണ് ചേരുന്നത്
  choice: അവൻ ഉടനെ യാത്രയായി
  alternative: അടുത്ത വാക്യത്തിലെ ദാസന്റെ പ്രവർത്തനത്തോട് ചേർക്കുക
  rationale: നൽകിയിരിക്കുന്ന SBLGNT വാചകക്രമവും ഇംഗ്ലീഷ് ഓഡിറ്റ് പാളിയും അനുസരിച്ച് εὐθέως യാത്രതിരിച്ചതിനോടാണ് ചേർത്തത്; പുരാതന കൈയെഴുത്തുപ്രതികളിലെ വിരാമചിഹ്നങ്ങൾ മൂലപാഠത്തിന്റെ ഭാഗമല്ലാത്തതിനാൽ ഘടനാപരമായ സാധ്യത പൂർണമായി ഇല്ലാതാകുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ കഥനശൈലി. ‘താലന്ത്’ എന്ന ചരിത്രപദം നിലനിർത്തി അടിക്കുറിപ്പിലൂടെ അർഥം വ്യക്തമാക്കി. ഗ്രീക്കിലെ ദീർഘമായ ഏകവാക്യഘടന മലയാളത്തിലെ സ്വാഭാവിക ക്രിയാശൃംഖലയായി അവതരിപ്പിച്ചു.
