id: MAT.25.38
reference: Matthew 25:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πότε δέ σε εἴδομεν ξένον καὶ συνηγάγομεν, ἢ γυμνὸν καὶ περιεβάλομεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/038.yaml
  text: And when did we see you as a stranger and take you in[c][b][a], or naked and clothe you?
translation:
  language: ml
  text: എപ്പോഴാണ് ഞങ്ങൾ അങ്ങയെ അപരിചിതനായി[a] കണ്ടു അതിഥിയായി സ്വീകരിച്ചത്[b], അല്ലെങ്കിൽ വസ്ത്രമില്ലാത്തവനായി[c] കണ്ടു വസ്ത്രം ധരിപ്പിച്ചത്?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘പരദേശിയായി.’ ഗ്രീക്ക് പദം അപരിചിതനായവനെയോ സ്വന്തം വലയത്തിന് പുറത്തുള്ളവനെയോ സൂചിപ്പിക്കാം; ഇവിടെ അതിഥിസൽക്കാരം ആവശ്യമുള്ള ഒരാളാണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘കൂട്ടിച്ചേർത്തു’ അല്ലെങ്കിൽ ‘സ്വീകരിച്ചു’; ഇവിടെ ഒരാളെ സ്വീകരിച്ച് അതിഥിസൽക്കരിക്കുക എന്നാണ് അർത്ഥം.
    reason: lexical_alternative
  - marker: c
    text: അല്ലെങ്കിൽ ‘മതിയായ വസ്ത്രമില്ലാത്തവനായി.’ ഗ്രീക്ക് പദം പൂർണമായി വസ്ത്രമില്ലാത്ത അവസ്ഥയെയോ വേണ്ടത്ര വസ്ത്രമില്ലാത്ത അവസ്ഥയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: πότε
  choice: എപ്പോഴാണ്
  rationale: കഴിഞ്ഞകാലത്തെ പ്രവൃത്തിയുടെ സമയം ചോദിക്കുന്ന സ്വാഭാവികമായ മലയാള ചോദ്യരൂപം.
- source_word: δέ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: δέ ഇവിടെ മുൻചോദ്യത്തോട് ലഘുവായി ബന്ധിപ്പിക്കുന്നു; മലയാളത്തിലെ തുടർച്ചയായ ചോദ്യത്തിൽ പ്രത്യേക സംയോജകപദമില്ലാതെയും ആ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാകുന്നു.
- source_word: σε
  choice: അങ്ങയെ
  rationale: ഉപമയിലെ രാജാവിനെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്നതിനാൽ ആദരസൂചകമായ ഏകവചന കർമരൂപം യോജിക്കുന്നു.
- source_word: εἴδομεν
  choice: ഞങ്ങൾ ... കണ്ടിട്ട്
  rationale: അഓറിസ്റ്റിന്റെ കഴിഞ്ഞകാലസൂചന നിലനിർത്തുകയും തുടർന്നുള്ള കരുണാപ്രവൃത്തിയോടുള്ള ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ξένον
  choice: അപരിചിതനായി
  rationale: അറിയപ്പെടാത്തവൻ അഥവാ സ്വന്തം വലയത്തിന് പുറത്തുള്ളവൻ എന്ന സാമൂഹിക അർത്ഥം നിലനിർത്തുന്നു; ദേശീയതയെ അനാവശ്യമായി മുൻനിർത്തുന്നില്ല.
- source_word: συνηγάγομεν
  choice: അകത്തു സ്വീകരിച്ചത്
  rationale: സന്ദർഭത്തിൽ συνάγω അതിഥിസൽക്കാരത്തോടെ ഒരാളെ ചേർത്തെടുക്കുകയോ പാർപ്പിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; അക്ഷരാർഥമായ ‘കൂട്ടിച്ചേർത്തു’ എന്നതിനെക്കാൾ വ്യക്തമാണ്.
- source_word: ἢ
  choice: അല്ലെങ്കിൽ
  rationale: രണ്ടാമത്തെ ചോദ്യഘടകത്തെ വേർതിരിക്കുന്ന സാധാരണ വികൽപസംയോജകം.
- source_word: γυμνὸν
  choice: വസ്ത്രമില്ലാത്തവനായി
  rationale: അക്ഷരാർഥമായ നഗ്നതയും മതിയായ വസ്ത്രമില്ലായ്മയും ഉൾക്കൊള്ളാവുന്ന മാന്യവും വ്യക്തവുമായ പ്രയോഗം.
- source_word: περιεβάλομεν
  choice: വസ്ത്രം ധരിപ്പിച്ചത്
  rationale: ഒരാൾക്ക് വസ്ത്രം അണിയിച്ചുകൊടുക്കുക എന്ന സന്ദർഭാർഥം കൃത്യമായും സ്വാഭാവികമായും നൽകുന്നു.
theological_decisions:
- issue: ന്യായവിധിയെക്കുറിച്ചുള്ള ഉപമയിൽ ξένος സൂചിപ്പിക്കുന്ന അതിഥിസൽക്കാരത്തിന്റെ പരിധി
  choice: അപരിചിതൻ
  alternative: പരദേശി
  rationale: കരുണയും അതിഥിസൽക്കാരവും ആവശ്യമുള്ള, സ്വന്തം പരിചയവലയത്തിന് പുറത്തുള്ള ഒരാളെ സൂചിപ്പിക്കുന്ന വിശാലമായ സാമൂഹിക അർത്ഥം ‘അപരിചിതൻ’ നിലനിർത്തുന്നു; വംശീയമോ ദേശീയമോ ആയ ഒരു വിഭാഗത്തിലേക്ക് അർത്ഥം ചുരുക്കുന്നില്ല.
- issue: γυμνός എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: വസ്ത്രമില്ലാത്തവൻ
  alternative: മതിയായ വസ്ത്രമില്ലാത്തവൻ
  rationale: മൂലപദത്തിന്റെ നേരിട്ടുള്ള അർത്ഥം മുഖ്യവാചകത്തിൽ നിലനിർത്തി, മതിയായ വസ്ത്രമില്ലായ്മ എന്ന സാധ്യമായ വ്യാപ്തി അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ആദരപൂർവവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. രാജാവിനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയിൽ ‘അങ്ങയെ’ ഉപയോഗിച്ചു. മൂലത്തിലെ ചോദ്യഘടനയും ξένος, γυμνός എന്നീ പദങ്ങളുടെ അർത്ഥവ്യാപ്തിയും അടിക്കുറിപ്പുകളോടെ സംരക്ഷിച്ചു.
