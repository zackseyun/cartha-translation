id: MAT.25.43
reference: Matthew 25:43
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ξένος ἤμην καὶ οὐ συνηγάγετέ με, γυμνὸς καὶ οὐ περιεβάλετέ με, ἀσθενὴς καὶ ἐν φυλακῇ καὶ οὐκ ἐπεσκέψασθέ με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/043.yaml
  text: I was a stranger and you did not welcome me[a], naked and you did not clothe me[b], sick and in prison and you did not visit me.
translation:
  language: ml
  text: ഞാൻ അപരിചിതനായിരുന്നു; നിങ്ങൾ എന്നെ സ്വീകരിച്ചില്ല[a]. ഞാൻ വസ്ത്രമില്ലാത്തവനായിരുന്നു; നിങ്ങൾ എന്നെ വസ്ത്രം ധരിപ്പിച്ചില്ല. ഞാൻ രോഗിയും തടവിലുമായിരുന്നു; നിങ്ങൾ എന്നെ സന്ദർശിച്ചില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘എന്നെ അകത്തേക്കു ചേർത്തില്ല’ / ‘ആതിഥ്യത്തോടെ സ്വീകരിച്ചില്ല’; ഗ്രീക്ക് ക്രിയയുടെ അക്ഷരാർഥം ‘ഒരുമിച്ചുകൂട്ടുക’ എന്നാണെങ്കിലും, ഇവിടെ അപരിചിതനെ ആതിഥ്യത്തോടെ സ്വീകരിക്കുന്നതാണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
  - marker: b
    text: ‘സന്ദർശിക്കുക’ എന്നതിന് ഇവിടെ വെറുതെ ചെന്നുകാണുക എന്നതിലുപരി ‘കരുതലോടെ ചെന്നുകാണുക’ അഥവാ ‘പരിപാലിക്കുക’ എന്ന ധ്വനിയും ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ξένος
  choice: അപരിചിതൻ
  rationale: സ്വന്തം കുടുംബത്തിനോ സമൂഹത്തിനോ പുറത്തുള്ള, ആതിഥ്യവും സ്വീകരണവും ആവശ്യമുള്ള ഒരാളെ ഇവിടെ സൂചിപ്പിക്കുന്നു. ‘വിദേശി’ എന്നത് വംശീയമോ ദേശീയമോ ആയ അർഥം അനാവശ്യമായി പരിമിതപ്പെടുത്തും; ‘അതിഥി’ ആവശ്യാവസ്ഥയുടെ ഭാവം കുറയ്ക്കും.
- source_word: συνηγάγετέ
  choice: സ്വീകരിച്ചു
  rationale: συνάγω എന്ന ക്രിയയുടെ അക്ഷരാർഥം ‘ഒരുമിച്ചുകൂട്ടുക’ എന്നാണെങ്കിലും, ξένος എന്ന പദത്തോടൊപ്പം ഇവിടെ ആതിഥ്യമരുളി അകത്തേക്കു സ്വീകരിക്കുക എന്ന അർഥമാണ്. ‘സ്വീകരിക്കുക’ സ്വാഭാവികവും വിശാലവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: γυμνός
  choice: വസ്ത്രമില്ലാത്തവൻ
  rationale: പൂർണ നഗ്നതയെയോ മതിയായ വസ്ത്രമില്ലായ്മയെയോ പദം സൂചിപ്പിക്കാം. തുടർന്നുള്ള ‘വസ്ത്രം ധരിപ്പിക്കുക’ എന്ന പ്രതികരണത്തോടു ചേർന്ന്, മലയാളത്തിൽ മാന്യവും വ്യക്തവുമായ ഈ പ്രയോഗം വസ്ത്രദാരിദ്ര്യത്തെ പ്രകടമാക്കുന്നു.
- source_word: περιεβάλετέ
  choice: വസ്ത്രം ധരിപ്പിച്ചു
  rationale: അക്ഷരാർഥത്തിൽ ‘ചുറ്റിയിടുക’ എന്നതിൽനിന്ന് വസ്ത്രം അണിയിക്കുക എന്ന അർഥം വരുന്നു. ‘വസ്ത്രം ധരിപ്പിക്കുക’ ആ കരുണാപ്രവൃത്തിയെ നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: ἀσθενής
  choice: രോഗി
  rationale: പദത്തിന് പൊതുവായി ‘ദുർബലൻ’ എന്ന അർഥവും ഉണ്ടെങ്കിലും, ഈ കരുണാപ്രവൃത്തികളുടെ പട്ടികയിൽ ശാരീരിക രോഗാവസ്ഥയാണ് ഏറ്റവും സ്വാഭാവികമായ ധ്വനി.
- source_word: ἐν φυλακῇ
  choice: തടവിൽ
  rationale: φυλακή ഇവിടെ കാവൽസ്ഥലമെന്നതിലുപരി തടവിലായ അവസ്ഥയെ സൂചിപ്പിക്കുന്നു. ‘തടവിൽ’ സ്വാഭാവികവും കാലാനുസൃതവുമായ മലയാളമാണ്.
- source_word: ἐπεσκέψασθέ
  choice: സന്ദർശിച്ചു
  rationale: ἐπισκέπτομαι നേരിൽ ചെന്നുകാണുന്നതോടൊപ്പം കരുതലും ശ്രദ്ധയും കാണിക്കുന്നതിന്റെ ധ്വനി വഹിക്കുന്നു. മുഖ്യപാഠത്തിൽ concrete action ആയി ‘സന്ദർശിച്ചു’ നിലനിർത്തി, കരുതലിന്റെ ധ്വനി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ἐπεσκέψασθέ με എന്നതിലെ കരുണാപൂർവമായ പ്രവർത്തിയുടെ ധ്വനി
  choice: എന്നെ സന്ദർശിച്ചില്ല
  alternative: എന്നെ കരുതിയില്ല / എന്നെ ചെന്നുകണ്ടില്ല
  rationale: ഗ്രീക്ക് പദം പറയുന്ന നേരിട്ടുള്ള പ്രവർത്തിയെ ‘സന്ദർശിക്കുക’ സംരക്ഷിക്കുന്നു; അതേസമയം ഇത് വെറും സൗഹൃദസന്ദർശനം മാത്രമല്ല, കരുതലോടെയുള്ള ചെന്നുകാണലാണെന്ന ധ്വനി അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ ഓരോ അവസ്ഥയും പ്രതികരണവും വ്യക്തമായി കേൾക്കാൻ ചെറുവാക്യങ്ങളാക്കി; വാക്യത്തിന്റെ ഗൗരവവും വിധിന്യായസന്ദർഭത്തിലെ ആവർത്തനശക്തിയും നിലനിർത്തി.
