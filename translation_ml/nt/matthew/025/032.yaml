id: MAT.25.32
reference: Matthew 25:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸀συναχθήσονται ἔμπροσθεν αὐτοῦ πάντα τὰ ἔθνη, καὶ ἀφορίσει αὐτοὺς ἀπ’ ἀλλήλων, ὥσπερ ὁ ποιμὴν ἀφορίζει τὰ πρόβατα ἀπὸ τῶν ἐρίφων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/032.yaml
  text: And all the nations will be gathered before him[a], and he will separate them from one another, just as the shepherd separates the sheep from the goats[b],
translation:
  language: ml
  text: എല്ലാ ജനതകളും അവന്റെ മുമ്പിൽ ഒരുമിച്ചുകൂട്ടപ്പെടും[a]; ഇടയൻ ചെമ്മരിയാടുകളെ കോലാടുകളിൽനിന്ന്[b] വേർതിരിക്കുന്നതുപോലെ, അവൻ അവരെ പരസ്പരം വേർതിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “എല്ലാ ജനവിഭാഗങ്ങളും”; ഗ്രീക്കിൽ “എല്ലാ ജനതകളും” (πάντα τὰ ἔθνη).
    reason: lexical_alternative
  - marker: b
    text: “കോലാടുകൾ” എന്നു പരിഭാഷപ്പെടുത്തിയ ἐρίφων എന്ന ഗ്രീക്ക് പദത്തിന് കൂടുതൽ പ്രത്യേകമായി “ഇളം കോലാടുകൾ” അഥവാ “കോലാട്ടിൻകുട്ടികൾ” എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: συναχθήσονται
  choice: ഒരുമിച്ചുകൂട്ടപ്പെടും
  rationale: ഭാവികാല കർമണിപ്രയോഗം നിലനിർത്തുന്നു; പ്രവർത്തകനെ വാക്യത്തിൽ ചേർക്കാതെ സ്വാഭാവികമായ മലയാളം നൽകുന്നു.
- source_word: ἔμπροσθεν αὐτοῦ
  choice: അവന്റെ മുമ്പിൽ
  rationale: സന്നിധിയുടെയും ന്യായവിധിദൃശ്യത്തിന്റെയും അർഥം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ഭാഷയിൽ നിലനിർത്തുന്നു.
- source_word: πάντα τὰ ἔθνη
  choice: എല്ലാ ജനതകളും
  rationale: ἔθνη എന്ന പദത്തിന്റെ ജനതകൾ/രാഷ്ട്രങ്ങൾ എന്ന വിശാലാർഥം നിലനിർത്തുകയും അതിനെ ‘ജാതികൾ’ അഥവാ യഹൂദേതരർ എന്ന പരിമിത അർഥത്തിലേക്ക് ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀφορίσει
  choice: വേർതിരിക്കും
  rationale: ഒരു കൂട്ടത്തെ മറ്റൊന്നിൽനിന്ന് വേർതിരിക്കുക എന്ന സന്ദർഭാർഥം നേരിട്ടും വ്യക്തമായും അറിയിക്കുന്നു.
- source_word: αὐτοὺς ἀπ’ ἀλλήλων
  choice: അവരെ തമ്മിൽ
  rationale: ഒരുമിച്ചുകൂട്ടപ്പെട്ടവരുടെ ഇടയിൽ നടക്കുന്ന പരസ്പര വേർതിരിവ് സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ὥσπερ
  choice: പോലെ
  rationale: ഉപമയെ വ്യക്തമായും ചുരുക്കമായും അവതരിപ്പിക്കുന്നു.
- source_word: ὁ ποιμὴν
  choice: ഇടയൻ
  rationale: നിശ്ചയാർഥക ലേഖനമുള്ള ഗ്രീക്ക് പ്രയോഗത്തിന്റെ പൊതുദൃഷ്ടാന്തസ്വഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി കൈമാറുന്നു.
- source_word: τὰ πρόβατα
  choice: ചെമ്മരിയാടുകളെ
  rationale: πρόβατα എന്ന പ്രത്യേക മൃഗസൂചന നിലനിർത്തി കോലാടുകളുമായുള്ള ദൃശ്യവ്യത്യാസം വ്യക്തമാക്കുന്നു.
- source_word: τῶν ἐρίφων
  choice: കോലാടുകളിൽനിന്ന്
  rationale: മലയാളത്തിൽ ചെമ്മരിയാടുകളോടുള്ള സ്വാഭാവികവും വ്യക്തവുമായ വിരുദ്ധജോടി നൽകുന്നു; ഗ്രീക്കിൽ ഇളം കോലാടുകൾ എന്ന കൂടുതൽ പ്രത്യേക അർഥം ഉണ്ടാകാമെന്നത് അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: πάντα τὰ ἔθνη എന്ന പ്രയോഗത്തിന്റെ വ്യാപ്തി
  choice: എല്ലാ ജനതകളും
  alternative: എല്ലാ മനുഷ്യരും; എല്ലാ ജാതികളും; എല്ലാ യഹൂദേതരരും
  rationale: മൂലപദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു. വിധിക്കപ്പെടുന്ന കൂട്ടങ്ങളെക്കുറിച്ചുള്ള പ്രത്യേക ദൈവശാസ്ത്രക്രമം വാക്യത്തിൽ ഇറക്കുമതി ചെയ്യാതെയും ‘യഹൂദേതരർ’ എന്നു ചുരുക്കാതെയും അർഥസാധ്യത തുറന്നുവയ്ക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ ഭാവികാല കർമണിപ്രയോഗവും ഇടയന്റെ ഉപമയും നിലനിർത്തി; ദീർഘമായ ആദ്യഘടകത്തെ മലയാളവായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി.
