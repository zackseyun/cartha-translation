id: MAT.25.24
reference: Matthew 25:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: προσελθὼν δὲ καὶ ὁ τὸ ἓν τάλαντον εἰληφὼς εἶπεν· Κύριε, ἔγνων σε ὅτι σκληρὸς εἶ ἄνθρωπος, θερίζων ὅπου οὐκ ἔσπειρας καὶ συνάγων ὅθεν οὐ διεσκόρπισας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/024.yaml
  text: Then the one who had received the one talent also came and said[a], ‘Lord, I knew that you are a hard man[b], reaping where you did not sow and gathering where you did not scatter.’
translation:
  language: ml
  text: 'അപ്പോൾ, ഒരു താലന്ത് ലഭിച്ചിരുന്നവനും അടുത്തുവന്ന് പറഞ്ഞു: “കർത്താവേ, അങ്ങ് കഠിനനായ മനുഷ്യനാണെന്ന്[a] എനിക്കറിയാമായിരുന്നു; അങ്ങ് വിതയ്ക്കാത്തിടത്ത് കൊയ്യുകയും വിതറാത്തിടത്തുനിന്ന് ശേഖരിക്കുകയും ചെയ്യുന്നവനാണ്.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കഠിനനായ” എന്നതിനു “പരുഷനായ” അല്ലെങ്കിൽ “കർശനനായ” എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “വിതറാത്തിടത്തുനിന്ന് ശേഖരിക്കുന്നവൻ.” എന്താണ് വിതറിയതെന്ന കർമം ഗ്രീക്കിൽ വ്യക്തമാക്കിയിട്ടില്ല.
    reason: source_ambiguity
lexical_decisions:
- source_word: προσελθὼν
  choice: അടുത്തുവന്ന്
  rationale: സംസാരിക്കുന്നതിനുമുമ്പ് ദാസൻ യജമാനന്റെ അടുത്തേക്കു വന്നതിനെ സൂചിപ്പിക്കുന്ന എയോറിസ്റ്റ് കൃദന്തരൂപം സ്വാഭാവികമായ മലയാള കഥനക്രമത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: δὲ καὶ
  choice: അപ്പോൾ … വനും
  rationale: δέ നൽകുന്ന കഥനപുരോഗതിയും καί നൽകുന്ന ‘ഇവനും’ എന്ന ഉൾപ്പെടുത്തലും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: ὁ τὸ ἓν τάλαντον εἰληφὼς
  choice: ഒരു താലന്ത് ലഭിച്ചിരുന്നവൻ
  rationale: പൂർണകൃദന്തരൂപത്തിന്റെ മുമ്പ് പൂർത്തിയായതും ഇപ്പോഴും പ്രസക്തവുമായ സ്വഭാവം ‘ലഭിച്ചിരുന്ന’ എന്നതിലൂടെ പ്രകടമാക്കുന്നു; മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘മനുഷ്യൻ’ അല്ലെങ്കിൽ ‘ദാസൻ’ ഇവിടെ ചേർക്കുന്നില്ല.
- source_word: τάλαντον
  choice: താലന്ത്
  rationale: പുരാതന ഭാര-ധന അളവായ മൂലപദവും ഉപമയിലെ അതിന്റെ അനുരണനവും സംരക്ഷിക്കുന്നു; ‘സ്വർണ്ണസഞ്ചി’ പോലുള്ള അതിവ്യാഖ്യാനപരമായ രൂപം ഒഴിവാക്കുന്നു.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: ആദരപൂർവമായ നേരിട്ടുള്ള സംബോധന മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ഉപമയിൽ ഇത് യജമാനനോടുള്ള അഭിസംബോധനയായിരിക്കുമ്പോഴും κύριος എന്ന പദത്തിന്റെ പതിവ് തർജമ നിലനിർത്തുന്നു.
- source_word: ἔγνων σε ὅτι
  choice: അങ്ങ് … ആണെന്ന് എനിക്കറിയാമായിരുന്നു
  rationale: ദാസൻ യജമാനന്റെ സ്വഭാവത്തെക്കുറിച്ച് അവകാശപ്പെടുന്ന അറിവ് സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ഗ്രീക്കിലെ വ്യക്തിപ്രത്യയം മലയാളത്തിലെ ഉപവാക്യത്തിനുള്ളിലെ ‘അങ്ങ്’ എന്നതിൽ പ്രകടമാണ്.
- source_word: σκληρὸς
  choice: കഠിനനായ
  rationale: ‘കഠിനൻ, പരുഷൻ, കർശനൻ’ എന്നീ അർഥസാധ്യതകളിൽ ആരോപണത്തിന്റെ തുറന്ന സ്വഭാവം നിലനിർത്തുന്ന രൂപം; കൂടുതൽ ശക്തമായ ‘ക്രൂരനായ’ എന്ന വ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
- source_word: θερίζων ὅπου οὐκ ἔσπειρας
  choice: വിതയ്ക്കാത്തിടത്ത് കൊയ്യുകയും
  rationale: കൊയ്ത്തിന്റെയും വിതയ്ക്കലിന്റെയും കാർഷിക ദൃശ്യവും പരസ്പരബന്ധവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: συνάγων ὅθεν οὐ διεσκόρπισας
  choice: വിതറാത്തിടത്തുനിന്ന് ശേഖരിക്കുകയും
  rationale: ὅθεν എന്നതിലെ ‘ഇടത്തുനിന്ന്’ എന്ന അർഥവും διασκορπίζω/συνάγω എന്ന വിരുദ്ധചലനവും നിലനിർത്തുന്നു; മൂലത്തിൽ വ്യക്തമല്ലാത്ത ‘വിത്ത്’ എന്ന കർമം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ഉപമയിലെ അഭിസംബോധനയായ κύριος
  choice: കർത്താവേ
  alternative: യജമാനനേ
  rationale: സംഭാഷണസന്ദർഭത്തിൽ ‘യജമാനനേ’ സാധ്യമാണെങ്കിലും, κύριος എന്ന പദത്തിന്റെ വിശാലമായ അർഥപരിധിയും ഉപമയുടെ ദൈവശാസ്ത്രപരമായ അനുരണനവും മുൻകൂട്ടി ചുരുക്കാതെ ‘കർത്താവേ’ എന്ന് നൽകുന്നു.
- issue: യജമാനനെക്കുറിച്ചുള്ള ദാസന്റെ ആരോപണം
  choice: ദാസന്റെ അവകാശവാദമായി നേരിട്ട് അവതരിപ്പിച്ചു; ശരിവയ്ക്കുകയോ മൃദൂകരിക്കുകയോ ചെയ്തില്ല
  alternative: യജമാനൻ യഥാർഥത്തിൽ പരുഷനാണെന്ന് സൂചിപ്പിക്കുന്ന വിധത്തിൽ കൂടുതൽ ശക്തമായി പരിഭാഷപ്പെടുത്തുക
  rationale: ഈ വാക്യം ദാസന്റെ കാഴ്ചപ്പാടാണ് റിപ്പോർട്ട് ചെയ്യുന്നത്. അതിന്റെ സത്യാസത്യത്തെ പരിഭാഷ തീരുമാനിക്കാതെ കഥയിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി ഉപയോഗിച്ചു. ‘അങ്ങ്’ ആദരസൂചക ഏകവചനമായി സ്വീകരിച്ചു. ‘താലന്ത്’ മൂലലോകത്തിലെ ധന-ഭാര അളവിന്റെ പേരായി നിലനിർത്തി; കാർഷിക രൂപകത്തിലെ ‘വിതയ്ക്കുക/കൊയ്യുക’ എന്നും ‘വിതറുക/ശേഖരിക്കുക’ എന്നും ഉള്ള സമാന്തരത വ്യക്തമായി സൂക്ഷിച്ചു.
