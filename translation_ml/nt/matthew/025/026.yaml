id: MAT.25.26
reference: Matthew 25:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ κύριος αὐτοῦ εἶπεν αὐτῷ· Πονηρὲ δοῦλε καὶ ὀκνηρέ, ᾔδεις ὅτι θερίζω ὅπου οὐκ ἔσπειρα καὶ συνάγω ὅθεν οὐ διεσκόρπισα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/026.yaml
  text: But his master answered and said to him[a], ‘Wicked and lazy servant[b], you knew that I reap where I did not sow and gather where I did not scatter?
translation:
  language: ml
  text: 'എന്നാൽ അവന്റെ യജമാനൻ അവനോട് മറുപടി പറഞ്ഞു: “ദുഷ്ടനും മടിയനുമായ ദാസാ[a], ഞാൻ വിതയ്ക്കാത്തിടത്ത് കൊയ്യുകയും വിതറിയിട്ടില്ലാത്തിടത്തുനിന്ന് ശേഖരിക്കുകയും ചെയ്യുന്നുവെന്ന് നിനക്ക് അറിയാമായിരുന്നല്ലോ?[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദുഷ്ടനും മടിയനുമായ അടിമേ.” ഗ്രീക്ക് പദമായ ദൂലോസ് (δοῦλος) സന്ദർഭമനുസരിച്ച് ‘ദാസൻ’ എന്നോ ‘അടിമ’ എന്നോ അർഥമാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: 'ഇത് ചോദ്യമായല്ല, ഒരു പ്രസ്താവനയായും വായിക്കാം: “ഞാൻ വിതയ്ക്കാത്തിടത്ത് കൊയ്യുകയും വിതറിയിട്ടില്ലാത്തിടത്തുനിന്ന് ശേഖരിക്കുകയും ചെയ്യുന്നുവെന്ന് നിനക്ക് അറിയാമായിരുന്നു.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: അപ്പോൾ ... മറുപടി പറഞ്ഞു
  rationale: സാധാരണ ഗ്രീക്ക് ആഖ്യാനപ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം; δέ സൂചിപ്പിക്കുന്ന നേരിയ വഴിത്തിരിവ് ‘അപ്പോൾ’ വഴി പ്രകടമാക്കുന്നു.
- source_word: ὁ κύριος αὐτοῦ
  choice: അവന്റെ യജമാനൻ
  rationale: ഉപമയിലെ അധിപൻ–ദാസൻ ബന്ധമാണ് ഇവിടെ ഉദ്ദേശ്യം; നേരിട്ടുള്ള ക്രിസ്തുശാസ്ത്രപരമായ ‘കർത്താവ്’ എന്ന പദവിയല്ല.
- source_word: Πονηρὲ
  choice: ദുഷ്ടൻ
  rationale: വെറും മോശം ഗുണമല്ല, ധാർമ്മികമായ കുറ്റപ്പെടുത്തലാണ് πονηρός സൂചിപ്പിക്കുന്നത്.
- source_word: δοῦλε
  choice: ദാസൻ
  rationale: δοῦλος സേവകനെയോ അടിമയെയോ സൂചിപ്പിക്കാം. ഉപമയിലെ അധീനബന്ധം നിലനിർത്തുന്ന, ഗൗരവമുള്ള സാധാരണ മലയാളപദമായി ‘ദാസൻ’ തെരഞ്ഞെടുത്തു; ‘അടിമ’ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ὀκνηρέ
  choice: മടിയൻ
  rationale: പ്രവർത്തിക്കാൻ വിമുഖതയും അലസതയും സൂചിപ്പിക്കുന്ന വ്യക്തവും ആധുനികവുമായ മലയാളപദം.
- source_word: ᾔδεις ὅτι
  choice: '... എന്ന് നിനക്ക് അറിയാമായിരുന്നല്ലോ?'
  rationale: അറിഞ്ഞിരുന്ന കാര്യം എന്ന ആശയം നിലനിർത്തിക്കൊണ്ട്, സന്ദർഭത്തിൽ യജമാനൻ ദാസന്റെ തന്നെ വാദം അവനിലേക്കു തിരിക്കുന്ന വാചാടോപചോദ്യത്തിന്റെ സ്വരം നൽകുന്നു.
- source_word: θερίζω ὅπου οὐκ ἔσπειρα
  choice: ഞാൻ വിതയ്ക്കാത്തിടത്ത് കൊയ്യുന്നു
  rationale: വിതയ്ക്കൽ–കൊയ്ത്ത് എന്ന കാർഷിക പ്രതിരൂപവും കാലബന്ധവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: συνάγω ὅθεν οὐ διεσκόρπισα
  choice: വിതറിയിട്ടില്ലാത്തിടത്തുനിന്ന് ശേഖരിക്കുന്നു
  rationale: ὅθεν എന്നതിന്റെ ‘ഇടത്തുനിന്ന്’ എന്ന ദിശാബോധവും διασκορπίζω എന്നതിന്റെ തുറന്ന ‘വിതറുക’ എന്ന അർഥവും സംരക്ഷിക്കുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത ‘വിത്ത്’ മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: അവസാന വാക്കുകളുടെ വാക്യബലവും ചിഹ്നനവും
  choice: വാചാടോപചോദ്യമായി അവതരിപ്പിച്ചു
  alternative: “ഞാൻ വിതയ്ക്കാത്തിടത്ത് കൊയ്യുകയും വിതറിയിട്ടില്ലാത്തിടത്തുനിന്ന് ശേഖരിക്കുകയും ചെയ്യുന്നുവെന്ന് നിനക്ക് അറിയാമായിരുന്നു.” എന്ന പ്രസ്താവനയായി വായിക്കാം.
  rationale: ഗ്രീക്കിൽ ചോദ്യം നിർബന്ധമാക്കുന്ന പ്രത്യേക രൂപമില്ല; മുൻവാക്യത്തിലെ ദാസന്റെ അവകാശവാദം അവനിലേക്കുതന്നെ തിരിക്കുന്ന വാചാടോപചോദ്യമായി സന്ദർഭം അനുവദിക്കുന്നു. യഥാർഥമായ ഈ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ഉപമാശൈലി. ‘യജമാനൻ’, ‘ദാസൻ’ എന്നീ പദങ്ങൾ സാമൂഹികബന്ധം വ്യക്തമാക്കുന്നു. മൂലപാഠത്തിലെ കാർഷിക രൂപകം നിലനിർത്തുകയും ഗ്രീക്കിൽ വ്യക്തമായി ഇല്ലാത്ത ‘വിത്ത്’ മുഖ്യപാഠത്തിൽ ചേർക്കാതിരിക്കുകയും ചെയ്തു.
