  to: 'എന്നാൽ അവന്റെ യജമാനൻ അവനോട് മറുപടി പറഞ്ഞു: “ദുഷ്ടനും മടിയനുമായ ദാസാ[a], ഞാൻ വിതയ്ക്കാത്തിടത്ത് കൊയ്യുകയും വിതറിയിട്ടില്ലാത്തിടത്തുനിന്ന് ശേഖരിക്കുകയും ചെയ്യുന്നുവെന്ന് നിനക്ക് അറിയാമായിരുന്നല്ലോ?[b]”'
  rationale: 'രണ്ടു ചെറിയ ശൈലീപരമായ തിരുത്തലുകൾ മാത്രം ആവശ്യമാണ്: δέയ്ക്കായി ‘എന്നാൽ’ സ്വീകരിക്കുകയും ‘അവനോടു’ എന്നതിനെ ‘അവനോട്’ ആക്കുകയും ചെയ്തു. അർഥം, കാർഷികരൂപകം, സാമൂഹികസന്ദർഭം, ചോദ്യചിഹ്നത്തിന്റെ വ്യാഖ്യാനപരമായ അനിശ്ചിതത്വം, എല്ലാ അടിക്കുറിപ്പുകളും മാറ്റമില്ലാതെ സംരക്ഷിച്ചിരിക്കുന്നു.'
