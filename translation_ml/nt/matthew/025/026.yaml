  revised_text: 'എന്നാൽ അവന്റെ യജമാനൻ അവനോട് മറുപടി പറഞ്ഞു: “ദുഷ്ടനും മടിയനുമായ ദാസാ[a], ഞാൻ വിതയ്ക്കാത്തിടത്ത് കൊയ്യുകയും വിതറിയിട്ടില്ലാത്തിടത്തുനിന്ന് ശേഖരിക്കുകയും ചെയ്യുന്നുവെന്ന് നിനക്ക് അറിയാമായിരുന്നല്ലോ?[b]”'
