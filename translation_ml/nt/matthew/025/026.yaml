    rationale: δέ ഇവിടെ സാധാരണ ആഖ്യാനബന്ധകമാണെങ്കിലും, മുമ്പത്തെ ദാസന്റെ വാക്കുകൾക്കുള്ള യജമാനന്റെ പ്രതികരണത്തിലെ ചെറിയ വിരുദ്ധത ‘എന്നാൽ’ കൂടുതൽ നേരിട്ട് അറിയിക്കുന്നു.
