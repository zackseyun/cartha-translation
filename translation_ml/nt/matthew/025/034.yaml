id: MAT.25.34
reference: Matthew 25:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τότε ἐρεῖ ὁ βασιλεὺς τοῖς ἐκ δεξιῶν αὐτοῦ· Δεῦτε, οἱ εὐλογημένοι τοῦ πατρός μου, κληρονομήσατε τὴν ἡτοιμασμένην ὑμῖν βασιλείαν ἀπὸ καταβολῆς κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/034.yaml
  text: Then the King will say to those on his right[a], ‘Come, you who are blessed by my Father[b], inherit the kingdom prepared for you from the foundation of the world.’
translation:
  language: ml
  text: 'അപ്പോൾ രാജാവ് തന്റെ വലതുവശത്തുള്ളവരോടു പറയും: “എന്റെ പിതാവിനാൽ അനുഗ്രഹിക്കപ്പെട്ടവരേ,[a] വരുവിൻ; ലോകം സ്ഥാപിക്കപ്പെട്ടതുമുതൽ[b] നിങ്ങൾക്കായി ഒരുക്കിയിരിക്കുന്ന രാജ്യം അവകാശമായി സ്വീകരിക്കുവിൻ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: “എന്റെ പിതാവിന്റെ അനുഗ്രഹീതരേ.”'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: “ലോകത്തിന്റെ സ്ഥാപനം മുതൽ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: അപ്പോൾ
  rationale: ന്യായവിധിദൃശ്യത്തിലെ സംഭവക്രമം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐρεῖ
  choice: പറയും
  rationale: നേരിട്ടുള്ള സംഭാഷണത്തിന് ആമുഖം നൽകുന്ന ഭാവികാല ക്രിയയുടെ സ്വാഭാവിക പരിഭാഷ.
- source_word: ὁ βασιλεὺς
  choice: രാജാവ്
  rationale: സന്ദർഭത്തിലെ നിർദിഷ്ട രാജാവിനെയും ന്യായാധിപനെയും സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ പ്രത്യേക ശീർഷകം വ്യക്തമാക്കാൻ വേറിട്ട വലിയക്ഷരരീതി ആവശ്യമില്ല.
- source_word: τοῖς ἐκ δεξιῶν αὐτοῦ
  choice: തന്റെ വലതുവശത്തുള്ളവരോട്
  rationale: സ്ഥാനസൂചനയും അതിനോടു ബന്ധപ്പെട്ട ബഹുമാനാർഥവും നിലനിർത്തുന്ന വ്യക്തമായ പ്രയോഗം.
- source_word: Δεῦτε
  choice: വരുവിൻ
  rationale: ഗൗരവമുള്ള ക്ഷണത്തിന്റെ ബഹുവചന ആജ്ഞാരൂപം; വാക്യത്തിന്റെ ഉന്നതവും വായനാസൗകര്യമുള്ളതുമായ ശൈലിയോട് ചേരുന്നു.
- source_word: οἱ εὐλογημένοι τοῦ πατρός μου
  choice: എന്റെ പിതാവിനാൽ അനുഗ്രഹിക്കപ്പെട്ടവരേ
  rationale: പൂർണ്ണകാല നിഷ്ക്രിയ പങ്കാളിക്രിയയുടെ നിലനിൽക്കുന്ന ഫലവും പിതാവാണ് അനുഗ്രഹത്തിന്റെ ഉറവിടം/കർത്താവ് എന്ന സ്വാഭാവിക അർഥവും സൂക്ഷിക്കുന്നു.
- source_word: κληρονομήσατε
  choice: അവകാശമായി സ്വീകരിക്കുവിൻ
  rationale: കുടുംബപരവും ഉടമ്പടിപരവുമായ അവകാശലഭ്യതയുടെ ഭാവം സൂക്ഷിക്കുമ്പോൾ ആധുനിക വായനക്കാർക്ക് അർഥം സുതാര്യമാക്കുന്നു.
- source_word: τὴν ... βασιλείαν
  choice: രാജ്യം
  rationale: അവകാശമായി ലഭിക്കുന്നതും ഒരുക്കപ്പെട്ടിരിക്കുന്നതുമായ അന്ത്യകാലിക മേഖലയെ ഇവിടെ ഏറ്റവും യോജിച്ചവിധം സൂചിപ്പിക്കുന്നു; ദൈവിക ഭരണത്തിന്റെ വിശാല അർഥം നിഷേധിക്കുന്നില്ല.
- source_word: ἡτοιμασμένην ὑμῖν
  choice: നിങ്ങൾക്കായി ഒരുക്കിയിരിക്കുന്ന
  rationale: മുൻപേ പൂർത്തിയായ ഒരുക്കത്തിന്റെ ഇപ്പോഴും നിലനിൽക്കുന്ന പ്രസക്തി സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: ലോകം സ്ഥാപിക്കപ്പെട്ടതുമുതൽ
  rationale: ലോകത്തിന്റെ ആരംഭം മുതൽ എന്ന കാലാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുകയും ἀπό എന്നതിന്റെ ആരംഭബിന്ദു സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: τοῦ πατρός μου എന്ന ഷഷ്ഠീവിഭക്തി അനുഗ്രഹത്തിന്റെ ഉറവിടമോ കർത്താവോ ആയി എങ്ങനെ അവതരിപ്പിക്കണം
  choice: “എന്റെ പിതാവിനാൽ അനുഗ്രഹിക്കപ്പെട്ടവരേ”
  alternative: “എന്റെ പിതാവിന്റെ അനുഗ്രഹീതരേ”
  rationale: ഗ്രീക്ക് ഘടന പിതാവിൽനിന്നുള്ള അനുഗ്രഹത്തെ സൂചിപ്പിക്കുന്നു. തിരഞ്ഞെടുത്ത രൂപം കർത്തൃത്വം ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; പകരം രൂപം കൂടുതൽ പദാനുപദമാണ്.
- issue: അന്ത്യകാലിക അവകാശത്തിന്റെ സന്ദർഭത്തിൽ βασιλεία എന്നതിന്റെ അർഥം
  choice: “രാജ്യം”
  alternative: “ഭരണം”
  rationale: “അവകാശമായി സ്വീകരിക്കുക,” “ഒരുക്കിയിരിക്കുന്നത്” എന്നീ പ്രയോഗങ്ങളോടൊപ്പം ഇവിടെ അവകാശമായി ലഭിക്കുന്ന അന്ത്യകാലിക രാജ്യം എന്ന അർഥമാണ് ഏറ്റവും സ്വാഭാവികം; എങ്കിലും ദൈവത്തിന്റെ ഭരണാധികാരം എന്ന വിശാല ആശയം ഇതിലൂടെ ഇല്ലാതാകുന്നില്ല.
- issue: ἀπὸ καταβολῆς κόσμου എന്ന കാലപ്രയോഗത്തിന്റെ ബന്ധം
  choice: “നിങ്ങൾക്കായി ഒരുക്കിയിരിക്കുന്ന രാജ്യം” എന്നതിനോടു ചേർത്തു
  alternative: മുഴുവൻ ക്ഷണത്തോടും അയഞ്ഞ നിലയിൽ ബന്ധിപ്പിക്കുക
  rationale: അടുത്തുള്ള ἡτοιμασμένην എന്ന പങ്കാളിക്രിയയോടുള്ള ബന്ധമാണ് വ്യാകരണപരമായി ഏറ്റവും സ്വാഭാവികം. അതിനാൽ ലോകാരംഭം മുതൽ രാജ്യം ഒരുക്കപ്പെട്ടിരിക്കുന്നു എന്ന അർഥം നൽകുന്നു; അതിലപ്പുറം ഒരു സിദ്ധാന്തവ്യവസ്ഥ ഇതിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തതയും തിരുവെഴുത്തുവായനയ്ക്ക് യോജിച്ച ഗൗരവവും ഒരുമിപ്പിച്ചിരിക്കുന്നു. “വരുവിൻ,” “സ്വീകരിക്കുവിൻ” എന്നീ രൂപങ്ങൾ ആദരപൂർവമായ ബഹുവചന ആജ്ഞ നിലനിർത്തുന്നു; അത്യന്തം പുരാതനമായ പദക്രമവും വിഭാഗീയ സാങ്കേതികഭാഷയും ഒഴിവാക്കി.
