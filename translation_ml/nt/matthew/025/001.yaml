id: MAT.25.1
reference: Matthew 25:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τότε ὁμοιωθήσεται ἡ βασιλεία τῶν οὐρανῶν δέκα παρθένοις, αἵτινες λαβοῦσαι τὰς λαμπάδας ⸀ἑαυτῶν ἐξῆλθον εἰς ⸀ὑπάντησιν τοῦ νυμφίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/001.yaml
  text: Then the kingdom of heaven will be like ten virgins[c][b][a], who took their lamps and went out to meet the bridegroom.
translation:
  language: ml
  text: അപ്പോൾ സ്വർഗരാജ്യം, തങ്ങളുടെ വിളക്കുകൾ[b] എടുത്ത് മണവാളനെ എതിരേൽക്കാൻ പുറപ്പെട്ട പത്തു കന്യകമാരോടു[c] സദൃശമായിരിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “ഉപമിക്കപ്പെടും” അല്ലെങ്കിൽ “ഉപമിക്കപ്പെടുന്നതായിരിക്കും.” ഗ്രീക്ക് ക്രിയ കർമണിപ്രയോഗത്തിലാണ്.
    reason: lexical_alternative
  - marker: b
    text: “വിളക്കുകൾ” എന്നതിന് “പന്തങ്ങൾ” എന്നും പരിഭാഷപ്പെടുത്താം; ഘോഷയാത്രയിൽ കൈയിൽ പിടിച്ചുകൊണ്ടുപോകുന്ന വെളിച്ചത്തെ ഈ ഗ്രീക്ക് പദം സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: “കന്യകമാർ” എന്നതിന് ഈ വിവാഹസന്ദർഭത്തിൽ “അവിവാഹിതരായ യുവതികൾ” എന്നും അർഥമാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: അപ്പോൾ
  rationale: മുൻപുള്ള അന്ത്യകാലപ്രസംഗവുമായി ഉപമയെ ബന്ധിപ്പിക്കുന്ന സ്വാഭാവികമായ കാലസൂചകം.
- source_word: ὁμοιωθήσεται
  choice: സദൃശമായിരിക്കും
  rationale: ഭാവികാലത്തിലുള്ള താരതമ്യം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ഗ്രീക്കിലെ കർമണിപ്രയോഗം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: സ്വർഗരാജ്യം
  rationale: മത്തായിയുടെ സ്ഥിരപ്രയോഗത്തിന് മലയാളത്തിൽ സുപരിചിതവും സംക്ഷിപ്തവുമായ തുല്യപദം.
- source_word: δέκα παρθένοις
  choice: പത്തു കന്യകമാരോട്
  rationale: വിവാഹസന്ദർഭത്തിലെ παρθένος എന്ന പദത്തിന്റെ അവിവാഹിതയായ യുവതി/കന്യക എന്ന അർഥപരിധി നിലനിർത്തുന്നു.
- source_word: λαβοῦσαι τὰς λαμπάδας ἑαυτῶν
  choice: തങ്ങളുടെ വിളക്കുകൾ എടുത്ത്
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള പ്രവൃത്തിയായി ഗ്രീക്ക് കൃദ്ദന്തരൂപത്തെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; λαμπάς എന്നതിന്റെ ‘പന്തം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἐξῆλθον εἰς ὑπάντησιν
  choice: എതിരേൽക്കാൻ പുറപ്പെട്ട
  rationale: ആരെയെങ്കിലും സ്വീകരിക്കാനായി പുറത്തേക്കു പോകുന്ന ചലനവും ഉദ്ദേശ്യവും ഒരുമിച്ച് വ്യക്തമാക്കുന്ന സ്വാഭാവിക പ്രയോഗം.
- source_word: τοῦ νυμφίου
  choice: മണവാളനെ
  rationale: വിവാഹസന്ദർഭത്തിലെ νυμφίος എന്ന പദത്തിന് ദിഗ്നമായും സാധാരണ വായനക്കാർക്ക് പരിചിതമായും ഉള്ള തുല്യപദം.
theological_decisions:
- issue: ഉപമയുടെ താരതമ്യസൂത്രം
  choice: സ്വർഗരാജ്യം ... സദൃശമായിരിക്കും
  alternative: സ്വർഗരാജ്യം ... ഉപമിക്കപ്പെടും
  rationale: ഗ്രീക്കിലെ ഭാവികാല കർമണിയുടെ താരതമ്യാർഥം നിലനിർത്തിക്കൊണ്ട്, മുഖ്യവാക്യം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; കർമണിരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: παρθένοις എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: കന്യകമാർ
  alternative: അവിവാഹിതരായ യുവതികൾ
  rationale: മൂലപദത്തിന്റെ പരമ്പരാഗതവും കൂടുതൽ നേരിട്ടതുമായ അർഥം നിലനിർത്തുന്നു; വിശാലമായ സാമൂഹിക വിവരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. പരമ്പരാഗത ബൈബിൾ പദങ്ങളായ “സ്വർഗരാജ്യം,” “കന്യകമാർ,” “മണവാളൻ” എന്നിവ സാധാരണ വായനാസൗകര്യത്തോടെ നിലനിർത്തിയിരിക്കുന്നു; അസ്വാഭാവികമായ കർമണിപ്രയോഗം മുഖ്യവാക്യത്തിൽ ഒഴിവാക്കി അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
