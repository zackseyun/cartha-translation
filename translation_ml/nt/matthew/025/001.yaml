  source_fidelity: 'The Malayalam faithfully represents the Greek sequence and sense: Τότε is conveyed by “അപ്പോൾ”; the future comparison formula is rendered naturally as “സദൃശമായിരിക്കും”; the dative comparison with ten virgins is retained; and the women take their own lights and go out to meet the bridegroom. “എതിരേൽക്കാൻ പുറപ്പെട്ട” adequately conveys purposeful going out to meet him.'
