id: MAT.25.33
reference: Matthew 25:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ στήσει τὰ μὲν πρόβατα ἐκ δεξιῶν αὐτοῦ τὰ δὲ ἐρίφια ἐξ εὐωνύμων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/033.yaml
  text: And he will place the sheep at his right hand[b][a], but the goats at the left.
translation:
  language: ml
  text: അവൻ ചെമ്മരിയാടുകളെ തന്റെ വലത്തുവശത്തും കോലാട്ടിൻകുട്ടികളെ ഇടത്തുവശത്തും നിർത്തും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στήσει
  choice: നിർത്തും
  rationale: ἵστημι എന്ന ക്രിയയുടെ ഭാവികാല സകർമക രൂപം ഇവിടെ ഒരിടത്ത് നിർത്തുക അഥവാ സ്ഥാനപ്പെടുത്തുക എന്നർഥം നൽകുന്നു. ഇടയൻ കൂട്ടങ്ങളെ രണ്ടുവശങ്ങളിലായി നിർത്തുന്ന ദൃശ്യത്തിന് ‘നിർത്തും’ സ്വാഭാവികമാണ്.
- source_word: πρόβατα
  choice: ചെമ്മരിയാടുകളെ
  rationale: πρόβατα എന്നത് ഇവിടെ കോലാടുകളിൽനിന്ന് വേർതിരിക്കപ്പെടുന്ന ചെമ്മരിയാടുകളെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ വ്യത്യാസം വ്യക്തമായി നിലനിർത്താൻ ‘ചെമ്മരിയാടുകൾ’ ഉപയോഗിച്ചു.
- source_word: ἐκ δεξιῶν αὐτοῦ
  choice: തന്റെ വലത്തുവശത്ത്
  rationale: ἐκ + ജനിറ്റീവ് ഇവിടെ ഉറവിടമല്ല, ഒരാളോടുള്ള ആപേക്ഷിക സ്ഥാനം സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. അതിനാൽ സ്വാഭാവികമായ മലയാളത്തിൽ ‘തന്റെ വലത്തുവശത്ത്’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: ἐρίφια
  choice: കോലാട്ടിൻകുട്ടികളെ
  rationale: ἐρίφια എന്നത് സാധാരണയായി ഇളം കോലാടുകളെയോ കോലാട്ടിൻകുട്ടികളെയോ സൂചിപ്പിക്കുന്നു. മൂലപദത്തിലെ പ്രായസൂചന നഷ്ടപ്പെടാതിരിക്കാനായി ‘കോലാട്ടിൻകുട്ടികൾ’ തിരഞ്ഞെടുത്തു.
- source_word: ἐξ εὐωνύμων
  choice: ഇടത്തുവശത്ത്
  rationale: ഈ പ്രയോഗം സ്ഥാനപരമായി ‘ഇടത്തുവശത്ത്’ എന്നാണ് അർഥമാക്കുന്നത്. αὐτοῦ രണ്ടാമതും ആവർത്തിക്കാത്തതിനാൽ മലയാളത്തിലും ‘തന്റെ’ ആവർത്തിക്കാതെ അർഥം വ്യക്തമായി നിലനിർത്തി.
- source_word: μὲν ... δὲ
  choice: …ഉം …ഉം
  rationale: μὲν ... δὲ രണ്ടു കൂട്ടങ്ങളുടെ വിരുദ്ധമായ സ്ഥാനനിർണ്ണയം അടയാളപ്പെടുത്തുന്നു. മലയാളത്തിൽ സമാന്തരമായ ‘വലത്തുവശത്തും … ഇടത്തുവശത്തും’ എന്ന ഘടന ഈ വ്യത്യാസം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: വലത്–ഇടത് സ്ഥാനങ്ങളുടെ പ്രതീകാത്മക അർഥം പരിഭാഷയിൽ വിശദീകരിക്കണമോ
  choice: സ്ഥലപരമായ അർഥം മാത്രം—‘തന്റെ വലത്തുവശത്തും … ഇടത്തുവശത്തും’—നൽകി.
  alternative: ‘ബഹുമാനസ്ഥാനത്ത്’, ‘അനിഷ്ടസ്ഥാനത്ത്’ എന്നിങ്ങനെ മൂല്യനിർണയപരമായി വികസിപ്പിക്കുക.
  rationale: വിധിന്യായസന്ദർഭത്തിൽ വലതും ഇടതും പ്രതീകാത്മക പ്രാധാന്യം വഹിക്കുന്നുണ്ടെങ്കിലും ഈ വാക്യം നേരിട്ട് പറയുന്നത് ഇരുകൂട്ടങ്ങളുടെയും സ്ഥാനനിർണ്ണയമാണ്. പ്രതീകാർഥം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നത് ഗ്രീക്കിനെക്കാൾ അധികം വ്യാഖ്യാനം ഇറക്കുമതി ചെയ്യും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. മൂലത്തിലെ സമാന്തര ഘടന നിലനിർത്തി; ‘കോലാട്ടിൻകുട്ടികൾ’ എന്ന പദം ἐρίφιαയുടെ പ്രായസൂചന സംരക്ഷിക്കുന്നു. വിശദീകരണം ആവശ്യമുള്ള നിർബന്ധിത പാഠഭേദമോ അസ്പഷ്ടതയോ ഇല്ലാത്തതിനാൽ അടിക്കുറിപ്പ് നൽകിയിട്ടില്ല.
