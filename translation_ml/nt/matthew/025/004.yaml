id: MAT.25.4
reference: Matthew 25:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: αἱ δὲ φρόνιμοι ἔλαβον ἔλαιον ἐν τοῖς ⸀ἀγγείοις μετὰ τῶν λαμπάδων ⸀ἑαυτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/004.yaml
  text: But the wise took oil in their containers with their lamps[a].
translation:
  language: ml
  text: എന്നാൽ വിവേകമുള്ളവർ തങ്ങളുടെ വിളക്കുകൾ[a] കൂടെ പാത്രങ്ങളിൽ എണ്ണയും എടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘വിളക്കുകൾ’ എന്നതിന് ‘പന്തങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം (ഗ്രീക്ക്: λαμπάδας); സന്ദർഭം അനുസരിച്ച് ഈ പദം വിളക്കിനെയോ പന്തത്തെയോ സൂചിപ്പിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φρόνιμοι
  choice: വിവേകമുള്ളവർ
  rationale: പ്രായോഗിക ജ്ഞാനവും സൂക്ഷ്മബുദ്ധിയും സൂചിപ്പിക്കുന്ന പദമാണിത്; സന്ദർഭത്തിലെ μωραί എന്ന വിരുദ്ധപദത്തോടുള്ള വ്യത്യാസവും സ്വാഭാവികമായി നിലനിർത്തുന്നു. 'ഒരുങ്ങിയവർ' എന്നു പരിഭാഷപ്പെടുത്തുന്നത് വ്യാഖ്യാനം പദത്തിലേക്ക് ചേർക്കും.
- source_word: ἔλαβον
  choice: എടുത്തു
  rationale: ഈ ആഖ്യാനസന്ദർഭത്തിൽ കൂടെ കൊണ്ടുപോയി എന്ന അർഥത്തിലാണ്; 'ലഭിച്ചു' എന്ന അർഥം ഇവിടെ യോജിക്കുന്നില്ല.
- source_word: ἔλαιον
  choice: എണ്ണ
  rationale: പദത്തിന്റെ സാധാരണ അർഥം എണ്ണ എന്നാണ്; ഒലിവെണ്ണ എന്നു വ്യക്തമാക്കുന്നത് മൂലപാഠത്തിൽ ആവശ്യപ്പെടാത്ത പ്രത്യേകത ചേർക്കും.
- source_word: ἀγγείοις
  choice: പാത്രങ്ങളിൽ
  rationale: രൂപമോ വസ്തുവോ നിർണ്ണയിക്കാത്ത പൊതുവായ സംഭരണപാത്രങ്ങളെയാണ് പദം സൂചിപ്പിക്കുന്നത്; അതിനാൽ കുപ്പികൾ, ഭരണികൾ തുടങ്ങിയ കൂടുതൽ നിർദിഷ്ട പദങ്ങൾ ഒഴിവാക്കി.
- source_word: λαμπάδων
  choice: വിളക്കുകൾ
  rationale: λαμπάς എന്നത് സന്ദർഭാനുസരണം വിളക്കിനെയോ പന്തത്തെയോ സൂചിപ്പിക്കാം. എണ്ണ കൂടെ കരുതുന്ന ഈ സന്ദർഭത്തിൽ 'വിളക്കുകൾ' സ്വാഭാവികമാണ്; എന്നാൽ 'പന്തങ്ങൾ' എന്ന സാധ്യതയും യഥാർഥമാണ്.
- source_word: ἑαυτῶν
  choice: തങ്ങളുടെ
  rationale: പ്രതിഫലക സർവനാമത്തിന്റെ സ്വയംബന്ധിത ഉടമസ്ഥത മലയാളത്തിൽ 'തങ്ങളുടെ' എന്നതിലൂടെ വ്യക്തമായി പ്രകടമാകുന്നു.
- source_word: μετὰ τῶν λαμπάδων ἑαυτῶν
  choice: തങ്ങളുടെ വിളക്കുകളോടൊപ്പം
  rationale: μετά + genitive സൂചിപ്പിക്കുന്ന സഹവർത്തിത്വം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ δέ എന്ന വിരോധസൂചന 'എന്നാൽ' എന്നും, എണ്ണ അധികമായി എടുത്തുവെന്ന ആശയം മലയാളത്തിലെ സ്വാഭാവികമായ 'എണ്ണയും' എന്നും പ്രകടിപ്പിച്ചു. ഈ ഒറ്റ വാക്യത്തിൽ 'വിളക്കുകൾ/പന്തങ്ങൾ' എന്ന വ്യത്യാസം അർഥഗ്രഹണത്തെ ഗണ്യമായി ബാധിക്കാത്തതിനാൽ മുഖ്യപാഠത്തിൽ കൂടുതൽ സ്വാഭാവികമായ 'വിളക്കുകൾ' ഉപയോഗിച്ചു.
