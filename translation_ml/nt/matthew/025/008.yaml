translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ സംഭാഷണശൈലി. ‘ബുദ്ധിയില്ലാത്തവർ/വിവേകമുള്ളവർ’ എന്ന കൂട്ടുകെട്ട് മൂലപാഠത്തിലെ μωραὶ/φρονίμοις വൈരുധ്യം നിലനിർത്തുന്നു. ഉദ്ദേശപൂർവം ഉപമയുടെ അർഥം വിശദീകരിച്ചോ ദൈവശാസ്ത്രപരമായി നിർണയിച്ചോിട്ടില്ല.
