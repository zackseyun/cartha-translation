id: MAT.25.8
reference: Matthew 25:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: αἱ δὲ μωραὶ ταῖς φρονίμοις εἶπαν· Δότε ἡμῖν ἐκ τοῦ ἐλαίου ὑμῶν, ὅτι αἱ λαμπάδες ἡμῶν σβέννυνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/008.yaml
  text: But the foolish said to the wise[a], ‘Give us some of your oil, because our lamps are going out.’
translation:
  language: ml
  text: 'എന്നാൽ ബുദ്ധിയില്ലാത്തവർ വിവേകമുള്ളവരോടു പറഞ്ഞു: “നിങ്ങളുടെ എണ്ണയിൽ കുറച്ച് ഞങ്ങൾക്കു തരൂ; ഞങ്ങളുടെ വിളക്കുകൾ[a] അണഞ്ഞുപോകുകയാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “പന്തങ്ങൾ.” ഗ്രീക്ക് പദമായ λαμπάδες കൈയിൽ കൊണ്ടുപോകാവുന്ന, കത്തുന്ന ഒരു പ്രകാശസ്രോതസ്സിനെ സൂചിപ്പിക്കാം; രംഗം എങ്ങനെ മനസ്സിലാക്കുന്നു എന്നതനുസരിച്ച് വിവർത്തകർ “വിളക്കുകൾ” എന്നോ “പന്തങ്ങൾ” എന്നോ പരിഭാഷപ്പെടുത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: μωραὶ
  choice: ബുദ്ധിയില്ലാത്തവർ
  rationale: കന്യകമാരുടെ ഒരു വിഭാഗത്തെ സൂചിപ്പിക്കുന്ന നാമവൽക്കരിച്ച വിശേഷണം. φρονίμοις എന്ന പദത്തോടുള്ള വിവേകപരമായ വൈരുധ്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: φρονίμοις
  choice: വിവേകമുള്ളവർ
  rationale: ഇവിടെ പ്രായോഗിക വിവേകവും മുൻകരുതലും സൂചിപ്പിക്കുന്നു; എതിർവിഭാഗത്തോടുള്ള ആശയവ്യത്യാസം അമിതമായി വ്യാഖ്യാനിക്കാതെ വ്യക്തമാക്കുന്നു.
- source_word: Δότε
  choice: തരൂ
  rationale: δίδωμι എന്ന ക്രിയയുടെ ബഹുവചന ആജ്ഞാരൂപം; സന്ദർഭത്തിലെ നേരിട്ടുള്ള അഭ്യർഥന മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐκ τοῦ ἐλαίου ὑμῶν
  choice: നിങ്ങളുടെ എണ്ണയിൽ കുറച്ച്
  rationale: ἐκ + ഷഷ്ഠി ഇവിടെ ഒരു ശേഖരത്തിൽനിന്നുള്ള അംശത്തെ സൂചിപ്പിക്കുന്നു; ‘കുറച്ച്’ എന്നത് ഈ ഭാഗിക അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: λαμπάδες
  choice: വിളക്കുകൾ
  rationale: λαμπάς കൈയിൽ കൊണ്ടുപോകാവുന്ന എണ്ണ ഉപയോഗിച്ചുള്ള ദീപത്തെയോ പന്തത്തെയോ സൂചിപ്പിക്കാം. മുഖ്യപാഠത്തിൽ പരിചിതവും സന്ദർഭോചിതവുമായ ‘വിളക്കുകൾ’ സ്വീകരിച്ച് മറ്റർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: σβέννυνται
  choice: അണഞ്ഞുപോകുകയാണ്
  rationale: വർത്തമാനകാല രൂപം തീ അണയുന്ന പ്രക്രിയ പുരോഗമിക്കുകയാണെന്ന ആശയം നൽകുന്നു; മലയാളത്തിൽ അത് സ്വാഭാവികമായി പകർത്തുന്നു.
- source_word: ὅτι
  choice: 'കാരണം സൂചിപ്പിക്കുന്ന വാക്യബന്ധം: ‘; ...ുകയാണ്’'
  rationale: അഭ്യർഥനയുടെ കാരണം തുടർന്നുള്ള ഉപവാക്യം വ്യക്തമാക്കുന്നു; നേരിട്ടുള്ള സംഭാഷണത്തിൽ സ്വാഭാവികമായ മലയാള വാക്യക്രമം ഉപയോഗിച്ചു.
