id: MAT.25.29
reference: Matthew 25:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τῷ γὰρ ἔχοντι παντὶ δοθήσεται καὶ περισσευθήσεται· ⸂τοῦ δὲ⸃ μὴ ἔχοντος καὶ ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/029.yaml
  text: For to everyone who has[a], more will be given, and he will have an abundance; but from the one who does not have, even what he has will be taken away from him.
translation:
  language: ml
  text: എന്തെന്നാൽ, ഉള്ള ഏവനും കൊടുക്കപ്പെടുകയും അവന് സമൃദ്ധിയുണ്ടാകുകയും ചെയ്യും; എന്നാൽ, ഇല്ലാത്തവനിൽനിന്ന് അവനുള്ളതുപോലും എടുത്തുകളയപ്പെടും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῷ ... ἔχοντι παντί
  choice: ഉള്ള ഏവനും
  rationale: ദാതൃവിഭക്തിയിലുള്ള ആർട്ടിക്കുലർ പാർട്ടിസിപ്പിളും παντίയും ചേർന്ന് പൊതുവായ, വിതരണാത്മകമായ അർഥം നൽകുന്നു. എന്താണ് ‘ഉള്ളത്’ എന്നു മൂലവാക്യം ഇവിടെ വീണ്ടും വ്യക്തമാക്കാത്തതിനാൽ ആ തുറന്ന നില മലയാളത്തിലും നിലനിർത്തുന്നു.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിന് വിശദീകരണപരമായ അടിസ്ഥാനം നൽകുന്ന γάρ എന്ന ബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: δοθήσεται
  choice: കൊടുക്കപ്പെടും
  rationale: δίδωμι എന്ന ക്രിയയുടെ ഭാവികാല കർമണിപ്രയോഗം അതേ കർമണിരൂപത്തിൽ നിലനിർത്തുന്നു; കൊടുക്കുന്നത് ആരെന്നത് മൂലപാഠം വെളിപ്പെടുത്തുന്നില്ല.
- source_word: περισσευθήσεται
  choice: അവന് സമൃദ്ധിയുണ്ടാകും
  rationale: περισσεύω ഇവിടെ സൂചിപ്പിക്കുന്ന ഫലമായ സമൃദ്ധിയെയോ കവിഞ്ഞ അളവിനെയോ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു. രൂപപരമായ കർമണ/അകർമക സാധ്യതയെ നിർബന്ധമായി തീർപ്പാക്കാതെ ഫലാവസ്ഥ മുന്നിൽവയ്ക്കുന്നു.
- source_word: τοῦ δὲ μὴ ἔχοντος
  choice: എന്നാൽ ഇല്ലാത്തവനിൽനിന്ന്
  rationale: വിരുദ്ധത സൂചിപ്പിക്കുന്ന δέയും ഏകവചന പ്രതിനിധിസ്വഭാവമുള്ള substantival participle-ഉം നിലനിർത്തുന്നു.
- source_word: καὶ ὃ ἔχει
  choice: അവനുള്ളതുപോലും
  rationale: καί ഇവിടെ ഊന്നൽ നൽകുന്ന ‘പോലും’ എന്ന അർഥത്തിലാണ്; ഇല്ലാത്തവൻ എന്നു പറഞ്ഞവന്റെ കൈവശമുള്ളതും നഷ്ടപ്പെടുമെന്ന വിരോധാഭാസം ഇത് പ്രകടമാക്കുന്നു.
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: അവനിൽനിന്ന് ... എടുത്തുകളയപ്പെടും
  rationale: αἴρωയുടെ ഭാവികാല കർമണിപ്രയോഗവും ἀπό സൂചിപ്പിക്കുന്ന വേർപാടും വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: പൊതുവായ അർഥത്തിലുള്ള പുല്ലിംഗ ഏകവചന പങ്കാളിത്തരൂപങ്ങൾ
  choice: ‘ഏവനും / അവന് / ഇല്ലാത്തവൻ / അവനിൽനിന്ന്’ എന്ന ഏകവചന പ്രതിനിധിരൂപം
  alternative: ബഹുവചനമായ ‘ഉള്ളവർ / അവർ’ എന്ന രൂപം
  rationale: ഗ്രീക്കിലെ വ്യാകരണപരമായി പുല്ലിംഗ ഏകവചനത്തിലുള്ള പൊതുവായ പ്രതിനിധിഘടനയെ ബഹുവചനമാക്കി നിരപ്പാക്കാതെ മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- issue: കൊടുക്കുന്നതും എടുത്തുകളയുന്നതും ആരെന്ന ചോദ്യം
  choice: കർമണിപ്രയോഗം നിലനിർത്തുക
  alternative: ദൈവത്തെ വ്യക്തമായ കർത്താവായി ചേർക്കുക
  rationale: സന്ദർഭത്തിൽ ദൈവിക പ്രവർത്തനം സൂചിപ്പിക്കപ്പെടാമെങ്കിലും ഈ വാക്യത്തിലെ മൂലപാഠം കർത്താവിനെ തുറന്നുപറയുന്നില്ല; അതിനാൽ വ്യാഖ്യാനം പാഠത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഉപമയുടെ ചുരുക്കവും വിരോധാഭാസവും കർമണിപ്രയോഗങ്ങളും സംരക്ഷിച്ചിരിക്കുന്നു; മൂലത്തിൽ വ്യക്തമല്ലാത്ത കർമമോ പ്രവർത്തകർത്താവോ ചേർത്തിട്ടില്ല.
