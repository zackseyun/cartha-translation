id: MAT.25.10
reference: Matthew 25:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπερχομένων δὲ αὐτῶν ἀγοράσαι ἦλθεν ὁ νυμφίος, καὶ αἱ ἕτοιμοι εἰσῆλθον μετ’ αὐτοῦ εἰς τοὺς γάμους, καὶ ἐκλείσθη ἡ θύρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/010.yaml
  text: But while they were going away to buy[a], the bridegroom came, and those who were ready went in with him to the wedding feast, and the door was shut.
translation:
  language: ml
  text: എന്നാൽ അവർ വാങ്ങാൻ പോയിരിക്കുമ്പോൾ മണവാളൻ വന്നു. ഒരുങ്ങിയിരുന്നവർ അവനോടൊപ്പം വിവാഹവിരുന്നിന്[a] അകത്തു കയറി; വാതിൽ അടച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വിവാഹാഘോഷത്തിന്’ അല്ലെങ്കിൽ ലളിതമായി ‘വിവാഹത്തിന്.’ ഗ്രീക്കിലെ ബഹുവചനം വിവാഹാഘോഷത്തെ മുഴുവനായും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπερχομένων δὲ αὐτῶν ἀγοράσαι
  choice: എന്നാൽ അവർ വാങ്ങാൻ പോയിരിക്കുമ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് ഒരേ സമയത്ത് നടക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ἀγοράσαι ഉദ്ദേശ്യം വ്യക്തമാക്കുന്ന ഇൻഫിനിറ്റീവാണ്. മുൻവാക്യത്തിൽ എണ്ണയാണ് വാങ്ങേണ്ടതെന്ന് വ്യക്തമാണെങ്കിലും ഈ വാക്യത്തിൽ കർമ്മം പറഞ്ഞിട്ടില്ലാത്തതിനാൽ അതു ചേർത്തിട്ടില്ല.
- source_word: ὁ νυμφίος
  choice: മണവാളൻ
  rationale: വിവാഹസന്ദർഭത്തിലെ νυμφίος എന്ന പദത്തിന്റെ സ്വാഭാവികവും പരമ്പരാഗതവുമായ മലയാളരൂപം; ഉപമയുടെ ദൃശ്യഭാവം നിലനിർത്തുന്നു.
- source_word: αἱ ἕτοιμοι
  choice: ഒരുങ്ങിയിരുന്നവർ
  rationale: സ്ത്രീലിംഗ ബഹുവചന വിശേഷണം നാമപദമായി ഉപയോഗിച്ചിരിക്കുന്നു; സന്ദർഭത്തിൽ ഒരുങ്ങിയിരുന്ന കന്യകമാരെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ലിംഗസൂചന അനാവശ്യമായി ആവർത്തിക്കാതെ അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: εἰσῆλθον μετ’ αὐτοῦ
  choice: അവനോടൊപ്പം ... അകത്തു കയറി
  rationale: കഥയിലെ ചലനവും കൂട്ടായ പ്രവേശനവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: εἰς τοὺς γάμους
  choice: വിവാഹവിരുന്നിന്
  rationale: ഗ്രീക്കിൽ ബഹുവചനമായ γάμοι ഇവിടെ വിവാഹാഘോഷത്തെയോ അതിലെ വിരുന്നിനെയോ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ 'വിവാഹവിരുന്ന്' വ്യക്തവും സ്വാഭാവികവുമാണ്; വിശാലമായ അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἐκλείσθη ἡ θύρα
  choice: വാതിൽ അടച്ചു
  rationale: ഗ്രീക്കിലെ ഏജന്റ് പറയാത്ത ഏഓറിസ്റ്റ് പാസീവിനെ മലയാളത്തിൽ സ്വാഭാവികമായ ഏജന്റ്-അവ്യക്ത പ്രയോഗമായി നൽകുന്നു. ആരാണ് അടച്ചതെന്ന് ചേർക്കാതെ സംഭവത്തിന്റെ നിർണായകത നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഉപമയിലെ വിവാഹദൃശ്യങ്ങളുടെ പരിഭാഷ
  choice: '''മണവാളൻ'', ''വിവാഹവിരുന്ന്'' എന്നീ സാധാരണ കഥാഭാഷയിലെ രൂപങ്ങൾ നിലനിർത്തുക'
  alternative: '''വരൻ'' ഉപയോഗിക്കുക, അല്ലെങ്കിൽ ക്രിസ്തുവിനെ സൂചിപ്പിക്കുന്നതായി മുഖ്യവാക്യത്തിൽ വിശദീകരിക്കുക'
  rationale: മുഖ്യവാക്യം ഉപമയിലെ ദൃശ്യത്തെ അതിന്റെ കഥാരൂപത്തിൽ തന്നെ അവതരിപ്പിക്കുന്നു. ക്രിസ്തുശാസ്ത്രപരമായ വ്യാഖ്യാനം പരിഭാഷയിൽ തുറന്നുചേർക്കാതെ സന്ദർഭത്തിൽനിന്ന് ഉയർന്നുവരാൻ അനുവദിക്കുന്നു.
- issue: വാതിൽ അടച്ച പ്രവർത്തിയുടെ കർത്താവ്
  choice: കർത്താവിനെ വ്യക്തമാക്കാതെ 'വാതിൽ അടച്ചു' എന്നു നൽകുക
  alternative: '''വാതിൽ അടയ്ക്കപ്പെട്ടു'' എന്ന ഔപചാരിക പാസീവ് ഉപയോഗിക്കുക, അല്ലെങ്കിൽ ആരോ വാതിൽ അടച്ചതായി വ്യക്തമാക്കുക'
  rationale: മൂലപാഠം പ്രവർത്തിയുടെ കർത്താവിനെ പറയുന്നില്ല. മലയാളത്തിലെ സ്വാഭാവികമായ കർത്തൃരഹിത പ്രയോഗം ഈ അവ്യക്തതയും രംഗത്തിന്റെ അന്തിമത്വവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കഥാഭാഷയാണ് ഉപയോഗിച്ചത്. ഇംഗ്ലീഷ് ഉപദേശപാളിയിൽ അടിക്കുറിപ്പ് ചിഹ്നം ‘വാങ്ങാൻ’ എന്നതിനുശേഷം നൽകിയിരുന്നെങ്കിലും അടിക്കുറിപ്പിന്റെ ഉള്ളടക്കം εἰς τοὺς γάμους എന്ന പ്രയോഗത്തെക്കുറിച്ചായതിനാൽ മലയാളത്തിൽ ചിഹ്നം ‘വിവാഹവിരുന്നിന്’ എന്നതിനോടു ചേർത്തു.
