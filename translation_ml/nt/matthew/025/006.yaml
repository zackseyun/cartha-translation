id: MAT.25.6
reference: Matthew 25:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μέσης δὲ νυκτὸς κραυγὴ γέγονεν· Ἰδοὺ ὁ ⸀νυμφίος, ἐξέρχεσθε εἰς ἀπάντησιν ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/006.yaml
  text: 'But at midnight a cry rang out: ‘Look[b][a], the bridegroom! Come out to meet him.’'
translation:
  language: ml
  text: 'എന്നാൽ അർധരാത്രിയിൽ ഒരു വിളി[a] മുഴങ്ങി: “ഇതാ[b], മണവാളൻ! അവനെ എതിരേൽക്കാൻ പുറത്തേക്കു വരൂ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഒരു ആർപ്പുവിളി ഉണ്ടായി.”'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: “നോക്കൂ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μέσης δὲ νυκτός
  choice: എന്നാൽ അർധരാത്രിയിൽ
  rationale: ജനിറ്റീവ് സമയപ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ ‘അർധരാത്രിയിൽ’ എന്നാണ്; δέ ഇവിടെ നേരിയ വൈരുധ്യമുള്ള ആഖ്യാനമാറ്റമായി ‘എന്നാൽ’ എന്നു നൽകി.
- source_word: κραυγὴ γέγονεν
  choice: ഒരു വിളി മുഴങ്ങി
  rationale: γίνομαιയുടെ പെർഫെക്റ്റ് രൂപം ഇവിടെ പെട്ടെന്ന് സംഭവിച്ച പ്രഖ്യാപനത്തെ സൂചിപ്പിക്കുന്നു; ‘വിളി മുഴങ്ങി’ അതിന്റെ ശ്രാവ്യവും അപ്രതീക്ഷിതവുമായ ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: Ἰδού
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ദെയ്ക്റ്റിക് പ്രയോഗമായ ἰδούയ്ക്ക് ആധുനികവും മാന്യവുമായ സ്വാഭാവിക മലയാളസമാനതയാണ് ‘ഇതാ’.
- source_word: ὁ νυμφίος
  choice: മണവാളൻ
  rationale: വിവാഹസന്ദർഭത്തിലെ bridegroom എന്ന പ്രത്യേക അർഥം സൂക്ഷിക്കുന്ന, സാധാരണ മലയാളവായനക്കാർക്ക് പരിചിതമായ പദമാണ് ‘മണവാളൻ’.
- source_word: ἐξέρχεσθε
  choice: പുറത്തേക്കു വരൂ
  rationale: അകത്തുള്ളവരോടുള്ള നേരിട്ടുള്ള ആഹ്വാനത്തിൽ ‘പുറത്തേക്കു വരൂ’ സ്വാഭാവികമാണ്; ക്രിയയുടെ ആജ്ഞാർഥവും പുറത്തേക്കുള്ള ചലനവും നിലനിർത്തുന്നു.
- source_word: εἰς ἀπάντησιν αὐτοῦ
  choice: അവനെ എതിരേൽക്കാൻ
  rationale: വരുന്ന ഒരാളെ സ്വീകരിക്കാനായി ചെന്നുകാണുക എന്ന വിവാഹഘോഷയാത്രാസന്ദർഭത്തിലെ ആശയം ‘എതിരേൽക്കാൻ’ കൃത്യവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
theological_decisions:
- issue: νυμφίος എന്ന ഉപമാപാത്രത്തിന്റെ ക്രിസ്തുവിനെ സൂചിപ്പിക്കുന്ന അർഥം
  choice: ഉപമയിലെ സാഹിത്യനിലയിൽ ‘മണവാളൻ’ എന്നു മാത്രം നൽകുക
  alternative: ‘മണവാളൻ’ എന്നത് പ്രത്യേക ദൈവശാസ്ത്രപരമായ ബഹുമാനസൂചനയോടെ അവതരിപ്പിക്കുക
  rationale: വിശാലമായ മത്തായി സന്ദർഭത്തിൽ മണവാളൻ യേശുവിനെ പ്രതിനിധീകരിക്കുന്നുവെങ്കിലും, ഈ വാക്യം ഉപമയിലെ കഥാപാത്രമായാണ് അവനെ അവതരിപ്പിക്കുന്നത്. വിവർത്തനം ആ തിരിച്ചറിയൽ തുറന്നുവ്യാഖ്യാനിക്കാതെ ഉപമയുടെ സാഹിത്യരൂപം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘മണവാളൻ’, ‘എതിരേൽക്കാൻ’ എന്നിവ വിവാഹസന്ദർഭം വ്യക്തമായി നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
