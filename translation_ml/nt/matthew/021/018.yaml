source:
  edition: SBLGNT
  text: ⸀Πρωῒ δὲ ⸀ἐπανάγων εἰς τὴν πόλιν ἐπείνασεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/018.yaml
  text: Early in the morning, as he was returning to the city, he became hungry.
translation:
  language: ml
  text: അതിരാവിലെ, അവൻ നഗരത്തിലേക്കു മടങ്ങിപ്പോകുമ്പോൾ അവനു വിശന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρωῒ
  choice: അതിരാവിലെ
  rationale: ദിവസത്തിന്റെ ആദ്യഭാഗത്തെ സൂചിപ്പിക്കുന്ന ക്രിയാവിശേഷണം. ‘അതിരാവിലെ’ സമയപരമായ ഊന്നൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയില്ല
  rationale: ഇവിടെ ശക്തമായ വൈരുധ്യമല്ല, മൃദുവായ ആഖ്യാനബന്ധമാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിലെ വാക്യക്രമവും സന്ദർഭവും ആ ബന്ധം സ്വാഭാവികമായി വഹിക്കുന്നതിനാൽ ‘എന്നാൽ’ പോലുള്ള പദം ചേർത്താൽ അനാവശ്യമായ വൈരുധ്യം ഉണ്ടാകും.
- source_word: ἐπανάγων
  choice: മടങ്ങിപ്പോകുമ്പോൾ
  rationale: പ്രധാനക്രിയയോടൊപ്പം നടക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന വർത്തമാനകാല കർത്തൃവാചക കൃദന്തത്തിന്റെ സമകാലികത ‘-ുമ്പോൾ’ രൂപം വ്യക്തമാക്കുന്നു.
- source_word: εἰς τὴν πόλιν
  choice: നഗരത്തിലേക്കു
  rationale: εἰς ചലനത്തിന്റെ ലക്ഷ്യദിശയെ സൂചിപ്പിക്കുന്നു. ‘നഗരത്തിലേക്കു’ എത്തിച്ചേർന്നുവെന്നത് മുൻകൂട്ടി പ്രസ്താവിക്കാതെ നഗരത്തെ ലക്ഷ്യമാക്കിയുള്ള മടക്കയാത്ര വ്യക്തമാക്കുന്നു.
- source_word: ἐπείνασεν
  choice: അവനു വിശന്നു
  rationale: വിശപ്പ് അനുഭവപ്പെട്ട സംഭവത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്ന രൂപം. ഗ്രീക്കിലെ സംഭവാത്മകമായ ഭൂതകാലബലം നിലനിർത്തുന്നു; ‘വിശപ്പുള്ളവനായി’ എന്ന കൃത്രിമരൂപം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ വിശപ്പിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ സൂചന
  choice: യഥാർഥമായ വിശപ്പിന്റെ അനുഭവമായി പ്രസ്താവനയെ നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: വിശപ്പിനെ രൂപകമായോ വെറും പ്രത്യക്ഷാനുഭവമായോ വിശദീകരിക്കുക.
  rationale: ആഖ്യാനം യേശുവിന്റെ യഥാർഥ മാനുഷിക അനുഭവം ലളിതമായി രേഖപ്പെടുത്തുന്നു. വ്യാഖ്യാനപരമായ കൂട്ടിച്ചേർക്കലുകളില്ലാത്ത നേരിട്ടുള്ള പരിഭാഷ പാഠത്തിന്റെ സാക്ഷ്യം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ‘പട്ടണം’ എന്നതിനെക്കാൾ സന്ദർഭത്തിന് യോജിച്ച പൊതുവായ ‘നഗരം’ സ്വീകരിച്ചു; അനാവശ്യമായ ആഖ്യാനബന്ധകപദം ഒഴിവാക്കി.
