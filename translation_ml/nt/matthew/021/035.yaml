id: MAT.21.35
reference: Matthew 21:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ λαβόντες οἱ γεωργοὶ τοὺς δούλους αὐτοῦ ὃν μὲν ἔδειραν, ὃν δὲ ἀπέκτειναν, ὃν δὲ ἐλιθοβόλησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/035.yaml
  text: And the tenant farmers took his servants; one they beat[a], another they killed, and another they stoned.
translation:
  language: ml
  text: പാട്ടക്കൃഷിക്കാർ അവന്റെ അടിമകളെ[a] പിടികൂടി; ഒരാളെ അടിച്ചു, മറ്റൊരാളെ കൊന്നു, വേറൊരാളെ കല്ലെറിഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സേവകരെ.’ ഗ്രീക്കിലെ δοῦλοι എന്ന പദത്തിന് സന്ദർഭമനുസരിച്ച് ‘അടിമകൾ’ എന്നും ‘സേവകർ’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: γεωργοὶ
  choice: പാട്ടക്കർഷകർ
  rationale: ഉടമയുടെ ഭൂമി പാട്ടത്തിനെടുത്ത് കൃഷിചെയ്യുന്നവരെയാണ് ഉപമയുടെ സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്; കൃഷിയും പാട്ടബന്ധവും ഈ പദം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: λαβόντες
  choice: പിടികൂടി
  rationale: അടിക്കുക, കൊല്ലുക, കല്ലെറിയുക എന്നീ തുടർപ്രവൃത്തികളുടെ അക്രമാസക്തമായ സന്ദർഭത്തിൽ ‘പിടികൂടി’ എന്നത് λαμβάνωയുടെ അർഥം അമിതമാക്കാതെ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: δούλους
  choice: അടിമകളെ
  rationale: δοῦλος സൂചിപ്പിക്കുന്ന ഉടമസ്ഥാധീനതയും ബന്ധിതസ്ഥാനവും ‘അടിമകൾ’ നേരിട്ട് നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അവർ ഉടമയുടെ അധികാരത്തിൽ അയക്കപ്പെട്ട പ്രതിനിധികളുമാണ്.
- source_word: ἔδειραν
  choice: അടിച്ചു
  rationale: മർദനത്തെ സ്വാഭാവികവും പൊതുവുമായ ഭാഷയിൽ അറിയിക്കുന്നു; ചാട്ടവാറുകൊണ്ടുള്ള പ്രഹരം പോലുള്ള വ്യക്തമാക്കാത്ത രീതി ചേർക്കുന്നില്ല.
- source_word: ἀπέκτειναν
  choice: കൊന്നു
  rationale: ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നൽകുന്നു; ‘കൊലപ്പെടുത്തി’ എന്നതിലൂടെ അധിക നിയമപരമോ നൈതികമോ ആയ സൂക്ഷ്മഭാവം ചേർക്കുന്നില്ല.
- source_word: ἐλιθοβόλησαν
  choice: കല്ലെറിഞ്ഞു
  rationale: കല്ലെറിഞ്ഞുള്ള ആക്രമണം കൃത്യമായി നൽകുന്നു; ഈ മൂന്നാമത്തെ ആളും മരിച്ചുവെന്ന് ഗ്രീക്ക് വാചകം പ്രത്യേകം പറയാത്തതിനാൽ ‘കല്ലെറിഞ്ഞു കൊന്നു’ എന്ന് വികസിപ്പിക്കുന്നില്ല.
- source_word: ὃν μὲν ... ὃν δὲ ... ὃν δὲ
  choice: ഒരാളെ ... മറ്റൊരാളെ ... വേറൊരാളെ
  rationale: വ്യത്യസ്ത അടിമകൾക്ക് വ്യത്യസ്തമായി സംഭവിച്ചതെന്ന വിതരണഘടന സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ഉപമയിലെ δοῦλος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: അടിമകൾ
  alternative: സേവകർ
  rationale: ഉടമയുടെ അധികാരത്തിൻ കീഴിലുള്ള അവരുടെ ബന്ധിതസ്ഥാനം മറച്ചുവയ്ക്കാതെ മൂലപദത്തിന്റെ സാമൂഹിക യാഥാർഥ്യം നിലനിർത്തുന്നു. അതേസമയം സന്ദർഭാനുസൃതമായി ‘സേവകർ’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പാട്ടക്കർഷകർ’ പാട്ടബന്ധവും കൃഷിപ്പണിയും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു; സമാന്തരമായ മൂന്ന് ക്രിയകളും മൂലവാക്യത്തിന്റെ വേഗവും തീവ്രതയും നിലനിർത്തുന്നു.
