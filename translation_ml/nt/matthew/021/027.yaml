id: MAT.21.27
reference: Matthew 21:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀποκριθέντες τῷ Ἰησοῦ εἶπαν· Οὐκ οἴδαμεν. ἔφη αὐτοῖς καὶ αὐτός· Οὐδὲ ἐγὼ λέγω ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/027.yaml
  text: And answering Jesus, they said, “We do not know.” He also said to them, “Neither will I tell you by what authority I do these things.”
translation:
  language: ml
  text: 'യേശുവിനോടു മറുപടി പറഞ്ഞ് അവർ പറഞ്ഞു: “ഞങ്ങൾക്കറിയില്ല.” അവനും അവരോടു പറഞ്ഞു: “ഞാനും, ഏത് അധികാരത്താൽ ഞാൻ ഇവ ചെയ്യുന്നു എന്ന് നിങ്ങളോടു പറയുന്നില്ല.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: ഉത്തരം പറഞ്ഞു
  rationale: മറുപടി അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് പങ്കാളിക്രിയയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പൂർണ്ണക്രിയയായി നൽകി.
- source_word: Οὐκ οἴδαμεν
  choice: ഞങ്ങൾക്ക് അറിയില്ല
  rationale: അറിവില്ലെന്ന അവരുടെ നേരിട്ടുള്ള പ്രസ്താവനയെ വ്യക്തമായും മാന്യമായും പുനരാവിഷ്കരിക്കുന്നു.
- source_word: ἔφη αὐτοῖς καὶ αὐτός
  choice: അപ്പോൾ അവനും അവരോട് പറഞ്ഞു
  rationale: καὶ αὐτός സൂചിപ്പിക്കുന്ന പ്രത്യുത്തരഭാവം ‘അവനും’ നിലനിർത്തുന്നു; ‘അപ്പോൾ’ സംഭാഷണത്തിന്റെ സ്വാഭാവിക ഒഴുക്ക് നൽകുന്നു.
- source_word: Οὐδὲ ἐγὼ λέγω ὑμῖν
  choice: എങ്കിൽ, ... നിങ്ങളോടും പറയുന്നില്ല
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാലവും പരസ്പരപ്രതികരണവും നിലനിർത്തി; ‘എങ്കിൽ’ അവരുടെ നിരാകരണത്തോടുള്ള യേശുവിന്റെ അനുബന്ധ പ്രതികരണം വ്യക്തമാക്കുന്നു.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: ഏത് അധികാരത്താൽ
  rationale: പ്രവൃത്തിയുടെ നിയമസാധുതയും അധികാരത്തിന്റെ ഉറവിടവും ചോദ്യം ചെയ്യുന്ന സന്ദർഭത്തിൽ ἐξουσίαയുടെ പ്രധാന അർഥം സംരക്ഷിക്കുന്നു.
- source_word: ταῦτα ποιῶ
  choice: ഞാൻ ഇതെല്ലാം ... ചെയ്യുന്നു
  rationale: ταῦτα എന്ന ബഹുവചനത്തിന്റെ കൂട്ടായ സൂചന ‘ഇതെല്ലാം’ വഴി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ποιῶയുടെ വർത്തമാനകാലം ‘ചെയ്യുന്നു’ ആയി നൽകി.
theological_decisions:
- issue: യേശുവിന്റെ മറുപടിയിലെ ἐξουσίαയുടെ സ്വഭാവം
  choice: അധികാരം
  alternative: അവകാശം; ശക്തി
  rationale: ഇവിടെ ചോദ്യം യേശുവിന്റെ പ്രവർത്തനശേഷിയെക്കാൾ അവ ചെയ്യാനുള്ള നിയമസാധുതയെയും അധികാരത്തിന്റെ ഉറവിടത്തെയും കുറിച്ചാണ്; ‘അധികാരം’ ആ ന്യായപരവും ദൈവശാസ്ത്രപരവുമായ വ്യാപ്തി ചുരുക്കാതെ സൂക്ഷിക്കുന്നു.
- issue: Οὐδὲ ἐγὼ λέγω എന്നതിന്റെ കാലവും പ്രതികരണഭാവവും
  choice: ഞാൻ ... പറയുന്നില്ല
  alternative: ഞാൻ ... പറയുകയുമില്ല
  rationale: മൂലപാഠത്തിലെ വർത്തമാനകാലം നിലനിർത്തുകയും യേശു വിവരം വെളിപ്പെടുത്താൻ വിസമ്മതിക്കുന്നതായി സ്വാഭാവികമായി അറിയിക്കുകയും ചെയ്യുന്നു; ഭാവികാലത്തിലേക്ക് നിർബന്ധമായി മാറ്റുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്ന മാന്യമായ സംഭാഷണശൈലി. മൂലത്തിലെ പ്രത്യുത്തരഘടനയും വർത്തമാനകാലവും കഴിയുന്നത്ര സ്വാഭാവികമായി സംരക്ഷിച്ചു.
