translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ കൃതന്തഘടനകൾ മലയാളത്തിന്റെ സ്വാഭാവിക വാക്യപ്രവാഹത്തിനനുസരിച്ച് പുനഃക്രമീകരിച്ചു; അർഥപരമായ അസ്പഷ്ടത പുതുതായി പരിഹരിച്ചിട്ടില്ല. ഇംഗ്ലീഷ് കരടിലെ [a] അടിക്കുറിപ്പ് മുഖ്യപാഠത്തിലെ സ്ഥാനത്തോടോ നൽകിയിരിക്കുന്ന പര്യായത്തോടോ പൊരുത്തപ്പെടാത്തതിനാൽ ഉൾപ്പെടുത്തിയിട്ടില്ല.
