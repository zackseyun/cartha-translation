id: MAT.21.20
reference: Matthew 21:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἰδόντες οἱ μαθηταὶ ἐθαύμασαν λέγοντες· Πῶς παραχρῆμα ἐξηράνθη ἡ συκῆ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/020.yaml
  text: And when the disciples saw it[a], they marveled, saying, “How did the fig tree wither immediately?”
translation:
  language: ml
  text: ശിഷ്യന്മാർ അതു കണ്ടപ്പോൾ ആശ്ചര്യപ്പെട്ടു ചോദിച്ചു, “അത്തിവൃക്ഷം എങ്ങനെ ഉടനെ ഉണങ്ങിപ്പോയി?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδόντες
  choice: കണ്ടപ്പോൾ
  rationale: ὁράω എന്ന ക്രിയയുടെ ഭൂതകാല കൃതന്തത്തെ സന്ദർഭാനുസൃതമായ കാലബന്ധമായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു. ‘അതു’ എന്ന കർമം മുൻസന്ദർഭത്തിലെ അത്തിവൃക്ഷത്തെയോ അതിനു സംഭവിച്ചതിനെയോ സൂചിപ്പിക്കുന്നു.
- source_word: ἐθαύμασαν
  choice: ആശ്ചര്യപ്പെട്ട്
  rationale: θαυμάζω ഇവിടെ വിസ്മയത്തെയും അത്ഭുതത്തെയും സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള സംസാരക്രിയയുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ കൃതന്തരൂപം ഉപയോഗിച്ചു.
- source_word: λέγοντες
  choice: എന്നു ചോദിച്ചു
  rationale: അക്ഷരാർഥത്തിൽ ‘പറഞ്ഞുകൊണ്ട്’ എന്നാണെങ്കിലും, പിന്നാലെയുള്ളത് നേരിട്ടുള്ള ചോദ്യമായതിനാൽ ആ സംസാരപ്രവൃത്തിയെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി ‘എന്നു ചോദിച്ചു’ എന്നു നൽകി.
- source_word: Πῶς
  choice: എങ്ങനെ
  rationale: സംഭവം നടന്ന വിധത്തെക്കുറിച്ചുള്ള ചോദ്യം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: παραχρῆμα
  choice: ഉടനെ
  rationale: ‘തൽക്ഷണം, ഉടൻതന്നെ’ എന്ന ശക്തമായ കാലസൂചന ചുരുക്കമായും നേരിട്ടും പകരുന്നു.
- source_word: ἐξηράνθη
  choice: ഉണങ്ങിപ്പോയി
  rationale: ξηραίνω എന്ന ക്രിയയുടെ അക്രിയാത്മകമായ അർഥം മലയാളത്തിൽ ഒരു വൃക്ഷം വാടിയുണങ്ങുന്നതിനെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്ന രൂപത്തിൽ നൽകുന്നു; ഗ്രീക്കിലെ രൂപപരമായ കർമ്മണിപ്രയോഗം മലയാളത്തിൽ നിർബന്ധിച്ച് പകർത്തിയിട്ടില്ല.
- source_word: ἡ συκῆ
  choice: അത്തിവൃക്ഷം
  rationale: συκῆ സൂചിപ്പിക്കുന്ന fig tree-യുടെ സാധാരണവും വ്യക്തവുമായ മലയാളപദം.
