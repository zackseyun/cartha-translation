id: MAT.21.42
reference: Matthew 21:42
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Λέγει αὐτοῖς ὁ Ἰησοῦς· Οὐδέποτε ἀνέγνωτε ἐν ταῖς γραφαῖς· Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας· παρὰ κυρίου ἐγένετο αὕτη, καὶ ἔστιν θαυμαστὴ ἐν ὀφθαλμοῖς ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/042.yaml
  text: 'Jesus said to them[a], “Have you never read in the Scriptures: ‘The stone that the builders rejected—this one has become the cornerstone. This came from the Lord[b], and it is marvelous in our eyes’?”'
translation:
  language: ml
  text: 'യേശു അവരോടു പറഞ്ഞു: “തിരുവെഴുത്തുകളിൽ നിങ്ങൾ ഒരിക്കലും വായിച്ചിട്ടില്ലേ? ‘പണിയുന്നവർ തള്ളിക്കളഞ്ഞ കല്ല്—അതുതന്നെ മൂലക്കല്ലായിത്തീർന്നു[a]. ഇത് കർത്താവിൽനിന്നാണ് ഉണ്ടായത്[b]; നമ്മുടെ ദൃഷ്ടിയിൽ ഇത് അത്ഭുതകരമാണ്’?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘മേൽക്കല്ല്’; അക്ഷരാർഥം ‘മൂലയുടെ തല’.
    reason: lexical_alternative
  - marker: b
    text: 'ഗ്രീക്ക്: ‘കർത്താവിൽനിന്ന്’; ഉദ്ധരണിയുടെ എബ്രായ സ്രോതസ്സിൽ ‘യഹോവയിൽനിന്ന്’ (YHWH) എന്നാണ്.'
    reason: alternative_reading
lexical_decisions:
- source_word: Λέγει
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിൽ ചരിത്രവർത്തമാനകാലമാണെങ്കിലും, മലയാള ആഖ്യാനശൈലിയിൽ ഭൂതകാലരൂപം സ്വാഭാവികമാണ്.
- source_word: Οὐδέποτε ἀνέγνωτε
  choice: നിങ്ങൾ ഒരിക്കലും വായിച്ചിട്ടില്ലേ?
  rationale: ശാസ്ത്രപരിചയത്തെ ചോദ്യം ചെയ്യുന്ന ഊന്നലുള്ള അലങ്കാരചോദ്യത്തിന്റെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: γραφαῖς
  choice: തിരുവെഴുത്തുകളിൽ
  rationale: ഇവിടെ ഇസ്രായേലിന്റെ വിശുദ്ധരചനകളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘തിരുവെഴുത്തുകൾ’ വ്യക്തവും പ്രചാരത്തിലുള്ളതുമായ പദമാണ്.
- source_word: Λίθον
  choice: കല്ല്
  rationale: ഉദ്ധരണിയിലെ നിർദിഷ്ട കല്ലിനെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἀπεδοκίμασαν
  choice: തള്ളിക്കളഞ്ഞ
  rationale: യോഗ്യമല്ലെന്നു കണ്ട് നിരസിച്ചെന്ന ആശയം ലളിതവും ശക്തവുമായി നൽകുന്നു.
- source_word: οἱ οἰκοδομοῦντες
  choice: പണിയുന്നവർ
  rationale: നാമവാചകമായി പ്രവർത്തിക്കുന്ന കർത്തൃവാചക കൃതന്തത്തെ സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തുകയും നിർമ്മാണരൂപകം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: οὗτος
  choice: അതുതന്നെ
  rationale: പ്രകടമായ ഊന്നൽ മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἐγενήθη εἰς
  choice: ആയിത്തീർന്നു
  rationale: പുതിയ നിലയിലേക്കുള്ള ഫലപരമായ മാറ്റം വ്യക്തമാക്കുന്നു.
- source_word: κεφαλὴν γωνίας
  choice: മൂലക്കല്ല്
  rationale: ‘മൂലയുടെ തല’ എന്ന അക്ഷരാർഥത്തെക്കാൾ സ്വാഭാവികമായ നിർമ്മാണപദം; കോണിലെ പ്രധാന കല്ലെന്ന സാധാരണ അർഥം നൽകുന്നു, എന്നാൽ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: παρὰ κυρίου
  choice: കർത്താവിൽനിന്നാണ്
  rationale: παρά + genitive സൂചിപ്പിക്കുന്ന ഉറവിടം/ഉത്ഭവം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: θαυμαστὴ
  choice: അത്ഭുതകരമാണ്
  rationale: വിസ്മയകരവും ശ്രദ്ധേയവുമായ കാര്യമെന്ന അർഥം ഉയർന്നതും ഇന്നത്തെ വായനക്കാർക്ക് സ്വാഭാവികവുമായ ഭാഷയിൽ നൽകുന്നു.
theological_decisions:
- issue: സങ്കീർത്തന ഉദ്ധരണിയിലെ κυρίου എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: കർത്താവ്
  alternative: യഹോവ
  rationale: നൽകിയിരിക്കുന്ന ഗ്രീക്ക് പാഠത്തിൽ κυρίου എന്നാണ്; അതിനാൽ മുഖ്യപാഠത്തിൽ ‘കർത്താവ്’ ഉപയോഗിച്ചു. ഉദ്ധരിക്കപ്പെട്ട എബ്രായ സ്രോതസ്സിൽ ദൈവനാമമായ יהוה ഉള്ളത് അടിക്കുറിപ്പിൽ തുറന്നുപറയുന്നു.
- issue: കല്ലിന്റെ മിശിഹാപരമായ പ്രയോഗം
  choice: രൂപകം വിശദീകരിക്കാതെ അതേപടി നിലനിർത്തുക
  alternative: മുഖ്യപാഠത്തിൽ കല്ല് മിശിഹായെയോ യേശുവിനെയോ സൂചിപ്പിക്കുന്നു എന്നു വ്യക്തമാക്കുക
  rationale: സന്ദർഭത്തിൽ യേശു ഈ വാക്യം തനിക്കു ബാധകമാക്കുന്നുണ്ടെങ്കിലും, ഈ വാക്യത്തിലെ ഉദ്ധരണി തന്നെ ആ തിരിച്ചറിയൽ നേരിട്ട് വിശദീകരിക്കുന്നില്ല. അതിനാൽ പരിഭാഷയിൽ വ്യാഖ്യാനവികാസം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. സങ്കീർത്തന ഉദ്ധരണിയുടെ കാവ്യാത്മക ഉയർച്ച നിലനിർത്തിയെങ്കിലും പഴഞ്ചൻ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും അവ വിശദീകരിക്കുന്ന വാചകഘടകങ്ങളോടു ചേർത്തിരിക്കുന്നു.
