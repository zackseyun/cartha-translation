id: MAT.21.11
reference: Matthew 21:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ ὄχλοι ἔλεγον· Οὗτός ἐστιν ⸂ὁ προφήτης Ἰησοῦς⸃ ὁ ἀπὸ Ναζαρὲθ τῆς Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/011.yaml
  text: And the crowds were saying[a], “This is the prophet Jesus, from Nazareth in Galilee.”
translation:
  language: ml
  text: 'ജനക്കൂട്ടങ്ങൾ പറഞ്ഞുകൊണ്ടിരുന്നു: “ഇവൻ ഗലീലയിലെ നസറെത്തിൽനിന്നുള്ള ആ പ്രവാചകൻ[a] യേശുവാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ “ആ പ്രവാചകൻ” എന്നാണ്. “ഒരു പ്രവാചകൻ” എന്നും മനസ്സിലാക്കാവുന്നതാണ്; എന്നാൽ നിർദിഷ്ടരൂപം ജനക്കൂട്ടം യേശുവിനെ അറിയപ്പെടുന്ന ഒരു പ്രവാചകവ്യക്തിത്വമായി തിരിച്ചറിഞ്ഞതിനെ സൂചിപ്പിച്ചേക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ ὄχλοι
  choice: ജനക്കൂട്ടങ്ങൾ
  rationale: ὄχλοι എന്ന ബഹുവചനം നിലനിർത്തുന്നു; δέ ഇവിടെ ലഘുവായ ആഖ്യാനബന്ധകമായതിനാൽ മലയാളത്തിൽ വേറെ പദമായി ചേർക്കാതെ വാക്യപ്രവാഹത്തിലൂടെ സൂചിപ്പിക്കുന്നു.
- source_word: ἔλεγον
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലത്തിന്റെ തുടർച്ചയായതോ ആവർത്തിച്ചുള്ളതോ ആയ പ്രവൃത്തിഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Οὗτός ἐστιν
  choice: ഇവൻ ... ആണ്
  rationale: സന്നിഹിതനായ പുരുഷനെ തിരിച്ചറിയിക്കുന്ന ഗ്രീക്ക് നിർദേശകസർവനാമവും കോപുലയും സ്വാഭാവികമായി പകരുന്നു.
- source_word: ὁ προφήτης Ἰησοῦς
  choice: പ്രവാചകനായ യേശു
  rationale: ഗ്രീക്കിലെ പദബന്ധത്തെ സ്വാഭാവിക മലയാളത്തിൽ തിരിച്ചറിയൽപ്രയോഗമായി നൽകുന്നു; ὁ എന്ന നിർദിഷ്ടതയുടെ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ὁ ἀπὸ Ναζαρὲθ τῆς Γαλιλαίας
  choice: ഗലീലയിലെ നസറെത്തിൽനിന്നുള്ള
  rationale: യേശുവിന്റെ ഉത്ഭവസ്ഥലം വ്യക്തമാക്കുന്ന വിശേഷണപദബന്ധം; ഗലീലയിൽ സ്ഥിതിചെയ്യുന്ന നസറെത്ത് എന്ന ഭൂമിശാസ്ത്രബന്ധം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ὁ προφήτης നിർദിഷ്ടമായോ അനിർദിഷ്ടമായോ വിവർത്തനം ചെയ്യണമോ
  choice: പ്രധാനവാചകത്തിൽ ‘പ്രവാചകനായ യേശു’; ഗ്രീക്കിലെ നിർദിഷ്ടരൂപം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു
  alternative: ‘ആ പ്രവാചകനായ യേശു’ അല്ലെങ്കിൽ ‘ഒരു പ്രവാചകനായ യേശു’
  rationale: ὁ എന്ന ആർട്ടിക്കിൾ അംഗീകൃതമോ പ്രതീക്ഷിക്കപ്പെട്ടതോ ആയ പ്രവാചകനെ സൂചിപ്പിക്കാം; എന്നാൽ മലയാളത്തിൽ ‘ആ പ്രവാചകൻ’ എന്ന് നേരിട്ട് പറയുന്നത് മുൻപരാമർശമോ അത്യധികമായ നിർദിഷ്ടതയോ സൂചിപ്പിക്കാം. അതിനാൽ മുഖ്യവാചകം സ്വാഭാവികമായി നിലനിർത്തിക്കൊണ്ട് യഥാർഥ വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. അപൂർണഭൂതകാലത്തിന്റെ തുടർച്ചാഭാവം സംരക്ഷിച്ചിരിക്കുന്നു; നിർദിഷ്ട ആർട്ടിക്കിളിന്റെ വ്യാഖ്യാനപിരിമുറുക്ക് അടിക്കുറിപ്പിൽ നിലനിർത്തിയിരിക്കുന്നു.
