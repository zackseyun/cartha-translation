id: MAT.21.21
reference: Matthew 21:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν, ἐὰν ἔχητε πίστιν καὶ μὴ διακριθῆτε, οὐ μόνον τὸ τῆς συκῆς ποιήσετε, ἀλλὰ κἂν τῷ ὄρει τούτῳ εἴπητε· Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν, γενήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/021.yaml
  text: But Jesus answered them[a], “Truly I say to you, if you have faith and do not doubt, you will not only do what was done to the fig tree, but even if you say to this mountain, ‘Be taken up and thrown into the sea,’ it will happen.”
translation:
  language: ml
  text: 'യേശു അവരോടു മറുപടി പറഞ്ഞു: “സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: നിങ്ങൾക്കു വിശ്വാസമുണ്ടാകുകയും സംശയിക്കാതിരിക്കുകയും[a] ചെയ്താൽ, അത്തിവൃക്ഷത്തോടു ചെയ്തതു നിങ്ങൾ ചെയ്യുക മാത്രമല്ല, ഈ മലയോടു, ‘നീ ഉയർത്തപ്പെടുകയും കടലിലേക്കു എറിയപ്പെടുകയും ചെയ്യുക’ എന്നു പറഞ്ഞാൽപോലും, അതു സംഭവിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “ചാഞ്ചാടാതിരിക്കുകയും” അഥവാ “മനസ്സിൽ രണ്ടായി പിരിയാതിരിക്കുകയും.”
    reason: διακριθῆτε എന്ന പദത്തിന് സംശയം, ചാഞ്ചാട്ടം, ഉള്ളിലെ വിഭജനം എന്നീ ബന്ധമുള്ള അർഥസൂക്ഷ്മതകൾ ഉണ്ടാകാം.
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: അപ്പോൾ യേശു അവരോടു പറഞ്ഞു
  rationale: പ്രതികരണത്തിന്റെ ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു; δέ സൂചിപ്പിക്കുന്ന ലഘുവായ ആഖ്യാനമാറ്റം ‘അപ്പോൾ’ എന്നതിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: യേശുവിന്റെ ഗൗരവമേറിയതും അധികാരപൂർണവുമായ ആമുഖസൂത്രം ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐὰν ἔχητε πίστιν
  choice: നിങ്ങൾക്കു വിശ്വാസമുണ്ടാകുകയും
  rationale: ഇവിടെ πίστις ദൈവത്തിലുള്ള ആശ്രയപൂർണമായ വിശ്വാസത്തെ സൂചിപ്പിക്കുന്നു; സ്വഭാവഗുണമായ വിശ്വസ്തതയെയല്ല.
- source_word: μὴ διακριθῆτε
  choice: സംശയിക്കാതിരിക്കുകയും
  rationale: സന്ദർഭത്തിൽ ഉള്ളിലെ സംശയമോ ചാഞ്ചാട്ടമോ ആണ് പ്രധാന അർഥം; പ്രധാന പാഠത്തിൽ വ്യക്തമായ സാധാരണ മലയാളം ഉപയോഗിച്ച് മറ്റു സൂക്ഷ്മതകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: οὐ μόνον τὸ τῆς συκῆς ποιήσετε
  choice: അത്തിവൃക്ഷത്തിനു സംഭവിച്ചത് നിങ്ങൾ ചെയ്യുമെന്നു മാത്രമല്ല
  rationale: τὸ τῆς συκῆς എന്ന സംക്ഷിപ്ത ഗ്രീക്ക് പ്രയോഗം മുൻസന്ദർഭത്തിലെ അത്തിവൃക്ഷസംഭവത്തെ സൂചിപ്പിക്കുന്നു; അനാവശ്യ വ്യാഖ്യാനം ചേർക്കാതെ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: κἂν τῷ ὄρει τούτῳ εἴπητε
  choice: ഈ മലയോട് ... എന്നു പറഞ്ഞാൽ
  rationale: κἄν നൽകുന്ന വർധിത ഉദാഹരണത്തിന്റെ ഭാവവും τούτῳ എന്ന സമീപസൂചകത്തിന്റെ പ്രത്യേകതയും നിലനിർത്തുന്നു.
- source_word: Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν
  choice: നീ പൊക്കപ്പെട്ട് കടലിലേക്ക് എറിയപ്പെടുക
  rationale: രണ്ടു നിഷ്ക്രിയ ആജ്ഞാരൂപങ്ങളുടെയും ഭൗതിക ദൃശ്യഭാവം കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: γενήσεται
  choice: അതു സംഭവിക്കുകയും ചെയ്യും
  rationale: γίνομαι എന്ന ക്രിയയുടെ സംഭവിക്കുക എന്ന നേരിട്ടുള്ള അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: അത്ഭുതപ്രവൃത്തിയെക്കുറിച്ചുള്ള വചനത്തിൽ πίστις എന്നതിന്റെ വിവർത്തനം
  choice: വിശ്വാസം
  alternative: ആശ്രയം; വിശ്വസ്തത
  rationale: ഈ സന്ദർഭത്തിൽ ദൈവത്തിലുള്ള ആത്മവിശ്വാസപൂർണമായ ആശ്രയമാണ് ഉദ്ദേശിക്കുന്നത്; ‘വിശ്വസ്തത’ എന്ന സ്വഭാവഗുണം ഇവിടെ കുറവായി യോജിക്കുന്നു.
- issue: മലയെ നീക്കുന്നതിനെക്കുറിച്ചുള്ള യേശുവിന്റെ വാക്കുകളുടെ സ്വഭാവം
  choice: ദൃശ്യസമ്പന്നമായ ശക്തമായ ഭാഷയെ അതേപടി നിലനിർത്തുക
  alternative: അക്ഷരാർഥത്തിലുള്ള അത്ഭുതവാഗ്ദാനമായി മാത്രം ചുരുക്കുക; പ്രതിസന്ധികളെ മറികടക്കാനുള്ള രൂപകമായി മാത്രം ചുരുക്കുക
  rationale: മൂലപാഠം അക്ഷരാർഥവും രൂപകാർഥവും സംബന്ധിച്ച വ്യാഖ്യാനസാധ്യതയെ സ്വയം തീർപ്പാക്കുന്നില്ല; അതിനാൽ വിവർത്തനം ആ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ഗ്രീക്കിലെ ഉജ്ജ്വലമായ മല-കടൽ ദൃശ്യവും നിഷ്ക്രിയ ആജ്ഞാരൂപങ്ങളും സംരക്ഷിച്ചു; വ്യാഖ്യാനപരമായ ചുരുക്കം ഒഴിവാക്കി.
