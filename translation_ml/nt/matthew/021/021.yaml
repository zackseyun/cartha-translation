  source_fidelity: തിരുത്തൽ ആവശ്യമാണ്. ἀποκριθεὶς എന്ന പ്രതികരണസൂചനയെ ‘അപ്പോൾ ... പറഞ്ഞു’ എന്നത് ഒഴിവാക്കുന്നു; ‘മറുപടി പറഞ്ഞു’ എന്നു നൽകണം. ‘അത്തിവൃക്ഷത്തിനു സംഭവിച്ചത് നിങ്ങൾ ചെയ്യുക’ എന്ന പ്രയോഗം മലയാളത്തിൽ കർത്തൃ-കർമബന്ധം അവ്യക്തവും അസ്വാഭാവികവുമാണ്; സന്ദർഭത്തിലെ അത്തിവൃക്ഷത്തോടുണ്ടായ പ്രവൃത്തിയെ വ്യക്തമായി സൂചിപ്പിക്കാം.
  naturalness: മിക്ക വാക്യവും ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികമാണ്. എന്നാൽ ‘പൊക്കപ്പെട്ട്’ എന്നത് ഇവിടെ കുറച്ച് സംസാരഭാഷാസ്വഭാവമുള്ളതും ‘ഉയർത്തപ്പെടുകയും’ എന്നതിനേക്കാൾ കുറവായി കൃത്യവുമാണ്. പരിഷ്കരിച്ച സമാന്തര നിഷ്ക്രിയ ആജ്ഞാരൂപം കൂടുതൽ തെളിച്ചമുള്ളതാണ്.
