revisions:
- from: 'അപ്പോൾ യേശു അവരോടു പറഞ്ഞു: “സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: നിങ്ങൾക്കു വിശ്വാസമുണ്ടാകുകയും സംശയിക്കാതിരിക്കുകയും[a] ചെയ്താൽ, അത്തിവൃക്ഷത്തിനു സംഭവിച്ചത് നിങ്ങൾ ചെയ്യുമെന്നു മാത്രമല്ല, ഈ മലയോട്, ‘നീ പൊക്കപ്പെട്ട് കടലിലേക്ക് എറിയപ്പെടുക’ എന്നു പറഞ്ഞാൽ അതു സംഭവിക്കുകയും ചെയ്യും.”'
  to: 'യേശു അവരോടു മറുപടി പറഞ്ഞു: “സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: നിങ്ങൾക്കു വിശ്വാസമുണ്ടാകുകയും സംശയിക്കാതിരിക്കുകയും[a] ചെയ്താൽ, അത്തിവൃക്ഷത്തോടു ചെയ്തതു നിങ്ങൾ ചെയ്യുക മാത്രമല്ല, ഈ മലയോടു, ‘നീ ഉയർത്തപ്പെടുകയും കടലിലേക്കു എറിയപ്പെടുകയും ചെയ്യുക’ എന്നു പറഞ്ഞാൽപോലും, അതു സംഭവിക്കും.”'
  rationale: പരിഷ്കാരം ἀποκριθεὶς-ന്റെ ‘മറുപടി’ എന്ന പ്രതികരണഭാവം പുനഃസ്ഥാപിക്കുന്നു; അത്തിവൃക്ഷത്തെ സംബന്ധിച്ച ഗ്രീക്ക് സംക്ഷിപ്തപ്രയോഗത്തെ സന്ദർഭത്തോട് ചേർന്ന, സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; മലയുടെ കാര്യത്തിലെ രണ്ടു നിഷ്ക്രിയ ആജ്ഞാരൂപങ്ങളും നിലനിർത്തുന്നു. മല നീങ്ങുന്നതിനെ അക്ഷരാർഥമോ രൂപകമോ ആയി വ്യാഖ്യാനിച്ചു ചുരുക്കുന്നില്ല.
