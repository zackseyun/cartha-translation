source:
  edition: SBLGNT
  text: ἐὰν δὲ εἴπωμεν· Ἐξ ἀνθρώπων, φοβούμεθα τὸν ὄχλον, πάντες γὰρ ⸂ὡς προφήτην ἔχουσιν τὸν Ἰωάννην⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/026.yaml
  text: But if we say[a], ‘From men,’ we fear the crowd, for they all regard John as a prophet.
translation:
  language: ml
  text: എന്നാൽ ‘മനുഷ്യരിൽനിന്ന്[a]’ എന്നു പറഞ്ഞാൽ, ജനക്കൂട്ടത്തെ നാം ഭയപ്പെടുന്നു; കാരണം എല്ലാവരും യോഹന്നാനെ ഒരു പ്രവാചകനായി കരുതുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മാനുഷിക ഉറവിടത്തിൽനിന്ന്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ εἴπωμεν
  choice: എന്നാൽ … എന്നു പറഞ്ഞാൽ
  rationale: ἐὰν സഹിതമുള്ള aorist subjunctive ഒരു സാധ്യതാപരമായ നിബന്ധനയാണ് സൂചിപ്പിക്കുന്നത്. ആലോചനാത്മകമായ ഈ നിബന്ധനാഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഇങ്ങനെ നിലനിർത്തുന്നു.
- source_word: Ἐξ ἀνθρώπων
  choice: മനുഷ്യരിൽനിന്ന്
  rationale: മുൻവാക്യത്തിലെ ‘സ്വർഗത്തിൽനിന്ന്’ എന്നതിനോടുള്ള ഉറവിടവ്യത്യാസം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു. ἀνθρώπων ഇവിടെ പുരുഷന്മാരെ മാത്രം അല്ല, ദൈവികമല്ലാത്ത മാനുഷിക ഉറവിടത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: φοβούμεθα τὸν ὄχλον
  choice: ജനക്കൂട്ടത്തെ നാം ഭയപ്പെടുന്നു
  rationale: φοβούμεθα എന്നതിന്റെ നേരിട്ടുള്ള ഭയാർഥവും τὸν ὄχλον എന്ന നിർദിഷ്ട ജനക്കൂട്ടവും വ്യക്തമായി പകരുന്നു.
- source_word: πάντες
  choice: എല്ലാവരും
  rationale: ജനക്കൂട്ടത്തിലെ ആളുകളെ സമഗ്രമായി സൂചിപ്പിക്കുന്ന ബഹുവചനാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὡς προφήτην ἔχουσιν τὸν Ἰωάννην
  choice: യോഹന്നാനെ ഒരു പ്രവാചകനായി കരുതുന്നു
  rationale: ἔχω + object + ὡς + predicate എന്ന പ്രയോഗം ഒരാളെ ഒരു നിലയിൽ കണക്കാക്കുക എന്ന അർഥത്തിലാണ്; ‘കരുതുന്നു’ ആ വിലയിരുത്തൽഭാവം സ്വാഭാവികമായി പകരുന്നു.
- source_word: Ἰωάννην
  choice: യോഹന്നാൻ
  rationale: മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ സുപരിചിതവും മാനദണ്ഡപരവുമായ പേരുരൂപം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: ‘സ്വർഗത്തിൽനിന്ന്’ എന്നതിനോടു വിരുദ്ധമായ ἀνθρώπων എന്ന ഉറവിടപ്രയോഗം
  choice: മനുഷ്യരിൽനിന്ന്
  alternative: മാനുഷിക ഉറവിടത്തിൽനിന്ന്
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തമായ സ്വർഗീയ-മാനുഷിക ഉറവിടവ്യത്യാസം നിലനിർത്തുന്നു; ഇത് പുരുഷലിംഗപരമായ പരിമിത അർഥം നൽകുന്നില്ലെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- issue: യോഹന്നാനെക്കുറിച്ചുള്ള ജനക്കൂട്ടത്തിന്റെ വിലയിരുത്തൽ
  choice: എല്ലാവരും യോഹന്നാനെ ഒരു പ്രവാചകനായി കരുതുന്നു
  alternative: എല്ലാവരും യോഹന്നാനെ പ്രവാചകനായി അംഗീകരിക്കുന്നു
  rationale: വാക്യം ജനങ്ങളുടെ ധാരണയെ റിപ്പോർട്ട് ചെയ്യുന്നു; അതിന് അപ്പുറം അംഗീകാരത്തിന്റെയോ ഔദ്യോഗിക സ്ഥിരീകരണത്തിന്റെയോ ആശയം ചേർക്കാതെ ἔχουσιν എന്നതിന്റെ വിലയിരുത്തൽഭാവം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനദണ്ഡ മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘മനുഷ്യരിൽനിന്ന്’ എന്ന രൂപം സന്ദർഭത്തിലെ ‘സ്വർഗത്തിൽനിന്ന്’ എന്ന സമാന്തരവിരോധം നിലനിർത്തുന്നു; കൂടുതൽ വിശദമായ അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
