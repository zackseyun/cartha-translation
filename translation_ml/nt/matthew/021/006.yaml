id: MAT.21.6
reference: Matthew 21:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πορευθέντες δὲ οἱ μαθηταὶ καὶ ποιήσαντες καθὼς ⸀συνέταξεν αὐτοῖς ὁ Ἰησοῦς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/006.yaml
  text: So the disciples went and did just as Jesus had instructed them[a].
translation:
  language: ml
  text: അങ്ങനെ ശിഷ്യന്മാർ പോയി, യേശു അവരോടു നിർദേശിച്ചതുപോലെതന്നെ ചെയ്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യേശു അവരോടു കൽപ്പിച്ചതുപോലെ.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് കൽപ്പിക്കുകയോ നിർദേശിക്കുകയോ ചെയ്യുക എന്ന അർത്ഥമുണ്ടാകാം; ഇവിടെ സന്ദർഭം ‘നിർദേശിച്ചു’ എന്ന അർത്ഥത്തെ പിന്തുണയ്ക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευθέντες
  choice: പോയി
  rationale: പ്രധാന പ്രവൃത്തിക്കു മുമ്പുള്ള സഞ്ചാരത്തെ സൂചിപ്പിക്കുന്ന aorist participle; മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനക്രമത്തിൽ ‘പോയി’ എന്നു നൽകുന്നു.
- source_word: δὲ
  choice: അങ്ങനെ
  rationale: മുമ്പ് യേശു നൽകിയ നിർദേശത്തോടുള്ള പ്രതികരണമായി കഥ തുടരുന്നതു വ്യക്തമാക്കുന്ന സ്വാഭാവിക സംക്രമണം.
- source_word: οἱ μαθηταὶ
  choice: ശിഷ്യന്മാർ
  rationale: സുവിശേഷസന്ദർഭത്തിൽ യേശുവിന്റെ അനുയായികളെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും സ്വാഭാവികവുമായ മലയാളപദം.
- source_word: ποιήσαντες
  choice: ചെയ്തു
  rationale: καθὼς എന്ന താരതമ്യഘടനയോടൊപ്പം ലളിതവും കൃത്യവുമായ ആഖ്യാനരൂപം.
- source_word: καθὼς
  choice: പോലെതന്നെ
  rationale: യേശുവിന്റെ നിർദേശത്തോടുള്ള പൂർണ പൊരുത്തം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: συνέταξεν
  choice: നിർദേശിച്ചു
  rationale: συντάσσω ഇവിടെ കല്പനയോ നിർദേശമോ നൽകുന്നതിനെ സൂചിപ്പിക്കുന്നു; മുൻവാക്യങ്ങളിലെ വിശദമായ ദിശാനിർദേശങ്ങളുടെ പശ്ചാത്തലത്തിൽ ‘നിർദേശിച്ചു’ യോജിക്കുന്നു, എന്നാൽ ‘കല്പിച്ചു’ എന്ന അർഥസാധ്യതയും നിലനിൽക്കുന്നു.
- source_word: αὐτοῖς
  choice: തങ്ങളോടു
  rationale: ശിഷ്യന്മാരെയാണ് പരാമർശിക്കുന്നതെന്നു മലയാളത്തിൽ വ്യക്തമായി കാണിക്കുകയും അനാവശ്യ ആവർത്തനം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: ὁ Ἰησοῦς
  choice: യേശു
  rationale: ഗ്രീക്കിലെ നിർദ്ദിഷ്ട ഉപപദത്തോടുകൂടിയ വ്യക്തിനാമം മലയാളത്തിൽ സ്വാഭാവികമായി ‘യേശു’ എന്നു നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ participial sequence സ്വാഭാവികമായ ‘പോയി ... ചെയ്തു’ എന്ന ക്രമത്തിൽ നൽകിയിരിക്കുന്നു; ‘പോലെതന്നെ’ അനുസരണത്തിന്റെ കൃത്യമായ പൊരുത്തം നിലനിർത്തുന്നു.
