  to: അങ്ങനെ ശിഷ്യന്മാർ പോയി, യേശു അവരോടു നിർദേശിച്ചതുപോലെതന്നെ ചെയ്തു.[a]
  rationale: The revision replaces the potentially ambiguous pronoun with ‘അവരോടു,’ explicitly preserving αὐτοῖς as a reference to the disciples. It also makes minor, non-substantive improvements to the footnote’s modern standard Malayalam wording. No change is made to the verse’s meaning or to the lexical ambiguity of συνέταξεν.
