id: MAT.21.10
reference: Matthew 21:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἰσελθόντος αὐτοῦ εἰς Ἱεροσόλυμα ἐσείσθη πᾶσα ἡ πόλις λέγουσα· Τίς ἐστιν οὗτος;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/010.yaml
  text: And when he entered Jerusalem[a], the whole city was stirred up, saying, “Who is this?”
translation:
  language: ml
  text: അവൻ യെരൂശലേമിൽ പ്രവേശിച്ചപ്പോൾ നഗരം മുഴുവൻ ഇളകിമറിഞ്ഞു[a]. “ഇവൻ ആരാണ്?” എന്ന് നഗരവാസികൾ ചോദിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കുലുങ്ങി.” ഗ്രീക്ക് ക്രിയയ്ക്ക് ശാരീരികമായി കുലുങ്ങുക എന്നും, ഇവിടെപ്പോലെ പൊതുവായ പ്രക്ഷുബ്ധതയെ സൂചിപ്പിക്കുക എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθόντος αὐτοῦ
  choice: അവൻ ... പ്രവേശിച്ചപ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് സ്വാഭാവികമായ മലയാളത്തിലെ കാലസൂചക ഉപവാക്യമായി പരിഭാഷപ്പെടുത്തി; സംഭവങ്ങളുടെ സമയബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: Ἱεροσόλυμα
  choice: യെരൂശലേം
  rationale: മലയാള ബൈബിൾ വായനയിൽ പരിചിതമായ സ്ഥലനാമരൂപം ഉപയോഗിച്ചു.
- source_word: ἐσείσθη
  choice: ഇളകിമറിഞ്ഞു
  rationale: σείω എന്ന ക്രിയയുടെ ‘കുലുക്കുക’ എന്ന രൂപകം നിലനിർത്തിക്കൊണ്ട്, നഗരജനങ്ങളുടെ പൊതുവായ ഉത്കണ്ഠയും പ്രക്ഷുബ്ധതയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: πᾶσα ἡ πόλις
  choice: നഗരം മുഴുവൻ
  rationale: നഗരത്തിലെ ജനസമൂഹത്തെയാകെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളരൂപം.
- source_word: λέγουσα
  choice: എന്ന് അവർ ചോദിച്ചു
  rationale: വ്യാകരണപരമായി ‘നഗരം’ പറയുന്നതായി ഗ്രീക്കിൽ ഉള്ള വ്യക്തിവൽക്കരണം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ നഗരവാസികളെ സൂചിപ്പിക്കുന്ന ‘അവർ’ ഉപയോഗിച്ചു; ഉദ്ധരണി ചോദ്യമായതിനാൽ ‘ചോദിച്ചു’ പ്രസംഗപ്രവർത്തനം കൃത്യമായി വ്യക്തമാക്കുന്നു.
- source_word: Τίς ἐστιν οὗτος;
  choice: ഇവൻ ആരാണ്?
  rationale: οὗτος എന്ന സമീപസൂചക സർവനാമവും ചോദ്യം ചെയ്യുന്ന ഭാവവും അധികവാക്കുകൾ ചേർക്കാതെ നേരിട്ട് പകരുന്നു.
theological_decisions:
- issue: നഗരത്തിന്റെ പ്രതികരണത്തിൽ ἐσείσθη എന്ന ക്രിയയുടെ അക്ഷരാർഥമോ രൂപകാർഥമോ
  choice: ജനങ്ങളുടെ പ്രക്ഷുബ്ധത സൂചിപ്പിക്കുന്ന ‘ഇളകിമറിഞ്ഞു’
  alternative: ‘കുലുങ്ങിപ്പോയി’ / ‘കുലുക്കപ്പെട്ടു’
  rationale: സന്ദർഭം ഭൂകമ്പത്തെക്കാൾ യേശുവിന്റെ പ്രവേശനത്തോടുള്ള നഗരത്തിന്റെ കൂട്ടായ പ്രതികരണമാണ് സൂചിപ്പിക്കുന്നത്. ‘ഇളകിമറിഞ്ഞു’ ആ രൂപകവും സാമൂഹിക പ്രക്ഷുബ്ധതയും ഒരുമിച്ച് നിലനിർത്തുന്നു; അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നഗരം മുഴുവൻ’ എന്നത് നഗരവാസികളെ കൂട്ടമായി സൂചിപ്പിക്കുന്ന വ്യക്തിവൽക്കരണമാണ്; തുടർന്ന് ‘അവർ’ ഉപയോഗിക്കുന്നത് മലയാളത്തിലെ വ്യക്തതയും സ്വാഭാവികതയും വർധിപ്പിക്കുന്നു.
