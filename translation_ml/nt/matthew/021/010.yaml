  naturalness: ‘നഗരം മുഴുവൻ ഇളകിമറിഞ്ഞു’ is natural modern Malayalam. Recasting the final clause with ‘നഗരവാസികൾ’ makes the implied speakers explicit and avoids an antecedent-less pronoun, while retaining the collective sense.
  terminology: ‘യെരൂശലേം’ is the standard familiar Malayalam form. ‘ഇളകിമറിഞ്ഞു’ appropriately communicates civic agitation; the footnote preserves the literal shaking sense.
