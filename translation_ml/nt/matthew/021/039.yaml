id: MAT.21.39
reference: Matthew 21:39
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ λαβόντες αὐτὸν ἐξέβαλον ἔξω τοῦ ἀμπελῶνος καὶ ἀπέκτειναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/039.yaml
  text: And they took him[a], threw him out of the vineyard, and killed him.
translation:
  language: ml
  text: അവർ അവനെ പിടിച്ച് മുന്തിരിത്തോട്ടത്തിനു പുറത്തേക്ക് എറിഞ്ഞുകളഞ്ഞു[a]; പിന്നെ അവനെ കൊന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മുന്തിരിത്തോട്ടത്തിൽനിന്ന് അവനെ പുറത്താക്കി.’
    reason: ἐκβάλλω എന്നതിന് ഈ സന്ദർഭത്തിൽ ‘പുറത്തേക്ക് എറിഞ്ഞുകളയുക’ എന്നും പൊതുവായി ‘പുറത്താക്കുക’ എന്നും പരിഭാഷപ്പെടുത്താം.
lexical_decisions:
- source_word: λαβόντες
  choice: പിടിച്ച്
  rationale: λαμβάνω എന്ന ക്രിയയുടെ ഭൂതകാല കൃത്‌രൂപമാണിത്. ഈ സന്ദർഭത്തിൽ തുടർന്നുള്ള പുറത്താക്കലിനോടു ചേർന്ന് ‘പിടിച്ച്’ എന്നത് സ്വാഭാവികമാണ്; ‘പിടികൂടി’ എന്നതിലധികം ബലപ്രയോഗത്തിന്റെ ഭാവം ചേർക്കുന്നില്ല.
- source_word: ἐξέβαλον
  choice: പുറത്തേക്ക് എറിഞ്ഞുകളഞ്ഞു
  rationale: ἐκβάλλω ഇവിടെ ശാരീരികമായി പുറത്താക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘എറിഞ്ഞുകളഞ്ഞു’ ക്രിയയുടെ ശക്തമായ ചലനഭാവം നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: ἔξω τοῦ ἀμπελῶνος
  choice: മുന്തിരിത്തോട്ടത്തിനു പുറത്തേക്ക്
  rationale: ഈ പ്രയോഗം മുന്തിരിത്തോട്ടത്തിന്റെ ഉള്ളിൽനിന്ന് പുറത്തേക്കുള്ള ചലനം വ്യക്തമാക്കുന്നു; ‘പുറത്ത്’ എന്നതിനെക്കാൾ ‘പുറത്തേക്ക്’ ἐξέβαλον എന്ന ചലനക്രിയയോടു യോജിക്കുന്നു.
- source_word: ἀμπελῶνος
  choice: മുന്തിരിത്തോട്ടം
  rationale: ἀμπελών എന്ന പദത്തിന്റെ നേരിട്ടുള്ളതും പ്രചാരത്തിലുള്ളതുമായ മലയാള പരിഭാഷയാണ് ‘മുന്തിരിത്തോട്ടം’.
- source_word: ἀπέκτειναν
  choice: അവനെ കൊന്നു
  rationale: ἀποκτείνω എന്നതിന്റെ നേരിട്ടുള്ള അർഥം ‘കൊല്ലുക’ എന്നാണ്. ‘വധിച്ചു’ കൂടുതൽ ഔപചാരികവും ‘കൊലപ്പെടുത്തി’ ചിലപ്പോൾ അധിക വ്യാഖ്യാനഭാവമുള്ളതുമായതിനാൽ ലളിതവും കൃത്യവുമായ ഈ രൂപം തെരഞ്ഞെടുത്തു.
theological_decisions:
- issue: സമാന്തര സുവിശേഷവിവരണങ്ങളുമായി ബന്ധപ്പെട്ട പുറത്താക്കലിന്റെയും കൊല്ലലിന്റെയും ക്രമം
  choice: ആദ്യം അവനെ മുന്തിരിത്തോട്ടത്തിനു പുറത്തേക്ക് എറിഞ്ഞുകളഞ്ഞു; പിന്നെ കൊന്നു എന്ന മത്തായിയുടെ ക്രമം നിലനിർത്തി.
  alternative: മർക്കോസിലെയും ലൂക്കോസിലെയും സമാന്തരവിവരണങ്ങളോട് ഒത്തുചേരാൻ, ആദ്യം കൊന്നശേഷം പുറത്തേക്ക് എറിഞ്ഞു എന്ന അർഥം സൂചിപ്പിക്കുക.
  rationale: ഗ്രീക്കിൽ ἐξέβαλον ... καὶ ἀπέκτειναν എന്ന ക്രമം വ്യക്തമാണ്. അതിനാൽ സമാന്തരവിവരണങ്ങളുമായി കൃത്രിമമായി ഏകീകരിക്കാതെ മത്തായിയുടെ സ്വന്തം വിവരണക്രമം പരിഭാഷ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. ഗ്രീക്കിലെ പ്രവർത്തനക്രമം വ്യക്തമായി കാണിക്കാൻ അർധവിരാമവും ‘പിന്നെ’ എന്ന ക്രമസൂചകവും ഉപയോഗിച്ചു; ഇത് മൂലത്തിലെ ക്രമം വ്യക്തമാക്കുന്നതല്ലാതെ പുതിയ സംഭവവിവരം ചേർക്കുന്നില്ല.
