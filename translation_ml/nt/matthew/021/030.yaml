id: MAT.21.30
reference: Matthew 21:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂προσελθὼν δὲ⸃ τῷ ⸀δευτέρῳ εἶπεν ὡσαύτως· ὁ δὲ ἀποκριθεὶς εἶπεν· ⸂Ἐγώ, κύριε· καὶ οὐκ⸃ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/030.yaml
  text: Then he came to the second and said the same[a]. And he answered, ‘I will[b], sir,’ but he did not go.
translation:
  language: ml
  text: 'പിന്നെ അവൻ രണ്ടാമന്റെ അടുത്തുചെന്ന് അതേ കാര്യം പറഞ്ഞു. അവൻ മറുപടി പറഞ്ഞു: “ഞാൻ പോകും[a], അയ്യാ[b].” എന്നാൽ അവൻ പോയില്ല.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “ഞാൻ”; സന്ദർഭത്തിൽ “ഞാൻ പോകും” എന്ന സമ്മതമാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിലെ κύριε എന്നതിന് “യജമാനനേ,” “കർത്താവേ” എന്നിങ്ങനെയും പരിഭാഷപ്പെടുത്താം. ഇവിടെ മനുഷ്യപിതാവിനോടുള്ള ആദരപൂർവമായ അഭിസംബോധനയായതിനാൽ “അയ്യാ” എന്നു നൽകിയിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: προσελθὼν δὲ
  choice: പിന്നെ അവൻ ... അടുത്തുചെന്ന്
  rationale: δέ ഇവിടെ ശക്തമായ വൈരുധ്യമല്ല, കഥയുടെ അടുത്ത ഘട്ടത്തിലേക്കുള്ള നീക്കമാണ്. προσέρχομαι പിതാവ് രണ്ടാമന്റെ അടുത്തേക്കു ചെന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: τῷ δευτέρῳ
  choice: രണ്ടാമന്റെ
  rationale: ഗ്രീക്കിൽ ‘മകൻ’ ആവർത്തിക്കുന്നില്ല; സന്ദർഭത്തിൽ അത് വ്യക്തമായതിനാൽ മൂലത്തിന്റെ സംക്ഷിപ്തത നിലനിർത്തി.
- source_word: ὡσαύτως
  choice: അതേ കാര്യം
  rationale: ആദ്യമകനോടു പറഞ്ഞ അതേ നിർദേശം രണ്ടാമനോടും പറഞ്ഞുവെന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀποκριθεὶς εἶπεν
  choice: മറുപടി പറഞ്ഞു
  rationale: വാക്കുതോറും ‘ഉത്തരം പറഞ്ഞുകൊണ്ട് പറഞ്ഞു’ എന്ന ആവർത്തനം ഒഴിവാക്കി, ഗ്രീക്കിലെ പതിവ് പ്രയോഗം സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
- source_word: Ἐγώ
  choice: ഞാൻ പോകാം
  rationale: മൂലത്തിൽ ഊന്നലുള്ള ‘ഞാൻ’ എന്ന സർവനാമം മാത്രമാണുള്ളത്; പിതാവിന്റെ കല്പനയോടുള്ള സമ്മതമായി ക്രിയ അധ്യാഹരിക്കപ്പെട്ടിരിക്കുന്നു. മലയാളത്തിൽ അർഥം സ്വാഭാവികമാക്കാൻ ‘പോകാം’ ചേർത്തു, അടിക്കുറിപ്പിൽ അക്ഷരാർഥം രേഖപ്പെടുത്തി.
- source_word: κύριε
  choice: അച്ഛാ
  rationale: ഇവിടെ മകൻ തന്റെ മനുഷ്യപിതാവിനോടാണ് ആദരവോടെ സംസാരിക്കുന്നത്. ‘കർത്താവേ’ ദൈവിക അർഥം അനാവശ്യമായി വരുത്തും; ‘യജമാനനേ’ കുടുംബസംഭാഷണത്തിൽ അസ്വാഭാവികമാണ്. ബന്ധവും ആദരവും ഒരുമിച്ച് സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ ‘അച്ഛാ’ തെരഞ്ഞെടുത്തു; പദത്തിന്റെ വിപുലമായ അർഥപരിധി അടിക്കുറിപ്പിൽ നൽകി.
- source_word: καὶ οὐκ ἀπῆλθεν
  choice: എന്നാൽ അവൻ പോയില്ല
  rationale: καί നിഷേധക്രിയയോടൊപ്പം മുൻപത്തെ സമ്മതവും പിന്നത്തെ പ്രവൃത്തിയും തമ്മിലുള്ള വൈരുധ്യം പ്രകടമാക്കുന്നു; മലയാളത്തിൽ ‘എന്നാൽ’ അത് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: പിതാവിനെ അഭിസംബോധന ചെയ്യുന്ന κύριε എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: അച്ഛാ
  alternative: യജമാനനേ / കർത്താവേ / അങ്ങുന്നേ
  rationale: κύριε എന്നതിന് ‘കർത്താവേ’ അല്ലെങ്കിൽ ‘യജമാനനേ’ എന്നാകാം; എന്നാൽ ഈ ഉപമയിൽ ദൈവികമോ മശീഹാപരമോ ആയ പദവിയല്ല, മനുഷ്യപിതാവിനോടുള്ള ആദരപൂർവമായ അഭിസംബോധനയാണ്. അതിനാൽ സന്ദർഭത്തിൽ സ്വാഭാവികമായ ‘അച്ഛാ’ ഉപയോഗിച്ചു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. സംഭാഷണം കുടുംബസന്ദർഭത്തിൽ സ്വാഭാവികമാക്കി; അതേസമയം Ἐγώ എന്ന അപൂർണ മറുപടിയും κύριε എന്ന പദത്തിന്റെ അർഥവ്യാപ്തിയും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
