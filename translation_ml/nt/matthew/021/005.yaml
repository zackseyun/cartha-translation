id: MAT.21.5
reference: Matthew 21:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εἴπατε τῇ θυγατρὶ Σιών· Ἰδοὺ ὁ βασιλεύς σου ἔρχεταί σοι πραῢς καὶ ἐπιβεβηκὼς ἐπὶ ὄνον καὶ ⸀ἐπὶ πῶλον υἱὸν ὑποζυγίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/005.yaml
  text: Tell the daughter of Zion[a], ‘Look, your king is coming to you, gentle and mounted on a donkey, and on a colt[b], the foal of a beast of burden.’
translation:
  language: ml
  text: '“സീയോൻപുത്രിയോടു പറയുക: ‘ഇതാ, നിന്റെ രാജാവ് സൗമ്യനായി[a], കഴുതപ്പുറത്തും ചുമട്ടുമൃഗത്തിന്റെ കുഞ്ഞായ കഴുതക്കുട്ടിയുടെ പുറത്തും കയറിയിരിക്കുന്നവനായി നിന്റെ അടുക്കൽ വരുന്നു.’[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “വിനീതനായി.” ഗ്രീക്ക് πραΰς എന്ന പദത്തിന് “സൗമ്യൻ,” “ശാന്തൻ,” “വിനീതൻ” എന്നീ അർഥങ്ങൾ വരാം; ഇത് സെഖര്യാവ് 9:9-നെ പ്രതിധ്വനിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'മത്തായി പ്രവാചകവചനത്തിലെ പരസ്പരം ബന്ധിപ്പിച്ചിരിക്കുന്ന രണ്ട് മൃഗപ്രയോഗങ്ങളും നിലനിർത്തുന്നു: “കഴുതപ്പുറത്തും ചുമട്ടുമൃഗത്തിന്റെ കുഞ്ഞായ കഴുതക്കുട്ടിയുടെ പുറത്തും.”'
    reason: cross_reference
lexical_decisions:
- source_word: Εἴπατε
  choice: പറയുക
  rationale: ബഹുവചന ആജ്ഞാരൂപത്തിന്റെ നിർദേശസ്വഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τῇ θυγατρὶ Σιών
  choice: സീയോൻപുത്രിയോട്
  rationale: സീയോനെ ഒരു പുത്രിയായി വ്യക്തിവൽക്കരിക്കുന്ന പ്രവാചകഭാഷയെ ‘സീയോനിലെ ജനങ്ങൾ’ എന്നു വിശദീകരിച്ച് പരത്താതെ സംരക്ഷിക്കുന്നു.
- source_word: Ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗ്രീക്ക് നിപാതത്തിന്റെ ശക്തിയും തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള ആധുനിക പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: ὁ βασιλεύς σου
  choice: നിന്റെ രാജാവ്
  rationale: ഉടമസ്ഥതയും രാജകീയമായ അർഥവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: ἔρχεταί σοι
  choice: നിന്റെ അടുക്കൽ വരുന്നു
  rationale: വരവിന്റെ സജീവവും സമീപസ്ഥവുമായ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: πραῢς
  choice: സൗമ്യനായി
  rationale: ബലപ്രയോഗമില്ലാത്ത സൗമ്യതയുടെ അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘വിനീതനായി’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἐπιβεβηκὼς
  choice: കയറി
  rationale: വാഹനമൃഗത്തിന്മേൽ കയറിയിരിക്കുന്ന അവസ്ഥയെ മലയാളത്തിൽ ചുരുക്കമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: ἐπὶ ὄνον
  choice: കഴുതപ്പുറത്ത്
  rationale: ഗ്രീക്ക് മുൻപ്രത്യയപ്രയോഗത്തിന്റെ സാധാരണവും വ്യക്തവുമായ മലയാളസമാനം.
- source_word: πῶλον
  choice: കഴുതക്കുട്ടി
  rationale: തുടർന്നുള്ള വിശേഷണം മൃഗവർഗം വ്യക്തമാക്കുന്നതിനാൽ, പൊതുവായ ‘കുട്ടി’ എന്നതിനെക്കാൾ സന്ദർഭത്തിൽ വ്യക്തമായ മലയാളപദം ഉപയോഗിക്കുന്നു.
- source_word: υἱὸν ὑποζυγίου
  choice: ചുമട്ടുമൃഗത്തിന്റെ കുഞ്ഞ്
  rationale: ‘മകൻ’ എന്ന സെമിറ്റിക് പ്രയോഗത്തെ മലയാളത്തിൽ അസ്വാഭാവികമായി പകർത്താതെ, ഭാരം വഹിക്കുന്ന മൃഗത്തിന്റെ സന്തതി എന്ന ആശയം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: സെഖര്യാവ് 9:9-ലെ പ്രവാചകവചനവുമായി പൊരുത്തപ്പെടുത്താൻ മത്തായിയുടെ ഗ്രീക്ക് പദക്രമം മാറ്റണമോ
  choice: മത്തായിയുടെ പാഠത്തിലെ ‘സൗമ്യനായി ... കഴുതപ്പുറത്തും ... കഴുതക്കുട്ടിയുടെ പുറത്തും’ എന്ന ഇരട്ട പ്രയോഗം നിലനിർത്തി.
  alternative: പഴയനിയമത്തിലെ പരിചിത രൂപത്തോട് ചേർത്ത് ‘വിനീതനായി’ എന്നു നൽകുകയോ രണ്ട് മൃഗപ്രയോഗങ്ങളെ ഒറ്റ പ്രയോഗമായി ചുരുക്കുകയോ ചെയ്യുക.
  rationale: മശീഹാസംബന്ധിയായ പ്രവാചകപശ്ചാത്തലം പ്രധാനമാണെങ്കിലും, വിവർത്തനം മത്തായിയുടെ യഥാർഥ ഗ്രീക്ക് പാഠത്തെ പ്രതിഫലിപ്പിക്കണം; വ്യാഖ്യാനപരമായി രണ്ടിനെയും ഒറ്റ മൃഗമായി നിർണയിക്കുകയോ രണ്ട് വ്യത്യസ്ത മൃഗങ്ങളായി നിർബന്ധിക്കുകയോ ചെയ്യരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. പ്രവാചക വ്യക്തിവൽക്കരണമായ ‘സീയോൻപുത്രി’ സംരക്ഷിച്ചു; പഴഞ്ചൻ പദപ്രയോഗങ്ങളും വ്യാഖ്യാനപരമായ അതിവിശദീകരണവും ഒഴിവാക്കി.
