  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്ക് വാക്യത്തിലെ സമയബന്ധം മുൻനിർത്തി, ഉടമസ്ഥതയും ‘ഫലങ്ങൾ’ എന്ന ബഹുവചനവും സംരക്ഷിച്ചിരിക്കുന്നു.
