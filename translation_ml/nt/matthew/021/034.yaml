  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτε δὲ ἤγγισεν ὁ καιρὸς τῶν καρπῶν, ἀπέστειλεν τοὺς δούλους αὐτοῦ πρὸς τοὺς γεωργοὺς λαβεῖν τοὺς καρποὺς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/034.yaml
  text: But when the season for the fruits had drawn near[b][a], he sent his servants to the tenant farmers to collect his fruits.
translation:
  language: ml
  text: ഫലകാലം അടുത്തപ്പോൾ, തന്റെ ഫലങ്ങൾ ശേഖരിക്കാൻ അവൻ തന്റെ ദാസന്മാരെ[a] പാട്ടക്കൃഷിക്കാരുടെ[b] അടുക്കൽ അയച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അടിമകളെ.’ ഗ്രീക്കിലെ δοῦλος എന്ന പദത്തിന് ‘ദാസൻ’ എന്നും ‘അടിമ’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘കൃഷിക്കാരുടെ’ അല്ലെങ്കിൽ ‘മുന്തിരിത്തോട്ടം കൃഷി ചെയ്യുന്നവരുടെ.’ ഇവിടെ മറ്റൊരാളുടെ മുന്തിരിത്തോട്ടം ഏറ്റെടുത്തു കൃഷി ചെയ്യുന്നവരെയാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: അടുത്തപ്പോൾ
  rationale: ὅτε എന്ന സമയബന്ധം ‘പ്പോൾ’കൊണ്ട് സ്വാഭാവികമായി നൽകുന്നു; δέ ഇവിടെ നേരിയ ആഖ്യാനബന്ധമാണ്, മലയാളത്തിൽ പ്രത്യേകം പദമാക്കാതെ വാക്യക്രമത്തിൽ പ്രകടമാകുന്നു.
- source_word: ἤγγισεν ὁ καιρὸς τῶν καρπῶν
  choice: ഫലകാലം അടുത്തപ്പോൾ
  rationale: καιρός കാർഷികസന്ദർഭത്തിൽ അനുയോജ്യമായ കാലത്തെ സൂചിപ്പിക്കുന്നു; τῶν καρπῶν എന്ന ബഹുവചനത്തെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ ‘ഫലകാലം’കൊണ്ട് നൽകുന്നു.
- source_word: τοὺς δούλους αὐτοῦ
  choice: തന്റെ ദാസന്മാരെ
  rationale: δοῦλος അടിമയെയോ ദാസനെയോ സൂചിപ്പിക്കാം. ഇവിടെ ഉടമയുടെ പ്രതിനിധികളായി അയക്കപ്പെടുന്നവരെന്ന പങ്കിന് ‘ദാസന്മാർ’ യോജിക്കുന്നു; മറ്റർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: πρὸς τοὺς γεωργοὺς
  choice: പാട്ടക്കൃഷിക്കാരുടെ അടുക്കൽ
  rationale: γεωργός കൃഷിക്കാരനെയാണ് സൂചിപ്പിക്കുന്നത്; ഉപമയുടെ സന്ദർഭത്തിൽ അവർ മറ്റൊരാളുടെ മുന്തിരിത്തോട്ടം ഏറ്റെടുത്തു കൃഷി ചെയ്യുന്നവരായതിനാൽ ‘പാട്ടക്കൃഷിക്കാർ’ അവരുടെ പങ്ക് വ്യക്തമാക്കുന്നു.
- source_word: λαβεῖν τοὺς καρποὺς αὐτοῦ
  choice: തന്റെ ഫലങ്ങൾ വാങ്ങാൻ
  rationale: λαβεῖν എന്നതിന് വാങ്ങുക/സ്വീകരിക്കുക എന്ന അടിസ്ഥാനാർഥമുണ്ട്; αὐτοῦ എന്ന ഉടമസ്ഥതയും καρπούς എന്ന ബഹുവചനവും നേരിട്ട് നിലനിർത്തുന്നു. ഇവിടെ ലഭിക്കേണ്ട വിളവുവിഹിതം സ്വീകരിക്കുന്ന ആശയം സന്ദർഭത്തിൽ വ്യക്തമാകുന്നു.
