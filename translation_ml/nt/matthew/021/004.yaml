  yaml_path: translation/nt/matthew/021/004.yaml
  text: 'This happened so that what was spoken through the prophet might be fulfilled[a], saying:'
translation:
  language: ml
  text: 'പ്രവാചകനിലൂടെ[a] പറയപ്പെട്ടത് നിവൃത്തിയാകേണ്ടതിന് ഇതു സംഭവിച്ചു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പ്രവാചകനാൽ.’ ഗ്രീക്കിൽ അക്ഷരാർത്ഥത്തിൽ ‘പ്രവാചകനിലൂടെ’ എന്നാണ്; വചനം പ്രവാചകൻ മുഖേന അറിയിക്കപ്പെട്ടതാണെന്ന ഭാവം അതിൽ ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο
  choice: ഇതു
  rationale: തൊട്ടുമുമ്പ് വിവരിച്ച സംഭവത്തെ മൊത്തമായി സൂചിപ്പിക്കുന്ന നപുംസക ഏകവചന സർവനാമം; മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഇതു’.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇവിടെ ശക്തമായ വിരോധമല്ല, നേരിയ വിവരണത്തുടർച്ചയാണ് സൂചിപ്പിക്കുന്നത്; മലയാള വാക്യക്രമം തന്നെ ആ ബന്ധം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: γέγονεν
  choice: സംഭവിച്ചു
  rationale: നിവൃത്തി-സൂത്രവാക്യത്തിൽ സംഭവിച്ച കാര്യത്തെ സൂചിപ്പിക്കുന്ന γίνομαιയുടെ പൂർണ്ണകാലരൂപത്തിന് സ്വാഭാവികമായ ആധുനിക മലയാളം.
- source_word: ἵνα πληρωθῇ
  choice: നിവൃത്തിയാകേണ്ടതിന്
  rationale: ἵναയോടുകൂടിയ aorist passive subjunctiveയിലെ ഉദ്ദേശ്യം/ഫലം എന്ന ഭാവവും πληρόωയുടെ തിരുവെഴുത്ത്-നിവൃത്തി അർത്ഥവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: τὸ ῥηθὲν
  choice: അരുളിച്ചെയ്തത്
  rationale: substantival passive participle ആയ ‘പറയപ്പെട്ടത്’ എന്ന ആശയം ദൈവിക പ്രവചനവചനത്തിന്റെ സന്ദർഭത്തിൽ സ്വാഭാവികവും മാന്യവുമായി നൽകുന്നു; കർത്താവിനെ പാഠത്തിൽ കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: διὰ τοῦ προφήτου
  choice: പ്രവാചകനിലൂടെ
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന മധ്യസ്ഥത/agency നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: λέγοντος
  choice: തുടരുന്ന ഉദ്ധരണി പരിചയപ്പെടുത്തുന്ന ദ്വിബിന്ദുവിൽ ഉൾക്കൊള്ളിച്ചു
  rationale: ഗ്രീക്കിൽ ഉദ്ധരണി ആരംഭിപ്പിക്കുന്ന participle; ‘ഇങ്ങനെ പറഞ്ഞത്’ എന്ന ഭാരമുള്ള ആവർത്തനത്തേക്കാൾ മലയാളത്തിൽ ദ്വിബിന്ദു സ്വാഭാവികമായി അതേ പ്രവർത്തനം നിർവഹിക്കുന്നു.
theological_decisions:
- issue: നിവൃത്തി-സൂത്രവാക്യവും പ്രവാചകന്റെ മധ്യസ്ഥതയും
  choice: ‘പ്രവാചകനിലൂടെ അരുളിച്ചെയ്തത് നിവൃത്തിയാകേണ്ടതിന്’
  alternative: ‘പ്രവാചകൻ പറഞ്ഞത് നിവൃത്തിയാകേണ്ടതിന്’
  rationale: മൂലത്തിലെ διὰ τοῦ προφήτου പ്രവാചകനെ വചനത്തിന്റെ മധ്യസ്ഥനായി അവതരിപ്പിക്കുന്നു; വെറും പ്രവാചകന്റെ സ്വന്തം പ്രസ്താവനയായി ചുരുക്കുന്നില്ല. ‘അരുളിച്ചെയ്തത്’ ദൈവിക വചനസന്ദർഭം സൂചിപ്പിച്ചാലും മൂലത്തിൽ വ്യക്തമാക്കാത്ത കർത്താവിനെ ചേർക്കുന്നില്ല.
- issue: ἵναയിലെ ഉദ്ദേശ്യം/ഫലം എന്ന പിരിമുറുക്ക്
  choice: ‘നിവൃത്തിയാകേണ്ടതിന്’
  alternative: ‘നിവൃത്തിയായി’ / ‘നിവൃത്തിയാകാൻ’
  rationale: സംഭവവും തിരുവെഴുത്തിന്റെ നിവൃത്തിയും തമ്മിലുള്ള ലക്ഷ്യബന്ധം നിലനിർത്തുന്നു; അതിനെ വെറും ശേഷഫലമായി മാത്രം തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ ലളിതമായെങ്കിലും തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള മലയാളം. ‘അരുളിച്ചെയ്തത്’ ദൈവിക പ്രസംഗസന്ദർഭത്തിൽ സ്വാഭാവികമാണ്; വാക്യാവസാനത്തെ ദ്വിബിന്ദു അടുത്ത വാക്യത്തിലെ പ്രവാചക ഉദ്ധരണി ആരംഭിക്കുന്ന λέγοντοςന്റെ പ്രവർത്തനം വഹിക്കുന്നു. അടിക്കുറിപ്പ് സൂചിക [a] മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
