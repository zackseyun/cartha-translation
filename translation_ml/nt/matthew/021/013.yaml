id: MAT.21.13
reference: Matthew 21:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Γέγραπται· Ὁ οἶκός μου οἶκος προσευχῆς κληθήσεται, ὑμεῖς δὲ αὐτὸν ⸀ποιεῖτε σπήλαιον λῃστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/013.yaml
  text: And he says to them[a], “It is written[b], ‘My house will be called a house of prayer,’ but you are making it a den of robbers.”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറയുന്നു: “എഴുതപ്പെട്ടിരിക്കുന്നു: ‘എന്റെ ഭവനം പ്രാർഥനാഭവനം എന്നു വിളിക്കപ്പെടും.’ എന്നാൽ നിങ്ങളോ അതിനെ കവർച്ചക്കാരുടെ[b] ഗുഹയാക്കുന്നു.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ യേശു യെശയ്യാവ് 56:7-ഉം യിരെമ്യാവ് 7:11-ഉം ചേർത്തുപയോഗിക്കുന്നു.
    reason: cross_reference
  - marker: b
    text: ‘കവർച്ചക്കാർ’ എന്നതിന് ‘കൊള്ളക്കാർ’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്ക് പദം കവർച്ചക്കാരെയോ അക്രമികളായ കൊള്ളസംഘങ്ങളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: പറയുന്നു
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാല ആഖ്യാനരൂപം നിലനിർത്തി മത്തായിയുടെ വിവരണത്തിലെ സജീവത സംരക്ഷിക്കുന്നു.
- source_word: Γέγραπται
  choice: എഴുതപ്പെട്ടിരിക്കുന്നു
  rationale: തിരുവെഴുത്ത് ഉദ്ധരിക്കുന്ന പൂർണകാല കർമണിപ്രയോഗത്തിന്റെ നിലനിൽക്കുന്ന പ്രാബല്യം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: οἶκός μου
  choice: എന്റെ ഭവനം
  rationale: ‘ദേവാലയം’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ, ഉദ്ധരണിയിലെ ‘എന്റെ ഭവനം’ എന്ന ദൈവിക അവകാശവാദം നിലനിർത്തുന്നു.
- source_word: οἶκος προσευχῆς
  choice: പ്രാർഥനാഭവനം
  rationale: ഗുണവിശേഷകബന്ധം സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുകയും യെശയ്യാവിലെ ഉദ്ധരണിയുടെ രൂപം തിരിച്ചറിയാവുന്നതാക്കുകയും ചെയ്യുന്നു.
- source_word: κληθήσεται
  choice: വിളിക്കപ്പെടും
  rationale: ഭാവികാല കർമണിരൂപം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: ποιεῖτε
  choice: ഗുഹയാക്കുന്നു
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാല പ്രവർത്തനം നിലനിർത്തുന്നു; ‘ആക്കി’ എന്ന പൂർത്തിയായ പ്രവൃത്തിയായി മാറ്റുന്നില്ല.
- source_word: σπήλαιον
  choice: ഗുഹ
  rationale: കവർച്ചക്കാർ അഭയം പ്രാപിക്കുന്ന ഒളിത്താവളം എന്ന രൂപകവും യിരെമ്യാവ് 7:11-ലെ പ്രതിധ്വനിയും സംരക്ഷിക്കുന്നു.
- source_word: λῃστῶν
  choice: കവർച്ചക്കാരുടെ
  rationale: മോഷണം മാത്രമല്ല, ബലപ്രയോഗത്തോടെയുള്ള കൊള്ളയും സൂചിപ്പിക്കാവുന്ന പദം; മറ്റൊരു സാധ്യമായ അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: പഴയനിയമ ഉദ്ധരണിയും സൂചനയും
  choice: യെശയ്യാവ് 56:7-ലെ ‘എന്റെ ഭവനം പ്രാർഥനാഭവനം എന്നു വിളിക്കപ്പെടും’ എന്ന ഉദ്ധരണിയും യിരെമ്യാവ് 7:11-ലെ ‘കവർച്ചക്കാരുടെ ഗുഹ’ എന്ന സൂചനയും തിരിച്ചറിയാവുന്ന വിധത്തിൽ നിലനിർത്തി.
  alternative: ആധുനിക സ്വതന്ത്ര പദപ്രയോഗം ഉപയോഗിച്ച് ഈ അന്തർപാഠബന്ധങ്ങൾ മങ്ങിക്കുക.
  rationale: യേശുവിന്റെ വാക്കുകൾ ഈ രണ്ട് തിരുവെഴുത്തുഭാഗങ്ങളെ ചേർത്തുപയോഗിക്കുന്നതിനാൽ അവയുടെ ബന്ധം വിവർത്തനത്തിൽ സുതാര്യമായി നിലനിൽക്കണം.
- issue: ὑμεῖς δὲ എന്ന വിരോധാത്മക ഊന്നൽ
  choice: ‘എന്നാൽ നിങ്ങളോ’
  alternative: ‘എന്നാൽ നിങ്ങൾ’
  rationale: ദൈവത്തിന്റെ ഭവനത്തിനുള്ള പ്രഖ്യാപിത ഉദ്ദേശ്യവും അഭിസംബോധിതരുടെ പ്രവൃത്തിയും തമ്മിലുള്ള ഗ്രീക്ക് വിരോധവും ‘നിങ്ങൾ’ എന്ന ഊന്നലും പ്രകടമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. തിരുവെഴുത്ത് ഉദ്ധരണിയുടെ ഗൗരവം നിലനിർത്താൻ ‘ഭവനം’, ‘എഴുതപ്പെട്ടിരിക്കുന്നു’ എന്നീ രൂപങ്ങൾ ഉപയോഗിച്ചു; അതേസമയം ദുഷ്കരമായ പുരാതന പ്രയോഗങ്ങൾ ഒഴിവാക്കി. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും അവ വിശദീകരിക്കുന്ന വാചകഭാഗങ്ങൾക്ക് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
