id: MAT.21.40
reference: Matthew 21:40
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅταν οὖν ἔλθῃ ὁ κύριος τοῦ ἀμπελῶνος, τί ποιήσει τοῖς γεωργοῖς ἐκείνοις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/040.yaml
  text: Therefore[a], when the owner of the vineyard comes[b], what will he do to those farmers?
translation:
  language: ml
  text: അതുകൊണ്ട്, മുന്തിരിത്തോട്ടത്തിന്റെ ഉടമ[a] വരുമ്പോൾ, ആ കൃഷിക്കാരോട്[b] അദ്ദേഹം എന്തു ചെയ്യും?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മുന്തിരിത്തോട്ടത്തിന്റെ യജമാനൻ.’ ഗ്രീക്കിലെ κύριος എന്ന പദം പലപ്പോഴും ‘കർത്താവ്’ എന്നും പരിഭാഷപ്പെടുത്തുന്നു; എന്നാൽ ഇവിടെ ഉപമയ്ക്കുള്ളിൽ അത് മുന്തിരിത്തോട്ടത്തിന്റെ ഉടമയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ആ പാട്ടക്കൃഷിക്കാരോട്.’ ഉപമയുടെ വിപുലമായ സന്ദർഭത്തിൽ അവർ മുന്തിരിത്തോട്ടം പാട്ടത്തിനെടുത്തവരാണ്; എന്നാൽ γεωργός എന്ന ഗ്രീക്കുപദം കൂടുതൽ പൊതുവായി ‘കൃഷിക്കാരൻ’ അഥവാ ‘കൃഷി ചെയ്യുന്നവൻ’ എന്നാണ് അർത്ഥമാക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: വരുമ്പോൾ
  rationale: ഉപവാക്യത്തിലെ ἔλθῃയോടൊപ്പം പ്രതീക്ഷിക്കപ്പെടുന്ന ഭാവിസന്ദർഭത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘വരുമ്പോൾ’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുമ്പുള്ള ഉപമാവിവരണത്തിൽനിന്ന് യേശുവിന്റെ ചോദ്യത്തിലേക്കുള്ള നിഗമനബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: ἔλθῃ
  choice: വരുമ്പോൾ
  rationale: ὅταν സഹിതമുള്ള aorist subjunctive ഇവിടെ ഭാവിയിൽ പ്രതീക്ഷിക്കുന്ന വരവിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ കാലവാചകഘടനയിൽ ‘വരുമ്പോൾ’ യോജിക്കുന്നു.
- source_word: κύριος
  choice: ഉടമ
  rationale: ἀμπελῶνος എന്ന ജനിറ്റീവിനോടും ഉപമയുടെ സാഹചര്യത്തോടും ചേർന്ന് ഇത് മുന്തിരിത്തോട്ടത്തിന്റെ അവകാശിയെയോ അധിപനെയോ സൂചിപ്പിക്കുന്നു; ഇവിടെ ദൈവിക ബിരുദമായ ‘കർത്താവ്’ എന്നു നൽകുന്നത് അനാവശ്യമായ അർത്ഥച്ചായം വരുത്താം.
- source_word: ἀμπελῶνος
  choice: മുന്തിരിത്തോട്ടത്തിന്റെ
  rationale: ἀμπελών എന്ന കൃഷിപദത്തിന്റെ സാധാരണവും വ്യക്തവുമായ മലയാള പരിഭാഷ.
- source_word: τί ποιήσει
  choice: എന്തു ചെയ്യും
  rationale: ഭാവികാലത്തിലുള്ള ചോദ്യം ഉടമ കൈക്കൊള്ളാനിരിക്കുന്ന നടപടിയെ ചോദിക്കുന്നു.
- source_word: γεωργοῖς
  choice: കൃഷിക്കാരോട്
  rationale: γεωργός അടിസ്ഥാനമായി കൃഷിക്കാരനെയോ കൃഷി ചെയ്യുന്നവനെയോ സൂചിപ്പിക്കുന്നു. ഉപമയുടെ വിപുലസന്ദർഭത്തിൽ അവർ പാട്ടക്കൃഷിക്കാരാണെങ്കിലും ആ ആശയം ഈ പദത്തിൽ മാത്രം വ്യക്തമായി അടങ്ങിയിട്ടില്ല.
- source_word: ἐκείνοις
  choice: ആ
  rationale: പ്രസ്തുത കൃഷിക്കാരെ പ്രത്യേകമായി ചൂണ്ടിക്കാണിക്കുന്ന ഗ്രീക്ക് നിർദേശകസർവനാമത്തിന്റെ അകലം കലർന്ന സൂചന സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഉപമാസന്ദർഭത്തിലെ κύριος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ഉടമ
  alternative: കർത്താവ്; യജമാനൻ
  rationale: ഈ വാക്യത്തിന്റെ കഥാലോകത്തിൽ പദം മുന്തിരിത്തോട്ടത്തിന്റെ ഉടമയെ സൂചിപ്പിക്കുന്നു. ‘ഉടമ’ എന്നത് നേരിട്ടുള്ള അർത്ഥം വ്യക്തമാക്കുകയും വാക്യം സ്വയം പ്രകടമാക്കാത്ത ക്രിസ്തുശാസ്ത്രപരമായ ബിരുദാർഥം ഇറക്കുമതി ചെയ്യാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ചോദ്യവാക്യം. ‘അദ്ദേഹം’ ഉടമയെ ആദരസൂചകമായി പരാമർശിക്കുന്നു; ‘ആ കൃഷിക്കാരോട്’ എന്ന ദത്തിവിഭക്തി അവരോടു നടത്താനിരിക്കുന്ന നടപടിയുടെ ദിശ വ്യക്തമാക്കുന്നു.
