id: MAT.21.14
reference: Matthew 21:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ προσῆλθον αὐτῷ ⸂τυφλοὶ καὶ χωλοὶ⸃ ἐν τῷ ἱερῷ, καὶ ἐθεράπευσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/014.yaml
  text: And the blind and the lame came to him in the temple[a], and he healed them.
translation:
  language: ml
  text: ദേവാലയത്തിൽ[a] കാഴ്ചയില്ലാത്തവരും കാലിന് വൈകല്യമുള്ളവരും അവന്റെ അടുക്കൽ വന്നു; അവൻ അവരെ സൗഖ്യമാക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിലെ ἱερόν എന്ന പദം അകത്തെ വിശുദ്ധമന്ദിരത്തെ മാത്രമല്ല, ദേവാലയസമുച്ചയത്തെയോ അതിന്റെ അങ്കണങ്ങളെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθον αὐτῷ
  choice: അവന്റെ അടുക്കൽ വന്നു
  rationale: προσέρχομαι എന്ന ക്രിയയും ദത്തിവിലുള്ള αὐτῷ എന്ന സർവനാമവും ചേർന്ന് യേശുവിന്റെ അടുത്തേക്കുള്ള വരവ് സൂചിപ്പിക്കുന്നു. ഈ പ്രയോഗം ആ ചലനവും വ്യക്തിബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τυφλοὶ
  choice: കാഴ്ചയില്ലാത്തവർ
  rationale: നാമമായി ഉപയോഗിച്ചിരിക്കുന്ന ബഹുവചന വിശേഷണമാണ്; വ്യക്തികളെ മാന്യമായ ആധുനിക ഭാഷയിൽ സൂചിപ്പിക്കാൻ ഈ രൂപം തിരഞ്ഞെടുത്തു.
- source_word: χωλοὶ
  choice: നടക്കാൻ കഴിയാത്തവർ
  rationale: നടക്കുന്നതിൽ ഗുരുതരമായ വൈകല്യമുള്ളവരെ സൂചിപ്പിക്കുന്ന substantival adjective ആണ്. അപമാനകരമായി കേൾക്കാവുന്ന പഴയ പദങ്ങൾ ഒഴിവാക്കി അർഥം വ്യക്തമായി നൽകി.
- source_word: ἐν τῷ ἱερῷ
  choice: ദേവാലയാങ്കണത്തിൽവെച്ച്
  rationale: ἱερόν അകത്തെ വിശുദ്ധമന്ദിരത്തെ മാത്രമല്ല, വിശാലമായ ദേവാലയസമുച്ചയത്തെയോ അങ്കണങ്ങളെയോ സൂചിപ്പിക്കുന്നു. സംഭവസ്ഥലത്തിന്റെ ഈ പരിധി മലയാളത്തിൽ നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: ἐθεράπευσεν αὐτούς
  choice: അവൻ അവരെ സൗഖ്യമാക്കി
  rationale: സുവിശേഷങ്ങളിലെ രോഗശാന്തിസന്ദർഭത്തിൽ θεραπεύω എന്നതിന്റെ സാധാരണ അർഥം കൃത്യമായും മാന്യമായും നൽകുന്നു.
theological_decisions:
- issue: ἱερόν സൂചിപ്പിക്കുന്ന രോഗശാന്തിയുടെ സ്ഥലം
  choice: യേശു അവരെ വിശാലമായ ദേവാലയാങ്കണത്തിൽ സൗഖ്യമാക്കി
  alternative: യേശു അവരെ ദേവാലയത്തിൽ സൗഖ്യമാക്കി
  rationale: ἱερόν സാധാരണയായി ναός എന്ന അകത്തെ വിശുദ്ധമന്ദിരത്തിൽനിന്ന് വ്യത്യസ്തമായി മുഴുവൻ ദേവാലയസമുച്ചയത്തെയാണ് സൂചിപ്പിക്കുന്നത്. അതിനാൽ അകത്തെ വിശുദ്ധസ്ഥാനത്തേക്കുള്ള പ്രവേശനം അനാവശ്യമായി സൂചിപ്പിക്കാതെ സ്ഥലപരമായ സൂക്ഷ്മത നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. വ്യക്തികളെ വൈകല്യത്തിന്റെ പേരിൽ നാമകരണം ചെയ്യുന്നതിനു പകരം വ്യക്തികേന്ദ്രിതമായ വിവരണം ഉപയോഗിച്ചു; മൂലപാഠത്തിന്റെ സംക്ഷിപ്തതയും സംഭവക്രമവും നിലനിർത്തി.
