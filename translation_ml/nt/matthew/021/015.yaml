id: MAT.21.15
reference: Matthew 21:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς τὰ θαυμάσια ἃ ἐποίησεν καὶ τοὺς παῖδας ⸀τοὺς κράζοντας ἐν τῷ ἱερῷ καὶ λέγοντας· Ὡσαννὰ τῷ υἱῷ Δαυίδ ἠγανάκτησαν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/015.yaml
  text: But when the chief priests and the scribes saw the wonderful things that he did[a], and the children crying out in the temple and saying[b], “Hosanna to the Son of David,” they were indignant.
translation:
  language: ml
  text: എന്നാൽ മുഖ്യപുരോഹിതന്മാരും ശാസ്ത്രിമാരും അവൻ ചെയ്ത അത്ഭുതകരമായ കാര്യങ്ങളും ദേവാലയത്തിൽ[a] “ദാവീദിന്റെ പുത്രന് ഹോശന്നാ!”[b] എന്നു വിളിച്ചുപറയുന്ന കുട്ടികളെയും കണ്ടപ്പോൾ അവർ ക്ഷുഭിതരായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘ദേവാലയം’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ഗ്രീക്ക് പദം ആന്തരിക വിശുദ്ധമന്ദിരത്തെ മാത്രം അല്ല, ദേവാലയസമുച്ചയത്തെയും അതിന്റെ പ്രാകാരങ്ങളെയും സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: b
    text: ‘ഹോശന്നാ’ എന്നത് എബ്രായഭാഷയിൽ നിന്നുള്ള ഒരു ഘോഷമാണ്; അതിന്റെ മൂലാർഥം ‘രക്ഷിക്കണമേ’ അല്ലെങ്കിൽ ‘ഇപ്പോൾ രക്ഷിക്കണമേ’ എന്നതാണ്. എന്നാൽ ഈ സന്ദർഭത്തിൽ അത് സ്തുതിഘോഷമായും പ്രവർത്തിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: കണ്ടപ്പോൾ
  rationale: പ്രധാനക്രിയയ്ക്ക് സാഹചര്യമായ കാലബന്ധം സൂചിപ്പിക്കുന്ന aorist participle; സ്വാഭാവിക മലയാളത്തിൽ ‘കണ്ടപ്പോൾ’ അതിന്റെ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭത്തോടുള്ള മൃദുവായ വൈരുധ്യം സൂചിപ്പിക്കുന്നു.
- source_word: ἀρχιερεῖς
  choice: മുഖ്യപുരോഹിതന്മാർ
  rationale: ഒരൊറ്റ മഹാപുരോഹിതനെ അല്ല, പുരോഹിതനേതൃത്വത്തിലുള്ള പ്രമുഖരെ സൂചിപ്പിക്കുന്ന ബഹുവചനം.
- source_word: γραμματεῖς
  choice: ശാസ്ത്രിമാർ
  rationale: തിരുവെഴുത്തും ന്യായപ്രമാണവും പകർത്തെഴുതുകയും വ്യാഖ്യാനിക്കുകയും ചെയ്ത വിദഗ്ധർക്കുള്ള സ്ഥാപിതവും സംക്ഷിപ്തവുമായ പദം.
- source_word: τὰ θαυμάσια
  choice: അത്ഭുതകരമായ കാര്യങ്ങൾ
  rationale: അതിശയകരമായ പ്രവൃത്തികളെ പൊതുവായി സൂചിപ്പിക്കുന്നു; ‘അത്ഭുതങ്ങൾ’ എന്നു മാത്രം നൽകി അർഥം അനാവശ്യമായി സാങ്കേതികമാക്കുന്നില്ല.
- source_word: ἐποίησεν
  choice: അവൻ ചെയ്ത
  rationale: ലളിതമായ aorist ക്രിയയും വിശാലാർഥമുള്ള കർമ്മപദവും സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: παῖδας
  choice: കുട്ടികൾ
  rationale: ഈ സന്ദർഭത്തിൽ ‘ദാസന്മാർ’ എന്നതിനെക്കാൾ ‘കുട്ടികൾ’ എന്ന അർഥമാണ് യോജിച്ചത്; ലിംഗം അനാവശ്യമായി പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: κράζοντας
  choice: വിളിച്ചുപറയുന്ന
  rationale: ഉച്ചത്തിലുള്ള പരസ്യപ്രഖ്യാപനം സൂചിപ്പിക്കുന്നു; ശത്രുതയുടെ ഭാവം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: ἐν τῷ ἱερῷ
  choice: ദേവാലയത്തിൽ
  rationale: ἱερόν ആന്തരിക വിശുദ്ധമന്ദിരത്തെ മാത്രം അല്ല, വിശാലമായ ദേവാലയസമുച്ചയത്തെ സൂചിപ്പിക്കുന്നു; ഈ വിവരം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: λέγοντας
  choice: എന്നു
  rationale: കുട്ടികൾ വിളിച്ചുപറഞ്ഞ വാക്കുകളെ മലയാളത്തിൽ സ്വാഭാവികമായ ഉദ്ധരണിഘടനയിൽ ബന്ധിപ്പിക്കുന്നു.
- source_word: Ὡσαννὰ
  choice: ഹോശന്നാ
  rationale: ഗ്രീക്കിൽ നിലനിർത്തിയ സെമിറ്റിക് ആരാധനാഘോഷത്തെ ലിപ്യന്തരണം ചെയ്യുന്നു; രക്ഷയ്ക്കായുള്ള അപേക്ഷയും സ്തുതിഘോഷവും തമ്മിലുള്ള അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: τῷ υἱῷ Δαυίδ
  choice: ദാവീദിന്റെ പുത്രന്
  rationale: ദത്തിവ് ഘടനയും മത്തായിയിലെ മശീഹാപരമായ പദവിയും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: ἠγανάκτησαν
  choice: അവർ ക്ഷുഭിതരായി
  rationale: ശക്തമായ അസന്തോഷവും രോഷവും പ്രകടിപ്പിക്കുന്ന ക്രിയയ്ക്ക് ഗൗരവമുള്ള, സ്വാഭാവിക മലയാളം.
theological_decisions:
- issue: ‘ദാവീദിന്റെ പുത്രൻ’ എന്ന പദവിയുടെ മശീഹാപരമായ പ്രാധാന്യം
  choice: ദാവീദിന്റെ പുത്രന്
  alternative: ദാവീദിന്റെ അവകാശിക്ക്; ദാവീദിന്റെ മകന്
  rationale: മത്തായിയിൽ അംഗീകൃത മശീഹാപദവിയായി പ്രവർത്തിക്കുന്ന മൂലരൂപം നിലനിർത്തുന്നു; വ്യാഖ്യാനപരമായ പരാവർത്തനം അതിന്റെ കഥാപരവും ദൈവശാസ്ത്രപരവുമായ ശക്തി കുറയ്ക്കും.
- issue: Ὡσαννάയുടെ ഇരട്ട അർഥഭാവം
  choice: ഹോശന്നാ
  alternative: രക്ഷിക്കണമേ; ഇപ്പോൾ രക്ഷിക്കണമേ
  rationale: ഈ പദം രക്ഷയ്ക്കായുള്ള അപേക്ഷയിൽ വേരൂന്നിയതും ഇവിടെ സ്തുതിഘോഷമായി പ്രവർത്തിക്കുന്നതുമാണ്. ലിപ്യന്തരണം ഈ ഉദ്ദേശപൂർവമായ അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു; വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘ശാസ്ത്രിമാർ’, ‘ദാവീദിന്റെ പുത്രൻ’, ‘ഹോശന്നാ’ എന്നീ സ്ഥാപിത ബൈബിൾപദങ്ങൾ നിലനിർത്തി; അപരിചിതമായ അർഥവശങ്ങൾ അടിക്കുറിപ്പുകളിൽ വിശദീകരിച്ചു.
