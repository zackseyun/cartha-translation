translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സംഭാഷണശൈലി സ്വീകരിച്ചു. ഗ്രീക്കിലെ നീണ്ട വാക്യഘടന വായനാസൗകര്യത്തിനായി രണ്ട് മലയാളവാക്യങ്ങളാക്കി; പരസ്പരതയും നിബന്ധനയും അധികാരത്തെക്കുറിച്ചുള്ള തുറന്ന ചോദ്യവും സംരക്ഷിച്ചു.
