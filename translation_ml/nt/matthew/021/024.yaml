id: MAT.21.24
reference: Matthew 21:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Ἐρωτήσω ὑμᾶς κἀγὼ λόγον ἕνα, ὃν ἐὰν εἴπητέ μοι κἀγὼ ὑμῖν ἐρῶ ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/024.yaml
  text: But Jesus answered them[a], “I also will ask you one question, which if you tell me, I also will tell you by what authority I do these things.”
translation:
  language: ml
  text: 'എന്നാൽ യേശു അവരോടു മറുപടി പറഞ്ഞു: “ഞാനും നിങ്ങളോട് ഒരു ചോദ്യം ചോദിക്കാം.[a] അതിന് നിങ്ങൾ എന്നോട് ഉത്തരം പറഞ്ഞാൽ, എന്ത് അധികാരത്താലാണ് ഞാൻ ഇവ ചെയ്യുന്നതെന്ന് ഞാനും നിങ്ങളോടു പറയാം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഒരു കാര്യം”; കൂടുതൽ അക്ഷരാർഥത്തിൽ “ഒരു വാക്ക്.” ഗ്രീക്കിലെ λόγον ἕνα ചർച്ചയിലുള്ള ഒരു ചോദ്യത്തെയോ കാര്യത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: എന്നാൽ യേശു അവരോടു മറുപടി പറഞ്ഞു
  rationale: ἀποκριθεὶς ... εἶπεν എന്ന ഗ്രീക്ക് വിവരണപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി ഒറ്റ മറുപടിപ്രയോഗമായി നൽകി; δέയുടെ നേരിയ വൈരുധ്യഭാവം ‘എന്നാൽ’ സൂചിപ്പിക്കുന്നു.
- source_word: Ἐρωτήσω ὑμᾶς κἀγὼ
  choice: ഞാനും നിങ്ങളോട് ... ചോദിക്കാം
  rationale: κἀγώയിലെ പരസ്പരപ്രതികരണ ഊന്നൽ ‘ഞാനും’ നിലനിർത്തുന്നു. ഭാവിക്രിയയായ Ἐρωτήσω ഇവിടെ സംഭാഷണത്തിലെ നിർദ്ദേശസ്വഭാവമുള്ള സ്വാഭാവിക മലയാളത്തിൽ ‘ചോദിക്കാം’ എന്നു നൽകി.
- source_word: λόγον ἕνα
  choice: ഒരു ചോദ്യം
  rationale: λόγος അക്ഷരാർഥത്തിൽ ‘വാക്ക്’ എന്നും വിശാലമായി ‘കാര്യം’ എന്നും വരാമെങ്കിലും, ഈ ചോദ്യം-മറുപടി സാഹചര്യത്തിൽ ‘ചോദ്യം’ അർഥം ഏറ്റവും വ്യക്തവും സ്വാഭാവികവുമാണ്; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: ὃν ἐὰν εἴπητέ μοι
  choice: അതിന് നിങ്ങൾ എന്നോട് ഉത്തരം പറഞ്ഞാൽ
  rationale: അക്ഷരാർഥമായ ‘അത് എന്നോടു പറഞ്ഞാൽ’ എന്നതിനെക്കാൾ സന്ദർഭത്തിലെ ആവശ്യപ്പെട്ട പ്രതികരണം മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കാൻ ‘ഉത്തരം പറഞ്ഞാൽ’ ഉപയോഗിച്ചു; നിബന്ധന നിലനിർത്തി.
- source_word: κἀγὼ ὑμῖν ἐρῶ
  choice: ഞാനും നിങ്ങളോടു പറയാം
  rationale: രണ്ടാമത്തെ κἀγώയുടെ പരസ്പരത ‘ഞാനും’ എന്ന ആവർത്തനത്തിലൂടെ സംരക്ഷിച്ചു.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: എന്ത് അധികാരത്താലാണ്
  rationale: ἐν ഇവിടെ പ്രവർത്തനത്തിന്റെ അധികാരാധാരം സൂചിപ്പിക്കുന്നു; ‘അധികാരത്താൽ’ മലയാളത്തിൽ അതിനെ കൃത്യമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ταῦτα ποιῶ
  choice: ഞാൻ ഇവ ചെയ്യുന്നത്
  rationale: ταῦταയുടെ ബഹുവചനസൂചന ‘ഇവ’ നിലനിർത്തുന്നു; വർത്തമാനകാലം വിവാദത്തിലുള്ള യേശുവിന്റെ പ്രവൃത്തികളെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
