id: MAT.21.12
reference: Matthew 21:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ εἰσῆλθεν ⸀Ἰησοῦς εἰς τὸ ⸀ἱερόν, καὶ ἐξέβαλεν πάντας τοὺς πωλοῦντας καὶ ἀγοράζοντας ἐν τῷ ἱερῷ καὶ τὰς τραπέζας τῶν κολλυβιστῶν κατέστρεψεν καὶ τὰς καθέδρας τῶν πωλούντων τὰς περιστεράς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/012.yaml
  text: And Jesus entered the temple courts and drove out all those selling and buying in the temple courts[a], and he overturned the tables of the money changers and the seats of those selling doves.
translation:
  language: ml
  text: യേശു ദേവാലയാങ്കണത്തിൽ പ്രവേശിച്ച്, അവിടെ വിൽക്കുകയും വാങ്ങുകയും ചെയ്തിരുന്ന എല്ലാവരെയും പുറത്താക്കി.[a] നാണയം മാറ്റിക്കൊടുക്കുന്നവരുടെ മേശകളും പ്രാവുകളെ വിൽക്കുന്നവരുടെ ഇരിപ്പിടങ്ങളും അവൻ മറിച്ചിട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ദേവാലയത്തിൽ’ അല്ലെങ്കിൽ ‘ദേവാലയസമുച്ചയത്തിൽ’; ഗ്രീക്ക് പദം അകത്തെ വിശുദ്ധമന്ദിരത്തെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നതല്ല, വിശാലമായ ദേവാലയസമുച്ചയത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερόν
  choice: ദേവാലയാങ്കണം
  rationale: ἱερόν ഇവിടെ അകത്തെ വിശുദ്ധമന്ദിരത്തെ (ναός) അല്ല, വാണിജ്യപ്രവർത്തനം നടന്നിരുന്ന വിശാലമായ ദേവാലയസമുച്ചയത്തെയോ അങ്കണങ്ങളെയോ സൂചിപ്പിക്കുന്നു. ‘ദേവാലയാങ്കണം’ ഈ സ്ഥലപരമായ വ്യത്യാസം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἐξέβαλεν
  choice: പുറത്താക്കി
  rationale: ബലത്തോടെയും നിർണായകമായും പുറത്താക്കുന്ന പ്രവൃത്തിയാണ് ക്രിയ സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ‘പുറത്താക്കി’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: πάντας
  choice: എല്ലാവരെയും
  rationale: വിൽക്കുകയും വാങ്ങുകയും ചെയ്തിരുന്നവരെ മുഴുവനായി ഉൾപ്പെടുത്തുന്ന ഗ്രീക്ക് പദത്തിന്റെ വ്യാപ്തി വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: τοὺς πωλοῦντας καὶ ἀγοράζοντας
  choice: വിൽക്കുകയും വാങ്ങുകയും ചെയ്തിരുന്ന എല്ലാവരെയും
  rationale: വർത്തമാനകാല കൃദന്തരൂപങ്ങൾ അവിടെ ആ പ്രവൃത്തികളിൽ ഏർപ്പെട്ടിരുന്നവരെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ഈ രൂപം അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τράπεζας
  choice: മേശകൾ
  rationale: സന്ദർഭത്തിൽ നാണയമാറ്റത്തിനായി ഉപയോഗിച്ചിരുന്നവയാണെങ്കിലും, മൂലപദത്തിന്റെ സാധാരണ അർത്ഥമായ ‘മേശകൾ’ നിലനിർത്തുന്നു.
- source_word: κολλυβιστῶν
  choice: നാണയം മാറ്റിക്കൊടുക്കുന്നവർ
  rationale: വ്യത്യസ്ത നാണയങ്ങൾ കൈമാറ്റം ചെയ്തിരുന്നവരെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ഈ പ്രയോഗം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: κατέστρεψεν
  choice: മറിച്ചിട്ടു
  rationale: മേശകളും ഇരിപ്പിടങ്ങളും തലകീഴായി മറിക്കുന്ന പ്രവൃത്തിയെ സ്വാഭാവികവും ദൃശ്യവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; അനാവശ്യമായി നശിപ്പിച്ചു എന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: καθέδρας
  choice: ഇരിപ്പിടങ്ങൾ
  rationale: ‘ഇരിപ്പിടങ്ങൾ’ എന്നത് കസേരകൾ ഉൾപ്പെടെയുള്ള ഇരിക്കാനുള്ള സംവിധാനങ്ങളെ സൂചിപ്പിക്കുന്ന വിശാലവും ഗൗരവമുള്ളതുമായ പദമാണ്.
- source_word: περιστεράς
  choice: പ്രാവുകൾ
  rationale: യാഗസന്ദർഭത്തിൽ ഉപയോഗിച്ചിരുന്ന dove/pigeon വിഭാഗത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘പ്രാവുകൾ’ എന്നു പറയുന്നു.
theological_decisions:
- issue: ἱερόν എന്ന പദവുമായി ബന്ധപ്പെട്ട യേശുവിന്റെ പ്രവർത്തനസ്ഥലം
  choice: യേശു അകത്തെ വിശുദ്ധമന്ദിരത്തിലല്ല, ദേവാലയത്തിന്റെ വിശാലമായ അങ്കണപ്രദേശത്താണ് പ്രവേശിച്ചത്.
  alternative: സ്ഥലവ്യത്യാസം വ്യക്തമാക്കാതെ പൊതുവായി ‘ദേവാലയം’ എന്നു പരിഭാഷപ്പെടുത്തുക.
  rationale: ἱερόν എന്നതും ναός എന്നതും തമ്മിലുള്ള സ്ഥലപരമായ വ്യത്യാസം ചരിത്രപരമായി പ്രസക്തമാണ്. ‘ദേവാലയാങ്കണം’ എന്ന പരിഭാഷ വാണിജ്യപ്രവർത്തനം നടന്ന പ്രദേശത്തെ സൂചിപ്പിക്കുകയും യേശു അകത്തെ വിശുദ്ധമന്ദിരത്തിൽ പ്രവേശിച്ചു എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവവും ലാളിത്യവും പുലർത്തുന്ന മലയാളം. ഗ്രീക്ക് വാക്യത്തിന്റെ പ്രവർത്തനക്രമവും ‘എല്ലാവരെയും’ എന്ന വ്യാപ്തിയും നിലനിർത്തിയപ്പോൾ, വായനാസൗകര്യത്തിനായി വാക്യം രണ്ടായി വിഭജിച്ചു.
