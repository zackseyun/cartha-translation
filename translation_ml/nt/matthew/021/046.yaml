id: MAT.21.46
reference: Matthew 21:46
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ζητοῦντες αὐτὸν κρατῆσαι ἐφοβήθησαν τοὺς ὄχλους, ⸂ἐπεὶ εἰς⸃ προφήτην αὐτὸν εἶχον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/046.yaml
  text: And although they were seeking to arrest him[a], they feared the crowds, because they regarded him as a prophet.
translation:
  language: ml
  text: അവർ അവനെ പിടികൂടാൻ ശ്രമിച്ചെങ്കിലും, ജനക്കൂട്ടങ്ങളെ ഭയപ്പെട്ടു; കാരണം, ജനക്കൂട്ടങ്ങൾ അവനെ ഒരു പ്രവാചകനായി കരുതിയിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζητοῦντες
  choice: ശ്രമിച്ചെങ്കിലും
  rationale: 'വർത്തമാനകാല കൃദന്തരൂപം തുടരുന്ന ഉദ്ദേശ്യത്തെയും മുഖ്യക്രിയയോടുള്ള സന്ദർഭസിദ്ധമായ വിരുദ്ധബന്ധത്തെയും സൂചിപ്പിക്കുന്നു: പിടികൂടാൻ ശ്രമിച്ചു, എങ്കിലും ഭയം അവരെ തടഞ്ഞു.'
- source_word: κρατῆσαι
  choice: പിടികൂടാൻ
  rationale: ഈ ശത്രുതാപരമായ സന്ദർഭത്തിൽ വെറും സ്പർശിക്കുകയോ പിടിക്കുകയോ എന്നതിലുപരി ബലമായി കസ്റ്റഡിയിലെടുക്കാനുള്ള ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു. ‘പിടികൂടുക’ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐφοβήθησαν
  choice: ഭയപ്പെട്ടു
  rationale: അയോറിസ്റ്റ് ക്രിയയെ ലളിതമായ ഭൂതകാലത്തിൽ അവതരിപ്പിച്ച്, ആരംഭഭാവം അനാവശ്യമായി ചേർക്കാതെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു.
- source_word: τοὺς ὄχλους
  choice: ജനക്കൂട്ടങ്ങളെ
  rationale: മൂലത്തിലെ ബഹുവചനം നിലനിർത്തുകയും കൂടിയിരുന്ന വിവിധ ജനസമൂഹങ്ങളെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐπεὶ εἰς
  choice: കാരണം
  rationale: അവരുടെ ഭയത്തിന്റെ കാരണം അവതരിപ്പിക്കുന്ന ബന്ധം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; εἰς എന്നത് തുടർന്നുള്ള ἔχω-യോടൊപ്പമുള്ള പ്രയോഗത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: εἰς προφήτην αὐτὸν εἶχον
  choice: ജനം അവനെ ഒരു പ്രവാചകനായി കരുതിയിരുന്നു
  rationale: ‘ഒരാളെ എന്തായോ കരുതുക’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപമാണിത്. αὐτὸν-ന്റെ വിഷയമായ ജനക്കൂട്ടം മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ‘ജനം’ എന്നു ആവർത്തിക്കുന്നു.
- source_word: προφήτην
  choice: ഒരു പ്രവാചകൻ
  rationale: നിശ്ചയാർഥക ലേഖനമില്ലാത്ത നാമം ഇവിടെ യേശുവിനെ പ്രവാചകരുടെ ഗണത്തിൽ ഉൾപ്പെടുത്തി ജനങ്ങൾ വിലയിരുത്തിയതിനെ സൂചിപ്പിക്കുന്നു; ‘ഒരു പ്രവാചകൻ’ അതു സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: ജനക്കൂട്ടം യേശുവിനെ προφήτην എന്നു വിലയിരുത്തുന്നതിനെ, വാക്യത്തിനപ്പുറമുള്ള ക്രിസ്തുശാസ്ത്രപരമായ നിഗമനം ചേർക്കാതെ എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: ജനം അവനെ ഒരു പ്രവാചകനായി കരുതിയിരുന്നു
  alternative: ജനം അവനെ പ്രവാചകനായി അംഗീകരിച്ചിരുന്നു
  rationale: ഇത് ജനങ്ങളുടെ കാഴ്ചപ്പാടാണ് റിപ്പോർട്ട് ചെയ്യുന്നത്; യേശുവിന്റെ സമ്പൂർണ സ്വത്വത്തെ നിർവചിക്കുന്ന പ്രസ്താവനയല്ല. ‘കരുതിയിരുന്നു’ ആ വിവരണാത്മക നിലപാട് നിലനിർത്തുകയും, യേശു ഒരു പ്രവാചകൻ മാത്രമാണെന്നോ ഈ വിലയിരുത്തൽ തന്നെ സമ്പൂർണ വസ്തുതയാണെന്നോ സൂചിപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ദുഷ്കരമായ സംസ്കൃതവത്കൃത പദങ്ങൾ ഒഴിവാക്കി, ‘പിടികൂടാൻ’, ‘ജനക്കൂട്ടങ്ങൾ’, ‘കരുതിയിരുന്നു’ എന്നീ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പദങ്ങൾ ഉപയോഗിച്ചു. വ്യക്തതയ്ക്കായി അവസാന ഉപവാക്യത്തിൽ ‘ജനം’ ചേർത്തിട്ടുണ്ട്.
