revisions:
- from: അവർ അവനെ പിടികൂടാൻ ശ്രമിച്ചെങ്കിലും ജനക്കൂട്ടങ്ങളെ ഭയപ്പെട്ടു; കാരണം, ജനം അവനെ ഒരു പ്രവാചകനായി കരുതിയിരുന്നു.
  to: അവർ അവനെ പിടികൂടാൻ ശ്രമിച്ചെങ്കിലും, ജനക്കൂട്ടങ്ങളെ ഭയപ്പെട്ടു; കാരണം, ജനക്കൂട്ടങ്ങൾ അവനെ ഒരു പ്രവാചകനായി കരുതിയിരുന്നു.
