  text: λέγων αὐτοῖς· ⸀Πορεύεσθε εἰς τὴν κώμην τὴν ⸀κατέναντι ὑμῶν, καὶ ⸀εὐθέως εὑρήσετε ὄνον δεδεμένην καὶ πῶλον μετ’ αὐτῆς· λύσαντες ⸀ἀγάγετέ μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/002.yaml
  text: saying to them[a], “Go into the village opposite you, and immediately you will find a donkey tied, and a colt with her[c][b]. Untie them and bring them to me.”
translation:
  language: ml
  text: 'അവരോടു പറഞ്ഞു: “നിങ്ങളുടെ എതിർവശത്തുള്ള ഗ്രാമത്തിലേക്കു പോകുവിൻ. ഉടൻതന്നെ അവിടെ കെട്ടിയിട്ടിരിക്കുന്ന ഒരു പെൺകഴുതയെയും അതിന്റെ കൂടെയുള്ള ഒരു കഴുതക്കുട്ടിയെയും നിങ്ങൾ കണ്ടെത്തും.[a] അവയെ അഴിച്ച് എന്റെ അടുക്കൽ കൊണ്ടുവരുവിൻ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കഴുതക്കുട്ടി” എന്നത് ഇവിടെ ഒരു ഇളം കഴുതയെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πορεύεσθε
  choice: പോകുവിൻ
  rationale: കഥനത്തിലെ ബഹുവചന ആജ്ഞയെ സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: κώμην
  choice: ഗ്രാമം
  rationale: κώμη സൂചിപ്പിക്കുന്ന നഗരത്തേക്കാൾ ചെറുതായ ജനവാസകേന്ദ്രത്തിന് സാധാരണവും വ്യക്തവുമായ മലയാളപദം.
- source_word: κατέναντι ὑμῶν
  choice: നിങ്ങളുടെ എതിർവശത്തുള്ള
  rationale: ശിഷ്യന്മാർ നിൽക്കുന്നിടത്തോടുള്ള ഗ്രാമത്തിന്റെ സ്ഥാനബന്ധം അടുത്തായി നിലനിർത്തുന്നു; ‘മുന്നിലുള്ള’ എന്ന അർഥസാധ്യതയും നിഷേധിക്കുന്നില്ല.
- source_word: εὐθέως
  choice: ഉടൻതന്നെ
  rationale: εὐθέως എന്നതിന്റെ തൽക്ഷണകാലസൂചന വ്യക്തമായി നൽകുന്നു.
- source_word: ὄνον δεδεμένην
  choice: കെട്ടിയിട്ടിരിക്കുന്ന ഒരു പെൺകഴുത
  rationale: സ്ത്രീലിംഗ ഏകവചനമായ ὄνον-നും അതിനോട് യോജിക്കുന്ന δεδεμένην-നും ഉള്ള സൂചന മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; തുടർന്നുള്ള αὐτῆς എന്ന സ്ത്രീലിംഗ സർവനാമബന്ധവും ഇതിലൂടെ സ്വാഭാവികമാകുന്നു.
- source_word: πῶλον μετ’ αὐτῆς
  choice: അതിന്റെ കൂടെയുള്ള ഒരു കഴുതക്കുട്ടി
  rationale: πῶλος പൊതുവേ ഇളം മൃഗത്തെ സൂചിപ്പിച്ചാലും, ഇവിടെ പെൺകഴുതയോടൊപ്പമുള്ളതിനാൽ കഴുതക്കുട്ടിയാണെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: λύσαντες ἀγάγετέ μοι
  choice: അവയെ അഴിച്ച് എന്റെ അടുക്കൽ കൊണ്ടുവരുവിൻ
  rationale: മുൻകാല കൃതന്തത്തോടു പിന്നാലെയുള്ള ആജ്ഞയുടെ ക്രമം മലയാളത്തിലെ സ്വാഭാവിക കൃതന്തരൂപത്തിലൂടെ നിലനിർത്തുന്നു; രണ്ടു മൃഗങ്ങളെയും സൂചിപ്പിക്കാൻ ‘അവയെ’ ചേർക്കുന്നു.
- source_word: λέγων αὐτοῖς
  choice: അവരോടു പറഞ്ഞു
  rationale: മുൻവാക്യവുമായി ബന്ധപ്പെടുന്ന ഗ്രീക്ക് വർത്തമാന കൃതന്തത്തെ മലയാള കഥനത്തിൽ സ്വാഭാവികമായ സമാപികാക്രിയയായി നൽകുന്നു.
