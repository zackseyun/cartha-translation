  register: ആധുനിക നിലവാരമലയാളത്തിലെ dignified biblical register ഉപയോഗിച്ചു. ‘പോകുവിൻ’, ‘കൊണ്ടുവരുവിൻ’ എന്നീ രൂപങ്ങൾ ബഹുവചന ആജ്ഞയും മാന്യമായ തിരുവെഴുത്തുശൈലിയും നിലനിർത്തുന്നു. ‘പെൺകഴുത’ എന്നു വ്യക്തമാക്കിയത് ഗ്രീക്കിലെ സ്ത്രീലിംഗസൂചനയും കുട്ടിയുമായുള്ള ബന്ധവും മലയാളത്തിൽ സുതാര്യമാക്കാനാണ്.
