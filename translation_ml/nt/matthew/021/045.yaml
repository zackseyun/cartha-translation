source:
  edition: SBLGNT
  text: Καὶ ἀκούσαντες οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι τὰς παραβολὰς αὐτοῦ ἔγνωσαν ὅτι περὶ αὐτῶν λέγει·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/045.yaml
  text: And when the chief priests and the Pharisees heard his parables[a], they knew that he was speaking about them.
translation:
  language: ml
  text: മുഖ്യപുരോഹിതന്മാരും പരീശന്മാരും അവന്റെ ഉപമകൾ കേട്ടപ്പോൾ, അവൻ തങ്ങളെക്കുറിച്ചാണ് സംസാരിക്കുന്നതെന്ന് അവർ മനസ്സിലാക്കി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തങ്ങളെ സംബന്ധിച്ചാണ്.’ ഉപമകൾ തങ്ങളെയാണ് ലക്ഷ്യമിടുന്നതെന്ന് അവർ തിരിച്ചറിഞ്ഞു എന്നതാണ് ആശയം. ചില പരിഭാഷകൾ കൂടുതൽ വ്യാഖ്യാനാത്മകമായി ‘തങ്ങൾക്കെതിരായാണ്’ എന്നു നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: കേട്ടപ്പോൾ
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള aorist participle സ്വാഭാവികമായ മലയാളത്തിൽ കാലസൂചക ഉപവാക്യമായി നൽകുന്നു.
- source_word: ἀρχιερεῖς
  choice: മുഖ്യപുരോഹിതന്മാർ
  rationale: ഒരേ സമയത്തെ അനേകം മഹാപുരോഹിതന്മാരെയല്ല, മുതിർന്ന പുരോഹിതനേതൃത്വത്തെയാണ് ബഹുവചനപദം സൂചിപ്പിക്കുന്നത്.
- source_word: Φαρισαῖοι
  choice: പരീശന്മാർ
  rationale: യഹൂദമതവിഭാഗത്തിന്റെ പേരിന് മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: παραβολὰς
  choice: ഉപമകൾ
  rationale: യേശുവിന്റെ രൂപകാത്മക കഥകൾക്കും വചനങ്ങൾക്കും മലയാള ബൈബിൾ ഭാഷയിൽ സ്ഥാപിതവും സ്വാഭാവികവുമായ പദം.
- source_word: ἔγνωσαν
  choice: മനസ്സിലാക്കി
  rationale: സന്ദർഭത്തിൽ തങ്ങളെ ഉദ്ദേശിച്ചാണ് പറഞ്ഞതെന്ന തിരിച്ചറിവിലേക്കെത്തിയതിനെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: περὶ αὐτῶν
  choice: തങ്ങളെക്കുറിച്ച്
  rationale: περί + genitive എന്നതിന്റെ നേരിട്ടുള്ള അർഥം ‘കുറിച്ച്/സംബന്ധിച്ച്’ എന്നാണ്; ‘തങ്ങൾക്കെതിരായി’ എന്നു നൽകുന്നത് വിമർശനഭാവം വ്യാഖ്യാനിച്ച് ചേർക്കും.
- source_word: λέγει
  choice: സംസാരിക്കുന്നതെന്ന്
  rationale: അനുബന്ധവാക്യത്തിലെ ഗ്രീക്ക് വർത്തമാനകാലത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ തുടരുന്ന പ്രവർത്തനരൂപത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ഉപമകൾ നേതാക്കൾക്കെതിരായ കുറ്റവിധിയാണെന്ന് പരിഭാഷയിൽ തുറന്നുപറയണമോ
  choice: തങ്ങളെക്കുറിച്ചാണ് സംസാരിക്കുന്നത്
  alternative: തങ്ങൾക്കെതിരായാണ് സംസാരിക്കുന്നത്
  rationale: സന്ദർഭം വിമർശനാത്മകമാണെങ്കിലും περὶ αὐτῶν എന്നത് നേരിട്ട് ‘അവരെക്കുറിച്ച്’ എന്നാണ് പറയുന്നത്. അതിനാൽ ശക്തമായ വിരുദ്ധാർഥം മുഖ്യപാഠത്തിൽ ചേർക്കാതെ പാഠത്തിലെ ഉദ്ദേശ്യപൂർവമായ പരിധി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘മുഖ്യപുരോഹിതന്മാർ,’ ‘പരീശന്മാർ,’ ‘ഉപമകൾ’ എന്നീ പരിചിതമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തി; വാക്യഘടന സാധാരണ വായനക്കാർക്ക് സുതാര്യമാക്കി.
