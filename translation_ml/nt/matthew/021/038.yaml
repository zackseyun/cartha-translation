id: MAT.21.38
reference: Matthew 21:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ γεωργοὶ ἰδόντες τὸν υἱὸν εἶπον ἐν ἑαυτοῖς· Οὗτός ἐστιν ὁ κληρονόμος· δεῦτε ἀποκτείνωμεν αὐτὸν καὶ ⸀σχῶμεν τὴν κληρονομίαν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/038.yaml
  text: But when the tenant farmers saw the son[a], they said among themselves, ‘This is the heir. Come, let us kill him and seize his inheritance.’
translation:
  language: ml
  text: 'എന്നാൽ പാട്ടക്കൃഷിക്കാർ മകനെ കണ്ടപ്പോൾ തമ്മിൽ പറഞ്ഞു: “ഇവനാണ് അവകാശി. വരൂ, നമുക്ക് ഇവനെ കൊന്ന് ഇവന്റെ അവകാശസ്വത്ത് കൈവശമാക്കാം[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: “ഇവന്റെ അവകാശസ്വത്ത് നമുക്കുണ്ടാകട്ടെ”; സന്ദർഭത്തിൽ അത് ബലമായി കൈവശപ്പെടുത്തുക എന്ന അർഥത്തിലാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γεωργοὶ
  choice: പാട്ടക്കർഷകർ
  rationale: മുന്തിരിത്തോട്ടം ഉടമയിൽനിന്ന് പാട്ടത്തിനെടുത്ത് കൃഷിചെയ്യുന്നവരെയാണ് ഉപമയുടെ സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്; അതിനാൽ വെറും ‘കർഷകർ’ എന്നതിനെക്കാൾ സാമൂഹികബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: ἰδόντες
  choice: കണ്ടപ്പോൾ
  rationale: അയോറിസ്റ്റ് കൃദന്തത്തെ സ്വാഭാവികമായ മലയാളത്തിലെ കാലസൂചക ഉപവാക്യമായി നൽകി, പ്രവർത്തനങ്ങളുടെ ക്രമം നിലനിർത്തുന്നു.
- source_word: τὸν υἱὸν
  choice: മകനെ
  rationale: ഗ്രീക്കിൽ വ്യക്തമായ ഉടമസ്ഥസർവനാമമില്ലാത്തതിനാൽ ‘മകനെ’ എന്നു നേരിട്ട് നൽകി; ആരുടെ മകനാണെന്നത് സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: ἐν ἑαυτοῖς
  choice: തമ്മിൽ
  rationale: അവർ സ്വന്തം കൂട്ടത്തിനുള്ളിൽ നടത്തിയ സംഭാഷണം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: κληρονόμος
  choice: അവകാശി
  rationale: നിയമപരമായ പൈതൃകാവകാശമുള്ള വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: δεῦτε
  choice: വരൂ
  rationale: തുടർന്നുള്ള കൂട്ടായ പ്രവൃത്തിയിലേക്കുള്ള ആഹ്വാനം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀποκτείνωμεν
  choice: നമുക്ക് ഇവനെ കൊല്ലാം
  rationale: കൂട്ടായ നിർദേശത്തെ സൂചിപ്പിക്കുന്ന ഹോർട്ടേറ്ററി സബ്ജങ്‌ടീവിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ രൂപം; ‘വധിക്കാം’ എന്നത് അനാവശ്യമായി ഔപചാരികമോ ന്യായവിധിസംബന്ധമോ ആകാം.
- source_word: σχῶμεν
  choice: കൈവശമാക്കാം
  rationale: അടിസ്ഥാനാർഥം ‘ഉണ്ടായിരിക്കുക/കൈവശം വയ്ക്കുക’ എന്നാണെങ്കിലും, അവകാശിയെ കൊന്നശേഷം സ്വത്ത് തങ്ങളുടേതാക്കുക എന്ന ശത്രുതാപരമായ ഉദ്ദേശം സന്ദർഭത്തിൽ വ്യക്തമാകുന്നതിനാൽ ഈ പ്രയോഗം യോജിക്കുന്നു; കൂടുതൽ പദാനുപദമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: κληρονομίαν αὐτοῦ
  choice: ഇവന്റെ അവകാശസ്വത്ത്
  rationale: κληρονομίαയുടെ പൈതൃകസ്വത്ത് എന്ന അർഥവും αὐτοῦ എന്ന സർവനാമവും വ്യക്തമായി നിലനിർത്തുന്നു; ‘ഇവന്റെ’ എന്നത് സംസാരിക്കുന്നവർ മുന്നിലുള്ള മകനെ ചൂണ്ടിക്കാണിക്കുന്ന ഭാവത്തിന് യോജിക്കുന്നു.
theological_decisions:
- issue: ഉപമയിലെ മകന്റെ സൂചന
  choice: υἱός എന്നത് വ്യാഖ്യാനപരമായ തിരിച്ചറിയൽ ചേർക്കാതെ ‘മകൻ’ എന്നു മാത്രം പരിഭാഷപ്പെടുത്തി.
  alternative: മകൻ യേശുവിനെ പ്രതിനിധീകരിക്കുന്നുവെന്ന് പരിഭാഷയിൽതന്നെ വ്യക്തമാക്കുക.
  rationale: മത്തായിയുടെ വിശാലമായ ആഖ്യാനത്തിൽ ഉപമ യേശുവിലേക്കു വിരൽചൂണ്ടുന്നുവെങ്കിലും, ഈ വാക്യം ഉപമയുടെ കഥാതലത്തിലാണ് സംസാരിക്കുന്നത്. ക്രിസ്തുവിനെക്കുറിച്ചുള്ള സൂചനയെ ഇല്ലാതാക്കാതെയും അതിനെ മുഖ്യപാഠത്തിൽ വിശദീകരിച്ച് തീർക്കാതെയും മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള ശൈലി. ‘പാട്ടക്കർഷകർ’ ഉപമയിലെ പാട്ടബന്ധം വ്യക്തമാക്കുന്നു; സംഭാഷണം സ്വാഭാവികമാക്കാൻ ‘തമ്മിൽ പറഞ്ഞു’, ‘വരൂ’ എന്നീ പ്രയോഗങ്ങൾ ഉപയോഗിച്ചു.
