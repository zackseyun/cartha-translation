    reason: ηὐλίσθη എന്ന ക്രിയയ്ക്ക് ഇവിടെ ‘താമസിക്കുക/രാത്രി ചെലവഴിക്കുക’ എന്ന അർഥമാണുള്ളത്.
  revision_rationale: The revision retains the referential openness of “അവരെ,” the prior-action force of the participle, and the overnight sense of ηὐλίσθη. It renders the source’s outward movement and destination directly, without adding an arrival-focused nuance. The footnote anchor remains attached to the expression it qualifies.
