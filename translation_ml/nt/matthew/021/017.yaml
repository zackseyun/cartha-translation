id: MAT.21.17
reference: Matthew 21:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ καταλιπὼν αὐτοὺς ἐξῆλθεν ἔξω τῆς πόλεως εἰς Βηθανίαν, καὶ ηὐλίσθη ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/017.yaml
  text: And leaving them[a], he went out of the city to Bethany and stayed there overnight.
translation:
  language: ml
  text: അവരെ വിട്ട് അദ്ദേഹം നഗരത്തിൽനിന്നു പുറത്തേക്ക് ബേഥാന്യയിലേക്കു പോയി; അവിടെ രാത്രി താമസിച്ചു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അവിടെ താമസിച്ചു” അല്ലെങ്കിൽ “അവിടെ രാത്രി ചെലവഴിച്ചു.”
    reason: ηὐλίσθη എന്ന ക്രിയയ്ക്ക് ഇവിടെ ‘താമസിക്കുക/രാത്രി ചെലവഴിക്കുക’ എന്ന അർഥമാണുള്ളത്.
lexical_decisions:
- source_word: καταλιπὼν αὐτοὺς
  choice: അവരെ വിട്ട്
  rationale: പ്രധാന ക്രിയയ്ക്കു മുമ്പുണ്ടായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന aorist participle മലയാളത്തിൽ സ്വാഭാവികമായ ക്രിയാവിശേഷണരൂപത്തിൽ നൽകി; αὐτούς എന്ന സർവനാമത്തിന്റെ സന്ദർഭപരമായ തുറന്ന സ്വഭാവവും നിലനിർത്തുന്നു.
- source_word: ἐξῆλθεν ἔξω τῆς πόλεως
  choice: നഗരത്തിനു പുറത്തേക്കു പോയി
  rationale: ἐξῆλθεν എന്ന പുറപ്പെടൽക്രിയയും ἔξω τῆς πόλεως എന്ന നഗരത്തിനു പുറത്തേക്കുള്ള ദിശയും സ്വാഭാവിക മലയാളത്തിൽ സംയോജിപ്പിക്കുന്നു.
- source_word: εἰς Βηθανίαν
  choice: ബേഥാന്യയിൽ എത്തി
  rationale: εἰς സൂചിപ്പിക്കുന്ന ലക്ഷ്യസ്ഥലത്തേക്കുള്ള ഗതി വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ηὐλίσθη ἐκεῖ
  choice: അവിടെ രാത്രി താമസിച്ചു
  rationale: αὐλίζομαι എന്ന ക്രിയയുടെ ഇവിടെ പ്രസക്തമായ ‘രാത്രി ചെലവഴിക്കുക/താമസിക്കുക’ എന്ന അർഥം സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘അദ്ദേഹം’ എന്ന രൂപം വായനാസൗകര്യത്തിനായി ഉപയോഗിച്ചു; വാക്യത്തിലെ കർത്താവ് മുൻസന്ദർഭത്തിൽനിന്ന് ലഭിക്കുന്ന യേശുവാണ്. അടിക്കുറിപ്പിന്റെ [a] ചിഹ്നം ബന്ധപ്പെട്ട ക്രിയാഭാഗത്തിനു ശേഷം നൽകിയിരിക്കുന്നു.
