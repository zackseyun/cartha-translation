id: MAT.21.36
reference: Matthew 21:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πάλιν ἀπέστειλεν ἄλλους δούλους πλείονας τῶν πρώτων, καὶ ἐποίησαν αὐτοῖς ὡσαύτως.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/036.yaml
  text: Again he sent other servants[a], more than the first ones, and they did the same to them.
translation:
  language: ml
  text: വീണ്ടും അവൻ ആദ്യസംഘത്തേക്കാൾ കൂടുതലായ മറ്റു സേവകരെ[a] അയച്ചു; അവരോടും അവർ അതേപോലെ ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അടിമകളെ.’ ഗ്രീക്ക് പദമായ δούλους എന്നതിന് സന്ദർഭമനുസരിച്ച് ‘സേവകർ’ എന്നോ ‘അടിമകൾ’ എന്നോ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: ആവർത്തിച്ച പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സംക്ഷിപ്തവുമായ ആഖ്യാനപ്രയോഗം.
- source_word: ἀπέστειλεν
  choice: അയച്ചു
  rationale: ἀποστέλλω എന്ന ക്രിയയുടെ ലളിതമായ ആഖ്യാനസമാനപദം; ഇവിടെ ‘പറഞ്ഞയച്ചു’ എന്ന അധികഭാവം ആവശ്യമില്ല.
- source_word: ἄλλους δούλους
  choice: ദാസന്മാരെ
  rationale: δοῦλος എന്നതിന് ദാസൻ, സേവകൻ, അടിമ എന്നീ അർഥസാധ്യതകളുണ്ട്. വീട്ടുടമയുടെ കീഴിലുള്ളവരെന്ന ബന്ധവും അയക്കപ്പെട്ടവരെന്ന പങ്കും ‘ദാസന്മാർ’ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: πλείονας τῶν πρώτων
  choice: ആദ്യത്തേതിനെക്കാൾ കൂടുതൽ
  rationale: പിന്നീട് അയച്ച സംഘം ആദ്യ സംഘത്തേക്കാൾ എണ്ണത്തിൽ വലുതായിരുന്നുവെന്ന താരതമ്യം സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
- source_word: ἐποίησαν αὐτοῖς ὡσαύτως
  choice: അവരോടും അവർ അതേപോലെ ചെയ്തു
  rationale: മുൻവാക്യത്തിൽ വിവരിച്ച പെരുമാറ്റത്തിലേക്കുള്ള സൂചന നിലനിർത്തുകയും ഗ്രീക്കിലെ ‘ചെയ്തു’ എന്ന പൊതുവായ ക്രിയയെ അനാവശ്യമായി വിശദീകരിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ഉപമയിലെ δοῦλος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ദാസന്മാർ
  alternative: സേവകർ / അടിമകൾ
  rationale: ഉപമയിൽ അവരുടെ നിയമപരമായ അടിമസ്ഥിതിയെക്കാൾ യജമാനൻ അയച്ചവരെന്ന പങ്കാണ് മുൻനിരയിൽ. എങ്കിലും മൂലപദത്തിന്റെ ‘അടിമകൾ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അവരോടും’ എന്ന പ്രയോഗം മുൻ സംഘത്തോടുണ്ടായതുപോലെ പുതിയ സംഘത്തോടും സംഭവിച്ചുവെന്ന അനാഫോറ വ്യക്തമായി നിലനിർത്തുന്നു.
