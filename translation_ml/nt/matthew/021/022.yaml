id: MAT.21.22
reference: Matthew 21:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ πάντα ὅσα ⸀ἂν αἰτήσητε ἐν τῇ προσευχῇ πιστεύοντες λήμψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/022.yaml
  text: And whatever you ask in prayer[a], believing[b], you will receive.
translation:
  language: ml
  text: വിശ്വസിച്ചുകൊണ്ട് പ്രാർഥനയിൽ നിങ്ങൾ ചോദിക്കുന്നതെന്തും നിങ്ങൾക്കു ലഭിക്കും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντα ὅσα
  choice: ചോദിക്കുന്നതെന്തും
  rationale: πᾶς + ὅσος ചേർന്ന പ്രയോഗത്തിന്റെ സമഗ്രവും അനിശ്ചിതവുമായ വ്യാപ്തി സ്വാഭാവിക മലയാളത്തിൽ ‘എന്തും’ എന്നു നൽകുന്നു; ‘എല്ലാം’ എന്നതും സാധ്യമാണ്.
- source_word: ἂν αἰτήσητε
  choice: നിങ്ങൾ ചോദിക്കുന്ന
  rationale: ἄν ചേർന്ന aorist subjunctive അനിശ്ചിത relative clause രൂപപ്പെടുത്തുന്നു. മലയാളത്തിലെ ‘ചോദിക്കുന്നതെന്തും’ അതിന്റെ സാധ്യതാഭാവം പ്രത്യേകം അതിവിവർത്തനം ചെയ്യാതെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἐν τῇ προσευχῇ
  choice: പ്രാർഥനയിൽ
  rationale: നാമപദഘടന നിലനിർത്തിക്കൊണ്ട് ‘in prayer’ എന്ന അർഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: πιστεύοντες
  choice: വിശ്വസിച്ചുകൊണ്ട്
  rationale: വർത്തമാനകാല participle ചോദിക്കുന്നതിനോടൊപ്പം നടക്കുന്ന വിശ്വാസത്തെ സൂചിപ്പിക്കുന്നു. ‘വിശ്വസിച്ചുകൊണ്ട്’ ആ സമകാലിക ബന്ധം നിലനിർത്തുന്നു; വ്യക്തമായ ‘എങ്കിൽ’ വ്യവസ്ഥ ചേർക്കുന്നില്ല.
- source_word: λήμψεσθε
  choice: നിങ്ങൾക്കു ലഭിക്കും
  rationale: λαμβάνω എന്ന ക്രിയയുടെ future middle രൂപം ഈ സന്ദർഭത്തിൽ മലയാളത്തിൽ സ്വാഭാവികമായി ‘ലഭിക്കും’ എന്നു നൽകാം; ഗൗരവമുള്ള ശൈലിയും നിലനിൽക്കുന്നു.
theological_decisions:
- issue: വിശ്വാസവും പ്രാർഥനയ്ക്കുള്ള ഉത്തരവും തമ്മിലുള്ള ബന്ധം
  choice: ‘വിശ്വസിച്ചുകൊണ്ട്’ എന്ന് participial രൂപത്തിൽ നൽകുക.
  alternative: ‘നിങ്ങൾ വിശ്വസിക്കുന്നുവെങ്കിൽ’ എന്ന് വ്യക്തമായ വ്യവസ്ഥയായി നൽകുക.
  rationale: ഗ്രീക്കിൽ വ്യക്തമായ conditional clause ഇല്ല; participle ആണ്. അതിനാൽ പ്രാർഥനയെയും വിശ്വാസത്തെയും ബന്ധിപ്പിക്കുമ്പോഴും ഉത്തരലഭ്യതയുടെ സ്വഭാവത്തെക്കുറിച്ചുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷം വിവർത്തനം സ്വയം തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പ്രാർഥനയിൽ’ എന്ന നാമപദരൂപവും ‘വിശ്വസിച്ചുകൊണ്ട്’ എന്ന participial ബന്ധവും മൂലപാഠത്തിന്റെ ഘടനയോടു ചേർന്നു നിൽക്കുന്നു; വാക്യം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
