id: MAT.21.33
reference: Matthew 21:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν ἀκούσατε. ⸀Ἄνθρωπος ἦν οἰκοδεσπότης ὅστις ἐφύτευσεν ἀμπελῶνα καὶ φραγμὸν αὐτῷ περιέθηκεν καὶ ὤρυξεν ἐν αὐτῷ ληνὸν καὶ ᾠκοδόμησεν πύργον, καὶ ἐξέδετο αὐτὸν γεωργοῖς, καὶ ἀπεδήμησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/033.yaml
  text: 'Listen to another parable: There was a landowner who planted a vineyard and put a fence around it and dug a winepress in it and built a tower[a], and leased it to tenant farmers[c][b], and went away.'
translation:
  language: ml
  text: '“മറ്റൊരു ഉപമ കേൾക്കുക: ഒരു ഭൂവുടമ ഒരു മുന്തിരിത്തോട്ടം നട്ടു, അതിനു ചുറ്റും വേലി കെട്ടി[b], അതിൽ ഒരു മുന്തിരിച്ചക്ക് കുഴിച്ചുണ്ടാക്കി, ഒരു ഗോപുരവും പണിതു[a]. പിന്നെ ആ തോട്ടം കൃഷിക്കാർക്ക് പാട്ടത്തിനു കൊടുത്തു[c]; പിന്നെ അവൻ പോയി.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: മുന്തിരിത്തോട്ടം നടുക, അതിനു ചുറ്റും വേലി കെട്ടുക, മുന്തിരിച്ചക്ക് ഉണ്ടാക്കുക, ഗോപുരം പണിയുക എന്നീ ചിത്രങ്ങൾ യെശയ്യാവ് 5:1–2-നെ അനുസ്മരിപ്പിക്കുന്നു.
    reason: cross_reference
  - marker: b
    text: അഥവാ, “അതിനു ചുറ്റും മുൾവേലി വെച്ചു.” ഗ്രീക്ക് പദം വേലി, മുൾവേലി തുടങ്ങിയ ചുറ്റടയ്ക്കുന്ന തടസ്സങ്ങളെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “കൃഷിക്കാർക്ക് വാടകയ്ക്കു കൊടുത്തു.” മുന്തിരിത്തോട്ടം കൃഷിചെയ്യാനായി കൃഷിക്കാർക്ക് പാട്ടത്തിനു നൽകുന്നതാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄλλην παραβολὴν ἀκούσατε
  choice: മറ്റൊരു ഉപമ കേൾക്കുക
  rationale: ബഹുവചന ആജ്ഞയായ ἀκούσατε-യുടെ നേരിട്ടുള്ള ആഹ്വാനം നിലനിർത്തുന്നു; παραβολή-യ്ക്ക് മലയാളത്തിൽ പ്രചാരമുള്ളതും കൃത്യവുമായ പദം ‘ഉപമ’ ആണ്.
- source_word: Ἄνθρωπος ἦν οἰκοδεσπότης
  choice: ഒരു ഭൂവുടമ
  rationale: കൃഷിഭൂമിയും പാട്ടക്കാരും ഉൾപ്പെടുന്ന സന്ദർഭത്തിൽ οἰκοδεσπότης സൂചിപ്പിക്കുന്ന എസ്റ്റേറ്റിന്റെ ഉടമയെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ἄνθρωπος ἦν എന്ന ഗ്രീക്ക് അവതരണരീതി മലയാളത്തിൽ അനാവശ്യമായി പദാനുപദം ആവർത്തിക്കുന്നില്ല.
- source_word: ἐφύτευσεν ἀμπελῶνα
  choice: ഒരു മുന്തിരിത്തോട്ടം നട്ടു
  rationale: φυτεύω എന്നതിന്റെ ‘നടുക’ എന്ന മൂർത്തമായ അർഥവും ἀμπελών എന്ന മുന്തിരിത്തോട്ടചിത്രവും സംരക്ഷിക്കുന്നു.
- source_word: φραγμὸν αὐτῷ περιέθηκεν
  choice: അതിനു ചുറ്റും വേലി കെട്ടി
  rationale: φραγμός വേലിയോ മുൾവേലിയോ പോലുള്ള ചുറ്റുമതിലിനെ സൂചിപ്പിക്കാം. ‘വേലി’ വസ്തു അനാവശ്യമായി നിർണയിക്കാതെ പൊതുവായ അർഥം നൽകുന്നു.
- source_word: ὤρυξεν ἐν αὐτῷ ληνὸν
  choice: അതിൽ ഒരു മുന്തിരിച്ചക്ക് കുഴിച്ചുണ്ടാക്കി
  rationale: ὀρύσσω-യുടെ കുഴിക്കൽക്രിയയും ληνός-ന്റെ മുന്തിരി ചവിട്ടിപ്പിഴിയുന്ന സംവിധാനവും ഒരുമിച്ച് അറിയിക്കുന്നു. ‘കുഴിച്ചുണ്ടാക്കി’ എന്നത് നിലത്ത് നിർമിച്ച ചക്കയുടെ ദൃശ്യരൂപം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ᾠκοδόμησεν πύργον
  choice: ഒരു ഗോപുരവും പണിതു
  rationale: πύργος എന്നത് പൊതുവായി ഗോപുരമാണ്; കാവൽഗോപുരം എന്ന സാധ്യതയുള്ള ഉപയോഗം മുഖ്യപാഠത്തിൽ ചേർത്ത് അർഥം ചുരുക്കുന്നില്ല.
- source_word: ἐξέδετο αὐτὸν γεωργοῖς
  choice: ആ തോട്ടം കൃഷിക്കാർക്ക് പാട്ടത്തിനു കൊടുത്തിട്ട്
  rationale: മധ്യപ്രയോഗത്തിലുള്ള ἐκδίδωμι പാട്ടത്തിനു കൊടുക്കുക എന്ന സാമ്പത്തികബന്ധം സൂചിപ്പിക്കുന്നു. γεωργοί-യെ ‘കൃഷിക്കാർ’ എന്ന് നൽകുന്നു; അവർ വെറും കൂലിപ്പണിക്കാരല്ലെന്ന കാര്യം ക്രിയ വ്യക്തമാക്കുന്നു.
- source_word: ἀπεδήμησεν
  choice: ദൂരദേശത്തേക്കു പോയി
  rationale: ἀποδημέω സ്വന്തം പ്രദേശം വിട്ട് അകലേക്കുള്ള യാത്രയെ സൂചിപ്പിക്കുന്നു. നിർദിഷ്ട രാജ്യമോ ലക്ഷ്യസ്ഥാനമോ ചേർക്കാതെ ‘ദൂരദേശത്തേക്ക്’ ആ അകന്നുപോകൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: യെശയ്യാവ് 5:1–2-ലെ മുന്തിരിത്തോട്ടചിത്രത്തോടുള്ള അന്തർപാഠബന്ധം
  choice: കൃഷിസംബന്ധമായ മൂർത്തമായ ഭാഷ മുഖ്യപാഠത്തിൽ നിലനിർത്തി, ബന്ധം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
  alternative: ‘മുൾവേലി’ പോലുള്ള പരമ്പരാഗത പദം ഉപയോഗിച്ച് യെശയ്യാവുമായുള്ള സാമ്യം മുഖ്യപാഠത്തിൽ കൂടുതൽ പ്രകടമാക്കുക.
  rationale: ഈ സൂചന ശക്തമാണെങ്കിലും അതിനെ വ്യാഖ്യാനമായി മുഖ്യപാഠത്തിൽ ചേർക്കാതെ, ഗ്രീക്ക് വാചകത്തിലെ ചിത്രങ്ങൾ കൃത്യമായി പുനരാവിഷ്കരിക്കുന്നതാണ് ഉചിതം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ‘ഭൂവുടമ’, ‘പാട്ടത്തിനു കൊടുക്കുക’ എന്നീ പദങ്ങൾ സാമൂഹിക-സാമ്പത്തികബന്ധം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു. എല്ലാ അടിക്കുറിപ്പുകുറികളും ബന്ധപ്പെട്ട വാക്കുകൾക്കു പിന്നാലെ മുഖ്യപാഠത്തിൽ നൽകിയിരിക്കുന്നു.
