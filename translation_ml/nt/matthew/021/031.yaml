id: MAT.21.31
reference: Matthew 21:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τίς ἐκ τῶν δύο ἐποίησεν τὸ θέλημα τοῦ πατρός; ⸀λέγουσιν· Ὁ ⸀πρῶτος. λέγει αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν λέγω ὑμῖν ὅτι οἱ τελῶναι καὶ αἱ πόρναι προάγουσιν ὑμᾶς εἰς τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/031.yaml
  text: Which of the two did the will of the father? They said[a], “The first.” Jesus said to them, “Truly I say to you, the tax collectors and the prostitutes are going ahead of you into the kingdom of God.”
translation:
  language: ml
  text: '“ഈ രണ്ടുപേരിൽ ആരാണ് പിതാവിന്റെ ഇഷ്ടം നിറവേറ്റിയത്?” അവർ പറഞ്ഞു: “ആദ്യത്തവൻ.” യേശു അവരോടു പറഞ്ഞു: “സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: നികുതിപിരിവുകാരും വേശ്യകളും നിങ്ങളെക്കാൾ മുമ്പായി ദൈവരാജ്യത്തിലേക്കു പോകുന്നു.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങൾക്കുമുമ്പേ ദൈവരാജ്യത്തിൽ പ്രവേശിക്കുന്നു.” ഗ്രീക്കിൽ അക്ഷരാർഥം “നിങ്ങളെക്കാൾ മുമ്പായി പോകുന്നു” എന്നാണ്; ഇത് മുൻഗണന ഊന്നിപ്പറയുന്നു, എന്നാൽ നിങ്ങൾ അന്തിമമായി പുറത്താക്കപ്പെടുമെന്ന് നിർബന്ധമായി പ്രസ്താവിക്കുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: τίς ἐκ τῶν δύο
  choice: ഈ രണ്ടുപേരിൽ ആരാണ്
  rationale: ἐκ എന്നതിന്റെ ഭാഗികസംബന്ധവും രണ്ട് വ്യക്തികളിൽ ഒരാളെ ചോദിക്കുന്ന സ്വാഭാവിക മലയാളരീതിയും നിലനിർത്തുന്നു.
- source_word: ἐποίησεν τὸ θέλημα τοῦ πατρός
  choice: പിതാവിന്റെ ഇഷ്ടം നിറവേറ്റിയത്
  rationale: വാക്കുതോറും അസ്വാഭാവികമായ ‘ഇഷ്ടം ചെയ്തത്’ എന്നതിനു പകരം, ποιέωയുടെ പ്രവർത്തനാർഥവും θέλημαയുടെ ആശയവും വ്യക്തമായി നൽകുന്നു; ഇവിടെ പിതാവ് ഉപമയിലെ പിതാവാണ്.
- source_word: Ὁ πρῶτος
  choice: ആദ്യത്തവൻ
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തമായ ഉത്തരം മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: യേശുവിന്റെ ഗൗരവപൂർണമായ ഉറപ്പുവാക്യത്തിന്റെ ശക്തി ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: τελῶναι
  choice: നികുതിപിരിവുകാർ
  rationale: സുവിശേഷകാലത്തെ വരുമാനപ്പിരിവുകാരെ സൂചിപ്പിക്കുന്ന വ്യക്തവും സാധാരണക്കാർക്കു മനസ്സിലാകുന്നതുമായ പദം.
- source_word: πόρναι
  choice: വേശ്യകൾ
  rationale: പദത്തിന്റെ വ്യക്തമായ അർഥം നിലനിർത്തുന്നു; വിശാലമായ ‘ലൈംഗിക അധാർമികതയുള്ള സ്ത്രീകൾ’ എന്ന വ്യാഖ്യാനത്തിലേക്കോ പ്രാചീന പ്രയോഗത്തിലേക്കോ മാറുന്നില്ല.
- source_word: προάγουσιν ὑμᾶς
  choice: നിങ്ങളെക്കാൾ മുമ്പായി ... പോകുന്നു
  rationale: വർത്തമാനകാലവും മുന്നേ പോകുന്നുവെന്ന മുൻഗണനാചിത്രവും നിലനിർത്തുന്നു; അഭിസംബോധിതർ അന്തിമമായി പുറത്താക്കപ്പെടുന്നു എന്ന് വാചകത്തിൽ ഇല്ലാത്ത വിധി ചേർക്കുന്നില്ല.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: ദൈവരാജ്യത്തിലേക്കു
  rationale: εἰς എന്ന ദിശാസൂചനയും ‘ദൈവരാജ്യം’ എന്ന സ്ഥിരമായ ദൈവശാസ്ത്രപര പ്രയോഗവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: προάγουσιν ὑμᾶς എന്നതിന്റെ രാജ്യപ്രവേശനസംബന്ധമായ ശക്തി
  choice: നിങ്ങളെക്കാൾ മുമ്പായി ദൈവരാജ്യത്തിലേക്കു പോകുന്നു
  alternative: നിങ്ങൾക്കുമുമ്പേ ദൈവരാജ്യത്തിൽ പ്രവേശിക്കുന്നു
  rationale: προάγω മുന്നേ പോകുക എന്ന ചിത്രവും മുൻഗണനയും വ്യക്തമാക്കുന്നു. ‘പ്രവേശിക്കുന്നു’ എന്നത് സന്ദർഭത്തിൽ സാധ്യമായ വ്യാഖ്യാനമാണെങ്കിലും, മതനേതാക്കളുടെ അന്തിമമായ ഒഴിവാക്കൽ നിർബന്ധമായി പ്രസ്താവിക്കാതെ മൂലവാചകത്തിലെ മുന്നറിയിപ്പും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഉപമയിലെ പിതാവിനെയും ദൈവരാജ്യത്തെക്കുറിച്ചുള്ള യേശുവിന്റെ പ്രയോഗത്തെയും തമ്മിൽ അനാവശ്യമായി ലയിപ്പിച്ചിട്ടില്ല. സാമൂഹികമായി കഠിനമായ πόρναι എന്ന പദം മൃദൂകരിക്കാതെ കൃത്യമായി പരിഭാഷപ്പെടുത്തി.
