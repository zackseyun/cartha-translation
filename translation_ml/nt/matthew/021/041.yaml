id: MAT.21.41
reference: Matthew 21:41
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγουσιν αὐτῷ· Κακοὺς κακῶς ἀπολέσει αὐτούς, καὶ τὸν ἀμπελῶνα ἐκδώσεται ἄλλοις γεωργοῖς, οἵτινες ἀποδώσουσιν αὐτῷ τοὺς καρποὺς ἐν τοῖς καιροῖς αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/041.yaml
  text: They said to him[a], “He will miserably destroy those wretches, and he will lease the vineyard to other farmers[c][b], who will give him the fruits in their seasons.”
translation:
  language: ml
  text: 'അവർ അവനോട് പറഞ്ഞു: “ആ ദുഷ്ടന്മാരെ അവൻ ദാരുണമായി നശിപ്പിക്കും[a]. മുന്തിരിത്തോട്ടം മറ്റു കൃഷിക്കാർക്ക് പാട്ടത്തിന് കൊടുക്കുകയും[b] അവർ അതതു കാലങ്ങളിൽ അവന് അതിന്റെ വിളവ് കൊടുക്കുകയും ചെയ്യും[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ‘ദുഷ്ടന്മാർ’ എന്നും ‘ദാരുണമായി’ എന്നും പരിഭാഷപ്പെടുത്തിയ പദങ്ങൾ ഒരേ മൂലത്തിൽനിന്നുള്ളവയാണ്; ഈ പദകളി വിധിയുടെ കാഠിന്യം ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “മുന്തിരിത്തോട്ടം മറ്റു പാട്ടക്കാർക്ക് ഏൽപ്പിക്കുകയും.”
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “അവർ യഥാസമയങ്ങളിൽ അവന് അതിന്റെ ഫലം നൽകുകയും ചെയ്യും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: അവർ അവനോട് പറഞ്ഞു
  rationale: വർത്തമാനകാലരൂപം ഗ്രീക്ക് ആഖ്യാനത്തിലെ ചരിത്രവർത്തമാനമാണ്; സ്വാഭാവികമായ മലയാള ആഖ്യാനത്തിന് ഭൂതകാലം ഉപയോഗിച്ചു.
- source_word: Κακοὺς κακῶς
  choice: ആ ദുഷ്ടന്മാരെ ... ദാരുണമായി
  rationale: κακός എന്ന ഒരേ മൂലത്തിൽനിന്നുള്ള വിശേഷണവും ക്രിയാവിശേഷണവും ചേർന്ന് വിധിയുടെ തീവ്രത ഉയർത്തുന്നു. അസ്വാഭാവികമായ പദാനുപദ ആവർത്തനം ഒഴിവാക്കി ധാർമ്മിക കുറ്റവും ദാരുണമായ അന്തവും നിലനിർത്തി.
- source_word: ἀπολέσει
  choice: നശിപ്പിക്കും
  rationale: വിധി നിർണായകമാണെന്ന് വ്യക്തമാക്കുന്നു; എങ്ങനെ കൊല്ലപ്പെടും എന്നതുപോലുള്ള വിശദാംശം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: τὸν ἀμπελῶνα
  choice: മുന്തിരിത്തോട്ടം
  rationale: ἀμπελών എന്ന പദത്തിന്റെ സാധാരണവും വ്യക്തവുമായ മലയാളപരിഭാഷ; ഉപമയിലെ തോട്ടദൃശ്യം നിലനിർത്തുന്നു.
- source_word: ἐκδώσεται
  choice: പാട്ടത്തിന് കൊടുക്കും
  rationale: കൃഷിഭൂമി മറ്റുള്ളവർക്ക് കൂലി/വിളവിഹിത വ്യവസ്ഥയിൽ ഏൽപ്പിക്കുന്ന സന്ദർഭത്തിലെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἄλλοις γεωργοῖς
  choice: മറ്റു കൃഷിക്കാർക്ക്
  rationale: γεωργοί കൃഷി ചെയ്യുന്നവരെ സൂചിപ്പിക്കുന്നു; പാട്ടക്കാരെന്ന ആശയം മുൻക്രിയയിൽ ഇതിനകം വ്യക്തമാകുന്നു.
- source_word: ἀποδώσουσιν αὐτῷ
  choice: അവന് ... കൊടുക്കും
  rationale: അവനു ലഭിക്കേണ്ടത് തിരിച്ചുനൽകുക/നൽകുക എന്ന ἀποδίδωμι എന്ന പദത്തിന്റെ സന്ദർഭാർഥം ലളിതമായി നൽകുന്നു.
- source_word: τοὺς καρποὺς
  choice: അതിന്റെ വിളവ്
  rationale: കൃഷിസന്ദർഭത്തിൽ καρποί എന്നതിന്റെ സ്വാഭാവിക അർഥം; മുന്തിരിത്തോട്ടത്തിന്റെ ഉൽപ്പാദനവും പ്രതീക്ഷിക്കപ്പെട്ട ഫലവും സൂചിപ്പിക്കുന്നു.
- source_word: ἐν τοῖς καιροῖς αὐτῶν
  choice: അതതു കാലങ്ങളിൽ
  rationale: ഓരോ വിളവിനും യോജിച്ച നിശ്ചിത സമയങ്ങൾ എന്ന ബഹുവചനഭാവം നിലനിർത്തുന്നു.
theological_decisions:
- issue: കൃഷിക്കാർക്കുള്ള വിധിയുടെ തീവ്രതയും സ്വഭാവവും
  choice: ആ ദുഷ്ടന്മാരെ അവൻ ദാരുണമായി നശിപ്പിക്കും
  alternative: ആ ദുഷ്ടന്മാരെ അവൻ ദുഷ്ടമായ രീതിയിൽ നശിപ്പിക്കും
  rationale: മൂലപാഠത്തിലെ κακοὺς κακῶς എന്ന പദകളിയുടെ ശക്തി നിലനിർത്തുമ്പോഴും അസ്വാഭാവിക മലയാളം ഒഴിവാക്കുന്നു. വിധിയുടെ കഠിനത വ്യക്തമാക്കുന്നു; ശിക്ഷയുടെ കൃത്യമായ രീതി സംബന്ധിച്ച പ്രത്യേക സിദ്ധാന്തം പാഠത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. കൃഷിസംബന്ധമായ പാട്ടവ്യവസ്ഥ സാധാരണ വായനക്കാരന് വ്യക്തമായി വരാൻ ‘പാട്ടത്തിന് കൊടുക്കും’ ഉപയോഗിച്ചു; മൂലത്തിലെ വിധിതീവ്രതയും സമയങ്ങളുടെ ബഹുവചനവും സംരക്ഷിച്ചു.
