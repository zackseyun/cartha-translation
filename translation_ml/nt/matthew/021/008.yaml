source:
  edition: SBLGNT
  text: ὁ δὲ πλεῖστος ὄχλος ἔστρωσαν ἑαυτῶν τὰ ἱμάτια ἐν τῇ ὁδῷ, ἄλλοι δὲ ἔκοπτον κλάδους ἀπὸ τῶν δένδρων καὶ ἐστρώννυον ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/008.yaml
  text: Most of the crowd spread their garments on the road[b][a], and others were cutting branches from the trees and spreading them on the road.
translation:
  language: ml
  text: ജനക്കൂട്ടത്തിൽ ഭൂരിഭാഗവും തങ്ങളുടെ വസ്ത്രങ്ങൾ വഴിയിൽ വിരിച്ചു[a][b]; മറ്റുചിലർ മരങ്ങളിൽനിന്ന് കൊമ്പുകൾ വെട്ടിയും അവ വഴിയിൽ വിരിച്ചും കൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ജനക്കൂട്ടത്തിലെ വലിയൊരു ഭാഗം.’
    reason: lexical_alternative
  - marker: b
    text: ‘വസ്ത്രങ്ങൾ’ എന്നത് ഇവിടെ ‘മേൽവസ്ത്രങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ πλεῖστος ὄχλος
  choice: ജനക്കൂട്ടത്തിൽ ഭൂരിഭാഗവും
  rationale: πλεῖστος എന്നത് ഒരു സമൂഹനാമത്തോടൊപ്പം വരുമ്പോൾ ‘ഭൂരിഭാഗം’ എന്ന അർഥമാണ് സ്വാഭാവികം. δέയുടെ ലഘുവായ ആഖ്യാനബന്ധം മലയാളത്തിൽ പ്രത്യേക പദം ചേർക്കാതെ വാക്യക്രമത്തിലൂടെ പ്രകടമാകുന്നു.
- source_word: ἔστρωσαν
  choice: വിരിച്ചു
  rationale: στρώννυμι ഇവിടെ വസ്ത്രങ്ങൾ വഴിയുടെ മേൽ പരത്തിവയ്ക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘വിരിച്ചു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: ἑαυτῶν τὰ ἱμάτια
  choice: തങ്ങളുടെ വസ്ത്രങ്ങൾ
  rationale: ἑαυτῶνയിലെ സ്വയംസംബന്ധം ‘തങ്ങളുടെ’ എന്നു വ്യക്തമായി നിലനിർത്തുന്നു. ἱμάτια പൊതുവായി വസ്ത്രങ്ങളെയും പ്രത്യേകിച്ച് മേൽവസ്ത്രങ്ങളെയും സൂചിപ്പിക്കാം.
- source_word: ἐν τῇ ὁδῷ
  choice: വഴിയിൽ
  rationale: സഞ്ചാരപാതയുടെ മേൽ വസ്തുക്കൾ വിരിച്ചതിനെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘വഴിയിൽ’ എന്നു പറയുന്നു; രൂപകമായ ‘മാർഗം’ ഇവിടെ ഉദ്ദേശ്യമല്ല.
- source_word: ἄλλοι δὲ
  choice: മറ്റുചിലർ
  rationale: ജനക്കൂട്ടത്തിനുള്ളിലെ മറ്റൊരു വിഭാഗത്തെ സൂചിപ്പിക്കുന്നു. ശക്തമായ വൈരുധ്യം ഇല്ലാത്തതിനാൽ ‘എന്നാൽ’ ചേർക്കാതെ additive flow നിലനിർത്തുന്നു.
- source_word: ἔκοπτον κλάδους ἀπὸ τῶν δένδρων
  choice: മരങ്ങളിൽനിന്ന് കൊമ്പുകൾ വെട്ടി
  rationale: ἔκοπτον എന്ന imperfect തുടരുന്ന പശ്ചാത്തലപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ സംയുക്തക്രിയയിൽ ‘വെട്ടി ... വിരിച്ചുകൊണ്ടിരുന്നു’ ആ തുടർച്ച സ്വാഭാവികമായി നൽകുന്നു.
- source_word: καὶ ἐστρώννυον ἐν τῇ ὁδῷ
  choice: വഴിയിൽ വിരിച്ചുകൊണ്ടിരുന്നു
  rationale: ἐστρώννυον എന്ന imperfectന്റെ തുടർച്ചയായ ദൃശ്യം ‘വിരിച്ചുകൊണ്ടിരുന്നു’ സംരക്ഷിക്കുന്നു; ആവർത്തിച്ച ἐν τῇ ὁδῷയും അതേപടി നിലനിർത്തുന്നു.
