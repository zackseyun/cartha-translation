  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലപാഠത്തിലെ രണ്ടു imperfect ക്രിയകളുടെ തുടരുന്ന ദൃശ്യഭാവം മലയാളത്തിൽ ‘വെട്ടി ... വിരിച്ചുകൊണ്ടിരുന്നു’ എന്ന ഘടനയിലൂടെ പ്രകടമാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും അവ സംബന്ധിക്കുന്ന മുഖ്യവാചകഭാഗത്തിനു പിന്നാലെ നൽകിയിരിക്കുന്നു.
