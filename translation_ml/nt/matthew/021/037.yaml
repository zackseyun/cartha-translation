- from: 'എന്നാൽ പിന്നീട് അവൻ തന്റെ മകനെ അവരുടെ അടുക്കൽ അയച്ചുകൊണ്ട് പറഞ്ഞു: ‘അവർ എന്റെ മകനെ ആദരിക്കും[a].’'
  to: എന്നാൽ പിന്നീട് അവൻ തന്റെ മകനെ അവരുടെ അടുക്കലേക്ക് അയച്ചു; ‘അവർ എന്റെ മകനെ ആദരിക്കും’ എന്നു പറഞ്ഞു.
