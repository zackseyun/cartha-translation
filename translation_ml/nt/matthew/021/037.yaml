id: MAT.21.37
reference: Matthew 21:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὕστερον δὲ ἀπέστειλεν πρὸς αὐτοὺς τὸν υἱὸν αὐτοῦ λέγων· Ἐντραπήσονται τὸν υἱόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/037.yaml
  text: But later he sent his son to them[a], saying, ‘They will respect my son.’
translation:
  language: ml
  text: എന്നാൽ പിന്നീട് അവൻ തന്റെ മകനെ അവരുടെ അടുക്കലേക്ക് അയച്ചു; ‘അവർ എന്റെ മകനെ ആദരിക്കും’ എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὕστερον
  choice: പിന്നീട്
  rationale: സംഭവക്രമത്തിൽ ‘ശേഷം/പിന്നീട്’ എന്ന കാലസൂചന നൽകുന്നു; ‘ഒടുവിൽ’ എന്നു പറഞ്ഞാൽ ഗ്രീക്കിൽ നിർബന്ധമല്ലാത്ത അന്തിമത്വം ചേർന്നേക്കാം.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: ദാസന്മാരെ അയച്ചതിൽനിന്ന് മകനെ അയക്കുന്നതിലേക്കുള്ള മൃദുവായ വൈരുധ്യവും കഥയിലെ വഴിത്തിരിവും വ്യക്തമാക്കുന്നു.
- source_word: ἀπέστειλεν πρὸς αὐτοὺς
  choice: അവരുടെ അടുക്കൽ അയച്ചു
  rationale: πρός + ദ്വിതീയാവിഭക്തി ആളുകളിലേക്കുള്ള ദിശ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ പ്രയോഗം.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: തന്റെ മകനെ
  rationale: കർത്താവിലേക്കുതന്നെ ഉടമസ്ഥബന്ധം തിരിച്ചുനൽകാൻ ‘തന്റെ’ സ്വാഭാവികമാണ്; ഗ്രീക്കിൽ ഇല്ലാത്ത ‘പ്രിയ’ എന്ന വിശേഷണം ചേർക്കുന്നില്ല.
- source_word: λέγων
  choice: പറഞ്ഞുകൊണ്ട്
  rationale: പ്രധാനക്രിയയോടൊപ്പം വാക്കുകളുടെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന വർത്തമാന കൃദന്തരൂപത്തിന്റെ ബന്ധം നിലനിർത്തുന്നു.
- source_word: Ἐντραπήσονται
  choice: ആദരിക്കും
  rationale: നേരിട്ടുള്ള കർമമായ ‘എന്റെ മകനെ’ എന്നതിനൊപ്പം ഇവിടെ കാണിക്കേണ്ട ബഹുമാനം/മര്യാദ എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു; ലജ്ജിക്കുക എന്ന മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: τὸν υἱόν μου
  choice: എന്റെ മകനെ
  rationale: വക്താവിന്റെ വ്യക്തിപരവും ബന്ധപരവുമായ പ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഉപമയിലെ മകനെ ക്രിസ്തുവിനെക്കുറിച്ചുള്ള വ്യാഖ്യാനം മുൻകൂട്ടി ചേർക്കാതെ വിവർത്തനം ചെയ്യുക
  choice: തന്റെ മകൻ / എന്റെ മകൻ
  alternative: തന്റെ പ്രിയപുത്രൻ / പുത്രൻ
  rationale: ഉപമ ക്രിസ്തുവിലേക്കു വിരൽചൂണ്ടുന്നുവെങ്കിലും ഈ വാക്യത്തിലെ υἱός സാധാരണ ‘മകൻ’ എന്ന പദമാണ്; ἀγαπητός ഇല്ലാത്തതിനാൽ ‘പ്രിയ’ ചേർക്കുകയോ പദവിനാമസ്വഭാവം നിർബന്ധിക്കുകയോ ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള മലയാളം. ‘അവരുടെ അടുക്കൽ’ എന്നത് ഉപമയുടെ ശൈലിക്ക് യോജിച്ച സ്വാഭാവിക ദിശാപ്രയോഗമാണ്; ‘ആദരിക്കും’ ഇന്നത്തെ വായനയിൽ വ്യക്തവും അമിതമായ ആരാധനാഭാവം ഒഴിവാക്കുന്നതുമാണ്.
