id: MAT.21.19
reference: Matthew 21:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἰδὼν συκῆν μίαν ἐπὶ τῆς ὁδοῦ ἦλθεν ἐπ’ αὐτήν, καὶ οὐδὲν εὗρεν ἐν αὐτῇ εἰ μὴ φύλλα μόνον, καὶ λέγει αὐτῇ· ⸀Μηκέτι ἐκ σοῦ καρπὸς γένηται εἰς τὸν αἰῶνα· καὶ ἐξηράνθη παραχρῆμα ἡ συκῆ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/019.yaml
  text: And seeing a fig tree by the road[a], he came up to it and found nothing on it except leaves alone. And he said to it, “May there no longer ever be fruit from you.” And the fig tree withered at once.
translation:
  language: ml
  text: വഴിയരികിൽ ഒരു അത്തിവൃക്ഷം കണ്ട് അവൻ അതിന്റെ അടുത്തേക്കു ചെന്നു. അതിൽ ഇലകളല്ലാതെ മറ്റൊന്നും കണ്ടില്ല. അവൻ അതിനോട്, “ഇനി ഒരിക്കലും നിന്നിൽനിന്ന് ഫലം ഉണ്ടാകാതിരിക്കട്ടെ” എന്നു പറഞ്ഞു.[a] ഉടൻതന്നെ ആ അത്തിവൃക്ഷം ഉണങ്ങിപ്പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഇനി ഒരിക്കലും നിന്നിൽനിന്ന് ഫലം വരാതിരിക്കട്ടെ.”'
    reason: γένηται-യുടെ ജസ്സീവ്/പ്രഖ്യാപനസ്വഭാവവും ἐκ σοῦ-വിന്റെ ‘നിന്നിൽനിന്ന്’ എന്ന ഉറവിടസൂചനയും നിലനിർത്തിക്കൊണ്ട് കൂടുതൽ സ്വാഭാവികമായ ക്രിയാബദൽ നൽകുന്നു.
lexical_decisions:
- source_word: συκῆν μίαν
  choice: ഒരു അത്തിവൃക്ഷം
  rationale: μίαν ഇവിടെ ഒരു പ്രത്യേക വൃക്ഷത്തെ ആദ്യമായി പരിചയപ്പെടുത്തുന്നു; ‘ഒരു’ എന്നത് സ്വാഭാവിക മലയാളവും മൂലത്തിലെ ഏകവചന സൂചനയും നിലനിർത്തുന്നു.
- source_word: ἐπὶ τῆς ὁδοῦ
  choice: വഴിയരികിൽ
  rationale: നിശ്ചലമായ വൃക്ഷത്തിന്റെ സ്ഥാനം സൂചിപ്പിക്കുന്ന പ്രയോഗം; ‘വഴിയരികിൽ’ എന്നത് ‘വഴിയിൽ’ എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: ἦλθεν ἐπ’ αὐτήν
  choice: അതിന്റെ അടുത്തേക്കു ചെന്നു
  rationale: വൃക്ഷത്തെ സമീപിക്കുന്ന ചലനം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: οὐδὲν εὗρεν ἐν αὐτῇ εἰ μὴ φύλλα μόνον
  choice: അതിൽ ഇലകളല്ലാതെ മറ്റൊന്നും കണ്ടില്ല
  rationale: εἰ μὴ ... μόνον എന്ന ഊന്നൽ മലയാളത്തിലെ ‘അല്ലാതെ മറ്റൊന്നും’ എന്ന ഘടന വ്യക്തമായി പകരുന്നു.
- source_word: λέγει αὐτῇ
  choice: അവൻ അതിനോട് ... എന്നു പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനം മലയാള കഥനരീതിയിൽ സ്വാഭാവികമായ ഭൂതകാലമായി നൽകി.
- source_word: Μηκέτι ἐκ σοῦ καρπὸς γένηται εἰς τὸν αἰῶνα
  choice: ഇനി ഒരിക്കലും നിന്നിൽനിന്ന് ഫലം ഉണ്ടാകാതിരിക്കട്ടെ
  rationale: μηκέτι-യുടെ ‘ഇനി ... ഇല്ല’ എന്ന അർഥവും εἰς τὸν αἰῶνα നൽകുന്ന സ്ഥിരതയും ‘ഇനി ഒരിക്കലും’ പകരുന്നു; ἐκ σοῦ എന്ന ഉറവിടചിത്രം ‘നിന്നിൽനിന്ന്’ നിലനിർത്തുന്നു.
- source_word: ἐξηράνθη παραχρῆμα
  choice: ഉടൻതന്നെ ... ഉണങ്ങിപ്പോയി
  rationale: പരാഖ്രേമയുടെ തൽക്ഷണതയും വൃക്ഷം വാടിയുണങ്ങുന്ന അർഥവും സാധാരണ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: അത്തിവൃക്ഷത്തോടുള്ള യേശുവിന്റെ പ്രഖ്യാപനത്തിന്റെ സ്വഭാവം
  choice: ‘ഉണ്ടാകാതിരിക്കട്ടെ’ എന്ന നിഷേധാത്മക ആശംസാ/ആജ്ഞാഭാവമുള്ള രൂപം
  alternative: ‘ഇനി നിന്നിൽ ഫലം ഉണ്ടാകുകയില്ല’ എന്ന പ്രവചനാത്മക പ്രഖ്യാപനം
  rationale: Μηκέτι സഹിതമുള്ള γένηται എന്ന subjunctive രൂപത്തിന്റെ നിരോധനാത്മകവും ശാപപ്രഖ്യാപനസദൃശവുമായ ബലം നിലനിർത്തുന്നു; അതിനെ വെറും പ്രവചനമായി നിർണ്ണയിക്കുന്നില്ല.
- issue: അത്തിവൃക്ഷത്തിന്റെ പ്രതീകാർഥം
  choice: പ്രതീകവ്യാഖ്യാനം മുഖ്യവാക്യത്തിൽ ചേർക്കുന്നില്ല
  alternative: ഇസ്രായേലിനെയോ ഫലരഹിതമായ വിശ്വാസത്തെയോ നേരിട്ട് സൂചിപ്പിക്കുന്നതായി വിശദീകരിക്കുക
  rationale: ഈ വാക്യം തന്നെ പ്രതീകത്തിന്റെ ലക്ഷ്യം തുറന്നുപറയുന്നില്ല; അതിനാൽ വ്യാഖ്യാനപരമായ ദൈവശാസ്ത്ര നിഗമനം വിവർത്തനത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം ഗൗരവമുള്ളതുമായ ശൈലി. ‘നിന്നിൽനിന്ന്’ എന്ന രൂപം മൂലപാഠത്തിലെ ഉറവിടചിത്രം നിലനിർത്തുന്നു; അനാവശ്യമായ സഭാഭാഷയും വിഭാഗീയ വ്യാഖ്യാനവും ഒഴിവാക്കി.
