  to: വഴിയരികിൽ ഒരു അത്തിവൃക്ഷം കണ്ട് അവൻ അതിന്റെ അടുത്തേക്കു ചെന്നു. അതിൽ ഇലകളല്ലാതെ മറ്റൊന്നും കണ്ടില്ല. അവൻ അതിനോട്, “ഇനി ഒരിക്കലും നിന്നിൽനിന്ന് ഫലം ഉണ്ടാകാതിരിക്കട്ടെ” എന്നു പറഞ്ഞു.[a] ഉടൻതന്നെ ആ അത്തിവൃക്ഷം ഉണങ്ങിപ്പോയി.
  rationale: മുഖ്യവാക്യത്തിൽ മാറ്റം ആവശ്യമില്ല. പക്ഷേ പ്രവചനാത്മകമായ ‘ഉണ്ടാകുകയില്ല’ എന്ന അടിക്കുറിപ്പ് മൂലവാക്യത്തിന്റെ ജസ്സീവ് ബലത്തെ മാറ്റുന്നതിനാൽ അത് അതേ ബലം നിലനിർത്തുന്ന ‘വരാതിരിക്കട്ടെ’ എന്ന ബദലായി തിരുത്തി. ഈ പരിഷ്കാരം വ്യാഖ്യാനപരമായ പ്രതീകാർഥമോ വിഭാഗീയ ദൈവശാസ്ത്രമോ ചേർക്കുന്നില്ല.
