source:
  edition: SBLGNT
  text: διὰ τοῦτο λέγω ὑμῖν ὅτι ἀρθήσεται ἀφ’ ὑμῶν ἡ βασιλεία τοῦ θεοῦ καὶ δοθήσεται ἔθνει ποιοῦντι τοὺς καρποὺς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/043.yaml
  text: Therefore I tell you[a], the kingdom of God will be taken away from you and given to a nation producing its fruits.
translation:
  language: ml
  text: 'അതുകൊണ്ട് ഞാൻ നിങ്ങളോടു പറയുന്നു: ദൈവരാജ്യം നിങ്ങളിൽനിന്ന് എടുത്തുമാറ്റപ്പെടുകയും, അതിന്റെ ഫലങ്ങൾ ഉളവാക്കുന്ന ഒരു ജനതയ്ക്ക്[a] നൽകപ്പെടുകയും ചെയ്യും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരു ജനത്തിന്.’ ഗ്രീക്ക് പദമായ ἔθνος ഒരു ജനതയെയോ ജനസമൂഹത്തെയോ സൂചിപ്പിക്കാം. ഇവിടെ ഫലങ്ങൾ ഉളവാക്കുന്നതിലൂടെ തിരിച്ചറിയപ്പെടുന്ന ഒരു സമൂഹത്തെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ആ സമൂഹം ആരാണെന്ന് ഇതിലും കൃത്യമായി നിർണയിക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: അതുകൊണ്ട്
  rationale: മുൻപുള്ള ഉപമയിലും ഉദ്ധരണിയിലുംനിന്നുള്ള നിഗമനം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: വ്യക്തിപരമായ അഭിസംബോധന നിലനിർത്തുന്ന സ്വാഭാവിക ആധുനിക മലയാള പ്രയോഗം.
- source_word: ἀρθήσεται ἀφ’ ὑμῶν
  choice: നിങ്ങളിൽനിന്ന് എടുത്തുമാറ്റി
  rationale: ഭാവികാല കർമണിപ്രയോഗവും നിലവിലെ കൈവശക്കാരിൽനിന്നുള്ള വേർപാടും നഷ്ടവും വ്യക്തമാക്കുന്നു; തുടർന്നുള്ള ‘നൽകപ്പെടും’ എന്ന ക്രിയയുമായി സ്വാഭാവികമായി ചേരുന്നു.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ദൈവരാജ്യം
  rationale: ദൈവത്തിന്റെ ഭരണവും രാജ്യവും ഉൾക്കൊള്ളുന്ന ഗ്രീക്ക് പദത്തിന്റെ വ്യാപ്തി അനാവശ്യമായി ചുരുക്കാതെ നിലനിർത്തുന്ന സ്ഥാപിത മലയാള രൂപം.
- source_word: δοθήσεται
  choice: നൽകപ്പെടും
  rationale: ഭാവികാല കർമണിപ്രയോഗം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: ἔθνει
  choice: ഒരു ജനതയ്ക്ക്
  rationale: ἔθνος എന്ന പദത്തിന്റെ സമൂഹപരമായ അർഥം നിലനിർത്തുന്നു; സഭ, വിജാതീയർ, അല്ലെങ്കിൽ പുതുക്കപ്പെട്ട ദൈവജനം എന്നിങ്ങനെ ഏതെങ്കിലും ഒരു വ്യാഖ്യാനം പാഠത്തിലേക്ക് മുൻകൂട്ടി കൊണ്ടുവരുന്നില്ല.
- source_word: ποιοῦντι
  choice: ഉളവാക്കുന്ന
  rationale: വർത്തമാനകാല കർത്തൃവാചക കൃദന്തത്തിന്റെ തുടർച്ചയായ പ്രവർത്തനഭാവം പ്രകടമാക്കുകയും ‘ഫലങ്ങൾ’ എന്ന രൂപകത്തോടു സ്വാഭാവികമായി ചേരുകയും ചെയ്യുന്നു.
- source_word: τοὺς καρποὺς αὐτῆς
  choice: അതിന്റെ ഫലങ്ങൾ
  rationale: ബഹുവചനമായ καρπούς നിലനിർത്തുന്നു; സ്ത്രീലിംഗ സർവനാമമായ αὐτῆς ഏറ്റവും സ്വാഭാവികമായി ‘രാജ്യം’ എന്നതിനെയാണ് സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: ἔθνει എന്നതിന്റെ സൂചിതസമൂഹം
  choice: പ്രധാനപാഠത്തിൽ ‘ഒരു ജനതയ്ക്ക്’ എന്നു പൊതുവായി നൽകി.
  alternative: ‘ഒരു ജനത്തിന്’; സഭയ്ക്ക്; വിജാതീയർക്ക്; ഫലം കായ്ക്കുന്ന പുതുക്കപ്പെട്ട ദൈവജനത്തിന്.
  rationale: വാക്യം ഫലോൽപാദനത്താൽ തിരിച്ചറിയപ്പെടുന്ന ഒരു സമൂഹത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും അതിനെ പിന്നീടുള്ള ഏതെങ്കിലും ഒറ്റ ദൈവശാസ്ത്രപരമായ തിരിച്ചറിയലിലേക്ക് ഗ്രീക്ക് പദം തന്നെ പരിമിതപ്പെടുത്തുന്നില്ല.
- issue: ഈ ന്യായവിധിവചനത്തിലെ ἡ βασιλεία τοῦ θεοῦ
  choice: ‘ദൈവരാജ്യം’ എന്ന പൂർണ പ്രയോഗം നിലനിർത്തി.
  alternative: ‘ദൈവത്തിന്റെ ഭരണം’; ‘രാജ്യത്തിൽ ഉൾപ്പെടാനുള്ള അവകാശം’ അല്ലെങ്കിൽ ‘രാജ്യത്തിന്റെ അനുഗ്രഹങ്ങൾ’.
  rationale: മൂലവാക്യത്തിന്റെ വിശാലമായ ദൈവശാസ്ത്രപരമായ അർഥപരിധി നിലനിർത്തുന്നു; ന്യായവിധിയുടെ സ്വഭാവത്തെ പരിഭാഷയിൽ അനാവശ്യമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ദൈവരാജ്യം’ എന്ന പരിചിതമായ ബൈബിൾ പ്രയോഗം നിലനിർത്തി; സാങ്കേതികമോ സഭാവിഭാഗപരമോ ആയ വ്യാഖ്യാനപദങ്ങൾ ഒഴിവാക്കി. അടിക്കുറിപ്പ് ചിഹ്നം പ്രധാനപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
