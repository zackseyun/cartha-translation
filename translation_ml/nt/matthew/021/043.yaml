  terminology: ‘ദൈവരാജ്യം’ appropriately preserves βασιλεία τοῦ θεοῦ without narrowing it to either rule or realm. ‘ഒരു ജനത’ is a sound non-sectarian rendering of ἔθνει. The footnote properly records ‘ഒരു ജനം’ as a lexical alternative and does not identify the recipient with a particular later community.
