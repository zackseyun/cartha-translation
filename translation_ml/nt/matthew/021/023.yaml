id: MAT.21.23
reference: Matthew 21:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ⸂ἐλθόντος αὐτοῦ⸃ εἰς τὸ ἱερὸν προσῆλθον αὐτῷ διδάσκοντι οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ λέγοντες· Ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς; καὶ τίς σοι ἔδωκεν τὴν ἐξουσίαν ταύτην;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/023.yaml
  text: And when he came into the temple[a], the chief priests and the elders of the people came up to him while he was teaching and said, “By what authority are you doing these things? And who gave you this authority?”
translation:
  language: ml
  text: 'അവൻ ദേവാലയത്തിൽ[a] ചെന്നു പഠിപ്പിച്ചുകൊണ്ടിരിക്കുമ്പോൾ, മുഖ്യപുരോഹിതന്മാരും ജനത്തിന്റെ മൂപ്പന്മാരും അവന്റെ അടുക്കൽ വന്ന് ചോദിച്ചു: “എന്ത് അധികാരത്താലാണ് നീ ഇതൊക്കെ ചെയ്യുന്നത്? ആരാണ് നിനക്ക് ഈ അധികാരം തന്നത്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദമായ ἱερόν ദേവാലയത്തിന്റെ അകത്തെ വിശുദ്ധമന്ദിരത്തെ മാത്രം അല്ല, ദേവാലയസമുച്ചയത്തെയോ അതിന്റെ പ്രാകാരങ്ങളെയോ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθόντος αὐτοῦ
  choice: അവൻ ... ചെന്നു ... ഇരിക്കുമ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ടിന്റെ കാലസൂചന സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; വരവിനുശേഷം പഠിപ്പിക്കുന്നതിനിടയിലാണ് നേതാക്കൾ സമീപിച്ചതെന്ന ക്രമം നിലനിർത്തുന്നു.
- source_word: ἱερὸν
  choice: ദേവാലയം
  rationale: ἱερόν അകത്തെ വിശുദ്ധമന്ദിരത്തെ മാത്രം അല്ല, മുഴുവൻ ദേവാലയസമുച്ചയത്തെയും സൂചിപ്പിക്കുന്നു. വായനാസൗകര്യത്തിനായി പൊതുവായ പദം ഉപയോഗിച്ച് പരിധി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: προσῆλθον αὐτῷ
  choice: അവന്റെ അടുക്കൽ വന്നു
  rationale: ശാരീരികമായി സമീപിക്കുന്നതിന്റെ കഥാപരമായ ഭാവം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: διδάσκοντι
  choice: പഠിപ്പിച്ചുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: വർത്തമാന കൃദന്തം മുഖ്യക്രിയയോടൊപ്പം നടക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നതിനാൽ കാലസമകാലികത വ്യക്തമാക്കുന്നു.
- source_word: οἱ ἀρχιερεῖς
  choice: മുഖ്യപുരോഹിതന്മാർ
  rationale: ഇത് ഒരേ സമയം പല മഹാപുരോഹിതന്മാരെയല്ല, പുരോഹിതനേതൃത്വത്തിലുള്ള പ്രമുഖ അധികാരികളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: οἱ πρεσβύτεροι τοῦ λαοῦ
  choice: ജനത്തിന്റെ മൂപ്പന്മാർ
  rationale: യഹൂദജനതയിലെ അംഗീകൃത മുതിർന്ന നേതാക്കളെ സൂചിപ്പിക്കുന്ന ഘടന നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: Ἐν ποίᾳ ἐξουσίᾳ
  choice: എന്ത് അധികാരത്താൽ
  rationale: പ്രവർത്തനത്തിനുള്ള അധികാരത്തിന്റെ അടിസ്ഥാനത്തെ ചോദ്യം ചെയ്യുന്ന പ്രയോഗം; മലയാളത്തിൽ ഉപകരണാർഥക രൂപം സ്വാഭാവികമാണ്.
- source_word: ταῦτα ποιεῖς
  choice: നീ ഇതൊക്കെ ചെയ്യുന്നത്
  rationale: അന്നത്തെ ദേവാലയസന്ദർഭത്തിലെ യേശുവിന്റെ ഇപ്പോഴത്തെ പ്രവർത്തനങ്ങളെ സൂചിപ്പിക്കുന്നു; ταῦτα എന്ന ബഹുവചനസമാഹാരഭാവം ‘ഇതൊക്കെ’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τίς σοι ἔδωκεν τὴν ἐξουσίαν ταύτην
  choice: ആരാണ് നിനക്ക് ഈ അധികാരം തന്നത്
  rationale: അധികാരം നൽകിയ വ്യക്തിയെയും ആ നൽകൽപ്രവൃത്തിയെയും ചോദ്യം ചെയ്യുന്ന ഗ്രീക്ക് വാക്യത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: നേതാക്കളുടെ ചോദ്യത്തിലെ ἐξουσία എന്നതിന്റെ അർഥം
  choice: അധികാരം
  alternative: അവകാശം; ശക്തി
  rationale: സന്ദർഭം വെറും ശക്തിയെക്കുറിച്ചല്ല, യേശുവിന്റെ പഠിപ്പിക്കലിനും പ്രവർത്തനങ്ങൾക്കും ലഭിച്ച നിയമാനുസൃത അംഗീകാരത്തെയും അധികാരത്തെയും കുറിച്ചാണ്. ‘അധികാരം’ സ്ഥാപനപരവും ദൈവശാസ്ത്രപരവുമായ സാധ്യതകൾ മുൻകൂട്ടി തീർപ്പാക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥാശൈലി. ‘ദേവാലയം’ എന്ന പരിചിതപദം വായനാസൗകര്യത്തിനായി ഉപയോഗിച്ചു; ‘മുഖ്യപുരോഹിതന്മാർ’, ‘മൂപ്പന്മാർ’, ‘അധികാരം’ എന്നീ പദങ്ങൾ ചരിത്രപരവും ദൈവശാസ്ത്രപരവുമായ സൂക്ഷ്മത കാത്തുസൂക്ഷിക്കുന്നു.
