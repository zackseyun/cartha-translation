id: MAT.21.3
reference: Matthew 21:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐάν τις ὑμῖν εἴπῃ τι, ἐρεῖτε ὅτι Ὁ κύριος αὐτῶν χρείαν ἔχει· ⸀εὐθὺς δὲ ⸀ἀποστελεῖ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/003.yaml
  text: And if anyone says anything to you[a], you shall say[b], ‘The Lord has need of them,’ and he will send them at once.
translation:
  language: ml
  text: ആരെങ്കിലും നിങ്ങളോട് എന്തെങ്കിലും പറഞ്ഞാൽ, ‘കർത്താവിന്[a] അവയെ വേണം’ എന്നു പറയുക; ആ വ്യക്തി ഉടൻതന്നെ അവയെ അയയ്ക്കും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘ഉടമയ്ക്ക് അവയെ വേണം.’'
    reason: κύριος എന്ന പദത്തിന് സന്ദർഭമനുസരിച്ച് ‘കർത്താവ്’ എന്നും ‘ഉടമ’ അല്ലെങ്കിൽ ‘യജമാനൻ’ എന്നും അർഥമാകാം.
  - marker: b
    text: ‘ആ വ്യക്തി’ എന്നത് സന്ദർഭത്തിൽ മൃഗങ്ങളെ അയയ്ക്കുന്ന, ശിഷ്യരോട് സംസാരിക്കുന്ന ആളെ സൂചിപ്പിക്കാം. ഗ്രീക്കിൽ ക്രിയയുടെ കർത്താവ് വ്യക്തമല്ലാത്തതിനാൽ, ‘കർത്താവ് അവയെ ഉടൻ അയയ്ക്കും’ എന്നും മനസ്സിലാക്കാം.
    reason: ἀποστελεῖ എന്ന ക്രിയയുടെ കർത്താവ് ഗ്രീക്ക് വാക്യത്തിൽ പ്രകടമായി പറഞ്ഞിട്ടില്ല. ‘തിരികെ’ എന്ന ആശയം സാധ്യമായ സന്ദർഭവ്യാഖ്യാനമാണ്; എന്നാൽ മൂലപാഠത്തിൽ നേരിട്ട് ഇല്ല.
lexical_decisions:
- source_word: ἐάν τις ὑμῖν εἴπῃ τι
  choice: ആരെങ്കിലും നിങ്ങളോട് എന്തെങ്കിലും പറഞ്ഞാൽ
  rationale: തുറന്ന സാധ്യത സൂചിപ്പിക്കുന്ന നിബന്ധനയും, പറയാവുന്ന ഏതു വാക്കിനെയും ഉൾക്കൊള്ളുന്ന τι എന്നതിന്റെ വിശാലതയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐρεῖτε
  choice: എന്നു പറയുക
  rationale: ഭാവികാലരൂപത്തിന് ഇവിടെ നിർദേശാത്മക ബലമുണ്ട്; മലയാളത്തിലെ കല്പനാരൂപം ആ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: Ὁ κύριος
  choice: കർത്താവ്
  rationale: κύριος എന്ന പദത്തിന്റെ അധികാരസൂചനയും ക്രിസ്തുവിനെ സംബന്ധിച്ച ശീർഷകസാധ്യതയും നിലനിർത്തുന്നു; സന്ദർഭപരമായി ‘ഉടമ’ എന്നും മനസ്സിലാക്കാൻ കഴിയുന്നതിനാൽ അത് അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: αὐτῶν χρείαν ἔχει
  choice: അവയെ ആവശ്യമുണ്ട്
  rationale: കഴുതയെയും കഴുതക്കുട്ടിയെയും സൂചിപ്പിക്കുന്ന ബഹുവചന സർവനാമവും ‘ആവശ്യമുണ്ട്’ എന്ന ഗ്രീക്ക് പ്രയോഗവും വ്യക്തമായി പകരുന്നു.
- source_word: εὐθὺς
  choice: ഉടൻതന്നെ
  rationale: കാലതാമസമില്ലാത്ത പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്ന εὐθύς എന്നതിന്റെ സ്വാഭാവികവും ഊന്നലുള്ളതുമായ മലയാളരൂപം.
- source_word: ἀποστελεῖ αὐτούς
  choice: അയാൾ അവയെ അയയ്ക്കും
  rationale: ἀποστέλλω എന്നതിലെ ‘അയയ്ക്കുക’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; ഗ്രീക്കിൽ വ്യക്തമാക്കാത്ത ‘തിരികെ’ എന്ന ആശയം മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: Ὁ κύριος എന്നതിന്റെ അർഥവും സൂചനയും
  choice: കർത്താവ്
  alternative: ഉടമ / യജമാനൻ
  rationale: യേശു തന്നെക്കുറിച്ച് അധികാരത്തോടെ പറയുന്നതായ ക്രിസ്തുശാസ്ത്രപരമായ സൂചന നഷ്ടപ്പെടുത്താതെ κύριος-ന്റെ സാധാരണ ശീർഷകരൂപം നിലനിർത്തുന്നു; എന്നാൽ മൃഗങ്ങളുടെ ഉടമ എന്ന സന്ദർഭാർഥസാധ്യത അടിക്കുറിപ്പിലൂടെ തുറന്നുവയ്ക്കുന്നു.
- issue: ἀποστελεῖ എന്ന ക്രിയയുടെ കർത്താവ്
  choice: ‘അയാൾ’ എന്ന സർവനാമം ഉപയോഗിച്ച് വാചകത്തിലെ സാധ്യത നിലനിർത്തുന്നു
  alternative: കർത്താവ് അവയെ തിരികെ അയയ്ക്കും
  rationale: ക്രിയയുടെ കർത്താവിനെ ഗ്രീക്ക് പ്രത്യേകം പറയുന്നില്ല. ഏറ്റവും സ്വാഭാവികമായി, ശിഷ്യരോട് ചോദ്യം ചെയ്യുന്ന ആൾ മൃഗങ്ങളെ അയയ്ക്കും എന്നാണ് വായിക്കാവുന്നത്; ‘കർത്താവ് അവയെ ഉടൻ തിരികെ അയയ്ക്കും’ എന്ന വായനയും വ്യാകരണപരമായി സാധ്യമായതിനാൽ മുഖ്യവാചകത്തിൽ അത് നിർബന്ധമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി. ‘കർത്താവ്’, ‘ആവശ്യമുണ്ട്’ എന്നിവ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവം നൽകുമ്പോഴും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നു; ഗ്രീക്കിലെ കർത്തൃസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചിരിക്കുന്നു.
