revisions:
- from: ആരെങ്കിലും നിങ്ങളോട് എന്തെങ്കിലും പറഞ്ഞാൽ, ‘കർത്താവിന്[a] അവയെ ആവശ്യമുണ്ട്’ എന്നു പറയുക; അയാൾ ഉടൻതന്നെ അവയെ അയയ്ക്കും.[b]
  to: ആരെങ്കിലും നിങ്ങളോട് എന്തെങ്കിലും പറഞ്ഞാൽ, ‘കർത്താവിന്[a] അവയെ വേണം’ എന്നു പറയുക; ആ വ്യക്തി ഉടൻതന്നെ അവയെ അയയ്ക്കും.[b]
  rationale: The revision improves idiomatic Malayalam for ‘has need of them’ and replaces the somewhat colloquial/distancing ‘അയാൾ’ with a clearer reference to the hypothetical person. The footnote preserves the syntactic ambiguity of the implicit subject and avoids importing an explicit ‘return’ sense into the translation.
