review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the conditional objection, the instruction to reply, the plural reference to the animals, and the immediacy of εὐθύς. However, the wording for χρείαν ἔχει is less natural in modern Malayalam, and the note should describe the implicit subject of ἀποστελεῖ more precisely without treating either contextual construal as certain.
  naturalness: ‘കർത്താവിന് അവയെ ആവശ്യമുണ്ട്’ is understandable but somewhat calqued. ‘കർത്താവിന് അവയെ വേണം’ is straightforward modern standard Malayalam and naturally expresses the Greek idiom. ‘അയാൾ’ is acceptable but can sound slightly distancing; ‘ആ വ്യക്തി’ gives a clearer backward reference to the hypothetical speaker.
  terminology: ‘കർത്താവ്’ appropriately preserves Ὁ κύριος and its Matthean titular force. The alternative ‘ഉടമ’ belongs in a footnote as a contextual possibility, not in the main text. No doctrinal narrowing is introduced.
  issues:
  - severity: medium
    issue: The main rendering of χρείαν ἔχει is mildly unnatural.
    rationale: In current standard Malayalam, ‘കർത്താവിന് അവയെ വേണം’ is the more idiomatic way to express ‘the Lord has need of them,’ while retaining the plural object and the sense of need.
  - severity: medium
    issue: The explanation of the subject of ἀποστελεῖ needs greater precision.
    rationale: The Greek future verb has an unexpressed subject. Context can favor the person who raises the objection, while a reading in which ‘the Lord’ is the subject is also possible. The note should not imply that grammar itself decisively identifies the subject, nor should it add ‘back’ to the main wording.
  revised_text: ആരെങ്കിലും നിങ്ങളോട് എന്തെങ്കിലും പറഞ്ഞാൽ, ‘കർത്താവിന്[a] അവയെ വേണം’ എന്നു പറയുക; ആ വ്യക്തി ഉടൻതന്നെ അവയെ അയയ്ക്കും.[b]
