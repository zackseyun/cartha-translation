source:
  edition: SBLGNT
  text: Τί δὲ ὑμῖν δοκεῖ; ἄνθρωπος εἶχεν τέκνα δύο. ⸀προσελθὼν τῷ πρώτῳ εἶπεν· Τέκνον, ὕπαγε σήμερον ἐργάζου ἐν τῷ ⸀ἀμπελῶνι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/028.yaml
  text: But what do you think? A man had two children. Going to the first[a], he said, ‘Child, go work today in the vineyard.’
translation:
  language: ml
  text: '“എന്നാൽ നിങ്ങൾക്ക് എന്തു തോന്നുന്നു? ഒരു മനുഷ്യന് രണ്ടു മക്കളുണ്ടായിരുന്നു. അയാൾ ആദ്യത്തെ കുട്ടിയുടെ[a] അടുത്തുചെന്ന് പറഞ്ഞു: ‘കുട്ടീ, ഇന്ന് മുന്തിരിത്തോട്ടത്തിൽ പോയി ജോലി ചെയ്യുക.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന τέκνα, τέκνον എന്നീ പദങ്ങൾ പൊതുവായി ‘മക്കൾ’, ‘കുട്ടി’ എന്നർഥമുള്ളവയാണ്; അവ ‘പുത്രന്മാർ’, ‘മകൻ’ എന്നു മാത്രമായി ലിംഗം നിർണയിക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί δὲ ὑμῖν δοκεῖ;
  choice: എന്നാൽ നിങ്ങൾക്ക് എന്തു തോന്നുന്നു?
  rationale: δὲ എന്നതിന്റെ മൃദുവായ ബന്ധകശക്തി ‘എന്നാൽ’ നിലനിർത്തുന്നു; δοκεῖ എന്നത് ശ്രോതാക്കളുടെ വിലയിരുത്തൽ ചോദിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമായി നൽകിയിരിക്കുന്നു.
- source_word: ἄνθρωπος
  choice: ഒരു മനുഷ്യൻ
  rationale: കഥാസന്ദർഭത്തിലെ പുരുഷനായ ഗൃഹനാഥനെ കൃത്യമായും സ്വാഭാവികമായും സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത ‘ഒരു പ്രത്യേക’ എന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: τέκνα δύο
  choice: രണ്ടു മക്കൾ
  rationale: τέκνα ലിംഗനിർണയമില്ലാത്ത ‘children’ എന്ന വിശാല അർഥമുള്ളതാണ്. മലയാളത്തിലെ ‘മക്കൾ’ ഈ വിശാലത സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: προσελθὼν τῷ πρώτῳ
  choice: ഒന്നാമത്തെ മകന്റെ അടുത്തുചെന്ന്
  rationale: പങ്കാളിക്രിയയുടെ തുടർച്ചാസ്വഭാവം ‘അടുത്തുചെന്ന്’ സ്വാഭാവികമായി പകർത്തുന്നു. τῷ πρώτῳ എന്നത് ‘ഒന്നാമത്തെ’ എന്ന ക്രമസൂചനയായി നിലനിർത്തിയിരിക്കുന്നു; മലയാളത്തിൽ ബന്ധം വ്യക്തമാക്കാൻ സന്ദർഭാനുസൃതമായി ‘മകന്റെ’ ഉപയോഗിച്ചു.
- source_word: Τέκνον
  choice: മകനേ
  rationale: τέκνον പൊതുവായി ‘കുഞ്ഞ്/മകൻ/മകൾ’ എന്നർഥമുള്ള സ്നേഹസംബോധനമാണ്. പ്രായം വ്യക്തമല്ലാത്തതിനാൽ ‘കുഞ്ഞേ’യെക്കാൾ പിതാവ് മകനെ വിളിക്കുന്ന സ്വാഭാവിക മലയാളസംബോധനയായ ‘മകനേ’ തിരഞ്ഞെടുത്തു; ഇതിന്റെ വിശാല ഗ്രീക്ക് അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὕπαγε σήμερον ἐργάζου
  choice: ഇന്ന് ... പോയി ജോലി ചെയ്യുക
  rationale: ആജ്ഞകളുടെ അർഥവും σήμερον എന്ന സമയസൂചനയും വ്യക്തമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐν τῷ ἀμπελῶνι
  choice: മുന്തിരിത്തോട്ടത്തിൽ
  rationale: ἐν എന്ന സ്ഥലസൂചനയും ἀμπελών എന്ന കാർഷികരൂപകവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: τέκνα/τέκνον എന്ന പദങ്ങളെ പരമ്പരാഗതമായി ‘പുത്രന്മാർ/പുത്രാ’ എന്നു ചുരുക്കണമോ
  choice: മക്കൾ / മകനേ
  alternative: പുത്രന്മാർ / പുത്രാ; അല്ലെങ്കിൽ കുട്ടികൾ / കുഞ്ഞേ
  rationale: ബഹുവചനമായ τέκναയുടെ ലിംഗവിശാലത ‘മക്കൾ’ വ്യക്തമായി നിലനിർത്തുന്നു. നേരിട്ടുള്ള അഭിസംബോധനയിൽ സാധാരണ മലയാളത്തിന് ‘മകനേ’ കൂടുതൽ സ്വാഭാവികമാണ്; എന്നാൽ ഗ്രീക്ക് പദം സ്വതവേ ആൺകുട്ടിയെ മാത്രമല്ല സൂചിപ്പിക്കുന്നതെന്ന യഥാർഥ സൂക്ഷ്മത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. ‘ഒന്നാമത്തെ മകൻ’, ‘മകനേ’ എന്നിവ മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി ഉപയോഗിച്ചെങ്കിലും ഗ്രീക്ക് പദങ്ങളുടെ വിശാലത അടിക്കുറിപ്പിലൂടെ നിലനിർത്തി.
