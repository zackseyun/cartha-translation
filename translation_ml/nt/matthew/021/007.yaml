id: MAT.21.7
reference: Matthew 21:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἤγαγον τὴν ὄνον καὶ τὸν πῶλον, καὶ ἐπέθηκαν ⸀ἐπ’ αὐτῶν τὰ ⸀ἱμάτια, καὶ ἐπεκάθισεν ἐπάνω αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/007.yaml
  text: They brought the donkey and the colt[a], and put their cloaks on them, and he sat on them.
translation:
  language: ml
  text: അവർ കഴുതയെയും കഴുതക്കുട്ടിയെയും കൊണ്ടുവന്ന്, അവയുടെ മേൽ തങ്ങളുടെ വസ്ത്രങ്ങൾ ഇട്ടു; അവൻ അവയുടെ മേൽ ഇരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, മൃഗങ്ങളുടെ മേൽ വെച്ചിരുന്ന വസ്ത്രങ്ങളുടെ മേൽ അവൻ ഇരുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ἤγαγον
  choice: കൊണ്ടുവന്ന്
  rationale: ἄγω എന്ന ക്രിയയ്ക്ക് ‘കൊണ്ടുവരുക’ എന്നും ‘നയിച്ചുകൊണ്ടുവരുക’ എന്നും അർഥമാകാം. ഈ സന്ദർഭത്തിൽ ‘കൊണ്ടുവന്ന്’ എന്നത് പ്രവർത്തിയുടെ ഫലവും സ്വാഭാവികമായ മലയാളപ്രയോഗവും വ്യക്തമാക്കുന്നു.
- source_word: τὴν ὄνον
  choice: കഴുതയെ
  rationale: ὄνος ഇവിടെ സ്ത്രീലിംഗ നിർദേശകപദത്തോടെയാണെങ്കിലും, ആധുനിക മലയാളത്തിൽ ‘പെൺകഴുത’ എന്നു പ്രത്യേകം പറയുന്നത് മുഖ്യവാചകത്തിൽ അനാവശ്യമായി കൃത്രിമമാകും; തുടർന്ന് പറയുന്ന കഴുതക്കുട്ടിയുമായുള്ള ബന്ധം സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: τὸν πῶλον
  choice: കഴുതക്കുട്ടിയെ
  rationale: πῶλος ഒരു ഇളം മൃഗത്തെ സൂചിപ്പിക്കുന്നു; ഇവിടെ സന്ദർഭം കഴുതയുടേതാണെന്ന് വ്യക്തമാകുന്നതിനാൽ ‘കഴുതക്കുട്ടി’ കൃത്യവും സാധാരണ വായനക്കാർക്ക് ഉടൻ മനസ്സിലാകുന്നതുമാണ്.
- source_word: ἐπέθηκαν ἐπ’ αὐτῶν τὰ ἱμάτια
  choice: അവയുടെ മേൽ തങ്ങളുടെ മേലങ്കികൾ വിരിച്ചു
  rationale: ἱμάτια പുറമേ ധരിക്കുന്ന വസ്ത്രങ്ങളെ സൂചിപ്പിക്കുന്നു; ‘മേലങ്കികൾ’ സ്വാഭാവികവും ദൃശ്യസന്ദർഭത്തിന് യോജിച്ചതുമാണ്. വസ്ത്രങ്ങൾ മൃഗങ്ങളുടെ മേൽ ഇരിപ്പിനായി വെച്ചതിനാൽ ‘വിരിച്ചു’ മലയാളത്തിൽ യോജിച്ച പ്രയോഗമാണ്. ‘തങ്ങളുടെ’ എന്നത് ശിഷ്യന്മാരെ സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാക്കുന്നു.
- source_word: ἐπεκάθισεν ἐπάνω αὐτῶν
  choice: അവൻ അവയുടെ മേൽ ഇരുന്നു
  rationale: അവസാനത്തെ αὐτῶν ബഹുവചനമാണ്; അത് മൃഗങ്ങളെയോ അവയുടെ മേൽ വിരിച്ച മേലങ്കികളെയോ സൂചിപ്പിക്കാം. ‘അവയുടെ മേൽ’ എന്ന പ്രയോഗം മൂലത്തിലെ ബഹുവചനവും അവ്യക്തതയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: καὶ ἐπεκάθισεν ἐπάνω αὐτῶν എന്നതിലെ അവസാന ബഹുവചന സർവനാമമായ αὐτῶν എന്തിനെ സൂചിപ്പിക്കുന്നു
  choice: അത് എന്തിനെ സൂചിപ്പിക്കുന്നു എന്നു മുഖ്യവാചകത്തിൽ തീർപ്പാക്കാതെ ‘അവൻ അവയുടെ മേൽ ഇരുന്നു’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘അവൻ മേലങ്കികളുടെ മേൽ ഇരുന്നു’ അല്ലെങ്കിൽ ‘അവൻ മൃഗങ്ങളിൽ ഒന്നിന്റെ മേൽ ഇരുന്നു.’
  rationale: ഇത് മുഖ്യമായി വാക്യഘടനാപരവും ആഖ്യാനപരവുമായ അവ്യക്തതയാണ്. മൂലപാഠത്തിലെ ബഹുവചനം നിലനിർത്തുന്നത് യേശു രണ്ട് മൃഗങ്ങളുടെയും മേൽ ഒരേസമയം ഇരുന്നു എന്ന വ്യാഖ്യാനം നിർബന്ധിക്കുന്നില്ല; മേലങ്കികളെയാണ് സൂചിപ്പിക്കുന്നതെന്ന സാധാരണ വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘മേലങ്കികൾ’ എന്നത് ἱμάτιαയുടെ പുറംവസ്ത്രസൂചന നിലനിർത്തുന്നു. അവസാന ബഹുവചന സർവനാമത്തിന്റെ യഥാർഥ അവ്യക്തത മുഖ്യവാചകത്തിൽ സംരക്ഷിക്കുകയും വായനാസഹായം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
