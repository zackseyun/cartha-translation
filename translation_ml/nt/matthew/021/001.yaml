id: MAT.21.1
reference: Matthew 21:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤγγισαν εἰς Ἱεροσόλυμα καὶ ἦλθον εἰς Βηθφαγὴ ⸀εἰς τὸ Ὄρος τῶν Ἐλαιῶν, τότε ⸀Ἰησοῦς ἀπέστειλεν δύο μαθητὰς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/001.yaml
  text: And when they came near to Jerusalem and came to Bethphage[a], to the Mount of Olives, then Jesus sent two disciples
translation:
  language: ml
  text: അവർ യെരൂശലേമിന് അടുത്തെത്തി, ഒലിവുമലയിലെ ബേത്ത്ഫാഗെയിൽ വന്നപ്പോൾ[a], യേശു രണ്ടു ശിഷ്യന്മാരെ അയച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘അവർ യെരൂശലേമിന് അടുത്തെത്തി, ബേത്ത്ഫാഗെയിലേക്കു, ഒലിവുമലയിലേക്കു വന്നപ്പോൾ.’
    reason: ഗ്രീക്കിൽ ‘ഒലിവുമലയിലേക്കു’ എന്ന പദസമുച്ചയം ബേത്ത്ഫാഗെയുടെ സ്ഥാനവിവരണമായോ, തുടർന്നുള്ള ലക്ഷ്യസൂചനയായോ വായിക്കാവുന്ന വാക്യഘടനാപരമായ സാധ്യത സൂചിപ്പിക്കുന്നു.
lexical_decisions:
- source_word: ἤγγισαν
  choice: അടുത്തെത്തി
  rationale: ἐγγίζω ഇവിടെ ഒരു സ്ഥലത്തോട് അടുത്തുവരുന്ന ചലനത്തെ സൂചിപ്പിക്കുന്നു. ‘അടുത്തെത്തി’ എന്നത് ആ സ്ഥലസംബന്ധമായ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: Ἱεροσόλυμα
  choice: യെരൂശലേം
  rationale: സ്ഥലനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: ἦλθον
  choice: വന്നു
  rationale: ἔρχομαι എന്ന ക്രിയയുടെ സാധാരണ ചലനാർഥം നിലനിർത്തുന്നു; മുൻപുള്ള ‘അടുത്തെത്തി’ എന്ന ക്രിയയിൽനിന്നുള്ള വ്യത്യാസവും സംരക്ഷിക്കുന്നു.
- source_word: Βηθφαγὴ
  choice: ബേത്ത്ഫഗെ
  rationale: ഗ്രീക്ക് സ്ഥലനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: ഒലിവുമലയിലെ
  rationale: ഈ വാക്യഘടനയിൽ ബേത്ത്ഫഗെയെ ഒലിവുമലയുമായി ഭൂമിശാസ്ത്രപരമായി ബന്ധിപ്പിക്കുന്നതായി എടുത്തിരിക്കുന്നു. മലയാളത്തിൽ ‘ഒലിവുമലയിലെ ബേത്ത്ഫഗെ’ സ്വാഭാവികവും വ്യക്തവുമാണ്; εἰς എന്നതിന്റെ കൂടുതൽ അക്ഷരാർഥപരമായ വായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: τότε
  choice: അപ്പോൾ എന്ന ആശയം ‘വന്നപ്പോൾ’ എന്ന ഉപവാക്യഘടനയിൽ
  rationale: ഗ്രീക്കിലെ കാലസൂചന മലയാളത്തിലെ ‘-പ്പോൾ’ ഘടനയിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു; വേറിട്ട് ‘അപ്പോൾ’ ചേർത്താൽ അനാവശ്യ ആവർത്തനമാകും.
- source_word: ἀπέστειλεν
  choice: അയച്ചു
  rationale: ഒരു ദൗത്യത്തിനായി ശിഷ്യന്മാരെ അയയ്ക്കുന്നതിനെ നേരിട്ടും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: δύο μαθητὰς
  choice: രണ്ടു ശിഷ്യന്മാരെ
  rationale: സംഖ്യയും μαθητής എന്ന സുവിശേഷവിവരണത്തിലെ പതിവുപദവും നേരിട്ട് വിവർത്തനം ചെയ്യുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ പേര് വരുന്നതിനു മുമ്പുള്ള ബഹുവചന ക്രിയകളുടെ കർത്താവ്
  choice: ‘അവർ’ എന്നു മാത്രം നൽകി, ഗ്രീക്ക് പാഠം യേശുവിനെ പേരെടുത്ത് പറയുന്നിടത്താണ് ‘യേശു’ എന്നു ചേർത്തത്.
  alternative: ‘യേശുവും ശിഷ്യന്മാരും യെരൂശലേമിന് അടുത്തെത്തിയപ്പോൾ’ എന്നു വ്യക്തമാക്കുക.
  rationale: സന്ദർഭത്തിൽ സംഘം ആരെന്ന് മനസ്സിലാകുമെങ്കിലും ഈ വാക്യത്തിൽ ഗ്രീക്ക് പാഠം ആദ്യം അവരെ വിശദമായി പേരെടുത്തുപറയുന്നില്ല. അതിനാൽ പാഠത്തിന്റെ സംക്ഷിപ്തമായ വിവരണരീതി നിലനിർത്തുന്നു.
- issue: ബേത്ത്ഫഗെയും ഒലിവുമലയും തമ്മിലുള്ള വാക്യഘടനാപരമായ ബന്ധം
  choice: ‘ഒലിവുമലയിലെ ബേത്ത്ഫഗെ’ എന്നു ഭൂമിശാസ്ത്രപരമായ വിശദീകരണമായി നൽകി.
  alternative: ‘ബേത്ത്ഫഗെയിലേക്കും ഒലിവുമലയിലേക്കും വന്നു’ എന്നു εἰς ആവർത്തിച്ച ലക്ഷ്യസൂചനയായി നൽകുക.
  rationale: അവസാനത്തെ പദസമുച്ചയം ബേത്ത്ഫഗെയുടെ സ്ഥാനം വിശദീകരിക്കുന്നതായി വായിക്കുന്നത് സന്ദർഭത്തിലും മലയാളത്തിലും സ്വാഭാവികമാണ്. എങ്കിലും ഗ്രീക്ക് ഘടന അനുവദിക്കുന്ന കൂടുതൽ അക്ഷരാർഥപരമായ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. കഥനത്തിന്റെ ഒഴുക്ക് നിലനിർത്താൻ τότε എന്നതിന്റെ അർഥം ‘വന്നപ്പോൾ’ എന്ന ഘടനയിൽ ഉൾപ്പെടുത്തി. സ്ഥലനാമങ്ങൾക്ക് മലയാളത്തിൽ പരിചിതമായ രൂപങ്ങൾ ഉപയോഗിച്ചു.
