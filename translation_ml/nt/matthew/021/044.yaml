id: MAT.21.44
reference: Matthew 21:44
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂Καὶ ὁ πεσὼν ἐπὶ τὸν λίθον τοῦτον συνθλασθήσεται· ἐφ’ ὃν δ’ ἂν πέσῃ λικμήσει αὐτόν.⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/044.yaml
  text: And the one who falls on this stone will be broken to pieces[a]; but on whomever it falls[b], it will crush him.
translation:
  language: ml
  text: ഈ കല്ലിന്മേൽ വീഴുന്നവൻ തകർന്നുപോകും; എന്നാൽ ഈ കല്ല് ആരുടെമേൽ വീഴുന്നുവോ, അവനെ അത് ചതച്ചുകളയും[a].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ ദൃശ്യമായി: “അവനെ പൊടിച്ചുകളയും” അല്ലെങ്കിൽ “പതിരുപോലെ ചിതറിച്ചുകളയും.”'
    reason: lexical_alternative
  - marker: b
    text: മത്തായിയുടെ ചില കൈയെഴുത്തുപ്രതികളിൽ ഈ വാക്യം കാണുന്നില്ല; എന്നാൽ ലൂക്കോസ് 20:18-ൽ ഇതിനു സമാന്തരമായ വാക്യമുണ്ട്.
    reason: textual_variant
lexical_decisions:
- source_word: ὁ πεσὼν
  choice: വീഴുന്നവൻ
  rationale: നാമവാചകമായി പ്രവർത്തിക്കുന്ന ഏകവചന കർത്തൃവാചക കൃദന്തത്തിന്റെ പൊതുവായ വ്യക്തിസൂചനയും പഴഞ്ചൊല്ലുസദൃശമായ ഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐπὶ τὸν λίθον τοῦτον
  choice: ഈ കല്ലിന്മേൽ
  rationale: λίθος എന്നതിന്റെ വ്യക്തമായ ‘കല്ല്’ എന്ന അർഥവും സമീപസന്ദർഭത്തിലെ കല്ലിന്റെ ദൃശ്യരൂപകവും സംരക്ഷിക്കുന്നു.
- source_word: συνθλασθήσεται
  choice: തകർന്നുപോകും
  rationale: ഭാവികാല കർമണിപ്രയോഗം സൂചിപ്പിക്കുന്ന ഗുരുതരമായ തകർച്ച സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; അതേസമയം രണ്ടാം ക്രിയയായ λικμήσει-യിൽനിന്നുള്ള അർഥവ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: ἐφ’ ὃν δ’ ἂν πέσῃ
  choice: എന്നാൽ ഈ കല്ല് ആരുടെമേൽ വീഴുന്നുവോ
  rationale: ആഘാതത്തിന്റെ ദിശ ഇവിടെ മറിഞ്ഞ് കല്ല് വീഴുന്ന കർത്താവാകുന്നതും ἄν ചേർന്ന അനിശ്ചിത സാപേക്ഷപ്രയോഗത്തിന്റെ തുറന്ന പൊതുവായ അർഥവും വ്യക്തമാക്കുന്നു.
- source_word: λικμήσει
  choice: ചതച്ചുകളയും
  rationale: പൂർണമായി ചതയ്ക്കുകയോ പൊടിയാക്കുകയോ ചെയ്യുന്ന ശക്തമായ ന്യായവിധിദൃശ്യം വായനാസൗകര്യത്തോടെ നൽകുന്നു; കൂടുതൽ ദൃശ്യമായ സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: αὐτόν
  choice: അവനെ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ഏകവചന സർവനാമത്തെയും പൊതുപ്രതിനിധിയായ ഏകവചന വ്യക്തിസൂചനയെയും കൃത്യമായി പിന്തുടരുന്നു.
theological_decisions:
- issue: കല്ലിന്റെ രൂപകവും ന്യായവിധിയുടെ ദൃശ്യവും
  choice: ‘കല്ല്’ എന്ന മൂർത്തമായ ഭാഷയും വീഴുന്നതിന്റെ രണ്ടു ദിശകളിലുള്ള ന്യായവിധിദൃശ്യവും വ്യാഖ്യാനവികാസമില്ലാതെ നിലനിർത്തി.
  alternative: പ്രധാനപാഠത്തിൽ കല്ലിനെ യേശു/മശീഹ എന്നു തുറന്നുപറയുക, അല്ലെങ്കിൽ രണ്ടു ക്രിയകളെയും ഒരേ പൊതുവായ നാശാർഥമായി ലയിപ്പിക്കുക.
  rationale: സമീപസന്ദർഭം കല്ലിന്റെ തിരിച്ചറിവിലേക്കു നയിക്കുന്നുവെങ്കിലും ഈ വാക്യം തന്നെ രൂപകാത്മകവും പഴഞ്ചൊല്ലുസദൃശവുമാണ്; അതിനാൽ വിവർത്തനം രൂപകവും ന്യായവിധിയുടെ കാഠിന്യവും മാത്രം സംരക്ഷിക്കുന്നു.
- issue: പൊതുവായ പുല്ലിംഗ ഏകവചനസൂചന
  choice: αὐτόν എന്നതിന് ‘അവനെ’ ഉപയോഗിച്ചു.
  alternative: ‘അവരെ’ അല്ലെങ്കിൽ ‘ആ വ്യക്തിയെ’ എന്നു ലിംഗനിരപേക്ഷമാക്കുക.
  rationale: മൂലപാഠത്തിലെ പുല്ലിംഗ ഏകവചനവും അതിന്റെ പൊതുപ്രതിനിധിയായ ശക്തിയും മലയാളത്തിൽ നേരിട്ട് നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ‘തകർന്നുപോകും’ എന്നും ‘ചതച്ചുകളയും’ എന്നും വേർതിരിച്ച് രണ്ടു ഗ്രീക്ക് ക്രിയകളുടെ തീവ്രതാഭേദം നിലനിർത്തി. മുഴുവൻ വാക്യത്തെയും ബാധിക്കുന്ന പാഠഭേദസൂചനയായ [b] വാക്യാവസാനത്ത് ചേർത്തു.
