id: MAT.21.25
reference: Matthew 21:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τὸ βάπτισμα ⸀τὸ Ἰωάννου πόθεν ἦν; ἐξ οὐρανοῦ ἢ ἐξ ἀνθρώπων; οἱ δὲ διελογίζοντο ⸀ἐν ἑαυτοῖς λέγοντες· Ἐὰν εἴπωμεν· Ἐξ οὐρανοῦ, ἐρεῖ ἡμῖν· Διὰ τί οὖν οὐκ ἐπιστεύσατε αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/025.yaml
  text: The baptism of John—from where was it? From heaven or from men? And they were reasoning among themselves[a], saying, “If we say, ‘From heaven,’ he will say to us[b], ‘Why then did you not believe him?’”
translation:
  language: ml
  text: '“യോഹന്നാന്റെ സ്നാനം എവിടെനിന്നുള്ളതായിരുന്നു? സ്വർഗത്തിൽനിന്നോ മനുഷ്യരിൽനിന്നോ?” അവർ തമ്മിൽ ഇങ്ങനെ ആലോചിച്ചു: “നാം ‘സ്വർഗത്തിൽനിന്ന്’ എന്നു പറഞ്ഞാൽ, ‘പിന്നെ എന്തുകൊണ്ട് നിങ്ങൾ അവനെ വിശ്വസിച്ചില്ല?’ എന്ന് അവൻ നമ്മോടു ചോദിക്കും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βάπτισμα
  choice: സ്നാനം
  rationale: ഇവിടെ ഈ പദം നടന്നുകൊണ്ടിരിക്കുന്ന പ്രവൃത്തിയെക്കാൾ യോഹന്നാനുമായി ബന്ധപ്പെട്ട സ്നാനചടങ്ങിനെയും ശുശ്രൂഷയെയും സൂചിപ്പിക്കുന്നു; മലയാള ബൈബിൾഭാഷയിൽ ‘സ്നാനം’ സ്വാഭാവികവും സ്ഥാപിതവുമാണ്.
- source_word: τὸ Ἰωάννου
  choice: യോഹന്നാന്റെ
  rationale: ജനിറ്റീവ് രൂപം സ്നാനത്തെ യോഹന്നാനുമായി ബന്ധിപ്പിക്കുന്നു; മലയാളത്തിൽ ഉടമസ്ഥതാസൂചകമായ ഈ രൂപം സ്വാഭാവികമാണ്.
- source_word: πόθεν ἦν
  choice: എവിടെനിന്നുള്ളതായിരുന്നു
  rationale: πόθεν ഉറവിടത്തെയോ ഉത്ഭവത്തെയോ ചോദിക്കുന്നു; ഈ മലയാളരൂപം ചോദ്യത്തിന്റെ ഉറവിടകേന്ദ്രിതമായ അർഥം നിലനിർത്തുന്നു.
- source_word: ἐξ οὐρανοῦ
  choice: സ്വർഗത്തിൽനിന്ന്
  rationale: ഗ്രീക്കിലെ രൂപകം നേരിട്ട് നിലനിർത്തുകയും ദൈവിക ഉത്ഭവത്തെ സൂചിപ്പിക്കുന്ന ആദരസൂചക പരാമർശം വ്യാഖ്യാനിച്ച് മാറ്റാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐξ ἀνθρώπων
  choice: മനുഷ്യരിൽനിന്ന്
  rationale: പദം പുരുഷന്മാരെ മാത്രം അല്ല, മനുഷ്യരിൽനിന്നുള്ള ഉത്ഭവത്തെ പൊതുവായി സൂചിപ്പിക്കുന്നു; ‘മനുഷ്യരിൽനിന്ന്’ ലിംഗകൃത്യതയോടെയും സ്വർഗീയ ഉത്ഭവത്തോടുള്ള വൈരുധ്യത്തോടെയും അർഥം നൽകുന്നു.
- source_word: διελογίζοντο ἐν ἑαυτοῖς
  choice: അവർ തമ്മിൽ ആലോചിച്ചുകൊണ്ട്
  rationale: ഇംപർഫെക്റ്റ് രൂപത്തിലെ തുടരുന്ന പരസ്പര വിചിന്തനം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: Ἐὰν εἴπωμεν
  choice: നാം … എന്നു പറഞ്ഞാൽ
  rationale: സാധ്യതാഭാവമുള്ള നിബന്ധന മലയാളത്തിലെ സ്വാഭാവിക നിബന്ധനാരൂപത്തിൽ നൽകുന്നു.
- source_word: ἐρεῖ ἡμῖν
  choice: അവൻ നമ്മോടു ചോദിക്കും
  rationale: ഗ്രീക്കിൽ അക്ഷരാർഥം ‘നമ്മോടു പറയും’ എന്നാണെങ്കിലും പിന്നാലെയുള്ള വാക്കുകൾ ചോദ്യമായതിനാൽ മലയാളത്തിൽ ‘ചോദിക്കും’ സംഭാഷണപ്രവർത്തി സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: οὐκ ἐπιστεύσατε αὐτῷ
  choice: നിങ്ങൾ അവനെ വിശ്വസിച്ചില്ല
  rationale: ദാതിവോടുകൂടിയ πιστεύω ഇവിടെ യോഹന്നാനെയും അവന്റെ സന്ദേശത്തെയും വിശ്വസിക്കുക എന്ന അർഥം നൽകുന്നു.
theological_decisions:
- issue: ‘സ്വർഗത്തിൽനിന്ന്’ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘സ്വർഗത്തിൽനിന്ന്’ നിലനിർത്തി.
  alternative: ദൈവത്തിൽനിന്ന്
  rationale: ഈ പ്രയോഗം ദൈവിക ഉത്ഭവത്തെയോ അധികാരത്തെയോ ആദരസൂചകമായി പരാമർശിക്കാം; എങ്കിലും ‘ദൈവത്തിൽനിന്ന്’ എന്നു മാറ്റുന്നത് ഉറവിടപാഠത്തിലെ രൂപകം വ്യാഖ്യാനിച്ച് തീർക്കും.
- issue: ἀνθρώπων എന്നതിലെ മനുഷ്യസാമാന്യ അർഥം
  choice: മനുഷ്യരിൽനിന്ന്
  alternative: ആളുകളിൽനിന്ന്; പുരുഷന്മാരിൽനിന്ന്
  rationale: വൈരുധ്യം ദൈവികവും കേവലം മാനുഷികവുമായ ഉത്ഭവങ്ങൾ തമ്മിലാണ്; പുരുഷലിംഗത്തെ മാത്രം സൂചിപ്പിക്കുന്ന പരിഭാഷ തെറ്റിദ്ധരിപ്പിക്കും.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഉറവിടത്തിലെ ചോദ്യം–പ്രതിചോദ്യം ഘടനയും ‘സ്വർഗം/മനുഷ്യർ’ എന്ന ദൈവിക–മാനുഷിക ഉത്ഭവവൈരുധ്യവും സംരക്ഷിച്ചിട്ടുണ്ട്.
