id: MAT.21.32
reference: Matthew 21:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἦλθεν γὰρ ⸂Ἰωάννης πρὸς ὑμᾶς⸃ ἐν ὁδῷ δικαιοσύνης, καὶ οὐκ ἐπιστεύσατε αὐτῷ· οἱ δὲ τελῶναι καὶ αἱ πόρναι ἐπίστευσαν αὐτῷ· ὑμεῖς δὲ ἰδόντες ⸀οὐδὲ μετεμελήθητε ὕστερον τοῦ πιστεῦσαι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/032.yaml
  text: For John came to you in the way of righteousness[a], and you did not believe him; but the tax collectors and the prostitutes believed him. But even after seeing this[c][b], you did not afterward change your minds so as to believe him.
translation:
  language: ml
  text: കാരണം, യോഹന്നാൻ നീതിയുടെ വഴിയിൽ[a] നിങ്ങളുടെ അടുക്കൽ വന്നു; നിങ്ങൾ അവനെ വിശ്വസിച്ചില്ല. എന്നാൽ ചുങ്കക്കാരും വേശ്യകളും അവനെ വിശ്വസിച്ചു. നിങ്ങളോ ഇതു കണ്ടിട്ടും, പിന്നീട് അവനെ വിശ്വസിക്കാനായി മനസ്സു മാറ്റിയില്ല.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നീതിയുള്ള രീതിയിൽ’ എന്നും ‘നീതിയുടെ പാതയിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഈ ഗ്രീക്ക് പ്രയോഗം യോഹന്നാന്റെ ജീവിതത്തെയും ശുശ്രൂഷാരീതിയെയും, അല്ലെങ്കിൽ അവൻ പ്രഖ്യാപിച്ച നീതിയുടെ വഴിയെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘അവനെ ആശ്രയിച്ചില്ല’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് ക്രിയയ്ക്ക് ഒരാളെ വിശ്വസിക്കുക അല്ലെങ്കിൽ ആശ്രയിക്കുക എന്ന അർഥം വരാം.
    reason: lexical_alternative
  - marker: c
    text: ‘പിന്നീട് പശ്ചാത്തപിച്ച് അവനെ വിശ്വസിക്കാനും നിങ്ങൾ തയ്യാറായില്ല’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ക്രിയ സാധാരണയായി ‘മാനസാന്തരപ്പെടുക’ എന്നു പരിഭാഷപ്പെടുത്തുന്ന μετανοέω അല്ല; മനസ്സുമാറ്റത്തെയോ ഖേദത്തെയോ കൂടുതൽ പ്രത്യേകമായി സൂചിപ്പിക്കുന്ന μεταμέλομαι ആണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν γὰρ
  choice: വന്നു; എന്നിട്ടും
  rationale: ἦλθεν എന്ന ഭൂതകാല ക്രിയയെ സ്വാഭാവികമായി ‘വന്നു’ എന്നു പരിഭാഷപ്പെടുത്തി. γάρ മുൻസന്ദർഭത്തിനുള്ള വിശദീകരണബന്ധം സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ വാക്യപ്രവാഹത്തിൽ അത് പ്രത്യേകം ‘കാരണം’ എന്നു ചേർക്കാതെ വാക്യബന്ധത്തിലൂടെ പ്രകടമാകുന്നു.
- source_word: πρὸς ὑμᾶς
  choice: നിങ്ങളുടെ അടുക്കൽ
  rationale: പ്രേക്ഷകരിലേക്കുള്ള വരവ് സൂചിപ്പിക്കുന്ന πρός എന്നതിന്റെ ദിശാബോധം നിലനിർത്തുന്നു.
- source_word: ἐν ὁδῷ δικαιοσύνης
  choice: നീതിയുടെ വഴിയിൽ
  rationale: ὁδός എന്ന വഴി-രൂപകവും δικαιοσύνηയുടെ ധാർമികവും ദൈവഹിതാനുസൃതവുമായ അർഥവും സംരക്ഷിക്കുന്നു; പ്രയോഗത്തിലെ യഥാർഥ ദ്വയാർഥത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: οὐκ ἐπιστεύσατε αὐτῷ / ἐπίστευσαν αὐτῷ
  choice: നിങ്ങൾ അവനെ വിശ്വസിച്ചില്ല / അവനെ വിശ്വസിച്ചു
  rationale: πιστεύω + ദാതിവ് ഇവിടെ വ്യക്തിയെയും അവന്റെ സന്ദേശത്തെയും വിശ്വസിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ഒരേ ക്രിയയുടെ ആവർത്തനം മലയാളത്തിലും സ്ഥിരമായി നിലനിർത്തി.
- source_word: οἱ τελῶναι
  choice: ചുങ്കക്കാർ
  rationale: റോമൻ ഭരണസന്ദർഭത്തിലെ നികുതി പിരിക്കുന്നവർക്കുള്ള പരിചിതവും വേദപാരായണത്തിൽ സ്വാഭാവികവുമായ മലയാളപദം.
- source_word: αἱ πόρναι
  choice: വേശ്യകൾ
  rationale: സ്രോതസ്സിലെ നേരിട്ടുള്ള സാമൂഹിക-ധാർമിക പ്രയോഗത്തിന്റെ ശക്തി മയപ്പെടുത്താതെ നൽകുന്നു.
- source_word: ἰδόντες
  choice: ഇതു കണ്ടിട്ടും
  rationale: മുൻപറഞ്ഞ ചുങ്കക്കാരുടെയും വേശ്യകളുടെയും പ്രതികരണമാണ് അവർ കണ്ടത് എന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നു; concessive force മലയാളത്തിൽ ‘കണ്ടിട്ടും’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: οὐδὲ μετεμελήθητε ὕστερον τοῦ πιστεῦσαι αὐτῷ
  choice: പിന്നീട് മനസ്സു മാറ്റി അവനെ വിശ്വസിച്ചില്ല
  rationale: μεταμέλομαι എന്നത് സാധാരണ ‘മാനസാന്തരപ്പെടുക’ എന്നതിലേക്കാൾ മനസ്സുമാറ്റം/പശ്ചാത്താപം എന്ന ഭാവം വഹിക്കുന്നു. τοῦ πιστεῦσαι ലക്ഷ്യഫലബന്ധമായി ‘വിശ്വസിക്കാൻ’ എന്നും വായിക്കാമെങ്കിലും, മലയാളത്തിലെ സ്വാഭാവിക നിഷേധഘടനയിൽ ‘മനസ്സു മാറ്റി ... വിശ്വസിച്ചില്ല’ എന്നു നൽകി.
theological_decisions:
- issue: δικαιοσύνηയുടെ അർഥം
  choice: നീതി
  alternative: നീതിയുള്ള ജീവിതരീതി; നീതിയുടെ പാത
  rationale: യോഹന്നാന്റെ ജീവിതരീതിയെയോ അവൻ പ്രഖ്യാപിച്ച ദൈവഹിതാനുസൃത വഴിയെയോ സൂചിപ്പിക്കാവുന്ന രൂപകത്തെ പ്രധാനവാചകം തുറന്ന നിലയിൽ വയ്ക്കുന്നു.
- issue: πιστεύω αὐτῷ എന്ന പ്രയോഗം
  choice: അവനെ വിശ്വസിക്കുക
  alternative: അവനിൽ വിശ്വസിക്കുക; അവനെ ആശ്രയിക്കുക
  rationale: വാക്യം യോഹന്നാനെയും അവന്റെ സാക്ഷ്യത്തെയും അംഗീകരിക്കുന്നതിനെക്കുറിച്ചാണ്. ‘അവനിൽ വിശ്വസിക്കുക’ എന്നു പറഞ്ഞാൽ സ്രോതസ്സിൽ വ്യക്തമല്ലാത്ത കൂടുതൽ വികസിതമായ വിശ്വാസസൂത്രാർഥം വരാം.
- issue: μετεμελήθητε എന്ന ക്രിയ
  choice: മനസ്സു മാറ്റുക
  alternative: മാനസാന്തരപ്പെടുക; പശ്ചാത്തപിക്കുക
  rationale: μετανοέωയുമായുള്ള വ്യത്യാസം മായിക്കാതെ, തീരുമാനം പുനഃപരിശോധിച്ച് മാറ്റുന്നതിന്റെ ഭാവം സംരക്ഷിക്കുന്നു; പശ്ചാത്താപസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി. ‘ചുങ്കക്കാർ’ എന്ന പരിചിത ബൈബിൾപദവും ‘വേശ്യകൾ’ എന്ന നേരിട്ടുള്ള പദവും ഉപയോഗിച്ചു. സ്രോതസ്സിലെ ആവർത്തനവും നൈതിക വെല്ലുവിളിയും നിലനിർത്തി; അനാവശ്യ സഭാപരമായ സാങ്കേതികപദങ്ങൾ ഒഴിവാക്കി.
