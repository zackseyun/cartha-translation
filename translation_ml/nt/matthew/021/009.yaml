id: MAT.21.9
reference: Matthew 21:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ ὄχλοι οἱ προάγοντες ⸀αὐτὸν καὶ οἱ ἀκολουθοῦντες ἔκραζον λέγοντες· Ὡσαννὰ τῷ υἱῷ Δαυίδ· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου· Ὡσαννὰ ἐν τοῖς ὑψίστοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/009.yaml
  text: And the crowds going ahead of him and those following were crying out[a], saying[c][b], “Hosanna to the Son of David! Blessed is the one who comes in the name of the Lord! Hosanna in the highest!”
translation:
  language: ml
  text: 'അവന്റെ മുമ്പിൽ പോയിരുന്നവരും പിന്നാലെ വന്നിരുന്നവരുമായ ജനക്കൂട്ടങ്ങൾ ഇങ്ങനെ വിളിച്ചുപറഞ്ഞുകൊണ്ടിരുന്നു: “ദാവീദിന്റെ പുത്രന് ഹോശന്നാ![a][b] കർത്താവിന്റെ നാമത്തിൽ വരുന്നവൻ അനുഗ്രഹിക്കപ്പെട്ടവൻ![c] അത്യുന്നതങ്ങളിൽ ഹോശന്നാ!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഹോശന്നാ” എന്നത് എബ്രായമൂലമുള്ള ഒരു ഘോഷമാണ്. അതിന് “രക്ഷിക്കണമേ” അല്ലെങ്കിൽ “ഇപ്പോൾ രക്ഷിക്കണമേ” എന്നതുപോലുള്ള അടിസ്ഥാനാർഥമുണ്ടെങ്കിലും ഇവിടെ അത് സ്തുതിഘോഷമായും പ്രവർത്തിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “ദാവീദിന്റെ പുത്രൻ” എന്നത് ദാവീദിന്റെ വംശത്തിൽനിന്നുള്ള രാജാവായ മശീഹാവിനെ സൂചിപ്പിക്കുന്ന പദവിയാണ്.
    reason: cultural_note
  - marker: c
    text: ഈ വാക്കുകൾ സങ്കീർത്തനം 118:26-നെ പ്രതിധ്വനിപ്പിക്കുന്നു; അവിടത്തെ എബ്രായവാചകത്തിൽ “കർത്താവ്” എന്ന സ്ഥാനത്ത് YHWH എന്ന ദൈവനാമമാണ് ഉള്ളത്.
    reason: cross_reference
lexical_decisions:
- source_word: ὄχλοι
  choice: ജനക്കൂട്ടങ്ങൾ
  rationale: കൂട്ടമായി സഞ്ചരിച്ചിരുന്ന അനേകം ആളുകളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: προάγοντες αὐτόν
  choice: അവന്റെ മുന്നിൽ പോയിരുന്നവർ
  rationale: യേശുവിന്റെ മുമ്പിലായി നീങ്ങിയവരെ വ്യക്തമാക്കുന്നു; അവർ ഔദ്യോഗികമായി അവനെ നയിച്ചുവെന്ന അധിക അർഥം വരുത്തുന്നില്ല.
- source_word: ἀκολουθοῦντες
  choice: പിന്നാലെ വന്നിരുന്നവർ
  rationale: ഘോഷയാത്രയിലെ പിന്നിലുള്ള കൂട്ടത്തെ സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും മുന്നിൽ പോയിരുന്നവരോടുള്ള സമാന്തരത നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἔκραζον λέγοντες
  choice: ഇങ്ങനെ വിളിച്ചുപറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: ἔκραζον എന്ന അപൂർണഭൂതകാലരൂപത്തിലെ തുടർച്ചയായ പ്രവൃത്തി ‘കൊണ്ടിരുന്നു’ എന്നതിലൂടെ സംരക്ഷിക്കുന്നു; λέγοντες എന്നതിന്റെ ആശയം ‘ഇങ്ങനെ’ എന്ന അവതരണത്തിലൂടെ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: Ὡσαννά
  choice: ഹോശന്നാ
  rationale: ഈ സന്ദർഭത്തിൽ സ്തുതിഘോഷമായി പ്രവർത്തിക്കുന്ന എബ്രായമൂലമുള്ള ആരാധനാപദം ലിപ്യന്തരണം ചെയ്യുന്നു; അതിന്റെ അടിസ്ഥാന അപേക്ഷാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: τῷ υἱῷ Δαυίδ
  choice: ദാവീദിന്റെ പുത്രന്
  rationale: ദാവീദീയ രാജകീയ-മശീഹാ പദവി വ്യാഖ്യാനിച്ച് മാറ്റാതെ മൂലരൂപത്തിൽ നിലനിർത്തുന്നു; ദത്തിവിഭക്തിയുടെ ദിശ ‘ന്’ കൊണ്ട് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: Εὐλογημένος ὁ ἐρχόμενος
  choice: വരുന്നവൻ അനുഗൃഹീതൻ
  rationale: ഗ്രീക്കിലെ നാമവൽക്കരിച്ച വർത്തമാനകൃദന്തരൂപവും സങ്കീർത്തനപ്രതിധ്വനിയും സംക്ഷിപ്തവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐν ὀνόματι κυρίου
  choice: കർത്താവിന്റെ നാമത്തിൽ
  rationale: ദൈവിക അധികാരത്തെയും പ്രതിനിധിത്വത്തെയും ഉൾക്കൊള്ളുന്ന മൂലപ്രയോഗം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: κυρίου
  choice: കർത്താവ്
  rationale: ഗ്രീക്ക് κύριος എന്ന പദത്തിന്റെ സാധാരണ മലയാളസമാനമാണ്; സങ്കീർത്തനത്തിലെ YHWH പശ്ചാത്തലം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐν τοῖς ὑψίστοις
  choice: അത്യുന്നതങ്ങളിൽ
  rationale: ഏറ്റവും ഉയർന്ന സ്വർഗീയ മണ്ഡലങ്ങളെ സൂചിപ്പിക്കാവുന്ന ബഹുവചനപ്രയോഗത്തിന്റെ ഉയർന്ന ആരാധനാഭാവം കാത്തുസൂക്ഷിക്കുന്നു; ‘സ്വർഗങ്ങളിൽ’ എന്ന് അതിവ്യക്തമാക്കുന്നില്ല.
theological_decisions:
- issue: τῷ υἱῷ Δαυίδ എന്ന ദാവീദീയ പദവി
  choice: ‘ദാവീദിന്റെ പുത്രൻ’ എന്ന പദവി അതേപടി നിലനിർത്തി.
  alternative: ‘മശീഹാ’ എന്ന് വ്യാഖ്യാനപരമായി പരിഭാഷപ്പെടുത്തുക.
  rationale: ഈ പദവി മശീഹാവിനെ സൂചിപ്പിക്കുന്നതാണെങ്കിലും ഗ്രീക്ക് വാചകം ദാവീദീയ രാജകീയ പദവിയാണ് ഉപയോഗിക്കുന്നത്; അതിന്റെ ചരിത്രപരവും ദൈവശാസ്ത്രപരവുമായ ഭാവം നിലനിർത്തുന്നു.
- issue: Ὡσαννά എന്ന ഘോഷത്തിന്റെ അർഥവും പ്രവർത്തനവും
  choice: പ്രധാനവാചകത്തിൽ ‘ഹോശന്നാ’ എന്ന് ലിപ്യന്തരണം ചെയ്ത് അപേക്ഷാർഥം അടിക്കുറിപ്പിൽ നൽകി.
  alternative: ‘ഇപ്പോൾ രക്ഷിക്കണമേ’ അല്ലെങ്കിൽ ‘ഞങ്ങളെ രക്ഷിക്കണമേ’ എന്ന് നേരിട്ട് പരിഭാഷപ്പെടുത്തുക.
  rationale: ഇവിടെ ഈ പദം രക്ഷയ്ക്കായുള്ള അപേക്ഷയുടെ മൂലം വഹിച്ചുകൊണ്ടുതന്നെ സ്തുതിഘോഷമായി പ്രവർത്തിക്കുന്നു; ലിപ്യന്തരണം ഈ ഇരട്ടഭാവം സംരക്ഷിക്കുന്നു.
- issue: സങ്കീർത്തന ഉദ്ധരണിയിലെ κυρίου
  choice: ‘കർത്താവ്’ എന്ന് പരിഭാഷപ്പെടുത്തി; YHWH പശ്ചാത്തലം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
  alternative: പ്രധാനവാചകത്തിൽ ‘യഹോവ’ അല്ലെങ്കിൽ പ്രത്യേക അക്ഷരരൂപത്തിലുള്ള ‘കർത്താവ്’ ഉപയോഗിക്കുക.
  rationale: പുതിയനിയമത്തിലെ ഗ്രീക്ക് വാചകം κύριος എന്നാണ്; എന്നാൽ സങ്കീർത്തനം 118:26-ലെ എബ്രായ ദൈവനാമപശ്ചാത്തലം വായനക്കാരനിൽനിന്ന് മറച്ചുവയ്ക്കാതിരിക്കാൻ അടിക്കുറിപ്പ് ചേർക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വാക്യഘടനയാണ് സ്വീകരിച്ചത്. ഘോഷയാത്രയുടെ ചലനവും തുടർച്ചയായ വിളിച്ചുപറച്ചിലും വ്യക്തമായി നിലനിർത്തി. ‘ഹോശന്നാ’, ‘ദാവീദിന്റെ പുത്രൻ’, ‘കർത്താവിന്റെ നാമത്തിൽ’, ‘അത്യുന്നതങ്ങളിൽ’ എന്നീ ആരാധനാത്മകവും തിരുവെഴുത്തുപരവുമായ പ്രയോഗങ്ങൾ അനാവശ്യമായി വ്യാഖ്യാനിച്ച് ലളിതമാക്കിയിട്ടില്ല.
