id: MAT.21.16
reference: Matthew 21:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἶπαν αὐτῷ· Ἀκούεις τί οὗτοι λέγουσιν; ὁ δὲ Ἰησοῦς λέγει αὐτοῖς· Ναί. οὐδέποτε ἀνέγνωτε ὅτι Ἐκ στόματος νηπίων καὶ θηλαζόντων κατηρτίσω αἶνον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/016.yaml
  text: And they said to him[a], “Do you hear what these are saying?” But Jesus says to them, “Yes. Have you never read, ‘Out of the mouth of infants and nursing babies you have prepared praise’?”
translation:
  language: ml
  text: 'അവർ അവനോടു പറഞ്ഞു: “ഇവർ പറയുന്നത് നീ കേൾക്കുന്നുണ്ടോ?” യേശു അവരോടു പറയുന്നു: “ഉവ്വ്. ‘ശിശുക്കളുടെയും മുലകുടിക്കുന്ന കുഞ്ഞുങ്ങളുടെയും വായിൽനിന്ന് നീ സ്തുതി ഒരുക്കിയിരിക്കുന്നു’[a] എന്നു നിങ്ങൾ ഒരിക്കലും വായിച്ചിട്ടില്ലേ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: യേശു ഇവിടെ ഗ്രീക്ക് തിരുവെഴുത്തുപാരമ്പര്യമനുസരിച്ച് സങ്കീർത്തനം 8:2 ഉദ്ധരിക്കുന്നു. എബ്രായ പാഠം സാധാരണയായി, “ശിശുക്കളുടെയും മുലകുടിക്കുന്ന കുഞ്ഞുങ്ങളുടെയും വായിൽനിന്ന് നീ ബലം സ്ഥാപിച്ചിരിക്കുന്നു” എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀκούεις
  choice: നീ കേൾക്കുന്നുണ്ടോ
  rationale: വർത്തമാനകാലത്തിലുള്ള നേരിട്ടുള്ള ചോദ്യം സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുകയും യേശുവിനോടുള്ള വെല്ലുവിളിയുടെ ഭാവം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: τί οὗτοι λέγουσιν
  choice: ഇവർ പറയുന്നത്
  rationale: οὗτοι എന്നതിനെ അധിക നാമം ചേർക്കാതെ ‘ഇവർ’ എന്നും വർത്തമാനകാല ക്രിയയെ ‘പറയുന്നത്’ എന്നും നൽകി മൂലവാക്യത്തിന്റെ നേരിട്ടുള്ള ഭാവം സൂക്ഷിക്കുന്നു.
- source_word: λέγει
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനകാലം മലയാള ആഖ്യാനത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ഭൂതകാലത്തിൽ നൽകി; സംഭവക്രമം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: Ναί
  choice: ഉവ്വ്
  rationale: ലളിതമായ സമ്മതത്തെ ചുരുക്കവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: οὐδέποτε ἀνέγνωτε
  choice: നിങ്ങൾ ഒരിക്കലും വായിച്ചിട്ടില്ലേ
  rationale: തിരുവെഴുത്തിനെക്കുറിച്ചുള്ള പരിചയത്തെ ചോദ്യം ചെയ്യുന്ന ശാസനാഭാവമുള്ള വാചാടോപചോദ്യം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: Ἐκ στόματος
  choice: വായിൽനിന്ന്
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ദൃശ്യരൂപം കൃത്യമായും സ്വാഭാവികമായും പുനരാവിഷ്കരിക്കുന്നു.
- source_word: νηπίων
  choice: ശിശുക്കൾ
  rationale: വളരെ ചെറുപ്പമുള്ള കുട്ടികളെ സൂചിപ്പിക്കുന്നു; പിന്നാലെയുള്ള ‘മുലകുടിക്കുന്ന കുഞ്ഞുങ്ങൾ’ എന്ന പദത്തിൽനിന്നുള്ള വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: θηλαζόντων
  choice: മുലകുടിക്കുന്ന കുഞ്ഞുങ്ങൾ
  rationale: മുലകുടിക്കുന്നവരെ സൂചിപ്പിക്കുന്ന വർത്തമാന കൃദന്തരൂപത്തിന്റെ ചിത്രം വ്യക്തവും ഇന്നത്തെ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: κατηρτίσω
  choice: നീ ... ഒരുക്കിയിരിക്കുന്നു
  rationale: മത്തായി ഉദ്ധരിക്കുന്ന ഗ്രീക്ക് പാഠത്തിലെ ‘സജ്ജമാക്കുക/ഒരുക്കുക’ എന്ന ആശയം നൽകുന്നു; എബ്രായ സങ്കീർത്തനപാഠത്തിലെ ‘ബലം സ്ഥാപിച്ചു’ എന്ന വായനയുമായി ഒത്തുചേർക്കുന്നില്ല.
- source_word: αἶνον
  choice: സ്തുതി
  rationale: സാമാന്യനാമമായ ‘praise’ എന്ന അർഥം ലളിതവും ദൈവാരാധനാസന്ദർഭത്തിന് യോജിച്ചതുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: സങ്കീർത്തനം 8:2-ന്റെ ഉദ്ധരണിയിലെ ഗ്രീക്ക്-എബ്രായ പാഠവ്യത്യാസം
  choice: പ്രധാനപാഠത്തിൽ മത്തായിയുടെ ഗ്രീക്ക് രൂപമായ ‘നീ സ്തുതി ഒരുക്കിയിരിക്കുന്നു’ ഉപയോഗിച്ചു.
  alternative: എബ്രായ പാഠത്തെ അടിസ്ഥാനമാക്കി സാധാരണയായി ‘നീ ബലം സ്ഥാപിച്ചിരിക്കുന്നു’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
  rationale: മത്തായിയുടെ വാക്യം ഗ്രീക്ക് തിരുവെഴുത്തുപാരമ്പര്യത്തിലെ രൂപമാണ് ഉദ്ധരിക്കുന്നത്. അതിനാൽ പ്രധാനപാഠം മത്തായി നൽകിയ വാക്കുകൾക്കനുസരിച്ചാണ്; എബ്രായ പാഠവ്യത്യാസം അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. സംഭാഷണം ലളിതമാക്കിയെങ്കിലും വാചാടോപപരമായ ശാസനാഭാവവും ഉദ്ധരണിയിലെ പാഠപരമായ സംഘർഷവും നിലനിർത്തിയിരിക്കുന്നു.
