id: MAT.21.29
reference: Matthew 21:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· ⸂Οὐ θέλω· ὕστερον δὲ μεταμεληθεὶς⸃ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/029.yaml
  text: But he answered[b][a], ‘I do not want to.’ But later he changed his mind and went.
translation:
  language: ml
  text: 'അവൻ മറുപടി പറഞ്ഞു: “എനിക്ക് പോകാൻ മനസ്സില്ല.” എന്നാൽ പിന്നീട് മനസ്സുമാറി അവൻ പോയി.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഖേദിച്ചു” അല്ലെങ്കിൽ “നിലപാട് മാറ്റി.” ഗ്രീക്ക് പദത്തിന് ഖേദത്തോടുകൂടിയ മനസ്സുമാറ്റം എന്ന അർഥവും ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: മറുപടി പറഞ്ഞു
  rationale: ഗ്രീക്ക് ആഖ്യാനത്തിലെ സാധാരണ പങ്കുപദപ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ സമാപികാക്രിയയായി അവതരിപ്പിക്കുന്നു.
- source_word: Οὐ θέλω
  choice: എനിക്ക് പോകാൻ മനസ്സില്ല
  rationale: θέλω ഇവിടെ ആഗ്രഹമോ സന്നദ്ധതയോ ഇല്ലെന്ന നേരിട്ടുള്ള നിരാകരണമാണ്. സന്ദർഭത്തിൽ പിതാവ് ആവശ്യപ്പെട്ട പ്രവൃത്തിക്കു പോകുന്നതാണ് സൂചിതം; അതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായി ‘പോകാൻ’ ചേർത്തിരിക്കുന്നു.
- source_word: ὕστερον
  choice: പിന്നീട്
  rationale: തുടർന്നുണ്ടായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന ലളിതവും കൃത്യവുമായ കാലസൂചകം.
- source_word: μεταμεληθεὶς
  choice: മനസ്സുമാറ്റി
  rationale: മുൻതീരുമാനത്തിൽനിന്നുള്ള പിന്മാറ്റവും അതിനെത്തുടർന്നുള്ള പ്രവൃത്തിമാറ്റവും വ്യക്തമാക്കുന്നു; ‘അനുതപിച്ചു’ എന്ന കൂടുതൽ സവിശേഷമായ ദൈവശാസ്ത്രാർഥം നിർബന്ധിച്ച് ചേർക്കുന്നില്ല.
- source_word: ἀπῆλθεν
  choice: പോയി
  rationale: ആവശ്യപ്പെട്ട കാര്യം ചെയ്യാൻ അവൻ പോയി എന്ന സന്ദർഭാർഥം ലളിതമായി നൽകുന്നു.
theological_decisions:
- issue: ഉപമയുടെ സന്ദർഭത്തിൽ μεταμεληθεὶς എന്നതിന്റെ വിവർത്തനം
  choice: മനസ്സുമാറ്റി
  alternative: ഖേദിച്ച് / അനുതപിച്ച്
  rationale: വാക്യം നിരാകരണത്തിൽനിന്ന് അനുസരണത്തിലേക്കുള്ള മാറ്റമാണ് നേരിട്ട് വിവരിക്കുന്നത്. ‘അനുതപിച്ചു’ എന്നു വിവർത്തനം ചെയ്താൽ മൂലപദം നിർബന്ധിക്കാത്ത കൂടുതൽ സവിശേഷമായ ദൈവശാസ്ത്രാർഥം ചേർന്നേക്കാം; ‘മനസ്സുമാറ്റി’ പെരുമാറ്റത്തിലെ തിരിവ് നിലനിർത്തുന്നു, അതേസമയം ഖേദത്തിന്റെ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ആദ്യ മകന്റെ മറുപടിയിലെ വ്യക്തിപരമായ അനിഷ്ടം ‘എനിക്ക് പോകാൻ മനസ്സില്ല’ എന്നു വ്യക്തമാക്കി; മൂലത്തിലെ പങ്കുപദഘടന മലയാളത്തിൽ ഒഴുക്കുള്ള സമാപികാക്രിയകളാക്കി.
