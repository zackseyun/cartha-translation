source:
  edition: SBLGNT
  text: Ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ βασιλεῖ, ὅστις ἐποίησεν γάμους τῷ υἱῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/002.yaml
  text: The kingdom of heaven was compared to a king who gave a wedding feast for his son[a][b].
translation:
  language: ml
  text: സ്വർഗരാജ്യം തന്റെ മകനുവേണ്ടി വിവാഹവിരുന്ന് നടത്തിയ ഒരു രാജാവിനോട് ഉപമിക്കപ്പെട്ടു[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഉപമിക്കാം.” ഗ്രീക്ക് ക്രിയ ഇവിടെ അക്ഷരാർഥത്തിൽ “ഉപമിക്കപ്പെട്ടു” അഥവാ “സദൃശമാക്കപ്പെട്ടു” എന്നാണ്; ഉപമകളിൽ പതിവായ അവതരണരീതിയിൽ “ഉപമിക്കാം” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ “വിവാഹങ്ങൾ” എന്നു ബഹുവചനമാണ്; വിവാഹാഘോഷങ്ങളെയോ വിവാഹവിരുന്നിനെയോ സൂചിപ്പിക്കുന്ന ഒരു പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡμοιώθη
  choice: ഉപമിക്കപ്പെട്ടു
  rationale: ὁμοιόω എന്ന ക്രിയയുടെ aorist passive രൂപം സൂചിപ്പിക്കുന്ന ‘ഉപമിക്കപ്പെട്ടു’ എന്ന അർഥം നേരിട്ട് നിലനിർത്തുന്നു; സാധ്യതാസൂചകമായ ‘ഉപമിക്കാം’ എന്ന ആശയം മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: സ്വർഗരാജ്യം
  rationale: മത്തായിയുടെ സവിശേഷ പ്രയോഗം സ്വാഭാവികവും സ്ഥാപിതവുമായ മലയാളരൂപത്തിൽ നിലനിർത്തുന്നു; ‘ദൈവരാജ്യം’ എന്നു സമാനീകരിക്കുന്നില്ല.
- source_word: ἀνθρώπῳ βασιλεῖ
  choice: ഒരു രാജാവിനോട്
  rationale: ഇവിടെ ἄνθρωπος βασιλεύς എന്ന ഘടന ഒരു മനുഷ്യനെ രാജാവായി വിശേഷിപ്പിക്കുന്ന സ്വാഭാവിക ഗ്രീക്ക് പ്രയോഗമാണ്; മലയാളത്തിൽ ‘ഒരു മനുഷ്യനായ രാജാവ്’ എന്നത് അനാവശ്യമായി ഭാരം കൂടുന്നതിനാൽ ‘ഒരു രാജാവ്’ എന്നു നൽകുന്നു.
- source_word: ὅστις
  choice: തന്റെ ... നടത്തിയ
  rationale: ബന്ധവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായി മുൻവിശേഷണഘടനയാക്കി; രാജാവാണ് പ്രവർത്തനത്തിന്റെ കർത്താവെന്ന ബന്ധം വ്യക്തമായി നിലനിൽക്കുന്നു.
- source_word: ἐποίησεν
  choice: നടത്തി
  rationale: γάμους എന്ന പദത്തോടൊപ്പം ‘വിവാഹാഘോഷം/വിരുന്ന് നടത്തുക’ എന്ന സന്ദർഭോചിതമായ അർഥം നൽകുന്നു.
- source_word: γάμους
  choice: വിവാഹവിരുന്ന്
  rationale: ഗ്രീക്കിലെ ബഹുവചനം വിവാഹാഘോഷങ്ങളെയോ വിവാഹവിരുന്നിനെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്; ഉപമയുടെ വിരുന്നുസന്ദർഭം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: τῷ υἱῷ αὐτοῦ
  choice: തന്റെ മകനുവേണ്ടി
  rationale: മകന്റെ പ്രയോജനത്തിനോ അവനുമായി ബന്ധപ്പെട്ടോ നടത്തിയ ആഘോഷം എന്ന ദാതിവ് ബന്ധം കൃത്യമായി നൽകുന്നു; ‘വിവാഹം’ വീണ്ടും ചേർത്ത് ആവർത്തിക്കുന്നില്ല.
theological_decisions:
- issue: ‘സ്വർഗരാജ്യം’ എന്ന പ്രയോഗത്തിന്റെ സ്വഭാവം
  choice: മത്തായിയുടെ ‘സ്വർഗരാജ്യം’ എന്ന പദപ്രയോഗം അതേപടി നിലനിർത്തുക
  alternative: ‘ദൈവരാജ്യം’ അല്ലെങ്കിൽ ‘സ്വർഗത്തിന്റെ ഭരണം’
  rationale: മത്തായിയുടെ സാഹിത്യ-ദൈവശാസ്ത്രപരമായ സവിശേഷത നിലനിർത്തുകയും ‘രാജ്യം’ എന്നതിലെ ഭരണവും അധികാരപരിധിയും ഉൾക്കൊള്ളുന്ന അർഥവ്യാപ്തി തുറന്നുവയ്ക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ passive രൂപവും മത്തായിയുടെ ‘സ്വർഗരാജ്യം’ എന്ന സവിശേഷ പ്രയോഗവും സംരക്ഷിച്ചു; γάμους എന്ന ഇടിയത്തിന്റെ അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി ‘വിവാഹവിരുന്ന്’ എന്നു നൽകി.
