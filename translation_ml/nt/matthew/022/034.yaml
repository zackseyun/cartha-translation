source:
  edition: SBLGNT
  text: Οἱ δὲ Φαρισαῖοι ἀκούσαντες ὅτι ἐφίμωσεν τοὺς Σαδδουκαίους συνήχθησαν ἐπὶ τὸ αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/034.yaml
  text: But when the Pharisees heard that he had silenced the Sadducees[a], they gathered together.
translation:
  language: ml
  text: എന്നാൽ യേശു സദൂക്യരെ നിശ്ശബ്ദരാക്കിയെന്ന്[a] പരീശന്മാർ കേട്ടപ്പോൾ, അവർ ഒരുമിച്ചുകൂടി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, “സദൂക്യർക്കു വായ്ക്കാപ്പിട്ടു.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് ക്രിയയ്ക്ക് മൃഗത്തിന്റെ വായിൽ കാപ്പിടുക എന്നർഥമുണ്ട്; ഈ സന്ദർഭത്തിൽ വാദത്തിൽ അവരെ നിശ്ശബ്ദരാക്കുക എന്ന ആലങ്കാരിക അർഥത്തിലാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവിവരണത്തോടുള്ള മൃദുവായ വൈരുധ്യവും ആഖ്യാനത്തിലെ മാറ്റവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: Φαρισαῖοι
  choice: പരീശന്മാർ
  rationale: ഈ യഹൂദ മതവിഭാഗത്തിന് മലയാളത്തിൽ പ്രചാരത്തിലുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: ἀκούσαντες
  choice: കേട്ടപ്പോൾ
  rationale: അയോറിസ്റ്റ് കൃദന്തത്തിന്റെ കാലസംബന്ധം സ്വാഭാവികമായ മലയാള ഉപവാക്യത്തിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: ἐφίμωσεν
  choice: നിശ്ശബ്ദരാക്കിയെന്ന്
  rationale: വാദത്തിൽ മറുപടി പറയാനാകാത്തവിധം മിണ്ടാതാക്കിയെന്ന സന്ദർഭാർഥം നൽകുന്നു; 'വായ്ക്കാപ്പിട്ടു' എന്ന മൂലദൃശ്യത്തെ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: Σαδδουκαίους
  choice: സദൂക്യരെ
  rationale: ഈ യഹൂദ മതവിഭാഗത്തിന് മലയാളത്തിൽ പ്രചാരത്തിലുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: συνήχθησαν
  choice: ഒരുമിച്ചുകൂടി
  rationale: രൂപത്തിൽ നിഷ്ക്രിയമായ ക്രിയ ഇവിടെ സ്വയം കൂട്ടമായി ഒത്തുചേർന്നു എന്ന അകർമക അർഥത്തിലാണ്.
- source_word: ἐπὶ τὸ αὐτό
  choice: ഒരുമിച്ച്
  rationale: ഒരേ സ്ഥലത്ത് ഒത്തുചേരുക എന്ന പ്രയോഗാർഥം നൽകുന്നു; സ്ഥലമോ ലക്ഷ്യമോ അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
