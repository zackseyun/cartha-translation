  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐν ἐκείνῃ τῇ ἡμέρᾳ προσῆλθον αὐτῷ Σαδδουκαῖοι, ⸀λέγοντες μὴ εἶναι ἀνάστασιν, καὶ ἐπηρώτησαν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/023.yaml
  text: On that day Sadducees came to him[a], saying there is no resurrection, and they questioned him.
translation:
  language: ml
  text: ആ ദിവസം പുനരുത്ഥാനം ഇല്ലെന്നു പറയുന്ന സദൂക്യർ അവന്റെ അടുക്കൽ വന്നു; അവർ അവനോടു ചോദിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: അന്നേ ദിവസം
  rationale: സാധാരണ മലയാളത്തിലെ സ്വാഭാവികമായ കാലസൂചന; മുൻവിവരണവുമായി ഉള്ള ബന്ധവും നിലനിർത്തുന്നു.
- source_word: προσῆλθον αὐτῷ
  choice: അവന്റെ അടുക്കൽ വന്നു
  rationale: പ്രസέρχομαι എന്ന ക്രിയയുടെ ‘അടുക്കൽ വരുക/സമീപിക്കുക’ എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു; സർവനാമം യേശുവിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: Σαδδουκαῖοι
  choice: സദൂക്യർ
  rationale: ഈ യഹൂദവിഭാഗത്തിന്റെ പേരിന് മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: λέγοντες μὴ εἶναι ἀνάστασιν
  choice: പുനരുത്ഥാനം ഇല്ല എന്നു പറഞ്ഞുകൊണ്ട്
  rationale: വർത്തമാന കൃദന്തരൂപത്തെ ക്രിയാവിശേഷണപരമായി നിലനിർത്തുകയും അവരുടെ വാദത്തിന്റെ ഉള്ളടക്കം വ്യക്തമായി അറിയിക്കുകയും ചെയ്യുന്നു; ഇതിനെ അവരുടെ സ്ഥിരവിശ്വാസം സൂചിപ്പിക്കുന്ന വിശേഷണവാക്യമായും ഗ്രഹിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἀνάστασιν
  choice: പുനരുത്ഥാനം
  rationale: മരിച്ചവർ വീണ്ടും ഉയിർത്തെഴുന്നേൽക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും അർഥസമ്പന്നവുമായ മലയാളപദം.
- source_word: ἐπηρώτησαν αὐτὸν
  choice: അവർ അവനെ ചോദ്യം ചെയ്തു
  rationale: വെറും വിവരാന്വേഷണത്തേക്കാൾ പരിശോധിക്കുന്നതോ വെല്ലുവിളിക്കുന്നതോ ആയ ചോദ്യത്തിന്റെ ഭാവം ഉൾക്കൊള്ളുന്നു; ഗ്രീക്കിലെ ‘ചോദിക്കുക/ചോദ്യം ചെയ്യുക’ എന്ന അർഥപരിധിക്കുള്ളിലാണ്.
theological_decisions:
- issue: സദൂക്യരുടെ പുനരുത്ഥാനനിഷേധം എങ്ങനെ അവതരിപ്പിക്കണം
  choice: പുനരുത്ഥാനം ഇല്ല എന്നു പറഞ്ഞുകൊണ്ട്
  alternative: പുനരുത്ഥാനം ഇല്ല എന്നു പറയുന്ന സദൂക്യർ
  rationale: പ്രധാനപാഠം ഗ്രീക്കിലെ കൃദന്തരൂപത്തിന്റെ ഒഴുക്ക് പിന്തുടരുന്നു; പകരം വായന അത് സദൂക്യരുടെ സവിശേഷ നിലപാടായി കൂടുതൽ വ്യക്തമായി അവതരിപ്പിക്കുന്നു. രണ്ടിലും ആ വാദം വിവരണമായി മാത്രമാണ് നൽകുന്നത്, ഗ്രന്ഥകാരന്റെ അംഗീകാരമായി അല്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘സദൂക്യർ’, ‘പുനരുത്ഥാനം’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തി; ശേഷിക്കുന്ന വാക്യഘടന സാധാരണ വായനക്കാർക്ക് നേരിട്ട് മനസ്സിലാകുന്നവിധം ക്രമപ്പെടുത്തി.
