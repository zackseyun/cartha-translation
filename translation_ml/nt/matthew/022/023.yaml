revisions:
- from: അന്നേ ദിവസം സദൂക്യർ അവന്റെ അടുക്കൽ വന്നു[a]; പുനരുത്ഥാനം ഇല്ല എന്നു പറഞ്ഞുകൊണ്ട് അവർ അവനെ ചോദ്യം ചെയ്തു.
  to: ആ ദിവസം പുനരുത്ഥാനം ഇല്ലെന്നു പറയുന്ന സദൂക്യർ അവന്റെ അടുക്കൽ വന്നു; അവർ അവനോടു ചോദിച്ചു.
  rationale: The text is revised to remove unsupported temporal emphasis, represent the Greek participle as a characteristic description of the Sadducees, and use idiomatic Malayalam for their questioning. The prior footnote is removed because its proposed alternative is now adopted in the main text, leaving no unresolved lexical alternative requiring an anchor.
