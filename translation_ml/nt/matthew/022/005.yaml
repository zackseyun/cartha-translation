id: MAT.22.5
reference: Matthew 22:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ ἀμελήσαντες ἀπῆλθον, ⸀ὃς μὲν εἰς τὸν ἴδιον ἀγρόν, ⸁ὃς δὲ ⸀ἐπὶ τὴν ἐμπορίαν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/005.yaml
  text: But they paid no attention and went away[a], one to his own field, another to his business.
translation:
  language: ml
  text: എന്നാൽ അവർ അത് ഗൗനിക്കാതെ[a] പോയി—ഒരാൾ സ്വന്തം വയലിലേക്കും മറ്റൊരാൾ തന്റെ വ്യാപാരത്തിലേക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അത് അവഗണിച്ച്’ അല്ലെങ്കിൽ ‘അത് കാര്യമാക്കാതെ’; സന്ദർഭത്തിൽ രാജാവിന്റെ ക്ഷണത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμελήσαντες
  choice: അത് ഗൗനിക്കാതെ
  rationale: ἀμελέω ഇവിടെ ശ്രദ്ധിക്കാതിരിക്കുക, അവഗണിക്കുക എന്ന ഭാവം നൽകുന്നു. സന്ദർഭത്തിൽ സൂചിപ്പിക്കപ്പെടുന്ന രാജാവിന്റെ ക്ഷണം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘അത്’ ചേർത്തിരിക്കുന്നു; അർഥം അമിതമായി വിശദീകരിക്കുന്നില്ല.
- source_word: ἀπῆλθον
  choice: പോയി
  rationale: ἀπέρχομαι സൂചിപ്പിക്കുന്ന അവിടെനിന്നുള്ള പുറപ്പെടൽ ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ὃς μὲν ... ὃς δὲ
  choice: ഒരാൾ ... മറ്റൊരാൾ
  rationale: μέν ... δέ സഹിതമുള്ള വിതരണാത്മക വൈരുധ്യം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: εἰς τὸν ἴδιον ἀγρόν
  choice: സ്വന്തം വയലിലേക്ക്
  rationale: ἀγρός എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘വയൽ’ നിലനിർത്തുകയും ἴδιον സൂചിപ്പിക്കുന്ന വ്യക്തിപരമായ ഉടമസ്ഥത ‘സ്വന്തം’ വഴി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ἐπὶ τὴν ἐμπορίαν αὐτοῦ
  choice: തന്റെ വ്യാപാരത്തിലേക്ക്
  rationale: ἐμπορία വ്യാപാരം അഥവാ വാണിജ്യപ്രവർത്തനം സൂചിപ്പിക്കുന്നു. ‘വ്യാപാരം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും കൃഷിയോടുള്ള വൈരുധ്യം നിലനിർത്തുന്നതുമാണ്.
theological_decisions:
- issue: ἀμελήσαντες എന്നതിന്റെ പരോക്ഷ കർമം
  choice: സന്ദർഭത്തിലെ ക്ഷണത്തെ സൂചിപ്പിക്കുന്ന വിധത്തിൽ ‘അത് ഗൗനിക്കാതെ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘അവഗണിച്ച്’ അല്ലെങ്കിൽ ‘അത് കാര്യമാക്കാതെ’
  rationale: ഗ്രീക്കിൽ കർമം തുറന്നുപറയുന്നില്ല; തൊട്ടുമുമ്പുള്ള സന്ദർഭം രാജാവിന്റെ ക്ഷണമാണെന്ന് വ്യക്തമാക്കുന്നു. ‘അത്’ എന്ന സർവനാമം ആ ബന്ധം സ്വാഭാവികമായി നൽകുന്നു, എന്നാൽ ക്ഷണം എന്നു വാക്യത്തിൽ വിശദമായി ചേർത്ത് അർഥം അതിരുകടന്ന് നിർണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഗൗനിക്കാതെ’ എന്ന പ്രയോഗം അവഗണനയുടെ ഭാവം വ്യക്തമായി നൽകുന്നു; ‘വ്യാപാരം’ സമകാലിക വായനയിൽ സ്വാഭാവികമാണ്.
