id: MAT.22.9
reference: Matthew 22:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πορεύεσθε οὖν ἐπὶ τὰς διεξόδους τῶν ὁδῶν, καὶ ὅσους ⸀ἐὰν εὕρητε καλέσατε εἰς τοὺς γάμους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/009.yaml
  text: Therefore go to the street intersections[b][a], and invite to the wedding feast as many as you find.
translation:
  language: ml
  text: അതുകൊണ്ട്, വഴികൾ ചേരുകയും പിരിയുകയും ചെയ്യുന്ന ഇടങ്ങളിലേക്കു പോകുക[a]; അവിടെ നിങ്ങൾ കണ്ടെത്തുന്ന എല്ലാവരെയും വിവാഹവിരുന്നിലേക്കു ക്ഷണിക്കുക[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വഴികൾ കൂടിച്ചേരുന്ന ഇടങ്ങളിലേക്ക്” അല്ലെങ്കിൽ “വഴികളുടെ പുറപ്പാടുകളിലേക്ക്”; വഴികൾ ചേരുകയോ ശാഖകളായി പിരിയുകയോ ചെയ്യുന്ന സ്ഥലങ്ങളെയാണ് ഗ്രീക്ക് പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ “വിവാഹങ്ങളിലേക്ക്”; ഇവിടെ വിവാഹാഘോഷത്തെയോ വിവാഹവിരുന്നിനെയോ സൂചിപ്പിക്കുന്ന ഒരു പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: πορεύεσθε
  choice: പോകുക
  rationale: വർത്തമാനകാല ആജ്ഞാരൂപത്തിന്റെ നേരിട്ടുള്ള നിർദേശഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യത്തിൽനിന്നുള്ള നിഗമനമോ ഫലമോ സൂചിപ്പിക്കുന്ന ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἐπὶ τὰς διεξόδους τῶν ὁδῶν
  choice: വഴികൾ ചേരുകയും പിരിയുകയും ചെയ്യുന്ന ഇടങ്ങളിലേക്ക്
  rationale: διέξοδοι എന്ന പദത്തിന് വഴികളുടെ പുറപ്പാടുകൾ, ശാഖപ്പെടുന്ന ഇടങ്ങൾ, സംഗമസ്ഥാനങ്ങൾ എന്നീ സാധ്യതകളുണ്ട്. ഒരു പ്രത്യേക ഭൗമരൂപം മാത്രം നിശ്ചയിക്കാതെ ഗ്രീക്കിലെ അർത്ഥവ്യാപ്തി സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: ὅσους ἐὰν εὕρητε
  choice: നിങ്ങൾ കണ്ടെത്തുന്ന എല്ലാവരെയും
  rationale: ὅσους എന്നതിലെ വ്യാപ്തിയും ἐάν ചേർന്ന അനിശ്ചിതത്വവും ഉൾക്കൊള്ളുന്ന, മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗം.
- source_word: καλέσατε
  choice: ക്ഷണിക്കുക
  rationale: വിവാഹവിരുന്നിന്റെ പശ്ചാത്തലത്തിൽ καλέω വെറുതെ വിളിക്കുക എന്നതിലുപരി ക്ഷണിക്കുക എന്നാണ്.
- source_word: εἰς τοὺς γάμους
  choice: വിവാഹവിരുന്നിലേക്ക്
  rationale: ബഹുവചനമായ γάμοι ഇവിടെ പല വിവാഹങ്ങളെ അല്ല, വിവാഹാഘോഷത്തെയോ വിരുന്നിനെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആജ്ഞാശൈലി ഉപയോഗിച്ചു. അപരിചിതമായ ‘വഴികളുടെ പുറപ്പാടുകൾ’ എന്ന അക്ഷരാർഥപ്രയോഗത്തിനു പകരം പ്രധാനപാഠത്തിൽ അർത്ഥവ്യാപ്തി വ്യക്തമാക്കുന്ന വിവരണം നൽകി; മറ്റ് സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
