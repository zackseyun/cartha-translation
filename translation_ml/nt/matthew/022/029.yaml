id: MAT.22.29
reference: Matthew 22:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Πλανᾶσθε μὴ εἰδότες τὰς γραφὰς μηδὲ τὴν δύναμιν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/029.yaml
  text: But Jesus answered them[a], “You are mistaken, because you know neither the Scriptures nor the power of God.”
translation:
  language: ml
  text: 'എന്നാൽ യേശു അവരോടു മറുപടി പറഞ്ഞു: “തിരുവെഴുത്തുകളെയോ ദൈവത്തിന്റെ ശക്തിയെയോ അറിയാത്തതിനാൽ നിങ്ങൾ തെറ്റുന്നു.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങൾ തെറ്റിലാണ്” എന്നും “നിങ്ങൾ വഞ്ചിക്കപ്പെടുന്നു” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: എന്നാൽ യേശു അവരോടു മറുപടി പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ പതിവ് പ്രതികരണസൂത്രമായ ‘മറുപടി പറഞ്ഞുകൊണ്ട് പറഞ്ഞു’ എന്ന ഘടനയെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘മറുപടി പറഞ്ഞു’ എന്നു ചുരുക്കുന്നു; δέയുടെ നേരിയ വൈരുധ്യഭാവം ‘എന്നാൽ’ നിലനിർത്തുന്നു.
- source_word: Πλανᾶσθε
  choice: നിങ്ങൾ തെറ്റിപ്പോകുന്നു
  rationale: ക്രിയയുടെ വർത്തമാനകാലവും വഴിതെറ്റുക, തെറ്റിലാകുക എന്ന അർത്ഥവ്യാപ്തിയും നിലനിർത്തുന്നു; പുറത്തുനിന്നുള്ള വഞ്ചന മാത്രമാണെന്ന ധ്വനി നിർബന്ധമാക്കുന്നില്ല.
- source_word: μὴ εἰδότες
  choice: അറിയാത്തതിനാൽ
  rationale: പങ്കാളിക്രിയ ഇവിടെ അവരുടെ തെറ്റിന്റെ കാരണം സൂചിപ്പിക്കുന്നതിനാൽ, മലയാളത്തിൽ കാരണബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τὰς γραφὰς
  choice: തിരുവെഴുത്തുകൾ
  rationale: യഹൂദ-ആദിമക്രൈസ്തവ പ്രയോഗത്തിൽ വിശുദ്ധലിഖിതങ്ങളെ സൂചിപ്പിക്കുന്ന പതിവും വ്യക്തവുമായ മലയാള പദം.
- source_word: μηδὲ τὴν δύναμιν τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ ശക്തിയോ
  rationale: μηδέയാൽ ബന്ധിപ്പിച്ച രണ്ടു കാര്യങ്ങളെയും മലയാളത്തിലെ ‘-ഓ ... -ഓ’ ഘടനയിലൂടെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; δύναμις എന്നതിന്റെ നേരിട്ടുള്ള അർത്ഥം ‘ശക്തി’ എന്നു നിലനിർത്തുന്നു.
theological_decisions:
- issue: സദൂക്യരുടെ തെറ്റിന്റെ കാരണം
  choice: തിരുവെഴുത്തുകളും ദൈവത്തിന്റെ ശക്തിയും അറിയാത്തതാണ് അവരുടെ തെറ്റിന്റെ കാരണമെന്ന് യേശു പറയുന്നു.
  alternative: കാരണം ഊന്നാതെ, അവർ പൊതുവായി തെറ്റിലാണെന്ന പ്രസ്താവന മാത്രം.
  rationale: μὴ εἰδότες എന്ന പങ്കാളിക്രിയാസംയോജനം Πλανᾶσθε എന്ന പ്രസ്താവനയ്ക്കു സ്വാഭാവികമായി കാരണം നൽകുന്നു; അതിനാൽ ‘അറിയാത്തതിനാൽ’ എന്ന പരിഭാഷ കാരണബന്ധം സംരക്ഷിക്കുന്നു.
- issue: Πλανᾶσθε എന്നതിലെ കർത്തൃ/കർമണി അർത്ഥസാധ്യത
  choice: നിങ്ങൾ തെറ്റിപ്പോകുന്നു
  alternative: നിങ്ങൾ വഞ്ചിക്കപ്പെടുന്നു / നിങ്ങൾ തെറ്റിലാണ്
  rationale: ഗ്രീക്ക് രൂപത്തിന് വഴിതെറ്റുക, തെറ്റിലാകുക, വഞ്ചിക്കപ്പെടുക എന്നീ ധ്വനികൾ ഉണ്ടായേക്കാം. മുഖ്യവാചകം പുറംവഞ്ചനയെ മാത്രം നിർണ്ണയിക്കാതെ അർത്ഥവ്യാപ്തി സൂക്ഷിക്കുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘തിരുവെഴുത്തുകൾ’, ‘ദൈവത്തിന്റെ ശക്തി’ എന്നീ പരിചിത ബൈബിൾപ്രയോഗങ്ങൾ നിലനിർത്തിയിരിക്കുന്നു; ഗ്രീക്കിലെ ആവർത്തനാത്മക പ്രതികരണസൂത്രം മലയാളത്തിൽ സ്വാഭാവികമാക്കി.
