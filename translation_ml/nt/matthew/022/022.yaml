  yaml_path: translation/nt/matthew/022/022.yaml
  text: And hearing this[a], they were amazed, and leaving him, they went away.
translation:
  language: ml
  text: അതു കേട്ടപ്പോൾ[a] അവർ ആശ്ചര്യപ്പെട്ടു; അവനെ വിട്ട് അവർ പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കേട്ടിട്ട് അവർ വിസ്മയിച്ചു; അവനെ വിട്ട് അവർ പോയി.’
    reason: ക്രിയാവിശേഷരൂപത്തിന്റെയും θαυμάζω എന്ന ക്രിയയുടെയും സാധുവായ കൂടുതൽ രൂപാനുസൃത പകരംവിവർത്തനം.
lexical_decisions:
- source_word: ἀκούσαντες
  choice: അതു കേട്ടപ്പോൾ
  rationale: നാമനിർദേശക ബഹുവചനത്തിലുള്ള ഭൂതകാല കർത്തൃവാചക ക്രിയാവിശേഷരൂപം പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽനിന്ന് മനസ്സിലാകുന്ന കർമത്തെ ‘അതു’ എന്നു വ്യക്തമാക്കുന്നത് സ്വാഭാവിക മലയാളമാണ്.
- source_word: ἐθαύμασαν
  choice: അവർ ആശ്ചര്യപ്പെട്ടു
  rationale: θαυμάζω സൂചിപ്പിക്കുന്ന വിസ്മയപ്രതികരണം ആധുനിക സാധാരണ മലയാളത്തിൽ വ്യക്തവും മാന്യവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἀφέντες αὐτὸν
  choice: അവനെ വിട്ട്
  rationale: ഇവിടെ ἀφίημι ഒരാളെ വിട്ടുപോകുക എന്ന അർഥത്തിലാണ്. ‘തനിച്ചാക്കി’ എന്ന മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്ത ആശയം ചേർക്കുന്നില്ല.
- source_word: ἀπῆλθαν
  choice: അവർ പോയി
  rationale: ἀπέρχομαι എന്നതിന്റെ അകന്നുപോകുന്ന കഥാഗതിയെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘യാത്രയായി’ പോലുള്ള അനാവശ്യ ഔപചാരികത ഒഴിവാക്കുന്നു.
- source_word: καὶ ... καὶ
  choice: …; …
  rationale: ഗ്രീക്കിലെ ആവർത്തിച്ചുള്ള καί പ്രവർത്തനങ്ങളുടെ അനുക്രമത്തെ ബന്ധിപ്പിക്കുന്നു. മലയാളത്തിൽ അർധവിരാമവും തുടർന്നുള്ള വാക്യഘടനയും ആ ഒഴുക്ക് സ്വാഭാവികമായി നിലനിർത്തുന്നു.
