id: MAT.22.45
reference: Matthew 22:45
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ οὖν Δαυὶδ καλεῖ αὐτὸν κύριον, πῶς υἱὸς αὐτοῦ ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/045.yaml
  text: If[a], then, David calls him Lord, how is he his son?
translation:
  language: ml
  text: അതിനാൽ, ദാവീദ് അവനെ ‘കർത്താവ്’ എന്നു വിളിക്കുന്നുവെങ്കിൽ[a], അവൻ എങ്ങനെ ദാവീദിന്റെ മകനാകുന്നു?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, സന്ദർഭം കൂടുതൽ വ്യക്തമാക്കിക്കൊണ്ട്: “അതിനാൽ, ദാവീദ് മശീഹയെ ‘കർത്താവ്’ എന്നു വിളിക്കുന്നുവെങ്കിൽ, മശീഹ എങ്ങനെ ദാവീദിന്റെ മകനാകുന്നു?”'
    reason: മുൻസന്ദർഭത്തിൽനിന്ന് αὐτόν സൂചിപ്പിക്കുന്ന വ്യക്തിയെ വ്യക്തമാക്കുന്ന പര്യായവായന; ‘മശീഹ’ എന്ന പദം ഈ വാക്യത്തിന്റെ ഗ്രീക്ക് പാഠത്തിൽ നേരിട്ട് ഇല്ല.
lexical_decisions:
- source_word: εἰ οὖν
  choice: അതിനാൽ ... വിളിക്കുന്നുവെങ്കിൽ
  rationale: εἰയുടെ നിബന്ധനാഭാവവും οὖνയുടെ നിഗമനാത്മക ബന്ധവും സ്വാഭാവികമായ മലയാള വാക്യക്രമത്തിൽ നിലനിർത്തുന്നു; മുൻവാദത്തിൽനിന്ന് ഉയരുന്ന ചോദ്യം എന്ന ഘടന സംരക്ഷിക്കുന്നു.
- source_word: Δαυὶδ
  choice: ദാവീദ്
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ സ്ഥാപിതമായ ലിപ്യന്തരണം.
- source_word: καλεῖ αὐτὸν κύριον
  choice: അവനെ ‘കർത്താവ്’ എന്നു വിളിക്കുന്നു
  rationale: καλέωയുടെ ‘എന്നു വിളിക്കുക’ എന്ന അർഥം നേരിട്ട് നൽകുന്നു. κύριος എന്ന ബഹുമാനസൂചകവും സങ്കീർത്തനം 110:1-നോടുള്ള പ്രതിധ്വനിയും ‘കർത്താവ്’ നിലനിർത്തുന്നു.
- source_word: πῶς
  choice: എങ്ങനെ
  rationale: ബന്ധത്തിലെ പ്രത്യക്ഷമായ യുക്തിസംഘർഷം ഉന്നയിക്കുന്ന ചോദ്യത്തെ നേരിട്ടും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
- source_word: υἱὸς αὐτοῦ ἐστιν
  choice: അവൻ എങ്ങനെ ദാവീദിന്റെ മകനാകുന്നു?
  rationale: ‘മകൻ’ എന്ന കുടുംബപരവും രാജവംശപരവുമായ ഭാഷ നിലനിർത്തുന്നു; ‘സന്തതി’ എന്ന് വ്യാഖ്യാനിച്ച് വിശാലമാക്കുന്നില്ല. മലയാളത്തിൽ സർവനാമത്തിന്റെ അവ്യക്തത ഒഴിവാക്കാൻ αὐτοῦയുടെ സൂചകം ‘ദാവീദിന്റെ’ എന്ന് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ദാവീദ് മശീഹയെ ‘കർത്താവ്’ എന്നു വിളിക്കുന്നതും അവൻ ദാവീദിന്റെ മകനായിരിക്കുന്നതും തമ്മിലുള്ള ക്രിസ്തുശാസ്ത്രപരമായ സംഘർഷം
  choice: പ്രധാനപാഠത്തിൽ ‘കർത്താവ്’, ‘ദാവീദിന്റെ മകൻ’ എന്നീ രണ്ട് പ്രയോഗങ്ങളും വിശദീകരണമില്ലാതെ നിലനിർത്തി.
  alternative: “ദാവീദ് മശീഹയെ ‘കർത്താവ്’ എന്നു വിളിക്കുന്നുവെങ്കിൽ, മശീഹ എങ്ങനെ ദാവീദിന്റെ മകനാകുന്നു?”
  rationale: ഗ്രീക്കിൽ ഈ വാക്യത്തിൽ ‘മശീഹ’ എന്ന നാമം പ്രത്യക്ഷമല്ല; αὐτόν മുൻസന്ദർഭത്തിൽനിന്നുള്ള സൂചനയാണ്. അതിനാൽ പ്രധാനപാഠത്തിൽ അത് ചേർത്ത് വ്യാഖ്യാനം ഉറപ്പിക്കാതെ, യേശുവിന്റെ വാഗ്‌വൈരുദ്ധ്യാത്മക ചോദ്യവും അതിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ചോദ്യം. ‘കർത്താവ്’ എന്ന സ്ഥാപിത ബൈബിൾപദം ഉപയോഗിച്ചു; ‘മകൻ’ എന്ന പദം നിലനിർത്തി വംശപരമായ അർഥം വ്യാഖ്യാനിച്ച് ചുരുക്കിയിട്ടില്ല. ഉദ്ധരണിചിഹ്നങ്ങൾ ബഹുമാനനാമത്തിന്റെ പ്രയോഗം വ്യക്തമാക്കുന്നു.
