revisions:
- from: അതുപോലെതന്നെ രണ്ടാമനും മൂന്നാമനും സംഭവിച്ചു; അങ്ങനെ ഏഴുപേരും വരെ[a].
  to: രണ്ടാമനും മൂന്നാമനും അങ്ങനെതന്നെ സംഭവിച്ചു; ഏഴുപേരുടെ കാര്യത്തിലും അങ്ങനെതന്നെ സംഭവിച്ചു.
  rationale: The revision preserves the discourse link of ὁμοίως, the inclusive force conveyed by the two occurrences of καί through “-ഉം,” the substantival ordinals without adding “brother,” and the extension of the same event through all seven in ἕως τῶν ἑπτά. It replaces an incomplete phrase with idiomatic, complete Malayalam.
