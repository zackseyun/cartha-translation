  text: Likewise also the second and the third[a], up to the seven.
translation:
  language: ml
  text: രണ്ടാമനും മൂന്നാമനും അങ്ങനെതന്നെ സംഭവിച്ചു; ഏഴുപേരുടെ കാര്യത്തിലും അങ്ങനെതന്നെ സംഭവിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁμοίως
  choice: അതുപോലെതന്നെ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ അതേ സംഭവം തുടർന്നുള്ളവർക്കും ഉണ്ടായെന്ന ആശയബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: καὶ ὁ δεύτερος καὶ ὁ τρίτος
  choice: രണ്ടാമനും മൂന്നാമനും
  rationale: ആവർത്തിച്ചുള്ള καὶ മലയാളത്തിലെ ‘-ഉം ... -ഉം’ ഘടനയിൽ പ്രതിനിധീകരിക്കുന്നു. ഗ്രീക്കിൽ ‘സഹോദരൻ’ എന്ന പദം വ്യക്തമാക്കിയിട്ടില്ലാത്തതിനാൽ അധ്യാഹരിക്കാതെ, നാമമായി ഉപയോഗിച്ച ക്രമസംഖ്യകൾ നിലനിർത്തുന്നു.
- source_word: ἕως τῶν ἑπτά
  choice: അങ്ങനെ ഏഴുപേരും വരെ
  rationale: സംഭവം ഏഴുപേരുടെ മുഴുവൻ കൂട്ടത്തിലേക്കും തുടർന്നു എന്ന അർഥം നൽകുന്നു. ആളുകളെയാണ് സൂചിപ്പിക്കുന്നതെന്ന സന്ദർഭസൂചന മലയാളത്തിലെ ‘പേർ’ വ്യക്തമാക്കുന്നു; ‘വരെ’ ἕως എന്ന പരിധിബോധം സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ഭാഷ. മൂലത്തിലെ സംക്ഷിപ്തമായ ക്രമസംഖ്യപ്രയോഗം കഴിയുന്നത്ര നിലനിർത്തിയെങ്കിലും, മലയാളത്തിൽ വാക്യം പൂർണമാകാൻ സന്ദർഭത്തിൽനിന്ന് ‘സംഭവിച്ചു’ ചേർത്തിരിക്കുന്നു. അടിക്കുറിപ്പിലെ [a] മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
