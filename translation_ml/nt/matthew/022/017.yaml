id: MAT.22.17
reference: Matthew 22:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰπὸν οὖν ἡμῖν τί σοι δοκεῖ· ἔξεστιν δοῦναι κῆνσον Καίσαρι ἢ οὔ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/017.yaml
  text: Tell us, then, what do you think? Is it lawful to give the poll tax to Caesar, or not?
translation:
  language: ml
  text: '“അതുകൊണ്ട്, നിനക്ക് എന്തു തോന്നുന്നു എന്നു ഞങ്ങളോടു പറയൂ: കൈസർക്കു തലനികുതി കൊടുക്കുന്നത് അനുവദനീയമാണോ, അല്ലയോ?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί σοι δοκεῖ
  choice: നിനക്ക് എന്തു തോന്നുന്നു
  rationale: അഭിപ്രായം ചോദിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവികവും നേരിട്ടുമായ മലയാളരൂപം.
- source_word: ἔξεστιν
  choice: ന്യായപ്രമാണപ്രകാരം അനുവദനീയമാണോ
  rationale: സാധാരണ അനുമതിയേക്കാൾ മതനിയമപരമായ സാധുതയാണ് ഈ വിവാദസന്ദർഭത്തിൽ ചോദ്യം ചെയ്യപ്പെടുന്നത്; അതിനാൽ ‘അനുവദനീയമാണോ’ എന്നതോടൊപ്പം നിയമസന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: δοῦναι
  choice: കൊടുക്കുന്നത്
  rationale: ‘കൊടുക്കുക’ എന്ന മൂലാർത്ഥം നിലനിർത്തുന്നു; നികുതി അടയ്ക്കുക എന്ന ആശയം സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: κῆνσον
  choice: കരം
  rationale: റോമൻ ഭരണകൂടം ചുമത്തിയ വ്യക്തിനികുതിയെ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന സംക്ഷിപ്ത പദത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: Καίσαρι
  choice: കൈസർക്കു
  rationale: റോമൻ ചക്രവർത്തിയുടെ പദവിയായ Caesar-ന്റെ മലയാള ലിപ്യന്തരണം; ദത്തിവിഭക്തിയും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ἔξεστιν എന്ന പദത്തിന്റെ നിയമപരമായ ഭാവം
  choice: ന്യായപ്രമാണപ്രകാരം അനുവദനീയമാണോ
  alternative: നിയമാനുസൃതമാണോ / അനുവദനീയമാണോ
  rationale: ചോദ്യം റോമൻ സിവിൽനിയമം മാത്രം സംബന്ധിച്ചതല്ല; യഹൂദമതനിയമവും ദൈവത്തോടുള്ള വിശ്വസ്തതയും പശ്ചാത്തലത്തിലുണ്ട്. എന്നാൽ ഏത് പ്രത്യേക നിയമമാണ് ഉദ്ദേശ്യമെന്ന് അതിരുകടന്ന് നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ചോദ്യം ഉന്നയിക്കുന്ന വഞ്ചനാപരമായ സംഭാഷണഭാവം കൂട്ടിച്ചേർക്കാതെ, മൂലവാക്യത്തിന്റെ നേരിട്ടുള്ള രൂപം നിലനിർത്തി.
