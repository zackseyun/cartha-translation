  text: Συνηγμένων δὲ τῶν Φαρισαίων ἐπηρώτησεν αὐτοὺς ὁ Ἰησοῦς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/041.yaml
  text: While the Pharisees were gathered together, Jesus asked them,
translation:
  language: ml
  text: 'പരീശന്മാർ ഒരുമിച്ചുകൂടിയിരിക്കുമ്പോൾ യേശു അവരോടു ചോദിച്ചു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συνηγμένων
  choice: ഒരുമിച്ചുകൂടിയിരിക്കുമ്പോൾ
  rationale: συνάγω എന്ന ക്രിയയുടെ ജനിറ്റീവ് അബ്സല്യൂട്ട് രൂപം പശ്ചാത്തലസാഹചര്യം സൂചിപ്പിക്കുന്നു. ‘ഒരുമിച്ചുകൂടിയിരിക്കുമ്പോൾ’ എന്നത് കൂട്ടമായുള്ള കൂടിച്ചേരലും ‘while’ എന്ന സാഹചര്യാർഥവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയില്ല
  rationale: ഇവിടെ δέ ശക്തമായ വിരോധമല്ല, നേരിയ ആഖ്യാനമാറ്റമാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ വാക്യക്രമവും സാഹചര്യവും ഈ ബന്ധം സ്വാഭാവികമായി വഹിക്കുന്നതിനാൽ ‘എന്നാൽ’ അല്ലെങ്കിൽ ‘അപ്പോൾ’ ചേർക്കുന്നത് അനാവശ്യമായ അർഥനിറം നൽകാം.
- source_word: τῶν Φαρισαίων
  choice: പരീശന്മാർ
  rationale: Φαρισαῖοι എന്ന സംഘനാമത്തിന്റെ പ്രചാരത്തിലുള്ള മലയാളരൂപം. ജനിറ്റീവ് അബ്സല്യൂട്ട് ഘടന മലയാളത്തിൽ കർത്തൃരൂപമുള്ള ഉപവാക്യമായി സ്വാഭാവികമാക്കി.
- source_word: ἐπηρώτησεν
  choice: ചോദിച്ചു
  rationale: ഇവിടെ ἐπερωτάω ഒരു ചോദ്യം ഉന്നയിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ചോദ്യം ചെയ്തു’ എന്നതിനെക്കാൾ ‘ചോദിച്ചു’ സാധാരണവും സ്വാഭാവികവുമാണ്; അനാവശ്യമായ ഏറ്റുമുട്ടൽഭാവവും നൽകുന്നില്ല.
- source_word: αὐτοὺς
  choice: അവരോടു
  rationale: സൂചിപ്പിക്കുന്നത് മുമ്പ് പറഞ്ഞ പരീശന്മാരെയാണ്. ‘ചോദിക്കുക’ എന്ന മലയാളക്രിയയോടൊപ്പം വ്യക്തിയെ ‘-ഓട്’ വിഭക്തിയിൽ പറയുന്നത് സ്വാഭാവികമാണ്.
- source_word: ὁ Ἰησοῦς
  choice: യേശു
  rationale: വ്യക്തിനാമത്തിനു മുമ്പുള്ള ഗ്രീക്ക് നിർദ്ദേശകോപപദം മലയാളത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്തേണ്ടതില്ല.
