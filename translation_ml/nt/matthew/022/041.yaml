translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. തുടർന്നുവരുന്ന നേരിട്ടുള്ള ചോദ്യത്തെ പരിചയപ്പെടുത്തുന്നതിനാൽ വാക്യാവസാനത്തിൽ ദ്വിബിന്ദു ഉപയോഗിച്ചു; വാക്യം ഒറ്റയ്ക്കായി ഉദ്ധരിക്കേണ്ട പതിപ്പിൽ കോമയും സ്വീകരിക്കാവുന്നതാണ്.
