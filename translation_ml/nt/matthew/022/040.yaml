  text: ἐν ταύταις ταῖς δυσὶν ἐντολαῖς ὅλος ὁ νόμος ⸂κρέμαται καὶ οἱ προφῆται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/040.yaml
  text: On these two commandments hang the whole Law and the Prophets[a][b].
translation:
  language: ml
  text: ഈ രണ്ടു കല്പനകളിന്മേൽ ന്യായപ്രമാണം മുഴുവനും പ്രവാചകന്മാരും തൂങ്ങിനിൽക്കുന്നു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഈ രണ്ടു കല്പനകളിൽ.’ ഗ്രീക്കിൽ ഉപയോഗിച്ചിരിക്കുന്ന ἐν എന്ന പദത്തിന് ‘ഇൽ’ എന്നർഥമുണ്ട്; എന്നാൽ ‘തൂങ്ങിനിൽക്കുന്നു’ എന്ന രൂപകത്തോടൊപ്പം മലയാളത്തിൽ ‘മേൽ’ എന്നത് ആശ്രയത്തിന്റെ അർഥം കൂടുതൽ സ്വാഭാവികമായി നൽകുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ന്യായപ്രമാണവും പ്രവാചകന്മാരും’ എന്നത് തിരുവെഴുത്തുസാക്ഷ്യത്തെ സമഗ്രമായി സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്; അതെല്ലാം ഈ രണ്ടു കല്പനകളിൽ ആശ്രയിച്ചിരിക്കുന്നു എന്നതാണ് ആശയം.
    reason: cross_reference
lexical_decisions:
- source_word: ἐν ταύταις ταῖς δυσὶν ἐντολαῖς
  choice: ഈ രണ്ടു കല്പനകളിന്മേൽ
  rationale: ἐν എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘ഇൽ/ഉള്ളിൽ’ ആണെങ്കിലും, κρέμαται എന്ന തൂങ്ങിനിൽക്കൽ-രൂപകത്തോടൊപ്പം ആശ്രയത്തിന്റെ അർഥം സ്വാഭാവികമായി നൽകാൻ മലയാളത്തിൽ ‘മേൽ’ യോജിക്കുന്നു.
- source_word: ὅλος ὁ νόμος
  choice: ന്യായപ്രമാണം മുഴുവനും
  rationale: ὅλος ഏകവചനമായ νόμος-ന്റെ സമഗ്രത ഊന്നിപ്പറയുന്നു. ഇവിടെ νόμος പൊതുവായ നിയമമല്ല, തോറാ എന്ന തിരുവെഴുത്തുസമുച്ചയത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ന്യായപ്രമാണം’ ഉപയോഗിച്ചു.
- source_word: κρέμαται
  choice: തൂങ്ങിനിൽക്കുന്നു
  rationale: ക്രിയയുടെ ദൃശ്യമായ ‘തൂങ്ങുക’ എന്ന രൂപകം നിലനിർത്തുന്നു; അതോടൊപ്പം ഈ രണ്ടു കല്പനകളിലുള്ള ആശ്രയവും മലയാളത്തിൽ മനസ്സിലാക്കാവുന്നതാണ്.
- source_word: καὶ οἱ προφῆται
  choice: പ്രവാചകന്മാരും
  rationale: ‘ന്യായപ്രമാണവും പ്രവാചകന്മാരും’ എന്ന സ്ഥാപിതമായ തിരുവെഴുത്തുപ്രയോഗത്തിന്റെ രണ്ടാമത്തെ ഘടകമാണിത്; വെറും ചില പ്രവാചകവ്യക്തികളെ മാത്രമല്ല, പ്രവാചകഗ്രന്ഥങ്ങളെയും അവയുടെ സാക്ഷ്യത്തെയും സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘ന്യായപ്രമാണവും പ്രവാചകന്മാരും’ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: മുഴുവൻ തിരുവെഴുത്തുസാക്ഷ്യത്തെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗത സൂത്രവാക്യം അതേപടി നിലനിർത്തി.
  alternative: ധാർമികനിയമങ്ങളും പ്രവാചകധാർമികപഠിപ്പിക്കലുകളും മാത്രം എന്നു ചുരുക്കി വായിക്കുക; അല്ലെങ്കിൽ നേരിട്ട് ‘മുഴുവൻ തിരുവെഴുത്തും’ എന്നു വ്യാഖ്യാനിച്ച് പരിഭാഷപ്പെടുത്തുക.
  rationale: മത്തായിയിൽ ഈ പ്രയോഗത്തിന് വിശാലമായ തിരുവെഴുത്തുസംബന്ധിയായ പ്രതിധ്വനിയുണ്ട്. അതിനെ വ്യാഖ്യാനപരമായി ചുരുക്കുകയോ ‘തിരുവെഴുത്ത്’ എന്നു പൊതുവാക്കുകയോ ചെയ്യാതെ മൂലത്തിലെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തി സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള തിരുവെഴുത്തുശൈലി. ‘കല്പന’, ‘ന്യായപ്രമാണം’, ‘പ്രവാചകന്മാർ’ എന്നീ പരിചിത പദങ്ങൾ നിലനിർത്തി; κρέμαται-യുടെ സജീവരൂപകം നഷ്ടപ്പെടുത്താതിരിക്കാൻ ‘തൂങ്ങിനിൽക്കുന്നു’ ഉപയോഗിച്ചു.
