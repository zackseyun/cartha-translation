  naturalness: The revised sentence uses an idiomatic Malayalam purpose construction («വിളിച്ചുവരുത്താൻ ... അയച്ചു») and places each note marker immediately after the word or phrase it qualifies. «വരാൻ ഇച്ഛിച്ചില്ല» naturally and directly represents the volitional force of οὐκ ἤθελον without strengthening it to refusal.
  terminology: «ദാസന്മാർ» is an appropriate contextual rendering of δούλους in this parable, with «അടിമകൾ» retained as a lexical alternative. «ക്ഷണിക്കപ്പെട്ടവരെ» is clear in the banquet context for κεκλημένους, while the note preserves the Greek verbal connection to the calling/summoning expression. «വിവാഹവിരുന്ന്» suitably represents τοὺς γάμους here.
