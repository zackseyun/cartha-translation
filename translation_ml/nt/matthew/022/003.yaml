    rationale: 'The Greek has ἀπέστειλεν followed by the purpose infinitive καλέσαι: he sent his servants in order to call/summon the already invited people. The draft''s two finite verbs can be read as two separate actions and «വിളിപ്പിച്ചു» may suggest causation by an unexpressed agent.'
