id: MAT.22.3
reference: Matthew 22:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν τοὺς δούλους αὐτοῦ καλέσαι τοὺς κεκλημένους εἰς τοὺς γάμους, καὶ οὐκ ἤθελον ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/003.yaml
  text: And he sent his servants to call those who had been invited to the wedding feast[c][b][a], and they were unwilling to come.
translation:
  language: ml
  text: വിവാഹവിരുന്നിലേക്ക് ക്ഷണിക്കപ്പെട്ടവരെ[b] വിളിച്ചുവരുത്താൻ തന്റെ ദാസന്മാരെ[a] അയച്ചു; എന്നാൽ അവർ വരാൻ ഇച്ഛിച്ചില്ല.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അടിമകളെ.’ ഗ്രീക്ക് പദത്തിന് ‘ദാസന്മാർ’ എന്നും ‘അടിമകൾ’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘വിളിക്കപ്പെട്ടവരെ.’ ‘വിളിച്ചുവരുത്താൻ’ എന്നതിനും ‘ക്ഷണിക്കപ്പെട്ടവർ’ എന്നതിനും ഗ്രീക്കിൽ ഒരേ ക്രിയാകുടുംബമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘അവർ വരാൻ മനസ്സില്ലായിരുന്നു.’ ഗ്രീക്കിൽ അവരുടെ ഇച്ഛയില്ലായ്മയാണ് ഊന്നിപ്പറയുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: അയച്ചു
  rationale: ആയോറിസ്റ്റ് ക്രിയയുടെ ലളിതമായ ഭൂതകാല അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: δούλους
  choice: ദാസന്മാരെ
  rationale: δοῦλος എന്ന പദത്തിന് ദാസൻ/അടിമ എന്നീ അർഥങ്ങൾ വരാം. ഇവിടെ രാജാവിന്റെ നിയോഗം നിർവഹിക്കുന്നവരെന്ന കഥാപരമായ പങ്കാണ് മുൻനിൽക്കുന്നത്; 'ദാസന്മാർ' ആ ബന്ധവും ചുമതലയും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: καλέσαι
  choice: വിളിപ്പിച്ചു
  rationale: അയച്ചതിന്റെ ഉദ്ദേശ്യം വ്യക്തമാക്കുകയും καλέω എന്ന ക്രിയാകുടുംബത്തിന്റെ 'വിളിക്കുക' എന്ന ആശയം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: κεκλημένους
  choice: മുമ്പേ ക്ഷണിക്കപ്പെട്ടവരെ
  rationale: പെർഫെക്റ്റ് പാസീവ് രൂപം മുൻകൂട്ടി ലഭിച്ച ക്ഷണത്തിന്റെ നിലയെ സൂചിപ്പിക്കുന്നു; വിരുന്നിന്റെ സന്ദർഭത്തിൽ 'ക്ഷണിക്കപ്പെട്ടവർ' വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: εἰς τοὺς γάμους
  choice: വിവാഹവിരുന്നിലേക്ക്
  rationale: ബഹുവചനമായ γάμοι ഇവിടെ വിവാഹാഘോഷത്തെയോ അതിലെ വിരുന്നിനെയോ സൂചിപ്പിക്കുന്നു; കഥാസന്ദർഭത്തിൽ 'വിവാഹവിരുന്ന്' ഏറ്റവും വ്യക്തമാണ്.
- source_word: οὐκ ἤθελον ἐλθεῖν
  choice: അവർ വരാൻ മനസ്സായില്ല
  rationale: വരാത്തതിനെക്കാൾ അവരുടെ മനസ്സില്ലായ്മയെ മുൻനിർത്തുന്ന ഇച്ഛാസംബന്ധിയായ അർഥം നിലനിർത്തുന്നു; 'വരാൻ വിസമ്മതിച്ചു' എന്നതിനെക്കാൾ ഗ്രീക്കിന്റെ ശക്തി കൂട്ടുന്നില്ല.
theological_decisions:
- issue: ഉപമയിലെ δοῦλος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ദാസന്മാർ
  alternative: അടിമകൾ
  rationale: ഇവിടെ അവരുടെ ബന്ധിത സാമൂഹികപദവിയേക്കാൾ രാജാവിന്റെ നിയോഗം അനുസരിക്കുന്ന പ്രതിനിധികളെന്ന പങ്കാണ് മുൻനിൽക്കുന്നത്. അതിനാൽ പ്രത്യേക സാമൂഹികമോ ദൈവശാസ്ത്രപരമോ ആയ ഊന്നൽ ഇറക്കുമതി ചെയ്യാതെ 'ദാസന്മാർ' തിരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. ഗ്രീക്കിലെ ഉദ്ദേശ്യനിർമാണം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ 'അയച്ചു ... വിളിപ്പിച്ചു' എന്നു നൽകി. മുൻക്ഷണവും ഇപ്പോഴത്തെ വിളിച്ചുവരുത്തലും തമ്മിലുള്ള വ്യത്യാസം 'മുമ്പേ' എന്നതിലൂടെ വ്യക്തമാക്കി; ഇച്ഛയില്ലായ്മയുടെ സൂക്ഷ്മത 'മനസ്സായില്ല' എന്നു നിലനിർത്തി.
