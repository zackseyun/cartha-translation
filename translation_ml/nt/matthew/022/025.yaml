id: MAT.22.25
reference: Matthew 22:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἦσαν δὲ παρ’ ἡμῖν ἑπτὰ ἀδελφοί· καὶ ὁ πρῶτος ⸀γήμας ἐτελεύτησεν, καὶ μὴ ἔχων σπέρμα ἀφῆκεν τὴν γυναῖκα αὐτοῦ τῷ ἀδελφῷ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/025.yaml
  text: There were seven brothers among us[a]. The first married and died, and having no offspring[b], he left his wife to his brother.
translation:
  language: ml
  text: ഞങ്ങളുടെ ഇടയിൽ ഏഴ് സഹോദരന്മാർ ഉണ്ടായിരുന്നു. ആദ്യത്തെയാൾ വിവാഹം കഴിച്ച് മരിച്ചു; സന്തതി ഇല്ലാതെ[a] തന്റെ ഭാര്യയെ തന്റെ സഹോദരനുവേണ്ടി വിട്ടുപോയി.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘വിത്ത് ഇല്ലാതെ.’ ഇവിടെ ‘വിത്ത്’ എന്നത് സന്തതിയെയോ പിൻതലമുറയെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: മരിച്ച പുരുഷന്റെ സഹോദരൻ വിധവയെ വിവാഹം കഴിച്ച് മരിച്ചവനുവേണ്ടി സന്തതി നിലനിർത്തണമെന്ന ലേവിരേറ്റ് വിവാഹാചാരത്തെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്; ആവർത്തനം 25:5 കാണുക.
    reason: cultural_note
lexical_decisions:
- source_word: παρ’ ἡμῖν
  choice: ഞങ്ങളുടെ ഇടയിൽ
  rationale: παρά + ദത്തിവ് ഇവിടെ കൂട്ടത്തിനുള്ളിലെ സാന്നിധ്യമോ ബന്ധമോ സൂചിപ്പിക്കുന്നു; ‘ഞങ്ങളുടെ ഇടയിൽ’ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളമാണ്.
- source_word: ἑπτὰ ἀδελφοί
  choice: ഏഴ് സഹോദരന്മാർ
  rationale: ലേവിരേറ്റ് വിവാഹസാഹചര്യത്തിൽ ἀδελφοί പുരുഷസഹോദരന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ὁ πρῶτος
  choice: ഒന്നാമൻ
  rationale: πρῶτος പ്രായമല്ല, ഏഴുപേരിലെ ക്രമമാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ‘മൂത്തവൻ’ എന്നു പരിഭാഷപ്പെടുത്തിയില്ല.
- source_word: γήμας
  choice: വിവാഹം കഴിച്ചശേഷം
  rationale: അയോറിസ്റ്റ് പാർട്ടിസിപ്പിൾ മരിക്കുന്നതിനു മുമ്പ് വിവാഹം നടന്നതായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സംഭവക്രമം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἐτελεύτησεν
  choice: മരിച്ചു
  rationale: വാക്കിന്റെ നേരിട്ടുള്ള അർഥം ലളിതവും ഗൗരവമുള്ളതുമായി നൽകുന്നു.
- source_word: μὴ ἔχων σπέρμα
  choice: സന്തതി ഇല്ലാതിരുന്നതിനാൽ
  rationale: σπέρμα അക്ഷരാർഥത്തിൽ ‘വിത്ത്’ ആണെങ്കിലും ഈ കുടുംബ-നിയമ പശ്ചാത്തലത്തിൽ സന്തതിയെയാണ് സൂചിപ്പിക്കുന്നത്; കാരണബന്ധവും ഗ്രീക്ക് ഘടനയിൽ വ്യക്തമാണ്.
- source_word: ἀφῆκεν τὴν γυναῖκα αὐτοῦ
  choice: തന്റെ ഭാര്യയെ ... വിട്ടുകൊടുത്തു
  rationale: ഇവിടെ ἀφίημι മരണാനന്തരം ഭാര്യയെ ശേഷിക്കുന്ന സഹോദരനായി വിട്ടുപോകുന്നതാണ്; ഉപേക്ഷിക്കുകയോ വിവാഹമോചനം നൽകുകയോ എന്ന അർഥമല്ല. ദത്തിവിനോടൊപ്പം ‘വിട്ടുകൊടുത്തു’ മലയാളത്തിൽ ലക്ഷ്യസ്വീകർത്താവിനെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: സഹോദരന്
  rationale: ദത്തിവ് വിധവയെ ആർക്കാണ് വിട്ടത് എന്നു സൂചിപ്പിക്കുന്നു; മൂലപാഠത്തിലുള്ള ഏകവചനവും ബന്ധവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ലേവിരേറ്റ് വിവാഹത്തിന്റെ ഉദ്ദേശ്യം മുഖ്യവാക്യത്തിൽ വ്യക്തമാക്കണമോ
  choice: ഗ്രീക്കിൽ ഉള്ളതുപോലെ സൂചനയായി മാത്രം നിലനിർത്തി, വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
  alternative: ‘തന്റെ സഹോദരൻ വിവാഹം കഴിക്കേണ്ടതിന് ഭാര്യയെ വിട്ടുകൊടുത്തു’ എന്ന് വികസിപ്പിക്കുക.
  rationale: ആവർത്തനം 25:5-ലെ ആചാരം പശ്ചാത്തലത്തിൽ അനുമാനിക്കപ്പെടുന്നുവെങ്കിലും ‘വിവാഹം കഴിക്കാൻ’ എന്ന് ഈ വാക്യത്തിലെ ഗ്രീക്ക് വ്യക്തമായി പറയുന്നില്ല; അതിനാൽ മുഖ്യപാഠത്തിൽ ചേർക്കുന്നത് ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. ‘സന്തതി’ നിയമ-വംശപരമായ ആശയം കൃത്യമായി നൽകുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട മുഖ്യപാഠഭാഗങ്ങളിൽ ചേർത്തിരിക്കുന്നു.
