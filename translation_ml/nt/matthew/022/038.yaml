  text: αὕτη ἐστὶν ⸂ἡ μεγάλη καὶ πρώτη⸃ ἐντολή.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/038.yaml
  text: This is the great and first commandment[a].
translation:
  language: ml
  text: ഇതാണ് മഹത്തായതും ഒന്നാമത്തേതുമായ കല്പന.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “ഇതാണ് മുഖ്യകല്പന.” ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ രണ്ടു വിശേഷണങ്ങളുണ്ട്: “മഹത്തായതും ഒന്നാമത്തേതുമായ കല്പന.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη
  choice: ഇതാണ്
  rationale: മുൻവാക്യത്തിൽ ഉദ്ധരിച്ച കല്പനയിലേക്കാണ് ഈ സൂചകസർവനാമം വിരൽചൂണ്ടുന്നത്; മലയാളത്തിൽ ‘ഇതാണ്’ സ്വാഭാവികമായി ആ അന്വയാർഥം നിലനിർത്തുന്നു.
- source_word: ἐστὶν
  choice: ആണ്
  rationale: വർത്തമാനകാലത്തിലെ ലളിതമായ സംയോജകക്രിയ മലയാളത്തിൽ നേരിട്ട് ‘ആണ്’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: μεγάλη
  choice: മഹത്തും
  rationale: ഇവിടെ വലുപ്പമല്ല, പ്രാധാന്യവും ഉന്നതസ്ഥാനവുമാണ് സൂചിപ്പിക്കുന്നത്. മൂലത്തിലെ സാധാരണതര രൂപം നിലനിർത്താൻ ‘ഏറ്റവും മഹത്തായ’ എന്ന അതിശയോക്തിരൂപം ഒഴിവാക്കി.
- source_word: πρώτη
  choice: ഒന്നാമത്തേതുമായ
  rationale: ക്രമത്തിലോ സ്ഥാനത്തിലോ ഒന്നാമത്തേത് എന്ന അർഥം നേരിട്ട് നൽകുകയും μεγάλη എന്ന വിശേഷണത്തിൽനിന്ന് ഇതിനെ വേറിട്ട് നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐντολή
  choice: കല്പന
  rationale: തിരുവെഴുത്തിന്റെയും യെഹൂദനിയമത്തിന്റെയും പശ്ചാത്തലത്തിൽ ἐντολή എന്നതിന് സ്വാഭാവികവും മാന്യവുമായ മലയാള പദമാണ് ‘കല്പന’.
theological_decisions:
- issue: μεγάλη, πρώτη എന്നീ രണ്ടു വിശേഷണങ്ങളും കല്പനയെ വിവരിക്കുന്ന വിധം
  choice: 'രണ്ടും ഏകോപിതമായി നിലനിർത്തി: ‘മഹത്തും ഒന്നാമത്തേതുമായ കല്പന.’'
  alternative: ‘ഏറ്റവും പ്രധാനമായ കല്പന’ അല്ലെങ്കിൽ ‘മുഖ്യകല്പന.’
  rationale: ഗ്രീക്കിൽ μεγάλη, πρώτη എന്നീ രണ്ടു സാധാരണതര വിശേഷണങ്ങളുണ്ട്. അവയെ ഒറ്റ അതിശയോക്തിയിലേക്കോ ‘മുഖ്യം’ എന്ന ഏക ആശയത്തിലേക്കോ ചുരുക്കാതെ പരിഭാഷപ്പെടുത്തുന്നത് മഹത്ത്വവും പ്രഥമസ്ഥാനവും തമ്മിലുള്ള വാചകഭേദം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ തിരുവെഴുത്തുശൈലി. ‘മഹത്തും ഒന്നാമത്തേതുമായ’ എന്ന ഘടന മൂലത്തിലെ രണ്ടു വിശേഷണങ്ങളും വ്യക്തമാക്കുന്നു; അടിക്കുറിപ്പ് കൂടുതൽ സുഗമമായ വ്യാഖ്യാനപരമായ ബദൽ നൽകുന്നു.
