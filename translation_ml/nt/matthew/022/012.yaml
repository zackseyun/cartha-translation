id: MAT.22.12
reference: Matthew 22:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Ἑταῖρε, πῶς εἰσῆλθες ὧδε μὴ ἔχων ἔνδυμα γάμου; ὁ δὲ ἐφιμώθη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/012.yaml
  text: And he says to him[a], ‘Friend, how did you come in here without a wedding garment?’ But he was speechless.
translation:
  language: ml
  text: 'അവൻ അവനോടു ചോദിച്ചു: “സുഹൃത്തേ, വിവാഹവസ്ത്രമില്ലാതെ നീ എങ്ങനെ ഇവിടെ അകത്തു വന്നു?” എന്നാൽ അവന് ഉത്തരം പറയാനായില്ല.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുസൃതമായി: “അവൻ നിശ്ശബ്ദനാക്കപ്പെട്ടു.” ഗ്രീക്ക് ക്രിയയ്ക്ക് “വായടയ്ക്കപ്പെട്ടു” എന്നും അർഥമാകാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑταῖρε
  choice: സുഹൃത്തേ
  rationale: നേരിട്ടുള്ള സംബോധനയായി സ്വാഭാവികമാണ്; പുറമേ മര്യാദയുള്ളതും സന്ദർഭത്തിൽ അകലം കലർന്ന ശാസനാസ്വരം സൂചിപ്പിക്കുന്നതുമായ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സംഘർഷം അമിതമാക്കാതെ നിലനിർത്തുന്നു.
- source_word: πῶς
  choice: എങ്ങനെ
  rationale: കാരണമല്ല, പ്രവേശനം എങ്ങനെ സാധിച്ചു എന്ന രീതിയോ മാർഗമോ ചോദിക്കുന്ന ഗ്രീക്ക് ക്രിയാവിശേഷണത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: εἰσῆλθες ὧδε
  choice: നീ എങ്ങനെ ഇവിടെ അകത്തു വന്നു
  rationale: പൂർത്തിയായ പ്രവേശനപ്രവൃത്തിയെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; ὧδε എന്ന സ്ഥലസൂചനയും നിലനിർത്തുന്നു.
- source_word: μὴ ἔχων
  choice: ധരിക്കാതെ
  rationale: വസ്ത്രം കൈവശമില്ലെന്നതിലുപരി പ്രസക്തമായത് അത് അണിഞ്ഞിട്ടില്ലെന്ന സാഹചര്യമാണ്; മലയാളത്തിൽ സ്വാഭാവികമായി ആ അർഥം നൽകുന്നു.
- source_word: ἔνδυμα γάμου
  choice: വിവാഹവസ്ത്രം
  rationale: വിവാഹവുമായി ബന്ധപ്പെട്ട ഏകവചന വസ്ത്രത്തെ പൊതുവായി സൂചിപ്പിക്കുന്നു; മേലങ്കി, അങ്കി തുടങ്ങിയ പ്രത്യേക വസ്ത്രരൂപം അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: ἐφιμώθη
  choice: അവന് ഉത്തരം പറയാനായില്ല
  rationale: ഈ സന്ദർഭത്തിൽ ആ മനുഷ്യൻ മറുപടി പറയാൻ കഴിയാതെ നിശ്ശബ്ദനായ ഫലത്തെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘വായടപ്പിക്കപ്പെട്ടു/നിശ്ശബ്ദനാക്കപ്പെട്ടു’ എന്ന കൂടുതൽ രൂപസമീപമായ അർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: യോഗ്യമല്ലാത്ത വസ്ത്രം ധരിച്ച അതിഥിയോടുള്ള ആതിഥേയന്റെ സംബോധനയുടെ സ്വരം
  choice: മര്യാദയുള്ളതെങ്കിലും പരോക്ഷമായി ശാസിക്കുന്ന “സുഹൃത്തേ”
  alternative: “കൂട്ടുകാരാ” അല്ലെങ്കിൽ കൂടുതൽ പരുഷമായ സംബോധന
  rationale: വാക്യം സൗഹൃദമോ അവജ്ഞയോ അതിരുകടന്ന് ഉറപ്പിക്കുന്നില്ല; ഗ്രീക്ക് സംബോധനയിലെ പുറമേയുള്ള മര്യാദയും സന്ദർഭത്തിലെ ന്യായവിധിസ്വരവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- issue: ἐφιμώθη എന്ന ക്രിയയുടെ വിവർത്തനം
  choice: ഫലകേന്ദ്രിതമായി “അവന് ഉത്തരം പറയാനായില്ല”
  alternative: “അവൻ നിശ്ശബ്ദനാക്കപ്പെട്ടു” അല്ലെങ്കിൽ “അവന്റെ വായടപ്പിക്കപ്പെട്ടു”
  rationale: കഥാസന്ദർഭത്തിലെ അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; അതേസമയം ക്രിയയുടെ കർമണിപ്രയോഗവും ‘വായടയ്ക്കുക’ എന്ന ദൃശ്യമായ അടിസ്ഥാനാർഥവും അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. “ചോദിച്ചു” എന്നത് λέγει എന്ന ചരിത്രവർത്തമാനത്തെ മലയാളത്തിലെ സ്വാഭാവിക ഭൂതകാല ആഖ്യാനമായി നൽകുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട അവസാന വാക്യത്തിനു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
