id: MAT.22.16
reference: Matthew 22:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀποστέλλουσιν αὐτῷ τοὺς μαθητὰς αὐτῶν μετὰ τῶν Ἡρῳδιανῶν ⸀λέγοντες· Διδάσκαλε, οἴδαμεν ὅτι ἀληθὴς εἶ καὶ τὴν ὁδὸν τοῦ θεοῦ ἐν ἀληθείᾳ διδάσκεις, καὶ οὐ μέλει σοι περὶ οὐδενός, οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/016.yaml
  text: And they send to him their disciples along with the Herodians[a], saying, “Teacher, we know that you are true and teach the way of God in truth, and you do not care about anyone[b], for you do not look at the face of men.”
translation:
  language: ml
  text: 'അവർ ഹെരോദാപക്ഷക്കാരോടൊപ്പം[a] തങ്ങളുടെ ശിഷ്യന്മാരെ യേശുവിന്റെ അടുക്കൽ അയയ്ക്കുന്നു; അവർ ഇങ്ങനെ പറയുന്നു: “ഗുരോ, അങ്ങ് സത്യസന്ധനാണെന്നും ദൈവത്തിന്റെ വഴി സത്യമായി പഠിപ്പിക്കുന്നുവെന്നും ഞങ്ങൾക്കറിയാം. അങ്ങ് ആരുടെയും സ്വാധീനത്തിന് വഴങ്ങുന്നില്ല; കാരണം അങ്ങ് മനുഷ്യരുടെ മുഖം നോക്കുന്നില്ല[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഹെരോദാപക്ഷക്കാർ” എന്നത് ഹെരോദാവിന്റെ ഭരണകുടുംബവുമായി ബന്ധപ്പെട്ടോ അതിനെ പിന്തുണച്ചോിരുന്ന ഒരു കൂട്ടത്തെ സൂചിപ്പിക്കാം.
    reason: historical_context
  - marker: b
    text: അഥവാ, “അങ്ങ് ആളുകളോട് പക്ഷപാതം കാണിക്കുന്നില്ല” അല്ലെങ്കിൽ “ആളുകളുടെ നിലയും പദവിയും നോക്കി വിധിക്കുന്നില്ല.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστέλλουσιν
  choice: അയയ്ക്കുന്നു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനകാലം നിലനിർത്തുന്നു; മലയാള ആഖ്യാനത്തിലും ഈ രൂപം വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: μαθητὰς
  choice: ശിഷ്യന്മാരെ
  rationale: പഠിതാക്കളെയും അനുയായികളെയും സൂചിപ്പിക്കുന്ന സുവിശേഷസന്ദർഭത്തിലെ പതിവും യോജിച്ചതുമായ പദം.
- source_word: μετὰ τῶν Ἡρῳδιανῶν
  choice: ഹെരോദാപക്ഷക്കാരോടൊപ്പം
  rationale: ഹെരോദാവിന്റെ രാഷ്ട്രീയപക്ഷത്തെ പിന്തുണച്ച കൂട്ടത്തെ മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: Διδάσκαλε
  choice: ഗുരോ
  rationale: നേരിട്ടുള്ള സംബോധനമായി ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമാണ്; അധ്യാപകസ്ഥാനത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: ἀληθὴς εἶ
  choice: അങ്ങ് സത്യസന്ധനാണ്
  rationale: ഇവിടെ വ്യക്തിയുടെ വിശ്വസ്തവും സത്യനിഷ്ഠവുമായ സ്വഭാവത്തെ സൂചിപ്പിക്കുന്ന predicative പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ വഴി
  rationale: ദൈവത്തിന്റെ ഇഷ്ടാനുസൃതമായ ജീവിതമാർഗം എന്ന വിശാലമായ ഉറവിടരൂപകം നിലനിർത്തുന്നു.
- source_word: ἐν ἀληθείᾳ
  choice: സത്യമായി
  rationale: സത്യത്തോടൊത്തും സത്യസന്ധമായും പഠിപ്പിക്കുന്നു എന്ന അർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: οὐ μέλει σοι περὶ οὐδενός
  choice: അങ്ങ് ആരുടെയും സ്വാധീനത്തിന് വഴങ്ങുന്നില്ല
  rationale: ആരോടും കരുതലില്ല എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കി, ആരുടെയും പദവിയോ അഭിപ്രായമോ യേശുവിന്റെ നിലപാടിനെ നിയന്ത്രിക്കുന്നില്ല എന്ന സന്ദർഭാർഥം നൽകുന്നു.
- source_word: οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων
  choice: കാരണം അങ്ങ് മനുഷ്യരുടെ മുഖം നോക്കുന്നില്ല
  rationale: ഗ്രീക്ക് മുഖപ്രയോഗത്തിന്റെ രൂപം കഴിയുന്നത്ര നിലനിർത്തുന്നു; പക്ഷപാതമില്ലായ്മ എന്ന അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: മനുഷ്യരുടെ മുഖം നോക്കുക എന്ന പക്ഷപാതസംബന്ധിയായ പ്രയോഗം
  choice: മുഖപ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തി, പക്ഷപാതമില്ലായ്മ എന്ന അർഥം അടിക്കുറിപ്പിൽ നൽകി.
  alternative: അങ്ങ് ആളുകളോട് പക്ഷപാതം കാണിക്കുന്നില്ല / ആളുകളുടെ നിലയും പദവിയും നോക്കി വിധിക്കുന്നില്ല.
  rationale: ഉറവിടപാഠത്തിന്റെ ദൃശ്യരൂപം സംരക്ഷിക്കുമ്പോഴും അത് വെറും പുറംകാഴ്ചയെക്കുറിച്ചാണെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- issue: οὐ μέλει σοι περὶ οὐδενός എന്ന വാക്യത്തിന്റെ ഭാവം
  choice: ആരുടെയും സ്വാധീനത്തിന് വഴങ്ങുന്നില്ല
  alternative: ആരെയും വകവെക്കുന്നില്ല / ആരെക്കുറിച്ചും അങ്ങേക്ക് കാര്യമില്ല
  rationale: ബദൽ പദാനുപദരൂപങ്ങൾ കരുതലില്ലായ്മ സൂചിപ്പിക്കാം. തുടർന്നുള്ള പക്ഷപാതമില്ലായ്മയുടെ വിശദീകരണത്തോട് യോജിച്ച്, പദവിയോ സമ്മർദമോ സ്വാധീനിക്കാത്തതെന്ന സന്ദർഭാർഥമാണ് തെരഞ്ഞെടുത്തത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായിക്കാൻ എളുപ്പവുമായ ശൈലി. യേശുവിനെ അഭിസംബോധന ചെയ്യുമ്പോൾ “അങ്ങ്” ഉപയോഗിച്ചു. ഗ്രീക്കിലെ ചരിത്രവർത്തമാനകാലവും ‘മുഖം നോക്കുക’ എന്ന ഉറവിടപ്രയോഗവും നിലനിർത്തി; ആശയക്കുഴപ്പം ഉണ്ടാകാവുന്നിടത്ത് അടിക്കുറിപ്പ് ചേർത്തു.
