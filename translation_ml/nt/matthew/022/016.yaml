    rationale: ഈ വാക്യം അവരുടെ കൃത്യമായ രാഷ്ട്രീയഘടനയോ താൽപര്യങ്ങളോ വിശദീകരിക്കുന്നില്ല. ‘ഹെരോദാവിന്റെ രാജവംശത്തെയും അതിന്റെ രാഷ്ട്രീയതാൽപര്യങ്ങളെയും പിന്തുണച്ചിരുന്നവർ’ എന്ന നിർണായക വിവരണത്തിനു പകരം സാധ്യതാസൂചകമായ ചുരുക്കവിവരണം അനുയോജ്യമാണ്.
  revised_text: 'അവർ ഹെരോദാപക്ഷക്കാരോടൊപ്പം[a] തങ്ങളുടെ ശിഷ്യന്മാരെ യേശുവിന്റെ അടുക്കൽ അയയ്ക്കുന്നു; അവർ ഇങ്ങനെ പറയുന്നു: “ഗുരോ, അങ്ങ് സത്യസന്ധനാണെന്നും ദൈവത്തിന്റെ വഴി സത്യമായി പഠിപ്പിക്കുന്നുവെന്നും ഞങ്ങൾക്കറിയാം. അങ്ങ് ആരുടെയും സ്വാധീനത്തിന് വഴങ്ങുന്നില്ല; കാരണം അങ്ങ് മനുഷ്യരുടെ മുഖം നോക്കുന്നില്ല[b].”'
