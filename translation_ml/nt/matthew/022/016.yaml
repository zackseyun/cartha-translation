  source_fidelity: 'മുഖ്യഅർഥം പൊതുവേ കൃത്യമാണ്: അയയ്ക്കുക, ഹെരോദാപക്ഷക്കാർ, ദൈവത്തിന്റെ വഴി, സ്വാധീനിക്കപ്പെടാതിരിക്കുക, ‘മുഖം നോക്കുക’ എന്നീ ഘടകങ്ങൾ എല്ലാം പ്രതിഫലിക്കുന്നു. എന്നാൽ ഗ്രീക്കിലെ വർത്തമാനകാലമായ ἀποστέλλουσιν-നു പിന്നാലെ ‘അവർ പറഞ്ഞു’ എന്ന ഭൂതകാലം വരുന്നത് ആഖ്യാനകാലത്തെ അസമമാക്കുന്നു. λέγοντες അയക്കപ്പെട്ട ശിഷ്യന്മാരെയും ഹെരോദാപക്ഷക്കാരെയും സൂചിപ്പിക്കുന്നതും ‘അവർ ഇങ്ങനെ പറയുന്നു’ എന്ന രൂപത്തിൽ വ്യക്തമായി നിലനിൽക്കും.'
  naturalness: ‘അയയ്ക്കുന്നു; അവർ ഇങ്ങനെ പറയുന്നു’ എന്ന തുടർച്ച ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗ്രീക്കിലെ ചരിത്രവർത്തമാനകാലത്തോടു യോജിച്ചതുമാണ്. ‘ഗുരോ’, ‘അങ്ങ്’, ‘സത്യസന്ധനാണ്’, ‘ആരുടെയും സ്വാധീനത്തിന് വഴങ്ങുന്നില്ല’ എന്നിവ സന്ദർഭത്തിനു ചേർന്ന മാന്യമായ ഭാഷയാണ്.
  terminology: ‘ഹെരോദാപക്ഷക്കാർ’ ഒരു സുരക്ഷിത ലിപ്യന്തരണ/സാമാന്യനാമമാണ്. അടിക്കുറിപ്പിലെ അവരുടെ രാഷ്ട്രീയസ്വഭാവത്തെക്കുറിച്ചുള്ള ഉറപ്പിച്ച വിവരണം ഉറവിടവാക്യം നേരിട്ട് പറയാത്തതും ചരിത്രപരമായി സൂക്ഷ്മത ആവശ്യമായതുമാണ്; അതിനെ സാധ്യതാസൂചകവും പരിമിതവുമായ വിവരണമായി പരിഷ്കരിക്കുന്നു. ‘മനുഷ്യരുടെ മുഖം നോക്കുന്നില്ല’ എന്ന ശാബ്ദിക പ്രയോഗവും അതിന്റെ പക്ഷപാതമില്ലായ്മയെന്ന അർഥം നൽകുന്ന അടിക്കുറിപ്പും ഉചിതമാണ്.
  issues:
