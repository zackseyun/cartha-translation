revisions:
- from: 'അവർ ഹെരോദാപക്ഷക്കാരോടൊപ്പം[a] തങ്ങളുടെ ശിഷ്യന്മാരെ യേശുവിന്റെ അടുക്കൽ അയയ്ക്കുന്നു. അവർ പറഞ്ഞു: “ഗുരോ, അങ്ങ് സത്യസന്ധനാണെന്നും ദൈവത്തിന്റെ വഴി സത്യമായി പഠിപ്പിക്കുന്നുവെന്നും ഞങ്ങൾക്കറിയാം. അങ്ങ് ആരുടെയും സ്വാധീനത്തിന് വഴങ്ങുന്നില്ല; കാരണം അങ്ങ് മനുഷ്യരുടെ മുഖം നോക്കുന്നില്ല[b].”'
  to: 'അവർ ഹെരോദാപക്ഷക്കാരോടൊപ്പം[a] തങ്ങളുടെ ശിഷ്യന്മാരെ യേശുവിന്റെ അടുക്കൽ അയയ്ക്കുന്നു; അവർ ഇങ്ങനെ പറയുന്നു: “ഗുരോ, അങ്ങ് സത്യസന്ധനാണെന്നും ദൈവത്തിന്റെ വഴി സത്യമായി പഠിപ്പിക്കുന്നുവെന്നും ഞങ്ങൾക്കറിയാം. അങ്ങ് ആരുടെയും സ്വാധീനത്തിന് വഴങ്ങുന്നില്ല; കാരണം അങ്ങ് മനുഷ്യരുടെ മുഖം നോക്കുന്നില്ല[b].”'
  rationale: ഗ്രീക്കിലെ രണ്ടു വർത്തമാനരൂപങ്ങളുടെയും ആഖ്യാനചലനം നിലനിർത്താൻ ‘പറഞ്ഞു’ എന്നത് ‘ഇങ്ങനെ പറയുന്നു’ എന്നു മാറ്റി. ഹെരോദാപക്ഷക്കാരുടെ ചരിത്രപരമായ തിരിച്ചറിയൽ വാക്യത്തിൽ വിശദീകരിക്കപ്പെട്ടിട്ടില്ലാത്തതിനാൽ, അടിക്കുറിപ്പ് അവകാശവാദപരമല്ലാതെ സാധ്യതാസൂചകമാക്കി. മറ്റു മുഖ്യപാഠഘടകങ്ങൾ ഉറവിടത്തോടും സ്വാഭാവിക മലയാളപ്രയോഗത്തോടും യോജിക്കുന്നതിനാൽ നിലനിർത്തി.
