  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘എല്ലാവർക്കും ശേഷം’ സംഭവക്രമം വ്യക്തമാക്കുന്നു; ‘ആ സ്ത്രീയും’ δέയുടെ മൃദുവായ തുടർച്ച മലയാളത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളിക്കുന്നു.
