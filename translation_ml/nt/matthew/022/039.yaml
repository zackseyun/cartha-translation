id: MAT.22.39
reference: Matthew 22:39
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Δευτέρα ⸀δὲ ὁμοία ⸀αὐτῇ· Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/039.yaml
  text: 'And a second is like it: You shall love your neighbor as yourself[a].'
translation:
  language: ml
  text: 'രണ്ടാമത്തേതും[a] അതുപോലെയാണ്: ‘നിന്നെപ്പോലെ നിന്റെ അയൽക്കാരനെ സ്നേഹിക്കണം.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ഗ്രീക്കിൽ ‘ഒരു രണ്ടാമത്തേത്’ എന്നും മനസ്സിലാക്കാം.
    reason: ലേഖനമില്ലാത്ത Δευτέρα സന്ദർഭത്തിൽ നിർദ്ദിഷ്ടമായ ‘രണ്ടാമത്തേത്’ എന്നും അനിർദ്ദിഷ്ടമായ ‘ഒരു രണ്ടാമത്തേത്’ എന്നും ഗ്രഹിക്കാവുന്നതാണ്.
lexical_decisions:
- source_word: Δευτέρα
  choice: രണ്ടാമത്തേതും
  rationale: ലേഖനമില്ലാത്ത സ്ത്രീലിംഗ ക്രമവാചക വിശേഷണം നാമമായി ഉപയോഗിച്ചിരിക്കുന്നു; സന്ദർഭത്തിൽ ഇത് രണ്ടാമത്തെ കല്പനയെ സൂചിപ്പിക്കുന്നു. ‘രണ്ടാമത്തേതും’ എന്നത് ക്രമാർഥവും δὲ-യുടെ ബന്ധകഭാവവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: δὲ
  choice: -ഉം
  rationale: ഇവിടെ ശക്തമായ വിരോധമല്ല, മുൻവാക്യത്തോടു ചേർത്ത് ആശയം മുന്നോട്ടുകൊണ്ടുപോകുന്ന മൃദുവായ ബന്ധകമാണ്; മലയാളത്തിൽ ‘-ഉം’ സ്വാഭാവികമാണ്.
- source_word: ὁμοία αὐτῇ
  choice: അതിനോടു സമമാണ്
  rationale: ദാതിവോടുകൂടിയ ὁμοία മുൻപറഞ്ഞ ആദ്യകല്പനയോടുള്ള സാമ്യം സൂചിപ്പിക്കുന്നു. ‘സമമാണ്’ പ്രാധാന്യത്തിലെ ബന്ധം അധികമായി വിശദീകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: Ἀγαπήσεις
  choice: സ്നേഹിക്കണം
  rationale: കല്പന ഉദ്ധരിക്കുമ്പോൾ ഭാവികാല നിർദേശരൂപത്തിന് ആജ്ഞാത്മക ബലമുണ്ട്. ആധുനിക മലയാളത്തിൽ ‘സ്നേഹിക്കണം’ ആ കല്പനാഭാവം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: τὸν πλησίον σου
  choice: നിന്റെ അയൽക്കാരനെ
  rationale: ഈ സ്ഥിരപ്രയോഗത്തിൽ πλησίον വെറും സമീപത്തുള്ള വ്യക്തിയെയല്ല, ‘അയൽക്കാരൻ’ എന്ന ബന്ധപരമായ അർഥത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ὡς σεαυτόν
  choice: നിന്നെപ്പോലെ
  rationale: ὡς താരതമ്യത്തിന്റെ മാനദണ്ഡവും σεαυτόν കർത്താവിലേക്കു മടങ്ങുന്ന ആത്മവാചക സർവനാമവും ആണ്; ‘നിന്നെപ്പോലെ’ മലയാളത്തിലെ നേരിട്ടും സ്വാഭാവികവുമായ തുല്യപ്രയോഗമാണ്.
theological_decisions:
- issue: രണ്ടാമത്തെ കല്പനയും ആദ്യത്തെ കല്പനയും തമ്മിലുള്ള ബന്ധം
  choice: രണ്ടാമത്തേതും അതിനോടു സമമാണ്
  alternative: ഒരു രണ്ടാമത്തെ കല്പനയും അതിനോടു സമമാണ്
  rationale: ഗ്രീക്ക് രൂപം ‘ഒരു രണ്ടാമത്തേത്’ എന്നും ‘രണ്ടാമത്തേത്’ എന്നും മനസ്സിലാക്കാവുന്നതാണ്. സന്ദർഭത്തിൽ ക്രമത്തിൽ രണ്ടാമത്തെ കല്പനയെയാണ് ഉദ്ദേശിക്കുന്നത്; ‘സമമാണ്’ എന്നു വിവർത്തനം ചെയ്യുന്നത് രണ്ടിനെയും ഒന്നാക്കാതെയും അവയുടെ സാമ്യത്തെ അധികമായി വ്യാഖ്യാനിക്കാതെയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ തിരുവെഴുത്ത് ഉദ്ധരണിക്കു യോജിച്ച ഗൗരവമുള്ള മലയാളം. ലേവ്യപുസ്തകം 19:18-ലെ കല്പനാഭാവം ‘സ്നേഹിക്കണം’ എന്ന സ്വാഭാവിക മലയാളരൂപത്തിൽ നൽകിയിരിക്കുന്നു.
