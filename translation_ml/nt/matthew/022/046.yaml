id: MAT.22.46
reference: Matthew 22:46
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ οὐδεὶς ἐδύνατο ⸂ἀποκριθῆναι αὐτῷ⸃ λόγον, οὐδὲ ἐτόλμησέν τις ἀπ’ ἐκείνης τῆς ἡμέρας ἐπερωτῆσαι αὐτὸν οὐκέτι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/046.yaml
  text: And no one was able to answer him a word[a], nor did anyone dare from that day on to question him any longer.
translation:
  language: ml
  text: അവനോട് ഒരു വാക്കുപോലും മറുപടി പറയാൻ ആർക്കും കഴിഞ്ഞില്ല; അന്നുമുതൽ അവനോട് ചോദ്യങ്ങൾ ചോദിക്കാൻ ആരും പിന്നെ ധൈര്യപ്പെട്ടില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδεὶς
  choice: ആർക്കും ... ഇല്ല
  rationale: ഒരാൾക്കും സാധിച്ചില്ല എന്ന സമ്പൂർണ നിഷേധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐδύνατο
  choice: കഴിഞ്ഞില്ല
  rationale: ഭൂതകാലത്തിലെ അസാമർഥ്യം മലയാളത്തിൽ നേരിട്ടും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀποκριθῆναι αὐτῷ λόγον
  choice: അവനോട് ഒരു വാക്കുപോലും മറുപടി പറയാൻ
  rationale: λόγον എന്ന പദത്തിന്റെ സാന്നിധ്യം നിലനിർത്തുന്നതിനൊപ്പം, ഒരു മറുപടിയും പറയാനായില്ല എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: οὐδὲ
  choice: '...തുമില്ല'
  rationale: ആദ്യ നിഷേധത്തോട് രണ്ടാമത്തെ നിഷേധത്തെ അടുത്ത് ബന്ധിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള ഘടനയാണ്.
- source_word: ἐτόλμησέν τις
  choice: ആരും ധൈര്യപ്പെട്ടതുമില്ല
  rationale: τολμάω സൂചിപ്പിക്കുന്ന ധൈര്യപ്പെടുക അഥവാ തുനിയുക എന്ന ആശയം നേരിട്ട് നൽകുന്നു.
- source_word: ἀπ’ ἐκείνης τῆς ἡμέρας
  choice: അന്നുമുതൽ
  rationale: ആ ദിവസം ആരംഭബിന്ദുവായുള്ള തുടർച്ചയെ ചുരുക്കമായും വ്യക്തമായും അറിയിക്കുന്നു.
- source_word: ἐπερωτῆσαι
  choice: ചോദ്യങ്ങൾ ചോദിക്കാൻ
  rationale: സന്ദർഭത്തിലെ ചോദ്യംചെയ്യലിനെ വ്യക്തമാക്കുന്നു; 'ചോദ്യം ചെയ്യുക' എന്ന പ്രയോഗത്തിന് മലയാളത്തിൽ ഉണ്ടാകാവുന്ന ചോദ്യംചെയ്ത് വിചാരണ ചെയ്യുക എന്ന അതിശക്തമായ ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: οὐκέτι
  choice: കൂടുതലായി
  rationale: അന്നുമുതൽ ചോദ്യംചെയ്യൽ തുടർന്നില്ല എന്ന cessation അർഥം സന്ദർഭസഹിതം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ മറുപടിക്കുശേഷമുള്ള എതിരാളികളുടെ മൗനത്തിന്റെ ആഖ്യാനബലം
  choice: അവർക്ക് മറുപടി പറയാൻ കഴിഞ്ഞില്ലെന്നും തുടർന്ന് ചോദിക്കാൻ ധൈര്യപ്പെട്ടില്ലെന്നും മാത്രം ചരിത്രവിവരണമായി പരിഭാഷപ്പെടുത്തി.
  alternative: യേശുവിന്റെ ജ്ഞാനമോ അധികാരമോ മേന്മയോ വിവർത്തനത്തിൽ തന്നെ വിശദമായി ഊന്നിപ്പറയുക.
  rationale: സന്ദർഭം യേശുവിന്റെ വാദവിജയം സൂചിപ്പിക്കുന്നുണ്ടെങ്കിലും, ഈ വാക്യം നേരിട്ട് പറയുന്നതിലപ്പുറം ഒരു ദൈവശാസ്ത്ര വിശദീകരണം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്ക് പദക്രമത്തിന്റെ അസ്വാഭാവികത പകർത്താതെ, 'ഒരു വാക്കുപോലും' എന്ന പ്രയോഗത്തിലൂടെ λόγον ഉൾക്കൊള്ളുന്ന ഊന്നൽ സംരക്ഷിച്ചു. അടിക്കുറിപ്പ് ആവശ്യമായ യഥാർത്ഥ പാഠഭേദമോ നിർണായകമായ അസ്പഷ്ടതയോ ഇവിടെ ഇല്ല.
