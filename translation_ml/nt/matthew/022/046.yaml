    issue: «കൂടുതലായി» is used for οὐκέτι.
    rationale: «കൂടുതലായി» ordinarily means “more” or “in greater measure,” whereas οὐκέτι states that, from that day onward, no one dared question him any longer. «പിന്നെ» preserves this cessation without adding interpretation.
