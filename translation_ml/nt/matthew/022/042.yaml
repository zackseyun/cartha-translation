id: MAT.22.42
reference: Matthew 22:42
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγων· Τί ὑμῖν δοκεῖ περὶ τοῦ χριστοῦ; τίνος υἱός ἐστιν; λέγουσιν αὐτῷ· Τοῦ Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/042.yaml
  text: saying[a], “What do you think about the Messiah? Whose son is he?” They said to him, “David’s.”
translation:
  language: ml
  text: 'അവൻ ചോദിച്ചു: “മശീഹാ[a]യെക്കുറിച്ച് നിങ്ങൾക്ക് എന്തു തോന്നുന്നു? അവൻ ആരുടെ മകനാണ്?” അവർ അവനോട്, “ദാവീദിന്റെ മകൻ” എന്നു പറഞ്ഞു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ക്രിസ്തു.” ഗ്രീക്കിലെ Χριστός (Christos) എന്ന പദം ഇവിടെ മശീഹാ എന്ന അർഥത്തിലാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: അവൻ ചോദിച്ചു
  rationale: λέγων എന്ന വർത്തമാന കൃദന്തം യേശുവിന്റെ വാക്കുകൾ അവതരിപ്പിക്കുന്നു; ഇവിടെ വാക്യങ്ങൾ ചോദ്യങ്ങളായതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ‘അവൻ ചോദിച്ചു’ എന്നു നൽകി.
- source_word: Τί ὑμῖν δοκεῖ
  choice: നിങ്ങൾക്ക് എന്തു തോന്നുന്നു
  rationale: δοκέω ദത്തിവിനോടൊപ്പം ഒരാളുടെ വിലയിരുത്തലോ അഭിപ്രായമോ ചോദിക്കുന്നു; ഈ പ്രയോഗം അതിനെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: περὶ τοῦ χριστοῦ
  choice: മശീഹയെക്കുറിച്ച്
  rationale: Χριστός ഇവിടെ വ്യക്തിനാമമായല്ല, യഹൂദ മശീഹാപദവിയായാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; അതിനാൽ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: τίνος υἱός ἐστιν
  choice: അവൻ ആരുടെ മകനാണ്
  rationale: υἱός വംശപരമ്പരയെയും പുത്രബന്ധത്തെയും സൂചിപ്പിക്കുന്നു; ‘അവൻ’ എന്നത് മശീഹയെ തിരിച്ചുസൂചിപ്പിക്കുന്നു.
- source_word: λέγουσιν αὐτῷ
  choice: അവർ അവനോട് ... എന്നു പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനം മലയാള കഥനത്തിൽ സ്വാഭാവികമായ ഭൂതകാലമായി നൽകി; αὐτῷ ‘അവനോട്’ എന്നു സംരക്ഷിച്ചു.
- source_word: Τοῦ Δαυίδ
  choice: ദാവീദിന്റെ മകൻ
  rationale: ഗ്രീക്കിൽ ചോദ്യത്തിൽനിന്ന് ‘മകൻ’ എന്ന നാമം മനസ്സിലാക്കേണ്ട സംക്ഷിപ്ത ഉത്തരം മാത്രമാണുള്ളത്. ‘ദാവീദിന്റെ’ എന്നു മാത്രം പറയുന്നത് മലയാളത്തിൽ അപൂർണ്ണമായി തോന്നുന്നതിനാൽ സൂചിത നാമം വ്യക്തമാക്കി.
theological_decisions:
- issue: Χριστός എന്ന പദവിയുടെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഈ സന്ദർഭത്തിൽ Χριστός യഹൂദരുടെ പ്രതീക്ഷിത അഭിഷിക്തനെക്കുറിച്ചുള്ള പദവിയാണ്; അതിനാൽ പേരുപോലെ തോന്നാവുന്ന ‘ക്രിസ്തു’ എന്നതിനു പകരം ‘മശീഹ’ തിരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മൂലത്തിലെ ചോദ്യം–ഉത്തരം ഘടനയും വംശപരമ്പരയെക്കുറിച്ചുള്ള ആശയവും നിലനിർത്തി.
