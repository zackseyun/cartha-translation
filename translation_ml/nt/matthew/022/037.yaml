reference: Matthew 22:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ ἔφη αὐτῷ· Ἀγαπήσεις κύριον τὸν θεόν σου ἐν ὅλῃ ⸀τῇ καρδίᾳ σου καὶ ἐν ὅλῃ ⸁τῇ ψυχῇ σου καὶ ἐν ὅλῃ τῇ διανοίᾳ σου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/037.yaml
  text: And he said to him[c][b][a], “You shall love the Lord your God with all your heart and with all your soul and with all your mind.”
translation:
  language: ml
  text: 'അവൻ അവനോടു പറഞ്ഞു: “നിന്റെ ദൈവമായ കർത്താവിനെ നിന്റെ പൂർണഹൃദയത്തോടും പൂർണപ്രാണനോടും[a] പൂർണമനസ്സോടുംകൂടെ[b] സ്നേഹിക്കണം.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പ്രാണൻ’ എന്നു പരിഭാഷപ്പെടുത്തിയ ψυχή എന്ന പദത്തിന് സന്ദർഭമനുസരിച്ച് ‘ജീവൻ’ അല്ലെങ്കിൽ ‘സ്വയം’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: ‘മനസ്സ്’ എന്നു പരിഭാഷപ്പെടുത്തിയ διάνοια എന്ന പദം ‘ഗ്രഹണശക്തി’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: ഇവിടെ ‘-ത്തോടുംകൂടെ’ എന്നു നൽകിയിരിക്കുന്ന ഗ്രീക്ക് ἐν എന്ന പദത്തിന്റെ അടിസ്ഥാനാർഥം ‘-ൽ’ എന്നാണ്; അതിനാൽ ‘നിന്റെ പൂർണഹൃദയത്തിൽ ... പൂർണപ്രാണനിൽ ... പൂർണമനസ്സിൽ’ എന്നും പദാനുപദമായി നൽകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: അവൻ
  rationale: ഇവിടെ δέ സംഭാഷണം മുന്നോട്ടുകൊണ്ടുപോകുന്ന മൃദുവായ ബന്ധകമാണ്. മലയാളത്തിൽ പ്രത്യേകം ‘എന്നാൽ/അപ്പോൾ’ ചേർക്കാതെ വാക്യം സ്വാഭാവികമായി ആരംഭിക്കുന്നത് അർഥം നിലനിർത്തുന്നു.
- source_word: ἔφη αὐτῷ
  choice: അവൻ അവനോടു പറഞ്ഞു
  rationale: φημί നേരിട്ടുള്ള വാക്കുകളെ പരിചയപ്പെടുത്തുന്നു; ‘മറുപടി പറഞ്ഞു’ എന്നു വിവർത്തനം ചെയ്താൽ ക്രിയയിൽ വ്യക്തമല്ലാത്ത മറുപടിയുടെ ഭാവം ചേർന്നേക്കാം.
- source_word: Ἀγαπήσεις
  choice: സ്നേഹിക്കണം
  rationale: ഭാവികാല നിർദേശരൂപം ഇവിടെ ആവർത്തനപുസ്തകത്തിലെ കല്പന ഉദ്ധരിച്ച് ആജ്ഞാർത്ഥത്തിൽ പ്രവർത്തിക്കുന്നു. ആധുനിക മലയാളത്തിൽ ‘സ്നേഹിക്കണം’ കല്പനയുടെ ബലം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: κύριον τὸν θεόν σου
  choice: നിന്റെ ദൈവമായ കർത്താവിനെ
  rationale: ഉടമസ്ഥബന്ധവും ‘കർത്താവ്—നിന്റെ ദൈവം’ എന്ന ഉടമ്പടിസംബന്ധിയായ ആശയവും വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐν ὅλῃ τῇ καρδίᾳ σου
  choice: നിന്റെ പൂർണഹൃദയത്തോടും ... കൂടെ
  rationale: ἐν എന്നതിന്റെ പദാനുപദ രൂപം ‘ൽ’ ആണെങ്കിലും, സമഗ്രമായ സമർപ്പണത്തിന്റെ ഉപാധി/വ്യാപ്തി സൂചിപ്പിക്കുന്ന ഈ പ്രയോഗത്തിൽ ‘-ത്തോടുകൂടെ’ മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: ψυχῇ
  choice: പ്രാണൻ
  rationale: ψυχή ജീവൻ, സ്വയം, പ്രാണൻ എന്നീ അർഥങ്ങൾ വഹിക്കാം. ഇവിടെ ‘പ്രാണൻ’ സമ്പൂർണ ജീവസ്വത്വത്തെ സൂചിപ്പിക്കുന്നതോടൊപ്പം ഘടകങ്ങളുടെ വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: διανοίᾳ
  choice: മനസ്സ്
  rationale: διάνοια ചിന്തയുടെയും ഗ്രഹണത്തിന്റെയും ശേഷിയെ സൂചിപ്പിക്കുന്നു. ‘മനസ്സ്’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വിശാലവുമാണ്; ‘ഗ്രാഹ്യശക്തി’ ഒരു സാധ്യമായ പകരമാണ്.
theological_decisions:
- issue: ആവർത്തനപുസ്തക ഉദ്ധരണിയിലെ ഹൃദയം—പ്രാണൻ—മനസ്സ് എന്ന ത്രയം
  choice: മൂന്ന് പദങ്ങളും വേർതിരിച്ച് നിലനിർത്തുക
  alternative: അവയെ ‘നിന്റെ മുഴുവൻ അസ്തിത്വത്തോടും’ എന്ന ഒറ്റ പരാവർത്തനമായി ചേർക്കുക
  rationale: ഗ്രീക്ക് പാഠം καρδία, ψυχή, διάνοια എന്നീ വ്യത്യസ്ത പദങ്ങൾ ഉപയോഗിക്കുന്നു. അവയെ വേർതിരിക്കുന്നത് ഉദ്ധരണിയുടെ രൂപവും സമഗ്രസ്നേഹത്തിനുള്ള ആഹ്വാനവും നിലനിർത്തുന്നു; അവ മനുഷ്യന്റെ കർശനമായി വിഭജിക്കപ്പെട്ട മൂന്നു ഘടകങ്ങളാണെന്ന സിദ്ധാന്തം വിവർത്തനം അടിച്ചേൽപ്പിക്കുന്നില്ല.
- issue: Ἀγαπήσεις എന്ന ഭാവികാലരൂപത്തിന്റെ കല്പനാബലം
  choice: ‘സ്നേഹിക്കണം’
  alternative: ‘നീ സ്നേഹിക്കും’
  rationale: ഉദ്ധരണിസന്ദർഭത്തിൽ ഈ ഭാവികാലരൂപം കല്പനയായി പ്രവർത്തിക്കുന്നു. വെറും പ്രവചനമായി വായിക്കപ്പെടാതിരിക്കാൻ മലയാളത്തിൽ നിർബന്ധാർത്ഥം വ്യക്തമാക്കുന്നു.
- issue: κύριος എന്ന ദൈവനാമസംബന്ധിയായ അഭിസംബോധന
  choice: കർത്താവ്
  alternative: നാഥൻ
  rationale: ‘കർത്താവ്’ മലയാളത്തിലെ മാന്യവും സ്ഥിരവുമായ സമാനപദമാണ്; ഉദ്ധരണിയുടെ ഉടമ്പടിസംബന്ധിയായ പ്രതിധ്വനി നിലനിർത്തുന്നു, അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. തിരുവെഴുത്ത് ഉദ്ധരണിയുടെ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് പഴഞ്ചൻ ഭാവികാല കല്പനാരൂപം ഒഴിവാക്കി സ്വാഭാവികമായ ‘സ്നേഹിക്കണം’ ഉപയോഗിച്ചു. ‘പൂർണ-’ എന്ന ആവർത്തനം ഗ്രീക്കിലെ ὅλῃ എന്ന ഊന്നൽ ഓരോ ഘടകത്തിലും നിലനിർത്തുന്നു.
