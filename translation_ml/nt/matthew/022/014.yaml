  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πολλοὶ γάρ εἰσιν κλητοὶ ὀλίγοι δὲ ἐκλεκτοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/014.yaml
  text: For many are called[b][a], but few are chosen.
translation:
  language: ml
  text: എന്തെന്നാൽ, വിളിക്കപ്പെട്ടവർ അനേകർ; തിരഞ്ഞെടുക്കപ്പെട്ടവരോ ചുരുക്കം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλοὶ
  choice: അനേകർ
  rationale: നാമപദമായി പ്രവർത്തിക്കുന്ന ബഹുവചന വിശേഷണത്തിന്റെ സംക്ഷിപ്തവും മാന്യവുമായ പരിഭാഷ; ὀλίγοι എന്നതുമായ വൈരുധ്യം നിലനിർത്തുന്നു.
- source_word: γάρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിന് വിശദീകരണപരമായ അടിസ്ഥാനം നൽകുന്ന ബന്ധകശക്തി സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: εἰσιν
  choice: (മലയാള വാക്യഘടനയിൽ അധ്യാഹരിതം)
  rationale: ഗ്രീക്കിലെ ‘ആകുന്നു/ആണ്’ എന്ന വർത്തമാനകാല ക്രിയ മലയാളത്തിലെ നാമികവാക്യത്തിൽ പ്രത്യേകം എഴുതാതെയും വ്യക്തമായി ഗ്രഹിക്കപ്പെടുന്നു; ഇതിലൂടെ ചൊല്ലിന്റെ സംക്ഷിപ്തത നിലനിൽക്കുന്നു.
- source_word: κλητοὶ
  choice: വിളിക്കപ്പെട്ടവർ
  rationale: ‘വിളിക്കപ്പെട്ടവർ’ എന്നത് പദത്തിന്റെ വിശാലമായ അർത്ഥവ്യാപ്തിയും ἐκλεκτοί എന്നതുമായ പ്രസിദ്ധമായ വൈരുധ്യവും നിലനിർത്തുന്നു; വിരുന്നിലേക്കു ‘ക്ഷണിക്കപ്പെട്ടവർ’ എന്ന സന്ദർഭോചിത അർത്ഥം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: ὀλίγοι
  choice: ചുരുക്കം
  rationale: അനേകർ എന്നതിനോടുള്ള നേരിട്ടുള്ള വൈരുധ്യം സ്വാഭാവികവും ചൊല്ലുപോലെയുള്ളതുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: രണ്ടു വിഭാഗങ്ങൾക്കിടയിലെ വ്യക്തമായ വൈരുധ്യം പ്രകടമാക്കുന്നു.
- source_word: ἐκλεκτοί
  choice: തിരഞ്ഞെടുക്കപ്പെട്ടവർ
  rationale: ഗ്രീക്കിലെ അടിസ്ഥാന അർത്ഥം സുതാര്യമായി നൽകുന്നു; പിൽക്കാല സിദ്ധാന്തപരമായ സാങ്കേതികപദം മുഖ്യവാചകത്തിലേക്ക് നിർബന്ധമായി ഇറക്കുമതി ചെയ്യുന്നില്ല.
theological_decisions:
- issue: വിളിയും തിരഞ്ഞെടുപ്പും സംബന്ധിച്ച തർക്കങ്ങളിൽ ഉപയോഗിക്കപ്പെടുന്ന ἐκλεκτοί എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: തിരഞ്ഞെടുക്കപ്പെട്ടവർ
  alternative: വൃതന്മാർ
  rationale: ‘തിരഞ്ഞെടുക്കപ്പെട്ടവർ’ ഗ്രീക്കിന്റെ സുതാര്യമായ പദാർഥം നൽകുകയും പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ സാങ്കേതിക വ്യാഖ്യാനം മുൻനിർത്താതിരിക്കുകയും ചെയ്യുന്നു. പരമ്പരാഗതമായ ‘വൃതന്മാർ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: വിവാഹവിരുന്നിന്റെ സന്ദർഭത്തിലുള്ള κλητοί എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: വിളിക്കപ്പെട്ടവർ
  alternative: ക്ഷണിക്കപ്പെട്ടവർ
  rationale: അടുത്ത സന്ദർഭത്തിൽ ‘ക്ഷണിക്കപ്പെട്ടവർ’ യോജിച്ചതാണെങ്കിലും, ‘വിളിക്കപ്പെട്ടവർ’ പദത്തിന്റെ വിശാലമായ അർത്ഥവും ἐκλεκτοί എന്നതുമായ ദൈവശാസ്ത്രപരമായ സംഘർഷവും തുറന്നുവയ്ക്കുന്നു; വിരുന്നുസന്ദർഭത്തിലെ അർത്ഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സംക്ഷിപ്തവും മാന്യവുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിന്റെ ചൊല്ലുപോലെയുള്ള സമാന്തരഘടനയും ‘അനേകർ—ചുരുക്കം’ എന്ന വൈരുധ്യവും നിലനിർത്തിയിരിക്കുന്നു.
