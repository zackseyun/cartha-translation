source:
  edition: SBLGNT
  text: ἐν τῇ ⸂ἀναστάσει οὖν⸃ τίνος τῶν ἑπτὰ ἔσται γυνή; πάντες γὰρ ἔσχον αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/028.yaml
  text: In the resurrection[a], then, whose wife of the seven will she be? For they all had her.
translation:
  language: ml
  text: അപ്പോൾ, പുനരുത്ഥാനത്തിൽ അവൾ ആ ഏഴുപേരിൽ ആരുടെ ഭാര്യയായിരിക്കും? അവരെല്ലാവരും അവളെ ഭാര്യയായി സ്വീകരിച്ചിരുന്നല്ലോ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ വ്യക്തമായി: “ഏഴുപേരും അവളെ വിവാഹം കഴിച്ചിരുന്നു.” ഗ്രീക്കിൽ അക്ഷരാർഥം: “അവരെല്ലാവരും അവളെ കൈവശം വെച്ചിരുന്നു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστάσει
  choice: പുനരുത്ഥാനത്തിൽ
  rationale: ἐν സഹിതമുള്ള ദത്തിവ് ഇവിടെ കാലപരവും സാഹചര്യപരവുമാണ്; സന്ദർഭം മരിച്ചവരുടെ ഭാവി പുനരുത്ഥാനത്തെക്കുറിച്ചായതിനാൽ ഈ പദം വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: οὖν
  choice: അങ്ങനെയെങ്കിൽ
  rationale: മുൻവിവരണത്തിൽനിന്നുള്ള നിഗമനാത്മകമായ ചോദ്യം അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ വാദത്തിന്റെ ബന്ധം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: τίνος τῶν ἑπτὰ
  choice: ആ ഏഴുപേരിൽ ആരുടെ
  rationale: ഏഴുപേരടങ്ങുന്ന കൂട്ടത്തിൽനിന്ന് ഭർത്താവിനെ തിരിച്ചറിയാൻ ചോദിക്കുന്ന ജനിറ്റീവ് പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: γυνή
  choice: ഭാര്യ
  rationale: γυνή എന്നതിന് ‘സ്ത്രീ’ എന്നും ‘ഭാര്യ’ എന്നും അർഥമുണ്ടെങ്കിലും വിവാഹസന്ദർഭം ഇവിടെ ‘ഭാര്യ’ ആവശ്യപ്പെടുന്നു.
- source_word: ἔσται
  choice: ആയിരിക്കും
  rationale: ഭാവികാലരൂപം ലളിതമായ മലയാള ഭാവികാലത്തിൽ നിലനിർത്തുന്നു.
- source_word: πάντες
  choice: അവരെല്ലാവരും
  rationale: മുൻപ് പരാമർശിച്ച ഏഴ് സഹോദരന്മാരെയും കൂട്ടമായി സൂചിപ്പിക്കുന്നു.
- source_word: γὰρ
  choice: -ല്ലോ
  rationale: ചോദ്യത്തിനുള്ള കാരണം ചൂണ്ടിക്കാണിക്കുന്ന γάρ-ന്റെ വിശദീകരണശക്തി മലയാളത്തിലെ ‘-ല്ലോ’ എന്ന സ്വാഭാവിക വാക്യാന്തപ്രയോഗം നൽകുന്നു.
- source_word: ἔσχον αὐτήν
  choice: അവളെ ഭാര്യയായി സ്വീകരിച്ചിരുന്നു
  rationale: അക്ഷരാർഥത്തിൽ ‘അവളെ സ്വന്തമായി/കൈവശം വെച്ചിരുന്നു’ എന്ന ആശയമുള്ള ഗ്രീക്ക് പ്രയോഗം ഈ വിവാഹസന്ദർഭത്തിൽ ‘ഭാര്യയായി സ്വീകരിച്ചു’ എന്ന് സ്വാഭാവികവും മാന്യവുമായി നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
theological_decisions:
- issue: സദൂക്യരുടെ ചോദ്യത്തിലെ ἀνάστασις എന്നതിന്റെ അർഥം
  choice: മരിച്ചവരുടെ ഭാവി പുനരുത്ഥാനം
  alternative: അവ്യക്തമായ മരണാനന്തരജീവിതം
  rationale: സന്ദർഭത്തിൽ സദൂക്യർ പ്രത്യേകിച്ച് പുനരുത്ഥാനത്തെയാണ് നിഷേധിക്കുന്നത്; തുടർന്നുള്ള വാക്യങ്ങളിൽ യേശുവും അതേ വിഷയത്തിനാണ് മറുപടി നൽകുന്നത്. ‘പുനരുത്ഥാനം’ എന്ന പരിഭാഷ ഈ വ്യക്തമായ ആശയം അധിക വ്യാഖ്യാനമില്ലാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ചോദ്യരൂപം ഉപയോഗിച്ചു. ‘അങ്ങനെയെങ്കിൽ’ വാദത്തിന്റെ നിഗമനബന്ധവും ‘-ല്ലോ’ γάρ-ന്റെ വിശദീകരണഭാവവും പ്രകടമാക്കുന്നു. വിവാഹബന്ധം വസ്തുവൽക്കരിക്കാതെ വ്യക്തമാക്കാൻ മുഖ്യവാചകത്തിൽ ‘ഭാര്യയായി സ്വീകരിച്ചിരുന്നു’ ഉപയോഗിച്ച് ഗ്രീക്കിന്റെ കൂടുതൽ അക്ഷരാർഥപരമായ രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
