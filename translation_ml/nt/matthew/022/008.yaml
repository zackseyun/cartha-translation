id: MAT.22.8
reference: Matthew 22:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τότε λέγει τοῖς δούλοις αὐτοῦ· Ὁ μὲν γάμος ἕτοιμός ἐστιν, οἱ δὲ κεκλημένοι οὐκ ἦσαν ἄξιοι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/008.yaml
  text: Then he says to his servants[a], ‘The wedding feast is ready, but those who were invited were not worthy.’
translation:
  language: ml
  text: 'അപ്പോൾ അവൻ തന്റെ ദാസന്മാരോടു പറയുന്നു: “വിവാഹവിരുന്ന് തയ്യാറായിരിക്കുന്നു; എന്നാൽ ക്ഷണിക്കപ്പെട്ടവർ[a] യോഗ്യരായിരുന്നില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വിളിക്കപ്പെട്ടവർ.” ഗ്രീക്ക് കൃദന്തം കൂടുതൽ അക്ഷരാർഥമായി ഇങ്ങനെ പരിഭാഷപ്പെടുത്താം; എന്നാൽ ഈ വിരുന്നിന്റെ സന്ദർഭത്തിൽ വിവാഹവിരുന്നിലേക്കു ക്ഷണിക്കപ്പെട്ടവരെയാണ് അത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: അപ്പോൾ
  rationale: ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ കാലവാചകം; സംഭവക്രമം നിലനിർത്തുന്നു.
- source_word: λέγει
  choice: പറയുന്നു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനകാലത്തിന്റെ ആഖ്യാനസജീവത നിലനിർത്താൻ വർത്തമാനകാലം ഉപയോഗിച്ചു.
- source_word: δούλοις
  choice: ദാസന്മാരോട്
  rationale: രാജകീയ ഉപമയുടെ പശ്ചാത്തലത്തിൽ യജമാനന്റെ കീഴിൽ സേവിക്കുന്നവരെ സൂചിപ്പിക്കുന്ന മാന്യവും പരിചിതവുമായ പദം.
- source_word: Ὁ μὲν γάμος
  choice: വിവാഹവിരുന്ന്
  rationale: ഈ സന്ദർഭത്തിൽ γάμος വിവാഹചടങ്ങിനെക്കാൾ ഒരുക്കിയിരിക്കുന്ന ആഘോഷവിരുന്നിനെയാണ് സൂചിപ്പിക്കുന്നത്; μὲν ... δὲ എന്ന വൈരുധ്യം ‘എന്നാൽ’ വഴി പ്രകടമാക്കി.
- source_word: ἕτοιμός ἐστιν
  choice: തയ്യാറായിരിക്കുന്നു
  rationale: അവസ്ഥയെ നേരിട്ടും സ്വാഭാവികമായും അറിയിക്കുന്ന പരിഭാഷ.
- source_word: οἱ δὲ κεκλημένοι
  choice: എന്നാൽ ക്ഷണിക്കപ്പെട്ടവർ
  rationale: വിവാഹവിരുന്നിന്റെ പശ്ചാത്തലത്തിൽ καλέω എന്നതിന്റെ ഉദ്ദേശ്യം ക്ഷണിക്കലാണ്; അതേസമയം കൂടുതൽ അക്ഷരാർഥമായ ‘വിളിക്കപ്പെട്ടവർ’ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: οὐκ ἦσαν ἄξιοι
  choice: യോഗ്യരായിരുന്നില്ല
  rationale: ἄξιος എന്നതിന്റെ വിലയിരുത്തൽഭാവം നിലനിർത്തുന്നു; അവർ എന്തുകൊണ്ട് അയോഗ്യരായി എന്നത് വിശദീകരിച്ച് അർഥം ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: κεκλημένοι എന്ന പദത്തിലെ ‘വിളിക്കപ്പെട്ടവർ’ എന്ന സാധ്യതയുള്ള ദൈവശാസ്ത്രധ്വനി
  choice: പ്രധാനപാഠത്തിൽ ‘ക്ഷണിക്കപ്പെട്ടവർ’
  alternative: ‘വിളിക്കപ്പെട്ടവർ’
  rationale: തൊട്ടുമുൻപുള്ള വിവാഹവിരുന്നിന്റെ സന്ദർഭത്തിൽ ഇവർ ക്ഷണം ലഭിച്ച അതിഥികളാണ്. ‘വിളിക്കപ്പെട്ടവർ’ എന്നു മാത്രം നൽകിയാൽ ഈ വാക്യം ആവശ്യപ്പെടാത്ത തിരഞ്ഞെടുപ്പ്/വിളി സംബന്ധമായ സാങ്കേതിക ദൈവശാസ്ത്രാർഥം കൂടുതൽ ശക്തമായി തോന്നാം; എങ്കിലും ഗ്രീക്കിന്റെ അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. ചരിത്രവർത്തമാനകാലം നിലനിർത്തി; ‘വിവാഹവിരുന്ന്’ സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം പ്രധാനപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
