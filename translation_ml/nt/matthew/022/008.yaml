  terminology: ‘വിവാഹവിരുന്ന്’ appropriately renders γάμος as the wedding celebration/feast. ‘ദാസന്മാരോടു’ is established biblical Malayalam for the servants in this parabolic setting. ‘യോഗ്യരായിരുന്നില്ല’ preserves the evaluative sense of ἄξιοι without specifying an unstated reason. The footnote accurately preserves the more literal alternative ‘വിളിക്കപ്പെട്ടവർ.’
