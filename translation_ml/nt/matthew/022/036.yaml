  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Διδάσκαλε, ποία ἐντολὴ μεγάλη ἐν τῷ νόμῳ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/036.yaml
  text: Teacher[a], which commandment is greatest in the Law?
translation:
  language: ml
  text: “ഗുരുവേ, ന്യായപ്രമാണത്തിൽ ഏറ്റവും വലിയ കല്പന ഏതാണ്?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διδάσκαλε
  choice: ഗുരുവേ
  rationale: യേശുവിനെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്ന സംബോധനരൂപം. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ‘ഗുരുവേ’ ഇവിടെ ‘Teacher’ എന്ന അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: ποία
  choice: ഏതാണ്
  rationale: ന്യായപ്രമാണത്തിലെ കല്പനകളിൽനിന്ന് ഒന്നിനെ തിരിച്ചറിയാൻ ചോദിക്കുന്ന ചോദ്യം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐντολὴ
  choice: കല്പന
  rationale: തിരുവെഴുത്തിലെയും യെഹൂദ നിയമപാരമ്പര്യത്തിലെയും ദൈവിക ആജ്ഞയെ സൂചിപ്പിക്കുന്ന പരിചിതവും കൃത്യവുമായ മലയാളപദം.
- source_word: μεγάλη
  choice: ഏറ്റവും വലിയ
  rationale: രൂപത്തിൽ positive adjective ആയെങ്കിലും, ποία എന്ന ചോദ്യംകൊണ്ടും കല്പനകളുടെ കൂട്ടത്തിനുള്ളിലെ സ്ഥാനനിർണ്ണയസന്ദർഭംകൊണ്ടും ഇവിടെ സ്വാഭാവികമായി superlative അർഥം വഹിക്കുന്നു; മലയാളത്തിൽ ‘വലിയ കല്പന ഏതാണ്?’ എന്നത് അപൂർണവും അസ്വാഭാവികവുമായി കേൾക്കും.
- source_word: ἐν τῷ νόμῳ
  choice: ന്യായപ്രമാണത്തിൽ
  rationale: ഇവിടെ νόμος മോശെയുടെ നിയമം/തോറയെ സൂചിപ്പിക്കുന്നു. ബൈബിൾ മലയാളത്തിൽ സ്ഥാപിതമായ ‘ന്യായപ്രമാണം’ ആ പ്രത്യേക തിരുവെഴുത്ത്-സൂചന നിലനിർത്തുന്നു.
theological_decisions:
- issue: μεγάλη എന്ന positive adjective-നെ അത്യുത്തമരൂപത്തിൽ പരിഭാഷപ്പെടുത്തണോ
  choice: ഏറ്റവും വലിയ
  alternative: വലിയ
  rationale: ഗ്രീക്കിൽ വ്യക്തമായ superlative രൂപമില്ലെങ്കിലും, ചോദ്യം ന്യായപ്രമാണത്തിലെ കല്പനകളിൽ ഒന്നിന്റെ മുൻതൂക്കം അന്വേഷിക്കുന്നു. അതിനാൽ സന്ദർഭപരമായ താരതമ്യബലം മലയാളത്തിൽ ‘ഏറ്റവും വലിയ’ എന്നു സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു; ഇത് ഉപദേശപരമായ അധികവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നേരിട്ടുള്ള ചോദ്യം. ‘ഗുരുവേ’യും ‘ന്യായപ്രമാണം’യും സാധാരണ വായനക്കാർക്ക് പരിചിതമായ ബൈബിൾ പദപ്രയോഗങ്ങളാണ്; വാക്യഘടന സംസാരസഹജമായിരിക്കെ ഗൗരവം നിലനിർത്തുന്നു.
