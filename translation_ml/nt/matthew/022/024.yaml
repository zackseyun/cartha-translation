id: MAT.22.24
reference: Matthew 22:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγοντες· Διδάσκαλε, Μωϋσῆς εἶπεν· Ἐάν τις ἀποθάνῃ μὴ ἔχων τέκνα, ἐπιγαμβρεύσει ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα αὐτοῦ καὶ ἀναστήσει σπέρμα τῷ ἀδελφῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/024.yaml
  text: saying[a], “Teacher, Moses said, ‘If a man dies without having children, his brother shall marry his wife and raise up offspring for his brother.’”
translation:
  language: ml
  text: 'അവർ പറഞ്ഞു: “ഗുരോ, മോശെ പറഞ്ഞു: ‘ഒരു പുരുഷൻ മക്കളില്ലാതെ മരിച്ചാൽ, അവന്റെ സഹോദരൻ മരിച്ചവന്റെ ഭാര്യയെ വിവാഹം കഴിച്ച്[a] തന്റെ സഹോദരനുവേണ്ടി സന്തതിയെ ഉളവാക്കണം.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ ഔപചാരികമായി: “ഭർത്താവിന്റെ സഹോദരൻ വിധവയോടുള്ള കടമ നിർവഹിക്കണം.” ഗ്രീക്ക് പദം പ്രത്യേകമായി ലേവിരാറ്റ് വിവാഹത്തെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διδάσκαλε
  choice: ഗുരോ
  rationale: യേശുവിനെ ഉപദേഷ്ടാവായി നേരിട്ട് അഭിസംബോധന ചെയ്യുന്ന പദം; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ആദരസൂചകവുമായ സംബോധന.
- source_word: Ἐάν τις ἀποθάνῃ μὴ ἔχων τέκνα
  choice: ഒരു പുരുഷൻ മക്കളില്ലാതെ മരിച്ചാൽ
  rationale: ഇവിടെ ഉദ്ധരിക്കപ്പെടുന്ന നിയമസാഹചര്യം പുരുഷനെയും അവന്റെ സഹോദരനെയും കുറിച്ചുള്ളതാണ്; τέκνα എന്നത് ആൺമക്കൾ മാത്രമല്ല, പൊതുവേ മക്കൾ എന്നാണ്.
- source_word: ἐπιγαμβρεύσει
  choice: വിവാഹം കഴിച്ച്
  rationale: മരിച്ച സഹോദരന്റെ വിധവയെ സഹോദരൻ വിവാഹം ചെയ്യുന്ന ലേവിരാറ്റ് വിവാഹമാണ് സൂചിപ്പിക്കുന്നത്. മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായ പ്രയോഗം നൽകി സാങ്കേതിക അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: അവന്റെ ഭാര്യയെ
  rationale: സർവനാമത്തിന്റെ നേരിട്ടുള്ള ഘടന നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അവൾ മരിച്ച പുരുഷന്റെ വിധവയാണെന്ന് വ്യക്തമാണ്.
- source_word: ἀναστήσει σπέρμα
  choice: സന്തതിയെ ജനിപ്പിക്കണം
  rationale: സഹോദരന്റെ പേരിൽ സന്തതിയെ ഉളവാക്കുക എന്ന ലേവിരാറ്റ് നിയമത്തിലെ പ്രജനന-വംശപരമായ ആശയം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: തന്റെ സഹോദരനുവേണ്ടി
  rationale: സന്തതി മരിച്ച സഹോദരന്റെ പേരിലും പ്രയോജനത്തിനുമായി കണക്കാക്കപ്പെടുന്നു എന്ന ദാതിവിന്റെ ആശയം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: നിയമപരമായ ഉദാഹരണത്തിലെ ലിംഗസൂചന
  choice: “ഒരു പുരുഷൻ”, “അവന്റെ സഹോദരൻ” എന്നീ പുരുഷലിംഗരൂപങ്ങൾ നിലനിർത്തുക
  alternative: “ഒരാൾ മരിച്ചാൽ” എന്ന ലിംഗനിരപേക്ഷ രൂപം
  rationale: മോശൈക ലേവിരാറ്റ് നിയമം ഇവിടെ പുരുഷബന്ധുത്വഭൂമികകളിലാണ് അവതരിപ്പിച്ചിരിക്കുന്നത്; അതിനാൽ മൂലപാഠത്തിന്റെ നിർദ്ദിഷ്ടത ലിംഗനിരപേക്ഷമാക്കി മാറ്റുന്നില്ല.
- issue: ἀναστήσει σπέρμα എന്ന നിയമ-വംശപരമായ പ്രയോഗം
  choice: “തന്റെ സഹോദരനുവേണ്ടി സന്തതിയെ ജനിപ്പിക്കണം”
  alternative: “തന്റെ സഹോദരന്റെ വംശം നിലനിർത്തണം”
  rationale: തിരഞ്ഞെടുത്ത രൂപം സന്തതിജനനവും അത് മരിച്ച സഹോദരനുവേണ്ടിയാണെന്ന ബന്ധവും നിലനിർത്തുന്നു; ‘വംശം നിലനിർത്തുക’ എന്നത് അർഥം കൂടുതൽ വ്യാഖ്യാനിച്ച് വിപുലീകരിച്ചേനേ.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. നിയമപരമായ ഉദ്ധരണിയുടെ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് അപരിചിതമായ സാങ്കേതിക പദം മുഖ്യപാഠത്തിൽ ഒഴിവാക്കി അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
