    rationale: ഗ്രീക്കിലെ രണ്ടും മരിച്ച പുരുഷനെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിലും മലയാളത്തിൽ അടുത്തുള്ള “സഹോദരൻ” എന്ന നാമത്തോടു രണ്ടാമത്തെ “അവന്റെ” ചേർന്നു വായിക്കപ്പെടാനുള്ള സാധ്യതയുണ്ട്. “മരിച്ചവന്റെ ഭാര്യയെ” എന്നത് സന്ദർഭപരമായ ഉദ്ദേശ്യസൂചന വ്യക്തമായി നിലനിർത്തുന്നു.
