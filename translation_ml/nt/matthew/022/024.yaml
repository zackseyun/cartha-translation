  source_fidelity: 'മുഖ്യ അർഥം പൊതുവേ കൃത്യമാണ്: മോശെയുടെ നിയമഉദ്ധരണി, മക്കളില്ലാതെ മരിക്കൽ, സഹോദരന്റെ വിവാഹബാധ്യത, മരിച്ച സഹോദരനുവേണ്ടിയുള്ള സന്തതി എന്നിവ നിലനിൽക്കുന്നു. എന്നിരുന്നാലും “അവന്റെ സഹോദരൻ അവന്റെ ഭാര്യയെ” എന്ന തുടർച്ച മലയാളത്തിൽ ഭാര്യ ആരുടേതാണെന്ന കാര്യത്തിൽ അനാവശ്യമായ ആശയക്കുഴപ്പം സൃഷ്ടിക്കാം. സന്ദർഭത്തിൽ വ്യക്തമാകുന്ന മരിച്ച പുരുഷനെ സൂചിപ്പിച്ച് അതു പരിഹരിക്കുന്നത് സുരക്ഷിതമാണ്.'
  naturalness: ഉദ്ധരണിക്കുള്ളിലെ ഉദ്ധരണി വ്യക്തമായി വേർതിരിക്കുകയും “മോശെ പറഞ്ഞിരിക്കുന്നു” എന്നതിനു പകരം ഗ്രീക്കിലെ εἶπεν-നോട് നേരിട്ട് ചേരുന്ന “മോശെ പറഞ്ഞു” ഉപയോഗിക്കുകയും വേണം. “സന്തതിയെ ഉളവാക്കണം” എന്നത് നിയമപരവും വംശപരവുമായ പ്രയോഗത്തിന് ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികമായ ഔപചാരിക രൂപമാണ്.
  terminology: “ഗുരോ” Διδάσκαλε-യ്ക്ക് യോജിച്ച മാന്യമായ സംബോധനമാണ്. “മക്കൾ,” “സഹോദരൻ,” “സന്തതി” എന്നിവ τέκνα, ἀδελφός, σπέρμα എന്നിവയുടെ ഉദ്ദേശ്യം നിലനിർത്തുന്നു. അടിക്കുറിപ്പിലെ സാങ്കേതിക വിശദീകരണം കൂടുതൽ സ്വാഭാവികമാക്കി.
  issues:
