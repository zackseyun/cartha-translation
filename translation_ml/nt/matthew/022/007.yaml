id: MAT.22.7
reference: Matthew 22:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂ὁ δὲ βασιλεὺς⸃ ὠργίσθη, καὶ πέμψας τὰ στρατεύματα αὐτοῦ ἀπώλεσεν τοὺς φονεῖς ἐκείνους καὶ τὴν πόλιν αὐτῶν ἐνέπρησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/007.yaml
  text: But the king became angry, and he sent his troops, destroyed those murderers, and burned their city.
translation:
  language: ml
  text: എന്നാൽ രാജാവ് കോപിച്ചു; തന്റെ സൈന്യത്തെ അയച്ച് ആ കൊലയാളികളെ നശിപ്പിക്കുകയും അവരുടെ നഗരം ചുട്ടുകളയുകയും ചെയ്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὠργίσθη
  choice: കോപിച്ചു
  rationale: രാജാവിന്റെ ശക്തമായ കോപത്തെ സ്വാഭാവികവും നേരിട്ടുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τὰ στρατεύματα αὐτοῦ
  choice: തന്റെ സൈന്യത്തെ
  rationale: ബഹുവചനരൂപത്തിന് സൈനികദളങ്ങൾ എന്ന അർഥമുണ്ടെങ്കിലും, ഈ സന്ദർഭത്തിൽ മലയാളത്തിലെ സമൂഹവാചിയായ ‘സൈന്യം’ സ്വാഭാവികമാണ്.
- source_word: ἀπώλεσεν
  choice: നശിപ്പിക്കുകയും
  rationale: കൊലയാളികൾക്കെതിരായ മാരകമായ ന്യായവിധിയെ ഉറവിടത്തിന്റെ ശക്തിയോടെ നിലനിർത്തുന്നു.
- source_word: τοὺς φονεῖς ἐκείνους
  choice: ആ കൊലയാളികളെ
  rationale: ἐκείνους എന്ന നിർദ്ദേശകത്തിന്റെ അകലം/ഊന്നൽ ‘ആ’ വഴി നിലനിർത്തുന്നു.
- source_word: ἐνέπρησεν
  choice: ചുട്ടുകളയുകയും ചെയ്തു
  rationale: നഗരത്തെ തീകൊളുത്തി നശിപ്പിച്ചതിനെ വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഉപമയിലെ രാജാവിന്റെ കോപവും ശിക്ഷാനടപടിയും
  choice: വാചകത്തിലെ അക്രമാത്മക ന്യായവിധിയുടെ ഭാഷ മൃദൂകരിക്കാതെ നിലനിർത്തി.
  alternative: ‘ശിക്ഷിച്ചു’ എന്ന പൊതുവായ പ്രയോഗം ഉപയോഗിക്കുക.
  rationale: ഉറവിടം കൊലയാളികളെ നശിപ്പിച്ചതും നഗരം ചുട്ടുകളഞ്ഞതും വ്യക്തമായി പറയുന്നു; അതിന്റെ ദൈവശാസ്ത്രപരമായ പ്രയോഗം വിവർത്തനം സ്വയം നിർണ്ണയിക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്ക് വാക്യത്തിലെ പങ്കാളിക്രിയയായ πέμψας ‘അയച്ച്’ എന്നു നൽകി പ്രവർത്തനക്രമവും വാക്യത്തിന്റെ ഒഴുക്കും നിലനിർത്തി.
