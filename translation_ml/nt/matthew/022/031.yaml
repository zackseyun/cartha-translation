id: MAT.22.31
reference: Matthew 22:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: περὶ δὲ τῆς ἀναστάσεως τῶν νεκρῶν οὐκ ἀνέγνωτε τὸ ῥηθὲν ὑμῖν ὑπὸ τοῦ θεοῦ λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/031.yaml
  text: Concerning the resurrection of the dead[a], have you not read what was spoken to you by God, saying,
translation:
  language: ml
  text: 'മരിച്ചവരുടെ പുനരുത്ഥാനത്തെക്കുറിച്ചാകട്ടെ[a], ദൈവം നിങ്ങളോടു ഇങ്ങനെ പറഞ്ഞത് നിങ്ങൾ വായിച്ചിട്ടില്ലേ:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ദൈവം നിങ്ങളോടു ഇങ്ങനെ അരുളിച്ചെയ്തത് നിങ്ങൾ വായിച്ചില്ലയോ?”
    reason: The English POB audit trail notes the alternative active formulation of the divine speech; this Malayalam note preserves that alternative while the main text remains natural and closely reflects the Greek construction.
lexical_decisions:
- source_word: περὶ δὲ
  choice: മരിച്ചവരുടെ പുനരുത്ഥാനത്തെക്കുറിച്ചാകട്ടെ
  rationale: περί വിഷയം അവതരിപ്പിക്കുന്നു; δέ പുതിയ വിഷയത്തിലേക്കുള്ള മാറ്റം സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘-യെക്കുറിച്ചാകട്ടെ’ ഈ മാറ്റം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀναστάσεως τῶν νεκρῶν
  choice: മരിച്ചവരുടെ പുനരുത്ഥാനം
  rationale: ജനിറ്റീവ് ഘടനയെ നേരിട്ട് നിലനിർത്തുകയും മരിച്ചവരാണ് ഉയിർപ്പിക്കപ്പെടുന്നവർ എന്ന ആശയം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: οὐκ ἀνέγνωτε
  choice: നിങ്ങൾ വായിച്ചിട്ടില്ലേ?
  rationale: നിഷേധരൂപത്തിലുള്ള ആലങ്കാരിക ചോദ്യം നിലനിർത്തുന്നു; തിരുവെഴുത്തിനോടുള്ള ശ്രോതാക്കളുടെ പരിചയത്തെ ചോദ്യം ചെയ്യുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്.
- source_word: τὸ ῥηθὲν ὑμῖν ὑπὸ τοῦ θεοῦ
  choice: ദൈവം നിങ്ങളോടു പറഞ്ഞതു
  rationale: ഗ്രീക്കിലെ ദൈവിക കർത്തൃത്വവും ശ്രോതാക്കളോടുള്ള അഭിസംബോധനയും നിലനിർത്തുന്നു. മലയാളത്തിൽ കർത്തരി പ്രയോഗം കർമണി പ്രയോഗത്തേക്കാൾ സ്വാഭാവികമാണ്.
- source_word: λέγοντος
  choice: 'അവിടുന്നു പറയുന്നു:'
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള ഉദ്ധരണിയെ അവതരിപ്പിക്കുന്നു. ആദരസൂചകമായ ‘അവിടുന്നു’ ദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് സന്ദർഭത്തിൽ വ്യക്തമാണ്.
theological_decisions:
- issue: തിരുവെഴുത്തിലെ ദൈവിക വചനവും അതിന്റെ ഇപ്പോഴത്തെ അഭിസംബോധനയും
  choice: ദൈവം നിങ്ങളോടു പറഞ്ഞതു
  alternative: ദൈവത്താൽ നിങ്ങളോടു പറയപ്പെട്ടതു
  rationale: ഗ്രീക്ക് കർമണി ഘടന ദൈവത്തെ പ്രവർത്തകനായി വ്യക്തമാക്കുന്നു. സ്വാഭാവിക മലയാളത്തിനായി കർത്തരി ഘടന സ്വീകരിച്ചെങ്കിലും, ദൈവമാണ് സംസാരിച്ചതെന്നും വചനം ശ്രോതാക്കളെ അഭിസംബോധന ചെയ്യുന്നുവെന്നും പൂർണമായി നിലനിർത്തി.
- issue: λέγοντος എന്നതിന്റെ കാലപരമായ ഭാവം
  choice: അവിടുന്നു പറയുന്നു
  alternative: ഇങ്ങനെ പറഞ്ഞത്
  rationale: വർത്തമാന കൃദന്തരൂപത്തിന്റെ സജീവതയും അടുത്ത വാക്യത്തിലെ ഉദ്ധരണിയിലേക്കുള്ള നീക്കവും സൂക്ഷിക്കുന്നു; ദൈവവചനത്തിന്റെ കാലാതീതതയെക്കുറിച്ചുള്ള അധിക സിദ്ധാന്തം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പുനരുത്ഥാനം’ സാധാരണ ബൈബിൾ-ദൈവശാസ്ത്ര പ്രയോഗമായി നിലനിർത്തി. വാക്യം അടുത്ത വാക്യത്തിലെ ഉദ്ധരണിയിലേക്ക് നയിക്കുന്നതിനാൽ അവസാനം ദ്വിബിന്ദു ചേർത്തു.
