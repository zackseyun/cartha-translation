source:
  edition: SBLGNT
  text: ἐπιδείξατέ μοι τὸ νόμισμα τοῦ κήνσου. οἱ δὲ προσήνεγκαν αὐτῷ δηνάριον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/019.yaml
  text: Show me the coin for the tax[a]. And they brought him a denarius.
translation:
  language: ml
  text: “നികുതിക്കുള്ള നാണയം എനിക്കു കാണിച്ചുതരൂ[a].” അവർ അവന് ഒരു ദെനാരിയസ് കൊണ്ടുവന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തലനികുതിക്കുള്ള നാണയം” അല്ലെങ്കിൽ “ജനസംഖ്യാ നികുതിക്കുള്ള നാണയം.” κῆνσος എന്ന പദം ഒരു റോമൻ സാമ്രാജ്യത്വ നികുതിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιδείξατέ
  choice: എന്നെ കാണിക്കൂ
  rationale: രണ്ടാം പുരുഷ ബഹുവചനത്തിലുള്ള കല്പനയുടെ ദൃശ്യപരിശോധനാസൂചന നിലനിർത്തുന്ന സ്വാഭാവിക ആധുനിക മലയാളം.
- source_word: νόμισμα
  choice: നാണയം
  rationale: പ്രചാരത്തിലുള്ള ഒരു പ്രത്യേക പണനാണയത്തെ സൂചിപ്പിക്കുന്നതിനാൽ വ്യക്തവും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: τοῦ κήνσου
  choice: നികുതിക്കുള്ള
  rationale: റോമൻ സാമ്രാജ്യത്വ നികുതിയെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; മുഖ്യവാക്യത്തിൽ അനാവശ്യമായി അതിനെ തലനികുതി എന്നു നിർണ്ണയിക്കാതെ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ബന്ധം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: προσήνεγκαν
  choice: കൊണ്ടുവന്നു
  rationale: വസ്തു യേശുവിന്റെ അടുക്കൽ കൊണ്ടുവന്ന് സമർപ്പിച്ച കഥാസന്ദർഭം ലളിതമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: δηνάριον
  choice: ഒരു ദനാരിയോസ് നാണയം
  rationale: പ്രത്യേക ചരിത്രനാണയത്തിന്റെ പേര് ലിപ്യന്തരണം ചെയ്ത് നിലനിർത്തുകയും സാധാരണ വായനക്കാരന് അത് നാണയമാണെന്ന് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ കഥാശൈലി. ചരിത്രപരമായ നാണയനാമം നിലനിർത്തി; നികുതിയുടെ കൂടുതൽ നിർദ്ദിഷ്ട അർഥങ്ങൾ അടിക്കുറിപ്പിൽ നൽകി.
