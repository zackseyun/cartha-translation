  to: 'അവൻ വീണ്ടും മറ്റു അടിമകളെ[a] അയച്ച് ഇപ്രകാരം പറഞ്ഞു: “ക്ഷണിക്കപ്പെട്ടവരോടു പറയുക: ‘ഇതാ, ഞാൻ എന്റെ വിരുന്ന്[b] ഒരുക്കിയിരിക്കുന്നു; എന്റെ കാളകളെയും തീറ്റിപ്പോറ്റിയ മൃഗങ്ങളെയും അറുക്കപ്പെട്ടിരിക്കുന്നു; എല്ലാം തയ്യാറായിക്കഴിഞ്ഞു. വിവാഹാഘോഷത്തിന്[c] വരുവിൻ.’”'
