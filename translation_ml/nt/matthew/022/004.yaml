id: MAT.22.4
reference: Matthew 22:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πάλιν ἀπέστειλεν ἄλλους δούλους λέγων· Εἴπατε τοῖς κεκλημένοις· Ἰδοὺ τὸ ἄριστόν μου ⸀ἡτοίμακα, οἱ ταῦροί μου καὶ τὰ σιτιστὰ τεθυμένα, καὶ πάντα ἕτοιμα· δεῦτε εἰς τοὺς γάμους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/004.yaml
  text: Again he sent other servants[a], saying, ‘Tell those who have been invited, “Look, I have prepared my dinner; my oxen and my fattened cattle have been slaughtered, and everything is ready[c][b]. Come to the wedding feast.”’
translation:
  language: ml
  text: 'അവൻ വീണ്ടും മറ്റു അടിമകളെ[a] അയച്ച് ഇപ്രകാരം പറഞ്ഞു: “ക്ഷണിക്കപ്പെട്ടവരോടു പറയുക: ‘ഇതാ, ഞാൻ എന്റെ വിരുന്ന്[b] ഒരുക്കിയിരിക്കുന്നു; എന്റെ കാളകളെയും തീറ്റിപ്പോറ്റിയ മൃഗങ്ങളെയും അറുക്കപ്പെട്ടിരിക്കുന്നു; എല്ലാം തയ്യാറായിക്കഴിഞ്ഞു. വിവാഹാഘോഷത്തിന്[c] വരുവിൻ.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “മറ്റു ദാസന്മാരെ” അല്ലെങ്കിൽ “മറ്റു സേവകരെ.” ഗ്രീക്ക് പദമായ doulous സന്ദർഭമനുസരിച്ച് അടിമകളെയോ ദാസന്മാരെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെയുള്ള ഗ്രീക്ക് പദം ഒരുക്കിയ ഭക്ഷണത്തെ, പലപ്പോഴും ദിവസത്തിന്റെ ആദ്യത്തെ പ്രധാന ഭക്ഷണത്തെ, സൂചിപ്പിക്കുന്നു; “എന്റെ ഭക്ഷണം” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ “വിവാഹത്തിന്” അല്ലെങ്കിൽ “വിവാഹവിരുന്നിന്.” ഗ്രീക്ക് ബഹുവചനം വിവാഹാഘോഷങ്ങളെ ഒന്നാകെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν ἀπέστειλεν
  choice: അവൻ വീണ്ടും ... അയച്ചു
  rationale: ആവർത്തിച്ചുള്ള അയക്കലിനെ πάλιν സൂചിപ്പിക്കുന്നു; ലളിതമായ ആഖ്യാനശൈലിയിൽ ക്രിയയെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἄλλους δούλους
  choice: വേറെ അടിമകളെ
  rationale: ἄλλους എന്നത് മുമ്പ് അയച്ചവരിൽനിന്നു വേറെയുള്ളവരെ സൂചിപ്പിക്കുന്നു. രാജഗൃഹത്തിന്റെ പശ്ചാത്തലത്തിൽ δοῦλοι എന്ന പദത്തിലെ ഉടമസ്ഥാധീന സാമൂഹികനില ‘അടിമകൾ’ കൂടുതൽ നേരിട്ട് നിലനിർത്തുന്നു; ‘ദാസന്മാർ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: Εἴπατε τοῖς κεκλημένοις
  choice: ക്ഷണിക്കപ്പെട്ടവരോടു പറയുക
  rationale: κεκλημένοις എന്ന perfect passive രൂപം മുമ്പേ ക്ഷണം ലഭിച്ചവരെയും ആ ക്ഷണം ഇപ്പോഴും പ്രസക്തമാണെന്നതെയും സൂചിപ്പിക്കുന്നു.
- source_word: Ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗ്രീക്ക് വ്യവഹാരകണത്തിന്റെ സ്വാഭാവികവും മാന്യവുമായ മലയാളരൂപം.
- source_word: τὸ ἄριστόν μου ἡτοίμακα
  choice: ഞാൻ എന്റെ വിരുന്ന് ഒരുക്കിയിരിക്കുന്നു
  rationale: ἄριστον ഒരുക്കിയ ഭക്ഷണത്തെ, പലപ്പോഴും ദിവസത്തിന്റെ ആദ്യത്തെ പ്രധാന ഭക്ഷണത്തെ, സൂചിപ്പിക്കുന്നു; വിവാഹസന്ദർഭത്തിൽ ‘വിരുന്ന്’ സ്വാഭാവികമാണ്. Perfect ക്രിയയുടെ പൂർത്തിയായ ഒരുക്കവും ഇപ്പോഴത്തെ സജ്ജാവസ്ഥയും ‘ഒരുക്കിയിരിക്കുന്നു’ നിലനിർത്തുന്നു.
- source_word: οἱ ταῦροί μου καὶ τὰ σιτιστὰ
  choice: എന്റെ കാളകളെയും കൊഴുപ്പിച്ച മൃഗങ്ങളെയും
  rationale: ταῦροι എന്നത് കാളവർഗത്തെ സൂചിപ്പിക്കുന്നു. substantival adjective ആയ σιτιστά പ്രത്യേകമായി തീറ്റിപ്പോറ്റിയ മൃഗങ്ങളെയാണ് പറയുന്നത്; ഗ്രീക്കിൽ ഇല്ലാത്ത ‘കിടാക്കൾ’ എന്ന നിർണ്ണയം ചേർക്കാതെ വിശാലത നിലനിർത്തുന്നു.
- source_word: τεθυμένα
  choice: അറുത്തിരിക്കുന്നു
  rationale: ഇവിടെ θύω ആരാധനാപരമായ യാഗത്തെക്കാൾ ഭക്ഷണത്തിനായി മൃഗങ്ങളെ അറുക്കുന്നതാണ്; perfect രൂപത്തിലെ പൂർത്തിയായ പ്രവർത്തനവും ഇപ്പോഴത്തെ ഫലവും ഈ പ്രയോഗം നൽകുന്നു.
- source_word: καὶ πάντα ἕτοιμα
  choice: എല്ലാം തയ്യാറായിക്കഴിഞ്ഞു
  rationale: πάντα എന്ന സമഗ്രതയും ഒരുക്കം പൂർണ്ണമായിരിക്കുന്ന നിലയും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: δεῦτε εἰς τοὺς γάμους
  choice: വിവാഹാഘോഷത്തിന് വരുവിൻ
  rationale: γάμοι എന്ന ബഹുവചനരൂപം വിവാഹത്തെയോ അതോടനുബന്ധിച്ച ആഘോഷങ്ങളെയോ വിരുന്നിനെയോ സൂചിപ്പിക്കാം; സന്ദർഭത്തിൽ ആഘോഷത്തിലേക്കുള്ള ക്ഷണം സ്വാഭാവികമാണ്, എന്നാൽ വിശാലമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: രാജഗൃഹോപമയിലെ δοῦλος എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: അടിമകൾ
  alternative: ദാസന്മാർ / സേവകർ
  rationale: ഈ സാമൂഹിക പശ്ചാത്തലത്തിൽ ഇവർ വെറും കൂലിപ്പണിക്കാർ അല്ല, യജമാനന്റെ അധികാരത്തിൻ കീഴിലുള്ള ഗൃഹാംഗങ്ങളാണ്. ‘അടിമകൾ’ ആ യാഥാർഥ്യം നേരിട്ട് സൂചിപ്പിക്കുന്നു; മതവിഭാഗപരമായ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: θύω എന്ന പദം യാഗമെന്നോ സാധാരണ അറുക്കലെന്നോ വായിക്കുക
  choice: അറുത്തിരിക്കുന്നു
  alternative: ബലിയർപ്പിച്ചിരിക്കുന്നു
  rationale: വിവാഹവിരുന്നിനുള്ള ഭക്ഷണസജ്ജീകരണമാണ് സമീപസന്ദർഭം; ആരാധനാപരമായ ബലി ഇവിടെ സൂചിപ്പിക്കപ്പെട്ടിട്ടില്ല. അതിനാൽ ‘ബലിയർപ്പിച്ചു’ എന്നത് അനാവശ്യമായ ദൈവശാസ്ത്രപരമായ അർഥം ഇറക്കുമതി ചെയ്യും.
- issue: τοὺς γάμους എന്ന ബഹുവചനത്തിന്റെ പരിധി
  choice: വിവാഹാഘോഷം
  alternative: വിവാഹം / വിവാഹവിരുന്ന്
  rationale: ഗ്രീക്ക് ബഹുവചനം വിവാഹാഘോഷങ്ങളെ സമഗ്രമായി സൂചിപ്പിക്കാം. ‘വിവാഹാഘോഷം’ ആ വിശാലത നിലനിർത്തുന്നു; വിരുന്ന് എന്ന പ്രത്യേക വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഉദ്ധരണിക്കുള്ളിലെ രാജാവിന്റെ ക്ഷണത്തിന് അനുയോജ്യമായി ‘വരുവിൻ’ എന്ന ബഹുവചന ആജ്ഞാരൂപം ഉപയോഗിച്ചു. ഗ്രീക്കിലെ സാമൂഹികവും പദാർഥപരവുമായ അനിശ്ചിതത്വങ്ങൾ പ്രധാനവാചകത്തിൽ അമിതമായി വിശദീകരിക്കാതെ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
