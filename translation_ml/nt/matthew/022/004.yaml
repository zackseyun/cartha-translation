  source_fidelity: 'ഗ്രീക്ക് വാക്യത്തിന്റെ ഘടനയും പ്രധാന അർഥവും കരട് നന്നായി കൈമാറുന്നു: വീണ്ടും അയക്കൽ, മുമ്പേ ക്ഷണിക്കപ്പെട്ടവർ, ഒരുക്കിയ ഭക്ഷണം, കാളകളും പ്രത്യേകം തീറ്റിപ്പോറ്റിയ മൃഗങ്ങളും, എല്ലാം സജ്ജമാണെന്ന അറിയിപ്പ്, വിവാഹാഘോഷങ്ങളിലേക്കുള്ള ക്ഷണം എന്നിവയെല്ലാം സംരക്ഷിച്ചിട്ടുണ്ട്. എന്നാൽ τεθυμένα ഒരു perfect passive participle ആണ്. ‘അറുത്തിരിക്കുന്നു’ മലയാളത്തിൽ കർത്താവില്ലാത്ത സജീവപ്രയോഗമായി കേൾക്കാം; ‘അറുക്കപ്പെട്ടിരിക്കുന്നു’ ഉറവിടത്തിലെ കർമണിപ്രയോഗം കൂടുതൽ വ്യക്തമായി നിലനിർത്തുന്നു.'
  naturalness: ‘മറ്റു അടിമകളെ’ എന്നത് ‘വേറെ അടിമകളെ’ക്കാൾ ആധുനിക നിലവാരമലയാളത്തിലെ ആഖ്യാനരജിസ്റ്ററിൽ കൂടുതൽ സ്വാഭാവികമാണ്. ‘അയച്ച് ഇപ്രകാരം പറഞ്ഞു’ എന്നത് അയക്കലും സന്ദേശത്തിന്റെ ഉള്ളടക്കവും വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു. ‘തീറ്റിപ്പോറ്റിയ മൃഗങ്ങൾ’ σιτιστάയുടെ പ്രത്യേകം പോറ്റി തടിപ്പിച്ച മൃഗങ്ങൾ എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
  terminology: ‘അടിമകൾ’ δοῦλοι എന്ന സാമൂഹികപദവിയെ ഈ രാജകീയ ഉപമാസന്ദർഭത്തിൽ യുക്തമായി പ്രതിഫലിപ്പിക്കുന്നു; ‘ദാസന്മാർ/സേവകർ’ എന്ന വായന അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചിരിക്കുന്നു. ‘വിരുന്ന്’ ἄριστον-നു യോജിക്കുന്നു; ‘വിവാഹാഘോഷം’ τοὺς γάμους എന്ന ബഹുവചനത്തിന്റെ വിശാലത നിലനിർത്തുന്നു. θύω-യെ ബലിയർപ്പിക്കൽ എന്നല്ല, ഭക്ഷണത്തിനായുള്ള അറുക്കൽ എന്നായാണ് ശരിയായി വിവർത്തനം ചെയ്തിരിക്കുന്നത്.
