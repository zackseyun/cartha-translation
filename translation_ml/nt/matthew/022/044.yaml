revisions:
- from: '‘കർത്താവ് എന്റെ കർത്താവിനോടു പറഞ്ഞു: “ഞാൻ നിന്റെ ശത്രുക്കളെ നിന്റെ കാൽക്കീഴിലാക്കുന്നതുവരെ എന്റെ വലത്തുഭാഗത്ത് ഇരിക്കുക”’ എന്ന്?'
  to: 'കർത്താവ് എന്റെ കർത്താവിനോടു പറഞ്ഞു: “ഞാൻ നിന്റെ ശത്രുക്കളെ നിന്റെ കാൽക്കീഴിലാക്കുന്നതുവരെ എന്റെ വലതുഭാഗത്ത് ഇരിക്കുക” എന്നു?'
  rationale: The quotation is normalized to a single Malayalam direct-speech construction. ‘എന്നു?’ is retained as the natural Malayalam way to carry forward the rhetorical question signaled by the Greek verse’s final question punctuation, without presenting it as part of the Psalm quotation. The optional footnote preserves the audit-trail alternative, correctly anchored after ‘കാൽക്കീഴിൽ’ in typesetting.
