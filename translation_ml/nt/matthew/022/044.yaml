id: MAT.22.44
reference: Matthew 22:44
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀Εἶπεν κύριος τῷ κυρίῳ μου· Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ⸀ὑποκάτω τῶν ποδῶν σου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/044.yaml
  text: The Lord said to my Lord[a], ‘Sit at my right hand until I put your enemies under your feet’?”
translation:
  language: ml
  text: 'കർത്താവ് എന്റെ കർത്താവിനോടു പറഞ്ഞു: “ഞാൻ നിന്റെ ശത്രുക്കളെ നിന്റെ കാൽക്കീഴിലാക്കുന്നതുവരെ എന്റെ വലതുഭാഗത്ത് ഇരിക്കുക” എന്നു?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπεν
  choice: പറഞ്ഞു
  rationale: λέγω എന്ന സാധാരണ സംസാരക്രിയയുടെ ഭൂതകാലപ്രയോഗം സ്വാഭാവികമായി പകർത്തുന്നു; ‘പ്രഖ്യാപിച്ചു’ എന്നത് മൂലത്തേക്കാൾ ശക്തമാണ്.
- source_word: κύριος
  choice: കർത്താവ്
  rationale: രണ്ടിടത്തുമുള്ള ഒരേ ഗ്രീക്ക് പദത്തിന് ഒരേ മലയാളപദം നൽകി, ആദ്യത്തേത് ദൈവത്തെയും രണ്ടാമത്തേത് ദാവീദിന്റെ കർത്താവിനെയും സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിലെ ബന്ധപരമായ വ്യത്യാസം ‘എന്റെ കർത്താവ്’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: τῷ κυρίῳ μου
  choice: എന്റെ കർത്താവിനോടു
  rationale: ദത്തിവ് ഇവിടെ വാക്ക് അഭിസംബോധന ചെയ്യപ്പെടുന്ന ആളെ സൂചിപ്പിക്കുന്നു; ‘യജമാനനോടു’ എന്നതിനെക്കാൾ κύριος എന്ന പദത്തിന്റെ ആവർത്തനവും ഭാഗത്തിന്റെ മശീഹാസംബന്ധമായ ഭാവവും ഇത് കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: Κάθου
  choice: ഇരിക്കുക
  rationale: സിംഹാസനാരോഹണസന്ദർഭത്തിലെ ആജ്ഞയെ ലളിതവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐκ δεξιῶν μου
  choice: എന്റെ വലത്തുഭാഗത്ത്
  rationale: ബഹുമാനത്തിന്റെയും അധികാരത്തിന്റെയും സ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: ἕως ἂν θῶ
  choice: ഞാൻ … ആക്കുന്നതുവരെ
  rationale: ἕως ἂν സഹിതമുള്ള aorist subjunctive സൂചിപ്പിക്കുന്ന ഭാവിയിലെ പരിധിയെ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: τοὺς ἐχθρούς σου
  choice: നിന്റെ ശത്രുക്കളെ
  rationale: സന്ദർഭത്തിൽ ἐχθρός എന്ന പദത്തിന്റെ നേരിട്ടുള്ളതും സാധാരണവുമായ മലയാളപരിഭാഷ.
- source_word: ὑποκάτω τῶν ποδῶν σου
  choice: നിന്റെ കാൽക്കീഴിൽ
  rationale: ഗ്രീക്ക് വാചകത്തിന്റെ നേരിട്ടുള്ള സ്ഥലംസൂചക അർഥം പകർത്തുന്നു; ‘പാദപീഠം’ എന്ന രൂപകം ഈ ഗ്രീക്ക് പാഠത്തിൽ തുറന്നുപറയുന്നില്ല.
theological_decisions:
- issue: സങ്കീർത്തനം 110:1-ലെ ഉദ്ധരണിയിൽ κύριος രണ്ടുതവണ വരുന്നത്
  choice: കർത്താവ് എന്റെ കർത്താവിനോടു പറഞ്ഞു
  alternative: യഹോവ എന്റെ കർത്താവിനോടു പറഞ്ഞു / കർത്താവ് എന്റെ യജമാനനോടു പറഞ്ഞു
  rationale: ഗ്രീക്ക് പാഠം രണ്ടിടത്തും κύριος തന്നെയാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ ഒരേ ബിരുദം രണ്ടിടത്തും നിലനിർത്തുന്നത് മൂലപാഠത്തിന്റെ രൂപവും യേശുവിന്റെ വാദത്തിലെ ഉദ്ദേശ്യമായ സംഘർഷവും സംരക്ഷിക്കുന്നു. ആദ്യത്തേതിൽ ഹീബ്രു ദൈവനാമം പശ്ചാത്തലത്തിലുണ്ടെങ്കിലും ‘യഹോവ’ എന്നു ചേർക്കുന്നത് ഗ്രീക്ക് ഉദ്ധരണിയിൽ വ്യക്തമല്ലാത്ത വ്യത്യാസം മുന്നോട്ടുകൊണ്ടുവരും; രണ്ടാമത്തേത് ‘യജമാനൻ’ എന്നു നൽകുന്നത് പദാവർത്തനവും മശീഹാസംബന്ധമായ ഗൗരവവും ക്ഷയിപ്പിക്കും.
- issue: ശത്രുക്കളെ കാലുകൾക്കീഴിലാക്കുന്ന പ്രയോഗം
  choice: നിന്റെ ശത്രുക്കളെ നിന്റെ കാൽക്കീഴിലാക്കുന്നതുവരെ
  alternative: നിന്റെ ശത്രുക്കളെ നിന്റെ കാലുകൾക്കു പാദപീഠമാക്കുന്നതുവരെ
  rationale: മത്തായിയുടെ ഗ്രീക്ക് പാഠം ὑποκάτω τῶν ποδῶν σου, ‘നിന്റെ കാലുകൾക്കു കീഴിൽ,’ എന്നാണ്. ‘പാദപീഠം’ ഹീബ്രു സങ്കീർത്തനത്തിലെ രൂപകത്തെ വ്യക്തമാക്കുന്ന പരമ്പരാഗത പരിഭാഷയായാലും, ഈ വാക്യത്തിന്റെ ഗ്രീക്ക് രൂപം നേരിട്ട് പകർത്തുന്നതാണ് ഉചിതം.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. ഉദ്ധരണിക്കുള്ളിലെ ഉദ്ധരണിയും വാക്യാവസാനത്തിലെ ചോദ്യംചിഹ്നവും നിലനിർത്തി. ‘വലത്തുഭാഗത്ത്’ സ്വാഭാവിക മലയാളമായി തിരഞ്ഞെടുത്തു; ‘കർത്താവ്’ എന്ന ആവർത്തനം ഉദ്ദേശപൂർവം സംരക്ഷിച്ചു.
