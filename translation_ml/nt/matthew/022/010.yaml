id: MAT.22.10
reference: Matthew 22:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐξελθόντες οἱ δοῦλοι ἐκεῖνοι εἰς τὰς ὁδοὺς συνήγαγον πάντας ⸀οὓς εὗρον, πονηρούς τε καὶ ἀγαθούς· καὶ ἐπλήσθη ὁ ⸀γάμος ἀνακειμένων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/010.yaml
  text: And those servants went out into the roads and gathered everyone they found[a], both evil and good[c][b]; and the wedding hall was filled with guests reclining at the table.
translation:
  language: ml
  text: ആ അടിമകൾ വഴികളിലേക്കു പുറപ്പെട്ട്, അവിടെ കണ്ട എല്ലാവരെയും—ദുഷ്ടരെയും നല്ലവരെയും[a]—കൂട്ടിക്കൊണ്ടുവന്നു. അങ്ങനെ വിവാഹവിരുന്ന്[b] മേശയ്ക്കരികിൽ ചാരിക്കിടന്ന അതിഥികളെക്കൊണ്ട്[c] നിറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ചീത്തവരെയും നല്ലവരെയും.”
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ “വിവാഹം.” ഭക്ഷണത്തിനായി ചാരിക്കിടന്നവരാൽ അത് നിറഞ്ഞുവെന്നതിനാൽ ഇവിടെ വിവാഹവിരുന്നോ അതിന്റെ വേദിയോ ഉദ്ദേശിച്ചിരിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: ഔപചാരിക വിരുന്നിൽ മേശയ്ക്കരികിൽ ചാരിക്കിടന്ന് ഭക്ഷണം കഴിക്കുന്നതായിരുന്നു അക്കാലത്തെ പതിവ്.
    reason: cultural_note
lexical_decisions:
- source_word: δοῦλοι
  choice: അടിമകൾ
  rationale: രാജാവിന്റെ അധികാരത്തിൻകീഴിലുള്ള ബന്ധിതരായ ഗൃഹജോലിക്കാരെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ‘ദാസന്മാർ’ എന്നതിനെക്കാൾ ‘അടിമകൾ’ അന്നത്തെ സാമൂഹിക യാഥാർഥ്യം മറച്ചുവയ്ക്കാതെ നിലനിർത്തുന്നു.
- source_word: ὁδοὺς
  choice: വഴികൾ
  rationale: പൊതുവഴികളെയോ സഞ്ചാരപാതകളെയോ വിശാലമായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: συνήγαγον
  choice: കൂട്ടിക്കൊണ്ടുവന്നു
  rationale: കണ്ടവരെ ഒരുമിച്ചുകൂട്ടി വിരുന്നിലേക്കു കൊണ്ടുവന്നുവെന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: πάντας οὓς εὗρον
  choice: അവിടെ കണ്ട എല്ലാവരെയും
  rationale: πάντας എന്ന പദത്തിന്റെ സമഗ്രതയും οὓς εὗρον എന്ന ആപേക്ഷികവാക്യത്തിന്റെ വ്യക്തിപരമായ സൂചനയും നിലനിർത്തുന്നു.
- source_word: πονηρούς τε καὶ ἀγαθούς
  choice: ദുഷ്ടരെയും നല്ലവരെയും
  rationale: ധാർമികവിരുദ്ധതയുടെ മൂർച്ച നിലനിർത്തുന്നു; പദങ്ങളെ വെറും ‘ചീത്ത’ എന്നും ‘നല്ല’ എന്നും മയപ്പെടുത്തുന്നില്ല.
- source_word: γάμος
  choice: വിവാഹവിരുന്ന്
  rationale: γάμος അക്ഷരാർഥത്തിൽ വിവാഹത്തെ സൂചിപ്പിക്കാമെങ്കിലും, ഭക്ഷണത്തിന് ചാരിക്കിടക്കുന്നവരാൽ അത് നിറഞ്ഞുവെന്ന സന്ദർഭത്തിൽ വിവാഹാഘോഷമോ വിരുന്നോ ആണ് ഉദ്ദേശ്യം.
- source_word: ἐπλήσθη
  choice: നിറഞ്ഞു
  rationale: സ്ഥലമോ വിരുന്നുസദസ്സോ ആളുകളാൽ പൂർണമായിത്തീർന്നുവെന്ന നിഷ്ക്രിയ ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀνακειμένων
  choice: മേശയ്ക്കരികിൽ ചാരിക്കിടന്ന അതിഥികളെക്കൊണ്ട്
  rationale: പുരാതന ഔപചാരിക വിരുന്നുകളിൽ ഭക്ഷണം കഴിക്കുമ്പോൾ ചാരിക്കിടക്കുന്ന പതിവിനെ വ്യക്തമാക്കുകയും ഇവർ വിരുന്നിലെ അതിഥികളാണെന്ന സന്ദർഭം വായനക്കാരന് സ്വാഭാവികമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: കൂട്ടിക്കൊണ്ടുവന്നവരുടെ ധാർമിക വിശേഷണം
  choice: ദുഷ്ടരെയും നല്ലവരെയും
  alternative: ചീത്തവരെയും നല്ലവരെയും
  rationale: ക്ഷണത്തിന്റെ വിവേചനരഹിതമായ വ്യാപ്തി വാക്യം ഊന്നിപ്പറയുന്നു; അതേസമയം വിരുന്നിൽ എത്തിയതും പിന്നീടുള്ള ശരിയായ പ്രതികരണവും തമ്മിലുള്ള സംഘർഷം മുൻകൂട്ടി പരിഹരിക്കുന്നില്ല. πονηρούς എന്നതിന്റെ ധാർമിക മൂർച്ച ‘ദുഷ്ടർ’ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും മാന്യവുമായ കഥനശൈലി സ്വീകരിച്ചു. ‘അടിമകൾ’ എന്ന പദം മൂലഭാഷയിലെ ബന്ധിത സാമൂഹികപദവി മയപ്പെടുത്താതെ നൽകുന്നു. പുരാതന വിരുന്നിലെ ശരീരനില ‘മേശയ്ക്കരികിൽ ചാരിക്കിടന്ന’ എന്ന് വ്യക്തമാക്കിയിരിക്കുന്നു; സാംസ്കാരിക വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകിയിട്ടുണ്ട്.
