revisions:
- from: ‘ഞാൻ അബ്രാഹാമിന്റെ ദൈവവും യിസ്ഹാക്കിന്റെ ദൈവവും യാക്കോബിന്റെ ദൈവവും ആകുന്നു.’ അവിടുന്ന് മരിച്ചവരുടെ ദൈവമല്ല, ജീവനുള്ളവരുടെ ദൈവമാണ്.[a]
  to: “ഞാൻ അബ്രാഹാമിന്റെ ദൈവമാണ്, യിസ്ഹാക്കിന്റെ ദൈവമാണ്, യാക്കോബിന്റെ ദൈവമാണ്.” ദൈവം മരിച്ചവരുടെ ദൈവമല്ല, ജീവനുള്ളവരുടെ ദൈവമാണ്.
