id: MAT.22.32
reference: Matthew 22:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐγώ εἰμι ὁ θεὸς Ἀβραὰμ καὶ ὁ θεὸς Ἰσαὰκ καὶ ὁ θεὸς Ἰακώβ; οὐκ ἔστιν ⸂ὁ θεὸς⸃ νεκρῶν ἀλλὰ ζώντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/032.yaml
  text: I am the God of Abraham and the God of Isaac and the God of Jacob. He is not the God of the dead[a], but of the living.
translation:
  language: ml
  text: “ഞാൻ അബ്രാഹാമിന്റെ ദൈവമാണ്, യിസ്ഹാക്കിന്റെ ദൈവമാണ്, യാക്കോബിന്റെ ദൈവമാണ്.” ദൈവം മരിച്ചവരുടെ ദൈവമല്ല, ജീവനുള്ളവരുടെ ദൈവമാണ്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: ഞാൻ ... ആകുന്നു
  rationale: വർത്തമാനകാലത്തിലുള്ള നേരിട്ടുള്ള സ്വയംതിരിച്ചറിയിക്കൽ നിലനിർത്തുന്നു; ഉദ്ധരിച്ച തിരുവെഴുത്തിന്റെ രൂപവും യേശുവിന്റെ വാദത്തിന്റെ ശക്തിയും സംരക്ഷിക്കുന്നു.
- source_word: ὁ θεὸς Ἀβραὰμ ... ὁ θεὸς Ἰσαὰκ ... ὁ θεὸς Ἰακώβ
  choice: അബ്രാഹാമിന്റെ ദൈവവും യിസ്ഹാക്കിന്റെ ദൈവവും യാക്കോബിന്റെ ദൈവവും
  rationale: ഗ്രീക്കിലെ ഓരോ പിതാമഹന്റെയും മുമ്പിലുള്ള ‘ദൈവം’ എന്ന ആവർത്തനം ചുരുക്കാതെ നിലനിർത്തി അതിന്റെ വാചകഭാരം സംരക്ഷിക്കുന്നു.
- source_word: οὐκ ἔστιν ὁ θεὸς
  choice: അവിടുന്ന് ... ദൈവമല്ല
  rationale: മലയാളത്തിലെ സ്വാഭാവികവും ആദരസൂചകവുമായ സർവനാമം ഉപയോഗിച്ച് മുമ്പ് പരാമർശിച്ച ദൈവത്തെ സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിൽ ‘ദൈവം’ വീണ്ടും വ്യക്തമായി വരുന്നതിന്റെ വിവരം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: νεκρῶν
  choice: മരിച്ചവരുടെ
  rationale: നാമവൽക്കരിക്കപ്പെട്ട ബഹുവചന വിശേഷണത്തിന്റെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: ζώντων
  choice: ജീവനുള്ളവരുടെ
  rationale: നാമവൽക്കരിക്കപ്പെട്ട വർത്തമാന കൃദന്തരൂപം ‘മരിച്ചവർ’ എന്നതിനോടുള്ള സംക്ഷിപ്തമായ വിരോധമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: പുനരുത്ഥാനത്തെക്കുറിച്ചുള്ള യേശുവിന്റെ വാദത്തിൽ പിതാക്കന്മാർ ദൈവസന്നിധിയിൽ ജീവിച്ചിരിക്കുന്നു എന്ന സൂചന
  choice: പുനരുത്ഥാനത്തെയോ ഇടക്കാലാവസ്ഥയെയോ കുറിച്ച് വിശദീകരണം ചേർക്കാതെ പ്രസ്താവന നേരിട്ട് വിവർത്തനം ചെയ്യുന്നു.
  alternative: ‘ദൈവത്തിന് ഇപ്പോഴും ജീവനോടിരിക്കുന്നവരുടെ ദൈവമാണ്’ എന്ന വ്യാഖ്യാനപരമായ വികസനം.
  rationale: വാക്യത്തിന്റെ ദൈവശാസ്ത്രപരമായ ശക്തി നിലനിർത്തുമ്പോഴും മൂലവാചകം വ്യക്തമായി പറയുന്നതിലധികം വിവർത്തനത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. തിരുവെഴുത്ത് ഉദ്ധരണിയുടെ ഔപചാരികഭാവത്തിനായി ‘ആകുന്നു’ നിലനിർത്തി; ദൈവത്തെ സൂചിപ്പിക്കാൻ ആദരസൂചകമായ ‘അവിടുന്ന്’ ഉപയോഗിച്ചു.
