lexical_decisions:
- source_word: λέγει
  choice: ചോദിച്ചു
  rationale: ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘പറയുന്നു’ എന്ന ചരിത്രവർത്തമാനമാണെങ്കിലും, ഇവിടെ ചോദ്യം ഉന്നയിക്കുന്ന വാക്കായതിനാൽ ആധുനിക മലയാള ആഖ്യാനത്തിൽ ‘ചോദിച്ചു’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: αὐτοῖς
