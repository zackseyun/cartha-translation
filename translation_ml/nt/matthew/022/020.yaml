- source_word: ἐπιγραφή
  choice: ലിഖിതം
  rationale: നാണയത്തിൽ കൊത്തിയിട്ടുള്ള എഴുത്തിനെ കൃത്യമായി സൂചിപ്പിക്കുന്നു; പൊതുവായ ‘എഴുത്ത്’ എന്നതിനെക്കാൾ സന്ദർഭോചിതം.
- source_word: καὶ
  choice: -വും … -വും
