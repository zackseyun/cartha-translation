    rationale: The immediately preceding subject is David within the question, but the verse begins with Jesus (“അവൻ”), so the Malayalam can be read as Jesus’ saying. The Greek participle introduces David’s words in the ensuing quotation.
  - severity: low
    issue: Footnote a says “മൂലപദക്രമം” when explaining “ആത്മാവിൽ.”
    rationale: The English audit trail concerns adherence to the Greek wording/preposition, not Greek word order. “മൂലപ്രയോഗത്തോട്” is accurate and idiomatic.
