  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς· Πῶς οὖν Δαυὶδ ἐν πνεύματι ⸂καλεῖ αὐτὸν κύριον⸃ λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/043.yaml
  text: He said to them[a], “How then does David, in the Spirit, call him Lord[b], saying,”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “അങ്ങനെയെങ്കിൽ, ദാവീദ് ആത്മാവിൽ[a] അവനെ ‘കർത്താവ്’[b] എന്നു വിളിച്ചുകൊണ്ട് ഇപ്രകാരം പറയുന്നത് എങ്ങനെ:”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ആത്മാവിനാൽ.” ഗ്രീക്ക് പ്രയോഗത്തിന് അവസ്ഥയെയോ കരണത്തെയോ സൂചിപ്പിക്കാം; “ആത്മാവിൽ” എന്നത് മൂലപ്രയോഗത്തോട് കൂടുതൽ അടുത്തുനിൽക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “യജമാനൻ.” ഗ്രീക്കിലെ κύριος എന്ന പദം സാധാരണയായി “കർത്താവ്” എന്നു വിവർത്തനം ചെയ്യപ്പെടുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: അവൻ അവരോടു പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാലം ഇവിടെ ചരിത്രവർത്തമാനമാണ്; മലയാള ആഖ്യാനശൈലിയിൽ ഭൂതകാലം സ്വാഭാവികമാണ്.
- source_word: Πῶς οὖν
  choice: അങ്ങനെയെങ്കിൽ ... എങ്ങനെ?
  rationale: πῶς എന്നതിന്റെ ചോദ്യഭാവവും οὖν എന്നതിന്റെ നിഗമനാത്മക ബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Δαυὶδ
  choice: ദാവീദ്
  rationale: മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ സുപരിചിതമായ പേരുരൂപം.
- source_word: ἐν πνεύματι
  choice: ആത്മാവിൽ
  rationale: ἐν എന്നതിന്റെ അടിസ്ഥാനമായ മണ്ഡലാർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ പരിശുദ്ധാത്മാവാണ് ഉദ്ദേശിക്കപ്പെടുന്നതെന്ന സാധ്യത ശക്തമാണെങ്കിലും ‘ആത്മാവിനാൽ’ എന്ന കരണാർഥം മാത്രം നിർബന്ധിക്കുന്നില്ല.
- source_word: καλεῖ αὐτὸν κύριον
  choice: അവനെ ‘കർത്താവ്’ എന്നു വിളിക്കുന്നത്
  rationale: κύριος എന്ന പദത്തിന്റെ ശീർഷകസ്വഭാവവും സങ്കീർത്തനം 110-ലേക്കുള്ള അന്തർപാഠബന്ധവും ‘കർത്താവ്’ സംരക്ഷിക്കുന്നു.
- source_word: λέγων
  choice: അവൻ പറയുന്നത്
  rationale: തുടർന്നുവരുന്ന ഉദ്ധരണിയിലേക്കുള്ള ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ἐν πνεύματι എന്നതിലെ ‘ആത്മാവ്’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: സന്ദർഭത്തിൽ പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്നതായി മുഖ്യപാഠത്തിൽ ‘ആത്മാവ്’ ഉപയോഗിച്ചു
  alternative: ദാവീദിന്റെ സ്വന്തം ആത്മാവ് അല്ലെങ്കിൽ ആത്മീയാവസ്ഥ
  rationale: പ്രചോദിതമായ തിരുവെഴുത്തുവചനത്തെ ആധാരമാക്കിയുള്ള യേശുവിന്റെ വാദം പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്ന വായനയ്ക്ക് ശക്തി നൽകുന്നു; എന്നാൽ ἐν എന്നതിലെ മണ്ഡലം/കരണം എന്ന വ്യത്യാസം അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
- issue: κύριος എന്ന ശീർഷകത്തിന്റെ വിവർത്തനം
  choice: കർത്താവ്
  alternative: യജമാനൻ
  rationale: മിശിഹാസംബന്ധവും സങ്കീർത്തനം 110-ുമായുള്ള ബന്ധവും ‘കർത്താവ്’ കൂടുതൽ നന്നായി നിലനിർത്തുന്നു; സാധാരണ അധികാരശീർഷകമായ ‘യജമാനൻ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ചോദ്യഘടന ഉപയോഗിച്ചു. തുടർന്നുവരുന്ന ഉദ്ധരണി പ്രതീക്ഷിക്കപ്പെടുന്നതിനാൽ വാക്യം ദ്വിബിന്ദുവിൽ അവസാനിപ്പിച്ചു; അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട പദങ്ങൾക്ക് പിന്നാലെ മുഖ്യപാഠത്തിൽ ചേർത്തു.
