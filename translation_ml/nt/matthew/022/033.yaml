id: MAT.22.33
reference: Matthew 22:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀκούσαντες οἱ ὄχλοι ἐξεπλήσσοντο ἐπὶ τῇ διδαχῇ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/033.yaml
  text: And when the crowds heard it[a], they were astonished at his teaching.
translation:
  language: ml
  text: ജനക്കൂട്ടങ്ങൾ ഇതു കേട്ടപ്പോൾ[a], അവന്റെ ഉപദേശത്തിൽ വിസ്മയിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഇതു കേട്ടശേഷം”; കൂടുതൽ പദാനുപദമായി, “കേട്ടിട്ട്.”
    reason: ἀκούσαντες എന്ന ക്രിയാവിശേഷണരൂപത്തിന്റെ കാലബന്ധം പലവിധത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കാം; ‘ഇതു’ എന്ന കർമം മൂലപാഠത്തിൽ വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും സന്ദർഭത്തിൽനിന്ന് ഗ്രഹിക്കപ്പെടുന്നു.
lexical_decisions:
- source_word: ἀκούσαντες
  choice: ഇതു കേട്ടപ്പോൾ
  rationale: നാമനിർദേശക ബഹുവചനത്തിലുള്ള ഭൂതകാല ക്രിയാവിശേഷണരൂപം ‘ജനക്കൂട്ടങ്ങൾ’ എന്നതിനെ വിശേഷിപ്പിക്കുന്നു. മലയാളത്തിൽ കാലബന്ധം സ്വാഭാവികമായി അറിയിക്കാൻ ‘കേട്ടപ്പോൾ’ എന്നു പരിഭാഷപ്പെടുത്തി; സന്ദർഭത്തിൽ യേശുവിന്റെ തൊട്ടുമുമ്പത്തെ മറുപടിയാണ് സൂചിതമായ കർമം എന്നതിനാൽ ‘ഇതു’ ചേർത്തു.
- source_word: οἱ ὄχλοι
  choice: ജനക്കൂട്ടങ്ങൾ
  rationale: മൂലപാഠത്തിലെ നിർദിഷ്ട ബഹുവചനം നിലനിർത്തുന്നു; ‘പുരുഷാരങ്ങൾ’ എന്നതിനെക്കാൾ ആധുനിക സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: ἐξεπλήσσοντο
  choice: വിസ്മയിച്ചു
  rationale: ജനങ്ങളുടെ ശക്തമായ അതിശയപ്രതികരണം ലളിതവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു. ഗ്രീക്കിലെ അപൂർണ്ണഭൂതകാലത്തിന്റെ ദൈർഘ്യഭാവം മലയാളത്തിൽ നിർബന്ധമായി പ്രകടിപ്പിച്ചാൽ വാചകം അസ്വാഭാവികമാകുമെന്നതിനാൽ സന്ദർഭോചിതമായ സാധാരണ ഭൂതകാലം ഉപയോഗിച്ചു.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: അവന്റെ ഉപദേശത്തിൽ
  rationale: ἐπί സഹിതമുള്ള ദത്തിവ് ഇവിടെ വിസ്മയത്തിന്റെ കാരണമോ ആധാരമോ സൂചിപ്പിക്കുന്നു. ‘ഉപദേശം’ διδαχήയുടെ അർഥം സാങ്കേതികമായ ‘സിദ്ധാന്തം’ എന്ന പദത്തേക്കാൾ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: καὶ
  choice: വാക്യബന്ധത്തിലൂടെ പരോക്ഷമായി പ്രകടിപ്പിച്ചു
  rationale: മുൻസംഭവത്തോടുള്ള ലളിതമായ തുടർച്ച മലയാളത്തിലെ ‘ഇതു കേട്ടപ്പോൾ’ എന്ന ആരംഭത്തിൽ തന്നെ വ്യക്തമാണ്; പ്രത്യേകമായി ‘അപ്പോൾ’ അല്ലെങ്കിൽ ‘കൂടാതെ’ ചേർക്കുന്നത് ഇവിടെ അനാവശ്യവും അല്പം കൃത്രിമവുമാകും.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. മൂലപാഠത്തിലെ ‘ജനക്കൂട്ടങ്ങൾ’ എന്ന ബഹുവചനം നിലനിർത്തുകയും ‘ഉപദേശം’ എന്ന അസാങ്കേതിക പദം ഉപയോഗിക്കുകയും ചെയ്തു.
