  source_fidelity: 'The translation accurately represents the Greek: οἱ ὄχλοι is retained as plural ‘ജനക്കൂട്ടങ്ങൾ’; ἀκούσαντες is naturally rendered by the temporal clause ‘ഇതു കേട്ടപ്പോൾ’; and ἐπὶ τῇ διδαχῇ αὐτοῦ is faithfully conveyed by ‘അവന്റെ ഉപദേശത്തിൽ.’ The supplied ‘ഇതു’ is contextual and is appropriately disclosed in the footnote. The simple Malayalam past ‘വിസ്മയിച്ചു’ is an acceptable idiomatic rendering of the Greek imperfect in this brief narrative reaction.'
