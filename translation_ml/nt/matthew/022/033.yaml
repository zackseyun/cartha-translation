  terminology: ‘ജനക്കൂട്ടങ്ങൾ’ suitably preserves the plural and is contemporary. ‘ഉപദേശം’ is the appropriate nontechnical equivalent for διδαχή in this setting. No doctrinally loaded terminology has been introduced.
