  text: And one of them, a lawyer, asked him a question, testing him.
translation:
  language: ml
  text: 'അവരിൽ ഒരാൾ, ന്യായപ്രമാണപണ്ഡിതൻ[a], യേശുവിനെ പരീക്ഷിച്ചുകൊണ്ട് ചോദിച്ചു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ന്യായപ്രമാണത്തിൽ വിദഗ്ധൻ.’ ഗ്രീക്കുപദം യഹൂദ ന്യായപ്രമാണത്തിൽ വൈദഗ്ധ്യമുള്ള ഒരാളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: അവരിൽ ഒരാൾ… ചോദിച്ചു
  rationale: ഗ്രീക്കിലെ ലളിതമായ ബന്ധകമായ καὶ മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനപ്രവാഹത്തിൽ പ്രത്യേകം ‘പിന്നെ/കൂടാതെ’ എന്നു ചേർക്കാതെ വാക്യക്രമത്തിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: ἐπηρώτησεν
  choice: ചോദിച്ചു
  rationale: ‘ചോദിക്കുക, അന്വേഷിക്കുക’ എന്ന അർഥം നേരിട്ട് നൽകുന്നു; പിന്നാലെ വരുന്ന ചോദ്യത്തിന്റെ ഉള്ളടക്കത്തിലേക്ക് നയിക്കുന്നതിനാൽ ‘ഒരു ചോദ്യം ചോദിച്ചു’ എന്ന ആവർത്തനം ആവശ്യമില്ല.
- source_word: εἷς ἐξ αὐτῶν
  choice: അവരിൽ ഒരാൾ
  rationale: മുമ്പ് പരാമർശിച്ച കൂട്ടത്തിൽപ്പെട്ട ഒരാൾ എന്ന ഭാഗികബന്ധം സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: νομικὸς
  choice: ന്യായപ്രമാണപണ്ഡിതൻ
  rationale: ഇവിടെ ആധുനിക കോടതിവക്കീലല്ല, യഹൂദ ന്യായപ്രമാണത്തിൽ വൈദഗ്ധ്യമുള്ളയാളാണ് ഉദ്ദേശ്യം; അതിനാൽ സാഹചര്യാർത്ഥം വ്യക്തമാക്കുന്ന പദം തിരഞ്ഞെടുത്തു.
- source_word: πειράζων
  choice: പരീക്ഷിച്ചുകൊണ്ട്
  rationale: ചോദ്യം ചോദിച്ച രീതി/ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന സമകാലിക ക്രിയാവിശേഷണപ്രയോഗം; പാപത്തിലേക്കു പ്രലോഭിപ്പിക്കുക എന്ന ചുരുങ്ങിയ അർഥം അനാവശ്യമായി ചുമത്തുന്നില്ല.
- source_word: αὐτόν
  choice: യേശുവിനെ
  rationale: ഗ്രീക്കിൽ സർവനാമമാണെങ്കിലും മലയാളത്തിൽ മുൻസന്ദർഭത്തിലെ പരാമർശം വ്യക്തമായി നിലനിർത്താൻ പേരുപയോഗിക്കുന്നത് സ്വാഭാവികവും അവ്യക്തത ഒഴിവാക്കുന്നതുമാണ്.
theological_decisions:
- issue: πειράζων എന്ന പദം യേശുവിനോടുള്ള ഉദ്ദേശ്യത്തെ എങ്ങനെ അവതരിപ്പിക്കണം
  choice: യേശുവിനെ പരീക്ഷിച്ചുകൊണ്ട്
  alternative: യേശുവിനെ പ്രലോഭിപ്പിച്ചുകൊണ്ട്
  rationale: പദത്തിന് പരീക്ഷിക്കുക, പരിശോധിക്കുക, പ്രലോഭിപ്പിക്കുക എന്നീ സാധ്യതകളുണ്ട്. ഇവിടെ എതിരാളിത്തപരമായ പരിശോധനയാണ് സന്ദർഭത്തിന് യോജിക്കുന്നത്; എങ്കിലും ചോദിക്കുന്നവന്റെ പ്രവൃത്തിയുടെ പ്രതികൂല ഭാവം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘വക്കീൽ’ എന്ന ആധുനിക തൊഴിൽസൂചന ഒഴിവാക്കി ഒന്നാം നൂറ്റാണ്ടിലെ യഹൂദ പശ്ചാത്തലം വ്യക്തമാക്കുന്നു; തുടർന്നുവരുന്ന നേരിട്ടുള്ള ചോദ്യത്തിന് അനുയോജ്യമായി അവസാനം ദ്വിബിന്ദു ഉപയോഗിച്ചു.
