id: MAT.22.11
reference: Matthew 22:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰσελθὼν δὲ ὁ βασιλεὺς θεάσασθαι τοὺς ἀνακειμένους εἶδεν ἐκεῖ ἄνθρωπον οὐκ ἐνδεδυμένον ἔνδυμα γάμου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/011.yaml
  text: But when the king came in to look at the guests reclining at the table[b][a], he saw there a man not dressed in wedding clothes.
translation:
  language: ml
  text: എന്നാൽ രാജാവ് വിരുന്നിനിരുന്നവരെ[b] കാണാൻ അകത്തു വന്നപ്പോൾ, വിവാഹവസ്ത്രം[a] ധരിക്കാത്ത ഒരു മനുഷ്യനെ അവിടെ കണ്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘വിവാഹത്തിനുള്ള വസ്ത്രം ധരിക്കാത്ത ഒരു മനുഷ്യനെ.’'
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ ‘ചാരിക്കിടന്നവരെ’ എന്നാണ്; ഔപചാരിക വിരുന്നുകളിൽ അതിഥികൾ മേശയ്ക്കരികിൽ ചാരിക്കിടന്ന് ഭക്ഷണം കഴിക്കുന്ന പുരാതന പതിവിനെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: εἰσελθὼν
  choice: അകത്തു വന്നപ്പോൾ
  rationale: പ്രധാന ക്രിയയ്ക്കു മുമ്പുള്ള രാജാവിന്റെ പ്രവേശനത്തെ സൂചിപ്പിക്കുന്ന aorist participle സ്വാഭാവികമായ മലയാള കാലവാക്യമായി നൽകി.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: കഥയിൽ പരിശോധനയും സംഘർഷവും ആരംഭിക്കുന്ന നേരിയ വൈരുധ്യപരമായ വഴിത്തിരിവ് നിലനിർത്തുന്നു.
- source_word: ὁ βασιλεὺς
  choice: രാജാവ്
  rationale: രാജകീയ ഉപമാസന്ദർഭത്തിലെ βασιλεύς എന്ന പദത്തിന്റെ നേരായ മലയാളരൂപം.
- source_word: θεάσασθαι
  choice: കാണാൻ
  rationale: ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന infinitive; ഔപചാരികമായ ‘പരിശോധിക്കാൻ’ എന്നതിനെക്കാൾ മൂലത്തിലെ വിശാലമായ അർഥം നിലനിർത്തുന്നു.
- source_word: τοὺς ἀνακειμένους
  choice: വിരുന്നിനിരുന്നവരെ
  rationale: പുരാതന വിരുന്നിൽ ഭക്ഷണത്തിനായി ചാരിക്കിടന്ന അതിഥികളെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാള മുഖ്യവാക്യത്തിൽ സ്വാഭാവികതയ്ക്കായി വിരുന്നിൽ ഇരിക്കുന്നവരെന്ന അർഥം നൽകി; ശാരീരിക ഭാവം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- source_word: εἶδεν
  choice: കണ്ടു
  rationale: ὁράω എന്ന ക്രിയയുടെ ലളിതവും നേരായതുമായ ആഖ്യാനരൂപം.
- source_word: ἐκεῖ
  choice: അവിടെ
  rationale: സ്ഥലസൂചക ക്രിയാവിശേഷണത്തിന്റെ സ്വാഭാവിക മലയാള പരിഭാഷ.
- source_word: ἄνθρωπον
  choice: ഒരു മനുഷ്യനെ
  rationale: കഥയിലെ ഒറ്റ പുരുഷവ്യക്തിയെ സൂചിപ്പിക്കുന്ന masculine singular രൂപം പൊതുവായ ‘ആരെയോ’ എന്നാക്കി മങ്ങിക്കാതെ നിലനിർത്തുന്നു.
- source_word: οὐκ ἐνδεδυμένον
  choice: ധരിക്കാത്ത
  rationale: ആ വ്യക്തിയുടെ അന്നത്തെ വസ്ത്രധാരണാവസ്ഥയെ വിവരിക്കുന്ന perfect participle മലയാളത്തിൽ സ്വാഭാവികമായി പകർത്തുന്നു.
- source_word: ἔνδυμα γάμου
  choice: വിവാഹവസ്ത്രം
  rationale: വിവാഹവിരുന്നിന് യോജിച്ച വസ്ത്രത്തെ സൂചിപ്പിക്കുന്ന singular പ്രയോഗം മലയാളത്തിൽ സംക്ഷിപ്തമായും വ്യക്തമായും നിലനിർത്തുന്നു.
theological_decisions:
- issue: വിരുന്നിലെ അതിഥികളുടെ ശരീരഭാവം
  choice: മുഖ്യവാക്യത്തിൽ ‘വിരുന്നിനിരുന്നവർ’ എന്നു സ്വാഭാവികമായി നൽകി, ചാരിക്കിടക്കുന്ന പുരാതന വിരുന്നുരീതി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: ‘ചാരിക്കിടന്നവരെ’ എന്ന് മുഖ്യവാക്യത്തിൽ അക്ഷരാർഥത്തിൽ നൽകുക.
  rationale: ἀνακειμένους എന്ന പദത്തിന്റെ ചരിത്രപരമായ സൂക്ഷ്മത നഷ്ടപ്പെടുത്താതെ, സാധാരണ മലയാളവായനക്കാരന് രംഗം തെറ്റിദ്ധരിക്കാത്തവിധം അവതരിപ്പിക്കുന്നു.
- issue: ἄνθρωπον എന്ന പദത്തിന്റെ ലിംഗസൂചന
  choice: ഒരു മനുഷ്യനെ
  alternative: ഒരാളെ
  rationale: ഇത് മനുഷ്യരാശിയെ പൊതുവായി പരാമർശിക്കുന്നതല്ല, ഉപമയിലെ ഏക പുരുഷകഥാപാത്രത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ മൂലത്തിലെ വ്യക്തിസൂചന നിലനിർത്തി.
- issue: വിവാഹവസ്ത്രത്തിന്റെ പ്രതീകാർഥം
  choice: പ്രതീകാർഥം വാക്യത്തിലേക്ക് ചേർക്കാതെ ‘വിവാഹവസ്ത്രം’ എന്ന ദൃശ്യരൂപം മാത്രം നിലനിർത്തി.
  alternative: നീതി, രക്ഷ, യോഗ്യത തുടങ്ങിയ ഒരു പ്രത്യേക വ്യാഖ്യാനം പരിഭാഷയിൽ വ്യക്തമാക്കുക.
  rationale: ഉപമയിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും വ്യാഖ്യാനസാധ്യതയും പരിഭാഷകൻ മുൻകൂട്ടി തീർപ്പാക്കാതിരിക്കാൻ.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘വിരുന്നിനിരുന്നവർ’ എന്ന പ്രയോഗം വിരുന്നുസന്ദർഭം വ്യക്തമാക്കുന്നു; മൂലത്തിലെ പുരാതന ശാരീരികഭാവം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാക്യത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
