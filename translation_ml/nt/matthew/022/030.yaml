id: MAT.22.30
reference: Matthew 22:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν γὰρ τῇ ἀναστάσει οὔτε γαμοῦσιν οὔτε ⸀γαμίζονται, ἀλλ’ ὡς ἄγγελοι ⸀θεοῦ ἐν ⸀τῷ οὐρανῷ εἰσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/030.yaml
  text: For in the resurrection they neither marry nor are given in marriage[a], but are like the angels of God in heaven.
translation:
  language: ml
  text: കാരണം, പുനരുത്ഥാനത്തിൽ[a] അവർ വിവാഹം കഴിക്കുകയോ വിവാഹത്തിന് കൊടുക്കപ്പെടുകയോ ചെയ്യുന്നില്ല; എന്നാൽ, സ്വർഗത്തിലുള്ള ദൈവത്തിന്റെ ദൂതന്മാരെപ്പോലെ ആയിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പുനരുത്ഥാനസമയത്ത്.’
    reason: ἐν ... τῇ ἀναστάσει എന്ന പ്രയോഗം പുനരുത്ഥാനാവസ്ഥയെയോ പുനരുത്ഥാനം സംഭവിക്കുന്ന സമയത്തെയോ സൂചിപ്പിക്കാം.
lexical_decisions:
- source_word: ἐν ... τῇ ἀναστάσει
  choice: പുനരുത്ഥാനത്തിൽ
  rationale: ἐν എന്ന ഉപസർഗവും പുനരുത്ഥാനജീവിതത്തിന്റെ അവസ്ഥയെയോ കാലത്തെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: γαμοῦσιν
  choice: വിവാഹം കഴിക്കുക
  rationale: വിവാഹബന്ധത്തിൽ പ്രവേശിക്കുക എന്ന പൊതുവായ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: γαμίζονται
  choice: വിവാഹം ചെയ്തുകൊടുക്കപ്പെടുക
  rationale: മുൻക്രിയയിൽനിന്നു വ്യത്യസ്തമായ ഗ്രീക്ക് കർമണിപ്രയോഗം നിലനിർത്തി, മറ്റൊരാളാൽ വിവാഹത്തിൽ നൽകപ്പെടുക എന്ന ആശയം വ്യക്തമാക്കുന്നു.
- source_word: ὡς
  choice: ദൂതന്മാരെപ്പോലെ
  rationale: ഇത് സാദൃശ്യം സൂചിപ്പിക്കുന്നു; പുനരുത്ഥാനം പ്രാപിച്ചവർ ദൂതന്മാരായി മാറുന്നു എന്ന തിരിച്ചറിയൽ ഇതിൽ ആരോപിക്കുന്നില്ല.
- source_word: ἄγγελοι θεοῦ
  choice: ദൈവത്തിന്റെ ദൂതന്മാർ
  rationale: θεοῦ എന്ന ഷഷ്ഠീവിഭക്തിബന്ധം വ്യക്തമായി പ്രതിനിധീകരിക്കുകയും മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: ἐν τῷ οὐρανῷ
  choice: സ്വർഗത്തിലുള്ള
  rationale: ഇവിടെ οὐρανός ഭൗതിക ആകാശത്തെയല്ല, ദൂതന്മാരുടെ സ്വർഗീയ വാസമണ്ഡലത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തിന് വിശദീകരണകാരണം നൽകുന്ന γάρ എന്ന ബന്ധം ലളിതവും വ്യക്തവുമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: പുനരുത്ഥാനം പ്രാപിച്ചവരും ദൂതന്മാരും തമ്മിലുള്ള സാദൃശ്യത്തിന്റെ സ്വഭാവം
  choice: വിവാഹമില്ലാത്ത കാര്യത്തിൽ അവർ ദൂതന്മാരെപ്പോലെയാണ്; അവർ ദൂതന്മാരായി മാറുന്നു എന്ന് വാക്യം പറയുന്നില്ല.
  alternative: ഈ താരതമ്യം വിപുലീകരിച്ച് പൊതുവായ ഒരു ദൂതസദൃശ അസ്തിത്വരീതിയെ സൂചിപ്പിക്കുന്നതായി വായിക്കാം.
  rationale: ὡς സാദൃശ്യം സൂചിപ്പിക്കുന്നു; അടുത്ത സന്ദർഭം വിവാഹമില്ലായ്മയെ താരതമ്യത്തിന്റെ വ്യക്തമായ വിഷയമാക്കുന്നു. അതിനാൽ ‘-പോലെ’ എന്ന പ്രയോഗം സാദൃശ്യം നിലനിർത്തുന്നു, സ്വഭാവപരമായ ഐക്യം ആരോപിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. γαμοῦσιν, γαμίζονται എന്നീ വ്യത്യസ്ത ക്രിയാരൂപങ്ങളുടെ ഭേദം മലയാളത്തിൽ കഴിയുന്നത്ര വ്യക്തമായി നിലനിർത്തി.
