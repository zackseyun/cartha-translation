review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the explanatory γάρ, the resurrection setting, the distinction between marrying and being given in marriage, the comparative force of ὡς, and both ‘of God’ and ‘in heaven.’ The passive Malayalam expression for γαμίζονται, however, is not idiomatic enough for a public translation.
  naturalness: ‘വിവാഹം ചെയ്തുകൊടുക്കപ്പെടുക’ is cumbersome and unnatural Malayalam. ‘വിവാഹത്തിന് കൊടുക്കപ്പെടുക’ is the established, clear expression for being given in marriage. Replacing ‘മറിച്ച്’ with ‘എന്നാൽ’ gives a more direct and natural rendering of the Greek contrast.
  terminology: ‘പുനരുത്ഥാനം,’ ‘വിവാഹം കഴിക്കുക,’ ‘ദൈവത്തിന്റെ ദൂതന്മാർ,’ and ‘സ്വർഗം’ are appropriate modern-standard Malayalam terms. The revised wording preserves the distinct active/passive marriage verbs without importing doctrinal implications.
  issues:
  - severity: medium
    issue: The rendering ‘വിവാഹം ചെയ്തുകൊടുക്കപ്പെടുകയോ’ is unnatural and structurally heavy.
    rationale: Although it attempts to reproduce the passive γαμίζονται, it does not read naturally in modern standard Malayalam. ‘വിവാഹത്തിന് കൊടുക്കപ്പെടുക’ preserves the passive sense—being given in marriage—and clearly distinguishes it from ‘വിവാഹം കഴിക്കുക.’
  - severity: low
    issue: ‘മറിച്ച്’ is less precise stylistically for the Greek ἀλλά in this contrast.
    rationale: The source contrasts the absence of marriage with being like God’s angels; ‘എന്നാൽ’ expresses this adversative transition naturally without suggesting replacement.
