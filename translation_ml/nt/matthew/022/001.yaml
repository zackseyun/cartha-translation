- from: യേശു വീണ്ടും അവരോടു ഉപമകളിലൂടെ ഉത്തരം പറഞ്ഞത്:[a]
  to: യേശു വീണ്ടും അവരോടു ഉപമകളിലൂടെ ഉത്തരം പറഞ്ഞ് ഇങ്ങനെ പറഞ്ഞു:[a]
  rationale: ‘ഉത്തരം പറഞ്ഞ് ഇങ്ങനെ പറഞ്ഞു’ Greek participial ἀποκριθεὶς and finite εἶπεν ... λέγων are represented in natural Malayalam. ‘ഇങ്ങനെ’ makes the introductory function of λέγων explicit and prepares appropriately for the discourse that follows, without adding substantive content. The footnote continues to document the idiomatic use of ‘answered.’
  reviewer_model: gpt-5.6-terra
