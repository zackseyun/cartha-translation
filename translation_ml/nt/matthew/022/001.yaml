id: MAT.22.1
reference: Matthew 22:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἀποκριθεὶς ὁ Ἰησοῦς πάλιν εἶπεν ⸂ἐν παραβολαῖς αὐτοῖς⸃ λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/001.yaml
  text: 'And Jesus answered and again spoke to them in parables[a], saying:'
translation:
  language: ml
  text: യേശു വീണ്ടും അവരോടു ഉപമകളിലൂടെ ഉത്തരം പറഞ്ഞ് ഇങ്ങനെ പറഞ്ഞു:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യേശു അവരോടു വീണ്ടും ഉപമകളിലൂടെ ഉത്തരം പറഞ്ഞുകൊണ്ട് പറഞ്ഞു’ എന്നും വിവർത്തനം ചെയ്യാം. തൊട്ടുമുമ്പ് നേരിട്ടൊരു ചോദ്യം പറഞ്ഞിട്ടില്ലെങ്കിലും, ഗ്രീക്കിൽ ‘ഉത്തരം പറഞ്ഞു’ എന്നത് സാധാരണ ആഖ്യാനപ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: വാക്യാരംഭത്തിൽ പ്രത്യേകം പദമായി ചേർത്തില്ല
  rationale: മലയാളത്തിൽ മുൻവിവരണത്തോടുള്ള ബന്ധം ക്രിയാവിശേഷണമായ ‘വീണ്ടും’ കൊണ്ടും വാക്യക്രമം കൊണ്ടും സ്വാഭാവികമായി വ്യക്തമാകുന്നു; ‘പിന്നെ’ എന്നു ചേർത്താൽ ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത കാലക്രമസൂചന വരാം.
- source_word: ἀποκριθεὶς
  choice: ഉത്തരം പറഞ്ഞത്
  rationale: ἀποκρίνομαι എന്നതിന്റെ സാധാരണ അർഥം നിലനിർത്തുന്നു. തൊട്ടുമുമ്പ് നേരിട്ടൊരു ചോദ്യം ഇല്ലെങ്കിലും ഗ്രീക്ക് ആഖ്യാനത്തിൽ ഇത് സാധാരണ പ്രയോഗമാണ്.
- source_word: ὁ Ἰησοῦς
  choice: യേശു
  rationale: വ്യക്തിനാമത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: പ്രസംഗം ആവർത്തിച്ച് തുടരുന്നതിനെ നേരിട്ടും സ്വാഭാവികമായും സൂചിപ്പിക്കുന്നു.
- source_word: εἶπεν ... λέγων
  choice: 'പറഞ്ഞത്:'
  rationale: രണ്ട് ഗ്രീക്ക് സംസാരക്രിയകളെയും പദാനുപദമായി ആവർത്തിച്ചാൽ മലയാളത്തിൽ കൃത്രിമമാകും. ‘പറഞ്ഞത്:’ തുടർന്നുവരുന്ന വാക്കുകളെ പരിചയപ്പെടുത്തുകയും മുഖ്യ അർഥം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐν παραβολαῖς
  choice: ഉപമകളിലൂടെ
  rationale: ἐν + ദാതീവ് ഇവിടെ സംസാരത്തിന്റെ മാധ്യമമോ രീതിയോ സൂചിപ്പിക്കുന്നു; ‘ഉപമകളിലൂടെ’ ആ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: αὐτοῖς
  choice: അവരോടു
  rationale: യേശു അഭിസംബോധന ചെയ്ത ശ്രോതാക്കളെ സൂചിപ്പിക്കുന്ന ദാതീവ് സർവനാമത്തിന്റെ സ്വാഭാവിക മലയാളസമാനം.
theological_decisions:
- issue: തൊട്ടുമുമ്പ് വ്യക്തമായ ചോദ്യം ഇല്ലാത്തിടത്തെ ‘ഉത്തരം പറഞ്ഞു’ എന്ന പ്രയോഗം
  choice: ‘ഉത്തരം പറഞ്ഞത്’ എന്നു നിലനിർത്തി
  alternative: ‘സംസാരിച്ചു’ അല്ലെങ്കിൽ ‘പറഞ്ഞു’ എന്നു മൃദൂകരിക്കുക
  rationale: ഇത് പ്രത്യേക ദൈവശാസ്ത്രവാദമല്ല, ഗ്രീക്ക് ആഖ്യാനത്തിലെ സാധാരണ ഭാഷാശൈലിയാണ്. മൂലത്തിലെ പദപ്രയോഗവും മുൻസംഭാഷണത്തോടുള്ള ബന്ധവും നിലനിർത്താൻ ‘ഉത്തരം’ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. അടുത്ത വാക്യത്തിലെ നേരിട്ടുള്ള പ്രസംഗത്തിലേക്കുള്ള പ്രവേശനം സൂചിപ്പിക്കാൻ അവസാനം ദ്വിബിന്ദു ഉപയോഗിച്ചു.
