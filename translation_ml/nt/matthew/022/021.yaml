  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγουσιν ⸀αὐτῷ· Καίσαρος. τότε λέγει αὐτοῖς· Ἀπόδοτε οὖν τὰ Καίσαρος Καίσαρι καὶ τὰ τοῦ θεοῦ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/021.yaml
  text: They said to him[a], “Caesar’s.” Then he said to them, “Therefore render to Caesar the things that are Caesar’s, and to God the things that are God’s.”
translation:
  language: ml
  text: 'അവർ അവനോടു പറഞ്ഞു: “കൈസറുടേത്.” അപ്പോൾ അവൻ അവരോടു പറഞ്ഞു: “അതിനാൽ കൈസറുടേത് കൈസറിനും ദൈവത്തിന്റേത് ദൈവത്തിനും തിരികെ കൊടുക്കുക[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അർഹമായത് നൽകുക” അല്ലെങ്കിൽ “അടയ്ക്കുക” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് ക്രിയയ്ക്ക് “തിരികെ കൊടുക്കുക,” “അടയ്ക്കുക,” “കടപ്പെട്ടത് നൽകുക” എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν / λέγει
  choice: പറഞ്ഞു / പറഞ്ഞു
  rationale: ഗ്രീക്കിൽ ചരിത്രവർത്തമാനകാലമാണെങ്കിലും, സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലിക്കായി ഭൂതകാലത്തിൽ പരിഭാഷപ്പെടുത്തി.
- source_word: Καίσαρος
  choice: കൈസറുടേത്
  rationale: നാണയത്തിലെ രൂപവും ലിഖിതവും ആരുടേതെന്ന മുൻചോദ്യത്തിനുള്ള സംക്ഷിപ്ത ഉത്തരമായ ജനിറ്റീവ് രൂപം മലയാളത്തിലെ ഉടമസ്ഥതാസൂചക പ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: τότε
  choice: അപ്പോൾ
  rationale: സംഭാഷണത്തിലെ തുടർന്നുള്ള ഘട്ടത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: Ἀπόδοτε
  choice: തിരികെ കൊടുക്കുക
  rationale: ἀποδίδωμι എന്ന ക്രിയയിലെ തിരികെ നൽകുക, കടപ്പെട്ടത് കൊടുക്കുക എന്നീ അർഥസാധ്യതകളിൽ ആദ്യത്തേത് മുഖ്യപാഠത്തിൽ വ്യക്തമായി സൂക്ഷിക്കുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: οὖν
  choice: അതിനാൽ
  rationale: അവരുടെ ‘കൈസറുടേത്’ എന്ന ഉത്തരത്തിൽനിന്ന് യേശു നിഗമനം ഉന്നയിക്കുന്ന ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: τὰ Καίσαρος … τὰ τοῦ θεοῦ
  choice: കൈസറിനുള്ളത് … ദൈവത്തിനുള്ളത്
  rationale: ഉടമസ്ഥതയെയോ അവകാശത്തെയോ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ഘടനയും ഇരുക്ലോസുകളിലെ വാചകസമാന്തരതയും സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Καίσαρι … τῷ θεῷ
  choice: കൈസറിനും … ദൈവത്തിനും
  rationale: ആർക്കാണ് കൊടുക്കേണ്ടതെന്ന് സൂചിപ്പിക്കുന്ന ഡേറ്റീവ് രൂപങ്ങൾ മലയാളത്തിലെ ‘-ന്’ വിഭക്തിയിലൂടെ പരിഭാഷപ്പെടുത്തി; സമാന്തര ഘടനയ്ക്കായി ‘-ഉം’ ചേർത്തു.
theological_decisions:
- issue: പൗരാധികാരത്തോടും ദൈവത്തോടുമുള്ള ബാധ്യതയെക്കുറിച്ചുള്ള കല്പനയുടെ വ്യാപ്തി
  choice: കൈസറിനുള്ളതും ദൈവത്തിനുള്ളതും അവരവർക്കു കൊടുക്കണമെന്ന സമാന്തര കല്പന അതേപടി നിലനിർത്തി.
  alternative: ഇത് നികുതി അടയ്ക്കുന്നതിനെക്കുറിച്ചുള്ള പരിമിത പ്രസ്താവനയായോ ഭരണകൂടത്തിന് സമ്പൂർണ അധികാരം നൽകുന്ന പ്രസ്താവനയായോ വിശദീകരിക്കുക.
  rationale: ഗ്രീക്ക് പാഠം പൗരബാധ്യതയും ദൈവത്തിന്റെ അവകാശവാദവും തമ്മിലുള്ള വേർതിരിവും പിരിമുറുക്കവും നിലനിർത്തുന്നു; പിന്നീടുള്ള രാഷ്ട്രീയമോ സഭാപരമോ ആയ സിദ്ധാന്തങ്ങൾ പരിഭാഷയിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘കൈസർ’ എന്ന ചരിത്രപദവി നിലനിർത്തി. കല്പനാവാക്യത്തിന്റെ ഇരുഭാഗങ്ങളിലുമുള്ള സമാന്തരത സംരക്ഷിക്കുകയും ആവശ്യമില്ലാത്ത രാഷ്ട്രീയ-ദൈവശാസ്ത്ര വിശദീകരണം ഒഴിവാക്കുകയും ചെയ്തു.
