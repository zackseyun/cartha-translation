  source_fidelity: 'ഗ്രീക്കിലെ ക്രമവും അർഥവും വിശ്വസ്തമായി പ്രതിഫലിക്കുന്നു: τότε = «അപ്പോൾ», τοῖς διακόνοις = «പരിചാരകരോടു», Δήσαντες-ന്റെ മുൻകൂർ പ്രവൃത്തി «ബന്ധിച്ച്», αὐτοῦ πόδας καὶ χεῖρας-ന്റെ «കാലുകളും കൈകളും», ബലമായ ἐκβάλετε «എറിഞ്ഞുകളയുക», കൂടാതെ ഭാവികാലമായ ἔσται «ഉണ്ടാകും». «പുറത്തെ ഇരുട്ട്» എന്ന മത്തായിയൻ പ്രയോഗം വ്യാഖ്യാനപരമായി ചുരുക്കാതെ നിലനിർത്തിയിരിക്കുന്നു.'
  naturalness: വാക്യം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്. «പല്ലുകടി» എന്ന പ്രയോഗം «പല്ലുകടിയും» എന്ന രൂപത്തിൽ സ്വാഭാവികമായും സ്ഥാപിത ബൈബിൾപ്രയോഗമായും വരുന്നു. നേരിട്ടുള്ള ആജ്ഞയുടെ കാഠിന്യം നഷ്ടപ്പെടുന്നില്ല.
