id: MAT.22.13
reference: Matthew 22:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τότε ⸂ὁ βασιλεὺς εἶπεν⸃ τοῖς διακόνοις· Δήσαντες αὐτοῦ πόδας καὶ χεῖρας ⸂ἐκβάλετε αὐτὸν⸃ εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/013.yaml
  text: Then the king said to the attendants[a], ‘Bind his feet and hands and throw him out into the outer darkness. In that place there will be weeping and gnashing of teeth.’
translation:
  language: ml
  text: 'അപ്പോൾ രാജാവ് പരിചാരകരോടു പറഞ്ഞു: “അവന്റെ കാലുകളും കൈകളും ബന്ധിച്ച് അവനെ പുറത്തെ ഇരുട്ടിലേക്ക് എറിഞ്ഞുകളയുക. അവിടെ കരച്ചിലും പല്ലുകടിയും ഉണ്ടാകും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: അപ്പോൾ
  rationale: ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്ന സാധാരണ കാലസൂചകപ്രയോഗം.
- source_word: ὁ βασιλεὺς
  choice: രാജാവ്
  rationale: ഉപമയിലെ രാജകീയ പശ്ചാത്തലവും βασιλεύς എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥവും നിലനിർത്തുന്നു.
- source_word: τοῖς διακόνοις
  choice: പരിചാരകരോടു
  rationale: വിരുന്നിൽ രാജാവിനെ സേവിക്കുന്നവരെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; സഭാപരമായ ‘ശുശ്രൂഷകർ’ എന്ന അർഥം അനാവശ്യമായി കൊണ്ടുവരുന്നില്ല.
- source_word: Δήσαντες
  choice: ബന്ധിച്ച്
  rationale: പ്രധാന ആജ്ഞയ്ക്കു മുമ്പുള്ള aorist participle മലയാളത്തിൽ തുടർപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന വിനയെച്ചമായി സ്വാഭാവികമായി വരുന്നു; ബന്ധനത്തിന്റെ ശക്തിയും നിലനിൽക്കുന്നു.
- source_word: αὐτοῦ πόδας καὶ χεῖρας
  choice: അവന്റെ കാലുകളും കൈകളും
  rationale: ഗ്രീക്കിലെ ‘കാലുകൾ, കൈകൾ’ എന്ന ക്രമം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: ἐκβάλετε αὐτὸν
  choice: അവനെ ... എറിഞ്ഞുകളയുക
  rationale: ἐκβάλλω സൂചിപ്പിക്കുന്ന ബലമായ പുറത്താക്കലും ആജ്ഞയുടെ കാഠിന്യവും വ്യക്തമായി നൽകുന്നു.
- source_word: εἰς τὸ σκότος τὸ ἐξώτερον
  choice: പുറത്തെ ഇരുട്ടിലേക്ക്
  rationale: വിരുന്നിന്റെ പ്രകാശത്തിന് പുറത്തുള്ള ഇരുട്ട് എന്ന സ്ഥലപരമായ പ്രതീകം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; അതിനെ വ്യാഖ്യാനിച്ച് ‘നരകം’ എന്നു ചുരുക്കുന്നില്ല.
- source_word: ἐκεῖ ἔσται
  choice: അവിടെ ... ഉണ്ടാകും
  rationale: സ്ഥലസൂചനയും ഭാവികാലവും ചുരുക്കവും സ്വാഭാവികവുമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: ὁ κλαυθμὸς
  choice: കരച്ചിൽ
  rationale: ദുഃഖപൂർണമായ കരച്ചിലിനെ നേരിട്ട് സൂചിപ്പിക്കുന്ന പൊതുവായ ആധുനിക മലയാളപദം.
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: പല്ലുകടി
  rationale: വേദനയെയോ രോഷത്തെയോ സൂചിപ്പിക്കാവുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ദൃശ്യത നിലനിർത്തുകയും അതിന്റെ വികാരം ഏകാർഥമാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ഉപമയിലെ പുറത്താക്കലിന്റെ സ്വഭാവം
  choice: ‘പുറത്തെ ഇരുട്ട്’ എന്ന മൂർത്തമായ ന്യായവിധി-പ്രതീകം അതേപടി നിലനിർത്തി.
  alternative: അതിനെ നേരിട്ട് ‘നരകം’ എന്നു വ്യാഖ്യാനിക്കുകയോ വിരുന്നിൽനിന്നുള്ള സാമൂഹിക പുറത്താക്കൽ മാത്രമായി മൃദൂകരിക്കുകയോ ചെയ്യുക.
  rationale: ഗ്രീക്ക് പാഠം ഉപമയ്ക്കുള്ളിൽ ശക്തമായ ന്യായവിധിചിത്രം നൽകുന്നുവെങ്കിലും അതിന്റെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തി ഇവിടെ വിശദീകരിക്കുന്നില്ല; അതിനാൽ വിവർത്തനം ആ സംഘർഷം പരിഹരിക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. നേരിട്ടുള്ള ആജ്ഞയുടെ കാഠിന്യവും ഉപമയുടെ ദൃശ്യഭാവവും സംരക്ഷിച്ചു; സഭാപരമായ സാങ്കേതിക പദങ്ങൾ ഒഴിവാക്കി.
