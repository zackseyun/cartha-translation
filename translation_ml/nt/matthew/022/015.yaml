id: MAT.22.15
reference: Matthew 22:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τότε πορευθέντες οἱ Φαρισαῖοι συμβούλιον ἔλαβον ὅπως αὐτὸν παγιδεύσωσιν ἐν λόγῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/015.yaml
  text: Then the Pharisees went and took counsel how they might trap him in his words[a].
translation:
  language: ml
  text: അപ്പോൾ പരീശന്മാർ പോയി, യേശു പറയുന്ന വാക്കിലൂടെ അവനെ എങ്ങനെ കുടുക്കാമെന്ന് ആലോചന നടത്തി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവനെ വാക്കിൽ കുടുക്കാൻ എങ്ങനെ കഴിയുമെന്ന് അവർ ഗൂഢാലോചന നടത്തി.’
    reason: ἐν λόγῳയുടെ കൂടുതൽ സംക്ഷിപ്തമായ രൂപവും συμβούλιον ἔλαβον എന്നതിന് സാധ്യമായ കൂടുതൽ ശക്തമായ പരിഭാഷാവികല്പവും നൽകുന്നു.
lexical_decisions:
- source_word: Τότε
  choice: അപ്പോൾ
  rationale: കഥയിലെ സംഭവക്രമം സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളപ്രയോഗം.
- source_word: πορευθέντες
  choice: പോയി
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള ഈ ഭൂതകാല കൃദന്തത്തെ മലയാളത്തിലെ സ്വാഭാവികമായ അനുക്രമക്രിയയായി അവതരിപ്പിക്കുന്നു.
- source_word: οἱ Φαρισαῖοι
  choice: പരീശന്മാർ
  rationale: ഈ യഹൂദ മതവിഭാഗത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള പേരാണ്.
- source_word: συμβούλιον ἔλαβον
  choice: ആലോചിച്ചു
  rationale: ‘കൂടിയാലോചിച്ച് പദ്ധതി രൂപപ്പെടുത്തി’ എന്ന പ്രയോഗാർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ദുഷ്ടലക്ഷ്യം തുടർന്നുള്ള ഉദ്ദേശ്യഭാഗം വ്യക്തമാക്കുന്നു.
- source_word: ὅπως
  choice: എങ്ങനെ കഴിയുമെന്ന്
  rationale: അവരുടെ ആലോചനയുടെ ഉള്ളടക്കവും ഉദ്ദേശ്യവും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: αὐτὸν
  choice: യേശുവിനെ
  rationale: സന്ദർഭത്തിലെ പ്രതിനിധി യേശുവാണെന്ന് മലയാളത്തിൽ വ്യക്തതയ്ക്കായി പേര് ഉപയോഗിക്കുന്നു.
- source_word: παγιδεύσωσιν
  choice: കുടുക്കാൻ
  rationale: കെണിയിൽ അകപ്പെടുത്തുക എന്ന രൂപകവും ശത്രുതാപരമായ ഉദ്ദേശ്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: ἐν λόγῳ
  choice: അദ്ദേഹത്തിന്റെ വാക്കിൽ
  rationale: അദ്ദേഹം പറയുന്ന ഏതെങ്കിലും വാക്കിനെ അടിസ്ഥാനമാക്കി കുടുക്കുക എന്ന ആശയം നൽകുന്നു; ഏകവചനമായ λόγῳയുടെ രൂപം കഴിയുന്നത്ര നിലനിർത്തുന്നു.
theological_decisions:
- issue: συμβούλιον ἔλαβον എന്നതിൽ ശത്രുതയുടെ അളവ്
  choice: ‘ആലോചിച്ചു’ എന്ന് താരതമ്യേന നിഷ്പക്ഷമായി പരിഭാഷപ്പെടുത്തി, ദുഷ്ടലക്ഷ്യം ‘കുടുക്കാൻ’ എന്ന ഉദ്ദേശ്യഭാഗത്തിലൂടെ പ്രകടമാക്കി.
  alternative: ‘ഗൂഢാലോചന നടത്തി’ എന്ന് കൂടുതൽ വ്യാഖ്യാനാത്മകമായി നൽകുക.
  rationale: മൂലവാക്യത്തിലെ ശത്രുത വ്യക്തമാണ്; എന്നാൽ അത് പ്രധാനമായും παγιδεύσωσιν എന്ന പദത്തിലാണ് തുറന്നുപറയുന്നത്. അതിനാൽ ആദ്യപ്രയോഗത്തിൽ അധിക അർത്ഥം ചേർക്കുന്നില്ല.
- issue: ἐν λόγῳയുടെ അർത്ഥപരിധി
  choice: ‘അദ്ദേഹത്തിന്റെ വാക്കിൽ’
  alternative: ‘അദ്ദേഹം പറയുന്നതിലൂടെ’
  rationale: മൂലത്തിലെ സംക്ഷിപ്തതയും സാധ്യതയുള്ള ഏകവചന സൂചനയും നിലനിർത്തുന്നു; അടിക്കുറിപ്പിൽ കൂടുതൽ സ്വാഭാവികമായ അർത്ഥവ്യക്തീകരണം നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ‘ഗൂഢാലോചന’ പോലുള്ള ശക്തമായ വ്യാഖ്യാനപദം മുഖ്യവാക്യത്തിൽ ഒഴിവാക്കി; ശത്രുത ഉദ്ദേശ്യഭാഗം തന്നെ വഹിക്കുന്നു.
