  to: 'എന്നാൽ യേശു അവരുടെ ദുഷ്ട ഉദ്ദേശ്യം അറിഞ്ഞ് പറഞ്ഞു: “നിങ്ങൾ എന്തിനാണ് എന്നെ പരീക്ഷിക്കുന്നത്, കപടികളേ?”'
