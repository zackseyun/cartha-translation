id: MAT.22.18
reference: Matthew 22:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: γνοὺς δὲ ὁ Ἰησοῦς τὴν πονηρίαν αὐτῶν εἶπεν· Τί με πειράζετε, ὑποκριταί;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/018.yaml
  text: But Jesus[a], knowing their evil intent, said, “Why are you testing me[b], hypocrites?”
translation:
  language: ml
  text: 'എന്നാൽ യേശു അവരുടെ ദുഷ്ട ഉദ്ദേശ്യം അറിഞ്ഞ് പറഞ്ഞു: “നിങ്ങൾ എന്തിനാണ് എന്നെ പരീക്ഷിക്കുന്നത്, കപടികളേ?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνοὺς
  choice: അറിഞ്ഞിട്ട്
  rationale: പ്രധാന ക്രിയയ്ക്കു മുമ്പുള്ള സാഹചര്യസൂചകമായ aorist participle; യേശു അവരുടെ ഉള്ളിലെ ലക്ഷ്യം തിരിച്ചറിഞ്ഞശേഷം സംസാരിച്ചതെന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: സന്ദർഭത്തിലെ നേരിയ വൈരുധ്യം വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളബന്ധകം.
- source_word: πονηρίαν
  choice: ദുഷ്ടലക്ഷ്യം
  rationale: ഇവിടെ പൊതുവായ ദുഷ്ടതയെക്കാൾ അവരുടെ ചോദ്യത്തിനു പിന്നിലെ ദുഷ്ടവും വിരോധപരവുമായ ഉദ്ദേശ്യമാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
- source_word: εἶπεν
  choice: പറഞ്ഞു
  rationale: λέγω എന്ന ക്രിയയുടെ സാധാരണവും സ്വാഭാവികവുമായ ആഖ്യാനപരിഭാഷ.
- source_word: Τί
  choice: എന്തിനാണ്
  rationale: ക്രിയയോടൊപ്പമുള്ള τί ഇവിടെ കാരണം ചോദിക്കുന്ന ‘എന്തിന്/എന്തുകൊണ്ട്’ എന്ന പ്രയോഗമാണ്.
- source_word: πειράζετε
  choice: പരീക്ഷിക്കുന്നത്
  rationale: πειράζω എന്നത് പരീക്ഷിക്കുക, പരിശോധിക്കുക, പ്രലോഭിപ്പിക്കുക എന്നീ അർഥങ്ങൾ വഹിക്കാം; ഇവിടെ യേശുവിനെ കുടുക്കാനുള്ള ശ്രമമായതിനാൽ ‘പരീക്ഷിക്കുക’ മുഖ്യവാചകത്തിൽ യോജിക്കുന്നു, ambiguity അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ὑποκριταί
  choice: കപടഭക്തരേ
  rationale: സത്യസന്ധത നടിച്ചുകൊണ്ട് വിരോധപരമായ ഉദ്ദേശ്യം മറച്ചുവയ്ക്കുന്നവരെ സൂചിപ്പിക്കുന്ന, സാധാരണ മലയാളവായനക്കാർക്ക് പരിചിതമായ സംബോധന.
theological_decisions:
- issue: യേശു എതിരാളികളുടെ ഉള്ളിലെ ദുഷ്ടലക്ഷ്യം അറിഞ്ഞത്
  choice: അവരുടെ ദുഷ്ടലക്ഷ്യം അറിഞ്ഞിട്ട്
  alternative: അവരുടെ ദുഷ്ടത ഗ്രഹിച്ചിട്ട് / അവരുടെ ദുർഭാവം അറിഞ്ഞിട്ട്
  rationale: വാക്യം യേശു അവരുടെ സമീപനത്തിന്റെ ധാർമികസ്വഭാവവും മറഞ്ഞിരിക്കുന്ന ലക്ഷ്യവും കൃത്യമായി അറിഞ്ഞതായി പറയുന്നു; ഇതിൽനിന്ന് വാക്യാതീതമായ വിശാല സിദ്ധാന്തപ്രസ്താവന വികസിപ്പിക്കാതെ ആ അവകാശവാദം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘കപടഭക്തരേ’ എന്നത് ശക്തമായ സംബോധന നിലനിർത്തുന്നു; ‘ദുഷ്ടലക്ഷ്യം’ സന്ദർഭത്തിലെ മറഞ്ഞിരിക്കുന്ന വിരോധപരമായ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു.
