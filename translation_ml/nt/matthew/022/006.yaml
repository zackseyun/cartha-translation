id: MAT.22.6
reference: Matthew 22:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ λοιποὶ κρατήσαντες τοὺς δούλους αὐτοῦ ὕβρισαν καὶ ἀπέκτειναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/006.yaml
  text: But the rest[a], seizing his servants, mistreated them and killed them.
translation:
  language: ml
  text: എന്നാൽ ശേഷിച്ചവർ അവന്റെ അടിമകളെ[a] പിടികൂടി, അവരോട് ക്രൂരമായി പെരുമാറുകയും അവരെ കൊല്ലുകയും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, ‘സേവകരെ’ (ഗ്രീക്ക്: doulous).'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ λοιποὶ
  choice: എന്നാൽ ശേഷിച്ചവർ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ ക്ഷണിക്കപ്പെട്ടവരിൽ ബാക്കിയുള്ളവരെയാണ് λοιποί സൂചിപ്പിക്കുന്നത്; സന്ദർഭത്തിലെ നേരിയ വൈരുധ്യം δέ മൂലം ‘എന്നാൽ’ എന്ന് പ്രകടമാക്കുന്നു.
- source_word: κρατήσαντες
  choice: പിടികൂടി
  rationale: κρατέω ഇവിടെ ബലമായി പിടിക്കുക എന്ന അർഥത്തിലാണ്. മലയാളത്തിലെ ക്രിയാശൃംഖല അഓറിസ്റ്റ് കൃദന്തത്തിന്റെ മുൻകാലബന്ധം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: τοὺς δούλους αὐτοῦ
  choice: അവന്റെ അടിമകളെ
  rationale: δοῦλος എന്ന പദത്തിലെ ഉടമസ്ഥതയുടെയും ബന്ധിത സാമൂഹികപദവിയുടെയും അർഥം മറച്ചുവയ്ക്കാതെ ‘അടിമകൾ’ എന്ന് പരിഭാഷപ്പെടുത്തി; സന്ദർഭാനുസൃതമായ ‘സേവകർ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ὕβρισαν
  choice: അവരോട് ക്രൂരമായി പെരുമാറുകയും
  rationale: ὑβρίζω വെറും വാക്കാലുള്ള നിന്ദയേക്കാൾ വ്യാപകമായ അപമാനകരവും ക്രൂരവുമായ ഉപദ്രവത്തെ സൂചിപ്പിക്കുന്നു; ഈ പ്രയോഗം ആ വിശാലത സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀπέκτειναν
  choice: അവരെ കൊല്ലുകയും ചെയ്തു
  rationale: നിയമപരമോ ഉദ്ദേശ്യപരമോ ആയ അധിക അർഥം ചേർക്കാതെ ἀποκτείνω എന്നതിന്റെ നേരിട്ടുള്ള അർഥം നൽകുന്നു.
theological_decisions:
- issue: ഉപമയിലെ δοῦλος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: അടിമകൾ
  alternative: സേവകർ
  rationale: രാജാവിന്റെ ഉടമസ്ഥതയിലുള്ള ദൂതന്മാരെന്ന പുരാതന സാമൂഹിക യാഥാർഥ്യം ‘അടിമകൾ’ കൂടുതൽ സുതാര്യമായി നിലനിർത്തുന്നു. എന്നാൽ അവരുടെ ദൗത്യപരമായ പങ്ക് മുൻനിർത്തി ‘സേവകർ’ എന്നും മനസ്സിലാക്കാം; അതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ ചേർത്തിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന ശൈലി. ഗ്രീക്ക് വാക്യത്തിലെ പ്രവർത്തനക്രമവും ὑβρίζω എന്നതിന്റെ അപമാനകരമായ ക്രൂരതയും സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
