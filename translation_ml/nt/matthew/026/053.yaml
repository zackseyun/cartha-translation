id: MAT.26.53
reference: Matthew 26:53
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἢ δοκεῖς ὅτι οὐ ⸀δύναμαι παρακαλέσαι τὸν πατέρα μου, καὶ παραστήσει μοι ⸂ἄρτι πλείω⸃ δώδεκα λεγιῶνας ἀγγέλων;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/053.yaml
  text: Or do you think that I cannot appeal to my Father[c][b][a], and he will at once place at my disposal more than twelve legions of angels?
translation:
  language: ml
  text: അല്ലെങ്കിൽ, എനിക്ക് എന്റെ പിതാവിനോട് അപേക്ഷിക്കാൻ[a] കഴിയില്ലെന്നാണോ നീ കരുതുന്നത്? അപേക്ഷിച്ചാൽ അദ്ദേഹം ഉടൻതന്നെ ദൂതന്മാരുടെ പന്ത്രണ്ടിലധികം ലെഗ്യോനുകളെ[c] എനിക്കായി ലഭ്യമാക്കും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വിളിച്ചപേക്ഷിക്കാൻ’ അല്ലെങ്കിൽ ‘എന്റെ പിതാവിനോട് ചോദിക്കാൻ’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘എന്റെ അരികിൽ നിർത്തും’; അതായത്, എനിക്കു സഹായത്തിനായി ലഭ്യമാക്കും.'
    reason: lexical_alternative
  - marker: c
    text: റോമൻ സൈന്യത്തിലെ വളരെ വലിയ ഒരു സൈനികവിഭാഗമായിരുന്നു ലെഗ്യോൻ; അതിനാൽ ഈ പ്രയോഗം അതിശക്തമായ സ്വർഗീയ സൈന്യത്തെ ഊന്നിപ്പറയുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: ἢ
  choice: അല്ലെങ്കിൽ
  rationale: യേശുവിന്റെ ശാസനയിൽ മറ്റൊരു സാധ്യത മുന്നോട്ടുവയ്ക്കുന്ന വാക്ചോദ്യത്തിന്റെ തുടർച്ച നിലനിർത്തുന്നു.
- source_word: δοκεῖς
  choice: നീ കരുതുന്നത്
  rationale: നേരിട്ടുള്ള വാക്ചോദ്യത്തിന്റെ ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: οὐ δύναμαι
  choice: എനിക്ക് ... കഴിയില്ല
  rationale: അനുമതിയെയോ മനസ്സിനെയോ അല്ല, കഴിവിനെയാണ് ഗ്രീക്ക് ക്രിയ സൂചിപ്പിക്കുന്നത്.
- source_word: παρακαλέσαι
  choice: അപേക്ഷിക്കാൻ
  rationale: സഹായത്തിനായി പിതാവിനോടു അഭ്യർഥിക്കുന്ന ആശയം മാന്യവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു; ‘വിളിച്ചപേക്ഷിക്കാൻ’, ‘ചോദിക്കാൻ’ എന്നിവയും സന്ദർഭസാധ്യമാണ്.
- source_word: τὸν πατέρα μου
  choice: എന്റെ പിതാവിനോട്
  rationale: യേശുവിന്റെ ദൈവിക പുത്രബന്ധത്തെ അധിക വ്യാഖ്യാനം ചേർക്കാതെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: παραστήσει μοι
  choice: എന്റെ സഹായത്തിനായി ഒരുക്കിത്തരും
  rationale: ദൂതന്മാരെ തന്റെ അരികിൽ ലഭ്യമാക്കുക എന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘അയയ്ക്കും’ എന്നതിനെക്കാൾ ഗ്രീക്കിലെ ലഭ്യമാക്കൽഭാവം നന്നായി സൂക്ഷിക്കുന്നു.
- source_word: ἄρτι
  choice: ഉടൻതന്നെ
  rationale: ദൈവിക സഹായം തൽക്ഷണം ലഭ്യമാണെന്ന സന്ദർഭത്തിലെ സമയസൂചന നിലനിർത്തുന്നു.
- source_word: πλείω δώδεκα
  choice: പന്ത്രണ്ടിലധികം
  rationale: സംഖ്യയെക്കാൾ കൂടുതലെന്ന താരതമ്യാർഥം നേരിട്ട് നൽകുന്നു.
- source_word: λεγιῶνας
  choice: ലെഗ്യോൻ
  rationale: റോമൻ സൈനിക ഘടകത്തിന്റെ ചരിത്രപരമായ രൂപകം നിലനിർത്തുന്നു; പൊതുവായ ‘സൈന്യങ്ങൾ’ എന്ന വിവർത്തനം അതിന്റെ സാംസ്കാരിക നിറം നഷ്ടപ്പെടുത്തും.
- source_word: ἀγγέλων
  choice: ദൂതന്മാരെ
  rationale: ഈ സന്ദർഭത്തിൽ മനുഷ്യസന്ദേശവാഹകരല്ല, സ്വർഗീയ ജീവികളാണ് ഉദ്ദേശിക്കപ്പെടുന്നത്.
theological_decisions:
- issue: ദൈവിക സഹായം ലഭിക്കുന്നതിനെക്കുറിച്ചുള്ള പ്രസ്താവന കഴിവായോ അനുമതിയായോ സന്നദ്ധതയായോ അവതരിപ്പിക്കണമോ
  choice: ‘എനിക്ക് ... അപേക്ഷിക്കാൻ കഴിയില്ല’ എന്ന് കഴിവിന്റെ ഭാഷയിൽ നൽകി
  alternative: അപേക്ഷിക്കാൻ മനസ്സില്ലെന്നോ അനുവാദമില്ലെന്നോ സൂചിപ്പിക്കുന്ന സ്വതന്ത്ര വ്യാഖ്യാനം
  rationale: δύναμαι കഴിവിനെയോ ശക്തിയെയോ സൂചിപ്പിക്കുന്നു. യേശു സഹായം വിളിച്ചുവരുത്താൻ അശക്തനല്ലെങ്കിലും അത് ഉപയോഗിക്കാതെ അറസ്റ്റിന് വഴങ്ങുന്നു എന്ന പിരിമുറുക്കം വ്യാഖ്യാനിച്ച് തീർക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഗ്രീക്കിലെ ഏക ദീർഘവാക്ചോദ്യം മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ചോദ്യം–വിശദീകരണം എന്ന രണ്ടു വാക്യങ്ങളാക്കി; രണ്ടാം വാക്യത്തിലെ നിബന്ധന ആദ്യവാക്യത്തിൽ പറഞ്ഞ അപേക്ഷയെ മാത്രം തിരിച്ചെടുക്കുന്നു. ‘ലെഗ്യോൻ’ എന്ന ചരിത്രപദം സാംസ്കാരിക രൂപകത്തിനായി നിലനിർത്തി, അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
