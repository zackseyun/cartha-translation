source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος ἠκολούθει αὐτῷ ἀπὸ μακρόθεν ἕως τῆς αὐλῆς τοῦ ἀρχιερέως, καὶ εἰσελθὼν ἔσω ἐκάθητο μετὰ τῶν ὑπηρετῶν ἰδεῖν τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/058.yaml
  text: But Peter was following him from a distance[a], as far as the courtyard of the high priest. And after going inside[b], he sat with the officers to see the outcome.
translation:
  language: ml
  text: എന്നാൽ പത്രോസ് അകലെനിന്ന് അവനെ പിന്തുടർന്നുകൊണ്ട് മഹാപുരോഹിതന്റെ മുറ്റംവരെ പോയി. അകത്തു കടന്നശേഷം, എന്തായിത്തീരുമെന്നു കാണാൻ അവൻ പരിചാരകരോടൊപ്പം[a] ഇരിക്കുകയായിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിലെ ὑπηρέται എന്ന പദത്തിന് സന്ദർഭമനുസരിച്ച് ‘സേവകർ,’ ‘കീഴുദ്യോഗസ്ഥർ,’ ‘പരിചാരകർ,’ അല്ലെങ്കിൽ ‘കാവൽക്കാർ’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘അവസാനം കാണാൻ.’ ഗ്രീക്കിലെ τὸ τέλος ഇവിടെ സംഭവങ്ങളുടെ അവസാനം അല്ലെങ്കിൽ അവയുടെ ഫലം എന്നർഥമാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκολούθει
  choice: പിന്തുടർന്ന് ... ചെന്നു
  rationale: അപൂർണഭൂതകാലരൂപം സൂചിപ്പിക്കുന്ന തുടർച്ചയായ പിന്തുടരലും മുറ്റംവരെയുള്ള നീക്കവും സ്വാഭാവിക മലയാളത്തിൽ ഒരുമിച്ച് പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀπὸ μακρόθεν
  choice: അകലെനിന്ന്
  rationale: ശാരീരിക അകലം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: ἕως τῆς αὐλῆς τοῦ ἀρχιερέως
  choice: മഹാപുരോഹിതന്റെ മുറ്റംവരെ
  rationale: ἕως എന്നതിന്റെ പരിധിബോധവും αὐλή എന്നതിന്റെ ചുറ്റുമതിലുള്ള മുറ്റം എന്ന സന്ദർഭാർഥവും സംരക്ഷിക്കുന്നു.
- source_word: εἰσελθὼν ἔσω
  choice: അകത്തു കടന്നശേഷം
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുണ്ടായ പ്രവേശനത്തെ ക്രമസൂചനയോടെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐκάθητο
  choice: ഇരുന്നു
  rationale: ഇത് അപൂർണഭൂതകാല ക്രിയയാണ്; മലയാളത്തിലെ ‘ഇരുന്നു’ തുടർന്നിരുന്ന നിലയെ സന്ദർഭത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: μετὰ τῶν ὑπηρετῶν
  choice: പരിചാരകരോടൊപ്പം
  rationale: ὑπηρέται എന്നത് കീഴുദ്യോഗസ്ഥർ, സേവകർ, കാവൽക്കാർ എന്നിവരെ സൂചിപ്പിക്കാം; ‘പരിചാരകർ’ പ്രവർത്തനപരമായ പൊതുവായ അർഥം നിലനിർത്തി അതിരുകടന്ന് നിർണയിക്കുന്നില്ല.
- source_word: ἰδεῖν τὸ τέλος
  choice: എന്തായിത്തീരുമെന്നു കാണാൻ
  rationale: ഉദ്ദേശ്യാർഥമുള്ള ἰδεῖν-നെയും τέλος എന്നതിന്റെ സന്ദർഭോചിതമായ ഫലം/അവസാനം എന്ന ഇരട്ടനിറത്തെയും സ്വാഭാവിക മലയാളത്തിൽ കൈമാറുന്നു.
