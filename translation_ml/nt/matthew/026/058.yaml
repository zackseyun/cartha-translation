translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി. ‘മഹാപുരോഹിതൻ’ സുവിശേഷങ്ങളിലെ ἀρχιερεύς എന്ന പദത്തിനുള്ള പതിവും വ്യക്തവുമായ രൂപമാണ്. ഇംഗ്ലീഷ് നൽകിയ അടിക്കുറിപ്പുകളുടെ മാർക്കറുകൾ ഉള്ളടക്കവുമായി പൊരുത്തപ്പെടാത്തതിനാൽ, മൂലഗ്രീക്കിലെ യഥാർഥ പദവൈകല്യങ്ങൾ ഒരൊറ്റ [a] അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
