id: MAT.26.31
reference: Matthew 26:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τότε λέγει αὐτοῖς ὁ Ἰησοῦς· Πάντες ὑμεῖς σκανδαλισθήσεσθε ἐν ἐμοὶ ἐν τῇ νυκτὶ ταύτῃ, γέγραπται γάρ· Πατάξω τὸν ποιμένα, καὶ ⸀διασκορπισθήσονται τὰ πρόβατα τῆς ποίμνης·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/031.yaml
  text: 'Then Jesus says to them[a], “You will all fall away because of me this night, for it is written: ‘I will strike the shepherd[c][b], and the sheep of the flock will be scattered.’”'
translation:
  language: ml
  text: 'അപ്പോൾ യേശു അവരോടു പറയുന്നു: “ഈ രാത്രിയിൽ നിങ്ങൾ എല്ലാവരും എന്നെച്ചൊല്ലി ഇടറിപ്പോകും[a]. എന്തെന്നാൽ, ഇങ്ങനെ എഴുതിയിരിക്കുന്നു: ‘ഞാൻ ഇടയനെ അടിക്കും; ആട്ടിൻകൂട്ടത്തിലെ ആടുകൾ ചിതറിപ്പോകും.’[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഇടറും,” “ഇടറാൻ ഇടയാകും,” “എന്നെച്ചൊല്ലി വിരക്തരാകും,” അല്ലെങ്കിൽ സന്ദർഭത്തിൽ “എന്നെ ഉപേക്ഷിച്ചു മാറിപ്പോകും” എന്നും അർത്ഥമാകാം. ഗ്രീക്ക് പദത്തിന് ഈ അർത്ഥവ്യാപ്തിയുണ്ട്; ഇവിടെ യേശുവിനെ വിട്ടോടുന്നതാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: സെഖര്യാവ് 13:7-ൽ നിന്നുള്ള ഉദ്ധരണി.
    reason: cross_reference
lexical_decisions:
- source_word: Τότε λέγει
  choice: അപ്പോൾ ... പറയുന്നു
  rationale: Τότε സംഭവക്രമം സൂചിപ്പിക്കുന്നതിനാൽ ‘അപ്പോൾ’ എന്നു നൽകി. λέγει എന്ന ചരിത്രവർത്തമാനകാലം ഗ്രീക്കിലെ ആഖ്യാനസജീവത നിലനിർത്താൻ ‘പറയുന്നു’ എന്നു വിവർത്തനം ചെയ്തു.
- source_word: Πάντες ὑμεῖς
  choice: നിങ്ങൾ എല്ലാവരും
  rationale: ‘നിങ്ങൾ’ എന്നും ‘എല്ലാവരും’ എന്നും ചേർത്ത് ഗ്രീക്കിലെ ഊന്നൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: σκανδαλισθήσεσθε
  choice: ഇടറിപ്പോകും
  rationale: പദത്തിന് ഇടറുക, വിശ്വാസബന്ധത്തിൽ പതറുക, ഉപേക്ഷിച്ചു മാറുക തുടങ്ങിയ അർത്ഥവ്യാപ്തിയുണ്ട്. ശിഷ്യന്മാർ യേശുവിനെ വിട്ടോടുന്ന സന്ദർഭം സൂചിപ്പിക്കുമ്പോഴും അന്തിമ വിശ്വാസത്യാഗം എന്ന് അമിതമായി നിർവചിക്കാതിരിക്കാൻ ‘ഇടറിപ്പോകും’ തെരഞ്ഞെടുത്തു.
- source_word: ἐν ἐμοὶ
  choice: എന്നെച്ചൊല്ലി
  rationale: യേശുവുമായി ബന്ധപ്പെട്ട സംഭവങ്ങൾ അവരുടെ ഇടർച്ചയ്ക്ക് കാരണമാകുന്നു എന്ന ബന്ധപരവും കാരണപരവുമായ അർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘എന്നിൽ’ എന്ന അസ്വാഭാവിക പദാനുപദരൂപം ഒഴിവാക്കുന്നു.
- source_word: ἐν τῇ νυκτὶ ταύτῃ
  choice: ഈ രാത്രിയിൽ
  rationale: ഗ്രീക്കിന്റെ കാലസൂചന നേരിട്ട് നിലനിർത്തുന്ന, ഗൗരവമുള്ള സ്വാഭാവിക മലയാളം.
- source_word: γέγραπται γάρ
  choice: എന്തെന്നാൽ, ഇങ്ങനെ എഴുതിയിരിക്കുന്നു
  rationale: തിരുവെഴുത്ത് ഉദ്ധരണി പരിചയപ്പെടുത്തുന്ന പതിവ് സൂത്രവാക്യവും perfect passive രൂപത്തിന്റെ നിലനിൽക്കുന്ന പ്രാബല്യവും സംരക്ഷിക്കുന്നു.
- source_word: Πατάξω τὸν ποιμένα
  choice: ഞാൻ ഇടയനെ അടിക്കും
  rationale: ‘അടിക്കും’ ക്രിയയുടെ അടിസ്ഥാന അർത്ഥം നൽകുന്നു; കൊല്ലും അല്ലെങ്കിൽ അടിച്ചുവീഴ്ത്തും എന്ന് ഫലം അധികമായി വ്യക്തമാക്കുന്നില്ല. ഇടയൻ എന്ന രൂപകം നിലനിർത്തുന്നു.
- source_word: διασκορπισθήσονται
  choice: ചിതറിപ്പോകും
  rationale: ആടുകൾ പല ദിശകളിലേക്കു പിരിയുന്ന ദൃശ്യവും ഭാവികാലവും സ്വാഭാവിക മലയാളത്തിൽ പകർത്തുന്നു.
- source_word: τὰ πρόβατα τῆς ποίμνης
  choice: ആട്ടിൻകൂട്ടത്തിലെ ആടുകൾ
  rationale: πρόβατα, ποίμνη എന്നീ രണ്ടു ഘടകങ്ങളും ഒഴിവാക്കാതെ, മലയാളത്തിൽ സ്വാഭാവികമായ ബന്ധരൂപത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: σκανδαλισθήσεσθε എന്ന പദത്തിന്റെ യേശുവുമായുള്ള ബന്ധത്തിലെ അർത്ഥം
  choice: ശിഷ്യന്മാർ ആ രാത്രിയിലെ സംഭവങ്ങൾ നിമിത്തം യേശുവിനോടുള്ള വിശ്വസ്തബന്ധത്തിൽ ഇടറി അവനെ വിട്ടുപിരിയും എന്ന സന്ദർഭാർഥം; ‘ഇടറിപ്പോകും’ എന്ന് വിവർത്തനം ചെയ്തു.
  alternative: ‘വിശ്വാസം ഉപേക്ഷിക്കും’, ‘എന്നിൽ കുറ്റം കണ്ടെത്തും’, അല്ലെങ്കിൽ പൊതുവായി ‘പാപത്തിൽ വീഴും’.
  rationale: തുടർന്നുള്ള ശിഷ്യന്മാരുടെ പലായനവും ഇടയൻ–ആടുകൾ ഉദ്ധരണിയും ഉപേക്ഷിച്ചു പിരിയുന്ന അർത്ഥത്തെ പിന്തുണയ്ക്കുന്നു. എന്നാൽ ഇത് അന്തിമ വിശ്വാസത്യാഗമാണെന്ന് വാചകം നിർബന്ധമായി പറയാത്തതിനാൽ ആ ദൈവശാസ്ത്രപരമായ നിഗമനം വിവർത്തനത്തിൽ ചേർത്തിട്ടില്ല.
- issue: λέγει എന്ന ചരിത്രവർത്തമാനകാലം
  choice: ‘പറയുന്നു’ എന്ന വർത്തമാനകാലം നിലനിർത്തി.
  alternative: മലയാള ആഖ്യാനശൈലിക്കനുസരിച്ച് ‘പറഞ്ഞു’ എന്ന് ഭൂതകാലത്തിൽ നൽകുക.
  rationale: ഗ്രീക്ക് ആഖ്യാനത്തിന്റെ സജീവതയും രൂപവും സാധ്യമായത്ര നിലനിർത്തുന്നു; അർത്ഥത്തിൽ ദൈവശാസ്ത്രപരമായ വ്യത്യാസമില്ല.
- issue: സെഖര്യാവ് 13:7-ലെ ഉദ്ധരണിയുടെ കർത്തൃത്വഭാവം
  choice: ‘ഞാൻ ഇടയനെ അടിക്കും’ എന്ന ഒന്നാംപുരുഷ രൂപം അതേപടി നിലനിർത്തി.
  alternative: ആരാണ് ഇടയനെ അടിക്കുന്നത് എന്ന് വിശദീകരിക്കുകയോ വ്യാഖ്യാനപരമായി കർത്താവിനെ പേരെടുത്തുപറയുകയോ ചെയ്യുക.
  rationale: മത്തായിയുടെ ഗ്രീക്ക് പാഠത്തിലെ വ്യക്തമായ ഒന്നാംപുരുഷ രൂപം സംരക്ഷിക്കുകയും വക്താവിനെയും നിറവേറ്റലിനെയും കുറിച്ചുള്ള ദൈവശാസ്ത്ര വ്യാഖ്യാനം വിവർത്തനത്തിൽ ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: 'ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ചരിത്രവർത്തമാനകാലം നിലനിർത്തി. ഉദ്ധരണിയിലെ ഇടയൻ–ആട്ടിൻകൂട്ടം രൂപകം പൂർണമായി സംരക്ഷിച്ചു. ഇംഗ്ലീഷ് consultation layer-ലുള്ള footnote-marker ക്രമക്കുഴപ്പം തിരുത്തി: പദാർഥക്കുറിപ്പ് [a], ക്രോസ്-റഫറൻസ് [b]. ‘tonight’ എന്നതിനായി പ്രത്യേക കുറിപ്പ് ആവശ്യമില്ല, കാരണം ‘ഈ രാത്രിയിൽ’ ഗ്രീക്കിനെ നേരിട്ട്, വ്യക്തമായി നൽകുന്നു.'
