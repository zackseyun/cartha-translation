id: MAT.26.13
reference: Matthew 26:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ὅπου ἐὰν κηρυχθῇ τὸ εὐαγγέλιον τοῦτο ἐν ὅλῳ τῷ κόσμῳ, λαληθήσεται καὶ ὃ ἐποίησεν αὕτη εἰς μνημόσυνον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/013.yaml
  text: Truly I tell you, wherever this good news is proclaimed in the whole world, what this woman has done will also be spoken of in memory of her.
translation:
  language: ml
  text: 'സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: ലോകമെങ്ങും ഈ സുവാർത്ത[a] പ്രസംഗിക്കപ്പെടുന്നിടത്തെല്ലാം, ഈ സ്ത്രീ ചെയ്ത കാര്യം അവളെ സ്മരിക്കുന്നതിനായി പറയപ്പെടുകയും ചെയ്യും.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഈ സുവിശേഷം.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ഈ സ്ത്രീ ചെയ്ത കാര്യം അവൾക്കുള്ള ഒരു സ്മാരകമായി പറയപ്പെടുകയും ചെയ്യും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: സത്യമായി
  rationale: യേശുവിന്റെ ഗൗരവപൂർവമായ ഉറപ്പിക്കൽ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു; ലിപ്യന്തരണം ഒഴിവാക്കുന്നു.
- source_word: λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: നേരിട്ടുള്ള അഭിസംബോധനയും വർത്തമാനകാല ക്രിയാരൂപവും നിലനിർത്തുന്നു.
- source_word: ὅπου ἐὰν
  choice: പ്രസംഗിക്കപ്പെടുന്നിടത്തെല്ലാം
  rationale: അനിശ്ചിത സ്ഥാനവ്യാപ്തി സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: κηρυχθῇ
  choice: പ്രസംഗിക്കപ്പെടുന്ന
  rationale: κήρυγμα എന്ന പൊതുഘോഷണത്തിന്റെ ആശയം നിലനിർത്തിക്കൊണ്ട് സന്ദർഭത്തിന് പരിചിതവും സ്വാഭാവികവുമായ പദം ഉപയോഗിക്കുന്നു.
- source_word: τὸ εὐαγγέλιον τοῦτο
  choice: ഈ സുവാർത്ത
  rationale: εὐαγγέλιον എന്നതിന്റെ ‘നല്ല വാർത്ത’ എന്ന അർത്ഥവും ക്രൈസ്തവ സന്ദർഭത്തിലെ പരിചിതമായ ഗൗരവവും ഒരുമിച്ച് വഹിക്കുന്ന മലയാളപദം.
- source_word: ἐν ὅλῳ τῷ κόσμῳ
  choice: ലോകമെങ്ങും
  rationale: മുഴുവൻ ലോകത്തെയും ഉൾക്കൊള്ളുന്ന വ്യാപ്തി ചുരുക്കവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: λαληθήσεται
  choice: പറയപ്പെടും
  rationale: ഭാവികാല കർമണിപ്രയോഗം നിലനിർത്തുകയും അവളുടെ പ്രവൃത്തിയെക്കുറിച്ച് പറയപ്പെടുമെന്ന അർത്ഥം സന്ദർഭത്തിൽ വ്യക്തമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: ὃ ἐποίησεν αὕτη
  choice: ഈ സ്ത്രീ ചെയ്തതും
  rationale: ὃ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; αὕτη സന്ദർഭത്തിലെ സ്ത്രീയെ ചൂണ്ടിക്കാണിക്കുന്നതിനാൽ ‘ഈ സ്ത്രീ’ എന്ന് വ്യക്തമാക്കുന്നു.
- source_word: εἰς μνημόσυνον αὐτῆς
  choice: അവളുടെ ഓർമ്മയ്ക്കായി
  rationale: അവളെ അനുസ്മരിക്കുന്ന ഉദ്ദേശ്യവും സ്മാരകസ്വഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: εὐαγγέλιον എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: സുവാർത്ത
  alternative: സുവിശേഷം
  rationale: ‘സുവാർത്ത’ ഗ്രീക്ക് പദത്തിന്റെ വാർത്താസ്വഭാവം സാധാരണ വായനക്കാർക്ക് നേരിട്ട് വ്യക്തമാക്കുന്നു; പരമ്പരാഗതമായ ‘സുവിശേഷം’ സാധുവായ മറ്റൊരു രൂപമായി അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: εἰς μνημόσυνον αὐτῆς എന്നതിലെ ബന്ധം
  choice: അവളുടെ ഓർമ്മയ്ക്കായി പറയപ്പെടും
  alternative: അവൾക്കുള്ള ഒരു സ്മാരകമായി പറയപ്പെടും
  rationale: വാക്യം അവളുടെ പ്രവൃത്തിയെ അനുസ്മരണവുമായി ബന്ധിപ്പിക്കുന്നു; ‘ഓർമ്മയ്ക്കായി’ ലക്ഷ്യ/ഫലബന്ധം നിലനിർത്തുന്നു, എന്നാൽ കൂടുതൽ ഔപചാരികമായ സ്മാരകവായനയും സാധ്യമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ കർമണിപ്രയോഗങ്ങളും സർവലോക വ്യാപ്തിയും നിലനിർത്തി; അനാവശ്യമായ സഭാപരമായ സാങ്കേതികഭാഷ ഒഴിവാക്കി.
