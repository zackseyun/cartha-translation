source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ· Εἰ πάντες σκανδαλισθήσονται ἐν σοί, ⸀ἐγὼ οὐδέποτε σκανδαλισθήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/033.yaml
  text: But Peter answered him[a], “Even if all fall away because of you, I will never fall away.”
translation:
  language: ml
  text: 'എന്നാൽ പത്രോസ് അവനോടു മറുപടി പറഞ്ഞു: “എല്ലാവരും അങ്ങയെച്ചൊല്ലി ഇടറിവീണാലും[a], ഞാൻ ഒരിക്കലും ഇടറിവീഴുകയില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇടറുക” അല്ലെങ്കിൽ “ഇടറാൻ ഇടയാകുക.” ഗ്രീക്ക് ക്രിയയ്ക്ക് ഇടറുക, അപമാനിതനാകുക, അല്ലെങ്കിൽ വിശ്വാസനിഷ്ഠയിൽനിന്ന് പിന്മാറുക എന്നിങ്ങനെ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ
  choice: എന്നാൽ പത്രോസ് അവനോടു മറുപടിയായി പറഞ്ഞു
  rationale: ἀποκριθεὶς ... εἶπεν എന്ന ഗ്രീക്ക് ആഖ്യാനപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി ‘മറുപടിയായി പറഞ്ഞു’ എന്നു നൽകി; δέ മുൻപ്രസ്താവനയോടുള്ള മൃദുവായ വൈരുധ്യം സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ എന്നു വിവർത്തനം ചെയ്തു. αὐτῷ ‘അവനോടു’ എന്നായി നിലനിർത്തി.
- source_word: Εἰ πάντες
  choice: എല്ലാവരും ... ആയാലും
  rationale: εἰ അടിസ്ഥാനമായി വ്യവസ്ഥ സൂചിപ്പിക്കുന്നുവെങ്കിലും ഇവിടെ പത്രോസ് മറ്റെല്ലാവരിൽനിന്നും തന്നെ വേർതിരിക്കുന്ന ഇളവുസമ്മത ഭാവമുണ്ട്; മലയാളത്തിലെ ‘ആയാലും’ അത് സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: σκανδαλισθήσονται / σκανδαλισθήσομαι
  choice: ഇടറിവീണാലും / ഇടറിവീഴുകയില്ല
  rationale: σκανδαλίζω എന്ന ക്രിയയ്ക്ക് ഇടറുക, വിശ്വാസനിഷ്ഠയിൽ തളരുക, പിന്മാറുക എന്നീ ബന്ധമുള്ള അർഥങ്ങൾ വരാം. ‘ഇടറിവീഴുക’ സന്ദർഭത്തിലെ ശക്തമായ ശിഷ്യത്വപരാജയം സൂചിപ്പിക്കുമ്പോഴും അർഥവ്യാപ്തി പൂർണമായി അടച്ചുകളയുന്നില്ല; രണ്ട് പ്രയോഗങ്ങളിലും ഒരേ മലയാള പദം നിലനിർത്തി.
- source_word: ἐν σοί
  choice: അങ്ങ് നിമിത്തം
  rationale: ഇവിടെ ἐν σοί എന്നത് യേശുവുമായി ബന്ധപ്പെട്ട കാരണത്താൽ ഇടറിവീഴുന്നതിനെ സൂചിപ്പിക്കുന്നു. ആദരസൂചകമായ ‘അങ്ങ്’ അഭിസംബോധനയും കാരണാർഥമുള്ള ‘നിമിത്തം’ എന്ന പദവും ചേർത്ത് അർഥം വ്യക്തമാക്കി.
- source_word: ἐγὼ οὐδέποτε
  choice: ഞാൻ ഒരിക്കലും
  rationale: വ്യക്തമായി ചേർത്ത ἐγώ പത്രോസിനെ ‘എല്ലാവരും’ എന്നതിൽനിന്ന് ഊന്നലോടെ വേർതിരിക്കുന്നു; ‘ഞാൻ’ എന്ന കർത്താവും οὐδέποτε-യ്ക്ക് ‘ഒരിക്കലും’ എന്ന ശക്തമായ കാലനിഷേധവും നൽകി.
theological_decisions:
- issue: ശിഷ്യത്വപരാജയത്തിന്റെ സന്ദർഭത്തിൽ σκανδαλίζω എന്നതിന്റെ വിവർത്തനം
  choice: ഇടറിവീഴുക
  alternative: ഇടറുക; മനസ്സിടറുക; വിശ്വാസത്തിൽനിന്ന് പിന്മാറുക
  rationale: സമ്മർദത്തിൽ യേശുവിനോടുള്ള നിഷ്ഠ ഉപേക്ഷിക്കുന്നതിലേക്കുള്ള ശക്തമായ അർഥം സന്ദർഭത്തിലുണ്ടെങ്കിലും, അന്തിമ വിശ്വാസത്യാഗത്തെക്കുറിച്ചുള്ള പ്രത്യേക സിദ്ധാന്തപരമായ നിഗമനം വാക്യത്തിൽ ചേർക്കരുത്. ‘ഇടറിവീഴുക’ ആ ഗൗരവവും പദത്തിന്റെ രൂപകാത്മക തുറന്ന നിലയും ഒരുമിച്ച് സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. യേശുവിനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയിൽ ‘അങ്ങ്’ ഉപയോഗിച്ചു; അത്യന്തം പുരാതനമോ വിഭാഗീയമോ ആയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
