  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν· Τί θέλετέ μοι δοῦναι κἀγὼ ὑμῖν παραδώσω αὐτόν; οἱ δὲ ἔστησαν αὐτῷ τριάκοντα ἀργύρια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/015.yaml
  text: He said[a], “What are you willing to give me, and I will hand him over to you?” And they weighed out for him thirty pieces of silver.
translation:
  language: ml
  text: 'അവൻ ചോദിച്ചു: “നിങ്ങൾ എനിക്ക് എന്ത് തരാൻ തയ്യാറാണ്? ഞാൻ അവനെ നിങ്ങൾക്ക് കൈമാറിത്തരാം[a].” അവർ അവന് മുപ്പത് വെള്ളിക്കാശ് തൂക്കിക്കൊടുത്തു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഞാൻ അവനെ നിങ്ങൾക്ക് ഒറ്റിക്കൊടുക്കാം.” ഗ്രീക്ക് ക്രിയയ്ക്ക് “കൈമാറുക,” “ഏൽപ്പിക്കുക,” അല്ലെങ്കിൽ ഈ സന്ദർഭത്തിൽ “ഒറ്റിക്കൊടുക്കുക” എന്നിങ്ങനെ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί θέλετέ μοι δοῦναι
  choice: നിങ്ങൾ എനിക്ക് എന്തു തരാൻ തയ്യാറാണ്?
  rationale: θέλω എന്നത് ആഗ്രഹമോ സന്നദ്ധതയോ സൂചിപ്പിക്കാം. വിലപേശലിന്റെ ഈ സന്ദർഭത്തിൽ ‘തരാൻ തയ്യാറാണ്’ എന്നത് അതിന്റെ സന്നദ്ധതാഭാവം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: κἀγὼ ὑμῖν παραδώσω αὐτόν
  choice: ഞാൻ അവനെ നിങ്ങൾക്ക് ഏൽപ്പിച്ചുതരാം
  rationale: παραδίδωμι എന്നതിന് ‘ഏൽപ്പിക്കുക’, ‘കൈമാറുക’, സന്ദർഭത്തിൽ ‘ഒറ്റിക്കൊടുക്കുക’ എന്നീ അർഥങ്ങൾ വരാം. മുഖ്യപാഠത്തിലെ ‘ഏൽപ്പിച്ചുതരാം’ ക്രിയയുടെ വിശാലമായ അർഥപരിധി നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ വഞ്ചനാഭാവം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: οἱ δὲ
  choice: അവർ
  rationale: δέ ഇവിടെ മൃദുവായ ആഖ്യാനബന്ധകമാണ്. മലയാളത്തിലെ തുടർച്ചയിൽ പ്രത്യേക ബന്ധകപദം ചേർക്കാതെ ‘അവർ’ എന്നു തുടങ്ങുന്നത് സ്വാഭാവികവും അർഥനിഷ്ഠവുമാണ്.
- source_word: ἔστησαν αὐτῷ
  choice: അവനു ... തൂക്കിക്കൊടുത്തു
  rationale: ἵστημι ഇവിടെ തുക നിശ്ചയിക്കുക/എണ്ണി അല്ലെങ്കിൽ തൂക്കി നൽകുക എന്ന വ്യാപാരപ്രയോഗമായി മനസ്സിലാക്കാം. ‘തൂക്കിക്കൊടുത്തു’ പണത്തിന്റെ ഭൗതികവും ഇടപാടുസംബന്ധവുമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: τριάκοντα ἀργύρια
  choice: മുപ്പതു വെള്ളിക്കാശ്
  rationale: ἀργύρια അക്ഷരാർഥത്തിൽ വെള്ളിനാണയങ്ങളെയോ വെള്ളിപ്പണത്തെയോ സൂചിപ്പിക്കുന്നു; ഗ്രീക്ക് ഒരു പ്രത്യേക നാണയമൂല്യം പറയുന്നില്ല. ‘വെള്ളിക്കാശ്’ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്, എന്നാൽ നിർദിഷ്ട നാണയവിഭാഗം അനാവശ്യമായി ചേർക്കുന്നില്ല.
theological_decisions:
- issue: യൂദാസിന്റെ വാഗ്ദാനത്തിൽ παραδώσω എന്ന ക്രിയയുടെ പരിഭാഷ
  choice: ഏൽപ്പിച്ചുതരാം
  alternative: ഒറ്റിക്കൊടുക്കാം
  rationale: ‘ഏൽപ്പിച്ചുതരാം’ മൂലക്രിയയുടെ വിശാലമായ അർഥം സംരക്ഷിക്കുകയും ക്രിയയിൽ തന്നെയില്ലാത്ത മുഴുവൻ ധാർമിക വിലയിരുത്തലും മുഖ്യപാഠത്തിൽ നിർബന്ധമായി ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു. എന്നാൽ ഈ സന്ദർഭത്തിൽ പ്രവൃത്തി വഞ്ചനയാണെന്നതിനാൽ ‘ഒറ്റിക്കൊടുക്കാം’ എന്നത് സാധുവായ സന്ദർഭപരമായ പരിഭാഷയായി അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഏൽപ്പിച്ചുതരാം’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും മൂലത്തിലെ അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നതുമാണ്. ‘വെള്ളിക്കാശ്’ പരമ്പരാഗത ബൈബിൾ പരിചയം നിലനിർത്തുമ്പോഴും പ്രത്യേക നാണയമൂല്യം നിർണ്ണയിക്കുന്നില്ല.
