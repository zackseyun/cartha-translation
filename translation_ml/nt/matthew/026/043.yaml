revisions:
- from: അവൻ വീണ്ടും വന്ന് അവർ ഉറങ്ങുന്നതായി കണ്ടു; കാരണം, അവരുടെ കണ്ണുകൾക്ക് ഭാരം തൂങ്ങിയിരുന്നു.[a]
  to: അവൻ വീണ്ടും വന്ന് അവരെ ഉറങ്ങിക്കൊണ്ടിരിക്കുന്നതായി കണ്ടു; എന്തെന്നാൽ, അവരുടെ കണ്ണുകൾ ഭാരപ്പെട്ടിരുന്നു.[a]
  rationale: The revision replaces the non-idiomatic image «ഭാരം തൂങ്ങിയിരുന്നു» with «ഭാരപ്പെട്ടിരുന്നു», which naturally conveys the Greek perfect passive resultant state. It also makes the object and ongoing nature of the sleeping explicit while retaining the same meaning and explanatory relationship.
