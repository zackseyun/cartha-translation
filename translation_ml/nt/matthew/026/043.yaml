review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the repeated coming, the finding of the disciples in an ongoing state of sleep, and the explanatory γάρ clause. However, «കണ്ണുകൾക്ക് ഭാരം തൂങ്ങിയിരുന്നു» is not an idiomatic Malayalam representation of βεβαρημένοι and can suggest that a separate weight was hanging on their eyes rather than that their eyes themselves had become heavy.
  naturalness: «വീണ്ടും വന്ന് അവരെ ഉറങ്ങിക്കൊണ്ടിരിക്കുന്നതായി കണ്ടു» is natural modern standard Malayalam and retains the ongoing sense of καθεύδοντας. «അവരുടെ കണ്ണുകൾ ഭാരപ്പെട്ടിരുന്നു» is idiomatic and clearly conveys the resultant state expressed by the perfect passive participle.
  terminology: No theological terminology is involved. The revision preserves the source's physical idiom without adding an interpretive cause such as sleepiness or exhaustion.
  issues:
  - severity: medium
    issue: «അവരുടെ കണ്ണുകൾക്ക് ഭാരം തൂങ്ങിയിരുന്നു» is unnatural and semantically imprecise.
    rationale: This wording normally evokes a weight hanging upon the eyes. The Greek βεβαρημένοι describes the eyes as being in a weighed-down/heavy state. «കണ്ണുകൾ ഭാരപ്പെട്ടിരുന്നു» expresses this directly in standard Malayalam.
  revised_text: അവൻ വീണ്ടും വന്ന് അവരെ ഉറങ്ങിക്കൊണ്ടിരിക്കുന്നതായി കണ്ടു; എന്തെന്നാൽ, അവരുടെ കണ്ണുകൾ ഭാരപ്പെട്ടിരുന്നു.[a]
  revised_footnotes:
