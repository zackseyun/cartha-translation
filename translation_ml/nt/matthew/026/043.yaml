source:
  edition: SBLGNT
  text: καὶ ἐλθὼν ⸂πάλιν εὗρεν αὐτοὺς⸃ καθεύδοντας, ἦσαν γὰρ αὐτῶν οἱ ὀφθαλμοὶ βεβαρημένοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/043.yaml
  text: And coming again[a], he found them sleeping, for their eyes were weighed down.
translation:
  language: ml
  text: അവൻ വീണ്ടും വന്ന് അവരെ ഉറങ്ങിക്കൊണ്ടിരിക്കുന്നതായി കണ്ടു; എന്തെന്നാൽ, അവരുടെ കണ്ണുകൾ ഭാരപ്പെട്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവരുടെ കണ്ണുകൾ ഭാരമുള്ളവയായിരുന്നു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν πάλιν
  choice: വീണ്ടും വന്ന്
  rationale: ആവർത്തനത്തെ സൂചിപ്പിക്കുന്ന πάλιν എന്ന പദവും മുഖ്യക്രിയയ്ക്കു മുമ്പുള്ള ἐλθών എന്ന ക്രിയാവിശേഷണപരമായ ഭൂതകാല കൃദന്തവും സ്വാഭാവികമായ മലയാള ക്രമത്തിൽ നിലനിർത്തുന്നു.
- source_word: εὗρεν αὐτοὺς καθεύδοντας
  choice: അവർ ഉറങ്ങുന്നതായി കണ്ടു
  rationale: καθεύδοντας സൂചിപ്പിക്കുന്ന, അവരെ കണ്ട സമയത്ത് തുടരുന്ന ഉറക്കാവസ്ഥയെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἦσαν γὰρ
  choice: കാരണം ... ഉണ്ടായിരുന്നു
  rationale: γάρ നൽകുന്ന വിശദീകരണബന്ധം ‘കാരണം’കൊണ്ട് വ്യക്തമാക്കുന്നു; മലയാള വാക്യഘടനയ്ക്കനുസരിച്ച് ക്രിയാഭാവം പൂർണ്ണപ്രയോഗത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: αὐτῶν οἱ ὀφθαλμοὶ
  choice: അവരുടെ കണ്ണുകൾക്ക്
  rationale: ഗ്രീക്കിലെ ഉടമസ്ഥതാസംബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായ ദത്തിവിഭക്തിയോടുകൂടി നൽകുന്നു.
- source_word: βεβαρημένοι
  choice: ഭാരം തൂങ്ങിയിരുന്നു
  rationale: βαρέω എന്ന ക്രിയയുടെ perfect passive participle സൂചിപ്പിക്കുന്ന ഫലാവസ്ഥയും ഉറക്കത്താൽ കണ്ണുകൾ ഭാരപ്പെട്ട അനുഭവവും നിലനിർത്തുന്നു; ‘കണ്ണുകൾ ഭാരമുള്ളവയായിരുന്നു’ എന്ന കൂടുതൽ പദാനുപദമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
