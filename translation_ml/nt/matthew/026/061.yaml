id: MAT.26.61
reference: Matthew 26:61
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπαν· Οὗτος ἔφη· Δύναμαι καταλῦσαι τὸν ναὸν τοῦ θεοῦ καὶ διὰ τριῶν ἡμερῶν ⸀οἰκοδομῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/061.yaml
  text: They said[a], “This man said[b], ‘I am able to destroy the temple of God and to build it in three days.’”
translation:
  language: ml
  text: 'അവർ പറഞ്ഞു: “ഇയാൾ പറഞ്ഞു[b]: ‘ദൈവത്തിന്റെ ആലയം തകർക്കാനും മൂന്നു ദിവസത്തിനകം[a] അതു പണിയാനും എനിക്കു കഴിയും.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “മൂന്നു ദിവസംകൊണ്ട്.” ഗ്രീക്കുപ്രയോഗം ആ സമയപരിധിക്കുള്ളിൽ പ്രവൃത്തി പൂർത്തിയാകുന്നതിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: യോഹന്നാൻ 2:19–21-ൽ, ആലയത്തെക്കുറിച്ചുള്ള യേശുവിന്റെ വാക്ക് അവന്റെ ശരീരത്തെ സൂചിപ്പിച്ചതായി വ്യക്തമാക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: εἶπαν
  choice: അവർ പറഞ്ഞു
  rationale: കഥനത്തിലെ ലളിതമായ ഭൂതകാല സംഭവമായി സാക്ഷികളുടെ ആരോപണം അവതരിപ്പിക്കുന്നു.
- source_word: Οὗτος
  choice: ഇയാൾ
  rationale: കോടതിസദൃശമായ ആരോപണഭാഷയിലെ ചൂണ്ടിക്കാണിക്കുന്നതും അല്പം അവഹേളനസൂചനയുള്ളതുമായ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἔφη
  choice: പറഞ്ഞത് … എന്നാണ്
  rationale: ആരോപിക്കപ്പെട്ട വാക്കുകൾ റിപ്പോർട്ട് ചെയ്യുന്ന φημίയുടെ ലളിതമായ അർഥം സ്വാഭാവിക മലയാള ഉദ്ധരണിഘടനയിൽ നൽകുന്നു; ‘അവകാശപ്പെട്ടു’ എന്ന അധികഭാവം ചേർക്കുന്നില്ല.
- source_word: Δύναμαι
  choice: എനിക്കു കഴിയും
  rationale: കഴിവിനെയോ സാധുതയെയോ സൂചിപ്പിക്കുന്ന മൂലപദത്തിന്റെ അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: καταλῦσαι
  choice: തകർക്കാൻ
  rationale: കെട്ടിടമായ ആലയത്തിന്റെ പശ്ചാത്തലത്തിൽ നശിപ്പിക്കുക/ഇടിച്ചുകളയുക എന്ന അർഥം നൽകുന്ന സ്വാഭാവിക പദം.
- source_word: τὸν ναὸν τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ ആലയം
  rationale: ναός എന്നത് ഇവിടെ ആലയത്തെ സൂചിപ്പിക്കുന്നു; ഉടമസ്ഥതാസംബന്ധമായ τοῦ θεοῦ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: διὰ τριῶν ἡμερῶν
  choice: മൂന്നു ദിവസത്തിനകം
  rationale: διά + ഷഷ്ഠിവിഭക്തി സൂചിപ്പിക്കുന്ന സമയപരിധിക്കുള്ളിലെ പൂർത്തീകരണം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; കാലപ്രയോഗത്തിലെ സാധ്യതയുള്ള മറ്റൊരു നിഴൽക്കായി അടിക്കുറിപ്പ് ചേർത്തിരിക്കുന്നു.
- source_word: οἰκοδομῆσαι
  choice: അതു പണിയാൻ
  rationale: ഗ്രീക്കിൽ മുൻപത്തെ ‘ആലയം’ തന്നെയാണ് കർമമായി തുടരുന്നത്; മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ‘അതു’ ചേർക്കുന്നു. ‘വീണ്ടും പണിയാൻ’ എന്നു പറഞ്ഞ് മൂലത്തിൽ വ്യക്തമല്ലാത്ത ആശയം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ആരോപണത്തിലെ ‘ദൈവത്തിന്റെ ആലയം’ എന്തിനെ സൂചിപ്പിക്കുന്നു
  choice: പ്രധാനപാഠത്തിൽ സാക്ഷികളുടെ ആരോപണം അതിന്റെ പ്രത്യക്ഷ അർഥത്തിൽ, ആലയത്തെക്കുറിച്ചുള്ള വാക്കായി വിവർത്തനം ചെയ്തു.
  alternative: യോഹന്നാൻ 2:19–21-ന്റെ വെളിച്ചത്തിൽ യേശുവിന്റെ ശരീരത്തെയും പുനരുത്ഥാനത്തെയും നേരിട്ട് പ്രധാനപാഠത്തിൽ വ്യക്തമാക്കുക.
  rationale: മത്തായി 26:61 വിചാരണയ്ക്കിടയിൽ സാക്ഷികൾ ഉന്നയിച്ച ആരോപണമാണ് രേഖപ്പെടുത്തുന്നത്. യോഹന്നാനിലെ വ്യാഖ്യാനം പ്രധാനപാഠത്തിലേക്ക് ചേർത്ത് സുവിശേഷവിവരണങ്ങളെ സമന്വയിപ്പിക്കാതെ, അത് അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ഇയാൾ’ ആരോപണസന്ദർഭത്തിലെ Οὗτος എന്ന പദത്തിന്റെ ചൂണ്ടിക്കാണിക്കുന്ന ഭാവം നിലനിർത്തുന്നു. മലയാളത്തിൽ ഉദ്ധരണി സ്വാഭാവികമാക്കാൻ ‘പറഞ്ഞത് … എന്നാണ്’ എന്ന ഘടന ഉപയോഗിച്ചു.
