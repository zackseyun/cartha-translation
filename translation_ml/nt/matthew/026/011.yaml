id: MAT.26.11
reference: Matthew 26:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πάντοτε γὰρ τοὺς πτωχοὺς ἔχετε μεθ’ ἑαυτῶν, ἐμὲ δὲ οὐ πάντοτε ἔχετε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/011.yaml
  text: For you always have the poor with you[a], but you do not always have me.
translation:
  language: ml
  text: ദരിദ്രർ എപ്പോഴും നിങ്ങളോടുകൂടെ ഉണ്ടല്ലോ[a]; എന്നാൽ ഞാൻ എപ്പോഴും നിങ്ങളോടുകൂടെ ഉണ്ടായിരിക്കുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദരിദ്രരായ ആളുകൾ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: എപ്പോഴും
  rationale: തുടർച്ചയായ ലഭ്യതയെയോ സാന്നിധ്യത്തെയോ സൂചിപ്പിക്കുന്ന ക്രിയാവിശേഷണത്തിന് സ്വാഭാവികമായ തുല്യപദം; വാക്യത്തിലെ ആവർത്തനവും നിലനിർത്തുന്നു.
- source_word: γὰρ
  choice: ഉണ്ടല്ലോ
  rationale: മുൻവാക്യത്തിനുള്ള വിശദീകരണകാരണം മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കാൻ വാക്യാന്തത്തിലെ ‘-ല്ലോ’ പ്രയോഗിച്ചു; വേറിട്ട ‘എന്തെന്നാൽ’ ഇവിടെ ഭാരമുള്ളതായി തോന്നും.
- source_word: τοὺς πτωχοὺς
  choice: ദരിദ്രർ
  rationale: ദരിദ്രരായ ആളുകളെ ഒരു സമൂഹമായി സൂചിപ്പിക്കുന്ന നാമവൽക്കരിച്ച ബഹുവചനത്തിന്റെ സംക്ഷിപ്തവും മാന്യവുമായ മലയാളരൂപം.
- source_word: ἔχετε
  choice: ഉണ്ടല്ലോ / ഉണ്ടായിരിക്കുകയില്ല
  rationale: ഇവിടെ ഉടമസ്ഥതയല്ല, കൂടെയുള്ള സാന്നിധ്യമാണ് അർഥം. അതിനാൽ മലയാളത്തിലെ അസ്തിത്വപ്രയോഗം രണ്ടു ഖണ്ഡങ്ങളിലും സ്വാഭാവികമായി ഉപയോഗിച്ചു.
- source_word: μεθ’ ἑαυτῶν
  choice: നിങ്ങളോടുകൂടെ
  rationale: ശിഷ്യന്മാരോടൊപ്പമുള്ള സാന്നിധ്യം വ്യക്തമാക്കുന്നു; ‘നിങ്ങളുടെ ഇടയിൽ’ എന്നതിനെക്കാൾ ഗ്രീക്കിലെ കൂടെയിരിപ്പിന്റെ ഭാവം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἐμὲ
  choice: ഞാൻ
  rationale: ഗ്രീക്കിൽ കർമരൂപമാണെങ്കിലും മലയാളത്തിലെ അസ്തിത്വഘടനയിൽ അർഥസമമായ സ്വാഭാവിക കർത്തൃരൂപം ആവശ്യമാണ്.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: ദരിദ്രരുടെ സ്ഥിരമായ സാന്നിധ്യവും യേശുവിന്റെ പരിമിതകാല ശാരീരിക സാന്നിധ്യവും തമ്മിലുള്ള വൈരുധ്യം വ്യക്തമായി അടയാളപ്പെടുത്തുന്നു.
- source_word: οὐ πάντοτε
  choice: എപ്പോഴും ... ഉണ്ടായിരിക്കുകയില്ല
  rationale: ആദ്യത്തെ ‘എപ്പോഴും’ എന്ന പദം ആവർത്തിച്ച് സമയപരമായ വൈരുധ്യം കൃത്യമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ സാന്നിധ്യത്തെക്കുറിച്ചുള്ള സൂചന
  choice: ദരിദ്രർ തുടർന്നും ശിഷ്യന്മാരോടുകൂടെ ഉണ്ടായിരിക്കുമെന്നതും യേശുവിന്റെ അന്നത്തെ ശാരീരിക സാന്നിധ്യം പരിമിതകാലത്തേക്കാണെന്നതും തമ്മിലുള്ള സമയപരമായ വൈരുധ്യം നിലനിർത്തി.
  alternative: ദരിദ്രരെ പരിചരിക്കുന്നതിന് പ്രാധാന്യം കുറയ്ക്കുന്ന പ്രസ്താവനയായി വ്യാഖ്യാനിക്കൽ.
  rationale: ഗ്രീക്ക് വാചകം സമയപരമായ വൈരുധ്യമാണ് പ്രകടിപ്പിക്കുന്നത്; ദരിദ്രരോടുള്ള കരുണയെ നിരസിക്കുന്ന ധാർമ്മിക വിലയിരുത്തൽ അത് പ്രസ്താവിക്കുന്നില്ല. അതിനാൽ അത്തരമൊരു നിഗമനം പരിഭാഷയിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നിങ്ങളോടുകൂടെ’ എന്ന രൂപം തിരുവെഴുത്തിന്റെ മാന്യത നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; ‘ഉണ്ടല്ലോ’ γάρ എന്ന വിശദീകരണബന്ധം മലയാളത്തിൽ ലളിതമായി അറിയിക്കുന്നു.
