id: MAT.26.52
reference: Matthew 26:52
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τότε λέγει αὐτῷ ὁ Ἰησοῦς· Ἀπόστρεψον ⸂τὴν μάχαιράν σου⸃ εἰς τὸν τόπον αὐτῆς, πάντες γὰρ οἱ λαβόντες μάχαιραν ἐν μαχαίρῃ ⸀ἀπολοῦνται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/052.yaml
  text: Then Jesus said to him[a], “Put your sword back in its place, for all who take up the sword will perish by the sword.”
translation:
  language: ml
  text: 'അപ്പോൾ യേശു അവനോടു പറഞ്ഞു: “നിന്റെ വാൾ അതിന്റെ സ്ഥാനത്ത് തിരികെ വെക്കുക. വാൾ എടുക്കുന്ന എല്ലാവരും[a] വാളാൽ നശിച്ചുപോകും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “വാൾ കൈക്കൊള്ളുന്ന എല്ലാവരും”; ഈ പ്രയോഗം ഒരു ആയുധം വെറുതെ കൈയിൽ എടുക്കുന്നതിനെക്കാൾ, അക്രമബലത്തെ ആശ്രയിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: അപ്പോൾ
  rationale: ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്ന കാലസൂചകപദം.
- source_word: λέγει αὐτῷ
  choice: അവനോടു പറഞ്ഞു
  rationale: ഗ്രീക്കിൽ ചരിത്രവർത്തമാനകാലമാണെങ്കിലും, മലയാള ആഖ്യാനശൈലിയിൽ ഭൂതകാലം സ്വാഭാവികമാണ്.
- source_word: Ἀπόστρεψον
  choice: തിരികെ വെക്കുക
  rationale: ഉടൻ പഴയ നിലയിലേക്കു മടക്കിവെക്കാനുള്ള ആജ്ഞയെ സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കുന്നു.
- source_word: τὴν μάχαιράν σου
  choice: നിന്റെ വാൾ
  rationale: μάχαιρα കത്തി, കുറുവാൾ തുടങ്ങിയ ആയുധങ്ങളെ സൂചിപ്പിക്കാമെങ്കിലും അറസ്റ്റിന്റെ ഈ സന്ദർഭത്തിലും തുടർന്നുള്ള ചൊല്ലുസ്വഭാവമുള്ള വാക്യത്തിലും ‘വാൾ’ വ്യക്തവും പതിവുമായ പരിഭാഷയാണ്.
- source_word: εἰς τὸν τόπον αὐτῆς
  choice: അതിന്റെ സ്ഥാനത്തേക്കു
  rationale: വാൾ അതിനു നിശ്ചയിച്ചിരുന്ന ഇടത്തേക്കു മടക്കിവെക്കുന്നതെന്ന ആശയം, പാഠത്തിൽ ഇല്ലാത്ത ‘ഉറ’ എന്ന് വ്യക്തമാക്കാതെ, സംരക്ഷിക്കുന്നു.
- source_word: πάντες γὰρ οἱ λαβόντες μάχαιραν
  choice: വാൾ എടുക്കുന്ന എല്ലാവരും
  rationale: പൊതുവായ സത്യവാക്യത്തിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു; ഇവിടെ ‘എടുക്കുക’ എന്നത് ആയുധം കൈയിൽ പിടിക്കുക മാത്രമല്ല, അക്രമബലം പ്രയോഗിക്കാൻ ആശ്രയിക്കുക എന്ന അർഥവും വഹിക്കാം.
- source_word: ἐν μαχαίρῃ
  choice: വാളാൽ
  rationale: ഉപകരണാർഥമുള്ള ദാതിവ് ചുരുക്കമായും സ്വാഭാവികമായും നൽകുകയും വാക്യത്തിലെ സമാന്തരഘടന നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἀπολοῦνται
  choice: നശിച്ചുപോകും
  rationale: ἀπόλλυμι ഇവിടെ മരണം/നാശം എന്ന ഗൗരവമുള്ള ഫലം സൂചിപ്പിക്കുന്നു; ‘നശിച്ചുപോകും’ അതിനെ അതിരുകടന്ന് വിശദീകരിക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: വാളിനെക്കുറിച്ചുള്ള യേശുവിന്റെ വാക്കിന്റെ വ്യാപ്തി
  choice: ‘വാൾ എടുക്കുന്ന എല്ലാവരും’ എന്ന പൊതുതത്ത്വമായി പരിഭാഷപ്പെടുത്തി.
  alternative: ഇത് എല്ലാ ബലപ്രയോഗത്തെയും നിരുപാധികം വിലക്കുന്ന വാക്കായോ, ആ നിമിഷത്തിലെ ശിഷ്യനു മാത്രമുള്ള പ്രവചനമായോ ചുരുക്കാം.
  rationale: ഗ്രീക്കിലെ ആർട്ടിക്കുലാർ പാർട്ടിസിപ്പിൾ പൊതുവായ, ചൊല്ലുസ്വഭാവമുള്ള പ്രസ്താവനയാണ്. അതിന്റെ വ്യാപ്തി നിലനിർത്തുമ്പോഴും അക്രമത്തെക്കുറിച്ചുള്ള ഏതെങ്കിലും പ്രത്യേക സഭാപാരമ്പര്യനിലപാട് പരിഭാഷയിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ഉറയിൽ ഇടുക’ എന്ന സ്വാഭാവിക വ്യാഖ്യാനം പാഠത്തിൽ നേരിട്ട് ഇല്ലാത്തതിനാൽ ‘അതിന്റെ സ്ഥാനത്തേക്കു തിരികെ വെക്കുക’ എന്നു നൽകി. പൊതുവായ ചൊല്ലുസ്വഭാവവും വാൾ/വാളാൽ എന്ന സമാന്തരതയും സംരക്ഷിച്ചു.
