- from: 'അവനെ ഒറ്റിക്കൊടുക്കുന്നവൻ അവർക്കു ഒരു അടയാളം[a] കൊടുത്തിരുന്നു: “ഞാൻ ആരെ ചുംബിക്കുന്നുവോ, അവൻ തന്നെയാണ്; അവനെ പിടികൂടുക” എന്നു പറഞ്ഞിരുന്നു.'
  to: 'അവനെ ഒറ്റിക്കൊടുക്കുന്നവൻ അവർക്കു ഒരു അടയാളം[a] കൊടുത്തിരുന്നു. അവൻ പറഞ്ഞു: “ഞാൻ ആരെ ചുംബിക്കുമോ, അവൻ തന്നെയാണ്; അവനെ പിടികൂടുക.”'
