  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ παραδιδοὺς αὐτὸν ἔδωκεν αὐτοῖς σημεῖον λέγων· Ὃν ἂν φιλήσω αὐτός ἐστιν· κρατήσατε αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/048.yaml
  text: The one betraying him had given them a sign[a], saying, “The one I kiss is he[b]; seize him.”
translation:
  language: ml
  text: 'അവനെ ഒറ്റിക്കൊടുക്കുന്നവൻ അവർക്കു ഒരു അടയാളം[a] കൊടുത്തിരുന്നു. അവൻ പറഞ്ഞു: “ഞാൻ ആരെ ചുംബിക്കുമോ, അവൻ തന്നെയാണ്; അവനെ പിടികൂടുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സങ്കേതം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδιδοὺς
  choice: ഒറ്റിക്കൊടുക്കുന്നവൻ
  rationale: ക്രിയയ്ക്ക് പൊതുവായി ‘ഏല്പിക്കുക’ എന്ന അർഥമുണ്ടെങ്കിലും, ഈ പീഡാനുഭവസന്ദർഭത്തിൽ യൂദാസിന്റെ വഞ്ചനാപരമായ കൈമാറ്റമാണ് ഉദ്ദേശിക്കുന്നത്. ‘ഒറ്റിക്കൊടുക്കുക’ ആ ധാർമികവും സന്ദർഭപരവുമായ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: σημεῖον
  choice: അടയാളം
  rationale: ഇവിടെ യേശുവിനെ തിരിച്ചറിയാനുള്ള മുൻകൂട്ടി നിശ്ചയിച്ച സൂചനയാണ്. ‘അടയാളം’ മൂലപദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അത് ഒരു സങ്കേതമായി പ്രവർത്തിക്കുന്നതും വ്യക്തമാണ്.
- source_word: Ὃν ἂν φιλήσω
  choice: ഞാൻ ആരെ ചുംബിക്കുന്നുവോ
  rationale: ἄν സഹിതമുള്ള അനിശ്ചിത ബന്ധവാക്യത്തിന്റെ തിരിച്ചറിയൽഭാവം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: φιλήσω
  choice: ചുംബിക്കുന്നുവോ
  rationale: തിരിച്ചറിയാനുള്ള പ്രവൃത്തിയായി φιλέω നേരിട്ട് ‘ചുംബിക്കുക’ എന്നാണ്; ‘ചുംബിച്ച് അഭിവാദ്യം ചെയ്യുക’ എന്നു വികസിപ്പിക്കുന്നത് മൂലത്തിൽ വ്യക്തമാക്കാത്ത വിവരം ചേർക്കും.
- source_word: αὐτός ἐστιν
  choice: അവൻ തന്നെയാണ്
  rationale: αὐτός നൽകുന്ന ഊന്നലും വ്യക്തിയെ കൃത്യമായി തിരിച്ചറിയിക്കുന്ന സംക്ഷിപ്തതയും നിലനിർത്തുന്നു.
- source_word: κρατήσατε
  choice: പിടികൂടുക
  rationale: κρατέω ശക്തമായി പിടിക്കുക, കസ്റ്റഡിയിലെടുക്കുക എന്നീ ഭാവങ്ങൾ വഹിക്കുന്നു. അറസ്റ്റിന്റെ ഈ സന്ദർഭത്തിൽ ‘പിടികൂടുക’ ശാരീരിക പിടിത്തവും ശത്രുതാപരമായ ഉദ്ദേശ്യവും നൽകുന്നു; എന്നാൽ ഔപചാരിക നിയമനടപടി അനാവശ്യമായി ചേർക്കുന്നില്ല.
theological_decisions:
- issue: യൂദാസിനെ സൂചിപ്പിക്കുന്ന παραδιδοὺς എന്ന പദത്തിന്റെ ധാർമിക ഭാവം
  choice: ‘ഒറ്റിക്കൊടുക്കുന്നവൻ’ എന്ന് പരിഭാഷപ്പെടുത്തി
  alternative: ‘അവനെ ഏല്പിക്കുന്നവൻ’
  rationale: παραδίδωμι എന്നതിന് ‘ഏല്പിക്കുക’ എന്ന നിഷ്പക്ഷ അർഥം സാധ്യമാണെങ്കിലും, സമീപസന്ദർഭം യൂദാസിന്റെ വഞ്ചനയെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു. ‘ഒറ്റിക്കൊടുക്കുക’ ആഖ്യാനത്തിന്റെ ഭാവം പ്രകടമാക്കുന്നു; അധികമായ സഭാവിഭാഗപര വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. ഗ്രീക്കിലെ δέ-യെ പ്രത്യേകമായി ‘ഇപ്പോൾ’ എന്ന കാലസൂചകമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല. ἔδωκεν, λέγων എന്നിവയുടെ മുൻകാലബന്ധം ‘കൊടുത്തിരുന്നു… പറഞ്ഞിരുന്നു’ എന്ന രൂപത്തിൽ വ്യക്തമാക്കി.
