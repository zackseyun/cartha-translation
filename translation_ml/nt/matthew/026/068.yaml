id: MAT.26.68
reference: Matthew 26:68
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγοντες· Προφήτευσον ἡμῖν, χριστέ, τίς ἐστιν ὁ παίσας σε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/068.yaml
  text: 'saying[a], “Prophesy to us, Messiah: who is it that struck you?”'
translation:
  language: ml
  text: '“മശീഹേ[a], ഞങ്ങളോടു പ്രവചിക്കൂ: നിന്നെ അടിച്ചത് ആരാണ്?” എന്നു പറഞ്ഞുകൊണ്ട്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ക്രിസ്തുവേ.” ഗ്രീക്കിലെ Χριστός ഇവിടെ പേരുപോലെയല്ല, ഒരു പദവിയായാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγοντες
  choice: എന്നു പറഞ്ഞുകൊണ്ട്
  rationale: വർത്തമാനകാല കൃഡന്തം പരിഹാസവാക്കുകളെ മുൻവാക്യത്തിലെ പ്രവൃത്തിയോടു ബന്ധിപ്പിക്കുന്നു; വാക്യഭാഗത്തിന്റെ തുടർച്ചാസ്വഭാവം മലയാളത്തിലും നിലനിർത്തുന്നു.
- source_word: Προφήτευσον
  choice: പ്രവചിക്കൂ
  rationale: പ്രവചിക്കാൻ ആവശ്യപ്പെടുന്ന ആജ്ഞാരൂപവും സന്ദർഭത്തിലെ പരിഹാസവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἡμῖν
  choice: ഞങ്ങളോടു
  rationale: പ്രവചനത്തിന്റെ അഭിസംബോധിതരെ സൂചിപ്പിക്കുന്ന ദത്തിവ് മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: χριστέ
  choice: മശീഹേ
  rationale: Χριστός ഇവിടെ പേരുപോലെയല്ല, നേരിട്ടുള്ള അഭിസംബോധനയായ പദവിയാണ്; ‘മശീഹേ’ അതിന്റെ അഭിഷിക്തൻ എന്ന പദവിയർത്ഥവും പരിഹാസത്തിന്റെ മശീഹാസംബന്ധമായ ഊന്നലും നിലനിർത്തുന്നു.
- source_word: τίς ἐστιν ὁ παίσας σε
  choice: നിന്നെ അടിച്ചത് ആരാണ്?
  rationale: പദശഃ ‘നിന്നെ അടിച്ചവൻ ആരാണ്?’ എന്ന തിരിച്ചറിയൽചോദ്യത്തെ സാധാരണ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: Χριστός എന്ന പദവിയുടെ പരിഭാഷ
  choice: മശീഹേ
  alternative: ക്രിസ്തുവേ
  rationale: ഇവിടെ Χριστός സംബോധനാവിഭക്തിയിലുള്ള പദവിയായി ഉപയോഗിച്ചിരിക്കുന്നു. അതിനാൽ അർത്ഥം വ്യക്തമാക്കുന്ന ‘മശീഹേ’ മുഖ്യപാഠത്തിൽ സ്വീകരിക്കുകയും മലയാളത്തിൽ പതിവായ ലിപ്യന്തരണം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. മൂലപാഠത്തിലെ പരിഹാസഭാവം വിശദീകരിച്ച് ചേർക്കാതെ ആജ്ഞയിലും ചോദ്യത്തിലും സ്വാഭാവികമായി നിലനിർത്തി; കൃഡന്തരൂപം മുൻവാക്യത്തോടുള്ള വ്യാകരണബന്ധം സൂക്ഷിക്കുന്നു.
