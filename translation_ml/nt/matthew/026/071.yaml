  text: ἐξελθόντα ⸀δὲ εἰς τὸν πυλῶνα εἶδεν αὐτὸν ἄλλη καὶ λέγει ⸀τοῖς ἐκεῖ· ⸀Οὗτος ἦν μετὰ Ἰησοῦ τοῦ Ναζωραίου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/071.yaml
  text: But when he had gone out to the gateway, another woman saw him and says to those there, “This man was with Jesus the Nazarene.”
translation:
  language: ml
  text: 'അവൻ കവാടത്തിലേക്കു പോയപ്പോൾ, മറ്റൊരു സ്ത്രീ അവനെ കണ്ടു അവിടെയുണ്ടായിരുന്നവരോടു പറയുന്നു: “ഇവൻ നസറായനായ യേശുവിനോടുകൂടെ ഉണ്ടായിരുന്നു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πυλών
  choice: പടിവാതിൽ
  rationale: വീടിന്റെ അങ്കണത്തിൽനിന്ന് പുറത്തേക്കുള്ള കവാടഭാഗത്തെ സൂചിപ്പിക്കുന്ന പദം; സന്ദർഭത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: λέγει
  choice: പറയുന്നു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനകാലം നിലനിർത്തി വിവരണത്തിന്റെ സജീവത സംരക്ഷിക്കുന്നു.
- source_word: τοῦ Ναζωραίου
  choice: നസറായനായ
  rationale: യേശുവിനെ നസറത്ത് സ്വദേശിയായി തിരിച്ചറിയിക്കുന്ന വിശേഷണം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: μετά
  choice: കൂടെ
  rationale: ഇവിടെ കൂട്ടായിരിപ്പിനെയും ബന്ധത്തെയും സൂചിപ്പിക്കുന്ന ലളിതവും കൃത്യവുമായ പ്രയോഗം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വിവരണശൈലി. ഗ്രീക്കിലെ ചരിത്രവർത്തമാനമായ λέγει മലയാളത്തിലും “പറയുന്നു” എന്നു നിലനിർത്തിയിരിക്കുന്നു.
