id: MAT.26.64
reference: Matthew 26:64
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Σὺ εἶπας· πλὴν λέγω ὑμῖν, ἀπ’ ἄρτι ὄψεσθε τὸν υἱὸν τοῦ ἀνθρώπου καθήμενον ἐκ δεξιῶν τῆς δυνάμεως καὶ ἐρχόμενον ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/064.yaml
  text: Jesus said to him[a], “You have said so. But I tell you[c][b], from now on you will see the Son of Man seated at the right hand of Power and coming on the clouds of heaven.”
translation:
  language: ml
  text: 'യേശു അവനോടു പറഞ്ഞു: “നീ പറഞ്ഞതാണ്.[a] എന്നാൽ ഞാൻ നിങ്ങളോടു പറയുന്നു: ഇനിമുതൽ മനുഷ്യപുത്രൻ ശക്തിയുടെ[b] വലതുഭാഗത്ത് ഇരിക്കുന്നതും ആകാശത്തിലെ മേഘങ്ങളിന്മേൽ വരുന്നതും നിങ്ങൾ കാണും.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “അത് നീ തന്നേ പറഞ്ഞു.” ഗ്രീക്കിലെ ഈ പ്രയോഗം സമ്മതസൂചകമായ ഒരു മറുപടിയാണ്.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ “ശക്തി” എന്നത് ദൈവത്തെ ആദരപൂർവം പരോക്ഷമായി സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.
    reason: cultural_note
  - marker: c
    text: ദാനീയേൽ 7:13; സങ്കീർത്തനം 110:1 എന്നിവയിലേക്കുള്ള സൂചന.
    reason: cross_reference
lexical_decisions:
- source_word: Σὺ εἶπας
  choice: നീ പറഞ്ഞതുതന്നെ
  rationale: ഇത് സമ്മതസൂചകമായ ഒരു ഗ്രീക്ക് പ്രയോഗമാണ്. വെറും ‘അതെ’ എന്നു മാറ്റാതെ, യേശു ഉപയോഗിച്ച വാക്കുകളുടെ രൂപവും അതിലെ നിയന്ത്രിതമായ സമ്മതഭാവവും നിലനിർത്തുന്നു.
- source_word: πλὴν
  choice: എന്നാൽ
  rationale: ഉടൻ നൽകിയ മറുപടിയിൽനിന്ന് തുടർന്നുവരുന്ന ഗൗരവമുള്ള പ്രഖ്യാപനത്തിലേക്കുള്ള ശക്തമായ ആശയമാറ്റം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἀπ’ ἄρτι
  choice: ഇനിമുതൽ
  rationale: ഈ നിമിഷംമുതൽ ആരംഭിക്കുന്ന പുതിയ സ്ഥിതിയെ സൂചിപ്പിക്കുന്ന കാലാർഥം സംക്ഷിപ്തമായും സ്വാഭാവികമായും നൽകുന്നു; സംഭവങ്ങളെ ഒരു നിമിഷത്തിലേക്ക് മാത്രം ചുരുക്കുന്നില്ല.
- source_word: ὄψεσθε
  choice: നിങ്ങൾ കാണും
  rationale: ὁράω എന്ന ക്രിയയുടെ ഭാവികാലരൂപത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷയാണ്. ബഹുവചനമായ ‘നിങ്ങൾ’ ഗ്രീക്ക് രൂപം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: ദാനീയേൽ 7-ലേക്കുള്ള സൂചനയുള്ള, യേശുവിന്റെ സ്ഥാപിതമായ സ്വയംവിശേഷണം നിലനിർത്തുന്നു.
- source_word: καθήμενον
  choice: ഇരിക്കുന്നതും
  rationale: ഗ്രീക്ക് വർത്തമാനകൃദന്തരൂപം നേരിട്ട് പകർന്നുകൊണ്ട് വലത്തുഭാഗത്തെ അധികാരസ്ഥാനത്തിന്റെ സന്ദർഭാർഥം നിലനിർത്തുന്നു; അതേസമയം അതിനെ വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കുന്നില്ല.
- source_word: ἐκ δεξιῶν
  choice: വലത്തുഭാഗത്ത്
  rationale: ബഹുമാനം, അധികാരം, സാമീപ്യം എന്നിവ സൂചിപ്പിക്കുന്ന ബൈബിൾ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപമാണ്.
- source_word: τῆς δυνάμεως
  choice: ശക്തിയുടെ
  rationale: ദൈവത്തെ ആദരപൂർവം പരോക്ഷമായി സൂചിപ്പിക്കുന്ന മൂലപദപ്രയോഗം ‘ദൈവം’ എന്നു തുറന്നെഴുതി വികസിപ്പിക്കാതെ നിലനിർത്തുന്നു.
- source_word: ἐρχόμενον
  choice: വരുന്നതും
  rationale: ദാനീയേൽ 7-ലെ വരവിന്റെ പ്രതിധ്വനി നിലനിർത്തുന്ന നേരിട്ടുള്ള കൃദന്തരൂപമാണ്.
- source_word: ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: ആകാശമേഘങ്ങളിന്മേൽ
  rationale: മൂലത്തിലെ സ്ഥാനസൂചകമായ ἐπί-പ്രയോഗവും ദാനീയേൽ 7:13-ലെ ദൃശ്യഭാവവും വ്യക്തവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: മഹാപുരോഹിതനോടുള്ള Σὺ εἶπας എന്ന മറുപടിയുടെ ശക്തി
  choice: സമ്മതം സൂചിപ്പിക്കുന്നതും അതേസമയം മൂലത്തിലെ വാക്കുകളുടെ രൂപം നിലനിർത്തുന്നതുമായ ‘നീ പറഞ്ഞതുതന്നെ’
  alternative: നേരിട്ടുള്ള ‘അതെ’; അല്ലെങ്കിൽ സമ്മതമില്ലാത്ത ഒഴിഞ്ഞുമാറൽ
  rationale: ഈ ഗ്രീക്ക് പ്രയോഗം സന്ദർഭത്തിൽ സമ്മതമായി പ്രവർത്തിക്കുന്നു. എന്നാൽ ‘അതെ’ എന്നു മാത്രം പരിഭാഷപ്പെടുത്തുന്നത് യേശുവിന്റെ യഥാർഥ വാക്യരൂപം നഷ്ടപ്പെടുത്തും; ഒഴിഞ്ഞുമാറലായി കാണുന്നത് സന്ദർഭത്തെയും തുടർന്നുള്ള പ്രതികരണത്തെയും ദുർബലമാക്കും.
- issue: ‘ശക്തി’ (τῆς δυνάμεως) ആരെ സൂചിപ്പിക്കുന്നു
  choice: ദൈവത്തിനുള്ള ആദരപൂർവമായ പരോക്ഷസൂചനയായി ‘ശക്തി’ എന്ന പദം നിലനിർത്തുന്നു
  alternative: ‘ദൈവം’ എന്നു വ്യക്തമാക്കുക; അല്ലെങ്കിൽ ‘ശക്തനായവൻ’ എന്നു വ്യാഖ്യാനിക്കുക
  rationale: പദം ദൈവത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, മൂലത്തിലുള്ള ആദരപൂർവമായ പരോക്ഷഭാഷ പരിഭാഷയിലും നിലനിർത്തുന്നത് അതിന്റെ ദൈവശാസ്ത്രപരമായ മിതത്വം സംരക്ഷിക്കുന്നു.
- issue: ‘നിങ്ങൾ കാണും’ എന്നതിൽ ഉൾപ്പെടുന്ന സിംഹാസനാരോഹണത്തിന്റെയും വരവിന്റെയും കാലബന്ധം
  choice: വലത്തുഭാഗത്ത് ഇരിക്കുന്നതും മേഘങ്ങളിന്മേൽ വരുന്നതും ഒരുമിച്ച് നിലനിർത്തുന്നു; പ്രത്യേകമായ ഒരു കാലക്രമം പരിഭാഷയിൽ നിർബന്ധിക്കുന്നില്ല
  alternative: മുഴുവനും ഉടൻ സംഭവിക്കുന്നതായി വ്യാഖ്യാനിക്കുക; അല്ലെങ്കിൽ അവസാനകാലത്തെ രണ്ടാം വരവായി മാത്രം പരിമിതപ്പെടുത്തുക
  rationale: ഗ്രീക്കിൽ രണ്ടു കൃദന്തരൂപങ്ങളും ‘കാണും’ എന്ന ക്രിയയുടെ ഉള്ളടക്കമായി ചേർന്നുനിൽക്കുന്നു. അവയുടെ ദാനീയേൽ–സങ്കീർത്തന പ്രതിധ്വനിയും കാലപരമായ ദൈവശാസ്ത്രതർക്കവും പരിഭാഷ പരിഹരിച്ചുകളയാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ ന്യായസഭയിലെ ഗൗരവമുള്ള പ്രഖ്യാപനത്തിന് യോജിച്ച മാന്യമായ ശൈലി സ്വീകരിച്ചു. ‘മനുഷ്യപുത്രൻ’, ‘ശക്തി’, ‘വലത്തുഭാഗത്ത്’, ‘ആകാശമേഘങ്ങളിന്മേൽ’ എന്നീ ബൈബിൾപ്രതിധ്വനിയുള്ള പ്രയോഗങ്ങൾ നിലനിർത്തി; അതിപുരാതനമായ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
