id: MAT.26.24
reference: Matthew 26:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ μὲν υἱὸς τοῦ ἀνθρώπου ὑπάγει καθὼς γέγραπται περὶ αὐτοῦ, οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ δι’ οὗ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται· καλὸν ἦν αὐτῷ εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/024.yaml
  text: The Son of Man indeed goes just as it is written about him[a], but woe to that man through whom the Son of Man is betrayed. It would have been better for him if that man had not been born.
translation:
  language: ml
  text: മനുഷ്യപുത്രൻ തന്നെക്കുറിച്ച് എഴുതിയിരിക്കുന്നതുപോലെ പോകുന്നു; എന്നാൽ മനുഷ്യപുത്രനെ ഒറ്റിക്കൊടുക്കുന്ന[a] ആ മനുഷ്യന് അയ്യോ കഷ്ടം! ആ മനുഷ്യൻ ജനിച്ചിരുന്നില്ലെങ്കിൽ അവനു നന്നായേനെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ആരുടെ മുഖാന്തരം മനുഷ്യപുത്രൻ ഏൽപ്പിക്കപ്പെടുന്നുവോ.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് കൂടുതൽ അക്ഷരാർഥത്തിൽ ‘ഏൽപ്പിക്കുക’ അല്ലെങ്കിൽ ‘കൈമാറുക’ എന്നും അർഥമുണ്ട്; ഇവിടെ യൂദാസിന്റെ വഞ്ചന ഉദ്ദേശിച്ചിരിക്കുന്നതിനാൽ ‘ഒറ്റിക്കൊടുക്കുന്ന’ എന്നു വിവർത്തനം ചെയ്തിരിക്കുന്നു.
    reason: പരδίδοται എന്ന ക്രിയയുടെ ‘ഒറ്റിക്കൊടുക്കുക’/‘ഏൽപ്പിക്കുക’ എന്ന അർഥസാധ്യത സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: ὁ μὲν υἱὸς τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: സ്ഥിരമായ ബൈബിൾ ശീർഷകം നിലനിർത്തുന്നു. μὲν–δὲ വൈരുധ്യം മലയാളത്തിൽ ആദ്യഖണ്ഡത്തെ ഭാരപ്പെടുത്താതെ പിറകിലെ ‘എന്നാൽ’ മുഖേന സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: ὑπάγει
  choice: പോകുന്നു
  rationale: വർത്തമാനകാലരൂപവും സന്ദർഭത്തിലെ ഗൗരവമുള്ള പരോക്ഷതയും നിലനിർത്തുന്നു; ‘മരിക്കുന്നു’ എന്നു വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കുന്നില്ല.
- source_word: καθὼς γέγραπται περὶ αὐτοῦ
  choice: തന്നെക്കുറിച്ച് എഴുതിയിരിക്കുന്നതുപോലെ
  rationale: γέγραπται എന്ന perfect passive-ന്റെ എഴുതപ്പെട്ടതും ഇപ്പോഴും പ്രാബല്യത്തിലുള്ളതുമായ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ
  choice: എന്നാൽ ... ആ മനുഷ്യന് അയ്യോ കഷ്ടം!
  rationale: δὲ-യുടെ വൈരുധ്യവും οὐαί-യുടെ പ്രവാചകീയമായ ദുരന്തപ്രഖ്യാപനവും ശക്തമായി, എന്നാൽ പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന രീതിയിൽ നൽകുന്നു.
- source_word: δι’ οὗ ... παραδίδοται
  choice: ഒറ്റിക്കൊടുക്കുന്ന
  rationale: διά മുഖേന സൂചിപ്പിക്കുന്ന വ്യക്തിയുടെ ഇടപെടലും ഈ സന്ദർഭത്തിലെ വഞ്ചനയും മലയാളത്തിലെ സ്വാഭാവിക ക്രിയയിൽ ഒരുമിച്ച് പ്രകടമാക്കുന്നു. ‘ഏൽപ്പിച്ചുകൊടുക്കുക’ എന്ന വിശാല അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കാം.
- source_word: καλὸν ἦν αὐτῷ εἰ οὐκ ἐγεννήθη
  choice: ജനിക്കാതിരുന്നെങ്കിൽ അവന് അതായിരുന്നു നല്ലത്
  rationale: അസാധ്യമായ ഭൂതകാല നിബന്ധനയും καλόν എന്ന ‘നല്ലത്/ഉചിതം’ എന്ന മൂല്യനിർണ്ണയവും നേരിട്ട് നിലനിർത്തുന്നു; ‘കൂടുതൽ നല്ലത്’ എന്നു ഗ്രീക്കിൽ ഇല്ലാത്ത താരതമ്യരൂപം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: തിരുവെഴുത്തിലെ നിർണ്ണയവും മനുഷ്യന്റെ ഉത്തരവാദിത്വവും തമ്മിലുള്ള ബന്ധം
  choice: മനുഷ്യപുത്രൻ എഴുതിയിരിക്കുന്നതുപോലെ പോകുന്നു എന്നും അവനെ ഒറ്റിക്കൊടുക്കുന്ന മനുഷ്യന് അയ്യോ കഷ്ടം എന്നും ഒരുപോലെ നിലനിർത്തി.
  alternative: യൂദാസിന്റെ ഉത്തരവാദിത്വം കുറയ്ക്കുന്ന നിർണ്ണയവാദപരമായ വായന, അല്ലെങ്കിൽ തിരുവെഴുത്തിന്റെ നിവൃത്തിയെ കുറയ്ക്കുന്ന പൂർണമായും മാനുഷിക വായന.
  rationale: ഗ്രീക്ക് വാക്യം ദൈവിക പദ്ധതിയും മനുഷ്യന്റെ കുറ്റബോധവും തമ്മിലുള്ള സംഘർഷം പരിഹരിക്കാതെ ചേർത്തുവയ്ക്കുന്നു; വിവർത്തനവും അതുതന്നെ ചെയ്യുന്നു.
- issue: ജനിക്കാതിരുന്നതായിരുന്നു നല്ലത് എന്ന അന്തിമവാക്യത്തിന്റെ ശക്തി
  choice: കടുത്ത ന്യായവിധിപ്രഖ്യാപനമായി നേരിട്ട് വിവർത്തനം ചെയ്തു.
  alternative: വെറും അതിശയോക്തിയായി മൃദൂകരിക്കൽ, അല്ലെങ്കിൽ നിത്യവിധി സംബന്ധിച്ച വിശദമായ സിദ്ധാന്തമായി വികസിപ്പിക്കൽ.
  rationale: വാക്യത്തിന്റെ ഭാരം നിലനിർത്തുമ്പോഴും അതിനപ്പുറമുള്ള വ്യവസ്ഥിത ദൈവശാസ്ത്ര നിഗമനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘അയ്യോ കഷ്ടം’ എന്ന പ്രയോഗം οὐαί-യുടെ ശാപാത്മക/ന്യായവിധിപരമായ ശക്തി നൽകുന്നു. ഈ കരടിൽ അടിക്കുറിപ്പ് ഇല്ലാത്തതിനാൽ മുഖ്യപാഠത്തിൽ അടിക്കുറിപ്പുസൂചകവും ചേർത്തിട്ടില്ല.
