  source_fidelity: ചരിത്രവർത്തമാനകാലമായ ‘വരുന്നു/പറയുന്നു,’ പത്രോസിനെ അഭിസംബോധന ചെയ്തിട്ടും ബഹുവചനമായ ‘നിങ്ങൾക്കു’ ഉപയോഗിക്കുന്ന സംഖ്യാമാറ്റം, ‘ഒരു മണിക്കൂർ,’ ‘എന്നോടൊപ്പം’ എന്നിവ മൂലപാഠത്തോട് വിശ്വസ്തമാണ്. എന്നാൽ εὑρίσκει എന്നതിന് ‘കാണുന്നു’ എന്നത് വെറും കാണലായി ചുരുങ്ങാം; ഇവിടെ ഉറങ്ങിക്കൊണ്ടിരിക്കുന്നവരെ ‘കണ്ടെത്തുന്നു’ എന്ന അർഥം ആവശ്യമാണ്. Οὕτως-ന്റെ ആശ്ചര്യ/ശാസനാഭാവവും ബന്ധകശക്തിയും ‘അങ്ങനെയെങ്കിൽ’ കൂടുതൽ വ്യക്തമായി നൽകുന്നു.
  naturalness: ‘അവർ ഉറങ്ങുന്നതായി കണ്ടെത്തുന്നു’ ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മൂലത്തിലെ കണ്ടെത്തൽ-പ്രയോഗത്തോട് അടുത്തതുമാണ്. ‘അങ്ങനെയെങ്കിൽ’ ചോദ്യം ഒരു ലളിതമായ ശാസനയായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
  terminology: ‘ശിഷ്യന്മാർ,’ ‘പത്രോസ്,’ ‘ഉണർന്നിരിക്കുക,’ ‘കാവലിരിക്കുക’ എന്നിവ മാന്യമായ ആധുനിക ബൈബിൾ രജിസ്റ്ററിന് യോജിച്ചതാണ്. പാദക്കുറിപ്പ് γρηγορέω-യുടെ ‘കാവലിരിക്കുക’ എന്ന സാദ്ധ്യമായ ഭാവം യുക്തമായി സൂക്ഷിക്കുന്നു.
