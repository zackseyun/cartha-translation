    rationale: εὑρίσκει ഇവിടെ ‘കാണുന്നു’ എന്നതിനേക്കാൾ ‘കണ്ടെത്തുന്നു/f​​inds’ എന്ന അർഥമാണ് വഹിക്കുന്നത്. ‘കാണുന്നു’ യാദൃച്ഛികമായ ദർശനമായി വായിക്കപ്പെടാം; ‘കണ്ടെത്തുന്നു’ എന്നത് മൂലത്തിലെ ഫലസൂചന നിലനിർത്തുന്നു.
