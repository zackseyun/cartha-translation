id: MAT.26.40
reference: Matthew 26:40
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἔρχεται πρὸς τοὺς μαθητὰς καὶ εὑρίσκει αὐτοὺς καθεύδοντας, καὶ λέγει τῷ Πέτρῳ· Οὕτως οὐκ ἰσχύσατε μίαν ὥραν γρηγορῆσαι μετ’ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/040.yaml
  text: And he comes to the disciples and finds them sleeping[a], and he says to Peter, “So[b], were you not able to stay awake with me for one hour?”
translation:
  language: ml
  text: 'അവൻ ശിഷ്യന്മാരുടെ അടുക്കൽ വരുന്നു; അവർ ഉറങ്ങുന്നതായി കണ്ടെത്തുന്നു. അവൻ പത്രോസിനോട് പറയുന്നു: “അങ്ങനെയെങ്കിൽ, ഒരു മണിക്കൂർ എന്നോടൊപ്പം ഉണർന്നിരിക്കാൻ നിങ്ങൾക്കു കഴിഞ്ഞില്ലേ?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരു മണിക്കൂർ എന്നോടൊപ്പം കാവലിരിക്കാൻ നിങ്ങൾക്കു കഴിഞ്ഞില്ലേ?”
    reason: γρηγορέω എന്ന ക്രിയയ്ക്ക് ‘ഉണർന്നിരിക്കുക’ എന്ന മൂർത്തമായ അർഥത്തോടൊപ്പം ‘ജാഗ്രതയോടെ കാവലിരിക്കുക’ എന്ന ഭാവവും ഉണ്ടാകാം.
lexical_decisions:
- source_word: ἔρχεται
  choice: വരുന്നു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനകാലം നിലനിർത്തി ആഖ്യാനത്തിന്റെ സജീവത സംരക്ഷിക്കുന്നു; മലയാളത്തിലും ഈ പ്രയോഗം സ്വാഭാവികമാണ്.
- source_word: πρὸς τοὺς μαθητὰς
  choice: ശിഷ്യന്മാരുടെ അടുക്കൽ
  rationale: ചലനസന്ദർഭത്തിലെ πρός സൂചിപ്പിക്കുന്ന ലക്ഷ്യസ്ഥാനം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: εὑρίσκει αὐτοὺς καθεύδοντας
  choice: അവർ ഉറങ്ങുന്നതായി കാണുന്നു
  rationale: καθεύδοντας എന്ന വർത്തമാനകൃദന്തത്തിന്റെ തുടരുന്ന പ്രവൃത്തിഭാവം നിലനിർത്തുകയും സന്ദർഭത്തിൽ ‘കണ്ടെത്തുന്നു’ എന്നതിനേക്കാൾ സ്വാഭാവികമായി പറയുകയും ചെയ്യുന്നു.
- source_word: λέγει τῷ Πέτρῳ
  choice: അവൻ പത്രോസിനോട് പറയുന്നു
  rationale: ചരിത്രവർത്തമാനകാലം നിലനിർത്തുന്നു; Πέτρος എന്ന പേര് മലയാളത്തിലെ സ്ഥാപിതരൂപമായ ‘പത്രോസ്’ എന്നു നൽകുന്നു.
- source_word: Οὕτως
  choice: എന്ത്
  rationale: ഇവിടെ οὕτως ശാസനയും ആശ്ചര്യവും കലർന്ന ചോദ്യം അവതരിപ്പിക്കുന്നു. അക്ഷരാർഥമായ ‘ഇങ്ങനെ’ എന്നതിനെക്കാൾ ‘എന്ത്’ ആ ഭാവം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: οὐκ ἰσχύσατε
  choice: നിങ്ങൾക്കു കഴിഞ്ഞില്ലേ
  rationale: ἰσχύω ഇവിടെ ശാരീരിക ശക്തിയേക്കാൾ കഴിവിനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘നിങ്ങൾ’ എന്ന ബഹുവചനരൂപം ഗ്രീക്കിലെ രണ്ടാംപുരുഷ ബഹുവചനം സംരക്ഷിക്കുന്നു.
- source_word: μίαν ὥραν
  choice: ഒരു മണിക്കൂർ
  rationale: കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ദ്വിതീയാവിഭക്തിക്ക് സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: γρηγορῆσαι
  choice: ഉണർന്നിരിക്കാൻ
  rationale: ഉറങ്ങിക്കൊണ്ടിരുന്ന ശിഷ്യന്മാരുമായുള്ള നേരിട്ടുള്ള വൈരുധ്യം വ്യക്തമാക്കുന്നു; ജാഗ്രതയോടെ കാവലിരിക്കുന്നതിന്റെ സൂചന പാദക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: μετ’ ἐμοῦ
  choice: എന്നോടൊപ്പം
  rationale: സഹവർത്തിത്വം നേരിട്ടും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: യേശു പത്രോസിനോട് സംസാരിക്കുമ്പോഴും ἰσχύσατε എന്ന ക്രിയ ബഹുവചനമായിരിക്കുന്നത്
  choice: ‘പത്രോസിനോട്’ എന്ന ഏകവചന അഭിസംബോധിതനെയും ‘നിങ്ങൾക്കു’ എന്ന ബഹുവചന ശാസനയെയും നിലനിർത്തി.
  alternative: ചോദ്യം പത്രോസിനോടു മാത്രമാണെന്നവിധം ‘നിനക്കു’ എന്നു ഏകവചനമാക്കുക, അല്ലെങ്കിൽ പത്രോസ് സംഘത്തെ പ്രതിനിധീകരിക്കുന്നുവെന്ന് വാചകത്തിൽ വിശദീകരിക്കുക.
  rationale: ഗ്രീക്ക് പത്രോസിനെ പ്രത്യേകം അഭിസംബോധന ചെയ്യുകയും അതേസമയം ഒന്നിലധികം ശിഷ്യന്മാരെ ഉൾക്കൊള്ളുന്ന ബഹുവചനക്രിയ ഉപയോഗിക്കുകയും ചെയ്യുന്നു. ഈ ഉദ്ദേശപൂർവമായ സംഖ്യാമാറ്റം വ്യാഖ്യാനിച്ച് പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ ചരിത്രവർത്തമാനകാലം തുടർച്ചയായി നിലനിർത്തിയിരിക്കുന്നു. ചോദ്യം പത്രോസിനോടാണെങ്കിലും ‘നിങ്ങൾക്കു’ എന്ന ബഹുവചനം ഉപയോഗിച്ച് മൂലപാഠത്തിലെ സംഖ്യാതീവ്രത സംരക്ഷിച്ചു.
