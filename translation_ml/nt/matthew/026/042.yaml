id: MAT.26.42
reference: Matthew 26:42
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πάλιν ἐκ δευτέρου ἀπελθὼν προσηύξατο λέγων· Πάτερ μου, εἰ οὐ δύναται ⸀τοῦτο ⸀παρελθεῖν ἐὰν μὴ αὐτὸ πίω, γενηθήτω τὸ θέλημά σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/042.yaml
  text: Again[a], a second time he went away and prayed, saying, “My Father, if this cannot pass unless I drink it[b], your will be done.”
translation:
  language: ml
  text: 'വീണ്ടും, രണ്ടാം പ്രാവശ്യം അവൻ പോയി ഇങ്ങനെ പ്രാർഥിച്ചു: “എന്റെ പിതാവേ, ഞാൻ അത് കുടിക്കാതെ ഇത്[a] കടന്നുപോകാൻ സാധ്യമല്ലെങ്കിൽ[b], അങ്ങയുടെ ഇഷ്ടം നിറവേറട്ടെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ “ഇത്” എന്നും “അത്” എന്നും പറയുന്നത് മുൻവാക്യത്തിൽ പറഞ്ഞ കഷ്ടാനുഭവത്തിന്റെ പാനപാത്രത്തെയാണ്; ഗ്രീക്കിൽ ഈ വാക്യത്തിൽ “പാനപാത്രം” എന്ന പദം ആവർത്തിക്കുന്നില്ല.
    reason: cross_reference
  - marker: b
    text: 'മറ്റൊരു വിവർത്തനം: “ഇത് കടന്നുപോകാൻ ഞാൻ അത് കുടിച്ചേ മതിയാകൂ എങ്കിൽ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν ἐκ δευτέρου
  choice: വീണ്ടും, രണ്ടാം പ്രാവശ്യം
  rationale: ആവർത്തനത്തെ സൂചിപ്പിക്കുന്ന πάλιν എന്ന പദവും ‘രണ്ടാം പ്രാവശ്യം’ എന്നർഥമുള്ള ἐκ δευτέρου എന്ന പ്രയോഗവും ഒന്നും ഒഴിവാക്കാതെ, ഗ്രീക്കിലെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: ἀπελθὼν
  choice: അവൻ മാറിപ്പോയി
  rationale: മുഖ്യക്രിയയ്ക്കു മുമ്പുള്ള എയോറിസ്റ്റ് പാർട്ടിസിപ്പിളിനെ മലയാള ആഖ്യാനത്തിൽ സ്വാഭാവികമായ സമാപികക്രിയയായി അവതരിപ്പിക്കുന്നു; മുമ്പുണ്ടായിരുന്ന സ്ഥലത്തുനിന്ന് അകലുന്നതാണ് സന്ദർഭം.
- source_word: προσηύξατο λέγων
  choice: ഇങ്ങനെ പ്രാർഥിച്ചു
  rationale: പ്രാർഥനയും അതിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന λέγων എന്ന പാർട്ടിസിപ്പിളും സ്വാഭാവികമായ മലയാളത്തിൽ സംക്ഷിപ്തമായി പ്രകടമാക്കുന്നു.
- source_word: Πάτερ μου
  choice: എന്റെ പിതാവേ
  rationale: സംബോധനയും ഒന്നാംപുരുഷ ഉടമസ്ഥസർവനാമവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: εἰ οὐ δύναται τοῦτο παρελθεῖν
  choice: ഇത് കടന്നുപോകാൻ കഴിയില്ലെങ്കിൽ
  rationale: οὐ δύναται സൂചിപ്പിക്കുന്ന അസാധ്യതയും τοῦτο എന്ന പ്രകടനസർവനാമവും പാഠത്തിൽ ചേർക്കലുകളില്ലാതെ നിലനിർത്തുന്നു.
- source_word: ἐὰν μὴ αὐτὸ πίω
  choice: ഞാൻ അത് കുടിക്കാതെ
  rationale: ἐὰν μή എന്ന വ്യവസ്ഥാപ്രയോഗത്തിന്റെ ‘അല്ലാതെ/കുടിക്കാതെ’ എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും αὐτό എന്ന സർവനാമത്തെ ‘അത്’ എന്നു നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: γενηθήτω τὸ θέλημά σου
  choice: അങ്ങയുടെ ഇഷ്ടം നിറവേറട്ടെ
  rationale: γενηθήτω എന്ന ആജ്ഞാർഥക പ്രാർഥനയുടെ ശക്തി ‘നിറവേറട്ടെ’ എന്നതിലൂടെ നിലനിർത്തുന്നു; ദൈവത്തോടുള്ള ആദരസൂചകമായ ‘അങ്ങയുടെ’ ആധുനിക നിലവാരമലയാളത്തിന് യോജിക്കുന്നു.
theological_decisions:
- issue: τοῦτο / αὐτό എന്നിവയുടെ സൂചിതവസ്തുവിനെ ‘പാനപാത്രം’ എന്നു മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കണമോ
  choice: മുഖ്യപാഠത്തിൽ ‘ഇത്’ / ‘അത്’ എന്ന സർവനാമങ്ങൾ നിലനിർത്തി, സന്ദർഭസൂചന അടിക്കുറിപ്പിൽ നൽകുന്നു.
  alternative: ‘ഈ പാനപാത്രം’ എന്നു മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കുക.
  rationale: മത്തായി 26:39-ലെ സമീപസന്ദർഭം കഷ്ടാനുഭവത്തിന്റെ പാനപാത്രത്തെയാണ് സൂചിപ്പിക്കുന്നത്. എന്നാൽ ഈ വാക്യത്തിൽ ποτήριον ഇല്ലാത്തതിനാൽ അതിനെ മുഖ്യപാഠത്തിലേക്ക് ചേർക്കാതെ ഗ്രീക്കിലെ പരാമർശരീതി സംരക്ഷിക്കുന്നു.
- issue: യേശുവിന്റെ കീഴടങ്ങലിന്റെ പ്രാർഥന എങ്ങനെ അവതരിപ്പിക്കണം
  choice: അങ്ങയുടെ ഇഷ്ടം നിറവേറട്ടെ
  alternative: അങ്ങയുടെ ഇഷ്ടം സംഭവിക്കട്ടെ
  rationale: ആജ്ഞാർഥക പ്രാർഥനാഭാവം സംരക്ഷിക്കുകയും മത്തായി 6:10-ലെ സമാന പ്രാർഥനാഭാഷയുമായുള്ള ബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു; അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ പ്രാർഥനാഭാഷ ഉപയോഗിച്ചു. ‘വീണ്ടും, രണ്ടാം പ്രാവശ്യം’ എന്ന നേരിയ ആവർത്തനം ഗ്രീക്കിലെ πάλιν, ἐκ δευτέρου എന്നീ രണ്ടുഘടകങ്ങളും ബോധപൂർവം സംരക്ഷിക്കുന്നു. ദൈവസംബോധനയിൽ ആദരസൂചകമായ ‘അങ്ങയുടെ’ ഉപയോഗിച്ചു.
