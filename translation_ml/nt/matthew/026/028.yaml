id: MAT.26.28
reference: Matthew 26:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῦτο γάρ ἐστιν τὸ αἷμά ⸀μου ⸀τῆς διαθήκης τὸ περὶ πολλῶν ἐκχυννόμενον εἰς ἄφεσιν ἁμαρτιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/028.yaml
  text: For this is my blood of the covenant[b][a], which is poured out for many for the forgiveness of sins.
translation:
  language: ml
  text: കാരണം, ഇത് അനേകർക്കുവേണ്ടി പാപമോചനത്തിനായി ചൊരിയപ്പെടുന്ന ഉടമ്പടിയുടേതായ എന്റെ രക്തമാണ്.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘പുതിയ ഉടമ്പടിയുടേതായ എന്റെ രക്തം’ എന്നു വായിക്കുന്നു.
    reason: textual_variant
  - marker: b
    text: അഥവാ, ‘അനേകരുടെ നിമിത്തം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: ഇത്
  rationale: യേശു ഭക്ഷണവേളയിൽ മുന്നിൽ വെക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സർവനാമം. ഗ്രീക്കിൽ ഇവിടെ ‘പാനപാത്രം’ എന്ന പദമില്ലാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല.
- source_word: γάρ
  choice: എന്തെന്നാൽ
  rationale: മുമ്പുള്ള കുടിക്കാനുള്ള ആഹ്വാനത്തിന് ഈ വാക്യം നൽകുന്ന വിശദീകരണബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τὸ αἷμά μου
  choice: എന്റെ ... രക്തം
  rationale: ബലിയും ഉടമ്പടിയും സംബന്ധിച്ച പ്രതിധ്വനി നഷ്ടപ്പെടുത്താതെ αἷμα എന്ന പദത്തെ നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: τῆς διαθήκης
  choice: ഉടമ്പടിയുടെ
  rationale: നൽകിയിരിക്കുന്ന SBLGNT പാഠത്തിൽ ‘പുതിയ’ എന്ന വിശേഷണം ഇല്ല; അതിനാൽ മുഖ്യപാഠത്തിൽ ചേർക്കാതെ പാഠഭേദം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: περὶ πολλῶν
  choice: അനേകർക്കുവേണ്ടി
  rationale: ഈ ബലിസന്ദർഭത്തിൽ περί + genitive മറ്റുള്ളവരുടെ പ്രയോജനത്തിനോ പ്രതിനിധിയായോ എന്ന അർഥം വഹിക്കുന്നു. ‘അനേകർ’ എന്ന മൂലപദം നിലനിർത്തി പ്രായശ്ചിത്തത്തിന്റെ വ്യാപ്തിയെക്കുറിച്ചുള്ള തർക്കം പരിഭാഷയിൽ തീർപ്പാക്കുന്നില്ല.
- source_word: ἐκχυννόμενον
  choice: ചൊരിയപ്പെടുന്ന
  rationale: രക്തത്തെ വിശേഷിപ്പിക്കുന്ന വർത്തമാനകാല കർമണി കൃദന്തത്തിന്റെ രൂപവും ബലിസംബന്ധമായ ദൃശ്യവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: εἰς ἄφεσιν ἁμαρτιῶν
  choice: പാപമോചനത്തിനായി
  rationale: ക്ഷമ/വിമോചനം എന്ന ആശയം വ്യക്തവും ആധുനികവുമായ മലയാളത്തിൽ നൽകുകയും ഉദ്ദേശ്യം അല്ലെങ്കിൽ ഫലത്തിലേക്കുള്ള ദിശ നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘ഉടമ്പടി’യോടൊപ്പം ‘പുതിയ’ ചേർക്കണമോ
  choice: ഉടമ്പടിയുടെ
  alternative: പുതിയ ഉടമ്പടിയുടെ
  rationale: അടിസ്ഥാനമായി നൽകിയ ഗ്രീക്ക് പാഠത്തിൽ καινῆς (‘പുതിയ’) ഇല്ല. സമാന്തരപാഠങ്ങളിൽനിന്നോ പിൽക്കാല പാഠപരമ്പരയിൽനിന്നോ അത് മുഖ്യപാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതെ, സാക്ഷ്യപ്പെടുത്തിയ പാഠഭേദം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: പ്രായശ്ചിത്തഭാഷയിലെ ‘അനേകർക്കുവേണ്ടി’ എന്നതിന്റെ വ്യാപ്തി
  choice: അനേകർക്കുവേണ്ടി
  alternative: എല്ലാവർക്കുവേണ്ടി
  rationale: ഗ്രീക്ക് പാഠം πολλῶν (‘അനേകർ’) എന്നാണ് പറയുന്നത്. പ്രായശ്ചിത്തത്തിന്റെ വ്യാപ്തിയെക്കുറിച്ചുള്ള വിശാലമായ ദൈവശാസ്ത്രതർക്കം പരിഭാഷയിലൂടെ പരിഹരിക്കാതെ മൂലപദം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവവും പൊതുവായ വായനാസൗകര്യവും ഉള്ള മലയാളം. ‘ചൊരിയപ്പെടുന്ന’, ‘ഉടമ്പടി’, ‘പാപമോചനം’ എന്നീ പരിചിതമായ തിരുവെഴുത്തുപദങ്ങൾ നിലനിർത്തിയെങ്കിലും പഴഞ്ചൻ വാക്യഘടന ഒഴിവാക്കി. എല്ലാ അടിക്കുറിപ്പുചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
