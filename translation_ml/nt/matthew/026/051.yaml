id: MAT.26.51
reference: Matthew 26:51
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ εἷς τῶν μετὰ Ἰησοῦ ἐκτείνας τὴν χεῖρα ἀπέσπασεν τὴν μάχαιραν αὐτοῦ καὶ πατάξας τὸν δοῦλον τοῦ ἀρχιερέως ἀφεῖλεν αὐτοῦ τὸ ὠτίον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/051.yaml
  text: And behold[a], one of those with Jesus stretched out his hand, drew his sword, and struck the high priest’s servant, and cut off his ear.
translation:
  language: ml
  text: ഇതാ, യേശുവിനോടുകൂടെ ഉണ്ടായിരുന്നവരിൽ ഒരാൾ കൈ നീട്ടി തന്റെ വാൾ ഊരിയെടുത്തു; മഹാപുരോഹിതന്റെ അടിമയെ[a] വെട്ടി അവന്റെ ചെവി വെട്ടിമാറ്റി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അടിമ” എന്നതിന് “ദാസൻ” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: സംഭവത്തിന്റെ പെട്ടെന്നുള്ളതും ദൃശ്യസജീവവുമായ വഴിത്തിരിവ് സൂചിപ്പിക്കുന്ന മത്തായിയുടെ ആഖ്യാനശൈലി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: εἷς τῶν μετὰ Ἰησοῦ
  choice: യേശുവിനോടുകൂടെ ഉണ്ടായിരുന്നവരിൽ ഒരാൾ
  rationale: ഭാഗികബന്ധം വ്യക്തമാക്കുകയും വ്യക്തിയുടെ പേര് അനാവശ്യമായി ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: കൈ നീട്ടി
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള ചലനത്തെ ചുരുക്കവും സ്വാഭാവികവുമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ἀπέσπασεν τὴν μάχαιραν αὐτοῦ
  choice: തന്റെ വാൾ ഊരിയെടുത്തു
  rationale: ആയുധം ഉറയിൽനിന്നോ കൈവശസ്ഥലത്തുനിന്നോ പുറത്തെടുത്ത പ്രവൃത്തിയെ മലയാളത്തിലെ പതിവുപ്രയോഗത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: μάχαιραν
  choice: വാൾ
  rationale: ചെറുവാളോ വലിയ കത്തിയോ ആകാമെന്ന പദപരിധിയെ അതിയായി നിർണ്ണയിക്കാതെ സാധാരണവും സന്ദർഭോചിതവുമായ അർത്ഥം നൽകുന്നു.
- source_word: πατάξας
  choice: വെട്ടി
  rationale: വാളുകൊണ്ടുള്ള പ്രഹരത്തെ സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക ക്രിയയായി അവതരിപ്പിക്കുന്നു.
- source_word: δοῦλον
  choice: അടിമ
  rationale: δοῦλος സൂചിപ്പിക്കുന്ന ബന്ധിതമായ സാമൂഹിക പദവി മൃദൂകരിക്കാതെ വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ 'ദാസൻ' എന്ന പദത്തിനുണ്ടാകാവുന്ന ഭക്തിപരമായ നിറവും ഒഴിവാക്കുന്നു.
- source_word: ἀρχιερέως
  choice: മഹാപുരോഹിതന്റെ
  rationale: യഹൂദ മഹാപുരോഹിതസ്ഥാനത്തിനുള്ള സ്ഥാപിതവും വ്യക്തവുമായ മലയാളപദം.
- source_word: ἀφεῖλεν αὐτοῦ τὸ ὠτίον
  choice: അവന്റെ ചെവി അറുത്തുകളഞ്ഞു
  rationale: ഗ്രീക്കിലെ ഫലസൂചകമായ സമാപകക്രിയയെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ὠτίον
  choice: ചെവി
  rationale: ലഘുരൂപത്തിന്റെ പ്രത്യേക സൂക്ഷ്മത നിർബന്ധമായി കൊണ്ടുവരാതെ ശരീരഭാഗത്തെ സാധാരണ മലയാളത്തിൽ പറയുന്നു.
theological_decisions:
- issue: δοῦλος എന്ന സാമൂഹികപദത്തിന്റെ വിവർത്തനം
  choice: അടിമ
  alternative: ദാസൻ / സേവകൻ
  rationale: ഈ ചരിത്രാഖ്യാനത്തിൽ മഹാപുരോഹിതന്റെ അധികാരത്തിൻ കീഴിലുള്ള ബന്ധിത സാമൂഹികസ്ഥാനം പ്രസക്തമാണ്. 'സേവകൻ' അത് മൃദൂകരിക്കും; 'ദാസൻ' ആധുനിക മലയാളത്തിൽ മതപരമായ വേറൊരു ഭാവം നൽകാം.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള, സാധാരണ വായനക്കാർക്ക് സുഗമമായ മലയാളം. ഗ്രീക്കിലെ തുടർച്ചയായ പ്രവൃത്തികൾ മലയാളത്തിലെ സ്വാഭാവിക ക്രിയാക്രമത്തിൽ നൽകി; ἰδοὺ എന്ന ആഖ്യാനസൂചകം 'ഇതാ' ആയി നിലനിർത്തി.
