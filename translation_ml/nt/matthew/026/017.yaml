id: MAT.26.17
reference: Matthew 26:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τῇ δὲ πρώτῃ τῶν ἀζύμων προσῆλθον οἱ μαθηταὶ τῷ Ἰησοῦ ⸀λέγοντες· Ποῦ θέλεις ⸀ἑτοιμάσωμέν σοι φαγεῖν τὸ πάσχα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/017.yaml
  text: On the first day of Unleavened Bread[a], the disciples came to Jesus, saying[b], “Where do you want us to prepare for you to eat the Passover?”
translation:
  language: ml
  text: 'പുളിപ്പില്ലാത്ത അപ്പത്തിന്റെ ഒന്നാം ദിവസം[a] ശിഷ്യന്മാർ യേശുവിന്റെ അടുക്കൽ വന്ന് പറഞ്ഞു: “അങ്ങേക്കു പെസഹ[b] കഴിക്കാനായി ഞങ്ങൾ എവിടെയാണ് ഒരുക്കം ചെയ്യേണ്ടതെന്ന് അങ്ങ് ആഗ്രഹിക്കുന്നത്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പുളിപ്പില്ലാത്ത അപ്പത്തിന്റെ ഒന്നാം ദിവസം’ എന്നത് ഗ്രീക്കിലെ പദപ്രയോഗം നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു. പെസഹയുടെ സമയക്രമത്തെക്കുറിച്ചുള്ള ചർച്ച വിവർത്തനം മാത്രംകൊണ്ട് തീർപ്പാക്കരുത്.
    reason: cultural_note
  - marker: b
    text: ‘പെസഹ’ എന്നു പറയുന്നത് ഇവിടെ കൂടുതൽ വ്യക്തമായി ‘പെസഹാഭക്ഷണം’ എന്നും അർഥമാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ πρώτῃ τῶν ἀζύμων
  choice: പുളിപ്പില്ലാത്ത അപ്പത്തിന്റെ ഒന്നാം ദിവസം
  rationale: കാലസൂചകമായ ദത്തിവ് ഘടനയെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുകയും, τῶν ἀζύμων എന്ന ഉത്സവസൂചനയെ അനാവശ്യമായി വികസിപ്പിക്കാതെ നിലനിർത്തുകയും ചെയ്യുന്നു. δέ-യുടെ മൃദുവായ ബന്ധകശക്തി മലയാളത്തിൽ പ്രത്യേകം പദമാക്കാതെ വാക്യക്രമത്തിലൂടെ കൈമാറുന്നു.
- source_word: προσῆλθον οἱ μαθηταὶ τῷ Ἰησοῦ
  choice: ശിഷ്യന്മാർ യേശുവിന്റെ അടുക്കൽ വന്ന്
  rationale: προσέρχομαι എന്നതിന്റെ ‘അടുത്തേക്കു വരുക/സമീപിക്കുക’ എന്ന അർഥം ‘അടുക്കൽ വന്ന്’ എന്ന സ്വാഭാവിക പ്രയോഗത്തിൽ വ്യക്തമാണ്; οἱ μαθηταί എന്നതിൽ ഇല്ലാത്ത ഉടമസ്ഥസർവനാമം ചേർത്തിട്ടില്ല.
- source_word: λέγοντες
  choice: പറഞ്ഞു
  rationale: സമകാലിക പങ്കാളിത്തരൂപത്തെ മലയാളത്തിലെ സ്വാഭാവിക അനുക്രമക്രിയയായി നൽകുന്നു; ചോദ്യമാണെന്നതിനാൽ ‘ചോദിച്ചു’ എന്നു വ്യാഖ്യാനിച്ച് കൂടുതൽ നിർണ്ണയിക്കുന്നില്ല.
- source_word: Ποῦ θέλεις ἑτοιμάσωμέν σοι
  choice: അങ്ങേക്കു ... ഞങ്ങൾ എവിടെ ഒരുക്കണമെന്നാണ് അങ്ങ് ആഗ്രഹിക്കുന്നത്?
  rationale: θέλω എന്ന ആഗ്രഹം/ഇച്ഛ അർഥവും, ഒന്നാംപുരുഷ ബഹുവചന സബ്ജങ്ക്ടീവായ ἑτοιμάσωμεν-ഉം, σοι എന്ന പ്രയോജനസൂചനയും മാന്യവും ആധുനികവുമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: φαγεῖν τὸ πάσχα
  choice: പെസഹ ഭക്ഷിക്കേണ്ടതിന്
  rationale: πάσχα ഇവിടെ ‘ഭക്ഷിക്കുക’ എന്ന ക്രിയയോടൊപ്പം വരുന്നതിനാൽ പെസഹാഭക്ഷണം സന്ദർഭത്തിൽ ഉദ്ദേശിക്കപ്പെടുന്നു; എങ്കിലും മൂലത്തിലെ സംക്ഷിപ്തത നിലനിർത്താൻ പ്രധാനവാചകത്തിൽ ‘പെസഹ’ എന്നാണ് നൽകിയിരിക്കുന്നത്.
theological_decisions:
- issue: ‘പുളിപ്പില്ലാത്ത അപ്പത്തിന്റെ ഒന്നാം ദിവസം’ എന്ന കാലസൂചനയും പെസഹാഭക്ഷണത്തിന്റെ സമയക്രമവും
  choice: 'ഗ്രീക്കിലെ ഉത്സവകാലസൂചന അതേപടി നിലനിർത്തി: ‘പുളിപ്പില്ലാത്ത അപ്പത്തിന്റെ ഒന്നാം ദിവസം.’'
  alternative: ‘പുളിപ്പില്ലാത്ത അപ്പത്തിന്റെ ഉത്സവത്തിനു മുമ്പുള്ള ദിവസം’ എന്നോ ‘പെസഹയുടെ ഒന്നാം ദിവസം’ എന്നോ വ്യാഖ്യാനിച്ച് നൽകുക.
  rationale: സുവിശേഷങ്ങളിലെ പെസഹാസമയക്രമത്തെക്കുറിച്ചുള്ള ചർച്ച വിവർത്തനംകൊണ്ട് തീർപ്പാക്കാതെ, മൂലപാഠത്തിലെ യഥാർഥ ഭാഷയും നിലനിൽക്കുന്ന സംഘർഷവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും ലളിതവുമായ ശൈലി. യേശുവിനെ അഭിസംബോധന ചെയ്യുമ്പോൾ ‘അങ്ങ്/അങ്ങേക്കു’ ഉപയോഗിച്ചു. ഉത്സവനാമമായി മലയാളത്തിൽ പരിചിതമായ ‘പെസഹ’ നിലനിർത്തി; സമയക്രമത്തെ വ്യാഖ്യാനിച്ച് ഒത്തുതീർക്കുന്നത് ഒഴിവാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
