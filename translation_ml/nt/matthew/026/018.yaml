  source_fidelity: 'The Malayalam accurately represents every principal element of the Greek: the plural command, the deliberately unnamed but particular man (τὸν δεῖνα), Jesus’ title as Teacher, the open-ended imminence of his καιρός, the idiomatic Passover observance, and the disciples’ accompaniment. “നിന്റെ അടുക്കൽ” appropriately preserves πρὸς σέ without adding ‘house,’ while still functioning naturally in the hospitality context.'
