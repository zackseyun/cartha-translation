  terminology: “ഗുരു,” “പെസഹ,” and “ശിഷ്യന്മാർ” are appropriate established biblical terms. “എന്റെ സമയം അടുത്തിരിക്കുന്നു” faithfully preserves the Greek’s theological and narrative openness without specifying death or another event.
