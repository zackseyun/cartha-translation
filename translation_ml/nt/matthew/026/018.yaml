id: MAT.26.18
reference: Matthew 26:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ὑπάγετε εἰς τὴν πόλιν πρὸς τὸν δεῖνα καὶ εἴπατε αὐτῷ· Ὁ διδάσκαλος λέγει· Ὁ καιρός μου ἐγγύς ἐστιν· πρὸς σὲ ποιῶ τὸ πάσχα μετὰ τῶν μαθητῶν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/018.yaml
  text: He said[a], “Go into the city to a certain man and tell him, ‘The Teacher says, “My time is near[c][b]. I am keeping the Passover with you with my disciples.”’”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “നഗരത്തിൽ ഇന്നയാളുടെ അടുക്കൽ ചെന്ന് അയാളോടു പറയുക: ‘ഗുരു പറയുന്നു: “എന്റെ സമയം അടുത്തിരിക്കുന്നു. ഞാൻ എന്റെ ശിഷ്യന്മാരോടൊപ്പം നിന്റെ അടുക്കൽ പെസഹ ആചരിക്കും.”’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑπάγετε
  choice: ചെന്ന്
  rationale: സഞ്ചാരത്തിനുള്ള ബഹുവചന ആജ്ഞയെ സന്ദർഭത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: πρὸς τὸν δεῖνα
  choice: ഇന്നയാളുടെ അടുക്കൽ
  rationale: പേരുപറയാതെ സൂചിപ്പിക്കുന്ന, എന്നാൽ നിർദിഷ്ടനായ ഒരാളെ δεῖνα സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘ഇന്നയാൾ’ ഈ ഉദ്ദേശപൂർവമായ അനിർദിഷ്ടത നിലനിർത്തുന്നു.
- source_word: Ὁ διδάσκαλος
  choice: ഗുരു
  rationale: പഠിപ്പിക്കുന്നവൻ എന്ന അർഥവും യേശു സ്വയം ഉപയോഗിക്കുന്ന അംഗീകൃത അഭിസംബോധനയുടെ ഗൗരവവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: Ὁ καιρός μου ἐγγύς ἐστιν
  choice: എന്റെ സമയം അടുത്തിരിക്കുന്നു
  rationale: καιρός സൂചിപ്പിക്കുന്ന പ്രസക്തമോ നിർണായകമോ ആയ സമയത്തെ, അതിന്റെ കൃത്യമായ പരിധി വിശദീകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: πρὸς σὲ
  choice: നിന്റെ അടുക്കൽ
  rationale: ഗ്രീക്കിലെ വ്യക്തിയിലേക്കുള്ള ബന്ധപ്രയോഗം അടുത്തായി നിലനിർത്തുന്നു; ‘നിന്റെ വീട്ടിൽ’ എന്ന് മൂലത്തിൽ ഇല്ലാത്ത സ്ഥലം വ്യക്തമാക്കുന്നില്ല, എന്നാൽ ആതിഥ്യസന്ദർഭം വായനക്കാരന് ഗ്രഹിക്കാം.
- source_word: ποιῶ τὸ πάσχα
  choice: പെസഹ ആചരിക്കും
  rationale: ποιέω + πάσχα എന്ന പ്രയോഗത്തിന്റെ ഉത്സവാചരണാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; വർത്തമാനരൂപത്തിന് സമീപഭാവി സൂചിപ്പിക്കുന്ന മലയാളരൂപം സന്ദർഭോചിതമാണ്.
- source_word: τὸ πάσχα
  choice: പെസഹ
  rationale: യഹൂദരുടെ പെസഹോത്സവത്തിനുള്ള മലയാള ബൈബിൾ-സാംസ്കാരിക പ്രയോഗം.
- source_word: μετὰ τῶν μαθητῶν μου
  choice: എന്റെ ശിഷ്യന്മാരോടൊപ്പം
  rationale: μαθηταί എന്ന ശിഷ്യത്വബന്ധത്തെ സ്ഥാപിതവും വ്യക്തവുമായ മലയാളപദത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ καιρός അടുത്തിരിക്കുന്നു എന്ന പ്രസ്താവനയുടെ വ്യാപ്തി
  choice: ‘എന്റെ സമയം അടുത്തിരിക്കുന്നു’ എന്ന് നിർവചനമില്ലാതെ പരിഭാഷപ്പെടുത്തി.
  alternative: ‘എന്റെ നിശ്ചിത സമയം അടുത്തിരിക്കുന്നു’ അല്ലെങ്കിൽ ‘എന്റെ മരണസമയം അടുത്തിരിക്കുന്നു.’
  rationale: ഇത് മരണമോ പെസഹാഭോജനമോ ദൗത്യത്തിന്റെ പരിസമാപ്തിയോ എന്ന് വാക്യം തന്നെ പരിമിതപ്പെടുത്തുന്നില്ല; അതിനാൽ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും വ്യാപ്തിയും സംരക്ഷിക്കുന്നു.
- issue: πρὸς σὲ എന്നതിലെ ആതിഥ്യസ്ഥലസൂചന
  choice: ‘നിന്റെ അടുക്കൽ’ എന്ന അടുത്ത രൂപം സ്വീകരിച്ചു.
  alternative: ‘നിന്റെ വീട്ടിൽ’ അല്ലെങ്കിൽ ‘നിന്നോടൊപ്പം.’
  rationale: സന്ദർഭത്തിൽ ആതിഥ്യമോ സ്ഥലമോ സൂചിപ്പിക്കാമെങ്കിലും ‘വീട്’ മൂലപാഠത്തിൽ വ്യക്തമല്ല; ‘നിന്നോടൊപ്പം’ എന്നു പറഞ്ഞാൽ ശിഷ്യന്മാരോടൊപ്പം ആചരിക്കുന്നതുമായി അനാവശ്യമായ കൂട്ടുപങ്കാളിത്താർഥം കലരാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. ഉദ്ദേശപൂർവം പേര് പറയാത്ത വ്യക്തിയെ ‘ഇന്നയാൾ’ എന്നും, വ്യാഖ്യാനാതിശയം ഒഴിവാക്കാൻ πρὸς σὲ എന്നത് ‘നിന്റെ അടുക്കൽ’ എന്നും നൽകി. ഉദ്ധരണികളുടെ പടിവിന്യാസം വ്യക്തമായി സൂക്ഷിച്ചു.
