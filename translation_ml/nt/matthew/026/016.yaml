id: MAT.26.16
reference: Matthew 26:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀπὸ τότε ἐζήτει εὐκαιρίαν ἵνα αὐτὸν παραδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/016.yaml
  text: And from then on he was seeking an opportunity to hand him over[a].
translation:
  language: ml
  text: അന്നുമുതൽ അവനെ കൈമാറാൻ[a] അവൻ തക്ക അവസരം അന്വേഷിച്ചുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒറ്റിക്കൊടുക്കാൻ.” ഗ്രീക്ക് ക്രിയയുടെ അടിസ്ഥാനാർഥം “കൈമാറുക” അല്ലെങ്കിൽ “ഏൽപ്പിച്ചുകൊടുക്കുക” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ τότε
  choice: അന്നുമുതൽ
  rationale: ἀπό + τότε സൂചിപ്പിക്കുന്ന ആരംഭബിന്ദുവും തുടർച്ചയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἐζήτει
  choice: അന്വേഷിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലക്രിയയുടെ തുടർച്ചയായ ശ്രമം മലയാളത്തിലെ ‘-കൊണ്ടിരുന്നു’ രൂപം വ്യക്തമാക്കുന്നു.
- source_word: εὐκαιρίαν
  choice: തക്ക അവസരം
  rationale: അനുകൂലമോ യോജിച്ചതോ ആയ സന്ദർഭം എന്ന εὐκαιρίαയുടെ ഭാവം ചുരുക്കമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: ἵνα
  choice: ഏല്പിച്ചുകൊടുക്കാൻ
  rationale: ἵνα ഇവിടെ ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിലെ ഉദ്ദേശ്യാർഥക ക്രിയാരൂപം ഉപയോഗിച്ചു.
- source_word: παραδῷ
  choice: ഏല്പിച്ചുകൊടുക്കാൻ
  rationale: παραδίδωμι എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘മറ്റൊരാളുടെ അധികാരത്തിൽ ഏല്പിക്കുക’ എന്ന ആശയം നിലനിർത്തുന്നു; ‘ഒറ്റിക്കൊടുക്കുക’ എന്ന സന്ദർഭോചിതമായ വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: αὐτὸν
  choice: അവനെ
  rationale: സന്ദർഭത്തിൽ യേശുവിനെ സൂചിപ്പിക്കുന്ന കർമപ്രത്യയം നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: യൂദാസിന്റെ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന παραδῷ എന്ന ക്രിയയുടെ പരിഭാഷ
  choice: ഏല്പിച്ചുകൊടുക്കാൻ
  alternative: ഒറ്റിക്കൊടുക്കാൻ
  rationale: സന്ദർഭത്തിൽ വഞ്ചന ഉൾപ്പെട്ടിട്ടുണ്ടെങ്കിലും ഗ്രീക്ക് ക്രിയയുടെ വിശാലമായ അടിസ്ഥാനാർഥം മുഖ്യവാചകത്തിൽ സംരക്ഷിക്കുന്നു; കൂടുതൽ വ്യാഖ്യാനാത്മകമായ പദം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. തുടർച്ചയായ അന്വേഷണത്തെ ‘അന്വേഷിച്ചുകൊണ്ടിരുന്നു’ എന്നും εὐκαιρίαയുടെ യോജ്യതാഭാവത്തെ ‘തക്ക അവസരം’ എന്നും പ്രകടമാക്കി.
