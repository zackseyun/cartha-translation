id: MAT.26.26
reference: Matthew 26:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐσθιόντων δὲ αὐτῶν λαβὼν ὁ Ἰησοῦς ⸀ἄρτον καὶ ⸀εὐλογήσας ἔκλασεν καὶ ⸂δοὺς τοῖς μαθηταῖς⸃ εἶπεν· Λάβετε φάγετε, τοῦτό ἐστιν τὸ σῶμά μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/026.yaml
  text: While they were eating[a], Jesus took bread, and after blessing it, he broke it and gave it to the disciples and said, “Take, eat[d][c][b]; this is my body.”
translation:
  language: ml
  text: 'അവർ ഭക്ഷിച്ചുകൊണ്ടിരിക്കുമ്പോൾ[a], യേശു അപ്പം എടുത്ത് അപ്പത്തിന്മേൽ അനുഗ്രഹം ചൊല്ലിയശേഷം അത് നുറുക്കി ശിഷ്യന്മാർക്കു കൊടുത്ത് പറഞ്ഞു: “എടുത്ത് ഭക്ഷിക്കൂ[c]; ഇത് എന്റെ ശരീരമാണ്[d].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവർ ഭക്ഷിച്ചുകൊണ്ടിരുന്നപ്പോൾ.”
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ, “എടുക്കൂ, ഭക്ഷിക്കൂ.” രണ്ടു ആജ്ഞകൾക്കിടയിൽ ഗ്രീക്കിൽ ‘എന്നിട്ട്’ എന്ന സംയോജകപദമില്ല.
    reason: lexical_alternative
  - marker: d
    text: ഗ്രീക്ക് അക്ഷരാർഥത്തിൽ, “ഇത് എന്റെ ശരീരമാണ്” എന്നു പറയുന്നു. ചിലർ ഇതിനെ “ഇത് എന്റെ ശരീരത്തെ അർഥമാക്കുന്നു/സൂചിപ്പിക്കുന്നു” എന്നു വ്യാഖ്യാനിക്കുന്നു; എന്നാൽ പരിഭാഷ മൂലപാഠത്തിന്റെ വാക്കുകൾ നിലനിർത്തുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐσθιόντων δὲ αὐτῶν
  choice: അവർ ഭക്ഷിച്ചുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് പശ്ചാത്തലത്തിലെ തുടർന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയെ കാലസൂചനയായി അവതരിപ്പിക്കുന്നു. δέ ഇവിടെ ശക്തമായ വിരോധമല്ല; മലയാളത്തിൽ പ്രത്യേക സംയോജകം ചേർക്കാതെയും സ്വാഭാവികമായി അർഥം നിലനിൽക്കുന്നു.
- source_word: λαβὼν
  choice: എടുത്ത്
  rationale: മുഖ്യക്രിയയ്ക്കു മുമ്പുള്ള അയോറിസ്റ്റ് പാർട്ടിസിപ്പിളിനെ മലയാളത്തിലെ സ്വാഭാവിക ക്രിയാശൃംഖലയായി പരിഭാഷപ്പെടുത്തി.
- source_word: ἄρτον
  choice: അപ്പം
  rationale: ഭക്ഷണസന്ദർഭത്തിലെ ἄρτος എന്ന സാധാരണ പദത്തിന് മലയാളത്തിൽ പതിവും വ്യക്തവുമായ തുല്യപദം ‘അപ്പം’ ആണ്.
- source_word: εὐλογήσας
  choice: അതിന്മേൽ അനുഗ്രഹം ചൊല്ലിയശേഷം
  rationale: εὐλογέω എന്നതിന്റെ ‘അനുഗ്രഹിക്കുക/അനുഗ്രഹം ചൊല്ലുക’ എന്ന അർഥം നിലനിർത്തുന്നു; സമാന്തരവിവരണങ്ങളിലെ ‘നന്ദി പറയുക’ എന്ന വ്യത്യസ്ത ക്രിയയിലേക്ക് ഇതിനെ ലയിപ്പിക്കുന്നില്ല. മലയാളത്തിൽ അനുഗ്രഹത്തിന്റെ സന്ദർഭം വ്യക്തമാക്കാൻ ‘അതിന്മേൽ’ ചേർത്തു.
- source_word: ἔκλασεν
  choice: നുറുക്കി
  rationale: അപ്പം ഭാഗങ്ങളാക്കുന്ന പ്രവൃത്തിക്ക് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ പദം; അപ്പം തന്നെയാണ് കർമമെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: δοὺς τοῖς μαθηταῖς
  choice: ശിഷ്യന്മാർക്കു കൊടുത്തുകൊണ്ട്
  rationale: പാർട്ടിസിപ്പിളിന്റെ പ്രവൃത്തിസംബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു. ഗ്രീക്കിൽ ഇല്ലാത്ത ‘തന്റെ’ ചേർത്തിട്ടില്ല.
- source_word: Λάβετε φάγετε
  choice: വാങ്ങി ഭക്ഷിക്കൂ
  rationale: തുടർച്ചയായ രണ്ടു ആജ്ഞകളും നിലനിർത്തുന്നു. ഇവിടെ കൈയിൽ സ്വീകരിക്കുക എന്ന അർഥത്തിൽ ‘വാങ്ങി’ സ്വാഭാവികമാണ്; ‘എടുക്കൂ, ഭക്ഷിക്കൂ’ എന്ന കൂടുതൽ രൂപസമാനമായ വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: τοῦτό ἐστιν
  choice: ഇത് ... ആണ്
  rationale: ലളിതമായ കോപുല ἐστιν നേരിട്ട് പരിഭാഷപ്പെടുത്തി; ‘അർഥമാക്കുന്നു’ അല്ലെങ്കിൽ ‘സൂചിപ്പിക്കുന്നു’ എന്ന വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: τὸ σῶμά μου
  choice: എന്റെ ശരീരം
  rationale: σῶμα എന്ന സാധാരണ പദവും ഒന്നാംപുരുഷ ഉടമസ്ഥതയും നേരിട്ട് പകർന്നു.
theological_decisions:
- issue: യേശുവിന്റെ അന്ത്യത്താഴവിരുന്നിലെ ‘ഇത് എന്റെ ശരീരമാണ്’ എന്ന പ്രസ്താവന
  choice: ഇത് എന്റെ ശരീരമാണ്
  alternative: ഇത് എന്റെ ശരീരത്തെ അർഥമാക്കുന്നു / സൂചിപ്പിക്കുന്നു
  rationale: ഗ്രീക്ക് പാഠം ലളിതമായ ἐστιν (‘ആണ്’) ഉപയോഗിക്കുന്നു. കർത്തൃഭോജനത്തെക്കുറിച്ചുള്ള പ്രത്യേക ദൈവശാസ്ത്രവ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ അടിച്ചേൽപ്പിക്കാതെ മൂലത്തിലെ വാക്കുകളും അതിലുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ആദരവാർന്നതുമായ വിവരണശൈലി. പരമ്പരാഗത ബൈബിൾഭാഷയുടെ അനാവശ്യ കാഠിന്യം ഒഴിവാക്കി; എന്നാൽ അന്ത്യത്താഴവിരുന്നിലെ നിർണായക പ്രസ്താവനയുടെ രൂപവും ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും സംരക്ഷിച്ചു.
