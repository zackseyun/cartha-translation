lexical_decisions:
- source_word: Τοῦ δὲ Ἰησοῦ γενομένου
  choice: യേശു … ആയിരിക്കുമ്പോൾ
  rationale: γίνομαι ഉൾപ്പെട്ട ജനിറ്റീവ് അബ്സല്യൂട്ട് ഇവിടെ പശ്ചാത്തലസമയം സൂചിപ്പിക്കുന്നു. സ്വാഭാവികമായ മലയാളത്തിൽ സാഹചര്യകാലത്തിന്റെ അർഥം നൽകാൻ ‘ആയിരിക്കുമ്പോൾ’ എന്നു പരിഭാഷപ്പെടുത്തി; ‘ആയിത്തീർന്നപ്പോൾ’ എന്ന അക്ഷരാർഥപ്രയോഗം ഒഴിവാക്കി.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇവിടെ δέ ശക്തമായ വിരോധമല്ല, മൃദുവായ ആഖ്യാനബന്ധമാണ്. മലയാളത്തിലെ വാക്യപ്രവാഹം തന്നെ രംഗമാറ്റം വ്യക്തമാക്കുന്നതിനാൽ ‘എന്നാൽ’ അല്ലെങ്കിൽ ‘ഇപ്പോൾ’ ചേർക്കുന്നത് അനാവശ്യമായ അർഥഭാരം സൃഷ്ടിക്കും.
- source_word: ἐν Βηθανίᾳ
  choice: ബഥാന്യയിൽ
  rationale: ἐν എന്നതിന്റെ സ്ഥലസൂചനയും Βηθανία എന്ന സ്ഥലനാമവും നേരിട്ട്, സ്വാഭാവികമായി നൽകി.
- source_word: ἐν οἰκίᾳ
  choice: വീട്ടിൽ
  rationale: സന്ദർഭത്തിൽ οἰκία ഭൗതികമായ വാസസ്ഥലത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘വീട്ടിൽ’ ആ അർഥം ലളിതമായി നൽകുന്നു.
- source_word: Σίμωνος
  choice: ശിമോന്റെ
  rationale: ജനിറ്റീവ് രൂപം വീടിന്റെ ഉടമസ്ഥബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിലെ സംബന്ധികരൂപം ഉപയോഗിച്ചു.
- source_word: τοῦ λεπροῦ
  choice: കുഷ്ഠരോഗിയായ
  rationale: λεπρός ശിമോനെ തിരിച്ചറിയിക്കുന്ന വിശേഷണമാണ്. ‘കുഷ്ഠരോഗിയായ’ എന്ന പരമ്പരാഗതവും സംക്ഷിപ്തവുമായ രൂപം നിലനിർത്തി; എന്നാൽ ഇത് ആധുനിക വൈദ്യശാസ്ത്രത്തിലെ ഹാൻസൻസ് രോഗം മാത്രമാണെന്നോ രോഗം അപ്പോൾ നിലവിലുണ്ടായിരുന്നെന്നോ നിർണയിക്കുന്നില്ല.
theological_decisions:
- issue: ‘കുഷ്ഠരോഗിയായ ശിമോൻ’ എന്ന വിശേഷണം രോഗത്തിന്റെ അന്നത്തെ നിലയെക്കുറിച്ച് നൽകാവുന്ന സൂചന
  choice: ഗ്രീക്കിലെ തിരിച്ചറിയൽവിശേഷണം നിലനിർത്തി; ശിമോന് അപ്പോൾ രോഗമുണ്ടായിരുന്നോ മുമ്പ് ഉണ്ടായിരുന്നോ എന്ന് മുഖ്യവാചകത്തിൽ തീരുമാനിച്ചിട്ടില്ല.
  alternative: ‘മുമ്പ് കുഷ്ഠരോഗിയായിരുന്ന ശിമോൻ’ അല്ലെങ്കിൽ ‘ചർമരോഗമുള്ള ശിമോൻ’
  rationale: മൂലപാഠം രോഗത്തിന്റെ കാലസ്ഥിതിയോ സൗഖ്യപ്പെട്ടതിനെക്കുറിച്ചുള്ള പാരമ്പര്യമോ ആധുനിക രോഗനിർണയമോ വ്യക്തമാക്കുന്നില്ല. അതിനാൽ അവയിൽ ഒന്നും പരിഭാഷയിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തി. സമയബന്ധം ‘ആയിരിക്കുമ്പോൾ’ എന്ന സാധാരണ പ്രയോഗത്തിലൂടെ വ്യക്തമാക്കി; δέ-യ്ക്ക് കൃത്രിമമായ ഒരു ബന്ധപദം ചേർത്തിട്ടില്ല.
