  text: യേശു ബഥാന്യയിൽ കുഷ്ഠരോഗിയായ[b] ശിമോന്റെ വീട്ടിൽ ആയിരുന്നപ്പോൾ[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘യേശു ബഥാന്യയിൽ ആയിരുന്നപ്പോൾ.’ ഗ്രീക്കിലെ ജനിറ്റീവ് അബ്സല്യൂട്ട് ഇവിടെ സംഭവത്തിന്റെ സമയപശ്ചാത്തലം ഒരുക്കുന്നു.'
