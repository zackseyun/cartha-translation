id: MAT.26.49
reference: Matthew 26:49
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εὐθέως προσελθὼν τῷ Ἰησοῦ εἶπεν· Χαῖρε, ῥαββί· καὶ κατεφίλησεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/049.yaml
  text: And immediately he came up to Jesus and said[a], “Greetings[b], Rabbi,” and kissed him.
translation:
  language: ml
  text: അവൻ ഉടനെ യേശുവിന്റെ അടുത്തുചെന്ന്, “നമസ്കാരം, റബ്ബീ![a]” എന്നു പറഞ്ഞു; അവനെ ചുംബിച്ചു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “വന്ദനം, റബ്ബീ!”'
    reason: lexical_alternative
  - marker: b
    text: 'ഗ്രീക്ക് ക്രിയയ്ക്ക് ഊന്നലോടെയോ ആവർത്തിച്ചോ ഉള്ള ചുംബനം സൂചിപ്പിക്കാനാകും: “അവനെ തീവ്രമായി ചുംബിച്ചു” അല്ലെങ്കിൽ “അവനെ വീണ്ടും വീണ്ടും ചുംബിച്ചു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: ഉടനെ
  rationale: പ്രവർത്തനത്തിന്റെ തൽക്ഷണതയും വിവരണത്തിലെ വേഗവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: προσελθὼν τῷ Ἰησοῦ
  choice: യേശുവിന്റെ അടുത്തുചെന്ന്
  rationale: യേശുവിനെ സമീപിക്കുന്ന ശാരീരിക ചലനം സ്വാഭാവികമായ മലയാളപ്രയോഗത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: Χαῖρε
  choice: വന്ദനം
  rationale: ഇവിടെ ഇത് ‘സന്തോഷിക്കുക’ എന്ന അക്ഷരാർഥത്തിലുള്ള കല്പനയല്ല, പതിവ് അഭിവാദനമാണ്. ‘വന്ദനം’ മാന്യവും ആധുനികവുമായ അഭിവാദനരൂപമാണ്.
- source_word: ῥαββί
  choice: റബ്ബീ
  rationale: ഗ്രീക്ക് പാഠം സംരക്ഷിക്കുന്ന സെമിറ്റിക് അഭിസംബോധന മലയാളലിപിയിൽ നിലനിർത്തുന്നു; അതിനെ ‘ഗുരോ’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: κατεφίλησεν
  choice: ചുംബിച്ചു
  rationale: ക്രിയയ്ക്ക് ഊന്നിയതോ ആവർത്തിച്ചതോ ആയ ചുംബനം സൂചിപ്പിക്കാനാകുമെങ്കിലും, മുഖ്യവാചകത്തിൽ അമിതവ്യാഖ്യാനം ഒഴിവാക്കി സാധാരണ ക്രിയ ഉപയോഗിക്കുന്നു; അധിക സൂചന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: αὐτόν
  choice: അവനെ
  rationale: കർമസ്ഥാനത്തുള്ള സർവനാമം യേശുവിനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ നേരിട്ട് പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: യൂദാസിന്റെ Χαῖρε എന്ന അഭിവാദനം
  choice: വന്ദനം
  alternative: നമസ്കാരം
  rationale: ഇവിടെ പദം ദൈവശാസ്ത്രപരമായ സ്തുതിവാക്യമല്ല, സാമൂഹിക അഭിവാദനമാണ്. വഞ്ചനയുടെ വിരോധാഭാസം വിവരണത്തിൽനിന്നുതന്നെ പ്രകടമാകാൻ അനുവദിക്കുന്നു.
- issue: κατεφίλησεν എന്ന ക്രിയയുടെ തീവ്രത
  choice: ചുംബിച്ചു
  alternative: ആവേശത്തോടെ ചുംബിച്ചു / വീണ്ടും വീണ്ടും ചുംബിച്ചു
  rationale: മൂലക്രിയയ്ക്ക് തീവ്രതയോ ആവർത്തനമോ സൂചിപ്പിക്കാനാകുന്നു; എന്നാൽ ഏതാണ് ഉദ്ദേശിച്ചതെന്ന് ഉറപ്പില്ല. അതിനാൽ മുഖ്യവാചകം നിഷ്പക്ഷമായി വെച്ച് സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ വിവരണശൈലി. ‘റബ്ബീ’ എന്ന ചരിത്രപരമായ അഭിസംബോധന അതേപടി നിലനിർത്തി; ക്രിയയുടെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
