revisions:
- from: അവൻ ഉടനെ യേശുവിന്റെ അടുത്തുചെന്ന്, “വന്ദനം, റബ്ബീ![a]” എന്നു പറഞ്ഞു; പിന്നെ അവനെ ചുംബിച്ചു.[b]
  to: അവൻ ഉടനെ യേശുവിന്റെ അടുത്തുചെന്ന്, “നമസ്കാരം, റബ്ബീ![a]” എന്നു പറഞ്ഞു; അവനെ ചുംബിച്ചു.[b]
  rationale: The revision uses a more idiomatic modern Malayalam greeting and removes an unnecessary explicit temporal adverb. It retains the source’s concise coordination and preserves the debated intensive force of κατεφίλησεν in the footnote without overinterpreting it.
