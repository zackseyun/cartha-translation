id: MAT.26.44
reference: Matthew 26:44
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀφεὶς αὐτοὺς ⸂πάλιν ἀπελθὼν⸃ προσηύξατο ἐκ τρίτου τὸν αὐτὸν λόγον εἰπὼν ⸀πάλιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/044.yaml
  text: And leaving them again[a], he went away and prayed a third time, saying the same thing again.
translation:
  language: ml
  text: അവരെ വിട്ട് വീണ്ടും പോയി, മൂന്നാം പ്രാവശ്യം അതേ വാക്ക് വീണ്ടും പറഞ്ഞ് പ്രാർഥിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφεὶς αὐτοὺς
  choice: അവരെ വിട്ട്
  rationale: ശിഷ്യന്മാരെ അവിടെ വിട്ട് നീങ്ങിപ്പോയെന്ന പങ്കാളിത്തക്രിയയുടെ അർഥവും സംഭവക്രമവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: πάλιν ἀπελθὼν
  choice: വീണ്ടും അകലെ ചെന്നു
  rationale: πάλιν ആവർത്തനത്തെയും ἀπέρχομαι അവരിൽനിന്ന് മാറിപ്പോകുന്നതിനെയും സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിലെ പദക്രമമനുസരിച്ച് πάλιν പോകുന്ന പ്രവൃത്തിയോടു ചേർത്തിരിക്കുന്നു.
- source_word: προσηύξατο
  choice: പ്രാർഥിച്ചു
  rationale: പ്രാർഥിക്കുക എന്ന നേരിട്ടുള്ള അർഥം; ഭൂതകാല ആഖ്യാനത്തിന് യോജിച്ച രൂപം.
- source_word: ἐκ τρίτου
  choice: മൂന്നാം പ്രാവശ്യം
  rationale: മൂന്നാമത്തെ അവസരത്തിൽ അതേ പ്രവൃത്തി നടത്തിയെന്ന പ്രയോഗത്തിന്റെ വ്യക്തവും സ്വാഭാവികവുമായ മലയാളം.
- source_word: τὸν αὐτὸν λόγον
  choice: അതേ വാക്ക്
  rationale: λόγον ഏകവചനമായതിനാൽ ‘വാക്ക്’ എന്ന് നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അതേ പ്രാർഥനാവാക്യം/കാര്യം എന്ന വിശാലതയും ഇതിന് ഉണ്ടായിരിക്കും.
- source_word: εἰπὼν πάλιν
  choice: വീണ്ടും പറഞ്ഞുകൊണ്ട്
  rationale: അവസാനത്തെ πάλιν ഒഴിവാക്കാതെ, അതേ പ്രാർഥനാവാക്ക് ആവർത്തിച്ചുപറഞ്ഞുവെന്ന ഊന്നൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: പ്രാർഥനയുടെ ആവർത്തനം
  choice: മൂന്നാം പ്രാവശ്യം പ്രാർഥിച്ചതും അതേ വാക്ക് വീണ്ടും പറഞ്ഞതും രണ്ടും വ്യക്തമായി നിലനിർത്തി.
  alternative: ശൈലീസൗകര്യത്തിനായി അവസാനത്തെ ‘വീണ്ടും’ ഒഴിവാക്കുക.
  rationale: ഗ്രീക്കിൽ πάλιν രണ്ടുതവണ ഉള്ളതിനാൽ ആവർത്തനത്തിന്റെ ആഖ്യാനപരമായ ഊന്നൽ വ്യാഖ്യാനത്തിലൂടെ മൃദൂകരിക്കാതെ സംരക്ഷിച്ചു.
- issue: τὸν αὐτὸν λόγον എന്ന ഏകവചന പ്രയോഗം
  choice: അതേ വാക്ക്
  alternative: അതേ കാര്യം / അതേ വാക്കുകൾ
  rationale: ഏകവചനം കഴിയുന്നത്ര നിലനിർത്തിക്കൊണ്ട്, ആവർത്തിച്ച പ്രാർഥനയുടെ ഉള്ളടക്കത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവികമായ അർഥവ്യാപ്തി തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ ആവർത്തനം അസ്വാഭാവികമാകാതെ നിലനിർത്തിയിരിക്കുന്നു; ദൈവശാസ്ത്രപരമായ അധികവ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
