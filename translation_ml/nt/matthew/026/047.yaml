id: MAT.26.47
reference: Matthew 26:47
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἔτι αὐτοῦ λαλοῦντος ἰδοὺ Ἰούδας εἷς τῶν δώδεκα ἦλθεν καὶ μετ’ αὐτοῦ ὄχλος πολὺς μετὰ μαχαιρῶν καὶ ξύλων ἀπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων τοῦ λαοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/047.yaml
  text: And while he was still speaking[a], behold, Judas, one of the twelve, came, and with him a large crowd with swords and clubs[b], from the chief priests and elders of the people.
translation:
  language: ml
  text: അവൻ ഇനിയും സംസാരിച്ചുകൊണ്ടിരിക്കുമ്പോൾ, ഇതാ, പന്ത്രണ്ടുപേരിൽ ഒരാളായ യൂദാ വന്നു; അവനോടൊപ്പം വാളുകളും വടികളുമായി[b] മഹാപുരോഹിതന്മാരുടെയും ജനത്തിന്റെ മൂപ്പന്മാരുടെയും അടുക്കൽനിന്ന്[a] ഒരു വലിയ ജനക്കൂട്ടവും വന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മഹാപുരോഹിതന്മാരും ജനത്തിന്റെ മൂപ്പന്മാരും അയച്ചവർ.’ ഗ്രീക്കിൽ അക്ഷരാർഥത്തിന് അടുത്തത് ‘മഹാപുരോഹിതന്മാരുടെയും ജനത്തിന്റെ മൂപ്പന്മാരുടെയും അടുക്കൽനിന്ന്’ എന്നാണ്.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, ‘മരക്കോലുകളുമായി.’ ഗ്രീക്ക് പദം അക്ഷരാർഥത്തിൽ മരക്കഷണങ്ങളെ സൂചിപ്പിക്കുന്നു; ഇവിടെ അവ വടികളായി ഉപയോഗിച്ചതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι αὐτοῦ λαλοῦντος
  choice: അവൻ ഇനിയും സംസാരിച്ചുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് ഘടന സമകാലികമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ἔτι എന്നതിന്റെ തുടർച്ചാഭാവം ‘ഇനിയും’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: വിവരണത്തിന് സജീവതയും ഉടനടിത്തവും നൽകുന്ന ശ്രദ്ധാകർഷക വ്യവഹാരസൂചകത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Ἰούδας
  choice: യൂദാ
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: εἷς τῶν δώδεκα
  choice: പന്ത്രണ്ടുപേരിൽ ഒരാൾ
  rationale: ഭാഗസൂചക പ്രയോഗത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: ἦλθεν
  choice: വന്നു
  rationale: ἔρχομαι എന്ന ക്രിയയുടെ ലളിതമായ ആഖ്യാനസന്ദർഭത്തിലുള്ള തുല്യരൂപം.
- source_word: ὄχλος πολὺς
  choice: ഒരു വലിയ ജനക്കൂട്ടം
  rationale: πολύς എന്നതിന്റെ അളവുസൂചന നിലനിർത്തുന്നു; ‘ലഹളക്കൂട്ടം’ എന്നതുപോലെ മൂലപദത്തിൽ നേരിട്ട് ഇല്ലാത്ത വൈരഭാവം ചേർക്കുന്നില്ല.
- source_word: μετὰ μαχαιρῶν
  choice: വാളുകളുമായി
  rationale: μάχαιρα വാൾ അല്ലെങ്കിൽ കഠാരസദൃശ ആയുധം സൂചിപ്പിക്കാം; ഈ സന്ദർഭത്തിൽ ‘വാൾ’ വിശാലവും പതിവുമായ തുല്യപദമാണ്.
- source_word: καὶ ξύλων
  choice: വടികളുമായി
  rationale: ξύλον അക്ഷരാർഥത്തിൽ മരം അഥവാ മരക്കഷണം എന്നാണെങ്കിലും, ആയുധങ്ങളുടെ പട്ടികയിൽ ബഹുവചനമായി വരുന്നതിനാൽ അടിക്കാനുള്ള വടികളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘വടി’ മലയാളത്തിൽ ഉദ്ദേശിച്ച ഉപയോഗം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἀπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων τοῦ λαοῦ
  choice: മഹാപുരോഹിതന്മാരുടെയും ജനത്തിന്റെ മൂപ്പന്മാരുടെയും അടുക്കൽനിന്നുള്ളവർ
  rationale: ἀπό ഉറവിടമോ ബന്ധമോ സൂചിപ്പിക്കുന്നു. ‘അയച്ചവർ’ എന്ന് ക്രിയ ചേർക്കാതെ ഗ്രീക്കിലെ അവ്യക്തത നിലനിർത്തുന്നു.
theological_decisions:
- issue: ജനക്കൂട്ടത്തെ യഹൂദനേതാക്കൾ ഔദ്യോഗികമായി അയച്ചതാണെന്ന് വ്യക്തമാക്കണമോ
  choice: മഹാപുരോഹിതന്മാരുടെയും ജനത്തിന്റെ മൂപ്പന്മാരുടെയും അടുക്കൽനിന്നുള്ളവർ
  alternative: മഹാപുരോഹിതന്മാരും ജനത്തിന്റെ മൂപ്പന്മാരും അയച്ചവർ
  rationale: ἀπό ഉറവിടം സൂചിപ്പിക്കുകയും സന്ദർഭം നിയോഗത്തെ സൂചിപ്പിക്കാവുന്നതുമാണ്; എന്നാൽ മൂലവാക്യത്തിൽ ‘അയച്ചു’ എന്ന ക്രിയ ഇല്ല. അതിനാൽ പ്രധാനപാഠത്തിൽ കൂടുതൽ ശക്തമായ അവകാശവാദം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ഇതാ’ എന്ന പരമ്പരാഗതമായെങ്കിലും വ്യക്തമായി മനസ്സിലാകുന്ന ശ്രദ്ധാകർഷക പദം നിലനിർത്തി. ἀπό എന്നതിലെ ഉറവിടം/നിയോഗം സംബന്ധിച്ച അവ്യക്തത പ്രധാനപാഠത്തിൽ സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും ബന്ധപ്പെട്ട ഭാഗത്തിന് പിന്നാലെ പ്രധാനപാഠത്തിൽ നൽകിയിട്ടുണ്ട്.
