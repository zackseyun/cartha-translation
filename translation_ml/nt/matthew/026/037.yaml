  text: καὶ παραλαβὼν τὸν Πέτρον καὶ τοὺς δύο υἱοὺς Ζεβεδαίου ἤρξατο λυπεῖσθαι καὶ ἀδημονεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/037.yaml
  text: And taking Peter and the two sons of Zebedee with him[a], he began to be sorrowful and deeply distressed.
translation:
  language: ml
  text: പത്രോസിനെയും സെബെദിയുടെ രണ്ടു പുത്രന്മാരെയും കൂടെ കൂട്ടിക്കൊണ്ട്, അവൻ ദുഃഖിക്കാനും അത്യന്തം വ്യാകുലനാകാനും തുടങ്ങി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അവൻ ദുഃഖിതനാകാനും വ്യാകുലനാകാനും തുടങ്ങി.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραλαβὼν
  choice: കൂടെ കൂട്ടിക്കൊണ്ട്
  rationale: തിരഞ്ഞെടുത്ത ശിഷ്യന്മാരെ യേശു തന്നോടൊപ്പം കൊണ്ടുപോയെന്ന ബന്ധപരമായ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τοὺς δύο υἱοὺς Ζεβεδαίου
  choice: സെബെദിയുടെ രണ്ടു പുത്രന്മാരെ
  rationale: ഗ്രീക്കിലെ തിരിച്ചറിയിപ്പ് അതേപടി നിലനിർത്തുന്നു; ഈ വാക്യത്തിൽ ഇല്ലാത്ത യാക്കോബ്, യോഹന്നാൻ എന്നീ പേരുകൾ ചേർക്കുന്നില്ല.
- source_word: ἤρξατο
  choice: തുടങ്ങി
  rationale: തുടക്കത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ക്രിയയുടെ അർഥം നേരായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: λυπεῖσθαι
  choice: ദുഃഖിക്കാൻ
  rationale: യഥാർഥമായ ദുഃഖാനുഭവം ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ഭാഷയിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀδημονεῖν
  choice: അത്യന്തം അസ്വസ്ഥനാകാൻ
  rationale: കടുത്ത ആന്തരിക വ്യാകുലതയും ക്ലേശവും സൂചിപ്പിക്കുന്നു; λυπεῖσθαι എന്നതിനെക്കാൾ ശക്തമായ ഭാവം കാത്തുസൂക്ഷിക്കുമ്പോഴും നിരാശ എന്ന ആശയം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: καὶ ... καὶ
  choice: -നെയും ... -നെയും / -ാനും ... -ാനും
  rationale: ആളുകളെയും രണ്ടു വികാരാവസ്ഥകളെയും കൂട്ടിച്ചേർക്കുന്ന ആവർത്തിത καί മലയാളത്തിലെ സ്വാഭാവിക സമുച്ചയപ്രത്യയങ്ങളിലൂടെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ക്രിസ്തുശാസ്ത്രത്തിന്റെ പശ്ചാത്തലത്തിൽ യേശുവിന്റെ വികാരാവസ്ഥയുടെ വിവരണം
  choice: യേശുവിന്റെ യഥാർഥമായ മാനുഷിക ദുഃഖവും കടുത്ത അസ്വസ്ഥതയും രണ്ടു ക്രിയകളിലൂടെയും നേരായി വിവർത്തനം ചെയ്തു.
  alternative: വികാരപരമായ ദൗർബല്യം ഒഴിവാക്കാൻ ഭാഷ മയപ്പെടുത്തുക, അല്ലെങ്കിൽ ഗ്രീക്കിനപ്പുറം ‘ഭീതി’യോ ‘നിരാശ’യോ ആയി ശക്തിപ്പെടുത്തുക.
  rationale: മൂലപാഠം യേശുവിന്റെ യഥാർഥ മാനുഷിക കഷ്ടാനുഭവം തുറന്നുപറയുന്നു. അതിനെ കുറച്ചുകാണിക്കാതെയും പ്രത്യാശയില്ലാത്ത നിരാശയായി അതിവ്യാഖ്യാനിക്കാതെയും ഉള്ള ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളം; ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘സെബെദിയുടെ’ എന്ന രൂപം മൂലപാഠത്തിലെ ഉടമസ്ഥബന്ധം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം വാക്യാവസാനത്ത് നൽകിയിരിക്കുന്നു.
