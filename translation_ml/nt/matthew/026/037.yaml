  to: പത്രോസിനെയും സെബെദിയുടെ രണ്ടു പുത്രന്മാരെയും കൂടെ കൂട്ടിക്കൊണ്ട്, അവൻ ദുഃഖിക്കാനും അത്യന്തം വ്യാകുലനാകാനും തുടങ്ങി.[a]
