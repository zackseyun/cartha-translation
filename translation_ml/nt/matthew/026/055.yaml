  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν ἐκείνῃ τῇ ὥρᾳ εἶπεν ὁ Ἰησοῦς τοῖς ὄχλοις· Ὡς ἐπὶ λῃστὴν ἐξήλθατε μετὰ μαχαιρῶν καὶ ξύλων συλλαβεῖν με; καθ’ ⸀ἡμέραν ⸂ἐν τῷ ἱερῷ ἐκαθεζόμην διδάσκων⸃ καὶ οὐκ ἐκρατήσατέ με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/055.yaml
  text: At that hour Jesus said to the crowds[a], “Have you come out with swords and clubs to arrest me, as against a robber? Day after day I was sitting in the temple teaching[b], and you did not seize me.”
translation:
  language: ml
  text: 'ആ സമയത്ത് യേശു ജനക്കൂട്ടങ്ങളോടു പറഞ്ഞു: “ഞാൻ ഒരു കൊള്ളക്കാരനാണെന്നപോലെ എന്നെ പിടികൂടാൻ വാളുകളും വടികളുമായി നിങ്ങൾ വന്നിരിക്കുന്നുവോ? ഞാൻ ദിവസേന ദേവാലയത്തിൽ ഇരുന്നു പഠിപ്പിച്ചുകൊണ്ടിരുന്നു; എന്നിട്ടും നിങ്ങൾ എന്നെ പിടിച്ചില്ല.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കൊള്ളക്കാരൻ” എന്നു പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്ക് പദത്തിന് സായുധ കവർച്ചക്കാരൻ, വഴിക്കൊള്ളക്കാരൻ, ചില സന്ദർഭങ്ങളിൽ കലാപകാരി എന്നീ അർഥങ്ങളും വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: ആ സമയത്ത്
  rationale: ഗ്രീക്കിലെ സമയസൂചന സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; അക്ഷരാർഥമായ ‘ആ നാഴികയിൽ’ അനാവശ്യമായി പുരാതനഭാവം സൃഷ്ടിക്കും.
- source_word: τοῖς ὄχλοις
  choice: ജനക്കൂട്ടങ്ങളോടു
  rationale: ὄχλοις എന്ന ബഹുവചനരൂപം നിലനിർത്തുന്നു.
- source_word: Ὡς ἐπὶ λῃστὴν
  choice: ഞാൻ ഒരു കൊള്ളക്കാരനാണെന്നപോലെ
  rationale: യേശുവിനെ അപകടകാരിയായ കുറ്റവാളിയായി കണക്കാക്കി ആയുധങ്ങളോടെ വന്നതിനെ ചോദ്യം ചെയ്യുന്ന ഗ്രീക്ക് പ്രയോഗം സ്വാഭാവികമായി നൽകുന്നു; λῃστής എന്നതിന്റെ വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: μετὰ μαχαιρῶν καὶ ξύλων
  choice: വാളുകളും വടികളുമായി
  rationale: ആയുധങ്ങളായി ഉപയോഗിക്കുന്ന ξύλα ഇവിടെ ‘വടികൾ’ എന്നു വ്യക്തമായി നൽകുന്നു.
- source_word: συλλαβεῖν με
  choice: എന്നെ പിടികൂടാൻ
  rationale: ബന്ധനത്തിനോ അറസ്റ്റിനോ വേണ്ടിയുള്ള പിടിത്തം എന്ന സന്ദർഭാർഥം സാധാരണ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: καθ’ ἡμέραν
  choice: ദിവസേന
  rationale: ഓരോ ദിവസവും എന്ന വിതരണാത്മക ആശയം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἐν τῷ ἱερῷ
  choice: ദേവാലയത്തിൽ
  rationale: ἱερόν ദേവാലയസമുച്ചയത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘ദേവാലയത്തിൽ’ എന്നത് സ്വാഭാവികമാണ്, അകത്തെ വിശുദ്ധമന്ദിരം മാത്രം എന്നു നിർബന്ധമായി ചുരുക്കുന്നില്ല.
- source_word: ἐκαθεζόμην διδάσκων
  choice: ഇരുന്നു പഠിപ്പിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണ്ണകാലത്തിന്റെ തുടർച്ചയും ഇരുന്നുകൊണ്ടുള്ള പഠിപ്പിക്കലും നിലനിർത്തുന്നു.
- source_word: οὐκ ἐκρατήσατέ με
  choice: നിങ്ങൾ എന്നെ പിടിച്ചില്ല
  rationale: κρατέω എന്നതിന്റെ നേരിട്ടുള്ള പിടിച്ചെടുക്കൽഭാവം നൽകുന്നു; മുൻപത്തെ συλλαβεῖν എന്നതുമായി മലയാളത്തിൽ ഭാഗിക ആവർത്തനം സ്വാഭാവികമാണ്.
theological_decisions:
- issue: λῃστής എന്ന പദത്തിന്റെ കുറ്റകൃത്യ-രാഷ്ട്രീയ വ്യാപ്തി
  choice: കൊള്ളക്കാരൻ
  alternative: കവർച്ചക്കാരൻ; സായുധ കൊള്ളക്കാരൻ; കലാപകാരി
  rationale: ഈ സന്ദർഭത്തിൽ യേശുവിനെ ആയുധധാരിയായ അപകടകാരിയായ കുറ്റവാളിയെപ്പോലെ സമീപിച്ചതാണ് മുഖ്യ ആശയം. ‘കലാപകാരി’ എന്ന് മുഖ്യപാഠത്തിൽ നൽകുന്നത് രാഷ്ട്രീയ അർഥം അനാവശ്യമായി നിർണ്ണയിക്കും; അതിനാൽ വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ഗ്രീക്ക് ബഹുവചനവും അപൂർണ്ണകാലത്തിന്റെ തുടർച്ചയും λῃστής എന്ന പദത്തിന്റെ അർഥവ്യാപ്തിയും കഴിയുന്നത്ര സംരക്ഷിച്ചു. നൽകിയ ഇംഗ്ലീഷ് അടിക്കുറിപ്പ് b മുഖ്യവാക്യത്തിന്റെ മുൻപരിഭാഷ ആവർത്തിക്കുന്നതും പ്രസക്തമായ പാഠഭേദമല്ലാത്തതുമായതിനാൽ ഉൾപ്പെടുത്തിയിട്ടില്ല; എല്ലാ ഉൾപ്പെടുത്തിയ അടിക്കുറിപ്പുകളുടെയും ചിഹ്നം മുഖ്യപാഠത്തിൽ കാണുന്നു.
