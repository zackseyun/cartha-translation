id: MAT.26.4
reference: Matthew 26:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ συνεβουλεύσαντο ἵνα τὸν Ἰησοῦν δόλῳ κρατήσωσιν καὶ ἀποκτείνωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/004.yaml
  text: and they conspired so that they might seize Jesus by stealth and kill him.
translation:
  language: ml
  text: യേശുവിനെ ചതിപ്രയോഗിച്ച് പിടികൂടി കൊല്ലേണ്ടതിന് അവർ കൂടിയാലോചിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνεβουλεύσαντο
  choice: അവർ കൂടിയാലോചിച്ചു
  rationale: പരസ്പരം ആലോചിച്ച് ഒരു പദ്ധതി രൂപപ്പെടുത്തുക എന്ന മധ്യപ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു; ‘ഗൂഢാലോചന നടത്തി’ എന്നത് സന്ദർഭസമ്മതമെങ്കിലും പദത്തിൽ തന്നെയുള്ള ദുഷ്ടലക്ഷ്യം അതിരുകടന്ന് മുൻകൂട്ടി വ്യക്തമാക്കാം.
- source_word: δόλῳ
  choice: ചതിപ്രയോഗിച്ച്
  rationale: വഞ്ചനയോ തന്ത്രമോ ഉപയോഗിച്ചുള്ള രഹസ്യനടപടി എന്ന അർഥം നൽകുന്നു; വെറും ‘രഹസ്യമായി’ എന്നതിനെക്കാൾ δόλος എന്ന പദത്തിലെ വഞ്ചനാഭാവം സംരക്ഷിക്കുന്നു.
- source_word: κρατήσωσιν
  choice: പിടികൂടി
  rationale: ഈ സന്ദർഭത്തിൽ ഒരാളെ ബലമായി പിടികൂടുകയോ കസ്റ്റഡിയിലെടുക്കുകയോ ചെയ്യുക എന്ന അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: ἀποκτείνωσιν
  choice: കൊല്ലേണ്ടതിന്
  rationale: കൊല്ലുക എന്ന നേരിട്ടുള്ള അർഥവും ἵνα ആരംഭിക്കുന്ന ഉദ്ദേശ്യഘടനയും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ἵνα ഘടനയിലെ ഉദ്ദേശ്യബന്ധം
  choice: കൊല്ലേണ്ടതിന്
  alternative: പിടികൂടി കൊല്ലാൻ
  rationale: ആലോചനയുടെ ലക്ഷ്യം യേശുവിനെ ചതിയോടെ പിടികൂടുകയും കൊല്ലുകയും ചെയ്യുക എന്നതാണെന്ന് വ്യക്തമാക്കുന്നു; ഫലമെന്നതിലുപരി ഉദ്ദേശ്യം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പവും മാന്യവുമായ മലയാളം. വാക്യത്തിന്റെ ദുഷ്ടപദ്ധതിയെയും ഉദ്ദേശ്യഘടനയെയും വ്യക്തമായി സൂക്ഷിച്ചിരിക്കുന്നു.
