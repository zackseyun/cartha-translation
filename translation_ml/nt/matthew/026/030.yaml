lexical_decisions:
- source_word: ὑμνήσαντες
  choice: സ്തുതിഗീതം പാടിയശേഷം
  rationale: ὑμνέω എന്ന ക്രിയയുടെ ഭൂതകാല കൃദന്തരൂപമാണിത്; ദൈവത്തെ സ്തുതിച്ചുകൊണ്ടുള്ള ഗീതാലാപനം സൂചിപ്പിക്കുന്നു. പ്രധാനക്രിയയ്ക്കു മുമ്പ് നടന്ന പ്രവൃത്തിയെന്ന ബന്ധം ‘പാടിയശേഷം’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു. പെസഹാഭക്ഷണത്തിന്റെ പശ്ചാത്തലത്തിൽ ‘സ്തുതിഗീതം’ യോജിക്കുന്നുവെങ്കിലും, പൊതുവായി സ്തുതി പാടുക എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἐξῆλθον
  choice: പുറപ്പെട്ടു
  rationale: ἐξέρχομαι ഇവിടെ പുറത്തേക്കു പോകുക അഥവാ യാത്രതിരിക്കുക എന്നാണ്. ലക്ഷ്യസ്ഥാനം പിന്നാലെ വരുന്നതിനാൽ ‘പുറപ്പെട്ടു’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: ഒലിവുമലയിലേക്ക്
  rationale: സ്ഥിരമായ ഭൂമിശാസ്ത്രനാമത്തെ സ്വാഭാവിക മലയാളരൂപത്തിൽ നിലനിർത്തുന്നു; εἰς ലക്ഷ്യത്തിലേക്കുള്ള ചലനം സൂചിപ്പിക്കുന്നതിനാൽ ‘-ലേക്ക്’ ഉപയോഗിച്ചു.
- source_word: καὶ
  choice: തുടർച്ചയായ വാക്യക്രമത്തിലൂടെ സൂചിപ്പിച്ചു
  rationale: ഗ്രീക്കിലെ ലളിതമായ ആഖ്യാനബന്ധകമാണ്. ഒറ്റവാക്യമായി മലയാളത്തിലാക്കുമ്പോൾ പ്രത്യേകമായി ‘പിന്നെ’ ചേർക്കാതെ ക്രിയാക്രമംകൊണ്ട് ബന്ധം സ്വാഭാവികമായി വ്യക്തമാകുന്നു; ഇതിലൂടെ അധികമായ കാലസൂചന ഇറക്കുമതി ചെയ്യുന്നില്ല.
