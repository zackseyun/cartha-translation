id: MAT.26.62
reference: Matthew 26:62
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀναστὰς ὁ ἀρχιερεὺς εἶπεν αὐτῷ· Οὐδὲν ἀποκρίνῃ; τί οὗτοί σου καταμαρτυροῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/062.yaml
  text: And the high priest stood up and said to him[b][a], “Do you give no answer? What is it that these men are testifying against you?”
translation:
  language: ml
  text: 'അപ്പോൾ മഹാപുരോഹിതൻ എഴുന്നേറ്റുനിന്ന് അവനോടു പറഞ്ഞു: “നീ ഒന്നും മറുപടി പറയുന്നില്ലേ? ഇവർ നിനക്കെതിരായി എന്താണ് സാക്ഷ്യം പറയുന്നത്?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστὰς
  choice: എഴുന്നേറ്റുനിന്ന്
  rationale: മഹാപുരോഹിതൻ സംസാരിക്കുന്നതിനുമുമ്പ് ചെയ്ത ശാരീരിക പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായും ദൃശ്യമായും അത് പകരുന്നു.
- source_word: ὁ ἀρχιερεὺς
  choice: മഹാപുരോഹിതൻ
  rationale: ഈ യഹൂദ മതപദവിയുടെ ഏകവചനത്തിലുള്ള പതിവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: εἶπεν αὐτῷ
  choice: അവനോടു പറഞ്ഞു
  rationale: മൂലപാഠത്തിലെ സർവനാമം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ യേശുവാണ് സൂചിതൻ.
- source_word: Οὐδὲν ἀποκρίνῃ;
  choice: നീ ഒന്നും മറുപടി പറയുന്നില്ലേ?
  rationale: നിഷേധാത്മക ചോദ്യത്തിന്റെ സമ്മർദവും മറുപടി ആവശ്യപ്പെടുന്ന ഭാവവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τί
  choice: എന്താണ്
  rationale: സാക്ഷ്യത്തിന്റെ ഉള്ളടക്കം ചോദിക്കുന്ന ലളിതമായ ചോദ്യം പകരുന്നു; മൂലത്തിൽ ഇല്ലാത്ത വിശദീകരണം ചേർക്കുന്നില്ല.
- source_word: οὗτοί
  choice: ഇവർ
  rationale: സന്നിഹിതരായ സാക്ഷികളെ ചൂണ്ടിക്കാണിക്കുന്ന ബഹുവചന സർവനാമത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ രൂപം.
- source_word: σου καταμαρτυροῦσιν
  choice: നിനക്കെതിരായി ... സാക്ഷ്യം പറയുന്നത്
  rationale: നിയമപരമായ പ്രതികൂലസാക്ഷ്യത്തിന്റെ അർഥവും വർത്തമാനകാല പ്രവർത്തനവും സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ കോടതി-സന്ദർഭ ഭാഷയാണ് ഉപയോഗിച്ചത്. മൂലത്തിലെ രണ്ട് നേരിട്ടുള്ള ചോദ്യങ്ങളും അവയുടെ സമ്മർദഭാവവും നിലനിർത്തി.
