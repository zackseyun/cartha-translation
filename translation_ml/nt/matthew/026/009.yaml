  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐδύνατο γὰρ ⸀τοῦτο πραθῆναι πολλοῦ καὶ δοθῆναι πτωχοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/009.yaml
  text: For this could have been sold for a great deal and given to the poor[a].
translation:
  language: ml
  text: ഇത് വലിയ വിലയ്ക്ക് വിൽക്കുകയും ദരിദ്രർക്കു നൽകുകയും ചെയ്യാമായിരുന്നല്ലോ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വളരെയധികം വിലയ്ക്ക്” അല്ലെങ്കിൽ “ഉയർന്ന വിലയ്ക്ക്.” ഗ്രീക്കിൽ വില സൂചിപ്പിക്കുന്ന ഷഷ്ഠീവിഭക്തിയാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδύνατο
  choice: കൊടുക്കാമായിരുന്നല്ലോ
  rationale: ഭൂതകാലത്തിൽ യാഥാർഥ്യമാകാതെ പോയ സാധ്യതയെ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; ഈ സാധ്യത ‘വിൽക്കുക’, ‘കൊടുക്കുക’ എന്നീ ഏകോപിത ക്രിയകൾക്കു ബാധകമാണ്.
- source_word: γὰρ
  choice: -ല്ലോ
  rationale: മുൻവാക്യത്തിലെ പരാതിക്കുള്ള വിശദീകരണഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: τοῦτο
  choice: ഇത്
  rationale: മുൻപ് പരാമർശിച്ച വസ്തുവിലേക്കുള്ള നപുംസകലിംഗ ഏകവചന സൂചകസർവനാമത്തിന്റെ ലാളിത്യവും അനിർദിഷ്ടതയും നിലനിർത്തുന്നു.
- source_word: πραθῆναι
  choice: വിറ്റ്
  rationale: ‘വിൽക്കപ്പെടുക’ എന്ന നിഷ്ക്രിയ അർഥം മലയാളത്തിലെ സ്വാഭാവിക സാധ്യതാനിർമാണത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: πολλοῦ
  choice: വലിയ വിലയ്ക്ക്
  rationale: വില സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ഷഷ്ഠിവിഭക്തിയുടെ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു; കൃത്യമായ തുക ചേർക്കുന്നില്ല.
- source_word: δοθῆναι
  choice: ആ പണം ... കൊടുക്കാമായിരുന്നു
  rationale: വിറ്റുകിട്ടുന്ന തുകയാണ് ദരിദ്രർക്കു നൽകപ്പെടുന്നത് എന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിനായി വ്യക്തമാക്കുന്നു.
- source_word: πτωχοῖς
  choice: ദരിദ്രർക്ക്
  rationale: ദരിദ്രരായ ആളുകളെ കൂട്ടമായി സൂചിപ്പിക്കുന്ന ദത്തിവ് ബഹുവചനത്തിന്റെ അർഥം സംക്ഷിപ്തമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഭാഷ. ‘ആ പണം’ എന്നത് ഗ്രീക്കിൽ വ്യക്തമായി ഇല്ലെങ്കിലും, വിൽപ്പനയിൽനിന്നു ലഭിക്കുന്ന തുകയാണ് നൽകുന്നത് എന്ന ബന്ധം മലയാളത്തിൽ ആശയക്കുഴപ്പമില്ലാതെ വ്യക്തമാക്കുന്നു. അടിക്കുറിപ്പ് സൂചകം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
