id: MAT.26.38
reference: Matthew 26:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τότε λέγει ⸀αὐτοῖς· Περίλυπός ἐστιν ἡ ψυχή μου ἕως θανάτου· μείνατε ὧδε καὶ γρηγορεῖτε μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/038.yaml
  text: Then he says to them[a], “My soul is deeply grieved, even to death[c][b]. Remain here and keep watch with me.”
translation:
  language: ml
  text: 'അപ്പോൾ അവൻ അവരോടു പറഞ്ഞു: “എന്റെ പ്രാണൻ മരണത്തോളം അതിദുഃഖത്തിലാണ്[a][b]. ഇവിടെത്തന്നെ തുടരുക; എന്നോടൊപ്പം ജാഗരിച്ചിരിക്കുക.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “വളരെ ദുഃഖിതമാണ്,” “അഗാധമായി ദുഃഖിതമാണ്,” അല്ലെങ്കിൽ “ദുഃഖത്താൽ തകർന്നിരിക്കുന്നു.”
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ “മരണത്തിന്റെ വക്കോളം” അല്ലെങ്കിൽ “മരണത്തിന്റെ ഘട്ടംവരെ.”
    reason: lexical_alternative
  - marker: c
    text: അല്ലെങ്കിൽ “എന്നോടൊപ്പം ഉണർന്നിരിക്കുക.” ഗ്രീക്കുപദത്തിന് ഉറങ്ങാതിരിക്കുക എന്നും ജാഗ്രതയോടെ കാവലിരിക്കുക എന്നും അർഥമാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: അപ്പോൾ
  rationale: തുടർന്നുണ്ടാകുന്ന സംഭവത്തെ പരിചയപ്പെടുത്തുന്ന സ്വാഭാവികമായ കാലസൂചകപദം.
- source_word: λέγει
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിൽ ചരിത്രവർത്തമാനകാലമാണെങ്കിലും, മലയാളത്തിലെ സ്വാഭാവികമായ ആഖ്യാനശൈലിക്കായി ഭൂതകാലം ഉപയോഗിച്ചു; സംഭവക്രമവും അർഥവും മാറ്റമില്ലാതെ നിലനിൽക്കുന്നു.
- source_word: αὐτοῖς
  choice: അവരോടു
  rationale: λέγει എന്ന ക്രിയയുടെ പരോക്ഷ കർമത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: Περίλυπός
  choice: അതീവ ദുഃഖിതമായിരിക്കുന്നു
  rationale: περίλυπος സൂചിപ്പിക്കുന്ന തീവ്രമായ ദുഃഖവും മാനസികവേദനയും വ്യക്തവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ἡ ψυχή μου
  choice: എന്റെ പ്രാണൻ
  rationale: ψυχή എന്ന വ്യക്തമായ നാമപദം വെറും ‘ഞാൻ’ എന്നാക്കി ചുരുക്കാതെ നിലനിർത്തുന്നു; അതേസമയം വാക്യത്തെ സാങ്കേതികമായ മനുഷ്യശാസ്ത്രപ്രസ്താവനയാക്കുന്നില്ല.
- source_word: ἕως θανάτου
  choice: മരണത്തോളംതന്നെ
  rationale: ദുഃഖത്തിന്റെ അങ്ങേയറ്റം സൂചിപ്പിക്കുന്ന പ്രയോഗത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; ‘തന്നെ’ ഊന്നൽ നൽകുന്നു.
- source_word: μείνατε
  choice: ഇവിടെത്തന്നെ ഇരിക്കുക
  rationale: ശിഷ്യന്മാർ ആ സ്ഥലത്ത് തുടരണമെന്ന ആജ്ഞയെ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ὧδε
  choice: ഇവിടെത്തന്നെ
  rationale: സ്ഥലസൂചനയായ ‘ഇവിടെ’ എന്ന അർഥം നൽകുന്നു; ‘തന്നെ’ ആ സ്ഥലത്ത് തുടരാനുള്ള ആജ്ഞയെ വ്യക്തമാക്കുന്നു.
- source_word: γρηγορεῖτε
  choice: ജാഗരിച്ചിരിക്കുക
  rationale: ഉറങ്ങാതിരിക്കുക എന്ന നേരിട്ടുള്ള അർഥത്തോടൊപ്പം ജാഗ്രതയോടെ കാവലിരിക്കുക എന്ന വിശാലമായ ഭാവവും ഉൾക്കൊള്ളാൻ കഴിയുന്ന മലയാളപ്രയോഗം.
- source_word: μετ’ ἐμοῦ
  choice: എന്നോടൊപ്പം
  rationale: μετά കൂടെയുണ്ടായിരിക്കലിനെ നേരിട്ടും സ്വാഭാവികമായും വിവർത്തനം ചെയ്യുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ വാക്കിലെ ψυχή എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: എന്റെ പ്രാണൻ
  alternative: ഞാൻ അതീവ ദുഃഖിതനായിരിക്കുന്നു
  rationale: മൂലപാഠത്തിലെ വ്യക്തമായ ψυχή എന്ന നാമപദം നിലനിർത്തി യേശുവിന്റെ ആന്തരികവേദനയുടെ ആഴം പ്രകടമാക്കുന്നു; എന്നാൽ ആത്മാവിനെയും ശരീരത്തെയും കുറിച്ചുള്ള ഒരു പ്രത്യേക സാങ്കേതിക സിദ്ധാന്തം പാഠത്തിൽ ചേർക്കുന്നില്ല.
- issue: γρηγορεῖτε എന്ന ആജ്ഞയുടെ വ്യാപ്തി
  choice: ജാഗരിച്ചിരിക്കുക
  alternative: ഉണർന്നിരിക്കുക
  rationale: സന്ദർഭത്തിൽ ശാരീരികമായി ഉറങ്ങാതിരിക്കുന്നതും ജാഗ്രതയോടെ കൂടെയിരിക്കുന്നതും രണ്ടും പ്രസക്തമാണ്. മുഖ്യപാഠം വിശാലമായ ഭാവം നിലനിർത്തുന്നു; കൂടുതൽ അക്ഷരാർഥമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘പ്രാണൻ’ എന്ന പദം മൂലത്തിലെ ψυχή നിലനിർത്തുന്നു; ‘ജാഗരിച്ചിരിക്കുക’ ഉറക്കമില്ലായ്മയും ജാഗ്രതയും തമ്മിലുള്ള ഉദ്ദേശപൂർവമായ അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു. അത്യന്തം പുരാതനമായ ‘ഇരിക്കുവിൻ’ പോലുള്ള രൂപങ്ങൾ ഒഴിവാക്കി.
