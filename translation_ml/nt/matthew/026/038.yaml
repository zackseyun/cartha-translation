  to: 'അപ്പോൾ അവൻ അവരോടു പറഞ്ഞു: “എന്റെ പ്രാണൻ മരണത്തോളം അതിദുഃഖത്തിലാണ്[a][b]. ഇവിടെത്തന്നെ തുടരുക; എന്നോടൊപ്പം ജാഗരിച്ചിരിക്കുക.[c]”'
