source:
  edition: SBLGNT
  text: Ὁ δὲ Πέτρος ⸂ἐκάθητο ἔξω⸃ ἐν τῇ αὐλῇ· καὶ προσῆλθεν αὐτῷ μία παιδίσκη λέγουσα· Καὶ σὺ ἦσθα μετὰ Ἰησοῦ τοῦ Γαλιλαίου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/069.yaml
  text: Peter was sitting outside in the courtyard[a], and one servant girl came up to him, saying, “You also were with Jesus the Galilean.”
translation:
  language: ml
  text: പത്രോസ് പുറത്തുള്ള മുറ്റത്ത് ഇരിക്കുകയായിരുന്നു. ഒരു സേവിക[a] അവന്റെ അടുത്തുവന്ന്, “നീയും ഗലീലക്കാരനായ യേശുവിനോടൊപ്പം ആയിരുന്നു” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വേലക്കാരി” അല്ലെങ്കിൽ “അടിമപ്പെൺകുട്ടി.” παιδίσκη എന്ന ഗ്രീക്കുപദം ഒരു യുവതിയായ സ്ത്രീസേവകിയെ സൂചിപ്പിക്കാം; ചിലപ്പോൾ അവൾ അടിമസ്ഥിതിയിലുള്ളവളായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: അപ്പോൾ
  rationale: ആഖ്യാനത്തിലെ മൃദുവായ രംഗമാറ്റം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ശക്തമായ വിരോധമോ കൃത്യമായ കാലസൂചനയോ ചുമത്തുന്നില്ല.
- source_word: ἐκάθητο ἔξω
  choice: പുറത്തു ... ഇരിക്കുകയായിരുന്നു
  rationale: അപൂർണഭൂതകാല ക്രിയ ongoing ആയിരുന്ന ഇരിപ്പിനെ സൂചിപ്പിക്കുന്നു; ἔξω അകത്തു നടന്ന വിചാരണയോടുള്ള സ്ഥാനബന്ധത്തിൽ ‘പുറത്തു’ എന്നാണ്.
- source_word: ἐν τῇ αὐλῇ
  choice: മുറ്റത്ത്
  rationale: മഹാപുരോഹിതന്റെ വസതിയിലെ തുറന്ന നടുമുറ്റത്തെയാണ് αὐλή ഇവിടെ സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ‘മുറ്റം’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: προσῆλθεν αὐτῷ
  choice: അവന്റെ അടുത്തുവന്ന്
  rationale: ശാരീരികമായി സമീപിച്ചതെന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ പകരുന്നു.
- source_word: μία παιδίσκη
  choice: ഒരു വേലക്കാരിപ്പെൺകുട്ടി
  rationale: μία ഒരു വ്യക്തിയെ ആദ്യമായി അവതരിപ്പിക്കുന്നു; παιδίσκη യുവതിയായ സ്ത്രീസേവകിയെയോ അടിമപ്പെൺകുട്ടിയെയോ സൂചിപ്പിക്കാം. മുഖ്യപാഠം സാമൂഹികപങ്ക് വ്യക്തമാക്കുകയും അടിമസ്ഥിതിയെ അനാവശ്യമായി ഉറപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: λέγουσα
  choice: എന്നു പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ വർത്തമാന കൃതന്തം മലയാളത്തിലെ സ്വാഭാവിക നേരിട്ടുള്ള സംഭാഷണഘടനയിൽ പരിമിതക്രിയയായി പകരുന്നു.
- source_word: Καὶ σὺ
  choice: നീയും
  rationale: καί ഊന്നലുള്ള σὺയോടൊപ്പം പത്രോസും യേശുവിനോടുകൂടെ ഉണ്ടായിരുന്ന മറ്റുള്ളവരിൽ ഒരാളാണെന്ന സൂചന നൽകുന്നു.
- source_word: ἦσθα μετὰ
  choice: യേശുവിനോടുകൂടെ ഉണ്ടായിരുന്നല്ലോ
  rationale: ‘കൂടെ ഉണ്ടായിരിക്കുക’ എന്ന നേരിട്ടുള്ള ബന്ധാർഥം നിലനിർത്തുന്നു; ‘-ല്ലോ’ പെൺകുട്ടിയുടെ തിരിച്ചറിയൽ നിറഞ്ഞ പ്രസ്താവനയുടെ സ്വാഭാവിക സംഭാഷണഭാവം പകരുന്നു.
- source_word: Ἰησοῦ τοῦ Γαλιλαίου
  choice: ആ ഗലീലക്കാരനായ യേശു
  rationale: Γαλιλαίου യേശുവിനെ തിരിച്ചറിയിക്കുന്ന വിശേഷണപ്പേരായി നിലനിർത്തുന്നു; ‘ആ’ സംഭാഷണത്തിൽ പരാമർശിക്കപ്പെടുന്ന വ്യക്തിയെ സ്വാഭാവികമായി ചൂണ്ടിക്കാണിക്കുന്നു.
