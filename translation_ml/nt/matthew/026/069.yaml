translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ അപൂർണഭൂതകാലഭാവം ‘ഇരിക്കുകയായിരുന്നു’ എന്നതിലൂടെ നിലനിർത്തി. മുഖ്യപാഠത്തിൽ ‘വേലക്കാരിപ്പെൺകുട്ടി’ ഉപയോഗിച്ച് പ്രായവും സാമൂഹികപങ്കും സൂചിപ്പിച്ചു; സാധ്യതയുള്ള അടിമസ്ഥിതി അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
