  yaml_path: translation/nt/matthew/026/072.yaml
  text: 'And again he denied it with an oath: “I do not know the man.”[a]'
translation:
  language: ml
  text: 'അവൻ വീണ്ടും ആണയിട്ടുകൊണ്ട് നിഷേധിച്ചു: “എനിക്ക് ആ മനുഷ്യനെ അറിയില്ല.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിഷേധിച്ചു’ എന്നതിന് ‘അതു നിഷേധിച്ചു’ എന്നും പറയാം; ഗ്രീക്കിൽ ക്രിയയ്ക്കു പിന്നാലെ നിഷേധത്തിന്റെ ഉള്ളടക്കമാണ് വരുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: അവൻ
  rationale: ഗ്രീക്കിലെ ലളിതമായ ആഖ്യാനബന്ധം മലയാളത്തിൽ തുടർച്ചയായ വാക്യസന്ദർഭം സ്വാഭാവികമായി വഹിക്കുന്നതിനാൽ പ്രത്യേകമായി ‘പിന്നെ’ എന്നു ചേർത്തില്ല; വ്യക്തമായ കർത്താവിനായി സർവനാമം ഉപയോഗിച്ചു.
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: പത്രോസിന്റെ നിഷേധം ആവർത്തിച്ചതിനെ നേരിട്ടും സ്വാഭാവികമായും സൂചിപ്പിക്കുന്നു.
- source_word: ἠρνήσατο
  choice: നിഷേധിച്ചു
  rationale: ക്രിയയ്ക്ക് പിന്നാലെ നിഷേധത്തിന്റെ ഉള്ളടക്കം വരുന്നതിനാൽ മലയാളത്തിൽ കർമം ചേർക്കാതെ ഉപയോഗിക്കുന്നത് സ്വാഭാവികവും ഗ്രീക്കിനോട് അടുത്തതുമാണ്.
- source_word: μετὰ ὅρκου
  choice: ആണയിട്ടുകൊണ്ട്
  rationale: ഔപചാരിക കോടതിസത്യപ്രതിജ്ഞ എന്ന ധ്വനി വരുത്താതെ, ആണയോടെ നിഷേധിച്ചതിനെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὅτι
  choice: ':'
  rationale: നിഷേധത്തിന്റെ ഉള്ളടക്കം നേരിട്ടുള്ള ഉദ്ധരണിയായി അവതരിപ്പിക്കാൻ ദ്വിബിന്ദു ഉപയോഗിച്ചു.
- source_word: Οὐκ οἶδα
  choice: എനിക്ക് ... അറിയില്ല
  rationale: അറിവിനെ നിഷേധിക്കുന്ന പ്രസ്താവനയുടെ സാധാരണവും വ്യക്തവുമായ മലയാളരൂപം.
- source_word: τὸν ἄνθρωπον
  choice: ആ മനുഷ്യനെ
  rationale: ‘മനുഷ്യൻ’ എന്ന മൂലപദവും പത്രോസ് സൃഷ്ടിക്കുന്ന അകൽച്ചയുടെ ഭാവവും നിലനിർത്തുന്നു; ‘യേശുവിനെ’ എന്നു വ്യാഖ്യാനിച്ച് പകരുന്നില്ല.
theological_decisions:
- issue: പത്രോസിന്റെ നിഷേധത്തിലെ ‘ആ മനുഷ്യൻ’ എന്ന പരാമർശം
  choice: ‘ആ മനുഷ്യനെ’ എന്ന മൂലപ്രയോഗം നിലനിർത്തി.
  alternative: ‘അവനെ’ അല്ലെങ്കിൽ ‘യേശുവിനെ’
  rationale: ഗ്രീക്ക് പാഠം വ്യക്തമായി ‘മനുഷ്യനെ’ എന്നു പറയുന്നു. ഇത് പത്രോസിന്റെ അകൽച്ച പ്രകടമാക്കുന്നു; ‘യേശുവിനെ’ എന്നു മാറ്റുന്നത് വ്യാഖ്യാനം മുഖ്യപാഠത്തിലേക്ക് കൊണ്ടുവരും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ആണയിട്ടുകൊണ്ട്’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും ‘സത്യപ്രതിജ്ഞ ചെയ്ത്’ എന്നതിലുണ്ടാകാവുന്ന ഔപചാരിക നിയമസന്ദർഭധ്വനി ഒഴിവാക്കുന്നതുമാണ്.
