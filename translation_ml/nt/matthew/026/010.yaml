- from: 'എന്നാൽ യേശു ഇതറിഞ്ഞ് അവരോടു പറഞ്ഞു: “നിങ്ങൾ എന്തിനാണ് ആ സ്ത്രീയെ വിഷമിപ്പിക്കുന്നത്? അവൾ എനിക്കുവേണ്ടി മനോഹരമായ ഒരു പ്രവൃത്തി ചെയ്തിരിക്കുന്നു.[a][b]”'
  to: 'എന്നാൽ യേശു ഇതറിഞ്ഞ് അവരോടു പറഞ്ഞു: “നിങ്ങൾ എന്തിനാണ് ആ സ്ത്രീക്ക് ബുദ്ധിമുട്ടുണ്ടാക്കുന്നത്? അവൾ എനിക്കുവേണ്ടി മനോഹരമായ ഒരു പ്രവൃത്തി ചെയ്തിരിക്കുന്നു.[a][b]”'
