id: MAT.26.10
reference: Matthew 26:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: γνοὺς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Τί κόπους παρέχετε τῇ γυναικί; ἔργον γὰρ καλὸν ἠργάσατο εἰς ἐμέ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/010.yaml
  text: But Jesus[a], knowing this, said to them[b], “Why are you causing trouble for the woman? For she has done a beautiful work to me.
translation:
  language: ml
  text: 'എന്നാൽ യേശു ഇതറിഞ്ഞ് അവരോടു പറഞ്ഞു: “നിങ്ങൾ എന്തിനാണ് ആ സ്ത്രീക്ക് ബുദ്ധിമുട്ടുണ്ടാക്കുന്നത്? അവൾ എനിക്കുവേണ്ടി മനോഹരമായ ഒരു പ്രവൃത്തി ചെയ്തിരിക്കുന്നു.[a][b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നല്ല ഒരു പ്രവൃത്തി.”
    reason: lexical_alternative
  - marker: b
    text: “എനിക്കുവേണ്ടി” എന്നതിന് അഥവാ, “എന്നോടുള്ള.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: ഇതറിഞ്ഞ്
  rationale: സന്ദർഭത്തിൽ ശിഷ്യന്മാരുടെ വിമർശനം അറിഞ്ഞതിനെ സൂചിപ്പിക്കുന്ന സാഹചര്യവാചകമായ ഭൂതകാല കൃദന്തത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: ശിഷ്യന്മാരുടെ പരാതിയിൽനിന്ന് യേശുവിന്റെ തിരുത്തലിലേക്കുള്ള മൃദുവായ വൈരുധ്യപരിവർത്തനം പ്രകടമാക്കുന്നു.
- source_word: Τί κόπους παρέχετε τῇ γυναικί
  choice: നിങ്ങൾ എന്തിനാണ് ആ സ്ത്രീയെ വിഷമിപ്പിക്കുന്നത്?
  rationale: κόπους παρέχετε എന്ന പ്രയോഗത്തിന്റെ ബുദ്ധിമുട്ടോ ക്ലേശമോ വരുത്തുക എന്ന അർഥവും ശാസനാസ്വരവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἔργον καλὸν
  choice: മനോഹരമായ ഒരു പ്രവൃത്തി
  rationale: καλός എന്നതിലെ നന്മ, ഔചിത്യം, സൗന്ദര്യം എന്നീ ചേർന്ന പ്രശംസാഭാവം നിലനിർത്തുന്നു; ‘നല്ല പ്രവൃത്തി’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἠργάσατο
  choice: ചെയ്തിരിക്കുന്നു
  rationale: പൂർത്തിയായ പ്രവൃത്തിക്ക് ഇപ്പോഴത്തെ പ്രസക്തിയുണ്ടെന്ന വചനസന്ദർഭം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: εἰς ἐμέ
  choice: എനിക്കുവേണ്ടി
  rationale: ഒരു വ്യക്തിയോടുള്ള ദിശയെയോ ബന്ധത്തെയോ സൂചിപ്പിക്കുന്ന εἰς ഇവിടെ ഗുണഭോക്തൃബന്ധമായി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; കൂടുതൽ ദിശാത്മകമായ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: സ്ത്രീയുടെ പ്രവൃത്തിയെ വിലയിരുത്തുന്നത്
  choice: മനോഹരമായ ഒരു പ്രവൃത്തി
  alternative: നല്ല ഒരു പ്രവൃത്തി
  rationale: സ്ത്രീയുടെ പ്രവൃത്തിയെ വചനം പ്രശംസിക്കുന്നതുപോലെ തന്നെ അവതരിപ്പിക്കുന്നു; അതിൽ കൂദാശാപരമോ പുണ്യസമ്പാദനപരമോ ആയ അധിക ദൈവശാസ്ത്രാർത്ഥം ചേർക്കുന്നില്ല.
- issue: εἰς ἐμέ എന്നതിലെ ബന്ധം
  choice: എനിക്കുവേണ്ടി
  alternative: എന്നോട് / എന്നിലേക്കു
  rationale: പ്രയോജനബന്ധവും ദിശാത്മകബന്ധവും രണ്ടും വ്യാകരണപരമായി പരിഗണിക്കാവുന്നതായതിനാൽ പ്രധാനവാചകത്തിൽ സ്വാഭാവികമായ രൂപം സ്വീകരിച്ച് മറ്റുസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘വിഷമിപ്പിക്കുന്നത്’ നേരിട്ടുള്ള ശാസനാസ്വരം നിലനിർത്തുന്നു; ‘പ്രവൃത്തി’ ബൈബിൾഭാഷയുടെ ഗൗരവം കാത്തുകൊണ്ടുതന്നെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
