revisions:
- from: “രണ്ടു ദിവസം കഴിഞ്ഞാൽ പെസഹ വരുമെന്ന് നിങ്ങൾക്കറിയാം; മനുഷ്യപുത്രൻ ക്രൂശിക്കപ്പെടേണ്ടതിന് ഏല്പിക്കപ്പെടുന്നു[a].”
  to: “രണ്ടു ദിവസം കഴിഞ്ഞാൽ പെസഹ വരുമെന്ന് നിങ്ങൾക്കറിയാം; മനുഷ്യപുത്രൻ ക്രൂശിക്കപ്പെടാൻ ഏൽപ്പിക്കപ്പെടുന്നു[a].”
  rationale: The revision preserves the source's present passive and the deliberately broad sense of παραδίδοται while rendering εἰς τὸ σταυρωθῆναι with the direct, natural Malayalam purpose infinitive ക്രൂശിക്കപ്പെടാൻ. No doctrinal interpretation is added.
