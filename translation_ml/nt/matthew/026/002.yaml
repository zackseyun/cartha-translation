review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the temporal phrase, Passover, the Son of Man title, and the broad passive sense of παραδίδοται. However, ക്രൂശിക്കപ്പെടേണ്ടതിന് can suggest necessity ('for the purpose of having to be crucified') rather than the Greek infinitive's straightforward purpose/result, 'to be crucified.'
  naturalness: The sentence is generally clear in modern standard Malayalam. ക്രൂശിക്കപ്പെടാൻ is more idiomatic and direct than ക്രൂശിക്കപ്പെടേണ്ടതിന് in this construction. The standard spelling is ഏൽപ്പിക്കപ്പെടുന്നു.
  terminology: പെസഹ, മനുഷ്യപുത്രൻ, and ക്രൂശിക്കപ്പെടുക are appropriate established biblical terms. Retaining a broad rendering of παραδίδοται rather than restricting it to betrayal is sound; the alternative should remain in the note.
  issues:
  - severity: medium
    issue: ക്രൂശിക്കപ്പെടേണ്ടതിന് adds a nuance of necessity.
    rationale: 'εἰς τὸ σταυρωθῆναι expresses purpose/result: the Son of Man is handed over ''to be crucified.'' Malayalam ക്രൂശിക്കപ്പെടാൻ conveys this without introducing the modal sense of ''must be crucified.'''
  - severity: low
    issue: Spelling of ഏൽപ്പിക്കുക.
    rationale: ഏൽപ്പിക്കപ്പെടുന്നു is the standard modern Malayalam spelling and should be used consistently in the text and note.
  revised_text: “രണ്ടു ദിവസം കഴിഞ്ഞാൽ പെസഹ വരുമെന്ന് നിങ്ങൾക്കറിയാം; മനുഷ്യപുത്രൻ ക്രൂശിക്കപ്പെടാൻ ഏൽപ്പിക്കപ്പെടുന്നു[a].”
