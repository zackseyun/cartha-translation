id: MAT.26.2
reference: Matthew 26:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οἴδατε ὅτι μετὰ δύο ἡμέρας τὸ πάσχα γίνεται, καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται εἰς τὸ σταυρωθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/002.yaml
  text: You know that after two days the Passover is coming[a], and the Son of Man is being handed over to be crucified.
translation:
  language: ml
  text: “രണ്ടു ദിവസം കഴിഞ്ഞാൽ പെസഹ വരുമെന്ന് നിങ്ങൾക്കറിയാം; മനുഷ്യപുത്രൻ ക്രൂശിക്കപ്പെടാൻ ഏൽപ്പിക്കപ്പെടുന്നു[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒറ്റിക്കൊടുക്കപ്പെടുന്നു.” ഗ്രീക്ക് ക്രിയയ്ക്ക് ഒറ്റിക്കൊടുക്കുക എന്ന അർഥമുണ്ടാകാം; എന്നാൽ കൂടുതൽ വിശാലമായി “ഏൽപ്പിക്കപ്പെടുക” അല്ലെങ്കിൽ “കൈമാറപ്പെടുക” എന്നും അർഥമുണ്ട്.
    reason: alternative_reading
lexical_decisions:
- source_word: Οἴδατε
  choice: നിങ്ങൾക്കറിയാം
  rationale: οἶδα എന്ന ക്രിയയുടെ വർത്തമാനാർഥമുള്ള രണ്ടാംപുരുഷ ബഹുവചനരൂപം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഇങ്ങനെ നൽകുന്നു.
- source_word: μετὰ δύο ἡμέρας
  choice: രണ്ടു ദിവസം കഴിഞ്ഞാൽ
  rationale: μετά + ദ്വിതീയാവിഭക്തിയുടെ ‘രണ്ടു ദിവസത്തിനു ശേഷം’ എന്ന കാലാർഥം മലയാളത്തിലെ സ്വാഭാവികമായ പ്രയോഗത്തിൽ നിലനിർത്തുന്നു.
- source_word: τὸ πάσχα
  choice: പെസഹ
  rationale: യഹൂദരുടെ പെസഹയെ സൂചിപ്പിക്കുന്ന സ്ഥാപിത മലയാള ബൈബിൾപദം; മൂലത്തിൽ ഇല്ലാത്ത ‘പെരുന്നാൾ’ എന്ന വിശദീകരണം ചേർക്കുന്നില്ല.
- source_word: γίνεται
  choice: വരും
  rationale: ഇവിടെ γίνομαι പെസഹയുടെ ആസന്നമായ സംഭവത്തെ സൂചിപ്പിക്കുന്നു; ‘വരും’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: യേശുവിന്റെ സ്വയംവിശേഷണത്തിന്റെ സ്ഥാപിതമായ മലയാളരൂപം നിലനിർത്തുന്നു.
- source_word: παραδίδοται
  choice: ഏല്പിക്കപ്പെടുന്നു
  rationale: വർത്തമാനകാല കർമണിപ്രയോഗവും ‘കൈമാറുക/ഏല്പിക്കുക’ എന്ന വിശാലാർഥവും നിലനിർത്തുന്നു; ‘ഒറ്റിക്കൊടുക്കപ്പെടുന്നു’ എന്നു മാത്രം പറഞ്ഞ് അർഥം ചുരുക്കുന്നില്ല.
- source_word: εἰς τὸ σταυρωθῆναι
  choice: ക്രൂശിക്കപ്പെടേണ്ടതിന്
  rationale: εἰς സഹിതമുള്ള കർമണി അനന്തക്രിയയുടെ ഉദ്ദേശ്യ/ഫലാർഥം നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: പീഡാനുഭവ പ്രവചനത്തിലെ παραδίδοται എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി
  choice: ഏല്പിക്കപ്പെടുന്നു
  alternative: ഒറ്റിക്കൊടുക്കപ്പെടുന്നു
  rationale: സന്ദർഭത്തിൽ യൂദാസിന്റെ ഒറ്റിക്കൊടുക്കൽ ഉൾപ്പെടുന്നുണ്ടെങ്കിലും ഗ്രീക്ക് ക്രിയയ്ക്ക് അതിലും വിശാലമായി ‘കൈമാറപ്പെടുക/ഏല്പിക്കപ്പെടുക’ എന്ന അർഥമുണ്ട്. വിശാലരൂപം മനുഷ്യരുടെ ഒറ്റിക്കൊടുക്കലും മറ്റൊരു അധികാരത്തിന് ഏല്പിക്കപ്പെടലും ഉൾക്കൊള്ളുന്ന ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പെസഹ’, ‘മനുഷ്യപുത്രൻ’, ‘ക്രൂശിക്കപ്പെടുക’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തി; വാക്യഘടന സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാക്കി.
