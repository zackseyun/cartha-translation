  to: നിങ്ങൾ പ്രലോഭനത്തിൽ പ്രവേശിക്കാതിരിക്കേണ്ടതിന് ഉണർന്നിരുന്നു പ്രാർഥിക്കുവിൻ. ആത്മാവ് സന്നദ്ധമാണ്, എന്നാൽ ജഡം ബലഹീനമാണ്.
