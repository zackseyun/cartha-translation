  terminology: ‘പ്രലോഭനം’ is appropriate in context, with the semantic breadth of πειρασμός responsibly retained in the footnote. ‘ആത്മാവ്’ and ‘ജഡം’ preserve the contrast without importing a doctrinal interpretation.
