id: MAT.26.41
reference: Matthew 26:41
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: γρηγορεῖτε καὶ προσεύχεσθε, ἵνα μὴ εἰσέλθητε εἰς πειρασμόν· τὸ μὲν πνεῦμα πρόθυμον ἡ δὲ σὰρξ ἀσθενής.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/041.yaml
  text: Stay awake and pray[a], so that you may not enter into temptation. The spirit indeed is willing, but the flesh is weak.
translation:
  language: ml
  text: നിങ്ങൾ പ്രലോഭനത്തിൽ പ്രവേശിക്കാതിരിക്കേണ്ടതിന് ഉണർന്നിരുന്നു പ്രാർഥിക്കുവിൻ. ആത്മാവ് സന്നദ്ധമാണ്, എന്നാൽ ജഡം ബലഹീനമാണ്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: ഉണർന്നിരുന്നു
  rationale: ഗെത്ത്സെമനെയിലെ സാഹചര്യത്തിൽ ശിഷ്യർ ഉറങ്ങിപ്പോയതിനാൽ ‘ഉണർന്നിരിക്കുക’ എന്ന അക്ഷരാർഥവും ജാഗ്രതയുടെ സൂചനയും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: προσεύχεσθε
  choice: പ്രാർഥിക്കുവിൻ
  rationale: ബഹുവചന ആജ്ഞയുടെ അർഥം മാന്യവും സ്വാഭാവികവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἵνα μὴ εἰσέλθητε
  choice: നിങ്ങൾ ... പ്രവേശിക്കാതിരിക്കേണ്ടതിന്
  rationale: ἵνα μή ഘടനയിലെ പ്രതിരോധലക്ഷ്യവും ‘പ്രവേശിക്കുക’ എന്ന ഗ്രീക്ക് രൂപകവും സംരക്ഷിക്കുന്നു.
- source_word: πειρασμόν
  choice: പ്രലോഭനത്തിൽ
  rationale: ഇവിടെ സമ്മർദത്തിനിടയിലെ ധാർമിക വീഴ്ചയെക്കുറിച്ചുള്ള മുന്നറിയിപ്പിന് ‘പ്രലോഭനം’ യോജിക്കുന്നു; പരീക്ഷ/പരീക്ഷണം എന്ന വിശാല അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: τὸ μὲν πνεῦμα
  choice: ആത്മാവ് ... തന്നെ
  rationale: μέν–δέ വൈരുധ്യം ‘തന്നെ ... എന്നാൽ’ എന്ന സ്വാഭാവിക ഘടനയിൽ പകർത്തുന്നു; സന്ദർഭത്തിൽ മനുഷ്യന്റെ ആന്തരിക മനോഭാവമാണ് മുൻനിര വായന.
- source_word: πρόθυμον
  choice: സന്നദ്ധം
  rationale: സന്നദ്ധതയും മനസ്സൊരുക്കവും സൂചിപ്പിക്കുന്ന πρόθυμος എന്ന പദത്തിന്റെ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ തർജമ.
- source_word: ἡ δὲ σὰρξ
  choice: എന്നാൽ ജഡം
  rationale: മനുഷ്യന്റെ ദേഹാധിഷ്ഠിത ദൗർബല്യം സൂചിപ്പിക്കുന്ന ബൈബിൾ രൂപകം വ്യാഖ്യാനിച്ച് ഇല്ലാതാക്കാതെ നിലനിർത്തുന്നു.
- source_word: ἀσθενής
  choice: ബലഹീനമാണ്
  rationale: ആത്മാവിന്റെ സന്നദ്ധതയോടുള്ള വൈരുധ്യത്തിൽ ἀσθενής എന്നതിന്റെ നേരിട്ടുള്ള അർഥം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: πνεῦμα എന്നതിന്റെ സൂചകം
  choice: മനുഷ്യന്റെ ആത്മാവ്/ആന്തരിക മനോഭാവം എന്ന മുൻനിര വായനയോടെ ‘ആത്മാവ്’
  alternative: പരിശുദ്ധാത്മാവ്
  rationale: ശിഷ്യരുടെ ഉദ്ദേശ്യസന്നദ്ധതയും യഥാർഥ പരാജയവും, ‘ജഡം’ എന്നതോടുള്ള വൈരുധ്യവും മനുഷ്യന്റെ ആന്തരിക ആത്മാവിനെ സൂചിപ്പിക്കുന്നു. എന്നാൽ മലയാളരൂപം മറ്റൊരു വായനയെ പൂർണമായി അടച്ചുകളയുന്നില്ല.
- issue: σάρξ എന്നതിന്റെ തർജമ
  choice: ജഡം
  alternative: ശരീരം; പാപസ്വഭാവം
  rationale: ഇവിടെ വികസിതമായ ‘പാപസ്വഭാവം’ എന്ന സാങ്കേതിക ആശയത്തേക്കാൾ മനുഷ്യന്റെ ദേഹാധിഷ്ഠിത ദൗർബല്യമാണ് പ്രസക്തം. ‘ജഡം’ മൂലരൂപകവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള തിരുവെഴുത്തുശൈലി. ബഹുവചന ആജ്ഞയ്ക്ക് ‘-വിൻ’ രൂപം ഉപയോഗിച്ചു; അത് സംക്ഷിപ്തവും വായനക്കാർക്ക് പരിചിതവുമാണ്. ‘ആത്മാവ്–ജഡം’ വൈരുധ്യം വ്യാഖ്യാനിച്ച് ലഘൂകരിക്കാതെ നിലനിർത്തി.
