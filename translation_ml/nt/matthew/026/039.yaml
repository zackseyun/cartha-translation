id: MAT.26.39
reference: Matthew 26:39
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸀προελθὼν μικρὸν ἔπεσεν ἐπὶ πρόσωπον αὐτοῦ προσευχόμενος καὶ λέγων· Πάτερ μου, εἰ δυνατόν ἐστιν, παρελθάτω ἀπ’ ἐμοῦ τὸ ποτήριον τοῦτο· πλὴν οὐχ ὡς ἐγὼ θέλω ἀλλ’ ὡς σύ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/039.yaml
  text: And going a little farther[a], he fell on his face, praying and saying, “My Father, if it is possible, let this cup pass from me; yet not as I will[b], but as you will.”
translation:
  language: ml
  text: 'അല്പം കൂടി മുന്നോട്ടുചെന്ന്, അവൻ കമിഴ്ന്നുവീണ്[a] പ്രാർഥിച്ചുകൊണ്ട് പറഞ്ഞു: “എന്റെ പിതാവേ, സാധ്യമെങ്കിൽ ഈ പാനപാത്രം[b] എന്നിൽനിന്ന് നീങ്ങിപ്പോകട്ടെ; എങ്കിലും ഞാൻ ഇച്ഛിക്കുന്നതുപോലെയല്ല, അങ്ങ് ഇച്ഛിക്കുന്നതുപോലെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘അവൻ തന്റെ മുഖത്തിന്മേൽ വീണു’; അതായത്, മുഖം നിലത്താക്കി വീണു.
    reason: lexical_alternative
  - marker: b
    text: ‘പാനപാത്രം’ എന്നത് ഒരാൾക്കായി നിശ്ചയിക്കപ്പെട്ട പങ്കിനെയും, പ്രത്യേകിച്ച് കഷ്ടതയെയും സൂചിപ്പിക്കുന്ന ഒരു ബൈബിൾ ദൃശ്യരൂപമാണ്; മത്തായി 20:22; 26:42 കാണുക.
    reason: cross_reference
lexical_decisions:
- source_word: προελθὼν μικρὸν
  choice: അല്പംകൂടി മുന്നോട്ടുചെന്ന്
  rationale: മുന്നോട്ട് ചെറിയൊരു ദൂരം നീങ്ങിയതും മുൻസ്ഥാനത്തേക്കാൾ അകലെയായതുമായ ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἔπεσεν ἐπὶ πρόσωπον αὐτοῦ
  choice: അവൻ കമിഴ്ന്നുവീണ്
  rationale: മുഖം നിലത്തേക്കായുള്ള പ്രണാമഭാവമുള്ള ശരീരനില സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു; ‘സാഷ്ടാംഗം’ പോലുള്ള അധിക സാംസ്കാരിക സൂചന ഒഴിവാക്കുന്നു.
- source_word: προσευχόμενος καὶ λέγων
  choice: പ്രാർഥിച്ചുകൊണ്ട് പറഞ്ഞു
  rationale: പ്രാർഥനയും പറയലും മുഖ്യക്രിയയോടൊപ്പം നടക്കുന്നുവെന്ന ഗ്രീക്ക് വാക്യഘടനയുടെ പ്രവാഹം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: Πάτερ μου
  choice: എന്റെ പിതാവേ
  rationale: സംബോധനയിലെ അടുപ്പവും ആദരവും അധിക വികാരവർണം ചേർക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: εἰ δυνατόν ἐστιν
  choice: സാധ്യമെങ്കിൽ
  rationale: പൂർണ ഗ്രീക്ക് ഉപാധിവാക്യത്തിന്റെ അർഥം ലളിതവും കൃത്യവുമായി നൽകുന്നു.
- source_word: παρελθάτω ἀπ’ ἐμοῦ
  choice: എന്നിൽനിന്ന് നീങ്ങിപ്പോകട്ടെ
  rationale: മൂന്നാംപുരുഷ ആജ്ഞാരൂപത്തിലുള്ള അപേക്ഷയും ‘എന്നിൽനിന്ന്’ എന്ന അകലലും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: τὸ ποτήριον τοῦτο
  choice: ഈ പാനപാത്രം
  rationale: നിയോഗിക്കപ്പെട്ട അനുഭവത്തെയോ കഷ്ടതയെയോ സൂചിപ്പിക്കുന്ന ബൈബിളിലെ രൂപകം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ അതേ ദൃശ്യരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: πλὴν
  choice: എങ്കിലും
  rationale: മുൻ അപേക്ഷയെ ശക്തമായി പരിമിതപ്പെടുത്തുന്ന വൈരുധ്യം ഗൗരവമുള്ള ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: οὐχ ὡς ἐγὼ θέλω ἀλλ’ ὡς σύ
  choice: ഞാൻ ഇച്ഛിക്കുന്നതുപോലെയല്ല, അങ്ങ് ഇച്ഛിക്കുന്നതുപോലെ ആയിരിക്കട്ടെ
  rationale: യേശുവിന്റെ ഇച്ഛയും പിതാവിന്റെ ഇച്ഛയും തമ്മിലുള്ള യഥാർഥ വൈരുധ്യവും സമർപ്പണവും നിലനിർത്തുന്നു; ഗ്രീക്കിലെ രണ്ടാം ഖണ്ഡത്തിലെ ലോപിച്ച ക്രിയ മലയാളത്തിൽ വ്യക്തതയ്ക്കായി പൂരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘പാനപാത്രം’ എന്ന രൂപകത്തിന്റെ അർഥം
  choice: പ്രധാനവാക്യത്തിൽ ‘ഈ പാനപാത്രം’ എന്ന ദൃശ്യരൂപം നിലനിർത്തി
  alternative: ഈ കഷ്ടത; ഈ വിധി
  rationale: ποτήριον എന്നത് ഇവിടെ രൂപകമായി ഉപയോഗിച്ചാലും അതിന്റെ ബൈബിൾാന്തരബന്ധങ്ങളും നിയോഗിക്കപ്പെട്ട അനുഭവം, കഷ്ടത, ന്യായവിധി എന്നിവയോടുള്ള സാധ്യതയുള്ള സൂചനകളും ഒരൊറ്റ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കരുത്.
- issue: യേശുവിന്റെ ഇച്ഛയും പിതാവിന്റെ ഇച്ഛയും
  choice: θέλω എന്നതിന് ഇരുവിടത്തും ‘ഇച്ഛിക്കുക’ ഉപയോഗിച്ചു
  alternative: ആഗ്രഹിക്കുക; വേണമെന്നിരിക്കുക
  rationale: വ്യക്തിപരമായ മുൻഗണനയെന്നതിലുപരി യഥാർഥ ഇച്ഛയും അതിന്റെ പിതാവിനോടുള്ള സമർപ്പണവും ഉൾക്കൊള്ളുന്ന വാക്യത്തിന്റെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. പിതാവിനെ അഭിസംബോധന ചെയ്യുമ്പോൾ ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു. പരമ്പരാഗത ബൈബിൾഭാഷയിലെ അസ്വാഭാവിക പുരാതന രൂപങ്ങളും പ്രത്യേക സഭാപാരമ്പര്യങ്ങളുടെ പദപ്രയോഗങ്ങളും ഒഴിവാക്കി.
