id: MAT.26.21
reference: Matthew 26:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐσθιόντων αὐτῶν εἶπεν· Ἀμὴν λέγω ὑμῖν ὅτι εἷς ἐξ ὑμῶν παραδώσει με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/021.yaml
  text: And while they were eating[a], he said, “Truly I tell you, one of you will betray me.”
translation:
  language: ml
  text: 'അവർ ഭക്ഷണം കഴിച്ചുകൊണ്ടിരിക്കുമ്പോൾ അവൻ പറഞ്ഞു: “സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: നിങ്ങളിൽ ഒരാൾ എന്നെ ഒറ്റിക്കൊടുക്കും[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “എന്നെ കൈമാറും” അഥവാ “എന്നെ ഏല്പിച്ചുകൊടുക്കും.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσθιόντων αὐτῶν
  choice: അവർ ഭക്ഷണം കഴിച്ചുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് മുഖ്യക്രിയയോടൊപ്പം നടക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ഈ രൂപം അതിന്റെ കാലസംബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Ἀμὴν
  choice: സത്യമായി
  rationale: യേശുവിന്റെ വചനത്തിന്റെ ആരംഭത്തിൽ വരുന്ന ἀμήν ഗൗരവമുള്ള ഉറപ്പിനെയും ആധികാരിക പ്രഖ്യാപനത്തെയും സൂചിപ്പിക്കുന്നു; ‘സത്യമായി’ അതിന്റെ പ്രവർത്തനം വ്യക്തമായി പകരുന്നു.
- source_word: λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: നേരിട്ടുള്ള അഭിസംബോധനയും പ്രസ്താവനയുടെ ഗൗരവവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: εἷς ἐξ ὑμῶν
  choice: നിങ്ങളിൽ ഒരാൾ
  rationale: ഭാഗത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ നേരായതും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: παραδώσει
  choice: ഒറ്റിക്കൊടുക്കും
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘കൈമാറുക/ഏല്പിക്കുക’ എന്നതാണെങ്കിലും, ഈ സന്ദർഭത്തിൽ സ്വന്തം കൂട്ടത്തിൽപ്പെട്ട ഒരാൾ യേശുവിനെ ശത്രുക്കളുടെ കൈയിൽ ഏല്പിക്കുന്ന വഞ്ചനാപരമായ പ്രവൃത്തി മുൻനിൽക്കുന്നു. ‘ഒറ്റിക്കൊടുക്കും’ ആ സന്ദർഭാർഥം സ്വാഭാവികമായി അറിയിക്കുന്നു; വിശാലമായ പദാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: με
  choice: എന്നെ
  rationale: യേശുവിനെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള കർമസർവനാമം അതേപടി പകരുന്നു.
theological_decisions:
- issue: പീഡാനുഭവസന്ദർഭത്തിലെ παραδώσει എന്ന ക്രിയയുടെ പരിഭാഷ
  choice: ഒറ്റിക്കൊടുക്കും
  alternative: എന്നെ കൈമാറും / എന്നെ ഏല്പിച്ചുകൊടുക്കും
  rationale: ഗ്രീക്ക് ക്രിയ സ്വതവേ ‘കൈമാറുക’ എന്ന വിശാലാർഥമുള്ളതാണ്. എന്നാൽ ഇവിടെ ശിഷ്യരിൽ ഒരാൾ യേശുവിനെ വഞ്ചനാപരമായി അധികാരികളുടെ കൈയിൽ ഏല്പിക്കുന്നതാണ് സന്ദർഭം. മുഖ്യപാഠത്തിൽ സന്ദർഭാർഥം നൽകുകയും അടിക്കുറിപ്പിൽ പദത്തിന്റെ കൂടുതൽ അക്ഷരാർഥപരമായ സാധ്യത സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഉദ്ധരണിയുടെ solemn force നിലനിർത്തിയിട്ടുണ്ട്; παραδώσει എന്ന പദത്തിന്റെ സന്ദർഭാർഥവും വിശാലമായ മൂലാർഥവും യഥാക്രമം മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
