id: MAT.26.36
reference: Matthew 26:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τότε ἔρχεται μετ’ αὐτῶν ὁ Ἰησοῦς εἰς χωρίον λεγόμενον Γεθσημανί, καὶ λέγει τοῖς μαθηταῖς· Καθίσατε αὐτοῦ ἕως οὗ ἀπελθὼν ⸂ἐκεῖ προσεύξωμαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/036.yaml
  text: Then Jesus comes with them to a place called Gethsemane[a], and he says to the disciples, “Sit here while I go over there and pray.”
translation:
  language: ml
  text: 'അപ്പോൾ യേശു അവരോടൊപ്പം ഗെത്ത്ശെമനേ എന്നു വിളിക്കപ്പെടുന്ന ഒരു സ്ഥലത്ത് വന്ന് ശിഷ്യന്മാരോട് പറഞ്ഞു: “ഞാൻ അങ്ങോട്ട് പോയി പ്രാർത്ഥിക്കുമ്പോൾ നിങ്ങൾ ഇവിടെ ഇരിക്കൂ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: അപ്പോൾ
  rationale: തുടർന്നുവരുന്ന സംഭവത്തെ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്ന കാലസൂചക പദം.
- source_word: ἔρχεται
  choice: വന്ന്
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനത്തെ മലയാളത്തിലെ സ്വാഭാവികമായ ഭൂതകാല ആഖ്യാനശൈലിയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: μετ’ αὐτῶν
  choice: അവരോടൊപ്പം
  rationale: μετά എന്ന പദത്തിന്റെ കൂടെയുണ്ടായിരിക്കുക എന്ന അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: χωρίον
  choice: ഒരു സ്ഥലം
  rationale: സ്ഥലം, ഭൂവിഭാഗം, പുരയിടം എന്നീ അർഥസാധ്യതകളുള്ള പദമാണിത്; മത്തായി പറയാത്ത ‘തോട്ടം’ എന്ന വിശദാംശം ചേർക്കാതെ വിശാലമായ അർഥം നിലനിർത്തുന്നു.
- source_word: λεγόμενον Γεθσημανί
  choice: ഗെത്ത്ശെമന എന്നു വിളിക്കപ്പെടുന്ന
  rationale: സ്ഥലനാമം പരിചയപ്പെടുത്തുന്ന ഗ്രീക്ക് പ്രയോഗത്തെ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുകയും പേരിനെ ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: λέγει τοῖς μαθηταῖς
  choice: ശിഷ്യന്മാരോട് പറഞ്ഞു
  rationale: ചരിത്രവർത്തമാനത്തെ മലയാള ആഖ്യാനത്തിൽ സ്വാഭാവികമായ ഭൂതകാലരൂപത്തിൽ നൽകുന്നു.
- source_word: Καθίσατε αὐτοῦ
  choice: നിങ്ങൾ ഇവിടെ ഇരിക്കൂ
  rationale: ലളിതമായ ആജ്ഞയും αὐτοῦ എന്ന സ്ഥലസൂചനയും വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἕως οὗ
  choice: പ്രാർഥിക്കുന്നതുവരെ
  rationale: ‘അതുവരെ’ എന്ന ഗ്രീക്ക് കാലപരിധി നേരിട്ട് സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ ‘പ്രാർഥിക്കുമ്പോൾ’ എന്ന അർഥഭാവവും സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: ἀπελθὼν ἐκεῖ προσεύξωμαι
  choice: ഞാൻ അവിടെ പോയി പ്രാർഥിക്കുന്ന
  rationale: പോകുന്നതും തുടർന്ന് പ്രാർഥിക്കുന്നതുമായ പ്രവർത്തനക്രമം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ἐκεῖ എന്നത് ‘ഇവിടെ’ എന്നതിനോടുള്ള സ്ഥലവ്യത്യാസം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ഗെത്ത്ശെമനയുടെ സ്വഭാവം
  choice: χωρίον എന്നത് ‘സ്ഥലം’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘തോട്ടം’
  rationale: മത്തായിയുടെ വാചകം ഈ ഇടത്തെ ഒരു ‘സ്ഥലം’ എന്നു മാത്രമാണ് വിശേഷിപ്പിക്കുന്നത്. ‘തോട്ടം’ എന്നു നൽകുന്നത് യോഹന്നാൻ 18:1-ലെ വിശദാംശം മത്തായിയുടെ വാചകത്തിലേക്ക് കൊണ്ടുവരുന്നതായിരിക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ഗ്രീക്കിലെ ചരിത്രവർത്തമാനം മലയാളത്തിൽ അസ്വാഭാവികമാകാതിരിക്കാൻ ഭൂതകാലരൂപത്തിൽ നൽകി; നേരിട്ടുള്ള സംഭാഷണം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ രീതിയിൽ നിലനിർത്തി.
