- from: 'അപ്പോൾ യേശു അവരോടൊപ്പം ഗെത്ത്ശെമന എന്നു വിളിക്കപ്പെടുന്ന ഒരു സ്ഥലത്ത് വന്ന് ശിഷ്യന്മാരോട് പറഞ്ഞു: “ഞാൻ അവിടെ പോയി പ്രാർഥിക്കുന്നതുവരെ[a] നിങ്ങൾ ഇവിടെ ഇരിക്കൂ.”'
  to: 'അപ്പോൾ യേശു അവരോടൊപ്പം ഗെത്ത്ശെമനേ എന്നു വിളിക്കപ്പെടുന്ന ഒരു സ്ഥലത്ത് വന്ന് ശിഷ്യന്മാരോട് പറഞ്ഞു: “ഞാൻ അങ്ങോട്ട് പോയി പ്രാർത്ഥിക്കുമ്പോൾ നിങ്ങൾ ഇവിടെ ഇരിക്കൂ.”'
