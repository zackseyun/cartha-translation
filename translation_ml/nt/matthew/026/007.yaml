source:
  edition: SBLGNT
  text: προσῆλθεν αὐτῷ γυνὴ ⸂ἔχουσα ἀλάβαστρον μύρου⸃ βαρυτίμου καὶ κατέχεεν ἐπὶ ⸂τῆς κεφαλῆς⸃ αὐτοῦ ἀνακειμένου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/007.yaml
  text: a woman came to him holding an alabaster jar of very costly perfume[b][a], and she poured it on his head as he was reclining at the table.
translation:
  language: ml
  text: അവൻ ഭക്ഷണമേശയിൽ ചാരിക്കിടക്കുമ്പോൾ,[b] വളരെ വിലയേറിയ സുഗന്ധതൈലം നിറച്ച ഒരു അലബാസ്റ്റർ പാത്രവുമായി[a] ഒരു സ്ത്രീ അവന്റെ അടുത്തുവന്ന് ആ തൈലം അവന്റെ തലയിൽ ഒഴിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വളരെ വിലയേറിയ സുഗന്ധലേപനം നിറച്ച ഒരു അലബാസ്റ്റർ കുപ്പിയുമായി.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദം ദ്രവരൂപത്തിലുള്ള സുഗന്ധതൈലത്തെയോ കട്ടിയുള്ള സുഗന്ധലേപനത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അന്നത്തെ പതിവനുസരിച്ച് ഭക്ഷണം കഴിക്കുമ്പോൾ ആളുകൾ മേശയ്ക്കരികിൽ ചാരിക്കിടക്കുമായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: προσῆλθεν αὐτῷ
  choice: അവന്റെ അടുത്തുവന്ന്
  rationale: ആരുടെയെങ്കിലും അടുത്തേക്കുള്ള ചലനം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: γυνή
  choice: ഒരു സ്ത്രീ
  rationale: മൂലപാഠത്തിൽ സ്ത്രീയെക്കുറിച്ച് ഇവിടെ തിരിച്ചറിയൽവിവരമൊന്നും നൽകിയിട്ടില്ല; അനിശ്ചിത ഏകവചനം നിലനിർത്തുന്നു.
- source_word: ἔχουσα
  choice: '...പാത്രവുമായി'
  rationale: സ്ത്രീ പാത്രം കൈവശം വഹിച്ചെത്തിയെന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀλάβαστρον μύρου
  choice: സുഗന്ധതൈലം നിറച്ച ഒരു വെൺകൽപ്പാത്രം
  rationale: ἀλάβαστρον സുഗന്ധദ്രവ്യം സൂക്ഷിക്കുന്ന അലബാസ്റ്റർ പാത്രത്തെയും μύρον സുഗന്ധമുള്ള തൈലമോ ലേപനദ്രവ്യമോ സൂചിപ്പിക്കുന്നു; വായനാസൗകര്യത്തിനായി പദബന്ധത്തിന്റെ ബന്ധം വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: βαρυτίμου
  choice: വളരെ വിലയേറിയ
  rationale: വസ്തുവിന്റെ അത്യധികമായ മൂല്യം സൂചിപ്പിക്കുന്ന വിശേഷണത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: κατέχεεν
  choice: ഒഴിച്ചു
  rationale: താഴേക്കോ മേലേക്കോ ദ്രവം ഒഴിക്കുന്ന പ്രവൃത്തി സന്ദർഭാനുസൃതമായി നേരിട്ട് നൽകുന്നു.
- source_word: ἐπὶ τῆς κεφαλῆς αὐτοῦ
  choice: അവന്റെ തലയിൽ
  rationale: ഒഴിച്ച ദ്രവ്യം തലയിൽ പതിച്ചെന്ന സ്ഥാനം ലളിതമായി വ്യക്തമാക്കുന്നു.
- source_word: ἀνακειμένου
  choice: അവൻ ഭക്ഷണത്തിനിരിക്കുമ്പോൾ
  rationale: അന്നത്തെ പതിവനുസരിച്ച് ഭക്ഷണവേളയിൽ ചാരിക്കിടന്ന ഭാവത്തെയാണ് ക്രിയ സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ 'ഭക്ഷണത്തിനിരിക്കുക' സന്ദർഭം സ്വാഭാവികമായി നൽകുന്നു, സാംസ്കാരിക വിശദാംശം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
