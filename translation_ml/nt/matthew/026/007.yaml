translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. 'വെൺകൽപ്പാത്രം' പൊതുവായ വായനയ്ക്ക് ഉപയോഗിച്ചു; കൂടുതൽ സാങ്കേതികമായ 'അലബാസ്റ്റർ കുപ്പി' അടിക്കുറിപ്പിൽ നൽകി. പ്രധാനവാക്യത്തിലെ രണ്ടു അടിക്കുറിപ്പുകളും അവ വിശദീകരിക്കുന്ന ഘടകങ്ങളുടെ പിന്നാലെ ചേർത്തിരിക്കുന്നു.
