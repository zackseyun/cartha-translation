  terminology: «അലബാസ്റ്റർ പാത്രം» accurately retains the specified container material. «സുഗന്ധതൈലം» is an appropriate primary rendering of μύρον, with «സുഗന്ധലേപനം» retained as a lexical alternative in the footnote.
