    issue: «വെൺകൽപ്പാത്രം» translates the container as bronze.
    rationale: The Greek ἀλάβαστρον denotes an alabaster container, not a bronze vessel. Replacing it with «അലബാസ്റ്റർ പാത്രം» is necessary for source fidelity.
  - severity: medium
