    rationale: «ഭക്ഷണത്തിനിരിക്കുമ്പോൾ» can simply mean ‘while sitting down to eat.’ The Greek denotes reclining in the customary meal posture; «ഭക്ഷണമേശയിൽ ചാരിക്കിടക്കുമ്പോൾ» preserves this directly.
