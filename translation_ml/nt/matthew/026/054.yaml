id: MAT.26.54
reference: Matthew 26:54
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πῶς οὖν πληρωθῶσιν αἱ γραφαὶ ὅτι οὕτως δεῖ γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/054.yaml
  text: How then would the Scriptures be fulfilled[a], that it must happen this way?
translation:
  language: ml
  text: അങ്ങനെയെങ്കിൽ, ഇങ്ങനെ സംഭവിക്കണം എന്ന് പറയുന്ന തിരുവെഴുത്തുകൾ എങ്ങനെ നിറവേറും?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അങ്ങനെയെങ്കിൽ, തിരുവെഴുത്തുകൾ എങ്ങനെ നിറവേറാനാണ്? ഇങ്ങനെ സംഭവിക്കണം എന്ന് അവ പറയുന്നല്ലോ.”'
    reason: πῶς സഹിതമുള്ള subjunctive ക്രിയയുടെ അലങ്കാരപരമായ സാധ്യതാസൂചനയും, ὅτι ആരംഭിക്കുന്ന ഉള്ളടക്കവാക്യവുമായി തിരുവെഴുത്തുകൾക്കുള്ള ബന്ധവും മലയാളത്തിൽ മറ്റൊരു സ്വാഭാവിക ക്രമത്തിൽ പ്രകടിപ്പിക്കാം.
lexical_decisions:
- source_word: πῶς οὖν
  choice: അങ്ങനെയെങ്കിൽ ... എങ്ങനെ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞതിൽനിന്നുള്ള യുക്തിപരമായ ഫലത്തെ οὖν സൂചിപ്പിക്കുകയും πῶς അലങ്കാരചോദ്യത്തിന്റെ ശക്തി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: πληρωθῶσιν
  choice: നിറവേറും
  rationale: πληρόω എന്ന ക്രിയയുടെ aorist passive subjunctive രൂപം ഇവിടെ സാധ്യതയെക്കുറിച്ചുള്ള അലങ്കാരചോദ്യത്തിലാണ്; മലയാളത്തിലെ ഭാവികാലരൂപം സന്ദർഭത്തിൽ ‘പിന്നെ എങ്ങനെ നിറവേറും?’ എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: αἱ γραφαὶ
  choice: തിരുവെഴുത്തുകൾ
  rationale: ഇവിടെ പൊതുവായ എഴുത്തുകളെയല്ല, ഇസ്രായേലിന്റെ വിശുദ്ധ ലിഖിതങ്ങളെയാണ് ബഹുവചനം സൂചിപ്പിക്കുന്നത്; ‘തിരുവെഴുത്തുകൾ’ മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗമാണ്.
- source_word: ὅτι
  choice: എന്ന
  rationale: തിരുവെഴുത്തുകൾ പ്രസ്താവിക്കുന്ന ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന ഘടകമായി ὅτιയെ മലയാളത്തിലെ ഉദ്ധരണി/ഉള്ളടക്കസൂചകമായ ‘എന്ന’ ഉപയോഗിച്ച് സ്വാഭാവികമായി പുനരാവിഷ്കരിച്ചു.
- source_word: οὕτως
  choice: ഇങ്ങനെ
  rationale: യേശുവിന്റെ പിടിയുടെയും തുടർന്നുള്ള കഷ്ടാനുഭവങ്ങളുടെയും ഇപ്പോഴത്തെ സംഭവരീതിയെ ചൂണ്ടിക്കാണിക്കുന്നു.
- source_word: δεῖ γενέσθαι
  choice: സംഭവിക്കണം
  rationale: δεῖയുടെ അനിവാര്യതയും γενέσθαιയുടെ സംഭവിക്കുക എന്ന അർഥവും ചുരുക്കമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
theological_decisions:
- issue: δεῖ സൂചിപ്പിക്കുന്ന അനിവാര്യതയുടെ സ്വഭാവം
  choice: ‘സംഭവിക്കണം’ എന്ന് മാത്രം പരിഭാഷപ്പെടുത്തി
  alternative: ‘ദൈവത്തിന്റെ പദ്ധതിപ്രകാരം സംഭവിക്കണം’
  rationale: തിരുവെഴുത്തുകളുടെ നിറവേറലുമായുള്ള ബന്ധം ദൈവിക അനിവാര്യത സൂചിപ്പിക്കുന്നുവെങ്കിലും, ഗ്രീക്ക് പാഠം ഇവിടെ ‘ദൈവത്തിന്റെ പദ്ധതി’ എന്ന വിശദീകരണം നേരിട്ട് ചേർക്കുന്നില്ല; അതിനാൽ പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംക്ഷിപ്തതയും സംഘർഷവും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. അലങ്കാരചോദ്യത്തിന്റെ ശക്തി നിലനിർത്തി; ‘നിവൃത്തിയാകും’ എന്നതിനെക്കാൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ‘നിറവേറും’ തെരഞ്ഞെടുത്തു. ὅτι-വാക്യത്തെ ഉദ്ധരണിചിഹ്നങ്ങളോടെ നൽകിയത് തിരുവെഴുത്തുകളുടെ ഉള്ളടക്കം വ്യക്തമായി ബന്ധിപ്പിക്കാനാണ്.
