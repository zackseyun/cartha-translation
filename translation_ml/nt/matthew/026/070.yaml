id: MAT.26.70
reference: Matthew 26:70
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ ἠρνήσατο ⸀ἔμπροσθεν πάντων λέγων· Οὐκ οἶδα τί λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/070.yaml
  text: But he denied it before them all[a], saying, “I do not know what you are saying.”
translation:
  language: ml
  text: എന്നാൽ അവൻ എല്ലാവരുടെയും മുമ്പാകെ അതു നിഷേധിച്ചു; “നീ പറയുന്നത് എന്താണെന്ന് എനിക്ക് അറിയില്ല” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠρνήσατο
  choice: അത് നിഷേധിച്ചു
  rationale: മുൻവാക്യത്തിൽ ഉന്നയിച്ച ആരോപണമാണ് സൂചിത കർമം. മലയാളത്തിൽ ആശയം സ്വാഭാവികവും വ്യക്തവുമാക്കാൻ ‘അത്’ ചേർക്കുന്നു; യേശുവിനെ തള്ളിപ്പറഞ്ഞു എന്ന കൂടുതൽ പ്രത്യേകമായ അർഥം വാചകത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: ἔμπροσθεν πάντων
  choice: എല്ലാവരുടെയും മുമ്പിൽ
  rationale: ജനക്കൂട്ടത്തിന്റെ സാന്നിധ്യത്തിൽ പരസ്യമായി നടന്ന നിഷേധം എന്ന അർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: λέγων
  choice: പറഞ്ഞുകൊണ്ട്
  rationale: ഗ്രീക്കിലെ പങ്കാളിക്രിയയുടെ പ്രവാഹം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: Οὐκ οἶδα
  choice: എനിക്ക് അറിയില്ല
  rationale: അറിയുക എന്ന ക്രിയയുടെ നേരിട്ടുള്ള നിഷേധം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: τί λέγεις
  choice: നീ പറയുന്നത് എന്താണെന്ന്
  rationale: ‘നീ എന്താണ് പറയുന്നത്’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം നേരിട്ട്, എന്നാൽ സ്വാഭാവികമായ മലയാള പരോക്ഷവാക്യഘടനയിൽ നൽകുന്നു.
theological_decisions:
- issue: പത്രോസിന്റെ നിഷേധത്തിന്റെ സ്വഭാവം
  choice: മുമ്പ് ഉന്നയിച്ച ആരോപണം അവൻ പരസ്യമായി നിഷേധിക്കുന്നു
  alternative: അവൻ യേശുവിനെ നേരിട്ട് തള്ളിപ്പറയുന്നു; അല്ലെങ്കിൽ ദാസിപ്പെണ്ണിനെ അറിയില്ലെന്ന് പറയുന്നു
  rationale: ഗ്രീക്കിൽ കർമം തുറന്നുപറയുന്നില്ല; മുൻസന്ദർഭത്തിലെ ആരോപണമാണ് സൂചിപ്പിക്കുന്നത്. അതിനാൽ അതിനപ്പുറമുള്ള പ്രത്യേക വ്യാഖ്യാനം പരിഭാഷയിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ പരസ്യനിഷേധവും സൂചിത കർമവും സംരക്ഷിച്ചു; അനാവശ്യമായി അക്ഷരാർഥപരമായോ സഭാഭാഷാപരമായോ ഉള്ള പ്രയോഗങ്ങൾ ഒഴിവാക്കി.
