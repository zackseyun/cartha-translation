id: MAT.26.3
reference: Matthew 26:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τότε συνήχθησαν οἱ ⸀ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ εἰς τὴν αὐλὴν τοῦ ἀρχιερέως τοῦ λεγομένου Καϊάφα,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/003.yaml
  text: Then the chief priests and the elders of the people were gathered in the courtyard of the high priest[a], who was called Caiaphas[b],
translation:
  language: ml
  text: അപ്പോൾ മുഖ്യപുരോഹിതന്മാരും ജനത്തിന്റെ മൂപ്പന്മാരും കയ്യഫാവ് എന്നു വിളിക്കപ്പെട്ട മഹാപുരോഹിതന്റെ മുറ്റത്ത്[a] ഒരുമിച്ചുകൂടി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “മുറ്റം” എന്നത് വലിയൊരു വസതിയുടെ നടുമുറ്റമോ കൊട്ടാരവളപ്പോ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: “ഒരുമിച്ചുകൂട്ടപ്പെട്ടു” എന്നും വിവർത്തനം ചെയ്യാം; ഗ്രീക്ക് ക്രിയ നിഷ്ക്രിയരൂപത്തിലാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: അപ്പോൾ
  rationale: തുടർന്നുണ്ടായ സംഭവത്തെ പരിചയപ്പെടുത്തുന്ന സ്വാഭാവികമായ കാലസൂചകം.
- source_word: συνήχθησαν
  choice: ഒരുമിച്ചുകൂടി
  rationale: സംഘം ഒരു സ്ഥലത്ത് സമ്മേളിച്ചതെന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; ഗ്രീക്കിൽ ക്രിയാരൂപം നിഷ്ക്രിയമാണെന്ന വിവരം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἀρχιερεῖς
  choice: മുഖ്യപുരോഹിതന്മാർ
  rationale: ഏക മഹാപുരോഹിതനെയല്ല, പ്രമുഖ പുരോഹിതാധികാരികളുടെ സംഘത്തെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
- source_word: πρεσβύτεροι τοῦ λαοῦ
  choice: ജനത്തിന്റെ മൂപ്പന്മാർ
  rationale: ജനത്തിനിടയിലെ അംഗീകൃത നേതാക്കളെ സൂചിപ്പിക്കുന്ന ജനിറ്റീവ് ഘടന നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: εἰς τὴν αὐλὴν
  choice: മുറ്റത്ത്
  rationale: ഒരുമിച്ചുകൂടിയതിന്റെ ലക്ഷ്യസ്ഥാനവും ഫലമായ സ്ഥലവും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; αὐλήയുടെ വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: τοῦ ἀρχιερέως
  choice: മഹാപുരോഹിതന്റെ
  rationale: സന്ദർഭത്തിലെ ഏക ഔദ്യോഗിക പദവിവാഹകനെ കൃത്യമായി സൂചിപ്പിക്കുന്ന പതിവുരൂപം.
- source_word: τοῦ λεγομένου Καϊάφα
  choice: കയ്യഫാവ് എന്നു വിളിക്കപ്പെട്ട
  rationale: പേരിലൂടെ മഹാപുരോഹിതനെ തിരിച്ചറിയിക്കുന്ന ഗ്രീക്ക് കൃുദന്തരൂപം ഔപചാരികമായി പ്രതിഫലിപ്പിക്കുന്നു.
