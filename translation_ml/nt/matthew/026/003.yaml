translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘മുഖ്യപുരോഹിതന്മാർ’ എന്ന ബഹുവചനം പുരോഹിതനേതൃത്വത്തെയും ‘മഹാപുരോഹിതൻ’ എന്ന ഏകവചനം ഔദ്യോഗിക പദവിവാഹകനെയും വ്യക്തമായി വേർതിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
