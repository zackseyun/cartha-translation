revisions:
- from: 'എന്നാൽ അവർ പറഞ്ഞുകൊണ്ടിരുന്നു: “പെരുന്നാളിനിടെ വേണ്ട; ജനങ്ങൾക്കിടയിൽ കലാപം ഉണ്ടാകാതിരിക്കട്ടെ.”'
  to: 'എന്നാൽ അവർ പറഞ്ഞുകൊണ്ടിരുന്നു: “പെരുന്നാളിനിടെ വേണ്ട; ജനങ്ങൾക്കിടയിൽ ഒരു കലക്കം ഉണ്ടാകാതിരിക്കാൻ.”'
  rationale: The revision retains the draft’s accurate rendering of the ongoing deliberation and the festival setting, while expressing ἵνα μή as an avoidance-purpose clause and using a term for public commotion that does not overstate the Greek.
  reviewer_model: gpt-5.6-terra
