id: MAT.26.5
reference: Matthew 26:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔλεγον δέ· Μὴ ἐν τῇ ἑορτῇ, ἵνα μὴ θόρυβος γένηται ἐν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/005.yaml
  text: But they were saying[a], “Not during the feast[b], lest there be an uproar among the people.”
translation:
  language: ml
  text: 'എന്നാൽ അവർ പറഞ്ഞുകൊണ്ടിരുന്നു: “പെരുന്നാളിനിടെ വേണ്ട; ജനങ്ങൾക്കിടയിൽ ഒരു കലക്കം ഉണ്ടാകാതിരിക്കാൻ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം ആലോചനയ്ക്കിടയിലെ തുടർന്നുള്ളതോ ആവർത്തിച്ചുള്ളതോ ആയ സംസാരത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: δέ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിൽനിന്നുള്ള ലഘുവായ വൈരുധ്യവും ആഖ്യാനത്തിലെ വഴിത്തിരിവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: Μὴ ἐν τῇ ἑορτῇ
  choice: പെരുന്നാളിനിടെ വേണ്ട
  rationale: ἐν എന്നതിന്റെ കാലസൂചനയും, സന്ദർഭത്തിൽ ἑορτή സൂചിപ്പിക്കുന്ന പെസഹാപ്പെരുന്നാളും, ഗ്രീക്കിലെ സംക്ഷിപ്തമായ നിരോധനഭാവവും നിലനിർത്തുന്നു.
- source_word: ἵνα μὴ
  choice: ഉണ്ടാകാതിരിക്കട്ടെ
  rationale: ഒഴിവാക്കാൻ ഉദ്ദേശിക്കുന്ന ഫലത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: θόρυβος
  choice: കലാപം
  rationale: പൊതുജനങ്ങൾക്കിടയിലെ പ്രക്ഷുബ്ധതയെയോ ക്രമക്കേടിനെയോ സൂചിപ്പിക്കുന്നു; നിർബന്ധമായും പൂർണതോതിലുള്ള ലഹള എന്ന അർഥത്തിലേക്ക് അതിനെ പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: γένηται
  choice: ഉണ്ടാകുക
  rationale: ‘സംഭവിക്കുക’ അല്ലെങ്കിൽ ‘ഉണ്ടാവുക’ എന്ന അർഥമുള്ള ഗίνομαι-യുടെ സന്ദർഭോചിതമായ മലയാളരൂപം.
- source_word: ἐν τῷ λαῷ
  choice: ജനങ്ങൾക്കിടയിൽ
  rationale: കൂടിയിരുന്ന ജനസമൂഹത്തിനുള്ളിൽ എന്ന സാമൂഹിക അർഥം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ‘പെരുന്നാൾ’ യഹൂദ പെസഹാ സന്ദർഭത്തിൽ സ്വാഭാവികമാണ്; ‘ഉത്സവം’ എന്നതും നിഘണ്ടുപരമായി സാധ്യമെങ്കിലും പ്രത്യേക കുറിപ്പ് അനിവാര്യമല്ല. നൽകിയ ഇംഗ്ലീഷ് പാഠത്തിലെ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും അവയുടെ ഉള്ളടക്കവും തമ്മിൽ പൊരുത്തക്കേടുള്ളതിനാൽ, മൂലഗ്രീക്കിന്റെ അർഥം പാഠത്തിൽ വ്യക്തമായി നൽകിയിരിക്കുന്നിടത്ത് അടിക്കുറിപ്പുകൾ ചേർത്തിട്ടില്ല.
