  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τί ὑμῖν δοκεῖ; οἱ δὲ ἀποκριθέντες εἶπαν· Ἔνοχος θανάτου ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/066.yaml
  text: What do you think? They answered[a], “He is deserving of death.”
translation:
  language: ml
  text: '“നിങ്ങൾക്ക് എന്തു തോന്നുന്നു?” അവർ മറുപടി പറഞ്ഞു[a]: “ഇവൻ മരണശിക്ഷയ്ക്ക് അർഹനാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇവൻ മരണത്തിന് കുറ്റക്കാരനാണ്” എന്നും “ഇവൻ മരണത്തിന് ബാധ്യസ്ഥനാണ്” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പ്രയോഗം ഒരു നിയമപരമായ വിധിയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ὑμῖν δοκεῖ
  choice: നിങ്ങൾക്ക് എന്തു തോന്നുന്നു?
  rationale: δοκέω എന്ന ക്രിയയും ὑμῖν എന്ന ദത്തിവിഭക്തിയും ചേർന്ന പ്രയോഗം അഭിപ്രായമോ വിധിയോ ചോദിക്കുന്നു. ഈ മലയാളപ്രയോഗം നേരിട്ടുള്ള ചോദ്യത്തിന്റെ സ്വാഭാവികത നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് അവരുടെ വിധി ചോദിക്കുന്നതായും വ്യക്തമാണ്.
- source_word: οἱ δὲ ἀποκριθέντες εἶπαν
  choice: അവർ മറുപടി പറഞ്ഞു
  rationale: ἀποκριθέντες εἶπαν എന്ന ഗ്രീക്ക് വിവരണപ്രയോഗം മലയാളത്തിൽ ഒരു സമാപികക്രിയയോടെ സ്വാഭാവികമായി നൽകി. δέ ഇവിടെ ശക്തമായ വിരോധമല്ല, ലഘുവായ ആഖ്യാനബന്ധമാണ്; അതിനാൽ പ്രത്യേക സംയോജകം ചേർക്കേണ്ടതില്ല.
- source_word: Ἔνοχος θανάτου
  choice: മരണശിക്ഷയ്ക്ക് അർഹനാണ്
  rationale: ἔνοχος + ജനിറ്റീവ് എന്നത് നിയമപരമായി കുറ്റക്കാരൻ, ബാധ്യസ്ഥൻ, അർഹൻ എന്നീ ആശയങ്ങൾ ഉൾക്കൊള്ളുന്നു. ഇവിടെ θανάτου കൂടെയുള്ള പ്രയോഗം മരണവിധിക്കോ മരണശിക്ഷയ്ക്കോ അർഹനെന്ന ന്യായവിധിയാണ്. സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവും ആയിരിക്കെ നിയമപരമായ ശക്തി ഈ പരിഭാഷ നിലനിർത്തുന്നു.
- source_word: ἐστίν
  choice: ഇവൻ … ആണ്
  rationale: ഗ്രീക്കിലെ കർത്താവ് സന്ദർഭത്തിൽ യേശുവാണ്. മലയാളത്തിലെ നേരിട്ടുള്ള വിധിപ്രസ്താവനയിൽ ‘ഇവൻ’ ചേർക്കുന്നത് സ്വാഭാവികവും വ്യക്തവുമാണ്; ഇതു സഭയുടെ വാക്കുകളിലെ പരാമർശമാണ്, പരിഭാഷകന്റെ വിലയിരുത്തലല്ല.
theological_decisions:
- issue: സഭയുടെ വിധിയുടെ നിയമപരമായ സ്വഭാവം
  choice: മരണശിക്ഷയ്ക്ക് അർഹനാണ്
  alternative: മരണത്തിന് കുറ്റക്കാരനാണ് / മരണത്തിന് ബാധ്യസ്ഥനാണ്
  rationale: വാക്യം യേശുവിനെക്കുറിച്ചുള്ള സഭയുടെ നിയമപരമായ വിധിയാണ് രേഖപ്പെടുത്തുന്നത്. ‘മരണശിക്ഷയ്ക്ക് അർഹനാണ്’ എന്നത് ആ വിധിയുടെ ശക്തി വ്യക്തമാക്കുന്നു; എന്നാൽ ദൈവസന്നിധിയിലെ യഥാർഥ കുറ്റമോ പ്രായശ്ചിത്തസിദ്ധാന്തമോ സംബന്ധിച്ച വ്യാഖ്യാനം ഇതിൽ ചേർക്കുന്നില്ല. ഗ്രീക്ക് പ്രയോഗത്തിലെ മറ്റ് സാധ്യമായ നിയമപരമായ ഭാവങ്ങൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നേരിട്ടും ഗൗരവത്തോടെയും പരിഭാഷപ്പെടുത്തി. കോടതിസദൃശമായ സന്ദർഭം വ്യക്തമാക്കാൻ ‘മരണശിക്ഷ’ ഉപയോഗിച്ചു; ‘അവർ മറുപടി പറഞ്ഞു’ എന്നത് ആഖ്യാനത്തിന്റെ സ്വാഭാവിക ഒഴുക്ക് നിലനിർത്തുന്നു.
