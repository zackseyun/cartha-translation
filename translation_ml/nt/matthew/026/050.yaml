reference: Matthew 26:50
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτῷ· Ἑταῖρε, ἐφ’ ⸀ὃ πάρει. τότε προσελθόντες ἐπέβαλον τὰς χεῖρας ἐπὶ τὸν Ἰησοῦν καὶ ἐκράτησαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/050.yaml
  text: But Jesus said to him[a], “Friend, do what you came for.” Then they came up, laid hands on Jesus, and seized him.
translation:
  language: ml
  text: 'എന്നാൽ യേശു അവനോട് പറഞ്ഞു: “സുഹൃത്തേ, നീ വന്ന കാര്യം ചെയ്യുക.”[a] അപ്പോൾ അവർ അടുത്തുവന്ന് യേശുവിന്റെ മേൽ കൈകൾ വെച്ച് അവനെ പിടികൂടി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “സുഹൃത്തേ, നീ എന്തിനാണ് വന്നത്?” ഗ്രീക്ക് പ്രയോഗം വളരെ സംക്ഷിപ്തമായതിനാൽ അതിനെ ഒരു ചോദ്യമായും മനസ്സിലാക്കാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἑταῖρε
  choice: സുഹൃത്തേ
  rationale: യൂദാസിനെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്ന പദം. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമാണ്; അതേസമയം അതിനെ അത്യന്തം ആത്മബന്ധമുള്ള സൗഹൃദമായി അമിതമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: ἐφ’ ὃ πάρει
  choice: നീ വന്ന കാര്യം ചെയ്യുക
  rationale: ഗ്രീക്ക് പ്രയോഗം അത്യന്തം സംക്ഷിപ്തമാണ്; സന്ദർഭത്തിൽ യൂദാസ് വന്ന ഉദ്ദേശ്യം നടപ്പാക്കാൻ അനുവദിക്കുകയോ അതിനെ തുറന്നുകാട്ടുകയോ ചെയ്യുന്ന വാക്കായി മുഖ്യപാഠത്തിൽ നൽകിയിരിക്കുന്നു. ചോദ്യരൂപത്തിലുള്ള സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: προσελθόντες
  choice: അടുത്തുവന്ന്
  rationale: യേശുവിന്റെ അടുക്കലേക്കുള്ള നീക്കവും തുടർന്ന് നടന്ന പ്രവൃത്തിയും സ്വാഭാവികമായ മലയാള ആഖ്യാനക്രമത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐπέβαλον τὰς χεῖρας ἐπὶ τὸν Ἰησοῦν
  choice: യേശുവിന്റെമേൽ കൈവെച്ച്
  rationale: ശത്രുതാപൂർവം ഒരാളെ കൈകൊണ്ട് പിടിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ രൂപവും ഭാവവും സംരക്ഷിക്കുന്നു; തുടർന്നുള്ള ‘പിടികൂടി’ എന്ന പദം പ്രവർത്തിയുടെ ബലപ്രയോഗസ്വഭാവം വ്യക്തമാക്കുന്നു.
- source_word: ἐκράτησαν αὐτόν
  choice: അവനെ പിടികൂടി
  rationale: κρατέω ഇവിടെ ബലമായി പിടിച്ചുവശത്താക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘അറസ്റ്റുചെയ്തു’ എന്ന നിയമപരമായ അർഥം അനാവശ്യമായി മുൻനിർത്താതെ ശാരീരിക നടപടിയെ വ്യക്തമാക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: യൂദാസിന്റെ മുൻപ്രവൃത്തിയിൽനിന്ന് യേശുവിന്റെ പ്രതികരണത്തിലേക്കുള്ള നേരിയ വൈരുധ്യവും ആഖ്യാനമാറ്റവും പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: യൂദാസിനോടുള്ള യേശുവിന്റെ അഭിസംബോധനയും മറുപടിയും എങ്ങനെ വ്യാഖ്യാനിക്കണം
  choice: “സുഹൃത്തേ, നീ വന്ന കാര്യം ചെയ്യുക” എന്ന restrained ആയെങ്കിലും സംഘർഷഭരിതമായ രൂപം മുഖ്യപാഠത്തിൽ നൽകുന്നു.
  alternative: “സുഹൃത്തേ, നീ എന്തിനാണ് വന്നത്?”
  rationale: Ἑταῖρε എന്ന അഭിസംബോധനയെ അത്യന്തം സ്നേഹപൂർവമോ അപലപനപരമോ ആക്കാതെ നിലനിർത്തുന്നു. ἐφ’ ὃ πάρει എന്ന സംക്ഷിപ്ത ഗ്രീക്ക് വാക്യം പ്രസ്താവന/ആജ്ഞാസദൃശമായോ ചോദ്യമായോ ഗ്രഹിക്കാവുന്നതിനാൽ മുഖ്യപാഠത്തിൽ ഒരു സാധ്യത സ്വീകരിച്ച് യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ‘സുഹൃത്തേ’ എന്നത് നിയന്ത്രിതമായ അഭിസംബോധനാഭാവം നിലനിർത്തുന്നു; ‘കൈവെച്ച് ... പിടികൂടി’ എന്ന ക്രമം മൂലപാഠത്തിലെ ശാരീരിക പ്രവർത്തനവും ആഖ്യാനഗതിയും സംരക്ഷിക്കുന്നു.
