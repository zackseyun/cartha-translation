id: MAT.26.25
reference: Matthew 26:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ Ἰούδας ὁ παραδιδοὺς αὐτὸν εἶπεν· Μήτι ἐγώ εἰμι, ῥαββί; λέγει αὐτῷ· Σὺ εἶπας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/025.yaml
  text: Then Judas, the one betraying him, answered and said, “Surely I am not the one, Rabbi?” He said to him, “You have said so.”
translation:
  language: ml
  text: 'അപ്പോൾ, അവനെ ഒറ്റിക്കൊടുക്കുന്ന യൂദാസ് മറുപടിയായി പറഞ്ഞു: “റബ്ബീ, ഞാനല്ലല്ലോ?” യേശു അവനോട് പറഞ്ഞു: “നീ പറഞ്ഞതാണ്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: തന്നെ ഒറ്റിക്കൊടുക്കാനിരുന്ന
  rationale: വർത്തമാന കൃതന്തം യൂദാസിനെ തിരിച്ചറിയിക്കുന്ന വിശേഷണമായി വരുന്നു; സന്ദർഭത്തിൽ ഉടൻ നടക്കാനിരിക്കുന്ന വഞ്ചനയെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: Μήτι ἐγώ εἰμι
  choice: അത് ഞാനല്ലല്ലോ?
  rationale: μήτι പ്രതീക്ഷിക്കുന്ന നിഷേധാത്മക ഉത്തരവും യൂദാസിന്റെ ആത്മവിമുക്തി സൂചിപ്പിക്കുന്ന ചോദ്യഭാവവും നിലനിർത്തുന്നു.
- source_word: ῥαββί
  choice: റബ്ബീ
  rationale: യഹൂദ അഭിസംബോധനയുടെ രൂപവും മത്തായിയിലെ ശിഷ്യന്മാരുടെ മറ്റു അഭിസംബോധനകളുമായുള്ള വ്യത്യാസവും സംരക്ഷിക്കുന്നു.
- source_word: Σὺ εἶπας
  choice: നീ തന്നെ പറഞ്ഞല്ലോ
  rationale: ഗ്രീക്കിലെ പരോക്ഷവും നിയന്ത്രിതവുമായ സ്ഥിരീകരണം നേരിട്ടുള്ള ‘അതെ’യായി ശക്തിപ്പെടുത്താതെ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ മറുപടിയുടെ സ്ഥിരീകരണശക്തി
  choice: “നീ തന്നെ പറഞ്ഞല്ലോ.”
  alternative: “അതെ, നീയാണ്.”
  rationale: Σὺ εἶπας എന്ന പ്രയോഗത്തിലെ പരോക്ഷതയും വ്യാഖ്യാനാത്മക സംഘർഷവും സംരക്ഷിക്കുന്നു; അതിനെ തുറന്ന, നേരിട്ടുള്ള സമ്മതമായി വിപുലീകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായതും ഗൗരവമുള്ളതുമായ മലയാളം. സംഭാഷണത്തിന്റെ ചുരുക്കവും യൂദാസിന്റെ ചോദ്യത്തിലെ നിഷേധപ്രതീക്ഷയും യേശുവിന്റെ മറുപടിയിലെ പരോക്ഷതയും നിലനിർത്തിയിരിക്കുന്നു.
