revisions:
- from: 'പിന്നെ അവൻ ഒരു പാനപാത്രം എടുത്ത് നന്ദി അർപ്പിച്ചശേഷം അത് അവർക്കു കൊടുത്തുകൊണ്ട് പറഞ്ഞു: “നിങ്ങൾ എല്ലാവരും ഇതിൽനിന്ന് കുടിക്കുവിൻ.”'
  to: 'പിന്നെ അവൻ ഒരു പാനപാത്രം എടുത്ത് നന്ദി അർപ്പിച്ചശേഷം അത് അവർക്കു കൊടുത്ത് പറഞ്ഞു: “നിങ്ങൾ എല്ലാവരും അതിൽനിന്ന് കുടിക്കുവിൻ.”'
  rationale: The revision preserves the draft’s accurate handling of the cup, thanksgiving, and the inclusive plural command, while correcting the relationship between the giving and the speech and retaining the anaphoric force of ἐξ αὐτοῦ. No footnote is required for this verse in Malayalam.
