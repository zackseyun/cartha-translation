id: MAT.26.27
reference: Matthew 26:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸀λαβὼν ποτήριον καὶ εὐχαριστήσας ἔδωκεν αὐτοῖς λέγων· Πίετε ἐξ αὐτοῦ πάντες,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/027.yaml
  text: And having taken a cup and given thanks[a], he gave it to them, saying, “Drink from it[c][b], all of you,”
translation:
  language: ml
  text: 'പിന്നെ അവൻ ഒരു പാനപാത്രം എടുത്ത് നന്ദി അർപ്പിച്ചശേഷം അത് അവർക്കു കൊടുത്ത് പറഞ്ഞു: “നിങ്ങൾ എല്ലാവരും അതിൽനിന്ന് കുടിക്കുവിൻ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβὼν
  choice: എടുത്ത്
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള അനുബന്ധപ്രവൃത്തിയെ സ്വാഭാവികമായ മലയാള ക്രിയാവിശേഷണരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ποτήριον
  choice: ഒരു പാനപാത്രം
  rationale: ഗ്രീക്കിൽ നിർദേശക ഉപപദമില്ലാത്തതിനാൽ അനിശ്ചിതത്വം നിലനിർത്തുന്നു; ഭക്ഷണസന്ദർഭത്തിൽ നിർദിഷ്ട പാത്രമെന്ന സാധ്യതയും ഈ പ്രയോഗം തടയുന്നില്ല.
- source_word: εὐχαριστήσας
  choice: നന്ദി അർപ്പിച്ചശേഷം
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള നന്ദിപറച്ചിലിന്റെ സമയക്രമവും εὐχαριστέω എന്നതിന്റെ അടിസ്ഥാന അർഥവും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἔδωκεν αὐτοῖς
  choice: അത് അവർക്കു കൊടുത്തുകൊണ്ട്
  rationale: പാനപാത്രമാണ് നൽകപ്പെട്ടതെന്ന് സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാകുന്നതിനാൽ മലയാളത്തിൽ ആവശ്യമായ സർവനാമം ചേർക്കുന്നു; λέγων-നോടുള്ള പ്രവാഹവും നിലനിർത്തുന്നു.
- source_word: λέγων
  choice: പറഞ്ഞു
  rationale: മലയാളത്തിൽ നേരിട്ടുള്ള ഉദ്ധരണി സ്വാഭാവികമായി അവതരിപ്പിക്കാൻ സമാപികക്രിയ ഉപയോഗിക്കുന്നു; ഗ്രീക്കിലെ വർത്തമാന കൃദന്തരൂപത്തിന്റെ വിവരണപരമായ പ്രവർത്തനം നിലനിൽക്കുന്നു.
- source_word: Πίετε
  choice: കുടിക്കുവിൻ
  rationale: ബഹുവചന ആജ്ഞയെ ഗൗരവമുള്ളതും ആധുനിക വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ രൂപത്തിൽ നൽകുന്നു.
- source_word: ἐξ αὐτοῦ
  choice: ഇതിൽനിന്ന്
  rationale: ἐξ എന്നതിന്റെ ഉറവിടസൂചന നേരിട്ട് സംരക്ഷിക്കുന്നു; മലയാളത്തിൽ കൈയിലുള്ള പാത്രത്തെ സൂചിപ്പിക്കാൻ ‘ഇത്’ സ്വാഭാവികമാണ്.
- source_word: πάντες
  choice: നിങ്ങൾ എല്ലാവരും
  rationale: ആജ്ഞ മുഴുവൻ ശിഷ്യസംഘത്തോടാണെന്ന സ്വാഭാവിക വ്യാകരണവ്യാപ്തി വ്യക്തമാക്കുന്നു; ‘മുഴുവനും കുടിക്കുക’ എന്ന തെറ്റായ ധാരണ ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: εὐχαριστήσας എന്ന പദത്തിന്റെ കർത്തൃകർമ/കൂദാശാപരമായ വ്യാഖ്യാനം
  choice: നന്ദി അർപ്പിച്ചശേഷം
  alternative: അനുഗ്രഹിച്ചശേഷം; സ്തോത്രപ്രാർത്ഥന ചൊല്ലിയശേഷം
  rationale: ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നന്ദി അർപ്പിക്കുക എന്നതാണ്. പാനപാത്രത്തെ അനുഗ്രഹിച്ചു എന്നോ പിൽക്കാല കൂദാശാസാങ്കേതിക പദപ്രയോഗമെന്നോ പാഠം വ്യക്തമാക്കാത്തതിനാൽ അങ്ങനെ നിർണയിക്കുന്നില്ല.
- issue: πάντες എന്നതിന്റെ വ്യാപ്തി
  choice: നിങ്ങൾ എല്ലാവരും
  alternative: എല്ലാവരും; എല്ലാം കുടിക്കുവിൻ
  rationale: πάντες ആജ്ഞയുടെ ബഹുവചന കർത്താവിനെയാണ് സ്വാഭാവികമായി വിശേഷിപ്പിക്കുന്നത്. അതിനാൽ സന്നിഹിതരായ മുഴുവൻ സംഘത്തോടുള്ള അഭിസംബോധന വ്യക്തമാക്കുന്നു; പാത്രത്തിലെ അളവിനെക്കുറിച്ചുള്ള അവകാശവാദം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി. ‘പാനപാത്രം’ ബൈബിൾസന്ദർഭത്തിന് യോജിച്ച വ്യക്തമായ പദമാണ്; അനാവശ്യമായ സഭാപാരമ്പര്യ സാങ്കേതികഭാഷ ഒഴിവാക്കി. ഈ വാക്യത്തിൽ ആവശ്യമായ വിവർത്തനക്കുറിപ്പ് ഇല്ലാത്തതിനാൽ അടിക്കുറിപ്പുകളൊന്നും ചേർത്തിട്ടില്ല.
