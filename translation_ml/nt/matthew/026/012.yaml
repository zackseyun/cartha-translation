id: MAT.26.12
reference: Matthew 26:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: βαλοῦσα γὰρ αὕτη τὸ μύρον τοῦτο ἐπὶ τοῦ σώματός μου πρὸς τὸ ἐνταφιάσαι με ἐποίησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/012.yaml
  text: For when she poured this perfume on my body[b][a], she did it to prepare me for burial.
translation:
  language: ml
  text: കാരണം, ഈ സ്ത്രീ ഈ സുഗന്ധതൈലം എന്റെ ശരീരത്തിൽ ഒഴിച്ചത് എന്നെ അടക്കത്തിനായി ഒരുക്കുന്നതിനാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “എന്റെ അടക്കത്തിനായി”; ഗ്രീക്കിൽ ഇത് കൂടുതൽ സംക്ഷിപ്തമായി പരിഭാഷപ്പെടുത്താം. എന്നാൽ ഉപയോഗിച്ചിരിക്കുന്ന ക്രിയയിൽ ശരീരം അടക്കത്തിനായി ഒരുക്കുക എന്ന ആശയവും ഉൾപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: βαλοῦσα
  choice: ഒഴിച്ചത്
  rationale: βάλλω എന്ന ക്രിയയുടെ ആക്ഷരിക അർഥം ‘ഇടുക/എറിയുക’ എന്നാകാമെങ്കിലും, ഇവിടെ സുഗന്ധതൈലം ശരീരത്തിൽ പ്രയോഗിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഒഴിക്കുക’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞതിന്റെ വിശദീകരണം യേശു ഇവിടെ നൽകുന്നതിനാൽ γάρ എന്നതിന്റെ വിശദീകരണസ്വരം ‘കാരണം’ നിലനിർത്തുന്നു.
- source_word: αὕτη
  choice: ഇവൾ
  rationale: ഗ്രീക്കിലെ നിർദ്ദേശകസർവനാമത്തിന്റെ ‘ഈ സ്ത്രീ’ എന്ന സൂചന മലയാളത്തിൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: τὸ μύρον τοῦτο
  choice: ഈ സുഗന്ധതൈലം
  rationale: μύρον സുഗന്ധമുള്ള അഭിഷേകതൈലത്തെയോ ലേപനവസ്തുവിനെയോ സൂചിപ്പിക്കുന്നു; ദ്രവരൂപത്തിൽ ഒഴിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘സുഗന്ധതൈലം’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: ἐπὶ τοῦ σώματός μου
  choice: എന്റെ ശരീരത്തിന്മേൽ
  rationale: ἐπί + genitive ഇവിടെ ശരീരവുമായി സമ്പർക്കത്തിലുള്ള സ്ഥാനത്തെ സൂചിപ്പിക്കുന്നു; ‘ശരീരത്തിന്മേൽ’ അത് നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: πρὸς τὸ ἐνταφιάσαι με
  choice: എന്നെ സംസ്കാരത്തിനായി ഒരുക്കാനാണ്
  rationale: πρός + articular infinitive ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു; ἐνταφιάζω ശരീരം സംസ്കാരത്തിനായി ഒരുക്കുന്നതും സംസ്കരിക്കുന്നതുമായ അർഥപരിധിയുള്ളതിനാൽ പ്രധാന വാചകത്തിൽ ഒരുക്കലിന്റെ സൂചന നിലനിർത്തുന്നു.
- source_word: ἐποίησεν
  choice: ഒഴിച്ചത് … ഒരുക്കാനാണ്
  rationale: ഗ്രീക്കിൽ ‘അവൾ ചെയ്തു’ എന്ന പ്രധാനക്രിയ പങ്കാളിക്രിയയിലെ പ്രവൃത്തിയെ തിരിച്ചുപറയുന്നു. മലയാളത്തിൽ അതിനെ അതേ ഘടനയിൽ ആവർത്തിക്കുന്നത് അസ്വാഭാവികമായതിനാൽ, പ്രവൃത്തിയും ഉദ്ദേശ്യവും ഒരൊറ്റ സ്വാഭാവിക വാക്യഘടനയിൽ ചേർത്തിരിക്കുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ സംസ്കാരവുമായി ἐνταφιάζω എന്ന ക്രിയയ്ക്കുള്ള ബന്ധം
  choice: സ്ത്രീയുടെ പ്രവൃത്തി യേശുവിനെ സംസ്കാരത്തിനായി ഒരുക്കിയതായി അവതരിപ്പിക്കുന്നു.
  alternative: ‘എന്റെ സംസ്കാരത്തിനായി’ എന്നു മാത്രം സംക്ഷിപ്തമായി നൽകാം.
  rationale: ക്രിയയ്ക്ക് സംസ്കാരത്തിനുമുമ്പുള്ള ശരീരസജ്ജീകരണത്തിന്റെ അർഥം ഉൾപ്പെടുന്നു. ‘ഒരുക്കാനാണ്’ എന്നത് യേശുവിന്റെ വരാനിരിക്കുന്ന മരണത്തെക്കുറിച്ചുള്ള വാക്യത്തിന്റെ മുൻസൂചന നിലനിർത്തുന്നു; അതിലധികമായ സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ പങ്കാളിക്രിയയും പ്രധാനക്രിയയും മലയാളത്തിൽ യാന്ത്രികമായി ആവർത്തിക്കാതെ, പ്രവൃത്തി–ഉദ്ദേശ്യ ബന്ധം വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു.
