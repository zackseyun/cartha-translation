reference: Matthew 26:63
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἐσιώπα. ⸀καὶ ὁ ἀρχιερεὺς εἶπεν αὐτῷ· Ἐξορκίζω σε κατὰ τοῦ θεοῦ τοῦ ζῶντος ἵνα ἡμῖν εἴπῃς εἰ σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/063.yaml
  text: 'But Jesus kept silent[a]. And the high priest said to him, “I put you under oath by the living God: tell us if you are the Messiah[b], the Son of God.”'
translation:
  language: ml
  text: 'എന്നാൽ യേശു മൗനം പാലിച്ചുകൊണ്ടിരുന്നു. മഹാപുരോഹിതൻ അവനോടു പറഞ്ഞു: “ജീവിക്കുന്ന ദൈവത്തിന്റെ നാമത്തിൽ ഞാൻ നിന്നോടു ശപഥപൂർവം ആവശ്യപ്പെടുന്നു[b]: നീ അഭിഷിക്തനും[a] ദൈവപുത്രനും ആണോ എന്നു ഞങ്ങളോടു പറയുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ക്രിസ്തു” അല്ലെങ്കിൽ “മശീഹാ.” ഗ്രീക്കിലെ ക്രിസ്റ്റോസ് എന്ന പദത്തിന് “അഭിഷിക്തൻ” എന്നാണ് അർഥം; ഇവിടെ അത് പേരായല്ല, പദവിയായാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: alternative_reading
  - marker: b
    text: “ജീവിക്കുന്ന ദൈവത്തെച്ചൊല്ലി ഞാൻ നിന്നോടു ആണയിടുന്നു” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിൽ ഇത് ഗൗരവമേറിയ ഒരു ശപഥസൂത്രമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσιώπα
  choice: മൗനം പാലിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലരൂപം യേശുവിന്റെ മൗനം തുടർന്നുകൊണ്ടിരുന്നതായി സൂചിപ്പിക്കുന്നു; ഈ പ്രയോഗം ആ തുടർച്ച സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀρχιερεὺς
  choice: മഹാപുരോഹിതൻ
  rationale: ഈ യഹൂദ മതപദവിക്കുള്ള പ്രചാരത്തിലുള്ളതും കൃത്യവുമായ മലയാളപദം.
- source_word: Ἐξορκίζω σε κατὰ τοῦ θεοῦ τοῦ ζῶντος
  choice: ജീവിക്കുന്ന ദൈവത്തെച്ചൊല്ലി ഞാൻ നിന്നെക്കൊണ്ട് സത്യംചെയ്യിക്കുന്നു
  rationale: ഇവിടെ ക്രിയയ്ക്ക് ഭൂതോച്ചാടനവുമായി ബന്ധമില്ല; ദൈവത്തെ സാക്ഷിയാക്കി ഉത്തരം പറയാൻ നിർബന്ധിക്കുന്ന ഗൗരവമേറിയ ശപഥസൂത്രത്തിന്റെ ന്യായവിചാരണാപരമായ ശക്തിയാണ് ഈ വിവർത്തനം നൽകുന്നത്.
- source_word: ἵνα ἡμῖν εἴπῃς
  choice: ഞങ്ങളോടു പറയുക
  rationale: ശപഥം ചെയ്യിക്കുന്നതിന്റെ ആവശ്യപ്പെട്ട ഉള്ളടക്കം മലയാളത്തിൽ നേരിട്ടും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
- source_word: ὁ χριστός
  choice: അഭിഷിക്തൻ
  rationale: വാക്ക് ഇവിടെ പേരായല്ല, പ്രതീക്ഷിക്കപ്പെട്ട അഭിഷിക്ത രക്ഷകനെ സൂചിപ്പിക്കുന്ന പദവിയായാണ് പ്രവർത്തിക്കുന്നത്; അതിനാൽ അർത്ഥം മലയാളത്തിലേക്ക് പരിഭാഷപ്പെടുത്തി.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: ദൈവപുത്രൻ
  rationale: നിശ്ചിതമായ ക്രിസ്തുശാസ്ത്രപരമായ പദവി സംക്ഷിപ്തമായും പതിവായും നിലനിർത്തുന്നു.
- source_word: ὁ δὲ Ἰησοῦς
  choice: എന്നാൽ യേശു
  rationale: δέ മുൻസന്ദർഭത്തിലെ ആരോപണങ്ങൾക്കും യേശുവിന്റെ തുടർന്ന മൗനത്തിനും ഇടയിലെ നേരിയ വൈരുധ്യം അടയാളപ്പെടുത്തുന്നു.
theological_decisions:
- issue: നേരിട്ടുള്ള ക്രിസ്തുശാസ്ത്രപരമായ ചോദ്യം ചെയ്യലിൽ Χριστός എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: അഭിഷിക്തൻ
  alternative: ക്രിസ്തു; മശീഹാ
  rationale: ὁ χριστός ഇവിടെ വ്യക്തിനാമമല്ല, പദവിയാണ്. ‘അഭിഷിക്തൻ’ ഗ്രീക്കുപദത്തിന്റെ അർത്ഥം നേരിട്ട് നൽകുന്നു; പരിചിതമായ മറ്റു രൂപങ്ങൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: Ἐξορκίζω σε κατὰ τοῦ θεοῦ τοῦ ζῶντος എന്ന സൂത്രത്തിന്റെ ശക്തി
  choice: ജീവിക്കുന്ന ദൈവത്തെച്ചൊല്ലിയുള്ള ഔപചാരിക ശപഥബാധ്യത
  alternative: ശപഥത്തിന്റെ ശക്തിയില്ലാത്ത ഒരു സാധാരണ ആജ്ഞ
  rationale: ദൈവത്തെ ഔപചാരികമായി ആഹ്വാനം ചെയ്യുന്ന ഈ വാക്കുകൾ ന്യായവിചാരണാസന്ദർഭത്തിലെ ഗൗരവമേറിയ ശപഥസൂത്രമാണ്; സാധാരണ കല്പനയായി മയപ്പെടുത്തുന്നില്ല.
- issue: ὁ χριστός ὁ υἱὸς τοῦ θεοῦ എന്ന പദസമുച്ചയത്തിന്റെ ബന്ധം
  choice: രണ്ട് പദവികളും ഒരേ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന വിധം വിരാമചിഹ്നങ്ങളാൽ ചേർത്തു
  alternative: ‘അഭിഷിക്തനായ ദൈവപുത്രൻ’ എന്ന ഒറ്റ സംയുക്തപദവി
  rationale: ഗ്രീക്ക് വാചകം ‘അഭിഷിക്തൻ’ എന്നും ‘ദൈവപുത്രൻ’ എന്നും ചേർന്ന തിരിച്ചറിയൽ നിലനിർത്തുന്നു; അവയുടെ കൃത്യമായ താർക്കികബന്ധം അമിതമായി നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യതയും ഉള്ള മലയാളം. ‘സത്യംചെയ്യിക്കുന്നു’ എന്നത് കോടതിസദൃശമായ ശപഥബാധ്യത വ്യക്തമാക്കുന്നു; ‘മൗനം പാലിച്ചുകൊണ്ടിരുന്നു’ അപൂർണഭൂതകാലത്തിന്റെ തുടർച്ച സംരക്ഷിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
