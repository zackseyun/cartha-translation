  text: ἔφη αὐτῷ ὁ Ἰησοῦς· Ἀμὴν λέγω σοι ὅτι ἐν ταύτῃ τῇ νυκτὶ πρὶν ἀλέκτορα φωνῆσαι τρὶς ἀπαρνήσῃ με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/034.yaml
  text: Jesus said to him, “Truly I tell you, in this very night, before a rooster crows, you will deny me three times.”
translation:
  language: ml
  text: 'യേശു അവനോടു പറഞ്ഞു: “സത്യമായി ഞാൻ നിന്നോടു പറയുന്നു: ഇന്നുരാത്രി തന്നെ[a], കോഴി കൂവുന്നതിനുമുമ്പ്[b] നീ മൂന്നുപ്രാവശ്യം എന്നെ തള്ളിപ്പറയും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഈ രാത്രിയിൽത്തന്നെ.” ‘ഈ’ എന്ന ആശയത്തിന് ഗ്രീക്കിൽ ഊന്നലുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “ഒരു കോഴി കൂവുന്നതിനുമുമ്പ്.” കോഴി നിർദിഷ്ടമാണോ അനിർദിഷ്ടമാണോ എന്ന് ഗ്രീക്ക് പ്രയോഗം നിർബന്ധമായി വ്യക്തമാക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: യേശു അവനോടു പറഞ്ഞു
  rationale: ഗ്രീക്ക് ആഖ്യാനത്തിലെ ലളിതമായ ഭൂതകാല സംഭാഷണക്രിയയും പരോക്ഷ കർമവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Ἀμὴν λέγω σοι
  choice: സത്യമായി ഞാൻ നിന്നോടു പറയുന്നു
  rationale: യേശുവിന്റെ വാക്കുകൾക്ക് ആമുഖമായുള്ള ഗൗരവമേറിയ ഉറപ്പിനെ ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ പകർന്നു നൽകുന്നു; ‘ആമേൻ’ എന്ന ലിപ്യന്തരണം മുഖ്യവാചകത്തിൽ ഒഴിവാക്കുന്നു.
- source_word: ἐν ταύτῃ τῇ νυκτί
  choice: ഇന്നുരാത്രി തന്നെ
  rationale: ‘ഈ രാത്രിയിൽ’ എന്ന അർഥവും ταύτῃ നൽകുന്ന ഊന്നലും സ്വാഭാവികമായ മലയാളത്തിൽ ‘തന്നെ’ ഉപയോഗിച്ച് സംരക്ഷിക്കുന്നു.
- source_word: πρὶν ἀλέκτορα φωνῆσαι
  choice: കോഴി കൂവുന്നതിനുമുമ്പ്
  rationale: അനിശ്ചിതമോ നിർദിഷ്ടമോ ആയ ആർട്ടിക്കിൾ മലയാളത്തിൽ നിർബന്ധമല്ല; ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക അർഥം ചുരുക്കമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: τρὶς
  choice: മൂന്നുപ്രാവശ്യം
  rationale: ആവർത്തനത്തിന്റെ കൃത്യമായ എണ്ണം വ്യക്തമായി നൽകുന്ന സാധാരണ ആധുനിക പ്രയോഗം.
- source_word: ἀπαρνήσῃ με
  choice: നീ മൂന്നുപ്രാവശ്യം എന്നെ തള്ളിപ്പറയും
  rationale: ഇവിടെ ἀπαρνέομαι എന്നത് യേശുവുമായുള്ള ബന്ധം നിഷേധിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘തള്ളിപ്പറയുക’ ഈ സന്ദർഭത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.
theological_decisions:
- issue: Ἀμὴν λέγω σοι എന്ന യേശുവിന്റെ ആമുഖസൂത്രം
  choice: സത്യമായി ഞാൻ നിന്നോടു പറയുന്നു
  alternative: ആമേൻ, ഞാൻ നിന്നോടു പറയുന്നു
  rationale: യേശുവിന്റെ ഗൗരവമേറിയ അധികാരപ്രസ്താവന സംരക്ഷിക്കുമ്പോൾ, പിന്നീട് രൂപപ്പെട്ട ആരാധനാക്രമപരമായ അർഥച്ചായ മുഖ്യവാചകത്തിലേക്ക് അനാവശ്യമായി കൊണ്ടുവരുന്നില്ല.
- issue: ἀπαρνήσῃ με എന്നതിലെ നിഷേധത്തിന്റെ സ്വഭാവം
  choice: എന്നെ തള്ളിപ്പറയും
  alternative: എന്നെ അറിയില്ലെന്നു പറയും
  rationale: മൂലപദം നിഷേധത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും അതിന്റെ വാക്കുകൾ കൃത്യമായി എങ്ങനെയായിരിക്കുമെന്ന് ഈ വാക്യം വിശദീകരിക്കുന്നില്ല; അതിനാൽ കൂടുതൽ വ്യക്തീകരിച്ച് മൂലത്തിലെ പരിധി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ മാന്യവും നേരിട്ടുമുള്ള ശൈലി. ഉദ്ധരണിയിലെ ഗൗരവം നിലനിർത്താൻ ‘സത്യമായി’ എന്നും demonstrative emphasis നിലനിർത്താൻ ‘തന്നെ’ എന്നും ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടുണ്ട്.
