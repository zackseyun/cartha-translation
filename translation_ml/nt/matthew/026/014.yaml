id: MAT.26.14
reference: Matthew 26:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τότε πορευθεὶς εἷς τῶν δώδεκα, ὁ λεγόμενος Ἰούδας Ἰσκαριώτης, πρὸς τοὺς ἀρχιερεῖς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/014.yaml
  text: Then one of the twelve[a], the one called Judas Iscariot, went to the chief priests,
translation:
  language: ml
  text: അപ്പോൾ പന്ത്രണ്ടുപേരിൽ ഒരാളായ ഇസ്കര്യോത്ത് യൂദാ എന്നു വിളിക്കപ്പെട്ടവൻ മുഖ്യപുരോഹിതന്മാരുടെ അടുക്കൽ ചെന്നു,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: അപ്പോൾ
  rationale: തുടർന്നുണ്ടാകുന്ന സംഭവത്തെ പരിചയപ്പെടുത്തുന്ന കാലസൂചകമാണ്; ആഖ്യാനത്തിന്റെ സ്വാഭാവിക ഒഴുക്ക് നിലനിർത്തുന്നു.
- source_word: πορευθεὶς
  choice: ചെന്നു
  rationale: പ്രധാന പുരോഹിതന്മാരുടെ അടുക്കലേക്കുള്ള നീക്കം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘പോയിട്ട്’ എന്ന കൃത്രിമമായ പങ്കുപ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: εἷς τῶν δώδεκα
  choice: പന്ത്രണ്ടുപേരിൽ ഒരുവനായ
  rationale: അംശബന്ധം കൃത്യമായി നിലനിർത്തുകയും ഇത് യേശുവിന്റെ പന്ത്രണ്ടു ശിഷ്യരിൽ ഒരാളെ സൂചിപ്പിക്കുന്നുവെന്ന് സ്വാഭാവികമായി അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: ὁ λεγόμενος
  choice: എന്നു വിളിക്കപ്പെട്ടവൻ
  rationale: യൂദായെ വിശേഷിപ്പിക്കുന്ന ഗ്രീക്ക് പങ്കുപ്രയോഗത്തിന്റെ തിരിച്ചറിയൽഭാവം സംരക്ഷിക്കുന്നു.
- source_word: Ἰούδας Ἰσκαριώτης
  choice: ഇസ്കര്യോത്ത് യൂദാ
  rationale: മലയാള ബൈബിൾ വായനയിൽ പരിചിതമായ നാമരൂപവും ക്രമവും സ്വീകരിക്കുന്നു; വ്യക്തിനാമവും വിശേഷനാമവും ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: πρὸς τοὺς ἀρχιερεῖς
  choice: മുഖ്യപുരോഹിതന്മാരുടെ അടുക്കൽ
  rationale: πρός-ന്റെ ദിശാബോധവും ἀρχιερεῖς സൂചിപ്പിക്കുന്ന മുതിർന്ന പുരോഹിതാധികാരികളുടെ ബഹുവചനവും കൃത്യമായി നൽകുന്നു.
theological_decisions:
- issue: τῶν δώδεκα എന്ന സംഘനാമത്തിന്റെ അവതരണം
  choice: പന്ത്രണ്ടുപേരിൽ ഒരുവൻ
  alternative: പന്ത്രണ്ടു പേരടങ്ങിയ പ്രത്യേക സംഘത്തിലെ ഒരുവൻ
  rationale: ഗ്രീക്കിൽ വലിയക്ഷരഭേദമില്ല; അതിനാൽ പ്രത്യേക വ്യാഖ്യാനപരമായ അടയാളപ്പെടുത്തൽ ചേർക്കാതെ അംശബന്ധവും അറിയപ്പെടുന്ന സംഘസൂചനയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തിയിരിക്കുന്നു.
