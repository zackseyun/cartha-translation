  terminology: ‘ഉയിർപ്പിക്കപ്പെട്ട’ suitably preserves the Greek passive resurrection idiom without imposing an unstated agent. ‘ഗലീലയിലേക്കു’ is a natural rendering of εἰς τὴν Γαλιλαίαν. ‘നിങ്ങൾക്കു മുമ്പായി’ naturally conveys the plural object and προάγω’s directional sense.
