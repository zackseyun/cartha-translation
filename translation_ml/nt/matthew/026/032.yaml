id: MAT.26.32
reference: Matthew 26:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μετὰ δὲ τὸ ἐγερθῆναί με προάξω ὑμᾶς εἰς τὴν Γαλιλαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/032.yaml
  text: But after I am raised up[a], I will go ahead of you into Galilee.
translation:
  language: ml
  text: എന്നാൽ ഞാൻ ഉയിർപ്പിക്കപ്പെട്ട ശേഷം നിങ്ങൾക്കു മുമ്പായി ഗലീലയിലേക്കു പോകും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ δὲ
  choice: എന്നാൽ ... ശേഷം
  rationale: μετά + articular infinitive കാലക്രമത്തിൽ ‘ശേഷം’ എന്നു സൂചിപ്പിക്കുന്നു; δέ മുൻവാക്യത്തിലെ ഇടർച്ചയുടെ പ്രവചനത്തോടുള്ള നേരിയ വൈരുധ്യം നിലനിർത്തുന്നതിനാൽ ‘എന്നാൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: τὸ ἐγερθῆναί με
  choice: ഞാൻ ഉയിർപ്പിക്കപ്പെട്ടശേഷം
  rationale: ἐγείρω എന്ന ക്രിയയുടെ aorist passive infinitive രൂപവും അതിന്റെ കർത്താവായ μεയും ചേർന്ന് ‘ഞാൻ ഉയിർപ്പിക്കപ്പെട്ടശേഷം’ എന്നർഥം നൽകുന്നു. പുനരുത്ഥാനസന്ദർഭത്തിലെ passive രൂപം നിലനിർത്തുന്നു; പ്രവർത്തകനെ വാക്യത്തിൽ വ്യക്തമാക്കുന്നില്ല.
- source_word: προάξω
  choice: നിങ്ങൾക്കു മുമ്പായി ... പോകും
  rationale: προάγω ഇവിടെ മറ്റുള്ളവർക്കു മുമ്പായി പോകുക എന്ന ദിശാത്മക അർഥത്തിലാണ്. ‘മുമ്പായി പോകും’ എന്നത് നേതൃത്വത്തിന്റെ ആശയം അനാവശ്യമായി ചേർക്കാതെ ഈ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὑμᾶς
  choice: നിങ്ങൾക്കു
  rationale: രണ്ടാം പുരുഷ ബഹുവചനത്തെ ആധുനിക നിലവാര മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: ഗലീലയിലേക്കു
  rationale: εἰς സൂചിപ്പിക്കുന്ന ലക്ഷ്യത്തിലേക്കുള്ള ചലനം മലയാളത്തിൽ ‘-ലേക്കു’ എന്ന രൂപത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ἐγερθῆναί എന്ന പുനരുത്ഥാനപ്രയോഗത്തിലെ passive രൂപം
  choice: ‘ഞാൻ ഉയിർപ്പിക്കപ്പെട്ടശേഷം’ എന്നു passive ഭാവം നിലനിർത്തി.
  alternative: ‘ഞാൻ ഉയിർത്തെഴുന്നേറ്റശേഷം’
  rationale: ഗ്രീക്ക് പാഠം passive രൂപമാണ് ഉപയോഗിക്കുന്നത്. അതിനെ കർത്തൃപ്രയോഗമാക്കി മാറ്റാതെ നിലനിർത്തുന്നത് ദൈവിക പ്രവർത്തകത്വം സൂചിപ്പിക്കാമെങ്കിലും വാക്യത്തിൽ തുറന്നു പറയാത്ത ആ ഭാവത്തെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഉയിർപ്പിക്കപ്പെട്ടശേഷം’ എന്ന രൂപം സാധാരണ സംസാരഭാഷയേക്കാൾ അല്പം ഔപചാരികമാണെങ്കിലും മൂലത്തിലെ passive ഭാവം കൃത്യമായി സംരക്ഷിക്കുന്നു; ബദൽ സ്വാഭാവിക പ്രയോഗം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
