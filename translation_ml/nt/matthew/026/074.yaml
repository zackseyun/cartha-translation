id: MAT.26.74
reference: Matthew 26:74
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τότε ἤρξατο καταθεματίζειν καὶ ὀμνύειν ὅτι Οὐκ οἶδα τὸν ἄνθρωπον. καὶ ⸀εὐθέως ἀλέκτωρ ἐφώνησεν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/074.yaml
  text: Then he began to curse and to swear[a], “I do not know the man.” And immediately a rooster crowed.
translation:
  language: ml
  text: 'അപ്പോൾ അവൻ ശാപം ചൊല്ലാനും ആണയിടാനും തുടങ്ങി[a]: “ആ മനുഷ്യനെ എനിക്ക് അറിയില്ല.” ഉടനെ ഒരു കോഴി കൂവി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, “ശാപങ്ങൾ വിളിച്ചുപറയാനും ആണയിടാനും തുടങ്ങി.” തന്റെ നിഷേധം ഉറപ്പിക്കാൻ, അത് വ്യാജമാണെങ്കിൽ ശാപം സ്വന്തംമേൽ വരട്ടെ എന്ന് അവൻ ആണയിട്ടതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: അപ്പോൾ
  rationale: കഥയിലെ അടുത്ത സംഭവത്തെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἤρξατο
  choice: തുടങ്ങി
  rationale: പത്രോസിന്റെ നിഷേധം കൂടുതൽ രൂക്ഷമാകുന്നതു കാണിക്കുന്ന ആരംഭാർഥം നിലനിർത്തുന്നു.
- source_word: καταθεματίζειν
  choice: ശാപം ചൊല്ലാൻ
  rationale: കേവലം അസഭ്യം പറയുക എന്നല്ല, ശാപം വിളിച്ചുപറയുക എന്ന അർഥം നൽകുന്നു; ശാപം ആരുടെമേൽ എന്നത് മുഖ്യവാചകത്തിൽ നിർബന്ധമായി തീർപ്പാക്കുന്നില്ല.
- source_word: ὀμνύειν
  choice: ആണയിടാൻ
  rationale: സന്ദർഭത്തിലെ ഗൗരവമുള്ള സത്യപ്രതിജ്ഞയെ സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὅτι
  choice: നേരിട്ടുള്ള ഉദ്ധരണിക്ക് മുമ്പിലെ ദ്വിബിന്ദു
  rationale: തുടർന്നുവരുന്നത് അവന്റെ ആണയുടെ ഉള്ളടക്കമാണെന്ന് മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: Οὐκ οἶδα
  choice: എനിക്ക് അറിയില്ല
  rationale: അറിവോ പരിചയമോ നിഷേധിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ നേരായ മലയാളരൂപം.
- source_word: τὸν ἄνθρωπον
  choice: ആ മനുഷ്യനെ
  rationale: പരാമർശിക്കപ്പെട്ട വ്യക്തിയെ സൂചിപ്പിക്കുന്ന മലയാളത്തിലെ സ്വാഭാവിക നിർദ്ദേശരൂപം; ‘മനുഷ്യൻ’ എന്ന പദം നിലനിർത്തുന്നു.
- source_word: καὶ εὐθέως
  choice: ഉടനെ
  rationale: യേശുവിന്റെ പ്രവചനം തൽക്ഷണം നിറവേറിയെന്ന കഥാഗതിയിലെ അടിയന്തരത സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: ἀλέκτωρ
  choice: ഒരു കോഴി
  rationale: ആർട്ടിക്കിൾ ഇല്ലാത്ത ഗ്രീക്ക് നാമത്തിന് സ്വാഭാവിക മലയാള അനിശ്ചിതരൂപം.
- source_word: ἐφώνησεν
  choice: കൂവി
  rationale: കോഴിയുടെ ശബ്ദത്തിന് മലയാളത്തിൽ പതിവായ ക്രിയ.
theological_decisions:
- issue: പത്രോസിന്റെ നിഷേധത്തിൽ καταθεματίζειν എന്നതിന്റെ അർഥം
  choice: മുഖ്യവാചകത്തിൽ ‘ശാപം ചൊല്ലാൻ’ എന്ന് പരിഭാഷപ്പെടുത്തി, സ്വയം ശപഥത്തിന് വിധേയനാക്കുന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
  alternative: ‘സ്വന്തംമേൽ ശാപം വിളിച്ചുവരുത്താൻ’ എന്ന് മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കുക; അല്ലെങ്കിൽ പൊതുവായി ‘ശപിക്കാൻ’ എന്നു പറയുക.
  rationale: ὀμνύειν എന്ന ആണയിടലിനോടു ചേർന്നതിനാൽ സ്വയം ശാപത്തിന് വിധേയനാക്കുന്ന ശപഥപ്രയോഗം സാധ്യതയേറിയതാണ്. എന്നാൽ പ്രതിഫലനാർഥം ക്രിയയിൽ തുറന്നുപറഞ്ഞിട്ടില്ലാത്തതിനാൽ മുഖ്യവാചകം യഥാർത്ഥ അനിശ്ചിതത്വം നിലനിർത്തുന്നു; യേശുവിനെ ശപിച്ചു എന്ന ആശയം അനാവശ്യമായി ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കഥനശൈലി. ‘ആണയിടുക’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും ὀμνύειν എന്ന ശപഥാർഥം നിലനിർത്തുന്നതുമാണ്; അടിക്കുറിപ്പ് മുഖ്യവാചകത്തിലെ ചുരുക്കവും മൂലത്തിലെ അർഥസാധ്യതയും സമതുലിതമാക്കുന്നു.
