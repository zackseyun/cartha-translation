id: MAT.26.1
reference: Matthew 26:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς πάντας τοὺς λόγους τούτους, εἶπεν τοῖς μαθηταῖς αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/001.yaml
  text: And when Jesus had finished all these words[a], he said to his disciples,
translation:
  language: ml
  text: 'യേശു ഈ വചനങ്ങളെല്ലാം പറഞ്ഞുതീർന്നപ്പോൾ, തന്റെ ശിഷ്യന്മാരോടു പറഞ്ഞു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: …പ്പോൾ
  rationale: മത്തായിയുടെ സെമിറ്റിക് സ്വഭാവമുള്ള ആഖ്യാനസൂത്രത്തിന്റെ കാലസംബന്ധമായ പ്രവർത്തനം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു. ‘സംഭവിച്ചു’ എന്നു വേർതിരിച്ചു ചേർക്കുന്നത് മലയാളത്തിൽ അനാവശ്യമായ കാഠിന്യം സൃഷ്ടിക്കും.
- source_word: ἐτέλεσεν
  choice: പറഞ്ഞുതീർന്ന
  rationale: ക്രിയയുടെ ‘പൂർത്തിയാക്കുക/അവസാനിപ്പിക്കുക’ എന്ന അർഥവും λόγους എന്ന പൂരകവുമായുള്ള ബന്ധവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; മുഖ്യക്രിയയായ ‘പറഞ്ഞു’വിനു മുമ്പ് പ്രസംഗം പൂർത്തിയായതും വ്യക്തമാക്കുന്നു.
- source_word: πάντας τοὺς λόγους τούτους
  choice: ഈ വചനങ്ങളെല്ലാം
  rationale: λόγους എന്നതിന്റെ ‘വാക്കുകൾ/വചനങ്ങൾ’ എന്ന രൂപം നിലനിർത്തുകയും മത്തായിയിലെ പ്രസംഗസമാപന സൂത്രം പ്രതിഫലിപ്പിക്കുകയും ചെയ്യുന്നു. ‘കാര്യങ്ങൾ’ എന്നു വിവർത്തനം ചെയ്യുന്നത് അർഥം അനാവശ്യമായി വിശാലമാക്കും.
- source_word: εἶπεν
  choice: പറഞ്ഞു
  rationale: ആഖ്യാനത്തിൽ λέγω എന്ന ക്രിയയുടെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: തന്റെ ശിഷ്യന്മാരോടു
  rationale: αὐτοῦ എന്ന ഉടമസ്ഥസൂചന വ്യക്തമായി നിലനിർത്തുന്നു; μαθηταί എന്നതിന് സാധാരണ ബൈബിൾ മലയാളത്തിലെ ‘ശിഷ്യന്മാർ’ ഉപയോഗിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഗ്രീക്കിലെ ആഖ്യാനസൂത്രം പദാനുപദമായി കഠിനമാക്കാതെ അതിന്റെ കാലസൂചന നിലനിർത്തിയിരിക്കുന്നു. λόγους എന്ന പദത്തിന്റെ രൂപം ‘വചനങ്ങൾ’ വഴി സംരക്ഷിക്കുന്നു.
