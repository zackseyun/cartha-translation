id: MAT.26.23
reference: Matthew 26:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Ὁ ἐμβάψας μετ’ ἐμοῦ ⸂τὴν χεῖρα ἐν τῷ τρυβλίῳ⸃ οὗτός με παραδώσει·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/023.yaml
  text: He answered[b][a], “The one who dipped his hand with me in the bowl—this one will betray me.”
translation:
  language: ml
  text: 'അവൻ മറുപടി പറഞ്ഞു: “എന്നോടൊപ്പം കിണ്ണത്തിൽ[a] കൈ മുക്കിയവൻ—അവൻ തന്നെയാണ് എന്നെ ഒറ്റിക്കൊടുക്കും.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “പാത്രത്തിൽ.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “ഏല്പിച്ചുകൊടുക്കും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: മറുപടി പറഞ്ഞു
  rationale: പങ്കാളിക്രിയയും സമാപികാക്രിയയും ചേർന്ന ഈ പ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ ‘മറുപടി പറഞ്ഞു’ എന്ന് നൽകുന്നത് അർഥം കൃത്യമായി പകരുന്നു; രണ്ടു ക്രിയകളും യാന്ത്രികമായി ആവർത്തിക്കുന്നില്ല.
- source_word: ἐμβάψας
  choice: മുക്കിയവൻ
  rationale: തിരിച്ചറിയിക്കുന്ന, പൂർത്തിയായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന aorist participle-ന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: μετ’ ἐμοῦ
  choice: എന്നോടൊപ്പം
  rationale: അകമ്പടിയെയോ ഒരുമിച്ചുള്ള പ്രവൃത്തിയെയോ സൂചിപ്പിക്കുന്ന μετά + genitive-ന്റെ നേരായ മലയാളരൂപം.
- source_word: τὴν χεῖρα
  choice: കൈ
  rationale: ശരീരഭാഗത്തോടൊപ്പം ഗ്രീക്ക് ഉപയോഗിക്കുന്ന നിർദേശക ലേഖനത്തിന് മലയാളത്തിൽ ഉടമസ്ഥസർവനാമം നിർബന്ധമല്ല; ‘കൈ’ എന്ന് പറയുന്നത് സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: ἐν τῷ τρυβλίῳ
  choice: കിണ്ണത്തിൽ
  rationale: τρύβλιον ഭക്ഷണം വയ്ക്കുന്ന കിണ്ണത്തെയോ പാത്രത്തെയോ സൂചിപ്പിക്കുന്നു. ‘കിണ്ണം’ വ്യക്തമായ ആധുനിക പദമാണ്; വിശാലമായ ‘പാത്രം’ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: οὗτός
  choice: അവൻ തന്നെയാണ്
  rationale: ലളിതമായ സർവനാമത്തേക്കാൾ demonstrative-ന്റെ ഊന്നൽ ‘തന്നെയാണ്’ എന്ന രൂപം സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
- source_word: παραδώσει
  choice: ഒറ്റിക്കൊടുക്കുക
  rationale: യൂദാസ് യേശുവിനെ ശത്രുക്കൾക്ക് ഏല്പിക്കുന്ന വഞ്ചനാപരമായ പ്രവൃത്തിയാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്. കൂടുതൽ പൊതുവായ ‘ഏല്പിച്ചുകൊടുക്കുക’ എന്ന അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: യൂദാസിന്റെ പ്രവൃത്തിയുടെ സന്ദർഭത്തിൽ παραδίδωμι വിവർത്തനം ചെയ്യുന്നത്
  choice: ഒറ്റിക്കൊടുക്കുക
  alternative: ഏല്പിച്ചുകൊടുക്കുക
  rationale: ക്രിയയ്ക്ക് പൊതുവായി ‘കൈമാറുക/ഏല്പിച്ചുകൊടുക്കുക’ എന്നർഥമുണ്ടെങ്കിലും, ഇവിടെ ബന്ധപരവും കഥാപരവുമായ സന്ദർഭം വഞ്ചനയെ മുൻനിരയിൽ കൊണ്ടുവരുന്നു. ‘ഒറ്റിക്കൊടുക്കുക’ ആ സന്ദർഭാർഥം പകരുന്നു; കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നേരിട്ടുള്ള സംഭാഷണശൈലി. ‘അവൻ തന്നെയാണ്’ എന്നത് ഗ്രീക്ക് demonstrative-ന്റെ ഊന്നൽ നിലനിർത്തുന്നു; ദീർഘവിരാമം തിരിച്ചറിയൽവാക്യത്തിലെ ഊന്നൽ വ്യക്തമാക്കുന്നു.
