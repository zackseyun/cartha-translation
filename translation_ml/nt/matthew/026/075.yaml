revisions:
- from: 'അപ്പോൾ പത്രോസ് യേശു പറഞ്ഞ വാക്ക് ഓർത്തു: “കോഴി കൂവുന്നതിനുമുമ്പ് നീ എന്നെ മൂന്നുപ്രാവശ്യം തള്ളിപ്പറയും.” അവൻ പുറത്തേക്കു പോയി അതിദുഃഖത്തോടെ കരഞ്ഞു.'
  to: 'അപ്പോൾ പത്രോസ് യേശു പറഞ്ഞ വാക്ക് ഓർത്തു: “കോഴി കൂവുന്നതിനുമുമ്പ് നീ എന്നെ മൂന്നുപ്രാവശ്യം തള്ളിപ്പറയും.” അവൻ പുറത്തേക്കു പോയി അതിവേദനയോടെ കരഞ്ഞു.'
  rationale: A single lexical adjustment strengthens the rendering of πικρῶς from generalized intense sorrow to acute, bitter anguish. All other wording is retained because it faithfully and naturally represents the Greek text in modern standard Malayalam.
