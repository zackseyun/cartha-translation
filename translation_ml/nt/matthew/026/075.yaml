review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Peter's remembering Jesus' prior statement, the prediction of a threefold denial before rooster-crow, and Peter's departure outside. “തള്ളിപ്പറയും” is an appropriate contextual rendering of ἀπαρνήσῃ. However, “അതിദുഃഖത്തോടെ” primarily denotes great sadness and does not fully convey πικρῶς, the bitter, anguished quality of his weeping.
  naturalness: The Malayalam is clear, modern, and appropriately restrained. “അവൻ പുറത്തേക്കു പോയി” naturally represents ἐξελθὼν ἔξω. Replacing the final adverbial phrase with “അതിവേദനയോടെ” gives a more idiomatic and semantically closer expression of intense bitter weeping.
  terminology: “പത്രോസ്,” “യേശു,” “വാക്ക്,” and “തള്ളിപ്പറയും” are suitable modern-standard Malayalam choices. No title should be added to “യേശു,” since the Greek names Jesus alone. The Greek anarthrous expression concerning a rooster requires no Malayalam footnote, since Malayalam does not force the same definite/indefinite distinction.
  issues:
  - severity: low
    issue: “അതിദുഃഖത്തോടെ” weakens πικρῶς.
    rationale: The phrase means ‘with very great sadness,’ whereas πικρῶς specifies bitterly/with acute anguish. “അതിവേദനയോടെ” more closely retains the force without adding an interpretation such as repentance.
  revised_text: 'അപ്പോൾ പത്രോസ് യേശു പറഞ്ഞ വാക്ക് ഓർത്തു: “കോഴി കൂവുന്നതിനുമുമ്പ് നീ എന്നെ മൂന്നുപ്രാവശ്യം തള്ളിപ്പറയും.” അവൻ പുറത്തേക്കു പോയി അതിവേദനയോടെ കരഞ്ഞു.'
  revised_footnotes: []
