id: MAT.26.75
reference: Matthew 26:75
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐμνήσθη ὁ Πέτρος τοῦ ⸀ῥήματος Ἰησοῦ ⸀εἰρηκότος ὅτι Πρὶν ἀλέκτορα φωνῆσαι τρὶς ἀπαρνήσῃ με, καὶ ἐξελθὼν ἔξω ἔκλαυσεν πικρῶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/075.yaml
  text: 'And Peter remembered the word Jesus had spoken: “Before a rooster crows[a], you will deny me three times.” And he went outside and wept bitterly.'
translation:
  language: ml
  text: 'അപ്പോൾ പത്രോസ് യേശു പറഞ്ഞ വാക്ക് ഓർത്തു: “കോഴി കൂവുന്നതിനുമുമ്പ് നീ എന്നെ മൂന്നുപ്രാവശ്യം തള്ളിപ്പറയും.” അവൻ പുറത്തേക്കു പോയി അതിവേദനയോടെ കരഞ്ഞു.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμνήσθη
  choice: ഓർത്തു
  rationale: സംഭവവിവരണത്തിലെ പെട്ടെന്നുള്ള ഓർമവരവിനെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി അറിയിക്കുന്നു.
- source_word: ῥήματος
  choice: വാക്ക്
  rationale: യേശു മുമ്പ് പറഞ്ഞ ഒരു നിർദിഷ്ടമായ അരുളപ്പാടിനെയോ പ്രസ്താവനയെയോ സൂചിപ്പിക്കുന്ന ῥῆμα എന്ന പദത്തിന്റെ സാധാരണ മലയാളരൂപം.
- source_word: εἰρηκότος
  choice: പറഞ്ഞ
  rationale: യേശു മുമ്പ് ഉച്ചരിച്ച വാക്കാണെന്ന കാലബന്ധം മലയാളസന്ദർഭത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: Πρὶν ἀλέκτορα φωνῆσαι
  choice: കോഴി കൂവുന്നതിനുമുമ്പ്
  rationale: ഗ്രീക്കിലെ കാലസൂചക infinitival ഘടനയെ സ്വാഭാവിക മലയാള ഉപവാക്യമായി നൽകുന്നു; മലയാളത്തിൽ ഇവിടെ നിർദിഷ്ടതയോ അനിർദിഷ്ടതയോ പ്രത്യേകം അടയാളപ്പെടുത്തേണ്ടതില്ല.
- source_word: τρὶς
  choice: മൂന്നുപ്രാവശ്യം
  rationale: ആവർത്തനത്തിന്റെ എണ്ണം വ്യക്തമായി നൽകുന്ന സാധാരണ ആധുനിക മലയാളപ്രയോഗം.
- source_word: ἀπαρνήσῃ
  choice: തള്ളിപ്പറയും
  rationale: ബന്ധമോ പരിചയമോ നിഷേധിക്കുന്ന ഈ സന്ദർഭത്തിലെ ശക്തമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐξελθὼν ἔξω
  choice: പുറത്തേക്കു പോയി
  rationale: ഗ്രീക്കിലെ ചലനവും പുറത്തേക്കുള്ള വേർപാടും ആവർത്തനഭാരം കൂടാതെ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἔκλαυσεν πικρῶς
  choice: അതിദുഃഖത്തോടെ കരഞ്ഞു
  rationale: πικρῶς സൂചിപ്പിക്കുന്ന തീവ്രമായ ദുഃഖം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; പശ്ചാത്താപം എന്ന വ്യാഖ്യാനം നേരിട്ട് ചേർക്കുന്നില്ല.
theological_decisions:
- issue: യേശുവിനെ പേരുകൊണ്ട് മാത്രം പരാമർശിക്കൽ
  choice: യേശു
  alternative: കർത്താവായ യേശു
  rationale: മൂലപാഠത്തിൽ Ἰησοῦ എന്ന പേര് മാത്രമാണ്; ക്രിസ്തുശാസ്ത്രപരമായ ഒരു ബിരുദം വിവർത്തനത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി. പരിചിതമായ ബൈബിൾഭാഷയുടെ ഭാരം നിലനിർത്തുമ്പോഴും പഴഞ്ചൻ പ്രയോഗങ്ങൾ ഒഴിവാക്കി.
