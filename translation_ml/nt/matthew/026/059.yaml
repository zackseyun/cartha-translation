    reason: cultural_note
  - marker: b
    text: അഥവാ, ‘വ്യാജസാക്ഷ്യം.’ ഈ ഗ്രീക്ക് പദം നിയമസന്ദർഭത്തിൽ വ്യാജമായ സാക്ഷ്യമൊഴിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇവിടെ δέ ആഖ്യാനത്തിലെ മൃദുവായ ബന്ധകമാണ്; മലയാളത്തിൽ പ്രത്യേകമായി ‘എന്നാൽ’ എന്നോ ‘അപ്പോൾ’ എന്നോ ചേർത്താൽ ഇല്ലാത്ത വൈരുധ്യമോ കാലസൂചനയോ വരാം.
- source_word: ἀρχιερεῖς
  choice: മുഖ്യപുരോഹിതന്മാർ
  rationale: കർശന അർഥത്തിൽ ഒരേസമയം പല മഹാപുരോഹിതന്മാരെ സൂചിപ്പിക്കുന്നതല്ല; മുതിർന്ന പുരോഹിതനേതൃത്വത്തെ സൂചിപ്പിക്കുന്ന പതിവും കൃത്യവുമായ മലയാളപ്രയോഗം.
- source_word: συνέδριον ὅλον
  choice: ന്യായാധിപസംഘം മുഴുവനും
  rationale: യഹൂദരുടെ ഭരണ-ന്യായസഭയെ സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന വിധത്തിൽ പരിഭാഷപ്പെടുത്തുന്നു; ὅλον എന്നതിന്റെ സമഗ്രതയും നിലനിർത്തുന്നു.
- source_word: ἐζήτουν
  choice: അന്വേഷിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലരൂപം സൂചിപ്പിക്കുന്ന തുടർച്ചയായ ശ്രമം മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ψευδομαρτυρίαν
  choice: കള്ളസാക്ഷ്യം
  rationale: നിയമസന്ദർഭത്തിലെ വ്യാജമായ സാക്ഷിമൊഴി/സാക്ഷ്യം എന്ന ആശയം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു; പദത്തിന് ‘കള്ളസാക്ഷിമൊഴി’ എന്ന അർഥവും സാധ്യമാണ്.
- source_word: κατὰ τοῦ Ἰησοῦ
  choice: യേശുവിനെതിരായി
  rationale: κατά + genitive ഇവിടെ യേശുവിനെ ലക്ഷ്യമാക്കിയ ന്യായപരമായ വിരോധം സൂചിപ്പിക്കുന്നു.
- source_word: ὅπως
  choice: -വാൻവേണ്ടി
  rationale: ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന ഘടകം സ്വാഭാവിക മലയാളത്തിൽ ക്രിയയോടു ചേർത്ത് പ്രകടമാക്കുന്നു.
- source_word: θανατώσωσιν
  choice: വധിക്കാൻ
  rationale: ന്യായപരമായ പശ്ചാത്തലത്തിന് യോജിച്ച ഔപചാരികത നിലനിർത്തുന്നു; ‘കൊല്ലാൻ’ എന്നതിനെക്കാൾ judicial ഭാവം വ്യക്തമാണ്, എന്നാൽ വധശിക്ഷ നടപ്പാക്കുന്ന രീതി അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
theological_decisions:
- issue: നേതാക്കളുടെ ന്യായപരമായ ഉദ്ദേശ്യവും തുടർച്ചയായ ശ്രമവും
  choice: കള്ളസാക്ഷ്യം തുടർച്ചയായി അന്വേഷിച്ചതും അതിന്റെ ഉദ്ദേശ്യം യേശുവിനെ വധിക്കലായിരുന്നെന്നും നേരിട്ട് പ്രകടമാക്കി.
  alternative: ‘യേശുവിനെ വധിക്കാൻ കള്ളസാക്ഷ്യം തേടി’ എന്ന കൂടുതൽ സംക്ഷിപ്തമായ രൂപം.
  rationale: ἐζήτουν എന്ന അപൂർണഭൂതകാലവും ὅπως...θανατώσωσιν എന്ന ഉദ്ദേശ്യവാക്യവും ചേർന്ന് ആസൂത്രിതവും തുടരുന്നതുമായ ന്യായപരമായ നീക്കം ചിത്രീകരിക്കുന്നു; വ്യാഖ്യാനപരമായ അധികചേർക്കലില്ലാതെ അത് നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. നിയമസന്ദർഭം വ്യക്തമാക്കാൻ ‘ന്യായാധിപസംഘം’, ‘കള്ളസാക്ഷ്യം’, ‘വധിക്കാൻ’ എന്നീ പദങ്ങൾ ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും ബന്ധപ്പെട്ട പദങ്ങൾക്കു പിന്നാലെ മുഖ്യവാചകത്തിൽ നൽകിയിരിക്കുന്നു.
