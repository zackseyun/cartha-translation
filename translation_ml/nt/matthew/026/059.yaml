  yaml_path: translation/nt/matthew/026/059.yaml
  text: The chief priests and the whole council were seeking false testimony against Jesus so that they might put him to death[b][a],
translation:
  language: ml
  text: മുഖ്യപുരോഹിതന്മാരും മഹാസഭ മുഴുവനും[a] യേശുവിനെ വധിക്കാനായി അവനെതിരായ കള്ളസാക്ഷ്യം[b] അന്വേഷിച്ചുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
