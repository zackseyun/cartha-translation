source:
  edition: SBLGNT
  text: μετὰ μικρὸν δὲ προσελθόντες οἱ ἑστῶτες εἶπον τῷ Πέτρῳ· Ἀληθῶς καὶ σὺ ἐξ αὐτῶν εἶ, καὶ γὰρ ἡ λαλιά σου δῆλόν σε ποιεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/073.yaml
  text: After a little while[a], those standing there came up and said to Peter, “Surely you also are one of them, for even your accent makes you evident.”
translation:
  language: ml
  text: 'അല്പസമയം കഴിഞ്ഞപ്പോൾ, അവിടെ നിന്നിരുന്നവർ പത്രോസിന്റെ അടുത്തുവന്ന് പറഞ്ഞു: “തീർച്ചയായും നീയും അവരിൽ ഒരുവനാണ്; നിന്റെ സംസാരരീതി പോലും നിന്നെ തിരിച്ചറിയിക്കുന്നു.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്റെ ഉച്ചാരണം നിന്നെ കാട്ടിക്കൊടുക്കുന്നു.” ഗ്രീക്കിലെ λαλιά എന്ന പദത്തിന് സംസാരം, സംസാരരീതി, അല്ലെങ്കിൽ ഉച്ചാരണം എന്നർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ μικρὸν
  choice: അല്പസമയം കഴിഞ്ഞപ്പോൾ
  rationale: ഹ്രസ്വമായ ഒരു ഇടവേളയ്ക്കുശേഷം എന്ന കാലസൂചന സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: δὲ
  choice: —
  rationale: ഇവിടെ കഥ മുന്നോട്ടുകൊണ്ടുപോകുന്ന മൃദുവായ ബന്ധകമാണ്; മലയാളത്തിൽ പ്രത്യേകം പദമായി നൽകാതെ വാക്യക്രമത്തിലൂടെ ബന്ധം വ്യക്തമാകുന്നു.
- source_word: προσελθόντες
  choice: അടുത്തുവന്ന്
  rationale: പത്രോസിന്റെ സമീപത്തേക്കുള്ള ചലനം സൂചിപ്പിക്കുന്ന പങ്കാളിക്രിയയെ സ്വാഭാവികമായി പകർത്തുന്നു.
- source_word: οἱ ἑστῶτες
  choice: അവിടെ നിന്നിരുന്നവർ
  rationale: ‘നിന്നിരുന്നവർ’ എന്ന പങ്കാളിക്രിയാഭാവം നിലനിർത്തുകയും സമീപത്തുണ്ടായിരുന്ന ആളുകളെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: Ἀληθῶς
  choice: തീർച്ചയായും
  rationale: ആത്മവിശ്വാസത്തോടെയുള്ള ഉറച്ച പ്രസ്താവനയുടെ ഭാവം സംഭാഷണയോഗ്യമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: καὶ σὺ
  choice: നീയും
  rationale: പത്രോസും ആ കൂട്ടത്തിൽ ഉൾപ്പെടുന്നു എന്ന ഊന്നൽ ചുരുക്കമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: ἐξ αὐτῶν
  choice: അവരിൽ ഒരുവൻ
  rationale: ഒരു കൂട്ടത്തിലെ അംഗത്വം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളസമാനം.
- source_word: καὶ γὰρ
  choice: തന്നെയും
  rationale: γάρ നൽകുന്ന കാരണബന്ധം അർധവിരാമത്തിലൂടെ വ്യക്തമാകുന്നു; καίയുടെ ഊന്നൽ ‘തന്നെയും’ എന്നതിലൂടെ സൂക്ഷിക്കുന്നു.
- source_word: ἡ λαλιά σου
  choice: നിന്റെ സംസാരരീതി
  rationale: λαλιάയ്ക്ക് സംസാരം, സംസാരശൈലി, ഉച്ചാരണം എന്നീ അർത്ഥസാധ്യതകളുണ്ട്. ‘സംസാരരീതി’ അടിസ്ഥാനാർഥവും സന്ദർഭത്തിലെ തിരിച്ചറിയൽശേഷിയും നിലനിർത്തുന്നു; ‘ഉച്ചാരണം’ എന്ന കൂടുതൽ നിർദിഷ്ട വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: δῆλόν σε ποιεῖ
  choice: നിന്നെ തിരിച്ചറിയിക്കുന്നു
  rationale: അക്ഷരാർഥത്തിൽ ‘നിന്നെ പ്രകടമാക്കുന്നു’ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; കുറ്റാരോപണസന്ദർഭത്തിലെ ‘ഒറ്റിക്കൊടുക്കുന്നു’ എന്ന കൂടുതൽ പ്രയോഗാത്മക സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. സംഭാഷണം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നിൽക്കുന്നു; λαλιάയുടെ യഥാർഥ അർത്ഥവ്യാപ്തി മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചിട്ടുണ്ട്.
