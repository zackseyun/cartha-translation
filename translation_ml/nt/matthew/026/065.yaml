id: MAT.26.65
reference: Matthew 26:65
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τότε ὁ ἀρχιερεὺς διέρρηξεν τὰ ἱμάτια αὐτοῦ ⸀λέγων· Ἐβλασφήμησεν· τί ἔτι χρείαν ἔχομεν μαρτύρων; ἴδε νῦν ἠκούσατε τὴν ⸀βλασφημίαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/065.yaml
  text: Then the high priest tore his garments[a], saying, “He has blasphemed! What further need do we have of witnesses? See[b], now you have heard the blasphemy.”
translation:
  language: ml
  text: 'അപ്പോൾ മഹാപുരോഹിതൻ തന്റെ വസ്ത്രങ്ങൾ കീറിക്കൊണ്ട്[a] പറഞ്ഞു: “ഇവൻ ദൈവദൂഷണം പറഞ്ഞിരിക്കുന്നു! ഇനി നമുക്ക് സാക്ഷികളുടെ ആവശ്യം എന്താണ്? ഇതാ, ഇപ്പോൾ നിങ്ങൾ ആ ദൈവദൂഷണം കേട്ടല്ലോ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: വസ്ത്രങ്ങൾ കീറുന്നത് ഞെട്ടൽ, ദുഃഖം, അല്ലെങ്കിൽ കടുത്ത രോഷം പരസ്യമായി പ്രകടിപ്പിക്കുന്ന ഒരു അടയാളമായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: τότε
  choice: അപ്പോൾ
  rationale: കഥനത്തിലെ അടുത്ത സംഭവത്തെ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്ന കാലസൂചകം.
- source_word: ὁ ἀρχιερεὺς
  choice: മഹാപുരോഹിതൻ
  rationale: യഹൂദ മതനേതൃത്വത്തിലെ ഏക ഔദ്യോഗിക സ്ഥാനധാരിയെ സൂചിപ്പിക്കുന്ന പതിവും കൃത്യവുമായ മലയാളപദം.
- source_word: διέρρηξεν τὰ ἱμάτια αὐτοῦ
  choice: തന്റെ വസ്ത്രങ്ങൾ കീറിക്കൊണ്ട്
  rationale: വസ്ത്രങ്ങൾ കീറിയ പ്രവർത്തിയും അതോടൊപ്പം പറഞ്ഞ വാക്കുകളും സ്വാഭാവിക മലയാളത്തിൽ ബന്ധിപ്പിക്കുന്നു; ἱμάτιαയെ പ്രത്യേക പുരോഹിതവസ്ത്രങ്ങളായി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: Ἐβλασφήμησεν
  choice: ഇവൻ ദൈവദൂഷണം പറഞ്ഞിരിക്കുന്നു
  rationale: ഉടൻ ഉന്നയിക്കുന്ന മതനിയമപരമായ കുറ്റാരോപണത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; ഇത് മഹാപുരോഹിതന്റെ വിലയിരുത്തലാണെന്നത് ഉദ്ധരണിസന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: τί ἔτι χρείαν ἔχομεν μαρτύρων;
  choice: ഇനി നമുക്ക് സാക്ഷികളെക്കൊണ്ട് എന്ത് ആവശ്യം?
  rationale: χρείαν ἔχειν എന്ന പ്രയോഗവും ἔτιയുടെ ‘ഇനി/കൂടുതൽ’ എന്ന ആശയവും അടുത്തായി നിലനിർത്തുന്ന ഔപചാരികവും മനസ്സിലാകുന്നതുമായ ചോദ്യം.
- source_word: ἴδε νῦν ἠκούσατε
  choice: ഇതാ, ഇപ്പോൾ നിങ്ങൾ ... കേട്ടല്ലോ
  rationale: ἴδεയുടെ ശ്രദ്ധക്ഷണവും νῦνയുടെ ഉടൻ സംഭവിച്ചുവെന്ന ഊന്നലും, കേൾവിക്കാർ നേരിട്ട് കേട്ടുവെന്ന വാദശക്തിയും മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: τὴν βλασφημίαν
  choice: ആ ദൈവദൂഷണം
  rationale: നിശ്ചിത ആർട്ടിക്കിളിന്റെ സൂചനയും മഹാപുരോഹിതൻ യേശുവിന്റെ വാക്കുകൾക്ക് നൽകിയ മതനിയമപരമായ വിശേഷണവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: βλασφημέω / βλασφημία എന്ന കുറ്റാരോപണത്തിന്റെ പരിഭാഷ
  choice: ‘ദൈവദൂഷണം പറഞ്ഞിരിക്കുന്നു’ / ‘ആ ദൈവദൂഷണം’
  alternative: ‘ദൈവത്തെ നിന്ദിച്ചിരിക്കുന്നു’ / ‘ആ നിന്ദ’
  rationale: മതനിയമപരവും ദൈവശാസ്ത്രപരവുമായ കുറ്റാരോപണത്തിന്റെ സാങ്കേതിക ഭാരം ‘ദൈവദൂഷണം’ സംരക്ഷിക്കുന്നു. ഇത് മഹാപുരോഹിതന്റെ ആരോപണമാണെന്നും വിവരണകർത്താവിന്റെ വിധിയല്ലെന്നും നേരിട്ടുള്ള ഉദ്ധരണം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ഇംഗ്ലീഷ് consultation layer-ലുള്ള അടിക്കുറിപ്പുകളുടെ മാർക്കറും ഉള്ളടക്കവും തമ്മിൽ പൊരുത്തക്കേട് ഉണ്ടായതിനാൽ, വസ്ത്രങ്ങൾ കീറുന്നതുമായി ബന്ധപ്പെട്ട യഥാർത്ഥ സാംസ്കാരിക കുറിപ്പ് മാത്രം [a] ആയി നൽകിയിരിക്കുന്നു; ‘സാക്ഷികളെക്കൊണ്ട് എന്ത് ആവശ്യം?’ എന്നത് മുഖ്യവാചകത്തിൽ തന്നെയുള്ള പരിഭാഷയായതിനാൽ അതിനെ lexical alternative അടിക്കുറിപ്പായി ആവർത്തിച്ചിട്ടില്ല.
