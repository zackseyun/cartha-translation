  - severity: low
    issue: The spelling/form “മുഖത്തു” is less natural in modern standard Malayalam prose.
    rationale: “മുഖത്ത്” is the usual contemporary locative form and accurately conveys the direct spitting described by εἰς τὸ πρόσωπον.
