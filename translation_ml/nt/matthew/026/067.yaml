  verdict: revise
  source_fidelity: 'The draft preserves the sequence and all three distinct actions in the Greek: direct spitting at Jesus’ face, fist-blows (ἐκολάφισαν), and blows by others (ἐράπισαν). The final verb can reasonably remain general in the main text, with the open-hand/slap sense retained in a footnote.'
  naturalness: “മുഷ്ടികൊണ്ട് ഇടിക്കുകയും ചെയ്തു” is understandable but stylistically cumbersome. “മുഷ്ടികൊണ്ട് ഇടിച്ചു” is the more natural modern Malayalam expression. “മുഖത്ത്” is also more idiomatic than “മുഖത്തു” in contemporary standard prose.
  terminology: “മറ്റുചിലർ” naturally represents the substantival οἱ δέ as a distinct group without overstating a contrast. The footnote appropriately records that ῥαπίζω often denotes a slap or open-hand blow; “ചെകിട്ടത്തടിച്ചു” is a natural Malayalam alternative.
  issues:
