reference: Matthew 26:67
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τότε ἐνέπτυσαν εἰς τὸ πρόσωπον αὐτοῦ καὶ ἐκολάφισαν αὐτόν, οἱ δὲ ἐράπισαν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/067.yaml
  text: Then they spat in his face and struck him with their fists[c][b][a], and others slapped him.
translation:
  language: ml
  text: അപ്പോൾ അവർ അവന്റെ മുഖത്ത് തുപ്പുകയും അവനെ മുഷ്ടികൊണ്ട് ഇടിക്കുകയും ചെയ്തു; മറ്റുചിലർ അവനെ അടിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവനെ ചെകിട്ടത്തടിച്ചു’ അഥവാ ‘തുറന്ന കൈകൊണ്ട് അവനെ അടിച്ചു’ എന്നും പരിഭാഷപ്പെടുത്താം. അവസാനത്തെ ഗ്രീക്ക് ക്രിയ പലപ്പോഴും കൈപ്പത്തികൊണ്ടുള്ള അടിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: അപ്പോൾ
  rationale: സംഭവക്രമത്തിലെ അടുത്ത പ്രവൃത്തി സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സംക്ഷിപ്തവുമായ കാലസൂചകം.
- source_word: ἐνέπτυσαν εἰς τὸ πρόσωπον αὐτοῦ
  choice: അവന്റെ മുഖത്തു തുപ്പുകയും
  rationale: മുഖത്തെ ലക്ഷ്യമാക്കി നേരിട്ട് തുപ്പിയ അപമാനകരമായ പ്രവൃത്തി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐκολάφισαν αὐτόν
  choice: അവനെ മുഷ്ടികൊണ്ട് ഇടിക്കുകയും ചെയ്തു
  rationale: κολαφίζω മുഷ്ടികൊണ്ടുള്ള പ്രഹരത്തെ സൂചിപ്പിക്കുന്നു; പൊതുവായ ‘അടിച്ചു’ എന്നതിനെക്കാൾ പ്രവൃത്തിയുടെ രീതി സംരക്ഷിക്കുന്നു.
- source_word: οἱ δὲ ἐράπισαν
  choice: മറ്റുള്ളവർ അവനെ അടിച്ചു
  rationale: οἱ substantival ആയി ‘മറ്റുള്ളവർ’ എന്നും ῥαπίζω കൈകൊണ്ടുള്ള അടിയെന്നും സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ വ്യക്തമായ കർമം മലയാളത്തിൽ ചേർത്തിരിക്കുന്നു.
- source_word: δέ
  choice: ;
  rationale: ശക്തമായ വൈരുധ്യമല്ല, മറ്റൊരു കൂട്ടത്തിന്റെ പ്രവൃത്തിയിലേക്കുള്ള നേരിയ മാറ്റമാണ്; അർദ്ധവിരാമം അത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: യേശുവിനോടു ചെയ്ത അപമാനവും ശാരീരിക പീഡനവും എത്രത്തോളം വ്യക്തമായി പറയണം
  choice: തുപ്പൽ, മുഷ്ടികൊണ്ടുള്ള പ്രഹരം, മറ്റുള്ളവരുടെ അടി എന്നിവ മൂർത്തമായി വിവർത്തനം ചെയ്യുക
  alternative: ‘അവർ അവനെ ഉപദ്രവിച്ചു’ എന്നതുപോലുള്ള പൊതുവായ പ്രയോഗം ഉപയോഗിക്കുക
  rationale: മൂലപാഠം വ്യത്യസ്തമായ അപമാന-പ്രഹര പ്രവൃത്തികളെ വ്യക്തമായി പറയുന്നു; അവയെ പൊതുവാക്കുന്നത് വാക്യത്തിന്റെ ശക്തി കുറയ്ക്കും.
- issue: ῥαπίζω എന്ന അവസാന ക്രിയയുടെ കൃത്യമായ പ്രഹരരീതി
  choice: പ്രധാനപാഠത്തിൽ ‘അടിച്ചു’ എന്ന് നൽകി കൈപ്പത്തികൊണ്ടുള്ള അടിയെന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുക
  alternative: പ്രധാനപാഠത്തിൽത്തന്നെ ‘കൈപ്പത്തികൊണ്ട് അടിച്ചു’ എന്നു വ്യക്തമാക്കുക
  rationale: ഈ ക്രിയ പലപ്പോഴും ചെകിട്ടത്തടി/തുറന്ന കൈകൊണ്ടുള്ള പ്രഹരം സൂചിപ്പിച്ചാലും, പൊതുവായി അടിക്കുക എന്ന അർഥവും വഹിക്കാം; അതിനാൽ യഥാർഥമായ അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘മുഷ്ടികൊണ്ട് ഇടിച്ചു’ എന്ന പ്രയോഗം ആദ്യ പ്രഹരത്തിന്റെ പ്രത്യേക രീതി നിലനിർത്തുന്നു; അവസാന ക്രിയയിലെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
