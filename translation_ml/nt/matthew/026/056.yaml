  rationale: ἵναയും subjunctive passive രൂപവും നൽകുന്ന ഉദ്ദേശ്യ-ഫല ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു; ദൈവിക അനിവാര്യത അതിരുകടന്ന് ചേർക്കുന്നില്ല.
- source_word: αἱ γραφαὶ τῶν προφητῶν
  choice: പ്രവാചകന്മാരുടെ തിരുവെഴുത്തുകൾ
  rationale: വിശുദ്ധ ലിഖിതങ്ങളെ സൂചിപ്പിക്കുന്ന γραφαίയ്ക്ക് ‘തിരുവെഴുത്തുകൾ’ യോജിക്കുന്നു; genitive ബന്ധം വിശദീകരിച്ചു കൂട്ടാതെ നിലനിർത്തുന്നു.
- source_word: τότε
  choice: അപ്പോൾ
  rationale: തുടർന്നുള്ള സംഭവക്രമം സ്വാഭാവികമായി അടയാളപ്പെടുത്തുന്നു.
- source_word: οἱ μαθηταὶ πάντες
  choice: ശിഷ്യന്മാർ എല്ലാവരും
  rationale: πάντες നൽകുന്ന സമ്പൂർണതയ്ക്കുള്ള ഊന്നൽ നിലനിർത്തുന്നു; ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത ‘അവന്റെ’ ചേർക്കുന്നില്ല.
