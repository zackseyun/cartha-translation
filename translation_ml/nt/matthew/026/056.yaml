theological_decisions:
- issue: പ്രവാചക തിരുവെഴുത്തുകളുടെ നിവൃത്തി
  choice: ‘പ്രവാചകന്മാരുടെ തിരുവെഴുത്തുകൾ നിവൃത്തിയാകേണ്ടതിനാണ്’ എന്ന വ്യക്തമായ നിവൃത്തി-ഭാഷ നിലനിർത്തി.
  alternative: ‘പ്രവാചകന്മാർ എഴുതിയത് സത്യമായിത്തീരേണ്ടതിന്’
  rationale: മത്തായിയുടെ നിവൃത്തി പ്രമേയവും γραφαίയുടെ തിരുവെഴുത്ത് സ്വഭാവവും പാഠത്തിൽ വ്യക്തമാണ്; വ്യാഖ്യാനപരമായ പരാവർത്തനം ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘തിരുവെഴുത്തുകൾ’, ‘നിവൃത്തിയാകുക’ എന്നീ പരിചിത ബൈബിൾ പദങ്ങൾ ദൈവശാസ്ത്രപരമായ കൃത്യതയ്ക്കായി നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നം അതു വിശദീകരിക്കുന്ന ‘വിട്ട് ഓടിപ്പോയി’ എന്ന വാക്യഘടകത്തിനു ശേഷം ചേർത്തു.
