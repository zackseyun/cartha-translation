    text: അഥവാ ‘അവനെ ഉപേക്ഷിച്ച്’; സന്ദർഭത്തിൽ ἀφέντες എന്ന പദത്തിന് ഉപേക്ഷിച്ചുപോകുക എന്ന ശക്തമായ അർഥവും ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ ὅλον
  choice: എന്നാൽ ഇതെല്ലാം
  rationale: മുൻപു വിവരിച്ച മുഴുവൻ സംഭവത്തെയും സൂചിപ്പിക്കുന്ന പ്രയോഗം; δέയുടെ മൃദുവായ വിരുദ്ധ/ബന്ധക ഭാവം ‘എന്നാൽ’ നിലനിർത്തുന്നു.
- source_word: γέγονεν
