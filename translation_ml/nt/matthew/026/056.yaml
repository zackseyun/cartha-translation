  text: എന്നാൽ ഇതെല്ലാം സംഭവിച്ചിരിക്കുന്നത് പ്രവാചകന്മാരുടെ തിരുവെഴുത്തുകൾ നിവൃത്തിയാകേണ്ടതിനാണ്. അപ്പോൾ ശിഷ്യന്മാർ എല്ലാവരും അവനെ വിട്ട് ഓടിപ്പോയി.[a]
  philosophy: optimal-equivalence
