  text: When evening came[a], he reclined at the table with the twelve disciples.
translation:
  language: ml
  text: സന്ധ്യയായപ്പോൾ അവൻ പന്ത്രണ്ട് ശിഷ്യന്മാരോടൊപ്പം[a] ഭക്ഷണത്തിനായി ചാരിക്കിടന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘പന്ത്രണ്ട് ശിഷ്യന്മാരോടൊപ്പം’ എന്നതിനുപകരം ‘പന്ത്രണ്ടുപേരോടൊപ്പം’ എന്നു മാത്രമാണ്.
    reason: textual_variant
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: സന്ധ്യയായപ്പോൾ
  rationale: ഈ genitive absolute സമയസാഹചര്യം സൂചിപ്പിക്കുന്നു. ‘സന്ധ്യയായപ്പോൾ’ എന്നത് സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അതിന്റെ കാലാർഥം കൃത്യമായി നൽകുന്നു.
- source_word: ἀνέκειτο
  choice: ഭക്ഷണത്തിനിരുന്നു
  rationale: പുരാതന വിരുന്നുകളിൽ ഭക്ഷണം കഴിക്കാൻ ചാരിക്കിടക്കുന്ന പതിവിനെയാണ് ക്രിയ സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ‘ചാരിക്കിടന്നു’ എന്നു അക്ഷരാർഥമായി പറഞ്ഞാൽ തെറ്റിദ്ധാരണയുണ്ടാകാം; ‘ഭക്ഷണത്തിനിരുന്നു’ ഭക്ഷണസന്ദർഭം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: μετὰ
  choice: ഒപ്പം
  rationale: Genitive-നോടുകൂടിയ μετά കൂട്ടായ്മയെ സൂചിപ്പിക്കുന്നു; ‘ഒപ്പം’ അതിന്റെ ലളിതവും കൃത്യവുമായ മലയാളരൂപമാണ്.
- source_word: τῶν δώδεκα μαθητῶν
  choice: പന്ത്രണ്ട് ശിഷ്യന്മാർ
  rationale: SBLGNT മുഖ്യപാഠത്തിലുള്ള μαθητῶν വിവർത്തനം ചെയ്യുന്നു. സുവിശേഷസന്ദർഭത്തിൽ μαθητής എന്നതിന് സ്ഥാപിതവും കൃത്യവുമായ പദം ‘ശിഷ്യൻ’ ആണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. പുരാതന ഭക്ഷണരീതിയുടെ ദേഹഭാവം നിർബന്ധമായി അനുകരിക്കാതെ, ἀνέκειτο എന്നതിന്റെ ഭക്ഷണസന്ദർഭത്തിലുള്ള ആശയം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകി. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട പാഠഭാഗത്തിനുശേഷം ചേർത്തിരിക്കുന്നു.
