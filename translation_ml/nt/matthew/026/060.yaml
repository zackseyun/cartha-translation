  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ οὐχ εὗρον ⸂πολλῶν προσελθόντων ψευδομαρτύρων. ὕστερον δὲ προσελθόντες δύο⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/060.yaml
  text: and they did not find any[a], though many false witnesses had come forward. But later two came forward
translation:
  language: ml
  text: പല കള്ളസാക്ഷികൾ മുന്നോട്ടുവന്നിട്ടും അവർ ഒന്നും കണ്ടെത്തിയില്ല[a]. എന്നാൽ പിന്നീട് രണ്ടുപേർ മുന്നോട്ടുവന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ‘കണ്ടെത്തിയില്ല’ എന്ന ക്രിയയുടെ കർമം വ്യക്തമാക്കിയിട്ടില്ല. സന്ദർഭത്തിൽ അവർ യേശുവിനെതിരെ അന്വേഷിച്ചുകൊണ്ടിരുന്ന സാക്ഷ്യമോ കുറ്റാരോപണമോ ആണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ εὗρον
  choice: അവർ ഒന്നും കണ്ടെത്തിയില്ല
  rationale: εὗρον എന്ന ക്രിയയുടെ കർമം ഗ്രീക്കിൽ വ്യക്തമാക്കിയിട്ടില്ല; മുൻവാക്യത്തിലെ യേശുവിനെതിരായ സാക്ഷ്യമോ കുറ്റാരോപണമോ ആണ് സന്ദർഭത്തിൽ സൂചിതം. കർമത്തെ നിർവചിക്കാതെ ‘ഒന്നും’ എന്നു പറയുന്നത് ഈ അന്തർലീനത നിലനിർത്തുന്നു.
- source_word: πολλῶν προσελθόντων ψευδομαρτύρων
  choice: പല കള്ളസാക്ഷികൾ മുന്നോട്ടുവന്നിട്ടും
  rationale: 'ജനിറ്റീവ് അബ്സല്യൂട്ട് ഇവിടെ concessive അർഥം നൽകുന്നു: അനേകം വ്യാജസാക്ഷികൾ ഹാജരായിട്ടും ആവശ്യമായത് കണ്ടെത്താനായില്ല. നിയമപരമായ പശ്ചാത്തലത്തിൽ ψευδομάρτυρες എന്നതിന് ‘കള്ളസാക്ഷികൾ’ സ്വാഭാവികവും കൃത്യവുമാണ്.'
- source_word: ὕστερον δὲ
  choice: എന്നാൽ പിന്നീട്
  rationale: ὕστερον സമയത്തിലെ തുടർച്ചയും δέ നേരിയ വിരുദ്ധതയോടെയുള്ള ആഖ്യാനമാറ്റവും സൂചിപ്പിക്കുന്നു.
- source_word: προσελθόντες δύο
  choice: രണ്ടുപേർ മുന്നോട്ടുവന്നു
  rationale: വിചാരണാസന്ദർഭത്തിൽ προσέρχομαι എന്നത് കേവലം അടുത്തുവരുക എന്നതിലുപരി സാക്ഷ്യം പറയാൻ ‘മുന്നോട്ടുവരുക’ എന്ന ആശയം നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. വിചാരണയുടെ നിയമപരമായ പശ്ചാത്തലം വ്യക്തമാക്കാൻ ‘കള്ളസാക്ഷികൾ’, ‘മുന്നോട്ടുവന്നു’ എന്നീ പ്രയോഗങ്ങൾ തിരഞ്ഞെടുത്തു; ഗ്രീക്കിലെ അന്തർലീന കർമം അടിക്കുറിപ്പിലൂടെ തുറന്നുവെച്ചു.
