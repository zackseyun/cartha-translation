    issue: Footnote alternative narrows the implicit object to people.
    rationale: “അവർ ആരെയും കണ്ടെത്തിയില്ല” means ‘they found no one,’ which is misleading in this immediate context because two witnesses subsequently came forward. The Greek leaves the object unstated; the contextual referent is the testimony or charge being sought.
