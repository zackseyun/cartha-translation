base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/057.yaml
  text: Those who had seized Jesus led him away to Caiaphas the high priest[a], where the scribes and the elders had gathered.
translation:
  language: ml
  text: യേശുവിനെ പിടികൂടിയവർ അവനെ മഹാപുരോഹിതനായ കയ്യഫാവിന്റെ അടുക്കലേക്കു കൊണ്ടുപോയി. അവിടെ ശാസ്ത്രിമാരും മൂപ്പന്മാരും കൂടിവന്നിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കൂടിവന്നിരുന്നു” എന്നതിന് “കൂട്ടിച്ചേർക്കപ്പെട്ടിരുന്നു” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് ക്രിയാരൂപം ഈ സന്ദർഭത്തിൽ കർമണിപ്രയോഗമായോ അകർമകമായ കൂടിച്ചേരലായോ മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ δὲ κρατήσαντες
  choice: യേശുവിനെ പിടികൂടിയവർ
  rationale: ലഘുവായ ആഖ്യാനബന്ധകമായ δέ മലയാളത്തിൽ പ്രത്യേകം പദമായി ചേർക്കാതെ സ്വാഭാവികമായ ആഖ്യാനതുടർച്ചയിലൂടെ പ്രകടമാക്കുന്നു. ആർട്ടിക്കിളോടുകൂടിയ കൃദ്യന്തം ‘പിടികൂടിയവർ’ എന്ന നാമവാക്യമായി നൽകിയിരിക്കുന്നു; κρατέω എന്നതിലെ ബലമായി കൈവശപ്പെടുത്തുന്ന അർഥവും ഇത് നിലനിർത്തുന്നു.
- source_word: ἀπήγαγον
  choice: കൊണ്ടുപോയി
  rationale: കാവലിൽ പിടിച്ച ഒരാളെ അവിടെനിന്ന് മറ്റൊരിടത്തേക്കു നയിച്ചുകൊണ്ടുപോകുന്നതാണ് സന്ദർഭം. ‘കൊണ്ടുപോയി’ സ്വാഭാവികവും മൂലത്തിലെ സഞ്ചാരദിശ വ്യക്തമാക്കുന്നതുമാണ്.
- source_word: πρὸς Καϊάφαν τὸν ἀρχιερέα
  choice: മഹാപുരോഹിതനായ കയ്യഫാവിന്റെ അടുക്കലേക്കു
  rationale: πρός ഇവിടെ ഒരു വ്യക്തിയുടെ അടുക്കലേക്കുള്ള നീക്കം സൂചിപ്പിക്കുന്നു. സ്ഥലമോ വീടോ മൂലത്തിൽ വ്യക്തമല്ലാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല. ἀρχιερεύς എന്ന ഔദ്യോഗിക പദവിക്ക് ‘മഹാപുരോഹിതൻ’ ഉപയോഗിച്ചു.
- source_word: οἱ γραμματεῖς
  choice: ശാസ്ത്രിമാർ
  rationale: സുവിശേഷങ്ങളിലെ യഹൂദ മതനിയമപണ്ഡിതരെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും സംക്ഷിപ്തവുമായ മലയാളപദമാണിത്; വിശദീകരണപരമായ അധികവിവരം ചേർക്കുന്നില്ല.
- source_word: οἱ πρεσβύτεροι
  choice: മൂപ്പന്മാർ
  rationale: ഈ സന്ദർഭത്തിലെ അംഗീകൃത യഹൂദ നേതാക്കളെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗതവും കൃത്യവുമായ മലയാളപ്രയോഗം.
- source_word: συνήχθησαν
  choice: കൂടിവന്നിരുന്നു
  rationale: യേശുവിനെ അവിടെ കൊണ്ടുവന്നപ്പോഴേക്കും അവർ കൂടിയിരുന്നതായി ആഖ്യാനക്രമം സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിലെ രൂപം കർമണിയായും സന്ദർഭത്തിൽ അകർമകമായ കൂടിച്ചേരലായും ഗ്രഹിക്കാവുന്നതിനാൽ പ്രധാനപാഠത്തിൽ സ്വാഭാവികമായ അകർമകപ്രയോഗം നൽകി, മറ്റുസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
