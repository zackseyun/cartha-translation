  to: 'പിന്നെ അവൻ ശിഷ്യന്മാരുടെ അടുക്കൽ വന്ന് അവരോടു പറയുന്നു: “ഇനി ഉറങ്ങി വിശ്രമിച്ചുകൊള്ളുക.[a] ഇതാ, സമയം അടുത്തെത്തിയിരിക്കുന്നു,[b] മനുഷ്യപുത്രൻ പാപികളുടെ കൈകളിൽ ഏൽപ്പിക്കപ്പെടുന്നു.[c]”'
  rationale: 'Only “സമയം അടുത്തിരിക്കുന്നു” has been changed to “സമയം അടുത്തെത്തിയിരിക്കുന്നു” to reflect the perfect ἤγγικεν more fully: the hour has drawn near and now stands imminent. The main text continues to preserve the ambiguity and likely irony of the preceding sleep/rest statement, and it retains the nonrestrictive rendering of παραδίδοται.'
