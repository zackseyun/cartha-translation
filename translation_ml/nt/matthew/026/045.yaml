id: MAT.26.45
reference: Matthew 26:45
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τότε ἔρχεται πρὸς τοὺς ⸀μαθητὰς καὶ λέγει αὐτοῖς· Καθεύδετε ⸀τὸ λοιπὸν καὶ ἀναπαύεσθε· ἰδοὺ ἤγγικεν ἡ ὥρα καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται εἰς χεῖρας ἁμαρτωλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/045.yaml
  text: Then he comes to the disciples and says to them[a], “Sleep on now and take your rest. Look, the hour has drawn near[c][b], and the Son of Man is being handed over into the hands of sinners.”
translation:
  language: ml
  text: 'പിന്നെ അവൻ ശിഷ്യന്മാരുടെ അടുക്കൽ വന്ന് അവരോടു പറയുന്നു: “ഇനി ഉറങ്ങി വിശ്രമിച്ചുകൊള്ളുക.[a] ഇതാ, സമയം അടുത്തെത്തിയിരിക്കുന്നു,[b] മനുഷ്യപുത്രൻ പാപികളുടെ കൈകളിൽ ഏൽപ്പിക്കപ്പെടുന്നു.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങൾ ഇപ്പോഴും ഉറങ്ങി വിശ്രമിക്കുകയാണോ?” ഗ്രീക്ക് വാക്യം ഒരു അലങ്കാരചോദ്യമായും മനസ്സിലാക്കാം; മുഖ്യപാഠം അതിലെ സാധ്യതയുള്ള പരിഹാസവും അർത്ഥസന്ദിഗ്ധതയും നിലനിർത്തുന്നു.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, “സമയം എത്തിയിരിക്കുന്നു” അല്ലെങ്കിൽ “സമയം സമീപിച്ചിരിക്കുന്നു.”
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “ഒറ്റിക്കൊടുക്കപ്പെടുന്നു.” ഗ്രീക്ക് പദത്തിന് കൂടുതൽ വിശാലമായി “കൈമാറപ്പെടുന്നു” അല്ലെങ്കിൽ “ഏൽപ്പിക്കപ്പെടുന്നു” എന്നും അർത്ഥമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: പിന്നെ
  rationale: സംഭവക്രമത്തിലെ അടുത്ത ഘട്ടം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἔρχεται ... καὶ λέγει
  choice: വന്ന് ... പറയുന്നു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനത്തിന്റെ സജീവത ‘പറയുന്നു’ എന്നതിലൂടെ നിലനിർത്തുന്നു; മലയാളത്തിലെ സ്വാഭാവിക വാക്യഘടനയ്ക്കായി ἔρχεται ബന്ധകക്രിയയായി നൽകിയിരിക്കുന്നു.
- source_word: πρὸς τοὺς μαθητάς
  choice: ശിഷ്യന്മാരുടെ അടുക്കൽ
  rationale: അവരുടെ സമീപത്തേക്കുള്ള ചലനം വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: Καθεύδετε τὸ λοιπὸν καὶ ἀναπαύεσθε
  choice: ഇനി ഉറങ്ങി വിശ്രമിച്ചുകൊള്ളുക
  rationale: രൂപതലത്തിലെ പ്രസ്താവന/ആജ്ഞാഭാവം നിലനിർത്തുകയും സന്ദർഭത്തിലെ പരിഹാസാത്മകമോ വഴങ്ങിക്കൊടുക്കുന്നതോ ആയ ധ്വനി തുറന്നുവയ്ക്കുകയും ചെയ്യുന്നു.
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗൗരവമുള്ളതും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: ἤγγικεν ἡ ὥρα
  choice: സമയം അടുത്തിരിക്കുന്നു
  rationale: ἐγγίζωയുടെ സമീപത്വബോധവും പൂർത്തിയായ ഫലസ്ഥിതിയും മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ‘എത്തിയിരിക്കുന്നു’ എന്ന കൂടുതൽ നിർണ്ണായക വ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: യേശുവിന്റെ സ്ഥാപിതവും സന്ദർഭപരമായി പ്രധാനവുമായ സ്വയംവിശേഷണം നിലനിർത്തുന്നു.
- source_word: παραδίδοται
  choice: ഏൽപ്പിക്കപ്പെടുന്നു
  rationale: ‘ഒറ്റിക്കൊടുക്കപ്പെടുന്നു’ എന്ന പരിമിത അർത്ഥത്തിലേക്ക് ചുരുക്കാതെ കൈമാറപ്പെടൽ/ഏൽപ്പിക്കപ്പെടൽ എന്ന വിശാല അർത്ഥം സംരക്ഷിക്കുന്നു.
- source_word: εἰς χεῖρας ἁμαρτωλῶν
  choice: പാപികളുടെ കൈകളിൽ
  rationale: ഗ്രീക്കിലെ സാക്ഷാൽപ്രയോഗം മലയാളത്തിലും വ്യക്തവും സ്വാഭാവികവുമായതിനാൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: Καθεύδετε ... καὶ ἀναπαύεσθε എന്നതിന്റെ ഭാവം
  choice: “ഇനി ഉറങ്ങി വിശ്രമിച്ചുകൊള്ളുക” എന്ന പ്രസ്താവന/ആജ്ഞാരൂപം
  alternative: “നിങ്ങൾ ഇപ്പോഴും ഉറങ്ങി വിശ്രമിക്കുകയാണോ?” എന്ന അലങ്കാരചോദ്യം
  rationale: ഗ്രീക്ക് രൂപവും തുടർന്നുള്ള സമയപ്രഖ്യാപനവും പരിഹാസം, വഴങ്ങിക്കൊടുക്കൽ, അല്ലെങ്കിൽ അലങ്കാരചോദ്യം എന്നിവയ്ക്ക് ഇടനൽകുന്നു. മുഖ്യപാഠം ചോദ്യം എന്നു നിർബന്ധിച്ച് തീർപ്പാക്കാതെ ഈ പിരിമുറുക്കം നിലനിർത്തുന്നു.
- issue: പീഡാനുഭവസന്ദർഭത്തിലെ παραδίδοται
  choice: “ഏൽപ്പിക്കപ്പെടുന്നു”
  alternative: “ഒറ്റിക്കൊടുക്കപ്പെടുന്നു”
  rationale: ഈ ക്രിയ യൂദാസിന്റെ വഞ്ചനയെ ഉൾക്കൊള്ളാമെങ്കിലും അതിലൊതുങ്ങുന്നില്ല; അറസ്റ്റ്, കൈമാറ്റം, തുടർന്നുള്ള പീഡാനുഭവം എന്നിവയുടെ വിശാല ധ്വനി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ചരിത്രവർത്തമാനം കഴിയുന്നത്ര നിലനിർത്തി; പുരാതനമോ സഭാവിഭാഗവിശേഷമായോ ഉള്ള പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട മുഖ്യപാഠഭാഗങ്ങളിൽ ചേർത്തിരിക്കുന്നു.
