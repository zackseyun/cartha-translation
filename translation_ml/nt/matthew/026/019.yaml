id: MAT.26.19
reference: Matthew 26:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐποίησαν οἱ μαθηταὶ ὡς συνέταξεν αὐτοῖς ὁ Ἰησοῦς, καὶ ἡτοίμασαν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/019.yaml
  text: And the disciples did as Jesus had directed them[a], and they prepared the Passover.
translation:
  language: ml
  text: ശിഷ്യന്മാർ യേശു തങ്ങളോടു നിർദേശിച്ചതുപോലെ ചെയ്തു; അവർ പെസഹ[a] ഒരുക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പെസഹാഭക്ഷണം’; πάσχα എന്ന പദം പെസഹാചരണത്തെയും അതിനായി ഒരുക്കുന്ന ഭക്ഷണത്തെയും വിശാലമായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησαν
  choice: ചെയ്തു
  rationale: ὡς συνέταξεν എന്ന പ്രയോഗത്തോടൊപ്പം, ലഭിച്ച നിർദേശമനുസരിച്ച് പ്രവർത്തിച്ചു എന്ന സ്വാഭാവിക അർഥം നൽകുന്നു.
- source_word: οἱ μαθηταὶ
  choice: ശിഷ്യന്മാർ
  rationale: സുവിശേഷങ്ങളിൽ μαθηταί എന്നതിന് പ്രചാരമുള്ളതും ബന്ധപരമായ അർഥം നിലനിർത്തുന്നതുമായ മലയാളരൂപം.
- source_word: ὡς
  choice: നിർദേശിച്ചതുപോലെ
  rationale: താരതമ്യത്തെയും നിർദേശത്തോടുള്ള അനുരൂപതയെയും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: συνέταξεν
  choice: നിർദേശിച്ചു
  rationale: ഈ സന്ദർഭത്തിൽ യേശു നൽകിയ ഒരുക്കനിർദേശങ്ങളെ സൂചിപ്പിക്കുന്നു; അധികമായ കാഠിന്യം ചേർക്കാതെ അദ്ദേഹത്തിന്റെ അധികാരം നിലനിർത്തുന്നു.
- source_word: ἡτοίμασαν
  choice: ഒരുക്കി
  rationale: ἑτοιμάζω എന്നതിന്റെ നേരിട്ടുള്ളതും ഈ സന്ദർഭത്തിൽ സ്വാഭാവികവുമായ മലയാളപരിഭാഷ.
- source_word: τὸ πάσχα
  choice: പെസഹ
  rationale: ഉത്സവം, ആചരണം, അതുമായി ബന്ധപ്പെട്ട ഭക്ഷണം എന്നിവയെ സൂചിപ്പിക്കാവുന്ന ഗ്രീക്ക് പദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു; മുഖ്യവാചകത്തിൽ അനാവശ്യമായി ‘ഭക്ഷണം’ എന്നാക്കി ചുരുക്കുന്നില്ല.
- source_word: ὁ Ἰησοῦς
  choice: യേശു
  rationale: മലയാളത്തിൽ സ്ഥാപിതമായ വ്യക്തിനാമരൂപം.
- source_word: αὐτοῖς
  choice: തങ്ങളോടു
  rationale: നിർദേശം ലഭിച്ചവർ ശിഷ്യന്മാരാണെന്ന ബന്ധം മലയാളവാക്യത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: τὸ πάσχα എന്നതിന്റെ വ്യാപ്തി
  choice: പെസഹ
  alternative: പെസഹാഭക്ഷണം; പെസഹാക്കുഞ്ഞാട്
  rationale: സന്ദർഭം ഭക്ഷണത്തിനായുള്ള ഒരുക്കത്തെ സൂചിപ്പിച്ചാലും, ഗ്രീക്ക് പദം ഭക്ഷണം മാത്രമെന്ന് കൃത്യമായി പരിമിതപ്പെടുത്തുന്നില്ല. അതിനാൽ മുഖ്യവാചകത്തിൽ വിശാലമായ ‘പെസഹ’ നിലനിർത്തി, സന്ദർഭസാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി. ‘ശിഷ്യന്മാർ’, ‘നിർദേശിച്ചതുപോലെ’, ‘ഒരുക്കി’ എന്നീ പ്രചാരമുള്ള പദങ്ങൾ ഉപയോഗിച്ചു. ഗ്രീക്കിലെ രണ്ട് καί ഘടകങ്ങളുടെ തുടർച്ച മലയാളത്തിൽ ഭാരം കൂടാതിരിക്കാൻ അർധവിരാമത്തിലൂടെ സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
