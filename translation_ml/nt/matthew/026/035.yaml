id: MAT.26.35
reference: Matthew 26:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Πέτρος· Κἂν δέῃ με σὺν σοὶ ἀποθανεῖν, οὐ μή σε ⸀ἀπαρνήσομαι. ⸀ὁμοίως καὶ πάντες οἱ μαθηταὶ εἶπαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/035.yaml
  text: Peter said to him[a], “Even if I must die with you, I will certainly not deny you.” Likewise all the disciples also said the same.
translation:
  language: ml
  text: 'പത്രോസ് അവനോട് പറഞ്ഞു: “നിന്നോടൊപ്പം മരിക്കേണ്ടിവന്നാലും ഞാൻ നിന്നെ ഒരിക്കലും തള്ളിപ്പറയുകയില്ല[a].” അതുപോലെതന്നെ ശിഷ്യന്മാർ എല്ലാവരും പറഞ്ഞു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ നിന്നെ തീർച്ചയായും തള്ളിപ്പറയുകയില്ല.” ഗ്രീക്കിൽ ശക്തമായ നിഷേധപ്രയോഗമാണ് (οὐ μή).
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിൽ ചരിത്രവർത്തമാനകാലമാണെങ്കിലും, മലയാള കഥനത്തിൽ ഭൂതകാലമായ ‘പറഞ്ഞു’ സ്വാഭാവികമായി അതേ ആഖ്യാനധർമ്മം വഹിക്കുന്നു.
- source_word: Κἂν δέῃ με
  choice: മരിക്കേണ്ടിവന്നാലും
  rationale: κἄν എന്നതിന്റെ concessive ഭാവവും δέῃ സൂചിപ്പിക്കുന്ന അനിവാര്യതയും സ്വാഭാവികമായ മലയാളത്തിൽ ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: σὺν σοὶ ἀποθανεῖν
  choice: നിന്നോടൊപ്പം മരിക്കേണ്ടിവന്നാലും
  rationale: σὺν σοὶ എന്ന സഹഗമനാർഥവും ἀποθανεῖν എന്ന ‘മരിക്കുക’ എന്ന അർഥവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: οὐ μή
  choice: ഒരിക്കലും … ഇല്ല
  rationale: οὐ μή എന്ന ശക്തമായ നിഷേധം മലയാളത്തിലെ emphatic construction ആയ ‘ഒരിക്കലും … ഇല്ല’ കൊണ്ട് വ്യക്തമാക്കുന്നു.
- source_word: ἀπαρνήσομαι
  choice: തള്ളിപ്പറയുകയില്ല
  rationale: യേശുവുമായുള്ള ബന്ധം നിഷേധിക്കുക എന്ന സന്ദർഭാർഥം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; വെറും ‘നിഷേധിക്കുക’ എന്നതിനെക്കാൾ വ്യക്തിപരമായ നിരാകരണഭാവം ഉണ്ട്.
- source_word: ὁμοίως
  choice: അതുപോലെതന്നെ
  rationale: മുൻ പ്രസ്താവനയോടുള്ള സമാനത നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: πάντες οἱ μαθηταὶ εἶπαν
  choice: ശിഷ്യന്മാർ എല്ലാവരും പറഞ്ഞു
  rationale: ‘എല്ലാ ശിഷ്യന്മാരും പറഞ്ഞു’ എന്ന ഗ്രീക്ക് അർഥം സ്വാഭാവികവും ഊന്നലുള്ളതുമായ മലയാളക്രമത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: പത്രോസിന്റെ നിഷേധപ്രസ്താവനയുടെ ശക്തി
  choice: ‘ഒരിക്കലും … തള്ളിപ്പറയുകയില്ല’ എന്ന ശക്തമായ നിഷേധം
  alternative: ‘തീർച്ചയായും തള്ളിപ്പറയുകയില്ല’
  rationale: οὐ μή അതിശക്തമായ നിഷേധമാണ്. ‘ഒരിക്കലും … ഇല്ല’ അതിന്റെ ദൃഢതയും പത്രോസിന്റെ ആത്മവിശ്വാസവും നിലനിർത്തുന്നു; പ്രസ്താവനയുടെ ദൈവശാസ്ത്രപരമായ സംഘർഷം വ്യാഖ്യാനിച്ച് തീർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കഥനശൈലി. ‘തള്ളിപ്പറയുക’ സാധാരണ വായനക്കാർക്ക് ബന്ധനിഷേധത്തിന്റെ ആശയം വ്യക്തമായി നൽകുന്നു; മൂലത്തിലെ ശക്തമായ നിഷേധം മുഖ്യവാചകത്തിൽ നിലനിർത്തി, അടുത്ത പദപ്രയോഗം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
