id: MAT.26.8
reference: Matthew 26:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ ⸀μαθηταὶ ἠγανάκτησαν λέγοντες· Εἰς τί ἡ ἀπώλεια αὕτη;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/008.yaml
  text: But when the disciples saw it[a], they were indignant, saying, “Why this waste?”
translation:
  language: ml
  text: 'എന്നാൽ ശിഷ്യന്മാർ അതു കണ്ടപ്പോൾ രോഷാകുലരായി പറഞ്ഞു: “ഈ പാഴാക്കൽ എന്തിന്[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഈ പാഴാക്കൽ എന്ത് ഉദ്ദേശ്യത്തിനാണ്?”
    reason: Εἰς τί എന്ന പ്രയോഗത്തിന്റെ കൂടുതൽ പദാനുപദമായ അർത്ഥവികല്പം സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: ἰδόντες
  choice: അതു കണ്ടപ്പോൾ
  rationale: ഭൂതകാല കൃതന്തത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ കാലസൂചക ഉപവാക്യമായി വിവർത്തനം ചെയ്തു. ഗ്രീക്കിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും മുൻസന്ദർഭത്തിലെ അഭിഷേകപ്രവൃത്തിയെ സൂചിപ്പിക്കാൻ ‘അതു’ ചേർത്തു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ പ്രവൃത്തിയിൽനിന്ന് ശിഷ്യന്മാരുടെ പ്രതികരണത്തിലേക്കുള്ള നേരിയ വൈരുധ്യവും കഥാഗതിയിലെ തിരിവും പ്രകടമാക്കുന്നു.
- source_word: οἱ μαθηταὶ
  choice: ശിഷ്യന്മാർ
  rationale: സുവിശേഷവിവരണത്തിൽ μαθηταί എന്ന പദത്തിന്റെ പതിവും സ്വാഭാവികവുമായ മലയാളരൂപം; ഗ്രീക്കിൽ ഇല്ലാത്ത ‘അവന്റെ’ ചേർത്തിട്ടില്ല.
- source_word: ἠγανάκτησαν
  choice: രോഷത്തോടെ
  rationale: ശക്തമായ അസന്തോഷവും ധാർമിക പ്രതിഷേധഭാവവും സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘പറഞ്ഞു’ എന്നതോടൊപ്പം സ്വാഭാവികമായി ചേരുന്നു.
- source_word: λέγοντες
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ കൃതന്തരൂപത്തെ മലയാള കഥനശൈലിക്ക് യോജിച്ച സമാപിക ക്രിയയായി അവതരിപ്പിക്കുന്നു.
- source_word: Εἰς τί
  choice: എന്തിന്
  rationale: ‘എന്ത് ഉദ്ദേശ്യത്തിന്?’ എന്ന ചോദ്യത്തിന്റെ സന്ദർഭോചിതവും സംക്ഷിപ്തവുമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: ἡ ἀπώλεια αὕτη
  choice: ഈ പാഴാക്കൽ
  rationale: ἀπώλεια എന്നതിന്റെ നഷ്ടം, നാശം, പാഴാക്കൽ എന്നീ അർത്ഥങ്ങളിൽ, വിലയേറിയ സുഗന്ധതൈലം ഒഴിച്ച സംഭവത്തിൽ ‘പാഴാക്കൽ’ ഏറ്റവും യോജിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം ഗൗരവമുള്ളതുമായ മലയാളം. നേരിട്ടുള്ള ചോദ്യത്തിലെ പ്രതിഷേധഭാവം നിലനിർത്തിയിരിക്കുന്നു.
