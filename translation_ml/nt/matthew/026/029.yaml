id: MAT.26.29
reference: Matthew 26:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγω δὲ ⸀ὑμῖν, οὐ μὴ πίω ἀπ’ ἄρτι ἐκ τούτου τοῦ γενήματος τῆς ἀμπέλου ἕως τῆς ἡμέρας ἐκείνης ὅταν αὐτὸ πίνω μεθ’ ὑμῶν καινὸν ἐν τῇ βασιλείᾳ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/029.yaml
  text: But I tell you[a], from now on I will certainly not drink from this fruit of the vine until that day when I drink it new with you in the kingdom of my Father.
translation:
  language: ml
  text: 'എന്നാൽ, ഞാൻ നിങ്ങളോടു പറയുന്നു: ഇപ്പോൾമുതൽ മുന്തിരിവള്ളിയുടെ ഈ ഫലത്തിൽനിന്ന് ഞാൻ തീർച്ചയായും കുടിക്കുകയില്ല; എന്റെ പിതാവിന്റെ രാജ്യത്തിൽ നിങ്ങളോടുകൂടെ അതു പുതിയതായി കുടിക്കുന്ന ആ ദിവസംവരെ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: എന്നാൽ ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: δέ ഇവിടെ നേരിയ വൈരുധ്യമോ സംഭാഷണത്തിലെ വഴിത്തിരിവോ സൂചിപ്പിക്കുന്നു; ‘എന്നാൽ’ അത് അതിശയോക്തിയില്ലാതെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: οὐ μὴ πίω
  choice: ഞാൻ തീർച്ചയായും കുടിക്കുകയില്ല
  rationale: οὐ μή കൂടിയുള്ള aorist subjunctive ശക്തമായ ഭാവിനിഷേധമാണ്; ‘തീർച്ചയായും ... ഇല്ല’ അതിന്റെ ഊന്നൽ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἀπ’ ἄρτι
  choice: ഇപ്പോൾമുതൽ
  rationale: സംസാരിക്കുന്ന ഈ നിമിഷം മുതൽ മുന്നോട്ടുള്ള കാലപരിധിയാണ് പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
- source_word: ἐκ τούτου τοῦ γενήματος τῆς ἀμπέλου
  choice: മുന്തിരിവള്ളിയുടെ ഈ ഫലത്തിൽനിന്ന്
  rationale: γένημα എന്നത് ഫലം/ഉത്പന്നം എന്ന അർഥമുള്ളതിനാൽ, വീഞ്ഞിനെ നേരിട്ട് ചേർക്കാതെ ഉറവിടത്തിലെ യഹൂദപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: ἕως τῆς ἡμέρας ἐκείνης
  choice: ആ ദിവസംവരെ
  rationale: ἐκείνης നിർദിഷ്ടമായ ഭാവിദിവസത്തെ ചൂണ്ടിക്കാണിക്കുന്നു; ‘ആ ദിവസം’ ഈ ഊന്നൽ സംരക്ഷിക്കുന്നു.
- source_word: ὅταν αὐτὸ πίνω
  choice: ഇതു ... കുടിക്കുന്ന
  rationale: ὅταν കൂടിയുള്ള present subjunctive കാലപരമായി ഭാവിയിലെ സംഭവത്തെ സൂചിപ്പിക്കുന്നു; αὐτό മുന്തിരിവള്ളിയുടെ ഫലത്തെയോ പാനപാത്രത്തിലെ ഉള്ളടക്കത്തെയോ തിരിച്ചുചൂണ്ടുന്നു.
- source_word: καινὸν
  choice: പുതുതായി
  rationale: καινός ഗുണത്തിലോ സ്വഭാവത്തിലോ ഉള്ള പുതുമയെ സൂചിപ്പിക്കാം; മലയാളത്തിലെ ‘പുതുതായി’ വായനാസൗകര്യം നൽകുമ്പോഴും ‘പുതിയ വിധത്തിൽ/വീണ്ടും’ എന്ന സാധ്യത തുറന്നുവയ്ക്കുന്നു. ആ അർഥവൈവിധ്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: μεθ’ ὑμῶν
  choice: നിങ്ങളോടുകൂടെ
  rationale: കൂട്ടായ സാന്നിധ്യം ലളിതവും മാന്യവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐν τῇ βασιλείᾳ τοῦ πατρός μου
  choice: എന്റെ പിതാവിന്റെ രാജ്യത്തിൽ
  rationale: ഗ്രീക്ക് ഘടനയും ‘എന്റെ പിതാവ്’ എന്ന യേശുവിന്റെ ഗൗരവമുള്ള പരാമർശവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: പാനപാത്രത്തിലെ ഉള്ളടക്കത്തെ നേരിട്ട് ‘വീഞ്ഞ്’ എന്നു പറയണമോ, ഉറവിടത്തിലെ പ്രയോഗം നിലനിർത്തണമോ
  choice: പ്രധാനവാചകത്തിൽ ‘മുന്തിരിവള്ളിയുടെ ഈ ഫലം’ എന്നു നിലനിർത്തി
  alternative: വീഞ്ഞ്
  rationale: ഗ്രീക്കിൽ οἶνος എന്നല്ല, ‘മുന്തിരിവള്ളിയുടെ ഫലം/ഉത്പന്നം’ എന്നാണ്. അതിനാൽ മൂലഭാഷയ്ക്ക് മുൻഗണന നൽകുകയും വാചകത്തിൽ ഇല്ലാത്ത കൂദാശാപരമോ പ്രതീകാത്മകമോ ആയ പ്രത്യേകീകരണം ഒഴിവാക്കുകയും ചെയ്തു.
- issue: അന്ത്യകാല വിരുന്നിലെ καινὸν എന്നതിന്റെ സൂക്ഷ്മാർഥം
  choice: പ്രധാനവാചകത്തിൽ ‘പുതുതായി’ എന്നു നൽകി, അതിന്റെ അർഥം ഒറ്റവിധത്തിൽ നിശ്ചയിച്ചില്ല
  alternative: വീണ്ടും; പുതിയ വിധത്തിൽ; പുതിയത്
  rationale: ഈ വിശേഷണം ഗുണത്തിലോ സ്വഭാവത്തിലോ ഉള്ള പുതുമയെയോ പുതുക്കിയ പങ്കാളിത്തത്തെയോ സൂചിപ്പിക്കാം. വാക്യം ഈ സൂക്ഷ്മാർഥം പൂർണമായി തീർപ്പാക്കാത്തതിനാൽ അടിക്കുറിപ്പിലൂടെ സാധ്യതകൾ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ശക്തമായ ഭാവിനിഷേധം വ്യക്തമായി നൽകി; ഉറവിടത്തിലെ മുന്തിരിവള്ളി-ഫലം എന്ന പ്രയോഗവും καινὸν എന്നതിലെ യഥാർഥ അർഥവൈവിധ്യവും സംരക്ഷിച്ചു.
