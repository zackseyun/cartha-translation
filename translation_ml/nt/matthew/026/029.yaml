revisions:
- from: 'എന്നാൽ ഞാൻ നിങ്ങളോടു പറയുന്നു: ഇപ്പോൾമുതൽ, എന്റെ പിതാവിന്റെ രാജ്യത്തിൽ നിങ്ങളോടുകൂടെ ഇതു പുതുതായി[a] കുടിക്കുന്ന ആ ദിവസംവരെ, മുന്തിരിവള്ളിയുടെ ഈ ഫലത്തിൽനിന്ന് ഞാൻ തീർച്ചയായും കുടിക്കുകയില്ല.'
  to: 'എന്നാൽ, ഞാൻ നിങ്ങളോടു പറയുന്നു: ഇപ്പോൾമുതൽ മുന്തിരിവള്ളിയുടെ ഈ ഫലത്തിൽനിന്ന് ഞാൻ തീർച്ചയായും കുടിക്കുകയില്ല; എന്റെ പിതാവിന്റെ രാജ്യത്തിൽ നിങ്ങളോടുകൂടെ അതു പുതിയതായി കുടിക്കുന്ന ആ ദിവസംവരെ.'
  rationale: The revision changes only the rendering and placement of καινόν-related wording. ‘പുതിയതായി’ better represents ‘new’ in the main text, while the footnote retains ‘again’ and ‘in a new way’ as possible nuances. Reordering the temporal clause makes the verse natural modern Malayalam while preserving all source-text relationships.
