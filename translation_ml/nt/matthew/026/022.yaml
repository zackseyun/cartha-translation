id: MAT.26.22
reference: Matthew 26:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ λυπούμενοι σφόδρα ἤρξαντο λέγειν αὐτῷ ⸂εἷς ἕκαστος⸃· Μήτι ἐγώ εἰμι, κύριε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/022.yaml
  text: And being deeply grieved[a], they began to say to him one by one, “Surely not I[b], Lord?”
translation:
  language: ml
  text: അത്യന്തം ദുഃഖിതരായ അവർ, ഓരോരുത്തരായി[a] അവനോടു, “കർത്താവേ, ഞാനല്ലല്ലോ?[b]” എന്നു പറയാൻ തുടങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഓരോരുത്തനും” / “ഒരാൾക്കുപിന്നാലെ മറ്റൊരാൾ.”
    reason: lexical_alternative
  - marker: b
    text: 'ഗ്രീക്കിലെ μήτι എന്ന ചോദ്യകണം നിഷേധാത്മകമായ ഉത്തരം പ്രതീക്ഷിക്കുന്നു: “കർത്താവേ, ഞാനല്ലല്ലോ?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπούμενοι σφόδρα
  choice: അത്യന്തം ദുഃഖിതരായി
  rationale: വർത്തമാന കൃദന്തരൂപം അവരുടെ തുടരുന്ന ദുഃഖാവസ്ഥയെ സൂചിപ്പിക്കുന്നു; σφόδρα നൽകുന്ന തീവ്രത ‘അത്യന്തം’ വ്യക്തമാക്കുന്നു.
- source_word: ἤρξαντο λέγειν
  choice: പറയാൻ തുടങ്ങി
  rationale: പ്രവർത്തനത്തിന്റെ ആരംഭം വ്യക്തമാക്കുന്ന ഗ്രീക്ക് ഘടന സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: αὐτῷ
  choice: അവനോട്
  rationale: പരോക്ഷ കർമത്തിന്റെ ലളിതവും സ്വാഭാവികവുമായ വിവർത്തനം.
- source_word: εἷς ἕκαστος
  choice: ഓരോരുത്തരായി
  rationale: ഓരോ ശിഷ്യനും വ്യക്തിപരമായി പ്രതികരിച്ചതിനെ സൂചിപ്പിക്കുന്ന വിതരണാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: Μήτι ἐγώ εἰμι
  choice: ഞാനല്ലല്ലോ?
  rationale: നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്ന μήτι എന്ന ചോദ്യകണത്തിന്റെ ഭാവം മലയാളത്തിലെ ‘അല്ലല്ലോ?’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: κύριε
  choice: കർത്താവേ
  rationale: യേശുവിനോടുള്ള സംബോധനയിൽ κύριος എന്ന പദത്തിന്റെ ബഹുമാനവും ആഖ്യാനപരവും ദൈവശാസ്ത്രപരവുമായ ഭാരം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യേശുവിനെ സംബോധന ചെയ്യുന്ന κύριε എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: കർത്താവേ
  alternative: യജമാനനേ / പ്രഭോ
  rationale: ‘കർത്താവേ’ എന്നത് κύριος എന്ന പദത്തിന്റെ സാധാരണ ബൈബിൾപരമായ അർഥവും മത്തായിയുടെ ആഖ്യാനത്തിൽ യേശുവിനുള്ള പദവിയുടെ ഭാരവും സംരക്ഷിക്കുന്നു; വെറും മര്യാദാസംബോധനയായി അതിനെ ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ വിതരണാർഥവും നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്ന ചോദ്യഭാവവും വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു. നൽകിയ ഇംഗ്ലീഷ് പാഠത്തിൽ [a] ചിഹ്നം ദുഃഖത്തെ സൂചിപ്പിക്കുന്ന വാക്കിനുശേഷം വന്നിരുന്നെങ്കിലും അതിന്റെ അടിക്കുറിപ്പ് εἷς ἕκαστος എന്ന പ്രയോഗത്തെക്കുറിച്ചായതിനാൽ മലയാളത്തിൽ ശരിയായ സ്ഥാനമായ ‘ഓരോരുത്തരായി’ എന്നതിന് ശേഷമാണ് ചേർത്തത്.
