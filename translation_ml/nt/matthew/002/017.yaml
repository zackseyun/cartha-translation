id: MAT.2.17
reference: Matthew 2:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τότε ἐπληρώθη τὸ ῥηθὲν ⸀διὰ Ἰερεμίου τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/017.yaml
  text: 'Then what was spoken through Jeremiah the prophet was fulfilled[a], saying:'
translation:
  language: ml
  text: 'അപ്പോൾ യിരെമ്യാ പ്രവാചകനിലൂടെ അരുളിച്ചെയ്യപ്പെട്ടത് നിവൃത്തിയായി:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: അപ്പോൾ
  rationale: സംഭവങ്ങളുടെ തുടർച്ച സൂചിപ്പിക്കുന്ന കാലക്രിയാവിശേഷണം; മത്തായിയുടെ ആഖ്യാനപ്രവാഹം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἐπληρώθη
  choice: നിവൃത്തിയായി
  rationale: മത്തായിയുടെ പ്രവചനനിവൃത്തി സൂത്രവാക്യത്തിലെ ദൈവശാസ്ത്രപരവും സാഹിത്യപരവുമായ ‘നിറവേറൽ’ ആശയം പരമ്പരാഗതവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τὸ ῥηθὲν
  choice: അരുളിച്ചെയ്യപ്പെട്ടത്
  rationale: ദൈവിക പ്രവചനമായി പറയപ്പെട്ട വാക്കിനെ സൂചിപ്പിക്കുന്ന substantival participle; മലയാള ബൈബിൾ ഭാഷയിൽ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ പ്രയോഗം.
- source_word: διὰ Ἰερεμίου
  choice: യിരെമ്യാ പ്രവാചകനിലൂടെ
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന മധ്യസ്ഥത നിലനിർത്തുന്നു; യിരെമ്യാവ് പ്രവചനവചനത്തിന്റെ മാധ്യമമാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: τοῦ προφήτου
  choice: പ്രവാചകൻ
  rationale: യിരെമ്യാവിന്റെ പങ്ക് വ്യക്തമാക്കുന്ന appositional designation സ്വാഭാവിക മലയാളത്തിൽ സംയോജിപ്പിക്കുന്നു.
- source_word: λέγοντος
  choice: തുടർന്നുള്ള ഉദ്ധരണി പരിചയപ്പെടുത്തുന്ന ദ്വിബിന്ദു
  rationale: ഗ്രീക്കിലെ participle യിരെമ്യാവിലൂടെ പറയപ്പെട്ട വചനത്തിന്റെ ഉള്ളടക്കത്തിലേക്ക് നയിക്കുന്നു. ‘പറഞ്ഞുകൊണ്ട്’ എന്ന അക്ഷരാർഥ രൂപം മലയാളത്തിൽ തെറ്റായ ബന്ധമോ അസ്വാഭാവികതയോ സൃഷ്ടിക്കുന്നതിനാൽ ദ്വിബിന്ദു അതിന്റെ വാക്യപ്രവർത്തനം സ്വാഭാവികമായി വഹിക്കുന്നു.
theological_decisions:
- issue: മത്തായിയുടെ പ്രവചനനിവൃത്തി സൂത്രവാക്യം
  choice: ‘നിവൃത്തിയായി’ എന്ന വ്യക്തമായ നിവൃത്തി ഭാഷ നിലനിർത്തി
  alternative: ‘നിവൃത്തിയാകേണ്ടതിന് സംഭവിച്ചു’
  rationale: സംഭവത്തെ പ്രവാചകവചനത്തിന്റെ നിവൃത്തിയായി മത്തായി അവതരിപ്പിക്കുന്നതിനെ ഗ്രീക്കിനപ്പുറം കാരണപരമായി വികസിപ്പിക്കാതെയും മയപ്പെടുത്താതെയും സംരക്ഷിക്കുന്നു.
- issue: λέγοντος എന്നതിന്റെ ബന്ധവും ഉദ്ധരണി-പരിചയപ്പെടുത്തൽ പ്രവർത്തനവും
  choice: പ്രധാനവാചകത്തിൽ ദ്വിബിന്ദുവിലൂടെ ഉദ്ധരണിയിലേക്കുള്ള ബന്ധം പ്രകടിപ്പിച്ചു
  alternative: ‘പറഞ്ഞുകൊണ്ട്’ / ‘ഇപ്രകാരം പറഞ്ഞത്’
  rationale: participial രൂപത്തിന്റെ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുമ്പോൾ, പ്രധാനവാചകത്തിൽ നിവൃത്തിയാണ് ‘പറയുന്നത്’ എന്ന തെറ്റായ ധാരണ ഒഴിവാക്കുന്നു; ഗ്രീക്കിലെ ചെറിയ ഘടനാപരമായ അസ്പഷ്ടത മായ്ച്ചുകളയാതെ വായനാസൗകര്യം നൽകുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ മാന്യവും ലളിതവുമായ ബൈബിൾ ഗദ്യം. ‘അരുളിച്ചെയ്യപ്പെട്ടത്’, ‘നിവൃത്തിയായി’ എന്നിവ പ്രവചനസന്ദർഭത്തിന് യോജിച്ച ഗൗരവം നൽകുന്നു; വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
