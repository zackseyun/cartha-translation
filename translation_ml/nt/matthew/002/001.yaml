  text: Τοῦ δὲ Ἰησοῦ γεννηθέντος ἐν Βηθλέεμ τῆς Ἰουδαίας ἐν ἡμέραις Ἡρῴδου τοῦ βασιλέως, ἰδοὺ μάγοι ἀπὸ ἀνατολῶν παρεγένοντο εἰς Ἱεροσόλυμα
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/001.yaml
  text: After Jesus was born in Bethlehem of Judea in the days of Herod the king[a], behold, wise men from the east arrived in Jerusalem,
translation:
  language: ml
  text: ഹെരോദാവ് രാജാവായിരുന്ന കാലത്ത്, യെഹൂദ്യയിലെ ബേത്‌ലഹേമിൽ യേശു ജനിച്ചശേഷം, ഇതാ, കിഴക്കുനിന്ന് വിദ്വാന്മാർ[a] യെരൂശലേമിൽ എത്തി,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മാഗികൾ.” ഈ ഗ്രീക്ക് പദം കിഴക്കുനിന്നുള്ള പഠിതാക്കളെ സൂചിപ്പിക്കുന്നു; അവർ ജ്യോതിഷവുമായോ രാജസഭാപാണ്ഡിത്യവുമായോ ബന്ധപ്പെട്ടവരായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦ δὲ Ἰησοῦ γεννηθέντος
  choice: യേശു ജനിച്ചശേഷം
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് പ്രധാന സംഭവത്തിനു മുമ്പുള്ള പശ്ചാത്തലസാഹചര്യം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായി കാലബന്ധം വ്യക്തമാക്കാൻ ഈ പ്രയോഗം യോജിക്കുന്നു; δέയുടെ മൃദുവായ ആഖ്യാനബന്ധം പ്രത്യേക പദമായി നിർബന്ധിച്ച് ചേർത്തിട്ടില്ല.
- source_word: Βηθλέεμ τῆς Ἰουδαίας
  choice: യെഹൂദ്യയിലെ ബേത്‌ലഹേമിൽ
  rationale: സ്ഥലത്തെ വ്യക്തമായി തിരിച്ചറിയിക്കുന്ന ജനിറ്റീവ് മലയാളത്തിൽ സ്വാഭാവികമായ അധികരണപ്രയോഗമായി നൽകിയിരിക്കുന്നു.
- source_word: ἐν ἡμέραις Ἡρῴδου τοῦ βασιλέως
  choice: ഹെരോദാവ് രാജാവായിരുന്ന കാലത്ത്
  rationale: ചരിത്രകാലസൂചനയെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ രീതിയിൽ പുനരാവിഷ്കരിക്കുന്നു; രാജാവെന്ന പദവി നിലനിർത്തുന്നു.
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: തുടർന്നുവരുന്ന സംഭവത്തിലേക്ക് വായനക്കാരന്റെ ശ്രദ്ധ ക്ഷണിക്കുന്ന അടയാളപ്പെടുത്തിയ ആഖ്യാനപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: μάγοι
  choice: വിദ്വാന്മാർ
  rationale: കിഴക്കൻ ജ്ഞാനപാരമ്പര്യത്തോടും ജ്യോതിഷമോ രാജസഭാപാണ്ഡിത്യമോ പോലുള്ള മേഖലകളോടും ബന്ധപ്പെട്ട പഠിതാക്കളെ സൂചിപ്പിക്കുന്ന പൊതുവായ, വായനാസൗഹൃദമായ പദം. അവർ രാജാക്കന്മാരായിരുന്നു എന്ന പിൽക്കാല പാരമ്പര്യം ഇതിൽ ഇറക്കുമതി ചെയ്യുന്നില്ല; സാങ്കേതിക പദം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἀπὸ ἀνατολῶν
  choice: കിഴക്കുനിന്ന്
  rationale: ബഹുവചനരൂപത്തിലുള്ള കിഴക്കൻ പ്രദേശങ്ങൾ എന്ന ആശയം മലയാളത്തിലെ സ്വാഭാവികമായ സമാഹാരപ്രയോഗത്തിലൂടെ നൽകുന്നു.
- source_word: παρεγένοντο εἰς Ἱεροσόλυμα
  choice: യെരൂശലേമിൽ എത്തി
  rationale: വരികയും ലക്ഷ്യസ്ഥാനത്ത് എത്തിച്ചേരുകയും ചെയ്തതെന്ന ക്രിയാഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: μάγοι എന്ന പദം പിൽക്കാല പാരമ്പര്യം ചേർക്കാതെ പരിഭാഷപ്പെടുത്തൽ
  choice: വിദ്വാന്മാർ
  alternative: മാഗികൾ
  rationale: മൂലപദം കിഴക്കുനിന്നുള്ള പഠിതാക്കളെയോ ജ്യോതിഷ-രാജസഭാ ജ്ഞാനവുമായി ബന്ധപ്പെട്ടവരെയോ സൂചിപ്പിക്കാം; അവരുടെ എണ്ണം, രാജപദവി എന്നിവ പറയുന്നില്ല. അതിനാൽ പൊതുവായ അർത്ഥം മുഖ്യവാചകത്തിലും കൂടുതൽ സാങ്കേതികമായ രൂപം അടിക്കുറിപ്പിലും നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ἰδούവിന്റെ ശ്രദ്ധാകർഷണബലം ‘ഇതാ’ എന്നതിലൂടെ നിലനിർത്തി. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുമെന്നതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തി.
