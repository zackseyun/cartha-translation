  terminology: ‘യെഹൂദന്മാരുടെ രാജാവ്,’ ‘നക്ഷത്രം,’ and ‘വണങ്ങാൻ’ are appropriate. ‘വണങ്ങാൻ’ properly preserves the range from royal homage to worship; the alternative is retained in a footnote. The footnote for ἐν τῇ ἀνατολῇ is adjusted to express the idiomatic alternative ‘at its rising’ more precisely.
