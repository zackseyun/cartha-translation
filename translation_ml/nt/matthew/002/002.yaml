id: MAT.2.2
reference: Matthew 2:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγοντες· Ποῦ ἐστιν ὁ τεχθεὶς βασιλεὺς τῶν Ἰουδαίων; εἴδομεν γὰρ αὐτοῦ τὸν ἀστέρα ἐν τῇ ἀνατολῇ καὶ ἤλθομεν προσκυνῆσαι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/002.yaml
  text: saying[b][a], “Where is the one who has been born king of the Jews? For we saw his star in the east and have come to pay him homage.”
translation:
  language: ml
  text: 'അവർ പറഞ്ഞു: “യെഹൂദന്മാരുടെ രാജാവായി ജനിച്ചവൻ എവിടെയാണ്? കാരണം, ഞങ്ങൾ കിഴക്കുദിക്കിൽ[a] അവന്റെ നക്ഷത്രം കണ്ടു; അവനെ വണങ്ങാൻ[b] വന്നിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അതിന്റെ ഉദയത്തിൽ.” ἐν τῇ ἀνατολῇ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന് “കിഴക്കുദിക്കിൽ” എന്നും നക്ഷത്രത്തിന്റെ ഉദയത്തെ സൂചിപ്പിക്കുന്ന അർഥത്തിലും വരാം.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, “അവനെ ആരാധിക്കാൻ.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് ക്രിയയ്ക്ക് സന്ദർഭമനുസരിച്ച് ഒരു രാജാവിനെ ആദരപൂർവം വണങ്ങുക എന്നോ ആരാധിക്കുക എന്നോ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: അവർ ചോദിച്ചു
  rationale: വർത്തമാനകാല കൃദന്തരൂപം തുടർന്ന് വരുന്ന വാക്കുകളെ പരിചയപ്പെടുത്തുന്നു. പ്രസ്താവനയുടെ മുഖ്യരൂപം ചോദ്യമായതിനാൽ ‘അവർ ചോദിച്ചു’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികമായ ആഖ്യാനപ്രയോഗമാണ്.
- source_word: Ποῦ ἐστιν
  choice: എവിടെയാണ്?
  rationale: ഗ്രീക്കിലെ നേരിട്ടുള്ള സ്ഥാനചോദ്യത്തെ വിപുലീകരിക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὁ τεχθεὶς
  choice: ജനിച്ചവൻ
  rationale: നാമവാചകമായി പ്രവർത്തിക്കുന്ന കർമണി കൃദന്തരൂപത്തിന്റെ അർഥം നിലനിർത്തുന്നു; ‘നവജാതൻ’ എന്നു പറഞ്ഞ് ശൈശവത്തെക്കുറിച്ചുള്ള അധിക സൂചന ചേർക്കുന്നില്ല.
- source_word: βασιλεὺς τῶν Ἰουδαίων
  choice: യെഹൂദന്മാരുടെ രാജാവ്
  rationale: രാജകീയ സ്ഥാനപ്പേരിന്റെ രാഷ്ട്രീയവും മശീഹാപരവുമായ ഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: εἴδομεν γὰρ
  choice: ഞങ്ങൾ ... കണ്ടു
  rationale: γάρ ചോദ്യത്തിന്റെ കാരണം സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ വാക്യക്രമവും അർധവിരാമവും ആ ബന്ധം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നതിനാൽ പ്രത്യേക കാരണബന്ധപദം നിർബന്ധമല്ല. εἴδομεν എന്ന ഭൂതകാലരൂപം ‘കണ്ടു’ എന്നു നൽകുന്നു.
- source_word: αὐτοῦ τὸν ἀστέρα
  choice: അവന്റെ നക്ഷത്രം
  rationale: ഉടമസ്ഥബന്ധം ലളിതമായി നിലനിർത്തുന്നു; നക്ഷത്രത്തിന്റെ സ്വഭാവത്തെക്കുറിച്ച് പാഠത്തിൽ ഇല്ലാത്ത വിശദീകരണം ചേർക്കുന്നില്ല.
- source_word: ἐν τῇ ἀνατολῇ
  choice: കിഴക്കുദിക്കിൽ
  rationale: ἀνατολή ഭൂമിശാസ്ത്രപരമായി ‘കിഴക്ക്’ എന്നും ജ്യോതിശ്ശാസ്ത്രപരമായി ‘ഉദയം’ എന്നും അർഥമാക്കാം. മുഖ്യപാഠത്തിൽ പരമ്പരാഗതവും സന്ദർഭോചിതവുമായ അർഥം സ്വീകരിച്ച് യഥാർഥമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἤλθομεν
  choice: വന്നിരിക്കുന്നു
  rationale: അവർ എത്തിച്ചേർന്നതും ഇപ്പോൾ അവിടെ സന്നിഹിതരായിരിക്കുന്നതും മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: προσκυνῆσαι αὐτῷ
  choice: അവനെ വണങ്ങാൻ
  rationale: വണക്കം, രാജകീയ ആദരവ്, ആരാധന എന്നിവ ഉൾക്കൊള്ളാവുന്ന προσκυνέω എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി മലയാളത്തിലെ ‘വണങ്ങുക’ നന്നായി സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നേരത്തേ തീർപ്പാക്കുന്നില്ല.
theological_decisions:
- issue: ശിശുവായ യേശുവിനോടുള്ള προσκυνῆσαι എന്ന ക്രിയയുടെ അർഥം
  choice: അവനെ വണങ്ങാൻ
  alternative: അവനെ ആരാധിക്കാൻ
  rationale: അന്വേഷകർ ‘യെഹൂദന്മാരുടെ രാജാവായി’ ജനിച്ചവനെ തേടുന്നതിനാൽ ഉടനെയുള്ള സന്ദർഭം രാജകീയ ആദരവാണ്. എന്നാൽ ഈ ക്രിയയ്ക്ക് ആരാധന എന്ന അർഥവും ഉണ്ടാകാം. ‘വണങ്ങാൻ’ എന്ന മുഖ്യവിവർത്തനവും ‘ആരാധിക്കാൻ’ എന്ന അടിക്കുറിപ്പും ഈ രണ്ടു സാധ്യതകളും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം മാന്യവുമായ ആഖ്യാനശൈലി. ‘യെഹൂദന്മാർ,’ ‘കിഴക്കുദിക്ക്,’ ‘വണങ്ങുക’ എന്നിവ പരിചിതവും സ്വാഭാവികവുമായ പദങ്ങളാണ്. അർധവിരാമം ചോദ്യത്തിനുള്ള കാരണം ചേർക്കുന്ന ബന്ധം മൃദുവായി വ്യക്തമാക്കുന്നു.
