revisions:
- from: 'അവരെ ബെത്‌ലഹേമിലേക്ക് അയച്ചശേഷം അവൻ പറഞ്ഞു: “നിങ്ങൾ പോയി ആ ശിശുവിനെക്കുറിച്ച് സൂക്ഷ്മമായി അന്വേഷിക്കുക. അവനെ കണ്ടെത്തുമ്പോൾ എന്നെ അറിയിക്കണം; അങ്ങനെ ഞാനും ചെന്ന് അവനെ ആരാധിക്കട്ടെ[a].”'
  to: 'അവരെ ബേത്ലഹേമിലേക്ക് അയച്ചശേഷം അവൻ പറഞ്ഞു: “നിങ്ങൾ പോയി ആ കുട്ടിയെക്കുറിച്ച് വളരെ ശ്രദ്ധയോടെ അന്വേഷിക്കുക. അവനെ കണ്ടെത്തുമ്പോൾ എന്നെ അറിയിക്കുക; അങ്ങനെ ഞാനും വന്ന് അവനെ ആരാധിക്കാം[a].”'
  rationale: The revision avoids narrowing παιδίον to ‘infant,’ improves the natural expression of the Greek purpose clause, and retains the ambiguity of προσκυνέω through an aligned lexical-alternative footnote. No doctrinal interpretation beyond the source’s lexical range is added.
