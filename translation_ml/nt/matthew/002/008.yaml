id: MAT.2.8
reference: Matthew 2:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ πέμψας αὐτοὺς εἰς Βηθλέεμ εἶπεν· Πορευθέντες ⸂ἐξετάσατε ἀκριβῶς⸃ περὶ τοῦ παιδίου· ἐπὰν δὲ εὕρητε, ἀπαγγείλατέ μοι, ὅπως κἀγὼ ἐλθὼν προσκυνήσω αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/008.yaml
  text: And after sending them to Bethlehem[a], he said, “Go and search carefully for the child, and when you find him, report to me, so that I too may come and worship him.”
translation:
  language: ml
  text: 'അവരെ ബേത്ലഹേമിലേക്ക് അയച്ചശേഷം അവൻ പറഞ്ഞു: “നിങ്ങൾ പോയി ആ കുട്ടിയെക്കുറിച്ച് വളരെ ശ്രദ്ധയോടെ അന്വേഷിക്കുക. അവനെ കണ്ടെത്തുമ്പോൾ എന്നെ അറിയിക്കുക; അങ്ങനെ ഞാനും വന്ന് അവനെ ആരാധിക്കാം[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “അവന് ആദരാഞ്ജലി അർപ്പിക്കാം” അല്ലെങ്കിൽ “അവന്റെ മുമ്പിൽ കുമ്പിടാം” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് ക്രിയയ്ക്ക് ആരാധനയെയോ രാജകീയ വ്യക്തിയുടെ മുമ്പിൽ ആദരപൂർവം കുമ്പിടുന്നതിനെയോ സൂചിപ്പിക്കാനാകും.
    reason: lexical_alternative
lexical_decisions:
- source_word: πέμψας
  choice: അയച്ചശേഷം
  rationale: പ്രധാന ക്രിയയായ εἶπεν-നു മുമ്പ് പൂർത്തിയായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന aorist participle-ന്റെ കാലക്രമം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: Πορευθέντες
  choice: നിങ്ങൾ പോയി
  rationale: ἐξετάσατε-യോടൊപ്പം ആജ്ഞാർഥത്തിൽ പ്രവർത്തിക്കുന്ന participle സ്വാഭാവിക മലയാളത്തിൽ സംയോജിത നിർദേശമായി നൽകുന്നു.
- source_word: ἐξετάσατε ἀκριβῶς
  choice: സൂക്ഷ്മമായി അന്വേഷിക്കുക
  rationale: ശ്രദ്ധയോടെയും കൃത്യതയോടെയും വിവരമന്വേഷിക്കുക എന്ന ക്രിയാവിശേഷണസഹിതമായ പ്രയോഗത്തിന്റെ ഭാവം നിലനിർത്തുന്നു.
- source_word: περὶ τοῦ παιδίου
  choice: ആ ശിശുവിനെക്കുറിച്ച്
  rationale: περί എന്നതിന്റെ ‘സംബന്ധിച്ച്/കുറിച്ച്’ എന്ന അർഥം നേരിട്ട് സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ അന്വേഷിക്കുന്നതിന്റെ ലക്ഷ്യം ശിശുവിനെ കണ്ടെത്തലാണ്.
- source_word: παιδίου
  choice: ശിശു
  rationale: παιδίον സൂചിപ്പിക്കുന്ന ചെറുപ്രായമുള്ള കുട്ടിക്ക് ഈ ജനനവിവരണസന്ദർഭത്തിൽ സ്വാഭാവികവും മാന്യവുമായ പദം.
- source_word: ἐπὰν δὲ εὕρητε
  choice: കണ്ടെത്തുമ്പോൾ
  rationale: പ്രതീക്ഷിക്കപ്പെടുന്ന ഭാവി സാഹചര്യം സൂചിപ്പിക്കുന്ന ἐπάν + subjunctive മലയാളത്തിൽ ‘-ുമ്പോൾ’ എന്നതിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; നിർവ്യാജമായ ഉറപ്പ് ചുമത്തുന്നില്ല.
- source_word: ἀπαγγείλατέ μοι
  choice: എന്നെ അറിയിക്കണം
  rationale: വിവരം തിരികെ അറിയിക്കണമെന്ന നിർദേശത്തിന്റെ ഭാവം ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὅπως
  choice: അങ്ങനെ
  rationale: ഹെരോദാവിന്റെ പ്രസ്താവിത ഉദ്ദേശ്യം പരിചയപ്പെടുത്തുന്ന purposive ബന്ധം സന്ദർഭത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: κἀγὼ
  choice: ഞാനും
  rationale: καὶ ἐγώ എന്ന സംയുക്തരൂപത്തിലെ ‘ഞാനും/ഞാൻകൂടി’ എന്ന ഉൾപ്പെടുത്തൽ ഊന്നൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἐλθὼν προσκυνήσω αὐτῷ
  choice: ചെന്ന് അവനെ ആരാധിക്കട്ടെ
  rationale: participle-ഉം subjunctive-ഉം ചേർന്ന പ്രവൃത്തിയെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; προσκυνέωയുടെ ശക്തമായ ‘ആരാധിക്കുക’ എന്ന സാധ്യത മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ശിശുവായ യേശുവിനോടുള്ള προσκυνήσω αὐτῷ എന്ന പ്രയോഗം
  choice: അവനെ ആരാധിക്കട്ടെ
  alternative: അവന് ആദരാഞ്ജലി അർപ്പിക്കട്ടെ / അവന്റെ മുമ്പിൽ കുമ്പിടട്ടെ
  rationale: προσκυνέω ആരാധനയെയും രാജകീയ വ്യക്തിയുടെ മുമ്പിലുള്ള സാഷ്ടാംഗ ആദരവിനെയും സൂചിപ്പിക്കാം. മത്തായിയുടെ യേശുവിനെക്കുറിച്ചുള്ള പ്രയോഗത്തിൽ ശക്തമായ അർഥം സാധ്യമാകുന്നതിനാൽ ‘ആരാധിക്കുക’ മുഖ്യപാഠത്തിൽ സ്വീകരിക്കുന്നു; യഥാർഥ നിഘണ്ടുപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു. ഹെരോദാവിന്റെ വാക്കുകൾ വഞ്ചനാപരമാണെന്ന കഥാസന്ദർഭം പദത്തിന്റെ അർഥം സ്വതവേ മാറ്റുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി. മൂലത്തിലെ നിർദേശക്രമവും ഉദ്ദേശ്യബന്ധവും നിലനിർത്തിയിരിക്കുന്നു. ‘സൂക്ഷ്മമായി അന്വേഷിക്കുക’ കൃത്യതയുള്ള അന്വേഷണത്തെ സൂചിപ്പിക്കുന്നു; προσκυνέωയിലെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
