id: MAT.2.5
reference: Matthew 2:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν αὐτῷ· Ἐν Βηθλέεμ τῆς Ἰουδαίας· οὕτως γὰρ γέγραπται διὰ τοῦ προφήτου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/005.yaml
  text: And they said to him[a], “In Bethlehem of Judea[b], for thus it has been written through the prophet:”
translation:
  language: ml
  text: 'അവർ അവനോടു പറഞ്ഞു: “യെഹൂദ്യയിലെ ബെത്ലഹേമിൽ; കാരണം, പ്രവാചകനിലൂടെ ഇപ്രകാരം എഴുതിയിരിക്കുന്നു[a]:”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എഴുതപ്പെട്ടിരിക്കുന്നു.” ഗ്രീക്കിൽ പൂർണ്ണകാല നിഷ്ക്രിയരൂപമാണ്; തിരുവെഴുത്ത് ഉദ്ധരിക്കുമ്പോൾ പതിവായി ഉപയോഗിക്കുന്ന പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: അവർ
  rationale: മുൻവാക്യത്തിലെ മുഖ്യപുരോഹിതന്മാരെയും ശാസ്ത്രിമാരെയും സൂചിപ്പിക്കുന്ന substantival article ആണ് οἱ; δέ ഇവിടെ ശക്തമായ വൈരുധ്യമല്ല, മൃദുവായ തുടർച്ച മാത്രമാണ്. മലയാളത്തിൽ വേറൊരു ബന്ധകപദം ചേർക്കാതെ ‘അവർ’ എന്നു പറയുന്നത് സ്വാഭാവികമാണ്.
- source_word: εἶπαν αὐτῷ
  choice: അവനോടു പറഞ്ഞു
  rationale: λέγω + dative എന്ന ലളിതമായ പ്രസ്താവനാരൂപം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: Ἐν Βηθλέεμ τῆς Ἰουδαίας
  choice: യെഹൂദ്യയിലെ ബേത്‌ലഹേമിൽ
  rationale: ജനിറ്റീവ് ഏതു ബേത്‌ലഹേമാണ് ഉദ്ദേശിക്കുന്നതെന്ന് വ്യക്തമാക്കുന്നു; മലയാളത്തിലെ ‘യെഹൂദ്യയിലെ’ അതേ തിരിച്ചറിയൽബന്ധം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: οὕτως γὰρ
  choice: കാരണം, … ഇപ്രകാരം
  rationale: γάρ മുൻപത്തെ ഉത്തരത്തിന്റെ കാരണം അവതരിപ്പിക്കുന്നു; οὕτως തുടർന്നുവരുന്ന തിരുവെഴുത്തുവാക്യത്തിലേക്ക് മുന്നോട്ടു ചൂണ്ടുന്നു.
- source_word: γέγραπται
  choice: എഴുതപ്പെട്ടിരിക്കുന്നു
  rationale: പൂർണ്ണകാല നിഷ്ക്രിയരൂപവും തിരുവെഴുത്ത് ഉദ്ധരിക്കുന്ന പതിവുസൂത്രവും കഴിയുന്നത്ര വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: διὰ τοῦ προφήτου
  choice: പ്രവാചകനിലൂടെ
  rationale: διά + ജനിറ്റീവ് പ്രവാചകനെ സന്ദേശത്തിന്റെ മധ്യസ്ഥനായി അവതരിപ്പിക്കുന്നതിനാൽ ‘പ്രവാചകനിലൂടെ’ എന്നത് agency/instrumentality സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: പ്രവാചകമധ്യസ്ഥതയുടെ സൂത്രവാക്യം
  choice: പ്രവാചകനിലൂടെ
  alternative: പ്രവാചകനാൽ
  rationale: ഗ്രീക്കിലെ διά + ജനിറ്റീവ് ദൈവിക സന്ദേശം പ്രവാചകൻ മുഖാന്തരം വന്നതെന്ന മധ്യസ്ഥതാസൂചന നിലനിർത്തുന്നു; അധികമായ സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘യെഹൂദ്യയിലെ ബേത്‌ലഹേം’ സ്ഥലം തിരിച്ചറിയിക്കുന്ന ജനിറ്റീവിന്റെ അർഥം വ്യക്തമാക്കുന്നു. ഗ്രീക്കിലെ മധ്യബിന്ദു സൂചിപ്പിക്കുന്ന ശക്തമായ ഇടവേളയും തുടർച്ചയായ വിശദീകരണവും ഒരുമിച്ച് സൂക്ഷിക്കാൻ അർദ്ധവിരാമം ഉപയോഗിച്ചു.
