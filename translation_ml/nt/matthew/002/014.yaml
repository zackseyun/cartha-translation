id: MAT.2.14
reference: Matthew 2:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ ἐγερθεὶς παρέλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ νυκτὸς καὶ ἀνεχώρησεν εἰς Αἴγυπτον,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/014.yaml
  text: So he got up[a], took the child and his mother during the night, and departed for Egypt.
translation:
  language: ml
  text: അപ്പോൾ അവൻ എഴുന്നേറ്റ്, രാത്രിയിൽ കുട്ടിയെയും അവന്റെ അമ്മയെയും കൂട്ടിക്കൊണ്ട് ഈജിപ്തിലേക്കു പുറപ്പെട്ടു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: അപ്പോൾ
  rationale: കഥയുടെ തുടർച്ച മുന്നോട്ടുകൊണ്ടുപോകുന്ന മൃദുവായ ബന്ധകമാണ്; മുൻകൽപ്പനയോടുള്ള പ്രതികരണവും സ്വാഭാവികമായ ആഖ്യാനപ്രവാഹവും ‘അപ്പോൾ’ വ്യക്തമാക്കുന്നു.
- source_word: ἐγερθεὶς
  choice: എഴുന്നേറ്റ്
  rationale: പ്രധാന പ്രവർത്തനങ്ങൾക്ക് മുമ്പുണ്ടായ ഉടനെയുള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന aorist participle മലയാളത്തിൽ സ്വാഭാവികമായ ക്രിയാവിശേഷണരൂപത്തിൽ നൽകി.
- source_word: παρέλαβε
  choice: കൂട്ടിക്കൊണ്ട്
  rationale: ഈ സന്ദർഭത്തിൽ παραλαμβάνω ഒരാളെ തന്നോടൊപ്പം കൊണ്ടുപോകുക എന്നർഥമാണ്; ‘കൂട്ടിക്കൊണ്ട്’ ആ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: τὸ παιδίον
  choice: ശിശുവിനെ
  rationale: παιδίον എന്നത് ചെറിയ കുട്ടിയെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിന് യോജിച്ച ലളിതവും മാന്യവുമായ പദമായി ‘ശിശു’ തിരഞ്ഞെടുത്തു.
- source_word: τὴν μητέρα αὐτοῦ
  choice: അവന്റെ അമ്മയെ
  rationale: αὐτοῦ സമീപസ്ഥമായ ‘ശിശു’വിനെയാണ് സൂചിപ്പിക്കുന്നത്; ഗ്രീക്കിലെ ബന്ധം അതേപടി നിലനിർത്തുന്നു.
- source_word: νυκτὸς
  choice: രാത്രിയിൽത്തന്നെ
  rationale: സമയത്തെ സൂചിപ്പിക്കുന്ന genitive രൂപം രാത്രിയിലുണ്ടായ അടിയന്തരമായ പ്രവർത്തനത്തെ അറിയിക്കുന്നു; ‘ത്തന്നെ’ മുൻവാക്യത്തിലെ നിർദേശത്തോടുള്ള ഉടനെയുള്ള അനുസരണം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: ἀνεχώρησεν
  choice: പുറപ്പെട്ടു
  rationale: ἀναχωρέω ഇവിടെ മറ്റൊരു സ്ഥലത്തേക്കു നീങ്ങിപ്പോകുന്നതാണ്; അപകടത്തിൽനിന്നുള്ള പിന്മാറ്റം എന്ന വ്യാഖ്യാനം അനാവശ്യമായി ചേർക്കാതെ ലക്ഷ്യബോധമുള്ള യാത്രയെ ‘പുറപ്പെട്ടു’ വ്യക്തമാക്കുന്നു.
- source_word: εἰς Αἴγυπτον
  choice: ഈജിപ്തിലേക്കു
  rationale: εἰς ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ചലനത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഈജിപ്തിലേക്കു’ അതിന്റെ നേരായ സ്വാഭാവിക രൂപമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച മാന്യമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ പ്രവർത്തനക്രമം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ സ്വാഭാവിക വാക്യഘടന ഉപയോഗിച്ചു. ഇംഗ്ലീഷ് consultation layer-ലുള്ള [a] അടയാളവും ‘Or “to Egypt.”’ എന്ന കുറിപ്പും തമ്മിൽ സ്ഥാനപരമായ പൊരുത്തക്കേടുള്ളതിനാൽ, ഗ്രീക്കിൽ പ്രസക്തമായ അർഥവ്യത്യാസമില്ലാത്ത ഈ സ്ഥലത്ത് അടിസ്ഥാനരഹിതമായ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
