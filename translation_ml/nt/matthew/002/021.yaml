id: MAT.2.21
reference: Matthew 2:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ ἐγερθεὶς παρέλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ ⸀εἰσῆλθεν εἰς γῆν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/021.yaml
  text: So he rose, took the child and his mother, and entered the land of Israel.
translation:
  language: ml
  text: അങ്ങനെ അവൻ എഴുന്നേറ്റ് കുട്ടിയെയും അവന്റെ അമ്മയെയും കൂട്ടിക്കൊണ്ട് ഇസ്രായേൽദേശത്തേക്ക് പ്രവേശിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: അങ്ങനെ
  rationale: ഇവിടെ δέ ശക്തമായ വൈരുധ്യമല്ല, കഥയുടെ തുടർച്ചയും മുൻകല്പനയോടുള്ള പ്രതികരണവുമാണ് സൂചിപ്പിക്കുന്നത്; ‘അങ്ങനെ’ അത് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐγερθεὶς
  choice: എഴുന്നേറ്റ്
  rationale: സന്ദർഭത്തിൽ കർത്തൃപ്രയോഗാർഥമുള്ള ഈ ഭൂതകാല കൃതന്തം തുടർന്നുള്ള പ്രവൃത്തിക്ക് മുമ്പുള്ള എഴുന്നേൽപ്പിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘എഴുന്നേറ്റ്’ സ്വാഭാവികമാണ്.
- source_word: παρέλαβε
  choice: കൂട്ടിക്കൊണ്ട്
  rationale: παραλαμβάνω ഇവിടെ ഒരാളെ തന്നോടൊപ്പം കൊണ്ടുപോകുക എന്നർഥത്തിലാണ്; ‘കൂട്ടിക്കൊണ്ട്’ ഈ സഹയാത്രാഭാവം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: τὸ παιδίον
  choice: ശിശുവിനെ
  rationale: παιδίον ഒരു ചെറുപ്രായമുള്ള കുട്ടിയെ സൂചിപ്പിക്കുന്നു; മത്തായിയുടെ ശൈശവവിവരണത്തിൽ ‘ശിശു’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പദമാണ്.
- source_word: τὴν μητέρα αὐτοῦ
  choice: അവന്റെ അമ്മയെ
  rationale: αὐτοῦ സ്വാഭാവികമായി ശിശുവിനെയാണ് സൂചിപ്പിക്കുന്നത്; ഗ്രീക്കിലെ സർവനാമബന്ധം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: εἰσῆλθεν
  choice: പ്രവേശിച്ചു
  rationale: εἰσέρχομαι എന്നതിന്റെ ‘അകത്തേക്കു കടക്കുക/പ്രവേശിക്കുക’ എന്ന ദിശാഭാവം ഔപചാരികമെങ്കിലും സാധാരണക്കാർക്ക് മനസ്സിലാകുന്ന മലയാളത്തിൽ നൽകുന്നു.
- source_word: εἰς γῆν Ἰσραήλ
  choice: ഇസ്രായേൽദേശത്ത്
  rationale: ദേശീയ-ഭൗമശാസ്ത്രപരമായ അർഥം മലയാളത്തിലെ സ്വാഭാവിക സംയുക്തരൂപത്തിൽ സംരക്ഷിക്കുന്നു; εἰς-ന്റെ ലക്ഷ്യദിശ ‘പ്രവേശിച്ചു’ എന്ന ക്രിയയോടൊപ്പം സ്ഥാനവിഭക്തിയിൽ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ കഥനശൈലി. ഗ്രീക്കിലെ കൃതന്തരചന മലയാളത്തിലെ സ്വാഭാവിക ക്രമപ്രവൃത്തിയായി മാറ്റിയിരിക്കുന്നു; വ്യാഖ്യാനാത്മകമായ ദൈവശാസ്ത്രവിവരങ്ങൾ ഒന്നും ചേർത്തിട്ടില്ല.
