id: MAT.2.22
reference: Matthew 2:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὅτι Ἀρχέλαος ⸀βασιλεύει τῆς Ἰουδαίας ἀντὶ ⸂τοῦ πατρὸς αὐτοῦ Ἡρῴδου⸃ ἐφοβήθη ἐκεῖ ἀπελθεῖν· χρηματισθεὶς δὲ κατ’ ὄναρ ἀνεχώρησεν εἰς τὰ μέρη τῆς Γαλιλαίας,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/022.yaml
  text: But when he heard that Archelaus was reigning over Judea in place of his father Herod[a], he was afraid to go there. And after being warned in a dream, he withdrew to the regions of Galilee,
translation:
  language: ml
  text: എന്നാൽ അർക്കെലാവൊസ് തന്റെ പിതാവായ ഹെരോദാവിന്റെ സ്ഥാനത്ത് യെഹൂദ്യയെ രാജാവായി വാഴുന്നുവെന്ന് കേട്ടപ്പോൾ, അവിടേക്കു പോകാൻ അവൻ ഭയപ്പെട്ടു. സ്വപ്നത്തിൽ മുന്നറിയിപ്പ് ലഭിച്ചശേഷം[a], അവൻ ഗലീലയുടെ പ്രദേശങ്ങളിലേക്ക് പിന്മാറി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിർദേശം ലഭിച്ചശേഷം’ എന്നും പരിഭാഷപ്പെടുത്താം; ഈ ക്രിയ സാധാരണയായി ദൈവത്തിൽനിന്നുള്ള മുന്നറിയിപ്പിനെയോ നിർദേശത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας δὲ
  choice: എന്നാൽ ... എന്നു കേട്ടപ്പോൾ
  rationale: മുൻ ഉദ്ദേശ്യത്തിനു നേരിടുന്ന പുതിയ തടസ്സം δὲ സൂചിപ്പിക്കുന്നു; aorist participle ആയ ἀκούσας മുഖ്യക്രിയയ്ക്കു മുമ്പുള്ള സാഹചര്യത്തെ സ്വാഭാവിക മലയാളത്തിൽ കാലവാക്യമായി നൽകുന്നു.
- source_word: βασιλεύει τῆς Ἰουδαίας
  choice: യെഹൂദ്യയിൽ രാജ്യം ഭരിക്കുന്നു
  rationale: βασιλεύω എന്നതിലെ രാജകീയ ഭരണത്തിന്റെ അർഥം നിലനിർത്തുകയും genitive പ്രദേശബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു. പരോക്ഷവചനത്തിലെ ഗ്രീക്ക് വർത്തമാനകാലവും നിലനിർത്തുന്നു.
- source_word: ἀντὶ τοῦ πατρὸς αὐτοῦ Ἡρῴδου
  choice: തന്റെ പിതാവായ ഹെരോദാവിന്റെ സ്ഥാനത്ത്
  rationale: ἀντί ഇവിടെ പകരംവരവിനെയോ പിൻഗാമിത്വത്തെയോ സൂചിപ്പിക്കുന്നു; ‘സ്ഥാനത്ത്’ അതിനെ വ്യാഖ്യാനം കൂട്ടാതെ വ്യക്തമാക്കുന്നു.
- source_word: ἐφοβήθη ἐκεῖ ἀπελθεῖν
  choice: അവിടേക്കു പോകാൻ അവൻ ഭയപ്പെട്ടു
  rationale: ഭയത്തിന്റെ കാരണമായ ലക്ഷ്യസ്ഥലത്തേക്കുള്ള യാത്രയെ ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: χρηματισθεὶς
  choice: മുന്നറിയിപ്പു ലഭിച്ചതിനാൽ
  rationale: ദൈവിക അറിയിപ്പോ മുന്നറിയിപ്പോ ലഭിച്ചതിനെ ഈ സന്ദർഭത്തിൽ ക്രിയ സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിൽ പ്രവർത്തകനെ പറയാത്തതിനാൽ മലയാളത്തിലും പറയുന്നില്ല.
- source_word: κατ’ ὄναρ
  choice: സ്വപ്നത്തിൽ
  rationale: സ്വപ്നത്തിലൂടെ ലഭിച്ച വെളിപ്പെടുത്തലിനുള്ള മത്തായിയുടെ പതിവുപ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: ἀνεχώρησεν
  choice: മാറിപ്പോയി
  rationale: അപകടമോ സാഹചര്യവ്യതിയാനമോ കാരണം ഉദ്ദേശപൂർവം മറ്റൊരു സ്ഥലത്തേക്കു പിന്മാറിപ്പോകുന്ന ഭാവം നൽകുന്നു; ‘പിൻവാങ്ങി’ എന്നത് ഇവിടെ സൈനികഭാവം വരുത്താനിടയുള്ളതിനാൽ ഒഴിവാക്കി.
- source_word: εἰς τὰ μέρη τῆς Γαλιλαίας
  choice: ഗലീലാപ്രദേശങ്ങളിലേക്ക്
  rationale: μέρη എന്ന ബഹുവചനത്തിന്റെ പ്രദേശപരമായ വ്യാപ്തി ‘പ്രദേശങ്ങൾ’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: χρηματισθείς എന്നതിലെ മുന്നറിയിപ്പിന്റെ ദൈവിക ഉറവിടം തുറന്നുപറയണമോ
  choice: പ്രവർത്തകനെ ചേർക്കാതെ ‘മുന്നറിയിപ്പു ലഭിച്ചതിനാൽ’ എന്നു നൽകി.
  alternative: ‘ദൈവത്തിൽനിന്നു മുന്നറിയിപ്പു ലഭിച്ചതിനാൽ’ അല്ലെങ്കിൽ ‘ദൈവിക നിർദേശം ലഭിച്ചതിനാൽ’.
  rationale: മത്തായിയിൽ ഈ ക്രിയ സാധാരണയായി ദൈവിക സന്ദേശത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും ഈ വാക്യത്തിൽ പ്രവർത്തകൻ പരാമർശിക്കപ്പെട്ടിട്ടില്ല. അതിനാൽ ദൈവിക സൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും മുഖ്യപാഠത്തിലെ വ്യാകരണപരമായ അനിശ്ചിതത്വം സംരക്ഷിക്കുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. വ്യക്തിനാമങ്ങൾ ‘അർക്കെലാവൊസ്’, ‘ഹെരോദാവ്’ എന്നും ദേശനാമങ്ങൾ ‘യെഹൂദ്യ’, ‘ഗലീല’ എന്നും നൽകി. വാക്യാവസാനത്തിലെ കോമയ്ക്ക് പകരം മലയാളത്തിൽ പൂർണ്ണവിരാമം ഉപയോഗിച്ചു; എന്നാൽ മൂലവാക്യത്തിന്റെ ആഖ്യാനബന്ധം ‘പിന്നെ’ എന്നതിലൂടെ നിലനിർത്തി.
