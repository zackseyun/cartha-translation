  to: എന്നാൽ അർക്കെലാവൊസ് തന്റെ പിതാവായ ഹെരോദാവിന്റെ സ്ഥാനത്ത് യെഹൂദ്യയെ രാജാവായി വാഴുന്നുവെന്ന് കേട്ടപ്പോൾ, അവിടേക്കു പോകാൻ അവൻ ഭയപ്പെട്ടു. സ്വപ്നത്തിൽ മുന്നറിയിപ്പ് ലഭിച്ചശേഷം[a], അവൻ ഗലീലയുടെ പ്രദേശങ്ങളിലേക്ക് പിന്മാറി.
  rationale: The revision improves Malayalam idiom while retaining the source text’s royal terminology, territorial relationship, passive divine-warning implication without specifying an agent, and temporal sequence. The footnote anchor remains attached to the rendering of χρηματισθείς and its content remains aligned with the stated lexical alternative.
