id: MAT.2.20
reference: Matthew 2:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγων· Ἐγερθεὶς παράλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ πορεύου εἰς γῆν Ἰσραήλ, τεθνήκασιν γὰρ οἱ ζητοῦντες τὴν ψυχὴν τοῦ παιδίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/020.yaml
  text: saying[a], “Get up, take the child and his mother, and go to the land of Israel, for those seeking the child’s life are dead.”
translation:
  language: ml
  text: 'ഇങ്ങനെ പറഞ്ഞു: “എഴുന്നേറ്റ്, കുട്ടിയെയും അവന്റെ അമ്മയെയും കൂട്ടിക്കൊണ്ടു ഇസ്രായേൽദേശത്തേക്കു പോകുക; കാരണം കുട്ടിയുടെ ജീവനെടുക്കാൻ നോക്കുന്നവർ മരിച്ചിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγων
  choice: പറഞ്ഞു
  rationale: മുൻവാക്യത്തിലെ ദൂതന്റെ പ്രത്യക്ഷപ്പെടലിനോടു ബന്ധമുള്ള വർത്തമാനകൃദ്‌രൂപമാണെങ്കിലും, മലയാളത്തിൽ സ്വതന്ത്ര വാക്യമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ ഭൂതകാല ക്രിയ ഉപയോഗിച്ചു.
- source_word: Ἐγερθεὶς
  choice: എഴുന്നേറ്റ്
  rationale: ആജ്ഞയ്ക്കു മുമ്പുള്ള കൃദ്‌രൂപത്തിന്റെ ക്രമവും സ്വാഭാവികമായ മലയാളപ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: παράλαβε
  choice: കൂട്ടിക്കൊണ്ട്
  rationale: ഒരാളെ തന്നോടൊപ്പം കൊണ്ടുപോകുക എന്ന സന്ദർഭാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: τὸ παιδίον
  choice: ശിശു
  rationale: παιδίον സൂചിപ്പിക്കുന്ന ചെറിയ കുട്ടിയെ സംക്ഷിപ്തവും മാന്യവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: τὴν μητέρα αὐτοῦ
  choice: അവന്റെ അമ്മ
  rationale: ഗ്രീക്കിലെ ഉടമസ്ഥസർവനാമബന്ധം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: πορεύου
  choice: പോകുക
  rationale: ലളിതമായ ആജ്ഞാരൂപം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: εἰς γῆν Ἰσραήλ
  choice: ഇസ്രായേൽദേശത്തേക്കു
  rationale: γῆയുടെ ഭൂമിശാസ്ത്രപരമായ അർഥം ‘ദേശം’ എന്നതിലൂടെ സംരക്ഷിക്കുന്നു.
- source_word: τεθνήκασιν
  choice: മരിച്ചുപോയി
  rationale: പൂർണ്ണകാലം സൂചിപ്പിക്കുന്ന സംഭവവും അതിന്റെ നിലവിലെ ഫലവും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: οἱ ζητοῦντες
  choice: ശ്രമിച്ചവർ
  rationale: ഈ സന്ദർഭത്തിലെ അന്വേഷണം മാരക ഉദ്ദേശ്യമുള്ളതാണെന്ന് തുടർന്നുള്ള ‘ജീവൻ’ എന്ന പ്രയോഗത്തോടൊപ്പം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: τὴν ψυχὴν τοῦ παιδίου
  choice: ശിശുവിന്റെ ജീവൻ
  rationale: ഇവിടെ ψυχή അമൂർത്തമായ ‘ആത്മാവ്’ എന്നല്ല, കൊല്ലപ്പെടാൻ ഇടയുള്ള ജീവൻ എന്ന അർഥത്തിലാണ്.
theological_decisions:
- issue: മാരക ഭീഷണിയുടെ സന്ദർഭത്തിൽ ψυχήയുടെ പരിഭാഷ
  choice: ജീവൻ
  alternative: ആത്മാവ്
  rationale: ‘ഒരാളുടെ ψυχή അന്വേഷിക്കുക’ എന്ന പ്രയോഗം ഇവിടെ ആ വ്യക്തിയെ കൊല്ലാൻ ശ്രമിക്കുക എന്ന അർഥം നൽകുന്നു; ‘ആത്മാവ്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് സന്ദർഭത്തിൽ ഇല്ലാത്ത ദൈവശാസ്ത്രപരമായ അർഥം ചേർക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആജ്ഞാശൈലി ഉപയോഗിച്ചു. വാക്യം മുൻവാക്യത്തിൽനിന്ന് തുടരുന്നതായതിനാൽ ‘പറഞ്ഞു’ എന്നാരംഭം നിലനിർത്തി; മാരക ഉദ്ദേശ്യം മലയാളവായനക്കാരന് വ്യക്തമായി ലഭിക്കാൻ ‘ജീവൻ അപഹരിക്കാൻ ശ്രമിച്ചവർ’ എന്നു നൽകി.
