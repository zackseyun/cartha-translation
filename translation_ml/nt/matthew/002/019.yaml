id: MAT.2.19
reference: Matthew 2:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τελευτήσαντος δὲ τοῦ Ἡρῴδου ἰδοὺ ἄγγελος κυρίου ⸂φαίνεται κατ’ ὄναρ⸃ τῷ Ἰωσὴφ ἐν Αἰγύπτῳ
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/019.yaml
  text: But after Herod died[a], behold, an angel of the Lord appears in a dream to Joseph in Egypt.
translation:
  language: ml
  text: എന്നാൽ ഹെരോദാവ് മരിച്ചശേഷം, ഇതാ, കർത്താവിന്റെ ഒരു ദൂതൻ[a] ഈജിപ്തിൽ യോസേഫിന് സ്വപ്നത്തിൽ പ്രത്യക്ഷപ്പെടുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കർത്താവിന്റെ ദൂതൻ.’ ഗ്രീക്കിൽ ‘ദൂതൻ’ എന്ന പദത്തിനുമുമ്പിൽ നിശ്ചിത ആർട്ടിക്കിൾ ഇല്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: Τελευτήσαντος δὲ τοῦ Ἡρῴδου
  choice: എന്നാൽ ഹെരോദാവ് മരിച്ചശേഷം
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് സമയബന്ധമായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; δέ സൂചിപ്പിക്കുന്ന മൃദുവായ ആഖ്യാനമാറ്റം ‘എന്നാൽ’ നിലനിർത്തുന്നു.
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന മത്തായിയുടെ സജീവമായ ആഖ്യാനചിഹ്നം ഗൗരവവും സ്വാഭാവികതയും നഷ്ടപ്പെടുത്താതെ നിലനിർത്തുന്നു.
- source_word: ἄγγελος κυρίου
  choice: കർത്താവിന്റെ ഒരു ദൂതൻ
  rationale: ἄγγελος എന്ന പദത്തിനു നിർദേശക ആർട്ടിക്കിൾ ഇല്ലാത്തതിനാൽ പ്രധാന പാഠത്തിൽ അനിശ്ചിതത്വം സൂചിപ്പിക്കുന്ന ‘ഒരു’ ഉപയോഗിക്കുന്നു; κυρίου എന്നത് പതിവുപോലെ ‘കർത്താവിന്റെ’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: φαίνεται
  choice: പ്രത്യക്ഷപ്പെടുന്നു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനകാലത്തിന്റെ ആഖ്യാനസജീവത മലയാളത്തിലും വർത്തമാനകാലത്തിൽ നിലനിർത്തുന്നു.
- source_word: κατ’ ὄναρ
  choice: സ്വപ്നത്തിൽ
  rationale: സ്വപ്നത്തിലൂടെയുള്ള വെളിപ്പാടിനെ സൂചിപ്പിക്കുന്ന മത്തായിയുടെ പ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാള സമാനപദം.
- source_word: τῷ Ἰωσὴφ ἐν Αἰγύπτῳ
  choice: ഈജിപ്തിൽവെച്ച് യോസേഫിന്
  rationale: സംഭവസമയത്ത് യോസേഫിന്റെ സ്ഥലം വ്യക്തമായി കാണിക്കുകയും ദാതിവ് ‘യോസേഫിന്’ എന്നു സ്വാഭാവികമായി നൽകുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ἄγγελος κυρίου എന്നതിലെ κύριος-ന്റെ പരിഭാഷ
  choice: കർത്താവ്
  alternative: യജമാനൻ
  rationale: ഈ ദൈവികസന്ദർഭത്തിൽ κύριος എന്ന പദത്തിന് സ്ഥാപിതവും സ്വാഭാവികവുമായ മലയാള ബഹുമാനപദം ‘കർത്താവ്’ ആണ്.
- issue: ἄγγελος എന്ന പദത്തിന്റെ ആർട്ടിക്കിൾ ഇല്ലായ്മ
  choice: കർത്താവിന്റെ ഒരു ദൂതൻ
  alternative: കർത്താവിന്റെ ദൂതൻ
  rationale: ഗ്രീക്കിൽ ἄγγελος-ന് ആർട്ടിക്കിൾ ഇല്ലാത്തതിനാൽ ‘ഒരു ദൂതൻ’ എന്ന നേരിട്ടുള്ള വായന പ്രധാന പാഠത്തിൽ സ്വീകരിക്കുന്നു. എന്നാൽ ആർട്ടിക്കിൾ ഇല്ലായ്മ എല്ലായ്പ്പോഴും നിർബന്ധമായി അനിശ്ചിതത്വം അടയാളപ്പെടുത്തുന്നില്ലെന്നതിനാൽ പരമ്പരാഗതമായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ഇതാ’യും ചരിത്രവർത്തമാനമായ ‘പ്രത്യക്ഷപ്പെടുന്നു’യും മൂലപാഠത്തിന്റെ സജീവത നിലനിർത്തുന്നു.
