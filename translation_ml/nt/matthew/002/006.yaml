reference: Matthew 2:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ σύ, Βηθλέεμ γῆ Ἰούδα, οὐδαμῶς ἐλαχίστη εἶ ἐν τοῖς ἡγεμόσιν Ἰούδα· ἐκ σοῦ γὰρ ἐξελεύσεται ἡγούμενος, ὅστις ποιμανεῖ τὸν λαόν μου τὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/006.yaml
  text: And you[a], Bethlehem, land of Judah, are by no means least among the rulers of Judah[b]; for from you will come a ruler who will shepherd my people Israel.
translation:
  language: ml
  text: '“യെഹൂദാദേശത്തിലെ ബേത്‌ലഹേമേ,


    നീ യെഹൂദായിലെ ഭരണാധികാരികളിൽ


    തീർച്ചയായും ഏറ്റവും ചെറിയതല്ല;


    എന്തെന്നാൽ, നിന്നിൽനിന്ന് ഒരു ഭരണാധികാരി വരും[a];


    അവൻ എന്റെ ജനമായ ഇസ്രായേലിനെ മേയ്ക്കും[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പുറപ്പെട്ടുവരും”; കൂടുതൽ അക്ഷരാർഥത്തിൽ, “പുറത്തേക്കു പോകും.”
    reason: lexical_alternative
  - marker: b
    text: “മേയ്ക്കുക” എന്നതിന് “ഭരിക്കുക” എന്ന അർഥവും ഉണ്ടാകാം; ഇടയപരിപാലനത്തോടൊപ്പം രാജകീയ നേതൃത്വത്തിന്റെ ഭാവവും ഇതിൽ നിലനിൽക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: γῆ Ἰούδα
  choice: യെഹൂദാദേശത്തിലെ
  rationale: γῆ ഇവിടെ മണ്ണിനെയോ ഭൂമിയെയോ അല്ല, യെഹൂദായോടു ബന്ധപ്പെട്ട ദേശത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ബേത്‌ലഹേമിനോടുള്ള അഭിസംബോധന സ്വാഭാവികമാക്കാൻ ‘യെഹൂദാദേശത്തിലെ’ എന്നു നൽകി.
- source_word: οὐδαμῶς
  choice: തീർച്ചയായും ... അല്ല
  rationale: തുടർന്നുവരുന്ന വിശേഷണത്തെ ശക്തമായി നിഷേധിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ഊന്നൽ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐλαχίστη
  choice: ഏറ്റവും ചെറിയത്
  rationale: അളവിനെയും പദവിയെയോ പ്രാധാന്യത്തെയോ ഒരുപോലെ സൂചിപ്പിക്കാവുന്ന മൂലപദത്തിന്റെ തുറന്ന അർഥം നിലനിർത്തുന്നു; ‘അപ്രധാനം’ എന്നു പരിഭാഷപ്പെടുത്തി അർഥം മുൻകൂട്ടി പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: ἡγεμόσιν
  choice: ഭരണാധികാരികളിൽ
  rationale: ഭരിക്കുന്നവരെയോ നേതാക്കളെയോ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ ഭരണപരമായ അർഥം നിലനിർത്തുന്നു; ‘ഗവർണർമാർ’ പോലുള്ള പ്രത്യേക ഔദ്യോഗിക പദവി അടിച്ചേൽപ്പിക്കുന്നില്ല.
- source_word: ἐξελεύσεται
  choice: വരും
  rationale: ബേത്‌ലഹേമിൽനിന്ന് ആ വ്യക്തി ഉദയംചെയ്യുമെന്ന ആശയം സ്വാഭാവികമായി അറിയിക്കുന്നു. ‘പുറപ്പെട്ടുവരും’ എന്ന കൂടുതൽ ദൃശ്യമായ അർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: ἡγούμενος
  choice: ഒരു ഭരണാധികാരി
  rationale: നാമമായി ഉപയോഗിച്ചിരിക്കുന്ന കൃതന്തം വരാനിരിക്കുന്ന വ്യക്തിയുടെ ഭരണനേതൃത്വത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: ποιμανεῖ
  choice: മേയ്ക്കുന്ന
  rationale: ഇടയന്റെ ദൃശ്യബിംബം നേരിട്ട് നിലനിർത്തുന്നു; അതിൽ ഉൾക്കൊള്ളുന്ന ഭരണാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: λαόν μου τὸν Ἰσραήλ
  choice: എന്റെ ജനമായ ഇസ്രായേൽ
  rationale: ‘ഇസ്രായേൽ’ എന്നത് ‘എന്റെ ജനം’ എന്നതിന്റെ സമാനാധികരണ വിശദീകരണമാണെന്ന ബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: വരാനിരിക്കുന്ന വ്യക്തിയുടെ രാജകീയ നേതൃത്വവും ഇടയപരിപാലനവും തമ്മിലുള്ള ബന്ധം
  choice: ἡγούμενος എന്നത് ‘ഭരണാധികാരി’ എന്നും ποιμανεῖ എന്നത് ‘മേയ്ക്കുന്ന’ എന്നും നൽകി രണ്ടു ഭാവങ്ങളും നിലനിർത്തി.
  alternative: രണ്ടു പദങ്ങളും ഭരണഭാഷയിൽ നൽകുക (‘നേതാവ്’ / ‘ഭരിക്കും’), അല്ലെങ്കിൽ രണ്ടും ഇടയഭാഷയിൽ നൽകുക.
  rationale: വാക്യം ഭരണത്തെയും ഇടയപരിപാലനത്തെയും ഒരുമിച്ചു ചേർക്കുന്നു. ഒരു ഭാവത്തിലേക്ക് മാത്രം ചുരുക്കാതെ മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സമൃദ്ധിയും സംഘർഷവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. കവിതാസദൃശമായ ഉദ്ധരണിയുടെ വരിവിന്യാസം നിലനിർത്തി. ‘ബേത്‌ലഹേമേ’ എന്ന സംബോധനരൂപവും ‘യെഹൂദാദേശം’ എന്ന ഭൂമിശാസ്ത്രപരമായ പദവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധത്തിൽ ഉപയോഗിച്ചു.
