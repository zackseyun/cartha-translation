  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀναχωρησάντων δὲ αὐτῶν ἰδοὺ ἄγγελος κυρίου ⸂φαίνεται κατ’ ὄναρ⸃ τῷ Ἰωσὴφ λέγων· Ἐγερθεὶς παράλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ φεῦγε εἰς Αἴγυπτον, καὶ ἴσθι ἐκεῖ ἕως ἂν εἴπω σοι· μέλλει γὰρ Ἡρῴδης ζητεῖν τὸ παιδίον τοῦ ἀπολέσαι αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/013.yaml
  text: After they had departed[a], behold, an angel of the Lord appeared to Joseph in a dream, saying, “Get up, take the child and his mother, and flee to Egypt, and stay there until I tell you[c][b]; for Herod is about to seek the child in order to destroy him.”
translation:
  language: ml
  text: 'അവർ പോയിക്കഴിഞ്ഞപ്പോൾ, ഇതാ, കർത്താവിന്റെ ഒരു ദൂതൻ സ്വപ്നത്തിൽ യോസേഫിനു പ്രത്യക്ഷനായി പറഞ്ഞു: “എഴുന്നേറ്റ് ശിശുവിനെയും അവന്റെ അമ്മയെയും കൂട്ടിക്കൊണ്ട് ഈജിപ്തിലേക്കു ഓടിപ്പോകുക. ഞാൻ നിന്നോടു പറയുന്നതുവരെ അവിടെത്തന്നെ കഴിയുക. കാരണം, ശിശുവിനെ നശിപ്പിക്കാൻ ഹെരോദാവ് ആ ശിശുവിനെ അന്വേഷിക്കാൻ പോകുന്നു.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നശിപ്പിക്കാൻ” എന്നതിനു “കൊല്ലാൻ” എന്നും അർഥമാക്കാം; ഇവിടെ ഗ്രീക്കുപദം ശിശുവിനെ മരണപ്പെടുത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναχωρησάντων δὲ αὐτῶν
  choice: അവർ പോയിക്കഴിഞ്ഞപ്പോൾ
  rationale: മുൻപ് പറഞ്ഞ സന്ദർശകർ പോയതിനുശേഷമുള്ള സംഭവമാണെന്ന് വ്യക്തമാക്കുന്ന genitive absolute സ്വാഭാവികമായ മലയാളത്തിൽ കാലക്രമത്തോടെ അവതരിപ്പിക്കുന്നു.
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: പെട്ടെന്നുള്ള ദൈവിക ഇടപെടലിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന മത്തായിയുടെ സജീവമായ ആഖ്യാനസൂചകം നിലനിർത്തുന്നു.
- source_word: ἄγγελος κυρίου
  choice: കർത്താവിന്റെ ഒരു ദൂതൻ
  rationale: ഗ്രീക്കിൽ article ഇല്ലാത്തതിനാൽ indefinite അർഥം മലയാളത്തിലെ ‘ഒരു’കൊണ്ട് വ്യക്തമാക്കുന്നു; κύριος എന്ന പദത്തിന് ‘കർത്താവ്’ ഉപയോഗിക്കുന്നു.
- source_word: φαίνεται κατ’ ὄναρ τῷ Ἰωσήφ
  choice: സ്വപ്നത്തിൽ യോസേഫിനു പ്രത്യക്ഷനായി
  rationale: ചരിത്രവർത്തമാനകാലമായ φαίνεται മലയാള ആഖ്യാനത്തിൽ ഭൂതകാലമായി സ്വാഭാവികമായി നൽകി; κατ’ ὄναρ എന്നത് ‘സ്വപ്നത്തിൽ’ എന്ന idiom ആയി പരിഭാഷപ്പെടുത്തി.
- source_word: Ἐγερθεὶς παράλαβε
  choice: എഴുന്നേറ്റ് ... കൂട്ടിക്കൊണ്ട്
  rationale: ആജ്ഞാശൃംഖലയിൽ participle ആജ്ഞയുടെ ശക്തിയോടെ പ്രവർത്തിക്കുന്നു; παράλαβε കൂടെ കൊണ്ടുപോകുക എന്ന സന്ദർഭാർഥം വഹിക്കുന്നു.
- source_word: τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ
  choice: ശിശുവിനെയും അവന്റെ അമ്മയെയും
  rationale: παιδίον ചെറുപ്പമുള്ള കുട്ടിയെ സൂചിപ്പിക്കുന്നതിനാൽ ഇവിടെ ‘ശിശു’ സ്വാഭാവികമാണ്; αὐτοῦ ശിശുവിനെ സൂചിപ്പിക്കുന്നതായി നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: φεῦγε εἰς Αἴγυπτον
  choice: ഈജിപ്തിലേക്കു ഓടിപ്പോകുക
  rationale: φεύγω സൂചിപ്പിക്കുന്ന അപകടത്തിൽനിന്നുള്ള അടിയന്തര പലായനം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ἴσθι ἐκεῖ
  choice: അവിടെത്തന്നെ കഴിയുക
  rationale: അക്ഷരാർഥമായ ‘അവിടെ ആയിരിക്കുക’ എന്നതിനു പകരം തുടർന്നുള്ള താമസത്തിന്റെ സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἕως ἂν εἴπω σοι
  choice: ഞാൻ നിന്നോടു പറയുന്നതുവരെ
  rationale: ഭാവിയിലെ അനിശ്ചിതമായ പരിധി കൃത്യവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: μέλλει ... ζητεῖν
  choice: അന്വേഷിക്കാൻ പോകുന്നു
  rationale: μέλλει പ്രകടിപ്പിക്കുന്ന അടുത്തുവരുന്ന ഉദ്ദേശ്യവും പ്രവൃത്തിയും മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τοῦ ἀπολέσαι αὐτό
  choice: അവനെ നശിപ്പിക്കാൻ
  rationale: ἀπόλλυμι എന്ന പദത്തിന്റെ ‘നശിപ്പിക്കുക’ എന്ന ശക്തി നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിൽ അത് മരണത്തിനിടയാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ἄγγελος κυρίου എന്നതിലെ κύριος-ന്റെ പരിഭാഷയും article ഇല്ലായ്മയും
  choice: കർത്താവിന്റെ ഒരു ദൂതൻ
  alternative: കർത്താവിന്റെ ദൂതൻ
  rationale: κύριος എന്ന ദൈവിക പദവിക്ക് പതിവായ ‘കർത്താവ്’ ഉപയോഗിക്കുന്നു. ἄγγελος-ന് article ഇല്ലാത്തതിനാൽ പ്രത്യേകമായി തിരിച്ചറിയപ്പെട്ട ഏക ദൂതനെന്ന വ്യാഖ്യാനം നിർബന്ധിക്കാതെ ‘ഒരു ദൂതൻ’ എന്നു നൽകുന്നു.
- issue: ἀπολέσαι എന്നതിന്റെ മരണസൂചന
  choice: നശിപ്പിക്കാൻ
  alternative: കൊല്ലാൻ
  rationale: മൂലപദത്തിന്റെ വിശാലമായ അർഥം നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിൽ ഹെരോദാവിന്റെ ലക്ഷ്യം ശിശുവിന്റെ മരണമാണ് എന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഇതാ’ എന്ന സാഹിത്യപരമായ ശ്രദ്ധാസൂചകം മൂലത്തിലെ vividness നിലനിർത്താൻ ഉപയോഗിച്ചു; ശേഷിക്കുന്ന വാക്യഘടന സാധാരണ വായനക്കാർക്ക് എളുപ്പമാക്കി.
