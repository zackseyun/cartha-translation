id: MAT.2.15
reference: Matthew 2:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἦν ἐκεῖ ἕως τῆς τελευτῆς Ἡρῴδου· ἵνα πληρωθῇ τὸ ῥηθὲν ⸀ὑπὸ κυρίου διὰ τοῦ προφήτου λέγοντος· Ἐξ Αἰγύπτου ἐκάλεσα τὸν υἱόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/015.yaml
  text: and was there until the death of Herod[a], so that what was spoken by the Lord through the prophet might be fulfilled, saying[c][b], “Out of Egypt I called my son.”
translation:
  language: ml
  text: 'ഹെരോദാവിന്റെ മരണംവരെ അവൻ അവിടെ താമസിച്ചു. പ്രവാചകനിലൂടെ കർത്താവ് അരുളിച്ചെയ്തത്[a] നിവൃത്തിയാകേണ്ടതിനായിരുന്നു അത്: “ഈജിപ്തിൽനിന്ന് ഞാൻ എന്റെ പുത്രനെ വിളിച്ചു.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പ്രവാചകനിലൂടെ കർത്താവ് അരുളിച്ചെയ്തിരുന്നത്.”
    reason: ഗ്രീക്കിലെ ഭൂതകാല കൃദന്തരൂപം മലയാളത്തിൽ പൂർത്തഭൂതകാലഭാവത്തോടെയും സ്വാഭാവികമായി നൽകാം.
  - marker: b
    text: മത്തായി ഇവിടെ ഹോശേയ 11:1 ഉദ്ധരിക്കുന്നു. അവിടെ ‘എന്റെ പുത്രൻ’ ആദ്യം ഇസ്രായേലിനെ സൂചിപ്പിക്കുന്നു; ഇവിടെ ആ തിരുവെഴുത്ത് യേശുവിൽ നിവൃത്തിയാകുന്നതായി മത്തായി അവതരിപ്പിക്കുന്നു.
    reason: ഉദ്ധരണിയുടെ പഴയനിയമ പശ്ചാത്തലവും മത്തായിയുടെ പ്രയോഗവും വ്യക്തമാക്കുന്ന കുറിപ്പ്.
lexical_decisions:
- source_word: ἦν ἐκεῖ
  choice: അവൻ അവിടെ താമസിച്ചു
  rationale: അക്ഷരാർഥത്തിൽ ‘അവൻ അവിടെ ആയിരുന്നു’ എന്നാണെങ്കിലും, സന്ദർഭത്തിൽ തുടർന്നുള്ള വാസമാണ് സൂചിപ്പിക്കുന്നത്; ‘താമസിച്ചു’ സ്വാഭാവികമായ മലയാളത്തിൽ അതേ ആശയം നൽകുന്നു.
- source_word: ἕως τῆς τελευτῆς Ἡρῴδου
  choice: ഹെരോദാവിന്റെ മരണംവരെ
  rationale: τελευτή ഇവിടെ ജീവിതത്തിന്റെ അവസാനം, അതായത് മരണം, എന്ന അർഥത്തിലാണ്; ഗ്രീക്കിലെ നാമപദഘടനയും മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἵνα πληρωθῇ
  choice: നിവൃത്തിയാകേണ്ടതിനായിരുന്നു
  rationale: മത്തായിയുടെ നിവൃത്തി-സൂത്രത്തിലെ ഉദ്ദേശ്യ/ഫല ഭാവം നിലനിർത്തുന്നു; വെറും ‘നിവൃത്തിയായി’ എന്നു പറഞ്ഞ് ബന്ധത്തെ ലഘൂകരിക്കുന്നില്ല.
- source_word: τὸ ῥηθὲν
  choice: അരുളിച്ചെയ്തത്
  rationale: ദൈവം ആത്യന്തിക പ്രഭാഷകനായ സന്ദർഭത്തിൽ മാന്യവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗം; പറയപ്പെട്ട വചനത്തെ നാമവൽക്കരിച്ച ഗ്രീക്ക് ഘടനയും സൂക്ഷിക്കുന്നു.
- source_word: ὑπὸ κυρίου διὰ τοῦ προφήτου
  choice: പ്രവാചകനിലൂടെ കർത്താവ്
  rationale: കർത്താവിനെ വചനത്തിന്റെ ആത്യന്തിക ഉറവിടമായും പ്രവാചകനെ മാധ്യമമായും കാണിക്കുന്ന ഗ്രീക്ക് വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: Ἐξ Αἰγύπτου ἐκάλεσα
  choice: ഈജിപ്തിൽനിന്ന് ഞാൻ ... വിളിച്ചു
  rationale: ἐξ-ന്റെ പുറപ്പെടൽഭാവവും καλέω-യുടെ സാധാരണ അർഥവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: τὸν υἱόν μου
  choice: എന്റെ പുത്രനെ
  rationale: υἱός എന്നതിന്റെ പുരുഷസന്താനസൂചനയും ഹോശേയയിലെ പുത്രത്വഭാഷയും മത്തായിയുടെ പ്രയോഗവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഹോശേയ 11:1-ന്റെ നിവൃത്തിയായി യേശുവിന്റെ ഈജിപ്തിൽനിന്നുള്ള മടങ്ങിവരവ് അവതരിപ്പിക്കുന്നത്
  choice: മത്തായി പറയുന്ന ‘നിവൃത്തി’ അതേപടി നിലനിർത്തി; അതിന്റെ പ്രവർത്തനരീതി മുഖ്യവാചകത്തിൽ വിശദീകരിച്ചില്ല.
  alternative: ഇത് നേരിട്ടുള്ള പ്രവചനമെന്നോ ഇസ്രായേലിന്റെ പുത്രത്വത്തെ മശീഹാ പ്രതിരൂപപരമായി പുനരാവിഷ്കരിക്കുന്നതെന്നോ വ്യക്തമാക്കി വിവർത്തനം ചെയ്യുക.
  rationale: ഗ്രീക്ക് വാചകം നിവൃത്തി അവകാശപ്പെടുന്നുവെങ്കിലും അതിന്റെ വ്യാഖ്യാനരീതി നിർവചിക്കുന്നില്ല; അതിനാൽ ദൈവശാസ്ത്രപരമായ സംഘർഷവും അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു.
- issue: κύριος എന്ന ദൈവസംബോധന
  choice: കർത്താവ്
  alternative: യഹോവ
  rationale: ഗ്രീക്ക് പാഠത്തിൽ κύριος എന്നാണ്; അതിനാൽ ഹീബ്രു ദൈവനാമം മുഖ്യവാചകത്തിലേക്ക് തിരിച്ചുചേർക്കാതെ ‘കർത്താവ്’ എന്നു വിവർത്തനം ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘അരുളിച്ചെയ്തത്’, ‘നിവൃത്തിയാകുക’, ‘പുത്രൻ’ എന്നീ പദങ്ങൾ തിരുവെഴുത്തുസന്ദർഭത്തിന് യോജിച്ച ഗൗരവം നൽകുമ്പോഴും വാക്യം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതായി സൂക്ഷിച്ചു.
