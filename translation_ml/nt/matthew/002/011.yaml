revisions:
- from: അവർ വീട്ടിൽ കടന്നപ്പോൾ, കുഞ്ഞിനെ അവന്റെ അമ്മയായ മറിയയോടുകൂടെ കണ്ടു. അവർ നിലത്ത് വീണ് അവനെ വണങ്ങി[a]. പിന്നെ തങ്ങളുടെ ഭണ്ഡാരങ്ങൾ തുറന്ന് പൊന്ന്, കുന്തിരിക്കം, മൂർ എന്നിവ സമ്മാനങ്ങളായി അവനു സമർപ്പിച്ചു.
  to: 'അവർ വീട്ടിൽ കടന്നപ്പോൾ, കുഞ്ഞിനെ അവന്റെ അമ്മയായ മറിയയോടുകൂടെ കണ്ടു. അവർ നിലത്ത് വീണ് അവനെ വണങ്ങി[a]. പിന്നെ തങ്ങളുടെ നിധിപ്പെട്ടികൾ തുറന്ന്, അവനു സമ്മാനങ്ങൾ അർപ്പിച്ചു: പൊന്നും കുന്തിരിക്കവും മൂറും.'
  rationale: The revision clarifies the contextual force of θησαυρούς in idiomatic Malayalam and makes the three named items explicitly the gifts offered, while preserving the source sequence, the ambiguity of προσκυνέω, and the existing footnote anchor.
