id: MAT.2.11
reference: Matthew 2:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐλθόντες εἰς τὴν οἰκίαν εἶδον τὸ παιδίον μετὰ Μαρίας τῆς μητρὸς αὐτοῦ, καὶ πεσόντες προσεκύνησαν αὐτῷ, καὶ ἀνοίξαντες τοὺς θησαυροὺς αὐτῶν προσήνεγκαν αὐτῷ δῶρα, χρυσὸν καὶ λίβανον καὶ σμύρναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/011.yaml
  text: 'And when they came into the house[a], they saw the child with Mary his mother, and falling down they paid homage to him, and opening their treasures they offered him gifts: gold and frankincense and myrrh.'
translation:
  language: ml
  text: 'അവർ വീട്ടിൽ കടന്നപ്പോൾ, കുഞ്ഞിനെ അവന്റെ അമ്മയായ മറിയയോടുകൂടെ കണ്ടു. അവർ നിലത്ത് വീണ് അവനെ വണങ്ങി[a]. പിന്നെ തങ്ങളുടെ നിധിപ്പെട്ടികൾ തുറന്ന്, അവനു സമ്മാനങ്ങൾ അർപ്പിച്ചു: പൊന്നും കുന്തിരിക്കവും മൂറും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവനെ ആരാധിച്ചു.” ഗ്രീക്ക് ക്രിയയ്ക്ക് സന്ദർഭമനുസരിച്ച് ആരാധിക്കുക എന്നോ ആദരപൂർവം വണങ്ങുക എന്നോ അർഥമാകാം.
    reason: പ്രധാന ദൈവശാസ്ത്രപരവും പദാർഥപരവുമായ മറ്റൊരു വായന നിലനിർത്തുന്നു.
lexical_decisions:
- source_word: οἰκίαν
  choice: വീട്
  rationale: οἰκία ഇവിടെ ഒരു വാസസ്ഥലത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘വീട്’ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷയാണ്.
- source_word: παιδίον
  choice: കുഞ്ഞ്
  rationale: παιδίον ഒരു കുഞ്ഞിനെയോ ചെറിയ കുട്ടിയെയോ സൂചിപ്പിക്കുന്നു. പ്രായം അനാവശ്യമായി കൃത്യമാക്കാതെ മലയാളത്തിൽ സ്വാഭാവികമായി അർഥം നൽകുന്നു.
- source_word: μετὰ Μαρίας τῆς μητρὸς αὐτοῦ
  choice: അവന്റെ അമ്മയായ മറിയയോടുകൂടെ
  rationale: μετάയുടെ ‘കൂടെ’ എന്ന അർഥവും മറിയയെ അവന്റെ അമ്മയായി തിരിച്ചറിയിക്കുന്ന അനുബന്ധപ്രയോഗവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: πεσόντες
  choice: നിലത്ത് വീണ്
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള ശരീരഭാവം ലളിതമായും ദൃശ്യമായും അറിയിക്കുന്നു; ‘സാഷ്ടാംഗം പ്രണമിച്ച്’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക രൂപം ഒഴിവാക്കുന്നു.
- source_word: προσεκύνησαν
  choice: വണങ്ങി
  rationale: προσκυνέω എന്നത് സന്ദർഭമനുസരിച്ച് ആദരപൂർവം വണങ്ങുന്നതിനെയോ ആരാധിക്കുന്നതിനെയോ സൂചിപ്പിക്കാം. ‘വണങ്ങി’ ഈ സന്ദർഭത്തിലെ ആദരവും പ്രവൃത്തിയും പ്രകടമാക്കുന്നു; ശക്തമായ ആരാധനാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: θησαυροὺς
  choice: ഭണ്ഡാരങ്ങൾ
  rationale: തുറക്കാവുന്ന വിലപിടിപ്പുള്ള വസ്തുക്കളുടെ ശേഖരങ്ങളെയോ അവ സൂക്ഷിച്ചിരുന്ന ഭണ്ഡാരങ്ങളെയോ സൂചിപ്പിക്കാൻ കഴിയുന്ന വിധത്തിൽ ഗ്രീക്ക് ബഹുവചനത്തിന്റെ പരിധി നിലനിർത്തുന്നു.
- source_word: προσήνεγκαν
  choice: സമർപ്പിച്ചു
  rationale: ഔപചാരികമായി സമ്മാനം അർപ്പിക്കുന്ന പ്രവൃത്തിയെ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: δῶρα
  choice: സമ്മാനങ്ങൾ
  rationale: δῶραയുടെ അടിസ്ഥാനാർഥം വ്യക്തമായി നൽകുന്നു; ‘വഴിപാട്’ പോലുള്ള കൂടുതൽ ആരാധനാപരമായ അർഥം നിർബന്ധിക്കുന്നില്ല.
- source_word: χρυσὸν
  choice: പൊന്ന്
  rationale: χρυσός എന്നതിന് സാധാരണവും കൃത്യവുമായ മലയാളപദം.
- source_word: λίβανον
  choice: കുന്തിരിക്കം
  rationale: λίβανος സൂചിപ്പിക്കുന്ന പ്രത്യേക സുഗന്ധദ്രവ്യമായ frankincense-ന്റെ അംഗീകൃത മലയാളനാമം.
- source_word: σμύρναν
  choice: മൂർ
  rationale: σμύρνα സൂചിപ്പിക്കുന്ന myrrh-ന്റെ പ്രചാരത്തിലുള്ള മലയാള ബൈബിൾപദം.
theological_decisions:
- issue: കുഞ്ഞായ യേശുവിനോടുള്ള προσκυνέω എന്ന പ്രവൃത്തിയുടെ വിവർത്തനം
  choice: വണങ്ങി
  alternative: ആരാധിച്ചു
  rationale: മന്ത്രവാദികളുടെ പ്രവൃത്തി രാജകീയമായ ആദരമായും, വിശാലമായ ദൈവശാസ്ത്രപരമായ വായനയിൽ ആരാധനയായും ഗ്രഹിക്കാം. ഉടൻതന്നെയുള്ള സന്ദർഭം അനുവദിക്കുന്ന അർഥപരിധി ചുരുക്കാതിരിക്കാൻ പ്രധാനപാഠത്തിൽ ‘വണങ്ങി’ എന്നും ‘ആരാധിച്ചു’ എന്ന സാധ്യത അടിക്കുറിപ്പിലും നൽകിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ഗ്രീക്ക് വാക്യത്തിന്റെ ക്രമം മലയാളത്തിലെ സ്വാഭാവിക പ്രവാഹത്തിനായി മിതമായി പുനഃക്രമീകരിച്ചു. προσκυνέωയിലെ ആരാധന/രാജകീയ ആദരം എന്ന അർഥവൈവിധ്യം പ്രധാനപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
