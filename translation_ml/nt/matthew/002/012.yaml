source:
  edition: SBLGNT
  text: καὶ χρηματισθέντες κατ’ ὄναρ μὴ ἀνακάμψαι πρὸς Ἡρῴδην δι’ ἄλλης ὁδοῦ ἀνεχώρησαν εἰς τὴν χώραν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/012.yaml
  text: And having been warned in a dream not to return to Herod[b][a], they departed for their own country by another route.
translation:
  language: ml
  text: സ്വപ്നത്തിൽ മുന്നറിയിപ്പു ലഭിച്ച്[a], ഹെരോദാവിന്റെ അടുക്കലേക്കു മടങ്ങിപ്പോകരുതെന്നു അവർ മറ്റൊരു വഴിയിലൂടെ[b] സ്വന്തം നാട്ടിലേക്കു പുറപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദൈവികമായി മുന്നറിയിപ്പു ലഭിച്ച്.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് കർമണിപ്രയോഗം മുന്നറിയിപ്പ് ദൈവത്തിൽനിന്നാണെന്നു സൂചിപ്പിക്കുന്നുണ്ടെങ്കിലും ഈ വാക്യത്തിൽ ദൈവത്തെ വ്യക്തമായി പേരെടുത്തുപറയുന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘മറ്റൊരു പാതയിലൂടെ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: χρηματισθέντες
  choice: മുന്നറിയിപ്പു ലഭിച്ചതിനാൽ
  rationale: ദൈവത്തിൽനിന്നുള്ള മുന്നറിയിപ്പോ നിർദേശമോ ലഭിക്കുന്നതിനെ ഈ സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്ന കർമണിപ്രയോഗമാണിത്. ദൈവിക ഉറവിടം സന്ദർഭത്തിൽ സൂചിതമാണെങ്കിലും വാക്യത്തിൽ ദൈവത്തെ വ്യക്തമായി പേരെടുത്തുപറയാത്തതിനാൽ പ്രധാന പാഠത്തിൽ അതു ചേർത്തിട്ടില്ല.
- source_word: κατ’ ὄναρ
  choice: സ്വപ്നത്തിൽ
  rationale: സ്വപ്നത്തിലൂടെ ലഭിച്ച വെളിപ്പെടുത്തലിനെ സൂചിപ്പിക്കുന്ന മത്തായിയുടെ പ്രയോഗത്തിന് സ്വാഭാവികവും വ്യക്തവുമായ മലയാളം.
- source_word: μὴ ἀνακάμψαι
  choice: മടങ്ങിപ്പോകരുതെന്ന്
  rationale: μή ചേർന്ന അനന്തക്രിയ മുന്നറിയിപ്പിന്റെ ഉള്ളടക്കം നൽകുന്നു; യാത്രാസന്ദർഭത്തിൽ ‘മടങ്ങിപ്പോകരുത്’ സ്വാഭാവികമാണ്.
- source_word: πρὸς Ἡρῴδην
  choice: ഹെരോദാവിന്റെ അടുക്കലേക്ക്
  rationale: πρός ഇവിടെ ഒരു വ്യക്തിയുടെ അടുത്തേക്കുള്ള ചലനത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: δι’ ἄλλης ὁδοῦ
  choice: മറ്റൊരു വഴിയിലൂടെ
  rationale: യാത്രാസന്ദർഭത്തിലെ വേറൊരു വഴി അഥവാ പാത എന്ന മൂർത്തമായ അർഥം ലളിതമായി നൽകുന്നു.
- source_word: ἀνεχώρησαν
  choice: പുറപ്പെട്ടു
  rationale: പിൻവാങ്ങുക, വിട്ടുപോകുക, പുറപ്പെടുക എന്നീ അർഥങ്ങളുള്ള ക്രിയയ്ക്ക് ഈ യാത്രാവിവരണത്തിൽ ‘പുറപ്പെട്ടു’ യോജിക്കുന്നു.
- source_word: εἰς τὴν χώραν αὐτῶν
  choice: സ്വന്തം നാട്ടിലേക്ക്
  rationale: χώρα ദേശം, നാട്, പ്രദേശം എന്നിവയെ സൂചിപ്പിക്കാം; αὐτῶν നൽകുന്ന സ്വന്തമെന്ന ആശയവും മടങ്ങുന്ന ലക്ഷ്യസ്ഥാനവും ഈ പ്രയോഗം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: മുന്നറിയിപ്പിന്റെ സൂചിതമായ ദൈവിക ഉറവിടം
  choice: കർമണിപ്രയോഗമായ ‘മുന്നറിയിപ്പു ലഭിച്ചതിനാൽ’ എന്നു പരിഭാഷപ്പെടുത്തി; പ്രധാന പാഠത്തിൽ ‘ദൈവത്തിൽനിന്ന്’ എന്നു ചേർത്തില്ല.
  alternative: ‘ദൈവിക മുന്നറിയിപ്പു ലഭിച്ചതിനാൽ’ അല്ലെങ്കിൽ ‘ദൈവത്തിൽനിന്ന് മുന്നറിയിപ്പു ലഭിച്ചതിനാൽ’.
  rationale: χρηματισθέντες എന്ന കർമണി സന്ദർഭത്തിൽ ദൈവിക പ്രവർത്തനത്തെ ശക്തമായി സൂചിപ്പിക്കുന്നു. എങ്കിലും ഈ വാക്യം ദൈവത്തെ കർത്താവായി വ്യക്തമായി പേരെടുത്തുപറയാത്തതിനാൽ സൂചന നിലനിർത്തുകയും വ്യക്തമല്ലാത്ത കർത്താവിനെ പാഠത്തിൽ ചേർക്കാതിരിക്കുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്കു വ്യക്തമായ, മാന്യമായ ആഖ്യാനശൈലി. ‘അരുളപ്പാടു ലഭിച്ചു’ പോലുള്ള പഴയ സഭാപദപ്രയോഗത്തിനു പകരം ‘മുന്നറിയിപ്പു ലഭിച്ചു’ ഉപയോഗിച്ചു; ദൈവിക പ്രവർത്തനത്തിന്റെ സൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
