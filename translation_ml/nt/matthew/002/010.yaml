id: MAT.2.10
reference: Matthew 2:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἰδόντες δὲ τὸν ἀστέρα ἐχάρησαν χαρὰν μεγάλην σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/010.yaml
  text: And when they saw the star[a], they rejoiced with exceedingly great joy.
translation:
  language: ml
  text: അവർ ആ നക്ഷത്രം കണ്ടപ്പോൾ, അവർ അത്യന്തം വലിയ സന്തോഷത്തോടെ ആനന്ദിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ, ‘അവർ അത്യന്തം വലിയ സന്തോഷം സന്തോഷിച്ചു’; ഇത് വളരെ ശക്തമായ ഊന്നൽ നൽകുന്ന പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: കണ്ടപ്പോൾ
  rationale: ὁράω എന്ന ക്രിയയുടെ ഭൂതകാല കൃദന്തരൂപം ഇവിടെ മുഖ്യക്രിയയ്ക്കു മുമ്പുള്ള സമയബന്ധം സൂചിപ്പിക്കുന്നു. ‘കണ്ടപ്പോൾ’ ആ ബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തില്ല
  rationale: ഇവിടെ δέ ശക്തമായ വൈരുധ്യമല്ല, കഥ മുന്നോട്ടുകൊണ്ടുപോകുന്ന മൃദുവായ ബന്ധകമാണ്. മലയാളത്തിൽ വാക്യക്രമംതന്നെ ഈ ബന്ധം സ്വാഭാവികമായി നൽകുന്നതിനാൽ ‘എന്നാൽ’ പോലൊരു അനാവശ്യ വൈരുധ്യം ഒഴിവാക്കി.
- source_word: τὸν ἀστέρα
  choice: ആ നക്ഷത്രം
  rationale: ἀστήρ എന്നത് ‘നക്ഷത്രം’ എന്നാണ്. മുമ്പ് പരാമർശിച്ച നിർദിഷ്ട നക്ഷത്രമാണെന്നത് ‘ആ’ വ്യക്തമാക്കുന്നു.
- source_word: ἐχάρησαν
  choice: ആനന്ദിച്ചു
  rationale: χαίρω എന്ന ക്രിയയുടെ ഈ രൂപത്തിന് ഇവിടെ സജീവമായ അർത്ഥമാണ്. ‘ആനന്ദിച്ചു’ അതിന്റെ ക്രിയാത്മക ശക്തിയും ഗൗരവമുള്ള ശൈലിയും നിലനിർത്തുന്നു.
- source_word: χαρὰν μεγάλην σφόδρα
  choice: അത്യധികം ആനന്ദിച്ചു
  rationale: ക്രിയയോട് സമാനമൂലമുള്ള നാമവും μεγάλην, σφόδρα എന്നീ തീവ്രതാസൂചകങ്ങളും ചേർന്ന് അതിശക്തമായ ആനന്ദം ഊന്നിപ്പറയുന്നു. ഗ്രീക്കിലെ പദാവർത്തനം യാന്ത്രികമായി പകർത്താതെ ‘അത്യധികം’ എന്ന പ്രയോഗം ആ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വിവർത്തനം. ഗ്രീക്കിലെ cognate accusative മലയാളത്തിൽ അസ്വാഭാവികമാകാതിരിക്കാൻ അർത്ഥപരമായ ഊന്നൽ ‘അത്യധികം’ എന്നതിലൂടെ പ്രകടിപ്പിച്ചു; അക്ഷരാർഥഘടന അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
