id: MAT.2.9
reference: Matthew 2:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες τοῦ βασιλέως ἐπορεύθησαν, καὶ ἰδοὺ ὁ ἀστὴρ ὃν εἶδον ἐν τῇ ἀνατολῇ προῆγεν αὐτούς, ἕως ἐλθὼν ⸀ἐστάθη ἐπάνω οὗ ἦν τὸ παιδίον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/009.yaml
  text: After hearing the king[a], they went on their way, and behold, the star that they had seen in the east went before them until it came and stood over where the child was.
translation:
  language: ml
  text: അവർ രാജാവിന്റെ വാക്കു കേട്ടശേഷം യാത്ര തിരിച്ചു. അപ്പോൾ, ഇതാ, കിഴക്കിൽ[a] അവർ കണ്ടിരുന്ന നക്ഷത്രം അവരുടെ മുമ്പായി സഞ്ചരിച്ചു; ഒടുവിൽ അത് വന്ന് ശിശു ഉണ്ടായിരുന്ന സ്ഥലത്തിനുമീതെ നിന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കിഴക്കിൽ” എന്നതിന് പകരം “അതിന്റെ ഉദയസമയത്ത്” എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്ക് പ്രയോഗം കിഴക്ക് എന്ന പ്രദേശത്തെയോ ദിശയെയോ, ഒരു നക്ഷത്രത്തിന്റെ ഉദയത്തെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσαντες τοῦ βασιλέως
  choice: രാജാവിന്റെ വാക്കു കേട്ടശേഷം
  rationale: ἀκούω എന്ന ക്രിയയോടുകൂടിയ ജനിറ്റീവ് കേൾക്കപ്പെട്ട വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘രാജാവിനെ കേട്ടശേഷം’ എന്നതിനെക്കാൾ സ്വാഭാവികമായി അർഥം വ്യക്തമാക്കാൻ ‘രാജാവിന്റെ വാക്കു കേട്ടശേഷം’ എന്നു നൽകി; രാജാവ് ഹെരോദാവാണെന്ന് വാക്യത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: ἐπορεύθησαν
  choice: യാത്രയായി
  rationale: പുറപ്പെട്ട് മുന്നോട്ടുപോയെന്ന ആഖ്യാനചലനം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: ἰδοὺ
  choice: അപ്പോൾ ഇതാ
  rationale: അപ്രതീക്ഷിതമായ ദൃശ്യത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗ്രീക്ക് വ്യവഹാരചിഹ്നത്തിന്റെ ആഖ്യാനസജീവത നിലനിർത്തുന്നു.
- source_word: ὁ ἀστὴρ ὃν εἶδον
  choice: അവർ ... കണ്ടിരുന്ന നക്ഷത്രം
  rationale: നക്ഷത്രത്തെ മുമ്പ് കണ്ടിരുന്നു എന്ന മുൻകാലബന്ധം മലയാളത്തിലെ ‘കണ്ടിരുന്ന’ എന്ന രൂപം വ്യക്തമാക്കുന്നു.
- source_word: ἐν τῇ ἀνατολῇ
  choice: കിഴക്കു
  rationale: പ്രയോഗത്തിന് ‘കിഴക്കൻ പ്രദേശത്ത്’ എന്നും ‘ഉദിച്ചപ്പോൾ’ എന്നും അർഥസാധ്യതയുണ്ട്. മുഖ്യപാഠത്തിൽ പരിചിതമായ ഭൂമിശാസ്ത്രപരമായ അർഥം നൽകി, ജ്യോതിശാസ്ത്രപരമായ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: προῆγεν αὐτούς
  choice: അവർക്കു മുമ്പായി നീങ്ങി
  rationale: നക്ഷത്രം അവരുടെ മുമ്പിലൂടെ പോയി എന്ന ദൃശ്യബിംബം നിലനിർത്തുന്നു; അത് എങ്ങനെ വഴികാട്ടി എന്നതിനെ അനാവശ്യമായി നിർവചിക്കുന്നില്ല.
- source_word: ἕως ἐλθὼν ἐστάθη
  choice: ഒടുവിൽ അത് ... വന്നു നിന്നു
  rationale: വന്നെത്തിയശേഷം നിൽക്കുക എന്ന ഗ്രീക്ക് ക്രമം സ്വാഭാവിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: ἐπάνω οὗ ἦν τὸ παιδίον
  choice: ശിശു ഉണ്ടായിരുന്ന സ്ഥലത്തിനുമീതെ
  rationale: ബന്ധസൂചകമായ ഗ്രീക്ക് പ്രയോഗത്തെ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു; παιδίον എന്നതിന് അധിക പ്രായനിർണ്ണയം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: നക്ഷത്രവിവരണത്തിലെ ἐν τῇ ἀνατολῇ എന്നതിന്റെ അർഥം
  choice: കിഴക്കു
  alternative: അത് ഉദിച്ചപ്പോൾ
  rationale: ഗ്രീക്ക് പ്രയോഗം ദിശയെയോ പ്രദേശത്തെയോ സൂചിപ്പിക്കാം; ഒരു നക്ഷത്രത്തിന്റെ ഉദയത്തെയും സൂചിപ്പിക്കാം. വാക്യം ഈ വ്യാഖ്യാനവ്യത്യാസം നിർബന്ധമായി തീർപ്പാക്കാത്തതിനാൽ മുഖ്യപാഠത്തിൽ സാധാരണ വായനയും അടിക്കുറിപ്പിൽ മറ്റൊരു യഥാർഥ സാധ്യതയും നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ ഗൗരവമുള്ള ആഖ്യാനശൈലി. ‘ഇതാ’ നിലനിർത്തി മൂലത്തിലെ ശ്രദ്ധാകർഷകത സംരക്ഷിച്ചു. അടിക്കുറിപ്പ് സൂചകം ബന്ധപ്പെട്ട ‘കിഴക്കു’ എന്ന പദത്തിനരികിലല്ലാതെ വാക്യാവസാനത്തിലാണ് നൽകിയിരിക്കുന്നത്; പ്രസിദ്ധീകരണശൈലിയിൽ ആവശ്യമെങ്കിൽ അത് ‘കിഴക്കു[a]’ എന്നിടത്തേക്ക് മാറ്റുന്നത് കൂടുതൽ കൃത്യമായിരിക്കും.
