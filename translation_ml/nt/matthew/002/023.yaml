id: MAT.2.23
reference: Matthew 2:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν κατῴκησεν εἰς πόλιν λεγομένην Ναζαρέτ, ὅπως πληρωθῇ τὸ ῥηθὲν διὰ τῶν προφητῶν ὅτι Ναζωραῖος κληθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/023.yaml
  text: 'And he came and lived in a city called Nazareth[a], so that what was spoken through the prophets might be fulfilled: “He will be called a Nazarene.”'
translation:
  language: ml
  text: പ്രവാചകന്മാരിലൂടെ അരുളിച്ചെയ്യപ്പെട്ട, “അവൻ നസറായൻ[a] എന്നു വിളിക്കപ്പെടും” എന്ന വചനം നിവൃത്തിയാകേണ്ടതിന്, അവൻ വന്ന് നസറെത്ത് എന്നു വിളിക്കപ്പെടുന്ന ഒരു പട്ടണത്തിൽ താമസമാക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നസോരായൻ.” “അവൻ നസറായൻ എന്നു വിളിക്കപ്പെടും” എന്ന വാക്കുകളുടെ കൃത്യമായ പ്രവാചകപശ്ചാത്തലം വിവാദവിഷയമാണ്. മത്തായി ഒരൊറ്റ വാക്യം ഉദ്ധരിക്കുന്നതിനുപകരം പ്രവാചകന്മാരിലെ ചില പ്രമേയങ്ങൾ സംഗ്രഹിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: അവൻ വന്ന്
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള സംഭവക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ സംയോജക ക്രിയാവിശേഷണരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: κατῴκησεν
  choice: താമസമാക്കി
  rationale: അവിടെ വസിക്കാൻ തുടങ്ങി എന്ന κατοικέωയുടെ ആശയം ആധുനികവും സ്വാഭാവികവുമായി നൽകുന്നു; അതിരുകടന്ന സ്ഥിരത സൂചിപ്പിക്കുന്നില്ല.
- source_word: εἰς πόλιν λεγομένην Ναζαρέτ
  choice: നസറെത്ത് എന്നു വിളിക്കപ്പെടുന്ന ഒരു പട്ടണത്തിൽ
  rationale: κατοικέωയോടൊപ്പമുള്ള εἰς ലക്ഷ്യസ്ഥാനത്തുള്ള താമസത്തെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ സ്ഥാനവിഭക്തി സ്വാഭാവികം; πόλις എന്നതിന് ‘പട്ടണം’ സാധാരണ വായനക്കാർക്ക് യോജിക്കുന്നു.
- source_word: ὅπως πληρωθῇ
  choice: അങ്ങനെ ... നിവൃത്തിയായി
  rationale: മത്തായിയുടെ നിവൃത്തി-സൂത്രത്തിലെ ഉദ്ദേശ്യം/ഫലം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; ഗ്രീക്കിലെ ദൈവിക പദ്ധതിയുടെ ദിശ നിലനിർത്തുന്നു.
- source_word: τὸ ῥηθὲν διὰ τῶν προφητῶν
  choice: പ്രവാചകന്മാരിലൂടെ അരുളിച്ചെയ്യപ്പെട്ടത്
  rationale: διάയുടെ മധ്യസ്ഥതാസൂചനയും പ്രവാചകന്മാർ എന്ന ബഹുവചനവും നിലനിർത്തുന്നു; ‘അരുളിച്ചെയ്യപ്പെട്ടത്’ ദൈവിക വചനസന്ദർഭത്തിന് യോജിച്ച മാന്യമായ പ്രയോഗമാണ്.
- source_word: Ναζωραῖος
  choice: നസറായൻ
  rationale: നസറെത്തുമായുള്ള ബന്ധം സൂചിപ്പിക്കുന്ന പരമ്പരാഗതവും മനസ്സിലാക്കാവുന്നതുമായ മലയാള designation; രൂപപരമായ മറ്റൊരു ലിപ്യന്തരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: κληθήσεται
  choice: വിളിക്കപ്പെടും
  rationale: ഭാവികാല കർമണിപ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഒരൊറ്റ പഴയനിയമവാക്യവുമായി കൃത്യമായി പൊരുത്തപ്പെടാത്ത നിവൃത്തി-ഉദ്ധരണിയുടെ സ്വഭാവം
  choice: ‘പ്രവാചകന്മാരിലൂടെ’ എന്ന ബഹുവചനം നിലനിർത്തി, പ്രധാനപാഠത്തിൽ പ്രത്യേക ഉറവിടം നിർണ്ണയിക്കാതെ അവതരിപ്പിച്ചു.
  alternative: യെശയ്യാവ് 11:1-ലെ ‘മുള’ എന്ന പദത്തോടുള്ള ശബ്ദസാദൃശ്യമെന്നോ, മശീഹയുടെ താഴ്മയെക്കുറിച്ചുള്ള പ്രവാചകവിഷയങ്ങളുടെ സംഗ്രഹമെന്നോ വ്യാഖ്യാനിക്കുക.
  rationale: ഗ്രീക്ക് പാഠം പ്രവാചകന്മാരെ ബഹുവചനത്തിൽ പറയുന്നു; അതിനാൽ വിവാദമായ ഒരു പ്രത്യേക പശ്ചാത്തലം പരിഭാഷയിൽ നിർബന്ധിച്ച് ചേർക്കാതെ മത്തായിയുടെ അവ്യക്തത സംരക്ഷിക്കുന്നു.
- issue: Ναζωραῖος എന്ന പദത്തിന്റെ അർഥം
  choice: നസറായൻ
  alternative: നസോരായൻ; നാസീർവ്രതക്കാരൻ
  rationale: സന്ദർഭത്തിൽ ഈ designation നസറെത്ത് പട്ടണവുമായി ബന്ധപ്പെട്ടു നിൽക്കുന്നു. നാസീർവ്രതക്കാരൻ എന്നത് വേറൊരു പദവും ആശയവുമാകയാൽ സ്വീകരിച്ചില്ല; കൂടുതൽ രൂപസാമ്യമുള്ള ‘നസോരായൻ’ അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘നിവൃത്തിയായി’, ‘അരുളിച്ചെയ്യപ്പെട്ടത്’ എന്നീ പരിചിത ബൈബിൾപദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന ലളിതമാക്കി. ‘പ്രവാചകന്മാരിലൂടെ’ എന്നത് ഗ്രീക്കിലെ ബഹുവചനവും മധ്യസ്ഥതാസൂചനയും സംരക്ഷിക്കുന്നു.
