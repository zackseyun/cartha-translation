id: MAT.2.3
reference: Matthew 2:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ⸂ὁ βασιλεὺς Ἡρῴδης⸃ ἐταράχθη καὶ πᾶσα Ἱεροσόλυμα μετ’ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/003.yaml
  text: When King Herod heard this[a], he was troubled[b], and all Jerusalem with him.
translation:
  language: ml
  text: ഹെരോദാരാജാവ് ഇതു കേട്ടപ്പോൾ കലങ്ങി[a]; അവനോടൊപ്പം യെരൂശലേം മുഴുവനും കലങ്ങി.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അസ്വസ്ഥനായി.”
    reason: lexical_alternative
  - marker: b
    text: “യെരൂശലേം മുഴുവനും” എന്നത് നഗരനാമം അവിടത്തെ നിവാസികളെ സൂചിപ്പിക്കാൻ ഉപയോഗിക്കുന്ന പ്രയോഗമാണ്; നഗരത്തിൽ പൊതുവായി പടർന്ന ആശങ്കയെ വിവരിക്കുന്ന സാമാന്യമായതോ അതിശയോക്തിപരമായതോ ആയ പ്രസ്താവനയായിരിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας δὲ
  choice: ഇതു കേട്ടപ്പോൾ
  rationale: അയോറിസ്റ്റ് കൃതന്തത്തിന്റെ കാലസൂചന സ്വാഭാവികമായ മലയാള ഉപവാക്യമായി നൽകി. ‘ഇതു’ എന്നത് തൊട്ടുമുമ്പുള്ള ജ്ഞാനികളുടെ വാർത്തയെ സൂചിപ്പിക്കുന്നു; δέ വേറൊരു പദമായി നിർബന്ധിച്ച് പരിഭാഷപ്പെടുത്താതെ വാക്യത്തിന്റെ മുന്നോട്ടുള്ള നീക്കത്തിൽ ഉൾപ്പെടുത്തി.
- source_word: ὁ βασιλεὺς Ἡρῴδης
  choice: ഹെരോദാവ് രാജാവ്
  rationale: രാജപദവിയും വ്യക്തിനാമവും നിലനിർത്തുന്ന, മലയാളത്തിൽ സ്വാഭാവികമായ രൂപം.
- source_word: ἐταράχθη
  choice: അസ്വസ്ഥനായി / അസ്വസ്ഥമായി
  rationale: ταράσσω സൂചിപ്പിക്കുന്ന ഉള്ളിലെ കലക്കം, ആശങ്ക, ഭയം എന്നിവയിൽ ഒന്നിനെ മാത്രം അതിരുകടന്ന് നിർണ്ണയിക്കാതെ പൊതുവായ മാനസിക അസ്വസ്ഥത പ്രകടിപ്പിക്കുന്നു.
- source_word: πᾶσα Ἱεροσόλυμα
  choice: യെരൂശലേം മുഴുവനും
  rationale: നഗരനാമം അവിടത്തെ നിവാസികളെ പ്രതിനിധീകരിക്കുന്ന മൂലപാഠത്തിലെ ലക്ഷണപ്രയോഗം നിലനിർത്തുന്നു; ‘ജനങ്ങൾ’ എന്ന വ്യാഖ്യാനപദം മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: μετ’ αὐτοῦ
  choice: അവനോടൊപ്പം
  rationale: ഹെരോദാവിന്റെ അസ്വസ്ഥതയോടൊപ്പം യെരൂശലേമിന്റെയും പ്രതികരണം ബന്ധിപ്പിക്കുന്ന μετάയുടെ അർഥം നേരിട്ട് നൽകുന്നു.
theological_decisions:
- issue: πᾶσα Ἱεροσόλυμα എന്നതിന്റെ വ്യാപ്തി
  choice: നഗരത്തെയും അതിലെ നിവാസികളെയും സമഗ്രമായി സൂചിപ്പിക്കുന്ന ലക്ഷണപ്രയോഗം
  alternative: യെരൂശലേമിലെ അനേകർ എന്ന അതിശയോക്തിപരമായ അർഥം, അല്ലെങ്കിൽ പ്രത്യേകിച്ച് നഗരത്തിലെ നേതൃത്വവൃത്തങ്ങൾ
  rationale: ഗ്രീക്ക് പാഠം നഗരത്തെ മുഴുവനായി പേരെടുത്തുപറയുന്നു. അതിനാൽ ആരെല്ലാം ഉൾപ്പെടുന്നു എന്നു കൂടുതൽ ചുരുക്കുകയോ വിശദീകരിക്കുകയോ ചെയ്യാതെ ആ വിവരണത്തിലെ വ്യാപ്തിയും സംഘർഷവും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ἐταράχθη എന്ന ഒരേ ഗ്രീക്ക് ക്രിയയുടെ ആവർത്തിക്കാത്ത പ്രയോഗം മലയാളത്തിൽ ഇരുവിഭാഗത്തോടും വ്യക്തമായി ബന്ധിപ്പിക്കാൻ ‘അസ്വസ്ഥനായി/അസ്വസ്ഥമായി’ എന്ന് ആവർത്തിച്ചു; ലിംഗ-വചന യോജിപ്പിനനുസരിച്ച് രൂപം മാറ്റി.
