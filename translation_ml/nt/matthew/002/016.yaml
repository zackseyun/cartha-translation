id: MAT.2.16
reference: Matthew 2:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τότε Ἡρῴδης ἰδὼν ὅτι ἐνεπαίχθη ὑπὸ τῶν μάγων ἐθυμώθη λίαν, καὶ ἀποστείλας ἀνεῖλεν πάντας τοὺς παῖδας τοὺς ἐν Βηθλέεμ καὶ ἐν πᾶσι τοῖς ὁρίοις αὐτῆς ἀπὸ διετοῦς καὶ κατωτέρω, κατὰ τὸν χρόνον ὃν ἠκρίβωσεν παρὰ τῶν μάγων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/016.yaml
  text: Then Herod[a], seeing that he had been tricked by the magi, became very angry, and sending men, he killed all the boys in Bethlehem and in all its surrounding districts, from two years old and under[b], according to the time that he had determined from the magi.
translation:
  language: ml
  text: അപ്പോൾ ഹെരോദാവ്, മാഗികൾ[a] തന്നെ വഞ്ചിച്ചെന്നു[b] മനസ്സിലാക്കിയപ്പോൾ, അത്യന്തം കോപിച്ചു. അവൻ ആളുകളെ അയച്ച്, ബെത്‌ലഹേമിലെയും അതിന്റെ ചുറ്റുമുള്ള എല്ലാ പ്രദേശങ്ങളിലെയും രണ്ടു വയസ്സും അതിൽ താഴെയും പ്രായമുള്ള എല്ലാ ആൺകുട്ടികളെയും, മാഗികളിൽനിന്ന് അവൻ കൃത്യമായി മനസ്സിലാക്കിയ സമയത്തിനനുസരിച്ച്, കൊന്നുകളഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പരമ്പരാഗതമായി ‘ജ്ഞാനികൾ.’ ഗ്രീക്കിലെ ‘മാഗികൾ’ എന്ന പദം കിഴക്കുനിന്നുള്ള ജ്യോതിഷ-പണ്ഡിതന്മാരെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: b
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, ‘തന്നെ പരിഹസിച്ചെന്നു’ അഥവാ ‘തന്നെ വിഡ്ഢിയാക്കിയെന്നു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: അപ്പോൾ
  rationale: സംഭവക്രമത്തിലെ അടുത്ത ഘട്ടം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἰδὼν ὅτι
  choice: മനസ്സിലാക്കിയ
  rationale: ഇവിടെ ദൃശ്യമായി കാണുക എന്നതിലുപരി ഒരു വസ്തുത തിരിച്ചറിയുക എന്ന ആശയമാണ്; കാരണബന്ധവും നിലനിർത്തുന്നു.
- source_word: ἐνεπαίχθη
  choice: കബളിപ്പിച്ചെന്ന്
  rationale: മാഗികൾ മടങ്ങിവരാതിരുന്നതിലൂടെ ഹെരോദാവിനെ വിഡ്ഢിയാക്കിയെന്ന സന്ദർഭാർഥം വ്യക്തമായി നൽകുന്നു; കൂടുതൽ അക്ഷരാർഥമായ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: μάγων
  choice: മാഗികൾ
  rationale: കിഴക്കൻ ജ്യോതിഷ-പണ്ഡിതന്മാരെ സൂചിപ്പിക്കുന്ന പ്രത്യേക ഗ്രീക്ക് പദം നിലനിർത്തുന്നു; പരമ്പരാഗതമായ ‘ജ്ഞാനികൾ’ എന്നത് മാത്രം ഉപയോഗിച്ച് ചരിത്ര-സാംസ്കാരിക സ്വഭാവം മങ്ങിക്കുന്നത് ഒഴിവാക്കുന്നു.
- source_word: ἐθυμώθη λίαν
  choice: അത്യന്തം കോപിച്ചു
  rationale: കോപത്തിന്റെ ശക്തി λίαν എന്ന തീവ്രതാസൂചകത്തോടുകൂടെ നേരായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: ἀποστείλας
  choice: ആളുകളെ അയച്ച്
  rationale: കൊല നടത്താൻ പ്രതിനിധികളെ അയച്ചുവെന്ന സന്ദർഭത്തിൽ അന്തർലീനമായ കർമ്മം മലയാളത്തിൽ വ്യക്തമായി പറയുന്നു.
- source_word: ἀνεῖλεν
  choice: കൊന്നുകളഞ്ഞു
  rationale: കൊല്ലുക/ജീവൻ ഇല്ലാതാക്കുക എന്ന അർഥം നേരിട്ടും ഗൗരവത്തോടെയും നൽകുന്നു.
- source_word: πάντας τοὺς παῖδας
  choice: എല്ലാ ആൺകുഞ്ഞുങ്ങളെയും
  rationale: ഈ സന്ദർഭത്തിൽ ലക്ഷ്യമാക്കപ്പെട്ടത് ആൺകുട്ടികളാണെന്ന വിവരണാർഥം വ്യക്തമാക്കുന്നു; ചെറിയ പ്രായപരിധിക്ക് ‘ആൺകുഞ്ഞുങ്ങൾ’ സ്വാഭാവികമാണ്.
- source_word: ἐν Βηθλέεμ καὶ ἐν πᾶσι τοῖς ὁρίοις αὐτῆς
  choice: ബെത്‌ലഹേമിലും അതിന്റെ ചുറ്റുമുള്ള എല്ലാ പ്രദേശങ്ങളിലുമുള്ള
  rationale: ὅρια എന്നത് ഇവിടെ അതിർത്തിരേഖകളേക്കാൾ ചുറ്റുപാടുകളെയോ സമീപപ്രദേശങ്ങളെയോ സൂചിപ്പിക്കുന്നു.
- source_word: ἀπὸ διετοῦς καὶ κατωτέρω
  choice: രണ്ടു വയസ്സോ അതിൽ താഴെയോ പ്രായമുള്ള
  rationale: രണ്ടു വയസ്സ് ഉൾപ്പെടുന്ന പരമാവധി പ്രായപരിധി സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി വ്യക്തമാക്കുന്നു.
- source_word: κατὰ τὸν χρόνον ὃν ἠκρίβωσεν παρὰ τῶν μάγων
  choice: മാഗികളിൽനിന്ന് അവൻ കൃത്യമായി മനസ്സിലാക്കിയ സമയത്തിന്റെ അടിസ്ഥാനത്തിലായിരുന്നു ഇത്
  rationale: അവരിൽനിന്ന് അന്വേഷിച്ചറിഞ്ഞ സമയവിവരമാണ് പ്രായപരിധിയുടെ അടിസ്ഥാനമെന്ന ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: μάγοι എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: മാഗികൾ
  alternative: ജ്ഞാനികൾ
  rationale: പ്രത്യേക ചരിത്ര-സാംസ്കാരിക വിഭാഗത്തെ സൂചിപ്പിക്കുന്ന മൂലപദം നിലനിർത്തുന്നു; പിന്നീട് രൂപപ്പെട്ട പരമ്പരാഗത ചിത്രീകരണങ്ങൾ പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: ἐνεπαίχθη എന്ന പദത്തിന്റെ സന്ദർഭാർഥം
  choice: കബളിപ്പിച്ചെന്ന്
  alternative: പരിഹസിച്ചെന്ന് / വിഡ്ഢിയാക്കിയെന്ന്
  rationale: മാഗികൾ മടങ്ങിവരാതെ ഹെരോദാവിന്റെ പദ്ധതി പരാജയപ്പെടുത്തിയതിലൂടെ അവൻ കബളിപ്പിക്കപ്പെട്ടുവെന്ന സന്ദർഭാർഥം വായനാസൗകര്യത്തോടെ നൽകുന്നു; ‘പരിഹസിച്ചു’ എന്ന അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. നീണ്ട ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി മൂന്ന് വാക്യങ്ങളാക്കി; അവസാന വാക്യം പ്രായപരിധിയും മാഗികളിൽനിന്ന് അറിഞ്ഞ സമയവും തമ്മിലുള്ള ബന്ധം വ്യക്തമാക്കുന്നു. വ്യക്തിനാമങ്ങൾ ‘ഹെരോദാവ്,’ ‘ബെത്‌ലഹേം’ എന്ന പ്രചാരത്തിലുള്ള മലയാളരൂപങ്ങളിൽ നൽകി.
