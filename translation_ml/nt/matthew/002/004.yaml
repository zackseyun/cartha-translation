id: MAT.2.4
reference: Matthew 2:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ συναγαγὼν πάντας τοὺς ἀρχιερεῖς καὶ γραμματεῖς τοῦ λαοῦ ἐπυνθάνετο παρ’ αὐτῶν ποῦ ὁ χριστὸς γεννᾶται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/004.yaml
  text: And gathering together all the chief priests and scribes of the people[a], he was inquiring of them where the Messiah was to be born.
translation:
  language: ml
  text: അവൻ ജനത്തിന്റെ മുഖ്യപുരോഹിതന്മാരെയും ശാസ്ത്രിമാരെയും എല്ലാവരെയും ഒരുമിച്ചുകൂട്ടി, മശീഹാ[a] ജനിക്കേണ്ടത് എവിടെയാണെന്ന് അവരോട് അന്വേഷിക്കുകയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ക്രിസ്തു.” ഗ്രീക്കിലെ Χριστός എന്ന പദവിക്ക് “അഭിഷിക്തൻ” എന്നാണ് അർഥം; ഇവിടത്തെ യഹൂദ മശീഹാപരമായ പശ്ചാത്തലം വ്യക്തമാക്കാൻ മുഖ്യപാഠത്തിൽ “മശീഹാ” എന്നു നൽകിയിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: συναγαγὼν
  choice: ഒരുമിച്ചുകൂട്ടി
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള aorist participle സൂചിപ്പിക്കുന്ന മുൻകൃത്യം സ്വാഭാവികമായ മലയാളത്തിൽ ക്രിയാവിനയെച്ചമായി അവതരിപ്പിക്കുന്നു.
- source_word: πάντας
  choice: എല്ലാ
  rationale: പുരോഹിത-ശാസ്ത്രിനേതൃത്വത്തിന്റെ സമഗ്രത വ്യക്തമാക്കുന്ന ഗ്രീക്ക് പദത്തിന്റെ നേരിട്ടുള്ള തുല്യപ്രയോഗം.
- source_word: ἀρχιερεῖς
  choice: മുഖ്യപുരോഹിതന്മാർ
  rationale: ഒന്നിലധികം മഹാപുരോഹിതന്മാർ എന്ന അർഥം വരാതിരിക്കാനും മുതിർന്ന പുരോഹിതനേതൃത്വത്തെ സൂചിപ്പിക്കാനും അനുയോജ്യം.
- source_word: γραμματεῖς
  choice: ശാസ്ത്രിമാർ
  rationale: തിരുവെഴുത്തും മതനിയമവും കൈകാര്യം ചെയ്തിരുന്ന പണ്ഡിതവർഗത്തെ സൂചിപ്പിക്കുന്ന, മലയാളത്തിൽ പരിചിതമായ നേരിട്ടുള്ള പദം.
- source_word: τοῦ λαοῦ
  choice: ജനത്തിന്റെ
  rationale: വംശീയ വിശദീകരണം കൂട്ടിച്ചേർക്കാതെ ഗ്രീക്കിലെ genitive ബന്ധം നിലനിർത്തുന്നു.
- source_word: ἐπυνθάνετο παρ’ αὐτῶν
  choice: അവരോട് അന്വേഷിക്കുകയായിരുന്നു
  rationale: വിവരം ചോദിച്ചറിയുക എന്ന അർഥവും imperfect ക്രിയയുടെ തുടരുന്ന ഭൂതകാലഭാവവും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: ποῦ
  choice: എവിടെയാണെന്ന്
  rationale: പരോക്ഷചോദ്യത്തിന് സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: ὁ χριστὸς
  choice: മശീഹാ
  rationale: ഇവിടെ പ്രതീക്ഷിക്കപ്പെട്ട അഭിഷിക്തനായ ഭരണാധികാരിയെ സൂചിപ്പിക്കുന്ന പദവിയായതിനാൽ യഹൂദ മശീഹാപരമായ പശ്ചാത്തലം നിലനിർത്തുന്നു.
- source_word: γεννᾶται
  choice: ജനിക്കേണ്ടത്
  rationale: പരോക്ഷചോദ്യത്തിലെ വർത്തമാന passive രൂപം ഇവിടെ പ്രവചനപരമായി പ്രതീക്ഷിക്കപ്പെടുന്ന ജനനത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ഭാവിദിശ സ്വാഭാവികമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: Χριστός എന്ന പദവിയുടെ പരിഭാഷ
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: ഹെരോദാവ് യഹൂദപ്രവചനങ്ങളിൽ പ്രതീക്ഷിക്കപ്പെട്ട അഭിഷിക്തനായ രാജാവിന്റെ ജനനസ്ഥലമാണ് അന്വേഷിക്കുന്നത്; അതിനാൽ പേര് പോലെയുള്ള രൂപത്തേക്കാൾ പദവിയുടെ മശീഹാപരമായ അർഥം മുൻനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. ‘മുഖ്യപുരോഹിതന്മാർ’, ‘ശാസ്ത്രിമാർ’, ‘മശീഹാ’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തിയപ്പോൾ വാക്യഘടന സാധാരണ വായനക്കാർക്ക് എളുപ്പമാക്കി.
