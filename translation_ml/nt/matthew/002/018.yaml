id: MAT.2.18
reference: Matthew 2:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Φωνὴ ἐν Ῥαμὰ ⸀ἠκούσθη, κλαυθμὸς καὶ ὀδυρμὸς πολύς· Ῥαχὴλ κλαίουσα τὰ τέκνα αὐτῆς, καὶ οὐκ ἤθελεν παρακληθῆναι ὅτι οὐκ εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/018.yaml
  text: 'A voice was heard in Ramah[a], weeping and great mourning: Rachel weeping for her children, and she was not willing to be comforted[c][b], because they are no more.'
translation:
  language: ml
  text: '“രാമയിൽ ഒരു ശബ്ദം കേട്ടു: കരച്ചിലും വലിയ വിലാപവും. റാഹേൽ തന്റെ മക്കളെച്ചൊല്ലി കരയുന്നു; അവർ ഇല്ലാതായതിനാൽ ആശ്വസിപ്പിക്കപ്പെടാൻ അവൾ തയ്യാറായില്ല.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “അവർ ഇല്ലാത്തതിനാൽ.” “ആശ്വസിപ്പിക്കപ്പെടാൻ അവൾ വിസമ്മതിച്ചു” എന്നും പരിഭാഷപ്പെടുത്താം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Φωνὴ ἐν Ῥαμὰ ἠκούσθη
  choice: രാമയിൽ ഒരു ശബ്ദം കേട്ടു
  rationale: സ്ഥലസൂചകമായ ἐν സ്വാഭാവികമായി ‘യിൽ’ എന്നും, ἠκούσθη എന്ന കർമണിപ്രയോഗം ‘കേട്ടു’ എന്നും നൽകി; Φωνήയുടെ പ്രവചനാത്മക ഭാവം ‘ശബ്ദം’ നിലനിർത്തുന്നു.
- source_word: κλαυθμὸς καὶ ὀδυρμὸς πολύς
  choice: കരച്ചിലും വലിയ വിലാപവും
  rationale: κλαυθμός കേൾക്കാവുന്ന കരച്ചിലിനെയും ὀδυρμός വിലാപത്തെയും സൂചിപ്പിക്കുന്നു; πολύς നൽകുന്ന തീവ്രത ‘വലിയ’ എന്നു സംരക്ഷിച്ചു.
- source_word: Ῥαχὴλ κλαίουσα τὰ τέκνα αὐτῆς
  choice: റാഹേൽ തന്റെ മക്കളെച്ചൊല്ലി കരയുന്നു
  rationale: വർത്തമാന കൃതന്തത്തിന്റെ തുടരുന്ന പ്രവൃത്തിഭാവം സ്വാഭാവിക മലയാളത്തിൽ ‘കരയുന്നു’ എന്നു നൽകി; τέκνα ലിംഗനിരപേക്ഷമായി ‘മക്കൾ’ എന്നാണ്.
- source_word: οὐκ ἤθελεν παρακληθῆναι
  choice: ആശ്വസിപ്പിക്കപ്പെടാൻ അവൾ മനസ്സില്ലായിരുന്നു
  rationale: θέλωയുടെ ഇച്ഛ/മനസ്സാകുന്ന അർഥം നിലനിർത്തി; ‘നിരസിച്ചു’ എന്ന കൂടുതൽ ശക്തമായ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർത്തില്ല. παρακληθῆναιയുടെ കർമണി രൂപവും സംരക്ഷിച്ചു.
- source_word: ὅτι οὐκ εἰσίν
  choice: അവർ ഇല്ലാതായതിനാൽ
  rationale: അക്ഷരാർഥമായ ‘അവർ ഇല്ല’ എന്ന വാക്യത്തിന്റെ നഷ്ടം സൂചിപ്പിക്കുന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകി; ‘മരിച്ചുപോയി’ എന്ന് വ്യക്തമായി ചേർത്ത് വ്യാഖ്യാനിച്ചില്ല.
theological_decisions:
- issue: ഉദ്ധരണിയിലെ റാഹേലിന്റെ സ്വഭാവം
  choice: റാഹേലിനെ പ്രവചനാത്മകമായ മാതൃരൂപമായി വിശദീകരണം കൂടാതെ നിലനിർത്തി.
  alternative: റാഹേൽ ഇസ്രായേലിലെ അമ്മമാരുടെ പ്രതീകമാണെന്നോ ഇവിടെ അക്ഷരാർഥത്തിൽ സംസാരിക്കുന്ന ചരിത്രവ്യക്തിയാണെന്നോ മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്ക് പാഠം റാഹേലിനെ നേരിട്ട് അവതരിപ്പിക്കുന്നുവെങ്കിലും പ്രതീകത്തിന്റെ പരിധി വിശദീകരിക്കുന്നില്ല; അതിനാൽ യിരെമ്യാവിൽനിന്നുള്ള ഉദ്ധരണിയുടെ ദൈവശാസ്ത്രപരമായ മുറുക്കവും അസ്പഷ്ടതയും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. കവിതാത്മകമായ ഉദ്ധരണിയുടെ താളം നിലനിർത്താൻ ഡാഷും സമാന്തര ഘടനയും പ്രയോഗിച്ചു; അനാവശ്യമായ സഭാപരമോ വിഭാഗീയമോ ആയ പദങ്ങൾ ഒഴിവാക്കി.
