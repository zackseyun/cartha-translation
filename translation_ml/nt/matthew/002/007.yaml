id: MAT.2.7
reference: Matthew 2:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τότε Ἡρῴδης λάθρᾳ καλέσας τοὺς μάγους ἠκρίβωσεν παρ’ αὐτῶν τὸν χρόνον τοῦ φαινομένου ἀστέρος,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/007.yaml
  text: Then Herod secretly summoned the magi and determined from them the time when the star had appeared,[a]
translation:
  language: ml
  text: അപ്പോൾ ഹെരോദാവ് മാഗിമാരെ[a] രഹസ്യമായി വിളിച്ചുവരുത്തി, നക്ഷത്രം പ്രത്യക്ഷപ്പെട്ട സമയം അവരിൽനിന്ന് കൃത്യമായി മനസ്സിലാക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ജ്ഞാനികൾ.” ഗ്രീക്കിലെ μάγοι (മാഗോയ്) എന്ന പദം കൂടുതൽ പ്രത്യേകമായി കിഴക്കുനിന്നുള്ള പണ്ഡിതരായ ജ്യോതിഷി-ജ്ഞാനികളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: അപ്പോൾ
  rationale: തുടർന്നുണ്ടാകുന്ന സംഭവത്തെ പരിചയപ്പെടുത്തുന്ന കാലസൂചകമായി സ്വാഭാവികമായ ആധുനിക മലയാളം.
- source_word: Ἡρῴδης
  choice: ഹെരോദാവ്
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ സുപരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: λάθρᾳ
  choice: രഹസ്യമായി
  rationale: ഹെരോദാവിന്റെ നടപടി മറ്റുള്ളവരിൽനിന്ന് മറച്ചുവെച്ചതാണെന്ന ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: καλέσας
  choice: വിളിച്ചുവരുത്തി
  rationale: ഔദ്യോഗികമോ ഉദ്ദേശ്യപൂർവമോ ആയ വിളിച്ചുകൂട്ടലിന്റെ ഭാവം നൽകുകയും ഗ്രീക്ക് കൃതന്തത്തെ മലയാളത്തിലെ സ്വാഭാവിക സംഭവക്രമമായി അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: τοὺς μάγους
  choice: മാഗിമാരെ
  rationale: μάγοι എന്ന പദത്തെ നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുന്നു; പിൽക്കാല പാരമ്പര്യചിത്രങ്ങൾ അനാവശ്യമായി ചേർക്കാതെ കിഴക്കൻ പണ്ഡിത-ജ്യോതിഷികളുടെ പ്രത്യേക വിഭാഗത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: ἠκρίβωσεν
  choice: കൃത്യമായി മനസ്സിലാക്കി
  rationale: ശ്രദ്ധാപൂർവം അന്വേഷിച്ച് കൃത്യവിവരം കണ്ടെത്തുക എന്ന ക്രിയയുടെ അർഥം സാധാരണ വായനക്കാർക്ക് തെളിഞ്ഞ മലയാളത്തിൽ നൽകുന്നു.
- source_word: παρ’ αὐτῶν
  choice: അവരിൽനിന്ന്
  rationale: ജനിറ്റീവിനൊപ്പമുള്ള παρά ഇവിടെ വിവരത്തിന്റെ ഉറവിടത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: τὸν χρόνον
  choice: സമയം
  rationale: ചോദ്യം ചെയ്യപ്പെട്ട കാലബിന്ദുവിനെ ലളിതമായി സൂചിപ്പിക്കുന്നു; കൃത്യതയുടെ ആശയം മുഖ്യക്രിയയിൽ നൽകിയിരിക്കുന്നു.
- source_word: τοῦ φαινομένου ἀστέρος
  choice: നക്ഷത്രം പ്രത്യക്ഷപ്പെട്ട സമയം
  rationale: ഗ്രീക്ക് ജനിറ്റീവ് കൃതന്തപ്രയോഗത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ കാലസൂചക ഉപവാക്യമായി നൽകുന്നു; പ്രത്യക്ഷപ്പെടൽ ഹെരോദാവിന്റെ അന്വേഷണത്തിനു മുമ്പുണ്ടായ സംഭവമായി സന്ദർഭം സൂചിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കഥനശൈലി. ‘മാഗിമാർ’ എന്ന അപരിചിതമാകാവുന്നെങ്കിലും കൂടുതൽ കൃത്യമായ പദം മുഖ്യവാചകത്തിൽ നിലനിർത്തി, പരിചിതമായ പകരംവാക്കും ചരിത്ര-സാംസ്കാരിക സൂചനയും അടിക്കുറിപ്പിൽ നൽകി.
