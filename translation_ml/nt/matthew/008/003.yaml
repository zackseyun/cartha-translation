    issue: Aspectual phrasing in “അവനെ തൊട്ടുകൊണ്ട്”
    rationale: The participial form “തൊട്ടുകൊണ്ട്” commonly suggests an ongoing or simultaneous action. Greek ἐκτείνας is the participle; ἥψατο is the main aorist verb. Recasting as “കൈ നീട്ടി അവനെ തൊട്ട്” preserves the sequential attendant action and reads more naturally.
