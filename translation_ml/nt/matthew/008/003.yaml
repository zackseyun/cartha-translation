id: MAT.8.3
reference: Matthew 8:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐκτείνας τὴν χεῖρα ἥψατο ⸀αὐτοῦ λέγων· Θέλω, καθαρίσθητι· καὶ εὐθέως ἐκαθαρίσθη αὐτοῦ ἡ λέπρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/003.yaml
  text: And stretching out his hand[a], he touched him, saying, “I am willing[c][b]; be cleansed.” And immediately his leprosy was cleansed.
translation:
  language: ml
  text: യേശു കൈ നീട്ടി അവനെ തൊട്ട്, “എനിക്കു മനസ്സുണ്ട്; ശുദ്ധനാകുക” എന്നു പറഞ്ഞു. ഉടനെ അവൻ കുഷ്ഠത്തിൽനിന്ന്[a] ശുദ്ധനായി.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘കുഷ്ഠം’ എന്നു പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്ക് λέπρα എന്ന പദം ആധുനിക ഹാൻസൻസ് രോഗം മാത്രമല്ല, മറ്റു ഗുരുതരമായ ചർമരോഗങ്ങളെയും സൂചിപ്പിച്ചേക്കാം.
    reason: cultural_note
  - marker: b
    text: 'അക്ഷരാർഥത്തിൽ: “ഉടനെ അവന്റെ കുഷ്ഠം ശുദ്ധീകരിക്കപ്പെട്ടു.”'
    reason: source_syntax
lexical_decisions:
- source_word: ἐκτείνας τὴν χεῖρα
  choice: കൈ നീട്ടി
  rationale: മുൻപുണ്ടായ അനുബന്ധപ്രവൃത്തിയെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുകയും കൈ നീട്ടിയ ശാരീരിക ആംഗ്യം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἥψατο αὐτοῦ
  choice: അവനെ തൊട്ടുകൊണ്ട്
  rationale: ജനിറ്റീവ് കർമത്തോടുകൂടിയ ἅπτομαι ഇവിടെ സാധാരണ അർഥമായ ‘തൊടുക’ എന്നതാണ്; രോഗിയെ പിടിച്ചുവെന്ന ശക്തമായ അർഥം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: Θέλω
  choice: എനിക്കു മനസ്സുണ്ട്
  rationale: മുൻവാക്യത്തിലെ രോഗിയുടെ ‘അങ്ങേക്കു മനസ്സുണ്ടെങ്കിൽ’ എന്ന അപേക്ഷയ്ക്കുള്ള സമ്മതപ്രതികരണമാണ്; ഭാവികാലസൂചനയേക്കാൾ സന്നദ്ധതയും ഇച്ഛയും പ്രകടമാക്കുന്നു.
- source_word: καθαρίσθητι
  choice: ശുദ്ധനാകുക
  rationale: രോഗശാന്തിയോടൊപ്പം ശുദ്ധി–അശുദ്ധി പശ്ചാത്തലവും നിലനിർത്തുന്ന സ്വാഭാവികമായ ആജ്ഞാരൂപം.
- source_word: εὐθέως
  choice: ഉടനെ
  rationale: ഫലം തൽക്ഷണം ഉണ്ടായെന്ന മത്തായിയുടെ ഊന്നൽ ലളിതവും കൃത്യവുമായി നൽകുന്നു.
- source_word: ἐκαθαρίσθη αὐτοῦ ἡ λέπρα
  choice: അവൻ കുഷ്ഠത്തിൽനിന്ന് ശുദ്ധനായി
  rationale: ഗ്രീക്കിൽ ‘അവന്റെ കുഷ്ഠം’ വ്യാകരണകർത്താവാണെങ്കിലും അതേ ഘടന മലയാളത്തിൽ അസ്വാഭാവികമാണ്. വ്യക്തിയെ കർത്താവാക്കി പറയുന്നത് മലയാളത്തിൽ സ്വാഭാവികവും καθαρίζω എന്ന ശുദ്ധീകരണഭാഷ നിലനിർത്തുന്നതുമാണ്; മൂലഘടന അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: ἡ λέπρα
  choice: കുഷ്ഠം
  rationale: തിരുവെഴുത്തുപാരമ്പര്യത്തിൽ പരിചിതമായ പദം നിലനിർത്തുന്നു; എന്നാൽ ഇത് ആധുനിക ഹാൻസൻസ് രോഗത്തിൽ മാത്രം ഒതുങ്ങണമെന്നില്ലെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: καθαρίζω എന്ന പദത്തിലെ രോഗശാന്തി–ശുദ്ധീകരണ ബന്ധം
  choice: ആജ്ഞയിലും ഫലത്തിലും ‘ശുദ്ധ’ എന്ന പദകുടുംബം നിലനിർത്തുക
  alternative: ‘സുഖപ്പെടുക/സുഖപ്പെട്ടു’ എന്നു മാത്രം പരിഭാഷപ്പെടുത്തുക
  rationale: ഇവിടെ ശാരീരിക സൗഖ്യം മാത്രമല്ല, ശുദ്ധി–അശുദ്ധി പശ്ചാത്തലവും ഗ്രീക്ക് പദം വഹിക്കുന്നു; ‘സുഖം’ എന്നു മാത്രം പറഞ്ഞാൽ ആ അർഥതലം നഷ്ടപ്പെടും.
- issue: Θέλω എന്ന യേശുവിന്റെ മറുപടിയുടെ ഭാവം
  choice: എനിക്കു മനസ്സുണ്ട്
  alternative: ഞാൻ ആഗ്രഹിക്കുന്നു / ഞാൻ ചെയ്യും
  rationale: രോഗിയുടെ അപേക്ഷ യേശുവിന്റെ കഴിവിനെക്കാൾ അവന്റെ മനസ്സിനെക്കുറിച്ചാണ്. അതിനാൽ സന്നദ്ധസമ്മതം പ്രകടമാക്കുന്ന രൂപം യോജിക്കുന്നു; ഭാവികാലപ്രഖ്യാപനമായി മാത്രം വായിക്കുന്നത് ഒഴിവാക്കുന്നു.
- issue: അവസാന ഉപവാക്യത്തിലെ വ്യാകരണകർത്താവ്
  choice: സ്വാഭാവിക മലയാളത്തിനായി രോഗിയെ കർത്താവാക്കി, മൂലഘടന അടിക്കുറിപ്പിൽ നൽകുക
  alternative: ‘അവന്റെ കുഷ്ഠം ശുദ്ധീകരിക്കപ്പെട്ടു’ എന്ന അക്ഷരാർഥഘടന
  rationale: അക്ഷരാർഥഘടന മലയാളത്തിൽ രോഗം തന്നെയാണ് ശുദ്ധമായതെന്ന അസ്പഷ്ടത ഉണ്ടാക്കുന്നു. പ്രധാനവാചകം അർഥം സ്വാഭാവികമായി നൽകുകയും അടിക്കുറിപ്പ് ഗ്രീക്കിന്റെ യഥാർഥ ഘടന സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘എനിക്കു മനസ്സുണ്ട്’ എന്നത് സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധത്തിൽ സന്നദ്ധത പ്രകടമാക്കുന്നു. ‘ശുദ്ധനാകുക/ശുദ്ധനായി’ എന്ന ആവർത്തനം ഗ്രീക്കിലെ καθαρίζω പദബന്ധം നിലനിർത്തുന്നു. ഒറ്റവാക്യമായി വായിക്കുമ്പോൾ കർത്താവ് വ്യക്തമാകാൻ ‘യേശു’ എന്നു നൽകിയിരിക്കുന്നു.
