id: MAT.8.13
reference: Matthew 8:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ Ἰησοῦς τῷ ἑκατοντάρχῃ· Ὕπαγε, ⸀ὡς ἐπίστευσας γενηθήτω σοι· καὶ ἰάθη ὁ ⸀παῖς ἐν τῇ ὥρᾳ ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/013.yaml
  text: And Jesus said to the centurion[a], “Go; as you have believed, let it be done for you.” And the servant was healed in that hour.
translation:
  language: ml
  text: 'യേശു ശതാധിപനോടു പറഞ്ഞു: “പോകുക; നീ വിശ്വസിച്ചതുപോലെ നിനക്കു സംഭവിക്കട്ടെ.” ആ നാഴികയിൽ അവന്റെ ദാസൻ[a] സുഖപ്പെട്ടു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “ബാലൻ” അഥവാ “കുട്ടി.” ഗ്രീക്ക് παῖς എന്ന പദം ഒരു ദാസനെയോ ചെറുപ്പക്കാരനെയോ സൂചിപ്പിക്കാം. ഈ സന്ദർഭത്തിൽ ശതാധിപന്റെ കീഴിലുള്ളയാളെ ഉദ്ദേശിക്കുന്നതിനാൽ “ദാസൻ” എന്നാണ് പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχῃ
  choice: ശതാധിപൻ
  rationale: റോമൻ സൈന്യത്തിൽ ഏകദേശം നൂറു സൈനികരുടെ ചുമതലയുണ്ടായിരുന്ന ഉദ്യോഗസ്ഥനെ സൂചിപ്പിക്കുന്ന കൃത്യവും മലയാള ബൈബിൾ വായനക്കാർക്കു പരിചിതവുമായ പദം.
- source_word: Ὕπαγε
  choice: പോകുക
  rationale: പുറപ്പെട്ടുപോകാനുള്ള ആജ്ഞയെ അധിക ആശയങ്ങൾ ചേർക്കാതെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ὡς ἐπίστευσας
  choice: നീ വിശ്വസിച്ചതുപോലെ
  rationale: വിശ്വസിച്ച വ്യക്തിയുടെ പ്രവൃത്തിയെ ക്രിയാരൂപത്തിൽ നിലനിർത്തുകയും ὡς എന്നതിന്റെ താരതമ്യ/അനുരൂപ അർഥം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: γενηθήτω σοι
  choice: നിനക്കു സംഭവിക്കട്ടെ
  rationale: γίνομαι എന്ന ക്രിയയുടെ ആജ്ഞാത്മക-ആശംസാത്മക ശക്തി മലയാളത്തിൽ സ്വാഭാവികമായി പകരുന്നു; കർമം ആരാണ് ചെയ്യുന്നതെന്ന് ഗ്രീക്ക് വ്യക്തമാക്കാത്തതിനാൽ അതും നിർണ്ണയിക്കുന്നില്ല.
- source_word: παῖς
  choice: ദാസൻ
  rationale: സന്ദർഭത്തിൽ ശതാധിപന്റെ കീഴിലുള്ള വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്; സമീപസന്ദർഭത്തിലെ δοῦλος-നോടും ഇത് യോജിക്കുന്നു. എന്നാൽ ‘ബാലൻ/കുട്ടി’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἰάθη
  choice: സുഖപ്പെട്ടു
  rationale: രോഗത്തിൽനിന്നുള്ള സൗഖ്യപ്രാപ്തിയെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്ന passive/resultative പ്രയോഗം.
- source_word: ἐν τῇ ὥρᾳ ἐκείνῃ
  choice: ആ നാഴികയിൽത്തന്നെ
  rationale: മൂലത്തിലെ സമയപ്രയോഗം സംരക്ഷിക്കുകയും സംഭവത്തിന്റെ ഉടനടിത്തം സൂചിപ്പിക്കുകയും ചെയ്യുന്നു; കൃത്യമായ ഒരു നിമിഷമെന്നതിലേക്കു അനാവശ്യമായി ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: πιστεύω എന്ന വിശ്വാസഭാഷയുടെ പരിഭാഷ
  choice: വിശ്വസിച്ചു
  alternative: ആശ്രയിച്ചു / വിശ്വാസം വെച്ചു
  rationale: വ്യക്തിയുടെ വിശ്വസിക്കൽ എന്ന ക്രിയാത്മക രൂപം നിലനിർത്തുന്നു; ‘വിശ്വാസത്തിനനുസരിച്ച്’ എന്ന നാമവത്കരണം ഒഴിവാക്കി മൂലവാക്യത്തിന്റെ വ്യക്തിപരമായ ഊന്നൽ സംരക്ഷിക്കുന്നു.
- issue: γενηθήτω എന്ന ദൈവിക പ്രവർത്തനത്തിന്റെ വ്യാകരണപരമായ അവതരണം
  choice: സംഭവിക്കട്ടെ
  alternative: ചെയ്യപ്പെടട്ടെ
  rationale: ഗ്രീക്ക് വാക്യം പ്രവർത്തകനെ തുറന്നുപറയുന്നില്ല. ‘സംഭവിക്കട്ടെ’ ആ തുറന്ന നില സംരക്ഷിക്കുന്നു; ദൈവിക പ്രവർത്തനത്തെ നിഷേധിക്കുകയോ വ്യാകരണത്തിൽ അധികമായി ചേർക്കുകയോ ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ശതാധിപൻ’ പോലുള്ള കൃത്യമായ ചരിത്രപദം നിലനിർത്തിയപ്പോൾ വാക്യഘടന സ്വാഭാവികമാക്കി. മുഖ്യപാഠത്തിലെ [a] അടയാളം അനുബന്ധ അടിക്കുറിപ്പുമായി പൊരുത്തപ്പെടുന്നു.
