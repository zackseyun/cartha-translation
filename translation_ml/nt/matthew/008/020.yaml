id: MAT.8.20
reference: Matthew 8:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Αἱ ἀλώπεκες φωλεοὺς ἔχουσιν καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνώσεις, ὁ δὲ υἱὸς τοῦ ἀνθρώπου οὐκ ἔχει ποῦ τὴν κεφαλὴν κλίνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/020.yaml
  text: And Jesus says to him[a], “Foxes have dens, and the birds of the sky have nests[d][c][b], but the Son of Man has nowhere to lay his head.”
translation:
  language: ml
  text: 'യേശു അവനോടു പറയുന്നു: “കുറുക്കന്മാർക്ക് മാളങ്ങളുണ്ട്[a]; ആകാശത്തിലെ പക്ഷികൾക്ക്[b] കൂടുകളുമുണ്ട്[c]. എന്നാൽ മനുഷ്യപുത്രന്[d] തല ചായിക്കാൻ ഒരിടവുമില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “മാളങ്ങൾ” എന്നതിന് “കുഴികൾ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ “വാനത്തിലെ പക്ഷികൾ”; “ആകാശപ്പക്ഷികൾ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: “കൂടുകൾ” എന്നതിന് “തങ്ങുന്ന ഇടങ്ങൾ” അല്ലെങ്കിൽ “താവളങ്ങൾ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: d
    text: “മനുഷ്യപുത്രൻ” യേശു തന്നെക്കുറിച്ച് ഉപയോഗിക്കുന്ന വിശേഷണമാണ്; “മനുഷ്യനായവൻ” എന്നും ചിലർ അർഥമാക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: പറയുന്നു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനകാലം നിലനിർത്തുന്നു; മലയാളത്തിലെ സുവിശേഷാഖ്യാനത്തിലും ഇത് സ്വാഭാവികവും സജീവവുമാണ്.
- source_word: ἀλώπεκες
  choice: കുറുക്കന്മാർ
  rationale: ബഹുവചന നാമത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാള തുല്യം.
- source_word: φωλεοὺς
  choice: മാളങ്ങൾ
  rationale: മൃഗങ്ങളുടെ പാർപ്പിടങ്ങളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപദം; ‘കുഴികൾ’ എന്നും അർഥമാക്കാം, എന്നാൽ ഇവിടെ ‘മാളങ്ങൾ’ കൂടുതൽ യോജിക്കുന്നു.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: ആകാശത്തിലെ പക്ഷികൾ
  rationale: οὐρανός എന്നതിന്റെ ദൃശ്യബിംബം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: κατασκηνώσεις
  choice: കൂടുകൾ
  rationale: പക്ഷികളുടെ സന്ദർഭത്തിൽ പാർപ്പിടങ്ങളെയോ തങ്ങുന്ന ഇടങ്ങളെയോ സൂചിപ്പിക്കാൻ ഏറ്റവും സ്വാഭാവികമായ പദം; പദത്തിന് ‘താവളങ്ങൾ’ എന്ന വിശാല അർഥവും സാധ്യമാണ്.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: യേശുവിന്റെ സ്വയംവിശേഷണം വിവർത്തനം ചെയ്യാതെ വ്യാഖ്യാനപരമായി ലഘൂകരിക്കാതെ, അതിന്റെ പരമ്പരാഗതവും ദൈവശാസ്ത്രപരവുമായ അനുരണനങ്ങളും അവ്യക്തതയും നിലനിർത്തുന്നു.
- source_word: οὐκ ἔχει ποῦ
  choice: ഇടമില്ല
  rationale: ‘എവിടെ ... എന്ന് ഇല്ല’ എന്ന ഗ്രീക്ക് ഘടനയെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τὴν κεφαλὴν κλίνῃ
  choice: തല ചായിക്കാൻ
  rationale: തല താഴ്ത്തിവെച്ച് വിശ്രമിക്കുന്നതിന്റെ സാക്ഷാത് ബിംബം സ്വാഭാവികമായ മലയാളപ്രയോഗത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου എന്ന യേശുവിന്റെ സ്വയംവിശേഷണത്തിന്റെ വിവർത്തനം
  choice: മനുഷ്യപുത്രൻ
  alternative: മനുഷ്യനായവൻ
  rationale: ‘മനുഷ്യപുത്രൻ’ എന്നത് പദപ്രയോഗത്തിന്റെ സ്ഥാപിതമായ തിരുവെഴുത്തുപരവും മിശിഹാസംബന്ധവുമായ അനുരണനങ്ങൾ, ദാനീയേൽ 7-ലേക്കുള്ള സാധ്യതയുള്ള സൂചന, സാധാരണ മനുഷ്യത്വത്തെക്കുറിച്ചുള്ള ഭാഷാപരമായ പാളി എന്നിവ പരിഹരിക്കാതെ നിലനിർത്തുന്നു; ‘മനുഷ്യനായവൻ’ കൂടുതൽ വ്യാഖ്യാനാത്മകമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ ചരിത്രവർത്തമാനകാലം ‘പറയുന്നു’ എന്നു നിലനിർത്തി. ‘മനുഷ്യപുത്രൻ’ എന്ന സ്ഥാപിത തിരുവെഴുത്തുപദം വ്യാഖ്യാനപരമായി ചുരുക്കാതെ സൂക്ഷിച്ചു.
