id: MAT.8.1
reference: Matthew 8:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂Καταβάντος δὲ αὐτοῦ⸃ ἀπὸ τοῦ ὄρους ἠκολούθησαν αὐτῷ ὄχλοι πολλοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/001.yaml
  text: When he came down from the mountain[a], large crowds followed him.
translation:
  language: ml
  text: അവൻ മലയിൽനിന്ന് ഇറങ്ങിവന്നപ്പോൾ വലിയ ജനക്കൂട്ടങ്ങൾ അവനെ അനുഗമിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καταβάντος δὲ αὐτοῦ
  choice: അവൻ … ഇറങ്ങിവന്നപ്പോൾ
  rationale: Aorist participle ഉൾപ്പെട്ട genitive absolute സ്വാഭാവിക മലയാളത്തിൽ കാലസൂചക ഉപവാക്യമായി പരിഭാഷപ്പെടുത്തി. δέ ഇവിടെ ലഘുവായ ആഖ്യാനബന്ധകമായതിനാൽ പ്രത്യേക പദമായി ചേർക്കാതെ വാക്യപ്രവാഹത്തിൽ ഉൾപ്പെടുത്തി.
- source_word: ἀπὸ τοῦ ὄρους
  choice: മലയിൽനിന്ന്
  rationale: ὄρος എന്നത് ‘മല’ അല്ലെങ്കിൽ ‘കുന്ന്’ എന്നാകാം; മുൻസന്ദർഭത്തിലെ നിർദിഷ്ട സ്ഥലത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ആധുനിക മലയാളത്തിൽ ‘മലയിൽനിന്ന്’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: ἠκολούθησαν αὐτῷ
  choice: അവനെ അനുഗമിച്ചു
  rationale: ἀκολουθέω കൂടെ വരുന്ന dative complement മലയാളത്തിൽ ‘അവനെ അനുഗമിച്ചു’ എന്ന് സ്വാഭാവികമായി നൽകാം; ഇവിടെ പ്രാഥമികമായി ശാരീരികമായി പിന്നാലെ പോകുന്നതാണ് ആഖ്യാനസന്ദർഭം.
- source_word: ὄχλοι πολλοί
  choice: വലിയ ജനക്കൂട്ടങ്ങൾ
  rationale: പദക്രമത്തിൽ ‘ജനക്കൂട്ടങ്ങൾ അനേകം’ എന്നാണെങ്കിലും, πολλοί ഇവിടെ ജനങ്ങളുടെ വലിയ സംഖ്യയെ സൂചിപ്പിക്കുന്നു. ബഹുവചനം നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവിക മലയാളത്തിനായി ‘വലിയ ജനക്കൂട്ടങ്ങൾ’ എന്നു നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. മൂലത്തിലെ ബഹുവചനമായ ὄχλοι നിലനിർത്തി; അനാവശ്യമായ വ്യാഖ്യാനപരമോ സഭാപാരമ്പര്യപരമോ ആയ പദങ്ങൾ ചേർത്തിട്ടില്ല.
