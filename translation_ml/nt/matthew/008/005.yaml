  yaml_path: translation/nt/matthew/008/005.yaml
  text: When he entered Capernaum[a], a centurion came to him, pleading with him[b],
translation:
  language: ml
  text: 'അവൻ കഫർന്നഹൂമിൽ പ്രവേശിച്ചപ്പോൾ, ഒരു ശതാധിപൻ അവന്റെ അടുക്കൽ വന്ന് അവനോടു അപേക്ഷിച്ചു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἰσελθόντος δὲ αὐτοῦ
  choice: അവൻ … പ്രവേശിച്ചപ്പോൾ
  rationale: Aorist genitive absolute is naturally expressed as a temporal clause. ‘പ്രവേശിച്ചപ്പോൾ’ preserves the temporal relationship without insisting that the entry was fully completed before the officer approached.
- source_word: εἰς Καφαρναοὺμ
  choice: കഫർന്നഹൂമിൽ
  rationale: Uses the established Malayalam transliteration of the place name and the natural Malayalam construction with ‘പ്രവേശിക്കുക’.
- source_word: προσῆλθεν αὐτῷ
  choice: അവന്റെ അടുക്കൽ വന്ന്
  rationale: Conveys both movement toward Jesus and personal approach in clear, idiomatic Malayalam.
- source_word: ἑκατόνταρχος
  choice: ഒരു ശതാധിപൻ
  rationale: Retains the specific military rank rather than replacing it with the broader ‘സൈനിക ഉദ്യോഗസ്ഥൻ.’ The established biblical Malayalam term is concise and dignified.
- source_word: παρακαλῶν αὐτὸν
  choice: അപേക്ഷിച്ചു
  rationale: In this context the participle introduces an earnest request. ‘അപേക്ഷിച്ചു’ is natural and respectful without intensifying the manner beyond what the Greek requires.
theological_decisions: []
translation_notes:
  register: Modern standard Malayalam with a dignified narrative cadence. The colon naturally anticipates the officer’s words in the following verse; no interpretive or denominational terminology has been added.
