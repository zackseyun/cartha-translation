id: MAT.8.10
reference: Matthew 8:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ Ἰησοῦς ἐθαύμασεν καὶ εἶπεν τοῖς ἀκολουθοῦσιν· Ἀμὴν λέγω ὑμῖν, ⸂παρ’ οὐδενὶ τοσαύτην πίστιν ἐν τῷ Ἰσραὴλ⸃ εὗρον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/010.yaml
  text: When Jesus heard this[a], he marveled and said to those following him, “Truly I tell you[b], with no one in Israel have I found such faith.”
translation:
  language: ml
  text: 'ഇതു കേട്ടപ്പോൾ യേശു ആശ്ചര്യപ്പെട്ടു; തന്നെ അനുഗമിച്ചുകൊണ്ടിരുന്നവരോടു പറഞ്ഞു: “സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: ഇസ്രായേലിൽ ഒരാളിലും ഇത്ര വലിയ വിശ്വാസം[a] ഞാൻ കണ്ടിട്ടില്ല.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇത്തരം വിശ്വാസം.”
    reason: τοσαύτην എന്നത് വിശ്വാസത്തിന്റെ അളവിനെ ‘ഇത്ര വലിയ’ എന്നും ഗുണസ്വഭാവത്തെ ‘ഇത്തരം’ എന്നും സ്വാഭാവികമായി പ്രകടിപ്പിക്കാം.
  - marker: b
    text: അഥവാ, “ഇത്ര വലിയ വിശ്വാസമുള്ള ആരെയും ഇസ്രായേലിൽ ഞാൻ കണ്ടിട്ടില്ല.”
    reason: παρ’ οὐδενὶ … εὗρον എന്ന ഗ്രീക്ക് ഘടനയെ വ്യക്തികേന്ദ്രിതമായ മലയാളവാക്യമായി മാറ്റാവുന്ന മറ്റൊരു സ്വാഭാവിക സാധ്യത.
lexical_decisions:
- source_word: ἀκούσας
  choice: ഇതു കേട്ടപ്പോൾ
  rationale: പ്രധാന ക്രിയയുടെ സാഹചര്യം സൂചിപ്പിക്കുന്ന aorist participle ആണ്. മുൻവാക്യത്തിലെ ശതാധിപന്റെ വാക്കുകളെയാണ് കേട്ടത് എന്നത് സന്ദർഭത്തിൽ വ്യക്തമായതിനാൽ, സ്വാഭാവികമായ മലയാളത്തിനായി ‘ഇതു’ ചേർത്തു.
- source_word: ἐθαύμασεν
  choice: ആശ്ചര്യപ്പെട്ടു
  rationale: യേശു കേട്ടതിലുള്ള വിസ്മയം സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; അറിവില്ലായ്മയോ തെറ്റോ അനാവശ്യമായി സൂചിപ്പിക്കുന്നില്ല.
- source_word: τοῖς ἀκολουθοῦσιν
  choice: തന്നെ അനുഗമിച്ചുകൊണ്ടിരുന്നവരോട്
  rationale: ആ സമയത്ത് യേശുവിനോടൊപ്പം പിന്നാലെ വന്നുകൊണ്ടിരുന്നവരെയാണ് present participle സൂചിപ്പിക്കുന്നത്. സ്ഥിരമായ ഔദ്യോഗിക പദവിയെക്കാൾ സംഭവസന്ദർഭത്തിലെ പ്രവൃത്തിക്ക് മുൻഗണന നൽകുന്നു.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: സുവിശേഷങ്ങളിലെ ഗൗരവപൂർണമായ ഉറപ്പിക്കൽ പ്രയോഗത്തിന്റെ ഊന്നൽ നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളം നൽകുന്നു.
- source_word: παρ’ οὐδενὶ
  choice: ആരിലും
  rationale: παρά + dative ഇവിടെ ‘ഒരാളിലും/ഒരാളുടെ കാര്യത്തിലും’ എന്ന സഹവർത്തിത്വപരമായ അർഥം നൽകുന്നു. ‘ആരിലും’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: τοσαύτην πίστιν
  choice: ഇത്ര വലിയ വിശ്വാസം
  rationale: τοσαύτην സൂചിപ്പിക്കുന്ന അളവിന്റെയോ മഹത്ത്വത്തിന്റെയോ ഊന്നൽ മലയാളത്തിൽ തുറന്നുപറയുന്നു. ‘ഇത്തരം വിശ്വാസം’ എന്ന കൂടുതൽ ചുരുക്കമുള്ള സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἐν τῷ Ἰσραήλ
  choice: ഇസ്രായേലിൽ
  rationale: ഇവിടെ ഇസ്രായേൽ എന്ന ജനസമൂഹത്തിനുള്ളിൽ എന്ന പ്രാദേശികവും സമൂഹപരവുമായ ആശയം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: εὗρον
  choice: ഞാൻ കണ്ടിട്ടില്ല
  rationale: ഗ്രീക്കിലെ aorist നിഷേധപ്രയോഗം യേശുവിന്റെ ഇതുവരെയുള്ള അനുഭവത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘കണ്ടിട്ടില്ല’ സ്വാഭാവികമായി ആ അർഥം നൽകുന്നു.
theological_decisions:
- issue: πίστις എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: വിശ്വാസം
  alternative: ആശ്രയം / ഉറച്ച വിശ്വാസം
  rationale: ശതാധിപന് യേശുവിന്റെ അധികാരത്തിലുള്ള ആത്മവിശ്വാസമാണ് സന്ദർഭം പ്രകടമാക്കുന്നത്. എന്നാൽ πίστις എന്ന പദത്തിന്റെ വിശാലവും ദൈവശാസ്ത്രപരമായി പ്രധാനവുമായ അർഥം ചുരുക്കാതിരിക്കാൻ മുഖ്യപാഠത്തിൽ ‘വിശ്വാസം’ നിലനിർത്തുന്നു.
- issue: യേശു ‘ആശ്ചര്യപ്പെട്ടു’ എന്ന വിവരണത്തിന്റെ ദൈവശാസ്ത്രപരമായ സംഘർഷം
  choice: ആശ്ചര്യപ്പെട്ടു
  alternative: വിസ്മയിച്ചു
  rationale: ἐθαύμασεν എന്ന ക്രിയയുടെ നേരിട്ടുള്ള കഥനശക്തി സംരക്ഷിക്കുന്നു. യേശുവിന്റെ അറിവിനെക്കുറിച്ചുള്ള ഒരു പ്രത്യേക സിദ്ധാന്തപരമായ വിശദീകരണം വിവർത്തനത്തിലേക്ക് ചേർത്ത് യഥാർഥ സംഘർഷം ഇല്ലാതാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി ഉപയോഗിച്ചു. ‘തന്നെ അനുഗമിച്ചുകൊണ്ടിരുന്നവർ’ എന്ന് പറഞ്ഞ് സംഭവസന്ദർഭത്തിലെ കൂട്ടത്തെ സൂചിപ്പിച്ചു; ‘ശിഷ്യന്മാർ’ എന്ന കൂടുതൽ നിർദ്ദിഷ്ടമായ തിരിച്ചറിയൽ പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്തില്ല. വാക്യത്തിലെ ഗൗരവം നിലനിർത്താൻ ഉദ്ധരണിയിൽ അർദ്ധവിരാമത്തിനു പകരം വ്യക്തമായ പ്രസ്താവനാഭംഗി ഉപയോഗിച്ചു.
