revisions:
- from: 'ഇതു കേട്ടപ്പോൾ യേശു ആശ്ചര്യപ്പെട്ടു; തന്നെ അനുഗമിച്ചുകൊണ്ടിരുന്നവരോടു പറഞ്ഞു: “സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: ഇസ്രായേലിൽ ആരിലും ഇത്ര വലിയ വിശ്വാസം[a] ഞാൻ കണ്ടിട്ടില്ല.[b]”'
  to: 'ഇതു കേട്ടപ്പോൾ യേശു ആശ്ചര്യപ്പെട്ടു; തന്നെ അനുഗമിച്ചുകൊണ്ടിരുന്നവരോടു പറഞ്ഞു: “സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: ഇസ്രായേലിൽ ഒരാളിലും ഇത്ര വലിയ വിശ്വാസം[a] ഞാൻ കണ്ടിട്ടില്ല.[b]”'
  rationale: 'ഒരു ചെറിയ ശൈലീപരിഷ്കാരം മാത്രം ആവശ്യമാണ്: ‘ആരിലും’ എന്നതിനുപകരം ‘ഒരാളിലും’ ഉപയോഗിച്ച് നിഷേധവാക്യത്തിന്റെ സ്വാഭാവിക മലയാളഘടന മെച്ചപ്പെടുത്തി. ഇതിലൂടെ παρά + dative-ന്റെ ‘ഒരു വ്യക്തിയിലും/ആരുടെയും കാര്യത്തിൽ’ എന്ന അർഥവും നിലനിൽക്കുന്നു. അടിക്കുറിപ്പുകളുടെ ആങ്കറുകളും ഉള്ളടക്കവും നിലനിർത്തി.'
