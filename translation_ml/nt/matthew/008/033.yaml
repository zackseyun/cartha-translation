id: MAT.8.33
reference: Matthew 8:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ βόσκοντες ἔφυγον, καὶ ἀπελθόντες εἰς τὴν πόλιν ἀπήγγειλαν πάντα καὶ τὰ τῶν δαιμονιζομένων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/033.yaml
  text: Then the herdsmen fled[a], and going away into the city, they reported everything, including what had happened to the demon-possessed men.
translation:
  language: ml
  text: 'അവയെ മേയിച്ചവർ ഓടിപ്പോയി. അവർ പട്ടണത്തിൽ ചെന്ന് എല്ലാം—ഭൂതബാധിതരായവരുടെ കാര്യവും ഉൾപ്പെടെ—അറിയിച്ചു.[a]


    [a] അക്ഷരാർഥത്തിൽ: “എല്ലാം, ഭൂതബാധിതരായവരെ സംബന്ധിച്ച കാര്യങ്ങളും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “എല്ലാം, ഭൂതബാധിതരായവരെ സംബന്ധിച്ച കാര്യങ്ങളും.”'
    reason: καὶ τὰ τῶν δαιμονιζομένων എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ കൂടുതൽ അക്ഷരാർഥത്തിലുള്ളതും അർഥപരമായി തുറന്നതുമായ രൂപം നൽകുന്നു.
lexical_decisions:
- source_word: οἱ δὲ βόσκοντες
  choice: അവയെ മേയിച്ചിരുന്നവർ
  rationale: βόσκοντες എന്നത് അക്ഷരാർഥത്തിൽ ‘മേയിച്ചിരുന്നവർ’ എന്നാണ്; സമീപസന്ദർഭത്തിലെ പന്നിക്കൂട്ടത്തെയാണ് ‘അവയെ’ സൂചിപ്പിക്കുന്നത്. δέ കഥയുടെ തുടർച്ചയിലൂടെ സ്വാഭാവികമായി പ്രതിഫലിക്കുന്നു.
- source_word: ἔφυγον
  choice: ഓടിപ്പോയി
  rationale: φεύγω ഇവിടെ ഭയപ്പെട്ടോ അപകടം ഒഴിവാക്കാനോ ഓടിപ്പോകുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ദൃശ്യവുമായ പ്രയോഗമാണിത്.
- source_word: ἀπελθόντες εἰς τὴν πόλιν
  choice: അവർ പട്ടണത്തിൽ ചെന്ന്
  rationale: മുൻകൃത്യത്തെ സൂചിപ്പിക്കുന്ന aorist participle മലയാളത്തിൽ തുടർച്ചയായ ക്രിയയായി സ്വാഭാവികമായി നൽകിയിരിക്കുന്നു; εἰς τὴν πόλιν എന്ന ദിശാസൂചന ‘പട്ടണത്തിൽ ചെന്ന്’ എന്നതിൽ നിലനിൽക്കുന്നു.
- source_word: ἀπήγγειλαν
  choice: അറിയിച്ചു
  rationale: ἀπαγγέλλω എന്നത് വാർത്തയോ സംഭവവിവരമോ അറിയിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘അറിയിച്ചു’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: πάντα
  choice: എല്ലാം
  rationale: πάνταയുടെ സമഗ്രമായ അർഥം ചുരുക്കവും നേരിട്ടുമായ രീതിയിൽ നിലനിർത്തുന്നു.
- source_word: καὶ τὰ τῶν δαιμονιζομένων
  choice: ഭൂതബാധിതരായിരുന്നവരുടെ കാര്യവും ഉൾപ്പെടെ
  rationale: ഗ്രീക്ക് പ്രയോഗം അക്ഷരാർഥത്തിൽ ‘ഭൂതബാധിതരെ സംബന്ധിച്ച കാര്യങ്ങളും’ എന്നാണ്. സന്ദർഭത്തിൽ അത് അവരെക്കുറിച്ചുള്ള സംഭവവിവരത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഉൾപ്പെടെ’ ഉപയോഗിക്കുന്നത് πάνταയുമായുള്ള ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള രൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: δαιμονιζομένων
  choice: ഭൂതബാധിതരായിരുന്നവർ
  rationale: ദുരാത്മശക്തിയുടെ യഥാർഥ ബാധയിലായിരുന്നവരെ ഈ പദം സൂചിപ്പിക്കുന്നു. ‘ഭൂതബാധിതർ’ ആധുനിക മലയാളത്തിൽ മനസ്സിലാകുന്ന പ്രയോഗമാണ്; ഗ്രീക്ക് പദം നിർണ്ണയിക്കാത്ത അധിക സിദ്ധാന്തപരമായ സൂക്ഷ്മവ്യത്യാസങ്ങൾ ഇതിൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: δαιμονιζομένων എന്ന പദത്തിലെ ദുരാത്മബാധയുടെ സ്വഭാവം
  choice: ഭൂതബാധിതരായിരുന്നവർ
  alternative: ദുരാത്മാക്കളുടെ അധീനതയിലായിരുന്നവർ / ഭൂതഗ്രസ്തർ
  rationale: വിവരണം യഥാർഥ ദുരാത്മബാധ നിലനിർത്തുന്നു; എന്നാൽ ‘അധീനത’ പോലുള്ള പദം നൽകാവുന്ന അധിക സിദ്ധാന്തപരമായ കൃത്യതയോ ‘ഭൂതഗ്രസ്തർ’ എന്ന പഴയ/സാങ്കേതിക ഭാവമോ നിർബന്ധിക്കുന്നില്ല.
- issue: καὶ τὰ τῶν δαιμονιζομένων എന്ന അപൂർണമായ നാമപ്രയോഗത്തിന്റെ വ്യാഖ്യാനം
  choice: ഭൂതബാധിതരായിരുന്നവരുടെ കാര്യവും ഉൾപ്പെടെ
  alternative: ഭൂതബാധിതരായിരുന്നവരെ സംബന്ധിച്ച കാര്യങ്ങളും
  rationale: സന്ദർഭത്തിൽ അവർക്ക് സംഭവിച്ചതോ അവരെ സംബന്ധിച്ച വാർത്തയോ ഉദ്ദേശിക്കപ്പെടുന്നു. പ്രധാനപാഠം സ്വാഭാവിക മലയാളത്തിൽ ഈ ബന്ധം വ്യക്തമാക്കുന്നു; ഗ്രീക്കിലെ തുറന്ന അർഥപരിധി അടിക്കുറിപ്പിലെ കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള രൂപത്തിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. നീണ്ട ഗ്രീക്ക് വാക്യം മലയാളത്തിൽ രണ്ട് വാക്യങ്ങളാക്കി വായനാസൗകര്യം വർധിപ്പിച്ചെങ്കിലും ക്രിയകളുടെ ക്രമം മാറ്റിയിട്ടില്ല. അടിക്കുറിപ്പ് ചിഹ്നം അത് വിശദീകരിക്കുന്ന അവസാന പ്രയോഗത്തോടാണ് ചേർത്തിരിക്കുന്നത്.
