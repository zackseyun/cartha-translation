id: MAT.8.27
reference: Matthew 8:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ ἄνθρωποι ἐθαύμασαν λέγοντες· Ποταπός ἐστιν οὗτος ὅτι καὶ οἱ ἄνεμοι καὶ ἡ θάλασσα ⸂αὐτῷ ὑπακούουσιν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/027.yaml
  text: And the men marveled[a], saying, “What sort of man is this, that even the winds and the sea obey him?”
translation:
  language: ml
  text: 'ആ മനുഷ്യർ ആശ്ചര്യപ്പെട്ട് പറഞ്ഞു: “ഇവൻ എങ്ങനെയുള്ളവൻ? കാറ്റുകളും കടലുംപോലും ഇവനെ അനുസരിക്കുന്നല്ലോ!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ ἄνθρωποι
  choice: ആ മനുഷ്യർ
  rationale: ἄνθρωποι ഇവിടെ പടകിലുണ്ടായിരുന്ന പുരുഷന്മാരെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ആ മനുഷ്യർ’ എന്ന് നൽകുന്നത് അവരുടെ വ്യക്തിത്വവും സന്ദർഭബന്ധവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἐθαύμασαν
  choice: ആശ്ചര്യപ്പെട്ടു
  rationale: ക്രിയ സൂചിപ്പിക്കുന്ന വിസ്മയവും അമ്പരപ്പും ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: λέγοντες
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ വർത്തമാന കൃദന്തരൂപത്തെ മലയാള കഥനശൈലിയിൽ ‘ആശ്ചര്യപ്പെട്ട് പറഞ്ഞു’ എന്ന് ബന്ധിപ്പിക്കുന്നത് സ്വാഭാവികമാണ്.
- source_word: Ποταπός ἐστιν οὗτος
  choice: ഇവൻ എങ്ങനെയുള്ളവൻ?
  rationale: ποταπός വ്യക്തിയുടെ സ്വഭാവമോ തരമോ എന്താണെന്ന് ചോദിക്കുന്നു. ‘എങ്ങനെയുള്ളവൻ’ അതിന്റെ ആശ്ചര്യഭരിതമായ അന്വേഷണസ്വരം സംരക്ഷിക്കുന്നു; ‘മനുഷ്യൻ’ എന്ന് മൂലത്തിൽ ഇല്ലാത്ത പദം ചേർക്കുന്നില്ല.
- source_word: ὅτι
  choice: —ല്ലോ
  rationale: ഇവിടെ ὅτι ചോദ്യത്തിന് ആധാരമായ അതിശയകരമായ വസ്തുത അവതരിപ്പിക്കുന്നു. സ്വതന്ത്രമായ മുൻചോദ്യത്തിനു പിന്നാലെ ‘അനുസരിക്കുന്നല്ലോ’ എന്ന മലയാള പ്രയോഗം ആ വിശദീകരണ-വിസ്മയ ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: καὶ οἱ ἄνεμοι καὶ ἡ θάλασσα
  choice: കാറ്റുകളും കടലുംപോലും
  rationale: ആവർത്തിച്ചുള്ള καί പ്രകൃതിശക്തികൾപോലും അവന്റെ അധികാരത്തിന് വിധേയമാണെന്ന ഊന്നൽ നൽകുന്നു. മലയാളത്തിലെ ‘പോലും’ ഈ ഊന്നൽ വ്യക്തമായി പകരുന്നു.
- source_word: αὐτῷ ὑπακούουσιν
  choice: ഇവനെ അനുസരിക്കുന്നു
  rationale: ὑπακούω എന്നത് കേട്ട് അനുസരിക്കുക, വിധേയമാകുക എന്ന അർഥം നൽകുന്നു. ‘അനുസരിക്കുന്നു’ വ്യക്തിപരമായ അധികാരബന്ധം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ശിഷ്യരുടെ ചോദ്യത്തിലെ ക്രിസ്തുശാസ്ത്രപരമായ സൂചന
  choice: യേശുവിന്റെ സൃഷ്ടിയിന്മേലുള്ള അസാധാരണ അധികാരം സൂചിപ്പിക്കുന്ന ചോദ്യം വ്യാഖ്യാനവികാസമില്ലാതെ നേരിട്ട് നിലനിർത്തി.
  alternative: ‘ഇവൻ ദൈവികനായിരിക്കണം’ എന്നതുപോലുള്ള വ്യക്തമായ നിഗമനം ചേർക്കുക, അല്ലെങ്കിൽ അതിനെ ഒരു അത്ഭുതത്തെക്കുറിച്ചുള്ള സാധാരണ വിസ്മയമായി മാത്രം മൃദൂകരിക്കുക.
  rationale: വാക്യം യേശുവിന്റെ തിരിച്ചറിയലിനെക്കുറിച്ചുള്ള ചോദ്യം തുറന്നുവെക്കുകയും കാറ്റും കടലും അവനെ അനുസരിക്കുന്നതിലൂടെ അതിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ ഭാരം സൂചിപ്പിക്കുകയും ചെയ്യുന്നു. പരിഭാഷ ആ പിരിമുറുക്കം പരിഹരിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ‘എങ്ങനെയുള്ളവൻ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ മൂലത്തിലെ ഗുണം/തരം സംബന്ധിച്ച ചോദ്യവും നിലനിർത്തുന്നു. പ്രസിദ്ധീകരണവാക്യത്തിൽ അടിക്കുറിപ്പുകൾ ആവശ്യമില്ല.
