id: MAT.8.22
reference: Matthew 8:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀λέγει αὐτῷ· Ἀκολούθει μοι, καὶ ἄφες τοὺς νεκροὺς θάψαι τοὺς ἑαυτῶν νεκρούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/022.yaml
  text: But Jesus says to him[a], “Follow me, and leave the dead to bury their own dead.”
translation:
  language: ml
  text: 'എന്നാൽ യേശു അവനോടു പറയുന്നു: “എന്നെ അനുഗമിക്കുക; മരിച്ചവർ തങ്ങളുടെ സ്വന്തം മരിച്ചവരെ അടക്കട്ടെ.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ആദ്യത്തെ ‘മരിച്ചവർ’ എന്നത് പലപ്പോഴും രൂപകമായി മനസ്സിലാക്കപ്പെടുന്നു: ആത്മീയമായി പ്രതികരിക്കാത്തവർ ശാരീരികമായി മരിച്ചവരെ അടക്കട്ടെ.'
    reason: ആദ്യ പ്രയോഗത്തിന്റെ സാധ്യതയുള്ള രൂപകാർഥം വ്യക്തമാക്കുന്ന പര്യായ വ്യാഖ്യാനം; പ്രധാനവാചകത്തിലെ ദ്വയാർഥം സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ അപേക്ഷയോടുള്ള യേശുവിന്റെ തിരുത്തൽസ്വഭാവമുള്ള പ്രതികരണത്തെ സൂചിപ്പിക്കുന്ന മൃദുവായ വൈരുധ്യം നിലനിർത്തുന്നു.
- source_word: λέγει
  choice: പറയുന്നു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനകാലം നൽകുന്ന ആഖ്യാനസജീവത നിലനിർത്തുന്നു.
- source_word: Ἀκολούθει μοι
  choice: എന്നെ അനുഗമിക്കുക
  rationale: നേരിട്ടുള്ള ശിഷ്യത്വാഹ്വാനം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἄφες
  choice: അടക്കട്ടെ
  rationale: മലയാളത്തിൽ തുടർന്നുവരുന്ന infinitive ആശയത്തോടൊപ്പം അനുവാദം/വിട്ടുകൊടുക്കൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ഉത്തരവാദിത്വം അവർക്കുതന്നെ വിടുക എന്ന ബലം സന്ദർഭത്തിൽ നിലനിൽക്കുന്നു.
- source_word: νεκρούς ... νεκρούς
  choice: മരിച്ചവർ ... മരിച്ചവരെ
  rationale: ഒരേ ഗ്രീക്ക് പദത്തിന്റെ ആവർത്തനം സംരക്ഷിച്ച് വാക്ചാതുര്യവും ആദ്യ പ്രയോഗത്തിലെ രൂപകസാധ്യതയും വ്യാഖ്യാനിച്ച് തീർക്കാതെ നിലനിർത്തുന്നു.
- source_word: θάψαι
  choice: അടക്കുക
  rationale: മൃതശരീരം സംസ്കരിക്കുക എന്ന അർഥത്തിൽ സാധാരണവും വ്യക്തവുമായ മലയാളപ്രയോഗം.
- source_word: τοὺς ἑαυτῶν νεκρούς
  choice: തങ്ങളുടെ മരിച്ചവരെ
  rationale: ἑαυτῶν എന്ന ആത്മവാചക ഉടമസ്ഥതയുടെ ഊന്നൽ ‘തങ്ങളുടെ’ എന്നതിലൂടെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ വാക്കിലെ ‘മരിച്ചവർ’ എന്ന ആദ്യ പ്രയോഗത്തിന്റെ അർഥം
  choice: പ്രധാനവാചകത്തിൽ ‘മരിച്ചവർ ... മരിച്ചവരെ’ എന്ന ആവർത്തനം അതേപടി സംരക്ഷിച്ചു.
  alternative: ആദ്യത്തേത് ‘ആത്മീയമായി മരിച്ചവർ’ എന്നും രണ്ടാമത്തേത് ശാരീരികമായി മരിച്ചവർ എന്നും തുറന്നുപറയുക.
  rationale: ഗ്രീക്ക് വാചകം രണ്ടിടത്തും ഒരേ പദമാണ് ഉപയോഗിക്കുന്നത്. ആദ്യത്തേതിൽ രൂപകാർഥം സാധ്യതയുള്ളതാണെങ്കിലും ‘ആത്മീയമായി’ എന്നു പ്രധാനവാചകത്തിൽ ചേർക്കുന്നത് ഉദ്ദേശ്യപൂർവമായ ദ്വയാർഥവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും മുൻകൂട്ടി പരിഹരിക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ ചരിത്രവർത്തമാനകാലം ‘പറയുന്നു’ എന്നതിലൂടെ നിലനിർത്തി. അടക്കം സംബന്ധിച്ച ‘അടക്കുക’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; പദാവർത്തനവും ഉടമസ്ഥതയുടെ ഊന്നലും സംരക്ഷിച്ചു.
