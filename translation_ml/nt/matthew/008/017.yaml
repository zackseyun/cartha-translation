  to: 'യെശയ്യാവ് പ്രവാചകൻ മുഖാന്തരം അരുളിച്ചെയ്യപ്പെട്ടതു നിറവേറേണ്ടതിനായിരുന്നു ഇത് സംഭവിച്ചത്: “അവൻതന്നെ നമ്മുടെ അസുഖങ്ങൾ ഏറ്റെടുത്തു; നമ്മുടെ രോഗങ്ങൾ ചുമന്നു.”[a]'
