  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅπως πληρωθῇ τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου λέγοντος· Αὐτὸς τὰς ἀσθενείας ἡμῶν ἔλαβεν καὶ τὰς νόσους ἐβάστασεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/017.yaml
  text: 'so that what was spoken through Isaiah the prophet might be fulfilled[b][a], saying: “He himself took our sicknesses and carried our diseases.”'
translation:
  language: ml
  text: 'യെശയ്യാവ് പ്രവാചകൻ മുഖാന്തരം അരുളിച്ചെയ്യപ്പെട്ടതു നിറവേറേണ്ടതിനായിരുന്നു ഇത് സംഭവിച്ചത്: “അവൻതന്നെ നമ്മുടെ അസുഖങ്ങൾ ഏറ്റെടുത്തു; നമ്മുടെ രോഗങ്ങൾ ചുമന്നു.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അസുഖങ്ങൾ” എന്നതിന് “ബലഹീനതകൾ,” “ദൗർബല്യങ്ങൾ” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദത്തിന് അസുഖം, ബലഹീനത, ദൗർബല്യം എന്നീ അർത്ഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως πληρωθῇ
  choice: നിറവേറേണ്ടതിനായിരുന്നു ഇത്
  rationale: ഉദ്ദേശ്യവും ഫലവും ഉൾക്കൊള്ളാവുന്ന മത്തായിയുടെ നിവൃത്തി-പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου
  choice: യെശയ്യാ പ്രവാചകനിലൂടെ അരുളിച്ചെയ്യപ്പെട്ടത്
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന മധ്യസ്ഥത ‘പ്രവാചകനിലൂടെ’ എന്നു സംരക്ഷിക്കുന്നു; ദൈവിക പ്രവചനസന്ദർഭത്തിന് ‘അരുളിച്ചെയ്യപ്പെട്ടത്’ മാന്യവും സ്വാഭാവികവുമാണ്.
- source_word: Αὐτὸς
  choice: അവൻതന്നെ
  rationale: ഗ്രീക്കിലെ ഊന്നൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: τὰς ἀσθενείας ἡμῶν
  choice: നമ്മുടെ ബലഹീനതകൾ
  rationale: ἀσθένεια എന്ന പദത്തിന്റെ ബലഹീനത, ദൗർബല്യം, അസുഖം എന്നീ വിശാല അർത്ഥപരിധി സംരക്ഷിക്കുന്നു; രോഗശാന്തിയുടെ സമീപസന്ദർഭത്തിൽ ‘അസുഖങ്ങൾ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἔλαβεν
  choice: ഏറ്റെടുത്തു
  rationale: λαμβάνω എന്നതിന്റെ ‘എടുക്കുക/സ്വീകരിക്കുക’ എന്ന അർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘നീക്കിക്കളഞ്ഞു’ എന്ന അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: τὰς νόσους ἐβάστασεν
  choice: രോഗങ്ങൾ ചുമന്നു
  rationale: νόσος എന്നതിന്റെ വ്യക്തമായ രോഗാർഥവും βαστάζω എന്നതിന്റെ ചുമക്കുക/വഹിക്കുക എന്ന അർത്ഥവും നിലനിർത്തുന്നു; യെശയ്യാവ് 53:4-നോടുള്ള വാചികബന്ധവും കേൾപ്പിക്കുന്നു.
theological_decisions:
- issue: യെശയ്യാവ് 53:4 ഉദ്ധരണി മത്തായിയുടെ രോഗശാന്തിസന്ദർഭത്തിൽ അവതരിപ്പിക്കൽ
  choice: ‘ബലഹീനതകൾ’ എന്നും ‘രോഗങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്തി, ‘ഏറ്റെടുത്തു/ചുമന്നു’ എന്ന ചുമക്കലിന്റെ ഭാഷ നിലനിർത്തി.
  alternative: ‘അസുഖങ്ങൾ’ എന്നും ‘വ്യാധികൾ’ എന്നും കൂടുതൽ വൈദ്യപരമായി പരിഭാഷപ്പെടുത്തുക; അല്ലെങ്കിൽ പകരക്കാരനായി സഹിക്കുന്നതിനെ കൂടുതൽ വ്യക്തമാക്കുന്ന ഭാഷ ഉപയോഗിക്കുക.
  rationale: സമീപസന്ദർഭത്തിലെ ശാരീരിക രോഗശാന്തി വ്യക്തമാക്കുമ്പോഴും, യെശയ്യാവിലെ വിശാലമായ ദുഃഖ-വഹിക്കൽ ആശയത്തെയും സാധ്യതയുള്ള ദൈവശാസ്ത്രപരമായ പ്രതിധ്വനിയെയും ഒരു പ്രത്യേക സിദ്ധാന്തത്തിലേക്ക് ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. പ്രവചനസൂത്രവാക്യത്തിന് ഔപചാരിക ഗൗരവം നിലനിർത്തിയെങ്കിലും പഴഞ്ചൻ പദക്രമം ഒഴിവാക്കി. ഉദ്ധരണിയിലെ സമാന്തരഘടനയും ‘അവൻതന്നെ’ എന്ന ഊന്നലും സംരക്ഷിച്ചു.
