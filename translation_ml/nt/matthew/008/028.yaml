id: MAT.8.28
reference: Matthew 8:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ⸂ἐλθόντος αὐτοῦ⸃ εἰς τὸ πέραν εἰς τὴν χώραν τῶν ⸀Γαδαρηνῶν ὑπήντησαν αὐτῷ δύο δαιμονιζόμενοι ἐκ τῶν μνημείων ἐξερχόμενοι, χαλεποὶ λίαν ὥστε μὴ ἰσχύειν τινὰ παρελθεῖν διὰ τῆς ὁδοῦ ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/028.yaml
  text: And when he came to the other side[a], into the region of the Gadarenes, two demon-possessed men met him, coming out of the tombs[c][b], so extremely fierce that no one was able to pass along that road.
translation:
  language: ml
  text: അവൻ മറുകരയിലെ ഗദരേന്യരുടെ പ്രദേശത്ത് എത്തിയപ്പോൾ,[a] കല്ലറകളിൽനിന്ന് പുറത്തുവന്ന ഭൂതബാധിതരായ രണ്ടു പുരുഷന്മാർ അവനെ എതിരേറ്റു. അവർ അത്യന്തം ഉഗ്രരായിരുന്നതിനാൽ[b] ആ വഴിയിലൂടെ കടന്നുപോകാൻ ആർക്കും കഴിഞ്ഞിരുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കയ്യെഴുത്തുപ്രതികളിൽ “ഗദരേന്യർ” എന്നതിനുപകരം “ഗെർഗെസേന്യർ” എന്നോ “ഗെരസേന്യർ” എന്നോ വായിക്കുന്നു.
    reason: textual_variant
  - marker: b
    text: “ഉഗ്രർ” എന്നതിന് “അപകടകാരികൾ” എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντος αὐτοῦ
  choice: അവൻ ... എത്തിയപ്പോൾ
  rationale: കർത്തൃസംബന്ധമായ സ്വതന്ത്ര ഷഷ്ഠീപ്രയോഗത്തെ സ്വാഭാവികമായ മലയാള കാലവാക്യമായി നൽകുന്നു.
- source_word: τὸ πέραν
  choice: മറുകര
  rationale: സന്ദർഭത്തിലെ തടാകത്തിന്റെ എതിർകരയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളപ്രയോഗം.
- source_word: χώραν τῶν Γαδαρηνῶν
  choice: ഗദരേന്യരുടെ പ്രദേശം
  rationale: χώραയുടെ ഭൂമിശാസ്ത്രപരമായ അർഥം ‘പ്രദേശം’ വ്യക്തമാക്കുന്നു; SBLGNTയിലെ Γαδαρηνῶν എന്ന വായന ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: ὑπήντησαν αὐτῷ
  choice: അവനെ എതിരേറ്റു
  rationale: അവർ അവന്റെ നേരെ വന്ന് കണ്ടുമുട്ടിയതിനെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: δύο δαιμονιζόμενοι
  choice: ഭൂതബാധിതരായ രണ്ടു പുരുഷന്മാർ
  rationale: പൈശാചിക ശക്തിയുടെ അധീനതയിലുള്ളവരെന്ന ഗ്രീക്ക് പങ്കുപദത്തിന്റെ ആശയം വ്യക്തമായി നൽകുന്നു; സന്ദർഭത്തിൽ സൂചിതമായ പുരുഷന്മാരെയും വ്യക്തമാക്കുന്നു.
- source_word: ἐκ τῶν μνημείων ἐξερχόμενοι
  choice: കല്ലറകളിൽനിന്ന് ഇറങ്ങിവന്ന
  rationale: ശവസംസ്കാരസ്ഥലങ്ങളിൽനിന്നുള്ള അവരുടെ വരവ് ദൃശ്യവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: χαλεποὶ λίαν
  choice: അത്യന്തം ഉഗ്രർ
  rationale: χαλεπός എന്നതിലെ ഉഗ്രതയും അപകടകാരിതയും നിലനിർത്തുന്നു; λίαν ‘അത്യന്തം’ എന്ന് ശക്തിപ്പെടുത്തുന്നു, എന്നാൽ പ്രത്യേകമായി ശാരീരിക അക്രമം മാത്രമെന്ന് പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: ὥστε μὴ ἰσχύειν τινὰ παρελθεῖν
  choice: കടന്നുപോകാൻ ആർക്കും കഴിഞ്ഞിരുന്നില്ല
  rationale: ὥστε സൂചിപ്പിക്കുന്ന ഫലവും ἰσχύωയുടെ ഇവിടെ പ്രസക്തമായ കഴിവ്/സാധ്യത എന്ന അർഥവും വ്യക്തമായി നൽകുന്നു.
- source_word: διὰ τῆς ὁδοῦ ἐκείνης
  choice: ആ വഴിയിലൂടെ
  rationale: διὰ + genitive സൂചിപ്പിക്കുന്ന യാത്രാമാർഗം മലയാളത്തിൽ കൃത്യവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: പൈശാചിക ബാധയുടെ ഭാഷ
  choice: ഭൂതബാധിതർ
  alternative: ഭൂതങ്ങളുടെ അധീനതയിലുള്ളവർ
  rationale: വ്യക്തിപരമായ പൈശാചിക പ്രവർത്തനത്തെ നിലനിർത്തുന്ന, സാധാരണ മലയാളവായനക്കാർക്ക് പരിചിതമായ പ്രയോഗമാണിത്; ഗ്രീക്ക് പദം അനുവദിക്കുന്നതിലപ്പുറം സാങ്കേതികമായ സിദ്ധാന്തവാദം ചേർക്കുന്നില്ല.
- issue: സ്ഥലനാമത്തിലെ പാഠഭേദം
  choice: ഗദരേന്യർ
  alternative: ഗെർഗെസേന്യർ / ഗെരസേന്യർ
  rationale: പ്രധാനപാഠം SBLGNTയിലെ Γαδαρηνῶν പിന്തുടരുന്നു; പ്രധാന കയ്യെഴുത്തുപ്രതി വ്യത്യാസങ്ങൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. ദീർഘമായ ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് മലയാളവാക്യങ്ങളാക്കി; പങ്കുപദബന്ധങ്ങളും ഫലബന്ധവും സംരക്ഷിച്ചു.
