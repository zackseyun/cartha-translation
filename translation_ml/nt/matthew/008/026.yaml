id: MAT.8.26
reference: Matthew 8:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Τί δειλοί ἐστε, ὀλιγόπιστοι; τότε ἐγερθεὶς ἐπετίμησεν τοῖς ἀνέμοις καὶ τῇ θαλάσσῃ, καὶ ἐγένετο γαλήνη μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/026.yaml
  text: And he said to them, “Why are you fearful, you of little faith?” Then, having risen, he rebuked the winds and the sea, and there was a great calm.
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “നിങ്ങൾ എന്തിന് ഭയപ്പെടുന്നു, അല്പവിശ്വാസികളേ?” പിന്നെ അവൻ എഴുന്നേറ്റ് കാറ്റുകളെയും കടലിനെയും ശാസിച്ചു; അപ്പോൾ വലിയ ശാന്തത ഉണ്ടായി.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δειλοί
  choice: ഭയപ്പെടുന്നു
  rationale: സന്ദർഭത്തിൽ ശിഷ്യന്മാരുടെ ഭയഭരിതമായ അവസ്ഥയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; ‘ഭീരുക്കൾ’ എന്ന സ്വഭാവവിധിപോലെ കേൾക്കുന്നത് ഒഴിവാക്കുന്നു.
- source_word: ὀλιγόπιστοι
  choice: അല്പവിശ്വാസികളേ
  rationale: യേശുവിന്റെ നേരിട്ടുള്ള അഭിസംബോധനയും ‘ചെറിയ/കുറഞ്ഞ വിശ്വാസമുള്ളവർ’ എന്ന ഗ്രീക്ക് അർഥവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἐπετίμησεν
  choice: ശാസിച്ചു
  rationale: കാറ്റിനോടും കടലിനോടുമുള്ള അധികാരപൂർവമായ ശാസനയെ വ്യക്തമാക്കുന്ന പതിവ് ബൈബിൾപ്രയോഗം.
- source_word: γαλήνη μεγάλη
  choice: വലിയ ശാന്തത
  rationale: മുമ്പുണ്ടായ കൊടുങ്കാറ്റിന് വിപരീതമായ അസാധാരണമായ ശാന്താവസ്ഥയെ ഗ്രീക്കിലെ തീവ്രതയോടെ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ὀλιγόπιστοι എന്ന അഭിസംബോധനയുടെ സ്ഥാനം
  choice: ചോദ്യത്തിന്റെ ആരംഭത്തിൽ ‘അല്പവിശ്വാസികളേ’ എന്നു നൽകി
  alternative: ‘നിങ്ങൾ എന്തിന് ഭയപ്പെടുന്നു, അല്പവിശ്വാസികളേ?’
  rationale: ഗ്രീക്കിൽ അഭിസംബോധന ചോദ്യം കഴിഞ്ഞാണ് വരുന്നത്; എന്നാൽ മലയാളത്തിലെ സ്വാഭാവിക നേരിട്ടുള്ള അഭിസംബോധനയ്ക്കായി മുന്നിലാക്കി. അർഥവും ശാസനയുടെ ഊന്നലും നിലനിൽക്കുന്നു.
- issue: ἐγερθεὶς എന്ന ക്രിയാവിശേഷണരൂപം
  choice: ‘പിന്നെ അവൻ എഴുന്നേറ്റ്’
  alternative: ‘പിന്നെ എഴുന്നേറ്റശേഷം’
  rationale: സംഭവക്രമം വ്യക്തമായി നിലനിർത്തുകയും യേശു ഉറക്കത്തിൽനിന്ന് എഴുന്നേറ്റുവെന്ന മുൻസന്ദർഭത്തോട് സ്വാഭാവികമായി ചേരുകയും ചെയ്യുന്നു; അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. മൂലത്തിലെ ചോദ്യം, അഭിസംബോധന, സംഭവക്രമം, ‘വലിയ ശാന്തത’ എന്ന ഊന്നൽ എന്നിവ സംരക്ഷിച്ചു.
