id: MAT.8.4
reference: Matthew 8:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Ὅρα μηδενὶ εἴπῃς, ἀλλὰ ὕπαγε σεαυτὸν δεῖξον τῷ ἱερεῖ, καὶ προσένεγκον τὸ δῶρον ὃ προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/004.yaml
  text: And Jesus said to him[a], “See that you tell no one, but go, show yourself to the priest, and offer the gift that Moses commanded[b], as a testimony to them.”
translation:
  language: ml
  text: 'യേശു അവനോടു പറഞ്ഞു: “നോക്കൂ, ആരോടും പറയരുത്. എന്നാൽ പോയി നിന്നെത്തന്നെ പുരോഹിതനു കാണിച്ചുകൊടുക്കുക; മോശ കല്പിച്ച വഴിപാട് അർപ്പിക്കുക[b], അവർക്കു സാക്ഷ്യമായി.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അവർക്കുള്ള സാക്ഷ്യമായി” എന്നും പരിഭാഷപ്പെടുത്താം. ഈ പ്രയോഗം പുരോഹിതന്മാർക്കു സമർപ്പിക്കുന്ന തെളിവിനെ സൂചിപ്പിക്കാം; വിശ്വസിക്കാത്തവർക്കെതിരായ പരോക്ഷസാക്ഷ്യമായും ചിലർ ഇതിനെ മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: കുഷ്ഠരോഗത്തിൽനിന്ന് ശുദ്ധീകരിക്കപ്പെട്ട ഒരാൾക്കായി മോശയുടെ ന്യായപ്രമാണത്തിൽ നിശ്ചയിച്ച നടപടിയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ലേവ്യപുസ്തകം 14 കാണുക.
    reason: cross_reference
lexical_decisions:
- source_word: Ὅρα μηδενὶ εἴπῃς
  choice: നോക്കൂ, ആരോടും പറയരുത്
  rationale: Ὅρα ഇവിടെ മുന്നറിയിപ്പിന്റെയോ കർശന നിർദേശത്തിന്റെയോ ശക്തിയുള്ള പ്രയോഗമാണ്. തുടർന്നുള്ള നിരോധനം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὕπαγε
  choice: പോയി
  rationale: ചലനത്തെ സൂചിപ്പിക്കുന്ന ലളിതമായ കല്പന; മലയാള വാക്യബന്ധത്തിൽ അടുത്ത കല്പനയുമായി സ്വാഭാവികമായി ചേരുന്നു.
- source_word: σεαυτὸν δεῖξον τῷ ἱερεῖ
  choice: നിന്നെത്തന്നെ പുരോഹിതനു കാണിച്ചുകൊടുക്കുക
  rationale: പ്രതിഫലന സർവനാമവും പുരോഹിതന്റെ പരിശോധനയ്ക്കായി സ്വയം ഹാജരാകുന്ന ആശയവും നിലനിർത്തുന്നു.
- source_word: προσένεγκον τὸ δῶρον
  choice: വഴിപാട് അർപ്പിക്കുക
  rationale: ആരാധനാക്രമ പശ്ചാത്തലത്തിൽ προσφέρω-യുടെ അർപ്പണാർഥവും δῶρον-ന്റെ സമർപ്പിത ദാനാർഥവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὃ προσέταξεν Μωϋσῆς
  choice: മോശ കല്പിച്ച
  rationale: പ്രസ്താവിച്ച ക്രമത്തിന്റെ മോശൈക അധികാരം ലളിതവും നേരിട്ടുമായ ഭാഷയിൽ നിലനിർത്തുന്നു.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: അത് അവർക്കുള്ള സാക്ഷ്യമായിരിക്കട്ടെ
  rationale: μαρτύριον എന്നതിന്റെ സാക്ഷ്യം/തെളിവ് എന്ന തുറന്ന അർഥവും αὐτοῖς എന്ന സർവനാമത്തിന്റെ വ്യക്തമാക്കാത്ത സൂചിതവിഭാഗവും നിലനിർത്തുന്നു.
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: യേശു അവനോടു പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനത്തെ സ്വാഭാവിക മലയാള ആഖ്യാനശൈലിയിൽ ഭൂതകാലമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: εἰς μαρτύριον αὐτοῖς എന്നതിന്റെ സൂചിതവിഭാഗവും സാക്ഷ്യത്തിന്റെ സ്വഭാവവും
  choice: “അവർക്കുള്ള സാക്ഷ്യം” എന്നു തുറന്ന നിലയിൽ സൂക്ഷിച്ചു
  alternative: “പുരോഹിതന്മാർക്കുള്ള തെളിവ്” അല്ലെങ്കിൽ “അവർക്കെതിരായ സാക്ഷ്യം”
  rationale: αὐτοῖς ആരെ സൂചിപ്പിക്കുന്നു എന്ന് വാക്യം വ്യക്തമാക്കുന്നില്ല; μαρτύριον അനുകൂല തെളിവോ പ്രതികൂല സാക്ഷ്യമോ എന്ന് നിർബന്ധമായി തീരുമാനിക്കുന്നതുമില്ല. അതിനാൽ മൂലപാഠത്തിലെ അവ്യക്തത സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ആരാധനാക്രമ പശ്ചാത്തലം വ്യക്തമാക്കാൻ “വഴിപാട് അർപ്പിക്കുക” ഉപയോഗിച്ചു; എന്നാൽ സാക്ഷ്യം ആരോടാണെന്നും അതിന്റെ അനുകൂലമോ പ്രതികൂലമോ ആയ ശക്തിയെന്നും നിർണ്ണയിക്കാതെ സൂക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
