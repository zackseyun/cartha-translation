id: MAT.8.14
reference: Matthew 8:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἐλθὼν ὁ Ἰησοῦς εἰς τὴν οἰκίαν Πέτρου εἶδεν τὴν πενθερὰν αὐτοῦ βεβλημένην καὶ πυρέσσουσαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/014.yaml
  text: And when Jesus came into Peter’s house[b][a], he saw his mother-in-law lying down and having a fever.
translation:
  language: ml
  text: യേശു പത്രോസിന്റെ വീട്ടിൽ വന്നപ്പോൾ, പത്രോസിന്റെ അമ്മായിയമ്മ പനിപിടിച്ചു കിടക്കുന്നതു കണ്ടു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθὼν
  choice: വന്നപ്പോൾ
  rationale: കാലസൂചനയുള്ള aorist participle മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും യേശു വീട്ടിലെത്തിയതിനു പിന്നാലെയുള്ള ദൃശ്യം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: οἰκίαν Πέτρου
  choice: പത്രോസിന്റെ വീട്ടിൽ
  rationale: ഉടമസ്ഥത സൂചിപ്പിക്കുന്ന genitive-ന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: πενθερὰν αὐτοῦ
  choice: പത്രോസിന്റെ അമ്മായിയമ്മ
  rationale: πενθερά എന്നത് ‘അമ്മായിയമ്മ’ എന്നാണ്. αὐτοῦ പത്രോസിനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘അവന്റെ’ എന്നു പറഞ്ഞാൽ മലയാളത്തിൽ യേശുവിനെ സൂചിപ്പിക്കുന്നതായി തെറ്റിദ്ധരിക്കാമെന്നതിനാൽ പേര് ആവർത്തിച്ചു.
- source_word: βεβλημένην
  choice: കിടക്കുന്നതു
  rationale: രോഗാവസ്ഥയിൽ കിടന്നിരുന്ന നിലയെ സൂചിപ്പിക്കുന്ന ഈ perfect passive participle-ന്റെ സന്ദർഭോചിതമായ അവതരണം. മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്ത ‘കിടക്കയിൽ’ എന്ന ആശയം ചേർത്തിട്ടില്ല.
- source_word: πυρέσσουσαν
  choice: പനിപിടിച്ചു
  rationale: തുടർന്നുകൊണ്ടിരുന്ന പനിബാധയെ സാധാരണ ആധുനിക മലയാളത്തിൽ സംക്ഷിപ്തമായും വ്യക്തമായും പറയുന്നു; ‘കിടക്കുന്നതു’ എന്നതിനോടൊപ്പം ചേർന്ന് രണ്ട് participle-കളുടെയും അർഥം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: αὐτοῦ എന്ന സർവനാമത്തിന്റെ സൂചിതവ്യക്തി
  choice: അമ്മായിയമ്മ പത്രോസിന്റേതാണെന്ന് വ്യക്തമായി രേഖപ്പെടുത്തി.
  alternative: ‘അവന്റെ അമ്മായിയമ്മ’ എന്നു പരിഭാഷപ്പെടുത്തുക.
  rationale: വാക്യഘടനയും സന്ദർഭവും αὐτοῦ പത്രോസിനെ സൂചിപ്പിക്കുന്നതായി വ്യക്തമാക്കുന്നു. മലയാളത്തിലെ ‘അവന്റെ’ എന്ന രൂപം യേശുവിനെ സൂചിപ്പിക്കുന്നതായി തെറ്റിദ്ധരിക്കപ്പെടാം; പേര് ആവർത്തിക്കുന്നത് അർഥം കൂട്ടിച്ചേർക്കാതെ ആശയക്കുഴപ്പം ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വിവരണം. ‘പനിപിടിച്ചു കിടക്കുക’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ പ്രയോഗമാണ്; അതേസമയം മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘കിടക്കയിൽ’ എന്ന വിശദാംശം ചേർത്തിട്ടില്ല.
