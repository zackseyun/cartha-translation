  source_fidelity: The Malayalam accurately renders the temporal participle (ἐλθών), Peter’s house, Peter’s mother-in-law, her recumbent condition (βεβλημένην), and her fever (πυρέσσουσαν). Repeating ‘പത്രോസിന്റെ’ correctly prevents ambiguity about the referent of αὐτοῦ without adding meaning.
  naturalness: ‘യേശു പത്രോസിന്റെ വീട്ടിൽ വന്നപ്പോൾ, പത്രോസിന്റെ അമ്മായിയമ്മ പനിപിടിച്ചു കിടക്കുന്നതു കണ്ടു’ is clear, idiomatic modern standard Malayalam and retains an appropriately restrained narrative register.
  terminology: ‘അമ്മായിയമ്മ’ is the normal term for mother-in-law. ‘പനിപിടിച്ചു കിടക്കുന്നതു’ naturally expresses the concurrent fever and lying condition without importing an explicit bed or an intensified sense of suffering.
