id: MAT.8.11
reference: Matthew 8:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι πολλοὶ ἀπὸ ἀνατολῶν καὶ δυσμῶν ἥξουσιν καὶ ἀνακλιθήσονται μετὰ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ ἐν τῇ βασιλείᾳ τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/011.yaml
  text: But I tell you that many will come from east and west and will recline at table with Abraham and Isaac and Jacob in the kingdom of heaven[a][b].
translation:
  language: ml
  text: 'എന്നാൽ ഞാൻ നിങ്ങളോടു പറയുന്നു: കിഴക്കുനിന്നും പടിഞ്ഞാറുനിന്നും അനേകർ വന്ന് സ്വർഗരാജ്യത്തിൽ അബ്രാഹാമിനോടും യിസ്ഹാക്കിനോടും യാക്കോബിനോടുംകൂടെ വിരുന്നിനിരിക്കും[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പദശഃ, “ചാരിക്കിടക്കും.” പുരാതനകാലത്ത് വിരുന്നുമേശയിൽ സ്ഥാനം സ്വീകരിച്ച് ഭക്ഷണം കഴിക്കുന്ന രീതിയെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
  - marker: b
    text: “കിഴക്കുനിന്നും പടിഞ്ഞാറുനിന്നും” എന്നത് ദൂരദേശങ്ങളിൽനിന്നുള്ളവരെ, ഇസ്രായേലിന് പുറത്തുള്ളവരെയും ഉൾപ്പെടെ, സൂചിപ്പിക്കുന്നതാകാം.
    reason: cross_reference
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: എന്നാൽ ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: δέ മുൻവാക്യത്തോടുള്ള മൃദുവായ വൈരുധ്യവും ആശയത്തിലെ തിരിവും സൂചിപ്പിക്കുന്നു; ‘എന്നാൽ’ അത് സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: πολλοὶ
  choice: അനേകർ
  rationale: നാമപദമായി പ്രവർത്തിക്കുന്ന വിശേഷണത്തെ മലയാളത്തിൽ ചുരുക്കവും ഗൗരവമുള്ളതുമായ രൂപത്തിൽ നൽകുന്നു.
- source_word: ἀπὸ ἀνατολῶν καὶ δυσμῶν
  choice: കിഴക്കുനിന്നും പടിഞ്ഞാറുനിന്നും
  rationale: ബഹുവചനരൂപങ്ങൾ വിശാലമായ ദിക്കുകളെയോ പ്രദേശങ്ങളെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്; വാചകം അതിനെ വിശദീകരിച്ച് ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: ἥξουσιν
  choice: വന്ന്
  rationale: ഭാവികാലത്തിന്റെ അർഥം തുടർന്നുള്ള ‘വിരുന്നിനിരിക്കും’ എന്ന ക്രിയയോടൊപ്പം സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: ἀνακλιθήσονται
  choice: വിരുന്നിനിരിക്കും
  rationale: പുരാതന വിരുന്നിൽ ഭക്ഷണത്തിനായി ചാരിക്കിടക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ വിരുന്ന്-പങ്കാളിത്ത ഭാവം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; പദശഃ രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: μετὰ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ
  choice: അബ്രാഹാമിനോടും യിസ്ഹാക്കിനോടും യാക്കോബിനോടുംകൂടെ
  rationale: μετά സഹവാസവും ഇവിടെ ഒരേ വിരുന്നിലെ കൂട്ടായ്മയും സൂചിപ്പിക്കുന്നു; പേരുകൾ മലയാള ബൈബിൾ പ്രയോഗത്തിന് യോജിച്ച രൂപത്തിൽ നൽകിയിരിക്കുന്നു.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: സ്വർഗരാജ്യത്തിൽ
  rationale: മത്തായിയുടെ സവിശേഷ പ്രയോഗത്തിന് മലയാളത്തിൽ സ്ഥാപിതവും സ്വാഭാവികവുമായ തുല്യരൂപമാണിത്; ഗ്രീക്കിലെ ബഹുവചന ‘ആകാശങ്ങൾ’ മലയാളത്തിൽ പദശഃ പകർത്തുന്നത് അസ്വാഭാവികമായിരിക്കും.
theological_decisions:
- issue: വിരുന്നിന്റെ ദൃശ്യവും അന്ത്യകാല കൂട്ടായ്മയും
  choice: ‘വിരുന്നിനിരിക്കും’ എന്ന പ്രയോഗത്തിലൂടെ ഭക്ഷണകൂട്ടായ്മയുടെ ദൃശ്യം നിലനിർത്തി.
  alternative: ‘ഒരുമിച്ച് ഇരിക്കും’ അല്ലെങ്കിൽ പദശഃ ‘ചാരിക്കിടക്കും’
  rationale: വാക്യം രാജ്യത്തിൽ വെറും സാന്നിധ്യമല്ല, അബ്രാഹാം, യിസ്ഹാക്ക്, യാക്കോബ് എന്നിവരോടുള്ള വിരുന്ന്-കൂട്ടായ്മയാണ് ചിത്രീകരിക്കുന്നത്; അതേസമയം അധികമായ ഉപദേശവിവരം ചേർത്തിട്ടില്ല.
- issue: കിഴക്കും പടിഞ്ഞാറും നിന്നുള്ള ‘അനേകർ’ ആരെന്ന ചോദ്യം
  choice: വാചകത്തിലുള്ള ഭൂമിശാസ്ത്രപരമായ ഭാഷ മാത്രം മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
  alternative: ‘അനേകം വിജാതീയർ’ എന്ന് വ്യക്തമായി ചേർക്കുക
  rationale: സന്ദർഭം ഇസ്രായേലിന് പുറത്തുള്ളവരെയും ശക്തമായി സൂചിപ്പിച്ചേക്കാം; എങ്കിലും ഗ്രീക്ക് പാഠം ‘വിജാതീയർ’ എന്ന് നേരിട്ട് പറയാത്തതിനാൽ ആ നിഗമനം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘വിരുന്നിനിരിക്കും’ എന്നത് പുരാതന ഭക്ഷണരീതിയുടെ പദശഃ ഭാവം മുഖ്യപാഠത്തിൽ ഭാരമാക്കാതെ വിരുന്ന്-കൂട്ടായ്മ വ്യക്തമായി നൽകുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
