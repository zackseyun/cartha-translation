source:
  edition: SBLGNT
  text: καὶ ἰδοὺ πᾶσα ἡ πόλις ἐξῆλθεν εἰς ⸀ὑπάντησιν τῷ Ἰησοῦ, καὶ ἰδόντες αὐτὸν παρεκάλεσαν ὅπως μεταβῇ ἀπὸ τῶν ὁρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/034.yaml
  text: And behold[a], the whole city went out to meet Jesus, and when they saw him, they begged him to depart from their region.
translation:
  language: ml
  text: ഇതാ, നഗരം മുഴുവനും യേശുവിനെ എതിരേൽക്കാൻ പുറത്തേക്കു പോയി. അവർ അവനെ കണ്ടപ്പോൾ, തങ്ങളുടെ പ്രദേശം[a] വിട്ടുപോകാൻ അവനോട് ഉറച്ചു അപേക്ഷിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘തങ്ങളുടെ ഭൂപ്രദേശത്തുനിന്ന്’; അക്ഷരാർഥത്തിൽ ‘തങ്ങളുടെ അതിരുകളിൽനിന്ന്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും വിവരണത്തിന് സജീവത നൽകുകയും ചെയ്യുന്ന ഗ്രീക്ക് വ്യവഹാരചിഹ്നത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: πᾶσα ἡ πόλις
  choice: പട്ടണം മുഴുവനും
  rationale: പട്ടണത്തിലെ ജനങ്ങളെ സമൂഹമായി സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം സ്വാഭാവികമായി പകരുന്നു; ഓരോ വ്യക്തിയും ഒഴിവില്ലാതെ എന്ന അർഥം നിർബന്ധിക്കുന്നില്ല.
- source_word: ἐξῆλθεν εἰς ὑπάντησιν
  choice: കാണാൻ പുറപ്പെട്ടുവന്നു
  rationale: ഒരാളെ അഭിമുഖീകരിക്കാനോ സ്വീകരിക്കാനോ പുറത്തേക്കു പോകുന്ന ഉദ്ദേശ്യം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἰδόντες αὐτὸν
  choice: അവർ അവനെ കണ്ടപ്പോൾ
  rationale: എയോറിസ്റ്റ് കൃദ്ദന്തരൂപത്തിന്റെ കാലസംബന്ധമായ അർഥവും സംഭവക്രമവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: παρεκάλεσαν
  choice: കേണപേക്ഷിച്ചു
  rationale: ഒരു സാധാരണ അഭ്യർഥനയെക്കാൾ ശക്തമായ, ഉറ്റ അപേക്ഷയാണ് സന്ദർഭത്തിൽ ക്രിയ പ്രകടിപ്പിക്കുന്നത്.
- source_word: ὅπως μεταβῇ
  choice: പോയിത്തരണമെന്ന്
  rationale: അവരുടെ അപേക്ഷയുടെ ഉള്ളടക്കം സ്വാഭാവിക മലയാളത്തിൽ പകരുകയും പ്രദേശം വിട്ടുപോകണമെന്ന ശക്തമായ അഭ്യർഥന വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ἀπὸ τῶν ὁρίων αὐτῶν
  choice: തങ്ങളുടെ പ്രദേശത്തുനിന്ന്
  rationale: ὅρια എന്നതിന്റെ അക്ഷരാർഥം അതിരുകളാണെങ്കിലും ഇവിടെ ആ അതിരുകൾക്കുള്ളിലെ ഭൂപ്രദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: പട്ടണവാസികൾ യേശുവിനോട് പോകാൻ അപേക്ഷിച്ചതിന്റെ കാരണം
  choice: അവരുടെ ഉദ്ദേശ്യം വ്യക്തമാക്കാതെ അപേക്ഷ മാത്രം രേഖപ്പെടുത്തി.
  alternative: യേശുവിന്റെ ശക്തിയോടുള്ള ഭയം, പന്നികളുടെ നഷ്ടത്തെച്ചൊല്ലിയ കോപം, അല്ലെങ്കിൽ സംഭവത്തെത്തുടർന്നുള്ള പൊതുവായ പരിഭ്രാന്തി.
  rationale: ഗ്രീക്ക് പാഠം അപേക്ഷയുടെ കാരണം വ്യക്തമാക്കുന്നില്ല; അതിനാൽ വിവരണത്തിലെ ദൈവശാസ്ത്രപരവും ആഖ്യാനപരവുമായ സംഘർഷം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഇതാ’ മൂലപാഠത്തിലെ ശ്രദ്ധാകർഷക സ്വരം നിലനിർത്തുന്നു; ‘കേണപേക്ഷിച്ചു’ അപേക്ഷയുടെ തീവ്രത പകരുന്നു.
