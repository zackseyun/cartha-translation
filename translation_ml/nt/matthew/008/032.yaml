id: MAT.8.32
reference: Matthew 8:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Ὑπάγετε. οἱ δὲ ἐξελθόντες ἀπῆλθον εἰς ⸂τοὺς χοίρους⸃· καὶ ἰδοὺ ὥρμησεν πᾶσα ἡ ⸀ἀγέλη κατὰ τοῦ κρημνοῦ εἰς τὴν θάλασσαν, καὶ ἀπέθανον ἐν τοῖς ὕδασιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/032.yaml
  text: And he said to them[a], “Go.” Then they came out and went into the pigs; and behold[c][b], the whole herd rushed down the steep bank into the sea and died in the waters.
translation:
  language: ml
  text: അവൻ അവരോടു, “പോകുവിൻ” എന്നു പറഞ്ഞു. അവർ പുറത്തുവന്ന് പന്നികളിൽ കടന്നു. ഇതാ, പന്നിക്കൂട്ടം മുഴുവനും കുത്തനെയുള്ള ചരിവിലൂടെ കടലിലേക്കു പാഞ്ഞിറങ്ങി വെള്ളത്തിൽ മരിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വെള്ളത്തിൽ മുങ്ങിമരിച്ചു.” ഗ്രീക്ക് പാഠം കൂടുതൽ അക്ഷരാർഥത്തിൽ “വെള്ളത്തിൽ മരിച്ചു” എന്നാണ് പറയുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὑπάγετε
  choice: പോകുവിൻ
  rationale: യേശുവിന്റെ ഹ്രസ്വവും അധികാരപൂർണവുമായ കല്പനയെ സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἐξελθόντες
  choice: പുറത്തുവന്ന്
  rationale: ഭൂതബാധിതരിൽനിന്നുള്ള പുറപ്പെടലിനെ സൂചിപ്പിക്കുന്ന ക്രിയാവിശേഷണരൂപം മലയാളത്തിലെ സ്വാഭാവികമായ സംഭവക്രമത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀπῆλθον εἰς τοὺς χοίρους
  choice: പന്നികളിൽ കടന്നു
  rationale: ഭൂതങ്ങൾ മൃഗങ്ങളിലേക്കു പ്രവേശിച്ചുവെന്ന സന്ദർഭാർഥം ചുരുക്കവും വ്യക്തവുമായി നൽകുന്നു.
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: തുടർന്നുള്ള അപ്രതീക്ഷിത സംഭവത്തിലേക്കു വായനക്കാരന്റെ ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗ്രീക്ക് വ്യവഹാരചിഹ്നത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: πᾶσα ἡ ἀγέλη
  choice: കൂട്ടം മുഴുവനും
  rationale: കൂട്ടനാമത്തോടൊപ്പം πᾶσα നൽകുന്ന സമഗ്രത സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ὥρμησεν
  choice: പാഞ്ഞിറങ്ങി
  rationale: പെട്ടെന്നുള്ള ശക്തമായ താഴോട്ടുള്ള ചലനം സന്ദർഭാനുസൃതമായി അറിയിക്കുന്നു.
- source_word: κατὰ τοῦ κρημνοῦ
  choice: ചെങ്കുത്തായ കരയിലൂടെ
  rationale: κρημνός സൂചിപ്പിക്കാവുന്ന കുത്തനെയുള്ള ചരിവ്, കര, അഥവാ കിഴുക്കാംതൂക്ക് എന്നിവയിൽ ഒന്നിനെ അത്യന്തം നിർദിഷ്ടമാക്കാതെ ഭൂപ്രകൃതി വ്യക്തമാക്കുന്നു.
- source_word: θάλασσαν
  choice: കടൽ
  rationale: ജലാശയത്തെക്കുറിച്ചുള്ള ഗ്രീക്ക് പദത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; മുഖ്യപാഠത്തിൽ ‘തടാകം’ എന്ന ഭൂമിശാസ്ത്രപരമായ വിശദീകരണം ചേർക്കുന്നില്ല.
- source_word: ἀπέθανον ἐν τοῖς ὕδασιν
  choice: വെള്ളത്തിൽ ചത്തു
  rationale: ഗ്രീക്ക് വാചകം നേരിട്ട് പറയുന്ന മരണത്തെ നിലനിർത്തുന്നു; മുങ്ങിമരിച്ചു എന്ന ന്യായമായ അനുമാനം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: പന്നിക്കൂട്ടത്തിന്റെ മരണം എങ്ങനെ വിവരിക്കണം
  choice: “വെള്ളത്തിൽ ചത്തു” എന്ന ഉറവിടപാഠത്തോടടുത്ത പ്രയോഗം
  alternative: “വെള്ളത്തിൽ മുങ്ങിമരിച്ചു”
  rationale: സന്ദർഭം മുങ്ങിമരണത്തെ ശക്തമായി സൂചിപ്പിക്കുന്നുവെങ്കിലും ഗ്രീക്ക് ക്രിയ നേരിട്ട് പറയുന്നത് ‘ചത്തു’ എന്നാണ്; അതിനാൽ വ്യാഖ്യാനപരമായ വിശദീകരണം അടിക്കുറിപ്പിലേക്കു മാറ്റുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘ഇതാ’ എന്ന ശ്രദ്ധാകർഷക പദം ഉറവിടത്തിന്റെ നാടകീയത നിലനിർത്തുന്നു; ഭൂപ്രകൃതിയുടെയും മരണരീതിയുടെയും യഥാർഥമായ അർഥവ്യാപ്തി അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
