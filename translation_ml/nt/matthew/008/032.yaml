revisions:
- from: അവൻ അവരോട്, “പോകുവിൻ” എന്നു പറഞ്ഞു. അവർ പുറത്തുവന്ന് പന്നികളിൽ കടന്നു. അപ്പോൾ ഇതാ, കൂട്ടം മുഴുവനും ചെങ്കുത്തായ കരയിലൂടെ[a] കടലിലേക്കു പാഞ്ഞിറങ്ങി വെള്ളത്തിൽ ചത്തു.[b]
  to: അവൻ അവരോടു, “പോകുവിൻ” എന്നു പറഞ്ഞു. അവർ പുറത്തുവന്ന് പന്നികളിൽ കടന്നു. ഇതാ, പന്നിക്കൂട്ടം മുഴുവനും കുത്തനെയുള്ള ചരിവിലൂടെ കടലിലേക്കു പാഞ്ഞിറങ്ങി വെള്ളത്തിൽ മരിച്ചു.[a]
