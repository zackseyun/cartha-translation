id: MAT.8.29
reference: Matthew 8:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἔκραξαν λέγοντες· Τί ἡμῖν καὶ ⸀σοί, υἱὲ τοῦ θεοῦ; ἦλθες ὧδε πρὸ καιροῦ βασανίσαι ἡμᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/029.yaml
  text: And behold[a], they cried out, saying, “What have we to do with you[b], Son of God? Have you come here before the appointed time to torment us?”
translation:
  language: ml
  text: 'ഇതാ, അവർ നിലവിളിച്ചു പറഞ്ഞു: “ദൈവപുത്രാ, ഞങ്ങൾക്കും നിനക്കും എന്തു കാര്യം?[a] നിശ്ചിതസമയത്തിനു മുമ്പേ ഞങ്ങളെ പീഡിപ്പിക്കാൻ നീ ഇവിടെ വന്നോ?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “നിനക്ക് ഞങ്ങളിൽനിന്ന് എന്തു വേണം?” അക്ഷരാർഥത്തോട് കൂടുതൽ അടുത്ത്: “ഞങ്ങൾക്കും നിനക്കും തമ്മിൽ എന്തുണ്ട്?”'
    reason: lexical_alternative
  - marker: b
    text: “നിശ്ചിതസമയം” എന്നത് “സമയം” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദം ദൈവം നിശ്ചയിച്ച സമയത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: അപ്പോൾ ഇതാ
  rationale: ἰδούവിന്റെ പെട്ടെന്നുള്ള ശ്രദ്ധയാകർഷണവും ആഖ്യാനത്തിലെ സജീവതയും ‘ഇതാ’ നിലനിർത്തുന്നു; καί സന്ദർഭാനുസൃതമായി ‘അപ്പോൾ’ എന്നു സ്വാഭാവികമാക്കി.
- source_word: ἔκραξαν λέγοντες
  choice: അവർ നിലവിളിച്ചു പറഞ്ഞു
  rationale: κράζω സൂചിപ്പിക്കുന്ന ഉച്ചത്തിലുള്ള വിളി ‘നിലവിളിച്ചു’ നൽകുന്നു; λέγοντες-ന്റെ സംസാരഘടകവും നിലനിർത്തുന്നു.
- source_word: Τί ἡμῖν καὶ σοί
  choice: ഞങ്ങൾക്കും നിനക്കും തമ്മിൽ എന്ത്?
  rationale: വേർപാടോ എതിർപ്പോ പ്രകടിപ്പിക്കുന്ന സെമിറ്റിക്-ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ഘടനയും ഉദ്ദേശപൂർവമായ കടുപ്പവും നിലനിർത്തുന്നു; കൂടുതൽ വ്യാഖ്യാനാത്മകമായ ‘നിനക്ക് ഞങ്ങളിൽനിന്ന് എന്തു വേണം?’ എന്ന അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: υἱὲ τοῦ θεοῦ
  choice: ദൈവപുത്രാ
  rationale: യേശുവിനെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്ന ക്രിസ്തുശാസ്ത്രപരമായ പദവി സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἦλθες ὧδε
  choice: നീ ഇവിടെ വന്നോ?
  rationale: ἦλθες എന്ന ഏറിസ്റ്റിനെയും ὧδε എന്ന സ്ഥലസൂചനയെയും മലയാളത്തിലെ സ്വാഭാവിക ചോദ്യരൂപത്തിൽ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: πρὸ καιροῦ
  choice: നിശ്ചിതസമയത്തിനു മുമ്പേ
  rationale: καιρός വെറും കാലമല്ല, നിർണയിക്കപ്പെട്ടോ യോജിച്ചോ ഉള്ള സമയം സൂചിപ്പിക്കാമെന്ന സാധ്യത നിലനിർത്തുന്നു; ‘മുമ്പേ’ അകാലത്വത്തിന്റെ ഭാവം നൽകുന്നു.
- source_word: βασανίσαι ἡμᾶς
  choice: ഞങ്ങളെ പീഡിപ്പിക്കാൻ
  rationale: βασανίζω സൂചിപ്പിക്കുന്ന കഠിനമായ പീഡനത്തെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ശാരീരിക പീഡനം മാത്രമായി അനാവശ്യമായി പരിമിതപ്പെടുത്തുന്നില്ല.
theological_decisions:
- issue: ദുഷ്ടാത്മാക്കൾ യേശുവിന്റെ തിരിച്ചറിവ് പ്രഖ്യാപിക്കുന്നത്
  choice: ദൈവപുത്രാ
  alternative: ദൈവത്തിന്റെ പുത്രാ
  rationale: മൂലപാഠത്തിലെ υἱὲ τοῦ θεοῦ എന്ന നേരിട്ടുള്ള അഭിസംബോധനയും ഉന്നതമായ പദവിയും വിപുലീകരിക്കാതെയും ദുർബലപ്പെടുത്താതെയും നിലനിർത്തുന്നു.
- issue: καιρός എന്നതിലെ അന്തിമന്യായസംബന്ധമായ സൂചന
  choice: നിശ്ചിതസമയത്തിനു മുമ്പേ
  alternative: സമയത്തിനു മുമ്പേ
  rationale: ന്യായവിധിക്കായി ദൈവം നിശ്ചയിച്ച ഒരു സമയം എന്ന സന്ദർഭസൂചന പ്രകടമാക്കുന്നു; എന്നാൽ ആ സമയത്തിന്റെ സ്വഭാവത്തെക്കുറിച്ച് പാഠം പറയാത്ത വിശദാംശങ്ങൾ ചേർക്കുന്നില്ല.
- issue: Τί ἡμῖν καὶ σοί എന്ന പ്രയോഗത്തിന്റെ ബന്ധവിരുദ്ധ ഭാവം
  choice: ഞങ്ങൾക്കും നിനക്കും തമ്മിൽ എന്ത്?
  alternative: നിനക്ക് ഞങ്ങളിൽനിന്ന് എന്തു വേണം?
  rationale: മൂലത്തിലെ ഉദ്ദേശപൂർവമായ അസാധാരണതയും അകലം പാലിക്കുന്ന വെല്ലുവിളിയും പ്രധാനപാഠത്തിൽ നിലനിർത്തി, സ്വാഭാവിക അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ മാന്യവും വായിക്കാൻ എളുപ്പവുമായ ശൈലി. ‘ഇതാ’, ‘ദൈവപുത്രാ’ എന്നീ ബൈബിൾസംബന്ധമായ പരിചിത രൂപങ്ങൾ നിലനിർത്തിയിട്ടും അതിരുകടന്ന പുരാതനഭാഷ ഒഴിവാക്കി. പ്രധാനപാഠത്തിലെ യഥാർത്ഥ പ്രയോഗഭേദവും ദൈവനിശ്ചിത സമയത്തെക്കുറിച്ചുള്ള സൂചനയും അടിക്കുറിപ്പുകളിലൂടെ സംരക്ഷിച്ചു.
