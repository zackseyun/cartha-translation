id: MAT.8.15
reference: Matthew 8:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἥψατο τῆς χειρὸς αὐτῆς, καὶ ἀφῆκεν αὐτὴν ὁ πυρετός, καὶ ἠγέρθη καὶ διηκόνει αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/015.yaml
  text: And he touched her hand, and the fever left her, and she got up and began serving him.
translation:
  language: ml
  text: അവൻ അവളുടെ കൈയിൽ തൊട്ടു; പനി അവളെ വിട്ടുമാറി. അവൾ എഴുന്നേറ്റ് അവനെ ശുശ്രൂഷിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവനെ ശുശ്രൂഷിച്ചുകൊണ്ടിരുന്നു.” ഗ്രീക്കിലെ അപൂർണഭൂതകാലരൂപം തുടരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥψατο
  choice: തൊട്ടു
  rationale: ഈ സന്ദർഭത്തിൽ ἅπτομαι എന്നത് സ്പർശിക്കുക എന്നർഥമാണ്. പ്രവൃത്തിയുടെ തീവ്രത കൂട്ടാതെ സാധാരണവും സ്വാഭാവികവുമായി അർഥം നൽകുന്നു.
- source_word: τῆς χειρὸς αὐτῆς
  choice: അവളുടെ കൈയിൽ
  rationale: χείρ സാധാരണയായി ‘കൈ’ എന്നാണ്. ἅπτομαι-യോടൊപ്പമുള്ള ഗ്രീക്ക് ഷഷ്ഠീവിഭക്തി മലയാളത്തിൽ സ്വാഭാവികമായി ‘കൈയിൽ തൊട്ടു’ എന്നു വരുന്നു.
- source_word: ἀφῆκεν αὐτὴν ὁ πυρετός
  choice: പനി അവളെ വിട്ടുമാറി
  rationale: ἀφίημι ഇവിടെ വിട്ടുപോകുക എന്നർഥത്തിലാണ്. ഗ്രീക്കിലെ പനിയെ കർത്താവാക്കുന്ന പ്രയോഗം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ രൂപമാണിത്.
- source_word: πυρετός
  choice: പനി
  rationale: മൂലപദം നേരിട്ട് പനിയെയാണ് സൂചിപ്പിക്കുന്നത്; കൂടുതൽ വിശദീകരണം ചേർക്കേണ്ടതില്ല.
- source_word: ἠγέρθη
  choice: അവൾ എഴുന്നേറ്റ്
  rationale: ഈ രോഗസൗഖ്യസന്ദർഭത്തിൽ ἐγείρω-യുടെ രൂപം അവൾ കിടന്നിടത്തുനിന്ന് എഴുന്നേറ്റതിനെ സൂചിപ്പിക്കുന്നു. ‘ഉയിർപ്പിക്കപ്പെട്ടു’ എന്ന വിവർത്തനം ഇവിടെ അനാവശ്യമായ ദൈവശാസ്ത്രസൂചന സൃഷ്ടിക്കും.
- source_word: διηκόνει αὐτῷ
  choice: അവനെ ശുശ്രൂഷിച്ചുതുടങ്ങി
  rationale: διακονέω സേവിക്കുക, ആവശ്യങ്ങൾ നോക്കുക എന്നീ അർഥങ്ങൾ വഹിക്കുന്നു. ഗൃഹസന്ദർഭത്തിന് ‘ശുശ്രൂഷിക്കുക’ യോജിക്കുന്നു; അപൂർണഭൂതകാലരൂപത്തിന്റെ ആരംഭാത്മക സാധ്യത ‘തുടങ്ങി’ എന്നതിലൂടെ പ്രകടമാക്കുന്നു, എന്നാൽ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἠγέρθη എന്ന പദത്തിൽ പുനരുത്ഥാനസൂചന അമിതമായി വായിക്കാനുള്ള സാധ്യത
  choice: സാധാരണ ആഖ്യാനാർഥത്തിൽ ‘അവൾ എഴുന്നേറ്റ്’ എന്നു വിവർത്തനം ചെയ്തു
  alternative: ‘അവൾ ഉയിർപ്പിക്കപ്പെട്ടു’
  rationale: ἐγείρω മറ്റു സന്ദർഭങ്ങളിൽ പുനരുത്ഥാനത്തെ സൂചിപ്പിക്കാമെങ്കിലും, ഇവിടെ സൗഖ്യം ലഭിച്ചശേഷം അവൾ എഴുന്നേറ്റു എന്നതാണ് ഉടനെയുള്ള അർഥം. സന്ദർഭം ആവശ്യപ്പെടാത്ത പുനരുത്ഥാന ദൈവശാസ്ത്രം വിവർത്തനത്തിലേക്ക് കൊണ്ടുവരുന്നില്ല.
- issue: διηκόνει എന്ന അപൂർണഭൂതകാലരൂപത്തിന്റെ ഭാവം
  choice: ‘ശുശ്രൂഷിച്ചുതുടങ്ങി’ എന്ന ആരംഭാത്മക വായന മുഖ്യപാഠത്തിൽ നൽകി
  alternative: ‘ശുശ്രൂഷിച്ചുകൊണ്ടിരുന്നു’ അല്ലെങ്കിൽ ‘ശുശ്രൂഷിച്ചു’
  rationale: ഗ്രീക്ക് അപൂർണഭൂതകാലം പ്രവൃത്തിയുടെ തുടക്കത്തെയോ തുടർച്ചയെയോ സൂചിപ്പിക്കാം. ആഖ്യാനക്രമത്തിൽ ആരംഭാത്മക വായന സ്വാഭാവികമാണ്; എങ്കിലും യഥാർഥ വ്യാകരണദ്വയാർഥത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ശുശ്രൂഷിച്ചു’ എന്നത് ഗൃഹസന്ദർഭത്തിലെ സേവനത്തെ സൂചിപ്പിക്കുന്നു; ‘പരിചരിച്ചു’ എന്നു പറഞ്ഞാൽ അവൾ യേശുവിനെ രോഗിയായി പരിചരിച്ചു എന്ന തെറ്റിദ്ധാരണയ്ക്കു സാധ്യതയുള്ളതിനാൽ അത് ഒഴിവാക്കി.
