id: MAT.8.7
reference: Matthew 8:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀καὶ λέγει ⸀αὐτῷ· Ἐγὼ ἐλθὼν θεραπεύσω αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/007.yaml
  text: And he says to him[a], “I will come and heal him.”
translation:
  language: ml
  text: 'അവൻ അവനോടു പറയുന്നു[a]: “ഞാൻ വന്ന് അവനെ സുഖപ്പെടുത്തും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “ഞാൻ വന്ന് അവനെ സുഖപ്പെടുത്തണമോ?” സന്ദർഭത്തെ അടിസ്ഥാനമാക്കി ചില വ്യാഖ്യാതാക്കൾ യേശുവിന്റെ വാക്കുകളെ ചോദ്യമായി മനസ്സിലാക്കുന്നു; എന്നാൽ ഗ്രീക്ക് വാക്യരൂപം സ്വാഭാവികമായി ഒരു പ്രസ്താവനയായാണ് വായിക്കപ്പെടുന്നത്.'
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: അവൻ
  rationale: മലയാളത്തിലെ സ്വാഭാവികമായ ആഖ്യാനപ്രവാഹത്തിനായി ലളിതമായ καὶ പ്രത്യേകം വിവർത്തനം ചെയ്യാതെ, കർത്താവിനെ വ്യക്തമാക്കുന്ന സർവനാമത്തോടെ വാക്യം ആരംഭിച്ചു; പുതിയ കാലക്രമമോ നിഗമനബന്ധമോ ചേർത്തിട്ടില്ല.
- source_word: λέγει
  choice: പറയുന്നു
  rationale: ഗ്രീക്കിലെ ആഖ്യാനപരമായ വർത്തമാനകാലത്തെ നിലനിർത്തി ദൃശ്യതയും സജീവതയും സംരക്ഷിക്കുന്നു.
- source_word: αὐτῷ
  choice: അവനോടു
  rationale: λέγει എന്ന ക്രിയയോടൊപ്പമുള്ള ദത്തിവിഭക്തിയുടെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: Ἐγὼ
  choice: ഞാൻ
  rationale: പ്രകടമായ കർത്തൃസർവനാമം നിലനിർത്തുന്നു; അനാവശ്യമായി ‘ഞാൻതന്നെ’ എന്ന അതിശക്തമായ ഊന്നൽ ചേർക്കുന്നില്ല.
- source_word: ἐλθὼν
  choice: വന്ന്
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള പ്രവൃത്തിയും അനുബന്ധ സാഹചര്യവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: θεραπεύσω
  choice: സുഖപ്പെടുത്തും
  rationale: രോഗശാന്തിയുടെ സന്ദർഭത്തിൽ θεραπεύω എന്നതിന്റെ വ്യക്തവും സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവുമായ അർഥം.
- source_word: αὐτόν
  choice: അവനെ
  rationale: രോഗിയായ ദാസനെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള കർമത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
theological_decisions:
- issue: ഈ വാക്കുകൾ പ്രസ്താവനയായോ ചോദ്യമായോ വിവർത്തനം ചെയ്യണമോ
  choice: 'പ്രസ്താവന: “ഞാൻ വന്ന് അവനെ സുഖപ്പെടുത്തും.”'
  alternative: 'ചോദ്യം: “ഞാൻ വന്ന് അവനെ സുഖപ്പെടുത്തണമോ?”'
  rationale: ഗ്രീക്കിൽ ചോദ്യം സൂചിപ്പിക്കുന്ന പദമില്ല; വ്യാകരണപരമായി ഇത് സ്വാഭാവികമായി പ്രസ്താവനയായി വായിക്കപ്പെടുന്നു. സന്ദർഭത്തെ ആശ്രയിച്ച് ചിലർ ചോദ്യമായി ഗ്രഹിക്കുന്നതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ ആഖ്യാന വർത്തമാനകാലം ‘പറയുന്നു’ എന്ന രൂപത്തിൽ നിലനിർത്തി. പ്രസ്താവനയും സന്ദർഭാധിഷ്ഠിതമായ ചോദ്യവായനയും തമ്മിലുള്ള യഥാർഥ വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
