id: MAT.8.25
reference: Matthew 8:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸀προσελθόντες ἤγειραν αὐτὸν λέγοντες· Κύριε, ⸀σῶσον, ἀπολλύμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/025.yaml
  text: And they came and woke him[a], saying, “Lord, save us! We are perishing!”
translation:
  language: ml
  text: 'അവർ അടുത്തുചെന്ന് അവനെ ഉണർത്തി പറഞ്ഞു: “കർത്താവേ, ഞങ്ങളെ രക്ഷിക്കണമേ[a]! ഞങ്ങൾ നശിച്ചുപോകുകയാണ്!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞങ്ങളെ വിടുവിക്കണമേ.” σῶσον എന്ന ഗ്രീക്ക് ആജ്ഞാരൂപത്തിന് അപകടത്തിൽനിന്നുള്ള അടിയന്തര വിടുതലിനെയും ‘രക്ഷിക്കുക’ എന്ന വിശാലമായ അർഥത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: അടുത്തുചെന്ന്
  rationale: യേശുവിന്റെ അടുത്തേക്കുള്ള നീക്കവും തുടർന്ന് അവനെ ഉണർത്തിയ സംഭവക്രമവും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἤγειραν
  choice: ഉണർത്തി
  rationale: ἐγείρω ഇവിടെ ഉറക്കത്തിൽനിന്ന് ഉണർത്തുക എന്ന മൂർത്തമായ അർഥത്തിലാണ്; ഉയിർപ്പിക്കുക എന്ന ദൈവശാസ്ത്രപരമായ അർഥം ഉദ്ദേശിക്കുന്നില്ല.
- source_word: λέγοντες
  choice: എന്നു പറഞ്ഞു
  rationale: ശിഷ്യന്മാരുടെ വാക്കുകൾ നേരിട്ട് അവതരിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള പ്രയോഗം; മൂലത്തിൽ വ്യക്തമല്ലാത്ത ‘നിലവിളിച്ചു’ എന്ന വികാരവർണം ചേർക്കുന്നില്ല.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: κύριος എന്ന അഭിസംബോധനയുടെ ബഹുമാനവും സാധ്യതയുള്ള ക്രിസ്തുശാസ്ത്രപരമായ ഭാരവും നിലനിർത്തുന്നു; അതിനെ വെറും ‘ഗുരുവേ’ എന്ന പ്രവർത്തനപരമായ അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: σῶσον
  choice: ഞങ്ങളെ രക്ഷിക്കണമേ
  rationale: അപകടത്തിൽനിന്നുള്ള അടിയന്തര രക്ഷയ്ക്കായുള്ള അഭ്യർഥനയാണ്. കർമം ഗ്രീക്കിൽ പ്രത്യക്ഷമായി ഇല്ലെങ്കിലും പിന്നാലെയുള്ള ‘ഞങ്ങൾ നശിച്ചുപോകുന്നു’ എന്ന വാക്കും സന്ദർഭവും അതിനെ വ്യക്തമാക്കുന്നതിനാൽ മലയാളത്തിൽ ‘ഞങ്ങളെ’ ചേർക്കുന്നത് സ്വാഭാവികമാണ്.
- source_word: ἀπολλύμεθα
  choice: ഞങ്ങൾ നശിച്ചുപോകുന്നു
  rationale: സംഭവിച്ചുകൊണ്ടിരിക്കുന്ന ആസന്നമായ നാശമോ മരണമോ സൂചിപ്പിക്കുന്ന വർത്തമാനരൂപത്തിന്റെ അടിയന്തരത നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശുവിനെ അഭിസംബോധന ചെയ്യുന്ന κύριος എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: കർത്താവേ
  alternative: ഗുരുവേ / യജമാനനേ
  rationale: ഈ അഭിസംബോധനയ്ക്ക് ആദരസൂചകമായ അർഥം മുതൽ കൂടുതൽ ആഴമുള്ള ക്രിസ്തുശാസ്ത്രപരമായ ഭാരംവരെ ഉണ്ടായേക്കാം. ‘കർത്താവേ’ ഈ സാധ്യത തുറന്നുവെക്കുന്നു.
- issue: σῶσον എന്ന ക്രിയയുടെ പരോക്ഷ കർമം വ്യക്തമാക്കണമോ
  choice: ഞങ്ങളെ രക്ഷിക്കണമേ
  alternative: രക്ഷിക്കണമേ
  rationale: ഗ്രീക്കിൽ കർമം പ്രത്യേകം രേഖപ്പെടുത്തിയിട്ടില്ലെങ്കിലും ഒന്നാംപുരുഷ ബഹുവചനത്തിലുള്ള തുടർവാക്യവും സാഹചര്യവും ‘ഞങ്ങളെ’ എന്ന അർഥം സംശയരഹിതമാക്കുന്നു. മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി അത് വ്യക്തമാക്കിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ശിഷ്യന്മാരുടെ ഭീതിയും അഭ്യർഥനയുടെ അടിയന്തരതയും ആശ്ചര്യചിഹ്നങ്ങളിലൂടെ നിലനിർത്തി; മൂലത്തിൽ ഇല്ലാത്ത വികാരവിവരണം ചേർത്തിട്ടില്ല.
