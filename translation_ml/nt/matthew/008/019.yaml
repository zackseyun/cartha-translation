id: MAT.8.19
reference: Matthew 8:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ προσελθὼν εἷς γραμματεὺς εἶπεν αὐτῷ· Διδάσκαλε, ἀκολουθήσω σοι ὅπου ἐὰν ἀπέρχῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/019.yaml
  text: And one scribe came up and said to him[a], “Teacher, I will follow you wherever you go.”
translation:
  language: ml
  text: 'ഒരു ശാസ്ത്രി അടുത്തുവന്ന് അവനോട് പറഞ്ഞു: “ഗുരോ, അങ്ങ് എവിടേക്കു പോയാലും[a] ഞാൻ അങ്ങയെ അനുഗമിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അങ്ങ് എവിടേക്കു പുറപ്പെട്ടുപോയാലും.” ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘പോകുക’ എന്ന പൊതുവായ അർഥത്തോടൊപ്പം ‘വിട്ടുപോകുക, പുറപ്പെടുക’ എന്ന കൂടുതൽ പ്രത്യേക അർഥവും വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: അടുത്തുവന്ന്
  rationale: യേശുവിന്റെ അടുക്കലേക്കുള്ള നീക്കവും അതിനു പിന്നാലെയുള്ള സംസാരവും സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: εἷς γραμματεὺς
  choice: ഒരു ശാസ്ത്രി
  rationale: εἷς എന്നതിന്റെ വ്യക്തിനിർദ്ദേശം നിലനിർത്തുന്നു; സുവിശേഷവിവരണത്തിലെ γραμματεύς എന്ന പദത്തിന് മലയാള ബൈബിൾഭാഷയിൽ പരിചിതമായ ‘ശാസ്ത്രി’ ഉപയോഗിക്കുന്നു.
- source_word: Διδάσκαλε
  choice: ഗുരോ
  rationale: നേരിട്ടുള്ള ആദരസംബോധന സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു; ‘റബ്ബി’ എന്നതുപോലുള്ള മൂലത്തിൽ ഇല്ലാത്ത പ്രത്യേക പദവി ചേർക്കുന്നില്ല.
- source_word: ἀκολουθήσω
  choice: ഞാൻ അങ്ങയെ അനുഗമിക്കും
  rationale: ഭാവികാലത്തിലുള്ള ഉറച്ച പ്രഖ്യാപനം നിലനിർത്തുകയും ശാരീരികമായി പിന്നാലെ പോകുന്നതും ശിഷ്യത്വപരമായ അനുഗമനവും ഉൾക്കൊള്ളുന്ന അർഥവ്യാപ്തി സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ὅπου ἐὰν
  choice: എവിടേക്കു ... പോയാലും
  rationale: ലക്ഷ്യസ്ഥാനം തുറന്നുവയ്ക്കുന്ന അനിശ്ചിതബന്ധാർഥം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀπέρχῃ
  choice: പോയാലും
  rationale: സന്ദർഭത്തിൽ സ്വാഭാവികമായ പൊതുവായ സഞ്ചാരാർഥം നൽകുന്നു; ‘വിട്ടുപോകുക/പുറപ്പെടുക’ എന്ന കൂടുതൽ പ്രത്യേക സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: യേശുവിനോടുള്ള διδάσκαλος എന്ന അഭിസംബോധന
  choice: ഗുരോ
  alternative: അധ്യാപകനേ; യജമാനനേ; റബ്ബീ
  rationale: പഠിപ്പിക്കുന്നവൻ എന്ന അടിസ്ഥാനാർഥവും ആദരസംബോധനയും നിലനിർത്തുന്നു; ഈ വാക്യത്തിൽ വ്യക്തമല്ലാത്ത അധിക ക്രിസ്തുശാസ്ത്രപരമോ പദവിസംബന്ധമോ ആയ ഭാരം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ മലയാളം. യേശുവിനെ അഭിസംബോധന ചെയ്യുമ്പോൾ ‘അങ്ങ്/അങ്ങയെ’ എന്ന ആദരരൂപം ഉപയോഗിച്ചു; വിവരണഭാഗത്തിലെ αὐτῷ ‘അവനോട്’ എന്നു നേരിട്ട് നിലനിർത്തി.
