reference: Matthew 8:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὀψίας δὲ γενομένης προσήνεγκαν αὐτῷ δαιμονιζομένους πολλούς· καὶ ἐξέβαλεν τὰ πνεύματα λόγῳ, καὶ πάντας τοὺς κακῶς ἔχοντας ἐθεράπευσεν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/016.yaml
  text: When evening came[a], they brought to him many who were demon-possessed; and he cast out the spirits with a word, and healed all who were sick.
translation:
  language: ml
  text: സന്ധ്യയായപ്പോൾ അവർ ഭൂതബാധിതരായ[a] അനേകരെ അവന്റെ അടുക്കൽ കൊണ്ടുവന്നു. അവൻ ഒരു വാക്കുകൊണ്ട് ഭൂതങ്ങളെ പുറത്താക്കുകയും രോഗികളായ എല്ലാവരെയും സുഖപ്പെടുത്തുകയും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഭൂതങ്ങളുടെ സ്വാധീനത്തിലായിരുന്നവർ.’ ഗ്രീക്ക് പദം ഭൂതങ്ങളുടെ ദോഷകരമായ സ്വാധീനത്തിന് വിധേയരായ ആളുകളെ സൂചിപ്പിക്കുന്നു; ‘ഭൂതബാധിതർ’ അതിന്റെ ചുരുക്കവും പതിവുമായ പരിഭാഷയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: സന്ധ്യയായപ്പോൾ
  rationale: സമയം സൂചിപ്പിക്കുന്ന genitive absolute സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ‘സന്ധ്യയായപ്പോൾ’ എന്നത് മൂലത്തിലെ കാലബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: προσήνεγκαν αὐτῷ
  choice: അവർ അവന്റെ അടുക്കൽ കൊണ്ടുവന്നു
  rationale: προσφέρω ഇവിടെ ആളുകളെ യേശുവിന്റെ അടുക്കൽ കൊണ്ടുവരുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികവും മൂലത്തോട് അടുത്തതുമായ പ്രയോഗമാണിത്.
- source_word: δαιμονιζομένους πολλούς
  choice: ഭൂതബാധിതരായ അനേകരെ
  rationale: ഗ്രീക്ക് participle ഭൂതങ്ങളുടെ ദോഷകരമായ സ്വാധീനത്തിന് വിധേയരായ ആളുകളെ സൂചിപ്പിക്കുന്നു. ‘ഭൂതബാധിതർ’ മലയാളത്തിൽ ചുരുക്കവും പരിചിതവുമായ പ്രയോഗമാണ്; ‘പൂർണമായി കൈവശപ്പെട്ടവർ’ എന്നതുപോലുള്ള അധിക വ്യാഖ്യാനം ഇതിൽ ചേർക്കുന്നില്ല.
- source_word: ἐξέβαλεν τὰ πνεύματα
  choice: ആത്മാക്കളെ പുറത്താക്കി
  rationale: ἐκβάλλω എന്ന ക്രിയയുടെ പുറത്താക്കുക എന്ന അർഥവും τὰ πνεύματα എന്നതിലെ ‘ആത്മാക്കൾ’ എന്ന നേരിട്ടുള്ള പദപ്രയോഗവും നിലനിർത്തുന്നു. സന്ദർഭം അവ ദുഷ്ടാത്മാക്കളാണെന്ന് വ്യക്തമാക്കുന്നതിനാൽ ‘ദുഷ്ട’ എന്ന വിശേഷണം മൂലത്തിൽ ഇല്ലാത്തിടത്ത് ചേർത്തിട്ടില്ല.
- source_word: λόγῳ
  choice: ഒരു വാക്കുകൊണ്ട്
  rationale: instrumental dative ആയ λόγῳ യേശു ഒരു വാക്കിലൂടെ ആത്മാക്കളെ പുറത്താക്കിയെന്ന് സൂചിപ്പിക്കുന്നു. മൂലത്തിൽ വ്യക്തമല്ലാത്ത ‘തന്റെ’ എന്ന പദം ചേർക്കാതെ അധികാരത്തിന്റെ ലാളിത്യവും ശക്തിയും നിലനിർത്തുന്നു.
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: രോഗികളായ എല്ലാവരെയും
  rationale: κακῶς ἔχειν എന്ന ഗ്രീക്ക് ശൈലി ഇവിടെ രോഗാവസ്ഥയെ സൂചിപ്പിക്കുന്നു. ‘രോഗികളായ എല്ലാവരെയും’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: ἐθεράπευσεν
  choice: സുഖപ്പെടുത്തി
  rationale: സുവിശേഷങ്ങളിലെ θεραπεύω എന്ന രോഗശാന്തിക്രിയയെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: δαιμονιζομένους, τὰ πνεύματα എന്നിവ സൂചിപ്പിക്കുന്ന അവസ്ഥയുടെ സ്വഭാവം
  choice: ‘ഭൂതബാധിതർ’ എന്നും ‘ആത്മാക്കൾ’ എന്നും പരിഭാഷപ്പെടുത്തി വാക്യത്തിലെ ഭൂതബാധയും പുറത്താക്കലും യാഥാർഥ്യമായി നിലനിർത്തുന്നു.
  alternative: മാനസികരോഗികളായ അനേകർ; ഭൂതങ്ങളുടെ സ്വാധീനത്തിലായിരുന്ന അനേകർ
  rationale: വാക്യം ആത്മാക്കളെ പുറത്താക്കുന്നതും രോഗികളെ സുഖപ്പെടുത്തുന്നതും വേർതിരിച്ചു പറയുന്നു. അതിനാൽ ഇവയെ ഒരേ മാനസികമോ ശാരീരികമോ ആയ വിഭാഗമായി വ്യാഖ്യാനിക്കാതെ മൂലപാഠത്തിന്റെ വിഭാഗീകരണവും ആശയസംഘർഷവും നിലനിർത്തുന്നു.
- issue: λόγῳ എന്നതിന്റെ ഉപകരണാർഥം
  choice: ‘ഒരു വാക്കുകൊണ്ട്’
  alternative: തന്റെ വാക്കുകൊണ്ട്; സംസാരിച്ചുകൊണ്ട്
  rationale: യേശുവിന്റെ ആജ്ഞാധികാരം വ്യക്തമാക്കുമ്പോഴും മൂലത്തിൽ ഇല്ലാത്ത ഉടമസ്ഥസർവനാമമോ വിശദീകരണമോ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. ‘അവന്റെ അടുക്കൽ,’ ‘ഒരു വാക്കുകൊണ്ട്,’ ‘സുഖപ്പെടുത്തി’ എന്നീ പ്രയോഗങ്ങൾ സ്വാഭാവികതയും മൂലപാഠസാമീപ്യവും തുലനം ചെയ്യുന്നു. അർദ്ധവിരാമത്തിന് പകരം രണ്ട് വാക്യങ്ങളാക്കി മലയാളത്തിലെ വായനാസൗകര്യം വർധിപ്പിച്ചു.
