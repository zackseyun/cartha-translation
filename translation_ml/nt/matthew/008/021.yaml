id: MAT.8.21
reference: Matthew 8:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἕτερος δὲ τῶν ⸀μαθητῶν εἶπεν αὐτῷ· Κύριε, ἐπίτρεψόν μοι πρῶτον ἀπελθεῖν καὶ θάψαι τὸν πατέρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/021.yaml
  text: Then another of the disciples said to him[a], “Lord[b], permit me first to go away and bury my father.”
translation:
  language: ml
  text: 'അപ്പോൾ ശിഷ്യന്മാരിൽ മറ്റൊരാൾ അവനോട് പറഞ്ഞു: “കർത്താവേ, ആദ്യം പോയി എന്റെ പിതാവിനെ അടക്കാൻ എന്നെ അനുവദിക്കണമേ.[a]”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “എന്നെ അനുവദിക്കൂ” അല്ലെങ്കിൽ “എനിക്ക് അനുവാദം തരണമേ.”
    reason: lexical_alternative
  - marker: b
    text: ഈ അപേക്ഷ ഉടൻ നടത്തേണ്ട സംസ്കാരത്തെ സൂചിപ്പിക്കാം; അല്ലെങ്കിൽ പിതാവ് മരിക്കുന്നതുവരെ പുത്രധർമ്മം നിർവഹിക്കുന്നതിനെ വിശാലമായി സൂചിപ്പിക്കാം. ഗ്രീക്ക് വാക്യം ഇത് വ്യക്തമാക്കുന്നില്ല.
    reason: cultural_note
lexical_decisions:
- source_word: ἕτερος δὲ τῶν μαθητῶν
  choice: അപ്പോൾ ശിഷ്യന്മാരിൽ മറ്റൊരാൾ
  rationale: സംസാരിക്കുന്നയാൾ ശിഷ്യരുടെ കൂട്ടത്തിൽപ്പെട്ട മറ്റൊരു വ്യക്തിയാണെന്നത് സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; δέ ഇവിടെ കഥ മുന്നോട്ടുകൊണ്ടുപോകുന്ന മൃദുവായ ബന്ധകമായി ‘അപ്പോൾ’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: ആദരപൂർവമായ നേരിട്ടുള്ള അഭിസംബോധനയും സാധ്യമായ ദൈവശാസ്ത്രപരമായ ഭാരവും നിലനിർത്തുന്ന പതിവ് മലയാളരൂപം.
- source_word: ἐπίτρεψόν μοι
  choice: എന്നെ അനുവദിക്കണമേ
  rationale: അനുമതി ചോദിക്കുന്ന ആദരപൂർവമായ അപേക്ഷയെ ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ പകർത്തുന്നു.
- source_word: πρῶτον ἀπελθεῖν
  choice: ആദ്യം പോയി
  rationale: πρῶτον സൂചിപ്പിക്കുന്ന മുൻഗണന നിലനിർത്തുന്നു; ἀπέρχομαιയിലെ അകന്നുപോകൽ സന്ദർഭത്തിൽ മലയാളത്തിലെ ‘പോയി’ എന്ന സ്വാഭാവിക പ്രയോഗത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: θάψαι τὸν πατέρα μου
  choice: എന്റെ പിതാവിനെ അടക്കാൻ
  rationale: ശവസംസ്കാരത്തെ സൂചിപ്പിക്കുന്ന θάπτωയ്ക്ക് വ്യക്തവും മാന്യവുമായ മലയാളപ്രയോഗം; ബന്ധവും കർമവും നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: പിതാവിനെ അടക്കാനുള്ള അപേക്ഷയുടെ സമയസൂചന
  choice: പിതാവിനെ അടക്കാൻ പോകുന്നതിനുള്ള നേരിട്ടുള്ള അപേക്ഷയായി പരിഭാഷപ്പെടുത്തി; പിതാവ് ഇതിനകം മരിച്ചോ ഇല്ലയോ എന്ന് മുഖ്യവാക്യത്തിൽ തീരുമാനിച്ചിട്ടില്ല.
  alternative: ഇത് ഉടൻ നടത്തേണ്ട സംസ്കാരത്തെ സൂചിപ്പിക്കാം; അല്ലെങ്കിൽ പിതാവ് മരിക്കുന്നതുവരെ പുത്രധർമ്മം നിർവഹിക്കാൻ വീട്ടിൽ തുടരുന്നതിനെ വിശാലമായി സൂചിപ്പിക്കാം.
  rationale: ഗ്രീക്ക് വാക്യം അപേക്ഷയുടെ സമയം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ യഥാർഥമായ അവ്യക്തത നിലനിർത്തുകയും വ്യാഖ്യാനസാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ബൈബിൾ ഗദ്യം. ‘കർത്താവേ’, ‘പിതാവ്’, ‘അടക്കുക’ എന്നീ പദങ്ങൾ ആദരപൂർവമായ ഭാവം നിലനിർത്തുന്നു; വാക്യം അനാവശ്യമായി വ്യാഖ്യാനിച്ചിട്ടില്ല.
