source:
  edition: SBLGNT
  text: καὶ ἰδοὺ σεισμὸς μέγας ἐγένετο ἐν τῇ θαλάσσῃ, ὥστε τὸ πλοῖον καλύπτεσθαι ὑπὸ τῶν κυμάτων, αὐτὸς δὲ ἐκάθευδεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/024.yaml
  text: And behold[a], a great storm arose on the sea, so that the boat was being swamped by the waves[b]; but he was sleeping.
translation:
  language: ml
  text: ഇതാ[a], കടലിൽ വലിയൊരു കൊടുങ്കാറ്റ്[b] ഉണ്ടായി, അങ്ങനെ പടക് തിരമാലകളാൽ മൂടപ്പെട്ടുകൊണ്ടിരുന്നു. എന്നാൽ അവൻ ഉറങ്ങുകയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഇതാ’ ശ്രദ്ധ ക്ഷണിക്കുകയും സംഭവത്തിന്റെ പെട്ടെന്നുള്ള തീവ്രത പ്രകടമാക്കുകയും ചെയ്യുന്ന ഒരു വ്യവഹാരചിഹ്നമാണ്.
    reason: discourse_marker
  - marker: b
    text: ഗ്രീക്കിലെ σεισμός എന്ന പദത്തിന് സാധാരണയായി ‘കുലുക്കം’ അല്ലെങ്കിൽ ‘ഭൂകമ്പം’ എന്നും അർഥമുണ്ട്; ഇവിടെ കടൽസന്ദർഭത്തിൽ അത് അതിശക്തമായ കൊടുങ്കാറ്റിനെയോ കടൽക്ഷോഭത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും സംഭവത്തിന്റെ പൊടുന്നനെയുള്ള തീവ്രത പ്രകടമാക്കുകയും ചെയ്യുന്ന വ്യവഹാരചിഹ്നത്തിന്റെ ശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: σεισμὸς μέγας
  choice: വലിയൊരു കൊടുങ്കാറ്റ്
  rationale: σεισμός സാധാരണയായി ‘ഭൂകമ്പം’ അഥവാ ‘കുലുക്കം’ എന്നർഥം വരാമെങ്കിലും, കടൽ, പടക്, തിരമാലകൾ എന്നീ സന്ദർഭഘടകങ്ങൾ ഇവിടെ കടലിലെ അതിശക്തമായ ക്ഷോഭത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἐγένετο ἐν τῇ θαλάσσῃ
  choice: കടലിൽ ... ഉണ്ടായി
  rationale: സംഭവത്തിന്റെ ആരംഭവും അതിന്റെ സ്ഥലവും ലളിതവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു; θάλασσα എന്ന ഉറവിടപദത്തിന് ‘കടൽ’ നിലനിർത്തുന്നു.
- source_word: ὥστε τὸ πλοῖον καλύπτεσθαι ὑπὸ τῶν κυμάτων
  choice: തിരമാലകൾ പടകിനെ മൂടിക്കൊണ്ടിരുന്നു
  rationale: ഫലബന്ധം മലയാളത്തിലെ തുടർച്ചയായ സംഭവവിവരണത്തിലൂടെ വ്യക്തമാക്കുന്നു; വർത്തമാനകാല നിഷ്ക്രിയ infinitive സൂചിപ്പിക്കുന്ന പുരോഗമനപ്രവർത്തനം ‘മൂടിക്കൊണ്ടിരുന്നു’ എന്നതിൽ സംരക്ഷിക്കുന്നു.
- source_word: αὐτὸς δὲ ἐκάθευδεν
  choice: എന്നാൽ അവൻ ഉറങ്ങുകയായിരുന്നു
  rationale: ചുറ്റുമുള്ള പ്രക്ഷുബ്ധതയോടുള്ള വൈരുധ്യവും imperfect രൂപത്തിലെ തുടരുന്ന അവസ്ഥയും വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: σεισμός വിവരിക്കുന്ന സംഭവത്തിന്റെ സ്വഭാവം
  choice: സമുദ്രസന്ദർഭത്തിന് യോജിച്ച് ‘കൊടുങ്കാറ്റ്’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ഭൂകമ്പം’, ‘വലിയ കുലുക്കം’
  rationale: ഇത് സിദ്ധാന്തപരമായ തീരുമാനമല്ല, സന്ദർഭാധിഷ്ഠിതമായ പദാർഥനിർണയമാണ്. കടൽ, പടക്, തിരമാലകൾ എന്നിവ അതിശക്തമായ കടൽക്ഷോഭത്തെയാണ് സൂചിപ്പിക്കുന്നത്; എന്നാൽ പദത്തിന്റെ കൂടുതൽ അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. ‘ഇതാ’ എന്ന അല്പം പരമ്പരാഗതമായെങ്കിലും സുലഭമായ രൂപം മൂലപാഠത്തിന്റെ ശ്രദ്ധാകർഷകശക്തിക്കായി നിലനിർത്തി. ‘മൂടിക്കൊണ്ടിരുന്നു’ എന്നത് ഉറവിടത്തിലെ പുരോഗമനഭാവം കാത്തുസൂക്ഷിക്കുന്നു.
