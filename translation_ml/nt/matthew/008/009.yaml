id: MAT.8.9
reference: Matthew 8:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ γὰρ ἐγὼ ἄνθρωπός εἰμι ὑπὸ ⸀ἐξουσίαν, ἔχων ὑπ’ ἐμαυτὸν στρατιώτας, καὶ λέγω τούτῳ· Πορεύθητι, καὶ πορεύεται, καὶ ἄλλῳ· Ἔρχου, καὶ ἔρχεται, καὶ τῷ δούλῳ μου· Ποίησον τοῦτο, καὶ ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/009.yaml
  text: For I also am a man under authority[a], having soldiers under me. And I say to this one, ‘Go,’ and he goes; and to another, ‘Come,’ and he comes; and to my servant, ‘Do this,’ and he does it.
translation:
  language: ml
  text: എന്തെന്നാൽ, ഞാനും അധികാരത്തിൻ കീഴിലുള്ള ഒരു മനുഷ്യനാണ്; എന്റെ കീഴിലും സൈനികരുണ്ട്. ഞാൻ ഒരുവനോട്, ‘പോകുക,’ എന്നു പറയുന്നു; അവൻ പോകുന്നു. മറ്റൊരുവനോട്, ‘വരുക,’ എന്നു പറയുന്നു; അവൻ വരുന്നു. എന്റെ ദാസനോട്[a], ‘ഇതു ചെയ്യുക,’ എന്നു പറയുന്നു; അവൻ ചെയ്യുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “അടിമ” (ഗ്രീക്ക്: δοῦλος).'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: കാരണം
  rationale: ശതാധിപന്റെ വാക്കുകൾക്കുള്ള വിശദീകരണവും അടിസ്ഥാനവും ഈ സംയോജനം അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘കാരണം’ ആ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἐγὼ ἄνθρωπός εἰμι ὑπὸ ἐξουσίαν
  choice: ഞാനും അധികാരത്തിനു കീഴിലുള്ള ഒരു മനുഷ്യനാണ്
  rationale: ἐγώ എന്നതിലെ ഊന്നലും καί നൽകുന്ന ‘ഞാനും’ എന്ന സാമ്യബോധവും, പ്രതിനിധീകരിക്കപ്പെട്ട അധികാരക്രമവും നിലനിർത്തുന്നു.
- source_word: ἔχων ὑπ’ ἐμαυτὸν στρατιώτας
  choice: എന്റെ കീഴിലും പടയാളികളുണ്ട്
  rationale: ശതാധിപൻ അധികാരത്തിനു കീഴിലായിരിക്കുമ്പോഴും തന്റെ കീഴിൽ സൈനികർ ഉള്ളതെന്ന സമാന്തര ഘടന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: λέγω τούτῳ· Πορεύθητι
  choice: ഞാൻ ഒരുവനോട്, ‘പോകുക’ എന്നു പറയുന്നു
  rationale: τούτῳ എന്നത് ഒരു പ്രത്യേക കീഴാളനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും മലയാളത്തിലെ ‘ഒരുവനോട്’ തുടർന്നുള്ള ‘മറ്റൊരുവനോട്’ എന്ന വിതരണഘടനയുമായി സ്വാഭാവികമായി ചേരുന്നു.
- source_word: καὶ ἄλλῳ· Ἔρχου
  choice: മറ്റൊരുവനോട്, ‘വരുക’ എന്നു പറയുന്നു
  rationale: ആജ്ഞയും ഉടനെയുള്ള അനുസരണവും അടങ്ങിയ ലളിതമായ സമാന്തരഘടന സംരക്ഷിക്കുന്നു.
- source_word: τῷ δούλῳ μου
  choice: എന്റെ ദാസനോട്
  rationale: δοῦλος സാമൂഹിക അധീനതയിലുള്ള ദാസനെയോ അടിമയെയോ സൂചിപ്പിക്കാം. പ്രധാനപാഠത്തിൽ dignified ആയ പരമ്പരാഗത മലയാളപദമായ ‘ദാസൻ’ ഉപയോഗിച്ച്, കൂടുതൽ കഠിനമായ സാമൂഹിക അർഥമായ ‘അടിമ’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: Ποίησον τοῦτο, καὶ ποιεῖ
  choice: ‘ഇതു ചെയ്യുക’ എന്നു പറയുന്നു; അവൻ ചെയ്യുന്നു
  rationale: കല്പനയും അതിനോടുള്ള നേരിട്ടുള്ള അനുസരണവും ഗ്രീക്കിലെ ആവർത്തനക്രമത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: δοῦλος എന്ന പദത്തിന്റെ സാമൂഹിക അർഥവ്യാപ്തി
  choice: ദാസൻ
  alternative: അടിമ
  rationale: വാക്യത്തിന്റെ മുഖ്യശ്രദ്ധ ശതാധിപന്റെ അധികാരക്രമത്തിലാണ്; എങ്കിലും δοῦλος ബന്ധിത അടിമസ്ഥിതിയെയും സൂചിപ്പിക്കാവുന്നതിനാൽ ആ അർഥം അടിക്കുറിപ്പിലൂടെ തുറന്നുവെക്കുന്നു.
- issue: ശതാധിപന്റെ അധികാരസാമ്യത്തിന്റെ വ്യാഖ്യാനം
  choice: ‘അധികാരത്തിനു കീഴിലുള്ള’ എന്ന മൂലവാചകം നേരിട്ട് നിലനിർത്തി
  alternative: യേശുവിന്റെ അധികാരത്തെ വിശദീകരിക്കുന്ന വ്യാഖ്യാനപരമായ വികസനം ചേർക്കുക
  rationale: വാക്യം ശതാധിപന്റെ പ്രതിനിധീകരിക്കപ്പെട്ട അധികാരത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും അതിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ നിഗമനം ഇവിടെ തുറന്ന് വിശദീകരിക്കുന്നില്ല; അതിനാൽ വിവർത്തനം ആ ദൈവശാസ്ത്രപരമായ സമ്മർദം സ്വയം പരിഹരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. സൈനിക അധികാരക്രമം വ്യക്തമാക്കാൻ ‘അധികാരത്തിനു കീഴിൽ’, ‘എന്റെ കീഴിൽ’, ‘പടയാളികൾ’ എന്നീ സ്വാഭാവിക പ്രയോഗങ്ങൾ ഉപയോഗിച്ചു. ആവർത്തിക്കുന്ന കല്പന–അനുസരണ ഘടന വായനാസൗകര്യത്തിനായി സ്വതന്ത്ര വാക്യങ്ങളാക്കി, എന്നാൽ മൂലത്തിലെ സമാന്തരത നിലനിർത്തി.
