  - severity: low
    issue: The main text and footnote b can express the intensity and experiential force of δεινῶς βασανιζόμενος more naturally.
    rationale: ‘വളരെ കഠിനമായി വേദന അനുഭവിക്കുന്നു’ clearly conveys severe suffering, while the footnote should retain the alternative sense of severe torment rather than an agent-implying passive ‘പീഡിപ്പിക്കപ്പെടുന്നു.’
