  to: 'പറഞ്ഞു: “കർത്താവേ, എന്റെ ദാസൻ[a] പക്ഷാഘാതം ബാധിച്ച് വീട്ടിൽ കിടക്കുന്നു; അവൻ വളരെ കഠിനമായി വേദന അനുഭവിക്കുന്നു[b].”'
