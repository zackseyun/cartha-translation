id: MAT.8.6
reference: Matthew 8:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ λέγων· Κύριε, ὁ παῖς μου βέβληται ἐν τῇ οἰκίᾳ παραλυτικός, δεινῶς βασανιζόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/006.yaml
  text: and saying[a], “Lord, my servant is lying paralyzed at home[b], suffering terribly.”
translation:
  language: ml
  text: 'പറഞ്ഞു: “കർത്താവേ, എന്റെ ദാസൻ[a] പക്ഷാഘാതം ബാധിച്ച് വീട്ടിൽ കിടക്കുന്നു; അവൻ വളരെ കഠിനമായി വേദന അനുഭവിക്കുന്നു[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘എന്റെ ബാലൻ’ അല്ലെങ്കിൽ ‘എന്റെ കുട്ടി’; ഗ്രീക്ക് പദത്തിന് ദാസനെയോ കുട്ടിയെയോ സൂചിപ്പിക്കാം. ശതാധിപന്റെ പശ്ചാത്തലത്തിൽ ‘ദാസൻ’ എന്ന അർത്ഥമാണ് കൂടുതൽ യോജിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘കഠിനമായി പീഡനം അനുഭവിക്കുന്നു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ λέγων
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാല കൃദന്തരൂപം മുൻവാക്യത്തിലെ ക്രിയയോടു ബന്ധപ്പെട്ടു നിൽക്കുന്നു. മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനശൈലിയിൽ ‘പറഞ്ഞു’ എന്ന് നൽകുന്നത് ആ ബന്ധം സന്ദർഭത്തിൽ നിലനിർത്തുന്നു.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: ആദരപൂർവമായ അഭിസംബോധനയോ കൂടുതൽ ഉന്നതമായ അംഗീകാരമോ ആകാവുന്ന അർത്ഥവ്യാപ്തി ‘കർത്താവേ’ നിലനിർത്തുന്നു.
- source_word: ὁ παῖς μου
  choice: എന്റെ ദാസൻ
  rationale: παῖς എന്നതിന് ദാസൻ, ബാലൻ, കുട്ടി എന്നീ അർത്ഥങ്ങൾ വരാം. ശതാധിപന്റെ പശ്ചാത്തലത്തിൽ ‘ദാസൻ’ ഏറ്റവും യോജിച്ചെങ്കിലും മൂലപദത്തിന്റെ അവ്യക്തത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചിരിക്കുന്നു.
- source_word: βέβληται
  choice: കിടക്കുന്നു
  rationale: βάλλω എന്ന ക്രിയയുടെ പൂർണ്ണകാല കർമണിരൂപം ഇവിടെ രോഗം മൂലമുള്ള നിലവിലെ കിടപ്പാവസ്ഥയെ സൂചിപ്പിക്കുന്നു; ‘കിടക്കുന്നു’ അത് സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἐν τῇ οἰκίᾳ
  choice: വീട്ടിൽ
  rationale: സ്ഥലസൂചനയായ ഈ പദസമുച്ചയത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപമാണിത്.
- source_word: παραλυτικός
  choice: തളർവാതം പിടിപെട്ട്
  rationale: ശരീരചലനശേഷി നഷ്ടപ്പെട്ട അവസ്ഥയെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി അറിയിക്കുന്ന മാന്യവും സമകാലികവുമായ പ്രയോഗം.
- source_word: δεινῶς βασανιζόμενος
  choice: അതികഠിനമായി വേദനിക്കുന്നു
  rationale: കടുത്ത പീഡനമോ വേദനയോ അനുഭവിക്കുന്നതിനെ ഈ പ്രയോഗം സ്വാഭാവികമായി അറിയിക്കുന്നു; ‘പീഡിപ്പിക്കപ്പെടുന്നു’ എന്ന കൂടുതൽ അക്ഷരാർഥപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
theological_decisions:
- issue: യേശുവിനോടുള്ള Κύριε എന്ന അഭിസംബോധനയുടെ ഭാവം
  choice: കർത്താവേ
  alternative: യജമാനനേ / പ്രഭോ
  rationale: ഇത് ആദരസൂചകമായ അഭിസംബോധന മാത്രമാണോ കൂടുതൽ ആഴമുള്ള അംഗീകാരമാണോ എന്ന് വാക്യം നിർണയിക്കുന്നില്ല. ‘കർത്താവേ’ ഈ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായതും തിരുവെഴുത്തുവായനയ്ക്ക് യോജിച്ച ഗൗരവമുള്ളതുമായ ശൈലി. മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിനായി കൃദന്തരൂപം സമാപികാക്രിയയായി മിനുക്കിയിട്ടുണ്ട്; മൂലത്തിലെ പ്രധാന പദാർഥവ്യത്യാസങ്ങൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
