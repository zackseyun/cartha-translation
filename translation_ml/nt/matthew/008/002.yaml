id: MAT.8.2
reference: Matthew 8:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ λεπρὸς ⸀προσελθὼν προσεκύνει αὐτῷ λέγων· Κύριε, ἐὰν θέλῃς δύνασαί με καθαρίσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/002.yaml
  text: And behold[a], a leper came and bowed down before him, saying, “Lord, if you are willing, you are able to cleanse me.”
translation:
  language: ml
  text: 'ഇതാ, കുഷ്ഠരോഗമുള്ള ഒരാൾ അടുത്തുവന്ന് അവന്റെ മുമ്പിൽ കുമ്പിട്ട്[a] പറഞ്ഞു: “കർത്താവേ, നിനക്കു മനസ്സുണ്ടെങ്കിൽ എന്നെ ശുദ്ധനാക്കാൻ നിനക്കു കഴിയും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അവനെ ആരാധിച്ചു” എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്ക് ക്രിയയ്ക്ക് സന്ദർഭമനുസരിച്ച് ആദരപൂർവം കുമ്പിടുക, വണങ്ങുക, ആരാധിക്കുക എന്നീ അർത്ഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: സംഭവത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന വ്യവഹാരകണത്തിന്റെ ശക്തിയും ആഖ്യാനത്തിന്റെ സജീവതയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: λεπρὸς
  choice: കുഷ്ഠരോഗമുള്ള ഒരാൾ
  rationale: ത്വഗ്രോഗബാധിതനായ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന substantival adjective ആണ്. പരമ്പരാഗത രോഗനാമം നിലനിർത്തിക്കൊണ്ട് വ്യക്തിയെ രോഗാവസ്ഥയായി മാത്രം നിർവചിക്കാത്ത ആധുനിക പ്രയോഗമാണിത്.
- source_word: προσελθὼν
  choice: അടുത്തുവന്ന്
  rationale: യേശുവിന്റെ അടുക്കലേക്കുള്ള സമീപനത്തെ സംക്ഷിപ്തമായും സ്വാഭാവികമായും വ്യക്തമാക്കുന്നു.
- source_word: προσεκύνει
  choice: അവന്റെ മുമ്പിൽ കുമ്പിട്ട്
  rationale: ശരീരഭാവത്തിലുള്ള ആദരവും വണക്കവും വ്യക്തമാക്കുന്നു; എന്നാൽ ആരാധിച്ചു എന്ന ദൈവശാസ്ത്രപരമായി കൂടുതൽ നിർണായകമായ അർത്ഥത്തിലേക്ക് മുഖ്യപാഠം മാത്രം ചുരുക്കുന്നില്ല.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: ആദരപൂർവമായ അധികാരസംബോധനയും സാധ്യമായ ക്രിസ്തുശാസ്ത്രപരമായ ഭാരവും ഒരുമിച്ച് നിലനിർത്തുന്ന പതിവ് മലയാള പരിഭാഷയാണ്.
- source_word: ἐὰν θέλῃς
  choice: നിനക്കു മനസ്സുണ്ടെങ്കിൽ
  rationale: യേശുവിന്റെ ഇച്ഛയെ ആശ്രയിച്ചുള്ള വ്യവസ്ഥ സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: δύνασαί
  choice: നിനക്കു കഴിയും
  rationale: കഴിവിനെയും ശക്തിയെയും കുറിച്ചുള്ള ഉറച്ച പ്രസ്താവന നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: καθαρίσαι
  choice: എന്നെ ശുദ്ധനാക്കാൻ
  rationale: സാധാരണ സൗഖ്യപ്പെടുത്തലിനപ്പുറം, ഈ രോഗവുമായി ബന്ധപ്പെട്ട ശാരീരികവും ആചാരപരവുമായ ശുദ്ധീകരണത്തിന്റെ സൂചന സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യേശുവിനോടുള്ള προσκυνέω എന്ന ക്രിയയുടെ അർത്ഥം
  choice: അവന്റെ മുമ്പിൽ കുമ്പിട്ട്
  alternative: അവനെ ആരാധിച്ചു; അവന്റെ മുമ്പിൽ മുട്ടുകുത്തി; അവനെ വണങ്ങി
  rationale: ഈ ക്രിയയ്ക്ക് കുമ്പിടൽ, ആദരാഞ്ജലി അർപ്പിക്കൽ, ആരാധിക്കൽ എന്നീ അർത്ഥവ്യാപ്തികളുണ്ട്. സന്ദർഭത്തിലെ ഭക്ത്യാദരമുള്ള ശരീരഭാവം മുഖ്യപാഠം വ്യക്തമാക്കുന്നു; അത് നിർബന്ധമായി ‘ആരാധന’ എന്നു തീർപ്പാക്കാതെ യഥാർഥ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഇതാ’ എന്ന ശ്രദ്ധാകർഷക പ്രയോഗവും ‘ശുദ്ധനാക്കുക’ എന്ന ശാരീരിക-ആചാരപര പ്രതിധ്വനിയുള്ള പദവും നിലനിർത്തിയിരിക്കുന്നു.
