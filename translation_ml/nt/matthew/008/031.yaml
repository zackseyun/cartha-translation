id: MAT.8.31
reference: Matthew 8:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ δαίμονες παρεκάλουν αὐτὸν λέγοντες· Εἰ ἐκβάλλεις ἡμᾶς, ⸂ἀπόστειλον ἡμᾶς⸃ εἰς τὴν ἀγέλην τῶν χοίρων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/031.yaml
  text: And the demons kept begging him[a], saying, “If you cast us out[b], send us into the herd of pigs.”
translation:
  language: ml
  text: എന്നാൽ ഭൂതങ്ങൾ അവനോട്, “നീ ഞങ്ങളെ പുറത്താക്കുന്നെങ്കിൽ, പന്നിക്കൂട്ടത്തിലേക്ക് ഞങ്ങളെ അയയ്ക്കണമേ.”[a] എന്നു പറഞ്ഞ് തുടർച്ചയായി അപേക്ഷിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ചില കൈയെഴുത്തുപ്രതികളിൽ: “പന്നിക്കൂട്ടത്തിലേക്ക് പോകാൻ ഞങ്ങളെ അനുവദിക്കണമേ.”'
    reason: textual_variant
lexical_decisions:
- source_word: δαίμονες
  choice: ഭൂതങ്ങൾ
  rationale: വ്യക്തിത്വമുള്ള ദുഷ്ടാത്മജീവികളെ സൂചിപ്പിക്കുന്നതായി സന്ദർഭത്തിൽ സ്വാഭാവികവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളപദം.
- source_word: παρεκάλουν
  choice: തുടർച്ചയായി അപേക്ഷിച്ചുകൊണ്ട്
  rationale: അപൂർണ്ണകാല ക്രിയ സൂചിപ്പിക്കുന്ന തുടരുന്ന അഥവാ ആവർത്തിച്ച അപേക്ഷയുടെ ഭാവം നിലനിർത്തുന്നു.
- source_word: λέγοντες
  choice: പറഞ്ഞു
  rationale: നേരിട്ടുള്ള സംഭാഷണം അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് കൃദ്ദന്തരൂപം സ്വാഭാവികമായ മലയാള ആഖ്യാനരീതിയിൽ നൽകുന്നു.
- source_word: Εἰ
  choice: എങ്കിൽ
  rationale: സംസാരിക്കുന്നവരുടെ കാഴ്ചപ്പാടിലുള്ള നിബന്ധനയെ അതിരുകടന്ന് വ്യാഖ്യാനിക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: ἐκβάλλεις
  choice: പുറത്താക്കുന്നെങ്കിൽ
  rationale: ഭൂതോച്ചാടനസന്ദർഭത്തിലെ ബലമായി പുറത്താക്കുക എന്ന അർത്ഥം നേരിട്ട് നൽകുന്നു.
- source_word: ἀπόστειλον
  choice: അയയ്ക്കണമേ
  rationale: ഉടൻ ചെയ്യണമെന്ന അഭ്യർത്ഥനയുള്ള ആജ്ഞാരൂപത്തെ മലയാളത്തിൽ മാന്യമായ അപേക്ഷയായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἀγέλην
  choice: കൂട്ടം
  rationale: മൃഗങ്ങളുടെ സമൂഹത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം; ‘പന്നിക്കൂട്ടം’ എന്ന സംയുക്തത്തിൽ വ്യക്തമാണ്.
- source_word: χοίρων
  choice: പന്നി
  rationale: ആധുനിക മലയാളത്തിൽ വ്യക്തവും സാധാരണവുമായ സമാനപദം.
- source_word: οἱ δὲ
  choice: അപ്പോൾ
  rationale: δέയുടെ ആഖ്യാനതുടർച്ച ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ശക്തമായ വൈരുധ്യം അനാവശ്യമായി ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ദുഷ്ടാത്മജീവികളുടെ നാമകരണം
  choice: ഭൂതങ്ങൾ
  alternative: ദുഷ്ടാത്മാക്കൾ
  rationale: വാക്യം യേശുവിനോട് സംസാരിക്കുന്ന വ്യക്തിത്വമുള്ള അതീന്ദ്രിയ ദുഷ്ടജീവികളെ അവതരിപ്പിക്കുന്നു. ‘ഭൂതങ്ങൾ’ ഈ അവകാശവാദത്തെ ലഘൂകരിക്കാതെയും അധിക സിദ്ധാന്തവിവരണം ചേർക്കാതെയും നൽകുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ ആഖ്യാനഭാഷ. παρεκάλουν എന്ന അപൂർണ്ണകാലത്തിന്റെ തുടരുന്ന ഭാവം വ്യക്തമായി നിലനിർത്തി. SBLGNT-യിലെ ἀπόστειλον ἡμᾶς എന്ന പാഠവുമായി ബന്ധപ്പെട്ട പ്രധാന പാഠഭേദം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
