id: MAT.8.23
reference: Matthew 8:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἐμβάντι αὐτῷ ⸀εἰς πλοῖον ἠκολούθησαν αὐτῷ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/023.yaml
  text: And when he got into the boat[b][a], his disciples followed him.
translation:
  language: ml
  text: അവൻ പടകിൽ[a] കയറിയപ്പോൾ[b], അവന്റെ ശിഷ്യന്മാർ അവനെ അനുഗമിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ‘ഒരു പടക്’ എന്നോ ‘ആ പടക്’ എന്നോ നിർദിഷ്ടമായി പറഞ്ഞിട്ടില്ല.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘പടകിൽ കയറുന്നതിനിടെ’; കൂടുതൽ ഔപചാരികമായി, ‘പടകിൽ കയറിയശേഷം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβάντι
  choice: കയറിയപ്പോൾ
  rationale: ഈ എയോറിസ്റ്റ് കർത്തൃവാചക കൃദന്തത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ കാലസൂചക ഉപവാക്യമായി അവതരിപ്പിക്കുന്നു. പ്രധാന ക്രിയയ്ക്കു മുമ്പുള്ള പടകുകയറ്റത്തെ സൂചിപ്പിക്കുമ്പോഴും കൃത്യമായ സമയബന്ധം അനാവശ്യമായി കടുപ്പിക്കുന്നില്ല.
- source_word: πλοῖον
  choice: പടകിൽ
  rationale: ഗലീലക്കടലിന്റെ പശ്ചാത്തലത്തിൽ πλοῖον എന്നതിന് ആധുനിക മലയാളത്തിൽ ‘പടക്’ സ്വാഭാവികമാണ്. ഗ്രീക്കിൽ ഇവിടെ നിർദിഷ്ടത വ്യക്തമാക്കുന്ന പദമില്ല; മലയാളത്തിലെ രൂപം ‘ഒരു പടക്’ എന്നും ‘ആ പടക്’ എന്നും നിർബന്ധിച്ച് തീരുമാനിക്കാതെ നിൽക്കുന്നു.
- source_word: ἠκολούθησαν
  choice: അനുഗമിച്ചു
  rationale: ഉടനെയുള്ള അർഥമായ യേശുവിന്റെ പിന്നാലെയുള്ള സഞ്ചാരവും മത്തായിയുടെ സുവിശേഷത്തിൽ കാണുന്ന ശിഷ്യത്വത്തിന്റെ സൂചനയും ഒരുപോലെ നിലനിർത്തുന്നു.
- source_word: μαθηταὶ
  choice: ശിഷ്യന്മാർ
  rationale: യേശുവിനോടുള്ള പഠന-അനുഗമനബന്ധത്തെ സൂചിപ്പിക്കുന്ന സുവിശേഷങ്ങളിലെ പതിവുപദത്തിന് യോജിച്ച, പൊതുവായി മനസ്സിലാകുന്ന മലയാളരൂപം.
- source_word: αὐτῷ ... αὐτῷ ... αὐτοῦ
  choice: അവൻ / അവനെ / അവന്റെ
  rationale: സന്ദർഭത്തിൽ മൂന്നു സർവനാമങ്ങളും യേശുവിനെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളവാക്യഘടനയ്ക്കനുസരിച്ച് അവയെ കർത്താവ്, കർമം, ഉടമസ്ഥത എന്നീ രൂപങ്ങളിൽ നൽകി.
theological_decisions:
- issue: ἀκολουθέω എന്ന പദത്തിലെ ശിഷ്യത്വസൂചന
  choice: ‘അനുഗമിച്ചു’ എന്ന് വിപുലീകരണമില്ലാതെ പരിഭാഷപ്പെടുത്തി.
  alternative: ‘അവന്റെ പിന്നാലെ ചെന്നു’ / ‘അവനോടൊപ്പം പോയി’
  rationale: ഇവിടെ നേരിട്ടുള്ള സംഭവം ശാരീരികമായി പിന്നാലെ പോകുന്നതാണ്; എന്നാൽ മത്തായിയിൽ ഈ ക്രിയയ്ക്ക് ശിഷ്യത്വത്തിന്റെ പ്രതിധ്വനിയും ഉണ്ടാകാം. ‘അനുഗമിച്ചു’ ഇരുവശവും നിലനിർത്തുന്നു; ‘അവന്റെ ശിഷ്യരായിത്തീർന്നു’ എന്ന അതിവ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അനുഗമിച്ചു’ എന്ന പദം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും മൂലത്തിലെ പ്രവർത്തന-ശിഷ്യത്വ ദ്വയാർഥസാധ്യത സംരക്ഷിക്കുന്നതുമാണ്.
