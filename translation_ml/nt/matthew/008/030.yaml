  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἦν δὲ μακρὰν ἀπ’ αὐτῶν ἀγέλη χοίρων πολλῶν βοσκομένη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/030.yaml
  text: A large herd of pigs was feeding some distance away from them[a].
translation:
  language: ml
  text: അവരിൽനിന്ന് ദൂരെയായി അനേകം പന്നികളുടെ ഒരു കൂട്ടം തീറ്റതേടിക്കൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν δὲ
  choice: ഉണ്ടായിരുന്നു എന്ന ആശയം ‘മേഞ്ഞുകൊണ്ടിരുന്നു’ എന്ന ക്രിയയിൽ സ്വാഭാവികമായി ഉൾപ്പെടുത്തി
  rationale: ἦν അസ്തിത്വ/സ്ഥിതി സൂചിപ്പിക്കുന്നു; δέ മൃദുവായ ആഖ്യാനബന്ധകമാണ്. മലയാളത്തിൽ പ്രത്യേക ബന്ധകപദം ചേർക്കാതെ വാക്യക്രമംകൊണ്ട് ആഖ്യാനം സ്വാഭാവികമായി മുന്നോട്ടുകൊണ്ടുപോകാം.
- source_word: μακρὰν ἀπ’ αὐτῶν
  choice: അവരിൽനിന്ന് കുറച്ചകലെ
  rationale: ἀπό വേർപാടിന്റെ അടിസ്ഥാനത്തിലുള്ള സ്ഥലദൂരം സൂചിപ്പിക്കുന്നു. μακράν എന്നത് ‘ദൂരെ’ എന്നും സന്ദർഭാനുസൃതമായി ‘കുറച്ചകലെ’ എന്നും നൽകാം; മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായ രണ്ടാമത്തെ രൂപവും അടിക്കുറിപ്പിൽ കൂടുതൽ അക്ഷരാർഥമായ സാധ്യതയും നിലനിർത്തി.
- source_word: ἀγέλη
  choice: കൂട്ടം
  rationale: മൃഗങ്ങളുടെ കൂട്ടത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സാധാരണക്കാർക്ക് വ്യക്തവുമായ മലയാളപദമാണ്.
- source_word: χοίρων πολλῶν
  choice: അനേകം പന്നികളുള്ള
  rationale: πολλῶν എന്നത് നേരിട്ട് പന്നികളുടെ എണ്ണത്തെയാണ് വിശേഷിപ്പിക്കുന്നത്. ‘വലിയൊരു കൂട്ടം’ എന്ന സ്വാഭാവിക പരിഭാഷ സാധ്യമെങ്കിലും, ഗ്രീക്ക് ഘടനയോട് അടുത്തുനിൽക്കാൻ ‘അനേകം പന്നികളുള്ള’ എന്നു നൽകി.
- source_word: βοσκομένη
  choice: മേഞ്ഞുകൊണ്ടിരുന്നു
  rationale: മൃഗങ്ങൾ ആഹാരം കഴിച്ചുകൊണ്ടിരുന്ന പ്രവൃത്തിയെ മധ്യ/കർമണി രൂപത്തിലുള്ള വർത്തമാന കൃദന്തം വിവരിക്കുന്നു. മേയിക്കുന്നവർ ഉണ്ടെന്ന ആശയം ചേർക്കാതെ പ്രവൃത്തിയുടെ പുരോഗതി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. അനാവശ്യമായ ആഖ്യാനബന്ധകമോ വ്യാഖ്യാനപരമായ വിശദീകരണമോ ചേർത്തിട്ടില്ല; [a] മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
