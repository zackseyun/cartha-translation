revisions:
- from: അവരിൽനിന്ന് കുറച്ചകലെ[a] അനേകം പന്നികളുള്ള ഒരു കൂട്ടം മേഞ്ഞുകൊണ്ടിരുന്നു.
  to: അവരിൽനിന്ന് ദൂരെയായി അനേകം പന്നികളുടെ ഒരു കൂട്ടം തീറ്റതേടിക്കൊണ്ടിരുന്നു.
  rationale: The revision renders μακρὰν ἀπ’ αὐτῶν as ‘അവരിൽനിന്ന് ദൂരെയായി,’ avoiding the attenuation introduced by ‘കുറച്ചകലെ.’ It also uses more natural Malayalam noun phrasing for the herd and retains the progressive feeding sense of βοσκομένη. The redundant footnote and its anchor are removed.
