revisions:
- from: യേശു തന്റെ ചുറ്റും വലിയ ജനക്കൂട്ടങ്ങളെ കണ്ടപ്പോൾ, അക്കരയ്ക്കു പോകാൻ കല്പിച്ചു.
  to: യേശു തന്റെ ചുറ്റും അനേകം ജനക്കൂട്ടങ്ങളെ കണ്ടപ്പോൾ, അക്കരയിലേക്കു പോകാൻ കൽപ്പിച്ചു.
  rationale: The revision changes only «വലിയ» to «അനേകം» to represent πολλοὺς faithfully. It retains the unspecified addressees of the command, as in the Greek, and uses a natural Malayalam expression for travel to the other side.
