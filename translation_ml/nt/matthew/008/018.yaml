id: MAT.8.18
reference: Matthew 8:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ ὁ Ἰησοῦς ⸂πολλοὺς ὄχλους⸃ περὶ αὐτὸν ἐκέλευσεν ἀπελθεῖν εἰς τὸ πέραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/018.yaml
  text: When Jesus saw many crowds around him, he gave orders to go to the other side.
translation:
  language: ml
  text: യേശു തന്റെ ചുറ്റും അനേകം ജനക്കൂട്ടങ്ങളെ കണ്ടപ്പോൾ, അക്കരയിലേക്കു പോകാൻ കൽപ്പിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδὼν
  choice: കണ്ടപ്പോൾ
  rationale: സാഹചര്യകാലം സൂചിപ്പിക്കുന്ന aorist participle സ്വാഭാവികമായ മലയാള ഉപവാക്യമായി അവതരിപ്പിക്കുന്നു.
- source_word: πολλοὺς ὄχλους
  choice: വലിയ ജനക്കൂട്ടങ്ങളെ
  rationale: പദശഃ ‘അനേകം ജനക്കൂട്ടങ്ങൾ’; മലയാളത്തിൽ സ്വാഭാവികത നിലനിർത്തിക്കൊണ്ട് ജനങ്ങളുടെ വലിയ കൂട്ടങ്ങളെ സൂചിപ്പിക്കുന്നു.
- source_word: περὶ αὐτόν
  choice: തന്റെ ചുറ്റും
  rationale: യേശുവിനെ ചുറ്റിയുള്ള ജനക്കൂട്ടങ്ങളുടെ സ്ഥാനം വ്യക്തമായി നൽകുന്നു.
- source_word: ἐκέλευσεν
  choice: കല്പിച്ചു
  rationale: അധികാരപൂർവമായ നിർദേശം എന്ന ഗ്രീക്ക് ക്രിയയുടെ ശക്തി നിലനിർത്തുന്നു; കർത്താവിന്റെ നേരിട്ടുള്ള പരാമർശം മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്തതിനാൽ ചേർക്കുന്നില്ല.
- source_word: ἀπελθεῖν εἰς τὸ πέραν
  choice: അക്കരയ്ക്കു പോകാൻ
  rationale: തടാകത്തിന്റെ മറുകര എന്ന സന്ദർഭാർത്ഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു; ἀπελθεῖν എന്ന infinitive-ന്റെ ലക്ഷ്യചലനം ‘പോകാൻ’ എന്നു നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘കല്പിച്ചു’ എന്ന ക്രിയയുടെ പരോക്ഷവാക്യത്തിലെ കർത്താവ്
  choice: ആരോടാണ് കല്പിച്ചതെന്ന് വ്യക്തമാക്കാതെ നിലനിർത്തി
  alternative: ശിഷ്യന്മാരോട് അക്കരയ്ക്കു പോകാൻ കല്പിച്ചു
  rationale: ശിഷ്യന്മാരാണ് ഉദ്ദേശിക്കപ്പെട്ടവർ എന്നു സന്ദർഭം സൂചിപ്പിച്ചാലും ഈ വാക്യത്തിലെ ഗ്രീക്ക് പാഠം അവരെ വ്യക്തമായി പറയുന്നില്ല; അതിനാൽ ആ വിശദീകരണം മുഖ്യപാഠത്തിൽ ചേർത്തില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി. ഗ്രീക്കിലെ δέ വേറൊരു ‘ഇപ്പോൾ/എന്നാൽ’ പദമായി യാന്ത്രികമായി പരിഭാഷപ്പെടുത്താതെ വാക്യബന്ധത്തിൽ സ്വാഭാവികമായി ഉൾപ്പെടുത്തി.
