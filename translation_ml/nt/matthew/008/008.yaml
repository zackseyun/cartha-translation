id: MAT.8.8
reference: Matthew 8:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂καὶ ἀποκριθεὶς⸃ ὁ ἑκατόνταρχος ἔφη· Κύριε, οὐκ εἰμὶ ἱκανὸς ἵνα μου ὑπὸ τὴν στέγην εἰσέλθῃς· ἀλλὰ μόνον εἰπὲ λόγῳ, καὶ ἰαθήσεται ὁ παῖς μου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/008.yaml
  text: And the centurion answered[a], “Lord, I am not worthy that you should come under my roof. But only speak a word[b], and my servant will be healed.”
translation:
  language: ml
  text: 'ശതാധിപൻ മറുപടി പറഞ്ഞു: “കർത്താവേ, അങ്ങ് എന്റെ മേൽക്കൂരയ്ക്കു കീഴിൽ പ്രവേശിക്കത്തക്കവണ്ണം ഞാൻ യോഗ്യനല്ല. ഒരു വാക്കു മാത്രം അരുളിച്ചെയ്യുക,[a] അപ്പോൾ എന്റെ ദാസൻ[b] സൗഖ്യം പ്രാപിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വാക്കു പറയുക.” ഗ്രീക്കിൽ ‘വാക്കിലൂടെ പറയുക’ എന്ന പ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “ബാലൻ” അല്ലെങ്കിൽ “കുട്ടി.” ഗ്രീക്ക് പദത്തിന് സന്ദർഭമനുസരിച്ച് കുട്ടി, യുവാവ്, ദാസൻ എന്നീ അർഥങ്ങൾ വരാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς … ἔφη
  choice: മറുപടി പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ കൃതന്തവും തുടർന്നുള്ള സംസാരക്രിയയും ചേർന്ന് ഒരൊറ്റ സ്വാഭാവിക സംഭാഷണാമുഖമായി പ്രവർത്തിക്കുന്നു; ആവർത്തനം ഒഴിവാക്കി പ്രതികരണത്തിന്റെ ഭാവം നിലനിർത്തുന്നു.
- source_word: ἑκατόνταρχος
  choice: ശതാധിപൻ
  rationale: ഏകദേശം നൂറു സൈനികരുടെ ചുമതലയുള്ള റോമൻ സൈനിക ഉദ്യോഗസ്ഥനെ സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും കൃത്യവുമായ പദം.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: ബഹുമാനപൂർവമായ അഭിസംബോധനയും യേശുവിനെ സംബന്ധിച്ചുണ്ടാകാവുന്ന കൂടുതൽ ആഴമുള്ള അർഥവും ഒരുപോലെ തുറന്നുവയ്ക്കുന്നു.
- source_word: οὐκ εἰμὶ ἱκανός
  choice: ഞാൻ യോഗ്യനല്ല
  rationale: ഇവിടെ കഴിവില്ലായ്മയേക്കാൾ വിനയപൂർവമായ അയോഗ്യതയാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: ὑπὸ τὴν στέγην
  choice: എന്റെ മേൽക്കൂരയ്ക്കു കീഴിൽ
  rationale: ‘എന്റെ വീട്ടിൽ’ എന്നു സമതലമാക്കാതെ ഗ്രീക്കിലെ സജീവമായ ഗൃഹരൂപകം നിലനിർത്തുന്നു.
- source_word: μόνον εἰπὲ λόγῳ
  choice: ഒരു വാക്കു മാത്രം അരുളിച്ചെയ്യുക
  rationale: μόνον എന്ന നിയന്ത്രകശക്തിയും λόγῳ എന്ന ‘ഒരു വാക്ക്’ എന്ന ആശയവും സംരക്ഷിക്കുന്നു; യേശുവിനോടുള്ള അഭിസംബോധനയിൽ ‘അരുളിച്ചെയ്യുക’ സ്വാഭാവികവും മാന്യവുമാണ്.
- source_word: ἰαθήσεται
  choice: സൗഖ്യം പ്രാപിക്കും
  rationale: ഭാവികാല നിഷ്ക്രിയമായ രോഗശാന്തിയുടെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: παῖς
  choice: ദാസൻ
  rationale: ശതാധിപന്റെ സാമൂഹിക സാഹചര്യവും ലൂക്കോസിലെ സമാന്തരവിവരണവും ഇവിടെ ‘ദാസൻ’ എന്ന അർഥത്തെ പിന്തുണയ്ക്കുന്നു; പദത്തിന്റെ ‘ബാലൻ/കുട്ടി’ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: യേശുവിനോടുള്ള κύριος എന്ന അഭിസംബോധന
  choice: കർത്താവേ
  alternative: യജമാനനേ / പ്രഭോ
  rationale: വെറും മര്യാദാപദമായി ചുരുക്കാതെയും പൂർണമായ ക്രിസ്തുശാസ്ത്രപ്രഖ്യാപനം നിർബന്ധിക്കാതെയും പദത്തിന്റെ സാധ്യതയുള്ള ദൈവശാസ്ത്രഭാരം നിലനിർത്തുന്നു.
- issue: παῖς എന്ന പദത്തിന്റെ അർഥം
  choice: ദാസൻ
  alternative: ബാലൻ / കുട്ടി
  rationale: സന്ദർഭം ‘ദാസൻ’ എന്ന വായനയ്ക്ക് മുൻതൂക്കം നൽകുന്നു; എങ്കിലും മൂലപദത്തിന്റെ യഥാർഥ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ തുറന്നുവയ്ക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ വാക്യഘടന. ‘ശതാധിപൻ’, ‘കർത്താവേ’, ‘അരുളിച്ചെയ്യുക’ എന്നിവ ബൈബിൾ സന്ദർഭത്തിന് യോജിച്ച ഗൗരവം നൽകുന്നു; അപൂർവമായ സംസ്കൃതഭാരം പരമാവധി ഒഴിവാക്കിയിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
