id: MAT.8.12
reference: Matthew 8:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ υἱοὶ τῆς βασιλείας ἐκβληθήσονται εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/012.yaml
  text: But the sons of the kingdom will be cast out into the outer darkness[c][b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: ml
  text: എന്നാൽ രാജ്യത്തിന്റെ പുത്രന്മാർ[a] പുറത്തെ ഇരുട്ടിലേക്ക് എറിയപ്പെടും. അവിടെ കരച്ചിലും പല്ലുകടിയും ഉണ്ടാകും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘രാജ്യത്തിന്റെ മക്കൾ.’ ഗ്രീക്കിൽ അക്ഷരാർഥം ‘രാജ്യത്തിന്റെ പുത്രന്മാർ’; രാജ്യത്തിന്റെ അവകാശികളോ അതിൽ ഉൾപ്പെടേണ്ടവരോ ആയി കരുതപ്പെട്ടവരെ സൂചിപ്പിക്കുന്ന ഒരു പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱοὶ τῆς βασιλείας
  choice: രാജ്യത്തിന്റെ പുത്രന്മാർ
  rationale: ഗ്രീക്കിലെ രൂപകാത്മക പ്രയോഗം അടുത്തായി നിലനിർത്തുന്നു; രാജ്യം തങ്ങൾക്ക് അവകാശപ്പെട്ടതാണെന്നോ അതിൽ തങ്ങൾ ഉൾപ്പെടേണ്ടവരാണെന്നോ കരുതപ്പെട്ടവരെ സൂചിപ്പിക്കുന്ന ഈ പ്രയോഗത്തിലെ വൈരുധ്യവും ഇതിലൂടെ സംരക്ഷിക്കപ്പെടുന്നു.
- source_word: ἐκβληθήσονται
  choice: എറിയപ്പെടും
  rationale: ἐκβάλλω എന്ന ക്രിയയുടെ ഭാവികാല കർമണിപ്രയോഗത്തിലുള്ള ബലപ്രയോഗത്തോടെയുള്ള പുറത്താക്കൽ എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὸ σκότος τὸ ἐξώτερον
  choice: പുറത്തെ ഇരുട്ട്
  rationale: മത്തായിയുടെ സവിശേഷമായ ന്യായവിധി-ദൃശ്യഭാഷയെ വ്യാഖ്യാനിച്ച് മാറ്റാതെ, മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: κλαυθμός
  choice: കരച്ചിൽ
  rationale: വിലാപവും ദുഃഖവും സൂചിപ്പിക്കുന്ന പൊതുവായ അർത്ഥം അതിശയോക്തിയില്ലാതെ നൽകുന്നു.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: പല്ലുകടി
  rationale: പല്ലുകൾ കടിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം സംക്ഷിപ്തവും പരിചിതവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിൽ രാജ്യത്തിൽ പ്രവേശിക്കുന്നവരെക്കുറിച്ചുള്ള പ്രസ്താവനയോടുള്ള വ്യക്തമായ വൈരുധ്യം അടയാളപ്പെടുത്തുന്നു.
- source_word: ἐκεῖ
  choice: അവിടെ
  rationale: ന്യായവിധിയുടെ സ്ഥലത്തേക്കുള്ള ഊന്നൽ ലളിതമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ന്യായവിധിയെയും പുറത്താക്കലിനെയും സൂചിപ്പിക്കുന്ന ദൃശ്യഭാഷ
  choice: ‘പുറത്തെ ഇരുട്ട്’, ‘കരച്ചിൽ’, ‘പല്ലുകടി’ എന്നീ മൂലപാഠത്തിലെ ദൃശ്യപ്രയോഗങ്ങൾ അതേപടി നിലനിർത്തുക
  alternative: ‘നരകം’ അല്ലെങ്കിൽ ‘നിത്യശിക്ഷ’ എന്നിങ്ങനെ വ്യാഖ്യാനിച്ച് പരിഭാഷപ്പെടുത്തുക
  rationale: വാക്യം കടുത്ത അന്തിമന്യായവിധിയും പുറത്താക്കലും ചിത്രീകരിക്കുന്നുവെങ്കിലും ഇവിടെ മൂലപാഠം ആ വ്യവസ്ഥാപിത ദൈവശാസ്ത്രപദങ്ങൾ ഉപയോഗിക്കുന്നില്ല; അതിനാൽ അതിന്റെ ദൃശ്യഭാഷയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
- issue: υἱοὶ എന്ന പദത്തിലെ ലിംഗവും രൂപകാത്മകതയും
  choice: ‘പുത്രന്മാർ’ എന്ന് പരിഭാഷപ്പെടുത്തി മുഖ്യപാഠത്തിൽ ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചനവും രൂപകാത്മക പ്രയോഗവും നിലനിർത്തുക
  alternative: ‘മക്കൾ’ അല്ലെങ്കിൽ ‘അവകാശികൾ’
  rationale: ‘പുത്രന്മാർ’ മൂലരൂപത്തോട് അടുത്തതും അവകാശബന്ധത്തിന്റെ സൂചന സംരക്ഷിക്കുന്നതുമാണ്; അതിന്റെ സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. വിധിന്യായത്തിന്റെ ശക്തമായ ദൃശ്യഭാഷ മൃദൂകരിക്കാതെയും അതിലേക്ക് അധിക ദൈവശാസ്ത്രവ്യാഖ്യാനം ചേർക്കാതെയും നൽകിയിരിക്കുന്നു.
