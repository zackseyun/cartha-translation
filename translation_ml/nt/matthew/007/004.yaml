id: MAT.7.4
reference: Matthew 7:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἢ πῶς ἐρεῖς τῷ ἀδελφῷ σου· Ἄφες ἐκβάλω τὸ κάρφος ⸀ἐκ τοῦ ὀφθαλμοῦ σου, καὶ ἰδοὺ ἡ δοκὸς ἐν τῷ ὀφθαλμῷ σοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/004.yaml
  text: Or how will you say to your brother[a], ‘Let me take the speck out of your eye,’ and behold[c][b], the beam is in your own eye?
translation:
  language: ml
  text: അല്ലെങ്കിൽ, “നിന്റെ കണ്ണിലെ കരട്[b] ഞാൻ എടുത്തുകളയട്ടെ” എന്ന് നിന്റെ സഹോദരനോട്[a] നീ എങ്ങനെ പറയും—ഇതാ, നിന്റെ സ്വന്തം കണ്ണിൽ ഒരു വലിയ മരത്തടി[c] ഇരിക്കുന്നു?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സഹോദരൻ’ എന്നു പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്ക് പദം പുരുഷലിംഗ ഏകവചനത്തിലാണ്; ഇവിടെ അത് ഒരു സഹശിഷ്യനെ പ്രതിനിധാനപരമായി സൂചിപ്പിക്കാം.
    reason: cultural_note
  - marker: b
    text: ‘കരട്’ എന്നു പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്ക് κάρφος ഉണങ്ങിയ വസ്തുവിന്റെ ചെറിയൊരു കഷണത്തെ സൂചിപ്പിക്കുന്നു; ‘ചീള്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: ‘വലിയ മരത്തടി’ എന്നു പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്ക് δοκός ഒരു കെട്ടിടത്തിലെ വലിയ ഉത്തരത്തടിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: അല്ലെങ്കിൽ
  rationale: മുൻവാക്യത്തിലെ ആലങ്കാരിക ചോദ്യത്തിനു പിന്നാലെ മറ്റൊരു അസംഗതി ചൂണ്ടിക്കാണിക്കുന്ന ബന്ധകമായി സ്വാഭാവികമാണ്.
- source_word: πῶς ἐρεῖς
  choice: നീ എങ്ങനെ പറയും
  rationale: πῶς എന്ന ആലങ്കാരിക വെല്ലുവിളിയും ἐρεῖς എന്ന ഭാവികാലരൂപവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: τῷ ἀδελφῷ σου
  choice: നിന്റെ സഹോദരനോട്
  rationale: പുരുഷലിംഗ ഏകവചനമായ ἀδελφός എന്ന മൂലരൂപത്തെ കൃത്യമായി പ്രതിഫലിപ്പിക്കുന്നു; പ്രതിനിധാനപരമായ വിപുലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: Ἄφες ἐκβάλω
  choice: ഞാൻ എടുത്തുകളയട്ടെ
  rationale: അനുവാദം ചോദിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപമാണിത്; കണ്ണിൽനിന്നുള്ള നീക്കവും വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: τὸ κάρφος
  choice: കരട്
  rationale: കണ്ണിൽപ്പെട്ട ചെറിയ ഉണങ്ങിയ കഷണമോ സൂക്ഷ്മമായ അന്യവസ്തുവോ സൂചിപ്പിക്കാൻ സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമാണ്; ‘ചീള്’ എന്ന കൂടുതൽ നിർദിഷ്ട സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: καὶ ἰδοὺ
  choice: —ഇതാ,
  rationale: ἰδού നൽകുന്ന പെട്ടെന്നുള്ള ശ്രദ്ധാകർഷണവും ആലങ്കാരിക വെളിപ്പെടുത്തലും ‘ഇതാ’ നിലനിർത്തുന്നു; ദീർഘരേഖ വാക്യത്തിലെ ശക്തമായ തിരിവ് വ്യക്തമാക്കുന്നു.
- source_word: ἡ δοκὸς
  choice: ഒരു വലിയ മരത്തടി
  rationale: വലിയ നിർമ്മാണത്തടിയെ സൂചിപ്പിക്കുന്ന δοκός എന്ന പദത്തിന്റെ ദൃശ്യാതിശയോക്തി സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; ‘ഉത്തരമരം’ എന്ന കൂടുതൽ സാങ്കേതിക പദം ഒഴിവാക്കി.
- source_word: ἐν τῷ ὀφθαλμῷ σοῦ
  choice: നിന്റെ സ്വന്തം കണ്ണിൽ ... ഇരിക്കുമ്പോൾ
  rationale: സ്ഥലസൂചന കൃത്യമായി നിലനിർത്തുകയും സന്ദർഭത്തിലെ വൈരുധ്യം ‘സ്വന്തം’ എന്ന സ്വാഭാവിക ഊന്നലിലൂടെ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ἀδελφῷ എന്ന പദത്തിന്റെ ലിംഗസൂചന
  choice: സഹോദരനോട്
  alternative: സഹവിശ്വാസിയോട് / സഹോദരനോ സഹോദരിയോടോ
  rationale: മൂലപാഠം പുരുഷലിംഗ ഏകവചനത്തിലാണ്. എന്നാൽ അത് ഒരു സഹശിഷ്യനെ പ്രതിനിധാനപരമായി സൂചിപ്പിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു; പ്രധാനപാഠത്തിൽ ലിംഗവിപുലീകരണം ചേർക്കുന്നില്ല.
- issue: κάρφος / δοκός എന്ന അതിശയോക്തിപരമായ വൈരുധ്യം
  choice: കരട് / വലിയ മരത്തടി
  alternative: ചീള് / ഉത്തരമരം
  rationale: ചെറിയ വസ്തുവും അസാധ്യമായി വലിയ വസ്തുവും തമ്മിലുള്ള യേശുവിന്റെ ഉദ്ദേശ്യപൂർവമായ അതിശയോക്തി വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു; രൂപകത്തിന്റെ പ്രയോഗം വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. നേരിട്ടുള്ള അഭിസംബോധനയും ആലങ്കാരിക ചോദ്യത്തിന്റെ ശക്തിയും നിലനിർത്തി. ‘ഇതാ’ ഔപചാരികതയുള്ളതെങ്കിലും ഇന്നത്തെ ബൈബിൾ വായനയിൽ ഗ്രഹിക്കാവുന്ന ശ്രദ്ധാകർഷക പ്രയോഗമാണ്; ദീർഘരേഖ മൂലവാക്യത്തിലെ καὶ ἰδού സൃഷ്ടിക്കുന്ന ശക്തമായ തിരിവ് അടയാളപ്പെടുത്തുന്നു.
