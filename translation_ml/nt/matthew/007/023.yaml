id: MAT.7.23
reference: Matthew 7:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ τότε ὁμολογήσω αὐτοῖς ὅτι Οὐδέποτε ἔγνων ὑμᾶς· ἀποχωρεῖτε ἀπ’ ἐμοῦ οἱ ἐργαζόμενοι τὴν ἀνομίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/023.yaml
  text: And then I will declare to them[a], ‘I never knew you; depart from me[b], you who practice lawlessness.’
translation:
  language: ml
  text: 'അപ്പോൾ ഞാൻ അവരോട് തുറന്നുപറയും: ‘ഞാൻ നിങ്ങളെ ഒരിക്കലും അറിഞ്ഞിട്ടില്ല[a]. നിയമലംഘനം ചെയ്യുന്നവരേ[b], എന്നിൽനിന്ന് അകന്നുപോകുക.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഞാൻ നിങ്ങളെ ഒരിക്കലും അംഗീകരിച്ചിട്ടില്ല.’ ഇവിടെ ‘അറിയുക’ എന്ന ഗ്രീക്ക് പദം വെറും ബൗദ്ധിക അറിവിനപ്പുറം ബന്ധപരമായ തിരിച്ചറിവിനെയോ അംഗീകാരത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നിയമരാഹിത്യം പ്രവർത്തിക്കുന്നവരേ’ / ‘അധർമ്മം ചെയ്യുന്നവരേ.’ ‘നിയമലംഘനം’ എന്നു പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്ക് പദം നിയമത്തെയോ ദൈവിക ക്രമത്തെയോ അവഗണിക്കുന്നതിന്റെ ഭാവം വഹിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ τότε
  choice: അപ്പോൾ
  rationale: മുൻസന്ദർഭവുമായി ബന്ധമുള്ള സമയക്രമം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; καίയുടെ ബന്ധകശക്തി സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: ὁμολογήσω
  choice: തുറന്നുപറയും
  rationale: ഇവിടെ കുറ്റസമ്മതം എന്നതിലുപരി പരസ്യവും വ്യക്തവുമായ പ്രഖ്യാപനമാണ് ഉദ്ദേശ്യം. ‘തുറന്നുപറയും’ അതിന്റെ പൊതുവായും ഉറച്ചതുമായ ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: Οὐδέποτε
  choice: ഒരിക്കലും ... ഇല്ല
  rationale: ഊന്നലുള്ള സമ്പൂർണ നിഷേധം മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: ἔγνων
  choice: അറിഞ്ഞിട്ടില്ല
  rationale: γινώσκωയുടെ നേരിട്ടുള്ള ‘അറിയുക’ എന്ന രൂപം നിലനിർത്തുന്നു; ബൗദ്ധിക അറിവിനപ്പുറമുള്ള ബന്ധപരമായ അംഗീകാരസാധ്യതയെ പ്രധാനവാചകത്തിൽ വിശദീകരിച്ച് തീർപ്പാക്കുന്നില്ല.
- source_word: ἀποχωρεῖτε
  choice: അകന്നുപോകുക
  rationale: പിരിഞ്ഞുപോകാനുള്ള കർശനമായ ആജ്ഞയെ വ്യക്തവും ഗൗരവമുള്ളതുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐργαζόμενοι
  choice: ചെയ്യുന്നവരേ
  rationale: തുടർച്ചയായോ സ്വഭാവസവിശേഷമായോ ഉള്ള പ്രവൃത്തിയെ മലയാളത്തിലെ സ്വാഭാവിക അഭിസംബോധനയിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀνομίαν
  choice: അധർമ്മം
  rationale: ദൈവിക നിയമക്രമത്തോടുള്ള വിരോധം ഉൾപ്പെടുന്ന ധാർമിക ദുഷ്ടതയെ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള പദത്തിൽ നൽകുന്നു; ‘നിയമരാഹിത്യം’ എന്ന കൂടുതൽ ശബ്ദാനുകരണപരമായ രൂപം മലയാളത്തിൽ കൃത്രിമമാകാം.
theological_decisions:
- issue: ‘ഞാൻ നിങ്ങളെ ഒരിക്കലും അറിഞ്ഞിട്ടില്ല’ എന്നതിന്റെ അർഥം
  choice: ബന്ധപരവും ന്യായവിധിസംബന്ധവുമായ അർഥസാധ്യത തുറന്നുവെച്ച് ‘അറിഞ്ഞിട്ടില്ല’ എന്നു നിലനിർത്തി.
  alternative: ‘ഞാൻ നിങ്ങളെ ഒരിക്കലും അംഗീകരിച്ചിട്ടില്ല’ / ‘നിങ്ങൾ ഒരിക്കലും എന്റേതായിരുന്നില്ല’
  rationale: ഗ്രീക്ക് വാചകം നേരിട്ട് ‘അറിഞ്ഞില്ല’ എന്നാണ് പറയുന്നത്. അംഗീകാരം, ഉടമസ്ഥബന്ധം, രക്ഷാസ്ഥിതി എന്നിവയിൽ ഏതെങ്കിലും ഒന്ന് വ്യാഖ്യാനമായി പ്രധാനവാചകത്തിൽ ചേർക്കുന്നത് വാക്യത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം അനാവശ്യമായി പരിഹരിക്കും.
- issue: ἀνομίαയുടെ ധാർമിക-നിയമപരമായ ശക്തി
  choice: പ്രധാനവാചകത്തിൽ ‘അധർമ്മം’ ഉപയോഗിച്ച്, ‘നിയമരാഹിത്യം/നിയമലംഘനം’ എന്ന അർഥഛായ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: ‘നിയമരാഹിത്യം’ / ‘നിയമലംഘനം’ / ‘ദുഷ്ടത’
  rationale: ‘അധർമ്മം’ സ്വാഭാവികവും ഗ്രഹിക്കാവുന്നതുമാണ്; അടിക്കുറിപ്പ് മൂലപദത്തിന്റെ നിയമക്രമവിരുദ്ധമായ ഭാവം സംരക്ഷിക്കുന്നു. ഒരു പ്രത്യേക സമുദായത്തിന്റെ രക്ഷയോ വിശുദ്ധീകരണമോ സംബന്ധിച്ച സിദ്ധാന്തം ഇതിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ന്യായവിധിയുടെ ഗൗരവം നിലനിർത്തുന്ന ഭാഷ. ‘തുറന്നുപറയും’, ‘അകന്നുപോകുക’ എന്നീ രൂപങ്ങൾ അതിപുരാതന ശൈലി ഒഴിവാക്കുന്നു. നേരിട്ടുള്ള വാക്കുകളുടെ കഠിനതയും ‘അറിയുക’ എന്നതിലെ ബന്ധപരമായ അസ്പഷ്ടതയും സംരക്ഷിച്ചിരിക്കുന്നു.
