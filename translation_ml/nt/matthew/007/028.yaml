id: MAT.7.28
reference: Matthew 7:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὅτε ⸀ἐτέλεσεν ὁ Ἰησοῦς τοὺς λόγους τούτους, ἐξεπλήσσοντο οἱ ὄχλοι ἐπὶ τῇ διδαχῇ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/028.yaml
  text: And it happened that when Jesus had finished these words[b][a], the crowds were astonished at his teaching.
translation:
  language: ml
  text: യേശു ഈ വാക്കുകൾ[a] പറഞ്ഞുതീർന്നപ്പോൾ, ജനക്കൂട്ടങ്ങൾ അദ്ദേഹത്തിന്റെ ഉപദേശത്തിൽ വിസ്മയിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഈ പറഞ്ഞ കാര്യങ്ങൾ.’
    reason: λόγους എന്ന പദത്തിന് ഈ സന്ദർഭത്തിൽ ‘വാക്കുകൾ’ എന്നതിനുപുറമെ ‘പറഞ്ഞ കാര്യങ്ങൾ’ എന്നും അർഥമാകാം.
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: …പ്പോൾ
  rationale: ഈ ഗ്രീക്ക് ആഖ്യാനസൂത്രം തുടർച്ചയും സമയബന്ധവും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘സംഭവിച്ചതെന്തെന്നാൽ, …പ്പോൾ’ എന്നു ഘടന പകർത്തുന്നത് കൃത്രിമമായതിനാൽ, സ്വാഭാവികമായ സമയവാക്യമായ ‘…പ്പോൾ’ ഉപയോഗിച്ചു; ആഖ്യാനത്തിന്റെ തുടർച്ച സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: ἐτέλεσεν
  choice: പറഞ്ഞുതീർന്നപ്പോൾ
  rationale: പ്രഭാഷണം സമാപിപ്പിച്ചതെന്ന പൂർത്തീകരണഭാവം ‘തീർന്നു’ എന്ന ഘടകം നിലനിർത്തുന്നു; λόγους എന്നതോടൊപ്പം മലയാളത്തിൽ സ്വാഭാവികമാകാൻ ‘പറഞ്ഞു’ ചേർത്തു.
- source_word: τοὺς λόγους τούτους
  choice: ഈ വാക്കുകൾ
  rationale: λόγοι എന്നതിന്റെ അടിസ്ഥാനവും സന്ദർഭോചിതവുമായ അർഥം ‘വാക്കുകൾ’ എന്നാണ്; τούτους എന്ന നിർദ്ദേശകത്തിന്റെ സമീപസൂചന ‘ഈ’ നിലനിർത്തുന്നു. ‘വചനങ്ങൾ’ ഇവിടെ അനാവശ്യമായി മതസാങ്കേതിക ഭാവം സൃഷ്ടിക്കാം.
- source_word: ἐξεπλήσσοντο
  choice: വിസ്മയിച്ചുപോയി
  rationale: ക്രിയയുടെ ശക്തമായ അത്ഭുതപ്രതികരണം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു. ഗ്രീക്കിലെ അപൂർണ്ണഭൂതകാലം കൂട്ടത്തിന്റെ നിലനിന്ന പ്രതികരണത്തെ സൂചിപ്പിച്ചാലും, മലയാളത്തിൽ ഈ രൂപം ആ സമഗ്രപ്രതികരണം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: οἱ ὄχλοι
  choice: ജനക്കൂട്ടങ്ങൾ
  rationale: ഗ്രീക്കിലെ ബഹുവചനം നിലനിർത്തുന്നതിനായി ‘ജനക്കൂട്ടങ്ങൾ’ തെരഞ്ഞെടുത്തു; ഏകവചനമായ ‘ജനക്കൂട്ടം’ സംഖ്യാഭേദം മായ്ക്കും.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: അദ്ദേഹത്തിന്റെ ഉപദേശത്തിൽ
  rationale: ἐπί + ദത്തിവ് ഇവിടെ വിസ്മയത്തിന്റെ ആധാരമോ വിഷയമോ സൂചിപ്പിക്കുന്നു. ‘ഉപദേശത്തിൽ’ എന്നത് ഈ ബന്ധം ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
theological_decisions:
- issue: യേശു പൂർത്തിയാക്കിയ പ്രസംഗഭാഗത്തിന്റെ പരാമർശം
  choice: ഈ വാക്കുകൾ
  alternative: ഈ അരുളപ്പാടുകൾ; ഈ പ്രഭാഷണം
  rationale: τοὺς λόγους τούτους നേരിട്ട് മുൻപുള്ള യേശുവിന്റെ വാക്കുകളെ സൂചിപ്പിക്കുന്നു. മൂലപാഠത്തിലില്ലാത്ത ‘മലമുകളിലെ പ്രസംഗം’ പോലുള്ള വ്യാഖ്യാനശീർഷകം ചേർക്കാതെയും λόγοι എന്നതിന്റെ അർഥവ്യാപ്തി അമിതമായി ചുരുക്കാതെയും വിവർത്തനം ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഇംഗ്ലീഷിലെ ‘And it happened that when’ എന്ന ഘടന യാന്ത്രികമായി പകർത്താതെ മലയാളത്തിലെ സ്വാഭാവിക ‘…പ്പോൾ’ ഘടന സ്വീകരിച്ചു. ‘അദ്ദേഹത്തിന്റെ’ എന്ന ആദരസൂചക സർവനാമം സാധാരണ മലയാള ബൈബിൾ ഗദ്യത്തിന്റെ മാന്യഭാവത്തോട് യോജിക്കുന്നു.
