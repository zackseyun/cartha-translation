  verdict: revise
  source_fidelity: The draft preserves the explanatory force of γάρ, the imperfective sense of ἦν διδάσκων, the direct object ‘them,’ the contrast with the scribes, and αὐτῶν (‘their’). However, ‘അധികാരമുള്ള ഒരാളെപ്പോലെയാണ്’ is syntactically and idiomatically awkward in Malayalam, particularly with the following finite verb; it also weakens the direct comparison by treating it as a separate predication.
  naturalness: ‘അധികാരമുള്ളവനെപ്പോലെ’ is a natural, concise Malayalam expression for ‘as one having authority.’ Placing it directly with ‘പഠിപ്പിച്ചുകൊണ്ടിരുന്നു’ produces a clear and fluent sentence while retaining the ongoing past sense.
  terminology: ‘ശാസ്ത്രിമാർ’ is an established and suitable rendering of γραμματεῖς in this Gospel setting. ‘അധികാരം’ appropriately renders ἐξουσία without importing a theological explanation beyond the verse.
  issues:
  - severity: medium
    issue: Awkward construction in the authority comparison
    rationale: ‘അവൻ അധികാരമുള്ള ഒരാളെപ്പോലെയാണ് അവരെ പഠിപ്പിച്ചിരുന്നത്’ separates the comparative phrase from the verb in a way that is unnatural in modern Malayalam. ‘ഒരാളെപ്പോലെ’ is also less idiomatic here than ‘അധികാരമുള്ളവനെപ്പോലെ.’
  revised_text: കാരണം, അവൻ അവരെ അധികാരമുള്ളവനെപ്പോലെ പഠിപ്പിച്ചുകൊണ്ടിരുന്നു[a]; അവരുടെ ശാസ്ത്രിമാരെപ്പോലെയല്ല.
