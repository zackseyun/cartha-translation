  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἦν γὰρ διδάσκων αὐτοὺς ὡς ἐξουσίαν ἔχων καὶ οὐχ ὡς οἱ γραμματεῖς ⸀αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/029.yaml
  text: for he was teaching them as one having authority[a], and not as their scribes.
translation:
  language: ml
  text: കാരണം, അവൻ അവരെ അധികാരമുള്ളവനെപ്പോലെ പഠിപ്പിച്ചുകൊണ്ടിരുന്നു[a]; അവരുടെ ശാസ്ത്രിമാരെപ്പോലെയല്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, കൂടുതൽ സ്വാഭാവികമായി: ‘അധികാരത്തോടെ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν γὰρ διδάσκων αὐτούς
  choice: കാരണം, അവൻ ... അവരെ പഠിപ്പിച്ചിരുന്നത്
  rationale: ἦν + വർത്തമാനകൃതന്തം ചേർന്ന പരിഭാഷാപരമായ അപൂർണഭൂതകാലരൂപം കഴിഞ്ഞകാലത്തെ തുടർച്ചയായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. γάρ മുൻവാക്യത്തിൽ ജനക്കൂട്ടത്തിനുണ്ടായ വിസ്മയത്തിന്റെ കാരണം വിശദീകരിക്കുന്നതിനാൽ ‘കാരണം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: ὡς ἐξουσίαν ἔχων
  choice: അധികാരമുള്ള ഒരാളെപ്പോലെ
  rationale: ഗ്രീക്കിലെ വ്യക്തിപരമായ താരതമ്യഘടന നിലനിർത്തുന്നു; ἐξουσία എന്നത് അധികാരം, അവകാശം, അധികാരശക്തി എന്നിവ സൂചിപ്പിക്കുന്നു. കൂടുതൽ സ്വാഭാവികമായ ‘അധികാരത്തോടെ’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: καὶ οὐχ ὡς
  choice: '...പ്പോലെയല്ല'
  rationale: മലയാളത്തിൽ സ്വാഭാവികമായി താരതമ്യവും ശക്തമായ വൈരുധ്യവും നിലനിർത്തുന്നു.
- source_word: οἱ γραμματεῖς αὐτῶν
  choice: അവരുടെ ശാസ്ത്രിമാർ
  rationale: γραμματεῖς ഇവിടെ ന്യായപ്രമാണത്തിൽ പ്രാവീണ്യമുള്ള അംഗീകൃത മതപണ്ഡിതരെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ശാസ്ത്രിമാർ’ നേരിട്ടുള്ളതും ബൈബിൾസന്ദർഭത്തിൽ പരിചിതവുമായ പദമാണ്. αὐτῶν എന്ന ഉടമസ്ഥസർവനാമം ‘അവരുടെ’ എന്നു നിലനിർത്തി.
theological_decisions:
- issue: യേശുവിന്റെ പഠിപ്പിക്കലിലെ അധികാരത്തിന്റെ സ്വഭാവം
  choice: ‘അധികാരമുള്ള ഒരാളെപ്പോലെ’ എന്ന വിവരണാത്മക താരതമ്യം നിലനിർത്തി.
  alternative: ദൈവിക അധികാരം എന്നു വ്യക്തമായി വികസിപ്പിക്കുക; അല്ലെങ്കിൽ വെറും ആത്മവിശ്വാസമോ വാഗ്മിതയോ ആയി ചുരുക്കുക.
  rationale: വാക്യം യേശുവിന്റെ അധികാരം യഥാർഥമാണെന്ന് ശാസ്ത്രിമാരുമായുള്ള വൈരുധ്യത്തിലൂടെ അവതരിപ്പിക്കുന്നു; എന്നാൽ ആ അധികാരത്തിന്റെ പൂർണ ദൈവശാസ്ത്രപരമായ അടിസ്ഥാനം ഇവിടെ വ്യക്തമാക്കുന്നില്ല. അതിനാൽ അവകാശവാദം ശക്തമായി നിലനിർത്തിക്കൊണ്ട് പാഠത്തിൽ ഇല്ലാത്ത വിശദീകരണം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘പഠിപ്പിച്ചിരുന്നത്’ തുടർച്ചയായ കഴിഞ്ഞകാലപ്രവൃത്തി പ്രകടമാക്കുന്നു. ‘ശാസ്ത്രിമാർ’ എന്നത് സന്ദർഭോചിതമായ പരമ്പരാഗത പദമാണെങ്കിലും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാണ്.
