id: MAT.7.18
reference: Matthew 7:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐ δύναται δένδρον ἀγαθὸν καρποὺς πονηροὺς ⸀ποιεῖν, οὐδὲ δένδρον σαπρὸν καρποὺς καλοὺς ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/018.yaml
  text: A good tree cannot produce bad fruit[c][b][a], nor can a rotten tree produce good fruit.
translation:
  language: ml
  text: നല്ല വൃക്ഷത്തിന് ചീത്ത ഫലം കായ്ക്കാൻ കഴിയില്ല; ചീഞ്ഞ വൃക്ഷത്തിന് നല്ല ഫലം കായ്ക്കാനും കഴിയില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δένδρον ἀγαθόν
  choice: നല്ല വൃക്ഷം
  rationale: ἀγαθός എന്നതിന്റെ അടിസ്ഥാനമായ മൂല്യനിർണയാർഥമായ ‘നല്ല’ എന്നത് നിലനിർത്തുന്നു; ‘ആരോഗ്യമുള്ള’ എന്നു വ്യാഖ്യാനിച്ച് അർഥം ചുരുക്കുന്നില്ല.
- source_word: οὐ δύναται ... ποιεῖν
  choice: കായ്ക്കാൻ കഴിയില്ല
  rationale: δύναται സൂചിപ്പിക്കുന്ന കഴിവില്ലായ്മ വ്യക്തമായി നിലനിർത്തുന്നു; ഫലത്തോടൊപ്പം ποιέω ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ ‘കായ്ക്കുക’ തിരഞ്ഞെടുത്തു.
- source_word: καρποὺς πονηρούς
  choice: ചീത്ത ഫലം
  rationale: πονηρός എന്നതിലെ ദോഷകരമായ ഗുണവും മൂല്യനിർണയവും ‘ചീത്ത’ സ്വാഭാവികമായി വഹിക്കുന്നു; ‘ദുഷ്ടഫലം’ എന്നത് ഈ ദൃശ്യരൂപകത്തിൽ അനാവശ്യമായി അമൂർത്തവും കടുപ്പമുള്ളതുമാകും.
- source_word: οὐδέ
  choice: '...ആനും കഴിയില്ല'
  rationale: രണ്ടാം നിഷേധവാക്യത്തെ സമാന്തരമായി ബന്ധിപ്പിക്കുകയും ആദ്യത്തെ ‘കഴിയില്ല’ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ ആവർത്തിക്കുകയും ചെയ്യുന്നു.
- source_word: δένδρον σαπρόν
  choice: ചീഞ്ഞ വൃക്ഷം
  rationale: σαπρός എന്നതിന്റെ ചീഞ്ഞതോ അഴുകിയതോ ആയ അവസ്ഥയെ നേരിട്ടും ദൃശ്യമായും അവതരിപ്പിക്കുന്നു; വെറും ‘ചീത്ത വൃക്ഷം’ എന്നതിനെക്കാൾ ഉറവിടപദത്തിന്റെ പ്രത്യേകത സംരക്ഷിക്കുന്നു.
- source_word: καρποὺς καλούς
  choice: നല്ല ഫലം
  rationale: καλός ഇവിടെ ഫലത്തിന്റെ നല്ല ഗുണനിലവാരം സൂചിപ്പിക്കുന്നു; ‘നല്ല ഫലം’ എന്നത് വ്യക്തവും സ്വാഭാവികവും എതിർസമാന്തരത നിലനിർത്തുന്നതുമാണ്.
theological_decisions:
- issue: രൂപകത്തിലെ അസാധ്യതയുടെ സ്വഭാവം
  choice: ‘കഴിയില്ല’ എന്ന സമ്പൂർണ കഴിവില്ലായ്മയായി വിവർത്തനം ചെയ്തു.
  alternative: ‘സാധാരണയായി കായ്ക്കാറില്ല’ അല്ലെങ്കിൽ ‘കായ്ക്കരുത്’.
  rationale: ഗ്രീക്കിലെ οὐ δύναται വ്യക്തമായി അസാധ്യതയാണ് പ്രസ്താവിക്കുന്നത്; സാധ്യതക്കുറവായോ ധാർമിക നിർദേശമായോ അതിനെ മൃദൂകരിക്കാതെ വാക്യത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മരം’ എന്ന സാധാരണ പദത്തിനു പകരം തിരുവെഴുത്തിലെ ദൃശ്യരൂപകത്തിന് യോജിക്കുന്ന ‘വൃക്ഷം’ ഉപയോഗിച്ചു. ποιεῖν എന്ന ക്രിയയെ അക്ഷരാർഥത്തിൽ ‘ഉണ്ടാക്കുക’ എന്നു നൽകാതെ ഫലം സംബന്ധിച്ച സ്വാഭാവിക മലയാളപ്രയോഗമായ ‘കായ്ക്കുക’ എന്നു നൽകി. ഉറവിടത്തിലെ പദാർഥം പ്രധാനവാചകത്തിൽ മതിയായ വ്യക്തതയോടെ പ്രതിഫലിക്കുന്നതിനാൽ അടിക്കുറിപ്പുകൾ ചേർത്തിട്ടില്ല.
