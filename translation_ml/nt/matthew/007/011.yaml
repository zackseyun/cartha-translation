id: MAT.7.11
reference: Matthew 7:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ οὖν ὑμεῖς πονηροὶ ὄντες οἴδατε δόματα ἀγαθὰ διδόναι τοῖς τέκνοις ὑμῶν, πόσῳ μᾶλλον ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς δώσει ἀγαθὰ τοῖς αἰτοῦσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/011.yaml
  text: If you[a], then, being evil, know how to give good gifts to your children[b], how much more will your Father in the heavens give good things to those who ask him.
translation:
  language: ml
  text: അതിനാൽ, ദുഷ്ടരായിരിക്കെ നിങ്ങൾ നിങ്ങളുടെ മക്കൾക്ക് നല്ല സമ്മാനങ്ങൾ കൊടുക്കാൻ അറിയുന്നുവെങ്കിൽ, സ്വർഗങ്ങളിൽ ഉള്ള നിങ്ങളുടെ പിതാവ്[a] തന്നോടു ചോദിക്കുന്നവർക്ക് നല്ല കാര്യങ്ങൾ[b] എത്രയധികം നൽകും!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പരമ്പരാഗതമായി: “സ്വർഗത്തിലുള്ള നിങ്ങളുടെ പിതാവ്.” ഗ്രീക്കിൽ “സ്വർഗങ്ങളിൽ” എന്ന ബഹുവചനമാണ്.'
    reason: lexical_alternative
  - marker: b
    text: ചില പരിഭാഷകൾ രണ്ടാം ഉപവാക്യത്തിലും “നല്ല സമ്മാനങ്ങൾ നൽകും” എന്നു പറയുന്നു; എന്നാൽ ഗ്രീക്കിൽ അവിടെ “നല്ലവ” എന്നു മാത്രമാണുള്ളത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηροὶ ὄντες
  choice: ദുഷ്ടരായിരിക്കെ
  rationale: ഗ്രീക്കിലെ വിവരണാത്മകവും സന്ദർഭത്തിൽ വിട്ടുവീഴ്ചാസൂചകവുമായ കൃതന്തപ്രയോഗം നിലനിർത്തുന്നു. മനുഷ്യരുടെ ദുഷ്ടതയെ മയപ്പെടുത്താതെയും അതിൽ പാഠത്തിന് അതീതമായ സിദ്ധാന്തവികാസം ചേർക്കാതെയും അവതരിപ്പിക്കുന്നു.
- source_word: οἴδατε ... διδόναι
  choice: കൊടുക്കാൻ അറിയുന്നുവെങ്കിൽ
  rationale: പൂരകമായ അനന്തരൂപത്തോടുകൂടിയ οἴδατε പ്രായോഗികമായി എന്തെങ്കിലും ചെയ്യാൻ അറിയുക എന്ന അർഥം നൽകുന്നു; മലയാളത്തിൽ ഈ പ്രയോഗം സ്വാഭാവികമാണ്.
- source_word: δόματα ἀγαθὰ
  choice: നല്ല സമ്മാനങ്ങൾ
  rationale: δόματα എന്ന നാമത്തെ ‘സമ്മാനങ്ങൾ’ എന്നും അതിനെ വിശേഷിപ്പിക്കുന്ന ἀγαθὰയെ ‘നല്ല’ എന്നും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: τοῖς τέκνοις ὑμῶν
  choice: നിങ്ങളുടെ മക്കൾക്ക്
  rationale: τέκνα ലിംഗഭേദമില്ലാതെ കുട്ടികളെ സൂചിപ്പിക്കുന്നു; ‘മക്കൾ’ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: πόσῳ μᾶλλον
  choice: എത്രയധികമായി
  rationale: ചെറുതിൽനിന്ന് വലുതിലേക്കുള്ള താരതമ്യയുക്തിയെ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς
  choice: സ്വർഗങ്ങളിൽ ഉള്ള നിങ്ങളുടെ പിതാവ്
  rationale: ‘പിതാവ്’ എന്ന നാമവും അതിനെ വിശേഷിപ്പിക്കുന്ന സ്ഥാനസൂചകവാക്യവും വേർതിരിച്ചുനിർത്തുകയും οὐρανοῖς എന്ന ബഹുവചനത്തെ ‘സ്വർഗങ്ങളിൽ’ എന്നു സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: δώσει ἀγαθὰ
  choice: നല്ലവ ... നൽകും
  rationale: രണ്ടാം ഉപവാക്യത്തിൽ δόματα ആവർത്തിക്കുന്നില്ല; നാമവൽക്കരിച്ച ἀγαθὰയെ ‘നല്ലവ’ എന്നു പരിഭാഷപ്പെടുത്തി ‘സമ്മാനങ്ങൾ’ അനാവശ്യമായി ചേർക്കുന്നത് ഒഴിവാക്കുന്നു.
- source_word: τοῖς αἰτοῦσιν αὐτόν
  choice: തന്നോടു ചോദിക്കുന്നവർക്ക്
  rationale: വർത്തമാനകാല കൃതന്തത്തിന്റെ പൊതുവായ, തുടരുന്ന സ്വഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; αὐτόν എന്നതിന്റെ സൂചന പിതാവിലേക്കുതന്നെയാണെന്ന് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ‘ദുഷ്ടരായിരിക്കെ’ എന്ന മനുഷ്യസ്വഭാവവിവരണത്തിന്റെ ശക്തി
  choice: നേരിട്ടുള്ള ‘ദുഷ്ടരായിരിക്കെ’ എന്ന പ്രയോഗം നിലനിർത്തി.
  alternative: ‘പാപികളായിരിക്കെ’ അല്ലെങ്കിൽ ‘കുറവുകളുള്ളവരായിട്ടും’
  rationale: വാക്യം മനുഷ്യരുടെ ദുഷ്ടതയും പിതാവിന്റെ അത്യുന്നത നന്മയും തമ്മിലുള്ള സംഘർഷം നിലനിർത്തുന്നു. അതിനെ മയപ്പെടുത്തുകയോ സമ്പൂർണമായ ഒരു മാനവശാസ്ത്രസിദ്ധാന്തമായി വികസിപ്പിക്കുകയോ ചെയ്യുന്നില്ല.
- issue: ὁ ἐν τοῖς οὐρανοῖς എന്ന പ്രയോഗം
  choice: ‘സ്വർഗങ്ങളിൽ ഉള്ള നിങ്ങളുടെ പിതാവ്’ എന്നു സ്ഥാനസൂചകമായും ബഹുവചനമായും പരിഭാഷപ്പെടുത്തി.
  alternative: ‘സ്വർഗസ്ഥനായ നിങ്ങളുടെ പിതാവ്’ അല്ലെങ്കിൽ ‘സ്വർഗത്തിലുള്ള നിങ്ങളുടെ പിതാവ്’
  rationale: പരമ്പരാഗത ഏകവചനമോ വിശേഷണരൂപമോ സ്വീകരിക്കാതെ ഗ്രീക്ക് മൂലത്തിന്റെ ഘടനയും ബഹുവചനവും സുതാര്യമായി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. വാക്യത്തിന്റെ താരതമ്യഘടനയും ഊന്നലും നിലനിർത്തി. അടിക്കുറിപ്പുസൂചകങ്ങൾ അവ വിശദീകരിക്കുന്ന ‘സ്വർഗങ്ങളിൽ’ എന്ന പ്രയോഗത്തിന്റെയും രണ്ടാം ഉപവാക്യത്തിലെ ‘നല്ലവ’ എന്ന പ്രയോഗത്തിന്റെയും പിന്നാലെ വാക്യാവസാനത്ത് ചേർത്തിരിക്കുന്നു.
