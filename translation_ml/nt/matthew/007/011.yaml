  terminology: “മക്കൾ,” “പിതാവ്,” “സ്വർഗങ്ങളിൽ,” and “ദുഷ്ടരായിരിക്കെ” are suitable in a modern standard, respectful biblical register. “നല്ല കാര്യങ്ങൾ” preserves the semantic distinction from “നല്ല സമ്മാനങ്ങൾ.”
