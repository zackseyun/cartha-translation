id: MAT.7.13
reference: Matthew 7:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εἰσέλθατε διὰ τῆς στενῆς πύλης· ὅτι πλατεῖα ⸂ἡ πύλη⸃ καὶ εὐρύχωρος ἡ ὁδὸς ἡ ἀπάγουσα εἰς τὴν ἀπώλειαν, καὶ πολλοί εἰσιν οἱ εἰσερχόμενοι δι’ αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/013.yaml
  text: Enter through the narrow gate[a]. For wide is the gate and broad is the road that leads to destruction[c][b], and many are those who enter through it.
translation:
  language: ml
  text: ഇടുങ്ങിയ കവാടത്തിലൂടെ പ്രവേശിക്കുക. എന്തെന്നാൽ കവാടം വീതിയുള്ളതും നാശത്തിലേക്കു[b] നയിക്കുന്ന വഴി വിശാലവുമാണ്[a]. അതിലൂടെ പ്രവേശിക്കുന്നവർ അനേകരാണ്[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വിസ്താരമുള്ള വഴി’ എന്നും പരിഭാഷപ്പെടുത്താം. εὐρύχωρος എന്ന ഗ്രീക്ക് പദത്തിന് ‘വിശാലമായത്,’ ‘വിസ്താരമുള്ളത്’ എന്നീ അർഥങ്ങളുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: ‘തകർച്ചയിലേക്ക്’ അല്ലെങ്കിൽ ‘വിനാശത്തിലേക്ക്’ എന്നും പരിഭാഷപ്പെടുത്താം. ἀπώλεια എന്ന ഗ്രീക്ക് പദം നാശം, തകർച്ച, വിനാശം എന്നിവ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: ‘അതിലൂടെ’ എന്നത് ഗ്രീക്കിൽ ‘കവാടത്തെ’ അല്ലെങ്കിൽ ‘വഴിയെ’ സൂചിപ്പിക്കാം; സന്ദർഭത്തിൽ ‘കവാടത്തിലൂടെ’ എന്ന അർഥത്തിനാണ് കൂടുതൽ സാധ്യത.
    reason: referential_ambiguity
lexical_decisions:
- source_word: Εἰσέλθατε
  choice: പ്രവേശിക്കുക
  rationale: രണ്ടാം പുരുഷ ബഹുവചന ആജ്ഞയുടെ നേരിട്ടുള്ള ബലം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: διὰ τῆς στενῆς πύλης
  choice: ഇടുങ്ങിയ കവാടത്തിലൂടെ
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന ‘അകത്തേക്കു കടന്നുപോകുന്ന’ ചലനം ‘-ലൂടെ’ വ്യക്തമാക്കുന്നു; στενός എന്ന സ്ഥലപരമായ അർഥത്തിന് ‘ഇടുങ്ങിയ’ സ്വാഭാവികമായ വിരുദ്ധജോടി സൃഷ്ടിക്കുന്നു.
- source_word: πλατεῖα ἡ πύλη
  choice: കവാടം വിശാലമാണ്
  rationale: πλατύς എന്നതിന്റെ വീതിയേറിയതെന്ന അർഥം നിലനിർത്തി മലയാളത്തിൽ സ്വാഭാവികമായ വിധേയക്രമം ഉപയോഗിക്കുന്നു.
- source_word: εὐρύχωρος ἡ ὁδός
  choice: വഴി വിസ്താരമുള്ളതുമാണ്
  rationale: εὐρύχωρος സൂചിപ്പിക്കുന്ന വിശാലമായ, ഇടമുള്ള സ്വഭാവം ‘വിസ്താരമുള്ള’ എന്നു നൽകുന്നു; ‘വഴി’ യാത്രാരൂപകം നിലനിർത്തുന്നു.
- source_word: ἡ ἀπάγουσα εἰς τὴν ἀπώλειαν
  choice: നാശത്തിലേക്കു നയിക്കുന്ന
  rationale: വർത്തമാന കൃദന്തരൂപത്തിന്റെ തുടർച്ചയായ ദിശാസൂചന ‘നയിക്കുന്ന’ എന്നും ἀπώλεια എന്നതിന്റെ ഗൗരവം അധികമായി നിർവചിക്കാതെ ‘നാശം’ എന്നും നൽകുന്നു.
- source_word: πολλοί εἰσιν οἱ εἰσερχόμενοι δι’ αὐτῆς
  choice: അതിലൂടെ പ്രവേശിക്കുന്നവർ അനേകരാണ്
  rationale: ‘അനേകർ’ എന്ന ഊന്നൽ നിലനിർത്തുന്നു. αὐτῆς എന്ന സ്ത്രീലിംഗ സർവനാമത്തെ ‘അതിലൂടെ’ എന്നു നൽകുന്നത് മൂലത്തിലെ പരാമർശസാധ്യത അനാവശ്യമായി തീർപ്പാക്കുന്നില്ല.
theological_decisions:
- issue: ἀπώλεια എന്ന പദം സൂചിപ്പിക്കുന്ന അന്ത്യം
  choice: നാശം
  alternative: തകർച്ച; വിനാശം
  rationale: വാക്യം ഭയാനകമായ അന്ത്യം മുന്നറിയിപ്പായി നൽകുന്നുവെങ്കിലും അതിന്റെ സമ്പൂർണ ദൈവശാസ്ത്രസ്വഭാവം വിശദീകരിക്കുന്നില്ല. ‘നാശം’ ഗൗരവം നിലനിർത്തുകയും അതിരുകടന്ന് നിർവചിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: δι’ αὐτῆς എന്നതിന്റെ മുൻപദം
  choice: അതിലൂടെ
  alternative: ആ കവാടത്തിലൂടെ; ആ വഴിയിലൂടെ
  rationale: πύλη (‘കവാടം’), ὁδός (‘വഴി’) എന്നീ രണ്ടും ഗ്രീക്കിൽ സ്ത്രീലിംഗമായതിനാൽ സർവനാമം വ്യാകരണപരമായി രണ്ടിലേക്കും ചേരാം. കവാടത്തിലൂടെ ‘പ്രവേശിക്കുക’ എന്ന ആശയം ശക്തമാണെങ്കിലും വിവർത്തനം ഈ സാധ്യതയെ മൗനമായി അടച്ചുപൂട്ടുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പ്രവേശിക്കുക’ നേരിട്ടുള്ള ആജ്ഞയായി വായിക്കപ്പെടുന്നു; അത്യന്തം പുരാതനമായ ആജ്ഞാരൂപങ്ങൾ ഒഴിവാക്കി. കവാടം–വഴി, ഇടുങ്ങിയത്–വിശാലമായത് എന്നീ ദൃശ്യവിരുദ്ധങ്ങൾ വ്യക്തമായി നിലനിർത്തി.
