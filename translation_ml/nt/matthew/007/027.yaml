  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ κατέβη ἡ βροχὴ καὶ ἦλθον οἱ ποταμοὶ καὶ ἔπνευσαν οἱ ἄνεμοι καὶ προσέκοψαν τῇ οἰκίᾳ ἐκείνῃ, καὶ ἔπεσεν, καὶ ἦν ἡ πτῶσις αὐτῆς μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/027.yaml
  text: And the rain came down[a], and the rivers came, and the winds blew and beat against that house, and it fell—and its fall was great.
translation:
  language: ml
  text: മഴ പെയ്തിറങ്ങി, നദികൾ[a] ഇരച്ചുവന്നു, കാറ്റുകൾ വീശി ആ വീടിന്മേൽ ആഞ്ഞടിച്ചു; അത് വീണു, അതിന്റെ വീഴ്ച വലിയതായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പ്രളയജലങ്ങൾ.” ഗ്രീക്ക് നാമത്തിന്റെ അക്ഷരാർഥം “നദികൾ” എന്നാണ്; എന്നാൽ ഈ സന്ദർഭത്തിൽ അത് പ്രളയമായി കുതിച്ചെത്തുന്ന വെള്ളത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη ἡ βροχή
  choice: മഴ പെയ്തിറങ്ങി
  rationale: καταβαίνω സൂചിപ്പിക്കുന്ന താഴേക്കുള്ള ചലനം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; വെറും ‘മഴ പെയ്തു’ എന്നതിനെക്കാൾ മൂലപദത്തോട് അടുത്തതാണ്.
- source_word: ἦλθον οἱ ποταμοί
  choice: നദികൾ ഇരച്ചുവന്നു
  rationale: ποταμοί എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘നദികൾ’ നിലനിർത്തുന്നു; കൊടുങ്കാറ്റിന്റെ പശ്ചാത്തലത്തിലുള്ള ജലത്തിന്റെ ശക്തമായ വരവ് ‘ഇരച്ചുവന്നു’ എന്ന സ്വാഭാവിക പ്രയോഗം വ്യക്തമാക്കുന്നു. ‘പ്രളയജലങ്ങൾ’ എന്ന സന്ദർഭോചിത സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: ἔπνευσαν οἱ ἄνεμοι
  choice: കാറ്റുകൾ വീശി
  rationale: ക്രിയയുടെയും നാമത്തിന്റെയും നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ മലയാള പരിഭാഷ.
- source_word: προσέκοψαν τῇ οἰκίᾳ ἐκείνῃ
  choice: ആ വീടിന്മേൽ ആഞ്ഞടിച്ചു
  rationale: ഈ കൊടുങ്കാറ്റിന്റെ സന്ദർഭത്തിൽ προσκόπτω എന്നത് ഇടിച്ചുതട്ടുക എന്ന അർഥത്തിലാണ്; ‘ആഞ്ഞടിച്ചു’ ആവർത്തിച്ചുള്ള ശക്തമായ ആഘാതം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἔπεσεν
  choice: അത് വീണു
  rationale: πίπτω എന്ന ലളിതമായ മൂലക്രിയ നിലനിർത്തുന്നു; ‘തകർന്നു’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക പദം ഒഴിവാക്കുന്നു.
- source_word: ἡ πτῶσις αὐτῆς μεγάλη
  choice: അതിന്റെ വീഴ്ച വലിയതായിരുന്നു
  rationale: ἔπεσεν/πτῶσις എന്ന പദബന്ധത്തിലെ ‘വീഴുക/വീഴ്ച’ ആവർത്തനം നിലനിർത്തുകയും മൂലത്തിലെ ലളിതവും ശക്തവുമായ സമാപനം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ഉപമയുടെ അവസാനത്തിലെ ന്യായവിധിസൂചനയുടെ തീവ്രത
  choice: ‘അതിന്റെ വീഴ്ച വലിയതായിരുന്നു’ എന്നു മാത്രം പരിഭാഷപ്പെടുത്തി
  alternative: ‘അതിന്റെ തകർച്ച വിനാശകരമായിരുന്നു’
  rationale: ഗ്രീക്ക് വാചകം വീടിന്റെ വീഴ്ചയുടെ വലിപ്പം മാത്രമാണ് നേരിട്ട് പറയുന്നത്. വ്യക്തമായ അന്ത്യന്യായവിധി ഭാഷയോ ‘വിനാശകരം’ പോലുള്ള വ്യാഖ്യാനാത്മക ശക്തിപ്പെടുത്തലോ ചേർക്കാതെ മുന്നറിയിപ്പിന്റെ ഗൗരവം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവമുള്ള ശൈലി. മൂലത്തിലെ തുടർച്ചയായ സംഭവക്രമം അർധവിരാമങ്ങളിലൂടെ സൂക്ഷിച്ചു; അവസാന ഫലത്തിന് ഊന്നൽ നൽകാൻ അവസാന വാക്യം വേർതിരിച്ചു.
