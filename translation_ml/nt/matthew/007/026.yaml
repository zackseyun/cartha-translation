id: MAT.7.26
reference: Matthew 7:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ πᾶς ὁ ἀκούων μου τοὺς λόγους τούτους καὶ μὴ ποιῶν αὐτοὺς ὁμοιωθήσεται ἀνδρὶ μωρῷ, ὅστις ᾠκοδόμησεν ⸂αὐτοῦ τὴν οἰκίαν⸃ ἐπὶ τὴν ἄμμον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/026.yaml
  text: And everyone who hears these words of mine and does not do them will be like a foolish man[a], who built his house on the sand.
translation:
  language: ml
  text: എന്റെ ഈ വാക്കുകൾ കേൾക്കുകയും അവ പ്രാവർത്തികമാക്കാതിരിക്കുകയും ചെയ്യുന്ന ഏവനും മണലിന്മേൽ തന്റെ വീട് പണിത ഒരു മൂഢനായ മനുഷ്യനോടു സദൃശനാകും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മൂഢനായ ഒരാളോട്.” ഗ്രീക്കിൽ “മൂഢനായ ഒരു മനുഷ്യനോട്” എന്നാണ്; ഈ താരതമ്യത്തിൽ പുരുഷലിംഗരൂപം പ്രതിനിധാനപരമായി ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ ἀκούων
  choice: കേൾക്കുന്ന ഏവനും
  rationale: വർത്തമാനകാല കൃദന്തരൂപം പൊതുവായും നാമസദൃശമായും ഉപയോഗിച്ചിരിക്കുന്നു. ‘കേൾക്കുന്ന ഏവനും’ എന്നത് അതിന്റെ സാർവത്രികത സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: μου τοὺς λόγους τούτους
  choice: എന്റെ ഈ വാക്കുകൾ
  rationale: മൂലത്തിലെ ഉടമസ്ഥബന്ധവും ‘ഈ’ എന്ന സൂചനയുടെ ഊന്നലും സ്വാഭാവികമായ മലയാള പദക്രമത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: μὴ ποιῶν αὐτούς
  choice: അവ അനുസരിക്കാത്ത
  rationale: ഇവിടെ ποιέω എന്നത് കേട്ട വാക്കുകൾ പ്രാവർത്തികമാക്കുക എന്ന അർഥത്തിലാണ്. പദാനുപദമായ ‘അവ ചെയ്യാത്ത’ എന്നതിനെക്കാൾ ‘അവ അനുസരിക്കാത്ത’ സാധാരണ മലയാളത്തിൽ വ്യക്തവും സന്ദർഭോചിതവുമാണ്.
- source_word: ὁμοιωθήσεται
  choice: സദൃശനാകും
  rationale: ഭാവികാല കർമണിപ്രയോഗത്തിലുള്ള താരതമ്യത്തെ dignified, സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; ‘ഉപമിക്കപ്പെടും’ എന്നതിനെക്കാൾ വായനാസൗകര്യമുണ്ട്.
- source_word: ἀνδρὶ μωρῷ
  choice: മൂഢനായ ഒരു മനുഷ്യനോട്
  rationale: ἀνήρ എന്ന പുല്ലിംഗ ഏകവചനവും μωρός എന്ന ‘മൂഢൻ/വിവേകമില്ലാത്തവൻ’ എന്ന അർഥവും നിലനിർത്തുന്നു. താരതമ്യം പൊതുവായി ബാധകമാണെങ്കിലും മൂലത്തിലെ പുരുഷസൂചന മായ്ച്ചിട്ടില്ല.
- source_word: ᾠκοδόμησεν
  choice: പണിത
  rationale: വീടുനിർമാണത്തെ സൂചിപ്പിക്കുന്ന സാധാരണവും കൃത്യവുമായ മലയാള ക്രിയയാണ്.
- source_word: αὐτοῦ τὴν οἰκίαν
  choice: തന്റെ വീട്
  rationale: കർത്താവിലേക്കു തിരിച്ചുപോകുന്ന ഉടമസ്ഥസൂചന മലയാളത്തിൽ ‘തന്റെ’ എന്നു സ്വാഭാവികമായി നൽകുന്നു; οἰκία ഇവിടെ ഭൗതിക കെട്ടിടമാണ്.
- source_word: ἐπὶ τὴν ἄμμον
  choice: മണലിന്മേൽ
  rationale: വീടിന്റെ അസ്ഥിരമായ അടിത്തറയായ സ്ഥാനം വ്യക്തമായി പകരുന്നു.
theological_decisions:
- issue: താരതമ്യത്തിലെ പുരുഷലിംഗ പ്രതിനിധാനഭാഷ
  choice: മൂഢനായ ഒരു മനുഷ്യൻ
  alternative: മൂഢനായ ഒരാൾ
  rationale: ഗ്രീക്കിലെ ἀνήρ വ്യക്തമായി പുരുഷലിംഗ നാമമാണ്. പ്രയോഗത്തിന്റെ പൊതുബാധകത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കിക്കൊണ്ട് മുഖ്യവാചകത്തിൽ മൂലത്തിലെ ലിംഗസൂചന നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അനുസരിക്കാത്ത’ എന്ന പ്രയോഗം കേട്ട വാക്കുകൾ പ്രവർത്തിയിൽ കൊണ്ടുവരാത്തതെന്ന സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു. മുഖ്യവാചകത്തിലെ [a] അടയാളം ബന്ധപ്പെട്ട അടിക്കുറിപ്പിനോടു പൊരുത്തപ്പെടുന്നു.
