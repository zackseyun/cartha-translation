id: MAT.7.24
reference: Matthew 7:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Πᾶς οὖν ὅστις ἀκούει μου τοὺς λόγους τούτους καὶ ποιεῖ αὐτούς, ⸀ὁμοιωθήσεται ἀνδρὶ φρονίμῳ, ὅστις ᾠκοδόμησεν ⸂αὐτοῦ τὴν οἰκίαν⸃ ἐπὶ τὴν πέτραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/024.yaml
  text: Therefore everyone who hears these words of mine and does them will be like a wise man who built his house on the rock[a][b].
translation:
  language: ml
  text: അതുകൊണ്ട്, എന്റെ ഈ വാക്കുകൾ കേൾക്കുകയും അവ പ്രാവർത്തികമാക്കുകയും ചെയ്യുന്ന ഏവനും പാറമേൽ തന്റെ വീട് പണിത വിവേകിയായ ഒരു പുരുഷനോട് ഉപമിക്കപ്പെടും[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സദൃശനായിരിക്കും’ അല്ലെങ്കിൽ ‘സദൃശനാക്കപ്പെടും.’
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ ‘വിവേകിയായ ഒരു പുരുഷൻ’; മൂലപാഠത്തിലെ താരതമ്യം വ്യാകരണപരമായി പുല്ലിംഗത്തിലാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: Πᾶς οὖν ὅστις
  choice: അതുകൊണ്ട് ... ഏവനും
  rationale: οὖν മുൻപറഞ്ഞ ഉപദേശത്തിൽനിന്നുള്ള നിഗമനബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ ‘അതുകൊണ്ട്’ എന്നു നൽകി. Πᾶς ... ὅστις എന്ന പ്രയോഗത്തിന്റെ പൊതുവായ വിതരണാർഥം ‘ഏവനും’ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἀκούει μου τοὺς λόγους τούτους
  choice: എന്റെ ഈ വാക്കുകൾ കേൾക്കുകയും
  rationale: λόγους എന്നതിന്റെ നേരായ അർഥമായ ‘വാക്കുകൾ’ നിലനിർത്തുന്നു; μου എന്ന ഉടമസ്ഥബന്ധം ‘എന്റെ’ എന്നു വ്യക്തമായി നൽകുന്നു.
- source_word: καὶ ποιεῖ αὐτούς
  choice: അവ പ്രാവർത്തികമാക്കുകയും ചെയ്യുന്ന
  rationale: ഇവിടെ ποιεῖ എന്നത് കേട്ട വാക്കുകൾ അനുഷ്ഠിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘അവ പ്രാവർത്തികമാക്കുന്നു’ എന്നത് αὐτούς എന്ന ബഹുവചന സൂചന നിലനിർത്തിക്കൊണ്ട് ആ ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὁμοιωθήσεται
  choice: ഉപമിക്കപ്പെടും
  rationale: ഭാവികാല കർമണിപ്രയോഗത്തെ നേരിട്ട് നിലനിർത്തുകയും താരതമ്യത്തിന്റെ സ്വഭാവം അനാവശ്യമായി വിശദീകരിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀνδρὶ φρονίμῳ
  choice: വിവേകിയായ ഒരു മനുഷ്യനോട്
  rationale: ἀνήρ ഇവിടെ പുരുഷനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘മനുഷ്യൻ’ എന്ന മലയാളപദം ‘ഒരു’ എന്നതിനോടും [b] അടിക്കുറിപ്പിനോടും ചേർത്ത് പുരുഷസൂചന വ്യക്തമാക്കുന്നു. φρόνιμος എന്നതിന് ഈ സാഹചര്യത്തിൽ ‘വിവേകിയായ’ എന്നത് ജ്ഞാനപൂർവമായ പ്രായോഗിക തീരുമാനത്തെ നന്നായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ᾠκοδόμησεν αὐτοῦ τὴν οἰκίαν
  choice: തന്റെ വീട് പണിത
  rationale: നിർമാണരൂപകം നേരിട്ട് നിലനിർത്തുന്നു; αὐτοῦ എന്നത് ബന്ധവാക്യത്തിലെ കർത്താവിലേക്കു മടങ്ങുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ ‘തന്റെ’ ഉപയോഗിച്ചു.
- source_word: ἐπὶ τὴν πέτραν
  choice: പാറമേൽ
  rationale: πέτραയുടെ പാറയെന്ന ദൃഢമായ അടിസ്ഥാനചിത്രം അധികവ്യാഖ്യാനം കൂടാതെ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: താരതമ്യത്തിലെ ലിംഗസൂചക പ്രതിനിധിഭാഷ
  choice: വിവേകിയായ ഒരു മനുഷ്യൻ; പുരുഷസൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി
  alternative: വിവേകിയായ ഒരാൾ
  rationale: ἀνδρί പ്രത്യേകമായി പുരുഷനെ സൂചിപ്പിക്കുന്നു; അതിനാൽ പൂർണമായി ലിംഗനിരപേക്ഷമാക്കാതെ മൂലപാഠത്തിന്റെ വ്യാകരണപരമായ പുരുഷസൂചന സംരക്ഷിച്ചു. അതേസമയം വാക്യാരംഭത്തിലെ ‘ഏവനും’ പ്രസ്താവനയുടെ പൊതുവ്യാപ്തി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘പ്രാവർത്തികമാക്കുക’ എന്നത് കേൾക്കുന്നതും ചെയ്യുന്നതും തമ്മിലുള്ള പ്രായോഗിക വൈരുധ്യം വ്യക്തമാക്കുന്നു; ‘ഉപമിക്കപ്പെടും’ മൂലത്തിലെ കർമണിരൂപവും താരതമ്യത്തിലെ തുറന്ന അർഥവും സംരക്ഷിക്കുന്നു.
