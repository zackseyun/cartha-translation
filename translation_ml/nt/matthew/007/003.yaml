  terminology: 'Use ‘വലിയ മരത്തടി’ for δοκός: it clearly conveys a substantial piece of timber while avoiding the misleading modern sense of ‘ഉത്തരം.’ Retain ‘സഹോദരന്റെ’ to represent the source’s masculine singular ἀδελφοῦ.'
