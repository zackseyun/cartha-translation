  to: എന്നാൽ നിന്റെ സഹോദരന്റെ കണ്ണിലെ കരട്[a] നീ കാണുന്നു, സ്വന്തം കണ്ണിലെ വലിയ മരത്തടി[b] ശ്രദ്ധിക്കുന്നില്ല—എന്തുകൊണ്ട്?
