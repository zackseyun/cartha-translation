id: MAT.7.3
reference: Matthew 7:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τί δὲ βλέπεις τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου, τὴν δὲ ἐν τῷ σῷ ὀφθαλμῷ δοκὸν οὐ κατανοεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/003.yaml
  text: But why do you see the speck in your brother’s eye[c][b][a], yet do not notice the beam in your own eye?
translation:
  language: ml
  text: എന്നാൽ നിന്റെ സഹോദരന്റെ കണ്ണിലെ കരട്[a] നീ കാണുന്നു, സ്വന്തം കണ്ണിലെ വലിയ മരത്തടി[b] ശ്രദ്ധിക്കുന്നില്ല—എന്തുകൊണ്ട്?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കരട്’ (κάρφος) എന്നതിന് ‘ചെറിയ ചീള്,’ ‘വൈക്കോൽത്തുണ്ട്,’ അല്ലെങ്കിൽ ‘പതിർക്കണം’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: ‘വലിയ മരത്തടി’ (δοκός) എന്നതിന് ‘തുലാത്തടി’ അല്ലെങ്കിൽ ‘കെട്ടിടത്തടി’ എന്നും പറയാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί
  choice: എന്തുകൊണ്ട്
  rationale: βλέπεις എന്ന ക്രിയയോടുകൂടിയ ഈ ചോദ്യത്തിൽ τί അക്ഷരാർഥമായ ‘എന്ത്’ എന്നതിലുപരി കാരണത്തെ ചോദിക്കുന്ന ‘എന്തുകൊണ്ട്’ എന്ന അർഥത്തിലാണ്.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ ഉപദേശത്തിൽനിന്നുള്ള നേരിയ വൈരുധ്യവും തുടർച്ചയും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: βλέπεις
  choice: കാണുകയും
  rationale: കണ്ണിനെ ആസ്പദമാക്കിയ ദൃശ്യരൂപകം നിലനിർത്തുകയും κατανοεῖς എന്നതിൽനിന്നുള്ള ക്രിയാഭേദം കാക്കുകയും ചെയ്യുന്നു.
- source_word: κάρφος
  choice: കരട്
  rationale: കണ്ണിൽ വീഴാവുന്ന ചെറിയ ഉണങ്ങിയ കണം, വൈക്കോൽത്തുണ്ട്, അല്ലെങ്കിൽ ചീള് എന്ന ആശയം മലയാളത്തിൽ ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു; വസ്തു അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: ἀδελφοῦ
  choice: സഹോദരന്റെ
  rationale: മൂലപാഠത്തിലെ ഏകവചന പുല്ലിംഗ ബന്ധപദം അതേപടി നിലനിർത്തുന്നു.
- source_word: σῷ
  choice: സ്വന്തം
  rationale: സഹോദരന്റെ കണ്ണും അഭിസംബോധിതന്റെ കണ്ണും തമ്മിലുള്ള ഊന്നിയ വൈരുധ്യം വ്യക്തമാക്കുന്നു.
- source_word: δοκόν
  choice: ഉത്തരം
  rationale: കെട്ടിടനിർമാണത്തിൽ ഉപയോഗിക്കുന്ന വലിയ മരത്തടിയായ δοκός എന്നതിന്റെ പരമ്പരാഗതവും കൃത്യവുമായ മലയാള പദം; കരടുമായുള്ള അതിശയോക്തിപരമായ വൈരുധ്യം നിലനിർത്തുന്നു.
- source_word: οὐ κατανοεῖς
  choice: ശ്രദ്ധിക്കാതിരിക്കുകയും
  rationale: κατανοέωയിലെ ശ്രദ്ധിച്ചു ഗ്രഹിക്കുക, തിരിച്ചറിയുക എന്ന ഭാവം നൽകുന്നു; βλέπεις എന്ന ‘കാണുക’യിൽനിന്നുള്ള വാഗ്‌വൈരുധ്യവും സംരക്ഷിക്കുന്നു.
- source_word: ὀφθαλμῷ
  choice: കണ്ണിലുള്ള
  rationale: ദൃശ്യരൂപകത്തിലെ ശരീരാവയവത്തെ നേരിട്ട്, സ്വാഭാവികമായി വിവർത്തനം ചെയ്യുന്നു.
theological_decisions:
- issue: ἀδελφοῦ എന്ന ലിംഗസൂചക ബന്ധപദം
  choice: സഹോദരന്റെ
  alternative: സഹോദരന്റെയോ സഹോദരിയുടെയോ; കൂട്ടുവിശ്വാസിയുടെ
  rationale: വാക്യത്തിന്റെ പ്രയോഗം വിപുലമാണെങ്കിലും ഗ്രീക്ക് പാഠം ഏകവചന പുല്ലിംഗമാണ്; അതിനെ ലിംഗനിരപേക്ഷമാക്കി മാറ്റാതെ മൂലരൂപം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ചോദ്യരൂപം. ‘കരട്—ഉത്തരം’ എന്ന അളവിലെ അതിശയോക്തിപരമായ വൈരുധ്യവും ‘കാണുക—ശ്രദ്ധിക്കുക’ എന്ന ക്രിയാഭേദവും നിലനിർത്തി.
