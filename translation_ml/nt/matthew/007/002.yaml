id: MAT.7.2
reference: Matthew 7:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν ᾧ γὰρ κρίματι κρίνετε κριθήσεσθε, καὶ ἐν ᾧ μέτρῳ μετρεῖτε μετρηθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/002.yaml
  text: For with the judgment by which you judge[a], you will be judged, and with the measure by which you measure, it will be measured to you.
translation:
  language: ml
  text: കാരണം, നിങ്ങൾ ഏതു വിധിയാൽ വിധിക്കുന്നുവോ, അതേ വിധിയാൽ നിങ്ങളും വിധിക്കപ്പെടും; നിങ്ങൾ ഏതു അളവുകൊണ്ട് അളക്കുന്നുവോ, അതേ അളവുകൊണ്ട് നിങ്ങൾക്കും അളന്നുകിട്ടും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “അതേ അളവുകൊണ്ട് നിങ്ങൾക്ക് തിരികെ അളന്നുകിട്ടും.” ‘തിരികെ’ എന്ന പദം ഗ്രീക്കിൽ നേരിട്ട് ഇല്ലെങ്കിലും പരസ്പരപ്രതിഫലത്തിന്റെ ആശയം സൂചിപ്പിക്കപ്പെടുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίματι / κρίνετε / κριθήσεσθε
  choice: വിധിയാൽ / വിധിക്കുന്നുവോ / വിധിക്കപ്പെടും
  rationale: ഗ്രീക്കിലെ ഒരേ പദകുടുംബത്തിന്റെ ആവർത്തനവും വിധിക്കൽ എന്ന പൊതുവായ അർഥവും നിലനിർത്തുന്നു; ‘കുറ്റം വിധിക്കുക’ എന്ന ഇടുങ്ങിയ അർഥം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: μέτρῳ / μετρεῖτε / μετρηθήσεται
  choice: അളവുകൊണ്ട് / അളക്കുന്നുവോ / അളന്നുതരപ്പെടും
  rationale: നാമവും ക്രിയയും തമ്മിലുള്ള പദപ്രയോഗബന്ധവും പഴഞ്ചൊല്ലിന്റെ സമാന്തരഘടനയും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: μετρηθήσεται ὑμῖν
  choice: നിങ്ങൾക്കും അളന്നുതരപ്പെടും
  rationale: ദാതൃവിഭക്തിയുടെ അർഥം സ്വാഭാവികമായി നൽകുകയും കർത്താവിനെ വ്യക്തമാക്കാതെ ഗ്രീക്കിലെ കർമണിപ്രയോഗം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐν ᾧ ... ἐν ᾧ
  choice: ഏതു ...-ആൽ / ഏതു ...കൊണ്ട്
  rationale: ഉപകരണം അല്ലെങ്കിൽ മാനദണ്ഡം സൂചിപ്പിക്കുന്ന ആവർത്തിത ഘടന മലയാളത്തിലെ സ്വാഭാവിക ബന്ധവാക്യരീതിയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ നിരോധനത്തിന് ഈ വാക്യം നൽകുന്ന വിശദീകരണബന്ധം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: പ്രതിഫലവിധിയുടെ കർത്താവ്
  choice: ആരാണ് വിധിക്കുന്നതെന്നും അളന്നുതരുന്നതെന്നും വ്യക്തമാക്കാതെ കർമണിപ്രയോഗം നിലനിർത്തി.
  alternative: ദൈവം അതേ മാനദണ്ഡത്തിൽ നിങ്ങളെ വിധിക്കും; അല്ലെങ്കിൽ മറ്റുള്ളവർ അതേ രീതിയിൽ നിങ്ങളോട് പെരുമാറും.
  rationale: ഗ്രീക്ക് വാക്യം കർത്താവിനെ പറയുന്നില്ല. അതിനാൽ ദൈവികവിധിയിലേക്കോ മനുഷ്യരുടെ പരസ്പരപ്രതികരണത്തിലേക്കോ മാത്രം അർഥം ചുരുക്കാതെ യഥാർഥ വ്യാഖ്യാനതുറപ്പ് സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘അതേ വിധിയാൽ’, ‘അതുകൊണ്ടുതന്നെ’ എന്നിവ മൂലത്തിലെ പ്രതിഫലസമാന്തരത വ്യക്തമാക്കുന്നു; കർത്താവ് പറയാത്ത കർമണിപ്രയോഗം സംരക്ഷിച്ചിരിക്കുന്നു.
