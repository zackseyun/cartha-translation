id: MAT.7.20
reference: Matthew 7:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἄρα γε ἀπὸ τῶν καρπῶν αὐτῶν ἐπιγνώσεσθε αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/020.yaml
  text: So then[a], you will recognize them by their fruits.
translation:
  language: ml
  text: അതുകൊണ്ട്[a], അവരുടെ ഫലങ്ങളാൽ നിങ്ങൾ അവരെ തിരിച്ചറിയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ആകയാൽത്തന്നെ, അവരുടെ ഫലങ്ങളിൽനിന്ന് നിങ്ങൾ അവരെ അറിയും.’
    reason: ἄρα γε എന്നതിലെ നേരിയ ഊന്നലും ἀπὸ എന്നതിന്റെ ‘-ൽനിന്ന്’ എന്ന കൂടുതൽ പദാനുപദ രൂപവും ἐπιγνώσεσθε എന്നതിന്റെ ‘അറിയും’ എന്ന സാധ്യതയും കാണിക്കുന്ന പകരം പരിഭാഷ.
lexical_decisions:
- source_word: ἄρα γε
  choice: അതുകൊണ്ട്
  rationale: ഈ പദസമുച്ചയം മുൻവാക്യങ്ങളിൽനിന്നുള്ള നിഗമനത്തെ നേരിയ ഊന്നലോടെ അവതരിപ്പിക്കുന്നു. ‘അതുകൊണ്ട്’ ആ നിഗമനസ്വഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀπὸ
  choice: -ആൽ (ഫലങ്ങളാൽ)
  rationale: ἐπιγινώσκω എന്ന ക്രിയയോടൊപ്പം ഇവിടെ തിരിച്ചറിയലിന്റെ അടിസ്ഥാനമോ മാർഗമോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഫലങ്ങളാൽ’ എന്നത് സ്വാഭാവികമാണ്.
- source_word: καρπῶν
  choice: ഫലങ്ങൾ
  rationale: ഗ്രീക്കിലെ ബഹുവചനം നിലനിർത്തുകയും പ്രവൃത്തികളെയോ പ്രകടമായ പരിണതഫലങ്ങളെയോ സൂചിപ്പിക്കുന്ന രൂപകം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: αὐτῶν
  choice: അവരുടെ
  rationale: സംബന്ധിക സർവനാമം ‘ഫലങ്ങൾ’ എന്നതിനെ വിശേഷിപ്പിക്കുന്നതിനാൽ ‘അവരുടെ’ എന്ന സ്വാഭാവിക രൂപം ഉപയോഗിച്ചു.
- source_word: ἐπιγνώσεσθε
  choice: നിങ്ങൾ തിരിച്ചറിയും
  rationale: ഭാവികാല ദ്വിതീയപുരുഷ ബഹുവചനമായ ഈ ക്രിയ സന്ദർഭത്തിൽ കാണാവുന്ന തെളിവുകളുടെ അടിസ്ഥാനത്തിൽ ആളുകൾ ആരെന്ന് തിരിച്ചറിയുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: αὐτούς
  choice: അവരെ
  rationale: സന്ദർഭത്തിൽ മുമ്പ് പരാമർശിച്ച ആളുകളെ സൂചിപ്പിക്കുന്ന കർമസർവനാമത്തിന്റെ നേരിട്ടുള്ള സ്വാഭാവിക പരിഭാഷയാണിത്.
theological_decisions:
- issue: ആളുകളെ വിലയിരുത്തുന്നതിൽ ‘ഫലങ്ങൾ’ എന്ന രൂപകത്തിന്റെ പ്രയോഗം
  choice: ‘ഫലങ്ങൾ’ എന്ന രൂപകം അതേപടി നിലനിർത്തി.
  alternative: അവരുടെ പ്രവൃത്തികൾ; അവരുടെ പരിണതഫലങ്ങൾ
  rationale: വാക്യം കാണാവുന്ന ഫലങ്ങളുടെ അടിസ്ഥാനത്തിലുള്ള വിവേചനത്തെ പഠിപ്പിക്കുന്നുവെങ്കിലും, മൂലപാഠം ഫലത്തിന്റെ രൂപകമാണ് ഉപയോഗിക്കുന്നത്. അത് നിലനിർത്തുന്നത് സമീപസന്ദർഭവുമായുള്ള ബന്ധം സംരക്ഷിക്കുകയും അർഥത്തെ ഒരു പ്രത്യേക വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ഫലങ്ങൾ’ എന്ന പരിചിതമായ ബൈബിൾ രൂപകം ബഹുവചനത്തിൽ സംരക്ഷിച്ചിട്ടുണ്ട്; മുഖ്യപാഠം അനാവശ്യമായി ഔപചാരികമാക്കിയിട്ടില്ല.
