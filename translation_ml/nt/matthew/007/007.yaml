id: MAT.7.7
reference: Matthew 7:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Αἰτεῖτε, καὶ δοθήσεται ὑμῖν· ζητεῖτε, καὶ εὑρήσετε· κρούετε, καὶ ἀνοιγήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/007.yaml
  text: Ask[a], and it will be given to you; seek, and you will find; knock, and it will be opened to you.
translation:
  language: ml
  text: “ചോദിക്കുവിൻ[a], നിങ്ങൾക്കു നൽകപ്പെടും; അന്വേഷിക്കുവിൻ, നിങ്ങൾ കണ്ടെത്തും; മുട്ടുവിൻ, നിങ്ങൾക്കു തുറക്കപ്പെടും.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഗ്രീക്കിലെ വർത്തമാനകാല ആജ്ഞാരൂപങ്ങൾ തുടർച്ചയുടെ ഭാവത്തിലും മനസ്സിലാക്കാം: “ചോദിച്ചുകൊണ്ടിരിക്കുവിൻ ... അന്വേഷിച്ചുകൊണ്ടിരിക്കുവിൻ ... മുട്ടിക്കൊണ്ടിരിക്കുവിൻ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Αἰτεῖτε
  choice: ചോദിക്കുവിൻ
  rationale: വർത്തമാനകാല സജീവ ആജ്ഞാരൂപവും ബഹുവചന അഭിസംബോധനയും സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു. തുടർച്ചയുടെ ഭാവം മുഖ്യവാചകത്തിൽ അധികമായി വ്യക്തമാക്കാതെ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: δοθήσεται
  choice: നൽകപ്പെടും
  rationale: ഭാവികാല കർമണിപ്രയോഗം നിലനിർത്തുകയും നൽകുന്നവൻ ആരെന്ന് ഗ്രീക്കുപോലെ വ്യക്തമാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ὑμῖν
  choice: നിങ്ങൾക്കു / നിങ്ങൾക്കായി
  rationale: രണ്ടാംപുരുഷ ബഹുവചന ദാതൃബന്ധം ആദ്യഘട്ടത്തിൽ ‘നിങ്ങൾക്കു’ എന്നും അവസാനഘട്ടത്തിൽ സ്വാഭാവിക മലയാളത്തിനായി ‘നിങ്ങൾക്കായി’ എന്നും പ്രകടമാക്കുന്നു.
- source_word: ζητεῖτε
  choice: അന്വേഷിക്കുവിൻ
  rationale: ആജ്ഞയുടെ ശക്തിയും ‘തേടുക/അന്വേഷിക്കുക’ എന്ന വിശാലമായ അർഥപരിധിയും മാന്യമായ ആധുനിക ഭാഷയിൽ പകരുന്നു.
- source_word: εὑρήσετε
  choice: നിങ്ങൾ കണ്ടെത്തും
  rationale: ഭാവികാല സജീവരൂപവും കർത്താവായ ബഹുവചന ‘നിങ്ങൾ’ എന്നതും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: κρούετε
  choice: മുട്ടുവിൻ
  rationale: വാതിലിൽ മുട്ടുക എന്ന സന്ദർഭസഹജമായ അർഥം സംക്ഷിപ്തമായ ആജ്ഞാരൂപത്തിൽ നൽകുന്നു.
- source_word: ἀνοιγήσεται
  choice: തുറക്കപ്പെടും
  rationale: ഗ്രീക്കിലെ ഭാവികാല കർമണിപ്രയോഗം സംരക്ഷിക്കുന്നു; ‘തുറക്കും’ എന്നു പറഞ്ഞ് കർത്താവിനെയോ അകർമകതയെയോ അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: καὶ
  choice: — (മലയാളത്തിലെ സമാന്തര വാക്യഘടനയും അർധവിരാമവും)
  rationale: ഗ്രീക്കിലെ ആവർത്തിത ബന്ധവും താളവും മലയാളത്തിൽ മൂന്ന് സമാന്തര ഘടകങ്ങളിലൂടെയും അർധവിരാമങ്ങളിലൂടെയും സ്വാഭാവികമായി പ്രകടമാകുന്നു; ‘അപ്പോൾ’ എന്ന ഫലസൂചന കൂട്ടിച്ചേർക്കുന്നില്ല.
theological_decisions:
- issue: മൂന്ന് വർത്തമാനകാല ആജ്ഞാരൂപങ്ങളുടെ ക്രിയാഭാവം
  choice: മുഖ്യവാചകത്തിൽ ലളിതമായ ആജ്ഞകളായി ‘ചോദിക്കുവിൻ, അന്വേഷിക്കുവിൻ, മുട്ടുവിൻ’ എന്നു നൽകുന്നു.
  alternative: ‘ചോദിച്ചുകൊണ്ടിരിക്കുവിൻ ... അന്വേഷിച്ചുകൊണ്ടിരിക്കുവിൻ ... മുട്ടിക്കൊണ്ടിരിക്കുവിൻ’ എന്ന് തുടർച്ച വ്യക്തമായി പ്രകടിപ്പിക്കുക.
  rationale: ഗ്രീക്ക് വർത്തമാനകാല ആജ്ഞാരൂപങ്ങൾക്ക് തുടരുന്ന പ്രവർത്തിയുടെ ഭാവം ഉണ്ടാകാമെങ്കിലും, നിർബന്ധമായും ആവർത്തനം വിശദീകരിക്കുന്ന വിപുലീകരണം മുഖ്യവാചകത്തിൽ ചേർക്കേണ്ടതില്ല. അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: ഭാവികാല കർമണിപ്രയോഗങ്ങളിൽ പ്രവർത്തകൻ
  choice: ‘നൽകപ്പെടും’, ‘തുറക്കപ്പെടും’ എന്നിങ്ങനെ പ്രവർത്തകനെ പറയാതെ കർമണിപ്രയോഗം നിലനിർത്തുന്നു.
  alternative: ‘ദൈവം നിങ്ങൾക്കു നൽകും/തുറന്നുതരും’ എന്ന് പ്രവർത്തകനെ വ്യക്തമാക്കുക.
  rationale: സന്ദർഭത്തിൽ ദൈവം സൂചിതനായിരിക്കാമെങ്കിലും ഗ്രീക്ക് വാചകം പ്രവർത്തകനെ നേരിട്ട് പറയുന്നില്ല; അതിനാൽ മുഖ്യവാചകവും ആ ദൈവശാസ്ത്രപരമായ സൂചനയെ വ്യാഖ്യാനിച്ച് നിറയ്ക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായും വായിക്കാവുന്നതുമായ തിരുവെഴുത്തുശൈലി. ബഹുവചന ആജ്ഞകൾക്കായി ‘-വിൻ’ രൂപം ഉപയോഗിച്ചു; മൂലത്തിലെ സമാന്തര താളവും കർമണിപ്രയോഗവും സംരക്ഷിച്ചു.
