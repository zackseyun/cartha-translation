  text: Μὴ κρίνετε, ἵνα μὴ κριθῆτε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/001.yaml
  text: Do not judge[a], so that you may not be judged.
translation:
  language: ml
  text: നിങ്ങൾ വിധിക്കപ്പെടാതിരിക്കാൻ വിധിക്കരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘ശിക്ഷ വിധിക്കരുത്; അങ്ങനെ നിങ്ങളും ശിക്ഷിക്കപ്പെടാതിരിക്കാൻ.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് ചില സന്ദർഭങ്ങളിൽ ശിക്ഷ വിധിക്കുക എന്ന അർഥമുണ്ടാകാം; എന്നാൽ ‘വിധിക്കുക’ എന്നത് കൂടുതൽ വിശാലമാണ്, കൂടാതെ വാക്യത്തിലെ പദാവർത്തനം നിലനിർത്തുകയും ചെയ്യുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ κρίνετε
  choice: വിധിക്കരുത്
  rationale: μή ചേർന്ന വർത്തമാനകാല ആജ്ഞാരൂപം ഒരു നിരോധനമാണ്. κρίνω എന്നതിന്റെ വിശാലമായ അർഥപരിധിയും സംക്ഷിപ്തമായ ആജ്ഞാശൈലിയും ‘വിധിക്കരുത്’ നിലനിർത്തുന്നു.
- source_word: ἵνα μὴ
  choice: അങ്ങനെ ... -ാതിരിക്കട്ടെ
  rationale: ἵναയും നിഷേധവും ചേർന്നുള്ള ഉദ്ദേശ്യ/ഫലബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ഇവിടെ ഉദ്ദേശ്യവും ഫലവും തമ്മിലുള്ള സാദ്ധ്യമായ അർഥവ്യാപ്തി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: κριθῆτε
  choice: നിങ്ങളും വിധിക്കപ്പെടാതിരിക്കട്ടെ
  rationale: κρίνω എന്ന അതേ ധാതുവിന്റെ കർമണിപ്രയോഗം ‘വിധിക്കപ്പെടുക’ എന്ന് നൽകി വാക്യത്തിലെ പദാവർത്തനവും വാചകസമതുലിതത്വവും സംരക്ഷിക്കുന്നു. സന്ദർഭത്തിൽ സൂചിതമായ പരസ്പരബന്ധം സ്വാഭാവികമാക്കാൻ ‘നിങ്ങളും’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: യേശുവിന്റെ നിരോധനത്തിലെ κρίνω എന്ന ക്രിയയുടെ വ്യാപ്തി
  choice: ‘കുറ്റം വിധിക്കുക’ എന്ന ഇടുങ്ങിയ അർഥത്തിലേക്ക് ചുരുക്കാതെ വിശാലമായ ‘വിധിക്കുക’ നിലനിർത്തി.
  alternative: കുറ്റം വിധിക്കരുത്; അങ്ങനെ നിങ്ങളും കുറ്റം വിധിക്കപ്പെടാതിരിക്കട്ടെ.
  rationale: ഈ വാക്യം മാത്രം ധാർമിക വിലയിരുത്തലിന്റെ എല്ലാ അതിരുകളും വ്യക്തമാക്കുന്നില്ല; 7:2–5-ലെ സമീപസന്ദർഭമാണ് നിരോധനത്തിന്റെ സ്വഭാവം കൂടുതൽ വിശദീകരിക്കുന്നത്. അതിനാൽ വിവർത്തനം ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആജ്ഞാശൈലി. ‘ന്യായം വിധിക്കുക’ എന്ന ഭാരമുള്ള പ്രയോഗത്തിനുപകരം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ ‘വിധിക്കുക’ തെരഞ്ഞെടുത്തു.
