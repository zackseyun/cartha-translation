revisions:
- from: വിധിക്കരുത്[a]; അങ്ങനെ നിങ്ങളും വിധിക്കപ്പെടാതിരിക്കട്ടെ.
  to: നിങ്ങൾ വിധിക്കപ്പെടാതിരിക്കാൻ വിധിക്കരുത്.[a]
  rationale: The revision retains the source’s broad terminology and repeated judgment word-group, while replacing the unnatural jussive passive with the standard Malayalam purpose construction “...ാതിരിക്കാൻ,” which accurately represents ἵνα μὴ κριθῆτε. The footnote is adjusted only for Malayalam idiom and continues to identify condemnation as a contextual lexical alternative rather than the main-text meaning.
