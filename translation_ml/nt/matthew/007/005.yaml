id: MAT.7.5
reference: Matthew 7:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὑποκριτά, ἔκβαλε πρῶτον ⸂ἐκ τοῦ ὀφθαλμοῦ σοῦ τὴν δοκόν⸃, καὶ τότε διαβλέψεις ἐκβαλεῖν τὸ κάρφος ἐκ τοῦ ὀφθαλμοῦ τοῦ ἀδελφοῦ σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/005.yaml
  text: Hypocrite[a], first remove the beam from your eye[b], and then you will see clearly to remove the speck from your brother’s eye.
translation:
  language: ml
  text: കപടക്കാരാ, ആദ്യം നിന്റെ കണ്ണിൽനിന്ന് മരത്തടി[a] എടുത്തുകളയുക; അപ്പോൾ നിന്റെ സഹോദരന്റെ കണ്ണിൽനിന്ന് ചെറിയ ചീള്[b] എടുത്തുകളയാൻ നിനക്കു വ്യക്തമായി കാണാനാകും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മരത്തടി’ എന്നതിന് ‘തുലാമരം’ അല്ലെങ്കിൽ ‘കഴുക്കോൽ’ എന്നും പരിഭാഷപ്പെടുത്താം (δοκός).
    reason: lexical_alternative
  - marker: b
    text: ‘ചെറിയ ചീള്’ എന്നതിന് ‘ഉണങ്ങിയ വൈക്കോൽക്കഷണം’ എന്നും പരിഭാഷപ്പെടുത്താം (κάρφος).
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποκριτά
  choice: കപടക്കാരാ
  rationale: ഏകവചന സംബോധനയായുള്ള രൂക്ഷമായ ശാസനയാണ്. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ വിധത്തിൽ കപടതയെ സൂചിപ്പിക്കുന്നു; പദത്തിൽ ഇല്ലാത്ത മതപരമായ അർഥം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: ἔκβαλε / ἐκβαλεῖν
  choice: എടുത്തുകളയുക / എടുത്തുകളയാൻ
  rationale: കണ്ണിലുള്ള തടസ്സം നീക്കുന്നതെന്ന ദൃശ്യരൂപത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളം; ഒരേ ഗ്രീക്ക് ക്രിയയുടെ ആവർത്തനം മലയാളത്തിലും നിലനിർത്തുന്നു.
- source_word: πρῶτον
  choice: ആദ്യം
  rationale: പ്രവൃത്തികളുടെ മുൻഗണനയും ക്രമവും നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: δοκόν
  choice: മരത്തടി
  rationale: വലിയ നിർമാണത്തടിയെയോ തുലാമരത്തെയോ സൂചിപ്പിക്കുന്ന പദമാണ്; ചെറിയ κάρφος-നോടുള്ള അതിശയോക്തിപരമായ വൈരുധ്യം നിലനിർത്തുന്നു.
- source_word: ὀφθαλμοῦ
  choice: കണ്ണ്
  rationale: ശാരീരിക ദൃശ്യരൂപത്തിലെ സാധാരണവും കൃത്യവുമായ മലയാളപദം.
- source_word: διαβλέψεις
  choice: നീ വ്യക്തമായി കാണും
  rationale: സാധാരണ ‘കാണുക’ എന്നതിനെക്കാൾ വ്യക്തമായ കാഴ്ച എന്ന സംയുക്തക്രിയയുടെ ഊന്നൽ സംരക്ഷിക്കുന്നു; ഭാവികാലരൂപവും നിലനിർത്തുന്നു.
- source_word: κάρφος
  choice: കരട്
  rationale: കണ്ണിൽ വീഴാവുന്ന ചെറിയ കണം എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും വലിയ മരത്തടിയോടുള്ള വൈരുധ്യം നിലനിർത്തുകയും ചെയ്യുന്നു; ചീള് അല്ലെങ്കിൽ ഉണങ്ങിയ വൈക്കോൽക്കഷണം എന്ന ഭൗതികസൂചനയും സാദ്ധ്യമാണ്.
- source_word: ἀδελφοῦ
  choice: സഹോദരന്റെ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ഏകവചന ബന്ധപദത്തെ നേരിട്ട് നിലനിർത്തുന്നു; ‘മറ്റൊരാൾ’ എന്നാക്കി പൊതുവത്കരിച്ച് ബന്ധപരമായ ഭാഷ മായ്ച്ചുകളയുന്നില്ല.
theological_decisions:
- issue: ἀδελφοῦ എന്ന ലിംഗസൂചക ബന്ധപദം
  choice: സഹോദരന്റെ
  alternative: സഹവിശ്വാസിയുടെ / മറ്റൊരാളുടെ
  rationale: ഗ്രീക്ക് പദം പുല്ലിംഗ ഏകവചനമാണ്. ‘സഹോദരൻ’ എന്നത് മൂലത്തിലെ ബന്ധഭാഷയും സമൂഹപരമായ പശ്ചാത്തലവും സംരക്ഷിക്കുന്നു; ‘സഹവിശ്വാസി’ എന്നു പരിഭാഷപ്പെടുത്തി അർഥപരിധി അനാവശ്യമായി ഉറപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ നേരിട്ടുള്ളതും ഗൗരവമുള്ളതുമായ ശൈലി. സംബോധനയുടെ രൂക്ഷതയും മരത്തടിയും ചെറിയ കരടും തമ്മിലുള്ള ഉദ്ദേശ്യപൂർവമായ അതിശയോക്തിയും സംരക്ഷിച്ചിട്ടുണ്ട്. വായനാസൗകര്യത്തിനായി ഗ്രീക്കിലെ ഏകവാക്യം മലയാളത്തിൽ രണ്ട് വാക്യങ്ങളാക്കി; ആശയക്രമം മാറ്റിയിട്ടില്ല.
