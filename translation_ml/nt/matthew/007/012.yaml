review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the comprehensive scope, the desired action by other people, and the established formula “the Law and the Prophets.” However, οὕτως (“in the same way”) is only implicit in “അവർക്കും,” and γάρ (“for/because”) is not represented. Both connections should be explicit in an optimal-equivalence rendering.
  naturalness: The Malayalam is clear and modern. “അതുപോലെ” makes the reciprocal comparison unambiguous and natural, while “കാരണം” restores the explanatory connection in an idiomatic way.
  terminology: “ന്യായപ്രമാണവും പ്രവാചകന്മാരും” appropriately preserves the conventional scriptural-summary formula. “മറ്റുള്ളവർ” is a natural, gender-inclusive contextual rendering of οἱ ἄνθρωποι.
  issues:
  - severity: medium
    issue: οὕτως is not explicit in the reciprocal command.
    rationale: “നിങ്ങൾ അവർക്കും ചെയ്യുക” can mean simply “you also do [something] for them”; adding “അതുപോലെ” clearly represents “in the same way.”
  - severity: low
    issue: The explanatory γάρ is omitted.
    rationale: “ഇതുതന്നെയാണ്” supplies emphasis but does not convey the causal/explanatory relation of γάρ. “കാരണം” preserves that relation.
  revised_text: അതുകൊണ്ട്, മറ്റുള്ളവർ നിങ്ങൾക്കു ചെയ്യണമെന്നു നിങ്ങൾ ആഗ്രഹിക്കുന്നതെല്ലാം നിങ്ങൾ അവർക്കും അതുപോലെ ചെയ്യുക; കാരണം, ഇതാണ് ന്യായപ്രമാണവും പ്രവാചകന്മാരും.
