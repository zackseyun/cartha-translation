id: MAT.7.12
reference: Matthew 7:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Πάντα οὖν ὅσα ⸀ἐὰν θέλητε ἵνα ποιῶσιν ὑμῖν οἱ ἄνθρωποι, οὕτως καὶ ὑμεῖς ποιεῖτε αὐτοῖς· οὗτος γάρ ἐστιν ὁ νόμος καὶ οἱ προφῆται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/012.yaml
  text: Therefore[a], in everything, whatever you want people to do for you, do the same for them; for this is the Law and the Prophets.
translation:
  language: ml
  text: അതുകൊണ്ട്, മറ്റുള്ളവർ നിങ്ങൾക്കു ചെയ്യണമെന്നു നിങ്ങൾ ആഗ്രഹിക്കുന്നതെല്ലാം നിങ്ങൾ അവർക്കും അതുപോലെ ചെയ്യുക; കാരണം, ഇതാണ് ന്യായപ്രമാണവും പ്രവാചകന്മാരും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάντα ... ὅσα
  choice: എല്ലാം
  rationale: അക്കുസറ്റീവ് നപുംസകലിംഗ ബഹുവചനവും ആപേക്ഷികപ്രയോഗവും ചേർന്ന് സമഗ്രമായ വ്യാപ്തി നൽകുന്നു; മലയാളത്തിലെ ‘ആഗ്രഹിക്കുന്നതെല്ലാം’ അത് സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻപത്തെ ഉപദേശത്തിൽനിന്നുള്ള നിഗമനബന്ധം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: ὅσα ἐὰν θέλητε
  choice: നിങ്ങൾ ആഗ്രഹിക്കുന്നതെല്ലാം
  rationale: ἐὰν സഹിതമുള്ള ആപേക്ഷികഘടനയുടെ അനിർദ്ദിഷ്ടവും പൊതുവുമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἵνα ποιῶσιν ὑμῖν οἱ ἄνθρωποι
  choice: മറ്റുള്ളവർ നിങ്ങൾക്കു ചെയ്യണമെന്ന്
  rationale: ἄνθρωποι ഇവിടെ പുരുഷന്മാരെ മാത്രം അല്ല, പൊതുവായി മറ്റു മനുഷ്യരെ സൂചിപ്പിക്കുന്നു; θέλητε-യോടു ബന്ധപ്പെട്ട ἵνα ഉപവാക്യത്തിന്റെ അഭിലഷിതപ്രവൃത്തി മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: οὕτως καὶ ὑμεῖς ποιεῖτε αὐτοῖς
  choice: നിങ്ങൾ അവർക്കും ചെയ്യുക
  rationale: വർത്തമാനകാല ആജ്ഞയുടെ തുടർച്ചയായ പെരുമാറ്റാഹ്വാനവും οὕτως καὶ എന്ന പരസ്പരസാദൃശ്യവും ‘അവർക്കും’ എന്ന പ്രയോഗത്തിലൂടെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: οὗτος γάρ ἐστιν
  choice: ഇതുതന്നെയാണ്
  rationale: γάρ നൽകുന്ന വിശദീകരണബന്ധവും οὗτος എന്നതിന്റെ ഊന്നലും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ὁ νόμος καὶ οἱ προφῆται
  choice: ന്യായപ്രമാണവും പ്രവാചകന്മാരും
  rationale: യഹൂദ തിരുവെഴുത്തുകളെ സംഗ്രഹിച്ച് സൂചിപ്പിക്കുന്ന സ്ഥാപിതമായ സൂത്രവാക്യം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἄνθρωποι എന്ന പൊതുലിംഗപ്രയോഗം
  choice: മറ്റുള്ളവർ
  alternative: മനുഷ്യർ / പുരുഷന്മാർ
  rationale: സന്ദർഭത്തിൽ ഇത് പുരുഷന്മാർക്ക് മാത്രമായ നിർദ്ദേശമല്ല; മനുഷ്യബന്ധങ്ങളെക്കുറിച്ചുള്ള സർവസാധാരണ തത്ത്വമാണ്. ‘മറ്റുള്ളവർ’ മലയാളത്തിൽ ലിംഗനിരപേക്ഷവും സന്ദർഭോചിതവുമാണ്.
- issue: ‘ന്യായപ്രമാണവും പ്രവാചകന്മാരും’ എന്നതിന്റെ വ്യാപ്തി
  choice: തിരുവെഴുത്തുകളെ സൂചിപ്പിക്കുന്ന സൂത്രവാക്യമായി അതേപടി നിലനിർത്തി
  alternative: തിരുവെഴുത്തുകളുടെ മുഴുവൻ ധാർമ്മിക ഉപദേശം / ന്യായപ്രമാണത്തിന്റെയും പ്രവാചകോപദേശത്തിന്റെയും സാരം
  rationale: ഗ്രീക്ക് പാഠം സ്ഥാപിതമായ മത്തായിയൻ-യഹൂദ പ്രയോഗം തന്നെയാണ് ഉപയോഗിക്കുന്നത്. മുഖ്യവാചകത്തിൽ അതിന്റെ അർഥം വിശദീകരിച്ച് ചുരുക്കുന്നത് അന്തർപാഠബന്ധവും ദൈവശാസ്ത്രപരമായ പ്രതിധ്വനിയും അനാവശ്യമായി ഒതുക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘ന്യായപ്രമാണം’ എന്ന പരിചിത തിരുവെഴുത്തുപദം സൂത്രവാക്യത്തിന്റെ മതഗ്രന്ഥപരമായ സ്വഭാവം കാത്തുസൂക്ഷിക്കുന്നു; അനാവശ്യമായ പാദക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
