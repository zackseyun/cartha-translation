- from: അവരുടെ ഫലങ്ങളാൽ നിങ്ങൾ അവരെ തിരിച്ചറിയും.[a] മുൾച്ചെടികളിൽനിന്ന് മുന്തിരിക്കുലകളോ ഞെരിഞ്ഞിലുകളിൽനിന്ന് അത്തിപ്പഴങ്ങളോ ശേഖരിക്കാറുണ്ടോ?[b]
  to: അവരുടെ ഫലങ്ങളാൽ നിങ്ങൾ അവരെ തിരിച്ചറിയും.[a] മുൾച്ചെടികളിൽ നിന്ന് മുന്തിരിക്കുലകളോ, ഞെരിഞ്ഞിൽച്ചെടികളിൽ നിന്ന് അത്തിപ്പഴങ്ങളോ ശേഖരിക്കാറുണ്ടോ?[b]
  rationale: തിരുത്തൽ അർഥപരമല്ല; ആധുനിക മലയാളത്തിലെ വ്യക്തതയും ഒഴുക്കും മെച്ചപ്പെടുത്തുന്നതാണ്. ‘ഞെരിഞ്ഞിൽച്ചെടികൾ’ τρίβολος-ന്റെ സസ്യസൂചന വ്യക്തമാക്കുന്നു; മറ്റു മുഖ്യരൂപകങ്ങളും സർവനാമപരാമർശവും അതേപടി നിലനിർത്തിയിരിക്കുന്നു.
