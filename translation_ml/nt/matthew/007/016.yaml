id: MAT.7.16
reference: Matthew 7:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπὸ τῶν καρπῶν αὐτῶν ἐπιγνώσεσθε αὐτούς. μήτι συλλέγουσιν ἀπὸ ἀκανθῶν ⸀σταφυλὰς ἢ ἀπὸ τριβόλων σῦκα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/016.yaml
  text: You will recognize them by their fruits[a]. Do people gather grapes from thorns[b], or figs from thistles?
translation:
  language: ml
  text: അവരുടെ ഫലങ്ങളാൽ നിങ്ങൾ അവരെ തിരിച്ചറിയും.[a] മുൾച്ചെടികളിൽ നിന്ന് മുന്തിരിക്കുലകളോ, ഞെരിഞ്ഞിൽച്ചെടികളിൽ നിന്ന് അത്തിപ്പഴങ്ങളോ ശേഖരിക്കാറുണ്ടോ?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവരുടെ ഫലങ്ങളാൽ നിങ്ങൾ അവരെ അറിയും.’
    reason: ἐπιγνώσεσθε എന്ന പദത്തിന് ഇവിടെ ‘തിരിച്ചറിയും’ എന്നും ‘അറിയും’ എന്നും അർഥമാക്കാം.
  - marker: b
    text: 'ഈ ചോദ്യം നിഷേധാത്മകമായ ഉത്തരം പ്രതീക്ഷിക്കുന്നു: മുൾച്ചെടികളിൽ നിന്ന് മുന്തിരിക്കുലകളോ ഞെരിഞ്ഞിൽച്ചെടികളിൽ നിന്ന് അത്തിപ്പഴങ്ങളോ ആരും ശേഖരിക്കാറില്ല.'
    reason: μήτι അവതരിപ്പിക്കുന്ന അലങ്കാരചോദ്യത്തിന്റെ പ്രതീക്ഷിത ഉത്തരം വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: καρπῶν
  choice: ഫലങ്ങളാൽ
  rationale: ഗ്രീക്കിലെ ബഹുവചനം നിലനിർത്തുകയും വ്യക്തികളുടെ ജീവിതത്തിൽ കാണാവുന്ന പ്രവൃത്തികളെയും പരിണതഫലങ്ങളെയും സൂചിപ്പിക്കുന്ന കാർഷികരൂപകം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐπιγνώσεσθε
  choice: തിരിച്ചറിയും
  rationale: നിരീക്ഷിക്കാവുന്ന തെളിവിലൂടെ ഒരാളെ തിരിച്ചറിയുക എന്ന സന്ദർഭാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; ‘പൂർണമായി അറിയും’ എന്ന അതിവിവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: μήτι
  choice: '... ഉണ്ടോ?'
  rationale: നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്ന ഗ്രീക്ക് അലങ്കാരചോദ്യത്തെ മലയാളത്തിലെ സ്വാഭാവിക ചോദ്യരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: συλλέγουσιν
  choice: ശേഖരിക്കാറുണ്ടോ
  rationale: വിളവെടുക്കുന്ന കാർഷികദൃശ്യം നിലനിർത്തുന്നതിനൊപ്പം പൊതുവായ പതിവിനെക്കുറിച്ചുള്ള ചോദ്യമാണെന്ന വർത്തമാനകാലഭാവം വ്യക്തമാക്കുന്നു.
- source_word: ἀκανθῶν
  choice: മുൾച്ചെടികളിൽനിന്ന്
  rationale: മുള്ളുകളുള്ള സസ്യങ്ങളെയും മുൾപ്പടർപ്പുകളെയും സൂചിപ്പിക്കാവുന്ന പദത്തിന്റെ സസ്യപരമായ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: σταφυλάς
  choice: മുന്തിരിക്കുലകളോ
  rationale: σταφυλή മുന്തിരിക്കുല/മുന്തിരിപ്പഴക്കുലയെ സൂചിപ്പിക്കുന്നു; ഏകപദമായ ‘മുന്തിരി’ക്കാൾ മൂലഭാഷയിലെ കാർഷികചിത്രം കൃത്യമായി നൽകുന്നു.
- source_word: τριβόλων
  choice: ഞെരിഞ്ഞിലുകളിൽനിന്ന്
  rationale: τρίβολος സൂചിപ്പിക്കുന്ന മുള്ളുള്ള കളച്ചെടിക്ക് മലയാളത്തിൽ പരിചിതമായ സസ്യനാമം ഉപയോഗിക്കുന്നു; ആദ്യത്തെ മുൾച്ചെടിയിൽനിന്നുള്ള വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: σῦκα
  choice: അത്തിപ്പഴങ്ങളോ
  rationale: അത്തിപ്പഴം എന്ന സാധാരണ മലയാളപദം ഗ്രീക്കിലെ ബഹുവചനവസ്തുവിനെ സ്വാഭാവികമായി പ്രതിനിധീകരിക്കുന്നു.
- source_word: αὐτῶν / αὐτούς
  choice: അവരുടെ / അവരെ
  rationale: സന്ദർഭത്തിലെ വ്യക്തികളിലേക്കുള്ള സർവനാമപരാമർശം വ്യക്തിപരമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: വ്യക്തികളെ വിവേചിച്ചറിയുന്നതിലെ ‘ഫലങ്ങൾ’ എന്ന രൂപകം
  choice: ‘ഫലങ്ങൾ’ എന്ന കാർഷികരൂപകം അതേപടി നിലനിർത്തി.
  alternative: ‘പ്രവൃത്തികൾ’ അല്ലെങ്കിൽ ‘അവർ ഉളവാക്കുന്ന പരിണതഫലങ്ങൾ’ എന്ന് വ്യാഖ്യാനിച്ച് നൽകുക.
  rationale: വാക്യം ഫലം എന്ന ദൃശ്യരൂപകത്തിലൂടെ ജീവിതത്തിലെ കാണാവുന്ന തെളിവിനെ സൂചിപ്പിക്കുന്നു. അതിനെ ഒരു പ്രത്യേക വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതെ രൂപകവും അതിന്റെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തിയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ഫലങ്ങൾ’ എന്ന ബൈബിൾപരമായി സുപരിചിതമായ രൂപകം സംരക്ഷിച്ചു; അപൂർവമെങ്കിലും കൃത്യമായ ‘ഞെരിഞ്ഞിൽ’ സന്ദർഭംകൊണ്ട് എളുപ്പം മനസ്സിലാകുന്ന വിധത്തിൽ ഉപയോഗിച്ചു.
