id: MAT.7.8
reference: Matthew 7:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πᾶς γὰρ ὁ αἰτῶν λαμβάνει καὶ ὁ ζητῶν εὑρίσκει καὶ τῷ κρούοντι ⸀ἀνοιγήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/008.yaml
  text: For everyone who asks receives[a], and the one who seeks finds, and to the one who knocks it will be opened.
translation:
  language: ml
  text: എന്തെന്നാൽ, ചോദിക്കുന്ന ഏവനും ലഭിക്കുന്നു; അന്വേഷിക്കുന്നവൻ കണ്ടെത്തുന്നു; മുട്ടുന്നവനു തുറക്കപ്പെടും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ എന്താണ് തുറക്കപ്പെടുന്നതെന്ന് വ്യക്തമായി പറയുന്നില്ല; മുട്ടുന്ന പ്രവൃത്തിയുടെ ദൃശ്യത്തിൽനിന്ന് ‘വാതിൽ’ എന്നാണ് സൂചിതമാകുന്നത്. അതിനാൽ ‘വാതിൽ തുറക്കപ്പെടും’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς
  choice: ഏവനും
  rationale: ആർട്ടിക്കിളോടുകൂടിയ കൃദന്തരൂപവുമായി ചേർന്ന് ഒരു പൊതുവർഗത്തെ സൂചിപ്പിക്കുന്നു. ‘ഏവനും’ സാർവത്രിക വ്യാപ്തി സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ ആഹ്വാനത്തിന് ഈ വാക്യം നൽകുന്ന വിശദീകരണബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: ὁ αἰτῶν
  choice: ചോദിക്കുന്ന
  rationale: വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ പൊതുവായതും തുടർച്ചയായതുമായ ഭാവം നിലനിർത്തുകയും ‘ഏവനും’ എന്നതിനോടു സ്വാഭാവികമായി ചേരുകയും ചെയ്യുന്നു.
- source_word: λαμβάνει
  choice: ലഭിക്കുന്നു
  rationale: ഇവിടെ ‘സ്വീകരിക്കുന്നു’ എന്നതിനെക്കാൾ സ്വാഭാവികമായി ഫലം ലഭിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിലെ വർത്തമാനകാലവും നിലനിർത്തുന്നു.
- source_word: ὁ ζητῶν
  choice: അന്വേഷിക്കുന്നവൻ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ കൃദന്തരൂപത്തെ വ്യക്തമായി പ്രതിഫലിപ്പിക്കുകയും മൂന്നു സമാന്തര പ്രസ്താവനകളുടെ താളം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: εὑρίσκει
  choice: കണ്ടെത്തുന്നു
  rationale: അന്വേഷണത്തിന്റെ ഫലം സൂചിപ്പിക്കുന്ന ലളിതവും സന്ദർഭോചിതവുമായ പദമാണ്.
- source_word: τῷ κρούοντι
  choice: മുട്ടുന്നവനു
  rationale: ദാതൃവിഭക്തിയുടെ അർഥം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ വാതിലിൽ മുട്ടുന്നതാണ് സൂചനയെങ്കിലും ‘വാതിൽ’ മൂലപാഠത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: ἀνοιγήσεται
  choice: തുറക്കപ്പെടും
  rationale: ഭാവികാല കർമണിപ്രയോഗം കൃത്യമായി നിലനിർത്തുന്നു. ഗ്രീക്കിൽ വ്യക്തമാക്കാത്ത കർത്താവായി ‘വാതിൽ’ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: വാഗ്ദാനത്തിന്റെ വ്യാപ്തിയും ശക്തിയും
  choice: സാർവത്രിക പദപ്രയോഗമുള്ള പൊതുവായ ഉറപ്പായി നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: ഓരോ പ്രത്യേക അപേക്ഷയും ചോദിച്ചതുപോലെതന്നെ ലഭിക്കുമെന്ന നിരുപാധിക ഉറപ്പോ, ചില ആത്മീയ അപേക്ഷകൾക്കു മാത്രം ബാധകമായ നിയന്ത്രിത വാഗ്ദാനമോ ആയി പരിഭാഷയിൽ വ്യക്തമാക്കുക.
  rationale: മൂലപാഠം വിശാലവും സാർവത്രികവുമായ ഭാഷയാണ് ഉപയോഗിക്കുന്നത്. സന്ദർഭത്തിൽനിന്ന് വേർപ്പെടുത്തി അതിനെ പരമവത്കരിക്കുകയോ പരിഭാഷയിൽതന്നെ അതിന്റെ വ്യാപ്തി ചുരുക്കുകയോ ചെയ്യാതെ വ്യാഖ്യാനപരമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. മൂന്നു സമാന്തര ഘടകങ്ങളുടെയും ഓർമ്മിക്കാവുന്ന താളം അർധവിരാമങ്ങളിലൂടെ നിലനിർത്തി; മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘വാതിൽ’ മുഖ്യവാചകത്തിൽ ചേർത്തില്ല.
