id: MAT.7.25
reference: Matthew 7:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ κατέβη ἡ βροχὴ καὶ ἦλθον οἱ ποταμοὶ καὶ ἔπνευσαν οἱ ἄνεμοι καὶ προσέπεσαν τῇ οἰκίᾳ ἐκείνῃ, καὶ οὐκ ἔπεσεν, τεθεμελίωτο γὰρ ἐπὶ τὴν πέτραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/025.yaml
  text: And the rain came down[a], and the rivers came, and the winds blew and beat against that house, and it did not fall[b], for it had been founded on the rock.
translation:
  language: ml
  text: മഴ പെയ്തിറങ്ങി; നദികൾ പൊങ്ങിവന്നു[a]; കാറ്റുകൾ വീശി ആ വീടിന്മേൽ ആഞ്ഞടിച്ചു[b]. എന്നിട്ടും അത് വീണില്ല; കാരണം, അത് പാറമേൽ സ്ഥാപിക്കപ്പെട്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പ്രളയജലം വന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്കിൽ പദശഃ ‘നദികൾ’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘ആ വീടിന്മേൽ പതിച്ചു’ അല്ലെങ്കിൽ ‘ആ വീടിനോട് വന്നിടിച്ചു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη ἡ βροχή
  choice: മഴ പെയ്തിറങ്ങി
  rationale: κατέβη സൂചിപ്പിക്കുന്ന താഴേക്കുള്ള ചലനം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: οἱ ποταμοί
  choice: നദികൾ പൊങ്ങിവന്നു
  rationale: ποταμοί എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘നദികൾ’ നിലനിർത്തുകയും കൊടുങ്കാറ്റിന്റെ സാഹചര്യത്തിലെ ഭീഷണികരമായ വരവ് ‘പൊങ്ങിവന്നു’ എന്ന ക്രിയയിലൂടെ സ്വാഭാവികമായി അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: ἔπνευσαν οἱ ἄνεμοι
  choice: കാറ്റുകൾ വീശി
  rationale: ഗ്രീക്ക് ബഹുവചനവും πνέω എന്ന ക്രിയയുടെ സാധാരണ അർഥവും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: προσέπεσαν τῇ οἰκίᾳ ἐκείνῃ
  choice: ആ വീടിന്മേൽ ആഞ്ഞടിച്ചു
  rationale: കൊടുങ്കാറ്റിന്റെ സന്ദർഭത്തിൽ προσπίπτω സൂചിപ്പിക്കുന്ന ശക്തമായ ഇടിച്ചുകയറ്റം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; പദശഃ സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: οὐκ ἔπεσεν
  choice: അത് വീണില്ല
  rationale: ‘തകർന്നുവീണില്ല’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക രൂപത്തെക്കാൾ ഗ്രീക്ക് ക്രിയയുടെ ലളിതമായ അർഥം നിലനിർത്തുന്നു.
- source_word: τεθεμελίωτο
  choice: അതിന് … അടിസ്ഥാനം ഇട്ടിരുന്നു
  rationale: മുൻപേ പൂർത്തിയായ അടിസ്ഥാനസ്ഥാപനത്തിന്റെ ഫലമായി വീട് നിലനിന്നു എന്ന ഗ്രീക്ക് പൂർവഭൂതകാല ആശയം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἐπὶ τὴν πέτραν
  choice: പാറമേൽ
  rationale: πέτρα എന്ന ദൃശ്യരൂപത്തെ ‘അടിപ്പാറ’ എന്നു കൂടുതൽ പ്രത്യേകമാക്കാതെ അതേപടി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഉപമയിലെ അടിസ്ഥാനത്തിന്റെ ദൃശ്യരൂപം
  choice: പാറമേൽ
  alternative: അടിപ്പാറമേൽ
  rationale: ഈ വാക്യം പാറയെ ആരെന്നോ എന്തെന്നോ നേരിട്ട് തിരിച്ചറിയിക്കുന്നില്ല. അതിനാൽ ഉപമയുടെ ദൃശ്യരൂപവും ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവമുള്ള മലയാളം. ഗ്രീക്ക് വാക്യത്തിലെ തുടർച്ചയായ സംഭവക്രമം അർധവിരാമങ്ങളിലൂടെ വ്യക്തമായി അവതരിപ്പിച്ചിരിക്കുന്നു; ഉപമയ്ക്ക് പുറത്തുള്ള ദൈവശാസ്ത്രപരമായ തിരിച്ചറിയലുകൾ ചേർത്തിട്ടില്ല.
