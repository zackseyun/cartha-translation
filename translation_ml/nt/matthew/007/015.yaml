id: MAT.7.15
reference: Matthew 7:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀Προσέχετε ἀπὸ τῶν ψευδοπροφητῶν, οἵτινες ἔρχονται πρὸς ὑμᾶς ἐν ἐνδύμασι προβάτων ἔσωθεν δέ εἰσιν λύκοι ἅρπαγες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/015.yaml
  text: Beware of false prophets[a], who come to you in sheep’s clothing[c][b], but inwardly are ravenous wolves.
translation:
  language: ml
  text: വ്യാജപ്രവാചകന്മാരെ സൂക്ഷിച്ചുകൊള്ളുക[a]. അവർ ആടുകളുടെ വേഷം ധരിച്ച്[b] നിങ്ങളുടെ അടുക്കൽ വരുന്നു; എന്നാൽ ഉള്ളിൽ അവർ ഇരപിടിക്കുന്ന ചെന്നായ്ക്കളാണ്[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വ്യാജപ്രവാചകന്മാരെക്കുറിച്ച് ജാഗ്രത പാലിക്കുക.”
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “ആടുകളുടെ വസ്ത്രങ്ങളിൽ.”
    reason: literal_rendering
  - marker: c
    text: “ഇരപിടിക്കുന്ന” എന്നതിന് “കൊള്ളയടിക്കുന്ന” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε
  choice: സൂക്ഷിച്ചുകൊള്ളുക
  rationale: വർത്തമാനകാല ബഹുവചന ആജ്ഞയുടെ തുടർച്ചയായ ജാഗ്രതയും ശക്തമായ മുന്നറിയിപ്പും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἀπὸ τῶν ψευδοπροφητῶν
  choice: വ്യാജപ്രവാചകന്മാരെ
  rationale: προσέχω എന്ന ക്രിയയോടുകൂടിയ ἀπό ജാഗ്രത പാലിക്കേണ്ട ആളുകളെ സൂചിപ്പിക്കുന്നു. ‘വ്യാജപ്രവാചകന്മാർ’ എന്നത് പ്രവാചകാധികാരം വ്യാജമായി അവകാശപ്പെടുകയോ പ്രവാചകരെന്ന നിലയിൽ അസത്യം പറയുകയോ ചെയ്യുന്നവരെ കൃത്യമായി സൂചിപ്പിക്കുന്നു.
- source_word: οἵτινες ἔρχονται πρὸς ὑμᾶς
  choice: അവർ ... നിങ്ങളുടെ അടുക്കൽ വരുന്നു
  rationale: ഇവിടെ പറയുന്ന ആളുകളുടെ സ്വഭാവം വിശദീകരിക്കുന്ന ബന്ധവാക്യം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ സ്വതന്ത്രവാക്യമായി നൽകിയിരിക്കുന്നു; വർത്തമാനകാലത്തിന്റെ ആശയം നിലനിർത്തുന്നു.
- source_word: ἐν ἐνδύμασι προβάτων
  choice: ആടുകളുടെ വേഷം ധരിച്ച്
  rationale: പുറംകാഴ്ചയും ഉള്ളിലെ യാഥാർഥ്യവും തമ്മിലുള്ള രൂപകവൈരുധ്യം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: ἔσωθεν δέ
  choice: എന്നാൽ ഉള്ളിൽ
  rationale: δέ സൂചിപ്പിക്കുന്ന ശക്തമായ വൈരുധ്യവും ἔσωθεν സൂചിപ്പിക്കുന്ന ആന്തരിക യാഥാർഥ്യവും നേരിട്ട് പ്രകടമാക്കുന്നു.
- source_word: λύκοι ἅρπαγες
  choice: ഇരപിടിക്കുന്ന ചെന്നായ്ക്കൾ
  rationale: ἅρπαγες എന്ന പദത്തിലെ പിടിച്ചുപറിക്കുന്ന, നശിപ്പിക്കുന്ന വേട്ടസ്വഭാവം ചെന്നായുടെ രൂപകത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘കൊള്ളയടിക്കുന്ന’ എന്ന പദസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: വഞ്ചനാപരമായ മതനേതാക്കളെക്കുറിച്ചുള്ള മുന്നറിയിപ്പിന്റെ വ്യാപ്തി
  choice: പുറംകാഴ്ചയും ഉള്ളിലെ യാഥാർഥ്യവും തമ്മിലുള്ള രൂപകത്തിലൂടെ വ്യാജപ്രവാചകന്മാരെക്കുറിച്ചുള്ള ധാർമിക-ആത്മീയ മുന്നറിയിപ്പായി നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: പിൽക്കാലത്ത് രൂപപ്പെട്ട ഏതെങ്കിലും പ്രത്യേക സഭാവിഭാഗത്തെയോ സിദ്ധാന്തവിരുദ്ധരെന്ന സ്ഥാപനപരമായ വിഭാഗത്തെയോ മാത്രം ലക്ഷ്യമാക്കുന്ന വിധത്തിൽ പരിഭാഷപ്പെടുത്തുക.
  rationale: ഗ്രീക്ക് പാഠം വ്യാജപ്രവാചകന്മാരെ പൊതുവായി മുന്നറിയിപ്പു നൽകുന്നു; അതിൽ വ്യക്തമല്ലാത്ത പിൽക്കാല സഭാപരമോ വിഭാഗീയമോ ആയ നിർവചനങ്ങൾ പരിഭാഷയിൽ ചേർക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവവും രൂപകത്തിന്റെ ശക്തിയും നിലനിർത്തുന്ന ഭാഷയാണ് ഉപയോഗിച്ചിരിക്കുന്നത്. ‘വ്യാജപ്രവാചകന്മാർ’ എന്ന പരിചിതമായ ബൈബിൾപദം നിലനിർത്തിയെങ്കിലും വാക്യഘടന സ്വാഭാവികമാക്കി.
