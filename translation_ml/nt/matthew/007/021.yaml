id: MAT.7.21
reference: Matthew 7:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οὐ πᾶς ὁ λέγων μοι· Κύριε κύριε εἰσελεύσεται εἰς τὴν βασιλείαν τῶν οὐρανῶν, ἀλλ’ ὁ ποιῶν τὸ θέλημα τοῦ πατρός μου τοῦ ἐν ⸀τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/021.yaml
  text: Not everyone who says to me[a], ‘Lord, Lord,’ will enter into the kingdom of heaven[b], but the one who does the will of my Father who is in heaven will enter.
translation:
  language: ml
  text: എന്നോട് ‘കർത്താവേ, കർത്താവേ’ എന്നു പറയുന്ന എല്ലാവരും സ്വർഗരാജ്യത്തിൽ[a] പ്രവേശിക്കുകയില്ല; എന്നാൽ സ്വർഗത്തിൽ[b] ഉള്ള എന്റെ പിതാവിന്റെ ഇഷ്ടം ചെയ്യുന്നയാൾ പ്രവേശിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘സ്വർഗങ്ങളുടെ രാജ്യത്തിൽ.’ മറ്റു സന്ദർഭങ്ങളിൽ ‘ദൈവരാജ്യം’ എന്നു പറയുന്നിടത്ത് മത്തായി ഈ പ്രയോഗം പതിവായി ഉപയോഗിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെയും ഗ്രീക്കിൽ ‘സ്വർഗങ്ങൾ’ എന്ന ബഹുവചനമാണ്; മലയാളത്തിൽ സ്വാഭാവികമായി ‘സ്വർഗം’ എന്നു പരിഭാഷപ്പെടുത്തി.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ πᾶς ὁ λέγων μοι
  choice: എന്നോട് … എന്നു പറയുന്ന എല്ലാവരുമല്ല
  rationale: Οὐ πᾶς എന്നത് ‘ആരും അല്ല’ എന്ന സമ്പൂർണ നിഷേധമല്ല, ‘എല്ലാവരുമല്ല’ എന്ന ഭാഗിക നിഷേധമാണ്. വർത്തമാന കൃദന്തരൂപം സ്വാഭാവികമായ മലയാള ആപേക്ഷികപ്രയോഗമായി നൽകി.
- source_word: Κύριε κύριε
  choice: കർത്താവേ, കർത്താവേ
  rationale: κύριος എന്ന അഭിസംബോധനയ്ക്ക് പതിവും ഗൗരവവുമുള്ള ‘കർത്താവേ’ ഉപയോഗിച്ചു; ഊന്നൽ നൽകുന്ന ആവർത്തനം അതേപടി നിലനിർത്തി.
- source_word: εἰσελεύσεται
  choice: പ്രവേശിക്കുക
  rationale: ഭാവികാല അർഥം മലയാളത്തിലെ സന്ദർഭസഹജമായ രൂപത്തിൽ നൽകി. രണ്ടാം ഉപവാക്യത്തിൽ ഗ്രീക്കിൽ അധ്യാഹൃതമായിരിക്കുന്ന ക്രിയ വ്യക്തതയ്ക്കായി ആവർത്തിച്ചു.
- source_word: εἰς τὴν βασιλείαν τῶν οὐρανῶν
  choice: സ്വർഗരാജ്യത്തിൽ
  rationale: മത്തായിയുടെ സവിശേഷമായ ‘സ്വർഗങ്ങളുടെ രാജ്യം’ എന്ന ഗ്രീക്ക് പ്രയോഗം മലയാളത്തിൽ പതിവും സ്വാഭാവികവുമായ ‘സ്വർഗരാജ്യം’ എന്നു നൽകി; ഗ്രീക്കിലെ ബഹുവചനം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: ἀλλ’ ὁ ποιῶν
  choice: … ചെയ്യുന്നയാളാണ്
  rationale: നാമവാചകമായി പ്രവർത്തിക്കുന്ന ഏകവചന വർത്തമാന കൃദന്തത്തിന്റെ വിരുദ്ധത നിലനിർത്തി; ലിംഗപരമായി അനാവശ്യമായി പരിമിതപ്പെടുത്താത്ത സ്വാഭാവിക ആധുനിക രൂപം തിരഞ്ഞെടുത്തു.
- source_word: τὸ θέλημα
  choice: ഇഷ്ടം
  rationale: θέλημα ഇവിടെ പിതാവിന്റെ ഉദ്ദേശ്യത്തെയും ആഗ്രഹത്തെയും അനുസരിക്കേണ്ട കാര്യത്തെയും സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ സ്ഥാപിതവും സുലഭവുമായ ‘ഇഷ്ടം’ ഈ പരിധി നിലനിർത്തുന്നു.
- source_word: τοῦ πατρός μου
  choice: എന്റെ പിതാവിന്റെ
  rationale: സ്വത്തുസൂചക ഷഷ്ഠി നേരിട്ട് പരിഭാഷപ്പെടുത്തി; യേശുവിന്റെ പുത്രബന്ധഭാഷ നിലനിർത്തി.
- source_word: τοῦ ἐν τοῖς οὐρανοῖς
  choice: സ്വർഗത്തിൽ വസിക്കുന്ന
  rationale: പിതാവിനെ വിശേഷിപ്പിക്കുന്ന ഗ്രീക്ക് പദസമുച്ചയം സ്വാഭാവിക മലയാളത്തിൽ നൽകി. മൂലത്തിലെ ബഹുവചനമായ ‘സ്വർഗങ്ങൾ’ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
theological_decisions:
- issue: വാക്കാലുള്ള ‘കർത്താവേ’ എന്ന ഏറ്റുപറച്ചിലും പിതാവിന്റെ ഇഷ്ടം ചെയ്യുന്നതും തമ്മിലുള്ള ബന്ധം
  choice: വെറും അഭിസംബോധനയും പിതാവിന്റെ ഇഷ്ടം പ്രവർത്തിക്കുന്നതും തമ്മിലുള്ള വാക്യത്തിലെ വ്യക്തമായ വിരുദ്ധത നിലനിർത്തി.
  alternative: ഈ ഒറ്റ വാക്യത്തിലേക്ക് പ്രവൃത്തികളാലുള്ള നീതീകരണമോ വാക്കാലുള്ള ഏറ്റുപറച്ചിൽ മാത്രം മതിയെന്നോ ഉള്ള സമ്പൂർണ രക്ഷാശാസ്ത്രനിഗമനം ചേർക്കുക.
  rationale: ഗ്രീക്ക് പാഠം ‘പറയുക’ എന്നതിനെയും ‘ചെയ്യുക’ എന്നതിനെയും വ്യക്തമായി വിരുദ്ധമാക്കുന്നു; എന്നാൽ നീതീകരണത്തെക്കുറിച്ചുള്ള ഒരു പൂർണ സിദ്ധാന്തം ഈ വാക്യം മാത്രം വിശദീകരിക്കുന്നില്ല. അതിനാൽ മുന്നറിയിപ്പും ദൈവശാസ്ത്രപരമായ സംഘർഷവും പരിഹരിക്കാതെ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ഗൗരവമുള്ളതുമായ ശൈലി. ഭാഗിക നിഷേധം തെറ്റായി സമ്പൂർണ നിഷേധമായി വായിക്കാതിരിക്കാൻ ‘എല്ലാവരുമല്ല’ എന്നു വ്യക്തമാക്കി. ഗ്രീക്കിലെ വിരുദ്ധഘടനയും ആവർത്തിച്ച അഭിസംബോധനയും സംരക്ഷിച്ചു.
