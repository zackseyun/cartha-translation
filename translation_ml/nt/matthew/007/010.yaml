id: MAT.7.10
reference: Matthew 7:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ἢ καὶ ⸂ἰχθὺν αἰτήσει⸃— μὴ ὄφιν ἐπιδώσει αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/010.yaml
  text: Or if he asks for a fish—he will not give him a snake[b][a], will he?
translation:
  language: ml
  text: അല്ലെങ്കിൽ, അവൻ ഒരു മീൻ ചോദിച്ചാൽ—അവന് ഒരു പാമ്പിനെ കൊടുക്കുമോ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ καὶ
  choice: അല്ലെങ്കിൽ
  rationale: മുൻ ഉദാഹരണത്തോടു ചേർന്ന രണ്ടാമത്തെ സാദൃശ്യം അവതരിപ്പിക്കുന്ന വിഭക്ത തുടർച്ച; ‘അല്ലെങ്കിൽ’ സ്വാഭാവികമായി ആ ബന്ധം നിലനിർത്തുന്നു. καί പ്രത്യേകം പരിഭാഷപ്പെടുത്തുന്നത് മലയാളത്തിൽ അനാവശ്യമായ ഭാരമുണ്ടാക്കും.
- source_word: ἰχθὺν
  choice: ഒരു മീൻ
  rationale: ഭക്ഷണസന്ദർഭത്തിലെ സാധാരണ അർഥമായ ‘മീൻ’ നേരിട്ട് നൽകുന്നു.
- source_word: αἰτήσει
  choice: ചോദിച്ചാൽ
  rationale: ഭാവികാല സൂചകരൂപമാണെങ്കിലും പൊതുവായ സാങ്കൽപ്പിക സാഹചര്യത്തിൽ മലയാളത്തിലെ വ്യവസ്ഥാരൂപം സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: μὴ
  choice: കൊടുക്കുമോ?
  rationale: μή പ്രതീക്ഷിക്കുന്ന നിഷേധാത്മക ഉത്തരത്തിന്റെ ശക്തി മലയാളത്തിൽ സന്ദർഭസഹജമായ അലങ്കാരചോദ്യത്തിലൂടെ പ്രകടമാകുന്നു.
- source_word: ὄφιν
  choice: ഒരു പാമ്പിനെ
  rationale: ὄφις എന്ന സാധാരണ ജീവിനാമത്തിന് ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക തുല്യം ‘പാമ്പ്’ ആണ്.
- source_word: ἐπιδώσει
  choice: കൊടുക്കുമോ
  rationale: ഈ പിതാവ്–മകൻ സാദൃശ്യത്തിൽ ‘കൊടുക്കുക’ എന്നതാണ് വ്യക്തവും സ്വാഭാവികവുമായ അർഥം.
- source_word: αὐτῷ
  choice: അവന്
  rationale: പരോക്ഷ കർമമായ ദത്തിവിനെ സ്വാഭാവിക മലയാള ദത്തിവുരൂപത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: അലങ്കാരചോദ്യത്തിന്റെ നിഷേധാത്മക പ്രതീക്ഷ
  choice: ‘അവന് ഒരു പാമ്പിനെ കൊടുക്കുമോ?’ എന്ന ചോദ്യരൂപം
  alternative: ‘അവന് ഒരു പാമ്പിനെ കൊടുക്കുകയില്ലല്ലോ?’ അല്ലെങ്കിൽ പ്രസ്താവനയായി ‘അവന് ഒരു പാമ്പിനെ കൊടുക്കുകയില്ല’
  rationale: μή ഉള്ള ചോദ്യം ‘ഇല്ല’ എന്ന ഉത്തരം പ്രതീക്ഷിക്കുന്നു. മലയാളത്തിലെ ലളിതമായ ചോദ്യരൂപം സന്ദർഭത്തിൽ ആ പ്രതീക്ഷ വ്യക്തമായി നിലനിർത്തുകയും, ‘ഇല്ലല്ലോ’ ചേർത്ത് ഉറവിടത്തേക്കാൾ ശക്തമാക്കുന്നത് ഒഴിവാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ സംസാരശൈലി. ഗ്രീക്ക് പതിപ്പിലെ ശക്തമായ വാക്യവിരാമം പ്രതിഫലിപ്പിക്കാൻ ദീർഘരേഖ ഉപയോഗിച്ചു. അർഥം സുതാര്യമായതിനാൽ അടിക്കുറിപ്പ് ആവശ്യമില്ല.
