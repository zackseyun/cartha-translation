  text: πᾶν δένδρον μὴ ποιοῦν καρπὸν καλὸν ἐκκόπτεται καὶ εἰς πῦρ βάλλεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/019.yaml
  text: Every tree not producing good fruit is cut down and thrown into the fire[a][b].
translation:
  language: ml
  text: നല്ല ഫലം കായ്ക്കാത്ത ഓരോ വൃക്ഷവും വെട്ടിവീഴ്ത്തപ്പെടുകയും തീയിലേക്ക് എറിയപ്പെടുകയും ചെയ്യുന്നു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നല്ല ഫലം നൽകാത്ത.’
    reason: lexical_alternative
  - marker: b
    text: ‘തീ’ ന്യായവിധിയുടെ ഒരു രൂപകമാണ്. ഇവിടെ ഊന്നൽ കാലികമായ ന്യായവിധിയിലാണോ, അന്ത്യകാല ന്യായവിധിയിലാണോ, അതോ രണ്ടിലുമാണോ എന്ന് ഈ വാക്യം തന്നെ കൂടുതൽ കൃത്യമായി വ്യക്തമാക്കുന്നില്ല.
    reason: cross_reference
lexical_decisions:
- source_word: πᾶν δένδρον
  choice: ഓരോ വൃക്ഷവും
  rationale: ഏകവചന നാമത്തോടു ചേർന്ന πᾶν ഇവിടെ വിതരണാർഥത്തിൽ ഓരോ വൃക്ഷത്തെയും പ്രത്യേകം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഓരോ വൃക്ഷവും’ സ്വാഭാവികവും പഴഞ്ചൊല്ലുസദൃശമായ പ്രഭാവം നിലനിർത്തുന്നതുമാണ്.
- source_word: μὴ ποιοῦν
  choice: കായ്ക്കാത്ത
  rationale: വൃക്ഷവും ഫലവും സംബന്ധിച്ച സന്ദർഭത്തിൽ ‘കായ്ക്കുക’ എന്നത് സ്വാഭാവികമായ മലയാളപ്രയോഗമാണ്. വർത്തമാനകാല കൃദന്തരൂപം സൂചിപ്പിക്കുന്ന സ്ഥിരസ്വഭാവം നിഷേധാത്മക വിശേഷണരൂപമായ ‘കായ്ക്കാത്ത’യിൽ നിലനിൽക്കുന്നു.
- source_word: καρπὸν καλὸν
  choice: നല്ല ഫലം
  rationale: καλός ഇവിടെ നല്ലത്, ഉചിതം, ഗുണമുള്ളത് എന്ന വിലയിരുത്തൽ വഹിക്കുന്നു; ‘നല്ല ഫലം’ സന്ദർഭത്തിലെ ധാർമ്മിക സൂചന സംരക്ഷിക്കുന്ന ലളിതവും നേരിട്ടുള്ളതുമായ പരിഭാഷയാണ്.
- source_word: ἐκκόπτεται
  choice: വെട്ടിവീഴ്ത്തി
  rationale: ഒരു മുഴുവൻ വൃക്ഷത്തെ ἐκκόπτω ചെയ്യുന്നതിനെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘വെട്ടിവീഴ്ത്തുക’ എന്നു പറയുന്നു. ഗ്രീക്കിലെ കർമ്മണിപ്രയോഗം തുടർന്നുള്ള ‘എറിയപ്പെടുന്നു’ എന്ന ക്രിയയോടു ചേർന്ന ക്രിയാശൃംഖലയിൽ നിലനിൽക്കുന്നു.
- source_word: εἰς πῦρ βάλλεται
  choice: തീയിലേക്ക് എറിയപ്പെടുന്നു
  rationale: εἰς സൂചിപ്പിക്കുന്ന തീയിലേക്കുള്ള ചലനവും βάλλεται എന്ന കർമ്മണിരൂപവും ഈ പരിഭാഷ നേരിട്ട് നിലനിർത്തുന്നു. ഗ്രീക്കിൽ നിർദ്ദേശക ഉപപദമില്ലാത്തതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ ‘തീയിലേക്ക്’ ഉപയോഗിച്ചു; തീയുടെ കൃത്യമായ ദൈവശാസ്ത്രപരമായ സൂചന നിർണ്ണയിച്ചിട്ടില്ല.
theological_decisions:
- issue: തീ എന്ന ന്യായവിധിചിത്രം
  choice: വെട്ടിവീഴ്ത്തി തീയിലേക്ക് എറിയപ്പെടുന്നു എന്ന രൂപകം അതേപടി നിലനിർത്തി; തീ എന്തിനെ കൃത്യമായി സൂചിപ്പിക്കുന്നു എന്നു മുഖ്യവാചകത്തിൽ നിർവചിച്ചില്ല.
  alternative: കാലിക ന്യായവിധി; അന്ത്യകാല ന്യായവിധി; നരകം
  rationale: വാക്യം കാർഷികരൂപകത്തിലൂടെ ന്യായവിധിയുടെ മുന്നറിയിപ്പ് വ്യക്തമായി നൽകുന്നു. എന്നാൽ അതിന്റെ സമയമോ കൃത്യമായ പരിധിയോ ഈ വാക്യം ഒറ്റയ്ക്ക് വ്യക്തമാക്കുന്നില്ല; അതിനാൽ കൂടുതൽ ചുരുങ്ങിയ ഒരു ദൈവശാസ്ത്രനിഗമനം പരിഭാഷയിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഫലം കായ്ക്കുക’, ‘വെട്ടിവീഴ്ത്തുക’, ‘തീയിലേക്ക് എറിയപ്പെടുക’ എന്നീ സാധാരണ പ്രയോഗങ്ങൾ ഉപയോഗിച്ചു; മതവിഭാഗവിശേഷമായ സാങ്കേതിക പദങ്ങൾ ഒഴിവാക്കി.
