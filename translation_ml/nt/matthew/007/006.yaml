id: MAT.7.6
reference: Matthew 7:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Μὴ δῶτε τὸ ἅγιον τοῖς κυσίν, μηδὲ βάλητε τοὺς μαργαρίτας ὑμῶν ἔμπροσθεν τῶν χοίρων, μήποτε ⸀καταπατήσουσιν αὐτοὺς ἐν τοῖς ποσὶν αὐτῶν καὶ στραφέντες ῥήξωσιν ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/006.yaml
  text: Do not give what is holy to dogs[a], and do not throw your pearls before pigs[d][c][b], lest they trample them under their feet and turn and tear you to pieces.
translation:
  language: ml
  text: വിശുദ്ധമായത്[a] നായ്ക്കൾക്കു കൊടുക്കരുത്; നിങ്ങളുടെ മുത്തുകൾ പന്നികളുടെ മുമ്പിൽ എറിയുകയുമരുത്. അല്ലെങ്കിൽ പന്നികൾ അവയെ കാൽക്കീഴിൽ ചവിട്ടുകയും തിരിഞ്ഞ് നിങ്ങളെ കീറിമുറിക്കുകയും ചെയ്തേക്കാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വിശുദ്ധവസ്തു’ എന്നും ‘പവിത്രമായത്’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പ്രയോഗം വിശാലമാണ്; വിശുദ്ധമോ ദൈവത്തിനായി വേർതിരിച്ചതോ ആയതിനെ പൊതുവായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ἅγιον
  choice: വിശുദ്ധമായത്
  rationale: നപുംസക ഏകവചന വിശേഷണം നാമവാചകമായി ഉപയോഗിച്ചിരിക്കുന്നു. ഏതെങ്കിലും പ്രത്യേക വിശുദ്ധ വസ്തുവോ ഉപദേശമോ എന്ന് പരിമിതപ്പെടുത്താതെ ഗ്രീക്കിലെ വിശാലമായ സൂചന നിലനിർത്തുന്നു.
- source_word: τοῖς κυσίν
  choice: നായ്ക്കൾക്കു
  rationale: രൂപകത്തിന്റെ മൂർച്ചയും സാംസ്കാരികമായി അപമാനകരമായ ഭാവവും മയപ്പെടുത്താതെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു.
- source_word: βάλητε
  choice: എറിയുകയുമരുത്
  rationale: βάλλω എന്ന ക്രിയയുടെ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; μηδέയുമായി ചേർന്ന രണ്ടാമത്തെ നിരോധനവും വ്യക്തമാക്കുന്നു.
- source_word: τοὺς μαργαρίτας ὑμῶν
  choice: നിങ്ങളുടെ മുത്തുകൾ
  rationale: ഉടമസ്ഥതയും ബഹുവചനവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: ἔμπροσθεν τῶν χοίρων
  choice: പന്നികളുടെ മുമ്പിൽ
  rationale: മൂലത്തിലെ ദൃശ്യരൂപകം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: μήποτε
  choice: അല്ലെങ്കിൽ ... ചെയ്തേക്കാം
  rationale: നിരോധനത്തിനു പിന്നാലെയുള്ള പ്രതികൂല സാധ്യതയെയോ മുന്നറിയിപ്പിനെയോ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: καταπατήσουσιν αὐτοὺς ἐν τοῖς ποσὶν αὐτῶν
  choice: പന്നികൾ അവയെ കാൽക്കീഴിൽ ചവിട്ടുകയും
  rationale: αὐτούς മുത്തുകളെ സൂചിപ്പിക്കുന്നു. ആവർത്തിക്കുന്ന മലയാള സർവനാമങ്ങളുടെ അവ്യക്തത ഒഴിവാക്കാൻ ഗ്രീക്കിൽ ഉൾക്കൊള്ളുന്ന കർത്താവായ പന്നികളെ വീണ്ടും വ്യക്തമാക്കി; ചവിട്ടലിന്റെ ദൃശ്യഭാവം പൂർണമായി സൂക്ഷിച്ചു.
- source_word: στραφέντες ῥήξωσιν ὑμᾶς
  choice: തിരിഞ്ഞ് നിങ്ങളെ കീറിമുറിക്കുകയും
  rationale: പ്രവൃത്തികളുടെ ക്രമവും ῥήγνυμι സൂചിപ്പിക്കുന്ന അക്രമാസക്തമായ കീറലും നിലനിർത്തുന്നു; വെറും ‘ആക്രമിക്കുക’ എന്ന ദുർബലമായ പദം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: ‘വിശുദ്ധമായത്,’ ‘നായ്ക്കൾ,’ ‘മുത്തുകൾ,’ ‘പന്നികൾ’ എന്നീ രൂപകങ്ങളുടെ വ്യാഖ്യാനം
  choice: രൂപകങ്ങളെ വിശദീകരിച്ചു പരിമിതപ്പെടുത്താതെ അതേപടി നിലനിർത്തി.
  alternative: ‘വിശുദ്ധമായത്’ ദൈവരാജ്യത്തിന്റെ സന്ദേശമെന്നും നായ്ക്കളും പന്നികളും അതിനെ എതിർക്കുന്ന മനുഷ്യരെന്നും വാചകത്തിൽ തന്നെ വ്യക്തമാക്കുക.
  rationale: വാക്യം ഈ രൂപകങ്ങളുടെ സൂചിതാർഥം കൃത്യമായി നിർവചിക്കുന്നില്ല. ഏതെങ്കിലും പ്രത്യേക ഉപദേശപരമായ വ്യാഖ്യാനം വിവർത്തനത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതിരിക്കാൻ മൂലത്തിലെ അർഥവ്യാപ്തിയും ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും സംരക്ഷിച്ചു.
- issue: അവസാന പ്രവൃത്തികളുടെ കർത്താവ്
  choice: മലയാളത്തിലെ വ്യക്തതയ്ക്കായി ‘പന്നികൾ’ എന്ന് വീണ്ടും വ്യക്തമാക്കി.
  alternative: ‘അവ’ എന്ന സർവനാമം മാത്രം ഉപയോഗിച്ച് ഗ്രീക്കിലെ ഉൾക്കൊള്ളുന്ന ബഹുവചന കർത്താവിനെ അനുകരിക്കുക.
  rationale: ഗ്രീക്ക് വാക്യഘടനയിൽ ചവിട്ടുന്നതും തിരിഞ്ഞ് കീറുന്നതും പന്നികളാണ്. മലയാളത്തിൽ ‘അവ അവയെ’ എന്ന രൂപം ആശയക്കുഴപ്പവും അസ്വാഭാവികതയും സൃഷ്ടിക്കുന്നതിനാൽ കർത്താവിനെ ആവർത്തിച്ചത് വ്യാഖ്യാനപരമായ കൂട്ടിച്ചേർക്കലല്ല, വ്യാകരണപരമായ വ്യക്തീകരണമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. ‘പന്നി,’ ‘എറിയുക,’ ‘കീറിമുറിക്കുക’ എന്നീ പദങ്ങൾ രൂപകത്തിന്റെ ശക്തി മയപ്പെടുത്താതെ സ്വാഭാവികമായി നൽകുന്നു.
