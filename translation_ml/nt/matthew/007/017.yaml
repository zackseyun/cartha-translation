id: MAT.7.17
reference: Matthew 7:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὕτως πᾶν δένδρον ἀγαθὸν καρποὺς καλοὺς ποιεῖ, τὸ δὲ σαπρὸν δένδρον καρποὺς πονηροὺς ποιεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/017.yaml
  text: So[a], every good tree produces good fruit[c][b], but the rotten tree produces bad fruit.
translation:
  language: ml
  text: അതുപോലെ[a], ഓരോ നല്ല വൃക്ഷവും നല്ല ഫലങ്ങൾ കായ്ക്കുന്നു; എന്നാൽ ചീഞ്ഞ വൃക്ഷം[b] ചീത്ത ഫലങ്ങൾ[c] കായ്ക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അങ്ങനെ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘ചീഞ്ഞ’ എന്നു പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്കുപദത്തിന് ‘കേടായ,’ ‘അഴുകിയ,’ ‘പ്രയോജനശൂന്യമായ’ എന്നീ അർഥങ്ങളും വരാം.
    reason: lexical_alternative
  - marker: c
    text: ‘ചീത്ത ഫലങ്ങൾ’ എന്നത് ‘ദുഷ്ടമായ ഫലങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം; ഇവിടെ കാർഷികരൂപകത്തിന് ‘ചീത്ത’ കൂടുതൽ സ്വാഭാവികമാണ്, എന്നാൽ സന്ദർഭത്തിലെ ധാർമ്മിക സൂചനയും നിലനിൽക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: അതുപോലെ
  rationale: മുൻവാക്യത്തിലെ വൃക്ഷം–ഫലം ഉപമയുമായി ഈ പൊതുതത്ത്വത്തെ ബന്ധിപ്പിക്കുന്നു; ഗ്രീക്കിലെ നിഗമനാത്മകവും താരതമ്യാത്മകവുമായ ഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: πᾶν δένδρον ἀγαθὸν
  choice: ഓരോ നല്ല വൃക്ഷവും
  rationale: ഏകവചനനാമത്തോടുകൂടിയ πᾶν-ന്റെ വിതരണാർഥം ‘ഓരോ’ എന്നു വ്യക്തമായി നൽകുന്നു; ἀγαθός-ന്റെ ലളിതമായ ഗുണസൂചന ‘നല്ല’ എന്നു നിലനിർത്തുന്നു.
- source_word: καρποὺς καλοὺς
  choice: നല്ല ഫലങ്ങൾ
  rationale: καλός-ന് ‘മനോഹരമായ’ എന്ന അർഥവും ഉണ്ടെങ്കിലും, ഫലത്തിന്റെ ഗുണനിലവാരം വിലയിരുത്തുന്ന ഈ സന്ദർഭത്തിൽ ‘നല്ല’ എന്നത് സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: ποιεῖ
  choice: കായ്ക്കുന്നു
  rationale: ποιέω അക്ഷരാർഥത്തിൽ ‘ഉണ്ടാക്കുന്നു’ എന്നാണെങ്കിലും, വൃക്ഷവും ഫലവും വിഷയമായ മലയാളപ്രയോഗത്തിൽ ‘കായ്ക്കുന്നു’ എന്നതാണ് സ്വാഭാവികം.
- source_word: τὸ δὲ
  choice: എന്നാൽ
  rationale: δέ ഇവിടെ രണ്ടു തരത്തിലുള്ള വൃക്ഷങ്ങൾ തമ്മിലുള്ള വൈരുധ്യം അടയാളപ്പെടുത്തുന്നു.
- source_word: σαπρὸν
  choice: ചീഞ്ഞ
  rationale: σαπρός എന്നത് കേടുവന്നത്, അഴുകിയത്, പ്രയോജനശൂന്യമായത് എന്നീ അർഥങ്ങൾ നൽകുന്നു; വൃക്ഷത്തിന്റെ ദൃശ്യരൂപകത്തിൽ ‘ചീഞ്ഞ’ വ്യക്തവും സജീവവുമാണ്.
- source_word: καρποὺς πονηροὺς
  choice: ചീത്ത ഫലങ്ങൾ
  rationale: πονηρός-ന് ദുഷ്ടം/തിന്മയുള്ളത് എന്ന ധാർമ്മിക അർഥവ്യാപ്തിയുണ്ടെങ്കിലും, കാർഷികരൂപകത്തിൽ ‘ചീത്ത ഫലങ്ങൾ’ സ്വാഭാവികമാണ്; സന്ദർഭത്തിലെ ധാർമ്മിക സൂചനയും ഇല്ലാതാക്കുന്നില്ല.
theological_decisions:
- issue: വൃക്ഷം–ഫലം രൂപകത്തിന്റെ കാർഷികവും ധാർമ്മികവുമായ ഭാവങ്ങൾ
  choice: വാക്യത്തിൽ രൂപകം അതേപടി നിലനിർത്തി, അതിന്റെ ധാർമ്മിക പ്രയോഗം വിവർത്തനത്തിൽ തുറന്നുപറയാതിരിക്കുന്നു.
  alternative: ‘സത്യസന്ധനായ മനുഷ്യൻ നല്ല പ്രവൃത്തികൾ ചെയ്യുന്നു’ എന്നതുപോലെ രൂപകത്തിന്റെ അർഥം നേരിട്ട് വ്യാഖ്യാനിക്കുക.
  rationale: ഗ്രീക്ക് പാഠം വ്യാജപ്രവാചകന്മാരെക്കുറിച്ചുള്ള സന്ദർഭത്തിൽ ധാർമ്മിക സൂചന നൽകുന്നുണ്ടെങ്കിലും, ഈ വാക്യം തന്നെ വൃക്ഷത്തിന്റെയും ഫലത്തിന്റെയും രൂപകമാണ് പ്രസ്താവിക്കുന്നത്. അതിനാൽ വ്യാഖ്യാനം സന്ദർഭത്തിനു വിട്ടുകൊടുക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ പഴഞ്ചൊല്ലുസദൃശ ശൈലി. ‘ഉണ്ടാക്കുന്നു’ എന്ന അക്ഷരാർഥപ്രയോഗത്തിനു പകരം വൃക്ഷത്തെക്കുറിച്ചുള്ള സ്വാഭാവിക മലയാളമായ ‘കായ്ക്കുന്നു’ ഉപയോഗിച്ചു.
