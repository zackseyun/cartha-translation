id: MAT.7.14
reference: Matthew 7:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ὅτι στενὴ ἡ πύλη καὶ τεθλιμμένη ἡ ὁδὸς ἡ ἀπάγουσα εἰς τὴν ζωήν, καὶ ὀλίγοι εἰσὶν οἱ εὑρίσκοντες αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/014.yaml
  text: For the gate is narrow and the way that leads to life is hard, and few are those who find it.
translation:
  language: ml
  text: എന്തെന്നാൽ, വാതിൽ ഇടുങ്ങിയതും ജീവനിലേക്കു നയിക്കുന്ന വഴി ഞെരുക്കമുള്ളതുമാണ്; അത് കണ്ടെത്തുന്നവർ ചുരുക്കമാണ്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στενὴ
  choice: ഇടുങ്ങിയ
  rationale: വാതിലിന്റെ കുറഞ്ഞ വീതിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ മലയാളപദം.
- source_word: τεθλιμμένη
  choice: ഞെരുക്കമുള്ള
  rationale: θλίβω എന്ന ക്രിയയുടെ ‘ഞെരുക്കുക/അമർത്തുക’ എന്ന അടിസ്ഥാനചിത്രം നിലനിർത്തുന്നു; വഴി സഞ്ചരിക്കാൻ പ്രയാസമുള്ളതാണെന്ന ആശയവും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἀπάγουσα εἰς τὴν ζωήν
  choice: ജീവങ്കലേക്കു നയിക്കുന്ന
  rationale: ലക്ഷ്യസ്ഥാനമായ ‘ജീവൻ’ എന്നതും വഴിയുടെ നയിക്കുന്ന പ്രവർത്തനവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ὀλίγοι ... οἱ εὑρίσκοντες αὐτήν
  choice: അതു കണ്ടെത്തുന്നവർ ചുരുക്കം
  rationale: ഗ്രീക്കിലെ ഊന്നൽ ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു; ‘അതു’ വഴി എന്ന മുൻപറഞ്ഞ നാമത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: τεθλιμμένη എന്നതിന്റെ അർത്ഥവ്യാപ്തി
  choice: ഞെരുക്കമുള്ള
  alternative: ദുഷ്കരമായ
  rationale: ‘ദുഷ്കരമായ’ ഫലാർഥം വ്യക്തമാക്കുമെങ്കിലും, മൂലപദത്തിലെ ഞെരുക്കം/സമ്മർദം എന്ന രൂപകം നഷ്ടപ്പെടാം. ‘ഞെരുക്കമുള്ള’ ആ രൂപകവും ജീവിതത്തിലേക്കുള്ള വഴിയുടെ പ്രയാസവും ഒരുമിച്ചു സൂക്ഷിക്കുന്നു.
- issue: τὴν ζωήν എന്നതിലെ ‘ജീവൻ’
  choice: ജീവൻ
  alternative: നിത്യജീവൻ
  rationale: ഈ വാക്യത്തിൽ ‘നിത്യ’ എന്ന വിശേഷണം മൂലപാഠത്തിൽ ഇല്ല; അതിനാൽ ദൈവശാസ്ത്രപരമായി സാധ്യമായ വിശദീകരണം വാചകത്തിലേക്ക് ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മലയാളം. വാക്യഘടന സംക്ഷിപ്തമായി സൂക്ഷിക്കുകയും ഇടുങ്ങിയ വാതിൽ/ഞെരുക്കമുള്ള വഴി എന്നീ സമാന്തര ദൃശ്യങ്ങൾ നിലനിർത്തുകയും ചെയ്തു.
