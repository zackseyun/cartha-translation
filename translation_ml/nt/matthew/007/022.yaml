  to: 'ആ ദിവസം പലരും എന്നോടു പറയും: “കർത്താവേ, കർത്താവേ, ഞങ്ങൾ അങ്ങയുടെ നാമത്തിൽ പ്രവചിക്കുകയും അങ്ങയുടെ നാമത്തിൽ ഭൂതങ്ങളെ പുറത്താക്കുകയും അങ്ങയുടെ നാമത്തിൽ അനേകം ശക്തിയേറിയ പ്രവൃത്തികൾ[a] ചെയ്യുകയും ചെയ്തില്ലേ?”'
  rationale: 'Only a stylistic adjustment is needed: “ശക്തിയേറിയ പ്രവൃത്തികൾ” is more natural modern Malayalam than “ശക്തിപ്രവൃത്തികൾ.” It continues to render δυνάμεις as powerful deeds and leaves the more specific ‘miracles’ interpretation in the footnote, as in the English audit trail.'
