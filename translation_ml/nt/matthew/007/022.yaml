id: MAT.7.22
reference: Matthew 7:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πολλοὶ ἐροῦσίν μοι ἐν ἐκείνῃ τῇ ἡμέρᾳ· Κύριε κύριε, οὐ τῷ σῷ ὀνόματι ἐπροφητεύσαμεν, καὶ τῷ σῷ ὀνόματι δαιμόνια ἐξεβάλομεν, καὶ τῷ σῷ ὀνόματι δυνάμεις πολλὰς ἐποιήσαμεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/022.yaml
  text: Many will say to me on that day[a], ‘Lord, Lord, did we not prophesy in your name, and cast out demons in your name, and do many mighty works in your name?’
translation:
  language: ml
  text: 'ആ ദിവസം പലരും എന്നോടു പറയും: “കർത്താവേ, കർത്താവേ, ഞങ്ങൾ അങ്ങയുടെ നാമത്തിൽ പ്രവചിക്കുകയും അങ്ങയുടെ നാമത്തിൽ ഭൂതങ്ങളെ പുറത്താക്കുകയും അങ്ങയുടെ നാമത്തിൽ അനേകം ശക്തിയേറിയ പ്രവൃത്തികൾ[a] ചെയ്യുകയും ചെയ്തില്ലേ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അനേകം അത്ഭുതങ്ങൾ പ്രവർത്തിക്കുകയും” അല്ലെങ്കിൽ “ശക്തി പ്രകടമാക്കുന്ന അനേകം പ്രവൃത്തികൾ ചെയ്യുകയും.” ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “അനേകം ശക്തികൾ” എന്നാണ്; സുവിശേഷങ്ങളിൽ ഈ പ്രയോഗം പലപ്പോഴും അത്ഭുതകരമായ പ്രവൃത്തികളെ സൂചിപ്പിക്കുന്നു.
    reason: δύναμις എന്ന പദത്തിന്റെ ‘ശക്തി’ എന്ന അക്ഷരാർഥവും ‘അത്ഭുതപ്രവൃത്തി’ എന്ന സന്ദർഭാർഥവും ഒരുമിച്ച് വായനക്കാരനു കാണിക്കാൻ.
lexical_decisions:
- source_word: πολλοὶ
  choice: പലരും
  rationale: പുരുഷലിംഗ ബഹുവചന വിശേഷണം നാമപദമായി ഉപയോഗിച്ചിരിക്കുന്നു. ഗ്രീക്കിൽ ഇല്ലാത്ത ‘ആളുകൾ’ ചേർക്കാതെ മലയാളത്തിൽ സ്വാഭാവികമായി അർഥം നൽകുന്നു.
- source_word: ἐροῦσίν μοι
  choice: എന്നോടു പറയും
  rationale: λέγω എന്ന ക്രിയയുടെ ഭാവികാലരൂപവും ദത്തിവിഭക്തിയിലുള്ള സർവനാമവും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: ആ ദിവസം
  rationale: കാലസൂചകമായ ഗ്രീക്ക് പ്രയോഗം സ്വാഭാവികമായി നൽകുന്നു; ന്യായവിധിദിവസം എന്ന സന്ദർഭാർഥം മുഖ്യവാക്യത്തിൽ വിശദീകരിച്ചു ചേർക്കുന്നില്ല.
- source_word: Κύριε κύριε
  choice: കർത്താവേ, കർത്താവേ
  rationale: വിളിവിഭക്തിയും ഊന്നലും അപേക്ഷാഭാവവും പ്രകടമാക്കുന്ന ആവർത്തനം അതേപടി നിലനിർത്തുന്നു.
- source_word: οὐ ... ἐπροφητεύσαμεν
  choice: ഞങ്ങൾ ... പ്രവചിക്കുകയും ... ചെയ്തില്ലേ?
  rationale: അനുകൂലമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന നിഷേധചോദ്യത്തിന്റെ സ്വഭാവം ‘ചെയ്തില്ലേ?’ എന്ന മലയാളരൂപം നിലനിർത്തുന്നു; προφητεύω എന്നതിന് ‘പ്രവചിക്കുക’ എന്ന പതിവ് അർഥം ഉപയോഗിക്കുന്നു.
- source_word: τῷ σῷ ὀνόματι
  choice: അങ്ങയുടെ നാമത്തിൽ
  rationale: ഒരാളുടെ നാമത്തിന്റെ അധികാരത്തിലോ ആ നാമം വിളിച്ചപേക്ഷിച്ചോ പ്രവർത്തിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതമായ പ്രയോഗം. ഗ്രീക്കിലെ മൂന്നു ആവർത്തനങ്ങളും വാക്യത്തിലെ ഊന്നലിനായി നിലനിർത്തുന്നു.
- source_word: δαιμόνια ἐξεβάλομεν
  choice: ഭൂതങ്ങളെ പുറത്താക്കുകയും
  rationale: ἐκβάλλωയും δαιμόνιαയും ചേർന്ന പ്രയോഗത്തിന്റെ നേരിട്ടുള്ള അർഥം നൽകുന്നു; ഭൂതോച്ചാടനത്തെ അനാവശ്യമായി വിശദീകരിക്കുന്നില്ല.
- source_word: δυνάμεις πολλὰς ἐποιήσαμεν
  choice: അനേകം ശക്തിപ്രവൃത്തികൾ ചെയ്യുകയും
  rationale: δύναμις എന്ന പദത്തിലെ ‘ശക്തി’ എന്ന ആശയബന്ധം നിലനിർത്തിക്കൊണ്ട് സുവിശേഷങ്ങളിലെ അത്ഭുതകരമായ പ്രവൃത്തികൾ എന്ന പ്രയോഗാർഥം സൂചിപ്പിക്കുന്നു; മറ്റ് സ്വാഭാവിക വിവർത്തനങ്ങൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: യേശുവിനെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്ന κύριος എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: കർത്താവേ
  alternative: ഗുരുവേ / യജമാനനേ
  rationale: സാധാരണ അധികാരപദവിയെയും ക്രിസ്തുവിനെക്കുറിച്ചുള്ള ദൈവശാസ്ത്രപരമായ ഭാരം വഹിക്കാനുള്ള സാധ്യതയെയും ഒരുപോലെ നിലനിർത്തുന്ന പതിവ് വിവർത്തനം; വാക്യം പറയുന്നതിലധികം വ്യക്തമാക്കുന്നില്ല.
- issue: ‘ആ ദിവസം’ എന്ന പ്രയോഗത്തിന്റെ അന്ത്യകാലസൂചന
  choice: ആ ദിവസം
  alternative: ന്യായവിധിദിവസത്തിൽ
  rationale: സന്ദർഭം അന്തിമന്യായവിധിയിലേക്കു വിരൽചൂണ്ടുന്നുവെങ്കിലും ഗ്രീക്ക് പാഠം ‘ആ ദിവസം’ എന്നു മാത്രമാണ് പറയുന്നത്. അതിനാൽ സൂചനയെ വിശദീകരിച്ചു തീർക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ നാമപ്രയോഗത്തിന്റെ മൂന്നുതവണയുള്ള ആവർത്തനവും ഒരൊറ്റ നിഷേധചോദ്യത്തിന്റെ ഘടനയും കഴിയുന്നത്ര നിലനിർത്തിയിരിക്കുന്നു. നേരിട്ടുള്ള അഭിസംബോധനയിൽ മാന്യതയ്ക്കായി ‘അങ്ങയുടെ’ ഉപയോഗിച്ചു.
