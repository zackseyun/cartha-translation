id: MAT.7.9
reference: Matthew 7:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἢ τίς ⸀ἐστιν ἐξ ὑμῶν ἄνθρωπος, ὃν ⸀αἰτήσει ὁ υἱὸς αὐτοῦ ἄρτον— μὴ λίθον ἐπιδώσει αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/009.yaml
  text: Or what man is there among you whose son asks him for bread[a], and he will give him a stone?
translation:
  language: ml
  text: അല്ലെങ്കിൽ, നിങ്ങളിൽ ഏതു മനുഷ്യനാണ്[a] തന്റെ മകൻ അപ്പം ചോദിച്ചാൽ അവന് കല്ല് കൊടുക്കും?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മനുഷ്യൻ’ ഇവിടെ പ്രതിനിധിപരമായ അർഥത്തിലാണ്; സ്വാഭാവികമായി ‘നിങ്ങളിൽ ആരാണ്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: അല്ലെങ്കിൽ
  rationale: മുൻവാക്യത്തിലെ ഉപദേശത്തോട് അടുത്ത വാചാടോപചോദ്യം ബന്ധിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളസംയോജകം.
- source_word: τίς ἐστιν ἐξ ὑμῶν ἄνθρωπος
  choice: നിങ്ങളിൽ ഏതു മനുഷ്യനാണ്
  rationale: ഭാഗികത സൂചിപ്പിക്കുന്ന ἐξ ὑμῶν എന്ന പ്രയോഗവും പ്രതിനിധിപരമായ ഏകവചനമായ ἄνθρωπος എന്ന പദവും നിലനിർത്തുന്നു; മലയാളത്തിൽ വാചാടോപചോദ്യമായി വ്യക്തമാണ്.
- source_word: ὃν αἰτήσει ὁ υἱὸς αὐτοῦ
  choice: തന്റെ മകൻ ... ചോദിച്ചാൽ
  rationale: ഗ്രീക്ക് ബന്ധവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായ സോപാധിക ഘടനയാക്കി; ഭാവികാലക്രിയ പൊതുവായ സങ്കൽപ്പസാഹചര്യത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ചോദിച്ചാൽ’ യോജിക്കുന്നു.
- source_word: ἄρτον
  choice: അപ്പം
  rationale: അടിസ്ഥാന ഭക്ഷണമായ bread എന്ന നേരിട്ടുള്ള അർഥം; ‘ഭക്ഷണം’ എന്നു പൊതുവാക്കുകയോ പ്രത്യേകമായ അപ്പക്കഷണം എന്നു ചുരുക്കുകയോ ചെയ്യുന്നില്ല.
- source_word: μὴ λίθον ἐπιδώσει αὐτῷ
  choice: അവന് കല്ലു കൊടുക്കുക?
  rationale: μή നിഷേധാത്മക ഉത്തരമാണ് പ്രതീക്ഷിക്കുന്നതെന്ന് സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ഈ വാചാടോപചോദ്യരൂപം ആ പ്രതീക്ഷ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: പ്രതിനിധിപരമായ ലിംഗസൂചന
  choice: ഏതു മനുഷ്യനാണ്
  alternative: നിങ്ങളിൽ ആരാണ്
  rationale: ἄνθρωπος ഇവിടെ ഒരൊറ്റ പുരുഷനെ മാത്രം വേർതിരിക്കുന്നതല്ല, ശ്രോതാക്കളെ പ്രതിനിധീകരിക്കുന്ന ഏകവചനമാണ്. ‘മനുഷ്യൻ’ മൂലപദം തുറന്നുകാട്ടുന്നു; അടിക്കുറിപ്പ് അതിന്റെ ഉൾക്കൊള്ളുന്ന പ്രതിനിധിപരമായ പ്രയോഗം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വാചാടോപചോദ്യരൂപം. ‘തന്റെ മകൻ’ എന്നത് കർത്താവിലേക്കുള്ള ബന്ധം അസന്ദിഗ്ധമാക്കുന്നു; ‘കല്ലു’ എന്ന സാധാരണ രൂപം അപ്പത്തോടുള്ള ദൃശ്യവിരുദ്ധത നിലനിർത്തുന്നു.
