  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ εὑρὼν τὴν ψυχὴν αὐτοῦ ἀπολέσει αὐτήν, καὶ ὁ ἀπολέσας τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ εὑρήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/039.yaml
  text: The one who finds his life will lose it[a], and the one who loses his life for my sake will find it.
translation:
  language: ml
  text: തന്റെ ജീവൻ കണ്ടെത്തുന്നവൻ അതു നഷ്ടപ്പെടുത്തും; എനിക്കുവേണ്ടി തന്റെ ജീവൻ നഷ്ടപ്പെടുത്തുന്നവൻ അതു കണ്ടെത്തും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: രണ്ടു പാദങ്ങളിലും ‘ആത്മാവ്’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്കിലെ ψυχή എന്ന പദത്തിന് ‘ജീവൻ’ എന്നും ‘ആത്മാവ്’ എന്നും അർഥമാകാം; എന്നാൽ ശിഷ്യത്വത്തിൽ ഒരാൾ തന്റെ ജീവൻ നഷ്ടപ്പെടുത്തുകയും കണ്ടെത്തുകയും ചെയ്യുന്ന ഈ സന്ദർഭത്തിന് ‘ജീവൻ’ കൂടുതൽ യോജിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ εὑρὼν
  choice: കണ്ടെത്തുന്നവൻ
  rationale: നാമവാചകമായി പ്രവർത്തിക്കുന്ന ഗ്രീക്ക് ഭൂതകാല കൃദന്തം ഒരു പൊതുപ്രതിനിധിയായ വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘കണ്ടെത്തുന്നവൻ’ ഈ പൊതുവായ ഏകവചന അർഥവും ‘കണ്ടെത്തുക’ എന്ന ആവർത്തനവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ψυχήν
  choice: ജീവൻ
  rationale: ഈ ശിഷ്യത്വസന്ദർഭത്തിൽ ψυχή പ്രധാനമായും ഒരാളുടെ ജീവനെ സൂചിപ്പിക്കുന്നു; ശരീരത്തിൽനിന്ന് വേർതിരിച്ച അമൂർത്തമായ ആത്മാവിനെ മാത്രം അല്ല. ‘ജീവൻ’ എന്നത് കണ്ടെത്തൽ–നഷ്ടപ്പെടുത്തൽ എന്ന വിരോധാഭാസത്തിനു യോജിക്കുന്നു.
- source_word: ἀπολέσει / ὁ ἀπολέσας
  choice: നഷ്ടപ്പെടുത്തും / നഷ്ടപ്പെടുത്തുന്നവൻ
  rationale: ഇവിടെ ἀπόλλυμι നശിപ്പിക്കൽ എന്നതിലുപരി നഷ്ടപ്പെടൽ/നഷ്ടപ്പെടുത്തൽ എന്ന അർഥത്തിലാണ്. സകർമകമായ ‘നഷ്ടപ്പെടുത്തുക’ മൂലത്തിലെ αὐτήν എന്ന കർമത്തെ നിലനിർത്തുകയും പൊതുസത്യസ്വഭാവമുള്ള വാക്യഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കുകയും ചെയ്യുന്നു.
- source_word: ἕνεκεν ἐμοῦ
  choice: എനിക്കുവേണ്ടി
  rationale: ἕνεκεν കൂടിയ ഷഷ്ഠീവിഭക്തി കാരണം അല്ലെങ്കിൽ ഉദ്ദേശ്യം/നിമിത്തം സൂചിപ്പിക്കുന്നു. ‘എനിക്കുവേണ്ടി’ യേശുവിനോടുള്ള നിഷ്ഠയുടെ വ്യക്തിപരമായ പ്രേരണ സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: εὑρήσει
  choice: കണ്ടെത്തും
  rationale: ആദ്യ പാദത്തിലെ εὑρὼν എന്ന ക്രിയയോടുള്ള ഉദ്ദേശ്യപൂർവമായ പദസാമ്യം കാത്തുസൂക്ഷിച്ച് വിരോധാഭാസത്തിന്റെ സമമിതി നിലനിർത്തുന്നു.
- source_word: αὐτοῦ / αὐτήν
  choice: തന്റെ / അതു
  rationale: ഗ്രീക്കിലെ പ്രതിനിധിപരമായ ഏകവചനഘടന മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു. ‘തന്റെ’ കർത്താവിലേക്കുള്ള തിരിച്ചുസൂചന വ്യക്തമാക്കുകയും ‘അതു’ ജീവനെ വീണ്ടും സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ശിഷ്യത്വത്തിന്റെ വിരോധാഭാസത്തിൽ ψυχή എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ജീവൻ
  alternative: ആത്മാവ്
  rationale: ഇവിടെ ആശയം യേശുവിനോടുള്ള നിഷ്ഠയിൽ സ്വന്തം ജീവൻ കാത്തുസൂക്ഷിക്കുകയോ വിട്ടുകൊടുക്കുകയോ ചെയ്യുന്നതാണ്; ശരീരവും ആത്മാവും തമ്മിലുള്ള വേർതിരിവല്ല മുഖ്യവിഷയം. അതേസമയം ψυχή എന്ന പദത്തിന്റെ വിശാലമായ അർഥപരിധി കണക്കിലെടുത്ത് ‘ആത്മാവ്’ എന്ന പരമ്പരാഗത സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമേറിയതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലത്തിലെ കണ്ടെത്തുക–നഷ്ടപ്പെടുത്തുക–കണ്ടെത്തുക എന്ന വാചകസമമിതിയും വിരോധാഭാസവും സൂക്ഷിച്ചിരിക്കുന്നു.
