lexical_decisions:
- source_word: εἰσερχόμενοι
  choice: നിങ്ങൾ … പ്രവേശിക്കുമ്പോൾ
  rationale: വർത്തമാനകാല കർത്തൃവിശേഷണരൂപം ബഹുവചന കർത്താവിനോടു ചേർന്ന് മുഖ്യകല്പനയുടെ സമയത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ കാലവാക്യമായി പരിഭാഷപ്പെടുത്തി.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇത് ശക്തമായ വിരോധമല്ല, മൃദുവായ ആശയബന്ധമാണ്. മലയാളത്തിലെ കാലവാക്യഘടനയിൽ ആ ബന്ധം സ്വാഭാവികമായി ഉൾക്കൊള്ളപ്പെടുന്നു.
- source_word: τὴν οἰκίαν
  choice: ആ വീട്ടിൽ
  rationale: οἰκία എന്നത് വീടിനെയോ വീട്ടുകാരെയോ സൂചിപ്പിക്കാം. ഇവിടെ പ്രവേശിക്കുന്ന സ്ഥലമെന്ന നേരിട്ടുള്ള അർഥം നിലനിർത്താൻ ‘വീട്’ സ്വീകരിച്ചു; നിർദിഷ്ടത ‘ആ’യിലൂടെ പ്രകടമാക്കി.
- source_word: ἀσπάσασθε
  choice: അഭിവാദ്യം ചെയ്യുക
  rationale: രണ്ടാം പുരുഷ ബഹുവചനത്തിലുള്ള കല്പനയാണ്. ‘അഭിവാദ്യം ചെയ്യുക’ ആധുനിക മലയാളത്തിൽ മാന്യവും വ്യക്തവുമായ തത്തുല്യപ്രയോഗമാണ്.
- source_word: αὐτήν
  choice: അതിനെ
  rationale: സ്ത്രീലിംഗ ഏകവചന സർവനാമം οἰκίαν എന്ന പദത്തെയാണ് വ്യാകരണപരമായി സൂചിപ്പിക്കുന്നത്. വീടിനെ അഭിസംബോധന ചെയ്യുന്ന ഗ്രീക്ക് രൂപം പ്രധാനവാചകത്തിൽ നിലനിർത്തി; താമസക്കാരെയാണ് ഉദ്ദേശിക്കുന്നതാകാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
theological_decisions:
- issue: വീടിനെ നേരിട്ട് അഭിവാദ്യം ചെയ്യുന്നതോ വീട്ടിലുള്ളവരെ വ്യക്തമാക്കുന്നതോ
  choice: പ്രധാനവാചകത്തിൽ ‘അതിനെ അഭിവാദ്യം ചെയ്യുക’ എന്ന് രൂപകാലങ്കാരപരമായ പ്രയോഗം നിലനിർത്തി
  alternative: ‘ആ വീട്ടിലുള്ളവരെ അഭിവാദ്യം ചെയ്യുക’
  rationale: ഗ്രീക്കിലെ αὐτήν എന്ന ഏകവചന സർവനാമം οἰκίαν എന്ന ‘വീട്’ എന്ന പദത്തെയാണ് നേരിട്ട് സൂചിപ്പിക്കുന്നത്. ഉദ്ദേശിക്കപ്പെടുന്നത് അവിടെ താമസിക്കുന്നവരാകാമെങ്കിലും, ആ വ്യാഖ്യാനം പ്രധാനവാചകത്തിൽ ചേർത്ത് മൂലത്തിലെ രൂപകാലങ്കാരം ഇല്ലാതാക്കാതെ അടിക്കുറിപ്പിൽ നൽകുന്നു.
