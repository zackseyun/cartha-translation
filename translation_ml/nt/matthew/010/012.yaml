  register: ആധുനിക നിലവാര മലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘അതിനെ അഭിവാദ്യം ചെയ്യുക’ മലയാളത്തിൽ അല്പം അസാധാരണമായി കേൾക്കുമെങ്കിലും, മൂലഗ്രീക്കിലെ യഥാർഥ രൂപകാലങ്കാരവും അതിലുള്ള വ്യാഖ്യാനസാധ്യതയും സംരക്ഷിക്കാൻ മനപ്പൂർവം നിലനിർത്തി.
