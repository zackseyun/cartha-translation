    text: 'അല്ലെങ്കിൽ: ‘ആ വീട്ടിലുള്ളവരെ അഭിവാദ്യം ചെയ്യുക.’ ഗ്രീക്കിൽ ‘അതിനെ അഭിവാദ്യം ചെയ്യുക’ എന്നാണ്; ‘അതിനെ’ എന്നത് വീടിനെ സൂചിപ്പിക്കുന്നു, എന്നാൽ അവിടെ താമസിക്കുന്നവരെ ഉദ്ദേശിക്കുന്ന ലക്ഷണപ്രയോഗമായിരിക്കാം.'
