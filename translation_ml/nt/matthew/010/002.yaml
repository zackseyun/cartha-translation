  terminology: ‘അപ്പൊസ്തലന്മാർ,’ ‘പത്രോസ്,’ ‘ശിമോൻ,’ ‘യാക്കോബ്,’ and ‘യോഹന്നാൻ’ are appropriate established biblical terminology. ‘അന്ത്രെയാസ്’ is the more customary modern Malayalam biblical form for Andrew. The footnote should present prominence as a possibility, rather than wording it as an added assertion.
  issues:
  - severity: medium
    issue: The coordination expressed by καί is not represented between Simon and Andrew or between James and John.
    rationale: The semicolon-separated items can be read as four independent entries, whereas the Greek pairs Simon with Andrew and James with John using ‘and.’
  - severity: low
    issue: The footnote wording (‘not only ... but also’) can sound stronger than the Greek’s possible nuance.
    rationale: πρῶτος may denote order and may possibly carry a nuance of prominence; the note should preserve that possibility without asserting both senses.
