  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τῶν δὲ δώδεκα ἀποστόλων τὰ ὀνόματά ἐστιν ταῦτα· πρῶτος Σίμων ὁ λεγόμενος Πέτρος καὶ Ἀνδρέας ὁ ἀδελφὸς ⸀αὐτοῦ, Ἰάκωβος ὁ τοῦ Ζεβεδαίου καὶ Ἰωάννης ὁ ἀδελφὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/002.yaml
  text: 'These are the names of the twelve apostles: first[a], Simon who is called Peter, and Andrew his brother; James the son of Zebedee, and John his brother,'
translation:
  language: ml
  text: 'പന്ത്രണ്ട് അപ്പൊസ്തലന്മാരുടെ പേരുകൾ ഇവയാണ്: ഒന്നാമൻ[a], പത്രോസ് എന്നു വിളിക്കപ്പെടുന്ന ശിമോനും അവന്റെ സഹോദരൻ അന്ത്രെയാസും; സെബെദിയുടെ മകൻ യാക്കോബും അവന്റെ സഹോദരൻ യോഹന്നാനും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഒന്നാമൻ’ എന്നത് പട്ടികയിലെ ആദ്യസ്ഥാനം സൂചിപ്പിക്കാം; പന്ത്രണ്ടുപേരിൽ പ്രമുഖത്വവും സൂചിപ്പിക്കാം.
    reason: πρῶτος എന്ന പദത്തിന്റെ ക്രമാർഥത്തോടൊപ്പം സാധ്യമായ പ്രമുഖത്വാർഥവും സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇവിടെ δέ നാമാവലിയിലേക്കുള്ള നേരിയ ആശയമാറ്റം അടയാളപ്പെടുത്തുന്നു. മലയാളത്തിൽ വാക്യക്രമവും സന്ദർഭവും ആ മാറ്റം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നതിനാൽ ‘ഇപ്പോൾ’ പോലുള്ള കാലസൂചകപദം ചേർത്തിട്ടില്ല.
- source_word: δώδεκα ἀποστόλων
  choice: പന്ത്രണ്ട് അപ്പൊസ്തലന്മാരുടെ
  rationale: സുവിശേഷസന്ദർഭത്തിൽ യേശു നിയോഗിച്ച അംഗീകൃത പന്ത്രണ്ടംഗസംഘത്തെയാണ് ἀπόστολοι സൂചിപ്പിക്കുന്നത്; മലയാള ക്രൈസ്തവപ്രയോഗത്തിൽ തിരിച്ചറിയാവുന്ന പരമ്പരാഗത പദമാണ് ‘അപ്പൊസ്തലന്മാർ’.
- source_word: τὰ ὀνόματά ἐστιν ταῦτα
  choice: പേരുകൾ ഇവയാണ്
  rationale: ഗ്രീക്കിലെ നിർദ്ദേശകഘടന നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ ആധുനിക മലയാളം നൽകുന്നു.
- source_word: πρῶτος
  choice: ഒന്നാമൻ
  rationale: പുരുഷലിംഗ ഏകവചനമായ പദം ശിമോനെ വിശേഷിപ്പിക്കുകയും നാമാവലിയിലെ ആദ്യസ്ഥാനം നേരിട്ട് സൂചിപ്പിക്കുകയും ചെയ്യുന്നു; സാധ്യമായ പ്രമുഖസ്ഥാനാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: ὁ λεγόμενος Πέτρος
  choice: പത്രോസ് എന്നു വിളിക്കപ്പെടുന്ന
  rationale: ശിമോനെ ‘പത്രോസ്’ എന്ന പേരിലൂടെ തിരിച്ചറിയിക്കുന്ന പങ്കാളിത്തപ്രയോഗം സുതാര്യമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: ὁ ἀδελφὸς αὐτοῦ
  choice: അവന്റെ സഹോദരൻ
  rationale: ആദ്യപ്രയോഗത്തിലെ αὐτοῦ ശിമോനെയും രണ്ടാമത്തേത് യാക്കോബിനെയും സൂചിപ്പിക്കുന്നു; രണ്ടിടത്തും യഥാർത്ഥ സഹോദരബന്ധമാണ് ഉദ്ദേശ്യം.
- source_word: ὁ τοῦ Ζεβεδαίου
  choice: സെബെദിയുടെ മകൻ
  rationale: ഗ്രീക്കിലെ ജനിതകബന്ധസൂചക പ്രയോഗം സന്ദർഭത്തിൽ പുത്രത്വം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ അത് വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിച്ചു.
theological_decisions:
- issue: ശിമോൻ/പത്രോസിനോടു ചേർന്ന πρῶτος എന്നതിന്റെ അർഥം
  choice: പ്രധാനപാഠത്തിൽ ‘ഒന്നാമൻ’ എന്നു നൽകി പട്ടികയിലെ ക്രമാർഥം നിലനിർത്തി.
  alternative: പന്ത്രണ്ടുപേരിൽ പ്രമുഖനോ നേതൃസ്ഥാനമുള്ളവനോ എന്ന സൂചന.
  rationale: πρῶτος ക്രമത്തിലെ ആദ്യസ്ഥാനം സൂചിപ്പിക്കാം; പ്രമുഖത്വത്തിന്റെ സൂചനയും സാധ്യതയാണ്. വാക്യം മാത്രം അധികാരപ്രാഥമ്യത്തെക്കുറിച്ചുള്ള പ്രത്യേക സിദ്ധാന്തനിഗമനം നിർബന്ധിക്കുന്നില്ല. അതിനാൽ ലളിതമായ പദാർഥം പ്രധാനപാഠത്തിലും മറ്റുസാധ്യത അടിക്കുറിപ്പിലും നൽകി ദൈവശാസ്ത്രപരമായ സംഘർഷം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. വ്യക്തിനാമങ്ങൾക്ക് മലയാള ബൈബിൾവായനയിൽ പരിചിതമായ രൂപങ്ങൾ ഉപയോഗിച്ചു. ഗ്രീക്കിലെ ലളിതമായ നാമാവലി ഘടന നിലനിർത്താൻ അർദ്ധവിരാമങ്ങൾ പ്രയോഗിച്ചു; ഉറവിടത്തിൽ ഇല്ലാത്ത കാലസൂചകമോ വ്യാഖ്യാനാത്മകമായ നേതൃപദവിയോ ചേർത്തിട്ടില്ല.
