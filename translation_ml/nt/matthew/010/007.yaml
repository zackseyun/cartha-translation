id: MAT.10.7
reference: Matthew 10:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πορευόμενοι δὲ κηρύσσετε λέγοντες ὅτι Ἤγγικεν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/007.yaml
  text: And as you go[a], proclaim, saying[c][b], ‘The kingdom of heaven has drawn near.’
translation:
  language: ml
  text: 'പോകുമ്പോൾ ഇങ്ങനെ പ്രസംഗിക്കുവിൻ: “സ്വർഗരാജ്യം അടുത്തുവന്നിരിക്കുന്നു.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സമീപിച്ചിരിക്കുന്നു’ എന്നും ‘അടുത്തിരിക്കുന്നു’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്ക് പൂർണ്ണകാലക്രിയ, സമീപിച്ചെത്തിയ അവസ്ഥ ഇപ്പോഴും നിലനിൽക്കുന്നു എന്നതിന് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
  - marker: b
    text: മത്തായി പതിവായി ‘സ്വർഗരാജ്യം’ എന്നു പറയുന്നു; മറ്റു സുവിശേഷങ്ങളിൽ പലപ്പോഴും ‘ദൈവരാജ്യം’ എന്നാണ് കാണുന്നത്.
    reason: cross_reference
lexical_decisions:
- source_word: πορευόμενοι
  choice: പോകുമ്പോൾ
  rationale: വർത്തമാനകാല കൃദന്തം മുഖ്യകല്പനയോടൊപ്പമുള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘പോകുമ്പോൾ’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികമായി ആ ബന്ധം നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: ഇത് നേരിയ ബന്ധകമാണ്; ഒറ്റവാക്യമായ ഈ സന്ദർഭത്തിൽ മലയാളത്തിൽ നിർബന്ധമായി പ്രകടിപ്പിച്ചാൽ കൃത്രിമത്വം വരാം. വാക്യക്രമം തന്നെ മുൻനിർദേശങ്ങളോടുള്ള തുടർച്ച കാണിക്കുന്നു.
- source_word: κηρύσσετε
  choice: പ്രസംഗിക്കുവിൻ
  rationale: അധികാരപൂർവമായ പരസ്യപ്രഖ്യാപനം എന്ന ആശയം നൽകുന്ന കല്പനാരൂപം. ‘അറിയിക്കുവിൻ’ എന്നതിനെക്കാൾ പൊതുഘോഷണത്തിന്റെ ഭാവം നിലനിർത്തുന്നു.
- source_word: λέγοντες
  choice: ഇങ്ങനെ
  rationale: തുടർന്നുവരുന്നത് പ്രഖ്യാപനത്തിന്റെ ഉള്ളടക്കമാണെന്ന് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘പറഞ്ഞുകൊണ്ട് പ്രസംഗിക്കുവിൻ’ എന്ന അനാവശ്യ ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: ὅτι
  choice: ഉദ്ധരണിയിലൂടെ പ്രകടിപ്പിച്ചു
  rationale: ὅτι നേരിട്ടുള്ള സന്ദേശം അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ ഉദ്ധരണിചിഹ്നങ്ങൾ ഉപയോഗിക്കുന്നത് സ്വാഭാവികമാണ്.
- source_word: ἤγγικεν
  choice: അടുത്തുവന്നിരിക്കുന്നു
  rationale: ഗ്രീക്ക് പൂർണ്ണകാലം സമീപിച്ചെത്തിയതും അതിന്റെ ഫലം ഇപ്പോഴും നിലനിൽക്കുന്നതുമായ ഭാവം നൽകുന്നു. ഈ രൂപം ‘അടുത്തിരിക്കുന്നു’ എന്നതിനെക്കാൾ ആ ഭാവം നന്നായി സൂക്ഷിക്കുന്നു.
- source_word: ἡ βασιλεία
  choice: രാജ്യം
  rationale: ഭരണവും രാജ്യമണ്ഡലവും ഉൾക്കൊള്ളാവുന്ന സ്ഥാപിതവും വിശാലവുമായ തുല്യപദമാണ്.
- source_word: τῶν οὐρανῶν
  choice: സ്വർഗ
  rationale: മത്തായിയുടെ സവിശേഷമായ ‘സ്വർഗങ്ങളുടെ രാജ്യം’ എന്ന പ്രയോഗത്തിന് സ്വാഭാവികവും സ്ഥാപിതവുമായ മലയാളരൂപം; വാച്യമായ ബഹുവചനം മലയാളത്തിൽ അസ്വാഭാവികമാണ്.
theological_decisions:
- issue: ‘സ്വർഗരാജ്യം’ എന്ന പ്രയോഗത്തിന്റെ അർഥവ്യാപ്തി
  choice: ‘സ്വർഗരാജ്യം’ എന്ന മത്തായിയുടെ സവിശേഷ പദപ്രയോഗം നിലനിർത്തി.
  alternative: ‘ദൈവരാജ്യം’ അല്ലെങ്കിൽ ‘സ്വർഗത്തിന്റെ ഭരണം’
  rationale: സമാന്തര സുവിശേഷങ്ങളുമായി സമന്വയിപ്പിക്കാതെയും ‘രാജ്യം’ എന്നതിലെ ഭരണവും മണ്ഡലവും ഉൾക്കൊള്ളുന്ന അർഥവ്യാപ്തി ചുരുക്കാതെയും മൂലപാഠത്തിന്റെ രൂപം സംരക്ഷിക്കുന്നു.
- issue: ἤγγικεν എന്ന പൂർണ്ണകാലക്രിയയുടെ ഭാവം
  choice: ‘അടുത്തുവന്നിരിക്കുന്നു’
  alternative: ‘അടുത്തിരിക്കുന്നു’ അല്ലെങ്കിൽ ‘സമീപിച്ചിരിക്കുന്നു’
  rationale: സമീപിച്ചെത്തിയ സംഭവവും തുടരുന്ന ഫലവും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു; രാജ്യത്തെക്കുറിച്ചുള്ള വിപുലമായ ദൈവശാസ്ത്രചോദ്യങ്ങൾ വിവർത്തനം തന്നെ തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വായനാസൗകര്യവും നിലനിർത്തി. ‘പ്രസംഗിക്കുവിൻ’ എന്ന കല്പനാരൂപം പൊതുഘോഷണത്തിന്റെ ഭാവം നൽകുന്നു. λέγοντες എന്നത് ഒഴിവാക്കാതെ ‘ഇങ്ങനെ’ എന്ന ഉള്ളടക്കസൂചകത്തിലൂടെ സ്വാഭാവികമായി പ്രതിഫലിപ്പിച്ചു.
