id: MAT.10.14
reference: Matthew 10:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἂν μὴ δέξηται ὑμᾶς μηδὲ ἀκούσῃ τοὺς λόγους ὑμῶν, ἐξερχόμενοι ⸀ἔξω τῆς οἰκίας ἢ τῆς πόλεως ἐκείνης ἐκτινάξατε τὸν κονιορτὸν τῶν ποδῶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/014.yaml
  text: And whoever does not receive you or listen to your words[a], as you go out of that house or that town[c][b], shake off the dust from your feet.
translation:
  language: ml
  text: ആരെങ്കിലും നിങ്ങളെ സ്വീകരിക്കാതിരിക്കുകയോ നിങ്ങളുടെ വാക്കുകൾ കേൾക്കാതിരിക്കുകയോ ചെയ്താൽ[a], ആ വീട്ടിൽനിന്നോ ആ പട്ടണത്തിൽനിന്നോ[c] പുറത്തുപോകുമ്പോൾ നിങ്ങളുടെ കാലുകളിലെ പൊടി തട്ടിക്കളയുക.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങളെ സ്വീകരിക്കുകയോ നിങ്ങളുടെ വാക്കുകൾക്കു ചെവികൊടുക്കുകയോ ചെയ്യാത്ത ആരായാലും.”
    reason: lexical_alternative
  - marker: b
    text: “കാലുകളിലെ പൊടി തട്ടിക്കളയുക” എന്നത് സന്ദേശം നിരസിച്ചവരുമായുള്ള ബന്ധം വിച്ഛേദിക്കുന്നതിന്റെയും അവർക്കെതിരായ ന്യായവിധിയുടെയും പ്രതീകാത്മക പ്രവൃത്തിയായിരുന്നു.
    reason: cultural_note
  - marker: c
    text: അഥവാ, “ആ വീട്ടിൽനിന്നോ ആ നഗരത്തിൽനിന്നോ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἂν μὴ
  choice: ആരെങ്കിലും … ചെയ്താൽ
  rationale: അനിശ്ചിതവും പൊതുവുമായ വ്യവസ്ഥയെ സ്വാഭാവികമായ മലയാള വ്യവസ്ഥാരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: δέξηται ὑμᾶς
  choice: നിങ്ങളെ സ്വീകരിക്കുക
  rationale: ദൂതന്മാർക്കു നൽകുന്ന ആതിഥ്യത്തെയും അവരുടെ ദൗത്യത്തിന്റെ അംഗീകാരത്തെയും ഒരുപോലെ ഉൾക്കൊള്ളുന്ന വിശാലമായ പ്രയോഗം.
- source_word: μηδὲ ἀκούσῃ τοὺς λόγους ὑμῶν
  choice: നിങ്ങളുടെ വാക്കുകൾ കേൾക്കുക
  rationale: ἀκούω എന്നതിന്റെ അടിസ്ഥാന അർഥവും സന്ദേശം ശ്രദ്ധയോടെ സ്വീകരിക്കുക എന്ന സന്ദർഭസൂചനയും അമിതമായി വ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്നു.
- source_word: ἐξερχόμενοι ἔξω
  choice: പുറത്തുപോകുമ്പോൾ
  rationale: പുറത്തേക്കു പോകുന്ന അനുബന്ധപ്രവൃത്തിയെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി വ്യക്തമാക്കുന്നു.
- source_word: τῆς οἰκίας ἢ τῆς πόλεως ἐκείνης
  choice: ആ വീട്ടിൽനിന്നോ ആ പട്ടണത്തിൽനിന്നോ
  rationale: ആവർത്തിക്കുന്ന നിർദേശകഭാവം രണ്ടു നാമങ്ങളോടും നിലനിർത്തുന്നു; πόλις എന്നത് വലിപ്പം നിർണയിക്കാതെ ഇവിടെ ‘പട്ടണം’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: ἐκτινάξατε
  choice: തട്ടിക്കളയുക
  rationale: പൊടി ശക്തമായി നീക്കിക്കളയുന്ന പ്രതീകാത്മക പ്രവൃത്തിയെ മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τὸν κονιορτὸν τῶν ποδῶν ὑμῶν
  choice: നിങ്ങളുടെ കാലുകളിലെ പൊടി
  rationale: പൊടിയെന്ന മൂർത്തമായ ദൃശ്യവും അത് കാലുകളിൽനിന്ന് നീക്കുന്നതും കൃത്യമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: സന്ദേശം നിരസിക്കുന്നവരോടുള്ള പ്രതീകാത്മക ന്യായവിധിപ്രവൃത്തി
  choice: ‘നിങ്ങളുടെ കാലുകളിലെ പൊടി തട്ടിക്കളയുക’ എന്ന മൂർത്തമായ കല്പന പ്രധാനവാചകത്തിൽ അതേപടി നിലനിർത്തി.
  alternative: സമാന്തരവാക്യങ്ങളിൽനിന്ന് ‘അവർക്കെതിരായ സാക്ഷ്യമായി’ എന്നു ചേർക്കുക, അല്ലെങ്കിൽ ‘അവരെ ന്യായവിധിക്കു വിട്ടുകളയുക’ എന്നു വ്യാഖ്യാനപരമായി പരിഭാഷപ്പെടുത്തുക.
  rationale: ഈ വാക്യം പ്രവൃത്തിയുടെ അർഥം തുറന്നു വിശദീകരിക്കുന്നില്ല. അതിനാൽ സമാന്തരഭാഗങ്ങളിലെ ഭാഷ ഇറക്കുമതി ചെയ്യാതെ പ്രതീകവും അതിലുള്ള ദൈവശാസ്ത്രപരമായ ഭാരംയും നിലനിർത്തി; പശ്ചാത്തലം അടിക്കുറിപ്പിൽ മാത്രം സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ കല്പനാശൈലി ഉപയോഗിച്ചു. ‘സ്വീകരിക്കുക,’ ‘കേൾക്കുക,’ ‘പുറത്തുപോകുക,’ ‘തട്ടിക്കളയുക’ എന്നീ സാധാരണ പദങ്ങൾ മൂലവാചകത്തിന്റെ മൂർത്തതയും ഉദ്ദേശപൂർവമായ അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു.
