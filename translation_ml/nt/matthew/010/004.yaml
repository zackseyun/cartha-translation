    issue: The main text uses a dash apposition rather than clearly coordinating Simon and Judas.
    rationale: Greek has καὶ joining the two names. In a translated apostolic-list fragment, Malayalam paired -ഉം forms provide the natural coordination, and the participial identification should modify Judas directly.
  - severity: low
    issue: Footnote a uses “തീക്ഷ്ണമതക്കാരൻ” for the traditional understanding “Zealot.”
    rationale: This expression is unnatural and can suggest a narrowly religious or pejorative sense. “തീവ്രാഭിമാനി” is a clearer modern explanatory gloss without asserting more than the traditional interpretation.
  revised_text: കനാനായനായ ശിമോനും[a], അവനെ ഒറ്റിക്കൊടുത്ത ഇസ്കര്യോത്തായ യൂദാവും[b].
