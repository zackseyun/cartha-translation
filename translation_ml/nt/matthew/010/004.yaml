  text: Σίμων ὁ ⸀Καναναῖος καὶ Ἰούδας ⸀ὁ Ἰσκαριώτης ὁ καὶ παραδοὺς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/004.yaml
  text: Simon the Cananaean[a], and Judas Iscariot[b], who also betrayed him.
translation:
  language: ml
  text: കനാനായനായ ശിമോനും[a], അവനെ ഒറ്റിക്കൊടുത്ത ഇസ്കര്യോത്തായ യൂദാവും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തീവ്രാഭിമാനിയായ ശിമോൻ.” ഇവിടെ ഗ്രീക്കിലുള്ള “കനാനായൻ” എന്നത് അരമായയിലോ എബ്രായയിലോ നിന്നുള്ള ഒരു വിശേഷണത്തെ പ്രതിഫലിപ്പിക്കുന്നതാകാം; പരമ്പരാഗതമായി അതിനെ “തീവ്രാഭിമാനി” എന്നാണ് മനസ്സിലാക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അവനെ ഏൽപ്പിച്ചുകൊടുത്തവൻ.” ഗ്രീക്ക് ക്രിയയ്ക്ക് പൊതുവായി “ഏൽപ്പിച്ചുകൊടുക്കുക” എന്നർഥമുണ്ടെങ്കിലും, യൂദായുടെ കാര്യത്തിൽ ആഖ്യാനസന്ദർഭം “ഒറ്റിക്കൊടുക്കുക” എന്ന അർഥം സൂചിപ്പിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: Καναναῖος
  choice: കനാനായൻ
  rationale: ഗ്രീക്കിലെ അരമായ/എബ്രായ മൂലമുള്ള വിശേഷണം വ്യാഖ്യാനിച്ച് ‘തീക്ഷ്ണമതക്കാരൻ’ എന്നു മുഖ്യപാഠത്തിൽ നൽകാതെ ശബ്ദാന്തരണം ചെയ്യുന്നു; സാധാരണ വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: Ἰσκαριώτης
  choice: ഇസ്കര്യോത്ത്
  rationale: വ്യക്തിനാമത്തോടു ചേർന്ന പരമ്പരാഗത വിശേഷണത്തിന്റെ മലയാളത്തിലെ പരിചിതമായ ശബ്ദാന്തരണം.
- source_word: παραδοὺς
  choice: ഒറ്റിക്കൊടുത്തവൻ
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘ഏല്പിച്ചുകൊടുക്കുക’ എന്നതാണെങ്കിലും, യൂദായെ സംബന്ധിച്ച മത്തായിയുടെ ആഖ്യാനസന്ദർഭത്തിൽ വഞ്ചനാപൂർവമായ കൈമാറ്റം സ്വാഭാവികമായി അറിയിക്കുന്നു; വിശാലമായ പദാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ὁ καὶ παραδοὺς αὐτόν
  choice: അവനെ ഒറ്റിക്കൊടുത്തവൻ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ കർത്തൃവാചക കൃദന്തം യൂദായെ അവന്റെ പ്രവൃത്തിയാൽ തിരിച്ചറിയിക്കുന്നു. καίയുടെ ഊന്നൽ മലയാളവാക്യത്തിലെ തിരിച്ചറിയൽപ്രയോഗത്തിലൂടെ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
theological_decisions:
- issue: παραδοὺς എന്നത് നിഷ്പക്ഷമായി ‘ഏല്പിച്ചുകൊടുത്തവൻ’ എന്നോ സന്ദർഭാനുസൃതമായി ‘ഒറ്റിക്കൊടുത്തവൻ’ എന്നോ പരിഭാഷപ്പെടുത്തണോ
  choice: ഒറ്റിക്കൊടുത്തവൻ
  alternative: ഏല്പിച്ചുകൊടുത്തവൻ
  rationale: സുവിശേഷകഥയിൽ യൂദായെ തിരിച്ചറിയിക്കുന്ന വഞ്ചനാപൂർവമായ പ്രവൃത്തിയുടെ നൈതികവും ബന്ധപരവുമായ ഭാവം ‘ഒറ്റിക്കൊടുത്തവൻ’ സ്വാഭാവികമായി അറിയിക്കുന്നു. എന്നാൽ ഗ്രീക്ക് ക്രിയയുടെ വിശാലമായ അർഥം അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പട്ടികാശൈലി. പേരുകൾ മലയാളത്തിൽ പരിചിതമായ രൂപത്തിൽ നൽകി; ഉറവിടത്തിലെ വിശേഷണങ്ങളും അർഥവ്യാപ്തിയും അടിക്കുറിപ്പുകളിലൂടെ സുതാര്യമാക്കി.
