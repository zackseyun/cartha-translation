    reason: lexical_alternative
lexical_decisions:
- source_word: μαθητής
  choice: ശിഷ്യൻ
  rationale: സുവിശേഷസന്ദർഭത്തിലെ പഠനം, അനുഗമനം, ഗുരു-ശിഷ്യബന്ധം എന്നിവ ഉൾക്കൊള്ളുന്നതിനാൽ അക്കാദമിക അർഥം മാത്രം നൽകുന്ന ‘വിദ്യാർഥി’യെക്കാൾ ‘ശിഷ്യൻ’ യോജിക്കുന്നു.
- source_word: ὑπέρ
  choice: മേൽ / മേലായിരിക്കുക
  rationale: Accusative-നോടുകൂടിയ ὑπέρ ഇവിടെ പദവിയിലോ ശ്രേഷ്ഠതയിലോ മറ്റൊരാളെക്കാൾ ഉയർന്നവനായിരിക്കുക എന്ന താരതമ്യാർഥം നൽകുന്നു; ‘-നെക്കാൾ മേലല്ല’ അത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: διδάσκαλος
  choice: ഗുരു
  rationale: ശിഷ്യനെ പഠിപ്പിക്കുകയും നയിക്കുകയും ചെയ്യുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളപദമാണ്; തുടർന്നുള്ള യജമാനൻ എന്ന പദത്തിൽനിന്നും വ്യക്തമായി വേർതിരിയുന്നു.
- source_word: δοῦλος
  choice: അടിമ
  rationale: κύριος എന്ന പദത്തോടുള്ള സാമൂഹിക-പദവിപരമായ വിരുദ്ധജോടിയിൽ അധീനതയുടെ ശക്തി കൃത്യമായി നിലനിർത്തുന്നു; സന്ദർഭാനുസൃതമായ ‘ദാസൻ/വേലക്കാരൻ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: κύριος
  choice: യജമാനൻ
  rationale: ഇവിടെ ദൈവിക അഭിസംബോധനയല്ല, അടിമയുടെ മേലധികാരിയായ മനുഷ്യനെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ‘കർത്താവ്’ എന്നതിനെക്കാൾ ‘യജമാനൻ’ സന്ദർഭത്തിന് വ്യക്തമാണ്.
- source_word: αὐτοῦ
  choice: തന്റെ
  rationale: അടിമയും അവന്റെ യജമാനനും തമ്മിലുള്ള ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: οὐδέ
  choice: മേലുമല്ല
  rationale: ആദ്യത്തെ നിഷേധത്തോട് രണ്ടാമത്തെ താരതമ്യനിഷേധം ചേർക്കുന്ന ‘nor’ എന്ന ആശയം മലയാളത്തിൽ സംക്ഷിപ്തമായും സ്വാഭാവികമായും നൽകുന്നു.
theological_decisions:
- issue: രക്ഷാശാസ്ത്രപരമല്ലാത്ത സാമൂഹിക ഉപമയിൽ δοῦλος എന്നതിന്റെ പരിഭാഷ
  choice: അടിമ
  alternative: ദാസൻ; വേലക്കാരൻ
  rationale: ഈ വാക്യത്തിലെ അടിമ–യജമാനൻ ജോടി പദവിയും അധീനതയും ഊന്നുന്നു. അതിനാൽ ‘അടിമ’ മൂലപദത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; മൃദുവായ സന്ദർഭസാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: മനുഷ്യ മേലധികാരിയെ സൂചിപ്പിക്കുന്ന κύριος എന്നതിന്റെ പരിഭാഷ
  choice: യജമാനൻ
  alternative: കർത്താവ്
  rationale: δοῦλος-നോടു ചേർന്നുള്ള ഈ ഉപമയിൽ κύριος ഒരു മനുഷ്യ യജമാനനെയാണ് സൂചിപ്പിക്കുന്നത്; ദൈവിക പദവി ഇവിടെ ഉദ്ദേശിക്കുന്നതായി നിർബന്ധിക്കാതെ സന്ദർഭാർഥം നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടന ഉപയോഗിച്ചു. ‘ശിഷ്യൻ–ഗുരു’, ‘അടിമ–യജമാനൻ’ എന്നീ സമാന്തരജോടികളും മൂലത്തിലെ താരതമ്യഘടനയും നിലനിർത്തി; രണ്ടാം ഘടകത്തിലെ αὐτοῦ ‘തന്റെ’ എന്നു വ്യക്തമായി പരിഭാഷപ്പെടുത്തി.
