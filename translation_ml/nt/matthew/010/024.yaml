  terminology: ‘അടിമ’ and ‘യജമാനൻ’ are contextually sound and avoid importing a divine sense into κύριος. The alternative ‘വേലക്കാരൻ,’ however, normally denotes a worker or employee and is not a suitably equivalent lexical alternative for δοῦλος in this context; it weakens the bonded/subordinate relation.
