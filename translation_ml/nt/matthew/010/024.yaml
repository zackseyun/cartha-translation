  source_fidelity: 'The main rendering accurately preserves both parallel negative comparisons: μαθητής/διδάσκαλος is naturally rendered ശിഷ്യൻ/ഗുരു, and δοῦλος/κύριος as അടിമ/യജമാനൻ appropriately retains the social-status contrast. ‘തന്റെ’ naturally expresses αὐτοῦ in the second clause.'
