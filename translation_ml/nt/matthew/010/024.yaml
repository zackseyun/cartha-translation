  text: A disciple is not above the teacher[b][a], nor a slave above his master.
translation:
  language: ml
  text: ശിഷ്യൻ ഗുരുവിനെക്കാൾ മേലല്ല; അടിമ[a] തന്റെ യജമാനനെക്കാൾ[b] മേലുമല്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ദാസൻ’; ഗ്രീക്കിലെ δοῦλος എന്ന പദം സന്ദർഭമനുസരിച്ച് ‘ദാസൻ’ എന്നും പരിഭാഷപ്പെടുത്താം.
