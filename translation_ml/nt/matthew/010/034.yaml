id: MAT.10.34
reference: Matthew 10:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Μὴ νομίσητε ὅτι ἦλθον βαλεῖν εἰρήνην ἐπὶ τὴν γῆν· οὐκ ἦλθον βαλεῖν εἰρήνην ἀλλὰ μάχαιραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/034.yaml
  text: Do not think that I came to bring peace on the earth[a]; I did not come to bring peace[b], but a sword.
translation:
  language: ml
  text: “ഭൂമിയിൽ സമാധാനം കൊണ്ടുവരാനാണ് ഞാൻ വന്നതെന്ന്[a] കരുതരുത്. സമാധാനം കൊണ്ടുവരാനല്ല ഞാൻ വന്നത്; വാൾ കൊണ്ടുവരാനാണ്[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഞാൻ വന്നിരിക്കുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ ഇവിടെ ‘വാൾ’ എന്നാണ്. സന്ദർഭത്തിൽ ഈ ദൃശ്യരൂപം അക്രമത്തെ പ്രോത്സാഹിപ്പിക്കുന്നതിനേക്കാൾ ഭിന്നതയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ νομίσητε
  choice: കരുതരുത്
  rationale: μήയോടുകൂടിയ aorist subjunctive ഇവിടെ വിലക്കിനെ സൂചിപ്പിക്കുന്നു. ‘കരുതരുത്’ സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ മലയാളപ്രയോഗമാണ്.
- source_word: ἦλθον
  choice: ഞാൻ ... വന്നത് / വന്നതാണെന്ന്
  rationale: ദൗത്യലക്ഷ്യം വ്യക്തമാക്കുന്ന aorist രൂപം മലയാളത്തിൽ ലളിതമായ ഭൂതകാലപ്രയോഗത്തിലൂടെ സ്വാഭാവികമായി നൽകുന്നു; സന്ദർഭമനുസരിച്ച് ‘വന്നിരിക്കുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം.
- source_word: βαλεῖν
  choice: കൊണ്ടുവരാൻ
  rationale: βάλλω എന്നതിന് അക്ഷരാർഥത്തിൽ ‘എറിയുക’ എന്നുണ്ടെങ്കിലും, സമാധാനവും വാളും കർമ്മങ്ങളാകുന്ന ഈ പ്രയോഗത്തിൽ ഉദ്ദേശിച്ച ഫലം സ്വാഭാവികമായി അറിയിക്കാൻ ‘കൊണ്ടുവരുക’ അനുയോജ്യമാണ്.
- source_word: εἰρήνην
  choice: സമാധാനം
  rationale: εἰρήνηയുടെ സാധാരണവും സന്ദർഭോചിതവുമായ മലയാളപരിഭാഷ.
- source_word: ἐπὶ τὴν γῆν
  choice: ഭൂമിയിൽ
  rationale: ഭൂമിയിലാകെ എന്ന വിശാലമായ അർഥം സ്വാഭാവിക ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ‘ദേശത്ത്’ എന്ന പരിമിത അർഥം ഇവിടെ അനാവശ്യമാണ്.
- source_word: ἀλλὰ
  choice: '...അല്ല; ...ആണ്'
  rationale: ഗ്രീക്കിലെ ശക്തമായ വൈരുധ്യം മലയാളത്തിലെ ‘അല്ല ... ആണ്’ എന്ന സമാന്തരഘടന വ്യക്തമായി പകർന്നുനൽകുന്നു.
- source_word: μάχαιραν
  choice: വാൾ
  rationale: μάχαιρα വാളിനെയോ ചെറുവാളിനെയോ സൂചിപ്പിക്കുന്നു. ഉറവിടത്തിലെ ദൃശ്യരൂപം വ്യാഖ്യാനിച്ച് ‘ഭിന്നത’ എന്നാക്കി മാറ്റാതെ ‘വാൾ’ എന്നു നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ വാക്കിലെ ‘വാൾ’ എന്ന ദൃശ്യരൂപം പ്രധാനവാക്യത്തിൽ ‘ഭിന്നത’ എന്ന് മയപ്പെടുത്തി പറയണമോ എന്നത്
  choice: പ്രധാനവാക്യത്തിൽ ‘വാൾ’ എന്ന മൂർത്തമായ ദൃശ്യരൂപം നിലനിർത്തുക
  alternative: ഭിന്നത
  rationale: ഗ്രീക്ക് പാഠത്തിൽ വ്യക്തമായി μάχαιραν (‘വാൾ’) എന്നാണ്. തുടർന്നുള്ള സന്ദർഭം കുടുംബങ്ങൾക്കുള്ളിലെ ഭിന്നതയെ കാണിക്കുന്നുവെങ്കിലും, പരിഭാഷ തന്നെ ആ രൂപകത്തെ വ്യാഖ്യാനിച്ച് മാറ്റരുത്. ഇങ്ങനെ ചെയ്യുന്നത് ഉറവിടത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും ദൃശ്യശക്തിയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായെങ്കിലും ഗൗരവമുള്ള ശൈലി. ഉറവിടത്തിലെ ആവർത്തനവും സമാധാനം–വാൾ വൈരുധ്യവും സംരക്ഷിച്ചിരിക്കുന്നു; ‘ഭൂമിയിൽ’ എന്നത് സ്വാഭാവിക മലയാളപ്രയോഗമായി തിരഞ്ഞെടുത്തു.
