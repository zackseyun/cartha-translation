id: MAT.10.42
reference: Matthew 10:42
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἂν ποτίσῃ ἕνα τῶν μικρῶν τούτων ποτήριον ψυχροῦ μόνον εἰς ὄνομα μαθητοῦ, ἀμὴν λέγω ὑμῖν, οὐ μὴ ἀπολέσῃ τὸν μισθὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/042.yaml
  text: And whoever gives one of these little ones even a cup of cold water in the name of a disciple[a], truly I say to you[b], he will certainly not lose his reward.
translation:
  language: ml
  text: 'ഈ ചെറിയവരിൽ ഒരാൾ ശിഷ്യനാണെന്ന കാരണത്താൽ അവന് വെറും ഒരു കപ്പ് തണുത്ത വെള്ളമെങ്കിലും കുടിക്കാൻ കൊടുക്കുന്നവൻ ആരായാലും, സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: അവന്റെ പ്രതിഫലം ഒരിക്കലും നഷ്ടപ്പെടുകയില്ല.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃς ἂν
  choice: ആരായാലും
  rationale: അനിശ്ചിതവും എല്ലാവരെയും ഉൾക്കൊള്ളുന്നതുമായ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ പൊതുവായ വ്യവസ്ഥാസ്വഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ποτίσῃ
  choice: കുടിക്കാൻ കൊടുക്കുന്നവൻ
  rationale: ക്രിയയുടെ അക്ഷരാർഥമായ ‘കുടിപ്പിക്കുക/കുടിക്കാൻ കൊടുക്കുക’ എന്ന ആശയം വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: ἕνα τῶν μικρῶν τούτων
  choice: ഈ ചെറിയവരിൽ ഒരാൾക്ക്
  rationale: ‘ചെറിയവർ’ എന്ന മൂലരൂപം നിലനിർത്തുകയും, അത് കുട്ടികളിലേക്ക് മാത്രം ചുരുക്കാതെ താഴ്ന്ന നിലയിലുള്ളവരെയോ നിസ്സാരരായി കണക്കാക്കപ്പെടുന്ന ശിഷ്യരെയോ സൂചിപ്പിക്കാനുള്ള സാധ്യത തുറന്നുവെക്കുകയും ചെയ്യുന്നു.
- source_word: ποτήριον ψυχροῦ
  choice: ഒരു കപ്പ് തണുത്ത വെള്ളം
  rationale: ψυχροῦ എന്ന വിശേഷണത്തോടൊപ്പം സന്ദർഭം സൂചിപ്പിക്കുന്ന ‘വെള്ളം’ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: μόνον
  choice: വെറും … മാത്രമെങ്കിലും
  rationale: സമ്മാനത്തിന്റെ ഏറ്റവും ചെറിയതും സാധാരണവുമായ സ്വഭാവം ഊന്നിക്കാട്ടുന്നു; ‘only’ എന്ന പരിധിയും ‘even’ എന്ന ആശ്ചര്യബലവും ഒരുമിച്ച് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: εἰς ὄνομα μαθητοῦ
  choice: ശിഷ്യൻ എന്ന നിലയിൽ
  rationale: ‘ശിഷ്യന്റെ പേരിൽ’ എന്ന അസ്വാഭാവികമായ അക്ഷരാനുവാദം ഒഴിവാക്കി, ശിഷ്യൻ എന്ന തിരിച്ചറിയലിന്റെ അടിസ്ഥാനത്തിലാണ് പ്രവൃത്തി ചെയ്യുന്നതെന്ന അർഥം നൽകുന്നു; കൂടുതൽ ഔപചാരിക രൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: യേശുവിന്റെ ഗൗരവപൂർണവും അധികാരപരവുമായ പ്രഖ്യാപനസൂത്രത്തിന്റെ ശക്തി വ്യക്തമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: οὐ μὴ ἀπολέσῃ
  choice: തീർച്ചയായും നഷ്ടപ്പെടുത്തുകയില്ല
  rationale: οὐ μή എന്ന ശക്തമായ നിഷേധം ‘തീർച്ചയായും … ഇല്ല’ എന്ന രൂപത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: τὸν μισθὸν αὐτοῦ
  choice: തന്റെ പ്രതിഫലം
  rationale: ശമ്പളം, കൂലി, പ്രതിഫലം എന്നീ അർഥസാധ്യതകളിൽ ഈ സന്ദർഭത്തിന് യോജിച്ച ‘പ്രതിഫലം’ തിരഞ്ഞെടുക്കുന്നു; ‘തന്റെ’ എന്നത് ലിംഗനിരപേക്ഷവും സ്വാഭാവികവുമാണ്.
theological_decisions:
- issue: ‘ഈ ചെറിയവർ’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: കുട്ടികളിലേക്ക് മാത്രം പരിമിതപ്പെടുത്താതെ ‘ഈ ചെറിയവർ’ എന്നു നിലനിർത്തി; സന്ദർഭത്തിൽ താഴ്ന്ന നിലയിലുള്ളവരോ നിസ്സാരരായി കണക്കാക്കപ്പെടുന്ന യേശുവിന്റെ അനുയായികളോ ഉൾപ്പെടാം.
  alternative: അക്ഷരാർഥത്തിൽ കുട്ടികൾ മാത്രം; അല്ലെങ്കിൽ പുതിയതോ ദുർബലരോ ആയ വിശ്വാസികൾ മാത്രം.
  rationale: അടുത്തുള്ള സന്ദർഭം ശിഷ്യരെ സ്വീകരിക്കുന്നതിനെക്കുറിച്ചാണ്. അതിനാൽ മൂലപാഠത്തിന്റെ വിശാലവും ഭാഗികമായി അവ്യക്തവുമായ പ്രയോഗം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ സൂക്ഷിക്കുന്നു.
- issue: εἰς ὄνομα μαθητοῦ എന്നതിന്റെ ബന്ധവും അർഥവും
  choice: സ്വീകർത്താവിനെ ശിഷ്യൻ എന്ന നിലയിൽ കണ്ട് സഹായിക്കുന്നതെന്ന അർഥത്തിൽ ‘ശിഷ്യൻ എന്ന നിലയിൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ഒരു ശിഷ്യന്റെ പേരിൽ’; അല്ലെങ്കിൽ സഹായിക്കുന്നയാൾ ശിഷ്യനെന്ന നിലയിൽ പ്രവൃത്തി ചെയ്യുന്നു എന്ന വായന.
  rationale: വാക്യസന്ദർഭത്തിൽ സഹായം ലഭിക്കുന്ന വ്യക്തിയുടെ ശിഷ്യത്വപരമായ തിരിച്ചറിയലാണ് പ്രവൃത്തിയുടെ അടിസ്ഥാനമെന്നതാണ് ഏറ്റവും സാധ്യതയുള്ളത്. എങ്കിലും ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ഔപചാരിക രൂപം അടിക്കുറിപ്പിൽ നൽകി പദപ്രയോഗത്തിന്റെ പ്രത്യേകത മറച്ചിട്ടില്ല.
- issue: പ്രതിഫലം നഷ്ടപ്പെടുകയില്ല എന്ന ഉറപ്പിന്റെ ശക്തി
  choice: ‘തീർച്ചയായും നഷ്ടപ്പെടുത്തുകയില്ല’ എന്നു ശക്തമായ ഉറപ്പോടെ പരിഭാഷപ്പെടുത്തി.
  alternative: സാധാരണ നിഷേധമായി ‘നഷ്ടപ്പെടുകയില്ല’.
  rationale: οὐ μή എന്ന ഇരട്ട നിഷേധനിർമ്മിതി ശക്തമായ ഉറപ്പാണ് നൽകുന്നത്; അതിനെ ദുർബലപ്പെടുത്താതെ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘വെറും ഒരു കപ്പ് … മാത്രമെങ്കിലും’ എന്ന പ്രയോഗം ചെറിയ സേവനത്തിന്റെ ലാളിത്യവും അതിന്റെ പ്രാധാന്യവും ഒരുമിച്ച് നൽകുന്നു. ‘അയാൾ/തന്റെ’ എന്ന രൂപങ്ങൾ അനാവശ്യമായ പുരുഷലിംഗപരിമിതി ഒഴിവാക്കുന്നു; വാക്യത്തിന്റെ ഗൗരവം നിലനിർത്താൻ പ്രഖ്യാപനത്തിന് ശേഷം കോളൺ ഉപയോഗിച്ചു.
