  text: καὶ ὃς οὐ λαμβάνει τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθεῖ ὀπίσω μου, οὐκ ἔστιν μου ἄξιος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/038.yaml
  text: And whoever does not take up his cross and follow after me is not worthy of me[a][b].
translation:
  language: ml
  text: തന്റെ ക്രൂശ് എടുക്കുകയും എന്റെ പിന്നാലെ വരികയും ചെയ്യാത്തവൻ എനിക്കു യോഗ്യനല്ല.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ‘തന്റെ ക്രൂശ്’ എന്നതിലെ ‘തന്റെ’ എന്ന ആശയം വ്യാകരണപരമായി പുല്ലിംഗ ഏകവചനരൂപത്തിലാണ്; എന്നാൽ ഇവിടെ അത് പൊതുവായ പ്രതിനിധിപരമായ അർഥത്തിലാണ്—ഓരോ ശിഷ്യനും സ്വന്തം ക്രൂശ് എടുക്കണം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘എന്നെ അനുഗമിക്കാത്തവൻ.’ ഗ്രീക്കിൽ കൂടുതൽ വ്യക്തമായി ‘എന്റെ പിന്നാലെ വരിക’ എന്നാണ് പറയുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: വരാത്തവൻ
  rationale: ὃς ഇവിടെ പൊതുവായ, അനിശ്ചിതബന്ധസർവനാമമായി ‘ആരെങ്കിലും/ആ വ്യക്തി’ എന്ന ആശയം നൽകുന്നു. മലയാളത്തിൽ തുടർന്നുള്ള നിഷേധക്രിയയോടു ചേർന്ന ‘വരാത്തവൻ’ എന്ന രൂപം സ്വാഭാവികമായി ആ പൊതുവായ അർഥം വഹിക്കുന്നു.
- source_word: λαμβάνει
  choice: എടുത്ത്
  rationale: σταυρός എന്ന പദത്തോടൊപ്പം ഇത് വെറും സ്വീകരിക്കലല്ല, ക്രൂശ് ഏറ്റെടുത്തു വഹിക്കാൻ സന്നദ്ധമാകുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘എടുത്ത്’ എന്നത് മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: σταυρὸν
  choice: ക്രൂശ്
  rationale: റോമൻ വധോപകരണത്തെയും മത്തായിയിലെ ശിഷ്യത്വത്തിന്റെ ശക്തമായ ദൃശ്യരൂപത്തെയും ഒരുപോലെ നിലനിർത്തുന്ന, മലയാള ക്രൈസ്തവ പ്രയോഗത്തിൽ സുപരിചിതമായ പദമാണ് ‘ക്രൂശ്’.
- source_word: αὐτοῦ
  choice: തന്റെ
  rationale: ഏകവചനത്തിലുള്ള ഓരോ ശിഷ്യന്റെയും സ്വന്തം ക്രൂശ് എന്ന ബന്ധം ‘തന്റെ’ വ്യക്തമായി നിലനിർത്തുന്നു. ഇത് മലയാളത്തിൽ ലിംഗസൂചനയില്ലാതെ സ്വാഭാവികമായ പ്രതിനിധിപരമായ പ്രയോഗവുമാണ്.
- source_word: ἀκολουθεῖ ὀπίσω μου
  choice: എന്റെ പിന്നാലെ വരാത്തവൻ
  rationale: ἀκολουθεῖ എന്ന അനുഗമനവും ὀπίσω μου എന്ന ‘എന്റെ പിന്നിൽ/പിന്നാലെ’ എന്ന വ്യക്തമായ സ്ഥാനബന്ധവും ഈ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἄξιος
  choice: യോഗ്യനല്ല
  rationale: ἄξιος എന്ന വിലയിരുത്തൽപദത്തിന്റെ ഗൗരവവും നേരിട്ടുള്ള അർഥവും ‘യോഗ്യൻ’ സംരക്ഷിക്കുന്നു.
- source_word: μου ἄξιος
  choice: എനിക്കു യോഗ്യനല്ല
  rationale: ἄξιος-നോടൊപ്പമുള്ള μου എന്ന ജനിറ്റീവ് ബന്ധം വ്യാഖ്യാനപരമായി വികസിപ്പിക്കാതെ ‘worthy of me’ എന്ന വ്യക്തിബന്ധപരമായ വിലയിരുത്തലായി നേരിട്ട് നൽകുന്നു.
theological_decisions:
- issue: ക്രൂശ് എടുക്കുക എന്ന ശിഷ്യത്വവചനം
  choice: ‘തന്റെ ക്രൂശ് എടുത്ത്’ എന്ന മൂർത്തമായ ദൃശ്യരൂപം അതേപടി നിലനിർത്തി.
  alternative: ‘കഷ്ടം സഹിക്കുക’ അല്ലെങ്കിൽ ‘സ്വയം ത്യജിക്കുക’ എന്ന വ്യാഖ്യാനപരമായ പരാവർത്തനം.
  rationale: മൂലവാക്യം ക്രൂശിന്റെ ചരിത്രപരവും ദൈവശാസ്ത്രപരവുമായ ഭാരം വഹിക്കുന്ന ശക്തമായ ദൃശ്യരൂപമാണ് ഉപയോഗിക്കുന്നത്. അതിനെ ഒരു അമൂർത്ത ആശയമായി ചുരുക്കുന്നത് അർഥവ്യാപ്തി നഷ്ടപ്പെടുത്തും.
- issue: αὐτοῦ എന്ന ഏകവചന പ്രതിനിധിപരമായ രൂപം
  choice: ‘തന്റെ’ എന്ന് പരിഭാഷപ്പെടുത്തി; ഇത് ഓരോ ശിഷ്യന്റെയും സ്വന്തം ക്രൂശിനെ സൂചിപ്പിക്കുന്നു.
  alternative: ‘അവന്റെ’ എന്ന വ്യക്തമായ പുല്ലിംഗരൂപം, അല്ലെങ്കിൽ ബഹുവചന ലിംഗനിരപേക്ഷ രൂപം.
  rationale: മലയാളത്തിലെ ‘തന്റെ’ ഏകവചനവും സ്വാഭാവികവുമാണ്; ഗ്രീക്കിലെ വ്യക്തിഗത ഉത്തരവാദിത്തം കാത്തുകൊണ്ട് അനാവശ്യമായ ലിംഗസൂചന ഒഴിവാക്കുന്നു. പ്രധാനവാക്യത്തിലെ ‘വരാത്തവൻ’ ഗ്രീക്കിലെ ഏകവചന പ്രതിനിധിരൂപത്തോട് പൊരുത്തപ്പെടുന്നു.
- issue: ‘എന്റെ പിന്നാലെ’ എന്ന ഘടകത്തിന്റെ വ്യക്തത
  choice: ὀπίσω μου എന്ന ഘടകം ‘എന്റെ പിന്നാലെ’ എന്ന് തുറന്നുപറഞ്ഞു.
  alternative: ‘എന്നെ അനുഗമിക്കുക’ എന്നു മാത്രം നൽകുക.
  rationale: ലളിതമായ ‘അനുഗമിക്കുക’ ശരിയായ അർഥം നൽകുമെങ്കിലും, ഗ്രീക്ക് പാഠത്തിലെ ‘പിന്നാലെ’ എന്ന വ്യക്തമായ ശിഷ്യസ്ഥാനത്തിന്റെ സൂക്ഷ്മത പ്രധാനവാക്യത്തിൽ നിലനിർത്തുന്നത് ഉചിതമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധം സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘ക്രൂശ്’, ‘പിന്നാലെ വരുക’, ‘യോഗ്യൻ’ എന്നീ പദങ്ങൾ മൂലപാഠത്തിന്റെ ദൃശ്യശക്തിയും ശിഷ്യത്വത്തിന്റെ ഗൗരവവും നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും പ്രധാനവാക്യത്തിൽ ചേർത്തിട്ടുണ്ട്.
