id: MAT.10.36
reference: Matthew 10:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐχθροὶ τοῦ ἀνθρώπου οἱ οἰκιακοὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/036.yaml
  text: And a man's enemies will be those of his own household[a].
translation:
  language: ml
  text: ഒരു മനുഷ്യന്റെ ശത്രുക്കൾ അവന്റെ സ്വന്തം വീട്ടിലെ അംഗങ്ങൾതന്നെ ആയിരിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരു വ്യക്തിയുടെ ശത്രുക്കൾ അയാളുടെ വീട്ടിലെ അംഗങ്ങൾ ആയിരിക്കും.” ഗ്രീക്കിൽ “മനുഷ്യൻ” എന്ന പുല്ലിംഗ ഏകവചനം പ്രതിനിധിപരമായി ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: —
  rationale: ഈ വാക്യം മുമ്പത്തെ ഉദ്ധരണിയുടെ തുടർച്ചയായതിനാൽ മലയാളത്തിൽ പ്രത്യേക സംയോജകപദം ചേർക്കാതെ തുടർച്ച സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἐχθροὶ
  choice: ശത്രുക്കൾ
  rationale: ശത്രുത പുലർത്തുന്നവരെ സൂചിപ്പിക്കുന്ന ശക്തവും സ്വാഭാവികവുമായ തുല്യപദം.
- source_word: τοῦ ἀνθρώπου
  choice: ഒരു മനുഷ്യന്റെ
  rationale: ജനിതകപ്രയോഗത്തെ ഉടമസ്ഥതാസംബന്ധമായി അവതരിപ്പിക്കുകയും, പ്രതിനിധിപരമായി ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പുല്ലിംഗ ഏകവചനരൂപം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: οἱ οἰκιακοὶ αὐτοῦ
  choice: അവന്റെ സ്വന്തം വീട്ടിലുള്ളവർതന്നെ
  rationale: ഭൗതികമായ വീടിനെയല്ല, ആ വീട്ടിലോ കുടുംബവലയത്തിലോ ഉൾപ്പെടുന്ന ആളുകളെയാണ് οἰκιακοί സൂചിപ്പിക്കുന്നത്; αὐτοῦ നൽകുന്ന സ്വന്തം എന്ന ഊന്നലും ‘തന്നെ’ വഴി വിധേയസ്ഥാനത്തെ ഊന്നലും സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: ἀνθρώπου എന്ന പദത്തിലെ പ്രതിനിധിപരമായ പുല്ലിംഗപ്രയോഗം
  choice: ഒരു മനുഷ്യന്റെ
  alternative: ഒരു വ്യക്തിയുടെ
  rationale: ഇവിടെ ἄνθρωπος പൊതുവായി മനുഷ്യനെ സൂചിപ്പിക്കാമെങ്കിലും മൂലത്തിലെ പുല്ലിംഗ ഏകവചനരൂപം മുഖ്യപാഠത്തിൽ സൂക്ഷിക്കുന്നു; അതിന്റെ പ്രതിനിധിപരമായ വ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: οἰκιακοί എന്നതിന്റെ പരിധി
  choice: വീട്ടിലുള്ളവർ
  alternative: കുടുംബാംഗങ്ങൾ
  rationale: പദം അടുത്ത രക്തബന്ധുക്കളിൽ മാത്രം ഒതുങ്ങാതെ വീട്ടുസമൂഹത്തിലെ അംഗങ്ങളെയും ഉൾക്കൊള്ളാൻ കഴിയും; അതിനാൽ കൂടുതൽ വിശാലമായ ‘വീട്ടിലുള്ളവർ’ തിരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. ‘വീട്ടിലുള്ളവർ’ എന്നത് സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായിരിക്കെ ‘കുടുംബാംഗങ്ങൾ’ എന്നതിലേക്കു അർഥം അനാവശ്യമായി ചുരുക്കുന്നില്ല.
