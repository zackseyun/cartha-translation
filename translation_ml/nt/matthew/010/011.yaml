source:
  edition: SBLGNT
  text: εἰς ἣν δ’ ἂν πόλιν ἢ κώμην εἰσέλθητε, ἐξετάσατε τίς ἐν αὐτῇ ἄξιός ἐστιν· κἀκεῖ μείνατε ἕως ἂν ἐξέλθητε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/011.yaml
  text: Into whatever city or village you enter[a], find out who in it is worthy[b], and stay there until you leave.
translation:
  language: ml
  text: നിങ്ങൾ ഏതു പട്ടണത്തിലോ ഗ്രാമത്തിലോ പ്രവേശിച്ചാലും, അവിടെയുള്ള യോഗ്യനായ വ്യക്തി ആരാണെന്ന് അന്വേഷിച്ചറിയുക[a]; നിങ്ങൾ അവിടം വിട്ടുപോകുന്നതുവരെ അവിടെത്തന്നെ താമസിക്കുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അന്വേഷിച്ചറിയുക’ എന്നതിന് ‘ചോദിച്ചറിയുക’ അല്ലെങ്കിൽ ‘ശ്രദ്ധാപൂർവം അന്വേഷിക്കുക’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν δ’ ἂν πόλιν ἢ κώμην εἰσέλθητε
  choice: നിങ്ങൾ ഏതു പട്ടണത്തിലോ ഗ്രാമത്തിലോ പ്രവേശിച്ചാലും
  rationale: εἰς എന്നതിന്റെ പ്രവേശനദിശയും ἄν ചേർന്ന അനിശ്ചിത ബന്ധവാക്യത്തിന്റെ ‘ഏതായാലും’ എന്ന അർഥവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു. πόλις–κώμη വ്യത്യാസം ‘പട്ടണം–ഗ്രാമം’ എന്ന സാധാരണ പ്രയോഗത്തിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: ἐξετάσατε
  choice: അന്വേഷിച്ചറിയുക
  rationale: വെറും ചോദിച്ചറിയുന്നതിലുപരി ശ്രദ്ധാപൂർവം അന്വേഷിച്ച് കണ്ടെത്തുക എന്ന ആജ്ഞയുടെ ശക്തി ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: τίς ἐν αὐτῇ ἄξιός ἐστιν
  choice: അവിടെ ആരാണ് യോഗ്യൻ എന്ന്
  rationale: τίς എന്ന വ്യക്തിയെക്കുറിച്ചുള്ള ചോദ്യവും ἐν αὐτῇ എന്ന സ്ഥലബന്ധവും ἄξιος എന്ന മൂല്യനിർണയപദവും സംക്ഷിപ്തമായി സംരക്ഷിക്കുന്നു.
- source_word: κἀκεῖ μείνατε
  choice: അവിടെത്തന്നെ താമസിക്കുക
  rationale: κἀκεῖയിലെ സ്ഥലസൂചനയും καίയുടെ ഊന്നലും ‘അവിടെത്തന്നെ’ എന്നതിലൂടെ നൽകുന്നു; μείνατεയ്ക്ക് ആധുനിക മലയാളത്തിലെ സ്വാഭാവികമായ ‘താമസിക്കുക’ ഉപയോഗിക്കുന്നു.
- source_word: ἕως ἂν ἐξέλθητε
  choice: നിങ്ങൾ അവിടം വിട്ടുപോകുന്നതുവരെ
  rationale: ഭാവിയിൽ സംഭവിക്കുന്ന പുറപ്പെടൽവരെ തുടരുക എന്ന ἕως ἄν + ഉപപാദകക്രിയയുടെ കാലപരിധി വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: മിഷനറി നിർദേശത്തിൽ ἄξιος (‘യോഗ്യൻ’) എന്നതിന്റെ അർഥം
  choice: പ്രധാനവാചകത്തിൽ ‘യോഗ്യൻ’ എന്ന് നിലനിർത്തി, സന്ദേശവാഹകരെ സ്വീകരിക്കാൻ അനുയോജ്യനോ സന്നദ്ധനോ ആയ വ്യക്തി എന്ന സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
  alternative: വ്യാപകമായ അർഥത്തിൽ ധാർമികമായി അർഹനായ വ്യക്തി
  rationale: വാക്കിന്റെ മൂല്യനിർണയഭാവം ഇല്ലാതാക്കാതെ നിലനിർത്തുന്നു; അതേസമയം ദൈവകൃപയോ രക്ഷയോ സമ്പാദിച്ച വ്യക്തിയെന്ന ആശയം വാക്യത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല. മൂലപാഠത്തിലെ സാധ്യതയുള്ള അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആജ്ഞാരൂപം ഉപയോഗിച്ചു. ‘പട്ടണം/ഗ്രാമം,’ ‘അന്വേഷിച്ചറിയുക,’ ‘താമസിക്കുക’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും മൂലപാഠത്തോട് അടുത്തതുമാണ്. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങളോടുതന്നെ ചേർത്തിരിക്കുന്നു.
