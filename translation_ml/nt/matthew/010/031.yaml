id: MAT.10.31
reference: Matthew 10:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μὴ οὖν ⸀φοβεῖσθε· πολλῶν στρουθίων διαφέρετε ὑμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/031.yaml
  text: Therefore[a], do not be afraid; you are worth more than many sparrows.
translation:
  language: ml
  text: അതുകൊണ്ട്, ഭയപ്പെടേണ്ട; നിങ്ങൾ അനേകം കുരുവികളെക്കാൾ വിലപ്പെട്ടവരാണ്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ οὖν φοβεῖσθε
  choice: അതുകൊണ്ട് ഭയപ്പെടേണ്ടാ
  rationale: οὖν മുൻവാക്യങ്ങളിലെ ദൈവപരിപാലനത്തെ അടിസ്ഥാനമാക്കിയുള്ള നിഗമനബന്ധം സൂചിപ്പിക്കുന്നു; μὴ സഹിതമുള്ള വർത്തമാനകാല ആജ്ഞാരൂപം സ്വാഭാവികമായ മലയാളത്തിൽ വിലക്കായി പരിഭാഷപ്പെടുത്തി.
- source_word: πολλῶν στρουθίων
  choice: അനേകം കുരുവികളെക്കാൾ
  rationale: സമീപസന്ദർഭമായ 10:29 അനുസരിച്ച് στρουθίον ‘കുരുവി’യെ സൂചിപ്പിക്കുന്നു; ജനിറ്റീവ് രൂപം διαφέρετε-യോടൊപ്പം താരതമ്യം പ്രകടിപ്പിക്കുന്നു.
- source_word: διαφέρετε
  choice: വിലയേറിയവരാണ്
  rationale: ഇവിടെ διαφέρω വെറും വ്യത്യാസമല്ല, മൂല്യത്തിലോ പ്രാധാന്യത്തിലോ മികവ് സൂചിപ്പിക്കുന്നു. ‘വിലയേറിയവർ’ എന്നത് ആ താരതമ്യാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὑμεῖς
  choice: നിങ്ങൾ
  rationale: പ്രകടമായ സർവനാമം കുരുവികളോടുള്ള താരതമ്യത്തിൽ ശിഷ്യന്മാർക്ക് ഊന്നൽ നൽകുന്നു; വാക്യാന്തത്തിലെ ‘നിങ്ങൾ’ ആ ഊന്നൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ ഉപദേശത്തിൽ മനുഷ്യർക്കും കുരുവികൾക്കും ഉള്ള ആപേക്ഷിക മൂല്യം
  choice: അനേകം കുരുവികളെക്കാൾ വിലയേറിയവരാണ് നിങ്ങൾ
  alternative: അനേകം കുരുവികളെക്കാൾ നിങ്ങൾ ശ്രേഷ്ഠരാണ്
  rationale: διαφέρετε-യുടെ സന്ദർഭോചിതമായ താരതമ്യമൂല്യം ഇത് നിലനിർത്തുന്നു; അതേസമയം ജീവികളോടുള്ള ദൈവപരിപാലനം നിഷേധിക്കുന്ന അർഥം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. മൂലത്തിലെ നിഗമനബന്ധവും ‘നിങ്ങൾ’ എന്ന ഊന്നലും നിലനിർത്തി; അനാവശ്യമായ വ്യാഖ്യാനപദങ്ങൾ ചേർത്തിട്ടില്ല.
