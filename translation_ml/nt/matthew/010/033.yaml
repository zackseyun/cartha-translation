id: MAT.10.33
reference: Matthew 10:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅστις ⸂δ’ ἂν⸃ ἀρνήσηταί με ἔμπροσθεν τῶν ἀνθρώπων, ἀρνήσομαι ⸂κἀγὼ αὐτὸν⸃ ἔμπροσθεν τοῦ πατρός μου τοῦ ⸀ἐν οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/033.yaml
  text: But whoever denies me before men[b][a], I also will deny him before my Father who is in heaven.
translation:
  language: ml
  text: എന്നാൽ മനുഷ്യരുടെ മുമ്പാകെ എന്നെ തള്ളിപ്പറയുന്നവനെ, സ്വർഗത്തിലുള്ള എന്റെ പിതാവിന്റെ മുമ്പാകെ ഞാനും അവനെയും തള്ളിപ്പറയും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘സ്വർഗങ്ങളിലുള്ള.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις δ’ ἂν
  choice: എന്നാൽ ... തള്ളിപ്പറയുന്നവനെ
  rationale: ὅστις ... ἄν പൊതുവായ വ്യവസ്ഥയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ക്രിയാനാമരൂപം ഈ പൊതുവ്യാപ്തി സ്വാഭാവികമായി നൽകുന്നു. δέ മുൻവാക്യത്തോടുള്ള വൈരുധ്യം സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: ἀρνήσηταί με
  choice: എന്നെ തള്ളിപ്പറയുന്നവനെ
  rationale: ἀρνέομαι ഇവിടെ പരസ്യമായി നിഷേധിക്കുകയോ ബന്ധം അംഗീകരിക്കാതിരിക്കുകയോ ചെയ്യുന്ന അർഥത്തിലാണ്. ‘തള്ളിപ്പറയുക’ ആ അർഥം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: മനുഷ്യരുടെ മുമ്പാകെ
  rationale: ἔμπροσθεν സാന്നിധ്യത്തെയോ സാക്ഷ്യസ്ഥാനത്തെയോ സൂചിപ്പിക്കുന്നു. ἀνθρώπων വ്യാകരണപരമായി പുല്ലിംഗ ബഹുവചനമാണെങ്കിലും ഇവിടെ മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നതിനാൽ ‘മനുഷ്യരുടെ’ എന്നത് ഉറവിടത്തിന്റെ വ്യാപ്തി കൃത്യമായി നൽകുന്നു.
- source_word: ἀρνήσομαι κἀγὼ αὐτόν
  choice: ഞാനും തള്ളിപ്പറയും
  rationale: κἀγώയിലെ പരസ്പരപ്രതികരണ ഊന്നൽ ‘ഞാനും’ നിലനിർത്തുന്നു. ഒരേ ഗ്രീക്ക് ക്രിയയുടെ ആവർത്തനം മലയാളത്തിലും ഒരേ പദം ഉപയോഗിച്ച് സംരക്ഷിച്ചു; മുൻപുള്ള ക്രിയാനാമരൂപം തന്നെയാണ് കർമത്തെ വ്യക്തമാക്കുന്നതിനാൽ സർവനാമം ആവർത്തിക്കേണ്ടതില്ല.
- source_word: τοῦ πατρός μου
  choice: എന്റെ പിതാവിന്റെ
  rationale: യേശു ഉപയോഗിക്കുന്ന പുത്രബന്ധപരമായ അഭിസംബോധന നേരിട്ട്, അധിക വ്യാഖ്യാനം ചേർക്കാതെ പരിഭാഷപ്പെടുത്തി.
- source_word: τοῦ ἐν οὐρανοῖς
  choice: സ്വർഗത്തിലുള്ള
  rationale: ഗ്രീക്കിൽ ‘സ്വർഗങ്ങളിൽ’ എന്ന ബഹുവചനമാണെങ്കിലും ആധുനിക മലയാളത്തിൽ ദൈവവാസത്തെ സൂചിപ്പിക്കാൻ ഏകവചനമായ ‘സ്വർഗത്തിൽ’ കൂടുതൽ സ്വാഭാവികമാണ്; അക്ഷരാർഥ രൂപം അടിക്കുറിപ്പിൽ നൽകി.
theological_decisions:
- issue: ἀρνέομαι എന്ന ക്രിയയിലെ പരസ്പര നിഷേധം
  choice: എന്നെ തള്ളിപ്പറയുന്നവനെ ... ഞാനും തള്ളിപ്പറയും
  alternative: എന്നെ നിഷേധിക്കുന്നവനെ ... ഞാനും നിഷേധിക്കും
  rationale: ഒരേ ക്രിയ രണ്ടിടത്തും ഉപയോഗിച്ച് യേശുവിനെ പരസ്യമായി തള്ളിപ്പറയുന്നതും പിതാവിന്റെ മുമ്പാകെയുള്ള യേശുവിന്റെ പ്രതികരണവും തമ്മിലുള്ള ഗൗരവമുള്ള സമാന്തരത സംരക്ഷിച്ചു.
- issue: ἀνθρώπων, αὐτόν എന്നിവയുടെ പൊതുവായ സൂചന
  choice: മനുഷ്യരുടെ ... തള്ളിപ്പറയുന്നവനെ
  alternative: പുരുഷന്മാരുടെ ... അവനെ
  rationale: സന്ദർഭത്തിൽ ἀνθρώπων മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘മനുഷ്യർ’ ആ വ്യാപ്തി കൃത്യമായി നൽകുന്നു; ‘തള്ളിപ്പറയുന്നവനെ’ എന്ന രൂപം ഉറവിടത്തിലെ ഏകവചന വ്യക്തിസൂചന നിലനിർത്തുന്നു, എന്നാൽ അനാവശ്യമായി പുരുഷന്മാർക്കു മാത്രമായി അർഥം ചുരുക്കുന്നില്ല.
- issue: οὐρανοῖς എന്ന ബഹുവചനം
  choice: സ്വർഗത്തിലുള്ള
  alternative: സ്വർഗങ്ങളിലുള്ള
  rationale: ബഹുവചന രൂപത്തിന് സാദ്ധ്യമായ പ്രപഞ്ചശാസ്ത്രപരമായ വ്യാഖ്യാനം പാഠത്തിൽ നിർബന്ധിച്ചിട്ടില്ല. സ്വാഭാവിക മലയാളപ്രയോഗം മുഖ്യപാഠത്തിൽ ഉപയോഗിച്ച് രൂപപരമായ വ്യത്യാസം അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘മുമ്പാകെ’ എന്നത് പൊതുസാക്ഷ്യത്തിന്റെ ഔപചാരിക ഭാവം നിലനിർത്തുന്നു; ‘തള്ളിപ്പറയുക’ പരസ്യനിഷേധത്തിന്റെ ശക്തിയും ആവർത്തനസമാന്തരതയും സംരക്ഷിക്കുന്നു.
