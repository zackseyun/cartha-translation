- from: എന്നാൽ മനുഷ്യരുടെ മുമ്പാകെ എന്നെ തള്ളിപ്പറയുന്നവനെ, സ്വർഗത്തിലുള്ള എന്റെ പിതാവിന്റെ മുമ്പാകെ ഞാനും തള്ളിപ്പറയും.[a]
