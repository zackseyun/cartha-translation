id: MAT.10.40
reference: Matthew 10:40
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὁ δεχόμενος ὑμᾶς ἐμὲ δέχεται, καὶ ὁ ἐμὲ δεχόμενος δέχεται τὸν ἀποστείλαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/040.yaml
  text: The one who receives you receives me[a], and the one who receives me receives the one who sent me.
translation:
  language: ml
  text: നിങ്ങളെ സ്വീകരിക്കുന്നവൻ എന്നെ സ്വീകരിക്കുന്നു[a]; എന്നെ സ്വീകരിക്കുന്നവൻ എന്നെ അയച്ചവനെ സ്വീകരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സ്വാഗതം ചെയ്യുന്നവൻ’; ഈ ഗ്രീക്ക് ക്രിയയ്ക്ക് ഒരാളെ സ്വീകരിക്കുക, അംഗീകരിക്കുക, സ്വാഗതം ചെയ്യുക എന്നീ അർഥങ്ങൾ വരാം—പ്രത്യേകിച്ച് ഒരു ദൂതനെ സ്വീകരിക്കുന്ന അർഥത്തിൽ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ δεχόμενος
  choice: സ്വീകരിക്കുന്നവൻ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ വർത്തമാനകാല കൃദന്തം പൊതുവായ വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. ‘സ്വീകരിക്കുന്നവൻ’ ആ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δέχομαι / δέχεται
  choice: സ്വീകരിക്കുന്നു
  rationale: ആവർത്തിക്കുന്ന ഗ്രീക്ക് ക്രിയ, ശിഷ്യരെ സ്വീകരിക്കുന്നതിൽനിന്ന് യേശുവിനെയും അവനെ അയച്ചവനെയും സ്വീകരിക്കുന്നതിലേക്കുള്ള ഉദ്ദേശ്യപൂർവമായ ബന്ധം സൃഷ്ടിക്കുന്നു. ‘സ്വീകരിക്കുന്നു’ എന്ന ആവർത്തനം അതിനെ നിലനിർത്തുകയും സ്വീകരണം, അംഗീകാരം, സ്വാഗതം എന്നീ അർഥവ്യാപ്തികൾ ഉൾക്കൊള്ളുകയും ചെയ്യുന്നു.
- source_word: ὑμᾶς
  choice: നിങ്ങളെ
  rationale: യേശുവിന്റെ ശിഷ്യന്മാരെ അഭിസംബോധന ചെയ്യുന്ന ദ്വിതീയപുരുഷ ബഹുവചന കർമരൂപം മലയാളത്തിൽ വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: ἐμέ
  choice: എന്നെ
  rationale: യേശുവിനെ സൂചിപ്പിക്കുന്ന പ്രഥമപുരുഷ ഏകവചന കർമരൂപത്തിന്റെ നേരിട്ടുള്ള പരിഭാഷ.
- source_word: τὸν ἀποστείλαντά με
  choice: എന്നെ അയച്ചവനെ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ ഭൂതകാല കൃദന്തത്തിന്റെ വ്യക്തിപരമായ സൂചന നിലനിർത്തുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത ‘പിതാവ്’ എന്ന വിശദീകരണം മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: യേശുവിനെ അയച്ചവന്റെ തിരിച്ചറിയൽ
  choice: ‘എന്നെ അയച്ചവനെ’ എന്നു മാത്രം പരിഭാഷപ്പെടുത്തുക
  alternative: ‘എന്നെ അയച്ച പിതാവിനെ’
  rationale: സന്ദർഭവും മത്തായിയുടെ ദൈവശാസ്ത്രവും പിതാവിനെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിലും ഗ്രീക്ക് വാചകം ‘എന്നെ അയച്ചവൻ’ എന്നു മാത്രമാണ് പറയുന്നത്. അതിനാൽ സൂചന നിലനിർത്തി, വാചകത്തിൽ ഇല്ലാത്ത തിരിച്ചറിയൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ δέχεται എന്ന ക്രിയയുടെ മൂന്നു തവണയുള്ള ആവർത്തനം മലയാളത്തിലും കൃത്യമായി നിലനിർത്തി; ‘നിങ്ങളെ’ എന്ന രൂപം ബഹുവചനം വ്യക്തമാക്കുന്നു.
