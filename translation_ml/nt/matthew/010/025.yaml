id: MAT.10.25
reference: Matthew 10:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀρκετὸν τῷ μαθητῇ ἵνα γένηται ὡς ὁ διδάσκαλος αὐτοῦ, καὶ ὁ δοῦλος ὡς ὁ κύριος αὐτοῦ. εἰ τὸν οἰκοδεσπότην Βεελζεβοὺλ ⸀ἐπεκάλεσαν, πόσῳ μᾶλλον τοὺς οἰκιακοὺς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/025.yaml
  text: It is enough for the disciple that he become like his teacher[a], and the slave like his master. If they called the master of the house Beelzebul, how much more those of his household.
translation:
  language: ml
  text: ശിഷ്യൻ തന്റെ ഗുരുവിനെപ്പോലെ ആകുന്നതും അടിമ തന്റെ യജമാനനെപ്പോലെ ആകുന്നതും മതിയാകുന്നു. വീട്ടിലെ യജമാനനെ അവർ ബെയെൽസെബൂൽ[a] എന്നു വിളിച്ചെങ്കിൽ, അയാളുടെ വീട്ടിലുള്ളവരെ എത്രയധികം അങ്ങനെ വിളിക്കുമല്ലോ!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ബെയെൽസെബൂബ്’ എന്നത് പരിചിതമായ ഒരു വകഭേദരൂപമാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀρκετὸν
  choice: മതി
  rationale: സമൃദ്ധി/പര്യാപ്തത സൂചിപ്പിക്കുന്ന വിധേയവിശേഷണത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം; ഗ്രീക്കിലെ സംക്ഷിപ്തബലം നിലനിർത്തുന്നു.
- source_word: μαθητῇ
  choice: ശിഷ്യൻ
  rationale: വെറും അക്കാദമിക വിദ്യാർഥിയെയല്ല, ഗുരുവിനെ അനുഗമിച്ചു പഠിക്കുന്ന ബന്ധത്തെയും സൂചിപ്പിക്കുന്നു.
- source_word: ἵνα γένηται
  choice: ആയിത്തീരുന്നതു
  rationale: ἀρκετόν എന്നതിനുശേഷമുള്ള ἵνα + subjunctive ഘടനയുടെ ഫല/ലക്ഷ്യഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: διδάσκαλος
  choice: ഗുരു
  rationale: μαθητής എന്നതിനോടുള്ള ബന്ധം വ്യക്തമായി നൽകുകയും പിന്നാലെയുള്ള κύριος എന്ന പദത്തിൽനിന്ന് വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: δοῦλος
  choice: അടിമ
  rationale: κύριος എന്ന യജമാനനോടുള്ള പദവി-അധീനതയുടെ ശക്തമായ വൈരുധ്യം ‘ദാസൻ’ എന്നതിനെക്കാൾ വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: κύριος
  choice: യജമാനൻ
  rationale: ഇവിടെ നേരിട്ടുള്ള ക്രിസ്തുശാസ്ത്രപരമായ സ്ഥാനപ്പേരല്ല, അടിമ–യജമാനൻ എന്ന സാമൂഹിക ഉപമയാണ്.
- source_word: οἰκοδεσπότην
  choice: വീട്ടുടമ
  rationale: വീട്ടിന്റെ അധികാരിയും തലവനുമായ വ്യക്തിയെ ലളിതവും സ്വാഭാവികവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: Βεελζεβοὺλ
  choice: ബെയെൽസെബൂൽ
  rationale: SBLGNT-യിലെ ഗ്രീക്ക് രൂപമായ Βεελζεβούλ നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: ἐπεκάλεσαν
  choice: എന്നു വിളിച്ചെങ്കിൽ
  rationale: ഒരാളെ ഒരു പേരുകൊണ്ട് വിശേഷിപ്പിക്കുക എന്ന സന്ദർഭാർത്ഥം നേരിട്ട് നൽകുന്നു.
- source_word: πόσῳ μᾶλλον
  choice: എത്രയധികം
  rationale: കുറഞ്ഞതിൽനിന്ന് കൂടുതലിലേക്കുള്ള a fortiori താരതമ്യത്തിന്റെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: οἰκιακοὺς
  choice: അയാളുടെ വീട്ടിലുള്ളവരെ
  rationale: അടിമകൾ മാത്രമല്ല, വീട്ടിലെ അംഗങ്ങളെ പൊതുവായി ഉൾക്കൊള്ളുന്ന പദത്തിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു.
theological_decisions:
- issue: കുടുംബസാമൂഹിക ഉപമയിലെ κύριος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: യജമാനൻ
  alternative: കർത്താവ്
  rationale: δοῦλος എന്ന പദത്തോടുള്ള ഉടൻതന്നെയുള്ള വൈരുധ്യം ഇവിടെ സാമൂഹികമായ അടിമ–യജമാനൻ ബന്ധമാണ് മുന്നിൽ നിർത്തുന്നത്; ‘കർത്താവ്’ എന്നു നൽകിയാൽ വാക്യം നേരിട്ട് ഉന്നയിക്കാത്ത ക്രിസ്തുശാസ്ത്രപരമായ ഊന്നൽ വരാം.
- issue: δοῦλος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: അടിമ
  alternative: ദാസൻ
  rationale: ഈ വാക്യത്തിൽ യജമാനനോടുള്ള പദവി-അധീനത പ്രധാനമായതിനാൽ ബന്ധത്തിന്റെ കഠിനമായ സാമൂഹിക യാഥാർഥ്യം മറയ്ക്കാത്ത ‘അടിമ’ തിരഞ്ഞെടുത്തു.
- issue: അവസാന ഉപവാക്യത്തിലെ ഒഴിവാക്കിയിരിക്കുന്ന ക്രിയ
  choice: അങ്ങനെ വിളിക്കും എന്ന അർത്ഥം മലയാളത്തിൽ വ്യക്തമാക്കി
  alternative: അയാളുടെ വീട്ടിലുള്ളവരെ എത്രയധികം!
  rationale: ഗ്രീക്കിൽ ക്രിയ മുൻവാക്യത്തിൽനിന്ന് മനസ്സിലാക്കേണ്ടതാണ്. മലയാളത്തിൽ വെറും വിച്ഛിന്നവാക്യം അസ്വാഭാവികമായതിനാൽ അതേ ക്രിയ ആവർത്തിച്ചു; ‘അങ്ങനെ’ എന്നത് ബെയെൽസെബൂൽ എന്ന പേരിലോ അതുപോലുള്ള അധിക്ഷേപത്തിലോ വിളിക്കപ്പെടുമെന്ന സന്ദർഭബന്ധം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ശിഷ്യൻ–ഗുരു’, ‘അടിമ–യജമാനൻ’, ‘വീട്ടുടമ–വീട്ടിലുള്ളവർ’ എന്നീ സമാന്തരബന്ധങ്ങൾ വ്യക്തമായി നിലനിർത്തി. സർവനാമസൂചന ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ അവസാന ഭാഗത്ത് ‘അയാളുടെ’ ഉപയോഗിച്ചു.
