id: MAT.10.9
reference: Matthew 10:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μὴ κτήσησθε χρυσὸν μηδὲ ἄργυρον μηδὲ χαλκὸν εἰς τὰς ζώνας ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/009.yaml
  text: Do not acquire gold or silver or copper for your belts[b][a],
translation:
  language: ml
  text: നിങ്ങളുടെ അരപ്പട്ടകളിൽ[b] ഇടാൻ പൊന്നോ വെള്ളിയോ ചെമ്പോ[a] സമ്പാദിക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ചെമ്പ്’ എന്നതിന് പകരം ‘വെങ്കലം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: അതായത്, അരപ്പട്ടകളിലോ അരയിൽ ധരിച്ചിരുന്ന പണസഞ്ചികളിലോ കൊണ്ടുനടന്നിരുന്ന പണം.
    reason: cultural_note
lexical_decisions:
- source_word: μὴ κτήσησθε
  choice: സമ്പാദിക്കരുത്
  rationale: κτάομαι എന്നത് ‘നേടുക, സമ്പാദിക്കുക, സ്വന്തമാക്കുക’ എന്ന അർഥത്തിലാണ്. ദൗത്യസന്ദർഭത്തിൽ വെറുതെ കൈവശം കൊണ്ടുപോകരുത് എന്നതിലുപരി, യാത്രയ്ക്കായി പണം സമ്പാദിച്ചൊരുക്കരുത് എന്ന ആശയം ‘സമ്പാദിക്കരുത്’ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: χρυσὸν
  choice: പൊന്ന്
  rationale: വസ്തുവിനെയും ഈ സന്ദർഭത്തിൽ പൊൻനാണയങ്ങളായ പണത്തെയും സൂചിപ്പിക്കുന്ന സാധാരണ മലയാളപദം.
- source_word: ἄργυρον
  choice: വെള്ളി
  rationale: വസ്തുവിനെയും ഈ സന്ദർഭത്തിൽ വെള്ളിനാണയങ്ങളായ പണത്തെയും സൂചിപ്പിക്കുന്നു.
- source_word: χαλκὸν
  choice: ചെമ്പ്
  rationale: χαλκός എന്നതിന് ചെമ്പ് അല്ലെങ്കിൽ വെങ്കലം എന്നാകാം. പൊന്നും വെള്ളിയും ചേർന്ന പണപ്പട്ടികയിൽ കുറഞ്ഞ മൂല്യമുള്ള നാണയങ്ങളെ സൂചിപ്പിക്കാൻ ‘ചെമ്പ്’ കൂടുതൽ സ്വാഭാവികമാണ്; ‘വെങ്കലം’ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: εἰς τὰς ζώνας ὑμῶν
  choice: നിങ്ങളുടെ അരപ്പട്ടകളിൽ ഇടാൻ
  rationale: ζώνη അരപ്പട്ടയെയോ അരക്കച്ചയെയോ സൂചിപ്പിക്കുന്നു; അക്കാലത്ത് അതിൽ പണം സൂക്ഷിക്കാമായിരുന്നു. εἰς എന്നതിന്റെ ലക്ഷ്യസൂചന ‘ഇടാൻ’ എന്ന പ്രയോഗത്തിലൂടെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. മൂലത്തിലെ പൊന്ന്–വെള്ളി–ചെമ്പ് എന്ന ക്രമവും ‘സമ്പാദിക്കുക’ എന്ന ക്രിയയുടെ ശക്തിയും നിലനിർത്തിയിട്ടുണ്ട്; അരപ്പട്ടയുടെ സാംസ്കാരിക ഉപയോഗം അടിക്കുറിപ്പിൽ വിശദീകരിക്കുന്നു.
