id: MAT.10.22
reference: Matthew 10:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων διὰ τὸ ὄνομά μου· ὁ δὲ ὑπομείνας εἰς τέλος οὗτος σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/022.yaml
  text: And you will be hated by all because of my name[d][c][b][a]. But the one who endures to the end will be saved.
translation:
  language: ml
  text: എന്റെ നാമം നിമിത്തം എല്ലാവരും നിങ്ങളെ വെറുക്കും.[a] എന്നാൽ അവസാനംവരെ സഹിച്ചുനിൽക്കുന്നവൻ[b] രക്ഷിക്കപ്പെടും.[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘എന്റെ നാമം കാരണം.’'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: ‘അവസാനംവരെ ഉറച്ചുനിൽക്കുന്നവൻ.’'
    reason: lexical_alternative
  - marker: c
    text: സന്ദർഭം എങ്ങനെ മനസ്സിലാക്കുന്നു എന്നതനുസരിച്ച് ‘രക്ഷിക്കപ്പെടും’ എന്നത് ‘വിടുവിക്കപ്പെടും’ എന്നോ ‘മോചിപ്പിക്കപ്പെടും’ എന്നോ മനസ്സിലാക്കാവുന്നതാണ്.
    reason: alternative_reading
  - marker: d
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘എന്നാൽ അവസാനംവരെ സഹിച്ചുനിൽക്കുന്നവൻ—അവൻ രക്ഷിക്കപ്പെടും.’'
    reason: source_structure
lexical_decisions:
- source_word: μισούμενοι ὑπὸ πάντων
  choice: എല്ലാവരും നിങ്ങളെ വെറുക്കും
  rationale: ഭാവിയിൽ അവർ അനുഭവിക്കാനിരിക്കുന്ന വെറുപ്പിന്റെ അവസ്ഥയെ മലയാളത്തിൽ സ്വാഭാവികമായ കർത്തൃപ്രയോഗത്തിലൂടെ വ്യക്തമാക്കുന്നു; πάντων എന്നതിന്റെ സമഗ്രതയും നിലനിർത്തുന്നു.
- source_word: διὰ τὸ ὄνομά μου
  choice: എന്റെ നാമം നിമിത്തം
  rationale: διά + accusative സൂചിപ്പിക്കുന്ന കാരണത്തെ വ്യക്തമാക്കുന്നു. ‘നാമം’ എന്നത് യേശുവിന്റെ വ്യക്തിത്വം, അധികാരം, അവനോടുള്ള കൂറ് എന്നിവ ഉൾക്കൊള്ളുന്ന ബൈബിൾപ്രയോഗമായി നിലനിർത്തുന്നു.
- source_word: ὁ δὲ ὑπομείνας
  choice: എന്നാൽ … സഹിച്ചുനിൽക്കുന്നവൻ
  rationale: ὑπομένω പീഡനത്തിനിടയിലും ഉറച്ചുനിൽക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘സഹിച്ചുനിൽക്കുക’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സന്ദർഭോചിതവുമാണ്; δέയുടെ വൈരുധ്യം ‘എന്നാൽ’ കൊണ്ട് നൽകുന്നു.
- source_word: εἰς τέλος
  choice: അവസാനംവരെ
  rationale: ഒരു അന്തിമബിന്ദുവോളം തുടരുന്നതെന്ന അർഥം ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: οὗτος
  choice: പ്രധാനവാക്യത്തിൽ പ്രത്യേകം ആവർത്തിച്ചിട്ടില്ല
  rationale: ഗ്രീക്കിലെ resumptive/emphatic സർവനാമത്തിന്റെ ഊന്നൽ മലയാളത്തിലെ ‘…ചെയ്യുന്നവൻ രക്ഷിക്കപ്പെടും’ എന്ന ഘടനയിൽ മതിയായ രീതിയിൽ പ്രകടമാകുന്നു; ‘അവൻതന്നെ’ എന്ന് ചേർക്കുന്നത് അർഥത്തെ അനാവശ്യമായി ശക്തമാക്കാം. കൂടുതൽ അക്ഷരാർഥപരമായ രൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: σωθήσεται
  choice: രക്ഷിക്കപ്പെടും
  rationale: σῴζωയുടെ രക്ഷ, വിടുതൽ, മോചനം എന്നീ അർഥവ്യാപ്തി ചുരുക്കാതെ, സന്ദർഭത്തിലെ അന്തിമരക്ഷയുടെ സാധ്യതയും നിലനിർത്തുന്ന വിശാലമായ പദമാണ്.
theological_decisions:
- issue: സഹിച്ചുനിൽക്കലും അന്തിമരക്ഷയും തമ്മിലുള്ള ബന്ധം
  choice: ‘രക്ഷിക്കപ്പെടും’ എന്ന വിശാലമായ പ്രയോഗം നിലനിർത്തി
  alternative: ശാരീരികമായി വിടുവിക്കപ്പെടും; അന്തിമ നിത്യരക്ഷ പ്രാപിക്കും; ഒരു പ്രത്യേക സ്ഥിരതാസിദ്ധാന്തം ഇവിടെ പഠിപ്പിക്കുന്നു
  rationale: വാക്യം സഹിച്ചുനിൽക്കലിനെയും രക്ഷയെയും ബന്ധിപ്പിക്കുന്നുവെങ്കിലും, രക്ഷയുടെ സ്വഭാവമോ അവയുടെ സിദ്ധാന്തപരമായ ബന്ധമോ ഇവിടെ വിവർത്തനം നിർണ്ണയിക്കുന്നില്ല. അതിനാൽ മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തിയും സംഘർഷവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘നാമം’, ‘രക്ഷിക്കപ്പെടും’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ അവയുടെ വിശാലമായ അർഥവ്യാപ്തി കാരണം നിലനിർത്തി; ഗ്രീക്ക് കർമ്മണിപ്രയോഗം ആദ്യ ഉപവാക്യത്തിൽ മലയാളത്തിന് സ്വാഭാവികമായ കർത്തൃപ്രയോഗമായി മാറ്റി.
