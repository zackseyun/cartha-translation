review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the summons, delegated authority, unclean spirits, expulsion, and the paired healing expression. However, placing “അവയുടെമേൽ” after the healing infinitives makes its referent structurally delayed and potentially ambiguous; the Greek attaches the authority directly to “unclean spirits.”
  naturalness: 'The proposed revision restores a clear Malayalam clause order: authority over the unclean spirits is stated immediately before the actions of expelling them and healing illness. “അസ്വസ്ഥത” is more idiomatic than “ദൗർബല്യം” with “സൗഖ്യമാക്കുക/സുഖപ്പെടുത്തുക” in this medical context.'
  terminology: “ശിഷ്യന്മാർ,” “അശുദ്ധാത്മാക്കൾ,” and “അധികാരം” are appropriate, established modern Malayalam terms. “അധികാരം” accurately represents ἐξουσία without reducing it to mere power. The disease/infirmity pair is retained without forcing an overly sharp distinction.
  issues:
  - severity: medium
    issue: The phrase “അവയുടെമേൽ അധികാരം” is positioned after “എല്ലാ രോഗവും എല്ലാ ദൗർബല്യവും സൗഖ്യമാക്കാനും.”
    rationale: This disrupts the Greek syntactic relationship between ἐξουσίαν and πνευμάτων ἀκαθάρτων and can momentarily suggest that the authority concerns the diseases or weaknesses. It should immediately follow “അശുദ്ധാത്മാക്കളുടെമേൽ.”
  - severity: low
    issue: “എല്ലാ ദൗർബല്യവും സൗഖ്യമാക്കാനും” is less idiomatic Malayalam for μαλακία in this context.
    rationale: Though defensible lexically, “അസ്വസ്ഥത” better conveys sickness/infirmity and combines naturally with “സുഖപ്പെടുത്തുക,” while preserving distinction from νόσος (“രോഗം”).
  revised_text: അവൻ തന്റെ പന്ത്രണ്ടു ശിഷ്യന്മാരെ തന്റെ അടുക്കലേക്കു വിളിച്ച്[a], അശുദ്ധാത്മാക്കളുടെമേൽ അധികാരം[b] അവർക്കു നൽകി; അവയെ പുറത്താക്കാനും എല്ലാ രോഗവും എല്ലാ അസ്വസ്ഥതയും സുഖപ്പെടുത്താനും.[c]
