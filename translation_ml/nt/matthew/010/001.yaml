id: MAT.10.1
reference: Matthew 10:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ προσκαλεσάμενος τοὺς δώδεκα μαθητὰς αὐτοῦ ἔδωκεν αὐτοῖς ἐξουσίαν πνευμάτων ἀκαθάρτων ὥστε ἐκβάλλειν αὐτὰ καὶ θεραπεύειν πᾶσαν νόσον καὶ πᾶσαν μαλακίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/001.yaml
  text: And calling his twelve disciples to himself[a], he gave them authority over unclean spirits[c][b], to cast them out and to heal every disease and every sickness.
translation:
  language: ml
  text: അവൻ തന്റെ പന്ത്രണ്ടു ശിഷ്യന്മാരെ തന്റെ അടുക്കലേക്കു വിളിച്ച്[a], അശുദ്ധാത്മാക്കളുടെമേൽ അധികാരം[b] അവർക്കു നൽകി; അവയെ പുറത്താക്കാനും എല്ലാ രോഗവും എല്ലാ അസ്വസ്ഥതയും സുഖപ്പെടുത്താനും.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തന്റെ പന്ത്രണ്ടു ശിഷ്യന്മാരെ തന്റെ അടുക്കലേക്കു വിളിച്ചശേഷം.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ശക്തി’; ഗ്രീക്ക് ἐξουσία എന്ന പദം പലപ്പോഴും ഏൽപ്പിക്കപ്പെട്ട അധികാരം എന്ന ആശയം വഹിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: ‘എല്ലാ രോഗവും എല്ലാ അസ്വസ്ഥതയും’ എന്നത് νόσος, μαλακία എന്നീ ബന്ധമുള്ള രണ്ടു ഗ്രീക്ക് പദങ്ങളെ പ്രതിഫലിപ്പിക്കുന്നു; μαλακിയയെ ‘ദൗർബല്യം’ അല്ലെങ്കിൽ ‘ക്ഷീണം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: അടുക്കൽ വിളിച്ച്
  rationale: സംബന്ധിച്ചവരെ തന്റെ അടുക്കലേക്കു വിളിച്ചുകൂട്ടുക എന്ന προσκαλέομαι എന്ന മധ്യപ്രയോഗത്തിന്റെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ഏഓറിസ്റ്റ് കൃതന്തത്തിന്റെ മുൻപ്രവൃത്തിസ്വഭാവവും നിലനിർത്തുന്നു.
- source_word: τοὺς δώδεκα μαθητὰς αὐτοῦ
  choice: തന്റെ പന്ത്രണ്ടു ശിഷ്യന്മാരെയും
  rationale: μαθητής എന്നതിന് സുവിശേഷസന്ദർഭത്തിൽ പതിവും വ്യക്തവുമായ പദം ‘ശിഷ്യൻ’ ആണ്; αὐτοῦ ‘തന്റെ’ എന്നു സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
- source_word: ἔδωκεν
  choice: നൽകി
  rationale: δίδωμι എന്ന സാധാരണ ക്രിയയുടെ ലളിതമായ അർഥം നിലനിർത്തുന്നു.
- source_word: ἐξουσίαν
  choice: അധികാരം
  rationale: വെറും ശക്തിയേക്കാൾ പ്രവർത്തിക്കാനുള്ള അവകാശമോ ഏൽപ്പിക്കപ്പെട്ട അധികാരമോ സൂചിപ്പിക്കുന്ന ἐξουσίαയുടെ അർഥത്തിന് യോജിക്കുന്നു.
- source_word: πνευμάτων ἀκαθάρτων
  choice: അശുദ്ധാത്മാക്കളുടെമേൽ
  rationale: ἐξουσίαയോടു ചേർന്ന ഷഷ്ഠീവ്യാകരണം ഇവയുടെമേൽ പ്രയോഗിക്കുന്ന അധികാരം സൂചിപ്പിക്കുന്നു; ‘അശുദ്ധാത്മാക്കൾ’ സുവിശേഷസന്ദർഭത്തിലെ വ്യക്തവും പരിചിതവുമായ പ്രയോഗമാണ്.
- source_word: ὥστε ἐκβάλλειν αὐτὰ
  choice: അവയെ പുറത്താക്കാൻ
  rationale: ὥστεയോടു ചേർന്ന അനന്തക്രിയ ഉദ്ദേശ്യവും ഫലവും ഉൾക്കൊള്ളാവുന്ന വിധത്തിൽ ‘-ാൻ’ എന്ന രൂപത്തിൽ നൽകി; αὐτά അശുദ്ധാത്മാക്കളെ തിരികെ സൂചിപ്പിക്കുന്നു.
- source_word: θεραπεύειν
  choice: സൗഖ്യമാക്കാൻ
  rationale: ഈ സന്ദർഭത്തിൽ θεραπεύω രോഗശാന്തി വരുത്തുക എന്നതാണ്; ആ അർഥം മാന്യവും സാധാരണക്കാർക്കു വ്യക്തവുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: πᾶσαν νόσον καὶ πᾶσαν μαλακίαν
  choice: എല്ലാ രോഗവും എല്ലാ ദൗർബല്യവും
  rationale: νόσος, μαλακία എന്നീ ബന്ധമുള്ളെങ്കിലും വ്യത്യസ്തമായ രണ്ടു ഗ്രീക്ക് പദങ്ങളെ യഥാക്രമം ‘രോഗം’, ‘ദൗർബല്യം’ എന്നു വേർതിരിച്ച് നിലനിർത്തുന്നു.
theological_decisions:
- issue: ശിഷ്യന്മാർക്കു നൽകിയതിന്റെ സ്വഭാവം
  choice: അശുദ്ധാത്മാക്കളുടെമേലുള്ള അധികാരം
  alternative: അശുദ്ധാത്മാക്കളുടെമേലുള്ള ശക്തി
  rationale: ἐξουσία വെറും അന്തർലീനശക്തിയല്ല, യേശു നൽകിയ പ്രവർത്തനാധികാരമാണ് എന്നു പദം സൂചിപ്പിക്കുന്നു; അതിലധികമായ സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: ὥστεയോടു ചേർന്ന അനന്തക്രിയകളിലെ ഉദ്ദേശ്യം/ഫലം
  choice: പുറത്താക്കാനും സൗഖ്യമാക്കാനും
  alternative: പുറത്താക്കുകയും സൗഖ്യമാക്കുകയും ചെയ്യത്തക്കവിധം
  rationale: ഗ്രീക്കിൽ ഉദ്ദേശ്യത്തിന്റെയും ഫലത്തിന്റെയും ഭാവം തമ്മിൽ പൂർണമായി നിർണയിക്കാതെ നിൽക്കുന്നതിനാൽ, മലയാളത്തിലെ അനന്തക്രിയാസമന്വയം ആ തുറന്ന സ്വഭാവം സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. കൃത്രിമമായ പദാനുപദക്രമം ഒഴിവാക്കി ഗ്രീക്ക് വാക്യത്തിലെ പ്രവർത്തനബന്ധങ്ങൾ സംരക്ഷിച്ചു. ‘രോഗം/ദൗർബല്യം’ എന്ന വ്യത്യാസം മൂലത്തിലെ രണ്ടു പദങ്ങളെയും ദൃശ്യമാക്കുന്നു.
