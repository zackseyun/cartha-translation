revisions:
- from: അവൻ തന്റെ പന്ത്രണ്ടു ശിഷ്യന്മാരെയും അടുക്കൽ വിളിച്ച്[a], അശുദ്ധാത്മാക്കളെ പുറത്താക്കാനും എല്ലാ രോഗവും എല്ലാ ദൗർബല്യവും സൗഖ്യമാക്കാനും അവയുടെമേൽ അധികാരം[b] അവർക്കു നൽകി.[c]
  to: അവൻ തന്റെ പന്ത്രണ്ടു ശിഷ്യന്മാരെ തന്റെ അടുക്കലേക്കു വിളിച്ച്[a], അശുദ്ധാത്മാക്കളുടെമേൽ അധികാരം[b] അവർക്കു നൽകി; അവയെ പുറത്താക്കാനും എല്ലാ രോഗവും എല്ലാ അസ്വസ്ഥതയും സുഖപ്പെടുത്താനും.[c]
  rationale: അശുദ്ധാത്മാക്കളുടെമേലുള്ള അധികാരം എന്ന ബന്ധം ഗ്രീക്ക് മൂലത്തോട് യോജിച്ചും മലയാളത്തിൽ ഉടൻ വ്യക്തമായും വരുന്നതിനായി പദക്രമം തിരുത്തി. αὐτάയെ വ്യക്തമായി അശുദ്ധാത്മാക്കളിലേക്കു ബന്ധിപ്പിക്കാൻ “അവയെ പുറത്താക്കാനും” അതിന്റെ പിന്നാലെ വെച്ചു. νόσος/μαλακία എന്ന ഇരട്ടപ്രയോഗം ‘രോഗം/അസ്വസ്ഥത’ എന്നായി നിലനിർത്തി; ഇത് വൈദ്യസന്ദർഭത്തിൽ കൂടുതൽ സ്വാഭാവികമാണ്. അർഥത്തിൽ സിദ്ധാന്തപരമായ കൂട്ടിച്ചേർക്കൽ ഒന്നും വരുത്തിയിട്ടില്ല.
