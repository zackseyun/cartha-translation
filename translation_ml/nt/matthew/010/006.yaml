id: MAT.10.6
reference: Matthew 10:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πορεύεσθε δὲ μᾶλλον πρὸς τὰ πρόβατα τὰ ἀπολωλότα οἴκου Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/006.yaml
  text: but go instead to the lost sheep of the house of Israel[a].
translation:
  language: ml
  text: എന്നാൽ, പകരം ഇസ്രായേൽഗൃഹത്തിലെ നഷ്ടപ്പെട്ട ആടുകളുടെ അടുക്കലേക്കു പോകുവിൻ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “മറിച്ച്, ഇസ്രായേൽഗൃഹത്തിൽനിന്ന് നഷ്ടപ്പെട്ട ആടുകളുടെ അടുക്കലേക്കു പോകുവിൻ.”'
    reason: ജനിറ്റീവ് ഘടനയുടെ ഒരു സാധ്യമായ പരിഭാഷ; മുഖ്യപാഠം ‘ഇസ്രായേൽഗൃഹത്തിലെ’ എന്ന സ്വാഭാവിക ബന്ധവായന നിലനിർത്തുന്നു.
lexical_decisions:
- source_word: πορεύεσθε
  choice: പോകുവിൻ
  rationale: വർത്തമാനകാല ബഹുവചന ആജ്ഞയുടെ സ്വഭാവം നിലനിർത്തുന്ന, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്കു വ്യക്തവുമായ പ്രയോഗം.
- source_word: δὲ μᾶλλον
  choice: പകരം
  rationale: മുൻവാക്യത്തിലെ വിലക്കിൽനിന്ന് മറ്റൊരു ലക്ഷ്യത്തിലേക്കുള്ള വിരുദ്ധമായ തിരിച്ചുവിടൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: πρὸς
  choice: അടുക്കലേക്കു
  rationale: ചലനക്രിയയോടൊപ്പം വ്യക്തികളിലേക്കുള്ള ദിശ സൂചിപ്പിക്കുന്ന πρός എന്നതിന്റെ അർത്ഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὰ πρόβατα τὰ ἀπολωλότα
  choice: കാണാതെപോയ ആടുകൾ
  rationale: ആടുകളെക്കുറിച്ചുള്ള മൂലരൂപകം നിലനിർത്തുകയും ἀπόλλυμι എന്നതിന്റെ സന്ദർഭോചിതമായ ‘lost’ എന്ന അർത്ഥം അധിക വ്യാഖ്യാനം കൂടാതെ നൽകുകയും ചെയ്യുന്നു.
- source_word: οἴκου Ἰσραήλ
  choice: ഇസ്രായേൽഗൃഹത്തിലെ
  rationale: ഉടമ്പടിപരവും സമൂഹപരവുമായ ബൈബിൾപ്രയോഗമായ ‘ഇസ്രായേൽഗൃഹം’ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ഇസ്രായേലിനെ ആടുകളുടെ രൂപകത്തിലൂടെ വിശേഷിപ്പിക്കൽ
  choice: ‘ഇസ്രായേൽഗൃഹത്തിലെ കാണാതെപോയ ആടുകൾ’ എന്ന രൂപകം അതേപടി നിലനിർത്തി.
  alternative: ‘വഴിതെറ്റിപ്പോയ ഇസ്രായേല്യർ’ എന്നു വ്യാഖ്യാനിച്ച് പറയുക.
  rationale: ഗ്രീക്കിൽ രൂപകം വ്യക്തമാണ്; പ്രവാചകസാഹിത്യവുമായി അതിനുള്ള ബന്ധവും ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ സംരക്ഷിക്കണം.
- issue: οἴκου Ἰσραήλ എന്ന ജനിറ്റീവ് ഘടനയുടെ ബന്ധം
  choice: ആടുകൾ ഇസ്രായേൽഗൃഹത്തിൽ ഉൾപ്പെട്ടവരാണെന്ന സ്വാഭാവിക വായന മുഖ്യപാഠത്തിൽ നൽകി.
  alternative: ‘ഇസ്രായേൽഗൃഹത്തിൽനിന്ന് കാണാതെപോയ ആടുകൾ’—അവർ ആ ഗൃഹത്തിൽനിന്ന് നഷ്ടപ്പെട്ടുവെന്ന വായന.
  rationale: ഗ്രീക്ക് ഘടന ഇരുവിധ ബന്ധവായനയ്ക്കും ഇട നൽകുന്നതിനാൽ പ്രധാന വായന പാഠത്തിലും മറ്റേതു അടിക്കുറിപ്പിലും സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ബൈബിൾശൈലി സ്വീകരിച്ചു. ‘പോകുവിൻ’ എന്ന ബഹുവചന ആജ്ഞയും ‘ഇസ്രായേൽഗൃഹം’ എന്ന പരമ്പരാഗതമായെങ്കിലും വ്യക്തമായ സംയുക്തപ്രയോഗവും നിലനിർത്തി; രൂപകം വ്യാഖ്യാനിച്ച് ലഘൂകരിച്ചില്ല.
