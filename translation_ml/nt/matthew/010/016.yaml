id: MAT.10.16
reference: Matthew 10:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἰδοὺ ἐγὼ ἀποστέλλω ὑμᾶς ὡς πρόβατα ἐν μέσῳ λύκων· γίνεσθε οὖν φρόνιμοι ὡς οἱ ὄφεις καὶ ἀκέραιοι ὡς αἱ περιστεραί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/016.yaml
  text: Look, I am sending you out as sheep in the midst of wolves; therefore be wise as the snakes and innocent as the doves.
translation:
  language: ml
  text: ഇതാ, ചെന്നായ്ക്കളുടെ നടുവിൽ ചെമ്മരിയാടുകളെപ്പോലെ ഞാൻ നിങ്ങളെ അയക്കുന്നു. അതുകൊണ്ട് പാമ്പുകളെപ്പോലെ വിവേകികളായിരിപ്പിൻ; പ്രാവുകളെപ്പോലെ നിഷ്കളങ്കരായിരിപ്പിൻ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ഊന്നൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀποστέλλω
  choice: അയക്കുന്നു
  rationale: യേശു ശിഷ്യരെ നിയോഗിച്ച് പുറപ്പെടുവിക്കുന്ന പ്രവൃത്തിയെ നേരിട്ടും വ്യക്തമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: ὡς πρόβατα ἐν μέσῳ λύκων
  choice: ചെന്നായ്ക്കളുടെ നടുവിലേക്ക് ചെമ്മരിയാടുകളെപ്പോലെ
  rationale: ദുർബലരും അപകടത്തിന് വിധേയരുമായ ശിഷ്യരുടെ സ്ഥിതിയെ സൂചിപ്പിക്കുന്ന ഉപമയും, അയയ്ക്കപ്പെടുന്ന ലക്ഷ്യപരിസരം സൂചിപ്പിക്കുന്ന ἐν μέσῳ എന്ന പ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: φρόνιμοι
  choice: വിവേകമുള്ളവർ
  rationale: പ്രായോഗിക ബുദ്ധി, ജാഗ്രത, സൂക്ഷ്മമായ തിരിച്ചറിവ് എന്നിവ ഉൾക്കൊള്ളുന്ന പദം; വെറും അറിവ് എന്നതിനെക്കാൾ യോജിച്ചത്.
- source_word: οἱ ὄφεις
  choice: പാമ്പുകൾ
  rationale: ഉറവിടത്തിലെ സാധാരണ ജീവിനാമം നേരിട്ട് നൽകുന്നു; അനാവശ്യമായ പ്രതീകവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: ἀκέραιοι
  choice: നിഷ്കളങ്കർ
  rationale: ദോഷം കലരാത്ത, ദ്രോഹരഹിതമായ സ്വഭാവം വ്യക്തമാക്കുന്നു; ഇവിടെ ഉദ്ദേശിക്കുന്നത് ബുദ്ധിഹീനമായ നിർദോഷതയല്ല.
- source_word: αἱ περιστεραί
  choice: പ്രാവുകൾ
  rationale: ഉറവിടത്തിലെ ഉപമയെ സ്വാഭാവികമായ മലയാളത്തിൽ നേരിട്ട് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: പാമ്പിന്റെ വിവേകവും പ്രാവിന്റെ നിഷ്കളങ്കതയും തമ്മിലുള്ള ഉദ്ദേശപൂർവമായ സംഘർഷം
  choice: രണ്ടു ഗുണങ്ങളും സമാന്തരമായി നിലനിർത്തി
  alternative: വിവേകത്തെ കൗശലമായോ നിഷ്കളങ്കതയെ നിഷ്ക്രിയതയായോ വ്യാഖ്യാനിച്ച് വ്യക്തമാക്കുക
  rationale: വാക്യം ജാഗ്രതയും ദോഷരഹിതതയും ഒരുമിച്ച് ആവശ്യപ്പെടുന്നു; ഇവയിൽ ഒന്നിനെ മറ്റൊന്നാൽ മൃദൂകരിക്കുകയോ പ്രത്യേക സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുകയോ ചെയ്യരുത്.
- issue: അയയ്ക്കുന്ന പ്രവൃത്തിയുടെ വർത്തമാനകാല ഊന്നൽ
  choice: “ഞാൻ നിങ്ങളെ അയക്കുന്നു”
  alternative: “ഞാൻ നിങ്ങളെ അയയ്ക്കും” അല്ലെങ്കിൽ “അയച്ചിരിക്കുന്നു”
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാല ക്രിയയുടെ തത്സമയ നിയോഗഭാവം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സഭാവായനയ്ക്കും സാധാരണ വായനക്കാർക്കും യോജിച്ച ഗൗരവമുള്ള മലയാളം. ഉപമകളുടെ മൂർച്ചയും കല്പനയുടെ നേരിട്ടുള്ള സ്വഭാവവും നിലനിർത്തി; അനാവശ്യമായ പഴഞ്ചൊല്ല് ശൈലിയോ വിഭാഗീയ പദാവലിയോ ഒഴിവാക്കി.
