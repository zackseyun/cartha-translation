id: MAT.10.13
reference: Matthew 10:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐὰν μὲν ᾖ ἡ οἰκία ἀξία, ἐλθάτω ἡ εἰρήνη ὑμῶν ἐπ’ αὐτήν· ἐὰν δὲ μὴ ᾖ ἀξία, ἡ εἰρήνη ὑμῶν ⸀πρὸς ὑμᾶς ἐπιστραφήτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/013.yaml
  text: And if the house is worthy[a], let your peace come upon it; but if it is not worthy[c][b], let your peace return to you.
translation:
  language: ml
  text: ആ വീട്[a] യോഗ്യമാണെങ്കിൽ[b], നിങ്ങളുടെ സമാധാനം അതിന്മേൽ വരട്ടെ; എന്നാൽ അത് യോഗ്യമല്ലെങ്കിൽ, നിങ്ങളുടെ സമാധാനം നിങ്ങളിലേക്കു മടങ്ങിവരട്ടെ.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഭവനം’ അല്ലെങ്കിൽ ‘വീട്ടുകാർ’; ‘വീട്’ എന്ന ഗ്രീക്ക് പദം താമസസ്ഥലത്തെയും, അർഥവ്യാപ്തിയിൽ, അവിടെ താമസിക്കുന്നവരെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘യോഗ്യം’ എന്നത് ധാർമികമായി പാപരഹിതം എന്നല്ല, ദൂതന്മാരെയും അവരുടെ സമാധാനാശംസയെയും സ്വീകരിക്കാൻ തക്കത് എന്നാണ്.
    reason: cultural_note
  - marker: c
    text: അഥവാ ‘നിങ്ങളിലേക്കു തിരിഞ്ഞുവരട്ടെ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκία
  choice: വീട്
  rationale: ഗ്രീക്ക് പദത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘വീട്’ എന്നാണ്; ഈ സന്ദർഭത്തിൽ അതിൽ താമസിക്കുന്ന വീട്ടുകാരെയും അത് ഉൾക്കൊള്ളാം. പ്രധാന പാഠത്തിൽ ദൃശ്യമായ വീടെന്ന രൂപകവും ഏകവചന സൂചനയും നിലനിർത്തി.
- source_word: ἀξία
  choice: യോഗ്യം
  rationale: സ്വീകരിക്കാൻ തക്കതോ അനുയോജ്യമോ എന്ന വിലയിരുത്തൽ നിലനിർത്തുന്ന സ്വാഭാവിക മലയാള പദം. ‘സ്വീകാര്യത കാണിക്കുന്ന’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് ഗ്രീക്ക് പദത്തിന്റെ അർഥം അനാവശ്യമായി ചുരുക്കും.
- source_word: ἐλθάτω
  choice: വരട്ടെ
  rationale: ἔρχομαι എന്ന ക്രിയയുടെ ആജ്ഞാർഥബലം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: εἰρήνη
  choice: സമാധാനം
  rationale: εἰρήνηയുടെ സാധാരണ തത്തുല്യപദം; ക്ഷേമവും അനുഗ്രഹവും ഉൾക്കൊള്ളുന്ന വിശാലമായ സെമിറ്റിക് പശ്ചാത്തലം സന്ദർഭത്തിൽ സൂചിതമായി നിലനിൽക്കുന്നു.
- source_word: ἐπ’ αὐτήν
  choice: അതിന്മേൽ
  rationale: സമാധാനം വീടിന്മേൽ വരുന്നു എന്ന ദിശാസൂചക രൂപകം സംരക്ഷിക്കുന്നു.
- source_word: πρὸς ὑμᾶς
  choice: നിങ്ങളിലേക്ക്
  rationale: πρός എന്നതിന്റെ ദിശാസൂചക അർഥം നൽകുന്നു; ἐπιστραφήτωയോടൊപ്പം ‘നിങ്ങളിലേക്കു മടങ്ങിവരട്ടെ’ എന്നു സ്വാഭാവികമായി വായിക്കാം.
- source_word: ἐπιστραφήτω
  choice: മടങ്ങിവരട്ടെ
  rationale: സമാധാനം അവിടെ നിലനിൽക്കാതെ ശിഷ്യന്മാരിലേക്കു തിരികെ വരുന്നു എന്ന അർഥവും ആജ്ഞാർഥ രൂപവും വ്യക്തമായി നൽകുന്നു.
- source_word: μὲν ... δὲ
  choice: …എങ്കിൽ …; എന്നാൽ …എങ്കിൽ
  rationale: ഗ്രീക്കിലെ സമാന്തര വൈരുധ്യഘടന സ്വാഭാവിക മലയാള വാക്യക്രമത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘നിങ്ങളുടെ സമാധാനം’ എന്നതിന്റെ സ്വഭാവം
  choice: ശിഷ്യന്മാരുടെ സമാധാനാശംസ വീടിന്മേൽ വരുകയോ അവരിലേക്കു മടങ്ങിവരുകയോ ചെയ്യുന്നതായി പാഠത്തിലെ സജീവരൂപകം നിലനിർത്തി.
  alternative: ‘നിങ്ങൾ ആശംസിക്കുന്ന സമാധാനം’ അല്ലെങ്കിൽ ‘നിങ്ങൾ പ്രഖ്യാപിക്കുന്ന സമാധാനം’ എന്നു വിശദീകരിക്കുക.
  rationale: മൂലപാഠം സമാധാനത്തെ വെറും അഭിവാദ്യമായി ചുരുക്കുന്നില്ല; അതേസമയം അതിന്റെ പ്രവർത്തനത്തെക്കുറിച്ച് സിദ്ധാന്തപരമായ വിശദീകരണവും നൽകുന്നില്ല. അതിനാൽ യഥാർഥമായ ദൈവശാസ്ത്രപരമായ സംഘർഷവും രൂപകവും പരിഭാഷയിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘അതിന്’ എന്നതിനു പകരം ‘അതിന്മേൽ’ ഉപയോഗിച്ച് സമാധാനം വീടിന്മേൽ വരുന്നു എന്ന മൂലരൂപകം സൂക്ഷിച്ചു; ‘മടങ്ങിവരട്ടെ’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായിരിക്കെ ഗ്രീക്കിലെ ആജ്ഞാർഥവും ദിശയും നിലനിർത്തുന്നു.
