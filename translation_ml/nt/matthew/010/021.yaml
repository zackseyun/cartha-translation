id: MAT.10.21
reference: Matthew 10:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: παραδώσει δὲ ἀδελφὸς ἀδελφὸν εἰς θάνατον καὶ πατὴρ τέκνον, καὶ ἐπαναστήσονται τέκνα ἐπὶ γονεῖς καὶ θανατώσουσιν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/021.yaml
  text: And brother will hand over brother to death[a], and a father his child, and children will rise up against parents and put them to death.
translation:
  language: ml
  text: സഹോദരൻ സഹോദരനെ മരണത്തിന് ഏല്പിച്ചുകൊടുക്കും[a]; അപ്പൻ തന്റെ കുട്ടിയെ മരണത്തിന് ഏല്പിച്ചുകൊടുക്കും. മക്കൾ മാതാപിതാക്കൾക്കെതിരെ എഴുന്നേറ്റ് അവരെ കൊന്നുകളയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കൈമാറിക്കൊടുക്കും’; വഞ്ചനയുടെ സാഹചര്യങ്ങളിൽ ഈ ക്രിയയ്ക്ക് ‘ഒറ്റിക്കൊടുക്കും’ എന്ന അർഥവും വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδώσει
  choice: ഏല്പിച്ചുകൊടുക്കും
  rationale: ശത്രുക്കളുടെയോ അധികാരികളുടെയോ കയ്യിൽ ഒരാളെ വിട്ടുകൊടുക്കുക എന്ന ക്രിയയുടെ മൂർത്തമായ അർഥം നിലനിർത്തുന്നു; വഞ്ചന എന്ന ആശയം നിർബന്ധമായി ചേർക്കുന്നില്ല.
- source_word: ἀδελφὸς ... ἀδελφὸν
  choice: സഹോദരൻ സഹോദരനെ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ഏകവചനവും പ്രതിനിധാനപരമായ കുടുംബബന്ധവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: εἰς θάνατον
  choice: മരണത്തിന്
  rationale: ഏല്പിച്ചുകൊടുക്കുന്നതിന്റെ അന്തിമഫലമോ ലക്ഷ്യമോ മരണമാണെന്നത് സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
- source_word: πατὴρ τέκνον
  choice: അപ്പൻ തന്റെ കുഞ്ഞിനെയും
  rationale: τέκνον ലിംഗനിർണ്ണയമില്ലാത്ത ഏകവചനമായതിനാൽ ‘കുഞ്ഞ്’ എന്നു പരിഭാഷപ്പെടുത്തി; മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി ‘തന്റെ’ ചേർത്തു. മുൻ ക്രിയ ആവർത്തിക്കാതെ ‘അങ്ങനെ ചെയ്യും’ എന്നു പൂരിപ്പിച്ചു.
- source_word: ἐπαναστήσονται
  choice: എതിരെ എഴുന്നേറ്റ്
  rationale: വിരോധത്തോടെയുള്ള എഴുന്നേൽപ്പിന്റെ സജീവ ദൃശ്യഭാവം സൂക്ഷിക്കുന്നു; രാഷ്ട്രീയ കലാപം എന്ന പരിമിത അർഥം ചുമത്തുന്നില്ല.
- source_word: τέκνα ... γονεῖς
  choice: മക്കൾ ... മാതാപിതാക്കൾ
  rationale: ഇരുപദങ്ങളുടെയും ലിംഗസമാവേശകമായ കുടുംബപരിധി സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: θανατώσουσιν αὐτούς
  choice: അവരെ കൊന്നുകളയും
  rationale: മനഃപൂർവം മരണത്തിന് ഇടയാക്കുക എന്ന ശക്തമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; αὐτούς എന്ന സർവനാമത്തിന്റെ പ്രവാഹവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: കുടുംബബന്ധപദങ്ങളുടെ ലിംഗവും പ്രതിനിധാന സ്വഭാവവും
  choice: ἀδελφός എന്നത് ‘സഹോദരൻ’ എന്നും τέκνα/γονεῖς എന്നവ ‘മക്കൾ/മാതാപിതാക്കൾ’ എന്നും നിലനിർത്തി.
  alternative: ἀδελφός എന്നത് പൊതുവായി ‘സഹോദരങ്ങളിൽ ഒരാൾ’ എന്നു പരിഭാഷപ്പെടുത്തുക.
  rationale: ἀδελφός ഇവിടെ പുല്ലിംഗമാണ്; മറ്റു രണ്ടു പദങ്ങൾ ലിംഗസമാവേശകമാണ്. അതിനാൽ ഓരോ ഗ്രീക്ക് പദത്തിന്റെയും യഥാർഥ വ്യാപ്തി വേർതിരിച്ചു സൂക്ഷിച്ചു.
- issue: παραδίδωμι എന്ന ക്രിയയിലെ വഞ്ചനയുടെ സാധ്യത
  choice: പ്രധാനവാചകത്തിൽ ‘ഏല്പിച്ചുകൊടുക്കും’ എന്നു നൽകി; ‘ഒറ്റിക്കൊടുക്കും’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
  alternative: പ്രധാനവാചകത്തിൽ തന്നെ ‘ഒറ്റിക്കൊടുക്കും’ എന്നു നൽകുക.
  rationale: കുടുംബപരിസരം വഞ്ചനയുടെ ധ്വനി നൽകാമെങ്കിലും ക്രിയയുടെ അടിസ്ഥാന അർഥം ശത്രുക്കളുടെയോ അധികാരികളുടെയോ കയ്യിൽ ഏല്പിക്കുക എന്നതാണ്; അതിനാൽ കൂടുതൽ നിർദ്ദിഷ്ടമായ വ്യാഖ്യാനം പ്രധാനവാചകത്തിൽ നിർബന്ധിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗ്രീക്കിലെ ആവർത്തനവും കുടുംബബന്ധങ്ങളുടെ തീവ്രതയും കഴിയുന്നത്ര നിലനിർത്തി; എന്നാൽ രണ്ടാം ഉപവാക്യത്തിലെ ഒഴിവാക്കിയ ക്രിയ മലയാളത്തിൽ സ്വാഭാവികമായി പൂരിപ്പിച്ചു.
