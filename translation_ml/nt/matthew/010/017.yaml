id: MAT.10.17
reference: Matthew 10:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: προσέχετε δὲ ἀπὸ τῶν ἀνθρώπων· παραδώσουσιν γὰρ ὑμᾶς εἰς συνέδρια, καὶ ἐν ταῖς συναγωγαῖς αὐτῶν μαστιγώσουσιν ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/017.yaml
  text: But beware of people[a], for they will hand you over to councils, and in their synagogues they will flog you.
translation:
  language: ml
  text: എന്നാൽ ആളുകളെക്കുറിച്ച് ജാഗ്രത പുലർത്തുക; അവർ നിങ്ങളെ ന്യായസഭകൾക്ക് ഏൽപ്പിക്കും; അവരുടെ സിനഗോഗുകളിൽവെച്ച് നിങ്ങളെ ചമ്മട്ടികൊണ്ട് അടിക്കും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσέχετε
  choice: സൂക്ഷിച്ചുകൊള്ളുക
  rationale: അപകടസാധ്യതയെക്കുറിച്ചുള്ള ജാഗ്രതാനിർദേശം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭത്തിൽനിന്നുള്ള മുന്നറിയിപ്പിലേക്കുള്ള മൃദുവായ വിരുദ്ധതിരിവ് സൂചിപ്പിക്കുന്നു.
- source_word: ἀπὸ τῶν ἀνθρώπων
  choice: മനുഷ്യരെ
  rationale: προσέχω + ἀπό എന്ന പ്രയോഗത്തിന്റെ ‘ആരിൽനിന്നുള്ള അപകടത്തെക്കുറിച്ച് സൂക്ഷിക്കുക’ എന്ന അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ἄνθρωποι ഇവിടെ ലിംഗഭേദമില്ലാതെ മനുഷ്യരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: παραδώσουσιν
  choice: ഏല്പിക്കുകയും ചെയ്യും
  rationale: അധികാരികളുടെ കൈയിൽ നിയമനടപടിക്കായി വിട്ടുകൊടുക്കുക എന്ന ആശയം നൽകുന്നു; ‘ഒറ്റിക്കൊടുക്കുക’ എന്നു പറഞ്ഞ് ബന്ധപരമായ വഞ്ചന അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: συνέδρια
  choice: ന്യായസഭകൾ
  rationale: യെരൂശലേമിലെ ഏക മഹാസഭയെ മാത്രമല്ല, പ്രാദേശിക ഭരണ-ന്യായ സമിതികളെയും സൂചിപ്പിക്കാവുന്ന ബഹുവചനത്തിന്റെ സ്ഥാപനപരവും ന്യായപരവുമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: συναγωγαῖς
  choice: സിനഗോഗുകളിൽ
  rationale: യഹൂദരുടെ പ്രത്യേക ആരാധനാ-സമൂഹസ്ഥലത്തെ സൂചിപ്പിക്കുന്ന പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: αὐτῶν
  choice: അവരുടെ
  rationale: സിനഗോഗുകളോടുള്ള അവരുടെ ബന്ധം അഥവാ ഉടമസ്ഥത സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: μαστιγώσουσιν
  choice: ചമ്മട്ടികൊണ്ട് അടിക്കുകയും ചെയ്യും
  rationale: ന്യായശിക്ഷയായ ചമ്മട്ടിയടി ആധുനിക വായനക്കാർക്ക് വ്യക്തമായി മനസ്സിലാകുന്ന വിധത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ἀνθρώπων എന്ന പദത്തിന്റെ ലിംഗസൂചന
  choice: മനുഷ്യരെ
  alternative: പുരുഷന്മാരെ
  rationale: ഗ്രീക്കിൽ രൂപപരമായി പുല്ലിംഗ ബഹുവചനമാണെങ്കിലും ഇവിടെ അർഥം പൊതുവായി മനുഷ്യപ്രതിയോഗികളെയാണ് സൂചിപ്പിക്കുന്നത്; പുരുഷന്മാർക്ക് മാത്രമായി പരിമിതപ്പെടുത്തുന്ന വിവർത്തനം മൂലപാഠത്തേക്കാൾ സങ്കുചിതമാകും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കല്പനാശൈലി. ‘ന്യായസഭകൾ’ പ്രാദേശിക ന്യായസമിതികളുടെ ബഹുവചനത്തെ നിലനിർത്തുന്നു; ‘സിനഗോഗ്’ പ്രത്യേക യഹൂദ സ്ഥാപനത്തെ വ്യക്തമായി തിരിച്ചറിയിക്കുന്നു.
