id: MAT.10.30
reference: Matthew 10:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὑμῶν δὲ καὶ αἱ τρίχες τῆς κεφαλῆς πᾶσαι ἠριθμημέναι εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/030.yaml
  text: But even the hairs of your head are all numbered[a].
translation:
  language: ml
  text: എന്നാൽ നിങ്ങളുടെ തലയിലെ മുടിയിഴകൾപോലും എല്ലാം എണ്ണപ്പെട്ടിരിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എണ്ണിക്കഴിഞ്ഞിരിക്കുന്നു.’ ഗ്രീക്കിലെ പൂർണകാല കർമണി രൂപം പൂർത്തിയായ പ്രവൃത്തിയെയും അതിന്റെ ഇപ്പോഴും തുടരുന്ന ഫലത്തെയും ഊന്നിപ്പറയാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμῶν
  choice: നിങ്ങളുടെ
  rationale: രണ്ടാംപുരുഷ ബഹുവചനത്തിലുള്ള ഉടമസ്ഥബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി ‘നിങ്ങളുടെ’ എന്നു പ്രകടിപ്പിക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭത്തോടുള്ള മൃദുവായ വൈരുധ്യവും ആശയത്തിരിവും നിലനിർത്തുന്നു.
- source_word: καὶ
  choice: പോലും
  rationale: നിസ്സാരമായി തോന്നാവുന്ന ഓരോ മുടിയിഴയിലേക്കുപോലും ശ്രദ്ധ വ്യാപിക്കുന്നു എന്ന ഊന്നൽ നൽകുന്നു.
- source_word: αἱ τρίχες τῆς κεφαλῆς
  choice: നിങ്ങളുടെ തലയിലെ മുടിയിഴകൾ
  rationale: ഗ്രീക്കിലെ ‘തലയുടെ രോമങ്ങൾ’ എന്ന ബന്ധത്തെ ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു; ‘മുടിയിഴകൾ’ ഓരോന്നിനെയും സൂചിപ്പിക്കുന്ന ചിത്രവും സംരക്ഷിക്കുന്നു.
- source_word: πᾶσαι
  choice: എല്ലാം
  rationale: ഒന്നും ഒഴിവാകാത്ത സമഗ്രത നിലനിർത്തുന്നു.
- source_word: ἠριθμημέναι εἰσίν
  choice: എണ്ണപ്പെട്ടിരിക്കുന്നു
  rationale: പൂർ‍ത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴും നിലനിൽക്കുന്ന ഫലം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പൂർണകാല കർമണി ഘടനയെ സംക്ഷിപ്തമായി പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: വചനത്തിൽ സൂചിപ്പിക്കുന്ന ദൈവിക അറിവിന്റെയും കരുതലിന്റെയും വ്യാപ്തി
  choice: മുടിയിഴകൾ എല്ലാം എണ്ണപ്പെട്ടിരിക്കുന്നു എന്ന ദൃശ്യപ്രസ്താവന നേരിട്ട് നിലനിർത്തി.
  alternative: ദൈവം എല്ലാം അറിയുകയോ പരിപാലിക്കുകയോ ചെയ്യുന്നു എന്ന് വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കൽ.
  rationale: മൂലവാക്യം ദൈവശാസ്ത്രപരമായ നിഗമനം വിശദീകരിക്കുന്നില്ല; ആ അർത്ഥം സന്ദർഭത്തിൽനിന്ന് ഉയരാൻ അനുവദിക്കുന്നതാണ് ഉചിതം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘മുടിയിഴകൾപോലും’ എന്ന പ്രയോഗം καὶയുടെ ഊന്നൽ സ്വാഭാവികമായി പകരുന്നു.
