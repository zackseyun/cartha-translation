id: MAT.10.10
reference: Matthew 10:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μὴ πήραν εἰς ὁδὸν μηδὲ δύο χιτῶνας μηδὲ ὑποδήματα μηδὲ ⸀ῥάβδον· ἄξιος γὰρ ὁ ἐργάτης τῆς τροφῆς ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/010.yaml
  text: do not take a traveler's bag for the road[a], or two tunics, or sandals, or a staff; for the worker is worthy of his food.
translation:
  language: ml
  text: യാത്രയ്ക്കായി സഞ്ചിയോ രണ്ട് അങ്കികളോ ചെരിപ്പുകളോ വടിയോ[a] എടുക്കരുത്; വേലക്കാരൻ തന്റെ ആഹാരത്തിന് അർഹനാണല്ലോ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: മർക്കോസ് 6:8-ൽ ഒരു വടി കൊണ്ടുപോകാൻ അനുവദിക്കുന്നതിനാൽ, ഇവിടെ അധികമായി മറ്റൊരു വടി കൊണ്ടുപോകരുത് എന്നാണ് ചിലർ മനസ്സിലാക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: πήραν
  choice: സഞ്ചി
  rationale: യാത്രയിൽ സാധനങ്ങളോ ഭക്ഷണമോ കൊണ്ടുപോകാൻ ഉപയോഗിക്കുന്ന സഞ്ചിയെയാണ് πήρα സൂചിപ്പിക്കുന്നത്. സമീപത്തുള്ള ‘യാത്രയ്ക്കായി’ എന്ന പ്രയോഗം അതിന്റെ യാത്രാസന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: εἰς ὁδὸν
  choice: യാത്രയ്ക്കായി
  rationale: യാത്രയിൽ കൂടെ കൊണ്ടുപോകുന്നതിനെ സൂചിപ്പിക്കുന്ന ഈ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളരൂപം.
- source_word: δύο χιτῶνας
  choice: രണ്ട് അങ്കികൾ
  rationale: χιτών ശരീരത്തിൽ ധരിച്ചിരുന്ന അടിസ്ഥാനവസ്ത്രത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘അങ്കി’ ചരിത്രസന്ദർഭം നിലനിർത്തുകയും പൊതുവായ ‘വസ്ത്രം’ എന്നതിനെക്കാൾ കൃത്യത നൽകുകയും ചെയ്യുന്നു.
- source_word: ὑποδήματα
  choice: ചെരിപ്പുകൾ
  rationale: കാലിൽ കെട്ടി ധരിക്കുന്ന പാദരക്ഷയാണ് ഉദ്ദേശ്യം; ആധുനിക മലയാളത്തിൽ ‘ചെരിപ്പ്’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: ῥάβδον
  choice: വടി
  rationale: യാത്രയിൽ താങ്ങായി ഉപയോഗിക്കുന്ന വടിയെയാണ് സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്. മർക്കോസ് 6:8-നോടുള്ള പ്രത്യക്ഷ വ്യത്യാസം പരിഭാഷയിൽ സമന്വയിപ്പിക്കാതെ നിലനിർത്തുന്നു.
- source_word: ἄξιος
  choice: അർഹനാണ്
  rationale: യോഗ്യതയോ ന്യായമായ അവകാശമോ ഉള്ളവൻ എന്ന ἄξιος-ന്റെ മൂല്യനിർണയഭാവം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ὁ ἐργάτης
  choice: വേലക്കാരൻ
  rationale: പ്രവർത്തിക്കുന്നയാളെ സൂചിപ്പിക്കുന്ന സാധാരണവും സന്ദർഭോചിതവുമായ പദം; സഭാപരമായ സാങ്കേതിക അർത്ഥം ചേർക്കുന്നില്ല.
- source_word: τῆς τροφῆς αὐτοῦ
  choice: തന്റെ ആഹാരത്തിന്
  rationale: τροφή-യുടെ മൂർത്തമായ അർത്ഥം ഭക്ഷണം/ആഹാരം എന്നാണ്. ‘പിന്തുണ’ പോലുള്ള വിശാലവും വ്യാഖ്യാനാത്മകവുമായ പദം ഒഴിവാക്കുന്നു; αὐτοῦ പ്രതിഫലിപ്പിക്കാൻ ‘തന്റെ’ ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: യാത്രാസാമഗ്രികളെക്കുറിച്ചുള്ള സമാന്തര സുവിശേഷവിവരണങ്ങളുമായി പൊരുത്തപ്പെടുത്താനുള്ള സാധ്യത
  choice: മത്തായിയുടെ വാചകത്തിലുള്ള ‘വടിയോ എടുക്കരുത്’ എന്ന വിലക്ക് മുഖ്യപാഠത്തിൽ അതേപടി നിലനിർത്തുന്നു.
  alternative: മർക്കോസ് 6:8-ന്റെ വെളിച്ചത്തിൽ ‘അധികമായി ഒരു വടി എടുക്കരുത്’ എന്ന് വ്യാഖ്യാനിക്കാം.
  rationale: ഗ്രീക്ക് പാഠം ῥάβδον എന്നതിനെ വിലക്കപ്പെട്ട സാധനങ്ങളുടെ പട്ടികയിൽ വ്യക്തമായി ഉൾപ്പെടുത്തുന്നു. അതിനാൽ സുവിശേഷവിവരണങ്ങൾ തമ്മിലുള്ള പിരിമുറുക്കം പരിഭാഷയിൽ നിശ്ശബ്ദമായി പരിഹരിക്കാതെ, മറ്റൊരു ധാരണ അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. പട്ടിക മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ വിഭക്തി ഓരോ ഘടകത്തോടും ചേർത്തിരിക്കുന്നു; മൂലപാഠത്തിലെ നിർദേശം, കാരണം, സമാന്തരവിവരണങ്ങളോടുള്ള യഥാർഥ പിരിമുറുക്ക് എന്നിവ സംരക്ഷിച്ചിട്ടുണ്ട്.
