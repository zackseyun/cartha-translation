id: MAT.10.32
reference: Matthew 10:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Πᾶς οὖν ὅστις ὁμολογήσει ἐν ἐμοὶ ἔμπροσθεν τῶν ἀνθρώπων, ὁμολογήσω κἀγὼ ἐν αὐτῷ ἔμπροσθεν τοῦ πατρός μου τοῦ ⸀ἐν οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/032.yaml
  text: Therefore everyone who confesses me before men[b][a], I also will confess before my Father who is in heaven.
translation:
  language: ml
  text: അതുകൊണ്ട്, മനുഷ്യരുടെ മുമ്പിൽ എന്നെ[a] ഏറ്റുപറയുന്ന ഏവനെയും, സ്വർഗസ്ഥനായ എന്റെ പിതാവിന്റെ മുമ്പിൽ ഞാനും അവനെ[b] ഏറ്റുപറയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘എന്നിൽ ഏറ്റുപറയുന്ന’ എന്നാണ്. ഇവിടെ അത് യേശുവിനെ പരസ്യമായി അംഗീകരിക്കുന്നതോ അവനോടുള്ള ബന്ധം ഏറ്റുപറയുന്നതോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘അവനിൽ ഏറ്റുപറയും’ അഥവാ ‘അവനെ സംബന്ധിച്ച് ഏറ്റുപറയും’ എന്നാണ്; മലയാളത്തിൽ അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘അവനെ ഏറ്റുപറയും’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς οὖν ὅστις
  choice: അതുകൊണ്ട് ... ഏവനെയും
  rationale: Πᾶς ... ὅστις എന്നത് ഉൾക്കൊള്ളുന്ന പൊതുപ്രയോഗമാണ്; മലയാളത്തിൽ ‘... ഏവനെയും’ എന്ന് സ്വാഭാവികമായി നൽകി. οὖν മുൻസന്ദർഭത്തോടുള്ള നിഗമനബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ ‘അതുകൊണ്ട്’ നിലനിർത്തി.
- source_word: ὁμολογήσει / ὁμολογήσω
  choice: ഏറ്റുപറയുന്ന / ഏറ്റുപറയും
  rationale: ὁμολογέω ഇവിടെ യേശുവിനെ പരസ്യമായി അംഗീകരിക്കുന്നതും അവനോടുള്ള ബന്ധം പ്രഖ്യാപിക്കുന്നതുമായ അർഥം വഹിക്കുന്നു. വാക്യത്തിന്റെ ഇരുഭാഗത്തുമുള്ള പരസ്പരത നിലനിർത്താൻ ഒരേ മലയാളക്രിയ ഉപയോഗിച്ചു.
- source_word: ἐν ἐμοὶ
  choice: എന്നെ
  rationale: ὁμολογέωയോടൊപ്പമുള്ള ἐν എന്ന പ്രയോഗം മലയാളത്തിൽ അക്ഷരാർഥമായി ‘എന്നിൽ ഏറ്റുപറയുക’ എന്നു നൽകിയാൽ അസ്വാഭാവികവും അവ്യക്തവുമാകും. അതിനാൽ വ്യക്തിയെ ഏറ്റുപറയുക എന്ന സ്വാഭാവിക രൂപം മുഖ്യപാഠത്തിൽ നൽകി; ഗ്രീക്കിലെ രൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: മനുഷ്യരുടെ മുമ്പിൽ
  rationale: ἔμπροσθεν സാന്നിധ്യത്തിൽ അഥവാ മുമ്പിൽ എന്ന അർഥം നൽകുന്നു. ἀνθρώπων ഇവിടെ മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നതിനാൽ ലിംഗഭേദമില്ലാത്ത സ്വാഭാവിക മലയാളമായ ‘മനുഷ്യർ’ ഉപയോഗിച്ചു.
- source_word: ἐν αὐτῷ
  choice: അവനെ
  rationale: ആദ്യത്തെ ἐν ἐμοὶ എന്ന പ്രയോഗത്തോടുള്ള സമാന്തരതയും പരസ്പര ഏറ്റുപറച്ചിലും വ്യക്തമായി നൽകാൻ ‘അവനെ’ എന്നു വിവർത്തനം ചെയ്തു. ‘അവനിൽ’ എന്ന കൂടുതൽ അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: സ്വർഗസ്ഥനായ എന്റെ പിതാവ്
  rationale: മത്തായിയുടെ പതിവുപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ‘സ്വർഗസ്ഥനായ എന്റെ പിതാവ്’ എന്ന് നൽകി. ഗ്രീക്കിൽ οὐρανοῖς ബഹുവചനമാണെങ്കിലും മലയാളത്തിലെ സാധാരണ സമാനപ്രയോഗം ഏകവചനമായ ‘സ്വർഗം’ അടിസ്ഥാനമാക്കുന്നതാണ്.
theological_decisions:
- issue: യേശുവിനെ പരസ്യമായി ഏറ്റുപറയുന്നതും യേശു ആ വ്യക്തിയെ പിതാവിന്റെ മുമ്പിൽ ഏറ്റുപറയുന്നതും തമ്മിലുള്ള പരസ്പരബന്ധം
  choice: വാക്യത്തിലുള്ള വാഗ്ദാനം നേരിട്ട് നിലനിർത്തി; ഏറ്റുപറച്ചിലിന്റെ പരസ്പരത ഒരേ ക്രിയയിലൂടെ പ്രകടമാക്കി.
  alternative: ഇത് അന്തിമന്യായവിധിയിലെ നിയമപരമായ അംഗീകാരം മാത്രമാണെന്നോ ഇപ്പോഴത്തെ ശിഷ്യത്വപ്രഖ്യാപനം മാത്രമാണെന്നോ പ്രത്യേകം വ്യാഖ്യാനിക്കുക.
  rationale: വാക്യം പിതാവിന്റെ മുമ്പിലുള്ള യേശുവിന്റെ ഏറ്റുപറച്ചിൽ വ്യക്തമാക്കുന്നുവെങ്കിലും അതിന്റെ കാലവും വ്യവസ്ഥാപിത രക്ഷാശാസ്ത്രപരമായ വിശദാംശങ്ങളും നിർണ്ണയിക്കുന്നില്ല. അതിനാൽ ആ ദൈവശാസ്ത്രപരമായ തുറന്ന നില വിവർത്തനം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായതും തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഏറ്റുപറയുക’ എന്ന പദം പരസ്യമായ അംഗീകാരവും പ്രഖ്യാപനവും ഉൾക്കൊള്ളുന്നു; അസ്വാഭാവികമായ അക്ഷരാർഥരൂപങ്ങൾ അടിക്കുറിപ്പുകളിലേക്ക് മാറ്റി.
