id: MAT.10.20
reference: Matthew 10:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐ γὰρ ὑμεῖς ἐστε οἱ λαλοῦντες ἀλλὰ τὸ πνεῦμα τοῦ πατρὸς ὑμῶν τὸ λαλοῦν ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/020.yaml
  text: For it is not you who are speaking[b][a], but the Spirit of your Father speaking in you.
translation:
  language: ml
  text: എന്തെന്നാൽ, സംസാരിക്കുന്നവർ നിങ്ങൾ അല്ല; നിങ്ങളിൽ സംസാരിക്കുന്ന നിങ്ങളുടെ പിതാവിന്റെ ആത്മാവാണ്.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങളിലൂടെ.’ ഗ്രീക്കിൽ അക്ഷരാർഥം ‘നിങ്ങളിൽ’ എന്നാണ്; ശിഷ്യന്മാരിലൂടെ പ്രകടമാകുന്ന സംസാരത്തെയും ഇത് സൂചിപ്പിക്കാം.
    reason: alternative_reading
  - marker: b
    text: 'മറ്റൊരു വാക്യക്രമം: ‘എന്തെന്നാൽ, സംസാരിക്കുന്നവർ നിങ്ങൾ അല്ല; നിങ്ങളിൽ സംസാരിക്കുന്നത് നിങ്ങളുടെ പിതാവിന്റെ ആത്മാവാണ്.’'
    reason: previous_rendering
lexical_decisions:
- source_word: οὐ γὰρ
  choice: എന്തെന്നാൽ ... അല്ല
  rationale: γάρ മുൻവാക്യത്തിലെ ഉറപ്പിന് വിശദീകരണം നൽകുന്നു; ‘എന്തെന്നാൽ’ ആ ബന്ധം സ്വാഭാവികമായി നിലനിർത്തുന്നു, നിഷേധം തുടർന്നുള്ള ഘടനയിൽ വ്യക്തമാകുന്നു.
- source_word: ὑμεῖς ἐστε οἱ λαλοῦντες
  choice: സംസാരിക്കുന്നവർ നിങ്ങൾ അല്ല
  rationale: പ്രകടമായ ὑμεῖς എന്ന സർവനാമത്തിന്റെയും ‘സംസാരിക്കുന്നവർ’ എന്ന തിരിച്ചറിയൽഘടനയുടെയും ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായി സൂക്ഷിക്കുന്നു.
- source_word: ἀλλὰ
  choice: ; ... ആണ്
  rationale: നിഷേധത്തിനു പിന്നാലെയുള്ള ശക്തമായ വൈരുധ്യം മലയാളത്തിലെ ‘അല്ല; ... ആണ്’ എന്ന ഘടന വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τὸ πνεῦμα τοῦ πατρὸς ὑμῶν
  choice: നിങ്ങളുടെ പിതാവിന്റെ ആത്മാവ്
  rationale: മൂലത്തിലെ ബന്ധവും പദക്രമവും അനാവശ്യമായി ‘സ്വർഗീയ’ തുടങ്ങിയ വിശേഷണങ്ങൾ ചേർക്കാതെ നിലനിർത്തുന്നു; സന്ദർഭം ദൈവാത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: τὸ λαλοῦν
  choice: സംസാരിക്കുന്ന
  rationale: വർത്തമാന കൃദന്തരൂപത്തിന്റെ തുടരുന്ന പ്രവർത്തിയും ആത്മാവിനെ വിശേഷിപ്പിക്കുന്ന ബന്ധവും മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐν ὑμῖν
  choice: നിങ്ങളിൽ
  rationale: ἐν എന്നതിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തി, ‘നിങ്ങളിലൂടെ’ എന്ന ഉപകരണാർഥത്തിലേക്ക് ഉള്ളടക്കത്തെ ഒതുക്കുന്നില്ല.
theological_decisions:
- issue: ἐν ὑμῖν എന്നത് ഉള്ളിൽ വസിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നതോ ശിഷ്യന്മാരിലൂടെയുള്ള പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നതോ
  choice: നിങ്ങളിൽ
  alternative: നിങ്ങളിലൂടെ
  rationale: ഗ്രീക്കിലെ ἐν എന്നതിന്റെ നേരിട്ടുള്ള അർഥം ‘നിങ്ങളിൽ’ എന്നാണ്. സന്ദർഭത്തിൽ ശിഷ്യന്മാരിലൂടെയുള്ള സംസാരവും ഇതിൽ ഉൾക്കൊള്ളാം; എങ്കിലും പ്രധാന പാഠത്തിൽ ‘നിങ്ങളിലൂടെ’ എന്നു നൽകിയാൽ മൂലത്തിലെ അർഥവ്യാപ്തി അനാവശ്യമായി തീർപ്പാക്കപ്പെടും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. ‘അല്ല; ... ആണ്’ എന്ന സമതുലിത ഘടന ഗ്രീക്കിലെ ഊന്നലും വൈരുധ്യവും നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാന പാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
