id: MAT.10.41
reference: Matthew 10:41
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δεχόμενος προφήτην εἰς ὄνομα προφήτου μισθὸν προφήτου λήμψεται, καὶ ὁ δεχόμενος δίκαιον εἰς ὄνομα δικαίου μισθὸν δικαίου λήμψεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/041.yaml
  text: The one who receives a prophet in the name of a prophet will receive a prophet’s reward[b][a], and the one who receives a righteous man in the name of a righteous man will receive a righteous man’s reward.
translation:
  language: ml
  text: ഒരു പ്രവാചകനെ പ്രവാചകൻ എന്ന നിലയിൽ സ്വീകരിക്കുന്നവന്[a] പ്രവാചകന്റെ പ്രതിഫലം ലഭിക്കും; ഒരു നീതിമാനെ നീതിമാൻ എന്ന നിലയിൽ സ്വീകരിക്കുന്നവന്[b] നീതിമാന്റെ പ്രതിഫലം ലഭിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പ്രവാചകനായതിനാൽ.’ ഗ്രീക്കിൽ അക്ഷരാർഥം ‘പ്രവാചകന്റെ നാമത്തിൽ’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നീതിമാനായതിനാൽ.’ ഗ്രീക്കിൽ അക്ഷരാർഥം ‘നീതിമാന്റെ നാമത്തിൽ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δεχόμενος
  choice: സ്വീകരിക്കുന്നവൻ
  rationale: വർത്തമാനകാല കൃദന്തരൂപം പൊതുവായി അങ്ങനെ ചെയ്യുന്ന ഒരാളെ സൂചിപ്പിക്കുന്നു. ‘സ്വീകരിക്കുന്നവൻ’ ഗ്രീക്ക് ഘടനയും പൊതുവായ പ്രയോഗവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: προφήτην
  choice: ഒരു പ്രവാചകനെ
  rationale: അംഗീകരിക്കപ്പെട്ട ശുശ്രൂഷാഭൂമികയെ അധിക വ്യാഖ്യാനമില്ലാതെ നേരിട്ട് പ്രതിനിധീകരിക്കുന്നു.
- source_word: εἰς ὄνομα προφήτου
  choice: പ്രവാചകൻ എന്ന നിലയിൽ
  rationale: ഈ പ്രയോഗം ആ വ്യക്തിയുടെ തിരിച്ചറിയപ്പെട്ട പദവിയുടെ അടിസ്ഥാനത്തിൽ അയാളെ സ്വീകരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിലെ അക്ഷരാർഥമായ ‘പ്രവാചകന്റെ നാമത്തിൽ’ എന്നത് മലയാളത്തിൽ അയാളുടെ അധികാരത്തിൽ എന്ന തെറ്റായ ധാരണ ഉണ്ടാക്കാമെന്നതിനാൽ സ്വാഭാവികമായ അർഥം മുഖ്യവാചകത്തിൽ നൽകി, അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: μισθὸν προφήτου
  choice: പ്രവാചകന്റെ പ്രതിഫലം
  rationale: ഇത് പ്രവാചകനു ലഭിക്കുന്ന പ്രതിഫലമോ പ്രവാചകനെ സ്വീകരിക്കുന്നവന് യോജിച്ച പ്രതിഫലമോ എന്ന ജനിറ്റീവ് ബന്ധത്തിലെ സാധ്യതയെ നിർണയിക്കാതെ നിലനിർത്തുന്നു.
- source_word: λήμψεται
  choice: ലഭിക്കും
  rationale: ഭാവികാല അർഥം മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ രീതിയിൽ നൽകുന്നു.
- source_word: δίκαιον
  choice: ഒരു നീതിമാനെ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ഏകവചന വിശേഷണം നാമമായി ഉപയോഗിച്ചിരിക്കുന്നു. ‘നീതിമാൻ’ അതിന്റെ ധാർമിക അർഥവും പുല്ലിംഗരൂപവും നിലനിർത്തുന്നു.
- source_word: εἰς ὄνομα δικαίου
  choice: നീതിമാൻ എന്ന നിലയിൽ
  rationale: ആ വ്യക്തിയെ നീതിമാനെന്ന തിരിച്ചറിയലിന്റെ അടിസ്ഥാനത്തിൽ സ്വീകരിക്കുന്നതിനെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും ആദ്യ ഉപവാക്യത്തോടുള്ള സമാന്തരത നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: μισθὸν δικαίου
  choice: നീതിമാന്റെ പ്രതിഫലം
  rationale: ഗ്രീക്കിലെ ജനിറ്റീവ് ബന്ധം അമിതമായി വ്യാഖ്യാനിക്കാതെ ആദ്യ ഉപവാക്യത്തിലെ പ്രയോഗത്തോടുള്ള സമാന്തരത സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: εἰς ὄνομα + ജനിറ്റീവ് എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: മുഖ്യവാചകത്തിൽ ‘... എന്ന നിലയിൽ’ എന്നു നൽകി, അക്ഷരാർഥമായ ‘...ന്റെ നാമത്തിൽ’ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
  alternative: ‘പ്രവാചകനായതിനാൽ / നീതിമാനായതിനാൽ’ അല്ലെങ്കിൽ അക്ഷരാർഥമായി ‘പ്രവാചകന്റെ / നീതിമാന്റെ നാമത്തിൽ’.
  rationale: സന്ദർഭത്തിൽ ഒരാളെ അയാളുടെ തിരിച്ചറിയപ്പെട്ട പദവിയോ സ്വഭാവമോ കണക്കിലെടുത്ത് സ്വീകരിക്കുന്നതാണ് ഉദ്ദേശ്യം. ‘എന്ന നിലയിൽ’ ഈ അർഥം വ്യക്തമാക്കുന്നു; അടിക്കുറിപ്പ് ഗ്രീക്ക് രൂപവും അതിലെ വ്യാഖ്യാനസാധ്യതയും സംരക്ഷിക്കുന്നു.
- issue: δίκαιον / δικαίου എന്നതിലെ പുല്ലിംഗരൂപം
  choice: ‘നീതിമാൻ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘നീതിയുള്ള വ്യക്തി’.
  rationale: ഗ്രീക്ക് രൂപം പുല്ലിംഗ ഏകവചനമാണ്. ‘നീതിമാൻ’ ഉറവിടരൂപത്തോട് അടുത്തതും സാധാരണ മലയാള ബൈബിൾ ഭാഷയിൽ വ്യക്തവുമാണ്; ഇതിനെ പുരുഷന്മാർക്ക് മാത്രം ബാധകമെന്ന വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: μισθὸν προφήτου / μισθὸν δικαίου എന്ന ജനിറ്റീവ് ബന്ധം
  choice: ‘പ്രവാചകന്റെ പ്രതിഫലം / നീതിമാന്റെ പ്രതിഫലം’ എന്ന തുറന്ന ഘടന നിലനിർത്തി.
  alternative: ‘പ്രവാചകനു ലഭിക്കുന്ന അതേ പ്രതിഫലം / നീതിമാനു ലഭിക്കുന്ന അതേ പ്രതിഫലം’.
  rationale: ഗ്രീക്ക് വാചകം പ്രതിഫലത്തിന്റെ ബന്ധം വ്യക്തമാക്കുന്നുവെങ്കിലും അതിനെ നിർബന്ധമായി ‘അതേ പ്രതിഫലം’ എന്ന് വിശദീകരിക്കുന്നില്ല. അതിനാൽ യഥാർഥമായ അർഥവിസ്താരം ചുരുക്കാതെ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. രണ്ട് ഉപവാക്യങ്ങളുടെയും കർശനമായ സമാന്തരഘടന സംരക്ഷിച്ചിരിക്കുന്നു. ‘നാമത്തിൽ’ എന്ന അക്ഷരാനുവാദം മലയാളത്തിൽ അധികാരത്തെ സൂചിപ്പിക്കുന്നതായി തെറ്റിദ്ധരിക്കപ്പെടാൻ സാധ്യതയുള്ളതിനാൽ മുഖ്യവാചകത്തിൽ അർഥസമമായ ‘എന്ന നിലയിൽ’ ഉപയോഗിച്ചു.
