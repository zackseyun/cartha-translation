revisions:
- from: അതുകൊണ്ട് അവരെ ഭയപ്പെടരുത്. വെളിപ്പെടാതിരിക്കത്തക്കവിധം മൂടിവെച്ചിരിക്കുന്നതോ അറിയപ്പെടാതിരിക്കത്തക്കവിധം മറഞ്ഞിരിക്കുന്നതോ ഒന്നുമില്ല.
  to: അതുകൊണ്ട് അവരെ ഭയപ്പെടരുത്. മൂടിവെച്ചിരിക്കുന്നതൊന്നും വെളിപ്പെടാതിരിക്കുകയില്ല; മറഞ്ഞിരിക്കുന്നതൊന്നും അറിയപ്പെടാതിരിക്കുകയില്ല.
