id: MAT.10.26
reference: Matthew 10:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Μὴ οὖν φοβηθῆτε αὐτούς· οὐδὲν γάρ ἐστιν κεκαλυμμένον ὃ οὐκ ἀποκαλυφθήσεται, καὶ κρυπτὸν ὃ οὐ γνωσθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/026.yaml
  text: Therefore, do not fear them, for nothing is covered that will not be revealed, and hidden that will not be made known.
translation:
  language: ml
  text: അതുകൊണ്ട് അവരെ ഭയപ്പെടരുത്. മൂടിവെച്ചിരിക്കുന്നതൊന്നും വെളിപ്പെടാതിരിക്കുകയില്ല; മറഞ്ഞിരിക്കുന്നതൊന്നും അറിയപ്പെടാതിരിക്കുകയില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ οὖν φοβηθῆτε αὐτούς
  choice: അതുകൊണ്ട് അവരെ ഭയപ്പെടരുത്
  rationale: οὖν എന്ന നിഗമനബന്ധം ‘അതുകൊണ്ട്’ എന്നും αὐτούς എന്ന ബഹുവചന സർവനാമം ‘അവരെ’ എന്നും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: κεκαλυμμένον
  choice: മൂടിവെച്ചിരിക്കുന്നതോ
  rationale: καλύπτω എന്ന ക്രിയയുടെ ‘മൂടുക/മറയ്ക്കുക’ എന്ന ദൃശ്യരൂപകം സൂക്ഷിക്കുന്നു; സമാന്തരമായ κρυπτόν-നിന്ന് പദപരമായി വേർതിരിക്കുന്നു.
- source_word: ἀποκαλυφθήσεται
  choice: വെളിപ്പെടാതിരിക്കത്തക്കവിധം
  rationale: ഭാവികാല കർമണിപ്രയോഗമായ ‘വെളിപ്പെടുത്തപ്പെടും’ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിലെ നിഷേധാത്മക ഫലവാക്യഘടനയിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: κρυπτὸν
  choice: മറഞ്ഞിരിക്കുന്നതോ
  rationale: ‘മറഞ്ഞത്/രഹസ്യമായത്’ എന്ന അർത്ഥം നൽകുകയും ആദ്യ സമാന്തരഘടകത്തിലെ ‘മൂടിവെച്ചത്’ എന്നതിൽനിന്നുള്ള സൂക്ഷ്മ വ്യത്യാസം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: γνωσθήσεται
  choice: അറിയപ്പെടാതിരിക്കത്തക്കവിധം
  rationale: γινώσκω-യുടെ ഭാവികാല കർമണിരൂപമായ ‘അറിയപ്പെടും’ എന്ന അർത്ഥം കൃത്യമായി സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: വെളിപ്പെടുത്തലിന്റെ പ്രവർത്തകൻ വ്യക്തമല്ല
  choice: കർമണിഘടന നിലനിർത്തി പ്രവർത്തകനെ ചേർത്തിട്ടില്ല
  alternative: ‘ദൈവം വെളിപ്പെടുത്താത്തത് ഒന്നുമില്ല’
  rationale: ഗ്രീക്കിൽ പ്രവർത്തകൻ പ്രസ്താവിച്ചിട്ടില്ല; ദൈവിക കർമണിപ്രയോഗമാകാമെങ്കിലും അത് വിവർത്തനത്തിൽ വ്യക്തമായി ചേർക്കുന്നത് മൂലപാഠത്തിലെ അർത്ഥവ്യാപ്തി ചുരുക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ രണ്ട് സമാന്തര വിരുദ്ധജോടികൾ—മൂടിയത്/വെളിപ്പെടുക, മറഞ്ഞത്/അറിയപ്പെടുക—സ്വാഭാവികമായ ഒറ്റ മലയാളവാക്യത്തിൽ നിലനിർത്തിയിരിക്കുന്നു.
