review_pass:
  verdict: revise
  source_fidelity: The draft preserves the exhortation and the covered/hidden parallelism, but its two purpose-like expressions (‘വെളിപ്പെടാതിരിക്കത്തക്കവിധം’, ‘അറിയപ്പെടാതിരിക്കത്തക്കവിധം’) do not represent the Greek relative clauses. The Greek states that everything covered will be revealed and everything hidden will be made known; it does not say that things were covered or hidden in order to avoid disclosure.
  naturalness: The proposed revision is clear, idiomatic modern Malayalam, and retains the emphatic double-negative construction naturally.
  terminology: ‘മൂടിവെച്ചിരിക്കുന്ന’ and ‘മറഞ്ഞിരിക്കുന്ന’ appropriately distinguish κεκαλυμμένον and κρυπτόν. ‘വെളിപ്പെടുക’ and ‘അറിയപ്പെടുക’ preserve the passive, with no unstated agent supplied.
  issues:
  - severity: medium
    issue: The relative-clause relationship is rendered as purpose/intent.
    rationale: ‘വെളിപ്പെടാതിരിക്കത്തക്കവിധം’ and ‘അറിയപ്പെടാതിരിക്കത്തക്കവിധം’ mean roughly ‘in such a way as not to be revealed/made known.’ This changes the assertion that no covered or hidden thing will remain undisclosed.
  revised_text: അതുകൊണ്ട് അവരെ ഭയപ്പെടരുത്. മൂടിവെച്ചിരിക്കുന്നതൊന്നും വെളിപ്പെടാതിരിക്കുകയില്ല; മറഞ്ഞിരിക്കുന്നതൊന്നും അറിയപ്പെടാതിരിക്കുകയില്ല.
  revised_footnotes: []
  revision_rationale: 'The revision replaces the purpose-like wording with Malayalam negative-relative clauses that convey the Greek future passive sense: nothing covered will fail to be revealed, and nothing hidden will fail to be made known. It preserves the unnamed agent and the source’s parallel distinctions.'
