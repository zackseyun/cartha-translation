id: MAT.10.29
reference: Matthew 10:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐχὶ δύο στρουθία ἀσσαρίου πωλεῖται; καὶ ἓν ἐξ αὐτῶν οὐ πεσεῖται ἐπὶ τὴν γῆν ἄνευ τοῦ πατρὸς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/029.yaml
  text: Are not two sparrows sold for an assarion? Yet not one of them will fall to the ground apart from your Father[a][b].
translation:
  language: ml
  text: രണ്ട് കുരുവികളെ ഒരു അസ്സാരിയൊന് വിൽക്കുന്നില്ലേ? എന്നിട്ടും നിങ്ങളുടെ പിതാവിനെ കൂടാതെ അവയിൽ ഒന്നുപോലും നിലത്തു വീഴുകയില്ല[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങളുടെ പിതാവില്ലാതെ.’ ഈ പ്രയോഗം അവിടുത്തെ അറിവ്, കരുതൽ, അല്ലെങ്കിൽ ഇഷ്ടം എന്നിവയെ സൂചിപ്പിക്കാം; എന്നാൽ ഇവയിൽ ഏതാണ് ഉദ്ദേശിക്കുന്നതെന്ന് ഗ്രീക്ക് വാചകം വ്യക്തമാക്കുന്നില്ല.
    reason: alternative_reading
  - marker: b
    text: അസ്സാരിയോൻ വളരെ കുറഞ്ഞ മൂല്യമുള്ള ഒരു ചെറിയ റോമൻ ചെമ്പുനാണയമായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: στρουθία
  choice: കുരുവികൾ
  rationale: ഈ സന്ദർഭത്തിൽ ചെറിയ പക്ഷികളെ പൊതുവായി സൂചിപ്പിക്കാമെങ്കിലും, കുരുവികൾ എന്നത് സ്വാഭാവികവും പരമ്പരാഗതമായി അംഗീകരിക്കപ്പെട്ടതുമായ നിർദിഷ്ട അർഥമാണ്.
- source_word: ἀσσαρίου
  choice: ഒരു അസ്സാരിയൊസിന്
  rationale: ചരിത്രപരമായ റോമൻ ചെറുനാണയത്തിന്റെ പേര് നിലനിർത്തുന്നു; അതിന്റെ വളരെ കുറഞ്ഞ മൂല്യം അടിക്കുറിപ്പിൽ വിശദീകരിക്കുന്നു.
- source_word: πωλεῖται
  choice: വിൽക്കുന്നില്ലേ
  rationale: വർത്തമാനകാല കർമണി രൂപത്തിന്റെ വ്യാപാരാർഥം മലയാളത്തിലെ സ്വാഭാവികമായ ചോദ്യരൂപത്തിൽ നൽകുന്നു.
- source_word: ἓν ἐξ αὐτῶν
  choice: അവയിൽ ഒന്നുപോലും
  rationale: ഭാഗസൂചക പ്രയോഗത്തെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുകയും οὐχί...καί എന്ന സന്ദർഭത്തിലെ ഊന്നൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: πεσεῖται ἐπὶ τὴν γῆν
  choice: നിലത്തു വീഴുകയില്ല
  rationale: ഭൂമിയിലേക്കുള്ള വീഴ്ചയെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἄνευ τοῦ πατρὸς ὑμῶν
  choice: നിങ്ങളുടെ പിതാവിനെ കൂടാതെ
  rationale: പിതാവിന്റെ അറിവ്, കരുതൽ, ഇഷ്ടം എന്നിവയിൽ ഏതാണെന്ന് ഗ്രീക്ക് വ്യക്തമാക്കാത്തതിനാൽ മൂലവാക്യത്തിന്റെ യഥാർഥ അവ്യക്തത നിലനിർത്തുന്നു.
- source_word: οὐχὶ ... ;
  choice: '...വിൽക്കുന്നില്ലേ?'
  rationale: അനുകൂലമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന ഗ്രീക്ക് അലങ്കാരചോദ്യത്തിന്റെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ പകർത്തുന്നു.
- source_word: καὶ
  choice: എന്നിട്ടും
  rationale: പക്ഷികളുടെ കുറഞ്ഞ വിലയും പിതാവിന്റെ ശ്രദ്ധയിൽനിന്ന് ഒന്നുപോലും വേർപെടാത്തതും തമ്മിലുള്ള സന്ദർഭോചിതമായ വൈരുധ്യഭാവം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ദൈവപരിപാലനവുമായി ബന്ധപ്പെട്ട് ‘നിങ്ങളുടെ പിതാവിനെ കൂടാതെ’ എന്നതിന്റെ അർഥം
  choice: പിതാവിന്റെ അറിവോ ഇഷ്ടമോ എന്ന് നിർദിഷ്ടമാക്കാതെ ‘നിങ്ങളുടെ പിതാവിനെ കൂടാതെ’ എന്ന് പരിഭാഷപ്പെടുത്തി അവ്യക്തത നിലനിർത്തി.
  alternative: ‘നിങ്ങളുടെ പിതാവിന്റെ അറിവില്ലാതെ’ അല്ലെങ്കിൽ ‘നിങ്ങളുടെ പിതാവിന്റെ ഇഷ്ടമില്ലാതെ’.
  rationale: വാക്യം പിതാവിന്റെ പരിപാലനപരമായ ബന്ധം ഉറപ്പിക്കുന്നുണ്ടെങ്കിലും, ആ ബന്ധം അറിവാണോ അനുമതിയാണോ ഇഷ്ടമാണോ സാന്നിധ്യമാണോ എന്ന് ഗ്രീക്ക് വാചകം നിർവചിക്കുന്നില്ല. അതിനാൽ ഒരു പ്രത്യേക ദൈവശാസ്ത്ര വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അസ്സാരിയൊസ്’ എന്ന ചരിത്രനാണയനാമം നിലനിർത്തി അടിക്കുറിപ്പിലൂടെ വിശദീകരിച്ചു. ‘പിതാവിനെ കൂടാതെ’ എന്ന പ്രയോഗത്തിലെ ദൈവശാസ്ത്രപരമായ അവ്യക്തത മനഃപൂർവം സംരക്ഷിച്ചു.
