  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τούτους τοὺς δώδεκα ἀπέστειλεν ὁ Ἰησοῦς παραγγείλας αὐτοῖς λέγων· Εἰς ὁδὸν ἐθνῶν μὴ ἀπέλθητε καὶ εἰς πόλιν Σαμαριτῶν μὴ εἰσέλθητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/005.yaml
  text: Jesus sent out these twelve, instructing them, saying, “Do not go on the road to the Gentiles, and do not enter a town of the Samaritans.”
translation:
  language: ml
  text: 'യേശു ഈ പന്ത്രണ്ടുപേരെയും അയച്ചു; അവരോട് ഇങ്ങനെ നിർദേശിച്ചു: “ജനതകളുടെ പ്രദേശത്തേക്കുള്ള വഴിയിലേക്ക്[a] പോകരുത്; ശമര്യരുടെ ഒരു പട്ടണത്തിലും[b] പ്രവേശിക്കരുത്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ജനതകളുടെ വഴിയിലേക്ക്.” ഗ്രീക്ക് പ്രയോഗം അക്ഷരാർഥത്തിൽ ‘ജനതകളുടെ വഴിയിലേക്ക്’ എന്നാണ്; ഇവിടെ അത് ജനതകളുടെ പ്രദേശത്തേക്കു പോകുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ഒരു ശമര്യപട്ടണത്തിലും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτους τοὺς δώδεκα
  choice: ഈ പന്ത്രണ്ടുപേരെയും
  rationale: ഗ്രീക്കിലെ നിർദേശകസർവനാമവും സംഖ്യയും ചേർന്ന പ്രയോഗം മുമ്പ് പേരെടുത്ത സംഘത്തെയാണ് സൂചിപ്പിക്കുന്നത്. മൂലത്തിൽ ഇല്ലാത്ത ‘ശിഷ്യന്മാർ’ എന്ന പദം ചേർത്തിട്ടില്ല.
- source_word: ἀπέστειλεν
  choice: അയച്ചു
  rationale: ഒരു ദൗത്യത്തിനായി പറഞ്ഞയയ്ക്കുന്നതാണ് സന്ദർഭം; മലയാളത്തിൽ ‘അയച്ചു’ സ്വാഭാവികവും മതിയായതുമാണ്.
- source_word: παραγγείλας αὐτοῖς λέγων
  choice: അവരോട് ഇങ്ങനെ നിർദേശിച്ചു
  rationale: രണ്ടു കൃതന്തങ്ങളുടെയും ആശയം സ്വാഭാവിക മലയാളവാക്യമായി അവതരിപ്പിക്കുന്നു; παραγγέλλωയിലെ ആജ്ഞാത്മക ശക്തി ‘നിർദേശിച്ചു’ എന്നതിലും തുടർന്നുള്ള നിരോധനവാക്യങ്ങളിലും നിലനിൽക്കുന്നു.
- source_word: Εἰς ὁδὸν ἐθνῶν
  choice: ജനതകളുടെ വഴിയിലേക്ക്
  rationale: ὁδός എന്ന വഴിസംബന്ധിയായ രൂപകം നിലനിർത്തുകയും ἔθνηയെ യഹൂദരല്ലാത്ത ജനവിഭാഗങ്ങൾ എന്ന സന്ദർഭാർഥത്തിൽ അവതരിപ്പിക്കുകയും ചെയ്യുന്നു. പ്രയോഗത്തിന്റെ അസാധാരണത കണക്കിലെടുത്ത് വിശദീകരണപരമായ പാഠക്കുറിപ്പ് നൽകിയിരിക്കുന്നു.
- source_word: μὴ ἀπέλθητε
  choice: പോകരുത്
  rationale: μήയോടുകൂടിയ aorist subjunctive നിരോധനമാണ്; ‘പോകരുത്’ നേരിട്ടും സ്വാഭാവികവുമാണ്.
- source_word: εἰς πόλιν Σαμαριτῶν
  choice: ശമര്യരുടെ ഒരു പട്ടണത്തിലും
  rationale: πόλις ഇവിടെ വലിപ്പം അതിശയിപ്പിക്കാതെ ‘പട്ടണം’ എന്നു പരിഭാഷപ്പെടുത്തി; Σαμαριτῶν എന്ന ജനവിഭാഗസംബന്ധിയായ genitive ‘ശമര്യരുടെ’ എന്നു നിലനിർത്തി. നിരോധനസന്ദർഭത്തിൽ ‘ഒരു...ത്തിലും’ സ്വാഭാവിക മലയാളമാണ്.
- source_word: μὴ εἰσέλθητε
  choice: പ്രവേശിക്കരുത്
  rationale: പ്രവേശനത്തെ വിലക്കുന്ന മൂലപാഠത്തിന്റെ നേരിട്ടുള്ള അർഥവും ഔന്നത്യവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ജനതകളെയും ശമര്യരെയും സംബന്ധിച്ച നിരോധനത്തിന്റെ വ്യാപ്തിയും കാലപരിധിയും
  choice: ഈ അയക്കലിനോടനുബന്ധിച്ച നേരിട്ടുള്ള ദൗത്യനിർദേശം എന്ന നിലയിൽ മാത്രം വാക്യം പരിഭാഷപ്പെടുത്തി; സ്ഥിരമായ ഒഴിവാക്കൽ എന്ന ആശയം ചേർത്തിട്ടില്ല.
  alternative: എല്ലാ കാലത്തേക്കുമുള്ള സമ്പൂർണ നിരോധനമായി തോന്നുന്ന ശക്തമായ വ്യാഖ്യാനപരമായ ഭാഷ
  rationale: വാക്യം ഈ പന്ത്രണ്ടുപേരെ അയയ്ക്കുന്ന പ്രത്യേക സന്ദർഭത്തിലെ നിർദേശം രേഖപ്പെടുത്തുന്നു. നിരോധനത്തിന്റെ ശക്തി സംരക്ഷിക്കുമ്പോഴും മൂലപാഠം പറയാത്ത കാലാതീതമായ ദൈവശാസ്ത്രനിഗമനം പരിഭാഷയിൽ ചേർക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്ക് വാക്യഘടനയെ യാന്ത്രികമായി പകർത്താതെ അർഥവും നിരോധനത്തിന്റെ ശക്തിയും സംരക്ഷിച്ചു. എല്ലാ പാഠക്കുറിപ്പ് സൂചകങ്ങളും പ്രധാനപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
