  naturalness: വാചകം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്. ‘ശരീരത്തെ കൊല്ലുന്നവരെ ഭയപ്പെടരുത്; എന്നാൽ ആത്മാവിനെ കൊല്ലാൻ അവർക്കു കഴിയില്ല’ എന്ന ഘടന വ്യക്തമായ വിരുദ്ധസമാന്തരത നൽകുന്നു. ‘മറിച്ച്’ ഇവിടെ μᾶλλον-ന്റെ തിരുത്തൽ/വിപരീത ഊന്നൽ യോജിച്ചവിധം നൽകുന്നു.
