id: MAT.10.28
reference: Matthew 10:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ μὴ ⸀φοβεῖσθε ἀπὸ τῶν ἀποκτεννόντων τὸ σῶμα τὴν δὲ ψυχὴν μὴ δυναμένων ἀποκτεῖναι· ⸁φοβεῖσθε δὲ μᾶλλον τὸν δυνάμενον ⸀καὶ ψυχὴν ⸁καὶ σῶμα ἀπολέσαι ἐν γεέννῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/028.yaml
  text: And do not fear those who kill the body but are not able to kill the soul. Rather[a], fear the one who is able to destroy both soul and body in Gehenna.
translation:
  language: ml
  text: ശരീരത്തെ കൊല്ലുന്നവരെ ഭയപ്പെടരുത്; എന്നാൽ ആത്മാവിനെ കൊല്ലാൻ അവർക്കു കഴിയില്ല. മറിച്ച്, ആത്മാവിനെയും ശരീരത്തെയും ഗെഹെന്നയിൽ[a] നശിപ്പിക്കാൻ കഴിയുന്നവനെ ഭയപ്പെടുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നരകത്തിൽ.” ഗ്രീക്കിൽ “ഗെഹെന്നയിൽ”; ഹിന്നോം താഴ്വരയുടെ പേരിൽനിന്നു വന്നതും അന്തിമ ന്യായവിധിയുടെ സ്ഥലത്തെ സൂചിപ്പിക്കാൻ ഉപയോഗിച്ചതുമായ പദം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβεῖσθε
  choice: ഭയപ്പെടരുത് / ഭയപ്പെടുക
  rationale: ആജ്ഞയുടെ രണ്ടു ഭാഗങ്ങളിലും ആവർത്തിക്കുന്ന ഒരേ ക്രിയയും അവയുടെ വിരുദ്ധസമാന്തരതയും നിലനിർത്തുന്നു.
- source_word: ἀπὸ τῶν ἀποκτεννόντων
  choice: കൊല്ലുന്നവരെ
  rationale: നാമവാചകമായി പ്രവർത്തിക്കുന്ന വർത്തമാനകൃത്‌പ്രത്യയത്തെ ഒരു പൊതുവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളമായി നൽകുന്നു.
- source_word: σῶμα
  choice: ശരീരം
  rationale: ഭൗതിക ശരീരത്തെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള സാധാരണ പദം.
- source_word: ψυχήν
  choice: ആത്മാവ്
  rationale: ശരീരത്തോടുള്ള വ്യക്തമായ വൈരുധ്യം നിലനിർത്തുകയും ψυχήയെ ഇവിടെ വെറും ഭൗമിക ‘ജീവൻ’ എന്നതിലേക്കു ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: μὴ δυναμένων ἀποκτεῖναι
  choice: കൊല്ലാൻ അവർക്കു കഴിയില്ല
  rationale: അവരുടെ കഴിവില്ലായ്മയ്ക്ക് ഊന്നൽ നൽകിക്കൊണ്ട് ഗ്രീക്ക് പ്രയോഗം വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: μᾶλλον
  choice: മറിച്ച്
  rationale: ആരെയല്ല ഭയപ്പെടേണ്ടത്, ആരെയാണ് ഭയപ്പെടേണ്ടത് എന്ന തിരുത്തൽസ്വഭാവമുള്ള ശക്തമായ വൈരുധ്യം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: τὸν δυνάμενον
  choice: കഴിയുന്നവനെ
  rationale: ഗ്രീക്ക് വാക്യം ആ വ്യക്തിയെ പേരെടുത്ത് തിരിച്ചറിയാത്തതിനാൽ അതേ തുറന്ന നില പാലിക്കുന്നു.
- source_word: ἀπολέσαι
  choice: നശിപ്പിക്കാൻ
  rationale: നിർണായകമായ നാശത്തിന്റെയും ന്യായവിധിയുടെയും ഗൗരവം നിലനിർത്തുന്നു; അതിന്റെ തത്ത്വശാസ്ത്രപരമായ രീതി അധികമായി നിർവചിക്കുന്നില്ല.
- source_word: ἐν γεέννῃ
  choice: ഗെഹെന്നയിൽ
  rationale: യഹൂദ പശ്ചാത്തലമുള്ള പ്രത്യേക ഗ്രീക്ക് പദത്തെ ലിപ്യന്തരണം ചെയ്ത് മൂലഭാഷയുടെ ആശയം നിലനിർത്തുന്നു; പരിചിതമായ വ്യാഖ്യാനപരമായ പകരം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: ഗെഹെന്നയിൽ ആത്മാവിനെയും ശരീരത്തെയും നശിപ്പിക്കാൻ കഴിയുന്നവന്റെ തിരിച്ചറിയൽ
  choice: പ്രധാന പാഠത്തിൽ ‘കഴിയുന്നവനെ’ എന്നു മാത്രം നൽകി വ്യക്തിയെ പേരെടുത്ത് തിരിച്ചറിയുന്നില്ല.
  alternative: ദൈവം; സാത്താൻ
  rationale: അന്തിമ ന്യായവിധിയുടെ അധികാരമുള്ള ദൈവത്തെയാണ് സന്ദർഭം ഏറ്റവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്; എങ്കിലും ഗ്രീക്ക് പാഠം ഇവിടെ ആ വ്യക്തിയെ നേരിട്ട് പേരെടുത്ത് പറയുന്നില്ല. അതിനാൽ പാഠത്തിലെ തുറന്ന നില സംരക്ഷിക്കുന്നു.
- issue: γέεννα എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ഗെഹെന്ന
  alternative: നരകം
  rationale: മൂലഭാഷയ്ക്കു മുൻഗണന നൽകി പദത്തിന്റെ യഹൂദ-ചരിത്ര പശ്ചാത്തലം സംരക്ഷിക്കുന്നു; വായനക്കാർക്കു പരിചിതമായ ‘നരകം’ എന്ന പകരം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആജ്ഞാരൂപം ഉപയോഗിച്ചു. ‘ശരീരം—ആത്മാവ്’, ‘ഭയപ്പെടരുത്—ഭയപ്പെടുക’ എന്നീ മൂലപാഠത്തിലെ സമാന്തര വൈരുധ്യങ്ങൾ നിലനിർത്തി. ‘ഗെഹെന്ന’ പ്രധാന പാഠത്തിൽ സൂക്ഷിച്ച് അതിന്റെ പരിചിതമായ അർഥസഹായി അടിക്കുറിപ്പിൽ നൽകി.
