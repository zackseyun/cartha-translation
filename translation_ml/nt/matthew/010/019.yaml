id: MAT.10.19
reference: Matthew 10:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅταν δὲ ⸀παραδῶσιν ὑμᾶς, μὴ μεριμνήσητε πῶς ἢ τί λαλήσητε· δοθήσεται γὰρ ὑμῖν ἐν ἐκείνῃ τῇ ὥρᾳ τί ⸀λαλήσητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/019.yaml
  text: But when they hand you over[a], do not worry about how or what you should speak[b], for what you should speak will be given to you in that hour.
translation:
  language: ml
  text: എന്നാൽ അവർ നിങ്ങളെ ഏൽപ്പിച്ചുകൊടുക്കുമ്പോൾ, എങ്ങനെ സംസാരിക്കണമെന്നോ എന്തു സംസാരിക്കണമെന്നോ ഉത്കണ്ഠപ്പെടേണ്ടാ; കാരണം, എന്തു സംസാരിക്കണമെന്ന് ആ സമയത്ത് നിങ്ങൾക്കു നൽകപ്പെടും[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നൽകപ്പെടും’ എന്ന കർമണിപ്രയോഗം നൽകുന്നവൻ ആരെന്നു ഇവിടെ വ്യക്തമാക്കുന്നില്ല; അടുത്ത വാക്യത്തിൽ അവരിലൂടെ സംസാരിക്കുന്നത് നിങ്ങളുടെ പിതാവിന്റെ ആത്മാവാണെന്നു പറയുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: ὅταν δὲ
  choice: എന്നാൽ ... ചെയ്യുമ്പോൾ
  rationale: ὅταν ഭാവിയിലെ അനിശ്ചിത സംഭവത്തെ ‘ചെയ്യുമ്പോൾ’ എന്നു സൂചിപ്പിക്കുന്നു; δέ മുൻ മുന്നറിയിപ്പിൽനിന്നുള്ള മൃദുവായ മാറ്റമായി ‘എന്നാൽ’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: παραδῶσιν
  choice: ഏല്പിച്ചുകൊടുക്കുമ്പോൾ
  rationale: παραδίδωμι ഇവിടെ അധികാരികളുടെ കയ്യിൽ ഏല്പിക്കുന്ന വൈരപരവും നിയമപരവുമായ ആശയം നൽകുന്നു; ‘ഒറ്റിക്കൊടുക്കുക’ എന്നു വിവർത്തനം ചെയ്താൽ ദ്രോഹത്തിന്റെ അർഥം അനാവശ്യമായി മുൻനിർത്താം.
- source_word: μὴ μεριμνήσητε
  choice: ഉത്കണ്ഠപ്പെടേണ്ടാ
  rationale: വരാനിരിക്കുന്ന സാക്ഷ്യത്തെക്കുറിച്ചുള്ള ആശങ്ക നിരോധിക്കുന്ന പ്രയോഗമാണിത്; ആധുനിക മലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമാണ്.
- source_word: πῶς ἢ τί
  choice: എങ്ങനെ അല്ലെങ്കിൽ എന്ത്
  rationale: ἤ എന്ന ‘അല്ലെങ്കിൽ’ നിലനിർത്തി സംസാരിക്കുന്ന രീതിയും ഉള്ളടക്കവും വേർതിരിക്കുന്നു.
- source_word: λαλήσητε
  choice: സംസാരിക്കണമെന്ന്
  rationale: λαλέωയുടെ ആവർത്തനം മലയാളത്തിലും ഒരേ ക്രിയയിലൂടെ നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ ഉദ്ദേശിതമായ ഭാവിസംസാരം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: δοθήσεται
  choice: നിങ്ങൾക്കു നൽകപ്പെടും
  rationale: ഭാവികാല കർമണിപ്രയോഗം നിലനിർത്തി നൽകുന്നവൻ ആരെന്നത് ഈ വാക്യത്തിൽ വ്യക്തമാക്കാതെ വിടുന്നു.
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: ആ സമയത്തുതന്നെ
  rationale: ആവശ്യമായ സമയത്തെ ഉടൻ ലഭിക്കുന്ന സഹായം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘ആ മണിക്കൂറിൽ’ എന്ന പദാനുപദ രൂപത്തിന്റെ അസ്വാഭാവികത ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: δοθήσεται എന്ന ദൈവിക കർമണിപ്രയോഗത്തിൽ പ്രവർത്തകൻ പരോക്ഷമാണ്
  choice: ‘നിങ്ങൾക്കു നൽകപ്പെടും’ എന്ന കർമണിപ്രയോഗം നിലനിർത്തുക
  alternative: ‘ദൈവം നിങ്ങൾക്കു നൽകും’ അല്ലെങ്കിൽ ‘ആത്മാവ് നിങ്ങൾക്കു നൽകും’
  rationale: ഈ വാക്യത്തിൽ ഗ്രീക്ക് നൽകുന്നവനെ പേരെടുത്ത് പറയുന്നില്ല; അടുത്ത വാക്യം ആത്മാവിന്റെ പ്രവർത്തനം വ്യക്തമാക്കുന്നതിനാൽ ഇവിടെ ആ വിശദീകരണം മുൻകൂട്ടി ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. മൂലത്തിലെ ആവർത്തനവും കർമണിപ്രയോഗവും കഴിയുന്നത്ര സംരക്ഷിച്ചിരിക്കുന്നു.
