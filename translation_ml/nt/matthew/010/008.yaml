id: MAT.10.8
reference: Matthew 10:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀσθενοῦντας θεραπεύετε, ⸂νεκροὺς ἐγείρετε⸃, λεπροὺς καθαρίζετε, δαιμόνια ἐκβάλλετε· δωρεὰν ἐλάβετε, δωρεὰν δότε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/008.yaml
  text: Heal the sick[a], raise the dead, cleanse lepers, cast out demons. Freely you received; freely give.
translation:
  language: ml
  text: രോഗികളെ സൗഖ്യമാക്കുക; മരിച്ചവരെ ഉയിർപ്പിക്കുക; കുഷ്ഠരോഗികളെ ശുദ്ധരാക്കുക[a]; ഭൂതങ്ങളെ പുറത്താക്കുക. സൗജന്യമായി നിങ്ങൾക്കു ലഭിച്ചു; സൗജന്യമായി കൊടുക്കുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പരമ്പരാഗതമായി ‘കുഷ്ഠരോഗികൾ’ എന്നു വിവർത്തനം ചെയ്യുന്ന പദം, ആധുനിക കുഷ്ഠരോഗം (ഹാൻസൻസ് രോഗം) മാത്രമല്ല, ബൈബിൾകാലത്ത് ഗുരുതരമായ മറ്റു ത്വഗ്രോഗങ്ങളുള്ളവരെയും സൂചിപ്പിച്ചിരിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσθενοῦντας
  choice: രോഗികളെ
  rationale: രോഗബാധിതരായവരെയാണ് സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
- source_word: θεραπεύετε
  choice: സൗഖ്യമാക്കുക
  rationale: അത്ഭുതകരമായ രോഗശാന്തിയുടെ സന്ദർഭത്തിൽ ‘സൗഖ്യമാക്കുക’ സ്വാഭാവികവും അർഥവ്യക്തവുമാണ്.
- source_word: νεκροὺς ἐγείρετε
  choice: മരിച്ചവരെ ഉയിർപ്പിക്കുക
  rationale: മരണത്തിൽനിന്ന് ജീവിപ്പിക്കുക എന്ന അർഥം വ്യക്തമാക്കുന്നു; വെറും ഉണർത്തൽ എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: λεπροὺς
  choice: കുഷ്ഠരോഗികളെ
  rationale: പരമ്പരാഗത ബൈബിൾ പ്രയോഗം നിലനിർത്തുന്നു; പുരാതന പദത്തിന്റെ വിശാലമായ ത്വഗ്രോഗപരിധി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: καθαρίζετε
  choice: ശുദ്ധരാക്കുക
  rationale: ശാരീരിക സൗഖ്യത്തോടൊപ്പം ആചാരപരമായ ശുദ്ധീകരണസൂചനയും സംരക്ഷിക്കുന്നു.
- source_word: δαιμόνια ἐκβάλλετε
  choice: ഭൂതങ്ങളെ പുറത്താക്കുക
  rationale: ദുഷ്ടാത്മശക്തികളെ ബലമായി നീക്കുക എന്ന നേരിട്ടുള്ള അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: δωρεὰν
  choice: സൗജന്യമായി
  rationale: പ്രതിഫലമോ വിലയോ കൂടാതെ എന്ന അർഥം നൽകുകയും ഇരു ഉപവാക്യങ്ങളിലുമുള്ള സമാന്തരത നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐλάβετε
  choice: നിങ്ങൾക്കു ലഭിച്ചു
  rationale: ശിഷ്യന്മാർ സ്വീകരിച്ച ദാനത്തെയും അധികാരത്തെയും കർത്തരിപ്രയോഗത്തേക്കാൾ സ്വാഭാവികമായ മലയാളഘടനയിൽ സൂചിപ്പിക്കുന്നു.
- source_word: δότε
  choice: കൊടുക്കുക
  rationale: നേരിട്ടുള്ള ബഹുവചന ആജ്ഞയുടെ ശക്തി നിലനിർത്തുന്നു; നൽകേണ്ട വിധം മുൻപുള്ള ‘സൗജന്യമായി’ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: അത്ഭുതപ്രവൃത്തികളെക്കുറിച്ചുള്ള ആജ്ഞകളുടെ പരിധി
  choice: ഈ ദൗത്യപ്രഭാഷണത്തിൽ പന്ത്രണ്ടുപേർക്കു നൽകിയ നേരിട്ടുള്ള ആജ്ഞകളായി വിവർത്തനം ചെയ്യുക.
  alternative: പ്രവൃത്തികളെ രൂപകങ്ങളായോ പിന്നീടുള്ള സഭാചാരങ്ങളായോ മാത്രം അവതരിപ്പിക്കുക.
  rationale: ഗ്രീക്ക് പാഠത്തിൽ വ്യക്തമായ ബഹുവചന ആജ്ഞാരൂപങ്ങളാണ് ഉള്ളത്. അവയുടെ ചരിത്രപരവും ദൈവശാസ്ത്രപരവുമായ ശക്തി മയപ്പെടുത്താതെയും ഇന്നത്തേക്കുള്ള പ്രയോഗപരിധി വിവർത്തനത്തിലൂടെ നിർണയിക്കാതെയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ആദരപൂർണ മലയാളം. തുടർച്ചയായ ആജ്ഞകൾക്കും അവസാനത്തെ സമാന്തരവാക്യത്തിനും മൂലപാഠത്തിന്റെ ഊന്നൽ നിലനിർത്തിയിരിക്കുന്നു.
