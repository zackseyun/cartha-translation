id: MAT.10.18
reference: Matthew 10:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐπὶ ἡγεμόνας δὲ καὶ βασιλεῖς ἀχθήσεσθε ἕνεκεν ἐμοῦ εἰς μαρτύριον αὐτοῖς καὶ τοῖς ἔθνεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/018.yaml
  text: And you will be brought before governors and kings because of me[b][a], as a testimony to them and to the Gentiles.
translation:
  language: ml
  text: എന്റെ നിമിത്തം നിങ്ങളെ ഭരണാധികാരികളുടെയും രാജാക്കന്മാരുടെയും മുമ്പാകെ കൊണ്ടുപോകും; അവർക്കും[b] ജനതകൾക്കും[a] സാക്ഷ്യമായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യെഹൂദേതരർക്കും.”
    reason: lexical_alternative
  - marker: b
    text: “അവർക്കും” എന്നത് ഈ സന്ദർഭത്തിൽ “അവർക്കെതിരെയും” എന്നും മനസ്സിലാക്കാം; എന്നാൽ ഗ്രീക്ക് വിഭക്തിരൂപം തന്നെ ആ അർഥം വ്യക്തമാക്കുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπὶ ἡγεμόνας ... καὶ βασιλεῖς
  choice: നാടുവാഴികളുടെയും രാജാക്കന്മാരുടെയും മുമ്പിൽ
  rationale: ἐπί + accusative, ἀχθήσεσθε എന്ന ക്രിയയോടൊപ്പം, അധികാരികളുടെ മുമ്പാകെയുള്ള ഹാജരാക്കലിനെ സൂചിപ്പിക്കുന്നു. ἡγεμών എന്നതിന് ചരിത്രപരമായ ഭരണാധികാരിയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്ന ‘നാടുവാഴി’ തെരഞ്ഞെടുത്തു.
- source_word: ἀχθήσεσθε
  choice: നിങ്ങളെ ... കൊണ്ടുപോകും
  rationale: ἄγωയുടെ ഭാവികാല കർമണിപ്രയോഗമാണിത്. നീതിന്യായസന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളം നൽകുകയും മൂലത്തിൽ വ്യക്തമല്ലാത്ത ബലപ്രയോഗത്തിന്റെ അർഥം കൂട്ടിച്ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἕνεκεν ἐμοῦ
  choice: എന്നെ നിമിത്തം
  rationale: കാരണത്തെ സൂചിപ്പിക്കുന്ന ἕνεκεν + genitive എന്ന ഘടനയും യേശുവിലേക്കുള്ള വ്യക്തിപരമായ സൂചനയും നിലനിർത്തുന്നു.
- source_word: εἰς μαρτύριον
  choice: സാക്ഷ്യമായിരിക്കേണ്ടതിനായി
  rationale: εἰς ഇവിടെ ഉദ്ദേശ്യം അല്ലെങ്കിൽ ഫലം സൂചിപ്പിക്കുന്നു; μαρτύριον എന്ന നാമരൂപം ‘സാക്ഷ്യം’ ആയി നിലനിർത്തുന്നു.
- source_word: αὐτοῖς
  choice: അവർക്കും
  rationale: സർവനാമം ഏറ്റവും സ്വാഭാവികമായി നാടുവാഴികളെയും രാജാക്കന്മാരെയും പരാമർശിക്കുന്നു. ഗ്രീക്ക് dative സ്വതവേ പ്രതികൂലത വ്യക്തമാക്കാത്തതിനാൽ നിഷ്പക്ഷമായ രൂപം ഉപയോഗിച്ചു.
- source_word: τοῖς ἔθνεσιν
  choice: ജനതകൾക്കും
  rationale: ἔθνη എന്നതിന് ‘ജനതകൾ’ എന്ന അടിസ്ഥാനാർഥം നേരിട്ട് നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അത് യെഹൂദേതരരെ സൂചിപ്പിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: μαρτύριον αὐτοῖς എന്നതിന്റെ ദിശ
  choice: അവർക്കു സാക്ഷ്യം എന്ന നിഷ്പക്ഷ വായന
  alternative: അവർക്കെതിരായ സാക്ഷ്യം
  rationale: αὐτοῖς എന്ന dative സാക്ഷ്യം അനുകൂലമാണോ പ്രതികൂലമാണോ എന്ന് സ്വതവേ നിർണയിക്കുന്നില്ല. അതിനാൽ സാക്ഷ്യം ക്ഷണമാകാമോ നിരസിക്കുന്നവർക്കെതിരായ തെളിവാകാമോ എന്ന ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഭാഷയിൽ തുറന്നുവെച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നാടുവാഴികൾ’ ചരിത്രപരമായ ഭരണാധികാരികളെ സൂചിപ്പിക്കുന്നു. മൂലത്തിലെ ഉദ്ദേശ്യ/ഫലഭാവവും αὐτοῖς എന്നതിലെ നിഷ്പക്ഷതയും സംരക്ഷിച്ചു; എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
