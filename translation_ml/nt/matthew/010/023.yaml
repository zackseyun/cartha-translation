id: MAT.10.23
reference: Matthew 10:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅταν δὲ διώκωσιν ὑμᾶς ἐν τῇ πόλει ταύτῃ, φεύγετε εἰς τὴν ⸀ἑτέραν· ἀμὴν γὰρ λέγω ὑμῖν, οὐ μὴ τελέσητε τὰς πόλεις ⸀τοῦ Ἰσραὴλ ἕως ⸀ἂν ἔλθῃ ὁ υἱὸς τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/023.yaml
  text: But whenever they persecute you in this city[a], flee to the next one. For truly I say to you[c][b], you will certainly not finish going through the cities of Israel until the Son of Man comes.
translation:
  language: ml
  text: 'എന്നാൽ ഈ പട്ടണത്തിൽ അവർ നിങ്ങളെ പീഡിപ്പിക്കുമ്പോഴൊക്കെയും, മറ്റൊരു പട്ടണത്തിലേക്ക് ഓടിപ്പോകുക.[a] സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: മനുഷ്യപുത്രൻ വരുന്നതുവരെ[c] നിങ്ങൾ യിസ്രായേലിലെ പട്ടണങ്ങളിലൂടെയുള്ള സഞ്ചാരം തീർച്ചയായും പൂർത്തിയാക്കുകയില്ല.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അടുത്ത പട്ടണത്തിലേക്ക്.’ ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘മറ്റേതിലേക്കു/മറ്റൊന്നിലേക്കു’ എന്നാണ്; മുൻവാക്യത്തിൽനിന്ന് ‘പട്ടണം’ എന്നു മനസ്സിലാക്കണം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘യിസ്രായേലിലെ പട്ടണങ്ങളെ നിങ്ങൾ തീർച്ചയായും തീർത്തുകഴിയുകയില്ല.’ സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്ന പ്രേഷിതസഞ്ചാരം വ്യക്തമാക്കാനാണ് ‘പട്ടണങ്ങളിലൂടെയുള്ള സഞ്ചാരം’ എന്നു മുഖ്യവാചകത്തിൽ നൽകിയിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: ‘മനുഷ്യപുത്രൻ വരുന്നതുവരെ’ എന്നത് മനഃപൂർവം തുറന്ന നിലയിൽ വെച്ചിരിക്കുന്നു. ഇത് യേശുവിന്റെ നീതീകരണത്തെയോ, ന്യായവിധിക്കായുള്ള വരവിനെയോ, അന്തിമ പുനരാഗമനത്തെയോ സൂചിപ്പിക്കുന്നുവോ എന്നതിൽ വ്യാഖ്യാതാക്കൾക്കിടയിൽ അഭിപ്രായവ്യത്യാസമുണ്ട്.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν
  choice: പീഡിപ്പിക്കുമ്പോഴൊക്കെയും
  rationale: അനിശ്ചിതമോ ആവർത്തിക്കാവുന്നതോ ആയ സമയസാഹചര്യം സൂചിപ്പിക്കുന്നതിനാൽ ‘എപ്പോൾ’ എന്നതിലുപരി ‘-പ്പോഴൊക്കെയും’ എന്ന പ്രയോഗം ഗ്രീക്കിന്റെ തുറന്ന സ്വഭാവം നിലനിർത്തുന്നു.
- source_word: διώκωσιν
  choice: അവർ നിങ്ങളെ പീഡിപ്പിക്കുക
  rationale: ശിഷ്യപ്രേഷണത്തിന്റെ ഈ സന്ദർഭത്തിൽ ശത്രുതാപരമായ ഉപദ്രവമാണ് ഉദ്ദേശ്യം; വെറും പിന്തുടരൽ മാത്രമല്ല.
- source_word: πόλει ταύτῃ
  choice: ഈ പട്ടണത്തിൽ
  rationale: സമീപസൂചകമായ ταύτῃയുടെ നേരിട്ടുള്ള ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: φεύγετε
  choice: ഓടിപ്പോകുക
  rationale: പീഡനസമയത്തെ അടിയന്തരമായ സ്ഥലംവിടൽ വ്യക്തമാക്കുന്ന സ്വാഭാവികവും ശക്തവുമായ ആജ്ഞാരൂപം.
- source_word: εἰς τὴν ἑτέραν
  choice: മറ്റൊരു പട്ടണത്തിലേക്ക്
  rationale: മുൻവാക്യത്തിൽനിന്ന് ‘പട്ടണം’ എന്ന നാമം ഗ്രീക്കിൽ അധ്യാഹരിക്കപ്പെടുന്നു. ἑτέραν എന്നത് മറ്റൊന്നിലേക്കുള്ള നീക്കം സൂചിപ്പിക്കുന്നു; നിർബന്ധമായ ക്രമപരമായ ‘അടുത്ത പട്ടണം’ എന്ന അർഥം അടിച്ചേൽപ്പിക്കുന്നില്ല.
- source_word: ἀμὴν
  choice: സത്യമായി
  rationale: യേശുവിന്റെ ഗൗരവമേറിയ അധികാരപ്രഖ്യാപനം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: οὐ μὴ τελέσητε
  choice: തീർച്ചയായും പൂർത്തിയാക്കുകയില്ല
  rationale: οὐ μήയുടെ ശക്തമായ നിഷേധം ‘തീർച്ചയായും ... ഇല്ല’ എന്നു നിലനിർത്തുന്നു; τελέωയുടെ പൂർത്തീകരണാർഥവും സംരക്ഷിക്കുന്നു.
- source_word: τὰς πόλεις τοῦ Ἰσραήλ
  choice: യിസ്രായേലിലെ പട്ടണങ്ങൾ
  rationale: യിസ്രായേലിനുള്ളിലുള്ള പട്ടണങ്ങളെ സൂചിപ്പിക്കുന്ന ജനിറ്റീവ് ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἕως ἂν ἔλθῃ
  choice: വരുന്നതുവരെ
  rationale: ഭാവിയിലെ ഒരു പരിധിബിന്ദുവോളം പ്രവൃത്തി പൂർത്തിയാകില്ലെന്ന കാലബന്ധം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: വാക്കിന്റെ അക്ഷരാർഥവും ദാനിയേൽഗ്രന്ഥസംബന്ധമായ ദൈവശാസ്ത്ര പ്രതിധ്വനിയും സംരക്ഷിക്കുന്ന സ്ഥാപിത ബൈബിൾ പദം.
theological_decisions:
- issue: ‘മനുഷ്യപുത്രൻ വരുന്നു’ എന്നതിന്റെ സന്ദർഭാർഥം
  choice: ‘മനുഷ്യപുത്രൻ വരുന്നതുവരെ’ എന്ന തുറന്ന പ്രയോഗം നിലനിർത്തി.
  alternative: യരൂശലേമിന്മേലുള്ള ന്യായവിധിയിൽ വരുന്നത്; ഉയിർപ്പിലോ നീതീകരണത്തിലോ വരുന്നത്; അന്തിമ പുനരാഗമനം.
  rationale: ഗ്രീക്ക് വാചകം ഇവിടെ ഏത് സംഭവമാണ് ഉദ്ദേശിക്കുന്നതെന്ന് തീർപ്പാക്കുന്നില്ല. അതിനാൽ ഒരു പ്രത്യേക അന്ത്യകാല വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ ചേർക്കാതെ യഥാർഥ ദൈവശാസ്ത്ര സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പീഡിപ്പിക്കുക,’ ‘ഓടിപ്പോകുക,’ ‘സത്യമായി’ എന്നിവ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്. ‘യിസ്രായേൽ,’ ‘മനുഷ്യപുത്രൻ’ എന്നീ പരിചിത ബൈബിൾ രൂപങ്ങൾ ദൈവശാസ്ത്രപരവും അന്തർഗ്രന്ഥപരവുമായ ബന്ധം നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
