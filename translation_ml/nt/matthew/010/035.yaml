id: MAT.10.35
reference: Matthew 10:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἦλθον γὰρ διχάσαι ἄνθρωπον κατὰ τοῦ πατρὸς αὐτοῦ καὶ θυγατέρα κατὰ τῆς μητρὸς αὐτῆς καὶ νύμφην κατὰ τῆς πενθερᾶς αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/035.yaml
  text: For I came to set a man against his father[a], and a daughter against her mother, and a daughter-in-law against her mother-in-law[b],
translation:
  language: ml
  text: എന്തെന്നാൽ, ഒരു മനുഷ്യനെ അവന്റെ അപ്പനെതിരായി, ഒരു മകളെ അവളുടെ അമ്മയ്‌ക്കെതിരായി, ഒരു മരുമകളെ[b] അവളുടെ അമ്മായിയമ്മയ്‌ക്കെതിരായി നിർത്താനാണ്[a] ഞാൻ വന്നത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഭിന്നിപ്പിക്കാൻ.’ ഗ്രീക്ക് ക്രിയയെ കൂടുതൽ പദാനുപദമായി അങ്ങനെ പരിഭാഷപ്പെടുത്താം. എന്നാൽ തുടർന്ന് ആവർത്തിക്കുന്ന ‘എതിരായി’ എന്ന ഘടന ബന്ധങ്ങളിലെ എതിർപ്പ് വ്യക്തമാക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്ക് νύμφη എന്ന പദത്തിന് ചില സന്ദർഭങ്ങളിൽ ‘വധു’ എന്നും അർത്ഥമാകാം; ഇവിടെ ‘അമ്മായിയമ്മ’ എന്ന പദത്തോടു ചേർന്നുവരുന്നതിനാൽ ‘മരുമകൾ’ എന്നാണ് അർത്ഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον
  choice: ഞാൻ വന്നത്
  rationale: ആയോറിസ്റ്റ് ക്രിയ ഇവിടെ യേശുവിന്റെ വരവും ദൗത്യവും സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ഭൂതകാലരൂപം ഇത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തെ വിശദീകരിക്കുന്ന കാരണബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: διχάσαι
  choice: എതിരായി നിർത്താൻ
  rationale: അടിസ്ഥാന അർത്ഥം ‘ഭിന്നിപ്പിക്കുക’ എന്നാണെങ്കിലും, ആവർത്തിക്കുന്ന κατά + ഷഷ്ഠീവിഭക്തി ബന്ധപരമായ എതിർപ്പ് വ്യക്തമാക്കുന്നതിനാൽ ഈ പ്രയോഗം സന്ദർഭത്തിലെ ശക്തി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἄνθρωπον
  choice: ഒരു മനുഷ്യനെ
  rationale: ഇവിടെ പിതാവിനോടുള്ള ബന്ധത്തിലുള്ള പുരുഷവ്യക്തിയെയാണ് കുടുംബബന്ധങ്ങളുടെ സമാന്തര പട്ടികയിൽ സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘മനുഷ്യൻ’ ഈ രൂപത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: κατὰ τοῦ πατρὸς αὐτοῦ
  choice: അവന്റെ അപ്പന് എതിരായി
  rationale: κατά + ഷഷ്ഠീവിഭക്തിയുടെ എതിർപ്പിന്റെ അർത്ഥം നേരിട്ട് നൽകുന്നു; ‘അപ്പൻ’ സാധാരണ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: θυγατέρα
  choice: മകളെ
  rationale: നാമത്തിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ മലയാള പരിഭാഷ.
- source_word: κατὰ τῆς μητρὸς αὐτῆς
  choice: അവളുടെ അമ്മയ്ക്ക് എതിരായി
  rationale: ആവർത്തിക്കുന്ന എതിർപ്പിന്റെ ഘടന നിലനിർത്തുന്നു.
- source_word: νύμφην
  choice: മരുമകളെ
  rationale: νύμφηയ്ക്ക് ചില സന്ദർഭങ്ങളിൽ ‘വധു’ എന്നർത്ഥമുണ്ടെങ്കിലും, πενθεράയോടുള്ള ജോടീകരണം ഇവിടെ ‘മരുമകൾ’ എന്ന ബന്ധപദം ആവശ്യപ്പെടുന്നു.
- source_word: κατὰ τῆς πενθερᾶς αὐτῆς
  choice: അവളുടെ അമ്മായിയമ്മയ്ക്ക് എതിരായി
  rationale: സ്ത്രീയുടെ ഭർത്താവിന്റെ അമ്മയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള ബന്ധപദം ഉപയോഗിച്ച് എതിർപ്പിന്റെ സമാന്തരഘടന നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ പ്രസ്താവിത ദൗത്യവും കുടുംബഭിന്നതയും
  choice: യേശുവിന്റെ വരവിനാൽ കുടുംബബന്ധങ്ങളിൽ ഉണ്ടാകുന്ന എതിർപ്പിനെ വാക്യത്തിന്റെ കടുപ്പം കുറയ്ക്കാതെ അവതരിപ്പിക്കുക.
  alternative: ‘ഭിന്നിപ്പിക്കാനാണ്’ എന്ന കൂടുതൽ പദാനുപദ പരിഭാഷ, അല്ലെങ്കിൽ യേശുവിനോടുള്ള വിശ്വസ്തത മൂലമുള്ള പീഡനം എന്ന് വിശദീകരിക്കുന്ന പരാവർത്തനം.
  rationale: ഗ്രീക്ക് വാചകം കുടുംബാംഗങ്ങളെ പരസ്പരം എതിർസ്ഥാനത്ത് നിർത്തുന്നതായി ശക്തമായി പറയുന്നു. ഇത് അന്തിമമായി അഭിലഷണീയമായ കുടുംബവൈരമാണെന്ന് വ്യാഖ്യാനിക്കാതെയും സന്ദർഭാതീതമായ ദൈവശാസ്ത്ര വിശദീകരണം മുഖ്യവാചകത്തിൽ ചേർക്കാതെയും ആ സംഘർഷം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ഗൗരവമുള്ള മലയാളം. കുടുംബബന്ധപദങ്ങൾ സ്വാഭാവികമായി നൽകിയിരിക്കുന്നു; ഗ്രീക്കിലെ ആവർത്തിക്കുന്ന എതിർപ്പിന്റെ ഘടനയും വചനത്തിന്റെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തിയിട്ടുണ്ട്.
