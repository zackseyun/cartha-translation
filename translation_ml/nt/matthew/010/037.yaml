id: MAT.10.37
reference: Matthew 10:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ φιλῶν πατέρα ἢ μητέρα ὑπὲρ ἐμὲ οὐκ ἔστιν μου ἄξιος· καὶ ὁ φιλῶν υἱὸν ἢ θυγατέρα ὑπὲρ ἐμὲ οὐκ ἔστιν μου ἄξιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/037.yaml
  text: The one who loves father or mother more than me is not worthy of me[a], and the one who loves son or daughter more than me is not worthy of me.
translation:
  language: ml
  text: എന്നെക്കാൾ കൂടുതൽ[a] അപ്പനെയോ അമ്മയെയോ സ്നേഹിക്കുന്നവൻ എനിക്കു യോഗ്യനല്ല; എന്നെക്കാൾ കൂടുതൽ മകനെയോ മകളെയോ സ്നേഹിക്കുന്നവനും എനിക്കു യോഗ്യനല്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എന്നെക്കാൾ ഉപരിയായി.’ ὑπὲρ ἐμέ എന്ന ഗ്രീക്ക് പ്രയോഗം യേശുവിനെക്കാൾ മറ്റൊരാൾക്ക് മുൻഗണന നൽകി സ്നേഹിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ φιλῶν
  choice: സ്നേഹിക്കുന്നവൻ
  rationale: നിശ്ചയാർഥക ഉപപദത്തോടുകൂടിയ വർത്തമാനകാല കൃദന്തം ഈ പ്രവൃത്തിയാൽ സവിശേഷനായ ഒരാളെ പൊതുവായി സൂചിപ്പിക്കുന്നു; ‘സ്നേഹിക്കുന്നവൻ’ സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
- source_word: πατέρα ἢ μητέρα
  choice: അപ്പനെയോ അമ്മയെയോ
  rationale: ഗ്രീക്കിൽ ഉടമസ്ഥസർവനാമം ഇല്ലാത്തതിനാൽ ‘തന്റെ’ എന്നു കൂട്ടിച്ചേർത്തിട്ടില്ല. ‘അപ്പൻ/അമ്മ’ സാധാരണ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ ബന്ധപദങ്ങളാണ്.
- source_word: ὑπὲρ ἐμέ
  choice: എന്നെക്കാൾ അധികം
  rationale: ഈ താരതമ്യസന്ദർഭത്തിൽ ὑπέρ യേശുവിനെക്കാൾ മറ്റൊരാൾക്ക് മുൻഗണന നൽകുന്ന സ്നേഹത്തെ സൂചിപ്പിക്കുന്നു. ‘എന്നെക്കാൾ അധികം’ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: οὐκ ἔστιν μου ἄξιος
  choice: എനിക്ക് യോഗ്യനല്ല
  rationale: ἄξιος-നോടൊപ്പമുള്ള μου എന്ന ജനിറ്റീവിന്റെ ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി സൂക്ഷിക്കുന്നു; ‘എന്റേതാകാൻ യോഗ്യനല്ല’ പോലുള്ള വ്യാഖ്യാനവിപുലീകരണം ഒഴിവാക്കുന്നു.
- source_word: καὶ
  choice: -ഉം
  rationale: രണ്ടാമത്തെ സമാന്തരവാക്യത്തെ ആദ്യത്തോടു സ്വാഭാവികമായി ഏകോപിപ്പിക്കുകയും ഗ്രീക്കിലെ καί-യുടെ ബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: υἱὸν ἢ θυγατέρα
  choice: മകനെയോ മകളെയോ
  rationale: ഗ്രീക്കിലെ ബന്ധപദങ്ങൾ നേരിട്ട് പരിഭാഷപ്പെടുത്തി; മൂലത്തിൽ വ്യക്തമല്ലാത്ത ‘തന്റെ’ എന്ന ഉടമസ്ഥസൂചന ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: കുടുംബസ്നേഹവുമായി ബന്ധപ്പെട്ട യേശുവിന്റെ ആവശ്യത്തിന്റെ അർഥം
  choice: ഏറ്റവും അടുത്ത കുടുംബബന്ധങ്ങളെക്കാൾ യേശുവിനോടുള്ള സ്നേഹത്തിന് പരമമായ മുൻഗണന വേണമെന്ന താരതമ്യാവശ്യം അതിന്റെ തീക്ഷ്ണതയോടെ നിലനിർത്തി.
  alternative: ‘എന്നെയും അത്രതന്നെ സ്നേഹിക്കാത്തവൻ’ എന്ന മൃദുവായ ഭാഷയോ കുടുംബത്തെ വെറുക്കണമെന്ന വ്യാഖ്യാനവിപുലീകരണമോ.
  rationale: ὑπὲρ ἐμέ താരതമ്യപരമായ മുൻഗണനയാണ് പ്രകടിപ്പിക്കുന്നത്. കുടുംബസ്നേഹത്തിന്റെ നന്മ നിഷേധിക്കാതെയും വാക്യത്തിലെ ശിഷ്യത്വാവശ്യത്തെ ദുർബലമാക്കാതെയും പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. ‘പിതാവ്/മാതാവ്’ എന്നതിനെക്കാൾ കുടുംബബന്ധത്തിന്റെ നേരിട്ടുള്ള സ്വരം നൽകുന്ന ‘അപ്പൻ/അമ്മ’ തെരഞ്ഞെടുത്തു; വാക്യത്തിന്റെ ഗൗരവം ‘യോഗ്യനല്ല’ എന്ന പ്രയോഗത്തിലൂടെ നിലനിർത്തി.
