  to: ഞാൻ നിങ്ങളോടു ഇരുട്ടിൽ[a] പറയുന്നതു വെളിച്ചത്തിൽ പറയുക; നിങ്ങൾ ചെവിയിൽ[b] കേൾക്കുന്നതു വീടുകളുടെ മേൽക്കൂരകളിൽ വിളിച്ചുപറയുക.
