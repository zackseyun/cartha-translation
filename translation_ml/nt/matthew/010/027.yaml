  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃ λέγω ὑμῖν ἐν τῇ σκοτίᾳ, εἴπατε ἐν τῷ φωτί· καὶ ὃ εἰς τὸ οὖς ἀκούετε, κηρύξατε ἐπὶ τῶν δωμάτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/027.yaml
  text: What I tell you in the darkness[a], say in the light; and what you hear in the ear[b], proclaim on the housetops.
translation:
  language: ml
  text: ഞാൻ നിങ്ങളോടു ഇരുട്ടിൽ[a] പറയുന്നതു വെളിച്ചത്തിൽ പറയുക; നിങ്ങൾ ചെവിയിൽ[b] കേൾക്കുന്നതു വീടുകളുടെ മേൽക്കൂരകളിൽ വിളിച്ചുപറയുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഇരുട്ടിൽ ... വെളിച്ചത്തിൽ’ എന്ന പ്രയോഗം ‘രഹസ്യമായി ... പരസ്യമായി’ എന്ന അർഥവും സൂചിപ്പിക്കുന്നു; എന്നാൽ മൂലഗ്രീക്കിലെ ദൃശ്യവൈരുധ്യം ഇവിടെ നിലനിർത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ചെവിയിൽ’ കേൾക്കുന്നതു സ്വകാര്യമായി അറിയിക്കപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു; അതു പൊതുവായി അറിയിക്കണമെന്നതാണ് ആശയം. പുരാതന വീടുകളുടെ പരന്ന മേൽക്കൂരകൾ പൊതുപ്രഖ്യാപനത്തിന് ദൃശ്യമായ ഇടങ്ങളായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν τῇ σκοτίᾳ
  choice: ഇരുട്ടിൽ
  rationale: ‘വെളിച്ചത്തിൽ’ എന്നതിനോടുള്ള ദൃശ്യവൈരുധ്യം നിലനിർത്തുന്നു; ‘രഹസ്യമായി’ എന്നു വ്യാഖ്യാനിച്ച് രൂപകം ഇല്ലാതാക്കുന്നില്ല.
- source_word: ἐν τῷ φωτί
  choice: വെളിച്ചത്തിൽ
  rationale: മൂലത്തിലെ ഇരുട്ട്–വെളിച്ചം ദൃശ്യജോടിയും സ്വകാര്യതയിൽനിന്ന് പരസ്യതയിലേക്കുള്ള സൂചനയും സംരക്ഷിക്കുന്നു.
- source_word: εἰς τὸ οὖς ἀκούετε
  choice: ചെവിയിൽ കേൾക്കുന്നത്
  rationale: സ്വകാര്യമായി അറിയിക്കപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ദൃശ്യപ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: κηρύξατε
  choice: വിളിച്ചുപറയുക
  rationale: പരസ്യവും കേൾവിക്കെത്തുന്നതുമായ പ്രഖ്യാപനത്തിന്റെ ശക്തി നൽകുന്നു; ഔപചാരിക പ്രസംഗത്തിലേക്ക് അർഥം ചുരുക്കുന്നില്ല.
- source_word: ἐπὶ τῶν δωμάτων
  choice: പുരമുകളിൽനിന്ന്
  rationale: പുരാതന വീടുകളുടെ പരന്ന മേൽക്കൂരകളിൽനിന്നുള്ള പൊതുപ്രഖ്യാപനത്തിന്റെ സാംസ്കാരിക ചിത്രം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: ഇരുട്ട്/വെളിച്ചം, ചെവി/പുരമുകൾ എന്നീ പ്രയോഗങ്ങളെ അതേ ദൃശ്യരൂപത്തിൽ നൽകണമോ, രഹസ്യം/പരസ്യം എന്നു വ്യാഖ്യാനിക്കണമോ
  choice: പ്രധാന പാഠത്തിൽ ദൃശ്യഭാഷ നിലനിർത്തുക
  alternative: ‘രഹസ്യമായി ... പരസ്യമായി ... സ്വകാര്യമായി കേൾക്കുന്നത് പൊതുവിൽ പ്രഖ്യാപിക്കുക’
  rationale: യേശുവിന്റെ വൈരുധ്യപൂർണവും സജീവവുമായ ഭാഷ നിലനിർത്തുകയും സ്വകാര്യമായി ലഭിച്ച സന്ദേശം പരസ്യമായി അറിയിക്കണമെന്ന അർഥം വിശദീകരണക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആജ്ഞാരൂപം. ‘പുരമുകളിൽനിന്ന്’ എന്നത് മേൽക്കൂരയിലെ സ്ഥാനവും അവിടെനിന്നുള്ള പ്രഖ്യാപനവും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
