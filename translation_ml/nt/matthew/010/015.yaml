  to: 'സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: ന്യായവിധിദിവസത്തിൽ ആ പട്ടണത്തേക്കാൾ സൊദോമിന്റെയും ഗൊമോറയുടെയും ദേശത്തിന്[b] കൂടുതൽ സഹിക്കാവുന്നതായിരിക്കും.[a]'
