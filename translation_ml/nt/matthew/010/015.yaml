id: MAT.10.15
reference: Matthew 10:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ἀνεκτότερον ἔσται γῇ Σοδόμων καὶ Γομόρρων ἐν ἡμέρᾳ κρίσεως ἢ τῇ πόλει ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/015.yaml
  text: Truly I say to you[c][b][a], it will be more bearable for the land of Sodom and Gomorrah on the day of judgment than for that town.
translation:
  language: ml
  text: 'സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: ന്യായവിധിദിവസത്തിൽ ആ പട്ടണത്തേക്കാൾ സൊദോമിന്റെയും ഗൊമോറയുടെയും ദേശത്തിന്[b] കൂടുതൽ സഹിക്കാവുന്നതായിരിക്കും.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കൂടുതൽ സഹനീയമായിരിക്കും.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘സൊദോമിനും ഗൊമോറയ്ക്കും.’ ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘സൊദോമിന്റെയും ഗൊമോറയുടെയും ദേശത്തിന്’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: സത്യമായി
  rationale: യേശുവിന്റെ ഗൗരവപൂർണമായ ഉറപ്പിക്കൽ സൂത്രവാക്യത്തിന്റെ അർഥം ആധുനിക മലയാളത്തിൽ സുതാര്യമായി നൽകുന്നു; ‘ആമേൻ’ എന്ന ലിപ്യന്തരണം ഇവിടെ സാധാരണ വായനക്കാർക്ക് അത്ര വ്യക്തമല്ല.
- source_word: λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: ഗ്രീക്കിലെ നേരിട്ടുള്ള പ്രസ്താവനാസൂത്രം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ അടുത്തായി നിലനിർത്തുന്നു.
- source_word: ἀνεκτότερον
  choice: സഹിക്കാവുന്നതായിരിക്കും
  rationale: താരതമ്യത്തിന്റെ രണ്ടാം ഭാഗമായ ‘ഉള്ളതിനെക്കാൾ’ എന്ന പ്രയോഗത്തോടൊപ്പം ചേർന്ന് ‘കൂടുതൽ സഹനീയമായിരിക്കും’ എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: γῇ
  choice: ദേശത്തിന്
  rationale: ഇവിടെ ഭൂഗോളം എന്നല്ല, സൊദോമും ഗൊമോറയും ഉൾപ്പെട്ട പ്രദേശം എന്ന ഭൂമിശാസ്ത്രപരമായ അർഥമാണ്; ഗ്രീക്കിലെ ദത്തിവ് ബന്ധവും മലയാളത്തിലെ ‘-ന്’ രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: Σοδόμων καὶ Γομόρρων
  choice: സൊദോമിന്റെയും ഗൊമോറയുടെയും
  rationale: സ്ഥലനാമങ്ങളുടെ പരിചിതമായ മലയാളരൂപങ്ങൾ ഉപയോഗിച്ച് γῇ-യോടുള്ള ജനിറ്റീവ് ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: ന്യായവിധിദിവസത്തിൽ
  rationale: ദൈവിക ന്യായവിധിയുടെ ദിവസത്തെ സൂചിപ്പിക്കുന്ന വാചകം ചുരുക്കവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു; വാക്യം പറയുന്നതിലപ്പുറം വിശദമായ അന്ത്യകാലക്രമം ചേർക്കുന്നില്ല.
- source_word: πόλει
  choice: പട്ടണത്തിന്
  rationale: πόλις എന്നതിന് ‘നഗരം’ എന്നും വരാമെങ്കിലും, ശിഷ്യന്മാരുടെ ദൗത്യസന്ദർഭത്തിൽ ‘പട്ടണം’ സ്വാഭാവികമാണ്; ദത്തിവ് താരതമ്യം ‘-ന്’ രൂപത്തിൽ സൂക്ഷിക്കുന്നു.
- source_word: ἐκείνῃ
  choice: ആ
  rationale: സന്ദേശവാഹകരെ നിരസിക്കുന്ന മുമ്പ് പരാമർശിച്ച പ്രത്യേക പട്ടണത്തിലേക്കുള്ള സൂചന ലളിതമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘ന്യായവിധിദിവസം’ എന്നതിന്റെ സ്വഭാവം
  choice: ഭാവിയിലെ ദൈവിക ന്യായവിധിയുടെ ദിവസമായി പരിഭാഷപ്പെടുത്തി; അതിലപ്പുറം വിശദീകരിച്ചില്ല.
  alternative: പൊതുവായ ഒരു ന്യായവിധിക്കാലം എന്ന നിലയിൽ പരിഭാഷപ്പെടുത്തുക.
  rationale: ἐν ἡμέρᾳ κρίσεως സ്വാഭാവികമായി അന്തിമ ന്യായവിധിയിലേക്കാണ് വിരൽചൂണ്ടുന്നത്; എന്നാൽ ഒരു പ്രത്യേക സമ്പ്രദായത്തിന്റെ വിശദമായ അന്ത്യകാലരൂപരേഖ പരിഭാഷയിൽ ചേർക്കരുത്.
- issue: താരതമ്യത്തിൽ സൂചിപ്പിക്കപ്പെടുന്ന അനുഭവം
  choice: ഗ്രീക്കിനെപ്പോലെ ‘സഹിക്കാവുന്നതായിരിക്കും’ എന്ന് മാത്രം പറഞ്ഞു, ശിക്ഷയോ വിധിയോ എന്ന നാമം ചേർത്തില്ല.
  alternative: ‘ശിക്ഷ കൂടുതൽ സഹിക്കാവുന്നതായിരിക്കും’ അല്ലെങ്കിൽ ‘വിധി കൂടുതൽ ലഘുവായിരിക്കും’ എന്ന് വ്യക്തമാക്കുക.
  rationale: മൂലവാക്യം എന്താണ് കൂടുതൽ സഹനീയം എന്നു സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നുവെങ്കിലും നാമവാചകം വ്യക്തമാക്കുന്നില്ല; ആ ഉദ്ദേശ്യപൂർണമായ സംക്ഷിപ്തതയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു’ എന്ന രൂപം പ്രസ്താവനയുടെ ഔന്നത്യവും നേരിട്ട സ്വഭാവവും നിലനിർത്തുന്നു. താരതമ്യത്തിന്റെ ഗ്രീക്ക് ഘടന പൂർണമായി അനുകരിച്ച് അസ്വാഭാവികമാക്കാതെ, ‘ആ പട്ടണത്തിന് ഉള്ളതിനെക്കാൾ’ എന്ന മലയാളപ്രയോഗത്തിലൂടെ അർഥം വ്യക്തമാക്കിയിരിക്കുന്നു.
