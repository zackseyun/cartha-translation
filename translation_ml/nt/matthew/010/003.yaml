lexical_decisions:
- source_word: Φίλιππος
  choice: ഫിലിപ്പോസ്
  rationale: പുതിയനിയമത്തിലെ വ്യക്തിനാമത്തിന്റെ ഗ്രീക്ക് രൂപത്തോട് അടുത്തുനിൽക്കുന്ന, മലയാളത്തിൽ സ്വാഭാവികമായ ലിപ്യന്തരണം.
- source_word: Βαρθολομαῖος
  choice: ബർത്തൊലോമായി
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ തിരിച്ചറിയാവുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: Θωμᾶς
  choice: തോമാസ്
  rationale: മലയാളത്തിൽ സുപരിചിതമായ പുതിയനിയമ നാമരൂപം.
- source_word: Μαθθαῖος
  choice: മത്തായി
  rationale: മലയാള ബൈബിൾ വായനയിൽ വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്ന സ്വാഭാവിക നാമരൂപം.
- source_word: ὁ τελώνης
  choice: നികുതിപിരിവുകാരനായ
  rationale: നികുതികളോ ചുങ്കങ്ങളോ പിരിച്ചിരുന്നയാളെ സൂചിപ്പിക്കുന്ന τελώνης എന്ന പദത്തിന്റെ വ്യക്തവും ആധുനികവുമായ മലയാള പരിഭാഷ; കാലഹരണപ്പെട്ട പദപ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: Ἰάκωβος
  choice: യാക്കോബ്
  rationale: Ἰάκωβος എന്ന ഗ്രീക്ക് നാമത്തിന്റെ ചരിത്രപരവും മലയാളത്തിൽ പരിചിതവുമായ രൂപം; ഇംഗ്ലീഷിലെ പരമ്പരാഗത ‘James’ എന്ന വ്യത്യസ്ത രൂപത്തെ അനുകരിക്കാതെ മൂലനാമത്തോട് അടുത്തുനിൽക്കുന്നു.
- source_word: ὁ τοῦ Ἁλφαίου
  choice: അൽഫായിയുടെ മകനായ
  rationale: ഗ്രീക്കിലെ പിതൃബന്ധം സൂചിപ്പിക്കുന്ന സംക്ഷിപ്ത ഷഷ്ഠീപ്രയോഗം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി തുറന്നുപറയുന്നു.
- source_word: Ἁλφαίου
  choice: അൽഫായി
  rationale: Ἁλφαῖος എന്ന വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം; വാക്യത്തിൽ ഷഷ്ഠീരൂപമായി ‘അൽഫായിയുടെ’ എന്നു വരുന്നു.
- source_word: Θαδδαῖος
  choice: തദ്ദായി
  rationale: നൽകിയ SBLGNT പാഠത്തിലെ Θαδδαῖος നേരിട്ട് ലിപ്യന്തരിക്കുന്നു; മറ്റു പാഠരൂപങ്ങൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: καὶ
  choice: -ഉം / -യും
  rationale: പട്ടികയിലെ ആവർത്തിതമായ ഗ്രീക്ക് സംയോജകത്തെ മലയാളത്തിലെ സ്വാഭാവിക സമുച്ചയപ്രത്യയങ്ങളാൽ പ്രതിനിധീകരിക്കുന്നു.
theological_decisions:
- issue: പട്ടികയിലെ അവസാന അപ്പൊസ്തലന്റെ തിരിച്ചറിയൽ
  choice: തദ്ദായി
  alternative: ലെബ്ബായി; യാക്കോബിന്റെ മകനായ യൂദാസ്
  rationale: നൽകിയ അടിസ്ഥാന ഗ്രീക്ക് പാഠം Θαδδαῖος എന്നാണ് വായിക്കുന്നത്. കൈയെഴുത്തുപ്രതി വ്യത്യാസങ്ങളെയും ലൂക്കോസിലെ സമാന്തര പട്ടികയെയും മുഖ്യപാഠത്തിൽ ഒത്തുചേർക്കാതെ അടിക്കുറിപ്പിൽ സുതാര്യമായി രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ ജോഡിയായ പട്ടികഘടന മലയാളത്തിലെ ‘-ഉം/-യും’ പ്രയോഗത്തിലൂടെ നിലനിർത്തി. വാക്യം അടുത്ത വാക്യഭാഗത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തി.
