  text: Philip and Bartholomew[a], Thomas and Matthew the tax collector, James the son of Alphaeus and Thaddaeus,
translation:
  language: ml
  text: ഫിലിപ്പോസും ബർത്തൊലൊമായിയും, തോമസും നികുതിപിരിവുകാരനായ മത്തായിയും, അൽഫായിയുടെ മകനായ യാക്കോബും തദ്ദായിയും,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ “ലെബ്ബായി” എന്നും (അല്ലെങ്കിൽ “തദ്ദായി എന്നു വിളിക്കപ്പെട്ട ലെബ്ബായി” എന്നും) കാണുന്നു; ലൂക്കോസ് നൽകിയ അപ്പൊസ്തലന്മാരുടെ പട്ടികകളിൽ ഇതിനു സമാനമായ സ്ഥാനത്ത് “യാക്കോബിന്റെ മകനായ യൂദാസ്” എന്നാണ്.
