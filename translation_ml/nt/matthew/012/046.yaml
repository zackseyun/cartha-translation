id: MAT.12.46
reference: Matthew 12:46
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἔτι ⸀δὲ αὐτοῦ λαλοῦντος τοῖς ὄχλοις ἰδοὺ ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ εἱστήκεισαν ἔξω ζητοῦντες αὐτῷ λαλῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/046.yaml
  text: While he was still speaking to the crowds[a], behold, his mother and his brothers were standing outside, seeking to speak to him.
translation:
  language: ml
  text: അവൻ അപ്പോഴും ജനക്കൂട്ടങ്ങളോടു സംസാരിച്ചുകൊണ്ടിരിക്കെ, ഇതാ, അവന്റെ അമ്മയും സഹോദരന്മാരും അവനോടു സംസാരിക്കാൻ ശ്രമിച്ചുകൊണ്ട് പുറത്തു നിൽക്കുകയായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ἀδελφοί എന്ന പദം അടുത്ത ബന്ധുക്കളെ വിശാലമായ അർഥത്തിൽ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കിയാൽ, ‘സഹോദരങ്ങൾ’ എന്നു പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിൽ ഇവിടെ പദം പുല്ലിംഗ ബഹുവചനമായതിനാൽ മുഖ്യപാഠത്തിൽ ‘സഹോദരന്മാർ’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι δὲ αὐτοῦ λαλοῦντος
  choice: അവൻ ... സംസാരിച്ചുകൊണ്ടിരിക്കുമ്പോൾത്തന്നെ
  rationale: ജനക്കൂട്ടങ്ങളോടുള്ള സംസാരം തുടരുന്നതിനിടയിലാണ് അടുത്ത സംഭവം ഉണ്ടായതെന്ന സമകാലികതയും ἔτιയുടെ ‘അപ്പോഴും’ എന്ന ഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു; δέ ഇവിടെ മൃദുവായ ആഖ്യാനമാറ്റമാണ്.
- source_word: τοῖς ὄχλοις
  choice: ജനക്കൂട്ടങ്ങളോടു
  rationale: ഗ്രീക്കിലെ ബഹുവചനത്തെ നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: പുതിയ സംഭവവികാസത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗ്രീക്ക് വ്യവഹാരചിഹ്നത്തിന്റെ സജീവമായ ആഖ്യാനബലം സംരക്ഷിക്കുന്നു.
- source_word: ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ
  choice: അവന്റെ അമ്മയും സഹോദരന്മാരും
  rationale: സന്ദർഭത്തിൽ αὐτοῦ കുടുംബപരാമർശം മുഴുവൻ നിർണ്ണയിക്കുന്നതായി മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ἀδελφοί എന്ന പുല്ലിംഗ ബഹുവചനം മുഖ്യപാഠത്തിൽ ‘സഹോദരന്മാർ’ എന്നു നൽകുന്നു.
- source_word: εἱστήκεισαν ἔξω
  choice: പുറത്തു നിൽക്കുകയായിരുന്നു
  rationale: നേരത്തെ നിലയുറപ്പിച്ച് തുടർന്നിരുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്ന ക്രിയാരൂപത്തിന്റെ നിലാവസ്ഥാഭാവം മലയാളത്തിലെ തുടർച്ചാരൂപത്തിലൂടെ നൽകുന്നു; വാക്യത്തിൽ വ്യക്തമല്ലാത്ത ‘വീടിന്’ എന്ന പദം ചേർക്കുന്നില്ല.
- source_word: ζητοῦντες αὐτῷ λαλῆσαι
  choice: അവനോടു സംസാരിക്കാൻ ആഗ്രഹിച്ച്
  rationale: ഇവിടെ ζητέω ലക്ഷ്യബോധമുള്ള ആഗ്രഹം/ശ്രമം സൂചിപ്പിക്കുന്നു. ‘അന്വേഷിച്ച്’ എന്ന അക്ഷരാർഥം മലയാളത്തിൽ തെറ്റായ ധാരണ ഉണ്ടാക്കാമെന്നതിനാൽ സന്ദർഭാനുസൃതമായ സ്വാഭാവിക പ്രയോഗം സ്വീകരിക്കുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ കുടുംബത്തെ സംബന്ധിച്ച ἀδελφοί എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: അവന്റെ സഹോദരന്മാർ
  alternative: അവന്റെ സഹോദരങ്ങൾ; അവന്റെ അടുത്ത പുരുഷബന്ധുക്കൾ
  rationale: ഗ്രീക്ക് പദം പുല്ലിംഗ ബഹുവചനമാണ്; ആഖ്യാനത്തിന്റെ ഭാഷാതലത്തിൽ ‘സഹോദരന്മാർ’ ഏറ്റവും നേരിട്ടുള്ള പരിഭാഷയാണ്. യേശുവുമായുള്ള അവരുടെ കൃത്യമായ ബന്ധത്തെക്കുറിച്ചുള്ള പിൽക്കാല ദൈവശാസ്ത്രവാദം മുഖ്യപാഠം തീർപ്പാക്കുന്നില്ല; വിശാലമായ ബന്ധുത്വാർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ഇതാ’ എന്നത് മൂലപാഠത്തിലെ ശ്രദ്ധാകർഷകത നിലനിർത്തുന്നു. ‘ജനക്കൂട്ടങ്ങൾ’ എന്ന ബഹുവചനവും ‘പുറത്ത്’ എന്ന നിർവ്യാജ സ്ഥാനസൂചനയും സംരക്ഷിച്ചിട്ടുണ്ട്.
