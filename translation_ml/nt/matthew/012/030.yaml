id: MAT.12.30
reference: Matthew 12:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ μὴ ὢν μετ’ ἐμοῦ κατ’ ἐμοῦ ἐστιν, καὶ ὁ μὴ συνάγων μετ’ ἐμοῦ σκορπίζει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/030.yaml
  text: The one who is not with me is against me[a], and the one who does not gather with me scatters.
translation:
  language: ml
  text: എന്നോടുകൂടെ ഇല്ലാത്തവൻ എനിക്ക് എതിരാണ്; എന്നോടുകൂടെ ഒരുമിച്ചുകൂട്ടാത്തവൻ ചിതറിക്കുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μὴ ὢν
  choice: ഇല്ലാത്തവൻ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ കൃദന്തരൂപം ഒരു വ്യക്തിയെ പൊതുവായ ഏകവചനത്തിൽ സൂചിപ്പിക്കുന്നു. ‘ഇല്ലാത്തവൻ’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികമായി ആ പൊതുവായ അർഥം നൽകുന്നു.
- source_word: μετ’ ἐμοῦ
  choice: എന്നോടുകൂടെ
  rationale: ജനിറ്റീവിനോടൊപ്പമുള്ള μετά ഇവിടെ സഹവാസമോ പക്ഷചേരലോ സൂചിപ്പിക്കുന്നു. ‘എന്നോടുകൂടെ’ ബന്ധപരമായ അർഥം നിലനിർത്തുന്നു; ‘എന്റെ പക്ഷത്ത്’ എന്ന വ്യാഖ്യാനാത്മക വിപുലീകരണം ഒഴിവാക്കുന്നു.
- source_word: κατ’ ἐμοῦ
  choice: എനിക്ക് എതിരാണ്
  rationale: ജനിറ്റീവിനോടൊപ്പമുള്ള κατά വിരോധം പ്രകടിപ്പിക്കുന്നു. ‘എനിക്ക് എതിരാണ്’ വ്യക്തവും സ്വാഭാവികവുമായ മലയാളമാണ്.
- source_word: συνάγων
  choice: ഒരുമിച്ചുകൂട്ടാത്തവൻ
  rationale: συνάγω ഒന്നിച്ചുകൂട്ടുക എന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘ഒരുമിച്ചുകൂട്ടുക’ എന്നത് ഇടയപരിപാലനമോ കൊയ്ത്തോ പോലുള്ള സാധ്യതയുള്ള ദൃശ്യങ്ങളെ അനാവശ്യമായി പ്രത്യേകീകരിക്കാതെ മൂലപദത്തിന്റെ വ്യാപ്തി സൂക്ഷിക്കുന്നു.
- source_word: σκορπίζει
  choice: ചിതറിക്കുന്നു
  rationale: ‘ചിതറിക്കുന്നു’ എന്നത് കൂട്ടുന്നതിന് വിരുദ്ധമായ പ്രവൃത്തിയെ വ്യക്തമായി പ്രകടിപ്പിക്കുകയും ഗ്രീക്കിലെ സമാന്തരവിരോധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: καὶ
  choice: ;
  rationale: ഗ്രീക്കിലെ καὶ രണ്ട് സമാന്തര പ്രസ്താവനകളെ കൂട്ടിയിണക്കുന്നു. മലയാളത്തിൽ അർധവിരാമം ആ ബന്ധവും വാക്യത്തിന്റെ സംക്ഷിപ്തമായ പ്രബലതയും സ്വാഭാവികമായി നിലനിർത്തുന്നു; വിരോധസൂചകമായ ‘എന്നാൽ’ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: യേശുവിനോടുള്ള പക്ഷചേരലിന്റെ സമ്പൂർണ വിരോധദ്വയം
  choice: യേശുവിനോടുകൂടെ ഇല്ലാത്തവൻ അവന് എതിരാണെന്ന വിട്ടുവീഴ്ചയില്ലാത്ത പ്രസ്താവന അതേ ശക്തിയിൽ നിലനിർത്തി.
  alternative: സമ്പൂർണമായ വിരോധത്തെ മയപ്പെടുത്തുന്ന വ്യാഖ്യാനാത്മക പരാവർത്തനം.
  rationale: ഗ്രീക്കിൽ ഇളവ് സൂചിപ്പിക്കുന്ന ഭാഷയില്ല; രണ്ട് ഖണ്ഡങ്ങളും തീക്ഷ്ണമായ സമാന്തരപ്രസ്താവനകളാണ്. അതിനാൽ തുടർന്നുള്ള ഉപദേശപരമായ നിഗമനങ്ങൾ ചേർക്കാതെ ഈ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘എന്നോടുകൂടെ’ എന്ന ആവർത്തനം ഗ്രീക്കിലെ μετ’ ἐμοῦ എന്ന ആവർത്തനവും വാക്യത്തിന്റെ സമാന്തരഘടനയും സൂക്ഷിക്കുന്നു. പുരുഷലിംഗ ഏകവചനരൂപം ഗ്രീക്കിലെ പൊതുവായ ഏകവചനത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രതിനിധീകരിക്കുന്നു.
