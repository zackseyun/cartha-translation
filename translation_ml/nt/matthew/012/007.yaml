id: MAT.12.7
reference: Matthew 12:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ δὲ ἐγνώκειτε τί ἐστιν· Ἔλεος θέλω καὶ οὐ θυσίαν, οὐκ ἂν κατεδικάσατε τοὺς ἀναιτίους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/007.yaml
  text: But if you had known what this means[b][a], ‘I desire mercy and not sacrifice,’ you would not have condemned the guiltless.
translation:
  language: ml
  text: എന്നാൽ, ‘ഞാൻ കരുണയാണ് ആഗ്രഹിക്കുന്നത്, യാഗമല്ല’ എന്നതിന്റെ അർഥം നിങ്ങൾ അറിഞ്ഞിരുന്നെങ്കിൽ,[a] കുറ്റമില്ലാത്തവരെ നിങ്ങൾ കുറ്റം വിധിക്കുമായിരുന്നില്ല.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: യേശു ഹോശേയ 6:6 ഉദ്ധരിക്കുന്നു.
    reason: cross_reference
  - marker: b
    text: അഥവാ ‘നിരപരാധികളെ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώκειτε
  choice: നിങ്ങൾ അറിഞ്ഞിരുന്നെങ്കിൽ
  rationale: പ്രതിവാസ്തവമായ നിബന്ധനയുടെ ഭൂതകാലഭാവം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; അറിവിനോടൊപ്പം വചനത്തിന്റെ അർഥഗ്രഹണവും സന്ദർഭത്തിൽ ഉൾപ്പെടുന്നു.
- source_word: τί ἐστιν
  choice: എന്നതിന്റെ അർഥം
  rationale: ഉദ്ധരിച്ച തിരുവെഴുത്ത് എന്താണ് അർഥമാക്കുന്നതെന്ന് സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: Ἔλεος
  choice: കരുണ
  rationale: ἔλεος എന്ന പദത്തിന്റെ ദയയും അനുകമ്പയും ഉൾക്കൊള്ളുന്ന സാധാരണവും ദൈവശാസ്ത്രപരമായി അമിതമായി വികസിപ്പിക്കാത്തതുമായ പരിഭാഷ.
- source_word: θέλω
  choice: ആഗ്രഹിക്കുന്നു
  rationale: പ്രവാചക ഉദ്ധരണിയുടെ ഗൗരവം നിലനിർത്തുകയും ദൈവത്തിന്റെ മുൻഗണന ശക്തമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: θυσίαν
  choice: യാഗം
  rationale: ആരാധനാപരമായ ബലിയെ സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾ ഭാഷയിലും പൊതുപ്രയോഗത്തിലും പരിചിതമായ സംക്ഷിപ്ത പദം.
- source_word: κατεδικάσατε
  choice: കുറ്റം വിധിക്കുമായിരുന്നില്ല
  rationale: καταδικάζωയുടെ ന്യായവിധിസംബന്ധമായ ശക്തിയും ἄν ചേർന്ന പ്രതിവാസ്തവ ഫലവാക്യവും വ്യക്തമാക്കുന്നു.
- source_word: ἀναιτίους
  choice: കുറ്റമില്ലാത്തവരെ
  rationale: ന്യായവിധിസംബന്ധമായ അർഥം നിലനിർത്തുകയും ordinary modern Malayalam-ൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ഹോശേയ 6:6-ലെ യാഗത്തോടുള്ള പ്രവാചകീയ വിരോധാഭാസം
  choice: ‘ഞാൻ കരുണയാണ് ആഗ്രഹിക്കുന്നത്, യാഗമല്ല’
  alternative: ‘എനിക്ക് വേണ്ടത് കരുണയാണ്, യാഗമല്ല’
  rationale: ഗ്രീക്കിലെ മൂർച്ചയുള്ള വൈരുധ്യം അതേപടി നിലനിർത്തുന്നു. ഇത് കരുണയ്ക്ക് ആചാരത്തെക്കാൾ മുൻഗണന നൽകുന്നു; എന്നാൽ എല്ലാ യാഗങ്ങളുടെയും സമ്പൂർണ നിരാകരണം എന്ന് പരിഭാഷയിൽ വിശദീകരിച്ച് തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. പ്രവാചക ഉദ്ധരണിക്ക് നേരിട്ടും ഗൗരവമുള്ളതുമായ ശൈലി നൽകിയിരിക്കുന്നു; നിയമപരമായ പദബന്ധം ‘കുറ്റമില്ലാത്തവരെ ... കുറ്റം വിധിക്കുക’ എന്ന രൂപത്തിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
