id: MAT.12.1
reference: Matthew 12:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐν ἐκείνῳ τῷ καιρῷ ἐπορεύθη ὁ Ἰησοῦς τοῖς σάββασιν διὰ τῶν σπορίμων· οἱ δὲ μαθηταὶ αὐτοῦ ἐπείνασαν καὶ ἤρξαντο τίλλειν στάχυας καὶ ἐσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/001.yaml
  text: At that time Jesus went through the grainfields on the Sabbath[a], and his disciples became hungry and began to pluck heads of grain and eat.
translation:
  language: ml
  text: ആ സമയത്ത് യേശു ശബ്ബത്തിൽ[a] ധാന്യവയലുകളിലൂടെ കടന്നുപോയി. അവന്റെ ശിഷ്യന്മാർക്കു വിശന്നു; അവർ ധാന്യക്കതിരുകൾ പറിച്ചുതിന്നാൻ തുടങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ‘ശബ്ബത്തുകളിൽ’ എന്ന ബഹുവചനരൂപം; ഇവിടെ ഒരു ശബ്ബത്തുദിനത്തെ സൂചിപ്പിക്കുന്ന പതിവുപ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: ആ സമയത്ത്
  rationale: καιρός ഇവിടെ ഘടികാരസമയത്തെയല്ല, ഒരു കാലഘട്ടത്തെയോ സന്ദർഭത്തെയോ സൂചിപ്പിക്കുന്നു; സ്വാഭാവികമായ ആഖ്യാനകാലസൂചകമായി ‘ആ സമയത്ത്’ ഉപയോഗിച്ചു.
- source_word: ἐπορεύθη
  choice: കടന്നുപോയി
  rationale: πορεύομαι എന്നത് പോകുക/സഞ്ചരിക്കുക എന്നാണ്; വയലുകളിലൂടെ എന്ന ഘടനയോടൊപ്പം മലയാളത്തിൽ ‘കടന്നുപോയി’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: τοῖς σάββασιν
  choice: ശബ്ബത്തുനാളിൽ
  rationale: ഗ്രീക്കിൽ ബഹുവചനരൂപമാണെങ്കിലും കൊയ്നേ ഗ്രീക്കിലെ പതിവുപ്രയോഗത്തിൽ ഇവിടെ ഏക ശബ്ബത്തുദിനത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: διὰ τῶν σπορίμων
  choice: ധാന്യവയലുകളിലൂടെ
  rationale: σπόριμος വിതച്ചുനിൽക്കുന്ന വയലുകളെ, പ്രത്യേകിച്ച് ധാന്യവയലുകളെ, സൂചിപ്പിക്കുന്നു; ഈ പരിഭാഷ സംക്ഷിപ്തവും വ്യക്തവുമാണ്.
- source_word: οἱ δὲ μαθηταὶ αὐτοῦ
  choice: അവന്റെ ശിഷ്യന്മാർ
  rationale: δέ ഇവിടെ ശക്തമായ വൈരുധ്യമല്ല, ലഘുവായ ആഖ്യാനബന്ധമാണ്; മലയാളത്തിലെ വാക്യവിഭജനം ആ ബന്ധം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: ἐπείνασαν
  choice: വിശന്നു
  rationale: വിശപ്പ് അനുഭവപ്പെട്ടുതുടങ്ങിയെന്ന aorist ingressive ഭാവം സന്ദർഭത്തിൽ മലയാളത്തിലെ ‘വിശന്നു’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἤρξαντο
  choice: തുടങ്ങി
  rationale: ἄρχομαι + infinitive പ്രവൃത്തിയുടെ ആരംഭം അടയാളപ്പെടുത്തുന്നു.
- source_word: τίλλειν
  choice: പറിച്ചു
  rationale: τίλλω കൈകൊണ്ട് വലിച്ചെടുക്കുക/പറിക്കുക എന്നാണ്; കതിരുകൾക്കൊപ്പം ‘പറിക്കുക’ ആധുനിക മലയാളത്തിൽ കൃത്യമാണ്.
- source_word: στάχυας
  choice: ധാന്യക്കതിരുകൾ
  rationale: στάχυς ധാന്യത്തിന്റെ കതിരിനെയോ തലക്കതിരിനെയോ സൂചിപ്പിക്കുന്നു; ‘ധാന്യക്കതിരുകൾ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: καὶ ἐσθίειν
  choice: തിന്നാൻ
  rationale: τίλλειν എന്നതിനോടൊപ്പം ἤρξαντο ആശ്രയിക്കുന്ന സമാന്തര infinitive ആണ്; ‘പറിച്ചുതിന്നാൻ തുടങ്ങി’ മലയാളത്തിൽ പ്രവർത്തനങ്ങളുടെ ബന്ധം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: σάββασιν എന്ന ബഹുവചനരൂപത്തിന്റെ പരിഭാഷ
  choice: ശബ്ബത്തുനാളിൽ
  alternative: ശബ്ബത്തുനാളുകളിൽ
  rationale: രൂപം ബഹുവചനമാണെങ്കിലും ഈ കൊയ്നേ ഗ്രീക്ക് പ്രയോഗം സന്ദർഭത്തിൽ ഒരു ശബ്ബത്തുദിനത്തെ സൂചിപ്പിക്കുന്ന പതിവുപ്രയോഗമാണ്. ബഹുവചനമായി പരിഭാഷപ്പെടുത്തുന്നത് പല ശബ്ബത്തുകൾ ഉദ്ദേശിക്കുന്നുവെന്ന തെറ്റിദ്ധാരണ സൃഷ്ടിക്കും; അടിക്കുറിപ്പ് രൂപപരമായ വിവരം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ, എന്നാൽ വേദപാഠത്തിന് യോജിച്ച മാന്യമായ ശൈലി പാലിച്ചു. ‘ശബ്ബത്ത്’, ‘ശിഷ്യന്മാർ’ തുടങ്ങിയ പരിചിതമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തി; വാക്യഘടന മലയാളത്തിന്റെ സ്വാഭാവിക ആഖ്യാനശൈലിക്കനുസരിച്ച് ക്രമപ്പെടുത്തി.
