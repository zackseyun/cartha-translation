id: MAT.12.9
reference: Matthew 12:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ μεταβὰς ἐκεῖθεν ἦλθεν εἰς τὴν συναγωγὴν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/009.yaml
  text: And departing from there, he went into their synagogue.
translation:
  language: ml
  text: അവിടെനിന്ന് പുറപ്പെട്ട് അവൻ അവരുടെ സിനഗോഗിൽ ചെന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: വാക്യാരംഭത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയില്ല
  rationale: മലയാളത്തിൽ മുൻവിവരണത്തോടുള്ള ലളിതമായ ബന്ധം ക്രിയാവിശേഷണീയമായ തുടർച്ചയിലൂടെ സ്വാഭാവികമായി വ്യക്തമാകുന്നു; ‘പിന്നെ’ എന്നു ചേർത്താൽ ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത കാലക്രമസൂചന ശക്തമാകും.
- source_word: μεταβὰς
  choice: പുറപ്പെട്ട്
  rationale: മുൻസ്ഥലത്തുനിന്നുള്ള നീക്കവും പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള പങ്കാളിക്രിയയുടെ ബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐκεῖθεν
  choice: അവിടെനിന്ന്
  rationale: മുമ്പ് പരാമർശിച്ച സ്ഥലത്തുനിന്നുള്ള പുറപ്പെടൽ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: ἦλθεν
  choice: ചെന്നു
  rationale: മുൻസ്ഥലത്തുനിന്ന് മറ്റൊരു സ്ഥലത്തേക്കുള്ള ആഖ്യാനചലനത്തിൽ മലയാളത്തിലെ സ്വാഭാവിക ദിശാപ്രയോഗമാണിത്.
- source_word: εἰς τὴν συναγωγὴν
  choice: സിനഗോഗിൽ
  rationale: εἰς സൂചിപ്പിക്കുന്ന അകത്തേക്കുള്ള ചലനം മലയാളത്തിലെ ‘സിനഗോഗിൽ ചെന്നു’ എന്ന സ്വാഭാവിക ഘടനയിൽ പ്രകടമാകുന്നു; ‘സിനഗോഗിലേക്കു ചെന്നു’ എന്നത് കെട്ടിടത്തിനരികിലേക്കുള്ള ചലനമായും വായിക്കപ്പെടാം.
- source_word: συναγωγὴν
  choice: സിനഗോഗ്
  rationale: യഹൂദരുടെ സമ്മേളന-ആരാധനാസ്ഥലത്തിനുള്ള സ്ഥാപിതവും കൃത്യവുമായ മലയാളരൂപം; വിശദീകരണപരമായ പരാവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: αὐτῶν
  choice: അവരുടെ
  rationale: ബഹുവചന ഷഷ്ഠീ സർവനാമത്തെ നേരിട്ട് നിലനിർത്തുന്നു; അത് ആരെയാണു സൂചിപ്പിക്കുന്നതെന്ന് പരിഭാഷയിൽ അധികമായി നിർവചിക്കുന്നില്ല.
theological_decisions:
- issue: ‘അവരുടെ സിനഗോഗ്’ എന്നതിലെ ‘അവരുടെ’ എന്നതിന്റെ സൂചിതർ
  choice: ‘അവരുടെ സിനഗോഗ്’ എന്നു നിഷ്പക്ഷമായി നിലനിർത്തി.
  alternative: ഒരു പ്രത്യേക ശത്രുതാപരമായോ വിഭാഗീയമായോ കൂട്ടത്തെ വ്യക്തമാക്കി പരിഭാഷപ്പെടുത്തുക.
  rationale: ഗ്രീക്കിലെ αὐτῶν ആഖ്യാനസന്ദർഭത്തിലുള്ള ഒരു കൂട്ടത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും അവരെ ഈ വാക്യത്തിൽ കൂടുതൽ നിർവചിക്കുന്നില്ല. അതിനാൽ അധികമായ വിഭാഗീയമോ വിവാദാത്മകമോ ആയ അർഥം ചേർക്കാതെ മൂലപാഠത്തിന്റെ തുറന്ന നില സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവും ആഖ്യാനസൗകര്യമുള്ളതുമായ വാക്യം. ‘പുറപ്പെട്ട് … ചെന്നു’ എന്ന ഘടന ഗ്രീക്കിലെ പങ്കാളിക്രിയയും പ്രധാനക്രിയയും തമ്മിലുള്ള ബന്ധം സ്വാഭാവികമായി പകരുന്നു.
