id: MAT.12.28
reference: Matthew 12:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ δὲ ἐν πνεύματι θεοῦ ἐγὼ ἐκβάλλω τὰ δαιμόνια, ἄρα ἔφθασεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/028.yaml
  text: But if I cast out the demons by the Spirit of God[b][a], then the kingdom of God has come upon you.
translation:
  language: ml
  text: എന്നാൽ ഞാൻ ദൈവത്തിന്റെ ആത്മാവിനാൽ[a] ഭൂതങ്ങളെ പുറത്താക്കുന്നുവെങ്കിൽ, അപ്പോൾ ദൈവരാജ്യം നിങ്ങളുടെമേൽ എത്തിയിരിക്കുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദൈവത്തിന്റെ ആത്മാവിൽ.’ ഗ്രീക്ക് പ്രയോഗം മാർഗമോ പ്രവർത്തകത്വമോ സൂചിപ്പിക്കുന്ന ‘ആത്മാവിനാൽ’ എന്നും പ്രവർത്തനത്തിന്റെ മണ്ഡലം സൂചിപ്പിക്കുന്ന ‘ആത്മാവിൽ’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: ‘എത്തിയിരിക്കുന്നു’ എന്നതിന് ‘നിങ്ങളുടെമേൽ എത്തിച്ചേർന്നിരിക്കുന്നു’ എന്നും വിവർത്തനം ചെയ്യാം. ദൈവരാജ്യം യേശുവിന്റെ പ്രവൃത്തികളിൽ അവരുടെമേൽ എത്തിച്ചേർന്നെന്ന ഊന്നൽ ഗ്രീക്ക് ക്രിയയ്ക്കുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: എന്നാൽ ... എങ്കിൽ
  rationale: δέ സൂചിപ്പിക്കുന്ന നേരിയ വൈരുധ്യവും εἰയുടെ നിബന്ധനാഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐν πνεύματι θεοῦ
  choice: ദൈവത്തിന്റെ ആത്മാവിനാൽ
  rationale: ἐν + ചതുർത്ഥിവിഭക്തി ഇവിടെ മാർഗമോ പ്രവർത്തകത്വമോ സൂചിപ്പിക്കാം; ‘ആത്മാവിനാൽ’ ദൈവാത്മാവിന്റെ പ്രവർത്തകത്വം വ്യക്തമായി അറിയിക്കുന്നു, അതേസമയം ‘ആത്മാവിൽ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἐγὼ
  choice: ഞാൻ
  rationale: ഗ്രീക്കിലെ വ്യക്തമായ സർവനാമം വാദത്തിലെ ഊന്നൽ വഹിക്കുന്നതിനാൽ മലയാളത്തിലും നിലനിർത്തുന്നു.
- source_word: ἐκβάλλω
  choice: പുറത്താക്കുന്നു
  rationale: ഭൂതബാധയിൽനിന്നുള്ള വിടുതൽസന്ദർഭത്തിൽ ശക്തിയും അർഥവും സ്വാഭാവികമായി നൽകുന്ന ആധുനിക മലയാളപ്രയോഗമാണ്.
- source_word: τὰ δαιμόνια
  choice: ഭൂതങ്ങളെ
  rationale: δαιμόνιαയ്ക്ക് സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ബൈബിൾസന്ദർഭത്തിൽ പരിചിതവുമായ സമാനപദം.
- source_word: ἄρα
  choice: അപ്പോൾ
  rationale: നിബന്ധനയിൽനിന്ന് നിഗമനത്തിലേക്കുള്ള താർക്കിക നീക്കം ചുരുക്കമായും സ്വാഭാവികമായും അടയാളപ്പെടുത്തുന്നു.
- source_word: ἔφθασεν
  choice: വന്നെത്തിയിരിക്കുന്നു
  rationale: φθάνωയുടെ എത്തിച്ചേരുക/വന്നെത്തുക എന്ന ഭാവവും അതിന്റെ ഇപ്പോഴത്തെ പ്രസക്തിയും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: ἐφ’ ὑμᾶς
  choice: നിങ്ങളുടെമേൽ
  rationale: ἐπίയുടെ ‘മേൽ/അടുത്തെത്തുക’ എന്ന സജീവമായ ദിശാഭാവം നിലനിർത്തുന്നു; ‘നിങ്ങളുടെ അടുക്കൽ’ എന്നതിനെക്കാൾ മൂലത്തിന്റെ തീവ്രത സംരക്ഷിക്കുന്നു.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ദൈവരാജ്യം
  rationale: ദൈവത്തിന്റെ രാജകീയ ഭരണവും രാജ്യവുമായുള്ള അർഥവ്യാപ്തി നിലനിർത്തുന്ന സ്ഥാപിതവും സംക്ഷിപ്തവുമായ മലയാളരൂപം.
theological_decisions:
- issue: യേശുവിന്റെ ഭൂതോച്ചാടനങ്ങളോടുള്ള ദൈവരാജ്യത്തിന്റെ ബന്ധം
  choice: യേശു ദൈവാത്മാവിനാൽ ഭൂതങ്ങളെ പുറത്താക്കുന്നത് ദൈവരാജ്യം ശ്രോതാക്കളുടെമേൽ യാഥാർഥ്യമായി വന്നെത്തിയതിന്റെ തെളിവായി വാക്യം അവതരിപ്പിക്കുന്നു.
  alternative: രാജ്യം അടുത്തുവന്നിട്ടേയുള്ളൂ, ഇതുവരെ എത്തിയിട്ടില്ല; അല്ലെങ്കിൽ ഇത് ഭാവിയിലെ പൂർത്തീകരണത്തെ മാത്രം സൂചിപ്പിക്കുന്നു.
  rationale: ἔφθασεν എത്തിച്ചേരലിനെ സൂചിപ്പിക്കുന്നു; ഇപ്പോഴത്തെ യേശുവിന്റെ പ്രവൃത്തികളിൽ ദൈവത്തിന്റെ രാജകീയ ഭരണം കടന്നുവന്നിരിക്കുന്നു എന്നതാണ് വാദത്തിന്റെ ശക്തി. ഭാവിയിലെ പൂർത്തീകരണത്തെക്കുറിച്ച് വാക്യം പ്രത്യേകം വിധിനിർണയം ചെയ്യുന്നില്ല.
- issue: ‘ദൈവത്തിന്റെ ആത്മാവ്’ എന്നതിന്റെ സൂചന
  choice: യേശുവിന്റെ ഭൂതോച്ചാടനത്തിൽ പ്രവർത്തിക്കുന്ന ദൈവത്തിന്റെ ആത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്.
  alternative: വ്യക്തിത്വമില്ലാത്ത ഒരു പൊതുവായ ദൈവിക ശക്തി മാത്രമാണ് ഉദ്ദേശിക്കുന്നത്.
  rationale: πνεύματι θεοῦ ഈ സന്ദർഭത്തിൽ യേശുവിന്റെ പ്രവൃത്തിയുടെ ദൈവിക പ്രവർത്തകനെ സൂചിപ്പിക്കുന്നു; വിവർത്തനം അതിനെ ‘ശക്തി’ എന്നു ചുരുക്കാതെ മൂലപദത്തിന്റെ വ്യക്തത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും സാധാരണ വായനാസൗകര്യവും സംയോജിപ്പിച്ചു. ‘ദൈവരാജ്യം’, ‘ദൈവത്തിന്റെ ആത്മാവ്’, ‘ഭൂതങ്ങൾ’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തി; അതിപുരാതനമോ വിഭാഗീയമോ ആയ പ്രയോഗങ്ങൾ ഒഴിവാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
