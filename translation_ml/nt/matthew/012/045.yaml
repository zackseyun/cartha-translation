  source_fidelity: 'Greek narrative presents the actions in the vivid present: the spirit goes, takes seven other spirits with it, they enter and reside there, and the man''s final condition becomes worse. The draft accurately conveys the sequence and application, but its opening mixes past (''പോയി'') with present (''കൂട്ടിക്കൊണ്ടുവരുന്നു''), losing the source''s consistent present narration.'
