id: MAT.12.45
reference: Matthew 12:45
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τότε πορεύεται καὶ παραλαμβάνει μεθ’ ἑαυτοῦ ἑπτὰ ἕτερα πνεύματα πονηρότερα ἑαυτοῦ, καὶ εἰσελθόντα κατοικεῖ ἐκεῖ· καὶ γίνεται τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου χείρονα τῶν πρώτων. οὕτως ἔσται καὶ τῇ γενεᾷ ταύτῃ τῇ πονηρᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/045.yaml
  text: Then it goes and brings with itself seven other spirits more evil than itself[a], and they enter and live there; and the last state of that man becomes worse than the first[b]. So it will be also with this evil generation.
translation:
  language: ml
  text: അപ്പോൾ അത് പോകുന്നു; തന്നേക്കാൾ ദുഷ്ടരായ മറ്റു ഏഴ് ആത്മാക്കളെ തന്നോടൊപ്പം കൂട്ടിക്കൊണ്ടുവരുന്നു[a]. അവ അകത്ത് കടന്ന് അവിടെ പാർക്കുന്നു. അങ്ങനെ ആ മനുഷ്യന്റെ അവസാനാവസ്ഥ ആദ്യാവസ്ഥയെക്കാൾ മോശമായിത്തീരുന്നു[b]. ഈ ദുഷ്ട തലമുറയ്ക്കും അങ്ങനെതന്നെ സംഭവിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തന്നേക്കാൾ ദുഷ്ടരായ വ്യത്യസ്തരായ ഏഴ് ആത്മാക്കളെ.’
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ, ‘ആ മനുഷ്യന്റെ അവസാന കാര്യങ്ങൾ ആദ്യ കാര്യങ്ങളേക്കാൾ മോശമായിത്തീരുന്നു’; അവന്റെ അവസാനാവസ്ഥ ആദ്യാവസ്ഥയെക്കാൾ മോശമാകുന്നു എന്നർഥമുള്ള പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε πορεύεται
  choice: അപ്പോൾ അത് പോയി
  rationale: വിവരണത്തിലെ അടുത്ത സംഭവത്തിലേക്കുള്ള നീക്കം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; വർത്തമാനകാലത്തിന്റെ സജീവ വിവരണഭാവവും സാധ്യമായത്ര നിലനിർത്തുന്നു.
- source_word: παραλαμβάνει μεθ’ ἑαυτοῦ
  choice: തന്നോടൊപ്പം കൂട്ടിക്കൊണ്ടുവരുന്നു
  rationale: കൂടെ കൊണ്ടുവരിക/കൂട്ടിക്കൊണ്ടുവരിക എന്ന അനുഗമനാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: ἑπτὰ ἕτερα πνεύματα
  choice: വേറെ ഏഴ് ആത്മാക്കളെ
  rationale: ἕτερα എന്നത് ഇവിടെ ആദ്യത്തെ ആത്മാവിനു പുറമേയുള്ള മറ്റുള്ളവയെ സൂചിപ്പിക്കുന്നു; വ്യത്യസ്ത സ്വഭാവം നിർബന്ധമായി സൂചിപ്പിക്കുന്നില്ല. πνεύματα എന്ന പൊതുവായ പദം ‘ആത്മാക്കൾ’ എന്നു നിലനിർത്തുന്നു.
- source_word: πονηρότερα ἑαυτοῦ
  choice: തന്നേക്കാൾ ദുഷ്ടരായ
  rationale: താരതമ്യത്തിന്റെ ശക്തിയും ധാർമ്മിക ദുഷ്ടതയുടെ ആശയവും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: εἰσελθόντα κατοικεῖ ἐκεῖ
  choice: അവ അകത്തു കടന്ന് അവിടെ പാർക്കുന്നു
  rationale: പ്രവേശനത്തിനു പിന്നാലെ അവിടെ താമസമാക്കുന്ന ക്രമം വ്യക്തമാക്കുന്നു. അച്ചടിച്ച ഗ്രീക്ക് പാഠത്തിലെ κατοικεῖ ഏകവചനരൂപമാണെങ്കിലും സന്ദർഭത്തിലെ ആത്മാക്കളുടെ പ്രവർത്തനമായാണ് വാക്യാർഥം അവതരിപ്പിച്ചിരിക്കുന്നത്.
- source_word: γίνεται τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου χείρονα τῶν πρώτων
  choice: ആ മനുഷ്യന്റെ അവസാനത്തെ അവസ്ഥ ആദ്യത്തേതിനേക്കാൾ മോശമായിത്തീരുന്നു
  rationale: ‘അവസാന കാര്യങ്ങൾ’–‘ആദ്യ കാര്യങ്ങൾ’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അവസ്ഥാസംബന്ധിയായ അർഥം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: οὕτως ἔσται καὶ τῇ γενεᾷ ταύτῃ τῇ πονηρᾷ
  choice: ഈ ദുഷ്ടതലമുറയ്ക്കും അങ്ങനെതന്നെ സംഭവിക്കും
  rationale: ഉദാഹരണത്തെ ആ തലമുറയിലേക്കു പ്രയോഗിക്കുന്ന ഉപമാസംബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: πνεύματα എന്ന പദത്തിലെ ദുഷ്ടാത്മസൂചന
  choice: ആത്മാക്കൾ
  alternative: ഭൂതങ്ങൾ / ദുരാത്മാക്കൾ
  rationale: മൂലപാഠം ഇവിടെ ‘ആത്മാക്കൾ’ എന്നാണ് പറയുന്നത്; മുൻസന്ദർഭം അവ അശുദ്ധാത്മാക്കളാണെന്ന് വ്യക്തമാക്കുന്നു. അതിനാൽ കൂടുതൽ നിർദ്ദിഷ്ടമായ പദം ചേർക്കാതെ മൂലത്തിലെ പൊതുവായ പദം നിലനിർത്തുന്നു.
- issue: τοῦ ἀνθρώπου ἐκείνου എന്നതിന്റെ ലിംഗാവിഷ്കാരം
  choice: ആ മനുഷ്യന്റെ
  alternative: ആ വ്യക്തിയുടെ
  rationale: ഉദാഹരണം ഏകവചനത്തിലും വ്യാകരണപരമായി പുല്ലിംഗത്തിലും വരുന്നതിനാൽ ‘മനുഷ്യൻ’ എന്ന രൂപം നിലനിർത്തുന്നു; ഇത് മലയാളത്തിൽ മനുഷ്യവ്യക്തിയെയും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- issue: κατοικεῖ എന്ന ഏകവചനരൂപവും ബഹുവചന കർത്താവും
  choice: അവ ... പാർക്കുന്നു
  alternative: അത് ... പാർക്കുന്നു
  rationale: SBLGNT-യിലെ ഏകവചന ക്രിയാരൂപം പാഠപരമായ അസാധാരണത സൃഷ്ടിക്കുന്നുവെങ്കിലും പ്രവേശിക്കുന്ന ഏഴ് ആത്മാക്കളെയാണ് സന്ദർഭം കർത്താവായി മുന്നോട്ടുവയ്ക്കുന്നത്. മുഖ്യപാഠം അർഥസംബന്ധമായ ബഹുവചനത്തിൽ നൽകുന്നു; വ്യാകരണരൂപം കുറിപ്പിൽ പരാമർശിക്കേണ്ടതില്ലെന്ന് തീരുമാനിച്ചു, കാരണം അത് സാധാരണ വായനക്കാരന് അനാവശ്യമായ പാഠസങ്കീർണ്ണത സൃഷ്ടിക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി. ‘പാർക്കുന്നു’ താമസമാക്കുന്ന അർഥം നൽകുന്നു; ‘ദുഷ്ടതലമുറ’ മൂലത്തിലെ ആവർത്തിക്കുന്ന πονηρός പദസംബന്ധം നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
