  terminology: ‘ആത്മാക്കൾ’ appropriately retains the source's general πνεύματα terminology in its demonic context, without importing a narrower term. ‘ദുഷ്ടർ/ദുഷ്ട’ accurately renders πονηρότερος/πονηρά. ‘ആ മനുഷ്യൻ’ correctly reflects the masculine singular illustrative referent.
