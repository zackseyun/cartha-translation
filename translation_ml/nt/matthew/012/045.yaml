    rationale: τὰ ἔσχατα ... τῶν πρώτων is literally ‘the last things ... than the first things.’ The footnote’s singular ‘ആദ്യത്തേതിനേക്കാൾ’ is better revised to preserve the plural idiomatic contrast while explaining its sense.
