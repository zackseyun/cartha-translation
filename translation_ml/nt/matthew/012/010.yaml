  terminology: “ഇതാ,” “ശബ്ബത്തുനാളുകളിൽ,” and “നിയമാനുസൃതമാണോ?” appropriately preserve the discourse marker, plural Sabbath expression, and legal-religious question. “സൗഖ്യമാക്കുന്നത്” is suitable in this healing context. The footnote appropriately explains the Greek plural without erasing it from the main text.
  issues:
