    rationale: “അവിടെ” is not represented in the Greek text. Removing it maintains closer source fidelity without affecting natural Malayalam.
  - severity: medium
    issue: Purpose clause is not optimally idiomatic
    rationale: “അവനെ കുറ്റം ആരോപിക്കേണ്ടതിന്” can imply that accusing him was required. “അവനെ കുറ്റം ചുമത്താൻവേണ്ടി” naturally expresses the purpose force of ἵνα κατηγορήσωσιν αὐτοῦ.
  - severity: low
