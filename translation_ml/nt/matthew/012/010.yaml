  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ⸀ἄνθρωπος χεῖρα ἔχων ξηράν. καὶ ἐπηρώτησαν αὐτὸν λέγοντες· Εἰ ἔξεστι τοῖς σάββασιν ⸀θεραπεύειν; ἵνα κατηγορήσωσιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/010.yaml
  text: And behold[a], there was a man with a withered hand. And they asked him, saying, “Is it lawful to heal on the Sabbaths?” so that they might accuse him.
translation:
  language: ml
  text: ഇതാ, ഒരു കൈ ശോഷിച്ചുപോയ മനുഷ്യൻ ഉണ്ടായിരുന്നു. അവനെ കുറ്റം ചുമത്താൻവേണ്ടി അവർ അവനോട്, “ശബ്ബത്തുനാളുകളിൽ[a] സൗഖ്യമാക്കുന്നത് നിയമാനുസൃതമാണോ?” എന്നു ചോദിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, മലയാളത്തിലെ കൂടുതൽ പതിവായ പ്രയോഗത്തിൽ, “ശബ്ബത്തുനാളിൽ.” ഗ്രീക്കിൽ “ശബ്ബത്തുനാളുകളിൽ” എന്ന ബഹുവചനമാണ്; ശബ്ബത്തുദിവസങ്ങളെ പൊതുവായി സൂചിപ്പിക്കാൻ ഇങ്ങനെ പറയുന്നത് പതിവായിരുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: രംഗത്തിലേക്ക് വായനക്കാരന്റെ ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗ്രീക്ക് വ്യവഹാരചിഹ്നത്തിന്റെ ശക്തി സ്വാഭാവികവും അന്തസ്സുറ്റതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἄνθρωπος
  choice: ഒരു മനുഷ്യൻ
  rationale: ഇവിടെ ഒരു പുരുഷവ്യക്തിയെയാണ് ഏകവചന നാമം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഒരു മനുഷ്യൻ’ എന്നു നൽകുന്നു.
- source_word: χεῖρα ἔχων ξηράν
  choice: കൈ ശോഷിച്ചുപോയ
  rationale: ξηράν സൂചിപ്പിക്കുന്ന ഉണങ്ങി ക്ഷയിച്ച അഥവാ പ്രവർത്തനശേഷി നഷ്ടപ്പെട്ട അവസ്ഥയെ ‘ശോഷിച്ചുപോയ’ എന്നു നൽകുന്നു; രോഗാവസ്ഥയെ അതിലധികം നിർവചിക്കുന്നില്ല.
- source_word: ἐπηρώτησαν αὐτὸν λέγοντες
  choice: അവർ അവനോട് … എന്നു ചോദിച്ചു
  rationale: ഗ്രീക്കിലെ മുഖ്യക്രിയയും അനുബന്ധ കൃദന്തരൂപവും മലയാളത്തിൽ സ്വാഭാവികമായ ഉദ്ധരണിഘടനയായി അവതരിപ്പിക്കുന്നു; ശത്രുതാഭാവം ക്രിയയിൽ കൃത്രിമമായി ചേർക്കുന്നില്ല.
- source_word: ἔξεστι
  choice: നിയമാനുസൃതമാണോ
  rationale: ശബ്ബത്താചരണത്തെക്കുറിച്ചുള്ള നിയമപരവും മതപരവുമായ അനുവദനീയതയാണ് ചോദ്യം; വെറും പൊതുവായ അനുമതിയല്ല.
- source_word: τοῖς σάββασιν
  choice: ശബ്ബത്തുനാളുകളിൽ
  rationale: ഗ്രീക്കിലെ ബഹുവചനം മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു; ഇത് ശബ്ബത്തുദിവസങ്ങളെ പൊതുവായി പരാമർശിക്കുന്ന പതിവുപ്രയോഗമാണ്.
- source_word: θεραπεύειν
  choice: സൗഖ്യമാക്കുന്നത്
  rationale: സുവിശേഷങ്ങളിലെ രോഗശാന്തിസന്ദർഭത്തിന് യോജിച്ച, സാധാരണ മലയാളവായനക്കാർക്ക് വ്യക്തമായ പ്രയോഗം.
- source_word: ἵνα κατηγορήσωσιν αὐτοῦ
  choice: അവനെ കുറ്റം ആരോപിക്കേണ്ടതിന്
  rationale: ἵνα ഇവിടെ അവരുടെ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു; κατηγορέω എന്നതിന്റെ കുറ്റാരോപണപരമായ അർഥവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ശബ്ബത്തിനെക്കുറിച്ചുള്ള നിയമവിവാദത്തിൽ τοῖς σάββασιν എന്ന ബഹുവചനത്തിന്റെ പരിഭാഷ
  choice: ശബ്ബത്തുനാളുകളിൽ
  alternative: ശബ്ബത്തുനാളിൽ
  rationale: മൂലപാഠത്തിലെ ദത്തിവ് ബഹുവചനം മുഖ്യവാചകത്തിൽ സുതാര്യമായി നിലനിർത്തി. ഏകവചനം മലയാളത്തിൽ കൂടുതൽ പതിവായ പൊതുപ്രയോഗമാകാമെന്നതിനാൽ അതിനെ അടിക്കുറിപ്പിൽ നൽകുന്നു; അങ്ങനെ സംഖ്യ നിശ്ശബ്ദമായി സാധാരണവൽക്കരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും അന്തസ്സുറ്റതുമായ വിവരണശൈലി സ്വീകരിച്ചു. ‘ഇതാ’ എന്ന ശ്രദ്ധാകർഷക പ്രയോഗവും ശബ്ബത്തിന്റെ ബഹുവചനവും മൂലപാഠസുതാര്യതയ്ക്കായി നിലനിർത്തി; ഗ്രീക്ക് വാക്യക്രമം മലയാളത്തിൽ കൃത്രിമമാകാതിരിക്കാൻ ഉദ്ധരണിഘടന സ്വാഭാവികമാക്കി.
