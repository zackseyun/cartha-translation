id: MAT.12.40
reference: Matthew 12:40
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἦν Ἰωνᾶς ἐν τῇ κοιλίᾳ τοῦ κήτους τρεῖς ἡμέρας καὶ τρεῖς νύκτας, οὕτως ἔσται ὁ υἱὸς τοῦ ἀνθρώπου ἐν τῇ καρδίᾳ τῆς γῆς τρεῖς ἡμέρας καὶ τρεῖς νύκτας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/040.yaml
  text: For just as Jonah was in the belly of the sea creature three days and three nights[c][b][a], so the Son of Man will be in the heart of the earth three days and three nights.
translation:
  language: ml
  text: കാരണം, യോനാ മൂന്നു പകലും മൂന്നു രാത്രിയും[a] കടൽജീവിയുടെ വയറ്റിൽ[b] ആയിരുന്നതുപോലെ, മനുഷ്യപുത്രനും അതുപോലെ മൂന്നു പകലും മൂന്നു രാത്രിയും ഭൂമിയുടെ ഹൃദയത്തിൽ[c] ആയിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മൂന്നു പകലും മൂന്നു രാത്രിയും’ എന്നത് മൂന്നു ദിവസങ്ങളുടെ ഭാഗങ്ങളും ഉൾക്കൊള്ളുന്ന പ്രയോഗമായി ചിലർ മനസ്സിലാക്കുന്നു; മറ്റുചിലർ അതിനെ കൂടുതൽ കൃത്യമായ കാലദൈർഘ്യമായി കാണുന്നു.
    reason: alternative_reading
  - marker: b
    text: ‘കടൽജീവി’ എന്നതിനുള്ള ഗ്രീക്ക് പദം വലിയൊരു സമുദ്രജീവിയെ സൂചിപ്പിക്കുന്നു; ‘വലിയ മത്സ്യം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: ‘ഭൂമിയുടെ ഹൃദയത്തിൽ’ എന്നത് അടക്കം ചെയ്യപ്പെടൽ, കല്ലറ, ഭൂമിയുടെ ആഴങ്ങൾ, അല്ലെങ്കിൽ മരിച്ചവരുടെ മണ്ഡലം എന്നിവയെ സൂചിപ്പിക്കാം; മുഖ്യവാചകത്തിൽ ഗ്രീക്കിലെ രൂപകം നിലനിർത്തിയിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: ആയിരുന്നതുപോലെതന്നെ
  rationale: ὥσπερ എന്നതിന്റെ താരതമ്യബലം സ്വാഭാവികമായി നൽകുന്നു. മുൻസന്ദർഭത്തോടുള്ള γάρ-ന്റെ വിശദീകരണബന്ധം മലയാള വാക്യഘടനയിൽ പ്രത്യേക പദം ചേർക്കാതെ താരതമ്യനിർമ്മിതിയിലൂടെ വ്യക്തമാകുന്നു.
- source_word: Ἰωνᾶς
  choice: യോനാ
  rationale: മലയാള ബൈബിൾപാരമ്പര്യത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: ἐν τῇ κοιλίᾳ
  choice: വയറ്റിൽ
  rationale: κοιλία എന്ന പദത്തിന്റെ സാധാരണ അർഥമായ വയർ ഉദാത്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: τοῦ κήτους
  choice: കടൽജീവിയുടെ
  rationale: κῆτος വലിയൊരു കടൽജീവിയെ സൂചിപ്പിക്കുന്നു; ഒരു നിർദിഷ്ട ജീവിവർഗമായി ചുരുക്കാതെ ഗ്രീക്കിലെ വിശാലത നിലനിർത്തുന്നു.
- source_word: τρεῖς ἡμέρας καὶ τρεῖς νύκτας
  choice: മൂന്നു പകലും മൂന്നു രാത്രിയും
  rationale: കാലപ്രയോഗം വ്യാഖ്യാനിച്ച് മാറ്റാതെ നേരിട്ട് സംരക്ഷിക്കുന്നു; ἡμέρας-ന് രാത്രിയോടു ചേർന്ന സന്ദർഭത്തിൽ ‘പകൽ’ എന്നത് സ്വാഭാവികമാണ്.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: യേശുവിന്റെ സ്വയംവിശേഷണത്തിന്റെ തിരുവെഴുത്തുപരമായ അനുരണനം നിലനിർത്തുന്ന അംഗീകൃത മലയാളരൂപം.
- source_word: ἔσται
  choice: ആയിരിക്കും
  rationale: εἰμί-യുടെ ഭാവികാലത്തെ നേരിട്ട് നൽകുന്നു; ‘തങ്ങും’ പോലുള്ള അധിക ദൈർഘ്യസൂചന ചേർക്കുന്നില്ല.
- source_word: ἐν τῇ καρδίᾳ τῆς γῆς
  choice: ഭൂമിയുടെ ഹൃദയത്തിൽ
  rationale: καρδία എന്ന മൂലരൂപകം നിലനിർത്തുകയും അതിന്റെ വ്യാഖ്യാനസാധ്യതകൾ മുഖ്യവാചകത്തിൽ ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘ഭൂമിയുടെ ഹൃദയം’ എന്നതിന്റെ അർഥം
  choice: രൂപകത്തെ ‘ഭൂമിയുടെ ഹൃദയത്തിൽ’ എന്നു നിലനിർത്തി.
  alternative: കല്ലറയിൽ; ഭൂമിയുടെ ആഴങ്ങളിൽ; മരിച്ചവരുടെ മണ്ഡലത്തിൽ
  rationale: ഗ്രീക്ക് പ്രയോഗം ശവസംസ്കാരം, കല്ലറ, ഭൂമിയുടെ ആഴം, മരിച്ചവരുടെ മണ്ഡലം എന്നിവയിൽ ഒന്നിനെ മാത്രം നിർബന്ധിക്കുന്നില്ല; അതിനാൽ വ്യാഖ്യാനതർക്കം മുഖ്യവാചകത്തിൽ തീർപ്പാക്കിയിട്ടില്ല.
- issue: ‘മൂന്നു പകലും മൂന്നു രാത്രിയും’ എന്ന കാലപ്രയോഗത്തിന്റെ വ്യാപ്തി
  choice: പ്രയോഗം അതേപടി നിലനിർത്തി.
  alternative: മൂന്നു ദിവസങ്ങളുടെ ഭാഗങ്ങൾ ഉൾപ്പെടുന്ന യഹൂദപ്രയോഗം; കൃത്യമായ എഴുപത്തിരണ്ടു മണിക്കൂർ
  rationale: വാക്യം വ്യക്തമായി ഉപയോഗിക്കുന്ന കാലപ്രയോഗം പരിഭാഷയിൽ സംരക്ഷിച്ചു; അതിന്റെ കാലക്രമവ്യാഖ്യാനം അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ താരതമ്യഘടനയും ആവർത്തിച്ച കാലപ്രയോഗവും രൂപകവും സംരക്ഷിച്ചുകൊണ്ട് സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്ന പദങ്ങൾ തിരഞ്ഞെടുത്തു.
