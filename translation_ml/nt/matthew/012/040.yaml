review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves Jonah, the broad sense of κῆτος as ‘sea creature,’ the repeated ‘three days and three nights,’ the Son of Man title, and the metaphor ‘heart of the earth.’ However, γάρ (‘for/because’) is not represented, and the correlative comparison is clearer when Malayalam marks both sides (‘just as … so/likewise …’).
  naturalness: The wording is generally modern, clear Malayalam. Adding ‘കാരണം’ and ‘അതുപോലെ’ makes the logical comparison more natural and complete. In footnote c, ‘സംസ്കാരം’ ordinarily means ‘culture’; ‘അടക്കം ചെയ്യപ്പെടൽ’ accurately expresses burial in this context.
  terminology: ‘യോനാ,’ ‘കടൽജീവി,’ ‘മനുഷ്യപുത്രൻ,’ and ‘ഭൂമിയുടെ ഹൃദയത്തിൽ’ are suitable. The main text appropriately avoids deciding the debated referent of ‘the heart of the earth.’
  issues:
  - severity: medium
    issue: The explanatory connector γάρ is omitted.
    rationale: ὥσπερ γὰρ introduces the comparison with an explanatory ‘for/because.’ Malayalam can represent this naturally with ‘കാരണം.’
  - severity: low
    issue: The comparison’s second member is not explicitly marked.
    rationale: Adding ‘അതുപോലെ’ renders οὕτως and gives the Malayalam sentence the source’s ‘just as … so …’ balance.
  - severity: medium
    issue: Footnote c uses ‘സംസ്കാരം’ for burial.
    rationale: In modern Malayalam, ‘സംസ്കാരം’ normally denotes culture, not burial. ‘അടക്കം ചെയ്യപ്പെടൽ’ conveys the intended alternative without altering the main text.
  revised_text: കാരണം, യോനാ മൂന്നു പകലും മൂന്നു രാത്രിയും[a] കടൽജീവിയുടെ വയറ്റിൽ[b] ആയിരുന്നതുപോലെ, മനുഷ്യപുത്രനും അതുപോലെ മൂന്നു പകലും മൂന്നു രാത്രിയും ഭൂമിയുടെ ഹൃദയത്തിൽ[c] ആയിരിക്കും.
