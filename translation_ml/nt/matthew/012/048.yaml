id: MAT.12.48
reference: Matthew 12:48
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν τῷ ⸀λέγοντι αὐτῷ· Τίς ἐστιν ἡ μήτηρ μου, καὶ τίνες εἰσὶν οἱ ἀδελφοί μου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/048.yaml
  text: But he answered the one speaking to him[a], “Who is my mother, and who are my brothers?”
translation:
  language: ml
  text: 'എന്നാൽ തന്നോടു സംസാരിച്ചുകൊണ്ടിരുന്നവനോട് അദ്ദേഹം മറുപടി പറഞ്ഞു[a]: “എന്റെ അമ്മ ആരാണ്? എന്റെ സഹോദരന്മാർ ആരാണ്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “എന്നാൽ തന്നോടു സംസാരിച്ചുകൊണ്ടിരുന്നവനോട് അദ്ദേഹം മറുപടി പറഞ്ഞ് പറഞ്ഞു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: എന്നാൽ ... അദ്ദേഹം മറുപടി പറഞ്ഞു
  rationale: ἀποκριθεὶς εἶπεν എന്നത് ‘മറുപടി പറഞ്ഞുകൊണ്ട് പറഞ്ഞു’ എന്ന അർഥമുള്ള സെമിറ്റിക് സ്വാധീനമുള്ള ഗ്രീക്ക് പ്രയോഗമാണ്. സ്വാഭാവിക മലയാളത്തിൽ ‘മറുപടി പറഞ്ഞു’ അതിന്റെ അർഥം പൂർണമായി നൽകുന്നു; δέ സൂചിപ്പിക്കുന്ന സംഭാഷണത്തിലെ തിരിവ് ‘എന്നാൽ’കൊണ്ട് നിലനിർത്തുന്നു.
- source_word: τῷ λέγοντι αὐτῷ
  choice: തന്നോടു സംസാരിച്ചുകൊണ്ടിരുന്നവനോട്
  rationale: വർത്തമാനകാല കൃദന്തരൂപമായ λέγοντι, യേശുവിനെ അഭിസംബോധന ചെയ്തുകൊണ്ടിരുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. ‘സംസാരിച്ചുകൊണ്ടിരുന്നവൻ’ പ്രവൃത്തിയുടെ തുടർച്ച നിലനിർത്തുന്നു; αὐτῷ ഇവിടെ ‘തന്നോട്’ എന്നു സ്വാഭാവികമായി നൽകുന്നു.
- source_word: Τίς ἐστιν ἡ μήτηρ μου
  choice: എന്റെ അമ്മ ആരാണ്?
  rationale: തിരിച്ചറിയൽ ചോദിക്കുന്ന Τίς എന്ന സർവനാമവും μήτηρ μου എന്ന ബന്ധപദവും ലളിതവും നേരിട്ടുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: καὶ τίνες εἰσὶν οἱ ἀδελφοί μου
  choice: എന്റെ സഹോദരന്മാർ ആരാണ്?
  rationale: ബഹുവചനമായ τίνες ആദ്യ ചോദ്യത്തോട് സമാന്തരമായി ‘ആരാണ്’ എന്നു സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തുന്നു. ἀδελφοί വ്യാകരണപരമായി പുല്ലിംഗ ബഹുവചനവും ഈ സന്ദർഭത്തിൽ കുടുംബത്തിലെ സഹോദരന്മാരെ സൂചിപ്പിക്കുന്നതുമായതിനാൽ ‘സഹോദരന്മാർ’ എന്നു നൽകുന്നു.
theological_decisions:
- issue: കുടുംബബന്ധത്തിന്റെ തിരിച്ചറിയലിനെക്കുറിച്ചുള്ള യേശുവിന്റെ ആലങ്കാരിക ചോദ്യത്തെ വ്യാഖ്യാനിച്ചു മൃദൂകരിക്കാനുള്ള സാധ്യത
  choice: വിശദീകരണം ചേർക്കാതെ ചോദ്യങ്ങൾ നേരിട്ടുതന്നെ നിലനിർത്തി
  alternative: “ആരാണ് യഥാർഥത്തിൽ എന്റെ അമ്മയായി കണക്കാക്കപ്പെടുന്നത്? ആരാണ് എന്റെ സഹോദരന്മാരായി കണക്കാക്കപ്പെടുന്നത്?”
  rationale: തുടർന്നുള്ള വാക്യങ്ങൾ ബന്ധത്തിന്റെ അർഥം വികസിപ്പിക്കുന്നുണ്ടെങ്കിലും ആ വിശദീകരണം ഈ വാക്യത്തിലേക്ക് മുൻകൂട്ടി ചേർക്കാതിരിക്കുന്നത് ആഖ്യാനപരവും ദൈവശാസ്ത്രപരവുമായ പിരിമുറുക്കം സംരക്ഷിക്കുന്നു.
- issue: ἀδελφοί എന്ന പദത്തിന്റെ ലിംഗസൂചന
  choice: സഹോദരന്മാർ
  alternative: സഹോദരീസഹോദരന്മാർ; കൂടപ്പിറപ്പുകൾ
  rationale: ഇവിടത്തെ അടിയന്തര പരാമർശം യേശുവിന്റെ കുടുംബത്തിലെ പുരുഷ സഹോദരന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ മൂലപാഠത്തിലെ പുല്ലിംഗ ബന്ധപദത്തെ വിപുലീകരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അദ്ദേഹം’ യേശുവിനെ മാന്യമായി സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിലെ ആവർത്തനസ്വഭാവമുള്ള മറുപടി-പറയൽ പ്രയോഗം മുഖ്യപാഠത്തിൽ സ്വാഭാവികമാക്കി, കൂടുതൽ ഔപചാരികമായ രൂപം അടിക്കുറിപ്പിൽ നൽകി. എല്ലാ ചോദ്യങ്ങളും വ്യാഖ്യാനവികാസമില്ലാതെ നേരിട്ട് നിലനിർത്തിയിരിക്കുന്നു.
