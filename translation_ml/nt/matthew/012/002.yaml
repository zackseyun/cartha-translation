    reason: ‘അനുവാദമില്ലാത്തത്’ directly reflects the permissive force of ἔξεστιν; the alternative preserves the legal-register nuance of ‘not lawful’ without specifying which legal authority is in view.
  revision_rationale: The revision removes the unexpressed noun ‘law’ while retaining the accusation’s legal-permissive force and the Greek repetition ‘doing ... to do’ as naturally as Malayalam permits. A correctly placed footnote records the lawful/legal alternative and avoids importing an interpretation about whether the objection concerns biblical law or tradition.
