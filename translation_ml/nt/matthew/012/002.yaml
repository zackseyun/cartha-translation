revisions:
- from: 'എന്നാൽ പരീശന്മാർ അതു കണ്ടപ്പോൾ അവനോടു പറഞ്ഞു: “നോക്കൂ, ശബ്ബത്തിൽ ചെയ്യാൻ നിയമം അനുവദിക്കാത്തതാണ് നിന്റെ ശിഷ്യന്മാർ ചെയ്യുന്നത്.”'
  to: 'എന്നാൽ പരീശന്മാർ അതു കണ്ടപ്പോൾ അവനോടു പറഞ്ഞു: “നോക്കൂ, ശബ്ബത്തിൽ ചെയ്യാൻ അനുവാദമില്ലാത്തതാണ്[a] നിന്റെ ശിഷ്യന്മാർ ചെയ്യുന്നത്.”'
  rationale: The revision removes the unexpressed noun ‘law’ while retaining the accusation’s legal-permissive force and the Greek repetition ‘doing ... to do’ as naturally as Malayalam permits. A correctly placed footnote records the lawful/legal alternative and avoids importing an interpretation about whether the objection concerns biblical law or tradition.
