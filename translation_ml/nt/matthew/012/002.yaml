id: MAT.12.2
reference: Matthew 12:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι ἰδόντες εἶπαν αὐτῷ· Ἰδοὺ οἱ μαθηταί σου ποιοῦσιν ὃ οὐκ ἔξεστιν ποιεῖν ἐν σαββάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/002.yaml
  text: But when the Pharisees saw it[a], they said to him, “Look, your disciples are doing what is not lawful to do on the Sabbath.”
translation:
  language: ml
  text: 'എന്നാൽ പരീശന്മാർ അതു കണ്ടപ്പോൾ അവനോടു പറഞ്ഞു: “നോക്കൂ, ശബ്ബത്തിൽ ചെയ്യാൻ അനുവാദമില്ലാത്തതാണ്[a] നിന്റെ ശിഷ്യന്മാർ ചെയ്യുന്നത്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ശബ്ബത്തിൽ ചെയ്യാൻ നിയമാനുസൃതമല്ലാത്തത്.”
    reason: ‘അനുവാദമില്ലാത്തത്’ directly reflects the permissive force of ἔξεστιν; the alternative preserves the legal-register nuance of ‘not lawful’ without specifying which legal authority is in view.
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവിവരണത്തോടുള്ള വിരോധാത്മകമായ വഴിത്തിരിവ് സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἰδόντες
  choice: അതു കണ്ടപ്പോൾ
  rationale: ഏറിസ്റ്റ് പാർട്ടിസിപ്പിളിനെ കാലസൂചകമായി പരിഭാഷപ്പെടുത്തി; സന്ദർഭത്തിൽ സൂചിതമായ ശിഷ്യന്മാരുടെ പ്രവൃത്തിയെ ‘അതു’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: εἶπαν αὐτῷ
  choice: അവനോടു പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ സാധാരണ സംഭാഷണസൂത്രം നേരിട്ടും നിഷ്പക്ഷമായും നിലനിർത്തുന്നു.
- source_word: Ἰδοὺ
  choice: നോക്കൂ
  rationale: ആരോപണത്തിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന ശക്തി പഴഞ്ചനായ ഭാഷയില്ലാതെ പ്രകടമാക്കുന്നു.
- source_word: μαθηταί
  choice: ശിഷ്യന്മാർ
  rationale: ഗുരു-ശിഷ്യബന്ധം സംരക്ഷിക്കുന്ന, സുവിശേഷസന്ദർഭത്തിൽ സ്ഥാപിതമായ മലയാള പദമാണ്.
- source_word: ποιοῦσιν ... ποιεῖν
  choice: ചെയ്യുന്നത് ... ചെയ്യാൻ
  rationale: ποιέω എന്ന ക്രിയയുടെ ആവർത്തനം കഴിയുന്നത്ര സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ὃ οὐκ ἔξεστιν
  choice: നിയമം അനുവദിക്കാത്തതാണ്
  rationale: ἔξεστιν എന്നതിന്റെ നിയമപരമായ അനുമതി/അവകാശം എന്ന അർഥം വ്യക്തമാക്കുന്നു; ഏത് നിയമസ്രോതസ്സാണെന്നു വാക്യം നിർണ്ണയിക്കുന്നില്ല.
- source_word: ἐν σαββάτῳ
  choice: ശബ്ബത്തിൽ
  rationale: ശബ്ബത്ത് ആചരണത്തിന്റെ കാലസന്ദർഭം സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
theological_decisions:
- issue: പരീശന്മാരുടെ എതിർപ്പിന്റെ സ്വഭാവം
  choice: ‘നിയമം അനുവദിക്കാത്തത്’ എന്ന നിയമപരവും അനുമതിസംബന്ധവുമായ ഭാഷ ഉപയോഗിച്ചു.
  alternative: ‘അനുവദനീയമല്ലാത്തത്’ / ‘നിയമവിരുദ്ധമായത്’
  rationale: ആരോപണത്തിന്റെ അടിസ്ഥാനം തിരുവെഴുത്തിലെ നിയമമാണോ പരീശപാരമ്പര്യമാണോ എന്നു വാക്യം തന്നെ തീർപ്പാക്കുന്നില്ല; ആ വ്യാഖ്യാനപരവും ദൈവശാസ്ത്രപരവുമായ സംഘർഷം പരിഭാഷയിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. ‘നോക്കൂ’ ആരോപണത്തിന്റെ നേരിട്ടുള്ള ശക്തി നിലനിർത്തുന്നു; ‘നിയമം അനുവദിക്കാത്തത്’ നിയമപരമായ ഭാവം സംരക്ഷിക്കുമ്പോൾ നിയമത്തിന്റെ ഉറവിടം നിർവചിക്കുന്നില്ല.
