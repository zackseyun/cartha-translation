id: MAT.12.27
reference: Matthew 12:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἰ ἐγὼ ἐν Βεελζεβοὺλ ἐκβάλλω τὰ δαιμόνια, οἱ υἱοὶ ὑμῶν ἐν τίνι ἐκβάλλουσιν; διὰ τοῦτο αὐτοὶ ⸂κριταὶ ἔσονται ὑμῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/027.yaml
  text: And if I cast out demons by Beelzebul[a], by whom do your sons cast them out? Therefore they will be your judges.
translation:
  language: ml
  text: ഞാൻ ബെയെൽസെബൂലിനെക്കൊണ്ടാണ്[a] ഭൂതങ്ങളെ പുറത്താക്കുന്നതെങ്കിൽ, നിങ്ങളുടെ പുത്രന്മാർ ആരെക്കൊണ്ടാണ് അവയെ പുറത്താക്കുന്നത്? അതുകൊണ്ട് അവർതന്നെ നിങ്ങളുടെ ന്യായാധിപന്മാരായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഗ്രീക്ക്: ‘ബെയെൽസെബൂൽ’; ചില വിവർത്തനങ്ങളിൽ ‘ബെയെൽസെബൂബ്’ എന്നു കാണുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν Βεελζεβοὺλ
  choice: ബെയെൽസെബൂലിനെക്കൊണ്ട്
  rationale: ഈ കുറ്റാരോപണസന്ദർഭത്തിൽ ἐν ഉപകരണം/പ്രവർത്തകശക്തി സൂചിപ്പിക്കുന്നു. അതിനാൽ ‘ബെയെൽസെബൂലിൽ’ എന്ന അക്ഷരാർഥത്തേക്കാൾ ‘ബെയെൽസെബൂലിനെക്കൊണ്ട്’ മലയാളത്തിൽ സ്വാഭാവികമായി ആ അർഥം നൽകുന്നു.
- source_word: ἐκβάλλω τὰ δαιμόνια
  choice: ഭൂതങ്ങളെ പുറത്താക്കുന്നു
  rationale: ἐκβάλλω ഇവിടെ ബലമായി പുറത്താക്കുക എന്ന ഭൂതോച്ചാടനസന്ദർഭത്തിലെ അർഥത്തിലാണ്; ‘പുറത്താക്കുന്നു’ വ്യക്തവും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവുമാണ്. δαιμόνια എന്നതിന് പൊതുവായി മനസ്സിലാകുന്ന ‘ഭൂതങ്ങൾ’ ഉപയോഗിച്ചു.
- source_word: οἱ υἱοὶ ὑμῶν
  choice: നിങ്ങളുടെ പുത്രന്മാർ
  rationale: ഗ്രീക്കിലെ ബന്ധപദമായ υἱοί നേരിട്ട് നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ ഇത് ശ്രോതാക്കളുടെ കൂട്ടത്തിലെ ആളുകളെയോ ശിഷ്യന്മാരെയോ സൂചിപ്പിക്കാമെങ്കിലും, ‘ആളുകൾ’ അല്ലെങ്കിൽ ‘അനുയായികൾ’ എന്നു വ്യാഖ്യാനിച്ച് അവ്യക്തത നീക്കിയിട്ടില്ല.
- source_word: ἐν τίνι
  choice: ആരെക്കൊണ്ട്
  rationale: ആദ്യത്തെ ἐν പോലെ ഇതും പ്രവർത്തകശക്തി/മാർഗം സൂചിപ്പിക്കുന്നു. വ്യക്തിപരമായ ശക്തിയോടുള്ള താരതമ്യം ആയതിനാൽ ‘ആരെക്കൊണ്ട്’ യോജിക്കുന്നു.
- source_word: διὰ τοῦτο
  choice: അതുകൊണ്ട്
  rationale: മുൻപുള്ള ആലങ്കാരിക ചോദ്യത്തിൽനിന്നുള്ള നിഗമനം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: κριταὶ ἔσονται ὑμῶν
  choice: അവർതന്നെ നിങ്ങളുടെ ന്യായാധിപന്മാരായിരിക്കും
  rationale: ഭാവികാലവും predicate noun ആയ κριταί എന്ന ഘടനയും സംരക്ഷിക്കുന്നു. αὐτοί എന്നതിന്റെ ഊന്നൽ ‘അവർതന്നെ’ എന്നതിലൂടെ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: Βεελζεβούλ എന്ന പേരിന്റെ രൂപവും തിരിച്ചറിയലും
  choice: ബെയെൽസെബൂൽ
  alternative: ബെയെൽസെബൂബ്
  rationale: നൽകിയിരിക്കുന്ന SBLGNT ഗ്രീക്ക് രൂപമായ Βεελζεβούλ ലിപ്യന്തരണം ചെയ്യുന്നു; പരിചിതമായ മറ്റൊരു പരമ്പരാഗത രൂപത്തിലേക്ക് ഒത്തുചേർക്കുന്നില്ല.
- issue: ‘നിങ്ങളുടെ പുത്രന്മാർ’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: ബന്ധപദം അതേപടി നിലനിർത്തുക
  alternative: ‘നിങ്ങളുടെ ആളുകൾ’ അല്ലെങ്കിൽ ‘നിങ്ങളുടെ ശിഷ്യന്മാർ’ എന്നു വ്യക്തമാക്കുക
  rationale: ഇത് ശ്രോതാക്കളുടെ സമൂഹാംഗങ്ങളെയോ ശിഷ്യന്മാരെയോ സൂചിപ്പിക്കാം; എന്നാൽ മൂലപാഠം കൃത്യമായി തിരിച്ചറിയിക്കുന്നില്ല. അതിനാൽ വ്യാഖ്യാനപരമായ തീർപ്പ് വിവർത്തനത്തിലേക്ക് കൊണ്ടുവന്നിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘പുത്രന്മാർ’, ‘ന്യായാധിപന്മാർ’ എന്നീ പദങ്ങൾ മൂലത്തിലെ ആലങ്കാരിക ബന്ധവും നാമഘടനയും സംരക്ഷിക്കാൻ ഉപയോഗിച്ചു; കർത്താവിന്റെ വാദത്തിലെ ഊന്നലിന് ‘അവർതന്നെ’ ചേർത്തു.
