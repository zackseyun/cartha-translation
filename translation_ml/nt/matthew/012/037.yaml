id: MAT.12.37
reference: Matthew 12:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐκ γὰρ τῶν λόγων σου δικαιωθήσῃ, καὶ ἐκ τῶν λόγων σου καταδικασθήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/037.yaml
  text: For by your words you will be justified[a], and by your words you will be condemned.
translation:
  language: ml
  text: എന്തെന്നാൽ, നിന്റെ വാക്കുകളുടെ അടിസ്ഥാനത്തിൽ നീ നീതിമാനെന്നു വിധിക്കപ്പെടും[a]; നിന്റെ വാക്കുകളുടെ അടിസ്ഥാനത്തിൽ നീ കുറ്റക്കാരനെന്നു വിധിക്കപ്പെടുകയും ചെയ്യും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘നീതീകരിക്കപ്പെടും,’ ‘കുറ്റവിമുക്തനാക്കപ്പെടും,’ അല്ലെങ്കിൽ ‘ശരിയെന്നു തെളിയിക്കപ്പെടും.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് ഒരാൾ ശരിയായവനാണെന്ന് ന്യായവിധിയിൽ പ്രഖ്യാപിക്കപ്പെടുക എന്ന അർഥം വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ
  choice: അടിസ്ഥാനത്തിൽ
  rationale: ജനിറ്റീവിനോടുകൂടിയ ἐκ ഇവിടെ വിധിയുടെ അടിസ്ഥാനമോ തെളിവോ സൂചിപ്പിക്കുന്നു. ‘വാക്കുകളാൽ’ എന്നതിനെക്കാൾ ‘വാക്കുകളുടെ അടിസ്ഥാനത്തിൽ’ എന്നത് വാക്കുകളാണ് വിധിക്കുള്ള തെളിവ് എന്ന ന്യായവിധിപരമായ അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: γάρ
  choice: എന്തെന്നാൽ
  rationale: മുൻപുള്ള മുന്നറിയിപ്പിന്റെ കാരണമോ വിശദീകരണമോ അവതരിപ്പിക്കുന്ന ബന്ധകശക്തി നിലനിർത്തുന്നു.
- source_word: λόγων σου
  choice: നിന്റെ വാക്കുകൾ
  rationale: λόγος എന്ന പദത്തിന്റെ ബഹുവചനം ഇവിടെ ഒരാൾ പറഞ്ഞ ഉച്ചാരണങ്ങളെ സൂചിപ്പിക്കുന്നു; രണ്ടു ഉപവാക്യങ്ങളിലുമുള്ള ആവർത്തനവും സമാന്തരഘടനയും അതേപടി നിലനിർത്തുന്നു.
- source_word: δικαιωθήσῃ
  choice: നീ നീതിമാനെന്നു വിധിക്കപ്പെടും
  rationale: ഭാവികാല കർമണി രൂപത്തിന്റെയും καταδικασθήσῃ എന്ന വിരുദ്ധപദത്തിന്റെയും ന്യായവിധിപരമായ അർഥം സംരക്ഷിക്കുന്നു. ‘നീതീകരിക്കപ്പെടും’ എന്ന സാങ്കേതിക പ്രയോഗത്തേക്കാൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ‘ശരിയെന്നു പ്രഖ്യാപിക്കപ്പെടുക’ എന്ന ആശയം നൽകുന്നു.
- source_word: καταδικασθήσῃ
  choice: നീ കുറ്റക്കാരനെന്നു വിധിക്കപ്പെടും
  rationale: ഭാവികാല കർമണി രൂപവും കോടതിസംബന്ധമായ അർഥവും വ്യക്തമാക്കുകയും δικαιωθήσῃ-യോടുള്ള ഉദ്ദേശ്യപൂർവമായ വിരോധം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: വാക്കുകളും അന്തിമ ന്യായവിധിയും തമ്മിലുള്ള ബന്ധത്തിൽ δικαιόω എന്ന പദത്തിന്റെ ന്യായവിധിപരമായ അർഥം
  choice: ‘നീതിമാനെന്നു വിധിക്കപ്പെടും’ എന്നു നൽകി, ഒരാളുടെ വാക്കുകളെ അടിസ്ഥാനമാക്കിയുള്ള അനുകൂല വിധിപ്രഖ്യാപനമായി അവതരിപ്പിച്ചു.
  alternative: ‘നീതീകരിക്കപ്പെടും’, ‘കുറ്റവിമുക്തനാക്കപ്പെടും’, അല്ലെങ്കിൽ ‘ശരിയെന്നു തെളിയിക്കപ്പെടും’
  rationale: ‘കുറ്റക്കാരനെന്നു വിധിക്കപ്പെടും’ എന്ന സമാന്തരവിരുദ്ധ പ്രയോഗം കോടതിപരമായ പശ്ചാത്തലം വ്യക്തമാക്കുന്നു. വിവർത്തനം വാക്കുകൾ വിധിയുടെ അടിസ്ഥാനമോ തെളിവോ ആണെന്ന വാക്യത്തിന്റെ പ്രസ്താവന നിലനിർത്തുന്നു; എന്നാൽ നീതീകരണത്തെക്കുറിച്ചുള്ള വിശാലമായ ഒരു സിദ്ധാന്തം ഇതിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗ്രീക്കിലെ ആവർത്തനവും വിരുദ്ധസമാന്തരതയും നിലനിർത്തി; ന്യായവിധിപരമായ അർഥം വ്യക്തമാക്കാൻ ‘അടിസ്ഥാനത്തിൽ’ എന്നും ‘വിധിക്കപ്പെടും’ എന്നും ഉപയോഗിച്ചു.
