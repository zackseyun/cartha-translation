id: MAT.12.26
reference: Matthew 12:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἰ ὁ Σατανᾶς τὸν Σατανᾶν ἐκβάλλει, ἐφ’ ἑαυτὸν ἐμερίσθη· πῶς οὖν σταθήσεται ἡ βασιλεία αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/026.yaml
  text: And if Satan casts out Satan[a], he is divided against himself[c][b]. How then will his kingdom stand?
translation:
  language: ml
  text: സാത്താൻ സാത്താനെ പുറത്താക്കുന്നുവെങ്കിൽ, അവൻ തനിക്കുതന്നെ എതിരായി ഭിന്നിച്ചിരിക്കുന്നു.[a] അങ്ങനെയെങ്കിൽ അവന്റെ രാജ്യം എങ്ങനെ നിലനിൽക്കും?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവൻ തനിക്കുതന്നെ എതിരായി ഭിന്നിക്കപ്പെട്ടു.’
    reason: ἐμερίσθη എന്ന അയോറിസ്റ്റ് പാസീവിനെ സംഭവകേന്ദ്രിതമായി വിവർത്തനം ചെയ്യാനുള്ള സാധ്യത.
lexical_decisions:
- source_word: καὶ εἰ
  choice: എങ്കിൽ
  rationale: മുൻവാക്യത്തിലെ വാദത്തിന്റെ തുടർച്ച മലയാളത്തിലെ സന്ദർഭത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്ന വ്യവസ്ഥാസൂചക പ്രയോഗം; καί വേറിട്ട് ‘കൂടാതെ’ എന്നു ചേർക്കുന്നത് ഇവിടെ കൃത്രിമമാകും.
- source_word: ὁ Σατανᾶς / τὸν Σατανᾶν
  choice: സാത്താൻ
  rationale: Σατανᾶς എന്ന പേരിന്റെ മലയാളത്തിൽ സ്ഥാപിതമായ ലിപ്യന്തരണം.
- source_word: ἐκβάλλει
  choice: പുറത്താക്കുന്നു
  rationale: ദുരാത്മാക്കളെ പുറത്താക്കുന്ന സന്ദർഭത്തിലെ ἐκβάλλωയുടെ ശക്തി സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ἐφ’ ἑαυτὸν
  choice: തനിക്കുതന്നെ എതിരായി
  rationale: സ്വയം എതിർക്കുന്ന ആന്തരിക സംഘർഷം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം സ്വാഭാവികമായി പകർന്നു നൽകുന്നു.
- source_word: ἐμερίσθη
  choice: ഭിന്നിച്ചിരിക്കുന്നു
  rationale: അയോറിസ്റ്റ് പാസീവിന്റെ സംഭവവും അതിന്റെ ഇപ്പോഴത്തെ ഫലാവസ്ഥയും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു; ‘വിഭജിക്കപ്പെട്ടിരിക്കുന്നു’ എന്നതിനെക്കാൾ വ്യക്തിപരമായ കർത്താവിനോട് സ്വാഭാവികം.
- source_word: πῶς οὖν
  choice: അങ്ങനെയെങ്കിൽ ... എങ്ങനെ
  rationale: οὖνന്റെ നിഗമനാത്മക ശക്തിയും πῶςന്റെ ചോദ്യരൂപവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: σταθήσεται
  choice: നിലനിൽക്കും
  rationale: ‘നിൽക്കുക’ എന്ന രൂപകത്തിന്റെ സ്ഥിരത/തുടർച്ച എന്ന സന്ദർഭാർഥം ആധുനിക മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: ἡ βασιλεία αὐτοῦ
  choice: അവന്റെ രാജ്യം
  rationale: ആന്തരികമായി ഭിന്നിച്ച അധികാരമേഖല എന്ന ചിത്രത്തിന് ‘രാജ്യം’ അനുയോജ്യം; βασιλείαയുടെ ‘ഭരണം’ എന്ന സാധ്യത ഇവിടെ പ്രധാനപാഠത്തിൽ നിർബന്ധിച്ച് ചേർക്കുന്നില്ല.
theological_decisions:
- issue: സാത്താന്റെ സ്വയംഭിന്നതയുടെ സൂചനയും വാദത്തിന്റെ സ്വഭാവവും
  choice: സാത്താൻ സാത്താനെ പുറത്താക്കുന്നു എന്ന സങ്കൽപ്പത്തിന്റെ ഫലമായി അവൻ തനിക്കുതന്നെ എതിരായി ഭിന്നിച്ചിരിക്കുന്നുവെന്നും അവന്റെ രാജ്യം നിലനിൽക്കില്ലെന്നും പറയുന്ന അസംബന്ധഫല വാദമായി വിവർത്തനം ചെയ്തു.
  alternative: വിശാലസന്ദർഭത്തിലെ ‘ഭിന്നിച്ച ഭവനം’ എന്ന ചിത്രം വിശദീകരണമായി വാക്യത്തിൽ ചേർക്കാം.
  rationale: ഗ്രീക്ക് പാഠം ആന്തരിക ഭിന്നതയുടെയും രാജ്യത്തിന്റെ അസ്ഥിരതയുടെയും യുക്തി നേരിട്ട് പറയുന്നു; അധിക വ്യാഖ്യാനം ചേർക്കാതെ ആ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. വാദത്തിന്റെ ചുരുക്കവും മൂർച്ചയും നിലനിർത്തി; അനാവശ്യമായ സഭാപാരമ്പര്യ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
