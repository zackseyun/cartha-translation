id: MAT.12.15
reference: Matthew 12:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς γνοὺς ἀνεχώρησεν ἐκεῖθεν. καὶ ἠκολούθησαν ⸀αὐτῷ πολλοί, καὶ ἐθεράπευσεν αὐτοὺς πάντας,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/015.yaml
  text: But Jesus[a], knowing this, withdrew from there. And many followed him, and he healed them all,
translation:
  language: ml
  text: എന്നാൽ യേശു ഇത് അറിഞ്ഞ് അവിടെനിന്ന് പിൻവാങ്ങി.[a] അനേകർ അവനെ അനുഗമിച്ചു; അവരെയെല്ലാം അവൻ സുഖപ്പെടുത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യേശു അറിഞ്ഞ് അവിടെനിന്ന് പിൻവാങ്ങി’ എന്നും പരിഭാഷപ്പെടുത്താം. ‘അറിഞ്ഞ്’ എന്നതിന്റെ കർമം ഗ്രീക്കിൽ വ്യക്തമാക്കിയിട്ടില്ല; മുൻവാക്യത്തിലെ സന്ദർഭമാണ് അത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: ഇത് അറിഞ്ഞ്
  rationale: γινώσκωയുടെ aorist participle മുഖ്യക്രിയയ്ക്കു മുമ്പുള്ള അറിവിനെ സൂചിപ്പിക്കുന്നു. കർമം ഗ്രീക്കിൽ വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും മുൻവാക്യത്തിലെ പരീശന്മാരുടെ ആലോചനയിലേക്കുള്ള ബന്ധം ‘ഇത്’ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἀνεχώρησεν
  choice: പിൻവാങ്ങി
  rationale: മത്തായിയുടെ വിവരണത്തിൽ ἀναχωρέω എതിർപ്പോ അപകടമോ നേരിടുമ്പോഴുള്ള ഉദ്ദേശ്യപൂർവമായ പിന്മാറ്റത്തെ സൂചിപ്പിക്കാറുണ്ട്; നിഷ്പക്ഷമായ ‘പോയി’ എന്നതിനെക്കാൾ ഈ ഭാവം ‘പിൻവാങ്ങി’ നിലനിർത്തുന്നു.
- source_word: ἐκεῖθεν
  choice: അവിടെനിന്ന്
  rationale: ഒരു സ്ഥലത്തുനിന്നുള്ള നീക്കം സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളപ്രയോഗം.
- source_word: ἠκολούθησαν αὐτῷ πολλοί
  choice: അനേകർ അവനെ അനുഗമിച്ചു
  rationale: πολλοί എന്നത് ‘അനേകർ’ എന്നാണ്; ഇവിടെ ‘വലിയ ജനക്കൂട്ടങ്ങൾ’ എന്നു വിപുലീകരിക്കേണ്ടതില്ല. മലയാളത്തിലെ സ്വാഭാവിക പദക്രമമാണ് സ്വീകരിച്ചത്.
- source_word: ἐθεράπευσεν
  choice: സുഖപ്പെടുത്തി
  rationale: സുവിശേഷങ്ങളിലെ രോഗശാന്തിയുടെ പശ്ചാത്തലത്തിൽ θεραπεύωയുടെ വ്യക്തവും സാധാരണക്കാർക്ക് സ്വാഭാവികവുമായ തുല്യപ്രയോഗം.
- source_word: αὐτοὺς πάντας
  choice: അവരെയെല്ലാം
  rationale: πάντας നൽകുന്ന സമഗ്രമായ അർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: γνοὺς എന്നതിന്റെ വ്യക്തമാക്കാത്ത കർമം
  choice: ‘ഇത് അറിഞ്ഞ്’ എന്ന് പരിഭാഷപ്പെടുത്തി; ‘ഇത്’ മുൻവാക്യത്തിൽ പറഞ്ഞ ശത്രുതാപരമായ ആലോചനയെ സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നു.
  alternative: ‘അറിഞ്ഞ്’ എന്നുമാത്രം പറയുക, അല്ലെങ്കിൽ ‘ഇതിനെക്കുറിച്ച് അറിവു ലഭിച്ച്’ എന്നു പറയുക.
  rationale: മൂലഗ്രീക്കിൽ കർമം വ്യക്തമല്ല. ‘ഇത്’ എന്നത് സന്ദർഭബന്ധം വ്യക്തമാക്കുമ്പോഴും ആ ആലോചനയുടെ ഉള്ളടക്കം ഈ വാക്യത്തിലേക്ക് വിശദമായി ചേർക്കുന്നില്ല; അടിക്കുറിപ്പ് മൂലത്തിലെ അന്തർലീനത രേഖപ്പെടുത്തുന്നു.
- issue: യേശുവിന്റെ പുറപ്പെടലിന്റെ ഭാവം
  choice: ‘പിൻവാങ്ങി’
  alternative: ‘പോയി’ അല്ലെങ്കിൽ ‘വിട്ടുപോയി’
  rationale: ഭയമോ ഭീരുത്വമോ ആരോപിക്കാതെ, എതിർപ്പിനോടുള്ള ഉദ്ദേശ്യപൂർവമായ പിന്മാറ്റത്തിന്റെ മത്തായിസ്വഭാവമുള്ള വിവരണഭാവം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. ‘അനേകർ’ എന്നത് മൂലത്തിലെ πολλοίയെ അനാവശ്യമായി ‘ജനക്കൂട്ടങ്ങൾ’ എന്നു വിപുലീകരിക്കാതെ നിലനിർത്തുന്നു; ക്രിയകളുടെ ബന്ധം വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളായി അവതരിപ്പിച്ചു.
