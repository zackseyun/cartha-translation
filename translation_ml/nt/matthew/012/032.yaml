id: MAT.12.32
reference: Matthew 12:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὃς ἐὰν εἴπῃ λόγον κατὰ τοῦ υἱοῦ τοῦ ἀνθρώπου, ἀφεθήσεται αὐτῷ· ὃς δ’ ἂν εἴπῃ κατὰ τοῦ πνεύματος τοῦ ἁγίου, οὐκ ἀφεθήσεται αὐτῷ οὔτε ἐν ⸂τούτῳ τῷ⸃ αἰῶνι οὔτε ἐν τῷ μέλλοντι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/032.yaml
  text: And whoever speaks a word against the Son of Man[a], it will be forgiven him; but whoever speaks against the Holy Spirit, it will not be forgiven him[c][b], neither in this age nor in the coming one.
translation:
  language: ml
  text: മനുഷ്യപുത്രനെതിരെ ഒരു വാക്കു പറയുന്ന ഏതൊരാൾക്കും അത് ക്ഷമിക്കപ്പെടും[a]; എന്നാൽ പരിശുദ്ധാത്മാവിനെതിരെ പറയുന്ന ഏതൊരാൾക്കും അത് ക്ഷമിക്കപ്പെടുകയില്ല—ഈ യുഗത്തിലോ[b] വരാനിരിക്കുന്നതിലോ[c] അല്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഒരു വാക്കു പറയുന്ന” എന്നത് “ഒരു വാക്കു ഉച്ചരിക്കുന്ന” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്ക് αἰών ഇവിടെ “യുഗം” എന്നാണ്; പരമ്പരാഗത പരിഭാഷകളിൽ ചിലപ്പോൾ “ലോകം” എന്നു കാണാം.
    reason: lexical_alternative
  - marker: c
    text: 'കൂടുതൽ വ്യക്തമായി: “വരാനിരിക്കുന്ന യുഗത്തിലോ.” ഗ്രീക്കിൽ അക്ഷരാർഥം “വരാനിരിക്കുന്നതിലോ” എന്നാണ്; മുൻപത്തെ പ്രയോഗത്തിൽനിന്ന് “യുഗം” എന്ന പദം മനസ്സിലാക്കപ്പെടുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὃς ἐὰν / ὃς δ’ ἂν
  choice: ഏതൊരുവനോടും ... എന്നാൽ ... ഏതൊരുവനോടും
  rationale: അനിശ്ചിതവും പൊതുവുമായ വ്യവസ്ഥയെ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; രണ്ടു ഉപവാക്യങ്ങളിലെയും സമാന്തരതയും നിലനിർത്തുന്നു.
- source_word: εἴπῃ λόγον
  choice: ഒരു വാക്ക് പറയുന്ന
  rationale: λόγον എന്ന പദത്തിന്റെ സാന്നിധ്യം നിലനിർത്തിക്കൊണ്ട് λέγω λόγον എന്ന പ്രയോഗത്തെ വ്യക്തവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: κατὰ
  choice: എതിരായി
  rationale: ഷഷ്ഠീവിഭക്തിയോടുകൂടിയ κατά ഇവിടെ ഒരാൾക്കെതിരായി ലക്ഷ്യമിടുന്ന വിരോധപരമായ സംസാരത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: ഈ വിശേഷനാമത്തിന്റെ സ്ഥാപിതമായ മലയാളരൂപം നിലനിർത്തുകയും അതിന്റെ മിശിഹീയവും അന്ത്യകാലപരവുമായ ധ്വനികൾ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀφεθήσεται αὐτῷ
  choice: അവനോട് അത് ക്ഷമിക്കപ്പെടും
  rationale: ഭാവികാല കർമണിപ്രയോഗം നിലനിർത്തുന്നു; ‘അത്’ എന്നത് പറഞ്ഞ കുറ്റകരമായ വാക്കിനെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: τοῦ πνεύματος τοῦ ἁγίου
  choice: പരിശുദ്ധാത്മാവ്
  rationale: ആധുനിക നിലവാരമുള്ള മലയാളത്തിലെ സ്ഥാപിതവും ആദരപൂർവവുമായ വിശേഷനാമം.
- source_word: οὐκ ἀφεθήσεται αὐτῷ
  choice: അവനോട് അത് ക്ഷമിക്കപ്പെടുകയില്ല
  rationale: ആദ്യ ഉപവാക്യത്തിലെ കർമണിഘടന നിലനിർത്തി വിരോധം വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: οὔτε ἐν τούτῳ τῷ αἰῶνι
  choice: ഈ യുഗത്തിലോ
  rationale: αἰών ഇവിടെ സ്ഥലപരമായ ‘ലോകം’ എന്നതിനെക്കാൾ കാലപരമായ ‘യുഗം’ എന്നാണ്; തുടർന്നുള്ള ഭാവിയുഗവുമായുള്ള താരതമ്യം ഇതു വ്യക്തമാക്കുന്നു.
- source_word: οὔτε ἐν τῷ μέλλοντι
  choice: വരാനിരിക്കുന്നതിലോ
  rationale: ഗ്രീക്കിൽ αἰών ആവർത്തിക്കാതെ സൂചിതമായി നിൽക്കുന്ന ദീർഘലോപം മലയാളത്തിലും സംരക്ഷിക്കുന്നു; മുൻപുള്ള ‘യുഗം’ എന്ന പദത്തിൽനിന്ന് അർഥം വ്യക്തമാണ്.
theological_decisions:
- issue: αἰών / μέλλων എന്ന കാലപരമായ വൈരുധ്യത്തിന്റെ പരിഭാഷ
  choice: ഈ യുഗത്തിലോ വരാനിരിക്കുന്നതിലോ
  alternative: ഈ ലോകത്തിലോ വരാനിരിക്കുന്ന ലോകത്തിലോ; ഈ യുഗത്തിലോ വരാനിരിക്കുന്ന യുഗത്തിലോ
  rationale: വാക്യം സ്ഥലപരമായ രണ്ടു ലോകങ്ങളെയല്ല, ഇപ്പോഴത്തെ യുഗത്തെയും വരാനിരിക്കുന്ന യുഗത്തെയും താരതമ്യം ചെയ്യുന്നു. ‘വരാനിരിക്കുന്നത്’ എന്ന രൂപം ഗ്രീക്കിലെ സൂചിതനാമഘടനയും നിലനിർത്തുന്നു.
- issue: ക്ഷമിക്കപ്പെടാത്ത കുറ്റത്തിന്റെ സ്വഭാവം
  choice: പരിശുദ്ധാത്മാവിനെതിരായി പറയുക എന്ന വാക്യത്തിലെ മുന്നറിയിപ്പ് കൂടുതൽ സിദ്ധാന്തപരമായി നിർവചിക്കാതെ നിലനിർത്തുന്നു
  alternative: യേശുവിന്റെ ഭൂതോച്ചാടനങ്ങളെക്കുറിച്ചുള്ള ഒരു പ്രത്യേക ചരിത്രപരമായ ആരോപണമെന്നോ അന്തിമമായ അനുതാപമില്ലായ്മയെന്നോ വ്യാഖ്യാനിക്കുക
  rationale: ഈ വാക്യം കുറ്റത്തിന്റെ ഫലം പ്രസ്താവിക്കുന്നുവെങ്കിലും പിന്നീട് രൂപപ്പെട്ട ദൈവശാസ്ത്രപരമായ നിർവചനം നൽകുന്നില്ല; അതിനാൽ പരിഭാഷ വ്യാഖ്യാനപരമായ അതിരുകടക്കൽ ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘മനുഷ്യപുത്രൻ,’ ‘പരിശുദ്ധാത്മാവ്,’ ‘യുഗം’ എന്നീ സ്ഥാപിത ബൈബിൾപദങ്ങൾ നിലനിർത്തി; ഗ്രീക്കിലെ കർമണിഘടനയും അവസാനത്തെ ദീർഘലോപവും സാധ്യമായത്ര സ്വാഭാവികമായി സംരക്ഷിച്ചു.
