id: MAT.12.5
reference: Matthew 12:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἢ οὐκ ἀνέγνωτε ἐν τῷ νόμῳ ὅτι τοῖς σάββασιν οἱ ἱερεῖς ἐν τῷ ἱερῷ τὸ σάββατον βεβηλοῦσιν καὶ ἀναίτιοί εἰσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/005.yaml
  text: Or have you not read in the Law that on the Sabbaths the priests in the temple profane the Sabbath and are guiltless?[a][b][c]
translation:
  language: ml
  text: അല്ലെങ്കിൽ, ശബ്ബത്തുനാളുകളിൽ ദൈവാലയത്തിൽ പുരോഹിതന്മാർ ശബ്ബത്തിനെ അശുദ്ധമാക്കുന്നുവെങ്കിലും കുറ്റക്കാരല്ലെന്ന് ന്യായപ്രമാണത്തിൽ നിങ്ങൾ വായിച്ചിട്ടില്ലേ?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അശുദ്ധമാക്കുക’ എന്നതിന് ‘ലംഘിക്കുക’ എന്നും പരിഭാഷപ്പെടുത്താം. വിശുദ്ധമായതിനെ സാധാരണമായോ അശുദ്ധമായോ കണക്കാക്കുക എന്ന ആശയം ഗ്രീക്ക് ക്രിയയ്ക്കുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘ശബ്ബത്തുകളിൽ’ എന്നാണ്; ഒരൊറ്റ സംഭവത്തേക്കാൾ ആവർത്തിച്ചുള്ള ശബ്ബത്ത് അവസരങ്ങളെയായിരിക്കാം ഇത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: ഇവിടെ ‘ന്യായപ്രമാണം’ എന്നത് മോശെയുടെ ന്യായപ്രമാണം അഥവാ തിരുവെഴുത്തിനെ സൂചിപ്പിക്കുന്നു; ശബ്ബത്തിലെ പുരോഹിതശുശ്രൂഷയെക്കുറിച്ചുള്ള ചട്ടങ്ങളും ഇതിൽ ഉൾപ്പെടുന്നു (സംഖ്യ 28:9–10 കാണുക).
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: അല്ലെങ്കിൽ
  rationale: യേശുവിന്റെ മറുപടിയിൽ മറ്റൊരു തിരുവെഴുത്താധിഷ്ഠിത വാദം അവതരിപ്പിക്കുന്ന ബന്ധകത്തിന്റെ ലളിതമായ വാചകശക്തി നിലനിർത്തുന്നു.
- source_word: οὐκ ἀνέγνωτε
  choice: നിങ്ങൾ വായിച്ചിട്ടില്ലേ?
  rationale: മത്തായിയിൽ കാണുന്ന ആലങ്കാരിക ചോദ്യരൂപം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐν τῷ νόμῳ
  choice: ന്യായപ്രമാണത്തിൽ
  rationale: അമൂർത്തമായ നിയമത്തെയല്ല, മോശെയുടെ ന്യായപ്രമാണമെന്ന തിരുവെഴുത്തുസമുച്ചയത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: τοῖς σάββασιν
  choice: ശബ്ബത്തുനാളുകളിൽ
  rationale: ഗ്രീക്കിലെ ബഹുവചനം സൂചിപ്പിക്കുന്ന ആവർത്തിച്ചുള്ള ശബ്ബത്ത് അവസരങ്ങൾ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: οἱ ἱερεῖς
  choice: പുരോഹിതന്മാർ
  rationale: ദൈവാലയശുശ്രൂഷ നിർവഹിക്കുന്ന പുരോഹിതരെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: ἐν τῷ ἱερῷ
  choice: ദൈവാലയത്തിലെ
  rationale: ἱερόν ദൈവാലയസമുച്ചയത്തെ സൂചിപ്പിക്കുന്നു; സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ മലയാളപ്രയോഗമാണിത്.
- source_word: τὸ σάββατον
  choice: ശബ്ബത്തിനെ
  rationale: ക്രിയയുടെ കർമമായി ശബ്ബത്ത് എന്ന ദിനത്തെയും സ്ഥാപനത്തെയും നിലനിർത്തുന്നു.
- source_word: βεβηλοῦσιν
  choice: അശുദ്ധമാക്കുന്നുവെങ്കിലും
  rationale: വിശുദ്ധമായതിനെ സാധാരണമായോ അശുദ്ധമായോ കൈകാര്യം ചെയ്യുക എന്ന ശക്തമായ അർഥം നിലനിർത്തുന്നു; തുടർന്നുള്ള ‘കുറ്റക്കാരല്ല’ എന്ന പ്രസ്താവനയുമായുള്ള ഉദ്ദേശ്യപൂർവമായ സംഘർഷം മൃദൂകരിക്കുന്നില്ല.
- source_word: ἀναίτιοί εἰσιν
  choice: കുറ്റക്കാരല്ല
  rationale: നിയമപരമായ കുറ്റബാധ്യത ഇല്ലെന്ന സന്ദർഭാർഥം ലളിതവും കൃത്യവുമായി നൽകുന്നു.
theological_decisions:
- issue: പുരോഹിതന്മാർ യഥാർഥത്തിൽ ശബ്ബത്ത് ലംഘിക്കുന്നുവെന്ന ധാരണ ഒഴിവാക്കാൻ യേശുവിന്റെ ശക്തമായ വാക്കുകൾ മൃദൂകരിക്കണമോ എന്ന ചോദ്യം
  choice: ‘ശബ്ബത്തിനെ അശുദ്ധമാക്കുന്നു’ എന്ന ശക്തമായ പ്രയോഗവും ‘കുറ്റക്കാരല്ല’ എന്ന വിരുദ്ധമെന്നു തോന്നുന്ന പ്രസ്താവനയും ഒരുമിച്ച് നിലനിർത്തി.
  alternative: ‘ശബ്ബത്ത് ലംഘിച്ചിട്ടും നിരപരാധികളാണ്’ അല്ലെങ്കിൽ ശബ്ബത്ത് ലംഘനം സംഭവിക്കുന്നില്ലെന്ന വ്യാഖ്യാനം വാചകത്തിൽ ചേർക്കുക.
  rationale: ഗ്രീക്ക് വാചകം മനപ്പൂർവം സൃഷ്ടിക്കുന്ന ദൈവശാസ്ത്രപരവും ആലങ്കാരികവുമായ സംഘർഷം വിവർത്തനം പരിഹരിക്കരുത്. ദൈവാലയശുശ്രൂഷയിലെ പ്രവൃത്തി ശബ്ബത്തിനെ അശുദ്ധമാക്കുന്നതായി വിശേഷിപ്പിക്കപ്പെടുമ്പോഴും പുരോഹിതന്മാർ കുറ്റക്കാരല്ലെന്നാണ് വാക്യം പറയുന്നത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ദൈവാലയം,’ ‘പുരോഹിതന്മാർ,’ ‘ന്യായപ്രമാണം’ എന്നിവ സാധാരണ ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ പദങ്ങളാണ്. ഗ്രീക്കിലെ ബഹുവചനം ‘ശബ്ബത്തുനാളുകളിൽ’ എന്നു സ്വാഭാവികമായി നിലനിർത്തി; വാക്യത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം വിശദീകരിച്ച് നീക്കാതെ സംരക്ഷിച്ചു.
