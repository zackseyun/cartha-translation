id: MAT.12.19
reference: Matthew 12:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐκ ἐρίσει οὐδὲ κραυγάσει, οὐδὲ ἀκούσει τις ἐν ταῖς πλατείαις τὴν φωνὴν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/019.yaml
  text: He will not quarrel or cry out[a], and no one will hear his voice in the streets.
translation:
  language: ml
  text: അവൻ കലഹിക്കുകയോ ഉച്ചത്തിൽ വിളിച്ചുകൂവുകയോ ഇല്ല; തെരുവുകളിൽ ആരും അവന്റെ ശബ്ദം കേൾക്കുകയുമില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അവൻ തർക്കിക്കുകയോ ഉച്ചത്തിൽ വിളിക്കുകയോ ഇല്ല; പൊതുചത്വരങ്ങളിൽ ആരും അവന്റെ ശബ്ദം കേൾക്കുകയുമില്ല.”'
    reason: ἐρίζω, κραυγάζω, പ്ലατεῖα എന്നീ പദങ്ങളുടെ സാധുവായ വ്യത്യസ്ത പരിഭാഷകൾ സൂചിപ്പിക്കുന്നു.
lexical_decisions:
- source_word: ἐρίσει
  choice: കലഹിക്കുകയില്ല
  rationale: ἐρίζω തർക്കത്തിലോ കലഹത്തിലോ ഏർപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘കലഹിക്കുക’ ആ ദാസന്റെ കലഹപ്രിയനല്ലാത്ത സ്വഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: κραυγάσει
  choice: നിലവിളിക്കുകയില്ല
  rationale: κραυγάζω ഉച്ചത്തിൽ വിളിച്ചുപറയുന്നതിനെയോ നിലവിളിക്കുന്നതിനെയോ സൂചിപ്പിക്കുന്നു. ‘നിലവിളിക്കുക’ പരസ്യമായ ഉച്ചവിളിയുടെ ആശയം നിലനിർത്തുന്നു; ഇവിടെ ദുഃഖത്താൽ കരയുക എന്ന അർഥമല്ല.
- source_word: ἀκούσει τις
  choice: ആരും … കേൾക്കുകയുമില്ല
  rationale: നിഷേധത്തോടുകൂടിയ τις എന്ന അനിശ്ചിത സർവനാമത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘ആരും … ഇല്ല’ എന്നു പരിഭാഷപ്പെടുത്തി; ആവർത്തിക്കുന്ന നിഷേധത്തിന്റെ സഞ്ചിതബലവും നിലനിർത്തി.
- source_word: ἐν ταῖς πλατείαις
  choice: തെരുവുകളിൽ
  rationale: πλατεῖα വിശാലമായ പൊതുവഴിയെയോ പൊതുസ്ഥലത്തെയോ സൂചിപ്പിക്കാം. സന്ദർഭത്തിൽ ‘തെരുവുകളിൽ’ വ്യക്തവും സ്വാഭാവികവുമാണ്; ‘പൊതുചത്വരങ്ങളിൽ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: φωνὴν αὐτοῦ
  choice: അവന്റെ ശബ്ദം
  rationale: φωνή ഇവിടെ വ്യക്തിയുടെ കേൾക്കാവുന്ന ശബ്ദത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘അവന്റെ ശബ്ദം’ നേരിട്ടും വ്യക്തവുമായ പരിഭാഷയാണ്.
- source_word: οὐκ…οὐδὲ…οὐδὲ
  choice: …യോ …യോ ഇല്ല; …ആരും …യുമില്ല
  rationale: ഗ്രീക്കിലെ മൂന്നു നിഷേധങ്ങളുടെ സഞ്ചിതഘടന മലയാളത്തിലെ സ്വാഭാവികമായ ‘യോ…യോ ഇല്ല’ എന്നും ‘ആരും…യുമില്ല’ എന്നും ഉപയോഗിച്ച് പുനരാവിഷ്കരിച്ചു.
theological_decisions:
- issue: യെശയ്യാവിലെ ദാസനെക്കുറിച്ചുള്ള ഉദ്ധരണിയുമായുള്ള ബന്ധവും മശിഹായുടെ പെരുമാറ്റവും
  choice: വാക്യം മശിഹായെ കലഹപ്രിയനല്ലാത്തവനും പൊതുസ്ഥലത്ത് ഉച്ചവിളിയിലൂടെ സ്വയം പ്രദർശിപ്പിക്കാത്തവനുമായി ചിത്രീകരിക്കുന്നു.
  alternative: പരമ്പരാഗത ഉദ്ധരണിഭാഷയെ അനുസ്മരിപ്പിക്കാൻ ‘പോരാടുകയില്ല, ഉച്ചത്തിൽ വിളിക്കുകയില്ല’ എന്നിങ്ങനെ കൂടുതൽ ഔപചാരികമായി പരിഭാഷപ്പെടുത്താം.
  rationale: ഗ്രീക്ക് പാഠം യെശയ്യാവ് 42:2-ന്റെ നിവൃത്തിയായി യേശുവിന്റെ സൗമ്യവും കലഹരഹിതവുമായ പൊതുപെരുമാറ്റത്തെ വിവരിക്കുന്നു. ഈ പരിഭാഷ എല്ലാ പൊതുപ്രസംഗവും മൗനവും സംബന്ധിച്ച വിപുലമായ ഉപദേശം ഇറക്കുമതി ചെയ്യാതെ ആ സ്വഭാവചിത്രണം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ സമാന്തര നിഷേധഘടന സ്വാഭാവിക മലയാളവാക്യക്രമത്തിൽ നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
