    issue: ‘നിക്ഷേപം’ for θησαυρός
    rationale: In current standard Malayalam, ‘നിക്ഷേപം’ primarily means a financial investment, deposit, or placing of something. It can misdirect readers away from the Greek image of a treasure/store held within. ‘നിധി’ conveys ‘treasure’ directly and preserves the figurative sense.
  - severity: low
    issue: Representative-singular note omitted
    rationale: The English audit trail includes a lexical note explaining that ἄνθρωπος is grammatically masculine singular but representative in sense. Adding the corresponding Malayalam note improves transparency without altering the text.
