id: MAT.12.35
reference: Matthew 12:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ ἀγαθὸς ἄνθρωπος ἐκ τοῦ ἀγαθοῦ θησαυροῦ ἐκβάλλει ἀγαθά, καὶ ὁ πονηρὸς ἄνθρωπος ἐκ τοῦ πονηροῦ θησαυροῦ ἐκβάλλει πονηρά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/035.yaml
  text: The good man brings out good things from his good treasure[b][a], and the evil man brings out evil things from his evil treasure.
translation:
  language: ml
  text: നല്ല മനുഷ്യൻ[a] തന്റെ നല്ല നിധിയിൽനിന്ന് നല്ല കാര്യങ്ങൾ പുറത്തുകൊണ്ടുവരുന്നു; ദുഷ്ട മനുഷ്യൻ തന്റെ ദുഷ്ട നിധിയിൽനിന്ന് ദുഷ്ട കാര്യങ്ങൾ പുറത്തുകൊണ്ടുവരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മനുഷ്യൻ’ എന്നതിന് ഗ്രീക്കിൽ പുല്ലിംഗ ഏകവചനമായ ἄνθρωπος ആണ് ഉള്ളത്; ഇവിടെ അത് പ്രതിനിധിപരമായ അർഥത്തിൽ ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: തൊട്ടുമുമ്പും പിന്നാലെയും ഉള്ള സന്ദർഭം സംസാരത്തെക്കുറിച്ചായതിനാൽ, ‘നല്ല കാര്യങ്ങൾ’, ‘ദുഷ്ട കാര്യങ്ങൾ’ എന്നിവ പ്രത്യേകിച്ച് വാക്കുകളെ സൂചിപ്പിക്കാം.
    reason: cross_reference
lexical_decisions:
- source_word: ἀγαθὸς / ἀγαθά
  choice: നല്ല / നല്ല കാര്യങ്ങൾ
  rationale: വ്യക്തിയെയും അയാളിൽനിന്ന് പുറപ്പെടുന്ന കാര്യങ്ങളെയും വിശേഷിപ്പിക്കുന്ന ഗ്രീക്കിലെ ആവർത്തനം നിലനിർത്തുന്നു. നപുംസകലിംഗ ബഹുവചനമായ ἀγαθάയെ സ്വാഭാവിക മലയാളത്തിൽ ‘നല്ല കാര്യങ്ങൾ’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: ἄνθρωπος
  choice: മനുഷ്യൻ
  rationale: ഇവിടെ ഗ്രീക്കിലെ പുല്ലിംഗ ഏകവചനം സദൃശവാക്യരീതിയിൽ ഒരു പ്രതിനിധി വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. ‘മനുഷ്യൻ’ ഈ രൂപവും പൊതുവായ പ്രയോഗവും മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: θησαυρός
  choice: നിക്ഷേപം
  rationale: ഉള്ളിൽ സൂക്ഷിച്ചുവെച്ചിരിക്കുന്ന സമ്പത്തിൽനിന്ന് കാര്യങ്ങൾ പുറപ്പെടുന്നു എന്ന രൂപകം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപദം. ‘ഭണ്ഡാരം’ കൂടുതൽ സ്ഥലസൂചകമായി തോന്നാം.
- source_word: ἐκβάλλει
  choice: പുറത്തുകൊണ്ടുവരുന്നു
  rationale: ἐκβάλλει എന്ന ക്രിയയിലെ പുറത്തേക്കുള്ള ചലനചിത്രം നിലനിർത്തുകയും സന്ദർഭത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: πονηρός / πονηρά
  choice: ദുഷ്ട / ദുഷ്ട കാര്യങ്ങൾ
  rationale: ἀγαθός എന്നതിനോടുള്ള ശക്തമായ ധാർമിക വൈരുധ്യം കാത്തുസൂക്ഷിക്കുന്നു; വിശേഷണങ്ങളുടെ സമാന്തര ആവർത്തനവും നിലനിർത്തുന്നു.
- source_word: ἐκ
  choice: നിന്ന്
  rationale: ഉറവിടം സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു; ‘പുറത്തുകൊണ്ടുവരുന്നു’ എന്ന ക്രിയ തന്നെ പുറത്തേക്കുള്ള ചലനം പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: സദൃശവാക്യരീതിയിലുള്ള ആന്തരിക ധാർമിക നിക്ഷേപവും ബാഹ്യഫലവും തമ്മിലുള്ള ബന്ധം
  choice: ഗ്രീക്കിലെ പൊതുവായ ‘നല്ല കാര്യങ്ങൾ/ദുഷ്ട കാര്യങ്ങൾ’ എന്ന പ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
  alternative: അടുത്ത സന്ദർഭത്തെ അടിസ്ഥാനമാക്കി ‘നല്ല വാക്കുകൾ/ദുഷ്ട വാക്കുകൾ’ എന്നു ചുരുക്കുക.
  rationale: മത്തായി 12:34, 36-37 വാക്കുകളെക്കുറിച്ചാണെങ്കിലും ഈ വാക്യത്തിലെ ἀγαθά, πονηρά എന്നിവയ്ക്കൊപ്പം വ്യക്തമായ നാമപദമില്ല. അതിനാൽ വാക്കുകൾക്ക് പ്രത്യേക പ്രസക്തിയുണ്ടാകാമെന്ന കാര്യം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ച് മൂലപാഠത്തിന്റെ വിശാലതയും വ്യാഖ്യാനാത്മക സംഘർഷവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ സദൃശവാക്യശൈലി. ഗ്രീക്കിലെ സമാന്തര ഘടനയും ‘നല്ല/ദുഷ്ട’ എന്ന ആവർത്തനവും ഉദ്ദേശപൂർവം നിലനിർത്തിയിരിക്കുന്നു.
