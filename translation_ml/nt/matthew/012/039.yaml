reference: Matthew 12:39
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Γενεὰ πονηρὰ καὶ μοιχαλὶς σημεῖον ἐπιζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον Ἰωνᾶ τοῦ προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/039.yaml
  text: But he answered and said to them[a], “An evil and adulterous generation seeks a sign[b], and no sign will be given to it except the sign of Jonah the prophet.”
translation:
  language: ml
  text: 'എന്നാൽ അവൻ അവരോടു മറുപടിയായി പറഞ്ഞു: “ദുഷ്ടവും വ്യഭിചാരിണിയുമായ[a] തലമുറ ഒരു അടയാളം അന്വേഷിക്കുന്നു; യോനാ പ്രവാചകന്റെ അടയാളം[b] അല്ലാതെ അതിന് ഒരു അടയാളവും നൽകപ്പെടുകയില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വ്യഭിചാരിണിയായ” എന്നത് നേരിട്ടുള്ള ലൈംഗിക അധാർമികതയ്ക്കൊപ്പം, പ്രവാചകസാഹിത്യത്തിലെ രൂപകപ്രയോഗംപോലെ ദൈവത്തോടുള്ള ഉടമ്പടി-അവിശ്വസ്തതയെയും സൂചിപ്പിച്ചേക്കാം.
    reason: cross_reference
  - marker: b
    text: അഥവാ “പ്രവാചകനായ യോനായുടെ അടയാളം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: മറുപടിയായി പറഞ്ഞു
  rationale: പങ്കാളിക്രിയയും സമാപികാക്രിയയും ചേർന്ന ഗ്രീക്ക് ആഖ്യാനശൈലി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: Γενεὰ
  choice: ഒരു തലമുറ
  rationale: യേശുവിന്റെ സമകാലികരായ ഒരു കൂട്ടത്തെ ധാർമികമായി വിശേഷിപ്പിക്കുന്ന ഏകവചന സമൂഹനാമത്തിന്റെ അർത്ഥവും വ്യാപ്തിയും നിലനിർത്തുന്നു.
- source_word: πονηρὰ
  choice: ദുഷ്ടമായ
  rationale: സന്ദർഭത്തിലെ ശക്തമായ ധാർമിക കുറ്റപ്പെടുത്തൽ വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: μοιχαλὶς
  choice: വ്യഭിചാരിണിയായ
  rationale: പദത്തിന്റെ നേരിട്ടുള്ള വ്യഭിചാരരൂപകവും പ്രവാചകസാഹിത്യത്തിൽ അതിനുള്ള ഉടമ്പടി-അവിശ്വസ്തതയുടെ അനുരണനവും വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: σημεῖον
  choice: അടയാളം
  rationale: സ്ഥിരീകരണമായി ആവശ്യപ്പെടുന്ന അത്ഭുതപരമായ തെളിവിനെയും തുടർന്നുള്ള യോനാ പരാമർശത്തെയും ഉൾക്കൊള്ളാൻ കഴിയുന്ന വിശാലമായ നേരിട്ടുള്ള പദമാണ്; ‘അത്ഭുത അടയാളം’ എന്നു ചേർക്കുന്നത് മൂലപാഠത്തേക്കാൾ നിർദ്ദിഷ്ടമാകും.
- source_word: ἐπιζητεῖ
  choice: അന്വേഷിക്കുന്നു
  rationale: തീവ്രത നിർബന്ധമായി കൂട്ടിച്ചേർക്കാതെ അന്വേഷിക്കൽ/തേടൽ എന്ന അടിസ്ഥാന അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: δοθήσεται
  choice: നൽകപ്പെടുകയില്ല
  rationale: ഭാവികാല കർമണിപ്രയോഗം മലയാളത്തിൽ വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: αὐτῇ
  choice: അതിനു
  rationale: സ്ത്രീലിംഗ ഏകവചനമായ ‘തലമുറ’യിലേക്കു മടങ്ങുന്ന സർവനാമത്തെ മലയാളത്തിലെ സ്വാഭാവിക നിർജീവ/സമൂഹ സൂചനയായി നൽകുന്നു.
- source_word: εἰ μὴ
  choice: അല്ലാതെ
  rationale: നിഷേധവാക്യത്തിലെ ഏക അപവാദം മലയാളത്തിൽ കൃത്യമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τὸ σημεῖον Ἰωνᾶ τοῦ προφήτου
  choice: യോനാ പ്രവാചകന്റെ അടയാളം
  rationale: ഗ്രീക്കിലെ ബന്ധവും പദക്രമവും ഏറെക്കുറെ പിന്തുടരുമ്പോഴും മലയാളത്തിൽ സ്വാഭാവികമാണ്; അടയാളത്തിന്റെ സ്വഭാവം മുൻകൂട്ടി വ്യാഖ്യാനിക്കുന്നില്ല.
theological_decisions:
- issue: ‘വ്യഭിചാരിണി’ എന്ന കുറ്റപ്പെടുത്തലിന്റെ അർത്ഥം
  choice: പ്രധാനപാഠത്തിൽ ‘വ്യഭിചാരിണിയായ’ എന്ന പ്രവാചക-രൂപകപദം നിലനിർത്തി.
  alternative: അവിശ്വസ്തമായ
  rationale: ഗ്രീക്ക് പദം ലൈംഗിക അധാർമികതയുടെ നേരിട്ടുള്ള അർത്ഥത്തോടൊപ്പം ദൈവത്തോടുള്ള ഉടമ്പടി-അവിശ്വസ്തതയെയും അനുസ്മരിപ്പിക്കാം. ‘അവിശ്വസ്ത’ എന്നു മാത്രം പറഞ്ഞ് ഈ അർത്ഥസംഘർഷം പരിഹരിച്ചുകളയുന്നില്ല.
- issue: ‘യോനാ പ്രവാചകന്റെ അടയാളം’ എന്നതിന്റെ സ്വഭാവം
  choice: പദസമുച്ചയം വിശദീകരണമില്ലാതെ അതിന്റെ ശാബ്ദിക വ്യാപ്തിയിൽ നിലനിർത്തി.
  alternative: യോനായുടെ അനുഭവംപോലുള്ള അടയാളം; യോനാ തന്നെയായ അടയാളം
  rationale: തുടർന്നുള്ള സന്ദർഭമാണ് ഈ അടയാളത്തെ വിശദീകരിക്കുന്നത്; ഈ വാക്യത്തിൽ ഒരു പ്രത്യേക വ്യാഖ്യാനം മുൻകൂട്ടി ചേർക്കുന്നത് ഉചിതമല്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടന ഉപയോഗിച്ചു. ‘മറുപടിയായി പറഞ്ഞു’ എന്നത് മൂലത്തിലെ ഇരട്ട ക്രിയാരൂപം അസ്വാഭാവികമാകാതെ നിലനിർത്തുന്നു. ‘മറ്റൊരു’ എന്നത് ഗ്രീക്കിലെ നിഷേധവും ഏക അപവാദവും മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കാൻ ചേർത്തതാണ്.
