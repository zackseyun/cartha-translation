id: MAT.12.12
reference: Matthew 12:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πόσῳ οὖν διαφέρει ἄνθρωπος προβάτου. ὥστε ἔξεστιν τοῖς σάββασιν καλῶς ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/012.yaml
  text: How much more valuable[a], then, is a man than a sheep! So it is lawful to do good on the Sabbaths.
translation:
  language: ml
  text: അങ്ങനെയെങ്കിൽ, ഒരു മനുഷ്യൻ ഒരു ആടിനെക്കാൾ എത്രയോ വിലയുള്ളവനാണ്! അതുകൊണ്ട് ശബ്ബത്ത് ദിവസങ്ങളിൽ[a] നന്മ ചെയ്യുന്നത് നിയമാനുസൃതമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, കൂടുതൽ സ്വാഭാവികമായി: “ശബ്ബത്ത് ദിവസത്തിൽ.” ഗ്രീക്കിൽ “ശബ്ബത്ത് ദിവസങ്ങളിൽ” എന്ന ബഹുവചനമാണ്; ശബ്ബത്താചരണത്തെ സൂചിപ്പിക്കാൻ ഇത് സാധാരണമായ ഒരു ശൈലിയാണ്.'
    reason: ഗ്രീക്കിലെ ബഹുവചനശൈലിയും അതിന് മലയാളത്തിൽ സ്വാഭാവികമായ ഏകവചനപരിഭാഷയും രേഖപ്പെടുത്താൻ.
lexical_decisions:
- source_word: πόσῳ οὖν διαφέρει
  choice: അങ്ങനെയെങ്കിൽ ... എത്രയോ വിലയുള്ളവനാണ്
  rationale: മുൻവാക്യത്തിലെ ആടിനെ രക്ഷിക്കുന്ന ഉദാഹരണത്തിൽനിന്നുള്ള നിഗമനവും, കുറഞ്ഞതിൽനിന്ന് കൂടുതലിലേക്കുള്ള താരതമ്യവാദവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു. διαφέρει ഇവിടെ വെറും വ്യത്യാസമല്ല, താരതമ്യേനുള്ള മൂല്യമാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἄνθρωπος
  choice: ഒരു മനുഷ്യൻ
  rationale: ഇവിടെ പദം ഒരു വ്യക്തിയെ പ്രതിനിധാനപരമായി സൂചിപ്പിച്ച് ആടിനോടു താരതമ്യം ചെയ്യുന്നു; ആ അർത്ഥം ഉൾക്കൊള്ളുന്നതും സ്വാഭാവികവുമായ മലയാളപ്രയോഗമാണിത്.
- source_word: προβάτου
  choice: ഒരു ആടിനെക്കാൾ
  rationale: διαφέρει-യോടൊപ്പമുള്ള ജനിറ്റീവ് താരതമ്യത്തെ മലയാളത്തിലെ ‘-നെക്കാൾ’ എന്ന ഘടനയിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: ὥστε ἔξεστιν
  choice: അതുകൊണ്ട് ... നിയമാനുസൃതമാണ്
  rationale: ὥστε-യുടെ നിഗമനസ്വഭാവവും, ശബ്ബത്തുനിയമത്തെക്കുറിച്ചുള്ള തർക്കസന്ദർഭത്തിൽ ἔξεστιν-ന്റെ നിയമപരമായ അർത്ഥവും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: τοῖς σάββασιν
  choice: ശബ്ബത്തുദിവസങ്ങളിൽ
  rationale: ഗ്രീക്കിലെ ബഹുവചനരൂപം നിലനിർത്തുന്നു; ഇത് ശബ്ബത്താചരണത്തെ സൂചിപ്പിക്കുന്ന പതിവുശൈലിയായിരിക്കാമെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: καλῶς ποιεῖν
  choice: നന്മ ചെയ്യുന്നത്
  rationale: ഉപകാരപ്രദവും നല്ലതുമായ പ്രവൃത്തി ചെയ്യുക എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ലളിതവും നേരിട്ടുള്ളതുമായ മലയാളരൂപം.
theological_decisions:
- issue: ἄνθρωπος എന്ന പദത്തിന്റെ പ്രതിനിധാനപരമായ ഏകവചനപ്രയോഗം
  choice: ഒരു മനുഷ്യൻ
  alternative: ഒരു വ്യക്തി / മനുഷ്യജീവി
  rationale: ലിംഗഭേദത്തെ പ്രത്യേകമായി ഉന്നയിക്കാത്ത ഈ സന്ദർഭത്തിൽ പൊതുവായ മനുഷ്യനെ ആടിനോടു താരതമ്യം ചെയ്യുകയാണ്; ‘ഒരു മനുഷ്യൻ’ രൂപവും പൊതുവായ അർത്ഥവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- issue: ശബ്ബത്തിന്റെ ബഹുവചനപ്രയോഗം
  choice: ശബ്ബത്തുദിവസങ്ങളിൽ
  alternative: ശബ്ബത്തുദിവസത്തിൽ / ശബ്ബത്തിൽ
  rationale: τοῖς σάββασιν എന്ന ബഹുവചനം പ്രധാനവാചകത്തിൽ സുതാര്യമായി പ്രതിഫലിപ്പിക്കുമ്പോഴും, അത് ഏകവചനാർഥത്തിൽ ഉപയോഗിക്കുന്ന സാധാരണ ഗ്രീക്ക് ശൈലിയാകാമെന്ന സാധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
- issue: ἔξεστιν എന്നതിന്റെ നിയമപരമായ ഭാവം
  choice: നിയമാനുസൃതമാണ്
  alternative: അനുവദനീയമാണ് / ചെയ്യാം
  rationale: സന്ദർഭം ശബ്ബത്തിൽ എന്തു ചെയ്യുന്നത് നിയമാനുസൃതമാണെന്ന തർക്കമായതിനാൽ, വെറും അനുമതിയേക്കാൾ നിയമ-ധാർമിക ഭാവമുള്ള വിവർത്തനം യോജിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘നിയമാനുസൃതമാണ്’ എന്ന പ്രയോഗം നിയമതർക്കത്തിന്റെ ഭാവം നിലനിർത്തുന്നു; അല്പം ഔപചാരികമാണെങ്കിലും സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട പ്രസ്താവനയുടെ അവസാനം നൽകിയിരിക്കുന്നു.
