id: MAT.12.25
reference: Matthew 12:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰδὼς ⸀δὲ τὰς ἐνθυμήσεις αὐτῶν εἶπεν αὐτοῖς· Πᾶσα βασιλεία μερισθεῖσα καθ’ ἑαυτῆς ἐρημοῦται, καὶ πᾶσα πόλις ἢ οἰκία μερισθεῖσα καθ’ ἑαυτῆς οὐ σταθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/025.yaml
  text: But knowing their thoughts[a], he said to them, “Every kingdom divided against itself is laid waste[c][b], and every city or house divided against itself will not stand.”
translation:
  language: ml
  text: 'എന്നാൽ അവരുടെ ചിന്തകൾ അറിഞ്ഞ് അവൻ അവരോടു പറഞ്ഞു: “സ്വന്തം ഉള്ളിൽ ഭിന്നിച്ചിരിക്കുന്ന ഓരോ രാജ്യവും നാശത്തിലാകുന്നു[a]; സ്വന്തം ഉള്ളിൽ ഭിന്നിച്ചിരിക്കുന്ന ഓരോ നഗരമോ വീടോ[b] നിലനിൽക്കുകയില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പാഴാകുന്നു,” “വിജനമാകുന്നു,” അല്ലെങ്കിൽ “നാശത്തിലേക്കു പോകുന്നു” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: “വീട്” എന്നതിന് ഈ സന്ദർഭത്തിൽ “കുടുംബം” അല്ലെങ്കിൽ “വീട്ടുകാർ” എന്ന അർഥവും ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: അറിഞ്ഞ്
  rationale: മാനസികമായ അറിവിനെ സൂചിപ്പിക്കുന്ന കൃതന്തത്തിന്റെ മുഖ്യക്രിയയോടുള്ള ബന്ധം സ്വാഭാവികമായി നിലനിർത്തുന്നു; അറിവിന്റെ മാർഗം വ്യക്തമാക്കുന്നില്ല.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: സന്ദർഭത്തിലെ മൃദുവായ മാറ്റവും വിരുദ്ധഭാവവും വ്യക്തമാക്കുന്നു.
- source_word: ἐνθυμήσεις
  choice: ചിന്തകൾ
  rationale: അകത്തെ ആലോചനകൾ, വിചാരങ്ങൾ, ഉദ്ദേശ്യങ്ങൾ എന്നിവ ഉൾക്കൊള്ളാൻ കഴിയുന്ന, സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ പദം.
- source_word: Πᾶσα βασιλεία
  choice: ഏതു രാജ്യവും
  rationale: ഏകവചന നാമത്തോടുകൂടിയ πᾶσα പ്രകടിപ്പിക്കുന്ന സാർവത്രികമായ പഴമൊഴിസ്വഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: μερισθεῖσα καθ’ ἑαυτῆς
  choice: തനിക്കുതന്നെ എതിരായി വിഭജിക്കപ്പെട്ട
  rationale: ആന്തരിക വിഭജനവും κατάയുടെ എതിർപ്പുസ്വഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: ἐρημοῦται
  choice: ശൂന്യമാക്കപ്പെടുന്നു
  rationale: നശിപ്പിക്കപ്പെടുക, പാഴാക്കപ്പെടുക, വിജനമാകുക എന്നീ ശക്തമായ ഫലാർഥങ്ങളും ഗ്രീക്കിലെ വ്യാകരണരൂപവും കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: πόλις ἢ οἰκία
  choice: പട്ടണമോ ഭവനമോ
  rationale: πόλις-നെ സ്വാഭാവികമായി ‘പട്ടണം’ എന്നും οἰκία-യെ അതിന്റെ അടിസ്ഥാനാർഥമായ ‘ഭവനം’ എന്നും നൽകുന്നു; രണ്ടാമത്തേതിന് കുടുംബം/വീട്ടുകാർ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: οὐ σταθήσεται
  choice: നിലനിൽക്കുകയില്ല
  rationale: ‘സ്ഥിരമായി തുടരുക, നിലനിൽക്കുക’ എന്ന പ്രയോഗാർഥം സ്വാഭാവികവും വ്യക്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: യേശു അവരുടെ ഉള്ളിലെ ചിന്തകൾ അറിഞ്ഞതിന്റെ സ്വഭാവം
  choice: അവൻ അവരുടെ ചിന്തകൾ അറിഞ്ഞുവെന്ന് മാത്രം പറയുന്നു; ആ അറിവിന്റെ മാർഗം വ്യക്തമാക്കുന്നില്ല.
  alternative: അതീന്ദ്രിയമായ സർവജ്ഞതയാലോ പ്രവാചകീയ ഉൾക്കാഴ്ചയാലോ സാഹചര്യത്തിൽനിന്നുള്ള ഗ്രഹണത്താലോ അറിഞ്ഞുവെന്ന് വ്യക്തമാക്കുക.
  rationale: വാക്യം അറിവിന്റെ യാഥാർഥ്യം പ്രസ്താവിക്കുന്നുവെങ്കിലും അതിന്റെ മാർഗം വിശദീകരിക്കുന്നില്ല; അതിനാൽ വ്യാഖ്യാനാതീതമായ നിർണ്ണയം വിവർത്തനത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക പ്രമാണ മലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. രാജ്യത്തിൽനിന്ന് പട്ടണത്തിലേക്കും ഭവനത്തിലേക്കുമുള്ള രൂപകപരമായ ക്രമം നിലനിർത്തി. ‘അറിഞ്ഞ്’ എന്ന രൂപം അറിവിന്റെ മാർഗത്തെക്കുറിച്ചുള്ള വ്യാഖ്യാനം ഒഴിവാക്കുന്നു; ‘തനിക്കുതന്നെ എതിരായി’ എന്ന ആവർത്തനം രണ്ടു സമാന്തര ഘടകങ്ങളിലും ഗ്രീക്ക് വാചകത്തിന്റെ ഊന്നൽ സംരക്ഷിക്കുന്നു.
