id: MAT.12.50
reference: Matthew 12:50
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅστις γὰρ ἂν ποιήσῃ τὸ θέλημα τοῦ πατρός μου τοῦ ἐν οὐρανοῖς, αὐτός μου ἀδελφὸς καὶ ἀδελφὴ καὶ μήτηρ ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/050.yaml
  text: For whoever does the will of my Father in heaven[a], he is my brother and sister and mother.
translation:
  language: ml
  text: എന്തെന്നാൽ, സ്വർഗത്തിലുള്ള എന്റെ പിതാവിന്റെ ഇഷ്ടം ചെയ്യുന്നവൻ ആരായാലും[a], അവനാണ് എന്റെ സഹോദരനും സഹോദരിയും അമ്മയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘സ്വർഗത്തിലുള്ള എന്റെ പിതാവിന്റെ ഇഷ്ടം ചെയ്യുന്ന ഏതൊരാളും—ആ വ്യക്തിയാണ് എന്റെ സഹോദരനും സഹോദരിയും അമ്മയും.’ ഗ്രീക്കിൽ വ്യാകരണപരമായി പുല്ലിംഗ ഏകവചനരൂപം പൊതുവായ അർഥത്തിലാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις ... ἂν
  choice: ചെയ്യുന്നവൻ ആരായാലും
  rationale: അനിശ്ചിത ബന്ധസർവനാമത്തോടുകൂടിയ ἄν പൊതുവായ, എല്ലാവർക്കും തുറന്ന നിബന്ധന പ്രകടിപ്പിക്കുന്നു. ‘ആരായാലും’ ആ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തോടുള്ള വിശദീകരണബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ποιήσῃ τὸ θέλημα
  choice: ഇഷ്ടം ചെയ്യുന്ന
  rationale: ποιέω + θέλημα എന്ന പ്രയോഗത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ‘അനുസരിക്കുന്ന’ എന്നു വിവർത്തനം ചെയ്താൽ അനുസരണത്തിന്റെ ആശയം കൂടുതൽ വ്യാഖ്യാനാത്മകമായി ചുരുങ്ങാം.
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: സ്വർഗത്തിലുള്ള എന്റെ പിതാവിന്റെ
  rationale: പിതാവുമായുള്ള വ്യക്തിബന്ധവും അവിടുത്തെ സ്വർഗീയ സ്ഥാനവും സ്വാഭാവികമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു. ഗ്രീക്കിലെ ബഹുവചനരൂപമായ οὐρανοῖς മലയാളത്തിലെ പതിവുപ്രയോഗത്തിൽ ഏകവചനമായ ‘സ്വർഗത്തിൽ’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: αὐτός
  choice: അവനാണ്
  rationale: αὐτός നൽകുന്ന ഊന്നൽ ‘-ആണ്’ എന്ന രൂപത്തിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: ἀδελφὸς καὶ ἀδελφὴ καὶ μήτηρ
  choice: സഹോദരനും സഹോദരിയും അമ്മയും
  rationale: ഗ്രീക്ക് പ്രത്യേകം നിരത്തുന്ന മൂന്നു കുടുംബബന്ധങ്ങളും അതേ ക്രമത്തിലും ഏകവചനത്തിലും നിലനിർത്തുന്നു.
theological_decisions:
- issue: പൊതുവായ പ്രസ്താവനയിലെ വ്യാകരണപരമായ പുല്ലിംഗ ഏകവചനം
  choice: ചെയ്യുന്നവൻ ആരായാലും … അവനാണ്
  alternative: ചെയ്യുന്ന ഏതൊരാളും … ആ വ്യക്തിയാണ്
  rationale: ὅστις, αὐτός, ἀδελφός എന്നിവ ഗ്രീക്കിൽ വ്യാകരണപരമായി പുല്ലിംഗ ഏകവചനമാണെങ്കിലും പ്രസ്താവനയുടെ പരിധി പൊതുവായതാണ്. മലയാളത്തിലെ പുല്ലിംഗരൂപം ഉറവിടഘടനയെ പ്രതിഫലിപ്പിക്കുന്നു; ‘സഹോദരി’, ‘അമ്മ’ എന്നീ പദങ്ങൾ ഉൾപ്പെടുന്നതിനാൽ സ്ത്രീകളും പരിധിയിൽ ഉൾപ്പെടുന്നുവെന്നത് വാക്യത്തിൽത്തന്നെ വ്യക്തമാകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അവനാണ്’ എന്നത് αὐτός എന്ന ഊന്നൽസർവനാമത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; കുടുംബബന്ധങ്ങളുടെ വ്യക്തമായ പട്ടിക ചുരുക്കിയിട്ടില്ല.
