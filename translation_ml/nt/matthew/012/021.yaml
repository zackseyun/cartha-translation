  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ τῷ ὀνόματι αὐτοῦ ἔθνη ἐλπιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/021.yaml
  text: and in his name the nations will hope[a].
translation:
  language: ml
  text: അവന്റെ നാമത്തിൽ ജനതകൾ പ്രത്യാശവെക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘വിജാതീയർ അവന്റെ നാമത്തിൽ പ്രത്യാശവെക്കും.’'
    reason: ἔθνη എന്ന ഗ്രീക്ക് പദത്തിന് സന്ദർഭത്തിൽ ‘ജനതകൾ’ എന്നും ‘വിജാതീയർ’ എന്നും അർഥമാകാം.
lexical_decisions:
- source_word: καὶ
  choice: അവന്റെ
  rationale: ഈ വാക്യം മുൻവാക്യത്തിലെ ഉദ്ധരണിയുടെ തുടർച്ചയാണ്. എന്നാൽ ഒറ്റവാക്യമായി സ്വാഭാവികമായ മലയാളം നൽകുമ്പോൾ ആരംഭത്തിലെ καὶ പ്രത്യേകം ‘കൂടാതെ’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് കൃത്രിമമാകുന്നതിനാൽ ബന്ധം വാക്യസന്ദർഭത്തിലൂടെ നിലനിർത്തി.
- source_word: τῷ ὀνόματι αὐτοῦ
  choice: അവന്റെ നാമത്തിൽ
  rationale: ἐλπίζωയോടുകൂടിയ ദത്തിവ് ഇവിടെ പ്രത്യാശയുടെ ആധാരത്തെ സൂചിപ്പിക്കുന്നു. ‘നാമം’ എന്നത് വ്യക്തിയെയും അധികാരത്തെയും പ്രതിനിധീകരിക്കുന്ന ബൈബിൾപരമായ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: ἔθνη
  choice: ജനതകൾ
  rationale: ഇവിടെ ഇസ്രായേലിനു പുറത്തുള്ള വിശാലമായ ജനവിഭാഗങ്ങളിലേക്കുള്ള യെശയ്യാവിന്റെ ദർശനം പ്രധാനമാണ്. ‘ജനതകൾ’ എന്നത് ‘ജാതികൾ’ എന്ന പദത്തിന്റെ സാമൂഹിക അർഥക്കുഴപ്പം ഒഴിവാക്കുകയും nations/peoples എന്ന വ്യാപ്തി സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐλπιοῦσιν
  choice: പ്രത്യാശവെക്കും
  rationale: ഭാവികാല സജീവ നിർദ്ദേശക രൂപത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു. ‘ആശ്രയിക്കും’ എന്നതിനെക്കാൾ ἐλπίζωയുടെ ‘പ്രത്യാശിക്കുക’ എന്ന അർഥവും വാഗ്ദാനത്തിന്റെ ഭാവിമുഖതയും ഇത് വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: മിശിഹായെക്കുറിച്ചുള്ള ഉദ്ധരണിയിൽ ἔθνη എന്നതിന്റെ പരിഭാഷ
  choice: ജനതകൾ
  alternative: വിജാതീയർ
  rationale: ‘ജനതകൾ’ പഴയനിയമ ഉദ്ധരണിയുടെ വിശാലമായ ജനസമൂഹപരമായ ചക്രവാളം സംരക്ഷിക്കുന്നു; അതേസമയം ഇസ്രായേലേതരരെ സൂചിപ്പിക്കുന്ന ‘വിജാതീയർ’ എന്ന സന്ദർഭസാധ്യമായ വായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘പ്രത്യാശവെക്കും’ എന്ന സംയുക്തപ്രയോഗം മൂലപദത്തിന്റെ അർഥം കൃത്യമായി സൂക്ഷിക്കുന്നു; ‘ജനതകൾ’ സാധാരണ വായനക്കാരന് വ്യക്തവും ജാതിവ്യവസ്ഥയുമായി ആശയക്കുഴപ്പമില്ലാത്തതുമാണ്.
