id: MAT.12.20
reference: Matthew 12:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: κάλαμον συντετριμμένον οὐ κατεάξει καὶ λίνον τυφόμενον οὐ σβέσει, ἕως ἂν ἐκβάλῃ εἰς νῖκος τὴν κρίσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/020.yaml
  text: He will not break a bruised reed[a], and he will not extinguish a smoldering wick[b], until he brings justice to victory.
translation:
  language: ml
  text: ചതഞ്ഞ ഞാങ്ങണ അവൻ ഒടിക്കുകയില്ല; പുകഞ്ഞുകൊണ്ടിരിക്കുന്ന തിരി[a] അവൻ കെടുത്തുകയുമില്ല; അവൻ നീതിയെ[b] വിജയത്തിലേക്കു കൊണ്ടുവരുന്നതുവരെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘പുകഞ്ഞുകൊണ്ടിരിക്കുന്ന ചണം.’ വിളക്കുതിരിയായി ഉപയോഗിച്ചിരുന്ന ചണനാരിനെയാണ് ഗ്രീക്ക് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘ന്യായവിധിയെ വിജയത്തിലേക്കു കൊണ്ടുവരുന്നതുവരെ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
lexical_decisions:
- source_word: κάλαμον συντετριμμένον
  choice: ചതഞ്ഞ ഞാങ്ങണ
  rationale: κάλαμος എന്നത് ഞാങ്ങണയെയും συντετριμμένον എന്നത് ചതഞ്ഞതോ തകർന്നതോ ആയ അവസ്ഥയെയും സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള ‘ഒടിക്കുകയില്ല’ എന്ന ക്രിയയോട് യോജിക്കുന്ന വിധത്തിൽ, പൂർണമായി ഒടിഞ്ഞിട്ടില്ലാത്തെങ്കിലും കേടുപറ്റിയ ഞാങ്ങണയുടെ ചിത്രം ‘ചതഞ്ഞ ഞാങ്ങണ’ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: οὐ κατεάξει
  choice: ഒടിക്കുകയില്ല
  rationale: κατάγνυμι എന്ന ക്രിയയുടെ ‘ഒടിക്കുക, മുറിച്ചുകളയുക’ എന്ന അർഥം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: λίνον τυφόμενον
  choice: പുകഞ്ഞുകൊണ്ടിരിക്കുന്ന തിരി
  rationale: λίνον അക്ഷരാർഥത്തിൽ ചണമോ ചണനാരോ ആണെങ്കിലും ഇവിടെ വിളക്കുതിരിയെയാണ് ഉദ്ദേശിക്കുന്നത്. τυφόμενον തീ അണയാറായി പുകയുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു. ആധുനിക വായനക്കാർക്ക് ദൃശ്യം വ്യക്തമായി മനസ്സിലാകാൻ ‘തിരി’ ഉപയോഗിച്ചു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: οὐ σβέσει
  choice: കെടുത്തുകയുമില്ല
  rationale: σβέννυμι എന്നത് തീയോ തിരിയോ കെടുത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. മുൻ നിഷേധത്തോടുള്ള സമാന്തരത ‘-യുമില്ല’ എന്ന രൂപം വ്യക്തമാക്കുന്നു.
- source_word: ἕως ἂν
  choice: -വരെ
  rationale: ഭാവിയിൽ സംഭവിക്കേണ്ട ഒരു നിർണായക പരിധിവരെ മുൻപുള്ള പ്രസ്താവനകൾ നിലനിൽക്കുന്നതായി ഈ ഘടന സൂചിപ്പിക്കുന്നു.
- source_word: ἐκβάλῃ εἰς νῖκος
  choice: വിജയത്തിലെത്തിക്കുക
  rationale: ἐκβάλλω ഇവിടെ പുറത്തേക്കു കൊണ്ടുവരികയോ ഫലപ്രാപ്തിയിലെത്തിക്കുകയോ ചെയ്യുന്നതും εἰς νῖκος വിജയകരമായ അന്തിമഫലവും സൂചിപ്പിക്കുന്നു. ‘വിജയത്തിലെത്തിക്കുക’ ഈ ലക്ഷ്യഗതിയും നിർണായക ഫലവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: τὴν κρίσιν
  choice: നീതി
  rationale: κρίσις എന്നതിന് ‘ന്യായവിധി’ എന്നും ‘നീതി’ എന്നും അർഥമാകാം. യെശയ്യാവിലെ ദാസനെക്കുറിച്ചുള്ള പശ്ചാത്തലത്തിൽ നീതിയുള്ള ക്രമം സ്ഥാപിക്കുന്ന വിശാലമായ ആശയം പ്രകടമാക്കാൻ ‘നീതി’ തിരഞ്ഞെടുത്തു; ‘ന്യായവിധി’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
theological_decisions:
- issue: യെശയ്യാവിലെ ദാസനെക്കുറിച്ചുള്ള ഉദ്ധരണിയിൽ κρίσις എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: നീതി
  alternative: ന്യായവിധി
  rationale: സന്ദർഭം ഒരു വിധിപ്രസ്താവന മാത്രം നടത്തുന്നതിനെക്കാൾ വിശാലമായി ദൈവത്തിന്റെ നീതിയുള്ള ക്രമം ഫലപ്രാപ്തിയിലെത്തിക്കുന്ന ദാസന്റെ ദൗത്യത്തെ സൂചിപ്പിക്കുന്നു. എങ്കിലും ഗ്രീക്ക് പദത്തിലുള്ള ന്യായവിധി എന്ന സാധ്യത അടിക്കുറിപ്പിലൂടെ തുറന്നുവെക്കുന്നു.
- issue: λίνον എന്ന വിളക്കുതിരി-ദൃശ്യത്തിന്റെ അക്ഷരാർഥവും ഉദ്ദേശ്യാർഥവും
  choice: തിരി
  alternative: ചണം / ചണനാർ
  rationale: വിളക്കിൽ ഉപയോഗിച്ചിരുന്ന ചണനാരിനെയാണ് ഗ്രീക്ക് പദം ഇവിടെ സൂചിപ്പിക്കുന്നത്. ‘തിരി’ ഉദ്ദേശിച്ച വസ്തുവിനെ സാധാരണ വായനക്കാർക്ക് ഉടൻ വ്യക്തമാക്കുന്നു; പദത്തിന്റെ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. പ്രവചനാത്മക ദൃശ്യങ്ങളുടെ സമാന്തരഘടന നിലനിർത്തുകയും ഗ്രീക്കിലെ κρίσις എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുകയും ചെയ്തു.
