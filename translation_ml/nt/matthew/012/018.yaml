id: MAT.12.18
reference: Matthew 12:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἰδοὺ ὁ παῖς μου ὃν ᾑρέτισα, ὁ ἀγαπητός μου ⸂εἰς ὃν⸃ εὐδόκησεν ἡ ψυχή μου· θήσω τὸ πνεῦμά μου ἐπ’ αὐτόν, καὶ κρίσιν τοῖς ἔθνεσιν ἀπαγγελεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/018.yaml
  text: Behold[a], my servant whom I have chosen, my beloved in whom my soul has delighted. I will put my Spirit upon him[c][b], and he will proclaim justice to the nations.
translation:
  language: ml
  text: “ഇതാ, ഞാൻ തിരഞ്ഞെടുത്ത എന്റെ ദാസൻ, എന്റെ പ്രിയൻ; അവനിൽ എന്റെ ഉള്ളം പ്രസാദിച്ചിരിക്കുന്നു.[a] ഞാൻ എന്റെ ആത്മാവിനെ അവന്റെമേൽ വെക്കും; അവൻ ജനതകളോട്[c] നീതി[b] പ്രഖ്യാപിക്കും.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അവനിൽ എന്റെ ഉള്ളം ആനന്ദിച്ചു.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “ന്യായവിധി.”
    reason: lexical_alternative
  - marker: c
    text: അഥവാ “ജാതികളോട്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: ഇതാ
  rationale: പ്രവാചക ഉദ്ധരണിയിലെ ശ്രദ്ധ ക്ഷണിക്കുന്ന ശക്തി സ്വാഭാവികവും അല്പം ഉയർന്നതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: παῖς
  choice: ദാസൻ
  rationale: യെശയ്യാവിലെ ദാസനെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ ‘കുട്ടി’ എന്നതിലുപരി ‘ദാസൻ’ എന്ന അർഥമാണ് ഉദ്ദേശിക്കുന്നത്; മൂലപാഠത്തിൽ ഈ പദത്തിലില്ലാത്ത പുത്രത്വഭാഷ ഇതിലൂടെ ചേർക്കുന്നില്ല.
- source_word: ᾑρέτισα
  choice: ഞാൻ തിരഞ്ഞെടുത്ത
  rationale: ദൈവത്തിന്റെ പൂർത്തിയായ തിരഞ്ഞെടുപ്പിനെ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὁ ἀγαπητός μου
  choice: എന്റെ പ്രിയൻ
  rationale: സ്നേഹവും ആദരവും ഒരുമിച്ച് സൂചിപ്പിക്കുന്ന, സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ പ്രയോഗം.
- source_word: εὐδόκησεν ἡ ψυχή μου
  choice: എന്റെ ഉള്ളം പ്രസാദിച്ചിരിക്കുന്നു
  rationale: ‘എന്റെ ആത്മാവ്/പ്രാണൻ’ എന്ന കൃത്രിമമായ പദാനുപദ രൂപത്തിനു പകരം ψυχήയുടെ വ്യക്തിപരമായ ആന്തരികത നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളം; ദൈവിക പ്രസാദത്തിന്റെ ഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: θήσω τὸ πνεῦμά μου ἐπ’ αὐτόν
  choice: ഞാൻ എന്റെ ആത്മാവിനെ അവന്റെമേൽ വെക്കും
  rationale: പ്രവാചക നിയോഗത്തിന്റെ ദൃശ്യഭാഷയും ἐπίയുടെ ‘മേൽ’ എന്ന ബന്ധവും അടുത്തായി നിലനിർത്തുന്നു.
- source_word: κρίσιν
  choice: നീതി
  rationale: ജനതകളിലേക്കുള്ള ദാസന്റെ ദൗത്യത്തിൽ ദൈവത്തിന്റെ നീതിയുക്തമായ ക്രമം എന്ന ആശയം ‘നീതി’ നന്നായി അറിയിക്കുന്നു; ‘ന്യായവിധി’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: τοῖς ἔθνεσιν
  choice: ജനതകളോട്
  rationale: ἔθνηയുടെ വിശാലമായ സർവജനപരമായ വ്യാപ്തി നിലനിർത്തുന്നു; ‘ജാതികളോട്’ എന്ന മറ്റൊരു സാധുവായ രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἀπαγγελεῖ
  choice: പ്രഖ്യാപിക്കും
  rationale: പരസ്യവും ഔപചാരികവുമായ അറിയിപ്പിന്റെ അർഥം പ്രവാചക സന്ദർഭത്തിന് യോജിച്ച രീതിയിൽ നൽകുന്നു.
theological_decisions:
- issue: παῖς എന്ന പദത്തിലെ മശീഹായ ദാസന്റെ തിരിച്ചറിയൽ
  choice: യെശയ്യാവിലെ ദാസഗീതത്തിന്റെ പശ്ചാത്തലമനുസരിച്ച് ‘ദാസൻ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: കുട്ടി; പുത്രൻ
  rationale: ഈ പദം ഇവിടെ ദാസന്റെ പങ്കാണ് മുൻനിർത്തുന്നത്. ‘പുത്രൻ’ എന്നു നൽകുന്നത് ഈ പ്രത്യേക ഗ്രീക്ക് പദത്തിൽ പ്രകടമല്ലാത്ത പുത്രത്വ ഊന്നൽ ചേർക്കും.
- issue: പ്രവാചക ദൗത്യസന്ദർഭത്തിലെ κρίσις
  choice: മുഖ്യപാഠത്തിൽ ‘നീതി’ എന്നു നൽകി.
  alternative: ന്യായവിധി
  rationale: ദാസൻ ജനതകളോട് പ്രഖ്യാപിക്കുന്ന ദൈവത്തിന്റെ നീതിയുക്തമായ ക്രമം ഈ സന്ദർഭത്തിൽ പ്രധാനമാണ്; എങ്കിലും ഗ്രീക്ക് പദത്തിന്റെ ‘ന്യായവിധി’ എന്ന യഥാർഥ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: εὐδόκησεν ἡ ψυχή μου എന്ന മനുഷ്യരൂപക ദൈവഭാഷ
  choice: ‘എന്റെ ഉള്ളം പ്രസാദിച്ചിരിക്കുന്നു’ എന്നു നൽകി.
  alternative: എന്റെ പ്രാണൻ പ്രസാദിച്ചു; ഞാൻ അവനിൽ പ്രസാദിച്ചിരിക്കുന്നു
  rationale: ‘എന്റെ ഉള്ളം’ എന്നു പറയുന്നത് മൂലത്തിലെ വ്യക്തിപരവും വികാരാത്മകവുമായ പ്രയോഗം ഇല്ലാതാക്കാതെ സ്വാഭാവിക മലയാളം നൽകുന്നു; ഇത് ദൈവത്തിന്റെ സ്വഭാവത്തെക്കുറിച്ചുള്ള അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. പ്രവാചക ഉദ്ധരണിയുടെ ഉയർന്ന ശൈലി ‘ഇതാ’യിലും സമാന്തര വാക്യഘടനയിലും നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട വാക്കുകൾക്ക് പിന്നാലെ മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
