id: MAT.12.42
reference: Matthew 12:42
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: βασίλισσα νότου ἐγερθήσεται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινεῖ αὐτήν· ὅτι ἦλθεν ἐκ τῶν περάτων τῆς γῆς ἀκοῦσαι τὴν σοφίαν Σολομῶνος, καὶ ἰδοὺ πλεῖον Σολομῶνος ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/042.yaml
  text: The queen of the South will rise up in the judgment with this generation and will condemn it[a], because she came from the ends of the earth to hear the wisdom of Solomon, and behold[b], something greater than Solomon is here.
translation:
  language: ml
  text: തെക്കിന്റെ രാജ്ഞി[b] ന്യായവിധിയിൽ ഈ തലമുറയോടൊപ്പം എഴുന്നേൽക്കും; അവൾ അതിനെ കുറ്റംവിധിക്കുകയും ചെയ്യും. കാരണം, ശലോമോന്റെ ജ്ഞാനം കേൾക്കാൻ അവൾ ഭൂമിയുടെ അറ്റങ്ങളിൽനിന്ന് വന്നു. ഇതാ, ശലോമോനെക്കാൾ മഹത്തായത് ഇവിടെ ഉണ്ട്[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ശലോമോനെക്കാൾ മഹാനായ ഒരാൾ ഇവിടെ ഉണ്ട്.’ ഗ്രീക്കിൽ നപുംസകലിംഗരൂപമാണ് (‘മഹത്തായത്’) ഉപയോഗിച്ചിരിക്കുന്നത്; യേശുവിലും അവന്റെ ശുശ്രൂഷയിലും സന്നിഹിതമായ അതിശ്രേഷ്ഠമായ മഹത്വത്തിന് ഇത് ഊന്നൽ നൽകാം.
    reason: alternative_reading
  - marker: b
    text: ‘തെക്കിന്റെ രാജ്ഞി’ എന്നത് ശേബാരാജ്ഞിയെ സൂചിപ്പിക്കുന്നു (1 രാജാക്കന്മാർ 10:1–13; 2 ദിനവൃത്താന്തം 9:1–12); എന്നാൽ ഗ്രീക്ക് വാചകത്തിൽ ശേബ എന്ന പേര് വ്യക്തമായി പറയുന്നില്ല.
    reason: cross_reference
lexical_decisions:
- source_word: βασίλισσα νότου
  choice: തെക്കൻ ദേശത്തെ രാജ്ഞി
  rationale: ‘തെക്കിന്റെ രാജ്ഞി’ എന്ന അക്ഷരാർഥത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ശേബയെ മുഖ്യവാചകത്തിൽ നേരിട്ട് ചേർക്കുന്നില്ല.
- source_word: ἐγερθήσεται
  choice: എഴുന്നേറ്റ്
  rationale: ഭാവികാലസന്ദർഭത്തിൽ ‘എഴുന്നേൽക്കും’ എന്ന ആശയം നൽകുന്നു; ഉയിർത്തെഴുന്നേൽപ്പിന്റെയും ന്യായാസനത്തിൽ സാക്ഷിയായി എഴുന്നേൽക്കുന്നതിന്റെയും സാധ്യതകൾ അനാവശ്യമായി വേർതിരിച്ചു തീർപ്പാക്കുന്നില്ല.
- source_word: ἐν τῇ κρίσει
  choice: ന്യായവിധിയിൽ
  rationale: നിശ്ചിതമായ അന്തിമ ന്യായവിധിസന്ദർഭം സംക്ഷിപ്തമായും ഗൗരവത്തോടെയും പ്രകടമാക്കുന്നു.
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: ഈ തലമുറയോടൊപ്പം
  rationale: μετά + genitive എന്ന ഘടനയുടെ സാധാരണ അർഥമായ ‘ഒപ്പം’ നിലനിർത്തുന്നു; എതിർഭാവം തുടർന്നുള്ള കുറ്റംവിധിക്കൽ എന്ന ക്രിയയിൽ നിന്നാണ് വരുന്നത്.
- source_word: κατακρινεῖ αὐτήν
  choice: അതിനെ കുറ്റംവിധിക്കും
  rationale: αὐτήν എന്ന സർവനാമം ‘ഈ തലമുറ’യിലേക്കു തിരിച്ചുപോകുന്നതും κατακρίνωയുടെ കുറ്റംവിധിക്കുക/ശിക്ഷാർഹമെന്നു വിധിക്കുക എന്ന ശക്തിയും നിലനിർത്തുന്നു.
- source_word: ἐκ τῶν περάτων τῆς γῆς
  choice: ഭൂമിയുടെ അറ്റങ്ങളിൽനിന്ന്
  rationale: വളരെ ദൂരെയുള്ള പ്രദേശങ്ങളെ സൂചിപ്പിക്കുന്ന മൂലഭാഷയിലെ പ്രയോഗം മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀκοῦσαι τὴν σοφίαν Σολομῶνος
  choice: ശലോമോന്റെ ജ്ഞാനം കേൾക്കാൻ
  rationale: ലക്ഷ്യം സൂചിപ്പിക്കുന്ന infinitive-ഉം genitive ബന്ധവും നേരായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗൗരവമുള്ള വ്യവഹാരചിഹ്നത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: πλεῖον Σολομῶνος
  choice: ശലോമോനെക്കാൾ മഹത്തായത്
  rationale: നപുംസകലിംഗത്തിലുള്ള πλεῖον എന്ന രൂപം ഒരു പുരുഷവ്യക്തിയെ മാത്രം വ്യക്തമാക്കുന്ന വിധത്തിൽ മാറ്റാതെ, താരതമ്യത്തിന്റെ വിശാലതയും യേശുവിലും അവന്റെ ശുശ്രൂഷയിലും സന്നിഹിതമായ മഹത്വവും നിലനിർത്തുന്നു.
- source_word: ὧδε
  choice: ഇവിടെ ഉണ്ട്
  rationale: സ്ഥലസൂചനയായ ‘ഇവിടെ’യെ മലയാളത്തിൽ പൂർണ്ണവും സ്വാഭാവികവുമായ വാക്യമായി നൽകുന്നു.
theological_decisions:
- issue: πλεῖον എന്ന നപുംസകലിംഗ താരതമ്യരൂപം യേശുവുമായി ബന്ധപ്പെടുത്തി എങ്ങനെ നൽകണം
  choice: ശലോമോനെക്കാൾ മഹത്തായത് ഇവിടെ ഉണ്ട്
  alternative: ശലോമോനെക്കാൾ മഹാനായ ഒരാൾ ഇവിടെ ഉണ്ട്
  rationale: മൂലത്തിലെ നപുംസകലിംഗരൂപം യേശുവിനെയും അവന്റെ സന്നിഹിതമായ ശുശ്രൂഷയെയും ഉൾക്കൊള്ളുന്ന മഹത്വത്തെ സൂചിപ്പിക്കാം. ‘മഹാനായ ഒരാൾ’ എന്നത് സന്ദർഭപരമായി സാധുവായെങ്കിലും വ്യാകരണത്തിലെ തുറന്ന നിലയെ കൂടുതൽ വ്യക്തിപരമായി തീർപ്പാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ ന്യായവിധിഭാവവും πλεῖον എന്ന രൂപത്തിന്റെ യഥാർഥ വ്യാകരണതുറന്ന നിലയും സംരക്ഷിച്ചു. കുറിപ്പുചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദപ്രയോഗങ്ങളോടു ചേർത്തിരിക്കുന്നു.
