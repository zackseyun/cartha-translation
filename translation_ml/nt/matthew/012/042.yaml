    issue: ‘എഴുന്നേറ്റ്’ does not explicitly express the future finite verb.
    rationale: ἐγερθήσεται is future indicative passive. ‘എഴുന്നേൽക്കും’ preserves the future judicial/resurrection-related force without deciding more than the Greek does.
  - severity: low
    issue: ‘തെക്കൻ ദേശത്തെ രാജ്ഞി’ adds ‘land’ and may weaken the genitival designation.
    rationale: βασίλισσα νότου is most directly ‘തെക്കിന്റെ രാജ്ഞി.’ This retains the Greek geographic designation without introducing an unstated noun.
