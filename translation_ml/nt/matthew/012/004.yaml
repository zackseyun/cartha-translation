id: MAT.12.4
reference: Matthew 12:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πῶς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ καὶ τοὺς ἄρτους τῆς προθέσεως ⸂ἔφαγον, ὃ⸃ οὐκ ἐξὸν ἦν αὐτῷ φαγεῖν οὐδὲ τοῖς μετ’ αὐτοῦ, εἰ μὴ τοῖς ἱερεῦσιν μόνοις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/004.yaml
  text: how he entered into the house of God and ate the bread of the Presence[a], which it was not lawful for him to eat, nor for those with him[b], but only for the priests?
translation:
  language: ml
  text: അവൻ ദൈവത്തിന്റെ ഭവനത്തിൽ കടന്നതും സന്നിധിയിലെ അപ്പം[b] അവർ കഴിച്ചതും[a] എങ്ങനെയെന്ന്—ആ അപ്പം കഴിക്കുന്നത് അവനോ അവനോടൊപ്പമുണ്ടായിരുന്നവർക്കോ നിയമപ്രകാരം അനുവദനീയമായിരുന്നില്ല; പുരോഹിതന്മാർക്കു മാത്രമേ അനുവദനീയമായിരുന്നുള്ളൂ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിലും പാഠരൂപങ്ങളിലും ‘അവൻ കഴിച്ചു’ എന്നാണ്.
    reason: textual_variant
  - marker: b
    text: അഥവാ, ‘കാഴ്ചയപ്പം’; ദൈവസന്നിധിയിൽ വെച്ചിരുന്ന വിശുദ്ധ അപ്പം.
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς
  choice: എങ്ങനെയെന്ന്
  rationale: മുൻവാക്യത്തിലെ ‘വായിച്ചിട്ടില്ലേ?’ എന്ന ചോദ്യത്തോട് ഈ വാക്യത്തെ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുകയും ഗ്രീക്കിലെ രീതിസൂചകമായ അർഥം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  choice: അവൻ ദൈവത്തിന്റെ ഭവനത്തിൽ കടന്നതും
  rationale: ‘ദൈവത്തിന്റെ ഭവനം’ എന്ന ഗ്രീക്ക് പ്രയോഗം അതേപടി സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ വിശുദ്ധകൂടാരമാണെന്ന വിശദീകരണം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: τοὺς ἄρτους τῆς προθέσεως
  choice: സന്നിധിയുടെ അപ്പം
  rationale: ദൈവസന്നിധിയിൽ വെച്ചിരുന്ന വിശുദ്ധ അപ്പത്തെ സൂചിപ്പിക്കുന്ന ആരാധനാപരമായ പ്രയോഗം; പരമ്പരാഗതമായ ‘കാഴ്ചയപ്പം’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἔφαγον
  choice: അവർ കഴിച്ചതും
  rationale: SBLGNT-യിലെ ബഹുവചന ക്രിയയെ വ്യക്തമാക്കുന്നു. ഏകവചനമായ ‘അവൻ കഴിച്ചു’ എന്ന പാഠഭേദം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: ὃ οὐκ ἐξὸν ἦν αὐτῷ φαγεῖν
  choice: ആ അപ്പം കഴിക്കുന്നത് അവനു നിയമപ്രകാരം അനുവദനീയമായിരുന്നില്ല
  rationale: ἐξὸν എന്നതിന്റെ നിയമപരവും ആരാധനാനിയമപരവുമായ ശക്തി ‘നിയമപ്രകാരം അനുവദനീയമായിരുന്നില്ല’ എന്ന പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: οὐδὲ τοῖς μετ’ αὐτοῦ
  choice: അവനോടൊപ്പമുണ്ടായിരുന്നവർക്കോ
  rationale: ദാവീദിനോടൊപ്പം ഉണ്ടായിരുന്നവരെ അടുത്തും സ്വാഭാവികവുമായ മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: εἰ μὴ τοῖς ἱερεῦσιν μόνοις
  choice: പുരോഹിതന്മാർക്കു മാത്രമേ അനുവദനീയമായിരുന്നുള്ളൂ
  rationale: εἰ μὴ സൂചിപ്പിക്കുന്ന ഒഴിവും μόνοις സൂചിപ്പിക്കുന്ന ഏകാധികാരവും വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἐξὸν എന്ന പദത്തിന്റെ ആരാധനാനിയമപരമായ ശക്തി
  choice: നിയമപ്രകാരം അനുവദനീയമായിരുന്നില്ല
  alternative: അനുവാദമുണ്ടായിരുന്നില്ല
  rationale: ഇത് സാധാരണ സാമൂഹിക അനുമതിയല്ല, വിശുദ്ധ അപ്പത്തെക്കുറിച്ചുള്ള അംഗീകൃത നിയമപരമായ നിയന്ത്രണമാണെന്ന് വ്യക്തമാക്കുന്നു; എന്നാൽ ഏത് നിയമവിശദാംശമെന്ന് മുഖ്യപാഠത്തിൽ അധികമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- issue: ἔφαγον എന്ന ക്രിയയുടെ വചനവും കർത്താവും
  choice: 'ബഹുവചനം: ‘അവർ കഴിച്ചു’'
  alternative: 'ഏകവചനം: ‘അവൻ കഴിച്ചു’'
  rationale: നൽകിയ SBLGNT പാഠത്തിലെ ബഹുവചനരൂപം മുഖ്യപാഠത്തിൽ പിന്തുടരുന്നു; അർഥത്തെ ബാധിക്കുന്ന ഏകവചന പാഠഭേദം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ആദരപൂർവവുമായ ശൈലി. മുൻവാക്യത്തിൽ ആരംഭിക്കുന്ന ചോദ്യത്തിന്റെ തുടർച്ചയാണെന്ന ഘടന ‘എങ്ങനെയെന്ന്’ എന്നും അവസാനത്തെ ചോദ്യചിഹ്നവുംകൊണ്ട് നിലനിർത്തി. ബഹുവചന ക്രിയ അസ്പഷ്ടമാകാതിരിക്കാൻ ‘അവർ’ വ്യക്തമാക്കി; അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദപ്രയോഗങ്ങൾക്ക് നേരിട്ട് ചേർത്തു.
