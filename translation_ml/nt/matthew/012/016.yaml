  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐπετίμησεν αὐτοῖς ἵνα μὴ φανερὸν αὐτὸν ποιήσωσιν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/016.yaml
  text: And he warned them not to make him known,[a]
translation:
  language: ml
  text: അവനെ പരസ്യമായി അറിയിക്കരുതെന്ന് അവരോട് കർശനമായി നിർദേശിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു പരിഭാഷ: “അവർക്കു കർശനമായ മുന്നറിയിപ്പ് നൽകി” അല്ലെങ്കിൽ “അവരോട് കല്പിച്ചു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: (മലയാളത്തിലെ സ്വാഭാവിക തുടർച്ചയിൽ പ്രത്യേകം പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല)
  rationale: καί കഥാവിവരണത്തെ മുൻവാക്യത്തോട് ബന്ധിപ്പിക്കുന്നു. ഒറ്റവാക്യമായി ഉദ്ധരിക്കുമ്പോൾ ‘പിന്നെ’ എന്ന കാലക്രമസൂചന ചേർക്കുന്നതിനെക്കാൾ മലയാളത്തിൽ ബന്ധകപദം ഒഴിവാക്കുന്നത് സ്വാഭാവികവും അർഥനിഷ്ഠവുമാണ്.
- source_word: ἐπετίμησεν
  choice: കർശനമായി നിർദേശിച്ചു
  rationale: സന്ദർഭത്തിലെ ἵνα μή ഉപവാക്യം ശക്തമായ വിലക്ക്/നിർദേശം വ്യക്തമാക്കുന്നു. ‘ശാസിച്ചു’ എന്നത് തെറ്റ് ചെയ്തതിനുള്ള കുറ്റപ്പെടുത്തൽ അനാവശ്യമായി സൂചിപ്പിക്കാം; ‘കർശനമായി നിർദേശിച്ചു’ ശക്തിയും നിർദേശസ്വഭാവവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: αὐτοῖς
  choice: അവരോട്
  rationale: ദത്തിവ് ബഹുവചന സർവനാമത്തെ ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക ക്രിയാസംബന്ധത്തോടെ അവതരിപ്പിക്കുന്നു.
- source_word: ἵνα μὴ
  choice: അരുതെന്ന്
  rationale: മുന്നിലുള്ള നിർദേശക്രിയയ്ക്കു ശേഷം വിലക്കിന്റെ ഉള്ളടക്കം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: φανερὸν αὐτὸν ποιήσωσιν
  choice: തന്നെ പരസ്യമാക്കുക
  rationale: φανερὸν ποιέω എന്ന പ്രയോഗത്തിന്റെ ‘വെളിപ്പെടുത്തുക/പൊതുവായി അറിയിക്കുക’ എന്ന ആശയം നൽകുന്നു; αὐτόν യേശുവിനെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിലെ പ്രത്യാവർത്തി സർവനാമമായ ‘തന്നെ’ സ്വാഭാവികമാണ്.
theological_decisions:
- issue: യേശുവിന്റെ നിർദേശത്തിന്റെ ശക്തിയും സ്വഭാവവും
  choice: പരസ്യമാക്കരുതെന്ന കർശന നിർദേശം
  alternative: അവരെ ശാസിക്കൽ; ഔപചാരികമായി കല്പിക്കൽ
  rationale: ἐπιτιμάω ശക്തമായ മുന്നറിയിപ്പോ നിർദേശമോ ശാസനയോ സൂചിപ്പിക്കാം. ഇവിടെ തുടർന്നുവരുന്ന വിലക്കാണ് പ്രധാനം; ആളുകൾ ധാർമ്മിക തെറ്റ് ചെയ്തുവെന്നോ ഈ രഹസ്യവത്കരണത്തിന്റെ ദൈവശാസ്ത്രപരമായ കാരണം എന്തെന്നോ വാക്യം പറയുന്നില്ല. അതിനാൽ വിവർത്തനം ആ വിശദീകരണങ്ങൾ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘പരസ്യമാക്കുക’ എന്നത് ഇവിടെ യേശുവിനെ പൊതുവായി അറിയിക്കുക/വെളിപ്പെടുത്തുക എന്ന അർഥത്തിലാണ്. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
