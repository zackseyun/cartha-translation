revisions:
- from: തന്നെ പരസ്യമാക്കരുതെന്ന് അവരോട് കർശനമായി നിർദേശിച്ചു.[a]
  to: അവനെ പരസ്യമായി അറിയിക്കരുതെന്ന് അവരോട് കർശനമായി നിർദേശിച്ചു.[a]
  rationale: The revision resolves the possible reflexive ambiguity of ‘തന്നെ’ by using ‘അവനെ’ and expresses the disclosure/publicity sense of φανερὸν ποιεῖν with ‘പരസ്യമായി അറിയിക്കുക.’ It retains the draft’s appropriately strong but non-interpretive rendering of ἐπετίμησεν.
