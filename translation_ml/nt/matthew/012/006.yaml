  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι τοῦ ἱεροῦ μεῖζόν ἐστιν ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/006.yaml
  text: But I tell you that something greater than the temple is here[a][b].
translation:
  language: ml
  text: 'എന്നാൽ ഞാൻ നിങ്ങളോടു പറയുന്നു: ദൈവാലയത്തെക്കാൾ വലിയതൊന്ന് ഇവിടെ ഉണ്ട്[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ദൈവാലയത്തെക്കാൾ വലിയ ഒരാൾ ഇവിടെ ഉണ്ട്’ എന്നോ ‘ദൈവാലയത്തെക്കാൾ വലിയവൻ ഇവിടെ ഉണ്ട്’ എന്നോ. ഗ്രീക്കിൽ ‘വലിയതൊന്ന്’ എന്നത് നപുംസകലിംഗരൂപത്തിലാണ്; അത് ആരെയോ എന്തിനെയോ സൂചിപ്പിക്കുന്നുവെന്ന് വ്യാകരണപരമായി വ്യക്തമാക്കിയിട്ടില്ല.
    reason: alternative_reading
  - marker: b
    text: അല്ലെങ്കിൽ, ‘ഈ സ്ഥലത്ത്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: എന്നാൽ ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: δέ മുൻവാദത്തോടുള്ള നേരിയ വൈരുധ്യം സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ സ്വാഭാവികമാണ്; λέγω ὑμῖν എന്ന നേരിട്ടുള്ള അഭിസംബോധനയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: τοῦ ἱεροῦ
  choice: ദൈവാലയത്തെക്കാൾ
  rationale: ἱερόν ഇവിടെ അകത്തെ വിശുദ്ധമന്ദിരത്തെ മാത്രം അല്ല, ദൈവാലയസമുച്ചയത്തെ പൊതുവായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ദൈവാലയം’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: μεῖζόν
  choice: വലിയ ഒന്ന്
  rationale: നപുംസകലിംഗ ഏകവചനമായ താരതമ്യരൂപം സ്വതന്ത്ര നാമപ്രയോഗമായി വന്നിരിക്കുന്നു. സൂചിതവിഷയം ഗ്രീക്കിൽ തുറന്നുപറയാത്തതിനാൽ ‘ഒന്ന്’ ആ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു.
- source_word: ἐστιν
  choice: ഉണ്ട്
  rationale: സാന്നിധ്യം സൂചിപ്പിക്കുന്ന ലളിതമായ വർത്തമാനകാല പ്രയോഗത്തിന് സ്വാഭാവിക മലയാളരൂപം.
- source_word: ὧδε
  choice: ഇവിടെ
  rationale: ‘ഇവിടെ’ എന്ന സ്ഥലസൂചക ക്രിയാവിശേഷണം ഗ്രീക്ക് പദത്തിന്റെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ തുല്യപ്രയോഗമാണ്.
theological_decisions:
- issue: നപുംസകലിംഗ താരതമ്യരൂപമായ μεῖζόν സൂചിപ്പിക്കുന്നതിന്റെ വ്യക്തിത്വം
  choice: പ്രധാനവാക്യത്തിൽ ‘വലിയ ഒന്ന്’ എന്ന് വ്യക്തിനിരപേക്ഷമായി പരിഭാഷപ്പെടുത്തുക.
  alternative: ‘ദൈവാലയത്തെക്കാൾ വലിയ ഒരാൾ ഇവിടെ ഉണ്ട്’ അല്ലെങ്കിൽ ‘ദൈവാലയത്തെക്കാൾ വലിയവൻ ഇവിടെ ഉണ്ട്.’
  rationale: സന്ദർഭം യേശുവിനെയും അവന്റെ അധികാരത്തെയും ശക്തമായി ചൂണ്ടിക്കാണിക്കുന്നുവെങ്കിലും, ഗ്രീക്ക് പാഠം പുരുഷലിംഗരൂപം ഉപയോഗിക്കുന്നില്ല. അതിനാൽ സൂചിതവിഷയത്തെ പ്രധാനവാക്യത്തിൽ വ്യക്തിയെന്നു നിർബന്ധമായി നിർവചിക്കാതെ മൂലപാഠത്തിന്റെ വ്യാകരണപരമായ അനിശ്ചിതത്വവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. ‘വലിയ ഒന്ന്’ എന്ന പ്രയോഗം അല്പം അടയാളപ്പെടുത്തിയതാണെങ്കിലും മൂലഗ്രീക്കിലെ ഉദ്ദേശ്യപൂർവമായ അനിശ്ചിതത്വം സംരക്ഷിക്കാൻ തിരഞ്ഞെടുത്തു.
