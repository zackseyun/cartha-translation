  text: ⸂εἶπεν δέ τις αὐτῷ· Ἰδοὺ ἡ μήτηρ σου καὶ οἱ ἀδελφοί σου ἔξω ἑστήκασιν, ζητοῦντές σοι λαλῆσαι.⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/047.yaml
  text: Then someone said to him[a], “Look, your mother and your brothers are standing outside, seeking to speak to you.”
translation:
  language: ml
  text: 'അപ്പോൾ ഒരാൾ അവനോട് പറഞ്ഞു[a]: “ഇതാ, നിന്റെ അമ്മയും സഹോദരന്മാരും നിന്നോടു സംസാരിക്കാൻ അന്വേഷിച്ചുകൊണ്ട് പുറത്തു നിൽക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ഈ വാക്യം ഇല്ല.
    reason: textual_variant
lexical_decisions:
- source_word: εἶπεν δέ τις αὐτῷ
  choice: അപ്പോൾ ഒരാൾ അവനോട് പറഞ്ഞു
  rationale: δέ ഇവിടെ നേരിയ ആഖ്യാനബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവികമായ ‘അപ്പോൾ’ ഉപയോഗിച്ചു; τις അനിശ്ചിതമായതിനാൽ ‘ഒരാൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: Ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്നതും ചൂണ്ടിക്കാണിക്കുന്നതുമായ ἰδούയുടെ ഭാവം ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ ‘ഇതാ’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἡ μήτηρ σου
  choice: നിന്റെ അമ്മ
  rationale: സാധാരണ ഉടമസ്ഥതാസംബന്ധമായ പ്രയോഗത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: οἱ ἀδελφοί σου
  choice: നിന്റെ സഹോദരന്മാർ
  rationale: സന്ദർഭത്തിൽ പുരുഷബന്ധുക്കളെ സൂചിപ്പിക്കുന്ന ബഹുവചനം ആയതിനാൽ ലിംഗസൂചന നിലനിർത്തി; ‘സഹോദരങ്ങൾ’ എന്ന പൊതുപദം ഒഴിവാക്കി.
- source_word: ἔξω ἑστήκασιν
  choice: പുറത്തു നിൽക്കുന്നു
  rationale: ἵστημι എന്ന ക്രിയയുടെ പൂർണ്ണകാലരൂപം ഇപ്പോഴുള്ള നിലയെ സൂചിപ്പിക്കുന്നു; ‘നിൽക്കുന്നു’ അതു സ്വാഭാവികമായി നൽകുകയും ἔξωയെ വ്യക്തമായി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ζητοῦντές
  choice: ആഗ്രഹിച്ച്
  rationale: ζητέω ഇവിടെ ആരെയെങ്കിലും അന്വേഷിക്കുക എന്നതിലുപരി സംസാരിക്കാനുള്ള ഉദ്ദേശമോ ആഗ്രഹമോ സൂചിപ്പിക്കുന്നു; ‘ആഗ്രഹിച്ച്’ മലയാളത്തിൽ സ്വാഭാവികമായി പങ്കാളിക്രിയാഭാവം നിലനിർത്തുന്നു.
- source_word: σοι λαλῆσαι
  choice: നിന്നോടു സംസാരിക്കാൻ
  rationale: ദത്തിവോടുകൂടിയ λαλῆσαιയുടെ ബന്ധപരമായ ഭാവം ‘നിന്നോടു സംസാരിക്കാൻ’ എന്ന പ്രയോഗം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: മത്തായി 12:47-ന്റെ പാഠവിമർശനസ്ഥിതി
  choice: നൽകിയിരിക്കുന്ന SBLGNT പാഠത്തെ അനുസരിച്ച് വാക്യം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി; ചില കൈയെഴുത്തുപ്രതികളിൽ ഇത് ഇല്ലെന്ന വിവരം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
  alternative: ചില സാക്ഷ്യങ്ങളിൽ ഇല്ലാത്തതിനാൽ വാക്യം ഒഴിവാക്കുക.
  rationale: നൽകിയിരിക്കുന്ന മൂലഭാഷാപാഠത്തിൽ വാക്യം ഉണ്ടായിരിക്കുമ്പോഴും അതിന്റെ പാഠവ്യത്യാസം പ്രധാനമാണ്. അതിനാൽ വാക്യം മൗനമായി ഒഴിവാക്കുകയോ പാഠവ്യത്യാസം മറയ്ക്കുകയോ ചെയ്യാതെ രണ്ടും സുതാര്യമായി സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായതും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഇതാ’ ശ്രദ്ധക്ഷണത്തിന്റെ ഭാവം നിലനിർത്തുന്നു; ‘സഹോദരന്മാർ’ മൂലപാഠത്തിലെ പുരുഷബഹുവചനത്തെ കൃത്യമായി പ്രതിഫലിപ്പിക്കുന്നു.
