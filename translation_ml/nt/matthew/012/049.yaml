id: MAT.12.49
reference: Matthew 12:49
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐκτείνας τὴν χεῖρα αὐτοῦ ἐπὶ τοὺς μαθητὰς αὐτοῦ εἶπεν· Ἰδοὺ ἡ μήτηρ μου καὶ οἱ ἀδελφοί μου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/049.yaml
  text: And stretching out his hand toward his disciples[a], he said, “Behold[b], my mother and my brothers.”
translation:
  language: ml
  text: 'അവൻ തന്റെ ശിഷ്യന്മാരുടെ നേരെ കൈ നീട്ടിക്കൊണ്ട് പറഞ്ഞു: “ഇതാ[a], എന്റെ അമ്മയും എന്റെ സഹോദരന്മാരും[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നോക്കൂ” അല്ലെങ്കിൽ “കാണുക” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “സഹോദരന്മാർ”; പുല്ലിംഗ ബഹുവചനം “സഹോദരീസഹോദരന്മാർ” എന്ന് വിപുലീകരിക്കാതെ ഇവിടെ നിലനിർത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκτείνας
  choice: കൈ നീട്ടിക്കൊണ്ട്
  rationale: പ്രധാന ക്രിയയ്ക്കു മുമ്പുള്ള അനുബന്ധ ശാരീരിക പ്രവൃത്തിയെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ഗ്രീക്കിലെ അയോറിസ്റ്റ് കൃദന്തരൂപത്തിന്റെ ബന്ധം നിലനിർത്തുന്നു.
- source_word: χεῖρα
  choice: കൈ
  rationale: ഈ ആംഗ്യസന്ദർഭത്തിലെ സാധാരണവും കൃത്യവുമായ അർഥം ‘കൈ’ എന്നതാണ്.
- source_word: ἐπὶ
  choice: നേരെ
  rationale: കർമകാരകത്തോടുകൂടിയ ἐπί ഇവിടെ ശിഷ്യന്മാരിലേക്കുള്ള ആംഗ്യത്തിന്റെ ദിശ സൂചിപ്പിക്കുന്നു.
- source_word: μαθητὰς
  choice: ശിഷ്യന്മാർ
  rationale: ഗുരു–ശിഷ്യബന്ധം സംരക്ഷിക്കുന്ന, സുവിശേഷസന്ദർഭത്തിൽ സ്ഥാപിതമായ മലയാളപദമാണ്.
- source_word: Ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും പിന്നാലെ പറയുന്നതിന് ഊന്നൽ നൽകുകയും ചെയ്യുന്ന ἰδούയുടെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളരൂപം.
- source_word: μήτηρ
  choice: അമ്മ
  rationale: സാധാരണ കുടുംബബന്ധപദം സ്വാഭാവിക മലയാളത്തിൽ നേരിട്ട് നൽകുന്നു.
- source_word: ἀδελφοί
  choice: സഹോദരന്മാർ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചനം നിലനിർത്തുന്നു; മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്ത ‘സഹോദരീസഹോദരന്മാർ’ എന്ന ഉൾക്കൊള്ളുന്ന വിപുലീകരണം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: യേശു ശിഷ്യന്മാരെ തന്റെ യഥാർഥ ബന്ധുക്കളായി തിരിച്ചറിയുന്നതിലെ കുടുംബബന്ധഭാഷ
  choice: ‘അമ്മ’, ‘സഹോദരന്മാർ’ എന്നീ വ്യക്തമായ കുടുംബബന്ധപദങ്ങൾ നിലനിർത്തുക
  alternative: ‘കുടുംബം’ എന്ന പൊതുപദമോ ‘സഹോദരീസഹോദരന്മാർ’ എന്ന വിപുലീകരണമോ ഉപയോഗിക്കുക
  rationale: മൂലവാക്യത്തിലെ ദൃശ്യവും വാചികവുമായ ഊന്നൽ ഈ കൃത്യമായ ബന്ധപദങ്ങളിലാണ്; പൊതുവാക്കുന്നത് അതിന്റെ പ്രഭാവം കുറയ്ക്കുകയും വ്യാഖ്യാനം പാഠത്തിലേക്ക് ചേർക്കുകയും ചെയ്യും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. ‘ഇതാ’ ശ്രദ്ധാകർഷകമായ ശൈലി നിലനിർത്തുന്നു; ‘കൈ നീട്ടിക്കൊണ്ട്’ ആംഗ്യവും പ്രധാന പ്രസ്താവനയും തമ്മിലുള്ള ബന്ധം വ്യക്തമാക്കുന്നു.
