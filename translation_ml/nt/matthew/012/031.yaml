id: MAT.12.31
reference: Matthew 12:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διὰ τοῦτο λέγω ὑμῖν, πᾶσα ἁμαρτία καὶ βλασφημία ἀφεθήσεται τοῖς ἀνθρώποις, ἡ δὲ τοῦ πνεύματος βλασφημία οὐκ ⸀ἀφεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/031.yaml
  text: Therefore I tell you[a], every sin and blasphemy will be forgiven people[b], but blasphemy against the Spirit will not be forgiven.
translation:
  language: ml
  text: 'അതുകൊണ്ട് ഞാൻ നിങ്ങളോടു പറയുന്നു: മനുഷ്യരുടെ ഏതു പാപവും ദൈവദൂഷണവും ക്ഷമിക്കപ്പെടും; എന്നാൽ ആത്മാവിനെതിരെയുള്ള ദൈവദൂഷണം[a] ക്ഷമിക്കപ്പെടുകയില്ല.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പരിശുദ്ധാത്മാവിനെതിരെയുള്ള ദൈവദൂഷണം.’ ഈ വാക്യത്തിൽ ‘ആത്മാവ്’ എന്നു മാത്രമാണുള്ളത്; എന്നാൽ സമീപസന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത് പരിശുദ്ധാത്മാവിനെയാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: അതുകൊണ്ട്
  rationale: മുൻസന്ദർഭത്തിൽനിന്നുള്ള നിഗമനബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: നേരിട്ടുള്ള അഭിസംബോധനയും പ്രസ്താവനയുടെ ഗൗരവവും നിലനിർത്തുന്ന സ്വാഭാവിക പ്രയോഗം.
- source_word: πᾶσα ἁμαρτία καὶ βλασφημία
  choice: ഏതു പാപവും ദൈവദൂഷണവും
  rationale: πᾶσα എന്നതിന്റെ വിതരണാർഥം ‘ഏതു ...വും’ എന്ന ഘടനയിൽ സ്വാഭാവികമായി നൽകുന്നു; ദൈവത്തിനെതിരായ നിന്ദാഭാഷണം സൂചിപ്പിക്കുന്ന സന്ദർഭത്തിൽ βλασφημίαയ്ക്ക് ‘ദൈവദൂഷണം’ കൃത്യമാണ്.
- source_word: ἀφεθήσεται τοῖς ἀνθρώποις
  choice: മനുഷ്യരുടെ ... ക്ഷമിക്കപ്പെടും
  rationale: ദാതൃവിഭക്തി ക്ഷമ ലഭിക്കുന്ന മനുഷ്യരെ സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിലെ കർമണി നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ അസ്വാഭാവികമായ ‘മനുഷ്യർക്കു പാപം ക്ഷമിക്കപ്പെടും’ എന്ന ക്രമം ഒഴിവാക്കാൻ ബന്ധസൂചകഘടന ഉപയോഗിച്ചു.
- source_word: ἡ δὲ τοῦ πνεύματος βλασφημία
  choice: എന്നാൽ ആത്മാവിനെതിരെയുള്ള ദൈവദൂഷണം
  rationale: ജനിറ്റീവ് ഇവിടെ ദൈവദൂഷണത്തിന്റെ ലക്ഷ്യത്തെ സൂചിപ്പിക്കുന്നതായി സന്ദർഭം വ്യക്തമാക്കുന്നു. മൂലപാഠത്തിൽ ἁγίου ഇല്ലാത്തതിനാൽ പ്രധാനവാചകത്തിൽ ‘പരിശുദ്ധ’ ചേർത്തിട്ടില്ല.
- source_word: οὐκ ἀφεθήσεται
  choice: ക്ഷമിക്കപ്പെടുകയില്ല
  rationale: ഭാവികാല കർമണിയുടെ നിഷേധം വ്യക്തവും ഗൗരവപൂർണവുമായി നൽകുന്നു.
theological_decisions:
- issue: πνεύματος എന്നത് ‘ആത്മാവ്’ എന്നോ ‘പരിശുദ്ധാത്മാവ്’ എന്നോ പരിഭാഷപ്പെടുത്തുക
  choice: ആത്മാവ്
  alternative: പരിശുദ്ധാത്മാവ്
  rationale: ഈ വാക്യത്തിലെ ഗ്രീക്ക് പാഠത്തിൽ ‘പരിശുദ്ധ’ എന്ന വിശേഷണം ഇല്ല. സമീപസന്ദർഭം സൂചിപ്പിക്കുന്ന വ്യക്തി പരിശുദ്ധാത്മാവാണെങ്കിലും, മൂലപാഠത്തിന്റെ സംക്ഷിപ്തത പ്രധാനവാചകത്തിൽ നിലനിർത്തി വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകി.
- issue: τοῦ πνεύματος എന്ന ജനിറ്റീവിന്റെ ബന്ധം
  choice: ആത്മാവിനെതിരെയുള്ള
  alternative: ആത്മാവിന്റെ ദൈവദൂഷണം
  rationale: സന്ദർഭത്തിൽ ആത്മാവാണ് ദൈവദൂഷണത്തിന്റെ കർത്താവല്ല, ലക്ഷ്യം. അതിനാൽ ലക്ഷ്യാർഥം വ്യക്തമായി പ്രകടിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ദൈവദൂഷണം’ സാധാരണ വായനക്കാർക്ക് പരിചിതമായ ദൈവശാസ്ത്രപദമായതിനാൽ നിലനിർത്തി. ആദ്യ ഉപവാക്യത്തിൽ മലയാളത്തിന്റെ സ്വാഭാവിക വാക്യക്രമത്തിനായി ‘മനുഷ്യരുടെ’ എന്ന ബന്ധസൂചക രൂപം ഉപയോഗിച്ചെങ്കിലും ഗ്രീക്കിലെ ക്ഷമയുടെ മനുഷ്യസ്വീകർത്താക്കളെന്ന അർഥം സംരക്ഷിച്ചു.
