id: MAT.12.11
reference: Matthew 12:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Τίς ⸀ἔσται ἐξ ὑμῶν ἄνθρωπος ὃς ἕξει πρόβατον ἕν, καὶ ἐὰν ἐμπέσῃ τοῦτο τοῖς σάββασιν εἰς βόθυνον, οὐχὶ κρατήσει αὐτὸ καὶ ἐγερεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/011.yaml
  text: But he said to them[a], “Which man among you, if he has one sheep and it falls into a pit on the Sabbath[b], will not take hold of it and lift it out?”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “നിങ്ങളിൽ ഒരു ആടുള്ള ഏതു മനുഷ്യനാണ്, അത് ശബ്ബത്തിൽ ഒരു കുഴിയിൽ വീണാൽ, അതിനെ പിടിച്ച് ഉയർത്താതിരിക്കുക?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അതിനെ പിടിച്ച് പുറത്തേക്ക് ഉയർത്താതിരിക്കുക?”
    reason: ἐγερεῖ എന്ന ക്രിയയ്ക്ക് ഇവിടെ കുഴിയിൽനിന്ന് ഉയർത്തി പുറത്തുകൊണ്ടുവരുക എന്ന സന്ദർഭാർഥവും ഉണ്ടായേക്കാം.
lexical_decisions:
- source_word: Τίς ἔσται ἐξ ὑμῶν ἄνθρωπος
  choice: നിങ്ങളിൽ ഒരാൾ
  rationale: പ്രതീക്ഷിക്കുന്ന ഉത്തരം ‘തീർച്ചയായും ചെയ്യും’ എന്നതായ വാചാടോപചോദ്യം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു. ἄνθρωπος ഇവിടെ ഒരു മാതൃകാപരമായ വ്യക്തിയെ സൂചിപ്പിക്കുന്നു.
- source_word: ἕξει πρόβατον ἕν
  choice: ഒരു ആടുണ്ടെന്നിരിക്കട്ടെ
  rationale: ഭാവികാലരൂപമായ ἕξει സങ്കൽപ്പിത സാഹചര്യത്തിനുള്ളിലാണ്; മലയാളത്തിലെ ‘ഉണ്ടെന്നിരിക്കട്ടെ’ ആ സാഹചര്യം സ്വാഭാവികമായി വ്യക്തമാക്കുകയും πρόβατον ἕν എന്ന ഏകവചന ഊന്നൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐὰν ἐμπέσῃ τοῦτο
  choice: അത് ... വീണാൽ
  rationale: ആടിനെ സൂചിപ്പിക്കുന്ന τοῦτο ‘അത്’ എന്നും നിബന്ധനാസൂചകമായ ἐὰν സഹിതമുള്ള ഉപവാക്യം ‘വീണാൽ’ എന്നും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τοῖς σάββασιν
  choice: ശബ്ബത്തിൽ
  rationale: ഗ്രീക്കിലെ ബഹുവചനരൂപം ശബ്ബത്ത് ദിവസത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗപരമായ രൂപമാണ്; മലയാളത്തിൽ ഏകവചനം അർത്ഥം വ്യക്തമായി നൽകുന്നു.
- source_word: εἰς βόθυνον
  choice: ഒരു കുഴിയിൽ
  rationale: βόθυνος എന്നത് കുഴിയെയോ ആഴമുള്ള പൊത്തെയോ സൂചിപ്പിക്കുന്നു; ‘കുഴി’ അനാവശ്യമായ പ്രത്യേകീകരണം ഒഴിവാക്കുന്ന സാധാരണ പദമാണ്.
- source_word: οὐχὶ κρατήσει αὐτὸ καὶ ἐγερεῖ
  choice: അയാൾ അതിനെ പിടിച്ച് ഉയർത്തുകയില്ലേ?
  rationale: οὐχί അനുകൂല ഉത്തരം പ്രതീക്ഷിക്കുന്ന ചോദ്യം അടയാളപ്പെടുത്തുന്നു. κρατέωയുടെ ഉറച്ചുപിടിക്കൽ ‘പിടിച്ച്’ എന്നും ἐγείρωയുടെ മുകളിലേക്കുയർത്തൽ ‘ഉയർത്തുക’ എന്നും നൽകുന്നു; ‘പുറത്തെടുക്കുക’ എന്നത് സന്ദർഭത്തിൽ ഉൾക്കൊള്ളാമെങ്കിലും ഗ്രീക്കിൽ തുറന്നുപറയാത്തതിനാൽ മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: പ്രതിനിധിപരമായ ἄνθρωπος
  choice: നിങ്ങളിൽ ഒരാൾ
  alternative: നിങ്ങളിൽ ഏതു മനുഷ്യൻ
  rationale: ഇവിടെ ലിംഗം തന്നെയല്ല വാദത്തിന്റെ കേന്ദ്രം; ശ്രോതാക്കളിൽ ഒരാളെ മാതൃകയാക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ പ്രവർത്തനം ‘ഒരാൾ’ മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- issue: ശബ്ബത്തിന്റെ ബഹുവചനരൂപം
  choice: ശബ്ബത്തിൽ
  alternative: ശബ്ബത്തുകളിൽ
  rationale: τοῖς σάββασιν എന്ന ബഹുവചനം ഈ സന്ദർഭത്തിൽ ശബ്ബത്ത് ദിവസത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗപരമായ രൂപമാണ്. അക്ഷരാർഥ ബഹുവചനം മലയാളത്തിൽ പല ശബ്ബത്തുകളെന്ന തെറ്റായ ധാരണ സൃഷ്ടിക്കാം.
- issue: ἐγερεῖ എന്നതിലെ സന്ദർഭാർഥം
  choice: ഉയർത്തുക
  alternative: പുറത്തേക്കു ഉയർത്തുക / പുറത്തെടുക്കുക
  rationale: ക്രിയയുടെ അടിസ്ഥാനാർഥം സംരക്ഷിച്ച്, കുഴിയിൽനിന്ന് പുറത്തേക്കാണെന്ന സന്ദർഭസൂചന വായനക്കാരന് തുറന്നുവെക്കുന്നു; കൂടുതൽ വ്യക്തമായ സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വാചകരീതി. വാചാടോപചോദ്യത്തിന്റെ അനുകൂല ഉത്തരപ്രതീക്ഷ ‘ഉയർത്തുകയില്ലേ?’ എന്ന രൂപത്തിൽ നിലനിർത്തി. മുഖ്യവാചകത്തിലെ എല്ലാ അടിക്കുറിപ്പുകളും [a] രൂപത്തിൽ അടയാളപ്പെടുത്തിയിരിക്കുന്നു.
