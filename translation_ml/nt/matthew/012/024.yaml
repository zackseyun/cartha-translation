revisions:
- from: 'എന്നാൽ പരീശന്മാർ അതു കേട്ടപ്പോൾ പറഞ്ഞു: “ഭൂതങ്ങളുടെ അധിപതിയായ ബെയെൽസെബൂലിനെക്കൊണ്ടല്ലാതെ[a] ഇവൻ ഭൂതങ്ങളെ പുറത്താക്കുന്നില്ല.”'
  to: 'എന്നാൽ പരീശന്മാർ അതു കേട്ടപ്പോൾ പറഞ്ഞു: “ഈ മനുഷ്യൻ ഭൂതങ്ങളെ പുറത്താക്കുന്നത് ഭൂതങ്ങളുടെ അധിപതിയായ ബെയെൽസെബൂലിനാൽ അല്ലാതെ അല്ല.”'
  rationale: The revision preserves the Greek accusation—he casts out demons only by Beelzebul—while using a more idiomatic Malayalam expression of means. “ഈ മനുഷ്യൻ” reflects the hostile demonstrative Οὗτος without introducing interpretation. The footnote remains anchored to the name; in typesetting, marker [a] should follow “ബെയെൽസെബൂൽ.”
