id: MAT.12.24
reference: Matthew 12:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι ἀκούσαντες εἶπον· Οὗτος οὐκ ἐκβάλλει τὰ δαιμόνια εἰ μὴ ἐν τῷ Βεελζεβοὺλ ἄρχοντι τῶν δαιμονίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/024.yaml
  text: But when the Pharisees heard it[a], they said, “This man does not cast out demons except by Beelzebul, the ruler of the demons.”
translation:
  language: ml
  text: 'എന്നാൽ പരീശന്മാർ അതു കേട്ടപ്പോൾ പറഞ്ഞു: “ഈ മനുഷ്യൻ ഭൂതങ്ങളെ പുറത്താക്കുന്നത് ഭൂതങ്ങളുടെ അധിപതിയായ ബെയെൽസെബൂലിനാൽ അല്ലാതെ അല്ല.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭത്തിലെ അനുകൂല പ്രതികരണത്തോടുള്ള വൈരുധ്യം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἀκούσαντες
  choice: അതു കേട്ടപ്പോൾ
  rationale: ഭൂതബാധിതന്റെ സൗഖ്യത്തെക്കുറിച്ചുള്ള മുൻസന്ദർഭത്തിൽനിന്ന് സൂചിതമായ കർമം ചേർത്ത്, കാലസൂചനയുള്ള കൃദ്‌രൂപം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: Οὗτος
  choice: ഇവൻ
  rationale: യേശുവിനെക്കുറിച്ചുള്ള പരീശന്മാരുടെ നിന്ദാസൂചകമായ അകലം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἐκβάλλει τὰ δαιμόνια
  choice: ഭൂതങ്ങളെ പുറത്താക്കുന്നില്ല
  rationale: ഭൂതോച്ചാടനസന്ദർഭത്തിലെ ക്രിയയുടെയും കർമത്തിന്റെയും നേരിട്ടുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ വിവർത്തനം.
- source_word: εἰ μὴ
  choice: അല്ലാതെ
  rationale: ആരോപിക്കപ്പെടുന്ന ഏക മാർഗമോ ശക്തിയോ എന്ന ഒഴിവാക്കൽ അർഥം കൃത്യമായി നൽകുന്നു.
- source_word: ἐν τῷ Βεελζεβοὺλ
  choice: ബെയെൽസെബൂലിനെക്കൊണ്ട്
  rationale: ἐν ഇവിടെ ഉപാധിയെയോ പ്രവർത്തകശക്തിയെയോ സൂചിപ്പിക്കുന്നു; മൂലത്തിൽ വ്യക്തമാക്കാത്ത ‘ശക്തിയാൽ’ എന്ന പദം ചേർക്കാതെ ആരോപണം അവതരിപ്പിക്കുന്നു.
- source_word: Βεελζεβοὺλ
  choice: ബെയെൽസെബൂൽ
  rationale: SBLGNT-യിലെ ഗ്രീക്ക് നാമരൂപം മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: ἄρχοντι τῶν δαιμονίων
  choice: ഭൂതങ്ങളുടെ അധിപതി
  rationale: ἄρχων സൂചിപ്പിക്കുന്ന അധികാരവും മേൽക്കോയ്മയും ആധുനികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: Οὗτος എന്ന നിന്ദാസൂചക സർവനാമത്തിന്റെ അവതരണം
  choice: ഇവൻ
  alternative: ഈ മനുഷ്യൻ / അവൻ
  rationale: പരീശന്മാരുടെ അവജ്ഞാഭാവം നിലനിർത്തുന്നു; അതേസമയം മൂലത്തിൽ ഇല്ലാത്ത ദൈവശാസ്ത്രപരമായ വിലയിരുത്തൽ ചേർക്കുന്നില്ല.
- issue: Βεελζεβούλ എന്ന നാമരൂപം
  choice: ബെയെൽസെബൂൽ
  alternative: ബെയെൽസെബൂബ്
  rationale: പ്രധാനപാഠം നൽകിയിരിക്കുന്ന ഗ്രീക്ക് രൂപത്തെ പിന്തുടരുന്നു; പരിചിതമായ പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: ἐν എന്നതിലെ ഉപാധി/പ്രവർത്തകശക്തി
  choice: ബെയെൽസെബൂലിനെക്കൊണ്ട്
  alternative: ബെയെൽസെബൂലിന്റെ ശക്തിയാൽ
  rationale: ആരോപണത്തിന്റെ അർഥം വ്യക്തമാക്കുമ്പോഴും മൂലപാഠത്തിൽ പ്രത്യക്ഷമല്ലാത്ത ‘ശക്തി’ എന്ന ആശയം തുറന്നുപറഞ്ഞ് ചേർക്കുന്നത് ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഇവൻ’ വൈരപരമായ സംഭാഷണഭാവം നിലനിർത്തുന്നു; ‘ഭൂതങ്ങൾ,’ ‘പുറത്താക്കുക,’ ‘അധിപതി’ എന്നിവ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ബൈബിൾസന്ദർഭ പദങ്ങളാണ്.
