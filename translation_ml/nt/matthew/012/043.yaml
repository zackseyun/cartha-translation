id: MAT.12.43
reference: Matthew 12:43
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὅταν δὲ τὸ ἀκάθαρτον πνεῦμα ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου, διέρχεται δι’ ἀνύδρων τόπων ζητοῦν ἀνάπαυσιν, καὶ οὐχ εὑρίσκει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/043.yaml
  text: When the unclean spirit goes out from the man[a], it passes through waterless places seeking rest, and does not find it.
translation:
  language: ml
  text: അശുദ്ധാത്മാവ് മനുഷ്യനിൽനിന്ന് പുറത്തുപോകുമ്പോൾ, അത് വിശ്രമം തേടി വെള്ളമില്ലാത്ത സ്ഥലങ്ങളിലൂടെ[a] സഞ്ചരിക്കുന്നു; എന്നാൽ വിശ്രമം കണ്ടെത്തുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വരണ്ട സ്ഥലങ്ങളിലൂടെ.’ ഗ്രീക്കിൽ അക്ഷരാർഥം ‘വെള്ളമില്ലാത്ത സ്ഥലങ്ങളിലൂടെ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: പുറത്തുപോകുമ്പോൾ
  rationale: ὅταν പൊതുവായ ഒരു സമയസാഹചര്യം സൂചിപ്പിക്കുന്നതിനാൽ ‘-ുമ്പോൾ’ സ്വാഭാവികമാണ്. δέ ഇവിടെ ശക്തമായ വിരോധമല്ല, മൃദുവായ വ്യവഹാരമാറ്റമാണ്; സന്ദർഭമില്ലാതെ കൃത്രിമമായ ‘ഇനി’ ചേർക്കാതെ മലയാള വാക്യപ്രവാഹത്തിൽ അതിന്റെ ലഘുബന്ധകശക്തി ഉൾക്കൊള്ളുന്നു.
- source_word: τὸ ἀκάθαρτον πνεῦμα
  choice: അശുദ്ധാത്മാവ്
  rationale: സുവിശേഷങ്ങളിലെ ഭൂതോച്ചാടനസന്ദർഭത്തിൽ പതിവും സുതാര്യവുമായ പ്രയോഗം; ‘ഭൂതം’ എന്ന് മാറ്റാതെ πνεῦμα എന്ന ഉറവിടപദം നിലനിർത്തുന്നു.
- source_word: ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου
  choice: മനുഷ്യനിൽനിന്ന് പുറത്തുപോകുമ്പോൾ
  rationale: ചലനം മനുഷ്യനിൽനിന്ന് അകലുന്നതായി നേരിട്ട് പ്രകടിപ്പിക്കുന്നു. മലയാളത്തിൽ നിർദേശക അവ്യയം ഇല്ലാത്തതിനാൽ ‘മനുഷ്യൻ’ എന്ന രൂപം ദൃഷ്ടാന്തത്തിലെ പൊതുവായ ഏകവചനത്തെ സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: διέρχεται δι’ ἀνύδρων τόπων
  choice: വെള്ളമില്ലാത്ത സ്ഥലങ്ങളിലൂടെ സഞ്ചരിക്കുന്നു
  rationale: ἄνυδρος എന്നത് അക്ഷരാർഥത്തിൽ ‘വെള്ളമില്ലാത്ത’ എന്നാണ്; διέρχεται സൂചിപ്പിക്കുന്ന പ്രദേശങ്ങളിലൂടെയുള്ള സഞ്ചാരം ‘സഞ്ചരിക്കുന്നു’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ζητοῦν ἀνάπαυσιν
  choice: വിശ്രമം തേടി
  rationale: പ്രധാനക്രിയയോടൊപ്പം നടക്കുന്ന ലക്ഷ്യബോധമുള്ള തിരച്ചിലും ἀνάπαυσις എന്നതിന്റെ നേരിട്ടുള്ള അർഥവും സംക്ഷിപ്തമായി സൂക്ഷിക്കുന്നു.
- source_word: καὶ οὐχ εὑρίσκει
  choice: എന്നാൽ വിശ്രമം കണ്ടെത്തുന്നില്ല
  rationale: ഗ്രീക്കിൽ കർമം ആവർത്തിച്ചിട്ടില്ലെങ്കിലും മലയാളത്തിൽ ‘വിശ്രമം’ വീണ്ടും ചേർക്കുന്നത് സൂചന വ്യക്തമാക്കുന്നു. ഫലത്തിലെ വൈരുധ്യം സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ ‘എന്നാൽ’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: ഭൂതോച്ചാടനസന്ദർഭത്തിലെ πνεῦμα എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ആത്മാവ്
  alternative: ഭൂതം
  rationale: പരാമർശിക്കുന്നത് ദുഷ്ടമായ വ്യക്തിസത്തയെയാണെങ്കിലും ഗ്രീക്ക് പാഠം δαιμόνιον എന്നല്ല, πνεῦμα എന്നാണ് പറയുന്നത്. അതിനാൽ ഉറവിടത്തിന്റെ പദപ്രയോഗവും സന്ദർഭത്തിലെ ദൈവശാസ്ത്രപരമായ അർഥവും ഒരുപോലെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘അശുദ്ധാത്മാവ്’ എന്ന പരിചിതമായ ബൈബിൾപ്രയോഗം നിലനിർത്തിയിരിക്കുമ്പോഴും ശേഷിക്കുന്ന വാക്യം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി ഗ്രഹിക്കാവുന്ന രീതിയിലാണ്.
