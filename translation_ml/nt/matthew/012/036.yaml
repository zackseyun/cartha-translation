id: MAT.12.36
reference: Matthew 12:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι πᾶν ῥῆμα ἀργὸν ὃ ⸀λαλήσουσιν οἱ ἄνθρωποι, ἀποδώσουσιν περὶ αὐτοῦ λόγον ἐν ἡμέρᾳ κρίσεως·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/036.yaml
  text: But I tell you that for every careless word that people speak[b][a], they will give an account on the day of judgment.
translation:
  language: ml
  text: 'എന്നാൽ ഞാൻ നിങ്ങളോടു പറയുന്നു: മനുഷ്യർ പറയുന്ന ഓരോ അശ്രദ്ധമായ വാക്കിനെക്കുറിച്ചും[a] ന്യായവിധിദിവസത്തിൽ അവർ കണക്കു ബോധിപ്പിക്കും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വ്യർഥമായ വാക്ക്’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്ക് വിശേഷണത്തിന് ‘അലസമായ,’ ‘നിഷ്ഫലമായ,’ ‘അശ്രദ്ധമായ’ എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: എന്നാൽ ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: δέ മുൻസന്ദർഭത്തിലെ മുന്നറിയിപ്പിനോട് നേരിയ വൈരുധ്യം സൂചിപ്പിക്കുന്നു; വർത്തമാനകാലത്തിലുള്ള നേരിട്ടുള്ള അഭിസംബോധന സ്വാഭാവിക മലയാളത്തിൽ ഇങ്ങനെ വരുന്നു.
- source_word: πᾶν ῥῆμα
  choice: ഓരോ ... വാക്കിനും
  rationale: πᾶν ഏകവചന നാമത്തോടൊപ്പം വിതരണാർഥത്തിൽ ‘ഓരോ’ എന്നാണ്; ῥῆμα ഇവിടെ സംസാരിച്ച വാക്കിനെയോ ഉച്ചാരണത്തെയോ സൂചിപ്പിക്കുന്നു.
- source_word: ἀργόν
  choice: അശ്രദ്ധമായ
  rationale: ἀργός എന്നതിന് അലസമായ, ഫലമില്ലാത്ത, നിരുത്തരവാദപരമായ എന്നീ അർഥവ്യാപ്തികളുണ്ട്. ഈ ന്യായവിധിസന്ദർഭത്തിൽ ‘അശ്രദ്ധമായ’ എന്നത് ഉത്തരവാദിത്തമില്ലാത്ത സംസാരത്തിന്റെ ധാർമിക ഗൗരവം അമിതമായി വ്യാഖ്യാനിക്കാതെ വ്യക്തമാക്കുന്നു.
- source_word: ὃ λαλήσουσιν οἱ ἄνθρωποι
  choice: മനുഷ്യർ പറയുന്ന
  rationale: οἱ ἄνθρωποι മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു; λαλήσουσιν എന്ന ഭാവികാലരൂപം പൊതുവായ മുന്നറിയിപ്പിൽ മലയാളത്തിൽ സ്വാഭാവികമായി വർത്തമാനസദൃശമായ ‘പറയുന്ന’ എന്നു നൽകാം.
- source_word: ἀποδώσουσιν περὶ αὐτοῦ λόγον
  choice: അതിന് ... കണക്കു ബോധിപ്പിക്കേണ്ടിവരും
  rationale: ἀποδίδωμι + λόγος ഒരു കണക്കുനൽകൽ എന്ന ന്യായപരമായ പ്രയോഗമാണ്; περὶ αὐτοῦ ഓരോ വാക്കിനെയും സംബന്ധിച്ച ഉത്തരവാദിത്തം സൂചിപ്പിക്കുന്നതിനാൽ ദത്തിവിഭക്തിയായ ‘വാക്കിനും’ എന്നതിൽ ‘അതിന്’ എന്ന ആശയം ഉൾക്കൊള്ളുന്നു.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: ന്യായവിധിദിവസത്തിൽ
  rationale: ἐν ഇവിടെ കാലസൂചനയാണ്; κρίσις ന്യായപരമായ വിധിയെ സൂചിപ്പിക്കുന്നു. ‘ന്യായവിധിദിവസത്തിൽ’ ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്ഥാപിതവുമായ പ്രയോഗമാണ്.
theological_decisions:
- issue: ἀργόν എന്ന പദത്തിന്റെ ധാർമിക ശക്തി
  choice: ‘അശ്രദ്ധമായ’ എന്നു വിവർത്തനം ചെയ്തു
  alternative: ‘അലസമായ,’ ‘നിഷ്ഫലമായ,’ അല്ലെങ്കിൽ ‘വ്യർഥമായ’
  rationale: വാക്യം ദൈവിക ന്യായവിധിയിലെ ഉത്തരവാദിത്തത്തെക്കുറിച്ചാണ്. ‘അശ്രദ്ധമായ’ എന്നത് വെറും നിസ്സാരസംസാരമെന്ന ധാരണ ഒഴിവാക്കി ഉത്തരവാദിത്തമില്ലായ്മ വ്യക്തമാക്കുന്നു; അതേസമയം ‘ദുഷ്ടമായ’ എന്നതുപോലെ മൂലപദത്തേക്കാൾ ശക്തമാക്കുന്നില്ല.
- issue: οἱ ἄνθρωποι എന്നതിന്റെ പൊതുവായ വ്യാപ്തി
  choice: ‘മനുഷ്യർ’
  alternative: ‘പുരുഷന്മാർ’ അല്ലെങ്കിൽ ‘ആളുകൾ’
  rationale: ഗ്രീക്ക് പദം ഇവിടെ ലിംഗഭേദമില്ലാതെ മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു. ‘മനുഷ്യർ’ അതിന്റെ സർവസാധാരണ വ്യാപ്തിയും ഗൗരവമുള്ള ശൈലിയും നിലനിർത്തുന്നു.
- issue: περὶ αὐτοῦ എന്ന സൂചനയുടെ അവതരണം
  choice: ‘ഓരോ ... വാക്കിനും’ എന്ന ഘടനയിൽ ഉൾപ്പെടുത്തി
  alternative: ‘അതിനെക്കുറിച്ച്’ എന്നു പ്രത്യേകം ആവർത്തിക്കുക
  rationale: ഓരോ വാക്കിനെക്കുറിച്ചും കണക്കു നൽകണം എന്ന ബന്ധം മലയാളത്തിലെ ദത്തിവിഭക്തിയിൽ വ്യക്തമാണ്. പ്രത്യേകം സർവനാമം ചേർത്താൽ അനാവശ്യ ആവർത്തനം ഉണ്ടാകും; ആശയം നഷ്ടപ്പെടുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘കണക്കു ബോധിപ്പിക്കുക’ എന്ന സ്ഥാപിത ന്യായപരമായ പ്രയോഗം നിലനിർത്തി; അനാവശ്യ പദാനുപദത ഒഴിവാക്കി.
