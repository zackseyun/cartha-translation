source:
  edition: SBLGNT
  text: Τότε ⸂προσηνέχθη αὐτῷ δαιμονιζόμενος τυφλὸς καὶ κωφός⸃· καὶ ἐθεράπευσεν αὐτόν, ὥστε τὸν ⸀κωφὸν λαλεῖν καὶ βλέπειν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/022.yaml
  text: Then a demon-possessed man[a], blind and mute, was brought to him; and he healed him, so that the mute man spoke and saw.
translation:
  language: ml
  text: അപ്പോൾ പിശാചുബാധിതനും അന്ധനും സംസാരിക്കാൻ കഴിയാത്തവനുമായ[a] ഒരാളെ അവന്റെ അടുക്കൽ കൊണ്ടുവന്നു. അവൻ അയാളെ സുഖപ്പെടുത്തി; അങ്ങനെ സംസാരിക്കാൻ കഴിയാതിരുന്നയാൾ സംസാരിക്കുകയും കാണുകയും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ബധിരനായ.” ഗ്രീക്ക് പദത്തിന് ബധിരൻ എന്നോ സംസാരിക്കാൻ കഴിയാത്തവൻ എന്നോ അർഥമാകാം. ഇവിടെ സൗഖ്യം ലഭിച്ചശേഷം അയാൾ സംസാരിച്ചതായി പറയുന്നതിനാൽ “സംസാരിക്കാൻ കഴിയാത്തവൻ” എന്ന അർഥമാണ് സന്ദർഭത്തിന് കൂടുതൽ യോജിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: അപ്പോൾ
  rationale: തുടർന്നുണ്ടായ സംഭവത്തെ പരിചയപ്പെടുത്തുന്ന സ്വാഭാവികമായ കാലസൂചകപ്രയോഗം.
- source_word: προσηνέχθη αὐτῷ
  choice: അവന്റെ അടുക്കൽ കൊണ്ടുവന്നു
  rationale: ഗ്രീക്കിലെ കർമണിപ്രയോഗത്തെയും പ്രവർത്തകനെ വ്യക്തമാക്കാതിരിക്കുന്നതിനെയും നിലനിർത്തുന്നു.
- source_word: δαιμονιζόμενος
  choice: പിശാചുബാധിതൻ
  rationale: പിശാചിന്റെ സ്വാധീനത്തെക്കുറിച്ചുള്ള ഗ്രീക്ക് പരാമർശം വ്യക്തമായി നിലനിർത്തുന്ന, മലയാളത്തിൽ പരിചിതമായ പ്രയോഗം.
- source_word: τυφλὸς
  choice: അന്ധൻ
  rationale: മൂലപദത്തിന്റെ നേരിട്ടുള്ളതും മാന്യവുമായ മലയാളസമാനപദം.
- source_word: κωφός
  choice: സംസാരിക്കാൻ കഴിയാത്തവൻ
  rationale: പദത്തിന് ബധിരൻ എന്നും സംസാരിക്കാൻ കഴിയാത്തവൻ എന്നും അർഥമാകാമെങ്കിലും, ഫലവാക്യത്തിൽ അയാൾ സംസാരിച്ചതായി പറയുന്നതിനാൽ ഇവിടെ സംസാരശേഷിയില്ലായ്മയാണ് സന്ദർഭത്തിന് കൂടുതൽ യോജിക്കുന്നത്; മറ്റർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἐθεράπευσεν αὐτόν
  choice: അവൻ അയാളെ സുഖപ്പെടുത്തി
  rationale: സുവിശേഷങ്ങളിലെ രോഗശാന്തിസന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക വിവർത്തനം.
- source_word: ὥστε
  choice: അങ്ങനെ
  rationale: സൗഖ്യപ്പെടുത്തലിന്റെ ഫലം അവതരിപ്പിക്കുന്ന ബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: λαλεῖν καὶ βλέπειν
  choice: സംസാരിക്കുകയും കാണുകയും ചെയ്തു
  rationale: പുനഃസ്ഥാപിക്കപ്പെട്ട രണ്ടു കഴിവുകളെയും കൂട്ടിച്ചേർക്കാതെ ലളിതമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: പിശാചുബാധയുടെ സ്വഭാവം
  choice: പിശാചുബാധിതൻ എന്ന വ്യക്തമായ ഭാഷ നിലനിർത്തി
  alternative: മാനസികരോഗി; ബാധിതൻ
  rationale: ഗ്രീക്ക് പാഠം പിശാചുസംബന്ധമായ ബാധയെ വ്യക്തമായി പരാമർശിക്കുന്നു; അതിനെ ആധുനിക രോഗനിർണയമാക്കി മാറ്റുകയോ അവ്യക്തമാക്കുകയോ ചെയ്യരുത്.
- issue: κωφός എന്ന പദത്തിന്റെ സന്ദർഭാർഥം
  choice: സംസാരിക്കാൻ കഴിയാത്തവൻ
  alternative: ബധിരൻ
  rationale: തുടർന്നുള്ള ഫലവാക്യം കേൾവിയെക്കുറിച്ചല്ല, സംസാരശേഷി ലഭിച്ചതിനെക്കുറിച്ചാണ് പറയുന്നത്. എങ്കിലും പദത്തിന്റെ യഥാർഥ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. മൂലപാഠത്തിലെ കർമണിപ്രയോഗവും വ്യക്തമാക്കാത്ത പ്രവർത്തകനും നിലനിർത്തി; κωφός എന്ന പദത്തിന്റെ സന്ദർഭാർഥം മുഖ്യപാഠത്തിലും അതിന്റെ യഥാർഥ പര്യായസാധ്യത അടിക്കുറിപ്പിലും നൽകി.
