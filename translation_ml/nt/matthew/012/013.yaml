id: MAT.12.13
reference: Matthew 12:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τότε λέγει τῷ ἀνθρώπῳ· Ἔκτεινόν ⸂σου τὴν χεῖρα⸃· καὶ ἐξέτεινεν, καὶ ἀπεκατεστάθη ὑγιὴς ὡς ἡ ἄλλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/013.yaml
  text: Then he says to the man[a], “Stretch out your hand.” And he stretched it out, and it was restored[b], healthy like the other one.
translation:
  language: ml
  text: 'അപ്പോൾ അവൻ ആ മനുഷ്യനോട് പറയുന്നു: “നിന്റെ കൈ നീട്ടുക.” അയാൾ അതു നീട്ടി; അതു പൂർവസ്ഥിതിയിലായി[a]—മറ്റേ കൈപോലെ ആരോഗ്യമുള്ളതായി[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അതു സൗഖ്യം പ്രാപിച്ചു”; ഗ്രീക്ക് ക്രിയ ശരിയായ അവസ്ഥയിലേക്കുള്ള പുനഃസ്ഥാപനത്തിന് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “മറ്റേതുപോലെ ആരോഗ്യമുള്ളത്”; “മറ്റേത്” എന്നത് ആ മനുഷ്യന്റെ മറ്റേ കൈയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: അപ്പോൾ
  rationale: കഥയിലെ സംഭവക്രമം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: λέγει
  choice: പറയുന്നു
  rationale: മത്തായിയുടെ സജീവമായ ചരിത്രവർത്തമാനകാല പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: τῷ ἀνθρώπῳ
  choice: ആ മനുഷ്യനോട്
  rationale: സന്ദർഭത്തിലെ നിർദിഷ്ട പുരുഷനെ സൂചിപ്പിക്കുന്നു.
- source_word: Ἔκτεινόν σου τὴν χεῖρα
  choice: നിന്റെ കൈ നീട്ടുക
  rationale: നേരിട്ടുള്ള കല്പനയും χείρ എന്നതിന്റെ സാധാരണ അർഥമായ ‘കൈ’യും വ്യക്തമായി പകരുന്നു.
- source_word: ἐξέτεινεν
  choice: അയാൾ അതു നീട്ടി
  rationale: കല്പനയിലെയും പ്രതികരണത്തിലെയും ക്രിയാപുനരാവർത്തനം നിലനിർത്തുന്നു; ‘അതു’ എന്നത് മലയാളത്തിൽ ആവശ്യമായ വ്യക്തത നൽകുന്നു.
- source_word: ἀπεκατεστάθη
  choice: അതു പൂർവസ്ഥിതിയിലായി
  rationale: കേവലം സൗഖ്യം ലഭിച്ചു എന്നതിലുപരി ശരിയായ മുൻസ്ഥിതിയിലേക്കുള്ള പുനഃസ്ഥാപനമാണ് ഗ്രീക്ക് ക്രിയ ഊന്നുന്നത്; മലയാളത്തിൽ സ്വാഭാവികമായ രൂപം തിരഞ്ഞെടുത്തു.
- source_word: ὑγιὴς ὡς ἡ ἄλλη
  choice: മറ്റേ കൈപോലെ ആരോഗ്യമുള്ളതായി
  rationale: ὑγιής സൂചിപ്പിക്കുന്ന ആരോഗ്യപൂർണതയും സ്ത്രീലിംഗത്തിലുള്ള ἡ ἄλλη പരോക്ഷമായി സൂചിപ്പിക്കുന്ന മറ്റേ കൈയും വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: സൗഖ്യവിവരണത്തിന്റെ സ്വഭാവം
  choice: കൈ മറ്റേ കൈപോലെ ആരോഗ്യമുള്ളതായി പൂർവസ്ഥിതിയിലായി
  alternative: കൈ സൗഖ്യം പ്രാപിച്ചു / സുഖപ്പെട്ടു
  rationale: അത്ഭുതത്തെ വാചകം പറയുന്ന പരിധിക്കുള്ളിൽ ലളിതമായി വിവരിക്കുകയും ἀποκαθίστημι എന്ന ക്രിയയിലെ പുനഃസ്ഥാപനത്തിന്റെ ഭാവം സംരക്ഷിക്കുകയും ചെയ്യുന്നു; അധികമായ ഉപദേശപരമായ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ചരിത്രവർത്തമാനകാലം ‘പറയുന്നു’ എന്ന രൂപത്തിൽ സംരക്ഷിച്ചിരിക്കുന്നു; യേശുവിനെയും മനുഷ്യനെയും വേർതിരിക്കാൻ രണ്ടാമത്തെയാളെ ‘അയാൾ’ എന്നു പറയുന്നു.
