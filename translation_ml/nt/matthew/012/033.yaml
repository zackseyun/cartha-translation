id: MAT.12.33
reference: Matthew 12:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἢ ποιήσατε τὸ δένδρον καλὸν καὶ τὸν καρπὸν αὐτοῦ καλόν, ἢ ποιήσατε τὸ δένδρον σαπρὸν καὶ τὸν καρπὸν αὐτοῦ σαπρόν· ἐκ γὰρ τοῦ καρποῦ τὸ δένδρον γινώσκεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/033.yaml
  text: Either make the tree good and its fruit good[a], or make the tree rotten and its fruit rotten[b]; for the tree is known by its fruit.
translation:
  language: ml
  text: ഒന്നുകിൽ വൃക്ഷത്തെ നല്ലതാക്കുക[b], അതിന്റെ ഫലത്തെയും നല്ലതാക്കുക; അല്ലെങ്കിൽ വൃക്ഷത്തെ ചീത്തയാക്കുക[a], അതിന്റെ ഫലത്തെയും ചീത്തയാക്കുക. കാരണം, ഫലത്തിൽനിന്നാണ് വൃക്ഷം അറിയപ്പെടുന്നത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ചീത്ത’ എന്നതിന് പകരം ‘ചീഞ്ഞ’ അല്ലെങ്കിൽ ‘ദുഷിച്ച’ എന്നും പരിഭാഷപ്പെടുത്താം; σαπρός എന്ന ഗ്രീക്കുപദം കേടുപിടിച്ചതിനെയോ ദുഷിച്ചതിനെയോ ഉപയോഗശൂന്യമായതിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘നല്ലതാക്കുക/ചീത്തയാക്കുക’ എന്ന ആവർത്തിച്ച പ്രയോഗത്തിന് ഇവിടെ ‘നല്ലതായി/ചീത്തയായി കണക്കാക്കുക’ എന്ന വാചാടോപപരമായ അർഥം ഉണ്ടായേക്കാം; എങ്കിലും ഗ്രീക്കിൽ ക്രിയ ആജ്ഞാരൂപത്തിലാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: ποιήσατε
  choice: നല്ലതാക്കുക / ചീത്തയാക്കുക
  rationale: ആവർത്തിച്ചിരിക്കുന്ന aorist imperative-ന്റെ നേരിട്ടുള്ള ആജ്ഞാരൂപവും സമാന്തരഘടനയും നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ ‘നല്ലതായി/ചീത്തയായി കണക്കാക്കുക’ എന്ന വാചാടോപപരമായ ധ്വനി സാധ്യമെങ്കിലും അത് മുഖ്യവാചകത്തിൽ തീർപ്പാക്കിയിട്ടില്ല.
- source_word: δένδρον
  choice: വൃക്ഷം
  rationale: ഉപമയുടെ കേന്ദ്രചിത്രം കൃത്യമായി നൽകുന്ന, സ്വാഭാവികവും മാന്യവുമായ മലയാളപദം.
- source_word: καλός
  choice: നല്ലത്
  rationale: ഗുണമേന്മയുടെയും ധാർമികനന്മയുടെയും ധ്വനി ഒരുപോലെ നിലനിർത്തുന്നു; ‘ആരോഗ്യമുള്ളത്’ എന്നത് അർഥം അനാവശ്യമായി ചുരുക്കും.
- source_word: καρπός
  choice: ഫലം
  rationale: മൂലഭാഷയിലെ വൃക്ഷഫലചിത്രവും അതിന്റെ രൂപകാർഥവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: σαπρός
  choice: ചീത്ത
  rationale: കേടുപിടിച്ച, ദുഷിച്ച, ഉപയോഗശൂന്യമായ എന്നീ അർഥവ്യാപ്തികൾ ഉൾക്കൊള്ളാൻ കഴിയുന്ന സ്വാഭാവിക മലയാളം. ‘ചീഞ്ഞ’ എന്നത് ഫലത്തിന് വളരെ യോജിച്ചാലും വൃക്ഷത്തോടൊപ്പം ആവർത്തിക്കുമ്പോൾ മലയാളത്തിൽ കുറച്ച് അസ്വാഭാവികമാണ്.
- source_word: ἐκ γὰρ τοῦ καρποῦ
  choice: കാരണം, ഫലത്തിൽനിന്നാണ്
  rationale: γάρ-ന്റെ വിശദീകരണബന്ധവും ἐκ-ന്റെ ഉറവിടം/അടിസ്ഥാനം സൂചിപ്പിക്കുന്ന ശക്തിയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: γινώσκεται
  choice: അറിയപ്പെടുന്നു
  rationale: വർത്തമാനകാല കർമണിപ്രയോഗത്തിന് നേരിട്ടുള്ള സമാനത; വൃക്ഷത്തിന്റെ സ്വഭാവം ഫലത്തിലൂടെ തിരിച്ചറിയപ്പെടുന്നു എന്ന ആശയം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ ഉപമയിലെ ആജ്ഞാരൂപങ്ങളുടെ ശക്തി
  choice: ‘നല്ലതാക്കുക … ചീത്തയാക്കുക’ എന്ന നേരിട്ടുള്ള ആജ്ഞാരൂപം നിലനിർത്തി.
  alternative: ‘നല്ലതായി കണക്കാക്കുക … ചീത്തയായി കണക്കാക്കുക’ അല്ലെങ്കിൽ ‘നല്ലതെന്നു കരുതുക … ചീത്തയെന്നു കരുതുക’.
  rationale: ഗ്രീക്കിൽ രണ്ടിടത്തും ആജ്ഞാരൂപമാണ്. ഇത് വാചാടോപപരമായ വെല്ലുവിളിയായി പ്രവർത്തിക്കാമെങ്കിലും, വ്യാഖ്യാനപരമായ മിനുക്കലിലൂടെ അതിനെ പ്രസ്താവനയാക്കി മാറ്റാതെ മൂലത്തിലെ മൂർച്ചയും അർഥസംഘർഷവും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘മരം’ എന്നതിനെക്കാൾ തിരുവെഴുത്തുപാരായണത്തിന് യോജിച്ചെങ്കിലും പൊതുവായ വായനക്കാർക്ക് വ്യക്തമായ ‘വൃക്ഷം’ തെരഞ്ഞെടുത്തു. സമാന്തരഘടനയും ആവർത്തനവും ഉദ്ദേശപൂർവം സംരക്ഷിച്ചു.
