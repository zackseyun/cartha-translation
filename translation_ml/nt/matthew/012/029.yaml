id: MAT.12.29
reference: Matthew 12:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἢ πῶς δύναταί τις εἰσελθεῖν εἰς τὴν οἰκίαν τοῦ ἰσχυροῦ καὶ τὰ σκεύη αὐτοῦ ⸀ἁρπάσαι, ἐὰν μὴ πρῶτον δήσῃ τὸν ἰσχυρόν; καὶ τότε τὴν οἰκίαν αὐτοῦ ⸀διαρπάσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/029.yaml
  text: Or how can someone enter the strong man's house and seize his goods[b][a], unless he first binds the strong man? And then he will plunder his house.
translation:
  language: ml
  text: അല്ലെങ്കിൽ, ബലവാനെ ആദ്യം കെട്ടിയിടാതെ ഒരാൾക്ക് അവന്റെ വീട്ടിൽ കടന്ന് അവന്റെ സാധനങ്ങൾ[a] പിടിച്ചെടുക്കാൻ എങ്ങനെ കഴിയും? അവനെ കെട്ടിയിട്ടശേഷമേ അയാൾ അവന്റെ വീട് കൊള്ളയടിക്കുകയുള്ളൂ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സാധനങ്ങൾ’ എന്നതിന് ‘വസ്തുവകകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്ക് പദം അക്ഷരാർഥത്തിൽ പാത്രങ്ങളെയോ ഉപകരണങ്ങളെയോ, വിശാലാർഥത്തിൽ ഒരാളുടെ വസ്തുവകകളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: അല്ലെങ്കിൽ
  rationale: മുൻവാദത്തോടു ബന്ധിപ്പിക്കുന്ന മറ്റൊരു വിശദീകരണോപമയെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: πῶς δύναταί τις
  choice: ഒരാൾക്ക് ... എങ്ങനെ കഴിയും?
  rationale: ഗ്രീക്കിലെ പൊതുവായ അനിശ്ചിത കർത്താവിനെയും ആലങ്കാരിക ചോദ്യരൂപത്തെയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τοῦ ἰσχυροῦ / τὸν ἰσχυρόν
  choice: ബലവാൻ / ബലവാനെ
  rationale: നാമവാചകമായി ഉപയോഗിച്ചിരിക്കുന്ന വിശേഷണത്തിന്റെ പുരുഷലിംഗമുള്ള സജീവ ഉപമ സംക്ഷിപ്തമായും വ്യക്തമായും സംരക്ഷിക്കുന്നു.
- source_word: τὰ σκεύη αὐτοῦ
  choice: അവന്റെ സാധനങ്ങൾ
  rationale: σκεύη എന്നത് പാത്രങ്ങളെയോ ഉപകരണങ്ങളെയോ അക്ഷരാർഥത്തിൽ സൂചിപ്പിക്കാമെങ്കിലും ഇവിടെ വീട്ടിലുള്ള വസ്തുവകകളെ വിശാലമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἁρπάσαι
  choice: പിടിച്ചെടുക്കാൻ
  rationale: ബലമായി കൈവശപ്പെടുത്തുന്ന അർഥം നൽകുകയും പിന്നീട് വരുന്ന διαρπάσει എന്ന ശക്തമായ കൊള്ളയടിക്കൽപ്രയോഗത്തിൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐὰν μὴ πρῶτον δήσῃ
  choice: ആദ്യം കെട്ടിയിടാതെ
  rationale: വ്യവസ്ഥയും മുൻക്രമവും കൃത്യമായി നൽകുന്നു; കെട്ടിയിടുക എന്നത് ആധുനിക മലയാളത്തിൽ ദൃശ്യവും സ്വാഭാവികവുമാണ്.
- source_word: καὶ τότε ... διαρπάσει
  choice: കെട്ടിയിട്ടശേഷമേ ... കൊള്ളയടിക്കുകയുള്ളൂ
  rationale: τότε സൂചിപ്പിക്കുന്ന തുടർക്രമത്തെ ‘ശേഷമേ’ എന്ന ഊന്നലോടെ വ്യക്തമാക്കുകയും διαρπάσειയുടെ സമഗ്രമായ കൊള്ളയടിക്കൽഭാവം പകർന്നുതരുകയും ചെയ്യുന്നു.
- source_word: τὴν οἰκίαν αὐτοῦ
  choice: അവന്റെ വീട്
  rationale: രൂപകത്തിന്റെ ദൃശ്യമായ വീടെന്ന അർഥം നിലനിർത്തുന്നു; ‘ഭവനം’, ‘അധികാരമേഖല’ തുടങ്ങിയ വ്യാഖ്യാനപരമായ വിപുലീകരണങ്ങൾ ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: ബലവാനെക്കുറിച്ചുള്ള പുരുഷലിംഗ രൂപകം
  choice: ബലവാൻ
  alternative: ശക്തനായവൻ
  rationale: ഗ്രീക്കിലെ വ്യക്തിവൽക്കരിച്ച പുരുഷലിംഗ രൂപകം സംരക്ഷിക്കുന്നു; അതിനെ ലിംഗനിരപേക്ഷമാക്കുകയോ പ്രത്യേക ദൈവശാസ്ത്രപരമായ തിരിച്ചറിയൽ വാചകത്തിൽ ചേർക്കുകയോ ചെയ്യുന്നില്ല.
- issue: വീട്, സാധനങ്ങൾ എന്നീ രൂപകങ്ങളുടെ വ്യാപ്തി
  choice: മോഷണത്തിന്റെ മൂർത്തമായ രൂപകം അതേപടി നിലനിർത്തുക
  alternative: അധികാരമേഖല, അധീനരായവർ എന്നിങ്ങനെ വ്യാഖ്യാനിച്ച് പരിഭാഷപ്പെടുത്തുക
  rationale: സന്ദർഭം ദുഷ്ടാത്മശക്തികളിന്മേലുള്ള യേശുവിന്റെ അധികാരത്തിലേക്കു വിരൽചൂണ്ടുന്നുവെങ്കിലും, വാക്യത്തിൽ തന്നെയുള്ള രൂപകത്തെ വിശദീകരണാത്മക സിദ്ധാന്തമായി മാറ്റുന്നില്ല.
- issue: τότε എന്ന പദത്തിന്റെ ക്രമപരമായ ഊന്നൽ
  choice: കെട്ടിയിട്ടശേഷമേ
  alternative: പിന്നെ
  rationale: ബലവാനെ ബന്ധിച്ചതിനു ശേഷമാണ് കൊള്ളയടിക്കൽ സാധ്യമാകുന്നതെന്ന വാദക്രമം മലയാളത്തിൽ വ്യക്തമായി സൂക്ഷിക്കുന്നു; ഇതിലൂടെ പാഠത്തിൽ ഇല്ലാത്ത അധിക സിദ്ധാന്തം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ആലങ്കാരിക ചോദ്യം നിലനിർത്തിയിരിക്കുന്നു. ‘ബലവാൻ’, ‘കെട്ടിയിടുക’, ‘പിടിച്ചെടുക്കുക’, ‘കൊള്ളയടിക്കുക’ എന്നിവ രൂപകത്തിന്റെ ശക്തിയും രണ്ടു വ്യത്യസ്ത ഗ്രീക്ക് ക്രിയകളുടെ ഭേദവും സംരക്ഷിക്കുന്നു.
