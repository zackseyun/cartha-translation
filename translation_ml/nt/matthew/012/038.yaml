id: MAT.12.38
reference: Matthew 12:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τότε ἀπεκρίθησαν ⸀αὐτῷ τινες τῶν γραμματέων καὶ Φαρισαίων λέγοντες· Διδάσκαλε, θέλομεν ἀπὸ σοῦ σημεῖον ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/038.yaml
  text: Then some of the scribes and Pharisees answered him[a], saying, “Teacher, we want to see a sign from you.”
translation:
  language: ml
  text: 'അപ്പോൾ ശാസ്ത്രിമാരിലും പരീശന്മാരിലും ചിലർ അവനോടു മറുപടിയായി പറഞ്ഞു: “ഗുരോ, അങ്ങയിൽനിന്ന് ഒരു അടയാളം കാണാൻ ഞങ്ങൾ ആഗ്രഹിക്കുന്നു.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അടയാളം’ എന്നതിന് ‘അത്ഭുതകരമായ അടയാളം’ എന്നും അർഥമാകാം. ഗ്രീക്ക് പദം അത്ഭുതപ്രാധാന്യമുള്ള ഒരു അടയാളത്തെ സൂചിപ്പിക്കാവുന്നതാണ്; എന്നാൽ മുഖ്യപാഠം വിശാലമായ പദം നിലനിർത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: അപ്പോൾ
  rationale: സംഭവക്രമത്തിലെ അടുത്ത ഘട്ടം സ്വാഭാവികമായി അവതരിപ്പിക്കുന്ന കാലസൂചകപദം.
- source_word: ἀπεκρίθησαν αὐτῷ
  choice: അവനോടു പറഞ്ഞു
  rationale: മുൻപിൽ നേരിട്ടൊരു ചോദ്യം ഇല്ലാത്തതിനാൽ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ പ്രതികരണഭാവം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; ‘മറുപടി പറഞ്ഞു’ എന്നതും സാധ്യമെങ്കിലും ഇവിടെ അല്പം കൃത്രിമമായി കേൾക്കും.
- source_word: τινες τῶν γραμματέων καὶ Φαρισαίων
  choice: ശാസ്ത്രിമാരിലും പരീശന്മാരിലും ചിലർ
  rationale: രണ്ടു വിഭാഗങ്ങളിലെയും എല്ലാവരെയല്ല, ചിലരെ മാത്രമാണ് സൂചിപ്പിക്കുന്നതെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: λέγοντες
  choice: പറഞ്ഞു
  rationale: നേരിട്ടുള്ള വാക്കുകളെ പരിചയപ്പെടുത്തുന്ന കൃതന്തം മലയാളത്തിലെ സ്വാഭാവിക സമാപകക്രിയയായി ചേർത്തിരിക്കുന്നു.
- source_word: Διδάσκαλε
  choice: ഗുരോ
  rationale: അധ്യാപകൻ എന്ന അഭിസംബോധന dignifiedവും മലയാള ബൈബിൾ ശൈലിയിൽ പരിചിതവുമായ രൂപത്തിൽ നൽകുന്നു; ‘യജമാനനേ’ എന്ന അധികാരാർഥം ചേർക്കുന്നില്ല.
- source_word: θέλομεν
  choice: ഞങ്ങൾ ആഗ്രഹിക്കുന്നു
  rationale: ഇച്ഛയെ വ്യക്തമായി പ്രകടിപ്പിക്കുന്ന, മാന്യവും ആധുനികവുമായ പ്രയോഗം.
- source_word: ἀπὸ σοῦ
  choice: അങ്ങയിൽനിന്ന്
  rationale: അടയാളത്തിന്റെ ഉറവിടം യേശുവാണെന്ന ഗ്രീക്ക് ἀπόയുടെ അർഥം നിലനിർത്തുന്നു; അഭിസംബോധനയിൽ മാന്യമായ രണ്ടാംപുരുഷരൂപം ഉപയോഗിക്കുന്നു.
- source_word: σημεῖον
  choice: ഒരു അടയാളം
  rationale: ഗ്രീക്ക് പദത്തിന്റെ വിശാലമായ അർഥം സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ അത്ഭുതസ്വഭാവം സൂചിപ്പിക്കാമെങ്കിലും മുഖ്യപാഠത്തിൽ അത് നിർബന്ധിച്ച് ചേർക്കുന്നില്ല.
- source_word: ἰδεῖν
  choice: കാണാൻ
  rationale: ὁράωയുടെ ലളിതവും നേരിട്ടുമുള്ള മലയാള തുല്യം; ‘സാക്ഷ്യം വഹിക്കാൻ’ എന്ന വ്യാഖ്യാനവിപുലീകരണം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: σημεῖον എന്നതിന്റെ സ്വഭാവം
  choice: മുഖ്യപാഠത്തിൽ ‘അടയാളം’
  alternative: ‘അത്ഭുതകരമായ അടയാളം’ അഥവാ ‘അത്ഭുതചിഹ്നം’
  rationale: സന്ദർഭത്തിൽ യേശുവിന്റെ അധികാരം സ്ഥിരീകരിക്കുന്ന അത്ഭുതപ്രവൃത്തിയാണ് അഭ്യർഥനയിൽ ഉദ്ദേശിക്കപ്പെട്ടിരിക്കാവുന്നത്. എങ്കിലും മൂലപദം വിശാലമായ ‘അടയാളം’ എന്നാണ്; അതിനാൽ ആ അർഥവ്യാപ്തിയും ഉദ്ദേശപൂർവമായ തുറന്ന നിലയും മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ശാസ്ത്രിമാർ’, ‘പരീശന്മാർ’, ‘ഗുരോ’, ‘അടയാളം’ എന്നീ പരിചിതമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തിയിരിക്കുന്നു. ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചെങ്കിലും വിവരണത്തിൽ മൂന്നാംപുരുഷ ‘അവൻ’ നിലനിർത്തുന്നു.
