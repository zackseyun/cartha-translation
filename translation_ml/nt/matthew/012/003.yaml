id: MAT.12.3
reference: Matthew 12:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Οὐκ ἀνέγνωτε τί ἐποίησεν Δαυὶδ ὅτε ⸀ἐπείνασεν καὶ οἱ μετ’ αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/003.yaml
  text: But he said to them[a], “Have you not read what David did when he was hungry, and those with him were hungry?”
translation:
  language: ml
  text: 'എന്നാൽ അവൻ അവരോടു പറഞ്ഞു: “ദാവീദിനും അവനോടുകൂടെ ഉണ്ടായിരുന്നവർക്കും വിശന്നപ്പോൾ, അവൻ എന്തു ചെയ്തുവെന്ന് നിങ്ങൾ വായിച്ചിട്ടില്ലേ?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “ദാവീദിനു വിശന്നപ്പോൾ, അവനോടുകൂടെ ഉണ്ടായിരുന്നവരും [വിശന്നപ്പോൾ], അവൻ എന്തു ചെയ്തുവെന്ന് നിങ്ങൾ വായിച്ചിട്ടില്ലേ?” ഗ്രീക്കിൽ ‘വിശന്നു’ എന്ന ക്രിയ ഏകവചനത്തിലാണ്; അതു വ്യക്തമായി ദാവീദിനെ സൂചിപ്പിക്കുന്നു. എങ്കിലും, അവനോടുകൂടെ ഉണ്ടായിരുന്നവർക്കും വിശപ്പ് ബാധകമാണെന്ന് ഈ ഘടനയിൽനിന്ന് മനസ്സിലാക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: എന്നാൽ അവൻ
  rationale: δέ മുൻവാക്യത്തിലെ ആരോപണത്തോടുള്ള യേശുവിന്റെ പ്രതികരണത്തെ സൂചിപ്പിക്കുന്ന മൃദുവായ വൈരുധ്യബന്ധകമാണ്; ‘എന്നാൽ’ മലയാളത്തിൽ ഈ പ്രവാഹം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: εἶπεν αὐτοῖς
  choice: അവരോടു പറഞ്ഞു
  rationale: λέγωയും ദത്തിവിഭക്തിയിലുള്ള αὐτοῖςഉം ചേർന്നതിന്റെ നേരിട്ടുള്ള, സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: Οὐκ ἀνέγνωτε
  choice: നിങ്ങൾ വായിച്ചിട്ടില്ലേ?
  rationale: തിരുവെഴുത്തിനെക്കുറിച്ചുള്ള അവരുടെ പരിചയത്തെ ചോദ്യം ചെയ്യുന്ന നിഷേധാത്മക അലങ്കാരചോദ്യത്തിന്റെ ശക്തി ഈ രൂപം നിലനിർത്തുന്നു.
- source_word: τί ἐποίησεν Δαυὶδ
  choice: ദാവീദ് ... എന്തു ചെയ്തുവെന്ന്
  rationale: ποιέω ഇവിടെ സാധാരണ ചരിത്രാർഥത്തിൽ ‘ചെയ്യുക’ എന്നാണ്; മലയാളത്തിലെ ആശ്രിതചോദ്യഘടനയ്ക്ക് അനുസരിച്ച് വാക്കുകളുടെ ക്രമം മാറ്റിയിരിക്കുന്നു.
- source_word: ὅτε ἐπείνασεν
  choice: വിശന്നപ്പോൾ
  rationale: πεινάω എന്നതിന്റെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ ആധുനിക മലയാളപ്രയോഗം; ഏകവചനക്രിയ വ്യാകരണപരമായി ദാവീദിനെയാണ് വ്യക്തമായി സൂചിപ്പിക്കുന്നത്.
- source_word: καὶ οἱ μετ’ αὐτοῦ
  choice: അവനും കൂടെയുണ്ടായിരുന്നവരും
  rationale: ‘അവനോടുകൂടെ ഉണ്ടായിരുന്നവർ’ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; വാക്യത്തിൽ ‘ചെയ്തു’ എന്ന പ്രവർത്തിയുടെ സംയുക്തകർത്താവായി ഇതിനെ വായിക്കാവുന്ന ഗ്രീക്ക് ഘടന നിലനിർത്തുന്നു.
theological_decisions:
- issue: വിശപ്പ് ദാവീദിനു മാത്രമോ കൂടെയുണ്ടായിരുന്നവർക്കും ബാധകമോ
  choice: മുഖ്യപാഠത്തിൽ ഏകവചനക്രിയയുടെ വ്യക്തമായ സൂചനപ്രകാരം ‘ദാവീദിനു വിശന്നപ്പോൾ’ എന്നു നൽകി; ഗ്രീക്ക് ഘടനയുടെ വിശാലമായ വായന അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
  alternative: ‘ദാവീദിനും കൂടെയുണ്ടായിരുന്നവർക്കും വിശന്നപ്പോൾ’
  rationale: ἐπείνασεν ഏകവചനമാണ്, അതിനാൽ അത് വ്യക്തമായി ദാവീദിനെ സൂചിപ്പിക്കുന്നു. എങ്കിലും καὶ οἱ μετ’ αὐτοῦ എന്ന ഘടകം സന്ദർഭത്തിൽ വിശപ്പിനെ ഇരുകൂട്ടർക്കും ബാധകമായി മനസ്സിലാക്കാൻ അനുവദിക്കുന്നതിനാൽ ആ യഥാർഥ ദ്വയാർഥത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വാക്യഘടന ഉപയോഗിച്ചു. അലങ്കാരചോദ്യത്തിന്റെ ഭാവവും ഗ്രീക്കിലെ ഏകവചനക്രിയ സൃഷ്ടിക്കുന്ന യഥാർഥ ദ്വയാർഥതയും നിലനിർത്തി; അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി.
