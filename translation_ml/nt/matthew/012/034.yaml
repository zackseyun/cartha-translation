id: MAT.12.34
reference: Matthew 12:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: γεννήματα ἐχιδνῶν, πῶς δύνασθε ἀγαθὰ λαλεῖν πονηροὶ ὄντες; ἐκ γὰρ τοῦ περισσεύματος τῆς καρδίας τὸ στόμα λαλεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/034.yaml
  text: Offspring of vipers[b][a], how can you speak good things when you are evil? For out of the overflow of the heart the mouth speaks.
translation:
  language: ml
  text: അണലികളുടെ സന്തതികളേ,[a] ദുഷ്ടരായിരിക്കെ നിങ്ങൾക്ക് എങ്ങനെ നല്ല കാര്യങ്ങൾ സംസാരിക്കാൻ കഴിയും? ഹൃദയത്തിന്റെ നിറവിൽനിന്നല്ലോ വായ് സംസാരിക്കുന്നത്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അണലിക്കുഞ്ഞുങ്ങളേ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഹൃദയത്തിന്റെ കവിഞ്ഞൊഴുക്കിൽനിന്നാണ് വായ് സംസാരിക്കുന്നത്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: γεννήματα ἐχιδνῶν
  choice: അണലികളുടെ സന്തതികളേ
  rationale: γέννημα എന്നത് ജനിപ്പിക്കപ്പെട്ടത് അഥവാ സന്തതി എന്നർഥം നൽകുന്നു; ἐχιδνῶν എന്ന ജനിറ്റീവിനൊപ്പം ഇത് സ്വഭാവപരമായ വംശബന്ധം സൂചിപ്പിക്കുന്ന മൂർച്ചയുള്ള രൂപകമായി നിലകൊള്ളുന്നു. ‘സന്തതികളേ’ എന്നത് ആ രൂപകം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: πῶς δύνασθε
  choice: നിങ്ങൾക്ക് എങ്ങനെ ... കഴിയും?
  rationale: ഇത് കഴിവിനെക്കുറിച്ചുള്ള സാധാരണ ചോദ്യം മാത്രമല്ല, ദുഷ്ടരായിരിക്കെ നല്ലത് സംസാരിക്കാനുള്ള അസാധ്യതയെ ഊന്നുന്ന ആലങ്കാരിക ചോദ്യവുമാണ്.
- source_word: ἀγαθὰ λαλεῖν
  choice: നല്ല കാര്യങ്ങൾ സംസാരിക്കാൻ
  rationale: ἀγαθά നപുംസകലിംഗ ബഹുവചനത്തിൽ നാമവൽക്കരിച്ച പ്രയോഗമാണ്; ‘നല്ല കാര്യങ്ങൾ’ അതിന്റെ ഉള്ളടക്കത്തെ വ്യക്തമാക്കുകയും λαλεῖν എന്ന ‘സംസാരിക്കുക’ എന്ന ക്രിയയോട് അടുത്തുനിൽക്കുകയും ചെയ്യുന്നു.
- source_word: πονηροὶ ὄντες
  choice: ദുഷ്ടരായിരിക്കെ
  rationale: പങ്കാളിക്രിയാ ഘടന ചോദ്യം ഉന്നയിക്കപ്പെടുന്ന സാഹചര്യത്തെ സൂചിപ്പിക്കുന്നു. ‘ദുഷ്ടർ’ എന്നത് πονηροίയുടെ ധാർമ്മിക ഭാരം മയപ്പെടുത്താതെ നൽകുന്നു.
- source_word: ἐκ γὰρ τοῦ περισσεύματος τῆς καρδίας
  choice: ഹൃദയത്തിന്റെ നിറവിൽനിന്നല്ലോ
  rationale: περίσσευμα സമൃദ്ധി, നിറവ്, കവിഞ്ഞൊഴുക്ക് എന്നിവ സൂചിപ്പിക്കാം. മലയാളത്തിലെ ‘നിറവിൽനിന്ന്’ ആന്തരികമായി നിറഞ്ഞിരിക്കുന്നതിൽനിന്ന് വാക്കുകൾ പുറപ്പെടുന്നു എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു; ‘കവിഞ്ഞൊഴുക്കിൽനിന്ന്’ എന്ന ദൃശ്യാത്മക സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു. γάρന്റെ വിശദീകരണബലം ‘-ല്ലോ’ വഴി പകർന്നു.
- source_word: τῆς καρδίας
  choice: ഹൃദയത്തിന്റെ
  rationale: καρδία വികാരങ്ങൾ മാത്രം അല്ല, ചിന്തയും ഇച്ഛയും ഉൾപ്പെടുന്ന ആന്തരിക വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ ബൈബിൾപ്രയോഗമായ ‘ഹൃദയം’ നിലനിർത്തുന്നു.
- source_word: τὸ στόμα λαλεῖ
  choice: വായ് സംസാരിക്കുന്നത്
  rationale: ആന്തരിക ധാർമ്മികാവസ്ഥയും പുറമേയുള്ള സംസാരവും തമ്മിലുള്ള ബന്ധം നേരിട്ട് നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്.
theological_decisions:
- issue: ‘ഹൃദയം’ എന്ന രൂപകത്തിന്റെ വ്യാപ്തി
  choice: ആന്തരിക വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ബൈബിൾപദമായി ‘ഹൃദയം’ നിലനിർത്തി.
  alternative: ‘മനസ്സ്’ അല്ലെങ്കിൽ ‘അന്തരംഗം’ എന്ന് വ്യാഖ്യാനിച്ച് നൽകുക.
  rationale: ഗ്രീക്ക് പദം ചിന്ത, ഇച്ഛ, ധാർമ്മിക സ്വഭാവം എന്നിവ ഉൾക്കൊള്ളുന്ന വിശാലമായ ആന്തരിക കേന്ദ്രത്തെ സൂചിപ്പിക്കുന്നു; ഒരു ഘടകത്തിലേക്ക് അതിനെ ചുരുക്കാതിരിക്കാൻ ‘ഹൃദയം’ ഉചിതമാണ്.
- issue: πονηροί എന്ന ധാർമ്മിക വിശേഷണം
  choice: ‘ദുഷ്ടർ’ എന്ന് വിവർത്തനം ചെയ്തു.
  alternative: ‘ചീത്തവർ’ അല്ലെങ്കിൽ ‘തിന്മയുള്ളവർ’.
  rationale: ഇവിടെ യേശു ഗുണനിലവാരത്തെക്കുറിച്ചല്ല, ധാർമ്മിക സ്വഭാവത്തെക്കുറിച്ചാണ് വിധിക്കുന്നത്. ‘ദുഷ്ടർ’ ആ ഭാരം മയപ്പെടുത്താതെയും അനാവശ്യമായി വർധിപ്പിക്കാതെയും നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. അഭിസംബോധനയിലെ മൂർച്ചയും ആലങ്കാരിക ചോദ്യത്തിന്റെ ശക്തിയും നിലനിർത്തി. ‘അണലി’ ἔχιδνα സൂചിപ്പിക്കുന്ന വിഷപ്പാമ്പിനെ വ്യക്തമായി നൽകുന്നു; ‘ഹൃദയം’ വ്യാഖ്യാനാത്മകമായി ചുരുക്കിയിട്ടില്ല.
