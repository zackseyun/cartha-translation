id: MAT.12.8
reference: Matthew 12:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: κύριος γάρ ἐστιν τοῦ σαββάτου ὁ υἱὸς τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/008.yaml
  text: For the Son of Man is Lord of the Sabbath[a][b].
translation:
  language: ml
  text: എന്തെന്നാൽ മനുഷ്യപുത്രൻ ശബ്ബത്തിന്റെ കർത്താവാണ്[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘മനുഷ്യപുത്രൻ ശബ്ബത്തിന്റെ അധിപനാണ്.’
    reason: lexical_alternative
  - marker: b
    text: ‘മനുഷ്യപുത്രൻ’ എന്നത് സുവിശേഷങ്ങളിൽ യേശു തന്നെത്തന്നെ സൂചിപ്പിക്കാൻ ഉപയോഗിക്കുന്ന സവിശേഷ പ്രയോഗമാണ്. ഇതിനെ കൂടുതൽ പൊതുവായി ‘മനുഷ്യനായവൻ’ എന്നും പരിഭാഷപ്പെടുത്താം; എന്നാൽ അങ്ങനെ ചെയ്താൽ അതിനുള്ള സാധ്യതയേറിയ സ്ഥാനനാമപരമായ അനുരണനം മങ്ങിപ്പോകും.
    reason: alternative_reading
lexical_decisions:
- source_word: γάρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ വാദത്തിന് ഈ പ്രസ്താവന നൽകുന്ന വിശദീകരണബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: κύριος
  choice: കർത്താവ്
  rationale: അധികാരവും ക്രിസ്തുശാസ്ത്രപരമായ ഭാരവും നിലനിർത്തുന്ന പതിവായ മലയാള പദം; ‘അധിപൻ’ എന്നത് സാധ്യമായ മറ്റൊരു പരിഭാഷയാണ്.
- source_word: τοῦ σαββάτου
  choice: ശബ്ബത്തിന്റെ
  rationale: κύριος എന്ന പദത്തോടു ചേർന്ന ഗ്രീക്ക് ഷഷ്ഠീവ്യാകരണബന്ധം നേരിട്ട് നിലനിർത്തുന്നു; ഇത് പൊതുവായ വിശ്രമത്തെയല്ല, യഹൂദരുടെ വിശുദ്ധദിനത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: സുവിശേഷങ്ങളിൽ യേശു സ്വയം ഉപയോഗിക്കുന്ന സവിശേഷ നാമവിശേഷണവും ദാനീയേൽ 7-നോടുള്ള സാധ്യതയുള്ള പ്രതിധ്വനിയും നിലനിർത്തുന്നു.
- source_word: ἐστιν
  choice: ആണ്
  rationale: ലളിതമായ വർത്തമാനകാല സംയോജകക്രിയയെ ആധുനികവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: κύριος ... τοῦ σαββάτου എന്ന പ്രയോഗത്തിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ ശക്തി
  choice: ‘ശബ്ബത്തിന്റെ കർത്താവ്’ എന്ന ശക്തമായ അധികാരപ്രഖ്യാപനമായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ശബ്ബത്തിന്റെ അധിപൻ’ അല്ലെങ്കിൽ ‘ശബ്ബത്തിന്മേൽ അധികാരമുള്ളവൻ’
  rationale: യേശുവിന്റെ ശബ്ബത്തിന്മേലുള്ള അധികാരത്തെ മയപ്പെടുത്താതെ നിലനിർത്തുന്നു; അതേസമയം മൂലപാഠം പറയുന്നതിലധികം വിശദീകരണം വാക്യത്തിൽ ചേർക്കുന്നില്ല.
- issue: ὁ υἱὸς τοῦ ἀνθρώπου എന്ന പ്രയോഗം
  choice: സ്ഥിരമായ നാമവിശേഷണമായി ‘മനുഷ്യപുത്രൻ’ എന്നു നൽകി.
  alternative: ‘മനുഷ്യനായവൻ’
  rationale: ഒരു പൊതുവായ മനുഷ്യനെ മാത്രം സൂചിപ്പിക്കുന്നതിലേക്കു പ്രയോഗത്തെ ചുരുക്കാതെ, സുവിശേഷപരമ്പരയിലെ നാമവിശേഷണസ്വഭാവവും അന്തർപാഠപരമായ പ്രതിധ്വനിയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘ആകുന്നു’ എന്നതിനു പകരം ഇന്നത്തെ സാധാരണ വായനയ്ക്ക് അനുയോജ്യമായ ‘ആണ്’ ഉപയോഗിച്ചു; ‘ശബ്ബത്ത്’, ‘കർത്താവ്’, ‘മനുഷ്യപുത്രൻ’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തി.
