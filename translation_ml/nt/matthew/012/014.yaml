id: MAT.12.14
reference: Matthew 12:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂ἐξελθόντες δὲ οἱ Φαρισαῖοι συμβούλιον ἔλαβον κατ’ αὐτοῦ⸃ ὅπως αὐτὸν ἀπολέσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/014.yaml
  text: But the Pharisees went out and conspired against him, how they might destroy him.
translation:
  language: ml
  text: എന്നാൽ പരീശന്മാർ പുറത്തുപോയി, അവനെ എങ്ങനെ നശിപ്പിക്കാമെന്ന് അവനെതിരെ ആലോചന നടത്തി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവനെ കൊല്ലുക” അല്ലെങ്കിൽ “അവന് മരണശിക്ഷ നൽകുക.” ഗ്രീക്കിൽ “നശിപ്പിക്കുക” എന്നാണ്; ഈ സന്ദർഭത്തിൽ അതിൽ മരണോദ്ദേശ്യം ഉൾപ്പെട്ടേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντες
  choice: പുറത്തുപോയി
  rationale: അയോറിസ്റ്റ് കൃതന്തത്തിന്റെ കാലക്രമസൂചന സ്വാഭാവിക മലയാളത്തിൽ തുടർക്രിയയായി നൽകുന്നു; അവർ അവിടെനിന്ന് പുറപ്പെട്ടതും നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: യേശുവിന്റെ പ്രവൃത്തിയിൽനിന്ന് പരീശന്മാരുടെ ശത്രുതാപരമായ പ്രതികരണത്തിലേക്കുള്ള നേരിയ വൈരുധ്യപരമായ കഥാമാറ്റം പ്രകടമാക്കുന്നു.
- source_word: οἱ Φαρισαῖοι
  choice: പരീശന്മാർ
  rationale: ഈ യഹൂദ മതവിഭാഗത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള പേരാണ്.
- source_word: συμβούλιον ἔλαβον
  choice: ഗൂഢാലോചന നടത്തി
  rationale: പദശഃ ‘ആലോചന കൈക്കൊണ്ടു’ എന്ന പ്രയോഗം, തുടർന്നുള്ള നാശലക്ഷ്യം കാരണം ഇവിടെ രഹസ്യവും ശത്രുതാപരവുമായ പദ്ധതിയിടലിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: κατ’ αὐτοῦ
  choice: അവനെതിരെ
  rationale: ജനിറ്റീവോടുകൂടിയ κατά ഇവിടെ എതിർപ്പിന്റെയും ശത്രുതയുടെയും അർഥത്തിലാണ്.
- source_word: ὅπως
  choice: എങ്ങനെ ... എന്ന്
  rationale: ഗൂഢാലോചനയുടെ ഉള്ളടക്കവും ആലോചനാത്മക ഭാവവും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: ἀπολέσωσιν
  choice: നശിപ്പിക്കാമെന്ന്
  rationale: ἀπόλλυμι എന്ന ക്രിയയുടെ വിശാലമായ ‘നശിപ്പിക്കുക’ എന്ന അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ മരണോദ്ദേശ്യം ഉൾക്കൊള്ളാമെങ്കിലും മുഖ്യവാചകത്തിൽ അതിനെ അനാവശ്യമായി ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: ἀπολέσωσιν എന്നതിലെ അർഥനിർദ്ദിഷ്ടതയുടെ തോത്
  choice: നശിപ്പിക്കുക
  alternative: കൊല്ലുക; മരണത്തിന് ഏൽപ്പിക്കുക
  rationale: സന്ദർഭം കടുത്ത ശത്രുതയും സാദ്ധ്യമായ മരണോദ്ദേശ്യവും വ്യക്തമാക്കുന്നു. എങ്കിലും ഗ്രീക്ക് ക്രിയ വ്യക്തമായി ‘കൊല്ലുക’ എന്നതിലുപരി വിശാലമാണ്; അതിനാൽ മുഖ്യവാചകം ആ വിശാലത നിലനിർത്തുകയും അടിക്കുറിപ്പ് സന്ദർഭസാദ്ധ്യമായ കൂടുതൽ വ്യക്തമായ അർഥങ്ങൾ അറിയിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കഥാശൈലി. ‘ഗൂഢാലോചന നടത്തി’ എന്നത് ശത്രുതാപരമായ ആലോചനയെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; ‘നശിപ്പിക്കുക’ മൂലഭാഷയിലെ അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
