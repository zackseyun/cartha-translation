id: MAT.12.23
reference: Matthew 12:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐξίσταντο πάντες οἱ ὄχλοι καὶ ἔλεγον· Μήτι οὗτός ἐστιν ὁ υἱὸς Δαυίδ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/023.yaml
  text: And all the crowds were astonished and said[b][a], “Can this be the Son of David?”
translation:
  language: ml
  text: ജനക്കൂട്ടങ്ങളെല്ലാം അത്ഭുതപ്പെട്ടു; “ഇവൻ ദാവീദിന്റെ പുത്രനായിരിക്കുമോ?[b][a]” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ദാവീദിന്റെ പുത്രൻ” എന്നത് ദാവീദിന്റെ വംശത്തിൽനിന്നുള്ള വാഗ്ദത്ത രാജകീയ രക്ഷകനായ മശീഹയെ സൂചിപ്പിക്കുന്ന പദവിയാണ്.
    reason: cross_reference
  - marker: b
    text: 'ചോദ്യത്തിന്റെ ഭാവം കൂടുതൽ അക്ഷരാർഥമായി: “ഇവൻ ദാവീദിന്റെ പുത്രനായിരിക്കില്ലല്ലോ, അല്ലേ?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: അത്ഭുതപ്പെട്ടു
  rationale: രോഗസൗഖ്യത്തോടുള്ള ജനങ്ങളുടെ ശക്തവും തുടരുന്നതുമായ വിസ്മയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: πάντες οἱ ὄχλοι
  choice: ജനക്കൂട്ടങ്ങളെല്ലാം
  rationale: ഗ്രീക്കിലെ ബഹുവചനമായ ὄχλοιയും സമഗ്രത സൂചിപ്പിക്കുന്ന πάντεςഉം നിലനിർത്തുന്നു.
- source_word: ἔλεγον
  choice: എന്നു ചോദിച്ചു
  rationale: വാചകം ചോദ്യരൂപത്തിലുള്ളതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ സംഭാഷണാവതരണം നൽകുന്നു; ഗ്രീക്കിലെ imperfect സൂചിപ്പിക്കുന്ന കൂട്ടായ പ്രതികരണം സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: Μήτι
  choice: ആയിരിക്കുമോ?
  rationale: Μήτι സാധാരണയായി നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്നതോ മടിയോടെയുള്ള സംശയം പ്രകടിപ്പിക്കുന്നതോ ആയ ചോദ്യം അവതരിപ്പിക്കുന്നു. ഉറച്ച നിഷേധമായി മാറ്റാതെ വിസ്മയത്തോടെയുള്ള സാധ്യതാചോദ്യം നിലനിർത്തുന്നു.
- source_word: ὁ υἱὸς Δαυίδ
  choice: ദാവീദിന്റെ പുത്രൻ
  rationale: മത്തായിയിൽ മശീഹയെ സൂചിപ്പിക്കുന്ന ചരിത്രപരവും ദൈവശാസ്ത്രപരവുമായി പ്രാധാന്യമുള്ള പദവി അതേ രൂപത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: “ദാവീദിന്റെ പുത്രൻ” എന്ന പദവിയുടെ മശീഹാസംബന്ധമായ അർഥം
  choice: പ്രധാനപാഠത്തിൽ “ദാവീദിന്റെ പുത്രൻ” എന്നു തന്നെ നിലനിർത്തി.
  alternative: “മശീഹ” അല്ലെങ്കിൽ “ദാവീദിന്റെ വാഗ്ദത്ത അവകാശി” എന്നു വ്യാഖ്യാനപരമായി പരിഭാഷപ്പെടുത്തുക.
  rationale: ഗ്രീക്ക് മൂലപാഠം പദവി തന്നെയാണ് ഉപയോഗിക്കുന്നത്. അതിനെ വ്യാഖ്യാനപരമായി തീർപ്പാക്കാതെ അതിന്റെ ചരിത്രപരവും ദൈവശാസ്ത്രപരവുമായ ഭാരം സംരക്ഷിക്കുകയും വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
- issue: Μήτι എന്ന ചോദ്യകണത്തിന്റെ നിഷേധാത്മക പ്രതീക്ഷ
  choice: “ആയിരിക്കുമോ?” എന്ന മടിയും വിസ്മയവും കലർന്ന ചോദ്യം ഉപയോഗിച്ചു.
  alternative: “ഇവൻ ദാവീദിന്റെ പുത്രനല്ലല്ലോ, അല്ലേ?” എന്ന കൂടുതൽ അക്ഷരാർഥപരമായ നിഷേധചോദ്യം.
  rationale: മൂലത്തിലെ നിഷേധാത്മക പ്രതീക്ഷ പൂർണമായി ഇല്ലാതാക്കാതെ, ഈ സന്ദർഭത്തിലെ അത്ഭുതവും തുറന്ന സംശയവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; കൂടുതൽ അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. “ജനക്കൂട്ടങ്ങളെല്ലാം” ബഹുവചനം സംരക്ഷിക്കുന്നു; “ദാവീദിന്റെ പുത്രൻ” എന്ന പദവി വ്യാഖ്യാനിച്ച് മാറ്റാതെ നിലനിർത്തുന്നു. പ്രധാനപാഠത്തിലെ അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ഇംഗ്ലീഷ് POB-യിലെ ക്രമമായ [b][a] അനുസരിച്ചാണ്.
