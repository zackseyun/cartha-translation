id: MAT.12.44
reference: Matthew 12:44
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τότε λέγει· ⸂Εἰς τὸν οἶκόν μου ἐπιστρέψω⸃ ὅθεν ἐξῆλθον· καὶ ἐλθὸν ⸀εὑρίσκει ⸀σχολάζοντα σεσαρωμένον καὶ κεκοσμημένον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/044.yaml
  text: Then it says[a], ‘I will return to my house from which I came out,’ and when it comes, it finds it unoccupied, swept[b], and put in order.
translation:
  language: ml
  text: 'അപ്പോൾ അത് പറയുന്നു: ‘ഞാൻ വിട്ടുപോന്ന എന്റെ വീട്ടിലേക്കു മടങ്ങിച്ചെല്ലും.’ അത് അവിടെ എത്തുമ്പോൾ, വീട് ഒഴിഞ്ഞുകിടക്കുന്നതായും[a] അടിച്ചുവാരിയതും ക്രമപ്പെടുത്തിയിരിക്കുന്നതുമായ നിലയിൽ കാണുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ശൂന്യമായി.’
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: അപ്പോൾ
  rationale: തുടർന്നുള്ള പ്രവൃത്തിയെ പരിചയപ്പെടുത്തുന്ന സമയസൂചക ക്രിയാവിശേഷണത്തിന് സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളം.
- source_word: λέγει
  choice: അത് പറയുന്നു
  rationale: മുൻസന്ദർഭത്തിലെ അശുദ്ധാത്മാവാണ് കർത്താവ്; ഗ്രീക്കിലെ സജീവമായ വർത്തമാനകാല വിവരണം നിലനിർത്തുന്നു.
- source_word: Εἰς τὸν οἶκόν μου ἐπιστρέψω
  choice: എന്റെ വീട്ടിലേക്കു മടങ്ങിച്ചെല്ലും
  rationale: ἐπιστρέφω എന്നതിന്റെ മടങ്ങിപ്പോകുക/തിരികെച്ചെല്ലുക എന്ന ദിശാബോധവും ആത്മാവ് ഉന്നയിക്കുന്ന ‘എന്റെ വീട്’ എന്ന അവകാശവാദവും നിലനിർത്തുന്നു.
- source_word: ὅθεν ἐξῆλθον
  choice: ഞാൻ വിട്ടുപോന്ന
  rationale: വീട്ടിൽനിന്ന് പുറത്തുപോയതിനെ സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു; ‘വീട്’ എന്ന പ്രത്യക്ഷചിത്രം മാറ്റുന്നില്ല.
- source_word: ἐλθὸν
  choice: അത് അവിടെ എത്തുമ്പോൾ
  rationale: മുഖ്യക്രിയയ്ക്കു മുമ്പുള്ള aorist participle-ന്റെ കാലക്രമം സ്വാഭാവികമായ സമയവാക്യമായി അവതരിപ്പിക്കുന്നു.
- source_word: εὑρίσκει
  choice: കാണുന്നു
  rationale: ഇവിടെ ‘ഒരു അവസ്ഥയിൽ കണ്ടെത്തുന്നു’ എന്ന അർഥത്തിന് സ്വാഭാവികമായ മലയാളപ്രയോഗം; വിവരണത്തിലെ വർത്തമാനകാലം നിലനിർത്തുന്നു.
- source_word: σχολάζοντα
  choice: ആളൊഴിഞ്ഞതായി
  rationale: വീട് അധിവസിക്കപ്പെടാതെ ലഭ്യമാണെന്ന ആശയം നൽകുന്നു; വെറും ഭൗതിക ശൂന്യത മാത്രമായി അർഥം ചുരുക്കുന്നില്ല.
- source_word: σεσαρωμένον
  choice: അടിച്ചുവാരിയതും
  rationale: σαρόω എന്ന ക്രിയയുടെ പൂർത്തിയായ ഫലാവസ്ഥയെ സംക്ഷിപ്തമായി അറിയിക്കുന്നു.
- source_word: κεκοσμημένον
  choice: ക്രമപ്പെടുത്തിയതുമായി
  rationale: κοσμέω എന്നതിലെ ക്രമപ്പെടുത്തുക എന്ന അർഥം സന്ദർഭത്തിന് യോജിക്കുന്നു; അലങ്കാരത്തെ അനാവശ്യമായി മുൻനിറുത്തുന്നില്ല.
theological_decisions:
- issue: മടങ്ങിവരുന്ന അശുദ്ധാത്മാവിന്റെ വചനത്തിലെ ‘വീട്’ എന്ന രൂപകം
  choice: മുഖ്യപാഠത്തിൽ ‘വീട്’ എന്ന പദം അതേപടി നിലനിർത്തി.
  alternative: ‘ഞാൻ വിട്ടുപോന്ന വ്യക്തിയിലേക്കു മടങ്ങും’ എന്നു രൂപകം വിശദീകരിക്കുക.
  rationale: സന്ദർഭം രൂപകത്തിന്റെ സൂചന നൽകുന്നുവെങ്കിലും വാക്യം തന്നെ ‘വീട്’ എന്നാണ് പറയുന്നത്. പ്രത്യക്ഷചിത്രം നിലനിർത്തുന്നത് വ്യാഖ്യാനപരമായ അധികവിവരണം ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ സജീവ വർത്തമാനകാലവും വീടിന്റെ രൂപകവും പൂർത്തിയായ അവസ്ഥകളുടെ നിരയും നിലനിർത്തിയിരിക്കുന്നു. അടിക്കുറിപ്പുകളുടെ ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങൾക്ക് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
