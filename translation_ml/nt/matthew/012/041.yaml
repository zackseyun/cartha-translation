id: MAT.12.41
reference: Matthew 12:41
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἄνδρες Νινευῖται ἀναστήσονται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινοῦσιν αὐτήν· ὅτι μετενόησαν εἰς τὸ κήρυγμα Ἰωνᾶ, καὶ ἰδοὺ πλεῖον Ἰωνᾶ ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/041.yaml
  text: The men of Nineveh will rise up in the judgment with this generation and will condemn it[a], because they repented at the preaching of Jonah, and behold[b], something greater than Jonah is here.
translation:
  language: ml
  text: ന്യായവിധിയിൽ നിനവേക്കാരായ പുരുഷന്മാർ ഈ തലമുറയോടൊപ്പം ഉയിർത്തെഴുന്നേൽക്കും; അവർ അതിനെ കുറ്റം വിധിക്കും. കാരണം, യോനയുടെ പ്രസംഗത്തിനു പ്രതികരിച്ച് അവർ മാനസാന്തരപ്പെട്ടു.[a] ഇതാ, യോനയെക്കാൾ വലിയതു ഇവിടെ ഉണ്ട്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യോനയുടെ പ്രസംഗം കേട്ട് അവർ മാനസാന്തരപ്പെട്ടു.”
    reason: εἰς τὸ κήρυγμα എന്നത് യോനയുടെ പ്രസംഗത്തോടുള്ള പ്രതികരണത്തെ സൂചിപ്പിക്കുന്നു; കൂടുതൽ പരമ്പരാഗതമായ മലയാള രൂപം നൽകുന്നു.
  - marker: b
    text: അഥവാ, “യോനയെക്കാൾ വലിയവൻ ഇവിടെ ഉണ്ട്.” ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “യോനയെക്കാൾ വലിയതു” എന്ന നപുംസകലിംഗപ്രയോഗമാണ്; അതു യേശു എന്ന വ്യക്തിയെ മാത്രമല്ല, അവനിൽ സന്നിഹിതമായ വലിയ യാഥാർഥ്യത്തെയും ഊന്നിപ്പറയാം.
    reason: ഗ്രീക്ക് നപുംസകലിംഗപ്രയോഗവും സാധ്യമായ വ്യക്തിസൂചക വിവർത്തനവും തമ്മിലുള്ള യഥാർഥ വ്യത്യാസം വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: ἄνδρες Νινευῖται
  choice: നിനവേക്കാരായ പുരുഷന്മാർ
  rationale: ἄνδρες എന്ന പദത്തിന്റെ വ്യക്തമായ പുരുഷലിംഗ അർഥം നിലനിർത്തുകയും Νινευῖται എന്ന ജനനാമം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀναστήσονται
  choice: ഉയിർത്തെഴുന്നേറ്റ്
  rationale: അന്ത്യന്യായവിധിയുടെ പശ്ചാത്തലത്തിൽ ഉയിർപ്പിന്റെ സൂചന നിലനിർത്തുന്ന സ്വാഭാവിക പ്രയോഗം.
- source_word: ἐν τῇ κρίσει
  choice: ന്യായവിധിയിൽ
  rationale: κρίσις സൂചിപ്പിക്കുന്ന ന്യായവിധിസംഭവത്തെ സംക്ഷിപ്തമായും വ്യക്തമായും നൽകുന്നു.
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: ഈ തലമുറയോടൊപ്പം
  rationale: μετά + genitive എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘കൂടെ/ഒപ്പം’ നിലനിർത്തുന്നു; വിരോധാത്മക ഭാവം തുടർന്നുള്ള കുറ്റംവിധിക്കൽ വ്യക്തമാക്കുന്നു.
- source_word: κατακρινοῦσιν αὐτήν
  choice: അതിനെ കുറ്റംവിധിക്കും
  rationale: κατακρίνω എന്നതിന്റെ condemnation എന്ന ശക്തമായ ന്യായിക അർഥം നൽകുന്നു; ‘അതിനെ’ എന്നത് ഈ തലമുറയെ സൂചിപ്പിക്കുന്നു.
- source_word: μετενόησαν
  choice: മാനസാന്തരപ്പെട്ടു
  rationale: പ്രവാചകപ്രഘോഷണത്തോടുള്ള പശ്ചാത്താപപൂർവമായ തിരിഞ്ഞുവരവിനെ സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾഭാഷയിൽ പരിചിതവും കൃത്യവുമായ പദം.
- source_word: εἰς τὸ κήρυγμα Ἰωνᾶ
  choice: യോനയുടെ പ്രസംഗത്തോടു പ്രതികരിച്ച്
  rationale: εἰς ഇവിടെ സൂചിപ്പിക്കുന്ന സന്ദേശത്തോടുള്ള പ്രതികരണബന്ധം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗൗരവമുള്ള വ്യവഹാരചിഹ്നത്തെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: πλεῖον Ἰωνᾶ ὧδε
  choice: യോനയെക്കാൾ വലിയതു ഇവിടെ ഉണ്ട്
  rationale: πλεῖον എന്ന നപുംസകലിംഗപ്രയോഗത്തെ ‘വലിയതു’ എന്നു നിലനിർത്തി, വെറും വ്യക്തിതാരതമ്യത്തിലേക്ക് അർഥം ചുരുക്കാതെ ഗ്രീക്കിലെ തുറന്ന ഭാവം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: πλεῖον Ἰωνᾶ എന്ന നപുംസകലിംഗ താരതമ്യപ്രയോഗം യേശുവിന്റെ സ്വസൂചനയായി എങ്ങനെ നൽകണം
  choice: യോനയെക്കാൾ വലിയതു ഇവിടെ ഉണ്ട്
  alternative: യോനയെക്കാൾ വലിയവൻ ഇവിടെ ഉണ്ട്
  rationale: ഗ്രീക്കിൽ പുരുഷലിംഗമായ ‘വലിയവൻ’ എന്നല്ല, നപുംസകലിംഗമായ πλεῖον ആണ്. അതിനാൽ യേശുവിലെയും അവന്റെ ശുശ്രൂഷയിലെയും മഹത്തായ യാഥാർഥ്യത്തെ ഉൾക്കൊള്ളാവുന്ന യഥാർഥ അവ്യക്തത നിലനിർത്തുന്നു.
- issue: ἄνδρες എന്ന പദത്തിലെ ലിംഗസൂചന
  choice: പുരുഷന്മാർ
  alternative: ജനങ്ങൾ
  rationale: മൂലപാഠം പൊതുവായ നിവാസികളെ സൂചിപ്പിക്കുന്ന പദമല്ല, വ്യക്തമായി പുരുഷന്മാരെ സൂചിപ്പിക്കുന്ന ἄνδρες ആണ് ഉപയോഗിക്കുന്നത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘ന്യായവിധി’, ‘ഉയിർത്തെഴുന്നേൽക്കുക’, ‘മാനസാന്തരപ്പെടുക’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തിയപ്പോൾ, വാക്യബന്ധം സ്വാഭാവികമാക്കി. എല്ലാ അടിക്കുറിപ്പുചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
