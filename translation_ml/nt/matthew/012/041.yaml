revisions:
- from: ന്യായവിധിയിൽ നിനവേക്കാരായ പുരുഷന്മാർ ഈ തലമുറയോടൊപ്പം ഉയിർത്തെഴുന്നേറ്റ് അതിനെ കുറ്റംവിധിക്കും; കാരണം, യോനയുടെ പ്രസംഗത്തോടു പ്രതികരിച്ച് അവർ മാനസാന്തരപ്പെട്ടു.[a] എന്നാൽ ഇതാ, യോനയെക്കാൾ വലിയതു ഇവിടെ ഉണ്ട്.[b]
