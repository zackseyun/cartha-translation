  text: ⸀ἵνα πληρωθῇ τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/017.yaml
  text: 'so that what was spoken through Isaiah the prophet might be fulfilled[a], saying:'
translation:
  language: ml
  text: 'ഇങ്ങനെ, യെശയ്യാ പ്രവാചകനിലൂടെ അരുളിച്ചെയ്തത് നിവൃത്തിയാകേണ്ടതിന്[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യെശയ്യാ പ്രവാചകനാൽ.’ ഗ്രീക്കിൽ കൂടുതൽ അക്ഷരാർഥമായി ‘യെശയ്യാ പ്രവാചകനിലൂടെ’ എന്നാണ്; ഇത് പ്രവാചകന്റെ മധ്യസ്ഥപങ്ക് എടുത്തുകാട്ടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ഇങ്ങനെ ... നിവൃത്തിയാകേണ്ടതിന്
  rationale: ഉദ്ദേശ്യം/ഫലം എന്നീ രണ്ടർഥസാധ്യതകളും പൂർണമായി ചുരുക്കിക്കളയാതെ, മത്തായിയുടെ ഉദ്ധരണിസൂത്രത്തിന് സ്വാഭാവികമായ മലയാളബന്ധം നൽകുന്നു.
- source_word: πληρωθῇ
  choice: നിവൃത്തിയാകേണ്ടതിന്
  rationale: ἵνα-യോടുകൂടിയ aorist passive subjunctive-ന്റെ പൂർത്തീകരണഭാവം സൂക്ഷിക്കുകയും മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: τὸ ῥηθὲν
  choice: അരുളിച്ചെയ്തത്
  rationale: ദൈവിക സന്ദേശത്തിന്റെ ഔന്നത്യം സൂചിപ്പിക്കുന്ന, എന്നാൽ കൃത്രിമമായി പഴഞ്ചനാകാത്ത മലയാളപ്രയോഗം; ഗ്രീക്കിലെ passive ആശയം സന്ദർഭാനുസൃതമായി നിലനിർത്തുന്നു.
- source_word: διὰ
  choice: യെശയ്യാ പ്രവാചകനിലൂടെ
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന മധ്യസ്ഥകർത്തൃത്വം കാത്തുസൂക്ഷിക്കുന്നു; പ്രവാചകൻ സന്ദേശത്തിന്റെ അന്തിമ ഉറവിടമാണെന്ന ധാരണ ഒഴിവാക്കുന്നു.
- source_word: Ἠσαΐου
  choice: യെശയ്യാ
  rationale: മലയാള ബൈബിൾപരമ്പരയിൽ വ്യാപകവും തിരിച്ചറിയാവുന്നതുമായ പേരുരൂപം.
- source_word: τοῦ προφήτου
  choice: പ്രവാചകൻ
  rationale: യെശയ്യാവിനെ തിരിച്ചറിയിക്കുന്ന appositional പദവി വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: λέγοντος
  choice: തുടർന്നുള്ള ഉദ്ധരണിയിലേക്ക് നയിക്കുന്ന ദ്വിബിന്ദു
  rationale: ഗ്രീക്കിലെ ‘പറയുന്ന’ എന്ന participle മലയാളത്തിൽ അക്ഷരാർത്ഥമായി ചേർത്താൽ അസ്വാഭാവികമാകുന്നതിനാൽ, തുടർന്നുവരുന്ന നേരിട്ടുള്ള ഉദ്ധരണിയെ ദ്വിബിന്ദുവിലൂടെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: പ്രവാചക മധ്യസ്ഥത
  choice: യെശയ്യാ പ്രവാചകനിലൂടെ
  alternative: യെശയ്യാ പ്രവാചകനാൽ
  rationale: ഗ്രീക്കിലെ διά + genitive ദൈവം അന്തിമ പ്രഭാഷകനും യെശയ്യാവ് മനുഷ്യ മധ്യസ്ഥനും ആണെന്ന സൂചന നൽകുന്നു; ‘ലൂടെ’ ഈ വ്യത്യാസം കൂടുതൽ വ്യക്തമായി സൂക്ഷിക്കുന്നു.
- issue: ἵνα ഘടനയിലെ ഉദ്ദേശ്യം/ഫലം
  choice: ഇങ്ങനെ ... നിവൃത്തിയാകേണ്ടതിന്
  alternative: അങ്ങനെ ... നിവൃത്തിയായി
  rationale: subjunctive ഘടനയെ വെറും സംഭവിച്ച ഫലമായി മാത്രം ചുരുക്കാതെ മത്തായിയുടെ fulfillment formula-യിലെ ഉദ്ദേശ്യ-ഫല പിരിമുറുക്ക് നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ബൈബിൾശൈലി. ‘അരുളിച്ചെയ്തത്,’ ‘നിവൃത്തിയാകേണ്ടതിന്’ എന്നിവ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും ഉദ്ധരണിസൂത്രത്തിന്റെ ഔന്നത്യം നിലനിർത്തുന്നതുമാണ്. λέγοντος അടുത്ത വാക്യത്തിലെ ഉദ്ധരണിയെ പരിചയപ്പെടുത്തുന്നതിനാൽ മലയാളത്തിൽ ദ്വിബിന്ദുവായി സ്വാഭാവികമാക്കി.
