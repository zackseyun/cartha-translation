id: MAT.20.25
reference: Matthew 20:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς προσκαλεσάμενος αὐτοὺς εἶπεν· Οἴδατε ὅτι οἱ ἄρχοντες τῶν ἐθνῶν κατακυριεύουσιν αὐτῶν καὶ οἱ μεγάλοι κατεξουσιάζουσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/025.yaml
  text: But Jesus[a], calling them to himself, said, “You know that the rulers of the Gentiles lord it over them[b], and their great men exercise authority over them.”
translation:
  language: ml
  text: 'എന്നാൽ യേശു അവരെ തന്റെ അടുക്കൽ വിളിച്ച് പറഞ്ഞു: “ജനതകളുടെ[a] ഭരണാധികാരികൾ അവരുടെമേൽ ആധിപത്യം പുലർത്തുകയും അവരിലെ പ്രമുഖർ[b] അവരുടെമേൽ അധികാരം പ്രയോഗിക്കുകയും ചെയ്യുന്നു എന്നു നിങ്ങൾക്കറിയാം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “യഹൂദേതരരുടെ.”
    reason: ἔθνη എന്ന ഗ്രീക്കുപദത്തിന് ‘ജനതകൾ’ എന്നും യഹൂദസന്ദർഭത്തിൽ ‘യഹൂദേതരർ’ എന്നും അർഥമാകാം.
  - marker: b
    text: അഥവാ “അവരിലെ ഉന്നതന്മാർ” അല്ലെങ്കിൽ “അവരുടെ ഉന്നത ഉദ്യോഗസ്ഥർ.”
    reason: οἱ μεγάλοι സാമൂഹികമായി പ്രമുഖരെയോ ഉയർന്ന അധികാരസ്ഥാനത്തുള്ളവരെയോ സൂചിപ്പിക്കാം.
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: അവരെ തന്റെ അടുക്കൽ വിളിച്ച്
  rationale: മധ്യപ്രയോഗത്തിലുള്ള ക്രിയാരൂപം യേശു ശിഷ്യന്മാരെ തന്റെ അടുക്കലേക്കു വിളിച്ചുകൂട്ടിയെന്ന ആശയം നൽകുന്നു; മലയാളത്തിൽ ഇത് സ്വാഭാവികമായും വ്യക്തമായും പ്രകടമാകുന്നു.
- source_word: Οἴδατε
  choice: നിങ്ങൾക്കറിയാം
  rationale: രൂപത്തിൽ പൂർണകാലമാണെങ്കിലും ഇവിടെ വർത്തമാന അർഥമാണ്; സാധാരണ മലയാളത്തിൽ ‘നിങ്ങൾക്കറിയാം’ അതിനെ കൃത്യമായി നൽകുന്നു.
- source_word: ἄρχοντες
  choice: ഭരണാധികാരികൾ
  rationale: ഭരിക്കുകയോ അധികാരം വഹിക്കുകയോ ചെയ്യുന്നവരെയാണ് പദം സൂചിപ്പിക്കുന്നത്; രാഷ്ട്രീയസന്ദർഭത്തിൽ ‘ഭരണാധികാരികൾ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: τῶν ἐθνῶν
  choice: ജനതകളുടെ
  rationale: ἔθνη എന്ന പദത്തിന്റെ ‘ജനതകൾ/യഹൂദേതരർ’ എന്ന യഥാർഥ അർഥവ്യാപ്തി ‘ജനതകൾ’ സംരക്ഷിക്കുന്നു; യഹൂദസന്ദർഭത്തിൽ ‘യഹൂദേതരർ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: κατακυριεύουσιν
  choice: ആധിപത്യം പുലർത്തുന്നു
  rationale: വെറും ഭരണം എന്നതിലുപരി മേൽക്കോയ്മയോടെ നിയന്ത്രിക്കുന്ന പ്രതികൂലധ്വനി ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: οἱ μεγάλοι
  choice: അവരിലെ പ്രമുഖർ
  rationale: സാമൂഹികമായോ രാഷ്ട്രീയമായോ പ്രാധാന്യമുള്ള വ്യക്തികളെയാണ് നാമവൽക്കരിച്ച വിശേഷണം സൂചിപ്പിക്കുന്നത്; സന്ദർഭത്തിൽനിന്നുള്ള ബന്ധം ‘അവരിലെ’ എന്നു സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: κατεξουσιάζουσιν
  choice: അധികാരം പ്രയോഗിക്കുന്നു
  rationale: മറ്റുള്ളവരുടെമേൽ അധികാരം ചെലുത്തുക എന്ന അടിസ്ഥാനാർഥം കൃത്യമായി നൽകുന്നു; സമാന്തരമായ ‘ആധിപത്യം പുലർത്തുന്നു’ എന്ന പ്രയോഗം പ്രതികൂലസന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: αὐτῶν
  choice: അവരുടെമേൽ
  rationale: സർവനാമം ജനതകളെ, അഥവാ ഭരിക്കപ്പെടുന്ന ആളുകളെ, സൂചിപ്പിക്കുന്നു; ആവർത്തനം ഒഴിവാക്കി മലയാളത്തിൽ സ്വാഭാവികമായി വിവർത്തനം ചെയ്തു.
theological_decisions:
- issue: യഹൂദസന്ദർഭത്തിലെ ἐθνῶν എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ജനതകളുടെ
  alternative: യഹൂദേതരരുടെ
  rationale: മൂലപദത്തിന് ‘ജനതകൾ’ എന്നും യഹൂദകാഴ്ചപ്പാടിൽ ‘യഹൂദേതരർ’ എന്നും അർഥമാകാം. മുഖ്യപാഠം വിശാലമായ പദാർഥം നിലനിർത്തുകയും സന്ദർഭോചിതമായ മറ്റർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- issue: οἱ μεγάλοι എന്ന പുല്ലിംഗ ബഹുവചനത്തിന്റെ അവതരണം
  choice: അവരിലെ പ്രമുഖർ
  alternative: അവരിലെ ഉന്നതന്മാർ; അവരുടെ ഉന്നത ഉദ്യോഗസ്ഥർ
  rationale: ഇവിടെ സാമൂഹിക-രാഷ്ട്രീയ പ്രാധാന്യമുള്ളവരെയാണ് ഉദ്ദേശിക്കുന്നത്. ‘പ്രമുഖർ’ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു; പദശഃസമീപവും ഔദ്യോഗികസ്ഥാനസൂചനയുള്ളതുമായ സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. വാക്യത്തിന്റെ സമാന്തരഘടനയും അധികാരദുരുപയോഗത്തിന്റെ പ്രതികൂലധ്വനിയും സംരക്ഷിച്ചിട്ടുണ്ട്; മൂലത്തിലെ അർഥസന്ദിഗ്ധതകൾ അടിക്കുറിപ്പുകളിൽ നിലനിർത്തിയിട്ടുണ്ട്.
