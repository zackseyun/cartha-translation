revisions:
- from: ആദ്യം ജോലിക്കെത്തിയവർ വന്നപ്പോൾ[a], തങ്ങൾക്ക് കൂടുതൽ കിട്ടുമെന്ന് അവർ കരുതി. എന്നാൽ അവർക്കും ആളൊന്നിന് ഒരു ദിനാർ വീതമേ ലഭിച്ചുള്ളൂ.[b]
  to: ആദ്യം കൂലിക്കെടുത്തവർ[a] എത്തിയപ്പോൾ, തങ്ങൾക്ക് കൂടുതൽ ലഭിക്കുമെന്ന് അവർ കരുതി; എന്നാൽ അവർക്കും ഓരോരുത്തർക്കും ഒരു ദിനാർ വീതം ലഭിച്ചു.[b]
  rationale: The revision removes redundancy, makes the contextual reference to the first-hired laborers clear, retains the Greek distributive sense (‘ഓരോരുത്തർക്കും ... വീതം’), and expresses the emphatic ‘they too’ with ‘അവർക്കും’ without introducing an unwarranted restrictive particle. Footnote a has been relocated and revised for natural Malayalam.
