id: MAT.20.10
reference: Matthew 20:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂καὶ ἐλθόντες⸃ οἱ πρῶτοι ἐνόμισαν ὅτι ⸀πλεῖον λήμψονται· καὶ ἔλαβον ⸂τὸ ἀνὰ δηνάριον καὶ αὐτοί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/010.yaml
  text: When the first ones came[a], they thought they would receive more[b], but they too received a denarius each.
translation:
  language: ml
  text: ആദ്യം കൂലിക്കെടുത്തവർ[a] എത്തിയപ്പോൾ, തങ്ങൾക്ക് കൂടുതൽ ലഭിക്കുമെന്ന് അവർ കരുതി; എന്നാൽ അവർക്കും ഓരോരുത്തർക്കും ഒരു ദിനാർ വീതം ലഭിച്ചു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആദ്യം വന്നവർ”; ഉപമയിൽ ആദ്യം കൂലിക്കെടുത്ത തൊഴിലാളികളെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ഒരു ദിനാർ സാധാരണയായി ഒരു തൊഴിലാളിയുടെ ഒരു ദിവസത്തെ കൂലിയായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθόντες
  choice: വന്നപ്പോൾ
  rationale: ഏറിസ്റ്റ് കൃദന്തത്തിന്റെ കാലസൂചകപ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; സംഭവക്രമവും നിലനിർത്തുന്നു.
- source_word: οἱ πρῶτοι
  choice: ആദ്യം ജോലിക്കെത്തിയവർ
  rationale: ഉപമയിൽ ആദ്യം കൂലിക്കെടുത്ത തൊഴിലാളികളെയാണ് സൂചിപ്പിക്കുന്നത്. സന്ദർഭസൂചന ചേർക്കുന്നത് മലയാളത്തിൽ പരാമർശം വ്യക്തവും സ്വാഭാവികവുമാക്കുന്നു.
- source_word: ἐνόμισαν
  choice: കരുതി
  rationale: ഉറപ്പല്ല, അവരുടെ അനുമാനവും പ്രതീക്ഷയുമാണ് νομίζω ഇവിടെ പ്രകടിപ്പിക്കുന്നത്.
- source_word: πλεῖον
  choice: കൂടുതൽ
  rationale: കൂലിയുടെ കൂടുതലായ അളവിനെ സൂചിപ്പിക്കുന്ന താരതമ്യപ്രയോഗത്തിന്റെ ലളിതവും കൃത്യവുമായ പരിഭാഷ.
- source_word: λήμψονται
  choice: കിട്ടുമെന്ന്
  rationale: ഭൂതകാലത്തിലെ ചിന്തയ്ക്കുള്ളിൽ വരുന്ന ഭാവിപ്രതീക്ഷയെ മലയാളത്തിലെ പരോക്ഷവചനത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τὸ ἀνὰ δηνάριον
  choice: ആളൊന്നിന് ഒരു ദിനാർ വീതം
  rationale: ἀνάയുടെ വിതരണാർഥം ‘ആളൊന്നിന് ... വീതം’ എന്ന പ്രയോഗം വ്യക്തമായി നൽകുന്നു; ദിനാർ എന്ന നാണയനാമം നിലനിർത്തുന്നു.
- source_word: καὶ αὐτοί
  choice: അവർക്കും
  rationale: മറ്റുള്ളവരെപ്പോലെ അവർക്കും അതേ കൂലി ലഭിച്ചെന്ന ആശ്ചര്യകരമായ സമത്വത്തിന് ഗ്രീക്ക് നൽകുന്ന ഊന്നൽ സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ദിനാർ’ എന്ന ചരിത്രനാണയനാമം നിലനിർത്തി സാംസ്കാരിക വിവരം അടിക്കുറിപ്പിൽ നൽകി. മുഖ്യവാക്യത്തിലെ ‘വീതമേ’ ഗ്രീക്കിലെ καὶ αὐτοί സൂചിപ്പിക്കുന്ന പ്രതീക്ഷാവിപരീതമായ തുല്യകൂലി മലയാളത്തിൽ സ്വാഭാവികമായി ഊന്നിപ്പറയുന്നു.
