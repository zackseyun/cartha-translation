id: MAT.20.30
reference: Matthew 20:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ δύο τυφλοὶ καθήμενοι παρὰ τὴν ὁδόν, ἀκούσαντες ὅτι Ἰησοῦς παράγει, ἔκραξαν λέγοντες· ⸂Κύριε, ἐλέησον ἡμᾶς⸃, ⸀υἱὸς Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/030.yaml
  text: And behold, two blind men sitting by the road, when they heard that Jesus was passing by, cried out, saying, “Lord, have mercy on us, Son of David.”
translation:
  language: ml
  text: ഇതാ, വഴിയരികിൽ ഇരുന്ന രണ്ടു അന്ധന്മാർ, യേശു അതുവഴി കടന്നുപോകുകയാണെന്ന് കേട്ടപ്പോൾ, “കർത്താവേ, ഞങ്ങളോടു കരുണ കാണിക്കണമേ, ദാവീദിന്റെ പുത്രാ!” എന്നു നിലവിളിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: സംഭവത്തിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന ആഖ്യാനസൂചകത്തിന്റെ ശക്തിയും മത്തായിയുടെ വിവരണത്തിലെ സജീവതയും നിലനിർത്തുന്നു.
- source_word: δύο τυφλοὶ
  choice: രണ്ടു അന്ധന്മാർ
  rationale: ഇവിടെ പരാമർശിക്കുന്നത് വ്യക്തമായി രണ്ടു പുരുഷന്മാരെയായതിനാൽ എണ്ണവും ലിംഗസൂചനയും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: καθήμενοι παρὰ τὴν ὁδόν
  choice: വഴിയരികിൽ ഇരുന്നിരുന്ന
  rationale: അവരുടെ സ്ഥിതിയും സ്ഥലവും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἀκούσαντες ὅτι Ἰησοῦς παράγει
  choice: യേശു അതുവഴി കടന്നുപോകുന്നു എന്നു കേട്ടപ്പോൾ
  rationale: കൃതന്തത്തിന്റെ കാലസംബന്ധം ‘കേട്ടപ്പോൾ’ എന്നു വ്യക്തമാക്കുകയും παράγει എന്നതിന്റെ സന്ദർഭോചിതമായ അർഥം നൽകുകയും ചെയ്യുന്നു.
- source_word: ἔκραξαν λέγοντες
  choice: എന്നു നിലവിളിച്ചു
  rationale: κράζω സൂചിപ്പിക്കുന്ന ശക്തമായ വിളി നിലനിർത്തുന്നു; λέγοντες മലയാളത്തിലെ ഉദ്ധരണിഘടനയിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: ആദരപൂർവമായ നേരിട്ടുള്ള അഭിസംബോധനയും ‘ദാവീദിന്റെ പുത്രൻ’ എന്ന മിശിഹാപദവിയോടൊപ്പമുള്ള ദൈവശാസ്ത്രപരമായ ഭാരവും സംരക്ഷിക്കുന്നു.
- source_word: ἐλέησον ἡμᾶς
  choice: ഞങ്ങളോടു കരുണ തോന്നണമേ
  rationale: കരുണാപൂർവമായ സഹായത്തിനായുള്ള അപേക്ഷയെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: υἱὸς Δαυίδ
  choice: ദാവീദിന്റെ പുത്രാ
  rationale: മത്തായിയിൽ മിശിഹാപദവിയായി പ്രവർത്തിക്കുന്ന പരമ്പരാഗതവും വാച്യസമീപവുമായ രൂപം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യേശുവിനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയിൽ Κύριε എന്നതിന്റെ പരിഭാഷ
  choice: കർത്താവേ
  alternative: പ്രഭോ / യജമാനനേ
  rationale: ‘ദാവീദിന്റെ പുത്രാ’ എന്ന അഭിസംബോധനയോടൊപ്പം വരുന്ന ആദരവും മിശിഹാസൂചനയും ‘കർത്താവേ’ നന്നായി നിലനിർത്തുന്നു; അതേസമയം വാക്യം ആവശ്യപ്പെടുന്നതിലപ്പുറം ക്രിസ്തുശാസ്ത്രപരമായ വിശദീകരണം ചേർക്കുന്നില്ല.
- issue: υἱὸς Δαυίδ എന്നതിന്റെ മിശിഹാപരമായ ശക്തി
  choice: ദാവീദിന്റെ പുത്രാ
  alternative: ദാവീദിന്റെ സന്തതിയേ
  rationale: വംശപരമായ അർഥത്തിൽ മാത്രം ചുരുക്കാതെ, മത്തായിയിലെ അംഗീകൃത മിശിഹാപദവിയുടെ രൂപവും രാജകീയ പ്രതിധ്വനിയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ഇതാ’ എന്ന ശ്രദ്ധാകർഷക സൂചകവും ‘നിലവിളിച്ചു’ എന്ന ശക്തമായ ക്രിയയും മൂലപാഠത്തിന്റെ സജീവത നിലനിർത്തുന്നു. ഉദ്ധരണിയിലെ അഭിസംബോധന മലയാളത്തിലെ സ്വാഭാവിക ക്രമത്തിൽ ക്രമീകരിച്ചിരിക്കുന്നു.
