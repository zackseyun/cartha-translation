  register: ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം ഗൗരവമുള്ളതുമായ വാക്യഘടന. മൂലത്തിലെ περί സൃഷ്ടിക്കുന്ന ബന്ധപരമായ ചെറിയ അവ്യക്തത ‘-യെക്കുറിച്ച്’ എന്ന പ്രയോഗത്തിലൂടെ സംരക്ഷിച്ചു.
