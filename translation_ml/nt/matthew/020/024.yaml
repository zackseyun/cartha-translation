  text: And when the ten heard it, they became indignant about the two brothers.
translation:
  language: ml
  text: ഇതു കേട്ടപ്പോൾ, ആ പത്തുപേർ ആ രണ്ടു സഹോദരന്മാരെക്കുറിച്ച് രോഷാകുലരായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσαντες
  choice: ഇതു കേട്ടപ്പോൾ
  rationale: സന്ദർഭത്തിൽ യാക്കോബിന്റെയും യോഹന്നാന്റെയും അമ്മ നടത്തിയ അഭ്യർഥനയെയാണ് അവർ കേട്ടത്; മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ ‘ഇതു’ ചേർത്തു.
- source_word: οἱ δέκα
  choice: ആ പത്തുപേർ
  rationale: ശേഷിച്ച പത്തു ശിഷ്യന്മാരെ സൂചിപ്പിക്കുന്ന നിർദിഷ്ട പ്രയോഗം ലളിതവും വ്യക്തവുമായി നിലനിർത്തുന്നു.
- source_word: ἠγανάκτησαν
  choice: രോഷാകുലരായി
  rationale: ശക്തമായ അസന്തോഷവും നീരസവും പ്രകടിപ്പിക്കുന്ന ഗ്രീക്ക് ക്രിയയുടെ തീവ്രത സംരക്ഷിക്കുന്നു.
- source_word: περὶ τῶν δύο ἀδελφῶν
  choice: ആ രണ്ടു സഹോദരന്മാരെക്കുറിച്ച്
  rationale: περί എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘കുറിച്ച്/സംബന്ധിച്ച്’ നിലനിർത്തി; ‘അവരോട്’ എന്നു മാറ്റി വൈരത്തിന്റെ ദിശ അനാവശ്യമായി കൂടുതൽ നിർണ്ണയിക്കുന്നില്ല.
