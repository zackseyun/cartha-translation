id: MAT.20.9
reference: Matthew 20:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂καὶ ἐλθόντες⸃ οἱ περὶ τὴν ἑνδεκάτην ὥραν ἔλαβον ἀνὰ δηνάριον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/009.yaml
  text: And those who came about the eleventh hour received a denarius each[a].
translation:
  language: ml
  text: പതിനൊന്നാം മണിക്കൂറോടടുത്ത് വന്നവർക്ക് ഓരോരുത്തർക്കും ഒരു ദിനാർ വീതം ലഭിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ദിനാർ ഒരു സാധാരണ റോമൻ വെള്ളിനാണയമായിരുന്നു; ഒരു തൊഴിലാളിയുടെ ഒരു ദിവസത്തെ സാധാരണ കൂലിക്ക് ഏകദേശം തുല്യമായി ഇതിനെ പൊതുവേ കണക്കാക്കിയിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: καὶ
  choice: (പ്രത്യേകമായി വിവർത്തനം ചെയ്തിട്ടില്ല)
  rationale: മുമ്പത്തെ വിവരണത്തോടുള്ള ലളിതമായ ബന്ധം മലയാളത്തിലെ സ്വാഭാവിക വാക്യപ്രവാഹത്തിലൂടെ വ്യക്തമാകുന്നതിനാൽ ‘καί’ വേറിട്ടൊരു ബന്ധകമായി ചേർത്തില്ല.
- source_word: ἐλθόντες
  choice: വന്നവർ
  rationale: കർതൃവിശേഷണമായി നിൽക്കുന്ന ഭൂതകാല കൃദന്തരൂപത്തെ സ്വാഭാവികവും കൃത്യവുമായി അവതരിപ്പിക്കുന്നു; ‘ജോലിക്കു നിയമിക്കപ്പെട്ടവർ’ എന്ന സന്ദർഭസൂചന മൂലപാഠത്തിലേക്ക് ചേർക്കുന്നില്ല.
- source_word: οἱ περὶ τὴν ἑνδεκάτην ὥραν
  choice: പതിനൊന്നാം മണിക്കൂറോടടുത്ത് ... അവർ
  rationale: περὶ എന്നതിന്റെ ഏകദേശ കാലസൂചന ‘-ഓടടുത്ത്’ നിലനിർത്തുന്നു; ഇത് അന്നത്തെ പകൽമണിക്കൂർ കണക്കിലെ പതിനൊന്നാം മണിക്കൂറാണ്.
- source_word: ἔλαβον
  choice: വാങ്ങി
  rationale: കൂലി നൽകുന്ന സന്ദർഭത്തിൽ ‘ലഭിച്ചു’ എന്നതിനെക്കാൾ സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമാണ്; നൽകിയ പ്രതിഫലം കൈപ്പറ്റിയെന്ന അർഥം നൽകുന്നു.
- source_word: ἀνὰ
  choice: ഓരോരുത്തരും ഓരോ ... വീതം
  rationale: ഓരോ വ്യക്തിക്കും ഒന്ന് എന്ന വിതരണാർഥം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: δηνάριον
  choice: ദിനാർ
  rationale: ചരിത്രപരമായ നാണയനാമം പരിവർത്തനം ചെയ്യാതെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപത്തിൽ നിലനിർത്തുന്നു; അതിന്റെ ഏകദേശ മൂല്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പതിനൊന്നാം മണിക്കൂർ’ എന്ന ചരിത്രപരമായ സമയപ്രയോഗവും ‘ദിനാർ’ എന്ന നാണയനാമവും നിലനിർത്തി; ആവശ്യമായ സാംസ്കാരിക വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകി.
