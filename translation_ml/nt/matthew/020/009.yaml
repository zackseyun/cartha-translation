    text: ദിനാർ ഒരു സാധാരണ റോമൻ വെള്ളിനാണയമായിരുന്നു; ഒരു തൊഴിലാളിയുടെ ഒരു ദിവസത്തെ സാധാരണ കൂലിക്ക് ഏകദേശം തുല്യമായി ഇതിനെ പൊതുവേ കണക്കാക്കിയിരുന്നു.
    reason: cultural_note
