revisions:
- from: പതിനൊന്നാം മണിക്കൂറോടടുത്ത് വന്നവർ ഓരോരുത്തരും ഓരോ ദിനാർ വീതം വാങ്ങി.[a]
  to: പതിനൊന്നാം മണിക്കൂറോടടുത്ത് വന്നവർക്ക് ഓരോരുത്തർക്കും ഒരു ദിനാർ വീതം ലഭിച്ചു.[a]
  rationale: The revision preserves the Greek wording and its temporal and distributive nuances while making the payment statement more natural in modern standard Malayalam. The footnote retains the historical explanation with appropriately qualified wording.
