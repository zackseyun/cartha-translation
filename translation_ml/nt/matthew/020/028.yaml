reference: Matthew 20:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὥσπερ ὁ υἱὸς τοῦ ἀνθρώπου οὐκ ἦλθεν διακονηθῆναι ἀλλὰ διακονῆσαι καὶ δοῦναι τὴν ψυχὴν αὐτοῦ λύτρον ἀντὶ πολλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/028.yaml
  text: just as the Son of Man did not come to be served[a], but to serve, and to give his life as a ransom for many.
translation:
  language: ml
  text: മനുഷ്യപുത്രൻ ശുശ്രൂഷിക്കപ്പെടാനല്ല, ശുശ്രൂഷിക്കാനും അനേകർക്കുവേണ്ടി[a] തന്റെ ജീവൻ മോചനവിലയായി നൽകാനുമാണ് വന്നത് എന്നതുപോലെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, കൂടുതൽ വ്യക്തമായി: ‘അനേകർക്ക് പകരമായി തന്റെ ജീവൻ മോചനവിലയായി നൽകാനും.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ
  choice: എന്നതുപോലെ
  rationale: മുൻപുള്ള ഉപദേശത്തോടുള്ള താരതമ്യബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: സ്ഥിരപ്രയോഗമായ സ്വയംവിശേഷണം നിലനിർത്തുകയും ദാനിയേൽ ഗ്രന്ഥവുമായുള്ള അനുരണനം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: οὐκ ἦλθεν
  choice: വന്നത് ... അല്ല
  rationale: ഗ്രീക്കിലെ ലളിതമായ ഭൂതകാലവും നിഷേധവും മലയാളത്തിലെ ഊന്നൽഘടനയിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: διακονηθῆναι
  choice: ശുശ്രൂഷിക്കപ്പെടാൻ
  rationale: കർമണിപ്രയോഗം കൃത്യമായി നിലനിർത്തുകയും അടുത്ത ക്രിയയുമായുള്ള പദബന്ധം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀλλὰ διακονῆσαι
  choice: ശുശ്രൂഷിക്കാൻ
  rationale: διακονέω എന്ന ഒരേ ക്രിയയുടെ സജീവ-കർമണി വൈരുധ്യം മലയാളത്തിലും നിലനിർത്തുന്നു.
- source_word: καὶ δοῦναι
  choice: നൽകാനും
  rationale: മുൻപുള്ള infinitive-നോട് ഏകോപിതമായ ഉദ്ദേശ്യം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: തന്റെ ജീവൻ
  rationale: ഇവിടെ ψυχή മരണത്തിന് ഏല്പിക്കുന്ന ജീവനെ സൂചിപ്പിക്കുന്നു; ‘ആത്മാവ്’ എന്നത് അർത്ഥം അനാവശ്യമായി ചുരുക്കും.
- source_word: λύτρον
  choice: മോചനവില
  rationale: വിടുതൽ നേടുന്നതിനായി നൽകുന്ന വില എന്ന λύτρον-ന്റെ അർത്ഥം ലളിതവും വ്യക്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀντὶ πολλῶν
  choice: അനേകർക്കുവേണ്ടി
  rationale: പ്രധാനപാഠത്തിൽ സ്വാഭാവികമായ മലയാളം നൽകുന്നു; ἀντί-യിലെ പകരംവയ്ക്കൽ ഭാവം അടിക്കുറിപ്പിൽ കൂടുതൽ വ്യക്തമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: λύτρον ἀντὶ πολλῶν എന്ന പ്രയോഗത്തിലെ ἀντί-യുടെ ശക്തി
  choice: പ്രധാനപാഠത്തിൽ ‘അനേകർക്കുവേണ്ടി’
  alternative: ‘അനേകർക്ക് പകരമായി’
  rationale: പ്രധാനരൂപം സ്വാഭാവികവും പ്രതിനിധിത്വ/പകരംവയ്ക്കൽ അർത്ഥത്തെ നിഷേധിക്കാത്തതുമാണ്; എന്നാൽ കൈമാറ്റമോ പകരംവയ്ക്കലോ സൂചിപ്പിക്കുന്ന ἀντί-യുടെ കൂടുതൽ വ്യക്തമായ ഭാവം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘ശുശ്രൂഷിക്കപ്പെടുക/ശുശ്രൂഷിക്കുക’ എന്ന സമാന്തരരൂപം മൂലപാഠത്തിലെ വാചകവൈരുധ്യം സംരക്ഷിക്കുന്നു; അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വാക്യഭാഗത്തിനുശേഷം നൽകിയിരിക്കുന്നു.
