id: MAT.20.8
reference: Matthew 20:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὀψίας δὲ γενομένης λέγει ὁ κύριος τοῦ ἀμπελῶνος τῷ ἐπιτρόπῳ αὐτοῦ· Κάλεσον τοὺς ἐργάτας καὶ ἀπόδος ⸀αὐτοῖς τὸν μισθὸν ἀρξάμενος ἀπὸ τῶν ἐσχάτων ἕως τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/008.yaml
  text: When evening came, the master of the vineyard says to his steward, ‘Call the workers and pay them their wages, beginning with the last and ending with the first.’
translation:
  language: ml
  text: 'സന്ധ്യയായപ്പോൾ മുന്തിരിത്തോട്ടത്തിന്റെ ഉടമ തന്റെ കാര്യസ്ഥനോട് പറയുന്നു: ‘തൊഴിലാളികളെ വിളിച്ച്, ഒടുവിൽ വന്നവരിൽ തുടങ്ങി ആദ്യം വന്നവർവരെ അവരുടെ കൂലി കൊടുക്കുക.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  choice: മുന്തിരിത്തോട്ടത്തിന്റെ ഉടമ
  rationale: സന്ദർഭത്തിൽ κύριος എന്നത് തോട്ടത്തിന്റെ ഉടമയെയോ യജമാനനെയോ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘ഉടമ’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: τῷ ἐπιτρόπῳ αὐτοῦ
  choice: തന്റെ കാര്യസ്ഥനോട്
  rationale: ἐπίτροπος ഇവിടെ ഉടമയ്ക്കുവേണ്ടി തൊഴിലാളികളെയും പണമിടപാടിനെയും മേൽനോട്ടം വഹിക്കുന്ന കാര്യസ്ഥനാണ്.
- source_word: ἀπόδος αὐτοῖς τὸν μισθόν
  choice: അവരുടെ കൂലി കൊടുക്കുക
  rationale: ἀποδίδωμι അർഹമായതു നൽകുക എന്ന അർഥം വഹിക്കുന്നു; തൊഴിലാളികളുടെ പ്രതിഫലത്തിന് ‘കൂലി’യാണ് സാധാരണ മലയാളപ്രയോഗം.
- source_word: ἀπὸ τῶν ἐσχάτων ἕως τῶν πρώτων
  choice: ഒടുവിൽ വന്നവരിൽ തുടങ്ങി ആദ്യം വന്നവർവരെ
  rationale: വെറും ‘അവസാനത്തവർ/ആദ്യത്തവർ’ എന്നതിനെക്കാൾ, ഉപമയിലെ ജോലിക്കെത്തിയ ക്രമമാണ് ഉദ്ദേശ്യമെന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; തുടക്കം-അവസാനം എന്ന വിതരണക്രമം നിലനിർത്തുന്നു.
- source_word: λέγει
  choice: പറയുന്നു
  rationale: ഗ്രീക്ക് വർത്തമാനകാലത്തെ അതേപടി നിലനിർത്തി, ആഖ്യാനത്തിലെ ചരിത്രവർത്തമാനത്തിന്റെ സജീവത സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ഉടമയുടെ അഭിസംബോധനയിൽ κύριος എന്ന പദത്തിന്റെ വ്യാഖ്യാനം
  choice: ഉടമ
  alternative: യജമാനൻ / കർത്താവ്
  rationale: ഇവിടെ പദം ഉപമയിലെ മുന്തിരിത്തോട്ടത്തിന്റെ മാനുഷിക ഉടമയെ നേരിട്ട് സൂചിപ്പിക്കുന്നു. ‘കർത്താവ്’ എന്ന് നൽകുന്നത് ഈ വാക്യത്തിൽ അനാവശ്യമായ ദൈവശാസ്ത്രപരമായ പ്രത്യേകീകരണം സൃഷ്ടിക്കാം.
- issue: λέγει എന്ന ചരിത്രവർത്തമാനം
  choice: പറയുന്നു
  alternative: പറഞ്ഞു
  rationale: മൂലപാഠത്തിലെ വർത്തമാനരൂപവും ഇംഗ്ലീഷ് ഓഡിറ്റ് പാളിയിലെ ബോധപൂർവമായ ‘says’ എന്ന തിരഞ്ഞെടുപ്പും നിലനിർത്തുന്നു; ഇത് സംഭവത്തിന്റെ കാലക്രമത്തെക്കുറിച്ചുള്ള ദൈവശാസ്ത്രവാദമല്ല, ആഖ്യാനശൈലിയാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. നേരിട്ടുള്ള സംഭാഷണം സ്വാഭാവികമാക്കി; മൂലത്തിലെ ചരിത്രവർത്തമാനം നിലനിർത്തി. അടിക്കുറിപ്പുകൾ ആവശ്യമില്ല.
