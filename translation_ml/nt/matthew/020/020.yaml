id: MAT.20.20
reference: Matthew 20:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τότε προσῆλθεν αὐτῷ ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου μετὰ τῶν υἱῶν αὐτῆς προσκυνοῦσα καὶ αἰτοῦσά τι ⸀παρ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/020.yaml
  text: Then the mother of the sons of Zebedee came to him with her sons[a], bowing down and asking something from him.
translation:
  language: ml
  text: അപ്പോൾ സെബെദിയുടെ പുത്രന്മാരുടെ അമ്മ തന്റെ പുത്രന്മാരോടൊപ്പം യേശുവിന്റെ അടുക്കൽ വന്നു; അവൾ അവന്റെ മുമ്പിൽ കുമ്പിട്ട്[a] അവനോട് എന്തോ അപേക്ഷിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവനെ ആരാധിച്ച്.” ഗ്രീക്ക് ക്രിയയ്ക്ക് സന്ദർഭമനുസരിച്ച് ആദരപൂർവം കുമ്പിടുക, ആദരാഞ്ജലി അർപ്പിക്കുക, ആരാധിക്കുക എന്നീ അർത്ഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: അപ്പോൾ
  rationale: സംഭവക്രമത്തിലെ അടുത്ത സംഭവത്തെ സ്വാഭാവികമായി പരിചയപ്പെടുത്തുന്ന കാലസൂചകമാണ്.
- source_word: προσῆλθεν αὐτῷ
  choice: യേശുവിന്റെ അടുക്കൽ വന്നു
  rationale: προσέρχομαι ഒരാളുടെ അടുക്കലേക്കു വരുക/സമീപിക്കുക എന്ന ചലനം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സർവനാമത്തിന്റെ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ സന്ദർഭത്തിൽ വ്യക്തമായ ‘യേശു’ ഉപയോഗിച്ചു.
- source_word: ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου
  choice: സെബെദിയുടെ പുത്രന്മാരുടെ അമ്മ
  rationale: ഗ്രീക്കിലെ ബന്ധസൂചക ഘടന അടുത്തായി നിലനിർത്തുകയും സ്ത്രീയെ സെബെദിയുടെ പുത്രന്മാരുമായുള്ള ബന്ധത്തിലൂടെ തിരിച്ചറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: μετὰ τῶν υἱῶν αὐτῆς
  choice: തന്റെ പുത്രന്മാരോടൊപ്പം
  rationale: μετά + genitive സഹഗമനത്തെ സൂചിപ്പിക്കുന്നു; ‘തന്റെ’ എന്നത് കർത്താവായ അമ്മയിലേക്കുള്ള ബന്ധം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: προσκυνοῦσα
  choice: അവന്റെ മുമ്പിൽ കുമ്പിട്ട്
  rationale: ശാരീരികമായി വണങ്ങുക, ആദരാഞ്ജലി അർപ്പിക്കുക, ആരാധിക്കുക എന്നീ അർത്ഥവ്യാപ്തിയുള്ള പദമാണിത്. പ്രധാനവാചകത്തിൽ സാഹചര്യത്തിന് യോജിച്ച ശാരീരിക-ആദരസൂചന നിലനിർത്തുന്നു; ശക്തമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: καὶ αἰτοῦσά τι παρ’ αὐτοῦ
  choice: അവനോട് എന്തോ അപേക്ഷിച്ചു
  rationale: αἰτέω അപേക്ഷിക്കുക/ചോദിക്കുക എന്നും τι അനിശ്ചിതമായ ‘എന്തോ’ എന്നും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ അപേക്ഷാരൂപം ഉപയോഗിച്ചു.
theological_decisions:
- issue: യേശുവിനോടുള്ള προσκυνοῦσα എന്ന പ്രവൃത്തിയുടെ വിവർത്തനം
  choice: അവന്റെ മുമ്പിൽ കുമ്പിട്ട്
  alternative: അവനെ ആരാധിച്ച്
  rationale: προσκυνέω ആദരപൂർവം കുമ്പിടുന്നതുമുതൽ ആരാധിക്കുന്നതുവരെയുള്ള അർത്ഥം വഹിക്കാം. ഈ അപേക്ഷാസന്ദർഭത്തിൽ പ്രധാനവാചകം ശാരീരികവും ആദരസൂചകവുമായ അർത്ഥം നൽകുന്നു; യേശുവിനോടുള്ള ‘ആരാധന’ എന്ന ദൈവശാസ്ത്രപരമായി ശക്തമായ വായന തള്ളിക്കളയാതെ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘പുത്രന്മാർ’ എന്ന പദം ബൈബിൾ ഗദ്യത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു; നീണ്ട ഗ്രീക്ക് പങ്കാളിത്തഘടന മലയാളത്തിൽ വ്യക്തതയ്ക്കായി രണ്ട് സമന്വിത ക്രിയാഘടകങ്ങളാക്കി.
