revisions:
- from: 'എന്നാൽ യേശു അവരോടു മറുപടി പറഞ്ഞു: “നിങ്ങൾ ചോദിക്കുന്നത് എന്താണെന്നു നിങ്ങൾ അറിയുന്നില്ല. ഞാൻ കുടിക്കാൻ പോകുന്ന പാനപാത്രം[a] കുടിക്കാൻ നിങ്ങൾക്കു കഴിയുമോ?” അവർ അവനോടു പറഞ്ഞു: “ഞങ്ങൾക്കു കഴിയും.”'
  to: 'എന്നാൽ യേശു മറുപടിയായി പറഞ്ഞു: “നിങ്ങൾ ചോദിക്കുന്നത് എന്താണെന്ന് അറിയുന്നില്ല. ഞാൻ കുടിക്കാൻ പോകുന്ന പാനപാത്രം നിങ്ങൾക്കു കുടിക്കാനാകുമോ?” അവർ അവനോടു പറഞ്ഞു: “ഞങ്ങൾക്കു കഴിയും.”'
  rationale: പരിഷ്കാരം വാക്യത്തിന്റെ മലയാളൊഴുക്ക് മെച്ചപ്പെടുത്തുന്നു; ഗ്രീക്ക് പാഠത്തിലെ കഴിവുസൂചക ചോദ്യം, μέλλωയുടെ ഭാവിസൂചന, ‘പാനപാത്രം’ എന്ന തുറന്ന രൂപകം, മറുപടിയുടെ ഉറച്ച സ്വഭാവം എന്നിവ മാറ്റുന്നില്ല. അടിക്കുറിപ്പിന്റെ ഭാഷയും കൂടുതൽ കൃത്യമായ രൂപകപരമായ പദപ്രയോഗത്തിലേക്കു ക്രമീകരിച്ചു.
