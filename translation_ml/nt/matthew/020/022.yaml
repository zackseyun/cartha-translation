id: MAT.20.22
reference: Matthew 20:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Οὐκ οἴδατε τί αἰτεῖσθε· δύνασθε πιεῖν τὸ ποτήριον ὃ ἐγὼ μέλλω ⸀πίνειν; λέγουσιν αὐτῷ· Δυνάμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/022.yaml
  text: But Jesus answered and said[a], “You do not know what you are asking. Are you able to drink the cup that I am about to drink?” They said to him, “We are able.”
translation:
  language: ml
  text: 'എന്നാൽ യേശു മറുപടിയായി പറഞ്ഞു: “നിങ്ങൾ ചോദിക്കുന്നത് എന്താണെന്ന് അറിയുന്നില്ല. ഞാൻ കുടിക്കാൻ പോകുന്ന പാനപാത്രം നിങ്ങൾക്കു കുടിക്കാനാകുമോ?” അവർ അവനോടു പറഞ്ഞു: “ഞങ്ങൾക്കു കഴിയും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν
  choice: എന്നാൽ യേശു അവരോടു മറുപടി പറഞ്ഞു
  rationale: δέയുടെ നേരിയ വൈരുധ്യഭാവം ‘എന്നാൽ’കൊണ്ട് സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിലെ പങ്കുപദവും ക്രിയയും മലയാളത്തിലെ സ്വാഭാവികമായ ‘മറുപടി പറഞ്ഞു’ എന്ന പ്രയോഗത്തിൽ ഒത്തുചേരുന്നു; സന്ദർഭം വ്യക്തമാക്കാൻ ‘അവരോടു’ ചേർത്തിരിക്കുന്നു.
- source_word: Οὐκ οἴδατε τί αἰτεῖσθε
  choice: നിങ്ങൾ ചോദിക്കുന്നത് എന്താണെന്നു നിങ്ങൾ അറിയുന്നില്ല
  rationale: οἴδατε എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘അറിയുക’ നിലനിർത്തുന്നു; ‘മനസ്സിലാക്കുന്നില്ല’ എന്നു വ്യാഖ്യാനിച്ച് അർഥം ചുരുക്കുന്നില്ല. αἰτεῖσθε എന്ന വർത്തമാനപ്രയോഗം ‘ചോദിക്കുന്നത്’ എന്നു സ്വാഭാവികമായി നൽകിയിരിക്കുന്നു.
- source_word: δύνασθε
  choice: നിങ്ങൾക്കു കഴിയുമോ
  rationale: കഴിവിനെയും ശേഷിയെയും സൂചിപ്പിക്കുന്ന δύνασθεയുടെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: τὸ ποτήριον
  choice: പാനപാത്രം
  rationale: ഗ്രീക്കിലെ ‘പാനപാത്രം’ എന്ന രൂപകം മുഖ്യപാഠത്തിൽ അതേപടി നിലനിർത്തുന്നു; അതിനെ ‘കഷ്ടം’ എന്നാക്കി വ്യാഖ്യാനിച്ച് തീർക്കുന്നില്ല.
- source_word: ὃ ἐγὼ μέλλω πίνειν
  choice: ഞാൻ കുടിക്കാൻ പോകുന്ന
  rationale: μέλλωയുടെ വരാനിരിക്കുന്ന പ്രവർത്തനഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു. ‘ഇപ്പോൾത്തന്നെ കുടിക്കാനിരിക്കുന്ന’ എന്ന അതിശക്തമായ സമീപഭാവം നിർബന്ധിക്കുന്നില്ല.
- source_word: λέγουσιν αὐτῷ
  choice: അവർ അവനോടു പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനം മലയാള ആഖ്യാനശൈലിക്ക് യോജിച്ച ഭൂതകാലത്തിൽ നൽകുന്നു.
- source_word: Δυνάμεθα
  choice: ഞങ്ങൾക്കു കഴിയും
  rationale: മുമ്പത്തെ δύνασθεയുമായി പദസാമ്യം നിലനിർത്തി കഴിവിനെക്കുറിച്ചുള്ള അവരുടെ ഉറച്ച മറുപടി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ‘പാനപാത്രം’ എന്ന രൂപകത്തിന്റെ അർഥവ്യാപ്തി
  choice: മുഖ്യപാഠത്തിൽ ‘പാനപാത്രം’ എന്ന രൂപകം നിലനിർത്തുക
  alternative: ‘ഞാൻ അനുഭവിക്കാൻ പോകുന്ന കഷ്ടം’ അല്ലെങ്കിൽ ‘ഞാൻ കുടിക്കാൻ പോകുന്ന കഷ്ടതയുടെ പാനപാത്രം’
  rationale: രൂപകം യേശുവിന്റെ വരാനിരിക്കുന്ന കഷ്ടാനുഭവത്തിലേക്കു വിരൽചൂണ്ടുന്നുവെങ്കിലും, ഗ്രീക്ക് പാഠം അതിനെ നേരിട്ട് വിശദീകരിക്കുന്നില്ല. അതിനാൽ അതിന്റെ ബൈബിൾപരവും ദൈവശാസ്ത്രപരവുമായ അർഥവ്യാപ്തി മുഖ്യപാഠത്തിൽ തുറന്ന നിലയിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘പാനപാത്രം’ സാധാരണ ‘കപ്പ്’ എന്നതിനെക്കാൾ ബൈബിൾരൂപകത്തിന്റെ ഗൗരവവും വ്യാപ്തിയും നന്നായി വഹിക്കുന്നു. എല്ലാ സർവനാമങ്ങളും സന്ദർഭസൂചനകളും വായനാസൗകര്യത്തിനനുസരിച്ച് സ്വാഭാവികമായി നൽകിയിരിക്കുന്നു.
