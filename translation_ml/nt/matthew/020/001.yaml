id: MAT.20.1
reference: Matthew 20:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὁμοία γάρ ἐστιν ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ οἰκοδεσπότῃ ὅστις ἐξῆλθεν ἅμα πρωῒ μισθώσασθαι ἐργάτας εἰς τὸν ἀμπελῶνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/001.yaml
  text: For the kingdom of heaven is like a man, a master of a house, who went out early in the morning to hire workers for his vineyard.
translation:
  language: ml
  text: സ്വർഗരാജ്യം, തന്റെ മുന്തിരിത്തോട്ടത്തിലേക്കു തൊഴിലാളികളെ കൂലിക്കെടുക്കാൻ അതിരാവിലെ പുറപ്പെട്ട ഒരു വീട്ടുടമയെപ്പോലെയാണ്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: സ്വർഗരാജ്യം
  rationale: മത്തായിയുടെ സവിശേഷമായ പ്രയോഗത്തെ സ്വാഭാവികവും സ്ഥാപിതവുമായ മലയാളരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀνθρώπῳ οἰκοδεσπότῃ
  choice: ഒരു വീട്ടുടമയെ
  rationale: ἀνθρώπῳ എന്നത് ഉപമയിലെ മനുഷ്യവ്യക്തിയെ സൂചിപ്പിക്കുന്ന അനിശ്ചിത ഘടകമായി ‘ഒരു’യിൽ പ്രതിഫലിക്കുന്നു; οἰκοδεσπότης എന്ന പദത്തിന്റെ വീട്ടിനും സ്വത്തിനും മേൽ അധികാരമുള്ള ഉടമ എന്ന ആശയം ‘വീട്ടുടമ’ സ്വാഭാവികമായി നൽകുന്നു. ‘ഒരു മനുഷ്യനായ വീട്ടുടമ’ എന്ന ഭാരമുള്ള ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: ἅμα πρωῒ
  choice: അതിരാവിലെ
  rationale: വളരെ നേരത്തെ പ്രഭാതത്തിൽ എന്ന സമയസൂചന സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: μισθώσασθαι ἐργάτας
  choice: തൊഴിലാളികളെ കൂലിക്കെടുക്കാൻ
  rationale: പ്രതിഫലം നൽകി ജോലിക്കെടുക്കുക എന്ന μισθόομαιയുടെ അർഥം വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: ἀμπελῶνα
  choice: മുന്തിരിത്തോട്ടം
  rationale: vineyard എന്ന കൃഷിസ്ഥലത്തെ സാധാരണ ആധുനിക മലയാളത്തിൽ കൃത്യമായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഉപമയുടെ താരതമ്യഘടന
  choice: സ്വർഗരാജ്യം ... ഒരു വീട്ടുടമയെപ്പോലെയാണ്
  alternative: സ്വർഗരാജ്യം ... സംഭവിച്ചതുപോലെയാണ്
  rationale: ഗ്രീക്കിൽ രാജ്യം നേരിട്ട് ἀνθρώπῳ οἰκοδεσπότῃ എന്ന വ്യക്തിയോടാണ് താരതമ്യം ചെയ്യപ്പെടുന്നത്; തുടർന്നുള്ള കഥയിലേക്കു മാത്രം താരതമ്യം മാറ്റാതെ ആ വ്യാകരണഘടന നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘ഗൃഹനാഥൻ’ എന്ന കൂടുതൽ സാഹിത്യപരമായ പദത്തിനു പകരം സാധാരണ വായനക്കാർക്ക് ഉടൻ മനസ്സിലാകുന്ന ‘വീട്ടുടമ’ ഉപയോഗിച്ചു.
