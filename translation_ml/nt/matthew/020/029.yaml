    rationale: In ‘യെരീഹോയിൽനിന്ന് പുറപ്പെട്ടുപോകുമ്പോൾ,’ both ‘-യിൽനിന്ന്’ and the compound ‘പുറപ്പെട്ടുപോകുക’ express departure. Replacing it with ‘പുറപ്പെടുമ്പോൾ’ gives natural modern Malayalam without reducing source meaning.
