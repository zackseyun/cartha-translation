  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἐκπορευομένων αὐτῶν ἀπὸ Ἰεριχὼ ἠκολούθησεν αὐτῷ ὄχλος πολύς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/029.yaml
  text: And as they were going out from Jericho[a], a large crowd followed him.
translation:
  language: ml
  text: അവർ യെരീഹോയിൽനിന്ന് പുറപ്പെടുമ്പോൾ[a] ഒരു വലിയ ജനക്കൂട്ടം അവനെ അനുഗമിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘അവർ യെരീഹോ വിട്ടുപോകുമ്പോൾ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπορευομένων
  choice: പുറപ്പെട്ടുപോകുമ്പോൾ
  rationale: വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ കാലസൂചകവും പുരോഗമനാത്മകവുമായ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀπὸ Ἰεριχὼ
  choice: യെരീഹോയിൽനിന്ന്
  rationale: ἀπό സൂചിപ്പിക്കുന്ന ഒരു സ്ഥലത്തുനിന്നുള്ള നീക്കം സംക്ഷിപ്തമായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: ἠκολούθησεν
  choice: അനുഗമിച്ചു
  rationale: ἀκολουθέωയുടെ പിന്നാലെ ചെല്ലുക എന്ന അർഥം ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: αὐτῷ
  choice: അവനെ
  rationale: ദത്തിവ് ഏകവചന സർവനാമം സന്ദർഭത്തിൽ യേശുവിനെയാണ് സൂചിപ്പിക്കുന്നത്; ഗ്രീക്കിലെ ബഹുവചനത്തിൽനിന്ന് ഏകവചനത്തിലേക്കുള്ള മാറ്റം അതേപടി സൂക്ഷിക്കുന്നു.
- source_word: ὄχλος πολύς
  choice: ഒരു വലിയ ജനക്കൂട്ടം
  rationale: ജനങ്ങളുടെ വലിയ സംഖ്യയെ സൂചിപ്പിക്കുന്ന പദസമുച്ചയം വ്യക്തവും ആധുനികവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ബഹുവചന കൃദന്തവാക്യത്തിനു ശേഷമുള്ള αὐτῷ എന്ന ഏകവചന സർവനാമത്തിന്റെ സൂചിതൻ
  choice: ജനക്കൂട്ടം യേശുവിനെ (‘അവനെ’) അനുഗമിച്ചു.
  alternative: ജനക്കൂട്ടം ആ സംഘത്തെ (‘അവരെ’) അനുഗമിച്ചു.
  rationale: ഗ്രീക്ക് പാഠം ‘അവർ പുറപ്പെട്ടുപോകുമ്പോൾ’ എന്ന ബഹുവചനത്തിൽനിന്ന് ‘അവനെ അനുഗമിച്ചു’ എന്ന ഏകവചനത്തിലേക്ക് മാറുന്നു. സന്ദർഭത്തിൽ യേശുവാണ് സ്വാഭാവികമായ സൂചിതൻ; ഈ മാറ്റം മിനുക്കിമാറ്റാതെ പരിഭാഷയിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘പുറപ്പെട്ടുപോകുമ്പോൾ’ മൂലപാഠത്തിലെ പുരോഗമനസ്വഭാവം സൂക്ഷിക്കുന്നു; ‘അനുഗമിച്ചു’ വാക്യത്തിന്റെ തിരുവെഴുത്തുശൈലിയോട് യോജിച്ചിരിക്കുമ്പോഴും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകും.
