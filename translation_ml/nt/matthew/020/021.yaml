id: MAT.20.21
reference: Matthew 20:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῇ· Τί θέλεις; λέγει αὐτῷ· Εἰπὲ ἵνα καθίσωσιν οὗτοι οἱ δύο υἱοί μου εἷς ἐκ δεξιῶν ⸀σου καὶ εἷς ἐξ εὐωνύμων σου ἐν τῇ βασιλείᾳ σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/021.yaml
  text: And he said to her[a], “What do you want?” She said to him, “Command that these two sons of mine may sit, one at your right and one at your left[c][b], in your kingdom.”
translation:
  language: ml
  text: അവൻ അവളോടു, “നിനക്ക് എന്താണ് വേണ്ടത്?” എന്നു പറഞ്ഞു. അവൾ അവനോടു, “എന്റെ ഈ രണ്ടു പുത്രന്മാർ അങ്ങയുടെ രാജ്യത്തിൽ[b] ഒരുവൻ അങ്ങയുടെ വലത്തും മറ്റൊരുവൻ ഇടത്തും ഇരിക്കട്ടെ എന്നു പറയണമേ[a],” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പറയണമേ” എന്നത് സന്ദർഭത്തിൽ “കല്പിക്കണമേ” എന്നും, കൂടുതൽ വ്യാഖ്യാനാത്മകമായി “അനുവദിക്കണമേ” എന്നും മനസ്സിലാക്കാം; ഗ്രീക്കിൽ ഉപയോഗിച്ചിരിക്കുന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം “പറയുക” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: “രാജ്യം” എന്നതിന് “രാജവാഴ്ച” അഥവാ “രാജകീയ ഭരണം” എന്ന അർഥവും ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί θέλεις
  choice: നിനക്ക് എന്താണ് വേണ്ടത്?
  rationale: അവൾ ഉന്നയിക്കാൻ പോകുന്ന അപേക്ഷ എന്താണെന്ന് നേരിട്ട് ചോദിക്കുന്ന പ്രയോഗം; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മൂലത്തിന്റെ ലാളിത്യം നിലനിർത്തുന്നതുമാണ്.
- source_word: Εἰπὲ
  choice: പറയണമേ
  rationale: λέγω എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘പറയുക’ നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ ഇത് അധികാരപൂർവമായ പ്രഖ്യാപനമോ കല്പനയോ സൂചിപ്പിക്കാമെങ്കിലും, അതിനെ മുഖ്യവാചകത്തിൽ അധികമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: ἵνα καθίσωσιν
  choice: ഇരിക്കട്ടെ എന്നു
  rationale: അപേക്ഷയുടെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന ἵνα-വാക്യത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ അഭിലാഷ/അനുവാദരൂപത്തിൽ നൽകുന്നു.
- source_word: οὗτοι οἱ δύο υἱοί μου
  choice: എന്റെ ഈ രണ്ടു പുത്രന്മാർ
  rationale: οὗτοι എന്ന ചൂണ്ടുപദവും μου എന്ന വ്യക്തിപരമായ ബന്ധവും വ്യക്തമായി നിലനിർത്തുന്നു; ‘പുത്രന്മാർ’ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമാണ്.
- source_word: εἷς ἐκ δεξιῶν σου καὶ εἷς ἐξ εὐωνύμων σου
  choice: ഒരുവൻ അങ്ങയുടെ വലത്തും മറ്റൊരുവൻ ഇടത്തും
  rationale: രാജസന്നിധിയിലെ ബഹുമാനസ്ഥാനങ്ങളെ സൂചിപ്പിക്കുന്ന വലത്–ഇടത് സമാന്തരത സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἐν τῇ βασιλείᾳ σου
  choice: അങ്ങയുടെ രാജ്യത്തിൽ
  rationale: βασιλείαയുടെ രാജ്യം/രാജവാഴ്ച എന്ന അർഥവ്യാപ്തിയിൽ ‘രാജ്യം’ ഇവിടെ സ്വാഭാവികവും പരമ്പരാഗതവുമാണ്; രാജാധികാരത്തിന്റെ ആശയം ഒഴിവാക്കുന്നില്ല.
theological_decisions:
- issue: യേശുവിന്റെ രാജത്വവുമായി ബന്ധപ്പെട്ട ഇരിപ്പിടങ്ങളുടെ സ്വഭാവം
  choice: ‘അങ്ങയുടെ രാജ്യത്തിൽ’ എന്ന രാജകീയവും സ്ഥാനപരവുമായ ഭാഷ നിലനിർത്തി, ബഹുമാനസ്ഥാനങ്ങൾക്കായുള്ള അപേക്ഷയായി അവതരിപ്പിച്ചു.
  alternative: ഇത് ഭൂമിയിലെ മിശിഹാരാജ്യമെന്നോ അന്തിമമായ സ്വർഗീയരാജ്യമെന്നോ വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്ക് വാചകം രാജ്യത്തിന്റെ ഘട്ടമോ സ്വഭാവമോ നിർണ്ണയിക്കുന്നില്ല; അതിനാൽ പ്രത്യേക അന്ത്യകാലവ്യവസ്ഥ വിവർത്തനത്തിൽ ചേർക്കാതെ ഉള്ളിലെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. യേശുവിനെ അഭിസംബോധന ചെയ്യുമ്പോൾ ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു; അനാവശ്യമായ പുരാതന പദപ്രയോഗങ്ങളും പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ ഭാഷയും ഒഴിവാക്കി.
