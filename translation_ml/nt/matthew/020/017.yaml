- from: 'യേശു യെരൂശലേമിലേക്കു കയറിപ്പോകുമ്പോൾ, പന്ത്രണ്ട് ശിഷ്യന്മാരെ തനിച്ചു മാറ്റിനിർത്തി, വഴിയിൽവെച്ച് അവരോടു പറഞ്ഞു:'
  to: 'യേശു യെരൂശലേമിലേക്കു കയറിപ്പോകുമ്പോൾ, പന്ത്രണ്ട് ശിഷ്യന്മാരെ വേറിട്ടു കൂട്ടിക്കൊണ്ടുപോയി, വഴിയിൽവെച്ച് അവരോടു പറഞ്ഞു:'
  rationale: ‘വേറിട്ടു കൂട്ടിക്കൊണ്ടുപോയി’ preserves the combined force of παρέλαβεν (‘took along’) and κατ’ ἰδίαν (‘apart/by themselves’) without adding interpretation. The remaining wording faithfully and naturally reflects the Greek narrative.
