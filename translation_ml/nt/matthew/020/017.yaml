id: MAT.20.17
reference: Matthew 20:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂Καὶ ἀναβαίνων ὁ⸃ Ἰησοῦς εἰς Ἱεροσόλυμα παρέλαβεν τοὺς δώδεκα ⸀μαθητὰς κατ’ ἰδίαν, ⸂καὶ ἐν τῇ ὁδῷ⸃ εἶπεν αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/017.yaml
  text: And as Jesus was going up to Jerusalem, he took the twelve disciples aside by themselves, and on the way he said to them,
translation:
  language: ml
  text: 'യേശു യെരൂശലേമിലേക്കു കയറിപ്പോകുമ്പോൾ, പന്ത്രണ്ട് ശിഷ്യന്മാരെ വേറിട്ടു കൂട്ടിക്കൊണ്ടുപോയി, വഴിയിൽവെച്ച് അവരോടു പറഞ്ഞു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβαίνων
  choice: കയറിപ്പോകുമ്പോൾ
  rationale: വർത്തമാനകാല കൃദന്തരൂപം പ്രധാനക്രിയയോടൊപ്പം നടക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. യെരൂശലേമിലേക്കുള്ള ഭൗമികമായ കയറ്റവും അവിടേക്കു ‘കയറിപ്പോകുക’ എന്ന പതിവുപ്രയോഗവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: εἰς Ἱεροσόλυμα
  choice: യെരൂശലേമിലേക്ക്
  rationale: നഗരത്തിലേക്കുള്ള ദിശയെ εἰς സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘-ലേക്ക്’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: παρέλαβεν
  choice: മാറ്റിനിർത്തി
  rationale: παραλαμβάνω എന്നതിന്റെ ‘കൂടെ എടുക്കുക’ എന്ന ആശയം κατ’ ἰδίαν എന്ന പ്രയോഗവുമായി ചേർന്ന് ഇവിടെ മറ്റുള്ളവരിൽനിന്നു വേർതിരിച്ച് സ്വകാര്യമായി കൂട്ടിക്കൊണ്ടുപോകുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘തനിച്ചു മാറ്റിനിർത്തി’ ആ സംയുക്ത അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τοὺς δώδεκα μαθητὰς
  choice: പന്ത്രണ്ട് ശിഷ്യന്മാരെ
  rationale: മൂലപാഠത്തിലുള്ള സംഖ്യയും μαθητάς എന്ന നാമവും രണ്ടും പ്രതിനിധീകരിക്കുന്നു; ‘ശിഷ്യന്മാർ’ സുവിശേഷസന്ദർഭത്തിലെ സ്ഥാപിതവും ഗ്രാഹ്യവുമായ പദമാണ്.
- source_word: κατ’ ἰδίαν
  choice: തനിച്ചു
  rationale: മറ്റുള്ളവരിൽനിന്ന് വേർപെട്ട സ്വകാര്യസാഹചര്യത്തെ സൂചിപ്പിക്കുന്നു. ‘മാറ്റിനിർത്തി’ എന്ന ക്രിയയോടു ചേർന്ന് സ്ഥലപരവും ബന്ധപരവുമായ വേർതിരിവ് വ്യക്തമാക്കുന്നു.
- source_word: ἐν τῇ ὁδῷ
  choice: വഴിയിൽവെച്ച്
  rationale: യാത്രയ്ക്കിടയിലെ സാഹചര്യത്തെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: εἶπεν αὐτοῖς
  choice: അവരോടു പറഞ്ഞു
  rationale: സാധാരണ സംസാരക്രിയയായ λέγωയെ നേരിട്ട് പ്രതിനിധീകരിക്കുകയും തുടർന്നുവരുന്ന വാക്കുകൾക്കായി വാക്യം തുറന്നുവയ്ക്കുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. യാത്രയുടെ ദിശ, സ്വകാര്യമായി വേർതിരിക്കൽ, വഴിമധ്യേ സംസാരിക്കൽ എന്നീ ഘടകങ്ങൾ വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു.
