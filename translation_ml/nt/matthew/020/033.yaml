id: MAT.20.33
reference: Matthew 20:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγουσιν αὐτῷ· Κύριε, ἵνα ⸂ἀνοιγῶσιν οἱ ὀφθαλμοὶ ἡμῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/033.yaml
  text: They said to him[a], “Lord, let our eyes be opened.”
translation:
  language: ml
  text: 'അവർ അവനോട് പറഞ്ഞു: “കർത്താവേ[a], ഞങ്ങളുടെ കണ്ണുകൾ തുറന്നുകിട്ടണമേ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “അയ്യാ”.
    reason: κύριε എന്ന സംബോധനം ‘കർത്താവേ’ എന്നും സാധാരണ ആദരസൂചകമായി ‘അയ്യാ’ എന്നും മനസ്സിലാക്കാം.
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: അവർ അവനോട് പറഞ്ഞു
  rationale: ചരിത്രവിവരണത്തിലെ വർത്തമാനകാല ക്രിയ മലയാളത്തിൽ സ്വാഭാവികമായി ഭൂതകാലത്തിൽ നൽകി; αὐτῷ പരോക്ഷകർമമായി ‘അവനോട്’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: κύριος എന്ന സംബോധനയുടെ അധികാരവും ആദരവും നിലനിർത്തുന്നു; യേശുവിനോടുള്ള സംബോധനയിൽ ‘കർത്താവേ’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: ἵνα ἀνοιγῶσιν
  choice: തുറന്നുകിട്ടണമേ
  rationale: ἵναയും കർമണി പ്രയോഗത്തിലുള്ള aorist subjunctive ആയ ἀνοιγῶσινഉം ചേർന്ന് ഇവിടെ അഭ്യർഥനയുടെ ഉള്ളടക്കം പ്രകടിപ്പിക്കുന്നു. ‘തുറന്നുകിട്ടണമേ’ എന്ന രൂപം കണ്ണുകൾ പ്രവർത്തനത്തിന് വിധേയമാകുന്നതും അഭ്യർഥനാഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: οἱ ὀφθαλμοὶ ἡμῶν
  choice: ഞങ്ങളുടെ കണ്ണുകൾ
  rationale: നാമവും ജനിറ്റീവ് സർവനാമവും നേരായും സ്വാഭാവികമായും പരിഭാഷപ്പെടുത്തുന്നു.
theological_decisions:
- issue: യേശുവിനോടുള്ള κύριος എന്ന സംബോധന
  choice: കർത്താവേ
  alternative: അങ്ങുന്നേ
  rationale: ‘കർത്താവേ’ ആദരവും അധികാരസൂചനയും സംരക്ഷിക്കുന്നു; എന്നാൽ ഈ സംബോധനയ്ക്ക് ചില സന്ദർഭങ്ങളിൽ സാധാരണ ആദരസൂചകമായ അർഥവും ഉണ്ടാകാമെന്നതിനാൽ പകരം വായന അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി. ഗ്രീക്കിലെ കർമണിഭാവം വാക്കുപ്രതി അസ്വാഭാവികമായ ‘തുറക്കപ്പെടണമേ’ എന്നതിനു പകരം ‘തുറന്നുകിട്ടണമേ’ എന്ന പ്രയോഗത്തിലൂടെ സംരക്ഷിച്ചു.
