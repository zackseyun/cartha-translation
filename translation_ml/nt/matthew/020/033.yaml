    issue: The footnote’s alternative address is archaic.
    rationale: “അങ്ങുന്നേ” is not ordinary modern standard Malayalam. Replacing it with “അയ്യാ” preserves the lexical alternative ‘Sir’ while keeping the note accessible and idiomatic.
