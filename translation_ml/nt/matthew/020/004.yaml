id: MAT.20.4
reference: Matthew 20:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐκείνοις εἶπεν· Ὑπάγετε καὶ ὑμεῖς εἰς τὸν ἀμπελῶνα, καὶ ὃ ἐὰν ᾖ δίκαιον δώσω ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/004.yaml
  text: And he said to them[a], ‘You also go into the vineyard, and whatever is right I will give you.’
translation:
  language: ml
  text: 'അവരോടും അവൻ പറഞ്ഞു: “നിങ്ങളും മുന്തിരിത്തോട്ടത്തിലേക്കു പോകുവിൻ; ന്യായമായത്[a] ഞാൻ നിങ്ങൾക്കു തരും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ശരിയായത്” അല്ലെങ്കിൽ “നീതിയുക്തമായത്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκείνοις
  choice: അവരോടും
  rationale: മുമ്പ് പരാമർശിച്ച മറ്റു തൊഴിലാളികളെയാണ് ദത്തിവ് ബഹുവചന സർവനാമം സൂചിപ്പിക്കുന്നത്. καί-യുടെ തുടർച്ചാഭാവവും മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: εἶπεν
  choice: അയാൾ പറഞ്ഞു
  rationale: ഉപമയിലെ മനുഷ്യനെ സൂചിപ്പിക്കുന്ന സാധാരണ ആഖ്യാനപ്രയോഗം; നേരിട്ടുള്ള വാക്കുകളുടെ അവതരണം ലളിതമായി നിലനിർത്തുന്നു.
- source_word: Ὑπάγετε
  choice: പോകുവിൻ
  rationale: ബഹുവചന ആജ്ഞാരൂപത്തിന്റെ നേരിട്ടുള്ളതും മാന്യവുമായ ആധുനിക മലയാളരൂപം.
- source_word: καὶ ὑμεῖς
  choice: നിങ്ങളും
  rationale: മുമ്പ് അയക്കപ്പെട്ടവരോടൊപ്പം ഇവരെയും ഉൾപ്പെടുത്തുന്ന ഊന്നൽ വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: ἀμπελῶνα
  choice: മുന്തിരിത്തോട്ടം
  rationale: ἀμπελών എന്ന പദത്തിന്റെ സാധാരണവും വ്യക്തവുമായ മലയാള തത്തുല്യം.
- source_word: ὃ ἐὰν ᾖ δίκαιον
  choice: ന്യായമായത് എന്താണോ അത്
  rationale: അനിശ്ചിത സാപേക്ഷവാക്യത്തിന്റെ അർത്ഥവും δίκαιον എന്നതിലെ നീതി/ശരി എന്ന ധാർമ്മിക വ്യാപ്തിയും സംരക്ഷിക്കുന്നു.
- source_word: δώσω ὑμῖν
  choice: ഞാൻ നിങ്ങൾക്കു തരും
  rationale: δίδωμι എന്ന പൊതുവായ ‘കൊടുക്കുക’ എന്ന ക്രിയയെ നിലനിർത്തുന്നു; സന്ദർഭം കൂലിയെക്കുറിച്ചാണെങ്കിലും ‘കൂലി നൽകും’ എന്ന് മൂലത്തിൽ ഇല്ലാത്തത് ചേർക്കുന്നില്ല.
theological_decisions:
- issue: കൂലി നിശ്ചയിക്കുന്ന സന്ദർഭത്തിലെ δίκαιον എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ന്യായമായത്
  alternative: ശരിയായത്; നീതിയുക്തമായത്
  rationale: ‘ന്യായമായത്’ നീതിയുടെയും ശരിതനത്തിന്റെയും ധാർമ്മിക ഭാവം ഒരുമിച്ച് സൂക്ഷിക്കുന്നു; നിയമപരമായ അർത്ഥത്തിലേക്കോ വ്യക്തിപരമായ ‘fairness’ ധാരണയിലേക്കോ മാത്രം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഉപമാശൈലി. ആജ്ഞയ്ക്ക് ‘പോകുവിൻ’ ഉപയോഗിച്ചു; അത്യന്തം പുരാതനമായ പദക്രമവും അനാവശ്യമായ വ്യാഖ്യാനവികാസവും ഒഴിവാക്കി. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വാക്യത്തിന്റെ അവസാനം നൽകിയിരിക്കുന്നു.
