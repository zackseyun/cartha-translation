  terminology: “തുല്യരായി ... ആക്കി” is a faithful rendering of ἴσους ... ἐποίησας. “പൊള്ളുന്ന ചൂട്” adequately conveys the intensity of καύσων. The footnote gives a legitimate lexical/idiomatic alternative without imposing an interpretation.
