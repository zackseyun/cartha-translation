id: MAT.20.12
reference: Matthew 20:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀λέγοντες· Οὗτοι οἱ ἔσχατοι μίαν ὥραν ἐποίησαν, καὶ ἴσους ⸂αὐτοὺς ἡμῖν⸃ ἐποίησας τοῖς βαστάσασι τὸ βάρος τῆς ἡμέρας καὶ τὸν καύσωνα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/012.yaml
  text: saying[a], ‘These last worked one hour, and you made them equal to us who bore the burden of the day and the scorching heat.’
translation:
  language: ml
  text: 'അവർ പറഞ്ഞു: “ഒടുവിൽ വന്ന ഇവർ ഒരു മണിക്കൂർ മാത്രമാണ് ജോലി ചെയ്തത്. എന്നിട്ടും പകലിന്റെ ഭാരവും പൊള്ളുന്ന ചൂടും സഹിച്ച ഞങ്ങൾക്കു തുല്യരായി നീ അവരെ ആക്കിയല്ലോ[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞങ്ങളോടു തുല്യരെന്ന നിലയിൽ നീ അവരോടു പെരുമാറിയല്ലോ.”
    reason: ἴσους … ἐποίησας എന്ന പ്രയോഗം ‘തുല്യരാക്കി’ എന്നും ‘തുല്യരെന്ന നിലയിൽ പെരുമാറി’ എന്നും സ്വാഭാവികമായി മനസ്സിലാക്കാം.
lexical_decisions:
- source_word: λέγοντες
  choice: അവർ പറഞ്ഞു
  rationale: മുൻവാക്യത്തിലെ ക്രിയയോടു ചേർന്ന വർത്തമാന കൃദന്തരൂപമാണെങ്കിലും, മലയാളത്തിലെ സ്വാഭാവികമായ ആഖ്യാനപ്രവാഹത്തിനായി പൂർണക്രിയയായി നൽകി.
- source_word: Οὗτοι οἱ ἔσχατοι
  choice: ഒടുവിൽ വന്ന ഇവർ
  rationale: ഉപമയുടെ പശ്ചാത്തലത്തിൽ ἔσχατοι ഒടുവിൽ ജോലിക്കെത്തിയവരെ സൂചിപ്പിക്കുന്നു; അർത്ഥം വ്യക്തമാക്കിക്കൊണ്ട് താരതമ്യത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: μίαν ὥραν ἐποίησαν
  choice: ഒരു മണിക്കൂർ മാത്രമാണ് ജോലി ചെയ്തത്
  rationale: സമയദൈർഘ്യത്തോടൊപ്പമുള്ള ποιέω ഇവിടെ ജോലി ചെയ്യുക എന്ന അർത്ഥത്തിലാണ്; പരാതിയിലെ താരതമ്യഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘മാത്രമാണ്’ ഉപയോഗിച്ചു.
- source_word: ἴσους αὐτοὺς ἡμῖν ἐποίησας
  choice: ഞങ്ങൾക്കു തുല്യരായി നീ അവരെ ആക്കി
  rationale: ‘അവരെ ഞങ്ങൾക്കു തുല്യരാക്കി’ എന്ന ഗ്രീക്ക് ഘടനയും പരാതിയുടെ ശക്തിയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: τοῖς βαστάσασι
  choice: സഹിച്ച
  rationale: βαστάζω വഹിക്കുക, സഹിക്കുക എന്നീ അർത്ഥങ്ങൾ നൽകാം; കഠിനാധ്വാനത്തിന്റെ ഭാരവും ചൂടും ഒരുമിച്ച് ഉൾക്കൊള്ളാൻ ‘സഹിച്ച’ സ്വാഭാവികമാണ്.
- source_word: τὸ βάρος τῆς ἡμέρας
  choice: പകലിന്റെ ഭാരം
  rationale: ഒരു മുഴുവൻ ദിവസത്തെ അധ്വാനത്തെ ‘ഭാരം’ എന്ന മൂലരൂപകത്തോടെ തന്നെ നിലനിർത്തുന്നു.
- source_word: τὸν καύσωνα
  choice: പൊള്ളുന്ന ചൂട്
  rationale: καύσων സൂചിപ്പിക്കുന്ന കഠിനവും ദഹിപ്പിക്കുന്നതുമായ ചൂടിന്റെ തീവ്രത സാധാരണ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: നീതിയെയും തുല്യതയെയും കുറിച്ചുള്ള ഉപമയിലെ തൊഴിലാളികളുടെ പരാതി
  choice: തൊഴിലാളികളുടെ പ്രതിഷേധം വ്യാഖ്യാനാത്മക വിശദീകരണം ചേർക്കാതെ നേരിട്ട് അവതരിപ്പിച്ചു.
  alternative: അവരോടു അന്യായമായി പെരുമാറിയെന്ന ആശയം വാചകത്തിൽ തുറന്നുപറയുക.
  rationale: വാക്യം തൊഴിലാളികളുടെ പരാതിയാണ് രേഖപ്പെടുത്തുന്നത്; ദൈവനീതിയെക്കുറിച്ചുള്ള ഉപമയുടെ വിശാലമായ ദൈവശാസ്ത്രാർത്ഥം പരിഭാഷയിൽ മുൻകൂട്ടി തീർപ്പാക്കരുത്.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്കു വ്യക്തവുമായ മലയാളം. പരാതിയുടെ സംസാരഭാവം നിലനിർത്തിയെങ്കിലും പ്രാദേശികമോ മതവിഭാഗസവിശേഷമോ ആയ പ്രയോഗങ്ങൾ ഒഴിവാക്കി.
