base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/007.yaml
  text: They said to him[a], “Because no one has hired us.” He says to them, “You also go into the vineyard.”
translation:
  language: ml
  text: 'അവർ അവനോട് പറഞ്ഞു[a]: “ഞങ്ങളെ ആരും കൂലിക്കെടുത്തിട്ടില്ല.” അവൻ അവരോട് പറഞ്ഞു: “നിങ്ങളും മുന്തിരിത്തോട്ടത്തിലേക്കു പോകൂ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ‘അവർ പറയുന്നു’ എന്നും ‘അവൻ പറയുന്നു’ എന്നും ചരിത്രവർത്തമാനകാലമാണ്; മലയാളത്തിലെ സുഗമമായ കഥനശൈലിക്കായി രണ്ടും ഭൂതകാലത്തിൽ പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിൽ ചരിത്രവർത്തമാനകാലമാണെങ്കിലും, മലയാളത്തിലെ സ്വാഭാവികമായ കഥനശൈലിക്കായി ഭൂതകാലം ഉപയോഗിച്ചു.
- source_word: Ὅτι
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയില്ല
  rationale: ഇവിടെ ὅτι അവരുടെ മറുപടിയുടെ കാരണം അവതരിപ്പിക്കുന്നു; ‘ഞങ്ങളെ ആരും...’ എന്ന നേരിട്ടുള്ള മറുപടിയിൽ ആ കാരണബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാണ്.
- source_word: οὐδεὶς
  choice: ആരും ... ഇല്ല
  rationale: ഗ്രീക്കിലെ ‘ആരും ഇല്ല’ എന്ന സമ്പൂർണ നിഷേധം സ്വാഭാവികമായ മലയാള നിഷേധഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: ἐμισθώσατο
  choice: കൂലിക്കെടുത്തിട്ടില്ല
  rationale: ജോലിക്കായി കൂലിക്ക് ഏർപ്പെടുത്തുക എന്ന ക്രിയയുടെ അർഥം കൃത്യമായി നൽകുകയും ഇതുവരെയുള്ള അവസ്ഥ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: λέγει
  choice: പറഞ്ഞു
  rationale: ചരിത്രവർത്തമാനകാലത്തെ മലയാളത്തിലെ സുഗമമായ കഥനത്തിനായി ഭൂതകാലത്തിൽ അവതരിപ്പിച്ചു; ഗ്രീക്കിലെ രൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: Ὑπάγετε
  choice: പോകൂ
  rationale: ബഹുവചന അഭിസംബോധനയ്ക്കു യോജിച്ച, ആധുനികവും മാന്യവും സ്വാഭാവികവുമായ ആജ്ഞാരൂപം.
- source_word: καὶ ὑμεῖς
  choice: നിങ്ങളും
  rationale: മുമ്പ് അയക്കപ്പെട്ടവരോടൊപ്പം ഈ കൂട്ടരെയും ഉൾപ്പെടുത്തുന്ന ഊന്നൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἀμπελῶνα
  choice: മുന്തിരിത്തോട്ടം
  rationale: വീഞ്ഞിനുള്ള മുന്തിരിവള്ളി വളർത്തുന്ന തോട്ടത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരവും വ്യക്തവുമായ മലയാള പദം.
