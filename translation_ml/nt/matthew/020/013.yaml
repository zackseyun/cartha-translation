id: MAT.20.13
reference: Matthew 20:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς ⸂ἑνὶ αὐτῶν εἶπεν⸃· Ἑταῖρε, οὐκ ἀδικῶ σε· οὐχὶ δηναρίου συνεφώνησάς μοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/013.yaml
  text: But answering[a], he said to one of them, ‘Friend, I am not wronging you[b]. Did you not agree with me for a denarius?’
translation:
  language: ml
  text: 'എന്നാൽ അവൻ അവരിൽ ഒരാളോടു മറുപടിയായി പറഞ്ഞു: ‘സുഹൃത്തേ, ഞാൻ നിന്നോട് അന്യായം ചെയ്യുന്നില്ല. ഒരു ദിനാറിന് നീ എന്നോടു കരാർ ചെയ്തതല്ലേ?’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: മറുപടിയായി
  rationale: പ്രധാനക്രിയയായ ‘പറഞ്ഞു’വിനോടൊപ്പം വരുന്ന ഗ്രീക്ക് കൃത്‌രൂപത്തിന്റെ പ്രതികരണാർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἑνὶ αὐτῶν
  choice: അവരിൽ ഒരാളോട്
  rationale: ദത്തിവ് ഏകവചനവും വിഭാഗസൂചക ജനിറ്റീവും ചേർന്ന ഘടന; കൂട്ടത്തിൽപ്പെട്ട ഒരൊറ്റ വ്യക്തിയെയാണ് അഭിസംബോധന ചെയ്യുന്നത്.
- source_word: Ἑταῖρε
  choice: സുഹൃത്തേ
  rationale: മത്തായിയിൽ കാണുന്ന അഭിസംബോധനയ്ക്ക് സ്വാഭാവികമായ തുല്യം; സന്ദർഭത്തിലെ നിയന്ത്രിതമോ അകലം പാലിക്കുന്നതോ ആയ സ്വരം നിർബന്ധമായി മൃദൂകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: οὐκ ἀδικῶ σε
  choice: ഞാൻ നിന്നോട് അന്യായം ചെയ്യുന്നില്ല
  rationale: ἀδικέω എന്നതിന്റെ ‘ഒരാളോട് അന്യായമായി പെരുമാറുക’ എന്ന വ്യക്തിനിർദ്ദേശമുള്ള അർഥവും വർത്തമാനകാലഭാവവും വ്യക്തമായി നൽകുന്നു.
- source_word: οὐχὶ
  choice: അല്ലേ?
  rationale: അനുകൂല ഉത്തരം പ്രതീക്ഷിക്കുന്ന ഗ്രീക്ക് അലങ്കാരചോദ്യത്തിന്റെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ പകരുന്നു.
- source_word: δηναρίου
  choice: ഒരു ദിനാറിന്
  rationale: വില സൂചിപ്പിക്കുന്ന ജനിറ്റീവ്; ചരിത്രപരമായ നാണയനാമം പൊതുവായ ‘കൂലി’ എന്നാക്കി വ്യാഖ്യാനിക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: συνεφώνησάς μοι
  choice: നീ എന്നോടു സമ്മതിച്ചു
  rationale: മുമ്പ് ഇരുവരും എത്തിച്ചേർന്ന കൂലി-ധാരണയെ സൂചിപ്പിക്കുന്ന aorist ക്രിയയ്ക്ക് സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ മാന്യവും സംഭാഷണസഹജവുമായ ശൈലി. ഗ്രീക്ക് വാക്യഘടനയുടെ അർഥബന്ധങ്ങൾ സൂക്ഷിച്ചുകൊണ്ട്, മലയാളത്തിൽ അസ്വാഭാവികമായ കൃത്‌രൂപ അനുകരണം ഒഴിവാക്കി. ഇംഗ്ലീഷ് നൽകിയ അടിക്കുറിപ്പുകളിൽ marker/text പൊരുത്തക്കേട് ഉണ്ടായതിനാൽ, സാംസ്കാരിക കുറിപ്പ് ശരിയായ ‘ദിനാർ’ എന്ന പദത്തിൽ [a] ആയി ചേർത്തു; ‘ഞാൻ നിന്നോട് അന്യായം ചെയ്യുന്നില്ല’ എന്ന വിവർത്തനം തന്നെ ἀδικέωയുടെ അർഥം നേരിട്ട് നൽകുന്നതിനാൽ വേറൊരു പദവികൽപ്പക്കുറിപ്പ് ആവശ്യമില്ല.
