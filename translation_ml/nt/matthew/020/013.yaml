  to: 'എന്നാൽ അവൻ അവരിൽ ഒരാളോടു മറുപടിയായി പറഞ്ഞു: ‘സുഹൃത്തേ, ഞാൻ നിന്നോട് അന്യായം ചെയ്യുന്നില്ല. ഒരു ദിനാറിന് നീ എന്നോടു കരാർ ചെയ്തതല്ലേ?’'
