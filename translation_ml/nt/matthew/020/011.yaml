source:
  edition: SBLGNT
  text: λαβόντες δὲ ἐγόγγυζον κατὰ τοῦ οἰκοδεσπότου
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/011.yaml
  text: And after receiving it[a], they began grumbling against the master of the house,
translation:
  language: ml
  text: അത് കൈപ്പറ്റിയശേഷം[a] അവർ യജമാനനെതിരെ പിറുപിറുത്തുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അത് കൈപ്പറ്റി അവർ യജമാനനെതിരെ പിറുപിറുത്തുകൊണ്ടിരുന്നു.’
    reason: λαβόντες എന്ന aorist participle ‘കൈപ്പറ്റിയശേഷം’ എന്നും ‘കൈപ്പറ്റി’ എന്നും സ്വാഭാവികമായി നൽകാം; ἐγόγγυζον എന്ന imperfect-ന്റെ തുടരുന്ന ഭാവം നിലനിർത്തുന്നു.
lexical_decisions:
- source_word: λαβόντες
  choice: അത് വാങ്ങിയശേഷം
  rationale: λαμβάνω എന്ന ക്രിയയുടെ aorist participle മുഖ്യക്രിയയ്ക്കു മുമ്പ് നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ പ്രതിഫലമായി ലഭിച്ച ദിനാറിനെയാണ് ഉദ്ദേശിക്കുന്നത്; ഗ്രീക്കിൽ പരോക്ഷമായ കർമം മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി ‘അത്’ എന്നു ചേർത്തു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയില്ല
  rationale: ഇവിടെ δέ ശക്തമായ വൈരുധ്യമല്ല, കഥ മുന്നോട്ടുകൊണ്ടുപോകുന്ന മൃദുവായ ബന്ധകമാണ്. മലയാളത്തിൽ വാക്യക്രമം തന്നെ ആ ബന്ധം സ്വാഭാവികമായി നൽകുന്നതിനാൽ വേറൊരു പദം ചേർത്തില്ല.
- source_word: ἐγόγγυζον
  choice: പിറുപിറുക്കാൻ തുടങ്ങി
  rationale: Imperfect രൂപം തുടർന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയെയോ അതിന്റെ ആരംഭത്തെയോ സൂചിപ്പിക്കാം. പണം വാങ്ങിയതിനു പിന്നാലെയുള്ള ആരംഭം ‘തുടങ്ങി’ വ്യക്തമാക്കുന്നു; γογγύζωയിലെ അടക്കിയ അസന്തുഷ്ടസംസാരത്തിന്റെ ഭാവം ‘പിറുപിറുക്കുക’ നിലനിർത്തുന്നു.
- source_word: κατὰ
  choice: എതിരെ
  rationale: Genitive-നോടുകൂടിയ κατά ഇവിടെ ഒരാളോടുള്ള എതിർപ്പ് സൂചിപ്പിക്കുന്നു; ‘എതിരെ’ അതിനെ നേരായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: τοῦ οἰκοδεσπότου
  choice: വീട്ടുടമസ്ഥനെ
  rationale: οἰκοδεσπότης ഒരു വീടിന്റെയോ കുടുംബസ്വത്തിന്റെയോ അധിപനെ സൂചിപ്പിക്കുന്നു. ഉപമയുടെ സാഹചര്യത്തിൽ ‘ഭൂവുടമ’ യോജിക്കാമെങ്കിലും, സംയുക്തപദത്തിന്റെ അടിസ്ഥാന അർത്ഥം കാത്തുസൂക്ഷിക്കുന്ന സ്വാഭാവിക ആധുനിക മലയാളമാണ് ‘വീട്ടുടമസ്ഥൻ’.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മാന്യവുമായ മലയാളം. ‘പിറുപിറുക്കുക’ അസന്തുഷ്ടമായ അടക്കിയ പരാതിയുടെ ഭാവം നിലനിർത്തുന്നു; ‘വീട്ടുടമസ്ഥൻ’ മൂലപദത്തിന്റെ രൂപകൽപ്പനയോട് അടുത്തുനിൽക്കുന്നു.
