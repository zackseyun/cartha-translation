id: MAT.20.27
reference: Matthew 20:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἂν θέλῃ ἐν ὑμῖν εἶναι πρῶτος ⸀ἔσται ὑμῶν δοῦλος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/027.yaml
  text: And whoever wants to be first among you will be your servant[a].
translation:
  language: ml
  text: നിങ്ങളിൽ ഒന്നാമനാകാൻ ആഗ്രഹിക്കുന്നവൻ നിങ്ങളുടെ അടിമയായിരിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദാസൻ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ δοῦλος (ദൂലോസ്) എന്ന പദം മുൻവാക്യത്തിലെ ‘സേവകൻ’ എന്ന പദത്തേക്കാൾ ശക്തമാണ്; സാധാരണയായി അത് അടിമയെയോ ബന്ധിതസേവകനെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἂν θέλῃ
  choice: ആഗ്രഹിക്കുന്നവൻ
  rationale: അനിശ്ചിതബന്ധസർവനാമവും ἄν ചേർന്ന വിധിലിംഗക്രിയയും പൊതുവായ ‘ആരെങ്കിലും/ആരാണോ’ എന്ന ആശയം നൽകുന്നു. മലയാളത്തിൽ ‘ആഗ്രഹിക്കുന്നവൻ’ അത് സ്വാഭാവികമായും സംക്ഷിപ്തമായും അറിയിക്കുന്നു.
- source_word: ἐν ὑμῖν
  choice: നിങ്ങളിൽ
  rationale: സമൂഹത്തിനുള്ളിലെ സ്ഥാനക്രമമാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്; ‘നിങ്ങളിൽ’ എന്ന പ്രയോഗം അതിനെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: εἶναι πρῶτος
  choice: ഒന്നാമനാകാൻ
  rationale: ഏറ്റവും ഉയർന്ന സ്ഥാനത്തായിരിക്കാനുള്ള മോഹമാണ് πρῶτος സൂചിപ്പിക്കുന്നത്. ‘ഒന്നാമനാകാൻ’ നേരിട്ടും സാധാരണ വായനക്കാർക്ക് വ്യക്തമായും അത് പകരുന്നു.
- source_word: ἔσται
  choice: ആയിരിക്കും
  rationale: ഭാവികാലരൂപം നേരിട്ട് നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ ഇതിന് മാനദണ്ഡപരമായ ആഹ്വാനത്തിന്റെ ശക്തിയുണ്ടെങ്കിലും ‘വേണം’ എന്നു മാറ്റി മൂലത്തിലെ ഭാവികാലത്തെ മറച്ചിട്ടില്ല.
- source_word: ὑμῶν
  choice: നിങ്ങളുടെ
  rationale: മറ്റുള്ളവരോടുള്ള ബന്ധവും അവർക്കുവേണ്ടിയുള്ള കീഴ്പ്പെട്ട സേവനവും സൂചിപ്പിക്കുന്ന ജനിറ്റീവ് സ്വാഭാവികമായ ഉടമസ്ഥരൂപത്തിൽ പകരുന്നു.
- source_word: δοῦλος
  choice: അടിമ
  rationale: δοῦλος ബന്ധിതനിലയിലുള്ള അടിമയെ സൂചിപ്പിക്കുന്ന ശക്തമായ പദമാണ്. മുൻവാക്യത്തിലെ διάκονος എന്ന സേവകപദത്തേക്കാൾ ശക്തമായ യേശുവിന്റെ ഭാഷാപരമായ തീവ്രത ‘അടിമ’ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ശിഷ്യത്വത്തെക്കുറിച്ചുള്ള വചനത്തിൽ δοῦλος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: അടിമ
  alternative: ദാസൻ / സേവകൻ
  rationale: ഈ വചനം സാമൂഹികമായ ഒന്നാംസ്ഥാനമോഹത്തെ സമ്പൂർണമായ സ്വയംതാഴ്ത്തലുമായി വിരുദ്ധമാക്കുന്നു. മുൻവാക്യത്തിൽ വേറൊരു സേവകപദം ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ ഇവിടെ ‘സേവകൻ’ എന്നു പറഞ്ഞാൽ ഉദ്ദേശിച്ച തീവ്രത മങ്ങും. ‘അടിമ’ ഗ്രീക്ക് പദത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; അതേസമയം അടിമത്തത്തെ അംഗീകരിക്കുന്ന പ്രസ്താവനയായി അല്ല, ശിഷ്യത്വത്തിലെ സ്ഥാനമറിച്ചിടലായി വായിക്കേണ്ട സന്ദർഭവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടന സ്വീകരിച്ചു. ‘അടിമ’ എന്ന ശക്തമായ പദം മൂലത്തിലെ പദവ്യത്യാസവും വാക്യത്തിന്റെ ഞെട്ടിപ്പിക്കുന്ന തീവ്രതയും നിലനിർത്താൻ ഉദ്ദേശപൂർവം ഉപയോഗിച്ചു.
