id: MAT.20.2
reference: Matthew 20:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂συμφωνήσας δὲ⸃ μετὰ τῶν ἐργατῶν ἐκ δηναρίου τὴν ἡμέραν ἀπέστειλεν αὐτοὺς εἰς τὸν ἀμπελῶνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/002.yaml
  text: After agreeing with the workers for one denarius for the day[a], he sent them into his vineyard.
translation:
  language: ml
  text: ദിവസത്തെ കൂലിയായി ഒരു ദിനാറിയം[a] നൽകാമെന്ന് തൊഴിലാളികളോടു സമ്മതിച്ചശേഷം, അദ്ദേഹം അവരെ തന്റെ മുന്തിരിത്തോട്ടത്തിലേക്ക് അയച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഒരു ദിനാറിയം ഒരു തൊഴിലാളിയുടെ സാധാരണ ദിവസക്കൂലിയായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: συμφωνήσας
  choice: ധാരണയായശേഷം
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പ് കൂലി സംബന്ധിച്ച് ധാരണയിലെത്തിയതിനെ സൂചിപ്പിക്കുന്ന aorist participle സ്വാഭാവിക മലയാളത്തിൽ കാലക്രമം നിലനിർത്തി അവതരിപ്പിക്കുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇവിടെ ഇത് നേരിയ ആഖ്യാനബന്ധകമാണ്; മലയാളത്തിലെ വാക്യക്രമം തന്നെ ആ ബന്ധം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐργατῶν
  choice: തൊഴിലാളികളുമായി
  rationale: മുന്തിരിത്തോട്ടത്തിൽ കൂലിക്കു ജോലിചെയ്യുന്നവരെ സൂചിപ്പിക്കുന്ന വ്യക്തവും ആധുനികവുമായ പ്രയോഗം.
- source_word: ἐκ δηναρίου
  choice: ഒരു ദിനാറിയോസ് കൂലി നൽകാമെന്ന്
  rationale: സമ്മതിച്ച കൂലിത്തുക വ്യക്തമാക്കുകയും പുരാതന നാണയത്തിന്റെ പേര് ആധുനിക മൂല്യമായി മാറ്റാതെ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: τὴν ἡμέραν
  choice: ഒരു ദിവസത്തേക്ക്
  rationale: കൂലി ബാധകമായ സമയപരിധി സൂചിപ്പിക്കുന്ന accusative പ്രയോഗം; 'മുഴുവൻ ദിവസം' എന്ന അധികവിവരം ചേർക്കുന്നില്ല.
- source_word: ἀπέστειλεν
  choice: അയച്ചു
  rationale: സാധാരണ ആഖ്യാനസന്ദർഭത്തിന് യോജിച്ച നേരായ പരിഭാഷ.
- source_word: ἀμπελῶνα
  choice: മുന്തിരിത്തോട്ടത്തിലേക്ക്
  rationale: മലയാളത്തിൽ vineyard എന്ന ആശയം സ്വാഭാവികമായും കൃത്യമായും നൽകുന്നു.
- source_word: αὐτοῦ
  choice: തന്റെ
  rationale: കർത്താവായ ഭൂവുടമയുടെ സ്വന്തം മുന്തിരിത്തോട്ടമാണെന്ന് മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
