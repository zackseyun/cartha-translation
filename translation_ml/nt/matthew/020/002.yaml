translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. പുരാതന നാണയനാമം വിശദീകരണ അടിക്കുറിപ്പോടുകൂടെ നിലനിർത്തിയിരിക്കുന്നു.
