translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഗ്രീക്ക് സമയപ്രയോഗം സുതാര്യതയ്ക്കായി പ്രധാനപാഠത്തിൽ നിലനിർത്തി; വായനാസഹായത്തിനായി ആധുനിക സമയസമാനം അടിക്കുറിപ്പിൽ നൽകി. καὶ എന്നത് ആഖ്യാനതുടർച്ച സൂചിപ്പിക്കുന്നതിനാൽ ‘വീണ്ടും’ എന്നു സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
