  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐξελθὼν περὶ τρίτην ὥραν εἶδεν ἄλλους ἑστῶτας ἐν τῇ ἀγορᾷ ἀργούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/003.yaml
  text: And going out about the third hour[b][a], he saw others standing idle in the marketplace.
translation:
  language: ml
  text: അവൻ ഏകദേശം മൂന്നാം മണിക്കൂറിൽ[a] പുറത്തേക്കു പോയി, ചന്തസ്ഥലത്ത് ജോലിയില്ലാതെ[b] നിൽക്കുന്ന മറ്റുള്ളവരെ കണ്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘രാവിലെ ഏകദേശം ഒൻപതു മണിക്ക്.’ ‘മൂന്നാം മണിക്കൂർ’ എന്നത് സൂര്യോദയം മുതൽ പകൽസമയം കണക്കാക്കുന്ന യഹൂദരീതിയെ പ്രതിഫലിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: b
    text: അഥവാ, ‘വേലയില്ലാത്തവർ.’ ഗ്രീക്ക് പദം അവർ അപ്പോൾ പണിയിലേർപ്പെട്ടിരുന്നില്ല, അഥവാ നിഷ്ക്രിയരായിരുന്നു, എന്നു സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: പുറത്തേക്കു പോയപ്പോൾ
  rationale: അയോറിസ്റ്റ് കൃതന്തത്തിന്റെ മുൻകാല/അനുക്രമ പ്രവർത്തനം സ്വാഭാവികമായ മലയാള ഉപവാക്യത്തിലൂടെ പ്രകടിപ്പിക്കുന്നു.
- source_word: περὶ τρίτην ὥραν
  choice: ഏകദേശം മൂന്നാം മണിക്കൂറിൽ
  rationale: യഹൂദരുടെ പകൽസമയ കണക്കിലെ മൂലപ്രയോഗം പ്രധാനപാഠത്തിൽ നിലനിർത്തുകയും ‘ഏകദേശം’ കൊണ്ട് περὶ എന്നതിന്റെ അർഥം നൽകുകയും ചെയ്യുന്നു.
- source_word: εἶδεν
  choice: കണ്ടു
  rationale: ὁράω എന്ന ക്രിയയുടെ ലളിതമായ ആഖ്യാനരൂപം നേരിട്ട് നൽകുന്നു.
- source_word: ἄλλους
  choice: മറ്റുള്ളവരെ
  rationale: നാമമായി പ്രവർത്തിക്കുന്ന വിശേഷണത്തെ ലിംഗം അനാവശ്യമായി ചേർക്കാതെ വിവർത്തനം ചെയ്യുന്നു.
- source_word: ἑστῶτας
  choice: നിൽക്കുന്ന
  rationale: ἵστημι എന്നതിന്റെ സ്ഥിതിസൂചകമായ പൂർണകൃതന്തബലം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀγορᾷ
  choice: ചന്തസ്ഥലത്ത്
  rationale: വ്യാപാരത്തിനും കൂലിപ്പണിക്കാർ കൂടിനിൽക്കുന്നതിനും ഉപയോഗിച്ചിരുന്ന പൊതുസ്ഥലത്തെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἀργούς
  choice: ജോലിയില്ലാതെ
  rationale: സന്ദർഭത്തിൽ അവർ അപ്പോൾ പണിയിലേർപ്പെട്ടിരുന്നില്ല എന്ന അർഥം നൽകുന്നു; ‘തൊഴിൽരഹിതർ’ എന്ന ആധുനിക സാമ്പത്തിക വിഭാഗീകരണം ഒഴിവാക്കുന്നു.
