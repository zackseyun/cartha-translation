id: MAT.20.18
reference: Matthew 20:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἰδοὺ ἀναβαίνομεν εἰς Ἱεροσόλυμα, καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδοθήσεται τοῖς ἀρχιερεῦσιν καὶ γραμματεῦσιν, καὶ κατακρινοῦσιν αὐτὸν θανάτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/018.yaml
  text: Look[a], we are going up to Jerusalem, and the Son of Man will be handed over to the chief priests and scribes, and they will condemn him to death[c][b],
translation:
  language: ml
  text: “ഇതാ, നാം യെരൂശലേമിലേക്കു കയറിപ്പോകുന്നു. മനുഷ്യപുത്രൻ[a] മുഖ്യപുരോഹിതന്മാർക്കും ശാസ്ത്രിമാർക്കും ഏൽപ്പിക്കപ്പെടും[b]; അവർ അവനെ മരണത്തിനു വിധിക്കും.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “മനുഷ്യപുത്രൻ” എന്നത് യേശു സ്വയം സൂചിപ്പിക്കാൻ പതിവായി ഉപയോഗിച്ച വിശേഷണമാണ്; ഇത് ദാനീയേൽ 7:13–14-നെ പ്രതിധ്വനിപ്പിക്കുന്നതാകാം.
    reason: cross_reference
  - marker: b
    text: അഥവാ “കൈമാറപ്പെടും”; ചില പ്രത്യേക സന്ദർഭങ്ങളിൽ ഈ ക്രിയയ്ക്ക് “ഒറ്റിക്കൊടുക്കപ്പെടും” എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗ്രീക്ക് വ്യവഹാരചിഹ്നത്തിന്റെ ശക്തി സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀναβαίνομεν
  choice: നാം ... കയറിപ്പോകുന്നു
  rationale: വർത്തമാനകാലത്തിലുള്ള യാത്രയെ സൂചിപ്പിക്കുകയും യെരൂശലേമിലേക്കുള്ള ഭൂമിശാസ്ത്രപരവും പരമ്പരാഗതവുമായ കയറ്റത്തിന്റെ അർഥം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: Ἱεροσόλυμα
  choice: യെരൂശലേം
  rationale: സ്ഥലനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: സുവിശേഷങ്ങളിൽ യേശു സ്വയം ഉപയോഗിക്കുന്ന സവിശേഷ നാമവിശേഷണത്തിന്റെ സ്ഥാപിതമായ മലയാളരൂപം; ദാനീയേൽ 7-ലെ സാധ്യതയുള്ള പ്രതിധ്വനിയും സംരക്ഷിക്കുന്നു.
- source_word: παραδοθήσεται
  choice: ഏല്പിക്കപ്പെടും
  rationale: മറ്റുള്ളവരുടെ അധികാരത്തിലേക്കു കൈമാറപ്പെടുക എന്ന വിശാലമായ കർമ്മണിപ്രയോഗം നിലനിർത്തുന്നു; ഇവിടെത്തന്നെ അതിനെ ‘വഞ്ചിക്കപ്പെടും’ എന്നു ചുരുക്കുന്നില്ല.
- source_word: τοῖς ἀρχιερεῦσιν
  choice: മുഖ്യപുരോഹിതന്മാർക്ക്
  rationale: ഒരൊറ്റ മഹാപുരോഹിതനെയല്ല, പ്രമുഖ പുരോഹിതാധികാരികളെയാണ് ബഹുവചനം സൂചിപ്പിക്കുന്നത്.
- source_word: γραμματεῦσιν
  choice: ശാസ്ത്രിമാർക്ക്
  rationale: യഹൂദ തിരുവെഴുത്തിലും ന്യായപ്രമാണത്തിലും പ്രാവീണ്യമുള്ള ഔദ്യോഗിക വിഭാഗത്തിനുള്ള നേരിട്ടുള്ളതും പരിചിതവുമായ മലയാളപദം.
- source_word: κατακρινοῦσιν αὐτὸν θανάτῳ
  choice: അവർ അവനെ മരണത്തിനു വിധിക്കും
  rationale: പ്രതികൂലമായ ന്യായവിധിയും അതിന്റെ ശിക്ഷയായ മരണവും സ്വാഭാവികമായ മലയാള നിയമപ്രയോഗത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου എന്ന ക്രിസ്തുശാസ്ത്രപരമായ നാമത്തിന്റെ വിവർത്തനം
  choice: മനുഷ്യപുത്രൻ
  alternative: മനുഷ്യനായവൻ
  rationale: യേശുവിന്റെ സവിശേഷ സ്വയംവിശേഷണവും ദാനീയേൽ 7:13–14-ലേക്കുള്ള സാധ്യതയുള്ള സൂചനയും ചുരുക്കാതെ നിലനിർത്തുന്നു.
- issue: παραδοθήσεται എന്ന ക്രിയയുടെ അർഥവ്യാപ്തി
  choice: ഏല്പിക്കപ്പെടും
  alternative: വഞ്ചിച്ചുകൊടുക്കപ്പെടും
  rationale: ഗ്രീക്ക് ക്രിയ ഇവിടെ പറയുന്ന ശത്രുക്കളുടെ അധികാരത്തിലേക്കുള്ള കൈമാറ്റം സംരക്ഷിക്കുന്നു; വഞ്ചനയുടെ പ്രത്യേക പ്രവർത്തകനെയോ രീതിയെയോ ഈ വാക്യത്തിൽ അനാവശ്യമായി ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഇതാ’ ശ്രദ്ധക്ഷണത്തിന്റെ ഭാവം സംരക്ഷിക്കുന്നു; ‘കയറിപ്പോകുന്നു’ യെരൂശലേമിലേക്കുള്ള കയറ്റത്തിന്റെ ആശയം നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ നൽകിയിരിക്കുന്നു.
