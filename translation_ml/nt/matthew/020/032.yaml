id: MAT.20.32
reference: Matthew 20:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ στὰς ὁ Ἰησοῦς ἐφώνησεν αὐτοὺς καὶ εἶπεν· Τί θέλετε ποιήσω ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/032.yaml
  text: And Jesus stopped[a], called them, and said, “What do you want me to do for you?”
translation:
  language: ml
  text: യേശു നിന്നു; അവരെ വിളിച്ച്, “ഞാൻ നിങ്ങൾക്കായി എന്തു ചെയ്യണമെന്നാണ് നിങ്ങൾ ആഗ്രഹിക്കുന്നത്?” എന്നു ചോദിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στὰς
  choice: നിന്നിട്ട്
  rationale: ἵστημι എന്ന ക്രിയയുടെ ഈ ഭൂതകാല കൃദന്തരൂപം, യേശു മുന്നോട്ടുള്ള നീക്കം നിർത്തിയശേഷം അവരെ വിളിച്ചതിനെ സൂചിപ്പിക്കുന്നു. ‘നിന്നിട്ട്’ മലയാളത്തിൽ ഈ തുടർച്ച സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἐφώνησεν αὐτοὺς
  choice: അവരെ വിളിച്ചു
  rationale: φωνέω ഇവിടെ സമീപത്തുള്ള അന്ധന്മാരെ വിളിച്ച് അഭിസംബോധന ചെയ്യുക എന്ന അർഥത്തിലാണ്; αὐτούς അവരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: καὶ εἶπεν
  choice: ചോദിച്ചു
  rationale: തുടർന്നുള്ള വാക്കുകൾ നേരിട്ടുള്ള ചോദ്യമായതിനാൽ, അക്ഷരാർഥത്തിലുള്ള ‘പറഞ്ഞു’ എന്നതിനു പകരം ‘ചോദിച്ചു’ എന്നത് സംഭവത്തിന്റെ ആശയം കൃത്യവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: Τί θέλετε
  choice: എന്തു ചെയ്യണമെന്നാണ് നിങ്ങൾ ആഗ്രഹിക്കുന്നത്
  rationale: θέλωയുടെ ഇച്ഛയെയോ ആഗ്രഹത്തെയോ സൂചിപ്പിക്കുന്ന അർഥം നിലനിർത്തുന്നു; ചോദ്യം ആധുനിക മാനക മലയാളത്തിൽ സ്വാഭാവികമായി രൂപപ്പെടുത്തിയിരിക്കുന്നു.
- source_word: ποιήσω ὑμῖν
  choice: ഞാൻ നിങ്ങൾക്കായി ... ചെയ്യണം
  rationale: ποιήσω എന്ന ഒന്നാംപുരുഷ ഏകവചന സബ്ജങ്ക്ടീവിലെ ‘ഞാൻ’ വ്യക്തമാക്കുകയും ὑμῖν എന്ന ദത്തിവിനെ ഗുണഭോക്തൃ അർഥത്തിൽ ‘നിങ്ങൾക്കായി’ എന്നു പരിഭാഷപ്പെടുത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ ചോദ്യത്തിന്റെ ഭാവവും ശക്തിയും
  choice: “ഞാൻ നിങ്ങൾക്കായി എന്തു ചെയ്യണമെന്നാണ് നിങ്ങൾ ആഗ്രഹിക്കുന്നത്?” എന്ന നേരിട്ടുള്ള, വ്യക്തിപരമായ ചോദ്യം
  alternative: “ഞാൻ നിങ്ങൾക്കുവേണ്ടി എന്തു ചെയ്യണമെന്നാണ് നിങ്ങളുടെ ആഗ്രഹം?”
  rationale: ഗ്രീക്ക് വാക്യം അവരുടെ അഭ്യർഥന തുറന്നു പറയാൻ ക്ഷണിക്കുന്ന നേരിട്ടുള്ള ചോദ്യമാണ്. പരിഭാഷ അനാവശ്യമായ ഔപചാരികതയോ വ്യാഖ്യാനപരമായ വികാസമോ ചേർക്കാതെ ആ വ്യക്തിപരമായ അഭിസംബോധന നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘നിന്നിട്ട്’ പ്രവൃത്തികളുടെ ക്രമം ലളിതമായി നൽകുന്നു; ‘ആഗ്രഹിക്കുന്നത്’ θέλωയുടെ അർഥം വ്യക്തമായി നിലനിർത്തുന്നു.
