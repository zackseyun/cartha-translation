revisions:
- from: 'യേശു നിന്നിട്ട് അവരെ വിളിച്ചു ചോദിച്ചു: “ഞാൻ നിങ്ങൾക്കായി എന്തു ചെയ്യണമെന്നാണ് നിങ്ങൾ ആഗ്രഹിക്കുന്നത്?”'
  to: യേശു നിന്നു; അവരെ വിളിച്ച്, “ഞാൻ നിങ്ങൾക്കായി എന്തു ചെയ്യണമെന്നാണ് നിങ്ങൾ ആഗ്രഹിക്കുന്നത്?” എന്നു ചോദിച്ചു.
  rationale: The revision uses ‘നിന്നു’ for the idiomatic force of στὰς and explicitly retains Jesus’ calling the men before asking the question. The direct question, first-person action, plural addressees, and benefactive sense of ὑμῖν are preserved in natural modern standard Malayalam.
