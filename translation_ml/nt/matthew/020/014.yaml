  yaml_path: translation/nt/matthew/020/014.yaml
  text: Take what is yours and go[a]. But I want to give to this last man the same as to you.
translation:
  language: ml
  text: നിന്റേത് എടുത്ത് പോകുക. എന്നാൽ നിനക്കു കൊടുക്കുന്നതുപോലെ ഈ അവസാനത്തവനും കൊടുക്കാൻ ഞാൻ ആഗ്രഹിക്കുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἆρον
  choice: എടുത്തുകൊണ്ട്
  rationale: αἴρω എന്ന ക്രിയയുടെ ആജ്ഞാരൂപം ഇവിടെ ഒരാൾക്കുള്ളത് കൈപ്പറ്റി കൊണ്ടുപോകാനുള്ള നേരിട്ടുള്ള നിർദേശമാണ്; ‘എടുത്തുകൊണ്ട്’ ഈ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὸ σὸν
  choice: നിനക്കുള്ളത്
  rationale: ഗ്രീക്കിലെ നപുംസകലിംഗ നാമവത്കൃത പ്രയോഗം അക്ഷരാർഥത്തിൽ ‘നിന്റേത്’ എന്നാണ്. സന്ദർഭം കൂലിയെക്കുറിച്ചാണെങ്കിലും, മൂലത്തിൽ വ്യക്തമാക്കാത്ത ‘കൂലി’ എന്ന പദം ചേർക്കാതെ വിശാലത നിലനിർത്തുന്നു.
- source_word: ὕπαγε
  choice: പോകുക
  rationale: ഈ സന്ദർഭത്തിൽ ὑπάγω വിടവാങ്ങാനുള്ള ആജ്ഞയാണ്. ‘പോകുക’ ചുരുക്കവും മാന്യവും സ്വാഭാവികവുമാണ്; അനാവശ്യമായ ശത്രുതാഭാവം ചേർക്കുന്നില്ല.
- source_word: θέλω δὲ
  choice: എന്നാൽ … ഞാൻ ആഗ്രഹിക്കുന്നു
  rationale: θέλω സംസാരിക്കുന്നവന്റെ ഇഷ്ടമോ മനസ്സോ സൂചിപ്പിക്കുന്നു; δέ നൽകുന്ന മൃദുവായ വൈരുധ്യം ‘എന്നാൽ’കൊണ്ട് പ്രകടമാക്കുന്നു.
- source_word: τούτῳ τῷ ἐσχάτῳ
  choice: ഈ അവസാനത്തവനും
  rationale: ἐσχάτῳ എന്നത് ‘അവസാനത്തവൻ’ എന്നാണ്. ഉപമയിലെ പുരുഷ തൊഴിലാളിയെയാണ് ഏകവചന പുരുഷലിംഗരൂപം സൂചിപ്പിക്കുന്നത്; ‘-നും’ എന്ന ദത്തിവിഭക്തി താരതമ്യത്തിലെ ഉൾപ്പെടുത്തലും സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: δοῦναι
  choice: കൊടുക്കാൻ
  rationale: δίδωμι എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘കൊടുക്കുക’ നിലനിർത്തുന്നു. സന്ദർഭം പ്രതിഫലം നൽകുന്നതാണെങ്കിലും ‘കൂലി കൊടുക്കാൻ’ എന്ന് കൂടുതൽ വ്യക്തമാക്കുന്നില്ല.
- source_word: ὡς καὶ σοί
  choice: നിനക്കു തന്നതുപോലെതന്നെ
  rationale: ὡς καὶ σοί സൂചിപ്പിക്കുന്ന തുല്യമായ നൽകൽ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ആവർത്തനം ഒഴിവാക്കാൻ നൽകിയ വസ്തു സന്ദർഭത്തിൽനിന്ന് ഗ്രഹിക്കാവുന്നതായി വിടുന്നു.
theological_decisions:
- issue: ഏകവചന പുരുഷലിംഗ വ്യക്തിസൂചന
  choice: ഈ അവസാനത്തവനും
  alternative: അവസാനം വന്ന ഇയാൾക്കും
  rationale: ഗ്രീക്കിൽ ‘വന്ന’ എന്ന ക്രിയ ഇല്ലാത്തതിനാൽ അത് പ്രധാനവാചകത്തിൽ ചേർക്കുന്നില്ല. അതേസമയം പുരുഷ തൊഴിലാളിയെ സൂചിപ്പിക്കുന്ന ഏകവചന പുരുഷലിംഗരൂപം ‘അവസാനത്തവൻ’ എന്ന പ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആജ്ഞാശൈലി ഉപയോഗിച്ചു. സന്ദർഭത്തിൽ വ്യക്തമാണെങ്കിലും ഗ്രീക്കിൽ ഈ വാക്യത്തിൽ നേരിട്ട് ഇല്ലാത്ത ‘കൂലി’ എന്ന പദം ചേർത്തിട്ടില്ല. ഇംഗ്ലീഷ് consultation layer-ൽ നൽകിയ അടിക്കുറിപ്പ് അതിന്റെ marker-നോട് പൊരുത്തപ്പെടാത്തതിനാലും ഗ്രീക്ക് വാചകത്തിൽ പ്രസക്തമായ പാഠഭേദമോ നിർബന്ധമായ വിശദീകരണമോ ഇല്ലാത്തതിനാലും ഇവിടെ അടിക്കുറിപ്പ് നൽകിയിട്ടില്ല.
