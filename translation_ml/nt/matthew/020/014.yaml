revisions:
- from: നിനക്കുള്ളത് എടുത്തുകൊണ്ട് പോകുക. എന്നാൽ നിനക്കു തന്നതുപോലെതന്നെ ഈ അവസാനത്തവനും കൊടുക്കാൻ ഞാൻ ആഗ്രഹിക്കുന്നു.
  to: നിന്റേത് എടുത്ത് പോകുക. എന്നാൽ നിനക്കു കൊടുക്കുന്നതുപോലെ ഈ അവസാനത്തവനും കൊടുക്കാൻ ഞാൻ ആഗ്രഹിക്കുന്നു.
  rationale: The revision preserves the direct commands and the deliberately broad “what is yours,” while changing the comparison to a present/generic form that matches the Greek owner’s stated intention to give the last man equally. It does not add “wages,” “came,” or any interpretive explanation.
