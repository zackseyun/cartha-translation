id: MAT.20.34
reference: Matthew 20:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: σπλαγχνισθεὶς δὲ ὁ Ἰησοῦς ἥψατο τῶν ⸀ὀμμάτων αὐτῶν, καὶ εὐθέως ⸀ἀνέβλεψαν καὶ ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/034.yaml
  text: And Jesus[a], moved with compassion, touched their eyes, and immediately they received their sight and followed him.
translation:
  language: ml
  text: യേശു മനസ്സലിഞ്ഞ് അവരുടെ കണ്ണുകളിൽ തൊട്ടു. ഉടനെ അവർക്ക് കാഴ്ച ലഭിച്ചു[a]; അവർ അവനെ അനുഗമിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവർ വീണ്ടും കണ്ടു.” ഈ ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘കാഴ്ച വീണ്ടെടുക്കുക’ എന്നോ അക്ഷരാർഥത്തിൽ ‘മേലോട്ടു നോക്കുക’ എന്നോ അർഥമാകാം; എന്നാൽ ഇവിടെ അത് കാഴ്ച ലഭിച്ചതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: σπλαγχνισθεὶς
  choice: മനസ്സലിഞ്ഞ്
  rationale: ആഴമായ കരുണയും അനുകമ്പയും സൂചിപ്പിക്കുന്ന കർത്തൃപ്രയോഗത്തെ സ്വാഭാവികവും വികാരശക്തിയുള്ളതുമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: δὲ
  choice: വാക്യപ്രവാഹത്തിലൂടെ സൂചിപ്പിച്ചു
  rationale: ഇവിടെ δέ ശക്തമായ വൈരുധ്യമല്ല, കഥയെ മുന്നോട്ടുകൊണ്ടുപോകുന്ന മൃദുവായ ബന്ധകമാണ്. പ്രത്യേക പദം ചേർക്കാതെ മലയാള വാക്യക്രമം അതിന്റെ പ്രവാഹം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἥψατο
  choice: തൊട്ടു
  rationale: രോഗശാന്തിയുടെ ഈ സന്ദർഭത്തിൽ ശാരീരികമായി സ്പർശിച്ചതാണ് അർഥം.
- source_word: τῶν ὀμμάτων αὐτῶν
  choice: അവരുടെ കണ്ണുകളിൽ
  rationale: ἅπτομαι എന്ന ക്രിയയോടുകൂടിയ ഗ്രീക്ക് ഷഷ്ഠീവിഭക്തിയുടെ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി സ്ഥലസൂചക രൂപത്തിൽ നൽകുന്നു.
- source_word: εὐθέως
  choice: ഉടനെ
  rationale: യേശുവിന്റെ സ്പർശനത്തെ തുടർന്നുണ്ടായ തൽക്ഷണഫലം വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: ἀνέβλεψαν
  choice: അവർക്ക് കാഴ്ച ലഭിച്ചു
  rationale: രോഗശാന്തിയുടെ സന്ദർഭത്തിൽ കാഴ്ച പ്രാപിക്കുക എന്ന അർഥം വ്യക്തമായി നൽകുന്നു; അതേസമയം മുമ്പ് കാഴ്ച ഉണ്ടായിരുന്നുവെന്ന് നിർബന്ധമായി പ്രസ്താവിക്കുന്നില്ല.
- source_word: ἠκολούθησαν αὐτῷ
  choice: അവർ അവനെ അനുഗമിച്ചു
  rationale: യേശുവിന്റെ പിന്നാലെ പോയി എന്ന നേരിട്ടുള്ള അർഥവും ശിഷ്യത്വവുമായി ബന്ധപ്പെട്ടേക്കാവുന്ന കഥാസൂചനയും നിലനിർത്തുന്നു; അവർ ഔപചാരികമായി ശിഷ്യരായി എന്ന് അധികമായി വ്യാഖ്യാനിക്കുന്നില്ല.
theological_decisions:
- issue: ἀνέβλεψαν സൂചിപ്പിക്കുന്ന രോഗശാന്തിയുടെ സ്വഭാവം
  choice: യഥാർഥവും തൽക്ഷണവുമായ കാഴ്ചപ്രാപിക്കൽ
  alternative: അവർ മേലോട്ടു നോക്കി എന്നോ പൊതുവായി കാണാൻ തുടങ്ങി എന്നോ മാത്രം പറയുക
  rationale: അത്ഭുതരോഗശാന്തിയുടെ സന്ദർഭവും εὐθέως എന്ന പദവും ചേർന്ന് തൽക്ഷണമായ കാഴ്ചപ്രാപിക്കൽ സൂചിപ്പിക്കുന്നു; അതിനപ്പുറം വിശദാംശങ്ങൾ ചേർത്തിട്ടില്ല.
- issue: ἠκολούθησαν αὐτῷ എന്നതിന്റെ വ്യാപ്തി
  choice: അവർ അവനെ അനുഗമിച്ചു
  alternative: അവർ അവന്റെ ശിഷ്യരായി
  rationale: പാഠം അവർ യേശുവിനെ അനുഗമിച്ചു എന്നു പറയുന്നു. ശിഷ്യത്വസൂചന ഉണ്ടാകാമെങ്കിലും അതിന്റെ സ്വഭാവമോ ദൈർഘ്യമോ ഇവിടെ നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. ‘മനസ്സലിഞ്ഞ്’ ആഴമുള്ള കരുണയെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു. ഗ്രീക്കിലെ മൃദുവായ ബന്ധകമായ δέ മലയാളത്തിൽ അനാവശ്യമായ വൈരുധ്യം സൃഷ്ടിക്കാതെ വാക്യപ്രവാഹത്തിലൂടെ കൈകാര്യം ചെയ്തിരിക്കുന്നു.
