translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അയാൾ’ എന്നത് ഉപമയിലെ മുന്തിരിത്തോട്ട ഉടമയെ സ്വാഭാവികമായി പരാമർശിക്കുന്നു. മൂലത്തിലെ historical present ഉദ്ദേശപൂർവം നിലനിർത്തിയിട്ടുണ്ട്; സമയത്തിന്റെ അക്ഷരാർഥപ്രയോഗവും ഇന്നത്തെ സമയക്കണക്കിലെ തുല്യവും അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
