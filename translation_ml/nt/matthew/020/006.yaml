id: MAT.20.6
reference: Matthew 20:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: περὶ δὲ τὴν ⸀ἑνδεκάτην ἐξελθὼν εὗρεν ἄλλους ⸀ἑστῶτας, καὶ λέγει αὐτοῖς· Τί ὧδε ἑστήκατε ὅλην τὴν ἡμέραν ἀργοί;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/006.yaml
  text: And about the eleventh hour he went out and found others standing there[a], and he says to them[b], ‘Why have you been standing here idle all day?’
translation:
  language: ml
  text: ഏകദേശം പതിനൊന്നാം മണിക്കൂറിൽ[a] അയാൾ പുറത്തേക്കു പോയി, നിന്നുകൊണ്ടിരുന്ന മറ്റുചിലരെ കണ്ടു; അവരോടു പറയുന്നു:[b] ‘നിങ്ങൾ ദിവസം മുഴുവൻ ഇവിടെ വെറുതെ നിൽക്കുന്നത് എന്തിന്?’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഏകദേശം വൈകുന്നേരം അഞ്ചുമണിക്ക്.’ അക്ഷരാർഥം, ‘ഏകദേശം പതിനൊന്നാം മണിക്കൂറിൽ.’
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ, ‘അയാൾ അവരോടു പറഞ്ഞു.’ ഗ്രീക്കിൽ ഭൂതകാലസംഭവം വർത്തമാനകാലക്രിയ ഉപയോഗിച്ച് വിവരിക്കുന്നു: ‘പറയുന്നു.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ τὴν ἑνδεκάτην
  choice: ഏകദേശം പതിനൊന്നാം മണിക്കൂറിൽ
  rationale: περί + accusative സമയത്തിന്റെ ഏകദേശത സൂചിപ്പിക്കുന്നു. ‘പതിനൊന്നാം മണിക്കൂർ’ എന്ന ഉപമയിലെ സമയക്രമവും മൂലപാഠത്തിന്റെ പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: ἐξελθὼν εὗρεν
  choice: പുറത്തേക്കു പോയപ്പോൾ ... കണ്ടു
  rationale: Aorist participle പ്രധാനക്രിയയ്ക്കു മുൻപുള്ള പുറപ്പെടലിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ കാലബന്ധവാക്യമായി നൽകി.
- source_word: ἄλλους ἑστῶτας
  choice: വേറെ ചിലർ അവിടെ നിൽക്കുന്നതു
  rationale: ἄλλους substantival ആയി ‘വേറെ ചിലർ’; perfect participle ആയ ἑστῶτας തുടരുന്ന നിലയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘നിൽക്കുന്നതു’ എന്നു നൽകി. ‘അവിടെ’ സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: καὶ λέγει αὐτοῖς
  choice: അയാൾ അവരോട് പറയുന്നു
  rationale: ഗ്രീക്കിലെ historical present ആയ λέγει നിലനിർത്തി, ആഖ്യാനത്തിന്റെ സജീവത സംരക്ഷിച്ചു.
- source_word: Τί ... ἑστήκατε
  choice: നിൽക്കുന്നത് എന്തുകൊണ്ട്?
  rationale: ചോദ്യപ്രയോഗത്തിലെ Τί കാരണത്തെ അന്വേഷിക്കുന്നതിനാൽ ‘എന്തുകൊണ്ട്’; perfect രൂപത്തിന്റെ തുടരുന്ന നില മലയാളത്തിലെ സ്വാഭാവിക വർത്തമാനപ്രയോഗത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ὅλην τὴν ἡμέραν ἀργοί
  choice: ദിവസം മുഴുവൻ ... ജോലിയൊന്നും ചെയ്യാതെ
  rationale: Accusative duration ‘ദിവസം മുഴുവൻ’ എന്നും ἀργοί എന്നത് കുറ്റപ്പെടുത്തുന്ന ‘മടിയൻ’ എന്ന അർത്ഥം ഇറക്കുമതി ചെയ്യാതെ, പ്രവർത്തനമില്ലാത്ത അവസ്ഥയായി ‘ജോലിയൊന്നും ചെയ്യാതെ’ എന്നും നൽകി.
