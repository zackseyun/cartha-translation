id: MAT.20.15
reference: Matthew 20:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀οὐκ ἔξεστίν μοι ⸂ὃ θέλω ποιῆσαι⸃ ἐν τοῖς ἐμοῖς; ⸀ἢ ὁ ὀφθαλμός σου πονηρός ἐστιν ὅτι ἐγὼ ἀγαθός εἰμι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/015.yaml
  text: Is it not lawful for me to do what I want with what is mine? Or is your eye evil because I am good?[a]
translation:
  language: ml
  text: എനിക്കുള്ളവകൊണ്ട് എനിക്ക് ഇഷ്ടമുള്ളത് ചെയ്യാൻ എനിക്ക് അവകാശമില്ലേ? അതോ, ഞാൻ നല്ലവനായതുകൊണ്ട് നിന്റെ കണ്ണ് ദുഷിച്ചതാണോ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “ഞാൻ നല്ലവനായതുകൊണ്ട് നിനക്ക് അസൂയയാണോ?” “നിന്റെ കണ്ണ് ദുഷിച്ചതാണ്” എന്നത് അസൂയയെയോ മറ്റൊരാളുടെ നന്മയോടുള്ള നീരസത്തെയോ സൂചിപ്പിക്കുന്ന ഒരു ഗ്രീക്ക് പ്രയോഗമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξεστίν
  choice: അവകാശമില്ലേ
  rationale: അനുവദനീയതയും നിയമാനുസൃതമായ അവകാശവും സൂചിപ്പിക്കുന്ന പദം; സന്ദർഭത്തിലെ ഉടമയുടെ ആലങ്കാരിക ചോദ്യത്തിന് സ്വാഭാവികമായ മലയാളം.
- source_word: ὃ θέλω ποιῆσαι
  choice: എനിക്ക് ഇഷ്ടമുള്ളതു ചെയ്യാൻ
  rationale: θέλω സൂചിപ്പിക്കുന്ന വ്യക്തിപരമായ ഇച്ഛയെ ആധുനികവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐν τοῖς ἐμοῖς
  choice: എനിക്കുള്ളത് ഉപയോഗിച്ച്
  rationale: സ്വന്തമായ സമ്പത്ത് ഇഷ്ടാനുസരണം വിനിയോഗിക്കുന്നതിനെ സന്ദർഭോചിതമായി വ്യക്തമാക്കുന്നു.
- source_word: ὁ ὀφθαλμός σου πονηρός
  choice: നിന്റെ കണ്ണ് ദുഷിച്ചതാണോ
  rationale: അസൂയയെയോ മറ്റൊരാളുടെ നന്മയിൽ നീരസപ്പെടുന്നതിനെയോ സൂചിപ്പിക്കുന്ന സ്രോതസ്സിലെ 'ദുഷിച്ച കണ്ണ്' എന്ന രൂപകം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀγαθός
  choice: നല്ലവൻ
  rationale: അടിസ്ഥാന അർത്ഥമായ 'നല്ല' എന്നത് സംരക്ഷിക്കുകയും 'ദുഷിച്ച കണ്ണ്' എന്നതിനോടുള്ള മൂലപാഠത്തിലെ വൈരുധ്യം നിലനിർത്തുകയും ചെയ്യുന്നു; സന്ദർഭത്തിൽ ഉദാരത ഉൾധ്വനിക്കുന്നു.
theological_decisions:
- issue: ὁ ὀφθαλμός σου πονηρός എന്ന പ്രയോഗത്തെ മുഖ്യപാഠത്തിൽ വ്യാഖ്യാനിക്കണമോ
  choice: '''നിന്റെ കണ്ണ് ദുഷിച്ചതാണോ'' എന്ന സ്രോതസ്സിലെ രൂപകം നിലനിർത്തി'
  alternative: '''ഞാൻ നല്ലവനായതുകൊണ്ട് നിനക്ക് അസൂയയാണോ?'''
  rationale: തൊഴിലാളിയുടെ 'ദുഷിച്ച കണ്ണും' ഉടമയുടെ നന്മയും തമ്മിലുള്ള വൈരുധ്യം ഇങ്ങനെ നിലനിൽക്കുന്നു. അസൂയ എന്ന സാധ്യതയുള്ള അർത്ഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നതിലൂടെ രൂപകവും അതിന്റെ അർത്ഥവും ഒരുപോലെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഉടമസ്ഥാവകാശത്തെ സൂചിപ്പിക്കാൻ 'അവകാശം' ഉപയോഗിച്ചു; സാംസ്കാരികമായി അപരിചിതമായിരിക്കാവുന്ന 'ദുഷിച്ച കണ്ണ്' എന്ന രൂപകം സ്രോതസ്സിനോടുള്ള സുതാര്യതയ്ക്കായി നിലനിർത്തി അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
