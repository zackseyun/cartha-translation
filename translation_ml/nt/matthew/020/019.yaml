id: MAT.20.19
reference: Matthew 20:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ παραδώσουσιν αὐτὸν τοῖς ἔθνεσιν εἰς τὸ ἐμπαῖξαι καὶ μαστιγῶσαι καὶ σταυρῶσαι, καὶ τῇ τρίτῃ ἡμέρᾳ ⸀ἐγερθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/019.yaml
  text: and they will hand him over to the Gentiles to mock and flog and crucify[a], and on the third day he will be raised.
translation:
  language: ml
  text: അവർ അവനെ വിജാതീയരുടെ കൈയിൽ ഏൽപ്പിക്കും; അവർ അവനെ പരിഹസിക്കുകയും ചാട്ടവാറുകൊണ്ട് അടിക്കുകയും ക്രൂശിക്കുകയും ചെയ്യും. മൂന്നാം ദിവസം അവൻ ഉയിർപ്പിക്കപ്പെടും[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൻ ഉയിർത്തെഴുന്നേൽക്കും.” ഗ്രീക്കിലെ ക്രിയ കർമണി രൂപത്തിലാണ് (“ഉയിർപ്പിക്കപ്പെടും”); പുനരുത്ഥാനത്തെക്കുറിച്ചുള്ള ഈ സാധാരണ പ്രയോഗം ദൈവത്തിന്റെ പ്രവർത്തനത്തെ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: παραδώσουσιν
  choice: കൈയിൽ ഏൽപ്പിക്കും
  rationale: മറ്റൊരാളുടെ അധികാരത്തിലേക്ക് ഏൽപ്പിക്കുക എന്ന അർത്ഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘ഒറ്റിക്കൊടുക്കും’ എന്ന കൂടുതൽ സവിശേഷമായ ആശയം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: τοῖς ἔθνεσιν
  choice: വിജാതീയരുടെ
  rationale: ഈ യഹൂദ പശ്ചാത്തലത്തിലുള്ള പീഡാനുഭവ പ്രവചനത്തിൽ യഹൂദരല്ലാത്തവരെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ജനതകൾ’ എന്ന പൊതുവായ അർത്ഥത്തേക്കാൾ സന്ദർഭോചിതമാണ്.
- source_word: εἰς τὸ ἐμπαῖξαι
  choice: പരിഹസിക്കുകയും
  rationale: ἐμπαίζω എന്ന ക്രിയയുടെ പരിഹസിക്കുക/കളിയാക്കുക എന്ന അർത്ഥം ലളിതവും ഗൗരവമുള്ളതുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: μαστιγῶσαι
  choice: ചാട്ടവാറുകൊണ്ട് അടിക്കുകയും
  rationale: ന്യായവിധിയുടെ ഭാഗമായി ചാട്ടവാറുകൊണ്ട് അടിക്കുന്ന പ്രവൃത്തിയെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: σταυρῶσαι
  choice: ക്രൂശിക്കുകയും ചെയ്യും
  rationale: ക്രൂശിക്കുക എന്ന നേരിട്ടുള്ള ക്രിയാർഥം നിലനിർത്തുന്നു; മുൻവാക്യഭാഗത്തിലെ ‘അവനെ’ മൂന്നു സമന്വിത ക്രിയകൾക്കും പൊതുവായ കർമമായി സ്വാഭാവികമായി ബാധകമാണ്.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: മൂന്നാം ദിവസം
  rationale: കാലസൂചകമായ ദത്തിവ് പ്രയോഗത്തെ സ്വാഭാവികവും കൃത്യവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἐγερθήσεται
  choice: ഉയിർപ്പിക്കപ്പെടും
  rationale: ഭാവികാല കർമണി രൂപം നിലനിർത്തുകയും പുനരുത്ഥാനസന്ദർഭത്തിലെ ദൈവിക പ്രവർത്തനത്തിന്റെ സൂചന സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: പുനരുത്ഥാനക്രിയയുടെ പ്രയോഗരൂപം
  choice: അവൻ ഉയിർപ്പിക്കപ്പെടും
  alternative: അവൻ ഉയിർത്തെഴുന്നേൽക്കും
  rationale: ഗ്രീക്കിലെ ഭാവികാല കർമണി രൂപം സംരക്ഷിച്ച് ദൈവത്തിന്റെ പ്രവർത്തനത്തെ സൂചിപ്പിക്കാവുന്ന ഭാഷ നിലനിർത്തുന്നു; അതേസമയം മറ്റു ഭാഗങ്ങളിൽ പ്രതിപാദിക്കുന്ന ക്രിസ്തുവിന്റെ പ്രവർത്തനശേഷിയെ നിഷേധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള ശൈലി. നീണ്ട ഗ്രീക്ക് വാക്യഘടന വായനാസൗകര്യത്തിനായി രണ്ട് മലയാളവാക്യങ്ങളാക്കി; ഏക കർമത്തെ പങ്കിടുന്ന മൂന്നു പീഡനക്രിയകളും വ്യക്തമായി നിലനിർത്തി.
