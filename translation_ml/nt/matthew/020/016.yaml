id: MAT.20.16
reference: Matthew 20:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὕτως ἔσονται οἱ ἔσχατοι πρῶτοι καὶ οἱ πρῶτοι ⸀ἔσχατοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/016.yaml
  text: So the last will be first[a], and the first last.
translation:
  language: ml
  text: അങ്ങനെ, അവസാനത്തുള്ളവർ ആദ്യരാകും; ആദ്യത്തുള്ളവർ അവസാനത്തുള്ളവരാകും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: അങ്ങനെ
  rationale: ഉപമയിൽനിന്നുള്ള നിഗമനത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സൂചിപ്പിക്കുകയും ഗ്രീക്കിലെ ഫലസൂചകമായ ഭാവം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἔσονται
  choice: ആകും / ആകും
  rationale: εἰμί എന്ന ക്രിയയുടെ ഭാവികാലം മലയാളത്തിലെ സ്വാഭാവിക ഭാവിരൂപത്തിൽ നൽകുന്നു; ബഹുവചന കർത്താവിനൊപ്പം വാക്യത്തിൽ ‘ആകും’ ഉപയോഗിക്കുന്നു.
- source_word: οἱ ἔσχατοι
  choice: അവസാനത്തുള്ളവർ
  rationale: നാമവാചകമായി ഉപയോഗിച്ച വിശേഷണത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; ‘ഏറ്റവും ചെറിയവർ’ എന്നു നൽകുന്നത് മൂലപാഠം വ്യക്തമാക്കാത്ത സാമൂഹിക മൂല്യനിർണയം ചേർക്കും.
- source_word: πρῶτοι
  choice: ആദ്യരാകും
  rationale: ‘അവസാനം/ആദ്യം’ എന്ന സംക്ഷിപ്തമായ വിപരീതഘടന സംരക്ഷിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: καὶ
  choice: ;
  rationale: ഗ്രീക്കിലെ ലളിതമായ സമന്വയം മലയാളത്തിൽ സമതുലിതമായ രണ്ടു ഉപവാക്യങ്ങളായി ചിഹ്നനം ചെയ്യുന്നു; ‘എന്നാൽ’ എന്ന പ്രതികൂലബലം ചേർക്കുന്നില്ല.
- source_word: οἱ πρῶτοι
  choice: ആദ്യത്തുള്ളവർ
  rationale: ആദ്യ ഉപവാക്യത്തിലെ ‘അവസാനത്തുള്ളവർ’ എന്ന രൂപത്തിന് സമാന്തരമായ നാമവാചക വിശേഷണഘടന നിലനിർത്തുന്നു.
- source_word: ἔσχατοι
  choice: അവസാനത്തുള്ളവരാകും
  rationale: മറിച്ചിടലിന്റെ സമാന്തരതയും സംക്ഷിപ്തതയും നിലനിർത്തുന്നു; ‘ഏറ്റവും ചെറിയവർ’ എന്ന വ്യാഖ്യാനപരമായ അർഥം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: വചനത്തിലെ മറിച്ചിടലിന്റെ സ്വഭാവം
  choice: ‘അവസാനം/ആദ്യം’ എന്ന സംക്ഷിപ്തമായ മറിച്ചിടൽവാക്യമായി വിവർത്തനം ചെയ്യുന്നു; ഇത് കാലക്രമത്തെയോ സാമൂഹികസ്ഥാനത്തെയോ പ്രതിഫലത്തെയോ രക്ഷയെയോ മാത്രം സൂചിപ്പിക്കുന്നതായി നിർണ്ണയിക്കുന്നില്ല.
  alternative: സാമൂഹികസ്ഥാനത്തിന്റെ മറിച്ചിടൽ, ശിഷ്യത്വത്തിലെ പ്രതിഫലക്രമത്തിന്റെ മറിച്ചിടൽ, അല്ലെങ്കിൽ രക്ഷാക്രമത്തെക്കുറിച്ചുള്ള പ്രസ്താവന എന്നിങ്ങനെ വ്യക്തമായി വ്യാഖ്യാനിക്കുക.
  rationale: ഗ്രീക്ക് വാക്യം പ്രയോഗപരിധി ചുരുക്കാതെ മറിച്ചിടൽ പ്രസ്താവിക്കുന്നു. അതിനാൽ മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില വിവർത്തനം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ സമതുലിതമായ വിപരീതഘടനയും അർഥവ്യാപ്തിയും സംരക്ഷിച്ചിരിക്കുന്നു. ഇംഗ്ലീഷ് അടിക്കുറിപ്പിലെ ‘So/Thus’ വ്യത്യാസത്തിന് മലയാളത്തിൽ പ്രസക്തമായ വേറിട്ട അർഥഭേദമില്ലാത്തതിനാൽ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
