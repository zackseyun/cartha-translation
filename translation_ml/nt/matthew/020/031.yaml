id: MAT.20.31
reference: Matthew 20:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ ὄχλος ἐπετίμησεν αὐτοῖς ἵνα σιωπήσωσιν· οἱ δὲ μεῖζον ⸀ἔκραξαν λέγοντες· ⸂Κύριε, ἐλέησον ἡμᾶς⸃, ⸀υἱὸς Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/031.yaml
  text: But the crowd rebuked them so that they would be silent[a]. Yet they cried out all the more, saying, “Lord, have mercy on us[b], Son of David.”
translation:
  language: ml
  text: 'എന്നാൽ അവർ മിണ്ടാതിരിക്കാൻ ജനക്കൂട്ടം അവരെ ശാസിച്ചു. എങ്കിലും അവർ അതിലേറെ നിലവിളിച്ചു: “കർത്താവേ, ഞങ്ങളോടു കരുണ കാണിക്കണമേ, ദാവീദിന്റെ പുത്രാ!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ദാവീദിന്റെ പുത്രൻ” എന്നത് വെറും വംശപരാമർശമല്ല; മശീഹയെ സൂചിപ്പിക്കുന്ന ഒരു പദവിയാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: ὄχλος
  choice: ജനക്കൂട്ടം
  rationale: ആഖ്യാനസന്ദർഭത്തിലെ ഒരുകൂട്ടം ആളുകളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും ആധുനികവുമായ മലയാളപ്രയോഗം.
- source_word: ἐπετίμησεν
  choice: ശാസിച്ചു
  rationale: അവരെ നിശ്ശബ്ദരാക്കാനുള്ള ജനക്കൂട്ടത്തിന്റെ കടുത്ത ശാസനയുടെ ശക്തി നിലനിർത്തുന്നു.
- source_word: ἵνα σιωπήσωσιν
  choice: മിണ്ടാതിരിക്കാൻ
  rationale: ἵνα ഘടനയിലെ ഉദ്ദേശ്യം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: μεῖζον
  choice: അതിലുമധികം
  rationale: തീവ്രതയിലോ ശബ്ദത്തിന്റെ അളവിലോ ഉണ്ടായ വർധന എന്ന ഗ്രീക്ക് താരതമ്യപ്രയോഗത്തിന്റെ വിശാലത സംരക്ഷിക്കുന്നു.
- source_word: ἔκραξαν
  choice: നിലവിളിച്ചു
  rationale: κράζω സൂചിപ്പിക്കുന്ന ഉച്ചത്തിലുള്ള അടിയന്തരവിളി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: ആദരപൂർവമായ അഭിസംബോധനയും സാധ്യതയുള്ള ക്രിസ്തുശാസ്ത്രപരമായ അർഥഭാരവും ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: ἐλέησον ἡμᾶς
  choice: ഞങ്ങളോടു കരുണ കാണിക്കണമേ
  rationale: കരുണയ്ക്കായുള്ള അപേക്ഷയെ വ്യക്തവും മാന്യവും സ്വാഭാവികവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: υἱὸς Δαυίδ
  choice: ദാവീദിന്റെ പുത്രാ
  rationale: വംശപരാമർശത്തിൽ ഒതുക്കാതെ മത്തായിയിലെ രാജകീയ-മശീഹാപദവിയുടെ രൂപം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യേശുവിനോടു പ്രയോഗിക്കുന്ന മശീഹാപദവി
  choice: ദാവീദിന്റെ പുത്രാ
  alternative: ദാവീദിന്റെ സന്തതിയേ
  rationale: വാക്യം വെറും വംശാവലിയേക്കാൾ കൂടുതൽ അർഥമുള്ള അംഗീകൃത രാജകീയ-മശീഹാപദവിയായി പ്രവർത്തിക്കുന്നതിനാൽ അതിന്റെ രൂപവും അർഥഭാരവും നിലനിർത്തി.
- issue: യേശുവിനെ അഭിസംബോധന ചെയ്യുന്ന κύριος
  choice: കർത്താവേ
  alternative: ഗുരുവേ / യജമാനനേ
  rationale: ആദരസൂചക അഭിസംബോധനയും ക്രിസ്തുശാസ്ത്രപരമായ സൂചനയും തമ്മിലുള്ള വാചകത്തിലെ അർഥവ്യാപ്തി ‘കർത്താവേ’ കൂടുതൽ നന്നായി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ ആഖ്യാനശൈലി. μεῖζον എന്നതിലെ ‘കൂടുതൽ’ എന്ന താരതമ്യഭാവം പ്രധാനവാചകത്തിൽ സംരക്ഷിച്ചതിനാൽ അതിനായി വേറൊരു അടിക്കുറിപ്പ് ആവശ്യമില്ല. നേരിട്ടുള്ള അഭിസംബോധന മലയാളത്തിലെ സ്വാഭാവിക ക്രമത്തിൽ നൽകിയിരിക്കുന്നു.
