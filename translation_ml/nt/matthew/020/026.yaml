  text: οὐχ οὕτως ⸀ἔσται ἐν ὑμῖν· ἀλλ’ ὃς ⸀ἂν θέλῃ ἐν ὑμῖν μέγας γενέσθαι ἔσται ὑμῶν διάκονος,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/026.yaml
  text: It shall not be so among you[a]. But whoever wants to become great among you shall be your servant,
translation:
  language: ml
  text: നിങ്ങളുടെ ഇടയിൽ അങ്ങനെ ആയിരിക്കുകയില്ല.[a] എന്നാൽ നിങ്ങളുടെ ഇടയിൽ വലിയവനാകാൻ ആഗ്രഹിക്കുന്നവൻ നിങ്ങളുടെ സേവകനായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങളുടെ ഇടയിൽ അങ്ങനെ അല്ല.” ഗ്രീക്കിൽ ഭാവികാല ക്രിയയാണ് (“ആയിരിക്കും”) ഉപയോഗിച്ചിരിക്കുന്നത്; യേശുവിന്റെ അനുയായികളുടെ ഇടയിൽ കാര്യങ്ങൾ എങ്ങനെയായിരിക്കരുതെന്ന നിർദേശാത്മക അർഥവും അതിന് ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ οὕτως ἔσται ἐν ὑμῖν
  choice: നിങ്ങളുടെ ഇടയിൽ അങ്ങനെ ആകരുത്
  rationale: ഭാവികാലരൂപമായ ἔσται ഇവിടെ യേശുവിന്റെ അനുയായികളുടെ സമൂഹത്തിൽ കാര്യങ്ങൾ എങ്ങനെയായിരിക്കരുതെന്ന നിർദേശാത്മക അർഥം വഹിക്കുന്നു. സ്വാഭാവിക മലയാളത്തിൽ ‘ആകരുത്’ ആ ശക്തി വ്യക്തമാക്കുന്നു; പദശഃ ഭാവികാലം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἀλλ’ ὃς ἂν θέλῃ
  choice: എന്നാൽ ... ആഗ്രഹിക്കുന്നവൻ
  rationale: ὃς ἂν + subjunctive അനിശ്ചിതവും പൊതുവുമായ വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; ‘ആഗ്രഹിക്കുന്നവൻ’ θέλῃയുടെ ഇച്ഛാസൂചന സ്വാഭാവികമായി നൽകുന്നു.
- source_word: μέγας γενέσθαι
  choice: വലിയവനാകാൻ
  rationale: γενέσθαιയിലെ ‘ആയിത്തീരുക’ എന്ന ഗതിമാന ഭാവം ‘ആകാൻ’ നിലനിർത്തുന്നു; കേവലം ‘വലിയവനായിരിക്കാൻ’ എന്നു സമതലപ്പെടുത്തുന്നില്ല.
- source_word: διάκονος
  choice: ശുശ്രൂഷകൻ
  rationale: സന്ദർഭത്തിൽ മറ്റുള്ളവരെ സേവിക്കുന്ന വ്യക്തിയെയാണ് διάκονος സൂചിപ്പിക്കുന്നത്. ‘ശുശ്രൂഷകൻ’ സേവനത്തിന്റെ ആശയം നിലനിർത്തുന്നു; പിന്നീടുണ്ടായ സഭാപദവിയായ ‘ഡീക്കൻ’ എന്ന അർഥം അനാവശ്യമായി ചുമത്തുന്നില്ല.
- source_word: ὑμῶν
  choice: നിങ്ങളുടെ
  rationale: ബന്ധസൂചകമായ genitive മലയാളത്തിൽ സ്വാഭാവികമായി ‘നിങ്ങളുടെ ശുശ്രൂഷകൻ’ എന്നു നൽകുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ അനുയായികളുടെ സമൂഹത്തിലെ മഹത്വത്തിന്റെ സ്വഭാവം
  choice: ലൗകിക അധികാരക്രമത്തെ മറിച്ചിടുന്ന സേവനമാനദണ്ഡമായി വാക്യം അവതരിപ്പിക്കുന്നു; പിന്നീട് രൂപപ്പെട്ട സഭാപദവികൾ ഇതിലേക്ക് കൊണ്ടുവരുന്നില്ല.
  alternative: διάκονος എന്നത് സഭയിലെ ‘ഡീക്കൻ’ പദവിയായി വായിക്കുക, അല്ലെങ്കിൽ സേവകനെന്ന സാക്ഷാൽ ഭാഷ ഒഴിവാക്കി പൊതുവായ വിനയമായി പരാവർത്തനം ചെയ്യുക.
  rationale: ചുറ്റുമുള്ള സന്ദർഭം ജാതികളുടെ ഭരണരീതിയെയും യേശു തന്റെ ശിഷ്യർക്കു നൽകുന്ന മാനദണ്ഡത്തെയും തമ്മിൽ എതിർനിർത്തുന്നു. അതിനാൽ സേവനഭാഷ വ്യക്തമായി നിലനിർത്തുകയും സ്ഥാപനപരമായ അർഥം ചുമത്താതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘വലിയവനാകാൻ’ എന്നത് മൂലത്തിലെ ingressive ഭാവം നിലനിർത്തുന്നു. ‘ശുശ്രൂഷകൻ’ സഭാപദവി നിർബന്ധമാക്കാതെ സേവിക്കുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്നു.
