  source_fidelity: The draft accurately conveys the contrast, the generic force of ὃς ἄν, and the ingressive sense of γενέσθαι. However, its main text turns both future forms (ἔσται ... ἔσται) into prohibitive/obligatory wording (“ആകരുത്,” “ആയിരിക്കണം”). The Greek future may carry normative force in context, but its future formulation should be retained in the main translation, as in the English audit trail.
  naturalness: “നിങ്ങളുടെ ഇടയിൽ അങ്ങനെ ആയിരിക്കുകയില്ല” and “നിങ്ങളുടെ സേവകനായിരിക്കും” are clear, natural modern standard Malayalam. They preserve the concise parallelism of the Greek while allowing the surrounding context to convey the normative implication.
  terminology: “സേവകൻ” is preferable here to “ശുശ്രൂഷകൻ.” The latter can readily suggest a church minister or formal religious worker in current Malayalam, whereas διάκονος in this saying denotes one who serves and is not a later ecclesial office.
