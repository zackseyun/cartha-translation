  - severity: low
    issue: “ശുശ്രൂഷകൻ” may carry unnecessary ecclesiastical or ministerial associations.
    rationale: In this context διάκονος means a serving person, not an office-holder. “സേവകൻ” communicates this more directly in modern Malayalam.
