id: MAT.20.23
reference: Matthew 20:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀λέγει αὐτοῖς· Τὸ μὲν ποτήριόν μου ⸀πίεσθε, τὸ δὲ καθίσαι ἐκ δεξιῶν μου καὶ ἐξ ⸀εὐωνύμων οὐκ ἔστιν ⸀ἐμὸν δοῦναι, ἀλλ’ οἷς ἡτοίμασται ὑπὸ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/023.yaml
  text: He said to them[a], “You will indeed drink my cup, but to sit at my right and at my left is not mine to grant[b], but it is for those for whom it has been prepared by my Father.”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “നിങ്ങൾ എന്റെ പാനപാത്രം[a] കുടിക്കും. എന്നാൽ എന്റെ വലത്തും ഇടത്തും ഇരിക്കാൻ അനുവദിക്കുക എനിക്കുള്ളതല്ല; എന്റെ പിതാവ് ആർക്കുവേണ്ടി അതു ഒരുക്കിയിരിക്കുന്നുവോ അവർക്കുള്ളതാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പാനപാത്രം’ എന്നത് യേശുവിനായി നിശ്ചയിക്കപ്പെട്ട കഷ്ടാനുഭവത്തെയോ വിധിയെയോ സൂചിപ്പിക്കുന്ന രൂപകമാണ്; അവന്റെ ശിഷ്യന്മാരും അതിൽ പങ്കുചേരും.
    reason: cross_reference
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: അവൻ അവരോടു പറഞ്ഞു
  rationale: ഗ്രീക്കിൽ ചരിത്രവർത്തമാനകാലമാണെങ്കിലും, സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലിയിൽ ഭൂതകാലം അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: Τὸ μὲν ποτήριόν μου πίεσθε
  choice: എന്റെ പാനപാത്രം നിങ്ങൾ തീർച്ചയായും കുടിക്കും
  rationale: ‘പാനപാത്രം’ എന്ന രൂപകം വ്യാഖ്യാനിച്ച് മാറ്റാതെ നിലനിർത്തുന്നു; μὲν സൂചിപ്പിക്കുന്ന ഉറപ്പും തുടർന്നുള്ള വൈരുധ്യവും ‘തീർച്ചയായും’ പ്രകടമാക്കുന്നു.
- source_word: καθίσαι ἐκ δεξιῶν μου καὶ ἐξ εὐωνύμων
  choice: എന്റെ വലത്തും ഇടത്തും ഇരിക്കാനുള്ള സ്ഥാനം
  rationale: യേശുവിന്റെ ഇരുവശങ്ങളിലുമുള്ള ബഹുമാനസ്ഥാനങ്ങളെയാണ് പ്രയോഗം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികമായി അതേ ബന്ധാർഥം നിലനിർത്തുന്നു.
- source_word: οὐκ ἔστιν ἐμὸν δοῦναι
  choice: നൽകുന്നത് എനിക്കുള്ള കാര്യമല്ല
  rationale: δοῦναι എന്നതിന്റെ ‘നൽകുക’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുകയും, പ്രസ്താവനയിലെ അധികാരസംബന്ധമായ സംഘർഷം വിശദീകരിച്ച് നീക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀλλ’ οἷς ἡτοίμασται
  choice: അത് ... ആർക്കുവേണ്ടി ഒരുക്കിയിരിക്കുന്നുവോ അവർക്കുള്ളതാണ്
  rationale: ഗ്രീക്കിലെ അപൂർണവാക്യഘടന മലയാളത്തിൽ വ്യക്തതയ്ക്കായി പൂരിപ്പിക്കുന്നു; perfect passive സൂചിപ്പിക്കുന്ന പൂർത്തിയായ ഒരുക്കത്തിന്റെ ഇപ്പോഴത്തെ ഫലം ‘ഒരുക്കിയിരിക്കുന്നുവോ’ എന്നതിൽ നിലനിൽക്കുന്നു.
- source_word: ὑπὸ τοῦ πατρός μου
  choice: എന്റെ പിതാവ്
  rationale: കർമണിപ്രയോഗത്തിലെ പ്രവർത്തകനെ മലയാളത്തിലെ സ്വാഭാവിക കർത്തൃവാക്യഘടനയിൽ നൽകുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘മാത്രം’ പോലുള്ള പദം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: സ്ഥാനങ്ങൾ നൽകുന്നത് ‘എനിക്കുള്ള കാര്യമല്ല’ എന്ന യേശുവിന്റെ വാക്കിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ അർഥം
  choice: വിശദീകരണപരമായ നിയന്ത്രണമോ സമന്വയിപ്പിക്കുന്ന കൂട്ടിച്ചേർക്കലോ ഇല്ലാതെ പ്രസ്താവന നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘പിതാവിനെ കൂടാതെ എനിക്ക് നൽകാനാവില്ല’ എന്നതുപോലുള്ള വിശദീകരണം ചേർക്കുക.
  rationale: മൂലപാഠത്തിലുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഭാഷകൻ പരിഹരിക്കാതെ നിലനിർത്തണം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായെങ്കിലും ഗൗരവമുള്ള ശൈലി. രൂപകവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും മുഖ്യവാചകത്തിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
