- from: 'അവൻ അവരോടു പറഞ്ഞു: “എന്റെ പാനപാത്രം[a] നിങ്ങൾ തീർച്ചയായും കുടിക്കും. എന്നാൽ എന്റെ വലത്തും ഇടത്തും ഇരിക്കാനുള്ള സ്ഥാനം നൽകുന്നത് എനിക്കുള്ള കാര്യമല്ല; അത് എന്റെ പിതാവ് ആർക്കുവേണ്ടി ഒരുക്കിയിരിക്കുന്നുവോ അവർക്കുള്ളതാണ്.”'
  to: 'അവൻ അവരോടു പറഞ്ഞു: “നിങ്ങൾ എന്റെ പാനപാത്രം[a] കുടിക്കും. എന്നാൽ എന്റെ വലത്തും ഇടത്തും ഇരിക്കാൻ അനുവദിക്കുക എനിക്കുള്ളതല്ല; എന്റെ പിതാവ് ആർക്കുവേണ്ടി അതു ഒരുക്കിയിരിക്കുന്നുവോ അവർക്കുള്ളതാണ്.”'
  rationale: The revision removes the supplied noun ‘സ്ഥാനം’ and uses a direct Malayalam infinitival expression for sitting at Jesus’ right and left. It also replaces an idiom of responsibility with wording that more closely preserves οὐκ ἔστιν ἐμὸν δοῦναι, while retaining the Greek ellipsis in a clear Malayalam form. The existing footnote is retained because it identifies the metaphor without altering the main text.
