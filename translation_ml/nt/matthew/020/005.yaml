  yaml_path: translation/nt/matthew/020/005.yaml
  text: So they went away. Going out again about the sixth and ninth hour[a], he did likewise.
translation:
  language: ml
  text: അങ്ങനെ അവർ പോയി. അവൻ വീണ്ടും ഏകദേശം ആറാം മണിക്കൂറിലും ഒമ്പതാം മണിക്കൂറിലും[a] പുറത്തുചെന്ന് അതുപോലെതന്നെ ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അതായത്, യഹൂദരുടെ സമയഗണനപ്രകാരം ഏകദേശം ഉച്ചയ്ക്കും ഉച്ചകഴിഞ്ഞ് മൂന്നുമണിക്കും.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ ἀπῆλθον
  choice: അങ്ങനെ അവർ പോയി
  rationale: οἱ മുമ്പ് അഭിസംബോധന ചെയ്യപ്പെട്ട തൊഴിലാളികളെ സൂചിപ്പിക്കുന്നു; δέ ഇവിടെ മൃദുവായ കഥാസംബന്ധകമാണ്; ἀπῆλθον എന്നതിന്റെ സ്വാഭാവികമായ ആധുനിക മലയാളരൂപം ‘പോയി’ എന്നാണ്.
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: ആവർത്തിച്ചുള്ള പ്രവൃത്തിയെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: ἐξελθὼν
  choice: പുറത്തുചെന്ന്
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ളതോ അതിനോടു ചേർന്നുനിൽക്കുന്നതോ ആയ കഥാക്രമം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ഗ്രീക്കിലെ കൃതന്തത്തിന്റെ സമയബന്ധം അനാവശ്യമായി കൃത്യമാക്കുന്നില്ല.
- source_word: περὶ ἕκτην καὶ ἐνάτην ὥραν
  choice: ഏകദേശം ആറാം മണിക്കൂറിലും ഒമ്പതാം മണിക്കൂറിലും
  rationale: περί എന്നതിലെ ഏകദേശഭാവവും യഹൂദ സമയഗണനയിലെ ക്രമസംഖ്യാമണിക്കൂർ പ്രയോഗവും നിലനിർത്തുന്നു; ആധുനിക സമയതുല്യം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἐποίησεν ὡσαύτως
  choice: അതുപോലെതന്നെ ചെയ്തു
  rationale: ἐποίησεν എന്ന ലഘുവായ ക്രിയയും ὡσαύτως എന്ന താരതമ്യഭാവവും ചേർന്ന ഗ്രീക്ക് പ്രയോഗം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പകരുന്നു.
