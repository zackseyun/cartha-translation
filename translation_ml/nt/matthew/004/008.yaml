id: MAT.4.8
reference: Matthew 4:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Πάλιν παραλαμβάνει αὐτὸν ὁ διάβολος εἰς ὄρος ὑψηλὸν λίαν, καὶ δείκνυσιν αὐτῷ πάσας τὰς βασιλείας τοῦ κόσμου καὶ τὴν δόξαν αὐτῶν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/008.yaml
  text: Again[a], the devil takes him to a very high mountain and shows him all the kingdoms of the world and their glory.
translation:
  language: ml
  text: വീണ്ടും പിശാച് അവനെ വളരെ ഉയരമുള്ള ഒരു മലയിലേക്കു കൂട്ടിക്കൊണ്ടുപോയി, ലോകത്തിലെ എല്ലാ രാജ്യങ്ങളെയും അവയുടെ മഹത്ത്വത്തെയും[a] അവനു കാണിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പ്രൗഢി.’
    reason: δόξα ഈ സന്ദർഭത്തിൽ രാജ്യങ്ങളുടെ ദൃശ്യമായ തേജസ്സിനെയോ പ്രൗഢിയെയോ സൂചിപ്പിക്കാം; മുഖ്യപാഠത്തിലെ ‘മഹത്ത്വം’ എന്നതിനുള്ള സന്ദർഭപരമായ പദവികൽപം.
lexical_decisions:
- source_word: Πάλιν
  choice: വീണ്ടും
  rationale: പ്രലോഭനങ്ങളുടെ ക്രമത്തിൽ മറ്റൊരു ആവർത്തിത നടപടിയെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: παραλαμβάνει
  choice: കൂട്ടിക്കൊണ്ടുപോയി
  rationale: ഒരാളെ കൂടെ കൊണ്ടുപോകുക എന്ന ചലനാർഥം വ്യക്തമായി നൽകുന്നു. ഗ്രീക്കിലെ ചരിത്രവർത്തമാനത്തെ സ്വാഭാവികമായ മലയാള ആഖ്യാനരീതിക്കനുസരിച്ച് ഭൂതകാലത്തിൽ അവതരിപ്പിച്ചു.
- source_word: ὁ διάβολος
  choice: പിശാച്
  rationale: ഈ സന്ദർഭത്തിൽ സാത്താന്റെ അറിയപ്പെടുന്ന സ്ഥാനനാമമായി പ്രവർത്തിക്കുന്നു; മലയാളത്തിലെ വ്യക്തവും പ്രചാരത്തിലുള്ളതുമായ പദം.
- source_word: εἰς ὄρος ὑψηλὸν λίαν
  choice: വളരെ ഉയരമുള്ള ഒരു മലയിലേക്ക്
  rationale: εἰς സൂചിപ്പിക്കുന്ന ലക്ഷ്യസ്ഥാനവും λίαν നൽകുന്ന തീവ്രതയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δείκνυσιν
  choice: കാണിച്ചു
  rationale: കാണിച്ചുകൊടുക്കുക എന്ന അടിസ്ഥാനാർഥം അതിശയോക്തിയില്ലാതെ നൽകുന്നു; ചരിത്രവർത്തമാനം മലയാള ആഖ്യാനത്തിൽ ഭൂതകാലമായി പരിഭാഷപ്പെടുത്തി.
- source_word: πάσας τὰς βασιλείας
  choice: എല്ലാ രാജ്യങ്ങളെയും
  rationale: സമഗ്രതയും βασιλείαയുടെ രാഷ്ട്രീയ-രാജകീയ അർഥവും നിലനിർത്തുന്നു.
- source_word: τοῦ κόσμου
  choice: ലോകത്തിലെ
  rationale: κόσμος ഇവിടെ പൊതുവായി ലോകത്തെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: τὴν δόξαν αὐτῶν
  choice: അവയുടെ മഹത്ത്വത്തെയും
  rationale: δόξαയുടെ അടിസ്ഥാന പദബന്ധം നിലനിർത്തുകയും രാജ്യങ്ങളുമായി ബന്ധപ്പെട്ട ദൃശ്യമായ പ്രൗഢി വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന രീതിയിൽ നൽകുകയും ചെയ്യുന്നു; സന്ദർഭപരമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ ചേർത്തു.
theological_decisions:
- issue: പ്രലോഭനവിവരണത്തിലെ മലമുകളിലെ ദൃശ്യത്തിന്റെ സ്വഭാവം
  choice: പിശാച് യേശുവിനെ വളരെ ഉയരമുള്ള മലയിലേക്കു കൊണ്ടുപോയി ലോകത്തിലെ എല്ലാ രാജ്യങ്ങളും കാണിച്ചു എന്ന ആഖ്യാനം വിശദീകരണം ചേർക്കാതെ നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: ഇത് ഒരു ഭൗതിക മലയിൽ നിന്നുള്ള അക്ഷരാർഥത്തിലുള്ള കാഴ്ചയാണെന്നോ ദർശനപരമോ അതിസ്വാഭാവികമോ ആയ വെളിപ്പെടുത്തലാണെന്നോ വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്ക് പാഠം ദൃശ്യം എങ്ങനെ സാധ്യമായി എന്ന് വിശദീകരിക്കുന്നില്ല. അതിനാൽ അതിന്റെ സ്വഭാവത്തെക്കുറിച്ചുള്ള ദൈവശാസ്ത്രപരമോ ഭൂമിശാസ്ത്രപരമോ ആയ നിർവചനം പരിഭാഷയിൽ ഇറക്കുമതി ചെയ്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ ചരിത്രവർത്തമാനം മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികമായ ഭൂതകാല ആഖ്യാനമായി നൽകിയിരിക്കുന്നു. വാക്യം ദൃശ്യത്തിന്റെ രീതി വിശദീകരിക്കാതെ മൂലപാഠത്തിലെ അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
