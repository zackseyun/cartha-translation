source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Δεῦτε ὀπίσω μου, καὶ ποιήσω ὑμᾶς ἁλιεῖς ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/019.yaml
  text: And he says to them[a], “Come after me, and I will make you fishers of men.”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറയുന്നു: “എന്റെ പിന്നാലെ വരൂ; ഞാൻ നിങ്ങളെ മനുഷ്യരെ[a] പിടിക്കുന്ന മീൻപിടിത്തക്കാരാക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിലെ ἀνθρώπων എന്ന പദം ഇവിടെ പ്രായപൂർത്തിയായ പുരുഷന്മാരെ മാത്രം അല്ല, മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: പറയുന്നു
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാലത്തിലുള്ള ചരിത്രവർത്തമാനം നിലനിർത്തുന്നു; സുവിശേഷവിവരണത്തിൽ ഇത് സ്വാഭാവികമായി വായിക്കാം.
- source_word: Δεῦτε
  choice: വരൂ
  rationale: ആഹ്വാനരൂപത്തിലുള്ള ‘വരുക’ എന്ന അടിസ്ഥാനാർഥം നൽകുന്നു; തുടർന്ന് വരുന്ന ὀπίσω μου-യുടെ അർഥം ഇതിൽ ലയിപ്പിക്കുന്നില്ല.
- source_word: ὀπίσω μου
  choice: എന്റെ പിന്നാലെ
  rationale: ‘എന്റെ പിന്നിൽ/പിന്നാലെ’ എന്ന ശിഷ്യത്വരൂപകം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: ποιήσω
  choice: ആക്കും
  rationale: യേശു വരുത്താനിരിക്കുന്ന മാറ്റത്തെ സൂചിപ്പിക്കുന്ന ഭാവികാല വാഗ്ദാനം നേരിട്ട് അവതരിപ്പിക്കുന്നു.
- source_word: ἁλιεῖς
  choice: മീൻപിടിത്തക്കാർ
  rationale: മീൻപിടിക്കുന്നവരെ സൂചിപ്പിക്കുന്ന രൂപകം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἀνθρώπων
  choice: മനുഷ്യരെ
  rationale: ഇവിടെ പദം പുരുഷന്മാരെ മാത്രം അല്ല, മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘മനുഷ്യരെ’ ഈ പൊതുവായ അർഥം കൃത്യമായി നൽകുന്നു; ‘പിടിക്കുന്ന’ എന്ന ക്രിയ ചേർക്കുന്നത് ഗ്രീക്ക് ജനിറ്റീവ് ബന്ധത്തെ സ്വാഭാവിക മലയാളമാക്കുന്നു.
theological_decisions:
- issue: ἁλιεῖς ἀνθρώπων എന്ന രൂപകത്തിന്റെ അർഥവും ലിംഗപരമായ വ്യാപ്തിയും
  choice: മനുഷ്യരെ പിടിക്കുന്ന മീൻപിടിത്തക്കാർ
  alternative: മനുഷ്യരുടെ മീൻപിടിത്തക്കാർ
  rationale: രൂപകത്തിലെ മീൻപിടിത്തഭാവം നിലനിർത്തിക്കൊണ്ട്, ἀνθρώπων മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നുവെന്നത് മലയാളത്തിൽ വ്യക്തമാക്കുന്നു. കൂടുതൽ പദാനുപദമായ ബദൽ മലയാളത്തിൽ അസ്വാഭാവികവും അർഥത്തിൽ അവ്യക്തവുമാണ്.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ‘എന്റെ പിന്നാലെ വരൂ’ എന്നത് ഗ്രീക്കിലെ രണ്ട് ഘടകങ്ങളെയും നിലനിർത്തുന്നു; ‘മനുഷ്യരെ പിടിക്കുന്ന മീൻപിടിത്തക്കാർ’ എന്നത് മൂലരൂപകത്തെ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
