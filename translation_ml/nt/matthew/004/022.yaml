id: MAT.4.22
reference: Matthew 4:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ εὐθέως ἀφέντες τὸ πλοῖον καὶ τὸν πατέρα αὐτῶν ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/022.yaml
  text: And they immediately left the boat and their father and followed him[a].
translation:
  language: ml
  text: അവർ ഉടൻതന്നെ[a] പടകും തങ്ങളുടെ അപ്പനെയും വിട്ട് അവനെ അനുഗമിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തൽക്ഷണം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: അവർ
  rationale: οἱ മുൻവാക്യത്തിൽ പറഞ്ഞ സഹോദരന്മാരെ സൂചിപ്പിക്കുന്ന നാമവാചകപ്രയോഗമാണ്. δέ ഇവിടെ കഥ മുന്നോട്ടുകൊണ്ടുപോകുന്ന മൃദുവായ ബന്ധകമായതിനാൽ, മലയാളത്തിൽ കൃത്രിമമായൊരു ബന്ധപദം ചേർക്കാതെ സ്വാഭാവികമായി വാക്യം തുടരുന്നു.
- source_word: εὐθέως
  choice: ഉടൻതന്നെ
  rationale: പ്രതികരണത്തിന്റെ കാലതാമസമില്ലായ്മയും മത്തായിയുടെ വിവരണത്തിലെ ഊന്നലും വ്യക്തമായി നിലനിർത്തുന്ന സ്വാഭാവികമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: ἀφέντες
  choice: വിട്ട്
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന പങ്കാളിക്രിയയെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു. ‘ഉപേക്ഷിച്ച്’ എന്നതിനെക്കാൾ വ്യാഖ്യാനഭാരം കുറവാണ്.
- source_word: τὸ πλοῖον
  choice: പടക്
  rationale: ഗലീലക്കടലിലെ മീൻപിടിത്തസന്ദർഭത്തിന് യോജിക്കുന്ന സാധാരണ ജലയാനത്തെ സൂചിപ്പിക്കുന്നു; വലിയ ‘കപ്പൽ’ എന്ന ധാരണ ഒഴിവാക്കുന്നു.
- source_word: τὸν πατέρα αὐτῶν
  choice: തങ്ങളുടെ അപ്പനെ
  rationale: കർത്താക്കളോടുള്ള പ്രത്യാവർത്തകബന്ധം ‘തങ്ങളുടെ’ എന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ‘അപ്പൻ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ഇന്നത്തെ ഭാഷയിൽ സ്വാഭാവികവുമാണ്.
- source_word: ἠκολούθησαν αὐτῷ
  choice: അവനെ അനുഗമിച്ചു
  rationale: ശാരീരികമായി പിന്നാലെ പോകുന്നതും ശിഷ്യത്വപരമായ അനുഗമനവും ഉൾക്കൊള്ളാൻ കഴിയുന്ന സുവിശേഷസന്ദർഭത്തിലെ പതിവായ അർഥം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ശിഷ്യത്വപ്രതികരണവും കുടുംബത്തിൽനിന്നുള്ള വേർപാടും
  choice: പടകും അപ്പനെയും ഉടൻ വിട്ട് യേശുവിനെ അനുഗമിച്ച നിർണായക പ്രതികരണമായി നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: അവർ അപ്പനെ എന്നേക്കുമായി ഉപേക്ഷിച്ചു; അല്ലെങ്കിൽ അവർ താൽക്കാലികമായി മാത്രം മാറിനിന്നു.
  rationale: വാക്യം പ്രതികരണത്തിന്റെ അടിയന്തരതയും നിർണായകതയും ഊന്നുന്നു. എന്നാൽ ἀφέντες എന്ന പദം വേർപാട് സ്ഥിരമായിരുന്നോ താൽക്കാലികമായിരുന്നോ എന്ന് സ്വതവേ നിർണയിക്കുന്നില്ല; അതിനാൽ ‘ഉപേക്ഷിച്ചു’ പോലുള്ള കൂടുതൽ ശക്തമായ വ്യാഖ്യാനം ഒഴിവാക്കി ‘വിട്ട്’ എന്ന് നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ പങ്കാളിക്രിയാസംബന്ധം മലയാളത്തിലെ ‘വിട്ട് ... അനുഗമിച്ചു’ എന്ന സ്വാഭാവിക ക്രമത്തിൽ നിലനിർത്തി; അനാവശ്യമായ സഭാപാരമ്പര്യ പദങ്ങൾ ഒഴിവാക്കി.
