id: MAT.4.21
reference: Matthew 4:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ προβὰς ἐκεῖθεν εἶδεν ἄλλους δύο ἀδελφούς, Ἰάκωβον τὸν τοῦ Ζεβεδαίου καὶ Ἰωάννην τὸν ἀδελφὸν αὐτοῦ, ἐν τῷ πλοίῳ μετὰ Ζεβεδαίου τοῦ πατρὸς αὐτῶν καταρτίζοντας τὰ δίκτυα αὐτῶν, καὶ ἐκάλεσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/021.yaml
  text: And going on from there, he saw two other brothers, James the son of Zebedee and John his brother, in the boat with Zebedee their father, mending their nets, and he called them.
translation:
  language: ml
  text: അവിടെനിന്ന് മുന്നോട്ടുപോയി, വേറെ രണ്ടു സഹോദരന്മാരെ—സെബെദിയുടെ മകൻ യാക്കോബിനെയും അവന്റെ സഹോദരൻ യോഹന്നാനെയും—അവൻ കണ്ടു. അവർ അവരുടെ അപ്പനായ സെബെദിയോടൊപ്പം വള്ളത്തിലിരുന്നു തങ്ങളുടെ വലകൾ നന്നാക്കുകയായിരുന്നു. അവൻ അവരെ വിളിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προβὰς ἐκεῖθεν
  choice: അവിടെനിന്ന് കുറച്ചുകൂടി മുന്നോട്ടു ചെന്നപ്പോൾ
  rationale: προβαίνω മുമ്പത്തെ സ്ഥലത്തുനിന്ന് തുടർന്നു മുന്നോട്ടു നീങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്നു; ἐκεῖθεν പുറപ്പെടുന്ന സ്ഥലം വ്യക്തമാക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ കാലബന്ധത്തോടെ രണ്ടും ചേർത്തു.
- source_word: εἶδεν
  choice: അവൻ കണ്ടു
  rationale: ὁράωയുടെ ലളിതമായ ആഖ്യാനപ്രയോഗം; ‘ശ്രദ്ധിച്ചു’ എന്ന അധിക ഭാവം ചേർക്കുന്നില്ല.
- source_word: ἄλλους δύο ἀδελφούς
  choice: വേറെ രണ്ടു സഹോദരന്മാരെ
  rationale: ἄλλους മുമ്പ് പറഞ്ഞ സഹോദരജോടിക്കു പുറമേയുള്ള മറ്റൊരു ജോടിയാണെന്ന് സൂചിപ്പിക്കുന്നു.
- source_word: Ἰάκωβον τὸν τοῦ Ζεβεδαίου
  choice: സെബെദിയുടെ മകൻ യാക്കോബിനെ
  rationale: ഗ്രീക്കിലെ പിതൃബന്ധസൂചകമായ ജനിറ്റീവ് മലയാളത്തിൽ വ്യക്തമായി ‘മകൻ’ എന്നു പ്രകടമാക്കുന്നു.
- source_word: Ἰωάννην τὸν ἀδελφὸν αὐτοῦ
  choice: അവന്റെ സഹോദരൻ യോഹന്നാനെ
  rationale: αὐτοῦ ഇവിടെ യാക്കോബിനെ സൂചിപ്പിക്കുന്നു; ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐν τῷ πλοίῳ
  choice: വള്ളത്തിൽ
  rationale: ഗലീലക്കടലിലെ മത്സ്യബന്ധനസന്ദർഭത്തിൽ πλοῖον വലിയ കപ്പലല്ല, മത്സ്യബന്ധനവള്ളമാണ്.
- source_word: μετὰ Ζεβεδαίου τοῦ πατρὸς αὐτῶν
  choice: തങ്ങളുടെ അപ്പനായ സെബെദിയോടൊപ്പം
  rationale: μετάയുടെ സഹവാസാർത്ഥവും സെബെദി ഇരുവരുടെയും പിതാവാണെന്ന വിവരവും വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: καταρτίζοντας τὰ δίκτυα αὐτῶν
  choice: തങ്ങളുടെ വലകൾ നന്നാക്കുകയായിരുന്നു
  rationale: മത്സ്യബന്ധനസന്ദർഭത്തിൽ καταρτίζω വലകൾ ഉപയോഗയോഗ്യമാക്കുകയോ കേടുതീർക്കുകയോ ചെയ്യുന്നതാണ്; ‘നന്നാക്കുക’ ഈ അർത്ഥവ്യാപ്തി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐκάλεσεν αὐτούς
  choice: അവൻ അവരെ വിളിച്ചു
  rationale: καλέωയുടെ ലളിതരൂപം സംരക്ഷിക്കുന്നു; ഈ വാക്യത്തിൽ ഇല്ലാത്ത ‘തന്നെ അനുഗമിക്കാൻ’ എന്ന വിശദീകരണം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ἐκάλεσεν എന്നതിലെ ശിഷ്യത്വവിളിയുടെ സൂചന
  choice: ‘അവൻ അവരെ വിളിച്ചു’ എന്ന ലളിതമായ രൂപം നിലനിർത്തി.
  alternative: ‘തന്നെ അനുഗമിക്കാൻ അവൻ അവരെ വിളിച്ചു.’
  rationale: സമീപസന്ദർഭം ഇത് ശിഷ്യത്വത്തിലേക്കുള്ള വിളിയാണെന്ന് വ്യക്തമാക്കുന്നുവെങ്കിലും ഈ വാക്യം ലക്ഷ്യം പ്രത്യേകം പറയുന്നില്ല. അതിനാൽ സന്ദർഭസൂചന നിലനിൽക്കട്ടെ; മൂലപാഠത്തിലില്ലാത്ത വാക്കുകൾ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. നീണ്ട ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി രണ്ടു മലയാളവാക്യങ്ങളാക്കി; ആശയക്രമവും ബന്ധങ്ങളും സംരക്ഷിച്ചു. ‘അപ്പൻ’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും മാന്യവുമായ ബന്ധപദമായി ഉപയോഗിച്ചു.
