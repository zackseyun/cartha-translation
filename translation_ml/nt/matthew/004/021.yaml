- from: അവിടെനിന്ന് കുറച്ചുകൂടി മുന്നോട്ടു ചെന്നപ്പോൾ, വേറെ രണ്ടു സഹോദരന്മാരെ—സെബെദിയുടെ മകൻ യാക്കോബിനെയും അവന്റെ സഹോദരൻ യോഹന്നാനെയും—അവൻ കണ്ടു. അവർ തങ്ങളുടെ അപ്പനായ സെബെദിയോടൊപ്പം വള്ളത്തിലിരുന്ന് വലകൾ നന്നാക്കുകയായിരുന്നു. അവൻ അവരെ വിളിച്ചു.
  to: അവിടെനിന്ന് മുന്നോട്ടുപോയി, വേറെ രണ്ടു സഹോദരന്മാരെ—സെബെദിയുടെ മകൻ യാക്കോബിനെയും അവന്റെ സഹോദരൻ യോഹന്നാനെയും—അവൻ കണ്ടു. അവർ അവരുടെ അപ്പനായ സെബെദിയോടൊപ്പം വള്ളത്തിലിരുന്നു തങ്ങളുടെ വലകൾ നന്നാക്കുകയായിരുന്നു. അവൻ അവരെ വിളിച്ചു.
