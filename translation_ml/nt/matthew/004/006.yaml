  to: 'അവൻ അവനോടു പറഞ്ഞു: “നീ ദൈവപുത്രനാണെങ്കിൽ, നിന്നെത്തന്നെ താഴേക്കു എറിയുക.[a] കാരണം, ഇങ്ങനെ എഴുതപ്പെട്ടിരിക്കുന്നു: ‘നിന്നെക്കുറിച്ച് അവൻ തന്റെ ദൂതന്മാരോടു കൽപ്പിക്കും; നിന്റെ കാൽ കല്ലിൽ തട്ടാതിരിക്കാൻ അവർ നിന്നെ തങ്ങളുടെ കൈകളിൽ താങ്ങിയെടുക്കും.[b]’”'
