id: MAT.4.6
reference: Matthew 4:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Εἰ υἱὸς εἶ τοῦ θεοῦ, βάλε σεαυτὸν κάτω· γέγραπται γὰρ ὅτι Τοῖς ἀγγέλοις αὐτοῦ ἐντελεῖται περὶ σοῦ καὶ ἐπὶ χειρῶν ἀροῦσίν σε, μήποτε προσκόψῃς πρὸς λίθον τὸν πόδα σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/006.yaml
  text: 'And he said to him[a], “If you are the Son of God, throw yourself down, for it is written: ‘He will command his angels concerning you,’ and ‘On their hands they will lift you up[b], lest you strike your foot against a stone.’”'
translation:
  language: ml
  text: 'അവൻ അവനോടു പറഞ്ഞു: “നീ ദൈവപുത്രനാണെങ്കിൽ, നിന്നെത്തന്നെ താഴേക്കു എറിയുക.[a] കാരണം, ഇങ്ങനെ എഴുതപ്പെട്ടിരിക്കുന്നു: ‘നിന്നെക്കുറിച്ച് അവൻ തന്റെ ദൂതന്മാരോടു കൽപ്പിക്കും; നിന്റെ കാൽ കല്ലിൽ തട്ടാതിരിക്കാൻ അവർ നിന്നെ തങ്ങളുടെ കൈകളിൽ താങ്ങിയെടുക്കും.[b]’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, പരമ്പരാഗതമായി: “നിന്നെത്തന്നെ താഴേക്കു എറിഞ്ഞുകളയുക.”'
    reason: lexical_alternative
  - marker: b
    text: 'അല്ലെങ്കിൽ: “അവർ നിന്നെ തങ്ങളുടെ കൈകളിൽ വഹിക്കും.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: പറഞ്ഞു
  rationale: വിവരണത്തിലെ ഗ്രീക്ക് വർത്തമാനകാലം ചരിത്രവർത്തമാനമായി പ്രവർത്തിക്കുന്നു; സ്വാഭാവികമായ മലയാള ആഖ്യാനത്തിന് ഭൂതകാലം യോജിക്കുന്നു.
- source_word: Εἰ
  choice: ആണെങ്കിൽ
  rationale: പ്രലോഭകന്റെ വെല്ലുവിളിയുടെ സോപാധികസ്വഭാവം നിലനിർത്തുന്നു; ‘ആയതിനാൽ’ എന്ന ഉറപ്പിക്കൽ ചേർക്കുന്നില്ല.
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: ദൈവപുത്രൻ
  rationale: മത്തായിയുടെ സന്ദർഭത്തിൽ ഇത് പൊതുവായ ഒരു വിഭാഗമല്ല, ക്രിസ്തുവിനെ സൂചിപ്പിക്കുന്ന സ്ഥാനനാമമായി പ്രവർത്തിക്കുന്നു.
- source_word: βάλε σεαυτὸν κάτω
  choice: നിന്നെത്തന്നെ താഴേക്കു ചാടിക്കൂ
  rationale: ആജ്ഞയുടെ ശക്തിയും സ്വയം താഴേക്കെറിയുന്ന പ്രവൃത്തിയും സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: γέγραπται
  choice: എഴുതപ്പെട്ടിരിക്കുന്നു
  rationale: തിരുവെഴുത്ത് ഉദ്ധരണിക്കുള്ള പൂർണ്ണ നിഷ്ക്രിയരൂപത്തിന്റെ നിലനിൽക്കുന്ന പ്രാബല്യം സൂചിപ്പിക്കുന്ന പതിവ് പ്രയോഗം.
- source_word: ἐντελεῖται
  choice: കല്പിക്കും
  rationale: ദൂതന്മാർക്കു നൽകുന്ന അധികാരപൂർവമായ നിർദേശം സംക്ഷിപ്തമായും കൃത്യമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: περὶ σοῦ
  choice: നിന്നെക്കുറിച്ച്
  rationale: περί + genitive എന്ന ഘടനയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു.
- source_word: ἐπὶ χειρῶν
  choice: തങ്ങളുടെ കൈകളിൽ
  rationale: മലയാളത്തിൽ താങ്ങിവഹിക്കുന്ന ദൃശ്യം സ്വാഭാവികമായി നൽകുന്നു; ഗ്രീക്കിലെ കൈകളിന്മേൽ എന്ന ചിത്രാർഥം നഷ്ടപ്പെടുത്തുന്നില്ല.
- source_word: ἀροῦσίν σε
  choice: നിന്നെ ... താങ്ങിയെടുക്കും
  rationale: αἴρω എന്നതിലെ ഉയർത്തുക/വഹിക്കുക എന്നീ അർഥഘടകങ്ങളെ സംയോജിപ്പിച്ച് സംരക്ഷണത്തിന്റെ ചിത്രം നിലനിർത്തുന്നു.
- source_word: μήποτε προσκόψῃς πρὸς λίθον τὸν πόδα σου
  choice: നിന്റെ കാൽ കല്ലിൽ തട്ടാതിരിക്കാൻ
  rationale: പ്രതിരോധാർഥമുള്ള μήποτεയും കാൽ കല്ലിൽ ഇടിക്കുന്ന പ്രത്യേക ചിത്രവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: പ്രലോഭകന്റെ വെല്ലുവിളിയിലെ ‘ദൈവപുത്രൻ’ എന്ന പ്രയോഗത്തിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ ശക്തി
  choice: സ്ഥാനനാമസ്വഭാവത്തോടെ ‘ദൈവപുത്രൻ’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: പൊതുവായ അർഥത്തിൽ ‘ദൈവത്തിന്റെ ഒരു പുത്രൻ’
  rationale: മത്തായിയുടെ ആഖ്യാനസന്ദർഭത്തിൽ ഈ പ്രയോഗം യേശുവിന്റെ തിരിച്ചറിയലിനെ ലക്ഷ്യമിടുന്ന അംഗീകൃത സ്ഥാനനാമമാണ്; പാഠത്തിനപ്പുറമുള്ള സിദ്ധാന്തവിവരണം ചേർത്തിട്ടില്ല.
- issue: പിശാച് സങ്കീർത്തനം ഉദ്ധരിക്കുന്നത്
  choice: ഉദ്ധരിക്കപ്പെട്ട തിരുവെഴുത്ത് വിശദീകരണമോ തിരുത്തലോ കൂടാതെ അവന്റെ വാക്കുകളായി നിലനിർത്തി
  alternative: പ്രധാനപാഠത്തിൽ വ്യാഖ്യാനപരമായ മുന്നറിയിപ്പ് ചേർക്കുക
  rationale: പിശാചിന്റെ തിരുവെഴുത്തുപയോഗത്തെക്കുറിച്ചുള്ള വിലയിരുത്തൽ പരിഭാഷയിൽ ചേർക്കാതെ, ആഖ്യാനത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. തിരുവെഴുത്ത് ഉദ്ധരണിയുടെ ഔപചാരികതയ്ക്കായി ‘എഴുതപ്പെട്ടിരിക്കുന്നു’, ‘കല്പിക്കും’ എന്നിവ നിലനിർത്തി; ദൈനംദിന വായനാസൗകര്യത്തിനായി ‘ചാടിക്കൂ’, ‘താങ്ങിയെടുക്കും’ എന്നിവ ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
