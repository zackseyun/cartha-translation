id: MAT.4.11
reference: Matthew 4:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τότε ἀφίησιν αὐτὸν ὁ διάβολος, καὶ ἰδοὺ ἄγγελοι προσῆλθον καὶ διηκόνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/011.yaml
  text: Then the devil left him[a], and behold, angels came and were ministering to him.
translation:
  language: ml
  text: അപ്പോൾ പിശാച് അവനെ വിട്ടുപോയി. ഇതാ, ദൂതന്മാർ അടുത്തുവന്ന് അവനെ ശുശ്രൂഷിച്ചുകൊണ്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവനെ സേവിച്ചുകൊണ്ടിരുന്നു.” ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘സേവിക്കുക’ എന്നും ‘ശുശ്രൂഷിക്കുക’ എന്നും പരിഭാഷ നൽകാം; അതിന്റെ അപൂർണഭൂതകാലരൂപം പ്രവൃത്തി തുടർന്നുകൊണ്ടിരുന്നതായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: അപ്പോൾ
  rationale: സംഭവങ്ങളുടെ ക്രമം സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ ആഖ്യാനബന്ധകമാണ്.
- source_word: ἀφίησιν
  choice: വിട്ടുപോയി
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനത്തെ മലയാളത്തിലെ സ്വാഭാവികമായ ഭൂതകാല ആഖ്യാനരീതിയിൽ അവതരിപ്പിക്കുന്നു; ഇവിടെ പിശാച് യേശുവിൽനിന്ന് അകന്നുപോകുന്നതാണ് അർഥം.
- source_word: ὁ διάβολος
  choice: പിശാച്
  rationale: പരീക്ഷണവിവരണത്തിൽ സാത്താനെ സൂചിപ്പിക്കുന്ന വ്യക്തിപരമായ സ്ഥാനനാമമായി ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ, ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്ഥാപിതവുമായ പദം തിരഞ്ഞെടുത്തു.
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: പെട്ടെന്നുള്ള സംഭവത്തിലേക്ക് വായനക്കാരന്റെ ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗ്രീക്ക് വ്യവഹാരസൂചകത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: ἄγγελοι
  choice: ദൂതന്മാർ
  rationale: സന്ദർഭം സ്വർഗീയ ദൂതന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാള ബൈബിൾ ഭാഷയിലും സാധാരണ ഉപയോഗത്തിലും സ്വാഭാവികമാണ്.
- source_word: προσῆλθον
  choice: അടുത്തുവന്ന്
  rationale: വെറും വരവ് മാത്രമല്ല, യേശുവിന്റെ അടുക്കലേക്കുള്ള സമീപനവും ക്രിയ വ്യക്തമാക്കുന്നു.
- source_word: διηκόνουν
  choice: ശുശ്രൂഷിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലത്തിന്റെ തുടർച്ചയായ പ്രവൃത്തിയെ ‘കൊണ്ടിരുന്നു’ എന്ന രൂപം വ്യക്തമാക്കുന്നു; സേവിക്കുക, പരിചരിക്കുക എന്നീ അർഥവ്യാപ്തിയും ‘ശുശ്രൂഷിക്കുക’ നിലനിർത്തുന്നു.
- source_word: αὐτῷ
  choice: അവനെ
  rationale: ദൂതന്മാരുടെ ശുശ്രൂഷയുടെ സ്വീകർത്താവായ യേശുവിനെ മലയാളത്തിൽ സ്വാഭാവികമായ കർമരൂപത്തിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: διάβολος എന്ന പദത്തിന്റെ വ്യക്തിപരമായ സൂചന
  choice: പിശാച്
  alternative: അപവാദി
  rationale: പദത്തിന് ‘അപവാദി’ എന്ന വ്യുത്പത്തിപരമായ അർഥമുണ്ടെങ്കിലും, ഈ പരീക്ഷണവിവരണത്തിൽ അത് സാത്താന്റെ വ്യക്തിപരമായ സ്ഥാനനാമമാണ്; ‘പിശാച്’ സന്ദർഭത്തിലെ സൂചന വ്യക്തമാക്കുന്നു, അധികമായ സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: ദൂതന്മാരുടെ διηκόνουν എന്ന പ്രവൃത്തിയുടെ സ്വഭാവം
  choice: ശുശ്രൂഷിച്ചുകൊണ്ടിരുന്നു
  alternative: സേവിച്ചുകൊണ്ടിരുന്നു
  rationale: ക്രിയയ്ക്ക് സേവിക്കുക, പരിചരിക്കുക, ശുശ്രൂഷിക്കുക എന്നീ അർഥങ്ങൾ സാധ്യമാണ്. പ്രധാനപാഠം തുടർച്ചയായ പ്രവർത്തനവും ഗൗരവമുള്ള ആഖ്യാനശൈലിയും നിലനിർത്തുന്നു; പാദക്കുറിപ്പ് സാധുവായ മറ്റൊരു പരിഭാഷ നൽകുന്നു.
translation_notes:
  register: ആധുനികവും സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളം. ‘ഇതാ’ മൂലപാഠത്തിലെ ശ്രദ്ധാകർഷകമായ ആഖ്യാനഭാവം നിലനിർത്തുന്നു; ‘ശുശ്രൂഷിച്ചുകൊണ്ടിരുന്നു’ ക്രിയയുടെ തുടർച്ച വ്യക്തമാക്കുന്നു.
