  to: അവൻ നസറാ[a] വിട്ട് വന്ന്, സെബൂലൂന്റെയും നഫ്താലിയുടെയും പ്രദേശത്തുള്ള കടലിനരികെയുള്ള കഫർന്നഹൂമിൽ താമസമാക്കി.
