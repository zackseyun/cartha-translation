  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന, എന്നാൽ വേദപാഠത്തിന് യോജിച്ച മാന്യമായ മലയാളം. ഗ്രീക്ക് വാക്യത്തിലെ സംഭവക്രമവും സ്ഥലവിവരണവും സ്വാഭാവിക മലയാള വാക്യഘടനയിൽ നിലനിർത്തിയിരിക്കുന്നു.
