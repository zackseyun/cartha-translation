id: MAT.4.13
reference: Matthew 4:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ καταλιπὼν τὴν Ναζαρὰ ἐλθὼν κατῴκησεν εἰς Καφαρναοὺμ τὴν παραθαλασσίαν ἐν ὁρίοις Ζαβουλὼν καὶ Νεφθαλίμ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/013.yaml
  text: And leaving Nazara[a], he came and settled in Capernaum by the sea, in the region of Zebulun and Naphtali.
translation:
  language: ml
  text: അവൻ നസറാ[a] വിട്ട് വന്ന്, സെബൂലൂന്റെയും നഫ്താലിയുടെയും പ്രദേശത്തുള്ള കടലിനരികെയുള്ള കഫർന്നഹൂമിൽ താമസമാക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഗ്രീക്ക്: ‘നസറാ’; പല വിവർത്തനങ്ങളിലും ‘നസറെത്ത്’ എന്നാണ്.'
    reason: alternative_reading
lexical_decisions:
- source_word: καταλιπὼν
  choice: വിട്ട്
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള പുറപ്പെടലിനെ സൂചിപ്പിക്കുന്ന aorist participle സ്വാഭാവികമായ മലയാളത്തിൽ സംക്ഷിപ്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: Ναζαρὰ
  choice: നസറാ
  rationale: ഈ വാക്യത്തിലെ ഗ്രീക്ക് രൂപമായ Ναζαράയെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; പരിചിതമായ ‘നസറെത്ത്’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἐλθὼν
  choice: വന്ന്
  rationale: തുടർന്നുള്ള സംഭവക്രമം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുകയും participial ബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: κατῴκησεν
  choice: താമസമാക്കി
  rationale: വെറുതെ താമസിച്ചു എന്നതിലുപരി അവിടെ പാർപ്പുറപ്പിച്ചതിന്റെ ആശയം വ്യക്തമാക്കുന്നു.
- source_word: Καφαρναοὺμ
  choice: കഫർന്നഹൂം
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതവും ഗ്രീക്ക് സ്ഥലനാമത്തെ യോജിച്ചും പ്രതിനിധീകരിക്കുന്ന രൂപം.
- source_word: τὴν παραθαλασσίαν
  choice: കടലിനരികെയുള്ള
  rationale: കഫർന്നഹൂമിന്റെ കടലോര സ്ഥാനം വിശേഷണരൂപത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἐν ὁρίοις
  choice: പ്രദേശത്ത്
  rationale: ὅρια എന്നതിന്റെ അതിർത്തി, ഭൂപ്രദേശം എന്നീ അർത്ഥസാധ്യതകളിൽ സന്ദർഭത്തിന് യോജിച്ച ഭൂമേഖലാസൂചന നൽകുന്നു.
- source_word: Ζαβουλὼν
  choice: സെബൂലൂൻ
  rationale: ഗോത്രത്തിന്റെയും ഭൂപ്രദേശത്തിന്റെയും പേരായി മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന രൂപം.
- source_word: Νεφθαλίμ
  choice: നഫ്താലി
  rationale: ഗോത്രത്തിന്റെയും ഭൂപ്രദേശത്തിന്റെയും പേരായി മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന രൂപം.
