id: MAT.4.9
reference: Matthew 4:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸀εἶπεν αὐτῷ· Ταῦτά ⸂σοι πάντα⸃ δώσω, ἐὰν πεσὼν προσκυνήσῃς μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/009.yaml
  text: And he said to him[a], “I will give you all these things, if you fall down and worship me.”
translation:
  language: ml
  text: 'അവൻ അവനോട് പറഞ്ഞു: “നീ നിലത്തു വീണ് എന്നെ ആരാധിച്ചാൽ[a], ഇവയെല്ലാം ഞാൻ നിനക്കു തരാം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “എന്റെ മുമ്പിൽ കുമ്പിട്ടാൽ” എന്നോ “എനിക്ക് പ്രണാമം അർപ്പിച്ചാൽ” എന്നോ പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് ക്രിയയ്ക്ക് കുമ്പിടുകയോ പ്രണാമം അർപ്പിക്കുകയോ എന്ന അർഥവും വരാം; എന്നാൽ ഇവിടെ സന്ദർഭം “ആരാധിച്ചാൽ” എന്ന പരിഭാഷയെ കൂടുതൽ പിന്തുണയ്ക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: അവൻ ... പറഞ്ഞു
  rationale: മലയാളത്തിലെ സ്വാഭാവികമായ ആഖ്യാനത്തുടർച്ചയിൽ വാക്യാരംഭത്തിലെ καὶ പ്രത്യേകം ‘പിന്നെ’ എന്നു പരിഭാഷപ്പെടുത്താതെ വിടാം; അങ്ങനെ ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത കാലസൂചന ചേർക്കുന്നത് ഒഴിവാകുന്നു.
- source_word: εἶπεν αὐτῷ
  choice: അവൻ അവനോട് പറഞ്ഞു
  rationale: മൂലപാഠത്തിലുള്ള സർവനാമങ്ങൾ നിലനിർത്തുന്നു; ഈ ഉപവാക്യത്തിൽ ഇല്ലാത്ത പേരുകൾ ചേർക്കുന്നില്ല.
- source_word: Ταῦτά ... πάντα
  choice: ഇവയെല്ലാം
  rationale: നപുംസകലിംഗ ബഹുവചനമായ demonstrative-ഉം സമഗ്രത സൂചിപ്പിക്കുന്ന πάντα-യും ചുരുക്കവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: σοι ... δώσω
  choice: ഞാൻ നിനക്കു തരാം
  rationale: ഭാവികാല വാഗ്ദാനം അഥവാ വാഗ്ദാനരൂപത്തിലുള്ള വാഗ്ദാനം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἐὰν
  choice: എങ്കിൽ / -ആൽ
  rationale: നിബന്ധനയെ മലയാളത്തിലെ സോപാധിക ക്രിയാരൂപമായ ‘ആരാധിച്ചാൽ’കൊണ്ട് വ്യക്തമാക്കുന്നു.
- source_word: πεσὼν
  choice: നിലത്തു വീണ്
  rationale: ആരാധനയ്ക്കു മുമ്പുള്ള ശരീരചലനത്തിന്റെ ദൃശ്യരൂപം നിലനിർത്തുന്നു; ‘സാഷ്ടാംഗം’ എന്നു പറഞ്ഞ് പൂർണ പ്രണാമത്തിന്റെ രീതി അധികമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: προσκυνήσῃς μοι
  choice: എന്നെ ആരാധിച്ചാൽ
  rationale: തുടർന്നുള്ള വാക്യത്തിൽ ദൈവത്തിനു മാത്രമുള്ള ആരാധനയെക്കുറിച്ചുള്ള മറുപടി വരുന്നതിനാൽ ഇവിടെ മതപരമായ ഗൗരവമുള്ള ‘ആരാധിക്കുക’ ഏറ്റവും യോജിക്കുന്നു; പദത്തിന്റെ വിശാലമായ അർഥപരിധി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: സാത്താൻ യേശുവിനോട് ആവശ്യപ്പെടുന്ന προσκυνέω എന്ന ക്രിയയുടെ അർഥം
  choice: എന്നെ ആരാധിച്ചാൽ
  alternative: എന്റെ മുമ്പിൽ കുമ്പിട്ടാൽ / എനിക്ക് പ്രണാമം അർപ്പിച്ചാൽ
  rationale: പ്രലോഭനത്തിന്റെ പശ്ചാത്തലവും അടുത്ത വാക്യത്തിൽ ദൈവത്തിനു മാത്രം ആരാധന അർപ്പിക്കണമെന്നുള്ള മറുപടിയും കണക്കിലെടുക്കുമ്പോൾ ‘ആരാധിക്കുക’ സന്ദർഭത്തിന്റെ മതപരമായ ഗൗരവം വ്യക്തമാക്കുന്നു. അതേസമയം, ഗ്രീക്ക് ക്രിയയ്ക്ക് കുമ്പിടുക, പ്രണാമം അർപ്പിക്കുക എന്നീ അർഥങ്ങളും വരാമെന്നത് അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. സർവനാമങ്ങൾ മൂലപാഠത്തിനനുസരിച്ച് നിലനിർത്തിയിരിക്കുന്നു; ദൃശ്യമായ ശരീരചലനവും ആരാധനയുടെ മതപരമായ ഭാവവും വേർതിരിച്ച് വ്യക്തമാക്കിയിരിക്കുന്നു.
