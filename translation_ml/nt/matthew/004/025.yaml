id: MAT.4.25
reference: Matthew 4:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἠκολούθησαν αὐτῷ ὄχλοι πολλοὶ ἀπὸ τῆς Γαλιλαίας καὶ Δεκαπόλεως καὶ Ἱεροσολύμων καὶ Ἰουδαίας καὶ πέραν τοῦ Ἰορδάνου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/025.yaml
  text: And large crowds followed him from Galilee and the Decapolis and Jerusalem and Judea and beyond the Jordan[a].
translation:
  language: ml
  text: ഗലീലയിൽനിന്നും ദെക്കപ്പൊലിയിൽനിന്നും യെരൂശലേമിൽനിന്നും യെഹൂദ്യയിൽനിന്നും യോർദ്ദാന്നദിക്കപ്പുറത്തുനിന്നും[a] വലിയ ജനക്കൂട്ടങ്ങൾ അവനെ അനുഗമിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യോർദ്ദാന്റെ മറുകരയിൽനിന്നും.”
    reason: πέραν τοῦ Ἰορδάνου എന്ന പ്രയോഗത്തിന് ‘യോർദ്ദാന്നദിക്കപ്പുറം’ എന്നതോടൊപ്പമുള്ള സ്വാഭാവിക സ്ഥലസംബന്ധമായ ബദൽ പരിഭാഷ നൽകുന്നു.
lexical_decisions:
- source_word: ἠκολούθησαν
  choice: അനുഗമിച്ചു
  rationale: ആഖ്യാനസന്ദർഭത്തിൽ ശാരീരികമായി പിന്നാലെ ചെന്നത് സ്വാഭാവികമായി അറിയിക്കുന്നു; അതേസമയം പൂർണ ശിഷ്യത്വപ്രതിബദ്ധത അനാവശ്യമായി ഉറപ്പിക്കുന്നില്ല.
- source_word: ὄχλοι πολλοὶ
  choice: വലിയ ജനക്കൂട്ടങ്ങൾ
  rationale: നിരവധിയും വലുപ്പമേറിയതുമായ ജനസമൂഹങ്ങളെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἀπὸ
  choice: -യിൽനിന്നും
  rationale: ജനക്കൂട്ടങ്ങൾ വന്ന ഉറവിടപ്രദേശങ്ങളെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പൂർവപ്രത്യയത്തിന്റെ അർഥം ഓരോ സ്ഥലനാമത്തോടും വ്യക്തമായി ചേർക്കുന്നു.
- source_word: Γαλιλαίας
  choice: ഗലീല
  rationale: പ്രദേശനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം.
- source_word: Δεκαπόλεως
  choice: ദെക്കപ്പൊലി
  rationale: പത്തു നഗരങ്ങളുടെ പ്രദേശത്തെ സൂചിപ്പിക്കുന്ന സ്ഥലനാമത്തിന്റെ മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ തിരിച്ചറിയാവുന്ന ലിപ്യന്തരണം.
- source_word: Ἱεροσολύμων
  choice: യെരൂശലേം
  rationale: നഗരനാമത്തിന്റെ മലയാളത്തിൽ സുപരിചിതമായ രൂപം; ഗ്രീക്കിലെ രൂപപരമായ ബഹുവചനം മലയാളത്തിലേക്ക് കൊണ്ടുവരുന്നില്ല.
- source_word: Ἰουδαίας
  choice: യെഹൂദ്യ
  rationale: പ്രദേശനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: യോർദ്ദാനക്കരയിൽനിന്നും
  rationale: യോർദ്ദാൻ നദിയുടെ മറുകരയിലെ പ്രദേശത്തുനിന്ന് എന്ന സ്ഥലസംബന്ധമായ ആശയം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു; ഏത് കാഴ്ചപ്പാടിൽ 'മറുകര' എന്നു പറയുന്നതിലെ ആശ്രിതത്വം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: καὶ ... καὶ ... καὶ
  choice: '...യിൽനിന്നും ...യിൽനിന്നും ...യിൽനിന്നും'
  rationale: മലയാളത്തിലെ പട്ടികാസ്വാഭാവികതയ്ക്കായി ആവർത്തിച്ച καί-യെ അക്ഷരാർഥത്തിൽ എല്ലായിടത്തും 'കൂടാതെ' എന്നു മാറ്റാതെ, ഉറവിടസൂചകപ്രത്യയം ആവർത്തിച്ച് സഞ്ചിതമായ ഭൂമിശാസ്ത്രവ്യാപ്തി നിലനിർത്തുന്നു.
theological_decisions:
- issue: അനുഗമിച്ചതിന്റെ സ്വഭാവം
  choice: അവനെ അനുഗമിച്ചു
  alternative: അവന്റെ ശിഷ്യരായി
  rationale: ἀκολουθέω ഇവിടെ ശാരീരികമായി പിന്നാലെ പോകുന്നതും ശിഷ്യത്വതാൽപര്യവും ഉൾക്കൊള്ളാൻ കഴിയുന്നതിനാൽ, എല്ലാവരും പ്രതിബദ്ധരായ ശിഷ്യരായി എന്ന വ്യാഖ്യാനം പാഠത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. സ്ഥലനാമങ്ങൾക്ക് മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപങ്ങൾ ഉപയോഗിച്ചു. ഗ്രീക്കിലെ ഏക ἀπό മുഴുവൻ പട്ടികയെയും നിയന്ത്രിക്കുന്നുവെങ്കിലും, മലയാളത്തിൽ ബന്ധം വ്യക്തമാക്കാനും വായന സുഗമമാക്കാനും ‘യിൽനിന്നും’ ഓരോ പ്രദേശത്തോടും ആവർത്തിച്ചു.
