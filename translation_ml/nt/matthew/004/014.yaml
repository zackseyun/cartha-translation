revisions:
- from: 'ഇങ്ങനെ, യെശയ്യാ പ്രവാചകനിലൂടെ അരുളിച്ചെയ്യപ്പെട്ടത് നിറവേറേണ്ടതിന്:'
  to: 'പ്രവാചകനായ യെശയ്യാവിലൂടെ അരുളിച്ചെയ്യപ്പെട്ടത് നിറവേറേണ്ടതിന്, അദ്ദേഹം ഇപ്രകാരം പറഞ്ഞു:'
  rationale: The revision retains the passive fulfillment formula (“അരുളിച്ചെയ്യപ്പെട്ടത് ... നിറവേറേണ്ടതിന്”), preserves Isaiah’s mediated role with “യെശയ്യാവിലൂടെ,” and explicitly represents λέγοντος with “അദ്ദേഹം ഇപ്രകാരം പറഞ്ഞു:”. It removes the imprecise introductory “ഇങ്ങനെ” without altering the verse’s meaning.
