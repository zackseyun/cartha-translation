id: MAT.4.14
reference: Matthew 4:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἵνα πληρωθῇ τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/014.yaml
  text: 'so that what was spoken through Isaiah the prophet might be fulfilled, saying:'
translation:
  language: ml
  text: 'പ്രവാചകനായ യെശയ്യാവിലൂടെ അരുളിച്ചെയ്യപ്പെട്ടത് നിറവേറേണ്ടതിന്, അദ്ദേഹം ഇപ്രകാരം പറഞ്ഞു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: ഇങ്ങനെ ... നിറവേറേണ്ടതിന്
  rationale: ഉദ്ദേശ്യം/ഫലം സൂചിപ്പിക്കുന്ന ἵνα-വാക്യത്തിന്റെ ശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; മുൻസന്ദർഭവുമായി ബന്ധിപ്പിക്കാൻ ‘ഇങ്ങനെ’ ഉപയോഗിക്കുന്നു.
- source_word: πληρωθῇ
  choice: നിറവേറേണ്ടതിന്
  rationale: ആറിസ്റ്റ് പാസീവ് സബ്ജങ്ക്ടീവിന്റെ അർഥം മലയാളത്തിലെ സ്വാഭാവിക ഉദ്ദേശ്യപ്രയോഗത്തിലൂടെ നൽകുകയും മത്തായിയുടെ തിരുവെഴുത്ത്-നിവൃത്തി പ്രമേയം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: τὸ ῥηθὲν
  choice: അരുളിച്ചെയ്യപ്പെട്ടത്
  rationale: സബ്സ്റ്റാന്റിവൽ പാസീവ് പാർട്ടിസിപ്പിളിനെ സംക്ഷിപ്തമായി പാസീവ് രൂപത്തിൽ നൽകുന്നു; പ്രവാചകവചനത്തിന്റെ ഗൗരവത്തിന് യോജിച്ച, മലയാള ബൈബിൾഭാഷയിൽ സുപരിചിതമായ പ്രയോഗമാണിത്.
- source_word: διὰ
  choice: മുഖേന
  rationale: ജനിറ്റീവിനൊപ്പമുള്ള διά സൂചിപ്പിക്കുന്ന മധ്യസ്ഥ ഏജൻസിയെ വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: Ἠσαΐου
  choice: യെശയ്യാ
  rationale: മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ പ്രവാചകനാമരൂപം ഉപയോഗിക്കുന്നു.
- source_word: τοῦ προφήτου
  choice: പ്രവാചകൻ
  rationale: യെശയ്യാവിന്റെ പങ്ക് വ്യക്തമാക്കുന്ന അനുബന്ധ വിശേഷണം നിലനിർത്തുന്നു.
- source_word: λέγοντος
  choice: '[തുടർന്നുള്ള ഉദ്ധരണി അവതരിപ്പിക്കുന്ന കോളൻ]'
  rationale: ഗ്രീക്കിലെ ‘പറയുന്ന’ എന്ന പാർട്ടിസിപ്പിളിന്റെ ഉദ്ധരണി-ആമുഖ പ്രവർത്തനം മലയാളത്തിൽ കോളൻ സ്വാഭാവികമായി നിർവഹിക്കുന്നു; ‘എന്ന്’ അടുത്ത വാക്യത്തിലെ ഉദ്ധരണിയുടെ അവസാനത്തിൽ വരുന്നതാണ് മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികം.
theological_decisions:
- issue: മത്തായിയിലെ നിവൃത്തി സൂത്രവാക്യം
  choice: ‘നിറവേറേണ്ടതിന്’ എന്ന് പരിഭാഷപ്പെടുത്തി തിരുവെഴുത്തിന്റെ നിവൃത്തി എന്ന ആശയം വ്യക്തമായി നിലനിർത്തി.
  alternative: ‘സത്യമായി തീരേണ്ടതിന്’ അല്ലെങ്കിൽ ‘നടന്നുവരേണ്ടതിന്’
  rationale: πληρόω എന്ന പദത്തിന്റെ തിരുവെഴുത്തുമായി ബന്ധപ്പെട്ട സാങ്കേതികവും ദൈവശാസ്ത്രപരവുമായ ഭാവം ‘നിറവേറുക’ കൂടുതൽ കൃത്യമായി സൂക്ഷിക്കുന്നു; അതിന്റെ അർഥം വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കുന്നില്ല.
- issue: പ്രവാചക മധ്യസ്ഥത
  choice: ‘യെശയ്യാ പ്രവാചകനിലൂടെ’
  alternative: ‘യെശയ്യാ പ്രവാചകൻ പറഞ്ഞത്’
  rationale: διά + ജനിറ്റീവ് പ്രവാചകനെ വചനത്തിന്റെ മധ്യസ്ഥനായി അവതരിപ്പിക്കുന്നു. മൂലവാചകം സൂചിപ്പിക്കാത്ത അന്തിമ കർത്താവിനെ പരിഭാഷയിൽ ചേർക്കാതെ ഈ ഘടന നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ സാധാരണ മലയാളം. ‘അരുളിച്ചെയ്യപ്പെട്ടത്’ എന്നത് ഉയർന്നെങ്കിലും സുപരിചിതമായ തിരുവെഴുത്തുപ്രയോഗമാണ്. ഉദ്ധരണി അടുത്ത വാക്യത്തിൽ തുടരുന്നതിനാൽ അവസാനം കോളൻ ചേർത്തിരിക്കുന്നു.
