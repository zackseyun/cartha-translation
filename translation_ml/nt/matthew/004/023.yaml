id: MAT.4.23
reference: Matthew 4:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ περιῆγεν ⸂ἐν ὅλῃ τῇ Γαλιλαίᾳ⸃, διδάσκων ἐν ταῖς συναγωγαῖς αὐτῶν καὶ κηρύσσων τὸ εὐαγγέλιον τῆς βασιλείας καὶ θεραπεύων πᾶσαν νόσον καὶ πᾶσαν μαλακίαν ἐν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/023.yaml
  text: And he went throughout all Galilee[a], teaching in their synagogues and proclaiming the good news of the kingdom and healing every disease and every sickness among the people.
translation:
  language: ml
  text: യേശു ഗലീലയിൽ എല്ലായിടത്തും സഞ്ചരിച്ചുകൊണ്ട്, അവരുടെ സിനഗോഗുകളിൽ പഠിപ്പിക്കുകയും രാജ്യത്തിന്റെ സുവാർത്ത[a] പ്രസംഗിക്കുകയും ജനങ്ങളുടെ ഇടയിൽ എല്ലാ രോഗവും എല്ലാ അസ്വാസ്ഥ്യവും സുഖപ്പെടുത്തുകയും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “രാജ്യത്തെക്കുറിച്ചുള്ള സുവാർത്ത.”
    reason: τῆς βασιλείας എന്ന ജനിറ്റീവ് ബന്ധത്തിന്റെ വ്യാഖ്യാനാത്മകമായ പകരം വിവർത്തനം.
lexical_decisions:
- source_word: περιῆγεν
  choice: സഞ്ചരിച്ച്
  rationale: അപൂർണഭൂതകാല ക്രിയ സൂചിപ്പിക്കുന്ന തുടർച്ചയായ സ്ഥലാന്തര സഞ്ചാരം സ്വാഭാവികമായി അറിയിക്കുന്നു; തുടർന്നുള്ള സമകാലിക പ്രവർത്തനങ്ങളുമായി ചേർന്ന് മലയാളത്തിൽ ഒഴുക്കുള്ള വാക്യം നൽകുന്നു.
- source_word: ἐν ὅλῃ τῇ Γαλιλαίᾳ
  choice: ഗലീലയിൽ എല്ലായിടത്തും
  rationale: ചലനക്രിയയോടൊപ്പമുള്ള ἐν, ὅλῃ എന്നിവയുടെ പ്രദേശവ്യാപകമായ അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: διδάσκων
  choice: പഠിപ്പിക്കുകയും
  rationale: മുഖ്യക്രിയയോടൊപ്പം നടന്നുകൊണ്ടിരുന്ന പഠിപ്പിക്കൽ പ്രവർത്തനം നിലനിർത്തുന്നു.
- source_word: συναγωγαῖς αὐτῶν
  choice: അവരുടെ സിനഗോഗുകളിൽ
  rationale: യഹൂദരുടെ ആരാധനാ-സമൂഹകേന്ദ്രങ്ങളെ സൂചിപ്പിക്കുന്ന συναγωγή എന്ന പദവും αὐτῶν എന്ന ഉടമസ്ഥസർവനാമവും സംരക്ഷിക്കുന്നു.
- source_word: κηρύσσων
  choice: പ്രസംഗിക്കുകയും
  rationale: പൊതുവായി അധികാരപൂർവം അറിയിക്കുക എന്ന ആശയം സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമായ പദംകൊണ്ട് നൽകുന്നു.
- source_word: τὸ εὐαγγέλιον
  choice: സുവാർത്ത
  rationale: നല്ല വാർത്ത എന്ന മൂലാർഥം വ്യക്തവും സഭാപരമായ ഉപയോഗത്തിൽ പരിചിതവുമായ മലയാളപദംകൊണ്ട് നൽകുന്നു.
- source_word: τῆς βασιλείας
  choice: രാജ്യത്തിന്റെ
  rationale: ഗ്രീക്കിലെ ജനിറ്റീവ് ഘടന സംരക്ഷിക്കുന്നു; സുവാർത്ത രാജ്യത്തെക്കുറിച്ചുള്ളതാണെന്ന ബന്ധവും തുറന്നുവെക്കുന്നു.
- source_word: θεραπεύων
  choice: സുഖപ്പെടുത്തുകയും
  rationale: സന്ദർഭത്തിലെ യഥാർഥ രോഗശാന്തിയെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: πᾶσαν νόσον
  choice: സകല രോഗവും
  rationale: πᾶσαν എന്ന ആവർത്തിച്ചുള്ള സമഗ്രത നിലനിർത്തുകയും νόσος എന്നത് പൊതുവായ രോഗമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: πᾶσαν μαλακίαν
  choice: സകല ദൗർബല്യവും
  rationale: μαλακίαയുടെ രോഗാവസ്ഥ, ബലഹീനത, അസ്വാസ്ഥ്യം എന്നീ അർഥപരിധി നിലനിർത്തി νόσος എന്ന മുൻപദവുമായി പൂർണമായി ലയിപ്പിക്കാതിരിക്കുന്നു.
- source_word: ἐν τῷ λαῷ
  choice: ജനങ്ങളുടെ ഇടയിലെ
  rationale: രോഗശാന്തികൾ നടന്ന സാമൂഹിക പരിധിയെ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: εὐαγγέλιον τῆς βασιλείας എന്ന പ്രയോഗം
  choice: രാജ്യത്തിന്റെ സുവാർത്ത
  alternative: രാജ്യത്തെക്കുറിച്ചുള്ള സുവാർത്ത
  rationale: ജനിറ്റീവ് ബന്ധം നേരിട്ട് നിലനിർത്തുകയും അതിനെ ഒരൊറ്റ വിശദീകരണത്തിലേക്ക് ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു; കൂടുതൽ വ്യാഖ്യാനാത്മകമായ പകരംവായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: πᾶσαν νόσον καὶ πᾶσαν μαλακίαν എന്നതിലെ രോഗശാന്തിയുടെ വ്യാപ്തി
  choice: സകല രോഗവും സകല ദൗർബല്യവും
  alternative: എല്ലാത്തരം രോഗങ്ങളും അസുഖങ്ങളും
  rationale: ഇരുവട്ടവും വരുന്ന πᾶσαν എന്ന ഊന്നലും രണ്ടു വ്യത്യസ്ത നാമങ്ങളുടെ സമഗ്രതയും സംരക്ഷിക്കുന്നു; വാക്യം പറയുന്നതിന് അപ്പുറമുള്ള അവകാശവാദം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘സിനഗോഗ്’, ‘സുവാർത്ത’ എന്നീ പരിചിത പദങ്ങൾ ഉപയോഗിച്ചു. ഗ്രീക്കിലെ തുടർച്ചയായ മൂന്ന് പങ്കാളിക്രിയകളെ മലയാളത്തിലെ സമാന്തര ക്രിയാരൂപങ്ങളാക്കി, വാക്യത്തിന്റെ പ്രവാഹവും പ്രവർത്തനങ്ങളുടെ കൂട്ടായ അവതരണവും നിലനിർത്തി.
