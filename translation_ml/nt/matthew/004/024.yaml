id: MAT.4.24
reference: Matthew 4:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀπῆλθεν ἡ ἀκοὴ αὐτοῦ εἰς ὅλην τὴν Συρίαν· καὶ προσήνεγκαν αὐτῷ πάντας τοὺς κακῶς ἔχοντας ποικίλαις νόσοις καὶ βασάνοις ⸀συνεχομένους, δαιμονιζομένους καὶ σεληνιαζομένους καὶ παραλυτικούς, καὶ ἐθεράπευσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/024.yaml
  text: And the report about him went out into all Syria[a], and they brought to him all who were sick, afflicted with various diseases and torments, those oppressed by demons, those having seizures, and paralytics[c][b], and he healed them.
translation:
  language: ml
  text: അവനെക്കുറിച്ചുള്ള വാർത്ത സിറിയയിലാകെ പരന്നു. പലതരം രോഗങ്ങളും കഠിനവേദനകളും ബാധിച്ച എല്ലാ രോഗികളെയും, ഭൂതബാധിതരെയും[a], അപസ്മാരബാധിതരെയും[b], തളർവാതരോഗികളെയും അവർ അവന്റെ അടുക്കൽ കൊണ്ടുവന്നു; അവൻ അവരെ സൗഖ്യമാക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഭൂതാവിഷ്ടരെ” അല്ലെങ്കിൽ “ഭൂതങ്ങളുടെ അധീനതയിലായവരെ.”
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കുപദത്തിന് അക്ഷരാർഥത്തിൽ ചന്ദ്രനാൽ ബാധിക്കപ്പെട്ടവർ എന്ന ആശയമുണ്ട്; പരമ്പരാഗതമായി “അപസ്മാരരോഗികൾ” എന്നു വിവർത്തനം ചെയ്യുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκοὴ
  choice: വാർത്ത
  rationale: ഇവിടെ ഈ പദം കേൾവിശക്തിയെയല്ല, യേശുവിനെക്കുറിച്ച് പ്രചരിച്ച വാർത്തയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἀπῆλθεν
  choice: പരന്നു
  rationale: ഗ്രീക്കിലെ ചലനരൂപകം മലയാളത്തിൽ സ്വാഭാവികമായി വാർത്ത വ്യാപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ‘പരന്നു’ എന്ന ക്രിയയാൽ നൽകുന്നു.
- source_word: κακῶς ἔχοντας
  choice: രോഗികൾ
  rationale: ‘മോശമായ അവസ്ഥയിൽ ഉള്ളവർ’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സന്ദർഭോചിതമായ അർഥം രോഗികളാണ്.
- source_word: ποικίλαις νόσοις καὶ βασάνοις συνεχομένους
  choice: പലതരം രോഗങ്ങളും കഠിനവേദനകളും ബാധിച്ച
  rationale: συνέχω സൂചിപ്പിക്കുന്ന ശക്തമായ ബാധയും βάσανος സൂചിപ്പിക്കുന്ന കടുത്ത വേദനയും വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: δαιμονιζομένους
  choice: ഭൂതബാധിതർ
  rationale: ദുഷ്ടാത്മീയ ബാധ എന്ന യഥാർഥ സൂചന നിലനിർത്തുകയും ഗ്രീക്ക് പദം നിർബന്ധിക്കാത്ത വിധത്തിൽ അതിനെ ഒരു സങ്കുചിത സാങ്കേതിക വിഭാഗമാക്കി മാറ്റാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: σεληνιαζομένους
  choice: അപസ്മാരബാധിതർ
  rationale: ചന്ദ്രനുമായി വ്യുത്പത്തിപരമായി ബന്ധപ്പെട്ട ഗ്രീക്ക് പദം ഈ രോഗപ്പട്ടികയിൽ സൂചിപ്പിക്കുന്നതായി പൊതുവേ മനസ്സിലാക്കുന്ന അപസ്മാരാവസ്ഥയെ ആധുനിക വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; കൂടുതൽ അക്ഷരാർഥപരമായ വിവരം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: παραλυτικούς
  choice: തളർവാതരോഗികൾ
  rationale: ശരീരം തളർന്നവരെയോ പക്ഷാഘാതമുള്ളവരെയോ സൂചിപ്പിക്കുന്ന പദത്തിന് സാധാരണ മലയാളത്തിൽ വ്യക്തമായ രൂപം.
- source_word: ἐθεράπευσεν
  choice: സൗഖ്യമാക്കി
  rationale: രോഗശാന്തി വരുത്തി എന്ന അർഥം dignified biblical Malayalam-ൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: δαιμονιζομένους എന്ന പദത്തിലെ ദുഷ്ടാത്മീയ ബാധയുടെ സ്വഭാവം
  choice: ഭൂതബാധിതർ
  alternative: ഭൂതാവിഷ്ടർ; ഭൂതങ്ങളുടെ അധീനതയിലായവർ
  rationale: അതീന്ദ്രിയമായ ദുഷ്ടാത്മീയ ബാധയെ ഇല്ലാതാക്കാതെ നിലനിർത്തുന്നു; എന്നാൽ ഗ്രീക്ക് നിർബന്ധിക്കാത്ത പൂർണ കൈവശാവസ്ഥയെ മുഖ്യവാചകത്തിൽ ഉറപ്പിച്ചുപറയുന്നില്ല.
- issue: σεληνιαζομένους എന്ന പദത്തിന്റെ പുരാതന ചന്ദ്രബന്ധിത രൂപവും ആധുനിക രോഗനാമവും
  choice: അപസ്മാരബാധിതർ
  alternative: ചന്ദ്രബാധിതർ; ഞരമ്പിളക്കം അനുഭവിക്കുന്നവർ
  rationale: പുരാതന കാരണധാരണയെ വിവർത്തനം സ്ഥിരീകരിക്കാതെ സാധ്യതയുള്ള രോഗസൂചന വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു; പദത്തിന്റെ അക്ഷരാർഥപരമായ പശ്ചാത്തലം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. നീണ്ട ഗ്രീക്ക് പട്ടികയുടെ ഘടന നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ വായനാസൗകര്യത്തിനായി ആദ്യ വാക്യം വേർതിരിച്ചു. ദുഷ്ടാത്മീയ ബാധയും രോഗസൂചനയും അനാവശ്യമായി വ്യാഖ്യാനിച്ചുറപ്പിക്കാതെ അടിക്കുറിപ്പുകളിലൂടെ യഥാർഥ ഭാഷാപരമായ വ്യത്യാസങ്ങൾ സംരക്ഷിച്ചു.
