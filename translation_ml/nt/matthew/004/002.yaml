id: MAT.4.2
reference: Matthew 4:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ νηστεύσας ἡμέρας τεσσεράκοντα καὶ νύκτας τεσσεράκοντα ὕστερον ἐπείνασεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/002.yaml
  text: And after fasting forty days and forty nights[a], he was hungry.
translation:
  language: ml
  text: നാൽപ്പതു ദിവസവും നാൽപ്പതു രാത്രിയും ഉപവസിച്ചശേഷം[a] അവനു വിശന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നാൽപ്പതു ദിവസവും നാൽപ്പതു രാത്രിയും ഉപവസിച്ചിട്ട്, പിന്നീട് അവനു വിശന്നു.”'
    reason: νηστεύσας എന്ന പങ്കാളിക്രിയയുടെയും ὕστερον എന്ന കാലസൂചകത്തിന്റെയും ഘടന കൂടുതൽ രൂപസാദൃശ്യമോടെ നൽകുന്ന മറ്റൊരു പരിഭാഷ.
lexical_decisions:
- source_word: νηστεύσας
  choice: ഉപവസിച്ചശേഷം
  rationale: പ്രധാന ക്രിയയ്ക്കു മുമ്പു നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന aorist participle സ്വാഭാവികമായ മലയാളത്തിൽ മുൻകാലബന്ധം വ്യക്തമാക്കുന്ന വിധത്തിൽ പരിഭാഷപ്പെടുത്തി.
- source_word: ἡμέρας τεσσεράκοντα καὶ νύκτας τεσσεράκοντα
  choice: നാൽപ്പതു പകലും നാൽപ്പതു രാത്രിയും
  rationale: കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന accusative പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും മൂലത്തിലെ ‘പകലും രാത്രിയും’ എന്ന സമാന്തരഘടന നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ὕστερον
  choice: ശേഷം
  rationale: ഉപവാസത്തിനു തുടർന്നാണ് വിശപ്പുണ്ടായത് എന്ന കാലക്രമം സംക്ഷിപ്തമായും സ്വാഭാവികമായും വ്യക്തമാക്കുന്നു.
- source_word: ἐπείνασεν
  choice: അവനു വിശന്നു
  rationale: യഥാർഥമായ ശാരീരിക വിശപ്പിനെ ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗത്തിലൂടെ അറിയിക്കുന്നു; സന്ദർഭത്തിൽ വ്യക്തമായ കർത്താവിനെ അനാവശ്യമായി പേരെടുത്തു പറയുന്നില്ല.
- source_word: καὶ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: മലയാളത്തിലെ വാക്യബന്ധത്തിൽ ലളിതമായ തുടർച്ച സ്വാഭാവികമായി ലഭിക്കുന്നതിനാൽ തുടക്കത്തിലെ καί-യ്ക്ക് വേറൊരു സംയോജകം ചേർത്താൽ വാക്യം കൃത്രിമമാകും.
theological_decisions:
- issue: ഉപവാസത്തിനു ശേഷമുള്ള യേശുവിന്റെ യഥാർഥ മാനുഷിക വിശപ്പ്
  choice: അവനു വിശന്നു
  alternative: അവൻ വിശപ്പുള്ളവനായിത്തീർന്നു
  rationale: മൂലത്തിലെ ἐπείνασεν സൂചിപ്പിക്കുന്ന വിശപ്പ് വ്യക്തമായി നിലനിർത്തുന്നു; അതേസമയം ഒരു പ്രത്യേക ക്രിസ്തുശാസ്ത്ര വ്യാഖ്യാനം വാക്യത്തിലേക്ക് അധികമായി ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. ‘ഉപവസിക്കുക’ എന്ന സാധാരണ ബൈബിൾ-മതപര പദം നിലനിർത്തിയിട്ടുണ്ട്; ‘അവനു വിശന്നു’ എന്നത് ഔപചാരികതയും സ്വാഭാവികതയും തുല്യപ്പെടുത്തുന്നു.
