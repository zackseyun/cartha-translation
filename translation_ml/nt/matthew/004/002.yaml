- from: നാൽപ്പതു പകലും നാൽപ്പതു രാത്രിയും ഉപവസിച്ചശേഷം[a] അവനു വിശന്നു.
  to: നാൽപ്പതു ദിവസവും നാൽപ്പതു രാത്രിയും ഉപവസിച്ചശേഷം[a] അവനു വിശന്നു.
  rationale: The revision changes only പകലും to ദിവസവും, preserving the source’s duration expression while eliminating the narrower Malayalam sense “daytime.” The temporal relationship expressed by νηστεύσας and ὕστερον remains naturally represented by ഉപവസിച്ചശേഷം, and the footnote is adjusted to match the corrected wording.
