id: MAT.4.16
reference: Matthew 4:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ λαὸς ὁ καθήμενος ἐν ⸀σκοτίᾳ ⸂φῶς εἶδεν⸃ μέγα, καὶ τοῖς καθημένοις ἐν χώρᾳ καὶ σκιᾷ θανάτου φῶς ἀνέτειλεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/016.yaml
  text: The people sitting in darkness saw a great light[a], and on those sitting in the region and shadow of death, a light dawned.
translation:
  language: ml
  text: ഇരുട്ടിൽ ഇരുന്ന ജനം ഒരു വലിയ വെളിച്ചം കണ്ടു[a]; പ്രദേശത്തും മരണത്തിന്റെ നിഴലിലും ഇരുന്നവരുടെമേൽ ഒരു വെളിച്ചം ഉദിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കൂരിരുട്ട്’ എന്നും പരിഭാഷപ്പെടുത്താം. ‘മരണത്തിന്റെ നിഴൽ’ എന്ന പ്രയോഗത്തിൽ ഗ്രീക്കിൽ ‘മരണം’ വ്യക്തമായി ഉൾപ്പെടുന്നതിനാലും അത് പരിചിതമായ ബൈബിൾ ദൃശ്യഭാഷയെ അനുസ്മരിപ്പിക്കുന്നതിനാലും ആ പ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαὸς
  choice: ജനം
  rationale: ഒരു കൂട്ടമായ മനുഷ്യരെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രയോഗം; ആധുനിക രാഷ്ട്രീയ അർഥമുള്ള ‘രാഷ്ട്രം’ ഇവിടെ യോജിക്കുന്നില്ല.
- source_word: καθήμενος / καθημένοις
  choice: ഇരുന്ന / ഇരുന്നവർ
  rationale: ‘ഇരിക്കുക’ എന്ന മൂലചിത്രവും യെശയ്യാവുമായുള്ള അന്തർപാഠബന്ധവും നിലനിർത്തുന്നു; ‘വസിക്കുക’ എന്നത് സാധ്യമെങ്കിലും ചിത്രത്തിന്റെ തീവ്രത കുറയ്ക്കും.
- source_word: σκοτίᾳ
  choice: ഇരുട്ട്
  rationale: പദത്തിന്റെ ഭൗതികവും രൂപകാത്മകവുമായ സാധ്യതകൾ നിലനിർത്തുന്ന സാധാരണ മലയാള തുല്യപദം.
- source_word: φῶς εἶδεν μέγα
  choice: ഒരു വലിയ വെളിച്ചം കണ്ടു
  rationale: ഗ്രീക്കിലെ ലളിത ഭൂതകാലവും വെളിച്ചത്തിന്റെ ശ്രദ്ധേയമായ പ്രത്യക്ഷതയും സ്വാഭാവിക മലയാളത്തിൽ പകരുന്നു.
- source_word: χώρᾳ
  choice: പ്രദേശം
  rationale: ആധുനിക രാഷ്ട്രത്തെ സൂചിപ്പിക്കാതെ ഭൂമിശാസ്ത്രപരമായ മേഖലയെ കൃത്യമായി സൂചിപ്പിക്കുന്നു.
- source_word: σκιᾷ θανάτου
  choice: മരണത്തിന്റെ നിഴൽ
  rationale: ഗ്രീക്കിൽ ‘മരണം’ വ്യക്തമായി ഉള്ളതിനാൽ അത് നിലനിർത്തുകയും പരിചിതമായ ബൈബിൾ ദൃശ്യഭാഷ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀνέτειλεν
  choice: ഉദിച്ചു
  rationale: വെളിച്ചമോ സൂര്യനോ ഉയർന്നുവരുന്ന ചിത്രം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: αὐτοῖς
  choice: അവരുടെമേൽ
  rationale: ‘വെളിച്ചം ഉദിച്ചു’ എന്നതിനോടൊപ്പം ദാതിവിന്റെ ലക്ഷ്യഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: ഇരുട്ടിന്റെയും വെളിച്ചത്തിന്റെയും ദൃശ്യഭാഷയുടെ സ്വഭാവം
  choice: ഇരുട്ടും വെളിച്ചവും എന്തിനെ സൂചിപ്പിക്കുന്നുവെന്ന് പ്രത്യേകം നിർവചിക്കാതെ ദൃശ്യഭാഷ നിലനിർത്തി.
  alternative: ഇരുട്ടിനെ പാപമെന്നോ ജാതികളുടെ അജ്ഞതയെന്നോ, വെളിച്ചത്തെ മശീഹയുടെ രക്ഷാകര വെളിപ്പാടെന്നോ വിവർത്തനത്തിൽ വ്യക്തമാക്കുക.
  rationale: ഈ പ്രവാചക ദൃശ്യഭാഷയ്ക്ക് സമൃദ്ധമായ ദൈവശാസ്ത്രപരമായ അർഥമുണ്ടെങ്കിലും, ഈ വാക്യഭാഗത്തിലെ ഗ്രീക്ക് അതിനെ ഒരൊറ്റ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- issue: σκιᾷ θανάτου എന്ന പ്രയോഗത്തിന്റെ അർഥപരിധി
  choice: ‘മരണത്തിന്റെ നിഴൽ’ എന്ന് നിലനിർത്തി.
  alternative: ‘കൂരിരുട്ട്’ എന്നു വിവർത്തനം ചെയ്യുക.
  rationale: പഴയനിയമ പശ്ചാത്തലത്തിൽ ‘കൂരിരുട്ട്’ എന്ന അർഥസാധ്യത ഉണ്ടായാലും മത്തായിയുടെ ഗ്രീക്ക് പാഠത്തിൽ θανάτου (‘മരണത്തിന്റെ’) വ്യക്തമായി ഉൾപ്പെടുന്നു; അതിനാൽ മരണദൃശ്യം മായ്ച്ചുകളയരുത്.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഇരുന്ന’ എന്ന ആവർത്തനം ഗ്രീക്ക് സമാന്തരഘടനയും യെശയ്യാവിലെ ദൃശ്യഭാഷയും സംരക്ഷിക്കുന്നു. ‘മരണത്തിന്റെ നിഴൽ മൂടിയ പ്രദേശം’ എന്ന ക്രമീകരണം മലയാളത്തിൽ അർഥബന്ധം വ്യക്തമാക്കുമ്പോഴും ‘പ്രദേശം’ എന്നും ‘മരണത്തിന്റെ നിഴൽ’ എന്നും ഉള്ള രണ്ടു ഘടകങ്ങളും നിലനിർത്തുന്നു.
