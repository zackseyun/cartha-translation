id: MAT.4.7
reference: Matthew 4:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ Ἰησοῦς· Πάλιν γέγραπται· Οὐκ ἐκπειράσεις κύριον τὸν θεόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/007.yaml
  text: 'Jesus said to him[b][a], “Again it is written: ‘You shall not put the Lord your God to the test.’”'
translation:
  language: ml
  text: 'യേശു അവനോടു പറഞ്ഞു: “വീണ്ടും എഴുതിയിരിക്കുന്നു:[b] ‘നിന്റെ ദൈവമായ കർത്താവിനെ പരീക്ഷിക്കരുത്.’[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “നിന്റെ ദൈവമായ കർത്താവിനെ പരീക്ഷണത്തിനു വിധേയനാക്കരുത്.” ἐκπειράζω എന്ന ഗ്രീക്ക് ക്രിയയ്ക്ക് “പരീക്ഷിക്കുക” എന്നും “പരീക്ഷണത്തിനു വിധേയനാക്കുക” എന്നും പരിഭാഷ നൽകാം.'
    reason: lexical_alternative
  - marker: b
    text: ഇത് ആവർത്തനം 6:16-ൽ നിന്നുള്ള ഉദ്ധരണിയാണ്. ഗ്രീക്കിലെ “കർത്താവ്” എന്ന പദം, സെപ്റ്റുവജിന്റിൽ ദൈവനാമത്തിനു നൽകിയ പരിഭാഷയെ പ്രതിഫലിപ്പിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: യേശു അവനോടു പറഞ്ഞു
  rationale: φημίയുടെ ഭൂതകാലരൂപം ഇവിടെ ഒരു സാധാരണ സംഭാഷണാവതരണമാണ്; ദത്തിവിലുള്ള αὐτῷയെ ‘അവനോടു’ എന്നു സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: Πάλιν γέγραπται
  choice: വീണ്ടും ഇങ്ങനെ എഴുതിയിരിക്കുന്നു
  rationale: πάλιν രണ്ടാമത്തെ തിരുവെഴുത്തുദ്ധരണി അവതരിപ്പിക്കുന്ന ‘വീണ്ടും’ എന്ന ആശയം നിലനിർത്തുന്നു. γέγραπται തിരുവെഴുത്ത് ഉദ്ധരിക്കുമ്പോൾ ഉപയോഗിക്കുന്ന, ഇപ്പോഴും പ്രാബല്യമുള്ളതായി സൂചിപ്പിക്കുന്ന സ്ഥിരപ്രയോഗമാണ്; മലയാളത്തിൽ ‘എഴുതിയിരിക്കുന്നു’ അതിനെ സ്വാഭാവികമായി പകരുന്നു.
- source_word: Οὐκ ἐκπειράσεις
  choice: പരീക്ഷിക്കരുത്
  rationale: ഭാവികാല നിർദ്ദേശകരൂപം ഇവിടെ നിരോധനകല്പനയായി പ്രവർത്തിക്കുന്നു. ἐκπειράζω ഒരാളെ പരീക്ഷിക്കുകയോ പരീക്ഷണത്തിനു വിധേയനാക്കുകയോ ചെയ്യുക എന്ന അർഥം നൽകുന്നു; ‘പരീക്ഷിക്കരുത്’ സംക്ഷിപ്തവും സ്വാഭാവികവും അർഥസത്യവുമാണ്.
- source_word: κύριον τὸν θεόν σου
  choice: നിന്റെ ദൈവമായ കർത്താവിനെ
  rationale: κύριος എന്നതിന് ‘കർത്താവ്’ എന്നും θεόν σου എന്നതിന് ‘നിന്റെ ദൈവം’ എന്നും നൽകുന്നു. മലയാളത്തിലെ ‘നിന്റെ ദൈവമായ കർത്താവ്’ എന്ന സമാനാധികരണഘടന ഗ്രീക്കിലെ ബന്ധം വ്യക്തമായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഇസ്രായേലിന്റെ ദൈവത്തെ സൂചിപ്പിക്കുന്ന തിരുവെഴുത്തുദ്ധരണിയിലെ κύριος
  choice: കർത്താവ്
  alternative: യഹോവ
  rationale: ഉടൻ പരിഭാഷപ്പെടുത്തേണ്ട ഗ്രീക്ക് പാഠത്തിൽ κύριος ആണ് ഉള്ളത്; അതിനാൽ പ്രധാനപാഠത്തിൽ ‘കർത്താവ്’ നിലനിർത്തുന്നു. ഉദ്ധരണിയുടെ പഴയനിയമ പശ്ചാത്തലത്തിൽ ദൈവനാമം ഉണ്ടെന്ന വിവരം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ സംഭാഷണശൈലി ഉപയോഗിച്ചു. തിരുവെഴുത്തുദ്ധരണിയുടെ ഔപചാരിക ഭാവം ‘എഴുതിയിരിക്കുന്നു’ എന്ന പ്രയോഗത്തിലൂടെ നിലനിർത്തി; ദൈവനാമത്തെക്കുറിച്ചുള്ള പശ്ചാത്തലം പ്രധാനപാഠത്തിൽ ചേർക്കാതെ അടിക്കുറിപ്പിൽ നൽകി.
