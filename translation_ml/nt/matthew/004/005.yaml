id: MAT.4.5
reference: Matthew 4:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τότε παραλαμβάνει αὐτὸν ὁ διάβολος εἰς τὴν ἁγίαν πόλιν, καὶ ⸀ἔστησεν αὐτὸν ἐπὶ τὸ πτερύγιον τοῦ ἱεροῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/005.yaml
  text: Then the devil takes him into the holy city and sets him on the pinnacle of the temple[b][a],
translation:
  language: ml
  text: അപ്പോൾ പിശാച് അവനെ വിശുദ്ധനഗരത്തിലേക്ക്[a] കൂട്ടിക്കൊണ്ടുപോയി, ദൈവാലയസമുച്ചയത്തിന്റെ അഗ്രഭാഗത്ത്[b] നിർത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അതായത്, യെരൂശലേം.
    reason: cross_reference
  - marker: b
    text: അഥവാ, ‘ദൈവാലയത്തിന്റെ ചിറകിൽ’ അല്ലെങ്കിൽ ‘ദൈവാലയസമുച്ചയത്തിന്റെ ഏറ്റവും ഉയർന്ന സ്ഥലത്ത്’; ഗ്രീക്ക് പദം പുറത്തേക്ക് തള്ളിനിൽക്കുന്ന ഒരു അറ്റത്തെയോ ഉയർന്ന അഗ്രത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: അപ്പോൾ
  rationale: തുടർന്നുവരുന്ന സംഭവത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ കാലക്രമപദം.
- source_word: παραλαμβάνει
  choice: കൂട്ടിക്കൊണ്ടുപോയി
  rationale: ആഖ്യാനത്തിലെ ചരിത്രവർത്തമാനമാണിത്; മലയാളത്തിൽ സംഭവക്രമം സ്വാഭാവികമായി അവതരിപ്പിക്കുമ്പോൾ ആദ്യം നടന്ന പ്രവൃത്തി ഭൂതകാല ക്രിയാരൂപത്തിലും മുഖ്യപ്രവൃത്തി വർത്തമാനത്തിലും നൽകുന്നു. കൂടെ കൊണ്ടുപോകുക എന്ന അർഥഘടകവും നിലനിർത്തുന്നു.
- source_word: ὁ διάβολος
  choice: പിശാച്
  rationale: ഇവിടെ സാത്താനെ സൂചിപ്പിക്കുന്ന വ്യക്തിപരമായ സ്ഥാനനാമമായി ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ മലയാളത്തിലെ സ്ഥാപിതമായ പദം സ്വീകരിച്ചു.
- source_word: εἰς τὴν ἁγίαν πόλιν
  choice: വിശുദ്ധനഗരത്തിലേക്ക്
  rationale: εἰς സൂചിപ്പിക്കുന്ന ലക്ഷ്യദിശയും മൂലപാഠത്തിലെ ബഹുമാനസൂചക വിശേഷണവും നിലനിർത്തുന്നു; യെരൂശലേം എന്ന തിരിച്ചറിയൽ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἔστησεν
  choice: നിർത്തുന്നു
  rationale: ἵστημι ഇവിടെ സകർമകവും കാരകവുമാണ്—അവനെ ഒരു സ്ഥാനത്ത് നിൽക്കുമാറാക്കുന്നു. ചരിത്രവർത്തമാനത്തിന്റെ ആഖ്യാനജീവന്തതയും മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐπὶ τὸ πτερύγιον
  choice: അഗ്രഭാഗത്ത്
  rationale: πτερύγιον എന്നത് ചിറക്, പുറത്തേക്ക് തള്ളിനിൽക്കുന്ന അറ്റം, ഉയർന്ന അഗ്രം എന്നിവ സൂചിപ്പിക്കാം. കൃത്യമായ വാസ്തുഘടകം അനിശ്ചിതമായതിനാൽ സ്വാഭാവികവും താരതമ്യേന നിഷ്പക്ഷവുമായ പദം തിരഞ്ഞെടുത്തു.
- source_word: τοῦ ἱεροῦ
  choice: ദൈവാലയസമുച്ചയത്തിന്റെ
  rationale: ἱερόν അകത്തെ ശ്രീകോവിലിനെ മാത്രമല്ല, വിശാലമായ ദൈവാലയപരിസരത്തെ സൂചിപ്പിക്കുന്നു; അതിനാൽ ναός എന്നതുമായുള്ള വ്യത്യാസം വ്യക്തമാക്കാൻ ‘സമുച്ചയം’ ചേർത്തു.
theological_decisions:
- issue: ‘വിശുദ്ധനഗരം’ എന്നതിന്റെ തിരിച്ചറിയൽ
  choice: മൂലപാഠത്തിലെ ‘വിശുദ്ധനഗരം’ മുഖ്യവാക്യത്തിൽ നിലനിർത്തി.
  alternative: ‘യെരൂശലേം’ എന്ന് മുഖ്യവാക്യത്തിൽ നൽകുക.
  rationale: മൂലപാഠം സ്ഥലനാമത്തിനു പകരം ബഹുമാനസൂചക വിശേഷണം ഉപയോഗിക്കുന്നു. അതിന്റെ ഭാവം സംരക്ഷിക്കുകയും തിരിച്ചറിയൽ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- issue: πτερύγιον τοῦ ἱεροῦ എന്ന വാസ്തുപദസമുച്ചയം
  choice: ‘ദൈവാലയസമുച്ചയത്തിന്റെ അഗ്രഭാഗം’
  alternative: ‘ദൈവാലയത്തിന്റെ ചിറക്’; ‘ദൈവാലയസമുച്ചയത്തിന്റെ ഏറ്റവും ഉയർന്ന സ്ഥലം’; ‘ദൈവാലയത്തിന്റെ ശിഖരം’
  rationale: കൃത്യമായ വാസ്തുഘടകം ഉറപ്പില്ല. ‘അഗ്രഭാഗം’ പുറത്തേക്ക് തള്ളിനിൽക്കുന്ന അറ്റമോ ഉയർന്ന സ്ഥാനമോ ആയിരിക്കാവുന്ന മൂലപദത്തിന്റെ പരിധി അനാവശ്യമായി ചുരുക്കുന്നില്ല; മറ്റ് സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ഗ്രീക്കിലെ ചരിത്രവർത്തമാനത്തിന്റെ ജീവന്തത മുഖ്യക്രിയയായ ‘നിർത്തുന്നു’ എന്നതിൽ നിലനിർത്തി; മലയാളത്തിലെ സ്വാഭാവിക സംഭവക്രമത്തിനായി അനുബന്ധക്രിയ ‘കൂട്ടിക്കൊണ്ടുപോയി’ എന്നാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദങ്ങൾക്ക് പിന്നാലെ നൽകിയിരിക്കുന്നു.
