id: MAT.4.10
reference: Matthew 4:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τότε λέγει αὐτῷ ὁ Ἰησοῦς· ⸀Ὕπαγε, Σατανᾶ· γέγραπται γάρ· Κύριον τὸν θεόν σου προσκυνήσεις καὶ αὐτῷ μόνῳ λατρεύσεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/010.yaml
  text: 'Then Jesus says to him, “Go away, Satan! For it is written: ‘You shall worship the Lord your God, and serve him only.’”'
translation:
  language: ml
  text: 'അപ്പോൾ യേശു അവനോടു പറയുന്നു: “പോകൂ, സാത്താനേ! കാരണം, എഴുതിയിരിക്കുന്നു: ‘നിന്റെ ദൈവമായ കർത്താവിനെ നീ ആരാധിക്കണം[a]; അവനെ മാത്രം സേവിക്കണം[b].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്റെ ദൈവമായ കർത്താവിനെ നീ കുമ്പിടണം.” ഗ്രീക്ക് ക്രിയയ്ക്ക് ആദരപൂർവം സാഷ്ടാംഗം വീഴുക അഥവാ കുമ്പിടുക എന്ന കൂടുതൽ അക്ഷരാർഥവും ഉണ്ടാകാം.
    reason: lexical_alternative
  - marker: b
    text: “സേവിക്കുക” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ക്രിയ ദൈവത്തിനു അർപ്പിക്കുന്ന വിശുദ്ധമോ മതപരമോ ആയ സേവനത്തെ പ്രത്യേകമായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: അപ്പോൾ
  rationale: ആഖ്യാനത്തിലെ സംഭവക്രമം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: λέγει
  choice: പറയുന്നു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനകാലത്തിന്റെ സജീവത നിലനിർത്തുന്നു.
- source_word: Ὕπαγε
  choice: അകന്നുപോകൂ
  rationale: ശക്തമായ വിടവാങ്ങൽ കല്പനയെ ആധുനികവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: Σατανᾶ
  choice: സാത്താനേ
  rationale: സംഭോധനരൂപത്തിലുള്ള വ്യക്തിനാമം മലയാളത്തിലെ പതിവ് ലിപ്യന്തരണത്തോടും വിഭക്തിയോടും കൂടി നൽകുന്നു.
- source_word: γέγραπται
  choice: ഇങ്ങനെ എഴുതിയിരിക്കുന്നു
  rationale: തിരുവെഴുത്ത് ഉദ്ധരണി പരിചയപ്പെടുത്തുന്ന സമ്പൂർണ നിഷ്ക്രിയ പ്രയോഗത്തിന്റെ നിലനിൽക്കുന്ന ഫലം വ്യക്തമാക്കുന്നു.
- source_word: Κύριον τὸν θεόν σου
  choice: നിന്റെ ദൈവമായ കർത്താവിനെ
  rationale: ‘കർത്താവ്’ എന്നും ‘നിന്റെ ദൈവം’ എന്നും ഉള്ള സമാനാധികരണബന്ധം സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: προσκυνήσεις
  choice: നീ ആരാധിക്കണം
  rationale: ദൈവത്തോടുള്ള ഭക്തിപൂർവമായ വണക്കം എന്ന സന്ദർഭാർഥം നൽകുന്നു; ശരീരഭാവമായ കുമ്പിടൽ എന്ന കൂടുതൽ അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: αὐτῷ μόνῳ
  choice: അവനെ മാത്രം
  rationale: സേവനം ലഭിക്കേണ്ടത് ദൈവത്തിനു മാത്രമാണെന്ന ഊന്നൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: λατρεύσεις
  choice: സേവിക്കണം
  rationale: προσκυνέω എന്ന ആദ്യ ക്രിയയിൽനിന്ന് വ്യത്യാസം നിലനിർത്തിക്കൊണ്ട് ദൈവത്തിനു നൽകുന്ന മതപരമായ സേവനം സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: προσκυνέω, λατρεύω എന്നീ രണ്ടു ക്രിയകളുടെ വ്യത്യാസം
  choice: ആദ്യത്തേത് ‘ആരാധിക്കുക’ എന്നും രണ്ടാമത്തേത് ‘സേവിക്കുക’ എന്നും പരിഭാഷപ്പെടുത്തുന്നു.
  alternative: ആദ്യത്തേത് ‘കുമ്പിടുക’ എന്ന് പരിഭാഷപ്പെടുത്തുക, അല്ലെങ്കിൽ രണ്ടിനും ആരാധനാസംബന്ധമായ ഒരേ പദം ഉപയോഗിക്കുക.
  rationale: 'മൂലപാഠത്തിലെ ബന്ധമുള്ളതെങ്കിലും വ്യത്യസ്തമായ രണ്ടു ആശയങ്ങൾ ലയിപ്പിക്കാതെ സൂക്ഷിക്കുന്നു: ദൈവത്തിനു മാത്രമാണ് ആരാധനയും സമർപ്പിത സേവനവും നൽകേണ്ടത്.'
- issue: μόνῳ എന്ന പദത്തിന്റെ പരിധി
  choice: ‘അവനെ മാത്രം സേവിക്കണം’
  alternative: ‘അവനെ സേവിക്കുക മാത്രം ചെയ്യണം’ എന്ന അർഥത്തിലേക്ക് വായിക്കുക.
  rationale: ഗ്രീക്കിൽ μόνος എന്ന വിശേഷണം αὐτός എന്ന സർവനാമത്തോടു യോജിക്കുന്നതിനാൽ, ഊന്നൽ സേവനം ലഭിക്കുന്ന വ്യക്തിയുടെ ഏകത്വത്തിലാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ചരിത്രവർത്തമാനകാലമായ ‘പറയുന്നു’ നിലനിർത്തി; ഉദ്ധരണിക്ക് തിരുവെഴുത്തുസ്വഭാവമുള്ളതെങ്കിലും പഴഞ്ചനല്ലാത്ത ഭാഷ നൽകി.
