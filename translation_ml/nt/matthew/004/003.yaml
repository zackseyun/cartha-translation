id: MAT.4.3
reference: Matthew 4:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ προσελθὼν ⸂ὁ πειράζων εἶπεν αὐτῷ⸃· Εἰ υἱὸς εἶ τοῦ θεοῦ, εἰπὲ ἵνα οἱ λίθοι οὗτοι ἄρτοι γένωνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/003.yaml
  text: And the tempter came and said to him[a], “If you are the Son of God[b], tell these stones to become bread.”
translation:
  language: ml
  text: 'പ്രലോഭകൻ അടുത്തുവന്ന് അവനോടു പറഞ്ഞു: “നീ ദൈവപുത്രനാണെങ്കിൽ,[a] ഈ കല്ലുകൾ അപ്പങ്ങളായിത്തീരട്ടെ എന്നു പറയുക.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നീ ദൈവപുത്രനായതിനാൽ.” ഗ്രീക്കിലെ ഉപാധിവാക്യം വെറും സംശയം പ്രകടിപ്പിക്കുന്നതിനു പകരം ഒരു വെല്ലുവിളിയായി പ്രവർത്തിക്കാം.
    reason: alternative_reading
  - marker: b
    text: 'ഗ്രീക്കിൽ ‘അപ്പം’ ബഹുവചനത്തിലാണ്: ‘അപ്പങ്ങൾ’; മുഖ്യപാഠവും ബഹുവചനം നിലനിർത്തുന്നു.'
    reason: lexical_clarification
lexical_decisions:
- source_word: προσελθὼν
  choice: അടുത്തുവന്ന്
  rationale: യേശുവിന്റെ അടുക്കലേക്കുള്ള നീക്കം സൂചിപ്പിക്കുന്ന ക്രിയാവിശേഷണസ്വഭാവമുള്ള ഭൂതകാല കൃദന്തത്തെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ὁ πειράζων
  choice: പ്രലോഭകൻ
  rationale: സന്ദർഭത്തിൽ യേശുവിനെ പാപത്തിലേക്കു പ്രലോഭിപ്പിക്കുന്നവനെ സൂചിപ്പിക്കുന്ന നാമവാചക കൃദന്തരൂപം; ‘പരീക്ഷകൻ’ എന്നത് ഇവിടെ ഉദ്ദേശിക്കുന്ന ദോഷകരമായ പ്രേരണയെ മതിയായ വിധം വ്യക്തമാക്കുന്നില്ല.
- source_word: εἶπεν αὐτῷ
  choice: അവനോടു പറഞ്ഞു
  rationale: λέγωയും പരോക്ഷ കർമവും ചേർന്ന പ്രയോഗത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: Εἰ
  choice: ആണെങ്കിൽ
  rationale: ഗ്രീക്കിലെ ഉപാധിരൂപം നിലനിർത്തുന്നു; അത് സംശയമാണോ വെല്ലുവിളിയാണോ മുൻകൂട്ടി അംഗീകരിച്ച വസ്തുതയെ ആധാരമാക്കിയുള്ള പ്രസ്താവനയാണോ എന്നു മുഖ്യപാഠത്തിൽ തീർപ്പാക്കുന്നില്ല.
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: ദൈവപുത്രൻ
  rationale: മത്തായിയുടെ സന്ദർഭത്തിൽ യേശുവിനെ സവിശേഷമായി തിരിച്ചറിയിക്കുന്ന ശീർഷകം; അനിശ്ചിതമായ ‘ദൈവത്തിന്റെ ഒരു പുത്രൻ’ എന്ന അർഥം ഒഴിവാക്കുന്നു.
- source_word: εἰπὲ ἵνα
  choice: ആയിത്തീരാൻ പറയുക
  rationale: ആജ്ഞയ്ക്കു പിന്നാലെയുള്ള ἵνα ഘടനയെ മലയാളത്തിലെ സ്വാഭാവികമായ ഉദ്ദേശ്യ/വിഷയപൂരക രൂപത്തിൽ നൽകുന്നു; മൂലത്തിൽ വ്യക്തമല്ലാത്ത ‘കല്പിക്കുക’ എന്ന ശക്തമായ അർഥം ചേർക്കുന്നില്ല.
- source_word: οἱ λίθοι οὗτοι
  choice: ഈ കല്ലുകൾ
  rationale: നിർദ്ദേശകസർവനാമത്തിന്റെ ഊന്നലും λίθος എന്നതിന്റെ സാധാരണ അർഥവും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: ἄρτοι
  choice: അപ്പങ്ങൾ
  rationale: ഗ്രീക്കിലെ ബഹുവചനത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു; ഓരോ കല്ലും അപ്പമായി മാറുന്നതിന്റെ ദൃശ്യരൂപവും വ്യക്തമാക്കുന്നു.
- source_word: γένωνται
  choice: ആയിത്തീരാൻ
  rationale: γίνομαι എന്ന ക്രിയയുടെ ‘ആകുക/ആയിത്തീരുക’ എന്ന നിഷ്പക്ഷമായ അർഥം നൽകുന്നു; അനാവശ്യമായ വിശദീകരണം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: Εἰ υἱὸς εἶ τοῦ θεοῦ എന്ന ഉപാധിവാക്യത്തിന്റെ ഭാവം
  choice: “നീ ദൈവപുത്രനാണെങ്കിൽ” എന്നു നൽകി, സംശയമോ സമ്മതമോ മുഖ്യപാഠത്തിൽ നിർണയിച്ചില്ല.
  alternative: “നീ ദൈവപുത്രനായതിനാൽ” അല്ലെങ്കിൽ “നീ തീർച്ചയായും ദൈവപുത്രനാണെങ്കിൽ”
  rationale: ഗ്രീക്ക് ഉപാധി വെറും സംശയത്തേക്കാൾ ഒരു വെല്ലുവിളിയായി പ്രവർത്തിക്കാം. ലളിതമായ ഉപാധിരൂപം ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും വക്താവിന്റെ ഉദ്ദേശ്യത്തിലെ അവ്യക്തതയും നിലനിർത്തുന്നു.
- issue: υἱὸς τοῦ θεοῦ എന്ന ക്രിസ്തുശാസ്ത്രപരമായ ശീർഷകം
  choice: “ദൈവപുത്രൻ”
  alternative: “ദൈവത്തിന്റെ ഒരു പുത്രൻ”
  rationale: നാമത്തിന് നിർദേശകപദം ഇല്ലെങ്കിലും εἰμί-യോടുകൂടിയ വിധേയനാമഘടനയും മത്തായിയുടെ വിവരണസന്ദർഭവും യേശുവിനെ സവിശേഷമായി തിരിച്ചറിയിക്കുന്ന ശീർഷകത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘പ്രലോഭകൻ’ സന്ദർഭത്തിലെ ദോഷകരമായ പ്രേരണ വ്യക്തമാക്കുന്നു. മുഖ്യപാഠത്തിൽ ഗ്രീക്കിലെ അപ്പങ്ങളുടെ ബഹുവചനം നിലനിർത്തിയതിനാൽ [b] കുറിപ്പ് മൂലരൂപം ശ്രദ്ധിപ്പിക്കുന്ന പാഠസഹായമായി നൽകിയിരിക്കുന്നു.
