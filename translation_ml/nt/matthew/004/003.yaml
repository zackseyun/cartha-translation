- from: 'അപ്പോൾ പ്രലോഭകൻ അടുത്തുവന്ന് അവനോടു പറഞ്ഞു: “നീ ദൈവപുത്രനാണെങ്കിൽ,[a] ഈ കല്ലുകൾ അപ്പങ്ങളായിത്തീരാൻ പറയുക.”[b]'
  to: 'പ്രലോഭകൻ അടുത്തുവന്ന് അവനോടു പറഞ്ഞു: “നീ ദൈവപുത്രനാണെങ്കിൽ,[a] ഈ കല്ലുകൾ അപ്പങ്ങളായിത്തീരട്ടെ എന്നു പറയുക.”[b]'
  rationale: The revision removes the unsupported temporal connective, clarifies the imperative’s content in idiomatic Malayalam, and adjusts the plural note to match the revised main text. It preserves the conditional ambiguity and the established title ‘ദൈവപുത്രൻ.’
