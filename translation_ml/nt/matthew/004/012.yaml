    text: 'അഥവാ, ഈ സന്ദർഭത്തിൽ കൂടുതൽ വ്യക്തമായി: “അറസ്റ്റു ചെയ്യപ്പെട്ടുവെന്ന്.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσας
  choice: കേട്ടപ്പോൾ
  rationale: ἀκούω എന്ന ക്രിയയുടെ aorist participle പ്രധാനക്രിയയോടുള്ള സമയബന്ധം സൂചിപ്പിക്കുന്നു. ‘കേട്ടപ്പോൾ’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികമായി ആ ബന്ധം നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: ഇവിടെ δέ ശക്തമായ വിരോധമല്ല, മൃദുവായ ആഖ്യാനബന്ധകമാണ്. മലയാളത്തിലെ വാക്യപ്രവാഹത്തിൽ പ്രത്യേക ബന്ധകപദമില്ലാതെയും ഈ മാറ്റം സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: Ἰωάννης
  choice: യോഹന്നാൻ
  rationale: മലയാള ബൈബിൾപരമ്പരയിലും പൊതുവായ ഉപയോഗത്തിലും സ്ഥിരപ്പെട്ട വ്യക്തിനാമരൂപം.
- source_word: παρεδόθη
  choice: ഏല്പിക്കപ്പെട്ടു
  rationale: παραδίδωμι എന്നതിന്റെ വിശാലമായ ‘കൈമാറുക/ഏല്പിക്കുക’ എന്ന അർത്ഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ സാധ്യമായ കൂടുതൽ പ്രത്യേകമായ ‘അറസ്റ്റുചെയ്യപ്പെട്ടു’ എന്ന അർത്ഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἀνεχώρησεν
  choice: പിൻവാങ്ങി
  rationale: സാഹചര്യത്തോടുള്ള പ്രതികരണമായി മാറിപ്പോകുക അഥവാ പിൻവാങ്ങുക എന്ന മത്തായിയിലെ സൂക്ഷ്മഭാവം നിലനിർത്തുന്നു; ‘ഓടിപ്പോയി’ എന്ന അതിശയോക്തി ഒഴിവാക്കുന്നു.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: ഗലീലയിലേക്കു
  rationale: εἰς എന്നതിന്റെ ദിശാസൂചന മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: യോഹന്നാനെ സംബന്ധിച്ച παραδίδωμι എന്ന ക്രിയയുടെ പരിഭാഷ
  choice: ഏല്പിക്കപ്പെട്ടു
  alternative: അറസ്റ്റുചെയ്യപ്പെട്ടു
  rationale: ഗ്രീക്ക് ക്രിയ ഒരു സാങ്കേതിക അറസ്റ്റുപദത്തേക്കാൾ വിശാലമാണ്; മത്തായിയിൽ ‘ഏല്പിക്കപ്പെടുക’ എന്ന പ്രതിധ്വനിയും അതിനുണ്ടാകാം. മുഖ്യവാചകം ആ അർത്ഥവ്യാപ്തി സംരക്ഷിക്കുകയും സന്ദർഭപരമായ പ്രത്യേക അർത്ഥം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
- issue: ἀνεχώρησεν എന്നതിന്റെ പ്രേരണ
  choice: പിൻവാങ്ങി
  alternative: പോയി
  rationale: മൂലപദത്തിലെ പ്രതികരണാത്മകമായ മാറിപ്പോകൽ സൂചിപ്പിക്കുന്നു; എന്നാൽ ഭയമോ പലായനമോ വാചകത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിൽ യേശുവിന്റെ പേര് ഈ വാക്യത്തിൽ തുറന്നുപറയുന്നില്ലെങ്കിലും കർത്താവ് മുൻസന്ദർഭത്തിൽനിന്ന് മനസ്സിലാക്കപ്പെടുന്നു; മലയാളത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ‘യേശു’ ചേർത്തിരിക്കുന്നു. δέ-യ്ക്ക് കൃത്രിമമായ ‘ഇപ്പോൾ’ ചേർക്കാതെ ആഖ്യാനപ്രവാഹം നിലനിർത്തി.
