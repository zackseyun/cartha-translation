  language: ml
  text: യോഹന്നാനെ ഏല്പിച്ചുവെന്ന്[a] കേട്ടപ്പോൾ, യേശു ഗലീലയിലേക്കു പിൻവാങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
