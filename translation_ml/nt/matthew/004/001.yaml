id: MAT.4.1
reference: Matthew 4:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τότε ὁ Ἰησοῦς ἀνήχθη εἰς τὴν ἔρημον ὑπὸ τοῦ πνεύματος, πειρασθῆναι ὑπὸ τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/001.yaml
  text: Then Jesus was led up into the wilderness by the Spirit to be tempted by the devil[a].
translation:
  language: ml
  text: അപ്പോൾ യേശു പിശാചിനാൽ പ്രലോഭിപ്പിക്കപ്പെടേണ്ടതിന് ആത്മാവിനാൽ മരുഭൂമിയിലേക്കു നയിക്കപ്പെട്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “പരീക്ഷിക്കപ്പെടേണ്ടതിന്”; ഗ്രീക്ക് ക്രിയയ്ക്ക് “പ്രലോഭിപ്പിക്കുക” എന്നും “പരീക്ഷിക്കുക” എന്നും അർഥമാകാം. ഇവിടെ തൊട്ടടുത്ത സന്ദർഭം “പ്രലോഭിപ്പിക്കപ്പെടുക” എന്ന അർഥത്തിനാണ് കൂടുതൽ യോജിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: അപ്പോൾ
  rationale: തുടർന്നുവരുന്ന സംഭവത്തെ കാലക്രമത്തിൽ ബന്ധിപ്പിക്കുന്ന സ്വാഭാവികമായ ആധുനിക മലയാള പ്രയോഗം.
- source_word: ἀνήχθη
  choice: നയിക്കപ്പെട്ടു
  rationale: ക്രിയയുടെ കർമണിപ്രയോഗം നിലനിർത്തുന്നു. ഗ്രീക്കിലെ മേലോട്ടുള്ള ചലനസൂചന മലയാളത്തിൽ ‘മുകളിലേക്കു നയിക്കപ്പെട്ടു’ എന്നു പറഞ്ഞാൽ അനാവശ്യമായ ഭൂപ്രദേശവിവരം തോന്നാൻ ഇടയുള്ളതിനാൽ സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
- source_word: εἰς τὴν ἔρημον
  choice: മരുഭൂമിയിലേക്ക്
  rationale: ἔρημος സൂചിപ്പിക്കുന്ന വിജനവും മനുഷ്യവാസം കുറഞ്ഞതുമായ പ്രദേശത്തിന് സന്ദർഭോചിതവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ പദം.
- source_word: ὑπὸ τοῦ πνεύματος
  choice: ആത്മാവിനാൽ
  rationale: സ്നാനവിവരണത്തിലെ തൊട്ടുമുൻപത്തെ സന്ദർഭം ദൈവത്തിന്റെ ആത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്; ഗ്രീക്കിൽ ഇല്ലാത്ത ‘പരിശുദ്ധ’ എന്ന വിശേഷണം മുഖ്യവാചകത്തിൽ ചേർക്കാതെ നിർദ്ദിഷ്ടത നിലനിർത്തുന്നു.
- source_word: πειρασθῆναι
  choice: പ്രലോഭിപ്പിക്കപ്പെടേണ്ടതിന്
  rationale: പിശാച് കർത്താവായിരിക്കുന്ന തുടർസന്ദർഭത്തിൽ ദോഷത്തിലേക്കുള്ള പ്രലോഭനമാണ് മുൻനിലയിൽ. എന്നാൽ പരീക്ഷിക്കുക എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ὑπὸ τοῦ διαβόλου
  choice: പിശാചിനാൽ
  rationale: διάβολος ഇവിടെ വ്യക്തിപരമായ എതിരാളിയുടെ അംഗീകൃത സ്ഥാനനാമമായി വരുന്നതിനാൽ മലയാളത്തിലെ പതിവും വ്യക്തവുമായ തത്തുല്യം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: τοῦ πνεύματος എന്നതിന്റെ തിരിച്ചറിയൽ
  choice: ‘ആത്മാവ്’ ദൈവത്തിന്റെ ആത്മാവിനെ സൂചിപ്പിക്കുന്നു
  alternative: ഒരു ആത്മാവ്; യേശുവിന്റെ മനുഷ്യാത്മാവ്
  rationale: തൊട്ടുമുൻപുള്ള സ്നാനവിവരണത്തിൽ യേശുവിന്മേൽ ഇറങ്ങിയ ആത്മാവുമായുള്ള സാഹിത്യബന്ധം ഈ വായനയെ ശക്തമായി പിന്തുണയ്ക്കുന്നു; എങ്കിലും മൂലത്തിൽ ഇല്ലാത്ത ‘പരിശുദ്ധ’ എന്ന പദം ചേർത്തിട്ടില്ല.
- issue: πειρασθῆναι എന്നതിന്റെ അർഥം
  choice: പ്രലോഭിപ്പിക്കപ്പെടുക
  alternative: പരീക്ഷിക്കപ്പെടുക
  rationale: പ്രവർത്തകൻ പിശാചായതും തുടർന്നുള്ള ദോഷപ്രേരണകളും ‘പ്രലോഭിപ്പിക്കുക’ എന്ന അർഥത്തെ മുൻനിർത്തുന്നു. ഗ്രീക്ക് ക്രിയയിലെ ‘പരീക്ഷിക്കുക’ എന്ന യഥാർഥ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
