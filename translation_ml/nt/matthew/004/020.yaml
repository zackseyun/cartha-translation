id: MAT.4.20
reference: Matthew 4:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ εὐθέως ἀφέντες τὰ δίκτυα ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/020.yaml
  text: And they immediately left the nets and followed him.
translation:
  language: ml
  text: അവർ ഉടനെ വലകൾ വിട്ട് അവനെ അനുഗമിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: അവർ
  rationale: δέ ഇവിടെ കഥയെ മുന്നോട്ടുകൊണ്ടുപോകുന്ന മൃദുവായ ബന്ധകമാണ്. മുൻവാക്യത്തോടുള്ള ബന്ധം മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിൽ പ്രത്യേകം ബന്ധപദമില്ലാതെയും വ്യക്തമാകുന്നതിനാൽ അത് വേർതിരിച്ച് പരിഭാഷപ്പെടുത്തിയിട്ടില്ല.
- source_word: εὐθέως
  choice: ഉടനെ
  rationale: εὐθέως സൂചിപ്പിക്കുന്ന താമസമില്ലാത്ത പ്രതികരണം സ്വാഭാവികവും വ്യക്തവുമായി നിലനിർത്തുന്നു.
- source_word: ἀφέντες
  choice: ഉപേക്ഷിച്ച്
  rationale: ആദ്യം വലകൾ വിട്ടശേഷം അനുഗമിച്ചു എന്ന പൂർവകാലിക ബന്ധം മലയാളത്തിലെ ക്രിയാവിശേഷണരൂപം സ്വാഭാവികമായി നൽകുന്നു. സന്ദർഭത്തിൽ ഇത് വെറും സ്ഥലത്ത് വെച്ചുപോകുന്നതിലുപരി തൊഴിൽോപകരണങ്ങൾ വിട്ടുള്ള പ്രതികരണത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും അതിരുകടന്ന അന്തിമത്യാഗം നിർബന്ധിക്കുന്നില്ല.
- source_word: τὰ δίκτυα
  choice: വലകൾ
  rationale: സന്ദർഭത്തിൽ ഇവ മീൻപിടിത്തവലകളാണെന്ന് വ്യക്തമാണ്. ഗ്രീക്കിലെ നിർദ്ദിഷ്ടത മലയാളത്തിൽ സ്വാഭാവികമായി പ്രത്യേക നിർദ്ദേശകമില്ലാതെ പ്രകടമാകുന്നു; ‘അവരുടെ’ അല്ലെങ്കിൽ ‘മീൻപിടിത്ത’ എന്ന് ചേർത്തിട്ടില്ല.
- source_word: ἠκολούθησαν αὐτῷ
  choice: അവനെ അനുഗമിച്ചു
  rationale: ἀκολουθέω എന്നതിന്റെ ശാരീരികമായി പിന്നാലെ ചെല്ലുക എന്ന അർഥവും ശിഷ്യത്വബന്ധത്തിന്റെ വളർന്നുവരുന്ന സൂചനയും ‘അനുഗമിച്ചു’ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἠκολούθησαν αὐτῷ എന്നതിലെ ശിഷ്യത്വസൂചന
  choice: അവനെ അനുഗമിച്ചു
  alternative: അവന്റെ പിന്നാലെ പോയി
  rationale: ‘അനുഗമിച്ചു’ എന്നത് യഥാർഥ പിന്നാലെ ചെല്ലലിനെയും സുവിശേഷസന്ദർഭത്തിലെ ശിഷ്യത്വബന്ധത്തെയും ഒരുമിച്ച് തുറന്നുവയ്ക്കുന്നു; വാക്യം പറയുന്നതിനെക്കാൾ വ്യക്തമായ സിദ്ധാന്തഭാഷ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. ഗ്രീക്ക് പങ്കുപദത്തിന്റെ ക്രമബന്ധം ‘ഉപേക്ഷിച്ച്’ എന്ന രൂപത്തിലൂടെ സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
