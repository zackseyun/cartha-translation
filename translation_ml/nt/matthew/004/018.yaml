id: MAT.4.18
reference: Matthew 4:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Περιπατῶν δὲ παρὰ τὴν θάλασσαν τῆς Γαλιλαίας εἶδεν δύο ἀδελφούς, Σίμωνα τὸν λεγόμενον Πέτρον καὶ Ἀνδρέαν τὸν ἀδελφὸν αὐτοῦ, βάλλοντας ἀμφίβληστρον εἰς τὴν θάλασσαν, ἦσαν γὰρ ἁλιεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/018.yaml
  text: As he was walking beside the Sea of Galilee[a], he saw two brothers, Simon who is called Peter and Andrew his brother, casting a net into the sea, for they were fishermen.
translation:
  language: ml
  text: അവൻ ഗലീലക്കടലിന്റെ തീരത്തുകൂടെ നടക്കുമ്പോൾ, രണ്ടു സഹോദരന്മാരെ കണ്ടു—പത്രോസ് എന്നു വിളിക്കപ്പെടുന്ന ശിമോനെയും അവന്റെ സഹോദരനായ അന്ത്രെയൊസിനെയും. അവർ കടലിലേക്കു വല[a] വീശുകയായിരുന്നു; കാരണം, അവർ മീൻപിടിത്തക്കാരായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വീശുവല”; ഗ്രീക്ക് പദം മീൻപിടിക്കാൻ എറിഞ്ഞുവീശുന്ന ഒരുതരം വലയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περιπατῶν
  choice: നടക്കുമ്പോൾ
  rationale: വർത്തമാനകാല കൃദന്തരൂപം മുഖ്യക്രിയയായ ‘കണ്ടു’ എന്നതിനോടൊപ്പം നടന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘നടക്കുമ്പോൾ’ സ്വാഭാവികമായി അതു പ്രകടമാക്കുന്നു.
- source_word: παρὰ τὴν θάλασσαν
  choice: കടലിന്റെ തീരത്തുകൂടെ
  rationale: παρά + accusative ഇവിടെ കടലിനരികിലൂടെയുള്ള സഞ്ചാരത്തെ സൂചിപ്പിക്കുന്നു; ‘തീരത്തുകൂടെ’ ചലനവും സമീപസ്ഥിതിയും വ്യക്തമായി നൽകുന്നു.
- source_word: θάλασσαν τῆς Γαλιλαίας
  choice: ഗലീലക്കടൽ
  rationale: സ്ഥിരമായി ഉപയോഗിക്കുന്ന ഭൂമിശാസ്ത്രനാമം; ജലാശയം തടാകമാണെങ്കിലും മൂലത്തിലെ θάλασσα എന്ന നാമപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: δύο ἀδελφούς
  choice: രണ്ടു സഹോദരന്മാരെ
  rationale: ഇവിടെ പേരെടുത്തുപറയുന്ന രണ്ടു പുരുഷ സഹോദരന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ വിഭക്തിരൂപം εἶδεν എന്ന ക്രിയയുടെ കർമമായി യോജിക്കുന്നു.
- source_word: Σίμωνα τὸν λεγόμενον Πέτρον
  choice: പത്രോസ് എന്നു വിളിക്കപ്പെടുന്ന ശിമോനെ
  rationale: λεγόμενον എന്ന കൃദന്തരൂപത്തിന്റെ അർഥം സംരക്ഷിക്കുന്ന സ്വാഭാവിക മലയാള ബന്ധവാക്യപ്രയോഗം.
- source_word: Ἀνδρέαν τὸν ἀδελφὸν αὐτοῦ
  choice: അവന്റെ സഹോദരനായ അന്ത്രയോസിനെ
  rationale: ശിമോനുമായുള്ള അന്ത്രയോസിന്റെ ബന്ധം വ്യക്തമാക്കുന്ന appositional പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: βάλλοντας ἀμφίβληστρον
  choice: വല വീശുകയായിരുന്നു
  rationale: അവരെ കണ്ട സമയത്ത് നടന്നുകൊണ്ടിരുന്ന പ്രവൃത്തി വർത്തമാന കൃദന്തം സൂചിപ്പിക്കുന്നു. ἀμφίβληστρον പ്രത്യേകിച്ച് എറിഞ്ഞുവീശുന്ന മീൻവലയായതിനാൽ ‘വീശുകയായിരുന്നു’ അതിന്റെ ഉപയോഗരീതി പ്രകടമാക്കുന്നു; പ്രത്യേക വലയുടെ പേര് അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: εἰς τὴν θάλασσαν
  choice: കടലിലേക്കു
  rationale: εἰς സൂചിപ്പിക്കുന്ന ദിശാഗതിയെ ‘-ലേക്കു’ കൃത്യമായി പ്രകടമാക്കുന്നു.
- source_word: ἦσαν γὰρ ἁλιεῖς
  choice: കാരണം, അവർ മീൻപിടിത്തക്കാരായിരുന്നു
  rationale: γάρ നൽകുന്ന വിശദീകരണബന്ധം ‘കാരണം’ വ്യക്തമാക്കുന്നു; ἁλιεῖς അവരുടെ തൊഴിൽ സൂചിപ്പിക്കുന്നതിനാൽ ‘മീൻപിടിത്തക്കാർ’ എന്ന സാധാരണ ആധുനിക പദം ഉപയോഗിക്കുന്നു.
