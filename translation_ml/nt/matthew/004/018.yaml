translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. പേരുകൾ മലയാള ക്രൈസ്തവ ഉപയോഗത്തിൽ പരിചിതമായ രൂപങ്ങളിൽ നൽകിയിരിക്കുന്നു. ദീർഘമായ ഗ്രീക്ക് വാക്യഘടന വായനാസൗകര്യത്തിനായി രണ്ടു വാക്യങ്ങളാക്കിയെങ്കിലും സംഭവക്രമവും വിശദീകരണബന്ധവും സംരക്ഷിച്ചു.
