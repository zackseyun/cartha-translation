id: MAT.4.17
reference: Matthew 4:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀπὸ τότε ἤρξατο ὁ Ἰησοῦς κηρύσσειν καὶ λέγειν· Μετανοεῖτε, ἤγγικεν γὰρ ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/017.yaml
  text: From that time Jesus began to proclaim[a], saying, “Repent[c][b], for the kingdom of heaven has drawn near.”
translation:
  language: ml
  text: 'അന്നുമുതൽ യേശു പ്രസംഗിച്ചുതുടങ്ങി: “മാനസാന്തരപ്പെടുവിൻ; സ്വർഗരാജ്യം അടുത്തുവന്നിരിക്കുന്നു.[a]”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അടുത്തിരിക്കുന്നു” അല്ലെങ്കിൽ “സമീപിച്ചിരിക്കുന്നു” എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്കിലെ പൂർണകാലക്രിയ, രാജ്യം അടുത്തുവന്നതും ആ സമീപസ്ഥിതി തുടരുന്നതും ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥത്തിൽ: “പ്രസംഗിക്കാനും പറയാനും തുടങ്ങി.” ഇവിടെ “പറയാനും” എന്നത് തുടർന്നുള്ള ഉദ്ധരണിയുടെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു.'
    reason: previous_rendering
lexical_decisions:
- source_word: Ἀπὸ τότε
  choice: അന്നുമുതൽ
  rationale: ആഖ്യാനത്തിലെ നിർണായകമായ കാലമാറ്റവും തുടർന്ന് ആരംഭിക്കുന്ന പ്രവർത്തനവും സ്വാഭാവികമായ മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἤρξατο
  choice: തുടങ്ങി
  rationale: പൂരകക്രിയയോടുകൂടിയ ἤρξατοയുടെ ആരംഭാർഥം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: κηρύσσειν καὶ λέγειν
  choice: പ്രസംഗിച്ചുതുടങ്ങി
  rationale: κηρύσσειν എന്ന പരസ്യപ്രഖ്യാപനത്തിന്റെ ആശയം ‘പ്രസംഗിക്കുക’ നൽകുന്നു; καὶ λέγειν ഉദ്ധരണിയുടെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ വേറൊരു ആവർത്തനക്രിയ ചേർക്കാതെ കോളൺ ഉപയോഗിച്ച് സ്വാഭാവികമാക്കി. അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: Μετανοεῖτε
  choice: മാനസാന്തരപ്പെടുവിൻ
  rationale: മനസ്സിന്റെയും ജീവിതദിശയുടെയും നിർണായകമായ മാറ്റത്തിനുള്ള ബഹുവചന കല്പനയെ മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും ഗൗരവമുള്ളതുമായ പദംകൊണ്ട് നിലനിർത്തുന്നു.
- source_word: ἤγγικεν
  choice: അടുത്തുവന്നിരിക്കുന്നു
  rationale: അടുപ്പം സംഭവിച്ചുകഴിഞ്ഞതും അതിന്റെ ഫലം ഇപ്പോഴും നിലനിൽക്കുന്നതുമായ ഗ്രീക്ക് പൂർണകാലത്തിന്റെ ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: βασιλεία τῶν οὐρανῶν
  choice: സ്വർഗരാജ്യം
  rationale: മത്തായിയുടെ സവിശേഷപ്രയോഗം സ്വാഭാവികവും സ്ഥാപിതവുമായ മലയാളത്തിൽ നൽകുന്നു; βασιλείαയിലെ രാജത്വം/ഭരണം എന്ന ആശയസാധ്യതയെ നിഷേധിക്കുന്നില്ല.
theological_decisions:
- issue: βασιλεία τῶν οὐρανῶν എന്ന പ്രയോഗത്തിന്റെ അർഥവ്യാപ്തി
  choice: സ്വർഗരാജ്യം
  alternative: സ്വർഗങ്ങളുടെ രാജ്യം; സ്വർഗത്തിന്റെ ഭരണം
  rationale: മത്തായിയുടെ സവിശേഷമായ പ്രയോഗം നിലനിർത്തുകയും അതിനെ ഒരു സ്ഥലം മാത്രമായോ ഒരു പ്രത്യേക സിദ്ധാന്തവ്യാഖ്യാനമായോ ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: Μετανοεῖτε എന്ന കല്പനയുടെ ശക്തി
  choice: മാനസാന്തരപ്പെടുവിൻ
  alternative: തിരിഞ്ഞുവരുവിൻ; മനസ്സുമാറ്റുവിൻ
  rationale: വെറും ബൗദ്ധികമായ അഭിപ്രായമാറ്റത്തേക്കാൾ മനസ്സും ജീവിതദിശയും ഉൾപ്പെടുന്ന തിരിവിനെ സൂചിപ്പിക്കുന്നു; അതേസമയം പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ നിർവചനം കുത്തിനിറക്കുന്നില്ല.
- issue: ἤγγικεν എന്ന പൂർണകാലരൂപം
  choice: അടുത്തുവന്നിരിക്കുന്നു
  alternative: അടുത്തിരിക്കുന്നു; സമീപിച്ചിരിക്കുന്നു
  rationale: രാജ്യത്തിന്റെ സമീപനം സംഭവിച്ചുകഴിഞ്ഞതും അതിന്റെ സമീപസ്ഥിതി തുടരുന്നതുമായ വാക്യത്തിന്റെ കാലപരമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ബൈബിൾ ശൈലി. ‘മാനസാന്തരപ്പെടുവിൻ’, ‘സ്വർഗരാജ്യം’ എന്നീ പരിചിത പദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന അനാവശ്യമായി പുരാതനമാക്കിയിട്ടില്ല. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
