reference: Matthew 4:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Γέγραπται· Οὐκ ἐπ’ ἄρτῳ μόνῳ ζήσεται ⸀ὁ ἄνθρωπος, ἀλλ’ ⸀ἐπὶ παντὶ ῥήματι ἐκπορευομένῳ διὰ στόματος θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/004.yaml
  text: 'But he answered[a], “It is written: ‘Man will not live by bread alone[b], but by every word proceeding through the mouth of God.’”'
translation:
  language: ml
  text: 'എന്നാൽ അവൻ ഉത്തരം പറഞ്ഞു: “എഴുതപ്പെട്ടിരിക്കുന്നു: ‘മനുഷ്യൻ[a] അപ്പംകൊണ്ടു മാത്രമല്ല, ദൈവത്തിന്റെ വായിലൂടെ[b] പുറപ്പെടുന്ന ഓരോ വാക്കുകൊണ്ടും ജീവിക്കും.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘മനുഷ്യൻ’ എന്ന ഏകവചനം മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു; ഒരു പ്രത്യേക പുരുഷനെ മാത്രമല്ല.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ ‘ദൈവത്തിന്റെ വായിലൂടെ’ എന്നാണ്. ‘ദൈവത്തിന്റെ വായിൽനിന്ന്’ എന്നും വിവർത്തനം ചെയ്യാം; എന്നാൽ ഇവിടെ ഗ്രീക്കിലെ ‘വഴിയായി/ഇതിലൂടെ’ എന്ന ഭാവം നിലനിർത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: ഉത്തരം പറഞ്ഞു
  rationale: ‘ഉത്തരം പറഞ്ഞിട്ട് പറഞ്ഞു’ എന്ന ആവർത്തനം ഒഴിവാക്കി, ഗ്രീക്കിലെ സെമിറ്റിക് സ്വാധീനമുള്ള പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: Γέγραπται
  choice: എഴുതപ്പെട്ടിരിക്കുന്നു
  rationale: തിരുവെഴുത്ത് ഉദ്ധരിക്കുന്ന പൂർണ നിഷ്ക്രിയരൂപത്തിന്റെ നിലനിൽക്കുന്ന പ്രാബല്യം സൂചിപ്പിക്കുന്ന പതിവ് മലയാളപ്രയോഗം.
- source_word: ἄρτῳ μόνῳ
  choice: അപ്പംകൊണ്ടു മാത്രം
  rationale: ἄρτος എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘അപ്പം’ നിലനിർത്തുന്നു; ‘ഭക്ഷണം’ എന്നു വിശാലമാക്കുന്നില്ല.
- source_word: ζήσεται
  choice: ജീവിക്കുകയില്ല … ജീവിക്കും
  rationale: ഭാവികാലത്തെ സ്വാഭാവികമായി നൽകുന്നു; രണ്ടാമത്തെ ഖണ്ഡത്തിൽ ഗ്രീക്കിൽ സൂചിതമായ ക്രിയ മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ആവർത്തിക്കുന്നു.
- source_word: ὁ ἄνθρωπος
  choice: മനുഷ്യൻ
  rationale: ഒരു പ്രത്യേക പുരുഷനെ അല്ല, മനുഷ്യരെ പൊതുവായി പ്രതിനിധീകരിക്കുന്ന ഏകവചനമാണിത്; മലയാളത്തിലെ ‘മനുഷ്യൻ’ ആ പൊതുവായ അർഥം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: παντὶ ῥήματι
  choice: ഓരോ വാക്കുകൊണ്ടും
  rationale: ദൈവം ഉച്ചരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ῥῆμα എന്ന പദം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ‘വാക്ക്’ എന്നു പരിഭാഷപ്പെടുത്തി; παντίയുടെ വിതരണാത്മക അർഥം ‘ഓരോ’ നിലനിർത്തുന്നു.
- source_word: ἐκπορευομένῳ
  choice: പുറപ്പെടുന്ന
  rationale: ദൈവത്തിന്റെ വായിൽനിന്ന് വാക്ക് പുറപ്പെടുന്ന ദൃശ്യരൂപം നിലനിർത്തുന്ന സ്വാഭാവിക വർത്തമാന കൃദന്തരൂപം.
- source_word: διὰ στόματος θεοῦ
  choice: ദൈവത്തിന്റെ വായിലൂടെ
  rationale: διά + genitive എന്നതിന്റെ ‘വഴിയായി/ഇലൂടെ’ എന്ന അർഥം പിന്തുടർന്ന് ദൈവിക ഉച്ചാരണത്തിന്റെ രൂപകം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ὁ ἄνθρωπος എന്ന പ്രതിനിധിക ഏകവചനം
  choice: മനുഷ്യൻ
  alternative: ഒരു മനുഷ്യജീവി / മനുഷ്യർ
  rationale: വാക്യം മനുഷ്യജീവിതത്തെക്കുറിച്ചുള്ള പൊതുസത്യം പ്രസ്താവിക്കുന്നു. മൂലത്തിലെ ഏകവചനരൂപം നിലനിർത്തിക്കൊണ്ട് അതിന്റെ സർവമാനവിക വ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: Γέγραπται എന്ന തിരുവെഴുത്ത്-ഉദ്ധരണിസൂത്രം
  choice: എഴുതപ്പെട്ടിരിക്കുന്നു
  alternative: എഴുതിയിരിക്കുന്നു
  rationale: നിഷ്ക്രിയരൂപവും എഴുതപ്പെട്ട വചനം ഇപ്പോഴും നിലനിൽക്കുന്നു എന്ന പൂർണകാലസൂചനയും അനാവശ്യ വ്യാഖ്യാനം ചേർക്കാതെ സംരക്ഷിക്കുന്നു.
- issue: διὰ στόματος θεοῦ എന്ന പ്രയോഗത്തിലെ ബന്ധം
  choice: ദൈവത്തിന്റെ വായിലൂടെ
  alternative: ദൈവത്തിന്റെ വായിൽനിന്ന്
  rationale: മൂലപാഠത്തിലെ διάയുടെ ‘ഇലൂടെ’ എന്ന രൂപം സംരക്ഷിക്കുന്നു; കൂടുതൽ പരിചിതമായ ‘വായിൽനിന്ന്’ എന്ന പ്രയോഗത്തിലേക്ക് നിശ്ശബ്ദമായി മാറ്റുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഉദ്ധരണിയുടെ തിരുവെഴുത്തുസ്വരം നിലനിർത്തിയെങ്കിലും ദൈനംദിന വായനയ്ക്ക് അപരിചിതമായ അതിപുരാതന പദങ്ങൾ ഒഴിവാക്കി. ഗ്രീക്കിലെ രണ്ടാം ഖണ്ഡത്തിൽ ക്രിയ സൂചിതമാത്രമായതിനാൽ, മലയാളത്തിലെ പൂർണതക്കും വ്യക്തതക്കും ‘ജീവിക്കും’ ചേർത്തിരിക്കുന്നു.
