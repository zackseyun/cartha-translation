id: MAT.4.15
reference: Matthew 4:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Γῆ Ζαβουλὼν καὶ γῆ Νεφθαλίμ, ὁδὸν θαλάσσης, πέραν τοῦ Ἰορδάνου, Γαλιλαία τῶν ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/015.yaml
  text: Land of Zebulun and land of Naphtali[a], the way of the sea, beyond the Jordan, Galilee of the Gentiles—
translation:
  language: ml
  text: സെബൂലൂൻ ദേശവും നഫ്താലി ദേശവും, കടൽവഴി, യോർദ്ദാന്റെ അപ്പുറം, വിജാതീയരുടെ ഗലീല[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ജനതകളുടെ ഗലീല.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Γῆ Ζαβουλὼν καὶ γῆ Νεφθαλίμ
  choice: സെബൂലൂൻ ദേശവും നഫ്താലി ദേശവും
  rationale: ‘ദേശം’ ഭൂമിശാസ്ത്രപരമായ പ്രദേശത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ആവർത്തനവും സമാന്തരഘടനയും നിലനിർത്തുന്നു. പേരുകൾ മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ രൂപങ്ങളിൽ നൽകിയിരിക്കുന്നു.
- source_word: ὁδὸν θαλάσσης
  choice: കടൽവഴി
  rationale: ഒരു നിർദിഷ്ട പാതയെയോ കടലുമായി ബന്ധപ്പെട്ട പ്രദേശത്തെയോ സൂചിപ്പിക്കാവുന്ന മൂലവാക്യത്തിന്റെ സംക്ഷിപ്തതയും അർഥവ്യാപ്തിയും ഇത് നിലനിർത്തുന്നു; ‘കടലിലേക്കുള്ള വഴി’ എന്ന് നൽകി ദിശ അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: യോർദ്ദാനക്കരെ
  rationale: കാഴ്ചപ്പാട് കൂടുതൽ വ്യക്തമാക്കാതെ ‘യോർദ്ദാന്റെ മറുവശത്ത്/അപ്പുറം’ എന്ന ഭൂമിശാസ്ത്രപരമായ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: Γαλιλαία
  choice: ഗലീല
  rationale: പ്രദേശനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ബൈബിൾരൂപം.
- source_word: τῶν ἐθνῶν
  choice: വിജാതീയരുടെ
  rationale: മത്തായിയുടെ യഹൂദസന്ദർഭത്തിൽ യഹൂദരല്ലാത്ത ജനവിഭാഗങ്ങളുമായുള്ള ബന്ധമാണ് പ്രധാനമായി സൂചിപ്പിക്കുന്നത്. ‘വിജാതീയർ’ ആ വ്യത്യാസം ആധുനിക വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; ‘ജനതകൾ’ എന്ന വിശാലമായ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: യെശയ്യാവിൽനിന്നുള്ള ഉദ്ധരണിയിലെ ἐθνῶν എന്ന പദത്തിന്റെ അർഥം
  choice: വിജാതീയരുടെ
  alternative: ജനതകളുടെ
  rationale: ഈ സന്ദർഭത്തിൽ യഹൂദരല്ലാത്തവരെയാണ് പ്രയോഗം പ്രധാനമായി സൂചിപ്പിക്കുന്നത്; എങ്കിലും ഗ്രീക്ക് പദത്തിന് ‘ജനതകൾ’ എന്ന വിശാലമായ അർഥവും സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: കാവ്യാത്മകമായ പ്രവചനോദ്ധരണിയുടെ പട്ടികാസദൃശ ഘടനയും അവസാനത്തെ അപൂർണത സൂചിപ്പിക്കുന്ന ദീർഘരേഖയും നിലനിർത്തി. ഭാഷ ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമാണ്.
