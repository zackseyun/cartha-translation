  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ ἐπὶ τὰ πετρώδη σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων καὶ εὐθὺς μετὰ χαρᾶς λαμβάνων αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/020.yaml
  text: As for the one sown on the rocky ground[a], this is the one who hears the word and immediately receives it with joy,
translation:
  language: ml
  text: പാറക്കെട്ടുള്ള സ്ഥലങ്ങളിൽ വിതയ്ക്കപ്പെട്ടവനോ[a], വചനം കേൾക്കുകയും ഉടനെ സന്തോഷത്തോടെ അത് സ്വീകരിക്കുകയും ചെയ്യുന്നവനാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘പാറയുള്ള ഇടങ്ങളിൽ വിതയ്ക്കപ്പെട്ടവൻ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἐπὶ τὰ πετρώδη σπαρείς
  choice: പാറനിലങ്ങളിൽ വിതയ്ക്കപ്പെട്ടവനോ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ കർമണി ഭൂതകാല കൃദന്തപ്രയോഗം വ്യക്തിയെ സൂചിപ്പിക്കുന്ന നാമപ്രയോഗമായി നിലനിർത്തുന്നു; വിത്തിനെയും കേൾക്കുന്ന വ്യക്തിയെയും ചേർത്തുനിർത്തുന്ന ഗ്രീക്കിലെ സംക്ഷിപ്ത രൂപകവും സംരക്ഷിക്കുന്നു. δέ-യുടെ മൃദുവായ വിഷയമാറ്റം ‘-ഓ’ വഴി സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: πετρώδη
  choice: പാറനിലങ്ങളിൽ
  rationale: പാറയോ കല്ലോ നിറഞ്ഞ കൃഷിനിലത്തെ സൂചിപ്പിക്കുന്നു. ബഹുവചനരൂപമായ τὰ πετρώδη-നോട് അടുത്തുനിൽക്കുന്നതോടൊപ്പം മലയാളത്തിൽ കൃഷിരൂപകത്തിന് സ്വാഭാവികമാണ്.
- source_word: σπαρείς
  choice: വിതയ്ക്കപ്പെട്ടവൻ
  rationale: σπείρω എന്ന ക്രിയയുടെ aorist passive participle ആയതിനാൽ കർമണി അർഥവും വിതയ്ക്കൽരൂപകവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: οὗτός ἐστιν
  choice: ചെയ്യുന്നവനാണ്
  rationale: ഗ്രീക്കിലെ തിരിച്ചറിയിക്കൽവാക്യം മലയാളത്തിലെ ബന്ധവാക്യഘടനയിൽ സ്വാഭാവികമായി ചേർക്കുന്നു; ‘പ്രതിനിധീകരിക്കുന്നു’ എന്ന വ്യാഖ്യാനവികാസം ഒഴിവാക്കുന്നു.
- source_word: ὁ τὸν λόγον ἀκούων
  choice: വചനം കേൾക്കുകയും … ചെയ്യുന്നവൻ
  rationale: വർത്തമാന കൃദന്തത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ ബന്ധവാക്യമായി നൽകുന്നു. λόγος എന്ന പദത്തിന്റെ വേദപാഠപരമായ അനുരണനം നിലനിർത്താൻ ‘സന്ദേശം’ എന്നതിനു പകരം ‘വചനം’ സ്വീകരിക്കുന്നു.
- source_word: εὐθὺς
  choice: ഉടനെ
  rationale: പ്രതികരണത്തിന്റെ തൽക്ഷണസ്വഭാവം വ്യക്തവും സാധാരണവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: μετὰ χαρᾶς
  choice: സന്തോഷത്തോടെ
  rationale: χαράയുടെ ആനന്ദഭാവം സ്വാഭാവിക മലയാള ക്രിയാവിശേഷണപ്രയോഗത്തിലൂടെ കൃത്യമായി നൽകുന്നു.
- source_word: λαμβάνων αὐτόν
  choice: അത് സ്വീകരിക്കുകയും
  rationale: λαμβάνωയുടെ സ്വീകരിക്കുക/അംഗീകരിക്കുക എന്ന സന്ദർഭാർഥം ‘സ്വീകരിക്കുക’ വ്യക്തമായി വഹിക്കുന്നു; ‘അത്’ എന്നത് വചനത്തെ തിരിച്ചുസൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഉപമാവ്യാഖ്യാനത്തിൽ വിതയ്ക്കപ്പെട്ടവന്റെ സൂചിതാർഥം
  choice: ‘പാറനിലങ്ങളിൽ വിതയ്ക്കപ്പെട്ടവൻ’ എന്ന സംക്ഷിപ്ത രൂപകം നിലനിർത്തി, തുടർന്നുള്ള വാക്യഭാഗം അവനെ വചനം കേൾക്കുന്ന വ്യക്തിയായി തിരിച്ചറിയാൻ അനുവദിച്ചു.
  alternative: ‘പാറനിലത്തിൽ വിതച്ച വിത്ത് വചനം കേൾക്കുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്നു’ എന്ന് വ്യാഖ്യാനാത്മകമായി വികസിപ്പിക്കുക.
  rationale: ഗ്രീക്ക് പാഠം വിത്തിനെയും അതു പ്രതിനിധീകരിക്കുന്ന വ്യക്തിയെയും ഒരേ സംക്ഷിപ്ത പ്രയോഗത്തിൽ ചേർത്തുനിർത്തുന്നു. വ്യാഖ്യാനപരമായി അത് അഴിച്ചുപറയാതെ യഥാർഥ രൂപകസംഘർഷം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ സംക്ഷിപ്ത രൂപകം നിലനിർത്തിയതിനാൽ ആദ്യപ്രയോഗത്തിൽ ഉദ്ദേശപൂർവമായ ചെറിയ അസാധാരണതയുണ്ട്; അടിക്കുറിപ്പ് കൂടുതൽ അക്ഷരാർഥരൂപം നൽകുന്നു.
