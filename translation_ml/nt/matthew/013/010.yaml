id: MAT.13.10
reference: Matthew 13:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ προσελθόντες οἱ μαθηταὶ εἶπαν αὐτῷ· Διὰ τί ἐν παραβολαῖς λαλεῖς αὐτοῖς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/010.yaml
  text: Then the disciples came up and said to him[a], “Why do you speak to them in parables?”
translation:
  language: ml
  text: 'അപ്പോൾ ശിഷ്യന്മാർ യേശുവിന്റെ അടുത്ത് വന്ന്[a] അവനോട് പറഞ്ഞു: “അങ്ങ് അവരോട് ഉപമകളിലൂടെ സംസാരിക്കുന്നത് എന്തുകൊണ്ടാണ്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സമീപിച്ച്’; ശിഷ്യന്മാർ സംസാരിക്കുന്നതിനുമുമ്പ് യേശുവിന്റെ അടുത്തേക്ക് ചെന്നുവെന്ന് ഗ്രീക്ക് കൃദ്യന്തരൂപം ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: അപ്പോൾ
  rationale: ഇവിടെ καί വിവരണത്തിന്റെ അടുത്ത ഘട്ടത്തിലേക്കുള്ള നീക്കം സൂചിപ്പിക്കുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായ മലയാള ആഖ്യാനപ്രവാഹം നൽകുന്നു.
- source_word: προσελθόντες
  choice: യേശുവിന്റെ അടുത്തുവന്ന്
  rationale: προσέρχομαι യേശുവിന്റെ അടുക്കലേക്കുള്ള സമീപനവും സംസാരിക്കുന്നതിന് മുമ്പുണ്ടായ ചലനവും സൂചിപ്പിക്കുന്നു. ലക്ഷ്യം ഗ്രീക്കിൽ സർവനാമസന്ദർഭത്തിൽ വ്യക്തമാകുന്നതിനാൽ മലയാളത്തിൽ ‘യേശുവിന്റെ’ എന്ന് ചേർക്കുന്നത് സ്വാഭാവികമായ വ്യക്തത നൽകുന്നു.
- source_word: οἱ μαθηταὶ
  choice: ശിഷ്യന്മാർ
  rationale: നിശ്ചിതമായ, ഇതിനകം അറിയപ്പെടുന്ന ശിഷ്യസംഘത്തെയാണ് ലേഖനം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ പ്രത്യേക നിർദേശപദം ആവശ്യമില്ല.
- source_word: εἶπαν αὐτῷ
  choice: അവനോട് ചോദിച്ചു
  rationale: വാച്യമായി ‘അവനോട് പറഞ്ഞു’ എന്നാണെങ്കിലും നേരിട്ടുള്ള ചോദ്യം അവതരിപ്പിക്കുന്നതിനാൽ ആധുനിക മലയാളത്തിൽ ‘ചോദിച്ചു’ കൂടുതൽ സ്വാഭാവികമാണ്; സംസാരപ്രവൃത്തിയുടെ അർത്ഥം നിലനിൽക്കുന്നു.
- source_word: Διὰ τί
  choice: എന്തുകൊണ്ടാണ്
  rationale: കാരണത്തെക്കുറിച്ചുള്ള നേരിട്ടുള്ള ചോദ്യം സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: ἐν παραβολαῖς
  choice: ഉപമകളിലൂടെ
  rationale: ἐν ഇവിടെ സംസാരത്തിന്റെ മാധ്യമമോ രീതിയോ സൂചിപ്പിക്കുന്നു; ‘ഉപമകളിലൂടെ’ എന്നത് ആ അർത്ഥം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: λαλεῖς
  choice: സംസാരിക്കുന്നത്
  rationale: വർത്തമാനകാലത്തിലുള്ള തുടർച്ചയായ/പതിവായ സംസാരരീതിയെ മലയാള ചോദ്യഘടനയിൽ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: αὐτοῖς
  choice: അവരോട്
  rationale: യേശു അഭിസംബോധന ചെയ്യുന്ന ശ്രോതാക്കളെ സൂചിപ്പിക്കുന്ന ദത്തിവ് സർവനാമത്തിന്റെ നേരിട്ടുള്ള മലയാളരൂപം.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. യേശുവിനെ അഭിസംബോധന ചെയ്യുമ്പോൾ ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു; വിവരണത്തിൽ ഗ്രീക്കിന്റെ മൂന്നാംപുരുഷ ഏകവചനത്തിന് ‘അവൻ/അവനോട്’ നിലനിർത്തി. അടിക്കുറിപ്പിന്റെ [a] ചിഹ്നം മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
