id: MAT.13.24
reference: Matthew 13:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν παρέθηκεν αὐτοῖς λέγων· Ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ ⸀σπείραντι καλὸν σπέρμα ἐν τῷ ἀγρῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/024.yaml
  text: He set another parable before them[a], saying, “The kingdom of heaven is like a man who sowed good seed in his field.”
translation:
  language: ml
  text: 'അവൻ അവർക്കു മറ്റൊരു ഉപമ അവതരിപ്പിച്ച് ഇങ്ങനെ പറഞ്ഞു: “സ്വർഗരാജ്യം തന്റെ വയലിൽ നല്ല വിത്ത് വിതച്ച ഒരു മനുഷ്യനെപ്പോലെയാണ്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄλλην παραβολὴν
  choice: മറ്റൊരു ഉപമ
  rationale: ἄλλην ഇവിടെ തുടർച്ചയിലെ ഒരു അധിക ഉപമയെ പരിചയപ്പെടുത്തുന്നു; ‘മറ്റൊരു ഉപമ’ സ്വാഭാവികമായി ആ ക്രമം നിലനിർത്തുന്നു.
- source_word: παρέθηκεν αὐτοῖς
  choice: അവരുടെ മുമ്പിൽ വെച്ചു
  rationale: παρατίθημι എന്ന ക്രിയയിലെ ‘മുമ്പിൽ വെക്കുക/അവതരിപ്പിക്കുക’ എന്ന സജീവ രൂപകം നിലനിർത്തുന്നു; പഠിപ്പിക്കാനായി ഒരു ഉപമ അവതരിപ്പിക്കുന്നതെന്ന അർഥവും സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: λέγων
  choice: ഇങ്ങനെ പറഞ്ഞു
  rationale: ഉദ്ധരണിയിലേക്കുള്ള ഗ്രീക്ക് വർത്തമാന കൃദന്തരൂപത്തിന്റെ ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: Ὡμοιώθη
  choice: സദൃശമായിരിക്കുന്നു
  rationale: അക്ഷരാർഥത്തിലുള്ള നിഷ്ക്രിയവും ഫലാവസ്ഥയും ഭാഗികമായി നിലനിർത്തിക്കൊണ്ട്, ഉപമയുടെ ആമുഖമായി വായിക്കാവുന്ന മാന്യമായ മലയാളരൂപം ഉപയോഗിക്കുന്നു; ലളിതമായ ‘പോലെയാണ്’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: സ്വർഗരാജ്യം
  rationale: മത്തായിയുടെ സവിശേഷ പ്രയോഗത്തെ മലയാളത്തിൽ സ്ഥിരമായി സൂചിപ്പിക്കുന്ന, സ്വാഭാവികവും സ്ഥാപിതവുമായ സംയുക്തപദമാണ്.
- source_word: ἀνθρώπῳ
  choice: ഒരു മനുഷ്യനോട്
  rationale: ഉപമയിലെ പുരുഷകഥാപാത്രത്തെ കൃത്യമായി സൂചിപ്പിക്കുന്നു; പൊതുവായ ‘ഒരാളോട്’ എന്നതിനെക്കാൾ മൂലരൂപത്തോട് അടുത്തതാണ്.
- source_word: σπείραντι
  choice: വിത്തു വിതച്ച
  rationale: ἀνθρώπῳ എന്ന പദത്തെ വിശേഷിപ്പിക്കുന്ന പൂർത്തിയായ പ്രവൃത്തി മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണവാക്യരൂപത്തിൽ നൽകുന്നു.
- source_word: καλὸν σπέρμα
  choice: നല്ല വിത്ത്
  rationale: καλός സൂചിപ്പിക്കുന്ന നല്ല ഗുണനിലവാരം നേരിട്ട് നൽകുകയും തുടർന്നുവരുന്ന കളകളുമായുള്ള വൈരുധ്യത്തിന് അടിത്തറയിടുകയും ചെയ്യുന്നു.
- source_word: ἐν τῷ ἀγρῷ αὐτοῦ
  choice: തന്റെ വയലിൽ
  rationale: വയൽ ആ മനുഷ്യന്റേതാണെന്ന സ്വാഭാവിക പ്രത്യയബന്ധം ‘തന്റെ’ എന്ന പദം വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: മത്തായിയുടെ ‘സ്വർഗരാജ്യം’ എന്ന പ്രയോഗം
  choice: സ്വർഗരാജ്യം
  alternative: സ്വർഗങ്ങളുടെ രാജ്യം
  rationale: ഗ്രീക്കിൽ ‘സ്വർഗങ്ങൾ’ ബഹുവചനമാണെങ്കിലും, മലയാളത്തിലെ ‘സ്വർഗരാജ്യം’ മത്തായിയുടെ ദൈവിക ഭരണസങ്കൽപ്പം സ്വാഭാവികമായി വഹിക്കുന്നു; അനാവശ്യമായ ശാബ്ദിക അസ്വാഭാവികത ഒഴിവാക്കുന്നു.
- issue: Ὡμοιώθη എന്ന ഉപമാ-ആമുഖക്രിയയുടെ ഭാവം
  choice: സദൃശമായിരിക്കുന്നു
  alternative: പോലെയാണ്
  rationale: ഗ്രീക്ക് നിഷ്ക്രിയ അഓറിസ്റ്റിന്റെ രൂപഭാവം പൂർണമായി ഇല്ലാതാക്കാതെ താരതമ്യം പ്രകടിപ്പിക്കുന്നു. അതേസമയം ഇത് രാജ്യത്തിന്റെ സത്തയെക്കുറിച്ചുള്ള അധിക സിദ്ധാന്തവാദമായി വായിക്കേണ്ടതില്ല; ലളിതമായ സൂത്രവാക്യപരമായ വിവർത്തനം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘അവരുടെ മുമ്പിൽ വെച്ചു’ എന്നത് മൂലത്തിലെ അവതരണരൂപകം നിലനിർത്തുന്നു; ‘സദൃശമായിരിക്കുന്നു’ അല്പം ഔപചാരികമാണെങ്കിലും ഗ്രീക്ക് ക്രിയയുടെ ഭാവം സംരക്ഷിക്കുന്നതിനാൽ ഉപയോഗിച്ചു, കൂടുതൽ ലളിതമായ രൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
