  to: 'അവൻ അവർക്കു മറ്റൊരു ഉപമ അവതരിപ്പിച്ച് ഇങ്ങനെ പറഞ്ഞു: “സ്വർഗരാജ്യം തന്റെ വയലിൽ നല്ല വിത്ത് വിതച്ച ഒരു മനുഷ്യനെപ്പോലെയാണ്.”'
