id: MAT.13.44
reference: Matthew 13:44
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν θησαυρῷ κεκρυμμένῳ ἐν τῷ ἀγρῷ, ὃν εὑρὼν ἄνθρωπος ἔκρυψεν, καὶ ἀπὸ τῆς χαρᾶς αὐτοῦ ὑπάγει καὶ ⸂πωλεῖ πάντα ὅσα ἔχει⸃ καὶ ἀγοράζει τὸν ἀγρὸν ἐκεῖνον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/044.yaml
  text: The kingdom of heaven is like a treasure hidden in a field[a], which a man found and hid[b]; and in his joy he goes and sells all that he has and buys that field.
translation:
  language: ml
  text: സ്വർഗരാജ്യം ഒരു വയലിൽ മറഞ്ഞുകിടന്ന നിധിപോലെയാണ്. അത് കണ്ടെത്തിയ ഒരു മനുഷ്യൻ അതു മറച്ചുവെക്കുന്നു; തന്റെ സന്തോഷം നിമിത്തം അവൻ പോയി തനിക്കുള്ളതെല്ലാം വിൽക്കുകയും ആ വയൽ വാങ്ങുകയും ചെയ്യുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁμοία ἐστὶν
  choice: പോലെയാണ്
  rationale: ഉപമയെ പരിചയപ്പെടുത്തുന്ന സാധാരണ സൂത്രവാക്യം സ്വാഭാവികവും വ്യക്തവുമായി നൽകുന്നു.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: സ്വർഗരാജ്യം
  rationale: മത്തായിയുടെ സവിശേഷ പ്രയോഗം നിലനിർത്തുന്ന, മലയാളത്തിൽ സുപരിചിതവും സ്വാഭാവികവുമായ രൂപം.
- source_word: θησαυρῷ κεκρυμμένῳ ἐν τῷ ἀγρῷ
  choice: ഒരു വയലിൽ മറഞ്ഞുകിടന്ന നിധി
  rationale: κεκρυμμένῳ സൂചിപ്പിക്കുന്ന മറഞ്ഞിരിക്കുന്ന അവസ്ഥയും ἀγρός എന്നതിന്റെ സന്ദർഭപരമായ അനിശ്ചിതത്വവും സംരക്ഷിക്കുന്നു.
- source_word: ὃν εὑρὼν ἄνθρωπος ἔκρυψεν
  choice: അത് കണ്ടെത്തിയ ഒരു മനുഷ്യൻ വീണ്ടും മറച്ചുവെച്ചു
  rationale: ബന്ധവാക്യത്തിന്റെ ആശയം സ്വാഭാവിക മലയാളക്രമത്തിൽ നൽകുന്നു; മുമ്പ് മറഞ്ഞിരുന്ന നിധി കണ്ടെത്തിയശേഷം അയാൾ മറയ്ക്കുന്നതായതിനാൽ ‘വീണ്ടും’ സന്ദർഭത്തിൽ അന്തർലീനമായ ആവർത്തനം വ്യക്തമാക്കുന്നു.
- source_word: ἀπὸ τῆς χαρᾶς αὐτοῦ
  choice: തന്റെ സന്തോഷം നിമിത്തം
  rationale: ἀπό ഇവിടെ സൂചിപ്പിക്കുന്ന പ്രേരകകാരണം വ്യക്തമായി നൽകുന്നു.
- source_word: πωλεῖ πάντα ὅσα ἔχει
  choice: തനിക്കുള്ളതെല്ലാം വിറ്റ്
  rationale: വസ്തുവകകളുടെ സമഗ്രത സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: ἀγοράζει τὸν ἀγρὸν ἐκεῖνον
  choice: ആ വയൽ വാങ്ങുന്നു
  rationale: ἐκεῖνον നൽകുന്ന നിർദ്ദിഷ്ടത സംരക്ഷിക്കുകയും വർത്തമാനകാല ആഖ്യാനത്തിന്റെ സജീവത നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: βασιλεία എന്ന പദത്തിന്റെ അർത്ഥവ്യാപ്തി
  choice: രാജ്യം
  alternative: ഭരണം
  rationale: βασιλείαയ്ക്ക് ഭരണപ്രവർത്തനവും രാജ്യവും സൂചിപ്പിക്കാനാകുമെങ്കിലും, ഈ ഉപമയിൽ ‘സ്വർഗരാജ്യം’ സ്വാഭാവികവും സ്ഥാപിതവുമായ പ്രയോഗമാണ്; ദൈവഭരണത്തിന്റെ ചലനാത്മക അർത്ഥം ഇത് നിഷേധിക്കുന്നില്ല.
- issue: ἄνθρωπος എന്നതിന്റെ ലിംഗസൂചന
  choice: ഒരു മനുഷ്യൻ
  alternative: ഒരാൾ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ഏകവചനത്തിലുള്ള പ്രതിനിധി കഥാപാത്രത്തെ അമിതമായി ലിംഗനിരപേക്ഷമാക്കാതെ നൽകുന്നു.
- issue: നിധി വീണ്ടും മറച്ച പ്രവൃത്തിയുടെ ധാർമ്മിക വിലയിരുത്തൽ
  choice: വാചകത്തിൽ പറയുന്ന പ്രവൃത്തി മാത്രം വിവർത്തനം ചെയ്തു
  alternative: പ്രവൃത്തിയെ ന്യായീകരിക്കുകയോ കുറ്റപ്പെടുത്തുകയോ ചെയ്യുന്ന വ്യാഖ്യാനം ചേർക്കുക
  rationale: ഉപമ ഈ പ്രവൃത്തിയുടെ ധാർമ്മികതയെ നേരിട്ട് വിധിക്കുന്നില്ല; അതിനാൽ വിവർത്തനം ഒരു പ്രത്യേക ധാർമ്മികമോ സമുദായപരമോ ആയ വ്യാഖ്യാനം ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘മറഞ്ഞുകിടന്ന’ എന്ന രൂപം perfect passive participle സൂചിപ്പിക്കുന്ന നിലയെ സ്വാഭാവികമായി നൽകുന്നു; ‘വീണ്ടും’ മൂലപാഠത്തിൽ പ്രത്യേക പദമായി ഇല്ലെങ്കിലും ആദ്യം മറഞ്ഞിരുന്ന നിധി കണ്ടെത്തിയശേഷം ἔκρυψεν എന്ന പ്രവൃത്തി നടക്കുന്നതിന്റെ സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു.
