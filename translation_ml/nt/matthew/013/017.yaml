reference: Matthew 13:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀμὴν γὰρ λέγω ὑμῖν ὅτι πολλοὶ προφῆται καὶ δίκαιοι ἐπεθύμησαν ἰδεῖν ἃ βλέπετε καὶ οὐκ εἶδαν, καὶ ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/017.yaml
  text: For truly I say to you that many prophets and righteous people longed to see what you see and did not see it[a], and to hear what you hear and did not hear it.
translation:
  language: ml
  text: 'എന്തെന്നാൽ, ഞാൻ നിങ്ങളോടു സത്യമായി പറയുന്നു: അനേകം പ്രവാചകന്മാരും നീതിമാന്മാരും[a] നിങ്ങൾ കാണുന്നവ കാണാൻ ആഗ്രഹിച്ചു, എന്നാൽ അവ കണ്ടില്ല; നിങ്ങൾ കേൾക്കുന്നവ കേൾക്കാനും അവർ ആഗ്രഹിച്ചു, എന്നാൽ അവ കേട്ടില്ല.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘നീതിയുള്ളവർ.’ ഗ്രീക്കിൽ ‘നീതിയുള്ള’ എന്ന വിശേഷണം വ്യക്തികളെ സൂചിപ്പിക്കുന്ന നാമമായി ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: സത്യമായി
  rationale: ‘ഞാൻ നിങ്ങളോടു പറയുന്നു’ എന്ന ഉറപ്പുനൽകുന്ന സൂത്രവാക്യത്തിൽ ἀμήν-ന്റെ ഗൗരവമുള്ള സത്യപ്രഖ്യാപനശക്തി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിന് വിശദീകരണപരമായ അടിസ്ഥാനം നൽകുന്ന ബന്ധകത്തിന്റെ പ്രവർത്തനം നിലനിർത്തുന്നു.
- source_word: λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: ഗ്രീക്കിലെ നേരിട്ടുള്ള അഭിസംബോധനയും സൂത്രവാക്യത്തിന്റെ ഭാവവും വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: προφῆται
  choice: പ്രവാചകന്മാർ
  rationale: ഇസ്രായേലിന്റെ പ്രവാചകവ്യക്തികളെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ സാധാരണവും മാന്യവുമായ മലയാളരൂപം.
- source_word: δίκαιοι
  choice: നീതിമാന്മാർ
  rationale: നാമമായി പ്രവർത്തിക്കുന്ന ബഹുവചന വിശേഷണത്തെ വ്യക്തികളുടെ ഒരു വിഭാഗമായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἐπεθύμησαν
  choice: ആഗ്രഹിച്ചു
  rationale: സന്ദർഭത്തിലെ ശക്തമായ അഭിലാഷം വ്യക്തമാക്കുന്നു; തെറ്റായ മോഹം എന്ന അനാവശ്യ അർഥം വരുത്തുന്നില്ല.
- source_word: ἃ βλέπετε … ἃ ἀκούετε
  choice: നിങ്ങൾ കാണുന്നതു … നിങ്ങൾ കേൾക്കുന്നതു
  rationale: മൂലത്തിലെ ബന്ധവാക്യങ്ങളുടെ തുറന്ന അർഥം നിലനിർത്തി അവയുടെ വസ്തു വ്യാഖ്യാനിച്ച് ചേർക്കുന്നില്ല.
- source_word: οὐκ εἶδαν … οὐκ ἤκουσαν
  choice: കണ്ടില്ല … കേട്ടില്ല
  rationale: അവർ ആഗ്രഹിച്ച കാഴ്ചയും കേൾവിയും ലഭിച്ചില്ലെന്ന ചരിത്രവസ്തുത ലളിതമായ ഭൂതകാലത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: δίκαιοι എന്നതിന്റെ വ്യാപ്തി
  choice: പ്രവാചകന്മാരോടൊപ്പം ‘നീതിമാന്മാർ’ എന്ന വിശാലമായ വ്യക്തിവർഗമായി വിവർത്തനം ചെയ്തു.
  alternative: ‘നീതിയുള്ളവർ’ എന്നു വിവർത്തനം ചെയ്യുക.
  rationale: ഗ്രീക്കിൽ ഇത് നാമമായി പ്രവർത്തിക്കുന്ന ബഹുവചന വിശേഷണമാണ്; പ്രവാചകന്മാർക്ക് മാത്രമായി അർഥം പരിമിതപ്പെടുത്താതെ മുൻതലമുറകളിലെ നീതിയുള്ള വ്യക്തികളെ ഉൾക്കൊള്ളുന്നു.
- issue: കാണുകയും കേൾക്കുകയും ചെയ്യുന്ന കാര്യങ്ങളുടെ സ്വഭാവം
  choice: ‘നിങ്ങൾ കാണുന്നതു’, ‘നിങ്ങൾ കേൾക്കുന്നതു’ എന്നിങ്ങനെ വസ്തുക്കൾ മൂലത്തിലുള്ളതുപോലെ വ്യക്തമാക്കാതെ നിലനിർത്തി.
  alternative: ‘മശീഹയെ’ എന്നോ ‘രാജ്യത്തിന്റെ രഹസ്യങ്ങളെ’ എന്നോ വ്യാഖ്യാനിച്ച് ചേർക്കുക.
  rationale: സന്ദർഭം യേശുവിന്റെ ശുശ്രൂഷയെയും രാജ്യവെളിപ്പാടിനെയും സൂചിപ്പിക്കുന്നുണ്ടെങ്കിലും ഈ വാക്യം അവയെ പ്രത്യേകം പേരിട്ടു പറയുന്നില്ല; അതിനാൽ വിവർത്തനം ആ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി ഉപയോഗിച്ചു. ‘എന്തെന്നാൽ’ γάρ-ന്റെ വിശദീകരണബന്ധം നിലനിർത്തുന്നു; സമാന്തരമായ ‘കാണാൻ… കണ്ടില്ല / കേൾക്കാൻ… കേട്ടില്ല’ ഘടന മൂലവാക്യത്തിന്റെ ഊന്നൽ വ്യക്തമായി പകരുന്നു.
