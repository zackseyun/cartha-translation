reference: Matthew 13:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ ἀγρός ἐστιν ὁ κόσμος· τὸ δὲ καλὸν σπέρμα, οὗτοί εἰσιν οἱ υἱοὶ τῆς βασιλείας· τὰ δὲ ζιζάνιά εἰσιν οἱ υἱοὶ τοῦ πονηροῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/038.yaml
  text: The field is the world[a], and the good seed—these are the sons of the kingdom. And the weeds are the sons of the evil one[c][b],
translation:
  language: ml
  text: വയൽ ലോകമാണ്; നല്ല വിത്തോ രാജ്യത്തിന്റെ പുത്രന്മാരാണ്.[a] കളകളോ ദുഷ്ടനായവന്റെ പുത്രന്മാരാണ്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പുത്രന്മാർ’ എന്നത് ഇവിടെ രാജ്യത്തിൽ ഉൾപ്പെടുന്നവരെ സൂചിപ്പിക്കുന്ന ബന്ധപരമായ പ്രയോഗമാണ്.
    reason: cultural_note
  - marker: b
    text: ‘കളകൾ’ എന്നു പരിഭാഷപ്പെടുത്തിയ പദം ഗോതമ്പിനോടു വളരെ സാമ്യമുള്ള ഒരിനം കളച്ചെടിയെ കൂടുതൽ നിർദിഷ്ടമായി സൂചിപ്പിക്കാം; പരമ്പരാഗതമായി ‘ടാരസ്’ എന്നും പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγρός
  choice: വയൽ
  rationale: കാർഷിക ഉപമയിലെ സാധാരണ അർഥം സ്വാഭാവികവും വ്യക്തവുമായി നിലനിർത്തുന്നു.
- source_word: κόσμος
  choice: ലോകം
  rationale: വിതയ്ക്കൽ നടക്കുന്ന വിശാല മേഖലയെ സൂചിപ്പിക്കുന്ന പതിവും സുതാര്യവുമായ പരിഭാഷ.
- source_word: καλὸν σπέρμα
  choice: നല്ല വിത്ത്
  rationale: കാർഷിക രൂപകം നിലനിർത്തുകയും കളകളോടുള്ള വൈരുധ്യം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: υἱοὶ τῆς βασιλείας
  choice: രാജ്യത്തിന്റെ പുത്രന്മാർ
  rationale: υἱοί എന്ന പുരുഷലിംഗ ബഹുവചനവും ബന്ധപരമായ പ്രയോഗവും നിലനിർത്തുന്നു; ഇവിടെ ഉൾപ്പെടുന്നവരെ പ്രതിനിധിയായി സൂചിപ്പിക്കുന്നതാണെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: ζιζάνια
  choice: കളകൾ
  rationale: സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന ആധുനിക പദം; സസ്യത്തിന്റെ കൂടുതൽ നിർദിഷ്ട തിരിച്ചറിയൽ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: τοῦ πονηροῦ
  choice: ദുഷ്ടന്റെ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ പുരുഷലിംഗ ഏകവചന ജനിറ്റീവ് ഇവിടെ വ്യക്തിപരമായ എതിരാളിയെ സൂചിപ്പിക്കുന്നതായി സ്വാഭാവികമായി വായിക്കപ്പെടുന്നു.
theological_decisions:
- issue: τοῦ πονηροῦ വ്യക്തിപരമാണോ അമൂർത്തമായ തിന്മയെയാണോ സൂചിപ്പിക്കുന്നത്
  choice: ദുഷ്ടന്റെ
  alternative: തിന്മയുടെ
  rationale: വ്യാകരണവും ഉപമയുടെ വിശദീകരണത്തിലെ വിരുദ്ധകൂട്ടങ്ങളുടെ ഘടനയും വ്യക്തിപരമായ വായനയെ ശക്തമായി പിന്തുണയ്ക്കുന്നു; ഗ്രീക്ക് പറയുന്നതിലപ്പുറം ആ വ്യക്തിയെ പേരിട്ട് തിരിച്ചറിയുന്നില്ല.
- issue: υἱοὶ ഉൾക്കൊള്ളുന്ന അർഥത്തിൽ പരിഭാഷപ്പെടുത്തണമോ
  choice: പുത്രന്മാർ
  alternative: മക്കൾ
  rationale: ഗ്രീക്കിലെ പുരുഷലിംഗ ബഹുവചനം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; ഇത് ഒരു കൂട്ടത്തിൽ ഉൾപ്പെടുന്നവരെ സൂചിപ്പിക്കുന്ന ബന്ധപരമായ പ്രയോഗമാണെന്ന് അടിക്കുറിപ്പിൽ വിശദീകരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. δέ ആവർത്തിക്കുന്ന വിശദീകരണത്തിന്റെ സമാന്തരത ‘ആണ്/ആരാണ്’ ഘടനയിലൂടെ നിലനിർത്തി; ആദ്യ രണ്ട് ഘടകങ്ങൾക്കിടയിൽ അർധവിരാമം ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
