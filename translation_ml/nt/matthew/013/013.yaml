id: MAT.13.13
reference: Matthew 13:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἐν παραβολαῖς αὐτοῖς λαλῶ, ὅτι βλέποντες οὐ βλέπουσιν καὶ ἀκούοντες οὐκ ἀκούουσιν οὐδὲ συνίουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/013.yaml
  text: For this reason I speak to them in parables[a], because seeing they do not see, and hearing they do not hear, nor do they understand.
translation:
  language: ml
  text: അതുകൊണ്ടാണ് ഞാൻ അവരോടു ഉപമകളിലൂടെ സംസാരിക്കുന്നത്; കാരണം, കാണുന്നവരായിട്ടും അവർ കാണുന്നില്ല, കേൾക്കുന്നവരായിട്ടും അവർ കേൾക്കുന്നില്ല, മനസ്സിലാക്കുന്നുമില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ കൂടുതൽ രൂപാനുസൃതമായി: “കാണുമ്പോഴും അവർ കാണുന്നില്ല; കേൾക്കുമ്പോഴും അവർ കേൾക്കുന്നില്ല.” ഗ്രീക്കിൽ ഇവിടെ “കാണുന്നവർ,” “കേൾക്കുന്നവർ” എന്ന വർത്തമാന കൃദന്തരൂപങ്ങളാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; അവയുടെ ബന്ധം സന്ദർഭത്തിൽ concessive ആയി മനസ്സിലാക്കാം.'
    reason: The Greek present participles can be rendered more formally without explicitly fixing their concessive nuance; the note preserves that ambiguity.
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: അതുകൊണ്ടാണ്
  rationale: മുൻസന്ദർഭവുമായി ബന്ധിപ്പിക്കുന്ന കാരണസൂചന സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; വെറും നിഗമനസൂചകമായ ‘അതിനാൽ’ എന്നതിനെക്കാൾ ഗ്രീക്കിലെ causal force നന്നായി നിലനിർത്തുന്നു.
- source_word: ἐν παραβολαῖς
  choice: ഉപമകളായി
  rationale: ἐν + dative ഇവിടെ സംസാരത്തിന്റെ രീതിയെ സൂചിപ്പിക്കുന്നു. ‘ഉപമകളായി സംസാരിക്കുക’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും അർഥവ്യക്തവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: αὐτοῖς λαλῶ
  choice: ഞാൻ അവരോട് ... സംസാരിക്കുന്നത്
  rationale: ദത്തിവ് സർവനാമത്തിന്റെ അഭിസംബോധനാഭാവവും വർത്തമാനകാല ക്രിയയുടെ ലളിതമായ പ്രസ്താവനയും നിലനിർത്തുന്നു.
- source_word: ὅτι
  choice: കാരണം
  rationale: തുടർന്നുവരുന്നത് യേശു ഉപമകളായി സംസാരിക്കുന്നതിന്റെ കാരണമാണെന്ന് വ്യക്തമാക്കുന്ന causal അർഥം നൽകുന്നു.
- source_word: βλέποντες οὐ βλέπουσιν
  choice: കണ്ടിട്ടും അവർ കാണുന്നില്ല
  rationale: ഒരേ ധാതുവിന്റെ ആവർത്തനവും പുറമേയുള്ള കാഴ്ചയും യഥാർഥ ഗ്രഹണവും തമ്മിലുള്ള വിരോധാഭാസവും നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളം.
- source_word: ἀκούοντες οὐκ ἀκούουσιν
  choice: കേട്ടിട്ടും അവർ കേൾക്കുന്നില്ല
  rationale: മുൻവാക്യഘടനയോടുള്ള സമാന്തരതയും ἀκούω എന്ന പദത്തിന്റെ ആവർത്തനവും സംരക്ഷിക്കുന്നു.
- source_word: οὐδὲ συνίουσιν
  choice: മനസ്സിലാക്കുന്നതുമില്ല
  rationale: നിഷേധപരമ്പരയുടെ അവസാനഘട്ടവും അർഥമോ പ്രാധാന്യമോ ഗ്രഹിക്കാത്തതെന്ന συνίημι എന്ന ക്രിയയുടെ സാധാരണ അർഥവും വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: βλέποντες, ἀκούοντες എന്നീ വർത്തമാന കൃദന്തരൂപങ്ങളുടെ ബലം
  choice: ‘കണ്ടിട്ടും’, ‘കേട്ടിട്ടും’ എന്ന concessive രൂപം
  alternative: ‘കാണുന്നവരായി’, ‘കേൾക്കുന്നവരായി’ എന്ന കൂടുതൽ രൂപാനുസൃതമായ വിവർത്തനം
  rationale: സന്ദർഭത്തിലെ വിരോധാഭാസം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു. അതേസമയം, കൃദന്തരൂപങ്ങളിൽ concessive ബന്ധം വ്യാകരണപരമായി തുറന്നുപറഞ്ഞിട്ടില്ലെന്ന യഥാർഥ സൂക്ഷ്മത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: συνίουσιν എന്നതിന്റെ സന്ദർഭാർഥം
  choice: മനസ്സിലാക്കുക
  alternative: ഗ്രഹിക്കുക
  rationale: കാണുകയും കേൾക്കുകയും ചെയ്തിട്ടും അർഥം ഉൾക്കൊള്ളാത്തതിനെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി അറിയിക്കുന്നു; അവരുടെ കുറ്റബോധത്തെയോ ആത്മീയാവസ്ഥയെയോ കുറിച്ച് വാക്യം പറയുന്നതിലധികം ഒന്നും ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂന്നു നിഷേധവാക്യങ്ങളുടെ സമാന്തരത അർദ്ധവിരാമങ്ങളിലൂടെ വ്യക്തമാക്കിയിരിക്കുന്നു; പരമ്പരാഗത സഭാഭാഷയിലെ ദുർഗ്രഹമായ പദങ്ങൾ ഒഴിവാക്കി.
