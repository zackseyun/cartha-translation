id: MAT.13.23
reference: Matthew 13:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ ἐπὶ τὴν ⸂καλὴν γῆν⸃ σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων καὶ ⸀συνιείς, ὃς δὴ καρποφορεῖ καὶ ποιεῖ ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/023.yaml
  text: But the one sown on the good soil—this is the one who hears the word and understands it[a], who indeed bears fruit and produces, in one case a hundred, in another sixty[b], and in another thirty.
translation:
  language: ml
  text: നല്ല മണ്ണിൽ വിതയ്ക്കപ്പെട്ടവൻ എന്നാൽ വചനം കേട്ട് മനസ്സിലാക്കുന്നവനാണ്; അവൻ തീർച്ചയായും ഫലം കായ്ക്കുകയും വിളവ് നൽകുകയും ചെയ്യുന്നു—ഒരുവൻ നൂറും, മറ്റൊരുവൻ അറുപതും, വേറൊരുവൻ മുപ്പതും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπὶ τὴν καλὴν γῆν
  choice: നല്ല മണ്ണിൽ
  rationale: കൃഷിസന്ദർഭത്തിൽ γῆ വിത്ത് സ്വീകരിക്കുന്ന മണ്ണിനെ സൂചിപ്പിക്കുന്നു; καλὴν ഇവിടെ ധാർമിക നന്മയേക്കാൾ അനുയോജ്യവും ഫലഭൂയിഷ്ഠവുമായ ഗുണമാണ് സൂചിപ്പിക്കുന്നത്. ἐπί + accusative-ന്റെ ഉപരിതലദിശ മലയാളത്തിൽ സ്വാഭാവികമായി ‘മണ്ണിൽ’ എന്നു നൽകുന്നു.
- source_word: σπαρείς
  choice: വിതയ്ക്കപ്പെട്ടവൻ
  rationale: Aorist passive participle-ന്റെ നിഷ്ക്രിയതയും വിത്തിനാൽ പ്രതിനിധീകരിക്കപ്പെടുന്ന വ്യക്തിയിലേക്കുള്ള രൂപകമാറ്റവും നിലനിർത്തുന്നു.
- source_word: ὁ τὸν λόγον ἀκούων
  choice: വചനം കേൾക്കുന്നവൻ
  rationale: Present participle സൂചിപ്പിക്കുന്ന സ്വഭാവസവിശേഷമായ പ്രവർത്തനം നിലനിർത്തുന്നു. τὸν λόγον എന്ന സുവിശേഷപരമായ പ്രയോഗത്തിന് മലയാള ബൈബിൾഭാഷയിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ‘വചനം’ ഉപയോഗിക്കുന്നു.
- source_word: συνιείς
  choice: മനസ്സിലാക്കുന്നവൻ
  rationale: കേട്ട വചനത്തിന്റെ അർഥം ഗ്രഹിക്കുന്നതിനെ ലളിതവും ആധുനികവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; വസ്തു സന്ദർഭത്തിൽനിന്ന് വ്യക്തമായതിനാൽ അധിക സർവനാമം ആവശ്യമില്ല.
- source_word: δὴ
  choice: തീർച്ചയായും
  rationale: δή നൽകുന്ന ഊന്നൽ ഉപേക്ഷിക്കാതെ, മലയാളത്തിൽ സ്വാഭാവികമായി അടയാളപ്പെടുത്തുന്നു.
- source_word: καρποφορεῖ
  choice: ഫലം കായ്ക്കുന്നു
  rationale: കൃഷിരൂപകവും ശിഷ്യത്വവുമായി ബന്ധപ്പെട്ട ഫലധാരണയും നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: ποιεῖ
  choice: വിളവ് നൽകുന്നു
  rationale: καρποφορεῖ-യിൽനിന്ന് രണ്ടാമത്തെ ക്രിയയെ വേർതിരിച്ചുനിർത്തുകയും കൃഷിസന്ദർഭത്തിലെ ഉൽപ്പാദനം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα
  choice: ഒരാൾ നൂറും മറ്റൊരാൾ അറുപതും വേറൊരാൾ മുപ്പതും മടങ്ങ്
  rationale: വ്യത്യസ്ത വ്യക്തികളിലെ വ്യത്യസ്ത വിളവളവുകൾ സൂചിപ്പിക്കുന്ന distributive ഘടന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. ഗ്രീക്കിൽ ‘മടങ്ങ്’ നേരിട്ട് ഇല്ലെങ്കിലും കൃഷിവിളവിന്റെ അനുപാതം മലയാളവായനക്കാരന് വ്യക്തമായി അറിയിക്കാൻ അത് ചേർത്തിരിക്കുന്നു; ഈ സപ്ലൈ കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: വചനത്തോടുള്ള പ്രതികരണത്തിന്റെ സ്വഭാവം
  choice: നല്ല മണ്ണിനോട് ഉപമിക്കപ്പെടുന്നവൻ വചനം കേൾക്കുകയും മനസ്സിലാക്കുകയും ഫലം കായ്ക്കുകയും ചെയ്യുന്നതായി വിവരണാത്മകമായി പരിഭാഷപ്പെടുത്തി.
  alternative: സ്ഥിരോത്സാഹം, യഥാർഥ മാനസാന്തരം, അല്ലെങ്കിൽ പുനർജനനത്തിന്റെ തെളിവ് എന്നിവയെ പരിഭാഷയിൽ തുറന്നുപറയുക.
  rationale: ഗ്രീക്ക് പാഠം കേൾക്കൽ, മനസ്സിലാക്കൽ, ഫലം കായ്ക്കൽ എന്നിവയെയാണ് നേരിട്ട് പറയുന്നത്; പിന്നീടുള്ള സിദ്ധാന്തവിഭാഗങ്ങളെ അത് ഇവിടെ വ്യക്തമായി പ്രസ്താവിക്കുന്നില്ല. അതിനാൽ മതവിഭാഗപരമായ വ്യാഖ്യാനം ചേർക്കാതെ പാഠത്തിന്റെ സ്വന്തം വിഭാഗങ്ങൾ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘വചനം’, ‘ഫലം കായ്ക്കുന്നു’ എന്നീ പരിചിതമായ ബൈബിൾപ്രയോഗങ്ങൾ നിലനിർത്തിയപ്പോൾ, വാക്യഘടന സാധാരണ വായനക്കാർക്ക് എളുപ്പമാക്കി. Greek singular representative construction കാരണം ‘വിതയ്ക്കപ്പെട്ടവൻ’ ഉപയോഗിച്ചു; അവസാനത്തെ distributive relatives വ്യത്യസ്ത ആളുകളായി സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
