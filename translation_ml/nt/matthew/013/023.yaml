revisions:
- from: നല്ല മണ്ണിൽ വിതയ്ക്കപ്പെട്ടവനോ, അവൻ വചനം കേട്ട് മനസ്സിലാക്കുന്നവനാണ്; അവൻ തീർച്ചയായും ഫലം കായ്ച്ച് വിളവ് നൽകുന്നു—ഒരാൾ നൂറും മറ്റൊരാൾ അറുപതും വേറൊരാൾ മുപ്പതും മടങ്ങ്.[a]
  to: നല്ല മണ്ണിൽ വിതയ്ക്കപ്പെട്ടവൻ എന്നാൽ വചനം കേട്ട് മനസ്സിലാക്കുന്നവനാണ്; അവൻ തീർച്ചയായും ഫലം കായ്ക്കുകയും വിളവ് നൽകുകയും ചെയ്യുന്നു—ഒരുവൻ നൂറും, മറ്റൊരുവൻ അറുപതും, വേറൊരുവൻ മുപ്പതും.
  rationale: The revision removes the unsupported ‘മടങ്ങ്’ while retaining the Greek’s deliberately elliptical, distributive enumeration of differing yields. It also uses coordinated present-tense Malayalam verbs for the two Greek verbs and improves the opening syntax. No footnote is needed, since the revised Malayalam does not introduce an explanatory lexical expansion.
