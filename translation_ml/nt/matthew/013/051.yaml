id: MAT.13.51
reference: Matthew 13:51
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀Συνήκατε ταῦτα πάντα; λέγουσιν αὐτῷ· ⸀Ναί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/051.yaml
  text: Have you understood all these things? They said to him[a], “Yes.”
translation:
  language: ml
  text: '“ഇവയെല്ലാം നിങ്ങൾ മനസ്സിലാക്കിയോ[a]?” അവർ അവനോട് പറഞ്ഞു: “അതെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇവയെല്ലാം നിങ്ങൾക്കു മനസ്സിലാകുന്നുണ്ടോ?”
    reason: Συνήκατε എന്ന എയോറിസ്റ്റ് രൂപത്തിന്റെ പൂർത്തിയായ ഗ്രഹണഭാവം ‘മനസ്സിലാക്കിയോ’ എന്നു നൽകാം; സന്ദർഭത്തിലെ നിലവിലെ ബോധ്യത്തെ മുൻനിർത്തി ‘മനസ്സിലാകുന്നുണ്ടോ’ എന്നും സ്വാഭാവികമായി വിവർത്തനം ചെയ്യാം.
lexical_decisions:
- source_word: Συνήκατε
  choice: മനസ്സിലാക്കിയോ
  rationale: ചോദ്യത്തിലുള്ള രണ്ടാംപുരുഷ ബഹുവചന എയോറിസ്റ്റ് രൂപം, ഇതുവരെ നൽകിയ ഉപദേശങ്ങൾ അവർ ഗ്രഹിച്ചുകഴിഞ്ഞോ എന്നു ചോദിക്കുന്നതായി സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘മനസ്സിലാക്കിയോ’ ഈ പൂർത്തിയായ ഗ്രഹണത്തിന്റെ ഭാവം നിലനിർത്തുന്നു.
- source_word: ταῦτα πάντα
  choice: ഇവയെല്ലാം
  rationale: നപുംസകലിംഗ ബഹുവചന സർവനാമവും πᾶς-ഉം ചേർന്ന പ്രയോഗം മുമ്പ് പറഞ്ഞ ഉപദേശങ്ങളെയും ഉപമകളെയും സമഗ്രമായി സൂചിപ്പിക്കുന്നു; ‘ഇവയെല്ലാം’ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: λέγουσιν αὐτῷ
  choice: അവർ അവനോട് പറഞ്ഞു
  rationale: ഗ്രീക്കിൽ വർത്തമാനരൂപത്തിലുള്ള ചരിത്രവർത്തമാനം ഉപയോഗിച്ചിട്ടുണ്ടെങ്കിലും, ആഖ്യാനമലയാളത്തിൽ ഭൂതകാലമായ ‘പറഞ്ഞു’ കൂടുതൽ സ്വാഭാവികമാണ്. αὐτῷ എന്ന പരോക്ഷകർമ്മം ‘അവനോട്’ എന്നു നിലനിർത്തി.
- source_word: Ναί
  choice: അതെ
  rationale: ഗ്രീക്കിൽ സമ്മതസൂചകമായ ναί മാത്രമേ ഉള്ളൂ. അതിനാൽ ഉറവിടത്തിൽ ഇല്ലാത്ത അഭിസംബോധനയോ ബഹുമാനപദവിയോ ചേർക്കാതെ ലളിതമായ ‘അതെ’ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ശിഷ്യന്മാരുടെ മറുപടിയിൽ ഭക്തിപൂർവമായ ഒരു പദവി ചേർക്കണമോ
  choice: ‘അതെ’ എന്ന ലളിതമായ മറുപടി മാത്രം നിലനിർത്തി.
  alternative: ‘അതെ, കർത്താവേ.’
  rationale: SBLGNT പാഠത്തിൽ ναί മാത്രമേ ഉള്ളൂ; ‘കർത്താവേ’ എന്ന പദം ഇല്ല. അതിനാൽ വിവർത്തനപരമ്പരയിലോ ഭക്തിപ്രയോഗത്തിലോ നിന്നുള്ള ഉള്ളടക്കം പാഠത്തിലേക്ക് കൊണ്ടുവരുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ബഹുവചന ‘നിങ്ങൾ’ ഗ്രീക്കിലെ രണ്ടാംപുരുഷ ബഹുവചനം വ്യക്തമാക്കുന്നു. വാക്യക്രമം ഉറവിടത്തോട് അടുത്തുവെച്ചെങ്കിലും മലയാളത്തിൽ സ്വാഭാവികമായ വിരാമചിഹ്നങ്ങൾ ഉപയോഗിച്ചു.
