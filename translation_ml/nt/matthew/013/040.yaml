id: MAT.13.40
reference: Matthew 13:40
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὥσπερ οὖν συλλέγεται τὰ ζιζάνια καὶ πυρὶ ⸀καίεται, οὕτως ἔσται ἐν τῇ συντελείᾳ τοῦ ⸀αἰῶνος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/040.yaml
  text: Therefore[a], just as the weeds are gathered and burned with fire[b], so it will be at the end of the age.
translation:
  language: ml
  text: അതിനാൽ, കളകൾ[a] ശേഖരിച്ച് തീയിൽ കത്തിക്കുന്നതുപോലെ, യുഗത്തിന്റെ സമാപനത്തിൽ[b] അങ്ങനെതന്നെ സംഭവിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്ക് പദം ദോഷകരമായ ഒരിനം കളയെ—സാധ്യതയോടെ ഡാർണൽ എന്ന കളയെ—സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ലോകത്തിന്റെ അവസാനത്തിൽ’; ഗ്രീക്കിൽ അക്ഷരാർഥം, ‘യുഗത്തിന്റെ സമാപനത്തിൽ.’
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ οὖν
  choice: അതുകൊണ്ട്, ...പോലെ
  rationale: οὖν സൂചിപ്പിക്കുന്ന നിഗമനബന്ധം ‘അതുകൊണ്ട്’ എന്നും ὥσπερ അവതരിപ്പിക്കുന്ന ഉപമ ‘...പോലെ’ എന്നും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: συλλέγεται
  choice: ശേഖരിച്ച്
  rationale: കളകളെ ഒരുമിച്ചുകൂട്ടുന്ന കാർഷികദൃശ്യം വ്യക്തമായി നൽകുന്നു; പിന്നാലെയുള്ള καίεται-യുമായി മലയാളത്തിൽ സ്വാഭാവികമായ ക്രിയാശൃംഖല സൃഷ്ടിക്കുന്നു.
- source_word: τὰ ζιζάνια
  choice: കളകൾ
  rationale: ζιζάνια ദോഷകരമായ കളകളെ, സാധ്യതയോടെ ഡാർണലിനെ, സൂചിപ്പിക്കുന്നു. ‘കളകൾ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സന്ദർഭോചിതവുമാണ്; സസ്യവർഗം അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: πυρὶ καίεται
  choice: തീയിൽ ചുട്ടുകളയുന്നു
  rationale: തീയെ വ്യക്തമായി പരാമർശിക്കുകയും καίωയുടെ ലളിതമായ ദഹനാർഥം നിലനിർത്തുകയും ചെയ്യുന്നു. മലയാളത്തിൽ ‘തീയിൽ’ ഈ സാഹചര്യത്തിൽ സ്വാഭാവികമാണ്.
- source_word: οὕτως ἔσται
  choice: അങ്ങനെതന്നെ സംഭവിക്കും
  rationale: ഉപമയുടെ സമാനതയും ἔσταιയുടെ ഭാവികാലബലവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐν τῇ συντελείᾳ
  choice: സമാപനത്തിലും
  rationale: συντέλεια സൂചിപ്പിക്കുന്ന അവസാനഘട്ടം അഥവാ പൂർത്തീകരണം വ്യക്തമായി നൽകുന്നു; ‘അവസാനം’ എന്നതിനെക്കാൾ culmination എന്ന ഭാവം നന്നായി നിലനിർത്തുന്നു.
- source_word: τοῦ αἰῶνος
  choice: യുഗത്തിന്റെ
  rationale: αἰών എന്നതിന്റെ കാലസംബന്ധിയായ അർഥം സംരക്ഷിക്കുകയും ഭൗതികലോകത്തിന്റെ നാശം എന്ന് മുൻകൂട്ടി വ്യാഖ്യാനിക്കുന്നത് ഒഴിവാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ἐν τῇ συντελείᾳ τοῦ αἰῶνος എന്ന അന്ത്യകാലപ്രയോഗം
  choice: യുഗത്തിന്റെ സമാപനത്തിൽ
  alternative: ലോകാവസാനത്തിൽ
  rationale: αἰών ഇവിടെ പ്രധാനമായി ഒരു കാലഘട്ടത്തെ സൂചിപ്പിക്കുന്നു; ‘യുഗം’ എന്ന വിവർത്തനം കാലപരവും വീണ്ടെടുപ്പുചരിത്രപരവുമായ അർഥം നിലനിർത്തുന്നു. ‘ലോകം’ എന്നു വിവർത്തനം ചെയ്താൽ ഭൗതിക സൃഷ്ടിയെ സൂചിപ്പിക്കുന്നതായി അനാവശ്യമായി ചുരുക്കപ്പെടാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഉപമയുടെ ഘടനയും നിഗമനബന്ധവും നിലനിർത്തി; സാങ്കേതികമായ ‘ഡാർണൽ’ മുഖ്യവാചകത്തിനു പകരം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
