- source_word: ὁ Ἰησοῦς
  choice: യേശു
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ സ്ഥാപിതമായ ലിപ്യന്തരണത്തിൽ നൽകുന്നു.
- source_word: ἐκάθητο
  choice: ഇരിക്കുകയായിരുന്നു
  rationale: ഇംപെർഫെക്റ്റ് രൂപത്തിന്റെ തുടരുന്ന, രംഗപശ്ചാത്തലം സൃഷ്ടിക്കുന്ന ഭാവം സൂക്ഷിക്കുന്നു; വെറും ‘ഇരുന്നു’ എന്നതും സന്ദർഭത്തിൽ സാധ്യമാണ്.
- source_word: παρὰ τὴν θάλασσαν
  choice: കടലിനരികെ
  rationale: παράയും അക്കൂസറ്റീവും ഇവിടെ കടലിനു സമീപമുള്ള സ്ഥാനം സൂചിപ്പിക്കുന്നു; തീരത്തുതന്നെയോ ഒരു നിശ്ചിത അകലത്തിലോ എന്ന് വ്യക്തമാക്കുന്നില്ല.
