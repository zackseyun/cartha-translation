source:
  edition: SBLGNT
  text: Ταῦτα πάντα ἐλάλησεν ὁ Ἰησοῦς ἐν παραβολαῖς τοῖς ὄχλοις, καὶ χωρὶς παραβολῆς ⸀οὐδὲν ἐλάλει αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/034.yaml
  text: Jesus spoke all these things to the crowds in parables[a], and apart from a parable he said nothing to them.
translation:
  language: ml
  text: യേശു ഈ കാര്യങ്ങളെല്ലാം ജനക്കൂട്ടങ്ങളോട് ഉപമകളിലൂടെ പറഞ്ഞു; ഒരു ഉപമ കൂടാതെ അവരോട് ഒന്നും പറയാറില്ലായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരു ഉപമ കൂടാതെ അവരോട് ഒന്നും പറഞ്ഞില്ല.” ഗ്രീക്കിലെ അപൂർണ ഭൂതകാലക്രിയയെ പതിവായ പ്രവർത്തനമായോ ലളിതമായ ഭൂതകാലമായോ ഇവിടെ മനസ്സിലാക്കാം.
    reason: aspectual_alternative
lexical_decisions:
- source_word: Ταῦτα πάντα
  choice: ഈ കാര്യങ്ങളെല്ലാം
  rationale: ചൂണ്ടിക്കാണിക്കുന്ന സർവനാമത്തിന്റെയും സമഗ്രതയുടെയും അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐλάλησεν
  choice: പറഞ്ഞു
  rationale: ആവർത്തനത്തിന്റെ ഈ ഭാഗത്തെ സംഗ്രഹിക്കുന്ന aorist രൂപത്തിന് സ്വാഭാവികമായ മലയാള ഭൂതകാലപ്രയോഗം.
- source_word: ἐν παραβολαῖς
  choice: ഉപമകളിലൂടെ
  rationale: ἐν ഇവിടെ രീതി അഥവാ മാധ്യമം സൂചിപ്പിക്കുന്നു; ‘ഉപമകളിലൂടെ’ അതിനെ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τοῖς ὄχλοις
  choice: ജനക്കൂട്ടങ്ങളോട്
  rationale: ഗ്രീക്കിലെ ബഹുവചനം നിലനിർത്തുന്നു; ‘ജനക്കൂട്ടങ്ങൾ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: χωρὶς παραβολῆς
  choice: ഒരു ഉപമ കൂടാതെ
  rationale: χωρίς എന്നതിന്റെ ‘കൂടാതെ/ഇല്ലാതെ’ എന്ന അർഥവും παραβολῆς എന്ന ഏകവചനവും സംരക്ഷിക്കുന്നു.
- source_word: οὐδὲν ἐλάλει
  choice: ഒന്നും പറയാറില്ലായിരുന്നു
  rationale: imperfect രൂപത്തിലെ പതിവായ പ്രവർത്തനസൂചന മലയാളത്തിൽ ‘പറയാറില്ലായിരുന്നു’ എന്ന പ്രയോഗം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: αὐτοῖς
  choice: അവരോട്
  rationale: മുമ്പുള്ള ജനക്കൂട്ടങ്ങളെ സൂചിപ്പിക്കുന്ന സർവനാമം അനാവശ്യ ആവർത്തനമില്ലാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: രണ്ടാം ഉപവാക്യത്തിലെ imperfect രൂപത്തിന്റെ ആഖ്യാന ഊന്നൽ
  choice: ഈ സന്ദർഭത്തിൽ യേശു ജനക്കൂട്ടങ്ങളോട് പതിവായി ഉപമയോടുകൂടി മാത്രമേ സംസാരിച്ചിരുന്നുള്ളൂ എന്ന ഭാവം നൽകുന്നു.
  alternative: ‘ഒരു ഉപമ കൂടാതെ അവരോട് ഒന്നും പറഞ്ഞില്ല’ എന്ന ലളിത ഭൂതകാലമായി പരിഭാഷപ്പെടുത്താം.
  rationale: ἐλάλει എന്ന imperfect രൂപത്തിന്റെ പതിവ്/തുടർച്ചാ ഭാവം ‘പറയാറില്ലായിരുന്നു’ എന്നതിലൂടെ നിലനിർത്തുന്നു; ഇത് വാക്യം ഉദ്ദേശിക്കുന്ന പരിധിക്കപ്പുറം ഒരു സമ്പൂർണ ദൈവശാസ്ത്രനിയമമാക്കി മാറ്റുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ‘ഉപമ’ എന്ന സുപരിചിത ബൈബിൾപദം നിലനിർത്തി; ഗ്രീക്കിലെ ബഹുവചനമായ ‘ജനക്കൂട്ടങ്ങൾ’ സംരക്ഷിച്ചു.
