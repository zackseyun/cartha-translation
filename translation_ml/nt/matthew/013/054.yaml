id: MAT.13.54
reference: Matthew 13:54
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν εἰς τὴν πατρίδα αὐτοῦ ἐδίδασκεν αὐτοὺς ἐν τῇ συναγωγῇ αὐτῶν, ὥστε ἐκπλήσσεσθαι αὐτοὺς καὶ λέγειν· Πόθεν τούτῳ ἡ σοφία αὕτη καὶ αἱ δυνάμεις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/054.yaml
  text: And coming to his hometown[a], he was teaching them in their synagogue, so that they were astonished and said, “Where did this man get this wisdom and these powers?”
translation:
  language: ml
  text: അവൻ തന്റെ സ്വന്തം നാട്ടിൽ വന്ന്, അവരുടെ സിനഗോഗിൽ അവരെ പഠിപ്പിച്ചുകൊണ്ടിരുന്നു. അതിനാൽ അവർ വിസ്മയിച്ച്, “ഇയാൾക്ക് ഈ ജ്ഞാനവും ഈ ശക്തികളും[a] എവിടെനിന്നു ലഭിച്ചു?” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ശക്തിപ്രവൃത്തികൾ”; അതായത്, ശക്തി പ്രകടമാക്കുന്ന പ്രവൃത്തികൾ—പലപ്പോഴും അത്ഭുതപ്രവൃത്തികൾ എന്നു മനസ്സിലാക്കപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: πατρίδα
  choice: സ്വന്തം നാട്
  rationale: ഇവിടെ ഒരു രാഷ്ട്രമല്ല, യേശു നാട്ടുകാർക്ക് പരിചിതനായിരുന്ന സ്വന്തം പ്രദേശമാണ് ഉദ്ദേശിക്കുന്നത്. ‘സ്വന്തം നാട്’ ആ പ്രാദേശിക അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐδίδασκεν
  choice: പഠിപ്പിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം കഴിഞ്ഞകാലത്ത് തുടർന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നതിനാൽ ഈ രൂപം ഉപയോഗിച്ചു.
- source_word: συναγωγῇ
  choice: സിനഗോഗ്
  rationale: യഹൂദരുടെ ആരാധനാ-പഠനകേന്ദ്രത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്ന ആധുനിക മലയാള പ്രയോഗമാണിത്.
- source_word: ὥστε ἐκπλήσσεσθαι αὐτοὺς καὶ λέγειν
  choice: അതിനാൽ അവർ വിസ്മയിച്ച് ... എന്നു പറഞ്ഞു
  rationale: ὥστε ഫലത്തെ സൂചിപ്പിക്കുന്നു. ഗ്രീക്ക് അനന്തക്രിയാരൂപങ്ങളെ മലയാളത്തിൽ സ്വാഭാവികമായ ഫലവാക്യമായി നൽകി.
- source_word: Πόθεν
  choice: എവിടെനിന്നു ലഭിച്ചു
  rationale: ജ്ഞാനത്തിന്റെയും ശക്തികളുടെയും ഉറവിടത്തെക്കുറിച്ചുള്ള ചോദ്യമാണിത്; മലയാളത്തിൽ ഈ പ്രയോഗം ആ ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: τούτῳ
  choice: ഇയാൾക്ക്
  rationale: പ്രസംഗകരുടെ അകലം പാലിക്കുന്നതോ ലഘുവായി നിരസിക്കുന്നതോ ആയ ഭാവം മലയാളത്തിലെ ‘ഇയാൾ’ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: σοφία
  choice: ജ്ഞാനം
  rationale: അസാധാരണമായ ഉൾക്കാഴ്ചയും ഉപദേശശേഷിയും സൂചിപ്പിക്കുന്ന പതിവും വ്യക്തവുമായ തർജമ.
- source_word: δυνάμεις
  choice: ശക്തികൾ
  rationale: പദത്തിന്റെ അടിസ്ഥാനമായ ‘ശക്തികൾ’ എന്ന അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അത് ശക്തി പ്രകടമാകുന്ന അത്ഭുതപ്രവൃത്തികളെയും സൂചിപ്പിക്കാം. കൂടുതൽ വ്യാഖ്യാനാത്മകമായ അർഥം അടിക്കുറിപ്പിൽ നൽകി.
theological_decisions:
- issue: യേശുവിന്റെ അസാധാരണ പ്രവൃത്തികളെ സൂചിപ്പിക്കുന്ന δυνάμεις എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ശക്തികൾ
  alternative: ശക്തിപ്രവൃത്തികൾ; അത്ഭുതപ്രവൃത്തികൾ
  rationale: മൂലപദത്തിന്റെ തുറന്ന അർഥവ്യാപ്തി നിലനിർത്തി, അത് നിർബന്ധമായും ഒരു സാങ്കേതിക അത്ഭുതപദമായി ചുരുക്കിയില്ല. സന്ദർഭത്തിൽ പ്രവൃത്തികളായി പ്രകടമാകുന്ന ദൈവിക ശക്തി ഉദ്ദേശിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘പഠിപ്പിച്ചുകൊണ്ടിരുന്നു’ എന്ന രൂപം ഗ്രീക്കിലെ തുടരുന്ന പ്രവർത്തിഭാവം നിലനിർത്തുന്നു. ഉദ്ധരണിയിൽ ‘ഇയാൾ’ എന്നത് നാട്ടുകാരുടെ അകലം പാലിക്കുന്ന ഭാവം സൂക്ഷിക്കുന്നു; ‘ശക്തികൾ’ എന്നതിന്റെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ തുറന്നുവെച്ചു.
