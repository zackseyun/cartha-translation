  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ οὐκ ἐποίησεν ἐκεῖ δυνάμεις πολλὰς διὰ τὴν ἀπιστίαν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/058.yaml
  text: And he did not do many mighty works there because of their unbelief[a].
translation:
  language: ml
  text: അവരുടെ അവിശ്വാസം നിമിത്തം അവൻ അവിടെ അനേകം ശക്തമായ പ്രവൃത്തികൾ ചെയ്തില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അനേകം അത്ഭുതങ്ങൾ’ എന്നും ‘ശക്തിയുടെ അനേകം പ്രവൃത്തികൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദം ശക്തി പ്രകടമാക്കുന്ന പ്രവൃത്തികളെ സൂചിപ്പിക്കുന്നു; ഈ സന്ദർഭത്തിൽ അത് അത്ഭുതകരമായ പ്രവൃത്തികളെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν
  choice: ചെയ്തു
  rationale: ποιέω എന്ന പൊതുവായ ‘ചെയ്യുക’ എന്ന ക്രിയ δυνάμεις എന്ന പദത്തോടൊപ്പം വരുന്നതിനാൽ, മലയാളത്തിൽ സ്വാഭാവികമായി ‘വീര്യപ്രവൃത്തികൾ ചെയ്തു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: ἐκεῖ
  choice: അവിടെ
  rationale: സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന ഈ ക്രിയാവിശേഷണം സന്ദർഭത്തിലെ യേശുവിന്റെ സ്വദേശത്തെ പരാമർശിക്കുന്നു.
- source_word: δυνάμεις πολλὰς
  choice: അനേകം വീര്യപ്രവൃത്തികൾ
  rationale: സുവിശേഷങ്ങളിലെ ഈ പ്രയോഗം ശക്തി വെളിപ്പെടുത്തുന്ന അത്ഭുതപ്രവൃത്തികളെ സൂചിപ്പിക്കുന്നു. ‘വീര്യപ്രവൃത്തികൾ’ എന്നത് ശക്തിയുമായുള്ള പദബന്ധം നിലനിർത്തുകയും ‘അത്ഭുതങ്ങൾ’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ പരിഭാഷയിലേക്ക് മാത്രം അർഥം ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: διὰ τὴν ἀπιστίαν αὐτῶν
  choice: അവരുടെ അവിശ്വാസം നിമിത്തം
  rationale: accusative-നോടുകൂടിയ διά ഇവിടെ കാരണം സൂചിപ്പിക്കുന്നു. ἀπιστία വിശ്വാസമില്ലായ്മയെയോ അവിശ്വാസത്തെയോ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിലെ നിരാകരണത്തിന്റെ ശക്തി നിലനിർത്താൻ ‘അവിശ്വാസം’ തെരഞ്ഞെടുത്തു.
- source_word: καὶ οὐκ
  choice: ചെയ്തില്ല
  rationale: καί ആഖ്യാനം തുടരുന്നു; മലയാളത്തിലെ വാക്യപ്രവാഹത്തിൽ പ്രത്യേകമായി ‘അങ്ങനെ’ എന്ന അനുമാനാർഥം ചേർക്കാതെ, οὐκ ക്രിയയുടെ നിഷേധത്തിൽ സ്വാഭാവികമായി ഉൾപ്പെടുത്തി.
theological_decisions:
- issue: അവിശ്വാസം കാരണം യേശുവിന് പ്രവർത്തിക്കാൻ കഴിഞ്ഞില്ലെന്നാണോ, അതോ അവൻ അനേകം വീര്യപ്രവൃത്തികൾ ചെയ്തില്ലെന്നുമാത്രമാണോ വാക്യം പറയുന്നത്?
  choice: ‘അവൻ ... അനേകം വീര്യപ്രവൃത്തികൾ ചെയ്തില്ല’ എന്ന പ്രവർത്തിക്കാതിരിപ്പിന്റെ പ്രസ്താവന നിലനിർത്തി.
  alternative: ‘അവന് അനേകം അത്ഭുതങ്ങൾ ചെയ്യാൻ കഴിഞ്ഞില്ല’ എന്നു കഴിവില്ലായ്മ സൂചിപ്പിച്ച് പരിഭാഷപ്പെടുത്താം.
  rationale: ഗ്രീക്കിൽ οὐκ ἐποίησεν (‘ചെയ്തില്ല’) എന്നാണ്; കഴിവില്ലായ്മ സൂചിപ്പിക്കുന്ന ക്രിയയില്ല. അതിനാൽ മത്തായി പറയുന്നതിലധികം ദൈവശാസ്ത്രപരമായ നിഗമനം ചേർക്കാതെ മൂലപാഠത്തിലെ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘വീര്യപ്രവൃത്തികൾ’ ബൈബിൾപരമായ ഗൗരവം നിലനിർത്തുന്നതിനൊപ്പം δύναμις എന്ന പദത്തിലെ ശക്തിയുടെ ആശയം സംരക്ഷിക്കുന്നു.
