id: MAT.13.47
reference: Matthew 13:47
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Πάλιν ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν σαγήνῃ βληθείσῃ εἰς τὴν θάλασσαν καὶ ἐκ παντὸς γένους συναγαγούσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/047.yaml
  text: Again[b][a], the kingdom of heaven is like a dragnet cast into the sea and gathering from every kind.
translation:
  language: ml
  text: വീണ്ടും, സ്വർഗരാജ്യം കടലിലേക്കു വീശിയെറിയപ്പെട്ട് എല്ലാ ഇനത്തിൽപ്പെട്ടവയെയും ശേഖരിച്ച ഒരു വലിയ വല[a][b] പോലെയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വല’; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദം വെള്ളത്തിലൂടെ വലിച്ചുകൊണ്ടുപോകുന്ന വലിയ വലയെ, അഥവാ സീൻ വലയെ, കൂടുതൽ കൃത്യമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘എല്ലാ ഇനങ്ങളിൽനിന്നും ശേഖരിച്ചത്’; ഗ്രീക്കിൽ കർമം വ്യക്തമല്ല. മത്സ്യബന്ധനദൃശ്യം അതു മീനുകളെ സൂചിപ്പിക്കുന്നതായി കാണിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν
  choice: വീണ്ടും
  rationale: മുമ്പുള്ള ഉപമകളുടെ തുടർച്ചയിൽ മറ്റൊരു ഉപമ അവതരിപ്പിക്കുന്ന ക്രിയാവിശേഷണം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὁμοία ἐστὶν
  choice: പോലെയാണ്
  rationale: മത്തായിയുടെ രാജ്യോപമകളിലെ താരതമ്യരൂപം ലളിതവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: സ്വർഗരാജ്യം
  rationale: മത്തായിയുടെ സവിശേഷ പ്രയോഗം ‘ദൈവരാജ്യം’ എന്നു മാറ്റാതെ, മലയാളത്തിൽ പരിചിതവും സംക്ഷിപ്തവുമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: σαγήνῃ
  choice: ഒരു വലിയ വല
  rationale: വെള്ളത്തിലൂടെ വലിച്ചുകൊണ്ടുപോകുന്ന വലിയ വലയെയാണ് ഗ്രീക്ക് പദം സൂചിപ്പിക്കുന്നത്; സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ പദം മുഖ്യവാക്യത്തിൽ നൽകി കൂടുതൽ കൃത്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: βληθείσῃ εἰς τὴν θάλασσαν
  choice: കടലിൽ വീശിയിട്ടതും
  rationale: വല ഉപയോഗിക്കുന്ന സാഹചര്യത്തിൽ βληθείσῃ എന്നതിന്റെ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുകയും θάλασσα എന്ന ‘കടൽ’ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐκ παντὸς γένους συναγαγούσῃ
  choice: എല്ലാ ഇനങ്ങളിൽനിന്നും ശേഖരിച്ചതുമായ
  rationale: ἐκ എന്ന മുൻപ്രത്യയവും ‘ഓരോ/എല്ലാ ഇനം’ എന്ന വ്യാപ്തിയും നിലനിർത്തുന്നു; ഗ്രീക്കിൽ വ്യക്തമാക്കാത്ത ‘മീൻ’ മുഖ്യവാക്യത്തിൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ‘സ്വർഗരാജ്യം’ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: മത്തായിയുടെ ‘സ്വർഗരാജ്യം’ എന്ന പ്രയോഗം അതേപടി നിലനിർത്തുക
  alternative: ‘ദൈവരാജ്യം’ അല്ലെങ്കിൽ ‘സ്വർഗത്തിന്റെ ഭരണം’
  rationale: മൂലപാഠത്തിലെ മത്തായിസവിശേഷമായ ഭാഷ സംരക്ഷിക്കുകയും അതിനെ മറ്റൊരു ദൈവശാസ്ത്രപരമായ പര്യായംകൊണ്ട് വ്യാഖ്യാനിച്ച് തീർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: എല്ലാ ഇനങ്ങളിൽനിന്നും ശേഖരിക്കപ്പെടുന്നത് എന്ത്
  choice: മുഖ്യവാക്യത്തിൽ കർമം വ്യക്തമാക്കാതെ വിടുക
  alternative: ‘എല്ലാ ഇനം മീനുകളെയും ശേഖരിച്ചത്’
  rationale: മത്സ്യബന്ധനദൃശ്യം മീനുകളെ സൂചിപ്പിക്കുന്നുവെങ്കിലും ഗ്രീക്കിൽ കർമം പ്രകടമല്ല; അതിനാൽ മൂലപാഠത്തിന്റെ സംക്ഷിപ്തതയും സൂക്ഷ്മമായ അനിശ്ചിതത്വവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഉപമയുടെ ഗ്രീക്ക് വാക്യഘടന കഴിയുന്നത്ര നിലനിർത്തിയെങ്കിലും മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ബന്ധകക്രിയാരൂപങ്ങൾ ഉപയോഗിച്ചു; വ്യക്തമല്ലാത്ത കർമം അടിക്കുറിപ്പിൽ മാത്രം വിശദീകരിച്ചു.
