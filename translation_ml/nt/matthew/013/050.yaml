  source_fidelity: ഗ്രീക്കിലെ ഭാവികാല ക്രിയയായ βαλοῦσιν, കർമസർവനാമമായ αὐτούς, ‘കാമിനോൻ തു പ്യൂറോസ്’ എന്ന അഗ്നിച്ചൂളയുടെ ദൃശ്യബിംബം, സ്ഥലസൂചനയായ ἐκεῖ, ഭാവിയിലെ അസ്തിത്വപ്രസ്താവനയായ ἔσται, കൂടാതെ മത്തായിയിലെ സ്ഥിരപ്രയോഗമായ ‘കരച്ചിലും പല്ലുകടിയും’ എന്നിവ വിശ്വസ്തമായി പകരുന്നു. ‘തീച്ചൂള’ മുഖ്യപാഠത്തിൽ സ്വാഭാവികമാണ്; അടിക്കുറിപ്പ് അക്ഷരാർഥഘടന യഥാവിധി രേഖപ്പെടുത്തുന്നു.
