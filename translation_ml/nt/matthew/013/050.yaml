id: MAT.13.50
reference: Matthew 13:50
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ βαλοῦσιν αὐτοὺς εἰς τὴν κάμινον τοῦ πυρός· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/050.yaml
  text: and they will throw them into the furnace of fire[a]. In that place there will be weeping and gnashing of teeth.
translation:
  language: ml
  text: അവരെ തീച്ചൂളയിൽ[a] എറിഞ്ഞുകളയും. അവിടെ കരച്ചിലും പല്ലുകടിയും ഉണ്ടാകും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘തീയുടെ ചൂളയിൽ.’
    reason: ഗ്രീക്കിലെ κάμινον τοῦ πυρός എന്ന ഷഷ്ഠീവ്യവസ്ഥയുടെ അക്ഷരാർഥം രേഖപ്പെടുത്തുകയും മുഖ്യപാഠത്തിലെ സ്വാഭാവികമായ ‘തീച്ചൂള’ എന്ന രൂപത്തിന് സുതാര്യത നൽകുകയും ചെയ്യുന്നു.
lexical_decisions:
- source_word: βαλοῦσιν
  choice: എറിഞ്ഞുകളയും
  rationale: ഭാവികാല സജീവക്രിയയായ βάλλωയുടെ ബലപ്രയോഗത്തോടെയുള്ള ‘എറിയുക’ എന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: αὐτοὺς
  choice: അവരെ
  rationale: മുൻസന്ദർഭത്തിലെ ദുഷ്ടരെ സൂചിപ്പിക്കുന്ന കർമരൂപ ബഹുവചന സർവനാമം നേരിട്ട് പകരുന്നു.
- source_word: κάμινον τοῦ πυρός
  choice: തീച്ചൂളയിൽ
  rationale: ഗ്രീക്കിലെ അക്ഷരാർഥം ‘തീയുടെ ചൂള’ എന്നാണെങ്കിലും, ‘തീച്ചൂള’ അതേ ദൃശ്യബിംബം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു; അക്ഷരാർഥഘടന അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: ἐκεῖ
  choice: അവിടെ
  rationale: സ്ഥലത്തെ ഊന്നിപ്പറയുന്ന ഗ്രീക്ക് ക്രിയാവിശേഷണത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: ἔσται
  choice: ഉണ്ടാകും
  rationale: തുടർന്നുവരുന്ന നാമങ്ങളെ അസ്തിത്വപരമായി അവതരിപ്പിക്കുന്ന ഭാവികാലപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ പകരുന്നു.
- source_word: ὁ κλαυθμὸς
  choice: കരച്ചിൽ
  rationale: വിലാപത്തോടെയുള്ള കരച്ചിലിനെ സൂചിപ്പിക്കുന്ന പദം; ‘വിലാപം’ എന്ന് വ്യാഖ്യാനിച്ച് അർഥം ചുരുക്കാതെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ രൂപം.
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: പല്ലുകടി
  rationale: പല്ലുകൾ കടിക്കുന്നതോ ഞെരിക്കുന്നതോ സൂചിപ്പിക്കുന്ന മത്തായിയിലെ സ്ഥിരപ്രയോഗം സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: അന്ത്യന്യായവിധിയുടെ ദൃശ്യബിംബങ്ങളുടെ വിവർത്തനം
  choice: ‘തീച്ചൂള’, ‘കരച്ചിൽ’, ‘പല്ലുകടി’ എന്നീ മൂർത്തമായ ദൃശ്യങ്ങൾ മൃദൂകരിക്കാതെയും വിശദീകരിച്ച് വിപുലീകരിക്കാതെയും നിലനിർത്തി.
  alternative: ‘അഗ്നിജ്വാലകൾ നിറഞ്ഞ ചൂള’ എന്നോ ‘അവർ ദുഃഖത്തിൽ കരഞ്ഞ് പല്ലു ഞെരിക്കും’ എന്നോ വ്യാഖ്യാനാത്മകമായി പരിഭാഷപ്പെടുത്തുക.
  rationale: മൂലവാക്യം ന്യായവിധിയുടെ കഠിനമായ ദൃശ്യബിംബങ്ങൾ അവതരിപ്പിക്കുന്നു. അവയുടെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തി നിർണയിക്കാതെ, വാചകത്തിലെ ശക്തിയും ഉദ്ദേശ്യപൂർവമായ സംക്ഷിപ്തതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘എറിഞ്ഞുകളയും’ വിധിയുടെ ശക്തി നിലനിർത്തുന്നു; ‘അവിടെ’ മൂലത്തിലെ സ്ഥലസൂചന സംക്ഷിപ്തമായി പകരുന്നു. അടിക്കുറിപ്പ് സൂചകം [a] മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
