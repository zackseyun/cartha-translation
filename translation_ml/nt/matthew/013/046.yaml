id: MAT.13.46
reference: Matthew 13:46
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂εὑρὼν δὲ⸃ ἕνα πολύτιμον μαργαρίτην ἀπελθὼν πέπρακεν πάντα ὅσα εἶχεν καὶ ἠγόρασεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/046.yaml
  text: and having found one pearl of great value[a], he went away, sold all that he had, and bought it.
translation:
  language: ml
  text: വലിയ വിലയുള്ള ഒരു മുത്ത് കണ്ടെത്തിയപ്പോൾ[a] അയാൾ പോയി, തനിക്കുണ്ടായിരുന്നതെല്ലാം വിറ്റ് അതു വാങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വിലയേറിയ ഒരു മുത്ത് കണ്ടെത്തിയപ്പോൾ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρὼν δὲ
  choice: കണ്ടെത്തിയപ്പോൾ
  rationale: മുൻപുണ്ടായ പ്രവൃത്തിയെ സ്വാഭാവികമായ മലയാള കാലവാക്യമായി അവതരിപ്പിക്കുന്നു; δέ ഇവിടെ ശക്തമായ വിരോധമല്ല, നേരിയ ആഖ്യാനബന്ധമാണ്, അതിനാൽ പ്രത്യേക ബന്ധപദം ചേർക്കേണ്ടതില്ല.
- source_word: ἕνα
  choice: ഒരു
  rationale: ഗ്രീക്കിലെ സംഖ്യാവാചകം നിലനിർത്തി, അസാധാരണ മൂല്യമുള്ള ഏക മുത്തിലേക്കു ശ്രദ്ധ കേന്ദ്രീകരിക്കുന്നു.
- source_word: πολύτιμον
  choice: വലിയ വിലയുള്ള
  rationale: അത്യധികമായ മൂല്യം സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു; ‘വിലയേറിയ’ എന്ന സ്വാഭാവിക പകരവും അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: μαργαρίτην
  choice: മുത്ത്
  rationale: സന്ദർഭത്തിനു യോജിച്ച സാധാരണ നിഘണ്ടുവർത്ഥം.
- source_word: ἀπελθὼν
  choice: അയാൾ പോയി
  rationale: പ്രവൃത്തികളുടെ ക്രമം നിലനിർത്തിക്കൊണ്ട് ഗ്രീക്ക് കൃദന്തരൂപം വായിക്കാൻ സ്വാഭാവികമായ മലയാള ക്രിയാരൂപമാക്കി.
- source_word: πέπρακεν
  choice: വിറ്റ്
  rationale: പൂർണമായി നടന്ന വിൽപ്പനയെ ആഖ്യാനക്രമത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; ഗ്രീക്കിലെ perfect രൂപത്തിന്റെ പൂർത്തീകരണഭാവം സന്ദർഭത്തിൽ നിലനിൽക്കുന്നു.
- source_word: πάντα ὅσα εἶχεν
  choice: തനിക്കുണ്ടായിരുന്നതെല്ലാം
  rationale: πάντα എന്ന സമഗ്രതയും കൈവശമുണ്ടായിരുന്നവയെ സൂചിപ്പിക്കുന്ന ബന്ധവാക്യവും സംക്ഷിപ്തമായി സംരക്ഷിക്കുന്നു.
- source_word: ἠγόρασεν
  choice: വാങ്ങി
  rationale: സാധാരണവും കൃത്യവുമായ മലയാള തുല്യപദം.
- source_word: αὐτόν
  choice: അതു
  rationale: വ്യാകരണപരമായി പുല്ലിംഗമായ സർവനാമം ജഡവസ്തുവായ മുത്തിനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികമായ നിർജീവ സർവനാമം ഉപയോഗിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. അയാൾ എന്ന സർവനാമം വ്യാപാരിയെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു; വാക്യം മുൻവാക്യത്തിൽ ആരംഭിച്ച ഉപമയുടെ തുടർച്ചയായതിനാൽ തുടക്കത്തിൽ അധിക ബന്ധപദം ചേർത്തിട്ടില്ല. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട പദപ്രയോഗത്തിനു പിന്നാലെ പ്രധാനപാഠത്തിൽ നൽകിയിരിക്കുന്നു.
