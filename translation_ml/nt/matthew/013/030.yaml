id: MAT.13.30
reference: Matthew 13:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἄφετε συναυξάνεσθαι ἀμφότερα ⸀μέχρι τοῦ θερισμοῦ· καὶ ἐν καιρῷ τοῦ θερισμοῦ ἐρῶ τοῖς θερισταῖς· Συλλέξατε πρῶτον τὰ ζιζάνια καὶ δήσατε αὐτὰ εἰς δέσμας πρὸς τὸ κατακαῦσαι αὐτά, τὸν δὲ σῖτον ⸀συναγάγετε εἰς τὴν ἀποθήκην μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/030.yaml
  text: Let both grow together until the harvest[a], and at the time of harvest I will tell the reapers, ‘First collect the weeds and tie them into bundles to burn them, but gather the wheat into my storehouse.’
translation:
  language: ml
  text: 'കൊയ്ത്തുവരെ രണ്ടും ഒരുമിച്ചു വളരട്ടെ. കൊയ്ത്തുകാലത്ത് ഞാൻ കൊയ്ത്തുകാരോടു പറയും: ‘ആദ്യം കളകൾ[a] ശേഖരിച്ച് ചുട്ടുകളയാൻ കെട്ടുകളായി കെട്ടുക; എന്നാൽ ഗോതമ്പ് എന്റെ കളപ്പുരയിൽ ശേഖരിക്കുക.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഡാർണൽ കളകൾ’; പരമ്പരാഗതമായി ‘ടെയേഴ്സ്’ എന്നു വിളിക്കുന്നു.
    reason: ζιζάνια എന്ന പദം സാധാരണ കളകളെക്കാൾ നിർദിഷ്ടമായി ഡാർണൽ എന്ന ദോഷകരമായ കളയെ സൂചിപ്പിക്കാം; പ്രധാനവാചകം വായനാസൗകര്യത്തിനായി പൊതുപദം ഉപയോഗിക്കുന്നു.
lexical_decisions:
- source_word: ἄφετε συναυξάνεσθαι ἀμφότερα
  choice: രണ്ടും ഒരുമിച്ചു വളരട്ടെ
  rationale: അനുവാദാത്മക കല്പനയായ ἄφετεയും συν- സൂചിപ്പിക്കുന്ന ഒരുമിച്ചുള്ള വളർച്ചയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: μέχρι τοῦ θερισμοῦ
  choice: കൊയ്ത്തുവരെ
  rationale: ഉപമയിലെ നിർദിഷ്ട കൊയ്ത്തുസമയത്തോളം എന്ന കാലപരിധി സംക്ഷിപ്തവും വ്യക്തവുമായി നൽകുന്നു.
- source_word: ἐν καιρῷ τοῦ θερισμοῦ
  choice: കൊയ്ത്തുകാലത്ത്
  rationale: കൊയ്ത്തിന്റെ യോജിച്ച സമയത്ത് എന്ന ആശയം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: θερισταῖς
  choice: കൊയ്ത്തുകാരോട്
  rationale: വിള കൊയ്യുന്ന തൊഴിലാളികളെ സൂചിപ്പിക്കുന്ന വ്യക്തവും സാധാരണക്കാർക്ക് മനസ്സിലാകുന്നതുമായ പദം.
- source_word: τὰ ζιζάνια
  choice: കളകൾ
  rationale: വിളയ്ക്കിടയിൽ വളരുന്ന ദോഷകരമായ സസ്യങ്ങളെ പൊതുവായി സൂചിപ്പിക്കുന്ന സുഗ്രാഹ്യമായ മലയാളം; കൂടുതൽ നിർദിഷ്ട സസ്യപരിചയം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: δήσατε αὐτὰ εἰς δέσμας
  choice: കെട്ടുകളായി കെട്ടുക
  rationale: εἰς സൂചിപ്പിക്കുന്ന ഫലവും δήσατε എന്ന കെട്ടുന്ന പ്രവൃത്തിയും നിലനിർത്തുന്നു; മലയാളത്തിലെ ആവർത്തനം ഇവിടെ സ്വാഭാവികവും ദൃശ്യവുമാണ്.
- source_word: πρὸς τὸ κατακαῦσαι αὐτά
  choice: ചുട്ടുകളയാൻ
  rationale: ഉദ്ദേശ്യം വ്യക്തമാക്കുകയും κατακαίωയിലെ തീയിൽ ദഹിപ്പിക്കൽ എന്ന ശക്തമായ അർഥം സ്വാഭാവികമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: τὸν δὲ σῖτον συναγάγετε εἰς τὴν ἀποθήκην μου
  choice: എന്നാൽ ഗോതമ്പ് എന്റെ കളപ്പുരയിൽ ശേഖരിക്കുക
  rationale: δὲയുടെ വൈരുധ്യം ‘എന്നാൽ’കൊണ്ട് സൂചിപ്പിച്ച്, σῖτοςയും ἀποθήκηയും കാർഷികസന്ദർഭത്തിന് യോജിച്ച പദങ്ങളാൽ വിവർത്തനം ചെയ്യുന്നു.
theological_decisions:
- issue: അന്തിമ വേർതിരിവിനെ സൂചിപ്പിക്കുന്ന ഉപമാചിത്രം
  choice: കൃഷിയുമായി ബന്ധപ്പെട്ട ചിത്രഭാഷ അതേപടി നിലനിർത്തി
  alternative: അന്തിമ ന്യായവിധിയെയോ നാശത്തെയോ വിവർത്തനത്തിൽ തന്നെ തുറന്നുപറയുക
  rationale: ഈ വാക്യം ഉപമയുടെ ഭാഗമാണ്; അതിന്റെ വ്യാഖ്യാനം അധ്യായത്തിൽ പിന്നീട് വരുന്നു. അതിനാൽ പിന്നീടുള്ള വിശദീകരണം മുൻകൂട്ടി വാക്യത്തിലേക്ക് കൊണ്ടുവരാതെ ഉപമയിലെ സംഘർഷവും ചിത്രവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നേരിട്ടുള്ള സംഭാഷണത്തിന്റെ കല്പനാഭാവവും കാർഷിക ദൃശ്യവും നിലനിർത്തിയിരിക്കുന്നു.
