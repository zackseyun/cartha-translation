id: MAT.13.31
reference: Matthew 13:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν παρέθηκεν αὐτοῖς λέγων· Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν κόκκῳ σινάπεως, ὃν λαβὼν ἄνθρωπος ἔσπειρεν ἐν τῷ ἀγρῷ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/031.yaml
  text: He set another parable before them, saying, “The kingdom of heaven is like a mustard seed, which a man took and sowed in his field.”
translation:
  language: ml
  text: 'അവൻ മറ്റൊരു ഉപമയും അവരുടെ മുമ്പിൽ അവതരിപ്പിച്ചുകൊണ്ട് പറഞ്ഞു: “സ്വർഗരാജ്യം ഒരു കടുകുമണിയോടു സദൃശമാണ്. ഒരു മനുഷ്യൻ അതെടുത്ത് തന്റെ വയലിൽ വിതച്ചു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρέθηκεν
  choice: അവരുടെ മുമ്പിൽ അവതരിപ്പിച്ചു
  rationale: ഉപമ ശ്രോതാക്കളുടെ മുമ്പിൽ വെക്കുക, അവതരിപ്പിക്കുക എന്ന παρατίθημι എന്ന ക്രിയയുടെ ദൃശ്യഭാവം നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: παραβολὴν
  choice: ഉപമ
  rationale: സിനോപ്റ്റിക് സുവിശേഷങ്ങളിലെ യേശുവിന്റെ ഉപദേശകഥകൾക്കുള്ള സ്ഥിരവും കൃത്യവുമായ മലയാള പദമാണ്.
- source_word: Ὁμοία ἐστὶν
  choice: സദൃശമാണ്
  rationale: താരതമ്യം അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം സംക്ഷിപ്തവും മാന്യവുമായ മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: സ്വർഗരാജ്യം
  rationale: മത്തായിയുടെ സവിശേഷ പ്രയോഗത്തിന്റെ പരമ്പരാഗതവും വ്യാപകമായി മനസ്സിലാക്കപ്പെടുന്നതുമായ മലയാള തുല്യപദം; രാജ്യം എന്നതിൽ ഭരണവും അധികാരപരിധിയും ഉൾപ്പെടാനുള്ള തുറന്ന നില നിലനിർത്തുന്നു.
- source_word: κόκκῳ σινάπεως
  choice: ഒരു കടുകുമണി
  rationale: κόκκος എന്നതിന്റെ വിത്ത്/മണി എന്ന അർത്ഥം ഈ സുപരിചിത കാർഷികചിത്രത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὃν λαβὼν ἄνθρωπος
  choice: ഒരു മനുഷ്യൻ അതെടുത്ത്
  rationale: λαβών എന്ന പങ്കാളിക്രിയയുടെ മുൻപ്രവർത്തനവും ἄνθρωπος എന്ന ഏകവചന കഥാനടനും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἔσπειρεν
  choice: വിതച്ചു
  rationale: σπείρω എന്നതിന്റെ വിത്തുവിതയ്ക്കുക എന്ന കൃത്യമായ കാർഷിക അർത്ഥം നൽകുന്നു.
- source_word: ἐν τῷ ἀγρῷ αὐτοῦ
  choice: തന്റെ വയലിൽ
  rationale: ἀγρός എന്ന കാർഷികസ്ഥലവും αὐτοῦ സൂചിപ്പിക്കുന്ന കർത്താവിലേക്കുള്ള സ്വത്തുബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: βασιλεία τῶν οὐρανῶν എന്ന മത്തായിയുടെ പ്രയോഗം
  choice: സ്വർഗരാജ്യം
  alternative: സ്വർഗത്തിന്റെ ഭരണം; സ്വർഗങ്ങളുടെ രാജ്യം
  rationale: മത്തായിയുടെ സ്ഥിരപ്രയോഗം തിരിച്ചറിയാവുന്ന രൂപത്തിൽ സംരക്ഷിക്കുന്നു; അതിനെ ഭരണം എന്ന ആശയത്തിലേക്ക് മാത്രം ചുരുക്കുകയോ ഗ്രീക്ക് ബഹുവചനത്തെ അസ്വാഭാവികമായി പകർത്തുകയോ ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്ക് വാക്യക്രമത്തിന്റെ ഭാരം ഒഴിവാക്കി രണ്ട് ഉദ്ധരണിവാക്യങ്ങളാക്കിയെങ്കിലും ആശയബന്ധവും എല്ലാ ഘടകങ്ങളും നിലനിർത്തിയിരിക്കുന്നു.
