- from: ആരെങ്കിലും രാജ്യത്തിന്റെ വചനം കേട്ടിട്ടും അതു മനസ്സിലാക്കാതിരിക്കുമ്പോൾ, തിന്മയായവൻ[a] വന്ന് അവന്റെ ഹൃദയത്തിൽ വിതയ്ക്കപ്പെട്ടത് തട്ടിയെടുക്കുന്നു. വഴിയരികിൽ വിതയ്ക്കപ്പെട്ടവൻ[b] ഇയാളാണ്.
