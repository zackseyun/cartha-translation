id: MAT.13.19
reference: Matthew 13:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: παντὸς ἀκούοντος τὸν λόγον τῆς βασιλείας καὶ μὴ συνιέντος, ἔρχεται ὁ πονηρὸς καὶ ἁρπάζει τὸ ἐσπαρμένον ἐν τῇ καρδίᾳ αὐτοῦ· οὗτός ἐστιν ὁ παρὰ τὴν ὁδὸν σπαρείς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/019.yaml
  text: When anyone hears the word of the kingdom and does not understand it[a], the evil one comes and snatches away what has been sown in his heart[b]. This is the one sown beside the road.
translation:
  language: ml
  text: ആരെങ്കിലും രാജ്യത്തിന്റെ വചനം കേൾക്കുകയും അത് മനസ്സിലാക്കാതിരിക്കുകയും ചെയ്യുമ്പോൾ, ദുഷ്ടൻ[a] വന്ന് അവന്റെ ഹൃദയത്തിൽ വിതയ്ക്കപ്പെട്ടത് തട്ടിയെടുക്കുന്നു. വഴിയരികിൽ വിതയ്ക്കപ്പെട്ടവൻ അവനാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തിന്മയായവൻ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: παντὸς ἀκούοντος
  choice: ആരെങ്കിലും … കേട്ടിട്ടും … മനസ്സിലാക്കാതിരിക്കുമ്പോൾ
  rationale: ജനകീയമായി എല്ലാവരെയും ഉൾക്കൊള്ളുന്ന ഗ്രീക്ക് പ്രയോഗത്തെ സ്വാഭാവികമായ പൊതുനിബന്ധനയായി അവതരിപ്പിക്കുന്നു; καί ഇവിടെ കേൾവിയും മനസ്സിലാക്കാതിരിക്കലും തമ്മിലുള്ള വൈരുധ്യം സൂചിപ്പിക്കുന്നതിനാൽ ‘കേട്ടിട്ടും’ എന്നു നൽകി.
- source_word: λόγον τῆς βασιλείας
  choice: രാജ്യത്തിന്റെ വചനം
  rationale: λόγος എന്നതിന്റെ ‘വചനം/സന്ദേശം’ എന്ന അർഥപരിധി അംഗീകരിക്കുമ്പോഴും, വിത്തും വചനവും തമ്മിലുള്ള ഉപമാബന്ധം നിലനിർത്താൻ ‘വചനം’ തെരഞ്ഞെടുത്തു.
- source_word: μὴ συνιέντος
  choice: അതു മനസ്സിലാക്കാതിരിക്കുമ്പോൾ
  rationale: സന്ദേശത്തിന്റെ അർഥം ഗ്രഹിക്കാതിരിക്കുക എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘അതു’ മുൻപുള്ള വചനത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ὁ πονηρὸς
  choice: തിന്മയായവൻ
  rationale: നിർദ്ദിഷ്ട വ്യക്തിപരമായ ദുഷ്ടശക്തിയെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; എന്നാൽ ‘പിശാച്’ അല്ലെങ്കിൽ ‘സാത്താൻ’ എന്നു മൂലപാഠത്തേക്കാൾ വ്യക്തമായി തിരിച്ചറിയിക്കുന്നില്ല.
- source_word: ἁρπάζει
  choice: തട്ടിയെടുക്കുന്നു
  rationale: ബലത്തോടെയും പെട്ടെന്നും എടുത്തുകളയുക എന്ന ἁρπάζωയുടെ സജീവഭാവം മലയാളത്തിൽ പകർത്തുന്നു.
- source_word: τὸ ἐσπαρμένον
  choice: വിതയ്ക്കപ്പെട്ടത്
  rationale: നപുംസകലിംഗത്തിലുള്ള substantival perfect passive participle-ന്റെ കർമണി അർഥവും പൂർത്തിയായ വിതയ്ക്കലിന്റെ ഫലാവസ്ഥയും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: അവന്റെ ഹൃദയത്തിൽ
  rationale: ‘ഹൃദയം’ എന്ന ബൈബിൾ മാനവശാസ്ത്രപദം വ്യാഖ്യാനവിസ്താരമില്ലാതെ സൂക്ഷിക്കുകയും ഏകവചന സർവനാമം പ്രതിഫലിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: οὗτός ἐστιν ὁ παρὰ τὴν ὁδὸν σπαρείς
  choice: വഴിയരികിൽ വിതയ്ക്കപ്പെട്ടവൻ ഇയാളാണ്
  rationale: കേൾവിക്കാരനെ വിതയ്ക്കപ്പെട്ട വിത്തിനോടോ സ്ഥലത്തോടോ രൂപകമായി തിരിച്ചറിയിക്കുന്ന ഗ്രീക്കിലെ ഉദ്ദേശ്യപൂർവമായ പ്രയോഗം തിരുത്താതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ὁ πονηρὸς എന്നതിന്റെ വ്യക്തിത്വം
  choice: വ്യക്തിപരമായ ദുഷ്ടപ്രവർത്തകൻ—‘തിന്മയായവൻ’
  alternative: അമൂർത്തമായ ‘തിന്മ’
  rationale: വന്ന് വിതയ്ക്കപ്പെട്ടത് തട്ടിയെടുക്കുന്ന പ്രവർത്തനം വ്യക്തിപരമായ കർത്താവിനെ സൂചിപ്പിക്കുന്നു; അതേസമയം ആ വ്യക്തിയെ പിശാച്/സാത്താൻ എന്നു മൂലപാഠത്തിനു മീതെ പേരിട്ട് നിർവചിക്കുന്നില്ല.
- issue: വിത്ത്, നിലം, കേൾവിക്കാരൻ എന്നിവയുടെ രൂപകപരമായ തിരിച്ചറിയൽ
  choice: ‘വഴിയരികിൽ വിതയ്ക്കപ്പെട്ടവൻ’ എന്ന അസാധാരണമായ തിരിച്ചറിയൽ നിലനിർത്തി
  alternative: ‘വഴിയരികിലെ നിലംപോലെയുള്ളവൻ’ എന്ന വിശദീകരണപരമായ രൂപം
  rationale: ഗ്രീക്ക് പാഠം വിതയ്ക്കപ്പെട്ടവനെത്തന്നെ വ്യക്തിയുമായി ബന്ധിപ്പിക്കുന്നതിനാൽ അതിലെ രൂപകസമ്മർദവും അവ്യക്തതയും ലഘൂകരിക്കാതെ സൂക്ഷിക്കുന്നു.
- issue: αὐτοῦ എന്ന ഏകവചന പുല്ലിംഗ സർവനാമം
  choice: ‘അവന്റെ ഹൃദയത്തിൽ’
  alternative: ‘അയാളുടെ ഹൃദയത്തിൽ’ അല്ലെങ്കിൽ ‘അവരുടെ ഹൃദയത്തിൽ’
  rationale: ഗ്രീക്കിലെ ഏകവചന പുല്ലിംഗ രൂപം പ്രതിഫലിപ്പിക്കുന്നു; വാക്യത്തിന്റെ ആരംഭത്തിലെ ‘ആരെങ്കിലും’ അതിന്റെ പൊതുവായ പ്രതിനിധാനസ്വഭാവം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘രാജ്യം’, ‘വചനം’, ‘ഹൃദയം’ എന്നീ പരിചിതമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തിയിട്ടുണ്ട്. രൂപകത്തിന്റെ അസാധാരണത വിശദീകരിച്ച് നീക്കാതെ, സാധാരണ വായനക്കാരന് ഗ്രഹിക്കാവുന്ന വാക്യഘടന ഉപയോഗിച്ചു.
