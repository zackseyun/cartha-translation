id: MAT.13.52
reference: Matthew 13:52
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Διὰ τοῦτο πᾶς γραμματεὺς μαθητευθεὶς ⸂τῇ βασιλείᾳ⸃ τῶν οὐρανῶν ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδεσπότῃ ὅστις ἐκβάλλει ἐκ τοῦ θησαυροῦ αὐτοῦ καινὰ καὶ παλαιά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/052.yaml
  text: Then he said to them[c][b][a], “Therefore every scribe who has been trained for the kingdom of heaven is like a master of a house who brings out of his treasure new things and old.”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “അതുകൊണ്ട്, സ്വർഗരാജ്യത്തിനായി പരിശീലനം ലഭിച്ച ഓരോ ശാസ്ത്രിയും[a] തന്റെ ഭണ്ഡാരത്തിൽനിന്ന്[b] പുതിയതും പഴയതും പുറത്തെടുക്കുന്ന ഒരു ഗൃഹനാഥനെപ്പോലെയാണ്[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സ്വർഗരാജ്യത്തിന്റെ ശിഷ്യനായിത്തീർന്ന ഓരോ ശാസ്ത്രിയും.” ഗ്രീക്ക് പദത്തിന് ശിഷ്യനാക്കപ്പെടുക എന്ന അർഥത്തോടൊപ്പം പഠിപ്പിക്കപ്പെടുക, പരിശീലനം ലഭിക്കുക എന്നീ അർഥങ്ങളും ഉണ്ടാകാം.
    reason: alternative_reading
  - marker: b
    text: “ഭണ്ഡാരം” എന്ന പദം വിലയേറിയ വസ്തുക്കളുടെ ശേഖരത്തെയോ അവ സൂക്ഷിച്ചിരിക്കുന്ന സംഭരണസ്ഥലത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: “ഗൃഹനാഥൻ” എന്നതിന് “വീട്ടുതലവൻ” അഥവാ “ഒരു വീട്ടിന്റെ യജമാനൻ” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: അതുകൊണ്ട്
  rationale: മുൻസംഭാഷണത്തിൽനിന്നുള്ള നിഗമനബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: πᾶς γραμματεὺς
  choice: ഓരോ ശാസ്ത്രിയും
  rationale: γραμματεύς എന്ന പദത്തിന്റെ നേരിട്ടുള്ള പാരമ്പര്യാർഥമായ ‘ശാസ്ത്രി’ നിലനിർത്തുന്നു; ‘നിയമോപദേഷ്ടാവ്’ എന്നു ചുരുക്കി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: μαθητευθεὶς τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: സ്വർഗരാജ്യത്തിനായി ശിക്ഷണം ലഭിച്ച
  rationale: നിഷ്ക്രിയ പങ്കാളിത്തരൂപത്തിന്റെ രൂപപ്പെടുത്തപ്പെടുക/പഠിപ്പിക്കപ്പെടുക എന്ന ആശയവും ദത്തിവിന്റെ ലക്ഷ്യബന്ധവും നിലനിർത്തുന്നു; ശിഷ്യനായിത്തീർന്ന എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἀνθρώπῳ οἰκοδεσπότῃ
  choice: ഒരു വീട്ടുടമസ്ഥൻ
  rationale: വീടിന്റെയും കുടുംബത്തിന്റെയും ചുമതലയും അധികാരവും വഹിക്കുന്ന വ്യക്തിയെ ആധുനിക മലയാളത്തിൽ സംക്ഷിപ്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἐκβάλλει
  choice: പുറത്തെടുക്കുന്ന
  rationale: ഇവിടെ ബലമായി ‘എറിഞ്ഞുകളയുക’ എന്നല്ല, സംഭരിച്ചിടത്തുനിന്ന് വസ്തുക്കൾ കൊണ്ടുവരുക എന്ന സന്ദർഭാർഥമാണ്.
- source_word: ἐκ τοῦ θησαυροῦ αὐτοῦ
  choice: തന്റെ നിക്ഷേപത്തിൽനിന്ന്
  rationale: θησαυρός എന്നതിലെ വിലയേറിയ ശേഖരം എന്ന ആശയം നിലനിർത്തുന്നു; സംഭരണശാല എന്ന സ്ഥലാർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: καινὰ καὶ παλαιά
  choice: പുതിയതും പഴയതും
  rationale: ഗ്രീക്കിലെ നപുംസക ബഹുവചന വിശേഷണങ്ങൾ സൂചിപ്പിക്കുന്ന അപ്രസ്താവിത വസ്തുക്കളെയും മൂലത്തിലെ ക്രമത്തെയും മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: μαθητευθεὶς എന്നതും സ്വർഗരാജ്യത്തോടുള്ള ബന്ധവും
  choice: സ്വർഗരാജ്യത്തിനായി ശിക്ഷണം ലഭിച്ച ശാസ്ത്രി
  alternative: സ്വർഗരാജ്യത്തിന്റെ ശിഷ്യനായിത്തീർന്ന ശാസ്ത്രി
  rationale: പദത്തിന് ശിഷ്യനാക്കപ്പെടുക, ശിഷ്യനായിത്തീരുക, പഠിപ്പിക്കപ്പെടുക എന്നീ പരസ്പരം ബന്ധപ്പെട്ട അർഥസാധ്യതകളുണ്ട്. മുഖ്യപാഠം രൂപപ്പെടുത്തുന്ന പരിശീലനത്തെ വ്യക്തമാക്കുന്നു; ശിഷ്യത്വത്തിന്റെ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: οἰκοδεσπότης എന്ന രൂപകത്തിലെ സാമൂഹികപങ്ക്
  choice: വീട്ടുടമസ്ഥൻ
  alternative: വീട്ടുകാരുടെ തലവൻ / ഗൃഹനാഥൻ
  rationale: രൂപകത്തിലെ ഗൃഹചുമതലയും അധികാരവും നിലനിർത്തുമ്പോഴും പ്രത്യേക സഭാപരമോ സാമൂഹികമോ ആയ സിദ്ധാന്തം ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘സ്വർഗരാജ്യം’, ‘ശാസ്ത്രി’ എന്നീ പരിചിത ബൈബിൾപദങ്ങൾ നിലനിർത്തിയിട്ടുണ്ട്. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദപ്രയോഗങ്ങൾക്ക് തൊട്ടുപിന്നാലെ മുഖ്യപാഠത്തിൽ നൽകിയിരിക്കുന്നു.
