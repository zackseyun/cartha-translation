revisions:
- from: 'അപ്പോൾ അവൻ അവരോടു പറഞ്ഞു: “അതുകൊണ്ട്, സ്വർഗരാജ്യത്തിനായി ശിക്ഷണം ലഭിച്ച ഓരോ ശാസ്ത്രിയും[a] തന്റെ നിക്ഷേപത്തിൽനിന്ന്[b] പുതിയതും പഴയതും പുറത്തെടുക്കുന്ന ഒരു വീട്ടുടമസ്ഥനെപ്പോലെയാണ്[c].”'
  to: 'അവൻ അവരോടു പറഞ്ഞു: “അതുകൊണ്ട്, സ്വർഗരാജ്യത്തിനായി പരിശീലനം ലഭിച്ച ഓരോ ശാസ്ത്രിയും[a] തന്റെ ഭണ്ഡാരത്തിൽനിന്ന്[b] പുതിയതും പഴയതും പുറത്തെടുക്കുന്ന ഒരു ഗൃഹനാഥനെപ്പോലെയാണ്[c].”'
  rationale: വാക്യത്തിന്റെ അർഥം മാറ്റാതെ, θησαυρός-ന്റെ സന്ദർഭാർഥം വ്യക്തമായി നൽകാൻ “നിക്ഷേപം” എന്നതിനു പകരം “ഭണ്ഡാരം” ഉപയോഗിച്ചു. οἰκοδεσπότης-ന്റെ ഗൃഹതലവൻ എന്ന രൂപകപരമായ പങ്ക് പ്രതിഫലിപ്പിക്കാൻ “വീട്ടുടമസ്ഥൻ” എന്നതിനു പകരം “ഗൃഹനാഥൻ” ഉപയോഗിച്ചു. ഉറവിടത്തിൽ ഇല്ലാത്ത വ്യക്തമായ കാലസൂചന ഒഴിവാക്കി വാക്യം ആരംഭിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അതതു പദപ്രയോഗങ്ങളോടു ചേർത്ത് നിലനിർത്തിയിരിക്കുന്നു.
