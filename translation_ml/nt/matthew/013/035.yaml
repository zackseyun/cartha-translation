id: MAT.13.35
reference: Matthew 13:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅπως πληρωθῇ τὸ ῥηθὲν διὰ τοῦ προφήτου λέγοντος· Ἀνοίξω ἐν παραβολαῖς τὸ στόμα μου, ἐρεύξομαι κεκρυμμένα ἀπὸ ⸀καταβολῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/035.yaml
  text: 'so that what was spoken through the prophet might be fulfilled[a], saying: “I will open my mouth in parables; I will utter things hidden from the foundation of the world.”'
translation:
  language: ml
  text: 'പ്രവാചകനിലൂടെ പറഞ്ഞിരുന്നത് നിവൃത്തിയാകേണ്ടതിന്, ഇപ്രകാരം: “ഞാൻ ഉപമകളിലൂടെ എന്റെ വായ് തുറക്കും; അടിസ്ഥാനം ഇട്ടതു മുതൽ മറഞ്ഞുകിടക്കുന്ന കാര്യങ്ങൾ ഞാൻ ഉരുവിടും.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ “ലോകസ്ഥാപനം മുതൽ” എന്നു വായിക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: ὅπως πληρωθῇ
  choice: നിവൃത്തിയാകേണ്ടതിന്
  rationale: ഉദ്ദേശ്യവും ഫലവും സൂചിപ്പിക്കുന്ന ὅπως-യും നിവൃത്തിയാകുക എന്ന മത്തായിയുടെ പ്രവചനപൂർത്തീകരണ ഭാഷയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τὸ ῥηθὲν διὰ τοῦ προφήτου
  choice: പ്രവാചകനിലൂടെ അരുളിച്ചെയ്തത്
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന മധ്യസ്ഥത ‘പ്രവാചകനിലൂടെ’ എന്നു നിലനിർത്തുന്നു; ദൈവിക സന്ദേശത്തിന്റെ മാന്യമായ ശൈലിക്ക് ‘അരുളിച്ചെയ്തത്’ യോജിക്കുന്നു.
- source_word: ἐν παραβολαῖς
  choice: ഉപമകളിലൂടെ
  rationale: ‘ഉപമകളിൽ’ എന്ന അസ്വാഭാവിക പദാനുപദ രൂപത്തിന് പകരം, സംസാരമാർഗം സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളം; ഉപമ എന്ന മത്തായിയുടെ പ്രധാന പദം സംരക്ഷിക്കുന്നു.
- source_word: Ἀνοίξω ... τὸ στόμα μου
  choice: ഞാൻ ... എന്റെ വായ് തുറക്കും
  rationale: ഉദ്ധരണിയുടെ കാവ്യാത്മക ദൃശ്യഭാഷ പരമാവധി നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἐρεύξομαι
  choice: ഞാൻ ഉച്ചരിക്കും
  rationale: പുറപ്പെടുവിക്കുക/വാക്കായി പറയുക എന്ന ആശയം മാന്യവും സംക്ഷിപ്തവുമായി നൽകുന്നു; ‘വെളിപ്പെടുത്തും’ എന്നു വിവർത്തനം ചെയ്ത് ഒളിഞ്ഞിരുന്നതിന്റെ നില മാറ്റപ്പെട്ടതായി അധികമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: κεκρυμμένα
  choice: മറഞ്ഞിരിക്കുന്ന കാര്യങ്ങൾ
  rationale: സുബ്സ്റ്റാന്റീവായി ഉപയോഗിച്ചിരിക്കുന്ന perfect passive participle-ന്റെ ഫലാവസ്ഥ സംരക്ഷിക്കുന്നു; ‘രഹസ്യങ്ങൾ’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക പദം ഒഴിവാക്കുന്നു.
- source_word: ἀπὸ καταβολῆς
  choice: അടിസ്ഥാനംമുതൽ
  rationale: നൽകിയിരിക്കുന്ന SBLGNT പാഠത്തിൽ κόσμου (‘ലോകത്തിന്റെ’) ഇല്ലാത്തതിനാൽ അത് മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല; καταβολή എന്ന പദത്തിന്റെ അടിസ്ഥാനമിടൽ/സ്ഥാപനം എന്ന ദൃശ്യവും അവ്യക്തതയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: പ്രവചനത്തിന്റെ വക്താവും മധ്യസ്ഥതയും
  choice: പ്രവാചകനിലൂടെ അരുളിച്ചെയ്തത്
  alternative: പ്രവാചകൻ പറഞ്ഞത്
  rationale: ദൈവം പ്രവാചകനിലൂടെ സംസാരിക്കുന്നു എന്ന മത്തായിയുടെ സൂത്രവാക്യരീതി നിലനിർത്തുന്നു; പ്രവാചകന്റെ പേര് പാഠത്തിൽ ഇല്ലാത്തതിനാൽ ചേർക്കുന്നില്ല.
- issue: ἀπὸ καταβολῆς എന്ന കാലപ്രയോഗത്തിന്റെ പരിധി
  choice: അടിസ്ഥാനംമുതൽ
  alternative: ലോകസ്ഥാപനംമുതൽ
  rationale: സ്രോതസ്സുപാഠത്തിൽ ‘ലോകം’ എന്ന നാമം ഇല്ല. അതിനാൽ മുഖ്യപാഠം അതു ചേർക്കാതെ യഥാർത്ഥ അവ്യക്തത സംരക്ഷിക്കുന്നു; ദീർഘമായ കൈയെഴുത്തുപ്രതി വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക സാധാരണ മലയാളത്തിൽ വായിക്കാവുന്ന, എന്നാൽ പ്രവചനോദ്ധരണിക്ക് യോജിച്ച മാന്യവും അല്പം കാവ്യാത്മകവുമായ ശൈലി. മുഖ്യപാഠത്തിലെ [a] അടയാളം ബന്ധപ്പെട്ട വാക്യത്തിന്റെ അവസാനം ചേർത്തിരിക്കുന്നു.
