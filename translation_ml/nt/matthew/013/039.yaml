  source_fidelity: 'ഗ്രീക്ക് വാക്യത്തിലെ മൂന്ന് സമാന്തര തിരിച്ചറിയൽവാക്യങ്ങളും കൃത്യമായി പ്രതിഫലിക്കുന്നു: വിതച്ച ശത്രു പിശാച്, കൊയ്ത്ത് യുഗത്തിന്റെ സമാപനം, കൊയ്ത്തുകാർ ദൂതന്മാർ. αὐτά-യുടെ കളകളെ സൂചിപ്പിക്കുന്ന ബഹുവചന കർമരൂപം ‘അവയെ’ യോജിച്ചതാണ്. συντέλεια αἰῶνος-ന്റെ കാലപരമായ അർഥം ‘യുഗത്തിന്റെ സമാപനം’ നന്നായി നിലനിർത്തുന്നു.'
