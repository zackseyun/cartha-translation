id: MAT.13.39
reference: Matthew 13:39
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ ἐχθρὸς ὁ σπείρας αὐτά ἐστιν ὁ διάβολος· ὁ δὲ θερισμὸς συντέλεια ⸀αἰῶνός ἐστιν, οἱ δὲ θερισταὶ ἄγγελοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/039.yaml
  text: And the enemy who sowed them is the devil; the harvest is the end of the age[a], and the harvesters are angels.
translation:
  language: ml
  text: അവയെ വിതച്ച ശത്രു പിശാചാണ്; കൊയ്ത്ത് യുഗത്തിന്റെ സമാപനമാണ്[a]; കൊയ്ത്തുകാർ ദൂതന്മാരാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യുഗത്തിന്റെ അവസാനം”; പരമ്പരാഗതമായി, “ലോകത്തിന്റെ അവസാനം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐχθρὸς
  choice: ശത്രു
  rationale: ഉപമയിലെ വ്യക്തിപരമായ എതിർപ്പിനെ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്ന സാധാരണ മലയാളപദം.
- source_word: ὁ σπείρας
  choice: വിതച്ച
  rationale: പൂർത്തിയായ വിതയ്ക്കൽ പ്രവൃത്തിയാൽ ശത്രുവിനെ തിരിച്ചറിയിക്കുന്ന ഭൂതകാല കൃദന്തരൂപവും ഉപമയിലെ കാർഷികചിത്രവും നിലനിർത്തുന്നു.
- source_word: αὐτά
  choice: അവയെ
  rationale: മുമ്പ് പറഞ്ഞ കളകളെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികമായ കർമസൂചക സർവനാമം.
- source_word: διάβολος
  choice: പിശാച്
  rationale: ഇവിടെ സാത്താനെ സൂചിപ്പിക്കുന്ന അംഗീകൃത വ്യക്തിനാമപ്രയോഗം; പദോൽപ്പത്തിപരമായ ‘അപവാദി’ എന്ന വിവർത്തനം ഉദ്ദേശ്യസൂചനയെ മങ്ങിച്ചേക്കും.
- source_word: θερισμὸς
  choice: കൊയ്ത്ത്
  rationale: ഉപമയുടെ കാർഷികബിംബം നേരിട്ട് നിലനിർത്തുന്ന സാധാരണ മലയാളപദം.
- source_word: συντέλεια αἰῶνός
  choice: യുഗത്തിന്റെ സമാപനം
  rationale: αἰών എന്നതിന്റെ കാലഘട്ടസൂചന ‘യുഗം’ നിലനിർത്തുന്നു; συντέλεια സൂചിപ്പിക്കുന്ന പൂർത്തീകരണവും അന്ത്യവും ‘സമാപനം’ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: θερισταὶ
  choice: കൊയ്ത്തുകാർ
  rationale: കാർഷികരൂപകം നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് ഉടൻ മനസ്സിലാകുന്ന പ്രയോഗം.
- source_word: ἄγγελοί
  choice: ദൂതന്മാർ
  rationale: ἄγγελος എന്ന പദത്തിന്റെ അടിസ്ഥാന അർഥം നിലനിർത്തുന്നു; ഈ അന്ത്യകാലസന്ദർഭത്തിൽ ദൈവിക ദൂതന്മാരെന്ന സൂചന വ്യക്തമാണ്.
- source_word: δὲ
  choice: വാക്യഘടനയും അർദ്ധവിരാമങ്ങളും
  rationale: ആവർത്തിക്കുന്ന δέ വിശദീകരണത്തിന്റെ പുരോഗതി അടയാളപ്പെടുത്തുന്നു; ഓരോ തവണയും ബന്ധകപദം ചേർത്ത് മലയാളം കൃത്രിമമാക്കാതെ അർദ്ധവിരാമങ്ങളിലൂടെ അതിന്റെ വ്യവഹാരപ്രവർത്തനം പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: συντέλεια αἰῶνός എന്ന അന്ത്യകാലപ്രയോഗത്തിലെ αἰών-ന്റെ വിവർത്തനം
  choice: യുഗത്തിന്റെ സമാപനം
  alternative: ലോകത്തിന്റെ അവസാനം; യുഗത്തിന്റെ അവസാനം
  rationale: ‘ലോകത്തിന്റെ അവസാനം’ എന്നു പറഞ്ഞാൽ ഗ്രീക്ക് പദം നിർബന്ധമാക്കാത്ത ഭൗതികപ്രപഞ്ചനാശത്തിന്റെ ആശയം കടന്നുവരാം. ‘യുഗം’ കാലഘട്ടസൂചന കാത്തുസൂക്ഷിക്കുന്നു; ‘സമാപനം’ συντέλεια-യിലെ പൂർത്തീകരണവും അന്ത്യവും തമ്മിലുള്ള അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഉപമയിലെ വിതയ്ക്കൽ–കൊയ്ത്ത് കാർഷികബിംബങ്ങൾ നിലനിർത്തിയിട്ടുണ്ട്; വാക്യത്തിന്റെ വിശദീകരണാത്മക സമാന്തരഘടന അർദ്ധവിരാമങ്ങളാൽ വ്യക്തമാക്കിയിരിക്കുന്നു.
