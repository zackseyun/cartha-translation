id: MAT.13.32
reference: Matthew 13:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃ μικρότερον μέν ἐστιν πάντων τῶν σπερμάτων, ὅταν δὲ αὐξηθῇ μεῖζον τῶν λαχάνων ἐστὶν καὶ γίνεται δένδρον, ὥστε ἐλθεῖν τὰ πετεινὰ τοῦ οὐρανοῦ καὶ κατασκηνοῦν ἐν τοῖς κλάδοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/032.yaml
  text: It is indeed smaller than all the seeds[a], but when it has grown, it is larger than the garden plants and becomes a tree[b], so that the birds of the sky come and nest in its branches.
translation:
  language: ml
  text: അത് എല്ലാ വിത്തുകളെക്കാളും ചെറുതുതന്നെ; എന്നാൽ വളർന്നുകഴിഞ്ഞാൽ തോട്ടത്തിലെ ചെടികളെക്കാൾ വലുതായി ഒരു വൃക്ഷമായിത്തീരുന്നു. അങ്ങനെ ആകാശത്തിലെ പക്ഷികൾ[a] വന്ന് അതിന്റെ കൊമ്പുകളിൽ കൂടുകൂട്ടുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആകാശത്തിലെ പക്ഷികൾ’ എന്നതിന് ‘വായുവിലെ പക്ഷികൾ’ എന്നും വിവർത്തനം ചെയ്യാം; ഇത് പരമ്പരാഗതമായ ഒരു വിവർത്തനപ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: b
    text: കൊമ്പുകളിൽ പക്ഷികൾ പാർക്കുന്ന ഈ ദൃശ്യം ഒരു മഹത്തായ രാജ്യത്തെ വൃക്ഷമായി ചിത്രീകരിക്കുന്ന പഴയനിയമഭാഗങ്ങളെ ഓർമിപ്പിച്ചേക്കാം (ഉദാ., യെഹെസ്കേൽ 17:23; ദാനീയേൽ 4:12). എന്നാൽ ഈ വാക്യം ആ പ്രതീകാർഥം വ്യക്തമായി പ്രസ്താവിക്കുന്നില്ല.
    reason: cross_reference
lexical_decisions:
- source_word: μικρότερον ... πάντων τῶν σπερμάτων
  choice: എല്ലാ വിത്തുകളെക്കാളും ചെറുത്
  rationale: ഗ്രീക്കിലെ താരതമ്യരൂപമായ ‘ചെറുത്’ എന്ന ആശയവും πάντων എന്ന സമഗ്രതയും വ്യക്തമായി നിലനിർത്തുന്നു; അതിനെ വ്യാകരണപരമായി അതിശയോത്തരരൂപമാക്കി മാറ്റുന്നില്ല.
- source_word: μέν ... δέ
  choice: ചെറുതുതന്നെ; എന്നാൽ
  rationale: വിത്തിന്റെ ചെറിയ തുടക്കവും പിന്നീട് ഉണ്ടാകുന്ന വലിയ വളർച്ചയും തമ്മിലുള്ള ഊന്നിയ വൈരുധ്യം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ὅταν ... αὐξηθῇ
  choice: വളർന്നുകഴിഞ്ഞാൽ
  rationale: വളർച്ച പൂർത്തിയായ ശേഷമുള്ള അവസ്ഥയിലേക്കാണ് തുടർന്നുള്ള വാക്യം നീങ്ങുന്നതെന്ന സമഗ്രമായ ഭാവം നൽകുന്നു.
- source_word: μεῖζον τῶν λαχάνων
  choice: തോട്ടത്തിലെ ചെടികളെക്കാൾ വലുത്
  rationale: λάχανα എന്നത് കൃഷിചെയ്യുന്ന തോട്ടച്ചെടികളെ വിശാലമായി സൂചിപ്പിക്കാം; ‘പച്ചക്കറികൾ’ എന്ന ഇടുങ്ങിയ അർഥം ഒഴിവാക്കുന്നു.
- source_word: γίνεται δένδρον
  choice: ഒരു വൃക്ഷമായിത്തീരുന്നു
  rationale: ഗ്രീക്ക് പാഠത്തിലെ ശക്തവും ദൃശ്യവുമായ പ്രസ്താവനയെ ‘വൃക്ഷംപോലെ’ എന്നു മയപ്പെടുത്താതെ നിലനിർത്തുന്നു.
- source_word: ὥστε ἐλθεῖν
  choice: അങ്ങനെ ... വന്ന്
  rationale: വളർച്ചയുടെ ഫലമായി പക്ഷികൾ എത്തുന്നതിനെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: ആകാശത്തിലെ പക്ഷികൾ
  rationale: οὐρανός എന്നതിന്റെ സന്ദർഭോചിതമായ അർഥമായ ‘ആകാശം’ നിലനിർത്തുന്ന, സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ പ്രയോഗമാണ്.
- source_word: κατασκηνοῦν
  choice: കൂടുകൂട്ടുന്നു
  rationale: പക്ഷികൾ കൊമ്പുകളിൽ പാർപ്പുറപ്പിക്കുന്നതിനെ ഈ സന്ദർഭത്തിൽ സംക്ഷിപ്തവും ദൃശ്യവുമായ രീതിയിൽ അറിയിക്കുന്നു.
- source_word: ἐν τοῖς κλάδοις αὐτοῦ
  choice: അതിന്റെ കൊമ്പുകളിൽ
  rationale: മൂലപാഠത്തിലെ സ്ഥാനസൂചനയും വൃക്ഷത്തെ സൂചിപ്പിക്കുന്ന സർവനാമവും നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: വലിയ വൃക്ഷത്തിന്റെ കൊമ്പുകളിൽ പക്ഷികൾ പാർക്കുന്ന പഴയനിയമസാദൃശ്യമുള്ള ദൃശ്യം
  choice: പ്രധാന പാഠത്തിൽ ദൃശ്യം അക്ഷരാർഥത്തിൽ മാത്രം നിലനിർത്തി, സാധ്യമായ പഴയനിയമ പ്രതിധ്വനി അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
  alternative: പക്ഷികൾ ജനതകളെയോ ദൈവരാജ്യത്തിൽ അഭയം കണ്ടെത്തുന്ന ജനങ്ങളെയോ പ്രതിനിധാനം ചെയ്യുന്നു എന്ന് പ്രധാന പാഠത്തിൽ വ്യാഖ്യാനിക്കുക.
  rationale: യെഹെസ്കേൽ 17:23, ദാനീയേൽ 4:12 തുടങ്ങിയ ഭാഗങ്ങളുടെ പ്രതിധ്വനി ഉണ്ടായേക്കാമെങ്കിലും ഈ വാക്യം അതിന്റെ പ്രതീകാർഥം വ്യക്തമാക്കുന്നില്ല; അതിനാൽ ദൈവശാസ്ത്രപരമായ സാധ്യത നിലനിർത്തുകയും ഒരു വ്യാഖ്യാനം പാഠത്തിൽ അടിച്ചേൽപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന ശൈലി. ‘ചെറുതുതന്നെ; എന്നാൽ’ എന്ന ഘടന മൂലത്തിലെ വൈരുധ്യത്തിന് ഊന്നൽ നൽകുന്നു. ‘തോട്ടത്തിലെ ചെടികൾ’ എന്നത് സസ്യവിഭാഗത്തെ അനാവശ്യമായി ചുരുക്കാതെ സ്വാഭാവികത പാലിക്കുന്നു.
