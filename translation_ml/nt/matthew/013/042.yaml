id: MAT.13.42
reference: Matthew 13:42
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ βαλοῦσιν αὐτοὺς εἰς τὴν κάμινον τοῦ πυρός· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/042.yaml
  text: and they will throw them into the furnace of fire[b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: ml
  text: അവരെ തീച്ചൂളയിലേക്ക് എറിഞ്ഞുകളയും. അവിടെ കരച്ചിലും പല്ലുകടിയും ഉണ്ടാകും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βαλοῦσιν
  choice: എറിഞ്ഞുകളയും
  rationale: ഭാവികാലത്തിലെ βάλλω ബലമായി എറിയുക എന്ന ആശയം നൽകുന്നു; ആ ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: αὐτούς
  choice: അവരെ
  rationale: മുൻവാക്യഭാഗത്തിൽ സൂചിപ്പിച്ച കൂട്ടത്തെ സൂചിപ്പിക്കുന്ന ബഹുവചന കർമസർവനാമം നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: κάμινον τοῦ πυρός
  choice: തീച്ചൂളയിലേക്ക്
  rationale: ‘തീയുടെ ചൂള’ എന്ന ഗ്രീക്ക് ഘടനയെ മലയാളത്തിലെ സ്വാഭാവികമായ സംയുക്തരൂപത്തിൽ അവതരിപ്പിച്ച് ചൂളയുടെയും തീയുടെയും ദൃശ്യബിംബം നിലനിർത്തുന്നു.
- source_word: ἐκεῖ
  choice: അവിടെ
  rationale: ഇപ്പോൾ പറഞ്ഞ സ്ഥലത്തേക്കു വിരൽചൂണ്ടുന്ന ലളിതമായ സ്ഥാനസൂചകം; ഗ്രീക്കിന്റെ സംക്ഷിപ്തതയും ഊന്നലും കാക്കുന്നു.
- source_word: κλαυθμός
  choice: കരച്ചിൽ
  rationale: വിലാപമോ കരച്ചിലോ എന്ന അർത്ഥപരിധിയിൽ, തീവ്രത അനാവശ്യമായി കൂട്ടാതെ സാധാരണ വായനക്കാർക്കു വ്യക്തമായ പദം.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: പല്ലുകടി
  rationale: പല്ലുകൾ ഞെരിച്ചുകടിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള പ്രയോഗം; ദുഃഖം, വ്യാകുലത, കോപം എന്നിവയിൽ ഒന്നിലേക്കു മാത്രം അർത്ഥം ചുരുക്കുന്നില്ല.
- source_word: καὶ
  choice: -ഉം / connective sense
  rationale: വാക്യത്തിന്റെ തുടക്കത്തിലെ ബന്ധം മലയാളത്തിൽ മുൻസന്ദർഭം കൊണ്ടു സ്വാഭാവികമായി ഗ്രഹിക്കപ്പെടുന്നു; രണ്ടാം ഘടകത്തിലെ ‘കരച്ചിലും പല്ലുകടിയും’ എന്ന സമുച്ചയത്തിൽ ബന്ധകശക്തി വ്യക്തമായി നിലനിൽക്കുന്നു.
theological_decisions:
- issue: ‘തീച്ചൂള’ എന്ന ന്യായവിധിയുടെ ദൃശ്യബിംബത്തിന്റെ സ്വഭാവം
  choice: മൂലത്തിലെ മൂർത്തമായ തീച്ചൂള-രൂപകം അതേപടി നിലനിർത്തി.
  alternative: ‘നരകാഗ്നി’ എന്നു വ്യാഖ്യാനപരമായി വ്യക്തമാക്കുക, അല്ലെങ്കിൽ ‘കത്തിജ്വലിക്കുന്ന ചൂള’ എന്നു തീവ്രത കൂട്ടുക.
  rationale: മൂലപാഠം നൽകുന്ന അന്ത്യന്യായവിധിയുടെ ദൃശ്യബിംബത്തെ മൃദൂകരിക്കാതെയും പിന്നീടുള്ള സാങ്കേതിക ദൈവശാസ്ത്രപദം ഇറക്കുമതി ചെയ്യാതെയും സംരക്ഷിക്കുന്നു.
- issue: ‘കരച്ചിലും പല്ലുകടിയും’ എന്ന പ്രയോഗത്തിന്റെ അർത്ഥവ്യാപ്തി
  choice: വ്യാകുലതയും ന്യായവിധിയും സൂചിപ്പിക്കുന്ന മത്തായിയുടെ സ്ഥിരപ്രയോഗമായി നിലനിർത്തി.
  alternative: പല്ലുകടിയെ കോപമായി മാത്രം, അല്ലെങ്കിൽ മുഴുവൻ പ്രയോഗത്തെയും ദുഃഖമായി മാത്രം വ്യാഖ്യാനിക്കുക.
  rationale: ഈ പ്രയോഗം ദുഃഖം, വേദന, നിരാശ, രോഷം എന്നിവയുടെ നിഴലുകൾ ഉൾക്കൊള്ളാം; പരിഭാഷ അവയിൽ ഒന്നിനെ മാത്രം നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. ‘തീച്ചൂള’, ‘കരച്ചിൽ’, ‘പല്ലുകടി’ എന്നീ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന പദങ്ങൾ ഉപയോഗിച്ചു; അനാവശ്യമായ സഭാപാരമ്പര്യഭാഷയും അർത്ഥവിപുലീകരണവും ഒഴിവാക്കി.
