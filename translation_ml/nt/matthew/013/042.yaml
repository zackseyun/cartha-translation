  naturalness: “അവരെ തീച്ചൂളയിലേക്ക് എറിഞ്ഞുകളയും. അവിടെ കരച്ചിലും പല്ലുകടിയും ഉണ്ടാകും.” ആധുനിക നിലവാരമുള്ള, വ്യക്തവും ഗൗരവമുള്ളതുമായ മലയാളമാണ്. ‘കരച്ചിലും പല്ലുകടിയും’ മത്തായിയിലെ പ്രയോഗത്തിന് മലയാളത്തിൽ പരിചിതവും സ്വാഭാവികവുമായ സമാനരൂപമാണ്.
