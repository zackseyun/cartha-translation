id: MAT.13.49
reference: Matthew 13:49
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὕτως ἔσται ἐν τῇ συντελείᾳ τοῦ αἰῶνος· ἐξελεύσονται οἱ ἄγγελοι καὶ ἀφοριοῦσιν τοὺς πονηροὺς ἐκ μέσου τῶν δικαίων
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/049.yaml
  text: 'So it will be at the end of the age: the angels will go out and separate the wicked from among the righteous,[a]'
translation:
  language: ml
  text: 'യുഗത്തിന്റെ അവസാനത്തിൽ ഇങ്ങനെതന്നെയായിരിക്കും: ദൈവദൂതന്മാർ പുറപ്പെട്ട് നീതിമാന്മാരുടെ ഇടയിൽനിന്ന് ദുഷ്ടന്മാരെ വേർതിരിക്കും.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യുഗത്തിന്റെ പരിസമാപ്തിയിൽ.” പരമ്പരാഗത പരിഭാഷകളിൽ ചിലത് “ലോകാവസാനത്തിൽ” എന്നു പറയുന്നു; എന്നാൽ ഗ്രീക്കിൽ “ലോകം” എന്നല്ല, “യുഗം” (αἰών) എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως ἔσται
  choice: ഇങ്ങനെതന്നെയായിരിക്കും
  rationale: ഉപമയുടെ അർഥം വിശദീകരിക്കുന്ന നിഗമനഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἐν τῇ συντελείᾳ τοῦ αἰῶνος
  choice: യുഗത്തിന്റെ അവസാനത്തിൽ
  rationale: συντέλεια സമാപനത്തെയും αἰών ഒരു യുഗത്തെയോ കാലക്രമത്തെയോ സൂചിപ്പിക്കുന്നു. ഭൗതിക ലോകത്തിന്റെ നാശം എന്ന ആശയം അനാവശ്യമായി ചേർക്കാതെ ഗ്രീക്കിന്റെ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: ἐξελεύσονται οἱ ἄγγελοι
  choice: ദൂതന്മാർ പുറപ്പെട്ട്
  rationale: അന്ത്യന്യായവിധിയുടെ ഈ സന്ദർഭത്തിൽ ἄγγελοι സ്വർഗീയ ദൂതന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്; ἐξελεύσονται എന്നതിന്റെ ചലനഭാവം ‘പുറപ്പെട്ട്’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀφοριοῦσιν
  choice: വേർതിരിക്കും
  rationale: ഒരു കൂട്ടത്തിനുള്ളിൽനിന്ന് മറ്റൊരു വിഭാഗത്തെ വേർതിരിച്ചെടുക്കുക എന്ന ക്രിയയുടെ അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: τοὺς πονηροὺς
  choice: ദുഷ്ടന്മാരെ
  rationale: വ്യക്തികളെ സൂചിപ്പിക്കുന്ന നാമവൽക്കരിച്ച വിശേഷണത്തിന്റെ ന്യായവിധിസന്ദർഭത്തിലുള്ള അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: ἐκ μέσου τῶν δικαίων
  choice: നീതിമാന്മാരുടെ ഇടയിൽനിന്ന്
  rationale: കലർന്നുകിടക്കുന്ന ഒരു കൂട്ടത്തിന്റെ ഉള്ളിൽനിന്നുള്ള വേർതിരിക്കൽ എന്ന ἐκ μέσου എന്ന പ്രയോഗത്തിന്റെ ആശയം കൃത്യമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: അന്ത്യകാലപ്രയോഗത്തിലെ αἰών എന്നതിന്റെ അർഥം
  choice: യുഗം
  alternative: ലോകം
  rationale: αἰών ഇവിടെ ഇപ്പോഴത്തെ യുഗത്തെയോ വ്യവസ്ഥയെയോ സൂചിപ്പിക്കുന്നു; ഗ്രീക്ക് പദം ആവശ്യപ്പെടാത്ത ഭൗതികപ്രപഞ്ചത്തിന്റെ അന്ത്യം എന്ന ആശയം ‘ലോകം’ എന്ന പരിഭാഷ ഉണർത്താം.
- issue: ἄγγελοι ആരെ സൂചിപ്പിക്കുന്നു
  choice: സ്വർഗീയ ദൂതന്മാർ
  alternative: മനുഷ്യ സന്ദേശവാഹകർ
  rationale: യേശു വിവരിക്കുന്ന അന്തിമ ന്യായവിധിയുടെ പശ്ചാത്തലത്തിൽ ഈ പദം സ്വർഗീയ ദൂതന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്.
translation_notes:
  register: സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ആധുനിക നിലവാരമലയാളം; അന്ത്യന്യായവിധിയുടെ ഗൗരവം നിലനിർത്തുന്ന മാന്യവും സ്വാഭാവികവുമായ ശൈലി. മുഖ്യവാചകത്തിലെ [a] അടയാളം അടിക്കുറിപ്പുമായി പൊരുത്തപ്പെടുന്നു.
