id: MAT.13.48
reference: Matthew 13:48
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἣν ὅτε ἐπληρώθη ἀναβιβάσαντες ἐπὶ τὸν αἰγιαλὸν καὶ καθίσαντες συνέλεξαν τὰ καλὰ εἰς ⸀ἄγγη, τὰ δὲ σαπρὰ ἔξω ἔβαλον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/048.yaml
  text: When it was filled[a], they pulled it up onto the shore, sat down, and gathered the good fish into containers[b], but threw the rotten ones out.
translation:
  language: ml
  text: അതു നിറഞ്ഞപ്പോൾ, അവർ അതിനെ കരയിലേക്കു വലിച്ചുകയറ്റി, ഇരുന്ന് നല്ല മീനുകളെ പാത്രങ്ങളിൽ[a] ശേഖരിച്ചു; എന്നാൽ ചീഞ്ഞവയെ[b] പുറത്തേക്ക് എറിഞ്ഞുകളഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: മൂലഭാഷയിലെ പദം ഏതെങ്കിലും തരത്തിലുള്ള പാത്രങ്ങളെ പൊതുവായി സൂചിപ്പിക്കുന്നു; പ്രത്യേകമായി കൊട്ടകളെ മാത്രമല്ല.
    reason: lexical_alternative
  - marker: b
    text: “ചീത്തയായവയെ” എന്നും പരിഭാഷപ്പെടുത്താം. മൂലഭാഷയിലെ പദത്തിന് ‘ചീഞ്ഞ,’ ‘കേടായ,’ അല്ലെങ്കിൽ പൊതുവായി ‘കൊള്ളാത്ത’ എന്നിങ്ങനെ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν
  choice: അതിനെ
  rationale: മുൻവാക്യത്തിലെ വലയെയാണ് ഈ ബന്ധസർവനാമം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ സ്വാഭാവിക വാക്യഘടനയിൽ ‘അതിനെ’ എന്നു പുനരാരംഭിക്കുന്നത് വ്യക്തമാണ്.
- source_word: ἐπληρώθη
  choice: നിറഞ്ഞപ്പോൾ
  rationale: πληρόω എന്ന ക്രിയയുടെ കർമണിപ്രയോഗം വല മീനുകളാൽ നിറഞ്ഞ അവസ്ഥയെ സൂചിപ്പിക്കുന്നു; ‘നിറഞ്ഞപ്പോൾ’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: ἀναβιβάσαντες
  choice: വലിച്ചുകയറ്റി
  rationale: വെള്ളത്തിൽനിന്ന് വലയെ കരയിലേക്കു മുകളിലേക്ക് വലിച്ചുകൊണ്ടുവരുന്ന പ്രവൃത്തി കൃത്യമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐπὶ τὸν αἰγιαλόν
  choice: കരയിലേക്ക്
  rationale: αἰγιαλός കടൽത്തീരത്തെയോ ജലാശയത്തിന്റെ കരയെയോ സൂചിപ്പിക്കാം; ‘കര’ മണൽത്തീരം എന്നു അനാവശ്യമായി പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: καθίσαντες
  choice: ഇരുന്ന്
  rationale: പ്രവൃത്തികളുടെ ക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: συνέλεξαν
  choice: ശേഖരിച്ചു
  rationale: ഒരുമിച്ചുകൂട്ടുക എന്ന അർഥം നൽകുകയും മീനുകളെ തരംതിരിക്കുന്ന സന്ദർഭത്തിന് യോജിക്കുകയും ചെയ്യുന്നു.
- source_word: τὰ καλὰ
  choice: നല്ല മീനുകളെ
  rationale: ഗ്രീക്കിൽ ‘നല്ലവ’ എന്നു മാത്രമാണെങ്കിലും സന്ദർഭത്തിൽ മീനുകളാണ് ഉദ്ദേശ്യം; മലയാളത്തിൽ സൂചിത നാമം ചേർക്കുന്നത് വ്യക്തത നൽകുന്നു.
- source_word: εἰς ἄγγη
  choice: പാത്രങ്ങളിൽ
  rationale: ἄγγη ഏതെങ്കിലും തരത്തിലുള്ള പാത്രങ്ങൾക്കുള്ള പൊതുപദമാണ്; ‘കുട്ടകൾ’ എന്നു പ്രത്യേകവൽക്കരിക്കുന്നത് ഒഴിവാക്കുന്നു.
- source_word: τὰ δὲ σαπρά
  choice: എന്നാൽ ചീഞ്ഞവയെ
  rationale: σαπρός എന്നതിന്റെ ദൃശ്യവും ശക്തവുമായ അടിസ്ഥാനാർഥമായ ‘ചീഞ്ഞ’ നിലനിർത്തുന്നു; ‘ചീത്തയായവ’ എന്ന വിശാലാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἔξω ἔβαλον
  choice: പുറത്തേക്ക് എറിഞ്ഞുകളഞ്ഞു
  rationale: പുറത്താക്കി ഉപേക്ഷിക്കുന്നതിന്റെ ദിശയും ശക്തിയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഉപമയിലെ തരംതിരിക്കൽദൃശ്യത്തിന്റെ വ്യാഖ്യാനം
  choice: അന്തിമവിധിയെക്കുറിച്ചുള്ള തുടർന്നുള്ള വിശദീകരണം ഈ വാക്യത്തിലേക്ക് മുൻകൂട്ടി ചേർക്കാതെ മീൻപിടിത്തദൃശ്യം മാത്രമായി പരിഭാഷപ്പെടുത്തി.
  alternative: വിധിക്കുള്ള പ്രതീകാർഥം നേരിട്ട് സൂചിപ്പിക്കുന്ന വ്യാഖ്യാനാത്മക പദങ്ങൾ ഉപയോഗിക്കുക.
  rationale: ഈ വാക്യം ഉപമയുടെ ദൃശ്യമാണ് വിവരിക്കുന്നത്; അതിന്റെ ദൈവശാസ്ത്രപരമായ വിശദീകരണം തുടർന്നുള്ള വാക്യങ്ങളിലാണ്. അതിനാൽ മൂലപാഠത്തിലെ കഥാതലം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ പങ്കാളിക്രിയകളുടെ ക്രമം മലയാളത്തിലെ സ്വാഭാവിക ക്രിയാശൃംഖലയായി നൽകി. ‘മീൻ’ ആദ്യ ഘടകത്തിൽ വ്യക്തതയ്ക്കായി ചേർത്തെങ്കിലും രണ്ടാമത്തേതിൽ ആവർത്തനം ഒഴിവാക്കി.
