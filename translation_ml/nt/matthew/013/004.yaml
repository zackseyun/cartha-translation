source:
  edition: SBLGNT
  text: καὶ ἐν τῷ σπείρειν αὐτὸν ἃ μὲν ἔπεσεν παρὰ τὴν ὁδόν, καὶ ⸂ἐλθόντα τὰ πετεινὰ⸃ κατέφαγεν αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/004.yaml
  text: And as he was sowing[a], some seeds fell beside the path, and the birds came and devoured them.
translation:
  language: ml
  text: അവൻ വിതച്ചുകൊണ്ടിരിക്കുമ്പോൾ, ചില വിത്തുകൾ[a] വഴിയരികിൽ വീണു; പക്ഷികൾ വന്ന് അവ തിന്നുകളഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ, ‘ചിലത് വഴിയരികിൽ വീണു’; വിതക്കാരന്റെ സന്ദർഭത്തിൽനിന്നാണ് ‘വിത്തുകൾ’ എന്നു ചേർത്തിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ σπείρειν αὐτὸν
  choice: അവൻ വിതച്ചുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: ἐν സഹിതമുള്ള articular infinitive ഒരേ സമയത്ത് നടക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ഈ മലയാളപ്രയോഗം ആ കാലബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἃ μὲν
  choice: ചില വിത്തുകൾ
  rationale: ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘ചിലത്’ എന്നാണെങ്കിലും, സന്ദർഭത്തിൽ വിതക്കാരൻ വിതച്ച വിത്തുകളെയാണ് സൂചിപ്പിക്കുന്നത്; വ്യക്തതയ്ക്കായി ‘വിത്തുകൾ’ ചേർത്തു.
- source_word: ἔπεσεν
  choice: വീണു
  rationale: കഥനത്തിലെ aorist ക്രിയയുടെ ലളിതമായ ഭൂതകാലാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: παρὰ τὴν ὁδόν
  choice: വഴിയരികിൽ
  rationale: παρά സഹിതമുള്ള accusative ഇവിടെ വഴിയുടെ സമീപസ്ഥാനം സൂചിപ്പിക്കുന്നു; കൃഷിസന്ദർഭത്തിൽ ‘വഴിയരികിൽ’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: ἐλθόντα τὰ πετεινὰ
  choice: പക്ഷികൾ വന്ന്
  rationale: aorist participle ആയ ἐλθόνταയെ തുടർപ്രവൃത്തിയായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; πετεινάയ്ക്ക് ഇവിടെ ‘പക്ഷികൾ’ മതിയാകുന്നു, മൂലപാഠത്തിലില്ലാത്ത ‘ആകാശത്തിലെ’ എന്നത് ചേർക്കുന്നില്ല.
- source_word: κατέφαγεν
  choice: തിന്നുകളഞ്ഞു
  rationale: κατεσθίωയുടെ പൂർണമായി തിന്നുതീർക്കുക എന്ന ശക്തി മലയാളത്തിലെ ‘തിന്നുകളഞ്ഞു’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: αὐτά
  choice: അവ
  rationale: വഴിയരികിൽ വീണ വിത്തുകളിലേക്കുള്ള ബഹുവചന സർവനാമസൂചന സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
