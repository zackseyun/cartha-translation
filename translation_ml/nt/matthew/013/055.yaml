id: MAT.13.55
reference: Matthew 13:55
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐχ οὗτός ἐστιν ὁ τοῦ τέκτονος υἱός; ⸀οὐχ ἡ μήτηρ αὐτοῦ λέγεται Μαριὰμ καὶ οἱ ἀδελφοὶ αὐτοῦ Ἰάκωβος καὶ ⸀Ἰωσὴφ καὶ Σίμων καὶ Ἰούδας;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/055.yaml
  text: Is this not the carpenter’s son? Is not his mother called Mary[b][a], and his brothers James and Joseph and Simon and Judas?
translation:
  language: ml
  text: ഇവൻ ആശാരിയുടെ മകനല്ലേ? ഇവന്റെ അമ്മയെ മറിയം എന്നു വിളിക്കുന്നതും ഇവന്റെ സഹോദരന്മാർ യാക്കോബ്, യോസേഫ്[b], ശിമോൻ, യൂദാ എന്നിവരുമല്ലേ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സഹോദരന്മാർ’ എന്നതിന് ‘ബന്ധുക്കൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദം സാധാരണയായി ‘സഹോദരന്മാർ’ എന്നാണ് അർഥമാക്കുന്നത്; എന്നാൽ ഈ സന്ദർഭത്തിൽ ചിലർ അതിനെ വിശാലമായ ബന്ധുത്വാർഥത്തിൽ മനസ്സിലാക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘യോസേഫ്’ എന്നതിനുപകരം ‘യോസേസ്’ എന്നു വായിക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: τέκτονος
  choice: ആശാരിയുടെ
  rationale: τέκτων മരംകൊണ്ടോ നിർമാണപ്രവർത്തനത്തിലോ ഏർപ്പെട്ടിരുന്ന ശില്പിയെ സൂചിപ്പിക്കാം. സന്ദർഭത്തിലും മലയാള ബൈബിൾ ഭാഷാപാരമ്പര്യത്തിലും ‘ആശാരി’ സ്വാഭാവികവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമാണ്.
- source_word: υἱός
  choice: മകൻ
  rationale: ഇവിടെ നേരിട്ടുള്ള കുടുംബബന്ധമാണ് ഉദ്ദേശിക്കുന്നത്; ‘മകൻ’ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: λέγεται
  choice: എന്നു വിളിക്കുന്നത്
  rationale: വർത്തമാനകാല കർമണി പ്രയോഗത്തിന്റെ ‘എന്നു വിളിക്കപ്പെടുന്നു/പേരാണ്’ എന്ന ആശയം സ്വാഭാവിക മലയാള ചോദ്യരൂപത്തിൽ നൽകുന്നു.
- source_word: Μαριὰμ
  choice: മറിയം
  rationale: പുതിയ നിയമത്തിലെ ഈ പേരിന്റെ പ്രചാരത്തിലുള്ള മലയാളരൂപം.
- source_word: ἀδελφοὶ
  choice: സഹോദരന്മാർ
  rationale: പദത്തിന്റെ സാധാരണവും ഉപരിതലവുമായ അർഥം ‘സഹോദരന്മാർ’ എന്നാണ്. വിശാലമായ ബന്ധുത്വാർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ച് മുഖ്യപാഠം വ്യാഖ്യാനപരമായി തീർപ്പാക്കുന്നില്ല.
- source_word: Ἰάκωβος
  choice: യാക്കോബ്
  rationale: ഗ്രീക്ക് Ἰάκωβος എന്ന പേരിന്റെ മലയാള പുതിയനിയമ പാരമ്പര്യത്തിലുള്ള സാധാരണ രൂപം.
- source_word: Ἰωσὴφ
  choice: യോസേഫ്
  rationale: SBLGNT മുഖ്യപാഠമായ Ἰωσήφ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; യോസേസ് എന്ന പാഠഭേദം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: Σίμων
  choice: ശിമോൻ
  rationale: പേരിന്റെ പ്രചാരത്തിലുള്ള മലയാള ബൈബിൾരൂപം.
- source_word: Ἰούδας
  choice: യൂദാ
  rationale: Ἰούδας എന്ന പേരിന്റെ പ്രചാരത്തിലുള്ള മലയാളരൂപം; മറ്റൊരു വ്യക്തിയുമായി തിരിച്ചറിയൽ നിർബന്ധിക്കുന്നില്ല.
- source_word: οὐχ ... ;
  choice: '...അല്ലേ?'
  rationale: അനുകൂലമായ മറുപടി പ്രതീക്ഷിക്കുന്ന ഗ്രീക്ക് അലങ്കാരചോദ്യത്തെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: യേശുവിനോടുള്ള ἀδελφοὶ αὐτοῦ എന്നവരുടെ ബന്ധം
  choice: മുഖ്യപാഠത്തിൽ ‘ഇവന്റെ സഹോദരന്മാർ’ എന്ന് വിവർത്തനം ചെയ്യുക
  alternative: ‘ഇവന്റെ ബന്ധുക്കൾ’ അല്ലെങ്കിൽ ‘ഇവന്റെ കുടുംബക്കാർ’
  rationale: ἀδελφοί എന്നതിന്റെ സാധാരണ അർഥം സഹോദരന്മാർ എന്നാണ്. ഇവരുടെ കൃത്യമായ ജൈവമോ വിശാല കുടുംബബന്ധമോ മുഖ്യപാഠത്തിൽ തീർപ്പാക്കാതെ, വിശാലാർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സംഭാഷണത്തിലെ പരിചയഭാവവും പരിഹാസസൂചനയുള്ള അലങ്കാരചോദ്യങ്ങളും ‘അല്ലേ?’ എന്ന രൂപത്തിൽ നിലനിർത്തി. പേരുകൾ പ്രചാരത്തിലുള്ള മലയാള പുതിയനിയമ രൂപങ്ങളിൽ നൽകി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദങ്ങളോടോ വാക്യഭാഗങ്ങളോടോ ചേർത്തിരിക്കുന്നു.
