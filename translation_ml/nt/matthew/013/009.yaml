  text: ὁ ἔχων ⸀ὦτα ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/009.yaml
  text: The one who has ears[a], let him hear.
translation:
  language: ml
  text: ചെവികളുള്ളവൻ കേൾക്കട്ടെ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔχων
  choice: ഉള്ളവൻ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ വർത്തമാനകാല കൃദന്തം ഇവിടെ ഏതൊരു വ്യക്തിയെയും പൊതുവായി സൂചിപ്പിക്കുന്ന നാമവാചകപ്രയോഗമാണ്. മലയാളത്തിലെ “ഉള്ളവൻ” ഏകവചനവും പൊതുവായ പ്രതിനിധാനശക്തിയും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ὦτα
  choice: ചെവികൾ
  rationale: ഗ്രീക്കിൽ ബഹുവചനമാണ്; അതിനാൽ “ചെവികൾ” സംഖ്യയും സന്ദർഭത്തിലെ പ്രയോഗവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἀκουέτω
  choice: കേൾക്കട്ടെ
  rationale: മൂന്നാംപുരുഷ ഏകവചന വർത്തമാനകാല ആജ്ഞാരൂപത്തിന്റെ ആഹ്വാനാത്മക ശക്തി “കേൾക്കട്ടെ” സ്വാഭാവികമായി പകരുന്നു. സന്ദർഭത്തിൽ ഇത് ശബ്ദം ഗ്രഹിക്കുക മാത്രമല്ല, ശ്രദ്ധയോടെ സ്വീകരിക്കുക എന്ന ആശയവും വഹിക്കുന്നു; എങ്കിലും ആ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർക്കാതെ മൂലപദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
theological_decisions:
- issue: വ്യാകരണപരമായി പുല്ലിംഗ ഏകവചനമായ പൊതുപ്രയോഗം
  choice: ചെവികളുള്ളവൻ കേൾക്കട്ടെ.
  alternative: ചെവികളുള്ള ആരും കേൾക്കട്ടെ.
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ഏകവചനം പൊതുവായി ഏതു വ്യക്തിയെയും സൂചിപ്പിക്കുന്നു. “ഉള്ളവൻ” മലയാളത്തിൽ ഈ പൊതുവായ അർഥത്തോടൊപ്പം മൂലത്തിലെ ഏകവചനഘടനയും നിലനിർത്തുന്നു; ലിംഗത്തെക്കുറിച്ചുള്ള പ്രത്യേക സിദ്ധാന്തപരമായ അർഥം ഇതിൽ ചുമത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ ചുരുക്കവും ഗൗരവവുമുള്ള, സാധാരണ വായനക്കാർക്ക് ഉടൻ മനസ്സിലാകുന്ന രൂപം. മൂലപാഠത്തിൽ വ്യത്യസ്ത വായനയോ വിശദീകരണം ആവശ്യമായ യഥാർത്ഥ അനിശ്ചിതത്വമോ ഇല്ലാത്തതിനാൽ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
