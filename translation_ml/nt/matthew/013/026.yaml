id: MAT.13.26
reference: Matthew 13:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτε δὲ ἐβλάστησεν ὁ χόρτος καὶ καρπὸν ἐποίησεν, τότε ἐφάνη καὶ τὰ ζιζάνια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/026.yaml
  text: But when the plants had sprouted and produced grain[a], then the weeds also appeared.
translation:
  language: ml
  text: എന്നാൽ വിള മുളച്ച് ധാന്യം കായ്ച്ചപ്പോൾ, കളകളും അപ്പോൾ പ്രത്യക്ഷമായി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ടെയറുകൾ’; ഒരുപക്ഷേ ഡാർണൽ എന്ന പ്രത്യേക കളച്ചെടി.
    reason: ζιζάνια എന്ന പദത്തിന്റെ പരമ്പരാഗതവും സാധ്യതയുള്ള സസ്യശാസ്ത്രപരവുമായ അർഥങ്ങൾ സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: ὅτε δὲ
  choice: എന്നാൽ ...പ്പോൾ
  rationale: ὅτε സൂചിപ്പിക്കുന്ന സമയബന്ധം ‘-പ്പോൾ’ കൊണ്ടും δέ നൽകുന്ന നേരിയ വൈരുധ്യം ‘എന്നാൽ’ കൊണ്ടും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐβλάστησεν
  choice: മുളച്ച്
  rationale: βλαστάνω ഇവിടെ ചെടി മുളച്ചുവളരുന്നതിന്റെ ആരംഭത്തെ സൂചിപ്പിക്കുന്നു; ‘മുളച്ച്’ കൃഷിസന്ദർഭത്തിൽ ലളിതവും കൃത്യവുമാണ്.
- source_word: ὁ χόρτος
  choice: ചെടികൾ
  rationale: χόρτος എന്നത് പുല്ലിനെയോ സസ്യവളർച്ചയെയോ സൂചിപ്പിക്കാമെങ്കിലും, ഈ വയൽസന്ദർഭത്തിൽ ‘ചെടികൾ’ എന്ന പൊതുപദം ഇനത്തെ മുൻകൂട്ടി നിർണയിക്കാതെ അർഥം നൽകുന്നു.
- source_word: καρπὸν ἐποίησεν
  choice: ധാന്യം വിളഞ്ഞപ്പോൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘ഫലം ഉണ്ടാക്കി’ എന്ന പ്രയോഗം ഇവിടെ വിളവ്, പ്രത്യേകിച്ച് ധാന്യമണി, രൂപപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ധാന്യം വിളഞ്ഞു’ എന്നത് ആ കൃഷിസന്ദർഭം സ്വാഭാവികമായി പകരുന്നു.
- source_word: τότε
  choice: അപ്പോൾ
  rationale: τότε സംഭവക്രമത്തിലെ അടുത്ത ഘട്ടം അടയാളപ്പെടുത്തുന്നു; മലയാളത്തിൽ ‘അപ്പോൾ’ അതിന്റെ നേരായ സമാനപദമാണ്.
- source_word: ἐφάνη
  choice: പ്രത്യക്ഷമായി
  rationale: φαίνωയുടെ ഇവിടെ ഉള്ള അകർമക അർഥം കാണപ്പെടുകയോ തിരിച്ചറിയാവുന്നതാകുകയോ ചെയ്യുക എന്നതാണ്; ‘പ്രത്യക്ഷമായി’ അത് കൃത്യമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: καὶ τὰ ζιζάνια
  choice: കളകളും
  rationale: ζιζάνια വയലിലെ ദോഷസസ്യങ്ങളെ സൂചിപ്പിക്കുന്നു; ‘കളകൾ’ സാധാരണ വായനക്കാർക്ക് സുലഭമാണ്. καίയുടെ കൂട്ടിച്ചേർക്കൽഭാവം ‘-കളും’ പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ζιζάνια എന്ന സസ്യത്തിന്റെ കൃത്യമായ തിരിച്ചറിയൽ
  choice: മുഖ്യപാഠത്തിൽ പൊതുവായി ‘കളകൾ’
  alternative: ‘ടെയർ’ അഥവാ ‘ഡാർണൽ’ എന്ന പ്രത്യേക കളച്ചെടി
  rationale: ഗ്രീക്ക് പദം ഒരു പ്രത്യേക കളച്ചെടിയെ, സാധ്യതയോടെ ഡാർണലിനെ, സൂചിപ്പിക്കാമെങ്കിലും സസ്യശാസ്ത്രപരമായ തിരിച്ചറിയൽ പൂർണമായി ഉറപ്പില്ല. അതിനാൽ മുഖ്യപാഠത്തിൽ സുലഭമായ പൊതുപദം ഉപയോഗിച്ച് പ്രത്യേക സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ കൃഷിഭാഷ ഉപയോഗിച്ചു. ഗ്രീക്ക് വാക്യത്തിലെ സമയക്രമവും നേരിയ വൈരുധ്യവും നിലനിർത്തി; സസ്യത്തിന്റെ അനിശ്ചിത തിരിച്ചറിയൽ അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
