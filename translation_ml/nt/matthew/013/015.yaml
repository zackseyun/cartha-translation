id: MAT.13.15
reference: Matthew 13:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐπαχύνθη γὰρ ἡ καρδία τοῦ λαοῦ τούτου, καὶ τοῖς ὠσὶν βαρέως ἤκουσαν, καὶ τοὺς ὀφθαλμοὺς αὐτῶν ἐκάμμυσαν· μήποτε ἴδωσιν τοῖς ὀφθαλμοῖς καὶ τοῖς ὠσὶν ἀκούσωσιν καὶ τῇ καρδίᾳ συνῶσιν καὶ ἐπιστρέψωσιν, καὶ ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/015.yaml
  text: For this people's heart has grown dull[a], and with their ears they hear heavily, and they have closed their eyes, lest they should see with their eyes and hear with their ears and understand with their heart and turn back[c][b], and I will heal them.
translation:
  language: ml
  text: ഈ ജനത്തിന്റെ ഹൃദയം മന്ദമായിരിക്കുന്നു; അവർ ചെവികളാൽ പ്രയാസത്തോടെ കേട്ടു[a]; അവർ തങ്ങളുടെ കണ്ണുകൾ പൂട്ടിക്കളഞ്ഞു; അവർ കണ്ണുകളാൽ കാണുകയും ചെവികളാൽ കേൾക്കുകയും ഹൃദയംകൊണ്ട് മനസ്സിലാക്കുകയും തിരിയുകയും, ഞാൻ അവരെ സൗഖ്യമാക്കുകയും ചെയ്യാതിരിക്കേണ്ടതിന്[b]. [c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “അവർ ഭാരമായി കേട്ടു”; അഥവാ, “അവർ പ്രയാസത്തോടെ കേട്ടു.”'
    reason: lexical_alternative
  - marker: b
    text: “തിരിയുക” എന്നതിന് “മടങ്ങുക” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: c
    text: യെശയ്യാവ് 6:9–10-ൽനിന്നുള്ള ഉദ്ധരണി.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπαχύνθη
  choice: മന്ദീഭവിച്ചിരിക്കുന്നു
  rationale: പദത്തിന്റെ അക്ഷരാർഥം ‘തടിച്ചിരിക്കുന്നു’ എന്നാണെങ്കിലും, ഹൃദയത്തെക്കുറിച്ചുള്ള ഈ പ്രയോഗത്തിൽ ഗ്രഹണശേഷിയും പ്രതികരണശേഷിയും മങ്ങിയ അവസ്ഥയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ രൂപം തിരഞ്ഞെടുത്തു.
- source_word: καρδία
  choice: ഹൃദയം
  rationale: മനസ്സിലാക്കലിന്റെയും ആന്തരിക മനോഭാവത്തിന്റെയും കേന്ദ്രത്തെ സൂചിപ്പിക്കുന്ന പതിവ് ബൈബിൾ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: βαρέως ἤκουσαν
  choice: പ്രയാസത്തോടെയാണ് കേട്ടത്
  rationale: അക്ഷരാർഥത്തിലെ ‘ഭാരമായി കേട്ടു’ എന്ന രൂപത്തെ അസ്വാഭാവികമായി പകർത്താതെ, കേൾവിയിലെ പ്രയാസം/മന്ദത സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിലെ ഭൂതകാലരൂപവും നിലനിർത്തുന്നു.
- source_word: ἐκάμμυσαν
  choice: അടച്ചുകളഞ്ഞു
  rationale: ജനങ്ങൾ തന്നെയാണ് കണ്ണുകൾ അടച്ചത് എന്ന സജീവ ഉത്തരവാദിത്തം വ്യക്തമാക്കുന്നു.
- source_word: μήποτε
  choice: അല്ലെങ്കിൽ
  rationale: ഇവിടെ ‘അല്ലെങ്കിൽ/അങ്ങനെ സംഭവിക്കാതിരിക്കാൻ’ എന്ന മുന്നറിയിപ്പ്-ഫലബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ദൈവിക ന്യായവിധിയും മനുഷ്യ ഉത്തരവാദിത്തവും തമ്മിലുള്ള പിരിമുറുക്ക് പരിഹരിച്ചുകളയുന്നില്ല.
- source_word: συνῶσιν
  choice: ഗ്രഹിക്കുകയും
  rationale: വെറും വിവരജ്ഞാനമല്ല, ഉള്ളറയിലെ തിരിച്ചറിവ് എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐπιστρέψωσιν
  choice: എങ്കലേക്കു തിരിയുകയും
  rationale: തിരിയുക/മടങ്ങിവരുക എന്ന ദിശാസൂചന നിലനിർത്തുന്നു; ‘മാനസാന്തരപ്പെടുക’ പോലുള്ള കൂടുതൽ വ്യാഖ്യാനാത്മകമായ സഭാപദം ഒഴിവാക്കുന്നു. ‘എങ്കലേക്കു’ എന്നത് ഉദ്ധരണിയിലെ സംസാരിക്കുന്ന ദൈവത്തോടുള്ള മടക്കത്തിന്റെ സൂചിത ലക്ഷ്യം വ്യക്തമാക്കുന്നു.
- source_word: ἰάσομαι
  choice: ഞാൻ അവരെ സൗഖ്യമാക്കുകയും ചെയ്യുമായിരുന്നു
  rationale: ഗ്രീക്കിൽ ഭാവികാലമാണെങ്കിലും μήποτε-യുടെ കീഴിലുള്ള സാധ്യതാപരമായ തുടർച്ച മലയാളത്തിൽ സുതാര്യമാക്കുന്നു; അക്ഷരാനുസൃതമായ മറ്റൊരു രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: ന്യായവിധിയുടെ ഉദ്ദേശ്യം/ഫലം എന്ന ഉപവാക്യവും മനുഷ്യ ഉത്തരവാദിത്തവും തമ്മിലുള്ള പിരിമുറുക്ക്
  choice: അവർ കണ്ണുകൾ അടച്ചുകളഞ്ഞു. അല്ലെങ്കിൽ, അവർ ... തിരിയുകയും ഞാൻ ... സൗഖ്യമാക്കുകയും ചെയ്യുമായിരുന്നു
  alternative: അവർ ... തിരിയാതിരിക്കാനും ഞാൻ അവരെ സൗഖ്യമാക്കാതിരിക്കാനും
  rationale: ജനങ്ങൾ കണ്ണടച്ചതിലെ സജീവ ഉത്തരവാദിത്തം നിലനിർത്തിക്കൊണ്ട് μήποτε-യുടെ മുന്നറിയിപ്പ്/സാധ്യതാഭാവം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു. എന്നാൽ ഉദ്ദേശ്യം, ഫലം, ന്യായവിധി എന്നിവയെക്കുറിച്ചുള്ള വ്യാഖ്യാനവാദം പൂർണമായി തീർപ്പാക്കുന്നില്ല; കൂടുതൽ അക്ഷരാനുസൃതമായ സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- issue: ἐπιστρέψωσιν എന്നതിലെ മാനസാന്തരസൂചന
  choice: എങ്കലേക്കു തിരിയുകയും
  alternative: മടങ്ങിവരികയും / തിരിയുകയും
  rationale: ദൈവത്തോടുള്ള മടക്കം എന്ന സന്ദർഭാർത്ഥം വ്യക്തമാക്കുന്നു, എന്നാൽ പ്രത്യേക സഭാപരമായ ‘പരിവർത്തനം’ എന്ന സാങ്കേതിക അർത്ഥം ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ‘മന്ദീഭവിച്ചു’, ‘ഗ്രഹിച്ചു’, ‘സൗഖ്യമാക്കി’ എന്നിവ പരിചിതമായ ബൈബിൾ പദസമ്പത്ത് നിലനിർത്തുമ്പോഴും അത്യന്തം പുരാതനമായ വാക്യക്രമം ഒഴിവാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
