  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ഗ്രീക്കിലെ വാക്യക്രമം യാന്ത്രികമായി പകർത്താതെ സംഭവക്രമവും പ്രധാന അർഥബന്ധങ്ങളും നിലനിർത്തി.
