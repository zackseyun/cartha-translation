id: MAT.13.36
reference: Matthew 13:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τότε ἀφεὶς τοὺς ὄχλους ἦλθεν εἰς τὴν ⸀οἰκίαν. καὶ προσῆλθον αὐτῷ οἱ μαθηταὶ αὐτοῦ λέγοντες· ⸀Διασάφησον ἡμῖν τὴν παραβολὴν τῶν ζιζανίων τοῦ ἀγροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/036.yaml
  text: Then[a], after leaving the crowds, he went into the house. And his disciples came to him, saying, “Explain to us the parable of the weeds of the field.”
translation:
  language: ml
  text: അപ്പോൾ ജനക്കൂട്ടങ്ങളെ വിട്ട് അവൻ വീട്ടിനകത്തേക്കു ചെന്നു. അവന്റെ ശിഷ്യന്മാർ അവന്റെ അടുക്കൽ വന്ന്, “വയലിലെ കളകളുടെ[a] ഉപമ ഞങ്ങൾക്കു വിശദീകരിച്ചുതരണമേ” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “വയലിലെ ഡാർണൽ കളകളുടെ ഉപമ”; ഗ്രീക്ക് പദം ഗോതമ്പിനോടു സാമ്യമുള്ള ഡാർണൽ എന്ന കളച്ചെടിയെ കൂടുതൽ വ്യക്തമായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: അപ്പോൾ
  rationale: തുടർന്നുണ്ടായ സംഭവത്തെ അവതരിപ്പിക്കുന്ന കാലസൂചകമായി സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: ἀφεὶς τοὺς ὄχλους
  choice: ജനക്കൂട്ടങ്ങളെ വിട്ട്
  rationale: ἀφίημι ഇവിടെ അവിടെനിന്ന് പിരിഞ്ഞുപോകുക എന്ന അർഥത്തിലാണ്; ὄχλοι എന്ന ബഹുവചനം ‘ജനക്കൂട്ടങ്ങൾ’ എന്നു നിലനിർത്തുന്നു.
- source_word: ἦλθεν εἰς τὴν οἰκίαν
  choice: വീട്ടിനകത്തേക്കു ചെന്നു
  rationale: εἰς സൂചിപ്പിക്കുന്ന അകത്തേക്കുള്ള ചലനവും οἰκίαയിലെ നിർദിഷ്ടതയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: προσῆλθον αὐτῷ οἱ μαθηταὶ αὐτοῦ
  choice: അവന്റെ ശിഷ്യന്മാർ അവന്റെ അടുക്കൽ വന്ന്
  rationale: προσέρχομαι എന്നതിലെ സമീപിച്ചുവരുന്ന ആശയം നിലനിർത്തുന്ന സ്വാഭാവിക പ്രയോഗം.
- source_word: Διασάφησον ἡμῖν
  choice: ഞങ്ങൾക്കു വിശദീകരിച്ചുതരണമേ
  rationale: വ്യക്തമായി വിശദമാക്കാനുള്ള ആജ്ഞാപൂർവമായ അഭ്യർഥനയെ മാന്യവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: τὴν παραβολὴν
  choice: ഉപമ
  rationale: സുവിശേഷസന്ദർഭത്തിൽ παραβολή എന്ന സാഹിത്യരൂപത്തിനുള്ള സ്ഥാപിതവും ഗ്രഹിക്കാവുന്നതുമായ മലയാളപദം.
- source_word: τῶν ζιζανίων τοῦ ἀγροῦ
  choice: വയലിലെ കളകളുടെ
  rationale: ഗ്രീക്കിലെ ബന്ധത്തെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ζιζάνιαയുടെ കൂടുതൽ നിർദിഷ്ട സസ്യാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
