  yaml_path: translation/nt/matthew/013/018.yaml
  text: You[a], then, hear the parable of the one who sowed.
translation:
  language: ml
  text: അതുകൊണ്ട് നിങ്ങൾ വിതച്ചവന്റെ ഉപമ കേൾക്കുക.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑμεῖς
  choice: നിങ്ങൾ
  rationale: ഗ്രീക്കിൽ സർവനാമം വ്യക്തമായും ഊന്നലോടെയും വന്നിരിക്കുന്നു. മലയാളത്തിൽ ‘നിങ്ങൾ’ എന്നു തുറന്നുപറയുന്നത് ആ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യങ്ങളോടുള്ള നിഗമനാത്മക ബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ ‘അതുകൊണ്ട്’ അനുയോജ്യം; ഇത് വെറും കാലക്രമസൂചകമായി ചുരുക്കുന്നില്ല.
- source_word: ἀκούσατε
  choice: കേൾക്കുക
  rationale: രണ്ടാം പുരുഷ ബഹുവചനത്തിലെ കല്പനാഭാവം നേരിട്ട് നിലനിർത്തുന്നു. ‘മനസ്സിലാക്കുക’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് മൂലപദത്തേക്കാൾ അധിക വ്യാഖ്യാനം ചേർക്കും.
- source_word: παραβολὴν
  choice: ഉപമ
  rationale: സിനോപ്റ്റിക് സുവിശേഷങ്ങളിലെ παραβολή എന്ന പഠനരൂപത്തിന് സ്വാഭാവികവും സ്ഥാപിതവുമായ മലയാളപദം.
- source_word: τοῦ σπείραντος
  choice: വിതച്ചവന്റെ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ aorist participle-ന്റെ ‘വിതച്ച ആളുടെ’ എന്ന ഭൂതകാലസൂചന നേരിട്ട് കാത്തുസൂക്ഷിക്കുന്നു; അതിനെ സ്ഥിരമായ ‘വിതക്കാരൻ’ എന്ന പദവിയാക്കി മാറ്റുന്നില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കല്പനാശൈലി. ‘അതുകൊണ്ട് നിങ്ങൾ’ എന്ന ക്രമം Ὑμεῖς οὖν എന്നതിലെ വ്യക്തമായ അഭിസംബോധനയും മുൻസന്ദർഭത്തോടുള്ള ബന്ധവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
