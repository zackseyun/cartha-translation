    text: അഥവാ, ‘വാടിപ്പോയി.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡλίου δὲ ἀνατείλαντος
  choice: എന്നാൽ സൂര്യൻ ഉദിച്ചപ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് കാലസാഹചര്യം സൂചിപ്പിക്കുന്നു. δέ നൽകുന്ന നേരിയ വൈരുധ്യവും തുടർച്ചയും ‘എന്നാൽ’ നിലനിർത്തുന്നു.
- source_word: ἐκαυματίσθη
  choice: ചൂടേറ്റു കരിഞ്ഞുപോയി
  rationale: καυματίζω എന്ന ക്രിയയുടെ പാസീവ് രൂപം സൂര്യചൂടിനാൽ ചെടി കരിയുന്നതിനെ സൂചിപ്പിക്കുന്നു. സസ്യസന്ദർഭത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ പ്രയോഗമാണിത്.
- source_word: διὰ τὸ μὴ ἔχειν
  choice: ഇല്ലാതിരുന്നതിനാൽ
  rationale: διά + ആർട്ടിക്കുലർ ഇൻഫിനിറ്റീവ് കാരണം വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ കാരണപ്രയോഗമായി പുനഃക്രമീകരിച്ചു.
- source_word: ῥίζαν
  choice: വേര്
  rationale: ഗ്രീക്കിൽ ഏകവചനമാണ്; ചെടിക്ക് വേരില്ലെന്ന ആശയം മലയാളത്തിലും ഏകവചനത്തിൽ സ്വാഭാവികമാണ്.
- source_word: ἐξηράνθη
  choice: വാടിപ്പോയി
  rationale: സസ്യസന്ദർഭത്തിൽ ξηραίνω ഉണങ്ങുകയോ വാടുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘വാടിപ്പോയി’ ഫലത്തെ സ്വാഭാവികമായി അറിയിക്കുന്നു; മറ്റൊരു സാധുവായ അർഥം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
