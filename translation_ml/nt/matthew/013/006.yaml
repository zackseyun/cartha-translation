  text: But when the sun rose[a], it was scorched, and because it had no root, it withered away.
translation:
  language: ml
  text: എന്നാൽ സൂര്യൻ ഉദിച്ചപ്പോൾ അത് ചൂടേറ്റ് കരിഞ്ഞു; അതിനു വേര് ഇല്ലാതിരുന്നതിനാൽ ഉണങ്ങിപ്പോയി.[a]
