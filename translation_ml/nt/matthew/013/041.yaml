id: MAT.13.41
reference: Matthew 13:41
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀποστελεῖ ὁ υἱὸς τοῦ ἀνθρώπου τοὺς ἀγγέλους αὐτοῦ, καὶ συλλέξουσιν ἐκ τῆς βασιλείας αὐτοῦ πάντα τὰ σκάνδαλα καὶ τοὺς ποιοῦντας τὴν ἀνομίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/041.yaml
  text: The Son of Man will send out his angels[a], and they will gather out of his kingdom all causes of stumbling and those who practice lawlessness[b],
translation:
  language: ml
  text: മനുഷ്യപുത്രൻ തന്റെ ദൂതന്മാരെ അയയ്ക്കും. അവർ അവന്റെ രാജ്യത്തിൽനിന്ന് ഇടർച്ചയ്ക്കു കാരണമാകുന്ന സകലത്തെയും, അധർമ്മം പ്രവർത്തിക്കുന്നവരെയും ശേഖരിച്ചുകൂട്ടും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποστελεῖ
  choice: അയയ്ക്കും
  rationale: ἀποστέλλω എന്ന ക്രിയയുടെ ഭാവികാലരൂപം. നിയോഗിച്ച് അയയ്ക്കുക എന്ന ആശയം സന്ദർഭത്തിൽ വ്യക്തമായതിനാൽ സ്വാഭാവികമായ ‘അയയ്ക്കും’ തെരഞ്ഞെടുത്തു.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: മത്തായിയിൽ യേശു ഉപയോഗിക്കുന്ന സ്ഥാനനാമത്തിന്റെ സ്ഥാപിതമായ മലയാളരൂപം; ദാനീയേൽ 7-നോടുള്ള ആശയബന്ധവും നിലനിർത്തുന്നു.
- source_word: τοὺς ἀγγέλους αὐτοῦ
  choice: തന്റെ ദൂതന്മാരെ
  rationale: വിധിന്യായത്തിന്റെ ഈ സന്ദർഭത്തിൽ ἄγγελοι മനുഷ്യസന്ദേശവാഹകരെയല്ല, സ്വർഗീയദൂതന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്. ആവർത്തനം ഒഴിവാക്കാതെ ഉടമസ്ഥബന്ധം വ്യക്തമായി കാണിക്കാൻ ‘തന്റെ’ ഉപയോഗിച്ചു.
- source_word: συλλέξουσιν
  choice: കൂട്ടിച്ചേർക്കും
  rationale: വിളവെടുപ്പിന്റെയും വിധിന്യായത്തിന്റെയും പശ്ചാത്തലത്തിലുള്ള ഒരുമിച്ചുകൂട്ടൽ എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐκ τῆς βασιλείας αὐτοῦ
  choice: അവന്റെ രാജ്യത്തിൽനിന്ന്
  rationale: ἐκ സൂചിപ്പിക്കുന്ന, രാജ്യത്തിനകത്തുനിന്നുള്ള നീക്കം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: πάντα τὰ σκάνδαλα
  choice: ഇടർച്ചയുണ്ടാക്കുന്ന സകലതിനെയും
  rationale: σκάνδαλα ആളുകളെ പാപത്തിലേക്കോ വിശ്വാസത്യാഗത്തിലേക്കോ വീഴാൻ ഇടയാക്കുന്ന വസ്തുക്കളെയോ സ്വാധീനങ്ങളെയോ വ്യക്തികളെയോ സൂചിപ്പിക്കാം. ഈ വിശാലത ചുരുക്കാതെ നിലനിർത്തുന്ന പ്രയോഗമാണിത്.
- source_word: τοὺς ποιοῦντας τὴν ἀνομίαν
  choice: അധർമ്മം പ്രവർത്തിക്കുന്നവരെയും
  rationale: വർത്തമാനകാല കൃതന്തം പതിവായോ സ്വഭാവസവിശേഷമായോ ഉള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ἀνομίαയുടെ ദൈവനിയമത്തോടുള്ള വിരോധം ‘അധർമ്മം’ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου എന്ന സ്ഥാനനാമത്തിന്റെ പരിഭാഷ
  choice: മനുഷ്യപുത്രൻ
  alternative: മനുഷ്യനായവൻ
  rationale: പരമ്പരാഗത രൂപം മത്തായിയിലെ സ്ഥാനനാമസ്വഭാവവും ദാനീയേൽ 7-ലെ അന്ത്യകാലസംബന്ധിയായ പ്രതിധ്വനിയും പരാവർത്തനം കൂടാതെ സംരക്ഷിക്കുന്നു.
- issue: σκάνδαλα എന്നതിന്റെ വ്യാപ്തി
  choice: ഇടർച്ചയുണ്ടാക്കുന്ന സകലതും
  alternative: എല്ലാ ഇടർച്ചക്കല്ലുകളും
  rationale: മൂലപദം വ്യക്തികളെയും വസ്തുക്കളെയും സ്വാധീനങ്ങളെയും ഉൾക്കൊള്ളാൻ കഴിയുന്നതിനാൽ ഒരു വിഭാഗത്തിലേക്ക് അർഥം ചുരുക്കിയിട്ടില്ല.
- issue: ἀνομία എന്നതിന്റെ ധാർമിക-ദൈവശാസ്ത്രപരമായ അർഥം
  choice: അധർമ്മം
  alternative: നിയമലംഘനം
  rationale: ‘അധർമ്മം’ ദൈവഹിതത്തോടും ദൈവനിയമത്തോടുമുള്ള വിരോധത്തിന്റെ വിശാലമായ അർഥം നിലനിർത്തുന്നു; കേവലം പൗരനിയമലംഘനമായി തെറ്റിദ്ധരിക്കപ്പെടുന്നതും ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധം, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവത്തോടെ രചിച്ചു. വാക്യത്തിന്റെ ദൈർഘ്യം നിയന്ത്രിക്കാനായി ഗ്രീക്ക് സംയോജകത്തെ മലയാളത്തിൽ രണ്ടു വാക്യങ്ങളാക്കി; ആശയക്രമവും വിധിന്യായഭാവവും മാറ്റിയിട്ടില്ല.
