  source_fidelity: The draft accurately represents the future action, the Son of Man, his angels, removal from his kingdom, and both coordinated objects. A small wording change improves the rendering of πάντα τὰ σκάνδαλα as the broad category of all that causes stumbling, without limiting it to inanimate objects.
