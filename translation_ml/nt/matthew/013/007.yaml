  text: ἄλλα δὲ ἔπεσεν ἐπὶ τὰς ἀκάνθας, καὶ ἀνέβησαν αἱ ἄκανθαι καὶ ⸀ἔπνιξαν αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/007.yaml
  text: Other seeds fell among the thorns[a], and the thorns came up and choked them.
translation:
  language: ml
  text: മറ്റു വിത്തുകൾ മുള്ളുകൾക്കിടയിൽ[a] വീണു; മുള്ളുകൾ വളർന്നുവന്ന് അവയെ ഞെരുക്കിക്കളഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ അക്ഷരാർഥം ‘മുള്ളുകളുടെമേൽ വീണു’; ഈ കാർഷികസന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളത്തിനായി ‘മുള്ളുകൾക്കിടയിൽ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα
  choice: മറ്റു വിത്തുകൾ
  rationale: സന്ദർഭത്തിൽ വിത്തുകളെ സൂചിപ്പിക്കുന്ന നപുംസകലിംഗ ബഹുവചന വിശേഷണമാണ്; മലയാളത്തിൽ സൂചിതമായ നാമം ചേർക്കുന്നത് അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: δὲ
  choice: ;
  rationale: ഇവിടെ δέ ഉപമയിലെ അടുത്ത സംഭവത്തിലേക്കുള്ള മൃദുവായ ബന്ധകമാണ്. മലയാളത്തിൽ പ്രത്യേക ബന്ധകപദം ചേർക്കാതെ അർധവിരാമത്തിലൂടെ സംഭവക്രമം സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἔπεσεν
  choice: വീണു
  rationale: πίπτω എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ‘വിതയ്ക്കപ്പെട്ടു’ എന്ന് വിവർത്തനം ചെയ്താൽ ഗ്രീക്കിലുള്ളതിലധികം വ്യാഖ്യാനം വരും.
- source_word: ἐπὶ τὰς ἀκάνθας
  choice: മുള്ളുകൾക്കിടയിൽ
  rationale: ἐπί + accusative അക്ഷരാർഥത്തിൽ ‘മുള്ളുകളുടെമേൽ’ എന്നാകാമെങ്കിലും, വിത്തുവിതയ്ക്കുന്ന കാർഷികസന്ദർഭത്തിൽ ‘മുള്ളുകൾക്കിടയിൽ’ എന്നത് സ്വാഭാവികവും ഉദ്ദേശ്യാർഥത്തിന് യോജിച്ചതുമാണ്.
- source_word: ἀκάνθας / ἄκανθαι
  choice: മുള്ളുകൾ
  rationale: മുള്ളുള്ള ചെടികളെയും അവ വളർന്ന സ്ഥലത്തെയും സാധാരണവും സംക്ഷിപ്തവുമായി സൂചിപ്പിക്കുന്ന മലയാളപ്രയോഗം.
- source_word: ἀνέβησαν
  choice: വളർന്നുവന്ന്
  rationale: ചെടികൾ മുകളിലേക്കു പൊങ്ങിവരുന്ന ദൃശ്യവും വളർച്ചയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: ἔπνιξαν
  choice: ഞെരുക്കിക്കളഞ്ഞു
  rationale: πνίγωയുടെ ശ്വാസംമുട്ടിക്കുക/ഞെരുക്കുക എന്ന ശക്തമായ ദൃശ്യാർഥം കാർഷികസന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: αὐτά
  choice: അവയെ
  rationale: മുമ്പ് സൂചിപ്പിച്ച ബഹുവചനമായ വിത്തുകളെ തിരിച്ചുസൂചിപ്പിക്കുന്ന സർവനാമം നിലനിർത്തുന്നു.
