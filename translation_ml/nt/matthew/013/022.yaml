id: MAT.13.22
reference: Matthew 13:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ εἰς τὰς ἀκάνθας σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων, καὶ ἡ μέριμνα τοῦ αἰῶνος ⸀τούτου καὶ ἡ ἀπάτη τοῦ πλούτου συμπνίγει τὸν λόγον, καὶ ἄκαρπος γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/022.yaml
  text: And the one sown among the thorns—this is the one who hears the word[a], but the चिंता of this age and the deceitfulness of wealth choke the word[b], and he becomes unfruitful.
translation:
  language: ml
  text: മുള്ളുകൾക്കിടയിൽ വിതയ്ക്കപ്പെട്ടവൻ വചനം കേൾക്കുന്നവനാണ്; എന്നാൽ ഈ യുഗത്തിലെ ഉത്കണ്ഠ[a]യും സമ്പത്തിന്റെ വഞ്ചകത്വം[b]യും വചനത്തെ ഞെരുക്കുന്നു; അങ്ങനെ അവൻ ഫലമില്ലാത്തവനായിത്തീരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഈ ലോകത്തിലെ ആകുലതകൾ.’ ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘ഈ യുഗത്തിലെ ഉത്കണ്ഠ’ എന്നാണ്.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, ‘ധനത്തിന്റെ വഞ്ചന.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἰς τὰς ἀκάνθας σπαρείς
  choice: മുള്ളുകൾക്കിടയിൽ വിതയ്ക്കപ്പെട്ടവനോ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ പുല്ലിംഗ ഏകവചന കൃദന്തം ഉപമയിൽ വിത്തിനാൽ പ്രതിനിധീകരിക്കപ്പെടുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. ‘മുള്ളുകൾക്കിടയിൽ’ എന്നത് കാർഷികദൃശ്യം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὁ τὸν λόγον ἀκούων
  choice: വചനം കേൾക്കുന്നവൻ
  rationale: വർത്തമാനകാല കൃദന്തത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ സംബന്ധവാക്യരൂപത്തിൽ നൽകി; λόγος എന്നതിന് ഈ സന്ദർഭത്തിൽ ‘വചനം’ നിലനിർത്തി.
- source_word: ἡ μέριμνα τοῦ αἰῶνος τούτου
  choice: ഈ യുഗത്തിലെ ഉത്കണ്ഠ
  rationale: μέριμναയുടെ ആശങ്കയും മനസ്സിനെ വിഭജിക്കുന്ന കരുതലും ഉൾക്കൊള്ളുന്ന പ്രതികൂലഭാവം ‘ഉത്കണ്ഠ’ നൽകുന്നു. αἰών എന്നതിന്റെ കാലസംബന്ധമായ അർഥം ‘യുഗം’ സംരക്ഷിക്കുന്നു.
- source_word: ἡ ἀπάτη τοῦ πλούτου
  choice: സമ്പത്തിന്റെ വഞ്ചന
  rationale: സമ്പത്ത് നൽകുന്ന വ്യാജസുരക്ഷയും അതിന്റെ വഞ്ചകസ്വഭാവവും ഈ പ്രയോഗം ലളിതമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: συμπνίγει
  choice: ഞെരുക്കിക്കളയുന്നു
  rationale: മുള്ളുകൾ ചെടിയെ ചുറ്റിപ്പിടിച്ച് വളർച്ച തടയുന്ന കാർഷികരൂപകം നിലനിർത്തുകയും ശ്വാസംമുട്ടിക്കുന്നതുപോലുള്ള ശക്തമായ ഫലം സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ἄκαρπος γίνεται
  choice: അവൻ ഫലമില്ലാത്തവനായിത്തീരുന്നു
  rationale: വാക്യത്തിലെ വ്യക്തിപരമായ വിശദീകരണത്തിലേക്കുള്ള മാറ്റം നിലനിർത്തുന്നു; വചനം തന്നെയാണ് ഫലരഹിതമാകുന്നതെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: αἰών എന്നതിന്റെ പരിഭാഷ
  choice: ഈ യുഗം
  alternative: ഈ ലോകം
  rationale: αἰών പ്രധാനമായി ഒരു കാലഘട്ടത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ഈ യുഗം’ പുതിയ നിയമത്തിലെ കാലപരവും ധാർമികവുമായ സംഘർഷം അനാവശ്യമായി വിശദീകരിക്കാതെ നിലനിർത്തുന്നു; പരിചിതമായ മറ്റൊരു പരിഭാഷ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: അവസാന ഉപവാക്യത്തിലെ വ്യക്തിപരമോ വസ്തുപരമോ ആയ സൂചന
  choice: അവൻ ഫലമില്ലാത്തവനായിത്തീരുന്നു
  alternative: അത് ഫലമില്ലാത്തതായിത്തീരുന്നു / വചനം ഫലമില്ലാത്തതായിത്തീരുന്നു
  rationale: യേശുവിന്റെ വിശദീകരണം ‘വചനം കേൾക്കുന്നവൻ’ എന്ന് വ്യക്തിയെ തിരിച്ചറിയുന്നതിനാൽ പുല്ലിംഗ ഏകവചനത്തെ വ്യക്തിപരമായി പരിഭാഷപ്പെടുത്തി. ഇതിലൂടെ വചനത്തിന് സ്വതവേ ഫലം നൽകാൻ കഴിയുന്നില്ലെന്ന സൂചന ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഉപമയിലെ വ്യക്തിവൽക്കരണവും ‘ഈ യുഗം’ എന്ന പദത്തിന്റെ കാലസംബന്ധമായ സൂക്ഷ്മതയും നിലനിർത്തി; സഭാവിഭാഗ-വിശേഷമായ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
