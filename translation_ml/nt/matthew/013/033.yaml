id: MAT.13.33
reference: Matthew 13:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν ἐλάλησεν αὐτοῖς· Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν ζύμῃ, ἣν λαβοῦσα γυνὴ ⸀ἐνέκρυψεν εἰς ἀλεύρου σάτα τρία ἕως οὗ ἐζυμώθη ὅλον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/033.yaml
  text: 'He told them another parable: “The kingdom of heaven is like leaven[c][b][a], which a woman took and hid in three measures of flour until it was all leavened.”'
translation:
  language: ml
  text: 'അവൻ അവരോട് മറ്റൊരു ഉപമ പറഞ്ഞു: “സ്വർഗരാജ്യം പുളിമാവുപോലെയാണ്.[a] ഒരു സ്ത്രീ അത് എടുത്ത് മൂന്ന് സേയാ അളവ് മാവിൽ[b] ഒളിപ്പിച്ചുവെച്ചു;[c] ഒടുവിൽ മുഴുവൻ മാവും പുളിച്ചുതീർന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “പുളിപ്പിക്കുന്ന മാവ്.” ഗ്രീക്കുപദം മാവിനെ പുളിപ്പിക്കാൻ ഉപയോഗിക്കുന്ന ഘടകത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “മൂന്ന് സേയാ” എന്നത് വളരെ വലിയ അളവിലുള്ള മാവാണ്.
    reason: cultural_note
  - marker: c
    text: അഥവാ “അതിൽ കലർത്തി” അല്ലെങ്കിൽ “കുഴച്ചുചേർത്തു”; ഗ്രീക്കിൽ അക്ഷരാർഥം “അതിൽ ഒളിപ്പിച്ചു” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄλλην παραβολὴν ἐλάλησεν αὐτοῖς
  choice: അവൻ അവരോട് മറ്റൊരു ഉപമ പറഞ്ഞു
  rationale: ἄλλην എന്നതിന്റെ കൂട്ടിച്ചേർക്കൽഭാവവും παραβολή എന്നതിന്റെ സാധാരണ അർഥവും നിലനിർത്തുന്നു; ഉപമ അവതരിപ്പിക്കുന്ന സന്ദർഭത്തിൽ ἐλάλησεν എന്നതിന് ‘പറഞ്ഞു’ സ്വാഭാവികമാണ്.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: സ്വർഗരാജ്യം
  rationale: മത്തായിയുടെ പതിവായ പ്രയോഗത്തിന് മലയാളത്തിൽ വ്യക്തവും സ്ഥാപിതവുമായ തുല്യപദം; οὐρανῶν എന്ന ബഹുവചനം കൃത്രിമമായി പകർത്തുന്നില്ല.
- source_word: ζύμῃ
  choice: പുളിമാവ്
  rationale: മാവിനെ പുളിപ്പിക്കുന്ന ഘടകത്തെയും ഉപമയിലെ വ്യാപനസ്വഭാവത്തെയും സ്വാഭാവികമായി അറിയിക്കുന്നു; അതിന് അനുകൂലമോ പ്രതികൂലമോ ആയ വിലയിരുത്തൽ ചേർക്കുന്നില്ല.
- source_word: ἐνέκρυψεν εἰς
  choice: ഒളിപ്പിച്ചുവെച്ചു
  rationale: ἐγκρύπτω എന്ന ക്രിയയുടെ അക്ഷരാർഥമായ ‘അകത്ത് ഒളിപ്പിക്കുക’ സംരക്ഷിക്കുന്നു; ‘കലർത്തി’ എന്ന പാചകസന്ദർഭ വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ നിർബന്ധിക്കുന്നില്ല.
- source_word: ἀλεύρου σάτα τρία
  choice: മൂന്ന് സേയാ അളവ് മാവ്
  rationale: σάτον എന്ന പുരാതന അളവുപേരിനെ നിലനിർത്തുകയും ‘അളവ്’ ചേർത്ത് സാധാരണ വായനക്കാരന് അതിന്റെ സ്വഭാവം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ἕως οὗ ἐζυμώθη ὅλον
  choice: മാവ് മുഴുവനും പുളിക്കുന്നതുവരെ
  rationale: ἕως οὗ എന്ന സമയപരിധിയും ἐζυμώθη എന്ന നിഷ്ക്രിയഫലവും ὅλον എന്ന സമഗ്രതയും ചുരുക്കമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: രാജ്യോപമയിൽ ζύμηയുടെ അനുകൂലമോ പ്രതികൂലമോ ആയ ധ്വനി
  choice: ‘പുളിമാവ്’ എന്ന് മൂല്യനിർണയമില്ലാതെ വിവർത്തനം ചെയ്തു
  alternative: മറ്റു വേദഭാഗങ്ങളിലെ ഉപയോഗത്തെ അടിസ്ഥാനമാക്കി ഇതിനെ പ്രതികൂല പ്രതീകമായി വ്യാഖ്യാനിച്ച് വാചകം രൂപപ്പെടുത്തുക
  rationale: ഇവിടെ ഉപമയുടെ ചിത്രം മറഞ്ഞുനിന്ന് മുഴുവൻ മാവിലും വ്യാപിക്കുന്ന പുളിപ്പിക്കൽക്രിയയാണ്. അതിന്റെ ദൈവശാസ്ത്രപരമായ മൂല്യം വിവർത്തനം തന്നെ തീർപ്പാക്കരുത്.
- issue: ἐνέκρυψεν എന്നതിലെ മറച്ചുവെക്കൽഭാവം
  choice: ‘ഒളിപ്പിച്ചുവെച്ചു’ എന്ന അക്ഷരാർഥം നിലനിർത്തി
  alternative: ‘കലർത്തി’ അല്ലെങ്കിൽ ‘കുഴച്ചുചേർത്തു’ എന്ന് വ്യാഖ്യാനാത്മകമായി നൽകുക
  rationale: രാജ്യത്തിന്റെ മറഞ്ഞ പ്രവർത്തനത്തെക്കുറിച്ചുള്ള സാധ്യതയുള്ള സൂചന നഷ്ടപ്പെടുത്താതെയും അതൊരു നിർബന്ധിത വ്യാഖ്യാനമായി പ്രഖ്യാപിക്കാതെയും മൂലഭാഷയിലെ ആശയസംഘർഷം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം ഉപയോഗിച്ചു. ‘സ്വർഗരാജ്യം’, ‘ഉപമ’, ‘പുളിമാവ്’ എന്നീ പരിചിതമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തിയപ്പോൾ, അളവിനും പാചകപ്രവർത്തിക്കും വേണ്ട വിശദീകരണം അടിക്കുറിപ്പുകളിൽ നൽകി. അവസാനത്തെ ‘വരെ’ ഘടന ഗ്രീക്ക് വാക്യത്തിന്റെ സംക്ഷിപ്തമായ പര്യവസാനം മലയാളത്തിലും സൂക്ഷിക്കുന്നു.
