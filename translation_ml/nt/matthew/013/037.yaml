  yaml_path: translation/nt/matthew/013/037.yaml
  text: He answered[a], “The one who sows the good seed is the Son of Man.”
translation:
  language: ml
  text: 'അവൻ ഉത്തരം പറഞ്ഞു: “നല്ല വിത്ത് വിതയ്ക്കുന്നവൻ മനുഷ്യപുത്രനാണ്.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “മനുഷ്യനായവൻ.” “മനുഷ്യപുത്രൻ” എന്ന ഗ്രീക്ക് പദവി ദാനിയേൽ 7-നെ പ്രതിധ്വനിപ്പിക്കുന്നു; സുവിശേഷങ്ങളിലെ സ്ഥാപിതമായ ഉപയോഗവും ദൈവശാസ്ത്രപരമായ ധ്വനിയും നിലനിർത്തുന്നതിനാണ് ഇവിടെ ഈ രൂപം ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: അവൻ ഉത്തരം പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ പങ്കാളിക്രിയയും മുഖ്യക്രിയയും ചേർന്ന വാക്യപ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘ഉത്തരം പറഞ്ഞു’ എന്നു നൽകി; പ്രതികരണത്തിന്റെ ആശയം നിലനിർത്തുന്നു.
- source_word: Ὁ σπείρων
  choice: വിതയ്ക്കുന്നവൻ
  rationale: നാമവാചകമായി പ്രവർത്തിക്കുന്ന വർത്തമാനകാല പങ്കാളിക്രിയയെ പ്രവൃത്തിയിലൂടെ ആളെ തിരിച്ചറിയിക്കുന്ന സ്വാഭാവിക മലയാളരൂപത്തിൽ നൽകി.
- source_word: τὸ καλὸν σπέρμα
  choice: നല്ല വിത്ത്
  rationale: καλός ഇവിടെ ഗുണപരമായി നല്ലത്/യോഗ്യമായത് എന്ന അർഥത്തിലാണ്; σπέρμα ഗ്രീക്കിലേതുപോലെ ഏകവചന സമാഹാരാർഥത്തിൽ നിലനിർത്തി.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: സുവിശേഷങ്ങളിൽ യേശു ഉപയോഗിക്കുന്ന സ്ഥിരമായ പദവിയും ദാനിയേൽ 7-ലെ പ്രതിധ്വനിയും സംരക്ഷിക്കുന്ന സ്ഥാപിത മലയാളപ്രയോഗമാണിത്.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου എന്ന ക്രിസ്തുശാസ്ത്രപരമായ പദവിയുടെ പരിഭാഷ
  choice: മനുഷ്യപുത്രൻ
  alternative: മാനവപുത്രൻ / മനുഷ്യനായവൻ
  rationale: ഇത് വെറും ഒരു മനുഷ്യനെ സൂചിപ്പിക്കുന്ന പൊതുപ്രയോഗമല്ല; ദാനിയേൽ 7-ന്റെ പശ്ചാത്തലമുള്ള സുവിശേഷപരമായ പദവിയാണ്. ‘മനുഷ്യപുത്രൻ’ അതിന്റെ തിരുവെഴുത്തുപരവും ദൈവശാസ്ത്രപരവുമായ പ്രതിധ്വനി വ്യാഖ്യാനത്തിലൂടെ ചുരുക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ ആവർത്തനസ്വഭാവമുള്ള ‘ഉത്തരം പറഞ്ഞ് പറഞ്ഞു’ എന്ന ഘടന സ്വാഭാവിക മലയാളത്തിനായി ‘ഉത്തരം പറഞ്ഞു’ എന്നു ചുരുക്കി; സ്ഥാപിതമായ ക്രിസ്തുശാസ്ത്രപദവി നിലനിർത്തി.
