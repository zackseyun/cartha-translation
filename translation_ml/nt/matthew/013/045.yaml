id: MAT.13.45
reference: Matthew 13:45
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Πάλιν ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν ⸀ἀνθρώπῳ ἐμπόρῳ ζητοῦντι καλοὺς μαργαρίτας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/045.yaml
  text: Again[a], the kingdom of heaven is like a merchant seeking fine pearls.
translation:
  language: ml
  text: വീണ്ടും, സ്വർഗരാജ്യം നല്ല മുത്തുകൾ തേടുന്ന ഒരു വ്യാപാരിയെപ്പോലെയാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘സ്വർഗരാജ്യം നല്ല മുത്തുകൾ തേടുന്ന ഒരു മനുഷ്യനായ വ്യാപാരിയോട് സദൃശമാണ്.’'
    reason: ἀνθρώπῳ ἐμπόρῳ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിൽ പൊതുവായ ‘മനുഷ്യൻ’ എന്ന പദവും ‘വ്യാപാരി’ എന്ന വ്യക്തമായ തിരിച്ചറിയലും ഉണ്ട്. മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായ ‘ഒരു വ്യാപാരിയെപ്പോലെ’ എന്ന രൂപം നിലനിർത്തുന്നു.
lexical_decisions:
- source_word: Πάλιν
  choice: വീണ്ടും
  rationale: രാജ്യത്തെക്കുറിച്ചുള്ള ഉപമകളുടെ നിരയിൽ മറ്റൊരു താരതമ്യം അവതരിപ്പിക്കുന്നതും വാക്യത്തിന്റെ പ്രവാഹം നിലനിർത്തുന്നതുമായ സ്വാഭാവിക പ്രയോഗം.
- source_word: ὁμοία ἐστὶν
  choice: പോലെയാണ്
  rationale: ഉപമാപരമായ താരതമ്യം ലളിതവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: സ്വർഗരാജ്യം
  rationale: മത്തായിയുടെ സവിശേഷമായ പ്രയോഗത്തിന് മലയാളത്തിൽ സ്ഥാപിതവും സ്വാഭാവികവുമായ തത്തുല്യം; ബഹുവചനരൂപമായ ‘സ്വർഗങ്ങളുടെ രാജ്യം’ എന്ന അക്ഷരാർഥ വിവർത്തനത്തെക്കാൾ വായനാസൗകര്യമുണ്ട്.
- source_word: ἀνθρώπῳ ἐμπόρῳ
  choice: ഒരു വ്യാപാരിയെ
  rationale: ἔμπορος വ്യക്തിയെ വ്യാപാരിയായി തിരിച്ചറിയുന്നതിനാൽ ἄνθρωπος പ്രത്യേകം ‘മനുഷ്യൻ’ എന്നു ആവർത്തിക്കാതെ ഗ്രീക്ക് ദത്തിവിഭക്തി സൂചിപ്പിക്കുന്ന താരതമ്യം ‘വ്യാപാരിയെപ്പോലെ’ എന്നു സ്വാഭാവികമായി നൽകി.
- source_word: ζητοῦντι
  choice: തേടുന്ന
  rationale: വ്യാപാരിയുടെ തുടരുന്ന പ്രവർത്തിയെ സൂചിപ്പിക്കുന്ന വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: καλοὺς μαργαρίτας
  choice: നല്ല മുത്തുകൾ
  rationale: καλός ഇവിടെ വെറും കാഴ്ചഭംഗിയേക്കാൾ ഗുണമേന്മയെയും ശ്രേഷ്ഠതയെയും സൂചിപ്പിക്കുന്നു; ‘നല്ല മുത്തുകൾ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമാണ്.
theological_decisions:
- issue: ഉപമാസൂത്രത്തിൽ താരതമ്യത്തിന്റെ വ്യാപ്തി
  choice: രാജ്യം നേരിട്ട് വ്യാപാരിയോട് താരതമ്യം ചെയ്യുന്നതായി വാക്യം നിലനിർത്തി.
  alternative: നല്ല മുത്തുകൾ തേടുന്ന ഒരു വ്യാപാരി ഉൾപ്പെടുന്ന മുഴുവൻ സാഹചര്യത്തോടാണ് രാജ്യം താരതമ്യം ചെയ്യുന്നതെന്ന വിപുലമായ വായന.
  rationale: ὁμοία ἐστὶν ... ἀνθρώπῳ ἐμπόρῳ എന്ന ഗ്രീക്ക് ഘടനയിൽ ഉടനെയുള്ള താരതമ്യബിന്ദു വ്യാപാരിയാണ്. എന്നാൽ ഉപമയുടെ വിശാലമായ സാഹചര്യം അടുത്ത വാക്യത്തിൽ വികസിക്കുന്നതിനാൽ ഇവിടെ അതിനെ വ്യാഖ്യാനിച്ച് തീർപ്പാക്കിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘സ്വർഗരാജ്യം’, ‘വ്യാപാരി’, ‘മുത്തുകൾ’ എന്നീ പരിചിത പദങ്ങൾ ഉപയോഗിച്ചു; അക്ഷരാർഥ ഘടനയുടെ അധിക വിശദാംശം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
