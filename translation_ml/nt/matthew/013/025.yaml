id: MAT.13.25
reference: Matthew 13:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν δὲ τῷ καθεύδειν τοὺς ἀνθρώπους ἦλθεν αὐτοῦ ὁ ἐχθρὸς καὶ ⸀ἐπέσπειρεν ζιζάνια ἀνὰ μέσον τοῦ σίτου καὶ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/025.yaml
  text: But while the men were sleeping, his enemy came and sowed weeds among the wheat and went away.
translation:
  language: ml
  text: എന്നാൽ ആളുകൾ ഉറങ്ങിക്കൊണ്ടിരിക്കുമ്പോൾ, അവന്റെ ശത്രു വന്ന് ഗോതമ്പിന്റെ ഇടയിൽ കള വിതച്ച് പോയി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοὺς ἀνθρώπους
  choice: ആളുകൾ
  rationale: സന്ദർഭത്തിൽ വയലുമായി ബന്ധപ്പെട്ട ആളുകളെ സൂചിപ്പിക്കുന്നു; ഗ്രീക്ക് ബഹുവചനം ഇവിടെ നിർബന്ധമായും പുരുഷന്മാരെ മാത്രം ഉദ്ദേശിക്കുന്നില്ല. അതിനാൽ സ്വാഭാവികവും ഉൾക്കൊള്ളുന്നതുമായ പൊതുപദം ഉപയോഗിച്ചു.
- source_word: ἐπέσπειρεν
  choice: വിതച്ചു
  rationale: നിലവിലുള്ള ഗോതമ്പുവിളയുടെ ഇടയിൽ കൂടി വിത്തിട്ട പ്രവൃത്തിയാണ് സംയുക്തക്രിയ സൂചിപ്പിക്കുന്നത്; ‘ഇടയിൽ’ എന്ന തുടർന്നുള്ള പ്രയോഗം ഈ ഭാവം വ്യക്തമാക്കുന്നു.
- source_word: ζιζάνια
  choice: കള
  rationale: ഗോതമ്പിനിടയിൽ വളരുന്ന ദോഷകരമായ കളച്ചെടികളെ സൂചിപ്പിക്കുന്ന പദം. നിർദിഷ്ട സസ്യവർഗം ഉറപ്പിച്ച് പറയാതെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പദം തെരഞ്ഞെടുത്തു.
- source_word: ἀνὰ μέσον τοῦ σίτου
  choice: ഗോതമ്പിന്റെ ഇടയിൽ
  rationale: കളവിത്ത് ഗോതമ്പിനിടയിൽ വിതച്ചുവെന്ന സ്ഥലബന്ധം ലളിതമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. മൂലവാക്യത്തിന്റെ ക്രമവും ഉപമയിലെ ദൃശ്യവിവരവും നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ വാക്യഘടന ഉപയോഗിച്ചു.
