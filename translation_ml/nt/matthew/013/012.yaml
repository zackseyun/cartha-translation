id: MAT.13.12
reference: Matthew 13:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅστις γὰρ ἔχει, δοθήσεται αὐτῷ καὶ περισσευθήσεται· ὅστις δὲ οὐκ ἔχει, καὶ ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/012.yaml
  text: For whoever has[a], more will be given to him, and he will have an abundance; but whoever does not have[b], even what he has will be taken from him.
translation:
  language: ml
  text: കാരണം, ഉള്ളവന് നൽകപ്പെടും; അവന് സമൃദ്ധിയുമുണ്ടാകും.[a] എന്നാൽ ഇല്ലാത്തവനിൽനിന്ന് അവനുള്ളതുപോലും എടുത്തുകളയപ്പെടും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ഒരാൾക്ക് എന്താണ് ‘ഉള്ളത്’ എന്നോ എന്താണ് ‘നൽകപ്പെടുക’ എന്നോ വ്യക്തമാക്കിയിട്ടില്ല.
    reason: preserved_ambiguity
  - marker: b
    text: ഗ്രീക്ക് ഇവിടെ പുല്ലിംഗ ഏകവചനരൂപങ്ങൾ പൊതുവായ പ്രതിനിധാനാർഥത്തിൽ ഉപയോഗിക്കുന്നു; പ്രസ്താവന സ്ത്രീപുരുഷഭേദമില്ലാതെ എല്ലാവർക്കും ബാധകമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: ὅστις
  choice: ഉള്ളവൻ / ഇല്ലാത്തവൻ
  rationale: അനിശ്ചിത സാപേക്ഷ സർവനാമം ഒരു പൊതുതത്ത്വം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ ഈ പങ്കാളിത്തരൂപങ്ങൾ സ്വാഭാവികവും വിതരണാത്മകവുമായ അർഥം നൽകുന്നു.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തെ വിശദീകരിക്കുന്ന ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἔχει / οὐκ ἔχει
  choice: ഉള്ളവൻ / ഇല്ലാത്തവൻ
  rationale: ഗ്രീക്കിലുള്ള കൈവശമുണ്ടാകുക എന്ന ലളിതമായ ആശയം നൽകുകയും അതിന്റെ അവ്യക്തമായ കർമം പൂരിപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: δοθήσεται αὐτῷ
  choice: ഉള്ളവന് നൽകപ്പെടും
  rationale: ഭാവികാല കർമണിപ്രയോഗവും ദാതൃവിഭക്തിയുടെ അർഥവും നേരിട്ട് നിലനിർത്തുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘കൂടുതൽ’ എന്ന പദം പ്രധാനവാചകത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: περισσευθήσεται
  choice: അവന് സമൃദ്ധിയുണ്ടാകുകയും ചെയ്യും
  rationale: ഫലമായി സമൃദ്ധി കൈവരിക്കുന്നതിനെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: രണ്ടു വിഭാഗങ്ങൾ തമ്മിലുള്ള വ്യക്തമായ വൈരുധ്യം സൂചിപ്പിക്കുന്നു.
- source_word: καὶ ὃ ἔχει
  choice: അവനുള്ളതുപോലും
  rationale: καί എന്നതിന്റെ ഊന്നൽസൂചകമായ ‘പോലും’ എന്ന അർഥവും സാപേക്ഷപ്രയോഗവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: അവനിൽനിന്ന് ... എടുത്തുകളയപ്പെടും
  rationale: αἴρω എന്ന ക്രിയയുടെ നീക്കംചെയ്യൽ അർഥവും ഭാവികാല കർമണിപ്രയോഗവും വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: ‘ഉണ്ട്’, ‘നൽകപ്പെടും’ എന്നീ ക്രിയകളുടെ അവ്യക്തമായ കർമം
  choice: കർമം പ്രധാനവാചകത്തിൽ വ്യക്തമാക്കാതെ വിട്ടു.
  alternative: അറിവ്, ഗ്രഹണം, സ്വീകരണശേഷി, അല്ലെങ്കിൽ രാജ്യരഹസ്യങ്ങളെക്കുറിച്ചുള്ള ഉൾക്കാഴ്ച എന്നു വ്യക്തമാക്കുക.
  rationale: സന്ദർഭം യേശുവിന്റെ ഉപദേശത്തോടുള്ള സ്വീകരണവുമായി ബന്ധപ്പെട്ടിരുന്നാലും, ഗ്രീക്ക് വാചകം കർമം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ അതിന്റെ വിശാലതയും ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും സംരക്ഷിച്ചു.
- issue: പ്രതിനിധാനപരമായ പുല്ലിംഗ ഏകവചനം
  choice: ‘ഉള്ളവൻ’, ‘അവന്’, ‘അവനിൽനിന്ന്’ എന്നീ ഏകവചന പുല്ലിംഗരൂപങ്ങൾ നിലനിർത്തി.
  alternative: ബഹുവചനമോ ലിംഗനിരപേക്ഷമായ പുനർവാക്യവത്കരണമോ ഉപയോഗിക്കുക.
  rationale: മൂലത്തിലെ പുല്ലിംഗ ഏകവചന രൂപത്തോട് വ്യാകരണപരമായി ചേർന്നുനിൽക്കുമ്പോഴും, ഇത് എല്ലാ ആളുകൾക്കും ബാധകമായ പൊതുപ്രസ്താവനയാണെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ സമാന്തരഘടന, കർമണിപ്രയോഗം, ഊന്നൽ, അവ്യക്തമായ കർമം എന്നിവ സംരക്ഷിച്ചു; മലയാളത്തിലെ സ്വാഭാവിക വായനയ്ക്കായി പങ്കാളിത്തരൂപങ്ങൾ ഉപയോഗിച്ചു.
