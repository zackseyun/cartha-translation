  language: en
  yaml_path: translation/nt/matthew/013/003.yaml
  text: 'And he spoke many things to them in parables, saying: “Look, the sower went out to sow.”'
translation:
  language: ml
  text: 'അവൻ അവരോട് ഉപമകളിലൂടെ പല കാര്യങ്ങളും പറഞ്ഞു: “നോക്കൂ, വിതയ്ക്കുന്നവൻ വിതയ്ക്കാൻ പുറപ്പെട്ടു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν παραβολαῖς
  choice: ഉപമകളിലൂടെ
  rationale: ആശയം ഉപമകളുടെ മാധ്യമത്തിലൂടെയാണ് അറിയിച്ചതെന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: Ἰδοὺ
  choice: നോക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ആജ്ഞാരൂപത്തിന്റെ സജീവത ആധുനിക സാധാരണ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὁ σπείρων
  choice: വിതയ്ക്കുന്നവൻ
  rationale: പദത്തിന്റെ പ്രവർത്തകസ്വഭാവം നിലനിർത്തുന്ന, അനാവശ്യമായി തൊഴിൽപരമായ അർഥം ചേർക്കാത്ത രൂപം.
- source_word: τοῦ σπείρειν
  choice: വിതയ്ക്കാൻ
  rationale: പുറപ്പെട്ടതിന്റെ ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് infinitive construction സംക്ഷിപ്തമായി നൽകുന്നു.
