revisions:
- from: എന്നാൽ മറ്റുള്ളവ നല്ല മണ്ണിൽ വീണു ഫലം കൊടുത്തുകൊണ്ടിരുന്നു—ഒന്ന് നൂറുമടങ്ങ്, മറ്റൊന്ന് അറുപതുമടങ്ങ്, വേറൊന്ന് മുപ്പതുമടങ്ങ്.
  to: എന്നാൽ മറ്റു വിത്തുകൾ നല്ല മണ്ണിൽ വീണു ഫലം കൊടുത്തുകൊണ്ടിരുന്നു—ചിലത് നൂറുമടങ്ങ്, ചിലത് അറുപതുമടങ്ങ്, ചിലത് മുപ്പതുമടങ്ങ്.
  rationale: The revision explicitly identifies the referent of ἄλλα as seed and uses a natural Malayalam distributive sequence. It retains ‘വീണു’ for ἔπεσεν, the ongoing fruit-bearing sense of ἐδίδου, and the implied multiplicative sense for all three yield figures.
