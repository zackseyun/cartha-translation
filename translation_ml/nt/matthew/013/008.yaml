id: MAT.13.8
reference: Matthew 13:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἄλλα δὲ ἔπεσεν ἐπὶ τὴν γῆν τὴν καλὴν καὶ ἐδίδου καρπόν, ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/008.yaml
  text: But other seed fell on the good soil and was producing fruit—one a hundredfold, another sixty, and another thirty.
translation:
  language: ml
  text: എന്നാൽ മറ്റു വിത്തുകൾ നല്ല മണ്ണിൽ വീണു ഫലം കൊടുത്തുകൊണ്ടിരുന്നു—ചിലത് നൂറുമടങ്ങ്, ചിലത് അറുപതുമടങ്ങ്, ചിലത് മുപ്പതുമടങ്ങ്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλα
  choice: മറ്റുള്ളവ
  rationale: നപുംസക ബഹുവചന വിശേഷണം നാമമായി ഉപയോഗിച്ചിരിക്കുന്നു; മുൻസന്ദർഭത്തിലെ വിത്തുകളെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ‘മറ്റുള്ളവ’ എന്നു പറയുമ്പോൾ ആ ബന്ധം സ്വാഭാവികമായി നിലനിൽക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻപ് പറഞ്ഞ ഫലംകാണാത്ത നിലകളോടുള്ള വൈരുധ്യം വ്യക്തമാക്കുന്നു.
- source_word: ἔπεσεν
  choice: വീണു
  rationale: ഗ്രീക്കിലെ ക്രിയയുടെ നേരിട്ടുള്ള ദൃശ്യരൂപം നിലനിർത്തുന്നു; ‘വിതയ്ക്കപ്പെട്ടു’ എന്ന് വ്യാഖ്യാനിച്ചിട്ടില്ല.
- source_word: ἐπὶ τὴν γῆν τὴν καλὴν
  choice: നല്ല മണ്ണിൽ
  rationale: കൃഷിസന്ദർഭത്തിൽ γῆയ്ക്ക് സ്വാഭാവികവും കൃത്യവുമായ മലയാളം ‘മണ്ണ്’ ആണ്; καλὴν ഫലഭൂയിഷ്ഠവും അനുയോജ്യവുമായ നിലത്തെ സൂചിപ്പിക്കുന്ന ‘നല്ല’ എന്നായി നൽകിയിരിക്കുന്നു.
- source_word: ἐδίδου καρπόν
  choice: ഫലം കൊടുത്തുകൊണ്ടിരുന്നു
  rationale: അപൂർണ്ണഭൂതകാലരൂപത്തിന്റെ തുടർച്ചയായ പ്രവർത്തനം ‘കൊടുത്തുകൊണ്ടിരുന്നു’ പ്രകടമാക്കുന്നു; καρπόν എന്ന ദൃശ്യരൂപം ‘ഫലം’ എന്നു നിലനിർത്തുന്നു.
- source_word: ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα
  choice: ഒന്ന് നൂറുമടങ്ങ്, മറ്റൊന്ന് അറുപതുമടങ്ങ്, വേറൊന്ന് മുപ്പതുമടങ്ങ്
  rationale: വ്യത്യസ്ത വിളവുകളെ വേർതിരിക്കുന്ന ഗ്രീക്ക് വിതരണഘടന ‘ഒന്ന്… മറ്റൊന്ന്… വേറൊന്ന്’ എന്ന രൂപത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു. മലയാളത്തിൽ അർഥം വ്യക്തമാകാൻ ഓരോ സംഖ്യയോടും ‘മടങ്ങ്’ ചേർത്തിരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. വിത്ത് എന്ന നാമം വാക്യത്തിൽ ആവർത്തിക്കാതെ ഗ്രീക്കിലെ substantival plural ‘മറ്റുള്ളവ’ എന്നായി സൂക്ഷിച്ചു; മുൻസന്ദർഭം അതിന്റെ സൂചന വ്യക്തമാക്കുന്നു.
