id: MAT.13.21
reference: Matthew 13:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐκ ἔχει δὲ ῥίζαν ἐν ἑαυτῷ ἀλλὰ πρόσκαιρός ἐστιν, γενομένης δὲ θλίψεως ἢ διωγμοῦ διὰ τὸν λόγον εὐθὺς σκανδαλίζεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/021.yaml
  text: Yet he has no root in himself[a], but is temporary. When affliction or persecution arises because of the word[b], he immediately falls away.
translation:
  language: ml
  text: എന്നാൽ അവനിൽത്തന്നെ വേരില്ല; അവൻ കുറച്ചുകാലം മാത്രം നിലനിൽക്കുന്നവനാണ്. വചനം നിമിത്തം കഷ്ടതയോ പീഡനമോ ഉണ്ടാകുമ്പോൾ അവൻ ഉടനെ ഇടറിപ്പോകുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇടറുന്നു” അല്ലെങ്കിൽ “വിരോധം തോന്നുന്നു.” ഗ്രീക്ക് ക്രിയയ്ക്ക് ഇടറുക, വീഴുക, അല്ലെങ്കിൽ വിരോധം തോന്നുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζαν
  choice: വേര്
  rationale: വിത്തുവിതയ്ക്കുന്നവന്റെ ഉപമയിലെ കാർഷിക രൂപകം അതേപടി നിലനിർത്തുന്നു.
- source_word: ἐν ἑαυτῷ
  choice: അവനിൽത്തന്നെ
  rationale: പ്രത്യാവർത്തക പ്രയോഗത്തിന്റെ ഊന്നലും ആന്തരികമായ അർഥവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: πρόσκαιρός
  choice: കുറച്ചുകാലം മാത്രം നിലനിൽക്കുന്നവൻ
  rationale: താൽക്കാലികത മാത്രമല്ല, സമ്മർദത്തിനിടയിൽ നിലനിൽക്കാത്ത അവസ്ഥയും സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കുന്നു.
- source_word: θλίψεως
  choice: കഷ്ടത
  rationale: സമ്മർദം, ദുരിതം എന്നീ അർഥങ്ങൾ ഉൾക്കൊള്ളുന്ന, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ആധുനിക പദമാണ്.
- source_word: διωγμοῦ
  choice: പീഡനം
  rationale: സന്ദേശത്തോടുള്ള ബന്ധം നിമിത്തമുള്ള ശത്രുതാപരമായ ഉപദ്രവത്തെ കൃത്യമായി സൂചിപ്പിക്കുന്നു.
- source_word: διὰ τὸν λόγον
  choice: വചനം നിമിത്തം
  rationale: λόγος എന്ന പദത്തോടുള്ള ബന്ധം നിലനിർത്തുകയും ഉപമയിൽ പ്രസംഗിക്കപ്പെട്ട സന്ദേശത്തെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് സ്വാഭാവികമായി അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: εὐθὺς
  choice: ഉടനെ
  rationale: പ്രതികരണം എത്ര പെട്ടെന്നാണെന്ന ഊന്നൽ ലളിതമായി പകർന്നുനൽകുന്നു.
- source_word: σκανδαλίζεται
  choice: ഇടറിപ്പോകുന്നു
  rationale: ഇടർച്ചയ്ക്ക് കാരണമാകുക, വീണുപോകുക, വിട്ടുമാറുക എന്നിവ ഉൾക്കൊള്ളാവുന്ന ഗ്രീക്ക് പദത്തിന്റെ രൂപകവും അർഥവ്യാപ്തിയും അനാവശ്യമായി ചുരുക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ശിഷ്യത്വത്തിന്റെ സന്ദർഭത്തിൽ σκανδαλίζεται എന്നതിന്റെ അർഥം
  choice: ഇടറിപ്പോകുന്നു
  alternative: വിട്ടുമാറുന്നു; വിരോധം തോന്നുന്നു
  rationale: സമ്മർദം വന്നപ്പോൾ ആദ്യത്തെ സ്വീകരണം തകരുന്നതാണ് സന്ദർഭം. ‘ഇടറിപ്പോകുന്നു’ എന്നത് ഫലം വ്യക്തമാക്കുമ്പോഴും വിശ്വാസത്യാഗത്തെക്കുറിച്ചുള്ള ഒരു സമ്പൂർണ സിദ്ധാന്തം വാക്യത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല; പദത്തിന്റെ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. കാർഷിക രൂപകവും ‘വചനം’ എന്ന സുവിശേഷപരമായ പദബന്ധവും സംരക്ഷിച്ചിരിക്കുന്നു. ഗ്രീക്കിലെ നീണ്ട വാക്യഘടന വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കിയെങ്കിലും ആശയബന്ധം മാറ്റിയിട്ടില്ല.
