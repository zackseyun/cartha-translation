id: MAT.13.11
reference: Matthew 13:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν ⸀αὐτοῖς· Ὅτι ὑμῖν δέδοται γνῶναι τὰ μυστήρια τῆς βασιλείας τῶν οὐρανῶν, ἐκείνοις δὲ οὐ δέδοται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/011.yaml
  text: He answered them[a], “To you it has been given to know the mysteries of the kingdom of heaven[b], but to them it has not been given.”
translation:
  language: ml
  text: 'അവൻ അവരോടു മറുപടി പറഞ്ഞു: “സ്വർഗരാജ്യത്തിന്റെ മർമ്മങ്ങൾ[a] അറിയാൻ നിങ്ങൾക്കു നൽകപ്പെട്ടിരിക്കുന്നു; എന്നാൽ അവർക്കു നൽകപ്പെട്ടിട്ടില്ല.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “രഹസ്യങ്ങൾ.”
    reason: lexical_alternative
  - marker: b
    text: “നൽകപ്പെട്ടിരിക്കുന്നു” എന്ന നിഷ്ക്രിയപ്രയോഗം ദാതാവിനെ വ്യക്തമാക്കുന്നില്ല; ഈ അറിവ് ദൈവം നൽകുന്നതാണെന്നാണ് സന്ദർഭത്തിലെ സൂചന.
    reason: theological_clarification
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: മറുപടി പറഞ്ഞു
  rationale: പങ്കാളിക്രിയയും മുഖ്യക്രിയയും ചേർന്ന ഈ ഗ്രീക്ക് പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ ‘മറുപടി പറഞ്ഞു’ എന്നു നൽകുന്നത് അർഥം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: ὑμῖν δέδοται
  choice: നിങ്ങൾക്കു നൽകപ്പെട്ടിരിക്കുന്നു
  rationale: സമ്പൂർണ നിഷ്ക്രിയരൂപം മുൻപ് ലഭിച്ച ദാനത്തിന്റെ ഇപ്പോഴുള്ള ഫലം സൂചിപ്പിക്കുന്നു; ദാതാവിനെ വ്യക്തമാക്കാതെ മൂലപാഠത്തിന്റെ നിഷ്ക്രിയഘടന സംരക്ഷിക്കുന്നു.
- source_word: γνῶναι
  choice: അറിയാൻ
  rationale: γινώσκω എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘അറിയുക’ നിലനിർത്തുന്നു; ‘മനസ്സിലാക്കുക’ എന്ന വ്യാഖ്യാനപരമായ വിപുലീകരണം ഒഴിവാക്കുന്നു.
- source_word: τὰ μυστήρια
  choice: മർമ്മങ്ങൾ
  rationale: മുമ്പ് മറഞ്ഞിരുന്നതും ഇപ്പോൾ വെളിപ്പെടുത്തപ്പെടുന്നതുമായ ദൈവിക സത്യങ്ങൾ എന്ന ആശയം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: τῆς βασιλείας τῶν οὐρανῶν
  choice: സ്വർഗരാജ്യത്തിന്റെ
  rationale: മത്തായിയുടെ സ്ഥിരപ്രയോഗം മലയാളത്തിലെ പരിചിതവും അർഥസമ്പന്നവുമായ സംയുക്തപദത്തിലൂടെ അവതരിപ്പിക്കുന്നു.
- source_word: ἐκείνοις δὲ οὐ δέδοται
  choice: എന്നാൽ അവർക്കു നൽകപ്പെട്ടിട്ടില്ല
  rationale: ശിഷ്യന്മാരും മറുവിഭാഗവും തമ്മിലുള്ള വിരോധം സ്വാഭാവികമായി നിലനിർത്തുകയും ആദ്യ നിഷ്ക്രിയപ്രയോഗത്തോടുള്ള സമാന്തരത സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: നിഷ്ക്രിയപ്രയോഗത്തിൽ സൂചിതമായ ദൈവിക ദാതാവ്
  choice: ദാതാവിനെ പേരെടുത്തുപറയാതെ ‘നൽകപ്പെട്ടിരിക്കുന്നു’ എന്നു നിലനിർത്തുക
  alternative: ‘ദൈവം നിങ്ങൾക്കു നൽകിയിരിക്കുന്നു’
  rationale: ദാതാവ് ദൈവമാണെന്ന ആശയം സന്ദർഭത്തിൽ സൂചിതമായിരിക്കാമെങ്കിലും ഗ്രീക്ക് മൂലപാഠം അവനെ വ്യക്തമാക്കുന്നില്ല; അതിനാൽ ദൈവശാസ്ത്രപരമായ സൂക്ഷ്മതയും മൂലപാഠത്തിന്റെ രൂപവും സംരക്ഷിക്കുന്നു.
- issue: μυστήρια എന്ന പദത്തിന്റെ രാജ്യസന്ദർഭത്തിലെ അർഥം
  choice: മർമ്മങ്ങൾ
  alternative: രഹസ്യങ്ങൾ
  rationale: ‘മർമ്മങ്ങൾ’ എന്നത് വെളിപ്പെടുത്തപ്പെട്ട ദൈവിക സത്യങ്ങളുടെ ആശയം സൂക്ഷിക്കുന്നു; സാധാരണ രഹസ്യവിവരം എന്ന നിലയിലേക്ക് അർഥം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ വിരോധഘടനയും ദാതാവിനെ വ്യക്തമാക്കാത്ത നിഷ്ക്രിയപ്രയോഗവും സംരക്ഷിച്ചിട്ടുണ്ട്; എല്ലാ അടിക്കുറിപ്പുകുറികളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
