id: MAT.13.53
reference: Matthew 13:53
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς τὰς παραβολὰς ταύτας, μετῆρεν ἐκεῖθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/053.yaml
  text: And when Jesus had finished these parables[a], he departed from there.
translation:
  language: ml
  text: യേശു ഈ ഉപമകൾ പറഞ്ഞുതീർത്തപ്പോൾ[a] അവിടെനിന്നു പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “യേശു ഈ ഉപമകൾ പൂർത്തിയാക്കിയപ്പോൾ സംഭവിച്ചതെന്തെന്നാൽ, അവിടെനിന്നു പോയി.”'
    reason: καὶ ἐγένετο ὅτε എന്ന ഗ്രീക്ക് ആഖ്യാനപ്രയോഗത്തിന്റെ കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള രൂപം കാണിക്കുന്നു.
lexical_decisions:
- source_word: καὶ ἐγένετο ὅτε
  choice: …പ്പോൾ
  rationale: ഈ ഗ്രീക്ക് പ്രയോഗം ഇവിടെ കഥയുടെ സമയബന്ധമുള്ള മാറ്റത്തെ സൂചിപ്പിക്കുന്നു. അക്ഷരാർഥത്തിലുള്ള ‘സംഭവിച്ചു’ ചേർക്കാതെ ‘…പ്പോൾ’ എന്നു പറയുന്നത് ആ ബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐτέλεσεν
  choice: പറഞ്ഞുതീർത്തു
  rationale: τελέω എന്നത് പൂർത്തിയാക്കുക, അവസാനിപ്പിക്കുക എന്നർഥം നൽകുന്നു. ഉപമകൾ സംസാരിച്ചുകൊണ്ടിരുന്ന സന്ദർഭമായതിനാൽ ‘പറഞ്ഞുതീർത്തു’ എന്നത് പ്രവർത്തിയും പൂർത്തീകരണവും വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: τὰς παραβολὰς ταύτας
  choice: ഈ ഉപമകൾ
  rationale: παραβολήയ്ക്ക് സുവിശേഷങ്ങളിലെ സ്ഥിരമായ മലയാള പദം ‘ഉപമ’ ആണ്; ταύτας തൊട്ടുമുമ്പ് പറഞ്ഞ ഉപമകളിലേക്കു വിരൽചൂണ്ടുന്നതിനാൽ ‘ഈ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: μετῆρεν
  choice: പോയി
  rationale: μεταίρω ഇവിടെ ഒരു സ്ഥലത്തുനിന്ന് നീങ്ങിപ്പോകുക എന്നർഥത്തിലാണ്. ആധുനിക മലയാളത്തിൽ ‘പോയി’ സ്വാഭാവികവും സന്ദർഭത്തിന് മതിയായതുമാണ്.
- source_word: ἐκεῖθεν
  choice: അവിടെനിന്നു
  rationale: സ്ഥലത്തിൽനിന്നുള്ള പുറപ്പെടലിനെ സൂചിപ്പിക്കുന്ന ἐκεῖθεν എന്ന ക്രിയാവിശേഷണത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപമാണിത്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഗ്രീക്കിലെ ആഖ്യാനസൂത്രം പ്രധാനവാക്യത്തിൽ സ്വാഭാവികമായ സമയബന്ധമായി നൽകിയിരിക്കുന്നു; കൂടുതൽ അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
