id: MAT.13.43
reference: Matthew 13:43
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τότε οἱ δίκαιοι ἐκλάμψουσιν ὡς ὁ ἥλιος ἐν τῇ βασιλείᾳ τοῦ πατρὸς αὐτῶν. ὁ ἔχων ⸀ὦτα ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/043.yaml
  text: Then the righteous will shine like the sun in the kingdom of their Father. The one who has ears, let him hear.
translation:
  language: ml
  text: അപ്പോൾ നീതിമാന്മാർ തങ്ങളുടെ പിതാവിന്റെ രാജ്യത്തിൽ സൂര്യനെപ്പോലെ പ്രകാശിക്കും.[a] ചെവികളുള്ളവൻ കേൾക്കട്ടെ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പ്രകാശിച്ചുയരും.’
    reason: ἐκλάμψουσιν എന്ന ക്രിയയിലെ ‘പുറത്തേക്കു/തെളിഞ്ഞു പ്രകാശിക്കുക’ എന്ന ഭാവം കൂടുതൽ പ്രകടമാക്കുന്ന പകരം വിവർത്തനം.
  - marker: b
    text: 'ഗ്രീക്കിൽ ഏകവചനത്തിലുള്ള പ്രതിനിധിപരമായ ആഹ്വാനം: ‘ചെവികളുള്ളവൻ കേൾക്കട്ടെ.’ അതായത്, ഓരോരുത്തനും ശ്രദ്ധിച്ച് ഗ്രഹിക്കട്ടെ.'
    reason: മൂലഭാഷയിലെ ഏകവചന ഘടനയും ‘കേൾക്കുക’ എന്നതിന്റെ ശ്രദ്ധിച്ചു ഗ്രഹിക്കാനുള്ള ആഹ്വാനഭാവവും വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: Τότε
  choice: അപ്പോൾ
  rationale: മുൻവിവരണത്തിൽ പറഞ്ഞ അന്ത്യകാലക്രമത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സംക്ഷിപ്തവുമായ സമയസൂചകം.
- source_word: οἱ δίκαιοι
  choice: നീതിമാന്മാർ
  rationale: നീതിയുള്ളവരെയും നീതിമാന്മാരായി കണക്കാക്കപ്പെടുന്നവരെയും സൂചിപ്പിക്കാവുന്ന, സഭാപാരമ്പര്യത്തിൽ പരിചിതവും ആധുനിക മലയാളത്തിൽ വ്യക്തവുമായ പദം.
- source_word: ἐκλάμψουσιν
  choice: പ്രകാശിക്കും
  rationale: ἐκλάμπω എന്നതിന്റെ ‘തിളങ്ങുക/പ്രകാശിച്ചുയരുക’ എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു; സൂര്യനോടുള്ള ഉപമ ദീപ്തി വ്യക്തമാക്കുന്നതിനാൽ മുഖ്യവാചകത്തിൽ അധികപദം ആവശ്യമില്ല.
- source_word: ὡς ὁ ἥλιος
  choice: സൂര്യനെപ്പോലെ
  rationale: ὡς അവതരിപ്പിക്കുന്ന ഉപമയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: ἐν τῇ βασιλείᾳ
  choice: രാജ്യത്തിൽ
  rationale: ഇവിടെ സ്ഥലം/മണ്ഡലം സൂചിപ്പിക്കുന്ന ഘടനയ്ക്ക് ‘രാജ്യത്തിൽ’ യോജിക്കുന്നു; βασιλείαയിലെ രാജഭരണത്തിന്റെ ആശയവും ഇതിലൂടെ നിഷേധിക്കപ്പെടുന്നില്ല.
- source_word: τοῦ πατρὸς αὐτῶν
  choice: തങ്ങളുടെ പിതാവിന്റെ
  rationale: αὐτῶν നീതിമാന്മാരിലേക്കു മടങ്ങിനിൽക്കുന്നതു മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘സ്വർഗീയ’ എന്ന വിശേഷണം ചേർക്കുന്നില്ല.
- source_word: ὁ ἔχων ὦτα
  choice: ചെവികളുള്ളവൻ
  rationale: ഗ്രീക്കിലെ ഏകവചന പ്രതിനിധിപരമായ പ്രയോഗം മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀκουέτω
  choice: കേൾക്കട്ടെ
  rationale: മൂന്നാംപുരുഷ ഏകവചന ആജ്ഞാരൂപത്തിന്റെ ശക്തി കാത്തുസൂക്ഷിക്കുന്നു; കേവലം ശബ്ദം ഗ്രഹിക്കുന്നതിലുപരി ശ്രദ്ധിച്ച് അനുസരിക്കണമെന്ന ആഹ്വാനവും സന്ദർഭത്തിൽ തുറന്നുവെക്കുന്നു.
theological_decisions:
- issue: അവസാന ആഹ്വാനത്തിലെ പ്രതിനിധിപരമായ ഏകവചനം
  choice: ‘ചെവികളുള്ളവൻ കേൾക്കട്ടെ’ എന്ന ഏകവചനരൂപം നിലനിർത്തുക
  alternative: ‘ചെവികളുള്ളവർ കേൾക്കട്ടെ’ എന്ന ബഹുവചനരൂപം
  rationale: ഗ്രീക്കിൽ പുരുഷലിംഗ ഏകവചന കർത്താവും ഏകവചന ആജ്ഞയും സർവസാധാരണമായ പ്രതിനിധിപരമായ അർഥത്തിൽ വരുന്നു. മലയാളത്തിലെ ‘-വൻ’ രൂപം ഈ ഏകവചന ഘടനയും ആഹ്വാനത്തിന്റെ ഔന്നത്യവും സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
- issue: βασιλεία എന്നതിന്റെ അർഥവ്യാപ്തി
  choice: ‘രാജ്യം’
  alternative: ‘ഭരണം’ അല്ലെങ്കിൽ ‘രാജവാഴ്ച’
  rationale: ‘തങ്ങളുടെ പിതാവിന്റെ രാജ്യത്തിൽ’ എന്ന സ്ഥലസൂചക ഘടനയ്ക്കും അന്ത്യകാല മണ്ഡലചിത്രത്തിനും ‘രാജ്യം’ ഏറ്റവും യോജിക്കുന്നു; ദൈവത്തിന്റെ രാജകീയ ഭരണത്തെ ഇതു നിഷേധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നീതിമാന്മാർ,’ ‘പിതാവ്,’ ‘രാജ്യം’ എന്നീ പരിചിതമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തിയപ്പോൾ വാക്യക്രമം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാക്കി. ‘തങ്ങളുടെ’ എന്നത് പിതാവുമായുള്ള ബന്ധം നീതിമാന്മാരിലേക്കു വ്യക്തമായി മടക്കിനിർത്തുന്നു.
