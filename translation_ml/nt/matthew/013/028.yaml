id: MAT.13.28
reference: Matthew 13:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ ἔφη αὐτοῖς· Ἐχθρὸς ἄνθρωπος τοῦτο ἐποίησεν. οἱ δὲ ⸂δοῦλοι αὐτῷ λέγουσιν⸃· Θέλεις οὖν ἀπελθόντες ⸀συλλέξωμεν αὐτά;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/028.yaml
  text: He said to them[a], “An enemy did this.” Then the slaves said to him, “Do you want us to go and gather them up?”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “ഒരു ശത്രുവാണ് ഇതു ചെയ്തത്.” അപ്പോൾ അടിമകൾ[a] അവനോടു ചോദിച്ചു: “ഞങ്ങൾ പോയി അവയെ കൂട്ടിയെടുക്കാൻ അങ്ങ് ആഗ്രഹിക്കുന്നുവോ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ദാസന്മാർ.” ഗ്രീക്കിലെ δοῦλοι എന്ന പദത്തിന് സന്ദർഭമനുസരിച്ച് “അടിമകൾ” എന്നോ “ദാസന്മാർ” എന്നോ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη
  choice: പറഞ്ഞു
  rationale: കഥനത്തിലെ സാധാരണ സംഭാഷണക്രിയയെ സ്വാഭാവികവും നേരിട്ടുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: Ἐχθρὸς ἄνθρωπος
  choice: ഒരു ശത്രു
  rationale: പദാനുപദമായി ‘ശത്രുവായ ഒരു മനുഷ്യൻ’ എന്നാകാമെങ്കിലും, ἄνθρωπος ഇവിടെ എതിരാളിയെ വ്യക്തിവൽക്കരിക്കുകയാണ്; ‘ഒരു ശത്രു’ എന്നത് അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τοῦτο ἐποίησεν
  choice: ഇതു ചെയ്തത്
  rationale: അയോറിസ്റ്റ് ക്രിയയുടെ പൂർത്തിയായ പ്രവൃത്തിയും τοῦτο എന്ന സൂചനാസർവനാമവും ലളിതമായ ഭൂതകാലപ്രയോഗത്തിൽ നിലനിർത്തുന്നു.
- source_word: δοῦλοι
  choice: അടിമകൾ
  rationale: ഭൂവുടമയോടു കീഴ്പ്പെട്ടിരിക്കുന്ന ഗൃഹാശ്രിതരുടെ സാമൂഹികനില ‘അടിമകൾ’ കൂടുതൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു; ‘ദാസന്മാർ’ എന്ന പരമ്പരാഗത പകരം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: Θέλεις
  choice: അങ്ങ് ആഗ്രഹിക്കുന്നത്
  rationale: θέλω സൂചിപ്പിക്കുന്ന ഇച്ഛയെ ആദരസൂചകവും സ്വാഭാവികവുമായ മലയാളചോദ്യഘടനയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: οὖν
  choice: അങ്ങനെയെങ്കിൽ
  rationale: മുൻപ്രസ്താവനയിൽനിന്നു വരുന്ന തുടർചോദ്യത്തിന്റെ അനുമാനാത്മക ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: ἀπελθόντες
  choice: ഞങ്ങൾ പോയി
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള ഗതിയും പ്രവർത്തനക്രമവും സ്വാഭാവികമായ മലയാള സംയുക്തക്രിയയിൽ നിലനിർത്തുന്നു.
- source_word: συλλέξωμεν
  choice: കൂട്ടിയെടുക്കണമെന്നാണോ
  rationale: കളകളെ ഒരുമിച്ചു ശേഖരിച്ച് നീക്കാനുള്ള നിർദേശത്തെ സൂചിപ്പിക്കുന്നു; അടുത്ത വാക്യത്തിൽ വ്യക്തമായി വരുന്ന ‘പറിച്ചെടുക്കുക’ എന്ന ആശയം ഇവിടെ മുൻകൂട്ടി ചേർക്കുന്നില്ല.
- source_word: αὐτά
  choice: അവയെ
  rationale: സന്ദർഭത്തിലെ ബഹുവചനമായ കളകളെയാണ് നപുംസക ബഹുവചന സർവനാമം സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: ഉപമയിലെ δοῦλοι എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: അടിമകൾ
  alternative: ദാസന്മാർ
  rationale: യജമാനനോടുള്ള നിയമപരവും സാമൂഹികവുമായ കീഴ്പ്പെടൽ മറച്ചുവയ്ക്കാതെ ‘അടിമകൾ’ എന്നു നൽകുന്നു. എന്നാൽ മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ പരിചിതമായ ‘ദാസന്മാർ’ എന്ന സാധ്യതയും അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ കഥനശൈലി സ്വീകരിച്ചു. യജമാനനോടുള്ള അഭിസംബോധനയിൽ ‘അങ്ങ്’ ഉപയോഗിച്ച് ബന്ധത്തിലെ ആദരം സ്വാഭാവികമായി സൂചിപ്പിച്ചു; ഗ്രീക്കിൽ ഇല്ലാത്ത അധിക പദവി ചേർത്തിട്ടില്ല.
