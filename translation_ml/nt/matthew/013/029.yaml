id: MAT.13.29
reference: Matthew 13:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δέ ⸀φησιν· Οὔ, μήποτε συλλέγοντες τὰ ζιζάνια ἐκριζώσητε ἅμα αὐτοῖς τὸν σῖτον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/029.yaml
  text: But he said[a], ‘No, lest while gathering the weeds you uproot the wheat along with them.’
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “വേണ്ടാ; കളകൾ[a] പറിച്ചുകൂട്ടുമ്പോൾ അവയോടൊപ്പം ഗോതമ്പും നിങ്ങൾ വേരോടെ പിഴുതുകളഞ്ഞേക്കാം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കള്ളഗോതമ്പ്”; കൂടുതൽ കൃത്യമായി, വളർച്ചയുടെ ആദ്യഘട്ടങ്ങളിൽ ഗോതമ്പിനോടു സാമ്യമുള്ള “ഡാർണൽ” എന്ന കളയായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: φησιν
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിൽ ചരിത്രവർത്തമാനകാലമാണെങ്കിലും, മലയാളത്തിലെ സ്വാഭാവികമായ ആഖ്യാനശൈലിയിൽ ഭൂതകാലമായ ‘പറഞ്ഞു’ യോജിക്കുന്നു.
- source_word: Οὔ
  choice: വേണ്ടാ
  rationale: ദാസന്മാർ നിർദേശിച്ച പ്രവൃത്തി വിലക്കുന്ന നേരിട്ടുള്ള മറുപടിയായതിനാൽ സന്ദർഭത്തിൽ ‘വേണ്ടാ’ സ്വാഭാവികമാണ്.
- source_word: μήποτε
  choice: പിഴുതുകളഞ്ഞേക്കാം
  rationale: അഭിലഷണീയമല്ലാത്ത ഒരു സാധ്യതയെക്കുറിച്ചുള്ള മുന്നറിയിപ്പ് മലയാളത്തിൽ സാധ്യതാസൂചകമായ ഈ രൂപത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: συλλέγοντες
  choice: പറിച്ചുകൂട്ടുമ്പോൾ
  rationale: മുഖ്യപ്രവൃത്തിയോടൊപ്പം നടക്കുന്ന കളശേഖരണത്തെ സമയബന്ധത്തോടെ വ്യക്തമാക്കുന്നു; സന്ദർഭത്തിലെ പറിച്ചെടുക്കൽ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ζιζάνια
  choice: കളകൾ
  rationale: സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ആധുനിക പദം; ഗോതമ്പിനോടു സാമ്യമുള്ള പ്രത്യേക കളയായ ഡാർണൽ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἐκριζώσητε
  choice: വേരോടെ പിഴുതുകളഞ്ഞേക്കാം
  rationale: വേരോടെ പുറത്തെടുക്കുക എന്ന ക്രിയയുടെ കൃത്യമായ അർഥവും അനിഷ്ടസാധ്യതയും ഒരുമിച്ച് നൽകുന്നു.
- source_word: ἅμα αὐτοῖς
  choice: അവയോടൊപ്പം
  rationale: കളകളോടൊപ്പം ഗോതമ്പും നീക്കംചെയ്യപ്പെടുമെന്ന സഹവർത്തിത്വം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: τὸν σῖτον
  choice: ഗോതമ്പും
  rationale: ഈ കൃഷിസന്ദർഭത്തിലും കളകളുമായുള്ള വൈരുധ്യത്തിലും പൊതുവായ ‘ധാന്യം’ എന്നതിനെക്കാൾ ‘ഗോതമ്പ്’ കൃത്യമാണ്.
theological_decisions:
- issue: ζιζάνια എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: കളകൾ
  alternative: കള്ളഗോതമ്പ്; ഡാർണൽ
  rationale: പ്രധാനപാഠത്തിൽ ആധുനിക വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന പൊതുപദം ഉപയോഗിക്കുന്നു. ഗോതമ്പിനോട് ആദ്യഘട്ടത്തിൽ സാമ്യമുള്ള പ്രത്യേക കളയെ പദം സൂചിപ്പിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു; ഉപമയുടെ അർഥം സസ്യശാസ്ത്രപരമായി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘വേണ്ടാ’ എന്നത് നിർദേശം നിരസിക്കുന്ന സന്ദർഭത്തിന് യോജിക്കുന്നു; ഗ്രീക്കിലെ മുന്നറിയിപ്പിന്റെ സാധ്യതാഭാവം ‘പിഴുതുകളഞ്ഞേക്കാം’ എന്ന രൂപത്തിൽ നിലനിർത്തിയിരിക്കുന്നു.
