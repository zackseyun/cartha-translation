id: MAT.13.27
reference: Matthew 13:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: προσελθόντες δὲ οἱ δοῦλοι τοῦ οἰκοδεσπότου εἶπον αὐτῷ· Κύριε, οὐχὶ καλὸν σπέρμα ⸀ἔσπειρας ἐν τῷ σῷ ἀγρῷ; πόθεν οὖν ἔχει ζιζάνια;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/027.yaml
  text: So the slaves of the master of the house came to him and said[a], ‘Lord, did you not sow good seed in your field? Where then do the weeds come from?’
translation:
  language: ml
  text: 'അപ്പോൾ വീട്ടുടമസ്ഥന്റെ അടിമകൾ അദ്ദേഹത്തിന്റെ അടുത്തുവന്ന് പറഞ്ഞു: “യജമാനനേ, അങ്ങയുടെ വയലിൽ അങ്ങ് നല്ല വിത്തല്ലേ വിതച്ചത്? പിന്നെ അതിൽ കളകൾ[a] എവിടെനിന്നു വന്നു?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഡാർണൽച്ചെടികൾ”; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദം വളർച്ചയുടെ ആദ്യഘട്ടങ്ങളിൽ ഗോതമ്പിനോടു സാദൃശ്യമുള്ള ഡാർണൽ എന്ന കളച്ചെടിയെ സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: അദ്ദേഹത്തിന്റെ അടുത്തുവന്ന്
  rationale: പ്രധാനക്രിയയായ ‘പറഞ്ഞു’ എന്നതിനുമുമ്പുള്ള സമീപനത്തെ സൂചിപ്പിക്കുന്ന aorist participle സ്വാഭാവികമായ മലയാള സഹക്രിയാരൂപത്തിൽ നൽകി.
- source_word: δοῦλοι
  choice: അടിമകൾ
  rationale: വീട്ടുടമസ്ഥന്റെ അധികാരത്തിനുകീഴിലുള്ള ബന്ധിതരായ വീട്ടുജോലിക്കാരുടെ സാമൂഹികനില മയപ്പെടുത്താതെ വ്യക്തമാക്കുന്നു.
- source_word: οἰκοδεσπότου
  choice: വീട്ടുടമസ്ഥന്റെ
  rationale: വീടിന്റെയും അതിലെ ആളുകളുടെയും മേലുള്ള അധികാരം സൂചിപ്പിക്കുന്ന പദത്തിന് സ്വാഭാവികമായ ആധുനിക മലയാളരൂപം.
- source_word: Κύριε
  choice: യജമാനനേ
  rationale: ഈ ഉപമയിലെ വീട്ടുടമസ്ഥനെ അടിമകൾ ആദരപൂർവം അഭിസംബോധന ചെയ്യുന്നതാണ്; സന്ദർഭമില്ലാത്ത ക്രിസ്തുശാസ്ത്രപരമായ അർഥം ചേർക്കാതെ κύριε എന്നതിന്റെ അധികാരബന്ധം നിലനിർത്തുന്നു.
- source_word: οὐχὶ καλὸν σπέρμα ἔσπειρας
  choice: അങ്ങ് നല്ല വിത്തല്ലേ വിതച്ചത്?
  rationale: അനുകൂലമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന οὐχὶ എന്ന ചോദ്യരൂപം മലയാളത്തിലെ ‘അല്ലേ’ കൊണ്ട് സ്വാഭാവികമായി പുനരാവിഷ്കരിച്ചു.
- source_word: ἐν τῷ σῷ ἀγρῷ
  choice: അങ്ങയുടെ വയലിൽ
  rationale: ഉടമസ്ഥതയും കൃഷിസ്ഥലവും ലളിതമായും കൃത്യമായും അറിയിക്കുന്നു.
- source_word: πόθεν οὖν ἔχει ζιζάνια
  choice: പിന്നെ അതിൽ കളകൾ എവിടെനിന്നു വന്നു?
  rationale: ഗ്രീക്കിലെ ഉത്ഭവത്തെക്കുറിച്ചുള്ള ചോദ്യം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകി; ‘അതിൽ’ വയലിനെ സൂചിപ്പിക്കുകയും οὖν എന്ന നിഗമനബന്ധം ‘പിന്നെ’ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ζιζάνια
  choice: കളകൾ
  rationale: സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പൊതുപദം പ്രധാനവാചകത്തിൽ ഉപയോഗിച്ചു; സസ്യത്തിന്റെ കൂടുതൽ നിർദിഷ്ടമായ തിരിച്ചറിയൽ അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
theological_decisions:
- issue: ഉപമയിലെ δοῦλοι എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: അടിമകൾ
  alternative: വേലക്കാർ / ദാസന്മാർ
  rationale: ഈ വീട്ടുചുറ്റുപാടിൽ യജമാനന്റെ അധികാരത്തിനുകീഴിലുള്ള അവരുടെ ബന്ധിത സാമൂഹികനില ‘അടിമകൾ’ കൂടുതൽ സുതാര്യമായി നിലനിർത്തുന്നു; വാക്യം അടിമത്തത്തെക്കുറിച്ചുള്ള ഉപദേശമായി മാറ്റുന്നില്ല.
- issue: κύριε എന്ന അഭിസംബോധന
  choice: യജമാനനേ
  alternative: കർത്താവേ / പ്രഭോ
  rationale: ഇവിടെ പദം ഉപമയിലെ വീട്ടുടമസ്ഥനോടുള്ള ആദരപൂർവമായ അഭിസംബോധനയാണ്. ‘യജമാനനേ’ അധികാരബന്ധം കൃത്യമായി അറിയിക്കുകയും ഈ സന്ദർഭത്തിൽ അനാവശ്യമായ ദൈവശാസ്ത്രപരമായ നിർണയം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. വീട്ടുടമസ്ഥനോടുള്ള ആദരസൂചകമായി ‘അങ്ങ്/അങ്ങയുടെ’ ഉപയോഗിച്ചു. അടിക്കുറിപ്പിന്റെ സൂചകം ബന്ധപ്പെട്ട ‘കളകൾ’ എന്ന പദത്തിനു പിന്നാലെ തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
