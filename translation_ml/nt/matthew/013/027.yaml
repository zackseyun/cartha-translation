  source_fidelity: 'ഗ്രീക്കിലെ ക്രമവും അർഥവും വിശ്വസ്തമായി പുനരാവിഷ്കരിച്ചിരിക്കുന്നു: οἰκοδεσπότου-യുടെ അധികാരബന്ധം ‘വീട്ടുടമസ്ഥൻ,’ δοῦλοι-യുടെ ബന്ധിതപദവി ‘അടിമകൾ,’ അനുകൂല ഉത്തരമാശിക്കുന്ന οὐχὶ-യുടെ ഭാവം ‘അല്ലേ,’ കൂടാതെ πόθεν οὖν എന്ന ഉത്ഭവചോദ്യം ‘പിന്നെ ... എവിടെനിന്നു വന്നു?’ എന്നിവയിലൂടെ നന്നായി പ്രതിഫലിക്കുന്നു. അവസാനപ്രയോഗം ഗ്രീക്കിലെ ἔχει (‘ഉണ്ട്/കൈവശമുണ്ട്’) എന്നതിന്റെ ശാബ്ദികരൂപമല്ലെങ്കിലും, സാന്ദർഭികമായ ഉത്ഭവചോദ്യം സ്വാഭാവികമായി അറിയിക്കുന്നു; ഇംഗ്ലീഷ് ഓഡിറ്റ് ട്രെയിലുമായും യോജിക്കുന്നു.'
  naturalness: ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ വാചകം വ്യക്തവും ഒഴുക്കുള്ളതുമാണ്. ‘അടുത്തുവന്ന് പറഞ്ഞു,’ ‘അങ്ങ്/അങ്ങയുടെ,’ ‘യജമാനനേ’ എന്നിവ ഉപമയിലെ ആദരപൂർവമായ സംഭാഷണത്തിനു യോജിച്ച രജിസ്റ്റർ നൽകുന്നു.
  terminology: ‘അടിമകൾ’ δοῦλοι-യുടെ സാമൂഹികസ്ഥിതി മയപ്പെടുത്തുന്നില്ല. ‘യജമാനനേ’ ഇവിടെ ഉപമയിലെ വീട്ടുടമസ്ഥനോടുള്ള κύριε എന്ന അഭിസംബോധനയ്ക്ക് സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്; അനാവശ്യമായ ക്രിസ്തുശാസ്ത്രപരമായ അർഥനിർണയം അതിൽ ചേർക്കുന്നില്ല. ζιζάνια-യ്ക്ക് പ്രധാനവാചകത്തിലെ ‘കളകൾ’ വ്യക്തമാണ്; ഡാർണലിനെക്കുറിച്ചുള്ള അടിക്കുറിപ്പ് യുക്തമാണ്.
