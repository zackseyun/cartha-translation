id: MAT.13.56
reference: Matthew 13:56
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ αἱ ἀδελφαὶ αὐτοῦ οὐχὶ πᾶσαι πρὸς ἡμᾶς εἰσιν; πόθεν οὖν τούτῳ ταῦτα πάντα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/056.yaml
  text: And are not all his sisters with us? Where then did this man get all these things?[a]
translation:
  language: ml
  text: അവന്റെ സഹോദരിമാരെല്ലാം നമ്മോടുകൂടെ ഇല്ലയോ? പിന്നെ ഇവന് ഇതെല്ലാം എവിടെനിന്നു കിട്ടി?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സ്ത്രീബന്ധുക്കൾ.’ ഇവിടെ ഗ്രീക്ക് പദത്തിന് സാധാരണയായി ‘സഹോദരിമാർ’ എന്നാണ് അർഥം; എന്നാൽ പിൽക്കാല ദൈവശാസ്ത്രചർച്ചകളുടെ വെളിച്ചത്തിൽ ചിലർ അതിനെ കൂടുതൽ വിശാലമായ അർഥത്തിൽ വ്യാഖ്യാനിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀδελφαὶ
  choice: സഹോദരിമാർ
  rationale: സന്ദർഭത്തിൽ യേശുവിന്റെ കുടുംബാംഗങ്ങളെക്കുറിച്ചാണ് നാട്ടുകാർ പറയുന്നത്; അതിനാൽ പദത്തിന്റെ സാധാരണവും നേരിട്ടുമുള്ള കുടുംബബന്ധാർഥം ഏറ്റവും യോജിക്കുന്നു.
- source_word: οὐχὶ πᾶσαι
  choice: എല്ലാം ... ഇല്ലയോ?
  rationale: അനുകൂലമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന അലങ്കാരചോദ്യത്തിന്റെ സ്വഭാവവും എല്ലാവരെയും ഉൾക്കൊള്ളുന്ന ഊന്നലും നിലനിർത്തുന്നു.
- source_word: πρὸς ἡμᾶς
  choice: നമ്മോടുകൂടെ
  rationale: സമൂഹത്തിൽ അവർക്കുള്ള സാന്നിധ്യവും അടുപ്പവും സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: πόθεν
  choice: എവിടെനിന്നു
  rationale: ഉറവിടത്തെക്കുറിച്ചുള്ള ചോദ്യം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: οὖν
  choice: പിന്നെ
  rationale: നാട്ടുകാരുടെ നിഗമനാത്മകമായ ചോദ്യം മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: τούτῳ
  choice: ഇവന്
  rationale: യേശുവിനെ ചൂണ്ടിക്കാട്ടുന്ന പ്രകടനാത്മകവും അല്പം അവജ്ഞ കലർന്നതുമായ ഭാവം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ταῦτα πάντα
  choice: ഇതെല്ലാം
  rationale: മുൻസന്ദർഭത്തിൽ പറഞ്ഞ ജ്ഞാനവും അത്ഭുതപ്രവൃത്തികളും ഉൾപ്പെടുന്ന ബഹുവചനസമഗ്രത സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ സഹോദരിമാർ എന്ന പരാമർശത്തിന്റെ സ്വഭാവം
  choice: ἀδελφαὶ എന്ന പദം അതിന്റെ സാധാരണ അർഥമായ ‘സഹോദരിമാർ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: സ്ത്രീബന്ധുക്കൾ / ബന്ധുവായ സ്ത്രീകൾ
  rationale: ഗ്രീക്ക് പദത്തിന്റെയും ഉടൻചുറ്റുമുള്ള കുടുംബസന്ദർഭത്തിന്റെയും സ്വാഭാവിക അർഥം ‘സഹോദരിമാർ’ എന്നതാണ്. പിൽക്കാല ദൈവശാസ്ത്രചർച്ചകളെ പരിഭാഷയിലൂടെ തീർപ്പാക്കാതെ പാഠത്തിലെ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ മാന്യമായ മലയാളം. അലങ്കാരചോദ്യത്തിന്റെ സ്വഭാവവും ‘ഇവന്’ എന്നതിലെ നേരിയ അവജ്ഞാഭാവവും നിലനിർത്തിയിരിക്കുന്നു.
