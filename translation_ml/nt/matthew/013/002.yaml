source:
  edition: SBLGNT
  text: καὶ συνήχθησαν πρὸς αὐτὸν ὄχλοι πολλοί, ὥστε αὐτὸν ⸀εἰς πλοῖον ἐμβάντα καθῆσθαι, καὶ πᾶς ὁ ὄχλος ἐπὶ τὸν αἰγιαλὸν εἱστήκει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/002.yaml
  text: And large crowds gathered to him[a], so that he got into a boat and sat down[b], and the whole crowd stood on the shore.
translation:
  language: ml
  text: വലിയ ജനക്കൂട്ടങ്ങൾ അവന്റെ അടുക്കൽ വന്നുകൂടി; അങ്ങനെ അവൻ ഒരു വള്ളത്തിൽ കയറി ഇരുന്നു, ജനക്കൂട്ടം മുഴുവനും കരയിൽ നിന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνήχθησαν πρὸς αὐτὸν
  choice: അവന്റെ അടുക്കൽ വന്നുകൂടി
  rationale: പ്രത്യയം സൂചിപ്പിക്കുന്ന യേശുവിലേക്കുള്ള ചലനവും ജനങ്ങൾ ഒന്നിച്ചുകൂടിയതും സ്വാഭാവികമായ മലയാളത്തിൽ ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: ὄχλοι πολλοί
  choice: വലിയ ജനക്കൂട്ടങ്ങൾ
  rationale: മൂലത്തിലെ ബഹുവചനം നിലനിർത്തിക്കൊണ്ട് πολλοί സൂചിപ്പിക്കുന്ന ജനബാഹുല്യം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὥστε
  choice: അതിനാൽ
  rationale: തുടർന്നുള്ള പ്രവൃത്തി ജനക്കൂട്ടം കൂടിയതിന്റെ ഫലമാണെന്ന ബന്ധം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: εἰς πλοῖον ἐμβάντα καθῆσθαι
  choice: ഒരു വള്ളത്തിൽ കയറി ഇരുന്നു
  rationale: വള്ളത്തിൽ പ്രവേശിച്ച് ഇരുന്ന പ്രവൃത്തികളുടെ ക്രമം ലളിതമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: πᾶς ὁ ὄχλος
  choice: ജനക്കൂട്ടം മുഴുവനും
  rationale: മുമ്പത്തെ ബഹുവചന ജനക്കൂട്ടങ്ങളെ ഇവിടെ ഒരു സമൂഹമായി കാണിക്കുന്ന മൂലത്തിലെ ഏകവചനസമാഹാരഭാവം സംരക്ഷിക്കുന്നു.
- source_word: ἐπὶ τὸν αἰγιαλόν
  choice: കരയിൽ
  rationale: αἰγιαλός എന്നത് ജലാശയത്തിന്റെ കരയെയോ തീരത്തെയോ സൂചിപ്പിക്കുന്നു; ഗലീലക്കടലിന്റെ സന്ദർഭത്തിൽ ‘കരയിൽ’ സ്വാഭാവികവും നിഷ്പക്ഷവുമാണ്.
- source_word: εἱστήκει
  choice: നിന്നു
  rationale: ജനക്കൂട്ടത്തിന്റെ നിലകൊണ്ടിരുന്ന അവസ്ഥയെ മലയാളത്തിലെ സ്വാഭാവികമായ ഭൂതകാലരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
