translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്ക് വാക്യത്തിലെ ഫലബന്ധവും, ആദ്യം ബഹുവചനമായും പിന്നീട് സമാഹാര ഏകവചനമായും വരുന്ന ജനക്കൂട്ട പരാമർശവും നിലനിർത്തിയിരിക്കുന്നു.
