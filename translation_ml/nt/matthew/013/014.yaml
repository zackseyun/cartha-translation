id: MAT.13.14
reference: Matthew 13:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀναπληροῦται αὐτοῖς ἡ προφητεία Ἠσαΐου ἡ λέγουσα· Ἀκοῇ ἀκούσετε καὶ οὐ μὴ συνῆτε, καὶ βλέποντες βλέψετε καὶ οὐ μὴ ἴδητε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/014.yaml
  text: 'And in them the prophecy of Isaiah is fulfilled[a], which says: ‘You will indeed hear, but never understand, and seeing you will see, but never perceive.’'
translation:
  language: ml
  text: 'അങ്ങനെ, അവരിൽ യെശയ്യാവിന്റെ പ്രവചനം നിവൃത്തിയാകുന്നു[a], ഇപ്രകാരം പറയുന്ന:


    “നിങ്ങൾ കേൾക്കുകതന്നെ ചെയ്യും, എന്നാൽ ഒരിക്കലും ഗ്രഹിക്കുകയില്ല;

    കണ്ടുകൊണ്ടുതന്നെ നിങ്ങൾ കാണും, എന്നാൽ ഒരിക്കലും തിരിച്ചറിയുകയില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “കേൾവിയാൽ നിങ്ങൾ കേൾക്കും … കണ്ടുകൊണ്ട് നിങ്ങൾ കാണും.” ഗ്രീക്കിലൂടെ ഉദ്ധരിക്കപ്പെട്ടിരിക്കുന്ന, ഊന്നൽ നൽകുന്ന എബ്രായശൈലിയിലുള്ള പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναπληροῦται
  choice: നിവൃത്തിയാകുന്നു
  rationale: വർത്തമാനകാല കർമണി രൂപത്തിന്റെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു. ‘പൂർണമായി നിവൃത്തിയാകുന്നു’ എന്നു പറഞ്ഞ് പദത്തിൽ ഉണ്ടാകാവുന്നതിലധികം സമാപ്തിഭാവം ചുമത്തുന്നില്ല.
- source_word: αὐτοῖς
  choice: അവരിൽ
  rationale: പ്രവചനം ഈ ആളുകളുടെ കാര്യത്തിൽ യാഥാർഥ്യമാകുന്നു എന്ന ദത്തിവിന്റെ ആശയം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: προφητεία Ἠσαΐου
  choice: യെശയ്യാവിന്റെ പ്രവചനം
  rationale: ഗ്രീക്കിലെ ഷഷ്ഠീവ്യവസ്ഥയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: ἡ λέγουσα
  choice: അത് ഇങ്ങനെ പറയുന്നു
  rationale: ഉദ്ധരണി അവതരിപ്പിക്കുന്ന വിശേഷണാത്മക കൃദന്തരൂപത്തിന്റെ ധർമം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: Ἀκοῇ ἀκούσετε
  choice: നിങ്ങൾ കേൾക്കുകതന്നെ ചെയ്യും
  rationale: സെമിറ്റിക് ശൈലിയിലുള്ള ആവർത്തനാത്മക ഊന്നൽ പദാനുപദമായ അസ്വാഭാവികത കൂടാതെ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: οὐ μὴ συνῆτε
  choice: എന്നാൽ ഒരിക്കലും ഗ്രഹിക്കുകയില്ല
  rationale: οὐ μή എന്ന ശക്തമായ നിഷേധം ‘ഒരിക്കലും’കൊണ്ട് നിലനിർത്തുകയും സന്ദർഭത്തിലെ ബൗദ്ധിക ഗ്രഹണത്തെ ‘ഗ്രഹിക്കുക’കൊണ്ട് സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: βλέποντες βλέψετε
  choice: കാണുകതന്നെ ചെയ്യും
  rationale: മുൻവരിയിലെ ഊന്നൽഘടനയോടുള്ള സമാന്തരത സംരക്ഷിക്കുന്നു.
- source_word: οὐ μὴ ἴδητε
  choice: എന്നാൽ ഒരിക്കലും തിരിച്ചറിയുകയില്ല
  rationale: വെറും ദൃശ്യകാണലും യഥാർഥമായ തിരിച്ചറിവും തമ്മിലുള്ള സന്ദർഭോചിത വ്യത്യാസം സൂചിപ്പിക്കുമ്പോഴും ശക്തമായ നിഷേധം നിലനിർത്തുന്നു.
theological_decisions:
- issue: പ്രവചനനിവൃത്തിയുടെ സ്വഭാവം
  choice: യെശയ്യാവിന്റെ പ്രവചനം ഈ ആളുകളിൽ നിവൃത്തിയാകുന്നു എന്നു മാത്രം പ്രസ്താവിക്കുന്നു
  alternative: ഇത് അവരിൽ വെറും ഉദാഹരിക്കപ്പെടുന്നു എന്നോ പൂർണവും അന്തിമവുമായി സമാപിക്കുന്നു എന്നോ വ്യക്തമാക്കുക
  rationale: കാഠിന്യം, മുൻനിർണയം, മാതൃകാപരമായ സാദൃശ്യം എന്നിവയെക്കുറിച്ചുള്ള പ്രത്യേക ദൈവശാസ്ത്ര വിശദീകരണം ചേർക്കാതെ ഗ്രീക്കിലെ നിവൃത്തിവാചകം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഉദ്ധരണിയിലെ സമാന്തരതയും ശക്തമായ നിഷേധവും സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി കേൾക്കുന്ന വിധത്തിൽ സൂക്ഷിച്ചിട്ടുണ്ട്.
