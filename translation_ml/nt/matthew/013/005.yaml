id: MAT.13.5
reference: Matthew 13:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἄλλα δὲ ἔπεσεν ἐπὶ τὰ πετρώδη ὅπου οὐκ εἶχεν γῆν πολλήν, καὶ εὐθέως ἐξανέτειλεν διὰ τὸ μὴ ἔχειν βάθος γῆς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/005.yaml
  text: Other seed fell on rocky ground[a], where it did not have much soil, and it sprang up at once because it had no depth of soil,
translation:
  language: ml
  text: മറ്റു ചില വിത്തുകൾ പാറക്കെട്ടുള്ള സ്ഥലങ്ങളിൽ[a] വീണു. അവിടെ മണ്ണ് അധികമില്ലായിരുന്നു. മണ്ണിന് ആഴമില്ലാതിരുന്നതിനാൽ അവ ഉടനെ മുളച്ചുപൊങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘പാറയുള്ള സ്ഥലങ്ങളിൽ’; അടിയിൽ പാറയും അതിനുമുകളിൽ ആഴം കുറഞ്ഞ മണ്ണുമുള്ള ഇടങ്ങളെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα δὲ
  choice: മറ്റു ചില വിത്തുകൾ
  rationale: മുൻവാക്യത്തിലെ വിത്തുകളെ സൂചിപ്പിക്കുന്ന നപുംസകലിംഗ ബഹുവചന പ്രയോഗമാണിത്. മലയാളത്തിൽ അർഥം വ്യക്തമാക്കാൻ ‘വിത്തുകൾ’ ചേർത്തു; വിത്തുകളുടെ മറ്റൊരു വിഭാഗമെന്ന വ്യത്യാസം ‘മറ്റു ചില’ നിലനിർത്തുന്നു.
- source_word: ἔπεσεν
  choice: വീണു
  rationale: മൂലപദത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘വീണു’ എന്നാണ്; ‘വിതയ്ക്കപ്പെട്ടു’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് വാചകത്തിൽ ഇല്ലാത്ത കർമണിപ്രയോഗം കൊണ്ടുവരും.
- source_word: ἐπὶ τὰ πετρώδη
  choice: പാറക്കെട്ടുള്ള സ്ഥലങ്ങളിൽ
  rationale: πετρώδη എന്ന ബഹുവചനപ്രയോഗം പാറയുള്ള ഇടങ്ങളെ സൂചിപ്പിക്കുന്നു. അടിയിൽ പാറയും മുകളിൽ ആഴം കുറഞ്ഞ മണ്ണുമുള്ള അവസ്ഥ വ്യക്തമാക്കാൻ അടിക്കുറിപ്പ് ചേർത്തിരിക്കുന്നു.
- source_word: ὅπου οὐκ εἶχεν γῆν πολλήν
  choice: അവിടെ മണ്ണ് അധികമില്ലാതിരുന്നതിനാൽ
  rationale: കൃഷിസന്ദർഭത്തിൽ γῆ എന്നതിന് സ്വാഭാവികമായ ‘മണ്ണ്’ തിരഞ്ഞെടുത്തു. ഗ്രീക്കിലെ സാഹചര്യം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: καὶ εὐθέως ἐξανέτειλεν
  choice: അവ ഉടനെ മുളച്ചുപൊങ്ങി
  rationale: εὐθέως എന്നതിന്റെ ഉടൻ സംഭവിക്കുന്ന കാലസൂചന ‘ഉടനെ’ നിലനിർത്തുന്നു; ἐξανέτειλεν എന്നത് വിത്ത് മുളച്ച് മുകളിലേക്ക് വരുന്നതിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘മുളച്ചുപൊങ്ങി’ യോജിക്കുന്നു.
- source_word: διὰ τὸ μὴ ἔχειν βάθος γῆς
  choice: കാരണം മണ്ണിന് ആഴമില്ലായിരുന്നു
  rationale: διά സഹിതമുള്ള articular infinitive കാരണത്തെ സൂചിപ്പിക്കുന്നു. βάθος γῆς എന്ന മണ്ണിന്റെ ആഴം എന്ന ദൃശ്യരൂപം നേരിട്ട് നിലനിർത്തി.
