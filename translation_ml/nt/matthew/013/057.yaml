revisions:
- from: 'അവർ അവനിൽ ഇടറിപ്പോയി.[a] എന്നാൽ യേശു അവരോടു പറഞ്ഞു: “ഒരു പ്രവാചകൻ സ്വന്തം നാട്ടിലും സ്വന്തം വീട്ടുകാരുടെ ഇടയിലും അല്ലാതെ ബഹുമാനമില്ലാത്തവനാകുന്നില്ല.”[b]'
  to: 'അവർ അവനെച്ചൊല്ലി ഇടറിപ്പോയി.[a] എന്നാൽ യേശു അവരോടു പറഞ്ഞു: “സ്വന്തം നാട്ടിലും സ്വന്തം വീട്ടിലും അല്ലാതെ ഒരു പ്രവാചകൻ ബഹുമാനമില്ലാത്തവനല്ല.”[b]'
