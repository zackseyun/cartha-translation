id: MAT.13.57
reference: Matthew 13:57
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐσκανδαλίζοντο ἐν αὐτῷ. ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Οὐκ ἔστιν προφήτης ἄτιμος εἰ μὴ ἐν τῇ ⸀πατρίδι καὶ ἐν τῇ οἰκίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/057.yaml
  text: And they took offense at him[a]. But Jesus said to them[c][b], “A prophet is not without honor except in his hometown and in his own household.”
translation:
  language: ml
  text: 'അവർ അവനെച്ചൊല്ലി ഇടറിപ്പോയി.[a] എന്നാൽ യേശു അവരോടു പറഞ്ഞു: “സ്വന്തം നാട്ടിലും സ്വന്തം വീട്ടിലും അല്ലാതെ ഒരു പ്രവാചകൻ ബഹുമാനമില്ലാത്തവനല്ല.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവർ അവനെച്ചൊല്ലി മനസ്സിടറി”; അക്ഷരാർഥത്തിൽ, “അവർ അവനിൽ ഇടറിപ്പോയി.”
    reason: lexical_alternative
  - marker: b
    text: “സ്വന്തം നാട്” എന്നത് “ജന്മദേശം” അല്ലെങ്കിൽ “സ്വദേശം” എന്നും വിവർത്തനം ചെയ്യാം. “സ്വന്തം വീട്” എന്ന ഗ്രീക്ക് പദം വീടിനെയോ വീട്ടുകാരെയോ/കുടുംബവൃത്തത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκανδαλίζοντο ἐν αὐτῷ
  choice: അവർ അവനിൽ ഇടറിപ്പോയി
  rationale: വാക്യപ്രയോഗത്തിന്റെ രൂപകാത്മകമായ ‘ഇടറുക’ എന്ന ഭാവവും യേശുവിനെ അംഗീകരിക്കാതെ അവനിൽ കുറ്റം കണ്ടെത്തിയെന്ന സന്ദർഭാർഥവും നിലനിർത്തുന്നു; അക്ഷരാർഥത്തിലെ ശാരീരിക ഇടർച്ചയല്ല.
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: എന്നാൽ യേശു അവരോടു പറഞ്ഞു
  rationale: δέ അവരുടെ പ്രതികരണത്തോടുള്ള നേരിയ വൈരുധ്യവും തുടർന്നുള്ള സംഭാഷണതിരിവും സൂചിപ്പിക്കുന്നു.
- source_word: προφήτης
  choice: പ്രവാചകൻ
  rationale: തിരിച്ചറിയാവുന്ന സ്ഥിരമായ ബൈബിൾപദം; പഴഞ്ചൊല്ലിന്റെ നേരിട്ടുള്ള രൂപം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: ἄτιμος
  choice: ബഹുമാനമില്ലാത്തവൻ
  rationale: മാനം/അപമാനം എന്ന ആശയപരിസരം നിലനിർത്തുകയും οὐκ ... εἰ μὴ എന്ന നിഷേധ-അപവാദ ഘടന സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: εἰ μὴ
  choice: അല്ലാതെ
  rationale: ഈ നിഷേധ-അപവാദ ഘടനയിൽ സ്വാഭാവികമായ മലയാളസമാനത.
- source_word: πατρίδι
  choice: സ്വന്തം നാട്ടിൽ
  rationale: സന്ദർഭത്തിൽ വിശാലമായ രാഷ്ട്രത്തേക്കാൾ ജന്മസ്ഥലമോ സ്വദേശമോ ആണ് ഉദ്ദേശ്യം; ‘സ്വന്തം നാട്’ ഈ പരിധി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: οἰκίᾳ αὐτοῦ
  choice: സ്വന്തം വീട്ടുകാരുടെ ഇടയിൽ
  rationale: οἰκία വീടെന്ന കെട്ടിടത്തെയോ വീട്ടുകാർ/കുടുംബവൃത്തത്തെയോ സൂചിപ്പിക്കാം. പഴഞ്ചൊല്ലിന്റെ സാമൂഹികസന്ദർഭത്തിൽ വീട്ടുകാരുടെ വൃത്തം യോജിച്ചെങ്കിലും, മറ്റർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ പഴഞ്ചൊല്ലിലെ നിരാകരണത്തിന്റെ വ്യാപ്തി
  choice: ഒരു പ്രവാചകന് സ്വന്തം പ്രാദേശികവും ഗാർഹികവുമായ വൃത്തങ്ങളിൽ ബഹുമാനം ലഭിക്കാത്തതിനെക്കുറിച്ചുള്ള പൊതുവായ പഴഞ്ചൊല്ലായി വിവർത്തനം ചെയ്തു.
  alternative: യേശുവിന്റെ കുടുംബത്തിന്റെ അവിശ്വാസത്തെ പ്രത്യേകം ഊന്നുന്ന വ്യാഖ്യാനപരമായ പരിഭാഷ.
  rationale: ഗ്രീക്ക് വാക്യം ബഹുമാനവും പ്രാദേശിക നിരാകരണവും മുൻനിർത്തുന്നു; അതിനപ്പുറം വിശാലമായ സിദ്ധാന്തപരമായ അവകാശവാദം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. പഴഞ്ചൊല്ലിന്റെ നിഷേധ-അപവാദ രൂപം ബോധപൂർവം നിലനിർത്തിയിരിക്കുന്നു. പ്രധാനവാക്യത്തിൽ രൂപകാത്മകമായ ‘ഇടറുക’ ഉപയോഗിച്ച് മൂലപദത്തിന്റെ ദൃശ്യഭാവം സംരക്ഷിച്ചു; സാദ്ധ്യമായ അർഥവ്യത്യാസങ്ങൾ അടിക്കുറിപ്പുകളിൽ നൽകി.
