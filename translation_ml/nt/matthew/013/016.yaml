  revised_text: എന്നാൽ, നിങ്ങളുടെ കണ്ണുകൾ കാണുന്നതിനാലും നിങ്ങളുടെ ചെവികൾ കേൾക്കുന്നതിനാലും അനുഗൃഹീതങ്ങളാണ്.[a]
