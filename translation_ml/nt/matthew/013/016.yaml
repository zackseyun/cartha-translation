id: MAT.13.16
reference: Matthew 13:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὑμῶν δὲ μακάριοι οἱ ὀφθαλμοὶ ὅτι βλέπουσιν, καὶ τὰ ὦτα ὑμῶν ὅτι ⸀ἀκούουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/016.yaml
  text: But blessed are your eyes[a], because they see, and your ears, because they hear.
translation:
  language: ml
  text: എന്നാൽ, നിങ്ങളുടെ കണ്ണുകൾ കാണുന്നതിനാലും നിങ്ങളുടെ ചെവികൾ കേൾക്കുന്നതിനാലും അനുഗൃഹീതങ്ങളാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “എന്തെന്നാൽ അവ കാണുന്നു ... എന്തെന്നാൽ അവ കേൾക്കുന്നു.” ഇവിടെ ഗ്രീക്ക് സംയോജകപദം കാരണത്തെ ഈ രീതിയിലും അവതരിപ്പിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യങ്ങളിൽ കാണാതിരിക്കുകയും കേൾക്കാതിരിക്കുകയും ചെയ്യുന്നവരോടുള്ള വൈരുധ്യം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: μακάριοι
  choice: അനുഗൃഹീതമാണ്
  rationale: കേവലമായ മാനസിക സന്തോഷത്തെക്കാൾ ദൈവിക അനുഗ്രഹവും അനുകൂലാവസ്ഥയും സൂചിപ്പിക്കുന്ന വാഴ്ത്തുവാക്യശൈലി നിലനിർത്തുന്നു.
- source_word: οἱ ὀφθαλμοὶ / τὰ ὦτα ὑμῶν
  choice: നിങ്ങളുടെ കണ്ണുകൾ / നിങ്ങളുടെ ചെവികൾ
  rationale: ഗ്രീക്കിലെ ശരീരാവയവങ്ങളെക്കുറിച്ചുള്ള നേരിട്ടുള്ള ഭാഷയും സമാന്തരഘടനയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὅτι βλέπουσιν / ὅτι ἀκούουσιν
  choice: കാണുന്നതിനാൽ / കേൾക്കുന്നതിനാൽ
  rationale: ὅτι ഇവിടെ കാരണസൂചകമായി വായിച്ച് കണ്ണുകളും ചെവികളും അനുഗൃഹീതമെന്നു പറയാനുള്ള കാരണം വ്യക്തമാക്കുന്നു.
- source_word: βλέπουσιν / ἀκούουσιν
  choice: കാണുന്നു / കേൾക്കുന്നു
  rationale: ആത്മീയ ഗ്രഹണം വിവർത്തനത്തിൽ കൂട്ടിച്ചേർക്കാതെ മൂലത്തിലെ ലളിതമായ ഇന്ദ്രിയക്രിയകൾ നിലനിർത്തുന്നു.
theological_decisions:
- issue: കാണലിനെയും കേൾക്കലിനെയും വ്യക്തമായി ആത്മീയ ഗ്രഹണമായി അവതരിപ്പിക്കണമോ
  choice: ‘കാണുക’, ‘കേൾക്കുക’ എന്ന അക്ഷരാർഥത്തിലുള്ള ഇന്ദ്രിയഭാഷ നിലനിർത്തി.
  alternative: ‘ഗ്രഹിക്കുക’, ‘മനസ്സിലാക്കുക’ എന്നിങ്ങനെ വ്യക്തീകരിക്കുക.
  rationale: സന്ദർഭം ആഴത്തിലുള്ള ആത്മീയ ഗ്രഹണം സൂചിപ്പിക്കുന്നുവെങ്കിലും ഈ വാക്യം തന്നെ കണ്ണുകൾ കാണുകയും ചെവികൾ കേൾക്കുകയും ചെയ്യുന്നു എന്നാണ് പറയുന്നത്. അതിനാൽ വ്യാഖ്യാനം വാചകത്തിലേക്ക് ചേർക്കാതെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം നിലനിർത്തുന്നു.
- issue: ὅτιയുടെ കാരണസൂചക സ്വഭാവം മലയാളത്തിൽ എങ്ങനെ പ്രകടിപ്പിക്കണം
  choice: ‘-ുന്നതിനാൽ’ ഉപയോഗിച്ചു.
  alternative: ‘എന്തെന്നാൽ അവ കാണുന്നു ... എന്തെന്നാൽ അവ കേൾക്കുന്നു’ എന്നു സ്വതന്ത്ര ഉപവാക്യങ്ങളായി നൽകുക.
  rationale: ഇരുവായനകളും കാരണബന്ധം നൽകുന്നു; പ്രധാന പാഠത്തിലെ രൂപം മലയാളത്തിൽ കൂടുതൽ ഒഴുക്കുള്ളതും സമാന്തരവുമാണ്. പര്യായരൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ കണ്ണുകൾ–ചെവികൾ, കാണുക–കേൾക്കുക എന്നീ സമാന്തരങ്ങൾ സംരക്ഷിച്ചു; ആത്മീയ അർഥം വിശദീകരിച്ച് ചേർത്തിട്ടില്ല.
