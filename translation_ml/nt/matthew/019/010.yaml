reference: Matthew 19:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Λέγουσιν αὐτῷ οἱ ⸀μαθηταί· Εἰ οὕτως ἐστὶν ἡ αἰτία τοῦ ἀνθρώπου μετὰ τῆς γυναικός, οὐ συμφέρει γαμῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/010.yaml
  text: His disciples said to him[a], “If that is the case of a man with his wife, it is not beneficial to marry.”
translation:
  language: ml
  text: 'ശിഷ്യന്മാർ അവനോട് പറഞ്ഞു: “ഒരു പുരുഷന് തന്റെ ഭാര്യയുമായുള്ള സ്ഥിതി ഇങ്ങനെയാണെങ്കിൽ[a], വിവാഹം കഴിക്കുന്നത് പ്രയോജനകരമല്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഒരു പുരുഷന് തന്റെ ഭാര്യയുമായുള്ള കാര്യം ഇങ്ങനെയാണെങ്കിൽ.” ഗ്രീക്ക് പ്രയോഗം സംക്ഷിപ്തമാണ്; “സ്ഥിതി” എന്നതിനുപകരം “കാര്യം” എന്നോ “സാഹചര്യം” എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγουσιν αὐτῷ
  choice: അവനോട് പറഞ്ഞു
  rationale: വിവരണത്തിലെ ഗ്രീക്ക് വർത്തമാനകാലം ചരിത്രവർത്തമാനമായി പ്രവർത്തിക്കുന്നു; മലയാളത്തിലെ ഭൂതകാലപ്രയോഗം സ്വാഭാവികമാണ്.
- source_word: μαθηταί
  choice: ശിഷ്യന്മാർ
  rationale: യേശുവിന്റെ പഠിതാക്കളും അനുയായികളും എന്ന സുവിശേഷസന്ദർഭത്തിലെ സ്ഥിരമായ അർത്ഥം നൽകുന്നു.
- source_word: Εἰ οὕτως ἐστίν
  choice: ഇങ്ങനെയാണെങ്കിൽ
  rationale: മുൻപറഞ്ഞ ഉപദേശത്തിലേക്ക് വിരൽചൂണ്ടുന്ന നിബന്ധന സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἡ αἰτία
  choice: സ്ഥിതി
  rationale: ഇവിടെ കർശനമായ ‘കാരണം’ എന്നതിലുപരി കാര്യം, അവസ്ഥ, സാഹചര്യം എന്നീ അർത്ഥങ്ങളാണ് പ്രസക്തം; ‘സ്ഥിതി’ വാക്യത്തിൽ സ്വാഭാവികമാണ്.
- source_word: τοῦ ἀνθρώπου μετὰ τῆς γυναικός
  choice: ഭാര്യയോടുള്ള പുരുഷന്റെ
  rationale: വിവാഹസന്ദർഭത്തിലെ പുരുഷൻ–ഭാര്യ ബന്ധം നിലനിർത്തുന്നു; γυνή ഇവിടെ ‘ഭാര്യ’ എന്നാണ്.
- source_word: οὐ συμφέρει
  choice: പ്രയോജനകരമല്ല
  rationale: സൗകര്യമോ ഗുണമോ ഇല്ലെന്ന συμφέρει എന്ന പദത്തിന്റെ അർത്ഥം വ്യാഖ്യാനാത്മകമായി ‘ഉചിതമല്ല’ എന്നു മാറ്റാതെ സൂക്ഷിക്കുന്നു.
- source_word: γαμῆσαι
  choice: വിവാഹം കഴിക്കുന്നത്
  rationale: ഗ്രീക്ക് അനന്തക്രിയയുടെ അർത്ഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ἀνθρώπου ... γυναικός എന്നതിലെ ലിംഗസൂചന
  choice: ഭാര്യയോടുള്ള പുരുഷന്റെ
  alternative: ഒരു വ്യക്തിക്ക് തന്റെ ജീവിതപങ്കാളിയോടുള്ള
  rationale: ഉടൻമുമ്പുള്ള സന്ദർഭവും ഗ്രീക്കിലെ പുല്ലിംഗ ഏകവചനവും വിവാഹാർത്ഥത്തിലുള്ള γυνήയും പുരുഷൻ–ഭാര്യ ബന്ധത്തെ സൂചിപ്പിക്കുന്നു; അതിനെ ലിംഗനിരപേക്ഷമാക്കുന്നില്ല.
- issue: ἡ αἰτία എന്ന സംക്ഷിപ്ത പ്രയോഗത്തിന്റെ അനിശ്ചിതത്വം
  choice: സ്ഥിതി
  alternative: കാര്യം / സാഹചര്യം
  rationale: ഗ്രീക്ക് പദത്തിന് ഇവിടെ ഒന്നിലധികം സാധ്യതകളുണ്ട്; മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായ ‘സ്ഥിതി’ സ്വീകരിച്ച് മറ്റ് സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പ്രയോജനകരമല്ല’ എന്നത് മൂലപദത്തിന്റെ ഗുണം/നേട്ടം എന്ന ആശയം നിലനിർത്തുന്നു; വാക്യഘടന സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാണ്.
