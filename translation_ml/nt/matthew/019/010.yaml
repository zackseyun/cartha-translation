revisions:
- from: 'ശിഷ്യന്മാർ അവനോട് പറഞ്ഞു: “ഭാര്യയോടുള്ള പുരുഷന്റെ സ്ഥിതി ഇങ്ങനെയാണെങ്കിൽ[a], വിവാഹം കഴിക്കുന്നത് പ്രയോജനകരമല്ല.”'
  to: 'ശിഷ്യന്മാർ അവനോട് പറഞ്ഞു: “ഒരു പുരുഷന് തന്റെ ഭാര്യയുമായുള്ള സ്ഥിതി ഇങ്ങനെയാണെങ്കിൽ[a], വിവാഹം കഴിക്കുന്നത് പ്രയോജനകരമല്ല.”'
  rationale: The revision corrects an unnatural and potentially misleading Malayalam relational construction. The supplied possessive ‘തന്റെ’ is idiomatic in Malayalam for the marital referent and reflects what is contextually implicit in the Greek. The footnote is adjusted to match the revised syntax while preserving the lexical alternatives and the ambiguity of αἰτία.
