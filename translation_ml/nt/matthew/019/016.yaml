id: MAT.19.16
reference: Matthew 19:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ εἷς προσελθὼν ⸂αὐτῷ εἶπεν⸃· ⸀Διδάσκαλε, τί ἀγαθὸν ποιήσω ἵνα ⸀σχῶ ζωὴν αἰώνιον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/016.yaml
  text: And behold[a], one who had come up to him said, “Teacher, what good thing must I do so that I may have eternal life?”
translation:
  language: ml
  text: 'ഇതാ, ഒരാൾ അവന്റെ അടുക്കൽ വന്ന് അവനോടു പറഞ്ഞു: “ഗുരുവേ, നിത്യജീവൻ ലഭിക്കാനായി ഞാൻ എന്തു നല്ല കാര്യം ചെയ്യണം?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ ഏതു നല്ല പ്രവൃത്തി ചെയ്യണം?” ഗ്രീക്കിലെ τί ἀγαθὸν എന്നതിന് ‘എന്തു നല്ല കാര്യം’ എന്നും, ‘ചെയ്യുക’ എന്ന ക്രിയയോടൊപ്പം ‘ഏതു നല്ല പ്രവൃത്തി’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: അപ്പോൾ ഇതാ
  rationale: καίയുടെ ആഖ്യാനബന്ധവും ἰδούയുടെ ശ്രദ്ധ ക്ഷണിക്കുന്ന സജീവതയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: εἷς
  choice: ഒരാൾ
  rationale: ഈ വാക്യത്തിൽ ഇല്ലാത്ത ‘പുരുഷൻ’ എന്ന വിശദാംശം ചേർക്കാതെ, ഗ്രീക്കിലെ അനിശ്ചിത വ്യക്തിസൂചന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: προσελθὼν αὐτῷ εἶπεν
  choice: അവന്റെ അടുത്തുവന്ന് പറഞ്ഞു
  rationale: സംസാരിക്കുന്നതിനു മുമ്പുള്ള സമീപനത്തെ സൂചിപ്പിക്കുന്ന aorist participle മലയാളത്തിലെ സ്വാഭാവിക ക്രിയാശൃംഖലയായി അവതരിപ്പിക്കുന്നു.
- source_word: Διδάσκαλε
  choice: ഗുരുവേ
  rationale: അധ്യാപകൻ/ഉപദേഷ്ടാവ് എന്ന അഭിസംബോധനയുടെ സാധാരണവും മാന്യവുമായ മലയാളരൂപം.
- source_word: τί ἀγαθὸν ποιήσω
  choice: ഞാൻ എന്തു നന്മ ചെയ്യണം?
  rationale: τί ἀγαθόν എന്നതിന്റെ ‘നല്ല കാര്യം/നല്ല പ്രവൃത്തി’ എന്ന തുറന്ന അർഥപരിധി ‘നന്മ’ നിലനിർത്തുന്നു; deliberative subjunctive-ന്റെ പ്രായോഗിക ചോദ്യം ‘ചെയ്യണം’ വ്യക്തമാക്കുന്നു.
- source_word: ἵνα σχῶ
  choice: ലഭിക്കാൻ
  rationale: ഉദ്ദേശ്യബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; σχῶയുടെ ‘കൈവശമാകുക/ഉണ്ടാകുക’ എന്ന ആശയം സന്ദർഭോചിതമായി ‘ലഭിക്കുക’ എന്നു പറയുന്നു.
- source_word: ζωὴν αἰώνιον
  choice: നിത്യജീവൻ
  rationale: സ്ഥിരപ്രയോഗവും അർഥസുതാര്യവുമായ മലയാളപരിഭാഷ.
theological_decisions:
- issue: സംസാരിക്കുന്നയാളുടെ തിരിച്ചറിയൽ
  choice: ഒരാൾ
  alternative: ഒരു പുരുഷൻ / ധനികനായ യുവാവ്
  rationale: ഈ വാക്യത്തിലെ εἷς നൽകുന്നതിലധികം വിവരങ്ങൾ സമാന്തരവിവരണങ്ങളിൽ നിന്നോ പിന്നീടുള്ള സന്ദർഭത്തിൽ നിന്നോ മുൻകൂട്ടി ചേർക്കുന്നില്ല.
- issue: പ്രവൃത്തിയും നിത്യജീവനും തമ്മിലുള്ള ചോദ്യത്തിന്റെ ഭാവം
  choice: നിത്യജീവൻ ലഭിക്കാൻ ഞാൻ എന്തു നന്മ ചെയ്യണം?
  alternative: നിത്യജീവൻ നേടാൻ ഞാൻ ഏതു സൽപ്രവൃത്തി ചെയ്യണം?
  rationale: ചോദിക്കുന്നയാളുടെ പ്രവൃത്തികേന്ദ്രിതമായ ചോദ്യം നിലനിർത്തുന്നു; പ്രവൃത്തികൾ, യോഗ്യത, രക്ഷ എന്നിവയെക്കുറിച്ചുള്ള ദൈവശാസ്ത്രപരമായ പരിഹാരം വിവർത്തനത്തിലൂടെ മുൻകൂട്ടി നൽകുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ബൈബിൾ ആഖ്യാനശൈലി. ‘ഇതാ’ മൂലപാഠത്തിലെ ശ്രദ്ധാകർഷണ ഭാവം നിലനിർത്തുന്നു; ‘ഗുരുവേ’ സാധാരണ വായനക്കാർക്ക് സുതാര്യമാണ്. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ചോദ്യത്തിന്റെ അവസാനത്തിൽ ചേർത്തിരിക്കുന്നു.
