id: MAT.19.8
reference: Matthew 19:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς ὅτι Μωϋσῆς πρὸς τὴν σκληροκαρδίαν ὑμῶν ἐπέτρεψεν ὑμῖν ἀπολῦσαι τὰς γυναῖκας ὑμῶν, ἀπ’ ἀρχῆς δὲ οὐ γέγονεν οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/008.yaml
  text: He said to them[a], “Because of your hardness of heart Moses permitted you to divorce your wives[c][b], but from the beginning it has not been so.”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “നിങ്ങളുടെ ഹൃദയകാഠിന്യം നിമിത്തം നിങ്ങളുടെ ഭാര്യമാരെ വിവാഹമോചനം ചെയ്യാൻ[a] മോശെ നിങ്ങൾക്ക് അനുവാദം നൽകി; എന്നാൽ ആരംഭം മുതൽ അങ്ങനെയായിരുന്നിട്ടില്ല.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “നിങ്ങളുടെ ഭാര്യമാരെ വിട്ടയക്കാൻ”; ഈ സന്ദർഭത്തിൽ ഉദ്ദേശ്യം വിവാഹമോചനം ചെയ്യുക എന്നതാണ്.
    reason: lexical_alternative
  - marker: b
    text: അതായത്, ഈ അനുമതി സൃഷ്ടിയുടെ ആരംഭത്തിലുണ്ടായിരുന്ന ക്രമത്തെ പ്രതിഫലിപ്പിച്ചില്ല.
    reason: cross_reference
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: അവൻ അവരോടു പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ആഖ്യാനവർത്തമാനമായ λέγει, സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലിയിൽ ഭൂതകാലമായി നൽകിയിരിക്കുന്നു.
- source_word: πρὸς τὴν σκληροκαρδίαν ὑμῶν
  choice: നിങ്ങളുടെ ഹൃദയകാഠിന്യം നിമിത്തം
  rationale: πρός ഇവിടെ കാരണം അഥവാ പരിഗണന സൂചിപ്പിക്കുന്നു; ‘ഹൃദയകാഠിന്യം’ എന്നത് മൂലത്തിലെ ദൃശ്യമായ ബൈബിൾ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: ἐπέτρεψεν
  choice: അനുവാദം നൽകി
  rationale: ഇത് കല്പനയെയോ അംഗീകാരത്തെയോ അല്ല, അനുമതിയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἀπολῦσαι
  choice: ഉപേക്ഷിക്കാൻ
  rationale: പദത്തിന്റെ അക്ഷരാർഥമായ ‘അയച്ചുകളയുക’ എന്ന ഭാവം നിലനിർത്തുമ്പോഴും വിവാഹസന്ദർഭത്തിൽ ഭാര്യയെ വിവാഹമോചനം ചെയ്യുന്നതാണ് ഉദ്ദേശ്യം; അത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: τὰς γυναῖκας ὑμῶν
  choice: നിങ്ങളുടെ ഭാര്യമാരെ
  rationale: വിവാഹവും വിവാഹമോചനവും ചർച്ച ചെയ്യുന്ന സന്ദർഭത്തിൽ γυναῖκας എന്നത് ‘ഭാര്യമാർ’ എന്നാണ്.
- source_word: ἀπ’ ἀρχῆς
  choice: ആരംഭംമുതൽ
  rationale: സൃഷ്ടിയുടെ ആരംഭത്തിലേക്കുള്ള സന്ദർഭസൂചനയെ വിപുലീകരിക്കാതെ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: οὐ γέγονεν οὕτως
  choice: അങ്ങനെ ആയിരുന്നിട്ടില്ല
  rationale: γέγονεν എന്ന പൂർണകാലരൂപത്തിന്റെ ഇന്നുവരെയുള്ള നിലയുടെ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: മോശെയുടെ നടപടി കല്പനയോ അനുമതിയോ ആയി അവതരിപ്പിക്കണമോ
  choice: മോശെ നിങ്ങൾക്ക് അനുവാദം നൽകി
  alternative: മോശെ നിങ്ങളോടു കല്പിച്ചു
  rationale: ἐπέτρεψεν അനുമതിയെയാണ് സൂചിപ്പിക്കുന്നത്, കല്പനയെയല്ല; അതിനാൽ മോശൈക വ്യവസ്ഥയെ സൃഷ്ടിയിലെ ആദർശവുമായി തുല്യമാക്കുന്നില്ല.
- issue: ആരംഭത്തെക്കുറിച്ചുള്ള പരാമർശത്തിൽ സൃഷ്ടിവ്യവസ്ഥയെ വിശദമായി ചേർക്കണമോ
  choice: എന്നാൽ ആരംഭംമുതൽ അങ്ങനെ ആയിരുന്നിട്ടില്ല
  alternative: എന്നാൽ സൃഷ്ടിയുടെ ആരംഭത്തിൽ ഇത് ദൈവത്തിന്റെ ഉദ്ദേശ്യമായിരുന്നില്ല
  rationale: ഗ്രീക്ക് വാചകത്തിന്റെ സംക്ഷിപ്തതയും സന്ദർഭത്തിൽ നിലനിൽക്കുന്ന ദൈവശാസ്ത്രപരമായ സൂചനയും സംരക്ഷിക്കുന്നു; വ്യാഖ്യാനപരമായ വിപുലീകരണം മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘ഹൃദയകാഠിന്യം’ എന്ന ബൈബിൾ പ്രയോഗവും ‘ആരംഭംമുതൽ’ എന്ന സൃഷ്ടിസൂചനയും നിലനിർത്തിയിരിക്കുന്നു; ‘അനുവാദം നൽകി’ എന്നത് നിയമപരവും ദൈവശാസ്ത്രപരവുമായി ആവശ്യമായ വ്യത്യാസം വ്യക്തമാക്കുന്നു.
