id: MAT.19.6
reference: Matthew 19:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὥστε οὐκέτι εἰσὶν δύο ἀλλὰ σὰρξ μία. ὃ οὖν ὁ θεὸς συνέζευξεν ἄνθρωπος μὴ χωριζέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/006.yaml
  text: So they are no longer two[a], but one flesh. Therefore, what God has joined together, man must not separate.
translation:
  language: ml
  text: അങ്ങനെ അവർ ഇനി രണ്ടുപേരല്ല, ഒരു ജഡമാണ്. അതുകൊണ്ട് ദൈവം കൂട്ടിച്ചേർത്തതിനെ ഒരു മനുഷ്യനും വേർപെടുത്തരുത്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: അങ്ങനെ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ രണ്ടുപേർ ഒരേ ജഡമാകുന്നതിന്റെ ഫലം സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: οὐκέτι εἰσὶν δύο
  choice: അവർ ഇനി രണ്ടുപേരല്ല
  rationale: മാറിയ അവസ്ഥയെ സൂചിപ്പിക്കുന്ന οὐκέτιയുടെ കാലാർഥവും δύοയുടെ വ്യക്തിസൂചനയും വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: σὰρξ μία
  choice: ഒരേ ജഡമാണ്
  rationale: ഉല്പത്തി ഗ്രന്ഥത്തിലെ വിവാഹഭാഷയുമായുള്ള അന്തർപാഠബന്ധം നിലനിർത്താൻ σάρξ എന്നതിന് ‘ജഡം’ ഉപയോഗിക്കുന്നു; ‘ഒരേ’ എന്നത് ഏകത്വവും മുൻപുള്ള ‘രണ്ടുപേർ’ എന്നതിനോടുള്ള വൈരുധ്യവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὃ οὖν
  choice: അതുകൊണ്ട് ... അതിനെ
  rationale: οὖνയുടെ നിഗമനബലം ‘അതുകൊണ്ട്’ എന്നും, നപുംസകസംബന്ധസർവനാമമായ ὃ സൂചിപ്പിക്കുന്ന ദൈവം സ്ഥാപിച്ച ഐക്യം ‘അതിനെ’ എന്നും നൽകുന്നു.
- source_word: ὁ θεὸς
  choice: ദൈവം
  rationale: മൂലപാഠത്തിലെ കർത്താവിനെ നേരിട്ട്, സാധാരണ മലയാള പ്രയോഗത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: συνέζευξεν
  choice: കൂട്ടിച്ചേർത്തത്
  rationale: ഒരുമിച്ച് ബന്ധിപ്പിക്കുക അഥവാ നുകത്തിൽ ചേർക്കുക എന്ന ക്രിയയുടെ അർഥം വിവാഹസന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἄνθρωπος
  choice: ഒരു മനുഷ്യനും
  rationale: മൂലപദത്തിന്റെ ഏകവചന മനുഷ്യസൂചന നിലനിർത്തിക്കൊണ്ട്, നിഷേധവാക്യത്തിൽ അത് ‘ഒരു മനുഷ്യനും’ എന്നു നൽകിയാൽ ഏതൊരു മനുഷ്യനെയും ഉൾക്കൊള്ളുന്ന പൊതുവായ അർഥം മലയാളത്തിൽ വ്യക്തമാണ്.
- source_word: μὴ χωριζέτω
  choice: വേർപിരിക്കരുത്
  rationale: μήയോടുകൂടിയ വർത്തമാനകാല ആജ്ഞാരൂപത്തിന്റെ നിരോധനബലം ആധുനിക മലയാളത്തിൽ നേരിട്ടും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: വിവാഹത്തെക്കുറിച്ചുള്ള നിരോധനത്തിൽ ἄνθρωπος എന്ന പദത്തിന്റെ പൊതുവായ പ്രയോഗം
  choice: ‘ഒരു മനുഷ്യനും’ എന്ന് പരിഭാഷപ്പെടുത്തി
  alternative: ‘മനുഷ്യൻ’ അല്ലെങ്കിൽ ‘ആരും’
  rationale: ഗ്രീക്ക് പദത്തിന്റെ മനുഷ്യസൂചന മറയ്ക്കാതെയും അത് പുരുഷന്മാർക്കു മാത്രം ബാധകമാണെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കിയും പൊതുവായ നിരോധനം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- issue: σὰρξ μία എന്ന ഉല്പത്തി-പ്രതിധ്വനിയുള്ള വിവാഹൈക്യഭാഷ
  choice: ‘ഒരേ ജഡം’ എന്ന് നിലനിർത്തി
  alternative: ‘ഒരേ ശരീരം’
  rationale: ‘ജഡം’ മൂലത്തിലെ σάρξ എന്ന പദത്തെയും ഉല്പത്തി ഗ്രന്ഥവുമായുള്ള അന്തർപാഠബന്ധത്തെയും കൂടുതൽ വ്യക്തമായി സംരക്ഷിക്കുന്നു; വിവാഹബന്ധത്തെക്കുറിച്ചുള്ള അധിക സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. പൊതുവായ ἄνθρωπος എന്ന അർഥം മുഖ്യവാചകത്തിൽ തന്നെ ‘ഒരു മനുഷ്യനും’ എന്നു വ്യക്തമായതിനാൽ അടിക്കുറിപ്പ് ആവശ്യമില്ല.
