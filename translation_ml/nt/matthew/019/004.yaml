id: MAT.19.4
reference: Matthew 19:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς ⸀εἶπεν· Οὐκ ἀνέγνωτε ὅτι ὁ ⸀κτίσας ἀπ’ ἀρχῆς ἄρσεν καὶ θῆλυ ἐποίησεν αὐτοὺς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/004.yaml
  text: He answered, “Have you not read that from the beginning the one who created them made them male and female?”
translation:
  language: ml
  text: 'അവൻ മറുപടി പറഞ്ഞു: “ആദിമുതൽ സൃഷ്ടിച്ചവൻ അവരെ ആണും പെണ്ണുമായി ഉണ്ടാക്കി എന്ന് നിങ്ങൾ വായിച്ചിട്ടില്ലയോ?[a]”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങൾ വായിച്ചില്ലയോ?”
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ, “സൃഷ്ടിച്ചവൻ”; പകരം, “സ്രഷ്ടാവ്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: അവൻ മറുപടി പറഞ്ഞു
  rationale: പങ്കാളിക്രിയയും സമാപികാക്രിയയും ചേർന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: Οὐκ ἀνέγνωτε
  choice: നിങ്ങൾ വായിച്ചിട്ടില്ലയോ?
  rationale: തിരുവെഴുത്തിനെക്കുറിച്ചുള്ള ശ്രോതാക്കളുടെ അറിവിനെ ചോദ്യം ചെയ്യുന്ന ചോദ്യത്തിന്റെ തുടർന്നുനിൽക്കുന്ന പ്രസക്തി ഈ രൂപം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ὁ κτίσας
  choice: സൃഷ്ടിച്ചവൻ
  rationale: നാമവിശേഷണമായി പ്രവർത്തിക്കുന്ന ഗ്രീക്ക് പങ്കാളിക്രിയയെ ഒരു പദവിനാമമാക്കി മാറ്റാതെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: ἀπ’ ἀρχῆς
  choice: ആദിമുതൽ
  rationale: ഉല്പത്തി സൃഷ്ടിവിവരണത്തിന്റെ പ്രതിധ്വനി നിലനിർത്തുകയും ഗ്രീക്കിലെ ‘തുടക്കംമുതൽ’ എന്ന ആശയം സ്വാഭാവികമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: ἄρσεν καὶ θῆλυ
  choice: ആണും പെണ്ണുമായി
  rationale: ഉല്പത്തി 1:27-ലെ സൃഷ്ടിപരമായ ജോടിയെ പ്രതിഫലിപ്പിക്കുന്ന ഗ്രീക്ക് പദപ്രയോഗം ലിംഗപരമായ അർഥത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: ἐποίησεν αὐτούς
  choice: അവരെ ... ഉണ്ടാക്കി
  rationale: κτίζω എന്ന ‘സൃഷ്ടിക്കുക’ എന്ന ക്രിയയിൽനിന്ന് ποιέω എന്ന ‘ഉണ്ടാക്കുക’ എന്ന ക്രിയയുടെ വ്യത്യാസം നിലനിർത്തുകയും മലയാളത്തിലെ അനാവശ്യ ആവർത്തനം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ഉല്പത്തി 1:27-നോടുള്ള സൃഷ്ടിവിവരണബന്ധം
  choice: ‘ആണും പെണ്ണുമായി’ എന്ന സൃഷ്ടിപരമായ ജോടി മുഖ്യവാചകത്തിൽ നിലനിർത്തി.
  alternative: ‘പുരുഷനും സ്ത്രീയുമായി’ അല്ലെങ്കിൽ ‘ഒരു ആണും ഒരു പെണ്ണുമായി’
  rationale: യേശു സൃഷ്ടിവിവരണത്തെ നേരിട്ട് ഉദ്ധരിക്കുന്നു. ഈ വിവർത്തനം ഗ്രീക്കിന്റെയും ഉല്പത്തിയിലെ ഭാഷയുടെയും സൃഷ്ടിപരമായ ചട്ടക്കൂട് നിലനിർത്തുന്നു; വാക്യം പറയുന്നതിലധികം സിദ്ധാന്തപരമായ നിഗമനങ്ങൾ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ വാക്യം ക്രമപ്പെടുത്തി; ‘ആദിമുതൽ’ എന്നതിന്റെ ഗ്രീക്ക് വാക്യഘടനാപരമായ ബന്ധം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
