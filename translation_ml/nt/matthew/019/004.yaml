    reason: lexical_alternative
  revision_rationale: 'The revision preserves the Greek sequence and sense: the one who created, from the beginning, made them male and female. It avoids making ‘them’ an explicit object of the participle in Malayalam and replaces the unhelpful syntactical footnote with the documented lexical alternative.'
