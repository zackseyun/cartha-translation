id: MAT.19.11
reference: Matthew 19:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Οὐ πάντες χωροῦσι τὸν λόγον ⸀τοῦτον ἀλλ’ οἷς δέδοται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/011.yaml
  text: But he said to them[a], “Not everyone can accept this word[b], but only those to whom it has been given.”
translation:
  language: ml
  text: 'എന്നാൽ അവൻ അവരോടു പറഞ്ഞു: “എല്ലാവർക്കും ഈ വാക്ക്[a] സ്വീകരിക്കാൻ കഴിയില്ല; അതു നൽകപ്പെട്ടിട്ടുള്ളവർക്കു[b] മാത്രമേ കഴിയൂ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഈ വാക്ക്” എന്നതിന് “ഈ പ്രസ്താവന” എന്നോ “ഈ ഉപദേശം” എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: “നൽകപ്പെട്ടിട്ടുള്ള” എന്ന കർമണിപ്രയോഗത്തിൽ നൽകുന്നവൻ ദൈവമാണെന്ന സൂചന ഉണ്ടായിരിക്കാം; എന്നാൽ ഗ്രീക്ക് മൂലപാഠം കർത്താവിനെ വ്യക്തമായി പറയുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν
  choice: പറഞ്ഞു
  rationale: λέγω എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനപ്രയോഗം; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: Οὐ πάντες
  choice: എല്ലാവർക്കും ... കഴിയില്ല
  rationale: നിഷേധിക്കപ്പെട്ട സാർവത്രികതയെ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; ഈ കഴിവ് എല്ലാവർക്കുമില്ല എന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: χωροῦσι
  choice: അംഗീകരിക്കാൻ കഴിയില്ല
  rationale: χωρέω എന്നതിന് അക്ഷരാർഥത്തിൽ ‘ഇടം നൽകുക/ഉൾക്കൊള്ളുക’ എന്ന ആശയമുണ്ടെങ്കിലും λόγος-നോടൊപ്പമുള്ള ഈ പ്രയോഗത്തിൽ വാക്കിനെ സ്വീകരിക്കുകയോ അംഗീകരിക്കുകയോ ചെയ്യാനുള്ള ശേഷിയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: τὸν λόγον τοῦτον
  choice: ഈ വാക്ക്
  rationale: തൊട്ടുമുമ്പുള്ള പ്രസ്താവനയെ സൂചിപ്പിക്കുകയും λόγος എന്ന പദത്തിന്റെ രൂപകൽപ്പനാപരമായ ബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു; ‘ഈ പ്രസ്താവന’ അല്ലെങ്കിൽ ‘ഈ ഉപദേശം’ എന്നും സാധ്യമാണ്.
- source_word: ἀλλ’ οἷς
  choice: '...വർക്കു മാത്രമേ'
  rationale: വാക്ക് അംഗീകരിക്കാൻ കഴിയുന്നവരുടെ കൂട്ടത്തെ നിയന്ത്രിക്കുന്ന വിരുദ്ധ-പരിമിതീകരണ ബലം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: δέδοται
  choice: നൽകപ്പെട്ടിട്ടുള്ള
  rationale: δίδωμι-യുടെ perfect passive രൂപത്തിലെ നൽകപ്പെട്ട പ്രവൃത്തിയും അതിന്റെ ഇപ്പോഴത്തെ ഫലവും നിലനിർത്തുന്നു; നൽകുന്ന കർത്താവിനെ വ്യക്തമാക്കുന്നില്ല.
theological_decisions:
- issue: ‘നൽകപ്പെട്ടിരിക്കുന്നു’ എന്ന കർമണിപ്രയോഗത്തിൽ നൽകുന്നവൻ ആരെന്നത്
  choice: പ്രധാനപാഠത്തിൽ കർത്താവിനെ പറയാതെ കർമണിപ്രയോഗം നിലനിർത്തി.
  alternative: ‘ദൈവം അതു നൽകിയിട്ടുള്ളവർക്ക് മാത്രം’
  rationale: സന്ദർഭത്തിൽ ദൈവമാണ് നൽകുന്നവൻ എന്ന് മനസ്സിലാക്കാൻ സാധ്യതയുണ്ടെങ്കിലും ഗ്രീക്ക് വാചകം കർത്താവിനെ വ്യക്തമായി പറയുന്നില്ല. അതിനാൽ ദൈവിക കർമണിയുടെ സാധ്യതയും മൂലപാഠത്തിലെ അനിശ്ചിതത്വവും ഒരുപോലെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘അംഗീകരിക്കാൻ കഴിയില്ല’ എന്നത് അക്ഷരാർഥത്തിലെ ‘ഉൾക്കൊള്ളുക’ എന്നതിനെക്കാൾ സന്ദർഭാർഥം വ്യക്തമായി നൽകുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
