id: MAT.19.13
reference: Matthew 19:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τότε ⸀προσηνέχθησαν αὐτῷ παιδία ἵνα τὰς χεῖρας ἐπιθῇ αὐτοῖς καὶ προσεύξηται· οἱ δὲ μαθηταὶ ἐπετίμησαν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/013.yaml
  text: Then children were brought to him so that he might lay his hands on them and pray[a]; but the disciples rebuked them.
translation:
  language: ml
  text: അപ്പോൾ കുട്ടികളെ അവന്റെ അടുക്കൽ കൊണ്ടുവന്നു; അവൻ അവരുടെമേൽ കൈകൾ വെക്കാനും പ്രാർഥിക്കാനും വേണ്ടി. എന്നാൽ ശിഷ്യന്മാർ അവരെ[a] ശാസിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവരെ’ എന്നത് കുട്ടികളെയോ അവരെ കൊണ്ടുവന്നവരെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: Τότε
  choice: അപ്പോൾ
  rationale: കഥയിലെ സംഭവക്രമം സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സംക്ഷിപ്തവുമായ കാലസൂചകം.
- source_word: προσηνέχθησαν αὐτῷ
  choice: അവന്റെ അടുക്കൽ കൊണ്ടുവന്നു
  rationale: പ്രവൃത്തിയുടെ കർത്താവിനെ വ്യക്തമാക്കാതെ, കുട്ടികളെ യേശുവിന്റെ അടുക്കൽ കൊണ്ടുവന്നുവെന്ന ഗ്രീക്ക് നിഷ്ക്രിയരൂപത്തിന്റെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: παιδία
  choice: കുട്ടികൾ
  rationale: പ്രായം അനാവശ്യമായി കൂടുതൽ നിർണയിക്കാതെ παιδία എന്ന പദത്തിന്റെ പൊതുവായ അർഥം നൽകുന്നു.
- source_word: ἵνα τὰς χεῖρας ἐπιθῇ αὐτοῖς
  choice: അവൻ അവരുടെമേൽ കൈകൾ വെക്കേണ്ടതിന്
  rationale: ἵναയുടെ ഉദ്ദേശ്യാർഥവും ‘കൈകൾ വെക്കുക’ എന്ന പ്രയോഗവും നിലനിർത്തുന്നു; ബഹുവചനമായ χεῖρας ‘കൈകൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: καὶ προσεύξηται
  choice: പ്രാർഥിക്കേണ്ടതിന്
  rationale: ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത ‘അവർക്കുവേണ്ടി’ എന്ന കർമബന്ധം ചേർക്കാതെ പ്രാർഥനയുടെ പ്രവൃത്തി മാത്രം നൽകുന്നു.
- source_word: οἱ δὲ μαθηταὶ
  choice: എന്നാൽ ശിഷ്യന്മാർ
  rationale: δέ സൂചിപ്പിക്കുന്ന മൃദുവായ വൈരുധ്യം ‘എന്നാൽ’ എന്നതിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: ἐπετίμησαν αὐτοῖς
  choice: അവരെ ശാസിച്ചു
  rationale: ἐπιτιμάωയുടെ ശക്തി ‘ശാസിച്ചു’ എന്നതിലൂടെ സ്വാഭാവികമായി നൽകുകയും αὐτοῖς ആരെ സൂചിപ്പിക്കുന്നു എന്ന അവ്യക്തത ‘അവരെ’ എന്ന സർവനാമത്തിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: അവസാനത്തെ αὐτοῖς എന്ന സർവനാമത്തിന്റെ സൂചിതർ
  choice: അവരെ
  alternative: കുട്ടികളെ / കുട്ടികളെ കൊണ്ടുവന്നവരെ
  rationale: ഗ്രീക്ക് സർവനാമം കുട്ടികളെയോ അവരെ കൊണ്ടുവന്നവരെയോ സൂചിപ്പിക്കാം. മുഖ്യപാഠത്തിൽ ഒരു വിഭാഗത്തെ തിരഞ്ഞെടുത്ത് അവ്യക്തത പരിഹരിക്കാതെ സർവനാമം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ഗ്രീക്ക് നിഷ്ക്രിയരൂപം അക്ഷരാർഥത്തിൽ അസ്വാഭാവികമായ മലയാള നിഷ്ക്രിയവാക്യമാക്കാതെ, കർത്താവിനെ പറയാത്ത ‘കൊണ്ടുവന്നു’ എന്ന രൂപത്തിൽ നൽകി. ഉദ്ദേശ്യം വ്യക്തമാക്കാൻ വാക്യവിഭജനവും ദീർഘരേഖയും ഉപയോഗിച്ചു.
