revisions:
- from: അപ്പോൾ കുട്ടികളെ അവന്റെ അടുക്കൽ കൊണ്ടുവന്നു—അവൻ അവരുടെമേൽ കൈകൾ വെച്ചു പ്രാർഥിക്കേണ്ടതിന്. എന്നാൽ ശിഷ്യന്മാർ അവരെ[a] ശാസിച്ചു.
  to: അപ്പോൾ കുട്ടികളെ അവന്റെ അടുക്കൽ കൊണ്ടുവന്നു; അവൻ അവരുടെമേൽ കൈകൾ വെക്കാനും പ്രാർഥിക്കാനും വേണ്ടി. എന്നാൽ ശിഷ്യന്മാർ അവരെ[a] ശാസിച്ചു.
