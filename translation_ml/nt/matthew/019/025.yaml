id: MAT.19.25
reference: Matthew 19:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀκούσαντες δὲ οἱ ⸀μαθηταὶ ἐξεπλήσσοντο σφόδρα λέγοντες· Τίς ἄρα δύναται σωθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/025.yaml
  text: When the disciples heard this, they were greatly astonished and said, “Who then can be saved?”
translation:
  language: ml
  text: 'ശിഷ്യന്മാർ ഇതു കേട്ടപ്പോൾ അത്യന്തം വിസ്മയപ്പെട്ടു ചോദിച്ചു: “അങ്ങനെയെങ്കിൽ ആർക്കു രക്ഷിക്കപ്പെടാൻ കഴിയും?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσαντες
  choice: ഇതു കേട്ടപ്പോൾ
  rationale: മുൻപുണ്ടായ യേശുവിന്റെ വാക്കുകളെ സൂചിപ്പിക്കുന്ന സാഹചര്യകാലിക പ്രയോഗമായി aorist participle സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: δὲ
  choice: '[പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല]'
  rationale: δέ ഇവിടെ തുടർച്ചയെയോ നേരിയ ഭിന്നതയെയോ സൂചിപ്പിക്കുന്നു; ‘കേട്ടപ്പോൾ’ എന്ന ഘടന തന്നെ സ്വാഭാവികമായി മാറ്റം അടയാളപ്പെടുത്തുന്നതിനാൽ വേറെ ബന്ധകപദം ആവശ്യമില്ല.
- source_word: οἱ μαθηταὶ
  choice: ശിഷ്യന്മാർ
  rationale: യേശുവിന്റെ μαθηταί എന്നതിന് സുവിശേഷസന്ദർഭത്തിൽ പതിവും വ്യക്തവുമായ മലയാളപദം.
- source_word: ἐξεπλήσσοντο σφόδρα
  choice: അത്യന്തം വിസ്മയിച്ച്
  rationale: അപൂർണ്ണകാലക്രിയയിലെ ശക്തമായ വിസ്മയപ്രതികരണവും σφόδρα നൽകുന്ന തീവ്രതയും സ്വാഭാവികമായി സംയോജിപ്പിക്കുന്നു.
- source_word: λέγοντες
  choice: ചോദിച്ചു
  rationale: പങ്കാളിക്രിയയെ മലയാള ആഖ്യാനത്തിൽ സ്വാഭാവികമായ സമാപികക്രിയയാക്കി; തുടർന്നുവരുന്നത് നേരിട്ടുള്ള ചോദ്യമായതിനാൽ ‘ചോദിച്ചു’ കൃത്യമാണ്.
- source_word: Τίς ἄρα
  choice: അങ്ങനെയെങ്കിൽ ആർക്ക്
  rationale: ἄρα മുൻവാക്കിൽനിന്നുള്ള നിഗമനവും അതിശയവും പ്രകടിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘അങ്ങനെയെങ്കിൽ’ അതിനെ സ്വാഭാവികമായി പകർന്നു നൽകുന്നു. δύναται എന്നതോടുള്ള മലയാള ഘടന കാരണം Τίς ദാതൃരൂപത്തിലുള്ള ‘ആർക്ക്’ ആയി വരുന്നു.
- source_word: δύναται σωθῆναι
  choice: രക്ഷിക്കപ്പെടാൻ കഴിയും
  rationale: കഴിവിനെ സൂചിപ്പിക്കുന്ന δύναταιയും passive infinitive ആയ σωθῆναιയും നിലനിർത്തുന്നു; രക്ഷ എങ്ങനെ സംഭവിക്കുന്നു എന്നത് അധികമായി വിശദീകരിക്കുന്നില്ല.
theological_decisions:
- issue: സന്ദർഭത്തിലെ σωθῆναι എന്നതിന്റെ അർഥം
  choice: രക്ഷിക്കപ്പെടാൻ
  alternative: വിടുവിക്കപ്പെടാൻ / മോചിപ്പിക്കപ്പെടാൻ
  rationale: ദൈവരാജ്യത്തിൽ പ്രവേശിക്കുന്നതിനെക്കുറിച്ചുള്ള തൊട്ടുമുൻപത്തെ സന്ദർഭത്തിൽ ചോദ്യം സമഗ്രമായ രക്ഷയെക്കുറിച്ചാണ്. passive രൂപവും ദൈവശാസ്ത്രപരമായ ഭാരവും നിലനിർത്തിക്കൊണ്ട് രക്ഷയുടെ മാർഗം പ്രത്യേകം നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അത്യന്തം’ ശക്തമായ വിസ്മയം നിലനിർത്തുന്നു; ‘അങ്ങനെയെങ്കിൽ’ ശിഷ്യന്മാരുടെ നിഗമനാത്മക പ്രതികരണം വ്യക്തമായി നൽകുന്നു.
