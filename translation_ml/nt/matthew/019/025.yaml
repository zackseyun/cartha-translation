- from: 'ശിഷ്യന്മാർ ഇതു കേട്ടപ്പോൾ അത്യന്തം വിസ്മയിച്ച് ചോദിച്ചു: “അങ്ങനെയെങ്കിൽ ആർക്ക് രക്ഷിക്കപ്പെടാൻ കഴിയും?”'
  to: 'ശിഷ്യന്മാർ ഇതു കേട്ടപ്പോൾ അത്യന്തം വിസ്മയപ്പെട്ടു ചോദിച്ചു: “അങ്ങനെയെങ്കിൽ ആർക്കു രക്ഷിക്കപ്പെടാൻ കഴിയും?”'
