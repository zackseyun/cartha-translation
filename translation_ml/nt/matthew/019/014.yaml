id: MAT.19.14
reference: Matthew 19:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἄφετε τὰ παιδία καὶ μὴ κωλύετε αὐτὰ ἐλθεῖν πρός με, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/014.yaml
  text: But Jesus said[a], “Let the children come, and do not hinder them from coming to me[b], for the kingdom of heaven belongs to such as these.”
translation:
  language: ml
  text: 'എന്നാൽ യേശു പറഞ്ഞു: “കുട്ടികളെ എന്റെ അടുക്കൽ വരാൻ അനുവദിക്കൂ; അവരെ എന്റെ അടുക്കൽ വരുന്നതിൽ തടയരുത്. എന്തെന്നാൽ സ്വർഗരാജ്യം ഇങ്ങനെയുള്ളവരുടേതാണ്.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഇങ്ങനെയുള്ളവർ” എന്നത് അവിടെ ഉണ്ടായിരുന്ന കുട്ടികളെ മാത്രമല്ല, അവരെപ്പോലുള്ളവരെയും സൂചിപ്പിക്കാം; ഏത് ഗുണമാണ് ഉദ്ദേശിക്കുന്നതെന്ന് വാക്യം വ്യക്തമാക്കുന്നില്ല.
    reason: preserved_ambiguity
lexical_decisions:
- source_word: Ἄφετε
  choice: അനുവദിക്കൂ
  rationale: ഇവിടെ ἀφίημι എന്ന ക്രിയയുടെ കല്പനാരൂപം ‘വിട്ടുകളയുക’ എന്നതിലുപരി വരാൻ അനുമതി നൽകുക എന്ന അർഥത്തിലാണ്; ആ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: τὰ παιδία
  choice: കുട്ടികളെ
  rationale: പദം സാധാരണയായി കുട്ടികളെയും പലപ്പോഴും ചെറിയ കുട്ടികളെയും സൂചിപ്പിക്കാം; പ്രായം അനാവശ്യമായി ചുരുക്കാതെ വിശാലമായ അർഥം നിലനിർത്തുന്നു.
- source_word: μὴ κωλύετε
  choice: അവരെ തടയരുത്
  rationale: κωλύω എന്നതിന്റെ തടയുക/വിലക്കുക എന്ന പൊതുവായ ശക്തി നിലനിർത്തുകയും സന്ദർഭത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: αὐτὰ ἐλθεῖν πρός με
  choice: എന്റെ അടുക്കൽ വരാൻ
  rationale: πρός με എന്നത് യേശുവിന്റെ അടുക്കലേക്കുള്ള വരവ് സൂചിപ്പിക്കുന്നു; കർത്താവായ ‘അവരെ’ അടുത്ത വാക്യഭാഗത്തിൽ വ്യക്തമായി ചേർത്തിരിക്കുന്നു.
- source_word: τῶν γὰρ τοιούτων
  choice: എന്തെന്നാൽ ... ഇങ്ങനെയുള്ളവരുടേതാണ്
  rationale: τοιούτων സന്നിഹിതരായ കുട്ടികളെ മാത്രം അല്ല, അവരെപ്പോലുള്ള ഒരു വിഭാഗത്തെയും സൂചിപ്പിക്കാൻ കഴിയും; ‘ഇങ്ങനെയുള്ളവർ’ ആ പ്രതിനിധാനപരമായ തുറന്ന അർഥം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: സ്വർഗരാജ്യം
  rationale: മത്തായിയുടെ സവിശേഷ പ്രയോഗത്തിന് മലയാളത്തിൽ സ്ഥാപിതവും സ്വാഭാവികവുമായ തുല്യപദമാണിത്.
- source_word: ἐστὶν
  choice: ഉടേതാണ്
  rationale: ഗ്രീക്കിലെ ‘ഇങ്ങനെയുള്ളവരുടെതാണ് രാജ്യം’ എന്ന ഉടമസ്ഥതാസദൃശമായ നിർമ്മിതിയെ വ്യക്തവും സംക്ഷിപ്തവുമായി പകരുന്നു; വെറും ‘ആണ്’ എന്ന അസ്വാഭാവിക രൂപം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: യേശു ഇവിടെ സാക്ഷാൽ കുട്ടികളെ മാത്രം ഉദ്ദേശിക്കുന്നുവോ, അതോ അവരെപ്പോലുള്ളവരെയും ഉൾപ്പെടുത്തുന്നുവോ
  choice: ‘ഇങ്ങനെയുള്ളവരുടേതാണ്’ എന്ന് വിവർത്തനം ചെയ്ത് ഉടൻ സന്നിഹിതരായ കുട്ടികളെയും അവരെ പ്രതിനിധികളാക്കുന്ന വിശാല വിഭാഗത്തെയും ഉൾക്കൊള്ളാവുന്ന വിധം നിലനിർത്തി.
  alternative: ‘ഈ കുട്ടികളുടേതാണ്’ എന്ന ചുരുങ്ങിയ വായന; അല്ലെങ്കിൽ ‘കുട്ടികളെപ്പോലെയുള്ളവരുടേതാണ്’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക വായന.
  rationale: τοιούτων ഒരു തരത്തിലോ സ്വഭാവത്തിലോ ഉള്ളവരെ സൂചിപ്പിക്കുന്നു, എന്നാൽ ആ സ്വഭാവം എന്താണെന്ന് വാക്യം നിർവചിക്കുന്നില്ല. അതിനാൽ കുട്ടികളിലെ ഏതെങ്കിലും പ്രത്യേക ഗുണം വിവർത്തനം തന്നെ നിർണ്ണയിക്കാതെ മൂലത്തിലെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും മാന്യവുമായ നേരിട്ടുള്ള കല്പനാശൈലി ഉപയോഗിച്ചു. ‘എന്റെ അടുക്കൽ’ ബൈബിൾഭാഷയുടെ ഗൗരവം നിലനിർത്തുമ്പോഴും പൊതുവായ വായനക്കാർക്ക് വ്യക്തമാണ്. ‘ഇങ്ങനെയുള്ളവർ’ എന്ന രൂപം വിശദീകരണം അമിതമായി ചേർക്കാതെ മൂലത്തിലെ പ്രതിനിധാനപരമായ അസ്പഷ്ടത സംരക്ഷിക്കുന്നു.
