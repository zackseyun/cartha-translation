review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the exception clause, remarriage clause, and included bracketed final clause. However, ‘ഉപേക്ഷിക്കുക/ഉപേക്ഷിക്കപ്പെട്ട’ can mean simply abandon or leave and does not consistently convey the marital-legal sense of ἀπολύω in this context. Explicit divorce terminology better reflects both ἀπολύσῃ and the perfect passive ἀπολελυμένην.
  naturalness: The sentence is readable modern Malayalam. Replacing the potentially broad ‘ഉപേക്ഷിക്കുക’ wording with ‘വിവാഹമോചനം ചെയ്യുക’ and ‘വിവാഹമോചനം ലഭിച്ച’ makes the intended marital sense clear and remains natural in a formal Bible register.
  terminology: ‘ലൈംഗിക അധാർമികത’ appropriately retains the broad scope of πορνεία without equating it narrowly with μοιχεία (‘വ്യഭിചാരം’). ‘വ്യഭിചാരം ചെയ്യുന്നു’ suitably renders μοιχᾶται. The revised divorce terms distinguish ἀπολύω from a nontechnical abandonment.
  issues:
  - severity: medium
    issue: ‘ഉപേക്ഷിക്കുകയും’ and ‘ഉപേക്ഷിക്കപ്പെട്ട സ്ത്രീ’ are semantically broader than the marital meaning in the Greek.
    rationale: In Matthew 19:9, ἀπολύω and ἀπολελυμένην refer to divorce and a divorced woman, not merely leaving or abandonment. The existing wording can obscure that specific sense in modern Malayalam.
