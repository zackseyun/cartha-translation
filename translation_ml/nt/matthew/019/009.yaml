id: MAT.19.9
reference: Matthew 19:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ⸀ὅτι ὃς ἂν ἀπολύσῃ τὴν γυναῖκα αὐτοῦ μὴ ἐπὶ πορνείᾳ καὶ γαμήσῃ ἄλλην μοιχᾶται ⸂καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/009.yaml
  text: But I tell you that whoever divorces his wife[a], except for sexual immorality, and marries another, commits adultery[b]; and whoever marries a divorced woman commits adultery.
translation:
  language: ml
  text: 'എന്നാൽ ഞാൻ നിങ്ങളോടു പറയുന്നു: ലൈംഗിക അധാർമികത നിമിത്തമല്ലാതെ[a] സ്വന്തം ഭാര്യയെ വിവാഹമോചനം ചെയ്യുകയും മറ്റൊരുവളെ വിവാഹം കഴിക്കുകയും ചെയ്യുന്നവൻ വ്യഭിചാരം ചെയ്യുന്നു; വിവാഹമോചനം ലഭിച്ച സ്ത്രീയെ വിവാഹം കഴിക്കുന്നവനും വ്യഭിചാരം ചെയ്യുന്നു.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ലൈംഗിക അധാർമികതയുടെ അടിസ്ഥാനത്തിലല്ലാതെ.” ഗ്രീക്ക് പ്രയോഗത്തെ കൂടുതൽ ചുരുങ്ങിയ അർത്ഥത്തിൽ “പരസംഗം നിമിത്തമല്ലാതെ” എന്നും ചിലർ “ലൈംഗിക അവിശ്വസ്തത നിമിത്തമല്ലാതെ” എന്നും മനസ്സിലാക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “വിവാഹമോചനം ലഭിച്ച സ്ത്രീയെ വിവാഹം കഴിക്കുന്നവനും വ്യഭിചാരം ചെയ്യുന്നു” എന്ന വാക്യഭാഗം ചില കൈയെഴുത്തുപ്രതികളിൽ ഇല്ല.
    reason: textual_variant
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: എന്നാൽ ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: δέ ഇവിടെ മുൻസംഭാഷണത്തോടുള്ള മൃദുവായ വൈരുധ്യവും തുടർച്ചയും സൂചിപ്പിക്കുന്നു; λέγω ὑμῖν എന്ന പ്രയോഗത്തിന്റെ അധികാരപൂർണമായ സ്വരം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὃς ἂν
  choice: ചെയ്യുന്നവൻ
  rationale: അനിശ്ചിതവും പൊതുവുമായ വ്യവസ്ഥ മലയാളത്തിലെ ബന്ധവാക്യഘടനയിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: ἀπολύσῃ τὴν γυναῖκα αὐτοῦ
  choice: സ്വന്തം ഭാര്യയെ ഉപേക്ഷിക്കുകയും
  rationale: വിവാഹസന്ദർഭത്തിൽ ἀπολύω വിവാഹബന്ധം വേർപെടുത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ഉപേക്ഷിക്കുക’ എന്ന ബൈബിൾ-മലയാള പ്രയോഗം അയച്ചുകളയലിന്റെയും വിവാഹമോചനത്തിന്റെയും ഭാവം നിലനിർത്തുന്നു; നിയമപരമായ നടപടിയിലേക്ക് മാത്രം അർത്ഥം ചുരുക്കുന്നില്ല.
- source_word: μὴ ἐπὶ πορνείᾳ
  choice: ലൈംഗിക അധാർമികത നിമിത്തമല്ലാതെ
  rationale: πορνείαയെ ‘വ്യഭിചാരം’ എന്ന ഒറ്റ അർത്ഥത്തിലേക്ക് ചുരുക്കാതെ അതിന്റെ വിശാലമായ ലൈംഗിക അനാചാരപരിധി സംരക്ഷിക്കുന്നു. ἐπίയുടെ കാരണാധിഷ്ഠിത ഭാവം ‘നിമിത്തം’ വ്യക്തമാക്കുന്നു.
- source_word: γαμήσῃ ἄλλην
  choice: മറ്റൊരുവളെ വിവാഹം കഴിക്കുകയും
  rationale: ἄλλην സ്ത്രീലിംഗമാണെന്നത് ‘മറ്റൊരുവളെ’ വഴി വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: μοιχᾶται
  choice: വ്യഭിചാരം ചെയ്യുന്നു
  rationale: ക്രിയയുടെ നൈതികവും വിവാഹബന്ധപരവുമായ അർത്ഥം ആധുനിക മലയാളത്തിൽ നേരിട്ട് നൽകുന്നു.
- source_word: καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται
  choice: ഉപേക്ഷിക്കപ്പെട്ട സ്ത്രീയെ വിവാഹം കഴിക്കുന്നവനും വ്യഭിചാരം ചെയ്യുന്നു
  rationale: ആർട്ടിക്കിളോടുകൂടിയ കൃദന്തരൂപത്തിന്റെ പൊതുവായ അർത്ഥവും ἀπολελυμένην എന്ന പൂർത്തകാല കർമണിപ്രയോഗത്തിന്റെ ഫലസ്ഥിതിയും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ഒഴിവുവ്യവസ്ഥയിലെ πορνείαയുടെ അർത്ഥം
  choice: ലൈംഗിക അധാർമികത
  alternative: പരസംഗം; വ്യഭിചാരം; ലൈംഗിക അവിശ്വസ്തത
  rationale: πορνείαയ്ക്ക് μοιχείαയെക്കാൾ വിശാലമായ അർത്ഥപരിധിയുണ്ട്. വിശാലമായ പരിഭാഷ പദത്തെ ഒരു പ്രത്യേക സഭാപരമായ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതെ യഥാർത്ഥ ഭാഷയിലെ വ്യാപ്തിയും വ്യാഖ്യാനപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
- issue: καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται എന്ന അവസാന വാക്യഭാഗത്തിന്റെ ഉൾപ്പെടുത്തൽ
  choice: മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി പാഠഭേദം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു
  alternative: ചില കൈയെഴുത്തുപ്രതികളെ പിന്തുടർന്ന് ഒഴിവാക്കുക
  rationale: നൽകിയ SBLGNT പാഠത്തിൽ ഈ വാക്യഭാഗം പാഠഭേദചിഹ്നങ്ങളോടെ ഉൾപ്പെട്ടിരിക്കുന്നതിനാൽ അത് പരിഭാഷപ്പെടുത്തുകയും കൈയെഴുത്തുപ്രതി വ്യത്യാസം സുതാര്യമായി സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വാക്യത്തിന്റെ നിയമ-നൈതിക ഗൗരവം നിലനിർത്തിയിട്ടുണ്ട്. ‘ലൈംഗിക അധാർമികത’ πορνείαയുടെ വിശാലത സംരക്ഷിക്കുന്നു; ‘ഉപേക്ഷിക്കുക’ ἀπολύωയുടെ വിവാഹസന്ദർഭാർഥം നിയമപരമായ ‘വിവാഹമോചനം’ എന്നതിലേക്ക് മാത്രം ചുരുക്കാതെ നൽകുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ നൽകിയിട്ടുണ്ട്.
