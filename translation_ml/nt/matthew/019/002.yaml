id: MAT.19.2
reference: Matthew 19:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἠκολούθησαν αὐτῷ ὄχλοι πολλοί, καὶ ἐθεράπευσεν αὐτοὺς ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/002.yaml
  text: And large crowds followed him, and he healed them there.
translation:
  language: ml
  text: വലിയ ജനക്കൂട്ടങ്ങൾ അദ്ദേഹത്തെ അനുഗമിച്ചു; അവിടെവെച്ച് അദ്ദേഹം അവരെ സൗഖ്യമാക്കി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠκολούθησαν
  choice: അനുഗമിച്ചു
  rationale: ἀκολουθέω എന്ന ക്രിയയുടെ ആഖ്യാനസന്ദർഭത്തിലെ നേരിട്ടുള്ള അർഥം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു; സന്ദർഭം പറയുന്നതിലധികമായ ശിഷ്യത്വസൂചന ചേർക്കുന്നില്ല.
- source_word: αὐτῷ
  choice: അദ്ദേഹത്തെ
  rationale: ἀκολουθέω ദത്തിവിഭക്തിയിലുള്ള വ്യക്തിയെ സ്വീകരിക്കുന്നുവെങ്കിലും മലയാള പ്രയോഗത്തിൽ ‘അനുഗമിക്കുക’ എന്ന ക്രിയയോടൊപ്പം കർമരൂപമാണ് സ്വാഭാവികം.
- source_word: ὄχλοι πολλοί
  choice: വലിയ ജനക്കൂട്ടങ്ങൾ
  rationale: പദാനുപദമായി ‘അനേകം ജനക്കൂട്ടങ്ങൾ’ എന്നാകാമെങ്കിലും, ആളുകളുടെ വലിയ കൂട്ടങ്ങളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമായി ഇത് തിരഞ്ഞെടുത്തു.
- source_word: ἐθεράπευσεν
  choice: സൗഖ്യമാക്കി
  rationale: രോഗശാന്തിയുടെ സുവിശേഷാഖ്യാനസന്ദർഭത്തിൽ θεραπεύω എന്നതിന്റെ വ്യക്തവും പതിവുമായ മലയാള തുല്യപദം.
- source_word: αὐτούς
  choice: അവരെ
  rationale: ബഹുവചന സർവനാമം മുൻപുള്ള ജനക്കൂട്ടങ്ങളിലെ ആളുകളെ സൂചിപ്പിക്കുന്ന വിധത്തിൽ നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: ἐκεῖ
  choice: അവിടെവെച്ച്
  rationale: സ്ഥലസൂചനയായ ‘അവിടെ’ എന്ന അർഥം നിലനിർത്തുകയും അതേ സ്ഥലത്താണ് സൗഖ്യമാക്കിയത് എന്ന ആഖ്യാനബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: καὶ ... καὶ
  choice: …; …
  rationale: ആദ്യ καί മുൻവാക്യത്തിൽനിന്നുള്ള തുടർച്ചയും രണ്ടാമത്തേത് രണ്ടു സംഭവങ്ങളുടെ ഏകോപനവും സൂചിപ്പിക്കുന്നു. ഒറ്റവാക്യത്തിൽ അർധവിരാമം ഉപയോഗിക്കുന്നത് ആവർത്തിച്ച ‘യും’ മൂലമുള്ള അസ്വാഭാവികത ഒഴിവാക്കി ഗ്രീക്കിലെ ലളിതമായ ആഖ്യാനക്രമം നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, മാന്യമായ സുവിശേഷാഖ്യാനശൈലി. ‘അദ്ദേഹം’ എന്ന ആദരസൂചക സർവനാമം മലയാളത്തിലെ സ്വാഭാവിക യേശു-പരാമർശരീതി അനുസരിക്കുന്നു.
