id: MAT.19.5
reference: Matthew 19:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἶπεν· ⸀Ἕνεκα τούτου καταλείψει ἄνθρωπος τὸν πατέρα καὶ τὴν μητέρα καὶ ⸀κολληθήσεται τῇ γυναικὶ αὐτοῦ, καὶ ἔσονται οἱ δύο εἰς σάρκα μίαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/005.yaml
  text: and said[a], ‘For this reason a man will leave his father and mother and be joined to his wife, and the two will become one flesh.’
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “അതുകൊണ്ട് ഒരു പുരുഷൻ തന്റെ അപ്പനെയും അമ്മയെയും വിട്ട് ഭാര്യയോടു ചേരും; ഇരുവരും ഒരു ദേഹമായിത്തീരും?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἕνεκα τούτου
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ സൃഷ്ടിക്രമത്തെ അടിസ്ഥാനമാക്കിയുള്ള കാരണബന്ധവും നിഗമനഭാവവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: καταλείψει
  choice: വിട്ട്
  rationale: ഭാവിക്രിയയുടെ ആശയം തുടർന്നുള്ള ‘ചേർന്നിരിക്കും’ എന്ന ക്രിയയോടൊപ്പം സ്വാഭാവികമായി പ്രകടമാകുന്നു; മാതാപിതാക്കളുമായുള്ള എല്ലാ ബന്ധവും ഉപേക്ഷിക്കുന്നു എന്ന അതിരുകടന്ന അർഥം വരുത്തുന്നില്ല.
- source_word: ἄνθρωπος
  choice: ഒരു പുരുഷൻ
  rationale: ഈ വിവാഹസന്ദർഭത്തിൽ ഭാര്യയോടു ചേരുന്ന പുരുഷപങ്കാളിയെയാണ് പദം സൂചിപ്പിക്കുന്നത്; അതിനാൽ ലിംഗനിരപേക്ഷമായ ‘ഒരു വ്യക്തി’ എന്നതിനെക്കാൾ ‘ഒരു പുരുഷൻ’ കൃത്യമാണ്.
- source_word: κολληθήσεται
  choice: ചേർന്നിരിക്കും
  rationale: വെറും സമീപസ്ഥതയല്ല, ഉറച്ച അടുപ്പവും ബന്ധവും സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ക്രിയയുടെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; കർത്തരി രൂപമുള്ള മലയാളപ്രയോഗം ഗ്രീക്കിലെ ദൈവിക കർമണി രൂപത്തിന്റെ കർത്താവിനെ അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: γυναικὶ αὐτοῦ
  choice: ഭാര്യയോടു
  rationale: γυνή എന്നതിന് സ്ത്രീ എന്നും ഭാര്യ എന്നും അർഥമുണ്ടെങ്കിലും വിവാഹസന്ദർഭത്തിൽ ‘ഭാര്യ’ തന്നെയാണ് ആവശ്യമായ അർഥം.
- source_word: οἱ δύο
  choice: ഇരുവരും
  rationale: ഗ്രീക്കിലെ വ്യക്തമായ ‘രണ്ടുപേർ’ എന്ന ആശയം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: εἰς σάρκα μίαν
  choice: ഒരേ ശരീരമായിത്തീരും
  rationale: εἰς സൂചിപ്പിക്കുന്ന ഫലത്തിലേക്കുള്ള മാറ്റം ‘ആയിത്തീരും’ പ്രകടമാക്കുന്നു; σάρξ എന്ന വിവാഹഐക്യത്തിന്റെ ദേഹപരവും ബന്ധപരവുമായ പ്രയോഗം ‘ശരീരം’ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: വിവാഹഉദ്ധരണിയിലെ ലിംഗസൂചക ഭാഷ
  choice: ഒരു പുരുഷൻ ... ഭാര്യ
  alternative: ഒരു വ്യക്തി ... ജീവിതപങ്കാളി
  rationale: ഉല്പത്തി ഉദ്ധരണിയുടെ പുരുഷ-സ്ത്രീ വിവാഹരൂപം ഉറവിടപാഠത്തിൽ വ്യക്തമായതിനാൽ അത് ലിംഗനിരപേക്ഷമാക്കാതെ സംരക്ഷിച്ചു.
- issue: വിവാഹഐക്യത്തിന്റെ പ്രയോഗം
  choice: ഇരുവരും ഒരേ ശരീരമായിത്തീരും
  alternative: ഇരുവരും ഒരു ശരീരമായിരിക്കും
  rationale: ἔσονται ... εἰς എന്ന ഘടന ഐക്യത്തിന്റെ ഫലത്തിലേക്കുള്ള പ്രവേശനം സൂചിപ്പിക്കുന്നതിനാൽ ‘ആയിത്തീരും’ തിരഞ്ഞെടുത്തു; ഇതിലൂടെ ദേഹപരവും ബന്ധപരവുമായ ഗൗരവം വ്യാഖ്യാനാതിശയമില്ലാതെ നിലനിൽക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അപ്പൻ’, ‘അമ്മ’ എന്നീ സാധാരണവും ഗൗരവയോഗ്യവുമായ ബന്ധപദങ്ങളും തിരുവെഴുത്ത് ഉദ്ധരണിയുടെ ഭാരം നിലനിർത്തുന്ന ‘ഒരേ ശരീരം’ എന്ന പ്രയോഗവും ഉപയോഗിച്ചു. ചോദ്യചിഹ്നം സാക്ഷ്യങ്ങളിൽ കാണുന്ന ഉദ്ധരണി-ചോദ്യത്തിന്റെ അവസാനമായി മനസ്സിലാക്കാവുന്നതാണെങ്കിലും, വാക്യം 4-ൽ ആരംഭിച്ച യേശുവിന്റെ ചോദ്യത്തിനുള്ളിൽ വരുന്ന വാക്യം 5 എന്ന നിലയിൽ നൽകിയ പാഠഭാഗം പ്രഖ്യാപനരൂപത്തിൽ അവസാനിപ്പിച്ചു.
