  text: πολλοὶ δὲ ἔσονται πρῶτοι ἔσχατοι καὶ ἔσχατοι πρῶτοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/030.yaml
  text: But many who are first will be last[a], and the last first.
translation:
  language: ml
  text: എന്നാൽ ആദ്യരായ പലരും അവസാനത്തവരാകും[a]; അവസാനത്തവർ ആദ്യരാകും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “എന്നാൽ പല ആദ്യർ അവസാനത്തവരും അവസാനത്തവർ ആദ്യരും ആകും.” ഗ്രീക്ക് വാക്യം ശ്രദ്ധേയമായി സംക്ഷിപ്തവും ചൊല്ലുപോലെയുള്ളതുമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: പലരും
  rationale: വിശേഷണം നാമപദമായി പ്രവർത്തിച്ച് വ്യക്തികളെ പൊതുവായി സൂചിപ്പിക്കുന്നു. ‘പലരും’ എന്നത് സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻചർച്ചയോടുള്ള മൃദുവായ വൈരുധ്യം സൂചിപ്പിക്കുന്നു; ആ ഭാവം ‘എന്നാൽ’ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἔσονται
  choice: ആകും
  rationale: εἰμί എന്ന ക്രിയയുടെ ഭാവികാലരൂപം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി ‘ആകും’ എന്നു പരിഭാഷപ്പെടുന്നു.
- source_word: πρῶτοι
  choice: ഒന്നാമർ
  rationale: കാലക്രമത്തേക്കാൾ സ്ഥാനത്തെയോ പദവിയെയോ സൂചിപ്പിക്കുന്ന വിശാലമായ അർഥം നിലനിർത്തുകയും ചൊല്ലിന്റെ പ്രതിബലത്തിന് യോജിക്കുകയും ചെയ്യുന്നു.
- source_word: ἔσχατοι
  choice: അവസാനക്കാർ
  rationale: πρῶτοι എന്നതിനോടുള്ള നേരിട്ടുള്ള വൈരുധ്യം നിലനിർത്തി സ്ഥാനക്രമത്തിന്റെ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: πρῶτοι ἔσχατοι
  choice: ഒന്നാമരായ പലരും അവസാനക്കാരാകും
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്ത വിശേഷണക്രമം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാക്കാൻ ‘ആയ’ എന്ന ബന്ധരൂപവും ക്രിയയും ഉപയോഗിക്കുന്നു; അധിക അർഥം ചേർക്കുന്നില്ല.
- source_word: καὶ ἔσχατοι πρῶτοι
  choice: അവസാനക്കാരോ ഒന്നാമരാകും
  rationale: രണ്ടാം ഘടകത്തിലെ ശക്തമായ മറിച്ചിടൽ മലയാളത്തിലെ ‘-ഓ’ ഘടനയിലൂടെ സംക്ഷിപ്തമായി പ്രകടമാക്കുന്നു; വ്യക്തതയ്ക്കായി ഗ്രീക്കിൽ അധ്യാഹരിക്കപ്പെട്ടിരിക്കുന്ന ക്രിയ ആവർത്തിക്കുന്നു.
theological_decisions:
- issue: മറിച്ചിടൽവാക്യത്തിന്റെ വ്യാപ്തി
  choice: സ്ഥാനം അഥവാ ക്രമം മറിഞ്ഞുപോകുന്നതിനെക്കുറിച്ചുള്ള പൊതുവായ പ്രസ്താവനയായി നിലനിർത്തി.
  alternative: രാജ്യപ്രവേശനം, ശിഷ്യന്മാരുടെ പ്രതിഫലം, സാമൂഹികപദവി, അല്ലെങ്കിൽ അന്ത്യകാലസ്ഥാനക്രമം എന്നിവയിൽ ഏതെങ്കിലും ഒന്നിനെ മാത്രം സൂചിപ്പിക്കുന്നതായി വ്യക്തമാക്കുക.
  rationale: വാക്യം തന്നെ മറിച്ചിടലിന്റെ കൃത്യമായ പരിധി നിർവചിക്കുന്നില്ല. അതിനാൽ പ്രത്യേക സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കാതെ അതിന്റെ വിശാലവും ചൊല്ലുപോലെയുള്ളതുമായ സ്വഭാവം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഒന്നാമർ/അവസാനക്കാർ’ എന്ന നേരിട്ടുള്ള വിരുദ്ധജോടി മൂലപാഠത്തിന്റെ ചൊല്ലുസ്വഭാവം നിലനിർത്തുന്നു; രണ്ടാം ഘടകത്തിൽ ക്രിയ ആവർത്തിക്കുന്നത് മലയാളത്തിലെ വ്യക്തതയ്ക്കായാണ്.
