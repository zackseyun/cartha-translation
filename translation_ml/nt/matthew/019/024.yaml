id: MAT.19.24
reference: Matthew 19:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πάλιν δὲ λέγω ὑμῖν, εὐκοπώτερόν ἐστιν κάμηλον διὰ ⸀τρυπήματος ῥαφίδος ⸀εἰσελθεῖν ἢ πλούσιον ⸂εἰς τὴν βασιλείαν τοῦ θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/024.yaml
  text: Again I tell you[b][a], it is easier for a camel to go through the eye of a needle than for a rich man to enter into the kingdom of God.
translation:
  language: ml
  text: 'വീണ്ടും ഞാൻ നിങ്ങളോടു പറയുന്നു: ഒരു ധനികൻ ദൈവരാജ്യത്തിൽ പ്രവേശിക്കുന്നതിനെക്കാൾ ഒരു ഒട്ടകം സൂചിക്കണ്ണിലൂടെ കടക്കുന്നത് എളുപ്പമാണ്.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചിലർ ‘ഒട്ടകം’ എന്നതിനുപകരം ‘കയർ’ എന്നു നിർദേശിച്ചിട്ടുണ്ട്; എന്നാൽ ഇവിടെയുള്ള ഗ്രീക്ക് പാഠം ‘ഒട്ടകം’ എന്നാണ് വായിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: πάλιν δὲ λέγω ὑμῖν
  choice: വീണ്ടും ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: πάλιν ആവർത്തനത്തെ സൂചിപ്പിക്കുന്നു; δέ ഇവിടെ മൃദുവായ ബന്ധകമായതിനാൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്താതെ സ്വാഭാവിക മലയാളത്തിൽ ആശയം നിലനിർത്തുന്നു. λέγω ὑμῖν നേരിട്ടുള്ള അഭിസംബോധനയായി വിവർത്തനം ചെയ്തു.
- source_word: εὐκοπώτερόν ἐστιν
  choice: എളുപ്പമാണ്
  rationale: രണ്ട് infinitive ഘടനകളെ താരതമ്യം ചെയ്യുന്ന εὐκοπώτερον എന്ന പദത്തിന്റെ സ്വാഭാവികവും കൃത്യവുമായ മലയാള തുല്യം.
- source_word: κάμηλον
  choice: ഒരു ഒട്ടകം
  rationale: ഗ്രീക്ക് പാഠത്തിലെ κάμηλος എന്നത് ‘ഒട്ടകം’ എന്നാണ്; ‘കയർ’ എന്ന നിർദേശം ഈ പാഠത്തിന്റെ സാക്ഷ്യത്തെ പ്രതിനിധീകരിക്കുന്നില്ല.
- source_word: διὰ τρυπήματος ῥαφίδος
  choice: സൂചിക്കണ്ണിലൂടെ
  rationale: തുന്നൽസൂചിയുടെ ദ്വാരത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി ‘സൂചിക്കണ്ണ്’ എന്നു നൽകുന്നു.
- source_word: εἰσελθεῖν
  choice: കടക്കുന്നത് / പ്രവേശിക്കുന്നത്
  rationale: ഒട്ടകത്തിന്റെ ദൃശ്യത്തിൽ ‘കടക്കുക’ എന്നും ദൈവരാജ്യത്തെ സംബന്ധിച്ച് ‘പ്രവേശിക്കുക’ എന്നും ഒരേ ഗ്രീക്ക് infinitive-ന്റെ സന്ദർഭോചിത മലയാളരൂപങ്ങൾ ഉപയോഗിച്ചു.
- source_word: ἢ πλούσιον
  choice: ഒരു ധനികൻ ... എന്നതിനെക്കാൾ
  rationale: πλούσιον ധനികനായ വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; താരതമ്യഘടന മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തി.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: ദൈവരാജ്യത്തിൽ പ്രവേശിക്കുന്നത്
  rationale: εἰς സൂചിപ്പിക്കുന്ന ലക്ഷ്യഗതിയും βασιλεία τοῦ θεοῦ എന്ന കേന്ദ്രപ്രയോഗവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ഒട്ടകം–സൂചിക്കണ്ണ് ദൃശ്യത്തിന്റെ വ്യാഖ്യാനം
  choice: ഗ്രീക്ക് പാഠത്തിലെ ശക്തമായ അതിശയോക്തിപരമായ അസാധ്യതാദൃശ്യം അതേപടി നിലനിർത്തി.
  alternative: ‘സൂചിവാതിൽ’ എന്നറിയപ്പെടുന്ന ഒരു പ്രത്യേക യെരൂശലേം കവാടത്തെക്കുറിച്ചുള്ള സൂചനയായി വ്യാഖ്യാനിക്കുക, അല്ലെങ്കിൽ ‘ഒട്ടകം’ എന്നതിനു പകരം ‘കയർ’ വായിക്കുക.
  rationale: പാഠം നേരിട്ട് ഒട്ടകത്തെയും തുന്നൽസൂചിയുടെ കണ്ണിനെയും പറയുന്നു. ദൃശ്യത്തെ മൃദൂകരിക്കുകയോ പാഠത്തിൽ ഇല്ലാത്ത ചരിത്രവിശദീകരണം ചേർക്കുകയോ ചെയ്യാതെ അതിന്റെ ദൈവശാസ്ത്രപരമായ ഞെട്ടലും പിരിമുറുക്കവും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. ‘സൂചിക്കണ്ണ്’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പ്രയോഗമാണ്. ഇംഗ്ലീഷ് consultation layer-ലെ ആവർത്തനപരമായ ‘needle's eye’ പാദക്കുറിപ്പ് മലയാളത്തിൽ പ്രത്യേക അർത്ഥവ്യത്യാസം സൃഷ്ടിക്കാത്തതിനാൽ ഉൾപ്പെടുത്തിയിട്ടില്ല; ഉൾപ്പെടുത്തിയ ഏക പാദക്കുറിപ്പിന്റെ [a] അടയാളം മുഖ്യപാഠത്തിൽ നൽകിയിട്ടുണ്ട്.
