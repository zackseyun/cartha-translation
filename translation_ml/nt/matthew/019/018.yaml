reference: Matthew 19:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγει αὐτῷ· Ποίας; ὁ δὲ Ἰησοῦς ⸀εἶπεν· Τὸ Οὐ φονεύσεις, Οὐ μοιχεύσεις, Οὐ κλέψεις, Οὐ ψευδομαρτυρήσεις,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/018.yaml
  text: 'He says to him, “Which ones?” And Jesus said, “The: You shall not murder, you shall not commit adultery, you shall not steal, you shall not bear false witness,”'
translation:
  language: ml
  text: 'അവൻ യേശുവിനോടു, “ഏതൊക്കെയാണ്?” എന്നു ചോദിച്ചു. യേശു പറഞ്ഞു: “ഇവയാണ്: കൊല ചെയ്യരുത്; വ്യഭിചാരം ചെയ്യരുത്; മോഷ്ടിക്കരുത്; കള്ളസാക്ഷ്യം പറയരുത്,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ποίας
  choice: ഏതൊക്കെയാണ്?
  rationale: സ്ത്രീലിംഗ ബഹുവചനമായ ചോദ്യം സന്ദർഭത്തിലെ കൽപ്പനകളെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി ബഹുവചനാർഥം നിലനിർത്തുന്നു.
- source_word: Τὸ
  choice: 'ഇവയാണ്:'
  rationale: ഗ്രീക്കിലെ ഏകവചന നപുംസക നിർദ്ദേശക ആർട്ടിക്കിൾ തുടർന്ന് വരുന്ന കൽപ്പനകളുടെ പട്ടികയെ അവതരിപ്പിക്കുന്നു. അക്ഷരാർഥത്തിലുള്ള അസ്വാഭാവികമായ ‘അത്’ എന്നതിനു പകരം പട്ടികാരംഭം വ്യക്തമാക്കുന്നു.
- source_word: Οὐ φονεύσεις
  choice: കൊല ചെയ്യരുത്
  rationale: φονεύω അന്യായമായി മനുഷ്യനെ കൊല്ലുന്നതിനെ സൂചിപ്പിക്കുന്നതിനാൽ പൊതുവായ ‘കൊല്ലരുത്’ എന്നതിനെക്കാൾ ‘കൊല ചെയ്യരുത്’ കൃത്യമാണ്.
- source_word: Οὐ μοιχεύσεις
  choice: വ്യഭിചാരം ചെയ്യരുത്
  rationale: വിവാഹവിശ്വസ്തത ലംഘിക്കുന്ന പ്രവൃത്തിക്കുള്ള പതിവും കൃത്യവുമായ മലയാള പദപ്രയോഗം.
- source_word: Οὐ ψευδομαρτυρήσεις
  choice: കള്ളസാക്ഷ്യം പറയരുത്
  rationale: നിയമപരവും പൊതുവുമായ സാക്ഷ്യത്തിന്റെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: പത്ത് കൽപ്പനകളുടെ ഉദ്ധരണിയിലെ കൊലപാതകനിരോധനം
  choice: കൊല ചെയ്യരുത്
  alternative: കൊല്ലരുത്
  rationale: ‘കൊല’ എന്നത് φονεύωയുടെ അന്യായമായ മനുഷ്യവധം എന്ന പ്രത്യേക അർഥം സംരക്ഷിക്കുകയും എല്ലാ തരത്തിലുള്ള കൊല്ലലിനെയും കുറിച്ചുള്ള വിപുലമായ വ്യാഖ്യാനം വാക്യത്തിലേക്ക് ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: Τὸ എന്ന പട്ടികാ-ആമുഖത്തിന്റെ പരിഭാഷ
  choice: 'ഇവയാണ്:'
  alternative: 'അത്:'
  rationale: മൂലപാഠത്തിലെ അസാധാരണമായ ആമുഖഘടന ഒഴിവാക്കാതെ, മലയാളത്തിൽ മനസ്സിലാകുന്ന രീതിയിൽ തുടർന്ന് വരുന്ന ബഹുവചന കൽപ്പനകളെ അവതരിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. സംഭാഷണത്തിന്റെ സ്വാഭാവികതയ്ക്കായി ആദ്യത്തെ λέγει വർത്തമാനകാലത്തിൽ നിന്നുള്ള മലയാള വിവരണഭൂതകാലമായി മാറ്റിയെങ്കിലും അർഥഭേദമില്ല; കൽപ്പനകളുടെ ഉദ്ധരണിശൈലിയും പട്ടികയുടെ അപൂർണമായി തുടരുന്ന സ്വഭാവവും നിലനിർത്തി.
