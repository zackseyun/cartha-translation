revisions:
- from: എന്തെന്നാൽ, അമ്മയുടെ ഗർഭംമുതൽ അങ്ങനെ ജനിച്ച ഷണ്ഡന്മാരുണ്ട്; മനുഷ്യർ ഷണ്ഡന്മാരാക്കിയവരുമുണ്ട്; സ്വർഗരാജ്യത്തിനുവേണ്ടി തങ്ങളെത്തന്നെ ഷണ്ഡന്മാരാക്കിയവരുമുണ്ട്.[a] ഇതു ഉൾക്കൊള്ളാൻ കഴിയുന്നവൻ ഉൾക്കൊള്ളട്ടെ.[b]
  to: എന്തെന്നാൽ, അമ്മയുടെ ഗർഭം മുതൽ അങ്ങനെ ജനിച്ച ഷണ്ഡന്മാരുണ്ട്; മനുഷ്യരാൽ ഷണ്ഡന്മാരാക്കപ്പെട്ടവരുമുണ്ട്; സ്വർഗരാജ്യത്തിനുവേണ്ടി തങ്ങളെത്തന്നെ ഷണ്ഡന്മാരാക്കിയവരുമുണ്ട്.[a] ഇതു ഉൾക്കൊള്ളാൻ കഴിയുന്നവൻ ഉൾക്കൊള്ളട്ടെ.[b]
  rationale: പരിഷ്കാരം അർഥം മാറ്റുന്നില്ല. അത് വാക്കതിരിവ് ശരിയാക്കുകയും, രണ്ടാം വിഭാഗത്തിലെ ഗ്രീക്ക് passive-ഉം മനുഷ്യർ എന്ന പ്രവൃത്തികാരകവും കൂടുതൽ നേരിട്ട് പ്രകടിപ്പിക്കുകയും, അടിക്കുറിപ്പിലെ രാജ്യപരിഭാഷ മുഖ്യപാഠത്തോടു യോജിപ്പിക്കുകയും ചെയ്യുന്നു. മൂന്നാം വിഭാഗത്തെ അക്ഷരാർഥമോ രൂപകാർഥമോ എന്നു മുഖ്യപാഠത്തിൽ തീർപ്പാക്കാതെ അതിന്റെ അസ്പഷ്ടത നിലനിർത്തിയിരിക്കുന്നു. [a] മൂന്നാം വിഭാഗത്തോടും [b] അവസാന ആഹ്വാനത്തോടും ചേർക്കുന്നതാണ് അവയുടെ ഉള്ളടക്കത്തിനു യോജിച്ച anchor സ്ഥാനം.
