id: MAT.19.12
reference: Matthew 19:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰσὶν γὰρ εὐνοῦχοι οἵτινες ἐκ κοιλίας μητρὸς ἐγεννήθησαν οὕτως, καὶ εἰσὶν εὐνοῦχοι οἵτινες εὐνουχίσθησαν ὑπὸ τῶν ἀνθρώπων, καὶ εἰσὶν εὐνοῦχοι οἵτινες εὐνούχισαν ἑαυτοὺς διὰ τὴν βασιλείαν τῶν οὐρανῶν. ὁ δυνάμενος χωρεῖν χωρείτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/012.yaml
  text: For there are eunuchs who were born that way from their mother’s womb[a], and there are eunuchs who were made eunuchs by men, and there are eunuchs who made themselves eunuchs for the sake of the kingdom of heaven[b]. The one able to accept this should accept it.
translation:
  language: ml
  text: എന്തെന്നാൽ, അമ്മയുടെ ഗർഭം മുതൽ അങ്ങനെ ജനിച്ച ഷണ്ഡന്മാരുണ്ട്; മനുഷ്യരാൽ ഷണ്ഡന്മാരാക്കപ്പെട്ടവരുമുണ്ട്; സ്വർഗരാജ്യത്തിനുവേണ്ടി തങ്ങളെത്തന്നെ ഷണ്ഡന്മാരാക്കിയവരുമുണ്ട്.[a] ഇതു ഉൾക്കൊള്ളാൻ കഴിയുന്നവൻ ഉൾക്കൊള്ളട്ടെ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തങ്ങളെത്തന്നെ വൃഷണച്ഛേദനം ചെയ്തവർ’ എന്നും വിവർത്തനം ചെയ്യാം; സ്വർഗരാജ്യത്തിനുവേണ്ടി അവിവാഹിതജീവിതം തിരഞ്ഞെടുക്കുന്നതിനെക്കുറിച്ചുള്ള രൂപകപ്രയോഗമായാണ് പല വ്യാഖ്യാതാക്കളും ഇതിനെ മനസ്സിലാക്കുന്നത്.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, ‘ഇതു സ്വീകരിക്കാൻ കഴിയുന്നവൻ സ്വീകരിക്കട്ടെ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐνοῦχοι
  choice: ഷണ്ഡന്മാർ
  rationale: ഗ്രീക്കിലെ സാധാരണ അർഥവും മൂന്നു വിഭാഗങ്ങളിലുമുള്ള പദാവർത്തനവും നിലനിർത്തുന്നു; ‘ബ്രഹ്മചാരികൾ’ എന്നു വിവർത്തനം ചെയ്ത് മൂന്നാമത്തെ പ്രയോഗത്തിന്റെ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ മുൻകൂട്ടി നിശ്ചയിക്കുന്നില്ല.
- source_word: ἐκ κοιλίας μητρὸς ἐγεννήθησαν οὕτως
  choice: അമ്മയുടെ ഗർഭംമുതൽ അങ്ങനെ ജനിച്ച
  rationale: ഉറവിടത്തിലെ സജീവമായ ഗർഭപ്രയോഗവും οὕτως എന്നതിന്റെ മുൻവിവരസൂചനയും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: εὐνουχίσθησαν ὑπὸ τῶν ἀνθρώπων
  choice: മനുഷ്യർ ഷണ്ഡന്മാരാക്കിയവർ
  rationale: εὐνοῦχοι എന്ന നാമപദവുമായുള്ള ശബ്ദബന്ധം നിലനിർത്തുകയും, ശരീരശാസ്ത്രപരമായ വിശദീകരണം മാത്രം അടിച്ചേൽപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: εὐνούχισαν ἑαυτοὺς
  choice: തങ്ങളെത്തന്നെ ഷണ്ഡന്മാരാക്കിയവർ
  rationale: പ്രകോപകമായ ഗ്രീക്ക് പ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു; അക്ഷരാർഥമോ അതിശയോക്തിയോ സ്വമേധയാ അവിവാഹിതരായി കഴിയുന്നതിന്റെ രൂപകമോ എന്നു മുഖ്യപാഠത്തിൽ തീർപ്പാക്കുന്നില്ല.
- source_word: διὰ τὴν βασιλείαν τῶν οὐρανῶν
  choice: സ്വർഗരാജ്യത്തിനുവേണ്ടി
  rationale: διά + accusative സൂചിപ്പിക്കുന്ന ലക്ഷ്യം/പ്രേരണ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: ὁ δυνάμενος χωρεῖν χωρείτω
  choice: ഇതു ഉൾക്കൊള്ളാൻ കഴിയുന്നവൻ ഉൾക്കൊള്ളട്ടെ
  rationale: χωρέωയുടെ ‘ഇടം നൽകുക, സ്വീകരിക്കുക, ഗ്രഹിച്ച് അംഗീകരിക്കുക’ എന്ന സന്ദർഭോചിത ഭാവം ‘ഉൾക്കൊള്ളുക’ നന്നായി നൽകുന്നു; ആവർത്തനവും ആജ്ഞാഭാവവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: εὐνούχισαν ἑαυτοὺς അക്ഷരാർഥത്തിലോ രൂപകാർഥത്തിലോ മനസ്സിലാക്കണമോ
  choice: മുഖ്യപാഠത്തിൽ ‘തങ്ങളെത്തന്നെ ഷണ്ഡന്മാരാക്കിയവർ’ എന്ന പദരൂപം നിലനിർത്തി.
  alternative: ‘തങ്ങളെത്തന്നെ വൃഷണച്ഛേദനം ചെയ്തവർ’ അല്ലെങ്കിൽ ‘ദൈവരാജ്യത്തിനുവേണ്ടി അവിവാഹിതജീവിതം തിരഞ്ഞെടുത്തവർ’.
  rationale: വാക്യംതന്നെ മൂന്നാമത്തെ വിഭാഗം അക്ഷരാർഥമാണോ അതിശയോക്തിയാണോ സ്വമേധയാ ബ്രഹ്മചര്യം സ്വീകരിക്കുന്നതിന്റെ രൂപകമാണോ എന്നു വ്യക്തമാക്കുന്നില്ല. അതിനാൽ വ്യാഖ്യാനപരമായ സംഘർഷം മുഖ്യപാഠത്തിൽ പരിഹരിക്കാതെ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- issue: ὁ δυνάμενος χωρεῖν χωρείτω എന്ന അവസാന ആഹ്വാനത്തിന്റെ അർഥം
  choice: ‘ഇതു ഉൾക്കൊള്ളാൻ കഴിയുന്നവൻ ഉൾക്കൊള്ളട്ടെ’ എന്നു നൽകി.
  alternative: ‘ഇതു സ്വീകരിക്കാൻ കഴിയുന്നവൻ സ്വീകരിക്കട്ടെ.’
  rationale: ‘ഉൾക്കൊള്ളുക’ എന്നത് ദുഷ്കരമായ ഈ ഉപദേശം ഗ്രഹിച്ച് അംഗീകരിക്കുക എന്ന സന്ദർഭോചിത അർഥവും ഗ്രീക്കിലെ പദാവർത്തനവും സ്വാഭാവിക മലയാളത്തിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ‘ഷണ്ഡൻ’ അപൂർവമെങ്കിലും εὐνοῦχος എന്ന ചരിത്രപരവും ശരീര-സാമൂഹികവുമായ വിഭാഗത്തിന് കൃത്യമായ സ്ഥാപിത പദമായതിനാൽ ഉപയോഗിച്ചു. ‘ഉൾക്കൊള്ളട്ടെ’ എന്ന രൂപം അന്തിമ ആഹ്വാനത്തിന്റെ ഗൗരവവും ആവർത്തനവും കാത്തുസൂക്ഷിക്കുന്നു.
