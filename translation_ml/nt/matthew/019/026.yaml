  naturalness: ‘മനുഷ്യർക്ക് ഇത് അസാധ്യമാണ്; എന്നാൽ ദൈവത്തിന് എല്ലാം സാധ്യമാണ്’ ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതും വചനസ്വഭാവത്തിനു യോജിച്ചതുമാണ്. ‘അവരെ നോക്കി പറഞ്ഞു’ എന്നത് മലയാളത്തിൽ അഭിസംബോധിതരെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നതിനാൽ ‘അവരോടു’ ചേർക്കാതിരിക്കുന്നതിൽ അർഥനഷ്ടമില്ല.
