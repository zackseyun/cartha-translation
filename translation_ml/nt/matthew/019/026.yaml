id: MAT.19.26
reference: Matthew 19:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐμβλέψας δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Παρὰ ἀνθρώποις τοῦτο ἀδύνατόν ἐστιν, παρὰ δὲ θεῷ πάντα δυνατά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/026.yaml
  text: But Jesus looked at them and said to them[a], “With men this is impossible, but with God all things are possible.”
translation:
  language: ml
  text: 'എന്നാൽ യേശു അവരെ നോക്കി പറഞ്ഞു: “മനുഷ്യർക്ക് ഇത് അസാധ്യമാണ്; എന്നാൽ ദൈവത്തിന് എല്ലാം സാധ്യമാണ്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψας
  choice: അവരെ നോക്കി
  rationale: ദൃഷ്ടി ഒരാളിലേക്കു തിരിക്കുക എന്ന ക്രിയയുടെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; ‘ഉറ്റുനോക്കി’ എന്നു പറഞ്ഞ് തീവ്രത അനാവശ്യമായി വർധിപ്പിക്കുന്നില്ല.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: ശിഷ്യരുടെ ആശങ്കയോടുള്ള മൃദുവായ വൈരുധ്യവും തുടർന്നുള്ള മനുഷ്യർ–ദൈവം വിരുദ്ധസമാന്തരതയും വ്യക്തമാക്കുന്നു.
- source_word: εἶπεν αὐτοῖς
  choice: പറഞ്ഞു
  rationale: ‘അവരെ നോക്കി’ എന്ന മുൻപ്രയോഗം അഭിസംബോധിതരെ വ്യക്തമാക്കുന്നതിനാൽ, മലയാളത്തിൽ ‘അവരോടു പറഞ്ഞു’ എന്നു ആവർത്തിക്കാതെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: παρὰ ἀνθρώποις
  choice: മനുഷ്യർക്ക്
  rationale: παρά + ദത്തിവ് ഇവിടെ മനുഷ്യരുടെ പരിധിയിലോ കഴിവിലോ എന്ന ആശയം സൂചിപ്പിക്കുന്നു. ലിംഗഭേദമില്ലാതെ മനുഷ്യരെയാകെ ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്.
- source_word: τοῦτο
  choice: ഇത്
  rationale: മുൻസന്ദർഭത്തിൽ ചർച്ചയായ കാര്യത്തിലേക്കുള്ള സൂചന ലളിതമായും നേരിട്ടും നിലനിർത്തുന്നു.
- source_word: ἀδύνατόν ἐστιν
  choice: അസാധ്യമാണ്
  rationale: വിശേഷണവും ‘ആകുന്നു’ എന്ന ബന്ധക്രിയയും ചേർന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ നേരിട്ടുള്ള, സ്വാഭാവിക മലയാളരൂപം.
- source_word: παρὰ δὲ θεῷ
  choice: എന്നാൽ ദൈവത്തിന്
  rationale: ആദ്യ പാദത്തിലെ ‘മനുഷ്യർക്ക്’ എന്ന ഘടനയോട് സമാന്തരത പാലിച്ചുകൊണ്ട് ദൈവത്തിന്റെ പരിധിയിലോ ശക്തിയിലോ എന്ന അർഥം നൽകുന്നു.
- source_word: πάντα δυνατά
  choice: എല്ലാം സാധ്യമാണ്
  rationale: πάντα എന്ന സമഗ്രതയും δυνατά എന്ന സാധ്യതയും സംക്ഷിപ്തവും പ്രബലവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἀνθρώποις എന്ന പൊതുവാചകത്തിന്റെ വിവർത്തനം
  choice: മനുഷ്യർക്ക്
  alternative: ആളുകൾക്ക് / മനുഷ്യരെക്കൊണ്ട്
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചനം ഇവിടെ സകല മനുഷ്യരെയും പൊതുവായി സൂചിപ്പിക്കുന്നു. ‘മനുഷ്യർക്ക്’ ലിംഗഭേദമില്ലാത്തതും ദൈവത്തോടുള്ള വൈരുധ്യം കൃത്യമായി നിലനിർത്തുന്നതുമാണ്.
- issue: πάντα δυνατά എന്ന പ്രസ്താവനയുടെ വ്യാപ്തി
  choice: എല്ലാം സാധ്യമാണ്
  alternative: സകല കാര്യങ്ങളും സാധ്യമാണ്
  rationale: വാക്യത്തിന്റെ സമഗ്രമായ രൂപം അതേപടി സൂക്ഷിക്കുന്നു; അതിന്റെ വ്യാപ്തിയെ സന്ദർഭപരമായി ചുരുക്കുകയോ സിദ്ധാന്തപരമായി വികസിപ്പിക്കുകയോ ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ മനുഷ്യർ–ദൈവം സമാന്തരവൈരുധ്യം ‘മനുഷ്യർക്ക്… ദൈവത്തിന്…’ എന്ന ഘടനയിൽ സംരക്ഷിച്ചു. ആവശ്യമായ യഥാർഥ പാഠഭേദമോ നിർബന്ധമായ ലെക്സിക്കൽ കുറിപ്പോ ഇല്ലാത്തതിനാൽ അടിക്കുറിപ്പുകൾ ചേർത്തിട്ടില്ല.
