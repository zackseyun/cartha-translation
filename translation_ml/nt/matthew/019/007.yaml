id: MAT.19.7
reference: Matthew 19:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγουσιν αὐτῷ· Τί οὖν Μωϋσῆς ἐνετείλατο δοῦναι βιβλίον ἀποστασίου καὶ ἀπολῦσαι ⸀αὐτήν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/007.yaml
  text: They said to him[a], “Why then did Moses command to give a certificate of divorce and to send her away?”
translation:
  language: ml
  text: 'അവർ അവനോടു പറഞ്ഞു: “അങ്ങനെയെങ്കിൽ, വിവാഹമോചനപത്രം കൊടുക്കാനും അവളെ പറഞ്ഞയയ്ക്കാനും[a] മോശെ കൽപ്പിച്ചത് എന്തുകൊണ്ട്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവളെ വിവാഹമോചനം ചെയ്യാൻ.” ഗ്രീക്ക് ക്രിയയ്ക്ക് “പറഞ്ഞയയ്ക്കുക” എന്നർഥമുണ്ടെങ്കിലും, ഈ സന്ദർഭത്തിൽ അത് വിവാഹമോചനത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: അവർ അവനോട് ചോദിച്ചു
  rationale: ആഖ്യാനത്തിലെ ഗ്രീക്ക് വർത്തമാനകാലം മലയാളത്തിൽ സ്വാഭാവികമായി ഭൂതകാലത്തിൽ നൽകി; തുടർന്നുവരുന്നത് ചോദ്യമായതിനാൽ ‘ചോദിച്ചു’ എന്ന് വ്യക്തമാക്കി.
- source_word: Τί οὖν
  choice: അങ്ങനെയെങ്കിൽ ... എന്തുകൊണ്ട്?
  rationale: മുൻവാക്കിനെതിരായ ആക്ഷേപത്തിന്റെ വാദാത്മക ശക്തി സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: Μωϋσῆς ἐνετείλατο
  choice: മോശ കല്പിച്ചത്
  rationale: ഗ്രീക്ക് ക്രിയയുടെ ‘കല്പിക്കുക’ എന്ന ശക്തി നിലനിർത്തുന്നു; അടുത്ത വാക്യത്തിലെ യേശുവിന്റെ തിരുത്തൽ ഇതിലേക്ക് മുൻകൂട്ടി ചേർക്കുന്നില്ല.
- source_word: δοῦναι βιβλίον ἀποστασίου
  choice: വിവാഹമോചനപത്രം കൊടുത്ത്
  rationale: നിയമപരമായ എഴുത്തുരേഖയെ വ്യക്തവും ചുരുക്കവുമായി സൂചിപ്പിക്കുന്ന ആധുനിക മലയാളപ്രയോഗം.
- source_word: καὶ ἀπολῦσαι αὐτήν
  choice: അവളെ പറഞ്ഞയയ്ക്കാൻ
  rationale: ‘അയച്ചുകളയുക/വിട്ടയയ്ക്കുക’ എന്ന മൂലചിത്രം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് വിവാഹമോചനത്തെ സൂചിപ്പിക്കുന്നുവെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ഫരിസേയരുടെ വാക്കായ ‘കല്പിച്ചു’ എന്നതിനെ അടുത്ത വാക്യത്തിലെ യേശുവിന്റെ വിശദീകരണവുമായി മുൻകൂട്ടി പൊരുത്തപ്പെടുത്തണമോ
  choice: കല്പിച്ചത്
  alternative: അനുവദിച്ചത്
  rationale: ἐνετείλατο വ്യക്തമായി ‘കല്പിച്ചു’ എന്നാണ്; വക്താക്കളുടെ അവതരണം അതേപടി നിലനിർത്തുകയും യേശുവിന്റെ തുടർന്നുള്ള തിരുത്തൽ മുൻകൂട്ടി ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ചോദ്യരൂപം. ‘മോശ കല്പിച്ചത്’ എന്ന വാക്കുക്രമം വക്താക്കളുടെ ഊന്നൽ സംരക്ഷിക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘ഞങ്ങളോട്’ ചേർത്തിട്ടില്ല. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട പ്രയോഗത്തിനുശേഷം വാക്യാവസാനത്ത് നൽകിയിരിക്കുന്നു.
