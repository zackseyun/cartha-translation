id: MAT.19.23
reference: Matthew 19:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς εἶπεν τοῖς μαθηταῖς αὐτοῦ· Ἀμὴν λέγω ὑμῖν ὅτι ⸂πλούσιος δυσκόλως⸃ εἰσελεύσεται εἰς τὴν βασιλείαν τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/023.yaml
  text: Then Jesus said to his disciples[a], “Truly I say to you[b], a rich man will enter the kingdom of heaven with difficulty.”
translation:
  language: ml
  text: 'അപ്പോൾ യേശു തന്റെ ശിഷ്യന്മാരോടു പറഞ്ഞു: “സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: ധനികനായ ഒരാൾ സ്വർഗരാജ്യത്തിൽ പ്രവേശിക്കുന്നത് പ്രയാസമായിരിക്കും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: അപ്പോൾ
  rationale: ആഖ്യാനത്തിലെ മുന്നോട്ടുള്ള നീക്കവും സന്ദർഭമാറ്റവും സ്വാഭാവികമായ മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: തന്റെ ശിഷ്യന്മാരോടു
  rationale: αὐτοῦ എന്ന വ്യക്തമായ ഉടമസ്ഥസൂചന നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായി യേശുവിലേക്കു തിരിച്ചുചൂണ്ടുകയും ചെയ്യുന്നു.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: യേശുവിന്റെ ഗൗരവപൂർണമായ ഉറപ്പിക്കൽസൂത്രത്തിന്റെ അർത്ഥവും ഭാരവും ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: πλούσιος
  choice: ധനികനായ ഒരാൾ
  rationale: നാമവാചകമായി ഉപയോഗിച്ച ഏകവചന പുല്ലിംഗ വിശേഷണം വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികവും അർത്ഥനിഷ്ഠവുമായ രൂപം.
- source_word: δυσκόλως
  choice: പ്രവേശിക്കുക പ്രയാസമാണ്
  rationale: പ്രവേശനത്തിന്റെ പ്രയാസം വ്യക്തമാക്കുന്നു; അടുത്ത വാക്യത്തിൽ വികസിക്കുന്ന അസാധ്യതയുടെ ആശയം ഈ വാക്യത്തിലേക്ക് അതിരുകടന്ന് കൊണ്ടുവരുന്നില്ല.
- source_word: εἰσελεύσεται
  choice: പ്രവേശിക്കുക
  rationale: ഭാവിക്രിയയുടെ പൊതുസത്യസ്വഭാവം മലയാളത്തിലെ ക്രിയാനാമ-വിധേയഘടനയിൽ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: സ്വർഗരാജ്യം
  rationale: മത്തായിയുടെ സവിശേഷ പ്രയോഗത്തിന് മലയാളത്തിൽ സ്ഥിരവും മനസ്സിലാകുന്നതുമായ തുല്യപദം; രാജത്വം/രാജ്യം എന്ന ആശയം നിലനിർത്തുന്നു.
theological_decisions:
- issue: πλούσιος എന്ന നാമവാചക വിശേഷണത്തിന്റെ ലിംഗസൂചന
  choice: ധനികനായ ഒരാൾ
  alternative: ധനികൻ; സമ്പന്നനായ വ്യക്തി
  rationale: ഗ്രീക്കിലെ ഏകവചന പുല്ലിംഗരൂപം മറച്ചുവയ്ക്കാതെ പ്രതിനിധിയായ ഒരു മനുഷ്യനെ സൂചിപ്പിക്കുന്നു; അതേസമയം മലയാളത്തിൽ അനാവശ്യമായി ‘പുരുഷൻ’ എന്നു ശക്തിപ്പെടുത്തുന്നില്ല.
- issue: Ἀμὴν എന്ന യേശുവിന്റെ സൂത്രവാക്യം
  choice: സത്യമായി
  alternative: ആമേൻ
  rationale: പ്രസ്താവനയുടെ ഉറപ്പും അധികാരഭാവവും സാധാരണ വായനക്കാർക്കു നേരിട്ട് മനസ്സിലാകുന്ന വിധത്തിൽ നൽകുന്നു; ‘ആമേൻ’ എന്ന ശബ്ദാനുകരണം സാധ്യമായിരുന്നാലും ഇവിടെ അർത്ഥപരമായ രൂപം കൂടുതൽ സുതാര്യമാണ്.
- issue: δυσκόλως സൂചിപ്പിക്കുന്ന പ്രയാസത്തിന്റെ അളവ്
  choice: പ്രയാസമാണ്
  alternative: വളരെ പ്രയാസമാണ്; ഏറെക്കുറെ പ്രവേശിക്കുകയില്ല
  rationale: മൂലത്തിലെ ക്രിയാവിശേഷണം പ്രവേശനം പ്രയാസകരമാണെന്ന് പറയുന്നു; അടുത്ത വാക്യത്തിന്റെ ശക്തമായ ഉപമ മുൻകൂട്ടി ചേർക്കാതെ വാക്യത്തിലെ യഥാർത്ഥ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്കു വ്യക്തവുമായ മലയാളം. മൂലവാക്യത്തിലെ ലളിതമായ ആഖ്യാനരീതിയും യേശുവിന്റെ ഗൗരവപൂർണമായ പ്രഖ്യാപനവും സംരക്ഷിച്ചിരിക്കുന്നു.
