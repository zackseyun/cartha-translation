id: MAT.19.19
reference: Matthew 19:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τίμα τὸν πατέρα καὶ τὴν μητέρα, καὶ Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/019.yaml
  text: Honor your father and mother[a], and love your neighbor as yourself.
translation:
  language: ml
  text: “നിന്റെ അപ്പനെയും അമ്മയെയും ബഹുമാനിക്കുക; നിന്റെ അയൽക്കാരനെ നിന്നെപ്പോലെതന്നെ സ്നേഹിക്കുക.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ രൂപപരമായി: “നിന്റെ അപ്പനെയും അമ്മയെയും ബഹുമാനിക്കുക; നിന്റെ അയൽക്കാരനെ നിന്നെപ്പോലെതന്നെ നീ സ്നേഹിക്കും.”'
    reason: Ἀγαπήσεις എന്ന ഗ്രീക്ക് ഭാവികാല നിർദേശരൂപത്തിന്റെ കൂടുതൽ ഔപചാരികമായ പരിഭാഷ സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: Τίμα
  choice: ബഹുമാനിക്കുക
  rationale: τιμάω കൽപ്പനയുടെ ഭാഷയെ പ്രതിധ്വനിപ്പിക്കുകയും ഉള്ളിലെ ആദരവിൽ മാത്രം ഒതുങ്ങാതെ മാതാപിതാക്കൾക്കു നൽകേണ്ട ബഹുമാനം സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: നിന്റെ അപ്പനെയും അമ്മയെയും
  rationale: ഗ്രീക്കിൽ ഉടമസ്ഥസർവനാമം വ്യക്തമല്ലെങ്കിലും, പത്തു കൽപ്പനകളിലെ നേരിട്ടുള്ള അഭിസംബോധന മലയാളത്തിൽ സ്വാഭാവികമായി ‘നിന്റെ’ എന്നു നൽകുന്നു. ‘അപ്പൻ, അമ്മ’ എന്നത് ആധുനിക സാധാരണ മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: Ἀγαπήσεις
  choice: സ്നേഹിക്കുക
  rationale: തോറായിലെ കൽപ്പന ഉദ്ധരിക്കുമ്പോൾ ഉപയോഗിച്ച ഭാവികാല നിർദേശരൂപമാണിത്. പട്ടികയിലെ നേരിട്ടുള്ള കൽപ്പനാഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്താൻ ക്രിയയെ നിർദേശരൂപത്തിൽ നൽകി; കൂടുതൽ രൂപപരമായ പരിഭാഷ അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: τὸν πλησίον σου
  choice: നിന്റെ അയൽക്കാരനെ
  rationale: ഈ ധാർമ്മിക-തിരുവെഴുത്തു സന്ദർഭത്തിൽ πλησίον ഒരാളുടെ ബന്ധവലയത്തിലുള്ള മറ്റൊരാളെ സൂചിപ്പിക്കുന്ന പതിവുപദമാണ്; ‘അയൽക്കാരൻ’ അതിന്റെ സ്ഥിരവും മനസ്സിലാകുന്നതുമായ മലയാളരൂപമാണ്.
- source_word: ὡς σεαυτόν
  choice: നിന്നെപ്പോലെതന്നെ
  rationale: താരതമ്യത്തിന്റെ സംക്ഷിപ്തത കാത്തുസൂക്ഷിക്കുന്നു; ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത ‘നീ നിന്നെ സ്നേഹിക്കുന്നതുപോലെ’ എന്ന വിശദീകരണം കൂട്ടിച്ചേർക്കുന്നില്ല.
theological_decisions:
- issue: കൽപ്പനകളുടെ ഉദ്ധരണിയിൽ നിർദേശരൂപവും ഭാവികാലരൂപവും ചേർന്നിരിക്കുന്നത്
  choice: 'മുഖ്യവാചകത്തിൽ രണ്ടു ക്രിയകളും നേരിട്ടുള്ള കൽപ്പനകളായി നൽകുക: ‘ബഹുമാനിക്കുക ... സ്നേഹിക്കുക.’'
  alternative: ‘നിന്റെ അപ്പനെയും അമ്മയെയും ബഹുമാനിക്കുക; നിന്റെ അയൽക്കാരനെ നിന്നെപ്പോലെതന്നെ നീ സ്നേഹിക്കും.’
  rationale: ഗ്രീക്ക് Τίμα എന്ന നിർദേശരൂപത്തോടൊപ്പം Ἀγαπήσεις എന്ന ഭാവികാലരൂപം ഉപയോഗിക്കുന്നു; ഇത് തിരുവെഴുത്തിലെ നിയമഭാഷയുടെ സവിശേഷതയാണ്. ആധുനിക മലയാളത്തിൽ രണ്ടും കൽപ്പനകളായി നൽകുന്നത് പട്ടികയുടെ അർത്ഥവും ബലവും സ്വാഭാവികമായി എത്തിക്കുന്നു; രൂപപരമായ വ്യത്യാസം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ കൽപ്പനാഭാഷ. ‘ബഹുമാനിക്കുക’ കൽപ്പനയുടെ ധാർമ്മിക ഭാരം നിലനിർത്തുന്നു; ‘അയൽക്കാരൻ’ പരിചിതമായ തിരുവെഴുത്തുപദവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമാണ്. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
