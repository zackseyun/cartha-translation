id: MAT.19.15
reference: Matthew 19:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐπιθεὶς ⸂τὰς χεῖρας αὐτοῖς⸃ ἐπορεύθη ἐκεῖθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/015.yaml
  text: And after laying his hands on them[a], he went on from there.
translation:
  language: ml
  text: അവരുടെമേൽ കൈകൾ വെച്ചശേഷം[a] അവൻ അവിടെനിന്ന് പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അവരുടെമേൽ കൈകൾ വെച്ച് അവൻ അവിടെനിന്ന് പോയി.”'
    reason: Aorist participle-നെ മലയാളത്തിൽ ‘വെച്ചശേഷം’ എന്ന മുൻകാലപ്രവൃത്തിയായോ ‘വെച്ച്’ എന്ന ബന്ധകക്രിയയായോ സ്വാഭാവികമായി അവതരിപ്പിക്കാം; രണ്ടിലും പ്രവൃത്തികളുടെ ക്രമം സന്ദർഭത്തിൽ നിലനിൽക്കുന്നു.
lexical_decisions:
- source_word: καὶ
  choice: (പ്രത്യേകമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല)
  rationale: മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനപ്രവാഹത്തിൽ participial clause-നെ നേരിട്ട് മുഖ്യക്രിയയോട് ചേർക്കുമ്പോൾ καὶ വേറിട്ട് ‘പിന്നെ’ എന്നാക്കേണ്ടതില്ല; അങ്ങനെ ചെയ്താൽ ഗ്രീക്കിൽ ഇല്ലാത്ത കാലക്രമ ഊന്നൽ വരാം.
- source_word: ἐπιθεὶς
  choice: വെച്ചശേഷം
  rationale: ἐπιτίθημι എന്ന ക്രിയയുടെ aorist participle മുഖ്യക്രിയയ്ക്കു മുമ്പ് പൂർത്തിയായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘വെച്ചശേഷം’ ആ ക്രമം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τὰς χεῖρας αὐτοῖς
  choice: അവരുടെമേൽ കൈകൾ
  rationale: കൈകൾ ഒരാളുടെമേൽ വെക്കുക എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ദൃശ്യമായ ശാരീരിക പ്രവൃത്തി നേരിട്ട് നിലനിർത്തുന്നു. കർത്താവ് യേശുവാണെന്നത് സന്ദർഭത്തിൽ വ്യക്തമായതിനാൽ ഗ്രീക്കിൽ ഇല്ലാത്ത ‘തന്റെ’ ചേർത്തിട്ടില്ല.
- source_word: ἐπορεύθη
  choice: പോയി
  rationale: πορεύομαι ഇവിടെ ഒരിടത്തുനിന്നുള്ള യാത്രയെയോ നീക്കത്തെയോ സൂചിപ്പിക്കുന്നു; ‘പോയി’ ആധുനിക മലയാളത്തിൽ ലളിതവും മാന്യവും സന്ദർഭോചിതവുമാണ്.
- source_word: ἐκεῖθεν
  choice: അവിടെനിന്ന്
  rationale: സ്ഥലത്തിൽനിന്നുള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്ന ἐκεῖθεν എന്ന അവ്യയത്തിന്റെ നേരായ ആധുനിക മലയാള പരിഭാഷ.
theological_decisions:
- issue: യേശു കൈകൾ വെച്ച പ്രവൃത്തിയുടെ സ്വഭാവം
  choice: ‘അവരുടെമേൽ കൈകൾ വെച്ചു’ എന്ന മൂർത്തമായ പ്രവൃത്തി തന്നെയാണ് പരിഭാഷയിൽ നിലനിർത്തിയത്.
  alternative: പ്രധാനവാക്യത്തിൽ ‘അവരെ അനുഗ്രഹിച്ചു’ എന്ന് വ്യാഖ്യാനപരമായി പരിഭാഷപ്പെടുത്തുക.
  rationale: സന്ദർഭം അനുഗ്രഹത്തെ സൂചിപ്പിക്കുന്നുണ്ടെങ്കിലും ഈ വാക്യത്തിലെ ഗ്രീക്ക് കൈകൾ വെച്ച പ്രവൃത്തിയാണ് വ്യക്തമായി പറയുന്നത്. അതിനാൽ കൂദാശയുടെയോ സ്ഥാനാഭിഷേകത്തിന്റെയോ പ്രത്യേക അർഥം ഇറക്കുമതി ചെയ്യാതെയും ഫലത്തെ പ്രവൃത്തിക്ക് പകരമാക്കാതെയും മൂലവാചകം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘കരങ്ങൾ’ പോലുള്ള ഉയർന്ന രജിസ്റ്ററിനു പകരം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ‘കൈകൾ’ ഉപയോഗിച്ചു; ‘യാത്രയായി’ പോലുള്ള അധിക അർഥം നൽകുന്ന പ്രയോഗങ്ങൾ ഒഴിവാക്കി.
