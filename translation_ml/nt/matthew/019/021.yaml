id: MAT.19.21
reference: Matthew 19:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ Ἰησοῦς· Εἰ θέλεις τέλειος εἶναι, ὕπαγε πώλησόν σου τὰ ὑπάρχοντα καὶ ⸀δὸς πτωχοῖς, καὶ ἕξεις θησαυρὸν ἐν ⸀οὐρανοῖς, καὶ δεῦρο ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/021.yaml
  text: Jesus said to him[a], “If you want to be perfect, go, sell your possessions and give to the poor, and you will have treasure in heaven; then come, follow me.”
translation:
  language: ml
  text: 'യേശു അവനോട് പറഞ്ഞു: “നീ പൂർണനാകാൻ ആഗ്രഹിക്കുന്നെങ്കിൽ[a], പോയി നിനക്കുള്ളതെല്ലാം വിറ്റ് ദരിദ്രർക്കു കൊടുക്കുക; അപ്പോൾ സ്വർഗത്തിൽ നിനക്കു നിധിയുണ്ടാകും. പിന്നെ വന്ന് എന്നെ അനുഗമിക്കുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “തികഞ്ഞവനാകാൻ” അല്ലെങ്കിൽ “പക്വതയുള്ളവനാകാൻ.” ഗ്രീക്ക് പദത്തിന് പൂർണൻ, തികഞ്ഞവൻ, പക്വതയുള്ളവൻ എന്നീ അർത്ഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: യേശു അവനോട് പറഞ്ഞു
  rationale: സാധാരണ ആഖ്യാനശൈലിയിലുള്ള സ്വാഭാവിക മലയാളം; സംസാരത്തിന്റെ രീതി അനാവശ്യമായി പ്രത്യേകീകരിക്കുന്നില്ല.
- source_word: Εἰ θέλεις τέλειος εἶναι
  choice: നീ പൂർണനാകാൻ ആഗ്രഹിക്കുന്നെങ്കിൽ
  rationale: θέλεις എന്നത് ‘ആഗ്രഹിക്കുന്നെങ്കിൽ’ എന്നും τέλειος എന്നത് സന്ദർഭത്തിൽ സമഗ്രതയെയോ പൂർണതയെയോ സൂചിപ്പിക്കുന്ന ‘പൂർണൻ’ എന്നും പരിഭാഷപ്പെടുത്തി; പാപരഹിതമായ പരിപൂർണത എന്ന ആശയം നിർബന്ധിച്ച് ചേർക്കുന്നില്ല.
- source_word: ὕπαγε πώλησόν σου τὰ ὑπάρχοντα
  choice: പോയി നിനക്കുള്ളതെല്ലാം വിറ്റ്
  rationale: തുടർച്ചയായ കല്പനകളെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; τὰ ὑπάρχοντα ഒരാളുടെ ഉടമസ്ഥതയിലുള്ള വസ്തുക്കളെ സൂചിപ്പിക്കുന്നു.
- source_word: δὸς πτωχοῖς
  choice: ദരിദ്രർക്കു കൊടുക്കുക
  rationale: പദാർത്ഥവും കല്പനയുടെ നേരിട്ടുള്ള സ്വഭാവവും നിലനിർത്തുന്ന വ്യക്തമായ മലയാളം.
- source_word: ἕξεις θησαυρὸν ἐν οὐρανοῖς
  choice: അപ്പോൾ സ്വർഗത്തിൽ നിനക്കു നിക്ഷേപമുണ്ടാകും
  rationale: ഗ്രീക്കിലെ ബഹുവചനമായ οὐρανοῖς മലയാളത്തിൽ പതിവായ ഏകവചന ‘സ്വർഗത്തിൽ’ എന്നു നൽകി; θησαυρός എന്നത് ഇവിടെ ധനശേഖരമോ വിലയേറിയ സമ്പത്തോ എന്ന അർത്ഥത്തിലുള്ള ‘നിക്ഷേപം’ ആയി നൽകി.
- source_word: καὶ δεῦρο ἀκολούθει μοι
  choice: പിന്നെ വന്ന് എന്നെ അനുഗമിക്കുക
  rationale: δεῦροയിലെ വരാനുള്ള ആഹ്വാനവും മുൻകല്പനകൾക്കു ശേഷമുള്ള ക്രമവും ‘പിന്നെ വന്ന്’ എന്നതിലൂടെ വ്യക്തമാക്കുന്നു; ἀκολούθει μοι എന്ന ശിഷ്യത്വഭാഷ നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: τέλειος എന്ന പദം ശിഷ്യത്വവുമായി ബന്ധപ്പെട്ട് നൽകുന്ന അർത്ഥം
  choice: പൂർണൻ
  alternative: തികഞ്ഞവൻ; പക്വതയുള്ളവൻ
  rationale: ഈ സന്ദർഭത്തിൽ പദം സമഗ്രമായ അനുസരണത്തെയും കുറവില്ലാത്ത സമർപ്പണത്തെയും സൂചിപ്പിക്കാം. ‘പൂർണൻ’ ഈ അർത്ഥവ്യാപ്തി നിലനിർത്തുന്നു; പാപരഹിതമായ ധാർമിക പരിപൂർണതയെന്ന പ്രത്യേക സിദ്ധാന്തം വചനത്തിൽ അടിച്ചേൽപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം ഗൗരവമുള്ളതുമായ ശൈലി. കല്പനകളുടെ ശക്തിയും ശിഷ്യത്വത്തിന്റെ ആഹ്വാനവും നിലനിർത്തിയിരിക്കുന്നു; യഥാർത്ഥ ഗ്രീക്കിലുള്ള τέλειος എന്ന പദത്തിന്റെ അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
