id: MAT.19.22
reference: Matthew 19:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ νεανίσκος τὸν ⸀λόγον ἀπῆλθεν λυπούμενος, ἦν γὰρ ἔχων κτήματα πολλά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/022.yaml
  text: But when the young man heard this word[a], he went away grieving[c][b], for he had many possessions.
translation:
  language: ml
  text: എന്നാൽ ആ യുവാവ് ഈ വാക്ക്[a] കേട്ടപ്പോൾ ദുഃഖിച്ചുകൊണ്ട്[b] പോയി; കാരണം, അവന് അനേകം സ്വത്തുക്കൾ ഉണ്ടായിരുന്നു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഈ പ്രസ്താവന.” ഇവിടെ ഗ്രീക്കിലെ “വാക്ക്” എന്നത് യേശു തൊട്ടുമുമ്പ് പറഞ്ഞതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ദുഃഖിതനായി.” അവൻ ദുഃഖാവസ്ഥയിൽ പോയതിനെ ഗ്രീക്ക് കൃദന്തം ചിത്രീകരിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: 'പരമ്പരാഗതമായി, “വലിയ സമ്പത്ത്.” എന്നാൽ ഗ്രീക്ക് പദപ്രയോഗം അളവിനെയാണ് കൂടുതൽ നേരിട്ട് ഊന്നുന്നത്: “അനേകം സ്വത്തുക്കൾ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: കേട്ടപ്പോൾ
  rationale: Aorist participle is naturally rendered as a temporal clause, preserving the sequence of hearing and departing.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: Marks the mild contrast and narrative turn between Jesus’ demand and the young man’s response.
- source_word: ὁ νεανίσκος
  choice: ആ യുവാവ്
  rationale: Directly renders ‘the young man’ without importing Luke’s identification of him as a ruler.
- source_word: τὸν λόγον
  choice: ഈ വാക്ക്
  rationale: In context λόγος refers to Jesus’ immediately preceding saying; ‘ഈ വാക്ക്’ remains close to the Greek while being clear in Malayalam.
- source_word: ἀπῆλθεν
  choice: പോയി
  rationale: Natural modern Malayalam for departing or going away in this narrative context.
- source_word: λυπούμενος
  choice: ദുഃഖിച്ചുകൊണ്ട്
  rationale: Preserves the participial force, portraying grief as the state accompanying his departure.
- source_word: ἦν γὰρ ἔχων
  choice: കാരണം, അവന് ... ഉണ്ടായിരുന്നു
  rationale: Naturally expresses the continuing state of possession conveyed by the periphrastic construction.
- source_word: κτήματα πολλά
  choice: അനേകം സ്വത്തുക്കൾ
  rationale: Reflects the plural noun and the quantitative force of πολλά, rather than shifting the sense toward merely great or valuable wealth.
theological_decisions:
- issue: Whether to import the identification ‘ruler’ from the parallel account
  choice: യുവാവ്
  alternative: യുവാവായ പ്രമാണി
  rationale: Matthew’s wording identifies him only as a young man; adding ‘ruler’ would harmonize this verse with Luke rather than translate Matthew’s text directly.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘ദുഃഖിച്ചുകൊണ്ട്’ എന്ന പ്രയോഗം മൂലത്തിലെ കൃദന്തരൂപവും അവന്റെ പുറപ്പെടലിനോടൊപ്പം നിലനിന്ന ദുഃഖവും സൂക്ഷിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദപ്രയോഗങ്ങൾക്ക് പിന്നാലെ മുഖ്യവാചകത്തിൽ നൽകിയിരിക്കുന്നു.
