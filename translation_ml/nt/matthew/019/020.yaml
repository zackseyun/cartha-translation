id: MAT.19.20
reference: Matthew 19:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ νεανίσκος· ⸂Πάντα ταῦτα⸃ ⸀ἐφύλαξα· τί ἔτι ὑστερῶ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/020.yaml
  text: The young man says to him[a], “All these I have kept[b]. What do I still lack?”
translation:
  language: ml
  text: 'യുവാവ് അവനോടു പറയുന്നു: “ഇവയെല്ലാം ഞാൻ പാലിച്ചിട്ടുണ്ട്.[a] ഇനിയും എനിക്ക് എന്താണ് കുറവുള്ളത്?[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഇവയെല്ലാം ഞാൻ അനുഷ്ഠിച്ചിട്ടുണ്ട്.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “ഇനിയും എനിക്ക് എന്തിലാണ് കുറവുള്ളത്?”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിൽ ആഖ്യാനപരമായ വർത്തമാനകാലമാണെങ്കിലും, മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനശൈലിയിൽ ഭൂതകാലരൂപം കൂടുതൽ യോജിക്കുന്നു.
- source_word: αὐτῷ
  choice: അവനോടു
  rationale: λέγει എന്ന ക്രിയയോടൊപ്പമുള്ള ദത്തിവിഭക്തി മലയാളത്തിൽ സ്വാഭാവികമായി ‘അവനോടു’ എന്നു പ്രകടിപ്പിക്കുന്നു.
- source_word: ὁ νεανίσκος
  choice: യുവാവ്
  rationale: νεανίσκος എന്നത് യുവാവിനെ സൂചിപ്പിക്കുന്നു; ഈ വാക്യത്തിൽ ഇല്ലാത്ത ‘പ്രമാണി’ എന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: Πάντα ταῦτα
  choice: ഇവയെല്ലാം
  rationale: മുമ്പ് പറഞ്ഞ കല്പനകളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളപ്രയോഗം.
- source_word: ἐφύλαξα
  choice: ഞാൻ പാലിച്ചിട്ടുണ്ട്
  rationale: കല്പനകൾ അനുസരിക്കുക എന്ന സന്ദർഭാർഥം നൽകുകയും, കഴിഞ്ഞകാലത്തെ പെരുമാറ്റത്തിന് ഇപ്പോഴുള്ള പ്രസക്തി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: τί ἔτι ὑστερῶ
  choice: ഇനി എനിക്ക് എന്താണ് കുറവുള്ളത്?
  rationale: ὑστερέω എന്നതിലെ ‘കുറവായിരിക്കുക/പിന്നിലാകുക’ എന്ന അർഥവ്യാപ്തിയിൽ പ്രധാനമായ ‘കുറവ്’ എന്ന ആശയം വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: കല്പനകൾ പാലിച്ചെന്ന യുവാവിന്റെ സ്വയംവിലയിരുത്തൽ
  choice: അവന്റെ അവകാശവാദം വിവർത്തനത്തിൽ നേരിട്ടുതന്നെ അവതരിപ്പിക്കുന്നു; അതിനെ അംഗീകരിക്കുകയോ പരിഹസിക്കുകയോ ചെയ്യുന്ന സൂചന ചേർക്കുന്നില്ല.
  alternative: അവകാശവാദം ആത്മാർഥമെങ്കിലും തെറ്റാണെന്നോ അതിശയോക്തിയാണെന്നോ വിവർത്തനത്തിൽ സൂചിപ്പിക്കുക.
  rationale: ഗ്രീക്ക് വാചകം അവകാശവാദം നേരിട്ട് രേഖപ്പെടുത്തുന്നു. അതിന്റെ സാധുതയെക്കുറിച്ചുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷം ചുറ്റുപാടുള്ള വിവരണത്തിന് വിട്ടുകൊടുക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ സംഭാഷണശൈലി. സാധാരണ വായനക്കാർക്ക് വ്യക്തത നൽകിക്കൊണ്ട് മൂലത്തിലെ അർഥവ്യാപ്തിയും ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും സംരക്ഷിച്ചു.
