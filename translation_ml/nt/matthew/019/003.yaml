source:
  edition: SBLGNT
  text: Καὶ προσῆλθον ⸀αὐτῷ Φαρισαῖοι πειράζοντες αὐτὸν καὶ ⸀λέγοντες· Εἰ ἔξεστιν ⸀ἀνθρώπῳ ἀπολῦσαι τὴν γυναῖκα αὐτοῦ κατὰ πᾶσαν αἰτίαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/003.yaml
  text: And Pharisees came up to him[a], testing him and saying, “Is it lawful for a man to divorce his wife for any cause?”
translation:
  language: ml
  text: 'പരീശന്മാർ അവന്റെ അടുക്കൽ വന്ന് അവനെ പരീക്ഷിച്ചുകൊണ്ട് ചോദിച്ചു: “ഏതു കാരണത്താലും ഒരു പുരുഷൻ തന്റെ ഭാര്യയെ വിവാഹമോചനം ചെയ്യുന്നത് നിയമാനുസൃതമാണോ?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഏതൊരു കാരണത്തിന്റെ പേരിലും” അല്ലെങ്കിൽ “ഏതു അടിസ്ഥാനത്തിലും” എന്നും പരിഭാഷപ്പെടുത്താം. വിവാഹമോചനം അനുവദിക്കാവുന്ന കാരണങ്ങളെക്കുറിച്ചുള്ള വിശാലമായ നിയമചോദ്യമാണ് ഗ്രീക്ക് പ്രയോഗം പ്രതിഫലിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθον
  choice: അവന്റെ അടുക്കൽ വന്ന്
  rationale: ആരുടെയെങ്കിലും അടുത്തേക്ക് വരുക/സമീപിക്കുക എന്ന ദിശാസൂചന സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: πειράζοντες
  choice: പരീക്ഷിച്ചുകൊണ്ട്
  rationale: പദത്തിന്റെ ‘പരീക്ഷിക്കുക’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുകയും പ്രതികൂല ഉദ്ദേശ്യം സന്ദർഭത്തിൽനിന്ന് ഗ്രഹിക്കാനിടവരുത്തുകയും ചെയ്യുന്നു; ‘പ്രലോഭിപ്പിക്കുക’ ഇവിടെ അനാവശ്യമായി പാപത്തിലേക്കുള്ള വശീകരണം സൂചിപ്പിക്കാം.
- source_word: ἔξεστιν
  choice: നിയമാനുസൃതമാണോ
  rationale: നിയമപരവും മതനിയമപരവുമായ തർക്കസന്ദർഭത്തിലെ ‘അനുവദനീയമാണോ’ എന്ന ചോദ്യത്തെ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: ἀνθρώπῳ
  choice: ഒരു പുരുഷൻ
  rationale: ‘തന്റെ ഭാര്യ’ എന്ന തുടർന്നുള്ള പ്രയോഗം ഇവിടെ ഭർത്താവായ പുരുഷനെയാണ് നിർദിഷ്ടമായി സൂചിപ്പിക്കുന്നത്.
- source_word: ἀπολῦσαι
  choice: വിവാഹമോചനം ചെയ്യുന്നത്
  rationale: അക്ഷരാർഥത്തിൽ ‘വിട്ടയയ്ക്കുക’ എന്നായാലും വിവാഹസന്ദർഭത്തിൽ നിയമപരമായ വിവാഹമോചനമാണ് ഉദ്ദേശ്യം.
- source_word: γυναῖκα αὐτοῦ
  choice: തന്റെ ഭാര്യയെ
  rationale: വിവാഹമോചനസന്ദർഭവും ഉടമസ്ഥസർവനാമവും കാരണം γυνή ഇവിടെ ‘ഭാര്യ’ എന്നാണ്.
- source_word: κατὰ πᾶσαν αἰτίαν
  choice: ഏതു കാരണത്താലും
  rationale: വിവാഹമോചനത്തിന് ഏതെങ്കിലും കാരണം മതിയോ എന്ന വിശാലമായ നിയമചോദ്യത്തിന്റെ പരിധി സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: വിവാഹമോചനത്തിനുള്ള കാരണങ്ങളെക്കുറിച്ചുള്ള ഒന്നാം നൂറ്റാണ്ടിലെ നിയമവാദം, പിൽക്കാല സഭാപരമായ നിലപാട് ചേർക്കാതെ അവതരിപ്പിക്കൽ
  choice: ഏതു കാരണത്താലും ഒരു പുരുഷൻ തന്റെ ഭാര്യയെ വിവാഹമോചനം ചെയ്യുന്നത് നിയമാനുസൃതമാണോ?
  alternative: ഏതൊരു കാരണത്തിന്റെ പേരിലും ഒരു ഭർത്താവ് ഭാര്യയെ ഉപേക്ഷിക്കുന്നത് അനുവദനീയമാണോ?
  rationale: വാക്യം യേശുവിന്റെ മറുപടി നൽകുന്നതിന് മുമ്പുള്ള വിശാലമായ നിയമചോദ്യമാണ്. ഈ രൂപം ചോദ്യത്തിന്റെ വ്യാപ്തിയും നിയമപരമായ സ്വഭാവവും നിലനിർത്തുന്നു; വിവാഹമോചനത്തെക്കുറിച്ചുള്ള ഏതെങ്കിലും പ്രത്യേക സഭാപരമായ നിഗമനം മുൻകൂട്ടി ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നിയമാനുസൃതമാണോ’ നിയമവാദത്തിന്റെ ഭാവം സൂക്ഷിക്കുന്നു; ‘പരീക്ഷിച്ചുകൊണ്ട്’ എന്നത് വൈരപരമായ ഉദ്ദേശ്യം അതിവ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്നു.
