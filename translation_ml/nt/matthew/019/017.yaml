id: MAT.19.17
reference: Matthew 19:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῷ· Τί με ⸂ἐρωτᾷς περὶ τοῦ ἀγαθοῦ; εἷς ἐστιν ὁ ἀγαθός⸃· εἰ δὲ θέλεις ⸂εἰς τὴν ζωὴν εἰσελθεῖν⸃, ⸀τήρησον τὰς ἐντολάς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/017.yaml
  text: And he said to him[a], “Why do you ask me about what is good? One is good. But if you want to enter into life[b], keep the commandments.”
translation:
  language: ml
  text: 'അവൻ അയാളോടു പറഞ്ഞു: “നല്ലതിനെക്കുറിച്ച് നീ എന്നോടു ചോദിക്കുന്നത് എന്തിന്?[a] നല്ലവൻ ഒരുവനേയുള്ളൂ.[b] എന്നാൽ ജീവനിലേക്കു പ്രവേശിക്കാൻ നീ ആഗ്രഹിക്കുന്നുവെങ്കിൽ, കല്പനകൾ പാലിക്കുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ചില കൈയെഴുത്തുപ്രതികളും സമാന്തരവിവരണങ്ങളും ഇങ്ങനെ വായിക്കുന്നു: “നീ എന്നെ നല്ലവൻ എന്നു വിളിക്കുന്നത് എന്തിന്? ഒരുവനല്ലാതെ ആരും നല്ലവനല്ല—ദൈവം മാത്രം.” എന്നാൽ മത്തായിയുടെ SBLGNT പാഠം ഇങ്ങനെയാണ്: “നല്ലതിനെക്കുറിച്ച് നീ എന്നോടു ചോദിക്കുന്നത് എന്തിന്? നല്ലവൻ ഒരുവനേയുള്ളൂ.”'
    reason: textual_variant
  - marker: b
    text: 'കൂടുതൽ പദാനുപദമായി: “ഒരുവനാണ് നല്ലവൻ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί με ἐρωτᾷς περὶ τοῦ ἀγαθοῦ
  choice: നല്ലതിനെക്കുറിച്ച് നീ എന്നോടു ചോദിക്കുന്നത് എന്തിന്?
  rationale: τοῦ ἀγαθοῦ ഇവിടെ നപുംസകലിംഗ ഏകവചനമായതിനാൽ, സമാന്തരവിവരണങ്ങളോട് യോജിപ്പിച്ച് യേശുവിനെ ‘നല്ലവൻ’ എന്നു വിളിക്കുന്നതിനെക്കുറിച്ചുള്ള ചോദ്യമാക്കാതെ, ‘നല്ലത്’ എന്ന ആശയത്തെയോ കാര്യത്തെയോ കുറിച്ചുള്ള ചോദ്യം എന്ന നിലയിൽ പരിഭാഷപ്പെടുത്തി.
- source_word: εἷς ἐστιν ὁ ἀγαθός
  choice: നല്ലവൻ ഒരുവനേയുള്ളൂ
  rationale: εἷς എന്ന ‘ഒരുവൻ’ എന്ന ഊന്നലും ὁ ἀγαθός എന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്ന വിശേഷണപ്രയോഗവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു. ആരെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് പരിഭാഷയിൽ അധികമായി വ്യക്തമാക്കുന്നില്ല.
- source_word: εἰ δὲ θέλεις
  choice: എന്നാൽ ... നീ ആഗ്രഹിക്കുന്നുവെങ്കിൽ
  rationale: θέλω ആഗ്രഹമോ ഉദ്ദേശ്യമോ സൂചിപ്പിക്കുന്നു; ‘ആഗ്രഹിക്കുന്നുവെങ്കിൽ’ ആധുനികവും മാന്യവുമായ മലയാളമാണ്. δέ-യുടെ നേരിയ വൈരുധ്യം ‘എന്നാൽ’കൊണ്ട് സൂചിപ്പിച്ചു.
- source_word: εἰς τὴν ζωὴν εἰσελθεῖν
  choice: ജീവനിലേക്കു പ്രവേശിക്കാൻ
  rationale: εἰς എന്ന ദിശാസൂചന നിലനിർത്തിക്കൊണ്ട്, മൂലത്തിൽ ഈ ഉപവാക്യത്തിൽ ഇല്ലാത്ത ‘നിത്യജീവൻ’ എന്നു വ്യാഖ്യാനിച്ചുചേർക്കാതെ പരിഭാഷപ്പെടുത്തി.
- source_word: τήρησον τὰς ἐντολάς
  choice: കല്പനകൾ പാലിക്കുക
  rationale: കല്പനകളോടൊപ്പം τηρέω എന്നതിന് ‘പാലിക്കുക’ സ്വാഭാവികമാണ്; ἐντολάς ദൈവിക കല്പനകളുടെ ഭാരം നിലനിർത്തുന്ന ‘കല്പനകൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: യേശുവിന്റെ പ്രസ്താവനയും ദൈവിക നന്മയും ക്രിസ്തുശാസ്ത്രവും തമ്മിലുള്ള ബന്ധം
  choice: മത്തായിയുടെ ഗ്രീക്ക് പാഠമനുസരിച്ച് ‘നല്ലതിനെക്കുറിച്ച്’ എന്ന ചോദ്യവും ‘നല്ലവൻ ഒരുവനേയുള്ളൂ’ എന്ന മറുപടിയും പരിഭാഷപ്പെടുത്തി; യേശുവിന്റെ നന്മയെ നിഷേധിക്കുന്നതായോ അവന്റെ ദൈവത്വത്തെ നേരിട്ട് പ്രഖ്യാപിക്കുന്നതായോ വികസിപ്പിച്ചില്ല.
  alternative: 'മർക്കോസ്/ലൂക്കോസ് സമാന്തരവിവരണങ്ങളോട് യോജിപ്പിച്ച്: ‘നീ എന്നെ നല്ലവൻ എന്നു വിളിക്കുന്നത് എന്തിന്? ദൈവം ഒരുവനല്ലാതെ ആരും നല്ലവനല്ല.’'
  rationale: SBLGNT-യിലെ മത്തായിയുടെ പാഠം സമാന്തരവിവരണങ്ങളിൽനിന്ന് വ്യത്യസ്തമാണ്. ആ വ്യത്യാസവും അതിലുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷവും വ്യാഖ്യാനത്തിലൂടെ തീർപ്പാക്കാതെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അവൻ’ എന്നതിനു പിന്നാലെയുള്ള αὐτῷ വേർതിരിച്ചറിയാൻ ‘അയാളോടു’ ഉപയോഗിച്ചു. ‘ജീവനിലേക്കു’ എന്ന പ്രയോഗം അന്തിമജീവന്റെ സൂചന നിലനിർത്തുന്നു; എന്നാൽ മൂലത്തിൽ ഇല്ലാത്ത ‘നിത്യ’ എന്ന വിശേഷണം ചേർത്തിട്ടില്ല.
