id: MAT.19.29
reference: Matthew 19:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ πᾶς ⸀ὅστις ἀφῆκεν ⸂οἰκίας ἢ⸃ ἀδελφοὺς ἢ ἀδελφὰς ἢ πατέρα ἢ μητέρα ἢ ⸂γυναῖκα ἢ⸃ τέκνα ἢ ⸀ἀγροὺς ἕνεκεν τοῦ ⸂ὀνόματός μου⸃, ⸀ἑκατονταπλασίονα λήμψεται καὶ ζωὴν αἰώνιον κληρονομήσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/029.yaml
  text: And everyone who has left houses or brothers or sisters or father or mother or wife or children or fields for the sake of my name will receive a hundredfold and will inherit eternal life[a].
translation:
  language: ml
  text: എന്റെ നാമം നിമിത്തം വീടുകളെയോ സഹോദരന്മാരെയോ സഹോദരിമാരെയോ അപ്പനെയോ അമ്മയെയോ ഭാര്യയെയോ മക്കളെയോ വയലുകളെയോ വിട്ടുപോയ ഏവനും നൂറിരട്ടി പ്രാപിക്കുകയും നിത്യജീവൻ അവകാശമായി ലഭിക്കുകയും ചെയ്യും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὅστις
  choice: ഏവനും
  rationale: ഓരോ യോഗ്യവ്യക്തിയെയും ഉൾക്കൊള്ളുന്ന വിതരണാത്മകവും പൊതുവുമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀφῆκεν
  choice: വിട്ടുപോയ
  rationale: പൂർത്തിയായ വിട്ടൊഴിയലിനെ സൂചിപ്പിക്കുന്നു; ‘ഉപേക്ഷിച്ച’ എന്നതിലുള്ള അധിക വ്യാഖ്യാനഭാരം ഒഴിവാക്കുന്നു.
- source_word: οἰκίας
  choice: വീടുകൾ
  rationale: സ്വത്തും കുടുംബവിഭവവും ഉൾപ്പെടാവുന്ന മൂർത്തമായ ബഹുവചനത്തെ നിലനിർത്തുന്നു.
- source_word: ἀδελφοὺς / ἀδελφὰς
  choice: സഹോദരന്മാർ / സഹോദരിമാർ
  rationale: ഗ്രീക്കിൽ രണ്ടും വേർതിരിച്ചു പറഞ്ഞിരിക്കുന്നതിനാൽ ആ വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: πατέρα / μητέρα / γυναῖκα / τέκνα
  choice: അപ്പൻ / അമ്മ / ഭാര്യ / മക്കൾ
  rationale: കുടുംബബന്ധങ്ങളുടെ പട്ടികയിൽ സ്വാഭാവികവും കൃത്യവുമായ ആധുനിക മലയാള പദങ്ങൾ; ഇവിടെ γυνή എന്നത് ‘ഭാര്യ’ എന്നാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
- source_word: ἀγρούς
  choice: വയലുകൾ
  rationale: കൃഷിഭൂമിയുടെയും സാമ്പത്തിക സ്വത്തിന്റെയും മൂർത്തമായ അർഥം അമിതമായി പ്രത്യേകീകരിക്കാതെ നൽകുന്നു.
- source_word: ἕνεκεν τοῦ ὀνόματός μου
  choice: എന്റെ നാമം നിമിത്തം
  rationale: യേശുവിന്റെ വ്യക്തിയോടും അധികാരത്തോടുമുള്ള വിശ്വസ്തത സൂചിപ്പിക്കുന്ന ‘നാമം’ എന്ന ഉറവിടഭാഷാ പ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: ἑκατονταπλασίονα
  choice: നൂറിരട്ടിയായി
  rationale: ‘നൂറുമടങ്ങ്’ എന്ന അളവാർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു; ലഭിക്കുന്നതിനോടൊപ്പം ചേർന്ന ക്രിയാവിശേഷണരൂപം മലയാളത്തിൽ സുഗമമാണ്.
- source_word: ζωὴν αἰώνιον κληρονομήσει
  choice: നിത്യജീവൻ അവകാശമാക്കുകയും ചെയ്യും
  rationale: κληρονομέω എന്ന അവകാശലഭ്യതയുടെ രൂപകം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: γυνή എന്ന പദത്തിന്റെ അർഥം
  choice: ഭാര്യ
  alternative: സ്ത്രീ
  rationale: കുടുംബാംഗങ്ങളുടെയും സ്വത്തുക്കളുടെയും പട്ടികയായതിനാൽ ദാമ്പത്യബന്ധമാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്; പൊതുവായി സ്ത്രീകളെ വിട്ടൊഴിയുന്നതായി വ്യാഖ്യാനിക്കുന്നത് ഒഴിവാക്കുന്നു.
- issue: ἕνεκεν τοῦ ὀνόματός μου എന്ന പ്രയോഗം
  choice: എന്റെ നാമം നിമിത്തം
  alternative: എന്നെ നിമിത്തം
  rationale: ‘നാമം’ എന്ന ഉറവിടരൂപകവും അതിന്റെ വ്യക്തി, അധികാരം, ഏറ്റുപറയപ്പെട്ട തിരിച്ചറിവ് എന്നിവയോടുള്ള ബന്ധവും സംരക്ഷിക്കുന്നു.
- issue: ἑκατονταπλασίονα എന്ന വാഗ്ദാനം
  choice: നൂറിരട്ടിയായി
  alternative: നൂറുമടങ്ങ്
  rationale: പരിമാണത്തിന്റെ ശക്തി കുറയ്ക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; പ്രതിഫലത്തിന്റെ കൃത്യമായ സ്വഭാവം വിശദീകരിച്ച് വാചകം അധികമായി നിർണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. പട്ടികയിലെ ആവർത്തിക്കുന്ന ‘-യെയോ’ ഘടന ഗ്രീക്ക് ἤ എന്ന അനുക്രമത്തെയും ഓരോ ഇനത്തിന്റെ വ്യത്യസ്തതയെയും സംരക്ഷിക്കുന്നു. ഉറവിടത്തിൽ പ്രസക്തമായ പാഠഭേദങ്ങൾ ഉണ്ടായാലും നൽകിയ SBLGNT മുഖ്യപാഠം വിവർത്തനം ചെയ്തിരിക്കുന്നു; ഈ വാക്യത്തിന് പ്രസിദ്ധീകരണാവശ്യമായ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
