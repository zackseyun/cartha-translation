id: MAT.19.28
reference: Matthew 19:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι ὑμεῖς οἱ ἀκολουθήσαντές μοι ἐν τῇ παλιγγενεσίᾳ, ὅταν καθίσῃ ὁ υἱὸς τοῦ ἀνθρώπου ἐπὶ θρόνου δόξης αὐτοῦ, ⸀καθήσεσθε καὶ ⸀ὑμεῖς ἐπὶ δώδεκα θρόνους κρίνοντες τὰς δώδεκα φυλὰς τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/028.yaml
  text: And Jesus said to them[a], “Truly I say to you, you who have followed me will also sit on twelve thrones in the renewal, when the Son of Man sits on the throne of his glory[b], judging the twelve tribes of Israel.”
translation:
  language: ml
  text: 'യേശു അവരോടു പറഞ്ഞു: “സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: എന്നെ അനുഗമിച്ച നിങ്ങൾ, പുതുക്കലിൽ[a], മനുഷ്യപുത്രൻ തന്റെ മഹത്വത്തിന്റെ സിംഹാസനത്തിൽ ഇരിക്കുമ്പോൾ, നിങ്ങളും പന്ത്രണ്ട് സിംഹാസനങ്ങളിൽ ഇരുന്ന് ഇസ്രായേലിന്റെ പന്ത്രണ്ട് ഗോത്രങ്ങളെ ന്യായം വിധിക്കും[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പുനർജനനത്തിൽ,’ ‘പുതിയ ലോകത്തിൽ,’ അല്ലെങ്കിൽ ‘പുനർജന്മത്തിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഇത് വ്യക്തിയുടെ പുതിയ ജനനത്തെക്കാൾ മനുഷ്യപുത്രന്റെ വാഴ്ചയോടു ബന്ധപ്പെട്ട ഭാവിയിലെ പുതുക്കലിനെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘ന്യായം വിധിക്കുക’ എന്നതിന് ഇവിടെ ഭരിക്കുക, ഭരണാധികാരം വിനിയോഗിക്കുക എന്നീ അർഥങ്ങളും ഉൾക്കൊള്ളാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν
  choice: സത്യമായി
  rationale: ഗൗരവവും ആധികാരികതയും നിറഞ്ഞ യേശുവിന്റെ പ്രസ്താവനാസൂത്രത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἀκολουθήσαντές μοι
  choice: എന്നെ അനുഗമിച്ച നിങ്ങൾ
  rationale: അഭിസംബോധന ചെയ്യപ്പെടുന്നവരെ യേശുവിനെ അനുഗമിച്ചവരായി തിരിച്ചറിയിക്കുകയും ‘എന്നെ’ എന്ന നേരിട്ടുള്ള ബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: παλιγγενεσίᾳ
  choice: പുതുക്കലിൽ
  rationale: പുനർജനനം, നവീകരണം, പുതുസൃഷ്ടി എന്നീ അർഥസാധ്യതകൾ ഉള്ള പദത്തിന് സന്ദർഭോചിതവും അതേസമയം അതിരുകടന്ന് വ്യാഖ്യാനിക്കാത്തതുമായ പരിഭാഷ. ഭാവിയിലെ സാർവത്രിക പുതുക്കലാണ് ഇവിടെ കൂടുതൽ സാധ്യതയെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὅταν καθίσῃ
  choice: ഇരിക്കുമ്പോൾ
  rationale: ഭാവിയിൽ സംഭവിക്കുന്ന സമയബന്ധത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: ശീർഷകത്തിന്റെ പരമ്പരാഗത രൂപവും ദാനീയേൽപുസ്തകവുമായി ബന്ധപ്പെട്ട മിശിഹാ പ്രതിധ്വനിയും നിലനിർത്തുന്നു.
- source_word: ἐπὶ θρόνου δόξης αὐτοῦ
  choice: തന്റെ മഹത്വത്തിന്റെ സിംഹാസനത്തിൽ
  rationale: ഗ്രീക്കിലെ സമാസഘടനയും വാക്യത്തിന്റെ ഉന്നതമായ ഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: καθήσεσθε καὶ ὑμεῖς
  choice: നിങ്ങളും ... ഇരുന്ന്
  rationale: മനുഷ്യപുത്രന്റെ ഇരിപ്പിനോടുള്ള സമാന്തരതയും καί നൽകുന്ന ‘നിങ്ങളും’ എന്ന ഊന്നലും നിലനിർത്തുന്നു.
- source_word: ἐπὶ δώδεκα θρόνους
  choice: പന്ത്രണ്ട് സിംഹാസനങ്ങളിൽ
  rationale: സ്ഥാനാർഥം നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: κρίνοντες
  choice: ന്യായം വിധിക്കും
  rationale: ക്രിയയുടെ പ്രാഥമികമായ ന്യായവിധി അർഥം നിലനിർത്തുന്നു; ഭരണാധികാരം വിനിയോഗിക്കുക എന്ന വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: τὰς δώδεκα φυλὰς τοῦ Ἰσραήλ
  choice: ഇസ്രായേലിന്റെ പന്ത്രണ്ട് ഗോത്രങ്ങളെ
  rationale: ഇസ്രായേലിന്റെ ഗോത്രവിഭാഗങ്ങളെ കൃത്യവും പരിചിതവുമായ ഭാഷയിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഈ സന്ദർഭത്തിലെ παλιγγενεσία എന്നതിന്റെ അർഥം
  choice: മനുഷ്യപുത്രന്റെ സിംഹാസനാരോഹണത്തോടു ബന്ധപ്പെട്ട ഭാവിയിലെ പുതുക്കൽ
  alternative: വ്യക്തിയുടെ പുനർജനനം; പുതിയ യുഗം; പുതുലോകം
  rationale: അടുത്തുള്ള സന്ദർഭം വ്യക്തിപരമായ മാനസാന്തരത്തെക്കാൾ ഭാവിയിലെ സിംഹാസനാരോഹണത്തെയും ന്യായവിധിയെയും കുറിച്ചാണ്. പ്രത്യേക സഹസ്രാബ്ദവാഴ്ചാ പദ്ധതിയോ സഭാപാരമ്പര്യ വ്യാഖ്യാനമോ ചേർക്കാതെ ‘പുതുക്കൽ’ എന്നു നിലനിർത്തുന്നു.
- issue: κρίνοντες എന്നതിന്റെ വ്യാപ്തി
  choice: ന്യായം വിധിക്കുക
  alternative: ഭരിക്കുക; ഭരണനിർവഹണം നടത്തുക
  rationale: ഗ്രീക്ക് പദത്തിന് ന്യായവിധിയോടൊപ്പം ഭരണാധികാരത്തിന്റെ അർഥവും ഉൾക്കൊള്ളാനാകുമെങ്കിലും, മുഖ്യപാഠത്തിൽ അതിന്റെ നേരിട്ടുള്ള അർഥം സൂക്ഷിക്കുകയും വിശാലമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ വചനത്തിന്റെ ഗൗരവം നിലനിർത്തുന്ന ശൈലി. ഗ്രീക്ക് വാക്യത്തിന്റെ ഊന്നലും ക്രമവും കഴിയുന്നത്ര സൂക്ഷിച്ചുകൊണ്ട് മലയാളത്തിലെ സ്വാഭാവിക പ്രവാഹത്തിനായി അവസാനത്തെ പങ്കാളിക്രിയ പൂർണക്രിയയായി അവതരിപ്പിച്ചു.
