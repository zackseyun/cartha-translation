  naturalness: ‘എന്നെ അനുഗമിച്ച നിങ്ങൾ’യും ‘ഇരുന്ന് ... ന്യായം വിധിക്കും’യും സ്വാഭാവികമായ ആധുനിക നിലവാരമലയാളമാണ്. ‘പുതുക്കലിൽ’ എന്നതിന് ശേഷമുള്ള വിരാമചിഹ്നം ചേർക്കുന്നതിലൂടെ വാക്യത്തിന്റെ കാല/സന്ദർഭബന്ധം കൂടുതൽ വ്യക്തവും വായനാസുഖകരവുമാകുന്നു.
