  to: 'യേശു അവരോടു പറഞ്ഞു: “സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: എന്നെ അനുഗമിച്ച നിങ്ങൾ, പുതുക്കലിൽ[a], മനുഷ്യപുത്രൻ തന്റെ മഹത്വത്തിന്റെ സിംഹാസനത്തിൽ ഇരിക്കുമ്പോൾ, നിങ്ങളും പന്ത്രണ്ട് സിംഹാസനങ്ങളിൽ ഇരുന്ന് ഇസ്രായേലിന്റെ പന്ത്രണ്ട് ഗോത്രങ്ങളെ ന്യായം വിധിക്കും[b].”'
