id: MAT.19.1
reference: Matthew 19:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς τοὺς λόγους τούτους, μετῆρεν ἀπὸ τῆς Γαλιλαίας καὶ ἦλθεν εἰς τὰ ὅρια τῆς Ἰουδαίας πέραν τοῦ Ἰορδάνου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/001.yaml
  text: And it happened that when Jesus had finished these words[a], he departed from Galilee and came into the region of Judea beyond the Jordan.
translation:
  language: ml
  text: യേശു ഈ വാക്കുകൾ പറഞ്ഞുതീർന്നപ്പോൾ, ഗലീലയിൽനിന്ന് പുറപ്പെട്ടു യോർദ്ദാന്റെ മറുകരയിലുള്ള യെഹൂദ്യപ്രദേശത്ത് എത്തി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε ἐτέλεσεν
  choice: പറഞ്ഞുതീർന്നപ്പോൾ
  rationale: മത്തായിയുടെ ആഖ്യാനപരമായ പരിവർത്തനപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുമ്പോൾ, മുൻ പ്രസംഗം പൂർത്തിയായ ശേഷമാണ് അടുത്ത നടപടി ഉണ്ടായതെന്ന ക്രമം ഈ രൂപം വ്യക്തമാക്കുന്നു. ‘സംഭവിച്ചു’ എന്ന പദാനുപദരൂപം മലയാളത്തിൽ അനാവശ്യമായി കൃത്രിമമാകും.
- source_word: τοὺς λόγους τούτους
  choice: ഈ വാക്കുകൾ
  rationale: തൊട്ടുമുമ്പുള്ള യേശുവിന്റെ പ്രസംഗത്തെയാണ് λόγους സൂചിപ്പിക്കുന്നത്; ‘ഈ വാക്കുകൾ’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ സമാനപദമാണ്.
- source_word: μετῆρεν ἀπὸ τῆς Γαλιλαίας
  choice: ഗലീലയിൽനിന്നു പുറപ്പെട്ട്
  rationale: സ്ഥലത്തുനിന്നുള്ള യാത്രതിരിക്കലാണ് ക്രിയ സൂചിപ്പിക്കുന്നത്. ‘പുറപ്പെട്ട്’ ആഖ്യാനത്തിന്റെ ഗതിയും ദിശാസൂചനയും നിലനിർത്തുന്നു.
- source_word: ἦλθεν εἰς
  choice: എത്തി
  rationale: ഒരു പുതിയ പ്രദേശത്തേക്കുള്ള ചലനവും അവിടെയെത്തിയതും മലയാളത്തിൽ ‘എത്തി’ എന്ന ക്രിയ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: τὰ ὅρια τῆς Ἰουδαίας
  choice: യെഹൂദ്യപ്രദേശത്ത്
  rationale: ὅρια ഇവിടെ കൃത്യമായ അതിർത്തിരേഖയെക്കാൾ പ്രദേശം/ഭൂപ്രദേശം എന്ന ഭൂമിശാസ്ത്രപരമായ അർഥത്തിലാണ്; അതിനാൽ ‘യെഹൂദ്യപ്രദേശം’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: യോർദ്ദാനക്കരെയുള്ള
  rationale: πέραν എന്നത് യോർദ്ദാന്റെ മറുകരയിലോ അപ്പുറത്തോ ഉള്ള സ്ഥലം സൂചിപ്പിക്കുന്നു. ‘യോർദ്ദാനക്കരെയുള്ള’ സ്വാഭാവികമായി അതു നൽകുന്നു; ദൃഷ്ടികോണം സംബന്ധിച്ച അന്തർനിഹിതമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
