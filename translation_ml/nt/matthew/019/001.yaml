translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ ക്രമബന്ധം സംരക്ഷിച്ചെങ്കിലും ‘Καὶ ἐγένετο’ എന്ന പ്രയോഗം പദാനുപദമായി മാറ്റാതെ മലയാളത്തിന് യോജിച്ച കാലവാക്യഘടനയിൽ ഉൾപ്പെടുത്തി.
