review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Peter, the emphatic ‘Look,’ leaving everything, following Jesus, and the prospective question about what will come to the disciples. However, it omits the participial discourse element ἀποκριθεὶς (‘answering’ / ‘in reply’), which should be represented. Identifying αὐτῷ as Jesus is contextually clear and does not alter the sense.
  naturalness: The Malayalam is clear, modern, and suitably dignified. ‘അപ്പോൾ ഞങ്ങൾക്ക് എന്തു ലഭിക്കും?’ is a natural rendering of τί ἄρα ἔσται ἡμῖν. Adding ‘മറുപടിയായി’ keeps the dialogue idiomatic while restoring the omitted source element.
  terminology: ‘ഇതാ,’ ‘എല്ലാം ഉപേക്ഷിച്ച്,’ and the respectful ‘അങ്ങയെ അനുഗമിച്ചിരിക്കുന്നു’ are appropriate. No doctrinally loaded terminology has been introduced. The perfect-like Malayalam form is acceptable for the completed action with continuing relevance, although the Greek aorist itself does not require a distinct perfect interpretation.
  issues:
  - severity: medium
    issue: The translation omits ‘മറുപടിയായി’ for ἀποκριθεὶς.
    rationale: 'The Greek explicitly frames Peter’s speech as an answer: Τότε ἀποκριθεὶς ὁ Πέτρος εἶπεν αὐτῷ. ‘യേശുവിനോടു പറഞ്ഞു’ conveys only ‘said to him,’ not ‘answered.’'
  revised_text: 'അപ്പോൾ പത്രോസ് യേശുവിനോടു മറുപടിയായി പറഞ്ഞു: “ഇതാ, ഞങ്ങൾ എല്ലാം ഉപേക്ഷിച്ച് അങ്ങയെ അനുഗമിച്ചിരിക്കുന്നു. അപ്പോൾ ഞങ്ങൾക്ക് എന്തു ലഭിക്കും?”'
