- from: 'അപ്പോൾ പത്രോസ് യേശുവിനോടു പറഞ്ഞു: “ഇതാ, ഞങ്ങൾ എല്ലാം ഉപേക്ഷിച്ച് അങ്ങയെ അനുഗമിച്ചിരിക്കുന്നു. അപ്പോൾ ഞങ്ങൾക്ക് എന്തു ലഭിക്കും?”'
  to: 'അപ്പോൾ പത്രോസ് യേശുവിനോടു മറുപടിയായി പറഞ്ഞു: “ഇതാ, ഞങ്ങൾ എല്ലാം ഉപേക്ഷിച്ച് അങ്ങയെ അനുഗമിച്ചിരിക്കുന്നു. അപ്പോൾ ഞങ്ങൾക്ക് എന്തു ലഭിക്കും?”'
