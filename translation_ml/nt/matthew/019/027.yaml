id: MAT.19.27
reference: Matthew 19:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τότε ἀποκριθεὶς ὁ Πέτρος εἶπεν αὐτῷ· Ἰδοὺ ἡμεῖς ἀφήκαμεν πάντα καὶ ἠκολουθήσαμέν σοι· τί ἄρα ἔσται ἡμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/027.yaml
  text: Then Peter answered him, “Look, we have left everything and followed you. What then will there be for us?”
translation:
  language: ml
  text: 'അപ്പോൾ പത്രോസ് യേശുവിനോടു മറുപടിയായി പറഞ്ഞു: “ഇതാ, ഞങ്ങൾ എല്ലാം ഉപേക്ഷിച്ച് അങ്ങയെ അനുഗമിച്ചിരിക്കുന്നു. അപ്പോൾ ഞങ്ങൾക്ക് എന്തു ലഭിക്കും?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν αὐτῷ
  choice: യേശുവിനോടു പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ‘മറുപടിയായി പറഞ്ഞു’ എന്ന സംഭാഷണപ്രയോഗം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; αὐτῷ ആരെ സൂചിപ്പിക്കുന്നു എന്ന് സന്ദർഭത്തിൽ വ്യക്തമായതിനാൽ ‘യേശുവിനോട്’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: Ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും തുടർന്ന് പറയുന്ന കാര്യത്തിന് ഊന്നൽ നൽകുകയും ചെയ്യുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ തുല്യം.
- source_word: ἀφήκαμεν πάντα
  choice: ഞങ്ങൾ എല്ലാം ഉപേക്ഷിച്ച്
  rationale: ശിഷ്യർ എല്ലാം വിട്ടുപോയെന്ന ആശയം വ്യക്തമായി നൽകുന്നു; ‘ഉപേക്ഷിക്കുക’ ഇവിടെ ആളുകളെയോ വസ്തുക്കളെയോ ലഘൂകരിക്കാതെ ത്യജിച്ചുപോരുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: ἠκολουθήσαμέν σοι
  choice: അങ്ങയെ അനുഗമിച്ചിരിക്കുന്നു
  rationale: പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ പ്രസക്തി മലയാളത്തിലെ പൂർണ്ണവർത്തമാനരൂപത്തിൽ നിലനിർത്തുന്നു; യേശുവിനോടുള്ള ആദരസൂചകമായി ‘അങ്ങയെ’ ഉപയോഗിക്കുന്നു.
- source_word: τί ἄρα ἔσται ἡμῖν;
  choice: അപ്പോൾ ഞങ്ങൾക്ക് എന്തു ലഭിക്കും?
  rationale: അക്ഷരാർഥത്തിലെ ‘ഞങ്ങൾക്കായി എന്തുണ്ടാകും?’ എന്ന ചോദ്യത്തെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ἄρα സൂചിപ്പിക്കുന്ന നിഗമനാത്മകമായ ‘അപ്പോൾ’ നിലനിർത്തുന്നു.
theological_decisions:
- issue: പത്രോസിന്റെ ചോദ്യത്തിൽ പ്രതിഫലത്തെക്കുറിച്ചുള്ള പ്രതീക്ഷ
  choice: ‘ഞങ്ങൾക്ക് എന്തു ലഭിക്കും?’ എന്ന തുറന്ന ചോദ്യം നിലനിർത്തി
  alternative: ‘ഞങ്ങളുടെ പ്രതിഫലം എന്തായിരിക്കും?’
  rationale: മൂലപാഠത്തിൽ ‘പ്രതിഫലം’ എന്ന പ്രത്യേക പദമില്ല. അതു ചേർക്കാതെ, ലഭിക്കാനിരിക്കുന്നതിനെക്കുറിച്ചുള്ള ചോദ്യത്തിന്റെ വ്യാപ്തിയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ആരാധനാവായനയ്ക്ക് യോജിച്ച ഗൗരവമുള്ളതുമായ മലയാളം. നേരിട്ടുള്ള സംഭാഷണത്തിൽ യേശുവിനെ അഭിസംബോധന ചെയ്യാൻ ആദരസൂചകമായ ‘അങ്ങ്’ രൂപം ഉപയോഗിച്ചു.
