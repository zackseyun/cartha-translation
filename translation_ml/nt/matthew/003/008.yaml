id: MAT.3.8
reference: Matthew 3:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ποιήσατε οὖν καρπὸν ἄξιον τῆς μετανοίας
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/008.yaml
  text: Therefore[a], produce fruit worthy of repentance.
translation:
  language: ml
  text: അതുകൊണ്ട്, മാനസാന്തരത്തിന് യോജിച്ച ഫലം കായ്ക്കുവിൻ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മാനസാന്തരത്തിന് അനുസൃതമായ ഫലം ഉളവാക്കുവിൻ.”
    reason: ἄξιον τῆς μετανοίας മാനസാന്തരത്തോടുള്ള യോജിപ്പിനെയോ അനുരൂപതയെയോ സൂചിപ്പിക്കുന്നു; ποιήσατε എന്ന ക്രിയയെ ‘ഉളവാക്കുവിൻ’ എന്നും വിവർത്തനം ചെയ്യാം.
lexical_decisions:
- source_word: ποιήσατε
  choice: പുറപ്പെടുവിക്കുവിൻ
  rationale: രണ്ടാം പുരുഷ ബഹുവചനത്തിലുള്ള ശക്തമായ ആജ്ഞയെ നിലനിർത്തുന്നു. ποιέω എന്നതിന്റെ അടിസ്ഥാന അർഥം ‘ചെയ്യുക/ഉളവാക്കുക’ ആണെങ്കിലും, καρπός എന്ന ഫലരൂപകത്തോടൊപ്പം ‘ഫലം പുറപ്പെടുവിക്കുക’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യങ്ങളിലെ മുന്നറിയിപ്പിൽനിന്നും ആഹ്വാനത്തിൽനിന്നും വരുന്ന നിഗമനബന്ധം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: καρπὸν
  choice: ഫലം
  rationale: καρπός എന്ന ഏകവചനത്തെ നിലനിർത്തുന്നു; ഇവിടെ അത് മാനസാന്തരത്തിന്റെ ദൃശ്യമായ പ്രവൃത്തിഫലത്തെ സൂചിപ്പിക്കുന്ന രൂപകമാണ്.
- source_word: ἄξιον
  choice: യോജിച്ച
  rationale: ἄξιος + genitive ഇവിടെ മൂല്യത്തിൽ തുല്യമെന്നതിനെക്കാൾ പൊരുത്തം, അനുയോജ്യത എന്നിവയാണ് സൂചിപ്പിക്കുന്നത്. ‘യോജിച്ച’ എന്നത് മലയാളത്തിൽ ഈ ബന്ധം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: μετανοίας
  choice: മാനസാന്തരത്തിന്
  rationale: μετάνοια ഇവിടെ യോഹന്നാന്റെ ആഹ്വാനത്തോടുള്ള യഥാർഥ ഉള്ളന്തരവും ജീവിതദിശാമാറ്റവും സൂചിപ്പിക്കുന്നു. ‘മാനസാന്തരം’ മലയാള ക്രൈസ്തവ ഉപയോഗത്തിൽ സ്ഥാപിതമായതും അർഥവ്യാപ്തി നിലനിർത്തുന്നതുമായ പദമാണ്.
theological_decisions:
- issue: καρπὸν ἄξιον τῆς μετανοίας എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: മാനസാന്തരത്തോട് പൊരുത്തപ്പെടുന്ന ദൃശ്യമായ ജീവിതഫലത്തിനുള്ള ആജ്ഞ
  alternative: മാനസാന്തരം സമ്പാദിക്കുന്നതോ അതിന് മൂല്യത്തിൽ തുല്യമായതോ ആയ ഫലം
  rationale: Genitive ഘടന യോഗ്യതയെയും പൊരുത്തത്തെയും സൂചിപ്പിക്കുന്നു; ഫലം മാനസാന്തരത്തെ വാങ്ങുകയോ കാരണമാക്കുകയോ ചെയ്യുന്നു എന്ന് പാഠം പറയുന്നില്ല. അതിനാൽ ധാർമിക ആഹ്വാനം നിലനിർത്തിക്കൊണ്ട് പ്രവൃത്തിപുണ്യം ഇറക്കുമതി ചെയ്യാതിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പുറപ്പെടുവിക്കുവിൻ’ ആജ്ഞയുടെ ബഹുവചനബലവും തിരുവെഴുത്തിന് യോജിച്ച ഔപചാരികതയും നിലനിർത്തുന്നു; അതിപുരാതനമായ വാക്യഘടന ഒഴിവാക്കിയിരിക്കുന്നു.
