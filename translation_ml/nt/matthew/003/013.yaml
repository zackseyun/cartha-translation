  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τότε παραγίνεται ὁ Ἰησοῦς ἀπὸ τῆς Γαλιλαίας ἐπὶ τὸν Ἰορδάνην πρὸς τὸν Ἰωάννην τοῦ βαπτισθῆναι ὑπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/013.yaml
  text: Then Jesus comes from Galilee to the Jordan[a], to John[c][b], to be baptized by him.
translation:
  language: ml
  text: അപ്പോൾ യേശു യോഹന്നാനാൽ സ്നാനം ഏൽക്കുന്നതിനായി[b] ഗലീലയിൽനിന്ന് യോർദ്ദാനിലേക്ക്, യോഹന്നാന്റെ അടുക്കൽ വരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വരുന്നു’ എന്നതിന് ‘എത്തുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിൽ സജീവമായ ആഖ്യാനത്തിനായി വർത്തമാനകാലക്രിയയാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘സ്നാനം ഏൽക്കുന്നതിനായി’ എന്നത് യേശുവിന്റെ വരവിന്റെ ലക്ഷ്യം വ്യക്തമാക്കുന്നു.
    reason: lexical_clarification
lexical_decisions:
- source_word: Τότε
  choice: അപ്പോൾ
  rationale: തുടർന്നുവരുന്ന സംഭവത്തെ സൂചിപ്പിക്കുന്ന കാലസംബന്ധിയായ ആഖ്യാനചിഹ്നം; സ്വാഭാവികമായി സംഭവക്രമം നിലനിർത്തുന്നു.
- source_word: παραγίνεται
  choice: വരുന്നു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനകാലത്തിന്റെ ആഖ്യാനസജീവത നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ എത്തിച്ചേരുക എന്ന അർഥവും ഉൾക്കൊള്ളുന്നു.
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: ഗലീലയിൽനിന്ന്
  rationale: ἀπό സൂചിപ്പിക്കുന്ന പുറപ്പെടുന്ന സ്ഥലം അഥവാ ഉത്ഭവസ്ഥാനം നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: ἐπὶ τὸν Ἰορδάνην
  choice: യോർദ്ദാനരികിലേക്ക്
  rationale: ചലനത്തോടുകൂടിയ ἐπί + accusative യോർദ്ദാനിലേക്കുള്ള ഗതിയെ സൂചിപ്പിക്കുന്നു; നദിയുടെ അരികിലേക്കെന്ന മലയാളപ്രയോഗം സ്വാഭാവികവും ഭൂമിശാസ്ത്രപരമായി വ്യക്തവുമാണ്.
- source_word: πρὸς τὸν Ἰωάννην
  choice: യോഹന്നാന്റെ അടുക്കൽ
  rationale: ഒരു വ്യക്തിയിലേക്കുള്ള സമീപനം സൂചിപ്പിക്കുന്ന πρός എന്നതിനെ സ്വാഭാവിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘സ്നാപകൻ’ എന്ന പദവി ചേർക്കുന്നില്ല.
- source_word: τοῦ βαπτισθῆναι
  choice: സ്നാനം ഏൽക്കുന്നതിനായി
  rationale: ലക്ഷ്യം സൂചിപ്പിക്കുന്ന articular infinitive വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; passive സ്വഭാവവും നിലനിർത്തുന്നു.
- source_word: ὑπ’ αὐτοῦ
  choice: യോഹന്നാനാൽ
  rationale: ὑπό + genitive സൂചിപ്പിക്കുന്ന വ്യക്തിപരമായ കർത്തൃത്വം വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ സർവനാമസന്ദിഗ്ധത ഒഴിവാക്കാൻ സമീപസ്ഥനായ യോഹന്നാന്റെ പേര് ആവർത്തിക്കുന്നു.
theological_decisions:
- issue: παραγίνεται എന്ന ചരിത്രവർത്തമാനകാലത്തിന്റെ അവതരണം
  choice: ‘വരുന്നു’ എന്ന വർത്തമാനകാലം നിലനിർത്തി
  alternative: ‘വന്നു’ എന്ന ഭൂതകാലം
  rationale: മത്തായിയുടെ സജീവമായ ആഖ്യാനശൈലി നിലനിർത്തുന്നു; ഇതിലൂടെ പ്രത്യേക ദൈവശാസ്ത്രനിഗമനം ഒന്നും ചേർക്കുന്നില്ല.
- issue: യോഹന്നാന്റെ പദവി വ്യക്തമാക്കൽ
  choice: ‘യോഹന്നാൻ’ എന്നു മാത്രം
  alternative: ‘സ്നാപകനായ യോഹന്നാൻ’
  rationale: ഈ വാക്യത്തിലെ ഗ്രീക്ക് മൂലപാഠം പേര് മാത്രമാണ് നൽകുന്നത്; സന്ദർഭത്തിൽനിന്നുള്ള പദവി മുഖ്യപാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: സ്നാനത്തിന്റെ വ്യക്തിപരമായ നിർവാഹകൻ
  choice: ‘യോഹന്നാനാൽ’ എന്നു വ്യക്തമാക്കി
  alternative: ‘അവനാൽ’
  rationale: ഗ്രീക്കിലെ αὐτοῦ യോഹന്നാനെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ‘അവനാൽ’ എന്നത് യേശുവിനെയോ യോഹന്നാനെയോ സൂചിപ്പിക്കുന്നതുപോലെ തോന്നാവുന്നതിനാൽ അർഥം മാറ്റാതെ സൂചിതനാമം ഉപയോഗിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘യോർദ്ദാൻ’ എന്ന പരിചിത ബൈബിൾ സ്ഥലനാമരൂപം നിലനിർത്തി; അതൊരു നദിയാണെന്നത് വ്യക്തമാക്കാൻ ‘അരികിലേക്ക്’ ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട വാക്യഭാഗത്തിന്റെ അവസാനം ചേർത്തിരിക്കുന്നു.
