revisions:
- from: 'എന്നാൽ ഫരിസേയരിലും സദൂക്യരിലും പലരും തന്റെ സ്നാനത്തിനായി വരുന്നതു കണ്ടപ്പോൾ അവൻ അവരോടു പറഞ്ഞു: “അണലികളുടെ സന്തതികളേ[a], വരാനിരിക്കുന്ന കോപത്തിൽനിന്ന്[b] ഓടിരക്ഷപ്പെടണമെന്ന് നിങ്ങൾക്കു മുന്നറിയിപ്പു തന്നത് ആര്?”'
  to: 'എന്നാൽ ഫരിസേയരിലും സദൂക്യരിലും പലരും തന്റെ സ്നാനത്തിനായി വരുന്നതു കണ്ടപ്പോൾ അവൻ അവരോടു പറഞ്ഞു: “അണലികളുടെ സന്തതികളേ[a], വരാനിരിക്കുന്ന കോപത്തിൽനിന്ന്[b] ഓടിരക്ഷപ്പെടാൻ നിങ്ങൾക്കു മുന്നറിയിപ്പു നൽകിയതാര്?”'
  rationale: A single syntactic refinement makes the warning question natural in modern Malayalam while preserving the Greek infinitive (‘to flee’) and all of the draft’s source-sensitive lexical and theological choices. The existing footnote anchors correctly attach to the relevant Malayalam terms and are retained.
