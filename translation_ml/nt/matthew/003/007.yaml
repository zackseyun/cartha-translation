id: MAT.3.7
reference: Matthew 3:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ πολλοὺς τῶν Φαρισαίων καὶ Σαδδουκαίων ἐρχομένους ἐπὶ τὸ βάπτισμα ⸀αὐτοῦ εἶπεν αὐτοῖς· Γεννήματα ἐχιδνῶν, τίς ὑπέδειξεν ὑμῖν φυγεῖν ἀπὸ τῆς μελλούσης ὀργῆς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/007.yaml
  text: But when he saw many of the Pharisees and Sadducees coming for his baptism[a], he said to them, “Offspring of vipers[b], who warned you to flee from the coming wrath?”
translation:
  language: ml
  text: 'എന്നാൽ ഫരിസേയരിലും സദൂക്യരിലും പലരും തന്റെ സ്നാനത്തിനായി വരുന്നതു കണ്ടപ്പോൾ അവൻ അവരോടു പറഞ്ഞു: “അണലികളുടെ സന്തതികളേ[a], വരാനിരിക്കുന്ന കോപത്തിൽനിന്ന്[b] ഓടിരക്ഷപ്പെടാൻ നിങ്ങൾക്കു മുന്നറിയിപ്പു നൽകിയതാര്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അണലിക്കുഞ്ഞുങ്ങളേ.”
    reason: γεννήματα എന്ന പദത്തെ ‘സന്തതികൾ’ എന്നും ഒരു കൂട്ടത്തിലെ കുഞ്ഞുങ്ങൾ എന്ന ദൃശ്യത്തോടെ എന്നും അവതരിപ്പിക്കാം.
  - marker: b
    text: അഥവാ, “ആസന്നമായ കോപത്തിൽനിന്ന്.”
    reason: μελλούσης എന്നത് വരാനിരിക്കുന്നതോടൊപ്പം അടുത്തെത്തിയിരിക്കുന്നതെന്ന ഭാവവും വഹിക്കാം.
lexical_decisions:
- source_word: Ἰδὼν δὲ
  choice: എന്നാൽ ... കണ്ടപ്പോൾ
  rationale: δέ സൂചിപ്പിക്കുന്ന നേരിയ വൈരുധ്യവും വൃത്താന്തത്തിന്റെ ഒഴുക്കും നിലനിർത്തിക്കൊണ്ട്, ഭൂതകാല കൃദന്തത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ കാലവാക്യമായി അവതരിപ്പിക്കുന്നു.
- source_word: πολλοὺς τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: ഫരിസേയരിലും സദൂക്യരിലും പലരും
  rationale: ഗ്രീക്കിലെ അംശസൂചക ഘടന രണ്ടു കൂട്ടങ്ങളിലെയും പലരെയാണ് സൂചിപ്പിക്കുന്നത്; ആ വിഭാഗങ്ങളിലെ എല്ലാവരെയും അല്ല.
- source_word: ἐρχομένους ἐπὶ τὸ βάπτισμα αὐτοῦ
  choice: തന്റെ സ്നാനത്തിനായി വരുന്നതു
  rationale: അവർ യോഹന്നാന്റെ സ്നാനശുശ്രൂഷയിലേക്കു വരുന്നതാണ് വാചകം പറയുന്നത്. ഈ വാക്യത്തിൽ അവർ യഥാർഥത്തിൽ സ്നാനം സ്വീകരിച്ചുവെന്ന് കൂട്ടിച്ചേർക്കാതെ അതിന്റെ ദിശയും ഉദ്ദേശ്യവും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: Γεννήματα ἐχιδνῶν
  choice: അണലികളുടെ സന്തതികളേ
  rationale: γεννήματα എന്നതിലെ ജനിപ്പിക്കപ്പെട്ടവർ/സന്തതി എന്ന ആശയവും ἐχιδνῶν എന്നതിലെ വിഷപ്പാമ്പ് എന്ന ശക്തമായ ദൃശ്യവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: τίς ὑπέδειξεν ὑμῖν
  choice: നിങ്ങൾക്കു മുന്നറിയിപ്പു തന്നത് ആര്
  rationale: ὑποδείκνυμι എന്നതിന് കാണിച്ചുകൊടുക്കുക എന്ന അടിസ്ഥാനാർഥമുണ്ടെങ്കിലും, വരാനിരിക്കുന്ന കോപത്തിൽനിന്ന് ഓടിപ്പോകുക എന്ന സന്ദർഭത്തിൽ മുന്നറിയിപ്പു നൽകുക എന്ന അർഥമാണ് ഏറ്റവും യോജിച്ചത്.
- source_word: φυγεῖν ἀπὸ
  choice: '...നിന്ന് ഓടിരക്ഷപ്പെടണമെന്ന്'
  rationale: φυγεῖν എന്നതിലെ അടിയന്തരമായ ഓട്ടത്തിന്റെ ദൃശ്യം വെറും ‘രക്ഷപ്പെടുക’ എന്നതിലുപരി നിലനിർത്തുന്നു.
- source_word: τῆς μελλούσης ὀργῆς
  choice: വരാനിരിക്കുന്ന കോപം
  rationale: μελλούσης സൂചിപ്പിക്കുന്ന വരാനിരിക്കുന്നതോ ആസന്നമായതോ ആയ സ്വഭാവവും ὀργή എന്നതിന്റെ ദൈവശാസ്ത്രപരമായ ഗൗരവവും മൃദൂകരിക്കാതെ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: അഭിസംബോധന ചെയ്യപ്പെടുന്ന കൂട്ടങ്ങളുടെ വ്യാപ്തി
  choice: ഫരിസേയരിലും സദൂക്യരിലും പലരും
  alternative: ഫരിസേയരും സദൂക്യരും എല്ലാവരും
  rationale: πολλούς എന്ന പദത്തോടുകൂടിയ അംശസൂചക ഷഷ്ഠീവിഭക്തി ആ കൂട്ടങ്ങളിൽനിന്നുള്ള പലരെയാണ് സൂചിപ്പിക്കുന്നത്. അതിനാൽ സന്നിഹിതരായവർക്കുള്ള തീക്ഷ്ണമായ ശാസന നിലനിർത്തുമ്പോഴും എല്ലാവരെയും കുറിച്ചുള്ള അനാവശ്യ പൊതുവത്കരണം ഒഴിവാക്കുന്നു.
- issue: ὀργήയുടെ അന്ത്യകാലപരമായ ശക്തി
  choice: കോപം
  alternative: ന്യായവിധി; ശിക്ഷ
  rationale: ‘കോപം’ മൂലപദത്തിന്റെ ശക്തിയും ദൈവിക പ്രതികരണത്തിന്റെ ഗൗരവവും നിലനിർത്തുന്നു; അതിനെ ഫലമോ നടപടിയോ മാത്രമായി ചുരുക്കുന്നില്ല.
- issue: സ്നാനത്തിനായി വന്നവരുടെ ഉദ്ദേശ്യവും ഫലവും
  choice: തന്റെ സ്നാനത്തിനായി വരുന്നതു
  alternative: അവനാൽ സ്നാനം സ്വീകരിക്കാൻ വരുന്നതു
  rationale: ἐπὶ τὸ βάπτισμα αὐτοῦ അവർ യോഹന്നാന്റെ സ്നാനത്തിലേക്കു വന്നതായി പറയുന്നു; ഈ വാക്യം മാത്രം അവർ സ്നാനം സ്വീകരിച്ചുവെന്ന് വ്യക്തമാക്കുന്നില്ല. അതിനാൽ ആ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു വ്യക്തമായ, എന്നാൽ പ്രവാചകശാസനയുടെ ഗൗരവവും തീക്ഷ്ണതയും നിലനിർത്തുന്ന മലയാളം. ‘അണലി’, ‘സന്തതി’, ‘കോപം’ എന്നീ പദങ്ങൾ മൂലത്തിലെ ദൃശ്യവും ദൈവശാസ്ത്രപരമായ ഭാരവും മൃദൂകരിക്കാതെ കൈമാറുന്നു.
