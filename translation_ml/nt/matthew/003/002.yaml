  text: ⸀καὶ λέγων· Μετανοεῖτε, ἤγγικεν γὰρ ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/002.yaml
  text: and saying[a], “Repent[b], for the kingdom of heaven has drawn near.”
translation:
  language: ml
  text: 'അവൻ ഇങ്ങനെ പറഞ്ഞു: “മനംതിരിയുക[a]; കാരണം, സ്വർഗരാജ്യം[b] അടുത്തുവന്നിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അനുതപിക്കുക’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദം ചിന്തയിലും മനോഭാവത്തിലും അടിസ്ഥാനപരമായ മാറ്റം വരുത്തി തിരിയുക എന്ന വിശാലമായ ആശയം നൽകുന്നു; വെറും ഖേദം തോന്നുക എന്നതിൽ അത് ഒതുങ്ങുന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, ‘സ്വർഗങ്ങളുടെ രാജ്യം.’ ഇവിടെ ‘രാജ്യം’ എന്നത് രാജവാഴ്ചയെയോ ഭരണത്തെയോ കൂടി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ λέγων
  choice: അവൻ ഇങ്ങനെ പറഞ്ഞു
  rationale: മുൻവാക്യത്തിലെ യോഹന്നാനെ കർത്താവായി ഉൾക്കൊണ്ട്, ഗ്രീക്കിലെ തുടർച്ചയായ പങ്കാളിത്തപ്രയോഗം സ്വാഭാവികമായ മലയാള വാക്യമായി അവതരിപ്പിക്കുന്നു. λέγων എന്നതിൽ ഇല്ലാത്ത ‘പ്രസംഗിച്ചു’ എന്ന പ്രത്യേക അർഥം ചേർക്കുന്നില്ല.
- source_word: Μετανοεῖτε
  choice: മനംതിരിയുക
  rationale: μετανοέω ചിന്തയിലും മനോഭാവത്തിലും സംഭവിക്കുന്ന അടിസ്ഥാനപരമായ മാറ്റത്തെയും അതനുസരിച്ചുള്ള തിരിഞ്ഞുവരവിനെയും സൂചിപ്പിക്കുന്നു. ‘മനംതിരിയുക’ മലയാളത്തിലെ സ്വാഭാവികമായ ബൈബിൾഭാഷ നിലനിർത്തുമ്പോഴും വെറും കുറ്റബോധമോ ഖേദമോ എന്ന അർഥത്തിലേക്ക് പദത്തെ ചുരുക്കുന്നില്ല.
- source_word: ἤγγικεν
  choice: അടുത്തുവന്നിരിക്കുന്നു
  rationale: ἐγγίζω എന്ന ക്രിയയുടെ perfect രൂപം, രാജ്യം അടുത്തുവന്നതും ഇപ്പോൾ അടുത്തായിരിക്കുന്നതുമായ നില സൂചിപ്പിക്കുന്നു; ‘അടുത്തിരിക്കുന്നു’ എന്നതിനെക്കാൾ ഈ ഘടകം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: γὰρ
  choice: ;
  rationale: മലയാളത്തിൽ ആജ്ഞയ്ക്കു പിന്നാലെയുള്ള കാരണവാക്യം അർദ്ധവിരാമത്തിലൂടെ സ്വാഭാവികമായി ബന്ധിപ്പിക്കാം; ‘എന്തെന്നാൽ’ ചേർക്കുന്നത് പ്രഖ്യാപനത്തെ അനാവശ്യമായി ഭാരപ്പെടുത്തും. കാരണബന്ധം വാക്യക്രമത്തിൽ വ്യക്തമാണ്.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: സ്വർഗരാജ്യം
  rationale: മത്തായിയുടെ സവിശേഷമായ പ്രയോഗത്തിന് മലയാളത്തിൽ സ്ഥാപിതവും സ്വാഭാവികവുമായ തത്തുല്യപദം. βασιλείαയിലെ രാജാധികാരത്തിന്റെയും രാജ്യത്തിന്റെയും അർഥവ്യാപ്തി വ്യാഖ്യാനപരമായി ഒന്നിലേക്കു ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: ‘സ്വർഗരാജ്യം’ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: മത്തായിയുടെ പ്രത്യേക പദപ്രയോഗം ‘സ്വർഗരാജ്യം’ എന്നുതന്നെ നിലനിർത്തി.
  alternative: ‘ദൈവത്തിന്റെ ഭരണം’ അല്ലെങ്കിൽ ‘സ്വർഗത്തിന്റെ ഭരണം’
  rationale: വ്യാഖ്യാനപരമായ പകരപ്പദം ഉപയോഗിക്കാതെ സുവിശേഷകന്റെ ദൈവശാസ്ത്രപരമായ ഭാഷയും βασιλεία എന്ന പദത്തിന്റെ രാജ്യം/രാജവാഴ്ച എന്ന അർഥവ്യാപ്തിയും സംരക്ഷിക്കുന്നു.
- issue: Μετανοεῖτε എന്ന ആഹ്വാനത്തിന്റെ വ്യാപ്തി
  choice: ‘മനംതിരിയുക’
  alternative: ‘അനുതപിക്കുക’ അല്ലെങ്കിൽ ‘ചിന്ത മാറ്റുക’
  rationale: ‘അനുതപിക്കുക’ വെറും ഖേദമെന്ന നിലയിൽ തെറ്റിദ്ധരിക്കപ്പെടാം; ‘ചിന്ത മാറ്റുക’ ബൗദ്ധികമായ മാറ്റത്തിലേക്ക് മാത്രം ചുരുങ്ങാം. ‘മനംതിരിയുക’ ചിന്തയുടെയും ജീവിതദിശയുടെയും പുനഃക്രമീകരണം തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും പൊതുവായ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. പ്രഖ്യാപനത്തിന്റെ ചുരുക്കവും ശക്തിയും നിലനിർത്തുന്നു. പരമ്പരാഗത ബൈബിൾപദമായ ‘മനംതിരിയുക’ ഉപയോഗിച്ചെങ്കിലും അതിന്റെ വിശാലമായ ഗ്രീക്ക് അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
