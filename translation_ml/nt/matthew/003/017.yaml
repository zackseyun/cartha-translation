id: MAT.3.17
reference: Matthew 3:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ φωνὴ ἐκ τῶν οὐρανῶν λέγουσα· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ἐν ᾧ εὐδόκησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/017.yaml
  text: And behold[a], a voice from the heavens said, “This is my beloved Son[b], with whom I am well pleased.”
translation:
  language: ml
  text: 'അപ്പോൾ, ഇതാ, ആകാശങ്ങളിൽനിന്ന്[a] ഒരു ശബ്ദം ഇങ്ങനെ പറഞ്ഞു: “ഇവൻ എന്റെ പ്രിയപുത്രൻ; ഇവനിൽ ഞാൻ പ്രസാദിച്ചിരിക്കുന്നു.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ആകാശത്തുനിന്ന്.” ഗ്രീക്കിൽ “ആകാശങ്ങൾ” എന്ന ബഹുവചനമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “ഇവനോടു ഞാൻ പ്രസാദിക്കുന്നു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: ഇതാ
  rationale: ἰδού ശ്രദ്ധ ക്ഷണിക്കുന്ന വ്യവഹാരസൂചകമാണ്. മലയാളത്തിൽ ‘ഇതാ’ അതിന്റെ ഗൗരവവും ശ്രദ്ധാകർഷകമായ ശക്തിയും സ്വാഭാവികമായി നിലനിർത്തുന്നു; καί ഇവിടെ കഥയുടെ തുടർച്ച വ്യക്തമാക്കുന്നതിനാൽ പ്രത്യേകം ‘കൂടാതെ’ എന്നു പരിഭാഷപ്പെടുത്തേണ്ടതില്ല.
- source_word: φωνὴ
  choice: ഒരു ശബ്ദം
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വാക്കുകൾ φωνή ഇവിടെ വ്യക്തമായി സംസാരിക്കുന്ന ശബ്ദത്തെ സൂചിപ്പിക്കുന്നതായി കാണിക്കുന്നു.
- source_word: ἐκ τῶν οὐρανῶν
  choice: ആകാശങ്ങളിൽനിന്ന്
  rationale: ഗ്രീക്കിലെ ബഹുവചനരൂപം നേരിട്ട് നിലനിർത്തുന്നു. സാധാരണ മലയാളത്തിൽ പരിചിതമായ ഏകവചനരൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: λέγουσα
  choice: ഇങ്ങനെ പറഞ്ഞു
  rationale: ‘പറഞ്ഞുകൊണ്ട്’ എന്ന കൃത്രിമമായ ഘടനയ്ക്കു പകരം ഉദ്ധരണി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്ന സമാപികാക്രിയ ഉപയോഗിച്ചു.
- source_word: Οὗτός ἐστιν
  choice: ഇവൻ
  rationale: പുരുഷനെ ചൂണ്ടിക്കാണിച്ചുള്ള തിരിച്ചറിയൽ മലയാളത്തിൽ ‘ഇവൻ’ എന്ന വിധേയരൂപത്തിലൂടെ സ്വാഭാവികമായും നേരിട്ടും പ്രകടമാകുന്നു.
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: എന്റെ പ്രിയപുത്രൻ
  rationale: υἱός എന്ന പുത്രബന്ധവും ἀγαπητός എന്ന സ്നേഹാർദ്രമായ വിശേഷണവും സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ മലയാളപ്രയോഗത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐν ᾧ
  choice: ഇവനിൽ
  rationale: ἐν എന്ന പൂർവപ്രത്യയത്തിന്റെ രൂപം കഴിയുന്നത്ര നേരിട്ട് സംരക്ഷിക്കുന്നു. ‘ഇവനോടു’ എന്ന ബന്ധസൂചകമായ സ്വാഭാവിക മലയാളവായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: εὐδόκησα
  choice: ഞാൻ പ്രസാദിച്ചിരിക്കുന്നു
  rationale: ദൈവിക അംഗീകാരവും ആനന്ദവും സൂചിപ്പിക്കുന്ന εὐδοκέω എന്ന ക്രിയയുടെ ഗൗരവം ‘പ്രസാദിക്കുക’ നിലനിർത്തുന്നു. ഗ്രീക്ക് aorist-നെ കർശനമായ ഭൂതകാലമായി മാത്രം നിർണയിക്കാതെ, ഉണ്ടായതും ഇപ്പോഴും പ്രസക്തവുമായ പ്രസാദം മലയാളത്തിലെ പൂർണവർത്തമാനരൂപം പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: യേശുവിനെ ദൈവം തന്റെ പുത്രനായി പ്രഖ്യാപിക്കുന്നത്
  choice: എന്റെ പ്രിയപുത്രൻ
  alternative: എന്റെ അതിപ്രിയനായ പുത്രൻ
  rationale: വാചകത്തിലുള്ള പുത്രബന്ധവും സ്നേഹത്തിന്റെ വ്യക്തമായ പ്രഖ്യാപനവും നിലനിർത്തുന്നു; ദത്തുപുത്രത്വമോ മറ്റേതെങ്കിലും അധിക സിദ്ധാന്തവ്യാഖ്യാനമോ വാചകത്തിലേക്ക് ചേർക്കുന്നില്ല.
- issue: ἐν ᾧ εὐδόκησα എന്ന പ്രയോഗത്തിന്റെ ബന്ധവും കാലഭാവവും
  choice: ഇവനിൽ ഞാൻ പ്രസാദിച്ചിരിക്കുന്നു
  alternative: ഇവനോടു ഞാൻ പ്രസാദിക്കുന്നു
  rationale: പ്രധാനപാഠം ἐν ᾧ എന്ന രൂപത്തെ അടുത്തായി പിന്തുടരുകയും εὐδόκησα സൂചിപ്പിക്കുന്ന മുൻപ്രവൃത്തിയുടെ ഭാവം പൂർണവർത്തമാനത്തിലൂടെ നിലനിർത്തുകയും ചെയ്യുന്നു. അതിനെ വെറും ഇപ്പോഴത്തെ വികാരമായോ പൂർണമായും കഴിഞ്ഞ സംഭവമായോ ഒതുക്കാതെ, സ്വാഭാവികമായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ സ്വർഗീയ പ്രഖ്യാപനത്തിന്റെ ഗൗരവം നിലനിർത്തുന്ന ശൈലി. ‘ഇതാ’, ‘പ്രിയപുത്രൻ’, ‘പ്രസാദിച്ചിരിക്കുന്നു’ എന്നീ പദങ്ങൾ ഔന്നത്യമുള്ളതാണെങ്കിലും ഇന്നത്തെ മലയാളത്തിൽ മനസ്സിലാക്കാവുന്നതാണ്. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും ബന്ധപ്പെട്ട പദപ്രയോഗത്തിന് പിന്നാലെ പ്രധാനപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
