id: MAT.3.3
reference: Matthew 3:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὗτος γάρ ἐστιν ὁ ῥηθεὶς ⸀διὰ Ἠσαΐου τοῦ προφήτου λέγοντος· Φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/003.yaml
  text: 'For this is the one spoken of through Isaiah the prophet[a], saying: “A voice of one crying in the wilderness: ‘Prepare the way of the Lord[b]; make his paths straight.’”'
translation:
  language: ml
  text: 'കാരണം, യെശയ്യാ പ്രവാചകൻ മുഖാന്തരം ഇങ്ങനെ പറയപ്പെട്ടവൻ ഇവനാണ്:


    “മരുഭൂമിയിൽ വിളിച്ചുപറയുന്നവന്റെ ശബ്ദം:[a]


    ‘കർത്താവിന്റെ[b] വഴി ഒരുക്കുവിൻ;


    അവന്റെ പാതകൾ നേരെയാക്കുവിൻ.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘മരുഭൂമിയിൽ’ എന്നത് ‘കർത്താവിന്റെ വഴി ഒരുക്കുവിൻ’ എന്നതിനോടു ചേർത്ത് വായിക്കാം.
    reason: പുരാതന പാഠത്തിലെ വിരാമചിഹ്നങ്ങളില്ലാത്ത ഘടനയിൽ ἐν τῇ ἐρήμῳ എന്നതിന്റെ സാധ്യമായ മറ്റൊരു ബന്ധം സൂചിപ്പിക്കുന്നു.
  - marker: b
    text: യെശയ്യാവ് 40:3-ലെ എബ്രായ പാഠത്തിൽ ഇവിടെ ദൈവനാമമായ യഹോവ (YHWH) എന്നാണ്.
    reason: ഉദ്ധരിക്കപ്പെടുന്ന എബ്രായ പാഠത്തിലെ ദൈവനാമവും ഗ്രീക്ക് κυρίου-വുമായ അന്തർപാഠബന്ധവും വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: οὗτος γάρ ἐστιν ὁ ῥηθεὶς
  choice: ഇവനെക്കുറിച്ചാണ് … അരുളിച്ചെയ്തത്
  rationale: οὗτος യോഹന്നാനെ ചൂണ്ടിക്കാണിക്കുന്നു; ὁ ῥηθεὶς എന്ന കർമണിപ്രയോഗത്തിന്റെ ‘ഇവനെക്കുറിച്ച് പറയപ്പെട്ടു’ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു. γάρ നൽകുന്ന വിശദീകരണബന്ധം സന്ദർഭവും ‘ആണ്’ എന്ന ഊന്നലും വ്യക്തമാക്കുന്നു.
- source_word: διὰ Ἠσαΐου τοῦ προφήτου λέγοντος
  choice: യെശയ്യാ പ്രവാചകനിലൂടെ ഇങ്ങനെ അരുളിച്ചെയ്തത്
  rationale: διά + സമ്പ്രദാനം പ്രവാചകനെ മാധ്യമമായി അവതരിപ്പിക്കുന്നതിനാൽ ‘മുഖാന്തരം/വഴി’ എന്നതിൽ സ്വാഭാവികമായ ‘ലൂടെ’ തെരഞ്ഞെടുത്തു. തിരുവെഴുത്തിലെ ദൈവിക അരുളപ്പാടിന്റെ ഗൗരവം സൂചിപ്പിക്കാൻ ‘അരുളിച്ചെയ്തത്’ ഉപയോഗിച്ചു.
- source_word: Φωνὴ βοῶντος
  choice: വിളിച്ചുപറയുന്നവന്റെ ശബ്ദം
  rationale: γενitive participle ആയ βοῶντος-ന്റെ ‘ഒരാൾ വിളിച്ചുപറയുന്നു’ എന്ന ഘടനയും φωνήയുടെ കവിതാത്മക രൂപവും നിലനിർത്തുന്നു.
- source_word: ἐν τῇ ἐρήμῳ
  choice: മരുഭൂമിയിൽ
  rationale: യോഹന്നാന്റെ ശുശ്രൂഷാസന്ദർഭത്തിനും യെശയ്യാ ഉദ്ധരണിക്കും യോജിക്കുന്ന സാധാരണവും വ്യക്തവുമായ പദം.
- source_word: Ἑτοιμάσατε τὴν ὁδὸν κυρίου
  choice: കർത്താവിന്റെ വഴി ഒരുക്കുവിൻ
  rationale: ബഹുവചന ആജ്ഞാരൂപവും പ്രവാചകീയ ഗൗരവവും നിലനിർത്തുന്നു; ὁδός എന്നത് ഇവിടെ അക്ഷരാർഥവും രൂപകാർഥവും വഹിക്കാവുന്ന ‘വഴി’യായി വിവർത്തനം ചെയ്തു.
- source_word: εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ
  choice: അവന്റെ പാതകൾ നേരെയാക്കുവിൻ
  rationale: εὐθείας ποιεῖτε എന്ന ‘നേരെയാക്കുക’ എന്ന രൂപകവും αὐτοῦ എന്ന വ്യക്തിപരമായ സർവനാമവും വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: യെശയ്യാവ് 40:3-ലെ ദൈവനാമമുള്ള പശ്ചാത്തലത്തിൽ κυρίου എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: കർത്താവിന്റെ
  alternative: യഹോവയുടെ
  rationale: മത്തായിയുടെ ഗ്രീക്ക് പാഠത്തിൽ κυρίου എന്നാണ്; അതിനാൽ മുഖ്യപാഠത്തിൽ ‘കർത്താവ്’ ഉപയോഗിച്ചു. എന്നാൽ ഉദ്ധരിക്കപ്പെടുന്ന എബ്രായ പാഠത്തിൽ YHWH എന്ന ദൈവനാമമാണെന്ന പ്രധാന അന്തർപാഠബന്ധം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
- issue: ἐν τῇ ἐρήμῳ ഏതിനോടാണ് ചേർന്നു നിൽക്കുന്നത്
  choice: ‘വിളിച്ചുപറയുന്നവൻ’ എന്നതിനോടു ചേർത്തു
  alternative: ‘മരുഭൂമിയിൽ കർത്താവിന്റെ വഴി ഒരുക്കുവിൻ’
  rationale: മത്തായി 3-ലെ യോഹന്നാന്റെ മരുഭൂമിശുശ്രൂഷയും സാധാരണ ഗ്രീക്ക് വായനയും മുഖ്യവായനയെ പിന്തുണയ്ക്കുന്നു. എങ്കിലും പുരാതന വിരാമചിഹ്നരഹിത പാഠത്തിൽ സാധ്യമായ മറ്റൊരു ഘടന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ, എന്നാൽ പ്രവാചകീയ ഉദ്ധരണിക്ക് യോജിച്ച ഗൗരവത്തോടെ രചിച്ചു. ‘ഒരുക്കുവിൻ’, ‘നേരെയാക്കുവിൻ’ എന്നീ രൂപങ്ങൾ കവിതാത്മകവും പൊതുസംബോധനാപരവുമായ ആജ്ഞാഭാവം നിലനിർത്തുന്നു; ഉദ്ധരണിയുടെ വരിവിന്യാസവും സംരക്ഷിച്ചു.
