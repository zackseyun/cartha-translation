id: MAT.3.11
reference: Matthew 3:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐγὼ μὲν ⸂ὑμᾶς βαπτίζω⸃ ἐν ὕδατι εἰς μετάνοιαν· ὁ δὲ ὀπίσω μου ἐρχόμενος ἰσχυρότερός μού ἐστιν, οὗ οὐκ εἰμὶ ἱκανὸς τὰ ὑποδήματα βαστάσαι· αὐτὸς ὑμᾶς βαπτίσει ἐν πνεύματι ἁγίῳ ⸂καὶ πυρί⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/011.yaml
  text: I indeed baptize you in water for repentance[a], but the one coming after me is stronger than I, whose sandals I am not worthy to carry[c][b]. He himself will baptize you in the Holy Spirit and fire.
translation:
  language: ml
  text: ഞാൻ നിങ്ങളെ മാനസാന്തരത്തിനായി വെള്ളത്തിൽ സ്നാനം കഴിപ്പിക്കുന്നു[a][b]. എന്നാൽ എന്റെ പിന്നാലെ വരുന്നവൻ എന്നെക്കാൾ ശക്തനാണ്. അവന്റെ ചെരിപ്പുകൾ ചുമക്കാൻപോലും ഞാൻ യോഗ്യനല്ല. അവൻതന്നെ നിങ്ങളെ പരിശുദ്ധാത്മാവിലും തീയിലും സ്നാനം കഴിപ്പിക്കും[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വെള്ളത്തിൽ’ എന്നതിനു പകരം ‘വെള്ളംകൊണ്ട്’ എന്നും, പിന്നീട് ‘പരിശുദ്ധാത്മാവുകൊണ്ടും തീകൊണ്ടും’ എന്നും വിവർത്തനം ചെയ്യാം; ഈ പ്രയോഗങ്ങളിൽ ഗ്രീക്കിലെ ἐν എന്ന മുൻവാക്കിന് രണ്ടുവിധത്തിലും അർഥം നൽകാം.
    reason: lexical_alternative
  - marker: b
    text: ‘മാനസാന്തരത്തിനായി’ എന്നത് മാനസാന്തരത്തിലേക്കുള്ള ദിശയെയോ അതുമായുള്ള ലക്ഷ്യബന്ധത്തെയോ സൂചിപ്പിക്കാം; മാനസാന്തരം സ്നാനത്തിനു മുമ്പാണോ, സ്നാനം അതിനെ അടയാളപ്പെടുത്തുന്നുവോ എന്ന് ഈ പദപ്രയോഗം മാത്രം നിർണയിക്കുന്നില്ല.
    reason: lexical_alternative
  - marker: c
    text: ഇവിടെയുള്ള ‘തീ’ ശുദ്ധീകരണത്തെയോ ന്യായവിധിയെയോ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം; ഗ്രീക്ക് പ്രയോഗം ചിത്രം തുറന്നുവെക്കുന്നു, ചുറ്റുപാടുള്ള വാക്യങ്ങളാണ് വ്യാഖ്യാനത്തിന് വഴികാട്ടേണ്ടത്.
    reason: alternative_reading
lexical_decisions:
- source_word: βαπτίζω / βαπτίσει
  choice: സ്നാനം കഴിപ്പിക്കുന്നു / സ്നാനം കഴിപ്പിക്കും
  rationale: ക്രിയയുടെ ആചാരപരമായ അർഥം നിലനിർത്തുന്ന, മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും സ്വാഭാവികവുമായ പ്രയോഗം; സ്നാനത്തിന്റെ രീതി ‘മുക്കുക’ എന്നു പ്രത്യേകം നിർണയിക്കുന്നില്ല.
- source_word: ἐν ὕδατι
  choice: വെള്ളത്തിൽ
  rationale: ἐν എന്ന മുൻവാക്കിന്റെ സ്ഥാനാർഥം നേരിട്ട് നിലനിർത്തുകയും പിന്നീടുള്ള സമാന്തരപ്രയോഗവുമായി പൊരുത്തപ്പെടുകയും ചെയ്യുന്നു; ‘വെള്ളംകൊണ്ട്’ എന്നും വിവർത്തനം സാധ്യമാണ്.
- source_word: εἰς μετάνοιαν
  choice: മാനസാന്തരത്തിനായി
  rationale: εἰς എന്നതിന്റെ ദിശാ/ഉദ്ദേശ്യബന്ധം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; സ്നാനവും മാനസാന്തരവും തമ്മിലുള്ള കൃത്യമായ ക്രമമോ കാരണബന്ധമോ നിർബന്ധമായി തീർപ്പാക്കുന്നില്ല.
- source_word: ὁ δὲ ὀπίσω μου ἐρχόμενος
  choice: എന്നാൽ എന്റെ പിന്നാലെ വരുന്നവൻ
  rationale: പങ്കാളിക്രിയയുടെ അർഥവും δέ സൂചിപ്പിക്കുന്ന വൈരുധ്യവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἰσχυρότερός μού
  choice: എന്നെക്കാൾ ശക്തനാണ്
  rationale: താരതമ്യരൂപത്തിന്റെ നേരിട്ടുള്ളതും ആധുനികവുമായ പരിഭാഷ.
- source_word: οὗ οὐκ εἰμὶ ἱκανὸς
  choice: അവന്റെ ... ഞാൻ യോഗ്യനല്ല
  rationale: ἱκανός എന്നതിന്റെ ‘പര്യാപ്തൻ/കഴിവുള്ളവൻ’ എന്ന അടിസ്ഥാനവ്യാപ്തി ഉണ്ടായിരുന്നാലും, ഇവിടെ വിനയസൂത്രത്തിന്റെ സന്ദർഭാർഥം ‘യോഗ്യനല്ല’ എന്നതിലൂടെ വ്യക്തമായി ലഭിക്കുന്നു.
- source_word: τὰ ὑποδήματα βαστάσαι
  choice: ചെരിപ്പുകൾ ചുമക്കാൻപോലും
  rationale: βαστάσαι എന്നത് ‘ചുമക്കുക/വഹിക്കുക’ എന്നാണ്; ‘അഴിക്കുക’ എന്നല്ല. ‘പോലും’ എന്നത് മലയാളത്തിൽ വിനയവാക്യത്തിന്റെ ഊന്നൽ സ്വാഭാവികമാക്കുന്നു.
- source_word: αὐτὸς
  choice: അവൻതന്നെ
  rationale: യോഹന്നാന്റെ പ്രവർത്തനത്തോടുള്ള വ്യത്യാസത്തിൽ ഗ്രീക്കിലെ ഊന്നൽ സംരക്ഷിക്കുന്നു.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: പരിശുദ്ധാത്മാവിൽ
  rationale: ഈ സന്ദർഭത്തിലെ വ്യക്തിപരമായ പരിശുദ്ധാത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്; ആവർത്തിക്കുന്ന ἐν ഘടനയും നിലനിർത്തുന്നു.
- source_word: καὶ πυρί
  choice: തീയിലും
  rationale: സമുച്ചയവും ദത്തിവ് സമാന്തരതയും ചുരുക്കമായി നിലനിർത്തുന്നു; തീ ശുദ്ധീകരണമോ ന്യായവിധിയോ എന്ന് മുഖ്യവാചകത്തിൽ നിർണയിക്കുന്നില്ല.
theological_decisions:
- issue: ‘പരിശുദ്ധാത്മാവിലും തീയിലും’ എന്നതിലെ തീയുടെ അർഥം
  choice: വ്യാഖ്യാനവികാസമില്ലാതെ അക്ഷരാർഥത്തിലുള്ള സംയുക്തപ്രയോഗം നിലനിർത്തി.
  alternative: ‘ശുദ്ധീകരിക്കുന്ന തീയിൽ’ അല്ലെങ്കിൽ ‘ന്യായവിധിയുടെ തീയിൽ’
  rationale: അടുത്ത സന്ദർഭത്തിൽ ന്യായവിധിയുടെ ദൃശ്യങ്ങൾ ശക്തമാണെങ്കിലും, ഈ വാക്യത്തിലെ രൂപകം ശുദ്ധീകരണം എന്ന വായനയും പൂർണമായി ഒഴിവാക്കുന്നില്ല; അതിനാൽ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഭാഷയിൽ തീർപ്പാക്കിയിട്ടില്ല.
- issue: πνεύματι ἁγίῳ എന്നതിന്റെ സൂചന
  choice: ‘പരിശുദ്ധാത്മാവ്’ എന്ന വ്യക്തിപരമായ സൂചനയായി വിവർത്തനം ചെയ്തു.
  alternative: ‘വിശുദ്ധമായ ആത്മാവിൽ’ അല്ലെങ്കിൽ ‘പരിശുദ്ധാത്മാവിന്റെ ശക്തിയാൽ’
  rationale: മത്തായിയുടെ സന്ദർഭവും പുതിയനിയമത്തിലെ സാധാരണ പ്രയോഗവും വ്യക്തിപരമായ പരിശുദ്ധാത്മാവിനെയാണ് അനുകൂലിക്കുന്നത്; ‘ശക്തി’ എന്ന വ്യാഖ്യാനം മൂലപാഠത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ വചനത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ‘മാനസാന്തരം,’ ‘സ്നാനം,’ ‘പരിശുദ്ധാത്മാവ്’ എന്നീ സ്ഥാപിതവും വ്യാപകമായി ഗ്രഹിക്കപ്പെടുന്നതുമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തി. നീണ്ട ഗ്രീക്ക് ബന്ധവാക്യം മലയാളത്തിലെ വ്യക്തതയ്ക്കായി ചെറുവാക്യങ്ങളാക്കി; അർഥബന്ധവും ഊന്നലും സംരക്ഷിച്ചു.
