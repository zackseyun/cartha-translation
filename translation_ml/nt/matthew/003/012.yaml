id: MAT.3.12
reference: Matthew 3:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὗ τὸ πτύον ἐν τῇ χειρὶ αὐτοῦ, καὶ διακαθαριεῖ τὴν ἅλωνα αὐτοῦ καὶ συνάξει τὸν σῖτον αὐτοῦ εἰς τὴν ⸀ἀποθήκην, τὸ δὲ ἄχυρον κατακαύσει πυρὶ ἀσβέστῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/012.yaml
  text: His winnowing fork is in his hand[a], and he will thoroughly clear his threshing floor and gather his wheat into the storehouse[b], but the chaff he will burn up with unquenchable fire.
translation:
  language: ml
  text: അവന്റെ വീശുമുറം അവന്റെ കൈയിലുണ്ട്[a]. അവൻ തന്റെ മെതിക്കളം പൂർണമായി വൃത്തിയാക്കും; തന്റെ ഗോതമ്പ് കളപ്പുരയിൽ ശേഖരിക്കും[b]. എന്നാൽ പതിർ കെടുത്താനാവാത്ത തീയിൽ പൂർണമായി ചുട്ടുകളയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പാറ്റുകോരി.’ ഇവിടെ ധാന്യം കാറ്റത്തിട്ട് വേർതിരിക്കാൻ ഉപയോഗിക്കുന്ന ഉപകരണമാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ധാന്യപ്പുര’ അല്ലെങ്കിൽ ‘സംഭരണശാല.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πτύον
  choice: വീശുമുറം
  rationale: ധാന്യം കാറ്റത്തിട്ട് ധാന്യവും പതിരും വേർതിരിക്കാൻ ഉപയോഗിക്കുന്ന കാർഷികോപകരണത്തെ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭത്തിന് യോജിച്ചതുമായ പദമാണിത്; ഉപകരണത്തിന്റെ കൃത്യരൂപത്തെക്കുറിച്ചുള്ള സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: διακαθαριεῖ
  choice: പൂർണമായി വൃത്തിയാക്കി
  rationale: ക്രിയയിലെ സമഗ്രമായ ശുചീകരണത്തിന്റെ ഊന്നൽ നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: ἅλωνα
  choice: മെതിക്കളം
  rationale: ധാന്യം മെതിക്കുകയും പാറ്റുകയും ചെയ്യുന്ന സ്ഥലത്തിനുള്ള കൃത്യവും പരമ്പരാഗതമായി മനസ്സിലാകുന്നതുമായ മലയാളപദം.
- source_word: σῖτον
  choice: ഗോതമ്പ്
  rationale: ഈ പദത്തിന് പൊതുവായി ധാന്യം എന്ന അർഥമുണ്ടാകാമെങ്കിലും, പതിരുമായുള്ള വിരുദ്ധതയിൽ ഗോതമ്പ് എന്നത് സ്വാഭാവികവും ദൃശ്യബിംബത്തിന് യോജിച്ചതുമാണ്.
- source_word: ἀποθήκην
  choice: കളപ്പുര
  rationale: ധാന്യം സൂക്ഷിക്കുന്ന സംഭരണസ്ഥലത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; കൂടുതൽ പൊതുവായ 'സംഭരണശാല' എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἄχυρον
  choice: പതിർ
  rationale: പാറ്റലിൽ ധാന്യത്തിൽനിന്ന് വേർതിരിക്കപ്പെടുന്ന വിലയില്ലാത്ത തൊലി/അവശിഷ്ടം എന്ന കാർഷികദൃശ്യത്തിന് യോജിച്ച പദം.
- source_word: κατακαύσει
  choice: പൂർണമായി ചുട്ടുകളയും
  rationale: വെറും കത്തിക്കൽ മാത്രമല്ല, തീയിൽ പൂർണമായി ദഹിപ്പിക്കൽ എന്ന സംയുക്തക്രിയയുടെ ഊന്നൽ പ്രകടമാക്കുന്നു.
- source_word: πυρὶ ἀσβέστῳ
  choice: കെടുത്താനാവാത്ത തീയിൽ
  rationale: അണയ്ക്കാനോ കെടുത്താനോ കഴിയാത്ത തീ എന്ന അർഥം നേരിട്ട് നൽകുന്നു; മലയാളത്തിൽ 'തീയിൽ' എന്ന പ്രയോഗം സ്വാഭാവികമാണ്.
- source_word: οὗ
  choice: അവന്റെ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞുവരുന്നവനിലേക്കുള്ള ബന്ധവും ഉടമസ്ഥതാഭാവവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഗോതമ്പും പതിരും വേർതിരിക്കുന്ന ന്യായവിധിയുടെ ദൃശ്യബിംബം
  choice: കാർഷികരൂപകവും ഭാവിയിലെ സമ്പൂർണ ന്യായവിധിയെ സൂചിപ്പിക്കുന്ന കഠിനഭാഷയും അതേപടി നിലനിർത്തി.
  alternative: ഗോതമ്പ് നീതിമാന്മാരെയും പതിർ ദുഷ്ടന്മാരെയും നേരിട്ട് സൂചിപ്പിക്കുന്നതായി മുഖ്യപാഠത്തിൽ വ്യാഖ്യാനിച്ചു പറയുക.
  rationale: വാക്യം തന്നെയാണ് രൂപകം അവതരിപ്പിക്കുന്നത്; അതിന്റെ പ്രതീകാർത്ഥം മുഖ്യപാഠത്തിൽ വിശദീകരിക്കുന്നത് മൂലപാഠത്തേക്കാൾ അധികമായ വ്യാഖ്യാനം ചേർക്കും. അതിനാൽ ദൃശ്യബിംബവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും തുറന്ന നിലയിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവമുള്ള ശൈലി. കാർഷികപദങ്ങളായ ‘വീശുമുറം,’ ‘മെതിക്കളം,’ ‘പതിർ’ എന്നിവ മൂലദൃശ്യത്തെ വ്യക്തമായി നിലനിർത്തുന്നു. വിധിയുടെ കഠിനത മയപ്പെടുത്തുകയോ രൂപകത്തിന്റെ വ്യക്തികളെ വ്യാഖ്യാനിച്ച് ചേർക്കുകയോ ചെയ്തിട്ടില്ല.
