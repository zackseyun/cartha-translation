id: MAT.3.16
reference: Matthew 3:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂βαπτισθεὶς δὲ⸃ ὁ Ἰησοῦς ⸂εὐθὺς ἀνέβη⸃ ἀπὸ τοῦ ὕδατος· καὶ ἰδοὺ ⸀ἠνεῴχθησαν οἱ οὐρανοί, καὶ εἶδεν ⸀πνεῦμα θεοῦ καταβαῖνον ὡσεὶ ⸀περιστερὰν ἐρχόμενον ἐπ’ αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/016.yaml
  text: And when Jesus was baptized[a], he immediately came up from the water. And behold, the heavens were opened[c][b], and he saw the Spirit of God descending like a dove and coming upon him.
translation:
  language: ml
  text: യേശു സ്നാനം ഏറ്റശേഷം ഉടനെ വെള്ളത്തിൽനിന്നു കയറിവന്നു.[a] അപ്പോൾ ഇതാ, ആകാശങ്ങൾ തുറക്കപ്പെട്ടു; ദൈവത്തിന്റെ ആത്മാവ് പ്രാവിനെപ്പോലെ ഇറങ്ങിവന്ന് യേശുവിന്റെമേൽ വരുന്നത് അവൻ കണ്ടു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വെള്ളത്തിൽനിന്നു പുറത്തേക്കു കയറിവന്നു.’ ഗ്രീക്കിൽ ‘വെള്ളത്തിൽനിന്ന്’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘പ്രാവിനെപ്പോലെ’ എന്നത് താരതമ്യമാണ്; ആത്മാവ് അക്ഷരാർഥത്തിൽ പ്രാവായിരുന്നു എന്നു ഗ്രീക്ക് പറയുന്നില്ല. ‘യേശുവിന്റെമേൽ വരുന്നത്’ എന്നതിനു ചില പരിഭാഷകൾ ‘യേശുവിന്റെമേൽ വന്നിറങ്ങുന്നത്’ എന്നു നൽകുന്നു; എന്നാൽ ഗ്രീക്കിലെ ക്രിയയ്ക്ക് കൂടുതൽ അക്ഷരാർഥത്തിൽ ‘വരുക’ എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: βαπτισθεὶς δὲ ὁ Ἰησοῦς
  choice: യേശു സ്നാനം ഏറ്റശേഷം
  rationale: Aorist passive participle പ്രധാനക്രിയയ്ക്കു മുൻപുള്ള സംഭവത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ കാലക്രമവും കർമണാർത്ഥവും ‘സ്നാനം ഏറ്റശേഷം’ വ്യക്തമാക്കുന്നു.
- source_word: εὐθὺς ἀνέβη ἀπὸ τοῦ ὕδατος
  choice: ഉടനെ വെള്ളത്തിൽനിന്നു കയറിവന്നു
  rationale: εὐθύς എന്നതിന്റെ ത്വരിതക്രമം ‘ഉടനെ’ നിലനിർത്തുന്നു. ἀπό എന്നത് ‘നിന്ന്’ എന്ന അർത്ഥമായതിനാൽ ‘വെള്ളത്തിൽനിന്ന്’ എന്നു നൽകി; ‘വെള്ളത്തിൽനിന്ന് പുറത്തേക്ക്’ എന്ന ശക്തമായ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: καὶ ἰδοὺ
  choice: അപ്പോൾ ഇതാ
  rationale: ἰδούവിന്റെ ശ്രദ്ധ ക്ഷണിക്കുന്ന സജീവത ‘ഇതാ’ നിലനിർത്തുന്നു; ‘അപ്പോൾ’ ആഖ്യാനപ്രവാഹം സ്വാഭാവികമാക്കുന്നു.
- source_word: ἠνεῴχθησαν οἱ οὐρανοί
  choice: ആകാശങ്ങൾ തുറക്കപ്പെട്ടു
  rationale: ഗ്രീക്കിലെ ബഹുവചനവും കർമണിരൂപവും സംരക്ഷിക്കുന്നു. ‘ആകാശങ്ങൾ’ സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതും വേദപാരമ്പര്യത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നതുമാണ്.
- source_word: πνεῦμα θεοῦ
  choice: ദൈവത്തിന്റെ ആത്മാവ്
  rationale: Genitive ഘടന നേരിട്ട് നിലനിർത്തുന്നു; മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘പരിശുദ്ധ’ എന്ന വിശേഷണം ചേർക്കാതെ സന്ദർഭത്തിലെ വ്യക്തമായ ദൈവാത്മസൂചന സംരക്ഷിക്കുന്നു.
- source_word: καταβαῖνον ὡσεὶ περιστερὰν
  choice: പ്രാവിനെപ്പോലെ ഇറങ്ങിവന്ന്
  rationale: ὡσεὶ സൂചിപ്പിക്കുന്ന ഉപമ നിലനിർത്തുന്നു; ആത്മാവ് അക്ഷരാർഥത്തിൽ പ്രാവായിരുന്നു എന്നു പറയുന്നില്ല.
- source_word: ἐρχόμενον ἐπ’ αὐτόν
  choice: തന്റെമേൽ വരുന്നത്
  rationale: ἐρχόμενον എന്ന പൊതുവായ ചലനക്രിയയെ ‘വരുന്നത്’ എന്നു സുതാര്യമായി നൽകി; ‘വന്നിരുന്നു’ അഥവാ ‘ഇരുന്നു’ പോലുള്ള കൂടുതൽ വ്യാഖ്യാനാത്മക പദങ്ങൾ ഒഴിവാക്കി. αὐτόν യേശുവിനെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിലെ സ്വാഭാവിക പ്രത്യാവർത്തിസർവനാമം ഉപയോഗിച്ചു.
theological_decisions:
- issue: πνεῦμα θεοῦ പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്നുവോ, പൊതുവായ ഒരു ആത്മാവിനെയോ
  choice: ദൈവത്തിന്റെ ആത്മാവ്
  alternative: ദൈവാത്മാവ്; ദൈവത്തിൽനിന്നുള്ള ഒരു ആത്മാവ്
  rationale: സ്നാനസന്ദർഭം നിർദിഷ്ടമായ ദൈവാത്മസൂചനയെ പിന്തുണയ്ക്കുന്നു. എങ്കിലും ഗ്രീക്കിലെ കൃത്യമായ പ്രയോഗം നിലനിർത്തി ‘പരിശുദ്ധാത്മാവ്’ എന്നു വികസിപ്പിച്ചിട്ടില്ല.
- issue: ὡσεὶ περιστερὰν ആത്മാവിനെ പ്രാവായി തിരിച്ചറിയിക്കുന്നുവോ, ഇറക്കത്തെ ഉപമിക്കുന്നുവോ
  choice: പ്രാവിനെപ്പോലെ
  alternative: പ്രാവായി
  rationale: ὡσεὶ താരതമ്യം സൂചിപ്പിക്കുന്നതിനാൽ ഉപമ സംരക്ഷിച്ചു; ആത്മാവ് അക്ഷരാർഥത്തിൽ പ്രാവായിരുന്നുവെന്ന നിർണ്ണയം ഒഴിവാക്കി.
- issue: εἶδεν എന്നതിലെ കർത്താവ് ആരാണ്
  choice: അവൻ കണ്ടു—സമീപസ്ഥനായ യേശുവിനെ കർത്താവായി നിലനിർത്തുന്നു
  alternative: യോഹന്നാൻ കണ്ടു
  rationale: വാക്യഘടനയിൽ സ്വാഭാവികമായ കർത്താവ് യേശുവാണ്. യോഹന്നാനെ കർത്താവാക്കുന്നത് ഈ വാക്യത്തിൽ വ്യക്തമല്ലാത്ത ഒരു വ്യാഖ്യാനം ചേർക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ഇതാ’, ‘ആകാശങ്ങൾ’, ‘ദൈവത്തിന്റെ ആത്മാവ്’ എന്നീ പദങ്ങൾ വേദപാഠത്തിന്റെ ഉയർന്ന ഭാവം നിലനിർത്തുമ്പോഴും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നവയാണ്. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
