id: MAT.3.9
reference: Matthew 3:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ μὴ δόξητε λέγειν ἐν ἑαυτοῖς· Πατέρα ἔχομεν τὸν Ἀβραάμ, λέγω γὰρ ὑμῖν ὅτι δύναται ὁ θεὸς ἐκ τῶν λίθων τούτων ἐγεῖραι τέκνα τῷ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/009.yaml
  text: And do not presume to say among yourselves[a], ‘We have Abraham as our father,’ for I tell you that God is able to raise up children for Abraham from these stones.
translation:
  language: ml
  text: “‘അബ്രാഹാം ഞങ്ങളുടെ പിതാവാണ്’ എന്ന് നിങ്ങളുടെയിടയിൽ പറയാൻ വിചാരിക്കരുത്.[a] കാരണം, ഈ കല്ലുകളിൽനിന്ന് അബ്രാഹാമിന് മക്കളെ ഉയർത്താൻ ദൈവത്തിന് കഴിയും എന്നു ഞാൻ നിങ്ങളോടു പറയുന്നു.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങളുടെ ഉള്ളിൽത്തന്നെ പറയുക.” ഗ്രീക്ക് പ്രയോഗം വ്യക്തികളുടെ ഉള്ളിലെ സ്വസംസാരത്തെയോ അവർ ഒരു കൂട്ടമായി തങ്ങളുടെയിടയിൽ പറയുന്നതിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ δόξητε
  choice: പറയാമെന്ന് കരുതരുത്
  rationale: μή സഹിതമുള്ള aorist subjunctive തെറ്റായ ആത്മവിശ്വാസം സ്വീകരിക്കരുതെന്ന വിലക്കാണ്. മലയാളത്തിൽ സ്വാഭാവികമായി ആ മുന്നറിയിപ്പ് അറിയിക്കാനായി തുടർന്നുള്ള infinitive-നൊപ്പം ‘പറയാമെന്ന് കരുതരുത്’ എന്നു നൽകി.
- source_word: λέγειν ἐν ἑαυτοῖς
  choice: നിങ്ങളുടെയിടയിൽത്തന്നെ പറയുക
  rationale: ബഹുവചന reflexive പ്രയോഗം ഉള്ളിലെ സ്വസംസാരത്തെയോ കൂട്ടത്തിനുള്ളിലെ പരസ്പരസംസാരത്തെയോ സൂചിപ്പിക്കാം. മുഖ്യപാഠം കൂട്ടത്തിനുള്ളിലെ അവകാശവാദം മുൻനിർത്തുന്നു; മറ്റർത്ഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: Πατέρα ἔχομεν τὸν Ἀβραάμ
  choice: അബ്രാഹാം ഞങ്ങളുടെ പിതാവാണ്
  rationale: വംശപരമായ പിതൃത്വാവകാശം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഊന്നലോടെയും പ്രകടിപ്പിക്കുന്നു.
- source_word: λέγω γὰρ ὑμῖν
  choice: കാരണം ... എന്നു ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: γάρ-ന്റെ വിശദീകരണബന്ധവും യോഹന്നാന്റെ ഗൗരവമുള്ള പ്രസ്താവനാശൈലിയും നിലനിർത്തുന്നു.
- source_word: δύναται
  choice: കഴിയും
  rationale: ദൈവത്തിന്റെ ശേഷിയും അധികാരവും ലളിതവും സ്വാഭാവികവുമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ἐκ τῶν λίθων τούτων
  choice: ഈ കല്ലുകളിൽനിന്ന്
  rationale: ἐκ-ന്റെ ഉറവിടാർഥവും ദൃശ്യരൂപവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἐγεῖραι
  choice: ഉയർത്തിക്കൊണ്ടുവരാൻ
  rationale: ഇവിടെ പുനരുത്ഥാനം എന്നു നിർബന്ധമായി വ്യാഖ്യാനിക്കാതെ, സന്തതികളെ ഉണ്ടാക്കുക/എഴുന്നേൽപ്പിക്കുക എന്ന ശക്തമായ ക്രിയാഭാവം സംരക്ഷിക്കുന്നു.
- source_word: τέκνα
  choice: മക്കൾ
  rationale: ലിംഗഭേദമില്ലാതെ സന്തതികളെയോ മക്കളെയോ സൂചിപ്പിക്കുന്ന τέκνα-യ്ക്ക് സ്വാഭാവികമായ മലയാളപദം.
- source_word: τῷ Ἀβραάμ
  choice: അബ്രാഹാമിന്
  rationale: അബ്രാഹാമിനോടുള്ള ബന്ധം—അവന്റെ മക്കൾ/സന്തതികൾ—ദത്തിവിലൂടെ പ്രകടമാകുന്നത് ചുരുക്കമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: അബ്രാഹാമിക വംശാവലിയുടെ പ്രസക്തി
  choice: അബ്രാഹാമിൽനിന്നുള്ള ശാരീരിക വംശപരമ്പര ദൈവസന്നിധിയിൽ സ്വതേ സുരക്ഷ നൽകുന്നു എന്ന ആശ്രയത്തെ വാക്യം തള്ളുന്നു; എന്നാൽ ഇസ്രായേലിന്റെ ചരിത്രപരമായ പിതാവെന്ന അബ്രാഹാമിന്റെ സ്ഥാനം നിഷേധിക്കുന്നില്ല.
  alternative: ഇത് വംശപരമായ പ്രത്യേകാവകാശത്തെ വിമർശിക്കാത്ത വെറും അതിശയോക്തിയാണെന്നോ, ജാതിയായ ഇസ്രായേൽ പൂർണമായി മാറ്റിസ്ഥാപിക്കപ്പെട്ടു എന്നോ വായിക്കുക.
  rationale: വാക്യം പിതൃവംശത്തിലുള്ള ആത്മവിശ്വാസത്തെ നേരിട്ട് ശാസിക്കുന്നു; പക്ഷേ പിന്നീട് രൂപപ്പെട്ട പകരംവെക്കൽ സിദ്ധാന്തമോ മറ്റൊരു സമ്പ്രദായപരമായ നിഗമനമോ പ്രസ്താവിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന ശൈലി. വംശാവകാശത്തിന്റെ അവകാശവാദവും ദൈവത്തിന്റെ ശക്തിയെക്കുറിച്ചുള്ള മറുപടിയും നേരിട്ട് സൂക്ഷിച്ചു; ഗ്രീക്കിലെ അർത്ഥദ്വയത്വം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
