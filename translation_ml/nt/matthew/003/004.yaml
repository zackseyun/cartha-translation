id: MAT.3.4
reference: Matthew 3:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: αὐτὸς δὲ ὁ Ἰωάννης εἶχεν τὸ ἔνδυμα αὐτοῦ ἀπὸ τριχῶν καμήλου καὶ ζώνην δερματίνην περὶ τὴν ὀσφὺν αὐτοῦ, ἡ δὲ τροφὴ ⸂ἦν αὐτοῦ⸃ ἀκρίδες καὶ μέλι ἄγριον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/004.yaml
  text: John himself wore clothing made of camel’s hair and a leather belt around his waist[c][b][a], and his food was locusts and wild honey.
translation:
  language: ml
  text: യോഹന്നാൻ തന്നെ ഒട്ടകത്തിന്റെ രോമംകൊണ്ടുള്ള വസ്ത്രവും അരയ്ക്കു ചുറ്റും തോൽപ്പട്ടയും ധരിച്ചിരുന്നു[c][b][a]. വെട്ടുക്കിളിയും കാട്ടുതേനും ആയിരുന്നു അദ്ദേഹത്തിന്റെ ആഹാരം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: യോഹന്നാന്റെ വസ്ത്രധാരണം 2 രാജാക്കന്മാർ 1:8-ൽ വിവരിക്കുന്ന ഏലിയാ പ്രവാചകന്റെ രൂപത്തെ അനുസ്മരിപ്പിക്കുന്നു; മത്തായി യോഹന്നാനെ അവതരിപ്പിക്കുന്നതിന്റെ പ്രധാന പശ്ചാത്തലമാണിത്.
    reason: cross_reference
  - marker: b
    text: അഥവാ, ‘അദ്ദേഹത്തിന്റെ വസ്ത്രം ഒട്ടകത്തിന്റെ രോമംകൊണ്ടുള്ളതായിരുന്നു.’
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘ഒട്ടകത്തിന്റെ രോമംകൊണ്ടുള്ള വസ്ത്രം അദ്ദേഹത്തിനുണ്ടായിരുന്നു.’
    reason: previous_rendering
lexical_decisions:
- source_word: αὐτὸς δὲ ὁ Ἰωάννης
  choice: യോഹന്നാൻതന്നെ
  rationale: αὐτός നൽകുന്ന ഊന്നൽ ‘തന്നെ’ എന്നതിലൂടെ നിലനിർത്തുന്നു; δέയുടെ മൃദുവായ ബന്ധകസ്വഭാവം മലയാള വാക്യപ്രവാഹത്തിൽ പ്രത്യേകം പദമില്ലാതെയും സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: εἶχεν τὸ ἔνδυμα αὐτοῦ
  choice: വസ്ത്രം ധരിക്കുകയും ... കെട്ടുകയും ചെയ്തിരുന്നു
  rationale: εἶχεν അക്ഷരാർഥത്തിൽ ‘ഉണ്ടായിരുന്നു/വച്ചിരുന്നു’ എന്നാണെങ്കിലും, വസ്ത്രവും അരപ്പട്ടയും വിവരിക്കുന്ന ഈ സന്ദർഭത്തിൽ പതിവായ ധാരണത്തെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘ധരിക്കുകയും ... കെട്ടുകയും ചെയ്തിരുന്നു’ എന്നു നൽകി.
- source_word: ἀπὸ τριχῶν καμήλου
  choice: ഒട്ടകരോമംകൊണ്ടുള്ള
  rationale: ἀπό ഇവിടെ വസ്തു നിർമിച്ചിരിക്കുന്ന പദാർഥത്തെ സൂചിപ്പിക്കുന്നു; ‘ഒട്ടകരോമംകൊണ്ടുള്ള’ എന്നത് അതു വ്യക്തവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: ζώνην δερματίνην περὶ τὴν ὀσφὺν αὐτοῦ
  choice: അരയ്ക്കു ചുറ്റും തോൽപ്പട്ട
  rationale: ζώνηയ്ക്ക് ആധുനികവും വ്യക്തവുമായ തുല്യം ‘പട്ട’; δερματίνηൻ എന്ന വസ്തുസൂചന ‘തോൽ’ എന്നും ὀσφύς ‘അര’ എന്നും നൽകി.
- source_word: ἡ δὲ τροφὴ ἦν αὐτοῦ
  choice: ആയിരുന്നു അദ്ദേഹത്തിന്റെ ആഹാരം
  rationale: τροφὴയെ മാന്യവും സാധാരണ വായനക്കാർക്കു വ്യക്തവുമായ ‘ആഹാരം’ എന്നു നൽകി; ഗ്രീക്കിലെ വിവരണാത്മക നാമവാക്യഘടന നിലനിർത്തി.
- source_word: ἀκρίδες
  choice: വെട്ടുക്കിളി
  rationale: പദത്തിന്റെ സാധാരണവും സന്ദർഭോചിതവുമായ അർഥം ഭക്ഷ്യയോഗ്യമായ locust എന്ന കീടമാണ്; സസ്യാഹാരപരമായ പുനർവ്യാഖ്യാനം ഒഴിവാക്കി.
- source_word: μέλι ἄγριον
  choice: കാട്ടുതേൻ
  rationale: ἄγριον എന്ന വിശേഷണം വന്യമായി ലഭിക്കുന്ന തേനെ സൂചിപ്പിക്കുന്നു; ‘കാട്ടുതേൻ’ സ്വാഭാവിക മലയാളപ്രയോഗമാണ്.
theological_decisions:
- issue: ഏലിയാവിനെ അനുസ്മരിപ്പിക്കുന്ന പ്രവാചകവേഷം
  choice: വസ്ത്രവും ഭക്ഷണവും പ്രധാനവാചകത്തിൽ നേരിട്ട് വിവരിച്ച്, ഏലിയാവുമായുള്ള ബന്ധം അടിക്കുറിപ്പിൽ മാത്രം സൂചിപ്പിച്ചു.
  alternative: ഏലിയാവിനെ കൂടുതൽ പ്രകടമായി ഓർമിപ്പിക്കുന്ന വ്യാഖ്യാനാത്മക ഭാഷ പ്രധാനവാചകത്തിൽ ചേർക്കുക.
  rationale: മത്തായി നേരിട്ട് നൽകുന്ന വിവരണം പരിഭാഷയിൽ സംരക്ഷിക്കണം; 2 രാജാക്കന്മാർ 1:8-ലെ പശ്ചാത്തലം പ്രധാനമാണെങ്കിലും അത് വാചകത്തിൽ വ്യാഖ്യാനമായി ഇറക്കുമതി ചെയ്യരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. ‘ലോമം’, ‘കടിപ്രദേശം’ തുടങ്ങിയ അമിത ഔപചാരിക പദങ്ങൾ ഒഴിവാക്കി; യോഹന്നാനെ സൂചിപ്പിക്കാൻ മാന്യരൂപമായ ‘അദ്ദേഹം’ ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും ബന്ധപ്പെട്ട വസ്ത്രവിവരണത്തിന് പിന്നാലെ പ്രധാനവാചകത്തിൽ നൽകിയിരിക്കുന്നു.
