lexical_decisions:
- source_word: Ἐν δὲ ταῖς ἡμέραις ἐκείναις
  choice: ആ നാളുകളിൽ
  rationale: ἐν കൂടിയ ദത്തിവ് കാലസൂചനയായ ‘ആ നാളുകളിൽ’ എന്ന അർഥം നൽകുന്നു. δέ ഇവിടെ നേരിയ ആഖ്യാനബന്ധകമാണ്; മലയാളത്തിൽ വേറൊരു വിരുദ്ധാർഥബന്ധകം ചേർക്കാതെ സ്വാഭാവികമായ ആഖ്യാനമാറ്റത്തിലൂടെ അതിന്റെ പ്രവർത്തനം നിലനിർത്തുന്നു.
- source_word: παραγίνεται
  choice: വന്നു
  rationale: ആഖ്യാനത്തിലെ ചരിത്രവർത്തമാനകാലത്തെ സ്വാഭാവികമായ മലയാള ഭൂതകാലത്തിൽ അവതരിപ്പിക്കുന്നു. ‘പ്രത്യക്ഷപ്പെട്ടു’ എന്നതും സാധുവാണെങ്കിലും, അതിൽ അനാവശ്യമായി പെട്ടെന്നുള്ളതോ അത്ഭുതകരമായതോ ആയ പ്രത്യക്ഷതയുടെ സൂചന ഉണ്ടാകാം.
- source_word: Ἰωάννης
  choice: യോഹന്നാൻ
  rationale: മലയാളത്തിലെ സ്ഥാപിതവും വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്നതുമായ പേരുരൂപം.
- source_word: ὁ βαπτιστὴς
  choice: സ്നാപകയോഹന്നാൻ
  rationale: യോഹന്നാനെ തിരിച്ചറിയിക്കുന്ന ഉപാധിയായി മലയാളത്തിൽ സ്വാഭാവികവും സ്ഥാപിതവുമായ രൂപം; ക്രിയാത്മക അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: κηρύσσων
  choice: പ്രഘോഷിച്ചുകൊണ്ട്
  rationale: പ്രധാനക്രിയയോടൊപ്പം നടക്കുന്ന പൊതുഘോഷണത്തെ സൂചിപ്പിക്കുന്ന വർത്തമാന കൃദന്തരൂപത്തിന്റെ ഭാവം നിലനിർത്തുന്നു.
- source_word: ἐν τῇ ἐρήμῳ
  choice: വിജനപ്രദേശത്ത്
  rationale: ἔρημος ജനവാസമില്ലാത്തതോ ഒറ്റപ്പെട്ടതോ ആയ പ്രദേശത്തെ സൂചിപ്പിക്കുന്നു; മണൽമരുഭൂമി എന്ന അതിസൂക്ഷ്മമായ ആധുനിക ധാരണ ഒഴിവാക്കുന്നു.
- source_word: τῆς Ἰουδαίας
  choice: യെഹൂദ്യയിലെ
  rationale: ഗോത്രനാമമായ യെഹൂദയെയല്ല, അന്നത്തെ ഭൂമിശാസ്ത്രപ്രദേശമായ യെഹൂദ്യയെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: യോഹന്നാന്റെ βαπτιστής എന്ന ഉപാധി
  choice: സ്നാപകയോഹന്നാൻ
  alternative: സ്നാനം കഴിപ്പിക്കുന്ന യോഹന്നാൻ
  rationale: ഇത് സിദ്ധാന്തപരമായ നിർവചനമല്ല, തിരിച്ചറിയിക്കുന്ന ഉപാധിയാണ്. സ്ഥാപിതമായ മലയാളരൂപം മുഖ്യവാചകത്തിൽ നിലനിർത്തുകയും ഗ്രീക്കിലെ ക്രിയാത്മക അർഥം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
- issue: παραγίνεται എന്ന ചരിത്രവർത്തമാനകാലം
  choice: വന്നു
  alternative: വരുന്നു / പ്രത്യക്ഷപ്പെട്ടു
  rationale: മലയാള ആഖ്യാനത്തിൽ ഭൂതകാലം സ്വാഭാവികമാണ്. ഗ്രീക്കിലെ വർത്തമാനരൂപത്തെക്കുറിച്ചും മറ്റൊരു സാധുവായ അർഥത്തെക്കുറിച്ചും അടിക്കുറിപ്പ് വായനക്കാരനെ അറിയിക്കുന്നു; സംഭവത്തിന്റെ സ്വഭാവത്തെ ദൈവശാസ്ത്രപരമായി വികസിപ്പിക്കുന്നില്ല.
