  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘വിജനപ്രദേശം’ മൂലപദത്തിന്റെ ഭൂമിശാസ്ത്രപരമായ വിശാലത കാത്തുസൂക്ഷിക്കുന്നു; ‘പ്രഘോഷിക്കുക’ κηρύσσω എന്ന പൊതുഘോഷണക്രിയയുടെ ഭാവം നൽകുന്നു.
