id: MAT.3.15
reference: Matthew 3:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν ⸂πρὸς αὐτόν⸃· Ἄφες ἄρτι, οὕτως γὰρ πρέπον ἐστὶν ἡμῖν πληρῶσαι πᾶσαν δικαιοσύνην. τότε ἀφίησιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/015.yaml
  text: But Jesus answered him[a], “Permit it for now, for in this way it is fitting for us to fulfill all righteousness.” Then he permitted him.
translation:
  language: ml
  text: 'എന്നാൽ യേശു അവനോടു മറുപടി പറഞ്ഞു: “ഇപ്പോൾ ഇതിന് സമ്മതിക്കുക; ഇങ്ങനെ സകല നീതിയും[a] നിറവേറ്റുന്നതാണ് നമുക്ക് ഉചിതം.” അപ്പോൾ യോഹന്നാൻ അതിന് സമ്മതിച്ചു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നീതി’ എന്നതിനു ഉപയോഗിച്ച ഗ്രീക്ക് പദം ‘നീതിനിഷ്ഠ’ എന്നും ‘ന്യായം’ എന്നും അർഥമാക്കാം. ഇവിടെ ദൈവഹിതത്തിന് അനുസൃതമായതു ചെയ്യുക എന്ന അർഥമാണ് സന്ദർഭത്തിന് ഏറ്റവും യോജിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν πρὸς αὐτόν
  choice: എന്നാൽ യേശു അവനോടു മറുപടി പറഞ്ഞു
  rationale: ἀποκριθεὶς ... εἶπεν എന്ന ഇരട്ടപ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘മറുപടി പറഞ്ഞു’ എന്നു ചുരുക്കി; δέ മുൻവാക്യത്തിലെ യോഹന്നാന്റെ എതിർപ്പിനോടുള്ള വൈരുധ്യം സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ എന്നു നൽകി.
- source_word: Ἄφες ἄρτι
  choice: ഇപ്പോൾ ഇതിന് സമ്മതിക്കുക
  rationale: ഇവിടെ ἀφίημι എന്നത് ‘ക്ഷമിക്കുക’ എന്നല്ല, യോഹന്നാൻ സ്നാനം നടത്താൻ സമ്മതിക്കുക എന്ന അർഥത്തിലാണ്. ἄρτιയുടെ ഉടൻ നിലവിലുള്ള കാലസൂചന ‘ഇപ്പോൾ’ നിലനിർത്തുന്നു.
- source_word: οὕτως γὰρ
  choice: ഇങ്ങനെ
  rationale: യോഹന്നാൻ യേശുവിന് സ്നാനം നൽകുന്ന, തൊട്ടുമുമ്പ് പറഞ്ഞ രീതിയിലേക്കാണ് οὕτως വിരൽചൂണ്ടുന്നത്. കാരണം വ്യക്തമാക്കുന്ന വാക്യഘടന മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തി.
- source_word: πρέπον ἐστὶν ἡμῖν
  choice: നമുക്ക് ഉചിതം
  rationale: πρέπον സൂചിപ്പിക്കുന്ന യോജ്യതയും ധാർമിക ഔചിത്യവും ‘ഉചിതം’ വ്യക്തമായി നൽകുന്നു.
- source_word: πληρῶσαι
  choice: നിറവേറ്റുക
  rationale: മത്തായിയിൽ ദൈവിക ഉദ്ദേശ്യവുമായി ബന്ധപ്പെട്ട πληρόωയുടെ ‘fulfill’ എന്ന പ്രതിധ്വനി നിലനിർത്താൻ ‘നിറവേറ്റുക’ തിരഞ്ഞെടുത്തു.
- source_word: πᾶσαν δικαιοσύνην
  choice: സകല നീതിയും
  rationale: പ്രയോഗത്തിന്റെ വ്യാപ്തി നിയമാനുഷ്ഠാനത്തിലേക്ക് മാത്രം ചുരുക്കാതെ ഗ്രീക്കിലെ സമഗ്രത നിലനിർത്തുന്നു. δικαιοσύνηയുടെ നീതി/നീതിനിഷ്ഠ എന്ന അർഥവ്യാപ്തിയും ദൈവഹിതത്തോടുള്ള അനുരൂപതയും അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: τότε ἀφίησιν αὐτόν
  choice: അപ്പോൾ യോഹന്നാൻ അതിന് സമ്മതിച്ചു
  rationale: ചരിത്രവർത്തമാനത്തെ മലയാള ആഖ്യാനത്തിന് സ്വാഭാവികമായ ഭൂതകാലത്തിൽ നൽകി. കർത്താവിനെയും സൂചിതമായ പ്രവൃത്തിയെയും വ്യക്തമാക്കാൻ ‘യോഹന്നാൻ’, ‘അതിന്’ എന്നു ഉപയോഗിച്ചു; അർഥം യേശുവിനെ വിട്ടുപോയി എന്നല്ല, സ്നാനം നൽകാൻ വഴങ്ങിയെന്നതാണ്.
theological_decisions:
- issue: ‘സകല നീതിയും’ എന്നതിന്റെ അർഥം
  choice: ഈ സന്ദർഭത്തിൽ ദൈവത്തിന്റെ നീതിയുള്ള ഹിതത്തിന് യോജിച്ചതെല്ലാം നിറവേറ്റുക എന്ന വിശാലമായ അർഥം; പ്രത്യേകിച്ച് യേശു യോഹന്നാനിൽനിന്ന് സ്നാനം സ്വീകരിക്കുന്നത്.
  alternative: എല്ലാ നിയമവ്യവസ്ഥകളും നിറവേറ്റുക എന്ന പരിമിത അർഥം; അല്ലെങ്കിൽ ‘സകല ന്യായവും’ എന്ന വിവർത്തനം.
  rationale: വാക്യം പറയുന്നതിലപ്പുറം ഒരു പ്രത്യേക സിദ്ധാന്തവ്യവസ്ഥ ചേർക്കാതെയും അർഥം വെറും നിയമപാലനമായി ചുരുക്കാതെയും മത്തായിയുടെ δικαιοσύνη പ്രയോഗത്തിലെ ദൈവഹിതാനുസരണത്തിന്റെ വ്യാപ്തി നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. പരമ്പരാഗതമായെങ്കിലും ഇന്നത്തെ സാധാരണ വായനക്കാർക്ക് ദുഷ്കരമായ ‘നിവർത്തിക്കുക’, ‘അനുവദിച്ചാലും’ തുടങ്ങിയ രൂപങ്ങൾ ഒഴിവാക്കി. ഗ്രീക്കിലെ ആവർത്തിച്ച ἀφίημι മലയാളത്തിൽ ഒരേ പദമായി ആവർത്തിച്ചാൽ ഉണ്ടാകുന്ന കൃത്രിമത ഒഴിവാക്കി, ഇരിടത്തും ‘സമ്മതിക്കുക/സമ്മതിച്ചു’ എന്ന അർഥബന്ധം നിലനിർത്തി.
