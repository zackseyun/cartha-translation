id: MAT.3.6
reference: Matthew 3:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐβαπτίζοντο ἐν τῷ Ἰορδάνῃ ⸀ποταμῷ ὑπ’ αὐτοῦ ἐξομολογούμενοι τὰς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/006.yaml
  text: and they were being baptized by him in the Jordan River[a], confessing their sins.
translation:
  language: ml
  text: അവർ തങ്ങളുടെ പാപങ്ങൾ ഏറ്റുപറഞ്ഞുകൊണ്ട് യോർദ്ദാൻ നദിയിൽ അവനാൽ സ്നാനം ഏൽക്കുകയായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “സ്നാനം ഏറ്റു”; ഗ്രീക്കിലെ അപൂർണഭൂതകാലരൂപം തുടരുന്നതോ ആവർത്തിക്കുന്നതോ ആയ പ്രവൃത്തിക്ക് ഊന്നൽ നൽകാം: “സ്നാനം ഏൽക്കുകയായിരുന്നു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβαπτίζοντο
  choice: സ്നാനം ഏൽക്കുകയായിരുന്നു
  rationale: അപൂർണഭൂതകാല കർമണിപ്രയോഗം കഥയിൽ തുടരുന്നതോ ആവർത്തിക്കുന്നതോ ആയ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. സ്ഥാപിതമായ ആചാരപദം നിലനിർത്തുകയും സ്നാനരീതി അനാവശ്യമായി നിർവചിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐν τῷ Ἰορδάνῃ ποταμῷ
  choice: യോർദ്ദാൻ നദിയിൽ
  rationale: ἐν സഹിതമുള്ള ചതുർത്ഥീവിഭക്തി സ്ഥലം സൂചിപ്പിക്കുന്നു; ποταμῷ എന്ന നാമം യോർദ്ദാൻ ഒരു നദിയാണെന്ന് വ്യക്തമായി പറയുന്നു.
- source_word: ὑπ’ αὐτοῦ
  choice: അവനാൽ
  rationale: ὑπό സഹിതമുള്ള ഷഷ്ഠീവിഭക്തി പ്രവർത്തകനെ സൂചിപ്പിക്കുന്നു. സർവനാമം സന്ദർഭത്തിൽ യോഹന്നാനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും മൂലപാഠത്തിലെ സർവനാമരൂപം നിലനിർത്തുന്നു.
- source_word: ἐξομολογούμενοι
  choice: ഏറ്റുപറഞ്ഞുകൊണ്ട്
  rationale: പ്രധാനക്രിയയോടൊപ്പം നടക്കുന്ന പ്രവൃത്തിയായി, തെറ്റുകൾ തുറന്നു സമ്മതിക്കുന്നതിനെ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: തങ്ങളുടെ പാപങ്ങൾ
  rationale: പ്രതിപാദ്യരിലേക്കുതന്നെ തിരിച്ചുചൂണ്ടുന്ന ഉടമസ്ഥത മലയാളത്തിൽ ‘തങ്ങളുടെ’ എന്ന് സ്വാഭാവികമായി വരുന്നു; ‘പാപങ്ങൾ’ എന്ന ബഹുവചനം നിലനിർത്തുന്നു.
- source_word: καὶ
  choice: അവർ
  rationale: മലയാളത്തിലെ സ്വാഭാവിക വാക്യപ്രവാഹത്തിനായി ലളിതമായ ഗ്രീക്ക് ബന്ധകത്തെ വേറെ ‘ഉം/കൂടാതെ’ എന്നായി പ്രകടമാക്കാതെ മുൻസന്ദർഭവുമായി തുടർച്ച നിലനിർത്തുന്നു.
theological_decisions:
- issue: സ്നാനപദത്തിന്റെ സ്വഭാവം
  choice: സ്നാനം ഏൽക്കുക
  alternative: മുക്കുക / കഴുകുക
  rationale: വാക്യം സ്നാനത്തിന്റെ രീതി നിർവചിക്കുന്നില്ല. സ്ഥാപിതമായ ‘സ്നാനം’ എന്ന പദം ഉപയോഗിക്കുന്നത് ഗ്രീക്ക് ആചാരപദത്തിന്റെ വിസ്തൃതി കാത്തുസൂക്ഷിക്കുകയും പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ നിഗമനം അടിച്ചേൽപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. ‘സ്നാനം ഏൽക്കുക’ എന്ന സ്ഥാപിത പ്രയോഗം ഉപയോഗിച്ചു; തുടർച്ചാസൂചനയ്ക്കായി ‘ഏൽക്കുകയായിരുന്നു’ തെരഞ്ഞെടുത്തു.
