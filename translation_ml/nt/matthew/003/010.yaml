id: MAT.3.10
reference: Matthew 3:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἤδη ⸀δὲ ἡ ἀξίνη πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται· πᾶν οὖν δένδρον μὴ ποιοῦν καρπὸν καλὸν ἐκκόπτεται καὶ εἰς πῦρ βάλλεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/010.yaml
  text: And already the axe is laid at the root of the trees[a]. Therefore every tree not producing good fruit is cut down and thrown into the fire.
translation:
  language: ml
  text: കോടാലി ഇതിനകം മരങ്ങളുടെ വേരിനരികിൽ വെച്ചിരിക്കുന്നു[a]. അതുകൊണ്ട്, നല്ല ഫലം കായ്ക്കാത്ത ഓരോ മരവും വെട്ടിവീഴ്ത്തപ്പെടുകയും തീയിൽ എറിയപ്പെടുകയും ചെയ്യുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മരങ്ങളുടെ വേരിനരികിൽ കിടക്കുന്നു.”
    reason: κεῖται എന്ന പദത്തിന് ‘വെച്ചിരിക്കുന്നു’ എന്നും ‘കിടക്കുന്നു’ എന്നും വിവർത്തനം സാധ്യമാണ്.
lexical_decisions:
- source_word: ἤδη δὲ
  choice: ഇപ്പോഴേ
  rationale: വിധി ആസന്നമാണെന്ന കാലസൂചന വ്യക്തമാക്കുന്നു. δέ ഇവിടെ നേരിയ ബന്ധകമായതിനാൽ മലയാളത്തിൽ പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്താതെ സ്വാഭാവികമായ വാക്യപ്രവാഹത്തിൽ ഉൾക്കൊള്ളിച്ചു.
- source_word: ἀξίνη
  choice: കോടാലി
  rationale: മരം വെട്ടാനുള്ള ഉപകരണത്തെ സൂചിപ്പിക്കുന്ന സാധാരണവും വ്യക്തവുമായ മലയാളപദം.
- source_word: πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται
  choice: മരങ്ങളുടെ വേരിനരികിൽ വെച്ചിരിക്കുന്നു
  rationale: കോടാലി ഉപയോഗിക്കാൻ സജ്ജമായി വേരിനരികിൽ സ്ഥാപിച്ചിരിക്കുന്ന ദൃശ്യം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; κεῖται എന്നതിലെ ‘കിടക്കുന്നു/വെച്ചിരിക്കുന്നു’ എന്ന അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: πᾶν οὖν δένδρον
  choice: അതുകൊണ്ട് … ഓരോ മരവും
  rationale: οὖν സൂചിപ്പിക്കുന്ന നിഗമനബന്ധവും πᾶν എന്നതിന്റെ സമഗ്രവ്യാപ്തിയും വ്യക്തമായി നൽകുന്നു.
- source_word: μὴ ποιοῦν καρπὸν καλὸν
  choice: നല്ല ഫലം കായ്ക്കാത്ത
  rationale: മരത്തെക്കുറിച്ചുള്ള മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗമായ ‘ഫലം കായ്ക്കുക’ ഉപയോഗിച്ച് തുടർച്ചയായ സ്വഭാവത്തെ സൂചിപ്പിക്കുന്ന വിശേഷണഘടന നിലനിർത്തുന്നു.
- source_word: ἐκκόπτεται
  choice: വെട്ടിവീഴ്ത്തി
  rationale: മരത്തിന്റെ രൂപകത്തിൽ ‘വെട്ടിവീഴ്ത്തുക’ എന്നത് ἐκκόπτωയുടെ സന്ദർഭോചിതവും വ്യക്തവുമായ തുല്യപ്രയോഗമാണ്.
- source_word: εἰς πῦρ βάλλεται
  choice: തീയിൽ എറിയപ്പെടുന്നു
  rationale: മൂലത്തിലെ വർത്തമാനകാല കർമണിപ്രയോഗവും വിധിയുടെ ശക്തമായ ദൃശ്യവും നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: തീയുടെ രൂപകം സൂചിപ്പിക്കുന്ന വിധിയുടെ കൃത്യസ്വഭാവം
  choice: ‘തീ’ എന്നു മാത്രം നിലനിർത്തി
  alternative: അന്ത്യവിധി, താൽക്കാലിക വിധി, നരകാഗ്നി
  rationale: വാക്യം വിധിയുടെ ദൃശ്യം വ്യക്തമാക്കുന്നുവെങ്കിലും തീയുടെ കൃത്യമായ ദൈവശാസ്ത്രപരമായ സൂചന വിശദീകരിക്കുന്നില്ല. അതിനാൽ രൂപകത്തെ വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ അതേപടി നിലനിർത്തുന്നു.
- issue: വർത്തമാനകാല കർമണിരൂപങ്ങളുടെ കാലബോധം
  choice: ‘വെട്ടിവീഴ്ത്തി … എറിയപ്പെടുന്നു’
  alternative: ‘വെട്ടിവീഴ്ത്തി … എറിയപ്പെടും’
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാല രൂപങ്ങൾ വിധിയുടെ ഉറപ്പും സജീവമായ ആസന്നതയും പ്രകടിപ്പിക്കുന്നു; ഭാവികാലമാക്കി വ്യാഖ്യാനപരമായി പരിമിതപ്പെടുത്താതെ രൂപം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം ഗൗരവമുള്ളതുമായ ശൈലി. ‘വേരിനരികിൽ വെച്ചിരിക്കുന്നു’ എന്നത് രൂപകത്തിന്റെ അടിയന്തരത സ്വാഭാവികമായി പകർന്നു നൽകുന്നു.
