reference: Matthew 3:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Ἰωάννης διεκώλυεν αὐτὸν λέγων· Ἐγὼ χρείαν ἔχω ὑπὸ σοῦ βαπτισθῆναι, καὶ σὺ ἔρχῃ πρός με;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/014.yaml
  text: But John kept trying to prevent him[a], saying, “I need to be baptized by you, and do you come to me?”
translation:
  language: ml
  text: 'എന്നാൽ യോഹന്നാൻ അവനെ തടയാൻ ശ്രമിച്ചുകൊണ്ടിരുന്നു[a]; അവൻ പറഞ്ഞു: “എനിക്ക് നിന്നാൽ സ്നാനം ഏൽക്കേണ്ടതുണ്ട്; നീയോ എന്റെയടുത്തേക്കു വരുന്നത്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവനെ തടയാൻ ശ്രമിച്ചു.” ഗ്രീക്കിലെ അപൂർണ്ണഭൂതകാല ക്രിയ തുടരുന്നതോ ആവർത്തിക്കുന്നതോ ആയ ശ്രമത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: διεκώλυεν
  choice: തടയാൻ തുടർച്ചയായി ശ്രമിച്ചുകൊണ്ട്
  rationale: അപൂർണ്ണഭൂതകാല ക്രിയയുടെ തുടരുന്നോ ആവർത്തിക്കുന്നോ ആയ പ്രവർത്തനഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു; യോഹന്നാൻ യേശുവിനെ വിജയകരമായി തടഞ്ഞുവെന്ന് സൂചിപ്പിക്കുന്നില്ല.
- source_word: λέγων
  choice: പറഞ്ഞു
  rationale: യോഹന്നാന്റെ എതിർപ്പും അതിനുള്ള വാക്കുകളായ വിശദീകരണവും സ്വാഭാവിക മലയാള വാക്യഘടനയിൽ ബന്ധിപ്പിക്കുന്നു.
- source_word: χρείαν ἔχω
  choice: ഞാനല്ലേ ... ഏൽക്കേണ്ടത്
  rationale: ‘എനിക്ക് ആവശ്യമുണ്ട്’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തെ സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളമായി നൽകുന്നു; ചോദ്യത്തിന്റെ ഊന്നലും നിലനിർത്തുന്നു.
- source_word: ὑπὸ σοῦ
  choice: നിന്നാൽ
  rationale: കർമണിപ്രയോഗമായ βαπτισθῆναι-യോടൊപ്പം വ്യക്തിപരമായ കർത്തൃത്വം സൂചിപ്പിക്കുന്ന ὑπό + genitive കൃത്യമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: βαπτισθῆναι
  choice: സ്നാനം ഏൽക്കേണ്ടത്
  rationale: കർമണി അർഥം നിലനിർത്തുന്ന, മലയാള ക്രൈസ്തവ ഉപയോഗത്തിൽ പരിചിതവും രീതിയെ അനാവശ്യമായി നിർണ്ണയിക്കാത്തതുമായ പ്രയോഗം.
- source_word: καὶ σὺ ἔρχῃ πρός με;
  choice: എന്നിട്ടും നീ എന്റെയടുത്തേക്കു വരുന്നുവോ?
  rationale: καί ഇവിടെ സന്ദർഭത്തിൽ നൽകുന്ന വൈരുധ്യവും വർത്തമാനകാല ചോദ്യത്തിന്റെ ശക്തിയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിൽ യേശു യോഹന്നാന്റെ അടുക്കൽ വന്നതുമായി ഉള്ള മൃദുവായ വൈരുധ്യം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: യേശുവിനെ സ്നാനപ്പെടുത്തുന്നതിനെക്കുറിച്ചുള്ള യോഹന്നാന്റെ എതിർപ്പ്
  choice: യോഹന്നാനു യേശുവിൽനിന്ന് സ്നാനം ഏൽക്കേണ്ട ആവശ്യമുണ്ടെന്നും യേശു തന്റെ അടുക്കൽ വരുന്നതിൽ അവൻ വിസ്മയം പ്രകടിപ്പിക്കുന്നുവെന്നും നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: ഈ വാക്കുകൾ പ്രധാനമായും യേശുവിന്റെ പാപരാഹിത്യത്തെക്കുറിച്ചോ പദവി-അധികാരക്രമത്തെക്കുറിച്ചോ ആണെന്ന് പരിഭാഷയിൽ തന്നെ വിശദീകരിക്കുക.
  rationale: വാക്യം യേശുവിന്റെ ശ്രേഷ്ഠതയും യോഹന്നാന്റെ സ്വന്തം ആവശ്യബോധവും പ്രകടിപ്പിക്കുന്നുവെങ്കിലും അതിന്റെ സമ്പൂർണ ദൈവശാസ്ത്ര കാരണം വ്യക്തമാക്കുന്നില്ല; അതിനാൽ ആ സംഘർഷം പരിഭാഷയിൽ തുറന്ന നിലയിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘സ്നാനം ഏൽക്കുക’ എന്നത് കർമണി അർഥം വ്യക്തമായി നിലനിർത്തുന്നു. ‘എന്നിട്ടും’ ഗ്രീക്കിലെ καί സന്ദർഭത്തിൽ വഹിക്കുന്ന വൈരുധ്യം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; വാക്യം ആവശ്യപ്പെടാത്ത പ്രത്യേക സ്നാനരീതിയോ ദൈവശാസ്ത്ര വിശദീകരണമോ ചേർത്തിട്ടില്ല.
