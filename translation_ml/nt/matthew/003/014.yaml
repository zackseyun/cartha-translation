  to: 'എന്നാൽ യോഹന്നാൻ അവനെ തടയാൻ ശ്രമിച്ചുകൊണ്ടിരുന്നു[a]; അവൻ പറഞ്ഞു: “എനിക്ക് നിന്നാൽ സ്നാനം ഏൽക്കേണ്ടതുണ്ട്; നീയോ എന്റെയടുത്തേക്കു വരുന്നത്?”'
