id: MAT.3.5
reference: Matthew 3:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τότε ἐξεπορεύετο πρὸς αὐτὸν Ἱεροσόλυμα καὶ πᾶσα ἡ Ἰουδαία καὶ πᾶσα ἡ περίχωρος τοῦ Ἰορδάνου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/005.yaml
  text: Then Jerusalem[a], all Judea, and all the region around the Jordan were going out to him[c][b],
translation:
  language: ml
  text: അപ്പോൾ യെരൂശലേമിൽനിന്നും യെഹൂദ്യ മുഴുവനിൽനിന്നും യോർദ്ദാനു ചുറ്റുമുള്ള പ്രദേശം മുഴുവനിൽനിന്നും ആളുകൾ അവന്റെ അടുക്കലേക്കു പുറപ്പെട്ടുകൊണ്ടിരുന്നു[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവന്റെ അടുക്കലേക്കു വന്നുകൊണ്ടിരുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് അപൂർണഭൂതകാലരൂപം തുടർച്ചയായതോ ആവർത്തിച്ചുള്ളതോ ആയ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘യെഹൂദ്യ മുഴുവനിൽനിന്നും’ എന്നും ‘യോർദ്ദാനു ചുറ്റുമുള്ള പ്രദേശം മുഴുവനിൽനിന്നും’ എന്നും ഉള്ള പ്രയോഗങ്ങൾ യോഹന്നാനോടുള്ള വ്യാപകമായ പ്രതികരണത്തെ വിവരിക്കുന്ന ഭൂമിശാസ്ത്രപരമായ സമഗ്രപ്രയോഗങ്ങളാണ്; അവിടങ്ങളിലെ ഓരോ വ്യക്തിയും വന്നു എന്ന് അവ നിർബന്ധമായും അർഥമാക്കുന്നില്ല.
    reason: cultural_note
lexical_decisions:
- source_word: τότε
  choice: അപ്പോൾ
  rationale: മുൻസന്ദർഭത്തിലെ യോഹന്നാന്റെ ശുശ്രൂഷയോടു ജനങ്ങളുടെ പ്രതികരണത്തെ ബന്ധിപ്പിക്കുന്ന സ്വാഭാവികമായ കാലസൂചകം.
- source_word: ἐξεπορεύετο
  choice: വന്നുകൊണ്ടിരുന്നു
  rationale: ഗ്രീക്ക് അപൂർണഭൂതകാലരൂപം സൂചിപ്പിക്കുന്ന തുടർച്ചയായതോ ആവർത്തിച്ചുള്ളതോ ആയ പ്രവൃത്തിയെ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; πρὸς αὐτόν ചേർന്നതിനാൽ ലക്ഷ്യസ്ഥാനത്തിന്റെ കാഴ്ചപ്പാടിൽ ‘വന്നു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: πρὸς αὐτόν
  choice: അവന്റെ അടുക്കലേക്കു
  rationale: ഒരു വ്യക്തിയിലേക്കുള്ള സഞ്ചാരദിശ വ്യക്തമാക്കുകയും മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗമാകുകയും ചെയ്യുന്നു.
- source_word: Ἱεροσόλυμα
  choice: യെരൂശലേമിൽനിന്നും
  rationale: സ്ഥലനാമത്തിന്റെ പ്രചാരത്തിലുള്ള മലയാളരൂപം; ‘പുറപ്പെട്ടു’ എന്ന ആശയം മലയാളത്തിൽ ഉറവിടസൂചകമായ ‘നിന്നും’ മുഖേന വ്യക്തമാക്കുന്നു.
- source_word: πᾶσα ἡ Ἰουδαία
  choice: യെഹൂദ്യയിൽ എല്ലായിടത്തുനിന്നും
  rationale: പ്രദേശമൊട്ടാകെയുള്ള വ്യാപക പ്രതികരണം സ്വാഭാവികമായി അറിയിക്കുന്നു; ഓരോ വ്യക്തിയും എന്ന ഗണിതപരമായ അർഥം അനാവശ്യമായി ചുമത്തുന്നില്ല.
- source_word: πᾶσα ἡ περίχωρος τοῦ Ἰορδάνου
  choice: യോർദ്ദാന്റെ ചുറ്റുമുള്ള പ്രദേശങ്ങളിൽനിന്നുമുള്ള ആളുകൾ
  rationale: യോർദ്ദാൻ നദിയെ ചുറ്റിയുള്ള മുഴുവൻ പ്രദേശത്തെയും സൂചിപ്പിക്കുന്ന ഭൂമിശാസ്ത്രപരമായ പ്രയോഗം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: καὶ ... καὶ
  choice: '...നിന്നും ...നിന്നും'
  rationale: മലയാളത്തിലെ സമാന്തരമായ പട്ടികഘടനയിലൂടെ മൂന്നു ഭൂമിശാസ്ത്രഘടകങ്ങളുടെ സഞ്ചിതബന്ധം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഭൂമിശാസ്ത്രപരമായ സമഗ്രപദങ്ങളുടെ വ്യാപ്തി
  choice: വിവിധ പ്രദേശങ്ങളിലുടനീളമുള്ള വ്യാപക ജനപ്രതികരണമായി പരിഭാഷപ്പെടുത്തുക
  alternative: ‘യെരൂശലേമും യെഹൂദ്യ മുഴുവനും യോർദ്ദാന്റെ ചുറ്റുമുള്ള പ്രദേശം മുഴുവനും’ എന്നു സ്ഥലങ്ങളെ തന്നെ ക്രിയയുടെ കർത്താക്കളാക്കി അക്ഷരാർഥത്തിൽ നൽകുക
  rationale: മൂലപാഠത്തിലെ സ്ഥലനാമങ്ങൾ അവിടങ്ങളിലെ ജനങ്ങളെ സൂചിപ്പിക്കുന്ന മേതോനിമിയാണ്. ‘ആളുകൾ’ എന്നു വ്യക്തമാക്കുന്നത് മലയാളത്തിൽ അർഥം സ്വാഭാവികമാക്കുന്നു; എന്നാൽ ഓരോ നിവാസിയും വന്നു എന്ന അവകാശവാദം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന മാന്യമായ ശൈലി. മൂലത്തിലെ ഏകവചന ക്രിയയോടുകൂടിയ സ്ഥലനാമ-മേതോനിമി മലയാളത്തിൽ അസ്വാഭാവികമാകാതിരിക്കാൻ ‘ആളുകൾ’ വ്യക്തമാക്കി; അപൂർണഭൂതകാലത്തിന്റെ തുടർച്ചാഭാവം ‘വന്നുകൊണ്ടിരുന്നു’ എന്നതിൽ നിലനിർത്തി.
