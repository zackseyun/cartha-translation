id: MAT.1.19
reference: Matthew 1:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἰωσὴφ δὲ ὁ ἀνὴρ αὐτῆς, δίκαιος ὢν καὶ μὴ θέλων αὐτὴν ⸀δειγματίσαι, ἐβουλήθη λάθρᾳ ἀπολῦσαι αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/019.yaml
  text: And Joseph[a], her husband, being a righteous man and not wanting to expose her to public disgrace[c][b], intended to divorce her quietly.
translation:
  language: ml
  text: അവളുടെ ഭർത്താവായ യോസേഫ്[a] നീതിമാനായിരുന്നതിനാലും അവളെ പരസ്യമായി അപമാനിക്കാൻ[b] ആഗ്രഹിക്കാതിരുന്നതിനാലും, അവളെ സ്വകാര്യമായി വിവാഹമോചനം ചെയ്യാൻ[c] തീരുമാനിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവളുമായി വിവാഹനിശ്ചയം കഴിഞ്ഞിരുന്ന യോസേഫ്.’ ഗ്രീക്കിൽ ‘അവളുടെ പുരുഷൻ/ഭർത്താവ്’ എന്നാണ്; നിയമപരമായി ബാധകമായിരുന്ന യഹൂദ വിവാഹനിശ്ചയത്തെയാണ് ഇത് പ്രതിഫലിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവളെ മറ്റുള്ളവരുടെ മുമ്പിൽ നാണംകെടുത്താൻ’ അല്ലെങ്കിൽ ‘അവളെ ഒരു ഉദാഹരണമാക്കാൻ.’
    reason: lexical_alternative
  - marker: c
    text: ‘അവളെ സ്വകാര്യമായി അയച്ചുകളയാൻ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഈ സന്ദർഭത്തിൽ, വിവാഹനിശ്ചയകാലത്തെ ബന്ധം ഔപചാരികമായി അവസാനിപ്പ Jennings is not needed.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ αὐτῆς
  choice: അവളുടെ ഭർത്താവ്
  rationale: നിയമപരമായി ബാധകമായിരുന്ന യഹൂദ വിവാഹനിശ്ചയത്തിന്റെ പശ്ചാത്തലത്തിലും ἀπολῦσαι എന്ന തുടർന്നുവരുന്ന പദത്തിന്റെ നിയമപരമായ അർഥത്തിലും ‘ഭർത്താവ്’ സ്വാഭാവികവും കൃത്യവുമാണ്; ബന്ധത്തിന്റെ ഘട്ടം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: δίκαιος
  choice: നീതിമാൻ
  rationale: ദൈവസന്നിധിയിലെ ധാർമിക സ്വഭാവവും ശരിയായ പെരുമാറ്റവും സൂചിപ്പിക്കുന്ന ബൈബിൾപരമായ അനുരണനം നിലനിർത്തുന്നു; നിയമനിഷ്ഠയോ കരുണയോ മാത്രമായി അർഥം ചുരുക്കുന്നില്ല.
- source_word: δειγματίσαι
  choice: പരസ്യമായി അപമാനിക്കാൻ
  rationale: ഒരാളെ മറ്റുള്ളവരുടെ മുമ്പിൽ തുറന്നുകാട്ടി അപമാനിക്കുന്ന അർഥബലം സന്ദർഭാനുസൃതമായി വ്യക്തമായി നൽകുന്നു.
- source_word: ἐβουλήθη
  choice: തീരുമാനിച്ചു
  rationale: ആലോചിച്ചെടുത്ത ഉദ്ദേശ്യമോ നിശ്ചയമോ സൂചിപ്പിക്കുന്ന βούλομαιയുടെ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: λάθρᾳ
  choice: രഹസ്യമായി
  rationale: മറ്റുള്ളവർ അറിയാത്ത സ്വകാര്യമായ രീതിയെ നേരിട്ട് സൂചിപ്പിക്കുന്നു; പരസ്യമായ അപമാനത്തിന് വിരുദ്ധമായ ആശയം നിലനിർത്തുന്നു.
- source_word: ἀπολῦσαι
  choice: വിവാഹമോചനം ചെയ്യാൻ
  rationale: നിയമപരമായി ബാധകമായ വിവാഹനിശ്ചയം ഔപചാരികമായി അവസാനിപ്പിക്കുന്നതാണ് സന്ദർഭത്തിലെ അർഥം; ‘അയച്ചുകളയുക’ എന്ന പദാനുപദ വിവർത്തനത്തേക്കാൾ നിയമബലം വ്യക്തമാക്കുന്നു.
- source_word: δὲ
  choice: —
  rationale: മൃദുവായ ആഖ്യാനബന്ധകമായ δέ മലയാളത്തിലെ വാക്യപ്രവാഹത്തിൽ പ്രത്യേകം പദമില്ലാതെയും സ്വാഭാവികമായി പ്രതിഫലിക്കുന്നു.
- source_word: ὢν καὶ μὴ θέλων
  choice: നീതിമാനായിരുന്നതിനാലും ... ആഗ്രഹിക്കാതിരുന്നതിനാലും
  rationale: രണ്ടു കൃദന്തരൂപങ്ങളും യോസേഫിന്റെ തീരുമാനത്തിന്റെ പശ്ചാത്തലവും കാരണവും നൽകുന്നു; മലയാളത്തിൽ കാരണാർഥഘടന സ്വാഭാവികമാണ്.
theological_decisions:
- issue: യോസേഫിനെ δίκαιος എന്നു വിശേഷിപ്പിക്കുന്നത്
  choice: ‘നീതിമാൻ’ എന്നു വിവർത്തനം ചെയ്തു; അതിനെ നിയമനിഷ്ഠയെന്നോ കരുണയെന്നോ മാത്രം വിശദീകരിച്ചില്ല.
  alternative: ‘ന്യായവാൻ’ എന്നു നൽകുക, അല്ലെങ്കിൽ കരുണയെ മുൻനിർത്തി വ്യാഖ്യാനപരമായി പരാവർത്തനം ചെയ്യുക.
  rationale: ഗ്രീക്ക് പാഠം യോസേഫിന്റെ നീതിയെയും മറിയത്തെ പരസ്യമായി അപമാനിക്കാനുള്ള അനാഗ്രഹത്തെയും ചേർത്തുവയ്ക്കുന്നു. ധാർമിക നേരും കരുണാപൂർവമായ സംയമനവും തമ്മിലുള്ള പാഠത്തിലെ സംഘർഷവും സമന്വയവും വിവർത്തനം തുറന്നുവയ്ക്കുന്നു.
- issue: യോസേഫിന്റെയും മറിയത്തിന്റെയും നിയമപരമായ ബന്ധം
  choice: മുഖ്യപാഠത്തിൽ ‘ഭർത്താവ്’, ‘വിവാഹമോചനം’ എന്നീ പദങ്ങൾ ഉപയോഗിച്ചു.
  alternative: ‘വിവാഹനിശ്ചയം ചെയ്തവൻ’, ‘വിവാഹനിശ്ചയം റദ്ദാക്കുക’; അല്ലെങ്കിൽ പദാനുപദമായി ‘പുരുഷൻ’, ‘അയച്ചുകളയുക’.
  rationale: ഒന്നാം നൂറ്റാണ്ടിലെ യഹൂദ വിവാഹനിശ്ചയം നിയമപരമായി ബാധകമായ ബന്ധമായിരുന്നു; അത് അവസാനിപ്പിക്കാൻ ഔപചാരികമായ വേർപിരിയൽ ആവശ്യമായിരുന്നു. ആ നിയമബലം ആധുനിക വായനക്കാരന് വ്യക്തമാക്കുകയും ബന്ധത്തിന്റെ ഘട്ടം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. നിയമപരമായ ബന്ധവും പരസ്യ അപമാനത്തിന്റെ ആശയവും സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നതിനൊപ്പം ഗ്രീക്ക് പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം വ്യാഖ്യാനിച്ച് തീർപ്പാക്കാതെ നിലനിർത്തുന്നു.
