id: MAT.1.17
reference: Matthew 1:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Πᾶσαι οὖν αἱ γενεαὶ ἀπὸ Ἀβραὰμ ἕως Δαυὶδ γενεαὶ δεκατέσσαρες, καὶ ἀπὸ Δαυὶδ ἕως τῆς μετοικεσίας Βαβυλῶνος γενεαὶ δεκατέσσαρες, καὶ ἀπὸ τῆς μετοικεσίας Βαβυλῶνος ἕως τοῦ χριστοῦ γενεαὶ δεκατέσσαρες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/017.yaml
  text: So all the generations from Abraham to David were fourteen generations[a], and from David to the exile to Babylon fourteen generations[b], and from the exile to Babylon to the Messiah fourteen generations.
translation:
  language: ml
  text: അതിനാൽ, അബ്രാഹാം മുതൽ ദാവീദ് വരെ ആകെ പതിന്നാലു തലമുറകൾ, ദാവീദ് മുതൽ ബാബിലോനിലേക്കുള്ള പ്രവാസം വരെ പതിന്നാലു തലമുറകൾ, ബാബിലോനിലേക്കുള്ള പ്രവാസം മുതൽ മശീഹാ വരെ[a] പതിന്നാലു തലമുറകൾ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ക്രിസ്തു വരെ.’ ഗ്രീക്കിലെ χριστός എന്ന സ്ഥാനപ്പേരിന്റെ അർഥം ‘അഭിഷിക്തൻ’ എന്നാണ്; ഇവിടെ വംശാവലിയുടെ മശീഹാപരമായ പര്യവസാനം വ്യക്തമാക്കാൻ ‘മശീഹാ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: Πᾶσαι οὖν αἱ γενεαὶ
  choice: അതിനാൽ ... ആകെ ... തലമുറകളും
  rationale: οὖν എന്നതിന്റെ സംഗ്രഹാത്മകമായ നിഗമനഭാവം ‘അതിനാൽ’ നൽകുന്നു; Πᾶσαι αἱ γενεαὶ എന്നതിലെ സമഗ്രത ‘ആകെ’ എന്ന പദത്തിലൂടെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: γενεαὶ
  choice: തലമുറകൾ
  rationale: വംശാവലിയിൽ തുടർച്ചയായ തലമുറകളെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ വ്യക്തവും പതിവുമായ പദം ‘തലമുറകൾ’ ആണ്.
- source_word: ἀπὸ ... ἕως
  choice: '...മുതൽ ...വരെ'
  rationale: വംശാവലിയിലെ രണ്ട് അതിരുകൾക്കിടയിലെ കാലവ്യാപ്തി കൃത്യവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: μετοικεσίας Βαβυλῶνος
  choice: ബാബേലിലേക്കുള്ള പ്രവാസം
  rationale: μετοικεσία നിർബന്ധിത സ്ഥാനമാറ്റത്തെയും പ്രവാസത്തെയും സൂചിപ്പിക്കുന്നു. ‘പ്രവാസം’ ചരിത്രപരവും ദൈവശാസ്ത്രപരവുമായ ഭാരം നിലനിർത്തുന്നു; ‘ബാബേലിലേക്ക്’ ലക്ഷ്യസ്ഥാനം വ്യക്തമാക്കുന്നു.
- source_word: τοῦ χριστοῦ
  choice: മശീഹാ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ χριστός ഇവിടെ വ്യക്തിനാമത്തേക്കാൾ അഭിഷിക്തനായ പ്രതീക്ഷിത രാജാവെന്ന സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നു; അതിനാൽ പരമ്പരാഗത ലിപ്യന്തരണമായ ‘ക്രിസ്തു’വിനേക്കാൾ അർത്ഥസൂചകമായ ‘മശീഹാ’ സ്വീകരിച്ചു.
- source_word: γενεαὶ δεκατέσσαρες
  choice: പതിന്നാലു തലമുറകൾ
  rationale: മൂന്നു വിഭാഗങ്ങളിലും ആവർത്തിക്കുന്ന എണ്ണവും നാമവും നിലനിർത്തി, മൂലപാഠത്തിന്റെ സമതുലിതമായ ഘടന സംരക്ഷിക്കുന്നു.
- source_word: Ἀβραὰμ / Δαυὶδ / Βαβυλῶνος
  choice: അബ്രാഹാം / ദാവീദ് / ബാബേൽ
  rationale: മലയാള ബൈബിൾ ഭാഷയിൽ വ്യാപകമായി പരിചിതമായ നാമരൂപങ്ങൾ ഉപയോഗിച്ചു.
theological_decisions:
- issue: Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: വംശാവലിയുടെ പര്യവസാനത്തിൽ പ്രതീക്ഷിത അഭിഷിക്തനെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരാണ് ഇവിടെ; ‘മശീഹാ’ ആ അർത്ഥം നേരിട്ട് പ്രകടിപ്പിക്കുന്നു. പരിചിതമായ മറ്റൊരു രൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- issue: വംശാവലിയുടെ മൂന്നു പതിന്നാലു-തലമുറ വിഭാഗങ്ങളുടെ പ്രസ്താവന
  choice: ‘ആകെ’ എന്ന സമഗ്രതയും മൂന്നു സമാന്തര ഘടകങ്ങളും നിലനിർത്തി
  alternative: ‘അബ്രാഹാംമുതൽ ദാവീദുവരെ പതിന്നാലു തലമുറകൾ ഉണ്ടായിരുന്നു’ എന്ന ലളിതവത്കരണം
  rationale: Πᾶσαι എന്ന പദത്തിന്റെ സമഗ്രത ഒഴിവാക്കാതെ, മൂലത്തിലെ ആവർത്തനാത്മകവും സമതുലിതവുമായ ഘടന മലയാളത്തിൽ വായനാസൗകര്യത്തോടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ മൂന്നു ഘടകങ്ങളുള്ള ആവർത്തനഘടന നിലനിർത്തിയിട്ടുണ്ട്. ‘ബാബേൽ’ പരിചിതമായ ബൈബിൾ സ്ഥലനാമമായി ഉപയോഗിച്ചു; അത്യന്തം പഴഞ്ചനായ വാക്യക്രമം ഒഴിവാക്കി.
