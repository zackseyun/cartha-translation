source:
  edition: SBLGNT
  text: Ὀζίας δὲ ἐγέννησεν τὸν Ἰωαθάμ, Ἰωαθὰμ δὲ ἐγέννησεν τὸν Ἀχάζ, Ἀχὰζ δὲ ἐγέννησεν τὸν Ἑζεκίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/009.yaml
  text: Uzziah fathered Jotham[a], and Jotham fathered Ahaz, and Ahaz fathered Hezekiah,
translation:
  language: ml
  text: ഉസ്സീയാവു യോഥാമിനെ ജനിപ്പിച്ചു[a]; യോഥാം ആഹാസിനെ ജനിപ്പിച്ചു; ആഹാസ് ഹിസ്കീയാവിനെ ജനിപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ജനിപ്പിച്ചു’ എന്നത് ഗ്രീക്ക് ἐγέννησεν എന്ന പദത്തിന്റെ വംശാവലിയിലെ പ്രയോഗമാണ്; ‘…ന്റെ പിതാവായി’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀζίας
  choice: ഉസ്സീയാവ്
  rationale: ഗ്രീക്ക് നാമരൂപത്തെ പഴയനിയമത്തിൽ പരിചിതമായ എബ്രായ രാജനാമവുമായി ബന്ധിപ്പിക്കുന്ന പ്രചാരത്തിലുള്ള മലയാള ബൈബിൾരൂപം സ്വീകരിച്ചു.
- source_word: δὲ
  choice: വാക്യക്രമവും അർദ്ധവിരാമവും വഴി സൂചിപ്പിച്ചു
  rationale: വംശാവലിയിൽ ഇത് പട്ടിക മുന്നോട്ടുകൊണ്ടുപോകുന്ന മൃദുവായ ബന്ധകമാണ്. ഓരോ തവണയും ‘പിന്നെ’ അല്ലെങ്കിൽ ‘എന്നാൽ’ എന്നു ചേർക്കുന്നത് മലയാളത്തിൽ അനാവശ്യവും തെറ്റായ വിരോധഭാവം സൃഷ്ടിക്കുന്നതുമായിരിക്കും.
- source_word: ἐγέννησεν
  choice: ജനിപ്പിച്ചു
  rationale: വംശാവലിയുടെ പിതൃവംശപരമായ ബന്ധവും ആവർത്തനശൈലിയും ചുരുക്കമായും ഔപചാരികമായും നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: Ἰωαθάμ
  choice: യോഥാം
  rationale: യൂദാരാജാവിന്റെ പഴയനിയമനാമത്തോട് ഒത്തുപോകുന്ന പരിചിതമായ മലയാളരൂപം.
- source_word: Ἀχάζ
  choice: ആഹാസ്
  rationale: ഗ്രീക്ക് രൂപത്തിന്റെ യാന്ത്രിക ലിപ്യന്തരണത്തിന് പകരം പഴയനിയമത്തിലെ രാജാവിനായി മലയാളത്തിൽ പരിചിതമായ നാമരൂപം.
- source_word: Ἑζεκίαν
  choice: ഹിസ്കീയാവ്
  rationale: പഴയനിയമത്തിലെ യൂദാരാജാവിനെ തിരിച്ചറിയാൻ സഹായിക്കുന്ന പരിചിതമായ മലയാളനാമരൂപം.
theological_decisions:
- issue: γεννάω എന്ന പദത്തിന്റെ വംശാവലിപരമായ അർഥവ്യാപ്തി
  choice: പ്രത്യക്ഷമായ പിതൃവംശക്രമമായി ‘ജനിപ്പിച്ചു’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘പിതാവായി’, ‘പൂർവികനായിരുന്നു’
  rationale: മത്തായിയുടെ ആവർത്തിത വംശാവലിസൂത്രത്തിന്റെ പദശക്തിയും സാഹിത്യലയവും നിലനിർത്തുന്നു. ബൈബിൾ വംശാവലികൾ ചിലപ്പോൾ തലമുറകൾ ഒഴിവാക്കാമെങ്കിലും, ഈ വാക്യം പറയുന്നതിനെ ‘പൂർവികനായിരുന്നു’ എന്നു വ്യാഖ്യാനിച്ച് വികസിപ്പിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ വംശാവലിക്ക് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ആവർത്തിത ഘടന നിലനിർത്തി; δὲ-യുടെ മൃദുവായ ബന്ധകസ്വഭാവം മലയാളത്തിലെ ചിഹ്നനവും വാക്യക്രമവുംകൊണ്ട് പ്രകടമാക്കി.
