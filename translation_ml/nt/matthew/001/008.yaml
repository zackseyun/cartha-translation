id: MAT.1.8
reference: Matthew 1:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀσὰφ⸃ δὲ ἐγέννησεν τὸν Ἰωσαφάτ, Ἰωσαφὰτ δὲ ἐγέννησεν τὸν Ἰωράμ, Ἰωρὰμ δὲ ἐγέννησεν τὸν Ὀζίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/008.yaml
  text: Asaph fathered Jehoshaphat[a], Jehoshaphat fathered Joram, and Joram fathered Uzziah.
translation:
  language: ml
  text: ആസാഫ് യെഹോശാഫാത്തിന്റെ പിതാവായി[a]; യെഹോശാഫാത്ത് യോരാമിന്റെ പിതാവായി; യോരാം ഉസ്സീയാവിന്റെ പിതാവായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘ആസാഫ്’ എന്നതിനുപകരം ‘ആസാ’ എന്നു വായിക്കുന്നു; പഴയനിയമ വംശാവലിയിൽ പറയുന്ന യെഹൂദാരാജാവിന്റെ പേരും ‘ആസാ’ എന്നാണ്.
    reason: textual_variant
lexical_decisions:
- source_word: Ἀσὰφ
  choice: ആസാഫ്
  rationale: SBLGNT പാഠത്തിലെ Ἀσὰφ എന്ന പേരിനെ നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുന്നു. പഴയനിയമ വംശാവലിയിലെ രാജാവായ ആസായുമായി നിശ്ശബ്ദമായി പൊരുത്തപ്പെടുത്താതെ പാഠരൂപം മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: അർദ്ധവിരാമംകൊണ്ടുള്ള തുടർച്ച
  rationale: വംശാവലിയിൽ δέ നേരിയ ബന്ധകമാണ്, വിരോധസൂചകമല്ല. മലയാളത്തിൽ ഓരോ വംശബന്ധവും അർദ്ധവിരാമത്തിലൂടെ സ്വാഭാവികമായി തുടർക്കുന്നു.
- source_word: ἐγέννησεν
  choice: പിതാവായി
  rationale: വംശാവലിയുടെ പിതൃബന്ധം വ്യക്തവും ആധുനികവുമായ മലയാളത്തിൽ അറിയിക്കുന്നു; പുരാതനഭാവമുള്ള ‘ജനിപ്പിച്ചു’ എന്ന പ്രയോഗത്തെക്കാൾ വ്യക്തിനാമങ്ങളോടൊപ്പം സ്വാഭാവികമാണ്.
- source_word: Ἰωσαφάτ
  choice: യെഹോശാഫാത്ത്
  rationale: പഴയനിയമത്തിലെ രാജാവിന്റെ മലയാളത്തിൽ പരിചിതമായ നാമരൂപം ഉപയോഗിക്കുന്നു; ഗ്രീക്ക് പേരിന്റെ തിരിച്ചറിയൽ നിലനിർത്തുന്നു.
- source_word: Ἰωράμ
  choice: യോരാം
  rationale: ഗ്രീക്ക് Ἰωράμ എന്ന ഹ്രസ്വരൂപത്തെ പ്രതിഫലിപ്പിക്കുന്ന പരിചിത മലയാള നാമരൂപം.
- source_word: Ὀζίαν
  choice: ഉസ്സീയാവ്
  rationale: യെഹൂദാരാജാവിന്റെ മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ തിരിച്ചറിയാവുന്ന നാമരൂപം; ഗ്രീക്ക് വിഭക്ത്യന്ത്യം മലയാളത്തിലേക്ക് കൊണ്ടുവരുന്നില്ല.
theological_decisions:
- issue: ആവർത്തിക്കുന്ന δὲ, ἐγέννησεν ഘടനയുടെ പരിഭാഷ
  choice: ഓരോ പിതൃബന്ധവും പ്രത്യേകം നിലനിർത്തി അർദ്ധവിരാമങ്ങളാൽ സുതാര്യമായി ബന്ധിപ്പിക്കുക.
  alternative: ‘ആസാഫ് യെഹോശാഫാത്തിനെ ജനിപ്പിച്ചു; യെഹോശാഫാത്ത് യോരാമിനെ ജനിപ്പിച്ചു; യോരാം ഉസ്സീയാവിനെ ജനിപ്പിച്ചു.’
  rationale: ഇത് ഉപദേശപരമായ തീരുമാനമല്ല, ശൈലീപരമാണ്. മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കൊപ്പം വംശാവലിയുടെ ക്രമവും ഓരോ കണ്ണിയും കൃത്യമായി നിലനിർത്തുന്നു.
- issue: Ἀσὰφ എന്ന പാഠരൂപത്തെ പ്രതീക്ഷിക്കപ്പെടുന്ന ‘ആസാ’ എന്ന ചരിത്രനാമവുമായി പൊരുത്തപ്പെടുത്തണമോ
  choice: മുഖ്യവാചകത്തിൽ ‘ആസാഫ്’ നിലനിർത്തി ‘ആസാ’ എന്ന വായന അടിക്കുറിപ്പിൽ നൽകുക.
  alternative: പഴയനിയമ വംശാവലിയോട് പൊരുത്തപ്പെടുത്തി മുഖ്യവാചകത്തിൽ ‘ആസാ’ ഉപയോഗിക്കുക.
  rationale: ലഭ്യമായ ഗ്രീക്ക് പാഠത്തിന് മുൻഗണന നൽകുകയും യഥാർഥ പാഠവ്യത്യാസവും വംശാവലിപശ്ചാത്തലവും വായനക്കാരനിൽനിന്ന് മറയ്ക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. വംശാവലിയുടെ ആവർത്തനഘടന നിലനിർത്തിക്കൊണ്ട് ഭാരമുള്ളതോ പുരാതനഭാവമുള്ളതോ ആയ പദപ്രയോഗം ഒഴിവാക്കി. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
