  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ നാമകരണപ്രയോഗം അക്ഷരാർഥത്തിൽ കടുപ്പമായി പകർത്താതെ ‘പേരിടണം’ എന്നു നൽകി; പ്രവചനവും നിർദേശവും കാരണവിശദീകരണവും വ്യക്തമായി നിലനിർത്തി.
