source:
  edition: SBLGNT
  text: τέξεται δὲ υἱὸν καὶ καλέσεις τὸ ὄνομα αὐτοῦ Ἰησοῦν, αὐτὸς γὰρ σώσει τὸν λαὸν αὐτοῦ ἀπὸ τῶν ἁμαρτιῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/021.yaml
  text: She will bear a son[a], and you shall call his name Jesus, for he will save his people from their sins.
translation:
  language: ml
  text: അവൾ ഒരു മകനെ പ്രസവിക്കും; നീ അവന് യേശു[a] എന്നു പേരിടണം. കാരണം, അവൻ തന്റെ ജനത്തെ അവരുടെ പാപങ്ങളിൽനിന്ന് രക്ഷിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യേശു’ എന്നത് എബ്രായ/അരമായ ഭാഷകളിലെ ‘യേശുവ’ എന്ന പേരിന്റെ ഗ്രീക്കുരൂപമാണ്; ഈ പേര് ‘യോശുവ’യുമായി ബന്ധപ്പെട്ടതാണ്. ‘യഹോവ രക്ഷിക്കുന്നു’ എന്ന ആശയവുമായി ഈ പേര് ബന്ധപ്പെട്ടിരിക്കുന്നു. ‘അവൻ … രക്ഷിക്കും’ എന്ന മത്തായിയുടെ വിശദീകരണം ഈ പദകളിയെ പ്രതിഫലിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: τέξεται
  choice: പ്രസവിക്കും
  rationale: τίκτω എന്ന ക്രിയയുടെ ഭാവികാലരൂപം പ്രസവത്തെ സൂചിപ്പിക്കുന്നു; പ്രവചനസ്വഭാവം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്.
- source_word: δὲ
  choice: —
  rationale: δέ ഇവിടെ മൃദുവായ ബന്ധകമാണ്; മലയാളത്തിൽ പ്രത്യേക പദം ചേർക്കാതെയും വാക്യബന്ധം സ്വാഭാവികമായി വ്യക്തമാകുന്നു.
- source_word: υἱὸν
  choice: ഒരു മകനെ
  rationale: പ്രസവസന്ദർഭത്തിലെ നിർദേശകപദമില്ലാത്ത υἱόν മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഒരു മകനെ’ എന്നു വരുന്നു.
- source_word: καλέσεις τὸ ὄνομα αὐτοῦ
  choice: നീ അവന് … എന്നു പേരിടണം
  rationale: ഗ്രീക്കിലെ നാമകരണസൂത്രത്തിന്റെ അർഥം സ്വാഭാവികവും വ്യക്തവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ഭാവികാലത്തിലുള്ള നിർദേശത്തിന്റെ ബലം ‘പേരിടണം’ നിലനിർത്തുന്നു.
- source_word: Ἰησοῦν
  choice: യേശു
  rationale: പുതിയനിയമത്തിലെ ഈ വ്യക്തിനാമത്തിന്റെ സ്ഥിരപ്പെട്ട മലയാളരൂപം ഉപയോഗിക്കുന്നു.
- source_word: αὐτὸς
  choice: അവൻ
  rationale: പ്രകടമായ കർത്തൃസർവനാമം രക്ഷിക്കുന്നവൻ ആ ശിശുതന്നെയാണെന്ന കേന്ദ്രീകരണം നൽകുന്നു; മലയാളത്തിൽ ‘അവൻ’ അതിനെ മതിയായവിധം പ്രതിനിധീകരിക്കുന്നു, ‘അവൻതന്നെ’ എന്നു ചേർത്ത് അതിശക്തമാക്കുന്നില്ല.
- source_word: γὰρ
  choice: കാരണം
  rationale: പേരിടാനുള്ള വിശദീകരണകാരണം വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: σώσει
  choice: രക്ഷിക്കും
  rationale: σῴζω ഇവിടെ ജനത്തെ അവരുടെ പാപങ്ങളിൽനിന്ന് മോചിപ്പിക്കുന്ന അർഥത്തിലാണ്; ‘രക്ഷിക്കും’ അതിന്റെ നേരിട്ടും ദൈവശാസ്ത്രപരമായി നിഷ്പക്ഷവുമായ മലയാളരൂപമാണ്.
- source_word: τὸν λαὸν αὐτοῦ
  choice: തന്റെ ജനത്തെ
  rationale: ഉടമസ്ഥബന്ധവും λαός എന്നതിന്റെ ജനസമൂഹാർഥവും നിലനിർത്തുന്നു; ഈ വാക്യം വ്യക്തമാക്കാത്ത വംശീയമോ സർവലൗകികമോ ആയ പരിധി വിവർത്തനം കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: ἀπὸ τῶν ἁμαρτιῶν αὐτῶν
  choice: അവരുടെ പാപങ്ങളിൽനിന്ന്
  rationale: ἀπό സൂചിപ്പിക്കുന്ന വേർപാടും ἁμαρτιῶν എന്ന ബഹുവചനവും കൃത്യമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: രക്ഷാപ്രവൃത്തിയോടനുബന്ധിച്ച αὐτός എന്ന പ്രകടമായ കർത്താവിന്റെ ഊന്നൽ
  choice: ‘അവൻ … രക്ഷിക്കും’ എന്നു നൽകി കർത്താവിനെ പ്രകടമാക്കി
  alternative: ‘അവൻതന്നെ … രക്ഷിക്കും’
  rationale: ഗ്രീക്കിൽ കർത്താവ് പ്രകടമായി നൽകിയിരിക്കുന്നുവെങ്കിലും സന്ദർഭത്തിൽ അത് സാധാരണ വിഷയമാറ്റത്തിനും പേരിന്റെ വിശദീകരണത്തിനും സഹായിക്കുന്നു. ‘അവൻ’ പാഠത്തിന്റെ ക്രിസ്തുകേന്ദ്രിതത്വം നിലനിർത്തുന്നു; ‘അവൻതന്നെ’ അനാവശ്യമായി വിരുദ്ധതയോ പ്രത്യേക ഊന്നലോ വർധിപ്പിച്ചേക്കാം.
- issue: ‘തന്റെ ജനം’ എന്നതിന്റെ പരിധി
  choice: ‘തന്റെ ജനം’ എന്നു മാത്രം വിവർത്തനം ചെയ്തു
  alternative: ‘തന്റെ ജനമായ ഇസ്രായേൽ’ / ‘തനിക്കുള്ള സകല മനുഷ്യരും’
  rationale: മത്തായിയുടെ തത്സമയ പശ്ചാത്തലം യഹൂദ-ഉടമ്പടിസംബന്ധിയായിരുന്നാലും ഈ വാക്യം പരിധി കൂടുതൽ നിർവചിക്കുന്നില്ല; അതിനാൽ വ്യാഖ്യാനപരമായ ചുരുക്കലോ വിപുലീകരണമോ ഒഴിവാക്കുന്നു.
