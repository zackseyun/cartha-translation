id: MAT.1.16
reference: Matthew 1:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἰακὼβ δὲ ἐγέννησεν τὸν Ἰωσὴφ τὸν ἄνδρα Μαρίας, ἐξ ἧς ἐγεννήθη Ἰησοῦς ὁ λεγόμενος χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/016.yaml
  text: And Jacob fathered Joseph[a], the husband of Mary, from whom Jesus was born[b], who is called the Messiah.
translation:
  language: ml
  text: യാക്കോബ് മറിയയുടെ ഭർത്താവായ യോസേഫിനെ ജനിപ്പിച്ചു. മറിയയിൽനിന്ന് മശീഹ[a] എന്നു വിളിക്കപ്പെടുന്ന യേശു ജനിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ക്രിസ്തു’. ഗ്രീക്കിലെ ക്രിസ്റ്റോസ് എന്ന പദം ഇവിടെ ഒരു പദവിയായി ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: alternative_rendering
lexical_decisions:
- source_word: δὲ
  choice: വാക്യവിഭജനത്തിലൂടെ സൂചിപ്പിച്ചു
  rationale: ഇവിടെ δέ വംശാവലിയുടെ തുടർച്ചയെ നേരിയതായി മുന്നോട്ടുകൊണ്ടുപോകുന്നു. മലയാളത്തിൽ പ്രത്യേക സംയോജകപദം ചേർക്കാതെ അടുത്ത പ്രസ്താവനയിലേക്കു കടക്കുന്നത് സ്വാഭാവികവും അതിന്റെ ലഘുവായ ബന്ധകപ്രവർത്തനം നിലനിർത്തുന്നതുമാണ്.
- source_word: ἐγέννησεν
  choice: ജനിപ്പിച്ചു
  rationale: വംശാവലിയിൽ പുരുഷവഴിയുള്ള ജനനബന്ധത്തെ സൂചിപ്പിക്കുന്ന ക്രിയയാണിത്. ‘ജനിപ്പിച്ചു’ സംക്ഷിപ്തവും മലയാള ബൈബിൾശൈലിയിൽ പരിചിതവും മൂലത്തിലെ സജീവക്രിയയെ നിലനിർത്തുന്നതുമാണ്.
- source_word: τὸν ἄνδρα Μαρίας
  choice: മറിയയുടെ ഭർത്താവായ
  rationale: ἀνήρ എന്നതിന് ‘പുരുഷൻ’ എന്നും ‘ഭർത്താവ്’ എന്നും അർഥമുണ്ടാകാം; ‘മറിയയുടെ’ എന്ന ബന്ധപ്രയോഗം ഇവിടെ ദാമ്പത്യബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: ἐξ ἧς
  choice: മറിയയിൽനിന്ന്
  rationale: സ്ത്രീലിംഗ ഏകവചനമായ ἧς മറിയയെ മാത്രം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ പേര് ആവർത്തിക്കുന്നത് അവ്യക്തത ഒഴിവാക്കുകയും ἐκ എന്ന പദത്തിന്റെ ‘നിന്ന്’ എന്ന ആശയം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐγεννήθη
  choice: ജനിച്ചു
  rationale: സജീവമായ ‘ജനിപ്പിച്ചു’ എന്ന വംശാവലിസൂത്രത്തിൽനിന്ന് മൂലം ഇവിടെ കർമണിപ്രയോഗത്തിലേക്കു മാറുന്നു. ‘ജനിച്ചു’ സ്വാഭാവികമായ മലയാളത്തിൽ ആ വ്യത്യാസം പ്രകടമാക്കുന്നു.
- source_word: ὁ λεγόμενος
  choice: എന്നു വിളിക്കപ്പെടുന്ന
  rationale: യേശുവിനെ സാധാരണയായി പ്രയോഗിക്കപ്പെടുന്ന ഒരു പദവിയാൽ തിരിച്ചറിയിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ പരിഭാഷയാണിത്.
- source_word: χριστός
  choice: മശീഹ
  rationale: ഇവിടെ χριστός വ്യക്തിനാമത്തിന്റെ ഭാഗമായല്ല, യേശുവിനെ തിരിച്ചറിയിക്കുന്ന പദവിയായാണ് വരുന്നത്. അതിനാൽ പേരുപോലെ ‘ക്രിസ്തു’ എന്നു ലിപ്യന്തരം ചെയ്യുന്നതിനുപകരം പദവിയായ ‘മശീഹ’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: χριστός എന്ന ക്രിസ്തുശാസ്ത്രപരമായ പദവിയുടെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ὁ λεγόμενος χριστός എന്ന ഘടനയിൽ χριστός ഒരു പദവിയായി പ്രവർത്തിക്കുന്നു. അതിന്റെ മശീഹാപരമായ അർഥം വ്യക്തമാക്കുന്നതിനായി ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി; പേരുപോലുള്ള രൂപമായി മാത്രം അവതരിപ്പിച്ചില്ല.
- issue: യോസേഫിന്റെ ജനനവും യേശുവിന്റെ ജനനവും വിവരിക്കുന്നതിലെ വ്യത്യാസം
  choice: യാക്കോബ് യോസേഫിനെ ‘ജനിപ്പിച്ചു’; എന്നാൽ യേശു മറിയയിൽനിന്ന് ‘ജനിച്ചു’
  alternative: യോസേഫ് യേശുവിനെ ജനിപ്പിച്ചു എന്നു വംശാവലിസൂത്രം തുടർന്നുപറയുക
  rationale: മൂലപാഠം സജീവമായ ἐγέννησεν എന്ന ക്രിയയിൽനിന്ന് കർമണിയായ ἐγεννήθη എന്നതിലേക്കു മാറുകയും സ്ത്രീലിംഗമായ ἐξ ἧς ഉപയോഗിച്ച് മറിയയെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു. പരിഭാഷ ഈ ഉദ്ദേശ്യപൂർവമായ മാറ്റം സംരക്ഷിക്കുന്നു; അതിനപ്പുറം ഒരു സിദ്ധാന്തവ്യാഖ്യാനവും ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ വംശാവലിക്ക് യോജിച്ച ഗൗരവമുള്ള ശൈലി സ്വീകരിച്ചു. ആദ്യവാക്യത്തിലെ ‘ജനിപ്പിച്ചു’ എന്നും രണ്ടാംവാക്യത്തിലെ ‘ജനിച്ചു’ എന്നും ഉള്ള വ്യത്യാസം ഗ്രീക്കിലെ നിർണായകമായ ക്രിയാമാറ്റം വ്യക്തമാക്കുന്നു. സ്ത്രീലിംഗ സർവനാമത്തിന്റെ സൂചന നഷ്ടപ്പെടാതിരിക്കാൻ ‘മറിയ’ വീണ്ടും വ്യക്തമാക്കി.
