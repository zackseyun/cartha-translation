  text: Ἀρὰμ δὲ ἐγέννησεν τὸν Ἀμιναδάβ, Ἀμιναδὰβ δὲ ἐγέννησεν τὸν Ναασσών, Ναασσὼν δὲ ἐγέννησεν τὸν Σαλμών,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/004.yaml
  text: Aram fathered Amminadab[a], and Amminadab fathered Nahshon, and Nahshon fathered Salmon.
translation:
  language: ml
  text: അരാം അമ്മീനാദാബിന്റെ പിതാവായി[a]; അമ്മീനാദാബ് നഹ്ശോന്റെ പിതാവായി; നഹ്ശോൻ സൽമോന്റെ പിതാവായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘രാം.’ ഗ്രീക്ക് പാഠത്തിൽ ‘അരാം’ (Ἀράμ) എന്നാണ്; എബ്രായ വംശാവലിയിലെ നാമരൂപത്തോട് പൊരുത്തപ്പെടുത്തി പല വിവർത്തനങ്ങളും ‘രാം’ എന്നു നൽകുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀρὰμ
  choice: അരാം
  rationale: SBLGNT-യിലെ ഗ്രീക്ക് രൂപമായ Ἀράμ നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുന്നു. എബ്രായ വംശാവലിയിലെ ‘രാം’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: വാക്യഘടനയിലെ അർധവിരാമം
  rationale: ഇവിടെ δέ ശക്തമായ വൈരുധ്യം സൂചിപ്പിക്കുന്നില്ല; വംശാവലിയുടെ തുടർച്ചയാണ് അടയാളപ്പെടുത്തുന്നത്. ആവർത്തിച്ചുള്ള ‘പിന്നെ/എന്നാൽ’ ഒഴിവാക്കി അർധവിരാമങ്ങൾ മലയാളത്തിൽ അതേ തുടർച്ച സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐγέννησεν
  choice: പിതാവായി
  rationale: വംശാവലി സന്ദർഭത്തിലെ പുരുഷവംശബന്ധം വ്യക്തവും മാന്യവും ആധുനികവുമായ മലയാളത്തിൽ അറിയിക്കുന്നു; പുരാതനഭാവമുള്ള ‘ജനിപ്പിച്ചു’ എന്നതിനെക്കാൾ സ്വാഭാവികമാണ്.
- source_word: Ἀμιναδάβ
  choice: അമ്മീനാദാബ്
  rationale: ഗ്രീക്ക് നാമരൂപത്തിന്റെ ശബ്ദഘടന മലയാളത്തിൽ വ്യക്തമായി പ്രതിനിധീകരിക്കുന്ന ലിപ്യന്തരണം.
- source_word: Ναασσών
  choice: നഹശോൻ
  rationale: ഗ്രീക്ക് രൂപത്തിന് പിന്നിലുള്ള പരിചിതമായ എബ്രായ നാമരൂപവുമായി പൊരുത്തപ്പെടുകയും മലയാളത്തിൽ വായിക്കാൻ സ്വാഭാവികമാകുകയും ചെയ്യുന്നു.
- source_word: Σαλμών
  choice: സൽമോൻ
  rationale: ഗ്രീക്ക് Σαλμών എന്ന വ്യക്തിനാമത്തെ മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന വിധത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
