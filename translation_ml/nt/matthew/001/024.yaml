id: MAT.1.24
reference: Matthew 1:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ἐγερθεὶς δὲ ὁ Ἰωσὴφ ἀπὸ τοῦ ὕπνου ἐποίησεν ὡς προσέταξεν αὐτῷ ὁ ἄγγελος κυρίου καὶ παρέλαβεν τὴν γυναῖκα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/024.yaml
  text: Then Joseph[a], having awakened from sleep, did as the angel of the Lord commanded him and took his wife.
translation:
  language: ml
  text: യോസേഫ് ഉറക്കത്തിൽനിന്ന് ഉണർന്നശേഷം, കർത്താവിന്റെ ദൂതൻ തന്നോടു കല്പിച്ചതുപോലെ ചെയ്തിട്ട് തന്റെ ഭാര്യയെ സ്വീകരിച്ചു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “തന്റെ ഭാര്യയെ കൂടെക്കൊണ്ടു” അല്ലെങ്കിൽ “തന്റെ ഭാര്യയെ സ്വന്തം ഭവനത്തിലേക്കു സ്വീകരിച്ചു.” ഗ്രീക്ക് ക്രിയയ്ക്ക് ഒരാളെ തന്നോടൊപ്പം, സ്വന്തം കുടുംബത്തിലേക്ക് സ്വീകരിക്കുക എന്ന അർഥവും വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθεὶς … ἀπὸ τοῦ ὕπνου
  choice: ഉറക്കത്തിൽനിന്ന് ഉണർന്നശേഷം
  rationale: ഉറക്കത്തിൽനിന്നുള്ള ഉണർവും തുടർന്നുള്ള പ്രവൃത്തിയും സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് കൃതന്തത്തിന്റെ ക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: തുടർച്ചയിലൂടെ പ്രകടമാക്കി
  rationale: ഇവിടെ ശക്തമായ വിരോധമല്ല, കഥയുടെ പുരോഗതിയാണ് സൂചിപ്പിക്കുന്നത്; മലയാള വാക്യക്രമം അതു സ്വാഭാവികമായി പ്രകടമാക്കുന്നതിനാൽ പ്രത്യേക ബന്ധപദം ചേർത്തിട്ടില്ല.
- source_word: ἐποίησεν ὡς προσέταξεν
  choice: കല്പിച്ചതുപോലെ ചെയ്തു
  rationale: ആധികാരികമായ നിർദേശത്തോടുള്ള കൃത്യമായ അനുസരണം നേരിട്ടും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: ὁ ἄγγελος κυρίου
  choice: കർത്താവിന്റെ ദൂതൻ
  rationale: ഗ്രീക്ക് ജനിറ്റീവ് ഘടനയും പതിവായ ബൈബിൾ പ്രയോഗവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: παρέλαβεν
  choice: സ്വീകരിച്ചു
  rationale: παραλαμβάνω എന്ന പദത്തിലെ ‘തന്നോടുകൂടെ/സ്വന്തം ഭവനത്തിലേക്ക് സ്വീകരിക്കുക’ എന്ന അർഥസാധ്യത മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; അതിന്റെ വ്യാപ്തി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: തന്റെ ഭാര്യയെ
  rationale: വിവാഹബന്ധത്തിന്റെ സാമൂഹിക-നിയമപരമായ പശ്ചാത്തലത്തിൽ γυνή ഇവിടെ ‘ഭാര്യ’ എന്നാണ് സ്വാഭാവികമായി അർഥമാക്കുന്നത്.
theological_decisions:
- issue: വിവാഹം പൂർത്തീകരിക്കുന്നതിന് മുമ്പുള്ള പശ്ചാത്തലത്തിൽ γυνή എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: തന്റെ ഭാര്യയെ
  alternative: ആ സ്ത്രീയെ
  rationale: മുൻവാക്യങ്ങളിൽ വിവാഹനിശ്ചയവും അടുത്ത വാക്യത്തിൽ ദാമ്പത്യബന്ധം ഉണ്ടായിട്ടില്ലെന്ന വിവരവും ഉണ്ടെങ്കിലും, മത്തായി മറിയത്തെ ഇതിനകം നിയമപരമായ വിവാഹചട്ടക്കൂടിൽ അവതരിപ്പിക്കുന്നു. ‘ഭാര്യ’ എന്നു പറയുന്നത് ദാമ്പത്യബന്ധം പൂർത്തിയായെന്ന് അധികമായി സൂചിപ്പിക്കുന്നില്ല.
- issue: ἄγγελος κυρίου എന്ന പ്രയോഗത്തിലെ κύριος
  choice: കർത്താവിന്റെ ദൂതൻ
  alternative: യഹോവയുടെ ദൂതൻ
  rationale: ഗ്രീക്ക് പാഠത്തിൽ κύριος ആണ് ഉള്ളത്; അതിനെ ‘കർത്താവ്’ എന്നു നൽകുന്നത് മൂലപദത്തോടും മലയാളത്തിലെ ബൈബിൾ പ്രയോഗത്തോടും യോജിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മാന്യവുമായ മലയാളം. ‘കല്പിച്ചു’, ‘കർത്താവിന്റെ ദൂതൻ’ എന്നീ പ്രയോഗങ്ങൾ ബൈബിൾ ഗൗരവം നിലനിർത്തുമ്പോൾ വാക്യഘടന സ്വാഭാവികമായി സൂക്ഷിച്ചിരിക്കുന്നു.
