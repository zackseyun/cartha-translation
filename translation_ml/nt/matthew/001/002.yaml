id: MAT.1.2
reference: Matthew 1:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀβραὰμ ἐγέννησεν τὸν Ἰσαάκ, Ἰσαὰκ δὲ ἐγέννησεν τὸν Ἰακώβ, Ἰακὼβ δὲ ἐγέννησεν τὸν Ἰούδαν καὶ τοὺς ἀδελφοὺς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/002.yaml
  text: Abraham fathered Isaac[a], and Isaac fathered Jacob, and Jacob fathered Judah and his brothers,
translation:
  language: ml
  text: അബ്രാഹാം യിസ്ഹാക്കിന്റെ പിതാവായി[a]; യിസ്ഹാക്ക് യാക്കോബിന്റെ പിതാവായി; യാക്കോബ് യെഹൂദായുടെയും അവന്റെ സഹോദരന്മാരുടെയും പിതാവായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യിസ്ഹാക്കിനെ ജനിപ്പിച്ചു.’ ഗ്രീക്ക് ക്രിയയെ ഔപചാരികമായി ‘യിസ്ഹാക്കിന്റെ പിതാവായി’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: പിതാവായി
  rationale: വംശാവലിയുടെ പശ്ചാത്തലത്തിൽ γεννάω പുരുഷവഴിയുള്ള ജനനത്തെയോ വംശബന്ധത്തെയോ സൂചിപ്പിക്കുന്നു. ‘പിതാവായി’ എന്നത് ആ പിതൃവംശപരമായ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ഓരോ ബന്ധവും നിർബന്ധമായും നേരിട്ടുള്ള തലമുറയാണെന്ന് അധികമായി നിർണയിക്കുന്നില്ല.
- source_word: δὲ
  choice: വാക്യക്രമവും അർദ്ധവിരാമവും വഴി സൂചിപ്പിച്ചു
  rationale: ഇവിടെ δέ ശക്തമായ വിരോധമല്ല, വംശാവലിയിലെ അടുത്ത ഘട്ടത്തിലേക്കുള്ള മൃദുവായ ബന്ധകമാണ്. മലയാളത്തിൽ ഓരോ പേരിനുമുമ്പും ‘പിന്നെ’ അല്ലെങ്കിൽ ‘എന്നാൽ’ ചേർക്കുന്നതിനെക്കാൾ അർദ്ധവിരാമത്തോടെയുള്ള സമാന്തരഘടന സ്വാഭാവികമായി അതിന്റെ പ്രവർത്തനം വഹിക്കുന്നു.
- source_word: Ἰούδαν
  choice: യെഹൂദ
  rationale: ഇവിടെ ഉദ്ദേശിക്കുന്നത് യാക്കോബിന്റെ മകനായ ഗോത്രപിതാവ് യെഹൂദയാണ്; പുതിയനിയമകാലത്തെ യൂദാസ് അല്ല. മലയാള ബൈബിൾ പ്രയോഗത്തിൽ ഈ പഴയനിയമ വ്യക്തിയെ തിരിച്ചറിയിക്കുന്ന സ്ഥിരമായ രൂപമാണ് ‘യെഹൂദ’.
- source_word: ἀδελφοὺς αὐτοῦ
  choice: അവന്റെ സഹോദരന്മാർ
  rationale: ἀδελφοί ഇവിടെ യാക്കോബിന്റെ മറ്റു പുത്രന്മാരായ പുരുഷ സഹോദരന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്. അതിനാൽ ലിംഗവും സന്ദർഭവും കൃത്യമായി നിലനിർത്താൻ ‘സഹോദരന്മാർ’ ഉപയോഗിച്ചു.
- source_word: Ἀβραὰμ / Ἰσαάκ / Ἰακώβ
  choice: അബ്രാഹാം / യിസ്ഹാക്ക് / യാക്കോബ്
  rationale: ആധുനിക മലയാള ബൈബിൾ വായനയിൽ പരിചിതവും വ്യക്തികളെ എളുപ്പം തിരിച്ചറിയാൻ സഹായിക്കുന്നതുമായ പരമ്പരാഗത നാമരൂപങ്ങൾ ഉപയോഗിച്ചു.
theological_decisions:
- issue: വംശാവലിയിലെ ἐγέννησεν എന്ന ക്രിയയുടെ വിവർത്തനം
  choice: എല്ലാ ഘട്ടത്തിലും ‘പിതാവായി’ ഉപയോഗിക്കുക
  alternative: ‘ജനിപ്പിച്ചു’ അല്ലെങ്കിൽ ‘ജന്മം നൽകി’ ഉപയോഗിക്കുക
  rationale: ‘പിതാവായി’ എന്ന പ്രയോഗം ഗ്രീക്കിലെ പുരുഷവംശപരമായ ഊന്നൽ നിലനിർത്തുകയും, വംശാവലികൾ ചിലപ്പോൾ തലമുറകൾ ചുരുക്കി പറയാമെന്ന യഥാർഥ സാധ്യത അടച്ചുകളയാതിരിക്കുകയും ചെയ്യുന്നു. ‘ജനിപ്പിച്ചു’ കൂടുതൽ അക്ഷരാർഥപരമാണെങ്കിലും സാധാരണ മലയാളത്തിൽ കടുപ്പമുള്ളതോ നേരിട്ടുള്ള ജൈവജനനത്തെ അനാവശ്യമായി നിർബന്ധിക്കുന്നതോ ആയി കേൾക്കാം.
- issue: യെഹൂദയോടൊപ്പം സഹോദരന്മാരെ പരാമർശിക്കുന്നതിന്റെ പരിധി
  choice: ‘യെഹൂദയുടെയും അവന്റെ സഹോദരന്മാരുടെയും പിതാവായി’ എന്ന് ഗ്രീക്ക് ഘടന നിലനിർത്തുക
  alternative: യെഹൂദയെ മാത്രം വംശരേഖയുടെ അടുത്ത കണ്ണിയായി പറഞ്ഞ് സഹോദരന്മാരെ പരോക്ഷമാക്കുക
  rationale: മൂലപാഠം സഹോദരന്മാരെ വ്യക്തമായി ഉൾപ്പെടുത്തുന്നു. അവർ മശീഹീയ വംശരേഖയിലെ ഓരോ അടുത്ത കണ്ണിയാണെന്ന് പറയാതെതന്നെ, ഇസ്രായേലിന്റെ ഗോത്രപിതാക്കന്മാരുമായുള്ള വിപുലമായ ബന്ധം ഈ രൂപം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ സാധാരണ മലയാളം. ആവർത്തനമുള്ള വംശാവലി ശൈലി നിലനിർത്തിയെങ്കിലും, δέ ഓരോ തവണയും പ്രത്യേക ബന്ധകപദമായി വിവർത്തനം ചെയ്യാതെ സമാന്തര വാക്യഘടനയിലൂടെ സ്വാഭാവിക ഒഴുക്ക് നൽകി. അടിക്കുറിപ്പ് ചിഹ്നം [a] മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
