  to: 'മശീഹയായ യേശുവിന്റെ[a] ജനനം ഇങ്ങനെയായിരുന്നു: അവന്റെ അമ്മ മറിയം യോസേഫുമായി വിവാഹനിശ്ചയം കഴിഞ്ഞിരിക്കെ[b], അവർ ഒരുമിച്ചു ചേരുന്നതിനുമുമ്പ്[c], അവൾ പരിശുദ്ധാത്മാവിൽനിന്ന് ഗർഭിണിയായതായി കണ്ടെത്തപ്പെട്ടു.'
