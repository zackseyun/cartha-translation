id: MAT.1.18
reference: Matthew 1:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τοῦ δὲ ⸀Ἰησοῦ χριστοῦ ἡ ⸀γένεσις οὕτως ἦν. ⸀μνηστευθείσης τῆς μητρὸς αὐτοῦ Μαρίας τῷ Ἰωσήφ, πρὶν ἢ συνελθεῖν αὐτοὺς εὑρέθη ἐν γαστρὶ ἔχουσα ἐκ πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/018.yaml
  text: 'The birth of Jesus the Messiah happened in this way: when his mother Mary had been betrothed to Joseph[a], before they came together[c][b], she was found to be pregnant from the Holy Spirit.'
translation:
  language: ml
  text: 'മശീഹയായ യേശുവിന്റെ[a] ജനനം ഇങ്ങനെയായിരുന്നു: അവന്റെ അമ്മ മറിയം യോസേഫുമായി വിവാഹനിശ്ചയം കഴിഞ്ഞിരിക്കെ[b], അവർ ഒരുമിച്ചു ചേരുന്നതിനുമുമ്പ്[c], അവൾ പരിശുദ്ധാത്മാവിൽനിന്ന് ഗർഭിണിയായതായി കണ്ടെത്തപ്പെട്ടു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യേശുക്രിസ്തുവിന്റെ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ അർഥം നിലനിർത്താനാണ് ഇവിടെ ‘മശീഹ’ എന്നു നൽകിയിരിക്കുന്നത്.
    reason: alternative_reading
  - marker: b
    text: ഇവിടത്തെ ‘വിവാഹനിശ്ചയം’ ആധുനികകാലത്തെ വിവാഹനിശ്ചയത്തേക്കാൾ കൂടുതൽ ബാധകതയുള്ള, ഔപചാരികവും നിയമപരമായി അംഗീകരിക്കപ്പെട്ടതുമായ പ്രതിബദ്ധതയായിരുന്നു.
    reason: cultural_note
  - marker: c
    text: ‘ഒരുമിച്ചു ചേരുക’ എന്നത് ദാമ്പത്യജീവിതം ആരംഭിക്കുന്നതിനെയും, പ്രത്യേകിച്ച് ദാമ്പത്യബന്ധം പൂർത്തിയാക്കുന്നതിനെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: γένεσις
  choice: ജനനം
  rationale: തുടർന്നുവരുന്ന വിവരണത്തിന്റെ പശ്ചാത്തലത്തിൽ യേശുവിന്റെ ജനനത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും വ്യക്തവുമായ പ്രയോഗം.
- source_word: Ἰησοῦ χριστοῦ
  choice: മശീഹയായ യേശുവിന്റെ
  rationale: Χριστός ഇവിടെ പേരിന്റെ ഭാഗംപോലെ മാത്രം അല്ല, അഭിഷിക്തനായ രാജാവിനെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരായതിനാൽ അതിന്റെ അർഥം നിലനിർത്താൻ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: οὕτως ἦν
  choice: ഇങ്ങനെയായിരുന്നു
  rationale: സംഭവം നടന്ന രീതി പരിചയപ്പെടുത്തുന്ന ഗ്രീക്ക് പ്രയോഗത്തെ ലളിതവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: μνηστευθείσης
  choice: വിവാഹനിശ്ചയം കഴിഞ്ഞിരിക്കെ
  rationale: ആധുനിക അനൗപചാരിക വിവാഹനിശ്ചയത്തേക്കാൾ നിയമപരമായി ബാധകമായിരുന്ന ഔപചാരിക വിവാഹബന്ധനിശ്ചയമാണ് ഉദ്ദേശിക്കുന്നത്; വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: πρὶν ἢ συνελθεῖν αὐτούς
  choice: അവർ ഒരുമിച്ചു ചേരുന്നതിനുമുമ്പ്
  rationale: ഗ്രീക്കിലെ മാന്യമായ പരോക്ഷപ്രയോഗവും അതിലുള്ള അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു; ദാമ്പത്യസംഗമത്തിന്റെ സൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: εὑρέθη
  choice: വെളിപ്പെട്ടു
  rationale: അവളുടെ ഗർഭാവസ്ഥ അറിയപ്പെടുകയോ കണ്ടെത്തപ്പെടുകയോ ചെയ്തു എന്ന നിഷ്ക്രിയ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ആരാണ് കണ്ടെത്തിയത് എന്ന് കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: ἐν γαστρὶ ἔχουσα
  choice: ഗർഭിണിയായതായി
  rationale: ഗർഭം ധരിച്ച അവസ്ഥയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ശൈലിയുടെ സ്വാഭാവിക ആധുനിക മലയാളരൂപം.
- source_word: ἐκ πνεύματος ἁγίου
  choice: പരിശുദ്ധാത്മാവിൽനിന്ന്
  rationale: ἐκ സൂചിപ്പിക്കുന്ന ഉറവിടം ‘-ൽനിന്ന്’ എന്ന പ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ദൈവിക പരിശുദ്ധാത്മാവാണ് ഉദ്ദേശ്യം.
theological_decisions:
- issue: Χριστός എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഈ ആഖ്യാനത്തിന്റെ ആമുഖത്തിൽ പദം ഒരു സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നു. ‘മശീഹ’ അതിന്റെ അർഥവും പ്രതീക്ഷിക്കപ്പെട്ട അഭിഷിക്തൻ എന്ന ആശയവും നിലനിർത്തുന്നു; പരിചിതമായ മറുരൂപം അടിക്കുറിപ്പിൽ കൊടുക്കുന്നു.
- issue: πνεύματος ἁγίου ആരെ സൂചിപ്പിക്കുന്നു
  choice: പരിശുദ്ധാത്മാവ്
  alternative: ഒരു വിശുദ്ധ ആത്മാവ്
  rationale: മത്തായിയുടെ ജനനവിവരണത്തിൽ ഇത് അനിശ്ചിതമായ ഒരു ആത്മശക്തിയെയല്ല, ദൈവിക പരിശുദ്ധാത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്. ഗ്രീക്കിൽ നിർദ്ദേശക ഉപപദം ഇല്ലാത്തത് അനിശ്ചിതത്വം നിർബന്ധമാക്കുന്നില്ല.
- issue: συνελθεῖν എന്ന പ്രയോഗത്തിന്റെ അർഥവ്യാപ്തി
  choice: ഒരുമിച്ചു ചേരുക
  alternative: ദാമ്പത്യബന്ധത്തിൽ ഏർപ്പെടുക
  rationale: മൂലത്തിലെ മാന്യവും പരോക്ഷവുമായ ഭാഷ നിലനിർത്തുകയും, വെറും ഒരുമിച്ചു താമസിക്കൽ മുതൽ ദാമ്പത്യസംഗമം വരെയുള്ള സന്ദർഭസൂചനയെ അമിതമായി നിർണ്ണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. മൂലത്തിലെ പരോക്ഷമായ ലൈംഗികപ്രയോഗം പരോക്ഷമായിത്തന്നെ നിലനിർത്തി; സാംസ്കാരികവും പദാർഥപരവുമായ വിശദീകരണങ്ങൾ അടിക്കുറിപ്പുകളിലേക്ക് മാറ്റി. ഇംഗ്ലീഷ് consultation layer-ലുള്ള അടിക്കുറിപ്പ്-ചിഹ്നങ്ങളുടെ തെറ്റായ സ്ഥാനക്രമം പിന്തുടരാതെ, [a] മശീഹയോടും [b] വിവാഹനിശ്ചയത്തോടും [c] ഒരുമിച്ചു ചേരുന്നതിനോടും ചേർത്തു.
