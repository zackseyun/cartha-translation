id: MAT.1.12
reference: Matthew 1:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Μετὰ δὲ τὴν μετοικεσίαν Βαβυλῶνος Ἰεχονίας ἐγέννησεν τὸν Σαλαθιήλ, Σαλαθιὴλ δὲ ἐγέννησεν τὸν Ζοροβαβέλ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/012.yaml
  text: After the deportation to Babylon[a], Jeconiah fathered Shealtiel, and Shealtiel fathered Zerubbabel.
translation:
  language: ml
  text: ബാബേലിലേക്കുള്ള നാടുകടത്തലിനുശേഷം[a] യെഖോന്യാവ് ശെയൽത്യേലിന്റെ പിതാവായി; ശെയൽത്യേൽ സെരൂബ്ബാബേലിന്റെ പിതാവായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ബാബേലിലേക്കുള്ള പ്രവാസത്തിനുശേഷം.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദം ജനങ്ങളെ നിർബന്ധമായി മാറ്റിപ്പാർപ്പിച്ച് ബാബേലിലെ പ്രവാസത്തിലേക്കയച്ച സംഭവത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ
  choice: ശേഷം
  rationale: μετάയും accusative-ഉം കാലക്രമത്തിൽ ‘ശേഷം’ എന്നു സൂചിപ്പിക്കുന്നു; δέ മൃദുവായ ബന്ധകമായതിനാൽ സ്വാഭാവികമായ മലയാളവാക്യത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്തേണ്ടതില്ല.
- source_word: τὴν μετοικεσίαν Βαβυλῶνος
  choice: ബാബേലിലേക്കുള്ള നാടുകടത്തൽ
  rationale: μετοικεσία ജനങ്ങളെ നിർബന്ധമായി മാറ്റിപ്പാർപ്പിച്ച സംഭവത്തെ സൂചിപ്പിക്കുന്നു. ‘നാടുകടത്തൽ’ അതിലെ നിർബന്ധിത നീക്കത്തെ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; ‘ബാബേലിലേക്കുള്ള പ്രവാസം’ എന്നതും സാധ്യമാണ്.
- source_word: Ἰεχονίας
  choice: യെഖൊന്യാവ്
  rationale: ഗ്രീക്ക് Ἰεχονίας-നു യോജിച്ചും മലയാള ബൈബിൾ നാമരൂപങ്ങളോട് ഇണങ്ങിയും നിൽക്കുന്ന രൂപം.
- source_word: ἐγέννησεν
  choice: പിതാവായി
  rationale: വംശാവലിയുടെ പശ്ചാത്തലത്തിൽ γεννάω പിതൃവംശപരമ്പരയെ സൂചിപ്പിക്കുന്നു. ‘പിതാവായി’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്; വംശാവലി ശൈലി അനുവദിക്കുന്നതിലധികം നേരിട്ടുള്ള ജൈവതലമുറബന്ധം നിർബന്ധമായി ചുമത്തുന്നില്ല.
- source_word: Σαλαθιήλ
  choice: ശെയൽതീയേൽ
  rationale: പഴയനിയമത്തിലെ പരിചിതമായ ശെയൽതീയേൽ എന്ന നാമരൂപവുമായി ഒത്തുപോകുന്ന മലയാളരൂപം.
- source_word: δὲ
  choice: (വാക്യവിഭജനത്തിലൂടെ ബന്ധിപ്പിച്ചു)
  rationale: രണ്ടാമത്തെ δέ വംശാവലിയിലെ അടുത്ത കണ്ണിയെ മൃദുവായി ബന്ധിപ്പിക്കുന്നു. മലയാളത്തിൽ അർധവിരാമവും ആവർത്തിത വാക്യഘടനയും ഈ ബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: Ζοροβαβέλ
  choice: സെരുബ്ബാബേൽ
  rationale: പഴയനിയമത്തിലെ പരിചിതമായ നാമരൂപത്തോട് ഇണങ്ങുന്ന മലയാള ലിപ്യന്തരണം.
theological_decisions:
- issue: വംശാവലിയിൽ γεννάω എന്ന ക്രിയയുടെ അർഥം
  choice: ‘പിതാവായി’ എന്നു പരിഭാഷപ്പെടുത്തി പിതൃവംശപരമ്പര സൂചിപ്പിക്കുക; ഉടനെയുള്ള ജൈവതലമുറയാണെന്ന് അധികമായി നിർവചിക്കാതിരിക്കുക.
  alternative: ‘ജനിപ്പിച്ചു’
  rationale: മത്തായിയുടെ വംശാവലി പൂർവികൻ–പിൻഗാമി ബന്ധത്തെ പരമ്പരാഗത വംശാവലി ഭാഷയിൽ അവതരിപ്പിക്കുന്നു. ‘പിതാവായി’ ആ ബന്ധം നിലനിർത്തുകയും വിഭാഗത്തിന്റെ പതിവിനപ്പുറം കർശനമായ ജൈവസമീപത ചുമത്താതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വംശാവലിയുടെ ആവർത്തനശൈലി നിലനിർത്തുന്നു; നിർബന്ധിത മാറ്റിപ്പാർപ്പിക്കലിന്റെ അർഥം മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കുകയും പരമ്പരാഗതമായ ‘പ്രവാസം’ അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
