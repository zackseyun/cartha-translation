id: MAT.1.22
reference: Matthew 1:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῦτο δὲ ὅλον γέγονεν ἵνα πληρωθῇ τὸ ῥηθὲν ⸀ὑπὸ κυρίου διὰ τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/022.yaml
  text: All this happened so that what was spoken by the Lord through the prophet might be fulfilled[a], saying,
translation:
  language: ml
  text: 'ഇതെല്ലാം സംഭവിച്ചത്, പ്രവാചകനിലൂടെ കർത്താവ് അരുളിച്ചെയ്തത് നിറവേറേണ്ടതിനാണ്:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο δὲ ὅλον
  choice: ഇതെല്ലാം
  rationale: τοῦτο എന്ന ഏകവചന സൂചകപദം മുമ്പ് വിവരിച്ച സംഭവങ്ങളെ ഒന്നാകെ ചൂണ്ടിക്കാണിക്കുന്നു; ὅλον അവയുടെ സമഗ്രത ഊന്നിപ്പറയുന്നു. δέ ഇവിടെ ശക്തമായ വിരോധമല്ല, ആഖ്യാനത്തിന്റെ തുടർച്ചയാണ്; സ്വാഭാവിക മലയാളത്തിൽ പ്രത്യേക പദം ചേർക്കാതെ വാക്യക്രമത്തിലൂടെ അത് പ്രകടമാകുന്നു.
- source_word: γέγονεν
  choice: സംഭവിച്ചു
  rationale: γίνομαι എന്ന ക്രിയയുടെ perfect രൂപം മുമ്പ് നടന്ന സംഭവത്തെ സൂചിപ്പിക്കുന്നു. ആഖ്യാനസന്ദർഭത്തിൽ ‘സംഭവിച്ചു’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: ἵνα πληρωθῇ
  choice: നിറവേറേണ്ടതിന്
  rationale: ἵναയും passive subjunctive ആയ πληρωθῇയും ചേർന്നുള്ള ഉദ്ദേശ്യം/ഫലം എന്ന അർഥവ്യാപ്തി ഈ പ്രയോഗം നിലനിർത്തുന്നു; ദൈവിക ഉദ്ദേശ്യമോ ആഖ്യാനഫലമോ മാത്രം എന്നു തീർപ്പാക്കുന്നില്ല.
- source_word: τὸ ῥηθὲν ὑπὸ κυρίου
  choice: കർത്താവ് അരുളിച്ചെയ്തത്
  rationale: passive ആയ ‘പറയപ്പെട്ടത്’ എന്ന ഘടന മലയാളത്തിൽ കർത്താവിനെ കർത്താവാക്കി സ്വാഭാവികമായി നൽകിയിരിക്കുന്നു. ‘അരുളിച്ചെയ്തത്’ ദൈവത്തിന്റെ വചനപ്രഖ്യാപനത്തിന് യോജിച്ച dignified മലയാളമാണ്; ഗ്രീക്കിൽ ഇല്ലാത്ത ‘ദൈവം’ ചേർക്കുന്നില്ല.
- source_word: διὰ τοῦ προφήτου
  choice: പ്രവാചകനിലൂടെ
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന മധ്യസ്ഥ ഉപാധിയെ ‘-ലൂടെ’ കൃത്യമായി നൽകുന്നു; കർത്താവിനെ ആത്യന്തിക പ്രഭാഷകനായും പ്രവാചകനെ മാധ്യമമായും വേർതിരിക്കുന്നു.
- source_word: λέγοντος
  choice: 'അരുളിച്ചെയ്തത് … :'
  rationale: തുടർന്നുവരുന്ന ഉദ്ധരണിയെ പരിചയപ്പെടുത്തുന്ന participle മലയാളത്തിൽ ‘അരുളിച്ചെയ്തത്’ എന്ന വാക്യഘടനയിലും അവസാനത്തെ ദ്വിബിന്ദുവിലും സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു; ‘പറഞ്ഞുകൊണ്ട്’ എന്ന അസ്വാഭാവിക ആവർത്തനം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: പ്രവാചകവചനത്തിലെ പ്രഭാഷകത്വവും മധ്യസ്ഥതയും
  choice: ‘പ്രവാചകനിലൂടെ കർത്താവ് അരുളിച്ചെയ്തത്’
  alternative: ‘പ്രവാചകൻ കർത്താവിൽനിന്ന് പറഞ്ഞത്’
  rationale: ὑπό + genitive കർത്താവിനെ ആത്യന്തിക പ്രഭാഷകനായും διά + genitive പ്രവാചകനെ മാധ്യമമായും അവതരിപ്പിക്കുന്നു. വിവർത്തനം ഈ വ്യത്യാസം സംരക്ഷിക്കുന്നു; അതിനപ്പുറം പ്രചോദനത്തെക്കുറിച്ചുള്ള ഒരു സിദ്ധാന്തം ചേർക്കുന്നില്ല.
- issue: നിവൃത്തിസൂത്രത്തിലെ ഉദ്ദേശ്യം/ഫലം
  choice: ‘നിറവേറേണ്ടതിന്’
  alternative: ‘അങ്ങനെ നിറവേറി’
  rationale: ἵνα + subjunctive ഉദ്ദേശ്യവും ഫലവും ഉൾക്കൊള്ളാൻ കഴിയും. തിരഞ്ഞെടുത്ത രൂപം ഈ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുകയും വെറും യാന്ത്രിക ഫലമായി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. അടുത്ത വാക്യത്തിലെ ഉദ്ധരണിയിലേക്ക് നയിക്കാൻ ദ്വിബിന്ദു ഉപയോഗിച്ചു. ‘കർത്താവ്’ എന്നത് κύριος-നെയും ‘പ്രവാചകനിലൂടെ’ എന്നത് വ്യത്യസ്തമായ മധ്യസ്ഥപ്രയോഗത്തെയും സംരക്ഷിക്കുന്നു.
