  text: ശലോമോൻ രെഹബെയാമിനെ ജനിപ്പിച്ചു; രെഹബെയാം അബീയാവിനെ ജനിപ്പിച്ചു; അബീയാവ് ആസാഫിനെ[a] ജനിപ്പിച്ചു.
