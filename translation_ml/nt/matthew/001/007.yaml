lexical_decisions:
- source_word: ἐγέννησεν
  choice: ജനിപ്പിച്ചു
  rationale: പുരുഷവംശാവലിയുടെ പരമ്പര സൂചിപ്പിക്കുന്ന γεννάω എന്ന ക്രിയയ്ക്ക് സംക്ഷിപ്തവും സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളപ്രയോഗം; നേരിട്ടുള്ള പിതൃത്വത്തെയും വംശപരമ്പരയെയും ഉൾക്കൊള്ളാൻ കഴിയും.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്യാതെ അർദ്ധവിരാമത്തിലൂടെ തുടർച്ച പ്രകടമാക്കി
  rationale: ഇവിടെ δέ വിരോധസൂചകമല്ല; വംശാവലിയിലെ കണ്ണികളെ തുടർച്ചയായി ബന്ധിപ്പിക്കുന്ന മൃദുവായ സംയോജകമാണ്. ഓരോ ഘട്ടത്തിലും ‘പിന്നെ’ അല്ലെങ്കിൽ ‘എന്നാൽ’ ചേർക്കുന്നത് മലയാളത്തിൽ അനാവശ്യഭാരമാകും.
- source_word: Σολομών
  choice: ശലോമോൻ
  rationale: പഴയനിയമത്തിലെ അതേ വ്യക്തിയെ തിരിച്ചറിയാൻ സഹായിക്കുന്ന, മലയാളത്തിൽ പ്രചാരമുള്ള നാമരൂപം.
- source_word: Ῥοβοάμ
  choice: രെഹബെയാം
  rationale: പഴയനിയമത്തിലെ രാജാവുമായി പേരിന്റെ തുടർച്ച നിലനിർത്തുന്ന പ്രചാരമുള്ള മലയാളരൂപം.
- source_word: Ἀβιά
  choice: അബീയാവ്
  rationale: ഗ്രീക്ക് രൂപത്തെ മാത്രം യാന്ത്രികമായി ലിപ്യന്തരം ചെയ്യാതെ, പഴയനിയമത്തിലെ രാജനാമവുമായി വായനക്കാർക്ക് ബന്ധിപ്പിക്കാവുന്ന മലയാളരൂപം.
- source_word: Ἀσάφ
  choice: ആസാഫ്
  rationale: നൽകിയിരിക്കുന്ന SBLGNT പാഠം Ἀσάφ എന്നാണ് വായിക്കുന്നത്. അതിനാൽ പ്രതീക്ഷിക്കാവുന്ന ‘ആസാ’ എന്ന പേരിലേക്കു നിശ്ശബ്ദമായി ഒത്തുചേർക്കാതെ മുഖ്യപാഠത്തിൽ ‘ആസാഫ്’ നിലനിർത്തുന്നു.
theological_decisions:
- issue: മത്തായിയുടെ വംശാവലിയെ പഴയനിയമത്തിലെ യെഹൂദാരാജാക്കന്മാരുടെ പട്ടികയുമായി ഒത്തുചേർക്കാൻ Ἀσάφ എന്നത് ‘ആസാ’യായി വിവർത്തനം ചെയ്യണമോ
  choice: മുഖ്യപാഠത്തിൽ ‘ആസാഫ്’ നിലനിർത്തി
  alternative: ‘ആസാ’ എന്നു വായിക്കുക/വിവർത്തനം ചെയ്യുക
  rationale: നൽകിയിരിക്കുന്ന ഗ്രീക്ക് മൂലപാഠത്തിൽ Ἀσάφ എന്നാണ്. മൂലഭാഷാപാഠത്തിന് മുൻഗണന നൽകി ആ വായന സംരക്ഷിക്കുകയും, കൈയെഴുത്തുപ്രതി വ്യത്യാസവും പഴയനിയമബന്ധവും അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വംശാവലി ശൈലി. ആവർത്തനഘടന മൂലപാഠത്തിന്റെ ലയവും വംശപരമ്പരയുടെ വ്യക്തതയും നിലനിർത്തുന്നു; അർദ്ധവിരാമങ്ങൾ δέ സൂചിപ്പിക്കുന്ന മൃദുവായ തുടർച്ച മലയാളത്തിൽ ഭാരം കൂടാതെ പ്രകടമാക്കുന്നു.
