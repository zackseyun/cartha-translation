source:
  edition: SBLGNT
  text: Ἰούδας δὲ ἐγέννησεν τὸν Φαρὲς καὶ τὸν Ζάρα ἐκ τῆς Θαμάρ, Φαρὲς δὲ ἐγέννησεν τὸν Ἑσρώμ, Ἑσρὼμ δὲ ἐγέννησεν τὸν Ἀράμ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/003.yaml
  text: Judah fathered Perez and Zerah by Tamar[a], Perez fathered Hezron, and Hezron fathered Aram.
translation:
  language: ml
  text: യെഹൂദാ താമാറിൽനിന്ന് പേരെസിനെയും സേരഹിനെയും ജനിപ്പിച്ചു; പേരെസ് ഹെസ്രോനെ ജനിപ്പിച്ചു; ഹെസ്രോൻ അരാമിനെ[a] ജനിപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില വിവർത്തനങ്ങളിൽ ഇവിടെ “രാം” എന്നാണ്; അത് വ്യത്യസ്തമായ ലിപ്യന്തരണത്തെയോ പാരമ്പര്യത്തെയോ പ്രതിഫലിപ്പിക്കുന്നു. ഇവിടെ നൽകിയിരിക്കുന്ന ഗ്രീക്ക് പാഠത്തിൽ “അരാം” എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰούδας
  choice: യെഹൂദാ
  rationale: ഇവിടെ പഴയനിയമത്തിലെ ഗോത്രപിതാവിനെയാണ് സൂചിപ്പിക്കുന്നത്; പുതിയനിയമത്തിലെ യൂദാസ് എന്ന പേരുള്ളവരിൽനിന്ന് വേർതിരിച്ചറിയാനും തിരുവെഴുത്തിലുടനീളമുള്ള പേരിന്റെ തുടർച്ച നിലനിർത്താനും ‘യെഹൂദാ’ ഉപയോഗിച്ചു.
- source_word: δὲ
  choice: വാക്യഘടനയും അർധവിരാമങ്ങളുംകൊണ്ട് സൂചിപ്പിച്ചു
  rationale: വംശാവലിയുടെ തുടർച്ചയിൽ δέ ശക്തമായ വൈരുധ്യമല്ല, മൃദുവായ ബന്ധകമാണ്; മലയാളത്തിൽ ഓരോ തവണയും ‘പിന്നെ’ അല്ലെങ്കിൽ ‘എന്നാൽ’ ചേർക്കുന്നത് അസ്വാഭാവികമായതിനാൽ ക്രമവും വിരാമചിഹ്നങ്ങളുംകൊണ്ട് ബന്ധം പ്രകടമാക്കി.
- source_word: ἐγέννησεν
  choice: ജനിപ്പിച്ചു
  rationale: വംശാവലിയിൽ പിതൃത്വത്തെയും സന്തതിയുടെ ഉത്ഭവത്തെയും സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തവും മാന്യവും പരിചിതവുമായ മലയാളപ്രയോഗം.
- source_word: Φαρὲς
  choice: പേരെസ്
  rationale: എബ്രായ നാമമായ פֶּרֶץ-നോടുള്ള തിരുവെഴുത്തുപരമായ തുടർച്ച കാത്തുസൂക്ഷിക്കുന്ന ആധുനിക മലയാള ലിപ്യന്തരണം.
- source_word: Ζάρα
  choice: സേരഹ്
  rationale: എബ്രായ זֶרַח എന്ന പേരിനോടുള്ള തുടർച്ച നിലനിർത്തുന്ന മലയാളരൂപം.
- source_word: ἐκ τῆς Θαμάρ
  choice: താമാറിൽനിന്ന്
  rationale: ἐκ ഇവിടെ മാതൃവംശപരമായ ഉത്ഭവം സൂചിപ്പിക്കുന്നു; മൂലപാഠത്തിന്റെ രൂപവും താമാറിന്റെ ശ്രദ്ധേയമായ പരാമർശവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Θαμάρ
  choice: താമാർ
  rationale: മൂലനാമത്തിന്റെ വ്യക്തവും പരിചിതവുമായ മലയാള ലിപ്യന്തരണം.
- source_word: Ἑσρώμ
  choice: ഹെസ്രോൻ
  rationale: എബ്രായ חֶצְרוֹן എന്ന പഴയനിയമ നാമത്തോടുള്ള തുടർച്ച നിലനിർത്തുന്ന രൂപം.
- source_word: Ἀράμ
  choice: അരാം
  rationale: നൽകിയിരിക്കുന്ന ഗ്രീക്ക് പാഠത്തിലെ Ἀράμ നേരിട്ട് ലിപ്യന്തരിച്ചു; മറ്റൊരു വംശാവലിപാരമ്പര്യവുമായി ഒത്തുചേരാൻ ‘രാം’ എന്നു മാറ്റിയില്ല.
theological_decisions:
- issue: അവസാനത്തെ പേര് പഴയനിയമത്തിലെ പരിചിതമായ വംശാവലിരൂപവുമായി സമന്വയിപ്പിക്കണമോ
  choice: അരാം
  alternative: രാം
  rationale: നൽകിയിരിക്കുന്ന SBLGNT ഗ്രീക്ക് പാഠം Ἀράμ എന്നാണ് വായിക്കുന്നത്. അതിനാൽ മുഖ്യപാഠം മൂലഭാഷയെ പിന്തുടരുന്നു; വായനക്കാർക്ക് പരിചിതമായ ‘രാം’ എന്ന വ്യത്യസ്ത ലിപ്യന്തരണ/പാരമ്പര്യം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, വംശാവലിക്ക് യോജിച്ച സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ ശൈലി. ആവർത്തിക്കുന്ന ἐγέννησεν ഒരേ രീതിയിൽ പരിഭാഷപ്പെടുത്തി; δέ-യുടെ മൃദുവായ ബന്ധകസ്വഭാവം അർധവിരാമങ്ങളിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കി.
