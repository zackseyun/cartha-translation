  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Σαλμὼν δὲ ἐγέννησεν τὸν ⸂Βόες ἐκ τῆς Ῥαχάβ, Βόες⸃ δὲ ἐγέννησεν τὸν ⸂Ἰωβὴδ ἐκ τῆς Ῥούθ, Ἰωβὴδ⸃ δὲ ἐγέννησεν τὸν Ἰεσσαί,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/005.yaml
  text: Salmon fathered Boaz by Rahab[a], and Boaz fathered Obed by Ruth, and Obed fathered Jesse,
translation:
  language: ml
  text: സൽമോൻ രാഹാബിൽനിന്ന്[a] ബോവസിനെ ജനിപ്പിച്ചു; ബോവസ് രൂത്തിൽനിന്ന് ഓബേദിനെ ജനിപ്പിച്ചു; ഓബേദ് യിശ്ശായിയെ ജനിപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ഓരോ അമ്മയുടെ പേരോടും ἐκ (‘നിന്ന്’) എന്ന പദം ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: ജനിപ്പിച്ചു
  rationale: വംശാവലിയിൽ പുരുഷപൂർവികൻ വഴിയുള്ള ജനനത്തെയും വംശപരമ്പരയെയും സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും മാന്യവുമായ മലയാളപ്രയോഗം.
- source_word: ἐκ
  choice: -ൽനിന്ന്
  rationale: അമ്മയുടെ പേര് തുറന്നുപറഞ്ഞുകൊണ്ട് മാതൃബന്ധമോ ജനനത്തിന്റെ ഉറവിടമോ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: വാക്യക്രമവും അർധവിരാമവും
  rationale: ഇവിടെ δέ വൈരുദ്ധ്യമല്ല, വംശാവലിയിലെ മൃദുവായ തുടർച്ചയാണ്; ആവർത്തിച്ചുള്ള ‘എന്നാൽ’ ഒഴിവാക്കി മലയാളത്തിലെ ക്രമബന്ധത്തിലൂടെ അത് പ്രകടമാക്കി.
- source_word: Σαλμὼν
  choice: സൽമോൻ
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ തിരിച്ചറിയാവുന്ന പരമ്പരാഗത നാമരൂപം.
- source_word: Βόες
  choice: ബോവസ്
  rationale: പഴയനിയമത്തിലെ ഇതേ വ്യക്തിയെ തിരിച്ചറിയാൻ സഹായിക്കുന്ന സ്ഥാപിത മലയാളരൂപം.
- source_word: Ῥαχάβ
  choice: രാഹാബ്
  rationale: പഴയനിയമത്തിലെ വ്യക്തിയുമായി തുടർച്ച നിലനിർത്തുന്ന പരിചിത മലയാളരൂപം.
- source_word: Ἰωβὴδ
  choice: ഓബേദ്
  rationale: പഴയനിയമത്തിലെ പേരുമായി തിരിച്ചറിയൽ നിലനിർത്തുന്ന മലയാളരൂപം.
- source_word: Ῥούθ
  choice: രൂത്ത്
  rationale: പഴയനിയമഗ്രന്ഥത്തിലും വ്യക്തിയിലും പ്രചാരത്തിലുള്ള മലയാളരൂപം.
- source_word: Ἰεσσαί
  choice: യിശ്ശായി
  rationale: ദാവീദിന്റെ പിതാവിനുള്ള പരിചിതമായ മലയാള ബൈബിൾ നാമരൂപം.
theological_decisions:
- issue: വംശാവലിയുടെ സൂത്രവാക്യവും അമ്മമാരുടെ പരാമർശവും
  choice: ‘ജനിപ്പിച്ചു’ എന്ന പിതൃവംശാവലി പ്രയോഗത്തോടൊപ്പം ‘രാഹാബിൽനിന്ന്’, ‘രൂത്തിൽനിന്ന്’ എന്ന് അമ്മമാരെയും വ്യക്തമായി നിലനിർത്തി.
  alternative: ‘പിതാവായിരുന്നു’ എന്ന പൊതുവായ പ്രയോഗം മാത്രം ഉപയോഗിക്കുക, അല്ലെങ്കിൽ മാതൃബന്ധം പരോക്ഷമാക്കുക.
  rationale: ἐκ + അമ്മയുടെ പേര് എന്ന ശ്രദ്ധേയമായ ഗ്രീക്ക് ഘടന മായ്ച്ചുകളയാതെ, പിതൃവംശക്രമവും മാതൃബന്ധവും ഒരുപോലെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ, വംശാവലിക്ക് യോജിച്ച മാന്യവും സംക്ഷിപ്തവുമായ ശൈലി. പേരുകൾ മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപങ്ങളിൽ നൽകിയിരിക്കുന്നു.
