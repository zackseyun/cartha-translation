id: MAT.1.11
reference: Matthew 1:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἰωσίας δὲ ἐγέννησεν τὸν Ἰεχονίαν καὶ τοὺς ἀδελφοὺς αὐτοῦ ἐπὶ τῆς μετοικεσίας Βαβυλῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/011.yaml
  text: Josiah fathered Jeconiah and his brothers at the time of the deportation to Babylon[a].
translation:
  language: ml
  text: ബാബേലിലേക്കുള്ള നാടുകടത്തലിന്റെ കാലത്ത് യോശീയാവ് യെഖൊന്യാവിനും അവന്റെ സഹോദരന്മാർക്കും പിതാവായി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ബാബേലിലേക്കുള്ള പ്രവാസത്തിന്റെ കാലത്ത്.” ഗ്രീക്ക് പദത്തിന് നിർബന്ധിതമായ മാറ്റിപ്പാർപ്പിക്കലെയോ പ്രവാസത്തെയോ സൂചിപ്പിക്കാം; “നാടുകടത്തൽ” സംഭവത്തിന്റെ ബലപ്രയോഗസ്വഭാവം എടുത്തുകാട്ടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: പിതാവായി
  rationale: വംശാവലിയിൽ γεννάω പുരുഷവംശപരമ്പരയെ സൂചിപ്പിക്കുന്നു. ‘പിതാവായി’ എന്നത് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമാണ്; ഗ്രീക്കിലെ വംശാവലി സൂത്രവാക്യം അനാവശ്യമായി വിശദീകരിക്കാതെയും നിലനിർത്തുന്നു.
- source_word: Ἰεχονίαν
  choice: യെഖൊന്യാവ്
  rationale: ഗ്രീക്ക് Ἰεχονίας എന്ന പേരിന്റെ ശബ്ദരൂപത്തോട് അടുത്തുനിൽക്കുന്ന, മലയാള ബൈബിൾ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ലിപ്യന്തരണം.
- source_word: ἀδελφοὺς αὐτοῦ
  choice: അവന്റെ സഹോദരന്മാർ
  rationale: ഗ്രീക്ക് പദം പുല്ലിംഗ ബഹുവചനമാണ്; ഈ വംശാവലി സന്ദർഭത്തിൽ ‘സഹോദരന്മാർ’ ലിംഗസൂചന കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: ἐπὶ τῆς μετοικεσίας Βαβυλῶνος
  choice: ബാബേലിലേക്കുള്ള നാടുകടത്തലിന്റെ കാലത്ത്
  rationale: μετοικεσία നിർബന്ധിതമായ മാറ്റിപ്പാർപ്പിക്കൽ അഥവാ പ്രവാസം സൂചിപ്പിക്കുന്നു. ‘നാടുകടത്തൽ’ അതിന്റെ ബലപ്രയോഗസ്വഭാവം വ്യക്തമാക്കുന്നു; ἐπί + genitive ഇവിടെ സമയസൂചനയായതിനാൽ ‘കാലത്ത്’ എന്നും Βαβυλῶνος ലക്ഷ്യസ്ഥാനമായി ‘ബാബേലിലേക്ക്’ എന്നും പരിഭാഷപ്പെടുത്തി.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: വംശാവലിയിൽ ഇത് മൃദുവായ ബന്ധകമാണ്. മലയാളത്തിൽ പ്രത്യേക സമാനപദം ചേർക്കാതെ വാക്യബന്ധം സ്വാഭാവികമായി നിലനിർത്താം.
theological_decisions:
- issue: മത്തായിയുടെ വംശാവലിയിലെ തലമുറസംക്ഷേപം
  choice: ചരിത്രപരമായ ചോദ്യങ്ങൾ മുഖ്യവാചകത്തിൽ പരിഹരിക്കാൻ ശ്രമിക്കാതെ ഗ്രീക്കിൽ പ്രസ്താവിച്ചിരിക്കുന്ന വംശാവലി നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: γεννάω ഓരോ കണ്ണിയിലും ഉടനെയുള്ള ജൈവപിതൃത്വമല്ലാതെ പൂർവികബന്ധവും അനുവദിക്കുന്നതായി വ്യാഖ്യാനിക്കുക.
  rationale: മത്തായിയുടെ വംശാവലി തലമുറകൾ സംക്ഷേപിച്ചേക്കാം; എങ്കിലും പരിഭാഷ ഗ്രീക്ക് വാചകത്തെ പ്രതിഫലിപ്പിക്കണം, സമന്വയിപ്പിക്കുന്ന വിശദീകരണം അതിൽ ഇറക്കുമതി ചെയ്യരുത്. ‘പിതാവായി’ എന്നത് വംശാവലി സൂത്രം നിലനിർത്തുകയും ചരിത്രപരമായ ചർച്ച തുറന്നുവയ്ക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വംശാവലി ശൈലി. ദീർഘവും അസ്വാഭാവികവുമായ ഒറ്റവാക്യം ഒഴിവാക്കാൻ സമയപ്രയോഗം അർദ്ധവിരാമത്തിനു ശേഷം സ്വതന്ത്ര ഉപവാക്യമായി നൽകിയിരിക്കുന്നു; അർത്ഥബന്ധം മാറ്റിയിട്ടില്ല.
