  naturalness: The concise, repeated genealogy structure with semicolons is natural and suitably formal in modern standard Malayalam. ‘ജനിപ്പിച്ചു’ is an established and intelligible genealogical verb in this context.
  terminology: '‘ജനിപ്പിച്ചു’ appropriately preserves the Greek genealogical idiom without forcing a conclusion about whether every link is immediate parentage. The personal names should use closer, consistent transliterations: അസോർ, സാദോക്ക്, അഖീം, എലീയൂദ്.'
