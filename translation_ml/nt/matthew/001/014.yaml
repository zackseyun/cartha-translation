id: MAT.1.14
reference: Matthew 1:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀζὼρ δὲ ἐγέννησεν τὸν Σαδώκ, Σαδὼκ δὲ ἐγέννησεν τὸν Ἀχίμ, Ἀχὶμ δὲ ἐγέννησεν τὸν Ἐλιούδ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/014.yaml
  text: Azor fathered Zadok, Zadok fathered Achim, and Achim fathered Eliud.
translation:
  language: ml
  text: അസോർ സാദോക്കിനെ ജനിപ്പിച്ചു; സാദോക്ക് അഖീമിനെ ജനിപ്പിച്ചു; അഖീം എലീയൂദിനെ ജനിപ്പിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀζώρ
  choice: ആസോർ
  rationale: ഗ്രീക്ക് രൂപത്തിന്റെ ഉച്ചാരണത്തോട് ചേർന്നുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: δέ
  choice: ; (വാക്യഘടനയിലൂടെ ബന്ധം സൂചിപ്പിച്ചു)
  rationale: വംശാവലിയിൽ ഇത് ലളിതമായ തുടർച്ചാസൂചകമാണ്. ആവർത്തിച്ചുള്ള ‘എന്നാൽ’ അസ്വാഭാവികമായതിനാൽ അർദ്ധവിരാമവും സമാന്തര വാക്യഘടനയും ക്രമബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: ἐγέννησεν
  choice: ജനിപ്പിച്ചു
  rationale: പുരുഷവംശപരമ്പരയിലെ ജനനമോ പൂർവികബന്ധമോ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാള പ്രയോഗം; ‘പിതാവായി’ എന്നതിനെക്കാൾ ഗ്രീക്ക് ക്രിയയോട് നേരിട്ട് ചേർന്നുനിൽക്കുന്നു.
- source_word: τὸν
  choice: പ്രത്യേകമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: ഓരോ വ്യക്തിനാമത്തിനുമുമ്പുള്ള ഗ്രീക്ക് കർമസൂചക നിർദേശകപദമാണിത്; ഈ മലയാള വാക്യഘടനയിൽ വിഭക്തിപ്രത്യയം അതിന്റെ വ്യാകരണധർമ്മം വഹിക്കുന്നു.
- source_word: Σαδώκ
  choice: സാദോക്ക്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: Ἀχίμ
  choice: ആഖീം
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം; χ-യുടെ ഘർഷധ്വനി ‘ഖ’യിലൂടെ ഏകദേശമായി നിലനിർത്തുന്നു.
- source_word: Ἐλιούδ
  choice: എലീയൂദ്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
theological_decisions:
- issue: ἐγέννησεν നേരിട്ടുള്ള പിതൃത്വമോ വിശാലമായ വംശബന്ധമോ സൂചിപ്പിക്കുന്നുവോ
  choice: ‘ജനിപ്പിച്ചു’ എന്ന പരമ്പരാഗത വംശാവലി ക്രിയ ഉപയോഗിച്ച് പരിധി തുറന്നുവെച്ചു
  alternative: ‘പിതാവായിരുന്നു’ / ‘പൂർവികനായിരുന്നു’
  rationale: ഗ്രീക്ക് γεννάω വംശാവലിയിൽ നേരിട്ടുള്ള ജനനത്തെയും ചിലപ്പോൾ വിശാലമായ വംശപരമ്പരയെയും ഉൾക്കൊള്ളാം. വ്യക്തമായിട്ടില്ലാത്ത തലമുറബന്ധം വിശദീകരിച്ച് തീർക്കാതെ മൂലത്തിലെ രൂപം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ വംശാവലി ശൈലി. ആവർത്തനം മൂലപാഠത്തിന്റെ സമാന്തര ഘടന നിലനിർത്തുന്നു.
