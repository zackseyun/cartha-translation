id: MAT.1.20
reference: Matthew 1:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ταῦτα δὲ αὐτοῦ ἐνθυμηθέντος ἰδοὺ ἄγγελος κυρίου κατ’ ὄναρ ἐφάνη αὐτῷ λέγων· Ἰωσὴφ υἱὸς Δαυίδ, μὴ φοβηθῇς παραλαβεῖν ⸀Μαρίαν τὴν γυναῖκά σου, τὸ γὰρ ἐν αὐτῇ γεννηθὲν ἐκ πνεύματός ἐστιν ἁγίου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/020.yaml
  text: But as he was considering these things, behold, an angel of the Lord appeared to him in a dream, saying, “Joseph, son of David, do not be afraid to take Mary as your wife, for what has been conceived in her is from the Holy Spirit.”
translation:
  language: ml
  text: 'അവൻ ഈ കാര്യങ്ങളെക്കുറിച്ച് ആലോചിച്ചുകൊണ്ടിരിക്കുമ്പോൾ, ഇതാ, കർത്താവിന്റെ ഒരു ദൂതൻ സ്വപ്നത്തിൽ അവന് പ്രത്യക്ഷനായി പറഞ്ഞു: “ദാവീദിന്റെ മകനായ യോസേഫേ, നിന്റെ ഭാര്യയായ മറിയയെ സ്വീകരിക്കാൻ[a] ഭയപ്പെടേണ്ടാ; അവളിൽ ഉരുവായിരിക്കുന്നത് പരിശുദ്ധാത്മാവിൽനിന്നാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “മറിയയെ നിന്റെ ഭാര്യയായി സ്വീകരിക്കാൻ.” ഗ്രീക്ക് പ്രയോഗം അവളെ വിവാഹബന്ധത്തിൽ തന്റെ വീട്ടിലേക്കു സ്വീകരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνθυμηθέντος
  choice: ആലോചിച്ചുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: യോസേഫിന്റെ ഉള്ളിലുള്ള തുടരുന്ന പരിചിന്തനത്തെ സൂചിപ്പിക്കുന്നു; തീരുമാനം എടുത്തുകഴിഞ്ഞുവെന്ന അർഥം വരുത്തുന്നില്ല.
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: കഥയിൽ പെട്ടെന്നുള്ള ശ്രദ്ധാകേന്ദ്രമാറ്റവും സജീവതയും നൽകുന്ന ഗ്രീക്ക് വ്യവഹാരസൂചകം നിലനിർത്തുന്നു.
- source_word: ἄγγελος κυρίου
  choice: കർത്താവിന്റെ ഒരു ദൂതൻ
  rationale: ἄγγελος അനിർദ്ദിഷ്ടമായതിനാൽ ‘ഒരു ദൂതൻ’ എന്നു നൽകി; പഴയനിയമത്തിലെ പ്രത്യേക ‘കർത്താവിന്റെ ദൂതൻ’ എന്ന തിരിച്ചറിയൽ അനാവശ്യമായി നിർബന്ധിക്കുന്നില്ല.
- source_word: κατ’ ὄναρ
  choice: സ്വപ്നത്തിൽ
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളരൂപം.
- source_word: υἱὸς Δαυίδ
  choice: ദാവീദിന്റെ മകനായ
  rationale: ദാവീദീയ വംശബന്ധവും അതിന്റെ മിശിഹാ-സംബന്ധിയായ അനുരണനവും നിലനിർത്തുന്നു; സംബോധനയിൽ സ്വാഭാവികതയ്ക്കായി ‘മകനായ’ ഉപയോഗിച്ചു.
- source_word: μὴ φοβηθῇς
  choice: ഭയപ്പെടേണ്ടാ
  rationale: വിലക്കിനെയും ഭയത്തിന്റെ മാനസികഭാവത്തെയും സ്വാഭാവിക ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: παραλαβεῖν Μαρίαν τὴν γυναῖκά σου
  choice: മറിയയെ നിന്റെ ഭാര്യയായി സ്വീകരിക്കാൻ
  rationale: മറിയയെ വിവാഹജീവിതത്തിൽ തന്റെ വീട്ടിലേക്കു സ്വീകരിക്കുന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു; γυνήയുടെ സന്ദർഭോചിതമായ അർഥം ‘ഭാര്യ’യാണ്.
- source_word: τὸ ἐν αὐτῇ γεννηθὲν
  choice: അവളിൽ ഉരുവായിരിക്കുന്നത്
  rationale: നപുംസകലിംഗ substantival participle-ന്റെ ‘അവളിൽ ഉണ്ടായത്’ എന്ന തുറന്ന ഘടന നിലനിർത്തുന്നു; ‘ശിശു’ എന്ന് മൂലത്തിൽ ഇല്ലാത്ത നാമം ചേർക്കുന്നില്ല.
- source_word: ἐκ πνεύματός ἐστιν ἁγίου
  choice: പരിശുദ്ധാത്മാവിൽനിന്നാണ്
  rationale: ἐκ സൂചിപ്പിക്കുന്ന ഉറവിടം വ്യക്തമായി നൽകുന്നു; ‘പരിശുദ്ധാത്മാവ്’ ദൈവിക വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ മലയാളപ്രയോഗമാണ്.
theological_decisions:
- issue: ἄγγελος κυρίου എന്നതിലെ κυρίου
  choice: കർത്താവിന്റെ
  alternative: യഹോവയുടെ / കർത്താവായ ദൈവത്തിന്റെ
  rationale: κύριος എന്ന പദത്തെ നേരിട്ട് ‘കർത്താവ്’ എന്നു നൽകുന്നു; ഒരു പ്രത്യേക പഴയനിയമ ദൈവപ്രത്യക്ഷീകരണമെന്ന വ്യാഖ്യാനം വാക്യത്തിൽ ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: πνεύματός ... ἁγίου എന്നതിന്റെ സൂചന
  choice: പരിശുദ്ധാത്മാവ്
  alternative: പരിശുദ്ധമായ ഒരു ആത്മാവ് / പരിശുദ്ധാത്മാവിന്റെ ശക്തി
  rationale: മത്തായിയുടെ ജനനവിവരണസന്ദർഭത്തിൽ ദൈവിക ഉറവിടത്തെ വ്യക്തിപരമായ നാമനിർദ്ദേശത്തോടെ സൂചിപ്പിക്കുന്നു; അതിനെ വെറും ശക്തിയാക്കി ചുരുക്കുന്നില്ല.
- issue: മറിയയുടെ വിവാഹസ്ഥിതി
  choice: നിന്റെ ഭാര്യയായി സ്വീകരിക്കാൻ
  alternative: നിന്റെ ഭാര്യയായ മറിയയെ സ്വീകരിക്കാൻ
  rationale: παραλαμβάνωയുടെ വിവാഹഗൃഹത്തിലേക്കുള്ള സ്വീകരണം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു. എന്നാൽ ഈ രൂപം പുതിയൊരു വിവാഹച്ചടങ്ങ് നിർബന്ധമായി സൂചിപ്പിക്കുന്നതായി വായിക്കാതിരിക്കാനായി അടിക്കുറിപ്പിൽ കൂടുതൽ അക്ഷരാർഥപരമായ സാധ്യത നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ ശൈലി. ‘ഇതാ’ എന്ന അല്പം ഉന്നതമായ കഥാസൂചകം മൂലത്തിന്റെ സജീവതയ്ക്കായി നിലനിർത്തി; ബാക്കി വാക്യഘടന സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാക്കി.
