revisions:
- from: യിശ്ശായി ദാവീദ് രാജാവിന്റെ പിതാവായി. ദാവീദ് ഊരീയാവിന്റെ ഭാര്യയിൽ ശലോമോന്റെ പിതാവായി.[a]
  to: യിശ്ശായി രാജാവായ ദാവീദിനെ ജനിപ്പിച്ചു. ദാവീദ് ഊരീയാവിന്റെ ഭാര്യയിൽനിന്ന് ശലോമോനെ ജനിപ്പിച്ചു.[a]
  rationale: The revision renders each occurrence of ἐγέννησεν with the direct active genealogical expression ‘ജനിപ്പിച്ചു,’ while retaining David's explicit royal designation and Matthew's elliptical, indirect reference to the woman as Uriah's wife. The footnote remains anchored to that elliptical expression and explains it without adding Bathsheba's name to the translation.
