translation:
  language: ml
  text: യിശ്ശായി രാജാവായ ദാവീദിനെ ജനിപ്പിച്ചു. ദാവീദ് ഊരീയാവിന്റെ ഭാര്യയിൽനിന്ന് ശലോമോനെ ജനിപ്പിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ, ‘ഊരീയാവിന്റെ [സ്ത്രീ]യിൽനിന്ന്.’ ഇത് ‘ഊരീയാവിന്റെ ഭാര്യയിൽനിന്ന്’ എന്നർഥമുള്ള അപൂർണ്ണപ്രയോഗമാണ്. മത്തായി ഇവിടെ ബത്‌ശേബയുടെ പേര് പറയുന്നില്ല.
