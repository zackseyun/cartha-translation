lexical_decisions:
- source_word: ἐγέννησεν
  choice: പിതാവായി
  rationale: വംശാവലിയുടെ പശ്ചാത്തലത്തിൽ γεννάω പുരുഷവംശത്തിലൂടെയുള്ള ജനനബന്ധത്തെ സൂചിപ്പിക്കുന്നു. ‘പിതാവായി’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമാണ്; പഴഞ്ചനായ ‘ജനിപ്പിച്ചു’ എന്ന പ്രയോഗത്തിന്റെ അസ്വാഭാവികത ഒഴിവാക്കുന്നു.
- source_word: τὸν Δαυὶδ τὸν βασιλέα
  choice: ദാവീദ് രാജാവിന്റെ
  rationale: നിർദ്ദിഷ്ടപദത്തോടെയുള്ള βασιλέα ദാവീദിന്റെ രാജപദവിയെ എടുത്തുകാട്ടുന്നു. ‘ദാവീദ് രാജാവ്’ എന്ന മലയാളപ്രയോഗം ഈ തിരിച്ചറിയൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἐκ τῆς τοῦ Οὐρίου
  choice: ഊരീയാവിന്റെ ഭാര്യയിൽ
  rationale: ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘ഊരീയാവിന്റെ [സ്ത്രീ]യിൽനിന്ന്’ എന്ന അപൂർണ്ണപ്രയോഗമാണ്; ‘ഭാര്യ’ അധ്യാഹരിച്ചിരിക്കുന്നു. ‘ഊരീയാവിന്റെ ഭാര്യയിൽ’ എന്നത് ബത്‌ശേബയുടെ പേര് ചേർക്കാതെ, ഊരീയാവുമായുള്ള ബന്ധത്തിലൂടെ അവളെ തിരിച്ചറിയിക്കുന്ന മൂലപാഠത്തിന്റെ രീതി കാക്കുന്നു.
- source_word: Ἰεσσαὶ
  choice: യിശ്ശായി
  rationale: മലയാള ബൈബിൾപ്രയോഗത്തിൽ പരിചിതമായ പേരുരൂപം.
- source_word: Δαυὶδ
  choice: ദാവീദ്
  rationale: മലയാളത്തിൽ സ്ഥാപിതമായ പേരുരൂപം.
- source_word: Σολομῶνα
  choice: ശലോമോൻ
  rationale: മലയാളത്തിൽ പരിചിതവും മൂലരൂപത്തോട് അടുത്തതുമായ പേരുരൂപം.
- source_word: Οὐρίου
  choice: ഊരീയാവ്
  rationale: മലയാളത്തിൽ സ്ഥാപിതമായ പേരുരൂപം; വിഭക്തിരൂപത്തിൽ ‘ഊരീയാവിന്റെ’.
- source_word: δέ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: ഇവിടെ δέ വംശാവലിയുടെ കണ്ണികളെ മൃദുവായി ബന്ധിപ്പിക്കുന്നു. മലയാളത്തിൽ ഓരോ വാക്യത്തിലും ‘എന്നാൽ/പിന്നെ’ ചേർക്കുന്നത് അനാവശ്യമായ അർഥഭാരം നൽകുന്നതിനാൽ വാക്യക്രമത്തിലൂടെ ബന്ധം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ബത്‌ശേബയെ മത്തായി പരോക്ഷമായി പരാമർശിക്കുന്നത്
  choice: ‘ഊരീയാവിന്റെ ഭാര്യയിൽ’ എന്ന പരോക്ഷ തിരിച്ചറിയൽ നിലനിർത്തി.
  alternative: ‘ബത്‌ശേബയിൽ’ അല്ലെങ്കിൽ ‘മുമ്പ് ഊരീയാവിന്റെ ഭാര്യയായിരുന്നവളിൽ’
  rationale: മൂലപാഠം സ്ത്രീയുടെ പേര് പറയാതെ ഊരീയാവുമായുള്ള ബന്ധത്തിലൂടെയാണ് അവളെ തിരിച്ചറിയിക്കുന്നത്. 2 ശമൂവേലിലെ സംഭവത്തിന്റെ സാഹിത്യപരവും ധാർമികവുമായ പ്രതിധ്വനി മായ്ച്ചുകളയാതിരിക്കാൻ ഈ രൂപം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വംശാവലി ശൈലി. ‘പിതാവായി’ എന്ന ആവർത്തനം മൂലപാഠത്തിലെ വംശബന്ധം വ്യക്തമായി സൂക്ഷിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം വിശദീകരിക്കപ്പെടുന്ന പരോക്ഷപ്രയോഗത്തിന് പിന്നാലെ നൽകിയിരിക്കുന്നു.
