id: MAT.1.15
reference: Matthew 1:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐλιοὺδ δὲ ἐγέννησεν τὸν Ἐλεάζαρ, Ἐλεάζαρ δὲ ἐγέννησεν τὸν Ματθάν, Ματθὰν δὲ ἐγέννησεν τὸν Ἰακώβ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/015.yaml
  text: Eliud fathered Eleazar, and Eleazar fathered Matthan, and Matthan fathered Jacob.
translation:
  language: ml
  text: എലീഹൂദ് എലെയാസാരെ ജനിപ്പിച്ചു; എലെയാസാർ മത്താനെ ജനിപ്പിച്ചു; മത്താൻ യാക്കോബിനെ ജനിപ്പിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλιοὺδ
  choice: എലീഹൂദ്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ ഉച്ചാരണം മലയാളലിപിയിൽ സ്വാഭാവികമായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: δὲ
  choice: വാക്യഘടനയിലും അർദ്ധവിരാമത്തിലും ഉൾപ്പെടുത്തി
  rationale: വംശാവലിയുടെ തുടർച്ച സൂചിപ്പിക്കുന്ന മൃദുവായ ബന്ധകമാണിത്. ഓരോ ഘടകത്തിലും ‘പിന്നെ’ അല്ലെങ്കിൽ ‘എന്നാൽ’ എന്നു ചേർക്കുന്നത് മലയാളത്തിൽ അനാവശ്യമായി ഭാരമുള്ളതിനാൽ തുടർച്ചയായ സമാന്തര ഘടനയിലൂടെ അർത്ഥം നിലനിർത്തി.
- source_word: ἐγέννησεν
  choice: പിതാവായി
  rationale: വംശാവലിയിൽ പുരുഷവംശബന്ധം സൂചിപ്പിക്കുന്നു. ‘ജനിപ്പിച്ചു’ എന്നത് നേരിട്ടുള്ള ജൈവപിതൃത്വത്തിന് കൂടുതൽ ഊന്നൽ നൽകാം; ‘പിതാവായി’ ആധുനികവും മാന്യവും വംശാവലി സന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: τὸν
  choice: പ്രത്യേകമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഓരോ വ്യക്തിനാമത്തെയും നേരിട്ടുള്ള കർമമായി അടയാളപ്പെടുത്തുന്ന ഗ്രീക്ക് നിർദേശകപദം മലയാളത്തിൽ പ്രത്യേകം പ്രതിഫലിപ്പിക്കേണ്ടതില്ല.
- source_word: Ἐλεάζαρ
  choice: എലെയാസാർ
  rationale: ഗ്രീക്ക് വ്യക്തിനാമം മലയാളത്തിൽ വായിക്കാൻ സ്വാഭാവികമായ രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: Ματθάν
  choice: മത്താൻ
  rationale: ഗ്രീക്ക് വ്യക്തിനാമം മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു; അവസാന ദീർഘസ്വരം നിലനിർത്തി.
- source_word: Ἰακώβ
  choice: യാക്കോബ്
  rationale: ഗ്രീക്ക് രൂപത്തെ അടിസ്ഥാനമാക്കി, മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ പേരുരൂപം സ്വീകരിച്ചു.
theological_decisions:
- issue: ἐγέννησεν എന്ന പദം നേരിട്ടുള്ള ജനനം മാത്രമോ വിശാലമായ വംശബന്ധമോ സൂചിപ്പിക്കുന്നുവെന്ന ചോദ്യം
  choice: പിതാവായി
  alternative: ജനിപ്പിച്ചു
  rationale: വംശാവലികളിൽ γεννάω നേരിട്ടുള്ള പിതൃത്വം സൂചിപ്പിക്കാമെങ്കിലും തലമുറകളുടെ വംശബന്ധവും ഉൾക്കൊള്ളാൻ കഴിയും. ‘പിതാവായി’ ഈ സാധ്യതയെ അനാവശ്യമായി ചുരുക്കാതെ ബന്ധം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലി ശൈലി. ആവർത്തനഘടന നിലനിർത്തി; ഗ്രീക്കിലെ δέ-കളുടെ തുടർച്ച അർദ്ധവിരാമങ്ങളിലൂടെ സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
