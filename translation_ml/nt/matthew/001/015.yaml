    issue: «പിതാവായി» undertranslates ἐγέννησεν.
    rationale: It states a resulting paternal status rather than the active relation to the named son expressed by the Greek verb and its accusative object. «ജനിപ്പിച്ചു» retains the active genealogical assertion.
  revised_text: എലീഹൂദ് എലെയാസാരെ ജനിപ്പിച്ചു; എലെയാസാർ മത്താനെ ജനിപ്പിച്ചു; മത്താൻ യാക്കോബിനെ ജനിപ്പിച്ചു.
