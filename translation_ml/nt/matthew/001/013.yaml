id: MAT.1.13
reference: Matthew 1:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ζοροβαβὲλ δὲ ἐγέννησεν τὸν Ἀβιούδ, Ἀβιοὺδ δὲ ἐγέννησεν τὸν Ἐλιακίμ, Ἐλιακὶμ δὲ ἐγέννησεν τὸν Ἀζώρ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/013.yaml
  text: Zerubbabel fathered Abiud[a], Abiud fathered Eliakim, and Eliakim fathered Azor.
translation:
  language: ml
  text: സെരൂബ്ബാബേൽ അബീഹൂദിനെ ജനിപ്പിച്ചു[a]; അബീഹൂദ് എല്യാക്കീമിനെ ജനിപ്പിച്ചു; എല്യാക്കീം ആസോരിനെ ജനിപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പിതാവായി.’ ബൈബിൾ വംശാവലികളിൽ ആവർത്തിക്കുന്ന ഈ ക്രിയ ചിലപ്പോൾ ഇടയിലുള്ള തലമുറകളെ പറയാതെ വംശബന്ധം ചുരുക്കി അവതരിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ζοροβαβέλ
  choice: സെരുബ്ബാബേൽ
  rationale: പേരിന്റെ ഗ്രീക്ക് രൂപത്തിന് പിന്നിലുള്ള പരിചിതമായ സെരുബ്ബാബേൽ എന്ന ബൈബിൾനാമരൂപം സ്വീകരിച്ചു.
- source_word: δέ
  choice: — / തുടർന്ന് വരുന്ന വാക്യക്രമം
  rationale: ഇവിടെ δέ ശക്തമായ വിരോധമല്ല, വംശാവലിയുടെ തുടർച്ച സൂചിപ്പിക്കുന്ന മൃദുവായ ബന്ധകമാണ്; മലയാളത്തിൽ ഓരോ ഘട്ടത്തിലും പ്രത്യേക ബന്ധപദം ചേർക്കാതെ അർദ്ധവിരാമങ്ങളിലൂടെ ആ പ്രവാഹം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἐγέννησεν
  choice: ജനിപ്പിച്ചു
  rationale: പുരുഷവംശാവലിയിലെ ആവർത്തിത ക്രിയയെ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നേരിട്ട് അവതരിപ്പിക്കുന്നു; ഇത് എല്ലാ കണ്ണികളും നിർബന്ധമായി തൊട്ടടുത്ത തലമുറകളാണെന്ന് പ്രത്യേകം തീർപ്പാക്കുന്നില്ല.
- source_word: Ἀβιούδ
  choice: അബീഹൂദ്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന, മലയാളത്തിൽ വായിക്കാൻ സ്വാഭാവികമായ ലിപ്യന്തരണം.
- source_word: Ἐλιακίμ
  choice: എല്യാക്കീം
  rationale: ഗ്രീക്ക് രൂപവും പരിചിതമായ സെമിറ്റിക് പേരുരൂപവും മാനിക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: Ἀζώρ
  choice: ആസോർ
  rationale: ഗ്രീക്ക് Ἀζώρ എന്ന വ്യക്തിനാമത്തെ സ്വാഭാവിക മലയാള ഉച്ചാരണത്തിൽ ലിപ്യന്തരിച്ചു.
theological_decisions:
- issue: തലമുറകൾ ചുരുക്കി അവതരിപ്പിക്കാവുന്ന വംശാവലിയിൽ γεννάω എന്ന ക്രിയയുടെ വിവർത്തനം
  choice: ജനിപ്പിച്ചു
  alternative: പിതാവായി / പൂർവികനായിരുന്നു
  rationale: മത്തായിയുടെ ആവർത്തിത വംശാവലി ശൈലി നേരിട്ട് നിലനിർത്താൻ ‘ജനിപ്പിച്ചു’ സ്വീകരിച്ചു. ‘പൂർവികനായിരുന്നു’ എന്നത് തലമുറകളുടെ ചുരുക്കത്തെ മുഖ്യവാചകത്തിൽ തന്നെ വ്യാഖ്യാനിച്ചുതീർക്കും; ‘പിതാവായി’ സാധ്യമായിരുന്നാലും ഗ്രീക്കിലെ സജീവക്രിയയുടെ നേരിട്ടുള്ള ഭാവം കുറയ്ക്കും. സാധ്യതയുള്ള വംശാവലി-ചുരുക്കം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ വംശാവലി ശൈലി. ആവർത്തനം മൂലപാഠത്തിന്റെ സൂത്രബദ്ധമായ ഘടനയായി നിലനിർത്തി; അർത്ഥത്തിന് ആവശ്യമില്ലാത്ത ബന്ധകങ്ങൾ ചേർത്തിട്ടില്ല.
