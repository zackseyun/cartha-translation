id: MAT.1.25
reference: Matthew 1:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ οὐκ ἐγίνωσκεν αὐτὴν ἕως οὗ ἔτεκεν ⸀υἱόν· καὶ ἐκάλεσεν τὸ ὄνομα αὐτοῦ Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/025.yaml
  text: And he did not know her until she gave birth to a son[c][b][a], and he called his name Jesus.
translation:
  language: ml
  text: അവൾ ഒരു മകനെ പ്രസവിക്കുന്നതുവരെ അവൻ അവളെ അറിഞ്ഞില്ല[a][b]. അവൻ അവന് യേശു എന്നു പേരിട്ടു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ വ്യക്തമായി: ‘അവൻ അവളുമായി ദാമ്പത്യബന്ധത്തിൽ ഏർപ്പെട്ടില്ല.’ ഗ്രീക്കിൽ ‘അവളെ അറിഞ്ഞില്ല’ എന്നാണ്; ഇവിടെ ‘അറിയുക’ എന്നത് ലൈംഗികബന്ധത്തിനുള്ള ഒരു സൗമ്യപ്രയോഗമാണ്.'
    reason: lexical_alternative
  - marker: b
    text: ‘വരെ’ എന്നത് യേശുവിന്റെ ജനനംവരെ എന്തായിരുന്നു സത്യം എന്നു വ്യക്തമാക്കുന്നു; അതിനുശേഷം എന്തു സംഭവിച്ചു എന്നത് ഈ പദം തനിയെ തീർപ്പാക്കുന്നില്ല.
    reason: alternative_reading
  - marker: c
    text: 'കൂടുതൽ പദാനുപദമായി: ‘അവൻ അവന്റെ പേര് യേശു എന്നു വിളിച്ചു.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγίνωσκεν
  choice: അറിഞ്ഞില്ല
  rationale: ഈ സന്ദർഭത്തിൽ γινώσκω ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന ഒരു സൗമ്യപ്രയോഗമാണ്. ‘അറിഞ്ഞില്ല’ എന്നത് ഗ്രീക്ക് പ്രയോഗത്തിന്റെ രൂപവും സൂചനയും നിലനിർത്തുന്നു; വ്യക്തമായ അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἕως οὗ
  choice: പ്രസവിക്കുന്നതുവരെ
  rationale: ജനനസംഭവം വരെയുള്ള കാലപരിധി സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; അതിനുശേഷം എന്തു സംഭവിച്ചു എന്നതിനെക്കുറിച്ച് ഈ പ്രയോഗം തനിയെ ഒരു നിഗമനവും നിർബന്ധിക്കുന്നില്ല.
- source_word: ἔτεκεν
  choice: പ്രസവിച്ചു
  rationale: τίκτω എന്ന ക്രിയയ്ക്ക് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ തത്തുല്യം.
- source_word: υἱόν
  choice: ഒരു മകനെ
  rationale: നിശ്ചയാർഥക ഉപപദമില്ലാത്ത υἱόν ഇവിടെ അനിശ്ചിതമായി ഗ്രഹിക്കുന്നത് സ്വാഭാവികമാണ്; മൂലത്തിൽ ഇല്ലാത്ത ഊന്നൽ ചേർക്കുന്നില്ല.
- source_word: ἐκάλεσεν τὸ ὄνομα αὐτοῦ Ἰησοῦν
  choice: അവന് യേശു എന്നു പേരിട്ടു
  rationale: സെമിറ്റിക് സ്വാധീനമുള്ള ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു. കൂടുതൽ പദാനുപദമായ രൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: Ἰησοῦν
  choice: യേശു
  rationale: പുതിയ നിയമത്തിലെ ഈ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ സ്ഥാപിതരൂപം ‘യേശു’ എന്നാണ്.
theological_decisions:
- issue: ‘വരെ’ എന്ന പ്രയോഗം മറിയയുടെ പിന്നീടുള്ള കന്യകാത്വത്തെക്കുറിച്ച് എന്ത് സൂചിപ്പിക്കുന്നു
  choice: ἕως οὗ എന്നത് ‘വരെ’ എന്നു മാത്രം പരിഭാഷപ്പെടുത്തി, അതിനുശേഷം ദാമ്പത്യബന്ധം ഉണ്ടായെന്നോ ഉണ്ടായില്ലെന്നോ സൂചിപ്പിക്കാതിരിക്കുന്നു.
  alternative: ചിലർ അതിനുശേഷം സാധാരണ ദാമ്പത്യബന്ധം ആരംഭിച്ചുവെന്ന് അനുമാനിക്കുന്നു; മറ്റുചിലർ ഈ വാക്യഭാഗം പിന്നീടൊരു മാറ്റമുണ്ടായെന്ന് സൂചിപ്പിക്കുന്നില്ലെന്ന് വാദിക്കുന്നു.
  rationale: ഗ്രീക്ക് പ്രയോഗം യേശുവിന്റെ ജനനം വരെയുള്ള അവസ്ഥ വ്യക്തമാക്കുന്നു; അതിനുശേഷമുള്ള കാര്യത്തെ അത് തനിയെ തീർപ്പാക്കുന്നില്ല. അതിനാൽ മതവിഭാഗപരമായ നിഗമനം വിവർത്തനത്തിലേക്ക് കൊണ്ടുവരാതെ യഥാർഥമായ വ്യാഖ്യാനസമ്മർദം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘അറിഞ്ഞില്ല’ എന്ന മൂലഭാഷാ സൗമ്യപ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തി അതിന്റെ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കിയിരിക്കുന്നു; പേരിടൽപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമാക്കി.
