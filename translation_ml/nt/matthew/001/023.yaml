id: MAT.1.23
reference: Matthew 1:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἰδοὺ ἡ παρθένος ἐν γαστρὶ ἕξει καὶ τέξεται υἱόν, καὶ καλέσουσιν τὸ ὄνομα αὐτοῦ Ἐμμανουήλ· ὅ ἐστιν μεθερμηνευόμενον Μεθ’ ἡμῶν ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/023.yaml
  text: Behold[a], the virgin will conceive and bear a son, and they will call his name Immanuel—which is translated[d][c][b], 'God with us.'
translation:
  language: ml
  text: “ഇതാ, കന്യക[a] ഗർഭം ധരിക്കും; ഒരു മകനെ പ്രസവിക്കും; അവർ[b] അവന് ഇമ്മാനുവേൽ[c] എന്നു പേരിടും; അതിന്റെ അർഥം, ‘ദൈവം നമ്മോടുകൂടെ’ എന്നാണ്.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “യുവതി.” എന്നാൽ മത്തായിയുടെ ഈ സന്ദർഭത്തിൽ ഗ്രീക്ക് παρθένος എന്ന പദവും ചുറ്റുമുള്ള ജനനവിവരണവും “കന്യക” എന്ന പരിഭാഷയെ പിന്തുണയ്ക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ അക്ഷരാർഥം “അവർ പേരിടും”; ആരെയാണ് സൂചിപ്പ Jennings?
    reason: lexical_alternative
  - marker: c
    text: ഈ പേര് “എമ്മാനുവേൽ” എന്നും ലിപ്യന്തരം ചെയ്യപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: ഇതാ
  rationale: പ്രവചനോചിതമായ ശ്രദ്ധക്ഷണവും ഗൗരവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἡ παρθένος
  choice: കന്യക
  rationale: മത്തായിയുടെ ഗ്രീക്കിലും സമീപ ജനനവിവരണത്തിലും കന്യകയെയാണ് സൂചിപ്പിക്കുന്നത്; യെശയ്യാവ് 7:14-ന്റെ ഗ്രീക്ക് ഉദ്ധരണിയോടും ഇത് യോജിക്കുന്നു.
- source_word: ἐν γαστρὶ ἕξει
  choice: ഗർഭം ധരിച്ച്
  rationale: അക്ഷരാർഥമായ ‘ഗർഭത്തിൽ ഉണ്ടായിരിക്കും’ എന്ന പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള സമാനത; തുടർന്നുള്ള ഭാവികാലക്രിയയുമായി ചേർന്ന് പ്രവചനത്തിന്റെ ഭാവിയർഥം വ്യക്തമാക്കുന്നു.
- source_word: τέξεται υἱόν
  choice: ഒരു മകനെ പ്രസവിക്കും
  rationale: പ്രസവത്തെ സൂചിപ്പിക്കുന്ന ക്രിയയും υἱόν എന്ന പദവും നേരായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: καλέσουσιν τὸ ὄνομα αὐτοῦ
  choice: അവർ അവന് … എന്നു പേരിടും
  rationale: ഗ്രീക്കിലെ അനിശ്ചിത മൂന്നാംപുരുഷ ബഹുവചനം കർമണിപ്രയോഗമാക്കാതെ നിലനിർത്തുന്നു.
- source_word: Ἐμμανουήλ
  choice: ഇമ്മാനുവേൽ
  rationale: ഗ്രീക്ക് നാമത്തിന്റെ മലയാള ലിപ്യന്തരണം; അതിനു പിന്നാലെ വാക്യം തന്നെ നൽകുന്ന അർഥവും നിലനിർത്തുന്നു.
- source_word: ὅ ἐστιν μεθερμηνευόμενον
  choice: അതിന്റെ പരിഭാഷ … എന്നാണ്
  rationale: പേരിന്റെ അർഥവിവരണം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ഗ്രീക്ക് പങ്കുപദത്തിന്റെ വിവർത്തനസൂചന സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: Μεθ’ ἡμῶν ὁ θεός
  choice: ദൈവം നമ്മോടുകൂടെ
  rationale: നാമത്തിനു വാക്യം നൽകുന്ന വ്യാഖ്യാനം അധിക ദൈവശാസ്ത്രപരമായ വികസനം കൂടാതെ വ്യക്തമായി പകരുന്നു.
theological_decisions:
- issue: παρθένος എന്ന പദവും കന്യകാഗർഭധാരണത്തിന്റെ പശ്ചാത്തലവും
  choice: കന്യക
  alternative: യുവതി
  rationale: മത്തായി 1-ലെ അത്ഭുതകരമായ ഗർഭധാരണത്തിന്റെ പശ്ചാത്തലത്തിലും ഗ്രീക്ക് παρθένος എന്ന പദത്തിന്റെ സാധാരണ അർഥത്തിലും ‘കന്യക’യാണ് മുഖ്യപാഠത്തിന് ഏറ്റവും യോജിച്ചത്. യെശയ്യാവ് 7:14-നെ സംബന്ധിച്ച വിശാലമായ പദചർച്ച കണക്കിലെടുത്ത് മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
- issue: ഇമ്മാനുവേൽ എന്ന പേരിന്റെ അർഥം
  choice: ദൈവം നമ്മോടുകൂടെ
  alternative: നമ്മോടുകൂടെ ദൈവം
  rationale: വാക്യം തന്നെ നൽകുന്ന നാമവ്യാഖ്യാനം മാത്രം നിലനിർത്തുന്നു; അവതാരത്തെക്കുറിച്ചുള്ള വിപുലീകരിച്ച വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
- issue: καλέσουσιν എന്ന അനിശ്ചിത ബഹുവചനം
  choice: അവർ … പേരിടും
  alternative: അവന് … എന്നു പേരിടപ്പെടും
  rationale: കർത്താവ് ആരെന്നത് വ്യക്തമാക്കാത്ത ഗ്രീക്ക് ബഹുവചനം സംരക്ഷിക്കുന്നു; കർമണിരൂപത്തിലാക്കി സൂക്ഷ്മത ഇല്ലാതാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കുമ്പോഴും പ്രവചനോചിതമായ ഗൗരവം നിലനിർത്തി. ഉദ്ധരണിയുടെ ഘടനയും അനിശ്ചിത ബഹുവചനവും സംരക്ഷിച്ചു; അനാവശ്യമായ സഭാപാരമ്പര്യ പദപ്രയോഗങ്ങളോ ദൈവശാസ്ത്ര വിപുലീകരണങ്ങളോ ചേർത്തിട്ടില്ല.
