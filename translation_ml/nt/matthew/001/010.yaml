id: MAT.1.10
reference: Matthew 1:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἑζεκίας δὲ ἐγέννησεν τὸν Μανασσῆ, Μανασσῆς δὲ ἐγέννησεν τὸν ⸂Ἀμώς, Ἀμὼς⸃ δὲ ἐγέννησεν τὸν Ἰωσίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/010.yaml
  text: Hezekiah fathered Manasseh[a], Manasseh fathered Amos, and Amos fathered Josiah.
translation:
  language: ml
  text: ഹിസ്കീയാവ് മനശ്ശെയെ ജനിപ്പിച്ചു; മനശ്ശെ ആമോസിനെ[a] ജനിപ്പിച്ചു; ആമോസ് യോശീയാവിനെ ജനിപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില പരിഭാഷകൾ ഇവിടെ “ആമോൻ” എന്നു വായിക്കുന്നു; അങ്ങനെ 2 രാജാക്കന്മാർ 21-ൽ പറയുന്ന യൂദാരാജാവിന്റെ പേരുമായി ഇതിനെ യോജിപ്പിക്കുന്നു. എന്നാൽ മത്തായിയുടെ ഗ്രീക്ക് പാഠത്തിൽ “ആമോസ്” എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγέννησεν
  choice: ജനിപ്പിച്ചു
  rationale: വംശാവലിയുടെ സന്ദർഭത്തിൽ പുരുഷവംശജനനത്തെയും പിതൃബന്ധത്തെയും സൂചിപ്പിക്കുന്ന പദമാണിത്. ‘ജനിപ്പിച്ചു’ സംക്ഷിപ്തവും ആധുനിക മലയാളത്തിൽ ഗ്രാഹ്യവും മൂലവാക്യത്തിന്റെ ആവർത്തനഘടന നിലനിർത്തുന്നതുമാണ്.
- source_word: Ἑζεκίας
  choice: ഹിസ്കീയാവ്
  rationale: യൂദാരാജാവിന്റെ പേരിന് മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ രൂപം സ്വീകരിച്ചു.
- source_word: Μανασσῆς
  choice: മനശ്ശെ
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പരിചിതമായ ബൈബിൾരൂപം സ്വീകരിച്ചു.
- source_word: Ἀμώς
  choice: ആമോസ്
  rationale: SBLGNTയിലെ ഗ്രീക്ക് പാഠം Ἀμώς എന്നാണ്; അതിനാൽ പഴയനിയമത്തിലെ രാജാവിന്റെ പേരുമായി യോജിപ്പിച്ച് ‘ആമോൻ’ എന്നു മാറ്റാതെ മൂലപാഠത്തിലെ രൂപം നേരിട്ട് ലിപ്യന്തരിച്ചു.
- source_word: Ἰωσίας
  choice: യോശീയാവ്
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പരിചിതമായ ബൈബിൾരൂപം സ്വീകരിച്ചു.
- source_word: δέ
  choice: അർധവിരാമംകൊണ്ട് ബന്ധിപ്പിച്ചു
  rationale: ആവർത്തിക്കുന്ന വംശാവലിയിൽ δέ പട്ടിക മുന്നോട്ടുകൊണ്ടുപോകുന്ന ലളിതമായ ബന്ധകമാണ്. മലയാളത്തിൽ ഓരോ തവണയും ‘എന്നിട്ട്’ അല്ലെങ്കിൽ ‘കൂടാതെ’ ചേർക്കുന്നതിനെക്കാൾ അർധവിരാമം സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
theological_decisions:
- issue: മത്തായിയുടെ ഗ്രീക്ക് പാഠത്തിലെ പേരും പഴയനിയമത്തിലെ യൂദാരാജാവിന്റെ പേരും തമ്മിലുള്ള വ്യത്യാസം
  choice: പ്രധാനപാഠത്തിൽ ഗ്രീക്കിലെ ‘ആമോസ്’ എന്ന പേര് നിലനിർത്തി
  alternative: 2 രാജാക്കന്മാർ 21-ലെ രാജാവിന്റെ പേരുമായി ഒത്തുപോകാൻ ‘ആമോൻ’ എന്നു നൽകുക
  rationale: നിലവിലുള്ള ഗ്രീക്ക് മൂലപാഠം Ἀμώς എന്നാണ് വായിക്കുന്നത്. അതിനെ നിശ്ശബ്ദമായി ‘ആമോൻ’ എന്നു സമന്വയിപ്പിക്കുന്നത് പാഠത്തിലെ യഥാർഥമായ സംഘർഷം മറയ്ക്കും; അതിനാൽ ‘ആമോസ്’ പ്രധാനപാഠത്തിലും പരിചിതമായ മറ്റുരൂപം അടിക്കുറിപ്പിലും നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, വംശാവലിക്ക് യോജിച്ച സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ സമാന്തര ആവർത്തനം നിലനിർത്തി; അനാവശ്യമായ ബന്ധകങ്ങൾ ഒഴിവാക്കി.
