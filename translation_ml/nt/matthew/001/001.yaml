id: MAT.1.1
reference: Matthew 1:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Βίβλος γενέσεως Ἰησοῦ χριστοῦ υἱοῦ Δαυὶδ υἱοῦ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/001.yaml
  text: The book of the genealogy of Jesus the Messiah[a], the son of David[b], the son of Abraham.
translation:
  language: ml
  text: ദാവീദിന്റെ പുത്രനും അബ്രാഹാമിന്റെ പുത്രനുമായ യേശു മശീഹയുടെ[b] വംശാവലിയുടെ[a] പുസ്തകം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഉത്ഭവത്തിന്റെ പുസ്തകം’ അല്ലെങ്കിൽ ‘ജനനത്തിന്റെ പുസ്തകം’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദത്തിന് ഈ വിശാലമായ അർഥങ്ങൾ വരാമെങ്കിലും, പിന്നാലെ വരുന്ന വംശപരമ്പരയ്ക്ക് ‘വംശാവലി’ ഏറ്റവും യോജിക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: 'പരമ്പരാഗതമായി: ‘യേശുക്രിസ്തു.’ ഇവിടെ ഗ്രീക്കിലെ Χριστός എന്ന സ്ഥാനപ്പേര് ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: Βίβλος
  choice: പുസ്തകം
  rationale: βίβλος എന്നത് പുസ്തകം, ചുരുൾ, അല്ലെങ്കിൽ ലിഖിതരേഖ എന്നർഥം വഹിക്കുന്നു. ഇവിടെ ശീർഷകസ്വഭാവമുള്ള പ്രയോഗമായതിനാൽ ‘പുസ്തകം’ മൂലത്തിന്റെ ഔപചാരികത നിലനിർത്തുന്നു.
- source_word: γενέσεως
  choice: വംശാവലി
  rationale: γένεσις എന്നതിന് ഉത്ഭവം, ജനനം, വംശാവലി എന്നീ അർഥങ്ങൾ വരാം. പിന്നാലെ വരുന്ന വംശപരമ്പരാപട്ടികയുടെ പശ്ചാത്തലത്തിൽ ‘വംശാവലി’യാണ് പ്രധാനപാഠത്തിൽ ഏറ്റവും യോജിച്ചത്; വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: Ἰησοῦ
  choice: യേശു
  rationale: മലയാളത്തിലെ നിലവാരമുള്ള പരമ്പരാഗത നാമരൂപം.
- source_word: χριστοῦ
  choice: മശീഹ
  rationale: Χριστός ഇവിടെ വ്യക്തിനാമത്തേക്കാൾ അഭിഷിക്തനായ രാജാവിനെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നു. ‘മശീഹ’ ആ യഹൂദ പശ്ചാത്തലം വ്യക്തമാക്കുന്നു; ‘ക്രിസ്തു’ എന്ന പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: υἱοῦ Δαυὶδ
  choice: ദാവീദിന്റെ പുത്രൻ
  rationale: υἱός അക്ഷരാർഥത്തിൽ ‘പുത്രൻ’ എന്നാണ്; ഇവിടെ വംശജനെയും മശീഹാസംബന്ധമായ രാജകീയ സ്ഥാനത്തെയും സൂചിപ്പിക്കുന്നു. ‘പുത്രൻ’ എന്ന രൂപം ഈ രണ്ടും നിലനിർത്തുന്നു.
- source_word: υἱοῦ Ἀβραάμ
  choice: അബ്രാഹാമിന്റെ പുത്രൻ
  rationale: ഇവിടെ ‘പുത്രൻ’ എന്നത് വംശജൻ എന്ന വിപുലമായ അർഥത്തിലാണ്. അക്ഷരാർഥവും ഉടമ്പടിസംബന്ധമായ ബന്ധവും നിലനിർത്താൻ ഈ രൂപം സ്വീകരിച്ചു.
theological_decisions:
- issue: Χριστός എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഈ വാക്യത്തിൽ പദം സ്ഥാനപ്പേരായി യേശുവിന്റെ മശീഹാത്വത്തെ അവതരിപ്പിക്കുന്നു. അതിനാൽ പ്രധാനപാഠത്തിൽ ‘മശീഹ’ സ്വീകരിക്കുകയും പരമ്പരാഗതമായ ‘ക്രിസ്തു’ അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
- issue: ശീർഷകത്തിലെ γενέσεως എന്നതിന്റെ അർഥം
  choice: വംശാവലി
  alternative: ഉത്ഭവം; ജനനം
  rationale: തുടർന്നുവരുന്ന ഭാഗം വംശപരമ്പരയായതിനാൽ ‘വംശാവലി’ ഏറ്റവും യോജിക്കുന്നു. എങ്കിലും ഗ്രീക്ക് പദത്തിലെ ‘ഉത്ഭവം/ജനനം’ എന്ന പ്രതിധ്വനി ഇല്ലാതാക്കാതെ അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ, തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ഗ്രീക്കിലെ ശീർഷകസദൃശമായ സംക്ഷിപ്ത ഘടന കഴിയുന്നത്ര നിലനിർത്തിയിട്ടുണ്ട്.
