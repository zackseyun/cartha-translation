  text: φιλοῦσι ⸀δὲ τὴν πρωτοκλισίαν ἐν τοῖς δείπνοις καὶ τὰς πρωτοκαθεδρίας ἐν ταῖς συναγωγαῖς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/006.yaml
  text: And they love the places of honor at banquets and the best seats in the synagogues[c][b][a],
translation:
  language: ml
  text: വിരുന്നുകളിലെ മാന്യസ്ഥാനവും[a][c] സിനഗോഗുകളിലെ മുഖ്യ ഇരിപ്പിടങ്ങളും[b] അവർ ഇഷ്ടപ്പെടുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മാന്യസ്ഥാനം’ എന്നതിനുപകരം ‘ഭക്ഷണമേശയിലെ മുഖ്യസ്ഥാനം’ എന്നും പരിഭാഷപ്പെടുത്താം; പുരാതന ലോകത്തിലെ ഔപചാരിക ഭക്ഷണവേളകളിൽ ആദരിക്കപ്പെട്ടവർ ചാരിക്കിടന്നിരുന്ന സ്ഥാനത്തെയാണ് ഗ്രീക്ക് പദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘മുഖ്യ ഇരിപ്പിടങ്ങൾ’ എന്നതിനുപകരം ‘ഏറ്റവും മാന്യമായ ഇരിപ്പിടങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദം ഏറ്റവും ഉയർന്ന പദവിയോ മുൻഗണനയോ ഉള്ള ഇരിപ്പിടങ്ങളെ ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
  - marker: c
    text: പുരാതന മെഡിറ്ററേനിയൻ ലോകത്തിലെ വിരുന്നുകളിൽ അതിഥികളുടെ സ്ഥാനമാനം ഇരിപ്പിടക്രമത്തിലൂടെ പരസ്യമായി പ്രകടമായിരുന്നു. അതിനാൽ ഇവിടെ സുഖസൗകര്യത്തേക്കാൾ പൊതുവായ അംഗീകാരത്തോടുള്ള മോഹമാണ് എടുത്തുകാട്ടുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: φιλοῦσι
  choice: അവർ ഇഷ്ടപ്പെടുന്നു
  rationale: ഇവിടെ φιλέω ശക്തമായ താത്പര്യത്തെയോ മുൻഗണനയെയോ സൂചിപ്പിക്കുന്നു; ദൈവശാസ്ത്രപരമായ സ്നേഹമല്ല. ‘ഇഷ്ടപ്പെടുന്നു’ എന്നത് സ്വാഭാവികവും യേശുവിന്റെ വിമർശനത്തിന്റെ ധാർമിക ഊന്നൽ നിലനിർത്തുന്നതുമാണ്.
- source_word: δὲ
  choice: വാക്യപ്രവാഹത്തിൽ പ്രത്യേക പദമായി പ്രകടിപ്പിച്ചിട്ടില്ല
  rationale: ഇവിടെ δέ നേരിയ ബന്ധസൂചകമാണ്. മുൻവാക്യത്തിന്റെ തുടർച്ച മലയാളത്തിലെ വാക്യക്രമംകൊണ്ട് സ്വാഭാവികമായി വ്യക്തമാകുന്നതിനാൽ ‘എന്നാൽ’ എന്നു ചേർത്ത് അനാവശ്യമായ വിരോധഭാവം സൃഷ്ടിച്ചിട്ടില്ല.
- source_word: τὴν πρωτοκλισίαν
  choice: മാന്യസ്ഥാനം
  rationale: പുരാതന ഔപചാരിക ഭക്ഷണവേളയിൽ ഏറ്റവും ഉയർന്ന ബഹുമതി ലഭിച്ച ചാരിക്കിടക്കുന്ന സ്ഥാനത്തെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്. ‘മാന്യസ്ഥാനം’ അതിന്റെ സാമൂഹിക അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: ἐν τοῖς δείπνοις
  choice: വിരുന്നുകളിൽ
  rationale: δεῖπνον സായാഹ്നഭക്ഷണമോ ഔപചാരിക ഭക്ഷണവിരുന്നോ സൂചിപ്പിക്കാം. ഇവിടെ പൊതുവായി പ്രകടമാകുന്ന സ്ഥാനമാനത്തിന്റെ പശ്ചാത്തലത്തിൽ ‘വിരുന്നുകളിൽ’ യോജിക്കുന്നു.
- source_word: τὰς πρωτοκαθεδρίας
  choice: മുഖ്യ ഇരിപ്പിടങ്ങൾ
  rationale: ഈ പദം ഏറ്റവും ഉയർന്ന പദവിയോ മുൻഗണനയോ സൂചിപ്പിക്കുന്ന ഇരിപ്പിടങ്ങളെയാണ് അർഥമാക്കുന്നത്. ‘മുഖ്യ ഇരിപ്പിടങ്ങൾ’ മൂലത്തിന്റെ സ്ഥാനമാന ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: സിനഗോഗുകളിൽ
  rationale: യഹൂദരുടെ കൂടിവരവിനും ആരാധനയ്ക്കുമുള്ള സ്ഥാപനപരമായ ഇടത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള പ്രയോഗമാണിത്.
