  register: ആധുനിക നിലവാര മലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. പുരാതന ഭക്ഷണരീതിയുടെ അക്ഷരാർഥം മുഖ്യവാചകത്തിൽ അപരിചിതമായി തോന്നാതിരിക്കാനായി സാമൂഹിക അർഥം നൽകിയിട്ടുണ്ട്; കൂടുതൽ കൃത്യമായ സാംസ്കാരിക വിശദീകരണം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
