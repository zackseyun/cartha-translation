id: MAT.23.8
reference: Matthew 23:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ μὴ κληθῆτε· Ῥαββί, εἷς γάρ ἐστιν ὑμῶν ὁ ⸀διδάσκαλος, πάντες δὲ ὑμεῖς ἀδελφοί ἐστε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/008.yaml
  text: But you are not to be called ‘Rabbi,’ for one is your teacher[b][a], and you are all brothers.
translation:
  language: ml
  text: എന്നാൽ നിങ്ങൾ ‘റബ്ബി’[a] എന്നു വിളിക്കപ്പെടരുത്; കാരണം നിങ്ങളുടെ ഗുരു ഒരുവൻ മാത്രമാണ്; നിങ്ങളെല്ലാവരും സഹോദരന്മാരാണ്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘റബ്ബി’ എന്ന യഹൂദ ബഹുമാനപദത്തിന് ‘ഗുരു’ എന്ന അർഥമുണ്ട്. എന്നാൽ യഹൂദ പശ്ചാത്തലം നിലനിർത്താനും വാക്യത്തിൽ പിന്നീട് വരുന്ന ‘ഗുരു’ എന്ന പദവുമായി രണ്ടിനെയും ലയിപ്പിക്കാതിരിക്കാനും ഇവിടെ അത് ലിപ്യന്തരണം ചെയ്തിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘സഹോദരന്മാർ’ എന്നു പരിഭാഷപ്പെടുത്തിയ ἀδελφοί പുല്ലിംഗ ബഹുവചനമാണ്; ഈ സന്ദർഭത്തിൽ അത് സഹശിഷ്യരെ ഒരു സമൂഹമായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ κληθῆτε
  choice: നിങ്ങളെ ... എന്നു വിളിക്കരുത്
  rationale: μήയോടുകൂടിയ aorist passive subjunctive ഇവിടെ നിരോധനം പ്രകടിപ്പിക്കുന്നു. കർമണിപ്രയോഗവും നിർദേശത്തിന്റെ നേരിട്ടുള്ള ശക്തിയും ഈ രൂപം നിലനിർത്തുന്നു.
- source_word: Ῥαββί
  choice: റബ്ബി
  rationale: ഗ്രീക്കിൽ ലിപ്യന്തരണം ചെയ്തിരിക്കുന്ന യഹൂദ ബഹുമാനപദം അതേപടി നിലനിർത്തുന്നത് ചരിത്ര-യഹൂദ പശ്ചാത്തലം സംരക്ഷിക്കുകയും തുടർന്നുള്ള διδάσκαλος എന്ന പദവുമായി അതിനെ ലയിപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: εἷς
  choice: ഒരേയൊരു
  rationale: εἷς എന്നതിന്റെ ഏകത്വ ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘ഒരേയൊരു’ ഉപയോഗിച്ചു; ഇത് സന്ദർഭത്തിൽ ഉള്ള ഏകത്വത്തെ പ്രകടമാക്കുന്നു.
- source_word: ὑμῶν ὁ διδάσκαλος
  choice: നിങ്ങൾക്ക് ... ഗുരു
  rationale: ὑμῶν സൂചിപ്പിക്കുന്ന ബന്ധപരമായ അർഥം മലയാളത്തിലെ ദാതൃപ്രയോഗത്തിലൂടെ സ്വാഭാവികമായി നൽകുന്നു. ‘ഗുരു’ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, മാന്യമായ അധ്യാപകപദമാണ്.
- source_word: πάντες δὲ ὑμεῖς ἀδελφοί ἐστε
  choice: നിങ്ങളോ എല്ലാവരും സഹോദരന്മാരാണ്
  rationale: πάντες, ὑμεῖς എന്നിവയുടെ കൂട്ടായ ഊന്നൽ ‘നിങ്ങളോ എല്ലാവരും’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു; ἀδελφοίയുടെ പുല്ലിംഗ ബഹുവചനവും കുടുംബരൂപകവും ‘സഹോദരന്മാർ’ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: മനുഷ്യർക്കുള്ള എല്ലാ ബഹുമാനപദങ്ങളെയും യേശു സമ്പൂർണമായി നിരോധിക്കുന്നുവോ, ശിഷ്യസമൂഹത്തിലെ പദവിമോഹത്തെയാണോ അഭിസംബോധന ചെയ്യുന്നത്
  choice: വാക്യത്തിലെ നേരിട്ടുള്ള നിരോധനം അതിന്റെ പരിധിയെ പിന്നീട് രൂപപ്പെട്ട സമ്പൂർണ സിദ്ധാന്തമായി വികസിപ്പിക്കാതെ നിലനിർത്തി.
  alternative: ‘റബ്ബി’ ഉൾപ്പെടെയുള്ള എല്ലാ സമാന ബഹുമാനപദങ്ങളുടെയും ഉപയോഗത്തിനുള്ള സമ്പൂർണ വിലക്ക്; അല്ലെങ്കിൽ കപടമായ സ്ഥാനമോഹത്തിനെതിരായ വളരെ പരിമിതമായ വിമർശനം.
  rationale: ഗ്രീക്ക് പാഠം നിരോധനവും അതിന്റെ കാരണവും നേരിട്ട് പറയുന്നു; എന്നാൽ പിന്നീടുള്ള എല്ലാ പ്രയോഗപരിധികളും നിർവചിക്കുന്നില്ല. അതിനാൽ വിശാലമോ സങ്കുചിതമോ ആയ ഒരു വ്യാഖ്യാനം പരിഭാഷയിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘റബ്ബി’ ചരിത്രപരമായ പദമായി നിലനിർത്തി; ‘ഗുരു’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പദമായി തെരഞ്ഞെടുത്തു. പ്രധാനപാഠത്തിലെ [a], [b] അടയാളങ്ങൾ അനുബന്ധ അടിക്കുറിപ്പുകളുമായി പൊരുത്തപ്പെടുന്നു.
