  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Φαρισαῖε τυφλέ, καθάρισον πρῶτον τὸ ἐντὸς τοῦ ποτηρίου ⸂καὶ τῆς παροψίδος⸃, ἵνα γένηται καὶ τὸ ἐκτὸς ⸀αὐτοῦ καθαρόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/026.yaml
  text: Blind Pharisee[a], first clean the inside of the cup and the dish, so that its outside also may become clean.
translation:
  language: ml
  text: അന്ധനായ പരീശനേ, പാനപാത്രത്തിന്റെയും വിളമ്പുപാത്രത്തിന്റെയും[a] അകം ആദ്യം വൃത്തിയാക്കുക; അങ്ങനെ അതിന്റെ പുറവും വൃത്തിയായിത്തീരേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വിളമ്പുപാത്രം’ (παροψίς) എന്നത് ‘തളിക,’ ‘കിണ്ണം,’ അല്ലെങ്കിൽ ‘വലിയ തളിക’ എന്നും പരിഭാഷപ്പെടുത്താം; ഭക്ഷണം വിളമ്പാൻ ഉപയോഗിക്കുന്ന പാത്രമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Φαρισαῖε τυφλέ
  choice: അന്ധനായ പരീശനേ
  rationale: രണ്ട് പദങ്ങളും ഏകവചന സംബോധനത്തിലാണ്. ആത്മീയ അന്ധതയെ സൂചിപ്പിക്കുന്ന ശക്തമായ രൂപകം വിശദീകരിക്കാതെ നേരിട്ടുള്ള സംബോധനയായി നിലനിർത്തുന്നു.
- source_word: καθάρισον πρῶτον
  choice: ആദ്യം വൃത്തിയാക്കുക
  rationale: ഏകവചന ആജ്ഞയും പ്രവർത്തനത്തിന്റെ മുൻഗണനയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; പാത്രത്തിന്റെ ദൃശ്യരൂപകത്തിന് ‘വൃത്തിയാക്കുക’ യോജിക്കുന്നു.
- source_word: τὸ ἐντὸς τοῦ ποτηρίου
  choice: പാനപാത്രത്തിന്റെ അകം
  rationale: ἐντός എന്ന അകത്തെ ഭാഗവും ποτήριον എന്ന കുടിക്കാനുള്ള പാത്രവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: τῆς παροψίδος
  choice: വിളമ്പുപാത്രം
  rationale: παροψίς ഭക്ഷണം വിളമ്പുന്ന തളികയെയോ പാത്രത്തെയോ സൂചിപ്പിക്കാം. രൂപം അനാവശ്യമായി നിർണയിക്കാതെ ഉപയോഗം വ്യക്തമാക്കുന്ന പൊതുവായ പദം തെരഞ്ഞെടുത്തു.
- source_word: ἵνα γένηται ... καθαρόν
  choice: അങ്ങനെ ... വൃത്തിയായിത്തീരട്ടെ
  rationale: ἵναയുടെ ഉദ്ദേശ്യ/ഫലഭാവവും γίνομαιയുടെ ‘ആയിത്തീരുക’ എന്ന മാറ്റസൂചനയും നിലനിർത്തുന്നു; വെറും ‘വൃത്തിയായിരിക്കും’ എന്ന് ചുരുക്കുന്നില്ല.
- source_word: τὸ ἐκτὸς αὐτοῦ
  choice: അതിന്റെ പുറം
  rationale: അകവും പുറവും തമ്മിലുള്ള സമാന്തര്യം നിലനിർത്തുകയും ഗ്രീക്കിലെ ഏകവചന സർവനാമമായ αὐτοῦയെ ബഹുവചനമാക്കി വ്യാഖ്യാനിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: പാത്രരൂപകമോ അതിന്റെ ധാർമിക വ്യാഖ്യാനമോ
  choice: പാനപാത്രത്തിന്റെയും വിളമ്പുപാത്രത്തിന്റെയും അകവും പുറവും വൃത്തിയാക്കുന്ന മൂർത്തമായ ദൃശ്യം അതേപടി നിലനിർത്തി.
  alternative: ‘ആദ്യം നിങ്ങളുടെ ആന്തരികജീവിതം ശുദ്ധമാക്കുക’ എന്നിങ്ങനെ രൂപകത്തിന്റെ അർഥം മുഖ്യവാചകത്തിൽ തുറന്നുപറയുക.
  rationale: ഗ്രീക്ക് വാചകം ധാർമിക പ്രയോഗം നേരിട്ട് വിശദീകരിക്കാതെ പാത്രരൂപകത്തിലൂടെയാണ് സംസാരിക്കുന്നത്. വ്യാഖ്യാനം ചേർക്കുന്നത് അതിന്റെ വാചാടോപശക്തിയും ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും കുറയ്ക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ സംബോധനയും ആജ്ഞാരൂപവും ഉപയോഗിച്ചു. ‘ശുദ്ധീകരിക്കുക’ എന്ന കൂടുതൽ മതപരമായ പദത്തിനു പകരം പാത്രരൂപകവുമായി ചേരുന്ന ‘വൃത്തിയാക്കുക’ സ്വീകരിച്ചു. ഗ്രീക്കിലെ ഏകവചന αὐτοῦ കാരണം ‘അതിന്റെ’ നിലനിർത്തി; ‘അവയുടെ’ എന്ന് മാറ്റി വ്യാകരണസൗകര്യത്തിനായി അവ്യക്തത പരിഹരിച്ചില്ല.
