id: MAT.23.14
reference: Matthew 23:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: robinson-pierpont-2005-byzantine
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι κατεσθίετε τὰς οἰκίας τῶν χηρῶν, καὶ προφάσει μακρὰ προσευχόμενοι· διὰ τοῦτο λήψεσθε περισσότερον κρίμα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/014.yaml
  text: Woe[a] to you, scribes and Pharisees, hypocrites! For you devour widows' houses, and as a pretext make long prayers; therefore you will receive greater condemnation.
translation:
  language: ml
  text: “ശാസ്ത്രിമാരും പരീശന്മാരുമായ കപടികളേ, നിങ്ങൾക്കു അയ്യോ![a] നിങ്ങൾ വിധവമാരുടെ വീടുകൾ വിഴുങ്ങുകയും വ്യാജേന ദീർഘമായി പ്രാർഥിക്കുകയും ചെയ്യുന്നു; അതുകൊണ്ട് നിങ്ങൾക്ക് കൂടുതൽ കഠിനമായ ശിക്ഷാവിധി ലഭിക്കും.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ വാക്യം ഏറ്റവും പുരാതനമായ ഗ്രീക്ക് കൈയെഴുത്തുപ്രതികളിൽ—നാലാം നൂറ്റാണ്ടിലെ സീനായിറ്റിക്കസ്, വത്തിക്കാനസ് എന്നിവ ഉൾപ്പെടെ—കാണുന്നില്ല; പുരാതന കോപ്റ്റിക് പരിഭാഷകളിലും ഇതില്ല. എന്നാൽ ബൈസന്റൈൻ ഭൂരിപക്ഷ പാരമ്പര്യത്തിലും പഴയ ലത്തീൻ, വുൾഗാത്ത, സുറിയാനി പരിഭാഷകളിലും ഇത് നിലനിൽക്കുന്നു. മർക്കോസ് 12:40-ലും ലൂക്കോസ് 20:47-ലും ഉള്ള സമാനവചനങ്ങളോടു പൊരുത്തപ്പെടുത്താൻ പിൽക്കാല പകർപ്പെഴുത്തുകാർ ഇത് ചേർത്തതാകാം. ഈ വാക്യം ഉൾക്കൊള്ളുന്ന കൈയെഴുത്തുപ്രതികളിൽ ചിലത് ഇത് 13-ാം വാക്യത്തിനു മുമ്പും ചിലത് അതിനു ശേഷവും നൽകുന്നു.
    reason: textual_critical
lexical_decisions:
- source_word: Οὐαί
  choice: നിങ്ങളെ കാത്തിരിക്കുന്നത് മഹാദുരിതം
  rationale: വിധിപ്രഖ്യാപനവും വിലാപഭാവവും ഒരുമിച്ചുള്ള ഗ്രീക്ക് പ്രയോഗത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ὑποκριταί
  choice: കപടഭക്തരായ
  rationale: പുറമേയുള്ള മതഭക്തിയുടെ മറവിൽ വിരുദ്ധമായി പ്രവർത്തിക്കുന്നവരെ ഇവിടെ സൂചിപ്പിക്കുന്നു; വെറും ‘കപടന്മാർ’ എന്നതിനെക്കാൾ സന്ദർഭോചിതം.
- source_word: κατεσθίετε
  choice: വിഴുങ്ങുന്നു
  rationale: വിധവമാരുടെ സ്വത്തും ഉപജീവനവും നിർദയമായി അപഹരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ശക്തമായ രൂപകം നിലനിർത്തുന്നു.
- source_word: τὰς οἰκίας τῶν χηρῶν
  choice: വിധവമാരുടെ വീടുകൾ
  rationale: ‘വീടുകൾ’ എന്നതിന് കുടുംബസ്വത്തും ഉപജീവനസമ്പത്തും ഉൾപ്പെടാവുന്ന മൂലഭാഷയിലെ രൂപകം അതേപടി സംരക്ഷിക്കുന്നു.
- source_word: προφάσει
  choice: അതു മറയ്ക്കാൻ
  rationale: ദീർഘപ്രാർഥന യഥാർഥ ഭക്തിയല്ല, ചൂഷണം മറയ്ക്കുന്ന വ്യാജമറയാണെന്ന അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: περισσότερον κρίμα
  choice: കൂടുതൽ കഠിനമായ ശിക്ഷാവിധി
  rationale: താരതമ്യത്തിന്റെ അർഥവും κρίμα എന്നതിന്റെ പ്രതികൂലമായ ന്യായവിധി/ശിക്ഷാർഥവും ഒരുമിച്ച് അറിയിക്കുന്നു.
theological_decisions:
- issue: περισσότερον κρίμα എന്ന പ്രയോഗത്തിലെ താരതമ്യത്തിന്റെ മാനദണ്ഡം വ്യക്തമല്ല
  choice: കൂടുതൽ കഠിനമായ ശിക്ഷാവിധി
  alternative: ഏറ്റവും കഠിനമായ ശിക്ഷാവിധി
  rationale: ഗ്രീക്ക് താരതമ്യരൂപം ‘കൂടുതൽ/അധികം’ എന്ന അർഥം നൽകുന്നു; ആരെക്കാൾ എന്നത് വാക്യം വ്യക്തമാക്കാത്തതിനാൽ അത് ചേർത്ത് വ്യാഖ്യാനിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വിധിപ്രഖ്യാപന ശൈലി. ‘ശാസ്ത്രിമാർ’, ‘പരീശന്മാർ’, ‘ശിക്ഷാവിധി’ എന്നീ പരിചിതമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തി; ചൂഷണത്തിന്റെ ശക്തി അറിയിക്കാൻ ‘വീടുകൾ വിഴുങ്ങുന്നു’ എന്ന രൂപകം സംരക്ഷിച്ചു.
