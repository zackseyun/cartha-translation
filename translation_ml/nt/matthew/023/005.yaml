id: MAT.23.5
reference: Matthew 23:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πάντα δὲ τὰ ἔργα αὐτῶν ποιοῦσιν πρὸς τὸ θεαθῆναι τοῖς ἀνθρώποις· πλατύνουσι ⸀γὰρ τὰ φυλακτήρια αὐτῶν καὶ μεγαλύνουσι τὰ ⸀κράσπεδα,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/005.yaml
  text: But they do all their works to be seen by people[b][a], for they widen their phylacteries and enlarge their tassels.
translation:
  language: ml
  text: എന്നാൽ, മറ്റുള്ളവർ കാണാനായി അവർ തങ്ങളുടെ പ്രവൃത്തികളെല്ലാം ചെയ്യുന്നു. കാരണം, അവർ തങ്ങളുടെ തിരുവെഴുത്തുപെട്ടികൾ[a] വീതികൂട്ടുകയും വസ്ത്രത്തിലെ തൊങ്ങലുകൾ[b] വലുതാക്കുകയും ചെയ്യുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഫിലാക്ടറികൾ’ അഥവാ ‘തെഫിലീൻ’ എന്നും വിളിക്കപ്പെടുന്നു. ആവർത്തനം 6:8 പോലുള്ള ഭാഗങ്ങൾ അനുസരിച്ച് ചില യഹൂദർ ധരിച്ചിരുന്ന, തിരുവെഴുത്തുഭാഗങ്ങൾ അടങ്ങിയ ചെറിയ തോൽപ്പെട്ടികളായിരുന്നു ഇവ.
    reason: cultural_note
  - marker: b
    text: ‘വസ്ത്രത്തിന്റെ തൊങ്ങലുകൾ’ അഥവാ ‘അരികിലെ നൂൽക്കുഞ്ചങ്ങൾ.’ വസ്ത്രങ്ങളിൽ ധരിക്കേണ്ട ഈ തൊങ്ങലുകളെക്കുറിച്ച് സംഖ്യ 15:38–39 കാണുക.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα τὰ ἔργα
  choice: തങ്ങളുടെ പ്രവൃത്തികളെല്ലാം
  rationale: പ്രവൃത്തികളുടെ സമഗ്രത സൂചിപ്പിക്കുന്ന πάντα എന്ന പദത്തിന്റെ ഊന്നൽ നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ മലയാളക്രമം ഉപയോഗിക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭത്തോടുള്ള വൈരുധ്യം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: πρὸς τὸ θεαθῆναι τοῖς ἀνθρώποις
  choice: ആളുകൾ കാണേണ്ടതിനാണ്
  rationale: ഗ്രീക്കിലെ ഉദ്ദേശ്യാർഥക ഘടനയും മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്ന ἀνθρώποις എന്ന പദത്തിന്റെ ലിംഗനിരപേക്ഷതയും നിലനിർത്തുന്നു.
- source_word: φυλακτήρια
  choice: തിരുവെഴുത്തുപെട്ടികൾ
  rationale: അകത്ത് തിരുവെഴുത്തുഭാഗങ്ങൾ സൂക്ഷിച്ച് ധരിച്ചിരുന്ന ചെറിയ പെട്ടികളെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ തെറ്റിദ്ധരിപ്പിക്കാവുന്ന ‘രക്ഷാപ്പട്ട’ പോലുള്ള പദങ്ങളെക്കാൾ ഇത് വസ്തുവിന്റെ സ്വഭാവം വ്യക്തമായി അറിയിക്കുന്നു; സാംസ്കാരിക വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: πλατύνουσι
  choice: വീതികൂട്ടുകയും
  rationale: വീതിയേറിയതാക്കുക എന്ന ക്രിയയുടെ ഭൗതിക അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: κράσπεδα
  choice: വസ്ത്രത്തൊങ്ങലുകൾ
  rationale: സംഖ്യ 15:38–39-ലെ നിർദേശപ്രകാരം വസ്ത്രത്തിൽ ഘടിപ്പിച്ചിരുന്ന തൊങ്ങലുകളെയാണ് സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്; പൊതുവായ ‘അരികുകൾ’ എന്നതിനെക്കാൾ കൃത്യമാണ്.
- source_word: μεγαλύνουσι
  choice: വലുതാക്കുകയും
  rationale: വലുതോ പ്രമുഖമോ ആക്കുക എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; ‘നീളംകൂട്ടുക’ എന്ന് അനാവശ്യമായി പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻപറഞ്ഞ കുറ്റപ്പെടുത്തലിനെ തുടർന്നുള്ള പ്രവൃത്തികൾ വിശദീകരിക്കുന്നതാണെന്ന് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: യഹൂദമതാചാര വസ്തുക്കളെ അവ തന്നെയാണ് കുറ്റകരമെന്ന ധാരണ വരാതെ അവതരിപ്പിക്കൽ
  choice: φυλακτήρια എന്നത് ‘തിരുവെഴുത്തുപെട്ടികൾ’ എന്നും κράσπεδα എന്നത് ‘വസ്ത്രത്തൊങ്ങലുകൾ’ എന്നും നൽകി അവയുടെ പശ്ചാത്തലം അടിക്കുറിപ്പുകളിൽ വിശദീകരിച്ചു.
  alternative: ‘രക്ഷാപ്പട്ടകൾ’/‘പ്രാർഥനപ്പെട്ടികൾ’ എന്നും ‘വസ്ത്രത്തിന്റെ അരികുകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
  rationale: വാക്യത്തിലെ വിമർശനം ഈ ആചാരവസ്തുക്കളുടെ ഉപയോഗത്തെയല്ല, മറ്റുള്ളവർ കാണാൻവേണ്ടി അവയെ പ്രകടനപരമായി വലുതാക്കുന്നതിനെയാണ് ലക്ഷ്യമിടുന്നത്. അതിനാൽ വസ്തുക്കളെ നിഷ്പക്ഷമായും വ്യക്തമായും അവതരിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. അപരിചിതമായ സാംസ്കാരിക വസ്തുക്കൾക്ക് അർഥസൂചനയുള്ള മലയാളപദങ്ങൾ മുഖ്യവാക്യത്തിൽ നൽകി, കൂടുതൽ കൃത്യമായ ചരിത്രപരമായ പേരുകൾ അടിക്കുറിപ്പിൽ ചേർത്തിരിക്കുന്നു.
