id: MAT.23.2
reference: Matthew 23:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγων· Ἐπὶ τῆς Μωϋσέως καθέδρας ἐκάθισαν οἱ γραμματεῖς καὶ οἱ Φαρισαῖοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/002.yaml
  text: saying[a], “The scribes and the Pharisees sit in Moses’ seat.”
translation:
  language: ml
  text: 'പറഞ്ഞു: “ശാസ്ത്രിമാരും പരീശന്മാരും മോശെയുടെ പീഠത്തിൽ ഇരുന്നിരിക്കുന്നു.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “മോശെയുടെ പീഠത്തിൽ ഇരിക്കുന്നു”; “മോശെയുടെ പീഠത്തിൽ ഇരിപ്പിടം ഏറ്റെടുത്തിരിക്കുന്നു” എന്നും മനസ്സിലാക്കാം. ഗ്രീക്ക് ക്രിയയ്ക്ക് നിഷ്പക്ഷമായ ഇരിപ്പ് അല്ലെങ്കിൽ ഒരു അധികാരസ്ഥാനം ഏറ്റെടുക്കൽ എന്നിങ്ങനെ അർഥസാധ്യതകളുണ്ട്.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: 'പറഞ്ഞു:'
  rationale: വർത്തമാന കർത്തൃവാചക കൃദന്തം മുൻവാക്യത്തോടു ബന്ധിപ്പിക്കുന്നുവെങ്കിലും, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ ഉദ്ധരണി-ആമുഖമായി പരിമിതക്രിയ ഉപയോഗിച്ചു.
- source_word: Ἐπὶ τῆς Μωϋσέως καθέδρας
  choice: മോശെയുടെ പീഠത്തിൽ
  rationale: ഇത് മോശെയുമായി ബന്ധപ്പെട്ട ഉപദേശാധികാരത്തിന്റെ സ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന രൂപകമാണ്; ‘പീഠം’ മലയാളത്തിൽ ഇരിപ്പിടത്തെയും ഔദ്യോഗിക അധികാരസ്ഥാനത്തെയും ഒരുപോലെ സൂചിപ്പിക്കാൻ കഴിയും.
- source_word: ἐκάθισαν
  choice: ഇരുന്നിരിക്കുന്നു
  rationale: അവരോഹിസ്റ്റ് രൂപത്തിന്റെ ‘ഇരുന്നു/ഇരിപ്പിടം ഏറ്റെടുത്തു’ എന്ന സാധ്യതയും അതിന്റെ ഇപ്പോഴത്തെ ഫലാവസ്ഥയും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത ആത്മനേപദാർഥം പ്രധാന പാഠത്തിൽ നിർബന്ധിച്ചിട്ടില്ല.
- source_word: οἱ γραμματεῖς
  choice: ശാസ്ത്രിമാർ
  rationale: ന്യായപ്രമാണത്തിൽ വിദഗ്ധരായ അംഗീകൃത വിഭാഗത്തെ സൂചിപ്പിക്കുന്ന പതിവ് മലയാള ബൈബിൾപദം.
- source_word: οἱ Φαρισαῖοι
  choice: പരീശന്മാർ
  rationale: യഹൂദമതത്തിലെ ഈ വിഭാഗത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള പേരുരൂപം.
theological_decisions:
- issue: ἐκάθισαν എന്ന ക്രിയ നിഷ്പക്ഷമായ ഇരിപ്പിനെയോ സ്വയം അധികാരസ്ഥാനം ഏറ്റെടുത്തതിനെയോ സൂചിപ്പിക്കുന്നുണ്ടോ
  choice: ഇരുന്നിരിക്കുന്നു
  alternative: തങ്ങളെത്തന്നെ ഇരുത്തിയിരിക്കുന്നു / ഇരിക്കുന്നു
  rationale: ഗ്രീക്ക് സജീവരൂപത്തിൽ ആത്മനേപദാർഥം തുറന്നുപറയുന്നില്ല. അതിനാൽ പ്രധാന പാഠം സ്വയം അവകാശപ്പെട്ട അധികാരം എന്ന വ്യാഖ്യാനം നിർബന്ധിക്കാതെ, ഒരു അധികാരസ്ഥാനത്ത് വന്നിരിപ്പിന്റെ സാധ്യത നിലനിർത്തുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘പീഠം’ എന്ന രൂപകം നിലനിർത്തി; വാക്യം മുൻവാക്യത്തിൽനിന്ന് തുടരുന്നതായതിനാൽ ‘പറഞ്ഞു’ എന്ന ലളിതമായ ഉദ്ധരണി-ആമുഖം ഉപയോഗിച്ചു.
