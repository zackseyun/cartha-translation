id: MAT.23.30
reference: Matthew 23:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ λέγετε· Εἰ ⸀ἤμεθα ἐν ταῖς ἡμέραις τῶν πατέρων ἡμῶν, οὐκ ἂν ⸁ἤμεθα ⸂αὐτῶν κοινωνοὶ⸃ ἐν τῷ αἵματι τῶν προφητῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/030.yaml
  text: and you say[a], ‘If we had been living in the days of our fathers[b], we would not have been partners with them in the blood of the prophets.’
translation:
  language: ml
  text: 'നിങ്ങൾ പറയുന്നു: “ഞങ്ങളുടെ പിതാക്കന്മാരുടെ കാലത്ത് ഞങ്ങൾ ജീവിച്ചിരുന്നെങ്കിൽ, പ്രവാചകന്മാരുടെ രക്തത്തിൽ[b] അവരോടൊപ്പം പങ്കാളികൾ[a] ആകുമായിരുന്നില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവരോടൊപ്പം പങ്കുചേർന്നവർ’ അല്ലെങ്കിൽ ‘അവരോടൊപ്പം പങ്കെടുത്തവർ’ എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്ക് പദത്തിന് കൂട്ടായ പങ്കാളിത്തമോ കൂട്ടുത്തരവാദിത്വമോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അതായത്, പ്രവാചകന്മാരുടെ രക്തം ചൊരിയുന്നതിലുള്ള പങ്കാളിത്തം; തങ്ങളുടെ പൂർവപിതാക്കന്മാരുടെ രക്തപാതകത്തിൽ പങ്കില്ലായിരുന്നുവെന്ന അവകാശവാദം.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγετε
  choice: നിങ്ങൾ പറയുന്നു
  rationale: വർത്തമാനകാല ദ്വിതീയപുരുഷ ബഹുവചനത്തെ യേശുവിന്റെ നേരിട്ടുള്ള അഭിസംബോധനയായി സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: Εἰ ἤμεθα
  choice: ഞങ്ങൾ ജീവിച്ചിരുന്നെങ്കിൽ
  rationale: ഭൂതകാലത്തെ യാഥാർഥ്യവിരുദ്ധമായ സങ്കൽപ്പാവസ്ഥ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ‘ജീവിച്ചിരുന്നെങ്കിൽ’ എന്നത് ആ കാലഘട്ടത്തിൽ ഉണ്ടായിരുന്നതിന്റെ സാഹചര്യാർഥം വ്യക്തമാക്കുന്നു.
- source_word: ἐν ταῖς ἡμέραις
  choice: കാലത്ത്
  rationale: ‘ദിവസങ്ങളിൽ’ എന്ന അക്ഷരാർഥത്തെക്കാൾ, ‘അവരുടെ കാലഘട്ടത്തിൽ’ എന്ന സമയസൂചന സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: τῶν πατέρων ἡμῶν
  choice: ഞങ്ങളുടെ പിതാക്കന്മാരുടെ
  rationale: πατέρων എന്ന പുൽലിംഗ രൂപവും പൂർവപിതാക്കന്മാരെക്കുറിച്ചുള്ള സന്ദർഭവും നിലനിർത്തുന്നു.
- source_word: οὐκ ἂν ἤμεθα
  choice: ആകുമായിരുന്നില്ല
  rationale: യാഥാർഥ്യവിരുദ്ധമായ ഭൂതകാല നിബന്ധനയുടെ ഫലഭാഗം മലയാളത്തിലെ സോപാധിക ഭൂതരൂപത്തിൽ നൽകുന്നു.
- source_word: αὐτῶν κοινωνοὶ
  choice: അവരോടൊപ്പം പങ്കാളികൾ
  rationale: കൂടെ പങ്കുചേരലോ കൂട്ടുത്തരവാദിത്വമോ സൂചിപ്പിക്കുന്ന κοινωνοί എന്ന പദത്തിന്റെ ബന്ധപരമായ ആശയം നിലനിർത്തുന്നു; ‘കൂട്ടുപ്രതികൾ’ എന്ന കൂടുതൽ ശക്തമായ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ഒഴിവാക്കുന്നു.
- source_word: ἐν τῷ αἵματι
  choice: രക്തത്തിൽ
  rationale: രക്തം എന്ന മൂർത്തമായ ഗ്രീക്ക് പ്രയോഗം നിലനിർത്തുന്നു; രക്തം ചൊരിയുന്നതിലുള്ള പങ്കാളിത്തം സന്ദർഭത്തിൽ ഗ്രഹിക്കാവുന്നതാണ്.
- source_word: τῶν προφητῶν
  choice: പ്രവാചകന്മാരുടെ
  rationale: സ്ഥിരവും നേരിട്ടുള്ളതുമായ മലയാള പരിഭാഷയാണ്.
theological_decisions:
- issue: κοινωνοὶ ἐν τῷ αἵματι സൂചിപ്പിക്കുന്ന കൂട്ടുത്തരവാദിത്വത്തിന്റെ അളവ്
  choice: ‘പ്രവാചകന്മാരുടെ രക്തത്തിൽ അവരോടൊപ്പം പങ്കാളികൾ’ എന്നായി, പൂർവികരുടെ പ്രവാചകവധത്തിലുള്ള ധാർമിക പങ്കാളിത്തത്തെ നിഷേധിക്കുന്ന പ്രസ്താവനയായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘പ്രവാചകന്മാരെ കൊന്നതിൽ അവരുടെ കൂട്ടുപ്രതികൾ’ അല്ലെങ്കിൽ ‘പ്രവാചകന്മാരുടെ രക്തപാതകത്തിൽ പങ്കുള്ളവർ’.
  rationale: ഗ്രീക്ക് പാഠത്തിലെ ‘പങ്കാളികൾ’ എന്ന ബന്ധപരമായ ഭാഷയും ‘രക്തം’ എന്ന ദൃശ്യരൂപവും നിലനിർത്തി, അതിനെ ‘കൊലപാതകം’ എന്ന പൂർണ വ്യാഖ്യാനമായി ചുരുക്കാതെ യഥാർഥമായ അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ നേരിട്ടുള്ള വാചകരീതി ഉപയോഗിച്ചു. ‘പിതാക്കന്മാർ’, ‘പ്രവാചകന്മാർ’, ‘രക്തം’ എന്നീ പാഠത്തിലെ പ്രധാന രൂപങ്ങൾ നിലനിർത്തിയപ്പോൾ, ‘കാലത്ത്’ എന്ന സ്വാഭാവിക സമയപ്രയോഗം സ്വീകരിച്ചു.
