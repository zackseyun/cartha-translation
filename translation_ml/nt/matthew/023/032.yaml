id: MAT.23.32
reference: Matthew 23:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς πληρώσατε τὸ μέτρον τῶν πατέρων ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/032.yaml
  text: And you[a], fill up the measure of your fathers.
translation:
  language: ml
  text: നിങ്ങളും നിങ്ങളുടെ പിതാക്കന്മാരുടെ അളവ് നിറയ്ക്കുക.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങളുടെ പിതാക്കന്മാരുടെ പാപങ്ങളുടെ മുഴുവൻ അളവും തികയ്ക്കുക.” ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “നിങ്ങളുടെ പിതാക്കന്മാരുടെ അളവ് നിറയ്ക്കുക” എന്നാണ്; ശേഖരിക്കപ്പെട്ട കുറ്റം അതിന്റെ പരിധിയിലെത്തുന്നതിനെ സൂചിപ്പിക്കുന്ന രൂപകമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: -ഉം
  rationale: മുൻവാക്യത്തോടുള്ള ഗ്രീക്ക് സംയോജനം നിലനിർത്തുകയും പ്രസംഗത്തിന്റെ തുടർച്ച സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: ὑμεῖς
  choice: നിങ്ങൾ
  rationale: ഗ്രീക്കിലെ വ്യക്തമായി ചേർത്ത സർവനാമത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു; ബഹുവചനവും വ്യക്തമാണ്.
- source_word: πληρώσατε
  choice: നിറയ്ക്കുക
  rationale: രണ്ടാംപുരുഷ ബഹുവചനത്തിലുള്ള aorist imperative എന്ന വ്യാകരണരൂപവും, ഒരു അളവ് പൂർണമാകുന്നതുവരെ നിറയ്ക്കുന്ന രൂപകവും സംരക്ഷിക്കുന്നു.
- source_word: τὸ μέτρον
  choice: അളവ്
  rationale: കുറ്റം ശേഖരിച്ച് ഒരു പരിധിയിലെത്തുന്നു എന്ന രൂപകം വിശദീകരിച്ച് തീർക്കാതെ അതിന്റെ യഥാർഥ സംക്ഷിപ്തത നിലനിർത്തുന്നു.
- source_word: τῶν πατέρων ὑμῶν
  choice: നിങ്ങളുടെ പിതാക്കന്മാരുടെ
  rationale: വംശപരമ്പരയെയും മുൻഗാമികളുടെ പ്രവൃത്തികളോടുള്ള ബന്ധത്തെയും സൂചിപ്പിക്കുന്ന ഉറവിടപദം ഔപചാരികമായി നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇതിന് ‘പൂർവികർ’ എന്ന അർഥമുണ്ട്.
theological_decisions:
- issue: യേശുവിന്റെ വാക്ക് കല്പനയാണോ പ്രവചനമാണോ
  choice: 'പരിഹാസാത്മകവും ന്യായവിധിസൂചകവുമായ കല്പന: “നിറയ്ക്കുക”'
  alternative: “നിങ്ങൾ നിറച്ചുകൊണ്ടിരിക്കുന്നു” അല്ലെങ്കിൽ “നിങ്ങൾ നിറയ്ക്കും” എന്ന പ്രവചനാത്മക വായന
  rationale: πληρώσατε എന്നത് രൂപപരമായി aorist active imperative, രണ്ടാംപുരുഷ ബഹുവചനമാണ്. അതിനാൽ കല്പനാരൂപം നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ അപലപനപരമായ പരിഹാസവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും പ്രവചനമാക്കി മൃദൂകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പിതാക്കന്മാർ’ എന്നത് ഇവിടെ ജൈവിക പിതാക്കളെ മാത്രം അല്ല, മുൻഗാമികളെയാണു സൂചിപ്പിക്കുന്നത്. മുഖ്യവാചകം ഉറവിടത്തിലെ രൂപകവും കല്പനാരൂപവും നിലനിർത്തുന്നു; വ്യാഖ്യാനപരമായ വികസനം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
