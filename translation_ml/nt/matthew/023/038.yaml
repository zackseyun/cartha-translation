  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἰδοὺ ἀφίεται ὑμῖν ὁ οἶκος ὑμῶν ⸀ἔρημος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/038.yaml
  text: Look[a], your house is left to you desolate.
translation:
  language: ml
  text: ഇതാ, നിങ്ങളുടെ ഭവനം[a] നിങ്ങൾക്കു പാഴായി ഉപേക്ഷിക്കപ്പെടുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘നിങ്ങളുടെ ദേവാലയം’; ‘നിങ്ങളുടെ ഭവനം’ എന്ന പ്രയോഗം പ്രത്യേകമായി ദേവാലയത്തെ സൂചിപ്പിക്കാം; എങ്കിലും ഗ്രീക്കിൽ ഇതിന് കൂടുതൽ വിശാലമായ സൂചനയുണ്ട്.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗൗരവമുള്ള പ്രഖ്യാപനസ്വരം സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀφίεται
  choice: വിട്ടുകൊടുക്കപ്പെടുന്നു
  rationale: വർത്തമാനകാല കർമണി രൂപം നിലനിർത്തുകയും പ്രവർത്തകനെ വ്യക്തമാക്കാതെ വിടുകയും ചെയ്യുന്നു; ഉപേക്ഷിക്കപ്പെടുന്നു എന്നതിനെക്കാൾ ഗ്രീക്കിലെ അർത്ഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
- source_word: ὑμῖν
  choice: നിങ്ങൾക്കായി
  rationale: ദാതൃവിഭക്തിയുടെ ബന്ധം വ്യക്തമാക്കുന്നു; ഭവനം അവരുടെ പക്കൽ വിട്ടുകൊടുക്കപ്പെടുന്നു എന്ന ആശയം സൂചിപ്പിക്കുമ്പോഴും അതിനെ അതിയായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: ὁ οἶκος ὑμῶν
  choice: നിങ്ങളുടെ ഭവനം
  rationale: അക്ഷരാർഥമായ ‘നിങ്ങളുടെ ഭവനം’ നിലനിർത്തുന്നു; ദേവാലയം, യെരൂശലേം, അല്ലെങ്കിൽ ഇസ്രായേൽഗൃഹം എന്നിങ്ങനെ സാധ്യതയുള്ള സൂചനകളിൽ ഒന്നായി അർത്ഥം ചുരുക്കുന്നില്ല.
- source_word: ἔρημος
  choice: ശൂന്യമായി
  rationale: ഉപേക്ഷിക്കപ്പെട്ടതും ആളൊഴിഞ്ഞതുമായ അവസ്ഥയുടെ പ്രവാചകീയ ന്യായവിധിസ്വരം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘നശിച്ച’ എന്നു പറഞ്ഞ് ഭൗതികനാശം നിർബന്ധമാക്കുന്നില്ല.
theological_decisions:
- issue: ‘നിങ്ങളുടെ ഭവനം’ എന്നതിന്റെ സൂചിതാർത്ഥം
  choice: മുഖ്യപാഠത്തിൽ ‘നിങ്ങളുടെ ഭവനം’ എന്നു വിശാലമായി നിലനിർത്തി.
  alternative: ‘നിങ്ങളുടെ ദേവാലയം’, ‘യെരൂശലേം’, അല്ലെങ്കിൽ ‘ഇസ്രായേൽഗൃഹം’
  rationale: സന്ദർഭം ദേവാലയത്തെയും യെരൂശലേമിനെയും ശക്തമായി സൂചിപ്പിക്കുന്നുവെങ്കിലും ഗ്രീക്ക് പ്രയോഗം അതിലേറെ വിശാലമാണ്. അതിനാൽ വ്യാഖ്യാനപരമായ ചുരുക്കം മുഖ്യപാഠത്തിൽ വരുത്തിയില്ല.
- issue: ἀφίεται എന്ന കർമണി രൂപത്തിലെ പ്രവർത്തകൻ
  choice: പ്രവർത്തകനെ വ്യക്തമാക്കാതെ കർമണി രൂപം നിലനിർത്തി.
  alternative: ‘ദൈവം ഉപേക്ഷിക്കുന്നു’
  rationale: ദൈവിക ന്യായവിധി സന്ദർഭത്തിൽ ഉൾക്കൊള്ളാമെങ്കിലും ഗ്രീക്ക് വാക്യം പ്രവർത്തകനെ നേരിട്ട് പറയുന്നില്ല; അതിനാൽ അത് പരിഭാഷയിൽ ചേർത്തില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള, പൊതുവായ വായനാശൈലി. ‘ഇതാ’ പ്രവാചകീയ പ്രഖ്യാപനത്തിന്റെ ഭാരം നിലനിർത്തുന്നു; ‘ഭവനം’ രൂപകത്തിന്റെ വിശാലത സംരക്ഷിക്കുന്നു.
