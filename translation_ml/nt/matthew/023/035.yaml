id: MAT.23.35
reference: Matthew 23:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅπως ἔλθῃ ἐφ’ ὑμᾶς πᾶν αἷμα δίκαιον ἐκχυννόμενον ἐπὶ τῆς γῆς ἀπὸ τοῦ αἵματος Ἅβελ τοῦ δικαίου ἕως τοῦ αἵματος Ζαχαρίου υἱοῦ Βαραχίου, ὃν ἐφονεύσατε μεταξὺ τοῦ ναοῦ καὶ τοῦ θυσιαστηρίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/035.yaml
  text: so that upon you may come all the righteous blood being poured out on the earth[a], from the blood of righteous Abel to the blood of Zechariah son of Berechiah[b], whom you murdered between the sanctuary and the altar.
translation:
  language: ml
  text: അങ്ങനെ, ഭൂമിയിൽ[a] ചൊരിയപ്പെട്ട എല്ലാ നീതിമാന്മാരുടെയും രക്തം—നീതിമാനായ ഹാബേലിന്റെ രക്തംമുതൽ ബെരെഖ്യാവിന്റെ മകനായ സെഖര്യാവിന്റെ[b] രക്തംവരെ—നിങ്ങളുടെമേൽ വരേണ്ടതിന്; ഈ സെഖര്യാവിനെയാണ് നിങ്ങൾ വിശുദ്ധമന്ദിരത്തിനും യാഗപീഠത്തിനും ഇടയിൽ കൊലപ്പെടുത്തിയത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദേശത്ത്.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദത്തിന് ‘ഭൂമി’ എന്നും ‘ദേശം’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: ‘ബെരെഖ്യാവിന്റെ മകനായ സെഖര്യാവ്’ ആരാണെന്ന കാര്യത്തിൽ അഭിപ്രായവ്യത്യാസമുണ്ട്. ചിലർ ഇദ്ദേഹത്തെ പ്രവാചകനായ സെഖര്യാവുമായി ബന്ധിപ്പിക്കുന്നു; മറ്റുചിലർ യെഹോയാദാവിന്റെ മകനായ സെഖര്യാവുമായി ബന്ധിപ്പിക്കുന്നു (2 ദിനവൃത്താന്തം 24:20–22). പരിഭാഷ ഗ്രീക്ക് പാഠത്തിലുള്ള രൂപം അതേപടി പിന്തുടരുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως ἔλθῃ ἐφ’ ὑμᾶς
  choice: അങ്ങനെ ... നിങ്ങളുടെമേൽ വന്നുചേരേണ്ടതിന്
  rationale: ὅπως സഹിതമുള്ള സബ്ജങ്ക്റ്റീവിന്റെ ഉദ്ദേശ്യ/ഫല സൂചന നിലനിർത്തുന്നു; ἐπίയുടെ ‘മേൽ’ എന്ന ന്യായവിധിസംബന്ധമായ ഭാവവും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: πᾶν αἷμα δίκαιον
  choice: നീതിമാന്മാരുടെ രക്തമെല്ലാം
  rationale: ‘നീതിയുള്ള രക്തം’ എന്ന അക്ഷരാർഥപ്രയോഗം മലയാളത്തിൽ അസ്വാഭാവികമാണ്; രക്തം നീതിമാന്മാരെ സൂചിപ്പിക്കുന്ന ലാക്ഷണികപ്രയോഗമാണെന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐκχυννόμενον
  choice: ചൊരിയപ്പെടുന്ന
  rationale: വർത്തമാനകാല നിഷ്ക്രിയ കൃദന്തരൂപവും രക്തം ഒഴുക്കുന്നതിന്റെ സജീവ ദൃശ്യവും നിലനിർത്തുന്നു.
- source_word: ἐπὶ τῆς γῆς
  choice: ഭൂമിയിൽ
  rationale: ഹാബേൽമുതലുള്ള വിശാലമായ പരിധിക്ക് ‘ഭൂമി’ യോജിക്കുന്നു; γῆയ്ക്ക് ‘ദേശം’ എന്നും അർഥമാകാമെന്നത് അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἀπὸ τοῦ αἵματος Ἅβελ τοῦ δικαίου
  choice: നീതിമാനായ ഹാബേലിന്റെ രക്തംമുതൽ
  rationale: ἀπό...ἕως എന്ന പരിധിപ്രയോഗത്തിന്റെ ആരംഭവും ഹാബേലിനോടു ചേർന്ന δίκαιος എന്ന വിശേഷണവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἕως τοῦ αἵματος Ζαχαρίου υἱοῦ Βαραχίου
  choice: ബെരെഖ്യാവിന്റെ മകനായ സെഖര്യാവിന്റെ രക്തംവരെ
  rationale: ഗ്രീക്ക് പാഠത്തിലെ പിതൃനാമം തിരുത്തുകയോ മറ്റൊരു വ്യക്തിയുമായി സമന്വയിപ്പിക്കുകയോ ചെയ്യാതെ അതേപടി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: ὃν ἐφονεύσατε
  choice: നിങ്ങൾ കൊലപ്പെടുത്തിയ
  rationale: φονεύωയിലെ കുറ്റാരോപണത്തിന്റെയും അന്യായവധത്തിന്റെയും ശക്തി ‘കൊലപ്പെടുത്തി’ എന്ന പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: μεταξὺ τοῦ ναοῦ καὶ τοῦ θυσιαστηρίου
  choice: വിശുദ്ധമന്ദിരത്തിനും യാഗപീഠത്തിനും ഇടയിൽവെച്ച്
  rationale: ναός മുഴുവൻ ദേവാലയവളപ്പിനേക്കാൾ പ്രത്യേകമായി വിശുദ്ധമന്ദിരത്തെ സൂചിപ്പിക്കുന്നു; θυσιαστήριον സ്വാഭാവികമായി ‘യാഗപീഠം’ എന്നാണ്.
theological_decisions:
- issue: ബെരെഖ്യാവിന്റെ മകനായ സെഖര്യാവിന്റെ വ്യക്തിത്വം
  choice: ഗ്രീക്ക് പാഠത്തിലുള്ള പേര് തിരുത്താതെയും സമന്വയിപ്പിക്കാതെയും നിലനിർത്തി
  alternative: ഇദ്ദേഹത്തെ പ്രവാചകനായ സെഖര്യാവായി തിരിച്ചറിയുക; അല്ലെങ്കിൽ 2 ദിനവൃത്താന്തം 24:20–22-ലെ യെഹോയാദാവിന്റെ മകനായ സെഖര്യാവുമായി ബന്ധപ്പെടുത്തി പിതൃനാമത്തിലെ പ്രയാസം പരിഹരിക്കുക
  rationale: ചരിത്രപരമായ തിരിച്ചറിയൽ വിവാദവിധേയമായതിനാൽ പരിഭാഷ ഗ്രീക്ക് പാഠത്തെ അതേപടി പ്രതിഫലിപ്പിക്കുകയും വ്യത്യസ്ത സാധ്യതകൾ അടിക്കുറിപ്പിൽ അറിയിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ദീർഘമായ ഗ്രീക്ക് വാക്യഘടന വായനാസൗകര്യത്തിനായി ഇടവരകളാൽ ക്രമപ്പെടുത്തി. ‘വിശുദ്ധമന്ദിരം’ എന്നത് ναός എന്ന പദത്തിന്റെ ദേവാലയത്തിലെ ആന്തരിക മന്ദിരം എന്ന സവിശേഷത വ്യക്തമാക്കുന്നു.
