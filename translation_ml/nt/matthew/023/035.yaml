  to: അങ്ങനെ, ഭൂമിയിൽ[a] ചൊരിയപ്പെട്ട എല്ലാ നീതിമാന്മാരുടെയും രക്തം—നീതിമാനായ ഹാബേലിന്റെ രക്തംമുതൽ ബെരെഖ്യാവിന്റെ മകനായ സെഖര്യാവിന്റെ[b] രക്തംവരെ—നിങ്ങളുടെമേൽ വരേണ്ടതിന്; ഈ സെഖര്യാവിനെയാണ് നിങ്ങൾ വിശുദ്ധമന്ദിരത്തിനും യാഗപീഠത്തിനും ഇടയിൽ കൊലപ്പെടുത്തിയത്.
