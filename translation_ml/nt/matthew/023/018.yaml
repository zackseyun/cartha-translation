- from: 'കൂടാതെ: ‘യാഗപീഠത്തെച്ചൊല്ലി സത്യം ചെയ്യുന്നവന് അതൊന്നുമല്ല; എന്നാൽ അതിന്മേലുള്ള വഴിപാടിനെച്ചൊല്ലി സത്യം ചെയ്യുന്നവൻ കടപ്പെട്ടിരിക്കുന്നു.’[a]'
  to: 'കൂടാതെ: ‘യാഗപീഠത്തെച്ചൊല്ലി സത്യം ചെയ്യുന്നവന് അതിന് പ്രാബല്യമില്ല; എന്നാൽ അതിന്മേലുള്ള വഴിപാടിനെച്ചൊല്ലി സത്യം ചെയ്യുന്നവൻ ബാധ്യസ്ഥനാണ്.’[a]'
