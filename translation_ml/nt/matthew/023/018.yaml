id: MAT.23.18
reference: Matthew 23:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καί· Ὃς ⸀ἂν ὀμόσῃ ἐν τῷ θυσιαστηρίῳ, οὐδέν ἐστιν, ὃς δ’ ἂν ὀμόσῃ ἐν τῷ δώρῳ τῷ ἐπάνω αὐτοῦ ὀφείλει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/018.yaml
  text: And[a], ‘Whoever swears by the altar, it is nothing[b]; but whoever swears by the gift on top of it is obligated.’
translation:
  language: ml
  text: 'കൂടാതെ: ‘യാഗപീഠത്തെച്ചൊല്ലി സത്യം ചെയ്യുന്നവന് അതിന് പ്രാബല്യമില്ല; എന്നാൽ അതിന്മേലുള്ള വഴിപാടിനെച്ചൊല്ലി സത്യം ചെയ്യുന്നവൻ ബാധ്യസ്ഥനാണ്.’[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അതായത്, യേശു കുറ്റപ്പെടുത്തുന്ന ഈ ഉപദേശമനുസരിച്ച്, യാഗപീഠത്തെച്ചൊല്ലിയുള്ള സത്യത്തിന് പ്രാബല്യമില്ല; എന്നാൽ അതിന്മേലുള്ള വഴിപാടിനെച്ചൊല്ലിയുള്ള സത്യം ബാധകമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: καί
  choice: കൂടാതെ
  rationale: യേശു കുറ്റപ്പെടുത്തുന്ന ഉപദേശങ്ങളുടെ പരമ്പരയിലെ മറ്റൊരു ഉദാഹരണം തുടർന്നുപറയുന്ന ബന്ധകമായി സ്വാഭാവികമാണ്.
- source_word: Ὃς ἂν ... ὀμόσῃ / ὃς δ’ ἂν ... ὀμόσῃ
  choice: സത്യം ചെയ്യുന്നവന് ... എന്നാൽ ... സത്യം ചെയ്യുന്നവൻ
  rationale: ὅς + ἄν സഹിതമുള്ള aorist subjunctive സൂചിപ്പിക്കുന്ന അനിശ്ചിത പൊതുവ്യവസ്ഥ മലയാളത്തിലെ സാമാന്യപ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: ἐν τῷ θυσιαστηρίῳ
  choice: യാഗപീഠത്തെച്ചൊല്ലി
  rationale: സത്യം ചെയ്യുന്നതിന്റെ ആധാരവിഷയത്തെ സൂചിപ്പിക്കുന്ന ἐν എന്ന പ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാള സത്യവാചക രൂപം.
- source_word: θυσιαστήριον
  choice: യാഗപീഠം
  rationale: ദേവാലയത്തിലെ ബലിപീഠത്തെ സൂചിപ്പിക്കുന്ന കൃത്യവും പ്രചാരത്തിലുള്ളതുമായ പദം.
- source_word: οὐδέν ἐστιν
  choice: അതൊന്നുമല്ല
  rationale: അത്തരം സത്യത്തിന് യാതൊരു പ്രാബല്യവുമില്ലെന്ന അപലപിക്കപ്പെടുന്ന നിലപാടിന്റെ ചുരുക്കവും ഉറവിടത്തോട് അടുത്തതുമായ അവതരണം.
- source_word: ἐν τῷ δώρῳ
  choice: വഴിപാടിനെച്ചൊല്ലി
  rationale: ദേവാലയസന്ദർഭത്തിൽ δῶρον ദൈവത്തിനു സമർപ്പിക്കുന്ന വഴിപാടിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ 'വഴിപാട്' ഈ ആരാധനാസന്ദർഭം വ്യക്തമായി നൽകുന്നു.
- source_word: τῷ ἐπάνω αὐτοῦ
  choice: അതിന്മേലുള്ള
  rationale: വഴിപാട് യാഗപീഠത്തിന്മേലാണെന്ന സ്ഥാനബന്ധം സംക്ഷിപ്തമായും വ്യക്തമായും പറയുന്നു.
- source_word: ὀφείλει
  choice: കടപ്പെട്ടിരിക്കുന്നു
  rationale: സത്യവാചകത്തിന്റെ ധാർമിക ബാധ്യത സൂചിപ്പിക്കുമ്പോഴും ഗ്രീക്കിൽ പറയാത്ത കർമം ചേർക്കാതെ ക്രിയയുടെ അപൂർണത നിലനിർത്തുന്നു.
theological_decisions:
- issue: സത്യവാചകത്തിൽ ബാധ്യതയുടെ പറയാത്ത കർമം
  choice: ‘കടപ്പെട്ടിരിക്കുന്നു’ എന്നു മാത്രം നൽകി കർമം ചേർക്കാതിരിക്കുക
  alternative: ‘തന്റെ സത്യം പാലിക്കാൻ ബാധ്യസ്ഥനാണ്’
  rationale: ഗ്രീക്ക് മൂലത്തിൽ ബാധ്യത എന്തിനാണെന്നത് വ്യക്തമാക്കിയിട്ടില്ല. സന്ദർഭത്തിൽ സത്യം പാലിക്കലാണ് ഉദ്ദേശ്യമെങ്കിലും അത് മുഖ്യവാചകത്തിൽ ചേർത്താൽ വിവർത്തനത്തേക്കാൾ വ്യാഖ്യാനമാകും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. സത്യവാചകത്തിനായി ‘-ത്തെച്ചൊല്ലി സത്യം ചെയ്യുക’ എന്നും ദേവാലയത്തിലെ δῶρον എന്നതിന് ‘വഴിപാട്’ എന്നും ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് മാർക്കർ മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
