review_pass:
  verdict: revise
  source_fidelity: The draft preserves the principal actions and the τάφους/μνημεῖα distinction, but it leaves the causal force of ὅτι unexpressed. Its rendering of ὑποκριταί as ‘കപടഭക്തർ’ adds a specific religious-devotional nuance not stated by the Greek; ‘കപടന്മാർ’ is more direct and preserves the broader accusation.
  naturalness: The proposed revision uses clear modern standard Malayalam, retains a solemn prophetic register, and explicitly introduces the reason for the woe with ‘കാരണം.’ ‘അയ്യോ, കഷ്ടം’ is an idiomatic rendering of Οὐαί in this denunciatory context.
  terminology: ‘ശാസ്ത്രിമാർ,’ ‘പരീശന്മാർ,’ ‘പ്രവാചകന്മാർ,’ and ‘നീതിമാന്മാർ’ are suitable established terms. Rendering μνημεῖα as ‘സ്മാരകങ്ങൾ’ better conveys its commemorative sense and clearly differentiates it from τάφους (‘കല്ലറകൾ’).
  issues:
  - severity: medium
    issue: The causal conjunction ὅτι is omitted.
    rationale: 'The verse explicitly gives the reason for the denunciation: ‘because/for you build … and decorate ….’ Malayalam should express this connection rather than merely juxtaposing two sentences.'
  - severity: low
    issue: ‘കപടഭക്തർ’ is more interpretive than ὑποκριταί.
    rationale: Although the setting is religious, the Greek says ‘hypocrites’ without limiting the charge to feigned piety. ‘കപടന്മാർ’ is source-closer and remains natural in context.
  - severity: low
    issue: ‘ശവകുടീരങ്ങൾ’ for μνημεῖα narrows a term that can carry a memorial/monument sense.
    rationale: Since τάφους has already been rendered ‘കല്ലറകൾ,’ ‘സ്മാരകങ്ങൾ’ preserves the lexical contrast and commemorative nuance; the tomb sense can be retained in a footnote.
  revised_text: ശാസ്ത്രിമാരേ, പരീശന്മാരേ, കപടന്മാരേ, നിങ്ങൾക്കു അയ്യോ, കഷ്ടം! കാരണം, നിങ്ങൾ പ്രവാചകന്മാരുടെ കല്ലറകൾ പണിയുകയും നീതിമാന്മാരുടെ സ്മാരകങ്ങൾ[a] അലങ്കരിക്കുകയും ചെയ്യുന്നു.
