id: MAT.23.29
reference: Matthew 23:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι οἰκοδομεῖτε τοὺς τάφους τῶν προφητῶν καὶ κοσμεῖτε τὰ μνημεῖα τῶν δικαίων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/029.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites, because you build the tombs of the prophets and decorate the monuments of the righteous[b],
translation:
  language: ml
  text: ശാസ്ത്രിമാരേ, പരീശന്മാരേ, കപടന്മാരേ, നിങ്ങൾക്കു അയ്യോ, കഷ്ടം! കാരണം, നിങ്ങൾ പ്രവാചകന്മാരുടെ കല്ലറകൾ പണിയുകയും നീതിമാന്മാരുടെ സ്മാരകങ്ങൾ[a] അലങ്കരിക്കുകയും ചെയ്യുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ശവകുടീരങ്ങൾ.’ ഗ്രീക്ക് പദത്തിന് കല്ലറയെയോ മരിച്ചവരെ അനുസ്മരിപ്പിക്കുന്ന സ്മാരകത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαί
  choice: ഹാ കഷ്ടം
  rationale: വിധിപ്രഖ്യാപനവും വിലാപഭാവവും ചേർന്ന പ്രവാചകീയ ഉദ്ഗാരത്തിന്റെ ശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: γραμματεῖς
  choice: ശാസ്ത്രിമാർ
  rationale: യഹൂദരുടെ തിരുവെഴുത്ത്-നിയമ വിദഗ്ധരെ സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾ പ്രയോഗത്തിൽ സ്ഥാപിതമായ പദം.
- source_word: Φαρισαῖοι
  choice: പരീശന്മാർ
  rationale: ചരിത്രപരമായ സംഘനാമത്തിന്റെ മലയാളത്തിൽ സ്ഥാപിതമായ ലിപ്യന്തരണം.
- source_word: ὑποκριταί
  choice: കപടഭക്തർ
  rationale: ഈ സന്ദർഭത്തിലെ മതപരവും ധാർമികവുമായ നടിപ്പ് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി അറിയിക്കുന്നു; വെറും ‘കപടന്മാർ’ എന്നതിനെക്കാൾ സന്ദർഭോചിതം.
- source_word: ὅτι
  choice: (തുടർന്നുള്ള പ്രസ്താവനയിലൂടെ കാരണം)
  rationale: മലയാളത്തിലെ സ്വാഭാവിക ശൈലിയിൽ പ്രത്യേകമായി ‘കാരണം’ ചേർക്കാതെ, ‘ഹാ കഷ്ടം!’ എന്ന പ്രഖ്യാപനത്തിനു പിന്നാലെയുള്ള വാക്യം അതിന്റെ കാരണം വ്യക്തമാക്കുന്നു.
- source_word: οἰκοδομεῖτε
  choice: പണിയുന്നു
  rationale: വർത്തമാനകാലത്തിലുള്ള പ്രവർത്തനം നേരിട്ട് നൽകുന്നു; മൂലത്തിൽ നിർബന്ധമില്ലാത്ത ‘വീണ്ടും പണിയുന്നു’ എന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: τάφους
  choice: കല്ലറകൾ
  rationale: നിർമിക്കപ്പെടുന്ന അടക്കസ്ഥലങ്ങളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക പദം; μνημεῖα എന്ന തുടർപദത്തിൽനിന്ന് വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: προφητῶν
  choice: പ്രവാചകന്മാരുടെ
  rationale: ബന്ധസൂചക ഷഷ്ഠി നേരിട്ട് പുനരാവിഷ്കരിക്കുന്നു.
- source_word: κοσμεῖτε
  choice: അലങ്കരിക്കുന്നു
  rationale: ഭംഗിയാക്കുകയോ അലങ്കാരം ചേർക്കുകയോ ചെയ്യുന്നതെന്ന ഗ്രീക്ക് അർത്ഥം വ്യക്തമായി നൽകുന്നു.
- source_word: μνημεῖα
  choice: ശവകുടീരങ്ങൾ
  rationale: മരണപ്പെട്ടവരെ അനുസ്മരിപ്പിക്കുന്ന കല്ലറസ്മാരകങ്ങൾ എന്ന സന്ദർഭാർഥം നൽകുന്നു; τάφους എന്നതിന് ഉപയോഗിച്ച ‘കല്ലറകൾ’ ആവർത്തിക്കാതെ പദവ്യത്യാസം സൂക്ഷിക്കുന്നു.
- source_word: δικαίων
  choice: നീതിമാന്മാരുടെ
  rationale: വിശേഷണത്തിന്റെ നാമവാചകപ്രയോഗം സംക്ഷിപ്തമായി നൽകുകയും ധാർമിക-ദൈവശാസ്ത്രപരമായ വിഭാഗം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: δικαίων എന്നതിന്റെ അർത്ഥം
  choice: നീതിമാന്മാർ
  alternative: ന്യായവാന്മാർ / സത്യനിഷ്ഠർ
  rationale: ഇവിടെ ഇസ്രായേലിന്റെ വിശ്വസ്തരായ മുൻകാല വ്യക്തികളെയാണ് ധാർമിക വിഭാഗമായി സൂചിപ്പിക്കുന്നത്; ‘നീതിമാന്മാർ’ മൂലത്തിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു, പ്രത്യേക സിദ്ധാന്തവ്യാഖ്യാനം ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: ὑποκριταί എന്ന അഭിസംബോധന
  choice: കപടഭക്തർ
  alternative: കപടന്മാർ
  rationale: മത്തായിയിലെ ഈ മതനേതൃത്വവിമർശനത്തിൽ പുറമേയുള്ള ഭക്തിയും ഉള്ളിലെ അസത്യവും തമ്മിലുള്ള സംഘർഷം വ്യക്തമാക്കുന്നു; എന്നിരുന്നാലും പൊതുവായ ധാർമിക കപടതയും ഉൾക്കൊള്ളുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള പ്രവാചകീയ ശൈലി. അഭിസംബോധന ആദ്യം കൊണ്ടുവന്ന് ‘നിങ്ങൾക്കു ഹാ കഷ്ടം!’ എന്ന വിധിപ്രഖ്യാപനം സ്വാഭാവികമാക്കി. മൂലത്തിലെ τάφους/μνημεῖα വ്യത്യാസം ‘കല്ലറകൾ/ശവകുടീരങ്ങൾ’ ആയി ഭാഗികമായി നിലനിർത്തി; രണ്ടാമത്തെ പദത്തിന്റെ അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
