revisions:
- from: കപടഭക്തരായ ശാസ്ത്രിമാരേ, പരീശന്മാരേ, നിങ്ങൾക്കു ഹാ കഷ്ടം! പ്രവാചകന്മാരുടെ കല്ലറകൾ നിങ്ങൾ പണിയുകയും നീതിമാന്മാരുടെ ശവകുടീരങ്ങൾ[a] അലങ്കരിക്കുകയും ചെയ്യുന്നു.
  to: ശാസ്ത്രിമാരേ, പരീശന്മാരേ, കപടന്മാരേ, നിങ്ങൾക്കു അയ്യോ, കഷ്ടം! കാരണം, നിങ്ങൾ പ്രവാചകന്മാരുടെ കല്ലറകൾ പണിയുകയും നീതിമാന്മാരുടെ സ്മാരകങ്ങൾ[a] അലങ്കരിക്കുകയും ചെയ്യുന്നു.
