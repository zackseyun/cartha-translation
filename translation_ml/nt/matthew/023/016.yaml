  terminology: ‘അന്ധരായ വഴികാട്ടികൾ,’ ‘ദേവാലയം,’ ‘സ്വർണം,’ and ‘സത്യം ചെയ്യുക’ are apt and consistent. ‘ബാധ്യസ്ഥനാണ്’ suitably expresses obligation without importing an explicit phrase such as ‘by that oath.’
