language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, ὁδηγοὶ τυφλοὶ οἱ λέγοντες· Ὃς ἂν ὀμόσῃ ἐν τῷ ναῷ, οὐδέν ἐστιν, ὃς δ’ ἂν ὀμόσῃ ἐν τῷ χρυσῷ τοῦ ναοῦ ὀφείλει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/016.yaml
  text: Woe to you[a], blind guides, who say, ‘Whoever swears by the temple, it is nothing[b]; but whoever swears by the gold of the temple is bound.’
translation:
  language: ml
  text: “അന്ധരായ വഴികാട്ടികളേ, നിങ്ങൾക്കു കഷ്ടം! ‘ആരെങ്കിലും ദേവാലയത്തെച്ചൊല്ലി സത്യം ചെയ്താൽ അതു കാര്യമില്ല[a]; എന്നാൽ ദേവാലയത്തിലെ സ്വർണത്തെച്ചൊല്ലി സത്യം ചെയ്താൽ അയാൾ ബാധ്യസ്ഥനാണ്’ എന്നു നിങ്ങൾ പറയുന്നു.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “അത് ഒന്നുമല്ല”; അതായത്, അത്തരമൊരു സത്യം ബാധകമല്ലെന്നാണ് അവർ കണക്കാക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαὶ ὑμῖν
  choice: നിങ്ങൾക്കു ഹാ കഷ്ടം!
  rationale: പ്രവാചകീയമായ അപലപനത്തിന്റെയും വരാനിരിക്കുന്ന ന്യായവിധിയുടെയും ശക്തി നിലനിർത്തുന്ന, മലയാളത്തിൽ ഗൗരവമുള്ള പ്രയോഗം.
- source_word: ὁδηγοὶ τυφλοὶ
  choice: അന്ധരായ വഴികാട്ടികളേ
  rationale: മറ്റുള്ളവർക്കു വഴി കാണിക്കുന്നവർ തന്നെയാണ് അന്ധർ എന്ന മൂലരൂപകം നേരിട്ടും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: οἱ λέγοντες
  choice: എന്നു നിങ്ങൾ പറയുന്നു
  rationale: ആർട്ടിക്കുലർ പാർട്ടിസിപ്പിളിന്റെ ആശയം മലയാളത്തിൽ സ്വാഭാവികമായ നേരിട്ടുള്ള വാക്യഘടനയായി നൽകുന്നു.
- source_word: Ὃς ἂν ὀμόσῃ
  choice: ആരെങ്കിലും ... സത്യം ചെയ്താൽ
  rationale: ἄν സഹിതമുള്ള അയോരിസ്റ്റ് സബ്ജങ്‌ടീവ് സൂചിപ്പിക്കുന്ന അനിശ്ചിത പൊതുനിബന്ധന മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐν τῷ ναῷ
  choice: ദേവാലയത്തെച്ചൊല്ലി
  rationale: ἐν എന്നതിന്റെ അക്ഷരാർഥം ‘അകത്ത്’ എന്നാണെങ്കിലും, ഇവിടെ സത്യപ്രതിജ്ഞയിൽ ദേവാലയത്തെ ആധാരമാക്കി ആണയിടുന്നതാണ് സന്ദർഭാർഥം; ‘ത്തെച്ചൊല്ലി’ ആ സൂത്രഭാഷ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: οὐδέν ἐστιν
  choice: അതു കാര്യമില്ല
  rationale: ‘അതു ഒന്നുമല്ല’ എന്ന ഗ്രീക്കിലെ സംക്ഷിപ്തവും അർധോക്തവുമായ പ്രയോഗത്തെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുകയും, ആ സത്യം ബാധകമല്ലെന്ന സന്ദർഭാർഥം സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: χρυσῷ τοῦ ναοῦ
  choice: ദേവാലയത്തിലെ സ്വർണം
  rationale: ദേവാലയവും അതിലുള്ള സ്വർണവും തമ്മിലുള്ള വിരോധം വ്യക്തമായി കാത്തുസൂക്ഷിക്കുന്ന സ്വാഭാവിക മലയാളം.
- source_word: ὀφείλει
  choice: അയാൾ ബാധ്യസ്ഥനാണ്
  rationale: ‘കടപ്പെട്ടിരിക്കുന്നു/ബാധ്യസ്ഥനാണ്’ എന്ന നിയമ-ധാർമ്മിക ബാധ്യതയുടെ അർഥം നൽകുന്നു; ഗ്രീക്കിൽ വ്യക്തമാക്കാത്ത കർമം കൂട്ടിച്ചേർക്കുന്നില്ല.
theological_decisions:
- issue: സത്യപ്രതിജ്ഞയുടെ ബാധ്യതയെക്കുറിച്ചുള്ള അർധോക്തി
  choice: ആദ്യ ഭാഗത്ത് ‘അതു കാര്യമില്ല’ എന്നും രണ്ടാം ഭാഗത്ത് ‘അയാൾ ബാധ്യസ്ഥനാണ്’ എന്നും നൽകി അർധോക്തിയും വിരോധവും നിലനിർത്തി.
  alternative: ‘ആ സത്യം ബാധകമല്ല ... ആ സത്യം പാലിക്കാൻ അയാൾ ബാധ്യസ്ഥനാണ്’ എന്നു രണ്ടിടത്തും ആശയം പൂർണമായി വിശദീകരിക്കുക.
  rationale: വാക്യം സത്യപ്രതിജ്ഞകളെ ബാധകവും അബാധകവുമായി തിരിക്കുന്ന സൂക്ഷ്മനിയമവാദത്തെ വിമർശിക്കുന്നു. മൂലത്തിലെ οὐδέν ἐστιν, ὀφείλει എന്നീ സംക്ഷിപ്ത പ്രയോഗങ്ങളെ അനാവശ്യമായി സിദ്ധാന്തവത്കരിക്കാതെ വായനാസൗകര്യത്തോടെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവവും സാധാരണ വായനക്കാർക്കുള്ള വ്യക്തതയും പുലർത്തുന്ന മലയാളം. ‘ദേവാലയത്തെച്ചൊല്ലി സത്യം ചെയ്യുക’ എന്ന പ്രയോഗം സത്യപ്രതിജ്ഞയുടെ സന്ദർഭാർഥം നൽകുന്നു; അന്ധരായ വഴികാട്ടികൾ എന്ന മൂലരൂപകം സംരക്ഷിച്ചിരിക്കുന്നു.
