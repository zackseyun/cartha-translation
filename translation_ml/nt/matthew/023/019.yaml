id: MAT.23.19
reference: Matthew 23:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀τυφλοί, τί γὰρ μεῖζον, τὸ δῶρον ἢ τὸ θυσιαστήριον τὸ ἁγιάζον τὸ δῶρον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/019.yaml
  text: Blind men[a], for which is greater[b], the gift or the altar that sanctifies the gift?
translation:
  language: ml
  text: 'അന്ധരേ, ഏതാണ് വലിയത്: വഴിപാടോ വഴിപാടിനെ വിശുദ്ധമാക്കുന്ന യാഗപീഠമോ?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τυφλοί
  choice: അന്ധരേ
  rationale: വിശേഷണം നാമമായി ഉപയോഗിച്ചിരിക്കുന്ന ബഹുവചന സംബോധനയാണ്. ‘മൂഢരേ’ എന്ന അധിക്ഷേപം ഈ വാക്യത്തിൽ ഗ്രീക്കിൽ ഇല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല.
- source_word: τί γὰρ μεῖζον
  choice: ഏതാണ് വലിയത്
  rationale: താരതമ്യചോദ്യത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം; μεῖζον എന്നതിന്റെ ‘വലിയത്’ എന്ന അർഥം നിലനിർത്തുന്നു. γάρ ഇവിടെ മുൻവാക്യത്തിലെ ശാസനയുടെ വിശദീകരണബന്ധം സൂചിപ്പിക്കുന്നുവെങ്കിലും സ്വതന്ത്രമായി ‘എന്തെന്നാൽ’ ചേർക്കുന്നത് മലയാളത്തിൽ അസ്വാഭാവികമായതിനാൽ ചോദ്യഘടനയിലൂടെ ബന്ധം പ്രകടമാക്കുന്നു.
- source_word: τὸ δῶρον
  choice: വഴിപാട്
  rationale: δῶρον അടിസ്ഥാനമായി ‘സമ്മാനം/ദാനം’ എന്നാണെങ്കിലും ഇവിടെ ദേവാലയ-യാഗസന്ദർഭത്തിൽ അർപ്പിക്കപ്പെട്ട വസ്തുവിനെയാണ് സൂചിപ്പിക്കുന്നത്; ആ അർഥം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നത് ‘വഴിപാട്’ ആണ്.
- source_word: θυσιαστήριον
  choice: യാഗപീഠം
  rationale: യാഗാരാധനാസന്ദർഭത്തിലെ θυσιαστήριον എന്ന പദത്തിന്റെ പതിവും വ്യക്തവുമായ മലയാളസമാനപദം.
- source_word: τὸ ἁγιάζον
  choice: വിശുദ്ധമാക്കുന്ന
  rationale: വർത്തമാന കൃദന്തരൂപം യാഗപീഠം വഴിപാടിന് വിശുദ്ധി നൽകുന്നു എന്ന ബന്ധം പ്രകടമാക്കുന്നു; ‘വിശുദ്ധീകരിക്കുന്ന’ എന്നതിനെക്കാൾ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും വ്യക്തവുമാണ്.
theological_decisions:
- issue: യാഗപീഠവും വഴിപാടും തമ്മിലുള്ള ἁγιάζω എന്ന ആരാധനാപരമായ ബന്ധം
  choice: വഴിപാടിനെ വിശുദ്ധമാക്കുന്ന
  alternative: വഴിപാടിനെ വിശുദ്ധീകരിക്കുന്ന / സമർപ്പിതമാക്കുന്ന
  rationale: യാഗപീഠം വഴിപാടിന് വിശുദ്ധി നൽകുന്നു എന്ന വാക്യത്തിന്റെ ദേവാലയ-വിശുദ്ധി യുക്തി നേരിട്ട് നിലനിർത്തുന്നു. ‘സമർപ്പിതമാക്കുന്ന’ എന്നത് അർഥത്തെ വെറും വേർതിരിച്ചുവെക്കലായി ചുരുക്കാൻ ഇടയുള്ളതിനാൽ ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ നേരിട്ടുള്ള, ഗൗരവമുള്ള ശാസനാഭാവം നിലനിർത്തി. ഗ്രീക്കിൽ ഈ വാക്യത്തിൽ ‘മൂഢർ’ ഇല്ലാത്തതിനാൽ ‘അന്ധമൂഢരേ’ എന്ന് വികസിപ്പിച്ചിട്ടില്ല. പ്രസിദ്ധീകരണപാഠത്തിൽ അടിക്കുറിപ്പ് ആവശ്യമില്ല.
