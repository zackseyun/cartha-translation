id: MAT.23.39
reference: Matthew 23:39
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν, οὐ μή με ἴδητε ἀπ’ ἄρτι ἕως ἂν εἴπητε· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/039.yaml
  text: For I tell you[a], from now on you will certainly not see me until you say[b], ‘Blessed is he who comes in the name of the Lord.’
translation:
  language: ml
  text: 'എന്തെന്നാൽ, ഞാൻ നിങ്ങളോടു പറയുന്നു: ഇനിമുതൽ, ‘കർത്താവിന്റെ നാമത്തിൽ വരുന്നവൻ അനുഗ്രഹിക്കപ്പെട്ടവൻ’[b] എന്ന് നിങ്ങൾ പറയുന്നതുവരെ, നിങ്ങൾ എന്നെ തീർച്ചയായും കാണുകയില്ല.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇനിമുതൽ നിങ്ങൾ എന്നെ ഒരുവിധത്തിലും കാണുകയില്ല—നിങ്ങൾ പറയുന്നതുവരെ.’ ഗ്രീക്കിൽ ശക്തമായ നിഷേധരൂപമായ οὐ μή ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: സങ്കീർത്തനം 118:26-ൽ നിന്നുള്ള ഉദ്ധരണി/സൂചന.
    reason: cross_reference
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: എന്തെന്നാൽ, ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: λέγω ... ὑμῖν എന്ന നേരിട്ടുള്ള അഭിസംബോധന സ്വാഭാവികമായി നൽകുകയും γάρ-ന്റെ മുൻവാക്യത്തോടുള്ള വിശദീകരണബന്ധം ‘എന്തെന്നാൽ’കൊണ്ട് നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: οὐ μή ... ἴδητε
  choice: നിങ്ങൾ എന്നെ തീർച്ചയായും കാണുകയില്ല
  rationale: οὐ μήയും aorist subjunctive-ഉം ചേർന്നുള്ള ശക്തമായ നിഷേധം ‘തീർച്ചയായും ... കാണുകയില്ല’ എന്നു വ്യക്തമാക്കി; ‘ഒരിക്കലും’ എന്നു പറഞ്ഞ് until-വാക്യത്തിന്റെ പരിധി മങ്ങിക്കുന്നത് ഒഴിവാക്കുന്നു.
- source_word: ἀπ’ ἄρτι
  choice: ഇനിമുതൽ
  rationale: ഇപ്പോഴാരംഭിക്കുന്ന കാലപരിധിയെ ആധുനികവും സംക്ഷിപ്തവുമായ മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἕως ἂν εἴπητε
  choice: എന്ന് നിങ്ങൾ പറയുന്നതുവരെ
  rationale: ഭാവിയിലെ ഒരു പരിധിയെയോ നിബന്ധനാപരമായ അന്ത്യബിന്ദുവെയോ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ഘടനയുടെ അർത്ഥം നിലനിർത്തുന്നു.
- source_word: Εὐλογημένος
  choice: അനുഗൃഹീതൻ
  rationale: സങ്കീർത്തന ഉദ്ധരണിയിലെ ആശീർവാദപ്രഖ്യാപനത്തിന്റെ തിരുവെഴുത്തുസ്വരം നിലനിർത്തുന്നു; ‘സ്തുതിക്കപ്പെട്ടവൻ’ എന്നതിലേക്കു മാത്രം അർത്ഥം ചുരുക്കുന്നില്ല.
- source_word: ὁ ἐρχόμενος
  choice: വരുന്നവൻ
  rationale: articular participle-നെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; സന്ദർഭം ആവശ്യപ്പെടുന്നതിലധികം പദവിനാമപരമായ അർത്ഥം ചേർക്കുന്നില്ല.
- source_word: ἐν ὀνόματι κυρίου
  choice: കർത്താവിന്റെ നാമത്തിൽ
  rationale: ഗ്രീക്ക് prepositional phrase-ഉം സങ്കീർത്തനത്തിന്റെ പരിചിതമായ തിരുവെഴുത്തുശൈലിയും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ഭാവിയിൽ ‘കാണുന്നതും’ ഉദ്ധരിച്ച വാക്കുകൾ പറയുന്നതും ഏത് സംഭവത്തെ സൂചിപ്പിക്കുന്നു
  choice: കൃത്യമായ ചരിത്രപരമോ അന്ത്യകാലപരമോ ആയ സംഭവം നിർണ്ണയിക്കാതെ, ഭാവിയിലെ അംഗീകാരംവരെ നിലനിൽക്കുന്ന അഭാവത്തെ വാചകം പറയുന്നതുപോലെ നിലനിർത്തി.
  alternative: ഇത് വിജയപ്രവേശനത്തെയോ രണ്ടാം വരവിനെയോ ഇസ്രായേലിന്റെ ഭാവി മാനസാന്തരത്തെയോ മാത്രമായി വ്യാഖ്യാനിക്കുക.
  rationale: ഗ്രീക്ക് വാചകം സമയപരിധിയുടെ അന്ത്യബിന്ദുവായി അവരുടെ പ്രഖ്യാപനത്തെ പറയുന്നു; എന്നാൽ അതിന്റെ കൃത്യമായ സംഭവമോ കാലക്രമമോ വ്യക്തമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ഉദ്ധരണിക്ക് തിരുവെഴുത്തുസ്വരം നിലനിർത്തിയിട്ടുണ്ട്. [a], [b] എന്നീ അടിക്കുറിപ്പുസൂചകങ്ങൾ രണ്ടും മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
