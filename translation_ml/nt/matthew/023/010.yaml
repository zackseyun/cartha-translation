id: MAT.23.10
reference: Matthew 23:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μηδὲ κληθῆτε καθηγηταί, ⸂ὅτι καθηγητὴς ὑμῶν ἐστιν εἷς⸃ ὁ χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/010.yaml
  text: Do not be called instructors, for you have one instructor, the Messiah[a].
translation:
  language: ml
  text: നിങ്ങളെ ‘മാർഗദർശകർ’ എന്നു വിളിക്കരുത്; കാരണം നിങ്ങൾക്ക് ഒരേയൊരു മാർഗദർശകനേയുള്ളൂ[b]—മശീഹാ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ക്രിസ്തു.’
    reason: lexical_alternative
  - marker: b
    text: ‘കാരണം നിങ്ങൾക്ക് ഒരേയൊരു മാർഗദർശകനേയുള്ളൂ’ എന്നതിനു പിന്നിലുള്ള ഗ്രീക്ക് വാക്കുകൾ ഈ പതിപ്പിൽ ചതുരക്കൊളുത്തിനുള്ളിലാണ്; ഇത് പാഠപരമായ അനിശ്ചിതത്വം സൂചിപ്പിക്കുന്നു.
    reason: textual_uncertainty
lexical_decisions:
- source_word: μηδὲ
  choice: വിളിക്കരുത്
  rationale: മുൻവാക്യങ്ങളിലെ നിരോധനത്തിന്റെ തുടർച്ചയാണ് μηδὲ സൂചിപ്പിക്കുന്നത്; എന്നാൽ ഒറ്റവാക്യമായി സ്വാഭാവികമായ മലയാളത്തിൽ പ്രത്യേകമായി ‘കൂടാതെ’ ചേർക്കേണ്ടതില്ല.
- source_word: κληθῆτε
  choice: നിങ്ങളെ … എന്നു വിളിക്കരുത്
  rationale: καλέω എന്ന ക്രിയയുടെ കർമണിപ്രയോഗം ഇവിടെ ഒരു സ്ഥാനപ്പേരിൽ അഭിസംബോധന ചെയ്യപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: καθηγηταί / καθηγητής
  choice: മാർഗദർശകർ / മാർഗദർശകൻ
  rationale: ഈ പദത്തിന് നയിക്കുകയും പ്രബോധിപ്പിക്കുകയും ചെയ്യുന്നവൻ എന്ന അർഥമുണ്ട്. സമീപവാക്യത്തിലെ διδάσκαλος എന്ന ‘ഗുരു/ഉപദേഷ്ടാവ്’ പദവുമായി വ്യത്യാസം നിലനിർത്താൻ ‘മാർഗദർശകൻ’ തിരഞ്ഞെടുത്തു.
- source_word: ὅτι
  choice: കാരണം
  rationale: നിരോധനത്തിനുള്ള കാരണം നേരിട്ടും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
- source_word: ὑμῶν ἐστιν εἷς
  choice: നിങ്ങൾക്ക് ഒരേയൊരു … മാത്രമേയുള്ളൂ
  rationale: ഗ്രീക്കിലെ ഉടമസ്ഥതാബന്ധവും ഒരേയൊരാൾ എന്ന ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὁ χριστός
  choice: മശീഹാ
  rationale: നിശ്ചയാർഥക ഉപപദത്തോടുകൂടിയ Χριστός ഇവിടെ ഒരു സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നു; യഹൂദ മശീഹാപശ്ചാത്തലം വ്യക്തമാക്കുന്ന മലയാളരൂപം ഉപയോഗിച്ചു.
theological_decisions:
- issue: Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ പദം പേരുപോലെ മാത്രമല്ല, അഭിഷിക്തനായ പ്രതീക്ഷിത രാജാവിനെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരായാണ് വരുന്നത്. അതിനാൽ ‘മശീഹാ’ മുഖ്യവാചകത്തിലും ‘ക്രിസ്തു’ പാദക്കുറിപ്പിലും നൽകി.
- issue: καθηγητής എന്ന പദത്തിന്റെ അർഥപരിധി
  choice: മാർഗദർശകൻ
  alternative: ഉപദേഷ്ടാവ് / നേതാവ് / ഗുരു
  rationale: നയിക്കൽ, പ്രബോധനം എന്നീ ആശയങ്ങൾ ഉൾക്കൊള്ളുന്ന പദമാണിത്. ‘ഗുരു’ എന്നു നൽകിയാൽ സമീപസന്ദർഭത്തിലെ διδάσκαλος-നോടുള്ള പദവ്യത്യാസം മങ്ങാം; ‘നേതാവ്’ മാത്രം നൽകിയാൽ പ്രബോധനവശം നഷ്ടപ്പെടാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. സ്ഥാനപ്പേരായി വിളിക്കപ്പെടുക എന്ന ആശയം ഉദ്ധരണിചിഹ്നങ്ങളിലൂടെ വ്യക്തമാക്കി; ഗ്രീക്കിലെ ഏകത്വഊന്നൽ ‘ഒരേയൊരു … മാത്രമേയുള്ളൂ’ എന്ന പ്രയോഗത്തിൽ സംരക്ഷിച്ചു.
