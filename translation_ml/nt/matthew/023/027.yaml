id: MAT.23.27
reference: Matthew 23:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι ⸀παρομοιάζετε τάφοις κεκονιαμένοις, οἵτινες ἔξωθεν μὲν φαίνονται ὡραῖοι ἔσωθεν δὲ γέμουσιν ὀστέων νεκρῶν καὶ πάσης ἀκαθαρσίας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/027.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! For you are like whitewashed tombs, which outwardly appear beautiful[b], but inwardly are full of dead people's bones and every kind of uncleanness.
translation:
  language: ml
  text: നിയമശാസ്ത്രജ്ഞരേ, പരീശരേ, കപടക്കാരേ, ഹാ, നിങ്ങൾക്കു കഷ്ടം! നിങ്ങൾ കുമ്മായം പൂശിയ കല്ലറകൾ പോലെയാണ്[a]. അവ പുറമേ മനോഹരമായി കാണപ്പെടുന്നു; എന്നാൽ അകത്ത് മരിച്ചവരുടെ അസ്ഥികളും സകലവിധ അശുദ്ധിയും[b] നിറഞ്ഞിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കുമ്മായംകൊണ്ട് വെള്ളപൂശിയ ശവകുടീരങ്ങൾ.’
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘അശുദ്ധി’ എന്നത് ആചാരപരമായ മാലിന്യത്തെയും ധാർമിക ദുഷിപ്പിനെയും ഉൾക്കൊള്ളാം.
    reason: cultural_note
lexical_decisions:
- source_word: Οὐαὶ
  choice: ഹാ കഷ്ടം
  rationale: പ്രവാചകീയമായ അപലപനത്തിന്റെയും വരാനിരിക്കുന്ന ന്യായവിധിയുടെയും ശക്തി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: γραμματεῖς
  choice: നിയമശാസ്ത്രജ്ഞർ
  rationale: യഹൂദനിയമത്തിൽ പ്രാവീണ്യമുള്ള ഈ വിഭാഗത്തെ ആധുനിക വായനക്കാർക്ക് വ്യക്തമായി സൂചിപ്പിക്കുന്നു; വെറും എഴുത്തുകാരെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: Φαρισαῖοι
  choice: പരീശർ
  rationale: ഈ യഹൂദ മതവിഭാഗത്തിന്റെ മലയാളത്തിൽ സ്ഥാപിതമായ പേരുരൂപം.
- source_word: ὑποκριταί
  choice: കപടക്കാർ
  rationale: ഇവിടെ കുറ്റപ്പെടുത്തപ്പെടുന്ന പുറംഭാവവും ഉള്ളിലെ യാഥാർഥ്യവും തമ്മിലുള്ള വൈരുധ്യം ലളിതവും ശക്തവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: παρομοιάζετε
  choice: പോലെയാണ്
  rationale: നേരിട്ടുള്ള താരതമ്യം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: τάφοις κεκονιαμένοις
  choice: കുമ്മായം പൂശിയ കല്ലറകൾ
  rationale: കല്ലറകൾക്ക് കുമ്മായം പൂശുന്ന സാംസ്കാരിക ദൃശ്യം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἔξωθεν μὲν ... ἔσωθεν δὲ
  choice: പുറമേ ... എന്നാൽ അകത്ത്
  rationale: ബാഹ്യരൂപവും ആന്തരിക യാഥാർഥ്യവും തമ്മിലുള്ള മൂർച്ചയുള്ള വിരോധം നിലനിർത്തുന്നു.
- source_word: φαίνονται ὡραῖοι
  choice: മനോഹരമായി കാണപ്പെടുന്നു
  rationale: യഥാർഥ സൗന്ദര്യമെന്നതിനേക്കാൾ കാഴ്ചയിലെ ഭംഗിക്കാണ് ഊന്നൽ നൽകുന്നത്.
- source_word: γέμουσιν
  choice: നിറഞ്ഞിരിക്കുന്നു
  rationale: മൂലത്തിലെ വർത്തമാനകാലാവസ്ഥ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὀστέων νεκρῶν
  choice: മരിച്ചവരുടെ അസ്ഥികൾ
  rationale: ഗ്രീക്ക് ജനിറ്റീവ് ഘടനയുടെ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: πάσης ἀκαθαρσίας
  choice: സകലവിധ അശുദ്ധി
  rationale: ആചാരപരവും ധാർമികവുമായ അർഥസാധ്യതകളെ ചുരുക്കാതെ വിശാലമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἀκαθαρσία എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി
  choice: അശുദ്ധി
  alternative: ആചാരപരമായ അശുദ്ധി മാത്രം / ധാർമിക ദുഷിപ്പ് മാത്രം
  rationale: കല്ലറകളുടെ ചിത്രം യഹൂദ ആചാരപരമായ അശുദ്ധിയെ ഓർമിപ്പിക്കുമ്പോഴും സന്ദർഭം ഉള്ളിലെ ധാർമിക ദുഷിപ്പിനെയും സൂചിപ്പിക്കുന്നു. പൊതുവായ പദം ഈ ഇരട്ട അർഥസാധ്യത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായെങ്കിലും ഗൗരവവും അപലപനത്തിന്റെ ശക്തിയും നിലനിർത്തുന്ന ഭാഷ. വാക്യത്തിലെ പുറം–അകം വൈരുധ്യം വ്യക്തമായി സൂക്ഷിച്ചിട്ടുണ്ട്.
