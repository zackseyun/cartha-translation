id: MAT.23.22
reference: Matthew 23:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὁ ὀμόσας ἐν τῷ οὐρανῷ ὀμνύει ἐν τῷ θρόνῳ τοῦ θεοῦ καὶ ἐν τῷ καθημένῳ ἐπάνω αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/022.yaml
  text: And whoever swears by heaven swears by the throne of God and by the one seated upon it[a].
translation:
  language: ml
  text: സ്വർഗത്തെച്ചൊല്ലി സത്യം ചെയ്യുന്നവൻ ദൈവത്തിന്റെ സിംഹാസനത്തെയും അതിൽ ഇരിക്കുന്നവനെയും ചൊല്ലിയാണ് സത്യം ചെയ്യുന്നത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അതിൽ ഇരുന്നുകൊണ്ടിരിക്കുന്നവനെയും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ὀμόσας
  choice: സത്യം ചെയ്യുന്നവൻ
  rationale: നാമവാചകമായി ഉപയോഗിച്ചിരിക്കുന്ന ഭൂതകാല കൃദന്തം ഇവിടെ ഒരു പൊതുതത്ത്വം സൂചിപ്പിക്കുന്നു; അതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ വർത്തമാനകാല പ്രയോഗം സ്വീകരിച്ചു.
- source_word: ἐν
  choice: -യെച്ചൊല്ലി / -നെയും ... ചൊല്ലി
  rationale: സത്യപ്രതിജ്ഞാസൂത്രത്തിൽ ἐν സ്ഥലസൂചകമായ ‘ൽ’ എന്നതിലുപരി ‘ആരെ/എന്തിനെ ചൊല്ലി’ എന്ന അർഥത്തിലാണ്; ആവർത്തിക്കുന്ന പ്രയോഗങ്ങളിലും ഇതേ അർഥം നിലനിർത്തി.
- source_word: οὐρανῷ
  choice: സ്വർഗം
  rationale: ദൈവത്തിന്റെ സിംഹാസനവുമായി ഉടൻ ബന്ധിപ്പിക്കപ്പെടുന്നതിനാൽ ഇവിടെ ഉദ്ദേശിക്കുന്നത് ഭൗതിക ആകാശമല്ല, സ്വർഗമാണ്.
- source_word: ὀμνύει
  choice: സത്യം ചെയ്യുന്നു
  rationale: വർത്തമാനകാല ക്രിയ പൊതുവായ ഒരു സത്യം പ്രസ്താവിക്കുന്നു; മലയാളത്തിൽ ‘സത്യം ചെയ്യുന്നു’ എന്ന ലളിതമായ പ്രയോഗം സ്വാഭാവികമാണ്.
- source_word: θρόνῳ τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ സിംഹാസനം
  rationale: ഗ്രീക്കിലെ വ്യക്തമായ ബന്ധവിഭക്തി ഘടനയും ഗൗരവമുള്ള ഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: τῷ καθημένῳ
  choice: ഇരിക്കുന്നവൻ
  rationale: സിംഹാസനത്തിൽ ഉപവിഷ്ടനായിരിക്കുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്ന കൃദന്തരൂപം; ദൈവം എന്ന പേര് പകരം ചേർക്കാതെ മൂലത്തിലെ പരോക്ഷസൂചന നിലനിർത്തുന്നു.
- source_word: ἐπάνω αὐτοῦ
  choice: അതിൽ
  rationale: സർവനാമം ദൈവത്തിന്റെ സിംഹാസനത്തെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ സിംഹാസനത്തിൽ ഇരിക്കുന്നതിനെ ‘അതിൽ’ എന്നു പറയുന്നതാണ് ‘അതിനു മുകളിൽ’ എന്നതിനെക്കാൾ സ്വാഭാവികവും അർഥവ്യക്തവുമായത്.
theological_decisions:
- issue: ‘അതിൽ ഇരിക്കുന്നവൻ’ എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: സ്വർഗത്തിൽ സിംഹാസനസ്ഥനായ ദൈവത്തെ സൂചിപ്പിക്കുന്ന ആദരപൂർവമായ പരോക്ഷപ്രയോഗം
  alternative: വ്യക്തിയെ തിരിച്ചറിയിക്കാതെ ‘അവിടെ ഇരിക്കുന്നവൻ’ എന്ന കൂടുതൽ അനിശ്ചിതമായ പ്രയോഗം
  rationale: ‘ദൈവത്തിന്റെ സിംഹാസനം’ എന്ന തൊട്ടുമുമ്പുള്ള പ്രയോഗം സൂചിതവ്യക്തിയെ വ്യക്തമാക്കുന്നു; എങ്കിലും മൂലപാഠത്തിലെ പരോക്ഷപ്രയോഗം മാറ്റി പ്രധാനവാക്യത്തിൽ നേരിട്ട് ‘ദൈവം’ എന്നു ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. സത്യപ്രതിജ്ഞയുടെ ആശയം വ്യക്തമാക്കാൻ ‘-യെച്ചൊല്ലി സത്യം ചെയ്യുക’ എന്ന സാധാരണ പ്രയോഗം ഉപയോഗിച്ചു; മൂലത്തിലെ ആവർത്തനവും ദൈവത്തെക്കുറിച്ചുള്ള പരോക്ഷസൂചനയും സംരക്ഷിച്ചു.
