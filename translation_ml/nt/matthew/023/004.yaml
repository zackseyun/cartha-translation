  terminology: ‘ഭാരമുള്ള ചുമടുകൾ,’ ‘മനുഷ്യരുടെ തോളുകളിൽ,’ and ‘വിരൽകൊണ്ടുപോലും’ are appropriate, natural, and theologically non-interpretive. No footnote is needed for ‘മനുഷ്യരുടെ,’ which naturally has the generic sense required here.
