id: MAT.23.4
reference: Matthew 23:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: δεσμεύουσιν ⸀δὲ φορτία ⸀βαρέα καὶ ἐπιτιθέασιν ἐπὶ τοὺς ὤμους τῶν ἀνθρώπων, ⸂αὐτοὶ δὲ τῷ⸃ δακτύλῳ αὐτῶν οὐ θέλουσιν κινῆσαι αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/004.yaml
  text: They tie up heavy burdens and lay them on the shoulders of men[a], but they themselves are unwilling to move them with their finger.
translation:
  language: ml
  text: അവർ ഭാരമുള്ള ചുമടുകൾ കെട്ടി മനുഷ്യരുടെ തോളുകളിൽ വെക്കുന്നു; എന്നാൽ അവ തങ്ങളുടെ വിരൽകൊണ്ടുപോലും നീക്കാൻ അവർതന്നെ മനസ്സില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεσμεύουσιν
  choice: കെട്ടി
  rationale: ചുമടുകൾ ബന്ധിച്ചൊരുക്കുന്ന ദൃശ്യബിംബം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: φορτία βαρέα
  choice: ഭാരമുള്ള ചുമടുകൾ
  rationale: യഥാർഥ ഭാരത്തിന്റെയും അടിച്ചേൽപ്പിക്കുന്ന ബാധ്യതകളുടെയും രൂപകാത്മക ശക്തി ഒരുപോലെ സംരക്ഷിക്കുന്നു.
- source_word: ἐπιτιθέασιν ἐπὶ τοὺς ὤμους
  choice: തോളുകളിൽ വെക്കുന്നു
  rationale: ഒരാളുടെ മേൽ ചുമട് വെക്കുന്ന മൂർത്തമായ ശരീരദൃശ്യം നേരിട്ട് പകർന്നുനൽകുന്നു.
- source_word: τῶν ἀνθρώπων
  choice: മനുഷ്യരുടെ
  rationale: ἄνθρωπος ഇവിടെ മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു; ആ ഉൾക്കൊള്ളുന്ന അർഥം ആധുനിക മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: αὐτοὶ δὲ
  choice: എന്നാൽ ... അവർതന്നെ
  rationale: മറ്റുള്ളവരുടെ മേൽ ചുമത്തുന്നതും സ്വന്തം വിസമ്മതവും തമ്മിലുള്ള ഊന്നിയ വൈരുധ്യം നിലനിർത്തുന്നു.
- source_word: τῷ δακτύλῳ αὐτῶν
  choice: തങ്ങളുടെ വിരൽകൊണ്ടുപോലും
  rationale: ഗ്രീക്കിലെ ഏകവചനമായ ‘വിരൽ’ നിലനിർത്തുകയും ഏറ്റവും ചെറിയ ശ്രമംപോലും ചെയ്യാത്തതെന്ന സൂചന സ്വാഭാവികമായി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: οὐ θέλουσιν κινῆσαι αὐτά
  choice: അവ നീക്കാൻ ... തയ്യാറാകുന്നില്ല
  rationale: കഴിവില്ലായ്മയല്ല, മനഃപൂർവമായ വിസമ്മതമാണ് θέλω സൂചിപ്പിക്കുന്നത്; κινέω എന്നതിന്റെ ‘നീക്കുക’ എന്ന അർഥവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ചുമടുകൾ യഥാർഥമാണോ രൂപകമാണോ എന്ന വ്യാഖ്യാനം
  choice: ‘ഭാരമുള്ള ചുമടുകൾ’ എന്ന മൂർത്തമായ രൂപകം വിശദീകരിക്കാതെ നിലനിർത്തി.
  alternative: നിയമപരമായ ആവശ്യങ്ങളോ മതചട്ടങ്ങളോ എന്ന് വാക്യത്തിൽ വ്യക്തമായി വ്യാഖ്യാനിക്കുക.
  rationale: സന്ദർഭം അടിച്ചേൽപ്പിക്കുന്ന ബാധ്യതകളെ സൂചിപ്പിച്ചാലും ഗ്രീക്ക് വാക്യം അവയെ പ്രത്യേകം നിർവചിക്കുന്നില്ല; അതിനാൽ രൂപകത്തിന്റെ വ്യാപ്തിയും വ്യാഖ്യാനസമ്മർദവും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ചുമടുകൾ കെട്ടി’, ‘തോളുകളിൽ വെക്കുന്നു’ എന്നീ പ്രയോഗങ്ങൾ മൂലത്തിലെ ദൃശ്യബിംബം നിലനിർത്തുന്നു. പൊതുവായ മനുഷ്യസൂചനയ്ക്ക് ‘മനുഷ്യരുടെ’ ഉപയോഗിച്ചതിനാൽ അടിക്കുറിപ്പ് ആവശ്യമില്ല.
