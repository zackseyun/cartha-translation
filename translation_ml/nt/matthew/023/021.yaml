id: MAT.23.21
reference: Matthew 23:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὁ ὀμόσας ἐν τῷ ναῷ ὀμνύει ἐν αὐτῷ καὶ ἐν τῷ ⸀κατοικοῦντι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/021.yaml
  text: And whoever swears by the temple swears by it and by the One dwelling in it[a].
translation:
  language: ml
  text: ദൈവാലയത്തെച്ചൊല്ലി സത്യം ചെയ്യുന്നവൻ അതിനെയും അതിൽ വസിക്കുന്നവനെയുംച്ചൊല്ലിയാണ് സത്യം ചെയ്യുന്നത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദൈവാലയത്തിൽവെച്ച് ... അതിൽവെച്ച്’; ഗ്രീക്കിലെ ἐν എന്ന പദത്തിന്റെ അക്ഷരാർഥം ‘ൽ/അകത്ത്’ എന്നാണ്. എന്നാൽ ഇവിടെ സത്യപ്രതിജ്ഞാസൂത്രത്തിൽ അതിന് ‘-യെച്ചൊല്ലി’ എന്ന അർഥമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ὀμόσας
  choice: സത്യം ചെയ്യുന്നവൻ
  rationale: നാമവാചകമായി പ്രവർത്തിക്കുന്ന ഭൂതകാല കൃദന്തം പൊതുവായി ഏതൊരു വ്യക്തിയെയും സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ഈ പ്രയോഗം സ്വാഭാവികമായി ആ പൊതുവായ അർഥം നൽകുന്നു.
- source_word: ἐν τῷ ναῷ
  choice: ദൈവാലയത്തെച്ചൊല്ലി
  rationale: ἐν എന്നതിന് അക്ഷരാർഥത്തിൽ ‘ൽ/അകത്ത്’ എന്നാണെങ്കിലും, ഇവിടെ സത്യപ്രതിജ്ഞാസൂത്രത്തിൽ സത്യം ചെയ്യുമ്പോൾ ആഹ്വാനം ചെയ്യുന്ന വസ്തുവിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘-യെച്ചൊല്ലി’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: ναῷ
  choice: ദൈവാലയം
  rationale: ναός ദൈവാലയത്തെയോ അതിന്റെ വിശുദ്ധമന്ദിരഭാഗത്തെയോ സൂചിപ്പിക്കാം; ഈ സന്ദർഭത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമായ ‘ദൈവാലയം’ യോജിക്കുന്നു.
- source_word: ὀμνύει
  choice: സത്യം ചെയ്യുന്നു
  rationale: വർത്തമാനകാല ക്രിയ ഇവിടെ ഒരു പൊതുതത്ത്വം പ്രസ്താവിക്കുന്നു; ‘സത്യം ചെയ്യുന്നു’ മലയാളത്തിലെ വ്യക്തവും പതിവുമായ പ്രയോഗമാണ്.
- source_word: ἐν αὐτῷ
  choice: അതിനെയുംച്ചൊല്ലി
  rationale: മുമ്പുള്ള ἐν എന്നതുപോലെ ഇതും സത്യപ്രതിജ്ഞയിൽ ആഹ്വാനം ചെയ്യപ്പെടുന്ന ദൈവാലയത്തെ സൂചിപ്പിക്കുന്നു; ‘അതിനെച്ചൊല്ലി’ ആ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: τῷ κατοικοῦντι αὐτόν
  choice: അതിൽ വസിക്കുന്നവനെയുംച്ചൊല്ലി
  rationale: വർത്തമാന കൃദന്തം ദൈവാലയത്തിൽ വസിക്കുന്ന വ്യക്തിയെ—സന്ദർഭത്തിൽ ദൈവത്തെ—സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ പ്രത്യേക വലിയക്ഷരരീതി ഇല്ലാത്തതിനാൽ ദൈവത്തെ നേരിട്ട് ചേർക്കാതെ മൂലപാഠത്തിന്റെ പരോക്ഷത നിലനിർത്തി.
- source_word: αὐτόν
  choice: അതിൽ
  rationale: സർവനാമം വ്യാകരണപരമായി പുല്ലിംഗമായ ναός-ലേക്കാണ് മടങ്ങുന്നത്; മലയാളത്തിൽ അചേതനമായ ദൈവാലയത്തെ സൂചിപ്പിക്കാൻ ‘അത്’ എന്ന രൂപം യോജിക്കുന്നു.
theological_decisions:
- issue: ദൈവാലയത്തിൽ വസിക്കുന്നവന്റെ തിരിച്ചറിയൽ
  choice: ‘അതിൽ വസിക്കുന്നവൻ’ എന്ന പരോക്ഷ പരാമർശം നിലനിർത്തി; സന്ദർഭത്തിൽ അത് ദൈവത്തെ സൂചിപ്പിക്കുന്നു
  alternative: ‘അതിൽ വസിക്കുന്ന ദൈവം’ എന്ന് വ്യക്തമായി പറയുക
  rationale: സന്ദർഭം ദൈവത്തെയാണ് വ്യക്തമായി സൂചിപ്പിക്കുന്നതെങ്കിലും, ഗ്രീക്ക് പാഠം θεός എന്ന് നേരിട്ട് പറയാതെ കൃദന്തരൂപം ഉപയോഗിക്കുന്നു. അതിനാൽ തിരിച്ചറിയൽ വ്യക്തമാക്കാൻ പാഠത്തിൽ വാക്ക് കൂട്ടാതെ മൂലപാഠത്തിന്റെ രൂപവും ദൈവശാസ്ത്രപരമായ സൂചനയും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. സത്യപ്രതിജ്ഞയുടെ സന്ദർഭത്തിൽ സ്വാഭാവികമായ ‘-യെച്ചൊല്ലി സത്യം ചെയ്യുക’ എന്ന പ്രയോഗം ഉപയോഗിച്ചു; ദൈവത്തെ സൂചിപ്പിക്കുന്ന കൃദന്തരൂപത്തിന്റെ പരോക്ഷത നിലനിർത്തി.
