id: MAT.23.20
reference: Matthew 23:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ οὖν ὀμόσας ἐν τῷ θυσιαστηρίῳ ὀμνύει ἐν αὐτῷ καὶ ἐν πᾶσι τοῖς ἐπάνω αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/020.yaml
  text: Therefore[a], the one who swears by the altar swears by it and by everything on it.
translation:
  language: ml
  text: അതുകൊണ്ട്, യാഗപീഠത്തെച്ചൊല്ലി സത്യം ചെയ്യുന്നവൻ അതിനെയും അതിന്മേലുള്ള സകലത്തെയും ചൊല്ലി സത്യം ചെയ്യുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ οὖν ὀμόσας
  choice: അതുകൊണ്ട്, ... സത്യം ചെയ്യുന്നവൻ
  rationale: οὖν മുൻവാദത്തിൽനിന്നുള്ള നിഗമനം സൂചിപ്പിക്കുന്നതിനാൽ ‘അതുകൊണ്ട്’ എന്നു പരിഭാഷപ്പെടുത്തി. ആർട്ടിക്കിളോടുകൂടിയ ഭൂതകാല കൃദന്തം പൊതുവായ വ്യക്തിയെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ ‘സത്യം ചെയ്യുന്നവൻ’ ഉപയോഗിച്ചു.
- source_word: ἐν τῷ θυσιαστηρίῳ
  choice: യാഗപീഠത്തെച്ചൊല്ലി
  rationale: ὀμνύωയോടൊപ്പമുള്ള ἐν സത്യവാചകത്തിലെ ആധാരത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ സ്വാഭാവികമായ സത്യപ്രതിജ്ഞാ പ്രയോഗമായി ‘-ത്തെച്ചൊല്ലി’ തിരഞ്ഞെടുത്തു. θυσιαστήριον എന്നതിന് ‘യാഗപീഠം’ നൽകി.
- source_word: ὀμνύει
  choice: സത്യം ചെയ്യുന്നു
  rationale: വാക്യം ഒരു പൊതുതത്ത്വം പ്രസ്താവിക്കുന്നതിനാൽ വർത്തമാനകാലം നിലനിർത്തി; ആവർത്തിക്കുന്ന ὀμνύωയ്ക്ക് ഒരേ മലയാളപ്രയോഗം ഉപയോഗിച്ചു.
- source_word: ἐν αὐτῷ
  choice: അതിനെയും ... ചൊല്ലി
  rationale: αὐτῷ യാഗപീഠത്തെയാണ് സൂചിപ്പിക്കുന്നത്. സത്യവാചകസന്ദർഭത്തിലെ ἐν അനുസരിച്ച് ‘ചൊല്ലി’ എന്ന ആശയം സംയുക്തമായി നിലനിർത്തി.
- source_word: καὶ ἐν πᾶσι τοῖς ἐπάνω αὐτοῦ
  choice: അതിന്മേലുള്ള സകലത്തെയും ചൊല്ലി
  rationale: πᾶσι τοῖς ἐπάνω αὐτοῦ എന്ന വിശാലമായ പ്രയോഗം ഒരു പ്രത്യേക ‘വഴിപാടായി’ ചുരുക്കാതെ, യാഗപീഠത്തിന്മേലുള്ള എല്ലാറ്റിനെയും ഉൾക്കൊള്ളുന്ന വിധത്തിൽ പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: ‘അതിന്മേലുള്ള സകലവും’ എന്നതിന്റെ സൂചന
  choice: യാഗപീഠത്തിന്മേലുള്ള എല്ലാറ്റിനെയും പൊതുവായി സൂചിപ്പിക്കുക
  alternative: അതിന്മേലുള്ള വഴിപാടുകൾ; അതിന് മുകളിലുള്ള സകലവും
  rationale: സമീപസന്ദർഭം യാഗപീഠത്തിന്മേലുള്ള വഴിപാടിനെ പരാമർശിക്കുന്നുവെങ്കിലും, ഗ്രീക്ക് വാചകം ഇവിടെ കൂടുതൽ വിശാലമാണ്. അതിനാൽ പരിഭാഷ അതിനെ ‘വഴിപാടുകൾ’ എന്നു പരിമിതപ്പെടുത്തുന്നില്ല; സ്ഥലം മാത്രമായി ‘മുകളിൽ’ എന്നും വ്യാഖ്യാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘യാഗപീഠത്തെച്ചൊല്ലി സത്യം ചെയ്യുക’ എന്ന പ്രയോഗം ഗ്രീക്ക് സത്യവാചകത്തിന്റെ അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു. പ്രധാനപാഠത്തിൽ അടിക്കുറിപ്പ് ആവശ്യമില്ല.
