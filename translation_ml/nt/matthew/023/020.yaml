  source_fidelity: The Malayalam accurately represents the inferential οὖν, the generic substantival participle, the oath-formula force of ἐν with ὀμνύω, and the two coordinated oath objects. “അതിന്മേലുള്ള സകലത്തെയും” appropriately retains the inclusive scope of πᾶσι τοῖς ἐπάνω αὐτοῦ without reducing it to a particular offering.
  naturalness: “യാഗപീഠത്തെച്ചൊല്ലി സത്യം ചെയ്യുന്നവൻ” is natural, dignified modern Malayalam for this oath formulation. The repeated “സത്യം ചെയ്യുന്നു” clearly conveys the gnomic present, and the coordination is readily understood.
  terminology: “യാഗപീഠം” is an established and suitable rendering of θυσιαστήριον. The wording neither introduces doctrinal interpretation nor narrows “everything on it” to sacrifices or gifts.
