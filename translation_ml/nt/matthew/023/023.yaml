  source_fidelity: 'പ്രധാന അർഥം കൃത്യമായി കൈമാറിയിട്ടുണ്ട്: ഔഷധസസ്യങ്ങളുടെ ദശാംശം, ന്യായപ്രമാണത്തിന്റെ കൂടുതൽ പ്രാധാന്യമുള്ള കാര്യങ്ങൾ, അവയെ ചെയ്യുകയും മറ്റുള്ളവയെ അവഗണിക്കാതിരിക്കുകയും വേണമെന്ന ഇരട്ട ഊന്നൽ എല്ലാം നിലനിൽക്കുന്നു. എന്നാൽ ὑποκριταί എന്നതിന് ‘കപടഭക്തർ’ എന്നത് മൂലപാഠത്തിലെ പൊതുവായ ‘കപടന്മാർ’ എന്ന കുറ്റാരോപണത്തെ മതഭക്തിയുടെ പ്രത്യേക രൂപമായി ചുരുക്കുന്നു.'
  naturalness: ‘ശാസ്ത്രിമാരും പരീശന്മാരുമായ കപടന്മാരേ, നിങ്ങൾക്ക് അയ്യോ കഷ്ടം!’ എന്ന നേരിട്ടുള്ള അഭിസംബോധന ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മൂലവാക്യത്തിന്റെ ഊന്നലിനോട് അടുത്തതുമാണ്. അവസാനത്തെ ‘അവയും’ κἀκεῖναയിലെ മുമ്പ് പറഞ്ഞ ദശാംശകാര്യങ്ങളിലേക്കുള്ള സൂചന കൂടുതൽ വ്യക്തമാക്കുന്നു.
