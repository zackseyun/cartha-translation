revisions:
- from: “കപടഭക്തരായ ശാസ്ത്രിമാരും പരീശന്മാരുമായ നിങ്ങളേ, നിങ്ങൾക്ക് അയ്യോ കഷ്ടം! നിങ്ങൾ പുതിന, ചതകുപ്പ, ജീരകം എന്നിവയുടെ ദശാംശം കൊടുക്കുന്നു; എന്നാൽ ന്യായപ്രമാണത്തിലെ കൂടുതൽ പ്രാധാന്യമുള്ള കാര്യങ്ങളായ നീതി, കരുണ, വിശ്വാസം[a] എന്നിവ അവഗണിച്ചിരിക്കുന്നു. ഇവ ചെയ്യേണ്ടതായിരുന്നു; മറ്റുള്ളവയും അവഗണിക്കരുതായിരുന്നു.”
  to: “ശാസ്ത്രിമാരും പരീശന്മാരുമായ കപടന്മാരേ, നിങ്ങൾക്ക് അയ്യോ കഷ്ടം! നിങ്ങൾ പുതിന, ചതകുപ്പ, ജീരകം എന്നിവയുടെ ദശാംശം കൊടുക്കുന്നു; എന്നാൽ ന്യായപ്രമാണത്തിലെ കൂടുതൽ പ്രാധാന്യമുള്ള കാര്യങ്ങളായ നീതി, കരുണ, വിശ്വാസം[a] എന്നിവ അവഗണിച്ചിരിക്കുന്നു. ഇവ ചെയ്യേണ്ടതായിരുന്നു; അവയും അവഗണിക്കരുതായിരുന്നു.”
  rationale: വിവർത്തനം പൊതുവേ വിശ്വസ്തമാണ്. ‘കപടഭക്തർ’ എന്ന വ്യാഖ്യാനാത്മക പദത്തിനു പകരം മൂലത്തിലെ ὑποκριταί-യെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്ന ‘കപടന്മാർ’ ഉപയോഗിച്ചു. ‘മറ്റുള്ളവയും’ ‘അവയും’ ആക്കി, ഒഴിവാക്കരുതെന്ന നിർദേശം മുമ്പ് പരാമർശിച്ച ദശാംശകാര്യങ്ങളിലേക്കാണെന്ന സൂചന നിലനിർത്തി. πίστιν സംബന്ധിച്ച പ്രധാനപാഠവും അടിക്കുറിപ്പും മാറ്റമില്ലാതെ സൂക്ഷിച്ചു.
