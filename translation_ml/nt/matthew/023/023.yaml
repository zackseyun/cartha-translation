id: MAT.23.23
reference: Matthew 23:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι ἀποδεκατοῦτε τὸ ἡδύοσμον καὶ τὸ ἄνηθον καὶ τὸ κύμινον, καὶ ἀφήκατε τὰ βαρύτερα τοῦ νόμου, τὴν κρίσιν καὶ ⸂τὸ ἔλεος⸃ καὶ τὴν πίστιν· ⸀ταῦτα ἔδει ποιῆσαι κἀκεῖνα μὴ ⸀ἀφιέναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/023.yaml
  text: 'Woe to you[a], scribes and Pharisees, hypocrites! For you tithe mint and dill and cumin, and have neglected the weightier matters of the law: justice and mercy and faith. These you ought to have done, without neglecting the others.'
translation:
  language: ml
  text: “ശാസ്ത്രിമാരും പരീശന്മാരുമായ കപടന്മാരേ, നിങ്ങൾക്ക് അയ്യോ കഷ്ടം! നിങ്ങൾ പുതിന, ചതകുപ്പ, ജീരകം എന്നിവയുടെ ദശാംശം കൊടുക്കുന്നു; എന്നാൽ ന്യായപ്രമാണത്തിലെ കൂടുതൽ പ്രാധാന്യമുള്ള കാര്യങ്ങളായ നീതി, കരുണ, വിശ്വാസം[a] എന്നിവ അവഗണിച്ചിരിക്കുന്നു. ഇവ ചെയ്യേണ്ടതായിരുന്നു; അവയും അവഗണിക്കരുതായിരുന്നു.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “വിശ്വസ്തത.” ഗ്രീക്ക് പദത്തിന് വിശ്വാസം, ആശ്രയം, വിശ്വസ്തത എന്നീ അർഥങ്ങൾ വരാം; ഈ ധാർമിക സന്ദർഭത്തിൽ പലരും അതിനെ വിശ്വസ്തത എന്ന അർഥത്തിൽ മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐαὶ
  choice: അയ്യോ കഷ്ടം
  rationale: പ്രവാചകീയമായ ന്യായവിധി പ്രഖ്യാപനത്തിന്റെ ശക്തി നിലനിർത്തുന്ന, മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: γραμματεῖς
  choice: ശാസ്ത്രിമാർ
  rationale: സുവിശേഷസന്ദർഭത്തിലെ യഹൂദ തിരുവെഴുത്തുപണ്ഡിതരെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും സംക്ഷിപ്തവുമായ മലയാള പദം.
- source_word: ὑποκριταί
  choice: കപടഭക്തർ
  rationale: ഇവിടെ ഉദ്ദേശിക്കുന്ന മതപരമായ കപടതയെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി അറിയിക്കുന്നു; വെറും ‘കപടന്മാർ’ എന്നതിനെക്കാൾ സന്ദർഭോചിതം.
- source_word: ἀποδεκατοῦτε
  choice: ദശാംശം കൊടുക്കുന്നു
  rationale: പത്തിലൊന്ന് നൽകുന്ന നിയമപരവും ആരാധനാസംബന്ധവുമായ പ്രവൃത്തിയെ വ്യക്തവും സ്വാഭാവികവുമായി വ്യക്തമാക്കുന്നു.
- source_word: ἡδύοσμον
  choice: പുതിന
  rationale: ഇവിടെ പറയുന്ന mint എന്ന സുഗന്ധസസ്യത്തിന്റെ സാധാരണ മലയാളനാമം.
- source_word: ἄνηθον
  choice: ചതകുപ്പ
  rationale: dill എന്ന സസ്യത്തിന് ആധുനിക മലയാളത്തിൽ ഉപയോഗിക്കുന്ന പേര്.
- source_word: κύμινον
  choice: ജീരകം
  rationale: cumin എന്ന സുഗന്ധവ്യഞ്ജനത്തിന്റെ സാധാരണ മലയാളനാമം.
- source_word: ἀφήκατε
  choice: അവഗണിച്ചിരിക്കുന്നു
  rationale: ചെയ്യേണ്ടതു വിട്ടുകളഞ്ഞു/ശ്രദ്ധിക്കാതിരുന്നു എന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὰ βαρύτερα τοῦ νόμου
  choice: ന്യായപ്രമാണത്തിലെ കൂടുതൽ പ്രാധാന്യമുള്ള കാര്യങ്ങൾ
  rationale: ‘ഭാരമേറിയവ’ എന്ന ഗ്രീക്ക് രൂപകത്തിന്റെ ഉദ്ദേശ്യമായ താരതമ്യപ്രാധാന്യം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: κρίσιν
  choice: നീതി
  rationale: ഈ ധാർമിക ത്രയത്തിൽ വിധിപ്രസ്താവനയേക്കാൾ നീതിപൂർവമായ പെരുമാറ്റമാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: ἔλεος
  choice: കരുണ
  rationale: ദയയും കാരുണ്യപൂർവമായ പ്രവൃത്തിയും ഉൾക്കൊള്ളുന്ന, സ്വാഭാവികവും ബൈബിൾസന്ദർഭത്തിന് യോജിച്ചതുമായ പദം.
- source_word: πίστιν
  choice: വിശ്വാസം
  rationale: പദത്തിന്റെ വിശ്വാസം/വിശ്വസ്തത എന്ന അർഥവ്യാപ്തിയിൽ പ്രധാന വായനയായി ‘വിശ്വാസം’ നിലനിർത്തുന്നു; ധാർമിക സന്ദർഭത്തിലെ ‘വിശ്വസ്തത’ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ധാർമിക ത്രയത്തിലെ πίστιν എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: വിശ്വാസം
  alternative: വിശ്വസ്തത
  rationale: πίστις വിശ്വാസം, ആശ്രയം, വിശ്വസ്തത എന്നീ ആശയങ്ങൾ വഹിക്കാം. ഈ ധാർമിക സന്ദർഭത്തിൽ ‘വിശ്വസ്തത’ ശക്തമായ സാധ്യതയായിരിക്കുമ്പോഴും, വാചകത്തിലെ യഥാർഥ അർഥവ്യാപ്തി ചുരുക്കാതെ പ്രധാന പാഠത്തിൽ ‘വിശ്വാസം’ നൽകി മറ്റൊരു വായന അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- issue: ചെറിയ ആചാരാനുഷ്ഠാനങ്ങളും കൂടുതൽ പ്രാധാന്യമുള്ള ധാർമിക ആവശ്യങ്ങളും തമ്മിലുള്ള ബന്ധം
  choice: ‘ഇവ ചെയ്യേണ്ടതായിരുന്നു; മറ്റുള്ളവയും അവഗണിക്കരുതായിരുന്നു’
  alternative: ചെറിയ ദശാംശാനുഷ്ഠാനങ്ങളെ നിരസിക്കുന്നതായി പരിഭാഷപ്പെടുത്തുക
  rationale: ഗ്രീക്ക് വാക്യം നീതി, കരുണ, വിശ്വാസം എന്നിവ നിർബന്ധമായും ചെയ്യേണ്ടതാണെന്ന് പറയുന്നതിനൊപ്പം ദശാംശം നൽകുന്നതും വിട്ടുകളയരുതെന്ന് വ്യക്തമാക്കുന്നു; അതിനാൽ ഇരുവശവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി. ‘ശാസ്ത്രിമാർ,’ ‘പരീശന്മാർ,’ ‘ന്യായപ്രമാണം,’ ‘ദശാംശം’ എന്നീ പരിചിതമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തി; അപൂർവമായ സസ്യനാമങ്ങളിൽ സാധാരണ മലയാളരൂപങ്ങൾ ഉപയോഗിച്ചു.
