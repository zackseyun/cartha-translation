id: MAT.23.37
reference: Matthew 23:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἰερουσαλὴμ Ἰερουσαλήμ, ἡ ⸀ἀποκτείνουσα τοὺς προφήτας καὶ λιθοβολοῦσα τοὺς ἀπεσταλμένους πρὸς αὐτήν— ποσάκις ἠθέλησα ἐπισυναγαγεῖν τὰ τέκνα σου, ὃν τρόπον ⸂ὄρνις ἐπισυνάγει⸃ τὰ νοσσία ⸀αὐτῆς ὑπὸ τὰς πτέρυγας, καὶ οὐκ ἠθελήσατε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/037.yaml
  text: Jerusalem[a], Jerusalem, the one who kills the prophets and stones those sent to her—how often I wanted to gather your children together, the way a hen gathers her chicks under her wings[b], and you were not willing!
translation:
  language: ml
  text: “യെരൂശലേമേ, യെരൂശലേമേ, പ്രവാചകന്മാരെ കൊല്ലുകയും തന്റെ അടുക്കലേക്ക് അയയ്ക്കപ്പെട്ടവരെ കല്ലെറിയുകയും ചെയ്യുന്നവളേ—നിന്റെ മക്കളെ ചേർത്തുകൂട്ടാൻ എത്ര പ്രാവശ്യം ഞാൻ ആഗ്രഹിച്ചു, ഒരു പിടക്കോഴി തന്റെ കുഞ്ഞുങ്ങളെ ചിറകിൻകീഴിൽ ചേർത്തുകൂട്ടുന്നതുപോലെ; എന്നാൽ നിങ്ങൾ ആഗ്രഹിച്ചില്ല!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നിങ്ങൾ ആഗ്രഹിച്ചില്ല” എന്നതിലെ ഗ്രീക്ക് ക്രിയ ബഹുവചനമാണ്; അതിനാൽ യെരൂശലേം എന്ന നഗരത്തോട് ഏകവചനത്തിൽ ആരംഭിച്ച അഭിസംബോധന ഇവിടെ അതിന്റെ ജനങ്ങളിലേക്കു തിരിയുന്നതായി മനസ്സിലാക്കാം.
    reason: grammatical_clarification
lexical_decisions:
- source_word: Ἰερουσαλὴμ Ἰερουσαλήμ
  choice: യെരൂശലേമേ, യെരൂശലേമേ
  rationale: നഗരനാമത്തിന്റെ ഊന്നലോടുകൂടിയ ആവർത്തനവും വിലാപസ്വരത്തിലുള്ള സംബോധനയും നിലനിർത്തുന്നു.
- source_word: ἡ ἀποκτείνουσα τοὺς προφήτας καὶ λιθοβολοῦσα
  choice: പ്രവാചകന്മാരെ കൊല്ലുകയും ... കല്ലെറിയുകയും ചെയ്യുന്നവളേ
  rationale: വർത്തമാനകാല കൃദന്തരൂപങ്ങളുടെ പതിവായ സ്വഭാവസൂചന നിലനിർത്തുകയും വ്യക്തിവൽക്കരിക്കപ്പെട്ട നഗരത്തോടുള്ള സ്ത്രീലിംഗ സംബോധന മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: τοὺς ἀπεσταλμένους πρὸς αὐτήν
  choice: തന്റെ അടുക്കൽ അയയ്ക്കപ്പെട്ടവരെ
  rationale: പൂർണകാല നിഷ്ക്രിയ കൃദന്തത്തിന്റെ അർഥവും നഗരത്തിന്റെ വ്യക്തിവൽക്കരണവും സംരക്ഷിക്കുന്നു.
- source_word: ποσάκις ἠθέλησα
  choice: എത്രയോ പ്രാവശ്യം ഞാൻ ആഗ്രഹിച്ചു
  rationale: വിലാപത്തിലെ ആവർത്തിതമായ ആഗ്രഹം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; നിർണയമോ സാങ്കേതിക ദൈവശാസ്ത്രാർഥമോ അധികമായി ചേർക്കുന്നില്ല.
- source_word: ἐπισυναγαγεῖν / ἐπισυνάγει
  choice: ചേർത്തുകൂട്ടാൻ / ചേർത്തുകൂട്ടുന്നതുപോലെ
  rationale: രണ്ട് പ്രയോഗങ്ങളിലുമുള്ള ഒരേ ക്രിയാപദബന്ധം നിലനിർത്തുന്നു.
- source_word: τὰ τέκνα σου
  choice: നിന്റെ മക്കളെ
  rationale: നഗരത്തോടുള്ള ബന്ധസൂചകമായ സന്തതി-രൂപകം നിലനിർത്തുന്നു; ഒരു പ്രത്യേക ഉപവിഭാഗമായി ചുരുക്കുന്നില്ല.
- source_word: ὄρνις
  choice: ഒരു കോഴി
  rationale: പദത്തിന് പൊതുവായി ‘പക്ഷി’ എന്ന അർഥം വരാമെങ്കിലും, കുഞ്ഞുങ്ങളെ ചിറകിൻകീഴിൽ ചേർക്കുന്ന മാതൃരൂപകം ഇവിടെ പിടക്കോഴിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ പൊതുപ്രയോഗമായ ‘കോഴി’ സ്വാഭാവികമാണ്.
- source_word: καὶ οὐκ ἠθελήσατε
  choice: എന്നാൽ നിങ്ങൾ ആഗ്രഹിച്ചില്ല
  rationale: മുൻപത്തെ ἠθέλησα-യോടുള്ള പദപരവും ആശയപരവുമായ വൈരുധ്യം നിലനിർത്തുന്നു; ബഹുവചനരൂപം നഗരത്തിന്റെ മക്കളെ അഭിസംബോധന ചെയ്യുന്നതായി തുറന്നുവെക്കുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ ആഗ്രഹവും അഭിസംബോധിതരുടെ അനാഗ്രഹവും തമ്മിലുള്ള വൈരുധ്യം
  choice: രണ്ടിടത്തും ‘ആഗ്രഹിച്ചു/ആഗ്രഹിച്ചില്ല’ എന്ന സമാന്തര ഭാഷ ഉപയോഗിച്ചു.
  alternative: ‘നിശ്ചയിച്ചു’ പോലുള്ള നിർണായകഭാഷ ഉപയോഗിക്കുക, അല്ലെങ്കിൽ ആദ്യത്തെ ക്രിയയെ വികാരപരമായ മോഹമായി മാത്രം പരാവർത്തനം ചെയ്യുക.
  rationale: മൂലവാക്യം യഥാർഥമായ ഇച്ഛാവൈരുധ്യം അവതരിപ്പിക്കുന്നു; ദൈവഹിതം, മനുഷ്യ ഉത്തരവാദിത്വം, ക്രിസ്തുശാസ്ത്രം എന്നിവയെക്കുറിച്ചുള്ള വിശാലമായ തർക്കങ്ങൾ വിവർത്തനത്തിലൂടെ തീർപ്പാക്കരുത്.
- issue: ‘നിന്റെ മക്കൾ’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: രൂപകാത്മകമായ ‘നിന്റെ മക്കൾ’ നിലനിർത്തി.
  alternative: ‘നിന്റെ ജനത്തെ’ അല്ലെങ്കിൽ ‘നിവാസികളെ’ എന്നു വ്യാഖ്യാനിച്ച് വ്യക്തമാക്കുക.
  rationale: വ്യക്തിവൽക്കരിക്കപ്പെട്ട യെരൂശലേമുമായി ബന്ധപ്പെട്ട ജനത്തെ സൂചിപ്പിക്കുന്ന രൂപകം സംരക്ഷിക്കുകയും അതിനെ അനാവശ്യമായി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: അവസാനത്തെ ബഹുവചന ക്രിയയുടെ അഭിസംബോധിതർ
  choice: ‘നിങ്ങൾ ആഗ്രഹിച്ചില്ല’ എന്ന് ബഹുവചനം തുറന്നുവെച്ചു.
  alternative: ‘നീ ആഗ്രഹിച്ചില്ല’ എന്ന് നഗരത്തിന്റെ ഏകവചന വ്യക്തിവൽക്കരണവുമായി ഒത്താക്കുക.
  rationale: ഗ്രീക്കിലെ ἠθελήσατε വ്യക്തമായ ബഹുവചനമാണ്; ‘നിന്റെ മക്കൾ’ എന്ന കൂട്ടത്തെ അഭിസംബോധന ചെയ്യുന്നതായുള്ള വ്യാകരണപരമായ മാറ്റവും അതിലുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തണം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള വിലാപശൈലി. ‘യെരൂശലേമേ’ എന്ന സംബോധനയും സമാന്തര ക്രിയകളും കവിതാത്മക ഊന്നൽ നിലനിർത്തുന്നു. ‘ചിറകിൻകീഴിൽ’ എന്ന സംയുക്തപ്രയോഗം പരിചിതവും ദൃശ്യസമ്പന്നവുമാണ്. പ്രധാനവാക്യത്തിലെ [a] അടയാളം നിർബന്ധമായും ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
