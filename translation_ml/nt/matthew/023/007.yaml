id: MAT.23.7
reference: Matthew 23:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ τοὺς ἀσπασμοὺς ἐν ταῖς ἀγοραῖς καὶ καλεῖσθαι ὑπὸ τῶν ἀνθρώπων· ⸀Ῥαββί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/007.yaml
  text: and greetings in the marketplaces, and to be called by men, ‘Rabbi.’
translation:
  language: ml
  text: ചന്തസ്ഥലങ്ങളിൽ അഭിവാദ്യങ്ങൾ ലഭിക്കാനും മനുഷ്യർ തങ്ങളെ ‘റബ്ബീ’ എന്നു വിളിക്കാനും അവർ ഇഷ്ടപ്പെടുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοὺς ἀσπασμοὺς
  choice: അഭിവാദ്യങ്ങൾ
  rationale: പൊതുസ്ഥലങ്ങളിൽ ആദരപൂർവം അഭിവാദ്യം ചെയ്യപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പദപ്രയോഗം.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: ചന്തസ്ഥലങ്ങളിൽ
  rationale: ἀγορά എന്നത് വ്യാപാരകേന്ദ്രം മാത്രമല്ല, പൊതുജനങ്ങൾ കൂടുന്ന ഇടവും സൂചിപ്പിക്കുന്നു; ‘ചന്തസ്ഥലങ്ങൾ’ ഈ പശ്ചാത്തലം നിലനിർത്തുന്നു.
- source_word: καλεῖσθαι ὑπὸ τῶν ἀνθρώπων
  choice: മനുഷ്യർ തങ്ങളെ … എന്നു വിളിക്കാനും
  rationale: ὑπὸ τῶν ἀνθρώπων എന്ന കർത്തൃസൂചന വ്യക്തമായി നിലനിർത്തുന്നു. സന്ദർഭത്തിലെ കർത്താവായ ശാസ്ത്രിമാരെയും പരീശന്മാരെയും സൂചിപ്പിക്കാൻ മലയാളത്തിൽ ആവശ്യമായ ‘തങ്ങളെ’ ചേർത്തു.
- source_word: Ῥαββί
  choice: റബ്ബീ
  rationale: യഹൂദ മതാധ്യാപകനെ അഭിസംബോധന ചെയ്യുന്ന മൂലപദത്തിന്റെ രൂപവും ചരിത്രപരമായ പ്രത്യേകതയും ലിപ്യന്തരണത്തിലൂടെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: Ῥαββί എന്ന ബഹുമാനപ്പദവിയുടെ വിവർത്തനം
  choice: ‘റബ്ബീ’ എന്നു ലിപ്യന്തരിച്ചു
  alternative: ‘ഗുരോ’ അല്ലെങ്കിൽ ‘എന്റെ ഗുരുവേ’
  rationale: പദത്തിന്റെ യഹൂദ ചരിത്ര-മതപരമായ പശ്ചാത്തലം സംരക്ഷിക്കുകയും ഒരു പ്രത്യേക മലയാള മതപാരമ്പര്യത്തിലെ പദവിയുമായി അതിനെ ലയിപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: τῶν ἀνθρώπων എന്നതിലെ ലിംഗസൂചന
  choice: മനുഷ്യർ
  alternative: ആളുകൾ
  rationale: ἄνθρωπος ഇവിടെ പൊതുവായി മനുഷ്യരെ സൂചിപ്പിക്കാം; മൂലരൂപത്തോട് അടുത്തുനിൽക്കുന്നതിനായി ‘മനുഷ്യർ’ സ്വീകരിച്ചു, എന്നാൽ ജൈവിക പുരുഷന്മാരിലേക്കു മാത്രം അർത്ഥം ചുരുക്കിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഈ വാക്യം മുൻവാക്യത്തിൽ ആരംഭിക്കുന്ന പട്ടികയുടെ തുടർച്ചയായിരുന്നാലും, നൽകിയിരിക്കുന്ന ഒറ്റവാക്യം വായനാസൗകര്യത്തിനായി സന്ദർഭത്തിൽനിന്നുള്ള കർത്താവും ‘ഇഷ്ടപ്പെടുന്നു’ എന്ന ആശയവും പ്രകടമാക്കി.
