  text: καὶ πατέρα μὴ καλέσητε ὑμῶν ἐπὶ τῆς γῆς, εἷς γάρ ἐστιν ⸂ὑμῶν ὁ πατὴρ⸃ ὁ ⸀οὐράνιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/009.yaml
  text: And call no man on earth your father[a], for one is your Father[b], the heavenly One.
translation:
  language: ml
  text: ഭൂമിയിൽ ആരെയും നിങ്ങളുടെ പിതാവ് എന്നു വിളിക്കരുത്[a]; എന്തെന്നാൽ, നിങ്ങളുടെ പിതാവ് ഒരുവനാണ്—സ്വർഗീയനായവൻ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഭൂമിയിൽ ആരെയും പിതാവ് എന്നു വിളിക്കരുത്.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘സ്വർഗീയ പിതാവ്’ എന്നും ‘സ്വർഗത്തിലുള്ളവൻ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: πατέρα
  choice: പിതാവ്
  rationale: καλέσητε എന്ന ക്രിയയുടെ പൂരകമായി വരുന്ന അഭിസംബോധനാപദം; ജൈവപിതൃത്വം മാത്രമായി ചുരുക്കാതെ ബഹുമാനപദത്തിന്റെ സ്വഭാവവും തുടർന്നുള്ള ‘പിതാവ്’ എന്ന സമാന്തരവും നിലനിർത്തുന്നു.
- source_word: μὴ καλέσητε
  choice: വിളിക്കരുത്
  rationale: μή സഹിതമുള്ള aorist subjunctive നിരോധനമായി പ്രവർത്തിക്കുന്നു; മലയാളത്തിൽ നേരിട്ടും സ്വാഭാവികമായും കല്പനയുടെ ശക്തി നൽകുന്നു.
- source_word: ὑμῶν
  choice: നിങ്ങളുടെ
  rationale: ബന്ധസൂചകമായ genitive സർവനാമത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ ഉടമസ്ഥരൂപത്തിൽ നൽകുന്നു.
- source_word: ἐπὶ τῆς γῆς
  choice: ഭൂമിയിൽ
  rationale: സ്വർഗീയനായ പിതാവിനോടു വിരുദ്ധമായി ഭൂമിയിലെ മേഖലയെയോ സ്ഥാനത്തെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: εἷς
  choice: ഒരുവൻ
  rationale: ഗ്രീക്കിലെ ‘ഒന്ന്/ഒരുവൻ’ എന്ന വ്യക്തമായ സംഖ്യാഭാവം കാത്തുസൂക്ഷിക്കുന്നു; മുഖ്യവാചകത്തിൽ ‘ഒരേയൊരുവൻ’ എന്ന് കൂട്ടിച്ചേർത്ത് വ്യാഖ്യാനം ശക്തിപ്പെടുത്തുന്നില്ല.
- source_word: ὑμῶν ὁ πατήρ
  choice: നിങ്ങളുടെ പിതാവ്
  rationale: നൽകിയിരിക്കുന്ന SBLGNT വായനയിലെ വ്യക്തിപരമായ ബന്ധം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ὁ οὐράνιος
  choice: സ്വർഗീയനായവൻ
  rationale: article സഹിതം substantival ആയി ഉപയോഗിച്ചിരിക്കുന്ന വിശേഷണത്തിന്റെ അടയാളപ്പെടുത്തിയ രൂപം സംരക്ഷിക്കുന്നു; ‘സ്വർഗത്തിലുള്ളവൻ’ എന്നും ‘സ്വർഗീയ പിതാവ്’ എന്നും അർത്ഥമാക്കാവുന്ന സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ നിരോധനത്തിന്റെ വ്യാപ്തി
  choice: ഭൂമിയിലെ ആരെയും ‘നിങ്ങളുടെ പിതാവ്’ എന്നു വിളിക്കരുതെന്ന കർശനമായ വാക്കുകൾ നേരിട്ട് നിലനിർത്തുന്നു.
  alternative: എല്ലാ ജൈവികമോ സാമൂഹികമോ ആയ ‘പിതാവ്’ പ്രയോഗങ്ങളും നിരോധിക്കുന്നതായി വിപുലീകരിക്കുക; അല്ലെങ്കിൽ അതിശയോക്തിയെന്നു കണ്ട് കല്പനയെ മൃദുവാക്കുക.
  rationale: ഗ്രീക്ക് വാചകം ശക്തമായ നിരോധനമാണ്. എന്നാൽ സാധാരണ ജൈവിക-സാമൂഹിക ഉപയോഗങ്ങളോടുള്ള ബന്ധം പരിഭാഷയിൽ തന്നെ തീർപ്പാക്കുന്നില്ല; അതിനാൽ വാചകത്തിന്റെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും സന്ദർഭാധീനതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അച്ഛൻ’ എന്ന ദൈനംദിന പദത്തിനു പകരം ‘പിതാവ്’ ഉപയോഗിച്ചത് അഭിസംബോധനാപദത്തിന്റെ ഔപചാരികതയും രണ്ടു ഉപവാക്യങ്ങളിലെ ആവർത്തനവും നിലനിർത്താനാണ്. ‘ആരെയും’ എന്നത് ഗ്രീക്കിൽ പ്രത്യേകമായി ‘മനുഷ്യൻ’ എന്ന നാമം ഇല്ലാത്തതിനാൽ അനാവശ്യ ലിംഗചിഹ്നനം ഒഴിവാക്കി സ്വാഭാവികമായ അർത്ഥം നൽകുന്നു.
