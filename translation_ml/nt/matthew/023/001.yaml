translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. മൂലത്തിലെ രണ്ട് ശ്രോതൃവിഭാഗങ്ങളുടെ ബഹുവചനഭാവം നിലനിർത്തിയിരിക്കുന്നു. അടുത്ത വാക്യത്തിലെ നേരിട്ടുള്ള പ്രസംഗത്തിലേക്കുള്ള ബന്ധം സൂചിപ്പിക്കാൻ അവസാനത്തിൽ ദ്വിബിന്ദു ചേർത്തിരിക്കുന്നു.
