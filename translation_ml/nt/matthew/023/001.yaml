  yaml_path: translation/nt/matthew/023/001.yaml
  text: Then Jesus spoke to the crowds and to his disciples,
translation:
  language: ml
  text: 'അപ്പോൾ യേശു ജനക്കൂട്ടങ്ങളോടും തന്റെ ശിഷ്യന്മാരോടും സംസാരിച്ചു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: അപ്പോൾ
  rationale: ആഖ്യാനത്തിലെ സംഭവക്രമം സൂചിപ്പിക്കുന്ന കാലസൂചക ക്രിയാവിശേഷണത്തിന് സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാള തുല്യം.
- source_word: ὁ Ἰησοῦς
  choice: യേശു
  rationale: ഗ്രീക്കിൽ വ്യക്തിനാമത്തോടുള്ള നിർദ്ദിഷ്ട ഉപപദം സാധാരണ ആഖ്യാനശൈലിയുടെ ഭാഗമാണ്; മലയാളത്തിൽ അത് പ്രത്യേകം പരിഭാഷപ്പെടുത്തേണ്ടതില്ല.
- source_word: ἐλάλησεν
  choice: സംസാരിച്ചു
  rationale: λαλέω എന്ന ക്രിയയുടെ ലളിതമായ സംസാരപ്രവൃത്തിയെ അധിക അർത്ഥനിറം ചേർക്കാതെ വ്യക്തമാക്കുന്നു.
- source_word: τοῖς ὄχλοις
  choice: ജനക്കൂട്ടങ്ങളോട്
  rationale: മൂലത്തിലെ നിർദ്ദിഷ്ട ബഹുവചനം നിലനിർത്തുന്നു; ‘പുരുഷാരം’ പോലുള്ള പഴയ പ്രയോഗത്തേക്കാൾ ആധുനിക വായനക്കാർക്ക് സ്വാഭാവികമാണ്.
- source_word: καὶ
  choice: -ഉം … -ഉം
  rationale: രണ്ട് ശ്രോതൃവിഭാഗങ്ങളെയും മലയാളത്തിൽ സ്വാഭാവികമായി സംയോജിപ്പിക്കുന്ന സമുച്ചയരൂപം.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: തന്റെ ശിഷ്യന്മാരോട്
  rationale: αὐτοῦ എന്ന ഉടമസ്ഥബന്ധം കർത്താവായ യേശുവിലേക്കു തിരിച്ചുസൂചിപ്പിക്കുന്നതിനാൽ ‘തന്റെ’ സ്വാഭാവികമാണ്; μαθηταί എന്നതിന് സ്ഥാപിതമായ മലയാള പദം ‘ശിഷ്യന്മാർ’ ആണ്.
