id: MAT.23.33
reference: Matthew 23:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὄφεις γεννήματα ἐχιδνῶν, πῶς φύγητε ἀπὸ τῆς κρίσεως τῆς γεέννης;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/033.yaml
  text: You snakes[a], offspring of vipers! How will you escape from the judgment of Gehenna?
translation:
  language: ml
  text: പാമ്പുകളേ, അണലികളുടെ സന്തതികളേ! ഗെഹെന്നയുടെ[a] ന്യായവിധിയിൽനിന്ന് നിങ്ങൾ എങ്ങനെ രക്ഷപ്പെടും?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നരകത്തിന്റെ ന്യായവിധിയിൽനിന്ന്.” ഗ്രീക്ക്: “ഗെഹെന്ന.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὄφεις
  choice: പാമ്പുകളേ
  rationale: നേരിട്ടുള്ള സംബോധനയും നിന്ദാരൂപകത്തിന്റെ ശക്തിയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: γεννήματα
  choice: സന്തതികളേ
  rationale: ‘ജനിപ്പിക്കപ്പെട്ടവർ/ഉത്പന്നങ്ങൾ’ എന്ന ആശയം വ്യക്തമാക്കുകയും ἐχιδνῶν എന്ന ജനിറ്റീവുമായുള്ള ഘടന നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐχιδνῶν
  choice: അണലികളുടെ
  rationale: പൊതുവായ പാമ്പുകളെക്കാൾ വിഷപ്പാമ്പുകളുടെ പ്രത്യേക ഇനത്തെ സൂചിപ്പിക്കുന്ന വാക്കായതിനാൽ രൂപകത്തിന്റെ തീവ്രത സംരക്ഷിക്കുന്നു.
- source_word: πῶς
  choice: എങ്ങനെ
  rationale: രക്ഷപ്പെടാനുള്ള സാധ്യതയെ ചോദ്യം ചെയ്യുന്ന വാഗ്‌ചോദ്യത്തിന്റെ തുറന്ന സ്വഭാവം നിലനിർത്തുന്നു.
- source_word: φύγητε
  choice: രക്ഷപ്പെടും
  rationale: ἀπό + ജനിറ്റീവ് ഘടനയിൽ ‘നിന്ന് രക്ഷപ്പെടുക’ സ്വാഭാവിക മലയാളമാണ്; ഭാവിമുഖമായ വാഗ്‌ചോദ്യവും പ്രകടമാക്കുന്നു.
- source_word: κρίσεως
  choice: ന്യായവിധി
  rationale: ‘ശിക്ഷാവിധി’ അല്ലെങ്കിൽ ‘കുറ്റവിധി’ എന്നു വ്യാഖ്യാനപരമായി ചുരുക്കാതെ നീതിന്യായപരമായ വിശാല അർഥം സംരക്ഷിക്കുന്നു.
- source_word: γεέννης
  choice: ഗെഹെന്ന
  rationale: യഹൂദ ചരിത്ര-അന്ത്യകാല പശ്ചാത്തലമുള്ള ഗ്രീക്ക് പദത്തിന്റെ പ്രത്യേകത സംരക്ഷിക്കാൻ ലിപ്യന്തരണം ചെയ്യുന്നു; സാധാരണ പരിഭാഷ അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: γέεννα എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ഗെഹെന്ന
  alternative: നരകം
  rationale: മൂലപദത്തിന്റെ യഹൂദ പശ്ചാത്തലവും പ്രത്യേകതയും നിലനിർത്തുന്നു; ‘നരകം’ എന്ന പദത്തോട് പിന്നീട് ചേർന്ന എല്ലാ ആശയങ്ങളും മുഖ്യവാചകത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതിരിക്കാൻ അത് അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ നേരിട്ടും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ കടുത്ത സംബോധനയും വാഗ്‌ചോദ്യവും മൃദൂകരിക്കാതെ നിലനിർത്തിയിരിക്കുന്നു.
