id: MAT.23.28
reference: Matthew 23:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς ἔξωθεν μὲν φαίνεσθε τοῖς ἀνθρώποις δίκαιοι, ἔσωθεν δέ ⸂ἐστε μεστοὶ⸃ ὑποκρίσεως καὶ ἀνομίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/028.yaml
  text: In the same way[a], you also outwardly appear righteous to people, but inwardly you are full of hypocrisy and lawlessness.
translation:
  language: ml
  text: അതുപോലെതന്നെ, നിങ്ങളും പുറമേ മനുഷ്യരുടെ കാഴ്ചയിൽ നീതിമാന്മാരായി കാണപ്പെടുന്നു; എന്നാൽ ഉള്ളിൽ കപടതയും അധർമ്മവും നിറഞ്ഞവരാണ്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως καὶ
  choice: അതുപോലെതന്നെ
  rationale: മുൻവാക്യത്തിലെ വെള്ളപൂശിയ കല്ലറകളോടുള്ള ഉപമയിലേക്ക് ഈ വാക്യത്തെ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: ἔξωθεν ... ἔσωθεν
  choice: പുറമേ ... ഉള്ളിൽ
  rationale: ബാഹ്യമായ ദൃശ്യരൂപവും ആന്തരിക യാഥാർഥ്യവും തമ്മിലുള്ള ശക്തമായ വിരോധം ലളിതവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: φαίνεσθε
  choice: കാണപ്പെടുന്നു
  rationale: അവർ യഥാർഥത്തിൽ നീതിമാന്മാരാണെന്ന് ഉറപ്പിക്കാതെ, മറ്റുള്ളവരുടെ കാഴ്ചയിൽ ലഭിക്കുന്ന പ്രതീതിയെ സൂചിപ്പിക്കുന്നു.
- source_word: τοῖς ἀνθρώποις
  choice: മനുഷ്യർക്കു
  rationale: ഇവിടെ ἄνθρωπος പൊതുവായി മനുഷ്യരെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ലിംഗഭേദമില്ലാതെ അതേ വ്യാപ്തി നൽകുന്നു.
- source_word: δίκαιοι
  choice: നീതിമാന്മാരായി
  rationale: ധാർമ്മികവും മതപരവുമായ ശരിതനിമയുടെ പ്രതീതി നിലനിർത്തുന്നു; φαίνεσθε എന്ന ക്രിയയോടൊപ്പം ഇത് പ്രത്യക്ഷത്തിലുള്ള നീതിയാണെന്ന് വ്യക്തമാകുന്നു.
- source_word: μεστοὶ
  choice: നിറഞ്ഞവരാണ്
  rationale: ആന്തരിക സ്വഭാവം ഈ ദോഷങ്ങളാൽ പൂർണമായി നിറഞ്ഞിരിക്കുന്നുവെന്ന വിശേഷണപ്രയോഗത്തിന്റെ ശക്തി മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὑποκρίσεως
  choice: കപടഭക്തി
  rationale: ഈ മതനേതാക്കളെക്കുറിച്ചുള്ള സന്ദർഭത്തിൽ വെറും നടിപ്പിനേക്കാൾ മതപരമായ കപടതയെ വ്യക്തമായി സൂചിപ്പിക്കുന്ന പരിചിതമായ മലയാളപദമാണ്.
- source_word: ἀνομίας
  choice: അധർമ്മം
  rationale: ദൈവഹിതത്തിനും നിയമത്തിനും വിരുദ്ധമായ നിലയെ സൂചിപ്പിക്കുന്ന ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് പരിചിതവുമായ പദം; വെറും പൊതുവായ ദുഷ്ടതയായി ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: δίκαιοι യഥാർഥ നീതിസ്ഥിതിയെയോ മനുഷ്യരുടെ കാഴ്ചയിലെ പ്രതീതിയെയോ സൂചിപ്പിക്കുന്നുവോ
  choice: മനുഷ്യർക്കു നീതിമാന്മാരായി കാണപ്പെടുന്ന പ്രതീതി
  alternative: യഥാർഥത്തിൽ നീതിമാന്മാരായിരിക്കുക
  rationale: φαίνεσθε എന്ന ക്രിയയും ‘എന്നാൽ ഉള്ളിൽ’ എന്ന വിരോധവും യഥാർഥ നീതി അംഗീകരിക്കാതെ ബാഹ്യപ്രതീതി തുറന്നുകാട്ടുന്നു.
- issue: ἀνομίαയെ പൊതുവായ ദുഷ്ടതയായോ നിയമവിരുദ്ധതയായോ അവതരിപ്പിക്കൽ
  choice: അധർമ്മം
  alternative: നിയമലംഘനം / ദുഷ്ടത
  rationale: ദൈവത്തിന്റെ മാനദണ്ഡത്തോടുള്ള വിരോധത്തിന്റെ ദൈവശാസ്ത്രപരവും നൈതികവുമായ വ്യാപ്തി നിലനിർത്തുന്നു; ഒരൊറ്റ നിയമലംഘനത്തിലേക്ക് അർഥം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് സുലഭവുമായ മലയാളം. ‘പുറമേ ... ഉള്ളിൽ’ എന്ന സമാന്തരവിരോധം നിലനിർത്തി. പ്രത്യേക സമുദായപരമായ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
