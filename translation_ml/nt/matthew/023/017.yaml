id: MAT.23.17
reference: Matthew 23:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μωροὶ καὶ τυφλοί, τίς γὰρ μείζων ἐστίν, ὁ χρυσὸς ἢ ὁ ναὸς ὁ ⸀ἁγιάσας τὸν χρυσόν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/017.yaml
  text: 'You fools and blind men, for which is greater: the gold, or the temple that sanctified the gold?'
translation:
  language: ml
  text: മൂഢരും അന്ധരുമായവരേ! കാരണം, ഏതാണ് വലിയത്—സ്വർണമോ, സ്വർണത്തെ വിശുദ്ധമാക്കിയ[a] ദേവാലയമോ[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സ്വർണത്തെ വിശുദ്ധമാക്കിയത്.’
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിലെ ναός എന്ന പദം കൂടുതൽ പ്രത്യേകമായി ദേവാലയത്തിന്റെ വിശുദ്ധമന്ദിരത്തെ സൂചിപ്പിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: μωροὶ
  choice: മൂഢന്മാരേ
  rationale: നേരിട്ടുള്ള ബഹുവചന അഭിസംബോധനയും ശാസനയുടെ ശക്തിയും സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τυφλοί
  choice: അന്ധന്മാരായവരേ
  rationale: അഭിസംബോധനയിലെ വ്യക്തിപരമായ പ്രയോഗവും പുരുഷബഹുവചനരൂപവും വ്യക്തമാക്കുന്നു; മുൻപത്തെ പദവുമായി ചേർത്ത് സ്വാഭാവികമായി ‘മൂഢന്മാരും അന്ധന്മാരുമായവരേ’ എന്നു നൽകി.
- source_word: τίς γὰρ μείζων ἐστίν
  choice: ഏതാണ് വലിയത്
  rationale: പറഞ്ഞിരിക്കുന്ന രണ്ടു കാര്യങ്ങൾ തമ്മിലുള്ള താരതമ്യചോദ്യം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു. γάρ സൂചിപ്പിക്കുന്ന വിശദീകരണബന്ധം മുൻസന്ദർഭത്തോടുള്ള ചോദ്യത്തിന്റെ താർക്കിക തുടർച്ചയിൽ മലയാളത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: ὁ χρυσὸς
  choice: സ്വർണം
  rationale: സന്ദർഭത്തിൽ ചർച്ചചെയ്യപ്പെടുന്ന നിർദിഷ്ട സ്വർണത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ നിർദേശാർഥം പ്രത്യേക നിർദേശകപദമില്ലാതെയും വ്യക്തമാണ്.
- source_word: ὁ ναὸς
  choice: ദേവാലയം
  rationale: ക്ഷേത്രസമുച്ചയത്തേക്കാൾ പ്രത്യേകമായി വിശുദ്ധമന്ദിരത്തെ സൂചിപ്പിക്കാവുന്ന ναός എന്ന പദത്തിന് സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന രൂപം; കൂടുതൽ നിർദിഷ്ടമായ അർഥം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
- source_word: ὁ ἁγιάσας
  choice: വിശുദ്ധമാക്കിയ
  rationale: ആഓറിസ്റ്റ് കർത്തൃവാചക കൃദന്തരൂപത്തിന്റെ പൂർത്തിയായ പ്രവർത്തനഭാവവും ആരാധനാസംബന്ധിയായ ἁγιάζω എന്ന പദത്തിന്റെ അർഥവും സംരക്ഷിക്കുന്നു.
- source_word: τὸν χρυσόν
  choice: സ്വർണത്തെ
  rationale: ഗ്രീക്കിലെ കർമപദം ആവർത്തിക്കുന്നതുപോലെ സ്വർണം വീണ്ടും വ്യക്തമായി പറഞ്ഞ് വാക്യത്തിന്റെ വാദഘടന നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദേവാലയസന്ദർഭത്തിലെ ἁγιάζω എന്ന ആരാധനാസംബന്ധിയായ പദത്തിന്റെ പരിഭാഷ
  choice: വിശുദ്ധമാക്കിയ
  alternative: വിശുദ്ധമാക്കിയത് / വിശുദ്ധമാക്കുന്ന
  rationale: സ്വർണത്തിന് വിശുദ്ധപദവി നൽകുന്നത് ദേവാലയമാണെന്ന വാദം വ്യക്തമായി നിലനിർത്തുന്നു. ആഓറിസ്റ്റ് കൃദന്തരൂപത്തെ പൂർത്തിയായ പ്രവർത്തനമായി അവതരിപ്പിക്കുമ്പോഴും അതിന്റെ ദൈവശാസ്ത്രപരമായ പ്രവർത്തനരീതി അധികമായി വിശദീകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ യേശുവിന്റെ ശക്തമായ ശാസനയും ആരാധനാസംബന്ധിയായ ഗൗരവവും നിലനിർത്തുന്ന മലയാളം. ചോദ്യത്തിന്റെ താരതമ്യഘടന വ്യക്തമാക്കാൻ ദീർഘവിരാമചിഹ്നം ഉപയോഗിച്ചു.
