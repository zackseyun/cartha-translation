  to: മൂഢരും അന്ധരുമായവരേ! കാരണം, ഏതാണ് വലിയത്—സ്വർണമോ, സ്വർണത്തെ വിശുദ്ധമാക്കിയ[a] ദേവാലയമോ[b]?
