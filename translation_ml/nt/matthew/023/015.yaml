id: MAT.23.15
reference: Matthew 23:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι περιάγετε τὴν θάλασσαν καὶ τὴν ξηρὰν ποιῆσαι ἕνα προσήλυτον, καὶ ὅταν γένηται ποιεῖτε αὐτὸν υἱὸν γεέννης διπλότερον ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/015.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! Because you travel over sea and land to make one convert, and when he becomes one[b], you make him twice as much a son of Gehenna as yourselves.
translation:
  language: ml
  text: അയ്യോ, കപടികളായ ശാസ്ത്രിമാരും പരീശന്മാരുമായവരേ, നിങ്ങൾക്കു കഷ്ടം! ഒരാളെ യെഹൂദമതത്തിലേക്കു ചേർക്കാൻ നിങ്ങൾ കടലും കരയും ചുറ്റിനടക്കുന്നു. അയാൾ ചേർന്നുകഴിഞ്ഞാൽ, നിങ്ങൾ അയാളെ നിങ്ങളെക്കാൾ ഇരട്ടിയായി ഗെഹെന്നയുടെ മകനാക്കുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'പദശഃ: “ഗെഹെന്നയുടെ മകൻ.” ഒരാളുടെ സ്വഭാവത്തെയും വിധിയുമായുള്ള ബന്ധത്തെയും സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്. “ഗെഹെന്ന” എന്നത് യഹൂദ അന്ത്യകാലവിധിയുമായി ബന്ധപ്പെട്ട പദമാണ്; സാധാരണയായി “നരകം” എന്നും പരിഭാഷപ്പെടുത്തുന്നു.'
    reason: literal_idiom_and_term_explanation
lexical_decisions:
- source_word: Οὐαὶ ὑμῖν
  choice: നിങ്ങൾക്ക് അയ്യോ കഷ്ടം
  rationale: പ്രവാചകീയമായ അപലപനത്തിന്റെയും വരാനിരിക്കുന്ന ദുരന്തത്തെക്കുറിച്ചുള്ള മുന്നറിയിപ്പിന്റെയും ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: γραμματεῖς
  choice: ശാസ്ത്രിമാർ
  rationale: യഹൂദ തിരുവെഴുത്തുകളിലും ന്യായപ്രമാണത്തിലും പാണ്ഡിത്യമുള്ള അംഗീകൃത വിഭാഗത്തെ സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾ വായനക്കാർക്കു പരിചിതമായ പദം.
- source_word: Φαρισαῖοι
  choice: പരീശന്മാർ
  rationale: ചരിത്രപരമായ യഹൂദ മതവിഭാഗത്തിന്റെ മലയാളത്തിൽ സ്ഥാപിതമായ ലിപ്യന്തരണം.
- source_word: ὑποκριταί
  choice: കപടഭക്തർ
  rationale: ഇവിടെയുള്ള മതപരമായ നടിപ്പും ഉള്ളും പുറവും തമ്മിലുള്ള വൈരുധ്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: περιάγετε τὴν θάλασσαν καὶ τὴν ξηρὰν
  choice: കടലും കരയും ചുറ്റിനടക്കുന്നു
  rationale: വ്യാപകമായി സഞ്ചരിച്ച് വലിയ ശ്രമം ചെയ്യുന്നു എന്ന ആശയം സ്വാഭാവികമായി നൽകുകയും കടൽ-കര എന്ന മൂലപാഠത്തിലെ ദ്വന്ദ്വപ്രയോഗം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ποιῆσαι ἕνα προσήλυτον
  choice: ഒരാളെ യെഹൂദമതത്തിലേക്കു ചേർക്കാൻ
  rationale: προσήλυτος ഇവിടെ യെഹൂദമതം സ്വീകരിച്ച അന്യജാതിക്കാരനെ സൂചിപ്പിക്കുന്നു; പൊതുവായ ‘മതപരിവർത്തിതൻ’ എന്നതിനെക്കാൾ സന്ദർഭം വ്യക്തമായി നൽകുന്നു. അടുത്ത പദമായ ‘മതാനുസാരി’ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: ὅταν γένηται
  choice: അയാൾ ചേർന്നുകഴിയുമ്പോൾ
  rationale: മതാനുസാരിയായി തീരുക എന്ന സന്ദർഭസൂചന വ്യക്തമാക്കിക്കൊണ്ട് ഗ്രീക്കിലെ ഏകവചന പുല്ലിംഗ പരാമർശം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: υἱὸν γεέννης
  choice: ഗെഹെന്നയ്ക്കു യോഗ്യൻ
  rationale: ‘ഗെഹെന്നയുടെ പുത്രൻ’ എന്ന സെമിറ്റിക് പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; എന്നാൽ ഗെഹെന്ന എന്ന മൂലപദത്തിന്റെ ചരിത്ര-അന്ത്യകാല സൂചന നിലനിർത്തുന്നു. പദശഃ രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: διπλότερον ὑμῶν
  choice: നിങ്ങളെക്കാൾ ഇരട്ടിയായി
  rationale: താരതമ്യവും ഇരട്ടിയെന്ന ശക്തമായ അളവും വ്യക്തമായ ആധുനിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: γεέννα എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ഗെഹെന്ന
  alternative: നരകം
  rationale: മൂലപാഠത്തിലെ യഹൂദ ചരിത്രപരവും അന്ത്യകാലപരവുമായ പ്രത്യേക പദം പൊതുവായ ‘നരകം’ എന്ന ആശയത്തിലേക്ക് ചുരുക്കാതെ നിലനിർത്തുന്നു.
- issue: υἱὸν γεέννης എന്ന സെമിറ്റിക് പ്രയോഗം
  choice: ഗെഹെന്നയ്ക്കു യോഗ്യൻ
  alternative: ഗെഹെന്നയുടെ പുത്രൻ
  rationale: ബന്ധം, സ്വഭാവം, വിധിക്കുള്ള അർഹത എന്നിവ സൂചിപ്പിക്കുന്ന ‘പുത്രൻ’ പ്രയോഗത്തെ മലയാളത്തിൽ തെറ്റിദ്ധാരണയില്ലാതെ നൽകുന്നു; പദശഃ രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: προσήλυτος എന്നതിന്റെ സന്ദർഭപരമായ തിരിച്ചറിയൽ
  choice: യെഹൂദമതത്തിലേക്കു ചേർന്നയാൾ
  alternative: മതാനുസാരി / മതപരിവർത്തിതൻ
  rationale: വാക്യത്തിന്റെ ഒന്നാം നൂറ്റാണ്ടിലെ യഹൂദ പശ്ചാത്തലം വ്യക്തമാക്കുന്നു; ഇന്നത്തെ ഏതൊരു മതപരിവർത്തനത്തെയും പൊതുവായി ഉദ്ദേശിക്കുന്നതായി വായിക്കപ്പെടുന്നത് ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നേരിട്ടുള്ള അഭിസംബോധന. പരമ്പരാഗതമായി പരിചിതമായ ‘ശാസ്ത്രിമാർ’, ‘പരീശന്മാർ’ എന്നിവ നിലനിർത്തി; അപരിചിതമായ ‘ഗെഹെന്ന’ അടിക്കുറിപ്പിലൂടെ വിശദീകരിച്ചു. മൂലത്തിലെ കടുത്ത അപലപനഭാവം മൃദൂകരിച്ചിട്ടില്ല.
