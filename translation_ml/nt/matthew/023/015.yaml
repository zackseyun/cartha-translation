revisions:
- from: കപടഭക്തരായ ശാസ്ത്രിമാരേ, പരീശന്മാരേ, നിങ്ങൾക്ക് അയ്യോ കഷ്ടം! ഒരാളെ യെഹൂദമതത്തിലേക്കു ചേർക്കാൻ[a] നിങ്ങൾ കടലും കരയും ചുറ്റിനടക്കുന്നു. അയാൾ ചേർന്നുകഴിയുമ്പോൾ, നിങ്ങൾ അയാളെ നിങ്ങളെക്കാൾ ഇരട്ടിയായി ഗെഹെന്നയ്ക്കു യോഗ്യനാക്കുന്നു[b].
  to: അയ്യോ, കപടികളായ ശാസ്ത്രിമാരും പരീശന്മാരുമായവരേ, നിങ്ങൾക്കു കഷ്ടം! ഒരാളെ യെഹൂദമതത്തിലേക്കു ചേർക്കാൻ നിങ്ങൾ കടലും കരയും ചുറ്റിനടക്കുന്നു. അയാൾ ചേർന്നുകഴിഞ്ഞാൽ, നിങ്ങൾ അയാളെ നിങ്ങളെക്കാൾ ഇരട്ടിയായി ഗെഹെന്നയുടെ മകനാക്കുന്നു[a].
  rationale: The revision restores the source order and makes “hypocrites” modify both named groups. It keeps the historically contextual rendering of προσήλυτος as joining Judaism, while preserving υἱὸν γεέννης in the text rather than replacing it with an interpretive qualification. The footnote explains the Semitic idiom and gives the familiar alternative without importing it into the main translation.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:42:10Z'
review_pass:
  verdict: revise
  source_fidelity: The draft preserves the broad denunciatory force, the extensive-travel idiom, the Jewish contextual sense of προσήλυτος, and the comparative “twice as much.” However, ὑποκριταί addresses both scribes and Pharisees, whereas the present word order can attach “കപടഭക്തരായ” only to the scribes. Further, “ഗെഹെന്നയ്ക്കു യോഗ്യനാക്കുന്നു” interprets υἱὸν γεέννης rather than translating its “son of Gehenna” idiom in the text.
  naturalness: The proposed revision uses direct, dignified modern standard Malayalam. “അയ്യോ, നിങ്ങൾക്കു കഷ്ടം!” is a natural prophetic exclamation, and “ചേർന്നുകഴിഞ്ഞാൽ” is smoother than “ചേർന്നുകഴിയുമ്പോൾ.”
  terminology: “ശാസ്ത്രിമാർ,” “പരീശന്മാർ,” and “ഗെഹെന്ന” are suitable established terms. “കപടികളായ” is closer to ὑποκριταί than “കപടഭക്തരായ,” which adds a specifically devotional nuance. The footnote retains “നരകം” only as an alternative, without replacing the source term in the text.
  issues:
  - severity: medium
    issue: The address does not unambiguously identify both scribes and Pharisees as hypocrites.
    rationale: Greek γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί applies ὑποκριταί to the combined group. The revision makes that syntactic relationship explicit.
  - severity: medium
    issue: “ഗെഹെന്നയ്ക്കു യോഗ്യനാക്കുന്നു” is interpretive rather than a full rendering of υἱὸν γεέννης.
    rationale: Although the phrase conveys an aspect of the idiom, it omits the source’s familial/identity idiom. A natural Malayalam form of “son of Gehenna” can be retained in the main text, with explanation in a footnote.
  - severity: low
    issue: “ചേർന്നുകഴിയുമ്പോൾ” is less idiomatic in this conditional-result context.
    rationale: “ചേർന്നുകഴിഞ്ഞാൽ” naturally conveys “when he becomes [one]” in Malayalam.
  revised_text: അയ്യോ, കപടികളായ ശാസ്ത്രിമാരും പരീശന്മാരുമായവരേ, നിങ്ങൾക്കു കഷ്ടം! ഒരാളെ യെഹൂദമതത്തിലേക്കു ചേർക്കാൻ നിങ്ങൾ കടലും കരയും ചുറ്റിനടക്കുന്നു. അയാൾ ചേർന്നുകഴിഞ്ഞാൽ, നിങ്ങൾ അയാളെ നിങ്ങളെക്കാൾ ഇരട്ടിയായി ഗെഹെന്നയുടെ മകനാക്കുന്നു[a].
