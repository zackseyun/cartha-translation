  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁδηγοὶ τυφλοί, ⸀οἱ διϋλίζοντες τὸν κώνωπα τὴν δὲ κάμηλον καταπίνοντες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/024.yaml
  text: Blind guides[a], straining out the gnat but swallowing the camel!
translation:
  language: ml
  text: അന്ധരായ വഴികാട്ടികളേ! കൊതുകിനെ അരിച്ചുനീക്കുകയും എന്നാൽ ഒട്ടകത്തെ വിഴുങ്ങുകയും ചെയ്യുന്നവരേ!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁδηγοὶ τυφλοί
  choice: അന്ധരായ വഴികാട്ടികളേ
  rationale: സംബോധനയുടെ രൂപവും ആത്മീയ വിവേചനമില്ലായ്മയെ സൂചിപ്പിക്കുന്ന ശക്തമായ രൂപകവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: διϋλίζοντες
  choice: അരിച്ചുനീക്കുകയും
  rationale: പാനീയത്തിൽനിന്ന് ചെറിയ അശുദ്ധവസ്തു അരിച്ച് പുറത്താക്കുന്ന പ്രവൃത്തിയെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τὸν κώνωπα
  choice: കൊതുകിനെ
  rationale: κώνωψ എന്നത് കൊതുകിനെയോ അതുപോലുള്ള ചെറുപ്രാണിയെയോ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ വ്യക്തവും പരിചിതവുമായ സമാനപദമാണ് ‘കൊതുക്’.
- source_word: τὴν δὲ κάμηλον
  choice: ഒട്ടകത്തെ
  rationale: ചെറിയ കൊതുകും ഭീമമായ ഒട്ടകവും തമ്മിലുള്ള അതിശയോക്തിപരമായ വൈരുധ്യം അതേപടി സംരക്ഷിക്കുന്നു.
- source_word: καταπίνοντες
  choice: വിഴുങ്ങുകയും ചെയ്യുന്നവരേ
  rationale: καταπίνω എന്ന ക്രിയയുടെ ശക്തവും ദൃശ്യവുമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ആചാരപരമായ അശുദ്ധിയുടെ രൂപകവും ധാർമിക അനുപാതവും
  choice: കൊതുകിനെ അരിച്ചുനീക്കി ഒട്ടകത്തെ വിഴുങ്ങുന്ന മൂർത്തമായ ചിത്രം നിലനിർത്തുക
  alternative: ചെറിയ തെറ്റുകൾ ഒഴിവാക്കുകയും വലിയ തെറ്റുകൾ സഹിക്കുകയും ചെയ്യുന്നു എന്ന് വ്യാഖ്യാനാത്മകമായി പറയുക
  rationale: ഗ്രീക്ക് വാക്യത്തിന്റെ പ്രഹരശക്തി ചെറുതിനെക്കുറിച്ചുള്ള സൂക്ഷ്മശ്രദ്ധയും വലുതിനെ അവഗണിക്കുന്നതും തമ്മിലുള്ള അസംബന്ധ വൈരുധ്യത്തിലാണ്; ചിത്രം വ്യാഖ്യാനിച്ച് ലഘൂകരിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക സ്റ്റാൻഡേർഡ് മലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ കടുത്ത സംബോധനയും സമാന്തര ക്രിയാരൂപങ്ങളും നിലനിർത്തിയിരിക്കുന്നു.
