  text: ὁ δὲ μείζων ὑμῶν ἔσται ὑμῶν διάκονος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/011.yaml
  text: But the greatest among you will be your servant[a].
translation:
  language: ml
  text: എന്നാൽ നിങ്ങളിൽ ഏറ്റവും വലിയവൻ നിങ്ങളുടെ സേവകനായിരിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘നിങ്ങളിൽ വലിയവൻ നിങ്ങളുടെ സേവകനായിരിക്കും.’ ഗ്രീക്കിലെ താരതമ്യരൂപം ഇവിടെ കൂട്ടത്തിലെ ഏറ്റവും ഉയർന്ന സ്ഥാനമുള്ള വ്യക്തിയെ സൂചിപ്പിക്കുന്ന പ്രയോഗമായിരിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭത്തിലെ പദവിമോഹത്തോടുള്ള വൈരുധ്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: μείζων
  choice: ഏറ്റവും വലിയവൻ
  rationale: താരതമ്യരൂപമാണെങ്കിലും ഇവിടെ കൂട്ടത്തിനുള്ളിലെ പരമസ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന അതിശയോത്തരസമാന പ്രയോഗമാണ്; അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ὑμῶν (first)
  choice: നിങ്ങളിൽ
  rationale: ആദ്യ ജനിറ്റീവ് കൂട്ടത്തിൽനിന്നുള്ള ഒരാളെ സൂചിപ്പിക്കുന്ന ഭാഗിക അർഥത്തിൽ സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
- source_word: ἔσται
  choice: ആയിരിക്കും
  rationale: εἰμίയുടെ ഭാവികാലത്തെ ആധുനിക മലയാളത്തിൽ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: ὑμῶν (second)
  choice: നിങ്ങളുടെ
  rationale: διάκονος എന്നതിനോടുള്ള ബന്ധം/ഉടമസ്ഥത സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: διάκονος
  choice: ശുശ്രൂഷകൻ
  rationale: ഇവിടെ സഭാപദവിയല്ല, മറ്റുള്ളവരെ സേവിക്കുന്ന വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ശുശ്രൂഷകൻ’ ഗൗരവമുള്ളതും ബൈബിൾസന്ദർഭത്തിൽ സ്വാഭാവികവുമാണ്; സാങ്കേതികമായ ‘ഡീക്കൻ’ ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: മഹത്വവും സേവനവും തമ്മിലുള്ള സ്ഥാനവിപരീതം
  choice: ‘ഏറ്റവും വലിയവൻ ... ശുശ്രൂഷകനായിരിക്കും’ എന്ന നൈതിക സ്ഥാനവിപരീതം നിലനിർത്തി.
  alternative: ‘കൂടുതൽ വലിയവൻ ... ദാസനായിരിക്കും’
  rationale: യഥാർഥ മഹത്വം സേവനത്തിൽ പ്രകടമാകുന്നു എന്ന വചനത്തിന്റെ സംഘർഷം മൃദൂകരിക്കാതെയും പിൽക്കാല സഭാപദവി അർഥം ചേർക്കാതെയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളം; സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, ഗൗരവമുള്ള ശൈലി. ‘ഡീക്കൻ’ പോലുള്ള സാങ്കേതിക സഭാപദവി ഒഴിവാക്കി; ഗ്രീക്ക് താരതമ്യരൂപത്തിലെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
