id: MAT.23.36
reference: Matthew 23:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ⸀ἥξει ⸂ταῦτα πάντα⸃ ἐπὶ τὴν γενεὰν ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/036.yaml
  text: Truly I say to you[b][a], all these things will come upon this generation.
translation:
  language: ml
  text: 'സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: ഇവയെല്ലാം ഈ തലമുറയുടെമേൽ വരും.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഈ തലമുറ’ എന്നത് ചിലർ ‘ഈ ആളുകൾ’ എന്നോ, അവിശ്വാസത്താൽ സവിശേഷമായ കൂടുതൽ വിശാലമായൊരു തലമുറ എന്നോ മനസ്സിലാക്കുന്നു; എന്നാൽ ഗ്രീക്കിൽ ഏറ്റവും നേരിട്ടുള്ള വായന ‘ഈ തലമുറ’ എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: സത്യമായി
  rationale: സിനോപ്റ്റിക് സുവിശേഷങ്ങളിലെ ഗൗരവമേറിയ ഉറപ്പുനൽകുന്ന ആമുഖപ്രയോഗത്തിന്റെ ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: വർത്തമാനകാല ക്രിയയും ബഹുവചന ദ്വിതീയപുരുഷ ദത്തിവും നേരായും ഗൗരവമുള്ള ശൈലിയിലും പകർന്നിരിക്കുന്നു.
- source_word: ἥξει
  choice: വരും
  rationale: ἥκωയുടെ ഭാവികാലരൂപം ഇവിടെ മുമ്പ് വിവരിച്ച കാര്യങ്ങൾ ഈ തലമുറയെ ബാധിക്കാൻ എത്തിച്ചേരുന്നതിനെ സൂചിപ്പിക്കുന്നു; 'വരും' മലയാളത്തിൽ സ്വാഭാവികവും അർത്ഥസൂക്ഷ്മത നിലനിർത്തുന്നതുമാണ്.
- source_word: ταῦτα πάντα
  choice: ഇവയെല്ലാം
  rationale: നപുംസകലിംഗ ബഹുവചന സർവനാമത്തോടുകൂടിയ πᾶς എന്ന പ്രയോഗത്തെ വ്യക്തമായ ബഹുവചനമായി പകർന്നു; മുൻസന്ദർഭത്തിലെ ന്യായവിധിയും രക്തപാതകബാധ്യതയും ഇതിൽ ഉൾപ്പെടുന്നു.
- source_word: ἐπὶ
  choice: മേൽ
  rationale: അക്കൂസറ്റീവിനോടുകൂടിയ ἐπί ഇവിടെ കാര്യങ്ങൾ ഒരാളിലേക്കോ ഒരു കൂട്ടത്തിലേക്കോ വന്നുചേരുന്നതിനെ സൂചിപ്പിക്കുന്നു; 'മേൽ' ന്യായവിധിയുടെ ഗൗരവം നിലനിർത്തുന്നു, എന്നാൽ 'എതിരായി' എന്ന വ്യാഖ്യാനം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: γενεὰν ταύτην
  choice: ഈ തലമുറ
  rationale: γενεάയുടെ ഏറ്റവും നേരിട്ടുള്ള അർത്ഥം 'തലമുറ' എന്നതാണ്; 'ഈ' എന്ന നിർദ്ദേശകം മൂലപാഠത്തിന്റെ സമീപസൂചനയും കാലപരമായ ശക്തിയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: γενεὰν ταύτην എന്നതിന്റെ സൂചിതവിഷയം
  choice: '''ഈ തലമുറ'' എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തി; അതിന്റെ പരിധിയെ വ്യാഖ്യാനിച്ച് വിപുലീകരിച്ചില്ല.'
  alternative: '''ഈ ആളുകൾ,'' അവിശ്വാസത്താൽ സവിശേഷമായ വിശാലമായൊരു ജനവിഭാഗം, യഹൂദജനത, അല്ലെങ്കിൽ ഇപ്പോഴത്തെ യുഗം എന്നിങ്ങനെ വ്യാഖ്യാനിക്കാം.'
  rationale: ഗ്രീക്ക് പദപ്രയോഗം ഏറ്റവും നേരിട്ട് 'ഈ തലമുറ' എന്നാണ് വായിക്കപ്പെടുന്നത്. അതിന്റെ കൃത്യമായ പരിധിയെ ഒരു പ്രത്യേക അന്ത്യകാലവ്യവസ്ഥ അനുസരിച്ച് തീർപ്പാക്കാതെ, പാഠത്തിലെ കാലപരമായ ശക്തിയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. യേശുവിന്റെ ഔദ്യോഗികമായ പ്രഖ്യാപനശൈലി നിലനിർത്താൻ 'സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു' ഉപയോഗിച്ചു. മൂലത്തിലെ ταῦτα πάντα വ്യക്തമായ ബഹുവചനമായതിനാൽ 'ഇവയെല്ലാം' എന്നു പകർന്നു; അതിനായി വേറൊരു പാഠക്കുറിപ്പ് ആവശ്യമില്ല.
