id: MAT.23.12
reference: Matthew 23:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅστις δὲ ὑψώσει ἑαυτὸν ταπεινωθήσεται, καὶ ὅστις ταπεινώσει ἑαυτὸν ⸀ὑψωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/012.yaml
  text: But whoever exalts himself will be humbled[b][a], and whoever humbles himself will be exalted.
translation:
  language: ml
  text: എന്നാൽ സ്വയം ഉയർത്തുന്നവൻ താഴ്ത്തപ്പെടും[b]; സ്വയം താഴ്ത്തുന്നവൻ ഉയർത്തപ്പെടും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ പുരുഷലിംഗ ഏകവചനരൂപമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; പൊതുപ്രസ്താവനയായതിനാൽ അത് ഏതൊരു വ്യക്തിയെയും പ്രതിനിധീകരിക്കുന്നു.
    reason: cultural_note
  - marker: b
    text: 'അഥവാ: ‘താഴ്ചയിലാക്കപ്പെടും’ … ‘ഉന്നതിയിലാക്കപ്പെടും.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: …വൻ
  rationale: അനിശ്ചിത ബന്ധസർവനാമത്തിന്റെ പൊതുവായ, സദൃശവാക്യസ്വഭാവമുള്ള അർഥം മലയാളത്തിലെ ‘…വൻ’ എന്ന ഘടന സ്വാഭാവികമായി നൽകുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭത്തോടുള്ള മൃദുവായ വൈരുധ്യം സൂചിപ്പിക്കുന്നു.
- source_word: ὑψώσει ἑαυτὸν
  choice: തന്നെത്താൻ ഉയർത്തുന്നവൻ
  rationale: സ്വയം മഹത്വപ്പെടുത്തുക എന്ന ആശയം നിലനിർത്തിക്കൊണ്ട് ὑψόω എന്ന ക്രിയയുടെ ‘ഉയർത്തുക’ എന്ന രൂപകവും സംരക്ഷിക്കുന്നു.
- source_word: ταπεινωθήσεται
  choice: താഴ്ത്തപ്പെടും
  rationale: ഭാവികാല കർമണിപ്രയോഗം സംരക്ഷിക്കുകയും പ്രവർത്തകനെ വ്യക്തമാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ταπεινώσει ἑαυτὸν
  choice: തന്നെത്താൻ താഴ്ത്തുന്നവൻ
  rationale: സ്വയം താഴ്മപ്പെടുത്തുക എന്ന പ്രതിഫലനാർഥവും ആദ്യ പാദത്തോടുള്ള സമാന്തരതയും നിലനിർത്തുന്നു.
- source_word: ὑψωθήσεται
  choice: ഉയർത്തപ്പെടും
  rationale: ഭാവികാല കർമണിപ്രയോഗവും ‘ഉയർത്തുക/ഉയർത്തപ്പെടുക’ എന്ന പദസമാന്തരതയും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: കർമണിപ്രയോഗങ്ങളിലെ പ്രവർത്തകൻ
  choice: പ്രവർത്തകനെ പേരെടുത്തുപറയാതെ കർമണിരൂപങ്ങൾ നിലനിർത്തുക
  alternative: ‘ദൈവം താഴ്ത്തും/ഉയർത്തും’ എന്ന് സജീവരൂപത്തിൽ വിവർത്തനം ചെയ്യുക
  rationale: ഗ്രീക്ക് മൂലപാഠം പ്രവർത്തകനെ തുറന്നുപറയുന്നില്ല; അതിനാൽ ദൈവിക പ്രവർത്തനം സൂചിതമായിരിക്കാമെങ്കിലും അത് വിവർത്തനത്തിൽ നിർബന്ധമായി വ്യക്തമാക്കുന്നില്ല.
- issue: പുരുഷലിംഗ ഏകവചനത്തിന്റെ പൊതുപ്രതിനിധാനം
  choice: മലയാളത്തിൽ ‘…വൻ’ എന്ന ഏകവചന പൊതുരൂപം ഉപയോഗിക്കുക
  alternative: ‘ആരെല്ലാം’ അല്ലെങ്കിൽ ബഹുവചന ലിംഗനിരപേക്ഷ ഘടന ഉപയോഗിക്കുക
  rationale: മൂലത്തിലെ ഏകവചന പൊതുപ്രസ്താവന സംരക്ഷിക്കുന്നു; ഇത് പുരുഷന്മാർക്ക് മാത്രം ബാധകമാണെന്നല്ല, ഏതൊരാളെയും പ്രതിനിധീകരിക്കുന്ന പ്രയോഗമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ സമമിത ഘടനയും ഉയർത്തുക/താഴ്ത്തുക എന്ന വിരുദ്ധപദബന്ധവും കർമണിപ്രയോഗവും നിലനിർത്തിയിരിക്കുന്നു.
