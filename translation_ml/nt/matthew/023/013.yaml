id: MAT.23.13
reference: Matthew 23:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οὐαὶ ⸀δὲ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι κλείετε τὴν βασιλείαν τῶν οὐρανῶν ἔμπροσθεν τῶν ἀνθρώπων· ὑμεῖς γὰρ οὐκ εἰσέρχεσθε, οὐδὲ τοὺς εἰσερχομένους ἀφίετε ⸀εἰσελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/013.yaml
  text: But woe to you[a], scribes and Pharisees, hypocrites! For you shut the kingdom of heaven before people; for you do not enter[c][b], nor do you allow those who are entering to enter.
translation:
  language: ml
  text: എന്നാൽ ശാസ്ത്രിമാരും പരീശന്മാരുമായ കപടികളേ, നിങ്ങൾക്കു അയ്യോ കഷ്ടം! നിങ്ങൾ മനുഷ്യരുടെ മുമ്പിൽ സ്വർഗരാജ്യം അടച്ചുകളയുന്നു. നിങ്ങൾ അതിൽ പ്രവേശിക്കുന്നില്ല; പ്രവേശിക്കുന്നവരെ പ്രവേശിക്കാൻ അനുവദിക്കുന്നുമില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പ്രവേശിക്കുന്നവരെ” എന്നതിന് “പ്രവേശിക്കാൻ ശ്രമിക്കുന്നവരെ” എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαὶ
  choice: അയ്യോ കഷ്ടം
  rationale: പ്രവാചകീയമായ അപലപനവും വരാനിരിക്കുന്ന ന്യായവിധിയുടെ ഗൗരവവും നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: വാക്യപരമ്പരയിലെ ലഘുവായ മാറ്റവും വിരുദ്ധഭാവവും സൂചിപ്പിക്കുന്നു.
- source_word: γραμματεῖς
  choice: ശാസ്ത്രിമാർ
  rationale: സുവിശേഷസന്ദർഭത്തിൽ സ്ഥിരമായി ഉപയോഗിക്കപ്പെടുന്ന, യഹൂദ തിരുവെഴുത്തുപണ്ഡിതരെ സൂചിപ്പിക്കുന്ന പദം.
- source_word: Φαρισαῖοι
  choice: പരീശന്മാർ
  rationale: സംഘനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: ὑποκριταί
  choice: കപടഭക്തർ
  rationale: ഈ മതപരമായ സന്ദർഭത്തിലെ പുറമേയുള്ള ഭക്തിപ്രകടനവും ഉള്ളിലെ കപടതയും സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: κλείετε
  choice: അടച്ചുകളയുന്നു
  rationale: പ്രവേശനം തടയുന്ന രൂപകം ശക്തമായി നിലനിർത്തുന്നു.
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: സ്വർഗരാജ്യം
  rationale: മത്തായിയുടെ സവിശേഷ പ്രയോഗത്തിന് മലയാളത്തിൽ സ്വാഭാവികവും പരിചിതവുമായ തുല്യപദം; 'ദൈവരാജ്യം' എന്നാക്കി വ്യാഖ്യാനപരമായി മാറ്റുന്നില്ല.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: മനുഷ്യരുടെ മുമ്പിൽ
  rationale: മറ്റുള്ളവരുടെ പ്രവേശനത്തിനു മുന്നിൽ തടസ്സമുണ്ടാക്കുന്ന ദൃശ്യരൂപം ഔപചാരികവും വ്യക്തവുമായി സംരക്ഷിക്കുന്നു.
- source_word: εἰσέρχεσθε
  choice: പ്രവേശിക്കുന്നില്ല
  rationale: രാജ്യത്തിലേക്കുള്ള പ്രവേശനരൂപകം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: τοὺς εἰσερχομένους
  choice: പ്രവേശിച്ചുകൊണ്ടിരിക്കുന്നവർ
  rationale: വർത്തമാന കൃദന്തത്തിന്റെ പുരോഗമനഭാവം നിലനിർത്തുന്നു; ശ്രമിക്കുന്നവർ എന്ന വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ നിർബന്ധിക്കുന്നില്ല.
- source_word: ἀφίετε εἰσελθεῖν
  choice: പ്രവേശിക്കാൻ അനുവദിക്കുന്നുമില്ല
  rationale: അനുവദിക്കാതിരിക്കുക എന്ന അർഥവും εἰσελθεῖν എന്ന ക്രിയയുടെ പ്രവേശനാർഥവും വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: βασιλεία τῶν οὐρανῶν എന്ന മത്തായിയുടെ പ്രയോഗം
  choice: സ്വർഗരാജ്യം
  alternative: സ്വർഗങ്ങളുടെ രാജ്യം
  rationale: പരിചിതവും സ്വാഭാവികവുമായ മലയാളം ഉപയോഗിക്കുമ്പോഴും ഇതിനെ 'ദൈവരാജ്യം' എന്നു മാറ്റി ദൈവശാസ്ത്രപരമായ സമീകരണം നിർബന്ധിക്കുന്നില്ല.
- issue: τοὺς εἰσερχομένους എന്ന വർത്തമാന കൃദന്തത്തിന്റെ ഭാവം
  choice: പ്രവേശിച്ചുകൊണ്ടിരിക്കുന്നവർ
  alternative: പ്രവേശിക്കാൻ ശ്രമിക്കുന്നവർ
  rationale: പ്രവേശനത്തിലിരിക്കുന്നവരോ പ്രവേശനം തേടുന്നവരോ എന്ന ഗ്രീക്കിലെ സാധ്യത തുറന്നുവെക്കുന്നു; ശ്രമമെന്ന ആശയം മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
- issue: ἀνθρώπων എന്ന പൊതുവാചകത്തിന്റെ പരിധി
  choice: മനുഷ്യർ
  alternative: ആളുകൾ
  rationale: ലിംഗവിശേഷമില്ലാത്ത ഗ്രീക്ക് അർഥം ഔപചാരികവും ഉൾക്കൊള്ളുന്നതുമായ രീതിയിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള, പൊതുവായ ബൈബിൾ ശൈലി. ഗ്രീക്കിലെ ആവർത്തനവും പ്രവേശനരൂപകവും കഴിയുന്നത്ര നിലനിർത്തിയിട്ടുണ്ട്; അപരിചിതമായ അത്യന്തം അക്ഷരാർഥപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
