  source_fidelity: The draft accurately retains the woe, the named groups, the kingdom-access metaphor, the generic reference to people, and the paired verbs concerning entering and preventing entry. However, “കപടഭക്തർ” adds the specific idea of religious devotion not stated by ὑποκριταί (“hypocrites”).
  naturalness: The Malayalam is generally clear and in an appropriate serious biblical register. “പ്രവേശിക്കുന്നവരെ പ്രവേശിക്കാൻ അനുവദിക്കുന്നുമില്ല” intentionally retains the Greek verbal repetition and is understandable in modern standard Malayalam.
