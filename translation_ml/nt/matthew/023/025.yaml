  to: ശാസ്ത്രിമാരും പരീശന്മാരുമായ കപടന്മാരേ, നിങ്ങൾക്കു അയ്യോ! നിങ്ങൾ പാനപാത്രത്തിന്റെയും തളികയുടെയും പുറം വൃത്തിയാക്കുന്നു; എന്നാൽ അവയുടെ അകം കൊള്ളയും ആത്മനിയന്ത്രണമില്ലായ്മയുംകൊണ്ട് നിറഞ്ഞിരിക്കുന്നു.[a]
