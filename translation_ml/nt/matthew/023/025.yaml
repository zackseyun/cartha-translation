  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι καθαρίζετε τὸ ἔξωθεν τοῦ ποτηρίου καὶ τῆς παροψίδος, ἔσωθεν δὲ γέμουσιν ἐξ ἁρπαγῆς καὶ ⸀ἀκρασίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/025.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! For you clean the outside of the cup and the dish, but inside they are full of greed and self-indulgence.
translation:
  language: ml
  text: ശാസ്ത്രിമാരും പരീശന്മാരുമായ കപടന്മാരേ, നിങ്ങൾക്കു അയ്യോ! നിങ്ങൾ പാനപാത്രത്തിന്റെയും തളികയുടെയും പുറം വൃത്തിയാക്കുന്നു; എന്നാൽ അവയുടെ അകം കൊള്ളയും ആത്മനിയന്ത്രണമില്ലായ്മയുംകൊണ്ട് നിറഞ്ഞിരിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കൊള്ള” എന്നതിന് “അത്യാഗ്രഹം” എന്നും “ചൂഷണത്തിലൂടെ കൈക്കലാക്കൽ” എന്നും അർഥമാകാം; “ആത്മനിയന്ത്രണമില്ലായ്മ” എന്നതിന് “സ്വയംസുഖാസക്തി” അല്ലെങ്കിൽ “അതിരുകടന്ന ഭോഗാസക്തി” എന്നും അർഥമാകാം. ഗ്രീക്ക് പദങ്ങൾ ചൂഷണപരമായ കൈവശപ്പെടുത്തലിന്റെയും നിയന്ത്രണമില്ലാത്ത അതിരുകടക്കലിന്റെയും ശക്തമായ ഭാവം വഹിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαὶ ὑμῖν
  choice: നിങ്ങൾക്ക് അയ്യോ കഷ്ടം
  rationale: പ്രവാചകീയമായ അപലപനവും വരാനിരിക്കുന്ന ദുരവസ്ഥയുടെ മുന്നറിയിപ്പും നിലനിർത്തുന്ന, മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന പ്രയോഗം.
- source_word: γραμματεῖς
  choice: ശാസ്ത്രിമാർ
  rationale: സുവിശേഷസന്ദർഭത്തിൽ യഹൂദ തിരുവെഴുത്തുകളിലും നിയമത്തിലും വൈദഗ്ധ്യമുള്ള വിഭാഗത്തിനുള്ള സ്ഥിരവും പരിചിതവുമായ മലയാളപദം.
- source_word: Φαρισαῖοι
  choice: പരീശന്മാർ
  rationale: ഈ യഹൂദ മതവിഭാഗത്തിന്റെ പേരിന് മലയാള ബൈബിൾ ഭാഷയിൽ സ്ഥാപിതമായ രൂപം.
- source_word: ὑποκριταί
  choice: കപടഭക്തർ
  rationale: മതപരമായ പുറംപ്രകടനവും ഉള്ളിലെ യാഥാർഥ്യവും തമ്മിലുള്ള വൈരുധ്യം സ്വാഭാവികമായി അറിയിക്കുന്നു; വെറും ‘കപടന്മാർ’ എന്നതിനെക്കാൾ സന്ദർഭസൂചന നൽകുന്നു.
- source_word: καθαρίζετε
  choice: വൃത്തിയാക്കുന്നു
  rationale: പാത്രങ്ങളുടെ പുറം ശുചിയാക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും ആധുനികവുമായ മലയാളപ്രയോഗം.
- source_word: τὸ ἔξωθεν
  choice: പുറം
  rationale: ἔσωθεν എന്ന ‘അകം’ എന്ന പദത്തോടുള്ള നേരിട്ടുള്ള വിരോധം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ποτηρίου
  choice: പാനപാത്രം
  rationale: കുടിക്കാനുള്ള പാത്രം എന്ന അർഥം കൃത്യമായി നൽകുന്ന മാന്യവും സാധാരണ വായനക്കാർക്ക് പരിചിതവുമായ പദം.
- source_word: παροψίδος
  choice: തളിക
  rationale: ഭക്ഷണം വിളമ്പുന്ന പൊതുവായ മേശപ്പാത്രത്തെ സൂചിപ്പിക്കുന്നു; പ്രത്യേക ആകൃതി അനാവശ്യമായി നിശ്ചയിക്കുന്നില്ല.
- source_word: ἔσωθεν
  choice: അകം
  rationale: പാത്രങ്ങളുടെ പുറം–അകം ദൃശ്യവൈരുധ്യം വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: γέμουσιν
  choice: അവയുടെ അകം ... നിറഞ്ഞിരിക്കുന്നു
  rationale: ഗ്രീക്കിലെ ബഹുവചനക്രിയയെ പാനപാത്രവും തളികയും ചേർന്നുള്ള പരാമർശമായി നിലനിർത്തുന്നു; നേതാക്കളുടെ ഹൃദയങ്ങൾ എന്ന് വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കുന്നില്ല.
- source_word: ἁρπαγῆς
  choice: അത്യാഗ്രഹം
  rationale: കൈവശപ്പെടുത്താനുള്ള ചൂഷണപരമായ ആർത്തിയെ സന്ദർഭോചിതമായി അറിയിക്കുന്നു; കൊള്ള, പിടിച്ചുപറി, ചൂഷണം എന്നീ കൂടുതൽ ശക്തമായ അർഥസാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἀκρασίας
  choice: ആത്മനിയന്ത്രണമില്ലായ്മ
  rationale: ആഗ്രഹങ്ങളെ നിയന്ത്രിക്കാത്ത അവസ്ഥ എന്ന അടിസ്ഥാന അർഥം നേരിട്ട് നൽകുന്നു; ‘സ്വയംസുഖാസക്തി’ എന്ന വ്യാഖ്യാനപരമായ അർഥത്തിൽ മാത്രം ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: അകത്തെ അശുദ്ധിയുടെ രൂപകാലങ്കാരപരമായ സൂചിതവിഷയം
  choice: പാനപാത്രത്തിന്റെയും തളികയുടെയും അകം നിറഞ്ഞിരിക്കുന്നു എന്ന ഗ്രീക്ക് രൂപകം നിലനിർത്തി
  alternative: നിങ്ങളുടെ അകം അത്യാഗ്രഹവും ആത്മനിയന്ത്രണമില്ലായ്മയുംകൊണ്ട് നിറഞ്ഞിരിക്കുന്നു
  rationale: വിമർശനം മതനേതാക്കളെ ലക്ഷ്യമിടുന്നതു വ്യക്തമാണെങ്കിലും, ഈ ഉപവാക്യത്തിൽ ഗ്രീക്ക് പാത്രങ്ങളുടെ രൂപകത്തെ തന്നെയാണ് വ്യാകരണപരമായി മുന്നിൽ നിർത്തുന്നത്; അതിനെ നേതാക്കളുടെ ഉള്ളം എന്നു തുറന്നുപറയുന്നത് വ്യാഖ്യാനവികാസമാകും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനയ്ക്ക് എളുപ്പവുമായ മലയാളം. പ്രവാചകീയ അപലപനത്തിന്റെ ശക്തി നിലനിർത്തിയിട്ടുണ്ട്. ‘കപടഭക്തർ’ സന്ദർഭത്തിലെ മതപരമായ നടിപ്പ് വ്യക്തമാക്കുന്നു; പാത്രങ്ങളുടെ പുറം–അകം രൂപകം വ്യാഖ്യാനിച്ച് ലയിപ്പിക്കാതെ സംരക്ഷിച്ചിട്ടുണ്ട്.
