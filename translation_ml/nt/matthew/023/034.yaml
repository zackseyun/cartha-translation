id: MAT.23.34
reference: Matthew 23:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἰδοὺ ἐγὼ ἀποστέλλω πρὸς ὑμᾶς προφήτας καὶ σοφοὺς καὶ γραμματεῖς· ⸀ἐξ αὐτῶν ἀποκτενεῖτε καὶ σταυρώσετε, καὶ ἐξ αὐτῶν μαστιγώσετε ἐν ταῖς συναγωγαῖς ὑμῶν καὶ διώξετε ἀπὸ πόλεως εἰς πόλιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/034.yaml
  text: Therefore, look, I am sending to you prophets and wise men and scribes. Some of them you will kill and crucify, and some of them you will flog in your synagogues and persecute from city to city.
translation:
  language: ml
  text: അതുകൊണ്ട്, ഇതാ, ഞാൻ നിങ്ങളുടെ അടുക്കലേക്ക് പ്രവാചകന്മാരെയും ജ്ഞാനികളെയും ശാസ്ത്രിമാരെയും അയയ്ക്കുന്നു. അവരിൽ ചിലരെ നിങ്ങൾ കൊല്ലുകയും ക്രൂശിക്കുകയും ചെയ്യും; ചിലരെ നിങ്ങളുടെ സിനഗോഗുകളിൽ ചാട്ടവാറുകൊണ്ട് അടിക്കുകയും നഗരത്തിൽനിന്ന് നഗരത്തിലേക്ക് അവരെ പിന്തുടർന്ന് പീഡിപ്പിക്കുകയും ചെയ്യും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: അതുകൊണ്ട്
  rationale: മുൻസന്ദർഭത്തിൽനിന്നുള്ള നിഗമനബന്ധം സ്വാഭാവികമായും കൃത്യമായും അറിയിക്കുന്നു.
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്ന, മാന്യവും പരിചിതവുമായ മലയാളം.
- source_word: ἀποστέλλω
  choice: അയയ്ക്കുന്നു
  rationale: വർത്തമാനകാല രൂപവും അയച്ചുകൊടുക്കുന്ന പ്രവർത്തിയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: γραμματεῖς
  choice: ശാസ്ത്രിമാർ
  rationale: തിരുവെഴുത്തുകളിലും മതനിയമത്തിലും പ്രാവീണ്യമുള്ളവരെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതമായ ബൈബിൾ പദം.
- source_word: μαστιγώσετε
  choice: ചാട്ടവാറുകൊണ്ട് അടിക്കുകയും
  rationale: വെറും അടിയല്ല, ചാട്ടവാറടി എന്ന ശിക്ഷാരീതിയെ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: συναγωγαῖς
  choice: സിനഗോഗുകളിൽ
  rationale: ഒന്നാം നൂറ്റാണ്ടിലെ യഹൂദ സഭാസ്ഥലത്തെ മറ്റൊരു സ്ഥാപനവുമായി കലർത്താതെ സൂചിപ്പിക്കുന്നു.
- source_word: διώξετε
  choice: പീഡിപ്പിക്കുകയും
  rationale: വിരോധപൂർവം പിന്തുടർന്ന് ഉപദ്രവിക്കുന്ന അർത്ഥവ്യാപ്തി സന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: പ്രവാചകന്മാരെയും ജ്ഞാനികളെയും ശാസ്ത്രിമാരെയും അയയ്ക്കുന്ന കർത്താവ് ആരെന്ന ക്രിസ്തുശാസ്ത്രപരമായ ഊന്നൽ
  choice: “ഞാൻ ... അയയ്ക്കുന്നു” എന്ന ഒന്നാംപുരുഷ അവകാശവാദം മാറ്റമില്ലാതെ നിലനിർത്തി.
  alternative: ദൈവം അവരെ അയയ്ക്കുന്നു എന്ന വ്യാഖ്യാനാത്മക രൂപം
  rationale: മൂലപാഠത്തിൽ യേശു നേരിട്ട് ἐγὼ ἀποστέλλω എന്നു പറയുന്നു; അതിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം വിശദീകരിച്ചോ മൃദൂകരിച്ചോ കൂടാ.
- issue: കൊല്ലലും ക്രൂശിക്കലും ഏവർക്കാണ് സംഭവിക്കുന്നത് എന്ന വിതരണം
  choice: “അവരിൽ ചിലരെ നിങ്ങൾ കൊല്ലുകയും ക്രൂശിക്കുകയും ചെയ്യും”
  alternative: കൊല്ലുന്നവരും ക്രൂശിക്കുന്നവരും വേറിട്ട വിഭാഗങ്ങളാണെന്നു വ്യക്തമാക്കൽ
  rationale: ἐξ αὐτῶν എന്നത് ഒരു വിഭാഗത്തെ സൂചിപ്പിക്കുമ്പോഴും രണ്ട് ക്രിയകൾ തമ്മിലെ കൃത്യമായ വിതരണം വ്യക്തമാക്കുന്നില്ല; മലയാളത്തിലും ആ അനിശ്ചിതത്വം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ചരിത്രപരമായ കൃത്യതയ്ക്കായി “സിനഗോഗ്” എന്നും ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ സാങ്കേതിക പദങ്ങളായി “പ്രവാചകന്മാർ,” “ശാസ്ത്രിമാർ,” “ക്രൂശിക്കുക” എന്നും ഉപയോഗിച്ചു. വായനാസൗകര്യത്തിനായി ദീർഘ ഗ്രീക്ക് വാക്യം രണ്ട് മലയാള വാക്യങ്ങളാക്കി, എന്നാൽ ആശയക്രമം സംരക്ഷിച്ചു.
