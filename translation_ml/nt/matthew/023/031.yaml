id: MAT.23.31
reference: Matthew 23:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὥστε μαρτυρεῖτε ἑαυτοῖς ὅτι υἱοί ἐστε τῶν φονευσάντων τοὺς προφήτας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/031.yaml
  text: So you testify against yourselves that you are sons of those who murdered the prophets[a].
translation:
  language: ml
  text: അങ്ങനെ, പ്രവാചകന്മാരെ കൊലപ്പെടുത്തിയവരുടെ പുത്രന്മാരാണ് നിങ്ങൾ എന്ന് നിങ്ങൾതന്നെ നിങ്ങളെതിരേ സാക്ഷ്യം പറയുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങൾതന്നെ നിങ്ങൾക്കുതന്നെ സാക്ഷ്യം പറയുന്നു.’ ഗ്രീക്ക് പ്രയോഗം കൂടുതൽ പദശഃ ഇങ്ങനെ പരിഭാഷപ്പെടുത്താം; എന്നാൽ സന്ദർഭത്തിൽ അവരുടെ സാക്ഷ്യം അവരെത്തന്നെ കുറ്റപ്പെടുത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: അങ്ങനെ
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനമോ ഫലമോ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: μαρτυρεῖτε
  choice: സാക്ഷ്യം പറയുന്നു
  rationale: സാക്ഷ്യം വഹിക്കുക എന്ന നിയമപരവും ആരോപണാത്മകവുമായ ഭാവം നിലനിർത്തുന്ന സ്വാഭാവിക പ്രയോഗം.
- source_word: ἑαυτοῖς
  choice: നിങ്ങൾതന്നെ നിങ്ങൾക്കെതിരായി
  rationale: പദശഃ ‘നിങ്ങൾക്കുതന്നെ’ എന്നായിരിക്കാമെങ്കിലും, സന്ദർഭത്തിൽ അവരുടെ സാക്ഷ്യം അവരെത്തന്നെ കുറ്റപ്പെടുത്തുന്നു; മുഖ്യപാഠം ആ സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു, പദശഃ സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ὅτι
  choice: എന്നു
  rationale: സാക്ഷ്യത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന ഘടകമായി സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: υἱοί
  choice: പുത്രന്മാർ
  rationale: ഗ്രീക്കിലെ വ്യക്തമായ പുല്ലിംഗ കുടുംബരൂപകവും വംശപരവും ധാർമ്മികവുമായ ഐക്യത്തിന്റെ വാചാടോപശക്തിയും നിലനിർത്തുന്നു.
- source_word: τῶν φονευσάντων
  choice: കൊന്നവരുടെ
  rationale: φονεύω സൂചിപ്പിക്കുന്ന കുറ്റകരമായ വധം സന്ദർഭത്തിൽ വ്യക്തമാണ്; മലയാളത്തിലെ ‘കൊന്നു’ സ്വാഭാവികവും ശക്തവുമാണ്, ‘വധിച്ചു’ എന്നതിനെക്കാൾ സാധാരണ വായനക്കാർക്ക് നേരിട്ടുള്ളതുമാണ്.
- source_word: τοὺς προφήτας
  choice: പ്രവാചകന്മാരെ
  rationale: ഇസ്രായേലിന്റെ ചരിത്രത്തിലെ ദൈവദൂതന്മാരായ അംഗീകൃത വിഭാഗത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: υἱοί എന്നത് പദശഃ കുടുംബപദമായി നിലനിർത്തണമോ, ‘മക്കൾ’ അല്ലെങ്കിൽ ‘സന്തതികൾ’ എന്നു വിശാലമായി വ്യാഖ്യാനിക്കണമോ
  choice: പുത്രന്മാർ
  alternative: മക്കൾ; സന്തതികൾ
  rationale: പദം വംശബന്ധത്തോടൊപ്പം അതേ പ്രവാചകവിരുദ്ധ നിലപാടിലുള്ള ധാർമ്മിക ഐക്യവും സൂചിപ്പിക്കുന്നു. ‘പുത്രന്മാർ’ മൂലപാഠത്തിലെ പുല്ലിംഗ കുടുംബരൂപകവും യേശുവിന്റെ ആരോപണത്തിന്റെ മൂർച്ചയും സംരക്ഷിക്കുന്നു.
- issue: ἑαυτοῖς എന്ന ദത്തിവിഭക്തിയുടെ അർഥം പദശഃ നൽകണമോ, സന്ദർഭത്തിലെ സ്വയം കുറ്റപ്പെടുത്തുന്ന ഭാവം വ്യക്തമാക്കണമോ
  choice: നിങ്ങൾക്കെതിരായി
  alternative: നിങ്ങൾക്കുതന്നെ
  rationale: ഇരുവായനകളും ബന്ധമുള്ളവയാണ്. മുഖ്യപാഠത്തിൽ സന്ദർഭത്തിലെ സ്വയം കുറ്റപ്പെടുത്തുന്ന ഫലം വ്യക്തമാക്കുകയും, യഥാർത്ഥ വ്യാകരണപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പ്രവാചകന്മാർ’, ‘പുത്രന്മാർ’ എന്നീ പദങ്ങൾ ബൈബിൾസംബന്ധിയായ കുടുംബ-ചരിത്ര ഭാവം നിലനിർത്തുന്നു; വാക്യക്രമം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി ക്രമപ്പെടുത്തി.
