id: MAT.23.3
reference: Matthew 23:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πάντα οὖν ὅσα ⸀ἐὰν εἴπωσιν ὑμῖν ⸂ποιήσατε καὶ τηρεῖτε⸃, κατὰ δὲ τὰ ἔργα αὐτῶν μὴ ποιεῖτε, λέγουσιν γὰρ καὶ οὐ ποιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/003.yaml
  text: Therefore[a], do and keep everything they tell you, but do not do according to their works, for they say and do not do.
translation:
  language: ml
  text: അതുകൊണ്ട്, അവർ നിങ്ങളോടു പറയുന്നതെല്ലാം ചെയ്യുകയും പാലിക്കുകയും ചെയ്യുവിൻ; എന്നാൽ അവരുടെ പ്രവൃത്തികൾക്കനുസരിച്ച് ചെയ്യരുത്[a]. കാരണം, അവർ പറയുന്നു, പക്ഷേ ചെയ്യുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവർ ചെയ്യുന്നതുപോലെ നിങ്ങൾ ചെയ്യരുത്.’
    reason: κατὰ τὰ ἔργα αὐτῶν എന്നതിന്റെ കൂടുതൽ സ്വാഭാവികമായ അർഥവിവർത്തനം.
lexical_decisions:
- source_word: πάντα οὖν ὅσα ἐὰν
  choice: അതുകൊണ്ട്, ... എല്ലാം
  rationale: οὖν എന്നതിന്റെ നിഗമനസ്വഭാവം ‘അതുകൊണ്ട്’ എന്നു നിലനിർത്തുന്നു; πάντα ... ὅσα ἐὰν എന്ന സമഗ്രപ്രയോഗത്തിന്റെ വ്യാപ്തി ‘പറയുന്നതെല്ലാം’ വ്യക്തമാക്കുന്നു.
- source_word: εἴπωσιν ὑμῖν
  choice: അവർ നിങ്ങളോടു പറയുന്നത്
  rationale: λέγωയുടെ സാധാരണ അർഥമായ ‘പറയുക’ നിലനിർത്തുന്നു; ‘പഠിപ്പിക്കുക’ എന്നു വിപുലീകരിച്ച് വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: ποιήσατε καὶ τηρεῖτε
  choice: ചെയ്യുകയും പാലിക്കുകയും ചെയ്യുവിൻ
  rationale: ποιέωയും τηρέωയും തമ്മിലുള്ള വ്യത്യാസം യഥാക്രമം ‘ചെയ്യുക’, ‘പാലിക്കുക’ എന്നു സൂക്ഷിക്കുന്നു. ബഹുവചന കല്പനയുടെ ഗൗരവമുള്ള രൂപമായി ‘ചെയ്യുവിൻ’ ഉപയോഗിക്കുന്നു.
- source_word: κατὰ δὲ τὰ ἔργα αὐτῶν
  choice: എന്നാൽ അവരുടെ പ്രവൃത്തികൾക്കനുസരിച്ച്
  rationale: κατάയുടെ മാനദണ്ഡ/അനുരൂപതാബോധം ‘അനുസരിച്ച്’ എന്നും ἔργαയുടെ പ്രവർത്തനബോധം ‘പ്രവൃത്തികൾ’ എന്നും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: μὴ ποιεῖτε
  choice: ചെയ്യരുത്
  rationale: ποιέωയുടെ ആവർത്തനം കഴിയുന്നത്ര നിലനിർത്തി, പതിവായ പ്രവർത്തനത്തെ വിലക്കുന്ന സ്വാഭാവിക മലയാളരൂപം നൽകുന്നു.
- source_word: λέγουσιν γὰρ καὶ οὐ ποιοῦσιν
  choice: കാരണം, അവർ പറയുന്നു, പക്ഷേ ചെയ്യുന്നില്ല
  rationale: ഗ്രീക്കിലെ ഹ്രസ്വമായ പറയുക–ചെയ്യുക വൈരുധ്യം സംരക്ഷിക്കുന്നു; മൂലത്തിൽ വ്യക്തമാക്കാത്ത കർമം ചേർക്കുന്നില്ല. മലയാളത്തിൽ യഥാർത്ഥ വിരോധം സ്വാഭാവികമാക്കാൻ καί സാഹചര്യാനുസൃതമായി ‘പക്ഷേ’ എന്നു നൽകുന്നു.
theological_decisions:
- issue: മുൻവാക്യത്തിലെ ശാസ്ത്രിമാരുടെയും പരീശന്മാരുടെയും ഉപദേശാധികാരം ഈ വാക്യത്തിൽ തുറന്നുപറയണമോ
  choice: ഈ വാക്യത്തിലെ ‘അവർ’ എന്ന പരാമർശം അതേപടി നിലനിർത്തി, ‘പഠിപ്പിക്കുന്നതെല്ലാം’ എന്ന വിശദീകരണം ചേർക്കുന്നില്ല.
  alternative: ‘അവർ നിങ്ങളെ പഠിപ്പിക്കുന്നതെല്ലാം’ അല്ലെങ്കിൽ ‘മോശെയുടെ പീഠത്തിൽനിന്ന് അവർ പറയുന്നതെല്ലാം’ എന്നു വികസിപ്പിക്കുക.
  rationale: പരാമർശിതരെ സമീപസന്ദർഭം തിരിച്ചറിയിക്കുന്നു; എന്നാൽ ഈ വാക്യം ആ വിശദാംശങ്ങൾ ആവർത്തിക്കുന്നില്ല. അതിനാൽ പരിഭാഷയിൽ വ്യാഖ്യാനപരമായ വിപുലീകരണം ഒഴിവാക്കുന്നു.
- issue: ποιέωയുടെ ആവർത്തനം ശൈലിക്കായി വ്യത്യസ്ത ക്രിയകളാക്കി മിനുക്കണമോ
  choice: ‘ചെയ്യുക ... ചെയ്യരുത് ... ചെയ്യുന്നില്ല’ എന്ന ആവർത്തനം നിലനിർത്തുന്നു.
  alternative: ‘ആചരിക്കുക ... അനുകരിക്കരുത് ... പ്രവർത്തിക്കുന്നില്ല’ എന്നിങ്ങനെ വ്യത്യസ്ത ക്രിയകൾ ഉപയോഗിക്കുക.
  rationale: പറയുന്നതും ചെയ്യുന്നതും തമ്മിലുള്ള കപടമായ വിടവ് ποιέωയുടെ ആവർത്തനം ശക്തമായി വെളിപ്പെടുത്തുന്നു; അതിനെ ശൈലിപരമായി മായ്ക്കാതിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ചെയ്യുവിൻ’ ബഹുവചന കല്പനയുടെ തിരുവെഴുത്തുസന്ദർഭത്തിന് യോജിച്ച മാന്യരൂപമാണ്; ശേഷിക്കുന്ന വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി സൂക്ഷിച്ചിരിക്കുന്നു.
