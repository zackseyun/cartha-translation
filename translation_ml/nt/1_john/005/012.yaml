id: 1JN.5.12
reference: 1 John 5:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ ἔχων τὸν υἱὸν ἔχει τὴν ζωήν· ὁ μὴ ἔχων τὸν υἱὸν τοῦ θεοῦ τὴν ζωὴν οὐκ ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/012.yaml
  text: The one who has the Son has life[a]; the one who does not have the Son of God does not have life.
translation:
  language: ml
  text: പുത്രനുള്ളയാൾക്ക് ജീവനുണ്ട്[a]; ദൈവപുത്രനില്ലാത്തയാൾക്ക് ജീവനില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിത്യജീവൻ’; യോഹന്നാന്റെ രചനകളിലെ പ്രയോഗത്തിൽ ഇവിടെ ‘ജീവൻ’ എന്നത് പുത്രനിൽ ലഭിക്കുന്ന ജീവനെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων
  choice: ഉള്ളയാൾക്ക്
  rationale: നിശ്ചയാർഥക ഉപപദത്തോടുകൂടിയ വർത്തമാനകാല കൃദന്തം ഒരു വ്യക്തിയെ പൊതുവായി സൂചിപ്പിക്കുന്നു. ‘ഉള്ളയാൾ’ എന്നത് ലിംഗഭേദം ആരോപിക്കാതെ ഈ പൊതുവായ ഏകവചനാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὸν υἱόν
  choice: പുത്രൻ
  rationale: ആദ്യ ഉപവാക്യത്തിൽ ഗ്രീക്കിൽ ‘പുത്രൻ’ എന്നു മാത്രമാണുള്ളത്; അതിനാൽ അവിടത്തെ ചുരുക്കരൂപവും രണ്ടാമത്തെ ഉപവാക്യത്തിലെ പൂർണനാമവുമായുള്ള വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: ἔχει
  choice: ഉണ്ട്
  rationale: ἔχω എന്നതിന്റെ നേരിട്ടുള്ള അർഥം നൽകുന്നു. മലയാളത്തിൽ ‘പുത്രനുള്ളയാൾക്ക് ജീവനുണ്ട്’ എന്ന ഘടനയാണ് സ്വാഭാവികം; ബന്ധപരമായ അർഥം അധികമായി വ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്നു.
- source_word: τὴν ζωήν
  choice: ജീവൻ
  rationale: വാക്യത്തിൽ ‘നിത്യ’ എന്ന വിശേഷണം ഇല്ലാത്തതിനാൽ ‘ജീവൻ’ എന്നു തന്നെ പരിഭാഷപ്പെടുത്തി. യോഹന്നാന്റെ രചനകളിലെ സമ്പുഷ്ടമായ ദൈവശാസ്ത്രാർഥം സന്ദർഭത്തിനു വിട്ടുകൊടുക്കുന്നു.
- source_word: ὁ μὴ ἔχων
  choice: ഇല്ലാത്തയാൾക്ക്
  rationale: μή കൃദന്തരൂപത്തെ നിഷേധിക്കുന്നു. ആദ്യ ഉപവാക്യത്തോടുള്ള സമാന്തരതയും വിരുദ്ധതയും ചുരുക്കവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: τὸν υἱὸν τοῦ θεοῦ
  choice: ദൈവപുത്രൻ
  rationale: ‘ദൈവത്തിന്റെ പുത്രൻ’ എന്ന പൂർണ ക്രിസ്തുശാസ്ത്രപരമായ വിശേഷണം മലയാളത്തിലെ പതിവും വ്യക്തവുമായ സംയുക്തരൂപത്തിൽ നൽകുന്നു.
- source_word: οὐκ ἔχει
  choice: ഇല്ല
  rationale: പരിമിത ക്രിയയെ οὐκ നിഷേധിക്കുന്നു. ‘ജീവനില്ല’ എന്നത് ആദ്യ ഉപവാക്യത്തിലെ ‘ജീവനുണ്ട്’ എന്നതിനോടുള്ള കൃത്യവും സ്വാഭാവികവുമായ സമാന്തരപ്രയോഗമാണ്.
theological_decisions:
- issue: യോഹന്നാന്റെ സന്ദർഭത്തിൽ ‘ജീവൻ’ എന്നതിന്റെ അർഥം
  choice: പ്രധാന പാഠത്തിൽ ζωή എന്നത് ‘ജീവൻ’ എന്നു പരിഭാഷപ്പെടുത്തുക.
  alternative: നിത്യജീവൻ
  rationale: 1 യോഹന്നാനിൽ ζωή പലപ്പോഴും പുത്രനിലുള്ള നിത്യജീവനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും ഈ വാക്യത്തിൽ ‘നിത്യ’ എന്ന പദമില്ല. അതിനാൽ മൂലപാഠത്തിന്റെ സംക്ഷിപ്തത നിലനിർത്തി, വിശാലമായ അർഥം സന്ദർഭവും അടിക്കുറിപ്പും വ്യക്തമാക്കുന്നു.
- issue: പൊതുവായ അർഥമുള്ള പുല്ലിംഗ ഏകവചന കൃദന്തങ്ങൾ
  choice: ‘ഉള്ളയാൾ/ഇല്ലാത്തയാൾ’ എന്ന ലിംഗനിരപേക്ഷ പൊതുവായ ഏകവചനരൂപം ഉപയോഗിക്കുക.
  alternative: ‘ഉള്ളവൻ/ഇല്ലാത്തവൻ’ അല്ലെങ്കിൽ ബഹുവചനരൂപം
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ഏകവചനം ഇവിടെ പുരുഷന്മാരെ മാത്രം ഉദ്ദേശിക്കുന്നതല്ല; പൊതുവായി ഏതൊരു വ്യക്തിയെയും സൂചിപ്പിക്കുന്നു. ‘യാൾ’ ആ ഉദ്ദേശ്യം ഏകവചനത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന, സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ സമാന്തരവിരുദ്ധ ഘടന ‘ജീവനുണ്ട്/ജീവനില്ല’ എന്ന രൂപത്തിൽ നിലനിർത്തിയിരിക്കുന്നു.
