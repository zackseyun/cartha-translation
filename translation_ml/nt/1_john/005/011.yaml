id: 1JN.5.11
reference: 1 John 5:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ μαρτυρία, ὅτι ζωὴν αἰώνιον ἔδωκεν ⸂ὁ θεὸς ἡμῖν⸃, καὶ αὕτη ἡ ζωὴ ἐν τῷ υἱῷ αὐτοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/011.yaml
  text: 'And this is the testimony: that God has given us eternal life[c][b][a], and this life is in his Son.'
translation:
  language: ml
  text: 'ഇതാണ് സാക്ഷ്യം: ദൈവം നമുക്കു നിത്യജീവൻ നൽകിയിരിക്കുന്നു; ഈ ജീവൻ അവന്റെ പുത്രനിലാണ്.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μαρτυρία
  choice: സാക്ഷ്യം
  rationale: യോഹന്നാന്റെ സന്ദർഭത്തിലെ തെളിവുനൽകുന്ന പ്രസ്താവനയെയും അതിന്റെ ഉള്ളടക്കത്തെയും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ὅτι
  choice: 'ഇതാണ്:'
  rationale: സാക്ഷ്യത്തിന്റെ ഉള്ളടക്കം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കാൻ കോളനോടുകൂടിയ ഈ ഘടന ഉപയോഗിച്ചു.
- source_word: ζωὴν αἰώνιον
  choice: നിത്യജീവൻ
  rationale: കാലാതീതമായ ദൈർഘ്യവും ദൈവത്തിൽനിന്നുള്ള ജീവന്റെ സവിശേഷതയും നിലനിർത്തുന്ന പതിവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: ἔδωκεν
  choice: നൽകിയിരിക്കുന്നു
  rationale: പൂർത്തിയായ ദൈവിക പ്രവൃത്തിയും അതിന്റെ ഇപ്പോഴുള്ള ഫലവും മലയാളത്തിൽ ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: ὁ θεὸς ἡμῖν
  choice: ദൈവം നമുക്ക്
  rationale: കർത്താവിനെയും പരോക്ഷകർമ്മത്തെയും നേരിട്ട്, അധിക വ്യാഖ്യാനമില്ലാതെ പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: ἐν τῷ υἱῷ αὐτοῦ
  choice: അവന്റെ പുത്രനിലാണ്
  rationale: ἐν എന്നതിന്റെ സ്ഥലബന്ധപരവും യോഹന്നാനീയവുമായ സാന്ദ്രത സംരക്ഷിക്കുന്നു; ‘മുഖാന്തരം’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: αὕτη ... αὕτη ἡ ζωή
  choice: ആ സാക്ഷ്യം ... ഈ ജീവൻ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ സാക്ഷ്യത്തെ ‘ആ’ എന്നു തിരിച്ചുചൂണ്ടുകയും ഇപ്പോൾ പരാമർശിച്ച ജീവനെ ‘ഈ’ എന്നു ബന്ധിപ്പിക്കുകയും ചെയ്ത് ഗ്രീക്കിലെ ആവർത്തനവും വാക്യബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἔδωκεν എന്ന ഔറിസ്റ്റിന്റെ ശക്തിയും ജീവന്റെ ഇപ്പോഴുള്ള കൈവശവും
  choice: നൽകിയിരിക്കുന്നു
  alternative: നൽകി
  rationale: പൂർത്തിയായ നൽകലിനെയും അതിന്റെ നിലനിൽക്കുന്ന ഇപ്പോഴത്തെ ഫലത്തെയും അറിയിക്കുന്നു; വാക്യം പറയുന്നതിലധികം ഒരു സിദ്ധാന്തസംവിധാനം ചേർക്കുന്നില്ല.
- issue: ജീവൻ ‘അവന്റെ പുത്രനിൽ’ ആയിരിക്കുന്നതിന്റെ അർഥം
  choice: അവന്റെ പുത്രനിലാണ്
  alternative: അവന്റെ പുത്രൻ മുഖാന്തരമാണ് / അവന്റെ പുത്രനോടൊപ്പമാണ്
  rationale: ജീവനും പുത്രനും തമ്മിലുള്ള ബന്ധം ഗ്രീക്ക് സാന്ദ്രമായി വിടുന്നതുപോലെ തന്നെ നിലനിർത്തുന്നു; ഉപാധി മാത്രമായോ കൂടെയുണ്ടായിരിക്കലായോ അർഥം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. വാക്യത്തിന്റെ തെളിവുസ്വഭാവവും യോഹന്നാനീയമായ ‘പുത്രനിൽ’ എന്ന പ്രയോഗവും സംരക്ഷിച്ചിട്ടുണ്ട്.
