  terminology: ‘സാക്ഷ്യം,’ ‘നിത്യജീവൻ,’ and ‘അവന്റെ പുത്രനിൽ’ are accurate and established terminology. ‘പുത്രനിൽ’ properly preserves ἐν without reducing it to ‘through’ or ‘with.’
