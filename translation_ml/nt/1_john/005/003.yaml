id: 1JN.5.3
reference: 1 John 5:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: αὕτη γάρ ἐστιν ἡ ἀγάπη τοῦ θεοῦ ἵνα τὰς ἐντολὰς αὐτοῦ τηρῶμεν, καὶ αἱ ἐντολαὶ αὐτοῦ βαρεῖαι οὐκ εἰσίν,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/003.yaml
  text: 'For this is the love of God: that we keep his commandments[a], and his commandments are not burdensome.'
translation:
  language: ml
  text: 'എന്തെന്നാൽ, ദൈവത്തോടുള്ള സ്നേഹം[a] ഇതാണ്: നാം അവന്റെ കല്പനകൾ പാലിക്കുന്നതാണ്; കൂടാതെ, അവന്റെ കല്പനകൾ ഭാരമായവയല്ല.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദൈവത്തിന്റെ സ്നേഹം.” ഗ്രീക്ക് പ്രയോഗം ദൈവത്തോടുള്ള സ്നേഹമെന്നോ ദൈവം നൽകുന്നതോ കാണിക്കുന്നതോ ആയ സ്നേഹമെന്നോ മനസ്സിലാക്കാം; എന്നാൽ സമീപസന്ദർഭം “ദൈവത്തോടുള്ള സ്നേഹം” എന്ന വായനയ്ക്കാണ് കൂടുതൽ പിന്തുണ നൽകുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: αὕτη
  choice: ഇതാണ്
  rationale: തുടർന്ന് വരുന്ന വിശദീകരണവാക്യത്തിലേക്ക് വിരൽചൂണ്ടുന്ന സർവനാമത്തിന്റെ ബലം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: γάρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ ആശയത്തിന് വിശദീകരണമോ അടിസ്ഥാനമോ നൽകുന്ന ബന്ധകബലം വ്യക്തമാക്കുന്നു.
- source_word: ἀγάπη τοῦ θεοῦ
  choice: ദൈവത്തോടുള്ള സ്നേഹം
  rationale: സമീപസന്ദർഭം ദൈവത്തെ സ്നേഹിക്കുന്നതും അവന്റെ കല്പനകൾ പാലിക്കുന്നതും തമ്മിൽ ബന്ധിപ്പിക്കുന്നതിനാൽ, ദൈവത്തിലേക്കു നയിക്കപ്പെടുന്ന സ്നേഹമാണ് പ്രധാന വായന. ഗ്രീക്കിലെ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
- source_word: ἵνα
  choice: നാം … പാലിക്കുക
  rationale: ഇവിടെ ഉദ്ദേശ്യം മാത്രമല്ല, ദൈവത്തോടുള്ള സ്നേഹം എന്തിൽ അടങ്ങിയിരിക്കുന്നുവെന്ന ഉള്ളടക്കവിശദീകരണമാണ് നൽകുന്നത്; മലയാളത്തിലെ ക്രിയാനാമസദൃശമായ ഈ ഘടന അത് സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἐντολάς
  choice: കല്പനകൾ
  rationale: യോഹന്നാന്റെ രചനകളിലെ പദത്തിന്റെ ഗൗരവവും പരിചിതമായ ബൈബിൾപ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: τηρῶμεν
  choice: നാം … പാലിക്കുക
  rationale: കല്പനകൾ കാത്തുസൂക്ഷിച്ച് അനുസരിക്കുക എന്ന യോഹന്നാനീയ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: βαρεῖαι
  choice: ഭാരമുള്ളവയല്ല
  rationale: ചുമക്കാൻ പ്രയാസമുള്ളതോ അമർത്തുന്നതോ എന്ന രൂപകാർഥം അനാവശ്യമായി വിശദീകരിക്കാതെ ഗ്രീക്കിലെ ‘ഭാരം’ എന്ന ദൃശ്യബിംബം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἡ ἀγάπη τοῦ θεοῦ എന്നതിലെ ജനിറ്റീവ് ബന്ധം
  choice: ദൈവത്തോടുള്ള സ്നേഹം—വിശ്വാസികൾ ദൈവത്തെ സ്നേഹിക്കുന്നത്
  alternative: ദൈവത്തിന്റെ സ്നേഹം—ദൈവത്തിൽനിന്നു വരുന്ന അഥവാ ദൈവം മനുഷ്യരോടു കാണിക്കുന്ന സ്നേഹം
  rationale: മുൻവാക്യം ദൈവത്തെ സ്നേഹിക്കുന്നതിനെ അവന്റെ കല്പനകൾ ചെയ്യുന്നതുമായി ബന്ധിപ്പിക്കുകയും ഈ വാക്യം ആ സ്നേഹത്തെ കല്പനകൾ പാലിക്കുന്നതായി നിർവചിക്കുകയും ചെയ്യുന്നതിനാൽ, സന്ദർഭം ദൈവത്തോടുള്ള സ്നേഹത്തെ ശക്തമായി പിന്തുണയ്ക്കുന്നു. എങ്കിലും ഗ്രീക്ക് വ്യാകരണം അനുവദിക്കുന്ന മറ്റൊരു വായന അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘കല്പനകൾ,’ ‘പാലിക്കുക’ എന്നീ പരിചിത പദങ്ങൾ നിലനിർത്തിയപ്പോൾ, വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി രൂപപ്പെടുത്തി.
