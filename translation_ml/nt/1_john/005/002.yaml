  yaml_path: translation/nt/1_john/005/002.yaml
  text: 'By this we know that we love the children of God: when we love God and keep his commandments[a].'
translation:
  language: ml
  text: 'ദൈവത്തിന്റെ മക്കളെ നാം സ്നേഹിക്കുന്നു എന്ന് നാം അറിയുന്നത് ഇതിലൂടെയാണ്: നാം ദൈവത്തെ സ്നേഹിക്കുകയും അവന്റെ കല്പനകൾ പാലിക്കുകയും ചെയ്യുമ്പോൾ[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവന്റെ കല്പനകൾ അനുഷ്ഠിക്കുക” അല്ലെങ്കിൽ “അവന്റെ കല്പനകൾ അനുസരിക്കുക.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് ക്രിയയുടെ അക്ഷരാർഥം “ചെയ്യുക” (ποιῶμεν) എന്നാണ്; സാധാരണയായി “പാലിക്കുക” എന്നു പരിഭാഷപ്പെടുത്തുന്ന τηρέω എന്ന ക്രിയയല്ല ഇത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: ഇതിലൂടെയാണ്
  rationale: അറിയുന്നതിനുള്ള അടിസ്ഥാനമോ സൂചനയോ അവതരിപ്പിക്കുന്ന യോഹന്നാന്റെ പ്രയോഗം. മലയാളത്തിൽ സ്വാഭാവികമായി സൂചനാത്മക ശക്തി നിലനിർത്തുന്നു.
- source_word: γινώσκομεν
  choice: നാം അറിയുന്നത്
  rationale: വർത്തമാനകാലത്തിലെ തുടർച്ചയായ അറിവിനെയോ തിരിച്ചറിവിനെയോ ലളിതവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀγαπῶμεν
  choice: നാം സ്നേഹിക്കുന്നു / സ്നേഹിക്കുകയും
  rationale: ἀγαπάω എന്ന ക്രിയയുടെ നേരിട്ടുള്ളതും സ്ഥിരതയുള്ളതുമായ പരിഭാഷ; ഗ്രീക്ക് വർത്തമാനകാലത്തിന്റെ ആശയം നിലനിർത്തുന്നു.
- source_word: τὰ τέκνα τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ മക്കളെ
  rationale: τέκνα എന്ന നപുംസകലിംഗ ബഹുവചനത്തിന്റെ എല്ലാവരെയും ഉൾക്കൊള്ളുന്ന മക്കൾ എന്ന അർഥം സംരക്ഷിക്കുന്നു.
- source_word: ὅταν
  choice: ചെയ്യുമ്പോൾ
  rationale: വർത്തമാനകാല സബ്ജങ്ക്റ്റീവിനോടൊപ്പമുള്ള കാലികവും നിബന്ധനാത്മകവുമായ സ്വരം അനാവശ്യമായി ഒന്നിലേക്ക് ചുരുക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: τὰς ἐντολὰς αὐτοῦ ποιῶμεν
  choice: അവന്റെ കല്പനകൾ പാലിക്കുകയും ചെയ്യുമ്പോൾ
  rationale: മലയാളത്തിൽ കല്പനകളോടൊപ്പം സ്വാഭാവികമായി ഉപയോഗിക്കുന്ന ‘പാലിക്കുക’ സ്വീകരിച്ചു; എന്നാൽ ποιέω എന്ന ക്രിയയുടെ അക്ഷരാർഥം ‘ചെയ്യുക’ ആണെന്ന സ്രോതസ്സിലെ പ്രത്യേകത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ദൈവത്തിന്റെ മക്കളോടുള്ള സ്നേഹവും ദൈവത്തോടുള്ള സ്നേഹവും തമ്മിലുള്ള ബന്ധം
  choice: ദൈവത്തിന്റെ മക്കളോടുള്ള സ്നേഹം, ദൈവത്തെ സ്നേഹിക്കുകയും അവന്റെ കല്പനകൾ പാലിക്കുകയും ചെയ്യുമ്പോൾ അറിയപ്പെടുന്നു എന്ന സംക്ഷിപ്ത ബന്ധം അതേപടി നിലനിർത്തി.
  alternative: ഇത് കർശനമായി തെളിവ്, കാരണം, അല്ലെങ്കിൽ നിർവചനം എന്നിങ്ങനെ ഏതെങ്കിലും ഒറ്റ വ്യാഖ്യാനമായി വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്ക് വാക്യം ബന്ധം പ്രസ്താവിക്കുന്നുവെങ്കിലും അതിന്റെ താർക്കിക സ്വഭാവം വിശദീകരിക്കുന്നില്ല; അതിനാൽ ദൈവശാസ്ത്രപരമായ സംഘർഷവും അവ്യക്തതയും പരിഭാഷയിൽ പരിഹരിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായതും മാന്യവുമായ ശൈലി. ‘കല്പനകൾ പാലിക്കുക’ സ്വാഭാവിക പ്രയോഗമായി സ്വീകരിച്ചു; സ്രോതസ്സിലെ ποιέω/τηρέω വ്യത്യാസം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
