id: 1JN.5.14
reference: 1 John 5:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ παρρησία ἣν ἔχομεν πρὸς αὐτόν, ὅτι ἐάν τι αἰτώμεθα κατὰ τὸ θέλημα αὐτοῦ ἀκούει ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/014.yaml
  text: 'And this is the confidence that we have before him: that if we ask anything according to his will[a], he hears us.'
translation:
  language: ml
  text: 'അവന്റെ സന്നിധിയിൽ നമുക്കുള്ള ആത്മവിശ്വാസം[a] ഇതാണ്: അവന്റെ ഹിതപ്രകാരം നാം എന്തെങ്കിലും ചോദിച്ചാൽ, അവൻ നമ്മെ കേൾക്കുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആത്മവിശ്വാസം’ എന്നതിന് ‘ധൈര്യം’ അല്ലെങ്കിൽ ‘ഉറച്ച ബോധ്യം’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησία
  choice: ഉറപ്പ്
  rationale: ദൈവസന്നിധിയിൽ പ്രാർഥിക്കുന്ന സന്ദർഭത്തിൽ, തുറന്ന സമീപനത്തോടുകൂടിയ ആത്മവിശ്വാസത്തെയും ധൈര്യത്തെയും സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ ‘ഉറപ്പ്’ സ്വാഭാവികമാണ്; പദത്തിന്റെ ‘ധൈര്യം’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: πρὸς αὐτόν
  choice: അവന്റെ സന്നിധിയിൽ
  rationale: വ്യക്തിയോടുള്ള ബന്ധപരമായ അഭിമുഖീകരണവും സാന്നിധ്യവും ഇവിടെ സൂചിപ്പിക്കുന്നു. പ്രാർഥനയുടെ പശ്ചാത്തലത്തിൽ ‘അവന്റെ സന്നിധിയിൽ’ എന്നത് സ്വാഭാവികവും അർഥസൂക്ഷ്മത നിലനിർത്തുന്നതുമാണ്.
- source_word: ὅτι
  choice: 'ഇതാണ്:'
  rationale: ὅτι ഇവിടെ കാരണമല്ല, നമുക്കുള്ള ഉറപ്പിന്റെ ഉള്ളടക്കമാണ് അവതരിപ്പിക്കുന്നത്. മലയാളത്തിൽ ‘ഇതാണ്:’ എന്ന ഘടന അത് വ്യക്തമായി നൽകുന്നു.
- source_word: ἐάν τι αἰτώμεθα
  choice: നാം എന്തെങ്കിലും ചോദിച്ചാൽ
  rationale: തുറന്ന പരിധിയുള്ള പൊതുവായ നിബന്ധനയെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: κατὰ τὸ θέλημα αὐτοῦ
  choice: അവന്റെ ഇഷ്ടപ്രകാരം
  rationale: κατά സൂചിപ്പിക്കുന്ന അനുരൂപതയും θέλημα എന്ന പദത്തിന്റെ ദൈവശാസ്ത്രപരമായ ഭാരവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἀκούει ἡμῶν
  choice: അവൻ നമ്മെ കേൾക്കുന്നു
  rationale: മൂലപാഠത്തിലെ ‘കേൾക്കുന്നു’ എന്ന ആശയം നേരിട്ട് നിലനിർത്തുന്നു; പ്രാർഥനയ്ക്ക് ശ്രദ്ധ നൽകുന്നു എന്ന അർഥമുണ്ടെങ്കിലും, ചോദിച്ചതെല്ലാം നൽകുന്നു എന്ന് അധികമായി വ്യാഖ്യാനിക്കുന്നില്ല.
theological_decisions:
- issue: പ്രാർഥന ദൈവം ‘കേൾക്കുന്നു’ എന്നതിന്റെ അർഥം
  choice: ‘അവൻ നമ്മെ കേൾക്കുന്നു’ എന്ന് വിവർത്തനം ചെയ്തു; ദൈവം പ്രാർഥന ശ്രദ്ധിക്കുന്നു എന്ന ആശയം നിലനിർത്തി.
  alternative: ‘അവൻ നമുക്ക് ഉത്തരം നൽകുന്നു’ അല്ലെങ്കിൽ ‘നമ്മുടെ അപേക്ഷകൾ അനുവദിക്കുന്നു.’
  rationale: വാക്യം ദൈവഹിതപ്രകാരമുള്ള അപേക്ഷകൾ അവൻ കേൾക്കുന്നു എന്നാണ് പറയുന്നത്. അവൻ എല്ലാ അപേക്ഷയും ഉടൻ അനുവദിക്കുന്നു എന്ന ശക്തമായ ആശയം വിവർത്തനത്തിൽ ചേർക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി. പ്രാർഥനാസന്ദർഭത്തിന്റെ മാന്യതയ്ക്കായി ‘സന്നിധിയിൽ’ ഉപയോഗിച്ചു; പദാനുപദമായ കൃത്രിമത ഒഴിവാക്കി.
