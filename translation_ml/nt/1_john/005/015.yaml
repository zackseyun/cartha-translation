id: 1JN.5.15
reference: 1 John 5:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐὰν οἴδαμεν ὅτι ἀκούει ἡμῶν ὃ ⸀ἐὰν αἰτώμεθα, οἴδαμεν ὅτι ἔχομεν τὰ αἰτήματα ἃ ᾐτήκαμεν ⸀ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/015.yaml
  text: And if we know that he hears us in whatever we ask, we know that we have the requests that we have asked from him.
translation:
  language: ml
  text: നാം എന്തു ചോദിച്ചാലും അവൻ നമ്മുടെ അപേക്ഷ കേൾക്കുന്നു എന്നു നമുക്ക് അറിയാമെങ്കിൽ, നാം അവനോട് ചോദിച്ച അപേക്ഷകൾ നമുക്കുണ്ടെന്നും നമുക്ക് അറിയാം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούει ἡμῶν
  choice: അവൻ നമ്മുടെ അപേക്ഷ കേൾക്കുന്നു
  rationale: ജനിറ്റീവോടുകൂടിയ ἀκούω ഇവിടെ പ്രാർഥനയോ അപേക്ഷയോ കേൾക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. വെറും ശബ്ദഗ്രഹണം എന്ന ധാരണ ഒഴിവാക്കാൻ ‘അപേക്ഷ’ സന്ദർഭത്തിൽ വ്യക്തമാക്കിയെങ്കിലും, ‘ഉത്തരം നൽകുന്നു’ എന്നു വ്യാഖ്യാനം ശക്തമാക്കിയിട്ടില്ല.
- source_word: ὃ ἐὰν αἰτώμεθα
  choice: നാം എന്തു ചോദിച്ചാലും
  rationale: ബന്ധസർവനാമവും ἐάν-ഉം ചേർന്ന ഘടന തുറന്ന ‘എന്തുതന്നെ/എന്തു ... ആയാലും’ എന്ന അർഥം നൽകുന്നു. മലയാളത്തിൽ ‘എന്തു ചോദിച്ചാലും’ സ്വാഭാവികവും അർഥസൂക്ഷ്മതയുള്ളതുമാണ്.
- source_word: αἰτώμεθα
  choice: ചോദിച്ചാലും
  rationale: പ്രാർഥനാസന്ദർഭത്തിലെ αἰτέω-യുടെ നേരിട്ടും സാധാരണവുമായ മലയാളരൂപം ‘ചോദിക്കുക’ ആണ്.
- source_word: ἔχομεν
  choice: നമുക്കു ലഭിച്ചിരിക്കുന്നു
  rationale: ἔχομεν അക്ഷരാർഥത്തിൽ ‘നമുക്കുണ്ട്’ എന്നാണ്. എന്നാൽ അപേക്ഷകളെ ‘ഉണ്ടായിരിക്കുക’ എന്നു പറയുന്നത് മലയാളത്തിൽ അസ്വാഭാവികമായതിനാൽ, അവ നമുക്കു സ്വന്തമായിക്കഴിഞ്ഞുവെന്ന വർത്തമാന ഫലാവസ്ഥ ‘ലഭിച്ചിരിക്കുന്നു’ എന്നു സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ഇത് ലളിതഭാവിയിലെ ‘ലഭിക്കും’ എന്നാക്കി മാറ്റുന്നില്ല.
- source_word: τὰ αἰτήματα
  choice: അപേക്ഷകൾ
  rationale: αἴτημα ചോദിച്ച കാര്യമോ അഭ്യർഥനയോ സൂചിപ്പിക്കുന്നു. ‘അപേക്ഷകൾ’ പ്രാർഥനാസന്ദർഭത്തിന് യോജിക്കുകയും αἰτέω-യുമായുള്ള പദബന്ധം ഭാഗികമായി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἃ ᾐτήκαμεν
  choice: ചോദിച്ച അപേക്ഷകൾ
  rationale: പൂർണകാലരൂപം മുൻപ് നടത്തിയ ചോദിക്കലിന്റെ ഇപ്പോഴത്തെ പ്രസക്തി വഹിക്കുന്നു. ‘ചോദിച്ച’ എന്ന മലയാള ഭൂതകാലവിശേഷണം സന്ദർഭത്തിൽ അത് സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἀπ’ αὐτοῦ
  choice: അവനോടു
  rationale: ἀπό ഉറവിടത്തെ സൂചിപ്പിച്ചാലും, മലയാളത്തിൽ ഒരാളിൽനിന്ന് അപേക്ഷ ചോദിക്കുന്നതിന്റെ സ്വാഭാവിക പ്രയോഗം ‘അവനോടു ചോദിക്കുക’ എന്നാണ്. അപേക്ഷ ദൈവത്തോടാണ് അഭിമുഖീകരിച്ചിരിക്കുന്നത് എന്ന ദിശ ഇതിലൂടെ നിലനിൽക്കുന്നു.
- source_word: οἴδαμεν
  choice: നമുക്ക് അറിയാം
  rationale: യോഹന്നാന്റെ ആവർത്തിതമായ അറിവിന്റെയും ഉറപ്പിന്റെയും ഭാഷ നിലനിർത്താൻ οἶδα നേരിട്ട് ‘അറിയുക’ എന്നു പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: ἀκούει എന്നത് ‘കേൾക്കുന്നു’ എന്നോ ‘ഉത്തരം നൽകുന്നു’ എന്നോ പരിഭാഷപ്പെടുത്തണോ
  choice: അവൻ നമ്മുടെ അപേക്ഷ കേൾക്കുന്നു
  alternative: അവൻ നമുക്ക് ഉത്തരം നൽകുന്നു
  rationale: ഗ്രീക്ക് പാഠം ദൈവം കേൾക്കുന്നു എന്നതിൽനിന്ന് അപേക്ഷകൾ നമുക്കുണ്ട് എന്ന നിഗമനത്തിലേക്കാണ് നീങ്ങുന്നത്. ‘ഉത്തരം നൽകുന്നു’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് ഈ രണ്ടുഘട്ട ചിന്തയെ ഒന്നാക്കി, മൂലപാഠത്തേക്കാൾ ശക്തമായ വ്യാഖ്യാനം ചേർക്കും.
- issue: ἔχομεν-ന്റെ വർത്തമാനകാല അവകാശവാദം എങ്ങനെ നിലനിർത്തണം
  choice: നമുക്കു ലഭിച്ചിരിക്കുന്നു
  alternative: നമുക്കു ലഭിക്കും
  rationale: ഭാവികാലമാക്കാതെ, അപേക്ഷകളുടെ ഫലം ഇപ്പോൾ തന്നെ കൈവശമുള്ളതുപോലെ പറയുന്ന പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും ഉറപ്പും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ വ്യവസ്ഥാപക ഘടനയും രണ്ടുതവണ വരുന്ന ‘നമുക്ക് അറിയാം’ എന്ന ഊന്നലും നിലനിർത്തി. പ്രസിദ്ധീകരണപാഠത്തിൽ അടിക്കുറിപ്പുകളില്ല; അതിനാൽ അടിക്കുറിപ്പ് ചിഹ്നവും ആവശ്യമില്ല.
