  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'പിന്നീടുള്ള ചില കൈയെഴുത്തുപ്രതികൾ Comma Johanneum എന്നറിയപ്പെടുന്ന ഒരു ദീർഘവായന ചേർക്കുന്നു: ‘സ്വർഗത്തിൽ: പിതാവ്, വചനം, പരിശുദ്ധാത്മാവ്; ഈ മൂന്നുപേരും ഒന്നാണ്. ഭൂമിയിൽ സാക്ഷ്യം വഹിക്കുന്നവർ മൂന്നുപേർ ...’ ഈ വാചകം ലഭ്യമായ ഏറ്റവും പഴയ ഗ്രീക്ക് കൈയെഴുത്തുപ്രതികളിൽ കാണുന്നില്ല; SBLGNT പാഠത്തിലും ഇത് ഉൾപ്പെടുത്തിയിട്ടില്ല.'
    reason: textual_variant
lexical_decisions:
- source_word: ὅτι
  choice: ഉണ്ട് എന്നതിനാൽ ആശയം സന്ദർഭബന്ധത്തിലൂടെ പ്രകടമാക്കുന്നു
  rationale: ὅτι മുൻവാക്യത്തിലെ പ്രസ്താവനയ്ക്കുള്ള വിശദീകരണം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ ഈ അപൂർണ്ണവാക്യഭാഗത്തിന്റെ സ്വാഭാവിക തുടർച്ചയിൽ പ്രത്യേകമായി ‘എന്തെന്നാൽ’ ചേർക്കാതെ തന്നെ വിശദീകരണബന്ധം വ്യക്തമാകുന്നു; അത് ചേർത്താൽ ഒറ്റവാക്യമായി ഉദ്ധരിക്കുമ്പോൾ കൃത്രിമത്വം തോന്നാം.
- source_word: τρεῖς
  choice: മൂന്നുപേർ
  rationale: സാക്ഷ്യം പറയുന്ന വ്യക്തിവൽക്കരിക്കപ്പെട്ട മൂന്നിനെ സൂചിപ്പിക്കുന്ന സംഖ്യ; തുടർന്നുള്ള സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളരൂപം.
- source_word: εἰσιν
  choice: ഉണ്ട്
  rationale: വർത്തമാനകാല അസ്തിത്വസൂചക ക്രിയയുടെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: οἱ μαρτυροῦντες
  choice: സാക്ഷ്യം പറയുന്നവർ
  rationale: നാമവൽക്കരിച്ച വർത്തമാന കൃദന്തരൂപത്തിന്റെ പ്രവർത്തനാത്മക അർഥം നിലനിർത്തുന്നു; ‘സാക്ഷികൾ’ എന്ന നാമരൂപത്തേക്കാൾ സാക്ഷ്യം പറയുന്ന പ്രവൃത്തിക്ക് ഊന്നൽ നൽകുന്നു.
theological_decisions:
- issue: 1 യോഹന്നാൻ 5:7-ലെ പാഠരൂപവും Comma Johanneum എന്ന ദീർഘവായനയും
  choice: 'SBLGNT-യിലെ ഹ്രസ്വപാഠം മാത്രം മുഖ്യവാചകത്തിൽ പരിഭാഷപ്പെടുത്തുന്നു: ‘സാക്ഷ്യം പറയുന്നവർ മൂന്നുപേരുണ്ട്,’'
  alternative: 'പിന്നീടുള്ള ചില കൈയെഴുത്തുപ്രതികളിലും Textus Receptus/KJV പാരമ്പര്യത്തിലും ‘സ്വർഗത്തിൽ: പിതാവ്, വചനം, പരിശുദ്ധാത്മാവ്; ഈ മൂന്നും ഒന്നാകുന്നു. ഭൂമിയിൽ സാക്ഷ്യം പറയുന്നവർ മൂന്നുപേർ ...’ എന്ന ദീർഘവായന കാണുന്നു.'
  rationale: നൽകിയിരിക്കുന്ന ഗ്രീക്ക് സ്രോതസ്സ് വിമർശനാത്മകമായി സ്ഥാപിച്ച ഹ്രസ്വപാഠമാണ്. ചരിത്രപരമായി പ്രാധാന്യമുള്ള ദീർഘമായ ത്രിത്വപര വായന SBLGNT പാഠത്തിലില്ല; അതിനാൽ സ്രോതസ്സിന്റെ പാഠം മുഖ്യവാചകത്തിൽ പിന്തുടർന്ന് പാഠഭേദം അടിക്കുറിപ്പിൽ സുതാര്യമായി രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘സാക്ഷ്യം പറയുന്നവർ’ എന്ന പ്രയോഗം ഗ്രീക്കിലെ കൃദന്തരൂപത്തിന്റെ സജീവമായ അർഥം സംരക്ഷിക്കുന്നു. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനം കോമ നിലനിർത്തിയിരിക്കുന്നു.
