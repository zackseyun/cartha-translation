    issue: The conjunction ὅτι is not represented in the main translation.
    rationale: ὅτι introduces an explanation of the preceding statement. Omitting it weakens a source-text element that can be naturally expressed in Malayalam.
  - severity: low
    issue: The footnote’s rendering of “and these three are one” uses “ഈ മൂന്നും ഒന്നാകുന്നു.”
    rationale: “ഒന്നാകുന്നു” can suggest becoming one, whereas the variant’s assertion is “are one.” “ഈ മൂന്നുപേരും ഒന്നാണ്” is clearer and fits the personal referents named in the quotation.
