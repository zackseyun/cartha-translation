id: 1JN.5.4
reference: 1 John 5:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι πᾶν τὸ γεγεννημένον ἐκ τοῦ θεοῦ νικᾷ τὸν κόσμον. καὶ αὕτη ἐστὶν ἡ νίκη ἡ νικήσασα τὸν κόσμον, ἡ πίστις ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/004.yaml
  text: 'For everyone who has been born of God overcomes the world[b][a]. And this is the victory that has overcome the world: our faith.'
translation:
  language: ml
  text: എന്തെന്നാൽ, ദൈവത്തിൽനിന്നു ജനിച്ച ഏവനും[a] ലോകത്തെ ജയിക്കുന്നു. ലോകത്തെ ജയിച്ച ജയം ഇതാണ്—നമ്മുടെ വിശ്വാസം.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ദൈവത്തിൽനിന്നു ജനിച്ചിട്ടുള്ളതെല്ലാം.’ ഗ്രീക്കിലെ നപുംസകപ്രയോഗം ദൈവത്തിൽനിന്നു ജനിച്ചവരുടെ മുഴുവൻ വിഭാഗത്തെയും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘നമ്മുടെ വിശ്വസ്തത.’ ഗ്രീക്ക് പദത്തിന് ചില സന്ദർഭങ്ങളിൽ ‘വിശ്വാസം,’ ‘ആശ്രയം,’ ‘വിശ്വസ്തത’ എന്നീ അർഥങ്ങൾ വരാം; ഇവിടെ പ്രധാനപാഠം ‘വിശ്വാസം’ എന്നു നൽകുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ പ്രസ്താവനയ്ക്കുള്ള കാരണം അവതരിപ്പിക്കുന്ന ബന്ധകത്തിന്റെ കാരണാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: πᾶν τὸ γεγεννημένον
  choice: ജനിച്ച ഏവനും
  rationale: ഗ്രീക്കിൽ പ്രയോഗം നപുംസക ഏകവചനമാണെങ്കിലും സന്ദർഭത്തിൽ ദൈവത്തിൽനിന്നു ജനിച്ചവരുടെ മുഴുവൻ വിഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്. വ്യക്തികളെ ഉദ്ദേശിക്കുന്ന അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; രൂപപരമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: γεγεννημένον
  choice: ജനിച്ച
  rationale: പൂർത്തിയായ ജനനവും അതിന്റെ നിലനിൽക്കുന്ന ഫലവും സൂചിപ്പിക്കുന്ന perfect passive participle ആണ്. മലയാളത്തിലെ സന്ദർഭത്തിൽ ‘ജനിച്ച’ എന്ന രൂപം പുതിയ ജനനത്തിന്റെ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐκ τοῦ θεοῦ
  choice: ദൈവത്തിൽനിന്നു
  rationale: ἐκ സൂചിപ്പിക്കുന്ന ഉത്ഭവം നേരിട്ട് നിലനിർത്തുകയും യോഹന്നാന്റെ ദൈവജനന ഭാഷ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: νικᾷ
  choice: ജയിക്കുന്നു
  rationale: വർത്തമാനകാല പ്രവർത്തനത്തെ വ്യക്തമാക്കുന്നു; νίκη, νικήσασα എന്നീ സമമൂലപദങ്ങളുമായുള്ള ‘ജയിക്കുക/ജയം’ ബന്ധവും സംരക്ഷിക്കുന്നു.
- source_word: τὸν κόσμον
  choice: ലോകത്തെ
  rationale: യോഹന്നാന്റെ രചനകളിൽ ദൈവത്തോട് എതിർപ്പുള്ള ലോകക്രമം ഉൾപ്പെടുന്ന അർഥസാധ്യതയെ വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ പതിവായ പദം നിലനിർത്തുന്നു.
- source_word: αὕτη ἐστὶν ἡ νίκη
  choice: ജയം ഇതാണ്
  rationale: ചൂണ്ടിക്കാണിക്കുന്ന ഊന്നലും νίκη എന്ന നാമത്തിന്റെ നേരിട്ടുള്ള അർഥവും നിലനിർത്തുന്നു.
- source_word: ἡ νικήσασα
  choice: ജയിച്ച
  rationale: aorist participle സൂചിപ്പിക്കുന്ന പൂർത്തീകരിച്ച വിജയത്തെ മലയാളത്തിലെ ഭൂതകാല വിശേഷണരൂപത്തിൽ നൽകുകയും ‘ജയിക്കുന്നു/ജയം/ജയിച്ച’ എന്ന മൂലപദബന്ധം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ἡ πίστις ἡμῶν
  choice: നമ്മുടെ വിശ്വാസം
  rationale: πίστις എന്ന പദത്തിന്റെ ഇവിടെ ഏറ്റവും സ്വാഭാവികമായ അർഥം ‘വിശ്വാസം’ ആണ്; ἡμῶν ഉടമസ്ഥബന്ധമായി ‘നമ്മുടെ’ എന്നു നൽകുന്നു. ‘വിശ്വസ്തത’ എന്ന പദസാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
theological_decisions:
- issue: πᾶν τὸ γεγεννημένον എന്നതിന്റെ സൂചിതർഥം
  choice: വ്യക്തികളെയും അവരുടെ മുഴുവൻ വിഭാഗത്തെയും സൂചിപ്പിക്കുന്ന ‘ദൈവത്തിൽനിന്നു ജനിച്ച ഏവനും’
  alternative: രൂപപരമായി കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള ‘ദൈവത്തിൽനിന്നു ജനിച്ചിട്ടുള്ളതെല്ലാം’
  rationale: നപുംസകരൂപം മുഴുവൻ വിഭാഗത്തെയും ഉൾക്കൊള്ളുന്നു; സമീപസന്ദർഭം ദൈവമക്കളായ വിശ്വാസികളെക്കുറിച്ചായതിനാൽ പ്രധാനപാഠത്തിൽ വ്യക്തിപരമായ സൂചനയാണ് കൂടുതൽ വ്യക്തം. ഗ്രീക്ക് രൂപത്തിന്റെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: πίστις എന്നതിന്റെ അർഥം
  choice: വിശ്വാസം
  alternative: വിശ്വസ്തത
  rationale: ഈ വാക്യത്തിൽ ലോകത്തെ ജയിച്ച ജയമായി വിശ്വാസത്തെ തിരിച്ചറിയുന്നതാണ് ഏറ്റവും സ്വാഭാവികമായ വായന. എങ്കിലും πίστις ചില സന്ദർഭങ്ങളിൽ ‘വിശ്വസ്തത’ എന്നും അർഥമാകുന്നതിനാൽ ആ സാധ്യത നിശ്ശബ്ദമായി ഒഴിവാക്കാതെ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ജയിക്കുന്നു—ജയം—ജയിച്ച’ എന്ന ആവർത്തനം ഗ്രീക്കിലെ νικάω/νίκη പദബന്ധം ബോധപൂർവം സംരക്ഷിക്കുന്നു. ദൈവത്തെ സൂചിപ്പിക്കുന്ന ആദരസർവനാമമോ വിഭാഗീയ സാങ്കേതികപദമോ അനാവശ്യമായി ചേർത്തിട്ടില്ല.
