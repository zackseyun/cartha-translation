id: 1JN.5.13
reference: 1 John 5:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ταῦτα ἔγραψα ⸀ὑμῖν ἵνα εἰδῆτε ὅτι ζωὴν ⸂ἔχετε αἰώνιον⸃, ⸂τοῖς πιστεύουσιν⸃ εἰς τὸ ὄνομα τοῦ υἱοῦ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/013.yaml
  text: I have written these things to you who believe in the name of the Son of God[a], so that you may know that you have eternal life.
translation:
  language: ml
  text: ദൈവപുത്രന്റെ നാമത്തിൽ വിശ്വസിക്കുന്ന നിങ്ങൾക്ക്, നിങ്ങൾക്ക് നിത്യജീവൻ ഉണ്ടെന്ന് അറിയേണ്ടതിന് ഞാൻ ഇതെല്ലാം എഴുതിയിരിക്കുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταῦτα
  choice: ഇതെല്ലാം
  rationale: നപുംസക ബഹുവചനമായ ഈ സൂചകപദം ലേഖനത്തിലെ കാര്യങ്ങളെയോ ഉള്ളടക്കത്തെയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഇതെല്ലാം’ സ്വാഭാവികമായി ആ സമാഹാരാർത്ഥം നൽകുന്നു.
- source_word: ἔγραψα
  choice: ഞാൻ ... എഴുതിയത്
  rationale: കത്തുരചനയെ സൂചിപ്പിക്കുന്ന പൂർത്തിയായ പ്രവൃത്തി മലയാളത്തിലെ സ്വാഭാവിക ലക്ഷ്യവാക്യഘടനയിൽ ഇങ്ങനെ വ്യക്തമാകുന്നു.
- source_word: ὑμῖν
  choice: നിങ്ങൾക്ക്
  rationale: ദാതൃകാർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἵνα εἰδῆτε
  choice: നിങ്ങൾ അറിയേണ്ടതിനാണ്
  rationale: ἵνα സൂചിപ്പിക്കുന്ന ലക്ഷ്യം വ്യക്തമായി പ്രകടിപ്പിക്കുകയും അറിവിലേക്കുള്ള ഉദ്ദേശ്യം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ζωὴν αἰώνιον
  choice: നിത്യജീവൻ
  rationale: യോഹന്നാന്റെ പ്രയോഗത്തിലെ കാലാതീത ദൈർഘ്യവും ദൈവബന്ധിതമായ ജീവന്റെ ഗുണവും സംരക്ഷിക്കുന്ന പരിചിതവും കൃത്യവുമായ പദപ്രയോഗം.
- source_word: ἔχετε
  choice: നിങ്ങൾക്ക് ... ഉണ്ട്
  rationale: വർത്തമാനകാലത്തിലുള്ള യഥാർത്ഥ കൈവശാവസ്ഥയെ പ്രകടിപ്പിക്കുന്നു; ഭാവിയിലെ പ്രത്യാശയായി മാത്രം മാറ്റുന്നില്ല.
- source_word: τοῖς πιστεύουσιν
  choice: വിശ്വസിക്കുന്ന നിങ്ങൾക്ക്
  rationale: ὑμῖν എന്നതോടുള്ള വിശദീകരണാത്മക സമാനാധികരണമായി സ്വീകരിച്ച്, അഭിസംബോധിതരെ സ്വാഭാവിക മലയാളത്തിൽ തിരിച്ചറിയിക്കുന്നു.
- source_word: πιστεύουσιν εἰς
  choice: '...യിൽ വിശ്വസിക്കുന്ന'
  rationale: യോഹന്നാന്റെ πιστεύω εἰς പ്രയോഗത്തിന്റെ വ്യക്തിയിലേക്കുള്ള വിശ്വാസം എന്ന ആശയം പരിചിതമായ ബൈബിൾ ഭാഷയിൽ നിലനിർത്തുന്നു.
- source_word: τὸ ὄνομα
  choice: നാമം
  rationale: വ്യക്തിയെയും വെളിപ്പെടുത്തപ്പെട്ട അധികാരത്തെയും സൂചിപ്പിക്കുന്ന ബൈബിൾ പ്രയോഗം പരാവർത്തനം ചെയ്യാതെ സംരക്ഷിക്കുന്നു.
- source_word: τοῦ υἱοῦ τοῦ θεοῦ
  choice: ദൈവപുത്രൻ
  rationale: ഗ്രീക്കിലെ ക്രിസ്തുശാസ്ത്രപരമായ പദവിയെ കൃത്യവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: τοῖς πιστεύουσιν എന്ന പദസമുച്ചയത്തിന്റെ സ്ഥാനവും വാക്യബന്ധവും
  choice: 'ὑμῖν എന്നതിനോടു ചേർത്ത്: ‘ദൈവപുത്രന്റെ നാമത്തിൽ വിശ്വസിക്കുന്ന നിങ്ങൾക്ക്’'
  alternative: 'ഉറപ്പിന്റെ ഉപവാക്യത്തിനു ശേഷം പുനരുക്ത സമാനാധികരണമായി: ‘നിങ്ങൾക്ക് നിത്യജീവൻ ഉണ്ടെന്ന് നിങ്ങൾ അറിയേണ്ടതിന്—ദൈവപുത്രന്റെ നാമത്തിൽ വിശ്വസിക്കുന്നവർക്ക്’'
  rationale: ഗ്രീക്ക് പദക്രമം രണ്ടു ബന്ധങ്ങളും അനുവദിക്കുന്നു. ὑμῖν എന്നതിനോടു ചേർക്കുന്നത് മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികവും, വിശ്വാസികൾ തങ്ങൾക്ക് നിത്യജീവൻ ഉണ്ടെന്ന് അറിയാൻ യോഹന്നാൻ എഴുതുന്നു എന്ന സാധ്യതയേറിയ അർത്ഥവും നൽകുന്നു. യഥാർത്ഥ പദക്രമത്തിലെ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘നാമത്തിൽ വിശ്വസിക്കുക’, ‘നിത്യജീവൻ’ എന്നീ ബൈബിൾപ്രയോഗങ്ങൾ നിലനിർത്തിയിട്ടുണ്ട്; ഗ്രീക്കിലെ യഥാർത്ഥ വാക്യഘടനാസന്ദിഗ്ധത അടിക്കുറിപ്പിലൂടെ രേഖപ്പെടുത്തി.
