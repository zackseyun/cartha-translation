  edition: SBLGNT
  text: Τεκνία, φυλάξατε ἑαυτὰ ἀπὸ τῶν ⸀εἰδώλων.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/021.yaml
  text: Little children[a], guard yourselves from idols.
translation:
  language: ml
  text: കുഞ്ഞുമക്കളേ[a], വിഗ്രഹങ്ങളിൽനിന്ന് നിങ്ങളെത്തന്നെ കാത്തുകൊള്ളുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘മക്കളേ’ അല്ലെങ്കിൽ ‘പ്രിയമക്കളേ.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദം യോഹന്നാൻ നേരിട്ടുള്ള സംബോധനയിൽ വാത്സല്യത്തോടെ ഉപയോഗിക്കുന്ന ലഘുരൂപമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τεκνία
  choice: കുഞ്ഞുമക്കളേ
  rationale: τεκνίον എന്ന പദത്തിന്റെ സംബോധന ബഹുവചനം; യോഹന്നാൻ വാത്സല്യപൂർവമായ ഇടയസംബോധനയായി ഉപയോഗിക്കുന്നു. ‘കുഞ്ഞുമക്കളേ’ കുടുംബബന്ധത്തിന്റെ രൂപകവും സ്നേഹാർദ്രമായ ലഘുത്വഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: φυλάξατε
  choice: കാത്തുകൊള്ളുക
  rationale: രണ്ടാംപുരുഷ ബഹുവചനത്തിലുള്ള aorist active imperative ആണ്; ജാഗ്രതയോടെ സംരക്ഷിക്കണമെന്ന ശക്തമായ ആഹ്വാനം നൽകുന്നു. മലയാളത്തിൽ ‘കാത്തുകൊള്ളുക’ എന്നത് സജീവമായ സൂക്ഷിപ്പിനെയും കരുതലിനെയും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἑαυτὰ
  choice: നിങ്ങളെത്തന്നെ
  rationale: ആജ്ഞയുടെ കർമമായി വരുന്ന ആത്മവാചക സർവനാമത്തിന്റെ ഊന്നൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἀπὸ
  choice: -യിൽനിന്ന്
  rationale: വേർപാടും അകലവും സൂചിപ്പിക്കുന്ന മുൻവാക്യപദത്തിന്റെ അർഥം മലയാളത്തിലെ വിഭക്തിരൂപത്തിലൂടെ നേരിട്ട് നൽകുന്നു.
- source_word: εἰδώλων
  choice: വിഗ്രഹങ്ങൾ
  rationale: εἴδωλον സാധാരണയായി ആരാധനാവസ്തുവായ വിഗ്രഹത്തെയോ പ്രതിമയെയോ സൂചിപ്പിക്കുന്നു. ‘വിഗ്രഹങ്ങൾ’ എന്നത് ഉറവിടപദത്തിന്റെ മൂർത്തമായ അർഥം നിലനിർത്തുന്നു; ‘വ്യാജദേവന്മാർ’ എന്ന വിപുലീകരണം ഇവിടെ ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: ‘വിഗ്രഹങ്ങൾ’ എന്നതിന്റെ വ്യാപ്തി
  choice: ‘വിഗ്രഹങ്ങൾ’ എന്ന് മൂർത്തമായി പരിഭാഷപ്പെടുത്തുക
  alternative: ‘ദൈവത്തിന്റെ സ്ഥാനം കൈക്കൊള്ളുന്ന എന്തിൽനിന്നും’ അല്ലെങ്കിൽ ‘എല്ലാ വ്യാജാരാധനയിൽനിന്നും’ എന്ന് വിപുലീകരിക്കുക
  rationale: ഗ്രീക്ക് പാഠം വിഗ്രഹങ്ങളെ നേരിട്ട് പേരെടുത്തു പറയുന്നു. മുന്നറിയിപ്പിന് വിശാലമായ പ്രയോഗസാധ്യത ഉണ്ടെങ്കിലും, പരിഭാഷ ഉറവിടപാഠത്തേക്കാൾ അർഥവ്യാപ്തി കൂട്ടരുത്; സത്യദൈവവും വ്യാജാരാധനയും തമ്മിലുള്ള ലേഖനത്തിലെ സംഘർഷവും ഇങ്ങനെ നിലനിൽക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കുഞ്ഞുമക്കളേ’ എന്നത് യോഹന്നാന്റെ വാത്സല്യസംബോധന നിലനിർത്തുന്നു; ‘നിങ്ങളെത്തന്നെ കാത്തുകൊള്ളുക’ ആത്മവാചക ഊന്നലും ജാഗ്രതയ്ക്കുള്ള ആജ്ഞയും വ്യക്തമായി നൽകുന്നു.
