id: 1JN.5.10
reference: 1 John 5:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς τὸν υἱὸν τοῦ θεοῦ ἔχει τὴν μαρτυρίαν ἐν ⸀αὑτῷ· ὁ μὴ πιστεύων τῷ θεῷ ψεύστην πεποίηκεν αὐτόν, ὅτι οὐ πεπίστευκεν εἰς τὴν μαρτυρίαν ἣν μεμαρτύρηκεν ὁ θεὸς περὶ τοῦ υἱοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/010.yaml
  text: The one who believes in the Son of God has the testimony in himself[a]; the one who does not believe God has made him a liar[b], because he has not believed the testimony that God has testified about his Son.
translation:
  language: ml
  text: ദൈവത്തിന്റെ പുത്രനിൽ വിശ്വസിക്കുന്നവന് ആ സാക്ഷ്യം തന്നിൽത്തന്നെയുണ്ട്[a]. ദൈവത്തെ വിശ്വസിക്കാത്തവൻ അവനെ കള്ളനാക്കിയിരിക്കുന്നു[b]; കാരണം, ദൈവം തന്റെ പുത്രനെക്കുറിച്ചു നൽകിയ സാക്ഷ്യം അവൻ വിശ്വസിച്ചിട്ടില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ “തന്നിൽത്തന്നെ” എന്നതിനു പകരം “അവനിൽ” എന്നു കാണുന്നു; അത് “പുത്രനിൽ” എന്ന അർഥത്തിലും മനസ്സിലാക്കാം.
    reason: textual_variant
  - marker: b
    text: അഥവാ, “അവനെ കള്ളനെന്നു വരുത്തിയിരിക്കുന്നു.” ഗ്രീക്കിൽ അക്ഷരാർഥം “അവനെ കള്ളനാക്കിയിരിക്കുന്നു” എന്നാണ്; ദൈവത്തിന്റെ സാക്ഷ്യം നിരസിക്കുന്നത് ദൈവം അസത്യം പറയുന്നു എന്നു കണക്കാക്കുന്നതിനു തുല്യമാണെന്നതാണ് ആശയം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πιστεύων
  choice: വിശ്വസിക്കുന്നവൻ
  rationale: നാമപദമായി പ്രവർത്തിക്കുന്ന വർത്തമാനകാല കൃദന്തത്തിന്റെ പൊതുവായ ഏകവചനഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: εἰς τὸν υἱὸν τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ പുത്രനിൽ
  rationale: πιστεύω എന്ന ക്രിയയോടൊപ്പമുള്ള εἰς വ്യക്തിയിലേക്കു തിരിയുന്ന വിശ്വാസത്തെയോ ആശ്രയത്തെയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘പുത്രനിൽ വിശ്വസിക്കുക’ അതിന്റെ സ്വാഭാവിക രൂപമാണ്.
- source_word: μαρτυρίαν
  choice: സാക്ഷ്യം
  rationale: യോഹന്നാന്റെ പ്രയോഗത്തിൽ ഇത് നൽകിയ സാക്ഷ്യത്തെയും അതിന്റെ ഉള്ളടക്കത്തെയും സൂചിപ്പിക്കുന്നു; നിയമപരമായ സാക്ഷ്യഭാവവും ഈ പദം നിലനിർത്തുന്നു.
- source_word: ἐν αὑτῷ
  choice: തന്നിൽത്തന്നെ
  rationale: പ്രതിബിംബസർവനാമം മുമ്പു പറഞ്ഞ വിശ്വാസിയിലേക്കു സ്വാഭാവികമായി മടങ്ങുന്നു; സാക്ഷ്യം അയാളുടെ ഉള്ളിൽ ഉള്ളതെന്ന അർഥം പരിഭാഷയിൽ വ്യക്തമാകുന്നു.
- source_word: ὁ μὴ πιστεύων τῷ θεῷ
  choice: ദൈവത്തെ വിശ്വസിക്കാത്തവൻ
  rationale: ഇവിടെ ദൈവം ഉണ്ടെന്നു വിശ്വസിക്കാത്തതല്ല, ദൈവം പറഞ്ഞതു സത്യമെന്നു സ്വീകരിക്കാത്തതാണ് ആശയം. മലയാളത്തിലെ ‘ദൈവത്തെ വിശ്വസിക്കുക’ ഈ വ്യത്യാസം ‘ദൈവത്തിൽ വിശ്വസിക്കുക’ എന്നതിനെക്കാൾ നന്നായി കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: ψεύστην πεποίηκεν αὐτόν
  choice: അവനെ കള്ളനാക്കിയിരിക്കുന്നു
  rationale: ഗ്രീക്കിലെ ശക്തവും നേരിട്ടുള്ളതുമായ പ്രയോഗവും സമ്പൂർണകാലത്തിന്റെ ഇപ്പോഴത്തെ ഫലഭാവവും നിലനിർത്തുന്നു; ഉദ്ദേശ്യം ദൈവത്തിന്റെ സാക്ഷ്യം നിരസിക്കുന്നവൻ ദൈവത്തെ അസത്യവാദിയായി കണക്കാക്കുന്നു എന്നതാണ്.
- source_word: οὐ πεπίστευκεν
  choice: വിശ്വസിച്ചിട്ടില്ല
  rationale: തുടരുന്ന ഇപ്പോഴത്തെ പ്രസക്തിയുള്ള സമ്പൂർണകാല അവിശ്വാസത്തെ മലയാളത്തിലെ ഈ രൂപം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἣν μεμαρτύρηκεν ὁ θεὸς
  choice: ദൈവം … നൽകിയ സാക്ഷ്യം
  rationale: നാമം-ക്രിയ പദാവർത്തനം അക്ഷരാർഥത്തിൽ പുനരാവർത്തിച്ചാൽ മലയാളത്തിൽ കൃത്രിമമാകും; ‘സാക്ഷ്യം നൽകുക’ എന്ന സ്വാഭാവിക പ്രയോഗം അതേ സാക്ഷ്യപ്രവർത്തനം വ്യക്തമാക്കുന്നു.
- source_word: περὶ τοῦ υἱοῦ αὐτοῦ
  choice: തന്റെ പുത്രനെക്കുറിച്ചു
  rationale: περί സഹിതമുള്ള ഷഷ്ഠിയുടെ ‘കുറിച്ച്/സംബന്ധിച്ച്’ എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു; αὐτοῦ ദൈവത്തിലേക്കു മടങ്ങുന്നതിനാൽ ‘തന്റെ’ എന്നു പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: ‘തന്നിൽത്തന്നെയുള്ള സാക്ഷ്യം’ ആരിലാണ് എന്നത്
  choice: സാക്ഷ്യം വിശ്വാസിയുടെ ഉള്ളിലാണ്
  alternative: വ്യത്യസ്ത പാഠവായന അനുസരിച്ച് സാക്ഷ്യം പുത്രനിലാണ്
  rationale: നൽകിയിരിക്കുന്ന SBLGNT പാഠത്തിലെ ἐν αὑτῷ മുമ്പു പറഞ്ഞ വിശ്വാസിയിലേക്കാണ് ഏറ്റവും സ്വാഭാവികമായി മടങ്ങുന്നത്. സമീപവാക്യങ്ങളിൽനിന്നുള്ള കൂടുതൽ ദൈവശാസ്ത്രവിവരണം ചേർക്കാതെ അതു നേരിട്ട് പരിഭാഷപ്പെടുത്തി; പാഠഭേദം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- issue: ‘ദൈവത്തെ വിശ്വസിക്കാത്തവൻ’ എന്നതിന്റെ വ്യാപ്തി
  choice: ദൈവം നൽകിയ സാക്ഷ്യം സത്യമെന്നു സ്വീകരിക്കാത്തത്
  alternative: ദൈവത്തിന്റെ അസ്തിത്വത്തിലുള്ള പൊതുവായ അവിശ്വാസം
  rationale: തുടർന്നുള്ള ὅτι-വാക്യം ഈ അവിശ്വാസത്തെ ദൈവം തന്റെ പുത്രനെക്കുറിച്ചു നൽകിയ സാക്ഷ്യം വിശ്വസിക്കാത്തതെന്നു നിർവചിക്കുന്നു. അതിനാൽ ‘ദൈവത്തിൽ വിശ്വസിക്കാത്തവൻ’ എന്നതിനു പകരം ‘ദൈവത്തെ വിശ്വസിക്കാത്തവൻ’ എന്നു നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ഗദ്യശൈലി സ്വീകരിച്ചു. ‘സാക്ഷ്യം’, ‘കള്ളനാക്കിയിരിക്കുന്നു’ എന്നീ പദങ്ങൾ മൂലപാഠത്തിന്റെ ശക്തിയും യോഹന്നാന്റെ സാക്ഷ്യഭാഷയും നിലനിർത്തുന്നു. രണ്ട് നീണ്ട ഉപവാക്യങ്ങൾ വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി; കാരണംബന്ധം മാറ്റിയിട്ടില്ല. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
