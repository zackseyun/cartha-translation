id: 1JN.5.16
reference: 1 John 5:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐάν τις ἴδῃ τὸν ἀδελφὸν αὐτοῦ ἁμαρτάνοντα ἁμαρτίαν μὴ πρὸς θάνατον, αἰτήσει, καὶ δώσει αὐτῷ ζωήν, τοῖς ἁμαρτάνουσιν μὴ πρὸς θάνατον. ἔστιν ἁμαρτία πρὸς θάνατον· οὐ περὶ ἐκείνης λέγω ἵνα ἐρωτήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/016.yaml
  text: If anyone sees his brother committing a sin not leading to death[a], he shall ask, and God will give him life—to those committing sins not leading to death. There is sin leading to death[c][b]; I am not saying that he should ask about that.
translation:
  language: ml
  text: ആരെങ്കിലും തന്റെ സഹോദരൻ[a] മരണത്തിലേക്കു നയിക്കാത്ത ഒരു പാപം ചെയ്യുന്നതു കണ്ടാൽ, അവൻ അപേക്ഷിക്കട്ടെ; ദൈവം[c] അവന് ജീവൻ നൽകും—മരണത്തിലേക്കു നയിക്കാത്ത പാപം ചെയ്യുന്നവർക്ക്. മരണത്തിലേക്കു നയിക്കുന്ന പാപമുണ്ട്[b]; ആ പാപത്തെക്കുറിച്ച് അവൻ അപേക്ഷിക്കണമെന്ന് ഞാൻ പറയുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സഹോദരൻ’ എന്നത് ഗ്രീക്കിൽ ഏകവചന പുല്ലിംഗമാണ്; ഈ സന്ദർഭത്തിൽ അത് ഒരു സഹവിശ്വാസിയെ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം.
    reason: cultural_note
  - marker: b
    text: ഇവിടെ ‘മരണം’ എന്നത് ശാരീരിക മരണമോ ആത്മീയ മരണമോ അന്തിമശിക്ഷാവിധിയോ എന്നു ഗ്രീക്ക് പാഠം വ്യക്തമാക്കുന്നില്ല.
    reason: theological_ambiguity
  - marker: c
    text: ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘അവന് ജീവൻ നൽകും’ എന്നാണ്; അപേക്ഷയുടെ സന്ദർഭത്തിൽ നൽകുന്നവൻ ദൈവമാണെന്ന് മനസ്സിലാകുന്നതിനാൽ മുഖ്യപാഠത്തിൽ ‘ദൈവം’ എന്നു വ്യക്തമാക്കിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδελφὸν
  choice: സഹോദരൻ
  rationale: ഗ്രീക്കിൽ ഏകവചന പുല്ലിംഗമാണ്. യോഹന്നാന്റെ പ്രയോഗത്തിൽ ഇത് സാധാരണയായി വിശ്വാസസമൂഹത്തിലെ സഹവിശ്വാസിയെ സൂചിപ്പിക്കുന്നു; മൂലരൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തി അതിന്റെ സന്ദർഭപരമായ വ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἁμαρτάνοντα ἁμαρτίαν
  choice: ഒരു പാപം ചെയ്യുന്നതു
  rationale: ക്രിയയും അതേ ധാതുവിൽനിന്നുള്ള കർമപദവും ചേർന്ന ഗ്രീക്ക് പ്രയോഗത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഒരു നിർദിഷ്ട പാപപ്രവൃത്തിയായി അവതരിപ്പിക്കുന്നു.
- source_word: μὴ πρὸς θάνατον
  choice: മരണത്തിലേക്കു നയിക്കാത്ത
  rationale: πρός ഇവിടെ ദിശയെയോ ഫലത്തെയോ സൂചിപ്പിക്കുന്നു. മരണത്തിന്റെ സ്വഭാവം നിർവചിക്കാതെ ഫലത്തിലേക്കുള്ള നീക്കം നിലനിർത്തുന്നു.
- source_word: αἰτήσει
  choice: അവൻ അപേക്ഷിക്കട്ടെ
  rationale: ഭാവികാല നിർദേശരൂപത്തിന് സന്ദർഭത്തിൽ ആഹ്വാനാത്മക അർഥമുണ്ട്. പ്രാർഥനാസന്ദർഭം നിലനിർത്തിക്കൊണ്ട് നിർദേശം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: δώσει αὐτῷ ζωήν
  choice: ദൈവം അവന് ജീവൻ നൽകും
  rationale: ഗ്രീക്കിൽ നൽകുന്നവന്റെ കർത്താവ് പ്രകടമല്ല. അപേക്ഷയുടെ സന്ദർഭത്തിൽ ദൈവമാണ് ജീവൻ നൽകുന്നവൻ എന്നു ശക്തമായി സൂചിപ്പിക്കപ്പെടുന്നതിനാൽ മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ദൈവത്തെ കർത്താവാക്കി; ഈ വിശദീകരണം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: ζωήν
  choice: ജീവൻ
  rationale: യോഹന്നാന്റെ രചനകളിൽ സമൃദ്ധമായ ദൈവശാസ്ത്രപരമായ അർഥമുള്ള പദമാണെങ്കിലും, ‘ആത്മീയജീവൻ’ എന്നിങ്ങനെ അർഥം ചുരുക്കാതെ മൂലത്തിലെ ലളിതമായ പദം നിലനിർത്തുന്നു.
- source_word: τοῖς ἁμαρτάνουσιν μὴ πρὸς θάνατον
  choice: —മരണത്തിലേക്കു നയിക്കാത്തവിധം പാപം ചെയ്യുന്നവർക്ക്
  rationale: വാക്യഘടനയിൽ പ്രയാസമുള്ള ഈ ബഹുവചന ദത്തിവ് പ്രയോഗം വിശദീകരണസ്വഭാവമുള്ളതായി ഡാഷിനു ശേഷം നിലനിർത്തുന്നു; ഏകവചനത്തിൽനിന്ന് ബഹുവചനത്തിലേക്കുള്ള മൂലപാഠത്തിലെ മാറ്റം ഇല്ലാതാക്കുന്നില്ല.
- source_word: ἔστιν ἁμαρτία πρὸς θάνατον
  choice: മരണത്തിലേക്കു നയിക്കുന്ന പാപമുണ്ട്
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തവും അനിർദിഷ്ടവുമായ പ്രയോഗം, അത് ഒറ്റ പ്രത്യേക പ്രവൃത്തിയാണോ ഒരു വിഭാഗമാണോ എന്നു തീരുമാനിക്കാതെ നിലനിർത്തുന്നു.
- source_word: οὐ περὶ ἐκείνης λέγω ἵνα ἐρωτήσῃ
  choice: ആ പാപത്തെക്കുറിച്ച് അവൻ അപേക്ഷിക്കണമെന്ന് ഞാൻ പറയുന്നില്ല
  rationale: ഇത് അപേക്ഷിക്കരുതെന്ന നേരിട്ടുള്ള വിലക്കായി ശക്തിപ്പെടുത്താതെ, അങ്ങനെ അപേക്ഷിക്കണമെന്ന് താൻ പറയുന്നില്ല എന്ന മൂലവാക്യത്തിന്റെ സൂക്ഷ്മത സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ‘മരണത്തിലേക്കു നയിക്കുന്ന പാപം’ എന്നതിലെ മരണത്തിന്റെ അർഥം
  choice: മരണം എന്ന പദം നിർവചിക്കാതെ നിലനിർത്തി.
  alternative: ശാരീരിക മരണം, ആത്മീയ മരണം, അന്തിമശിക്ഷാവിധി എന്നിവയിൽ ഏതെങ്കിലും ഒന്നായി വ്യക്തമാക്കുക.
  rationale: വാക്യം മരണത്തിന്റെ സ്വഭാവം നിർവചിക്കുന്നില്ല; അതിനാൽ യഥാർഥ ദൈവശാസ്ത്രപരമായ അനിശ്ചിതത്വം പരിഭാഷയിൽ പരിഹരിച്ചിട്ടില്ല.
- issue: ‘ജീവൻ നൽകും’ എന്നതിലെ കർത്താവ്
  choice: ദൈവം എന്ന കർത്താവിനെ മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കി.
  alternative: കർത്താവിനെ പ്രകടമാക്കാതെ ‘അവന് ജീവൻ നൽകും’ എന്നു നൽകുക, അല്ലെങ്കിൽ അപേക്ഷിക്കുന്ന വ്യക്തിയെയാണ് കർത്താവായി കാണുക.
  rationale: ഗ്രീക്ക് കർത്താവിനെ വ്യക്തമാക്കുന്നില്ലെങ്കിലും പ്രാർഥനയുടെ സന്ദർഭം ദൈവത്തെയാണ് ജീവദാതാവായി ശക്തമായി സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ തെറ്റായ കർത്താവിലേക്കുള്ള സ്വാഭാവിക വായന ഒഴിവാക്കാൻ ദൈവം എന്നു വ്യക്തമാക്കി.
- issue: അവസാന വാക്യം അപേക്ഷയ്ക്കുള്ള വിലക്കാണോ
  choice: ‘അപേക്ഷിക്കണമെന്ന് ഞാൻ പറയുന്നില്ല’ എന്ന മിതമായ രൂപം നിലനിർത്തി.
  alternative: ‘അപേക്ഷിക്കരുത്’ എന്ന നേരിട്ടുള്ള വിലക്കായി പരിഭാഷപ്പെടുത്തുക.
  rationale: οὐ ... λέγω ἵνα എന്ന ഗ്രീക്ക് രൂപം നേരിട്ടുള്ള നിരോധനത്തേക്കാൾ സൂക്ഷ്മമാണ്; എഴുത്തുകാരൻ അങ്ങനെ അപേക്ഷിക്കാൻ നിർദേശിക്കുന്നില്ല എന്നാണ് പറയുന്നത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അപേക്ഷിക്കുക’, ‘ജീവൻ’, ‘മരണത്തിലേക്കു നയിക്കുക’ തുടങ്ങിയ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും മൂലപാഠത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നതുമാണ്. ദുഷ്കരമായ ഏകവചന–ബഹുവചന ഘടന ഡാഷ് ഉപയോഗിച്ച് ദൃശ്യമായി സൂക്ഷിച്ചിരിക്കുന്നു.
