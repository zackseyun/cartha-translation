revisions:
- from: ദൈവപുത്രൻ വന്നിരിക്കുന്നുവെന്നും സത്യനായവനെ അറിയേണ്ടതിന് അവൻ നമുക്ക് വിവേകം നൽകിയിരിക്കുന്നുവെന്നും നാം അറിയുന്നു. നാം സത്യനായവനിൽ, അവന്റെ പുത്രനായ യേശു മശീഹയിൽ, ആയിരിക്കുന്നു. ഇവനാണ്[a] സത്യദൈവവും നിത്യജീവനും.
  to: ദൈവപുത്രൻ വന്നിരിക്കുന്നു എന്നും സത്യമായവനെ അറിയേണ്ടതിന് അവൻ നമുക്കു വിവേകം നൽകിയിരിക്കുന്നു എന്നും നാം അറിയുന്നു. നാം സത്യമായവനിൽ, അവന്റെ പുത്രനായ യേശു മശീഹയിൽ, ആയിരിക്കുന്നു. ഇവനാണ്[a] സത്യദൈവവും നിത്യജീവനും.
