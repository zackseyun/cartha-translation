id: 1JN.5.20
reference: 1 John 5:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἴδαμεν δὲ ὅτι ὁ υἱὸς τοῦ θεοῦ ἥκει, καὶ δέδωκεν ἡμῖν διάνοιαν ἵνα ⸀γινώσκωμεν τὸν ἀληθινόν· καὶ ἐσμὲν ἐν τῷ ἀληθινῷ, ἐν τῷ υἱῷ αὐτοῦ Ἰησοῦ Χριστῷ. οὗτός ἐστιν ὁ ἀληθινὸς θεὸς καὶ ζωὴ αἰώνιος.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/020.yaml
  text: And we know that the Son of God has come and has given us understanding so that we may know the True One; and we are in the True One[a], in his Son Jesus the Messiah. This one is the true God and eternal life.
translation:
  language: ml
  text: ദൈവപുത്രൻ വന്നിരിക്കുന്നു എന്നും സത്യമായവനെ അറിയേണ്ടതിന് അവൻ നമുക്കു വിവേകം നൽകിയിരിക്കുന്നു എന്നും നാം അറിയുന്നു. നാം സത്യമായവനിൽ, അവന്റെ പുത്രനായ യേശു മശീഹയിൽ, ആയിരിക്കുന്നു. ഇവനാണ്[a] സത്യദൈവവും നിത്യജീവനും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഇവൻ’ എന്നത് പ്രത്യേകിച്ച് യേശു മശീഹയെ സൂചിപ്പിക്കാം. എന്നാൽ മുൻവാക്യത്തിലെ ‘സത്യമായവനെ,’ അതായത് പിതാവിനെ, സൂചിപ്പിക്കുന്നതായും ചിലർ മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: οἴδαμεν
  choice: നാം അറിയുന്നു
  rationale: οἶδα എന്ന പൂർണരൂപം ഇവിടെ വർത്തമാനകാലത്തിലുള്ള ഉറച്ച അറിവിനെ സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവികമായ മലയാള വർത്തമാനകാലം ഉപയോഗിച്ചു.
- source_word: ἥκει
  choice: വന്നിരിക്കുന്നു
  rationale: വന്നുകഴിഞ്ഞതും ആ വരവിന്റെ ഫലം ഇപ്പോഴും നിലനിൽക്കുന്നതുമായ അർഥം മലയാളത്തിലെ ‘വന്നിരിക്കുന്നു’ വ്യക്തമാക്കുന്നു.
- source_word: δέδωκεν
  choice: നൽകിയിരിക്കുന്നു
  rationale: നൽകിയ ദാനത്തിന്റെ നിലനിൽക്കുന്ന ഫലം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പൂർണകാലഭാവം സംരക്ഷിക്കുന്നു.
- source_word: διάνοιαν
  choice: വിവേകം
  rationale: കേവലം ‘മനസ്സ്’ എന്നതിലുപരി സത്യം ഗ്രഹിക്കാനുള്ള ശേഷിയാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്; ‘വിവേകം’ അതിനെ സംക്ഷിപ്തമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: ἵνα γινώσκωμεν
  choice: അറിയേണ്ടതിന്
  rationale: ἵνα സഹിതമുള്ള വർത്തമാനകാല വിധിലിംഗത്തിന്റെ ഉദ്ദേശ്യാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; അറിവിന്റെ രീതിയോ ഘട്ടമോ അനാവശ്യമായി വിശദീകരിക്കുന്നില്ല.
- source_word: τὸν ἀληθινόν / τῷ ἀληθινῷ
  choice: സത്യനായവനെ / സത്യനായവനിൽ
  rationale: നാമമായി പ്രയോഗിച്ചിരിക്കുന്ന വിശേഷണത്തെയും രണ്ടു പ്രയോഗങ്ങളിലെ യോഹന്നാനീയ ആവർത്തനത്തെയും സംരക്ഷിക്കുന്നു.
- source_word: ἐσμὲν ἐν
  choice: ആയിരിക്കുന്നു
  rationale: ‘നിലനിൽക്കുന്നു’ എന്ന μένω-യുടെ ആശയം ഇറക്കുമതി ചെയ്യാതെ, ‘ആയിരിക്കുക’ എന്ന ലളിതമായ ബന്ധഭാഷ നിലനിർത്തുന്നു.
- source_word: Ἰησοῦ Χριστῷ
  choice: യേശു മശീഹയിൽ
  rationale: Χριστός ഇവിടെ വ്യക്തിയുടെ കുടുംബപ്പേരെന്നതിലുപരി അഭിഷിക്തനായവൻ എന്ന പദവിയെ വഹിക്കുന്നതിനാൽ മലയാളത്തിൽ പതിവായ ‘മശീഹ’ ഉപയോഗിച്ചു.
- source_word: οὗτός
  choice: ഇവനാണ്
  rationale: സമീപസ്ഥനായ വ്യക്തിയിലേക്കു വിരൽചൂണ്ടുന്ന ഗ്രീക്ക് സർവനാമത്തിന്റെ ശക്തി സംരക്ഷിക്കുന്നു; അതിന്റെ മുൻപദത്തെക്കുറിച്ചുള്ള അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ὁ ἀληθινὸς θεὸς
  choice: സത്യദൈവം
  rationale: ഗ്രീക്ക് പദസമുച്ചയത്തിന്റെ നേരിട്ടും മലയാളത്തിൽ സ്വാഭാവികവുമായ രൂപം.
- source_word: ζωὴ αἰώνιος
  choice: നിത്യജീവൻ
  rationale: യോഹന്നാനീയ സാഹിത്യത്തിലെ കാലദൈർഘ്യവും ജീവന്റെ ഗുണസ്വഭാവവും ഉൾക്കൊള്ളുന്ന സ്ഥാപിതമായ മലയാള പ്രയോഗം.
theological_decisions:
- issue: οὗτός ἐστιν ὁ ἀληθινὸς θεὸς καὶ ζωὴ αἰώνιος എന്ന വാക്യത്തിലെ οὗτός ആരെ സൂചിപ്പിക്കുന്നു
  choice: പ്രധാനപാഠത്തിൽ ‘ഇവനാണ്’ എന്നു നൽകി, ഏറ്റവും അടുത്ത വ്യക്തിപരമായ മുൻപദമായ യേശു മശീഹയെ സ്വാഭാവിക സാധ്യതയായി നിലനിർത്തി.
  alternative: ‘ഇവൻ’ മുമ്പ് പറഞ്ഞ ‘സത്യനായവനെ’, അതായത് പിതാവിനെ, സൂചിപ്പിക്കുന്നതായി ചിലർ ഗ്രഹിക്കുന്നു.
  rationale: ഗ്രീക്ക് വാക്യഘടനയിൽ ഏറ്റവും അടുത്ത വ്യക്തിപരമായ മുൻപദം ‘അവന്റെ പുത്രനായ യേശു മശീഹ’ ആണെങ്കിലും, സർവനാമത്തിന്റെ ബന്ധം ചരിത്രപരമായി തർക്കിക്കപ്പെട്ടതാണ്. അതിനാൽ പ്രധാനപാഠം οὗτός എന്നതിന്റെ വിരൽചൂണ്ടൽ നിലനിർത്തുകയും അടിക്കുറിപ്പ് മറ്റൊരു സാധ്യത വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘സത്യനായവൻ’ എന്ന ആവർത്തനവും ‘ആയിരിക്കുന്നു’ എന്ന ബന്ധഭാഷയും യോഹന്നാന്റെ പദപ്രയോഗം വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ നിലനിർത്തി. അവസാനവാക്യത്തിലെ ദൈവശാസ്ത്രപരമായ അനിശ്ചിതത്വം മുഖ്യപാഠത്തിൽ തീർപ്പാക്കാതെ അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
