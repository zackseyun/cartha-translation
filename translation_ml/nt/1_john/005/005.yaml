id: 1JN.5.5
reference: 1 John 5:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τίς ⸂δέ ἐστιν⸃ ὁ νικῶν τὸν κόσμον εἰ μὴ ὁ πιστεύων ὅτι Ἰησοῦς ἐστιν ὁ υἱὸς τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/005.yaml
  text: And who is the one who overcomes the world except the one who believes that Jesus is the Son of God?[a]
translation:
  language: ml
  text: ലോകത്തെ ജയിക്കുന്നവൻ ആരാണ്? യേശു ദൈവപുത്രനാണെന്ന് വിശ്വസിക്കുന്നവനല്ലാതെ മറ്റാരുമല്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘ജയിക്കുന്നവൻ … വിശ്വസിക്കുന്നവൻ.’ ഗ്രീക്കിൽ പുല്ലിംഗ ഏകവചന കൃദന്തങ്ങൾ പ്രതിനിധാനപരമായ അർഥത്തിലാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς δέ ἐστιν
  choice: ആരാണ്?
  rationale: δέ മുൻവാക്യത്തോടു ലഘുവായി ബന്ധിപ്പിക്കുന്നു. മലയാളത്തിൽ പ്രത്യേകമായി ‘എന്നാൽ/പിന്നെ’ ചേർക്കാതെ അലങ്കാരപ്രശ്നത്തിന്റെ സ്വാഭാവിക ഒഴുക്ക് നിലനിർത്തുന്നു.
- source_word: ὁ νικῶν
  choice: ജയിക്കുന്നവൻ
  rationale: നാമവാചകമായി പ്രവർത്തിക്കുന്ന വർത്തമാനകാല കൃദന്തത്തിന്റെ സ്വഭാവപരമായ അർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു; മലയാളത്തിലെ പുല്ലിംഗ ഏകവചനരൂപം ഇവിടെ പ്രതിനിധാനപരമാണ്.
- source_word: τὸν κόσμον
  choice: ലോകത്തെ
  rationale: യോഹന്നാന്റെ പ്രയോഗത്തിൽ ദൈവത്തോടു വിരോധമുള്ള ലോകക്രമത്തെ സൂചിപ്പിക്കാമെങ്കിലും, മൂലപാഠത്തിലെ ലളിതമായ ‘ലോകം’ എന്ന പദത്തെ വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കുന്നില്ല.
- source_word: εἰ μὴ
  choice: അല്ലാതെ മറ്റാരുമല്ല
  rationale: അലങ്കാരപ്രശ്നത്തിലെ ഒഴിവാക്കൽ അർഥവും ഏകാന്തതയും മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὁ πιστεύων
  choice: വിശ്വസിക്കുന്നവൻ
  rationale: നാമവാചക കൃദന്തത്തിന്റെ ക്രിയാത്മകവും സ്വഭാവപരവുമായ അർഥം നിലനിർത്തുന്നു.
- source_word: ὅτι
  choice: എന്ന്
  rationale: വിശ്വാസത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന ഘടകമായി സ്വാഭാവിക മലയാളം.
- source_word: Ἰησοῦς
  choice: യേശു
  rationale: മലയാളത്തിലെ സ്ഥാപിതമായ വ്യക്തിനാമരൂപം.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: ദൈവപുത്രൻ
  rationale: ക്രിസ്തുവിനെക്കുറിച്ചുള്ള നിർദിഷ്ട പദവിയുടെ ഭാരവും അർഥവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ὁ νικῶν, ὁ πιστεύων എന്നീ പുല്ലിംഗ ഏകവചന കൃദന്തങ്ങളുടെ അവതരണം
  choice: ജയിക്കുന്നവൻ / വിശ്വസിക്കുന്നവൻ
  alternative: ജയിക്കുന്ന വ്യക്തി / വിശ്വസിക്കുന്ന വ്യക്തി
  rationale: ഗ്രീക്ക് രൂപങ്ങൾ വ്യാകരണപരമായി പുല്ലിംഗ ഏകവചനമാണെങ്കിലും പ്രതിനിധാനപരമായി എല്ലാവരെയും ഉൾക്കൊള്ളുന്നു. മലയാളത്തിലെ ‘-വൻ’ രൂപം മൂലത്തിന്റെ ഏകവചന-വ്യക്തിപരമായ ഘടന നിലനിർത്തുന്നു; അതിന്റെ പ്രതിനിധാനപരമായ പ്രയോഗം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: ὁ υἱὸς τοῦ θεοῦ എന്ന ക്രിസ്തുശാസ്ത്രപരമായ ഏറ്റുപറച്ചിൽ
  choice: ദൈവപുത്രൻ
  alternative: ദൈവത്തിന്റെ പുത്രൻ
  rationale: യേശുവിന്റെ വ്യക്തിത്വത്തെക്കുറിച്ചുള്ള പദവി വികസിപ്പിക്കാതെയും ചുരുക്കാതെയും മലയാളത്തിലെ സ്ഥാപിതമായ രൂപത്തിൽ നേരിട്ട് നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ അലങ്കാരപ്രശ്നരൂപം. ആദ്യത്തെ δέ പ്രത്യേകം വിവർത്തനം ചെയ്യാതെ സന്ദർഭബന്ധം സ്വാഭാവികമായ വാക്യൊഴുക്കിൽ പ്രകടമാക്കി.
