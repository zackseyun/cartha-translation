id: 1JN.5.9
reference: 1 John 5:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ τὴν μαρτυρίαν τῶν ἀνθρώπων λαμβάνομεν, ἡ μαρτυρία τοῦ θεοῦ μείζων ἐστίν, ὅτι αὕτη ἐστὶν ἡ μαρτυρία τοῦ θεοῦ ⸀ὅτι μεμαρτύρηκεν περὶ τοῦ υἱοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/009.yaml
  text: 'If we receive the testimony of men[a], the testimony of God is greater[c][b], because this is the testimony of God: that he has testified concerning his Son.'
translation:
  language: ml
  text: 'മനുഷ്യരുടെ സാക്ഷ്യം നാം സ്വീകരിക്കുന്നുവെങ്കിൽ, ദൈവത്തിന്റെ സാക്ഷ്യം അതിലും വലുതാണ്; കാരണം, ദൈവത്തിന്റെ സാക്ഷ്യം ഇതാണ്: അവൻ തന്റെ പുത്രനെക്കുറിച്ച് സാക്ഷ്യം നൽകിയിരിക്കുന്നു.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μαρτυρίαν / μαρτυρία
  choice: സാക്ഷ്യം
  rationale: നിയമപരവും തെളിവുസംബന്ധവുമായ അർഥം സ്വാഭാവികമായി നൽകുകയും പദത്തിന്റെ ആവർത്തനം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἀνθρώπων
  choice: മനുഷ്യരുടെ
  rationale: ഇവിടെ പുരുഷന്മാരെ മാത്രം അല്ല, ദൈവത്തിന്റെ സാക്ഷ്യത്തോട് വിരുദ്ധമായി മനുഷ്യരുടെ സാക്ഷ്യത്തെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
- source_word: λαμβάνομεν
  choice: നാം സ്വീകരിക്കുന്നുവെങ്കിൽ
  rationale: λαμβάνω എന്നതിന്റെ ‘സ്വീകരിക്കുക/അംഗീകരിക്കുക’ എന്ന അർഥപരിധി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: μείζων
  choice: അതിലും വലുതാണ്
  rationale: മനുഷ്യരുടെ സാക്ഷ്യത്തെക്കാൾ ദൈവത്തിന്റെ സാക്ഷ്യം ശ്രേഷ്ഠവും കൂടുതൽ പ്രാബല്യമുള്ളതുമാണെന്ന താരതമ്യം നേരിട്ട് പ്രകടമാക്കുന്നു.
- source_word: αὕτη ἐστὶν ἡ μαρτυρία τοῦ θεοῦ
  choice: ഇതാണ് ദൈവത്തിന്റെ സാക്ഷ്യം
  rationale: ഗ്രീക്കിലെ ഊന്നലും ‘സാക്ഷ്യം’ എന്ന പദത്തിന്റെ ആവർത്തനവും സംരക്ഷിക്കുന്നു.
- source_word: μεμαρτύρηκεν
  choice: സാക്ഷ്യം നൽകിയിരിക്കുന്നു
  rationale: പൂർണ്ണകാലത്തിന്റെ പൂർത്തിയായ പ്രവൃത്തിയും ഇപ്പോഴും നിലനിൽക്കുന്ന പ്രസക്തിയും മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: περὶ τοῦ υἱοῦ αὐτοῦ
  choice: തന്റെ പുത്രനെക്കുറിച്ച്
  rationale: περί + genitive എന്നതിന്റെ ‘സംബന്ധിച്ച്/കുറിച്ച്’ എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു; αὐτοῦ-ന്റെ പ്രത്യാവർത്തക ബന്ധം മലയാളത്തിൽ വ്യക്തമാണ്.
theological_decisions:
- issue: ἀνθρώπων എന്നതിന്റെ പൊതുവായ മാനുഷിക സൂചന
  choice: മനുഷ്യരുടെ
  alternative: പുരുഷന്മാരുടെ
  rationale: സന്ദർഭത്തിലെ വൈരുധ്യം മനുഷ്യസാക്ഷ്യവും ദൈവസാക്ഷ്യവും തമ്മിലാണ്; പുരുഷന്മാരെ മാത്രം സൂചിപ്പിക്കുന്ന വിവർത്തനം ഗ്രീക്കിലെ പൊതുവായ അർഥം മലയാളത്തിൽ അനാവശ്യമായി ചുരുക്കും.
- issue: രണ്ടാമത്തെ ὅτι-യുടെ വാക്യധർമ്മം
  choice: 'ഉള്ളടക്കവാക്യം: ‘അവൻ ... സാക്ഷ്യം നൽകിയിരിക്കുന്നു എന്നതാണ്’'
  alternative: 'കാരണവാക്യം: ‘അവൻ തന്റെ പുത്രനെക്കുറിച്ച് സാക്ഷ്യം നൽകിയിരിക്കുന്നതിനാൽ’'
  rationale: ഈ ὅτι ദൈവത്തിന്റെ സാക്ഷ്യത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നതായി വായിക്കുന്നതാണ് വാക്യഘടനയിൽ കൂടുതൽ സ്വാഭാവികം; കാരണാർഥവും വ്യാകരണപരമായി സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘സാക്ഷ്യം’ എന്ന മുഖ്യപദത്തിന്റെ ആവർത്തനം മൂലപാഠത്തിന്റെ വാദശൈലി നിലനിർത്താൻ ഉദ്ദേശപൂർവം സംരക്ഷിച്ചു.
