    text: 'കൂടുതൽ ഔപചാരികമായി: “ലോകം മുഴുവൻ ദുഷ്ടനിൽ കിടക്കുന്നു.” ഇവിടെ “ദുഷ്ടൻ” എന്നത് “തിന്മ” എന്നും ഗ്രഹിക്കാവുന്നതാണ്; എങ്കിലും യോഹന്നാന്റെ പ്രയോഗത്തിൽ വ്യക്തിപരമായ അർഥത്തിനാണ് കൂടുതൽ സാധ്യത.'
