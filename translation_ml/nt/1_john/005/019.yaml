  text: We know that we are from God[b][a], and the whole world lies in the evil one.
translation:
  language: ml
  text: നാം ദൈവത്തിൽനിന്നുള്ളവരാണെന്നും ലോകം മുഴുവൻ ദുഷ്ടന്റെ അധീനതയിൽ കിടക്കുന്നു[a] എന്നും നമുക്കറിയാം.
  philosophy: optimal-equivalence
  footnotes:
