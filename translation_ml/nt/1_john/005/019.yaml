lexical_decisions:
- source_word: οἴδαμεν
  choice: നമുക്കറിയാം
  rationale: സ്ഥിരമായ അറിവും ഉറപ്പും സൂചിപ്പിക്കുന്ന οἴδαμεν എന്ന പദത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം; ലേഖനത്തിലെ ഉറപ്പിന്റെ ഭാവം നിലനിർത്തുന്നു.
- source_word: ἐκ τοῦ θεοῦ
  choice: ദൈവത്തിൽനിന്നുള്ളവർ
  rationale: ഉത്ഭവമോ ബന്ധമോ സൂചിപ്പിക്കുന്ന ἐκ എന്നതിനെ കൃത്യമായി പ്രതിഫലിപ്പിക്കുന്നു; ഗ്രീക്കിൽ ഈ വാക്യഭാഗത്ത് നേരിട്ട് ഇല്ലാത്ത ‘ദൈവത്തിൽനിന്നു ജനിച്ചവർ’ എന്ന കൂടുതൽ സവിശേഷ ആശയം ചേർക്കുന്നില്ല.
- source_word: ὁ κόσμος ὅλος
  choice: ലോകം മുഴുവൻ
  rationale: κόσμος എന്നതിന്റെ വ്യാപ്തിയെ ὅλος ഊന്നിപ്പറയുന്നു; ‘ലോകം മുഴുവൻ’ സ്വാഭാവികവും സമഗ്രത വ്യക്തമാക്കുന്നതുമായ മലയാളമാണ്.
- source_word: ἐν τῷ πονηρῷ
  choice: ദുഷ്ടന്റെ അധീനതയിൽ
  rationale: യോഹന്നാന്റെ പ്രയോഗത്തിൽ τῷ πονηρῷ ഒരു വ്യക്തിയായ ‘ദുഷ്ടനെ’ സൂചിപ്പിക്കാനാണ് കൂടുതൽ സാധ്യത. ‘അധീനതയിൽ’ എന്നത് മലയാളത്തിൽ അർഥം വ്യക്തമാക്കുന്നു; കൂടുതൽ ഔപചാരികമായ രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: κεῖται
  choice: കിടക്കുന്നു
  rationale: ‘കിടക്കുക/സ്ഥിതിചെയ്യുക’ എന്ന രൂപകം നിലനിർത്തുന്നു; ‘അധീനതയിൽ’ എന്ന പ്രയോഗത്തോടൊപ്പം തുടർന്നുനിൽക്കുന്ന അവസ്ഥ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: τῷ πονηρῷ അമൂർത്തമായ തിന്മയെയോ വ്യക്തിയായ ദുഷ്ടനെയോ സൂചിപ്പിക്കുന്നുവോ
  choice: 'വ്യക്തിപരം: ‘ദുഷ്ടൻ’'
  alternative: 'അമൂർത്തം: ‘തിന്മ’'
  rationale: 1 യോഹന്നാനിലെ സമാന പ്രയോഗങ്ങളും നിർദിഷ്ട ആർട്ടിക്കിളോടുകൂടിയ വിശേഷണത്തിന്റെ നാമവൽക്കരിച്ച രൂപവും വ്യക്തിപരമായ സൂചനയ്ക്ക് മുൻഗണന നൽകുന്നു. എങ്കിലും അമൂർത്തമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി അവ്യക്തത പൂർണമായി ഇല്ലാതാക്കുന്നില്ല.
- issue: ἐν എന്നതിനെ സ്ഥലസൂചനയായി അതേപടി നിലനിർത്തണമോ അധീനതയുടെ ആശയം വ്യക്തമാക്കണമോ
  choice: ‘അധീനതയിൽ’ എന്ന് അർഥം വ്യക്തമാക്കി പരിഭാഷപ്പെടുത്തി
  alternative: ‘ദുഷ്ടനിൽ കിടക്കുന്നു’ എന്ന ഔപചാരിക രൂപം
  rationale: നേരിട്ടുള്ള രൂപം ആധുനിക മലയാളത്തിൽ അസ്വാഭാവികവും അർഥം മങ്ങിയതുമാണ്. ‘അധീനതയിൽ’ സന്ദർഭത്തിലെ നിയന്ത്രണ/സ്വാധീനഭാവം സ്വാഭാവികമായി നൽകുന്നു; ഔപചാരിക രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള മലയാളം. ഗ്രീക്കിലെ ഉറപ്പും സമഗ്രതയും രൂപകവും നിലനിർത്തിക്കൊണ്ട് അസ്വാഭാവികമായ പദാനുപദപ്രയോഗം പ്രധാനവാചകത്തിൽ ഒഴിവാക്കി.
