  yaml_path: translation/nt/1_john/005/008.yaml
  text: the Spirit and the water and the blood[a], and the three are for the one.
translation:
  language: ml
  text: ആത്മാവും വെള്ളവും രക്തവും; ഈ മൂന്നും ഒന്നിലേക്കു ചേരുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘ഈ മൂന്നും ഒന്നിലേക്കാണ്.’ സന്ദർഭത്തിൽ, ഇവയുടെ സാക്ഷ്യം ഒരേ കാര്യത്തിൽ യോജിക്കുന്നു എന്നായിരിക്കാം ഈ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ πνεῦμα
  choice: ആത്മാവ്
  rationale: സമീപസന്ദർഭത്തിൽ സാക്ഷ്യം വഹിക്കുന്ന പരിശുദ്ധാത്മാവിനെയാണ് ഏറ്റവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ‘ആത്മാവ്’ എന്ന രൂപം വ്യക്തമായ ദൈവിക സൂചന നിലനിർത്തുന്നു.
- source_word: τὸ ὕδωρ
  choice: വെള്ളം
  rationale: ഗ്രീക്കിലെ മൂർത്തമായ ദൃശ്യഭാഷ വ്യാഖ്യാനിച്ചു വികസിപ്പിക്കാതെ അതേപടി നിലനിർത്തുന്നു.
- source_word: τὸ αἷμα
  choice: രക്തം
  rationale: കൃത്യമായ സൂചന ഈ വാക്യത്തിൽ വിശദീകരിക്കാത്തതിനാൽ മൂർത്തനാമം ഔപചാരികമായി സംരക്ഷിക്കുന്നു.
- source_word: οἱ τρεῖς
  choice: ഈ മൂന്നും
  rationale: തൊട്ടുമുമ്പ് പറഞ്ഞ ആത്മാവ്, വെള്ളം, രക്തം എന്നിവയിലേക്കുള്ള കൂട്ടായ പരാമർശം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: εἰς τὸ ἕν εἰσιν
  choice: ഒന്നിലേക്കു ചേരുന്നു
  rationale: εἰς എന്ന ദിശാസൂചനയും സാക്ഷ്യങ്ങൾ ഒരേ ബിന്ദുവിൽ സംഗമിക്കുന്നു എന്ന സന്ദർഭാർഥവും ഒരുമിച്ച് നിലനിർത്തുന്നു; ‘ഒന്നാണ്’ എന്നു പറഞ്ഞ് സത്താപരമായ ഏകത നിർബന്ധിക്കുന്നതും ‘യോജിക്കുന്നു’ എന്നു പറഞ്ഞ് രൂപകം പൂർണമായി വിശദീകരിക്കുന്നതും ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: εἰς τὸ ἕν εἰσιν എന്നത് സത്താപരമായ ഏകതയെയോ സാക്ഷ്യത്തിലെ യോജിപ്പിനെയോ സൂചിപ്പിക്കുന്നുവോ
  choice: ഈ മൂന്നും ഒന്നിലേക്കു ചേരുന്നു
  alternative: ഈ മൂന്നും ഒന്നാണ്; ഈ മൂന്നിന്റെയും സാക്ഷ്യം യോജിക്കുന്നു
  rationale: സന്ദർഭം സാക്ഷ്യത്തെക്കുറിച്ചായതിനാൽ ഒരേ കാര്യത്തിലേക്കുള്ള സംഗമം പ്രധാനമാണ്. എന്നാൽ ഗ്രീക്കിലെ ദിശാസൂചക പ്രയോഗം നേരിട്ട് ‘യോജിക്കുന്നു’ എന്നു മാത്രം വ്യാഖ്യാനിക്കാതെ മുഖ്യവാചകത്തിൽ നിലനിർത്തി, അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. വെള്ളത്തിന്റെയും രക്തത്തിന്റെയും കൃത്യമായ പ്രതീകാർഥം മുഖ്യവാചകത്തിൽ വിശദീകരിച്ചിട്ടില്ല. അവസാന പ്രയോഗത്തിലെ യഥാർഥ രൂപകവും സന്ദർഭപരമായ സാക്ഷ്യയോജിപ്പും തമ്മിലുള്ള സംഘർഷം സംരക്ഷിച്ചിട്ടുണ്ട്.
