id: 1JN.5.18
reference: 1 John 5:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οἴδαμεν ὅτι πᾶς ὁ γεγεννημένος ἐκ τοῦ θεοῦ οὐχ ἁμαρτάνει, ἀλλ’ ὁ γεννηθεὶς ἐκ τοῦ θεοῦ τηρεῖ ⸀αὐτόν, καὶ ὁ πονηρὸς οὐχ ἅπτεται αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/018.yaml
  text: We know that everyone who has been born of God does not keep sinning[a]; rather, the one who was born of God keeps him[c][b], and the evil one does not touch him.
translation:
  language: ml
  text: ദൈവത്തിൽനിന്ന് ജനിച്ചവർ ആരും പാപം ചെയ്തുകൊണ്ടേയിരിക്കുന്നില്ല[a] എന്നു നമുക്കറിയാം. മറിച്ച്, ദൈവത്തിൽനിന്ന് ജനിച്ചവൻ അവനെ കാത്തുസൂക്ഷിക്കുന്നു[b]; ദുഷ്ടൻ അവനെ തൊടുന്നില്ല[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടത്തെ ഗ്രീക്ക് വർത്തമാനകാലം തുടരുന്നതോ പതിവായതോ ആയ പാപപ്രവൃത്തിയെ സൂചിപ്പിക്കാനിടയുണ്ട്; വിശ്വാസികൾ ഒരിക്കലും ഒരു പാപവും ചെയ്യുന്നില്ലെന്നല്ല (1 യോഹന്നാൻ 1:8–10; 2:1 കാണുക).
    reason: cross_reference
  - marker: b
    text: ‘അവൻ സ്വയം കാത്തുസൂക്ഷിക്കുന്നു’ എന്നും മനസ്സിലാക്കാം. എന്നാൽ ‘ദൈവത്തിൽനിന്ന് ജനിച്ചവൻ’ എന്നത് യേശുവിനെയും ‘അവനെ’ എന്നത് വിശ്വാസിയെയും സൂചിപ്പിക്കുന്നതായി പലരും വ്യാഖ്യാനിക്കുന്നു.
    reason: alternative_reading
  - marker: c
    text: ‘തൊടുക’ എന്നതിന് ഉപദ്രവിക്കാനായി പിടിമുറുക്കുക എന്ന ഭാവവും ഇവിടെ ഉണ്ടായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν
  choice: നമുക്കറിയാം
  rationale: οἶδα രൂപത്തിൽ പൂർണകാലമാണെങ്കിലും ഇവിടെ വർത്തമാനാവസ്ഥയെ സൂചിപ്പിക്കുന്നു. അതിനാൽ സ്വാഭാവികമായ മലയാളപ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: πᾶς ὁ γεγεννημένος ἐκ τοῦ θεοῦ
  choice: ദൈവത്തിൽനിന്നു ജനിച്ചിട്ടുള്ള ആരും
  rationale: πᾶς ὁ + കൃദന്തരൂപത്തിന്റെ ഓരോ വ്യക്തിയെയും ഉൾക്കൊള്ളുന്ന അർഥവും, γεγεννημένος എന്ന പൂർണകാല നിഷ്ക്രിയ കൃദന്തരൂപത്തിന്റെ നിലനിൽക്കുന്ന ഫലവും ഈ പ്രയോഗം പ്രകടമാക്കുന്നു.
- source_word: οὐχ ἁμαρτάνει
  choice: പാപം ചെയ്തുകൊണ്ടേയിരിക്കുന്നില്ല
  rationale: വർത്തമാനകാലരൂപത്തിന്റെ തുടരുന്ന അഥവാ പതിവായ പ്രവൃത്തിയെ സൂചിപ്പിക്കാവുന്ന അപൂർണദൃഷ്ടി വ്യക്തമാക്കുന്നു; വിശ്വാസി ഒരിക്കലും ഒരു പാപവും ചെയ്യുന്നില്ലെന്ന് വാചകത്തിൽ അധികമായി ചേർക്കുന്നില്ല.
- source_word: ἀλλ’
  choice: മറിച്ച്
  rationale: മുൻവാക്യത്തോടുള്ള ശക്തമായ വൈരുധ്യം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ὁ γεννηθεὶς ἐκ τοῦ θεοῦ
  choice: ദൈവത്തിൽനിന്നു ജനിച്ചവൻ
  rationale: മൂലപാഠത്തിലെ നിർവചനരഹിതമായ പ്രയോഗം നിലനിർത്തുന്നു. ഇത് വിശ്വാസിയെയോ യേശുവിനെയോ സൂചിപ്പിക്കുന്നതാണെന്ന വ്യാഖ്യാനസാധ്യത മുഖ്യപാഠം തീരുമാനിക്കുന്നില്ല.
- source_word: τηρεῖ αὐτόν
  choice: അവനെ കാത്തുസൂക്ഷിക്കുന്നു
  rationale: τηρέω എന്നതിന് ഇവിടെ കാക്കുക, സംരക്ഷിക്കുക എന്ന സന്ദർഭോചിത അർഥമുണ്ട്. αὐτόν എന്ന സർവനാമത്തെ ‘അവനെ’ എന്നു നൽകുന്നത് മൂലപാഠത്തിന്റെ വ്യാകരണരൂപം നിലനിർത്തുന്നു.
- source_word: ὁ πονηρὸς
  choice: ദുഷ്ടൻ
  rationale: നിർദേശകത്തോടുകൂടിയ യോഹന്നാനീയ പ്രയോഗം അമൂർത്തമായ തിന്മയേക്കാൾ വ്യക്തിപരമായ ദുഷ്ടശക്തിയെ, സ്വാഭാവികമായി സാത്താനെ, സൂചിപ്പിക്കുന്നു.
- source_word: οὐχ ἅπτεται αὐτοῦ
  choice: അവനെ തൊടുന്നില്ല
  rationale: ἅπτομαι എന്നതിന്റെ അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഉപദ്രവിക്കാനായി പിടിമുറുക്കുക എന്ന ശക്തമായ ഭാവം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: οὐχ ἁμαρτάνει എന്ന വർത്തമാനകാല പ്രസ്താവനയുടെ അർഥം
  choice: തുടർന്നോ പതിവായോ പാപം ചെയ്യുന്നതിനെ നിഷേധിക്കുന്ന വിധത്തിൽ ‘പാപം ചെയ്തുകൊണ്ടേയിരിക്കുന്നില്ല’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘പാപം ചെയ്യുന്നില്ല’—വിശ്വാസി ഒരു പാപവും ചെയ്യുന്നില്ലെന്ന സമ്പൂർണ അർഥത്തിൽ വായിക്കാം.
  rationale: ഗ്രീക്ക് വർത്തമാനകാലത്തിന്റെ അപൂർണദൃഷ്ടിക്കും 1 യോഹന്നാൻ 1:8–10; 2:1 എന്നിവിടങ്ങളിൽ വിശ്വാസികളുടെ പാപം അംഗീകരിക്കുന്നതിനും ഈ പരിഭാഷ യോജിക്കുന്നു; എന്നിരുന്നാലും വാക്യത്തിന്റെ ധാർമിക ശക്തി ഇല്ലാതാക്കുന്നില്ല.
- issue: ὁ γεννηθεὶς ἐκ τοῦ θεοῦ എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: മുഖ്യപാഠത്തിൽ ‘ദൈവത്തിൽനിന്നു ജനിച്ചവൻ’ എന്ന നിർവചനരഹിത രൂപം നിലനിർത്തി.
  alternative: ഇത് ദൈവത്തിൽനിന്നു ജനിച്ച വിശ്വാസിയെ സൂചിപ്പിക്കാം; അല്ലെങ്കിൽ ദൈവപുത്രനായ യേശുവിനെ സൂചിപ്പിക്കാം.
  rationale: ഗ്രീക്ക് പ്രയോഗം വ്യാകരണപരമായി ഇരുവായനകൾക്കും ഇടനൽകുന്നു. ഏതെങ്കിലും ഒരു ദൈവശാസ്ത്രവായന മുഖ്യപാഠത്തിൽ നിർബന്ധിച്ചിട്ടില്ല.
- issue: τηρεῖ αὐτόν എന്നതിലെ കർത്താവും കർമവും
  choice: ‘അവനെ കാത്തുസൂക്ഷിക്കുന്നു’ എന്നു മൂലപാഠത്തിലെ അനാത്മവാചക സർവനാമരൂപം നിലനിർത്തി.
  alternative: കർത്താവ് വിശ്വാസിയാണെന്നു കണ്ടാൽ ‘തന്നെത്തന്നെ കാത്തുസൂക്ഷിക്കുന്നു’ എന്നു മനസ്സിലാക്കാം; കർത്താവ് യേശുവാണെങ്കിൽ അവൻ വിശ്വാസിയെ കാത്തുസൂക്ഷിക്കുന്നു.
  rationale: αὐτόν സ്വതവേ ആത്മവാചക സർവനാമമല്ല. എങ്കിലും കർത്താവിനെ എങ്ങനെ തിരിച്ചറിയുന്നു എന്നതനുസരിച്ച് വാക്യത്തിന്റെ ബന്ധം വ്യത്യാസപ്പെടുന്നതിനാൽ രണ്ടു സാധ്യതകളും അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവമുള്ള ശൈലി. ‘ദൈവത്തിൽനിന്നു ജനിക്കുക’ എന്ന യോഹന്നാനീയ രൂപകം നിലനിർത്തി. പാപത്തെക്കുറിച്ചുള്ള പ്രസ്താവനയുടെ അപൂർണദൃഷ്ടിയും സംരക്ഷണവാക്യത്തിലെ കർത്തൃസൂചനയുടെ യഥാർഥ അനിശ്ചിതത്വവും മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പുകളിലും സൂക്ഷിച്ചു.
