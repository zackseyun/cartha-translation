revisions:
- from: ദൈവത്തിൽനിന്നു ജനിച്ചിട്ടുള്ള ആരും പാപം ചെയ്തുകൊണ്ടേയിരിക്കുന്നില്ല[a] എന്നു നമുക്കറിയാം. മറിച്ച്, ദൈവത്തിൽനിന്നു ജനിച്ചവൻ അവനെ കാത്തുസൂക്ഷിക്കുന്നു[b]; ദുഷ്ടൻ അവനെ തൊടുന്നില്ല[c].
  to: ദൈവത്തിൽനിന്ന് ജനിച്ചവർ ആരും പാപം ചെയ്തുകൊണ്ടേയിരിക്കുന്നില്ല[a] എന്നു നമുക്കറിയാം. മറിച്ച്, ദൈവത്തിൽനിന്ന് ജനിച്ചവൻ അവനെ കാത്തുസൂക്ഷിക്കുന്നു[b]; ദുഷ്ടൻ അവനെ തൊടുന്നില്ല[c].
  rationale: 'The revision makes only safe idiomatic adjustments: it clarifies the Greek distributive universal with a natural Malayalam plural-plus-ആരും construction, regularizes “നിന്നു” to “നിന്ന്,” and improves the reflexive alternative in the footnote. It retains the draft’s source-sensitive ambiguity concerning the one born of God and the pronouns, without importing a christological identification into the main text.'
