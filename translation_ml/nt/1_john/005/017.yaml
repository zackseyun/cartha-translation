id: 1JN.5.17
reference: 1 John 5:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πᾶσα ἀδικία ἁμαρτία ἐστίν, καὶ ἔστιν ἁμαρτία οὐ πρὸς θάνατον.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/017.yaml
  text: All unrighteousness is sin[b][a], and there is sin not leading to death.
translation:
  language: ml
  text: എല്ലാ അനീതിയും പാപമാണ്[a]; മരണത്തിലേക്കു നയിക്കാത്ത പാപവും ഉണ്ട്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എല്ലാ തെറ്റായ പ്രവൃത്തിയും പാപമാണ്’ അല്ലെങ്കിൽ ‘എല്ലാ അധർമ്മവും പാപമാണ്.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘മരണത്തിൽ കലാശിക്കാത്ത പാപവും ഉണ്ട്’; കൂടുതൽ അക്ഷരാർഥത്തിൽ, ‘മരണത്തോടുള്ളതല്ലാത്ത പാപവും ഉണ്ട്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα ἀδικία
  choice: എല്ലാ അനീതിയും
  rationale: അനിർദിഷ്ട ഏകവചന നാമത്തോടുകൂടിയ πᾶσα സമഗ്രമായ വ്യാപ്തി സൂചിപ്പിക്കുന്നു. ‘എല്ലാ അനീതിയും’ എന്നത് സ്വാഭാവികമായ മലയാളത്തിൽ സർവവ്യാപകതയും ἀδικίαയുടെ ധാർമിക-ദൈവശാസ്ത്രപരമായ അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു.
- source_word: ἁμαρτία
  choice: പാപം
  rationale: രണ്ടിടത്തും ἁμαρτίαയുടെ സാധാരണവും സന്ദർഭോചിതവുമായ നേരിട്ടുള്ള പരിഭാഷ.
- source_word: καὶ
  choice: -വും
  rationale: പൊതുപ്രസ്താവനയോടു തുടർന്നുള്ള വിശദീകരണം ചേർക്കുന്ന ലളിതമായ സംയോജകബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: οὐ πρὸς θάνατον
  choice: മരണത്തിലേക്കു നയിക്കാത്ത
  rationale: πρός എന്നതിന്റെ ദിശ/ഫല സൂചന വ്യക്തമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ‘മരണത്തിന്’ എന്ന കൂടുതൽ ഔപചാരിക രൂപത്തേക്കാൾ ആശയം സുഗ്രാഹ്യമാക്കുന്നു.
- source_word: θάνατον
  choice: മരണം
  rationale: ശാരീരികമോ ആത്മീയമോ അന്ത്യവിധിയുമായി ബന്ധപ്പെട്ടതോ എന്ന് വാക്യം വ്യക്തമാക്കാത്തതിനാൽ വ്യാഖ്യാനപരമായ വിശേഷണം ചേർക്കാതെ നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: ‘മരണത്തിലേക്കു നയിക്കാത്ത പാപം’ എന്നതിലെ മരണത്തിന്റെ സ്വഭാവം
  choice: വിശേഷണം ചേർക്കാതെ ‘മരണം’ എന്നു മാത്രം നൽകുക
  alternative: ശാരീരിക മരണം; ആത്മീയ മരണം; അന്ത്യശിക്ഷ
  rationale: ഗ്രീക്ക് പാഠത്തിൽ θάνατον എന്നത് കൂടുതൽ വിശദീകരണമില്ലാതെയാണ്. അതിനാൽ ദൈവശാസ്ത്രപരമായ അനിശ്ചിതത്വം പരിഭാഷയിൽ നിലനിർത്തുന്നു.
- issue: ἀδικίαയുടെ ധാർമിക അർഥവ്യാപ്തി
  choice: ‘അനീതി’
  alternative: തെറ്റായ പ്രവൃത്തി; അധർമ്മം
  rationale: ‘അനീതി’ എന്നത് സാമൂഹിക അന്യായത്തിൽ മാത്രം ഒതുങ്ങാൻ സാധ്യതയുണ്ടെങ്കിലും മലയാള ബൈബിൾ-ധാർമിക പ്രയോഗത്തിൽ ദൈവനീതിക്കു വിരുദ്ധമായ അവസ്ഥയെയും പ്രവൃത്തിയെയും ഉൾക്കൊള്ളുന്നു. മറ്റു സാധുവായ സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. മുഖ്യവാക്യം സംക്ഷിപ്തമായി സൂക്ഷിക്കുകയും ‘മരണം’ എന്നതിന്റെ ദൈവശാസ്ത്രപരമായ അവ്യക്തത പരിഹരിക്കാതെ നിലനിർത്തുകയും ചെയ്തു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
