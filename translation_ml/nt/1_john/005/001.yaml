id: 1JN.5.1
reference: 1 John 5:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Πᾶς ὁ πιστεύων ὅτι Ἰησοῦς ἐστιν ὁ χριστὸς ἐκ τοῦ θεοῦ γεγέννηται, καὶ πᾶς ὁ ἀγαπῶν τὸν γεννήσαντα ἀγαπᾷ ⸀καὶ τὸν γεγεννημένον ἐξ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/001.yaml
  text: Everyone who believes that Jesus is the Messiah has been born of God[b][a], and everyone who loves the one who fathered him also loves the one born of him.
translation:
  language: ml
  text: യേശു മശീഹയാണെന്ന്[a] വിശ്വസിക്കുന്ന ഏവനും ദൈവത്തിൽനിന്നു ജനിച്ചിരിക്കുന്നു[b]. ജനിപ്പിച്ചവനെ സ്നേഹിക്കുന്ന ഏവനും അവനിൽനിന്നു ജനിച്ചവനെയും സ്നേഹിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ക്രിസ്തുവാണെന്ന്.” ഗ്രീക്കിലെ Χριστός ഇവിടെ “അഭിഷിക്തൻ” എന്ന അർഥമുള്ള സ്ഥാനപ്പേരാണ്.
    reason: alternative_reading
  - marker: b
    text: ഈ വാക്യത്തിലുടനീളം “ജനിക്കുക/ജനിപ്പിക്കുക” എന്നതിന് ഗ്രീക്കിൽ ഒരേ ക്രിയയുടെ വിവിധ രൂപങ്ങളാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς ὁ πιστεύων
  choice: വിശ്വസിക്കുന്ന ഏവനും
  rationale: വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ പൊതുവായ, നാമവാചകസ്വഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὅτι Ἰησοῦς ἐστιν ὁ χριστός
  choice: യേശു മശീഹയാണെന്ന്
  rationale: Χριστός ഇവിടെ വ്യക്തിനാമംപോലെയല്ല, അഭിഷിക്തനായ വാഗ്ദത്ത രക്ഷകനെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരായതിനാൽ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: ἐκ τοῦ θεοῦ γεγέννηται
  choice: ദൈവത്തിൽനിന്നു ജനിച്ചിരിക്കുന്നു
  rationale: പൂർണ്ണകാല കർമണിപ്രയോഗം പൂർത്തിയായ സംഭവത്തെയും അതിന്റെ നിലനിൽക്കുന്ന ഫലത്തെയും സൂചിപ്പിക്കുന്നു; ‘ജനിച്ചിരിക്കുന്നു’ യോഹന്നാന്റെ നവജനനഭാഷ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: πᾶς ὁ ἀγαπῶν
  choice: സ്നേഹിക്കുന്ന ഏവനും
  rationale: പൊതുവായ നാമവാചക കൃദന്തരൂപം ആദ്യ ഉപവാക്യത്തോടു സമാന്തരമായി അവതരിപ്പിക്കുന്നു.
- source_word: τὸν γεννήσαντα
  choice: ജനിപ്പിച്ചവനെ
  rationale: γεννάω എന്ന ക്രിയയുടെ കർത്തൃരൂപം അധികമായി ‘പിതാവ്’ എന്നു വ്യാഖ്യാനിക്കാതെ സംരക്ഷിക്കുകയും തുടർന്നുള്ള കർമണിരൂപത്തോടുള്ള ബന്ധം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ἀγαπᾷ καὶ
  choice: …യെയും സ്നേഹിക്കുന്നു
  rationale: καί വസ്തുവിനോടു ചേർന്ന് ‘കൂടാതെ/യും’ എന്ന അർഥം നൽകുന്നതിനാൽ മലയാളത്തിലെ ‘-യെയും’ ഉപയോഗിച്ച് രണ്ടാമത്തെ സ്നേഹബന്ധം ചേർത്തു.
- source_word: τὸν γεγεννημένον ἐξ αὐτοῦ
  choice: അവനിൽനിന്നു ജനിച്ചവനെയും
  rationale: പൂർണ്ണകാല കർമണി കൃദന്തവും ἐξ സൂചിപ്പിക്കുന്ന ഉറവിടവും സംരക്ഷിക്കുന്നു; ‘അവന്റെ മകൻ’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ രൂപം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: ദൈവത്തിൽനിന്നുള്ള ജനനത്തെ സൂചിപ്പിക്കുന്ന γεννάω ഭാഷ
  choice: പ്രധാന പാഠത്തിൽ ‘ദൈവത്തിൽനിന്നു ജനിച്ചിരിക്കുന്നു / ജനിപ്പിച്ചവൻ / അവനിൽനിന്നു ജനിച്ചവൻ’ എന്ന ബന്ധിത പദങ്ങൾ ഉപയോഗിച്ചു.
  alternative: γεννάω എല്ലായിടത്തും ‘ജനിപ്പിക്കുക/ജനിപ്പിക്കപ്പെടുക’ എന്ന കൂടുതൽ പദാനുപദ രൂപത്തിൽ നൽകുക; അല്ലെങ്കിൽ ‘പിതാവ്/മകൻ’ എന്നു ബന്ധനാമങ്ങൾ ഉപയോഗിക്കുക.
  rationale: ഗ്രീക്കിലെ ജനിപ്പിക്കുന്നവൻ–ജനിച്ചവൻ ബന്ധം നിലനിർത്തുമ്പോഴും മലയാളത്തിൽ സ്വാഭാവികമായ നവജനനഭാഷ നൽകുന്നു. ‘പിതാവ്/മകൻ’ എന്നു മാറ്റുന്നത് മൂലപാഠത്തിലുള്ളതിലധികം വ്യാഖ്യാനം ചേർക്കും.
- issue: യേശുവിന്റെ ὁ χριστός എന്ന സ്ഥാനപ്പേര്
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഇത് യേശു വാഗ്ദത്ത അഭിഷിക്തനാണെന്ന വിശ്വാസപ്രഖ്യാപനമായതിനാൽ സ്ഥാനപ്പേരിന്റെ അർഥം പ്രകടമാക്കുന്ന ‘മശീഹ’ പ്രധാന പാഠത്തിൽ ഉപയോഗിച്ചു; പരിചിതമായ മറ്റൊരു രൂപം അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു വ്യക്തവും ആരാധനാപരമായ വായനയ്ക്കു യോജിച്ച ഗൗരവമുള്ളതുമായ മലയാളം. ഗ്രീക്കിലെ സമാന്തരഘടനയും ജനനരൂപകവും നിലനിർത്തിക്കൊണ്ട് അനാവശ്യമായ സാങ്കേതികമോ സഭാവിഭാഗപരമോ ആയ പദപ്രയോഗം ഒഴിവാക്കി.
