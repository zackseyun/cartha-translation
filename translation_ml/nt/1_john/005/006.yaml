id: 1JN.5.6
reference: 1 John 5:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οὗτός ἐστιν ὁ ἐλθὼν δι’ ὕδατος καὶ αἵματος, Ἰησοῦς Χριστός· οὐκ ἐν τῷ ὕδατι μόνον ἀλλ’ ἐν τῷ ὕδατι καὶ ⸀ἐν τῷ αἵματι· καὶ τὸ πνεῦμά ἐστιν τὸ μαρτυροῦν, ὅτι τὸ πνεῦμά ἐστιν ἡ ἀλήθεια.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/006.yaml
  text: This is the one who came by water and blood—Jesus the Messiah[a]; not by the water only, but by the water and by the blood. And the Spirit is the one testifying[c][b], because the Spirit is the truth.
translation:
  language: ml
  text: ജലത്തിലൂടെയും രക്തത്തിലൂടെയും വന്നവൻ ഇവനാണ്[a]—മശീഹയായ യേശു[b]. ജലത്തിൽ മാത്രമല്ല, ജലത്തിലും രക്തത്തിലും അവൻ വന്നു. സാക്ഷ്യം വഹിക്കുന്നത് ആത്മാവാണ്; കാരണം[c] ആത്മാവാണ് സത്യം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ജലത്തിലൂടെയും രക്തത്തിലൂടെയും’ എന്നതിന് ‘ജലവും രക്തവും മുഖേന’ എന്നും പരിഭാഷപ്പെടുത്താം. ഈ പ്രയോഗം യേശുവിന്റെ സ്നാനത്തെയും മരണത്തെയും, ജനനത്തെയും മരണത്തെയും, അല്ലെങ്കിൽ സ്നാനവും കർത്തൃഭോജനവും സംബന്ധിച്ച പ്രതീകങ്ങളെയും സൂചിപ്പിക്കുന്നു എന്നിങ്ങനെ പല വ്യാഖ്യാനങ്ങളുണ്ട്; ഇവിടെ ഗ്രീക്ക് പ്രയോഗം വ്യാഖ്യാനപരമായി നിർവചിക്കാതെ നിലനിർത്തിയിരിക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: ഗ്രീക്കിൽ ‘യേശു ക്രിസ്തോസ്’; ഇവിടെ Χριστός ഒരു പദവിയായി പ്രവർത്തിക്കുന്നതിനാൽ ‘മശീഹയായ യേശു’ എന്നു പരിഭാഷപ്പെടുത്തി.
    reason: lexical_alternative
  - marker: c
    text: 'അല്ലെങ്കിൽ: ‘ആത്മാവാണ് സത്യം എന്ന്.’ ഗ്രീക്ക് ബന്ധകം ഉള്ളടക്കമോ കാരണമോ അവതരിപ്പിക്കാം; ഇവിടെ സന്ദർഭപ്രവാഹത്തിന് ‘കാരണം’ കൂടുതൽ യോജിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτός ἐστιν ὁ ἐλθὼν
  choice: വന്നവൻ ഇവനാണ്
  rationale: സൂചകസർവനാമത്തിന്റെ ഊന്നലും substantival aorist participle-ന്റെ ചരിത്രപരമായ പരാമർശവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δι’ ὕδατος καὶ αἵματος
  choice: ജലത്തിലൂടെയും രക്തത്തിലൂടെയും
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന മാർഗം/മാധ്യമം എന്ന ആശയം നൽകുന്നു; അതേസമയം ജലവും രക്തവും എന്തിനെ സൂചിപ്പിക്കുന്നു എന്ന് മുഖ്യപാഠത്തിൽ നിർണയിക്കുന്നില്ല.
- source_word: Ἰησοῦς Χριστός
  choice: മശീഹയായ യേശു
  rationale: ഇവിടെ Χριστός പദവി എന്ന നിലയിൽ പ്രവർത്തിക്കുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ പദവിരൂപം ഉപയോഗിച്ചു.
- source_word: οὐκ ἐν τῷ ὕδατι μόνον ἀλλ’ ἐν τῷ ὕδατι καὶ ἐν τῷ αἵματι
  choice: ജലത്തിലൂടെ മാത്രം അല്ല, ജലത്തിലൂടെയും രക്തത്തിലൂടെയും തന്നെയാണ് അവൻ വന്നത്
  rationale: മാത്രം/എന്നാൽ രണ്ടും എന്ന ഗ്രീക്ക് വിരോധവും ആവർത്തനത്തിലെ ഊന്നലും വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ അപൂർണ്ണമായി തോന്നാതിരിക്കാൻ ‘അവൻ വന്നത്’ പൂരിപ്പിച്ചു.
- source_word: τὸ πνεῦμά ἐστιν τὸ μαρτυροῦν
  choice: സാക്ഷ്യം വഹിക്കുന്നത് ആത്മാവാണ്
  rationale: വർത്തമാനകൃതന്തത്തിന്റെ തുടരുന്ന സാക്ഷ്യപ്രവർത്തനം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ὅτι
  choice: കാരണം
  rationale: സന്ദർഭത്തിൽ ആത്മാവിന്റെ സാക്ഷ്യത്തിന് അടിസ്ഥാനം നൽകുന്ന കാരണാർഥമാണ് ഏറ്റവും യോജിച്ചത്; ഉള്ളടക്കാർഥമായ ‘എന്ന്’ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἡ ἀλήθεια
  choice: സത്യം
  rationale: ‘ആത്മാവാണ് സത്യം’ എന്ന തിരിച്ചറിയൽസ്വഭാവമുള്ള predicate നിലനിർത്തുന്നു; ‘സത്യവാൻ’ എന്ന വ്യാഖ്യാനപരമായ മാറ്റം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: ‘ജലവും രക്തവും’ എന്ന പ്രയോഗത്തിന്റെ സൂചന
  choice: വ്യാഖ്യാനപരമായി നിർവചിക്കാതെ അതേ ദൃശ്യപ്രയോഗം നിലനിർത്തി
  alternative: യേശുവിന്റെ സ്നാനവും മരണവും; ജനനവും മരണവും; സ്നാനവും കർത്തൃഭോജനവും സംബന്ധിച്ച പ്രതീകം
  rationale: ഗ്രീക്ക് പാഠം ജലവും രക്തവും എന്നു മാത്രമേ പറയുന്നുള്ളൂ; വിവാദമായ വ്യാഖ്യാനങ്ങളിൽ ഒന്നും മുഖ്യപാഠത്തിൽ നിർബന്ധിക്കുന്നില്ല.
- issue: τὸ πνεῦμα എന്നതിന്റെ പരാമർശം
  choice: ദൈവാത്മാവ് എന്ന സന്ദർഭപരമായ അർഥത്തിൽ ‘ആത്മാവ്’
  alternative: ഒരു പൊതുവായ ആത്മാവ്
  rationale: 1 യോഹന്നാനിലെ ദൈവിക സാക്ഷ്യത്തിന്റെ ഉടനടി സന്ദർഭം പരിശുദ്ധാത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്; എന്നാൽ ‘പരിശുദ്ധ’ എന്ന പദം മൂലത്തിൽ ഇല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല.
- issue: Χριστός എന്നതിന്റെ പ്രവർത്തനം
  choice: പദവിയായി ‘മശീഹ’
  alternative: പേരിന്റെ ഭാഗംപോലെ ‘ക്രിസ്തു’
  rationale: ഈ apposition-ൽ യേശുവിന്റെ മശീഹാപദവിയാണ് ഊന്നുന്നത്; അതിനാൽ പദവിയെന്ന സ്വഭാവം വ്യക്തമായി നിലനിർത്തി.
- issue: ὅτι എന്ന ബന്ധകത്തിന്റെ അർഥം
  choice: കാരണാർഥത്തിൽ ‘കാരണം’
  alternative: ഉള്ളടക്കാർഥത്തിൽ ‘എന്ന്’
  rationale: ആത്മാവ് സാക്ഷ്യം വഹിക്കുന്നതിന്റെ അടിസ്ഥാനം തുടർവാക്യം നൽകുന്നു എന്ന വായന സന്ദർഭത്തിൽ ശക്തമാണ്; യഥാർത്ഥ ഭാഷാപരമായ മറ്റുസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ‘മുഖേന’ എന്ന ഔദ്യോഗികഭാവമുള്ള പദത്തിനു പകരം ‘-ലൂടെ’ ഉപയോഗിച്ചു. ദുഷ്കരമായ ‘ജലവും രക്തവും’ എന്ന പ്രയോഗത്തിന്റെ വ്യാഖ്യാനതുറന്ന നില സംരക്ഷിച്ചു.
