id: 1JN.2.6
reference: 1 John 2:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ λέγων ἐν αὐτῷ μένειν ὀφείλει καθὼς ἐκεῖνος περιεπάτησεν καὶ ⸀αὐτὸς περιπατεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/006.yaml
  text: The one who says he remains in him ought also to walk just as that one walked[a][b][c].
translation:
  language: ml
  text: അവനിൽ വസിക്കുന്നു എന്ന് പറയുന്നവൻ, ആ വ്യക്തി നടന്നതുപോലെ താനും നടക്കേണ്ടതാണ്.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവനിൽ നിലനിൽക്കുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം. μένω എന്ന ഗ്രീക്ക് ക്രിയ യോഹന്നാന്റെ രചനകളിലെ പ്രധാന പദമാണ്; ബന്ധത്തിൽ തുടരുക, നിലനിൽക്കുക, വസിക്കുക എന്നീ അർത്ഥങ്ങൾ അതിനുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടത്തെ ‘ആ വ്യക്തി’ യേശുവിനെ സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിൽ ഊന്നലുള്ള നിർദേശസർവനാമമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; അക്ഷരാർഥത്തിൽ ‘ആ ഒരുവൻ’ എന്നും നൽകാം.
    reason: alternative_reading
  - marker: c
    text: ‘നടക്കുക’ എന്നത് ഒരാളുടെ ജീവിതരീതിയെ സൂചിപ്പിക്കുന്ന ബൈബിൾ രൂപകമാണ്; അതായത്, യേശു ജീവിച്ചതുപോലെ ജീവിക്കണം.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ λέγων
  choice: പറയുന്നവൻ
  rationale: നാമവാചകമായി പ്രവർത്തിക്കുന്ന ആർട്ടിക്കിളോടുകൂടിയ കൃദന്തത്തിന്റെ ഏകവചനവും പൊതുവായ പ്രതിനിധാനസ്വഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐν αὐτῷ μένειν
  choice: അവനിൽ വസിക്കുന്നു
  rationale: μένω യോഹന്നാന്റെ രചനകളിലെ ബന്ധത്തിൽ തുടരുക, നിലനിൽക്കുക, വസിക്കുക എന്നീ അർത്ഥതലങ്ങളുള്ള പ്രധാന പദമാണ്. ‘വസിക്കുന്നു’ ‘അവനിൽ’ എന്ന പ്രയോഗത്തോടൊപ്പം സ്വാഭാവികവും ബന്ധപരമായ തുടർച്ച സൂചിപ്പിക്കുന്നതുമാണ്.
- source_word: ὀφείλει
  choice: നടക്കേണ്ടതാണ്
  rationale: ὀφείλω സൂചിപ്പിക്കുന്ന ധാർമിക ബാധ്യതയെ അത്യധികം നിയമഭാഷയാക്കാതെ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: καθὼς
  choice: പോലെതന്നെ
  rationale: രീതിയിലുള്ള അടുത്ത അനുരൂപതയും മാതൃകാനുസരണവും വ്യക്തമാക്കുന്നു.
- source_word: ἐκεῖνος
  choice: അവൻ
  rationale: സന്ദർഭത്തിൽ യേശുവിനെ സൂചിപ്പിക്കുന്ന ഊന്നലുള്ള നിർദേശസർവനാമമാണിത്. മലയാളത്തിൽ ‘അവൻ’ സ്വാഭാവികമാണ്; ഗ്രീക്കിലെ നിർദേശാത്മക ഊന്നൽ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: περιεπάτησεν ... περιπατεῖν
  choice: നടന്നതുപോലെ ... നടക്കേണ്ടതാണ്
  rationale: ജീവിതരീതിയെ സൂചിപ്പിക്കുന്ന ബൈബിൾ രൂപകം നിലനിർത്തുകയും ഭൂതകാല ക്രിയയും വർത്തമാന ബാധ്യതയും പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: καὶ αὐτὸς
  choice: താനും
  rationale: καίയുടെ കൂട്ടിച്ചേർക്കൽഭാവവും αὐτός നൽകുന്ന കർത്തൃഊന്നലും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പകരുന്നു.
theological_decisions:
- issue: αὐτῷ / ἐκεῖνος എന്നിവയുടെ സൂചിതവ്യക്തി
  choice: രണ്ടും സന്ദർഭാനുസൃതമായി യേശുവിനെ സൂചിപ്പിക്കുന്ന ‘അവനിൽ’ / ‘അവൻ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ദൈവത്വം സൂചിപ്പിക്കാൻ ആദരസൂചകമായ ‘അവിടുന്നിൽ’ / ‘അവിടുന്ന്’ ഉപയോഗിക്കുക, അല്ലെങ്കിൽ ἐκεῖνος നെ ‘ആ ഒരുവൻ’ എന്നു നൽകുക.
  rationale: സമീപസന്ദർഭം യേശുവിനെയാണ് മാതൃകയായി ചൂണ്ടുന്നത്. എന്നാൽ ഗ്രീക്കിൽ ദൈവിക സർവനാമത്തിനുള്ള പ്രത്യേക ആദരരൂപമില്ല; അതിനാൽ മലയാളത്തിലേക്ക് അത്തരം വ്യാഖ്യാനചിഹ്നം ചേർക്കാതെ സാധാരണ സർവനാമം ഉപയോഗിച്ചു. ἐκεῖνος ന്റെ ഊന്നൽ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: ഏകവചന പൊതുപ്രതിനിധാനം
  choice: ‘പറയുന്നവൻ’ എന്ന ഏകവചന രൂപം നിലനിർത്തി.
  alternative: ‘പറയുന്ന ആരും’ അല്ലെങ്കിൽ ബഹുവചനമായി പുനരാഖ്യാനം ചെയ്യുക.
  rationale: ഗ്രീക്ക് വ്യാകരണപരമായി പുല്ലിംഗ ഏകവചനമാണെങ്കിലും പ്രതിനിധാനപരമായ പൊതുവ്യാപ്തിയുണ്ട്. മലയാളരൂപം മൂലഘടന നിലനിർത്തുന്നു; അത് പുരുഷന്മാർക്കു മാത്രം പരിമിതമാണെന്ന അർത്ഥം ഉദ്ദേശിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. യോഹന്നാന്റെ ‘വസിക്കുക’ എന്ന ബന്ധപരമായ പദവും ‘നടക്കുക’ എന്ന ജീവിതരൂപകവും നിലനിർത്തി; അസ്വാഭാവികമായ അക്ഷരാനുകരണം ഒഴിവാക്കി.
