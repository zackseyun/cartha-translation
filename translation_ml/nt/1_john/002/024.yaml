id: 1JN.2.24
reference: 1 John 2:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ὑμεῖς ὃ ἠκούσατε ἀπ’ ἀρχῆς, ἐν ὑμῖν μενέτω· ἐὰν ἐν ὑμῖν μείνῃ ὃ ἀπ’ ἀρχῆς ἠκούσατε, καὶ ὑμεῖς ἐν τῷ υἱῷ καὶ ἐν τῷ πατρὶ μενεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/024.yaml
  text: As for you[a], let what you heard from the beginning remain in you. If what you heard from the beginning remains in you[b], you also will remain in the Son and in the Father.
translation:
  language: ml
  text: നിങ്ങളാകട്ടെ, ആദിമുതൽ നിങ്ങൾ കേട്ടത്[a] നിങ്ങളിൽ നിലനിൽക്കട്ടെ. ആദിമുതൽ നിങ്ങൾ കേട്ടത് നിങ്ങളിൽ നിലനിൽക്കുന്നുവെങ്കിൽ[b], നിങ്ങളും പുത്രനിലും പിതാവിലും നിലനിൽക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആദിമുതൽ നിങ്ങൾ കേട്ടത്’ എന്നത്, ‘ആദിമുതൽ നിങ്ങൾ കേട്ട ആ കാര്യം’ എന്നും പരിഭാഷപ്പെടുത്താം; സന്ദർഭത്തിൽ ഇത് പുത്രനെക്കുറിച്ചുള്ള ആദിമ അപ്പൊസ്തലിക സന്ദേശത്തെ സൂചിപ്പിക്കുന്നതായി തോന്നുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഈ വാക്യത്തിലുടനീളം ‘നിലനിൽക്കുക’ എന്ന ഒരേ ഗ്രീക്ക് ക്രിയയാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; പരമ്പരാഗതമായി ‘വസിക്കുക’ എന്നും പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: നിങ്ങളാകട്ടെ
  rationale: വാക്യത്തിന്റെ തുടക്കത്തിൽ ഊന്നലോടെ വന്നിരിക്കുന്ന സർവനാമത്തിന്റെ വിഷയസൂചകവും വൈരുധ്യസൂചകവുമായ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ὃ ἠκούσατε ἀπ’ ἀρχῆς
  choice: ആദിമുതൽ നിങ്ങൾ കേട്ടത്
  rationale: നപുംസകലിംഗ ബന്ധസർവനാമമായ ὃ-യെ ‘കേട്ടത്’ എന്നു വിശാലമായി നിലനിർത്തുന്നു; ‘സുവിശേഷം’ എന്നോ ‘അപ്പൊസ്തലിക സന്ദേശം’ എന്നോ മൂലപാഠത്തേക്കാൾ വ്യക്തമായി നിർവചിക്കുന്നില്ല.
- source_word: ἀπ’ ἀρχῆς
  choice: ആദിമുതൽ
  rationale: യോഹന്നാന്റെ രചനകളിലെ ആവർത്തിത പ്രയോഗത്തിന്റെ അർത്ഥവും ദൈവശാസ്ത്രപരമായ അനുരണനവും സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ സൂക്ഷിക്കുന്നു.
- source_word: ἐν ὑμῖν μενέτω
  choice: നിങ്ങളിൽ നിലനിൽക്കട്ടെ
  rationale: വർത്തമാനകാല ആജ്ഞാരൂപം സൂചിപ്പിക്കുന്ന തുടർച്ചയായ നിലനിൽപ്പിനുള്ള ആഹ്വാനം പ്രകടമാക്കുന്നു.
- source_word: ἐὰν ἐν ὑμῖν μείνῃ
  choice: നിങ്ങളിൽ നിലനിൽക്കുന്നെങ്കിൽ
  rationale: ἐάν സഹിതമുള്ള ഉപാധിവാക്യം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുകയും μένω എന്ന ക്രിയയുടെ ആവർത്തനം ഒരേ പദത്തിലൂടെ സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: καὶ ὑμεῖς
  choice: നിങ്ങളും
  rationale: καί നൽകുന്ന ‘കൂടി/ഉം’ എന്ന അർത്ഥവും വ്യക്തമായ സർവനാമത്തിന്റെ ഊന്നലും ലളിതമായി സംരക്ഷിക്കുന്നു.
- source_word: ἐν τῷ υἱῷ καὶ ἐν τῷ πατρὶ
  choice: പുത്രനിലും പിതാവിലും
  rationale: പുത്രനോടും പിതാവിനോടുമുള്ള സമാന്തര ബന്ധം മലയാളത്തിലെ സമുച്ചയപ്രത്യയത്തിലൂടെ വ്യക്തമായി സൂക്ഷിക്കുന്നു.
- source_word: μενεῖτε
  choice: നിലനിൽക്കും
  rationale: ഭാവികാല നിർദേശക രൂപം നേരിട്ട് പരിഭാഷപ്പെടുത്തുകയും മുൻപുള്ള μένω രൂപങ്ങളുമായുള്ള പദബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: അവസാന ഉപാധിവാക്യത്തിലെ വാഗ്ദാനത്തിന്റെ സ്വഭാവം
  choice: ‘നിങ്ങളും പുത്രനിലും പിതാവിലും നിലനിൽക്കും’ എന്ന് ഭാവികാലത്തിൽ നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: ഇത് വെറും പ്രബോധനമായി മാറ്റുക, അല്ലെങ്കിൽ പിൽക്കാല സ്ഥിരോത്സാഹസിദ്ധാന്തത്തിന്റെ തെളിവായി വ്യാഖ്യാനിക്കുക.
  rationale: ഗ്രീക്ക് പാഠം ആദിമുതൽ കേട്ടത് നിലനിൽക്കുന്നതുമായി ബന്ധപ്പെടുത്തിയ ഉപാധിപൂർവമായ ഭാവിപ്രസ്താവനയാണ്; സ്ഥിരോത്സാഹം, ഉറപ്പ്, ഐക്യം എന്നിവയെക്കുറിച്ചുള്ള പ്രത്യേക സഭാപാരമ്പര്യ വ്യാഖ്യാനം വിവർത്തനത്തിൽ ചേർക്കുന്നില്ല.
- issue: ‘ആദിമുതൽ നിങ്ങൾ കേട്ടത്’ എന്നതിന്റെ സൂചിതവിഷയം
  choice: മുഖ്യപാഠത്തിൽ പൊതുവായ പ്രയോഗം അതേപടി നിലനിർത്തി.
  alternative: ‘ആദിമുതൽ കേട്ട സുവിശേഷം’ അല്ലെങ്കിൽ ‘അപ്പൊസ്തലിക സന്ദേശം’ എന്ന് വ്യക്തമാക്കുക.
  rationale: സന്ദർഭം പുത്രനെക്കുറിച്ചുള്ള ആദിമ അപ്പൊസ്തലിക പ്രഖ്യാപനത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, ഗ്രീക്ക് പാഠം ബന്ധസർവനാമം മാത്രമാണ് ഉപയോഗിക്കുന്നത്; അതിനാൽ മുഖ്യപാഠം അതിനെ അനാവശ്യമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ആദിമുതൽ’, ‘നിലനിൽക്കുക’, ‘പുത്രൻ’, ‘പിതാവ്’ എന്നീ പദങ്ങൾ യോഹന്നാന്റെ ആവർത്തനവും ബന്ധപരമായ സമാന്തരതയും സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി കൈമാറുന്നു.
