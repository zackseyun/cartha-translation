id: 1JN.2.22
reference: 1 John 2:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τίς ἐστιν ὁ ψεύστης εἰ μὴ ὁ ἀρνούμενος ὅτι Ἰησοῦς οὐκ ἔστιν ὁ χριστός; οὗτός ἐστιν ὁ ἀντίχριστος, ὁ ἀρνούμενος τὸν πατέρα καὶ τὸν υἱόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/022.yaml
  text: 'Who is the liar except the one who denies that Jesus is the Messiah? This is the antichrist: the one who denies the Father and the Son[a][b].'
translation:
  language: ml
  text: യേശു മശീഹയല്ലെന്ന് നിഷേധിക്കുന്നവനല്ലാതെ മറ്റാരാണ് അസത്യവാദി? ഇവനാണ് എതിർക്രിസ്തു—പിതാവിനെയും പുത്രനെയും നിഷേധിക്കുന്നവൻ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ക്രിസ്തുവല്ലെന്ന്.” ഗ്രീക്കിലെ ὁ χριστός ഇവിടെ വ്യക്തിപേരായല്ല, സ്ഥാനപ്പേരായാണ് പ്രവർത്തിക്കുന്നത്; അതിനാൽ മുഖ്യപാഠത്തിൽ “മശീഹ” എന്നു നൽകിയിരിക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: 'അഥവാ, “എതിർക്രിസ്തു.” ഗ്രീക്കിൽ നിശ്ചയാർഥക ഉപപദമുണ്ട്: “എതിർക്രിസ്തു” എന്നതിനെ നിർദിഷ്ടമായി തിരിച്ചറിയിക്കുന്നു. യോഹന്നാന്റെ ലേഖനങ്ങളിൽ ഈ പദം പിതാവിനെയും പുത്രനെയും നിഷേധിക്കുന്ന സ്വഭാവമുള്ള ഒരു വിരോധിയെയോ അത്തരം വിരോധിയുടെ തരത്തെയോ സൂചിപ്പിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ψεύστης
  choice: കള്ളൻ
  rationale: നിശ്ചയാർഥക ഉപപദത്തോടുകൂടിയ നാമം ഇവിടെ വെറും ‘ഒരു കള്ളൻ’ എന്നതിലുപരി, സന്ദർഭത്തിൽ മാതൃകാപരമായി ചൂണ്ടിക്കാണിക്കപ്പെടുന്ന കള്ളനെ സൂചിപ്പിക്കുന്നു.
- source_word: ἀρνούμενος
  choice: നിഷേധിക്കുന്നവൻ
  rationale: വർത്തമാനകാല കൃദന്തരൂപം വ്യക്തിയെ സ്വഭാവലക്ഷണമായി തിരിച്ചറിയിക്കുന്നു; മലയാളത്തിൽ ‘നിഷേധിക്കുന്നവൻ’ ഈ തുടർച്ചയായ/ലക്ഷണാത്മക ഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ὅτι Ἰησοῦς οὐκ ἔστιν ὁ χριστός
  choice: യേശു മശീഹയല്ലെന്ന്
  rationale: ὅτι നിഷേധത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു. Χριστός ഇവിടെ പേരായല്ല, അഭിഷിക്തനായ പ്രതീക്ഷിത രാജാവിനെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരായതിനാൽ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: ὁ χριστός
  choice: മശീഹ
  rationale: ഇവിടെ Χριστός വ്യക്തിപേരുപോലെയല്ല, യേശുവിനെക്കുറിച്ചുള്ള അവകാശവാദത്തിലെ സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നു; ‘മശീഹ’ അതിന്റെ യഹൂദ പശ്ചാത്തലവും അർഥവും വ്യക്തമാക്കുന്നു.
- source_word: ἀντίχριστος
  choice: എതിർക്രിസ്തു
  rationale: മലയാള ക്രൈസ്തവ പ്രയോഗത്തിൽ തിരിച്ചറിയാവുന്ന പദമാണിത്; ഗ്രീക്കിലെ എതിർപ്പ്/വിരോധം എന്ന ഘടകവും നിലനിർത്തുന്നു. നിശ്ചയാർഥക ഉപപദത്തിന്റെ ബലം ‘വൻതന്നെയാണ്’ എന്ന തിരിച്ചറിയിക്കൽഘടനയിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: πατέρα
  choice: പിതാവ്
  rationale: ‘പുത്രൻ’ എന്നതോടൊപ്പം യോഹന്നാന്റെ ദൈവബന്ധപരമായ പ്രയോഗത്തിൽ ഇത് പ്രത്യേകമായി ദൈവമായ പിതാവിനെ സൂചിപ്പിക്കുന്നു.
- source_word: υἱόν
  choice: പുത്രൻ
  rationale: പിതാവ്–പുത്രൻ ബന്ധത്തിൽ പ്രത്യേകമായി ദൈവപുത്രനെ സൂചിപ്പിക്കുന്നതിനാൽ പരമ്പരാഗതവും ഗൗരവമുള്ളതുമായ ‘പുത്രൻ’ തെരഞ്ഞെടുത്തു.
- source_word: οὗτός ἐστιν
  choice: അവൻതന്നെയാണ്
  rationale: മുമ്പ് വിവരിച്ച വ്യക്തിയിലേക്കാണ് സർവനാമം തിരിഞ്ഞുനോക്കുന്നത്; ‘അവൻതന്നെയാണ്’ തിരിച്ചറിയിക്കലിന്റെ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ക്രിസ്തുശാസ്ത്രപരമായ സമ്മതം/നിഷേധം സൂചിപ്പിക്കുന്ന വാക്യത്തിൽ Χριστός എന്നതിന്റെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ പദം പേരുപോലെ അല്ല, യേശുവിന്റെ മശീഹത്വം സംബന്ധിച്ച സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നു. അതിനാൽ ‘മശീഹ’ എന്നത് വാദവിഷയമായ അവകാശവാദം വ്യക്തമാക്കുന്നു.
- issue: ἀντίχριστος എന്ന പദത്തിന്റെ സൂചന
  choice: എതിർക്രിസ്തു
  alternative: എതിർക്രിസ്തുവായവൻ / ക്രിസ്തുവിരോധി
  rationale: ഗ്രീക്കിലെ നിശ്ചയാർഥകത നിലനിർത്തിയെങ്കിലും, അത് ഒരൊറ്റ അന്ത്യകാല വ്യക്തിയെ മാത്രമാണ് നിർബന്ധമായി സൂചിപ്പിക്കുന്നതെന്ന് പരിഭാഷയിൽ തീരുമാനിച്ചിട്ടില്ല. യോഹന്നാന്റെ ലേഖനങ്ങളിൽ ഒരു വിരോധിയുടെ തരമോ പ്രതിനിധിയോ സൂചിപ്പിക്കാനുള്ള സാധ്യത തുറന്നുവെക്കുന്നു.
- issue: പിതാവിനെയും പുത്രനെയും നിഷേധിക്കുന്നതും എതിർക്രിസ്തുവിന്റെ തിരിച്ചറിയലും തമ്മിലുള്ള ബന്ധം
  choice: പിതാവിനെയും പുത്രനെയും നിഷേധിക്കുന്നവൻതന്നെയാണ് എതിർക്രിസ്തു
  alternative: ഇവനാണ് എതിർക്രിസ്തു—പിതാവിനെയും പുത്രനെയും നിഷേധിക്കുന്നവൻ
  rationale: ഗ്രീക്കിലെ സമസ്ഥാനീയ വിശദീകരണം സ്വാഭാവിക മലയാളവാക്യത്തിൽ ഏകീകരിച്ചെങ്കിലും, പിതാവിനെയും പുത്രനെയും നിഷേധിക്കുന്നവനാണ് തിരിച്ചറിയപ്പെടുന്നതെന്ന ആശയം മാറ്റിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘മശീഹ’, ‘പിതാവ്’, ‘പുത്രൻ’, ‘എതിർക്രിസ്തു’ എന്നീ പരിചിത ദൈവശാസ്ത്രപദങ്ങൾ ഉപയോഗിച്ചെങ്കിലും, ഒരു പ്രത്യേക സഭാവിഭാഗത്തിന്റെ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
