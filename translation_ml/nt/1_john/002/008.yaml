id: 1JN.2.8
reference: 1 John 2:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πάλιν ἐντολὴν καινὴν γράφω ὑμῖν, ὅ ἐστιν ἀληθὲς ἐν αὐτῷ καὶ ἐν ὑμῖν, ὅτι ἡ σκοτία παράγεται καὶ τὸ φῶς τὸ ἀληθινὸν ἤδη φαίνει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/008.yaml
  text: Again[a], I am writing to you a new commandment, which is true in him and in you, because the darkness is passing away and the true light is already shining.
translation:
  language: ml
  text: വീണ്ടും, ഞാൻ നിങ്ങൾക്ക് ഒരു പുതിയ കല്പന എഴുതുന്നു. അത് അവനിലും നിങ്ങളിലും സത്യമാണ്[a]; കാരണം, ഇരുട്ട് മാഞ്ഞുപൊയ്ക്കൊണ്ടിരിക്കുന്നു, യഥാർഥ വെളിച്ചം ഇതിനകം പ്രകാശിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “അത് അതിലും നിങ്ങളിലും സത്യമാണ്”; ഇവിടെ “അതിൽ” എന്നത് കല്പനയെ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: മുൻവാക്യത്തിലെ ‘പഴയ കല്പന’ എന്ന പ്രസ്താവനയ്ക്കുശേഷം മറ്റൊരു അർഥത്തിൽ അതിനെ ‘പുതിയ കല്പന’ എന്നു അവതരിപ്പിക്കുന്ന സംവാദസൂചകം; ‘വീണ്ടും’ ഈ ബന്ധം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: ἐντολὴν καινὴν
  choice: ഒരു പുതിയ കല്പന
  rationale: καινός കാലപരമായ പുതുമ മാത്രമല്ല, സ്വഭാവത്തിലോ ഗുണത്തിലോ ഉള്ള പുതുമയും സൂചിപ്പിക്കാം; യോഹന്നാനീയ പ്രയോഗവുമായി ചേരുന്ന സ്വാഭാവിക വിവർത്തനം.
- source_word: γράφω
  choice: ഞാൻ ... എഴുതുന്നു
  rationale: ഗ്രീക്ക് വർത്തമാനകാലത്തെ കത്തിന്റെ ഇപ്പോഴത്തെ എഴുത്തുപ്രവൃത്തിയായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ὅ ἐστιν ἀληθές
  choice: അത് ... സത്യമാണ്
  rationale: നപുംസകലിംഗ ഏകവചനമായ ὅ മുൻപുള്ള കല്പനയെയോ മുഴുവൻ ആശയത്തെയോ സൂചിപ്പിക്കുന്നു; ‘അത്’ ഈ ആശയബന്ധം ലളിതമായി നിലനിർത്തുന്നു.
- source_word: ἐν αὐτῷ
  choice: അവനിൽ
  rationale: പുരുഷലിംഗ സർവനാമം സന്ദർഭത്തിൽ ക്രിസ്തുവിനെ സൂചിപ്പിക്കുന്നതാണ് ഏറ്റവും സ്വാഭാവികം; എന്നാൽ മറ്റൊരു വ്യാകരണസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἐν ὑμῖν
  choice: നിങ്ങളിൽ
  rationale: വായനക്കാരിൽ ഈ സത്യം യാഥാർഥ്യമാകുന്നതിനെ നേരിട്ട് പ്രകടിപ്പിക്കുകയും ‘അവനിൽ’ എന്നതിനോടുള്ള സമാന്തരത നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἡ σκοτία παράγεται
  choice: ഇരുട്ട് നീങ്ങിക്കൊണ്ടിരിക്കുന്നു
  rationale: παράγεται സൂചിപ്പിക്കുന്ന തുടരുന്ന അകന്നുപോകൽ/മാഞ്ഞുപോകൽ പ്രക്രിയ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: τὸ φῶς τὸ ἀληθινόν
  choice: യഥാർഥ വെളിച്ചം
  rationale: ἀληθινός എന്നത് യഥാർഥവും അസലുമായതിനെ സൂചിപ്പിക്കുന്നു; യോഹന്നാനീയ വെളിച്ചം–ഇരുട്ട് വിരോധം നിലനിർത്തുന്നു.
- source_word: ἤδη φαίνει
  choice: ഇതിനകം പ്രകാശിക്കുന്നു
  rationale: വെളിച്ചത്തിന്റെ പ്രകാശനം ഇപ്പോൾ തന്നെ ആരംഭിച്ചിരിക്കുന്നുവെന്ന ἤδηയുടെ കാലസൂചന വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: ἐν αὐτῷ എന്നതിലെ αὐτῷയുടെ സൂചിതപദം
  choice: ‘അവനിൽ’—സന്ദർഭത്തിൽ ക്രിസ്തുവിനെ സൂചിപ്പിക്കുന്നു
  alternative: ‘അതിൽ’—കല്പനയെ സൂചിപ്പിക്കുന്നു
  rationale: പുരുഷലിംഗ സർവനാമത്തിന് വ്യക്തിപരമായ സൂചിതപദം സ്വാഭാവികമായതിനാൽ മുഖ്യവാചകത്തിൽ ‘അവനിൽ’ സ്വീകരിച്ചു. എന്നാൽ ബന്ധവാക്യത്തിന്റെ സങ്കീർണത കാരണം കല്പനയെ സൂചിപ്പിക്കുന്ന വായനയും സാധ്യമാണ്; ആ അർഥസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘കല്പന’, ‘ഇരുട്ട്’, ‘വെളിച്ചം’ എന്നീ യോഹന്നാനീയ മുഖ്യപദങ്ങൾ സ്ഥിരമായി നിലനിർത്തി; മൂലത്തിലെ അർഥസന്ദിഗ്ധത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
