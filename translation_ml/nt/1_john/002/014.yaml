id: 1JN.2.14
reference: 1 John 2:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ἔγραψα ὑμῖν, παιδία, ὅτι ἐγνώκατε τὸν πατέρα· ἔγραψα ὑμῖν, πατέρες, ὅτι ἐγνώκατε τὸν ἀπ’ ἀρχῆς· ἔγραψα ὑμῖν, νεανίσκοι, ὅτι ἰσχυροί ἐστε καὶ ὁ λόγος τοῦ θεοῦ ἐν ὑμῖν μένει καὶ νενικήκατε τὸν πονηρόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/014.yaml
  text: I have written to you[a], children, because you have known the Father. I have written to you, fathers, because you have known him who is from the beginning. I have written to you, young men, because you are strong, and the word of God remains in you[c][b], and you have overcome the evil one.
translation:
  language: ml
  text: കുഞ്ഞുങ്ങളേ, ഞാൻ നിങ്ങൾക്കു എഴുതിയിരിക്കുന്നു; കാരണം, നിങ്ങൾ പിതാവിനെ അറിഞ്ഞിരിക്കുന്നു. പിതാക്കന്മാരേ, ഞാൻ നിങ്ങൾക്കു എഴുതിയിരിക്കുന്നു; കാരണം, നിങ്ങൾ ആദിമുതൽ ഉള്ളവനെ അറിഞ്ഞിരിക്കുന്നു.[b] യുവാക്കളേ, ഞാൻ നിങ്ങൾക്കു എഴുതിയിരിക്കുന്നു; കാരണം, നിങ്ങൾ ശക്തരാണ്, ദൈവത്തിന്റെ വചനം നിങ്ങളിൽ നിലനിൽക്കുന്നു,[c] നിങ്ങൾ ദുഷ്ടനായവനെ ജയിച്ചിരിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: വാക്യത്തിലുടനീളം ‘ഞാൻ നിങ്ങൾക്കു എഴുതി’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ ഭൂതകാലരൂപം ലളിതഭൂതകാലമായി നൽകാനാകുമെങ്കിലും, കത്തിന്റെ ഇപ്പോഴത്തെ പ്രസക്തി വ്യക്തമാക്കാൻ ഇവിടെ ‘എഴുതിയിരിക്കുന്നു’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ആദിമുതൽ ഉള്ളവൻ’ എന്നത് യോഹന്നാന്റെ ഭാഷാശൈലിയിൽ മുൻഅസ്തിത്വമുള്ള പുത്രനെ സൂചിപ്പിക്കുന്നതാകാം; എങ്കിലും ഈ വാക്യം ആ വ്യക്തിയെ പേരെടുത്ത് പറയുന്നില്ല.
    reason: alternative_reading
  - marker: c
    text: ‘നിങ്ങളിൽ വസിക്കുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψα
  choice: ഞാൻ നിങ്ങൾക്ക് എഴുതിയിരിക്കുന്നു
  rationale: കത്തിലെ എഴുത്ത് പൂർത്തിയായതും അതിന് ഇപ്പോഴും പ്രസക്തിയുള്ളതുമായ ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; ആവർത്തിച്ചുള്ള വാക്യഘടനയും നിലനിർത്തുന്നു.
- source_word: παιδία
  choice: കുഞ്ഞുങ്ങളേ
  rationale: സ്നേഹപൂർവമായ കുടുംബസംബോധന നിലനിർത്തുന്ന, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗം.
- source_word: ἐγνώκατε
  choice: നിങ്ങൾ അറിഞ്ഞിരിക്കുന്നു
  rationale: മുൻപ് ഉണ്ടായ അറിവിന്റെ ഇപ്പോഴും നിലനിൽക്കുന്ന ഫലം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പൂർണകാലഭാവം സംരക്ഷിക്കുന്നു.
- source_word: τὸν πατέρα
  choice: പിതാവിനെ
  rationale: യോഹന്നാന്റെ പ്രയോഗത്തിൽ ദൈവത്തെ സൂചിപ്പിക്കുന്ന ബന്ധപരമായ ദൈവിക അഭിധാനമാണ്.
- source_word: πατέρες
  choice: പിതാക്കന്മാരേ
  rationale: പ്രായത്തെയോ ആത്മീയ പക്വതയെയോ സൂചിപ്പിക്കാവുന്ന മൂലപദത്തിന്റെ കുടുംബരൂപകവും ത്രിഭാഗസംബോധനയും നിലനിർത്തുന്നു.
- source_word: τὸν ἀπ’ ἀρχῆς
  choice: ആദിമുതലുള്ളവനെ
  rationale: ആ വ്യക്തി ആരാണെന്ന് വാക്യം വ്യക്തമാക്കാത്തതിനാൽ പേര് ചേർക്കാതെ, ഗ്രീക്കിലെ വ്യക്തിപരമായ നിർദിഷ്ട പ്രയോഗവും കാലാതീതമായ ഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: νεανίσκοι
  choice: യുവാക്കളേ
  rationale: പുരുഷ ബഹുവചനത്തിന്റെ നേരിട്ടുള്ള, ആധുനിക മലയാള സമാനപ്രയോഗം; ‘പിതാക്കന്മാർ’ എന്ന വിഭാഗവുമായുള്ള വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: ἰσχυροί
  choice: ശക്തരാണ്
  rationale: ധാർമിക-ആത്മീയ പശ്ചാത്തലത്തിൽ ലളിതവും നേരിട്ടുള്ളതുമായ പരിഭാഷ.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ വചനം
  rationale: ദൈവത്തിന്റെ സന്ദേശമെന്ന പൊതുവായ അർഥവും സുവിശേഷപ്രഘോഷണമെന്ന പ്രത്യേക ഊന്നലും നിർബന്ധമായി വേർതിരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: μένει
  choice: നിലനിൽക്കുന്നു
  rationale: യോഹന്നാന്റെ പ്രധാന പദമായ μένωയുടെ തുടർച്ചയും സ്ഥിരതയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: νενικήκατε
  choice: നിങ്ങൾ ജയിച്ചിരിക്കുന്നു
  rationale: പൂർത്തിയായ ജയത്തിനുള്ള ഇപ്പോഴത്തെ നിലനിൽക്കുന്ന പ്രാധാന്യം ഗ്രീക്ക് പൂർണകാലത്തിന് അനുസൃതമായി നൽകുന്നു.
- source_word: τὸν πονηρόν
  choice: ദുഷ്ടനെ
  rationale: ലേഖനസന്ദർഭത്തിലും വ്യാകരണരൂപത്തിലും ഇത് അമൂർത്തമായ തിന്മയേക്കാൾ വ്യക്തിപരമായ ദുഷ്ടനെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘ആദിമുതലുള്ളവൻ’ എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: ക്രിസ്തുവെന്നോ പുത്രനെന്നോ പേരിട്ട് വ്യക്തമാക്കാതെ ‘ആദിമുതലുള്ളവൻ’ എന്നു നിലനിർത്തി.
  alternative: ഇത് ക്രിസ്തുവിനെയോ പുത്രനെയോ വ്യക്തമായി സൂചിപ്പിക്കുന്നതായി പരിഭാഷപ്പെടുത്തുക; അല്ലെങ്കിൽ പൊതുവായി ദൈവത്തെ സൂചിപ്പിക്കുന്നതായി വ്യാഖ്യാനിക്കുക.
  rationale: യോഹന്നാന്റെ ഭാഷാശൈലി മുൻഅസ്തിത്വമുള്ള പുത്രനെ ശക്തമായി സൂചിപ്പിച്ചേക്കാമെങ്കിലും, ഈ വാക്യം ആ വ്യക്തിയെ പേരെടുത്ത് പറയുന്നില്ല. അതിനാൽ മൂലപാഠത്തിലെ തുറന്ന നില സംരക്ഷിച്ചു.
- issue: ത്രിഭാഗസംബോധനയിലെ ലിംഗസൂചന
  choice: παιδία എന്നത് ‘കുഞ്ഞുങ്ങൾ’ എന്നും πατέρες/νεανίσκοι എന്നിവ ‘പിതാക്കന്മാർ’/‘യുവാക്കൾ’ എന്നും പരിഭാഷപ്പെടുത്തി.
  alternative: മൂന്നു വിഭാഗങ്ങളെയും സഭയിലെ എല്ലാവരെയും ഉൾക്കൊള്ളുന്ന ലിംഗനിരപേക്ഷ പ്രായവിഭാഗങ്ങളായി പരിഭാഷപ്പെടുത്തുക.
  rationale: ഗ്രീക്കിലെ ആദ്യപദം പൊതുവായ കുടുംബസംബോധനയായിരിക്കുമ്പോൾ ശേഷിക്കുന്ന രണ്ടും പുരുഷരൂപങ്ങളാണ്. അവയുടെ രൂപകപരമോ പ്രതിനിധാനപരമോ ആയ വ്യാപ്തി പരിഭാഷയിൽ നിർബന്ധമായി തീർപ്പാക്കാതെ പദരൂപം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ആദരപൂർവവും വായിക്കാൻ എളുപ്പമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ ആവർത്തനാത്മക വാക്യഘടനയും പൂർണകാലത്തിന്റെ ഇപ്പോഴത്തെ പ്രസക്തിയും കഴിയുന്നത്ര സംരക്ഷിച്ചു; അവസാന ദീർഘകാരണമാല മലയാളത്തിൽ വ്യക്തതയോടെ ബന്ധിപ്പിച്ചു.
