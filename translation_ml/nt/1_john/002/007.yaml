id: 1JN.2.7
reference: 1 John 2:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀Ἀγαπητοί, οὐκ ἐντολὴν καινὴν γράφω ὑμῖν, ἀλλ’ ἐντολὴν παλαιὰν ἣν εἴχετε ἀπ’ ἀρχῆς· ἡ ἐντολὴ ἡ παλαιά ἐστιν ὁ λόγος ὃν ⸀ἠκούσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/007.yaml
  text: Beloved[a], I am not writing a new commandment to you, but an old commandment that you have had from the beginning. The old commandment is the message that you heard.
translation:
  language: ml
  text: പ്രിയരേ, ഞാൻ നിങ്ങൾക്കു പുതിയൊരു കല്പനയല്ല എഴുതുന്നത്; മറിച്ച്, ആദിമുതൽ നിങ്ങൾക്കുണ്ടായിരുന്ന പഴയ കല്പനയാണ് എഴുതുന്നത്. ആ പഴയ കല്പന നിങ്ങൾ കേട്ട സന്ദേശം[a] തന്നെയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ ‘വചനം’: ‘ആ പഴയ കല്പന നിങ്ങൾ കേട്ട വചനം തന്നെയാണ്.’'
    reason: λόγος എന്ന പദത്തിന്റെ കൂടുതൽ ശാബ്ദികമായ വിവർത്തനസാധ്യത സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: പ്രിയരേ
  rationale: സ്നേഹപൂർവമായ ബഹുവചന സംബോധന സ്വാഭാവികവും മാന്യവുമായി നൽകുന്നു; ἀγαπάω/ἀγάπη എന്ന പദകുടുംബത്തിന്റെ സ്നേഹധ്വനിയും നിലനിർത്തുന്നു.
- source_word: ἐντολήν
  choice: കല്പന
  rationale: യോഹന്നാന്റെ രചനകളിലെ ദൈവശാസ്ത്രപരമായ ഭാരം നിലനിർത്തുന്ന പതിവും വ്യക്തവുമായ മലയാളപദം.
- source_word: καινήν
  choice: പുതിയ
  rationale: παλαιός എന്നതിനോടുള്ള നേരിട്ടുള്ള വൈരുധ്യം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: γράφω
  choice: ഞാൻ ... എഴുതുന്നത്
  rationale: കത്ത് എഴുതിക്കൊണ്ടിരിക്കുന്ന ഇപ്പോഴത്തെ പ്രവൃത്തിയെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: παλαιάν / παλαιά
  choice: പഴയ
  rationale: ‘പുതിയ’ എന്നതിനോടുള്ള നേരിട്ടുള്ള വൈരുധ്യവും ദീർഘകാലമായി ലഭിച്ചിരുന്ന കല്പന എന്ന ആശയവും സംരക്ഷിക്കുന്നു.
- source_word: εἴχετε
  choice: നിങ്ങൾക്കുണ്ടായിരുന്ന
  rationale: അപൂർണ്ണ ഭൂതകാലരൂപം സൂചിപ്പിക്കുന്ന തുടർന്നുള്ള കൈവശാവസ്ഥയെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ഇപ്പോഴും ഉണ്ടെന്നത് അനാവശ്യമായി വിശദീകരിക്കുന്നില്ല.
- source_word: ἀπ’ ἀρχῆς
  choice: ആദിമുതൽ
  rationale: യോഹന്നാന്റെ സവിശേഷ പ്രയോഗത്തിന്റെ വിശാലത നിലനിർത്തുന്നു; ഏത് ആരംഭമാണെന്ന് വിവർത്തനം നിർണ്ണയിക്കുന്നില്ല.
- source_word: λόγος
  choice: സന്ദേശം
  rationale: ഇവിടെ കേട്ടറിയിച്ച ഉള്ളടക്കത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു. ‘വചനം’ എന്ന ശാബ്ദിക സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἠκούσατε
  choice: നിങ്ങൾ കേട്ട
  rationale: അഓറിസ്റ്റ് രൂപത്തെ ലളിതമായ ഭൂതകാലമായി സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: ‘ആദിമുതൽ’ എന്നതിന്റെ സൂചിതകാലം
  choice: ഏത് ആരംഭമാണെന്ന് വ്യക്തമാക്കാതെ ‘ആദിമുതൽ’ എന്നു നിലനിർത്തി
  alternative: നിങ്ങളുടെ ക്രിസ്തീയജീവിതത്തിന്റെ ആരംഭംമുതൽ / സുവിശേഷപ്രഘോഷണത്തിന്റെ ആരംഭംമുതൽ
  rationale: സമീപസന്ദർഭം വായനക്കാർ ആദ്യം കേട്ട ഉപദേശത്തെ സൂചിപ്പിച്ചേക്കാമെങ്കിലും ഗ്രീക്ക് വാചകം അത് കൃത്യമായി പരിമിതപ്പെടുത്തുന്നില്ല.
- issue: ‘പഴയ കല്പന’യും കേട്ട ‘സന്ദേശ’വും തമ്മിലുള്ള ബന്ധം
  choice: ഗ്രീക്കിലുള്ള സമീകരണം വിശദീകരണമൊന്നും ചേർക്കാതെ നേരിട്ട് നിലനിർത്തി
  alternative: സമീപവാക്യങ്ങളിലെ സ്നേഹകല്പനയെ ഇവിടെ തുറന്നുപറഞ്ഞ് ചേർക്കുക
  rationale: മൂലവാചകം പഴയ കല്പനയെ അവർ കേട്ട λόγος-നോടു സമീകരിക്കുന്നു; സന്ദർഭത്തിൽ നിന്നുള്ള വിശദീകരണം വിവർത്തനത്തിനുള്ളിൽ ഇറക്കുമതി ചെയ്യരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘പ്രിയരേ’ അപ്പൊസ്തലന്റെ ഊഷ്മളമായ ഇടയസംബോധന നിലനിർത്തുന്നു. വാക്യഘടന വ്യക്തതയ്ക്കായി മലയാളത്തിന് സ്വാഭാവികമായി ക്രമപ്പെടുത്തി; എന്നാൽ ‘പുതിയ/പഴയ’, ‘ആദിമുതൽ’, കല്പനയും സന്ദേശവും തമ്മിലുള്ള സമീകരണം എന്നിവ മാറ്റമില്ലാതെ സംരക്ഷിച്ചു.
