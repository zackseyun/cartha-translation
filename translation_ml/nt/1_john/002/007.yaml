  source_fidelity: The draft accurately preserves the vocative address, the new/old contrast, the deliberately broad ‘from the beginning,’ and the equation of the old commandment with what the readers heard. The imperfect εἴχετε is adequately represented by ‘നിങ്ങൾക്കുണ്ടായിരുന്ന.’
