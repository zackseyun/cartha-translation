    rationale: The draft’s ‘പിന്നെയോ’ does not idiomatically render ἀλλ’ (‘but/rather’) in this context. Replacing it with ‘മറിച്ച്’ and supplying ‘എഴുതുന്നത്’ in the contrasting clause preserves the Greek sense while yielding natural Malayalam.
