id: 1JN.2.28
reference: 1 John 2:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ νῦν, τεκνία, μένετε ἐν αὐτῷ, ἵνα ⸀ἐὰν φανερωθῇ ⸀σχῶμεν παρρησίαν καὶ μὴ αἰσχυνθῶμεν ἀπ’ αὐτοῦ ἐν τῇ παρουσίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/028.yaml
  text: And now[a], little children, remain in him, so that if he is revealed[c][b], we may have confidence and not shrink away from him in shame at his coming.
translation:
  language: ml
  text: ഇപ്പോൾ, കുഞ്ഞുമക്കളേ, അവനിൽ നിലനിൽക്കുവിൻ. അങ്ങനെ, അവൻ പ്രത്യക്ഷനാകുമ്പോൾ[a], നമുക്കു ധൈര്യമുണ്ടാകുകയും അവന്റെ വരവിൽ[b] അവനിൽനിന്ന് ലജ്ജയോടെ പിൻവാങ്ങാതിരിക്കുകയും[c] ചെയ്യാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൻ വെളിപ്പെടുമ്പോൾ.” ഗ്രീക്കിലെ ക്രിയ നിഷ്ക്രിയരൂപത്തിലാണ്; “അവൻ വെളിപ്പെടുന്നു/പ്രത്യക്ഷനാകുന്നു” എന്ന അർഥം നൽകുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അവന്റെ സാന്നിധ്യത്തിൽ.” ഈ സന്ദർഭത്തിൽ ‘വരവ്’ ഗ്രീക്ക് പദത്തിന്റെ അന്ത്യകാലപരമായ, സംഭവാത്മകമായ അർഥം വ്യക്തമാക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “അവന്റെ മുമ്പിൽ ലജ്ജിക്കാതിരിക്കുകയും.” ഈ പ്രയോഗം അവനിൽനിന്ന് ലജ്ജയോടെ പിൻവാങ്ങുന്നതിനെക്കാൾ, അവന്റെ സന്നിധിയിൽ ലജ്ജിക്കുന്നതായും മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: τεκνία
  choice: കുഞ്ഞുമക്കളേ
  rationale: സ്നേഹപൂർവമായ കുടുംബബന്ധവും ലഘുരൂപത്തിന്റെ ഭാവവും നിലനിർത്തുന്ന അഭിസംബോധന.
- source_word: μένετε
  choice: നിലനിൽക്കുവിൻ
  rationale: യോഹന്നാന്റെ രചനകളിലെ തുടർച്ചയായ ബന്ധത്തിന്റെ ആശയം വ്യക്തവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐν αὐτῷ
  choice: അവനിൽ
  rationale: ബന്ധപരമായ യോഹന്നാനീയ രൂപകം വിശദീകരിച്ച് ചുരുക്കാതെ നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: φανερωθῇ
  choice: അവൻ വെളിപ്പെട്ടാൽ
  rationale: ക്രിയയുടെ പ്രത്യക്ഷീകരണഭാവവും ἐὰν നൽകുന്ന നിബന്ധനാരൂപവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: σχῶμεν παρρησίαν
  choice: നമുക്ക് ധൈര്യമുണ്ടാകുകയും
  rationale: ദൈവസന്നിധിയിലെ തുറന്ന ആത്മവിശ്വാസം സൂചിപ്പിക്കുന്നു; വെല്ലുവിളിപരമായ ധാർഷ്ട്യം എന്ന അർഥം ഒഴിവാക്കുന്നു.
- source_word: αἰσχυνθῶμεν ἀπ’ αὐτοῦ
  choice: ലജ്ജിച്ച് അവനിൽനിന്ന് പിൻവാങ്ങാതിരിക്കുകയും
  rationale: ലജ്ജയുടെ വികാരവും ἀπό സൂചിപ്പിക്കുന്ന അകന്നുപോകൽഭാവവും ഒരുമിച്ച് പ്രകടിപ്പിക്കുന്നു; ന്യായവിധിയിലെ ശിക്ഷയെ അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: παρουσίᾳ
  choice: വരവിൽ
  rationale: ഈ അന്ത്യകാലസന്ദർഭത്തിലെ ക്രിസ്തുവിന്റെ ഭാവിവരവിനെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ‘സാന്നിധ്യം’ എന്ന കൂടുതൽ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: സർവനാമങ്ങളുടെ സൂചിതവ്യക്തിയും അന്ത്യകാല വെളിപ്പെടലും
  choice: സന്ദർഭപ്രകാരം ‘അവൻ’ പുത്രനായ യേശുക്രിസ്തുവിനെ സൂചിപ്പിക്കുന്നു; വാക്യം അവന്റെ ഭാവിവെളിപ്പെടലിനെയും വരവിനെയും കുറിച്ചാണ്.
  alternative: ആരാണെന്ന് നിർദിഷ്ടമാക്കാതെ പൊതുവായി ദൈവത്തെ സൂചിപ്പിക്കുന്നു എന്ന വായന.
  rationale: സമീപസന്ദർഭം പുത്രനിൽ നിലനിൽക്കുന്നതിലും അവന്റെ വെളിപ്പെടലിലും കേന്ദ്രീകരിക്കുന്നു. എന്നാൽ മൂലത്തിലെ സർവനാമരൂപം തന്നെയാണ് പരിഭാഷയിലും ഉപയോഗിച്ചത്; ‘ക്രിസ്തു’ എന്ന് പാഠത്തിൽ കൂട്ടിച്ചേർത്തിട്ടില്ല.
- issue: വരവിലെ ലജ്ജയുടെ സ്വഭാവം
  choice: അവന്റെ വരവിൽ ലജ്ജിച്ച് അവനിൽനിന്ന് പിൻവാങ്ങുക എന്ന ബന്ധപരമായ മുന്നറിയിപ്പ്.
  alternative: ‘അവന്റെ മുമ്പിൽ ലജ്ജിക്കുക’ എന്ന ലളിതമായ വായന.
  rationale: αἰσχυνθῶμεν എന്ന ക്രിയയോടൊപ്പം ἀπ’ αὐτοῦ വന്നതിനാൽ ലജ്ജയും അകന്നുപോകലും ചേർന്ന ഭാവം സാദ്ധ്യമാണ്; ഇതിനെ അന്തിമശിക്ഷയായി വ്യാഖ്യാനിച്ച് അതിരുകടക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘നിലനിൽക്കുവിൻ’ എന്ന രൂപം ഗൗരവമുള്ള ബഹുവചന ആജ്ഞയും യോഹന്നാനീയ മുഖ്യപദത്തിന്റെ ആവർത്തനയോഗ്യതയും സംരക്ഷിക്കുന്നു. ദൈവശാസ്ത്രപരമായ രൂപകങ്ങൾ അനാവശ്യമായി വിശദീകരിച്ചിട്ടില്ല.
