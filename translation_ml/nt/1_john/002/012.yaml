id: 1JN.2.12
reference: 1 John 2:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Γράφω ὑμῖν, τεκνία, ὅτι ἀφέωνται ὑμῖν αἱ ἁμαρτίαι διὰ τὸ ὄνομα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/012.yaml
  text: I am writing to you[a], little children[c][b], because your sins have been forgiven for the sake of his name.
translation:
  language: ml
  text: കുഞ്ഞുമക്കളേ, ഞാൻ നിങ്ങൾക്കു എഴുതുന്നത്[a] അവന്റെ[c] നാമം നിമിത്തം നിങ്ങളുടെ പാപങ്ങൾ ക്ഷമിക്കപ്പെട്ടിരിക്കുന്നതിനാലാണ്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ നിങ്ങൾക്കു എഴുതുന്നു.” ഗ്രീക്ക് വർത്തമാനകാലം ലളിതവർത്തമാനമായോ, ലേഖനസന്ദർഭത്തിൽ ഇപ്പോൾ നടന്നുകൊണ്ടിരിക്കുന്ന എഴുത്തുപ്രവൃത്തിയായോ വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “നിങ്ങളുടെ പാപങ്ങൾ ക്ഷമിക്കപ്പെട്ടിരിക്കുന്നു എന്ന്.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് സംയോജകപദം എഴുത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നതായും വായിക്കാം; എങ്കിലും ഈ സന്ദർഭത്തിൽ എഴുത്തിന്റെ കാരണം നൽകുന്നതായിരിക്കാനാണ് കൂടുതൽ സാധ്യത.
    reason: alternative_reading
  - marker: c
    text: “അവന്റെ” എന്നത് സന്ദർഭത്തിൽ ദൈവത്തെയോ യേശുവിനെയോ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം; ഗ്രീക്ക് പാഠം ഇവിടെ സൂചിതവ്യക്തിയെ പേരെടുത്തു പറയുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: Γράφω
  choice: ഞാൻ നിങ്ങൾക്ക് എഴുതുന്നത്
  rationale: ലേഖനസന്ദർഭത്തിലെ ഗ്രീക്ക് വർത്തമാനകാലത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി പുരോഗമിക്കുന്ന എഴുത്തുപ്രവൃത്തിയായി അവതരിപ്പിക്കുന്നു; ലളിതവർത്തമാനമായും മനസ്സിലാക്കാം.
- source_word: τεκνία
  choice: കുഞ്ഞുമക്കളേ
  rationale: പ്രായത്തെ മാത്രം സൂചിപ്പിക്കാതെ സ്നേഹവും കുടുംബബന്ധവും പ്രകടിപ്പിക്കുന്ന സംബോധന; ഗ്രീക്കിലെ diminutive ഭാവം നിലനിർത്തുന്നു.
- source_word: ὅτι
  choice: എഴുതുന്നത് … ആയതിനാലാണ്
  rationale: ഇവിടെ ὅτι എഴുത്തിന്റെ കാരണം അവതരിപ്പിക്കുന്നതായി സന്ദർഭം സൂചിപ്പിക്കുന്നു; ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന ‘എന്ന്’ എന്ന വായനയും വ്യാകരണപരമായി സാധ്യമാണ്.
- source_word: ἀφέωνται
  choice: ക്ഷമിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: പൂർണ്ണമായ ഒരു പ്രവൃത്തിയുടെ നിലനിൽക്കുന്ന ഫലം സൂചിപ്പിക്കുന്ന perfect passive രൂപവും passive voice-ഉം മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: αἱ ἁμαρτίαι ... ὑμῖν
  choice: നിങ്ങളുടെ പാപങ്ങൾ
  rationale: ക്ഷമയുടെ സ്വീകർത്താക്കളെ സൂചിപ്പിക്കുന്ന ὑμῖν എന്ന ദത്തിവിഭക്തിയോടുള്ള ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളാവിഷ്കാരം.
- source_word: διὰ τὸ ὄνομα αὐτοῦ
  choice: അവന്റെ നാമംനിമിത്തം
  rationale: διά + accusative സൂചിപ്പിക്കുന്ന കാരണം/അടിസ്ഥാനം നിലനിർത്തുകയും ‘നാമം’ എന്ന ബൈബിൾപരമായ വ്യക്തിപരവും ദൈവശാസ്ത്രപരവുമായ അർത്ഥഭാരം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ὄνομα
  choice: നാമം
  rationale: ‘പ്രശസ്തി’ എന്നതിലേക്കു ചുരുക്കാതെ വ്യക്തിയെയും അധികാരത്തെയും പ്രതിനിധീകരിക്കുന്ന ബൈബിൾപരമായ പ്രയോഗം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘അവന്റെ നാമം’ എന്നതിലെ ‘അവൻ’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: പ്രധാനപാഠത്തിൽ ‘അവന്റെ’ എന്നു മാത്രം നിലനിർത്തി
  alternative: ദൈവം; യേശുക്രിസ്തു
  rationale: ഈ വാക്യം തന്നെ മുൻപദത്തിന്റെ സൂചിതവ്യക്തിയെ വ്യക്തമായി പേരെടുത്തു പറയുന്നില്ല; അതിനാൽ സന്ദർഭത്തെ അടിസ്ഥാനമാക്കിയുള്ള ഒരു വ്യാഖ്യാനം പാഠത്തിലേക്ക് നിർബന്ധിച്ച് ചേർക്കാതെ ഗ്രീക്കിലെ അനിശ്ചിതത്വം സംരക്ഷിച്ചു.
- issue: ὅτι കാരണമോ ഉള്ളടക്കമോ അവതരിപ്പിക്കുന്നുവോ
  choice: 'കാരണം: ‘ആയതിനാലാണ്’'
  alternative: 'ഉള്ളടക്കം: ‘എന്ന്’'
  rationale: ചുറ്റുമുള്ള വാക്യങ്ങളിലെ ആവർത്തനഘടനയിൽ എഴുത്തിന്റെ കാരണം എന്ന വായന കൂടുതൽ യോജിക്കുന്നു; എന്നാൽ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന വായനയും സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘കുഞ്ഞുമക്കളേ’ സ്നേഹപൂർവമായ കുടുംബസംബോധന നിലനിർത്തുന്നു. ‘നാമംനിമിത്തം’ എന്നത് സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതോടൊപ്പം മൂലപാഠത്തിന്റെ ബൈബിൾപരമായ ഭാരം സംരക്ഷിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പാഠസ്ഥാനങ്ങളിൽ ചേർത്തിരിക്കുന്നു.
