id: 1JN.2.3
reference: 1 John 2:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἐν τούτῳ γινώσκομεν ὅτι ἐγνώκαμεν αὐτόν, ἐὰν τὰς ἐντολὰς αὐτοῦ τηρῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/003.yaml
  text: 'And by this we know that we have come to know him: if we keep his commandments[a].'
translation:
  language: ml
  text: നാം അവന്റെ കല്പനകൾ പാലിക്കുന്നെങ്കിൽ, അവനെ അറിഞ്ഞിരിക്കുന്നുവെന്ന് ഇതിലൂടെയാണ് നാം അറിയുന്നത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: ‘നാം അവനെ അറിഞ്ഞിട്ടുണ്ടെന്ന്.’ ഗ്രീക്ക് പൂർണകാലരൂപം അവനെ അറിഞ്ഞതും അതിന്റെ ഇപ്പോഴത്തെ ഫലവും സൂചിപ്പിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: ഇതിനാൽ
  rationale: അറിയുന്നതിനുള്ള തെളിവോ അടിസ്ഥാനമോ പരിചയപ്പെടുത്തുന്ന യോഹന്നാനീയ പ്രയോഗത്തിന്റെ സൂചനാഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: γινώσκομεν
  choice: നാം അറിയുന്നു
  rationale: വർത്തമാനകാലത്തിലുള്ള ഇപ്പോഴത്തെ തിരിച്ചറിവോ ഉറപ്പോ ലളിതവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὅτι ἐγνώκαμεν αὐτόν
  choice: നാം അവനെ അറിഞ്ഞിരിക്കുന്നുവെന്ന്
  rationale: ഗ്രീക്ക് പൂർണകാലം സൂചിപ്പിക്കുന്ന മുൻപ് ഉണ്ടായ അറിവും അതിന്റെ തുടരുന്ന ഫലവും മലയാളത്തിലെ ‘അറിഞ്ഞിരിക്കുന്നു’ എന്ന രൂപം സംക്ഷിപ്തമായി ഉൾക്കൊള്ളുന്നു; ആരംഭഭാവം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: αὐτόν
  choice: അവനെ
  rationale: ഗ്രീക്ക് മൂലത്തിലെ സർവനാമം നിലനിർത്തി അത് ദൈവമോ ക്രിസ്തുവോ എന്നു വിവർത്തനത്തിൽ അമിതമായി നിർണയിക്കുന്നത് ഒഴിവാക്കുന്നു.
- source_word: ἐὰν
  choice: എങ്കിൽ
  rationale: തെളിവായി പ്രവർത്തിക്കുന്ന നിബന്ധനയെ നേരിട്ടും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
- source_word: ἐντολάς
  choice: കല്പനകൾ
  rationale: യോഹന്നാനീയ സന്ദർഭത്തിലെ ധാർമ്മികവും ഉടമ്പടിസംബന്ധവുമായ ഭാരമുള്ള അർഥം സാധാരണ മലയാള ബൈബിൾ രജിസ്റ്ററിൽ നിലനിർത്തുന്നു.
- source_word: τηρῶμεν
  choice: നാം പാലിക്കുന്നെങ്കിൽ
  rationale: τηρέω എന്നതിലെ സൂക്ഷിച്ചു ആചരിക്കുക, അനുസരിക്കുക എന്നീ ആശയങ്ങൾ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘കാത്തുസൂക്ഷിക്കുക’ എന്ന അത്യന്തം പദാനുപദ രൂപത്തിന്റെ അസ്വാഭാവികത ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: αὐτόν (‘അവനെ’) എന്ന സർവനാമത്തിന്റെ സൂചിതവ്യക്തി
  choice: പ്രധാന പാഠത്തിൽ ‘അവനെ’ എന്ന സർവനാമം നിലനിർത്തുക.
  alternative: ‘ദൈവത്തെ’ എന്നോ ‘യേശുവിനെ/ക്രിസ്തുവിനെ’ എന്നോ വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്ക് പാഠം സർവനാമം മാത്രമാണ് ഉപയോഗിക്കുന്നത്. ദൈവത്തെ അറിയുന്നതും പുത്രനോടുള്ള ബന്ധവും തമ്മിലുള്ള അടുത്ത ബന്ധം സന്ദർഭം നിലനിർത്തുന്നതിനാൽ, ഒരു സൂചിതവ്യക്തിയെ മാത്രം നിർബന്ധമായി തിരഞ്ഞെടുക്കുന്നത് പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം അനാവശ്യമായി പരിഹരിക്കും.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. തെളിവിനെ ഊന്നിപ്പറയാൻ നിബന്ധനാവാക്യം ആദ്യം വെച്ചിരിക്കുന്നു; ഇതിലൂടെ ഗ്രീക്കിലെ ആശയബന്ധം നിലനിൽക്കുന്നു. ‘കല്പനകൾ’ ബൈബിൾസംബന്ധമായ ഗൗരവം കാത്തുസൂക്ഷിക്കുമ്പോഴും സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
