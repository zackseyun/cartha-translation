id: 1JN.2.18
reference: 1 John 2:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Παιδία, ἐσχάτη ὥρα ἐστίν, καὶ καθὼς ἠκούσατε ⸀ὅτι ἀντίχριστος ἔρχεται, καὶ νῦν ἀντίχριστοι πολλοὶ γεγόνασιν· ὅθεν γινώσκομεν ὅτι ἐσχάτη ὥρα ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/018.yaml
  text: Children[a], it is the last hour, and just as you heard that antichrist is coming, even now many antichrists have arisen[b]. From this we know that it is the last hour.
translation:
  language: ml
  text: കുഞ്ഞുങ്ങളേ, ഇത് അന്ത്യനാഴികയാണ്. എതിർക്രിസ്തു വരുന്നു[a] എന്നു നിങ്ങൾ കേട്ടതുപോലെതന്നെ, ഇപ്പോൾത്തന്നെ അനേകം എതിർക്രിസ്തുക്കൾ ഉണ്ടായിരിക്കുന്നു[b]. ഇതിൽനിന്ന് ഇത് അന്ത്യനാഴികയാണെന്ന് നാം അറിയുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആ എതിർക്രിസ്തു വരുന്നു.” ഗ്രീക്കിൽ ഈ നാമത്തിന് നിർദേശക ഉപപദമില്ലെങ്കിലും, മുമ്പേ അറിയപ്പെട്ടിരുന്ന പ്രതീക്ഷിത വ്യക്തിയെ സൂചിപ്പിക്കുന്നതായി ഇതിനെ മനസ്സിലാക്കാം.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, “പ്രത്യക്ഷപ്പെട്ടിരിക്കുന്നു” അല്ലെങ്കിൽ “വന്നിരിക്കുന്നു.” ഗ്രീക്കിലെ പൂർണകാലക്രിയ, അനേകം എതിർക്രിസ്തുക്കൾ രംഗപ്രവേശം ചെയ്തതും ഇപ്പോൾ സന്നിഹിതരാണെന്നതും ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παιδία
  choice: കുഞ്ഞുങ്ങളേ
  rationale: വിളിസംബോധനയായ ഈ പദത്തിന്റെ കുടുംബസ്നേഹവും ഇടയപരിപാലനഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; പ്രായത്തെക്കുറിച്ചുള്ള കർശനമായ അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: ἐσχάτη ὥρα
  choice: അന്ത്യനാഴിക
  rationale: കൃത്യമായ അറുപത് മിനിറ്റിനെ സൂചിപ്പിക്കാതെ, മൂലപാഠത്തിലെ കാലസംബന്ധമായ അന്ത്യകാല രൂപകം സംക്ഷിപ്തമായും ഗൗരവത്തോടെയും നിലനിർത്തുന്നു.
- source_word: καθὼς ἠκούσατε
  choice: നിങ്ങൾ കേട്ടതുപോലെതന്നെ
  rationale: വായനക്കാർ മുമ്പ് സ്വീകരിച്ച ഉപദേശത്തോടുള്ള വ്യക്തമായ പൊരുത്തം καθὼς എന്ന താരതമ്യപ്രയോഗത്തിന്റെ ഊന്നലോടെ അറിയിക്കുന്നു.
- source_word: ἀντίχριστος
  choice: എതിർക്രിസ്തു
  rationale: യോഹന്നാന്റെ രചനകളിലെ സവിശേഷ പദം നിലനിർത്തുകയും ἀντί എന്ന ഘടകത്തിലെ എതിർപ്പിന്റെ ആശയം സാധാരണ മലയാളവായനക്കാർക്ക് വ്യക്തമാക്കുകയും ചെയ്യുന്നു. ഗ്രീക്കിൽ നിർദേശക ഉപപദമില്ലാത്തതിനാൽ പ്രധാനവാചകത്തിൽ നിർദിഷ്ടത അധികമായി ചേർക്കുന്നില്ല.
- source_word: ἔρχεται
  choice: വരുന്നു
  rationale: പ്രതീക്ഷിക്കപ്പെടുന്ന വരവിനെ സൂചിപ്പിക്കുന്ന വർത്തമാനകാലത്തിന്റെ ഭാവിദിശ മലയാളത്തിൽ സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
- source_word: καὶ νῦν
  choice: ഇപ്പോൾത്തന്നെ
  rationale: പ്രതീക്ഷിക്കപ്പെട്ട വരവും നിലവിൽ കാണുന്ന അനേകരും തമ്മിലുള്ള ഊന്നിയ വൈരുധ്യം പ്രകടമാക്കുന്നു.
- source_word: ἀντίχριστοι πολλοὶ
  choice: അനേകം എതിർക്രിസ്തുക്കൾ
  rationale: ഏകവചനവും ബഹുവചനവും തമ്മിലുള്ള ഉദ്ദേശ്യപൂർവമായ പദബന്ധം അതേ പദം ഉപയോഗിച്ച് നിലനിർത്തുന്നു.
- source_word: γεγόνασιν
  choice: ഉണ്ടായിരിക്കുന്നു
  rationale: γίνομαι എന്ന ക്രിയയുടെ പൂർണകാലം സൂചിപ്പിക്കുന്ന, അവർ രംഗപ്രവേശം ചെയ്തതും ഇപ്പോഴും നിലവിലുണ്ടെന്നതുമായ അർഥം മലയാളത്തിലെ പൂർത്തീകരണ-നിലവസ്ഥാ രൂപത്തിലൂടെ നൽകുന്നു.
- source_word: ὅθεν γινώσκομεν
  choice: ഇതിൽനിന്ന് ... നാം അറിയുന്നു
  rationale: മുമ്പ് പറഞ്ഞ അനേകം എതിർക്രിസ്തുക്കളുടെ സാന്നിധ്യത്തിൽനിന്നുള്ള നിഗമനബന്ധം പ്രകടമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘അന്ത്യനാഴിക’യുടെ അർഥം
  choice: മൂലത്തിലെ അന്ത്യകാലസംബന്ധമായ കാലരൂപകം വിശദീകരിക്കാതെ ‘അന്ത്യനാഴിക’ എന്നു നിലനിർത്തി.
  alternative: കൃത്യമായി സമീപിച്ചിരിക്കുന്ന ഒരു സമയബിന്ദുവെന്നോ വെറും പ്രതിസന്ധിക്കാലമെന്നോ വ്യാഖ്യാനിച്ച് പരിഭാഷപ്പെടുത്തുക.
  rationale: സന്ദർഭം രക്ഷാചരിത്രത്തിന്റെ നിർണായകമായ അന്ത്യഘട്ടത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, വിശദമായ അന്ത്യകാലക്രമം വാചകത്തിൽ അടിച്ചേൽപ്പിക്കാതെ യഥാർഥ രൂപകവും അതിലെ സംഘർഷവും സംരക്ഷിക്കണം.
- issue: ഏകവചനമായ ‘എതിർക്രിസ്തു’വും ബഹുവചനമായ ‘എതിർക്രിസ്തുക്കൾ’വും തമ്മിലുള്ള ബന്ധം
  choice: പ്രതീക്ഷിക്കപ്പെടുന്ന ഏകവചനത്തെയും ഇപ്പോഴുള്ള ബഹുവചനത്തെയും സമന്വയിപ്പിക്കാതെ അതേപടി നിലനിർത്തി.
  alternative: ഏകവചനത്തെ ഒരു പൊതുവർഗമായി മാത്രം വ്യക്തമാക്കുക, അല്ലെങ്കിൽ നിർവചിക്കപ്പെട്ട ഒരൊറ്റ വ്യക്തിയാണെന്ന് പരിഭാഷയിൽ തുറന്നുപറയുക.
  rationale: യോഹന്നാൻ ഉദ്ദേശ്യപൂർവം ഇവയെ ചേർത്തുനിർത്തുന്നു; ഒരു പ്രത്യേക അന്ത്യകാല സിദ്ധാന്തത്തിലൂടെ ആ സംഘർഷം പരിഹരിക്കുന്നത് പരിഭാഷയുടെ ചുമതലയല്ല.
- issue: ἀντίχριστος എന്ന പദത്തിന്റെ നിർദിഷ്ടത
  choice: ഗ്രീക്കിലെ ഉപപദരാഹിത്യം മാനിച്ച് പ്രധാനവാചകത്തിൽ ‘എതിർക്രിസ്തു’ എന്നു നൽകി; നിർദിഷ്ടനായ പ്രതീക്ഷിത വ്യക്തിയെ സൂചിപ്പിക്കാവുന്ന മലയാളവായന അടിക്കുറിപ്പിൽ നിലനിർത്തി.
  alternative: ‘ആ എതിർക്രിസ്തു’ എന്ന് പ്രധാനവാചകത്തിൽ നിർദിഷ്ടമാക്കുക.
  rationale: ഉപപദമില്ലാത്ത ഗ്രീക്ക് രൂപം നിർദിഷ്ടത പൂർണമായി നിരാകരിക്കുന്നില്ല; അതിനാൽ ഇരുവായനകൾക്കും ഇടം നൽകണം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ബൈബിൾ ഗദ്യശൈലി. ‘കുഞ്ഞുങ്ങളേ’ ഇടയപരിപാലനപരമായ കുടുംബസംബോധനയായി ഉപയോഗിച്ചു; ‘അന്ത്യനാഴിക’ രൂപകത്തിന്റെ ഗൗരവം കാത്തുസൂക്ഷിക്കുന്നു. ‘എതിർക്രിസ്തു’ സാധാരണ വായനക്കാരന് ഘടന വ്യക്തമായിരിക്കുമ്പോഴും ഏകവചന-ബഹുവചന പദബന്ധം കൃത്യമായി നിലനിർത്തുന്നു.
