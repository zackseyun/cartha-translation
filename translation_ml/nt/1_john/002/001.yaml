id: 1JN.2.1
reference: 1 John 2:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τεκνία μου, ταῦτα γράφω ὑμῖν ἵνα μὴ ἁμάρτητε. καὶ ἐάν τις ἁμάρτῃ, παράκλητον ἔχομεν πρὸς τὸν πατέρα Ἰησοῦν Χριστὸν δίκαιον,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/001.yaml
  text: My little children[a], I write these things to you so that you may not sin. But if anyone does sin[b], we have an advocate with the Father—Jesus the Messiah the Righteous One.
translation:
  language: ml
  text: എന്റെ കുഞ്ഞുമക്കളേ, നിങ്ങൾ പാപം ചെയ്യാതിരിക്കേണ്ടതിന് ഞാൻ ഇവ നിങ്ങൾക്കു എഴുതുന്നു. എന്നാൽ ആരെങ്കിലും പാപം ചെയ്താൽ, പിതാവിന്റെ അടുക്കൽ നമുക്കുവേണ്ടി വാദിക്കുന്നവൻ നമുക്കുണ്ട്—നീതിമാനായ യേശു, മശീഹാ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘നമുക്കുവേണ്ടി വാദിക്കുന്നവൻ’ എന്നു പരിഭാഷപ്പെടുത്തിയ παράκλητος എന്ന ഗ്രീക്ക് പദത്തിന് കൂടുതൽ വിശാലമായി ‘സഹായി,’ ‘ഉപദേഷ്ടാവ്,’ അല്ലെങ്കിൽ ‘ആശ്വാസകൻ’ എന്നും അർഥമാകാം. പരമ്പരാഗത പരിഭാഷ: ‘യേശുക്രിസ്തു.’ Χριστός എന്ന ഗ്രീക്ക് പദത്തിന് ‘മശീഹാ’ എന്ന് അർഥമാകാം; അത് ‘ക്രിസ്തു’ എന്ന പേരുപോലെയും ഉപയോഗിക്കപ്പെടുന്നു.'
    reason: lexical_alternative; alternative_reading
lexical_decisions:
- source_word: Τεκνία μου
  choice: എന്റെ കുഞ്ഞുമക്കളേ
  rationale: കുടുംബബന്ധത്തിന്റെ രൂപകവും τεκνίαയിലെ വാത്സല്യഭാവവും നിലനിർത്തുന്ന സ്വാഭാവികമായ മലയാള സംബോധന.
- source_word: ταῦτα γράφω ὑμῖν
  choice: ഞാൻ ഈ കാര്യങ്ങൾ നിങ്ങൾക്ക് എഴുതുന്നത്
  rationale: ταῦταയുടെ ബഹുവചനസൂചന ‘ഈ കാര്യങ്ങൾ’ എന്നു നിലനിർത്തുന്നു; γράφωയുടെ വർത്തമാനകാല കത്തുഭാഷ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἵνα μὴ ἁμάρτητε
  choice: നിങ്ങൾ പാപം ചെയ്യാതിരിക്കേണ്ടതിനാണ്
  rationale: ἵναയോടുകൂടിയ ഉദ്ദേശ്യവാക്യം വ്യക്തമായി പകർന്നുകൊണ്ട്, അതിൽനിന്ന് പാപരഹിത പൂർണതയെക്കുറിച്ചുള്ള അധിക നിഗമനം വരുത്തുന്നില്ല.
- source_word: καὶ ἐάν τις ἁμάρτῃ
  choice: എന്നാൽ ആരെങ്കിലും പാപം ചെയ്താൽ
  rationale: മുൻ ഉദ്ദേശ്യവാക്യവും പാപം സംഭവിക്കാവുന്ന സാഹചര്യം പരിഗണിക്കുന്ന നിബന്ധനയും തമ്മിലുള്ള സന്ദർഭോചിതമായ വൈരുധ്യം ‘എന്നാൽ’ വ്യക്തമാക്കുന്നു.
- source_word: παράκλητον
  choice: നമുക്കുവേണ്ടി വാദിക്കുന്നവൻ
  rationale: പിതാവിന്റെ അടുക്കലുള്ള പ്രതിനിധി/പിന്തുണക്കാരൻ എന്ന സന്ദർഭാർത്ഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; ഗ്രീക്ക് പദത്തിന്റെ വിശാല അർഥപരിധി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: πρὸς τὸν πατέρα
  choice: പിതാവിന്റെ അടുക്കൽ
  rationale: പിതാവുമായുള്ള സാന്നിധ്യവും അഭിമുഖബന്ധവും സൂചിപ്പിക്കുന്ന πρός എന്ന പ്രയോഗത്തെ അമിതമായി സ്ഥലപരമാക്കാതെ പകർന്നിരിക്കുന്നു.
- source_word: Ἰησοῦν Χριστὸν
  choice: യേശു മശീഹാ
  rationale: Χριστός ഇവിടെ യേശുവിനെ തിരിച്ചറിയിക്കുന്ന അഭിഷിക്തൻ എന്ന പദവിയായി വായിക്കാവുന്നതിനാൽ ‘മശീഹാ’ ഉപയോഗിക്കുന്നു; പരമ്പരാഗത ‘ക്രിസ്തു’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: δίκαιον
  choice: നീതിമാനായ
  rationale: Ἰησοῦν Χριστόν എന്നതോടു വ്യാകരണപരമായി യോജിക്കുന്ന വിശേഷണത്തെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; അതിനെ നിർബന്ധമായി പ്രത്യേക നാമപദവിയാക്കി മാറ്റുന്നില്ല.
theological_decisions:
- issue: ἵνα μὴ ἁμάρτητε എന്നതിൽ പാപരഹിത പൂർണതയുടെ സാധ്യതയുള്ള ധ്വനി
  choice: പാപം ചെയ്യാതിരിക്കുക എന്ന എഴുത്തുകാരന്റെ ഉദ്ദേശ്യം മാത്രം പ്രസ്താവിക്കുന്നു
  alternative: ഇത് സമ്പൂർണ പാപരഹിതാവസ്ഥ സാധ്യമോ കൈവരിച്ചതോ ആണെന്ന പ്രസ്താവനയായി വികസിപ്പിക്കുക
  rationale: തുടർന്നുള്ള ‘ആരെങ്കിലും പാപം ചെയ്താൽ’ എന്ന നിബന്ധനയോടുള്ള വാചകത്തിന്റെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
- issue: Χριστός എന്ന പദത്തിന്റെ പദവി/പേര് സ്വഭാവം
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: ഈ ഘടനയിൽ ‘അഭിഷിക്തൻ’ എന്ന പദവിയർത്ഥം സജീവമായി നിലനിൽക്കാം; അതേസമയം പേര് പോലെ ഉപയോഗിക്കുന്ന പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: παράκλητος എന്ന പദത്തിന്റെ നിയമപരവും വിശാലവുമായ അർഥങ്ങൾ
  choice: നമുക്കുവേണ്ടി വാദിക്കുന്നവൻ
  alternative: സഹായി / ഉപദേഷ്ടാവ് / ആശ്വാസകൻ
  rationale: ഈ സന്ദർഭത്തിൽ പിതാവിന്റെ അടുക്കലുള്ള പ്രതിനിധിത്വവും പിന്തുണയും മുൻനിൽക്കുന്നു; എന്നാൽ പദത്തിന്റെ അർഥപരിധി ഒരൊറ്റ നിയമസാങ്കേതിക പദത്തിലേക്ക് ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായെങ്കിലും മാന്യവും തിരുവെഴുത്തിന് യോജിച്ചതുമായ ശൈലി. ‘കുഞ്ഞുമക്കളേ’ വാത്സല്യസംബോധന നിലനിർത്തുന്നു; ‘നമുക്കുവേണ്ടി വാദിക്കുന്നവൻ’ അപരിചിതമായ നിയമസാങ്കേതിക പദം ഒഴിവാക്കി παράκλητοςയുടെ സന്ദർഭാർത്ഥം വ്യക്തമാക്കുന്നു.
