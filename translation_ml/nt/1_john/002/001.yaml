revisions:
- from: എന്റെ കുഞ്ഞുമക്കളേ, നിങ്ങൾ പാപം ചെയ്യാതിരിക്കേണ്ടതിനാണ് ഞാൻ ഈ കാര്യങ്ങൾ നിങ്ങൾക്ക് എഴുതുന്നത്. എന്നാൽ ആരെങ്കിലും പാപം ചെയ്താൽ, പിതാവിന്റെ അടുക്കൽ നമുക്കുവേണ്ടി വാദിക്കുന്നവൻ[a] നമുക്കുണ്ട്—നീതിമാനായ യേശു മശീഹാ.[b]
  to: എന്റെ കുഞ്ഞുമക്കളേ, നിങ്ങൾ പാപം ചെയ്യാതിരിക്കേണ്ടതിന് ഞാൻ ഇവ നിങ്ങൾക്കു എഴുതുന്നു. എന്നാൽ ആരെങ്കിലും പാപം ചെയ്താൽ, പിതാവിന്റെ അടുക്കൽ നമുക്കുവേണ്ടി വാദിക്കുന്നവൻ നമുക്കുണ്ട്—നീതിമാനായ യേശു, മശീഹാ.[a]
  rationale: മുഖ്യവാക്യത്തെ ആധുനിക മലയാളത്തിൽ സമ്പൂർണമാക്കി, γράφωയുടെ വർത്തമാനകാലം ‘എഴുതുന്നു’ എന്ന രൂപത്തിൽ നിലനിർത്തി. അർഥത്തിൽ മാറ്റമില്ലാതെ, യേശുവിനെക്കുറിച്ചുള്ള അപ്പോസിഷൻ കൂടുതൽ വ്യക്തമായി പുനഃക്രമീകരിച്ചു. അടിക്കുറിപ്പിന്റെ a/b നങ്കൂരങ്ങൾ യഥാക്രമം παράκλητος, Χριστός എന്നിവയുമായി ബന്ധിപ്പിക്കപ്പെട്ടിരുന്നെങ്കിലും നിലവിലെ വാക്യത്തിൽ അവ ആശയക്കുഴപ്പം സൃഷ്ടിക്കുമെന്നതിനാൽ രണ്ടും ഒരൊറ്റ അന്ത്യ അടിക്കുറിപ്പിൽ ഏകീകരിച്ചു.
