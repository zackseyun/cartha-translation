id: 1JN.2.11
reference: 1 John 2:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ μισῶν τὸν ἀδελφὸν αὐτοῦ ἐν τῇ σκοτίᾳ ἐστὶν καὶ ἐν τῇ σκοτίᾳ περιπατεῖ, καὶ οὐκ οἶδεν ποῦ ὑπάγει, ὅτι ἡ σκοτία ἐτύφλωσεν τοὺς ὀφθαλμοὺς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/011.yaml
  text: But the one who hates his brother is in the darkness and walks in the darkness[a], and does not know where he is going, because the darkness has blinded his eyes.
translation:
  language: ml
  text: എന്നാൽ തന്റെ സഹോദരനെ[a] വെറുക്കുന്നവൻ ഇരുട്ടിലാണ്, അവൻ ഇരുട്ടിൽ നടക്കുന്നു. താൻ എവിടേക്കാണ് പോകുന്നതെന്ന് അവന് അറിയില്ല, കാരണം ഇരുട്ട് അവന്റെ കണ്ണുകളെ അന്ധമാക്കിയിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സഹോദരനെയോ സഹോദരിയെയോ.” ഗ്രീക്കിൽ “സഹോദരൻ” എന്നാണ്; ഇവിടെ ക്രിസ്തീയ സമൂഹത്തിലെ ഒരു സഹവിശ്വാസിയെയാണ് സാധ്യതയോടെ സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: μισῶν
  choice: വെറുക്കുന്നവൻ
  rationale: വർത്തമാനകാല കൃദന്തരൂപം വ്യക്തിയുടെ നിലപാടിനെയോ പതിവായ മനോഭാവത്തെയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘വെറുക്കുന്നവൻ’ സ്വാഭാവികമായി അത് പകരുന്നു.
- source_word: ἀδελφὸν
  choice: സഹോദരനെ
  rationale: ഗ്രീക്കിലെ ഏകവചന പുല്ലിംഗരൂപം നിലനിർത്തുന്നു; യോഹന്നാന്റെ പ്രയോഗത്തിൽ ഇത് വിശ്വാസസമൂഹത്തിലെ സഹവിശ്വാസിയെ പ്രതിനിധാനപരമായി സൂചിപ്പിക്കാം.
- source_word: ἐν τῇ σκοτίᾳ
  choice: ഇരുട്ടിൽ
  rationale: ധാർമ്മികവും ആത്മീയവുമായ അർഥസാന്ദ്രതയുള്ള യോഹന്നാനീയ രൂപകം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു; രണ്ടു പ്രാവശ്യത്തെയും ആവർത്തനവും സംരക്ഷിക്കുന്നു.
- source_word: περιπατεῖ
  choice: നടക്കുന്നു
  rationale: ജീവിതനടത്തത്തെ സൂചിപ്പിക്കുന്ന ബൈബിളിലെ നടത്തം എന്ന രൂപകം ‘ജീവിക്കുന്നു’ എന്നു പരാവർത്തനം ചെയ്യാതെ സംരക്ഷിക്കുന്നു.
- source_word: οὐκ οἶδεν ποῦ ὑπάγει
  choice: താൻ എവിടേക്കാണ് പോകുന്നതെന്ന് അവന് അറിയില്ല
  rationale: ചലനത്തിന്റെ വർത്തമാനഭാവം നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കാവുന്ന രൂപം.
- source_word: ἐτύφλωσεν
  choice: അന്ധമാക്കിയിരിക്കുന്നു
  rationale: ഗ്രീക്ക് ഔറിസ്റ്റ് സൂചിപ്പിക്കുന്ന പ്രവർത്തനത്തോടൊപ്പം അതിന്റെ ഇപ്പോഴും നിലനിൽക്കുന്ന ഫലം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: അവന്റെ കണ്ണുകളെ
  rationale: മൂലപാഠത്തിലെ മൂർത്തമായ ദൃശ്യരൂപം അമൂർത്തമാക്കാതെ നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: യോഹന്നാനീയ വെളിച്ചം–ഇരുട്ട് ദ്വന്ദ്വത്തിലെ ധാർമ്മിക-ആത്മീയ അർഥം
  choice: σκοτία എന്നത് ‘ഇരുട്ട്’ എന്നു രൂപകാത്മകമായിത്തന്നെ പരിഭാഷപ്പെടുത്തി.
  alternative: തിന്മ; പാപത്തിന്റെ ഇരുട്ട്
  rationale: ‘തിന്മ’ എന്നോ ‘പാപത്തിന്റെ ഇരുട്ട്’ എന്നോ വിശദീകരിക്കുന്നത് രൂപകത്തിന്റെ വിശാലമായ ദൈവശാസ്ത്രസാന്ദ്രത ചുരുക്കും; വെളിച്ചത്തോടുള്ള യോഹന്നാനീയ വൈരുധ്യം അതേപടി നിലനിർത്തുന്നു.
- issue: ‘സഹോദരൻ’ എന്നതിന്റെ പരാമർശവ്യാപ്തി
  choice: പ്രധാനപാഠത്തിൽ ‘സഹോദരൻ’ എന്ന ഏകവചന പുല്ലിംഗരൂപം നിലനിർത്തി.
  alternative: സഹോദരനെയോ സഹോദരിയെയോ; സഹവിശ്വാസിയെ
  rationale: മൂലപാഠത്തിന്റെ വ്യാകരണരൂപം സംരക്ഷിക്കുമ്പോഴും അത് വിശ്വാസസമൂഹത്തിലെ സ്ത്രീയെയോ പുരുഷനെയോ പ്രതിനിധാനപരമായി ഉൾക്കൊള്ളാമെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘ഇരുട്ടിൽ’ എന്ന ആവർത്തനവും ‘നടക്കുന്നു’ എന്ന ബൈബിൾരൂപകവും നിലനിർത്തിയിരിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ആശയമായ ‘ഇരുട്ടിൽ നടക്കുന്നു’ എന്ന വാക്യഭാഗത്തിന് ശേഷം ചേർത്തിട്ടുണ്ടെങ്കിലും അതിന്റെ ഉള്ളടക്കം ‘സഹോദരൻ’ എന്ന പദത്തിന്റെ പരാമർശവ്യാപ്തി വിശദീകരിക്കുന്നു.
