  rationale: 'The revision replaces the potentially ambiguous “ഒരുവനും പിതാവ് ഇല്ല” with balanced, idiomatic Malayalam: “നിഷേധിക്കുന്നവന് പിതാവും ഇല്ല … ഏറ്റുപറയുന്നവന് പിതാവും ഉണ്ട്.” This preserves the generic present-participle sense, the negated correlative relation, and the source’s unexpanded ‘have the Father’ idiom. The bracketed SBLGNT clause remains in the main text, with the existing textual-variant footnote retained.'
