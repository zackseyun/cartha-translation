    text: ചില കൈയെഴുത്തുപ്രതികളിൽ “പുത്രനെ ഏറ്റുപറയുന്നവന് പിതാവും ഉണ്ട്” എന്ന ഭാഗം കാണുന്നില്ല.
    reason: textual_variant
lexical_decisions:
- source_word: πᾶς ὁ ἀρνούμενος
  choice: നിഷേധിക്കുന്ന ഒരുവനും
  rationale: നാമപദമായി പ്രവർത്തിക്കുന്ന വർത്തമാനകാല കൃദന്തത്തിന്റെ പൊതുവായ സർവവ്യാപക അർഥം മലയാളത്തിലെ നിഷേധവാക്യത്തിന് സ്വാഭാവികമായ ‘ഒരുവനും’ എന്ന പ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: ἀρνούμενος
  choice: നിഷേധിക്കുന്ന
  rationale: വിശ്വാസപ്രഖ്യാപനത്തിന്റെ പശ്ചാത്തലത്തിൽ പുത്രന്റെ വ്യക്തിത്വത്തെയും അവകാശവാദത്തെയും നിരാകരിക്കുന്ന അർഥം നൽകുന്നു; ‘തള്ളിക്കളയുന്ന’ എന്നതിനെക്കാൾ ഉറവിടപദത്തോട് അടുത്തതാണ്.
- source_word: τὸν υἱὸν
  choice: പുത്രനെ
  rationale: ഗ്രീക്കിൽ ഉള്ള ക്രിസ്തുശാസ്ത്രപരമായ ‘പുത്രൻ’ എന്ന വിശേഷനാമം മാത്രം നിലനിർത്തുന്നു; ‘ദൈവപുത്രൻ’ എന്ന് വിശദീകരിച്ച് ചേർക്കുന്നില്ല.
- source_word: οὐδὲ τὸν πατέρα ἔχει
  choice: പിതാവ് ഇല്ല
  rationale: മലയാളത്തിൽ ഒരാൾക്ക് മറ്റൊരാൾ ‘ഉണ്ട്/ഇല്ല’ എന്ന സ്വാഭാവിക ഉടമസ്ഥ-ബന്ധ പ്രയോഗത്തിലൂടെ ἔχω എന്നതിന്റെ യോഹന്നാനീയ ഗൗരവം നിലനിർത്തുന്നു; കൂട്ടായ്മയോ സ്വന്തത്വമോ എന്ന് വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: ὁ ὁμολογῶν
  choice: ഏറ്റുപറയുന്നവന്
  rationale: ὁμολογέω എന്നതിലെ തുറന്ന സമ്മതത്തിന്റെയും പ്രഖ്യാപനത്തിന്റെയും ഭാവം ‘ഏറ്റുപറയുക’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: καὶ
  choice: പിതാവും
  rationale: ചേർക്കൽ സൂചിപ്പിക്കുന്ന καὶയുടെ അർഥം മലയാളത്തിലെ ‘-ഉം’ പ്രത്യയത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: അച്ചടിച്ച ഗ്രീക്ക് പാഠത്തിലെ ബ്രാക്കറ്റിലുള്ള രണ്ടാം ഉപവാക്യം
  choice: ‘പുത്രനെ ഏറ്റുപറയുന്നവന് പിതാവും ഉണ്ട്’ എന്നത് മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി.
  alternative: ചില കൈയെഴുത്തുപ്രതികളെ പിന്തുടർന്ന് രണ്ടാം ഉപവാക്യം ഒഴിവാക്കുക.
  rationale: നൽകിയ SBLGNT പാഠം ഈ ഉപവാക്യം അടയാളപ്പെടുത്തിയെങ്കിലും ഉൾക്കൊള്ളുന്നു. അതിനാൽ മുഖ്യപാഠത്തിൽ വിവർത്തനം ചെയ്യുകയും പാഠഭേദം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുകയും ചെയ്യുന്നു.
- issue: ‘പിതാവ് ഉണ്ട്’ എന്ന പ്രയോഗത്തിന്റെ ബന്ധപരമായ അർഥം
  choice: മൂലത്തിലെ ‘ഉണ്ട്/ഇല്ല’ എന്ന പ്രയോഗം വ്യാഖ്യാനവികാസമില്ലാതെ നിലനിർത്തി.
  alternative: ‘പിതാവുമായി കൂട്ടായ്മയുണ്ട്’ അല്ലെങ്കിൽ ‘പിതാവിനുള്ളവനാണ്’ എന്നു വിശദീകരിക്കുക.
  rationale: പുത്രനെ ഏറ്റുപറയുന്നതും പിതാവ് ഉണ്ടായിരിക്കുന്നതും തമ്മിലുള്ള അഭേദ്യബന്ധം വാക്യം ഉറപ്പിക്കുന്നു; അതിനെ ഒരു പ്രത്യേക ബന്ധവിഭാഗമായി ചുരുക്കാതെ യോഹന്നാനീയ ഭാഷയുടെ ദൈവശാസ്ത്രപരമായ ഭാരം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. ‘പുത്രൻ’, ‘പിതാവ്’, ‘ഏറ്റുപറയുക’ എന്നീ ബൈബിൾപരമായി പരിചിതമായ പദങ്ങൾ നിലനിർത്തിയിരിക്കുന്നു; കൃത്രിമമായ പദാനുപദഘടന ഒഴിവാക്കി.
