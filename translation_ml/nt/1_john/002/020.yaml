  text: καὶ ὑμεῖς χρῖσμα ἔχετε ἀπὸ τοῦ ἁγίου ⸀καὶ οἴδατε ⸀πάντες·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/020.yaml
  text: But you have an anointing from the Holy One[a], and you all know.
translation:
  language: ml
  text: എന്നാൽ, നിങ്ങൾക്കു പരിശുദ്ധനായവനിൽനിന്ന് അഭിഷേകം ഉണ്ട്; നിങ്ങൾ എല്ലാവരും അറിയുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു പാഠവായനപ്രകാരം: “നിങ്ങൾ എല്ലാം അറിയുന്നു.” SBLGNTയിലെ വായന “നിങ്ങൾ എല്ലാവരും അറിയുന്നു” എന്നതിനെ പിന്തുണയ്ക്കുന്നു.'
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ എതിർക്രിസ്തുക്കളോടുള്ള ആശയവൈരുധ്യം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὑμεῖς
  choice: നിങ്ങൾക്കു
  rationale: പ്രകടമായ സർവനാമത്തിന്റെ ഊന്നൽ വൈരുധ്യസൂചകമായ ‘എന്നാൽ’ എന്നതോടൊപ്പം നിലനിർത്തുന്നു.
- source_word: χρῖσμα
  choice: അഭിഷേകം
  rationale: മൂലത്തിലെ അഭിഷേകപ്രതീകവും അതിന്റെ ദൈവശാസ്ത്രപരമായ അനുരണനവും നിലനിർത്തുന്നു; അതിനെ നേരിട്ട് പരിശുദ്ധാത്മാവ് എന്നു വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: ἔχετε
  choice: ഉണ്ട്
  rationale: കൈവശമോ ലഭിച്ച അവസ്ഥയോ സൂചിപ്പിക്കുന്ന വർത്തമാനകാലപ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാളസമതുല്യം.
- source_word: ἀπὸ τοῦ ἁγίου
  choice: പരിശുദ്ധനായവനിൽനിന്നുള്ള
  rationale: പരാമർശിക്കപ്പെടുന്നത് പിതാവോ പുത്രനോ എന്നു നിർണ്ണയിക്കാതെ ഗ്രീക്കിലെ ദൈവിക വിശേഷണം നിലനിർത്തുന്നു.
- source_word: καὶ
  choice: ;
  rationale: രണ്ടു അടുത്ത പ്രസ്താവനകളെയും മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ അർദ്ധവിരാമം ഉപയോഗിച്ചു; ബന്ധത്തിന്റെ അർത്ഥം നഷ്ടപ്പെടുന്നില്ല.
- source_word: οἴδατε
  choice: അറിയുന്നു
  rationale: അറിവിനെയോ ബോധത്തെയോ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ നേരിട്ടും സാധാരണവുമായ മലയാളരൂപം.
- source_word: πάντες
  choice: എല്ലാവരും
  rationale: SBLGNTയിലെ നാമനിർദ്ദേശക ബഹുവചനവായന പിന്തുടർന്ന് ‘നിങ്ങൾ എല്ലാവരും’ എന്നു നൽകുന്നു; ‘എല്ലാം’ എന്ന പാഠഭേദാർത്ഥം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ‘പരിശുദ്ധനായവൻ’ എന്നതിന്റെ പരാമർശം
  choice: പിതാവോ പുത്രനോ എന്ന് വ്യക്തമാക്കാതെ ‘പരിശുദ്ധനായവൻ’ എന്നു നിലനിർത്തി.
  alternative: പിതാവ്; പുത്രൻ/യേശുമശീഹ
  rationale: വാക്യം പരാമർശിതനെ വ്യക്തമായി തിരിച്ചറിയിക്കുന്നില്ല; അതിനാൽ യഥാർത്ഥ ദൈവശാസ്ത്രപരമായ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു.
- issue: χρῖσμα എന്നതിന്റെ അർത്ഥം
  choice: ‘അഭിഷേകം’ എന്ന പ്രതീകാത്മക പദം നിലനിർത്തി.
  alternative: പരിശുദ്ധാത്മാവ്; ആത്മാവിന്റെ അഭിഷേകം; അഭിഷേകവരം
  rationale: ഇത് പരിശുദ്ധാത്മാവിനെയോ ആത്മാവിന്റെ പ്രവർത്തനത്തെയോ സൂചിപ്പിക്കുന്നതായി വ്യാഖ്യാനിക്കാമെങ്കിലും മൂലപാഠം χρῖσμα എന്ന പ്രതീകം തന്നെയാണ് ഉപയോഗിക്കുന്നത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘അഭിഷേകം’, ‘പരിശുദ്ധനായവൻ’ എന്നീ പദങ്ങൾ മൂലത്തിലെ പ്രതീകവും അനിശ്ചിതത്വവും സംരക്ഷിക്കുന്നു. അടിക്കുറിപ്പിന്റെ ചിഹ്നം ബന്ധപ്പെട്ട പാഠഭേദവാക്യത്തിന്റെ അവസാനം ചേർത്തിരിക്കുന്നു.
