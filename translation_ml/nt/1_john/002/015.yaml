id: 1JN.2.15
reference: 1 John 2:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Μὴ ἀγαπᾶτε τὸν κόσμον μηδὲ τὰ ἐν τῷ κόσμῳ. ἐάν τις ἀγαπᾷ τὸν κόσμον, οὐκ ἔστιν ἡ ἀγάπη τοῦ πατρὸς ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/015.yaml
  text: Do not love the world or the things in the world[a]. If anyone loves the world[c][b], the love of the Father is not in him.
translation:
  language: ml
  text: ലോകത്തെയോ ലോകത്തിലുള്ളവയെയോ സ്നേഹിക്കരുത്. ആരെങ്കിലും ലോകത്തെ സ്നേഹിക്കുന്നുവെങ്കിൽ, പിതാവിനോടുള്ള സ്നേഹം[a] അയാളിൽ ഇല്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പിതാവിന്റെ സ്നേഹം.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγαπᾶτε
  choice: സ്നേഹിക്കരുത്
  rationale: μή സഹിതമുള്ള വർത്തമാനകാല ആജ്ഞാരൂപം തുടരുന്ന പ്രവൃത്തിയെ വിലക്കുന്നതായോ പൊതുവായ നിരോധനമായോ ഗ്രഹിക്കാം. സന്ദർഭം അനാവശ്യമായി നിർണയിക്കാതെ ലളിതമായ നിരോധനം നൽകുന്നു.
- source_word: κόσμον
  choice: ലോകം
  rationale: സൃഷ്ടിയെ തന്നെയല്ല, ദൈവത്തോട് എതിർന്നു നിൽക്കുന്ന മനുഷ്യക്രമത്തെയാണ് ഇവിടെ സന്ദർഭം സൂചിപ്പിക്കുന്നത്; എന്നാൽ മൂലപദത്തിന്റെ വ്യാപ്തി നിലനിർത്താൻ വ്യാഖ്യാനപരമായ വിപുലീകരണം ഒഴിവാക്കി.
- source_word: μηδὲ τὰ ἐν τῷ κόσμῳ
  choice: ലോകത്തിലുള്ളവയെയോ
  rationale: ലോകത്തോടുള്ള സ്നേഹത്തിൽനിന്ന് അതിലുള്ള കാര്യങ്ങളിലേക്കും നിരോധനം വ്യാപിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികവും ഗ്രീക്കിനോട് അടുത്തതുമായ പ്രയോഗം.
- source_word: ἐάν τις ἀγαπᾷ
  choice: ആരെങ്കിലും … സ്നേഹിക്കുന്നെങ്കിൽ
  rationale: τις എന്ന അനിശ്ചിത സർവനാമത്തിന്റെ പൊതുവ്യാപ്തിയും വ്യവസ്ഥാവാക്യത്തിന്റെ സ്വഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἡ ἀγάπη τοῦ πατρὸς
  choice: പിതാവിനോടുള്ള സ്നേഹം
  rationale: τοῦ πατρός വ്യാകരണപരമായി ‘പിതാവിനോടുള്ള സ്നേഹം’ എന്നോ ‘പിതാവിന്റെ സ്നേഹം’ എന്നോ അർഥമാകാം. ലോകത്തെ സ്നേഹിക്കുന്നതുമായുള്ള നേരിട്ടുള്ള വൈരുധ്യം ആദ്യ അർഥത്തെ കൂടുതൽ സാധ്യതയുള്ളതാക്കുന്നതിനാൽ അത് മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; മറ്റേ അർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: πατρὸς
  choice: പിതാവ്
  rationale: യോഹന്നാന്റെ പ്രയോഗത്തിലെ ബന്ധപരമായ ദൈവിക ശീർഷകം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἐν αὐτῷ
  choice: അയാളിൽ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ഏകവചനം പൊതുവായ അർഥത്തിലാണ്. മലയാളത്തിൽ ‘അയാളിൽ’ ഏകവചന സൂചന നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായി വായിക്കപ്പെടുന്നു.
theological_decisions:
- issue: യോഹന്നാന്റെ ധാർമിക പ്രയോഗത്തിൽ ‘ലോകം’ എന്നതിന്റെ അർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘ലോകം’ എന്നു തന്നെ നൽകി; സന്ദർഭത്തിൽ ദൈവത്തോട് എതിർന്നു നിൽക്കുന്ന വീണുപോയ ക്രമത്തെ സൂചിപ്പിക്കുന്നു.
  alternative: ലൗകിക വ്യവസ്ഥ; ലോകക്രമം
  rationale: ഇത് ദൈവസൃഷ്ടിയെയോ മനുഷ്യരെയോ സ്നേഹിക്കുന്നതിനെതിരായ നിരോധനമല്ല. വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർത്താൽ പദത്തിന്റെ വ്യാപ്തി നേരത്തേ ചുരുങ്ങും.
- issue: ἡ ἀγάπη τοῦ πατρὸς എന്നതിലെ ജനിറ്റീവിന്റെ അർഥം
  choice: പിതാവിനോടുള്ള സ്നേഹം
  alternative: പിതാവിന്റെ സ്നേഹം
  rationale: ലോകത്തോടുള്ള സ്നേഹവുമായി കാണിക്കുന്ന വൈരുധ്യം ലക്ഷ്യജനിറ്റീവ് അർഥത്തെ അനുകൂലിക്കുന്നു. എങ്കിലും ഗ്രീക്ക് രൂപത്തിലെ യഥാർഥമായ ദ്വയാർഥസാധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘ലോകം’ എന്ന പരമ്പരാഗതവും വ്യാപകവുമായ പദം നിലനിർത്തി; കൂടുതൽ വ്യാഖ്യാനപരമായ ‘ലോകവ്യവസ്ഥ’ ഒഴിവാക്കി. ദൈവിക ബന്ധശീർഷകമായ ‘പിതാവ്’ ആദരസൂചകമായി ഉപയോഗിച്ചു.
