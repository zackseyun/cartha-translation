id: 1JN.2.25
reference: 1 John 2:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ ἐπαγγελία ἣν αὐτὸς ἐπηγγείλατο ἡμῖν, τὴν ζωὴν τὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/025.yaml
  text: 'And this is the promise that he himself promised us: eternal life[a][b].'
translation:
  language: ml
  text: 'അവൻതന്നെ നമുക്കു വാഗ്ദാനം ചെയ്ത വാഗ്ദാനം ഇതാണ്: നിത്യജീവൻ.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആ നിത്യജീവൻ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിൽ നിശ്ചിത ഉപപദമുണ്ട്; എന്നാൽ മലയാളത്തിൽ ഇവിടെ ‘നിത്യജീവൻ’ എന്നതാണ് കൂടുതൽ സ്വാഭാവികം.
    reason: lexical_alternative
  - marker: b
    text: ‘അവൻതന്നെ’ എന്നതിൽ ഗ്രീക്കിലെ ഊന്നൽ പ്രകടമാണ്. ഈ വാക്യത്തിൽ പരാമർശവിഷയം പിതാവോ പുത്രനോ എന്ന് വീണ്ടും വ്യക്തമായി പറയുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπαγγελία / ἐπηγγείλατο
  choice: വാഗ്ദാനം / വാഗ്ദാനം ചെയ്ത
  rationale: നാമവും അതേ ധാതുവിൽനിന്നുള്ള ക്രിയയും തമ്മിലുള്ള ഗ്രീക്ക് പദബന്ധം മലയാളത്തിലും നിലനിർത്തുന്നു. ആവർത്തനം അല്പം ഔപചാരികമാണെങ്കിലും മൂലപാഠത്തിന്റെ ഊന്നൽ സംരക്ഷിക്കുന്നു.
- source_word: αὐτός
  choice: അവിടുന്നുതന്നെ
  rationale: ഊന്നലുള്ള സർവനാമത്തെ ‘തന്നെ’ കൊണ്ട് പ്രകടമാക്കുന്നു. ‘അവിടുന്ന്’ മാന്യവും സ്വാഭാവികവുമായ പരാമർശമാണ്; എന്നാൽ അത് പിതാവിനെയോ പുത്രനെയോ എന്ന് വിവർത്തനം നിർണ്ണയിക്കുന്നില്ല.
- source_word: ἡμῖν
  choice: നമുക്കു
  rationale: വാഗ്ദാനത്തിന്റെ സ്വീകർത്താക്കളെ സൂചിപ്പിക്കുന്ന ദത്തിവിനെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: τὴν ζωὴν τὴν αἰώνιον
  choice: നിത്യജീവൻ
  rationale: യോഹന്നാനീയ പ്രയോഗത്തിലെ സ്ഥിരവും വ്യക്തവുമായ മലയാള രൂപം. ഈ പദസമുച്ചയം വാഗ്ദാനത്തിന്റെ ഉള്ളടക്കം വിശദീകരിക്കുന്ന സമാനാധികരണമായി നിലകൊള്ളുന്നു.
- source_word: καὶ αὕτη ἐστίν
  choice: ഇതാണ്
  rationale: മുൻസന്ദർഭത്തോടുള്ള ബന്ധവും തുടർന്നുവരുന്ന വിശദീകരണവും സ്വാഭാവികമായി അറിയിക്കുന്നു. വാക്യാരംഭത്തിലെ καί മലയാളത്തിൽ നിർബന്ധമായി ‘കൂടാതെ/എന്നാൽ’ എന്നു ചേർക്കാതെ പ്രവാഹത്തിൽ ഉൾക്കൊള്ളുന്നു.
theological_decisions:
- issue: αὐτός എന്ന സർവനാമത്തിന്റെ പരാമർശവിഷയം
  choice: ‘അവിടുന്നുതന്നെ’ എന്നു മാത്രം നൽകി പരാമർശവിഷയം തുറന്നുവെച്ചു.
  alternative: ‘പിതാവുതന്നെ’ അല്ലെങ്കിൽ ‘പുത്രൻതന്നെ’
  rationale: ഈ വാക്യത്തിൽ പരാമർശവിഷയം വീണ്ടും വ്യക്തമായി പറയുന്നില്ല. അതിനാൽ പിതാവോ പുത്രനോ എന്നു വിവർത്തനത്തിൽ തീരുമാനിക്കാതെ മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും ലളിതവുമായ ശൈലി. ‘അവിടുന്നുതന്നെ’ സർവനാമത്തിന്റെ ഊന്നൽ സൂക്ഷിക്കുന്നു; വാഗ്ദാനത്തിന്റെ നാമ-ക്രിയ ആവർത്തനം മൂലപാഠത്തിലെ പദബന്ധം നിലനിർത്താനായി ബോധപൂർവം സംരക്ഷിച്ചു.
