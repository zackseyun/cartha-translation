id: 1JN.2.21
reference: 1 John 2:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐκ ἔγραψα ὑμῖν ὅτι οὐκ οἴδατε τὴν ἀλήθειαν, ἀλλ’ ὅτι οἴδατε αὐτήν, καὶ ὅτι πᾶν ψεῦδος ἐκ τῆς ἀληθείας οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/021.yaml
  text: I have not written to you because you do not know the truth[a], but because you do know it[b], and because no lie is from the truth.
translation:
  language: ml
  text: നിങ്ങൾ സത്യം അറിയാത്തതുകൊണ്ടല്ല ഞാൻ നിങ്ങൾക്ക് എഴുതിയത്; നിങ്ങൾ അത് അറിയുന്നതുകൊണ്ടും ഒരു നുണയും സത്യത്തിൽനിന്ന് ഉത്ഭവിക്കുന്നില്ല എന്നതുകൊണ്ടുമാണ്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγραψα
  choice: ഞാൻ എഴുതിയത്
  rationale: ഗ്രീക്ക് ഏറിസ്റ്റിനെ സന്ദർഭത്തിന് യോജിച്ച ഭൂതകാലരൂപത്തിൽ നൽകി; കത്ത് ഇപ്പോൾ വായനക്കാരുടെ കൈവശമാണെന്ന ലേഖനസന്ദർഭവും മലയാളത്തിൽ സ്വാഭാവികമായി ഗ്രഹിക്കാം.
- source_word: οἴδατε
  choice: നിങ്ങൾ അറിയുന്നു
  rationale: ആദ്യ നിഷേധവാക്യവും തുടർന്നുള്ള ഉറപ്പും തമ്മിലുള്ള വ്യക്തമായ വൈരുധ്യം നിലനിർത്തുന്നു.
- source_word: ἀλήθεια / τῆς ἀληθείας
  choice: സത്യം / സത്യത്തിൽനിന്ന്
  rationale: നിശ്ചിതത്വവും യോഹന്നാന്റെ പ്രയോഗത്തിലെ വിശാലമായ ദൈവശാസ്ത്രധ്വനിയും നിലനിർത്തി, ‘സുവിശേഷസത്യം’ പോലുള്ള വിശദീകരണം ചേർത്തിട്ടില്ല.
- source_word: πᾶν ψεῦδος ... οὐκ ἔστιν
  choice: ഒരു നുണയും ... ഇല്ല
  rationale: വാച്യമായി ‘എല്ലാ നുണയും ... അല്ല’ എന്ന ഘടന മലയാളത്തിൽ അസ്വാഭാവികമായതിനാൽ സാർവത്രിക നിഷേധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐκ τῆς ἀληθείας
  choice: സത്യത്തിൽനിന്ന് ഉത്ഭവിക്കുന്നു
  rationale: ἐκ സൂചിപ്പിക്കുന്ന ഉറവിടം അഥവാ ഉത്ഭവം വ്യക്തമായി നൽകുന്നു; ‘സത്യത്തിന്റെ ഭാഗമല്ല’ എന്ന വ്യത്യസ്ത ആശയത്തിലേക്ക് മാറ്റുന്നില്ല.
theological_decisions:
- issue: ‘സത്യം’ എന്നതിന്റെ യോഹന്നാനീയ വ്യാപ്തി
  choice: സത്യം
  alternative: സത്യസന്ദേശം; സുവിശേഷസത്യം
  rationale: വാക്യം തന്നെ കൂടുതൽ സങ്കുചിതമായ നിർവചനം നൽകാത്തതിനാൽ മൂലപദത്തിന്റെ വ്യാപ്തിയും ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും സംരക്ഷിച്ചു.
- issue: നുണയും സത്യവും തമ്മിലുള്ള ബന്ധം
  choice: ഒരു നുണയും സത്യത്തിൽനിന്ന് ഉത്ഭവിക്കുന്നില്ല
  alternative: ഒരു നുണയും സത്യത്തിന്റേതല്ല
  rationale: ἐκ ഉറവിടത്തെയോ ഉത്ഭവത്തെയോ സൂചിപ്പിക്കുന്നതിനാൽ ആ ബന്ധം വ്യക്തമായി നിലനിർത്തി; അതിനെ കൂടുതൽ വിപുലമായ സത്താവാദ പ്രസ്താവനയാക്കിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മൂലത്തിലെ ‘അല്ല... കൊണ്ടും... കൊണ്ടുമാണ്’ എന്ന ശക്തമായ വൈരുധ്യവും ഇരട്ട കാരണഘടനയും നിലനിർത്തിയിരിക്കുന്നു.
