source:
  edition: SBLGNT
  text: καὶ ὁ κόσμος παράγεται καὶ ἡ ἐπιθυμία αὐτοῦ, ὁ δὲ ποιῶν τὸ θέλημα τοῦ θεοῦ μένει εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/017.yaml
  text: And the world is passing away[a], along with its desire[b], but the one who does the will of God remains forever.
translation:
  language: ml
  text: ലോകവും അതിന്റെ മോഹവും[a] കടന്നുപോകുന്നു; എന്നാൽ ദൈവത്തിന്റെ ഇഷ്ടം ചെയ്യുന്നവൻ എന്നേക്കും നിലനിൽക്കുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മോഹം’ എന്നതിന് ‘ആഗ്രഹം’ അല്ലെങ്കിൽ ‘തൃഷ്ണ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ അത് ലോകത്തിന്റെ ക്രമംതെറ്റിയ ആഗ്രഹങ്ങളെ വിശാലമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘നിലനിൽക്കുന്നു’ എന്നു പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്ക് ക്രിയയ്ക്ക് യോഹന്നാന്റെ രചനകളിൽ ‘വസിക്കുക’ അല്ലെങ്കിൽ ‘തുടരുക’ എന്ന ഭാവവും ഉണ്ടാകാം; ഇവിടെ ശാശ്വതമായ നിലനിൽപ്പാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: κόσμος
  choice: ലോകം
  rationale: യോഹന്നാന്റെ ഈ സന്ദർഭത്തിൽ ഇത് ഭൗതിക സൃഷ്ടിയെ മാത്രം സൂചിപ്പിക്കുന്നില്ല; ദൈവത്തോട് എതിർപ്പുള്ള മനുഷ്യലോകത്തിന്റെ മൂല്യക്രമവും ഉൾക്കൊള്ളുന്നു. എങ്കിലും മൂലപദത്തിന്റെ വിശാലത നിലനിർത്താൻ സാധാരണവും സ്വാഭാവികവുമായ ‘ലോകം’ ഉപയോഗിച്ചു.
- source_word: παράγεται
  choice: കടന്നുപോകുന്നു
  rationale: വർത്തമാനകാലരൂപം ഇപ്പോൾ നടന്നുകൊണ്ടിരിക്കുന്ന ക്ഷയവും താൽക്കാലികതയും അറിയിക്കുന്നു. ‘കടന്നുപോകുന്നു’ ഈ പ്രക്രിയാഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐπιθυμία
  choice: മോഹം
  rationale: ഇവിടെ പദം ശക്തവും ക്രമംതെറ്റിയതുമായ ആഗ്രഹത്തെ സൂചിപ്പിക്കുന്നു. ‘മോഹം’ അതിന്റെ പ്രതികൂല ധാർമികഭാവം നൽകുന്നു; അതേസമയം അതിനെ ലൈംഗിക മോഹത്തിൽ മാത്രം ഒതുക്കുന്നില്ല.
- source_word: αὐτοῦ
  choice: അതിന്റെ
  rationale: സർവനാമം ‘ലോകം’ എന്നതിലേക്കാണ് തിരിഞ്ഞുനിൽക്കുന്നത്. അതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ നപുംസകസംബന്ധരൂപം ഉപയോഗിച്ചു.
- source_word: ὁ δὲ ποιῶν
  choice: എന്നാൽ ... ചെയ്യുന്നവൻ
  rationale: നാമവൽക്കരിച്ച വർത്തമാന കൃദന്തരൂപം ദൈവത്തിന്റെ ഇഷ്ടം ചെയ്യുന്നതിലൂടെ സ്വഭാവീകരിക്കപ്പെടുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. ഏകവചന പ്രതിനിധിഭാവം ‘ചെയ്യുന്നവൻ’ നിലനിർത്തുന്നു.
- source_word: θέλημα
  choice: ഇഷ്ടം
  rationale: ദൈവം ഉദ്ദേശിക്കുകയും ആവശ്യപ്പെടുകയും ചെയ്യുന്ന കാര്യത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു. ഇത് വെറും ക്ഷണികമായ വ്യക്തിപരമായ ഇഷ്ടം എന്ന അർഥത്തിൽ അല്ലെന്ന് ‘ദൈവത്തിന്റെ’ എന്ന ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: μένει
  choice: നിലനിൽക്കുന്നു
  rationale: യോഹന്നാന്റെ രചനകളിലെ പ്രധാന ക്രിയയായ μένω-യുടെ തുടരുക, വസിക്കുക, നിലനിൽക്കുക എന്നീ അർഥവ്യാപ്തികളിൽ ഈ സന്ദർഭത്തിന് അനുയോജ്യമായ ശാശ്വതസ്ഥിരത ‘നിലനിൽക്കുന്നു’ വ്യക്തമാക്കുന്നു.
- source_word: εἰς τὸν αἰῶνα
  choice: എന്നേക്കും
  rationale: ഈ സന്ദർഭത്തിൽ അവസാനമില്ലാത്ത തുടർച്ചയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന് സ്വാഭാവികമായ ആധുനിക മലയാളരൂപം.
theological_decisions:
- issue: യോഹന്നാന്റെ സന്ദർഭത്തിലെ κόσμος എന്നതിന്റെ അർഥം
  choice: ദൈവത്തോട് എതിർപ്പുള്ളതും കടന്നുപോകുന്നതുമായ ലോകക്രമത്തെ ഉൾക്കൊള്ളുന്ന ‘ലോകം’
  alternative: ഭൗതികമായി സൃഷ്ടിക്കപ്പെട്ട ലോകം മാത്രം
  rationale: 2:15–16-ൽ ലോകത്തെ അതിന്റെ മോഹങ്ങളാലും അഹങ്കാരത്താലും വിവരിക്കുന്നു. പരിഭാഷയിൽ അർഥം അനാവശ്യമായി ചുരുക്കാതെ ‘ലോകം’ നിലനിർത്തുകയും സന്ദർഭം അതിന്റെ ധാർമിക-ദൈവശാസ്ത്രപരമായ ഭാവം വ്യക്തമാക്കാൻ അനുവദിക്കുകയും ചെയ്തു.
- issue: μένει εἰς τὸν αἰῶνα എന്നതിന്റെ പ്രാബല്യം
  choice: ദൈവത്തിന്റെ ഇഷ്ടം ചെയ്യുന്നവന്റെ ശാശ്വതമായ നിലനിൽപ്പ്
  alternative: നിത്യജീവനെക്കുറിച്ചുള്ള കൂടുതൽ സാങ്കേതികമായി വികസിപ്പിച്ച പ്രസ്താവന
  rationale: ഗ്രീക്ക് വാക്യം ശാശ്വതമായ തുടർച്ച ഉറപ്പിക്കുന്നു; അതിന്റെ ദൈവശാസ്ത്രപരമായ പ്രവർത്തനരീതി ഇവിടെ വിശദീകരിക്കുന്നില്ല. അതിനാൽ മൂലത്തിൽ ഇല്ലാത്ത വിശദീകരണം ചേർക്കാതെ ‘എന്നേക്കും നിലനിൽക്കുന്നു’ എന്നു പരിഭാഷപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വാക്യഘടന സ്വീകരിച്ചു. ‘ലോകം’, ‘മോഹം’, ‘ദൈവത്തിന്റെ ഇഷ്ടം’, ‘എന്നേക്കും നിലനിൽക്കുന്നു’ എന്നീ പരിചിത പദങ്ങൾ ഉപയോഗിച്ച് യോഹന്നാന്റെ വിരുദ്ധസമാന്തര്യം—കടന്നുപോകുന്ന ലോകവും ശാശ്വതമായി നിലനിൽക്കുന്ന അനുസരണമുള്ള വ്യക്തിയും—വ്യക്തമായി നിലനിർത്തി.
