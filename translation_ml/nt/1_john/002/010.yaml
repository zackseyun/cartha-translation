id: 1JN.2.10
reference: 1 John 2:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ ἀγαπῶν τὸν ἀδελφὸν αὐτοῦ ἐν τῷ φωτὶ μένει, καὶ σκάνδαλον ἐν αὐτῷ οὐκ ἔστιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/010.yaml
  text: The one who loves his brother remains in the light[a], and there is no cause for stumbling in him.
translation:
  language: ml
  text: തന്റെ സഹോദരനെ സ്നേഹിക്കുന്നവൻ വെളിച്ചത്തിൽ നിലനിൽക്കുന്നു; അവനിൽ ഇടർച്ചയ്ക്ക് കാരണമൊന്നുമില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അവന് ഇടറാനുള്ള തടസ്സമൊന്നുമില്ല.” ഗ്രീക്ക് പ്രയോഗം ‘അവനിൽ’ എന്നും ‘അവന്’ എന്നും മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἀγαπῶν
  choice: സ്നേഹിക്കുന്നവൻ
  rationale: നാമവാചകമായി പ്രവർത്തിക്കുന്ന വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ പൊതുവായതും തുടരുന്നതുമായ ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: തന്റെ സഹോദരനെ
  rationale: സ്രോതസ്സിലെ പുല്ലിംഗ ഏകവചനത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; വിശ്വാസസമൂഹത്തിലെ സഹവിശ്വാസി എന്ന സാധ്യത പ്രധാനവാചകത്തിൽ വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കുന്നില്ല.
- source_word: ἐν τῷ φωτὶ
  choice: വെളിച്ചത്തിൽ
  rationale: യോഹന്നാന്റെ രൂപകാത്മകമായ വെളിച്ചം എന്ന ദൃശ്യബിംബം സ്വാഭാവികവും പരിചിതവുമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: μένει
  choice: നിലനിൽക്കുന്നു
  rationale: യോഹന്നാന്റെ പ്രധാന ക്രിയയായ μένωയുടെ തുടർച്ചയും സ്ഥിരതയും ആധുനിക മലയാളത്തിൽ ഗൗരവത്തോടെ അറിയിക്കുന്നു.
- source_word: σκάνδαλον
  choice: ഇടർച്ചയ്ക്ക് കാരണം
  rationale: തടസ്സം, കെണി, പാപത്തിൽ വീഴാനുള്ള കാരണം എന്നീ അർത്ഥസാധ്യതകളുള്ള രൂപകം അക്ഷരാർഥത്തിലുള്ള വസ്തുവായി ചുരുക്കാതെ നൈതികസന്ദർഭത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐν αὐτῷ
  choice: അവനിൽ
  rationale: പുല്ലിംഗ ഏകവചന സർവനാമത്തെ നേരിട്ട് പരിഭാഷപ്പെടുത്തി സ്നേഹിക്കുന്ന വ്യക്തിയിലേക്കുള്ള സ്വാഭാവിക സൂചന നിലനിർത്തുന്നു; ‘അവന്’ എന്ന വ്യത്യസ്ത വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: οὐκ ἔστιν
  choice: ഒന്നുമില്ല
  rationale: അസ്തിത്വനിഷേധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: καὶ σκάνδαλον ἐν αὐτῷ οὐκ ἔστιν എന്ന അവസാന ഉപവാക്യത്തിന്റെ സൂചനയും അർത്ഥനിറവും
  choice: സഹോദരനെ സ്നേഹിക്കുന്നവനിൽ ഇടർച്ചയ്ക്ക് കാരണമൊന്നുമില്ല
  alternative: അവന് ഇടറാനുള്ള തടസ്സമൊന്നുമില്ല; അല്ലെങ്കിൽ അവനിൽ മറ്റുള്ളവരെ ഇടറിക്കുന്നതൊന്നുമില്ല
  rationale: ἐν αὐτῷ എന്നത് ‘അവനിൽ’ എന്നും സാഹചര്യപരമായി ‘അവന്’ എന്നും ഗ്രഹിക്കാം. പ്രധാനവാചകം ആന്തരിക നൈതിക അർത്ഥം അമിതമായി വിശദീകരിക്കാതെ സംരക്ഷിക്കുന്നു; മറ്റൊരു യഥാർഥ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വെളിച്ചം’, ‘നിലനിൽക്കുന്നു’, ‘ഇടർച്ച’ എന്നീ ബൈബിൾപരമായ ദൃശ്യങ്ങളും ആശയബന്ധങ്ങളും നിലനിർത്തിയിട്ടുണ്ട്; പഴഞ്ചൻ പ്രയോഗങ്ങളും വിഭാഗീയ വ്യാഖ്യാനവികാസങ്ങളും ഒഴിവാക്കി.
