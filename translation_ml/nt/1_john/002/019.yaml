id: 1JN.2.19
reference: 1 John 2:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐξ ἡμῶν ἐξῆλθαν, ἀλλ’ οὐκ ἦσαν ἐξ ἡμῶν· εἰ γὰρ ⸂ἐξ ἡμῶν ἦσαν⸃, μεμενήκεισαν ἂν μεθ’ ἡμῶν· ἀλλ’ ἵνα φανερωθῶσιν ὅτι οὐκ εἰσὶν πάντες ἐξ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/019.yaml
  text: They went out from us[a], but they were not of us; for if they had been of us, they would have remained with us[b]. But this happened so that it might be made clear that not all are of us.
translation:
  language: ml
  text: അവർ നമ്മുടെ ഇടയിൽനിന്ന് പുറത്തുപോയി; എന്നാൽ അവർ നമ്മിൽപ്പെട്ടവർ ആയിരുന്നില്ല. അവർ നമ്മിൽപ്പെട്ടവർ ആയിരുന്നെങ്കിൽ നമ്മോടൊപ്പം നിലനിൽക്കുമായിരുന്നു[a]. എന്നാൽ അവരെല്ലാവരും നമ്മിൽപ്പെട്ടവരല്ലെന്ന് വെളിപ്പെടേണ്ടതിന് ഇങ്ങനെ സംഭവിച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നമ്മോടൊപ്പം തുടരുമായിരുന്നു.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അവർ വെളിവാക്കപ്പെടേണ്ടതിന്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ἡμῶν
  choice: നമ്മുടെ ഇടയിൽനിന്ന് / നമ്മിൽപ്പെട്ടവർ
  rationale: ആദ്യ സന്ദർഭത്തിൽ സമൂഹത്തിൽനിന്നുള്ള പുറപ്പെടലും പിന്നീടുള്ള സന്ദർഭങ്ങളിൽ ബന്ധവും ഉൾപ്പെടലും സൂചിപ്പിക്കുന്നതിനാൽ, ഗ്രീക്കിലെ ആവർത്തനത്തിന്റെ ബന്ധം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി രണ്ടു പരസ്പരബന്ധിത പ്രയോഗങ്ങൾ ഉപയോഗിച്ചു.
- source_word: ἐξῆλθαν
  choice: പുറത്തുപോയി
  rationale: ἐξέρχομαι എന്ന ക്രിയയുടെ നേരിട്ടുള്ള പുറപ്പെടൽചിത്രം നിലനിർത്തുന്നു; ക്രിയയിൽ തന്നെയില്ലാത്ത ‘വിശ്വാസത്യാഗം’ എന്ന വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: οὐκ ἦσαν ἐξ ἡμῶν
  choice: നമ്മിൽപ്പെട്ടവർ ആയിരുന്നില്ല
  rationale: സമൂഹത്തോടുള്ള യഥാർഥ ബന്ധം അല്ലെങ്കിൽ ഉൾപ്പെടൽ വ്യക്തമാക്കുന്നു; ‘യഥാർഥ വിശ്വാസികൾ ആയിരുന്നില്ല’ പോലുള്ള ദൈവശാസ്ത്രപരമായ വിപുലീകരണം ഒഴിവാക്കുന്നു.
- source_word: μεμενήκεισαν ἂν μεθ’ ἡμῶν
  choice: നമ്മോടൊപ്പം നിലനിൽക്കുമായിരുന്നു
  rationale: μένω എന്ന യോഹന്നാനീയ പദത്തിന്റെ ‘നിലനിൽക്കുക/തുടരുക’ എന്ന ഭാവവും ἄν ചേർന്ന യാഥാർഥ്യവിരുദ്ധ ഫലവാക്യവും മലയാളത്തിൽ സ്വാഭാവികമായി പകരുന്നു.
- source_word: ἀλλ’ ἵνα φανερωθῶσιν
  choice: എന്നാൽ ... വെളിപ്പെടേണ്ടതിന് ഇങ്ങനെ സംഭവിച്ചു
  rationale: φανερόωയുടെ നിഷ്ക്രിയമായ ‘വെളിപ്പെടുക’ എന്ന അർഥം നിലനിർത്തുന്നു. ἀλλάയ്ക്ക് ശേഷം ഗ്രീക്കിൽ സൂചിതമായ സംഭവബന്ധം പൂർണ്ണമായ മലയാളവാക്യത്തിനായി ‘ഇങ്ങനെ സംഭവിച്ചു’ എന്നു വ്യക്തമാക്കിയിരിക്കുന്നു.
- source_word: ὅτι οὐκ εἰσὶν πάντες ἐξ ἡμῶν
  choice: അവരെല്ലാവരും നമ്മിൽപ്പെട്ടവരല്ലെന്ന്
  rationale: οὐ ... πάντες എന്ന ഘടനയുടെ വ്യാപ്തി വ്യാഖ്യാനിച്ച് തീർക്കാതെ, ‘എല്ലാവരും ... അല്ല’ എന്ന ഉറവിടത്തോട് അടുത്ത ഘടന നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘ἐξ ἡμῶν’ എന്നത് ദൃശ്യസഭയും അദൃശ്യസഭയും സംബന്ധിച്ച നിർദിഷ്ട ദൈവശാസ്ത്രനിലപാടായി വികസിപ്പിക്കണമോ
  choice: ‘നമ്മിൽപ്പെട്ടവർ’ എന്ന സമൂഹബന്ധസൂചക പ്രയോഗം നിലനിർത്തി
  alternative: ‘അവർ ഒരിക്കലും യഥാർഥ വിശ്വാസികൾ ആയിരുന്നില്ല’ അല്ലെങ്കിൽ ‘അവർ യഥാർഥത്തിൽ സഭയിൽപ്പെട്ടിരുന്നില്ല’
  rationale: വാക്യം പുറപ്പെടലിനെയും യഥാർഥ ഉൾപ്പെടലിനെയും വേർതിരിക്കുന്നുവെങ്കിലും, ഗ്രീക്ക് പിൽക്കാല വ്യവസ്ഥിത ദൈവശാസ്ത്രവിഭാഗങ്ങൾ ഉപയോഗിക്കുന്നില്ല. അതിനാൽ വാക്യത്തിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം പരിഹരിക്കാതെ സൂക്ഷിച്ചു.
- issue: οὐκ εἰσὶν πάντες എന്നതിലെ നിഷേധത്തിന്റെ വ്യാപ്തി
  choice: ‘അവരെല്ലാവരും ... അല്ല’ എന്ന രൂപം ഉപയോഗിച്ചു
  alternative: ‘അവരിൽ ചിലർ മാത്രം നമ്മിൽപ്പെട്ടവരല്ല’ അല്ലെങ്കിൽ ‘അവരിൽ ഒരാളും നമ്മിൽപ്പെട്ടവരല്ല’
  rationale: ഗ്രീക്ക് ഘടനയിലെ സാദ്ധ്യമായ വ്യാപ്തിവ്യത്യാസം നിർബന്ധമായി ഒരു ദിശയിൽ തീർപ്പാക്കാതെ, മലയാളത്തിലും ഉറവിടത്തോട് അടുത്ത രൂപം നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘നമ്മുടേതായവർ’ എന്ന ഉടമസ്ഥതാഭാവം ഒഴിവാക്കി ‘നമ്മിൽപ്പെട്ടവർ’ എന്ന് സമൂഹബന്ധം വ്യക്തമാക്കി. പ്രധാനവാചകത്തിലെ [a], [b] അടയാളങ്ങൾ അവയുടെ യഥാക്രമ പദവികല്പങ്ങളോടു ചേർത്തിരിക്കുന്നു.
