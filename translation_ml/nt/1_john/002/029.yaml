id: 1JN.2.29
reference: 1 John 2:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐὰν εἰδῆτε ὅτι δίκαιός ἐστιν, γινώσκετε ⸀ὅτι πᾶς ὁ ποιῶν τὴν δικαιοσύνην ἐξ αὐτοῦ γεγέννηται.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/029.yaml
  text: If you know that he is righteous[b][a], you know that everyone who practices righteousness has been born of him.
translation:
  language: ml
  text: അവൻ നീതിമാനാണെന്ന് നിങ്ങൾക്കറിയാമെങ്കിൽ,[a] നീതി പ്രവർത്തിക്കുന്ന ഏവനും അവനിൽനിന്ന് ജനിച്ചിരിക്കുന്നുവെന്നും നിങ്ങൾക്കറിയാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവൻ’ എന്നും ‘അവനിൽനിന്ന്’ എന്നും പറയുന്നത് ദൈവപിതാവിനെയോ പുത്രനെയോ സൂചിപ്പിക്കാം; ഗ്രീക്ക് വാക്യം ഇവിടെ സൂചിതനെ വ്യക്തമായി പറയുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐὰν εἰδῆτε
  choice: നിങ്ങൾക്കറിയാമെങ്കിൽ
  rationale: സോപാധികമായ ἐὰν എന്നതിനെയും οἶδα എന്ന ക്രിയയുടെ അറിവ് എന്ന അർഥത്തെയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: δίκαιός
  choice: നീതിമാൻ
  rationale: വ്യക്തിയുടെ ധാർമിക സ്വഭാവത്തെ സൂചിപ്പിക്കുന്ന പദം; അതേ വാക്യത്തിലെ δικαιοσύνηയുമായുള്ള പദബന്ധവും നിലനിർത്തുന്നു.
- source_word: γινώσκετε
  choice: നിങ്ങൾക്കറിയാം
  rationale: രൂപത്തെ നിർദേശകഭാവമായ പ്രസ്താവനയായി സ്വീകരിക്കുന്നു; ആദ്യത്തെ അറിവുസൂചക ക്രിയയുമായുള്ള സമാന്തരതയും നിലനിർത്തുന്നു.
- source_word: πᾶς ὁ ποιῶν τὴν δικαιοσύνην
  choice: നീതി പ്രവർത്തിക്കുന്ന ഏവനും
  rationale: വർത്തമാന കൃദന്തം സൂചിപ്പിക്കുന്ന സ്വഭാവപരമായോ തുടർച്ചയായോ ഉള്ള പ്രവൃത്തിയെ മലയാളത്തിൽ നേരിട്ടും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: ἐξ αὐτοῦ
  choice: അവനിൽനിന്ന്
  rationale: ἐξ എന്നതിന്റെ ഉത്ഭവസൂചന വ്യക്തമായി നിലനിർത്തുകയും മലയാളത്തിലെ ജനനപ്രയോഗത്തോട് സ്വാഭാവികമായി ചേരുകയും ചെയ്യുന്നു.
- source_word: γεγέννηται
  choice: ജനിച്ചിരിക്കുന്നു
  rationale: പൂർണ്ണകാല കർമണിപ്രയോഗത്തിലെ കഴിഞ്ഞ സംഭവവും തുടരുന്ന ഫലവും മലയാളത്തിലെ ‘ജനിച്ചിരിക്കുന്നു’ എന്ന രൂപം സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: δίκαιός ἐστιν ... ἐξ αὐτοῦ എന്നതിലെ αὐτός എന്ന സർവനാമത്തിന്റെ സൂചിതൻ
  choice: ‘അവൻ/അവനിൽനിന്ന്’ എന്ന സർവനാമപ്രയോഗം നിലനിർത്തി; പിതാവാണോ പുത്രനാണോ എന്നു മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കിയില്ല.
  alternative: ദൈവപിതാവ്; അല്ലെങ്കിൽ പുത്രൻ
  rationale: സമീപസന്ദർഭത്തിൽ ഇരുവിധ വ്യാഖ്യാനത്തിനും സാധ്യതയുണ്ട്; ഗ്രീക്ക് വാക്യം സൂചിതനെ പേരെടുത്ത് വ്യക്തമാക്കുന്നില്ല. അതിനാൽ ദൈവശാസ്ത്രപരമായ അവ്യക്തത സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘നീതി/നീതിമാൻ’ എന്ന പദബന്ധം നിലനിർത്തി; കൃത്രിമമായ സഭാഭാഷയും വിഭാഗീയ വ്യാഖ്യാനവും ഒഴിവാക്കി.
