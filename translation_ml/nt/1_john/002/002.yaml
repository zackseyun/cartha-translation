source:
  edition: SBLGNT
  text: καὶ αὐτὸς ἱλασμός ἐστιν περὶ τῶν ἁμαρτιῶν ἡμῶν, οὐ περὶ τῶν ἡμετέρων δὲ μόνον ἀλλὰ καὶ περὶ ὅλου τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/002.yaml
  text: And he himself is the atoning sacrifice for our sins[a], and not for ours only but also for the whole world.
translation:
  language: ml
  text: അവൻതന്നെ നമ്മുടെ പാപങ്ങൾക്കായുള്ള പ്രായശ്ചിത്തയാഗമാണ്[a]; നമ്മുടെ പാപങ്ങൾക്കു മാത്രമല്ല, ലോകം മുഴുവനുടെയും പാപങ്ങൾക്കുമായും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കോപശമനബലി”; “പാപനിവാരണയാഗം” എന്നും ചിലർ മനസ്സിലാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: അവിടുന്നുതന്നെ
  rationale: αὐτός എന്നതിന്റെ ഊന്നൽ നിലനിർത്തുകയും യേശുവിനെക്കുറിച്ചുള്ള പരാമർശത്തിന് മാന്യവും സ്വാഭാവികവുമായ മലയാളരൂപം നൽകുകയും ചെയ്യുന്നു.
- source_word: ἱλασμός
  choice: പ്രായശ്ചിത്തയാഗം
  rationale: പാപപരിഹാരം സാധ്യമാക്കുന്ന യാഗം എന്ന അർഥം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നൽകുന്നു; ദൈവകോപശമനം, പാപനിവാരണം എന്നീ കൂടുതൽ സാങ്കേതിക വ്യാഖ്യാനങ്ങളിൽ ഒന്നിനെ മാത്രം നിർബന്ധിക്കുന്നില്ല.
- source_word: περὶ τῶν ἁμαρτιῶν ἡμῶν
  choice: നമ്മുടെ പാപങ്ങൾക്കായുള്ള
  rationale: ἱλασμός എന്ന നാമത്തോടൊപ്പമുള്ള περίയുടെ ബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ ‘പാപങ്ങൾക്കായുള്ള’ എന്നു പ്രകടമാക്കുന്നു.
- source_word: τῶν ἡμετέρων
  choice: നമ്മുടെ പാപങ്ങൾക്കു
  rationale: ഗ്രീക്കിൽ സൂചിതമായി നിൽക്കുന്ന ‘പാപങ്ങൾ’ മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ആവർത്തിക്കുന്നു.
- source_word: ὅλου τοῦ κόσμου
  choice: സർവലോകത്തിന്റെയും
  rationale: ὅλου എന്ന സമഗ്രത നിലനിർത്തി κόσμος എന്നതിനെ ഒരു പ്രത്യേക കൂട്ടമായി ചുരുക്കാതെ വിശാലമായി വിവർത്തനം ചെയ്യുന്നു.
- source_word: οὐ ... μόνον ἀλλὰ καὶ
  choice: മാത്രമല്ല ...യും
  rationale: ഗ്രീക്കിലെ പരസ്പരബന്ധമുള്ള വൈരുധ്യഘടന സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘സർവലോകം’ എന്ന പ്രയോഗത്തിന്റെ വ്യാപ്തി
  choice: വാചകത്തിന്റെ പൂർണവ്യാപ്തി വ്യാഖ്യാനപരമായി ചുരുക്കാതെ ‘സർവലോകം’ എന്നു നിലനിർത്തി.
  alternative: ലോകമെമ്പാടുമുള്ള ചിലർ; ലോകമെമ്പാടുമുള്ള തിരഞ്ഞെടുക്കപ്പെട്ടവർ
  rationale: ഗ്രീക്ക് പാഠം പറയാത്ത ഒരു പ്രത്യേക ദൈവശാസ്ത്രപരമായ പരിധി വിവർത്തനത്തിൽ ചേർക്കാതെ യഥാർഥമായ ദൈവശാസ്ത്ര സംഘർഷം സംരക്ഷിക്കുന്നു.
- issue: ἱλασμός എന്ന പദത്തിന്റെ പ്രായശ്ചിത്താർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘പ്രായശ്ചിത്തയാഗം’ ഉപയോഗിച്ചു.
  alternative: കോപശമനബലി; പാപനിവാരണയാഗം
  rationale: യാഗപരവും പ്രായശ്ചിത്തപരവുമായ കേന്ദ്രാർഥം നൽകുമ്പോഴും ദൈവകോപശമനമോ പാപനിവാരണമോ മാത്രം നിർണായകമായി തിരഞ്ഞെടുത്തിട്ടില്ല; പ്രധാന വ്യാഖ്യാനസാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘അവിടുന്നുതന്നെ’ എന്നത് ഊന്നലും ക്രിസ്തുവിനെക്കുറിച്ചുള്ള മാന്യമായ പരാമർശവും ഒരുമിച്ച് നൽകുന്നു. അവസാന ഭാഗത്ത് മലയാളത്തിലെ വ്യക്തതയ്ക്കായി ഗ്രീക്കിൽ സൂചിതമായ ‘പാപങ്ങൾ’ ആവർത്തിച്ചിട്ടുണ്ട്.
