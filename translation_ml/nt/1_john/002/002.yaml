- from: അവിടുന്നുതന്നെ നമ്മുടെ പാപങ്ങൾക്കായുള്ള പ്രായശ്ചിത്തയാഗം[a] ആകുന്നു; നമ്മുടെ പാപങ്ങൾക്കു മാത്രമല്ല, സർവലോകത്തിന്റെയും പാപങ്ങൾക്കായി ആകുന്നു.
  to: അവൻതന്നെ നമ്മുടെ പാപങ്ങൾക്കായുള്ള പ്രായശ്ചിത്തയാഗമാണ്[a]; നമ്മുടെ പാപങ്ങൾക്കു മാത്രമല്ല, ലോകം മുഴുവനുടെയും പാപങ്ങൾക്കുമായും.
