id: 1JN.2.4
reference: 1 John 2:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ λέγων ⸀ὅτι Ἔγνωκα αὐτὸν καὶ τὰς ἐντολὰς αὐτοῦ μὴ τηρῶν ψεύστης ἐστίν, καὶ ἐν τούτῳ ἡ ἀλήθεια οὐκ ἔστιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/004.yaml
  text: The one who says[a], “I have come to know him,” and does not keep his commandments is a liar[b], and the truth is not in him.
translation:
  language: ml
  text: “ഞാൻ അവനെ അറിഞ്ഞിരിക്കുന്നു” എന്നു പറയുകയും അവന്റെ കല്പനകൾ പാലിക്കാതിരിക്കുകയും ചെയ്യുന്നവൻ കള്ളനാണ്; അവനിൽ സത്യം ഇല്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ λέγων
  choice: എന്നു പറയുകയും ... ചെയ്യുന്നവൻ
  rationale: നാമപദമായി പ്രവർത്തിക്കുന്ന വർത്തമാനകാല കൃദന്തത്തിന്റെ പൊതുവായ ഏകവചന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Ἔγνωκα
  choice: ഞാൻ അവനെ അറിഞ്ഞിരിക്കുന്നു
  rationale: γινώσκω എന്ന ക്രിയയുടെ പൂർണകാലരൂപം, മുമ്പുണ്ടായ അറിവിന്റെ ഫലമായി തുടരുന്ന ഇപ്പോഴത്തെ ബന്ധാവസ്ഥയെ സൂചിപ്പിക്കുന്നു; ‘അറിയുന്നു’ എന്നതിനെക്കാൾ ഈ കാലഭാവം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: τὰς ἐντολὰς αὐτοῦ
  choice: അവന്റെ കല്പനകൾ
  rationale: യോഹന്നാന്റെ രചനകളിലെ ἐντολή എന്ന പദത്തിന്റെ ദൈവിക ആജ്ഞകളുമായുള്ള അന്തർപാഠബന്ധവും ഗൗരവവും ‘കല്പനകൾ’ നിലനിർത്തുന്നു.
- source_word: μὴ τηρῶν
  choice: പാലിക്കാതിരിക്കുകയും
  rationale: τηρέω എന്നതിന്റെ ‘സൂക്ഷിച്ചു അനുഷ്ഠിക്കുക/പാലിക്കുക’ എന്ന യോഹന്നാനീയ ഭാവവും തുടരുന്ന അനുസരണക്കേടും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ψεύστης
  choice: കള്ളനാണ്
  rationale: വിശേഷണമായി മയപ്പെടുത്താതെ, മൂലത്തിലെ വിധേയനാമം നൽകുന്ന വ്യക്തിപരമായ ധാർമിക വിലയിരുത്തൽ നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: ἐν τούτῳ
  choice: അവനിൽ
  rationale: മുമ്പ് പറഞ്ഞ വ്യക്തിയിലേക്കുള്ള അന്വയത്തെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘ഇവനിൽ’ എന്ന കൂടുതൽ അക്ഷരാർഥപരമായ രൂപത്തെക്കാൾ സാധാരണ വായനയ്ക്ക് യോജിക്കുന്നു.
- source_word: ἡ ἀλήθεια οὐκ ἔστιν
  choice: സത്യം ഇല്ല
  rationale: ‘സത്യം’ എന്നതിന്റെ ആശയപരവും ധാർമികവും ആത്മീയവുമായ യോഹന്നാനീയ സാന്ദ്രത ചുരുക്കാതെ ലളിതമായ നിഷേധപ്രയോഗം നിലനിർത്തുന്നു.
theological_decisions:
- issue: αὐτόν / αὐτοῦ എന്ന സർവനാമങ്ങളുടെ സൂചിതൻ
  choice: ‘അവനെ / അവന്റെ’ എന്ന സർവനാമങ്ങൾ മാത്രം ഉപയോഗിച്ച് സൂചിതനെ പ്രത്യേകം പേരിട്ട് നിർണയിച്ചിട്ടില്ല.
  alternative: ‘ദൈവത്തെ / ദൈവത്തിന്റെ’ അല്ലെങ്കിൽ കൂടുതൽ പ്രത്യേകമായി ‘ക്രിസ്തുവിനെ / ക്രിസ്തുവിന്റെ’ എന്നു നൽകുക.
  rationale: ഉടൻമുമ്പുള്ള സന്ദർഭം ദൈവത്തെ സൂചിപ്പിക്കുന്നതായി സ്വാഭാവികമാണെങ്കിലും, യോഹന്നാന്റെ ദൈവ-പുത്ര ബന്ധഭാഷയിലെ അടുപ്പം കാരണം മൂലത്തിലെ സർവനാമരൂപം നിലനിർത്തുന്നത് വ്യാഖ്യാനപരമായ സംഘർഷം അനാവശ്യമായി തീർക്കാതിരിക്കുന്നു.
- issue: Ἔγνωκα എന്ന ‘അറിയുക’ ഭാഷയുടെ സ്വഭാവം
  choice: തുടരുന്ന ബന്ധപരമായ അറിവിനെ ‘അറിഞ്ഞിരിക്കുന്നു’ എന്നു പ്രകടിപ്പിച്ചു.
  alternative: വെറും ബൗദ്ധിക അറിവായി തോന്നാവുന്ന ‘അറിയുന്നു’ എന്നു നൽകുക.
  rationale: പൂർണകാലം മുമ്പ് ഉണ്ടായ അറിവിന്റെ ഇപ്പോഴത്തെ നിലനിൽക്കുന്ന ഫലം സൂചിപ്പിക്കുന്നു; എന്നാൽ ഈ പരിഭാഷ മിസ്റ്റിക് ഐക്യം പോലുള്ള അധിക ആശയം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. വാക്യത്തിന്റെ കർശനമായ ധാർമിക വിധി മയപ്പെടുത്തിയിട്ടില്ല; അതേസമയം മൂലത്തിൽ പേരിടാത്ത സർവനാമസൂചിതനെ വ്യാഖ്യാനിച്ച് വ്യക്തമാക്കിയിട്ടില്ല.
