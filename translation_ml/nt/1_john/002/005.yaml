id: 1JN.2.5
reference: 1 John 2:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃς δ’ ἂν τηρῇ αὐτοῦ τὸν λόγον, ἀληθῶς ἐν τούτῳ ἡ ἀγάπη τοῦ θεοῦ τετελείωται. ἐν τούτῳ γινώσκομεν ὅτι ἐν αὐτῷ ἐσμεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/005.yaml
  text: 'But whoever keeps his word[a], truly in him the love of God has been perfected[b]. By this we know that we are in him:'
translation:
  language: ml
  text: 'എന്നാൽ അവന്റെ വചനം പാലിക്കുന്നവനിൽ ദൈവത്തിന്റെ സ്നേഹം യഥാർഥമായി പൂർണത പ്രാപിച്ചിരിക്കുന്നു.[a] നാം അവനിൽ ആകുന്നു എന്നു ഇതിലൂടെ അറിയുന്നു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പാലിക്കുന്നവനിൽ’ എന്നതിനുള്ള ഗ്രീക്ക് പദപ്രയോഗം കൂടുതൽ അക്ഷരാർഥത്തിൽ ‘ഇതിൽ’ അല്ലെങ്കിൽ ‘ഇയാളിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം; അത് വചനം പാലിക്കുന്ന വ്യക്തിയെയോ ഈ കാര്യത്തെ തെളിവായോ സൂചിപ്പിക്കാം. ‘ദൈവത്തിന്റെ സ്നേഹം’ എന്നത് ദൈവം വിശ്വാസിയോടു കാണിക്കുന്ന സ്നേഹമെന്നോ വിശ്വാസിക്ക് ദൈവത്തോടുള്ള സ്നേഹമെന്നോ അർഥമാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃς δ’ ἂν
  choice: എന്നാൽ ... പാലിക്കുന്നവനിൽ
  rationale: δέ മുൻവാക്യത്തോടുള്ള മൃദുവായ വൈരുധ്യം സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ എന്നു നൽകി; ὃς ... ἂν പൊതുവായ, അനിശ്ചിത വ്യവസ്ഥയായ ‘ആരെങ്കിലും/ആ വ്യക്തി’ എന്ന ആശയം നൽകുന്നു. മലയാളത്തിൽ ‘പാലിക്കുന്നവൻ’ എന്ന രൂപം സ്വാഭാവികമാണ്.
- source_word: τηρῇ
  choice: പാലിക്കുന്ന
  rationale: τηρέω എന്നതിന് കാത്തുസൂക്ഷിക്കുക, അനുസരിക്കുക, പാലിക്കുക എന്നീ അർഥങ്ങളുണ്ട്. ‘പാലിക്കുക’ യോഹന്നാന്റെ വചനവും കല്പനകളും പാലിക്കുന്നതിനെക്കുറിച്ചുള്ള പ്രയോഗബന്ധം നിലനിർത്തുകയും വെറും ബാഹ്യാനുസരണമായി അർഥം ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: αὐτοῦ τὸν λόγον
  choice: അവന്റെ വചനം
  rationale: λόγος ഏകവചനമാണ്; ദൈവത്തിന്റെയോ ക്രിസ്തുവിന്റെയോ അറിയിക്കപ്പെട്ട വചനത്തെ വിശാലമായി സൂചിപ്പിക്കുന്നു. ‘വചനം’ യോഹന്നാന്റെ പദപ്രയോഗവും ദൈവശാസ്ത്രപരമായ അനുരണനവും നിലനിർത്തുന്നു; αὐτοῦ എന്ന സർവനാമം ‘അവന്റെ’ ആയി സംരക്ഷിച്ചു.
- source_word: ἀληθῶς
  choice: യഥാർഥമായി
  rationale: പ്രസ്താവനയ്ക്ക് ഊന്നൽ നൽകുന്ന ക്രിയാവിശേഷണത്തെ ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἐν τούτῳ
  choice: പാലിക്കുന്നവനിൽ
  rationale: ആദ്യത്തെ ἐν τούτῳ അനുസരിക്കുന്ന വ്യക്തിയെ സൂചിപ്പിക്കാം. മലയാളത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ മുൻപറഞ്ഞ വ്യക്തിയെ ആവർത്തിച്ചു; ‘ഇതിൽ/ഇയാളിൽ’ എന്ന കൂടുതൽ അക്ഷരാർഥ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ സ്നേഹം
  rationale: τοῦ θεοῦ എന്ന ജനിറ്റീവ് ദൈവം നൽകുന്ന സ്നേഹമെന്നോ ദൈവത്തോടുള്ള സ്നേഹമെന്നോ അർഥമാക്കാവുന്നതാണ്. ‘ദൈവത്തിന്റെ സ്നേഹം’ പ്രധാനപാഠത്തിൽ ഈ യഥാർഥ സന്ദിഗ്ധത നിലനിർത്തുന്നു.
- source_word: τετελείωται
  choice: പൂർണത പ്രാപിച്ചിരിക്കുന്നു
  rationale: പെർഫെക്റ്റ് പാസീവ് രൂപം പൂർത്തിയിലേക്കെത്തി ഇപ്പോഴും നിലനിൽക്കുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു. ‘പൂർണത പ്രാപിച്ചിരിക്കുന്നു’ എന്നത് സ്വാഭാവിക മലയാളത്തിൽ ലക്ഷ്യസാഫല്യത്തിന്റെയും പരിപക്വതയുടെയും യോഹന്നാനീയ ഭാവം നിലനിർത്തുന്നു.
- source_word: ἐν τούτῳ γινώσκομεν
  choice: ഇതിലൂടെ അറിയുന്നു
  rationale: ഈ യോഹന്നാനീയ സൂത്രവാക്യം അറിവിന്റെ തെളിവിനെയോ അടിസ്ഥാനത്തെയോ പരിചയപ്പെടുത്തുന്നു. ‘ഇതിലൂടെ’ ആ ഉപാധി/തെളിവ് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ὅτι ἐν αὐτῷ ἐσμεν
  choice: നാം അവനിൽ ആകുന്നു എന്ന്
  rationale: ἐν αὐτῷ എന്ന പ്രധാന യോഹന്നാനീയ പ്രയോഗത്തെ ‘അവനിൽ’ എന്നു നേരിട്ട് നിലനിർത്തി; ‘ഐക്യത്തിലാകുന്നു’ പോലുള്ള വ്യാഖ്യാനപരമായ വിപുലീകരണം ഒഴിവാക്കി.
theological_decisions:
- issue: ἡ ἀγάπη τοῦ θεοῦ എന്നതിലെ ജനിറ്റീവിന്റെ അർഥം
  choice: ദൈവത്തിന്റെ സ്നേഹം
  alternative: ദൈവം നമ്മോടു കാണിക്കുന്ന സ്നേഹം; ദൈവത്തോടുള്ള നമ്മുടെ സ്നേഹം
  rationale: ഗ്രീക്ക് ജനിറ്റീവ് രണ്ടുവിധത്തിലും വായിക്കാവുന്നതാണ്; യോഹന്നാനീയ സന്ദർഭവും രണ്ടിനും ഇടം നൽകുന്നു. അതിനാൽ പ്രധാനപാഠം സന്ദിഗ്ധത പരിഹരിക്കാതെ നിലനിർത്തുകയും അടിക്കുറിപ്പ് സാധ്യതകൾ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- issue: ആദ്യത്തെ ἐν τούτῳയുടെ സൂചന
  choice: വചനം പാലിക്കുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ‘പാലിക്കുന്നവനിൽ’
  alternative: ഇതിൽ; ഇയാളിൽ
  rationale: സർവനാമം വ്യക്തിയെയോ ഈ കാര്യത്തെ തെളിവായോ സൂചിപ്പിക്കാം. വ്യക്തിപരമായ വായന സന്ദർഭത്തിൽ സ്വാഭാവികമാണ്; എന്നാൽ മറ്റുസാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: ἐν αὐτῷ എന്ന ബന്ധപരമായ പ്രയോഗം
  choice: അവനിൽ
  alternative: അവനോടുള്ള ഐക്യത്തിൽ
  rationale: ‘അവനിൽ’ എന്ന രൂപം മൂലപാഠത്തിന്റെ സംക്ഷിപ്തവും ദൈവശാസ്ത്രപരമായി സമ്പന്നവുമായ ഭാഷ നിലനിർത്തുന്നു; വ്യാഖ്യാനത്തിലൂടെ അതിനെ ഒരു പ്രത്യേക സിദ്ധാന്തപരമായ അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. യോഹന്നാനീയ പ്രധാനപദങ്ങളായ ‘വചനം’, ‘സ്നേഹം’, ‘അവനിൽ’ എന്നിവ സംരക്ഷിച്ചു. ഗ്രീക്കിലെ രണ്ടു യഥാർഥ സന്ദിഗ്ധതകളും ഒറ്റ അടിക്കുറിപ്പിൽ ചുരുക്കി വ്യക്തമാക്കിയിട്ടുണ്ട്; [a] പ്രധാനപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
