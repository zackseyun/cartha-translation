id: 1JN.2.13
reference: 1 John 2:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: γράφω ὑμῖν, πατέρες, ὅτι ἐγνώκατε τὸν ἀπ’ ἀρχῆς· γράφω ὑμῖν, νεανίσκοι, ὅτι νενικήκατε τὸν πονηρόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/013.yaml
  text: I write to you[a], fathers, because you have known him who is from the beginning; I write to you, young men, because you have overcome the evil one.
translation:
  language: ml
  text: പിതാക്കന്മാരേ, ആദിമുതലുള്ളവനെ[a] നിങ്ങൾ അറിഞ്ഞിരിക്കുന്നതിനാൽ ഞാൻ നിങ്ങൾക്ക് എഴുതുന്നു. യുവാക്കളേ, ദുഷ്ടനെ നിങ്ങൾ ജയിച്ചിരിക്കുന്നതിനാൽ ഞാൻ നിങ്ങൾക്ക് എഴുതുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ആദിമുതലുള്ള ആ ഒരുവനെ’; ഈ പ്രയോഗം പുത്രനെ സൂചിപ്പിക്കുന്നതാകാൻ സാധ്യത കൂടുതലാണെങ്കിലും, ചിലർ ഇത് കൂടുതൽ പൊതുവായി ദൈവത്തെക്കുറിച്ചുള്ള പരാമർശമായി മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: γράφω
  choice: ഞാൻ നിങ്ങൾക്ക് എഴുതുന്നു
  rationale: വർത്തമാനകാലത്തിലുള്ള ഗ്രീക്ക് ക്രിയയുടെ കത്തിന്റെ സന്ദർഭത്തിലെ നേരിട്ടുള്ള ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: πατέρες
  choice: പിതാക്കന്മാരേ
  rationale: അക്ഷരാർഥമായ സംബോധന നിലനിർത്തുന്നു; ഇവിടെ ആത്മീയ പക്വതയുള്ള പുരുഷന്മാരെ സൂചിപ്പിക്കാമെങ്കിലും ‘മൂപ്പന്മാർ’ എന്ന് വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: ἐγνώκατε
  choice: നിങ്ങൾ അറിഞ്ഞിരിക്കുന്നു
  rationale: പൂർണ്ണകാലത്തിന്റെ, സംഭവിച്ച അറിവും അതിന്റെ തുടരുന്ന ഫലവും, മലയാളത്തിലെ ‘അറിഞ്ഞിരിക്കുന്നു’ എന്ന രൂപം പ്രകടിപ്പിക്കുന്നു.
- source_word: τὸν ἀπ’ ἀρχῆς
  choice: ആദിമുതലുള്ളവനെ
  rationale: ആ വ്യക്തി ആരെന്നു മുഖ്യവാക്യത്തിൽ വ്യക്തമാക്കാതെ, ഗ്രീക്കിലെ നാമവൽക്കരിച്ച പ്രയോഗവും യോഹന്നാനീയ ശൈലിയും സംരക്ഷിക്കുന്നു.
- source_word: νεανίσκοι
  choice: യുവാക്കളേ
  rationale: പുരുഷലിംഗ ബഹുവചന സംബോധനയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: νενικήκατε
  choice: നിങ്ങൾ ജയിച്ചിരിക്കുന്നു
  rationale: നേടിയ ജയവും അതിന്റെ നിലനിൽക്കുന്ന ഫലവും സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പൂർണ്ണകാലത്തെ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: τὸν πονηρόν
  choice: ദുഷ്ടനെ
  rationale: പുരുഷലിംഗ ഏകവചന നാമവൽക്കൃത വിശേഷണം വ്യക്തിപരമായ ദുഷ്ട എതിരാളിയെ സൂചിപ്പിക്കുന്നതിനാൽ അമൂർത്തമായ ‘തിന്മ’ എന്നതിനു പകരം വ്യക്തിയെ സൂചിപ്പിക്കുന്ന രൂപം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: ‘ആദിമുതലുള്ളവൻ’ എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: മുഖ്യവാക്യത്തിൽ ‘ആദിമുതലുള്ളവൻ’ എന്നു മാത്രം നൽകി സൂചിതവ്യക്തിയെ വ്യക്തമാക്കുന്നില്ല
  alternative: പുത്രൻ/മശീഹ; അല്ലെങ്കിൽ കൂടുതൽ പൊതുവായി ദൈവം
  rationale: യോഹന്നാനീയ പ്രയോഗം പുത്രനെ സൂചിപ്പിക്കുന്നതാകാൻ സാധ്യത കൂടുതലാണെങ്കിലും, ഗ്രീക്ക് ഇവിടെ പേര് വ്യക്തമാക്കുന്നില്ല; അതിനാൽ വാചകത്തിലെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
- issue: ‘ദുഷ്ടൻ’ എന്നതിന്റെ അർഥം
  choice: വ്യക്തിപരമായ ദുഷ്ട എതിരാളി
  alternative: അമൂർത്തമായ തിന്മ
  rationale: പുരുഷലിംഗ ഏകവചന ആർട്ടിക്കിളോടുകൂടിയ നാമവൽക്കൃത രൂപം വ്യക്തിയെ ശക്തമായി സൂചിപ്പിക്കുന്നു; എന്നാൽ ഗ്രീക്കിൽ ഇല്ലാത്ത ‘സാത്താൻ’ എന്ന പേര് ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും മാന്യവുമായ കത്ത്-ശൈലി. രണ്ട് സമാന്തര സംബോധനങ്ങളും കാരണവാക്യങ്ങളും വ്യക്തമായി നിലനിർത്തി; അനാവശ്യമായ സഭാപാരമ്പര്യ പദങ്ങൾ ഒഴിവാക്കി.
