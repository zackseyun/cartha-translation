  text: The one who says he is in the light and hates his brother is in the darkness until now[a].
translation:
  language: ml
  text: വെളിച്ചത്തിലാണെന്ന് പറയുകയും തന്റെ സഹോദരനെ വെറുക്കുകയും ചെയ്യുന്നവൻ ഇപ്പോഴും ഇരുട്ടിലാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തന്റെ സഹോദരനെയോ സഹോദരിയെയോ.” ഗ്രീക്കിൽ പുല്ലിംഗ ഏകവചനമായ “സഹോദരൻ” എന്നാണ്; ഈ നൈതിക സന്ദർഭത്തിൽ അത് പ്രതിനിധിപരമായി ഉപയോഗിച്ചിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λέγων
  choice: പറയുകയും ... ചെയ്യുന്നവൻ
  rationale: നിശ്ചയാർഥകപദത്തോടുകൂടിയ വർത്തമാനകാല കൃദന്തം ഒരു പ്രതിനിധിയായ വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ബന്ധവാക്യരൂപം സ്വാഭാവികവും സ്വഭാവസവിശേഷതയായ പ്രവൃത്തിയുടെ ഭാവം നിലനിർത്തുന്നതുമാണ്.
- source_word: ἐν τῷ φωτὶ εἶναι
  choice: വെളിച്ചത്തിലാണെന്ന്
  rationale: യോഹന്നാന്റെ വെളിച്ചം എന്ന രൂപകവും അതിനുള്ളിൽ/ആ മണ്ഡലത്തിൽ ആയിരിക്കുന്നതെന്ന ആശയവും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: തന്റെ സഹോദരനെ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ഏകവചനമായ ἀδελφός എന്ന പദത്തിന്റെ രൂപം സംരക്ഷിക്കുന്നു; ‘സഹവിശ്വാസി’ എന്നു പരിഭാഷപ്പെടുത്തി സന്ദർഭപരമായ വ്യാഖ്യാനം മുഖ്യപാഠത്തിലേക്ക് കൊണ്ടുവരുന്നില്ല.
- source_word: μισῶν
  choice: വെറുക്കുകയും ചെയ്യുന്നവൻ
  rationale: വർത്തമാനകാല കൃദന്തം സൂചിപ്പിക്കുന്ന തുടരുന്ന അഥവാ സ്വഭാവപരമായ മനോഭാവം മലയാളത്തിലെ വർത്തമാനകാല ബന്ധവാക്യം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐν τῇ σκοτίᾳ ἐστὶν
  choice: ഇരുട്ടിലാണ്
  rationale: ‘വെളിച്ചത്തിൽ’ എന്ന പ്രയോഗത്തോടുള്ള യോഹന്നാന്റെ ഉദ്ദേശ്യപൂർവമായ വിരുദ്ധസമാന്തരത നിലനിർത്തുന്നു.
- source_word: ἕως ἄρτι
  choice: ഇപ്പോഴും
  rationale: നില ഇന്നത്തെ നിമിഷംവരെ തുടരുന്നു എന്ന കാലസൂചന മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു. ‘ഇതുവരെ’ എന്നതും സാധ്യമാണ്; എന്നാൽ ഇവിടെ തുടരുന്ന അവസ്ഥയ്ക്ക് ‘ഇപ്പോഴും’ കൂടുതൽ സുതാര്യമാണ്.
theological_decisions:
- issue: പ്രതിനിധിയായ ഏകവചന നൈതിക പ്രസ്താവനയിലെ ἀδελφός എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: സഹോദരൻ
  alternative: സഹോദരനെയോ സഹോദരിയെയോ; സഹവിശ്വാസി
  rationale: മുഖ്യപാഠത്തിൽ ഗ്രീക്കിലെ പുല്ലിംഗ ഏകവചനം നിലനിർത്തുന്നു. ഈ നൈതിക സന്ദർഭത്തിൽ പദം പ്രതിനിധിപരമായി ഇരുലിംഗക്കാരെയും ഉൾക്കൊള്ളാൻ സാധ്യതയുള്ളതിനാൽ അത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു. ‘സഹവിശ്വാസി’ സന്ദർഭപരമായി സാധ്യതയുള്ളതെങ്കിലും കൂടുതൽ വ്യാഖ്യാനാത്മകമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. ‘വെളിച്ചം/ഇരുട്ട്’ എന്ന യോഹന്നാനീയ രൂപകവിരുദ്ധത നേരിട്ട് നിലനിർത്തി; വാക്യക്രമം മലയാളത്തിന്റെ സ്വാഭാവിക ബന്ധവാക്യഘടനയ്ക്കനുസരിച്ച് ക്രമപ്പെടുത്തി.
