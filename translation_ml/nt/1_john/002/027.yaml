id: 1JN.2.27
reference: 1 John 2:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς τὸ χρῖσμα ὃ ἐλάβετε ἀπ’ αὐτοῦ ⸂μένει ἐν ὑμῖν⸃, καὶ οὐ χρείαν ἔχετε ἵνα τις διδάσκῃ ὑμᾶς· ἀλλ’ ὡς τὸ ⸀αὐτοῦ χρῖσμα διδάσκει ὑμᾶς περὶ πάντων, καὶ ἀληθές ἐστιν καὶ οὐκ ἔστιν ψεῦδος, καὶ καθὼς ἐδίδαξεν ὑμᾶς, ⸀μένετε ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/027.yaml
  text: And as for you[a], the anointing that you received from him remains in you, and you have no need that anyone should teach you. But as his anointing teaches you about all things, and is true and is not a lie, and just as it taught you[b], remain in him.
translation:
  language: ml
  text: നിങ്ങളാകട്ടെ, അവനിൽനിന്നു നിങ്ങൾ സ്വീകരിച്ച അഭിഷേകം നിങ്ങളിൽ നിലനിൽക്കുന്നു; ആരെങ്കിലും നിങ്ങളെ പഠിപ്പിക്കേണ്ട ആവശ്യം നിങ്ങൾക്കില്ല. എന്നാൽ, അവന്റെ അഭിഷേകം എല്ലാ കാര്യങ്ങളെക്കുറിച്ചും നിങ്ങളെ പഠിപ്പിക്കുന്നതുപോലെ—അതു സത്യമാണ്, നുണയല്ല—അതു നിങ്ങളെ പഠിപ്പിച്ചതുപോലെതന്നെ, അവനിൽ നിലനിൽക്കുവിൻ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ചില കൈയെഴുത്തുപ്രതികളിൽ: “അതു നിങ്ങളെ പഠിപ്പിച്ചതുപോലെ, നിങ്ങൾ അവനിൽ നിലനിൽക്കുന്നു.”'
    reason: textual_variant
  - marker: b
    text: “നിങ്ങളിൽ വസിക്കുന്നു” / “അവനിൽ വസിക്കുവിൻ” എന്നും പരിഭാഷപ്പെടുത്താം; ഈ വാക്യത്തിലുടനീളം ഒരേ ഗ്രീക്ക് ക്രിയയാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: χρῖσμα
  choice: അഭിഷേകം
  rationale: അഭിഷേകത്തിന്റെ രൂപകം നിലനിർത്തുന്നു; അതിനെ പ്രധാനപാഠത്തിൽ നേരിട്ട് ‘പരിശുദ്ധാത്മാവ്’ എന്നു വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: ἀπ’ αὐτοῦ
  choice: അവനിൽനിന്നു
  rationale: മുൻസന്ദർഭത്തിലെ വ്യക്തിയിലേക്കുള്ള സർവനാമസൂചന ഗ്രീക്കിലുള്ളതുപോലെ നിലനിർത്തുന്നു.
- source_word: μένει ἐν ὑμῖν / μένετε ἐν αὐτῷ
  choice: നിങ്ങളിൽ നിലനിൽക്കുന്നു / അവനിൽ നിലനിൽക്കുവിൻ
  rationale: μένω എന്ന ഒരേ ക്രിയയുടെ ആവർത്തനം ‘നിലനിൽക്കുക’ ഉപയോഗിച്ച് പ്രകടമാക്കുകയും അവസാനരൂപത്തെ ആജ്ഞയായി വിവർത്തനം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: οὐ χρείαν ἔχετε ἵνα τις διδάσκῃ ὑμᾶς
  choice: ആരെങ്കിലും നിങ്ങളെ പഠിപ്പിക്കേണ്ട ആവശ്യം നിങ്ങൾക്കില്ല
  rationale: ഗ്രീക്കിലെ ശക്തമായ പ്രസ്താവനയെ മയപ്പെടുത്താതെയും സഭയിലെ സകല മാനുഷിക ഉപദേശവും നിരാകരിക്കുന്ന വ്യാഖ്യാനം ചേർക്കാതെയും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: διδάσκῃ / διδάσκει / ἐδίδαξεν
  choice: പഠിപ്പിക്കുക / പഠിപ്പിക്കുന്നു / പഠിപ്പിച്ചു
  rationale: മൂന്നു രൂപങ്ങളിലും ഒരേ പദം ഉപയോഗിച്ച് മൂലപാഠത്തിലെ ആവർത്തനം സൂക്ഷിക്കുന്നു.
- source_word: περὶ πάντων
  choice: സകല കാര്യങ്ങളെയുംകുറിച്ച്
  rationale: പ്രയോഗത്തിന്റെ വിശാലത ചുരുക്കാതെ വ്യക്തമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀληθές ἐστιν καὶ οὐκ ἔστιν ψεῦδος
  choice: അത് സത്യമാണ്, ഭോഷ്കല്ല
  rationale: യോഹന്നാന്റെ സത്യം–ഭോഷ്ക് വിരുദ്ധത ലളിതവും ശക്തവുമായി നിലനിർത്തുന്നു.
- source_word: καθὼς ἐδίδαξεν ὑμᾶς
  choice: അത് നിങ്ങളെ പഠിപ്പിച്ചതുപോലെതന്നെ
  rationale: അഭിഷേകത്തിന്റെ മുൻകാല പഠിപ്പിക്കലിനെയും തുടർന്നുള്ള ആജ്ഞയെയും ബന്ധിപ്പിക്കുന്ന താരതമ്യം സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: χρῖσμα എന്ന ‘അഭിഷേകത്തിന്റെ’ സൂചിതാർത്ഥം
  choice: പ്രധാനപാഠത്തിൽ ‘അഭിഷേകം’ എന്ന രൂപകം നിലനിർത്തി.
  alternative: ‘പരിശുദ്ധാത്മാവ്’ അല്ലെങ്കിൽ ‘ലഭിച്ച സന്ദേശം’ എന്നു വ്യക്തമാക്കുക.
  rationale: സന്ദർഭത്തിൽ ആത്മാവിനെയോ ആത്മാവിന്റെ പ്രവർത്തനത്തെയോ സൂചിപ്പിക്കാമെങ്കിലും വാക്യം തന്നെയുള്ള രൂപകം സംരക്ഷിക്കുന്നത് അനാവശ്യമായ സിദ്ധാന്തവ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
- issue: ‘ആരെങ്കിലും നിങ്ങളെ പഠിപ്പിക്കേണ്ട ആവശ്യം നിങ്ങൾക്കില്ല’ എന്നതിന്റെ വ്യാപ്തി
  choice: പ്രസ്താവനയെ ഉള്ളതുപോലെ നിലനിർത്തി.
  alternative: സകല മാനുഷിക അധ്യാപനത്തിന്റെയും സമ്പൂർണ നിരാകരണമെന്നോ വേർപിരിഞ്ഞുപോയവരുടെ ഉപദേശം മാത്രം ആവശ്യമില്ലെന്നോ തുറന്നു വ്യാഖ്യാനിക്കുക.
  rationale: ഗ്രീക്കിന്റെ ശക്തി ചോർത്താതെയും സന്ദർഭാധിഷ്ഠിതമായ വ്യാഖ്യാനം പ്രധാനപാഠത്തിൽ ചേർക്കാതെയും വിവർത്തനം ചെയ്യുന്നു.
- issue: അവസാനത്തെ μένετε എന്ന ക്രിയാരൂപം
  choice: 'ആജ്ഞാർത്ഥം: ‘അവനിൽ നിലനിൽക്കുവിൻ.’'
  alternative: 'സൂചനാർത്ഥം: ‘നിങ്ങൾ അവനിൽ നിലനിൽക്കുന്നു.’'
  rationale: SBLGNT-യിലെ രൂപം സന്ദർഭത്തിൽ സ്വാഭാവികമായി ആജ്ഞാർത്ഥമാണ്; സൂചനാർത്ഥ വായനയ്ക്കുള്ള പാഠഭേദം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- issue: അവസാനത്തെ ἐν αὐτῷ എന്നതിലെ സർവനാമത്തിന്റെ സൂചകം
  choice: ‘അവനിൽ’ എന്ന പുരുഷസൂചക രൂപം നിലനിർത്തി.
  alternative: അഭിഷേകത്തെ സൂചിപ്പിക്കുന്നതായി ‘അതിൽ’ എന്നു നൽകുക.
  rationale: ഗ്രീക്കിലെ പുരുഷലിംഗ സർവനാമവും മുൻസന്ദർഭത്തിലെ വ്യക്തിസൂചനയും നിലനിർത്തുന്നു; സൂചകത്തെ വിശദമായി നിർണ്ണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അഭിഷേകം’, ‘സത്യം’, ‘ഭോഷ്ക്’, ‘നിലനിൽക്കുക’ എന്നീ പദങ്ങൾ യോഹന്നാന്റെ രൂപകവും വിരുദ്ധതയും ആവർത്തനവും സൂക്ഷിക്കുന്നു. പ്രധാനപാഠത്തിലെ എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും [a], [b] ആയി ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
