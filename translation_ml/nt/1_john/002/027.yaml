  to: നിങ്ങളാകട്ടെ, അവനിൽനിന്നു നിങ്ങൾ സ്വീകരിച്ച അഭിഷേകം നിങ്ങളിൽ നിലനിൽക്കുന്നു; ആരെങ്കിലും നിങ്ങളെ പഠിപ്പിക്കേണ്ട ആവശ്യം നിങ്ങൾക്കില്ല. എന്നാൽ, അവന്റെ അഭിഷേകം എല്ലാ കാര്യങ്ങളെക്കുറിച്ചും നിങ്ങളെ പഠിപ്പിക്കുന്നതുപോലെ—അതു സത്യമാണ്, നുണയല്ല—അതു നിങ്ങളെ പഠിപ്പിച്ചതുപോലെതന്നെ, അവനിൽ നിലനിൽക്കുവിൻ.[a][b]
