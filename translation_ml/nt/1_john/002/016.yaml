id: 1JN.2.16
reference: 1 John 2:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι πᾶν τὸ ἐν τῷ κόσμῳ, ἡ ἐπιθυμία τῆς σαρκὸς καὶ ἡ ἐπιθυμία τῶν ὀφθαλμῶν καὶ ἡ ἀλαζονεία τοῦ βίου, οὐκ ἔστιν ἐκ τοῦ πατρός, ἀλλὰ ἐκ τοῦ κόσμου ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/016.yaml
  text: For everything in the world—the desire of the flesh[a], the desire of the eyes, and the pride of life—is not from the Father[c][b], but is from the world.
translation:
  language: ml
  text: കാരണം, ലോകത്തിലുള്ള സകലവും—ജഡത്തിന്റെ മോഹവും[a][b], കണ്ണുകളുടെ മോഹവും, ജീവിതത്തിലെ പൊങ്ങച്ചവും[c]—പിതാവിൽനിന്നുള്ളതല്ല; ലോകത്തിൽനിന്നുള്ളതാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ജഡത്തിന്റെ ദുരാസക്തി.’ ഗ്രീക്ക് പദത്തിന് ശക്തമായ ആഗ്രഹം, ആസക്തി, കാമം എന്നീ അർഥങ്ങൾ വരാം; ഇവിടെ അത് ലൈംഗിക മോഹത്തെ മാത്രം സൂചിപ്പിക്കുന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘പാപസ്വഭാവത്തിന്റെ മോഹം.’ ‘ജഡം’ എന്ന ഗ്രീക്ക് പദം ചില സന്ദർഭങ്ങളിൽ പാപത്തിന് വിധേയമായ മനുഷ്യസ്വഭാവത്തെ രൂപകമായി സൂചിപ്പിക്കാം.
    reason: alternative_reading
  - marker: c
    text: അഥവാ ‘ജീവിതത്തിന്റെ അഹങ്കാരം’ അല്ലെങ്കിൽ ‘ലൗകികജീവിതത്തിന്റെ വീമ്പ്.’ ഈ പ്രയോഗത്തിൽ പദവി, സമ്പത്ത്, ഉപജീവനസാധനങ്ങൾ, ജീവിതരീതി എന്നിവയെക്കുറിച്ചുള്ള പൊങ്ങച്ചം ഉൾപ്പെടാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ ലോകത്തെ സ്നേഹിക്കരുതെന്ന കല്പനയ്ക്കുള്ള കാരണം അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് ബന്ധകത്തിന്റെ കാരണാർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: πᾶν τὸ ἐν τῷ κόσμῳ
  choice: ലോകത്തിലുള്ള സകലവും
  rationale: നപുംസക ഏകവചനരൂപം സമാഹാരാർഥത്തിൽ ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ സമഗ്രമായ വ്യാപ്തി സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: κόσμῳ / κόσμου
  choice: ലോകം / ലോകത്തിൽനിന്ന്
  rationale: ദൈവത്തോട് എതിർപ്പുള്ള മനുഷ്യക്രമം ഇവിടെ സൂചിപ്പിക്കാമെങ്കിലും, വ്യാഖ്യാനാത്മകമായ ‘ലോകവ്യവസ്ഥ’ ചേർക്കാതെ ഗ്രീക്കിലെ വിശാലമായ പദം നിലനിർത്തുന്നു.
- source_word: ἐπιθυμία
  choice: മോഹം
  rationale: ശക്തമായ ആഗ്രഹമോ ആസക്തിയോ എന്ന പ്രതികൂല സന്ദർഭാർഥം നൽകുന്നു; അതിനെ ലൈംഗിക മോഹത്തിലേക്ക് മാത്രം ചുരുക്കുന്നില്ല.
- source_word: τῆς σαρκὸς
  choice: ജഡത്തിന്റെ
  rationale: σάρξ എന്ന പദത്തിന്റെ ദേഹപരവും രൂപകപരവുമായ അർഥസാധ്യതകൾ തുറന്നുവെക്കുകയും ‘പാപസ്വഭാവം’ എന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ നിർബന്ധിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: τῶν ὀφθαλμῶν
  choice: കണ്ണുകളുടെ
  rationale: ഗ്രീക്കിലെ ബഹുവചനവും ജനിറ്റീവ് ബന്ധവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: ἡ ἀλαζονεία τοῦ βίου
  choice: ജീവിതത്തിലെ പൊങ്ങച്ചം
  rationale: അഹങ്കാരപൂർണമായ അവകാശവാദം, പ്രദർശനം, പദവി-സമ്പത്ത്-ജീവിതരീതി എന്നിവയിലെ വീമ്പ് എന്നീ സൂചനകൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന രീതിയിൽ നൽകുന്നു; βίος എന്നതിന്റെ വ്യാപ്തി ഒരൊറ്റ ആശയത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: οὐκ ἔστιν ἐκ τοῦ πατρός
  choice: പിതാവിൽനിന്നുള്ളതല്ല
  rationale: ἐκ സൂചിപ്പിക്കുന്ന ഉറവിടം വ്യക്തമായി പ്രകടമാക്കുകയും പിതാവും ലോകവും തമ്മിലുള്ള സമാന്തരവിരോധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἀλλὰ ἐκ τοῦ κόσμου ἐστίν
  choice: ലോകത്തിൽനിന്നുള്ളതാണ്
  rationale: ഉറവിടത്തെക്കുറിച്ചുള്ള ഗ്രീക്ക് വിരോധഘടനയും മുൻവാക്യഭാഗത്തോടുള്ള സമാന്തരതയും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ധാർമ്മികമായി പ്രതികൂലമായ പട്ടികയിൽ σάρξ എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: ജഡം
  alternative: പാപസ്വഭാവം
  rationale: ‘ജഡം’ മൂലപദത്തിന്റെ ദേഹപരവും രൂപകപരവുമായ പിരിമുറുക്കം സംരക്ഷിക്കുന്നു. ‘പാപസ്വഭാവം’ സാധ്യമായ വ്യാഖ്യാനമാണെങ്കിലും അത് ഒരു പ്രത്യേക മാനവശാസ്ത്രപരമായ വായനയെ മുഖ്യപാഠത്തിൽ ഉറപ്പിക്കും.
- issue: κόσμος എന്ന പദത്തിന്റെ വ്യാഖ്യാനം
  choice: ലോകം
  alternative: ദൈവത്തോട് എതിർപ്പുള്ള ലോകവ്യവസ്ഥ
  rationale: ഈ സന്ദർഭത്തിൽ പ്രതികൂലമായ മനുഷ്യക്രമം ഉദ്ദേശിക്കപ്പെടുന്നുവെങ്കിലും, ഗ്രീക്ക് പദത്തേക്കാൾ ചുരുങ്ങിയ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർക്കാതെ സന്ദർഭം തന്നെ അതിന്റെ താത്പര്യം വ്യക്തമാക്കാൻ അനുവദിക്കുന്നു.
- issue: ἀλαζονεία τοῦ βίου എന്ന പ്രയോഗത്തിന്റെ പരിധി
  choice: ജീവിതത്തിലെ പൊങ്ങച്ചം
  alternative: ജീവിതത്തിന്റെ അഹങ്കാരം
  rationale: ഈ പ്രയോഗത്തിൽ ഉള്ളിൽ അനുഭവിക്കുന്ന അഭിമാനം മാത്രമല്ല, ജീവിതനില, സമ്പത്ത്, പദവി, ജീവിതരീതി എന്നിവയെക്കുറിച്ചുള്ള വീമ്പും വ്യാജപ്രതാപവും ഉൾപ്പെടാം. ‘പൊങ്ങച്ചം’ ഈ പ്രകടനാത്മക വശം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ മൂന്നു ഘടകങ്ങളുള്ള പട്ടിക ദീർഘരേഖകൾക്കുള്ളിൽ നിലനിർത്തി; ഉറവിടത്തെ സൂചിപ്പിക്കുന്ന ‘പിതാവിൽനിന്ന് / ലോകത്തിൽനിന്ന്’ എന്ന വിരോധസമാന്തരത സംരക്ഷിച്ചു. ‘ജഡം,’ ‘ലോകം,’ ‘ജീവിതം’ എന്നീ ദൈവശാസ്ത്രപരമായി സാന്ദ്രമായ പദങ്ങൾ വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ അടിക്കുറിപ്പുകളിൽ പ്രധാന സാധ്യതകൾ നൽകി.
