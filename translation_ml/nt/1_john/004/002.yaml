id: 1JN.4.2
reference: 1 John 4:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν τούτῳ ⸀γινώσκετε τὸ πνεῦμα τοῦ θεοῦ· πᾶν πνεῦμα ὃ ὁμολογεῖ Ἰησοῦν Χριστὸν ἐν σαρκὶ ἐληλυθότα ἐκ τοῦ θεοῦ ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/002.yaml
  text: 'By this you know the Spirit of God: every spirit that confesses Jesus the Messiah having come in the flesh is from God[c][b][a],'
translation:
  language: ml
  text: 'ഇതിലൂടെ നിങ്ങൾ ദൈവത്തിന്റെ ആത്മാവിനെ തിരിച്ചറിയുന്നു[a]: യേശു എന്ന മശീഹാ[b] ജഡത്തിൽ വന്നവനാണെന്ന്[c] ഏറ്റുപറയുന്ന ഓരോ ആത്മാവും ദൈവത്തിൽനിന്നുള്ളതാണ്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഇതിലൂടെ ദൈവത്തിന്റെ ആത്മാവിനെ തിരിച്ചറിയുക.” ഗ്രീക്ക് ക്രിയാരൂപം പ്രസ്താവനയായും നിർദേശമായും വായിക്കാം.
    reason: grammatical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, “യേശുക്രിസ്തു.” ഗ്രീക്ക് Χριστός (ക്രിസ്തോസ്) എന്നത് ‘മശീഹാ’ എന്ന പദവിയാണ്.
    reason: lexical_alternative
  - marker: c
    text: 'ഗ്രീക്കിലെ സമ്പൂർണകാല കൃതന്തം “ജഡത്തിൽ വന്നവൻ” എന്നു യേശുവിനെ വിശേഷിപ്പിക്കുകയും ആ വരവിന്റെ നിലനിൽക്കുന്ന പ്രസക്തിക്ക് ഊന്നൽ നൽകുകയും ചെയ്യുന്നു. സ്വാഭാവികമായ മറ്റൊരു പരിഭാഷ: “യേശു എന്ന മശീഹാ ജഡത്തിൽ വന്നിരിക്കുന്നു എന്ന്.”'
    reason: grammatical_and_lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: ഇതിലൂടെ
  rationale: ആത്മാവിനെ തിരിച്ചറിയാനുള്ള മാനദണ്ഡം അവതരിപ്പിക്കുന്ന പ്രയോഗമാണിത്; ഉപാധി/മാർഗം എന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: γινώσκετε
  choice: നിങ്ങൾ ... തിരിച്ചറിയുന്നു
  rationale: രൂപശാസ്ത്രപരമായി നിർദേശരൂപവും പ്രസ്താവനാരൂപവും സാധ്യമാണെങ്കിലും, സന്ദർഭത്തിൽ തിരിച്ചറിയൽ എങ്ങനെ നടക്കുന്നു എന്നു പറയുന്ന വർത്തമാനകാല പ്രസ്താവനയായി മുഖ്യപാഠത്തിൽ എടുത്തു; മറ്റേ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: τὸ πνεῦμα τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ ആത്മാവിനെ
  rationale: നിർദ്ദിഷ്ട ഏകവചനവും 4:1–3-ലെ വിരുദ്ധസന്ദർഭവും ദൈവത്തിന്റെ ആത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: πᾶν πνεῦμα
  choice: ഓരോ ആത്മാവും
  rationale: പരിശോധിക്കപ്പെടുന്ന ഏതു ആത്മീയ അവകാശവാദിയെയോ സ്വാധീനത്തെയോ ഉൾക്കൊള്ളുന്ന വിതരണാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὁμολογεῖ
  choice: ഏറ്റുപറയുന്ന
  rationale: തുറന്ന അംഗീകാരവും പ്രഖ്യാപനവും ഉൾക്കൊള്ളുന്ന യോഹന്നാനീയ പ്രയോഗത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: Ἰησοῦν Χριστόν
  choice: യേശു എന്ന മശീഹാ
  rationale: Χριστός ഇവിടെ അർഥമുള്ള പദവിയായി പ്രവർത്തിക്കുന്നു; മലയാളത്തിൽ പേരും പദവിയും സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ ‘എന്ന’ ഉപയോഗിച്ചു.
- source_word: ἐν σαρκὶ
  choice: ജഡത്തിൽ
  rationale: യേശുവിന്റെ യഥാർഥ മനുഷ്യശരീരത്തിലുള്ള വരവിനെ ഉറപ്പിക്കുന്ന മൂലപാഠത്തിന്റെ സാക്ഷാൽ പദപ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: ἐληλυθότα
  choice: വന്നവനാണെന്ന്
  rationale: സമ്പൂർണകാല കർത്തൃവാചക കൃതന്തം യേശുവിനെ വിശേഷിപ്പിക്കുന്നു; മലയാളത്തിൽ ഏറ്റുപറച്ചിലിന്റെ ഉള്ളടക്കം വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുമ്പോൾ അവന്റെ വരവിന്റെ നിലനിൽക്കുന്ന പ്രസക്തിയും സൂക്ഷിക്കുന്നു.
- source_word: ἐκ τοῦ θεοῦ ἐστιν
  choice: ദൈവത്തിൽനിന്നുള്ളതാണ്
  rationale: ἐκ സൂചിപ്പിക്കുന്ന ഉറവിടം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: τὸ πνεῦμα τοῦ θεοῦ എന്നത് പരിശുദ്ധാത്മാവിനെയോ പൊതുവായി ദൈവത്തിൽനിന്നുള്ള ഒരു ആത്മാവിനെയോ സൂചിപ്പിക്കുന്നുവോ
  choice: ദൈവത്തിന്റെ ആത്മാവ് എന്ന നിർദ്ദിഷ്ട പരാമർശമായി പരിഭാഷപ്പെടുത്തി.
  alternative: ദൈവത്തിൽനിന്നുള്ള ആത്മാവ്
  rationale: നിർദ്ദിഷ്ട ഏകവചനവും പിന്നാലെയുള്ള ‘ഓരോ ആത്മാവും’ എന്ന പ്രയോഗവുമായുള്ള വ്യത്യാസവും ദൈവത്തിന്റെ യഥാർഥ ആത്മാവിലേക്കാണ് വിരൽചൂണ്ടുന്നത്; മുഖ്യപാഠത്തിൽ പിന്നീട് രൂപപ്പെട്ട സാങ്കേതിക പദം ചേർത്തിട്ടില്ല.
- issue: ἐν σαρκὶ ἐληλυθότα എന്നതിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ ശക്തി
  choice: ‘ജഡത്തിൽ വന്നവൻ’ എന്ന മൂലപാഠസന്നിഹിതമായ ഭാഷ നിലനിർത്തി.
  alternative: മനുഷ്യനായി വന്നവൻ / മനുഷ്യസ്വഭാവത്തിൽ വന്നവൻ
  rationale: യേശുവിന്റെ യഥാർഥ ദേഹധാരണം ഉറപ്പിക്കുമ്പോഴും ഗ്രീക്കിൽ ഇല്ലാത്ത പിൽക്കാല സാങ്കേതിക ദൈവശാസ്ത്രഭാഷ മുഖ്യപാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ജഡം’ എന്ന ബൈബിൾപദം ഇവിടെ സാങ്കേതിക കാഠിന്യത്തിനല്ല, σάρξ എന്ന പദത്തിന്റെ ദേഹധാരണസംബന്ധമായ കൃത്യതയ്ക്കാണ് നിലനിർത്തിയത്. വാക്യഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കിയെങ്കിലും ഗ്രീക്കിലെ മാനദണ്ഡം, ഏറ്റുപറച്ചിൽ, ഉറവിടം എന്നീ ബന്ധങ്ങൾ സംരക്ഷിച്ചു.
