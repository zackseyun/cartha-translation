id: 1JN.4.13
reference: 1 John 4:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐν τούτῳ γινώσκομεν ὅτι ἐν αὐτῷ μένομεν καὶ αὐτὸς ἐν ἡμῖν, ὅτι ἐκ τοῦ πνεύματος αὐτοῦ δέδωκεν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/013.yaml
  text: 'By this we know that we remain in him and he in us: because he has given us of his Spirit[a][b][c].'
translation:
  language: ml
  text: 'നാം അവനിൽ വസിക്കുന്നു എന്നും അവൻ നമ്മിൽ വസിക്കുന്നു എന്നും ഇതിനാൽ നാം അറിയുന്നു: അവൻ തന്റെ ആത്മാവിൽനിന്ന് നമുക്കു നൽകിയിരിക്കുന്നു[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നാം അവനിൽ നിലനിൽക്കുന്നു എന്നും അവൻ നമ്മിൽ നിലനിൽക്കുന്നു എന്നും.’ μένω എന്ന ഗ്രീക്ക് ക്രിയ തുടരുന്ന ബന്ധത്തിൽ നിലനിൽക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന യോഹന്നാന്റെ ഒരു മുഖ്യപദമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘തന്റെ ആത്മാവിൽനിന്ന്’; ഇവിടെ ഗ്രീക്ക് പ്രയോഗം ഉറവിടത്തിന് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τούτῳ
  choice: ഇതിനാൽ
  rationale: യോഹന്നാന്റെ രചനകളിൽ ഈ പ്രയോഗം എന്തിന്റെ അടിസ്ഥാനത്തിലാണ് ഒരു കാര്യം അറിയുന്നത് എന്നു സൂചിപ്പിക്കുന്നു; ‘ഇതിനാൽ’ തെളിവ്/അടിസ്ഥാനം എന്ന ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: γινώσκομεν
  choice: നാം അറിയുന്നു
  rationale: വർത്തമാനകാല നിർദേശകരൂപം നിലനിൽക്കുന്ന അറിവിനെയോ ഉറപ്പിനെയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ നേരിട്ടും സ്വാഭാവികവുമായ രൂപം.
- source_word: ἐν αὐτῷ μένομεν
  choice: നാം അവനിൽ വസിക്കുന്നു
  rationale: μένω എന്ന യോഹന്നാനീയ മുഖ്യപദത്തിന്റെ തുടരുന്ന ബന്ധവും അവനിൽ നിലനിൽക്കുന്നതും ‘വസിക്കുന്നു’ വ്യക്തമാക്കുന്നു.
- source_word: καὶ αὐτὸς ἐν ἡμῖν
  choice: അവൻ നമ്മിൽ വസിക്കുന്നു
  rationale: ഗ്രീക്കിൽ രണ്ടാം പ്രയോഗത്തിൽ ക്രിയ വിട്ടുകളഞ്ഞിട്ടുണ്ടെങ്കിലും മുൻവാക്യത്തിൽനിന്ന് അത് വ്യക്തമാണ്; മലയാളത്തിലെ വ്യക്തതയ്ക്കായി ക്രിയ ആവർത്തിക്കുന്നു.
- source_word: ὅτι
  choice: 'എന്നും / :'
  rationale: ആദ്യത്തെ ὅτι അറിയുന്നതിന്റെ ഉള്ളടക്കവും രണ്ടാമത്തേത് അതിന്റെ അടിസ്ഥാനവും അവതരിപ്പിക്കുന്നു; രണ്ടാമത്തേത് മലയാളത്തിൽ ദ്വിബിന്ദുവിലൂടെ സ്വാഭാവികമായി ബന്ധിപ്പിക്കാം.
- source_word: ἐκ τοῦ πνεύματος αὐτοῦ
  choice: തന്റെ ആത്മാവിൽനിന്ന്
  rationale: ἐκ ഉറവിടത്തെ സൂചിപ്പിക്കുന്നു. ‘ആത്മാവിൽനിന്ന്’ എന്നത് ഗ്രീക്കിലെ സൂക്ഷ്മത സംരക്ഷിക്കുന്നു; സന്ദർഭം ദൈവത്തിന്റെ ആത്മാവിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ആത്മാവ്’ ഉപയോഗിക്കുന്നു.
- source_word: δέδωκεν ἡμῖν
  choice: നമുക്കു നൽകിയിരിക്കുന്നു
  rationale: ഗ്രീക്ക് പൂർണ്ണകാലം പൂർത്തിയായ പ്രവൃത്തിയും തുടരുന്ന ഫലവും സൂചിപ്പിക്കുന്നു; ‘നൽകിയിരിക്കുന്നു’ അത് മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘അവന്റെ’ എന്നതിന്റെയും ‘ആത്മാവ്’ എന്നതിന്റെയും സൂചിതാർത്ഥം
  choice: പ്രത്യയത്തിന്റെ വ്യക്തതയ്ക്കായി ‘തന്റെ ആത്മാവ്’; സന്ദർഭത്തിൽ ദൈവത്തിന്റെ ആത്മാവ്.
  alternative: പൊതുവായ ആത്മീയ ദാനം അല്ലെങ്കിൽ മനോഭാവം എന്ന അർഥത്തിൽ ‘ആത്മാവ്’ വായിക്കുക.
  rationale: സമീപസന്ദർഭത്തിൽ ദൈവവും വിശ്വാസികളും പരസ്പരം വസിക്കുന്നു എന്നതിന് ദൈവം നൽകിയ ആത്മാവാണ് തെളിവ്. ‘തന്റെ’ ഉടമസ്ഥബന്ധം വ്യക്തമാക്കുന്നു, എന്നാൽ വാക്യത്തിൽ ഇല്ലാത്ത വിശദീകരണം ചേർക്കുന്നില്ല.
- issue: പരസ്പരവാസത്തിന്റെ യോഹന്നാനീയ ഭാഷ
  choice: ‘നാം അവനിൽ വസിക്കുന്നു എന്നും അവൻ നമ്മിൽ വസിക്കുന്നു എന്നും’
  alternative: ‘നാം അവനിൽ നിലനിൽക്കുന്നു എന്നും അവൻ നമ്മിൽ നിലനിൽക്കുന്നു എന്നും’
  rationale: പരസ്പരബന്ധത്തിന്റെ സമാന്തരത നിലനിർത്തുകയും μένω എന്ന പദത്തിന്റെ തുടരുന്ന ബന്ധസൂചന സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ദൈവത്തെ സൂചിപ്പിക്കുന്ന സർവനാമങ്ങൾക്ക് അനാവശ്യ ബഹുമാനബഹുവചനം ഒഴിവാക്കി മൂലപാഠത്തിന്റെ ഏകവചനരൂപം പാലിച്ചു; ‘വസിക്കുന്നു’ എന്ന പദം യോഹന്നാനീയ പരസ്പരവാസഭാഷയുടെ ബന്ധപരവും തുടർച്ചയുള്ളതുമായ ഭാവം വഹിക്കുന്നു.
