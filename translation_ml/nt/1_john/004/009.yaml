id: 1JN.4.9
reference: 1 John 4:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν τούτῳ ἐφανερώθη ἡ ἀγάπη τοῦ θεοῦ ἐν ἡμῖν, ὅτι τὸν υἱὸν αὐτοῦ τὸν μονογενῆ ἀπέσταλκεν ὁ θεὸς εἰς τὸν κόσμον ἵνα ζήσωμεν δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/009.yaml
  text: 'In this the love of God was revealed among us: that God has sent his one and only Son into the world so that we might live through him[a][b].'
translation:
  language: ml
  text: 'ദൈവത്തിന്റെ സ്നേഹം നമ്മുടെ ഇടയിൽ[a] വെളിപ്പെട്ടത് ഇങ്ങനെയാണ്: നാം അവനിലൂടെ ജീവിക്കേണ്ടതിന് ദൈവം തന്റെ ഒരേയൊരു പുത്രനെ[b] ലോകത്തിലേക്ക് അയച്ചിരിക്കുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നമ്മുടെ ഉള്ളിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പ്രയോഗം വിശ്വാസികളുടെ ഉള്ളിലുള്ള വെളിപ്പെടലിനെയോ അവരുടെ സമൂഹത്തിന്റെ ഇടയിലുള്ള വെളിപ്പെടലിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: 'പരമ്പരാഗത പരിഭാഷ: ‘തന്റെ ഏകജാതനായ പുത്രനെ.’ ഗ്രീക്ക് പദമായ μονογενής പുത്രന്റെ അനന്യതയും അതുല്യതയും ഊന്നുന്നു; ‘ഏകജാതനായ’ എന്നത് ചരിത്രപരമായ സഭാഭാഷ സംരക്ഷിക്കുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: ഇങ്ങനെയാണ്
  rationale: തുടർന്നുവരുന്ന ὅτι-വാക്യം സ്നേഹം എങ്ങനെയാണ് വെളിപ്പെട്ടതെന്ന് വിശദീകരിക്കുന്നതിനാൽ, യോഹന്നാന്റെ സൂചനാപ്രയോഗത്തിന്റെ ഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ἐφανερώθη
  choice: വെളിപ്പെട്ടത്
  rationale: മറഞ്ഞിരുന്നത് ദൃശ്യമായോ അറിയപ്പെടുന്നതായോ ആയിത്തീർന്നു എന്ന φανερόω എന്ന ക്രിയയുടെ കർമണിപ്രയോഗഭാവം നിലനിർത്തുന്നു.
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ സ്നേഹം
  rationale: ദൈവത്തിനുള്ളതും ദൈവത്തിൽനിന്ന് പ്രകടമാകുന്നതുമായ സ്നേഹത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും ഔപചാരികവുമായ പരിഭാഷ.
- source_word: ἐν ἡμῖν
  choice: നമ്മുടെ ഇടയിൽ
  rationale: വിശ്വാസിസമൂഹത്തിന്റെ മധ്യേയോ അവരോടുള്ള ബന്ധത്തിലോ ദൈവസ്നേഹം വെളിപ്പെട്ടു എന്ന സമൂഹപരമായ അർഥം പ്രസക്തിയിൽ നന്നായി അറിയിക്കുന്നു; ‘നമ്മുടെ ഉള്ളിൽ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ὅτι
  choice: 'ഇങ്ങനെയാണ്:'
  rationale: ദൈവസ്നേഹം വെളിപ്പെട്ട രീതി തുടർന്നുള്ള വാക്യം വിശദീകരിക്കുന്നു; മലയാളത്തിലെ ദ്വിബിന്ദുവോടുകൂടിയ ഘടന ആ വിശദീകരണബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: τὸν υἱὸν αὐτοῦ τὸν μονογενῆ
  choice: തന്റെ ഒരേയൊരു പുത്രനെ
  rationale: μονογενής ഇവിടെ പുത്രന്റെ അതുല്യവും ഏകവുമായ ബന്ധത്തെ ഊന്നുന്നു. ‘ഒരേയൊരു’ എന്നത് ആധുനിക വായനക്കാർക്ക് വ്യക്തമാണ്; പരമ്പരാഗത ‘ഏകജാതനായ’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἀπέσταλκεν
  choice: അയച്ചിരിക്കുന്നു
  rationale: പൂർത്തിയായ അയയ്ക്കലിനും അതിന്റെ നിലനിൽക്കുന്ന പ്രസക്തിക്കും സൂചന നൽകുന്ന ഗ്രീക്ക് പൂർണകാലത്തിന്റെ ഭാവം മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: εἰς τὸν κόσμον
  choice: ലോകത്തിലേക്ക്
  rationale: പുത്രൻ അയയ്ക്കപ്പെട്ട മനുഷ്യലോകത്തെ സൂചിപ്പിക്കുന്ന നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: ἵνα ζήσωμεν
  choice: നാം ... ജീവിക്കേണ്ടതിന്
  rationale: ἵνα സഹിതമുള്ള വിധേയക്രിയ പ്രകടിപ്പിക്കുന്ന ഉദ്ദേശ്യം നിലനിർത്തുന്നു; ‘ജീവിക്കുക’ എന്നത് ζάωയുടെ നേരിട്ടുള്ള അർഥം സംരക്ഷിക്കുന്നു.
- source_word: δι’ αὐτοῦ
  choice: അവനിലൂടെ
  rationale: διάയും ഷഷ്ഠീവിഭക്തിയും സൂചിപ്പിക്കുന്ന മാർഗം അഥവാ മധ്യസ്ഥത സ്വാഭാവികമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: പുത്രനെക്കുറിച്ചുള്ള μονογενής എന്ന പദത്തിന്റെ അർഥം
  choice: പ്രധാനപാഠത്തിൽ ‘ഒരേയൊരു പുത്രൻ’
  alternative: ‘ഏകജാതനായ പുത്രൻ’ അഥവാ ‘അതുല്യനായ പുത്രൻ’
  rationale: പദം പുത്രന്റെ ഏകത്വവും അതുല്യബന്ധവും ഊന്നുന്നു; ജനിപ്പിക്കൽ എന്ന പിന്നീടുള്ള സിദ്ധാന്തഭാഷ പദത്തിന്റെ നേരിട്ടുള്ള അർഥത്തിലേക്ക് ചേർക്കുന്നില്ല. എന്നാൽ ചരിത്രപരമായ സഭാഭാഷ വായനക്കാർക്കായി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: ἐν ἡμῖν എന്നതിന്റെ പരിധി
  choice: ‘നമ്മുടെ ഇടയിൽ’
  alternative: ‘നമ്മുടെ ഉള്ളിൽ’
  rationale: സമൂഹത്തിന്റെ മധ്യേ വെളിപ്പെട്ട ദൈവസ്നേഹം എന്ന വായന പ്രസക്തിയിൽ യോജിക്കുന്നു; വ്യക്തികളുടെ ഉള്ളിലുള്ള വെളിപ്പെടൽ എന്ന സാധ്യമായ വായന അടിക്കുറിപ്പിലൂടെ തുറന്നുവയ്ക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്ക് വാക്യത്തിന്റെ വിശദീകരണഘടന നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ സ്വാഭാവിക പദക്രമം സ്വീകരിച്ചു; വ്യാഖ്യാനപരമായി തീർച്ചപ്പെടുത്താൻ കഴിയാത്ത രണ്ടു സാധ്യതകളും അടിക്കുറിപ്പുകളിൽ തുറന്നുവച്ചു.
