id: 1JN.4.18
reference: 1 John 4:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: φόβος οὐκ ἔστιν ἐν τῇ ἀγάπῃ, ἀλλ’ ἡ τελεία ἀγάπη ἔξω βάλλει τὸν φόβον, ὅτι ὁ φόβος κόλασιν ἔχει, ὁ δὲ φοβούμενος οὐ τετελείωται ἐν τῇ ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/018.yaml
  text: There is no fear in love[a], but perfect love drives out fear, because fear has punishment[c][b]. But the one who fears has not been perfected in love.
translation:
  language: ml
  text: സ്നേഹത്തിൽ ഭയമില്ല; പൂർണ സ്നേഹം ഭയത്തെ പുറത്താക്കുന്നു, കാരണം ഭയത്തിന് ശിക്ഷയുണ്ട്. എന്നാൽ ഭയപ്പെടുന്നയാൾ സ്നേഹത്തിൽ പൂർണത പ്രാപിച്ചിട്ടില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φόβος / φοβούμενος
  choice: ഭയം / ഭയപ്പെടുന്നവൻ
  rationale: വിധിയുടെയും ശിക്ഷയുടെയും പശ്ചാത്തലത്തിലുള്ള ഭയത്തെ സ്വാഭാവികമായി അറിയിക്കുകയും വാക്യത്തിലുടനീളമുള്ള പദബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἀγάπῃ / ἀγάπη
  choice: സ്നേഹം
  rationale: ἀγάπη എന്ന ആവർത്തിക്കുന്ന മുഖ്യപദത്തിന് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ തുല്യപദം.
- source_word: τελεία
  choice: പൂർണതയിലെത്തിയ
  rationale: ഉദ്ദേശിച്ച നിറവിലെത്തിയ സ്നേഹം എന്ന ആശയം വ്യക്തമാക്കുന്നു; കേവലം കുറ്റമറ്റ അവസ്ഥയെന്ന അർഥം നിർബന്ധിക്കുന്നില്ല.
- source_word: ἔξω βάλλει
  choice: പുറത്താക്കുന്നു
  rationale: ബലമായി പുറത്തേക്കു നീക്കുന്നതിന്റെ രൂപകം നേരിട്ടും സ്വാഭാവികമായും സംരക്ഷിക്കുന്നു.
- source_word: κόλασιν ἔχει
  choice: ശിക്ഷയെ ഉൾക്കൊള്ളുന്നു
  rationale: ഗ്രീക്കിലെ അക്ഷരാർഥമായ ‘ശിക്ഷയുണ്ട്’ എന്ന അസാധാരണ ബന്ധം അമിതമായി വ്യാഖ്യാനിക്കാതെ, ഭയത്തിനും ശിക്ഷയ്ക്കുമിടയിലെ ബന്ധം മലയാളത്തിൽ വായനയോഗ്യമായി നൽകുന്നു.
- source_word: τετελείωται ἐν τῇ ἀγάπῃ
  choice: സ്നേഹത്തിൽ പൂർണതയിലെത്തിയിട്ടില്ല
  rationale: τελεία–τετελείωται പദബന്ധവും പൂർത്തിയായ ഫലാവസ്ഥയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘പൂർണ സ്നേഹം’ എന്നും ‘സ്നേഹത്തിൽ പൂർണനാക്കപ്പെട്ടിട്ടില്ല’ എന്നും ഉള്ള ബന്ധം
  choice: ‘പൂർണതയിലെത്തിയ സ്നേഹം’ / ‘സ്നേഹത്തിൽ പൂർണതയിലെത്തിയിട്ടില്ല’
  alternative: ‘പക്വമായ സ്നേഹം’ / ‘സ്നേഹത്തിൽ പക്വനായിട്ടില്ല’
  rationale: സ്നേഹം അതിന്റെ ഉദ്ദേശിച്ച നിറവിലെത്തുന്നതും വ്യക്തി സ്നേഹത്തിൽ ഇനിയും പൂർത്തീകരിക്കപ്പെടാത്തതും തമ്മിലുള്ള പാഠത്തിന്റെ സംഘർഷം സംരക്ഷിക്കുന്നു; പാപരഹിത പൂർണതയെക്കുറിച്ചുള്ള പ്രത്യേക സിദ്ധാന്തം ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: φόβος κόλασιν ἔχει എന്ന വാക്യത്തിന്റെ അർഥബന്ധം
  choice: ‘ഭയം ശിക്ഷയെ ഉൾക്കൊള്ളുന്നു’ എന്ന് നൽകി, അക്ഷരരൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുക
  alternative: ‘ഭയം ശിക്ഷയുമായി ബന്ധപ്പെട്ടിരിക്കുന്നു’ അല്ലെങ്കിൽ ‘ഭയത്തിന് ശിക്ഷയുണ്ട്’
  rationale: ഭയം ശിക്ഷ പ്രതീക്ഷിക്കുന്നതാണോ സ്വയം ശിക്ഷാകരമാണോ എന്ന സാധ്യത പൂർണമായി തീർപ്പാക്കാതെ മൂലപാഠത്തിന്റെ സംക്ഷിപ്തതയും അസ്പഷ്ടതയും പരമാവധി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. τελεία/τετελείωται എന്ന പദബന്ധം ‘പൂർണതയിലെത്തിയ/പൂർണതയിലെത്തിയിട്ടില്ല’ എന്ന ആവർത്തനത്തിലൂടെ ദൃശ്യമാക്കി. പ്രധാനവാചകത്തിലെ [a] അടിക്കുറിപ്പ് മൂലഗ്രീക്കിന്റെ അസാധാരണമായ ചുരുക്കപ്രയോഗം സംരക്ഷിക്കുന്നു.
