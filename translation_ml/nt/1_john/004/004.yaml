id: 1JN.4.4
reference: 1 John 4:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὑμεῖς ἐκ τοῦ θεοῦ ἐστε, τεκνία, καὶ νενικήκατε αὐτούς, ὅτι μείζων ἐστὶν ὁ ἐν ὑμῖν ἢ ὁ ἐν τῷ κόσμῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/004.yaml
  text: You are from God[a], little children, and you have overcome them[b], because the one who is in you is greater than the one who is in the world.
translation:
  language: ml
  text: കുഞ്ഞുമക്കളേ, നിങ്ങൾ ദൈവത്തിൽനിന്നുള്ളവരാണ്; നിങ്ങൾ അവരെ ജയിച്ചിരിക്കുന്നു[a], കാരണം നിങ്ങളിലുള്ളവൻ ലോകത്തിലുള്ളവനെക്കാൾ വലിയവനാണ്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അതായത്, തൊട്ടുമുമ്പ് പരാമർശിച്ച എതിരാളികളെ, പ്രത്യേകിച്ച് കള്ളപ്രവാചകന്മാരെ.
    reason: cross_reference
  - marker: b
    text: ഈ രണ്ടു പരാമർശങ്ങളിലെ വ്യക്തികൾ ആരാണെന്ന് ഗ്രീക്ക് നേരിട്ട് പറയുന്നില്ല. സന്ദർഭമനുസരിച്ച് ആദ്യത്തേത് ദൈവത്തെയോ അവന്റെ ആത്മാവിനെയോ, രണ്ടാമത്തേത് ലോകത്തിന്റെ പിന്നിൽ പ്രവർത്തിക്കുന്ന ദുഷ്ടനെയോ സൂചിപ്പിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑμεῖς ἐκ τοῦ θεοῦ ἐστε
  choice: നിങ്ങൾ ദൈവത്തിൽനിന്നുള്ളവരാണ്
  rationale: ἐκ ദൈവത്തിൽനിന്നുള്ള ഉത്ഭവവും അവനോടുള്ള ബന്ധവും സൂചിപ്പിക്കുന്നു. വ്യക്തമായി നൽകിയിരിക്കുന്ന ὑμεῖς-ന്റെ ഊന്നൽ സ്വാഭാവികമായ മലയാള വാക്യക്രമത്തിൽ നിലനിർത്തുന്നു.
- source_word: τεκνία
  choice: കുഞ്ഞുമക്കളേ
  rationale: യോഹന്നാന്റെ സ്നേഹപൂർവമായ കുടുംബസംബോധനയും diminutive ഭാവവും സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി പകരുന്നു.
- source_word: νενικήκατε
  choice: ജയിച്ചിരിക്കുന്നു
  rationale: perfect രൂപം പൂർത്തിയായ ജയത്തോടൊപ്പം തുടരുന്ന ഫലവും സൂചിപ്പിക്കുന്നു; ഈ മലയാളരൂപം ആ ഭാവം സ്വാഭാവികമായി പകരുന്നു.
- source_word: αὐτούς
  choice: അവരെ
  rationale: ഗ്രീക്കിലെ സർവനാമം മുൻസന്ദർഭത്തിലെ എതിരാളികളെ സൂചിപ്പിക്കുന്നു; മുഖ്യവാക്യത്തിൽ അവരെ കൂടുതൽ വ്യക്തമായി നിർവചിക്കാതെ മൂലത്തിലെ അനാഫോറ നിലനിർത്തുന്നു.
- source_word: ὅτι
  choice: കാരണം
  rationale: വിശ്വാസികൾ ജയിച്ചതിന്റെ കാരണം അവതരിപ്പിക്കുന്ന causal ബന്ധം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: μείζων
  choice: വലിയവൻ
  rationale: താരതമ്യത്തിന്റെ വിശാല അർഥം നിലനിർത്തുന്നു; ‘ശക്തൻ’ എന്നാക്കി വെറും ബലത്തിലേക്ക് അർഥം ചുരുക്കുന്നില്ല.
- source_word: ὁ ἐν ὑμῖν
  choice: നിങ്ങളിലുള്ളവൻ
  rationale: substantival ഗ്രീക്ക് പ്രയോഗത്തിന്റെ വ്യക്തിപരമായ ഭാവം നിലനിർത്തുന്നു; ആരെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് മുഖ്യവാക്യത്തിൽ വ്യക്തമാക്കുന്നില്ല.
- source_word: ὁ ἐν τῷ κόσμῳ
  choice: ലോകത്തിലുള്ളവൻ
  rationale: മുൻപ്രയോഗത്തോടുള്ള സമാന്തരതയും വൈരുധ്യവും നിലനിർത്തി, സൂചിത വ്യക്തിയുടെ തിരിച്ചറിയൽ മൂലപാഠംപോലെ പരോക്ഷമായി വിടുന്നു.
- source_word: κόσμῳ
  choice: ലോകം
  rationale: യോഹന്നാന്റെ രചനകളിൽ ദൈവത്തോട് എതിർപ്പുള്ള ലോകക്രമത്തിന്റെ സൂചന ഉണ്ടായാലും, മുഖ്യവാക്യത്തിൽ വ്യാഖ്യാനപരമായ വികസനം ചേർക്കാതെ അടിസ്ഥാന അർഥം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘നിങ്ങളിലുള്ളവൻ’, ‘ലോകത്തിലുള്ളവൻ’ എന്നിവരുടെ തിരിച്ചറിയൽ
  choice: രണ്ടു പരാമർശങ്ങളും മുഖ്യവാക്യത്തിൽ പരോക്ഷമായി നിലനിർത്തി.
  alternative: ആദ്യത്തേത് ദൈവം അല്ലെങ്കിൽ പരിശുദ്ധാത്മാവ് എന്നും രണ്ടാമത്തേത് സാത്താൻ അല്ലെങ്കിൽ ദുഷ്ടൻ എന്നും നേരിട്ട് തിരിച്ചറിയുക.
  rationale: സന്ദർഭം ഈ തിരിച്ചറിയലുകളിലേക്കു ശക്തമായി വിരൽചൂണ്ടുന്നുവെങ്കിലും ഗ്രീക്ക് പാഠം രണ്ടുപേരെയും പേരെടുത്ത് പറയുന്നില്ല. അതിനാൽ ദൈവശാസ്ത്രപരമായ സൂചന അടിക്കുറിപ്പിൽ വിശദീകരിച്ച്, മൂലത്തിലെ ഉദ്ദേശ്യപൂർവമായ പരോക്ഷത മുഖ്യവാക്യത്തിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. സ്നേഹസംബോധന ആദ്യം വെച്ച് സ്വാഭാവിക മലയാള പ്രവാഹം നൽകിയിരിക്കുന്നു. ‘അവരെ’ എന്നതിന്റെ സൂചനയും രണ്ടു പരോക്ഷ വ്യക്തിപരാമർശങ്ങളുടെയും ദൈവശാസ്ത്രപരമായ അർഥവും മുഖ്യവാക്യത്തിൽ അതിവ്യക്തമാക്കാതെ അടിക്കുറിപ്പുകളിൽ നൽകിയിരിക്കുന്നു.
