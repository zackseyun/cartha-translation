  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀγαπητοί, ἀγαπῶμεν ἀλλήλους, ὅτι ἡ ἀγάπη ἐκ τοῦ θεοῦ ἐστιν, καὶ πᾶς ὁ ἀγαπῶν ἐκ τοῦ θεοῦ γεγέννηται καὶ γινώσκει τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/007.yaml
  text: Beloved[a], let us love one another, because love is from God, and everyone who loves has been born of God and knows God.
translation:
  language: ml
  text: പ്രിയപ്പെട്ടവരേ[a], നമുക്ക് പരസ്പരം സ്നേഹിക്കാം; കാരണം സ്നേഹം ദൈവത്തിൽനിന്നുള്ളതാണ്. സ്നേഹിക്കുന്ന ഏവരും ദൈവത്തിൽനിന്ന് ജനിച്ചവരാണ്; അവർ ദൈവത്തെ അറിയുകയും ചെയ്യുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സ്നേഹിക്കപ്പെട്ടവരേ.” ഗ്രീക്കിലെ ഈ സംബോധന ഈ വാക്യത്തിൽ ആവർത്തിക്കുന്ന “സ്നേഹം/സ്നേഹിക്കുക” എന്ന പദകുടുംബത്തിൽപ്പെട്ടതാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: പ്രിയപ്പെട്ടവരേ
  rationale: സ്നേഹപൂർവമായ ബഹുവചന സംബോധനയായി സ്വാഭാവികമാണ്. ‘പ്രിയപ്പെട്ടവരേ’ എന്നത് ἀγαπ- പദകുടുംബവുമായുള്ള ആശയബന്ധം ഭാഗികമായി നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ മാന്യവും ഗ്രാഹ്യവുമായി കേൾക്കുകയും ചെയ്യുന്നു.
- source_word: ἀγαπῶμεν
  choice: നമുക്ക് ... സ്നേഹിക്കാം
  rationale: ഒന്നാംപുരുഷ ബഹുവചനത്തിലെ ആഹ്വാനാർഥക subjunctive-ന്റെ സ്വാഭാവിക മലയാളരൂപം. വർത്തമാനകാലത്തിന്റെ തുടർച്ചാസൂചനയെ ‘തുടർന്നും’ എന്നു ചേർത്ത് അമിതമായി വ്യക്തമാക്കിയിട്ടില്ല.
- source_word: ἀλλήλους
  choice: പരസ്പരം
  rationale: reciprocal pronoun-ന്റെ ചുരുക്കവും സ്വാഭാവികവുമായ മലയാളസമാനം.
- source_word: ὅτι
  choice: കാരണം
  rationale: മുൻപുള്ള ആഹ്വാനത്തിന്റെ അടിസ്ഥാനം വ്യക്തമാക്കുന്ന കാരണാർഥം നേരിട്ട് നൽകുന്നു.
- source_word: ἡ ἀγάπη
  choice: സ്നേഹം
  rationale: പൊതുവായ ഗുണത്തെയും പ്രവൃത്തിയെയും സൂചിപ്പിക്കുന്ന ἀγάπη-യുടെ സാധാരണവും സ്വാഭാവികവുമായ മലയാളപരിഭാഷ.
- source_word: ἐκ τοῦ θεοῦ ἐστιν
  choice: ദൈവത്തിൽനിന്നുള്ളതാണ്
  rationale: ἐκ സൂചിപ്പിക്കുന്ന ഉറവിടം വ്യക്തമായി നിലനിർത്തുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ പ്രസ്താവനയാണ്.
- source_word: πᾶς ὁ ἀγαπῶν
  choice: സ്നേഹിക്കുന്ന ഏവരും
  rationale: ഒരു പൊതുവർഗത്തെ സൂചിപ്പിക്കുന്ന substantival participle-ന്റെ സ്വാഭാവിക മലയാളാവിഷ്കാരം.
- source_word: ἐκ τοῦ θεοῦ γεγέννηται
  choice: ദൈവത്തിൽനിന്ന് ജനിച്ചവരാണ്
  rationale: γεννάω-യുടെ ജനനരൂപകവും ἐκ-ന്റെ ദൈവിക ഉറവിടവും സംരക്ഷിക്കുന്നു. perfect passive-ന്റെ പൂർത്തിയായ പ്രവൃത്തിയും നിലനിൽക്കുന്ന ഫലവും മലയാളത്തിൽ പ്രത്യേക സഹായക്രിയയില്ലാതെ സന്ദർഭത്തിൽ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: γινώσκει τὸν θεόν
  choice: ദൈവത്തെ അറിയുകയും ചെയ്യുന്നു
  rationale: വർത്തമാനകാലത്തിലുള്ള അറിവിനെ നേരിട്ട് അവതരിപ്പിക്കുന്നു; ‘അറിഞ്ഞിരിക്കുന്നു’ അല്ലെങ്കിൽ ‘അറിയാൻ ഇടയായി’ എന്നിങ്ങനെ മൂലത്തിൽ ഇല്ലാത്ത perfect/ingressive ഭാവങ്ങൾ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: സ്നേഹം, ദൈവത്തിൽനിന്നുള്ള ജനനം, ദൈവജ്ഞാനം എന്നിവ തമ്മിലുള്ള ബന്ധം
  choice: സ്നേഹിക്കുന്ന ഏവരും ദൈവത്തിൽനിന്ന് ജനിച്ചവരാണെന്നും ദൈവത്തെ അറിയുന്നുവെന്നും വാക്യം പറയുന്ന ബന്ധം നേരിട്ട് നിലനിർത്തി.
  alternative: ഇത് സാങ്കേതികമായ രക്ഷാക്രമത്തിന്റെ നിർണായക തെളിവായി വികസിപ്പിക്കുക, അല്ലെങ്കിൽ പുതുജനനവുമായി ബന്ധമില്ലാത്ത ഒരു നൈതിക പ്രസ്താവനയായി ദുർബലപ്പെടുത്തുക.
  rationale: ഗ്രീക്ക് വാചകം ഈ മൂന്നു യാഥാർഥ്യങ്ങളെയും ബന്ധിപ്പിക്കുന്നു, എന്നാൽ അവയുടെ സിദ്ധാന്തപരമായ ക്രമം വിശദീകരിക്കുന്നില്ല. പരിഭാഷ ആ ബന്ധം സംരക്ഷിക്കുന്നു; പിൽക്കാല മതവിഭാഗപരമായ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: ἀγαπ- പദകുടുംബത്തിന്റെ ആവർത്തനം
  choice: മുഖ്യ ആശയം മുഴുവൻ ‘സ്നേഹം/സ്നേഹിക്കുക’ ഉപയോഗിച്ച് ഏകീകരിച്ചു; സംബോധനയിൽ സ്വാഭാവികമായ ‘പ്രിയപ്പെട്ടവരേ’ നൽകി അതിന്റെ പദബന്ധം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: സംബോധനയെയും ക്രിയയെയും ഒരേ മലയാളമൂലം ഉപയോഗിച്ച് അസ്വാഭാവികമാക്കുക, അല്ലെങ്കിൽ പദകുടുംബബന്ധം പൂർണമായി മറയ്ക്കുക.
  rationale: മലയാളത്തിന്റെ സ്വാഭാവികതയും യോഹന്നാന്റെ ആവർത്തനാത്മക സാഹിത്യശൈലിയും തമ്മിൽ സമതുലനം പാലിക്കുന്നു.
translation_notes:
  register: ആധുനിക സ്റ്റാൻഡേർഡ് മലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായ, മാന്യവും സ്വാഭാവികവുമായ ശൈലി. ‘പ്രിയപ്പെട്ടവരേ’ സ്നേഹപൂർവമായ സഭാസംബോധനയായി ഉപയോഗിച്ചു; ‘നമുക്ക് ... സ്നേഹിക്കാം’ ആഹ്വാനഭാവം വ്യക്തമായി നൽകുന്നു. ഗ്രീക്കിലെ ദീർഘസമന്വിത വാക്യം മലയാളത്തിലെ വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി, എന്നാൽ കാരണം-ഫലവും ദൈവിക ഉറവിടവും പുതുജനനവും ദൈവജ്ഞാനവും തമ്മിലുള്ള ബന്ധം മാറ്റിയിട്ടില്ല.
