id: 1JN.4.11
reference: 1 John 4:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀγαπητοί, εἰ οὕτως ὁ θεὸς ἠγάπησεν ἡμᾶς, καὶ ἡμεῖς ὀφείλομεν ἀλλήλους ἀγαπᾶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/011.yaml
  text: Beloved[a], if God so loved us, we also ought to love one another.
translation:
  language: ml
  text: പ്രിയരേ, ദൈവം നമ്മെ ഇങ്ങനെ സ്നേഹിച്ചുവെങ്കിൽ[a], നാമും പരസ്പരം സ്നേഹിക്കാൻ കടപ്പെട്ടിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദൈവം ഈ വിധത്തിൽ നമ്മെ സ്നേഹിച്ചതിനാൽ.’ ഗ്രീക്കിൽ വ്യവസ്ഥാരൂപം (‘എങ്കിൽ’) ഉപയോഗിച്ചിട്ടുണ്ടെങ്കിലും, ഈ സന്ദർഭത്തിൽ ആ വ്യവസ്ഥ സത്യമാണെന്ന് കരുതപ്പെടുന്നതായിരിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγαπητοί
  choice: പ്രിയരേ
  rationale: ബഹുവചന സംബോധനയെ സ്വാഭാവികവും ആദരപൂർവവുമായി അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ ഇതിന് സ്നേഹാർദ്രമായ ഭാവമുണ്ട്; വാക്യത്തിലെ ‘സ്നേഹിക്കുക’ എന്ന പദകുടുംബവുമായുള്ള ആശയബന്ധവും നിലനിൽക്കുന്നു.
- source_word: εἰ
  choice: -വെങ്കിൽ
  rationale: സന്ദർഭത്തിൽ വ്യവസ്ഥ സത്യമാണെന്ന് കരുതപ്പെടുന്നുണ്ടെങ്കിലും ഗ്രീക്കിലെ വ്യവസ്ഥാരൂപം നിലനിർത്തുന്നു.
- source_word: οὕτως
  choice: ഇങ്ങനെ
  rationale: മുൻസന്ദർഭത്തിൽ വെളിപ്പെട്ട ദൈവസ്നേഹത്തിന്റെ രീതിയിലേക്കു വിരൽചൂണ്ടുന്നു; അളവിന്റെയും രീതിയുടെയും ധ്വനി നിർബന്ധമായി ഒന്നിലേക്കു ചുരുക്കുന്നില്ല.
- source_word: ὁ θεὸς
  choice: ദൈവം
  rationale: ഗ്രീക്ക് കർത്താവിന്റെ നേരിട്ടുള്ള സ്വാഭാവിക പരിഭാഷ.
- source_word: ἠγάπησεν
  choice: സ്നേഹിച്ചു
  rationale: അയോറിസ്റ്റ് ക്രിയയുടെ പൂർത്തിയായ പ്രവൃത്തിഭാവം മലയാളത്തിലെ ഭൂതകാലരൂപത്തിലൂടെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἡμᾶς
  choice: നമ്മെ
  rationale: നേരിട്ടുള്ള കർമസർവനാമത്തിന്റെ സാധാരണ മലയാളരൂപം.
- source_word: καὶ ἡμεῖς
  choice: നാമും
  rationale: പ്രകടമായ കർത്തൃസർവനാമത്തിന്റെ ഊന്നലും καί നൽകുന്ന ‘കൂടി’ എന്ന അർഥവും ചുരുക്കമായ സ്വാഭാവിക രൂപത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: ὀφείλομεν
  choice: കടപ്പെട്ടിരിക്കുന്നു
  rationale: ὀφείλωയിലെ ധാർമ്മിക ബാധ്യതയും കടപ്പാടിന്റെ ധ്വനിയും നിലനിർത്തുന്നു; വെറും ഉപദേശം എന്നതിലേക്കു ദുർബലപ്പെടുത്തുന്നില്ല.
- source_word: ἀλλήλους
  choice: പരസ്പരം
  rationale: പരസ്പരബന്ധം സൂചിപ്പിക്കുന്ന സാധാരണവും വ്യക്തവുമായ മലയാളപ്രയോഗം.
- source_word: ἀγαπᾶν
  choice: സ്നേഹിക്കാൻ
  rationale: പൂരക അനന്തക്രിയയുടെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ആവർത്തിക്കുന്ന സ്നേഹപദാവലി നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: εἰ οὕτως ὁ θεὸς ἠγάπησεν ἡμᾶς എന്ന വ്യവസ്ഥാവാക്യത്തിന്റെ ബലം
  choice: ദൈവം നമ്മെ ഇങ്ങനെ സ്നേഹിച്ചുവെങ്കിൽ
  alternative: ദൈവം നമ്മെ ഇങ്ങനെ സ്നേഹിച്ചതിനാൽ / ദൈവം ഈ വിധത്തിൽ നമ്മെ സ്നേഹിച്ചിരിക്കയാൽ
  rationale: സന്ദർഭം ദൈവം സ്നേഹിച്ചു എന്നത് സത്യമായി മുൻകൂട്ടി കരുതുന്നുവെങ്കിലും ഗ്രീക്ക് വാക്യം വ്യവസ്ഥാരൂപത്തിലാണ്. ‘-വെങ്കിൽ’ ആ രൂപവും അതിന്റെ പ്രബോധനാത്മക ബലവും സംരക്ഷിക്കുന്നു; അതിനെ കാരണവാക്യമായി നിശ്ശബ്ദമായി തീർപ്പാക്കുന്നില്ല.
- issue: ὀφείλομεν എന്നതിലെ ബാധ്യതയുടെ സ്വഭാവം
  choice: സ്നേഹിക്കാൻ കടപ്പെട്ടിരിക്കുന്നു
  alternative: സ്നേഹിക്കേണ്ടതാണ് / സ്നേഹിക്കണം
  rationale: ദൈവസ്നേഹത്തോടുള്ള പ്രതികരണമായി വിശ്വാസികൾക്കുള്ള ധാർമ്മിക കടപ്പാട് പ്രകടമാക്കുന്നു; നിയമപരമായ നിർബന്ധമെന്നോ ഐച്ഛികമായ ഉപദേശമെന്നോ അതിനെ ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പ്രിയരേ’ യോഹന്നാന്റെ സ്നേഹാർദ്രമായ സംബോധന നിലനിർത്തുന്നു. ‘കടപ്പെട്ടിരിക്കുന്നു’ എന്നത് ധാർമ്മിക ബാധ്യതയെ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന വിധത്തിൽ അവതരിപ്പിക്കുന്നു.
