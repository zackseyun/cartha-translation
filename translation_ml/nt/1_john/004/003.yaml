id: 1JN.4.3
reference: 1 John 4:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ πᾶν πνεῦμα ὃ μὴ ὁμολογεῖ ⸀τὸν ⸀Ἰησοῦν ἐκ τοῦ θεοῦ οὐκ ἔστιν· καὶ τοῦτό ἐστιν τὸ τοῦ ἀντιχρίστου, ὃ ἀκηκόατε ὅτι ἔρχεται, καὶ νῦν ἐν τῷ κόσμῳ ἐστὶν ἤδη.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/003.yaml
  text: and every spirit that does not confess Jesus is not from God[a]. And this is the spirit of the antichrist, which you have heard is coming[c][b], and now is already in the world.
translation:
  language: ml
  text: യേശുവിനെ ഏറ്റുപറയാത്ത എല്ലാ ആത്മാവും ദൈവത്തിൽനിന്നുള്ളതല്ല.[a] ഇതാണ് എതിർക്രിസ്തുവിന്റെ ആത്മാവ്[b]; അതു വരുന്നു എന്നു നിങ്ങൾ കേട്ടിട്ടുണ്ടല്ലോ; ഇപ്പോൾ ഇതിനകം അതു ലോകത്തിലുണ്ട്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ചില കൈയെഴുത്തുപ്രതികളിൽ: “യേശുക്രിസ്തു ജഡത്തിൽ വന്നിരിക്കുന്നു എന്ന് ഏറ്റുപറയാത്ത.”'
    reason: textual_variant
  - marker: b
    text: 'അക്ഷരാർഥത്തിൽ: “ഇതാണ് എതിർക്രിസ്തുവിന്റേത്.” ഗ്രീക്കിൽ ‘ആത്മാവ്’ എന്ന പദം ഇവിടെ ആവർത്തിച്ചിട്ടില്ല; മുൻവാക്യത്തിൽനിന്ന് അത് മനസ്സിലാക്കപ്പെടുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν πνεῦμα
  choice: എല്ലാ ആത്മാവും
  rationale: ഏകവചനമായ πνεῦμαയോടുകൂടിയ πᾶν ഇവിടെ വിതരണാർഥത്തിൽ ‘എല്ലാ ആത്മാവും’ എന്നാണ്. സന്ദർഭം പരിശുദ്ധാത്മാവിനെക്കുറിച്ചല്ല, പരിശോധിക്കപ്പെടേണ്ട ആത്മീയ സ്വാധീനങ്ങളെയും അവകാശവാദങ്ങളെയും കുറിച്ചാണ്.
- source_word: ὁμολογεῖ τὸν Ἰησοῦν
  choice: യേശുവിനെ ഏറ്റുപറയാത്ത
  rationale: SBLGNTയിലെ ഹ്രസ്വവായനയായ ‘യേശുവിനെ ഏറ്റുപറയുക’ നേരിട്ട് നിലനിർത്തുന്നു. ‘ഏറ്റുപറയുക’ എന്നത് ὁμολογέωയുടെ തുറന്ന സമ്മതത്തിന്റെയും വിശ്വസ്തതയുടെയും ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐκ τοῦ θεοῦ
  choice: ദൈവത്തിൽനിന്നുള്ളതല്ല
  rationale: ἐκ ഉറവിടത്തെയോ ഉത്ഭവത്തെയോ സൂചിപ്പിക്കുന്നു; ‘ദൈവത്തിൽനിന്നുള്ള’ എന്നത് ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τοῦτό ἐστιν τὸ τοῦ ἀντιχρίστου
  choice: ഇതാണ് എതിർക്രിസ്തുവിന്റെ ആത്മാവ്
  rationale: ഗ്രീക്ക് പ്രയോഗം ദീർഘലോപമുള്ളതാണെങ്കിലും മുൻവാക്യത്തിലെ πνεῦμα തന്നെയാണ് സ്വാഭാവികമായി പൂരിപ്പിക്കപ്പെടുന്നത്. വായനാസൗകര്യത്തിനായി ‘ആത്മാവ്’ ചേർത്തു; ഈ പൂരിപ്പിക്കൽ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀντιχρίστου
  choice: എതിർക്രിസ്തുവിന്റെ
  rationale: യോഹന്നാന്റെ സന്ദർഭത്തിലെ അറിയപ്പെടുന്ന എതിർക്രിസ്തു പ്രതീക്ഷയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘എതിർക്രിസ്തു’ സുതാര്യവും സ്ഥാപിതവുമായ രൂപമാണ്.
- source_word: ἀκηκόατε ὅτι ἔρχεται
  choice: അതു വരുന്നു എന്നു നിങ്ങൾ കേട്ടിട്ടുണ്ടല്ലോ
  rationale: ὃ നപുംസകലിംഗമായതിനാൽ ‘അതു’ എന്ന സൂചന നിലനിർത്തുന്നു; ‘അവൻ’ എന്നു മാറ്റുന്നത് വ്യക്തിയിലേക്കുള്ള വ്യാഖ്യാനപരമായ ചുരുക്കമാകും. ‘കേട്ടിട്ടുണ്ടല്ലോ’ പൂർവശ്രവണത്തെ ഓർമിപ്പിക്കുന്ന സന്ദർഭഭാവം നൽകുന്നു.
- source_word: ἐν τῷ κόσμῳ ... ἤδη
  choice: ഇപ്പോൾത്തന്നെ അതു ലോകത്തിലുണ്ട്
  rationale: ἐν τῷ κόσμῳ എന്ന സ്ഥിതിയും ἤδη നൽകുന്ന ഇതിനകം നിലവിലുള്ള സാന്നിധ്യത്തിന്റെ ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: നിഷേധിക്കപ്പെടുന്ന ഏറ്റുപറച്ചിലിന്റെ പാഠരൂപം
  choice: പ്രധാനപാഠത്തിൽ SBLGNTയുടെ ഹ്രസ്വവായനയായ ‘യേശുവിനെ ഏറ്റുപറയാത്ത’ പിന്തുടർന്നു.
  alternative: ‘യേശുക്രിസ്തു ജഡത്തിൽ വന്നിരിക്കുന്നു എന്ന് ഏറ്റുപറയാത്ത’ എന്ന ദീർഘവായന.
  rationale: വിമർശനപാഠം ഹ്രസ്വവായനയെ പിന്തുണയ്ക്കുന്നു; മുൻവാക്യത്തിൽ ക്രിസ്തുസംബന്ധിയായ ഉള്ളടക്കം ഇതിനകം വ്യക്തമാക്കിയിട്ടുണ്ട്. ദീർഘവായന പാഠഭേദമായി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: τὸ τοῦ ἀντιχρίστου എന്ന ദീർഘലോപം എത്രത്തോളം വ്യക്തമാക്കണം
  choice: വായനാസൗകര്യത്തിനായി ‘എതിർക്രിസ്തുവിന്റെ ആത്മാവ്’ എന്നു വ്യക്തമാക്കി.
  alternative: ‘ഇതാണ് എതിർക്രിസ്തുവിന്റേത്’ എന്ന ദീർഘലോപം നേരിട്ട് നിലനിർത്തുക.
  rationale: മുൻവാക്യത്തിലെ ‘ആത്മാവ്’ തന്നെയാണ് ഗ്രീക്കിൽ വ്യക്തമായി മനസ്സിലാക്കപ്പെടുന്ന പദം. അത് പൂരിപ്പിക്കുന്നത് അർഥം മാറ്റാതെ സാധാരണ മലയാളത്തിൽ വ്യക്തത നൽകുന്നു; മൂലത്തിലെ ദീർഘലോപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- issue: വരുന്നവനെ വ്യക്തിയെന്നോ നപുംസക ആശയമെന്നോ അവതരിപ്പിക്കൽ
  choice: ഗ്രീക്കിലെ നപുംസകലിംഗബന്ധം അനുസരിച്ച് ‘അതു വരുന്നു’ എന്നു വിവർത്തനം ചെയ്തു.
  alternative: ‘അവൻ വരുന്നു’ എന്നു വ്യക്തിപരമാക്കുക.
  rationale: ὃ നപുംസകലിംഗമാണ്; ‘അവൻ’ എന്നു പറയുന്നത് എതിർക്രിസ്തുവെന്ന വ്യക്തിയെ നേരിട്ട് മുൻനിർത്തുന്ന വ്യാഖ്യാനമായിരിക്കും. പാഠത്തിലെ വ്യാകരണപരമായ അവ്യക്തത സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘എതിർക്രിസ്തു’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന സുതാര്യരൂപമായി ഉപയോഗിച്ചു. വാക്യഘടന മൂലത്തിലെ ബന്ധങ്ങൾ സൂക്ഷിച്ചുകൊണ്ട് മലയാളത്തിൽ അനാവശ്യമായി ദുഷ്കരമാകാതിരിക്കാൻ ക്രമപ്പെടുത്തി.
