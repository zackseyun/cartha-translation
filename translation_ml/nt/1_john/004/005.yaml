id: 1JN.4.5
reference: 1 John 4:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: αὐτοὶ ἐκ τοῦ κόσμου εἰσίν· διὰ τοῦτο ἐκ τοῦ κόσμου λαλοῦσιν καὶ ὁ κόσμος αὐτῶν ἀκούει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/005.yaml
  text: They are from the world[a]; for this reason they speak from the world[b], and the world listens to them.
translation:
  language: ml
  text: അവർ ലോകത്തിൽനിന്നുള്ളവരാണ്; അതുകൊണ്ട് അവർ ലോകത്തിൽനിന്ന് സംസാരിക്കുന്നു[a], ലോകം അവരുടെ വാക്കു കേൾക്കുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ രണ്ടിടത്തും അക്ഷരാർഥത്തിൽ ‘ലോകത്തിൽനിന്ന്’ എന്നാണ്; ഇത് അവരുടെ സ്വഭാവത്തിന്റെയും സന്ദേശത്തിന്റെയും ഉറവിടം ഊന്നിപ്പറയുന്നു. ‘ലോകത്തിൽനിന്നുള്ളവർ’ എന്നതിന് ‘ലോകത്തിന്റേതായവർ’ എന്നും പറയാം.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘ലോകം’ എന്നു പറയുന്നത് സൃഷ്ടപ്രപഞ്ചത്തെയല്ല, ദൈവത്തോട് എതിർപ്പുള്ള മനുഷ്യവ്യവസ്ഥയെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: αὐτοὶ
  choice: അവർ
  rationale: മുൻസന്ദർഭത്തിലെ വ്യാജപ്രവാചകന്മാരെ സൂചിപ്പിക്കുന്നു; അടുത്ത വാക്യത്തിലെ ‘നാം’ എന്നതുമായുള്ള വ്യത്യാസം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἐκ τοῦ κόσμου
  choice: ലോകത്തിൽനിന്നുള്ളവർ / ലോകത്തിൽനിന്ന്
  rationale: ἐκ സൂചിപ്പിക്കുന്ന ഉറവിടമോ ഉത്ഭവമോ സംരക്ഷിക്കാനും ഗ്രീക്കിലെ ആവർത്തനം കഴിയുന്നത്ര നിലനിർത്താനും ഈ രൂപം തെരഞ്ഞെടുത്തു.
- source_word: κόσμος
  choice: ലോകം
  rationale: ഇവിടെ ദൈവത്തോട് എതിർപ്പുള്ള മനുഷ്യവ്യവസ്ഥയെയാണ് സൂചിപ്പിക്കുന്നത്; മുഖ്യപാഠത്തിൽ വ്യാഖ്യാനാത്മകമായ ‘ലോകവ്യവസ്ഥ’ ചേർക്കാതെ യോഹന്നാന്റെ പതിവുപദം നിലനിർത്തുന്നു.
- source_word: διὰ τοῦτο
  choice: അതുകൊണ്ട്
  rationale: അവരുടെ ഉറവിടവും സംസാരവും തമ്മിലുള്ള കാരണബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: λαλοῦσιν
  choice: സംസാരിക്കുന്നു
  rationale: വർത്തമാനകാലത്തിലെ പൊതുവായ/പതിവായ പ്രവർത്തനഭാവം ഗൗരവമുള്ളതും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὁ κόσμος αὐτῶν ἀκούει
  choice: ലോകം അവരുടെ വാക്കു കേൾക്കുന്നു
  rationale: ἀκούω ഇവിടെ വെറും ശബ്ദഗ്രഹണമല്ല, അനുകൂലമായി ചെവികൊടുക്കുന്നതാണ്; ‘അവരുടെ വാക്കു കേൾക്കുന്നു’ മലയാളത്തിൽ ആ സ്വീകരണഭാവം സ്വാഭാവികമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: യോഹന്നാന്റെ പ്രയോഗത്തിൽ κόσμος എന്നതിന്റെ അർഥം
  choice: ദൈവത്തോട് അന്യപ്പെട്ട മനുഷ്യവ്യവസ്ഥ
  alternative: ഭൗതിക സൃഷ്ടിലോകം; നിഷ്പക്ഷമായ അർഥത്തിലുള്ള മനുഷ്യരാശി
  rationale: സന്ദർഭം ‘ദൈവത്തിൽനിന്നുള്ളവർ’ എന്നും ‘ലോകത്തിൽനിന്നുള്ളവർ’ എന്നും ആത്മീയ-ധാർമിക ഉറവിടത്തിന്റെ അടിസ്ഥാനത്തിൽ വേർതിരിക്കുന്നു. എന്നാൽ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ വികസിപ്പിക്കാതെ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: αὐτοὶ എന്ന സർവനാമത്തിന്റെ ഊന്നൽ
  choice: പ്രത്യേക ഊന്നൽപദം ചേർക്കാതെ ‘അവർ’
  alternative: ‘അവർതന്നെ’
  rationale: ഗ്രീക്കിൽ വൈരുധ്യാത്മക ഊന്നൽ ഉണ്ടെങ്കിലും മലയാളസന്ദർഭത്തിൽ ‘അവർ’ മതിയാകുന്നു; ‘അവർതന്നെ’ അനാവശ്യമായ അധിക ഊന്നലായി കേൾക്കാം.
- issue: ἀκούει എന്നതിലെ സ്വീകരണഭാവം
  choice: ‘അവരുടെ വാക്കു കേൾക്കുന്നു’
  alternative: ‘അവരെ ശ്രദ്ധിക്കുന്നു’; ‘അവരെ അനുസരിക്കുന്നു’
  rationale: ഇവിടെ അനുകൂല സ്വീകരണം ഉൾപ്പെട്ടിട്ടുണ്ടെങ്കിലും ‘അനുസരിക്കുന്നു’ എന്ന് പറയുന്നത് അർഥം അതിയായി നിർണ്ണയിക്കും. തെരഞ്ഞെടുത്ത രൂപം കേൾവിയും സ്വീകരണവും തമ്മിലുള്ള പരിധി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ലോകത്തിൽനിന്ന്’ എന്ന അല്പം അസാധാരണമായ ആവർത്തനം ഗ്രീക്കിലെ ഉറവിടസൂചനയും വാക്യത്തിന്റെ വാഗ്‌ശൈലിയും സംരക്ഷിക്കാൻ ഉദ്ദേശപൂർവം നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
