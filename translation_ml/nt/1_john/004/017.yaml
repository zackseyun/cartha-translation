id: 1JN.4.17
reference: 1 John 4:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν τούτῳ τετελείωται ἡ ἀγάπη μεθ’ ἡμῶν, ἵνα παρρησίαν ἔχωμεν ἐν τῇ ἡμέρᾳ τῆς κρίσεως, ὅτι καθὼς ἐκεῖνός ἐστιν καὶ ἡμεῖς ἐσμεν ἐν τῷ κόσμῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/017.yaml
  text: By this[a], love has been perfected with us, so that we may have boldness in the day of judgment, because as he is[d][c][b], so also are we in this world.
translation:
  language: ml
  text: ഇതിലൂടെയാണ്[a] നമ്മുടെ ഇടയിൽ സ്നേഹം പൂർണതയിലെത്തിയിരിക്കുന്നത്—ന്യായവിധിദിവസത്തിൽ നമുക്ക് ധൈര്യം[b] ഉണ്ടാകേണ്ടതിന്. കാരണം, അവൻ[c] എങ്ങനെയാണോ, അങ്ങനെതന്നെയാണ് ഈ ലോകത്തിൽ നമ്മളും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഇതിലാണ്’ അല്ലെങ്കിൽ ‘ഈ വിധത്തിലാണ്’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പ്രയോഗം മാർഗം, വിധം, അല്ലെങ്കിൽ ബന്ധപ്പെട്ട മേഖല എന്നിവ സൂചിപ്പിക്കാം. ‘നമ്മുടെ ഇടയിൽ’ എന്നതിന് ‘നമ്മോടുകൂടെ’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: ‘ധൈര്യം’ എന്നതിന് ‘ആത്മവിശ്വാസം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: ‘അവൻ’ എന്നത് മിക്കവാറും യേശുവിനെ സൂചിപ്പിക്കുന്നു; ചിലർ ഇത് ദൈവത്തെ പൊതുവായി സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: ഇതിലൂടെയാണ്
  rationale: ‘ഇതാൽ/ഇതിലൂടെ’ എന്ന മാർഗമോ അടിസ്ഥാനമോ സൂചിപ്പിക്കുന്ന അർഥം നൽകുകയും, തുടർന്ന് വരുന്ന കാരണവാക്യത്തിലേക്കുള്ള ബന്ധം സ്വാഭാവികമായി തുറന്നുവയ്ക്കുകയും ചെയ്യുന്നു. ‘ഇതിലാണ്’ എന്ന വായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
- source_word: τετελείωται
  choice: പൂർണതയിലെത്തിയിരിക്കുന്നു
  rationale: പൂർത്തിയായ പ്രവർത്തനത്തിന്റെ നിലനിൽക്കുന്ന ഫലം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് perfect passive രൂപം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; സ്നേഹത്തിൽ മുമ്പ് നൈതികദോഷമുണ്ടായിരുന്നു എന്ന ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: ἡ ἀγάπη μεθ’ ἡμῶν
  choice: നമ്മുടെ ഇടയിൽ സ്നേഹം
  rationale: μετά + genitive എന്നതിന്റെ ‘നമ്മോടുകൂടെ’ എന്ന അടിസ്ഥാനഭാവം, മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികമായ ‘നമ്മുടെ ഇടയിൽ’ എന്ന രൂപത്തിൽ നൽകുന്നു. ഇത് ദൈവത്തിന്റെ നമ്മോടുള്ള സ്നേഹമോ നമ്മുടെ ദൈവത്തോടുള്ള സ്നേഹമോ പരസ്പരസ്നേഹമോ എന്ന് അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: ἵνα
  choice: ഉണ്ടാകേണ്ടതിന്
  rationale: ഉദ്ദേശ്യവും ഫലവും തമ്മിലുള്ള ഗ്രീക്ക് ബന്ധം സംരക്ഷിക്കുന്നു.
- source_word: παρρησίαν
  choice: ധൈര്യം
  rationale: ദൈവസന്നിധിയിൽ ഭയമില്ലാതെ സമീപിക്കാവുന്ന ആത്മവിശ്വാസം എന്ന യോഹന്നാനീയ ഭാവം ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു; ‘ആത്മവിശ്വാസം’ എന്ന പകരം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἐν τῇ ἡμέρᾳ τῆς κρίσεως
  choice: ന്യായവിധിദിവസത്തിൽ
  rationale: അന്ത്യകാല ന്യായവിധിയെ സൂചിപ്പിക്കുന്ന പ്രയോഗം സംക്ഷിപ്തവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ രീതിയിൽ നൽകുന്നു.
- source_word: ὅτι
  choice: കാരണം
  rationale: വിശ്വാസികൾക്കുള്ള ധൈര്യത്തിന്റെ അടിസ്ഥാനം അവതരിപ്പിക്കുന്ന കാരണാർഥം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: καθὼς ἐκεῖνός ἐστιν καὶ ἡμεῖς ἐσμεν
  choice: അവൻ എങ്ങനെയാണോ, അങ്ങനെതന്നെയാണ് നമ്മളും
  rationale: καθώς…καί എന്ന താരതമ്യഘടനയും വർത്തമാനകാലവും നിലനിർത്തുന്നു. ‘അവൻ’ എന്ന സർവനാമത്തിന്റെ സൂചിതവ്യക്തിയെ മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കാതെ ഗ്രീക്കിലെ പരോക്ഷത സംരക്ഷിക്കുന്നു.
- source_word: ἐν τῷ κόσμῳ τούτῳ
  choice: ഈ ലോകത്തിൽ
  rationale: മനുഷ്യർ ഇപ്പോൾ ജീവിക്കുന്ന ലോകമണ്ഡലത്തെ സൂചിപ്പിക്കുന്ന സന്ദർഭോചിതവും പതിവുമായ വിവർത്തനം.
theological_decisions:
- issue: ἐκεῖνος (‘അവൻ’) എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: മുഖ്യവാചകത്തിൽ ‘അവൻ’ എന്നു നിലനിർത്തി; സന്ദർഭത്തിൽ യേശുക്രിസ്തുവിനെ/പുത്രനെ സൂചിപ്പിക്കുന്നതാണ് കൂടുതൽ സാധ്യതയെന്ന് അടിക്കുറിപ്പിൽ അറിയിച്ചു
  alternative: ദൈവത്തെ പൊതുവായി സൂചിപ്പിക്കുന്നു
  rationale: 1 യോഹന്നാനിൽ ἐκεῖνος പലപ്പോഴും യേശുവിനെ സൂചിപ്പിക്കുന്നു (ഉദാ. 2:6; 3:3,5,7,16). എങ്കിലും ഗ്രീക്ക് ഇവിടെ പേര് പറയാത്തതിനാൽ വിവർത്തനത്തിൽ സൂചിതവ്യക്തിയെ നിർബന്ധമായി ചേർക്കാതെ യഥാർഥ പരോക്ഷത നിലനിർത്തുന്നു.
- issue: പൂർണതയിലെത്തുന്ന സ്നേഹത്തിന്റെ ദിശയും സ്വഭാവവും
  choice: ‘നമ്മുടെ ഇടയിൽ സ്നേഹം പൂർണതയിലെത്തിയിരിക്കുന്നു’ എന്ന തുറന്ന രൂപം
  alternative: നമ്മുടെ ദൈവസ്നേഹം ധാർമികമായി പൂർണമായി; അല്ലെങ്കിൽ ദൈവത്തിന്റെ നമ്മോടുള്ള സ്നേഹം മാത്രം പൂർത്തിയായി
  rationale: ഗ്രീക്ക് വാചകം സ്നേഹത്തിന്റെ ദിശയെ ഒരൊറ്റ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കുന്നില്ല. അതിനാൽ സ്നേഹം വിശ്വാസികളുമായി ബന്ധപ്പെട്ട് അതിന്റെ ഉദ്ദേശ്യപൂർണതയിലെത്തുന്നു എന്ന ആശയം നൽകുമ്പോഴും perfectionist ഉപദേശം ഇറക്കുമതി ചെയ്യുകയോ സ്നേഹത്തെ ഒരേയൊരു ദിശയിലേക്ക് പരിമിതപ്പെടുത്തുകയോ ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. ദൈർഘ്യമേറിയ ഗ്രീക്ക് വാക്യത്തിന്റെ തർക്കബന്ധം വ്യക്തമാക്കാൻ ദീർഘവിരാമവും തുടർന്ന് ‘കാരണം’ എന്ന പുതിയ വാക്യവും ഉപയോഗിച്ചു. സാങ്കേതിക സഭാഭാഷയും വിഭാഗീയ പദപ്രയോഗങ്ങളും ഒഴിവാക്കി.
