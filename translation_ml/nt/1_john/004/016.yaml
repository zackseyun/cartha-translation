id: 1JN.4.16
reference: 1 John 4:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἡμεῖς ἐγνώκαμεν καὶ πεπιστεύκαμεν τὴν ἀγάπην ἣν ἔχει ὁ θεὸς ἐν ἡμῖν. Ὁ θεὸς ἀγάπη ἐστίν, καὶ ὁ μένων ἐν τῇ ἀγάπῃ ἐν τῷ θεῷ μένει καὶ ὁ θεὸς ἐν αὐτῷ ⸀μένει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/016.yaml
  text: And we have come to know and have believed the love that God has for us[a]. God is love, and the one who remains in love remains in God[c][b], and God remains in him.
translation:
  language: ml
  text: ദൈവത്തിന് നമ്മിലുള്ള സ്നേഹം നാം അറിയുകയും വിശ്വസിക്കുകയും ചെയ്തിരിക്കുന്നു.[a] ദൈവം സ്നേഹമാണ്. സ്നേഹത്തിൽ നിലനിൽക്കുന്നവൻ ദൈവത്തിൽ നിലനിൽക്കുന്നു; ദൈവം അവനിലും നിലനിൽക്കുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ദൈവത്തിന് നമ്മുടെ ഇടയിലുള്ള സ്നേഹം.” ഗ്രീക്ക് പ്രയോഗം വിശ്വാസികളുടെ ഉള്ളിലുള്ളതോ സമൂഹത്തിൽ പ്രകടമാകുന്നതോ ആയ സ്നേഹത്തെ സൂചിപ്പിക്കാം. “ദൈവത്തിന് നമ്മോടുള്ള സ്നേഹം” എന്ന വായന സന്ദർഭാനുസൃതമായി സാധ്യമാണെങ്കിലും, ഗ്രീക്കിലെ സ്ഥാനാർഥം നേരിട്ട് വ്യക്തമാക്കുന്നില്ല.
    reason: alternative_reading
  - marker: b
    text: “അവനിൽ” എന്ന ഗ്രീക്ക് രൂപം പുല്ലിംഗ ഏകവചനമാണെങ്കിലും, സ്നേഹത്തിൽ നിലനിൽക്കുന്ന ഏതൊരാളെയും പ്രതിനിധാനപരമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώκαμεν
  choice: നാം അറിഞ്ഞിരിക്കുന്നു
  rationale: γινώσκω എന്ന ക്രിയയുടെ പൂർണകാലം, മുമ്പ് അറിവിലേക്കു വന്നതിന്റെ ഫലമായി ഇപ്പോൾ നിലനിൽക്കുന്ന അറിവിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ പൂർണകാലപ്രയോഗം ഇത് സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: πεπιστεύκαμεν
  choice: വിശ്വസിക്കുകയും ചെയ്തിരിക്കുന്നു
  rationale: πιστεύω എന്ന ക്രിയയുടെ പൂർണകാലവും ഇപ്പോൾ തുടരുന്ന ഉറച്ച വിശ്വാസത്തെ സൂചിപ്പിക്കുന്നു; ആദ്യ ക്രിയയോടുള്ള സമാന്തരതയും കാലഭാവവും നിലനിർത്തുന്നു.
- source_word: τὴν ἀγάπην
  choice: സ്നേഹം
  rationale: ἀγάπηയ്ക്ക് സാധാരണവും മാന്യവുമായ മലയാളപദം; നിർദിഷ്ടത ദൈവത്തിന് നമ്മോടുള്ള എന്ന ബന്ധവാക്യത്തിലൂടെ വ്യക്തമാണ്.
- source_word: ἣν ἔχει ὁ θεὸς ἐν ἡμῖν
  choice: ദൈവത്തിന് നമ്മോടുള്ള
  rationale: ഇവിടത്തെ ἐν ἡμῖν ദൈവസ്നേഹത്തിന്റെ നമ്മോടുള്ള ബന്ധമായി സ്വാഭാവികമായി ഗ്രഹിക്കാം; എന്നാൽ ഉള്ളിൽ/നമ്മുടെ ഇടയിൽ എന്ന സ്ഥാനാർഥവും സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: Ὁ θεὸς ἀγάπη ἐστίν
  choice: ദൈവം സ്നേഹമാകുന്നു
  rationale: ഗ്രീക്കിലെ വിധേയനാമഘടനയെ വിശദീകരണമില്ലാതെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ὁ μένων ἐν τῇ ἀγάπῃ
  choice: സ്നേഹത്തിൽ നിലനിൽക്കുന്നവൻ
  rationale: μένω എന്ന യോഹന്നാനീയ മുഖ്യപദത്തിന് ‘നിലനിൽക്കുക’ സ്വാഭാവികവും ബന്ധത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്നതുമായ പരിഭാഷയാണ്.
- source_word: ἐν τῷ θεῷ μένει
  choice: ദൈവത്തിൽ നിലനിൽക്കുന്നു
  rationale: പരസ്പര വാസത്തിന്റെ ആശയവും μένωയുടെ പദസമന്വയവും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: ὁ θεὸς ἐν αὐτῷ μένει
  choice: ദൈവം അവനിലും നിലനിൽക്കുന്നു
  rationale: αὐτῷ എന്ന പുല്ലിംഗ ഏകവചനരൂപം പ്രതിനിധാനപരമായി ‘അവൻ’ എന്നു നൽകുന്നു; ‘-ലും’ പരസ്പര നിലനിൽപ്പിന്റെ സമാന്തരത വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ἐν ἡμῖν എന്നതിന്റെ അർഥം
  choice: പ്രധാനവാചകത്തിൽ ‘നമ്മോടുള്ള’
  alternative: ‘നമ്മിൽ’ അഥവാ ‘നമ്മുടെ ഇടയിൽ’
  rationale: സന്ദർഭത്തിൽ ദൈവസ്നേഹത്തിന്റെ മനുഷ്യരോടുള്ള ദിശ സ്വാഭാവികമാണ്; എങ്കിലും ഗ്രീക്കിലെ ἐν എന്നതിന്റെ സ്ഥാനാർഥവും സമൂഹപരമായ സൂചനയും യഥാർഥ സാധ്യതകളായതിനാൽ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: αὐτῷ എന്ന പുല്ലിംഗ ഏകവചനത്തിന്റെ പ്രതിനിധാനപ്രയോഗം
  choice: ‘അവനിൽ’
  alternative: ‘ആ വ്യക്തിയിൽ’
  rationale: മൂലരൂപത്തോട് ചേർന്ന് നിൽക്കുകയും മുൻപുള്ള ‘നിലനിൽക്കുന്നവൻ’ എന്ന പൊതുവായ വ്യക്തിയെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു; ഇത് പുരുഷന്മാർക്ക് മാത്രം പരിമിതമാണെന്നർഥമില്ലെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. യോഹന്നാന്റെ ആവർത്തനവും ‘നിലനിൽക്കുക’ എന്ന മുഖ്യപദത്തിന്റെ ഏകോപനവും സംരക്ഷിച്ചു; അസ്വാഭാവികമായ പദാനുപദരീതി ഒഴിവാക്കി.
