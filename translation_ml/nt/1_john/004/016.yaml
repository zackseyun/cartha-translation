  - severity: low
    issue: “ദൈവം സ്നേഹമാകുന്നു” is less idiomatic in modern Malayalam.
    rationale: “ദൈവം സ്നേഹമാണ്” is the normal, direct Malayalam rendering of the predicate-nominative statement and does not alter its meaning.
