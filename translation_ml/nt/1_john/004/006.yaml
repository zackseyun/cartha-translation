id: 1JN.4.6
reference: 1 John 4:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἡμεῖς ἐκ τοῦ θεοῦ ἐσμεν· ὁ γινώσκων τὸν θεὸν ἀκούει ἡμῶν, ὃς οὐκ ἔστιν ἐκ τοῦ θεοῦ οὐκ ἀκούει ἡμῶν. ἐκ τούτου γινώσκομεν τὸ πνεῦμα τῆς ἀληθείας καὶ τὸ πνεῦμα τῆς πλάνης.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/006.yaml
  text: We are from God[a]. The one who knows God listens to us; whoever is not from God does not listen to us[c][b]. By this we know the Spirit of truth and the spirit of error.
translation:
  language: ml
  text: ഞങ്ങൾ ദൈവത്തിൽനിന്നുള്ളവരാണ്. ദൈവത്തെ അറിയുന്നവൻ ഞങ്ങളെ കേൾക്കുന്നു[a]; ദൈവത്തിൽനിന്നുള്ളവനല്ലാത്തവൻ ഞങ്ങളെ കേൾക്കുന്നില്ല[a]. ഇതിലൂടെ സത്യത്തിന്റെ ആത്മാവിനെയും[b][c] വഞ്ചനയുടെ ആത്മാവിനെയും നാം തിരിച്ചറിയുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഞങ്ങളെ കേൾക്കുന്നു’ എന്നതിന് ‘ഞങ്ങളുടെ വാക്കു കേൾക്കുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘കേൾക്കുക’ എന്ന അർഥമുണ്ടെങ്കിലും, ഇവിടെ അപ്പൊസ്തലിക സാക്ഷ്യത്തെ സ്വീകരിച്ച് ശ്രദ്ധിക്കുന്നതാണ് ഉദ്ദേശ്യമാകാൻ സാധ്യത.
    reason: lexical_alternative
  - marker: b
    text: ‘സത്യത്തിന്റെ ആത്മാവ്’ എന്ന പ്രയോഗം യോഹന്നാൻ 14:17; 15:26; 16:13 എന്നിവയെ ഓർമിപ്പിക്കുന്നു.
    reason: cross_reference
  - marker: c
    text: ‘സത്യത്തിന്റെ ആത്മാവ്’ എന്നത് പൊതുവായി സത്യത്തോടു ബന്ധപ്പെട്ട ആത്മിക സ്വാധീനം എന്നും വായിക്കാം; എങ്കിലും യോഹന്നാന്റെ പ്രയോഗത്തിൽ ഇത് സാധാരണയായി പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τοῦ θεοῦ
  choice: ദൈവത്തിൽനിന്നുള്ളവർ
  rationale: ἐκ സൂചിപ്പിക്കുന്ന ഉറവിടം/ഉത്ഭവം നിലനിർത്താൻ ‘ദൈവത്തിന്റെവർ’ എന്നതിനെക്കാൾ ‘ദൈവത്തിൽനിന്നുള്ളവർ’ എന്നു നൽകി; യോഹന്നാന്റെ വിരുദ്ധജോടിയും ഇതിലൂടെ വ്യക്തമാണ്.
- source_word: ὁ γινώσκων τὸν θεὸν
  choice: ദൈവത്തെ അറിയുന്നവൻ
  rationale: നാമവിശേഷണമായി പ്രവർത്തിക്കുന്ന വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ പൊതുവായ, സ്വഭാവസൂചകമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀκούει ἡμῶν
  choice: ഞങ്ങൾ പറയുന്നത് കേൾക്കുന്നു
  rationale: ഇവിടെ ἀκούω വെറും ശബ്ദം കേൾക്കുന്നതിലുപരി അപ്പൊസ്തലിക സാക്ഷ്യത്തെ സ്വീകരിച്ചു കേൾക്കുന്നതാണ്. ‘അനുസരിക്കുന്നു’ എന്നു ശക്തിപ്പെടുത്താതെ സ്വീകാര്യമായ കേൾവിയുടെ ആശയം നൽകുന്നു.
- source_word: ὃς οὐκ ἔστιν ἐκ τοῦ θεοῦ
  choice: ദൈവത്തിൽനിന്നുള്ളവനല്ലാത്തവൻ
  rationale: ബന്ധസർവനാമത്തിന്റെ പൊതുവായ വർഗസൂചന നിലനിർത്തുകയും ἐκ എന്ന ഉറവിടസൂചന ആവർത്തിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐκ τούτου
  choice: ഇതിലൂടെ
  rationale: മുൻപറഞ്ഞ മാനദണ്ഡത്തിന്റെ അടിസ്ഥാനത്തിൽ തിരിച്ചറിയുന്നു എന്ന യോഹന്നാനീയ നിഗമനപ്രയോഗം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: γινώσκομεν
  choice: നാം തിരിച്ചറിയുന്നു
  rationale: ഈ സന്ദർഭത്തിൽ γινώσκω വിവേചിച്ചറിയുന്നതിനെ സൂചിപ്പിക്കുന്നു. ആദ്യത്തെ ‘അറിയുന്നവൻ’ എന്ന പ്രയോഗവുമായി ബന്ധം പൂർണമായി മായാതെയും മലയാളത്തിൽ സന്ദർഭാർഥം വ്യക്തമാകത്തക്കവണ്ണവും ‘തിരിച്ചറിയുന്നു’ തിരഞ്ഞെടുത്തു.
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: സത്യത്തിന്റെ ആത്മാവ്
  rationale: യോഹന്നാനീയ പ്രയോഗത്തിൽ പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കാനുള്ള സാധ്യത ശക്തമാണ്; മലയാളത്തിൽ വ്യക്തിപരമായ ദൈവിക സൂചനയ്ക്കനുസരിച്ച് ‘ആത്മാവ്’ ഉപയോഗിച്ചു, മറ്റൊരു വായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: τὸ πνεῦμα τῆς πλάνης
  choice: വഴിതെറ്റിക്കുന്ന ആത്മാവ്
  rationale: πλάνη തെറ്റ്, വഞ്ചന, സത്യത്തിൽനിന്നുള്ള വഴിതെറ്റൽ എന്നിവ ഉൾക്കൊള്ളുന്നു. ‘തെറ്റിന്റെ ആത്മാവ്’ എന്ന കൃത്രിമത ഒഴിവാക്കി, വഞ്ചനാത്മക സ്വാധീനത്തിന്റെ പ്രവർത്തനം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ആദ്യത്തെ πνεῦμα പരിശുദ്ധാത്മാവിനെ വ്യക്തിപരമായി സൂചിപ്പിക്കുന്നുണ്ടോ
  choice: സത്യത്തിന്റെ ആത്മാവ്
  alternative: സത്യത്തിന്റെ ആത്മിക സ്വാധീനം / സത്യത്തിന്റെ മനോഭാവം
  rationale: 1 യോഹന്നാൻ 4:1–6-ലെ ആത്മാക്കളെ പരിശോധിക്കുന്ന സന്ദർഭവും യോഹന്നാൻ 14:17; 15:26; 16:13-ലെ സ്ഥിരപ്രയോഗവും പരിശുദ്ധാത്മാവെന്ന സൂചനയെ പിന്തുണയ്ക്കുന്നു. എങ്കിലും വ്യാകരണപരമായി പൊതുവായ വായന സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- issue: ἀκούει ἡμῶν വെറും കേൾവിയോ സ്വീകാര്യമായി ശ്രദ്ധിക്കുന്നതോ
  choice: ഞങ്ങൾ പറയുന്നത് കേൾക്കുന്നു
  alternative: ഞങ്ങളുടെ വാക്ക് അനുസരിക്കുന്നു / ഞങ്ങളെ കേൾക്കുന്നു
  rationale: സന്ദർഭം അപ്പൊസ്തലിക സാക്ഷ്യത്തോടുള്ള പ്രതികരണത്തെ പരീക്ഷണമായി അവതരിപ്പിക്കുന്നു. ‘കേൾക്കുന്നു’ സ്വീകാര്യമായ ശ്രദ്ധ ഉൾക്കൊള്ളാൻ കഴിയും; ‘അനുസരിക്കുന്നു’ എന്നു നൽകിയാൽ ഗ്രീക്കിനെക്കാൾ ശക്തമായ അവകാശവാദമാകും.
- issue: τὸ πνεῦμα τῆς πλάνης വ്യക്തിപരമായ ദുരാത്മാവിനെയോ പൊതുവായ വഞ്ചക സ്വാധീനത്തെയോ സൂചിപ്പിക്കുന്നുണ്ടോ
  choice: വഴിതെറ്റിക്കുന്ന ആത്മാവ്
  alternative: തെറ്റിന്റെ ആത്മാവ് / വഴിതെറ്റിക്കുന്ന ആത്മിക സ്വാധീനം
  rationale: ഗ്രീക്ക് രൂപം വ്യക്തിപരമായ ആത്മാവിനും പ്രവർത്തിക്കുന്ന ആത്മിക സ്വാധീനത്തിനും ഇടയിൽ നിർബന്ധമായ തീർപ്പ് നൽകുന്നില്ല. ‘ആത്മാവ്’ ഈ ഉദ്ദേശ്യപൂർവമായ അസ്പഷ്ടത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഞങ്ങൾ’ അപ്പൊസ്തലിക സാക്ഷികളുടെ ശബ്ദമായി നിലനിർത്തി; അവസാന വാക്യത്തിലെ ഉൾക്കൊള്ളുന്ന നിഗമനത്തിന് സ്വാഭാവികമായി ‘നാം’ ഉപയോഗിച്ചു. ഇംഗ്ലീഷ് പാളിയിലെ അടിക്കുറിപ്പ്-മാർക്കർ ക്രമക്കേട് തിരുത്തി, ഓരോ മാർക്കറും ബന്ധപ്പെട്ട മുഖ്യപാഠസ്ഥാനത്ത് ചേർത്തു.
