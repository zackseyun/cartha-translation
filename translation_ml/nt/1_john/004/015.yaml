revisions:
- from: യേശു ദൈവപുത്രനാണെന്ന് ഏറ്റുപറയുന്നവനിൽ ദൈവം നിലനിൽക്കുന്നു[a]; അവനും ദൈവത്തിൽ നിലനിൽക്കുന്നു.
  to: യേശു ദൈവപുത്രനാണെന്ന് ഏറ്റുപറയുന്നവനിൽ ദൈവം വസിക്കുന്നു[a]; അവനും ദൈവത്തിൽ വസിക്കുന്നു.
  rationale: The revision replaces the less idiomatic «നിലനിൽക്കുന്നു» with «വസിക്കുന്നു» in both balanced clauses, accurately expressing μένω in this reciprocal indwelling context. It preserves the source's generic singular, the public-confession sense of ὁμολογήσῃ, the christological title, and the reciprocal symmetry. The footnote now supplies «നിലനിൽക്കുന്നു» as a legitimate lexical alternative.
