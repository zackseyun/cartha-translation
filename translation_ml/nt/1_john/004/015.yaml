    text: അഥവാ, ‘നിലനിൽക്കുന്നു.’ ഗ്രീക്കിലെ മെനോ എന്ന ക്രിയ യോഹന്നാന്റെ രചനകളിലെ ഒരു മുഖ്യപദമാണ്; അതിന് ‘വസിക്കുക’ എന്നും ‘നിലനിൽക്കുക’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
  revision_rationale: The revision replaces the less idiomatic «നിലനിൽക്കുന്നു» with «വസിക്കുന്നു» in both balanced clauses, accurately expressing μένω in this reciprocal indwelling context. It preserves the source's generic singular, the public-confession sense of ὁμολογήσῃ, the christological title, and the reciprocal symmetry. The footnote now supplies «നിലനിൽക്കുന്നു» as a legitimate lexical alternative.
