id: 1JN.4.15
reference: 1 John 4:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃς ⸀ἐὰν ὁμολογήσῃ ὅτι ⸀Ἰησοῦς ἐστιν ὁ υἱὸς τοῦ θεοῦ, ὁ θεὸς ἐν αὐτῷ μένει καὶ αὐτὸς ἐν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/015.yaml
  text: Whoever confesses that Jesus is the Son of God[a], God remains in him, and he in God.
translation:
  language: ml
  text: യേശു ദൈവപുത്രനാണെന്ന് ഏറ്റുപറയുന്നവനിൽ ദൈവം വസിക്കുന്നു[a]; അവനും ദൈവത്തിൽ വസിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിലനിൽക്കുന്നു.’ ഗ്രീക്കിലെ മെനോ എന്ന ക്രിയ യോഹന്നാന്റെ രചനകളിലെ ഒരു മുഖ്യപദമാണ്; അതിന് ‘വസിക്കുക’ എന്നും ‘നിലനിൽക്കുക’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἐὰν
  choice: എറ്റുപറയുന്നവനിൽ
  rationale: അനിശ്ചിതസംബന്ധവാക്യത്തിന്റെ ‘ആരെങ്കിലും/ആർ ആയാലും’ എന്ന പൊതുവ്യാപക അർഥം മലയാളത്തിൽ സ്വാഭാവികമായ ബന്ധവാക്യഘടനയിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: ὁμολογήσῃ
  choice: ഏറ്റുപറയുന്ന
  rationale: യേശുവിനെക്കുറിച്ചുള്ള സത്യം തുറന്നും വ്യക്തമായും അംഗീകരിച്ചു പ്രഖ്യാപിക്കുക എന്ന യോഹന്നാനീയ ആശയം ‘ഏറ്റുപറയുക’ സംരക്ഷിക്കുന്നു.
- source_word: Ἰησοῦς ἐστιν ὁ υἱὸς τοῦ θεοῦ
  choice: യേശു ദൈവപുത്രനാണ്
  rationale: പ്രധാന ക്രിസ്തുശാസ്ത്രപരമായ വിശേഷണം പരാവർത്തനം ചെയ്യാതെ, മലയാളത്തിലെ സ്ഥാപിതവും സ്വാഭാവികവുമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐν αὐτῷ μένει
  choice: അവനിൽ നിലനിൽക്കുന്നു
  rationale: μένω എന്ന യോഹന്നാനീയ മുഖ്യപദത്തിന്റെ തുടർച്ചയുടെയും ബന്ധത്തിന്റെയും ഭാവം ‘നിലനിൽക്കുന്നു’ വ്യക്തമാക്കുന്നു; ‘വസിക്കുന്നു’ എന്നത് സാധുവായ മറ്റൊരു സാധ്യതയാണ്.
- source_word: καὶ αὐτὸς ἐν τῷ θεῷ
  choice: അവനും ദൈവത്തിൽ നിലനിൽക്കുന്നു
  rationale: ഗ്രീക്കിൽ രണ്ടാം ഖണ്ഡത്തിൽ ക്രിയ ലോപിച്ചിട്ടുണ്ടെങ്കിലും, മലയാളത്തിൽ അർഥവ്യക്തതയ്ക്കും സ്വാഭാവികതയ്ക്കുമായി അത് ആവർത്തിക്കുന്നു; പരസ്പരബന്ധത്തിന്റെ സമാന്തരത സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: പരസ്പരമായ ദൈവ-മനുഷ്യ നിലനിൽപ്പ്
  choice: ‘ദൈവം അവനിൽ നിലനിൽക്കുന്നു; അവനും ദൈവത്തിൽ നിലനിൽക്കുന്നു’ എന്ന പരസ്പരരൂപം അതേപടി നിലനിർത്തി.
  alternative: ‘ദൈവം അവനിൽ വസിക്കുന്നു; അവനും ദൈവത്തിൽ വസിക്കുന്നു.’
  rationale: യേശുവിനെ ദൈവപുത്രനായി ഏറ്റുപറയുന്നതുമായി ബന്ധപ്പെടുത്തി വാക്യം പറയുന്ന പരസ്പര നിലനിൽപ്പിനെ വ്യാഖ്യാനിച്ചു ചുരുക്കാതെയും പിന്നീടുള്ള സിദ്ധാന്തവ്യവസ്ഥ ചേർക്കാതെയും സംരക്ഷിക്കുന്നു.
- issue: ക്രിസ്തുശാസ്ത്രപരമായ വിശേഷണം
  choice: ὁ υἱὸς τοῦ θεοῦ എന്നത് ‘ദൈവപുത്രൻ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ദൈവത്തിന്റെ പുത്രൻ’
  rationale: ‘ദൈവപുത്രൻ’ മലയാളത്തിൽ വ്യക്തവും സ്ഥാപിതവുമായ വിശേഷണരൂപമാണ്; ഗ്രീക്കിലെ പ്രസ്താവനയ്ക്ക് അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, ഗൗരവമുള്ള ശൈലി. ആദ്യഖണ്ഡത്തിലെ ഗ്രീക്ക് അനിശ്ചിതസംബന്ധഘടന മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണബന്ധവാക്യമായി നൽകിയിരിക്കുന്നു; രണ്ടാം ഖണ്ഡത്തിലെ ലുപ്തക്രിയ വ്യക്തതയ്ക്കായി ആവർത്തിച്ചിരിക്കുന്നു.
