  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἡμεῖς ⸀ἀγαπῶμεν, ὅτι αὐτὸς πρῶτος ἠγάπησεν ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/019.yaml
  text: We love because he first loved us[a].
translation:
  language: ml
  text: അവൻ ആദ്യം നമ്മെ സ്നേഹിച്ചതുകൊണ്ട് നാം സ്നേഹിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ചില കൈയെഴുത്തുപ്രതികളിൽ: “അവൻ ആദ്യം നമ്മെ സ്നേഹിച്ചതുകൊണ്ട് നാം അവനെ സ്നേഹിക്കുന്നു.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἡμεῖς
  choice: നാം
  rationale: ഗ്രീക്കിൽ കർത്തൃസർവനാമം വ്യക്തമായി നൽകിയിരിക്കുന്നു; മലയാളത്തിൽ ‘നാം’ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്ന സമൂഹത്തെ സൂചിപ്പിക്കുകയും ആവശ്യമായ ഊന്നൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἀγαπῶμεν
  choice: സ്നേഹിക്കുന്നു
  rationale: വർത്തമാനകാല ക്രിയയെ സ്വാഭാവികമായ മലയാള വർത്തമാനരൂപത്തിൽ നൽകി; സന്ദർഭത്തിലെ സ്നേഹവുമായി ബന്ധപ്പെട്ട പദബന്ധവും നിലനിർത്തുന്നു. മൂലപാഠത്തിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ലാത്തതിനാൽ ഇവിടെ ഒന്നും ചേർത്തിട്ടില്ല.
- source_word: ὅτι
  choice: -തുകൊണ്ട്
  rationale: 'ഇവിടെ കാരണബന്ധമാണ് സൂചിപ്പിക്കുന്നത്: നമ്മുടെ സ്നേഹത്തിന്റെ അടിസ്ഥാനം അവന്റെ മുൻകാല സ്നേഹമാണ്.'
- source_word: αὐτὸς
  choice: അവൻ
  rationale: സന്ദർഭത്തിൽ ദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികമായ സർവനാമം ഉപയോഗിച്ചു.
- source_word: πρῶτος
  choice: ആദ്യം
  rationale: അവന്റെ സ്നേഹം നമ്മുടെ സ്നേഹത്തിനു മുമ്പുള്ളതാണെന്ന കാലപരമായ മുൻഗണന നേരിട്ട് പ്രകടമാക്കുന്നു.
- source_word: ἠγάπησεν
  choice: സ്നേഹിച്ചു
  rationale: ഗ്രീക്ക് ഏയോറിസ്റ്റിന്റെ മുൻകാല, നിർണായക പ്രവൃത്തിയെ മലയാളത്തിലെ ഭൂതകാലരൂപം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἡμᾶς
  choice: നമ്മെ
  rationale: ക്രിയയുടെ നേരിട്ടുള്ള കർമത്തെ കൃത്യമായി നൽകുന്നു.
theological_decisions:
- issue: ‘നാം സ്നേഹിക്കുന്നു’ എന്നതിന് ഒരു കർമം ചേർക്കണമോ
  choice: കർമം ചേർക്കാതെ ‘നാം സ്നേഹിക്കുന്നു’ എന്നു നൽകുന്നു
  alternative: ‘നാം അവനെ സ്നേഹിക്കുന്നു’ അല്ലെങ്കിൽ ‘നാം ദൈവത്തെ സ്നേഹിക്കുന്നു’
  rationale: SBLGNT മൂലപാഠത്തിലെ ἀγαπῶμεν എന്ന ക്രിയയ്ക്കു ശേഷം വ്യക്തമായ കർമമില്ല. ‘അവനെ’ ചേർക്കുന്നത് ചില കൈയെഴുത്തുപ്രതികളുടെ വായനയെയും പരിഭാഷാപാരമ്പര്യത്തെയും പിന്തുടരും; പ്രധാന പാഠത്തിന്റെ വിശാലവും ഉദ്ദേശപൂർവം തുറന്നതുമായ അർഥം നിലനിർത്താൻ കർമം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. കാരണവാക്യം ആദ്യം വെച്ചത് മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിനും ഗ്രീക്കിലെ കാരണബന്ധത്തിന്റെ വ്യക്തതയ്ക്കും അനുയോജ്യമാണ്.
