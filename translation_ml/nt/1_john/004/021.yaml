id: 1JN.4.21
reference: 1 John 4:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ταύτην τὴν ἐντολὴν ἔχομεν ἀπ’ αὐτοῦ, ἵνα ὁ ἀγαπῶν τὸν θεὸν ἀγαπᾷ καὶ τὸν ἀδελφὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/021.yaml
  text: 'And we have this commandment from him: that the one who loves God should also love his brother[a].'
translation:
  language: ml
  text: 'അവനിൽനിന്ന് നമുക്കു ഈ കൽപ്പനയുണ്ട്: ദൈവത്തെ സ്നേഹിക്കുന്നവൻ തന്റെ സഹോദരനെയും സ്നേഹിക്കണം.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തന്റെ സഹോദരനെയോ സഹോദരിയെയോ’; ഗ്രീക്കിൽ ‘തന്റെ സഹോദരനെ’ എന്നാണ്. ഇവിടെ പുരുഷലിംഗ ഏകവചനരൂപം ഒരു സഹവിശ്വാസിയെ പ്രതിനിധാനാത്മകമായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐντολήν
  choice: കല്പന
  rationale: യോഹന്നാന്റെ പ്രയോഗത്തിലെ ധാർമികവും അധികാരപൂർണവുമായ അർഥം നിലനിർത്തുന്ന, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ പദം.
- source_word: ἀπ’ αὐτοῦ
  choice: അവനിൽനിന്ന്
  rationale: ഗ്രീക്കിലെ സർവനാമം അതേപടി നിലനിർത്തുന്നു; സമീപസന്ദർഭത്തിൽ അത് ദൈവത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും വിവർത്തനത്തിൽ പേര് ആവർത്തിച്ച് വ്യക്തത കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: ἵνα
  choice: എന്നതാണ് കല്പനയുടെ ഉള്ളടക്കമായി കോളൻകൊണ്ട് അവതരിപ്പിച്ചു
  rationale: ഇവിടെ ἵνα പ്രധാനമായും കല്പന ആവശ്യപ്പെടുന്നതെന്തെന്ന ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ കോളൻ ഉപയോഗിച്ചുള്ള ഘടന സ്വാഭാവികമാണ്.
- source_word: ὁ ἀγαπῶν τὸν θεόν
  choice: ദൈവത്തെ സ്നേഹിക്കുന്നവൻ
  rationale: ലിംഗപരമായി പ്രതിനിധാനാത്മകമായ ഏകവചന കർത്തൃവാചക കൃദന്തരൂപം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀγαπᾷ
  choice: സ്നേഹിക്കണം
  rationale: ἵνα-യോടൊപ്പമുള്ള വർത്തമാനകാല subjunctive കല്പനയുടെ ബാധ്യത പ്രകടിപ്പിക്കുന്നു; ‘സ്നേഹിക്കണം’ അതിനെ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἀδελφὸν αὐτοῦ
  choice: തന്റെ സഹോദരനെ
  rationale: പുരുഷലിംഗ ഏകവചനമായ ഗ്രീക്ക് രൂപം പ്രധാനപാഠത്തിൽ സംരക്ഷിക്കുന്നു; വിശ്വാസസമൂഹത്തിലെ സഹവിശ്വാസിയെ പ്രതിനിധാനാത്മകമായി സൂചിപ്പിക്കാമെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: καὶ
  choice: -നെയും
  rationale: രണ്ടാമത്തെ καί-യുടെ കൂട്ടിച്ചേർക്കൽ ഊന്നൽ മലയാളത്തിലെ ‘-നെയും’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀγαπάω / ἀγαπῶν / ἀγαπᾷ
  choice: സ്നേഹിക്കുക / സ്നേഹിക്കുന്ന / സ്നേഹിക്കണം
  rationale: യോഹന്നാന്റെ ആശയപരമായ ഏകോപനം നിലനിർത്താൻ ഒരേ മലയാള പദകുടുംബം തുടർച്ചയായി ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: ἀδελφὸν αὐτοῦ എന്നതിലെ പുരുഷലിംഗ ഏകവചന പരാമർശം
  choice: പ്രധാനപാഠത്തിൽ ‘തന്റെ സഹോദരനെ’ നിലനിർത്തി, ഉൾക്കൊള്ളുന്ന സമൂഹാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
  alternative: ‘തന്റെ സഹോദരനെയോ സഹോദരിയെയോ’ അല്ലെങ്കിൽ ‘തന്റെ സഹവിശ്വാസിയെ’
  rationale: ഗ്രീക്ക് വ്യാകരണപരമായി പുരുഷലിംഗ ഏകവചനമാണെങ്കിലും സന്ദർഭത്തിൽ സഹവിശ്വാസികളെ പ്രതിനിധാനാത്മകമായി ഉൾക്കൊള്ളാം. ഉറവിടരൂപം പ്രധാനപാഠത്തിൽ സംരക്ഷിക്കുകയും അതിന്റെ വിശാല പ്രയോഗം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ സർവനാമപരമായ അവ്യക്തതയും പുരുഷലിംഗ ഏകവചനരൂപവും സംരക്ഷിച്ചിരിക്കുന്നു; കല്പനയുടെ ഉള്ളടക്കം കോളൻകൊണ്ട് സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
