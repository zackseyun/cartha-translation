id: 1JN.4.10
reference: 1 John 4:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν τούτῳ ἐστὶν ἡ ἀγάπη, οὐχ ὅτι ἡμεῖς ⸀ἠγαπήκαμεν τὸν θεόν, ἀλλ’ ὅτι αὐτὸς ἠγάπησεν ἡμᾶς καὶ ἀπέστειλεν τὸν υἱὸν αὐτοῦ ἱλασμὸν περὶ τῶν ἁμαρτιῶν ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/010.yaml
  text: 'In this is love: not that we have loved God, but that he loved us and sent his Son as an atoning sacrifice for our sins.'
translation:
  language: ml
  text: 'സ്നേഹം ഇതിലാണ്: നാം ദൈവത്തെ സ്നേഹിച്ചതിലല്ല, മറിച്ച് ദൈവം നമ്മെ സ്നേഹിക്കുകയും നമ്മുടെ പാപങ്ങൾക്കുവേണ്ടിയുള്ള പ്രായശ്ചിത്തയാഗമായി തന്റെ പുത്രനെ അയയ്ക്കുകയും ചെയ്തതിലാണ്.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പ്രായശ്ചിത്തയാഗം” എന്നതിന് “പാപപരിഹാരയാഗം” എന്നും “കോപശമനയാഗം” എന്നും വിവർത്തനം ചെയ്യാവുന്നതാണ്. ഗ്രീക്ക് പദമായ ἱλασμός പാപങ്ങളോടുള്ള പുത്രന്റെ യാഗപരമായ ഇടപെടലിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ ἐστὶν ἡ ἀγάπη
  choice: സ്നേഹം എന്താണെന്നു നാം ഇതിൽ കാണുന്നു
  rationale: യോഹന്നാന്റെ നിർവചനാത്മകമായ പ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; തുടർന്ന് പറയുന്നതാണ് സ്നേഹത്തിന്റെ നിർണായക പ്രകടനം എന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: οὐχ ὅτι ... ἀλλ’ ὅτι
  choice: '... എന്നതിലല്ല, ... ചെയ്തതിലാണ്'
  rationale: ഗ്രീക്കിലെ ശക്തമായ നിഷേധ–വൈരുധ്യ ഘടന മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി സംരക്ഷിക്കുന്നു.
- source_word: ἠγαπήκαμεν τὸν θεόν
  choice: നാം ദൈവത്തെ സ്നേഹിച്ചുവെന്നത്
  rationale: പൂർണ്ണകാലത്തിന്റെ മുൻപ്രവൃത്തിസംബന്ധമായ ഭാവം മലയാളത്തിലെ ക്രിയാരൂപത്തിലൂടെ സൂചിപ്പിക്കുന്നു; ദൈവത്തിന്റെ നിർണായക പ്രവൃത്തിയോടുള്ള വൈരുധ്യം നിലനിർത്തുന്നു.
- source_word: αὐτὸς ἠγάπησεν ἡμᾶς
  choice: അവിടുന്ന് നമ്മെ സ്നേഹിച്ചു
  rationale: αὐτός നൽകുന്ന ഊന്നൽ വൈരുധ്യഘടനയിൽ നിലനിൽക്കുന്നു; ദൈവത്തെ സൂചിപ്പിക്കാൻ ആദരസൂചകമായ സ്വാഭാവിക മലയാള സർവനാമം ഉപയോഗിക്കുന്നു.
- source_word: ἀπέστειλεν τὸν υἱὸν αὐτοῦ
  choice: തന്റെ പുത്രനെ അയച്ചു
  rationale: അയയ്ക്കൽ എന്ന യോഹന്നാനീയ ഭാഷയും പിതൃപുത്രബന്ധവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: ἱλασμὸν
  choice: പ്രായശ്ചിത്തയാഗമായി
  rationale: പാപങ്ങളെ ഫലപ്രദമായി കൈകാര്യം ചെയ്യുന്ന പുത്രന്റെ ബലിയർപ്പണത്തെ വായനാസൗകര്യത്തോടെ അറിയിക്കുന്നു; കോപശമനമോ പാപപരിഹാരമോ മാത്രം നിർബന്ധമായി തെരഞ്ഞെടുത്ത് ഗ്രീക്കിലെ വ്യാപ്തി ചുരുക്കുന്നില്ല.
- source_word: περὶ τῶν ἁμαρτιῶν ἡμῶν
  choice: നമ്മുടെ പാപങ്ങൾക്കുവേണ്ടിയുള്ള
  rationale: ബലിസംബന്ധമായ സന്ദർഭത്തിൽ περίയുടെ സ്വാഭാവിക അർത്ഥം നൽകുന്നു.
theological_decisions:
- issue: പ്രായശ്ചിത്തസന്ദർഭത്തിലെ ἱλασμός എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: പ്രായശ്ചിത്തയാഗം
  alternative: പാപപരിഹാരയാഗം; ദൈവകോപശമനയാഗം
  rationale: ദൈവം തന്റെ പുത്രനെ അയച്ചതിലൂടെ മനുഷ്യരുടെ പാപങ്ങളെ ബലിയർപ്പണപരമായി കൈകാര്യം ചെയ്തു എന്ന കേന്ദ്രാർത്ഥം സംരക്ഷിക്കുന്നു. പദം കോപശമനത്തെയോ പാപനിവാരണത്തെയോ പ്രത്യേകമായി മാത്രം മുൻനിർത്തുന്നുവെന്ന വിവാദം മുഖ്യവാചകത്തിൽ തീർപ്പാക്കാതെ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. ദൈവത്തെ സൂചിപ്പിക്കാൻ “അവിടുന്ന്” ഉപയോഗിച്ചു. വാക്യത്തിന്റെ നിഷേധ–വൈരുധ്യഘടനയും ἱλασμός എന്ന പദത്തിലെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തിയും സംരക്ഷിച്ചു.
