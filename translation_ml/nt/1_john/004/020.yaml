id: 1JN.4.20
reference: 1 John 4:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐάν τις εἴπῃ ὅτι Ἀγαπῶ τὸν θεόν, καὶ τὸν ἀδελφὸν αὐτοῦ μισῇ, ψεύστης ἐστίν· ὁ γὰρ μὴ ἀγαπῶν τὸν ἀδελφὸν αὐτοῦ ὃν ἑώρακεν, τὸν θεὸν ὃν οὐχ ἑώρακεν ⸀οὐ δύναται ἀγαπᾶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/020.yaml
  text: If anyone says[a], “I love God,” and hates his brother, he is a liar; for the one who does not love his brother whom he has seen cannot love God whom he has not seen.
translation:
  language: ml
  text: “ഞാൻ ദൈവത്തെ സ്നേഹിക്കുന്നു” എന്ന് ആരെങ്കിലും പറയുകയും തന്റെ സഹോദരനെ[a] വെറുക്കുകയും ചെയ്താൽ, അവൻ കള്ളനാണ്; കാരണം, താൻ കണ്ടിട്ടുള്ള തന്റെ സഹോദരനെ സ്നേഹിക്കാത്തവന് താൻ കണ്ടിട്ടില്ലാത്ത ദൈവത്തെ സ്നേഹിക്കാൻ കഴിയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തന്റെ സഹോദരനെയോ സഹോദരിയെയോ.” ഗ്രീക്കിൽ “തന്റെ സഹോദരനെ” (ἀδελφόν) എന്നാണ്; സന്ദർഭത്തിൽ ഈ പുല്ലിംഗ ഏകവചനരൂപത്തിന് പ്രതിനിധിപരമായ അർഥമുണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τις εἴπῃ
  choice: ആരെങ്കിലും പറയുകയും ... ചെയ്താൽ
  rationale: ἐάν എന്ന നിബന്ധനാസൂചകവും τις എന്ന അനിശ്ചിത സർവനാമവും ചേർന്ന പൊതുവായ നിബന്ധന മലയാളത്തിലെ സ്വാഭാവികമായ ‘ആരെങ്കിലും ... ചെയ്താൽ’ എന്ന ഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: Ἀγαπῶ
  choice: ഞാൻ ... സ്നേഹിക്കുന്നു
  rationale: വർത്തമാനകാല പ്രസ്താവന നേരിട്ട് പരിഭാഷപ്പെടുത്തി; വാക്യത്തിൽ ആവർത്തിക്കുന്ന ἀγαπάω എന്ന ക്രിയയുടെ പദബന്ധവും നിലനിർത്തുന്നു.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: തന്റെ സഹോദരനെ
  rationale: ἀδελφός പുല്ലിംഗ ഏകവചനമാണ്. പ്രധാനപാഠത്തിൽ ഉറവിടത്തിന്റെ രൂപം സംരക്ഷിച്ചുകൊണ്ട്, സന്ദർഭത്തിൽ അത് സഹോദരിയെയും പ്രതിനിധീകരിക്കാവുന്നതാണെന്ന വിവരം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: μισῇ
  choice: വെറുക്കുകയും ചെയ്താൽ
  rationale: നിബന്ധനാവാക്യത്തിലെ വർത്തമാനകാല ക്രിയയുടെ സ്വാഭാവിക മലയാളരൂപം; ‘സ്നേഹിക്കുന്നു’ എന്ന അവകാശവാദത്തോടുള്ള വൈരുധ്യം വ്യക്തമാക്കുന്നു.
- source_word: ψεύστης ἐστίν
  choice: അവൻ കള്ളനാണ്
  rationale: ψεύστης ഒരു വിധേയനാമമായതിനാൽ ‘കള്ളം പറയുന്നു’ എന്ന ക്രിയാരൂപത്തിലേക്ക് മയപ്പെടുത്താതെ യോഹന്നാന്റെ ശക്തമായ നിർണയം നിലനിർത്തുന്നു.
- source_word: ὁ γὰρ μὴ ἀγαπῶν
  choice: കാരണം ... സ്നേഹിക്കാത്തവന്
  rationale: γάρ-ന്റെ വിശദീകരണബന്ധം ‘കാരണം’ കൊണ്ട് വ്യക്തമാക്കുകയും നാമസ്വഭാവമുള്ള കൃദന്തരൂപം ‘സ്നേഹിക്കാത്തവൻ’ എന്നതായി നൽകുകയും ചെയ്യുന്നു.
- source_word: ὃν ἑώρακεν
  choice: താൻ കണ്ടിട്ടുള്ള
  rationale: ἑώρακεν എന്ന പൂർണ്ണകാലത്തിന്റെ പൂർത്തിയായ ദർശനവും ഇപ്പോഴത്തെ പ്രസക്തിയും ‘കണ്ടിട്ടുള്ള’ എന്ന രൂപം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: οὐ δύναται ἀγαπᾶν
  choice: സ്നേഹിക്കാൻ കഴിയില്ല
  rationale: δύναται സൂചിപ്പിക്കുന്ന കഴിവില്ലായ്മയെയോ അസാധ്യതയെയോ ശക്തമായി സംരക്ഷിക്കുന്നു; വെറും പ്രായോഗിക ബുദ്ധിമുട്ടായി ലഘൂകരിക്കുന്നില്ല.
theological_decisions:
- issue: വിശ്വാസസമൂഹത്തിലെ അംഗങ്ങളെ പൊതുവായി സൂചിപ്പിക്കാവുന്ന ἀδελφός എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: സഹോദരൻ
  alternative: സഹോദരനോ സഹോദരിയോ; സഹവിശ്വാസി
  rationale: ഗ്രീക്ക് പദം പുല്ലിംഗ ഏകവചനമായതിനാൽ പ്രധാനപാഠം അതിന്റെ രൂപം നിലനിർത്തുന്നു. എന്നാൽ സന്ദർഭത്തിൽ പ്രതിനിധിപരമായ ഉൾക്കൊള്ളുന്ന പ്രയോഗം സാധ്യമാണെന്നത് അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- issue: οὐ δύναται ἀγαπᾶν എന്നതിന്റെ ശക്തി
  choice: ദൈവത്തെ സ്നേഹിക്കാൻ കഴിയില്ല
  alternative: ദൈവത്തെ സ്നേഹിക്കാൻ കഴിവില്ല
  rationale: യോഹന്നാന്റെ വാദത്തിലെ ധാർമിക-ആത്മീയ അസാധ്യതയെ ശക്തമായി നിലനിർത്തുന്നു; അതിന്റെ ദാർശനിക സ്വഭാവം അധികമായി നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കള്ളനാണ്’, ‘കഴിയില്ല’ എന്നീ ശക്തമായ പ്രയോഗങ്ങൾ മൂലപാഠത്തിന്റെ നിർണായക സ്വരം നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം പ്രസക്തമായ ‘സഹോദരൻ’ എന്ന പദത്തിനു പിന്നാലെ വെക്കുന്നതിനേക്കാൾ മുഴുവൻ വാക്യത്തിന്റെ അവസാനം നൽകിയെങ്കിലും അതിന്റെ വിഷയം അടിക്കുറിപ്പിൽ വ്യക്തമാണ്.
