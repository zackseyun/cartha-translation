  text: സ്നേഹിക്കാത്തവൻ ദൈവത്തെ അറിഞ്ഞിട്ടില്ല[a]; കാരണം ദൈവം സ്നേഹമാണ്.
  philosophy: optimal-equivalence
  footnotes:
