lexical_decisions:
- source_word: ὁ μὴ ἀγαπῶν
  choice: സ്നേഹിക്കാത്തവൻ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ വർത്തമാനകാല കൃദന്തം ഒരു വ്യക്തിയെ പൊതുവായി സൂചിപ്പിക്കുകയും സ്നേഹിക്കാതിരിക്കുന്ന സ്വഭാവമോ തുടരുന്ന നിലയോ പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: ἀγαπῶν / ἀγάπη
  choice: സ്നേഹിക്കുക / സ്നേഹം
  rationale: വാക്യത്തിലെ ക്രിയയ്ക്കും നാമത്തിനും ഇടയിലുള്ള ഒരേ പദകുടുംബബന്ധം മലയാളത്തിലും ദൃശ്യമാക്കുന്നു.
- source_word: οὐκ ἔγνω
  choice: അറിഞ്ഞിട്ടില്ല
  rationale: ἔγνω എന്ന അയോറിസ്റ്റ് ഇവിടെ ദൈവത്തെ അറിയുന്ന ബന്ധത്തിലേക്കു വന്നിട്ടില്ലെന്നതും അതിന്റെ ഇപ്പോഴത്തെ ഫലനിലയും സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ പൂർത്തികാല നിഷേധരൂപം അത് സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: τὸν θεόν / ὁ θεὸς
  choice: ദൈവത്തെ / ദൈവം
  rationale: ആദ്യത്തേത് ക്രിയയുടെ കർമമായും രണ്ടാമത്തേത് സമവാക്യത്തിന്റെ കർത്താവായും നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: ὅτι
  choice: കാരണം
  rationale: മുൻപ്രസ്താവനയ്ക്കുള്ള കാരണം അവതരിപ്പിക്കുന്ന സംയോജകത്തിന്റെ കാരണാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: ἐστίν
  choice: ആണ്
  rationale: ലളിതമായ വർത്തമാനകാല സമവാക്യരൂപം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: “ദൈവം സ്നേഹമാണ്” എന്ന പ്രസ്താവനയുടെ ശക്തി
  choice: ദൈവം സ്നേഹമാണ്
  alternative: ദൈവം സ്നേഹമുള്ളവനാണ്; സ്നേഹമാണ് ദൈവം
  rationale: ഗ്രീക്കിൽ ὁ θεὸς ആണ് കർത്താവും ἀγάπη വിധേയനാമവുമാകുന്നത്. അതിനാൽ ദൈവത്തിന്റെ സ്വഭാവത്തെക്കുറിച്ചുള്ള ശക്തമായ നാമവാക്യം നിലനിർത്തുന്നു; അതിനെ വെറും ‘സ്നേഹമുള്ളവൻ’ എന്നു ദുർബലപ്പെടുത്തുകയോ ‘സ്നേഹമാണ് ദൈവം’ എന്നു തിരിച്ചിടുകയോ ചെയ്യുന്നില്ല.
- issue: ദൈവത്തെ ‘അറിയുക’ എന്നതിന്റെ കാലഭാവവും ബന്ധപരമായ അർഥവും
  choice: ദൈവത്തെ അറിഞ്ഞിട്ടില്ല
  alternative: ദൈവത്തെ അറിയുന്നില്ല; ദൈവത്തെ മനസ്സിലാക്കിയിട്ടില്ല
  rationale: യോഹന്നാന്റെ പ്രയോഗത്തിൽ γινώσκω കേവലം ബൗദ്ധികമായി മനസ്സിലാക്കുന്നതല്ല, ജീവിതത്തിൽ പ്രകടമാകുന്ന ബന്ധപരമായ അറിവിനെയും സൂചിപ്പിക്കുന്നു. ‘അറിഞ്ഞിട്ടില്ല’ എന്നത് ആ അറിവിലേക്കു വന്നിട്ടില്ലെന്ന അയോറിസ്റ്റിന്റെ ഭാവം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘സ്നേഹിക്കാത്തവൻ’ എന്ന പൊതുവായ ഏകവചനരൂപം മൂലപാഠത്തിന്റെ substantival participle സ്വാഭാവികമായി നൽകുന്നു; ‘സ്നേഹിക്കുക/സ്നേഹം’ എന്ന പദബന്ധം ഉദ്ദേശപൂർവം നിലനിർത്തിയിരിക്കുന്നു.
