id: 1JN.4.14
reference: 1 John 4:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἡμεῖς τεθεάμεθα καὶ μαρτυροῦμεν ὅτι ὁ πατὴρ ἀπέσταλκεν τὸν υἱὸν σωτῆρα τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/014.yaml
  text: And we have seen and testify that the Father has sent the Son as the Savior of the world[a].
translation:
  language: ml
  text: ഞങ്ങളും പിതാവ് പുത്രനെ ലോകത്തിന്റെ രക്ഷകനായി അയച്ചിരിക്കുന്നു എന്നു കണ്ടിരിക്കുന്നു; അതിനു സാക്ഷ്യം വഹിക്കുകയും ചെയ്യുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: “പിതാവ് പുത്രനെ, ലോകത്തിന്റെ രക്ഷകനെ, അയച്ചിരിക്കുന്നു.”'
    reason: σωτῆρα τοῦ κόσμου എന്ന അപ്പോസിഷണൽ പ്രയോഗത്തിന്റെ കൂടുതൽ പദാനുപദമായ രൂപം നൽകുന്നു.
lexical_decisions:
- source_word: καὶ ἡμεῖς
  choice: ഞങ്ങൾ
  rationale: വ്യക്തമായ സർവനാമം നൽകുന്ന ഊന്നൽ മലയാളത്തിൽ നിലനിർത്തുന്നു; മുൻസന്ദർഭത്തോടുള്ള καί-യുടെ ബന്ധം സ്വാഭാവികമായ വാക്യപ്രവാഹത്തിലൂടെ പ്രകടമാകുന്നു.
- source_word: τεθεάμεθα
  choice: കണ്ടിരിക്കുന്നു
  rationale: പൂർണ്ണകാലരൂപം സൂചിപ്പിക്കുന്ന, നിലനിൽക്കുന്ന പ്രാധാന്യമുള്ള കാഴ്ചാനുഭവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: μαρτυροῦμεν
  choice: സാക്ഷ്യം വഹിക്കുകയും ചെയ്യുന്നു
  rationale: വർത്തമാനകാലത്തിലെ തുടർന്നുകൊണ്ടിരിക്കുന്ന സാക്ഷ്യപ്രവർത്തനം വ്യക്തമാക്കുകയും ഗൗരവമുള്ളതും പരിചിതവുമായ ബൈബിൾഭാഷ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ὅτι
  choice: എന്നു
  rationale: ഇത് കാരണവാക്യമല്ല, സാക്ഷ്യത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന ഘടകമാണെന്ന് മലയാളത്തിലെ ഉദ്ധരണിപൂരകമായ ‘എന്നു’ വ്യക്തമാക്കുന്നു.
- source_word: ὁ πατήρ
  choice: പിതാവ്
  rationale: യോഹന്നാന്റെ രചനയിലെ ദൈവിക ബന്ധനാമം സ്വാഭാവികവും ആദരപൂർവവുമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἀπέσταλκεν
  choice: അയച്ചിരിക്കുന്നു
  rationale: പൂർത്തിയായ അയക്കലിനും അതിന്റെ തുടരുന്ന പ്രസക്തിക്കും ഗ്രീക്ക് പൂർണ്ണകാലം നൽകുന്ന ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: τὸν υἱόν
  choice: പുത്രനെ
  rationale: ഗ്രീക്കിൽ ഉടമസ്ഥസർവനാമമില്ലാത്തതിനാൽ ‘തന്റെ പുത്രനെ’ എന്നു വികസിപ്പിക്കാതെ ബന്ധനാമം അതേപടി നിലനിർത്തുന്നു.
- source_word: σωτῆρα
  choice: രക്ഷകൻ
  rationale: σωτήρ എന്ന പദത്തിന്റെ സ്ഥാപിതവും വ്യക്തവുമായ മലയാള സമാനപദം; പ്രത്യേക പ്രായശ്ചിത്തസിദ്ധാന്തം ചേർക്കുന്നില്ല.
- source_word: τοῦ κόσμου
  choice: ലോകത്തിന്റെ
  rationale: ജനിറ്റീവ് ബന്ധവും യോഹന്നാനിലെ κόσμος എന്ന പദത്തിന്റെ വിശാലമായ വ്യാപ്തിയും നിലനിർത്തുന്നു.
- source_word: σωτῆρα τοῦ κόσμου
  choice: ലോകത്തിന്റെ രക്ഷകനായി
  rationale: പ്രവചനാത്മക/അപ്പോസിഷണൽ അക്കുസേറ്റീവിന്റെ അർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; കൂടുതൽ പദാനുപദമായ രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: ‘ലോകത്തിന്റെ രക്ഷകൻ’ എന്ന പ്രയോഗത്തിന്റെ വ്യാപ്തി
  choice: വിശാലമായ യോഹന്നാനീയ പ്രയോഗം യാതൊരു ചുരുക്കവും കൂടാതെ നിലനിർത്തി.
  alternative: ‘തിരഞ്ഞെടുക്കപ്പെട്ടവരുടെ രക്ഷകൻ’ അല്ലെങ്കിൽ ‘ലോകത്തിന്റെ സാധ്യതാപരമായ രക്ഷകൻ’
  rationale: ഗ്രീക്ക് പാഠം ‘ലോകത്തിന്റെ രക്ഷകൻ’ എന്നു നേരിട്ട് പറയുന്നു; രക്ഷയുടെ വ്യാപ്തിയെക്കുറിച്ചുള്ള ഏതെങ്കിലും പ്രത്യേക സമ്പ്രദായപരമായ നിഗമനം പരിഭാഷയിൽ ചേർക്കരുത്.
- issue: പിതാവ്–പുത്രൻ ബന്ധഭാഷ
  choice: ‘പിതാവ്’, ‘പുത്രൻ’ എന്നീ ബന്ധനാമങ്ങൾ നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘പിതാവായ ദൈവം യേശുക്രിസ്തുവിനെ’
  rationale: മൂലവാക്യം വ്യക്തിനാമമോ ‘ക്രിസ്തു’ എന്ന പദവിയോ ഉപയോഗിക്കുന്നില്ല; അവ ചേർക്കുന്നത് പാഠത്തെ അനാവശ്യമായി വികസിപ്പിക്കും.
- issue: σωτῆρα എന്ന പദത്തിന്റെ വ്യാകരണബന്ധം
  choice: പ്രധാനവാക്യത്തിൽ ‘രക്ഷകനായി’ എന്നു നൽകി.
  alternative: ‘പുത്രനെ, ലോകത്തിന്റെ രക്ഷകനെ, അയച്ചിരിക്കുന്നു’
  rationale: ഗ്രീക്ക് രൂപം അപ്പോസിഷണൽ അല്ലെങ്കിൽ പ്രവചനാത്മകമായി ഗ്രഹിക്കാവുന്നതാണ്. മലയാളത്തിലെ പ്രധാന പരിഭാഷ സ്വാഭാവികതയ്ക്കായി ‘ആയി’ ഉപയോഗിക്കുന്നു; കൂടുതൽ പദാനുപദമായ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കണ്ടിരിക്കുന്നു’യും ‘അയച്ചിരിക്കുന്നു’യും ഗ്രീക്ക് പൂർണ്ണകാലങ്ങളുടെ തുടരുന്ന പ്രസക്തി സൂചിപ്പിക്കുന്നു. സാക്ഷ്യത്തിന്റെ വർത്തമാനകാല സ്വഭാവം ‘സാക്ഷ്യം വഹിക്കുകയും ചെയ്യുന്നു’ എന്ന രൂപത്തിൽ നിലനിർത്തിയിരിക്കുന്നു; സമ്പ്രദായവിശേഷമായ വ്യാഖ്യാനം ഒന്നും ചേർത്തിട്ടില്ല.
