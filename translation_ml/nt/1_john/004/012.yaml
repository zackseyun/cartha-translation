id: 1JN.4.12
reference: 1 John 4:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: θεὸν οὐδεὶς πώποτε τεθέαται· ἐὰν ἀγαπῶμεν ἀλλήλους, ὁ θεὸς ἐν ἡμῖν μένει καὶ ἡ ἀγάπη αὐτοῦ ⸂ἐν ἡμῖν τετελειωμένη ἐστιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/012.yaml
  text: No one has ever seen God[a]; if we love one another, God remains in us[b], and his love is perfected in us.
translation:
  language: ml
  text: ദൈവത്തെ ആരും ഒരിക്കലും കണ്ടിട്ടില്ല. നാം പരസ്പരം സ്നേഹിക്കുന്നെങ്കിൽ, ദൈവം നമ്മിൽ വസിക്കുന്നു; അവന്റെ സ്നേഹം[a] നമ്മിൽ പൂർണത പ്രാപിച്ചിരിക്കുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ദൈവത്തോടുള്ള നമ്മുടെ സ്നേഹം.’ ‘അവന്റെ സ്നേഹം’ എന്ന ഗ്രീക്ക് പ്രയോഗം ദൈവത്തിന് നമ്മോടുള്ള സ്നേഹത്തെയോ ദൈവത്തോടുള്ള നമ്മുടെ സ്നേഹത്തെയോ സൂചിപ്പിക്കാം; സന്ദർഭം ദൈവത്തിന്റെ സ്നേഹത്തിനാണ് മുൻതൂക്കം നൽകുന്നത്.
    reason: alternative_reading
  - marker: b
    text: അല്ലെങ്കിൽ, ‘നമ്മിൽ സമ്പൂർണമാക്കപ്പെട്ടിരിക്കുന്നു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: τεθέαται
  choice: കണ്ടിട്ടില്ല
  rationale: θεάομαι എന്നത് കാണുക, ദർശിക്കുക എന്ന അർഥം നൽകുന്നു. πώποτε-യോടും നിഷേധത്തോടും ചേർന്നുള്ള പൂർണകാലരൂപത്തിന്റെ വ്യാപകമായ പ്രസ്താവന ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കാൻ ‘കണ്ടിട്ടില്ല’ അനുയോജ്യമാണ്.
- source_word: πώποτε
  choice: ഒരിക്കലും
  rationale: നിഷേധത്തോടൊപ്പം ചേർന്ന് ‘ഏതെങ്കിലും സമയത്ത്’ എന്ന ആശയം ശക്തമാക്കുന്നു; ‘ആരും ഒരിക്കലും കണ്ടിട്ടില്ല’ എന്നത് സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: ἐὰν ἀγαπῶμεν
  choice: നാം ... സ്നേഹിക്കുന്നെങ്കിൽ
  rationale: ἐάν + വർത്തമാനകാല subjunctive ഒരു യഥാർഥ നിബന്ധന അവതരിപ്പിക്കുന്നു. ‘സ്നേഹിക്കുന്നെങ്കിൽ’ നിബന്ധന നിലനിർത്തുന്നു; ക്രിയയുടെ ഭാവം അനാവശ്യമായി വിപുലീകരിക്കുന്നില്ല.
- source_word: ἀλλήλους
  choice: പരസ്പരം
  rationale: പരസ്പരപ്രവർത്തനത്തെ ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്ന പ്രയോഗമാണിത്.
- source_word: μένει
  choice: വസിക്കുന്നു
  rationale: യോഹന്നാന്റെ രചനകളിലെ μένω എന്ന പ്രധാനപദം സ്ഥിരമായ ബന്ധത്തെയും സാന്നിധ്യത്തെയും സൂചിപ്പിക്കുന്നു. ‘നമ്മിൽ വസിക്കുന്നു’ എന്നത് ഈ സന്ദർഭത്തിലെ ദൈവിക അന്തർവാസത്തെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; ‘നിലനിൽക്കുന്നു’ എന്നതിനെക്കാൾ ഇവിടെ വ്യക്തമാണ്.
- source_word: ἀγάπη
  choice: സ്നേഹം
  rationale: ἀγάπη എന്നതിന് സാധാരണവും വ്യക്തവും അന്തസ്സുള്ളതുമായ മലയാളപദം ‘സ്നേഹം’ ആണ്.
- source_word: ἡ ἀγάπη αὐτοῦ
  choice: അവന്റെ സ്നേഹം
  rationale: αὐτοῦ ഇവിടെ ദൈവത്തിൽനിന്നു വരുന്ന സ്നേഹമെന്നോ ദൈവത്തിന്റേതായ സ്നേഹമെന്നോ വായിക്കുന്നതാണ് സമീപസന്ദർഭത്തോട് (വാ. 10–11) കൂടുതൽ യോജിക്കുന്നത്. എങ്കിലും ‘ദൈവത്തോടുള്ള നമ്മുടെ സ്നേഹം’ എന്ന വ്യാകരണസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
- source_word: τετελειωμένη ἐστιν
  choice: പൂർണത പ്രാപിച്ചിരിക്കുന്നു
  rationale: ഈ periphrastic perfect പൂർത്തീകരിക്കപ്പെട്ടതും ഇപ്പോഴും ഫലം നിലനിൽക്കുന്നതുമായ അവസ്ഥയെ സൂചിപ്പിക്കുന്നു. ‘പൂർണത പ്രാപിച്ചിരിക്കുന്നു’ ആ അർഥം സ്വാഭാവികമായി നൽകുകയും τελειόω-യുമായുള്ള പദബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐν ἡμῖν
  choice: നമ്മിൽ
  rationale: വാക്യത്തിലെ രണ്ടിടത്തും ἐν ἡμῖν എന്നത് ഒരേവിധം ‘നമ്മിൽ’ എന്നു പരിഭാഷപ്പെടുത്തി. μένει-യോടു ചേർന്നുള്ള അന്തർവാസപ്രമേയം കണക്കിലെടുക്കുമ്പോൾ ‘നമ്മുടെ ഇടയിൽ’ എന്നതിനെക്കാൾ ഇത് യോജിക്കുന്നു.
theological_decisions:
- issue: ἡ ἀγάπη αὐτοῦ (‘അവന്റെ സ്നേഹം’) എന്നതിന്റെ അർഥം
  choice: ദൈവത്തിന്റെ സ്നേഹം നമ്മിൽ പൂർണത പ്രാപിക്കുന്നു
  alternative: ദൈവത്തോടുള്ള നമ്മുടെ സ്നേഹം നമ്മിൽ പൂർണത പ്രാപിക്കുന്നു
  rationale: സമീപസന്ദർഭം ദൈവത്തിന്റെ മുൻകൈയെടുക്കുന്ന സ്നേഹത്തെ ഊന്നിപ്പറയുന്നതിനാൽ (വാ. 10–11), subjective/possessive genitive വായനയ്ക്കാണ് മുൻതൂക്കം. എങ്കിലും objective genitive എന്ന യഥാർഥ വ്യാകരണസാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും അന്തസ്സുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. പരമ്പരാഗതമായെങ്കിലും സാധാരണ വായനക്കാർക്ക് അപരിചിതമാകാവുന്ന പദങ്ങൾ ഒഴിവാക്കി. മുഖ്യവാക്യത്തിലെ ദൈവിക അന്തർവാസവും സ്നേഹത്തിന്റെ പൂർത്തീകരണവും വ്യക്തമായി സൂക്ഷിച്ചു; യഥാർഥ വ്യാകരണ-ദൈവശാസ്ത്രപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
