id: 1JN.4.1
reference: 1 John 4:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀγαπητοί, μὴ παντὶ πνεύματι πιστεύετε, ἀλλὰ δοκιμάζετε τὰ πνεύματα εἰ ἐκ τοῦ θεοῦ ἐστιν, ὅτι πολλοὶ ψευδοπροφῆται ἐξεληλύθασιν εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/001.yaml
  text: Beloved[a], do not believe every spirit, but test the spirits to see whether they are from God[b], because many false prophets have gone out into the world.
translation:
  language: ml
  text: പ്രിയപ്പെട്ടവരേ[a], എല്ലാ ആത്മാവിനെയും വിശ്വസിക്കരുത്; പകരം, ആത്മാക്കൾ ദൈവത്തിൽനിന്നുള്ളവയാണോ എന്ന് പരിശോധിക്കുക[b]. കാരണം അനേകം വ്യാജപ്രവാചകന്മാർ ലോകത്തിലേക്കു പുറപ്പെട്ടിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സ്നേഹിതരേ.’ ഗ്രീക്കിലെ സംബോധനയുടെ അക്ഷരാർഥം ‘സ്നേഹിക്കപ്പെട്ടവരേ’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അതായത്, പ്രവാചക അവകാശവാദങ്ങൾക്കു പിന്നിലെ ആത്മീയ ഉറവിടം പരിശോധിക്കുക; തുടർന്നുള്ള വാക്യഭാഗം മനുഷ്യ ഏജന്റുമാരായ ‘വ്യാജപ്രവാചകന്മാരെ’ പരാമർശിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: പ്രിയപ്പെട്ടവരേ
  rationale: സ്നേഹപൂർവമായ ബഹുവചന സംബോധന സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ἀγαπάω/ἀγάπη എന്ന പദകുടുംബത്തിന്റെ സ്നേഹാർഥവും നിലനിർത്തുന്നു.
- source_word: παντὶ πνεύματι
  choice: എല്ലാ ആത്മാവിനെയും
  rationale: മനുഷ്യരായ ഉപദേഷ്ടാക്കളായി മാത്രം ചുരുക്കാതെ, പ്രവാചക അവകാശവാദങ്ങൾക്കു പിന്നിലെ ആത്മീയ ഉറവിടങ്ങളെ സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിന്റെ ഭാഷ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: πιστεύετε
  choice: വിശ്വസിക്കരുത്
  rationale: μή സഹിതമുള്ള വർത്തമാനകാല ആജ്ഞ പൊതുവായ വിലക്ക് നൽകുന്നു; അവകാശവാദങ്ങളെ സത്യമെന്നു സ്വീകരിക്കരുതെന്ന ആശയത്തിന് ‘വിശ്വസിക്കുക’ യോജിക്കുന്നു.
- source_word: δοκιμάζετε
  choice: പരിശോധിക്കുക
  rationale: യഥാർഥത നിർണയിക്കാൻ പരീക്ഷിച്ചറിയുക എന്ന വിലയിരുത്തൽബലം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τὰ πνεύματα
  choice: ആത്മാക്കൾ
  rationale: അതീന്ദ്രിയവും ആത്മീയവുമായ ചട്ടക്കൂട് നിലനിർത്തുകയും ‘വ്യാജപ്രവാചകന്മാർ’ എന്ന തുടർപരാമർശത്തിൽനിന്ന് മനുഷ്യ ഏജന്റുമാരെയും ആത്മീയ ഉറവിടങ്ങളെയും വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: εἰ ἐκ τοῦ θεοῦ ἐστιν
  choice: ദൈവത്തിൽനിന്നുള്ളവയാണോ എന്ന്
  rationale: ἐκ സൂചിപ്പിക്കുന്ന ഉറവിടം കൃത്യമായി നൽകുന്നു; ബഹുവചന മുൻപദത്തോട് മലയാളത്തിൽ സ്വാഭാവികമായി പൊരുത്തപ്പെടുത്തുന്നു.
- source_word: πολλοὶ ψευδοπροφῆται
  choice: അനേകം വ്യാജപ്രവാചകന്മാർ
  rationale: സംയുക്തപദത്തിന്റെ നേരിട്ടുള്ളതും സ്ഥാപിതവുമായ മലയാള പരിഭാഷ.
- source_word: ἐξεληλύθασιν
  choice: പുറപ്പെട്ടിരിക്കുന്നു
  rationale: പൂർണ്ണകാലത്തിന്റെ പൂർത്തിയായ പ്രവൃത്തിയും ഇപ്പോഴും തുടരുന്ന ഫലവും മലയാളത്തിലെ ഈ രൂപം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: εἰς τὸν κόσμον
  choice: ലോകത്തിലേക്കു
  rationale: κόσμος എന്നതിനെ അനാവശ്യമായി ‘ലോകവ്യവസ്ഥ’ എന്നു വ്യാഖ്യാനിക്കാതെ അതിന്റെ വിശാലത നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘ആത്മാക്കൾ’ എന്നതിന്റെ സൂചകം
  choice: മനുഷ്യപ്രവാചകരിലൂടെ പ്രകടമാകുന്ന പ്രവാചക അവകാശവാദങ്ങൾക്കു പിന്നിലെ യഥാർഥ ആത്മാക്കൾ/ആത്മീയ ഉറവിടങ്ങൾ
  alternative: മനുഷ്യ ഉപദേഷ്ടാക്കൾ മാത്രം, അല്ലെങ്കിൽ അമൂർത്തമായ പ്രവാചക പ്രസ്താവനകൾ
  rationale: മൂലപാഠം ‘ആത്മാക്കൾ’ എന്നും തുടർന്ന് ‘വ്യാജപ്രവാചകന്മാർ’ എന്നും വേർതിരിച്ചു പറയുന്നു. അതിനാൽ മനുഷ്യ ഏജന്റുമാരെ ആത്മീയ ഉറവിടങ്ങളുമായി ഒറ്റപ്പെടുത്താതെ പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും അതീന്ദ്രിയ ഭാഷയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘പ്രിയപ്പെട്ടവരേ’ സ്നേഹപൂർവമായ യോഹന്നാനീയ സംബോധന നിലനിർത്തുന്നു. ‘ആത്മാവ്/ആത്മാക്കൾ’ എന്ന നേരിട്ടുള്ള പദപ്രയോഗം വ്യാഖ്യാനപരമായ ചുരുക്കം ഒഴിവാക്കുന്നു.
