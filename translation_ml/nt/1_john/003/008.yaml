id: 1JN.3.8
reference: 1 John 3:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ ποιῶν τὴν ἁμαρτίαν ἐκ τοῦ διαβόλου ἐστίν, ὅτι ἀπ’ ἀρχῆς ὁ διάβολος ἁμαρτάνει. εἰς τοῦτο ἐφανερώθη ὁ υἱὸς τοῦ θεοῦ ἵνα λύσῃ τὰ ἔργα τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/008.yaml
  text: 'The one who practices sin is from the devil[a], because the devil has been sinning from the beginning[d][c][b]. For this purpose the Son of God was revealed: to destroy the works of the devil.'
translation:
  language: ml
  text: 'പാപം ചെയ്തുകൊണ്ടിരിക്കുന്നവൻ[a] പിശാചിൽനിന്നുള്ളവനാണ്[b]; കാരണം പിശാച് ആരംഭംമുതൽ പാപം ചെയ്തുകൊണ്ടിരിക്കുന്നു. ഇതിനായിട്ടാണ് ദൈവപുത്രൻ വെളിപ്പെട്ടത്[c]: പിശാചിന്റെ പ്രവൃത്തികളെ തകർക്കാൻ[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പാപം ചെയ്യുന്നവൻ’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്കിലെ വർത്തമാനകാല കൃദന്തരൂപം ഒറ്റപ്പെട്ട ഒരു പ്രവൃത്തിയെക്കാൾ തുടരുന്നതോ സ്വഭാവസവിശേഷമോ ആയ പാപപ്രവൃത്തിയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘പിശാചിൽനിന്നുള്ളവൻ.’ ഇവിടെ ‘നിന്ന്’ എന്നത് ധാർമിക-ആത്മീയ ഉറവിടത്തെയോ പക്ഷചേരലിനെയോ സൂചിപ്പിക്കുന്നു.
    reason: alternative_reading
  - marker: c
    text: ‘പ്രത്യക്ഷനായി’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്ക് പദം പ്രത്യക്ഷപ്പെടലിനെയും വെളിവാകലിനെയും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: d
    text: ‘അഴിച്ചുകളയാൻ’ അഥവാ ‘ഇല്ലാതാക്കാൻ’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്ക് ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘അഴിക്കുക’ എന്നാണ്; ഇവിടെ അത് തകർക്കുക, പൊളിച്ചുകളയുക എന്ന വിപുലമായ അർഥത്തിലാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ποιῶν τὴν ἁμαρτίαν
  choice: പാപം ചെയ്തുകൊണ്ടിരിക്കുന്നവൻ
  rationale: വർത്തമാനകാല കൃദന്തരൂപം തുടരുന്ന അഥവാ സ്വഭാവസവിശേഷമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ഒറ്റപ്പെട്ട ഒരു പാപപ്രവൃത്തിയെന്ന അർഥത്തിലേക്ക് വാചകത്തെ ചുരുക്കാതെ, ഗ്രീക്കിലെ തുടർച്ചയുടെ ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐκ τοῦ διαβόλου
  choice: പിശാചിൽനിന്നുള്ളവനാണ്
  rationale: ἐκ സൂചിപ്പിക്കുന്ന ഉറവിടം അഥവാ ധാർമിക-ആത്മീയ ബന്ധം ‘നിന്നുള്ളവൻ’ എന്ന പ്രയോഗം നിലനിർത്തുന്നു; പിശാചിൽനിന്നുള്ള അക്ഷരാർഥത്തിലുള്ള ജനനം ഇതിലൂടെ സൂചിപ്പിക്കുന്നില്ല.
- source_word: ὁ διάβολος
  choice: പിശാച്
  rationale: ഈ സന്ദർഭത്തിൽ διάβολος സാത്താന്റെ സ്ഥിരമായ വ്യക്തിനാമസൂചനയാണ്; അതിനാൽ ‘അപവാദി’ എന്ന പദാർഥപരമായ വിവർത്തനത്തേക്കാൾ ‘പിശാച്’ വ്യക്തവും പതിവുമാണ്.
- source_word: ἀπ’ ἀρχῆς
  choice: ആരംഭംമുതൽ
  rationale: യോഹന്നാന്റെ വിശാലമായ കാല-ദൈവശാസ്ത്ര പ്രതിധ്വനി നിലനിർത്തുന്നു; ഏത് ആരംഭമെന്ന് വാക്യം വ്യക്തമാക്കാത്തതിനാൽ വിവർത്തനവും അത് നിർണയിക്കുന്നില്ല.
- source_word: ἁμαρτάνει
  choice: പാപം ചെയ്തുകൊണ്ടിരിക്കുന്നു
  rationale: ആരംഭംമുതൽ തുടരുന്ന സ്വഭാവസവിശേഷ പ്രവർത്തനത്തെ ഗ്രീക്കിലെ വർത്തമാനകാലം സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ തുടർച്ചാരൂപം ആ ദൈർഘ്യഭാവം വ്യക്തമാക്കുന്നു.
- source_word: εἰς τοῦτο
  choice: ഇതിനായിട്ടാണ്
  rationale: തുടർന്നുവരുന്ന ἵνα ഉദ്ദേശ്യവാക്യത്തിലേക്ക് വിരൽചൂണ്ടുന്ന പ്രയോഗമാണ്; ‘ഇതിനായിട്ടാണ്’ അതിന്റെ ലക്ഷ്യഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐφανερώθη
  choice: വെളിപ്പെട്ടത്
  rationale: പ്രത്യക്ഷപ്പെടലിനോടൊപ്പം വ്യക്തിത്വവും ദൗത്യവും വെളിവാകുന്ന യോഹന്നാനീയ manifestation ഭാഷ നിലനിർത്തുന്നു.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: ദൈവപുത്രൻ
  rationale: ക്രിസ്തുവിനെക്കുറിച്ചുള്ള പുത്രത്വപദവി കൃത്യമായും പതിവായും അവതരിപ്പിക്കുന്നു.
- source_word: ἵνα λύσῃ
  choice: തകർക്കാൻ
  rationale: λύω എന്നതിന്റെ അടിസ്ഥാനഭാവം അഴിക്കുക എന്നാണെങ്കിലും, പിശാചിന്റെ പ്രവൃത്തികൾ എന്ന കർമത്തോടൊപ്പം അവയെ നിർണായകമായി പൊളിച്ചുകളയുക അഥവാ നിഷ്ഫലമാക്കുക എന്ന അർഥമാണ്. ‘തകർക്കാൻ’ ആ ശക്തിയും രൂപകവും സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: τὰ ἔργα τοῦ διαβόλου
  choice: പിശാചിന്റെ പ്രവൃത്തികൾ
  rationale: ബഹുവചനവും ജനിറ്റീവ് ബന്ധവും നേരിട്ട് സംരക്ഷിക്കുന്ന, പിശാചിന്റെ പ്രവർത്തനങ്ങളെയും അവയുടെ ഫലങ്ങളെയും ഉൾക്കൊള്ളാവുന്ന വിശാലമായ പ്രയോഗമാണിത്.
theological_decisions:
- issue: യോഹന്നാനീയ പാപഭാഷയിലെ വർത്തമാനകാലത്തിന്റെ ശക്തി
  choice: 'തുടരുന്നതോ സ്വഭാവസവിശേഷമോ ആയ പ്രവൃത്തി: ‘പാപം ചെയ്തുകൊണ്ടിരിക്കുന്നവൻ’'
  alternative: ഏതെങ്കിലും ഒറ്റപ്പെട്ട പാപപ്രവൃത്തിയെക്കുറിച്ചുള്ള നിരുപാധിക പ്രസ്താവന
  rationale: വർത്തമാനകാല കൃദന്തരൂപം തുടരുന്ന/സ്വഭാവസവിശേഷമായ പ്രവർത്തിക്ക് ഇടം നൽകുന്നു. 1 യോഹന്നാൻ 1:8–2:2-ൽ വിശ്വാസികളും പാപം ചെയ്യുന്നുവെന്ന അംഗീകാരവുമായി ഈ വാക്യത്തിനുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷം ഇല്ലാതാക്കാതെ നിലനിർത്തുന്നു.
- issue: ‘പിശാചിൽനിന്നുള്ളവൻ’ എന്നതിന്റെ അർഥം
  choice: ധാർമിക-ആത്മീയ ഉറവിടമോ പക്ഷചേരലോ
  alternative: പിശാചിൽനിന്നുള്ള അക്ഷരാർഥത്തിലുള്ള ഉത്ഭവം അഥവാ ജനനം
  rationale: യോഹന്നാനീയ ദ്വന്ദ്വഭാഷയിൽ ഈ പ്രയോഗം നൈതികവും ആത്മീയവുമായ ബന്ധം സൂചിപ്പിക്കുന്നു. ‘നിന്നുള്ളവൻ’ ഉറവിടരൂപകം സംരക്ഷിക്കുമ്പോഴും ശാരീരികമോ സത്താപരമോ ആയ ജനനം പ്രസ്താവിക്കുന്നില്ല.
- issue: ദൈവപുത്രൻ വെളിപ്പെട്ടതിന്റെ ഉദ്ദേശ്യം
  choice: പിശാചിന്റെ പ്രവൃത്തികളെ തകർക്കുക
  alternative: പിശാചിന്റെ പ്രവൃത്തികളെ വെറും വെളിപ്പെടുത്തുക
  rationale: ἵνα + aorist subjunctive വ്യക്തമായ ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു; λύσῃ ഇവിടെ പ്രവൃത്തികളെ നിർണായകമായി അഴിക്കുക, പൊളിക്കുക, നിഷ്ഫലമാക്കുക എന്നതാണ്, വെറും തുറന്നുകാട്ടുക എന്നല്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, ഗൗരവമുള്ള ശൈലി. ‘പാപം ചെയ്തുകൊണ്ടിരിക്കുന്നവൻ’ എന്ന തുടർച്ചാരൂപം വ്യാഖ്യാനം അതിയായി ഉറപ്പിക്കാതെ ഗ്രീക്കിലെ aspect പ്രകടമാക്കുന്നു. ‘ഇതിനായിട്ടാണ് ... :’ എന്ന ഘടന εἰς τοῦτο മുന്നിലുള്ള ഉദ്ദേശ്യവാക്യത്തിലേക്ക് ചൂണ്ടുന്നതു വ്യക്തമാക്കുന്നു.
