id: 1JN.3.14
reference: 1 John 3:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἡμεῖς οἴδαμεν ὅτι μεταβεβήκαμεν ἐκ τοῦ θανάτου εἰς τὴν ζωήν, ὅτι ἀγαπῶμεν τοὺς ἀδελφούς· ὁ μὴ ⸀ἀγαπῶν μένει ἐν τῷ θανάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/014.yaml
  text: We know that we have passed from death into life[a], because we love the brothers. The one who does not love remains in death.
translation:
  language: ml
  text: നാം മരണത്തിൽനിന്ന് ജീവനിലേക്ക് കടന്നിരിക്കുന്നു എന്നു നാം അറിയുന്നു; കാരണം, നാം സഹോദരന്മാരെ[a] സ്നേഹിക്കുന്നു. സ്നേഹിക്കാത്തവൻ മരണത്തിൽ തുടരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സഹോദരീസഹോദരന്മാരെ’ എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്കിൽ ‘സഹോദരന്മാർ’ എന്നാണ്, എന്നാൽ ഈ സന്ദർഭത്തിൽ അത് പൊതുവേ സഹവിശ്വാസികളെ സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδαμεν
  choice: നാം അറിയുന്നു
  rationale: οἶδα എന്ന പൂർണരൂപം കൊയ്നേ ഗ്രീക്കിൽ വർത്തമാനകാല നിലയെ സൂചിപ്പിക്കുന്നു; അതിനാൽ സ്വാഭാവികമായ മലയാളം ‘നാം അറിയുന്നു’ എന്നാണ്.
- source_word: μεταβεβήκαμεν
  choice: കടന്നിരിക്കുന്നു
  rationale: പൂർണകാലം പൂർത്തിയായ മാറ്റത്തെയും അതിന്റെ ഇപ്പോഴും തുടരുന്ന ഫലത്തെയും സൂചിപ്പിക്കുന്നു; ‘കടന്നിരിക്കുന്നു’ ഈ രണ്ടും നിലനിർത്തുന്നു.
- source_word: ἐκ τοῦ θανάτου εἰς τὴν ζωήν
  choice: മരണത്തിൽനിന്ന് ജീവനിലേക്ക്
  rationale: ἐκ...εἰς ഒരു മേഖലയ്ക്ക് പുറത്തുനിന്ന് മറ്റൊന്നിന്റെ ഉള്ളിലേക്കുള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘മരണത്തിൽനിന്ന് ജീവനിലേക്ക്’ ആ ദിശാഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀγαπῶμεν
  choice: നാം ... സ്നേഹിക്കുന്നു
  rationale: വർത്തമാനകാല സൂചകക്രിയ തുടർച്ചയായ സ്വഭാവപ്രകടനത്തെ സൂചിപ്പിക്കുന്നു; ‘സ്നേഹിക്കുന്നു’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: τοὺς ἀδελφούς
  choice: സഹോദരന്മാരെ
  rationale: ഗ്രീക്കിലെ പദം വ്യാകരണപരമായി പുല്ലിംഗ ബഹുവചനമാണ്; മുഖ്യപാഠത്തിൽ അത് നിലനിർത്തി, സന്ദർഭത്തിലെ ഉൾക്കൊള്ളുന്ന സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὁ μὴ ἀγαπῶν
  choice: സ്നേഹിക്കാത്തവൻ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ വർത്തമാന കൃദന്തം ഇങ്ങനെ സ്വഭാവമുള്ള ഏതൊരാളെയും പൊതുവായി സൂചിപ്പിക്കുന്നു; ‘സ്നേഹിക്കാത്തവൻ’ മലയാളത്തിൽ സംക്ഷിപ്തവും വ്യക്തവുമാണ്.
- source_word: μένει
  choice: തുടരുന്നു
  rationale: μένω തുടരുന്ന നിലയെ സൂചിപ്പിക്കുന്നു; ഇവിടെ ‘തുടരുന്നു’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മരണത്തിനുള്ളിലെ തുടർനിലയെ കൃത്യമായി അറിയിക്കുന്നതുമാണ്.
- source_word: ἐν τῷ θανάτῳ
  choice: മരണത്തിൽ
  rationale: മരണത്തിന്റെ മേഖലയിലുള്ള നില എന്ന രൂപകം വ്യാഖ്യാനവിപുലീകരണമില്ലാതെ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἀδελφοί എന്ന പദത്തിന്റെ സൂച്യവും ലിംഗവ്യാപ്തിയും
  choice: മുഖ്യപാഠത്തിൽ ‘സഹോദരന്മാർ’; വിശ്വാസസമൂഹത്തിലെ സ്ത്രീകളെയും ഉൾക്കൊള്ളാൻ സാധ്യതയുണ്ടെന്ന് അടിക്കുറിപ്പ്.
  alternative: സഹോദരീസഹോദരന്മാർ / സഹവിശ്വാസികൾ
  rationale: ഗ്രീക്ക് രൂപം പുല്ലിംഗ ബഹുവചനമാണെങ്കിലും യോഹന്നാന്റെ സന്ദർഭത്തിൽ അത് വിശ്വാസികളെ പൊതുവായി സൂചിപ്പിക്കാൻ സാധ്യതയുണ്ട്. മുഖ്യപാഠം ഉറവിടരൂപം നിലനിർത്തുകയും അടിക്കുറിപ്പ് സന്ദർഭപരമായ വ്യാപ്തി അറിയിക്കുകയും ചെയ്യുന്നു.
- issue: ‘മരണം’, ‘ജീവൻ’ എന്നിവയുടെ സ്വഭാവം
  choice: വ്യാഖ്യാനവിപുലീകരണമില്ലാതെ ‘മരണം’, ‘ജീവൻ’ എന്നു നിലനിർത്തി.
  alternative: ആത്മീയമരണത്തിൽനിന്ന് നിത്യജീവനിലേക്ക് / മരണത്തിന്റെ മേഖലയിൽനിന്ന് ജീവന്റെ മേഖലയിലേക്ക്
  rationale: വാക്യം ആഴമുള്ള ദൈവശാസ്ത്രപരമായ മാറ്റം സൂചിപ്പിക്കുന്നുവെങ്കിലും ഗ്രീക്ക് പാഠം അതിനെ സംക്ഷിപ്തമായ രൂപകമായി അവതരിപ്പിക്കുന്നു. അധിക നിർവചനം ചേർക്കാതെ ആ അർത്ഥസാന്ദ്രതയും സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിന്റെ കാരണബന്ധം നിലനിർത്തി; ‘മരണം/ജീവൻ’ എന്ന രൂപകം വിശദീകരിച്ച് ചുരുക്കാതെ സംരക്ഷിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം ‘സഹോദരന്മാരെ’ എന്ന പദത്തോട് നേരിട്ട് ചേർത്താൽ അതിന്റെ പരിധി കൂടുതൽ വ്യക്തമാകുമെങ്കിലും നൽകിയ ഇംഗ്ലീഷ് മാതൃകയിലെ സ്ഥാനത്തെ അനുകരിക്കാതെ, മലയാളവാക്യത്തിൽ ചിഹ്നം പ്രസ്താവനയ്ക്കു ശേഷമാണ് വെച്ചിരിക്കുന്നത്.
