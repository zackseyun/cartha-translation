source:
  edition: SBLGNT
  text: Ὅτι αὕτη ἐστὶν ἡ ἀγγελία ἣν ἠκούσατε ἀπ’ ἀρχῆς, ἵνα ἀγαπῶμεν ἀλλήλους·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/011.yaml
  text: 'For this is the message that you have heard from the beginning: that we should love one another[a][b].'
translation:
  language: ml
  text: 'എന്തെന്നാൽ, നിങ്ങൾ ആദിമുതൽ കേട്ടിട്ടുള്ള[a] സന്ദേശം ഇതാണ്: നാം പരസ്പരം സ്നേഹിക്കണം.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങൾ ആദിമുതൽ കേട്ട.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നാം പരസ്പരം സ്നേഹിക്കേണ്ടതിനായി’ അല്ലെങ്കിൽ ‘നമുക്ക് പരസ്പരം സ്നേഹിക്കാം.’
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅτι
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തെ വിശദീകരിക്കുന്ന ὅτιയുടെ ഭാവം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: αὕτη ἐστὶν ἡ ἀγγελία
  choice: സന്ദേശം ഇതാണ്
  rationale: നേരിട്ടുള്ള ഗ്രീക്ക് ഘടനയും ഊന്നലും നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കാം.
- source_word: ἣν ἠκούσατε ἀπ’ ἀρχῆς
  choice: നിങ്ങൾ ആദിമുതൽ കേട്ടിട്ടുള്ള
  rationale: മുമ്പ് സ്വീകരിച്ച സന്ദേശത്തിന്റെ ഇപ്പോഴും നിലനിൽക്കുന്ന പ്രസക്തി മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; ഗ്രീക്കിലെ ἀπ’ ἀρχῆς എന്ന യോഹന്നാനീയ പ്രയോഗത്തിന് ‘ആദിമുതൽ’ എന്ന ഏകോപിത രൂപം നൽകുന്നു.
- source_word: ἵνα ἀγαπῶμεν
  choice: നാം ... സ്നേഹിക്കണം
  rationale: ἵνα ചേർന്ന വർത്തമാനകാല subjunctive ഇവിടെ സന്ദേശത്തിന്റെ നൈതിക ഉള്ളടക്കം അറിയിക്കുന്നു. ‘സ്നേഹിക്കണം’ അതിലെ കർത്തവ്യഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἀλλήλους
  choice: പരസ്പരം
  rationale: സമൂഹത്തിനുള്ളിലെ അന്യോന്യബന്ധം സൂചിപ്പിക്കുന്ന, വ്യക്തവും സാധാരണവുമായ മലയാളപ്രയോഗം.
theological_decisions:
- issue: ἵνα ἀγαπῶμεν ἀλλήλους എന്നതിന്റെ പ്രയോഗശക്തി
  choice: സന്ദേശത്തിന്റെ നൈതിക ഉള്ളടക്കമായി ‘നാം പരസ്പരം സ്നേഹിക്കണം’
  alternative: ‘നാം പരസ്പരം സ്നേഹിക്കേണ്ടതിന്’ അല്ലെങ്കിൽ ‘നമുക്ക് പരസ്പരം സ്നേഹിക്കാം’
  rationale: സന്ദേശത്തിന്റെ ഉള്ളടക്കമാണ് മുഖ്യമായി പ്രസ്താവിക്കപ്പെടുന്നത്. അതേസമയം ἵναയ്ക്ക് ഉദ്ദേശ്യാർഥമോ പ്രബോധനാർഥമോ നൽകാവുന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച മാന്യമായ ശൈലി. ‘ആദിമുതൽ,’ ‘സന്ദേശം,’ ‘പരസ്പരം സ്നേഹിക്കണം’ എന്നീ പദപ്രയോഗങ്ങൾ യോഹന്നാനീയ ആശയഭാരവും സ്വാഭാവികതയും ഒരുമിച്ച് നിലനിർത്തുന്നു.
