id: 1JN.3.1
reference: 1 John 3:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἴδετε ποταπὴν ἀγάπην δέδωκεν ἡμῖν ὁ πατὴρ ἵνα τέκνα θεοῦ κληθῶμεν, ⸂καὶ ἐσμέν⸃. διὰ τοῦτο ὁ κόσμος οὐ γινώσκει ⸀ἡμᾶς ὅτι οὐκ ἔγνω αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/001.yaml
  text: See what kind of love the Father has given to us[a], that we should be called children of God—and we are. For this reason the world does not know us[e][d][c][b], because it did not know him.
translation:
  language: ml
  text: നാം ദൈവത്തിന്റെ മക്കൾ എന്നു വിളിക്കപ്പെടേണ്ടതിന് പിതാവ് നമുക്ക് എങ്ങനെയുള്ള സ്നേഹമാണ് നൽകിയിരിക്കുന്നതെന്ന് നോക്കൂ[a]. നാം അങ്ങനെയാണ്[b]. ഇക്കാരണത്താൽ ലോകം നമ്മെ അറിയുന്നില്ല, കാരണം അത് അവനെ അറിഞ്ഞില്ല[c][d][e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “പിതാവ് നമുക്ക് എത്ര വലിയ സ്നേഹമാണ് നൽകിയിരിക്കുന്നതെന്ന്.” ഗ്രീക്ക് പ്രയോഗം സ്നേഹത്തിന്റെ അളവിനേക്കാൾ അതിന്റെ സ്വഭാവത്തെക്കുറിച്ചുള്ള വിസ്മയത്തിന് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ “നാം അങ്ങനെയാണ്” എന്ന വാക്കുകൾ ഇല്ല.
    reason: textual_variant
  - marker: c
    text: “ലോകം നമ്മെ തിരിച്ചറിയുന്നില്ല” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: d
    text: “അവനെ” എന്നത് ഈ വാക്യത്തിൽ ഏറ്റവും സ്വാഭാവികമായി പിതാവിനെ സൂചിപ്പിക്കുന്നു; യോഹന്നാന്റെ വിശാലമായ സന്ദർഭത്തിൽ അത് ക്രിസ്തുവിനെ സൂചിപ്പിക്കുന്നതായി ചിലർ മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
  - marker: e
    text: '“ഇക്കാരണത്താൽ ലോകം നമ്മെ അറിയുന്നില്ല: അത് അവനെ അറിഞ്ഞില്ല” എന്നും വാക്യം വായിക്കാം.'
    reason: previous_rendering
lexical_decisions:
- source_word: ἴδετε
  choice: നോക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ബഹുവചന ആജ്ഞയാണ്; പഴഞ്ചനായ ഭാവമില്ലാതെ നേരിട്ടുള്ള ആഹ്വാനം നിലനിർത്തുന്നു.
- source_word: ποταπὴν ἀγάπην
  choice: എത്ര അത്ഭുതകരമായ സ്നേഹം
  rationale: ποταπός വെറും അളവിനേക്കാൾ സ്നേഹത്തിന്റെ സ്വഭാവത്തെക്കുറിച്ചുള്ള വിസ്മയം പ്രകടിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായി ആ ഗുണപരമായ ആശ്ചര്യം എത്തിക്കാൻ ഈ പ്രയോഗം തിരഞ്ഞെടുത്തു; പദശഃ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: δέδωκεν
  choice: നൽകിയിരിക്കുന്നു
  rationale: ഭൂതകാല പ്രവൃത്തിയുടെ നിലനിൽക്കുന്ന ഫലം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പൂർണ്ണകാലത്തിന്റെ ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: ὁ πατὴρ
  choice: പിതാവ്
  rationale: യോഹന്നാന്റെ പ്രയോഗത്തിൽ ദൈവത്തെ സൂചിപ്പിക്കുന്ന നിശ്ചിത വിശേഷനാമസദൃശ പദം.
- source_word: τέκνα θεοῦ
  choice: ദൈവത്തിന്റെ മക്കൾ
  rationale: τέκνα ലിംഗസമാവേശിയായ ‘മക്കൾ’ എന്നാണ്; ‘പുത്രന്മാർ’ എന്നു ചുരുക്കുന്നില്ല.
- source_word: κληθῶμεν
  choice: വിളിക്കപ്പെടണം
  rationale: ἵνα-യോടുകൂടിയ കർമണി സുബ്ജങ്ക്റ്റീവിന്റെ ഉദ്ദേശ്യ/ഫലഭാവം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അനിശ്ചിതത്വം സൂചിപ്പിക്കുന്നില്ല.
- source_word: καὶ ἐσμέν
  choice: നാം അങ്ങനെതന്നെയാണ്
  rationale: പേരിൽ മാത്രം അല്ല, യാഥാർഥ്യത്തിലും ദൈവത്തിന്റെ മക്കളാണെന്ന ഗ്രീക്കിലെ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: διὰ τοῦτο
  choice: അതുകൊണ്ടാണ്
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞതുമായി തുടർന്നുള്ള പ്രസ്താവനയുടെ കാരണബന്ധം സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: ὁ κόσμος
  choice: ലോകം
  rationale: യോഹന്നാന്റെ ആശയലോകത്തിൽ പ്രത്യേക നൈതിക അർഥസാധ്യത ഉണ്ടെങ്കിലും, മുഖ്യപാഠത്തിൽ ഗ്രീക്കിലെ രൂപകം വ്യാഖ്യാനിച്ച് മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: οὐ γινώσκει ἡμᾶς
  choice: നമ്മെ അറിയാത്തത്
  rationale: γινώσκωയുടെ അടിസ്ഥാനമായ ‘അറിയുക’ എന്ന അർഥവും തുടർന്നുള്ള സമാന്തരപ്രയോഗവും സംരക്ഷിക്കുന്നു; ‘തിരിച്ചറിയുക’ എന്ന സാധ്യത അടിക്കുറിപ്പിലുണ്ട്.
- source_word: ὅτι οὐκ ἔγνω αὐτόν
  choice: കാരണം അത് അവനെ അറിഞ്ഞില്ല
  rationale: ὅτιയുടെ കാരണാർഥവും വർത്തമാനകാല/ഭൂതകാല വ്യത്യാസവും നിലനിർത്തുന്നു; αὐτόν ആരെ സൂചിപ്പിക്കുന്നു എന്ന വിപുലസന്ദർഭത്തിലെ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: αὐτόν എന്ന സർവനാമം ആരെ സൂചിപ്പിക്കുന്നു
  choice: മുഖ്യപാഠത്തിലെ ‘അവനെ’ ഉടനെയുള്ള മുൻപദമായ പിതാവിനെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു
  alternative: യോഹന്നാന്റെ വിശാലമായ സന്ദർഭത്തിൽ ക്രിസ്തുവിനെ സൂചിപ്പിക്കുന്നതായി ചിലർ ഗ്രഹിക്കുന്നു
  rationale: ഈ വാക്യത്തിലെ ഏറ്റവും അടുത്ത വ്യക്തമായ മുൻപദം പിതാവാണ്. എന്നിരുന്നാലും സർവനാമം തന്നെ പേര് ആവർത്തിക്കാത്തതിനാൽ ക്രിസ്തുവിനെ സംബന്ധിച്ച വായനയെ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: καὶ ἐσμέν ഉൾപ്പെടുത്തൽ
  choice: ‘നാം അങ്ങനെതന്നെയാണ്’ എന്ന് മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി
  alternative: ചില കൈയെഴുത്തുപ്രതികളിൽ ഈ വാക്കുകൾ ഇല്ല
  rationale: SBLGNT ഇവ ഉൾക്കൊള്ളുന്നു; വിളിക്കപ്പെടുന്നതും യഥാർഥത്തിൽ ആയിരിക്കുന്നതും തമ്മിലുള്ള ഊന്നൽ പ്രധാനമാണ്. പാഠഭേദം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി. ‘നോക്കൂ’ ശ്രദ്ധാകർഷക ആജ്ഞയെ സ്വാഭാവികമാക്കുന്നു. ποταπός എന്നതിലെ ഗുണപരമായ വിസ്മയം ‘എത്ര അത്ഭുതകരമായ’ എന്ന പ്രയോഗത്തിലൂടെ പകരുകയും കൂടുതൽ പദശഃ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്തു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
