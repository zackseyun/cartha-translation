id: 1JN.3.2
reference: 1 John 3:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀγαπητοί, νῦν τέκνα θεοῦ ἐσμεν, καὶ οὔπω ἐφανερώθη τί ἐσόμεθα. ⸀οἴδαμεν ὅτι ἐὰν φανερωθῇ ὅμοιοι αὐτῷ ἐσόμεθα, ὅτι ὀψόμεθα αὐτὸν καθώς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/002.yaml
  text: Beloved[a], now we are children of God, and what we will be has not yet been revealed. We know that if he is revealed, we will be like him[b], because we will see him as he is.
translation:
  language: ml
  text: 'പ്രിയരേ, ഇപ്പോൾ നാം ദൈവത്തിന്റെ മക്കളാണ്. നാം എന്തായിത്തീരുമെന്ന് ഇതുവരെ വെളിപ്പെട്ടിട്ടില്ല. നമുക്കറിയാം: അവൻ വെളിപ്പെടുമെങ്കിൽ[a][b], നാം അവനെപ്പോലെയായിരിക്കും; കാരണം അവൻ എങ്ങനെയിരിക്കുന്നുവോ അങ്ങനെ നാം അവനെ കാണും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘അതു വെളിപ്പെടുമെങ്കിൽ’—അതായത്, നാം എന്തായിത്തീരുമെന്നത്. ഗ്രീക്കിൽ ഈ ക്രിയയുടെ കർത്താവ് വ്യക്തമായി പറഞ്ഞിട്ടില്ല; സന്ദർഭം ‘അവൻ,’ അഥവാ ക്രിസ്തു, എന്ന വായനയ്ക്ക് കൂടുതൽ പിന്തുണ നൽകുന്നു.
    reason: alternative_reading
  - marker: b
    text: പല പരിഭാഷകളും ‘അവൻ പ്രത്യക്ഷപ്പെടുമ്പോൾ’ എന്നു നൽകുന്നു. എന്നാൽ ഗ്രീക്കിൽ കൂടുതൽ അക്ഷരാർഥമായി ‘അവൻ വെളിപ്പെടുമെങ്കിൽ’ എന്നാണ്; വാക്യത്തിന്റെ മുൻഭാഗത്തുള്ള ‘വെളിപ്പെട്ടിട്ടില്ല’ എന്നതിലും ഇതേ ക്രിയയാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπητοί
  choice: പ്രിയരേ
  rationale: സ്നേഹപൂർവമായ ബഹുവചന സംബോധനയെ സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: νῦν
  choice: ഇപ്പോൾ
  rationale: ഇപ്പോഴത്തെ ദൈവമക്കളെന്ന നിലയും ഭാവിയിൽ വെളിപ്പെടാനുള്ള അവസ്ഥയും തമ്മിലുള്ള കാലപരമായ വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: τέκνα θεοῦ
  choice: ദൈവത്തിന്റെ മക്കൾ
  rationale: τέκνα സൂചിപ്പിക്കുന്ന പുത്രബന്ധം ലിംഗഭേദം ചുമത്താതെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: οὔπω ἐφανερώθη
  choice: ഇതുവരെ വെളിപ്പെട്ടിട്ടില്ല
  rationale: φανερόω എന്ന ക്രിയയുടെ പ്രകടമാകുക/വെളിപ്പെടുക എന്ന അർഥവും ഇപ്പോഴും നിലനിൽക്കുന്ന അപ്രകടാവസ്ഥയും സംക്ഷിപ്തമായി സൂക്ഷിക്കുന്നു.
- source_word: τί ἐσόμεθα
  choice: നാം എന്തായിത്തീരും
  rationale: വിശ്വാസികളുടെ ഭാവിയിലെ അവസ്ഥയെയോ സ്വഭാവത്തെയോ സൂചിപ്പിക്കുന്ന τίയുടെ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: οἴδαμεν
  choice: '[അറിയാം എന്ന അർഥം വാക്യഘടനയിൽ ഉറപ്പായി പ്രസ്താവിക്കുന്നു]'
  rationale: മലയാള കരടിൽ ഉറപ്പിന്റെ ആശയം സ്വാഭാവികമായി വ്യക്തമാക്കേണ്ടതിനാൽ അന്തിമ വാക്യത്തിൽ ‘നമുക്കറിയാം’ ഉൾപ്പെടുത്തുന്നത് അനിവാര്യമാണ്.
- source_word: ἐὰν φανερωθῇ
  choice: അവൻ വെളിപ്പെടുമെങ്കിൽ
  rationale: വ്യക്തമായി പറഞ്ഞിട്ടില്ലാത്ത കർത്താവിനെ സന്ദർഭമനുസരിച്ച് ക്രിസ്തുവായി ഗ്രഹിക്കുന്നു; ‘വെളിപ്പെടുക’ എന്ന നിഷ്ക്രിയ ഭാവവും ἐφανερώθηയുമായുള്ള പദബന്ധവും നിലനിർത്തുന്നു.
- source_word: ὅμοιοι αὐτῷ
  choice: നാം അവനെപ്പോലെയായിരിക്കും
  rationale: യഥാർഥ സാദൃശ്യം പ്രസ്താവിക്കുമ്പോഴും സമ്പൂർണ താദാത്മ്യം സൂചിപ്പിക്കാത്ത ὅμοιοιയുടെ അർഥം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: ὀψόμεθα αὐτὸν
  choice: നാം അവനെ കാണും
  rationale: ഭാവികാലത്തിലുള്ള നേരിട്ടുള്ള ദർശനത്തെ ലളിതമായും വ്യക്തമായും നൽകുന്നു.
- source_word: καθώς ἐστιν
  choice: അവൻ ആയിരിക്കുന്നതുപോലെ
  rationale: ക്രിസ്തുവിനെ അവന്റെ യഥാർഥ അവസ്ഥയിൽ കാണുമെന്ന താരതമ്യ/രീതിസൂചന സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ἐὰν φανερωθῇ എന്നതിലെ പരോക്ഷ കർത്താവിന്റെ സൂചിതവ്യക്തി
  choice: ‘അവൻ വെളിപ്പെടുമെങ്കിൽ’—കർത്താവ് ക്രിസ്തുവാണെന്ന വായന
  alternative: ‘അതു വെളിപ്പെടുമെങ്കിൽ’—നാം എന്തായിത്തീരുമെന്ന ഭാവിയവസ്ഥയെ കർത്താവായി എടുക്കുന്ന വായന
  rationale: തുടർന്നുള്ള ‘അവനെ’, ‘അവനെപ്പോലെ’ എന്നീ പ്രയോഗങ്ങൾ ക്രിസ്തുവിനെയാണ് ഏറ്റവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്. എങ്കിലും ഗ്രീക്കിൽ കർത്താവ് പരസ്യമായി നൽകിയിട്ടില്ലാത്തതിനാൽ പകരവായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: വിശ്വാസികളുടെ ഭാവിയിലെ ക്രിസ്തുസാദൃശ്യം
  choice: ‘നാം അവനെപ്പോലെയായിരിക്കും’—യഥാർഥ സാദൃശ്യം, താദാത്മ്യമല്ല
  alternative: ‘നാം അവൻ ആയിരിക്കുന്നതുപോലെയാകും’ എന്ന കൂടുതൽ ശക്തമായ പുനരാഖ്യാനം
  rationale: ὅμοιοι സാദൃശ്യം സൂചിപ്പിക്കുന്നു; ഒരേ സത്തയോ പൂർണ താദാത്മ്യമോ നിർബന്ധിക്കുന്നില്ല. അതേസമയം രൂപാന്തരത്തെക്കുറിച്ചുള്ള ശക്തമായ വാഗ്ദാനം ദുർബലമാക്കുന്നുമില്ല.
- issue: ἐὰν എന്ന വ്യവസ്ഥാസൂചകത്തിന്റെ കാലഭാവം
  choice: ‘വെളിപ്പെടുമെങ്കിൽ’
  alternative: ‘വെളിപ്പെടുമ്പോൾ’
  rationale: മൂലത്തിലെ ἐὰν എന്ന വ്യവസ്ഥാരൂപം ഔപചാരികമായി നിലനിർത്തുന്നു; ഇത് സംഭവത്തെക്കുറിച്ചുള്ള സംശയം നിർബന്ധമായി സൂചിപ്പിക്കുന്നില്ലെങ്കിലും ‘എപ്പോൾ’ എന്നു മാറ്റി വ്യാഖ്യാനപരമായി തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ബൈബിൾഭാഷ. ‘പ്രിയരേ’ സ്നേഹപൂർവമായ സംബോധന നിലനിർത്തുന്നു; ‘വെളിപ്പെടുക’ എന്ന പദത്തിന്റെ ആവർത്തനം ഗ്രീക്ക് മൂലത്തിലെ ശബ്ദ-ആശയബന്ധം കാത്തുസൂക്ഷിക്കുന്നു. പ്രസിദ്ധീകരണത്തിന് മുമ്പ് οἴδαμεν എന്ന ‘നമുക്കറിയാം’ മുഖ്യവാക്യത്തിൽ വ്യക്തമായി ഉൾപ്പെടുത്തണം.
