  to: 'പ്രിയരേ, ഇപ്പോൾ നാം ദൈവത്തിന്റെ മക്കളാണ്. നാം എന്തായിത്തീരുമെന്ന് ഇതുവരെ വെളിപ്പെട്ടിട്ടില്ല. നമുക്കറിയാം: അവൻ വെളിപ്പെടുമെങ്കിൽ[a][b], നാം അവനെപ്പോലെയായിരിക്കും; കാരണം അവൻ എങ്ങനെയിരിക്കുന്നുവോ അങ്ങനെ നാം അവനെ കാണും.'
