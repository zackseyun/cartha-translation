id: 1JN.3.20
reference: 1 John 3:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι ἐὰν καταγινώσκῃ ἡμῶν ἡ καρδία, ὅτι μείζων ἐστὶν ὁ θεὸς τῆς καρδίας ἡμῶν καὶ γινώσκει πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/020.yaml
  text: for if our heart condemns us[a], God is greater than our heart[b], and he knows all things.
translation:
  language: ml
  text: കാരണം, നമ്മുടെ ഹൃദയം നമ്മെ കുറ്റപ്പെടുത്തുന്നുവെങ്കിൽ[a], ദൈവം നമ്മുടെ ഹൃദയത്തെക്കാൾ വലിയവനാണ്[b]; അവിടുന്ന് എല്ലാം അറിയുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘നമ്മെ കുറ്റം വിധിക്കുന്നുവെങ്കിൽ’ അഥവാ ‘നമ്മിൽ കുറ്റം കണ്ടെത്തുന്നുവെങ്കിൽ.’
    reason: lexical_alternative
  - marker: b
    text: ‘ദൈവം നമ്മുടെ ഹൃദയത്തെക്കാൾ വലിയവനാണ്’ എന്നത് നമ്മെക്കുറിച്ചുള്ള മുഴുവൻ സത്യവും അവിടുന്ന് അറിയുന്നു എന്നതിനെയും, അതിന്റെ സൂചനയായി നമ്മെത്തന്നെ കുറ്റപ്പെടുത്തുന്നതിനുമേലുള്ള അവിടുത്തെ അധികാരത്തെയും സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: കാരണം
  rationale: ആദ്യത്തെ ὅτι മുൻവാക്യത്തിനുള്ള അടിസ്ഥാനമോ വിശദീകരണമോ അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘കാരണം’ ഈ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἐὰν
  choice: എങ്കിൽ
  rationale: വർത്തമാനകാല subjunctive-നോടൊപ്പം നിബന്ധന സൂചിപ്പിക്കുന്നതിനാൽ ‘എങ്കിൽ’ യോജിക്കുന്നു.
- source_word: καταγινώσκῃ
  choice: കുറ്റം വിധിക്കുന്നുവെങ്കിൽ
  rationale: ഈ ക്രിയയ്ക്ക് ഒരാളിൽ കുറ്റം കണ്ടെത്തുക, കുറ്റപ്പെടുത്തുക, കുറ്റം വിധിക്കുക എന്നീ അർഥങ്ങളുണ്ട്. ഇവിടെ ഉള്ളിലെ ന്യായവിധിയുടെ ഭാവം നിലനിർത്താൻ ‘കുറ്റം വിധിക്കുക’ തെരഞ്ഞെടുത്തു.
- source_word: ἡ καρδία ἡμῶν
  choice: നമ്മുടെ ഹൃദയം
  rationale: ‘മനസ്സാക്ഷി’ എന്ന് വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ, യോഹന്നാന്റെ καρδία എന്ന രൂപകവും അതിന്റെ വിശാലമായ ആന്തരികജീവിതസൂചനയും നിലനിർത്തുന്നു.
- source_word: μείζων
  choice: വലിയവനാണ്
  rationale: ദൈവത്തെ സൂചിപ്പിക്കുന്നതിനാൽ വ്യക്തിസൂചകമായ ‘വലിയവൻ’ ഉപയോഗിച്ചു. അറിവിലോ അധികാരത്തിലോ കരുണയിലോ മാത്രം അർഥം ചുരുക്കാതെ താരതമ്യത്തിന്റെ വിശാലത സംരക്ഷിക്കുന്നു.
- source_word: τῆς καρδίας ἡμῶν
  choice: നമ്മുടെ ഹൃദയത്തെക്കാൾ
  rationale: താരതമ്യത്തിനു ശേഷമുള്ള ഗ്രീക്ക് genitive മലയാളത്തിൽ ‘-ത്തെക്കാൾ’ എന്ന രൂപത്തിൽ സ്വാഭാവികമായി പകരുന്നു.
- source_word: γινώσκει πάντα
  choice: അവിടുന്ന് എല്ലാം അറിയുന്നു
  rationale: πάνταയുടെ സമഗ്രത ‘എല്ലാം’ എന്നതിലൂടെ നിലനിർത്തുന്നു; ദൈവത്തെക്കുറിച്ചുള്ള മാന്യവും ആധുനികവുമായ മലയാളപ്രയോഗമായി ‘അവിടുന്ന്’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: ‘ദൈവം നമ്മുടെ ഹൃദയത്തെക്കാൾ വലിയവനാണ്’ എന്നതിന്റെ വ്യാപ്തി
  choice: ദൈവത്തിന്റെ മഹത്വത്തെ അറിവ്, അധികാരം, കരുണ എന്നിവയിൽ ഏതെങ്കിലും ഒന്നിലേക്കു മാത്രം ചുരുക്കാതെ പ്രസ്താവന വിശാലമായി നിലനിർത്തി.
  alternative: ദൈവം കുറ്റം വിധിക്കുന്ന മനസ്സാക്ഷിയെക്കാൾ കരുണയുള്ളവനാണ്; ദൈവത്തിന്റെ വിധി സ്വയംകുറ്റവിധിയെ മറികടക്കുന്നു; നമ്മുടെ അപൂർണമായ സ്വയംവിലയിരുത്തലിനപ്പുറം ദൈവം മുഴുവൻ സത്യവും അറിയുന്നു.
  rationale: മൂലപാഠം ദൈവം ഹൃദയത്തെക്കാൾ വലിയവനാണെന്ന് വിശാലമായി പ്രസ്താവിക്കുകയും തുടർന്ന് അവിടുന്ന് എല്ലാം അറിയുന്നു എന്നു ചേർക്കുകയും ചെയ്യുന്നു. അറിവ് പ്രധാനമാണെന്ന സൂചനയുണ്ടെങ്കിലും താരതമ്യത്തെ ഒരു doctrinal വ്യാഖ്യാനത്തിലേക്കു മാത്രം ചുരുക്കരുത്.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ഹൃദയം’ എന്ന മൂലരൂപകം നിലനിർത്തി; ‘മനസ്സാക്ഷി’ എന്ന് വ്യാഖ്യാനപരമായി മാറ്റിയിട്ടില്ല. ദൈവത്തെ സൂചിപ്പിക്കാൻ ‘അവിടുന്ന്’ എന്ന മാന്യരൂപം ഉപയോഗിച്ചു.
