id: 1JN.3.23
reference: 1 John 3:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ ἐντολὴ αὐτοῦ, ἵνα ⸀πιστεύσωμεν τῷ ὀνόματι τοῦ υἱοῦ αὐτοῦ Ἰησοῦ Χριστοῦ καὶ ἀγαπῶμεν ἀλλήλους, καθὼς ἔδωκεν ἐντολὴν ⸀ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/023.yaml
  text: 'And this is his command: that we believe in the name of his Son Jesus the Messiah and love one another[d][c][b][a], just as he gave us command.'
translation:
  language: ml
  text: 'അവന്റെ കൽപ്പന ഇതാണ്: അവന്റെ പുത്രനായ യേശു മശിഹായുടെ[a] നാമത്തിൽ നാം വിശ്വസിക്കുകയും[b] പരസ്പരം സ്നേഹിക്കുകയും വേണം, അവൻ നമുക്കു കൽപ്പന നൽകിയതുപോലെ[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യേശു ക്രിസ്തുവിന്റെ.’ ഗ്രീക്കിലെ Χριστός എന്ന പദം ‘ക്രിസ്തു’ എന്നും എഴുതാറുണ്ട്; ഇവിടെ അത് ‘മശിഹാ’ എന്ന പദവിയായി പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: ‘നാമത്തിൽ ആശ്രയിക്കുകയും’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ, ‘അവൻ നമുക്കു കൽപ്പന നൽകി.’ ഈ ഉപവാക്യം ഏറ്റവും സ്വാഭാവികമായി പരസ്പരം സ്നേഹിക്കാനുള്ള കൽപ്പനയെ ഓർമിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ മുഴുവൻ കൽപ്പനയെയും ഉൾക്കൊള്ളുന്നതായും മനസ്സിലാക്കാം.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ἐντολή
  choice: കല്പന
  rationale: അധികാരപൂർവമായ നിർദേശം എന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ഗ്രീക്കിലെ ഏകവചനം നിലനിർത്തുന്നു.
- source_word: ἵνα πιστεύσωμεν
  choice: നാം വിശ്വസിക്കുകയും … വേണം
  rationale: ἵνα ഇവിടെ കല്പനയുടെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘വേണം’ എന്ന ഘടന കല്പനാത്മകമായ ഉപവാക്യത്തിന്റെ ശക്തി സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: πιστεύω τῷ ὀνόματι
  choice: നാമത്തിൽ … വിശ്വസിക്കുക
  rationale: ദത്തിവിനോടുകൂടിയ πιστεύω വ്യക്തിയുടെ വെളിപ്പെട്ട തിരിച്ചറിയലിലേക്കും അധികാരത്തിലേക്കും തിരിയുന്ന വിശ്വാസത്തെ സൂചിപ്പിക്കുന്നു; യോഹന്നാന്റെ പ്രയോഗവുമായി പൊരുത്തപ്പെടുന്ന രൂപം.
- source_word: υἱοῦ αὐτοῦ
  choice: അവന്റെ പുത്രനായ
  rationale: ബന്ധസൂചന വ്യക്തമായി നിലനിർത്തുകയും തുടർന്നുവരുന്ന യേശു മശിഹാ എന്ന തിരിച്ചറിയലുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: Ἰησοῦ Χριστοῦ
  choice: യേശു മശിഹാ
  rationale: Χριστός ഇവിടെ യേശുവിനെ തിരിച്ചറിയിക്കുന്ന അഭിഷിക്തരാജാവിന്റെ പദവിയായി പ്രവർത്തിക്കുന്നതിനാൽ ‘മശിഹാ’ എന്നു പരിഭാഷപ്പെടുത്തി; മലയാളത്തിലെ വിഭക്തിക്കായി ‘യേശു മശിഹായുടെ’ എന്ന രൂപം ഉപയോഗിച്ചു.
- source_word: ἀγαπῶμεν ἀλλήλους
  choice: പരസ്പരം സ്നേഹിക്കുക
  rationale: സമൂഹത്തിനുള്ളിലെ പരസ്പര സ്നേഹം വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: καθὼς
  choice: …തുപോലെ
  rationale: മുമ്പ് നൽകിയ കല്പനയോടുള്ള അനുരൂപത വ്യക്തമാക്കുന്നു.
- source_word: ἔδωκεν ἐντολὴν ἡμῖν
  choice: അവൻ നമുക്കു കല്പന നൽകി
  rationale: ഗ്രീക്കിലെ δίδωμι + ἐντολή ഘടനയും ആദ്യത്തെ ‘കല്പന’യുമായുള്ള പദാവർത്തനവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: Χριστός എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മശിഹാ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ പദം പേരിന്റെ ഒരു ഭാഗംപോലെ മാത്രം അല്ല, യേശുവിന്റെ അഭിഷിക്തപദവിയായി പ്രവർത്തിക്കുന്നു. അതിനാൽ പദവിയുടെ അർഥം സുതാര്യമാക്കുന്ന ‘മശിഹാ’ തെരഞ്ഞെടുത്തു.
- issue: πιστεύω τῷ ὀνόματι എന്ന പ്രയോഗത്തിന്റെ ശക്തി
  choice: നാമത്തിൽ വിശ്വസിക്കുക
  alternative: നാമത്തിൽ ആശ്രയിക്കുക
  rationale: വെറും പേരെന്ന ശബ്ദരൂപത്തെ അംഗീകരിക്കുക എന്നതിലുപരി, ആ നാമം വെളിപ്പെടുത്തുന്ന വ്യക്തിയിൽ വിശ്വാസം അർപ്പിക്കുക എന്ന യോഹന്നാനീയ ആശയം സംരക്ഷിക്കുന്നു.
- issue: καθὼς ഉപവാക്യം എന്തിനോടാണ് ചേരുന്നത്
  choice: പരസ്പരം സ്നേഹിക്കുന്നതിനെ മുമ്പ് നൽകിയ കല്പനയോട് ബന്ധിപ്പിച്ചു
  alternative: വിശ്വസിക്കലും സ്നേഹിക്കലും ഉൾപ്പെടുന്ന മുഴുവൻ സംയുക്ത കല്പനയോടും ബന്ധിപ്പിക്കാം
  rationale: വാക്യക്രമത്തിൽ καθὼς ഏറ്റവും അടുത്തുള്ള ‘പരസ്പരം സ്നേഹിക്കുക’ എന്ന നിർദേശത്തോടാണ് സ്വാഭാവികമായി ചേരുന്നത്; എങ്കിലും വിപുലമായ ബന്ധസാധ്യത പൂർണമായി നിഷേധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ചെയ്യണം’ ആവർത്തിക്കാതെ സംയുക്തക്രിയയ്ക്ക് അവസാനം ‘വേണം’ ചേർത്തത് രണ്ട് ക്രിയകളും ഒരേ കല്പനയുടെ ഉള്ളടക്കമാണെന്ന് വ്യക്തമാക്കുന്നു. ‘കല്പന’ എന്ന പദം രണ്ടു പ്രാവശ്യവും ഉപയോഗിച്ച് മൂലപാഠത്തിലെ ആവർത്തനം സംരക്ഷിച്ചു.
