id: 1JN.3.3
reference: 1 John 3:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ πᾶς ὁ ἔχων τὴν ἐλπίδα ταύτην ἐπ’ αὐτῷ ἁγνίζει ἑαυτὸν καθὼς ἐκεῖνος ἁγνός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/003.yaml
  text: And everyone who has this hope set on him purifies himself[b][a], just as he is pure.
translation:
  language: ml
  text: ഈ പ്രത്യാശ അവനിൽ വെച്ചിരിക്കുന്ന[a] ഏവനും, അവൻ[b] ശുദ്ധനായിരിക്കുന്നതുപോലെ, തന്നെത്തന്നെ ശുദ്ധീകരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവനിൽ ഈ പ്രത്യാശ ഉള്ള ഏവനും’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്ക് പ്രയോഗം പ്രത്യാശയുടെ ലക്ഷ്യത്തെയോ അത് ആശ്രയിക്കുന്ന അടിസ്ഥാനത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘അവൻ ശുദ്ധനായിരിക്കുന്നതുപോലെ’ എന്നിടത്തെ ‘അവൻ’ സന്ദർഭത്തിൽ മിക്കവാറും പുത്രനായ ക്രിസ്തുവിനെ സൂചിപ്പിക്കുന്നു; എന്നാൽ ഗ്രീക്ക് പാഠം പേര് പറയാതെ സർവനാമം മാത്രമാണ് ഉപയോഗിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ ἔχων
  choice: വെച്ചിരിക്കുന്ന ഏവനും
  rationale: നാമവാചകമായി പ്രവർത്തിക്കുന്ന വർത്തമാനകാല കൃദന്തത്തിന്റെ പൊതുവായ വ്യാപ്തിയും തുടർച്ചയുള്ള സ്വഭാവവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: τὴν ἐλπίδα ταύτην
  choice: ഈ പ്രത്യാശ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ പ്രത്യാശയിലേക്കാണ് സൂചന; ‘ഈ പ്രത്യാശ’ അതിനെ നേരായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: ἐπ’ αὐτῷ
  choice: അവനിൽ ... വെച്ചിരിക്കുന്ന
  rationale: ἐπί + ദത്തിവ് പ്രത്യാശ ആശ്രയിക്കുന്ന വ്യക്തിയെയോ അടിസ്ഥാനത്തെയോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘അവനിൽ പ്രത്യാശ വെക്കുക’ ദിശയും ആശ്രയവും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἁγνίζει ἑαυτὸν
  choice: തന്നെത്തന്നെ നിർമലനാക്കുന്നു
  rationale: പ്രവർത്തനത്തിന്റെ പ്രതിഫലനസ്വഭാവം നിലനിർത്തുകയും ἁγνίζει–ἁγνός എന്ന ഒരേ പദകുടുംബത്തിലെ ബന്ധം ‘നിർമലനാക്കുന്നു–നിർമലൻ’ എന്ന രൂപത്തിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: καθὼς
  choice: പോലെ
  rationale: താരതമ്യം വ്യക്തവും സ്വാഭാവികവുമായി രേഖപ്പെടുത്തുന്നു.
- source_word: ἐκεῖνος
  choice: അവൻ
  rationale: ഗ്രീക്ക് സർവനാമത്തിന് സന്ദർഭത്തിൽ പുത്രൻ/ക്രിസ്തു എന്ന സൂചന ശക്തമാണെങ്കിലും പേരോ പദവിയോ ചേർത്ത് അവ്യക്തത തീർക്കാതെ സ്വാഭാവിക മലയാള സർവനാമം ഉപയോഗിക്കുന്നു.
- source_word: ἁγνός
  choice: നിർമലൻ
  rationale: ധാർമിക ശുദ്ധിയുടെ അർഥം നൽകുകയും മുൻക്രിയയുമായുള്ള പദബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: αὐτῷ, ἐκεῖνος എന്നീ സർവനാമങ്ങളുടെ സൂചിതവ്യക്തി
  choice: രണ്ടും ‘അവൻ’ എന്ന സർവനാമത്താൽ വിവർത്തനം ചെയ്തു; സന്ദർഭത്തിൽ ക്രിസ്തു/പുത്രൻ എന്നതാണ് ഏറ്റവും സ്വാഭാവികം.
  alternative: ആദ്യത്തേത് പിതാവായ ദൈവത്തെയും രണ്ടാമത്തേത് ക്രിസ്തുവിനെയും സൂചിപ്പിക്കുന്നു; അല്ലെങ്കിൽ രണ്ടും പിതാവിനെയും പുത്രനെയും സംബന്ധിച്ച ഉദ്ദേശ്യപൂർവമായ അവ്യക്തത നിലനിർത്തുന്നു.
  rationale: മുൻസന്ദർഭത്തിലെ ‘അവൻ ഉള്ളതുപോലെ അവനെ കാണും’ എന്ന പ്രതീക്ഷ ക്രിസ്തുവിലേക്കു ശക്തമായി ചൂണ്ടുന്നു. എങ്കിലും മൂലപാഠം പേരോ പദവിയോ പറയാത്തതിനാൽ വിവർത്തനവും സർവനാമം നിലനിർത്തുന്നു.
- issue: ἑαυτὸν എന്ന ഏകവചന പ്രതിഫലന സർവനാമം
  choice: ‘തന്നെത്തന്നെ’ എന്ന് നൽകി.
  alternative: ‘സ്വയം’ എന്ന് നൽകാം.
  rationale: ഗ്രീക്കിലെ പ്രതിഫലനപ്രയോഗം വ്യക്തമായി സംരക്ഷിക്കുമ്പോൾ മലയാളത്തിൽ ലിംഗനിർണ്ണയം അനാവശ്യമായി ചുമത്തുന്നില്ല; ‘ഏവനും’ പൊതുവ്യാപ്തി അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ശുദ്ധീകരിക്കുന്നു’ എന്നതിനെക്കാൾ ‘നിർമലനാക്കുന്നു’ ഉപയോഗിച്ച് ἁγνίζει/ἁγνός എന്ന പദബന്ധം കേൾവിയിലും വായനയിലും വ്യക്തമായി നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട വാക്യത്തിന്റെ അവസാനം ചേർത്തിരിക്കുന്നു.
