id: 1JN.3.16
reference: 1 John 3:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν τούτῳ ἐγνώκαμεν τὴν ἀγάπην, ὅτι ἐκεῖνος ὑπὲρ ἡμῶν τὴν ψυχὴν αὐτοῦ ἔθηκεν· καὶ ἡμεῖς ὀφείλομεν ὑπὲρ τῶν ἀδελφῶν τὰς ψυχὰς ⸀θεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/016.yaml
  text: 'By this we have come to know love: that he laid down his life for us[b][a], and we ought to lay down our lives for the brothers.'
translation:
  language: ml
  text: 'സ്നേഹം എന്തെന്ന് നാം അറിഞ്ഞത് ഇതിലൂടെയാണ്: അവൻ നമുക്കുവേണ്ടി തന്റെ ജീവൻ അർപ്പിച്ചു; അതുപോലെ സഹോദരന്മാർക്കുവേണ്ടി നമ്മുടെ ജീവൻ അർപ്പിക്കാൻ നാമും കടപ്പെട്ടിരിക്കുന്നു.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സഹോദരന്മാർ’ എന്ന ഗ്രീക്ക് പ്രയോഗം ഈ സന്ദർഭത്തിൽ സഹവിശ്വാസികളായ സ്ത്രീകളെയും ഉൾപ്പെടുത്തി വിശ്വാസസമൂഹത്തെ പൊതുവായി സൂചിപ്പിക്കുന്നതാകാം.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: ഇതിലൂടെയാണ്
  rationale: സ്നേഹം അറിയാനുള്ള മാർഗമോ അടിസ്ഥാനമോ തുടർന്നുള്ള വാക്യം വ്യക്തമാക്കുന്നു. ‘ഇതിലൂടെയാണ്’ എന്നത് ഗ്രീക്ക് പ്രയോഗത്തിന്റെ വിശദീകരണസ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐγνώκαμεν
  choice: നാം അറിഞ്ഞത്
  rationale: പൂർണ്ണകാലക്രിയ മുൻപ് ലഭിച്ച അറിവിന്റെ ഇപ്പോഴും നിലനിൽക്കുന്ന ഫലം സൂചിപ്പിക്കുന്നു; വാക്യഘടനയോടൊപ്പം ‘നാം അറിഞ്ഞത്’ മലയാളത്തിൽ ആ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὴν ἀγάπην
  choice: സ്നേഹം എന്തെന്ന്
  rationale: ഇവിടെ ക്രിസ്തുവിന്റെ പ്രവൃത്തിയിലൂടെ സ്നേഹത്തിന്റെ സ്വഭാവം തിരിച്ചറിയുന്നതാണ് ആശയം. ‘സ്നേഹം എന്തെന്ന്’ എന്ന രൂപം അതിനെ വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു; ‘സ്നേഹം’ എന്ന അടിസ്ഥാനപദം നിലനിർത്തുന്നു.
- source_word: ἐκεῖνος
  choice: അവൻ
  rationale: യോഹന്നാന്റെ സന്ദർഭത്തിൽ ഊന്നൽനൽകുന്ന ഈ സർവനാമം യേശുവിനെ സൂചിപ്പിക്കുന്നു. എന്നാൽ മൂലപാഠം പേര് വ്യക്തമാക്കാത്തതിനാൽ ‘അവൻ’ എന്നു തന്നെയാണ് പരിഭാഷപ്പെടുത്തിയത്.
- source_word: ὑπὲρ ἡμῶν
  choice: നമുക്കുവേണ്ടി
  rationale: ὑπέρ നൽകുന്ന പ്രയോജനാർഥവും പ്രതിനിധിത്വത്തോട് ചേർന്ന സ്വയംസമർപ്പണഭാവവും നിലനിർത്തുന്നു; പ്രായശ്ചിത്തത്തിന്റെ ഒരു പ്രത്യേക സിദ്ധാന്തം അധികമായി ചുമത്തുന്നില്ല.
- source_word: τὴν ψυχὴν αὐτοῦ ἔθηκεν
  choice: തന്റെ ജീവൻ അർപ്പിച്ചു
  rationale: ψυχή ഇവിടെ ‘ജീവൻ’ എന്നാണ്; τίθημι ചേർന്ന യോഹന്നാനീയ പ്രയോഗം സ്വമേധയായുള്ള ജീവത്യാഗത്തെ സൂചിപ്പിക്കുന്നു. ‘ജീവൻ അർപ്പിച്ചു’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: ὀφείλομεν
  choice: നാമും കടപ്പെട്ടിരിക്കുന്നു
  rationale: ക്രിയ നൈതിക ബാധ്യതയെ സൂചിപ്പിക്കുന്നു. ‘കടപ്പെട്ടിരിക്കുന്നു’ എന്നത് കടമയും ബാധ്യതയും വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τῶν ἀδελφῶν
  choice: സഹോദരന്മാർക്കുവേണ്ടി
  rationale: ഗ്രീക്ക് പദത്തിന്റെ വ്യാകരണപരമായ പുല്ലിംഗ ബഹുവചനം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു. സഭാസന്ദർഭത്തിലെ ഉൾക്കൊള്ളുന്ന വ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: τὰς ψυχὰς θεῖναι
  choice: നമ്മുടെ ജീവൻ അർപ്പിക്കാൻ
  rationale: ആദ്യപകുതിയിലെ ψυχή/τίθημι പ്രയോഗവുമായി പദസമാനത നിലനിർത്തുകയും സ്വയംത്യാഗത്തിന്റെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ചെയ്യുന്നു. മലയാളത്തിൽ ‘ജീവൻ’ രൂപപരമായി ഏകവചനമായിരുന്നാലും ഇവിടെ സമൂഹത്തിലെ ഓരോരുത്തരുടെയും ജീവനെ കൂട്ടായ അർഥത്തിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ἐκεῖνος എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: പേര് ചേർക്കാതെ ‘അവൻ’ എന്നു പരിഭാഷപ്പെടുത്തി; സന്ദർഭത്തിൽ അത് യേശുക്രിസ്തുവിനെ സൂചിപ്പിക്കുന്നു.
  alternative: ‘യേശു’ അല്ലെങ്കിൽ ‘ക്രിസ്തു’ എന്ന് മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കുക.
  rationale: ലേഖനത്തിന്റെ സന്ദർഭവും ‘ജീവൻ അർപ്പിച്ചു’ എന്ന യോഹന്നാനീയ പ്രയോഗവും യേശുവിനെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു. എന്നിരുന്നാലും ഗ്രീക്ക് പാഠത്തിലെ സർവനാമരൂപം നിലനിർത്തുന്നത് മൂലപാഠത്തിന്റെ രീതി സംരക്ഷിക്കുന്നു.
- issue: ἀδελφῶν എന്നതിന്റെ വ്യാപ്തി
  choice: മുഖ്യപാഠത്തിൽ ‘സഹോദരന്മാർ’ എന്ന് നിലനിർത്തി, സഹവിശ്വാസികളായ സ്ത്രീകളെയും സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്നതായി അടിക്കുറിപ്പിൽ അറിയിച്ചു.
  alternative: ‘സഹോദരീസഹോദരന്മാർ’ അല്ലെങ്കിൽ ‘സഹവിശ്വാസികൾ’ എന്ന് മുഖ്യപാഠത്തിൽ നൽകുക.
  rationale: ഗ്രീക്ക് രൂപം പുല്ലിംഗ ബഹുവചനമാണ്; എന്നാൽ സഭാസന്ദർഭത്തിൽ അത് വിശ്വാസസമൂഹത്തെ പൊതുവായി സൂചിപ്പിക്കാൻ സാധ്യതയുണ്ട്. മുഖ്യപാഠത്തിൽ രൂപപരമായ കൃത്യതയും അടിക്കുറിപ്പിൽ സന്ദർഭപരമായ വ്യാപ്തിയും സംരക്ഷിച്ചു.
- issue: ὑπέρ എന്നതിലെ പ്രായശ്ചിത്തസൂചന
  choice: ‘നമുക്കുവേണ്ടി’ എന്ന് നൽകി.
  alternative: ‘നമ്മുടെ സ്ഥാനത്ത്’ എന്ന് നൽകുക.
  rationale: ὑπέρ സ്വയംസമർപ്പണത്തിന്റെ പ്രയോജനാർഥവും പ്രതിനിധിത്വസാദ്ധ്യതയും വഹിക്കുമ്പോഴും ഈ പദം മാത്രം ഒരു നിർദിഷ്ട പ്രായശ്ചിത്തസിദ്ധാന്തത്തെ നിർബന്ധിക്കുന്നില്ല. അതിനാൽ യഥാർഥമായ ദൈവശാസ്ത്രപരമായ വിശാലത നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ജീവൻ അർപ്പിച്ചു’ എന്ന ആവർത്തനം ഗ്രീക്ക് പാഠത്തിലെ സമാന്തരഘടന നിലനിർത്തുന്നു. ‘അതുപോലെ’ ആശയബന്ധം സ്വാഭാവികമാക്കുന്ന ലഘു ബന്ധപദമാണ്; പുതിയ ദൈവശാസ്ത്രവിവരം ചേർക്കുന്നില്ല.
