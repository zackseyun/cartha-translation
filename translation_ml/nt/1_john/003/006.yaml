id: 1JN.3.6
reference: 1 John 3:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πᾶς ὁ ἐν αὐτῷ μένων οὐχ ἁμαρτάνει· πᾶς ὁ ἁμαρτάνων οὐχ ἑώρακεν αὐτὸν οὐδὲ ἔγνωκεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/006.yaml
  text: Everyone who remains in him does not sin[a]; everyone who sins has not seen him nor known him.
translation:
  language: ml
  text: അവനിൽ നിലനിൽക്കുന്ന ആരും പാപം ചെയ്യുന്നില്ല[a]; പാപം ചെയ്യുന്ന ആരും അവനെ കണ്ടിട്ടില്ല, അറിഞ്ഞിട്ടുമില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ ഔപചാരികമായി: “പാപം ചെയ്യുന്നില്ല … പാപം ചെയ്യുന്ന.” ഇവിടെയുള്ള ഗ്രീക്ക് വർത്തമാനകാലരൂപങ്ങൾ തുടർച്ചയായതോ സ്വഭാവസവിശേഷമായതോ ആയ പ്രവൃത്തിയെ വിവരിക്കുന്നതായി മനസ്സിലാക്കാം; അങ്ങനെ വന്നാൽ: “പാപം ചെയ്തുകൊണ്ടിരിക്കുകയില്ല … പാപം ചെയ്തുകൊണ്ടിരിക്കുന്നവർ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ
  choice: ആരും
  rationale: നിശ്ചിത വിഭാഗത്തിൽപ്പെടുന്ന ഓരോ വ്യക്തിയെയും പൊതുവായി സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സാർവത്രിക ബലം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐν αὐτῷ μένων
  choice: അവനിൽ നിലനിൽക്കുന്ന
  rationale: യോഹന്നാന്റെ രചനകളിൽ പ്രധാനമായ μένω എന്ന പദത്തിന്റെ തുടർച്ചയും ബന്ധപരമായ അർഥവും ‘നിലനിൽക്കുന്ന’ വ്യക്തമാക്കുന്നു; ‘അവനിൽ’ എന്ന ഗ്രീക്ക് ബന്ധഭാഷയും അതേപടി നിലനിർത്തുന്നു.
- source_word: οὐχ ἁμαρτάνει
  choice: പാപം ചെയ്യുന്നില്ല
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാലരൂപത്തെ വ്യാഖ്യാനപരമായി ‘തുടർന്നുകൊണ്ടേയിരിക്കുന്നില്ല’ എന്നു മുഖ്യവാക്യത്തിൽ വിപുലീകരിക്കാതെ ഔപചാരികമായി നൽകുന്നു. തുടർച്ചയായതോ സ്വഭാവസവിശേഷമായതോ ആയ പ്രവൃത്തിയെ സൂചിപ്പിക്കാനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὁ ἁμαρτάνων
  choice: പാപം ചെയ്യുന്ന ആരും
  rationale: വർത്തമാനകാല കൃദന്തരൂപവും ആദ്യ ഉപവാക്യവുമായുള്ള സമാന്തരതയും നിലനിർത്തുന്നു; ഒറ്റപ്പെട്ട ഒരു പ്രവൃത്തിയോ പതിവായ പ്രവൃത്തിയോ എന്ന് മുഖ്യവാക്യത്തിൽ നിർബന്ധമായി തീർപ്പാക്കുന്നില്ല.
- source_word: οὐχ ἑώρακεν αὐτόν
  choice: അവനെ കണ്ടിട്ടില്ല
  rationale: ഗ്രീക്ക് പൂർണകാലത്തിന്റെ ഫലാവസ്ഥയെ സ്വാഭാവികമായ മലയാള പൂർണരൂപത്തിൽ അറിയിക്കുന്നു; ‘ഒരിക്കലും’ എന്ന് മൂലത്തിൽ ഇല്ലാത്ത ഊന്നൽ ചേർക്കുന്നില്ല.
- source_word: οὐδὲ ἔγνωκεν αὐτόν
  choice: അറിഞ്ഞിട്ടുമില്ല
  rationale: οὐδέ-യുടെ കൂട്ടിച്ചേർക്കുന്ന നിഷേധബലം ‘-ട്ടുമില്ല’ എന്ന പ്രയോഗത്തിൽ നിലനിർത്തുന്നു. യോഹന്നാന്റെ സന്ദർഭത്തിൽ γινώσκω-യ്ക്കുള്ള ബന്ധപരമായ അറിവിന്റെ സാധ്യത ‘അറിയുക’ എന്ന പദം തുറന്നുവെക്കുന്നു.
- source_word: αὐτῷ / αὐτόν
  choice: അവനിൽ / അവനെ
  rationale: ഗ്രീക്ക് മൂലപാഠം സർവനാമം മാത്രമാണ് ഉപയോഗിക്കുന്നത്; അതിന്റെ സൂചിതനെ ‘ദൈവം’, ‘പുത്രൻ’, ‘ക്രിസ്തു’ എന്നിങ്ങനെ വിവർത്തനത്തിൽ വ്യക്തമാക്കാതെ മൂലത്തിലെ രൂപവും സാധ്യതയുള്ള സന്ദർഭസങ്കീർണതയും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: വിശ്വാസികൾക്ക് പാപരഹിത പൂർണതയാണോ ഈ വാക്യം പഠിപ്പിക്കുന്നത്
  choice: മുഖ്യവാക്യത്തിൽ ഗ്രീക്ക് വർത്തമാനകാലരൂപങ്ങളുടെ ലളിതമായ സമാന്തരത നിലനിർത്തി ‘പാപം ചെയ്യുന്നില്ല / പാപം ചെയ്യുന്ന’ എന്ന് നൽകി; അവ തുടർച്ചയായതോ സ്വഭാവസവിശേഷമായതോ ആയ പ്രവൃത്തിയായി മനസ്സിലാക്കാവുന്നതാണെന്ന് അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
  alternative: ‘പാപം ചെയ്തുകൊണ്ടേയിരിക്കുന്നില്ല / പാപം ചെയ്തുകൊണ്ടേയിരിക്കുന്നവൻ’ എന്ന് തുടർച്ചയായ പ്രവൃത്തിയെ മുഖ്യവാക്യത്തിൽ തന്നെ വ്യക്തമാക്കുക; അല്ലെങ്കിൽ യാതൊരു കാലഭാവസൂചനയും കൂടാതെ ഈ വാക്യം സമ്പൂർണ പാപരഹിതത്വമായി വായിക്കുക.
  rationale: ഗ്രീക്ക് വർത്തമാനകാലരൂപങ്ങൾക്ക് സന്ദർഭത്തിൽ തുടർച്ചയായതോ പതിവായതോ ആയ പ്രവൃത്തിയുടെ ബലം ഉണ്ടാകാം; എന്നാൽ ആ അർഥഘടകം രൂപത്തിൽ പ്രത്യേകം എഴുതിയിട്ടില്ല. 1 യോഹന്നാൻ 1:8–2:2 വിശ്വാസികളുടെ പാപത്തെയും ക്രിസ്തുവിന്റെ മധ്യസ്ഥതയെയും അംഗീകരിക്കുന്നതിനാൽ, ലേഖനത്തിനുള്ളിലെ ധാർമ്മിക അവകാശവാദവും ആ യാഥാർഥ്യവും തമ്മിലുള്ള സംഘർഷം വിവർത്തനം മായ്ച്ചുകളയരുത്.
- issue: ‘അവൻ’ എന്ന സർവനാമത്തിന്റെ സൂചിതൻ
  choice: ‘അവൻ’ എന്ന സർവനാമം തന്നെയാക്കി നിലനിർത്തി.
  alternative: ‘ദൈവം’, ‘പുത്രൻ’, അല്ലെങ്കിൽ ‘ക്രിസ്തു’ എന്ന് വ്യക്തമായി ചേർക്കുക.
  rationale: സമീപസന്ദർഭത്തിൽ പിതാവിനെയും പുത്രനെയും കുറിച്ചുള്ള പരാമർശങ്ങൾ ഉള്ളപ്പോൾ ഈ വാക്യത്തിലെ ഗ്രീക്ക് മൂലപാഠം സർവനാമം ഉപയോഗിക്കുന്നു. അതിനാൽ മൂലപാഠം വ്യക്തമാക്കാത്ത ദൈവശാസ്ത്രപരമായ തിരിച്ചറിയൽ വിവർത്തനം നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ ഗൗരവമുള്ള ശൈലി. ‘നിലനിൽക്കുക’ യോഹന്നാന്റെ ആവർത്തിത ബന്ധഭാഷ സംരക്ഷിക്കുന്നു. രണ്ട് ഉപവാക്യങ്ങളിലെയും സമാന്തര ഘടനയും ‘അവൻ’ എന്ന സർവനാമത്തിലെ യഥാർഥ അനിശ്ചിതത്വവും നിലനിർത്തിയിരിക്കുന്നു.
