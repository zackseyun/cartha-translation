id: 1JN.3.18
reference: 1 John 3:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀Τεκνία, μὴ ἀγαπῶμεν λόγῳ μηδὲ τῇ γλώσσῃ ἀλλὰ ἐν ἔργῳ καὶ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/018.yaml
  text: Little children[a], let us not love in word or with the tongue[b], but in deed and truth.
translation:
  language: ml
  text: കുഞ്ഞുമക്കളേ, നാം വാക്കുകൊണ്ടോ നാവുകൊണ്ടോ[a] അല്ല, പ്രവൃത്തിയിലും സത്യത്തിലും[b] സ്നേഹിക്കാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘സംസാരത്തിലോ’; ഗ്രീക്കിൽ അക്ഷരാർഥം ‘നാവുകൊണ്ടോ’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ ‘പ്രവർത്തനത്തിലും സത്യത്തിലും’.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τεκνία
  choice: കുഞ്ഞുമക്കളേ
  rationale: സംബോധനാബഹുവചനമായ ഈ പദം എഴുത്തുകാരന്റെ കുടുംബസമാനമായ വാത്സല്യവും ലഘുതാസൂചനയും പ്രകടമാക്കുന്നു. ‘കുഞ്ഞുമക്കളേ’ എന്നത് ആ ഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: μὴ ἀγαπῶμεν
  choice: നാം ... സ്നേഹിക്കാതെ ... സ്നേഹിക്കാം
  rationale: μή ചേർന്ന വർത്തമാനകാല സബ്ജങ്ക്ടീവ് ഒന്നാംപുരുഷ ബഹുവചനത്തിലുള്ള കൂട്ടായ ആഹ്വാനമാണ്. മലയാളത്തിൽ മുഴുവൻ വൈരുധ്യഘടനയോടും ചേർത്ത് ‘നാം ... സ്നേഹിക്കാതെ ... സ്നേഹിക്കാം’ എന്നു പറയുന്നത് ആ ആഹ്വാനം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: λόγῳ
  choice: വാക്കുകൊണ്ട്
  rationale: ഇവിടെ λόγος വാചികപ്രകടനത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘വാക്കുകൊണ്ട്’ എന്നത് ഗ്രീക്കിലെ സംക്ഷിപ്തതയും തുടർന്നുള്ള ‘നാവുകൊണ്ട്’ എന്ന സമാന്തരപ്രയോഗവും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: μηδὲ τῇ γλώσσῃ
  choice: നാവുകൊണ്ട്
  rationale: γλῶσσα എന്നതിന്റെ അക്ഷരാർഥം ‘നാവ്’ എന്നാണ്; ഇവിടെ അത് സംസാരത്തെ സൂചിപ്പിക്കുന്ന രൂപകപ്രയോഗമാണ്. ദൃശ്യബിംബം നഷ്ടപ്പെടുത്താതെ മലയാളത്തിലും അർഥം വ്യക്തമാണ്.
- source_word: ἀλλὰ
  choice: സ്നേഹിക്കാതെ ... സ്നേഹിക്കാം എന്ന വൈരുധ്യഘടന
  rationale: മലയാളത്തിലെ ഈ സ്വാഭാവിക ഘടന വെറും വാചികസ്നേഹവും പ്രവൃത്തിയിലുള്ള സ്നേഹവും തമ്മിലുള്ള ശക്തമായ വൈരുധ്യം വ്യക്തമാക്കുന്നു; പ്രത്യേകമായി ‘മറിച്ച്’ ചേർക്കാതെ തന്നെ ἀλλάയുടെ പ്രവർത്തനം നൽകുന്നു.
- source_word: ἐν ἔργῳ
  choice: പ്രവൃത്തിയിൽ
  rationale: ἔργον എന്നത് പ്രവൃത്തി, പ്രവർത്തനം, കൃതി എന്നിവയെ സൂചിപ്പിക്കുന്നു. ‘പ്രവൃത്തിയിൽ’ എന്നത് സ്നേഹം മൂർത്തമായ പ്രവർത്തനമായി പ്രകടമാകുന്നതിനെ കൃത്യമായി അറിയിക്കുന്നു.
- source_word: καὶ ἀληθείᾳ
  choice: സത്യത്തിൽ
  rationale: ἀλήθειαയുടെ അടിസ്ഥാനാർഥമായ ‘സത്യം’ നിലനിർത്തുന്നു. ‘ആത്മാർഥത’ എന്ന പരിമിത വ്യാഖ്യാനം സ്വീകരിക്കാതെ യോഹന്നാന്റെ രചനകളിലെ വിപുലമായ ധാർമ്മിക-ദൈവശാസ്ത്ര പ്രതിധ്വനി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ‘പ്രവൃത്തിയിലും സത്യത്തിലും’ എന്നതിലെ ‘സത്യം’ എന്ന പദത്തിന്റെ അർഥം
  choice: ‘സത്യത്തിൽ’ എന്ന വിശാലമായ പദം നിലനിർത്തി.
  alternative: ‘ആത്മാർഥതയിൽ’ അല്ലെങ്കിൽ ‘യഥാർഥമായി’
  rationale: ഈ സന്ദർഭത്തിൽ യഥാർഥവും ആത്മാർഥവുമായ സ്നേഹം ഉൾപ്പെടുന്നുണ്ടെങ്കിലും, യോഹന്നാന്റെ പ്രയോഗത്തിൽ ἀλήθεια വെറും വ്യക്തിപരമായ ആത്മാർഥതയെക്കാൾ വിപുലമാണ്. ‘സത്യം’ എന്നു നിലനിർത്തുന്നത് പ്രവൃത്തിയിൽ തെളിയുന്ന യഥാർഥ സ്നേഹവും ദൈവത്തിന്റെ സത്യത്തോടൊത്ത സ്നേഹവും എന്ന ഇരട്ടസാധ്യത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘കുഞ്ഞുമക്കളേ’ എന്ന വാത്സല്യസംബോധനയും ‘വാക്ക്/നാവ്—പ്രവൃത്തി/സത്യം’ എന്ന വൈരുധ്യവും നിലനിർത്തിയിരിക്കുന്നു. വാക്യക്രമം മലയാളത്തിൽ സ്വാഭാവികമാക്കുമ്പോഴും ഒന്നാംപുരുഷ ബഹുവചനത്തിലുള്ള കൂട്ടായ ആഹ്വാനം സംരക്ഷിച്ചിട്ടുണ്ട്.
