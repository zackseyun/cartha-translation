id: 1JN.3.10
reference: 1 John 3:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν τούτῳ φανερά ἐστιν τὰ τέκνα τοῦ θεοῦ καὶ τὰ τέκνα τοῦ διαβόλου· πᾶς ὁ μὴ ποιῶν δικαιοσύνην οὐκ ἔστιν ἐκ τοῦ θεοῦ, καὶ ὁ μὴ ἀγαπῶν τὸν ἀδελφὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/010.yaml
  text: 'By this the children of God and the children of the devil are evident: everyone who does not practice righteousness is not from God[c][b][a], nor is the one who does not love his brother.'
translation:
  language: ml
  text: 'ഇതിലൂടെയാണ്[a] ദൈവത്തിന്റെ മക്കളും പിശാചിന്റെ മക്കളും ആരെന്നു വ്യക്തമാകുന്നത്: നീതി[b] പ്രവർത്തിക്കാത്ത ഏവനും ദൈവത്തിൽനിന്നുള്ളവനല്ല; തന്റെ സഹോദരനെ[c] സ്നേഹിക്കാത്തവനും ദൈവത്തിൽനിന്നുള്ളവനല്ല.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഇതിൽ’ എന്നോ ‘ഇതിൽനിന്ന്’ എന്നോ വിവർത്തനം ചെയ്യാം. ഈ വ്യത്യാസം തിരിച്ചറിയപ്പെടുന്ന അടിസ്ഥാനത്തെയോ മാർഗത്തെയോ ഗ്രീക്ക് പ്രയോഗം സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്ക് പദത്തിന് ‘നീതിമത്തത’ എന്നും, ചില സന്ദർഭങ്ങളിൽ ‘ന്യായം’ എന്നും അർഥമാകാം; ഇവിടെ ശരിയായ നൈതിക ആചരണമാണ് മുഖ്യമായി ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: ‘തന്റെ സഹോദരനെയോ സഹോദരിയെയോ,’ അതായത് ഒരു സഹവിശ്വാസിയെ, എന്നും അർഥമാകാം. ഗ്രീക്കിൽ പുല്ലിംഗ ഏകവചനമായ ‘തന്റെ സഹോദരനെ’ എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: ഇതിലൂടെയാണ്
  rationale: വ്യത്യാസം തിരിച്ചറിയാനുള്ള അടിസ്ഥാനം അഥവാ മാർഗം ഇതാണെന്ന സൂചന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘ഇതിൽ,’ ‘ഇതിൽനിന്ന്’ എന്നീ സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: φανερά ἐστιν
  choice: ആരെന്നു വ്യക്തമാകുന്നത്
  rationale: പ്രകടമോ തിരിച്ചറിയാവുന്നതോ ആകുന്ന സ്ഥിതിയെ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു; രണ്ടു കൂട്ടരുടെ തിരിച്ചറിയലാണ് വാക്യത്തിന്റെ ഊന്നൽ.
- source_word: τὰ τέκνα
  choice: മക്കൾ
  rationale: ദൈവത്തോടും പിശാചിനോടുമുള്ള ബന്ധത്തെ സൂചിപ്പിക്കുന്ന യോഹന്നാനീയ കുടുംബരൂപകം നിലനിർത്തുന്നു.
- source_word: τοῦ διαβόλου
  choice: പിശാചിന്റെ
  rationale: ഇവിടെ διάβολος സാത്താന്റെ സ്ഥിരമായ വ്യക്തിനാമവിശേഷണമായി വരുന്നതിനാൽ ‘പിശാച്’ എന്ന പതിവ് മലയാളരൂപം യോജിക്കുന്നു.
- source_word: πᾶς ὁ μὴ ποιῶν
  choice: പ്രവർത്തിക്കാത്ത ഏവനും
  rationale: വർത്തമാനകാല കൃദന്തരൂപം ഒറ്റ പ്രവൃത്തിയെക്കാൾ സ്വഭാവസവിശേഷമായ ആചരണത്തെ സൂചിപ്പിക്കുന്നു; ‘പ്രവർത്തിക്കുക’ ഈ തുടർച്ചയായ നൈതിക പ്രയോഗം പ്രകടമാക്കുന്നു.
- source_word: δικαιοσύνην
  choice: നീതി
  rationale: ശരിയായ നൈതിക ആചരണം എന്ന അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; നീതിമത്തതും ന്യായവും ഉൾക്കൊള്ളാവുന്ന ഗ്രീക്ക് പദത്തിന്റെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: οὐκ ἔστιν ἐκ τοῦ θεοῦ
  choice: ദൈവത്തിൽനിന്നുള്ളവനല്ല
  rationale: ἐκ സൂചിപ്പിക്കുന്ന ഉറവിടവും ബന്ധവും സംരക്ഷിക്കുന്നു; പ്രത്യേക സിദ്ധാന്തപരമായ വിശദീകരണം ചേർക്കുന്നില്ല.
- source_word: ὁ μὴ ἀγαπῶν τὸν ἀδελφὸν αὐτοῦ
  choice: തന്റെ സഹോദരനെ സ്നേഹിക്കാത്തവനും
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ഏകവചനരൂപം പ്രധാനപാഠത്തിൽ നിലനിർത്തുകയും സമാന്തരമായ കൃദന്തഘടന മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: καὶ
  choice: -വനും ... അല്ല
  rationale: രണ്ടാമത്തെ വിഭാഗത്തിലും ‘ദൈവത്തിൽനിന്നുള്ളവനല്ല’ എന്ന നിഷേധം ബാധകമാണെന്ന് ഗ്രീക്കിലെ സംക്ഷിപ്ത സമാന്തരഘടന വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ ആവർത്തനം ആശയക്കുഴപ്പം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: നൈതിക-ആത്മീയ തിരിച്ചറിയലിലെ കുടുംബഭാഷ
  choice: ദൈവത്തിന്റെ മക്കളും പിശാചിന്റെ മക്കളും
  alternative: ദൈവത്തിന്റേതായവരും പിശാചിന്റേതായവരും
  rationale: τέκνα എന്നത് വ്യക്തമായ കുടുംബഭാഷയാണ്. യോഹന്നാന്റെ ദൈവശാസ്ത്രപരമായ ബന്ധരൂപകം മൃദൂകരിക്കാതെ നിലനിർത്തുന്നു.
- issue: ἀδελφός എന്ന ലിംഗചിഹ്നമുള്ള പദം
  choice: തന്റെ സഹോദരനെ
  alternative: തന്റെ സഹോദരനെയോ സഹോദരിയെയോ; സഹവിശ്വാസിയെ
  rationale: മൂലപാഠത്തിലെ പുല്ലിംഗ ഏകവചനം പ്രധാനപാഠത്തിൽ സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ വിശ്വാസസമൂഹത്തിലെ സ്ത്രീകളെയും ഉൾക്കൊള്ളാവുന്ന വിപുലമായ പ്രയോഗം അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
- issue: നീതി പ്രവർത്തിക്കാതിരിക്കലും ദൈവത്തിൽനിന്നുള്ളവനല്ലായ്മയും
  choice: പ്രവൃത്തിയെ തിരിച്ചറിയൽചിഹ്നമായി നേരിട്ട് പ്രസ്താവിക്കുന്നു
  alternative: പ്രവൃത്തിയെ രക്ഷ നേടാനുള്ള കാരണമായി വ്യാഖ്യാനിക്കുക
  rationale: വാക്യം കാണാവുന്ന നൈതിക വ്യത്യാസത്തെ പ്രസ്താവിക്കുന്നു; കാരണം, തെളിവ്, രക്ഷാക്രമം എന്നിവയെക്കുറിച്ചുള്ള പിന്നീടുള്ള സിദ്ധാന്തനിഗമനം വിവർത്തനത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മക്കൾ,’ ‘പിശാച്,’ ‘ദൈവത്തിൽനിന്നുള്ളവൻ’ എന്നീ പരിചിതമായ ബൈബിൾ പദപ്രയോഗങ്ങൾ നിലനിർത്തി; ദീർഘവും കൃത്രിമവുമായ നാമവൽക്കരണങ്ങൾ ഒഴിവാക്കി. ഗ്രീക്കിലെ അവസാന സമാന്തരവാക്യത്തിലെ ലോപിച്ച ക്രിയ മലയാളവായനക്കാർക്കായി ആവർത്തിച്ചെങ്കിലും പുതിയ ആശയം ചേർത്തിട്ടില്ല.
