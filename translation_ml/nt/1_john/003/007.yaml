source:
  edition: SBLGNT
  text: τεκνία, μηδεὶς πλανάτω ὑμᾶς· ὁ ποιῶν τὴν δικαιοσύνην δίκαιός ἐστιν, καθὼς ἐκεῖνος δίκαιός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/007.yaml
  text: Little children, let no one deceive you. The one who practices righteousness is righteous, just as that one is righteous.
translation:
  language: ml
  text: കുഞ്ഞുമക്കളേ, ആരും നിങ്ങളെ വഞ്ചിക്കാതിരിക്കട്ടെ.[a] നീതി[c] പ്രവർത്തിക്കുന്നവൻ നീതിമാനാണ്, ആ ഒരുവൻ[b] നീതിമാനായിരിക്കുന്നതുപോലെതന്നെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘ആരും നിങ്ങളെ വഴിതെറ്റിക്കാതിരിക്കട്ടെ.’
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ ‘ആ ഒരുവൻ’; ഇത് ക്രിസ്തുവിനെ സൂചിപ്പിക്കുന്നതായിരിക്കാനാണ് കൂടുതൽ സാധ്യത, എന്നാൽ ചിലർ ദൈവത്തെ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
  - marker: c
    text: അല്ലെങ്കിൽ ‘ന്യായം’; ഇവിടെ നീതിമാനായിരിക്കുന്നതിനൊത്ത നേരായ നടത്തമാണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
lexical_decisions:
- source_word: τεκνία
  choice: കുഞ്ഞുമക്കളേ
  rationale: സ്നേഹപൂർവമായ സംബോധനയും diminutive ഭാവവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: μηδεὶς πλανάτω ὑμᾶς
  choice: ആരും നിങ്ങളെ വഞ്ചിക്കാതിരിക്കട്ടെ
  rationale: μηδείς സഹിതമുള്ള വർത്തമാനകാല ആജ്ഞയുടെ നിരോധനസ്വഭാവവും πλανάω എന്നതിന്റെ ‘വഞ്ചിക്കുക/വഴിതെറ്റിക്കുക’ എന്ന അർഥപരിധിയും വ്യക്തമാക്കുന്നു.
- source_word: ὁ ποιῶν
  choice: പ്രവർത്തിക്കുന്നവൻ
  rationale: Articular present participle സൂചിപ്പിക്കുന്ന പതിവായ, സ്വഭാവസവിശേഷമായ പ്രവൃത്തിയെ മലയാളത്തിൽ സംക്ഷിപ്തമായി അവതരിപ്പിക്കുന്നു; സന്ദർഭം ഇത് ഒറ്റപ്പെട്ട പ്രവൃത്തിയല്ലെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: τὴν δικαιοσύνην
  choice: നീതി
  rationale: δικαιοσύνηയുടെ ധാർമികമായ നേരായ നടത്തം എന്ന ആശയം നൽകുകയും തുടർന്നുള്ള ‘നീതിമാൻ’ എന്ന cognate ബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: δίκαιός ἐστιν
  choice: നീതിമാനാണ്
  rationale: വ്യക്തിയുടെ നീതിയുള്ള സ്വഭാവം/നില വ്യക്തമാക്കുകയും δικαιοσύνη–δίκαιος പദബന്ധം മലയാളത്തിൽ കഴിയുന്നത്ര സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: καθὼς
  choice: പോലെതന്നെ
  rationale: താരതമ്യത്തിലെ ശക്തമായ അനുരൂപത സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἐκεῖνος
  choice: ആ ഒരുവൻ
  rationale: ഗ്രീക്കിലെ demonstrative രൂപം നിലനിർത്തി, ക്രിസ്തുവോ ദൈവമോ എന്ന ദൈവിക സൂചിതവ്യക്തിയെ മുഖ്യപാഠത്തിൽ മുൻകൂട്ടി നിർണയിക്കുന്നത് ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: ἐκεῖνος എന്ന സർവനാമത്തിന്റെ സൂചിതവ്യക്തി
  choice: മുഖ്യപാഠത്തിൽ ‘ആ ഒരുവൻ’ എന്ന് തുറന്ന നിലയിൽ നിലനിർത്തുന്നു; സമീപസന്ദർഭത്തിൽ ക്രിസ്തുവാണ് ഏറ്റവും സ്വാഭാവികമായ സൂചന.
  alternative: ദൈവം/പിതാവ്; അല്ലെങ്കിൽ ഉദ്ദേശപൂർവം തുറന്നുവച്ച ദൈവിക സൂചന.
  rationale: യോഹന്നാന്റെ രചനകളിലെ നൈതിക അനുകരണസന്ദർഭങ്ങളിൽ ἐκεῖνος പലപ്പോഴും യേശുവിനെ സൂചിപ്പിക്കുന്നു. എങ്കിലും ഗ്രീക്ക് വ്യക്തമായ നാമം നൽകാത്തതിനാൽ വ്യാഖ്യാനപരമായ സംഘർഷം പരിഭാഷയിൽ തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘കുഞ്ഞുമക്കളേ’ ലേഖകന്റെ സ്നേഹപൂർവമായ സംബോധന നിലനിർത്തുന്നു. ‘ആ ഒരുവൻ’ സാധാരണ സംഭാഷണത്തേക്കാൾ അല്പം ഔപചാരികമാണെങ്കിലും മൂലത്തിലെ demonstrative-ഉം അതിന്റെ ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും സംരക്ഷിക്കാൻ ഉദ്ദേശപൂർവം ഉപയോഗിച്ചു.
