id: 1JN.3.17
reference: 1 John 3:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃς δ’ ἂν ἔχῃ τὸν βίον τοῦ κόσμου καὶ θεωρῇ τὸν ἀδελφὸν αὐτοῦ χρείαν ἔχοντα καὶ κλείσῃ τὰ σπλάγχνα αὐτοῦ ἀπ’ αὐτοῦ, πῶς ἡ ἀγάπη τοῦ θεοῦ μένει ἐν αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/017.yaml
  text: But whoever has the world's goods and sees his brother in need[c][b][a], yet closes his heart against him—how does the love of God remain in him?
translation:
  language: ml
  text: എന്നാൽ ഈ ലോകത്തിലെ സമ്പത്ത് ഉള്ളവൻ തന്റെ സഹോദരൻ[a] ആവശ്യത്തിലാണെന്നു കാണുകയും, എന്നിട്ടും അവനോടു കരുണ കാണിക്കാതിരിക്കുകയും ചെയ്താൽ,[b] ദൈവത്തിന്റെ സ്നേഹം[c] അവനിൽ എങ്ങനെ നിലനിൽക്കുന്നു?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സഹോദരനോ സഹോദരിയോ’; ഗ്രീക്കിൽ ‘സഹോദരൻ’ എന്നാണ്. ഇവിടെ അത് ഒരു സഹവിശ്വാസിയെ പ്രതിനിധിയായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘അവനിൽനിന്ന് തന്റെ ആന്തരാവയവങ്ങൾ അടയ്ക്കുന്നു’; ഹൃദയത്തിൽനിന്നുള്ള കരുണ തടഞ്ഞുവയ്ക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ഭാഷാശൈലി.
    reason: lexical_alternative
  - marker: c
    text: ‘ദൈവത്തിന്റെ സ്നേഹം’ എന്നത് അവനിൽ നിലനിൽക്കുന്ന ദൈവത്തിന്റെ സ്നേഹത്തെയോ അവന് ദൈവത്തോടുള്ള സ്നേഹത്തെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: βίον τοῦ κόσμου
  choice: ഈ ലോകത്തിലെ ഉപജീവനസാധനങ്ങൾ
  rationale: βίος ഇവിടെ അമൂർത്തമായ ‘ജീവൻ’ എന്നതിലുപരി ജീവിക്കാനുള്ള ഭൗതിക വിഭവങ്ങളെയും സ്വത്തിനെയും സൂചിപ്പിക്കുന്നു. ആവശ്യത്തിലിരിക്കുന്ന സഹോദരനെ സഹായിക്കുന്ന സന്ദർഭത്തിൽ ‘ഉപജീവനസാധനങ്ങൾ’ അർത്ഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: θεωρῇ
  choice: കണ്ടിട്ടും
  rationale: θεωρέω നേരിട്ട് കാണുകയും അവസ്ഥ മനസ്സിലാക്കുകയും ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; ഇളവുനൽകുന്ന concessive ഘടനയിൽ ‘കണ്ടിട്ടും’ മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: ἀδελφὸν αὐτοῦ
  choice: തന്റെ സഹോദരൻ
  rationale: ഗ്രീക്ക് പദം പുല്ലിംഗ ഏകവചനമാണ്. യോഹന്നാന്റെ പ്രയോഗത്തിൽ ഇത് സഹവിശ്വാസിയെ പ്രതിനിധിയായി സൂചിപ്പിക്കാമെങ്കിലും മുഖ്യപാഠത്തിൽ മൂലപദത്തിന്റെ ലിംഗരൂപം നിലനിർത്തുന്നു.
- source_word: χρείαν ἔχοντα
  choice: ആവശ്യത്തിലാണെന്ന്
  rationale: അക്ഷരാർഥത്തിൽ ‘ആവശ്യം ഉള്ളവൻ’ എന്ന ആശയം; ‘ആവശ്യത്തിലാണെന്ന്’ ആ അവസ്ഥയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: κλείσῃ τὰ σπλάγχνα αὐτοῦ ἀπ’ αὐτοῦ
  choice: അവനോടുള്ള തന്റെ കരുണ അടച്ചുകളയുന്നുവെങ്കിൽ
  rationale: σπλάγχνα അക്ഷരാർഥത്തിൽ ആന്തരാവയവങ്ങൾ; ഭാഷാശൈലിയിൽ ആഴമുള്ള കരുണ. ‘കരുണ അടച്ചുകളയുക’ എന്ന രൂപം മൂലത്തിലെ ദൃശ്യരൂപവും മനപ്പൂർവമായ കരുണനിഷേധവും നിലനിർത്തുന്നു.
- source_word: πῶς
  choice: എങ്ങനെ
  rationale: റെടോറിക്കൽ ചോദ്യത്തിന്റെ ഗ്രീക്ക് രൂപം നിലനിർത്തുന്നു; ‘എങ്ങനെ കഴിയും’ എന്നു ചേർത്ത് വ്യാഖ്യാനാത്മകമായ modal ശക്തി ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ സ്നേഹം
  rationale: τοῦ θεοῦ എന്ന genitive ദൈവത്തിൽനിന്നുള്ള സ്നേഹമെന്നോ ദൈവത്തോടുള്ള സ്നേഹമെന്നോ ഗ്രഹിക്കാവുന്നതാണ്. ‘ദൈവത്തിന്റെ സ്നേഹം’ ഈ യഥാർഥ ദ്വയാർഥത സംരക്ഷിക്കുന്നു.
- source_word: μένει ἐν αὐτῷ
  choice: അവനിൽ വസിക്കുന്നു
  rationale: μένω യോഹന്നാന്റെ രചനകളിലെ പ്രധാന പദമാണ്; ‘വസിക്കുന്നു’ തുടർച്ചയായ ഉള്ളിരിപ്പിന്റെയും ബന്ധത്തിന്റെയും ആശയം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നവിധം നൽകുന്നു.
theological_decisions:
- issue: ‘ദൈവത്തിന്റെ സ്നേഹം’ എന്ന genitive പ്രയോഗത്തിന്റെ ദ്വയാർഥത
  choice: ദൈവത്തിന്റെ സ്നേഹം
  alternative: ദൈവം അവനോടു കാണിക്കുന്ന സ്നേഹം / അവന് ദൈവത്തോടുള്ള സ്നേഹം
  rationale: ഗ്രീക്കിൽ രണ്ടുവായനകൾക്കും സാധ്യതയുണ്ട്; ദൈവിക സ്നേഹം സ്വീകരിക്കുന്നതും പ്രകടിപ്പിക്കുന്നതും യോഹന്നാന്റെ ചിന്തയിൽ പരസ്പരം ബന്ധപ്പെട്ടിരിക്കുന്നു. അതിനാൽ മുഖ്യപാഠം ഒന്നിനെ മാത്രം നിർണയിക്കുന്നില്ല.
- issue: ἀδελφὸν എന്ന പദത്തിന്റെ ലിംഗവും വ്യാപ്തിയും
  choice: സഹോദരൻ
  alternative: സഹോദരനോ സഹോദരിയോ / സഹവിശ്വാസി
  rationale: മൂലപദം പുല്ലിംഗ ഏകവചനമായതിനാൽ അത് മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; സഹോദരിയെ ഉൾപ്പെടെ സഹവിശ്വാസിയെ പ്രതിനിധിയായി സൂചിപ്പിക്കാവുന്ന വ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. റെടോറിക്കൽ ചോദ്യവും യോഹന്നാന്റെ ‘വസിക്കുക’ എന്ന ബന്ധാത്മക ആശയവും genitive ദ്വയാർഥതയും സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
