id: 1JN.3.5
reference: 1 John 3:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ οἴδατε ὅτι ἐκεῖνος ἐφανερώθη ἵνα τὰς ⸀ἁμαρτίας ἄρῃ, καὶ ἁμαρτία ἐν αὐτῷ οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/005.yaml
  text: And you know that he appeared in order to take away sins[b][a], and in him there is no sin.
translation:
  language: ml
  text: കൂടാതെ, അവൻ പാപങ്ങളെ നീക്കിക്കളയാൻ[b] പ്രത്യക്ഷനായി[a] എന്നും അവനിൽ പാപമില്ലെന്നും നിങ്ങൾ അറിയുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വെളിപ്പെടുത്തപ്പെട്ടു.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘പാപങ്ങളെ വഹിച്ചുനീക്കാൻ.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘നീക്കിക്കളയുക,’ ‘അകറ്റുക,’ ‘വഹിച്ചുനീക്കുക’ എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδατε
  choice: നിങ്ങൾ അറിയുന്നു
  rationale: οἶδα എന്ന പൂർണരൂപം കൊയ്നേ ഗ്രീക്കിൽ സാധാരണയായി വർത്തമാനകാല അർഥത്തിലാണ് ഉപയോഗിക്കുന്നത്; അതിനാൽ സ്വാഭാവികമായ മലയാളരൂപം സ്വീകരിച്ചു.
- source_word: ἐκεῖνος
  choice: അവൻ
  rationale: പദശഃ ‘ആ വ്യക്തി’ എന്ന ഊന്നൽ ഉണ്ടാകാമെങ്കിലും, യോഹന്നാന്റെ ഈ സന്ദർഭത്തിൽ ഇത് യേശുക്രിസ്തുവിനെ സൂചിപ്പിക്കുന്നു; മുൻസന്ദർഭം വ്യക്തമായതിനാൽ ‘അവൻ’ സ്വാഭാവികമാണ്.
- source_word: ἐφανερώθη
  choice: പ്രത്യക്ഷനായി
  rationale: ക്രിസ്തുവിന്റെ ചരിത്രപരമായ പ്രത്യക്ഷപ്പെടലിനെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്. ഗ്രീക്കിലെ നിഷ്ക്രിയരൂപത്തിന്റെ ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കാൻ ‘പ്രത്യക്ഷനായി’ ഉപയോഗിച്ചു; ‘വെളിപ്പെടുത്തപ്പെട്ടു’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: ἵνα
  choice: -ആൻ
  rationale: ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന ἵναയുടെ ശക്തി ‘നീക്കിക്കളയാൻ’ എന്ന ഉദ്ദേശ്യാർഥക ക്രിയാരൂപത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἁμαρτίας
  choice: പാപങ്ങളെ
  rationale: ഗ്രീക്കിലെ ബഹുവചനം നിലനിർത്തി, പാപപ്രവൃത്തികളുടെ concrete plurality മലയാളത്തിൽ വ്യക്തമാക്കി.
- source_word: ἄρῃ
  choice: നീക്കിക്കളയാൻ
  rationale: αἴρω എന്ന ക്രിയയ്ക്ക് ഉയർത്തുക, വഹിക്കുക, അകറ്റുക, നീക്കുക എന്നീ അർഥങ്ങൾ വരാം. ഇവിടെ പാപങ്ങളെ ഇല്ലാതാക്കുക/അകറ്റുക എന്ന ആശയം വ്യക്തമായി നൽകുകയും പ്രായശ്ചിത്തത്തിന്റെ രീതി അനാവശ്യമായി നിർണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἁμαρτία
  choice: പാപം
  rationale: ഏകവചനത്തിലുള്ള ഈ നാമം ക്രിസ്തുവിന്റെ സമ്പൂർണ പാപരാഹിത്യം ലളിതമായും നേരിട്ടും പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐν αὐτῷ
  choice: അവനിൽ
  rationale: ἐν + ദത്തിവിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം; യോഹന്നാന്റെ പ്രയോഗശൈലിയും ദൈവശാസ്ത്രപരമായ പ്രതിധ്വനിയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἐκεῖνος എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: യേശുക്രിസ്തുവിനെ സൂചിപ്പിക്കുന്ന ‘അവൻ’
  alternative: കൂടുതൽ പദശഃ ‘ആ വ്യക്തി’
  rationale: പാപങ്ങളെ നീക്കിക്കളയാൻ പ്രത്യക്ഷനായതും പാപമില്ലാത്തവനുമായ വ്യക്തി സമീപസന്ദർഭത്തിൽ യേശുക്രിസ്തുവാണ്. അധികമായ സിദ്ധാന്തഭാഷ ചേർക്കാതെ ഈ സൂചന വ്യക്തമാക്കുന്നു.
- issue: പാപങ്ങളോടൊപ്പം αἴρω എന്ന ക്രിയയുടെ അർഥം
  choice: പാപങ്ങളെ നീക്കിക്കളയുക
  alternative: പാപങ്ങളെ വഹിച്ചുകൊണ്ടുപോകുക
  rationale: ക്രിസ്തുവിന്റെ പ്രത്യക്ഷപ്പെടലിന്റെ ഉദ്ദേശ്യം പാപങ്ങളുടെ നീക്കമാണെന്ന വാക്യത്തിന്റെ ഊന്നൽ സംരക്ഷിക്കുന്നു. ഒരു പ്രത്യേക പ്രായശ്ചിത്തസിദ്ധാന്തത്തിലേക്ക് അർഥം ചുരുക്കാതെ ഗ്രീക്കിലെ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. വാക്യത്തിന്റെ യോഹന്നാനീയമായ സംക്ഷിപ്തതയും ‘അവനിൽ പാപം ഇല്ല’ എന്ന നേരിട്ടുള്ള ദൈവശാസ്ത്രപ്രസ്താവനയും നിലനിർത്തി.
