id: 1JN.3.21
reference: 1 John 3:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀγαπητοί, ἐὰν ἡ καρδία ⸂μὴ καταγινώσκῃ ἡμῶν⸃, παρρησίαν ἔχομεν πρὸς τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/021.yaml
  text: Beloved[a], if our heart does not condemn us, we have confidence before God[c][b],
translation:
  language: ml
  text: പ്രിയപ്പെട്ടവരേ, നമ്മുടെ ഹൃദയം[c] നമ്മെ കുറ്റം വിധിക്കുന്നില്ലെങ്കിൽ[a], ദൈവസന്നിധിയിൽ നമുക്ക് ആത്മവിശ്വാസമുണ്ട്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നമ്മെ കുറ്റപ്പെടുത്തുന്നില്ല’ അല്ലെങ്കിൽ ‘നമ്മിൽ കുറ്റം കണ്ടെത്തുന്നില്ല.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ധൈര്യം’ അല്ലെങ്കിൽ ‘ദൈവസന്നിധിയിൽ ഉറപ്പ്.’
    reason: lexical_alternative
  - marker: c
    text: ഇവിടെ ‘ഹൃദയം’ എന്നത് ആന്തരിക വ്യക്തിത്വത്തെയോ ധാർമിക സ്വയംബോധത്തെയോ സൂചിപ്പിക്കുന്നു; ‘മനസ്സാക്ഷി’ എന്ന ആശയത്തോടു താരതമ്യം ചെയ്യുക.
    reason: cultural_note
lexical_decisions:
- source_word: ἀγαπητοί
  choice: പ്രിയപ്പെട്ടവരേ
  rationale: സ്നേഹപൂർവമായ ബഹുവചന സംബോധനയായി സ്വാഭാവികമാണ്; 1 യോഹന്നാനിലെ സ്നേഹഭാഷയുമായുള്ള ബന്ധവും നിലനിർത്തുന്നു.
- source_word: ἐὰν
  choice: എങ്കിൽ
  rationale: സാധ്യത സൂചിപ്പിക്കുന്ന വ്യവസ്ഥാവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: καρδία
  choice: ഹൃദയം
  rationale: ഉറവിടത്തിലെ രൂപകം സംരക്ഷിക്കുന്നു; അതിനെ പ്രധാനപാഠത്തിൽ കൂടുതൽ പരിമിതമായ ‘മനസ്സാക്ഷി’ എന്ന ആശയമായി ചുരുക്കുന്നില്ല.
- source_word: μὴ καταγινώσκῃ ἡμῶν
  choice: നമ്മെ കുറ്റം വിധിക്കുന്നില്ല
  rationale: καταγινώσκω എന്ന പദത്തിലെ കുറ്റപ്പെടുത്തലിന്റെയും പ്രതികൂലവിധിയുടെയും ഭാവം നിലനിർത്തുന്നു; മുൻവാക്യത്തിന്റെ പശ്ചാത്തലത്തോടും യോജിക്കുന്നു.
- source_word: παρρησίαν
  choice: ആത്മവിശ്വാസം
  rationale: ദൈവസന്നിധിയിലെ തുറന്ന, ഭയമില്ലാത്ത നിലപാടിനെ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു; ‘ധാർഷ്ട്യം’ എന്ന തെറ്റായ ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: πρὸς τὸν θεόν
  choice: ദൈവസന്നിധിയിൽ
  rationale: ദൈവത്തോടുള്ള ബന്ധത്തെയും ദൈവത്തിന്റെ മുമ്പിലുള്ള നിലയെയും സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: καρδία സൂചിപ്പിക്കുന്ന ആന്തരിക ശേഷി
  choice: ഹൃദയം
  alternative: മനസ്സാക്ഷി
  rationale: വാക്യത്തിൽ കുറ്റം വിധിക്കുന്ന ആന്തരിക സ്വയംബോധം ഉദ്ദേശിക്കപ്പെടുന്നുവെങ്കിലും, ‘ഹൃദയം’ യോഹന്നാന്റെ രൂപകവും അർത്ഥവ്യാപ്തിയും സംരക്ഷിക്കുന്നു.
- issue: ദൈവത്തോടുള്ള ബന്ധത്തിൽ παρρησίαν എന്നതിന്റെ ഭാവം
  choice: ദൈവസന്നിധിയിൽ ആത്മവിശ്വാസം
  alternative: ദൈവത്തിന്റെ മുമ്പാകെ ധൈര്യം; ദൈവസന്നിധിയിൽ ഉറപ്പ്
  rationale: ദൈവസന്നിധിയിലെ തുറന്നതും ലജ്ജയില്ലാത്തതുമായ നിലപാട് വ്യക്തമാക്കുന്നു; വികാരപരമായ ഉറപ്പായി മാത്രം ചുരുക്കാതെയും അനാദരവായ ധൈര്യമായി അതിശയിപ്പിക്കാതെയും ഇരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ ശൈലി. ഉറവിടത്തിലെ ഹൃദയരൂപകവും വ്യവസ്ഥാവാക്യവും സംരക്ഷിച്ചുകൊണ്ട്, ദൈവസന്നിധിയിലെ παρρησίαയുടെ ബന്ധപരമായ ഭാവം സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
