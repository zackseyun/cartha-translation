id: 1JN.3.22
reference: 1 John 3:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὃ ⸀ἐὰν αἰτῶμεν λαμβάνομεν ⸀ἀπ’ αὐτοῦ, ὅτι τὰς ἐντολὰς αὐτοῦ τηροῦμεν καὶ τὰ ἀρεστὰ ἐνώπιον αὐτοῦ ποιοῦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/022.yaml
  text: And whatever we ask[a], we receive from him, because we keep his commandments and do what is pleasing in his sight.
translation:
  language: ml
  text: നാം എന്തു ചോദിച്ചാലും നമുക്ക് അവനിൽനിന്ന് ലഭിക്കുന്നു; കാരണം, നാം അവന്റെ കല്പനകൾ പാലിക്കുകയും അവന്റെ മുമ്പാകെ[a] പ്രസാദകരമായത് ചെയ്യുകയും ചെയ്യുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവന്റെ ദൃഷ്ടിയിൽ.’
    reason: ἐνώπιον αὐτοῦ എന്നതിന് സാധ്യമായ സ്വാഭാവിക പദാന്തരം.
lexical_decisions:
- source_word: ὃ ἐὰν
  choice: എന്തു ... ആയാലും
  rationale: ἐάν ചേർന്ന അനിശ്ചിത സാപേക്ഷപ്രയോഗത്തിന്റെ ‘whatever’ എന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ ‘എന്തു ചോദിച്ചാലും’ എന്നു നൽകി.
- source_word: αἰτῶμεν
  choice: നാം ചോദിച്ചാലും
  rationale: പ്രാർഥനാപരമായ അപേക്ഷയുടെ സന്ദർഭത്തിൽ αἰτέω എന്നതിന്റെ സാധാരണ അർഥമായ ‘ചോദിക്കുക’ നിലനിർത്തുന്നു.
- source_word: λαμβάνομεν
  choice: നമുക്ക് ലഭിക്കുന്നു
  rationale: വർത്തമാനകാലത്തിന്റെ പൊതുവായ പ്രസ്താവനാഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ‘നേടുന്നു’ എന്നതിനെക്കാൾ സന്ദർഭോചിതമാണ്.
- source_word: ἀπ’ αὐτοῦ
  choice: അവനിൽനിന്നു
  rationale: ἀπό സഹിതമുള്ള ഷഷ്ഠി ഉറവിടത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അവനിൽനിന്നു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: ὅτι
  choice: കാരണം
  rationale: ഇവിടെ ὅτι ചോദിക്കുന്നതു ലഭിക്കുന്നതിന്റെ കാരണം വ്യക്തമാക്കുന്നു; മൂലപാഠത്തിലെ കാരണബന്ധം ക്ഷയിപ്പിക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: τὰς ἐντολὰς αὐτοῦ
  choice: അവന്റെ കല്പനകൾ
  rationale: യോഹന്നാന്റെ രചനകളിലെ ἐντολή എന്ന പദത്തിന്റെ നൈതിക-ദൈവശാസ്ത്രപരമായ തുടർച്ച നിലനിർത്തുന്ന പരിചിതമായ മലയാളപദമാണ് ‘കല്പനകൾ’.
- source_word: τηροῦμεν
  choice: നാം ... പാലിക്കുന്നു
  rationale: കല്പനകൾ കാത്തുസൂക്ഷിച്ച് അനുസരിക്കുക എന്ന τηρέωയുടെ ആശയം ആധുനിക മലയാളത്തിൽ ‘പാലിക്കുക’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὰ ἀρεστὰ
  choice: പ്രസാദകരമായതു
  rationale: നാമവൽക്കരിച്ച നപുംസക ബഹുവചന വിശേഷണം സൂചിപ്പിക്കുന്ന ‘pleasing things/what is pleasing’ എന്ന വിശാലമായ അർഥം അതിരുകടന്ന് വിശദീകരിക്കാതെ നൽകുന്നു.
- source_word: ἐνώπιον αὐτοῦ
  choice: അവന്റെ മുമ്പാകെ
  rationale: ‘അവന്റെ സന്നിധിയിൽ/ദൃഷ്ടിയിൽ’ എന്ന ആശയം ഉൾക്കൊള്ളുന്ന സുതാര്യവും ഗൗരവമുള്ളതുമായ പരിഭാഷ; ‘അവന്റെ ദൃഷ്ടിയിൽ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
- source_word: ποιοῦμεν
  choice: പ്രവർത്തിക്കുകയും ചെയ്യുന്നു
  rationale: ποιέωയുടെ പൊതുവായ ‘ചെയ്യുക’ എന്ന അർഥം മലയാളവാക്യത്തിൽ അനാവശ്യ ആവർത്തനം ഒഴിവാക്കി സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: പ്രാർഥനയ്ക്ക് ഉത്തരം ലഭിക്കുന്നതും കല്പനകൾ പാലിക്കുന്നതും തമ്മിലുള്ള ബന്ധം
  choice: വിശ്വാസികൾ അവന്റെ കല്പനകൾ പാലിക്കുകയും അവന്റെ മുമ്പാകെ പ്രസാദകരമായതു ചെയ്യുകയും ചെയ്യുന്നതിനാലാണ് അവനിൽനിന്നു ലഭിക്കുന്നതെന്ന പാഠത്തിലെ കാരണബന്ധം അതേപടി നിലനിർത്തി.
  alternative: ഇവ രണ്ടും തമ്മിൽ വെറും ബന്ധമുണ്ടെന്ന രീതിയിൽ ‘കാരണം’ എന്ന ശക്തി മയപ്പെടുത്തുക.
  rationale: ഗ്രീക്കിലെ ὅτι വ്യക്തമായ കാരണം അവതരിപ്പിക്കുന്നു. അതിനെ യാന്ത്രികമായ പ്രാർഥനാസൂത്രമായി വികസിപ്പിക്കാതെയും കാരണബന്ധം ദുർബലപ്പെടുത്താതെയും പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ‘കല്പനകൾ,’ ‘മുമ്പാകെ,’ ‘പ്രസാദകരമായതു’ എന്നിവ യോഹന്നാന്റെ ആശയശൃംഖലയും മൂലപാഠത്തിന്റെ ഔപചാരിക ഭാവവും സംരക്ഷിക്കുന്നു.
