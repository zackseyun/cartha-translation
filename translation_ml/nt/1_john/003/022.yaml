revisions:
- from: നാം എന്തു ചോദിച്ചാലും അവനിൽനിന്നു ലഭിക്കുന്നു; കാരണം, നാം അവന്റെ കല്പനകൾ പാലിക്കുകയും അവന്റെ മുമ്പാകെ[a] പ്രസാദകരമായതു പ്രവർത്തിക്കുകയും ചെയ്യുന്നു.
  to: നാം എന്തു ചോദിച്ചാലും നമുക്ക് അവനിൽനിന്ന് ലഭിക്കുന്നു; കാരണം, നാം അവന്റെ കല്പനകൾ പാലിക്കുകയും അവന്റെ മുമ്പാകെ[a] പ്രസാദകരമായത് ചെയ്യുകയും ചെയ്യുന്നു.
