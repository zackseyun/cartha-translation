id: 1JN.3.4
reference: 1 John 3:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Πᾶς ὁ ποιῶν τὴν ἁμαρτίαν καὶ τὴν ἀνομίαν ποιεῖ, καὶ ἡ ἁμαρτία ἐστὶν ἡ ἀνομία.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/004.yaml
  text: Everyone who practices sin also practices lawlessness[b][a], and sin is lawlessness.
translation:
  language: ml
  text: പാപം ചെയ്യുന്ന ഏവനും നിയമരാഹിത്യവും ചെയ്യുന്നു[a]; പാപം നിയമരാഹിത്യമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പാപം ചെയ്തുകൊണ്ടിരിക്കുന്ന ഏവനും നിയമരാഹിത്യവും ചെയ്തുകൊണ്ടിരിക്കുന്നു.” ഗ്രീക്കിലെ വർത്തമാനകാലരൂപങ്ങൾ സന്ദർഭത്തിൽ തുടരുന്നതോ സ്വഭാവസവിശേഷമായതോ ആയ പ്രവൃത്തിയെ സൂചിപ്പിക്കാം; മലയാളത്തിലെ “ചെയ്യുന്ന/ചെയ്യുന്നു” എന്ന ലളിതവർത്തമാനരൂപം ആ ഭാവം നിർബന്ധിതമായ തുടർച്ചയായി അതിശയിപ്പിക്കാതെ പ്രകടിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς ὁ ποιῶν
  choice: ചെയ്തുകൊണ്ടിരിക്കുന്ന ഏവനും
  rationale: ആർട്ടിക്കിളോടുകൂടിയ വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ പൊതുവായ പ്രയോഗവും തുടരുന്ന അഥവാ സ്വഭാവസവിശേഷമായ പ്രവൃത്തിയുടെ ഭാവവും ഇത് സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ഒറ്റപ്പെട്ട ഒരു പ്രവൃത്തി മാത്രമാണെന്ന ധാരണ ഒഴിവാക്കുന്നു.
- source_word: τὴν ἁμαρτίαν
  choice: പാപം
  rationale: ഗ്രീക്കിൽ ആർട്ടിക്കിൾ ഉണ്ടെങ്കിലും ഇവിടെ ഒരു പ്രത്യേക പാപകൃതിയെയല്ല, പാപത്തെ പൊതുവായ വിഭാഗമായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ആർട്ടിക്കിൾ പ്രത്യേകം പ്രതിഫലിപ്പിക്കേണ്ടതില്ല.
- source_word: καὶ τὴν ἀνομίαν ποιεῖ
  choice: നിയമരാഹിത്യവും ചെയ്തുകൊണ്ടിരിക്കുന്നു
  rationale: ποιῶν/ποιεῖ എന്ന ക്രിയാപരമായ സമാന്തരത ആവർത്തിച്ചുകൊണ്ട് നിലനിർത്തുകയും καί എന്നതിന്റെ ‘-വും’ എന്ന അർഥം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ἀνομία
  choice: നിയമരാഹിത്യം
  rationale: νόμος എന്ന ‘നിയമം’ എന്ന ആശയത്തോടുള്ള പദബന്ധം കാത്തുസൂക്ഷിക്കുന്ന നേരിട്ടുള്ള സമാനപദമാണിത്. ‘നിയമലംഘനം’ എന്നത് അർഥം ചുരുക്കാം; ‘അധർമ്മം’ മൂലപദത്തിന്റെ നിയമബന്ധം മറയ്ക്കാം.
- source_word: καὶ ἡ ἁμαρτία ἐστὶν ἡ ἀνομία
  choice: പാപം നിയമരാഹിത്യം തന്നെയാണ്
  rationale: യോഹന്നാന്റെ സംക്ഷിപ്തമായ നിർവചനസമത്വം ‘തന്നെയാണ്’ എന്ന പ്രയോഗം വ്യക്തമായി നിലനിർത്തുന്നു; അതിനെ വെറും ഫലമോ ഉദാഹരണമോ ആക്കി മൃദൂകരിക്കുന്നില്ല.
theological_decisions:
- issue: വർത്തമാനകാല ക്രിയാരൂപങ്ങളെ ഒറ്റ പ്രവൃത്തിയായോ തുടരുന്ന/സ്വഭാവസവിശേഷമായ പ്രവൃത്തിയായോ പരിഭാഷപ്പെടുത്തുക
  choice: ‘ചെയ്തുകൊണ്ടിരിക്കുന്ന’ എന്ന തുടരുന്ന പ്രവൃത്തിയുടെ രൂപം
  alternative: ‘ചെയ്യുന്ന’ അല്ലെങ്കിൽ ‘ചെയ്യുന്നവൻ’
  rationale: സമീപസന്ദർഭത്തിൽ വർത്തമാനകാലരൂപങ്ങൾക്ക് തുടരുന്ന അഥവാ സ്വഭാവസവിശേഷമായ പെരുമാറ്റത്തിന്റെ ഭാവമുണ്ട്. എന്നാൽ സാങ്കേതികമായി നിർബന്ധിതമായ ‘പതിവ്’ എന്ന ആശയം ചേർക്കുന്നില്ല.
- issue: ἀνομία എന്ന പദത്തിന്റെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തി
  choice: നിയമരാഹിത്യം
  alternative: നിയമലംഘനം; അധർമ്മം
  rationale: പാപത്തെയും ἀνομίαയെയും തുല്യമാക്കുന്ന വാക്യത്തിന്റെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം നിലനിർത്തുന്നു; മോശെയുടെ ന്യായപ്രമാണത്തെയോ സിവിൽ നിയമത്തെയോ മാത്രം ഉദ്ദേശിക്കുന്നു എന്ന് നിർണ്ണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ ആവർത്തനവും നിർവചനത്തിന്റെ തീക്ഷ്ണതയും നിലനിർത്തി. ‘നിയമരാഹിത്യം’ സാധാരണ സംസാരത്തിൽ കുറച്ച് ഔപചാരികമായിരിക്കാമെങ്കിലും ἀνομίαയുടെ നിയമബന്ധവും ദൈവശാസ്ത്രപരമായ വ്യാപ്തിയും ഏറ്റവും നന്നായി സംരക്ഷിക്കുന്നു.
