id: 1JN.3.15
reference: 1 John 3:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πᾶς ὁ μισῶν τὸν ἀδελφὸν αὐτοῦ ἀνθρωποκτόνος ἐστίν, καὶ οἴδατε ὅτι πᾶς ἀνθρωποκτόνος οὐκ ἔχει ζωὴν αἰώνιον ἐν ⸀αὐτῷ μένουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/015.yaml
  text: Everyone who hates his brother is a murderer[b][a], and you know that every murderer does not have eternal life remaining in him.
translation:
  language: ml
  text: തന്റെ സഹോദരനെ[a] വെറുക്കുന്നവൻ കൊലപാതകനാണ്; ഒരു കൊലപാതകനിലും നിത്യജീവൻ വസിക്കുന്നില്ലെന്ന് നിങ്ങൾക്കറിയാം.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സഹോദരൻ’ എന്നത് ഈ സന്ദർഭത്തിൽ ഒരു സഹവിശ്വാസിയെ സൂചിപ്പിക്കാനാണ് സാധ്യത; ഗ്രീക്കിൽ ഇത് ഏകവചന പുല്ലിംഗമാണ്.
    reason: cultural_note
  - marker: b
    text: അഥവാ, “നിത്യജീവൻ അവനിൽ നിലനിൽക്കുന്നില്ല.” യോഹന്നാന്റെ രചനകളിൽ μένω എന്ന ക്രിയ ‘വസിക്കുക’ അല്ലെങ്കിൽ ‘നിലനിൽക്കുക’ എന്നർത്ഥത്തിൽ ആവർത്തിച്ചു വരുന്ന ഒരു പ്രധാന പദമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ μισῶν
  choice: വെറുക്കുന്നവൻ
  rationale: നാമവാചകമായി ഉപയോഗിച്ചിരിക്കുന്ന വർത്തമാനകാല കൃദന്തം ഒരു പൊതുവിഭാഗത്തെയും സ്വഭാവസവിശേഷമായ പ്രവൃത്തിയെയും സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ രൂപം സ്വാഭാവികമായി അതു പകർന്നുനൽകുന്നു.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: തന്റെ സഹോദരനെ
  rationale: ഗ്രീക്ക് പദപ്രയോഗത്തിന്റെ ഏകവചന പുല്ലിംഗരൂപം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ വിശ്വാസസമൂഹത്തിലെ സഹവിശ്വാസിയെയാണ് പ്രധാനമായി സൂചിപ്പിക്കുന്നത്.
- source_word: ἀνθρωποκτόνος
  choice: കൊലപാതകൻ
  rationale: മനുഷ്യനെ കൊല്ലുന്നവൻ എന്ന ശക്തമായ ധാർമ്മിക അർത്ഥം നൽകുന്ന, ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക തത്തുല്യപദമാണിത്.
- source_word: οἴδατε
  choice: നിങ്ങൾക്കറിയാം
  rationale: രണ്ടാംപുരുഷ ബഹുവചനം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: πᾶς ἀνθρωποκτόνος οὐκ ἔχει
  choice: ഒരു കൊലപാതകനിലും ... ഇല്ല
  rationale: നിഷേധിക്കപ്പെട്ട സാർവത്രിക പ്രസ്താവനയുടെ അർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; ഓരോ കൊലപാതകനെയും ഉൾക്കൊള്ളുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ വ്യാപ്തി നഷ്ടപ്പെടുന്നില്ല.
- source_word: ζωὴν αἰώνιον
  choice: നിത്യജീവൻ
  rationale: യോഹന്നാന്റെ രചനകളിൽ സ്ഥാപിതവും അർത്ഥസമ്പന്നവുമായ മലയാള പ്രയോഗം; ജീവിതത്തിന്റെ അനന്തതയും ദൈവിക ഗുണവും സൂചിപ്പിക്കുന്നു.
- source_word: ἐν αὐτῷ μένουσαν
  choice: അവനിൽ വസിക്കുന്നില്ല
  rationale: μένω എന്ന യോഹന്നാനീയ മുഖ്യപദത്തിന്റെ സ്ഥിരമായി തുടരുക/വസിക്കുക എന്ന ആശയം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു; കൂടുതൽ രൂപസമാനമായ മറ്റൊരു പരിഭാഷ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘സഹോദരൻ’ എന്നതിന്റെ വ്യാപ്തി
  choice: പ്രധാനപാഠത്തിൽ ‘തന്റെ സഹോദരനെ’ എന്നു നിലനിർത്തി, സന്ദർഭപരമായ അർത്ഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
  alternative: സഹവിശ്വാസിയെ; സഹോദരനെയോ സഹോദരിയെയോ
  rationale: സന്ദർഭം വിശ്വാസസമൂഹത്തിനുള്ളിലെ സ്നേഹത്തെക്കുറിച്ചാണെങ്കിലും ഗ്രീക്ക് ഏകവചന പുല്ലിംഗരൂപമാണ്; അതിനെ ഉൾക്കൊള്ളുന്ന പരാവർത്തനമായി പ്രധാനപാഠത്തിൽ മാറ്റാതെ മൂലരൂപവും സാധ്യതയുള്ള സന്ദർഭാർഥവും സംരക്ഷിക്കുന്നു.
- issue: യോഹന്നാനീയ μένω എന്ന ക്രിയയുടെ പരിഭാഷ
  choice: ‘വസിക്കുന്നു’
  alternative: നിലനിൽക്കുന്നു; വസിച്ചുകൊണ്ടിരിക്കുന്നു
  rationale: ക്രിയയുടെ തുടരുന്ന അന്തർവാസം/സ്ഥിരത എന്ന ദൈവശാസ്ത്രപരമായ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ഒരൊറ്റ സാങ്കേതിക വ്യാഖ്യാനത്തിലേക്ക് അർത്ഥത്തെ ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള മലയാളം. ആദ്യവാക്യത്തിലെ നേരിട്ടുള്ള ധാർമ്മിക ശക്തി നിലനിർത്തുകയും രണ്ടാംവാക്യത്തിലെ ഗ്രീക്ക് നിഷേധസാർവത്രികം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും ചെയ്തു.
