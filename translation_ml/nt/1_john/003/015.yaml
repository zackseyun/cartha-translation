  source_fidelity: 'മുഖ്യാർഥം കൃത്യമാണ്: വെറുക്കുന്ന ഏവനെയും കൊലപാതകനെന്നു വിശേഷിപ്പിക്കുകയും, ഒരു കൊലപാതകനിലും നിത്യജീവൻ വസിക്കുന്നില്ലെന്ന സാർവത്രിക നിഷേധം ശരിയായി പകരുകയും ചെയ്യുന്നു. എന്നാൽ ഗ്രീക്കിലെ καὶ (‘and’) സൂചിപ്പിക്കുന്ന വാക്യബന്ധം നിലവിലെ രണ്ടു വേർതിരിച്ച വാക്യങ്ങളിൽ മങ്ങിപ്പോകുന്നു.'
  naturalness: ‘തന്റെ സഹോദരനെ വെറുക്കുന്നവൻ’, ‘കൊലപാതകൻ’, ‘നിത്യജീവൻ’, ‘നിങ്ങൾക്കറിയാം’ എന്നിവ ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്. അർധവിരാമം ഉപയോഗിക്കുന്നത് വാക്യബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കും.
  terminology: ‘സഹോദരൻ’ ഗ്രീക്കിലെ ഏകവചന പുല്ലിംഗരൂപം സംരക്ഷിക്കുന്നു; സന്ദർഭാർഥമായ സഹവിശ്വാസി എന്ന സാധ്യത അടിക്കുറിപ്പിൽ ഉചിതമായി നൽകിയിരിക്കുന്നു. ‘നിത്യജീവൻ’യും ‘വസിക്കുന്നു’യും യോഹന്നാന്റെ പദപ്രയോഗത്തിന് യോജിക്കുന്നു. lexical അടിക്കുറിപ്പിൽ ബദൽവാചകം പൂർണമായി നൽകുന്നതാണ് കൂടുതൽ വ്യക്തം.
