  rationale: വിവർത്തനത്തിന്റെ അടിസ്ഥാന പദചോയിസുകൾ നിലനിർത്തി. ഗ്രീക്കിലെ καὶ സൂചിപ്പിക്കുന്ന ബന്ധം അർധവിരാമത്തിലൂടെ വീണ്ടെടുത്തു; ‘സഹോദരൻ’ എന്ന വിശദീകരണത്തിന്റെ അടിക്കുറിപ്പ് അതിന്റെ യഥാർഥ ആങ്കറിലേക്കു മാറ്റി; μένω-യുടെ ബദൽപരിഭാഷ പൂർണവാക്യമായി വ്യക്തമാക്കി.
