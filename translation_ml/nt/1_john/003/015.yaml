- from: തന്റെ സഹോദരനെ വെറുക്കുന്നവൻ കൊലപാതകനാണ്.[a] ഒരു കൊലപാതകനിലും നിത്യജീവൻ വസിക്കുന്നില്ലെന്ന് നിങ്ങൾക്കറിയാം.[b]
