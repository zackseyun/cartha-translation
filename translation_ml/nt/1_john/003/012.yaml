id: 1JN.3.12
reference: 1 John 3:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐ καθὼς Κάϊν ἐκ τοῦ πονηροῦ ἦν καὶ ἔσφαξεν τὸν ἀδελφὸν αὐτοῦ· καὶ χάριν τίνος ἔσφαξεν αὐτόν; ὅτι τὰ ἔργα αὐτοῦ πονηρὰ ἦν, τὰ δὲ τοῦ ἀδελφοῦ αὐτοῦ δίκαια.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/012.yaml
  text: not like Cain[a], who was from the evil one and slaughtered his brother. And why did he slaughter him? Because his deeds were evil[b], but those of his brother were righteous.
translation:
  language: ml
  text: കയീനെപ്പോലെ ആകരുത്. അവൻ ദുഷ്ടനിൽനിന്നുള്ളവനായിരുന്നു[a]; തന്റെ സഹോദരനെ അറുത്തുകൊന്നു.[b] അവൻ എന്തുകൊണ്ടാണ് സഹോദരനെ അറുത്തുകൊന്നത്? കാരണം, അവന്റെ പ്രവൃത്തികൾ ദുഷ്ടമായിരുന്നു; അവന്റെ സഹോദരന്റേത് നീതിയുള്ളവയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തിന്മയിൽനിന്നുള്ളവനായിരുന്നു.” ഗ്രീക്ക് പ്രയോഗം അമൂർത്തമായ അർഥത്തിലും മനസ്സിലാക്കാം; എന്നാൽ യോഹന്നാന്റെ രചനകളിൽ അത് സാധാരണയായി വ്യക്തിപരമായ ദുഷ്ടനെ സൂചിപ്പിക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, “കൊലപ്പെടുത്തി.” ഗ്രീക്ക് ക്രിയ കൂടുതൽ ശക്തമാണ്; അക്ഷരാർഥത്തിൽ “അറുത്തുകൊന്നു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ καθὼς Κάϊν
  choice: കയീനെപ്പോലെ ആകരുത്
  rationale: മുൻവാക്യത്തിലെ ആഹ്വാനവുമായി ബന്ധപ്പെടുന്ന നിഷേധാത്മക താരതമ്യം മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐκ τοῦ πονηροῦ
  choice: ദുഷ്ടനിൽനിന്നുള്ളവൻ
  rationale: യോഹന്നാന്റെ പ്രയോഗത്തിൽ വ്യക്തിപരമായ ‘ദുഷ്ടനെ’ സൂചിപ്പിക്കാനുള്ള സാധ്യത പ്രധാനമാണ്; ἐκ സൂചിപ്പിക്കുന്ന ഉറവിടം ‘നിന്ന്’ നിലനിർത്തുന്നു.
- source_word: ἔσφαξεν
  choice: അറുത്തുകൊന്നു
  rationale: സാധാരണ ‘കൊന്നു’ എന്നതിനെക്കാൾ ശക്തവും ദൃശ്യവുമായ σφάζω എന്ന ക്രിയയുടെ ഹിംസാത്മക ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: χάριν τίνος
  choice: എന്തുകൊണ്ടാണ്
  rationale: കാരണം ചോദിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവികമായ ആധുനിക മലയാളരൂപം.
- source_word: τὰ ἔργα αὐτοῦ πονηρὰ ἦν
  choice: അവന്റെ പ്രവൃത്തികൾ ദുഷ്ടമായിരുന്നു
  rationale: ἔργα ഇവിടെ ധാർമിക സ്വഭാവമുള്ള ചെയ്തികളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പ്രവൃത്തികൾ’ അനുയോജ്യം; πονηράയുടെ നൈതിക വൈരുദ്ധ്യം ‘ദുഷ്ടം’ നിലനിർത്തുന്നു.
- source_word: τὰ δὲ τοῦ ἀδελφοῦ αὐτοῦ δίκαια
  choice: സഹോദരന്റേത് നീതിയുള്ളവയായിരുന്നു
  rationale: ഗ്രീക്കിലെ ‘പ്രവൃത്തികൾ’ എന്ന പദത്തിന്റെ ലോപം മലയാളത്തിലും സ്വാഭാവികമായി നിലനിർത്തുകയും δίκαιαയുടെ ധാർമിക അർഥം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: τοῦ πονηροῦ വ്യക്തിപരമായ ‘ദുഷ്ടൻ’ ആണോ അമൂർത്തമായ ‘തിന്മ’ ആണോ
  choice: 'വ്യക്തിപരം: ‘ദുഷ്ടൻ’'
  alternative: 'അമൂർത്തം: ‘തിന്മ’'
  rationale: നിർദ്ദിഷ്ട ഉപപദത്തോടെയുള്ള ഈ പ്രയോഗം യോഹന്നാന്റെ രചനകളിൽ സാധാരണയായി വ്യക്തിപരമായ ദുഷ്ടനെ സൂചിപ്പിക്കുന്നു; എങ്കിലും അമൂർത്ത വായനയുടെ യഥാർഥ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. σφάζωയുടെ തീവ്രത ‘അറുത്തുകൊന്നു’ എന്നു നിലനിർത്തി; വ്യക്തിപരവും അമൂർത്തവുമായ വായനകൾക്കിടയിലെ അർഥസാധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
