revisions:
- from: അവന്റെ കല്പനകൾ പാലിക്കുന്നവൻ അവനിൽ വസിക്കുന്നു[b]; അവനും ആ വ്യക്തിയിൽ വസിക്കുന്നു. അവൻ നമ്മിൽ വസിക്കുന്നുവെന്ന് നാം അറിയുന്നത് ഇതിലൂടെയാണ്—അവൻ നമുക്കു നൽകിയ ആത്മാവിലൂടെ[a].
  to: അവന്റെ കല്പനകൾ പാലിക്കുന്നവൻ അവനിൽ വസിക്കുന്നു[b]; അവനും അവനിൽ വസിക്കുന്നു. അവൻ നമ്മിൽ വസിക്കുന്നു എന്ന് നാം അറിയുന്നത്, അവൻ നമുക്കു നൽകിയ ആത്മാവിലൂടെയാണ്[a].
  rationale: The revision restores the reciprocal pronoun wording of the Greek and makes the final clause idiomatic Malayalam. It retains the consistent rendering ‘വസിക്കുന്നു’ for all three occurrences of μένω and preserves the source/means ambiguity of ἐκ through the footnote.
