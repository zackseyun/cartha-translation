id: 1JN.3.24
reference: 1 John 3:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὁ τηρῶν τὰς ἐντολὰς αὐτοῦ ἐν αὐτῷ μένει καὶ αὐτὸς ἐν αὐτῷ· καὶ ἐν τούτῳ γινώσκομεν ὅτι μένει ἐν ἡμῖν, ἐκ τοῦ πνεύματος οὗ ἡμῖν ἔδωκεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/024.yaml
  text: 'And the one who keeps his commandments remains in him[a], and he in him[b]. And by this we know that he remains in us: by the Spirit whom he gave to us.'
translation:
  language: ml
  text: അവന്റെ കല്പനകൾ പാലിക്കുന്നവൻ അവനിൽ വസിക്കുന്നു[b]; അവനും അവനിൽ വസിക്കുന്നു. അവൻ നമ്മിൽ വസിക്കുന്നു എന്ന് നാം അറിയുന്നത്, അവൻ നമുക്കു നൽകിയ ആത്മാവിലൂടെയാണ്[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘അവൻ നമുക്കു നൽകിയ ആത്മാവിൽനിന്ന്.’ ഗ്രീക്കിലെ ἐκ എന്ന പദം ഉപാധിയോടൊപ്പം ഉറവിടത്തിനും ഊന്നൽ നൽകാം.
    reason: lexical_alternative
  - marker: b
    text: ‘വസിക്കുന്നു’ എന്നതിന് ‘നിലനിൽക്കുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഈ വാക്യത്തിൽ ഒരേ ഗ്രീക്കുപദം മൂന്നു പ്രാവശ്യം വരുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: τηρῶν
  choice: പാലിക്കുന്നവൻ
  rationale: τηρέω ഇവിടെ കല്പനകൾ അനുസരണയോടെ ആചരിക്കുകയും വിശ്വസ്തമായി കാത്തുസൂക്ഷിക്കുകയും ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പാലിക്കുന്നു’ എന്നത് ഈ രണ്ടു ഭാവങ്ങളും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: ἐντολάς
  choice: കല്പനകൾ
  rationale: യോഹന്നാന്റെ രചനകളിൽ ἐντολή ആവർത്തിച്ചു വരുന്ന നൈതികവും ഉടമ്പടിസംബന്ധവുമായ പദമാണ്; ‘കല്പനകൾ’ അതിന്റെ ശക്തിയും സമീപസന്ദർഭവുമായുള്ള പദസാമ്യവും നിലനിർത്തുന്നു.
- source_word: μένει
  choice: വസിക്കുന്നു
  rationale: ഈ വാക്യത്തിൽ മൂന്നു പ്രാവശ്യം വരുന്ന യോഹന്നാനീയ മുഖ്യപദമായ μένωയുടെ തുടർച്ചയുള്ള ബന്ധപരമായ അർത്ഥം ‘വസിക്കുന്നു’ സ്വാഭാവികമായി നൽകുന്നു. മൂന്നു പ്രാവശ്യവും ഒരേ പദം ഉപയോഗിച്ച് ആവർത്തനം സൂക്ഷിച്ചിരിക്കുന്നു.
- source_word: ἐν αὐτῷ
  choice: അവനിൽ
  rationale: ഗ്രീക്കിലെ സർവനാമരൂപം നിലനിർത്തി, മുൻസന്ദർഭത്തിൽനിന്ന് അതിന്റെ സൂചിതപാത്രം വായനക്കാരൻ തിരിച്ചറിയാൻ അനുവദിക്കുന്നു.
- source_word: ἐν τούτῳ
  choice: ഇതിലൂടെയാണ്
  rationale: അറിയാനുള്ള അടയാളമോ അടിസ്ഥാനമോ തുടർന്നുള്ള ആത്മാവിനെക്കുറിച്ചുള്ള വാക്യഭാഗത്തിൽ വ്യക്തമാകുന്നു; മലയാളത്തിൽ ‘ഇതിലൂടെയാണ്’ ആ ഉപാധി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: γινώσκομεν
  choice: നാം അറിയുന്നത്
  rationale: വർത്തമാനകാലത്തിലുള്ള അറിവിനെയോ തിരിച്ചറിവിനെയോ ലളിതവും കൃത്യവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐκ τοῦ πνεύματος
  choice: ആത്മാവിലൂടെ
  rationale: ἐκ ഇവിടെ അറിവിന്റെ ഉറവിടമോ തെളിവുനൽകുന്ന ഉപാധിയോ സൂചിപ്പിക്കാം. മുഖ്യപാഠത്തിൽ ‘ആത്മാവിലൂടെ’ ഉപാധിയുടെ ഭാവം നൽകുന്നു; ഉറവിടഭാവം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: πνεύματος
  choice: ആത്മാവ്
  rationale: ദൈവം വിശ്വാസികൾക്കു നൽകിയ ദിവ്യാത്മാവാണ് സന്ദർഭത്തിലെ സൂചിതപാത്രം; മലയാളത്തിലെ ആദരസൂചകമായ വ്യക്തിസർവനാമപ്രയോഗം അതിനെ വ്യക്തമാക്കുന്നു.
- source_word: οὗ ἡμῖν ἔδωκεν
  choice: അവൻ നമുക്കു നൽകിയ
  rationale: ബന്ധസർവനാമത്തിന്റെയും ദാനത്തിന്റെ ഭൂതകാലക്രിയയുടെയും അർത്ഥം അധികമായ കാലഭാവം ചേർക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: αὐτῷ / αὐτός / μένει ἐν ἡμῖν എന്നീ സർവനാമങ്ങളുടെ സൂചിതപാത്രം
  choice: മുഖ്യപാഠത്തിൽ ‘അവൻ/അവനിൽ’ എന്ന സർവനാമങ്ങൾ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അവ ദൈവത്തെ സൂചിപ്പിക്കുന്നു. കല്പനകൾ പാലിക്കുന്ന വ്യക്തിയെ രണ്ടാമത്തെ വാക്യഭാഗത്തിൽ ‘ആ വ്യക്തി’ എന്നു വ്യക്തമാക്കുന്നു.
  alternative: സർവനാമങ്ങൾക്കു പകരം എല്ലായിടത്തും ‘ദൈവം’ എന്നു നൽകുക; അല്ലെങ്കിൽ അവസാനത്തെ വസിക്കൽ ക്രിസ്തുവിന്റെ വാസമായി കൂടുതൽ വ്യക്തമായി വ്യാഖ്യാനിക്കുക.
  rationale: ഉടൻമുൻപുള്ള സന്ദർഭം പുത്രനായ യേശുമശിഹായെ പ്രത്യേകം പരാമർശിച്ചശേഷം കല്പനകൾ നൽകുകയും ആത്മാവിനെ നൽകുകയും ചെയ്യുന്ന ദൈവത്തിലേക്കു മടങ്ങുന്നു. എന്നിരുന്നാലും ഗ്രീക്ക് നാമം ആവർത്തിക്കാതെ സർവനാമങ്ങളാണ് ഉപയോഗിക്കുന്നത്; അതിനാൽ മുഖ്യപാഠം ആ രൂപവും യോഹന്നാനീയ ദൈവശാസ്ത്രത്തിലെ ബന്ധപരമായ സാന്ദ്രതയും സംരക്ഷിക്കുന്നു.
- issue: πνεῦμα ദൈവത്തിന്റെ പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്നുവോ എന്നത്
  choice: ദൈവം നമുക്കു നൽകിയ ‘ആത്മാവ്’ എന്ന വ്യക്തിപരമായ ദിവ്യസൂചനയായി പരിഭാഷപ്പെടുത്തുന്നു.
  alternative: മനുഷ്യാത്മാവിനെയോ പൊതുവായ ആത്മീയ സ്വാധീനത്തെയോ സൂചിപ്പിക്കുന്നതായി വായിക്കുക.
  rationale: ‘അവൻ നമുക്കു നൽകിയ’ എന്ന വാക്യഭാഗവും വിശാലമായ യോഹന്നാനീയ സന്ദർഭവും ദൈവത്തിന്റെ ദാനമായ പരിശുദ്ധാത്മാവിലേക്കാണ് വിരൽചൂണ്ടുന്നത്; പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ അധികവിവരണം ഒന്നും ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. യോഹന്നാനീയ ആവർത്തനം സൂക്ഷിക്കാൻ μένω മൂന്നു പ്രാവശ്യവും ‘വസിക്കുന്നു’ എന്നു നൽകി. ഒരേ ‘അവൻ’ എന്ന രൂപം രണ്ടു വ്യത്യസ്ത വ്യക്തികളെ അടുത്തടുത്ത് സൂചിപ്പിക്കുമ്പോൾ ഉണ്ടാകുന്ന ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ കല്പന പാലിക്കുന്നയാളെ രണ്ടാമത്തെ ഭാഗത്ത് ‘ആ വ്യക്തി’ എന്നു വ്യക്തമാക്കി; ദൈവത്തെ ഗ്രീക്കുപോലെ സർവനാമത്തിലൂടെയാണ് സൂചിപ്പിച്ചത്.
