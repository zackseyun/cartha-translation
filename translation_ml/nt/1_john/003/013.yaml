  text: ⸀μὴ θαυμάζετε, ⸀ἀδελφοί, εἰ μισεῖ ὑμᾶς ὁ κόσμος.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/013.yaml
  text: Do not be surprised[a], brothers, if the world hates you.
translation:
  language: ml
  text: സഹോദരന്മാരേ[a], ലോകം നിങ്ങളെ വെറുക്കുന്നെങ്കിൽ അതിശയിക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സഹോദരന്മാരേ” എന്നത് ഗ്രീക്കിലെ പുരുഷലിംഗ ബഹുവചനരൂപത്തിന്റെ പരിഭാഷയാണ്; ഇവിടെ സ്ത്രീകൾ ഉൾപ്പെടെയുള്ള വിശ്വാസിസമൂഹം മുഴുവനും ഉദ്ദേശിക്കപ്പെട്ടിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ θαυμάζετε
  choice: അതിശയിക്കരുത്
  rationale: μή ചേർന്ന വർത്തമാനകാല ആജ്ഞാരൂപം ഒരു വിലക്കാണ് സൂചിപ്പിക്കുന്നത്. സന്ദർഭത്തിൽ ‘അതിശയിക്കരുത്’ എന്നത് സ്വാഭാവികവും വ്യക്തവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: പുരുഷലിംഗ ബഹുവചന സംബോധനയുടെ രൂപം നിലനിർത്തുന്നു; ഇവിടെ വിശ്വാസിസമൂഹം മുഴുവനും ഉദ്ദേശിക്കപ്പെട്ടിരിക്കാമെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: εἰ
  choice: -ുന്നെങ്കിൽ
  rationale: ഗ്രീക്കിലെ സാധാരണ ഉപാധിസൂചകമായ εἰയെ അതിരുകടന്ന് ‘എപ്പോൾ’ എന്നു വ്യാഖ്യാനിക്കാതെ ഉപാധിരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: μισεῖ
  choice: വെറുക്കുന്നു
  rationale: വർത്തമാനകാല ക്രിയയുടെ പൊതുവായ, തുടരുന്ന യാഥാർഥ്യബോധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὁ κόσμος
  choice: ലോകം
  rationale: യോഹന്നാന്റെ രചനകളിലെ ദൈവവിരുദ്ധ മനുഷ്യക്രമത്തെ സൂചിപ്പിക്കാവുന്ന വിശാലമായ ദൈവശാസ്ത്ര അർഥം വ്യാഖ്യാനവികാസം കൂടാതെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ἀδελφοί എന്ന പുരുഷലിംഗ പ്രതിനിധി സംബോധന
  choice: പ്രധാനവാചകത്തിൽ ‘സഹോദരന്മാരേ’ എന്നു നിലനിർത്തുക
  alternative: ‘സഹോദരീസഹോദരന്മാരേ’ അല്ലെങ്കിൽ ‘സഹവിശ്വാസികളേ’
  rationale: ഗ്രീക്കിലെ വ്യാകരണപരമായ പുരുഷലിംഗരൂപം പ്രധാനവാചകത്തിൽ സംരക്ഷിക്കുന്നു; സ്ത്രീകൾ ഉൾപ്പെടെയുള്ള വിശ്വാസിസമൂഹം മുഴുവനും ഉദ്ദേശിക്കപ്പെട്ടിരിക്കാമെന്നത് അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
- issue: κόσμος എന്ന പദത്തിന്റെ യോഹന്നാനീയ അർഥവ്യാപ്തി
  choice: വ്യാഖ്യാനവികാസമില്ലാതെ ‘ലോകം’ എന്നു പരിഭാഷപ്പെടുത്തുക
  alternative: ‘ദൈവത്തെ എതിർക്കുന്ന ലോകം’ അല്ലെങ്കിൽ ‘ലോകവ്യവസ്ഥ’
  rationale: ‘ലോകം’ എന്നത് മൂലപദത്തിന്റെ വ്യാപ്തിയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു; സന്ദർഭം നൽകുന്ന അർഥം പരിഭാഷയിൽ മുൻകൂട്ടി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ നേരിട്ടുള്ള സംബോധന. ഗ്രീക്ക് വാക്യക്രമം മലയാളത്തിന്റെ സ്വാഭാവിക ക്രമത്തിലേക്ക് മാറ്റിയെങ്കിലും ഉപാധിയും വിലക്കും വ്യക്തമായി സംരക്ഷിച്ചിരിക്കുന്നു.
