  yaml_path: translation/nt/1_john/003/019.yaml
  text: By this we will know that we are from the truth[a], and before him we will persuade our hearts[b],
translation:
  language: ml
  text: ഇതിനാൽ നാം സത്യത്തിൽനിന്നുള്ളവരാണെന്ന്[a] അറിയും; അവന്റെ മുമ്പാകെ നമ്മുടെ ഹൃദയത്തെ നാം ബോധ്യപ്പെടുത്തും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നാം സത്യത്തിന്റേതാണെന്ന്’ അല്ലെങ്കിൽ ‘നാം സത്യത്തിൽപ്പെട്ടവരാണെന്ന്.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നമ്മുടെ ഹൃദയങ്ങളെ ആശ്വസിപ്പിക്കും’ അല്ലെങ്കിൽ ‘അവന്റെ സന്നിധിയിൽ നമ്മുടെ ഹൃദയങ്ങൾക്ക് സമാധാനം നൽകും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: ഇതിനാൽ
  rationale: അറിവിന്റെ മാർഗമോ അടിസ്ഥാനമോ സൂചിപ്പിക്കുന്ന പ്രയോഗം; ഗ്രീക്കിലെ നിർദേശകബലം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: γνωσόμεθα
  choice: നാം ... അറിയും
  rationale: ഭാവികാലരൂപത്തെ അനാവശ്യമായ ആരംഭാർഥം ചേർക്കാതെ നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: ἐκ τῆς ἀληθείας ἐσμέν
  choice: നാം സത്യത്തിൽനിന്നുള്ളവരാണ്
  rationale: ἐκ സൂചിപ്പിക്കുന്ന ഉറവിടം/ഉത്ഭവം നിലനിർത്തുന്നു; ‘സത്യത്തിന്റേതാണ്’ എന്ന അംഗത്വാർഥത്തിലേക്ക് വാചകത്തെ പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: ἔμπροσθεν αὐτοῦ
  choice: അവന്റെ മുമ്പാകെ
  rationale: സ്ഥല-ബന്ധപരമായ അർഥവും ദൈവസന്നിധിയുടെ ഭാവവും ഔപചാരികമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: πείσομεν
  choice: നാം ബോധ്യപ്പെടുത്തും
  rationale: πείθω എന്ന ക്രിയയുടെ ‘പ്രേരിപ്പിക്കുക/ബോധ്യപ്പെടുത്തുക’ എന്ന അടിസ്ഥാനാർഥം സംരക്ഷിക്കുന്നു; ‘ആശ്വസിപ്പിക്കും’ എന്നു മാത്രം പറഞ്ഞ് സന്ദർഭാർഥം മുൻകൂട്ടി തീർപ്പാക്കുന്നില്ല.
- source_word: τὴν καρδίαν ἡμῶν
  choice: നമ്മുടെ ഹൃദയത്തെ
  rationale: ഗ്രീക്കിലെ ഏകവചനമായ ‘ഹൃദയം’ ഔപചാരികമായി നിലനിർത്തുന്നു; മലയാളത്തിൽ സമൂഹപരമായ ഏകവചനം ഗ്രഹിക്കാവുന്നതാണ്.
theological_decisions:
- issue: ‘സത്യത്തിൽനിന്നുള്ളവർ’ എന്ന യോഹന്നാനീയ പ്രയോഗത്തിന്റെ അർഥം
  choice: ഉറവിടാർഥം തുറന്നുവെക്കുന്ന ‘സത്യത്തിൽനിന്നുള്ളവർ’
  alternative: ‘സത്യത്തിന്റേതായവർ’ / ‘സത്യത്തിൽപ്പെട്ടവർ’
  rationale: വാക്യം ദൈവജനതയോടുള്ള അംഗത്വമോ മറ്റൊരു പ്രത്യേക സിദ്ധാന്തപരമായ നിഗമനമോ ഇവിടെ വ്യക്തമായി നിർവചിക്കുന്നില്ല; അതിനാൽ മൂലപാഠത്തിലെ തുറന്ന ഭാവം നിലനിർത്തുന്നു.
- issue: ഹൃദയത്തെ സംബന്ധിച്ച πείσομεν എന്ന ക്രിയയുടെ അർഥം
  choice: ‘ബോധ്യപ്പെടുത്തും’ എന്ന താരതമ്യേന ഔപചാരികവും വിശാലവുമായ പദം
  alternative: ‘ആശ്വസിപ്പിക്കും’ / ‘സമാധാനപ്പെടുത്തും’
  rationale: സന്ദർഭത്തിൽ ആത്മവിശ്വാസമോ ആശ്വാസമോ ഉൾപ്പെടാം; എങ്കിലും ക്രിയയുടെ അർഥം അതിലേക്കു മാത്രം ചുരുക്കാതെ അടുത്ത വാക്യവുമായി നിലനിൽക്കുന്ന വ്യാഖ്യാനാത്മക പിരിമുറുക്കം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘മുമ്പാകെ’ എന്നത് ബൈബിൾസന്ദർഭത്തിന് യോജിച്ച ഗൗരവം നൽകുന്നു; ‘ബോധ്യപ്പെടുത്തും’ മൂലക്രിയയുടെ വിശാലത സംരക്ഷിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
