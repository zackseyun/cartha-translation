id: 1JN.3.9
reference: 1 John 3:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πᾶς ὁ γεγεννημένος ἐκ τοῦ θεοῦ ἁμαρτίαν οὐ ποιεῖ, ὅτι σπέρμα αὐτοῦ ἐν αὐτῷ μένει, καὶ οὐ δύναται ἁμαρτάνειν, ὅτι ἐκ τοῦ θεοῦ γεγέννηται.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/009.yaml
  text: Everyone who has been born of God does not practice sin[a], because his seed remains in him; and he is not able to keep sinning[c][b], because he has been born of God.
translation:
  language: ml
  text: ദൈവത്തിൽനിന്ന് ജനിച്ചിരിക്കുന്ന ഏവനും പാപം ചെയ്തുകൊണ്ടിരിക്കുകയില്ല[a]; കാരണം, ദൈവത്തിന്റെ വിത്ത് അവനിൽ നിലനിൽക്കുന്നു[b]. ദൈവത്തിൽനിന്ന് ജനിച്ചിരിക്കുന്നതിനാൽ പാപം ചെയ്തുകൊണ്ടിരിക്കാൻ അവനു കഴിയുകയുമില്ല[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “പാപം ചെയ്യുന്നില്ല” അല്ലെങ്കിൽ “പാപം ചെയ്യുന്നതല്ല.” ഇവിടെ ഗ്രീക്ക് പ്രയോഗം ഒറ്റപ്പെട്ട ഒരു പ്രവൃത്തിയെക്കാൾ പാപം ചെയ്തുകൊണ്ടിരിക്കുന്ന രീതിയെ സൂചിപ്പിക്കുന്നതാകാം.'
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ “അവനിൽ വസിക്കുന്നു.”
    reason: lexical_alternative
  - marker: c
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “അവനു പാപം ചെയ്യാൻ കഴിയില്ല.” സന്ദർഭത്തിൽ ഗ്രീക്കിലെ വർത്തമാനകാല അനന്തക്രിയയ്ക്ക് “പാപം ചെയ്തുകൊണ്ടിരിക്കാൻ” എന്ന അർഥമാകാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ γεγεννημένος
  choice: ജനിച്ചവൻ ആരും
  rationale: പൂർണകൃത്യ കൃദന്തരൂപം സൂചിപ്പിക്കുന്ന ജനനത്തിന്റെ നിലനിൽക്കുന്ന ഫലവും πᾶς നൽകുന്ന പൊതുവ്യാപ്തിയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐκ τοῦ θεοῦ
  choice: ദൈവത്തിൽനിന്നു
  rationale: ἐκ ഇവിടെ ഉത്ഭവത്തെയും ഉറവിടത്തെയും സൂചിപ്പിക്കുന്നു; യോഹന്നാന്റെ പുതുജനനഭാഷയിൽ മലയാളത്തിലെ ‘ദൈവത്തിൽനിന്നു ജനിക്കുക’ ഇത് വ്യക്തമായി നൽകുന്നു.
- source_word: ἁμαρτίαν οὐ ποιεῖ
  choice: പാപം ചെയ്തുകൊണ്ടിരിക്കുന്നില്ല
  rationale: അക്ഷരാർഥത്തിലെ ‘പാപം ചെയ്യുന്നില്ല’ എന്നതിനെക്കാൾ, വർത്തമാനകാലരൂപവും തുടർന്നുള്ള ἁμαρτάνειν എന്ന വർത്തമാന അനന്തക്രിയയും സൂചിപ്പിക്കുന്ന തുടരുന്ന പ്രവൃത്തിയെ ഈ രൂപം വ്യക്തമാക്കുന്നു; ഒറ്റപ്പെട്ട ഒരു പ്രവൃത്തിയെക്കുറിച്ചെന്ന ധാരണ ഒഴിവാക്കുന്നു.
- source_word: σπέρμα αὐτοῦ
  choice: ദൈവത്തിന്റെ വിത്ത്
  rationale: σπέρμα എന്ന മൂർത്തമായ രൂപകം വ്യാഖ്യാനിച്ച് ‘വചനം,’ ‘ജീവൻ,’ ‘സ്വഭാവം’ എന്നിവയിൽ ഒന്നായി പരിമിതപ്പെടുത്താതെ അതേപടി നിലനിർത്തുന്നു. മലയാളത്തിൽ സർവനാമസംബന്ധമായ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ‘ദൈവത്തിന്റെ’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: ἐν αὐτῷ μένει
  choice: അവനിൽ നിലനിൽക്കുന്നു
  rationale: μένωയുടെ തുടരുന്ന അർഥം ആധുനികവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു; ‘വസിക്കുന്നു’ എന്ന പരമ്പരാഗത സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: οὐ δύναται ἁμαρτάνειν
  choice: അവനു പാപം ചെയ്തുകൊണ്ടിരിക്കാൻ കഴിയുകയുമില്ല
  rationale: വർത്തമാന അനന്തക്രിയയായ ἁμαρτάνειν തുടരുന്ന/പതിവായ പാപപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നതായി സന്ദർഭത്തിൽ മനസ്സിലാക്കി വിവർത്തനം ചെയ്യുന്നു; ഗ്രീക്കിന്റെ കൂടുതൽ അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: γεγέννηται
  choice: ജനിച്ചിരിക്കുന്നു
  rationale: പൂർണകൃത്യകാലം മുൻപ് സംഭവിച്ച ജനനവും അതിന്റെ ഇപ്പോഴും നിലനിൽക്കുന്ന ഫലവും സൂചിപ്പിക്കുന്നതിനാൽ ‘ജനിച്ചിരിക്കുന്നു’ എന്നു നൽകുന്നു.
theological_decisions:
- issue: ഈ വാക്യം ഒരു പാപപ്രവൃത്തിപോലും ചെയ്യാനുള്ള സമ്പൂർണ അസാധ്യതയെയാണോ, അതോ പാപത്തിൽ തുടർന്നുകൊണ്ടിരിക്കുന്നതിനോടുള്ള പുതുജനനത്തിന്റെ പൊരുത്തക്കേടിനെയാണോ പഠിപ്പിക്കുന്നത്?
  choice: പ്രധാനപാഠം പാപം ചെയ്തുകൊണ്ടിരിക്കുന്ന തുടർച്ചയായ രീതിയെ നിഷേധിക്കുന്നതായി നൽകുന്നു.
  alternative: ‘പാപം ചെയ്യുന്നില്ല’; ‘പാപം ചെയ്യാൻ കഴിയില്ല’—ഏതൊരു വ്യക്തിഗത പാപപ്രവൃത്തിയുടെയും സമ്പൂർണ അസാധ്യതയായി വായിക്കാവുന്ന കൂടുതൽ അക്ഷരാർഥരൂപം.
  rationale: ποιεῖ, ἁμαρτάνειν എന്നീ വർത്തമാനകാലരൂപങ്ങളും 1 യോഹന്നാൻ 1:8–2:1 എന്ന വിശാലസന്ദർഭവും തുടരുന്ന പാപരീതിയെന്ന വായനയെ പിന്തുണയ്ക്കുന്നു. എന്നിരുന്നാലും ഗ്രീക്കിലെ ശക്തമായ പ്രസ്താവന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ച് പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം ഇല്ലാതാക്കുന്നില്ല.
- issue: ‘അവന്റെ വിത്ത്’ എന്നതിന്റെ കൃത്യമായ സൂചന
  choice: ‘ദൈവത്തിന്റെ വിത്ത്’ എന്ന രൂപകം വ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്നു.
  alternative: ദൈവത്തിന്റെ വചനം; ദൈവത്തിന്റെ ജീവൻ; ദൈവത്തിന്റെ സ്വഭാവം.
  rationale: σπέρμα എന്തിനെ സൂചിപ്പിക്കുന്നു എന്ന് വാക്യം തന്നെ വ്യക്തമാക്കുന്നില്ല. ഏതെങ്കിലും പ്രത്യേക വ്യാഖ്യാനം പ്രധാനപാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതിരിക്കാൻ രൂപകം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പാപം ചെയ്തുകൊണ്ടിരിക്കുക’ എന്ന പ്രയോഗം അല്പം ദൈർഘ്യമുള്ളതാണെങ്കിലും തുടരുന്ന പ്രവൃത്തിയെന്ന ഭാവം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു. മൂലപാഠത്തിലെ രണ്ടു കാരണവാക്യങ്ങളുടെ ബന്ധം മലയാളത്തിൽ വ്യക്തതയ്ക്കായി രണ്ടു വാക്യങ്ങളായി ക്രമീകരിച്ചിരിക്കുന്നു; അർഥക്രമം നിലനിർത്തുന്നു.
