revisions:
- from: ദൈവത്തിൽനിന്നു ജനിച്ചവൻ ആരും പാപം ചെയ്തുകൊണ്ടിരിക്കുന്നില്ല[a]; കാരണം, ദൈവത്തിന്റെ വിത്ത് അവനിൽ നിലനിൽക്കുന്നു[b]. ദൈവത്തിൽനിന്നു ജനിച്ചിരിക്കുന്നതിനാൽ അവനു പാപം ചെയ്തുകൊണ്ടിരിക്കാൻ കഴിയുകയുമില്ല[c].
  to: ദൈവത്തിൽനിന്ന് ജനിച്ചിരിക്കുന്ന ഏവനും പാപം ചെയ്തുകൊണ്ടിരിക്കുകയില്ല[a]; കാരണം, ദൈവത്തിന്റെ വിത്ത് അവനിൽ നിലനിൽക്കുന്നു[b]. ദൈവത്തിൽനിന്ന് ജനിച്ചിരിക്കുന്നതിനാൽ പാപം ചെയ്തുകൊണ്ടിരിക്കാൻ അവനു കഴിയുകയുമില്ല[c].
