id: 1JN.1.6
reference: 1 John 1:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐὰν εἴπωμεν ὅτι κοινωνίαν ἔχομεν μετ’ αὐτοῦ καὶ ἐν τῷ σκότει περιπατῶμεν, ψευδόμεθα καὶ οὐ ποιοῦμεν τὴν ἀλήθειαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/006.yaml
  text: If we say that we have fellowship with him and yet walk in the darkness[b][a], we are lying and are not practicing the truth.
translation:
  language: ml
  text: അവനോടു നമുക്കു കൂട്ടായ്മയുണ്ടെന്നു നാം പറയുകയും എന്നിട്ടും അന്ധകാരത്തിൽ[a] നടക്കുകയും ചെയ്യുന്നെങ്കിൽ, നാം കള്ളം പറയുകയാണ്; സത്യം പ്രാവർത്തികമാക്കുന്നില്ല.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇരുട്ടിൽ.’ ഗ്രീക്കിൽ ‘അന്ധകാരത്തിൽ’ എന്നതിന് നിർദിഷ്ട ആർട്ടിക്കിൾ ഉണ്ട്; യോഹന്നാന്റെ പ്രയോഗത്തിൽ ഇത് ദൈവത്തിനു വിരുദ്ധമായ ധാർമിക-ആത്മീയ മേഖലയ്ക്ക് ഊന്നൽ നൽകാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം, ‘സത്യം ചെയ്യുന്നില്ല.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπωμεν
  choice: നാം പറയുകയും … ചെയ്യുന്നെങ്കിൽ
  rationale: സാധ്യതയുള്ള വ്യവസ്ഥയെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ‘അവകാശപ്പെടുന്നു’ എന്ന അധിക വ്യാഖ്യാനഭാരം ചേർക്കുന്നില്ല.
- source_word: κοινωνίαν ἔχομεν
  choice: നമുക്കു കൂട്ടായ്മയുണ്ട്
  rationale: κοινωνίαയുടെ പങ്കാളിത്തപരവും ബന്ധപരവുമായ അർഥം ലളിതവും സഭാപരിധിക്കു പുറത്തും മനസ്സിലാകുന്ന മലയാളത്തിൽ നൽകുന്നു.
- source_word: μετ’ αὐτοῦ
  choice: അവനോടു
  rationale: മൂലത്തിലെ സർവനാമം വിപുലീകരിച്ച് ‘ദൈവത്തോടു’ എന്നു മാറ്റാതെ, സഹവാസം സൂചിപ്പിക്കുന്ന μετάയുടെ അർഥം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: ἐν τῷ σκότει
  choice: അന്ധകാരത്തിൽ
  rationale: യോഹന്നാന്റെ രചനയിലെ ധാർമിക-ആത്മീയ രൂപകം നിലനിർത്തുന്നു. മലയാളത്തിൽ നിർദേശകപദം ചേർക്കാതെതന്നെ ഈ ആശയമേഖല സ്വാഭാവികമായി പ്രകടമാകുന്നു; ഗ്രീക്കിലെ നിർദ്ദിഷ്ട ആർട്ടിക്കിളിനെക്കുറിച്ച് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: περιπατῶμεν
  choice: നടക്കുകയും
  rationale: ജീവിതരീതിയെ സൂചിപ്പിക്കുന്ന ബൈബിൾരൂപകം വിശദീകരിച്ച് ചുരുക്കാതെ അതേപടി നിലനിർത്തുന്നു.
- source_word: ψευδόμεθα
  choice: നാം കള്ളം പറയുകയാണ്
  rationale: വർത്തമാനകാലത്തിലെ തുടർച്ചയുള്ള പ്രവർത്തനഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: οὐ ποιοῦμεν τὴν ἀλήθειαν
  choice: സത്യം അനുഷ്ഠിക്കുന്നുമില്ല
  rationale: അക്ഷരാർഥമായ ‘സത്യം ചെയ്യുന്നില്ല’ എന്ന പ്രയോഗത്തിന്റെ പ്രവർത്തനാത്മക ഭാവം നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാക്കുന്നു.
theological_decisions:
- issue: അന്ധകാരത്തിന്റെ ധാർമിക-ആത്മീയ രൂപകം
  choice: ‘അന്ധകാരത്തിൽ നടക്കുക’ എന്ന രൂപകം നിലനിർത്തുക
  alternative: ‘പാപത്തിൽ ജീവിക്കുക’ എന്നു വ്യാഖ്യാനിച്ചു പറയുക
  rationale: യോഹന്നാന്റെ പ്രയോഗത്തിൽ അന്ധകാരം ധാർമിക തിന്മ, അസത്യം, ദൈവത്തിൽനിന്നുള്ള അകൽച്ച എന്നിവ ഉൾക്കൊള്ളുന്ന സമ്പന്നമായ ആശയമാണ്. അതിനെ ‘പാപം’ എന്ന ഒരൊറ്റ വ്യാഖ്യാനത്തിലേക്കു ചുരുക്കുന്നില്ല.
- issue: ‘സത്യം ചെയ്യുക’ എന്ന യോഹന്നാനീയ പ്രയോഗം
  choice: ‘സത്യം അനുഷ്ഠിക്കുക’
  alternative: ‘സത്യപ്രകാരം ജീവിക്കുക’
  rationale: സത്യം വെറും ആശയമോ വാക്കോ അല്ല, പ്രവൃത്തിയിൽ നടപ്പാക്കേണ്ട യാഥാർഥ്യമാണെന്ന മൂലപാഠത്തിലെ സംഘർഷം സംരക്ഷിക്കുന്നു; ‘ജീവിക്കുക’ എന്ന വിപുലീകരണം ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കൂട്ടായ്മ,’ ‘അന്ധകാരം,’ ‘നടക്കുക’ എന്നീ ബൈബിൾപദങ്ങളും രൂപകങ്ങളും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നിലനിർത്തി; വാക്യഘടന മലയാളത്തിന്റെ സ്വാഭാവിക വ്യവസ്ഥാവാക്യക്രമത്തിലാക്കി.
