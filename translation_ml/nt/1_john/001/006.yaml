  source_fidelity: വ്യവസ്ഥാപ്രയോഗം (ἐὰν εἴπωμεν), ‘അവനോടു’ എന്ന സർവനാമം, കൂട്ടായ്മ, അന്ധകാരത്തിൽ നടക്കുക എന്ന രൂപകം, കള്ളം പറയുക എന്നിവ മൂലഗ്രീക്കിനോട് വിശ്വസ്തമാണ്. ‘എന്നിട്ടും’ സന്ദർഭത്തിലെ വിരോധഭാവം സ്വാഭാവികമായി അറിയിക്കുന്നു. അവസാന യോഹന്നാനീയ പ്രയോഗത്തിൽ പ്രവർത്തനപരമായ ഭാവം കൂടുതൽ നേരിട്ടും ആധുനികമായും നൽകാൻ ചെറിയ തിരുത്തൽ ആവശ്യമാണ്.
  naturalness: വാക്യം ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമാണ്. ‘സത്യം അനുഷ്ഠിക്കുക’ മനസ്സിലാക്കാവുന്നതാണെങ്കിലും, ‘അനുഷ്ഠിക്കുക’ സാധാരണയായി ആചാരമോ കർത്തവ്യമോ പാലിക്കുന്നതുമായി ബന്ധപ്പെട്ട പ്രയോഗമാണ്. ഇവിടെ ‘സത്യം പ്രാവർത്തികമാക്കുക’ കൂടുതൽ സ്വാഭാവികവും ഉദ്ദേശിച്ച പ്രവർത്തനാത്മക അർഥത്തോട് അടുത്തതുമാണ്.
  terminology: ‘കൂട്ടായ്മ,’ ‘അന്ധകാരം,’ ‘നടക്കുക’ എന്നിവ യോജിച്ചതാണ്. ‘സത്യം പ്രാവർത്തികമാക്കുന്നില്ല’ എന്നത് οὐ ποιοῦμεν τὴν ἀλήθειαν എന്ന അസാധാരണമായെങ്കിലും പ്രധാനമായ യോഹന്നാനീയ പ്രയോഗത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു; ‘സത്യപ്രകാരം ജീവിക്കുന്നില്ല’ പോലുള്ള വിപുലീകരണം ഒഴിവാക്കുന്നു.
