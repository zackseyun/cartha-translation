id: 1JN.1.10
reference: 1 John 1:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐὰν εἴπωμεν ὅτι οὐχ ἡμαρτήκαμεν, ψεύστην ποιοῦμεν αὐτὸν καὶ ὁ λόγος αὐτοῦ οὐκ ἔστιν ἐν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/010.yaml
  text: If we say that we have not sinned[a], we make him a liar[b], and his word is not in us.
translation:
  language: ml
  text: നാം പാപം ചെയ്തിട്ടില്ല എന്നു പറഞ്ഞാൽ[a], നാം അവനെ കള്ളനാക്കുന്നു; അവന്റെ വചനം[b] നമ്മിൽ ഇല്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നാം പാപം ചെയ്തില്ല.’ ഗ്രീക്കിൽ perfect ക്രിയാരൂപമാണ്; കഴിഞ്ഞ പ്രവൃത്തിക്ക് ഇപ്പോഴുള്ള പ്രസക്തി സൂചിപ്പിക്കുന്നതിനാൽ ‘പാപം ചെയ്തിട്ടില്ല’ എന്നു പരിഭാഷപ്പെടുത്തി.
    reason: lexical_alternative
  - marker: b
    text: ‘വചനം’ എന്നത് ‘സന്ദേശം’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് λόγος എന്ന പദത്തിന് രണ്ടർഥങ്ങളും വരാം; യോഹന്നാന്റെ പദപ്രയോഗം നിലനിർത്താൻ ‘വചനം’ സ്വീകരിച്ചു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπωμεν
  choice: നാം … എന്നു പറഞ്ഞാൽ
  rationale: ἐὰν എന്നതും aorist subjunctive-ഉം ചേർന്നുള്ള നിബന്ധന സ്വാഭാവികമായ മലയാളത്തിൽ ‘പറഞ്ഞാൽ’ എന്നു നൽകിയിരിക്കുന്നു. ‘അവകാശപ്പെട്ടാൽ’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് മൂലപാഠത്തിൽ നേരിട്ട് ഇല്ലാത്ത വ്യാഖ്യാനഭാവം കൂട്ടിച്ചേർക്കും.
- source_word: οὐχ ἡμαρτήκαμεν
  choice: പാപം ചെയ്തിട്ടില്ല
  rationale: ἡμαρτήκαμεν perfect രൂപമായതിനാൽ, കഴിഞ്ഞ പ്രവൃത്തിയെയും അതിന്റെ ഇപ്പോഴത്തെ പ്രസക്തിയെയും സൂചിപ്പിക്കുന്ന മലയാളപ്രയോഗം തെരഞ്ഞെടുത്തു. ‘ഒരിക്കലും പാപം ചെയ്തിട്ടില്ല’ എന്നു പറയുന്നത് ഗ്രീക്കിൽ വ്യക്തമാക്കിയിട്ടില്ലാത്ത ഊന്നൽ ചേർക്കും.
- source_word: ψεύστην
  choice: കള്ളൻ
  rationale: ψεύστης ഒരു നാമപദമാണ്; അതിന്റെ നേരിട്ടുള്ള വ്യക്തിപരമായ ശക്തി മയപ്പെടുത്താതെ നിലനിർത്തുന്നു.
- source_word: ποιοῦμεν αὐτὸν
  choice: നാം അവനെ കള്ളനാക്കുന്നു
  rationale: predicate accusative-നോടുകൂടിയ ποιέω ഇവിടെ ഒരാളെ അങ്ങനെ ആക്കുകയോ അങ്ങനെ പ്രഖ്യാപിക്കുകയോ ചെയ്യുക എന്ന ശക്തിയുള്ളതാണ്. മലയാളത്തിലും മൂലപാഠത്തിന്റെ കടുപ്പം നിലനിർത്തുന്ന നേരിട്ടുള്ള രൂപമാണിത്.
- source_word: ὁ λόγος αὐτοῦ
  choice: അവന്റെ വചനം
  rationale: λόγος എന്നതിന് ‘വചനം,’ ‘സന്ദേശം,’ ‘ഉപദേശം’ എന്നീ അർഥസാധ്യതകളുണ്ട്. യോഹന്നാന്റെ പദപ്രയോഗവും അതിലെ വിശാലമായ അനുരണനവും നിലനിർത്താൻ ‘വചനം’ സ്വീകരിച്ചു.
- source_word: οὐκ ἔστιν ἐν ἡμῖν
  choice: നമ്മിൽ ഇല്ല
  rationale: അകത്തുള്ളതും ബന്ധപരവുമായ യോഹന്നാനീയ ആശയം വ്യാഖ്യാനാത്മകമായ അധികചിത്രണം ചേർക്കാതെ നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: αὐτόν / αὐτοῦ എന്നീ സർവനാമങ്ങളുടെ സൂചിതൻ
  choice: പ്രധാനപാഠത്തിൽ ‘അവനെ / അവന്റെ’ എന്ന സർവനാമങ്ങൾ നിലനിർത്തി; സന്ദർഭത്തിൽ അവ ദൈവത്തെ സൂചിപ്പിക്കുന്നു.
  alternative: സർവനാമങ്ങൾക്ക് പകരം ‘ദൈവത്തെ / ദൈവത്തിന്റെ’ എന്നു വ്യക്തമാക്കുക.
  rationale: 1 യോഹന്നാൻ 1:5–10-ലെ സന്ദർഭത്തിൽ വിരോധിക്കപ്പെടുന്ന സാക്ഷ്യം ദൈവത്തിന്റേതാണ്. എങ്കിലും ഗ്രീക്കിലെ സർവനാമങ്ങൾ നിലനിർത്തുന്നത് മൂലപാഠത്തെ അനാവശ്യമായി വിശദീകരിക്കാതെ സന്ദർഭം തന്നെ സൂചിതനെ വ്യക്തമാക്കാൻ അനുവദിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, ഗൗരവമുള്ള ശൈലി. ‘കള്ളനാക്കുന്നു’ എന്ന കടുപ്പമുള്ള പ്രയോഗവും ‘നമ്മിൽ ഇല്ല’ എന്ന സംക്ഷിപ്ത ഘടനയും മൂലപാഠത്തിന്റെ നേരിട്ടുള്ള ശക്തിയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
