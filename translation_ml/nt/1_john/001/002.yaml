id: 1JN.1.2
reference: 1 John 1:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἡ ζωὴ ἐφανερώθη, καὶ ἑωράκαμεν καὶ μαρτυροῦμεν καὶ ἀπαγγέλλομεν ὑμῖν τὴν ζωὴν τὴν αἰώνιον ἥτις ἦν πρὸς τὸν πατέρα καὶ ἐφανερώθη ἡμῖν—
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/002.yaml
  text: and the life was revealed[a], and we have seen and testify and proclaim to you the eternal life[b], which was with the Father and was revealed to us—
translation:
  language: ml
  text: ആ ജീവൻ വെളിപ്പെട്ടു; ഞങ്ങൾ അതു കണ്ടിരിക്കുന്നു, സാക്ഷ്യം വഹിക്കുന്നു, നിങ്ങളോടു ആ നിത്യജീവനെ അറിയിക്കുകയും ചെയ്യുന്നു[b]—ആ നിത്യജീവൻ പിതാവിനോടുകൂടെ ആയിരുന്നു; ഞങ്ങൾക്കു വെളിപ്പെട്ടു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പ്രത്യക്ഷപ്പെട്ടു’ / ‘പ്രകടമായി’ (ἐφανερώθη).
    reason: lexical_alternative
  - marker: b
    text: ‘ആ നിത്യജീവൻ’ എന്ന പ്രയോഗം വ്യാകരണപരമായി ഒരു വസ്തുവിനെപ്പോലെ പറഞ്ഞിട്ടുണ്ടെങ്കിലും, സന്ദർഭത്തിൽ പിതാവിനോടുകൂടെ ഇരിക്കുകയും അപ്പൊസ്തലന്മാർക്കു വെളിപ്പെടുകയും ചെയ്ത പുത്രനെ വ്യക്തിപരമായി സൂചിപ്പിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: ἡ ζωὴ / τὴν ζωὴν
  choice: ആ ജീവൻ / ആ നിത്യജീവൻ
  rationale: ഗ്രീക്കിലെ നിർദിഷ്ടത നിലനിർത്താനും, അമൂർത്തമായ ജീവൻ മാത്രമല്ല സന്ദർഭത്തിൽ വ്യക്തിപരമായ യാഥാർഥ്യത്തെയാണ് സൂചിപ്പിക്കുന്നതെന്ന സാഹിത്യബലം സംരക്ഷിക്കാനും ‘ആ’ ഉപയോഗിച്ചു.
- source_word: ἐφανερώθη
  choice: വെളിപ്പെട്ടു
  rationale: അറിയപ്പെടാതെിരുന്ന യാഥാർഥ്യം ദൃശ്യവും അറിയാവുന്നതുമായി പ്രത്യക്ഷമായെന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; കർത്തൃപ്രയോഗം നിർബന്ധിച്ച് ചേർക്കാതെ ഗ്രീക്കിലെ രൂപം പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: ἑωράκαμεν
  choice: ഞങ്ങൾ അതു കണ്ടിരിക്കുന്നു
  rationale: ഗ്രീക്ക് സമ്പൂർണകാലത്തിന്റെ, കഴിഞ്ഞ ദൃക്സാക്ഷ്യാനുഭവത്തിനും ഇപ്പോഴും നിലനിൽക്കുന്ന പ്രാധാന്യത്തിനുമുള്ള ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: μαρτυροῦμεν
  choice: സാക്ഷ്യം വഹിക്കുന്നു
  rationale: ദൃക്സാക്ഷി സാക്ഷ്യത്തിന്റെ അർഥം വ്യക്തവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀπαγγέλλομεν
  choice: പ്രഖ്യാപിക്കുന്നു
  rationale: ‘സാക്ഷ്യം വഹിക്കുന്നു’ എന്നതിൽനിന്ന് വേർതിരിച്ച്, മറ്റുള്ളവരോട് അറിയിക്കുന്ന പരസ്യമായ പ്രഖ്യാപനത്തിന്റെ അർഥം നൽകുന്നു.
- source_word: ὑμῖν
  choice: നിങ്ങളോട്
  rationale: പരോക്ഷ കർമത്തെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τὴν ζωὴν τὴν αἰώνιον
  choice: ആ നിത്യജീവൻ
  rationale: രണ്ട് ആർട്ടിക്കിളുകൾ സൂചിപ്പിക്കുന്ന നിർദിഷ്ടതയും, മുമ്പ് പറഞ്ഞ ‘ജീവൻ’ തന്നെയാണ് ‘നിത്യജീവൻ’ എന്ന തിരിച്ചറിയലും സംരക്ഷിക്കുന്നു.
- source_word: ἥτις
  choice: ആ ജീവൻ
  rationale: മലയാളത്തിൽ ‘അത്’ മാത്രം ഉപയോഗിക്കുമ്പോൾ വ്യക്തിപരമായ സൂചന മങ്ങാനോ അസ്വാഭാവികത വരാനോ സാധ്യതയുള്ളതിനാൽ നാമം ആവർത്തിച്ചു; എങ്കിലും ‘അവൻ’ എന്നാക്കി വ്യക്തിവൽക്കരണം പൂർണമാക്കിയിട്ടില്ല.
- source_word: ἦν πρὸς τὸν πατέρα
  choice: പിതാവിനോടുകൂടെ ആയിരുന്നു
  rationale: പിതാവുമായുള്ള ബന്ധസാന്നിധ്യം സ്വാഭാവികമായി നൽകുകയും യോഹന്നാനീയ പ്രയോഗത്തിന്റെ പ്രതിധ്വനി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: τὸν πατέρα
  choice: പിതാവ്
  rationale: സന്ദർഭത്തിൽ ദൈവിക പദവിയായതിനാൽ ആദരസൂചകമായ പ്രയോഗം സ്വീകരിച്ചു.
- source_word: ἡμῖν
  choice: ഞങ്ങൾക്കു
  rationale: അപ്പൊസ്തലിക ദൃക്സാക്ഷികൾക്കുണ്ടായ വെളിപ്പാടിന്റെ ലക്ഷ്യം വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘ജീവൻ’ എന്ന ആവർത്തനത്തെ അമൂർത്തമായോ വ്യക്തിപരമായോ പരിഭാഷപ്പെടുത്തുക
  choice: പ്രധാനപാഠത്തിൽ ‘ആ ജീവൻ / ആ നിത്യജീവൻ’ നിലനിർത്തി.
  alternative: ‘അവൻ വെളിപ്പെട്ടു’ അല്ലെങ്കിൽ ‘പുത്രൻ വെളിപ്പെട്ടു’
  rationale: സന്ദർഭത്തിൽ പുത്രനെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിലും ഗ്രീക്ക് പാഠം വ്യക്തിപരമായ സർവനാമമോ ‘പുത്രൻ’ എന്ന പേരോ ഉപയോഗിക്കാതെ ζωὴ എന്ന നാമം ഉപയോഗിക്കുന്നു. അതിനാൽ യോഹന്നാന്റെ ദൈവശാസ്ത്രപരമായ സാന്ദ്രതയും യഥാർഥ അവ്യക്തതയും സംരക്ഷിച്ചു.
- issue: πρὸς τὸν πατέρα എന്നതിലെ മുൻഅസ്തിത്വവും ബന്ധവും എത്രമാത്രം വ്യക്തമാക്കണം
  choice: ‘പിതാവിനോടുകൂടെ ആയിരുന്നു’
  alternative: ‘പിതാവിന്റെ സന്നിധിയിൽ ആയിരുന്നു’
  rationale: പിതാവുമായുള്ള മുൻകാല ബന്ധസാന്നിധ്യം ഉറപ്പിക്കുമ്പോഴും വ്യാഖ്യാനാത്മകമായ വിപുലീകരണം ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. 1:1–3-ലെ ദീർഘവാക്യഘടനയുമായി ബന്ധം സൂചിപ്പിക്കാൻ അവസാനത്തിൽ ദീർഘരേഖ നിലനിർത്തി; വായനാസൗകര്യത്തിനായി ഉപവാക്യങ്ങൾക്കിടയിൽ പൂർണവിരാമവും അർധവിരാമവും ഉപയോഗിച്ചു.
