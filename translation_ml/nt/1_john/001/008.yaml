id: 1JN.1.8
reference: 1 John 1:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐὰν εἴπωμεν ὅτι ἁμαρτίαν οὐκ ἔχομεν, ἑαυτοὺς πλανῶμεν καὶ ἡ ἀλήθεια ⸂οὐκ ἔστιν ἐν ἡμῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/008.yaml
  text: If we say that we have no sin[a], we deceive ourselves, and the truth is not in us.
translation:
  language: ml
  text: നമുക്കു പാപമില്ല എന്നു നാം പറഞ്ഞാൽ, നാം നമ്മെത്തന്നെ വഞ്ചിക്കുന്നു; സത്യം നമ്മിൽ ഇല്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν εἴπωμεν
  choice: എന്നു നാം പറഞ്ഞാൽ
  rationale: ἐὰν സഹിതമുള്ള aorist subjunctive ഒരു നിബന്ധന അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘പറഞ്ഞാൽ’ സ്വാഭാവികമായി അതിന്റെ അർഥം നൽകുന്നു.
- source_word: ἁμαρτίαν οὐκ ἔχομεν
  choice: നമുക്കു പാപമില്ല
  rationale: ἁμαρτίαν ഏകവചനത്തിലാണെങ്കിലും ഇവിടെ ഒരു പ്രത്യേക പാപപ്രവൃത്തിയെയല്ല, പാപത്തിന്റെ സാന്നിധ്യത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘നമുക്കു പാപമില്ല’ എന്നത് ഗ്രീക്കിലെ ‘പാപം ഉണ്ടായിരിക്കുക’ എന്ന പ്രയോഗം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: ἑαυτοὺς πλανῶμεν
  choice: നാം നമ്മെത്തന്നെ വഞ്ചിക്കുന്നു
  rationale: പ്രഥമപുരുഷ ബഹുവചന കർത്താവിലേക്കു മടങ്ങുന്ന reflexive pronoun-ഉം πλανάωയുടെ ഇവിടെ പ്രസക്തമായ സ്വയംവഞ്ചന എന്ന അർഥവും വ്യക്തമായി പകരുന്നു.
- source_word: ἡ ἀλήθεια
  choice: സത്യം
  rationale: മലയാളത്തിൽ ‘സത്യം’ തന്നെയാണ് സ്വാഭാവികം; ഗ്രീക്കിലെ article വേറൊരു നിർദ്ദേശകപദം ചേർത്ത് ഭാരപ്പെടുത്താതെ നിർദ്ദിഷ്ടവും യോഹന്നാനീയവുമായ അർഥപ്രതിധ്വനി നിലനിർത്തുന്നു.
- source_word: οὐκ ἔστιν ἐν ἡμῖν
  choice: നമ്മിൽ ഇല്ല
  rationale: ἐν എന്നതിന്റെ ആന്തരികവും വ്യക്തിപരവുമായ ഭാവം ‘നമ്മിൽ’ നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘നമുക്കു പാപമില്ല’ എന്ന അവകാശവാദത്തിലെ പാപത്തിന്റെ അർഥം
  choice: പാപം എന്ന ഏകവചന പൊതുനാമം നിലനിർത്തി.
  alternative: ‘നാം പാപം ചെയ്തിട്ടില്ല’ അല്ലെങ്കിൽ ‘നമ്മിൽ പാപസ്വഭാവമില്ല’
  rationale: ഗ്രീക്ക് ἁμαρτίαν ἔχομεν എന്നു പറയുന്നു; പാപപ്രവൃത്തികൾ ചെയ്തതിനെ നിഷേധിക്കുന്ന 1:10-ലെ ആശയവുമായി ഇത് ഒരുപോലെയാക്കരുത്. ‘പാപസ്വഭാവം’ എന്നത് മൂലപാഠത്തേക്കാൾ വ്യാഖ്യാനപരമാണ്.
- issue: ‘സത്യം നമ്മിൽ ഇല്ല’ എന്നതിന്റെ യോഹന്നാനീയ വ്യാപ്തി
  choice: വാക്യം വികസിപ്പിക്കാതെ ‘സത്യം നമ്മിൽ ഇല്ല’ എന്നു നിലനിർത്തി.
  alternative: ‘ദൈവത്തിന്റെ സത്യം നമ്മിൽ ഇല്ല’ അല്ലെങ്കിൽ ‘നാം സത്യത്തിൽ ജീവിക്കുന്നില്ല’
  rationale: ഈ പദപ്രയോഗം ദൈവിക സത്യത്തെയും വ്യക്തിയുടെ സത്യസന്ധതയെയും ഒരുമിച്ച് പ്രതിധ്വനിപ്പിക്കാം; ഏതെങ്കിലും ഒരു അർഥത്തിലേക്ക് പരിഭാഷ ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വാക്യഘടന ഉപയോഗിച്ചു; സഭാപാരമ്പര്യവിശേഷമായ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
