id: 1JN.1.1
reference: 1 John 1:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὃ ἦν ἀπ’ ἀρχῆς, ὃ ἀκηκόαμεν, ὃ ἑωράκαμεν τοῖς ὀφθαλμοῖς ἡμῶν, ὃ ἐθεασάμεθα καὶ αἱ χεῖρες ἡμῶν ἐψηλάφησαν, περὶ τοῦ λόγου τῆς ζωῆς—
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/001.yaml
  text: What was from the beginning[a], what we have heard, what we have seen with our eyes, what we looked upon and our hands have touched[b], concerning the word of life—
translation:
  language: ml
  text: ആരംഭം മുതൽ ഉണ്ടായിരുന്നത്[a], ഞങ്ങൾ കേട്ടിട്ടുള്ളത്, ഞങ്ങളുടെ കണ്ണുകളാൽ കണ്ടിട്ടുള്ളത്, ഞങ്ങൾ ഉറ്റുനോക്കിയതും ഞങ്ങളുടെ കൈകൾ സ്പർശിച്ചതും—ജീവന്റെ വചനത്തെക്കുറിച്ച്[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആരംഭം മുതൽ ഉണ്ടായിരുന്ന കാര്യം.” ഗ്രീക്കിൽ നപുംസക ബന്ധസർവനാമമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്. അതിനാൽ ‘അവൻ’ എന്ന് പുത്രനെ നേരിട്ട് വിളിക്കുന്നതിലുപരി, പുത്രനെക്കുറിച്ചുള്ള അപ്പൊസ്തലസാക്ഷ്യത്തെ സമഗ്രമായി ഇതു സൂചിപ്പിച്ചേക്കാം.
    reason: alternative_reading
  - marker: b
    text: ‘ജീവന്റെ വചനം’ എന്നത് പുത്രനെ വ്യക്തിപരമായി സൂചിപ്പിച്ച് യോഹന്നാൻ 1:1-നെ മനഃപൂർവം പ്രതിധ്വനിപ്പിക്കാം; അല്ലെങ്കിൽ അവനെക്കുറിച്ചുള്ള ജീവദായക സന്ദേശത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὃ / ὃ
  choice: ഉണ്ടായിരുന്നത് / കേട്ടിട്ടുള്ളത് / കണ്ടിട്ടുള്ളത് / ഉറ്റുനോക്കിയതും ... സ്പർശിച്ചതും
  rationale: ആവർത്തിക്കുന്ന ഗ്രീക്ക് നപുംസകസർവനാമത്തിന്റെ വിശാലത മലയാളത്തിലെ ‘-ത്’ രൂപങ്ങൾ സ്വാഭാവികമായി നിലനിർത്തുന്നു. ‘അവൻ’ എന്നു പരിഭാഷപ്പെടുത്തി വ്യക്തിപരമായ സൂചനയെ മുഖ്യപാഠത്തിൽ അതിയായി വ്യക്തമാക്കുന്നില്ല.
- source_word: ἦν ἀπ’ ἀρχῆς
  choice: ആരംഭംമുതൽ ഉണ്ടായിരുന്നത്
  rationale: അപൂർണഭൂതകാലമായ ἦν-നെയും യോഹന്നാന്റെ ‘ആരംഭംമുതൽ’ എന്ന പ്രയോഗത്തെയും നേരായും സ്വാഭാവികമായും പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: ἀκηκόαμεν
  choice: ഞങ്ങൾ കേട്ടിട്ടുള്ളത്
  rationale: ഗ്രീക്ക് പൂർണകാലത്തിൽ അടങ്ങിയിരിക്കുന്ന, കഴിഞ്ഞ അനുഭവത്തിന്റെ നിലനിൽക്കുന്ന സാക്ഷ്യഭാവം ‘കേട്ടിട്ടുള്ളത്’ വ്യക്തമാക്കുന്നു.
- source_word: ἑωράκαμεν τοῖς ὀφθαλμοῖς ἡμῶν
  choice: സ്വന്തം കണ്ണുകളാൽ കണ്ടിട്ടുള്ളത്
  rationale: പൂർണകാലത്തിന്റെ തുടർന്നുനിൽക്കുന്ന ദൃക്സാക്ഷ്യഭാവവും ‘ഞങ്ങളുടെ കണ്ണുകളാൽ’ എന്ന ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἐθεασάμεθα
  choice: ഞങ്ങൾ ഉറ്റുനോക്കിയത്
  rationale: വെറുതെ കാണുന്നതിലുപരി ശ്രദ്ധയോടെ നോക്കുക എന്ന θεάομαι-യുടെ സൂക്ഷ്മത ‘ഉറ്റുനോക്കുക’ നൽകുന്നു.
- source_word: αἱ χεῖρες ἡμῶν ἐψηλάφησαν
  choice: ഞങ്ങളുടെ കൈകൾ സ്പർശിച്ചത്
  rationale: ψηλαφάω സൂചിപ്പിക്കുന്ന ഭൗതികവും നേരിട്ടുള്ളതുമായ അനുഭവം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പറയുന്നു. ഗ്രീക്കിലെ ക്രിയ ഭൂതകാലമായതിനാൽ അനാവശ്യമായി പൂർണകാലമാക്കുന്നില്ല.
- source_word: περὶ
  choice: കുറിച്ച്
  rationale: സാക്ഷ്യത്തിന്റെ വിഷയത്തെ പരിചയപ്പെടുത്തുന്ന περὶ-യ്ക്ക് ‘കുറിച്ച്’ സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളമാണ്.
- source_word: τοῦ λόγου τῆς ζωῆς
  choice: ജീവന്റെ വചനം
  rationale: λόγος എന്നത് ‘വചനം’ എന്നും ‘സന്ദേശം’ എന്നും ഗ്രഹിക്കാവുന്നതാണ്. ‘ജീവന്റെ വചനം’ യോഹന്നാന്റെ ഭാഷാപ്രതിധ്വനി നിലനിർത്തുകയും പുത്രനെയും അവനെക്കുറിച്ചുള്ള ജീവദായകസന്ദേശത്തെയും സൂചിപ്പിക്കാവുന്ന അർഥവ്യാപ്തി സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: നപുംസകബന്ധവാക്യങ്ങളുടെയും λόγος എന്ന പദത്തിന്റെയും സൂചിതവിഷയം
  choice: തുടക്കത്തിൽ നപുംസകമായ ‘ഉണ്ടായിരുന്നത്’ എന്ന രൂപവും ‘ജീവന്റെ വചനം’ എന്ന പ്രയോഗവും ഉപയോഗിച്ചു; വ്യക്തിപരമായി ‘അവൻ’ എന്നു വ്യക്തമാക്കിയില്ല.
  alternative: ‘ആരംഭംമുതൽ ഉണ്ടായിരുന്നവൻ’ എന്ന് വ്യക്തിപരമായി പരിഭാഷപ്പെടുത്തുക, അല്ലെങ്കിൽ ‘ജീവന്റെ സന്ദേശം’ എന്ന് സന്ദേശാർഥം മാത്രം വ്യക്തമാക്കുക.
  rationale: ഈ വാക്യം പുത്രനെക്കുറിച്ചുള്ള യോഹന്നാനീയ സാക്ഷ്യവുമായി വ്യക്തമായി ബന്ധപ്പെട്ടിരുന്നാലും, ഗ്രീക്ക് നപുംസകബന്ധസർവനാമങ്ങൾ ഉപയോഗിക്കുന്നു; λόγος വ്യക്തിയെയോ പ്രഖ്യാപിക്കപ്പെട്ട സന്ദേശത്തെയോ മുൻനിർത്താം. മുഖ്യപാഠം ഈ ദൈവശാസ്ത്രപരമായ അർഥസംഘർഷം പരിഹരിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. മൂലവാക്യത്തിന്റെ തുടർന്നുപോകുന്ന പട്ടികാസ്വഭാവവും അവസാനത്തെ ദീർഘവിരാമവും നിലനിർത്തി. ആവർത്തിക്കുന്ന ‘-ത്’ രൂപങ്ങൾ ഗ്രീക്കിലെ നപുംസകബന്ധവാക്യങ്ങളുടെ ഘടനയും ഉദ്ദേശപൂർവമായ ആവർത്തനവും സംരക്ഷിക്കുന്നു.
