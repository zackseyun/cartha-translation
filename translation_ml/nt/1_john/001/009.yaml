id: 1JN.1.9
reference: 1 John 1:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐὰν ὁμολογῶμεν τὰς ἁμαρτίας ἡμῶν, πιστός ἐστιν καὶ δίκαιος ἵνα ἀφῇ ἡμῖν τὰς ἁμαρτίας καὶ καθαρίσῃ ἡμᾶς ἀπὸ πάσης ἀδικίας.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/009.yaml
  text: If we confess our sins[a], he is faithful and righteous to forgive us our sins and to cleanse us from all unrighteousness.
translation:
  language: ml
  text: നാം നമ്മുടെ പാപങ്ങൾ ഏറ്റുപറയുന്നെങ്കിൽ, നമ്മുടെ പാപങ്ങൾ ക്ഷമിക്കാനും സകല അനീതിയിൽനിന്നും നമ്മെ ശുദ്ധീകരിക്കാനും അവൻ വിശ്വസ്തനും നീതിമാനുമാണ്[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നീതിയുള്ളവൻ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν
  choice: എങ്കിൽ
  rationale: മൂന്നാംതരം വ്യവസ്ഥയുടെ നിബന്ധനാഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; ആവർത്തനത്തെ അമിതമായി സൂചിപ്പിക്കുന്നില്ല.
- source_word: ὁμολογῶμεν
  choice: നാം ഏറ്റുപറയുന്ന
  rationale: പാപത്തെ വാക്കാൽ അംഗീകരിക്കുകയും തുറന്നു സമ്മതിക്കുകയും ചെയ്യുന്ന അർഥം ‘ഏറ്റുപറയുക’ വ്യക്തമായി നൽകുന്നു.
- source_word: τὰς ἁμαρτίας ἡμῶν
  choice: നമ്മുടെ പാപങ്ങൾ
  rationale: ഉടമസ്ഥതയും ബഹുവചനവും ലളിതവും കൃത്യവുമായി പകരുന്നു.
- source_word: πιστός
  choice: വിശ്വസ്തൻ
  rationale: ദൈവത്തിന്റെ ആശ്രയയോഗ്യതയും തന്റെ സ്വഭാവത്തോടും വാഗ്ദാനത്തോടുമുള്ള സ്ഥിരതയും സൂചിപ്പിക്കുന്നു.
- source_word: δίκαιος
  choice: നീതിമാൻ
  rationale: ധാർമിക നേരും ന്യായവും ഉൾക്കൊള്ളുന്ന വിശാലമായ അർഥം നിലനിർത്തുന്നു; ‘ന്യായവാൻ’ എന്ന സാധുവായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: ἵνα
  choice: ക്ഷമിക്കാനും … ശുദ്ധീകരിക്കാനും
  rationale: ഇവിടെ ഉദ്ദേശ്യമോ പ്രതീക്ഷിത ഫലമോ സൂചിപ്പിക്കുന്ന ἵνα-വാക്യത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ ക്രിയാനാമഘടനയായി പകരുന്നു.
- source_word: ἀφῇ
  choice: ക്ഷമിക്കാനും
  rationale: പാപസന്ദർഭത്തിൽ ἀφίημι എന്നതിന്റെ വ്യക്തവും പതിവുമായ അർഥം നൽകുന്നു.
- source_word: ἡμῖν τὰς ἁμαρτίας
  choice: നമ്മുടെ പാപങ്ങൾ ക്ഷമിക്കാനും
  rationale: ഗ്രീക്കിലെ ദത്തിവും നേരിട്ടുള്ള കർമവും മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗത്തിൽ കൃത്യമായി പകരുന്നു.
- source_word: καθαρίσῃ
  choice: ശുദ്ധീകരിക്കാനും
  rationale: ധാർമിക അശുദ്ധി നീക്കുന്നതിന്റെ ദൃശ്യവും ക്ഷമയോടുള്ള സമാന്തരതയും നിലനിർത്തുന്നു.
- source_word: ἀπὸ πάσης ἀδικίας
  choice: സകല അനീതിയിൽനിന്നും
  rationale: ἀδικίαയുടെ ധാർമികവും ദൈവശാസ്ത്രപരവുമായ വിശാലത സംരക്ഷിക്കുന്നു; ‘സകല’ πάσης എന്നതിന്റെ സമഗ്രത വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ദൈവിക ക്ഷമയുമായി ബന്ധപ്പെട്ട് δίκαιος പരിഭാഷപ്പെടുത്തുന്നത്
  choice: നീതിമാൻ
  alternative: ന്യായവാൻ
  rationale: ക്ഷമയും ശുദ്ധീകരണവും ദൈവത്തിന്റെ സ്വഭാവത്തിൽ അധിഷ്ഠിതമാണെന്ന് വാക്യം പറയുന്നു. ‘നീതിമാൻ’ ധാർമിക നേരിനെയും ന്യായത്തെയും ഉൾക്കൊള്ളുന്നു; ‘ന്യായവാൻ’ എന്നത് സാധുവായെങ്കിലും ന്യായവിധിസംബന്ധമായ അർഥത്തിലേക്ക് വായനയെ ചുരുക്കാൻ ഇടയുള്ളതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. പാപസന്ദർഭത്തിൽ പരിചിതമായ ‘ഏറ്റുപറയുക,’ ‘ക്ഷമിക്കുക,’ ‘ശുദ്ധീകരിക്കുക’ എന്നീ പദങ്ങൾ ഉപയോഗിച്ചു; ഗ്രീക്കിലെ നിബന്ധനയും സമാന്തര ക്രിയകളും നിലനിർത്തി.
