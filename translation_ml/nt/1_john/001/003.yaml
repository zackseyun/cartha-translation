id: 1JN.1.3
reference: 1 John 1:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃ ἑωράκαμεν καὶ ἀκηκόαμεν ἀπαγγέλλομεν ⸀καὶ ὑμῖν, ἵνα καὶ ὑμεῖς κοινωνίαν ἔχητε μεθ’ ἡμῶν· καὶ ἡ κοινωνία δὲ ἡ ἡμετέρα μετὰ τοῦ πατρὸς καὶ μετὰ τοῦ υἱοῦ αὐτοῦ Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/003.yaml
  text: What we have seen and heard we also proclaim to you[a], so that you too may have fellowship with us; and indeed our fellowship is with the Father and with his Son[b], Jesus the Messiah.
translation:
  language: ml
  text: ഞങ്ങൾ കണ്ടതും കേട്ടതും നിങ്ങളോടും അറിയിക്കുന്നു; നിങ്ങൾക്കും ഞങ്ങളോടുകൂടെ കൂട്ടായ്മ[a] ഉണ്ടാകേണ്ടതിനായിട്ടാണ് ഞങ്ങൾ ഇത് അറിയിക്കുന്നത്. ഞങ്ങളുടെ കൂട്ടായ്മയാകട്ടെ പിതാവിനോടും അവിടുത്തെ പുത്രനായ യേശു മശിഹായോടും[b] കൂടെയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കൂട്ടായ്മ’ എന്നത് ‘പങ്കാളിത്തം,’ ‘പങ്കിടൽ,’ ‘സംസർഗം’ എന്നീ അർഥങ്ങളും ഉൾക്കൊള്ളാം.
    reason: lexical_alternative
  - marker: b
    text: ‘യേശു മശിഹാ’ എന്നത് പരമ്പരാഗതമായി ‘യേശുക്രിസ്തു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃ ἑωράκαμεν καὶ ἀκηκόαμεν
  choice: ഞങ്ങൾ കണ്ടതും കേട്ടതും
  rationale: ὃ എന്ന നപുംസക ഏകവചനബന്ധസർവനാമത്തിന്റെ വിശാലമായ സൂചനയെ വ്യക്തിയായി ചുരുക്കാതെ ‘-തും’ ഘടനയിൽ നിലനിർത്തുന്നു; പരിപൂർണകാലത്തിന്റെ ഇപ്പോഴും പ്രസക്തമായ സാക്ഷ്യഭാവം മലയാളസന്ദർഭത്തിൽ സ്വാഭാവികമായി കൈമാറുന്നു.
- source_word: ἀπαγγέλλομεν καὶ ὑμῖν
  choice: നിങ്ങളോടും അറിയിക്കുന്നു
  rationale: ἀπαγγέλλωയുടെ സാക്ഷ്യാധിഷ്ഠിതമായ അറിയിക്കൽ/പ്രഖ്യാപിക്കൽ ഭാവം ലളിതവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു; καίയുടെ ‘also’ അർഥം ‘നിങ്ങളോടും’ എന്നതിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἵνα καὶ ὑμεῖς κοινωνίαν ἔχητε μεθ’ ἡμῶν
  choice: നിങ്ങൾക്കും ഞങ്ങളോടു കൂട്ടായ്മ ഉണ്ടായിരിക്കേണ്ടതിനാണ് അത്
  rationale: ἵναയുടെ ഉദ്ദേശ്യഭാവവും καίയുടെ ‘നിങ്ങൾക്കും’ എന്ന ഊന്നലും നിലനിർത്തുന്നു. κοινωνίαയുടെ ബന്ധപരവും പങ്കാളിത്തപരവുമായ അർഥവ്യാപ്തിക്ക് ‘കൂട്ടായ്മ’ അനുയോജ്യം.
- source_word: καὶ ἡ κοινωνία δὲ ἡ ἡμετέρα
  choice: ഞങ്ങളുടെ കൂട്ടായ്മയാകട്ടെ
  rationale: δέയുടെ വിശദീകരണപരവും നേരിയ ഊന്നലുള്ളതുമായ സ്വരം ‘-യാകട്ടെ’ വഴി സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: μετὰ τοῦ πατρὸς
  choice: പിതാവിനോടും
  rationale: യോഹന്നാന്റെ ദൈവസംബന്ധിയായ പിതൃപദവിയെ മാന്യവും വ്യക്തവുമായ രീതിയിൽ നൽകുന്നു.
- source_word: μετὰ τοῦ υἱοῦ αὐτοῦ Ἰησοῦ Χριστοῦ
  choice: അവിടുത്തെ പുത്രനായ യേശു മശിഹായോടും
  rationale: αὐτοῦയുടെ ബന്ധം ‘അവിടുത്തെ’ എന്നും apposition ‘പുത്രനായ യേശു മശിഹാ’ എന്നും സ്വാഭാവികമായി നൽകുന്നു; Χριστός ഇവിടെ പദവിയായി ‘മശിഹാ’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
theological_decisions:
- issue: κοινωνίαയുടെ അർഥവ്യാപ്തി
  choice: കൂട്ടായ്മ
  alternative: പങ്കാളിത്തം / സംസർഗം
  rationale: വിശ്വാസികൾ തമ്മിലുള്ള ബന്ധത്തെയും പിതാവിനോടും പുത്രനോടുമുള്ള പങ്കിട്ട ജീവിതത്തെയും ഒരുപോലെ ഉൾക്കൊള്ളുന്നു; വെറും സാമൂഹികബന്ധമായോ പ്രത്യേക കൂദാശാഭാവമായോ ചുരുക്കുന്നില്ല.
- issue: Χριστοῦയുടെ പരിഭാഷ
  choice: മശിഹാ
  alternative: ക്രിസ്തു
  rationale: Ἰησοῦ Χριστοῦ എന്നതിൽ Χριστός അഭിഷിക്തനായവൻ എന്ന പദവിയുടെ അർഥം വഹിക്കുന്നതിനാൽ ‘മശിഹാ’ ഉപയോഗിച്ചു; പരമ്പരാഗതമായ ‘യേശുക്രിസ്തു’ എന്ന രൂപവും സാധ്യമാണ്.
- issue: അപ്പൊസ്തോലിക കൂട്ടായ്മയും ദൈവിക കൂട്ടായ്മയും തമ്മിലുള്ള ബന്ധം
  choice: രണ്ടു പ്രസ്താവനകളും ചേർത്തെങ്കിലും വേർതിരിച്ച നിലയിൽ നിലനിർത്തി
  alternative: രണ്ടാമത്തേതിനെ ആദ്യത്തേതിന്റെ പൂർണ്ണ വ്യാഖ്യാനമായി ലയിപ്പിക്കൽ
  rationale: ഗ്രീക്കിലെ δέ നൽകുന്ന വിശദീകരണ/ഊന്നൽഭാവം സൂക്ഷിച്ച്, വിശ്വാസികളോടുള്ള കൂട്ടായ്മയും പിതാവിനോടും പുത്രനോടുമുള്ള കൂട്ടായ്മയും തമ്മിലുള്ള ദൈവശാസ്ത്രപരമായ ബന്ധം അമിതമായി നിർവചിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ ശൈലി. ‘അവിടുത്തെ’ എന്ന ആദരസൂചക രൂപം പിതാവിനെ സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിലെ നീണ്ട വാക്യഘടന രണ്ട് മലയാളവാക്യങ്ങളാക്കി, എന്നാൽ ആശയബന്ധവും ഉദ്ദേശ്യവാക്യവും സംരക്ഷിച്ചു.
