id: 1JN.1.5
reference: 1 John 1:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἔστιν αὕτη ἡ ἀγγελία ἣν ἀκηκόαμεν ἀπ’ αὐτοῦ καὶ ἀναγγέλλομεν ὑμῖν, ὅτι ὁ θεὸς φῶς ἐστιν καὶ σκοτία ⸂ἐν αὐτῷ οὐκ ἔστιν⸃ οὐδεμία.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/005.yaml
  text: 'And this is the message that we have heard from him and announce to you: that God is light[a], and there is no darkness at all in him.'
translation:
  language: ml
  text: 'ഞങ്ങൾ അവനിൽനിന്ന് കേട്ടതും നിങ്ങളോടു അറിയിക്കുന്നതുമായ സന്ദേശം ഇതാണ്: ദൈവം വെളിച്ചമാണ്; അവനിൽ ഇരുട്ട് ഒട്ടുമില്ല.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγγελία
  choice: സന്ദേശം
  rationale: ലഭിച്ചും മറ്റുള്ളവരോട് അറിയിച്ചും കൊണ്ടിരിക്കുന്ന ഉള്ളടക്കത്തെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἀκηκόαμεν
  choice: ഞങ്ങൾ ... കേട്ടത്
  rationale: ഗ്രീക്ക് പൂർണ്ണകാലത്തിന്റെ മുൻകാല കേൾവിയും ഇപ്പോഴത്തെ പ്രസക്തിയും സന്ദർഭത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἀπ’ αὐτοῦ
  choice: അവനിൽനിന്നു
  rationale: മൂലത്തിലെ സർവനാമം അതേപടി നിലനിർത്തുന്നു; ‘യേശുവിൽനിന്ന്’ എന്ന വ്യാഖ്യാനപരമായ വ്യക്തീകരണം ചേർക്കുന്നില്ല.
- source_word: ἀναγγέλλομεν
  choice: അറിയിക്കുന്നു
  rationale: ലഭിച്ച സന്ദേശം മറ്റുള്ളവരിലേക്ക് കൈമാറുന്ന പ്രവൃത്തിയെ സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പറയുന്നു.
- source_word: ὁ θεὸς φῶς ἐστιν
  choice: ദൈവം വെളിച്ചമാണ്
  rationale: ഗ്രീക്കിലെ രൂപകം വിശദീകരണമോ ഗുണവിശേഷണമോ ചേർക്കാതെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: σκοτία
  choice: ഇരുട്ട്
  rationale: യോഹന്നാന്റെ ഭാഷയിലെ ദൃശ്യവും ധാർമികവുമായ രൂപകസാധ്യതകൾ രണ്ടും സംരക്ഷിക്കുന്ന സ്വാഭാവിക പദമാണ്.
- source_word: ἐν αὐτῷ οὐκ ἔστιν οὐδεμία
  choice: അവനിൽ ഇരുട്ട് ഒട്ടുമില്ല
  rationale: ഇരട്ട നിഷേധത്തിന്റെ ശക്തമായ ഊന്നൽ ‘ഒട്ടുമില്ല’ എന്ന സ്വാഭാവിക മലയാളപ്രയോഗത്തിലൂടെ നൽകുന്നു.
theological_decisions:
- issue: ‘ദൈവം വെളിച്ചമാണ്’ എന്ന രൂപകപ്രസ്താവന
  choice: രൂപകം നേരിട്ട് നിലനിർത്തി.
  alternative: ദൈവം വിശുദ്ധ വെളിച്ചമാണ് / ദൈവം ശുദ്ധമായ വെളിച്ചമാണ്
  rationale: ‘വിശുദ്ധ’ അല്ലെങ്കിൽ ‘ശുദ്ധമായ’ എന്നു ചേർക്കുന്നത് രൂപകത്തിന്റെ വിശാലമായ ദൈവശാസ്ത്രപരമായ അർഥം ഒരു വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കും; മൂലവാക്യം അത്തരം വിശദീകരണം നൽകുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലത്തിലെ സർവനാമപരമായ അനിശ്ചിതത്വവും വെളിച്ചം–ഇരുട്ട് രൂപകത്തിന്റെ തുറന്ന അർഥവ്യാപ്തിയും നിലനിർത്തിയിരിക്കുന്നു.
