    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘ഞങ്ങളുടെ സന്തോഷം’ എന്നതിനുപകരം ‘നിങ്ങളുടെ സന്തോഷം’ എന്നു കാണുന്നു.
    reason: textual_variant
  revision_rationale: Changed the Malayalam possessive from inclusive ‘നമ്മുടെ’ to authorial ‘ഞങ്ങളുടെ’ in order not to add a participant distinction absent from the Greek base text. Also regularized ‘പൂർണ്ണമാകേണ്ടതിന്.’ The footnote was adjusted to match the revised main-text wording while preserving the manuscript variant.
