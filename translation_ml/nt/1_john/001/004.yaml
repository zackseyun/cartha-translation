  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ταῦτα γράφομεν ⸀ἡμεῖς ἵνα ἡ χαρὰ ἡμῶν ᾖ πεπληρωμένη.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/004.yaml
  text: And we are writing these things so that our joy may be complete[a].
translation:
  language: ml
  text: ഞങ്ങളുടെ സന്തോഷം പൂർണ്ണമാകേണ്ടതിന് ഞങ്ങൾ ഈ കാര്യങ്ങൾ എഴുതുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘ഞങ്ങളുടെ സന്തോഷം’ എന്നതിനുപകരം ‘നിങ്ങളുടെ സന്തോഷം’ എന്നു കാണുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: (പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല)
  rationale: മുൻവാക്യത്തോടുള്ള ബന്ധം മലയാളത്തിലെ സ്വാഭാവിക വാക്യപ്രവാഹത്തിലൂടെ വ്യക്തമാകുന്നതിനാൽ തുടക്കത്തിലെ ‘കൂടാതെ/എന്നാൽ’ അനാവശ്യമായി തോന്നും; ബന്ധകത്തിന്റെ പ്രവർത്തനം വാക്യക്രമത്തിൽ നിലനിർത്തുന്നു.
- source_word: ταῦτα
  choice: ഈ കാര്യങ്ങൾ
  rationale: നപുംസകലിംഗ ബഹുവചന സൂചകപദം എഴുതപ്പെടുന്ന ഉള്ളടക്കത്തെ സൂചിപ്പിക്കുന്നു; ബഹുവചനഭാവം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: γράφομεν ἡμεῖς
  choice: ഞങ്ങൾ ... എഴുതുന്നു
  rationale: വർത്തമാനകാലവും വ്യക്തമായി നൽകിയിരിക്കുന്ന ഒന്നാംപുരുഷ ബഹുവചന സർവനാമവും നിലനിർത്തുന്നു. മലയാളത്തിൽ ‘ഞങ്ങൾതന്നെ’ എന്ന് അതിരുകടന്ന് ഊന്നാതെ, സർവനാമം തുറന്നുപറയുന്നതിലൂടെ യുക്തമായ ഊന്നൽ ലഭിക്കുന്നു.
- source_word: ἵνα
  choice: ആകേണ്ടതിന്
  rationale: ഉദ്ദേശ്യത്തെയും പ്രതീക്ഷിക്കപ്പെടുന്ന ഫലത്തെയും ഒരുപോലെ ഉൾക്കൊള്ളുന്ന സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളപ്രയോഗം.
- source_word: ἡ χαρὰ ἡμῶν
  choice: നമ്മുടെ സന്തോഷം
  rationale: നൽകിയിരിക്കുന്ന ഗ്രീക്ക് പാഠത്തിലെ ἡμῶν എന്ന ഒന്നാംപുരുഷ ബഹുവചന ഉടമസ്ഥരൂപം നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു; ‘നമ്മുടെ’ എന്ന ഉൾക്കൊള്ളുന്ന രൂപം എഴുത്തുകാരുടെയും വായനക്കാരുടെയും പങ്കിട്ട സന്തോഷമെന്ന സാധ്യത തുറന്നുവയ്ക്കുന്നു.
- source_word: ᾖ πεπληρωμένη
  choice: പൂർണമാകുക
  rationale: εἰμίയുടെ വർത്തമാന സബ്ജങ്ക്റ്റീവും πληρόωയുടെ പെർഫെക്റ്റ് പാസീവ് പാർട്ടിസിപ്പിളും ചേർന്ന ഘടന, നിറവിലെത്തിയ നിലയെ സൂചിപ്പിക്കുന്നു. ‘പൂർണമാകുക’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
theological_decisions:
- issue: ἡ χαρὰ ἡμῶν എന്നതിലെ സർവനാമത്തിന്റെ പാഠഭേദം
  choice: നമ്മുടെ സന്തോഷം
  alternative: നിങ്ങളുടെ സന്തോഷം
  rationale: SBLGNTയിൽ ἡμῶν (‘നമ്മുടെ’) എന്നാണ്; അതിനാൽ മുഖ്യപാഠത്തിൽ അതുതന്നെ സ്വീകരിച്ചു. χειറേഖാപാരമ്പര്യത്തിലെ ‘നിങ്ങളുടെ’ എന്ന ശ്രദ്ധേയമായ പാഠഭേദം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ ഉദ്ദേശ്യഘടനയും ബഹുവചന സൂചനയും പാഠഭേദവും സംരക്ഷിച്ചിരിക്കുന്നു; അനാവശ്യമായ സഭാപാരമ്പര്യ പദാവലി ഒഴിവാക്കി.
