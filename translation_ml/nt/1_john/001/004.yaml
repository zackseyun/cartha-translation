- from: നമ്മുടെ സന്തോഷം പൂർണമാകേണ്ടതിന് ഞങ്ങൾ ഈ കാര്യങ്ങൾ എഴുതുന്നു.[a]
  to: ഞങ്ങളുടെ സന്തോഷം പൂർണ്ണമാകേണ്ടതിന് ഞങ്ങൾ ഈ കാര്യങ്ങൾ എഴുതുന്നു.[a]
  rationale: Changed the Malayalam possessive from inclusive ‘നമ്മുടെ’ to authorial ‘ഞങ്ങളുടെ’ in order not to add a participant distinction absent from the Greek base text. Also regularized ‘പൂർണ്ണമാകേണ്ടതിന്.’ The footnote was adjusted to match the revised main-text wording while preserving the manuscript variant.
