id: 1JN.1.7
reference: 1 John 1:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐὰν δὲ ἐν τῷ φωτὶ περιπατῶμεν ὡς αὐτός ἐστιν ἐν τῷ φωτί, κοινωνίαν ἔχομεν μετ’ ἀλλήλων καὶ τὸ αἷμα ⸀Ἰησοῦ τοῦ υἱοῦ αὐτοῦ καθαρίζει ἡμᾶς ἀπὸ πάσης ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/007.yaml
  text: But if we walk in the light[a], as he himself is in the light, we have fellowship with one another[b], and the blood of Jesus his Son cleanses us from every sin.
translation:
  language: ml
  text: എന്നാൽ, അവൻതന്നെ വെളിച്ചത്തിൽ ഇരിക്കുന്നതുപോലെ നാം വെളിച്ചത്തിൽ നടക്കുന്നെങ്കിൽ, നമുക്കു തമ്മിൽ[a] കൂട്ടായ്മയുണ്ട്; അവന്റെ പുത്രനായ യേശുവിന്റെ രക്തം ഓരോ പാപത്തിൽനിന്നും[b] നമ്മെ ശുദ്ധീകരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പരസ്പരം.’ ‘തമ്മിൽ’ എന്നത് വിശ്വാസികളും ദൈവവും തമ്മിലുള്ള കൂട്ടായ്മയെ സൂചിപ്പിക്കുന്നുവെന്ന് ചിലർ മനസ്സിലാക്കുന്നു; എന്നാൽ ഗ്രീക്കിലെ പരസ്പരസർവനാമം ഏറ്റവും സ്വാഭാവികമായി വിശ്വാസികൾ തമ്മിലുള്ള കൂട്ടായ്മയെ സൂചിപ്പിക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, ‘സകല പാപത്തിൽനിന്നും.’ ഗ്രീക്ക് പ്രയോഗം വിതരണാത്മകമായി (‘ഓരോ പാപത്തിൽനിന്നും’) അല്ലെങ്കിൽ സമാഹാരാത്മകമായി (‘സകല പാപത്തിൽനിന്നും’) മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: എന്നാൽ ... നടക്കുന്നെങ്കിൽ
  rationale: δέ മുൻവാക്യത്തിലെ ഇരുട്ടിൽ നടക്കുന്നതിനെക്കുറിച്ചുള്ള അവകാശവാദത്തോട് വൈരുധ്യം സൂചിപ്പിക്കുന്നു; ἐάν നിബന്ധന വ്യക്തമാക്കുന്നു.
- source_word: ἐν τῷ φωτὶ
  choice: വെളിച്ചത്തിൽ
  rationale: യോഹന്നാന്റെ പ്രമേയപരവും രൂപകാത്മകവുമായ ‘വെളിച്ചം’ എന്ന ദൃശ്യബിംബം വ്യാഖ്യാനിച്ചുമാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: περιπατῶμεν
  choice: നാം ... നടക്കുന്നെങ്കിൽ
  rationale: ജീവിതരീതിയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് രൂപകം ‘ജീവിക്കുന്നെങ്കിൽ’ എന്നു പരാവർത്തനം ചെയ്യാതെ സംരക്ഷിക്കുന്നു.
- source_word: ὡς αὐτός ἐστιν ἐν τῷ φωτί
  choice: അവിടുന്ന് വെളിച്ചത്തിൽ ആയിരിക്കുന്നതുപോലെ
  rationale: താരതമ്യത്തിന്റെ സ്വഭാവം നിലനിർത്തുകയും αὐτός എന്ന വ്യക്തമായ സർവനാമത്തെ ആദരസൂചകമായ സ്വാഭാവിക മലയാളത്തിൽ പ്രതിഫലിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: κοινωνίαν ἔχομεν
  choice: നമുക്ക് ... കൂട്ടായ്മയുണ്ട്
  rationale: κοινωνία സൂചിപ്പിക്കുന്ന പങ്കാളിത്തവും ബന്ധപരമായ സഹവാസവും, പ്രത്യേക കൂദാശാഭാവം നിർബന്ധിക്കാതെ, സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: μετ’ ἀλλήλων
  choice: പരസ്പരം
  rationale: ἀλλήλων എന്ന പരസ്പരസർവനാമത്തിന്റെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളരൂപം.
- source_word: τὸ αἷμα Ἰησοῦ τοῦ υἱοῦ αὐτοῦ
  choice: അവിടുത്തെ പുത്രനായ യേശുവിന്റെ രക്തം
  rationale: ‘രക്തം’ എന്നതിനെ വാക്യത്തിന്റെ കർത്താവായി നിലനിർത്തുകയും യേശുവിനെ ദൈവത്തിന്റെ പുത്രനായി വ്യക്തമാക്കുന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുകയും ചെയ്യുന്നു.
- source_word: καθαρίζει
  choice: ശുദ്ധീകരിക്കുന്നു
  rationale: ധാർമികവും ആചാരപരവുമായ ശുദ്ധീകരണത്തിന്റെ അർഥസാധ്യതകൾ ഉൾക്കൊള്ളുന്നു; വർത്തമാനകാലം തുടരുന്നതോ സ്വഭാവസവിശേഷമായതോ ആയ പ്രവർത്തനത്തെ അമിതമായി വിശദീകരിക്കാതെ അറിയിക്കുന്നു.
- source_word: ἀπὸ πάσης ἁμαρτίας
  choice: ഓരോ പാപത്തിൽനിന്നും
  rationale: πάσης + ഏകവചനമായ ἁμαρτίας എന്ന പ്രയോഗത്തിന്റെ വിതരണാത്മക അർഥം വ്യക്തമാക്കുന്നു; സമാഹാരാത്മകമായ ‘സകല പാപത്തിൽനിന്നും’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: μετ’ ἀλλήλων (‘പരസ്പരം’) എന്നതിന്റെ സൂചിതർ
  choice: വിശ്വാസികൾ തമ്മിലുള്ള പരസ്പര കൂട്ടായ്മ
  alternative: വിശ്വാസികളും ദൈവവും തമ്മിലുള്ള കൂട്ടായ്മ
  rationale: ἀλλήλων എന്ന പരസ്പരപ്രയോഗം ഏറ്റവും സ്വാഭാവികമായി മനുഷ്യർ തമ്മിലുള്ള പരസ്പരബന്ധത്തെയാണ് സൂചിപ്പിക്കുന്നത്. വിശാലസന്ദർഭം ദൈവവുമായുള്ള കൂട്ടായ്മ ഉൾക്കൊള്ളുന്നുവെങ്കിലും, ഈ വാക്യഭാഗത്തിന്റെ വ്യാകരണപരമായ പരസ്പരത പ്രധാനപാഠത്തിൽ നിലനിർത്തുന്നു.
- issue: καθαρίζει എന്ന വർത്തമാനകാലത്തിന്റെ പ്രാബല്യം
  choice: ‘ശുദ്ധീകരിക്കുന്നു’ എന്ന ലളിത വർത്തമാനകാലത്തിലൂടെ തുടരുന്നതോ സ്വഭാവസവിശേഷമായതോ ആയ ശുദ്ധീകരണം
  alternative: ഒറ്റത്തവണത്തെ ശുദ്ധീകരണം; അല്ലെങ്കിൽ ‘തുടർന്നും ശുദ്ധീകരിച്ചുകൊണ്ടിരിക്കുന്നു’ എന്ന വ്യക്തമായ പുരോഗമനരൂപം
  rationale: ഗ്രീക്ക് വർത്തമാനകാലം ഇവിടെ തുടരുന്നതോ പതിവായതോ ആയ പ്രവർത്തനം സൂചിപ്പിക്കാം; എന്നാൽ ‘തുടർന്നും’ പോലുള്ള വ്യാഖ്യാനവികാസം ചേർക്കാതെ മലയാളത്തിലെ ലളിത വർത്തമാനകാലം ആ സാധ്യത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവപൂർണവുമായ ശൈലി. ‘നടക്കുക,’ ‘വെളിച്ചം,’ ‘രക്തം,’ ‘ശുദ്ധീകരിക്കുക’ എന്നീ യോഹന്നാനീയ രൂപകങ്ങളും ദൈവശാസ്ത്രപരമായ പദങ്ങളും വ്യാഖ്യാനിച്ചുമാറ്റാതെ നിലനിർത്തിയിരിക്കുന്നു. ദൈവത്തെ സൂചിപ്പിക്കാൻ ആദരസൂചകമായ ‘അവിടുന്ന്/അവിടുത്തെ’ ഉപയോഗിച്ചു.
