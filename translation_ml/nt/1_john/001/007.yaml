- from: എന്നാൽ, അവിടുന്ന് വെളിച്ചത്തിൽ ആയിരിക്കുന്നതുപോലെ നാം വെളിച്ചത്തിൽ നടക്കുന്നെങ്കിൽ, നമുക്ക് പരസ്പരം[a] കൂട്ടായ്മയുണ്ട്; അവിടുത്തെ പുത്രനായ യേശുവിന്റെ രക്തം ഓരോ പാപത്തിൽനിന്നും[b] നമ്മെ ശുദ്ധീകരിക്കുന്നു.
  to: എന്നാൽ, അവൻതന്നെ വെളിച്ചത്തിൽ ഇരിക്കുന്നതുപോലെ നാം വെളിച്ചത്തിൽ നടക്കുന്നെങ്കിൽ, നമുക്കു തമ്മിൽ[a] കൂട്ടായ്മയുണ്ട്; അവന്റെ പുത്രനായ യേശുവിന്റെ രക്തം ഓരോ പാപത്തിൽനിന്നും[b] നമ്മെ ശുദ്ധീകരിക്കുന്നു.
