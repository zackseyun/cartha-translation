id: PHP.1.5
reference: Philippians 1:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐπὶ τῇ κοινωνίᾳ ὑμῶν εἰς τὸ εὐαγγέλιον ἀπὸ ⸀τῆς πρώτης ἡμέρας ἄχρι τοῦ νῦν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/005.yaml
  text: because of your partnership in the gospel from the first day until now,[a]
translation:
  language: ml
  text: ആദ്യ ദിവസം മുതൽ ഇന്നുവരെ സുവിശേഷത്തിലുള്ള നിങ്ങളുടെ പങ്കാളിത്തം നിമിത്തം,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സുവിശേഷത്തിനായുള്ള.’ പങ്കാളിത്തത്തിന്റെ മേഖലയെയോ അതിന്റെ ലക്ഷ്യം/ഉദ്ദേശ്യത്തെയോ ഗ്രീക്ക് പ്രയോഗം സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τῇ κοινωνίᾳ
  choice: പങ്കാളിത്തം നിമിത്തം
  rationale: ἐπί + ദത്തിവ് ഇവിടെ ചുറ്റുമുള്ള വാക്യത്തിലെ നന്ദിയുടെ കാരണത്തെ സൂചിപ്പിക്കുന്നു; κοινωνία സ്നേഹബന്ധം മാത്രമല്ല, സജീവമായ കൂട്ടുപങ്കാളിത്തവുമാണ്.
- source_word: ὑμῶν
  choice: നിങ്ങളുടെ
  rationale: ഫിലിപ്പിയർ ഈ പങ്കാളിത്തത്തിൽ ഉൾപ്പെട്ടവരാണെന്ന് ജനിറ്റീവ് സർവനാമം സൂചിപ്പിക്കുന്നു.
- source_word: εἰς τὸ εὐαγγέλιον
  choice: സുവിശേഷത്തിലുള്ള
  rationale: ഈ പ്രയോഗം പങ്കാളിത്തത്തിന്റെ മേഖലയെയോ ലക്ഷ്യത്തെയോ സൂചിപ്പിക്കാം. മുഖ്യപാഠത്തിൽ മേഖലയെന്ന അർഥം സ്വാഭാവികമായി നൽകി, ലക്ഷ്യാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: εὐαγγέλιον
  choice: സുവിശേഷം
  rationale: പൗലോസിന്റെ സന്ദർഭത്തിൽ സ്ഥിരവും ദൈവശാസ്ത്രപരമായി സമൃദ്ധവുമായ മലയാളപ്രയോഗം.
- source_word: ἀπὸ τῆς πρώτης ἡμέρας ἄχρι τοῦ νῦν
  choice: ആദ്യദിവസംമുതൽ ഇന്നുവരെ
  rationale: പങ്കാളിത്തത്തിന്റെ ആരംഭവും ഇപ്പോഴോളം അതിന്റെ തുടർച്ചയും സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: εἰς τὸ εὐαγγέλιον എന്നതിലെ ബന്ധം
  choice: സുവിശേഷത്തിലുള്ള
  alternative: സുവിശേഷത്തിനായുള്ള
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിന് പങ്കാളിത്തത്തിന്റെ മേഖലയെയും അതിന്റെ ലക്ഷ്യം/ഉദ്ദേശ്യത്തെയും സൂചിപ്പിക്കാനാകും; ഒന്നിനെ മാത്രം അന്തിമമാക്കാതെ മറുവായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘കൂട്ടായ്മ’ എന്നതിനെക്കാൾ സജീവമായ പങ്കുചേരൽ വ്യക്തമാക്കാൻ ‘പങ്കാളിത്തം’ ഉപയോഗിച്ചു; വാക്യം മുൻവാക്യവുമായി വ്യാകരണപരമായി ചേരുന്ന ഖണ്ഡവാക്യമായി നിലനിർത്തി.
