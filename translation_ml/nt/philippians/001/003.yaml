    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐχαριστῶ
  choice: നന്ദി പറയുന്നു
  rationale: വർത്തമാനകാലത്തിലെ ഒന്നാംപുരുഷ ഏകവചന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: τῷ θεῷ μου
  choice: എന്റെ ദൈവത്തിനു
  rationale: εὐχαριστέω എന്ന ക്രിയയോടൊപ്പമുള്ള സമ്പ്രദാനിക വിഭക്തി മലയാളത്തിൽ ‘ദൈവത്തിനു നന്ദി പറയുന്നു’ എന്ന് സ്വാഭാവികമായി വരുന്നു; ‘എന്റെ’ എന്ന ഉടമസ്ഥസർവനാമവും നിലനിർത്തുന്നു.
- source_word: ἐπὶ
  choice: ഓർക്കുമ്പോഴെല്ലാം
  rationale: സമ്പ്രദാനിക വിഭക്തിയോടുകൂടിയ ἐπὶ ഇവിടെ നന്ദിപറയുന്നതിന്റെ സന്ദർഭമോ അവസരമോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ കാലസൂചക ഘടന ഈ ബന്ധം സ്വാഭാവികമായി പകർന്നുനൽകുന്നു.
- source_word: πάσῃ
  choice: -പ്പോഴെല്ലാം
  rationale: ഏകവചനമായ μνείᾳയോടുള്ള വിതരണാർഥം ‘ഓർക്കുമ്പോഴെല്ലാം’ എന്ന പ്രയോഗത്തിൽ വ്യക്തമായി നിലനിൽക്കുന്നു.
- source_word: μνείᾳ
  choice: ഓർക്കുമ്പോൾ
  rationale: ഓർമിക്കൽ അഥവാ അനുസ്മരണം എന്ന ആശയം നാമരൂപത്തെക്കാൾ സ്വാഭാവികമായ മലയാള ക്രിയാരൂപത്തിൽ നൽകുന്നു.
- source_word: ὑμῶν
  choice: നിങ്ങളെ
  rationale: രണ്ടാംപുരുഷ ബഹുവചനത്തെ സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ἐπὶ πάσῃ τῇ μνείᾳ ὑμῶν എന്നതിലെ ἐπὶയുടെ ബന്ധം
  choice: നിങ്ങളെ ഓർക്കുമ്പോഴെല്ലാം
  alternative: നിങ്ങളെക്കുറിച്ചുള്ള ഓരോ ഓർമയ്ക്കായും
  rationale: പ്രധാന പാഠം ἐπὶയെ നന്ദിപറയുന്നതിനുള്ള അവസരമായി വായിക്കുന്നു; എന്നാൽ കാരണമോ അടിസ്ഥാനമോ സൂചിപ്പിക്കുന്ന വായനയും വ്യാകരണപരമായി സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. മൂലത്തിലെ അർഥബന്ധം സ്വാഭാവികമാക്കാൻ നാമരൂപമായ ‘ഓർമ’ പ്രധാന പാഠത്തിൽ ‘ഓർക്കുമ്പോൾ’ എന്ന ക്രിയാഘടനയായി നൽകിയിരിക്കുന്നു; യഥാർഥമായ മറ്റൊരു വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
