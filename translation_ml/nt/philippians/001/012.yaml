id: PHP.1.12
reference: Philippians 1:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Γινώσκειν δὲ ὑμᾶς βούλομαι, ἀδελφοί, ὅτι τὰ κατ’ ἐμὲ μᾶλλον εἰς προκοπὴν τοῦ εὐαγγελίου ἐλήλυθεν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/012.yaml
  text: I want you to know[a], brothers, that what has happened to me has actually advanced the good news[b],
translation:
  language: ml
  text: സഹോദരന്മാരേ[a], എനിക്കു സംഭവിച്ച കാര്യങ്ങൾ വാസ്തവത്തിൽ സുവാർത്തയുടെ[b] പുരോഗതിക്കു സഹായകമായിത്തീർന്നിരിക്കുന്നുവെന്ന് നിങ്ങൾ അറിയണമെന്നാണ് ഞാൻ ആഗ്രഹിക്കുന്നത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, സഹോദരന്മാരും സഹോദരിമാരും; ഗ്രീക്കിൽ ‘സഹോദരന്മാർ’ എന്നാണ്. ഈ പദം വിശ്വാസിസമൂഹം മുഴുവനെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, സുവിശേഷത്തിന്റെ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γινώσκειν ... βούλομαι
  choice: നിങ്ങൾ അറിയണമെന്നാണ് ഞാൻ ആഗ്രഹിക്കുന്നത്
  rationale: അറിയിക്കുക എന്ന ലേഖനശൈലിയെയും പൗലോസിന്റെ വ്യക്തിപരമായ ആഗ്രഹത്തെയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: ഇവിടെ δέ ശക്തമായ വിരോധമല്ല, മൃദുവായ വിഷയമാറ്റമാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിലെ വാക്യക്രമം തന്നെ ആ മാറ്റം സ്വാഭാവികമായി വഹിക്കുന്നതിനാൽ ‘എന്നാൽ’ എന്നു ചേർത്ത് അനാവശ്യമായ വിരോധാർഥം സൃഷ്ടിച്ചിട്ടില്ല.
- source_word: ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചന അഭിസംബോധന മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; സഭാസമൂഹം മുഴുവനും ഉൾപ്പെടാവുന്ന അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: τὰ κατ’ ἐμὲ
  choice: എനിക്കു സംഭവിച്ച കാര്യങ്ങൾ
  rationale: പൗലോസിന്റെ ഇപ്പോഴത്തെ അവസ്ഥയിലേക്കു നയിച്ച സംഭവങ്ങളെ വിശാലമായി സൂചിപ്പിക്കുന്ന പ്രയോഗം സാധാരണ വായനക്കാർക്കു വ്യക്തമായി നൽകുന്നു.
- source_word: μᾶλλον
  choice: മറിച്ച്
  rationale: പ്രതീക്ഷിച്ചതിന് വിപരീതമായ ഫലമാണ് ഉണ്ടായതെന്ന താരതമ്യാത്മക ഊന്നൽ നിലനിർത്തുന്നു; വെറും ‘വാസ്തവത്തിൽ’ എന്നതിനെക്കാൾ ഗ്രീക്കിലെ പ്രതിവിരുദ്ധ ഭാവം വ്യക്തമാണ്.
- source_word: εἰς προκοπὴν
  choice: പുരോഗതിക്കു കാരണമായിത്തീർന്നിരിക്കുന്നു
  rationale: ഒരു ഫലത്തിലേക്കോ മുന്നേറ്റത്തിലേക്കോ നയിച്ചതെന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: τοῦ εὐαγγελίου
  choice: സുവാർത്തയുടെ
  rationale: εὐαγγέλιον എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘നല്ല വാർത്ത’ ആധുനികവും സഭാപരിസരത്തിൽ മനസ്സിലാകുന്നതുമായ പദത്തിൽ നൽകുന്നു; പരമ്പരാഗതമായ ‘സുവിശേഷം’ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἐλήλυθεν
  choice: കാരണമായിത്തീർന്നിരിക്കുന്നു
  rationale: മുൻകാല സംഭവങ്ങളിൽനിന്ന് ഉണ്ടായതും ഇപ്പോഴും നിലനിൽക്കുന്നതുമായ ഫലത്തെ ഗ്രീക്ക് സമ്പൂർണ്ണകാലത്തിന് യോജിച്ച രീതിയിൽ പ്രകടിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ലേഖനശൈലി ഉപയോഗിച്ചു. ‘മറിച്ച്’ എന്നത് പ്രതീക്ഷയ്ക്കു വിപരീതമായ പുരോഗതിയെ സൂചിപ്പിക്കുന്നു; കൃത്രിമമായ ശക്തമായ ബന്ധകപദം ചേർക്കാതെ δέയുടെ മൃദുവായ വിഷയമാറ്റം വാക്യഘടനയിലൂടെ കൈകാര്യം ചെയ്തു.
