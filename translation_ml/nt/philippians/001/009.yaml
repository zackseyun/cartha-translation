translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പമുള്ള, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള മലയാളം. ഗ്രീക്ക് വാക്യത്തിന്റെ ആശയം സ്വാഭാവിക മലയാള പ്രാർഥനാഘടനയിൽ അവതരിപ്പിക്കുന്നു. പ്രധാനപാഠത്തിലെ [a], [b] അടയാളങ്ങൾ ബന്ധപ്പെട്ട പദസമുച്ചയത്തിനു പിന്നാലെ നൽകിയിരിക്കുന്നു.
