id: PHP.1.17
reference: Philippians 1:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ ἐξ ⸂ἐριθείας τὸν Χριστὸν καταγγέλλουσιν, οὐχ ἁγνῶς, οἰόμενοι θλῖψιν ἐγείρειν τοῖς δεσμοῖς μου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/017.yaml
  text: But the others proclaim the Messiah out of selfish ambition[a], not sincerely[b], thinking to raise up affliction for me in my imprisonment.
translation:
  language: ml
  text: എന്നാൽ മറ്റുള്ളവർ സ്വാർഥാഭിലാഷത്താൽ മശീഹയെ[a] പ്രഖ്യാപിക്കുന്നു; ശുദ്ധമായ ഉദ്ദേശ്യത്തോടെയല്ല, എന്റെ തടവിൽ[b] എനിക്കു കഷ്ടത വർധിപ്പിക്കാമെന്നു കരുതിയാണ് അവർ അങ്ങനെ ചെയ്യുന്നത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “ക്രിസ്തുവിനെ.”
    reason: alternative_reading
  - marker: b
    text: അക്ഷരാർഥത്തിൽ “എന്റെ ബന്ധനങ്ങളിൽ”; അതായത്, എന്റെ തടവിൽ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐριθείας
  choice: സ്വാർഥമോഹത്താൽ
  rationale: സ്വന്തം നേട്ടം ലക്ഷ്യമാക്കുന്ന മത്സരബുദ്ധിയെയും കക്ഷിതാൽപര്യത്തെയും സൂചിപ്പിക്കുന്ന പദമാണിത്; വെറും പൊതുവായ സ്വാർഥതയെക്കാൾ ഉദ്ദേശ്യത്തിന്റെ ദുഷ്ടത വ്യക്തമാക്കുന്നു.
- source_word: Χριστόν
  choice: മശീഹയെ
  rationale: ഇവിടെ യേശുവിന്റെ മശീഹാപദവിയാണ് പ്രഖ്യാപനത്തിന്റെ ഉള്ളടക്കം; അതിനാൽ പേരുപോലെ ഉപയോഗിക്കുന്ന ‘ക്രിസ്തു’ എന്നതിനെക്കാൾ സ്ഥാനപ്പേരായ ‘മശീഹ’ യോജിക്കുന്നു.
- source_word: καταγγέλλουσιν
  choice: പ്രഖ്യാപിക്കുന്നു
  rationale: ഔപചാരിക പ്രസംഗത്തിൽ മാത്രം ഒതുക്കാതെ പരസ്യമായി അറിയിക്കുന്നതിന്റെ അർഥം നിലനിർത്തുന്നു.
- source_word: ἁγνῶς
  choice: ആത്മാർഥമായല്ല
  rationale: സന്ദർഭത്തിൽ ശുദ്ധമായ ഉദ്ദേശ്യത്തോടെയല്ല എന്ന ആശയമാണ്; സ്വാഭാവികമായ മലയാളത്തിൽ ഉദ്ദേശ്യത്തിലെ കാപട്യം ഇതിലൂടെ വ്യക്തമാകുന്നു.
- source_word: οἰόμενοι
  choice: കരുതിയാണ്
  rationale: അവരുടെ വിചാരത്തെയും ലക്ഷ്യത്തെയും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; അത് യഥാർഥത്തിൽ ഫലിച്ചുവെന്ന് വാക്യം ഉറപ്പിക്കുന്നില്ല.
- source_word: θλῖψιν ἐγείρειν
  choice: കഷ്ടത വർധിപ്പിക്കാമെന്ന്
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘കഷ്ടത ഉയർത്തുക’ മലയാളത്തിൽ അസ്വാഭാവികമാണ്; തടവിലുള്ള പൗലൊസിന്റെ ദുരിതം കൂടുതൽ രൂക്ഷമാക്കാനുള്ള ഉദ്ദേശ്യം ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: τοῖς δεσμοῖς μου
  choice: ഞാൻ തടവിലായിരിക്കുമ്പോൾ
  rationale: ‘എന്റെ ബന്ധനങ്ങൾ’ എന്ന അക്ഷരാർഥപ്രയോഗം തടവിനെ സൂചിപ്പിക്കുന്ന ലാക്ഷണിക ഭാഷയാണ്; മുഖ്യവാചകത്തിൽ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകിയിരിക്കുന്നു.
theological_decisions:
- issue: Χριστός എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: പ്രഖ്യാപിക്കപ്പെടുന്നവന്റെ അഭിഷിക്തസ്ഥാനമാണ് ഇവിടെ മുൻനിൽക്കുന്നത്. അതിനാൽ സ്ഥാനപ്പേരിന്റെ അർഥം പ്രകടമാക്കുന്ന ‘മശീഹ’ മുഖ്യവാചകത്തിൽ സ്വീകരിച്ചു; പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- issue: οἰόμενοι സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യവും ഫലവും
  choice: അവർ കഷ്ടത വർധിപ്പിക്കാമെന്നു കരുതുന്നു
  alternative: അവർ കഷ്ടത വർധിപ്പിക്കുന്നു
  rationale: മൂലപാഠം അവരുടെ വിചാരത്തെയോ ഉദ്ദേശ്യത്തെയോ പ്രസ്താവിക്കുന്നു; അവരുടെ ശ്രമം വിജയിച്ചുവെന്ന് നിർണയിക്കുന്നില്ല. ആ തുറന്ന നില പരിഭാഷയിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിലെ ഉദ്ദേശ്യബന്ധം വ്യക്തമായി നൽകാൻ ദീർഘവാക്യം രണ്ടായി വിഭജിച്ചു; എങ്കിലും വിരോധം, പ്രേരണം, ആത്മാർഥതയുടെ അഭാവം, പൗലൊസിന്റെ തടവിലെ കഷ്ടത വർധിപ്പിക്കാനുള്ള വിചാരം എന്നിവ മുഴുവനും നിലനിർത്തി.
