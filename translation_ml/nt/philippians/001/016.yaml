translation:
  language: ml
  text: ആദ്യത്തേവർ സ്നേഹത്താൽ അങ്ങനെ ചെയ്യുന്നു; സുവാർത്തയുടെ പ്രതിരോധത്തിനായി ഞാൻ നിയോഗിക്കപ്പെട്ടിരിക്കുന്നുവെന്ന് അവർ അറിയുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
