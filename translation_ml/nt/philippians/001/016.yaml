    text: 'അക്ഷരാർഥത്തിൽ: “ആദ്യത്തേവർ സ്നേഹത്തിൽനിന്ന്”; ചുറ്റുമുള്ള സന്ദർഭത്തിൽനിന്ന് പ്രവൃത്തി മനസ്സിലാക്കേണ്ടതാണ്.'
