reference: Philippians 1:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πεποιθὼς αὐτὸ τοῦτο ὅτι ὁ ἐναρξάμενος ἐν ὑμῖν ἔργον ἀγαθὸν ἐπιτελέσει ἄχρι ἡμέρας ⸂Χριστοῦ Ἰησοῦ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/006.yaml
  text: 'I am confident of this very thing: that he who began a good work among you will bring it to completion at the day of Messiah Jesus.'
translation:
  language: ml
  text: 'ഈ കാര്യത്തിൽത്തന്നെ എനിക്ക് ഉറപ്പുണ്ട്: നിങ്ങളുടെ ഇടയിൽ[a] ഒരു നല്ല പ്രവൃത്തി ആരംഭിച്ചവൻ മശീഹയായ[b] യേശുവിന്റെ നാൾവരെ[c] അതു പൂർത്തിയാക്കും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നിങ്ങളിൽ.”
    reason: lexical_alternative
  - marker: b
    text: 'പരമ്പരാഗത പരിഭാഷ: “ക്രിസ്തുയേശുവിന്റെ.”'
    reason: lexical_alternative
  - marker: c
    text: അഥവാ “മശീഹയായ യേശുവിന്റെ നാളിൽ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πεποιθὼς
  choice: എനിക്ക് ഉറപ്പുണ്ട്
  rationale: ചുറ്റുപാടിലുള്ള പൗലോസിന്റെ ഒന്നാംപുരുഷ വീക്ഷണം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: αὐτὸ τοῦτο
  choice: ഈ കാര്യംതന്നെ
  rationale: ഇരട്ട നിർദേശകപ്രയോഗത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: ὁ ἐναρξάμενος
  choice: ആരംഭിച്ചവൻ
  rationale: വ്യക്തിപരമായ കർത്താവിനെ നിലനിർത്തുന്നു; അത് ദൈവമാണെന്ന് വാചകത്തിൽ വിശദീകരിച്ചു ചേർക്കുന്നില്ല.
- source_word: ἐν ὑμῖν
  choice: നിങ്ങളുടെയിടയിൽ
  rationale: ὑμῖν ബഹുവചനമായതിനാലും സഭാസമൂഹത്തെയാണ് അഭിസംബോധന ചെയ്യുന്നതെന്നതിനാലും സമൂഹപരമായ വ്യാപ്തി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἔργον ἀγαθὸν
  choice: ഒരു നല്ല പ്രവൃത്തി
  rationale: ഗ്രീക്കിന്റെ നേരിട്ടുള്ളതും വിപുലീകരണമില്ലാത്തതുമായ പരിഭാഷ.
- source_word: ἐπιτελέσει
  choice: അതു പൂർത്തിയാക്കും
  rationale: പ്രവൃത്തി വിജയകരമായി സമാപിപ്പിക്കുമെന്ന അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: ἄχρι ἡμέρας
  choice: നാളിൽ
  rationale: പ്രവൃത്തി അന്തിമമായി പൂർത്തിയാകുന്ന എസ്കറ്റോളജിക്കൽ നാളിനെ സ്വാഭാവിക മലയാളത്തിൽ ലക്ഷ്യബിന്ദുവായി അവതരിപ്പിക്കുന്നു; കൂടുതൽ അക്ഷരാർഥമായ കാലപരിധിപ്രയോഗം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: Χριστοῦ Ἰησοῦ
  choice: മശീഹയായ യേശുവിന്റെ
  rationale: Χριστός ഇവിടെ പദവിയായതിനാൽ പരമ്പരാഗത ലിപ്യന്തരണത്തിനു പകരം അതിന്റെ പദവിയർഥം പരിഭാഷപ്പെടുത്തുന്നു.
theological_decisions:
- issue: ദൈവത്തിന്റെ പ്രവൃത്തിയുടെ വ്യാപ്തി വ്യക്തിപരമാണോ സമൂഹപരമാണോ
  choice: പ്രധാനവാചകത്തിൽ ‘നിങ്ങളുടെയിടയിൽ’ എന്ന സമൂഹപരമായ പ്രയോഗം
  alternative: ‘നിങ്ങളിൽ’ എന്ന പ്രയോഗം; ഇത് വ്യക്തിപരമായ അർഥത്തെയും അനുവദിക്കുന്നു
  rationale: ബഹുവചന സർവനാമവും ഫിലിപ്പിയിലെ സഭയോടുള്ള അഭിസംബോധനയും സമൂഹപരമായ വായനയെ പിന്തുണയ്ക്കുന്നു; എങ്കിലും വ്യക്തികളിലുള്ള പ്രയോഗസാധ്യത അടിക്കുറിപ്പിലൂടെ നിലനിർത്തുന്നു.
- issue: ἄχρι ἡμέρας പ്രവൃത്തിയുടെ തുടർച്ചയെയോ പൂർത്തീകരണത്തിന്റെ സമയബിന്ദുവിനെയോ ഊന്നുന്നുവോ
  choice: ‘നാളിൽ’ എന്നു നൽകി പൂർത്തീകരണത്തിന്റെ അന്തിമ സമയബിന്ദു പ്രകടമാക്കി
  alternative: ‘നാൾവരെ’ എന്ന കൂടുതൽ അക്ഷരാർഥമായ കാലപരിധിപ്രയോഗം
  rationale: രണ്ട് വായനകളുടെയും സാധ്യത സംരക്ഷിച്ച്, പ്രധാനവാചകത്തിൽ സ്വാഭാവികമായ മലയാളവും അടിക്കുറിപ്പിൽ ഗ്രീക്കിന്റെ നേരിട്ടുള്ള കാലപരിധിയും നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. സമൂഹപരമായ അഭിസംബോധനയും കാലസംബന്ധമായ അർഥവ്യത്യാസവും അടിക്കുറിപ്പുകളിലൂടെ സംരക്ഷിച്ചിരിക്കുന്നു.
