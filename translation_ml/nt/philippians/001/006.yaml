  to: 'ഈ കാര്യത്തിൽത്തന്നെ എനിക്ക് ഉറപ്പുണ്ട്: നിങ്ങളുടെ ഇടയിൽ[a] ഒരു നല്ല പ്രവൃത്തി ആരംഭിച്ചവൻ മശീഹയായ[b] യേശുവിന്റെ നാൾവരെ[c] അതു പൂർത്തിയാക്കും.'
