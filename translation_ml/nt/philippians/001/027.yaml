  revised_text: 'ഒരേ ഒരു കാര്യം: മശീഹയുടെ സുവിശേഷത്തിന് യോജിച്ചവിധം ജീവിക്കുവിൻ[a]. അങ്ങനെ, ഞാൻ വന്ന് നിങ്ങളെ കണ്ടാലും അകന്നിരുന്നാലും, നിങ്ങൾ ഒരേ ആത്മാവിൽ[b] ഉറച്ചുനിൽക്കുകയും ഒരേ മനസ്സോടെ[c] സുവിശേഷത്തിന്റെ വിശ്വാസത്തിനായി[d] ഒരുമിച്ചു പോരാടുകയും ചെയ്യുന്നു എന്നു നിങ്ങളെക്കുറിച്ച് എനിക്കു കേൾക്കാൻ കഴിയേണ്ടതിന്.'
