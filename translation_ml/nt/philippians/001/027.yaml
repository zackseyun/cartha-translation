revisions:
- from: 'ഒരേയൊരു കാര്യം: മശീഹയുടെ സുവിശേഷത്തിന് യോഗ്യമായവിധം ജീവിക്കുക[a]. അങ്ങനെ, ഞാൻ വന്ന് നിങ്ങളെ കണ്ടാലും അകലെയിരുന്നാലും, നിങ്ങൾ ഒരേ ആത്മാവിൽ[b] ഉറച്ചുനിൽക്കുകയും ഒരേ മനസ്സോടെ[c] സുവിശേഷത്തിന്റെ വിശ്വാസത്തിനായി[d] ഒരുമിച്ചു പോരാടുകയും ചെയ്യുന്നു എന്നു നിങ്ങളെക്കുറിച്ച് എനിക്കു കേൾക്കാൻ ഇടയാകട്ടെ.'
  to: 'ഒരേ ഒരു കാര്യം: മശീഹയുടെ സുവിശേഷത്തിന് യോജിച്ചവിധം ജീവിക്കുവിൻ[a]. അങ്ങനെ, ഞാൻ വന്ന് നിങ്ങളെ കണ്ടാലും അകന്നിരുന്നാലും, നിങ്ങൾ ഒരേ ആത്മാവിൽ[b] ഉറച്ചുനിൽക്കുകയും ഒരേ മനസ്സോടെ[c] സുവിശേഷത്തിന്റെ വിശ്വാസത്തിനായി[d] ഒരുമിച്ചു പോരാടുകയും ചെയ്യുന്നു എന്നു നിങ്ങളെക്കുറിച്ച് എനിക്കു കേൾക്കാൻ കഴിയേണ്ടതിന്.'
  rationale: ബഹുവചന ആജ്ഞാരൂപം വ്യക്തമായി പ്രകടിപ്പിക്കാൻ ‘ജീവിക്കുക’ എന്നത് ‘ജീവിക്കുവിൻ’ എന്നു മാറ്റി. ἵνα-ഉദ്ദേശ്യബന്ധം നിലനിർത്താൻ ‘കേൾക്കാൻ ഇടയാകട്ടെ’ എന്ന ആശംസാരൂപം ‘എനിക്കു കേൾക്കാൻ കഴിയേണ്ടതിന്’ എന്നു മാറ്റി. ψυχή-യുടെ അടിക്കുറിപ്പിൽ πνεῦμαയിൽനിന്നു വേറിട്ട അക്ഷരാർഥം വ്യക്തമാക്കി. മറ്റ് വിവർത്തനതിരഞ്ഞെടുപ്പുകൾ ഗ്രീക്കിലെ അവ്യക്തതയും ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യമായ ശൈലിയും സംരക്ഷിക്കുന്നു.
