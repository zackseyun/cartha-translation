id: PHP.1.27
reference: Philippians 1:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Μόνον ἀξίως τοῦ εὐαγγελίου τοῦ Χριστοῦ πολιτεύεσθε, ἵνα εἴτε ἐλθὼν καὶ ἰδὼν ὑμᾶς εἴτε ἀπὼν ⸀ἀκούω τὰ περὶ ὑμῶν, ὅτι στήκετε ἐν ἑνὶ πνεύματι, μιᾷ ψυχῇ συναθλοῦντες τῇ πίστει τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/027.yaml
  text: Only conduct yourselves in a manner worthy of the gospel of Messiah[a], so that whether I come and see you or am absent, I may hear about you that you are standing firm in one spirit, with one soul striving together for the faith of the gospel[e][d][c][b],
translation:
  language: ml
  text: 'ഒരേ ഒരു കാര്യം: മശീഹയുടെ സുവിശേഷത്തിന് യോജിച്ചവിധം ജീവിക്കുവിൻ[a]. അങ്ങനെ, ഞാൻ വന്ന് നിങ്ങളെ കണ്ടാലും അകന്നിരുന്നാലും, നിങ്ങൾ ഒരേ ആത്മാവിൽ[b] ഉറച്ചുനിൽക്കുകയും ഒരേ മനസ്സോടെ[c] സുവിശേഷത്തിന്റെ വിശ്വാസത്തിനായി[d] ഒരുമിച്ചു പോരാടുകയും ചെയ്യുന്നു എന്നു നിങ്ങളെക്കുറിച്ച് എനിക്കു കേൾക്കാൻ കഴിയേണ്ടതിന്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിങ്ങളുടെ ജീവിതം നയിക്കുക’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘പൗരന്മാരായി ജീവിക്കുക’ എന്ന പൗരത്വസൂചനയുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: ‘ഒരേ പരിശുദ്ധാത്മാവിൽ’ എന്നും അർഥമാകാം.
    reason: alternative_reading
  - marker: c
    text: അക്ഷരാർഥത്തിൽ ‘ഒരേ പ്രാണനോടെ’ അല്ലെങ്കിൽ ‘ഒരേ ജീവനോടെ’.
    reason: lexical_alternative
  - marker: d
    text: ‘സുവിശേഷത്തിലുള്ള വിശ്വാസത്തിനായി’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
lexical_decisions:
- source_word: Μόνον
  choice: ഒരേയൊരു കാര്യം
  rationale: വാക്യത്തിന്റെ തുടക്കത്തിലെ ഊന്നൽ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; തുടർന്ന് വരുന്ന ഏക മുഖ്യ ആഹ്വാനത്തിലേക്ക് ശ്രദ്ധ കേന്ദ്രീകരിക്കുന്നു.
- source_word: ἀξίως
  choice: യോഗ്യമായവിധം
  rationale: ജീവിക്കുന്ന രീതിയെ വിശേഷിപ്പിക്കുന്ന ക്രിയാവിശേഷണത്തിന്റെ ധാർമ്മികബലം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: πολιτεύεσθε
  choice: ജീവിക്കുക
  rationale: ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വിശാലവുമായ പ്രയോഗം; ഗ്രീക്കിലെ പൗരത്വസൂചന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: εὐαγγελίου
  choice: സുവിശേഷം
  rationale: മലയാള ക്രൈസ്തവ ഉപയോഗത്തിൽ വ്യക്തവും സ്ഥാപിതവുമായ പദം.
- source_word: Χριστοῦ
  choice: മശീഹയുടെ
  rationale: Χριστός ഇവിടെ സ്ഥാനപ്പേരായി വരുന്നതിനാൽ ‘മശീഹ’ എന്ന് പരിഭാഷപ്പെടുത്തി.
- source_word: ἀκούω τὰ περὶ ὑμῶν
  choice: നിങ്ങളെക്കുറിച്ച് എനിക്കു കേൾക്കാൻ ഇടയാകട്ടെ
  rationale: ഗ്രീക്ക് ശൈലിയുടെ അർഥം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളം.
- source_word: στήκετε
  choice: ഉറച്ചുനിൽക്കുന്നു
  rationale: സ്ഥിരതയുടെയും വഴങ്ങാതിരിക്കുന്നതിന്റെയും ആശയം സംരക്ഷിക്കുന്നു.
- source_word: ἐν ἑνὶ πνεύματι
  choice: ഒരേ ആത്മാവിൽ
  rationale: സമൂഹത്തിന്റെ ഏകമനോഭാവത്തെയും പരിശുദ്ധാത്മാവിനോടുള്ള സാധ്യതയുള്ള സൂചനയെയും ഒരുപോലെ തുറന്നുവെക്കുന്നു.
- source_word: μιᾷ ψυχῇ
  choice: ഒരേ മനസ്സോടെ
  rationale: ഐക്യപ്പെട്ട ആഗ്രഹവും ഉദ്ദേശ്യവും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: συναθλοῦντες
  choice: ഒരുമിച്ചു പോരാടുന്നു
  rationale: കൂട്ടായ പരിശ്രമത്തിന്റെയും മത്സരത്തിന്റെയും ഗ്രീക്ക് ദൃശ്യബിംബം വായനാസൗകര്യത്തോടെ നിലനിർത്തുന്നു.
- source_word: τῇ πίστει τοῦ εὐαγγελίου
  choice: സുവിശേഷത്തിന്റെ വിശ്വാസത്തിനായി
  rationale: ഗ്രീക്കിലെ സമ്പർക്കവിഭക്തിബന്ധം നിർബന്ധമായി വ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്നു; മറ്റൊരു സാധ്യമായ ബന്ധം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: πνεύματι പരിശുദ്ധാത്മാവിനെയോ വിശ്വാസികളുടെ പങ്കിട്ട ആത്മാവിനെയോ മനോഭാവത്തെയോ സൂചിപ്പിക്കുന്നുണ്ടോ
  choice: ഒരേ ആത്മാവിൽ
  alternative: ഏക പരിശുദ്ധാത്മാവിൽ
  rationale: തുടർന്നുള്ള ‘ഒരേ മനസ്സോടെ’ എന്ന സമാന്തരപ്രയോഗം സമൂഹത്തിന്റെ ഐക്യത്തെ സൂചിപ്പിക്കാം; എന്നാൽ പരിശുദ്ധാത്മാവിനെക്കുറിച്ചുള്ള വായനയും സാധ്യമായതിനാൽ അവ്യക്തത നിലനിർത്തി.
- issue: τῇ πίστει τοῦ εὐαγγελίου എന്നതിലെ സമ്പർക്കവിഭക്തിയുടെ ബന്ധം
  choice: സുവിശേഷത്തിന്റെ വിശ്വാസത്തിനായി
  alternative: സുവിശേഷത്തിലുള്ള വിശ്വാസത്തിനായി
  rationale: ഇത് സുവിശേഷവുമായി ബന്ധപ്പെട്ട വിശ്വാസസത്യത്തെയോ സുവിശേഷത്തിലുള്ള വിശ്വാസത്തെയോ സൂചിപ്പിക്കാം; പ്രധാനപാഠം ബന്ധം തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. നീണ്ട ഗ്രീക്ക് വാക്യത്തിന്റെ ബന്ധങ്ങൾ നിലനിർത്തിക്കൊണ്ട് വായനാസൗകര്യത്തിനായി ആദ്യ ആഹ്വാനത്തിനു ശേഷം വാക്യം വിഭജിച്ചു; പൗരത്വസൂചനയും വ്യാഖ്യാനസാധ്യതകളും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
