id: PHP.1.18
reference: Philippians 1:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τί γάρ; πλὴν ⸀ὅτι παντὶ τρόπῳ, εἴτε προφάσει εἴτε ἀληθείᾳ, Χριστὸς καταγγέλλεται, καὶ ἐν τούτῳ χαίρω· ἀλλὰ καὶ χαρήσομαι,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/018.yaml
  text: What then? Only that in every way[a], whether in pretense or in truth, Messiah is being proclaimed, and in this I rejoice. Yes[b], and I will rejoice.
translation:
  language: ml
  text: 'അപ്പോൾ എന്ത്? ഇതുമാത്രം: ഏതുവിധത്തിലായാലും—വ്യാജഭാവത്തോടെയായാലും സത്യസന്ധതയോടെയായാലും[a]—മശീഹാ പ്രഖ്യാപിക്കപ്പെടുന്നു[b]. അതിൽ ഞാൻ സന്തോഷിക്കുന്നു. അതെ, ഇനിയും സന്തോഷിക്കും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “ഒരു മറയായിട്ടായാലും ആത്മാർഥതയോടെയായാലും.”'
    reason: lexical_alternative
  - marker: b
    text: 'അല്ലെങ്കിൽ: “ക്രിസ്തു പ്രഖ്യാപിക്കപ്പെടുന്നു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γάρ
  choice: അപ്പോൾ എന്ത്?
  rationale: പൗലോസിന്റെ ഹ്രസ്വമായ ആലങ്കാരിക ചോദ്യവും മുൻവിവരണത്തിൽനിന്നുള്ള നിഗമനത്തിലേക്കുള്ള തിരിവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: πλὴν ὅτι
  choice: 'ഇതുമാത്രം:'
  rationale: മറ്റെല്ലാം മാറ്റിവെച്ച് തുടർന്ന് പറയുന്ന മുഖ്യകാര്യത്തിലേക്ക് ശ്രദ്ധ ചുരുക്കുന്ന പ്രയോഗത്തിന്റെ ബലം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: παντὶ τρόπῳ
  choice: ഏതുവിധത്തിലായാലും
  rationale: പ്രഖ്യാപനത്തിന്റെ വ്യത്യസ്ത സാഹചര്യങ്ങളെയെല്ലാം ഉൾക്കൊള്ളുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ വിതരണാർഥം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: προφάσει
  choice: കപടമായിട്ട്
  rationale: വെറും പുറംനാട്യമോ മറയാക്കിയ ഉദ്ദേശ്യമോ സൂചിപ്പിക്കുന്ന പദത്തെ, നിർദിഷ്ടമായ ഒരു ദുഷ്ടലക്ഷ്യം കൂട്ടിച്ചേർക്കാതെ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധത്തിൽ നൽകുന്നു.
- source_word: ἀληθείᾳ
  choice: സത്യസന്ധമായിട്ട്
  rationale: προφάσει എന്നതുമായുള്ള ഉദ്ദേശ്യസംബന്ധമായ വൈരുധ്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: Χριστὸς
  choice: മശീഹാ
  rationale: ഇവിടെ പൊതുപ്രഖ്യാപനത്തിന്റെ ഉള്ളടക്കമായി വരുന്ന അഭിഷിക്തൻ എന്ന പദവിയർഥം നിലനിർത്തുന്നു; വ്യക്തിനാമംപോലെ മാത്രം വായിക്കപ്പെടുന്നത് ഒഴിവാക്കുന്നു.
- source_word: καταγγέλλεται
  choice: പ്രഖ്യാപിക്കപ്പെടുന്നു
  rationale: പൊതുവായി അറിയിക്കൽ എന്ന അർഥവും ഗ്രീക്കിലെ കർമണിപ്രയോഗവും വർത്തമാനകാലത്തിന്റെ തുടരുന്ന ഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: ἐν τούτῳ
  choice: അതിൽ
  rationale: പൗലോസിന്റെ സന്തോഷത്തെ മശീഹാ പ്രഖ്യാപിക്കപ്പെടുന്നു എന്ന തൊട്ടുമുൻപുള്ള വസ്തുതയോട് നേരിട്ട് ബന്ധിപ്പിക്കുന്നു.
- source_word: χαίρω
  choice: ഞാൻ സന്തോഷിക്കുന്നു
  rationale: നിലവിലെ ആനന്ദത്തെ ലളിതവും ഗൗരവമുള്ളതുമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἀλλὰ καὶ χαρήσομαι
  choice: അതെ, ഇനിയും സന്തോഷിക്കും
  rationale: ἀλλά καί എന്ന ഉറപ്പുനൽകുന്ന ചേർക്കലും ഭാവികാലത്തേക്കുള്ള സന്തോഷവും മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: Χριστός എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: ഈ സന്ദർഭത്തിൽ Χριστός പ്രഖ്യാപിക്കപ്പെടുന്ന പദവിയായതിനാൽ ‘അഭിഷിക്തൻ’ എന്ന അതിന്റെ പദവിയർഥം ‘മശീഹാ’ കൂടുതൽ വ്യക്തമായി നിലനിർത്തുന്നു; പരിചിതമായ മറ്റൊരു രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹ്രസ്വമായ ആലങ്കാരിക ചോദ്യം, ഉദ്ദേശ്യങ്ങളിലെ വൈരുധ്യം, കർമണിപ്രയോഗം, ഇപ്പോഴത്തെയും ഭാവിയിലെയും സന്തോഷം എന്നിവ സംരക്ഷിച്ചിരിക്കുന്നു. വായനാസൗകര്യത്തിനായി പ്രധാന പ്രസ്താവനയ്ക്ക് ശേഷം പൂർണവിരാമം നൽകിയെങ്കിലും ആശയബന്ധം മാറ്റിയിട്ടില്ല.
