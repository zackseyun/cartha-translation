  rationale: ഉറവിടപാഠത്തിൽ ഇല്ലാത്ത ‘എഴുതുന്നത്’യും അതുമായി ബന്ധപ്പെട്ട അടിക്കുറിപ്പ് a-യും നീക്കി. സ്വീകരിക്കുന്നവരുടെ വിവരണം സ്വാഭാവിക മലയാളക്രമത്തിലാക്കി; എല്ലാ ഉറവിടഘടകങ്ങളും അവയുടെ അനിശ്ചിതത്വമില്ലാതെ നിലനിർത്തി. പേരിന്റെ ലിപ്യന്തരണം ‘തിമൊഥെയൊസ്’ ആയി ക്രമീകരിച്ചു. അടിമകൾക്കായുള്ള അടിക്കുറിപ്പ് b മുഖ്യപാഠത്തിൽ യഥാസ്ഥാനത്ത് ഇല്ലാതിരുന്നതിനാൽ, അത് ഇപ്പോൾ ഉപയോഗിക്കാത്ത മാർക്കറായതിനാൽ ഒഴിവാക്കുന്നതിനെക്കാൾ മുഖ്യപാഠത്തിലെ ‘അടിമകളായ’ എന്നതിനു പിന്നാലെ സ്ഥാപിക്കേണ്ടതായിരുന്നു; അതനുസരിച്ചുള്ള പൂർണ പാഠം താഴെ സൂചിപ്പിച്ച തിരുത്തലിൽ ഉൾക്കൊള്ളേണ്ടതാണ്.
