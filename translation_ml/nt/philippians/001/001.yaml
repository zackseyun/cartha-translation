id: PHP.1.1
reference: Philippians 1:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Παῦλος καὶ Τιμόθεος δοῦλοι ⸂Χριστοῦ Ἰησοῦ⸃ πᾶσιν τοῖς ἁγίοις ἐν Χριστῷ Ἰησοῦ τοῖς οὖσιν ἐν Φιλίπποις σὺν ἐπισκόποις καὶ διακόνοις·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/001.yaml
  text: 'Paul and Timothy[a], servants of Messiah Jesus, to all the saints in Messiah Jesus who are in Philippi[c][b], together with the overseers and deacons:'
translation:
  language: ml
  text: 'മശീഹയായ യേശുവിന്റെ അടിമകളായ പൗലോസും തിമൊഥെയൊസും, ഫിലിപ്പിയിലുള്ള മശീഹയായ യേശുവിലെ എല്ലാ വിശുദ്ധർക്കും, മേൽനോട്ടക്കാരോടും[c] ശുശ്രൂഷകരോടുംകൂടെ:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: അഥവാ ‘മേൽവിചാരകർ’; പിൽക്കാല സഭാപദവിയുടെ പേരായി ‘ബിഷപ്പുമാർ’ എന്നും പരിഭാഷപ്പെടുത്താറുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: അടിമകൾ
  rationale: ഉടമസ്ഥതയ്ക്കും ബന്ധിതനിലയ്ക്കും ഊന്നൽ നൽകുന്ന ഗ്രീക്ക് പദത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; ‘ദാസന്മാർ’ എന്ന പരമ്പരാഗത പദത്തേക്കാൾ ഉറവിടാർത്ഥം നേരിട്ട് പ്രകടമാക്കുന്നു.
- source_word: Χριστοῦ Ἰησοῦ / Χριστῷ Ἰησοῦ
  choice: മശീഹയായ യേശു / മശീഹയായ യേശുവിൽ
  rationale: Χριστός ആദിയിൽ വ്യക്തിനാമമല്ല, അഭിഷിക്തനായ രാജാവിനെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരാണ്; ‘മശീഹാ’ അതിന്റെ സ്ഥാനപ്പേരായ സ്വഭാവം നിലനിർത്തുന്നു.
- source_word: ἁγίοις
  choice: വിശുദ്ധർ
  rationale: പൗലോസിന്റെ അഭിസംബോധനയിൽ വിശ്വാസികളുടെ ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ട കൂട്ടായ തിരിച്ചറിയൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി അറിയിക്കുന്നു.
- source_word: ἐν
  choice: ഉള്ള / -യിൽ
  rationale: ഫിലിപ്പിയോടൊപ്പം സ്ഥലബന്ധവും മശീഹയോടൊപ്പം ഐക്യബന്ധവും സന്ദർഭാനുസൃതമായ മലയാളരൂപങ്ങളിൽ നിലനിർത്തുന്നു.
- source_word: τοῖς οὖσιν ἐν Φιλίπποις
  choice: ഫിലിപ്പിയിൽ ഉള്ളവർ
  rationale: ഗ്രീക്ക് കൃതന്തപ്രയോഗത്തെ സ്വാഭാവികമായ മലയാള വിശേഷണഘടനയാക്കുന്നു; സ്ഥലം വ്യക്തമായി നിലനിൽക്കുന്നു.
- source_word: σὺν
  choice: -ഓടുംകൂടെ
  rationale: വെറും സഹവർത്തിത്വത്തേക്കാൾ കൂട്ടിച്ചേർക്കലിന്റെയും പങ്കാളിത്തത്തിന്റെയും ഭാവം വ്യക്തമാക്കുന്നു.
- source_word: ἐπισκόποις
  choice: മേൽനോട്ടക്കാർ
  rationale: പദത്തിന്റെ അടിസ്ഥാനപ്രവർത്തനം സുതാര്യമായി പരിഭാഷപ്പെടുത്തുകയും പിൽക്കാല സഭാഭരണരൂപങ്ങൾ അനാവശ്യമായി പാഠത്തിൽ ചുമത്താതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: διακόνοις
  choice: ശുശ്രൂഷകർ
  rationale: ἐπισκόποις എന്ന പദത്തോടു ചേർന്നതിനാൽ അംഗീകൃത ശുശ്രൂഷാഭൂമിക സൂചിപ്പിക്കാം; അതേസമയം മലയാളത്തിൽ സ്വാഭാവികവും അർത്ഥസുതാര്യവുമാണ്.
- source_word: πᾶσιν τοῖς ἁγίοις
  choice: വിശുദ്ധരായ എല്ലാവർക്കും
  rationale: ‘എല്ലാവർക്കും’ എന്ന സമഗ്രതയും ‘വിശുദ്ധർ’ എന്ന കൂട്ടായ തിരിച്ചറിയലും ചേർത്ത് അഭിസംബോധനയുടെ ഘടന നിലനിർത്തുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ അഭിസംബോധനയിൽ Χριστός എങ്ങനെ നൽകണം
  choice: മശീഹയായ യേശു
  alternative: ക്രിസ്തുയേശു
  rationale: പേരുപോലെ മാത്രം വായിക്കപ്പെടാനുള്ള സാധ്യത ഒഴിവാക്കി, അഭിഷിക്തനായ രാജാവെന്ന സ്ഥാനപ്പേരിന്റെ അർത്ഥം പ്രകടമാക്കുന്നു; പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ഫിലിപ്പിയർ 1:1-ൽ δοῦλοι എങ്ങനെ നൽകണം
  choice: അടിമകൾ
  alternative: ദാസന്മാർ / സേവകർ
  rationale: ഗ്രീക്ക് പദത്തിലുള്ള ഉടമസ്ഥതയുടെയും ബന്ധിതനിലയുടെയും അസൗകര്യകരമായ ശക്തി മൃദൂകരിക്കാതെ നിലനിർത്തുന്നു; സ്വമേധയായുള്ള സേവനം മാത്രം സൂചിപ്പിക്കുന്ന ‘സേവകർ’ എന്നതിനെ മുഖ്യപാഠത്തിൽ ഒഴിവാക്കുന്നു.
- issue: ἐπισκόποις, διακόνοις എന്നീ സഭാഭൂമികകൾ
  choice: മേൽനോട്ടക്കാർ, ശുശ്രൂഷകർ
  alternative: ബിഷപ്പുമാർ, ഡീക്കന്മാർ
  rationale: ഈ ആദ്യകാല സന്ദർഭത്തിലെ പദങ്ങളുടെ പ്രവർത്തനപരമായ അർത്ഥം നൽകുന്നു; പിൽക്കാല സഭാപദവികളുടെ പൂർണ രൂപം പാഠത്തിലേക്ക് മുൻകൂട്ടി ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കത്താരംഭശൈലി സ്വീകരിച്ചു. ഗ്രീക്കിലെ ദീർഘമായ അഭിസംബോധന മലയാളത്തിൽ വായനാസൗകര്യത്തോടെ പുനഃക്രമീകരിച്ചെങ്കിലും പൗലോസും തിമൊഥെയോസും അയച്ചവർ എന്നും ഫിലിപ്പിയിലെ വിശുദ്ധർ സ്വീകരിക്കുന്നവർ എന്നും വ്യക്തമായി നിലനിർത്തി. ‘മശീഹയായ യേശു’ സ്ഥാനപ്പേരിന്റെ അർത്ഥം തുറന്നുകാട്ടുന്നു; ‘അടിമകൾ’ ഉറവിടപദത്തിന്റെ കടുപ്പം മൃദൂകരിക്കുന്നില്ല.
