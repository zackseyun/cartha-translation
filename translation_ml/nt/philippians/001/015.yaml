source:
  edition: SBLGNT
  text: Τινὲς μὲν καὶ διὰ φθόνον καὶ ἔριν, τινὲς δὲ καὶ δι’ εὐδοκίαν τὸν Χριστὸν κηρύσσουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/015.yaml
  text: Some indeed proclaim the Messiah because of envy and rivalry[a], but others because of goodwill.
translation:
  language: ml
  text: ചിലർ അസൂയയും മത്സരബുദ്ധിയും നിമിത്തം മശീഹായെ[a] പ്രഖ്യാപിക്കുന്നു; മറ്റുചിലരാകട്ടെ നല്ല മനസ്സോടെ മശീഹായെ പ്രഖ്യാപിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ക്രിസ്തുവിനെ.’ ഗ്രീക്ക് പദവി Χριστός (ക്രിസ്റ്റോസ്) എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τινὲς μὲν … τινὲς δὲ
  choice: ചിലർ … മറ്റുചിലരാകട്ടെ
  rationale: രണ്ടു വ്യത്യസ്ത കൂട്ടങ്ങളെ സൂചിപ്പിക്കുന്ന അനിശ്ചിത സർവനാമങ്ങളുടെയും μέν … δέ വിരുദ്ധഘടനയുടെയും അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: διὰ φθόνον
  choice: അസൂയ … നിമിത്തം
  rationale: διά + accusative ഇവിടെ പ്രേരണയുടെ കാരണം സൂചിപ്പിക്കുന്നു; ‘നിമിത്തം’ ആ കാരണബന്ധം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἔριν
  choice: മത്സരബുദ്ധി
  rationale: ഇവിടെ മറ്റുള്ളവരോടുള്ള മത്സരപരവും കലഹജനകവുമായ മനോഭാവമാണ് ഉദ്ദേശിക്കുന്നത്; ‘മത്സരബുദ്ധി’ ആ സന്ദർഭാർഥം സാധാരണ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: δι’ εὐδοκίαν
  choice: സദുദ്ദേശ്യത്തോടെ
  rationale: അസൂയയ്ക്കും മത്സരബുദ്ധിക്കും വിരുദ്ധമായ നല്ല മനോഭാവമോ ഉദ്ദേശ്യമോ ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നു; ‘സദുദ്ദേശ്യത്തോടെ’ പ്രേരണയെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: τὸν Χριστόν
  choice: മശീഹാ
  rationale: Χριστός ഇവിടെ പദവിനാമമായി പ്രവർത്തിക്കുന്നു. ‘മശീഹാ’ അതിന്റെ അഭിഷിക്തൻ എന്ന പദവിയർഥം നിലനിർത്തുന്നു; മലയാളത്തിലെ സാധാരണ വ്യാകരണപ്രയോഗത്തിനനുസരിച്ച് കർമരൂപത്തിൽ ‘മശീഹായെ’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: κηρύσσουσιν
  choice: പ്രസംഗിക്കുന്നു
  rationale: κηρύσσωയുടെ പരസ്യമായി അറിയിക്കുക/പ്രഖ്യാപിക്കുക എന്ന ആശയം ഇവിടെ സുവിശേഷപ്രസംഗത്തിന്റെ സന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; രണ്ടാം ഖണ്ഡത്തിൽ മലയാളത്തിന്റെ വ്യക്തതയ്ക്കായി ക്രിയ ആവർത്തിച്ചിരിക്കുന്നു.
theological_decisions:
- issue: Χριστός എന്ന പദം പദവിനാമമായോ വ്യക്തിനാമസദൃശമായോ വിവർത്തനം ചെയ്യുക
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: ഗ്രീക്കിൽ നിർദ്ദേശകവചനം ചേർന്ന τὸν Χριστόν ഇവിടെ പദവിനാമസ്വഭാവം ശക്തമാക്കുന്നു. എങ്കിലും ‘ക്രിസ്തു’ സാധുവായ പരമ്പരാഗത പകരമായതിനാൽ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മൂലത്തിലെ കാരണം–വിരുദ്ധതാ ഘടന നിലനിർത്തിയിട്ടുണ്ട്; ഗ്രീക്കിലെ ഇരട്ട καί മലയാളത്തിൽ കൃത്രിമമാകാതിരിക്കാൻ പ്രത്യേകം ആവർത്തിച്ചിട്ടില്ല.
