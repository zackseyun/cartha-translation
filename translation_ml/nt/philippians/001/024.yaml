id: PHP.1.24
reference: Philippians 1:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τὸ δὲ ἐπιμένειν ⸀ἐν τῇ σαρκὶ ἀναγκαιότερον δι’ ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/024.yaml
  text: But to remain in the flesh is more necessary for your sake[a].
translation:
  language: ml
  text: എന്നാൽ ശരീരത്തിൽ തുടരുന്നത് നിങ്ങൾക്കുവേണ്ടി കൂടുതൽ ആവശ്യമാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ശരീരത്തിൽ ജീവിച്ചു തുടരുക.’
    reason: ‘ἐν τῇ σαρκὶ’ എന്ന പ്രയോഗം ഇവിടെ ശരീരത്തോടുകൂടിയ ഭൗമികജീവിതത്തെയും, ‘ἐπιμένειν’ അതിൽ തുടർന്നുനിൽക്കുന്നതിനെയും സൂചിപ്പിക്കുന്നു.
lexical_decisions:
- source_word: τὸ ἐπιμένειν
  choice: തുടരുന്നത്
  rationale: നാമസ്വഭാവത്തിൽ ഉപയോഗിച്ചിരിക്കുന്ന ഈ ക്രിയാരൂപം പൗലോസിന്റെ ഇപ്പോഴത്തെ ഭൗമികജീവിതം തുടരുക എന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: ക്രിസ്തുവിനോടുകൂടെ ഇരിക്കാനായി വിട്ടുപോകുന്നതിനെക്കുറിച്ചുള്ള മുൻചിന്തയോട് ഇവിടെ വ്യക്തമായ വൈരുധ്യം സൂചിപ്പിക്കുന്നു.
- source_word: ἐν τῇ σαρκὶ
  choice: ജഡത്തിൽ
  rationale: ഇവിടെ σάρξ പാപസ്വഭാവത്തെ അല്ല, ശരീരത്തോടുകൂടിയ ഭൗമിക അസ്തിത്വത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അതേസമയം മൂലപദത്തിന്റെ രൂപവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
- source_word: ἀναγκαιότερον
  choice: കൂടുതൽ ആവശ്യമാണ്
  rationale: ഗ്രീക്കിലെ താരതമ്യഭാവം വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: δι’ ὑμᾶς
  choice: നിങ്ങൾക്കുവേണ്ടി
  rationale: ഫിലിപ്പിയർക്കു പ്രയോജനകരമായ ഉദ്ദേശ്യം എന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഈ വാക്യത്തിലെ σάρξ എന്നതിന്റെ അർഥം
  choice: ശരീരത്തോടുകൂടിയ ഭൗമികജീവിതം എന്ന അർഥത്തിൽ ‘ജഡത്തിൽ’
  alternative: ‘പാപസ്വഭാവത്തിൽ’ എന്ന ധാർമിക അർഥം; അല്ലെങ്കിൽ ‘ഈ ലോകത്തിൽ ജീവനോടെ’ എന്ന വിപുലീകരിച്ച പരാവർത്തനം
  rationale: സന്ദർഭത്തിൽ പൗലോസ് ക്രിസ്തുവിനോടുകൂടെ ഇരിക്കാനായി വിട്ടുപോകുന്നതും ഫിലിപ്പിയർക്കുവേണ്ടി ഇപ്പോഴത്തെ ശരീരജീവിതത്തിൽ തുടരുന്നതും തമ്മിലാണ് താരതമ്യം ചെയ്യുന്നത്. ധാർമികമായ ‘പാപസ്വഭാവം’ എന്ന അർഥം ഇവിടെ സന്ദർഭം പിന്തുണയ്ക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ജഡത്തിൽ’ എന്ന പരമ്പരാഗതവും മൂലപദസന്നിഹിതവുമായ പ്രയോഗം മുഖ്യവാചകത്തിൽ നിലനിർത്തി, സാധാരണ വായനക്കാർക്കുള്ള വ്യക്തതയ്ക്കായി അടിക്കുറിപ്പിൽ ‘ശരീരത്തിൽ ജീവിച്ചുകൊണ്ടിരിക്കുക’ നൽകി.
