revisions:
- from: എന്നാൽ ജഡത്തിൽ തുടരുന്നത് നിങ്ങൾക്കുവേണ്ടി കൂടുതൽ ആവശ്യമാണ്.[a]
  to: എന്നാൽ ശരീരത്തിൽ തുടരുന്നത് നിങ്ങൾക്കുവേണ്ടി കൂടുതൽ ആവശ്യമാണ്.[a]
  rationale: The revision retains the Greek contrast, comparison, and beneficiary sense while using modern standard Malayalam that clearly conveys literal embodied existence. The footnote preserves the alternative explanatory phrasing and the continuative aspect of the Greek infinitive.
  reviewer_model: gpt-5.6-terra
