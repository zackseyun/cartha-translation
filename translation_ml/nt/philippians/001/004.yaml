translation:
  language: ml
  text: നിങ്ങളെ എല്ലാവരെയും കുറിച്ചുള്ള എന്റെ ഓരോ അപേക്ഷാപ്രാർഥനയിലും എപ്പോഴും സന്തോഷത്തോടെ പ്രാർഥിച്ചുകൊണ്ട്,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντοτε
  choice: എപ്പോഴും
  rationale: കാലപരമായ ആവർത്തനവും സ്ഥിരതയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐν πάσῃ δεήσει μου
  choice: എന്റെ ഓരോ പ്രാർഥനയിലും
  rationale: πάσῃ എന്നതിന്റെ സമഗ്രത ‘ഓരോ’ എന്നു വ്യക്തമാക്കുകയും δέησις എന്ന അപേക്ഷാപരമായ പ്രാർഥനയെ പൊതുവായി ഗ്രഹിക്കാവുന്ന ‘പ്രാർഥന’ എന്നു നൽകുകയും ചെയ്യുന്നു.
- source_word: ὑπὲρ πάντων ὑμῶν
  choice: നിങ്ങൾ എല്ലാവർക്കുംവേണ്ടിയുള്ള
  rationale: സഭയിലെ എല്ലാവരെയും ഉൾക്കൊള്ളുന്ന πάντων എന്ന ഊന്നൽ സംരക്ഷിക്കുന്നു.
- source_word: μετὰ χαρᾶς
  choice: സന്തോഷത്തോടെ
  rationale: പ്രാർഥനയുടെ ഭാവം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന് നേരിട്ടും സ്വാഭാവികവുമായ തുല്യം.
- source_word: τὴν δέησιν ποιούμενος
  choice: പ്രാർഥിച്ചുകൊണ്ട്
  rationale: അക്ഷരാർഥത്തിലെ ‘അപേക്ഷ നടത്തിക്കൊണ്ട്’ എന്നതിനു പകരം മലയാളത്തിൽ സ്വാഭാവികമായ ക്രിയാരൂപം ഉപയോഗിക്കുന്നു; വാക്യം അടുത്ത വാക്യഭാഗവുമായി തുടരുന്ന പങ്കുപദഘടനയും നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് സുലഭവുമായ മലയാളം. ഗ്രീക്കിലെ ആശ്രിത പങ്കുപദഘടനയും വാക്യം അടുത്ത ഭാഗത്തേക്ക് തുടരുന്നതും സൂചിപ്പിക്കാൻ അവസാനം കോമ നിലനിർത്തി.
