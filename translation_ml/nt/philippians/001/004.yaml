- from: നിങ്ങൾ എല്ലാവർക്കുംവേണ്ടിയുള്ള എന്റെ ഓരോ പ്രാർഥനയിലും എപ്പോഴും സന്തോഷത്തോടെ പ്രാർഥിച്ചുകൊണ്ട്,
  to: നിങ്ങളെ എല്ലാവരെയും കുറിച്ചുള്ള എന്റെ ഓരോ അപേക്ഷാപ്രാർഥനയിലും എപ്പോഴും സന്തോഷത്തോടെ പ്രാർഥിച്ചുകൊണ്ട്,
