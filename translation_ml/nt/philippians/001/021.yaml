id: PHP.1.21
reference: Philippians 1:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐμοὶ γὰρ τὸ ζῆν Χριστὸς καὶ τὸ ἀποθανεῖν κέρδος.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/021.yaml
  text: For to me[a], to live is Christ, and to die is gain.
translation:
  language: ml
  text: എന്തെന്നാൽ, എനിക്ക് ജീവിക്കുന്നത് ക്രിസ്തുവാണ്[a], മരിക്കുന്നത് നേട്ടവുമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മശീഹാ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμοὶ
  choice: എനിക്ക്
  rationale: ദത്തിവ് സർവനാമം പൗലോസിന്റെ വ്യക്തിപരമായ കാഴ്ചപ്പാട് സ്വാഭാവികവും സംക്ഷിപ്തവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻചിന്തയ്ക്ക് വിശദീകരണം നൽകുന്ന ബന്ധകത്തിന്റെ വാദക്രമം നിലനിർത്തുന്നു.
- source_word: τὸ ζῆν
  choice: ജീവിക്കുക
  rationale: നാമപ്രവർത്തിയായ ആർട്ടിക്കിൾ ചേർന്ന അനന്തക്രിയയെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും ‘മരിക്കുക’ എന്നതിനോടുള്ള സമാന്തരത നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: Χριστὸς
  choice: ക്രിസ്തു
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിൽ പേരുപോലെയും സ്ഥാനനാമമായും പ്രവർത്തിക്കാവുന്ന സംക്ഷിപ്ത രൂപം; സ്ഥാനനാമത്തിന്റെ അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: τὸ ἀποθανεῖν
  choice: മരിക്കുക
  rationale: ആർട്ടിക്കിൾ ചേർന്ന അനന്തക്രിയയെ വ്യക്തമായി പരിഭാഷപ്പെടുത്തി ‘ജീവിക്കുക’ എന്നതിനോടുള്ള തുലിതാളം സംരക്ഷിക്കുന്നു.
- source_word: κέρδος
  choice: നേട്ടം
  rationale: ലാഭം അല്ലെങ്കിൽ പ്രയോജനം എന്ന ആശയം അതിവാണിജ്യധ്വനിയില്ലാതെ സ്വാഭാവികവും മാന്യവുമായി നൽകുന്നു.
theological_decisions:
- issue: Χριστός എന്ന പദം പേരായോ സ്ഥാനനാമമായോ വായിക്കാവുന്നത്
  choice: പ്രധാനവാചകത്തിൽ ‘ക്രിസ്തു’
  alternative: ‘മശീഹാ’
  rationale: പൗലോസിന്റെ ഈ സാന്ദ്രമായ പ്രസ്താവനയിൽ ‘ക്രിസ്തു’ സ്വാഭാവികമാണ്; എന്നാൽ സ്ഥാനനാമപരമായ അർത്ഥം അടിക്കുറിപ്പിലൂടെ തുറന്നുവയ്ക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ഗ്രീക്കിലെ അതിസംക്ഷിപ്തമായ സമാന്തരഘടന കഴിയുന്നത്ര നിലനിർത്തിയിട്ടുണ്ട്.
