source:
  edition: SBLGNT
  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b][c].
translation:
  language: ml
  text: നമ്മുടെ പിതാവായ ദൈവത്തിൽനിന്നും കർത്താവായ യേശുക്രിസ്തുവിൽനിന്നും നിങ്ങൾക്കു കൃപയും സമാധാനവും ഉണ്ടാകട്ടെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യേശുക്രിസ്തു’ എന്നതിന് ‘മശീഹയായ യേശു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: കൃപ
  rationale: പൗലോസിന്റെ അഭിവാദനത്തിൽ χάρις വഹിക്കുന്ന ബന്ധപരവും ദൈവശാസ്ത്രപരവുമായ അർഥഭാരം നിലനിർത്തുന്ന സ്വാഭാവികവും സുപരിചിതവുമായ മലയാളപദമാണ് ‘കൃപ’.
- source_word: ὑμῖν
  choice: നിങ്ങൾക്കു
  rationale: ലേഖനാശംസയിലെ ദാതൃവിഭക്തിയെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: εἰρήνη
  choice: സമാധാനം
  rationale: ഗ്രീക്ക്-യഹൂദ അഭിവാദനപാരമ്പര്യങ്ങളിലെ സമഗ്രക്ഷേമത്തിന്റെ അനുരണനം നിലനിർത്തുന്ന സാധാരണ മലയാളതുല്യപദമാണ്.
- source_word: ἀπό
  choice: —യിൽനിന്നും
  rationale: കൃപയുടെയും സമാധാനത്തിന്റെയും ഉറവിടം സൂചിപ്പിക്കുന്ന ἀπό എന്ന പദത്തിന്റെ അർഥം രണ്ടു സംയുക്ത നാമപദങ്ങളോടും വ്യക്തമായി ചേർത്തു.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: നമ്മുടെ പിതാവായ ദൈവം
  rationale: πατρός എന്നത് θεοῦ-നെ വിശദീകരിക്കുന്ന സമാനാധികരണമായി എടുത്ത്, മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിച്ചു.
- source_word: κυρίου
  choice: കർത്താവ്
  rationale: പുതിയനിയമത്തിലെ സ്ഥാപിതമായ ക്രിസ്തുശാസ്ത്രപരമായ ഭാരം സംരക്ഷിക്കുന്ന മലയാളപ്രയോഗമാണ്; ‘യജമാനൻ’ എന്നതിനെക്കാൾ ഈ സന്ദർഭത്തിൽ യോജിച്ചത്.
- source_word: Ἰησοῦ Χριστοῦ
  choice: യേശുക്രിസ്തു
  rationale: ഈ പൗലോസീയ അഭിവാദനസൂത്രത്തിൽ Χριστός ഒരു പേരിന്റെ ഘടകത്തെപ്പോലെ പ്രവർത്തിക്കാമെന്ന സാദ്ധ്യതയും മലയാളത്തിലെ സുപരിചിതമായ ഔപചാരിക പ്രയോഗവും കണക്കിലെടുത്തു; ‘മശീഹ’ എന്ന പദത്തിന്റെ ശീർഷകാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
theological_decisions:
- issue: പൗലോസീയ അഭിവാദനത്തിൽ Χριστοῦ എന്നതിന്റെ പരിഭാഷ
  choice: ക്രിസ്തു
  alternative: മശീഹ
  rationale: ഈ സൂത്രവാക്യത്തിൽ Χριστός ശീർഷകവും പേരിന്റെ ഘടകവും തമ്മിലുള്ള അർഥപരമായ മങ്ങൽ നിലനിർത്തുന്നു. മുഖ്യപാഠത്തിൽ മലയാളത്തിലെ സ്ഥാപിതരൂപമായ ‘ക്രിസ്തു’ സ്വീകരിച്ചു; മൂലപദത്തിന്റെ ‘അഭിഷിക്തൻ/മശീഹ’ എന്ന ശീർഷകാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- issue: ἀπό എന്ന ഏക നിർദ്ദേശകപദം രണ്ടു വ്യക്തികളോടും ബന്ധിപ്പിക്കൽ
  choice: ദൈവത്തിൽനിന്നും ... യേശുക്രിസ്തുവിൽനിന്നും
  alternative: ദൈവവും ... യേശുക്രിസ്തുവും നൽകുന്ന
  rationale: ഗ്രീക്കിൽ ഒരൊറ്റ ἀπό ഇരുവർക്കും ബാധകമാണെങ്കിലും, മലയാളത്തിൽ ഉറവിടബന്ധം വ്യക്തമായി കേൾക്കാൻ പ്രത്യയം ആവർത്തിച്ചു; കൃപയുടെയും സമാധാനത്തിന്റെയും സംയുക്ത ഉറവിടമായി പിതാവിനെയും കർത്താവായ യേശുവിനെയും വാക്യം അവതരിപ്പിക്കുന്ന രീതി മാറ്റിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ലേഖനാശംസാരൂപം ഉപയോഗിച്ചു. മൂലത്തിലെ നാമവാക്യസ്വഭാവം മലയാളത്തിൽ പൂർണമാകാൻ ‘ഉണ്ടാകട്ടെ’ ചേർത്തു; ഇത് ആശംസയുടെ അർഥം വ്യക്തമാക്കുന്നതാണ്, പുതിയ ആശയം ചേർക്കുന്നതല്ല.
