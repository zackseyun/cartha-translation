    rationale: ‘ഭയപ്പെടുത്തപ്പെടാതെ’ uses an unnecessarily heavy causative-passive construction, while ‘നിലകൊള്ളുക’ imports the preceding verse’s command to stand firm. The Greek here specifically continues with ‘not being frightened/intimidated,’ so a direct imperative continuation is preferable in a standalone Malayalam rendering.
