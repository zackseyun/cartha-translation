id: PHP.1.28
reference: Philippians 1:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ μὴ πτυρόμενοι ἐν μηδενὶ ὑπὸ τῶν ἀντικειμένων (ἥτις ⸂ἐστὶν αὐτοῖς⸃ ἔνδειξις ἀπωλείας, ⸀ὑμῶν δὲ σωτηρίας, καὶ τοῦτο ἀπὸ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/028.yaml
  text: and not being frightened in anything by those who oppose you[a]. This is a sign to them of destruction[c][b], but of your salvation—and this from God.
translation:
  language: ml
  text: നിങ്ങളെ എതിർക്കുന്നവർ നിമിത്തം ഒരു കാര്യത്തിലും ഭയപ്പെടാതിരിക്കുക[a]. ഇത് അവർക്കു നാശത്തിന്റെയും നിങ്ങൾക്കു രക്ഷയുടെയും അടയാളമാണ്[b]—ഇതും ദൈവത്തിൽനിന്നുള്ളതാണ്[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘പരിഭ്രമിക്കാതെ’ അല്ലെങ്കിൽ ‘ഭീഷണിക്കു വഴങ്ങാതെ.’'
    reason: lexical_alternative
  - marker: b
    text: ‘അടയാളം’ എന്നതിന് ‘തെളിവ്’ അല്ലെങ്കിൽ ‘സൂചന’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: ‘ഇത് ദൈവത്തിൽനിന്നുള്ളതാണ്’ എന്നത് പ്രത്യേകിച്ച് രക്ഷയെ സൂചിപ്പിക്കാം; അല്ലെങ്കിൽ മുമ്പു പറഞ്ഞ അടയാളത്തെ മുഴുവനായി സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: πτυρόμενοι
  choice: ഭയപ്പെടുത്തപ്പെടാതെ
  rationale: ക്രിയയ്ക്ക് ഭയന്നുപോകുക, പരിഭ്രമിക്കുക, ഭീഷണിക്കു വഴങ്ങുക എന്നീ അർഥസൂചനകളുണ്ട്. സന്ദർഭത്തിൽ എതിരാളികൾ സൃഷ്ടിക്കുന്ന ഭയത്തിന് വഴങ്ങാതിരിക്കുക എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐν μηδενί
  choice: ഒരു കാര്യത്തിലും
  rationale: ‘ഒന്നിലും’ എന്ന സമഗ്രമായ നിഷേധം നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: ὑπὸ τῶν ἀντικειμένων
  choice: നിങ്ങളെ എതിർക്കുന്നവരാൽ
  rationale: എതിർത്തുനിൽക്കുന്ന വ്യക്തികളെ സൂചിപ്പിക്കുന്ന വർത്തമാന കൃദന്തരൂപത്തിന്റെ സജീവവും ബന്ധപരവുമായ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: ἔνδειξις
  choice: അടയാളം
  rationale: തെളിവ്, സൂചന എന്നീ അർഥങ്ങൾ ഉൾക്കൊള്ളുന്ന പദത്തിന് ഇവിടെ വായനാസൗകര്യമുള്ളതും അമിതമായ നിർണായകത ചേർക്കാത്തതുമായ പരിഭാഷ.
- source_word: ἀπωλείας
  choice: നാശം
  rationale: നശിക്കൽ, വിനാശം, അന്തിമ നഷ്ടം എന്നിവയുടെ അർഥപരിധി അനാവശ്യമായി ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: σωτηρίας
  choice: രക്ഷ
  rationale: പൗലോസിന്റെ സന്ദർഭത്തിലെ ദൈവിക രക്ഷയുടെ ദൈവശാസ്ത്രപരമായ ഭാരം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: καὶ τοῦτο ἀπὸ θεοῦ
  choice: ഇതും ദൈവത്തിൽനിന്നുള്ളതാണ്
  rationale: ‘ഇത്’ എന്ന സൂചകസർവനാമം നിലനിർത്തി അതിന്റെ മുൻസൂചന എന്താണെന്നുള്ള ഗ്രീക്കിലെ അവ്യക്തത പരിഹരിക്കാതെ വിടുന്നു.
theological_decisions:
- issue: τοῦτο (‘ഇത്’) എന്നതിന്റെ മുൻസൂചന
  choice: ‘ഇതും ദൈവത്തിൽനിന്നുള്ളതാണ്’ എന്നു വിശാലമായി നിലനിർത്തി.
  alternative: ‘ഇത്’ പ്രത്യേകിച്ച് വിശ്വാസികളുടെ രക്ഷയെ സൂചിപ്പിക്കുന്നു; അല്ലെങ്കിൽ അവരുടെ നിർഭയതയും അതിലൂടെ ലഭിക്കുന്ന നാശ-രക്ഷാ സൂചനയും മുഴുവനായി സൂചിപ്പിക്കുന്നു.
  rationale: ഗ്രീക്ക് വ്യാകരണം ഒന്നിലധികം മുൻസൂചനകൾ അനുവദിക്കുന്നതിനാൽ മുഖ്യവാചകം ഏതെങ്കിലും ഒരു വ്യാഖ്യാനം നിർബന്ധമാക്കുന്നില്ല.
- issue: ἔνδειξις എന്നതിന്റെ തെളിവുസ്വഭാവം
  choice: അടയാളം
  alternative: തെളിവ്; സൂചന
  rationale: എതിരാളികളുടെ നാശവും വിശ്വാസികളുടെ രക്ഷയും സംബന്ധിച്ച ദൈവിക യാഥാർഥ്യത്തിലേക്ക് ചൂണ്ടുന്ന സ്വഭാവം നിലനിർത്തുന്നു; ‘നിർണായക തെളിവ്’ എന്ന അധിക അർഥം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. 1:27-ലെ ആജ്ഞാത്മക ഘടന തുടരുന്നതിനാൽ കൃദന്തരൂപത്തെ മലയാളത്തിൽ ‘നിലകൊള്ളുക’ എന്നു പൂരിപ്പിച്ചു; മൂലത്തിലെ നിർഭയതയുടെ ഊന്നൽ നിലനിർത്തി.
