id: PHP.1.11
reference: Philippians 1:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πεπληρωμένοι ⸂καρπὸν δικαιοσύνης τὸν⸃ διὰ Ἰησοῦ Χριστοῦ εἰς δόξαν καὶ ἔπαινον θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/011.yaml
  text: filled with the fruit of righteousness that comes through Jesus the Messiah[b][a], to the glory and praise of God.
translation:
  language: ml
  text: യേശു മശീഹയിലൂടെ[b] ലഭിക്കുന്ന നീതിയുടെ ഫലംകൊണ്ട്[a] നിറഞ്ഞവരായി, ദൈവത്തിന്റെ മഹത്വത്തിനും സ്തുതിക്കും വേണ്ടി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നീതിയുടെ ഫലം’ എന്നതിന് ‘നീതിനിഷ്ഠയുടെ ഫലം’ എന്നും വിവർത്തനം ചെയ്യാം; ‘നീതി’ എന്ന പദത്തിന് ‘ന്യായം’ എന്ന അർത്ഥവും ഉണ്ടാകാം.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ ‘യേശു ക്രിസ്തു’; ‘ക്രിസ്തു’ എന്ന പദവിയുടെ അർത്ഥം വ്യക്തമാക്കാൻ ഇവിടെ ‘മശീഹ’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεπληρωμένοι
  choice: നിറഞ്ഞവരായി
  rationale: പൂർണകാല കർമണി പങ്കാളിക്രിയ സൂചിപ്പിക്കുന്ന, മുൻവാക്യത്തോട് ബന്ധപ്പെടുന്ന ഫലാവസ്ഥ മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: καρπὸν
  choice: ഫലം
  rationale: ധാർമികവും ആത്മീയവുമായ പരിണതിയെ സൂചിപ്പിക്കുന്ന പൗലോസിന്റെ രൂപകം അതേപടി സംരക്ഷിക്കുന്നു.
- source_word: δικαιοσύνης
  choice: നീതിയുടെ
  rationale: δικαιοσύνηയുടെ നീതി/നീതിനിഷ്ഠ/ന്യായം എന്നീ അർത്ഥപരിധി ഉൾക്കൊള്ളുന്ന സാധാരണ മലയാളപദം; ഷഷ്ഠീവ്യാകരണബന്ധത്തിന്റെ കൃത്യസ്വഭാവം നിർബന്ധമായി തീർപ്പാക്കുന്നില്ല.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: യേശു മശീഹയിലൂടെ ലഭിക്കുന്ന
  rationale: διά + ഷഷ്ഠി സൂചിപ്പിക്കുന്ന മധ്യസ്ഥതയെയോ കാരണോപാധിയെയോ വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ ഫലവുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: Χριστοῦ
  choice: മശീഹ
  rationale: Χριστός എന്ന അഭിഷിക്തരാജാവിന്റെ പദവിയർത്ഥം വെറും പേരായി ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: εἰς δόξαν καὶ ἔπαινον θεοῦ
  choice: ദൈവത്തിന്റെ മഹത്ത്വത്തിനും സ്തുതിക്കും വേണ്ടി
  rationale: εἰς സൂചിപ്പിക്കുന്ന ലക്ഷ്യമോ ഫലമോ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘നീതിയുടെ ഫലം’ എന്നതിലെ ഷഷ്ഠീവ്യാകരണബന്ധം
  choice: ‘നീതിയുടെ ഫലം’ എന്ന തുറന്ന ഘടന നിലനിർത്തി
  alternative: നീതിയാകുന്ന ഫലം / നീതി ഉളവാക്കുന്ന ഫലം / നീതിയിൽനിന്നുള്ള ഫലം
  rationale: ഇത് നീതിയാൽ സവിശേഷീകരിക്കപ്പെട്ട ഫലമോ, നീതിയായി നിലകൊള്ളുന്ന ഫലമോ, നീതിയിൽനിന്ന് ഉദ്ഭവിക്കുന്ന ഫലമോ എന്നത് ഗ്രീക്ക് വാചകം പൂർണമായി നിർണയിക്കുന്നില്ല; വിവർത്തനം ആ ദൈവശാസ്ത്രപരമായ തുറന്നത്വം സംരക്ഷിക്കുന്നു.
- issue: ഫലത്തിന്റെ ഉറവിടമോ മധ്യസ്ഥനോ
  choice: ‘യേശു മശീഹയിലൂടെ ലഭിക്കുന്ന’
  alternative: ‘യേശു മശീഹയാൽ ഉളവാകുന്ന’
  rationale: διάയുടെ മധ്യസ്ഥത/ഉപാധി എന്ന അർത്ഥം നിലനിർത്തുകയും, യേശുവാണ് നേരിട്ടുള്ള ഉത്പാദകൻ എന്നതിലേക്കു മാത്രം വ്യാഖ്യാനം ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും പൊതുവായ വായനയ്ക്ക് എളുപ്പവുമായ മലയാളം. ഇത് മുൻവാക്യത്തിലെ പ്രാർത്ഥന തുടരുന്ന പങ്കാളിക്രിയാ ഘടകമായതിനാൽ ‘നിറഞ്ഞവരായി’ എന്ന അപൂർണവാക്യരൂപം ബോധപൂർവം നിലനിർത്തിയിരിക്കുന്നു.
