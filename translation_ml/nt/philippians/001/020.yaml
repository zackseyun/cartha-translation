id: PHP.1.20
reference: Philippians 1:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: κατὰ τὴν ἀποκαραδοκίαν καὶ ἐλπίδα μου ὅτι ἐν οὐδενὶ αἰσχυνθήσομαι, ἀλλ’ ἐν πάσῃ παρρησίᾳ ὡς πάντοτε καὶ νῦν μεγαλυνθήσεται Χριστὸς ἐν τῷ σώματί μου, εἴτε διὰ ζωῆς εἴτε διὰ θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/020.yaml
  text: in keeping with my eager expectation and hope that I will not be put to shame in anything[a], but that with all boldness, as always, even now Messiah will be magnified in my body[b], whether through life or through death.
translation:
  language: ml
  text: എന്റെ തീവ്രമായ കാത്തിരിപ്പിനും പ്രത്യാശയ്ക്കും ഒത്തവണ്ണം, ഞാൻ ഒരു കാര്യത്തിലും അപമാനിതനാകുകയില്ല[a]; മറിച്ച്, എല്ലായ്പോഴുമെന്നപോലെ ഇപ്പോഴും പൂർണ ധൈര്യത്തോടെ, മിശിഹാ എന്റെ ശരീരത്തിൽ മഹാനായി ഉയർത്തപ്പെടും—ജീവനിലൂടെയായാലും മരണത്തിലൂടെയായാലും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ ഒന്നിനെക്കുറിച്ചും ലജ്ജിക്കുകയില്ല.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ക്രിസ്തു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ
  choice: ഒത്തവണ്ണം
  rationale: പൗലോസിന്റെ തീവ്രമായ കാത്തിരിപ്പിനോടും പ്രത്യാശയോടും തുടർന്നുള്ള കാര്യം പൊരുത്തപ്പെടുന്നു എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀποκαραδοκίαν
  choice: തീവ്രമായ കാത്തിരിപ്പ്
  rationale: മുന്നോട്ടു നോക്കിയുള്ള അത്യാകാംക്ഷയാർന്ന പ്രതീക്ഷ എന്ന അപൂർവപദത്തിന്റെ തീവ്രത സാധാരണ വായനക്കാർക്കു വ്യക്തമായി പകരുന്നു.
- source_word: ἐλπίδα
  choice: പ്രത്യാശ
  rationale: പൗലോസിന്റെ ആത്മവിശ്വാസമുള്ള പ്രത്യാശയെ സൂചിപ്പിക്കുന്ന പതിവായ മലയാളപദം.
- source_word: ἐν οὐδενὶ
  choice: ഒന്നിലും
  rationale: ഒരു കാര്യത്തിലും അല്ല എന്ന സമ്പൂർണ നിഷേധം ചുരുക്കമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: αἰσχυνθήσομαι
  choice: അപമാനിതനാകുകയില്ല
  rationale: രൂപത്തിലെ നിഷ്ക്രിയവും പൊതുസാക്ഷ്യത്തിലും അന്തിമസ്ഥിരീകരണത്തിലുമുള്ള ‘നാണംകെടുത്തപ്പെടുക’ എന്ന ഭാവവും മുൻനിർത്തുന്നു; ‘ലജ്ജിക്കുകയില്ല’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: παρρησίᾳ
  choice: പൂർണധൈര്യത്തോടെ
  rationale: തുറന്നും ഭയമില്ലാതെയും സാക്ഷ്യം പറയുന്ന ഭാവം ഇവിടെ ‘ധൈര്യം’ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; πάσῃ എന്ന സമഗ്രത ‘പൂർണ’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: μεγαλυνθήσεται
  choice: മഹാനായി ഉയർത്തപ്പെടും
  rationale: ‘മഹാനാക്കുക/മഹാനായി കാണിക്കുക’ എന്ന ക്രിയയുടെ നിഷ്ക്രിയരൂപവും അർത്ഥവും നിലനിർത്തുന്നു; δοξάζω എന്നതുമായി അനാവശ്യമായി ലയിപ്പിക്കുന്ന ‘മഹിമപ്പെടും’ ഒഴിവാക്കുന്നു.
- source_word: Χριστὸς
  choice: മിശിഹാ
  rationale: ഇവിടെ യേശുവിന്റെ അഭിഷിക്തസ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന അർത്ഥവത്തായ പദവിയായി Χριστός വായിക്കാം; അതിനാൽ മലയാളത്തിൽ നിലവിലുള്ള ‘മിശിഹാ’ തിരഞ്ഞെടുത്തു.
- source_word: ἐν τῷ σώματί μου
  choice: എന്റെ ശരീരത്തിൽ
  rationale: ജീവനിലോ മരണത്തിലോ പ്രകടമാകുന്ന പൗലോസിന്റെ ശരീരബന്ധിത സാക്ഷ്യം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: εἴτε διὰ ζωῆς εἴτε διὰ θανάτου
  choice: ജീവനിലൂടെയായാലും മരണത്തിലൂടെയായാലും
  rationale: διάയുടെ മാർഗം/സാഹചര്യം എന്ന വ്യാപ്തിയും ഇരുഭാഗങ്ങളുടെയും സമാന്തരഘടനയും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ ലേഖനത്തിൽ Χριστός എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: മിശിഹാ
  alternative: ക്രിസ്തു
  rationale: ഈ വാക്യത്തിൽ പദവിയുടെ അർത്ഥശക്തി കേൾക്കാവുന്നതാണ്; യേശുവിന്റെ മിശിഹാത്വം തന്റെ ശരീരത്തിൽ മഹാനായി ഉയർത്തപ്പെടണമെന്ന ആശയമായതിനാൽ അർത്ഥം പരിഭാഷപ്പെടുത്തുന്ന രൂപം മുൻഗണിച്ചു.
- issue: αἰσχυνθήσομαι എന്നതിലെ നിഷ്ക്രിയതയും ആത്മാനുഭവവും
  choice: അപമാനിതനാകുകയില്ല
  alternative: ലജ്ജിക്കുകയില്ല
  rationale: പൊതുവായി നാണംകെടുത്തപ്പെടുകയോ പ്രതീക്ഷ പരാജയപ്പെട്ട് അപമാനിതനാകുകയോ ചെയ്യില്ല എന്ന ഭാവം മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; സ്വയം ലജ്ജ അനുഭവിക്കുക എന്ന സാധുവായ വായന അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവഭാവമുള്ള മലയാളം ഉപയോഗിച്ചു. ദീർഘമായ ഗ്രീക്ക് വാക്യത്തിന്റെ തർക്കക്രമം നിലനിർത്തിക്കൊണ്ട് അർദ്ധവിരാമവും കോമകളും ഉപയോഗിച്ച് സാധാരണ വായനക്കാർക്ക് പിന്തുടരാവുന്ന രൂപമാക്കി. ‘മഹാനായി ഉയർത്തപ്പെടും’ എന്ന പ്രയോഗം മൂലക്രിയയുടെ പ്രത്യേകത സംരക്ഷിക്കുന്നു.
