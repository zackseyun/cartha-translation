revisions:
- from: എന്റെ തീവ്രമായ കാത്തിരിപ്പിനും പ്രത്യാശയ്ക്കും ഒത്തവണ്ണം, ഞാൻ ഒന്നിലും അപമാനിതനാകുകയില്ല[a]; പകരം, എല്ലായ്പോഴും എന്നപോലെ ഇപ്പോഴും പൂർണധൈര്യത്തോടെ, ജീവനിലൂടെയായാലും മരണത്തിലൂടെയായാലും, എന്റെ ശരീരത്തിൽ മിശിഹാ[b] മഹാനായി ഉയർത്തപ്പെടും.
  to: എന്റെ തീവ്രമായ കാത്തിരിപ്പിനും പ്രത്യാശയ്ക്കും ഒത്തവണ്ണം, ഞാൻ ഒരു കാര്യത്തിലും അപമാനിതനാകുകയില്ല[a]; മറിച്ച്, എല്ലായ്പോഴുമെന്നപോലെ ഇപ്പോഴും പൂർണ ധൈര്യത്തോടെ, മിശിഹാ എന്റെ ശരീരത്തിൽ മഹാനായി ഉയർത്തപ്പെടും—ജീവനിലൂടെയായാലും മരണത്തിലൂടെയായാലും.[b]
