id: PHP.1.14
reference: Philippians 1:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ τοὺς πλείονας τῶν ἀδελφῶν ἐν κυρίῳ πεποιθότας τοῖς δεσμοῖς μου περισσοτέρως τολμᾶν ἀφόβως τὸν ⸀λόγον λαλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/014.yaml
  text: And most of the brothers[a], having become confident in the Lord because of my chains, dare all the more to speak the word fearlessly.
translation:
  language: ml
  text: എന്റെ ചങ്ങലകൾ നിമിത്തം കർത്താവിൽ ആത്മവിശ്വാസം നേടിയ സഹോദരന്മാരിൽ ഭൂരിഭാഗവും[a] വചനം നിർഭയം സംസാരിക്കാൻ മുമ്പെക്കാളും കൂടുതൽ ധൈര്യപ്പെടുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘സഹോദരീസഹോദരന്മാരിൽ’; ഇവിടെ ഈ പദം കൂടുതൽ വിശാലമായി സഹവിശ്വാസികളെ സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλείονας
  choice: ഭൂരിഭാഗവും
  rationale: നിശ്ചയാർഥക പദത്തോടും ഭാഗിക ഷഷ്ഠിയോടും ചേർന്ന പ്രയോഗം വെറും താരതമ്യപരമായ ‘കൂടുതൽ പേർ’ എന്നതിലുപരി ‘ഭൂരിഭാഗം’ എന്ന അർഥം നൽകുന്നു.
- source_word: ἀδελφῶν
  choice: സഹോദരന്മാരിൽ
  rationale: ഗ്രീക്ക് പദം വ്യാകരണപരമായി പുല്ലിംഗ ബഹുവചനമാണ്; അതിനാൽ മുഖ്യപാഠത്തിൽ ലിംഗസൂചന നിലനിർത്തി, വിശാലമായ ഉൾക്കൊള്ളുന്ന സാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: ἐν κυρίῳ
  choice: കർത്താവിൽ
  rationale: പൗലോസിന്റെ സവിശേഷ പ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു; ഇവിടെ അവരുടെ ഉറപ്പിന്റെ മേഖലയെയോ അടിസ്ഥാനത്തെയോ സൂചിപ്പിക്കുന്നു.
- source_word: πεποιθότας
  choice: ഉറപ്പുള്ളവരായിത്തീർന്ന
  rationale: പൂർണ്ണകാല കൃദന്തം മുൻപ് ഉണ്ടായ ഉറപ്പിക്കലിന്റെ ഫലമായി ഇപ്പോൾ തുടരുന്ന സ്ഥിരാവസ്ഥയെ സൂചിപ്പിക്കുന്നു.
- source_word: τοῖς δεσμοῖς μου
  choice: എന്റെ ചങ്ങലകൾ നിമിത്തം
  rationale: δεσμοί എന്നതിന്റെ മൂർത്തമായ ‘ചങ്ങലകൾ’ എന്ന ദൃശ്യം നിലനിർത്തുകയും സന്ദർഭത്തിലെ കാരണാർഥം ‘നിമിത്തം’കൊണ്ട് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: περισσοτέρως
  choice: കൂടുതൽ
  rationale: താരതമ്യാർഥമുള്ള ക്രിയാവിശേഷണത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: τολμᾶν
  choice: ധൈര്യപ്പെടുന്നു
  rationale: സംസാരിക്കാൻ ധീരമായ തീരുമാനമെടുക്കുന്നു എന്ന ക്രിയാർഥം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἀφόβως
  choice: നിർഭയം
  rationale: ഭയത്തിന്റെ അഭാവം കൃത്യമായി വ്യക്തമാക്കുന്നു; പൊതുവായ ‘ധൈര്യമായി’ എന്നതിലേക്കു ചുരുക്കുന്നില്ല.
- source_word: τὸν λόγον
  choice: വചനം
  rationale: ഇവിടെ സുവിശേഷസന്ദേശത്തെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിലും, ഗ്രീക്കിലുള്ളതിലധികമായി ‘ദൈവവചനം’ എന്നു ചേർക്കാതെ പരമ്പരാഗതവും നേരിട്ടുള്ളതുമായ പദം ഉപയോഗിക്കുന്നു.
- source_word: λαλεῖν
  choice: സംസാരിക്കാൻ
  rationale: പൊതുവായ സംസാരക്രിയയെ നേരിട്ട് വിവർത്തനം ചെയ്യുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത ശക്തമായ ‘പ്രഘോഷിക്കുക’ എന്ന ആശയം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ἀδελφῶν എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: മുഖ്യപാഠത്തിൽ ‘സഹോദരന്മാരിൽ’ എന്നു നൽകി; വിശാലമായ ഉൾക്കൊള്ളുന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
  alternative: ‘സഹോദരീസഹോദരന്മാരിൽ’ അല്ലെങ്കിൽ ‘സഹവിശ്വാസികളിൽ’
  rationale: ഗ്രീക്ക് രൂപം പുല്ലിംഗ ബഹുവചനമായതിനാൽ അതു മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു; എന്നാൽ സന്ദർഭത്തിൽ സ്ത്രീപുരുഷന്മാരായ സഹവിശ്വാസികളെ പൊതുവായി ഉദ്ദേശിച്ചിരിക്കാവുന്ന യഥാർഥ സാധ്യത മറച്ചുവയ്ക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘കർത്താവിൽ’, ‘ചങ്ങലകൾ’, ‘വചനം’ എന്നീ ഉറവിടസമീപ പദങ്ങൾ നിലനിർത്തിക്കൊണ്ട് വാക്യക്രമം മലയാളവായനയ്ക്ക് അനുസൃതമാക്കി.
