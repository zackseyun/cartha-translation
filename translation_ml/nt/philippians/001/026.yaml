id: PHP.1.26
reference: Philippians 1:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἵνα τὸ καύχημα ὑμῶν περισσεύῃ ἐν Χριστῷ Ἰησοῦ ἐν ἐμοὶ διὰ τῆς ἐμῆς παρουσίας πάλιν πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/026.yaml
  text: so that your boasting in Messiah Jesus may abound because of me through my coming to you again[a][b][c][d].
translation:
  language: ml
  text: 'അങ്ങനെ, ഞാൻ വീണ്ടും നിങ്ങളുടെ അടുക്കൽ വരുന്നതിലൂടെ, മശീഹാ യേശുവിൽ നിങ്ങൾക്കുള്ള അഭിമാനം എന്നെ നിമിത്തം വർധിച്ചുകവിയേണ്ടതിന്.[a][b][c][d]


    [a] മറ്റൊരു പരിഭാഷ: “മശീഹാ യേശുവിൽ നിങ്ങൾക്കുള്ള അഭിമാനം വർധിച്ചുകവിയേണ്ടതിന്.”


    [b] അക്ഷരാർഥം: “എന്നിൽ”; ഇവിടെ “എന്നെച്ചൊല്ലി” എന്നോ “ഞാൻ നിമിത്തം” എന്നോ അർഥമാക്കാം.


    [c] “മശീഹാ യേശു” എന്നത് “ക്രിസ്തു യേശു” എന്നും പരിഭാഷപ്പെടുത്താം.


    [d] മറ്റൊരു പരിഭാഷ: “ഞാൻ വീണ്ടും നിങ്ങളുടെ അടുക്കൽ വരുന്നതിലൂടെ, മശീഹാ യേശുവിൽ അഭിമാനിക്കാനുള്ള നിങ്ങളുടെ കാരണം എന്നെ നിമിത്തം വർധിച്ചുകവിയേണ്ടതിന്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
