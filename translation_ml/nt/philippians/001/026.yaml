  rationale: 'The revision corrects the unnatural title construction and renders περισσεύῃ with an increasing/overflowing expression. It retains the Greek syntactic relations: the Philippians’ boasting is in Messiah Jesus; Paul is the occasion or basis; and his coming again is the means by which this occurs. All four footnote anchors and their corresponding notes are retained.'
