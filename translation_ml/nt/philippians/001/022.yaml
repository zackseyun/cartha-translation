- from: എന്നാൽ ജഡത്തിൽ ജീവിച്ചുകൊണ്ടിരിക്കുന്നത് എനിക്ക് ഫലപ്രദമായ അധ്വാനമാണെങ്കിൽ[a][b], ഏതു തിരഞ്ഞെടുക്കണമെന്ന് എനിക്കറിയില്ല.
