id: PHP.1.22
reference: Philippians 1:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ δὲ τὸ ζῆν ἐν σαρκί, τοῦτό μοι καρπὸς ἔργου— καὶ τί αἱρήσομαι οὐ γνωρίζω·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/022.yaml
  text: But if to go on living in the flesh means fruitful labor for me[b][a], yet which I will choose I do not know.
translation:
  language: ml
  text: എന്നാൽ ജഡത്തിൽ ജീവിച്ചുകൊണ്ടിരിക്കുന്നത് എനിക്ക് ഫലപ്രദമായ അധ്വാനമാണെങ്കിൽ[a][b]—ഞാൻ എന്ത് തിരഞ്ഞെടുക്കുമെന്നു എനിക്കറിയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ശരീരത്തിൽ.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അധ്വാനത്തിന്റെ ഫലം” അല്ലെങ്കിൽ “ഫലമുള്ള പ്രവൃത്തി.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ζῆν
  choice: ജീവിച്ചുകൊണ്ടിരിക്കുന്നത്
  rationale: വർത്തമാന ഭൗമികജീവിതം തുടരുന്നതിനെ സൂചിപ്പിക്കുന്ന articular infinitive-ന്റെ തുടർച്ചാഭാവം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐν σαρκί
  choice: ജഡത്തിൽ
  rationale: സന്ദർഭത്തിൽ പാപസ്വഭാവമല്ല, ശരീരത്തോടുകൂടിയ ഭൗമിക അസ്തിത്വമാണ് ഉദ്ദേശിക്കുന്നത്; അതേസമയം പൗലോസിന്റെ σάρξ എന്ന പദപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: καρπὸς ἔργου
  choice: ഫലപ്രദമായ അധ്വാനം
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തവും അല്പം ദ്വയാർഥസാധ്യതയുള്ളതുമായ പ്രയോഗത്തെ സ്വാഭാവികമായി അവതരിപ്പിച്ച്, ഫലം ഉളവാക്കുന്ന പ്രവർത്തനം എന്ന ആശയം നൽകുന്നു.
- source_word: αἱρήσομαι
  choice: തിരഞ്ഞെടുക്കണമെന്ന്
  rationale: രണ്ട് സാധ്യതകളിൽ ഒന്നിനെ തിരഞ്ഞെടുക്കുക എന്ന സന്ദർഭാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: οὐ γνωρίζω
  choice: എനിക്കറിയില്ല
  rationale: ഇവിടെ ‘അറിയിക്കുക’ എന്ന സാധാരണ causative അർഥത്തേക്കാൾ അനിശ്ചിതത്വം പ്രകടിപ്പിക്കുന്ന പ്രയോഗമാണ് സന്ദർഭത്തിന് യോജിക്കുന്നത്.
theological_decisions:
- issue: ഈ വാക്യത്തിലെ σάρξ എന്നതിന്റെ അർഥം
  choice: ശരീരത്തോടുകൂടിയ ഭൗമിക അസ്തിത്വം (‘ജഡത്തിൽ’)
  alternative: പാപസ്വഭാവം
  rationale: തുടർന്നുള്ള ഭൗമികജീവിതവും ക്രിസ്തുവിനോടുകൂടെ ഇരിക്കാൻ പുറപ്പെടുന്നതും തമ്മിലാണ് സന്ദർഭത്തിലെ വൈരുധ്യം; അതിനാൽ ഇവിടെ ധാർമ്മിക ദുഷ്ടതയല്ല, ശരീരജീവിതമാണ് സൂചിപ്പിക്കുന്നത്.
- issue: καρπὸς ἔργου എന്ന സംക്ഷിപ്ത പ്രയോഗത്തിന്റെ ബന്ധം
  choice: ജീവിച്ചുകൊണ്ടിരിക്കുന്നത് പൗലോസിന് ഫലപ്രദമായ അധ്വാനമാകുന്നു
  alternative: ജീവിച്ചുകൊണ്ടിരിക്കുന്നത് അദ്ദേഹത്തിന്റെ പ്രവർത്തനത്തിന്റെ ഫലമാകുന്നു
  rationale: ‘ഫലപ്രദമായ അധ്വാനം’ സന്ദർഭത്തിലെ ശുശ്രൂഷാഫലത്തെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; എന്നാൽ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ മറ്റൊരു ഘടനാസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ജഡത്തിൽ’ പൗലോസിന്റെ പദപ്രയോഗം നിലനിർത്തുന്നു; സാധാരണ വായനക്കാർക്ക് ഉദ്ദേശ്യം വ്യക്തമാക്കാൻ ‘ശരീരത്തിൽ’ എന്ന വികൽപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു. ഗ്രീക്കിലെ അപൂർണ്ണമായ നിബന്ധനാവാക്യത്തിന്റെ മുറുക്കവും തിരഞ്ഞെടുപ്പിനെക്കുറിച്ചുള്ള അനിശ്ചിതത്വവും അനാവശ്യമായി പരിഹരിക്കാതെ സൂക്ഷിച്ചിരിക്കുന്നു.
