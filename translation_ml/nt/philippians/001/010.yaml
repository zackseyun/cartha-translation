id: PHP.1.10
reference: Philippians 1:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰς τὸ δοκιμάζειν ὑμᾶς τὰ διαφέροντα, ἵνα ἦτε εἰλικρινεῖς καὶ ἀπρόσκοποι εἰς ἡμέραν Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/010.yaml
  text: so that you may approve the things that are excellent[a], in order that you may be pure and blameless for the day of Messiah[b],
translation:
  language: ml
  text: ഏതാണ് ശ്രേഷ്ഠമെന്ന് വിവേചിച്ചറിയാനും[a], അങ്ങനെ മിശിഹായുടെ ദിവസത്തിനായി[b] നിങ്ങൾ നിർമലരും കുറ്റമില്ലാത്തവരും[c] ആയിരിക്കാനും,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘പ്രാധാന്യമുള്ളവ തിരിച്ചറിയാനും,’ ‘ശ്രേഷ്ഠമായവയെ അംഗീകരിക്കാനും’; കൂടുതൽ പദാനുപദമായി: ‘വ്യത്യസ്തമായവയെ പരിശോധിക്കാനും.’'
    reason: lexical_alternative
  - marker: b
    text: 'പരമ്പരാഗത പരിഭാഷ: ‘ക്രിസ്തുവിന്റെ ദിവസത്തിനായി.’'
    reason: alternative_reading
  - marker: c
    text: 'അഥവാ: ‘ഇടർച്ചയില്ലാത്തവരും’ അല്ലെങ്കിൽ ‘മറ്റുള്ളവർക്ക് ഇടർച്ച വരുത്താത്തവരും.’'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: δοκιμάζειν
  choice: പരിശോധിച്ച് അംഗീകരിക്കുക
  rationale: ഈ ക്രിയയ്ക്ക് പരിശോധിക്കുക, വിലയിരുത്തുക, പരിശോധനയ്ക്കുശേഷം അംഗീകരിക്കുക എന്നീ അർഥങ്ങളുണ്ട്. ഒരൊറ്റ സ്വാഭാവിക മലയാളക്രിയയിൽ ഈ വ്യാപ്തി മുഴുവൻ വ്യക്തമാകാത്തതിനാൽ ‘പരിശോധിച്ച് അംഗീകരിക്കുക’ എന്ന സംയുക്തപ്രയോഗം ഉപയോഗിച്ചു.
- source_word: τὰ διαφέροντα
  choice: ശ്രേഷ്ഠമായവ
  rationale: പദാനുപദമായി ‘വ്യത്യസ്തമായവ’ എന്നാണെങ്കിലും, സന്ദർഭത്തിൽ താരതമ്യേന മികച്ചതോ കൂടുതൽ പ്രാധാന്യമുള്ളതോ ആയ കാര്യങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. താരതമ്യഭാവം നിലനിർത്താൻ ‘ശ്രേഷ്ഠമായവ’ തിരഞ്ഞെടുത്തു.
- source_word: εἰλικρινεῖς
  choice: നിർമലർ
  rationale: ഈ പദം ശുദ്ധി, ആത്മാർഥത, കാപട്യമില്ലായ്മ എന്നിവ സൂചിപ്പിക്കാം. തുടർന്നുള്ള ἀπρόσκοποι എന്ന പദത്തോടൊപ്പം നൈതിക സമഗ്രത വ്യക്തമാക്കാൻ ‘നിർമലർ’ സ്വാഭാവികമാണ്.
- source_word: ἀπρόσκοποι
  choice: കുറ്റമില്ലാത്തവർ
  rationale: ഇടറാതിരിക്കുക, മറ്റുള്ളവർക്ക് ഇടർച്ച വരുത്താതിരിക്കുക, ആക്ഷേപത്തിന് ഇടനൽകാതിരിക്കുക എന്നീ സാധ്യതകളുള്ള പദമാണിത്. നൈതിക ഫലത്തെ സ്വാഭാവിക മലയാളത്തിൽ സംക്ഷിപ്തമായി അറിയിക്കാൻ ‘കുറ്റമില്ലാത്തവർ’ ഉപയോഗിച്ചു; മറ്റ് സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: εἰς ἡμέραν Χριστοῦ
  choice: മശീഹായുടെ ദിവസത്തിനായി
  rationale: εἰς ഇവിടെ വരാനിരിക്കുന്ന ദിവസത്തെ ലക്ഷ്യമാക്കിയുള്ള ഒരുക്കം സൂചിപ്പിക്കുന്നു; അതിനാൽ ‘ദിവസത്തിനായി’ എന്ന് നൽകി. Χριστός ഇവിടെ സ്ഥാനപ്പേരിന്റെ അർഥത്തിൽ വരുന്നതിനാൽ അതിന്റെ അർഥം വ്യക്തമാക്കുന്ന ‘മശീഹാ’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: εἰς ἡμέραν Χριστοῦ എന്ന അന്ത്യകാലപ്രയോഗത്തിൽ Χριστοῦ എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: മശീഹായുടെ ദിവസം
  alternative: ക്രിസ്തുവിന്റെ ദിവസം
  rationale: Χριστός ഇവിടെ വ്യക്തിനാമംപോലെ മാത്രം അല്ല, അഭിഷിക്തനായവൻ എന്ന സ്ഥാനപ്പേരിന്റെ ഭാവത്തിലും പ്രവർത്തിക്കുന്നു. അതിനാൽ ‘മശീഹാ’ മുഖ്യപാഠത്തിൽ നൽകി; പരിചിതമായ പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: ἀπρόσκοποι എന്ന പദത്തിന്റെ നൈതിക ദിശ
  choice: കുറ്റമില്ലാത്തവർ
  alternative: ഇടർച്ചയില്ലാത്തവർ; മറ്റുള്ളവർക്ക് ഇടർച്ച വരുത്താത്തവർ
  rationale: ഗ്രീക്ക് പദം ഒരാൾ സ്വയം ഇടറാത്തതിനെയോ മറ്റുള്ളവർക്ക് ഇടർച്ച വരുത്താത്തതിനെയോ സൂചിപ്പിക്കാം. മുഖ്യപാഠത്തിൽ വിപുലമായ ‘കുറ്റമില്ലാത്തവർ’ സ്വീകരിച്ച് യഥാർഥ അർഥവൈവിധ്യം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. വാക്യം മുൻവാക്യത്തിൽ ആശ്രയിക്കുന്ന ഉദ്ദേശ്യവാക്യഖണ്ഡമായതിനാൽ അവസാനത്തിൽ വിരാമചിഹ്നമായി കോമ നിലനിർത്തി. ‘പരിശോധിച്ച് അംഗീകരിക്കുക’ എന്ന പ്രയോഗം ഗ്രീക്ക് ക്രിയയുടെ പരിശോധനയും അംഗീകാരവും ഉൾക്കൊള്ളുന്ന അർഥവ്യാപ്തി സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
