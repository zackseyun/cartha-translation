    text: അഥവാ, ‘അവന്റെ നിമിത്തം.’
    reason: lexical_alternative
  revision_rationale: 'The revision replaces the unnatural “മശീഹായെപ്രതി” with “മശീഹാവിനുവേണ്ടി” and sets it off with commas so that it naturally introduces the whole granted reality: both believing in him and suffering for him. It retains the Greek passive gift language without specifying the unstated agent, preserves Messiah as the title rendering of Χριστός, and retains the distinction in wording between the opening Christ-related phrase and the later suffering-for-him phrase.'
