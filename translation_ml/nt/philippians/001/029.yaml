  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι ὑμῖν ἐχαρίσθη τὸ ὑπὲρ Χριστοῦ, οὐ μόνον τὸ εἰς αὐτὸν πιστεύειν ἀλλὰ καὶ τὸ ὑπὲρ αὐτοῦ πάσχειν),
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/029.yaml
  text: For it has been graciously granted to you on behalf of Messiah not only to believe in him[a], but also to suffer for him[d][c][b],
translation:
  language: ml
  text: കാരണം, മശീഹാവിനുവേണ്ടി, അവനിൽ വിശ്വസിക്കാൻ മാത്രമല്ല, അവനുവേണ്ടി കഷ്ടം അനുഭവിക്കാനും നിങ്ങൾക്കു കൃപയായി നൽകപ്പെട്ടിരിക്കുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ പ്രസ്താവനയ്ക്കുള്ള കാരണമോ വിശദീകരണമോ ഇതു പരിചയപ്പെടുത്തുന്നു.
- source_word: ἐχαρίσθη
  choice: കൃപയായി നൽകപ്പെട്ടിരിക്കുന്നു
  rationale: വെറും അനുവാദമല്ല, സൗജന്യമായ കൃപാദാനം എന്ന χαρίζομαι എന്ന പദത്തിന്റെ ഭാവം നിലനിർത്തുന്നു; ഗ്രീക്കിലെ ദൈവിക കർത്താവിനെ വ്യക്തമാക്കാത്ത കർമണിപ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: τὸ ὑπὲρ Χριστοῦ
  choice: മശീഹായെപ്രതി
  rationale: തുടർന്നുവരുന്ന വിശ്വസിക്കലിനെയും കഷ്ടം അനുഭവിക്കലിനെയും മശീഹായുമായി ബന്ധപ്പെടുത്തുന്ന ശീർഷകസദൃശമായ ഗ്രീക്ക് ഘടന സംക്ഷിപ്തമായി നിലനിർത്തുന്നു. Χριστός ഇവിടെ സ്ഥാനപ്പേരായതിനാൽ ‘മശീഹാ’ എന്നു വിവർത്തനം ചെയ്തു.
- source_word: πιστεύειν εἰς αὐτόν
  choice: അവനിൽ വിശ്വസിക്കാൻ
  rationale: ഒരു വ്യക്തിയിൽ വിശ്വാസം അർപ്പിക്കുക എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപമാണിത്.
- source_word: πάσχειν
  choice: കഷ്ടം അനുഭവിക്കാനും
  rationale: πάσχειν എന്ന അനിശ്ചിതക്രിയയുടെ നേരിട്ടുള്ള അർഥം ലളിതമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὑπὲρ αὐτοῦ
  choice: അവനുവേണ്ടി
  rationale: മശീഹായുടെ നിമിത്തം അഥവാ അവനെപ്രതി കഷ്ടം അനുഭവിക്കുക എന്ന ബന്ധം സ്വാഭാവികമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: വിശ്വസിക്കലും കഷ്ടം അനുഭവിക്കലും കൃപയായി നൽകപ്പെട്ടവയാണെന്ന പ്രസ്താവന മൃദൂകരിക്കണമോ
  choice: രണ്ടും കൃപയായി നൽകപ്പെട്ടിരിക്കുന്നു എന്ന ഗ്രീക്ക് പ്രസ്താവന വ്യക്തമായി നിലനിർത്തി
  alternative: ‘അനുവദിക്കപ്പെട്ടിരിക്കുന്നു’ എന്നു ദുർബലമായി വിവർത്തനം ചെയ്യുകയോ ദൈവിക ദാനത്തിന്റെ ആശയം മറയ്ക്കുന്നവിധം വാക്യം പുനഃക്രമീകരിക്കുകയോ ചെയ്യുക
  rationale: ഗ്രീക്ക് വാക്യത്തിൽ വിശ്വസിക്കലും കഷ്ടം അനുഭവിക്കലും ἐχαρίσθη എന്ന ഏക ക്രിയയുടെ പരിധിയിലാണ്. അതിലുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷം വ്യാഖ്യാനിച്ചു നീക്കാതെ വിവർത്തനത്തിൽ സംരക്ഷിക്കണം.
translation_notes:
  register: സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന ആധുനിക നിലവാരമലയാളമാണ് ഉപയോഗിച്ചത്. ‘കൃപയായി നൽകപ്പെട്ടിരിക്കുന്നു’ എന്ന മാന്യവും നേരിട്ടുമായ പ്രയോഗം ദാനത്തിന്റെ ഭാവവും ഗ്രീക്കിലെ കർമണിരൂപവും നിലനിർത്തുന്നു. വാക്യത്തിന്റെ ഗൗരവം സംരക്ഷിച്ചെങ്കിലും പഴഞ്ചൻ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
