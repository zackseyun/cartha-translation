id: PHP.1.7
reference: Philippians 1:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καθώς ἐστιν δίκαιον ἐμοὶ τοῦτο φρονεῖν ὑπὲρ πάντων ὑμῶν, διὰ τὸ ἔχειν με ἐν τῇ καρδίᾳ ὑμᾶς, ἔν τε τοῖς δεσμοῖς μου καὶ ἐν τῇ ἀπολογίᾳ καὶ βεβαιώσει τοῦ εὐαγγελίου συγκοινωνούς μου τῆς χάριτος πάντας ὑμᾶς ὄντας·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/007.yaml
  text: For it is right for me to think this about all of you[a], because I have you in my heart, since both in my chains and in the defense and confirmation of the gospel[b], all of you are fellow partakers with me of grace.
translation:
  language: ml
  text: നിങ്ങളെ എല്ലാവരെയും കുറിച്ച് ഇങ്ങനെ ചിന്തിക്കുന്നത് എനിക്ക് ഉചിതമാണ്; കാരണം, ഞാൻ നിങ്ങളെ എന്റെ ഹൃദയത്തിൽ സൂക്ഷിക്കുന്നു; എന്റെ ബന്ധനങ്ങളിലും സുവിശേഷത്തിന്റെ പ്രതിരോധത്തിലും സ്ഥിരീകരണത്തിലും നിങ്ങൾ എല്ലാവരും എന്നോടൊപ്പം കൃപയിൽ പങ്കാളികളായിരിക്കുന്നതും അതിനാലാണ്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δίκαιον
  choice: ന്യായമാണ്
  rationale: ഇവിടെ പൗലൊസിന്റെ മനോഭാവം ഉചിതവും ന്യായീകരിക്കപ്പെട്ടതുമാണെന്ന ധാർമ്മിക ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: φρονεῖν
  choice: ചിന്തിക്കുന്നത്
  rationale: ചിന്തയും സ്ഥിരമായ മനോഭാവവും ഉൾക്കൊള്ളാവുന്ന വിധത്തിൽ മൂലപദത്തിന്റെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: ὑπὲρ πάντων ὑμῶν
  choice: നിങ്ങളെ എല്ലാവരെയുംകുറിച്ച്
  rationale: φρονεῖν എന്ന ക്രിയയോടൊപ്പം വ്യക്തികളെപ്പറ്റിയുള്ള പരിഗണനയാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്.
- source_word: διὰ τὸ ἔχειν με ἐν τῇ καρδίᾳ ὑμᾶς
  choice: ഞാൻ നിങ്ങളെ എന്റെ ഹൃദയത്തിൽ സൂക്ഷിക്കുന്നു
  rationale: ഗ്രീക്കിലെ ഇരട്ട ആക്കുസറ്റീവ് ഘടന അവ്യക്തമാണെങ്കിലും, സന്ദർഭത്തിലെ പൗലൊസിന്റെ സ്നേഹപ്രകടനവുമായി യോജിക്കുന്ന പരമ്പരാഗത വായന മുഖ്യപാഠത്തിൽ സ്വീകരിക്കുന്നു; മറുവായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: δεσμοῖς
  choice: ബന്ധനങ്ങളിലും
  rationale: തടവിനെ സൂചിപ്പിക്കുന്ന മൂലപദത്തിന്റെ ദൃശ്യമായ ചങ്ങല/ബന്ധന ഭാവം നിലനിർത്തുന്നു.
- source_word: ἀπολογίᾳ
  choice: പ്രതിവാദത്തിലും
  rationale: സുവിശേഷത്തിനുവേണ്ടിയുള്ള ഔപചാരികമോ പൊതുവായതോ ആയ പ്രതിരോധവാദത്തെ വ്യക്തമാക്കുന്നു.
- source_word: βεβαιώσει
  choice: സ്ഥിരീകരണത്തിലും
  rationale: സുവിശേഷത്തിന്റെ സത്യവും നിലയും ഉറപ്പിക്കുന്നതെന്ന അർഥം നൽകുന്നു; പ്രതിവാദം എന്നതിനോടുള്ള പദജോടിയും സംരക്ഷിക്കുന്നു.
- source_word: συγκοινωνούς
  choice: എന്നോടൊപ്പം ... പങ്കാളികളാണ്
  rationale: കൂട്ടായ പങ്കാളിത്തം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ആവർത്തനഭാരം ഒഴിവാക്കുന്നു.
- source_word: χάριτος
  choice: കൃപയിൽ
  rationale: പ്രധാന ദൈവശാസ്ത്രപദമായ χάρις എന്നതിന്റെ സാധാരണ മലയാളരൂപം നിലനിർത്തുകയും ദൈവകൃപയിലെ സംയുക്ത പങ്കാളിത്തം സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ഹൃദയത്തെക്കുറിച്ചുള്ള ഉപവാക്യത്തിലെ വാക്യഘടനാപരമായ അവ്യക്തത
  choice: ഞാൻ നിങ്ങളെ എന്റെ ഹൃദയത്തിൽ സൂക്ഷിക്കുന്നു
  alternative: നിങ്ങൾ എന്നെ നിങ്ങളുടെ ഹൃദയത്തിൽ സൂക്ഷിക്കുന്നു
  rationale: με, ὑμᾶς എന്നിവ രണ്ടും ആക്കുസറ്റീവായതിനാൽ കർത്താവും കർമവും രണ്ടു രീതിയിൽ ഗ്രഹിക്കാം. പൗലൊസിന്റെ സ്നേഹത്തെക്കുറിച്ചുള്ള സമീപസന്ദർഭം മുഖ്യവായനയെ പിന്തുണയ്ക്കുന്നു; എന്നാൽ യഥാർഥമായ മറുവായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘പ്രതിവാദം’, ‘സ്ഥിരീകരണം’, ‘കൃപ’ എന്നീ പദങ്ങൾ ആശയകൃത്യതയ്ക്കായി നിലനിർത്തി; വാക്യം വായനാസൗകര്യത്തിനായി രണ്ടായി വിഭജിച്ചു.
