id: PHP.1.19
reference: Philippians 1:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἶδα γὰρ ὅτι τοῦτό μοι ἀποβήσεται εἰς σωτηρίαν διὰ τῆς ὑμῶν δεήσεως καὶ ἐπιχορηγίας τοῦ πνεύματος Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/019.yaml
  text: For I know that this will turn out for my deliverance through your prayer and the provision of the Spirit of Jesus the Messiah[b][a],
translation:
  language: ml
  text: എന്തെന്നാൽ, നിങ്ങളുടെ പ്രാർത്ഥനയിലൂടെയും മശീഹയായ യേശുവിന്റെ ആത്മാവിന്റെ[b] സഹായത്തിലൂടെയും ഇത് എനിക്കു വിടുതലായി[a] തീരുമെന്ന് എനിക്കറിയാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “രക്ഷ” അല്ലെങ്കിൽ “നീതി തെളിയിക്കൽ.”
    reason: alternative_reading
  - marker: b
    text: 'ഗ്രീക്കിൽ പദശഃ: “യേശു ക്രിസ്തുവിന്റെ ആത്മാവ്.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: എനിക്കറിയാം
  rationale: രൂപത്തിൽ perfect ആയ οἶδα ഇവിടെ വർത്തമാനകാല അർഥത്തിലാണ്; പൗലോസിന്റെ ഉറപ്പ് സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: τοῦτό
  choice: ഇത്
  rationale: ഏകവചന സൂചകസർവനാമം പൗലോസിന്റെ ഇപ്പോഴത്തെ സാഹചര്യത്തെ മൊത്തമായി പിന്നോട്ടു ചൂണ്ടുന്നു; അതിനെ അനാവശ്യമായി വിശദീകരിക്കുന്നില്ല.
- source_word: ἀποβήσεται
  choice: കലാശിക്കും
  rationale: ഒരു സാഹചര്യത്തിന്റെ അന്തിമഫലത്തെ സൂചിപ്പിക്കുന്ന ക്രിയയ്ക്ക് സ്വാഭാവികമായ ആധുനിക മലയാള പ്രയോഗം.
- source_word: σωτηρίαν
  choice: വിടുതൽ
  rationale: തടവിന്റെ തൽസന്ദർഭത്തിൽ മോചനം അല്ലെങ്കിൽ അനുകൂലമായ തീർപ്പ് എന്ന ആശയം മുൻനിൽക്കുന്നു; അതേസമയം പദത്തിന്റെ വിശാലമായ രക്ഷാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: δεήσεως
  choice: പ്രാർഥന
  rationale: അപേക്ഷയോടുകൂടിയ പ്രാർഥന എന്ന അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἐπιχορηγίας
  choice: സഹായം
  rationale: നൽകപ്പെടുന്ന പിന്തുണയെയോ സമൃദ്ധമായ സഹായത്തെയോ സൂചിപ്പിക്കുന്നു; ‘വിതരണം’ എന്ന യാന്ത്രിക പദത്തേക്കാൾ സന്ദർഭത്തിൽ സ്വാഭാവികം.
- source_word: πνεύματος Ἰησοῦ Χριστοῦ
  choice: മശീഹയായ യേശുവിന്റെ ആത്മാവ്
  rationale: ജനിറ്റീവ് ബന്ധം നേരിട്ട് നിലനിർത്തുകയും Χριστός എന്ന പദത്തെ പദവിയായ ‘മശീഹ’ എന്നു വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: തടവിന്റെ സന്ദർഭത്തിലെ σωτηρίαν എന്ന പദത്തിന്റെ അർഥം
  choice: വിടുതൽ
  alternative: രക്ഷ; നീതി തെളിയിക്കൽ
  rationale: ഉടൻ വരുന്ന സന്ദർഭം പൗലോസിന്റെ ബന്ധനങ്ങളെയും അവയുടെ പ്രതീക്ഷിത ഫലത്തെയും കുറിച്ചാണ്. അതിനാൽ ‘വിടുതൽ’ മുഖ്യപാഠത്തിൽ യോജിക്കുന്നു; എന്നാൽ പദത്തിന്റെ രക്ഷാപരവും ന്യായവിധിപരവുമായ വ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: ἐπιχορηγίας τοῦ πνεύματος എന്ന ജനിറ്റീവ് ബന്ധം
  choice: ആത്മാവിന്റെ സഹായം
  alternative: ആത്മാവിനെ നൽകൽ; ആത്മാവ് നൽകുന്ന സഹായം
  rationale: ഗ്രീക്ക് പ്രയോഗം ആത്മാവുതന്നെ നൽകപ്പെടുന്നതാണോ ആത്മാവ് സഹായം നൽകുന്നതാണോ എന്ന് പൂർണമായി നിർണയിക്കുന്നില്ല. മലയാളത്തിലെ ജനിറ്റീവ് ഘടന ഈ തുറന്ന നില പരമാവധി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വാക്യഘടനയാണ് ഉപയോഗിച്ചത്. കാരണം സൂചിപ്പിക്കുന്ന ‘എന്തെന്നാൽ’ നിലനിർത്തി; ദൈർഘ്യമേറിയ ഗ്രീക്ക് വാക്യം മലയാളത്തിൽ വായിക്കാൻ സ്വാഭാവികമാകുന്ന വിധത്തിൽ ക്രമപ്പെടുത്തി. ‘ക്രിസ്തു’ എന്ന പരമ്പരാഗത ലിപ്യന്തരണത്തിനു പകരം Χριστός എന്ന പദവിയുടെ അർഥം വ്യക്തമാക്കാൻ ‘മശീഹ’ മുഖ്യപാഠത്തിൽ ഉപയോഗിച്ചു.
