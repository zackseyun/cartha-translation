id: PHP.1.8
reference: Philippians 1:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μάρτυς γάρ ⸀μου ὁ θεός, ὡς ἐπιποθῶ πάντας ὑμᾶς ἐν σπλάγχνοις ⸂Χριστοῦ Ἰησοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/008.yaml
  text: For God is my witness[b][a], how I long for all of you with the affections of Messiah Jesus.
translation:
  language: ml
  text: കാരണം, മശീഹ യേശുവിന്റെ[a] ആർദ്രവാത്സല്യത്തോടെ[b] നിങ്ങളെ എല്ലാവരെയും ഞാൻ എത്രമാത്രം കൊതിക്കുന്നു എന്നതിന് ദൈവം എന്റെ സാക്ഷിയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ക്രിസ്തുയേശുവിന്റെ.”'
    reason: alternative_reading
  - marker: b
    text: 'അഥവാ: “കരുണയോടെ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μάρτυς
  choice: സാക്ഷി
  rationale: ‘ദൈവം എന്റെ സാക്ഷിയാണ്’ എന്നത് പൗലോസിന്റെ ആത്മാർഥത ഉറപ്പിക്കുന്ന ഗൗരവമുള്ള അഭ്യർഥനയെ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: γάρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ പ്രസ്താവനയ്ക്ക് ഈ വാക്യം നൽകുന്ന വിശദീകരണബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: ὡς
  choice: എത്രമാത്രം
  rationale: പൗലോസിന്റെ അഭിലാഷത്തിന്റെ ഉള്ളടക്കത്തോടൊപ്പം അതിന്റെ തീവ്രതയും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐπιποθῶ
  choice: കാണാൻ കൊതിക്കുന്നു
  rationale: സന്ദർഭത്തിൽ വ്യക്തികളോടുള്ള ആഴമായ സാന്നിധ്യാഭിലാഷമാണ് ഉദ്ദേശിക്കുന്നത്; ‘കാണാൻ കൊതിക്കുന്നു’ സാധാരണ മലയാളത്തിൽ അതിനെ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: πάντας ὑμᾶς
  choice: നിങ്ങളെ എല്ലാവരെയും
  rationale: πάντας എന്ന പദത്തിന്റെ സമഗ്രമായ ഊന്നൽ നഷ്ടപ്പെടാതെ നിലനിർത്തുന്നു.
- source_word: σπλάγχνοις
  choice: ആർദ്രവാത്സല്യത്തോടെ
  rationale: ആന്തരികാവയവങ്ങളെ ആഴമായ വികാരങ്ങളുടെ ഇരിപ്പിടമായി കാണുന്ന ഗ്രീക്ക് രൂപകത്തെ പദാനുപദമായി മാറ്റാതെ, അതിന്റെ സ്നേഹനിർഭരമായ വികാരഗാംഭീര്യം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: Χριστοῦ Ἰησοῦ
  choice: മശീഹയായ യേശുവിന്റെ
  rationale: Χριστός എന്ന പദത്തിന്റെ അഭിഷിക്തനായ രക്ഷകൻ എന്ന പദവിസൂചന വ്യക്തമാക്കുകയും, യേശു എന്ന പേര് സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ Χριστοῦ Ἰησοῦ എന്ന പദവി-നാമ ഘടനയുടെ പരിഭാഷ
  choice: മശീഹയായ യേശുവിന്റെ
  alternative: ക്രിസ്തുയേശുവിന്റെ
  rationale: Χριστός എന്നതിലെ പദവിയർഥം സജീവമായി നിലനിർത്തുന്നതിനായി ‘മശീഹ’ ഉപയോഗിച്ചു; സഭാപാരമ്പര്യത്തിൽ പരിചിതമായ ‘ക്രിസ്തുയേശു’ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- issue: ἐν σπλάγχνοις Χριστοῦ Ἰησοῦ എന്ന പ്രയോഗത്തിലെ വികാരത്തിന്റെ സ്വഭാവം
  choice: മശീഹയായ യേശുവിന്റെ ആർദ്രവാത്സല്യത്തോടെ
  alternative: മശീഹയായ യേശുവിന്റെ കരുണയോടെ
  rationale: σπλάγχνα ആഴമായ വാത്സല്യത്തെയും കരുണയെയും സൂചിപ്പിക്കാം. സന്ദർഭത്തിലെ സ്നേഹപൂർവമായ കൊതിക്ക് ‘ആർദ്രവാത്സല്യം’ യോജിക്കുന്നു; ‘കരുണ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ ഗൗരവമുള്ള സാക്ഷ്യപ്രയോഗവും വികാരതീവ്രതയും സംരക്ഷിച്ചു; ശരീരാവയവത്തിന്റെ പദാനുപദ പരിഭാഷ ഒഴിവാക്കി സ്വാഭാവികമായ വികാരപ്രയോഗം തെരഞ്ഞെടുത്തു.
