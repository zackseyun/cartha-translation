source:
  edition: SBLGNT
  text: ὥστε τοὺς δεσμούς μου φανεροὺς ἐν Χριστῷ γενέσθαι ἐν ὅλῳ τῷ πραιτωρίῳ καὶ τοῖς λοιποῖς πᾶσιν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/013.yaml
  text: so that my chains in Messiah have become known throughout the whole imperial guard and to all the rest[b][a],
translation:
  language: ml
  text: അങ്ങനെ, മശീഹായിലുള്ള എന്റെ ചങ്ങലകൾ ചക്രവർത്തിയുടെ മുഴുവൻ കാവൽസേനയ്ക്കും മറ്റെല്ലാവർക്കും വ്യക്തമായി അറിയപ്പെട്ടു[a][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മശീഹാ നിമിത്തമുള്ള എന്റെ ചങ്ങലകൾ.”
    reason: alternative_reading
  - marker: b
    text: അഥവാ, “മുഴുവൻ പ്രൈറ്റോറിയത്തിലും”; ഈ പദം ചക്രവർത്തിയുടെ കാവൽസേനയെയോ ചക്രവർത്തിയുടെ ആസ്ഥാനത്തെയോ വസതിയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: അങ്ങനെ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞതിന്റെ ഫലം അവതരിപ്പിക്കുന്ന അനുബന്ധബലം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: τοὺς δεσμούς μου
  choice: എന്റെ ചങ്ങലകളെക്കുറിച്ച്
  rationale: δεσμοί എന്നതിലെ മൂർത്തമായ ‘ചങ്ങലകൾ’ എന്ന രൂപകം നിലനിർത്തുന്നു; അതേസമയം അറിവിന്റെ വിഷയമായി മലയാളവാക്യത്തിൽ സ്വാഭാവികമായി ചേരുന്നു.
- source_word: φανεροὺς ... γενέσθαι
  choice: വ്യക്തമായി അറിയാനിടയായി
  rationale: കാര്യത്തിന്റെ യഥാർഥ സ്വഭാവം പരസ്യമായി അറിയപ്പെട്ടുവെന്ന ഫലാർഥം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐν Χριστῷ
  choice: മശീഹായിലുള്ള
  rationale: ഗ്രീക്കിലെ ἐν എന്നതിന്റെ ഉദ്ദേശ്യപൂർവമായ വ്യാപ്തിയും ക്രിസ്തുവുമായുള്ള ബന്ധവും മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; കാരണം സൂചിപ്പിക്കുന്ന വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: Χριστῷ
  choice: മശീഹാ
  rationale: Χριστός ഒരു അഭിഷിക്തപദവിയാണെന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: ἐν ὅλῳ τῷ πραιτωρίῳ
  choice: ചക്രവർത്തിയുടെ മുഴുവൻ കാവൽസേനയിലും
  rationale: ഈ സന്ദർഭത്തിൽ സാധ്യതയേറിയ വ്യക്തിസമൂഹാർഥം വ്യക്തവും ആധുനികവുമായ മലയാളത്തിൽ നൽകുന്നു; സ്ഥലമോ ആസ്ഥാനമോ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: τοῖς λοιποῖς πᾶσιν
  choice: മറ്റെല്ലാവർക്കും
  rationale: പ്രൈറ്റോറിയത്തിനു പുറത്തുള്ള ശേഷിച്ച എല്ലാവരെയും ഉൾക്കൊള്ളുന്ന വ്യാപ്തി അടുത്തായി പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ ചങ്ങലകളോടുള്ള ἐν Χριστῷ എന്ന പ്രയോഗത്തിന്റെ ബന്ധം
  choice: മശീഹായിലുള്ള എന്റെ ചങ്ങലകൾ
  alternative: മശീഹാ നിമിത്തമുള്ള എന്റെ ചങ്ങലകൾ
  rationale: മുഖ്യപാഠം ഗ്രീക്കിലെ ‘മശീഹായിൽ’ എന്ന ബന്ധത്തിന്റെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തി തുറന്നുവെക്കുന്നു; തടവിന്റെ കാരണം മശീഹയോടുള്ള വിശ്വസ്തതയാണെന്ന സാദ്ധ്യവായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: πραιτώριον വ്യക്തികളെയോ സ്ഥലത്തെയോ സൂചിപ്പിക്കുന്നുവോ
  choice: ചക്രവർത്തിയുടെ മുഴുവൻ കാവൽസേന
  alternative: മുഴുവൻ പ്രൈറ്റോറിയം, അഥവാ ചക്രവർത്തിയുടെ ആസ്ഥാനം/വസതി
  rationale: ഫിലിപ്പിയിലെ സന്ദർഭത്തിൽ കാവൽസേന എന്നത് സാധ്യതയേറിയ വായനയാണ്; എന്നാൽ പദത്തിന്റെ സ്ഥലസൂചകമായ അർഥം ഉറപ്പായി തള്ളാനാകാത്തതിനാൽ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ചങ്ങലകൾ’ എന്ന മൂലരൂപകം നിലനിർത്തി; സാങ്കേതികമായ ‘പ്രൈറ്റോറിയം’ മുഖ്യപാഠത്തിൽ ഒഴിവാക്കി അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു. വാക്യാവസാനത്തിലെ കോമ അടുത്ത വാക്യത്തിലേക്കുള്ള ഗ്രീക്ക് വാക്യഘടനയോട് പൊരുത്തപ്പെടുന്നു.
