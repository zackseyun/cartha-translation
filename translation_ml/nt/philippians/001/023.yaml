id: PHP.1.23
reference: Philippians 1:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: συνέχομαι δὲ ἐκ τῶν δύο, τὴν ἐπιθυμίαν ἔχων εἰς τὸ ἀναλῦσαι καὶ σὺν Χριστῷ εἶναι, πολλῷ ⸀γὰρ μᾶλλον κρεῖσσον,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/023.yaml
  text: But I am hard pressed between the two[a], having the desire to depart and be with Messiah[b], for that is far better.
translation:
  language: ml
  text: എന്നാൽ, ഈ രണ്ടിനാൽ ഞാൻ വല്ലാതെ സമ്മർദത്തിലാണു. വിട്ടുപോകാനും[a] മശീഹയോടുകൂടെ ആയിരിക്കാനുമുള്ള ആഗ്രഹം എനിക്കുണ്ട്; കാരണം, അത് എത്രയോ മെച്ചമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വിട്ടുപോകുക’ എന്നത് ഇവിടെ മരണത്തെ സൂചിപ്പിക്കുന്ന സൗമ്യപ്രയോഗമായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέχομαι
  choice: ഞാൻ ഞെരുക്കത്തിലാണ്
  rationale: രണ്ടു സാധ്യതകളാൽ അമർത്തപ്പെടുകയും അവയ്ക്കിടയിൽ സംഘർഷത്തിലാകുകയും ചെയ്യുന്ന അവസ്ഥയെ സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു; ക്രിയയുടെ നിഷ്ക്രിയഭാവവും നിലനിർത്തുന്നു.
- source_word: ἐκ τῶν δύο
  choice: ഈ രണ്ടിനുമിടയിൽ
  rationale: ഗ്രീക്കിലെ അക്ഷരാർഥമായ ‘ഈ രണ്ടിൽനിന്ന്’ എന്നതിനുപകരം, സന്ദർഭത്തിലെ രണ്ടു ബദലുകൾക്കിടയിലെ സമ്മർദം വ്യക്തമാക്കുന്ന മലയാളപ്രയോഗം.
- source_word: τὴν ἐπιθυμίαν ἔχων
  choice: ആണ് എന്റെ ആഗ്രഹം
  rationale: ἐπιθυμία എന്ന നാമത്തിന്റെ വ്യക്തമായ ‘ആഗ്രഹം’ എന്ന ആശയം നിലനിർത്തിക്കൊണ്ട് പങ്കാളിക്രിയയുടെ ബന്ധം സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἀναλῦσαι
  choice: വിട്ടുപോകാൻ
  rationale: മരണത്തെ നേരിട്ട് പ്രസ്താവിക്കാതെ ‘പുറപ്പെടുക/വിട്ടുപോകുക’ എന്ന ഗ്രീക്ക് രൂപകാത്മക ഭാഷ നിലനിർത്തുന്നു.
- source_word: Χριστῷ
  choice: മശീഹയോടുകൂടെ
  rationale: Χριστός ഇവിടെ അഭിഷിക്തനായവൻ എന്ന പദവിയായി ഗ്രഹിക്കാവുന്നതിനാൽ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി; ‘യോടുകൂടെ’ σύν എന്ന ബന്ധത്തെ വ്യക്തമാക്കുന്നു.
- source_word: πολλῷ γὰρ μᾶλλον κρεῖσσον
  choice: കാരണം, അതാണ് ഏറെ ശ്രേഷ്ഠം
  rationale: γάρ-ന്റെ വിശദീകരണബന്ധവും πολλῷ ... μᾶλλον എന്ന ശക്തമായ താരതമ്യവും വായനാസൗകര്യമുള്ള ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: മരണാനന്തരമായി മശീഹയോടുകൂടെ ഇരിക്കുന്നതിന്റെ സൂചന
  choice: വിട്ടുപോകാനും മശീഹയോടുകൂടെ ആയിരിക്കാനും
  alternative: മരിച്ച് ഉടൻ സ്വർഗത്തിൽ മശീഹയോടുകൂടെ ആയിരിക്കാൻ
  rationale: വിട്ടുപോകലും മശീഹയോടുകൂടെ ആയിരിക്കലും എന്ന ഗ്രീക്ക് വാചകത്തിന്റെ പ്രസ്താവന മാത്രം പരിഭാഷയിൽ നിലനിർത്തുന്നു; സമയക്രമമോ ‘സ്വർഗം’ എന്ന ആശയമോ കൂട്ടിച്ചേർത്ത് പ്രത്യേക സിദ്ധാന്തനിഗമനം നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഞെരുക്കത്തിലാണ്’ രണ്ടു ബദലുകൾക്കിടയിലെ സമ്മർദം അറിയിക്കുന്നു; ‘വിട്ടുപോകുക’ മൂലഭാഷയിലെ പരോക്ഷതയും ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും സംരക്ഷിക്കുന്നു.
