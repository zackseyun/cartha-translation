id: PHP.3.9
reference: Philippians 3:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εὑρεθῶ ἐν αὐτῷ, μὴ ἔχων ἐμὴν δικαιοσύνην τὴν ἐκ νόμου ἀλλὰ τὴν διὰ πίστεως Χριστοῦ, τὴν ἐκ θεοῦ δικαιοσύνην ἐπὶ τῇ πίστει,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/009.yaml
  text: and be found in him[a], not having my own righteousness from the law[b], but that which is through faith in Messiah—the righteousness from God based on faith.
translation:
  language: ml
  text: അവനിൽ ഞാൻ കാണപ്പെടണം—നിയമത്തിൽനിന്നുള്ള എന്റെ സ്വന്തനീതിയോടെയല്ല, മറിച്ച് മശീഹായിലുള്ള വിശ്വാസത്തിലൂടെ ലഭിക്കുന്നതും വിശ്വാസത്തെ അടിസ്ഥാനമാക്കിയുള്ളതുമായ ദൈവത്തിൽനിന്നുള്ള നീതിയോടെ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മശീഹായുടെ വിശ്വസ്തതയിലൂടെ.”
    reason: πίστεως Χριστοῦ എന്ന ഘടനയെ മശീഹായിലുള്ള വിശ്വാസം എന്നോ മശീഹായുടെ വിശ്വസ്തത എന്നോ വായിക്കാം.
  - marker: b
    text: ഈ വാക്യത്തിലെ രണ്ടിടത്തും “ന്യായം” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: δικαιοσύνη എന്ന പദത്തിന്റെ ധാർമിക-ന്യായപരമായ അർഥവ്യാപ്തി സൂചിപ്പിക്കുന്ന പദപരമായ പര്യായം.
lexical_decisions:
- source_word: εὑρεθῶ
  choice: ഞാൻ കാണപ്പെടുകയും വേണം
  rationale: ഒന്നാംപുരുഷ കർത്താവിനെയും പാസീവ് ഭാവത്തെയും വ്യക്തമാക്കുന്നു; സന്ദർഭത്തിലെ ലക്ഷ്യ/ആഗ്രഹ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ ‘വേണം’ എന്നു പ്രകടമാക്കുന്നു.
- source_word: ἐν αὐτῷ
  choice: അവനിൽ
  rationale: പൗലോസിന്റെ വിശാലമായ ‘അവനിൽ’ എന്ന ഐക്യഭാഷയെ വിശദീകരിച്ച് ചുരുക്കാതെ അതേ രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: μὴ ἔχων
  choice: എനിക്കുണ്ടായിട്ടല്ല
  rationale: പങ്കാളിക്രിയ സൂചിപ്പിക്കുന്ന അവസ്ഥയെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; സ്വന്തം നീതിയും ദൈവത്തിൽനിന്നുള്ള നീതിയും തമ്മിലുള്ള വിരോധം നിലനിർത്തുന്നു.
- source_word: δικαιοσύνην
  choice: നീതി
  rationale: δικαιοσύνηയുടെ ധാർമികവും ബന്ധപരവും ന്യായപരവുമായ അർഥവ്യാപ്തി ഉൾക്കൊള്ളുന്ന സാധാരണവും ഗൗരവമുള്ളതുമായ മലയാളപദം; ‘നീതിമത്തത’ എന്ന പര്യായം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: τὴν ἐκ νόμου
  choice: നിയമത്തിൽനിന്നുള്ള
  rationale: ἐκ സൂചിപ്പിക്കുന്ന ഉറവിടം നേരിട്ട് പ്രകടമാക്കുന്നു; ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത ‘മോശെയുടെ’ എന്ന വിശദീകരണം ചേർക്കുന്നില്ല.
- source_word: διὰ πίστεως Χριστοῦ
  choice: മശീഹായിലുള്ള വിശ്വാസത്തിലൂടെ
  rationale: വിവാദമുള്ള പίστις Χριστοῦ ഘടനയ്ക്ക് objective-genitive വായന മുഖ്യപാഠത്തിൽ സ്വീകരിക്കുന്നു; subjective-genitive വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: Χριστοῦ
  choice: മശീഹാ
  rationale: Χριστός എന്ന പദത്തിന്റെ സ്ഥാനനാമസ്വഭാവം ഇവിടെ നിലനിർത്തുന്നു; വെറും പേരുപോലെ ചുരുക്കുന്നില്ല.
- source_word: τὴν ἐκ θεοῦ δικαιοσύνην
  choice: ദൈവത്തിൽനിന്നുള്ള നീതി
  rationale: ആ നീതിയുടെ ഉറവിടം ദൈവമാണെന്ന ഊന്നൽ ഗ്രീക്കിന്റെ സംക്ഷിപ്ത ഘടനയ്ക്കടുത്തായി നിലനിർത്തുന്നു.
- source_word: ἐπὶ τῇ πίστει
  choice: വിശ്വാസത്തെ അടിസ്ഥാനമാക്കിയുള്ള
  rationale: ἐπί + dative സൂചിപ്പിക്കുന്ന അടിസ്ഥാനം വ്യക്തവും ആധുനികവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: πίστεως Χριστοῦ എന്നതിന്റെ അർഥം
  choice: മശീഹായിലുള്ള വിശ്വാസം
  alternative: മശീഹായുടെ വിശ്വസ്തത
  rationale: ജനിറ്റീവ് ഘടന യഥാർഥത്തിൽ ദ്വയാർഥമുള്ളതാണ്. മുഖ്യപാഠത്തിൽ objective-genitive വായന സ്വീകരിച്ചെങ്കിലും subjective-genitive സാധ്യത അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
- issue: δικαιοσύνη എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: നീതി
  alternative: നീതിമത്തത
  rationale: ‘നീതി’ പദം ധാർമിക ശരിത്വവും ന്യായപരമായ അർഥവും ഒരുപോലെ വഹിക്കാൻ കഴിയും. കൂടുതൽ വ്യക്തിഗത ഗുണഭാവം സൂചിപ്പിക്കുന്ന ‘നീതിമത്തത’ എന്ന പര്യായം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ വിരോധഘടന വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു. വാക്യം ഒറ്റയ്ക്ക് വായിക്കാവുന്നതാക്കാൻ ‘വേണം/ഉണ്ടായിരിക്കണം’ ഉപയോഗിച്ചെങ്കിലും പൗലോസിന്റെ ലക്ഷ്യഭാവം സംരക്ഷിച്ചിട്ടുണ്ട്; വിവാദമുള്ള പίστις Χριστοῦ ഘടന അടിക്കുറിപ്പിലൂടെ തുറന്നുവെച്ചിരിക്കുന്നു.
