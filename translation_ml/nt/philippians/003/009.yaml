  to: അവനിൽ ഞാൻ കാണപ്പെടണം—നിയമത്തിൽനിന്നുള്ള എന്റെ സ്വന്തനീതിയോടെയല്ല, മറിച്ച് മശീഹായിലുള്ള വിശ്വാസത്തിലൂടെ ലഭിക്കുന്നതും വിശ്വാസത്തെ അടിസ്ഥാനമാക്കിയുള്ളതുമായ ദൈവത്തിൽനിന്നുള്ള നീതിയോടെ.[a][b]
