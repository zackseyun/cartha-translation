  text: if somehow I may attain to the resurrection from the dead[a].
translation:
  language: ml
  text: എങ്ങനെയെങ്കിലും ഞാൻ മരിച്ചവരുടെ ഇടയിൽനിന്നുള്ള പുനരുത്ഥാനത്തിൽ എത്തിച്ചേരാനാകുമെങ്കിൽ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ഇവിടെ ‘പുനരുത്ഥാനം’ എന്നതിന് അസാധാരണമായ, ‘പുറത്തേക്കുള്ള പുനരുത്ഥാനം’ എന്നർഥസൂചനയുള്ള പദമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ πως
  choice: എങ്ങനെയെങ്കിലും
  rationale: ലക്ഷ്യത്തിലെത്തുന്ന വിധത്തെക്കുറിച്ചുള്ള വിനയപൂർവമായ അനിശ്ചിതത്വം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ദൈവത്തിന്റെ വാഗ്ദാനത്തെക്കുറിച്ചുള്ള സംശയമായി അതിനെ മാറ്റുന്നില്ല.
- source_word: καταντήσω
  choice: ഞാൻ എത്തിച്ചേരേണ്ടതിന്
  rationale: ഒരു ലക്ഷ്യസ്ഥാനത്ത് എത്തുക എന്ന ക്രിയയുടെ രൂപകാത്മക അർഥം നൽകുന്നു. സന്ദർഭത്തിലെ ലക്ഷ്യാഭിമുഖമായ ആശയം ‘നേടുക’ എന്നതിനെക്കാൾ വ്യക്തമായി സൂക്ഷിക്കുന്നു.
- source_word: εἰς
  choice: -ത്തിൽ … എത്തിച്ചേരുക
  rationale: ഗ്രീക്കിലെ ലക്ഷ്യത്തിലേക്കുള്ള ചലനം മലയാളത്തിലെ ‘എത്തിച്ചേരുക’ എന്ന ക്രിയയോടു ചേർന്ന സ്വാഭാവിക അധികരണപ്രയോഗത്തിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: ἐξανάστασιν
  choice: പുനരുത്ഥാനം
  rationale: അപൂർവമായ ഈ നാമത്തിന്റെ അടിസ്ഥാന അർഥം വ്യക്തവും സഭാവിഭാഗനിരപേക്ഷവുമായി നൽകുന്നു; ‘പുറത്തേക്കുള്ള പുനരുത്ഥാനം’ പോലുള്ള അസ്വാഭാവിക പദസൃഷ്ടി മുഖ്യവാചകത്തിൽ ഒഴിവാക്കുന്നു.
- source_word: τὴν ἐκ νεκρῶν
  choice: മരിച്ചവരുടെ ഇടയിൽനിന്നുള്ള
  rationale: ἐκ എന്നതിന്റെ ‘ഇടയിൽനിന്ന് പുറത്തേക്ക്’ എന്ന സൂചന സാധാരണ ‘മരിച്ചവരിൽനിന്നുള്ള’ എന്നതിനെക്കാൾ തുറന്നുവെക്കുന്നു, എന്നാൽ മലയാളത്തിൽ വായനാസൗകര്യം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἐξανάστασις എന്ന അപൂർവപദം സാധാരണ ἀνάστασις-ൽനിന്ന് കർശനമായി വേർതിരിച്ച് ഒരു പ്രത്യേക പുനരുത്ഥാനത്തെ സൂചിപ്പിക്കുന്നവിധം പരിഭാഷപ്പെടുത്തണമോ എന്നത്.
  choice: മുഖ്യവാചകത്തിൽ ‘മരിച്ചവരുടെ ഇടയിൽനിന്നുള്ള പുനരുത്ഥാനം’ എന്നു നൽകുന്നു.
  alternative: ‘മരിച്ചവരുടെ ഇടയിൽനിന്നു പുറത്തേക്കുള്ള പുനരുത്ഥാനം’ എന്നു അത്യന്തം അക്ഷരാർഥത്തിൽ നൽകുക.
  rationale: വാക്യം മരിച്ചവരുടെ ഇടയിൽനിന്നുള്ള പുനരുത്ഥാനത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു. എന്നാൽ അപൂർവമായ ἐξανάστασις മാത്രം അടിസ്ഥാനമാക്കി പ്രത്യേക പുനരുത്ഥാനക്രമം ഉറപ്പിക്കുന്നത് അതിവ്യാഖ്യാനമാകും. അസാധാരണമായ പദരൂപത്തിന്റെ സാധ്യതയുള്ള ഊന്നൽ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: εἴ πως പൗലൊസിന് പുനരുത്ഥാനത്തെക്കുറിച്ച് സംശയമുണ്ടായിരുന്നുവെന്ന് വ്യക്തമാക്കുന്നുണ്ടോ എന്നത്.
  choice: ‘എങ്ങനെയെങ്കിലും’ എന്നു നൽകി വിധത്തെക്കുറിച്ചുള്ള അനിശ്ചിതത്വം തുറന്നുവെക്കുന്നു.
  alternative: ‘എന്തുവിലകൊടുത്തും’ എന്നു നൽകി ദൃഢനിശ്ചയം ഊന്നുക, അല്ലെങ്കിൽ സംശയം സൂചിപ്പിക്കുന്ന കൂടുതൽ ശക്തമായ ഭാഷ ഉപയോഗിക്കുക.
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സോപാധികവും വിനയപൂർവവുമായ സ്വരം സംരക്ഷിക്കണം; അത് സംശയമോ ഉറച്ച സിദ്ധാന്തപ്രഖ്യാപനമോ ആയി പരിഹരിക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. മുൻവാക്യവുമായി ബന്ധപ്പെടുന്ന ലക്ഷ്യസൂചക ഘടന നിലനിർത്താൻ ‘എത്തിച്ചേരേണ്ടതിന്’ ഉപയോഗിച്ചു. ‘ഉയിർത്തെഴുന്നേൽപ്പ്’ എന്നതിനെക്കാൾ ഗ്രീക്ക് നാമത്തിന്റെ ദൈവശാസ്ത്രപരമായ പ്രയോഗവുമായി പരിചിതവും കൃത്യവുമായ ‘പുനരുത്ഥാനം’ തിരഞ്ഞെടുത്തു.
