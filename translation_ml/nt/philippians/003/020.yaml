id: PHP.3.20
reference: Philippians 3:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἡμῶν γὰρ τὸ πολίτευμα ἐν οὐρανοῖς ὑπάρχει, ἐξ οὗ καὶ σωτῆρα ἀπεκδεχόμεθα κύριον Ἰησοῦν Χριστόν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/020.yaml
  text: For our citizenship is in heaven[a], from where we also eagerly await a Savior[d][c][b], the Lord Jesus the Messiah.
translation:
  language: ml
  text: കാരണം, നമ്മുടെ പൗരത്വം[a] സ്വർഗത്തിലാണ്[b]; അവിടെനിന്ന് രക്ഷകനായ കർത്താവായ യേശു മശിഹാവിനെ[c] നാം ആകാംക്ഷയോടെ കാത്തിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പൗരസമൂഹം” അഥവാ “രാഷ്ട്രസമൂഹം.”
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “സ്വർഗങ്ങളിൽ.”
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “കർത്താവായ യേശു ക്രിസ്തുവിനെ.”
    reason: alternative_reading
lexical_decisions:
- source_word: πολίτευμα
  choice: പൗരത്വം
  rationale: ഈ പദത്തിന്റെ പൗര-രാഷ്ട്രീയ അർഥവ്യാപ്തി വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ വിശ്വാസികളുടെ യഥാർഥ പൗരബന്ധത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἐν οὐρανοῖς
  choice: സ്വർഗത്തിൽ
  rationale: ഗ്രീക്കിൽ ബഹുവചനമാണെങ്കിലും, ആ ദൈവിക മണ്ഡലത്തെ സൂചിപ്പിക്കാൻ മലയാളത്തിൽ ഏകവചനമായ ‘സ്വർഗത്തിൽ’ ആണ് സ്വാഭാവികം; ബഹുവചനരൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: ὑπάρχει
  choice: ആണ്
  rationale: വർത്തമാനകാല യാഥാർഥ്യത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി ഉറപ്പിക്കുന്ന രൂപം.
- source_word: ἐξ οὗ
  choice: അവിടെനിന്ന്
  rationale: മുൻപറഞ്ഞ സ്വർഗത്തെ സ്ഥലപരമായി തിരികെ സൂചിപ്പിക്കുകയും അവിടെനിന്നുള്ള രക്ഷകന്റെ വരവിനെ ആശയപരമായി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: σωτῆρα
  choice: രക്ഷകൻ
  rationale: പദത്തിന്റെ സാധാരണ രക്ഷാശാസ്ത്രപരമായ അർഥവും ക്രിസ്തുവിനെക്കുറിച്ചുള്ള പ്രയോഗത്തിന്റെ ഭാരവും സംരക്ഷിക്കുന്നു.
- source_word: ἀπεκδεχόμεθα
  choice: ആകാംക്ഷയോടെ കാത്തിരിക്കുന്നു
  rationale: പ്രതീക്ഷയോടെയുള്ള തുടർച്ചയായ കാത്തിരിപ്പിനെ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: κύριον
  choice: കർത്താവ്
  rationale: പുതിയനിയമത്തിലെ ക്രിസ്തുവിനെക്കുറിച്ചുള്ള ഈ ബഹുമാനപദത്തിന് പ്രചാരമുള്ളതും യോജിച്ചതുമായ മലയാളരൂപം.
- source_word: Χριστόν
  choice: മശിഹാ
  rationale: ഇവിടെ വ്യക്തിനാമത്തിനു പിന്നാലെയാണെങ്കിലും പ്രതീക്ഷിക്കപ്പെടുന്ന അന്തിമകാല രക്ഷകനെ വിശേഷിപ്പിക്കുന്ന പദവിയുടെ അർഥം സജീവമാണ്; അതിനാൽ അർഥം പരിഭാഷപ്പെടുത്തുന്നു.
theological_decisions:
- issue: κύριον Ἰησοῦν Χριστόν എന്ന പദസമുച്ചയത്തിൽ Χριστόν എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: പ്രധാനപാഠത്തിൽ ‘മശിഹാ’
  alternative: ‘ക്രിസ്തു’
  rationale: Χριστός ഇവിടെ വെറും പേരിന്റെ ഭാഗമായി മാത്രം പ്രവർത്തിക്കുന്നുവെന്നു നിർബന്ധമായി തീരുമാനിക്കാതെ, ‘അഭിഷിക്തൻ/മശിഹാ’ എന്ന പദവിയുടെ സജീവമായ അർഥം പ്രധാനപാഠത്തിൽ നിലനിർത്തുന്നു; പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: πολίτευμα വ്യക്തിയുടെ പൗരത്വമാണോ ഒരു സമൂഹ-രാഷ്ട്രമാണോ
  choice: പ്രധാനപാഠത്തിൽ ‘പൗരത്വം’
  alternative: ‘പൗരസമൂഹം’ അഥവാ ‘രാഷ്ട്രസമൂഹം’
  rationale: സന്ദർഭത്തിലെ പൗരബന്ധം വ്യക്തമായി പ്രകടിപ്പിക്കുമ്പോഴും, പദത്തിനുള്ള സമൂഹപരമായ അർഥസാധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന ആദരപൂർണ മലയാളം. γάρ എന്ന ബന്ധകത്തിന്റെ വിശദീകരണസ്വഭാവം ‘കാരണം’ എന്നതിലൂടെ നിലനിർത്തി. മുഖ്യവാക്യത്തിലെ പദക്രമം മലയാളത്തിന്റെ സ്വാഭാവികതയ്ക്കനുസരിച്ച് ക്രമപ്പെടുത്തി; മൂലത്തിലെ സ്ഥലസൂചനയും രക്ഷകനെ ആകാംക്ഷയോടെ കാത്തിരിക്കുന്ന ഭാവവും സംരക്ഷിച്ചു.
