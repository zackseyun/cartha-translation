  source_fidelity: മുഖ്യവാക്യം ഗ്രീക്ക് പാഠത്തിലെ വിശദീകരണബന്ധം, ദൈവാത്മാവിനാലുള്ള ആരാധന, മശീഹയായ യേശുവിലുള്ള പ്രശംസ, ജഡത്തിലുള്ള ആശ്രയനിരാസം എന്നിവ നന്നായി നിലനിർത്തുന്നു. എന്നാൽ «നാമാണ് പരിച്ഛേദനം» എന്നത് മലയാളത്തിൽ സ്വാഭാവികമായ വ്യക്തിസൂചക പ്രയോഗമല്ല; περιτομή ഇവിടെ സൂചിപ്പിക്കുന്ന കൂട്ടായ ഉടമ്പടിജനത്വം വ്യക്തമായി പറയണം. പാഠഭേദക്കുറിപ്പിലെ വ്യത്യസ്തവായനയും കൃത്യമായി പുനർനിർമിക്കേണ്ടതാണ്.
  naturalness: «പരിച്ഛേദിതർ നാം തന്നെയാണ്» ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ശക്തവുമാണ്. «മശീഹയായ യേശുവിൽ» എന്ന പ്രയോഗവും «ജഡത്തിൽ ആശ്രയം വെക്കാതിരിക്കുകയും» എന്നതും സന്ദർഭത്തിനു ചേരുന്നതാണ്.
  terminology: «ദൈവത്തിന്റെ ആത്മാവിനാൽ», «മശീഹ», «ജഡം» എന്നിവ യോജിച്ച തിരഞ്ഞെടുപ്പുകളാണ്. «പരിച്ഛേദിതർ» മൂർത്തമായ പരിച്ഛേദനപദത്തിന്റെ ബന്ധം നിലനിർത്തിക്കൊണ്ട് മനുഷ്യരെ സൂചിപ്പിക്കുന്ന മലയാളരൂപമാണ്. ജഡത്തെ പാപസ്വഭാവമായി പരിമിതപ്പെടുത്താതിരിക്കുന്ന അടിക്കുറിപ്പ് ഉചിതമാണ്.
