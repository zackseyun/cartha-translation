id: PHP.3.3
reference: Philippians 3:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἡμεῖς γάρ ἐσμεν ἡ περιτομή, οἱ πνεύματι θεοῦ λατρεύοντες καὶ καυχώμενοι ἐν Χριστῷ Ἰησοῦ καὶ οὐκ ἐν σαρκὶ πεποιθότες,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/003.yaml
  text: For we are the circumcision[a], who worship by the Spirit of God and boast in Messiah Jesus and put no confidence in the flesh[c][b],
translation:
  language: ml
  text: എന്തെന്നാൽ, ദൈവത്തിന്റെ ആത്മാവിനാൽ ആരാധിക്കുകയും മശീഹയായ യേശുവിൽ അഭിമാനം കൊള്ളുകയും ജഡത്തിൽ ആശ്രയം വെക്കാതിരിക്കുകയും ചെയ്യുന്ന പരിച്ഛേദിതർ നാം തന്നെയാണ്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περιτομή
  choice: പരിച്ഛേദനം
  rationale: പൗലോസിന്റെ വൈരുധ്യാത്മകമായ പ്രയോഗം നിലനിർത്താൻ മൂർത്തമായ ഉടമ്പടിപദം അതേപടി സൂക്ഷിച്ചു; ‘യഥാർഥമായി പരിച്ഛേദനം ലഭിച്ചവർ’ എന്ന വ്യാഖ്യാനപരമായ വികസനം മുഖ്യവാചകത്തിൽ ചേർത്തില്ല.
- source_word: πνεύματι θεοῦ
  choice: ദൈവത്തിന്റെ ആത്മാവിനാൽ
  rationale: SBLGNT-യിലെ θεοῦ എന്ന വായന അനുസരിച്ച്, ആരാധനയുടെ മാർഗമോ പ്രവർത്തകശക്തിയോ ആയ ദൈവാത്മാവിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: λατρεύοντες
  choice: ആരാധിക്കുകയും
  rationale: ദൈവത്തോടുള്ള മതപരവും വിശുദ്ധവുമായ സേവനത്തെ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: καυχώμενοι
  choice: അഭിമാനം കൊള്ളുകയും
  rationale: മാനുഷിക യോഗ്യതകളിൽ ആശ്രയിക്കുന്നതിനോടുള്ള പൗലോസിന്റെ വൈരുധ്യം നിലനിർത്തുന്നു; ‘സന്തോഷിക്കുക’ എന്നതിനെക്കാൾ മൂലപദത്തിന്റെ പ്രശംസാഭാവം വ്യക്തമാക്കുന്നു.
- source_word: Χριστῷ Ἰησοῦ
  choice: മശീഹയായ യേശുവിൽ
  rationale: Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ അർഥം ‘മശീഹ’ എന്നു പ്രകടമാക്കുകയും മലയാളത്തിൽ വ്യക്തമായ ബന്ധം നൽകാൻ ‘ആയ’ ചേർക്കുകയും ചെയ്തു.
- source_word: σαρκί
  choice: ജഡത്തിൽ
  rationale: ശരീരപരവും മാനുഷികവുമായ യോഗ്യതകൾ എന്ന സന്ദർഭാർഥം ഉൾക്കൊള്ളുന്ന മൂലരൂപകം നിലനിർത്തി; അതിനെ ‘പാപസ്വഭാവം’ എന്നു ചുരുക്കിയില്ല.
- source_word: πεποιθότες
  choice: ആശ്രയം വെക്കാതിരിക്കുകയും
  rationale: പൂർണകൃതന്തം സൂചിപ്പിക്കുന്ന സ്ഥിരമായ ആശ്രയമോ ആത്മവിശ്വാസമോ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: γάρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തോടുള്ള വിശദീകരണബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഈ വാക്യത്തിലെ σάρξ എന്നതിന്റെ അർഥം
  choice: ജഡം എന്നത് പരിച്ഛേദനം, വംശപരമ്പര, മതപദവി തുടങ്ങിയ ശരീരപരവും മാനുഷികവുമായ ആശ്രയകാരണങ്ങളെ പ്രധാനമായി സൂചിപ്പിക്കുന്നു.
  alternative: അകത്തുള്ള ധാർമിക തത്ത്വമായ പാപസ്വഭാവം.
  rationale: തുടർന്നുള്ള വാക്യങ്ങളിൽ പൗലോസ് പരിച്ഛേദനം, വംശം, ന്യായപ്രമാണാനുഷ്ഠാനം, പദവി എന്നിവ നിരത്തുന്നതിനാൽ സന്ദർഭം മാനുഷിക യോഗ്യതകളെയാണ് മുൻനിർത്തുന്നത്.
- issue: πνεύματι θεοῦ എന്നതിന്റെ ശക്തി
  choice: ആരാധനയുടെ മാർഗമോ പ്രവർത്തകശക്തിയോ ആയ ദൈവത്തിന്റെ ആത്മാവിനെ സൂചിപ്പിക്കുന്നു.
  alternative: മനുഷ്യന്റെ ആത്മാവ്, അല്ലെങ്കിൽ ആത്മീയമായ രീതിയിൽ ദൈവത്തെ ആരാധിക്കൽ.
  rationale: SBLGNT-യിലെ θεοῦ എന്ന വായന ദൈവാത്മാവിലേക്കാണ് സ്വാഭാവികമായി വിരൽചൂണ്ടുന്നത്; എങ്കിലും വ്യത്യസ്ത പാഠവായന അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. ‘നാമാണ് പരിച്ഛേദനം’ എന്ന ഉദ്ദേശപൂർവമായ ശക്തമായ രൂപകം നിലനിർത്തി; ‘ജഡം’ പോലുള്ള സാന്ദ്രമായ പദത്തിന് അടിക്കുറിപ്പിലൂടെ സന്ദർഭവ്യക്തത നൽകി.
