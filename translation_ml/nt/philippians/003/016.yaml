source:
  edition: SBLGNT
  text: πλὴν εἰς ὃ ἐφθάσαμεν, τῷ αὐτῷ ⸀στοιχεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/016.yaml
  text: Only[a], let us keep in step with what we have attained.
translation:
  language: ml
  text: എന്തായാലും, നാം എത്തിച്ചേർന്നിടത്തോളം അതനുസരിച്ച് ചുവടൊത്ത് നടക്കാം[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അതേ നിയമമനുസരിച്ച് നടക്കാം” / “അതേ മാനദണ്ഡം പാലിക്കാം.”'
    reason: τῷ αὐτῷ στοιχεῖν എന്ന പ്രയോഗത്തിൽ അനുസരിക്കേണ്ട നിയമമോ മാനദണ്ഡമോ പാതയോ ഗ്രീക്കിൽ പരോക്ഷമാണ്; അതിനാൽ കൂടുതൽ വ്യക്തമായി നാമം ചേർത്തുള്ള വിവർത്തനങ്ങളും സാധ്യമാണ്.
lexical_decisions:
- source_word: πλήν
  choice: എന്തായാലും
  rationale: ഇവിടെ ഈ പദം ഒഴിവാക്കലിനേക്കാൾ, മുൻവാക്യത്തെ ചുരുക്കി പ്രായോഗികമായ ആഹ്വാനത്തിലേക്കു നയിക്കുന്ന പരിവർത്തനമാണ്. ‘എന്തായാലും’ അതിന്റെ നിയന്ത്രകവും സംക്രമണപരവുമായ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: εἰς ὃ
  choice: നിലയ്ക്ക് അനുസരിച്ച്
  rationale: എത്തിച്ചേർന്ന പുരോഗതിയുടെ നിലയെയോ പരിധിയെയോ ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നു. στοιχεῖν എന്ന ക്രിയയോടു ചേർന്നപ്പോൾ ‘നിലയ്ക്കനുസരിച്ച്’ എന്നത് മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: ἐφθάσαμεν
  choice: നാം എത്തിച്ചേർന്ന
  rationale: ഇതിനകം കൈവരിച്ച നിലയെയാണ് ആഓറിസ്റ്റ് രൂപം സൂചിപ്പിക്കുന്നത്. ‘എത്തിച്ചേർന്ന’ എന്നത് പൂർണത കൈവരിച്ചു എന്ന അമിതസൂചന ഒഴിവാക്കി, ഒരു ഘട്ടത്തിലെത്തിയെന്ന ആശയം നൽകുന്നു.
- source_word: τῷ αὐτῷ
  choice: ഒരേ ചുവടിൽ
  rationale: ഗ്രീക്കിൽ ‘നിയമം’, ‘മാനദണ്ഡം’, ‘പാത’ തുടങ്ങിയ നാമങ്ങൾ വ്യക്തമാക്കിയിട്ടില്ല. στοιχεῖν എന്നതിലെ നിരയായി നടക്കുന്നതിന്റെ രൂപകത്തോടു ചേർത്ത് ‘ഒരേ ചുവടിൽ’ എന്നു നൽകിയതിലൂടെ ആ ഐക്യവും മാനദണ്ഡാനുസരണവും അമിതവ്യാഖ്യാനമില്ലാതെ സൂചിപ്പിക്കുന്നു.
- source_word: στοιχεῖν
  choice: മുന്നോട്ടുപോകാം
  rationale: നിരയൊത്ത് നടക്കുക, ഒരു മാനദണ്ഡത്തിനനുസരിച്ച് തുടരുക എന്ന ആശയമാണ് ക്രിയയ്ക്കുള്ളത്. ‘ഒരേ ചുവടിൽ മുന്നോട്ടുപോകാം’ എന്ന സമഗ്രപ്രയോഗം രൂപകവും ആഹ്വാനഭാവവും ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: τῷ αὐτῷ എന്നതിനോടൊപ്പം ‘നിയമം’ അല്ലെങ്കിൽ ‘മാനദണ്ഡം’ എന്ന വ്യക്തമായ നാമം ചേർക്കണമോ എന്നത്
  choice: പ്രധാനപാഠത്തിൽ അത്തരം നാമം ചേർക്കാതെ ‘ഒരേ ചുവടിൽ മുന്നോട്ടുപോകാം’ എന്നു രൂപകാത്മകമായി വിവർത്തനം ചെയ്തു.
  alternative: ‘അതേ നിയമമനുസരിച്ച് നടക്കാം’ / ‘അതേ മാനദണ്ഡം പാലിക്കാം’
  rationale: നൽകിയിരിക്കുന്ന SBLGNT പാഠത്തിൽ ആ നാമം വ്യക്തമല്ല. പ്രധാനപാഠത്തിൽ അത് ചേർത്താൽ ഗ്രീക്ക് അനുവദിക്കുന്ന തുറന്ന അർത്ഥം അനാവശ്യമായി ചുരുങ്ങും; വ്യത്യസ്തമായ സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള മലയാളം. ‘ഒരേ ചുവടിൽ മുന്നോട്ടുപോകാം’ എന്നത് ഗ്രീക്കിലെ നടപ്പുരൂപകം നിലനിർത്തുന്നു; ‘എത്തിച്ചേർന്ന നില’ ആത്മീയ പൂർണതയെ അനാവശ്യമായി പ്രഖ്യാപിക്കാതെ ഇതുവരെ ഉണ്ടായ പുരോഗതിയെ സൂചിപ്പിക്കുന്നു.
