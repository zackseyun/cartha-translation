reference: Philippians 3:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τὸ λοιπόν, ἀδελφοί μου, χαίρετε ἐν κυρίῳ. τὰ αὐτὰ γράφειν ὑμῖν ἐμοὶ μὲν οὐκ ὀκνηρόν, ὑμῖν δὲ ἀσφαλές.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/001.yaml
  text: Finally[a], my brothers, rejoice in the Lord. To write the same things to you is not troublesome for me[d][c][b], and is safe for you.
translation:
  language: ml
  text: ഒടുവിൽ[a], എന്റെ സഹോദരന്മാരേ[b], കർത്താവിൽ സന്തോഷിക്കുവിൻ. ഒരേ കാര്യങ്ങൾ നിങ്ങൾക്ക് എഴുതുന്നത് എനിക്കാകട്ടെ മടുപ്പുളവാക്കുന്നതല്ല[c]; നിങ്ങൾക്കോ അത് സുരക്ഷിതമാണ്[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ശേഷിക്കുന്ന കാര്യങ്ങളെക്കുറിച്ച്” അല്ലെങ്കിൽ “ഇനിമുതൽ.”
    reason: lexical_alternative
  - marker: b
    text: “സഹോദരന്മാർ” എന്ന അഭിസംബോധന ഇവിടെ സഭ മുഴുവനെയും, അതായത് സഹോദരിമാരെയും സഹോദരന്മാരെയും, ഉൾക്കൊള്ളുന്നു.
    reason: cultural_note
  - marker: c
    text: അഥവാ “എനിക്ക് പ്രയാസമുള്ളതല്ല” അല്ലെങ്കിൽ “എനിക്ക് ഭാരമല്ല.”
    reason: lexical_alternative
  - marker: d
    text: അഥവാ “അത് നിങ്ങൾക്ക് ഒരു സംരക്ഷണമാണ്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ λοιπόν
  choice: ഒടുവിൽ
  rationale: ലേഖനത്തിലെ ഒരു ആശയമാറ്റം സൂചിപ്പിക്കുന്ന പ്രയോഗമായി സ്വാഭാവികമായ മലയാളം തെരഞ്ഞെടുത്തു. തുടർന്ന് കൂടുതൽ കാര്യങ്ങൾ വരുന്നതിനാൽ ‘ശേഷിക്കുന്ന കാര്യങ്ങളെക്കുറിച്ച്’ എന്ന അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἀδελφοί μου
  choice: എന്റെ സഹോദരന്മാരേ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചന അഭിസംബോധന നേരിട്ട് നിലനിർത്തുന്നു; സഭ മുഴുവനെയും ഉൾക്കൊള്ളുന്ന പ്രയോഗമാണെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: χαίρετε
  choice: സന്തോഷിക്കുവിൻ
  rationale: ബഹുവചന ആജ്ഞാരൂപത്തിന്റെ ആഹ്വാനസ്വഭാവവും പൗലോസിന്റെ പ്രയോഗത്തിലെ ശക്തിയും നിലനിർത്തുന്ന, dignified Malayalam രൂപം.
- source_word: ἐν κυρίῳ
  choice: കർത്താവിൽ
  rationale: സന്തോഷം കർത്താവുമായുള്ള ബന്ധത്തിൽ അധിഷ്ഠിതമാണെന്ന പൗലോസിന്റെ ദൈവശാസ്ത്രപരമായ ചട്ടക്കൂട് നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: τὰ αὐτά
  choice: ഒരേ കാര്യങ്ങൾ
  rationale: ഇത് മുമ്പത്തെ ഉപദേശങ്ങളെയാണോ ആവർത്തിച്ചുള്ള പ്രബോധനങ്ങളെയാണോ സൂചിപ്പിക്കുന്നതെന്ന ഗ്രീക്കിലെ അവ്യക്തത പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: γράφειν
  choice: എഴുതുന്നത്
  rationale: മലയാളത്തിലെ ഈ വാക്യഘടനയിൽ ഗ്രീക്ക് infinitive-ന്റെ പ്രവർത്തനം സ്വാഭാവികമായി പകരുന്നു.
- source_word: οὐκ ὀκνηρόν
  choice: മടുപ്പുളവാക്കുന്നതല്ല
  rationale: ആവർത്തിച്ച് എഴുതുന്നത് പൗലോസിന് ഭാരമോ മടുപ്പോ ഉണ്ടാക്കുന്നില്ലെന്ന ആശയം നൽകുന്നു; ‘പ്രയാസമല്ല’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἀσφαλές
  choice: സുരക്ഷിതമാണ്
  rationale: അപകടത്തിൽനിന്നോ തെറ്റിൽനിന്നോ സംരക്ഷണം നൽകുന്നുവെന്ന വിശാലമായ അർത്ഥം അധിക വ്യാഖ്യാനം ചേർക്കാതെ സൂക്ഷിക്കുന്നു; ‘സംരക്ഷണമാണ്’ എന്ന കൂടുതൽ നാമരൂപപരമായ വിവർത്തനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: സഭയോടുള്ള ലിംഗസൂചക അഭിസംബോധന
  choice: എന്റെ സഹോദരന്മാരേ
  alternative: എന്റെ സഹോദരീസഹോദരന്മാരേ
  rationale: ഗ്രീക്ക് വ്യാകരണത്തിലെ പുല്ലിംഗ ബഹുവചനം മുഖ്യപാഠത്തിൽ നിലനിർത്തി; എന്നാൽ അഭിസംബോധന സഭയിലെ സ്ത്രീപുരുഷന്മാർ ഉൾപ്പെടുന്ന സമൂഹത്തോടാണെന്ന ഉൾക്കൊള്ളുന്ന പ്രയോഗം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- issue: ആവർത്തിച്ച് എഴുതുന്നതിന്റെ സംരക്ഷണപരമായ അർത്ഥം
  choice: നിങ്ങൾക്കോ അത് സുരക്ഷിതമാണ്
  alternative: അത് നിങ്ങൾക്ക് ഒരു സംരക്ഷണമാണ്
  rationale: ἀσφαλές എന്ന വിശേഷണത്തിന്റെ നേരിട്ടുള്ള അർത്ഥം മുഖ്യപാഠത്തിൽ സൂക്ഷിച്ചു; സംരക്ഷണോപാധി എന്ന കൂടുതൽ വ്യാഖ്യാനപരമായ രൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക സാധാരണ മലയാളികൾക്ക് മനസ്സിലാകുന്ന വിധത്തിൽ സ്വാഭാവികവും ആദരപൂർവവുമായ ശൈലി ഉപയോഗിച്ചു. ‘സന്തോഷിക്കുവിൻ’ എന്ന രൂപം വചനത്തിന്റെ ആഹ്വാനഭാവം dignified register-ൽ നിലനിർത്തുന്നു. μὲν…δὲ എന്ന വിരുദ്ധസമാന്തര ഘടന ‘എനിക്കാകട്ടെ… നിങ്ങൾക്കോ’ എന്ന് പ്രകടമാക്കി.
