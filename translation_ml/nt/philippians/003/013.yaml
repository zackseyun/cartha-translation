- from: 'സഹോദരന്മാരേ[a], ഞാൻതന്നെ അത് കൈപ്പിടിയിലാക്കിക്കഴിഞ്ഞതായി കരുതുന്നില്ല. എന്നാൽ ഒന്നു മാത്രം: പിന്നിലുള്ളവ മറന്നും മുന്നിലുള്ളവയിലേക്കു നീട്ടിയെത്തിയും,'
  to: 'സഹോദരന്മാരേ[a], ഞാൻ എന്നെത്തന്നെ അത് കൈവശപ്പെടുത്തിയതായി കരുതുന്നില്ല. എന്നാൽ ഒന്നു മാത്രം: പിന്നിലുള്ളവ മറന്നും മുന്നിലുള്ളവയിലേക്കു നീണ്ടും,'
  rationale: The revision preserves the Greek syntax and deliberate ellipsis while making the Malayalam idiomatic. ‘ഞാൻ എന്നെത്തന്നെ’ clearly renders the emphatic reflexive construction. ‘കൈവശപ്പെടുത്തിയതായി’ retains the taking-hold sense, and ‘മുന്നിലുള്ളവയിലേക്കു നീണ്ടും’ represents forward stretching without implying that the goal has already been reached.
