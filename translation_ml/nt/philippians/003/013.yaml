id: PHP.3.13
reference: Philippians 3:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀδελφοί, ἐγὼ ἐμαυτὸν ⸀οὐ λογίζομαι κατειληφέναι· ἓν δέ, τὰ μὲν ὀπίσω ἐπιλανθανόμενος τοῖς δὲ ἔμπροσθεν ἐπεκτεινόμενος,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/013.yaml
  text: 'Brothers[a], I do not consider myself to have taken hold of it. But one thing: forgetting the things behind and reaching forward to the things ahead,'
translation:
  language: ml
  text: 'സഹോദരന്മാരേ[a], ഞാൻ എന്നെത്തന്നെ അത് കൈവശപ്പെടുത്തിയതായി കരുതുന്നില്ല. എന്നാൽ ഒന്നു മാത്രം: പിന്നിലുള്ളവ മറന്നും മുന്നിലുള്ളവയിലേക്കു നീണ്ടും,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സഹോദരന്മാരേ’ എന്നത് ഗ്രീക്കിലെ പുല്ലിംഗ സംബോധനയായ adelphoi എന്ന പദത്തിന്റെ പരിഭാഷയാണ്; സ്ത്രീകൾ ഉൾപ്പെടുന്ന വിശ്വാസസമൂഹത്തെ മുഴുവനായി സംബോധന ചെയ്യാനും പൗലോസ് ഈ പദം പലപ്പോഴും ഉപയോഗിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചന സംബോധനയുടെ രൂപം നിലനിർത്തുന്നു; പൗലോസ് ഇത് സ്ത്രീകൾ ഉൾപ്പെടുന്ന വിശ്വാസസമൂഹത്തെ സംബോധന ചെയ്യാനും ഉപയോഗിക്കുന്നതിനാൽ ആ വ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: λογίζομαι
  choice: കരുതുന്നില്ല
  rationale: സ്വന്തം നിലയെക്കുറിച്ചുള്ള വിലയിരുത്തൽ എന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐγὼ ἐμαυτόν
  choice: ഞാൻതന്നെ
  rationale: ഗ്രീക്കിലെ ഊന്നലും സ്വയംവിലയിരുത്തലും മലയാളത്തിൽ ഭാരമില്ലാതെ സൂചിപ്പിക്കുന്നു.
- source_word: κατειληφέναι
  choice: അത് കൈപ്പിടിയിലാക്കിക്കഴിഞ്ഞതായി
  rationale: പിടിച്ചെടുക്കുക എന്ന ക്രിയാരൂപകം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ സൂചിതമായ കർമം മലയാളത്തിന്റെ വ്യക്തതയ്ക്കായി ‘അത്’ എന്നു ചേർത്തിരിക്കുന്നു.
- source_word: ἓν δέ
  choice: എന്നാൽ ഒന്നു മാത്രം
  rationale: ഗ്രീക്കിലെ അപൂർണവും പെട്ടെന്നുള്ളതുമായ മാറിവരവ് നിലനിർത്തുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘ഞാൻ ചെയ്യുന്നു’ എന്നത് ചേർക്കുന്നില്ല.
- source_word: τὰ μὲν ὀπίσω
  choice: പിന്നിലുള്ളവ
  rationale: പിന്നിലായിരിക്കുന്ന കാര്യങ്ങൾ എന്ന ബഹുവചനപരമായ പൊതുസൂചന സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἐπιλανθανόμενος
  choice: മറന്നും
  rationale: ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുകയും തുടർന്നുള്ള സമാന്തര കൃത്യവുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: τοῖς δὲ ἔμπροσθεν
  choice: മുന്നിലുള്ളവയിലേക്ക്
  rationale: ‘പിന്നിലുള്ളവ’ എന്നതിനോടുള്ള ദിശാപരമായ വൈരുധ്യവും ബഹുവചനസൂചനയും നിലനിർത്തുന്നു.
- source_word: ἐπεκτεινόμενος
  choice: നീട്ടിയെത്തിയും
  rationale: മുന്നിലുള്ളതിലേക്കു ശരീരം നീട്ടി എത്തുന്ന സജീവമായ രൂപകം അമിത വ്യാഖ്യാനമില്ലാതെ പകർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. മൂലത്തിലെ പെട്ടെന്നുള്ള ‘ഒന്നു മാത്രം’ എന്ന അപൂർണ പ്രയോഗവും ഓട്ടമത്സരത്തെ ഓർമിപ്പിക്കുന്ന മുന്നോട്ടുനീളുന്ന രൂപകവും സംരക്ഷിച്ചിരിക്കുന്നു.
