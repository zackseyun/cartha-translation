id: PHP.3.19
reference: Philippians 3:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὧν τὸ τέλος ἀπώλεια, ὧν ὁ θεὸς ἡ κοιλία καὶ ἡ δόξα ἐν τῇ αἰσχύνῃ αὐτῶν, οἱ τὰ ἐπίγεια φρονοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/019.yaml
  text: Their end is destruction[a], their god is the belly[b], and their glory is in their shame—their minds are set on earthly things.
translation:
  language: ml
  text: അവരുടെ അന്ത്യം നാശമാണ്; അവരുടെ ദൈവം വയറാണ്[a]; അവരുടെ മഹത്വം അവരുടെ ലജ്ജയിലാണ്. അവർ ഭൗമികമായ കാര്യങ്ങളിൽ മനസ്സുവെച്ചിരിക്കുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരുടെ ദൈവം അവരുടെ ഭോഗാസക്തിയാണ്.”
    reason: κοιλία എന്ന മൂർത്തരൂപകത്തിന്റെ സാധ്യതയുള്ള അർഥം വ്യക്തമാക്കുന്ന വ്യാഖ്യാനപരമായ പദാന്തരം.
  - marker: b
    text: അഥവാ, “അവർ ഭൗമികമായ കാര്യങ്ങൾ ചിന്തിക്കുന്നവരാണ്.”
    reason: φρονοῦντες എന്നതിന്റെ പദശഃ അടുത്ത പദാന്തരം; പ്രധാനപാഠം അതിലെ തുടരുന്ന മാനസിക അഭിമുഖീകരണം കൂടുതൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
lexical_decisions:
- source_word: τέλος
  choice: അന്ത്യം
  rationale: അവസാനവും അന്തിമഫലവും സൂചിപ്പിക്കാൻ കഴിയുന്ന ഗ്രീക്ക് പദത്തിന്റെ സംക്ഷിപ്തതയും ശക്തിയും നിലനിർത്തുന്നു.
- source_word: ἀπώλεια
  choice: നാശം
  rationale: ഗൗരവമുള്ള അന്തിമവിനാശത്തിന്റെ ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ഫലത്തിന്റെ സ്വഭാവം അനാവശ്യമായി വിശദീകരിക്കുന്നില്ല.
- source_word: κοιλία
  choice: വയർ
  rationale: ഗ്രീക്കിലെ മൂർത്തമായ ശാരീരിക രൂപകം അതേപടി നിലനിർത്തുന്നു. ‘വിശപ്പ്’ അല്ലെങ്കിൽ ‘ഭോഗാസക്തി’ എന്നത് അതിന്റെ അർഥം വ്യാഖ്യാനിച്ച് ചുരുക്കും.
- source_word: δόξα
  choice: മഹത്വം
  rationale: നേരിട്ടുള്ള പദസാമ്യം നിലനിർത്തുകയും ലജ്ജാകരമായതിൽ മഹത്വം കാണുന്ന വിരോധാഭാസം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: αἰσχύνη
  choice: ലജ്ജ
  rationale: അപമാനവും ധാർമിക നാണക്കേടും ഉൾക്കൊള്ളുന്ന സംക്ഷിപ്തവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: τὰ ἐπίγεια
  choice: ഭൗമികകാര്യങ്ങൾ
  rationale: ഭൂമിയോടു ബന്ധപ്പെട്ട കാര്യങ്ങൾ എന്ന ഗ്രീക്ക് നപുംസക ബഹുവചനത്തിന്റെ അർഥം വ്യക്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: φρονοῦντες
  choice: മനസ്സുവെച്ചിരിക്കുന്നു
  rationale: വെറും ഇടയ്ക്കുള്ള ചിന്തയല്ല, തുടരുന്ന മാനസിക അഭിമുഖീകരണമാണ് പങ്കാളിക്രിയ സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ഈ ഭാവം സ്വാഭാവികമായി പകരുന്നു.
- source_word: ὧν ... ὧν
  choice: അവരുടെ ... അവരുടെ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ ആളുകളെ ആവർത്തിച്ചു വിശേഷിപ്പിക്കുന്ന ബന്ധസർവനാമങ്ങളെ മലയാളത്തിൽ കൃത്രിമത്വമില്ലാതെ പ്രതിനിധീകരിക്കുന്നു.
theological_decisions:
- issue: ‘അവരുടെ ദൈവം വയറാണ്’ എന്ന രൂപകത്തിന്റെ വ്യാപ്തി
  choice: പ്രധാനപാഠത്തിൽ ‘വയർ’ എന്ന മൂർത്തരൂപകം നിലനിർത്തി.
  alternative: ‘അവരുടെ ദൈവം അവരുടെ ഭോഗാസക്തിയാണ്’ അല്ലെങ്കിൽ ‘അവരുടെ വിശപ്പാണ് അവരുടെ ദൈവം.’
  rationale: കീഴ്നിലയിലുള്ള ആഗ്രഹങ്ങളോടോ ഇന്ദ്രിയസുഖങ്ങളോടോ ഉള്ള അടിമത്തത്തെ സൂചിപ്പിക്കാവുന്ന ശക്തമായ ശാരീരിക രൂപകമാണ് ഗ്രീക്കിലുള്ളത്. അതിനെ ഒരൊറ്റ അമൂർത്ത വ്യാഖ്യാനമായി ചുരുക്കാതിരിക്കുന്നത് പൗലോസിന്റെ വാചാടോപവും അർഥവ്യാപ്തിയും സംരക്ഷിക്കുന്നു.
- issue: φρονοῦντες സൂചിപ്പിക്കുന്ന മാനസിക നിലപാട്
  choice: ‘മനസ്സുവെച്ചിരിക്കുന്നു’ എന്ന് നൽകി.
  alternative: ‘ഭൗമികകാര്യങ്ങൾ ചിന്തിക്കുന്നവരാണ്.’
  rationale: ഇത് ഒരു താൽക്കാലിക ചിന്തയെക്കാൾ തുടരുന്ന മാനസിക ദിശാബോധത്തെ സൂചിപ്പിക്കുന്നു. എങ്കിലും പദശഃ കൂടുതൽ അടുത്ത മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അന്ത്യം’, ‘നാശം’, ‘മഹത്വം’, ‘ലജ്ജ’ എന്നീ പദങ്ങൾ വാക്യത്തിന്റെ കഠിനതയും വിരോധാഭാസവും നിലനിർത്തുന്നു. അർദ്ധവിരാമങ്ങൾ ഗ്രീക്കിലെ ആവർത്തിത ഘടന വ്യക്തമാക്കുന്നു; അവസാന വാക്യം ആളുകളുടെ തുടരുന്ന ഭൗമിക അഭിമുഖീകരണം സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
