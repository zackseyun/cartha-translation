id: PHP.3.10
reference: Philippians 3:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῦ γνῶναι αὐτὸν καὶ τὴν δύναμιν τῆς ἀναστάσεως αὐτοῦ καὶ ⸀κοινωνίαν παθημάτων αὐτοῦ, ⸀συμμορφιζόμενος τῷ θανάτῳ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/010.yaml
  text: to know him[a], and the power of his resurrection, and the fellowship of his sufferings, being conformed to his death[b],
translation:
  language: ml
  text: അവനെയും അവന്റെ പുനരുത്ഥാനത്തിന്റെ ശക്തിയെയും അവന്റെ കഷ്ടാനുഭവങ്ങളിലെ പങ്കാളിത്തത്തെയും[a] അറിയാനും, അവന്റെ മരണത്തോട് അനുരൂപപ്പെട്ടുകൊണ്ട്[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അവന്റെ കഷ്ടാനുഭവങ്ങളിലെ കൂട്ടായ്മയെയും” അല്ലെങ്കിൽ “അവന്റെ കഷ്ടാനുഭവങ്ങളിൽ പങ്കുചേരുന്നതിനെയും.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “അവന്റെ മരണത്തോട് അനുരൂപനായിത്തീർന്നുകൊണ്ട്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γνῶναι
  choice: അറിയാനും
  rationale: ലക്ഷ്യമോ ഉദ്ദേശ്യമോ സൂചിപ്പിക്കുന്ന അനന്തക്രിയയുടെ ഭാവം നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ വ്യക്തിപരവും അനുഭവപരവുമായ അറിവിനെയും സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: δύναμιν
  choice: ശക്തിയെയും
  rationale: δύναμις എന്ന പദത്തിന്റെ നേരിട്ടുള്ളതും വ്യക്തവുമായ മലയാളരൂപം; മിശിഹായുടെ പുനരുത്ഥാനത്തിൽ വെളിപ്പെട്ട പ്രവർത്തനശക്തിയെ സൂചിപ്പിക്കുന്നു.
- source_word: ἀναστάσεως
  choice: പുനരുത്ഥാനത്തിന്റെ
  rationale: ഈ സംഭവത്തെ കൃത്യമായി സൂചിപ്പിക്കുന്ന, മലയാള ക്രൈസ്തവഭാഷയിൽ സ്ഥാപിതമായ പദം.
- source_word: κοινωνίαν
  choice: പങ്കാളിത്തത്തെയും
  rationale: വെറും മാനസിക സഹാനുഭൂതിയല്ല, കഷ്ടാനുഭവങ്ങളിൽ യഥാർഥമായി പങ്കുചേരുന്നതാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്; κοινωνία എന്ന നാമരൂപവും നിലനിർത്തുന്നു.
- source_word: παθημάτων
  choice: കഷ്ടാനുഭവങ്ങളിലുള്ള
  rationale: പീഡയും വേദനയും ഉൾപ്പെടുന്ന πάθημα എന്ന പദത്തിന്റെ ബഹുവചനാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: συμμορφιζόμενος
  choice: അനുരൂപപ്പെട്ടുകൊണ്ട്
  rationale: തുടർന്നുകൊണ്ടിരിക്കുന്ന അനുരൂപീകരണത്തെ സൂചിപ്പിക്കുന്ന വർത്തമാനകാല പങ്കാളിക്രിയയുടെ ഭാവം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; പ്രവർത്തനകർത്തൃത്വം അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: τῷ θανάτῳ αὐτοῦ
  choice: അവന്റെ മരണത്തോട്
  rationale: συμμορφιζόμενος എന്ന ക്രിയാപദത്തിന്റെ ദത്തിവ് പൂരകത്തെ നേരിട്ടായി പ്രതിഫലിപ്പിക്കുകയും ശ്രദ്ധ അവന്റെ മരണത്തിൽ തന്നെയാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: κοινωνίαν παθημάτων αὐτοῦ എന്നതിന്റെ അർഥം
  choice: അവന്റെ കഷ്ടാനുഭവങ്ങളിലുള്ള യഥാർഥ പങ്കാളിത്തം
  alternative: അവന്റെ കഷ്ടാനുഭവങ്ങളോടുള്ള കൂട്ടായ്മ എന്ന കൂടുതൽ അമൂർത്തമായ അർഥം
  rationale: ജനിറ്റീവ് ഘടനയും പൗലോസിന്റെ വിശാലമായ സന്ദർഭവും മിശിഹായുടെ കഷ്ടാനുഭവങ്ങളുടെ മാതൃകയിൽ പങ്കുചേരുന്നതിനെ പിന്തുണയ്ക്കുന്നു; ഒരു പ്രത്യേക സിദ്ധാന്തവ്യവസ്ഥ ചുമത്താതെ ‘പങ്കാളിത്തം’ ഈ ഭാവം സംരക്ഷിക്കുന്നു.
- issue: συμμορφιζόμενος എന്നതിലെ കർത്തൃത്വവും പ്രക്രിയാഭാവവും
  choice: ‘അനുരൂപപ്പെട്ടുകൊണ്ട്’ എന്ന് നൽകി തുടരുന്ന പ്രക്രിയയും ഗ്രീക്കിലെ ശബ്ദസംബന്ധമായ തുറന്ന നിലയും സംരക്ഷിച്ചു
  alternative: ‘അനുരൂപപ്പെടുത്തപ്പെട്ടുകൊണ്ട്’ എന്ന് വ്യക്തമായ കർമണിരൂപം നൽകുക, അല്ലെങ്കിൽ ‘അനുരൂപനായിത്തീർന്നുകൊണ്ട്’ എന്ന് പ്രക്രിയ ഊന്നുക
  rationale: ഗ്രീക്ക് രൂപം മദ്ധ്യ/കർമണി ഭാവങ്ങൾ അനുവദിക്കുന്നു. മലയാളത്തിൽ കർത്താവിനെ നിർബന്ധമായി നിർണയിക്കാതെ തുടരുന്ന അനുരൂപത സൂചിപ്പിക്കുന്ന രൂപം തിരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ഗ്രീക്കിലെ നാമപദക്രമം കഴിയുന്നത്ര നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ സ്വാഭാവിക വിഭക്തിഘടന ഉപയോഗിച്ചു. വാക്യം അടുത്ത സന്ദർഭവുമായി വ്യാകരണപരമായി തുടരുന്നതിനാൽ അവസാനത്തിൽ പൂർണ്ണവിരാമത്തിനു പകരം അൽപ്പവിരാമം നിലനിർത്തി.
