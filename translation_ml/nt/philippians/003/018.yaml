  revision_rationale: The revision restores Paul as the singular speaker of both ‘I often told you’ and ‘I now say, even weeping.’ It expresses the Greek appositional conclusion explicitly in Malayalam (‘they are enemies’) while maintaining the verse’s meaning, the repeated-past sense, and the Messiah/Christ footnote alternative.
