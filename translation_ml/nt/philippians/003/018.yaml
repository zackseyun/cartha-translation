id: PHP.3.18
reference: Philippians 3:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πολλοὶ γὰρ περιπατοῦσιν οὓς πολλάκις ἔλεγον ὑμῖν, νῦν δὲ καὶ κλαίων λέγω, τοὺς ἐχθροὺς τοῦ σταυροῦ τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/018.yaml
  text: For many walk[a], whom I often told you about, and now even weeping I say, are enemies of the cross of Messiah,
translation:
  language: ml
  text: എന്തെന്നാൽ, മശീഹയുടെ[a] കുരിശിന്റെ ശത്രുക്കളായി ജീവിക്കുന്നവർ പലരാണ്; അവരെക്കുറിച്ച് ഞാൻ നിങ്ങളോടു പലവട്ടം പറഞ്ഞിരുന്നു; ഇപ്പോഴോ, കരഞ്ഞുകൊണ്ടുപോലും, അവർ മശീഹയുടെ കുരിശിന്റെ ശത്രുക്കളാണെന്നു ഞാൻ പറയുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ക്രിസ്തുവിന്റെ കുരിശ്.”
    reason: Χριστός എന്ന ഗ്രീക്കുപദം സ്ഥാനപ്പേരിന്റെ അർഥം മുൻനിർത്തി ‘മശീഹ’ എന്നും, പരമ്പരാഗത രൂപത്തിൽ ‘ക്രിസ്തു’ എന്നും നൽകാം.
lexical_decisions:
- source_word: πολλοὶ
  choice: പലരും
  rationale: വിശേഷണം നാമവാചകമായി പ്രവർത്തിച്ച് നിർവചിക്കാത്ത ഒരു വലിയ ബഹുത്വത്തെ സൂചിപ്പിക്കുന്നു; ‘പലരും’ സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ മലയാളമാണ്.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ ആഹ്വാനത്തിന് കാരണം വിശദീകരിക്കുന്ന ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: περιπατοῦσιν
  choice: ജീവിക്കുന്നു
  rationale: ഇവിടെ പദം അക്ഷരാർഥത്തിലുള്ള നടത്തമല്ല, ജീവിതരീതിയെ സൂചിപ്പിക്കുന്ന രൂപകപ്രയോഗമാണ്. സാധാരണ ആധുനിക മലയാളത്തിൽ അർഥം വ്യക്തമായി എത്തിക്കാൻ ‘ജീവിക്കുന്നു’ തിരഞ്ഞെടുത്തു.
- source_word: πολλάκις ἔλεγον ὑμῖν
  choice: ഞാൻ പലവട്ടം നിങ്ങളോടു പറഞ്ഞിട്ടുള്ള
  rationale: πολλάκις സഹിതമുള്ള അപൂർണഭൂതകാലക്രിയ ആവർത്തിച്ച ഭൂതകാലപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ഈ രൂപം ആ ആവർത്തനവും ബന്ധവാക്യത്തിന്റെ സ്വഭാവവും നിലനിർത്തുന്നു.
- source_word: νῦν δὲ καὶ κλαίων λέγω
  choice: ഇപ്പോൾ കരഞ്ഞുകൊണ്ടുതന്നെ പറയുന്ന
  rationale: വർത്തമാനകാല കൃദന്തമായ κλαίων, പറയുന്ന സമയത്തുതന്നെ പൗലോസ് കരയുന്നതായി ചിത്രീകരിക്കുന്നു; ‘-കൊണ്ടുതന്നെ’ καί നൽകുന്ന ഊന്നൽ പ്രകടമാക്കുന്നു.
- source_word: ἐχθροὺς
  choice: ശത്രുക്കളായി
  rationale: കുരിശിനോടുള്ള ശക്തമായ എതിർപ്പ് സൂചിപ്പിക്കുന്ന ഉറവിടപദത്തിന്റെ തീവ്രത ‘ശത്രുക്കൾ’ കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: σταυροῦ
  choice: കുരിശിന്റെ
  rationale: σταυρός എന്ന പദത്തിന്റെ നേരിട്ടുള്ളതും സ്ഥാപിതവുമായ മലയാള സമാനപദം; ഇവിടെ കുരിശുമരണവും അതിന്റെ ദൈവശാസ്ത്രപരമായ പ്രസക്തിയും ഉൾക്കൊള്ളുന്നു.
- source_word: Χριστοῦ
  choice: മശീഹയുടെ
  rationale: ഇവിടെ Χριστός അഭിഷിക്തനായവനെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരായി വായിക്കാം; ‘മശീഹ’ ആ സ്ഥാനപ്പേരിന്റെ അർഥം നിലനിർത്തുന്നു.
theological_decisions:
- issue: τοῦ Χριστοῦ എന്ന പൗലോസിന്റെ പ്രയോഗത്തിലെ Χριστός സ്ഥാനപ്പേരായോ പതിവായ പേരായോ വിവർത്തനം ചെയ്യുക
  choice: മശീഹയുടെ
  alternative: ക്രിസ്തുവിന്റെ
  rationale: ഈ സന്ദർഭം പേരുപോലുള്ള ഉപയോഗം നിർബന്ധമാക്കുന്നില്ല. അതിനാൽ സ്ഥാനപ്പേരിന്റെ അർഥം തുറന്നുകാട്ടുന്ന ‘മശീഹ’ മുഖ്യപാഠത്തിൽ നൽകി, സ്ഥാപിതമായ ‘ക്രിസ്തു’ എന്ന രൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗ്രീക്കിലെ ദീർഘമായ ബന്ധവാക്യഘടന സാധ്യമായത്ര നിലനിർത്തിയെങ്കിലും περιπατέω എന്ന ജീവിതരീതിയുടെ രൂപകം തെറ്റിദ്ധരിക്കാതിരിക്കാൻ ‘ജീവിക്കുന്നു’ എന്നു സ്വാഭാവികമായി വിവർത്തനം ചെയ്തു. അടിക്കുറിപ്പിന്റെ ചിഹ്നം അതുമായി ബന്ധപ്പെട്ട Χριστοῦ എന്ന പദത്തിന്റെ വിവർത്തനത്തോടു ചേർത്തിരിക്കുന്നു.
