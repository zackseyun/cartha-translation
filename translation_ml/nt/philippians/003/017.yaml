id: PHP.3.17
reference: Philippians 3:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Συμμιμηταί μου γίνεσθε, ἀδελφοί, καὶ σκοπεῖτε τοὺς οὕτω περιπατοῦντας καθὼς ἔχετε τύπον ἡμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/017.yaml
  text: Brothers[a], join in imitating me, and keep your eyes on those who walk this way[b], just as you have us as a pattern.
translation:
  language: ml
  text: സഹോദരന്മാരേ[a], എന്നെ അനുകരിക്കുന്നവരിൽ ചേരുക. ഞങ്ങൾ നിങ്ങൾക്കു മാതൃക[b]യായിരിക്കുന്നതുപോലെ, ഇങ്ങനെ നടക്കുന്നവരെ ശ്രദ്ധിച്ചുകൊള്ളുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സഹോദരീസഹോദരന്മാരേ”; ഗ്രീക്ക് പദം പുല്ലിംഗ ബഹുവചനമാണെങ്കിലും സഭയിലെ മുഴുവൻ വിശ്വാസികളെയും ഉദ്ദേശിച്ചിരിക്കാം.
    reason: cultural_note
  - marker: b
    text: അഥവാ “ദൃഷ്ടാന്തം”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Συμμιμηταί μου γίνεσθε
  choice: എന്നെ അനുകരിക്കുന്നതിൽ നിങ്ങളെല്ലാവരും ഒന്നുചേരുക
  rationale: Συμμιμηταί എന്ന പദത്തിന്റെ കൂട്ടായ അനുകരണം എന്ന ആശയവും γίνεσθε എന്ന ആജ്ഞാരൂപത്തിന്റെ ശക്തിയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഒരുമിച്ചു പ്രകടമാക്കുന്നു.
- source_word: ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചന സംബോധനയുടെ രൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; സഭയിലെ മുഴുവൻ വിശ്വാസികളെയും ഉദ്ദേശിച്ചിരിക്കാനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: σκοπεῖτε
  choice: ശ്രദ്ധിച്ചുകൊള്ളുക
  rationale: സൂക്ഷ്മമായും തുടർച്ചയായും ശ്രദ്ധിക്കുക എന്ന ക്രിയയുടെ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: οὕτω περιπατοῦντας
  choice: ഇങ്ങനെ നടക്കുന്നവരെ
  rationale: περιπατέω എന്നതിലെ ‘നടക്കുക’ എന്ന ജീവിതരീതിയുടെ രൂപകം പരിഭാഷയിൽ നിലനിർത്തുന്നു.
- source_word: τύπον
  choice: മാതൃക
  rationale: അനുസരിക്കേണ്ട മാതൃകയെയോ ദൃഷ്ടാന്തത്തെയോ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ അർഥം സന്ദർഭോചിതമായി നൽകുന്നു.
- source_word: ἡμᾶς
  choice: ഞങ്ങൾ
  rationale: മൂലപാഠത്തിലെ ബഹുവചനം നിലനിർത്തുന്നു; അതിനെ പൗലൊസ് എന്ന ഏകവചനത്തിലേക്ക് ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: ἀδελφοί എന്ന സംബോധനയുടെ ഉൾക്കൊള്ളുന്ന വ്യാപ്തി
  choice: മുഖ്യപാഠത്തിൽ ‘സഹോദരന്മാരേ’ എന്ന് നൽകി, സഭയിലെ സ്ത്രീകളെയും ഉൾപ്പെടെ മുഴുവൻ വിശ്വാസികളെയും ഉദ്ദേശിച്ചിരിക്കാമെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
  alternative: മുഖ്യപാഠത്തിൽ ‘സഹോദരീസഹോദരന്മാരേ’ എന്നു നൽകുക.
  rationale: ഗ്രീക്ക് പദത്തിന്റെ വ്യാകരണപരമായ പുല്ലിംഗ ബഹുവചനരൂപം മറയ്ക്കാതെ നിലനിർത്തുകയും സന്ദർഭത്തിലെ സാധ്യതയുള്ള ഉൾക്കൊള്ളുന്ന അർഥം വായനക്കാരനെ അറിയിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. ‘നടക്കുക’ എന്ന പൗലൊസിന്റെ ജീവിതരീതി-രൂപകം നിലനിർത്തി; കൂട്ടായ അനുകരണത്തിന്റെ ആശയം സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
