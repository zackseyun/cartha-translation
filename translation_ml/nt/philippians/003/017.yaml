- from: സഹോദരന്മാരേ[a], എന്നെ അനുകരിക്കുന്നതിൽ നിങ്ങളെല്ലാവരും ഒന്നുചേരുക. നിങ്ങൾക്ക് ഞങ്ങൾ മാതൃകയായിരിക്കുന്നതുപോലെ, ഇങ്ങനെ നടക്കുന്നവരെ ശ്രദ്ധിച്ചുകൊള്ളുക.[b]
  to: സഹോദരന്മാരേ[a], എന്നെ അനുകരിക്കുന്നവരിൽ ചേരുക. ഞങ്ങൾ നിങ്ങൾക്കു മാതൃക[b]യായിരിക്കുന്നതുപോലെ, ഇങ്ങനെ നടക്കുന്നവരെ ശ്രദ്ധിച്ചുകൊള്ളുക.
  rationale: The revision preserves the source’s collective imperative without unnecessary added emphasis, retains the plural «ഞങ്ങൾ», and aligns footnote b’s content and placement with the audited lexical alternative for τύπον. The sentence order remains natural in Malayalam while keeping the comparison with Paul and his co-workers clear.
