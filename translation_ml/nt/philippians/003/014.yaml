source:
  edition: SBLGNT
  text: κατὰ σκοπὸν διώκω ⸀εἰς τὸ βραβεῖον τῆς ἄνω κλήσεως τοῦ θεοῦ ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/014.yaml
  text: I press on toward the goal for the prize of the upward call of God in Messiah Jesus[a][b].
translation:
  language: ml
  text: ഞാൻ ലക്ഷ്യത്തിലേക്കു മുന്നേറുന്നത് മിശിഹാ യേശുവിൽ ദൈവത്തിന്റെ മുകളിലേക്കുള്ള വിളിയുടെ സമ്മാനത്തിനായിട്ടാണ്.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സ്വർഗീയ വിളി” അല്ലെങ്കിൽ “മുകളിൽനിന്നുള്ള വിളി.”
    reason: lexical_alternative
  - marker: b
    text: 'ഗ്രീക്കിൽ: “ക്രിസ്തു യേശുവിൽ”; Χριστός ഇവിടെ ഒരു സ്ഥാനപ്പേരായതിനാൽ “മിശിഹാ യേശു” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ σκοπόν
  choice: ലക്ഷ്യത്തിലേക്ക്
  rationale: ഓട്ടമത്സരത്തിന്റെ പശ്ചാത്തലത്തിൽ ഒരു നിശ്ചിത ലക്ഷ്യത്തെ ഉന്നംവെച്ചുള്ള മുന്നേറ്റമാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്. ‘ലക്ഷ്യത്തിലേക്ക്’ എന്നത് ആ ദിശാബോധവും മത്സരരൂപകവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: διώκω
  choice: ഞാൻ ... മുന്നേറുന്നു
  rationale: ഇവിടെ ക്രിയ തീവ്രമായ പിന്തുടരലിനെയും ഓട്ടത്തിലെ അധ്വാനപൂർവമായ മുന്നേറ്റത്തെയും സൂചിപ്പിക്കുന്നു. ‘മുന്നേറുന്നു’ എന്നത് സന്ദർഭത്തിൽ സ്വാഭാവികവും ശക്തവുമാണ്.
- source_word: εἰς τὸ βραβεῖον
  choice: സമ്മാനത്തിനായി
  rationale: εἰς ഇവിടെ പരിശ്രമത്തിന്റെ ലക്ഷ്യം സൂചിപ്പിക്കുന്നു. ‘സമ്മാനത്തിനായി’ എന്നത് മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘നേടാൻ’ പോലുള്ള ക്രിയ ചേർക്കാതെ ആ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു.
- source_word: ἄνω
  choice: മുകളിലേക്കുള്ള
  rationale: ‘മുകളിലേക്കുള്ള’ എന്നത് ἄνω എന്നതിന്റെ സ്ഥലദിശാസൂചനയും മുന്നേറ്റത്തിന്റെ രൂപകവും നിലനിർത്തുന്നു; അതേസമയം ‘മുകളിൽനിന്നുള്ള’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: κλήσεως τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ ... വിളിയുടെ
  rationale: ഗ്രീക്കിലെ ജനിറ്റീവ് ഘടന നേരിട്ട് പ്രതിഫലിപ്പിക്കുകയും വിളി ദൈവത്തിന്റേതോ ദൈവത്തിൽനിന്നുള്ളതോ ആണെന്ന ആശയം തുറന്നുവെക്കുകയും ചെയ്യുന്നു.
- source_word: Χριστῷ
  choice: മിശിഹാ
  rationale: Χριστός ഇവിടെ അർഥസമ്പന്നമായ സ്ഥാനപ്പേരായി നിലകൊള്ളുന്നതിനാൽ ‘ക്രിസ്തു’ എന്ന രൂപത്തിനു പകരം അതിന്റെ പദവിസൂചക അർഥമായ ‘മിശിഹാ’ ഉപയോഗിച്ചു.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: മിശിഹാ യേശുവിൽ
  rationale: ἐν എന്ന ബന്ധവും പൗലോസിന്റെ ‘മിശിഹായിലുള്ള’ ഐക്യഭാഷയും നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἄνω κλήσεως എന്നതിന്റെ അർഥം
  choice: മുകളിലേക്കുള്ള വിളി
  alternative: സ്വർഗീയവിളി; മുകളിൽനിന്നുള്ള വിളി
  rationale: ഉടനെയുള്ള സന്ദർഭത്തിലെ ഓട്ടമത്സരരൂപകത്തോട് ‘മുകളിലേക്കുള്ള വിളി’ നന്നായി ചേരുന്നു. അതേസമയം വിളി മുകളിൽനിന്ന്, അഥവാ ദൈവത്തിൽനിന്ന്, വരുന്നു എന്ന വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി ഉപയോഗിച്ചു. ഓട്ടമത്സരരൂപകം വ്യക്തമായി നിലനിർത്തുകയും ἄνω എന്ന പദത്തിന്റെ ദിശാസൂചനയും ദൈവിക ഉറവിടസാധ്യതയും അനാവശ്യമായി ഒറ്റ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതിരിക്കുകയും ചെയ്തു.
