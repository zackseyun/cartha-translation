id: PHP.3.12
reference: Philippians 3:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οὐχ ὅτι ἤδη ἔλαβον ἢ ἤδη τετελείωμαι, διώκω δὲ εἰ καὶ καταλάβω, ἐφ’ ᾧ καὶ κατελήμφθην ὑπὸ ⸀Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/012.yaml
  text: Not that I have already received it or have already been perfected[c][b][a], but I press on to see if I may also take hold of that for which I too was taken hold of by Christ.
translation:
  language: ml
  text: ഞാൻ അത് ഇതിനകം നേടിയെന്നോ[a] ഇതിനകം പൂർണനാക്കപ്പെട്ടിട്ടുണ്ടെന്നോ[b] അല്ല. എന്നാൽ, ക്രിസ്തു[c] എന്നെ പിടിച്ചെടുത്തത് എന്തിനുവേണ്ടിയായിരുന്നോ, അതു എനിക്കും പിടിച്ചെടുക്കാൻ കഴിയുമോ എന്നു നോക്കി ഞാൻ മുന്നോട്ടു പ്രയത്നിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ലഭിച്ചിട്ടുണ്ടെന്നോ’ അല്ലെങ്കിൽ ‘കൈവരിച്ചിട്ടുണ്ടെന്നോ’ എന്നും പരിഭാഷപ്പെടുത്താം; ചുറ്റുമുള്ള സന്ദർഭത്തിൽനിന്ന് മനസ്സിലാകുന്ന കർമം ഗ്രീക്കിൽ വ്യക്തമാക്കിയിട്ടില്ല.
    reason: lexical_alternative
  - marker: b
    text: ‘ഇതിനകം പൂർണനായിട്ടുണ്ടെന്നോ’ അല്ലെങ്കിൽ ‘ഇതിനകം സമ്പൂർണനാക്കപ്പെട്ടിട്ടുണ്ടെന്നോ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: 'ഗ്രീക്ക്: ക്രിസ്റ്റോസ്; ‘മശീഹ’ എന്നും പരിഭാഷപ്പെടുത്താം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλαβον
  choice: നേടിയെന്നോ
  rationale: ചുറ്റുമുള്ള സന്ദർഭത്തിൽനിന്ന് മനസ്സിലാകുന്ന, ഗ്രീക്കിൽ വ്യക്തമാക്കാത്ത കർമത്തെ ‘അത്’ എന്നു ചേർത്തു. ‘നേടി’ എന്നത് ലഭിക്കുക/കൈവരിക്കുക എന്നീ അർഥങ്ങൾ സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: τετελείωμαι
  choice: പൂർണതയിലെത്തിക്കപ്പെട്ടെന്നോ
  rationale: ഗ്രീക്ക് perfect passive രൂപത്തിലെ കർമണിപ്രയോഗവും ഫലമായി നിലനിൽക്കുന്ന അവസ്ഥയും കാത്തുസൂക്ഷിക്കുന്നു; പാപരഹിത പൂർണതയെക്കുറിച്ചുള്ള പിൽക്കാല സിദ്ധാന്തം വാക്യത്തിൽ ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: διώκω
  choice: ഞാൻ അതിനെ പിന്തുടരുന്നു
  rationale: ലക്ഷ്യത്തെ നിരന്തരം പിന്തുടരുന്ന പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്ന διώκωയുടെ സജീവവും തുടരുന്നതുമായ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: καταλάβω
  choice: ഞാനും കൈവശമാക്കുമോ
  rationale: ലക്ഷ്യത്തെ പിടിച്ചെടുക്കുക/സ്വന്തമാക്കുക എന്ന മൂർത്തമായ ഭാവം നിലനിർത്തുകയും തുടർന്നുള്ള κατελήμφθην എന്ന ക്രിയയുമായുള്ള ശബ്ദാർഥബന്ധം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐφ’ ᾧ
  choice: എന്തിനായിരുന്നോ
  rationale: ക്രിസ്തു പൗലോസിനെ കൈവശമാക്കിയതിന്റെ ഉദ്ദേശ്യമോ ലക്ഷ്യമോ സൂചിപ്പിക്കുന്ന വായന സ്വീകരിക്കുന്നു; ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: κατελήμφθην
  choice: എന്നെ കൈവശമാക്കിയത്
  rationale: ഗ്രീക്കിലെ കർമണിഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി പുനരവതരിപ്പിക്കുകയും καταλάβωയുമായുള്ള ‘കൈവശമാക്കുക’ എന്ന ആവർത്തനബന്ധം കാത്തുസൂക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: Χριστοῦ
  choice: ക്രിസ്തു
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിൽ പേരുപോലെ പ്രവർത്തിക്കുന്ന പരിചിതരൂപം ഉപയോഗിക്കുന്നു; ‘മശീഹ’ എന്ന പദവിയർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: τετελείωμαι പാപരഹിത പൂർണതയെ സൂചിപ്പിക്കുന്നതായി പരിഭാഷപ്പെടുത്തണമോ
  choice: പൂർണതയിലെത്തിക്കപ്പെട്ടെന്നോ
  alternative: പൂർണനായെന്നോ / സമ്പൂർണനാക്കപ്പെട്ടെന്നോ
  rationale: പൗലോസ് താൻ പൂർത്തിയായ അവസ്ഥയിൽ എത്തിയിട്ടില്ലെന്ന് നിഷേധിക്കുന്നു; എന്നാൽ ആ അവസ്ഥയെ പിൽക്കാല സിദ്ധാന്തപരമായ വിഭാഗങ്ങളാൽ നിർവചിക്കുന്നില്ല. അതിനാൽ കർമണിഭാവവും പൂർത്തിയായ അവസ്ഥയുടെ ആശയവും മാത്രം നിലനിർത്തുന്നു.
- issue: ἐφ’ ᾧ എന്നതിന്റെ ബന്ധം ഉദ്ദേശ്യമോ കാരണമോ
  choice: ക്രിസ്തു എന്നെ കൈവശമാക്കിയത് എന്തിനായിരുന്നോ
  alternative: ക്രിസ്തു എന്നെ കൈവശമാക്കിയതുകൊണ്ട്
  rationale: സന്ദർഭത്തിലെ ലക്ഷ്യാന്വേഷണവുമായി ഉദ്ദേശ്യവായന നന്നായി ചേരുന്നു; എന്നിരുന്നാലും ഗ്രീക്ക് ഘടനയ്ക്ക് കാരണാർഥവായനയും സാദ്ധ്യമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘കൈവശമാക്കുക’ എന്ന ആവർത്തനം ഗ്രീക്കിലെ καταλάβω/κατελήμφθην പദപ്രയോഗബന്ധം ഉദ്ദേശപൂർവം നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദങ്ങൾക്ക് പിന്നാലെ മുഖ്യവാക്യത്തിൽ ചേർത്തിരിക്കുന്നു.
