id: PHP.3.21
reference: Philippians 3:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃς μετασχηματίσει τὸ σῶμα τῆς ταπεινώσεως ⸀ἡμῶν σύμμορφον τῷ σώματι τῆς δόξης αὐτοῦ κατὰ τὴν ἐνέργειαν τοῦ δύνασθαι αὐτὸν καὶ ὑποτάξαι ⸀αὑτῷ τὰ πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/021.yaml
  text: who will transform our lowly body to be like the body of his glory[c][b][a], by the power that enables him even to subject all things to himself.
translation:
  language: ml
  text: അവൻ നമ്മുടെ താഴ്മയുള്ള ശരീരത്തെ തന്റെ മഹിമയുള്ള ശരീരത്തോടു അനുരൂപമാകുന്നവിധം രൂപാന്തരപ്പെടുത്തും; സകലത്തെയും തനിക്കു കീഴ്പ്പെടുത്താൻപോലും കഴിയുന്ന തന്റെ പ്രവർത്തനശക്തിയാൽ അവൻ ഇതു ചെയ്യും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετασχηματίσει
  choice: രൂപാന്തരപ്പെടുത്തും
  rationale: രൂപത്തിലോ അവസ്ഥയിലോ യഥാർഥമായ മാറ്റം വരുത്തുക എന്ന ക്രിയയുടെ ശക്തിയും ഭാവികാലസൂചനയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τὸ σῶμα τῆς ταπεινώσεως ἡμῶν
  choice: നമ്മുടെ താഴ്മയുള്ള ശരീരം
  rationale: ഗ്രീക്കിലെ ബന്ധവാചകത്തിന്റെ അക്ഷരാർഥം ‘നമ്മുടെ താഴ്മയുടെ ശരീരം’ എന്നാണെങ്കിലും, ഇപ്പോഴത്തെ ശരീരാവസ്ഥയുടെ താഴ്മ വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്; ‘അപമാനം’ എന്ന പദം അനാവശ്യമായി സാമൂഹിക നിന്ദയെ മുൻനിർത്താം.
- source_word: σύμμορφον
  choice: സദൃശമാക്കി
  rationale: വെറും സാമ്യം മാത്രമല്ല, അതേ രൂപത്തോടുള്ള ശക്തമായ അനുരൂപതയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളവാക്യഘടനയിൽ ഫലസൂചന വ്യക്തമായി നൽകുന്നു.
- source_word: τῷ σώματι τῆς δόξης αὐτοῦ
  choice: തന്റെ മഹത്ത്വമുള്ള ശരീരത്തോടു
  rationale: ‘അവന്റെ മഹത്ത്വത്തിന്റെ ശരീരം’ എന്ന ഗ്രീക്ക് ബന്ധപ്രയോഗത്തെ, മഹത്ത്വത്താൽ വിശേഷിപ്പിക്കപ്പെടുന്ന ശരീരം എന്ന അർഥത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: κατὰ τὴν ἐνέργειαν
  choice: തന്റെ പ്രവർത്തനശക്തിയാൽ
  rationale: ἐνέργεια ഫലപ്രദമായി പ്രവർത്തിക്കുന്ന ശക്തിയെ സൂചിപ്പിക്കുന്നു. ‘പ്രവർത്തനത്തിനനുസരിച്ച്’ എന്ന കൂടുതൽ രൂപാനുസൃതമായ വിവർത്തനത്തേക്കാൾ സന്ദർഭത്തിൽ സ്വാഭാവികമാണ്.
- source_word: τοῦ δύνασθαι αὐτὸν καὶ ὑποτάξαι αὑτῷ τὰ πάντα
  choice: സകലത്തെയും തനിക്കു കീഴ്പ്പെടുത്താൻപോലും കഴിയുന്ന
  rationale: ക്രിസ്തുവിന്റെ കഴിവിനെയും τὰ πάντα എന്ന സമഗ്ര വ്യാപ്തിയെയും നിലനിർത്തുന്നു; ‘പോലും’ καίയുടെ ഊന്നൽ അറിയിക്കുന്നു.
theological_decisions:
- issue: വിശ്വാസികളുടെ ഇപ്പോഴത്തെ ശരീരത്തിന്റെ താഴ്മയും ഭാവിയിലെ മഹത്ത്വപരിവർത്തനവും തമ്മിലുള്ള ബന്ധം
  choice: ഇപ്പോഴത്തെ താഴ്മയുള്ള ശരീരം ക്രിസ്തുവിന്റെ മഹത്ത്വമുള്ള ശരീരത്തോടു സദൃശമായി ഭാവിയിൽ രൂപാന്തരപ്പെടുമെന്ന് പറയുന്നു.
  alternative: ‘പുനരുത്ഥാനം’ എന്ന പദം നേരിട്ട് ചേർത്ത് സംഭവത്തിന്റെ രീതി കൂടുതൽ വ്യക്തമാക്കുക.
  rationale: വാക്യം ശരീരത്തിന്റെ ഭാവിപരിവർത്തനവും ക്രിസ്തുവിന്റെ ശരീരത്തോടുള്ള അനുരൂപതയും ഉറപ്പിക്കുന്നു; എന്നാൽ അതിന്റെ പ്രക്രിയ ഇവിടെ വിശദീകരിക്കാത്തതിനാൽ അധിക സിദ്ധാന്തഭാഷ ചേർത്തിട്ടില്ല.
- issue: പരിവർത്തനത്തിന് ആധാരമായ ἐνέργεια
  choice: സകലത്തെയും കീഴ്പ്പെടുത്താൻ ക്രിസ്തുവിനു കഴിയുന്ന തന്റെ പ്രവർത്തനശക്തിയായി അവതരിപ്പിച്ചു.
  alternative: ക്രിസ്തുവിനെ പ്രാപ്തനാക്കുന്ന ബാഹ്യമായ ഒരു ശക്തിയായി അവതരിപ്പിക്കുക.
  rationale: ഗ്രീക്ക് ക്രിസ്തുവിന്റെ ഫലപ്രദമായ കഴിവിനെയാണ് സൂചിപ്പിക്കുന്നത്; ശക്തി അവനു പുറത്തുനിന്നുള്ളതാണെന്ന അനാവശ്യ ധാരണ ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘രൂപാന്തരപ്പെടുത്തും’, ‘സദൃശമാക്കി’, ‘കീഴ്പ്പെടുത്തുക’ എന്നിവ മൂലപാഠത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; അക്ഷരാർഥമുള്ള ഗ്രീക്ക് ബന്ധപ്രയോഗങ്ങൾ അടിക്കുറിപ്പുകളിൽ നൽകിയിരിക്കുന്നു.
