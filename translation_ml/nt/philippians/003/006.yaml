id: PHP.3.6
reference: Philippians 3:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: κατὰ ⸀ζῆλος διώκων τὴν ἐκκλησίαν, κατὰ δικαιοσύνην τὴν ἐν νόμῳ γενόμενος ἄμεμπτος.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/006.yaml
  text: as to zeal[a], persecuting the church; as to righteousness under the law[b], having become blameless.
translation:
  language: ml
  text: ഉത്സാഹത്തിന്റെ കാര്യത്തിൽ, സഭയെ പീഡിപ്പിച്ചവൻ; ന്യായപ്രമാണത്തിലുള്ള നീതിയുടെ കാര്യത്തിൽ, കുറ്റമറ്റവനായിത്തീർന്നവൻ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ
  choice: കാര്യത്തിൽ
  rationale: മൂലപാഠത്തിലെ ആവർത്തിതമായ വിലയിരുത്തൽവിഭാഗങ്ങളെ സ്വാഭാവിക മലയാളത്തിൽ അടയാളപ്പെടുത്തുകയും വാക്യത്തിന്റെ സമാന്തരഘടന നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ζῆλος
  choice: തീക്ഷ്ണത
  rationale: മതപരമായ പ്രതിബദ്ധതയുടെ തീവ്രത വ്യക്തമാക്കുന്ന സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളപദം.
- source_word: διώκων
  choice: പീഡിപ്പിച്ചവൻ
  rationale: ഇവിടെ വെറും പിന്തുടരലല്ല, സഭയ്ക്കെതിരായ ശത്രുതാപരമായ നടപടിയാണ് ഉദ്ദേശിക്കുന്നത്; സന്ദർഭത്തിൽ പൂർത്തിയായ മുൻകാലജീവിതത്തെ മലയാളത്തിൽ വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἐκκλησίαν
  choice: സഭയെ
  rationale: പൗലോസിന്റെ സന്ദർഭത്തിൽ ക്രിസ്തീയ വിശ്വാസിസമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘സഭ’യാണ് നിലവാരമുള്ളതും വ്യാപകമായി മനസ്സിലാക്കപ്പെടുന്നതുമായ പദം.
- source_word: δικαιοσύνην
  choice: നീതി
  rationale: ന്യായപ്രമാണം മാനദണ്ഡമാക്കുന്ന ശരിയായ നിലയെയോ പെരുമാറ്റത്തെയോ മലയാളത്തിൽ സംക്ഷിപ്തമായി അറിയിക്കുന്നു; ‘നീതീകരണം’ എന്ന കൂടുതൽ സാങ്കേതിക ആശയം അനാവശ്യമായി ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: ἐν νόμῳ
  choice: ന്യായപ്രമാണത്തിലുള്ള
  rationale: ഗ്രീക്കിലെ ‘പ്രമാണത്തിൽ’ എന്ന മേഖല/മാനദണ്ഡബന്ധം നേരിട്ട് നിലനിർത്തുന്നു; ‘ന്യായപ്രമാണത്തിൻ കീഴിലുള്ള’ എന്നും പറയാമെങ്കിലും അത് ഇവിടെ ഇല്ലാത്ത അധിക അധീനതാഭാവം ശക്തമാക്കാം.
- source_word: γενόμενος
  choice: ആയിത്തീർന്നവൻ
  rationale: γενόμενος എന്ന പങ്കുപദത്തിന്റെ സംഭവാത്മകവും പൂർത്തിയായതുമായ ഭാവം നിലനിർത്തുന്നു; വെറും ‘കുറ്റമറ്റവൻ’ എന്നു ചുരുക്കുന്നില്ല.
- source_word: ἄμεμπτος
  choice: കുറ്റമറ്റവൻ
  rationale: പ്രസ്താവിച്ചിരിക്കുന്ന ന്യായപ്രമാണപരമായ വിലയിരുത്തലിൽ കുറ്റാരോപണത്തിന് ഇടയില്ലാത്ത നില സൂചിപ്പിക്കുന്നു; സമ്പൂർണ പാപരാഹിത്യം നിർബന്ധമായി അർഥമാക്കുന്നില്ല.
theological_decisions:
- issue: പൗലോസ് അവകാശപ്പെടുന്ന കുറ്റമറ്റ നിലയുടെ പരിധി
  choice: ‘ന്യായപ്രമാണത്തിലുള്ള നീതിയുടെ കാര്യത്തിൽ’ എന്ന പരിധിക്കുള്ളിൽ കുറ്റമറ്റവനായിത്തീർന്നു എന്നാണ് വാക്യം പറയുന്നത്.
  alternative: ദൈവസന്നിധിയിൽ സമ്പൂർണ പാപരാഹിത്യം അവകാശപ്പെടുന്നു; അല്ലെങ്കിൽ പ്രസ്താവന പൂർണമായും പരിഹാസാത്മകമാണ്.
  rationale: ἄμεμπτος എന്നത് δικαιοσύνη τὴν ἐν νόμῳ എന്ന പരിധിയോടാണ് വ്യാകരണപരമായി ബന്ധപ്പെടുന്നത്. അതിനാൽ അവകാശവാദത്തെ സമ്പൂർണ ധാർമിക പരിപൂർണതയായി വികസിപ്പിക്കാതെയും പരിഹാസമായി ചുരുക്കാതെയും വിവർത്തനം ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. മൂലപാഠത്തിലെ രണ്ട് κατὰ ഘടകങ്ങളുടെ സമാന്തരത ‘…കാര്യത്തിൽ’ എന്ന ആവർത്തനത്തിലൂടെ നിലനിർത്തി. ഈ വാക്യത്തിൽ യഥാർത്ഥ അർഥവ്യത്യാസം വ്യക്തമാക്കാൻ അനിവാര്യമായ അടിക്കുറിപ്പ് ഇല്ലാത്തതിനാൽ അടിക്കുറിപ്പുകൾ ചേർത്തിട്ടില്ല.
