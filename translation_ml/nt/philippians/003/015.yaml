id: PHP.3.15
reference: Philippians 3:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅσοι οὖν τέλειοι, τοῦτο φρονῶμεν· καὶ εἴ τι ἑτέρως φρονεῖτε, καὶ τοῦτο ὁ θεὸς ὑμῖν ἀποκαλύψει·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/015.yaml
  text: Therefore[a], all of us who are mature should think this way; and if you think differently about anything[b], God will reveal this also to you.
translation:
  language: ml
  text: 'ഫിലിപ്പിയർ 3:15


    അതുകൊണ്ട്, നമ്മിൽ പക്വതയുള്ളവർ[a] എല്ലാവരും ഇങ്ങനെ ചിന്തിക്കാം[b]. ഏതെങ്കിലും കാര്യത്തിൽ നിങ്ങൾ വ്യത്യസ്തമായി ചിന്തിക്കുന്നുവെങ്കിൽ, അതും ദൈവം നിങ്ങൾക്കു വെളിപ്പെടുത്തും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “പൂർണരായവർ.” ഗ്രീക്ക് τέλειοι എന്ന പദത്തിന് “പൂർണർ” എന്നും അർഥമാകാം; എന്നാൽ ഇവിടെ അത് ആത്മീയ പക്വതയെ സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “ഈ മനോഭാവം പുലർത്താം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യങ്ങളിലെ വാദത്തിൽനിന്നുള്ള നിഗമനത്തിലേക്കുള്ള പൗലോസിന്റെ നീക്കം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὅσοι
  choice: നമ്മിൽ ... എല്ലാവരും
  rationale: സംസാരിക്കുന്നവനെയും അഭിസംബോധന ചെയ്യപ്പെടുന്ന കൂട്ടത്തെയും ഉൾക്കൊള്ളുന്ന വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: τέλειοι
  choice: പക്വതയുള്ളവർ
  rationale: ഇവിടെ സമ്പൂർണ പാപരാഹിത്യമല്ല, ലക്ഷ്യത്തിലേക്കു മുന്നേറുന്നവരുടെ ആത്മീയ പക്വതയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; ‘പൂർണരായവർ’ എന്ന യഥാർഥ പദസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: τοῦτο φρονῶμεν
  choice: ഇങ്ങനെ ചിന്തിക്കാം
  rationale: τοῦτο മുൻസന്ദർഭത്തിൽ വിവരിച്ച മനോഭാവത്തെ സൂചിപ്പിക്കുന്നു; hortatory subjunctive ആയ φρονῶμεν-ന്റെ ‘നമുക്ക്’ എന്ന ആഹ്വാനഭാവം ‘ചിന്തിക്കാം’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: εἴ τι ἑτέρως φρονεῖτε
  choice: ഏതെങ്കിലും കാര്യത്തിൽ നിങ്ങൾ വ്യത്യസ്തമായി ചിന്തിക്കുന്നുവെങ്കിൽ
  rationale: നിബന്ധനാഭാവവും അഭിപ്രായത്തിലോ മനോഭാവത്തിലോ ഏതു വിഷയത്തിലും ഉണ്ടാകാവുന്ന വ്യത്യാസത്തിന്റെ തുറന്ന വ്യാപ്തിയും സംരക്ഷിക്കുന്നു.
- source_word: ἀποκαλύψει
  choice: വെളിപ്പെടുത്തും
  rationale: ദൈവിക വെളിപ്പെടുത്തലിന്റെ അർഥസാന്ദ്രതയും ഭാവികാലവും നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: τέλειοι എന്ന പദത്തിന്റെ അർഥം
  choice: പക്വതയുള്ളവർ
  alternative: പൂർണരായവർ
  rationale: താൻ ഇതിനകം പൂർണനായിട്ടില്ലെന്ന് പൗലോസ് തൊട്ടുമുമ്പ് പറയുന്നതിനാൽ, ഇവിടെ ആത്മീയമായി പക്വരായവരെയാണ് പ്രധാനമായി ഉദ്ദേശിക്കുന്നത്. എന്നിരുന്നാലും, ‘പൂർണർ’ എന്ന പദസാധ്യത അടിക്കുറിപ്പിലൂടെ തുറന്നുവെക്കുന്നു.
- issue: φρονῶμεν എന്ന ക്രിയയുടെ ആഹ്വാനഭാവം
  choice: ഇങ്ങനെ ചിന്തിക്കാം
  alternative: ഈ മനോഭാവം പുലർത്താം
  rationale: ആദ്യപുരുഷ ബഹുവചന hortatory subjunctive-ന്റെ ഉൾക്കൊള്ളുന്ന ആഹ്വാനം നിലനിർത്തുന്നു; ചിന്തയും മനോഭാവവും ഉൾപ്പെടുന്ന φρονέω-യുടെ വിശാലത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ഇങ്ങനെ ചിന്തിക്കാം’ എന്നത് പൗലോസ് സ്വയം ഉൾപ്പെടുന്ന ആഹ്വാനത്തെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; സാങ്കേതികമോ വിഭാഗീയമോ ആയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
