  source_fidelity: The translation accurately conveys the inferential οὖν (“അതുകൊണ്ട്”), the inclusive scope of ὅσοι with the first-person hortatory exhortation, τέλειοι as maturity rather than sinless perfection, and the conditional statement that God will disclose the matter to those thinking otherwise. “അതും” suitably represents καὶ τοῦτο (“this also”).
