id: PHP.3.2
reference: Philippians 3:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Βλέπετε τοὺς κύνας, βλέπετε τοὺς κακοὺς ἐργάτας, βλέπετε τὴν κατατομήν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/002.yaml
  text: Watch out for the dogs[a]; watch out for the evil workers[c][b]; watch out for the mutilation.
translation:
  language: ml
  text: നായ്ക്കളെ സൂക്ഷിച്ചുകൊള്ളുവിൻ; ദുഷ്ടപ്രവർത്തകരെ സൂക്ഷിച്ചുകൊള്ളുവിൻ; അംഗഛേദനത്തെ[a] സൂക്ഷിച്ചുകൊള്ളുവിൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ അക്ഷരാർഥം ‘അംഗഛേദനം’ അഥവാ ‘വെട്ടിമുറിക്കൽ.’ അടുത്ത വാക്യത്തിലെ ‘പരിച്ഛേദനം’ എന്ന പദത്തോടുള്ള കടുത്ത പദകളിയാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπετε
  choice: സൂക്ഷിച്ചുകൊള്ളുവിൻ
  rationale: വർത്തമാനകാല ആജ്ഞാരൂപം അടിയന്തരമായ മുന്നറിയിപ്പാണ്; മൂന്നു പ്രാവശ്യം ആവർത്തിച്ചിരിക്കുന്ന ഘടനയും ഊന്നലും അതേപടി നിലനിർത്തുന്നു.
- source_word: τοὺς κύνας
  choice: നായ്ക്കളെ
  rationale: കടുത്ത നിന്ദാസൂചകമായ രൂപകം വ്യാഖ്യാനിച്ച് മയപ്പെടുത്താതെ നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: τοὺς κακοὺς ἐργάτας
  choice: ദുഷ്ടപ്രവർത്തകരെ
  rationale: κακούς എന്നതിന്റെ ധാർമിക തീവ്രതയും ἐργάτας എന്നതിന്റെ പ്രവർത്തകർ എന്ന സാധാരണ അർഥവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: τὴν κατατομήν
  choice: അംഗഛേദനക്കാരെ
  rationale: κατατομή എന്ന നിന്ദാസൂചക പദത്തിന്റെ അംഗവിച്ഛേദന/വെട്ടിമുറിക്കൽ എന്ന ശക്തി നിലനിർത്തുകയും, വ്യക്തികളെ സൂചിപ്പിക്കുന്ന സമാന്തര പട്ടികയിൽ സ്വാഭാവികമായ മലയാളം നൽകുകയും ചെയ്യുന്നു; ഗ്രീക്കിൽ ഇത് അക്ഷരാർഥത്തിൽ അമൂർത്തനാമമാണെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ചുറ്റുമുള്ള പരിച്ഛേദനഭാഷയോടുള്ള ബന്ധത്തിൽ κατατομήν എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: നിന്ദാസൂചകമായ ‘അംഗഛേദനക്കാർ’ എന്നു പരിഭാഷപ്പെടുത്തി, ഗ്രീക്കിലെ അമൂർത്തനാമവും അടുത്ത വാക്യത്തിലെ പദവിന്യാസവും അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുക.
  alternative: ‘അംഗഛേദനം’ അല്ലെങ്കിൽ ‘വെട്ടിമുറിക്കൽ’
  rationale: പൗലോസ് സാധാരണ ‘പരിച്ഛേദനം’ എന്ന പദത്തിനു പകരം ഉദ്ദേശപൂർവം കടുത്ത എതിർപദം ഉപയോഗിക്കുന്നു. പ്രധാനവാക്യത്തിലെ മലയാളം അഭിസംബോധന ചെയ്യുന്ന കൂട്ടത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുമ്പോഴും അതിന്റെ വാഗ്വൈഭവവും ദൈവശാസ്ത്രപരമായ മുറിപ്പാടും മയപ്പെടുത്തുന്നില്ല.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ മലയാളം. ഒരേ ആജ്ഞ മൂന്നു പ്രാവശ്യം ആവർത്തിച്ച് മൂലപാഠത്തിന്റെ അടിയന്തരതയും താളവും സംരക്ഷിച്ചിരിക്കുന്നു. ‘നായ്ക്കൾ’ എന്ന കടുത്ത രൂപകം മയപ്പെടുത്തിയിട്ടില്ല.
