id: PHP.3.5
reference: Philippians 3:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: περιτομῇ ὀκταήμερος, ἐκ γένους Ἰσραήλ, φυλῆς Βενιαμίν, Ἑβραῖος ἐξ Ἑβραίων, κατὰ νόμον Φαρισαῖος,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/005.yaml
  text: circumcised on the eighth day, from the people of Israel, of the tribe of Benjamin, a Hebrew from Hebrews; according to the law, a Pharisee,
translation:
  language: ml
  text: എട്ടാം ദിവസം പരിച്ഛേദനയേറ്റവൻ, ഇസ്രായേൽ വംശത്തിൽപ്പെട്ടവൻ, ബെന്യാമീൻ ഗോത്രക്കാരൻ, എബ്രായരിൽനിന്നുള്ള എബ്രായൻ[a]; നിയമത്തിന്റെ കാര്യത്തിൽ പരീശൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘എബ്രായ മാതാപിതാക്കൾക്കു ജനിച്ച എബ്രായൻ’; പൗലോസിന്റെ എബ്രായ വംശപരമ്പരയ്ക്കും സ്വത്വത്തിനും ഊന്നൽ നൽകുന്ന പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιτομῇ ὀκταήμερος
  choice: എട്ടാം ദിവസം പരിച്ഛേദനയേറ്റവൻ
  rationale: ഗ്രീക്കിലെ സങ്കുചിതമായ പ്രയോഗത്തെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുകയും യഹൂദ ഉടമ്പടിയുടെ അടയാളമായ പരിച്ഛേദന വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ἐκ γένους Ἰσραήλ
  choice: ഇസ്രായേൽ ജനത്തിൽപ്പെട്ടവൻ
  rationale: γένος ഇവിടെ ജനസമൂഹപരവും വംശപരവുമായ ഉത്ഭവത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ പ്രയോഗം ആ അവകാശവാദം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: φυλῆς Βενιαμίν
  choice: ബെന്യാമീൻ ഗോത്രക്കാരൻ
  rationale: ഗോത്രപരമായ വംശബന്ധം ചുരുക്കമായും സ്വാഭാവികമായും വ്യക്തമാക്കുന്നു.
- source_word: Ἑβραῖος ἐξ Ἑβραίων
  choice: എബ്രായരിൽനിന്നുള്ള എബ്രായൻ
  rationale: ഗ്രീക്കിലെ ഊന്നലും സങ്കുചിതത്വവും നിലനിർത്തുന്നു; മാതാപിതൃവംശത്തെയും എബ്രായ സ്വത്വത്തെയും സൂചിപ്പിക്കാവുന്ന പ്രയോഗത്തിന്റെ പരിധി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: κατὰ νόμον
  choice: നിയമത്തിന്റെ കാര്യത്തിൽ
  rationale: κατά എന്നതിന്റെ മാനദണ്ഡമോ പരിഗണനാവിഷയമോ സൂചിപ്പിക്കുന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘ആചരണം’ പോലുള്ള ആശയം ചേർക്കുന്നില്ല.
- source_word: Φαρισαῖος
  choice: പരീശൻ
  rationale: ഈ യഹൂദ മതവിഭാഗത്തിനായി മലയാള ബൈബിൾ ഭാഷയിൽ സ്ഥാപിതവും പൊതുവേ മനസ്സിലാകുന്നതുമായ രൂപമാണ്.
theological_decisions:
- issue: νόμος എന്ന പദത്തിന്റെ പരിധി
  choice: നിയമം
  alternative: മോശയുടെ നിയമം / ന്യായപ്രമാണം
  rationale: മൂലപാഠത്തിൽ νόμος മാത്രമാണുള്ളത്. സന്ദർഭത്തിൽ മോശയുടെ നിയമം ഉദ്ദേശിക്കപ്പെടുന്നുവെങ്കിലും അത് മുഖ്യപാഠത്തിൽ വിശദീകരിച്ച് ചേർക്കാതെ മൂലത്തിന്റെ സംക്ഷിപ്തതയും ആശയപരിധിയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും വായിക്കാൻ എളുപ്പമുള്ളതുമായ മലയാളം. വാക്യം മുൻപും പിന്നാലെയുമുള്ള പട്ടികയുടെ ഭാഗമായതിനാൽ മൂലത്തിലെ സമാന്തരവും സംക്ഷിപ്തവുമായ ഘടന നിലനിർത്തിയിരിക്കുന്നു.
