id: PHP.2.1
reference: Philippians 2:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εἴ τις οὖν παράκλησις ἐν Χριστῷ, εἴ τι παραμύθιον ἀγάπης, εἴ τις κοινωνία πνεύματος, εἴ τις σπλάγχνα καὶ οἰκτιρμοί,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/001.yaml
  text: So if there is any encouragement in Messiah[a], if any comfort from love, if any fellowship of the Spirit, if any affection and compassion,
translation:
  language: ml
  text: അതുകൊണ്ട്, മശീഹയിൽ എന്തെങ്കിലും പ്രോത്സാഹനമുണ്ടെങ്കിൽ, സ്നേഹത്തിൽനിന്ന് എന്തെങ്കിലും ആശ്വാസമുണ്ടെങ്കിൽ, ആത്മാവിന്റെ കൂട്ടായ്മയുണ്ടെങ്കിൽ[a], എന്തെങ്കിലും വാത്സല്യവും കരുണയും ഉണ്ടെങ്കിൽ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആത്മാവിലുള്ള പങ്കാളിത്തം”; സാധ്യത കുറവായി, “ആത്മീയമായ കൂട്ടായ്മ.”
    reason: κοινωνία πνεύματος എന്ന പ്രയോഗത്തിലെ ജനിറ്റീവ് ബന്ധവും πνεῦμα എന്നതിന്റെ സൂചനയും ഒന്നിലധികം വിധത്തിൽ ഗ്രഹിക്കാം.
lexical_decisions:
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻസന്ദർഭത്തിൽനിന്നുള്ള നിഗമനബന്ധം വ്യക്തമായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: παράκλησις
  choice: പ്രോത്സാഹനം
  rationale: സാന്ത്വനവും ശക്തിപ്പെടുത്തലും ഉൾക്കൊള്ളുന്ന സന്ദർഭോചിതമായ അർഥം; ‘പ്രബോധനം’ എന്നതുപോലെ കല്പനാത്മകമായി ചുരുക്കുന്നില്ല.
- source_word: ἐν Χριστῷ
  choice: മശീഹയിൽ
  rationale: Χριστός എന്ന പദത്തിന്റെ സ്ഥാനപ്പേരായ അർഥം നിലനിർത്തുകയും ἐν എന്നതിന്റെ അടിസ്ഥാനബന്ധം പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: παραμύθιον
  choice: ആശ്വാസം
  rationale: സാന്ത്വനത്തിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു; മുമ്പുള്ള παράκλησις എന്ന പദത്തിൽനിന്നുള്ള സൂക്ഷ്മ വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: ἀγάπης
  choice: സ്നേഹത്തിൽനിന്ന്
  rationale: സ്നേഹം ആശ്വാസത്തിന്റെ ഉറവിടമാണെന്ന സാധ്യതയുള്ള ജനിറ്റീവ് ബന്ധം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: κοινωνία
  choice: കൂട്ടായ്മ
  rationale: ബന്ധപരവും സമൂഹപരവുമായ പങ്കാളിത്തത്തെ സൂചിപ്പിക്കുന്ന പരിചിതവും സ്വാഭാവികവുമായ മലയാളപദം.
- source_word: πνεύματος
  choice: ആത്മാവിന്റെ
  rationale: ഇവിടെ പരിശുദ്ധാത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നതെന്ന ഏറ്റവും സാധ്യതയുള്ള വായന സ്വീകരിക്കുന്നു; ജനിറ്റീവ് ബന്ധത്തിലെ അവ്യക്തത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: σπλάγχνα
  choice: വാത്സല്യം
  rationale: അക്ഷരാർഥത്തിലുള്ള ആന്തരാവയവങ്ങളെക്കാൾ, ആഴമുള്ള ആർദ്രസ്നേഹത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ഭാവാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: οἰκτιρμοί
  choice: കരുണ
  rationale: ആധുനിക മലയാളത്തിൽ വ്യക്തവും മാന്യവുമായ പദം; ‘വാത്സല്യം’ എന്നതോടൊപ്പം മൂലത്തിലെ വികാരപരമായ ജോടി നിലനിർത്തുന്നു.
theological_decisions:
- issue: πνεύματος പരിശുദ്ധാത്മാവിനെയാണോ സൂചിപ്പിക്കുന്നത്, κοινωνίαയോടുള്ള ജനിറ്റീവ് ബന്ധം എങ്ങനെ പ്രകടിപ്പിക്കണം
  choice: ആത്മാവിന്റെ കൂട്ടായ്മ
  alternative: ആത്മാവിലുള്ള പങ്കാളിത്തം; ആത്മീയമായ കൂട്ടായ്മ
  rationale: പൗലോസിന്റെ പ്രയോഗവും ക്രിസ്തീയ അനുഗ്രഹങ്ങളുടെ ഈ നിരയും കണക്കിലെടുക്കുമ്പോൾ പരിശുദ്ധാത്മാവാണ് ഏറ്റവും സാധ്യതയുള്ള സൂചന. എന്നാൽ ഗ്രീക്ക് ജനിറ്റീവ് ബന്ധം പൂർണമായി നിർവചിക്കാത്തതിനാൽ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. വാക്യം അടുത്ത വാക്യത്തിൽ പൂർത്തിയാകുന്ന നിബന്ധനാപട്ടികയായതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തിയിരിക്കുന്നു.
