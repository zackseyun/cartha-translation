revisions:
- from: 'എന്നാൽ അവന്റെ പരീക്ഷിക്കപ്പെട്ട സ്വഭാവം നിങ്ങൾക്കറിയാം[a]: ഒരു കുഞ്ഞ് പിതാവിനോടൊപ്പമെന്നപോലെ, സുവിശേഷത്തിനുവേണ്ടി അവൻ എന്നോടൊപ്പം സേവിച്ചു[b].'
  to: എന്നാൽ, ഒരു കുട്ടി പിതാവിനോടൊപ്പം സേവിക്കുന്നതുപോലെ[b], അവൻ എന്നോടൊപ്പം സുവിശേഷത്തിനുവേണ്ടി സേവിച്ചതായി അവന്റെ പരീക്ഷണങ്ങളിലൂടെ തെളിയിക്കപ്പെട്ട സ്വഭാവം നിങ്ങൾക്കറിയാം[a].
