id: PHP.2.21
reference: Philippians 2:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ πάντες γὰρ τὰ ἑαυτῶν ζητοῦσιν, οὐ τὰ ⸂Ἰησοῦ Χριστοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/021.yaml
  text: For they all seek their own interests[a], not those of Jesus the Messiah.
translation:
  language: ml
  text: എന്തെന്നാൽ, എല്ലാവരും സ്വന്തം താത്പര്യങ്ങൾ തേടുന്നു; യേശു മശീഹായുടേതല്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യേശുക്രിസ്തുവിന്റേതല്ല.’
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πάντες
  choice: എല്ലാവരും
  rationale: നിശ്ചയോപപദത്തോടുകൂടിയ ബഹുവചനം ഇവിടെ വ്യക്തികളെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു; ‘എല്ലാവരും’ ആ ഊന്നൽ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിന് കാരണം നൽകുന്ന വിശദീകരണബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: τὰ ἑαυτῶν
  choice: സ്വന്തം താത്പര്യങ്ങൾ
  rationale: സ്വന്തമായി ബന്ധപ്പെട്ട കാര്യങ്ങളെ സൂചിപ്പിക്കുന്ന നപുംസകലിംഗ ബഹുവചന പ്രയോഗം സന്ദർഭത്തിൽ സ്വാർത്ഥമായ താത്പര്യങ്ങളെ സൂചിപ്പിക്കുന്നു; ഈ തിരഞ്ഞെടുപ്പ് വിരോധാഭാസം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ζητοῦσιν
  choice: അന്വേഷിക്കുന്നു
  rationale: ‘തേടുക/അന്വേഷിക്കുക’ എന്ന അടിസ്ഥാന അർഥം നിലനിർത്തുകയും ഇരു ഭാഗങ്ങൾക്കിടയിലെ നൈതിക വിരോധം അതിരുകടന്ന് വ്യാഖ്യാനിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: τὰ Ἰησοῦ Χριστοῦ
  choice: യേശു മശീഹായുടെ താത്പര്യങ്ങൾ
  rationale: ആവർത്തിക്കുന്ന നപുംസകലിംഗ ബഹുവചനം മുൻപുള്ള ‘താത്പര്യങ്ങൾ’ എന്ന ആശയത്തിലേക്കാണ് ചൂണ്ടുന്നത്. Χριστός ഇവിടെ പദവിനാമമായി ‘മശീഹാ’ എന്നു പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ എന്ന പ്രയോഗത്തിലെ Χριστοῦ-യുടെ പരിഭാഷ
  choice: യേശു മശീഹാ
  alternative: യേശുക്രിസ്തു
  rationale: Χριστός-ന്റെ അഭിഷിക്തൻ എന്ന പദവിനാമാർഥം ‘മശീഹാ’ നിലനിർത്തുന്നു; മലയാളത്തിൽ സുപരിചിതമായ ‘യേശുക്രിസ്തു’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ വിശദീകരണബന്ധവും ‘സ്വന്തം താത്പര്യങ്ങൾ/യേശു മശീഹായുടെ താത്പര്യങ്ങൾ’ എന്ന സമാന്തരവിരോധവും വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു.
