  source_fidelity: ‘അതുകൊണ്ട് ദൈവവും’ διὸ καὶയുടെ നിഗമനവും കൂട്ടിച്ചേർക്കൽഭാവവും സൂക്ഷിക്കുന്നു. ‘അത്യന്തം ഉയർത്തി’ ὑπερύψωσεν എന്ന തീവ്രക്രിയയ്ക്ക് യോജിച്ചതാണ്. ‘കൃപയോടെ നൽകി’ ἐχαρίσατοയുടെ അനുഗ്രഹപൂർവക/കൃപാഭാവം പ്രകടമാക്കുന്നു. ‘എല്ലാ നാമത്തിനും മീതെയുള്ള നാമം’ τὸ ὄνομα τὸ ὑπὲρ πᾶν ὄνομα എന്ന ഘടനയും വാക്യത്തിലെ ഉദ്ദേശ്യപൂർവമായ തുറന്ന നിലയും നിലനിർത്തുന്നു.
