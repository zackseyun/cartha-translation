id: PHP.2.9
reference: Philippians 2:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διὸ καὶ ὁ θεὸς αὐτὸν ὑπερύψωσεν, καὶ ἐχαρίσατο αὐτῷ ⸀τὸ ὄνομα τὸ ὑπὲρ πᾶν ὄνομα,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/009.yaml
  text: Therefore God also highly exalted him and graciously gave him the name that is above every name[b][a],
translation:
  language: ml
  text: അതുകൊണ്ട് ദൈവവും അവനെ അത്യന്തം ഉയർത്തി, എല്ലാ നാമത്തിനും മീതെയുള്ള നാമം[b] അവന് കൃപയോടെ നൽകി[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കൃപയോടെ നൽകി’ എന്നതിന് ‘പ്രദാനം ചെയ്തു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘നാമം’ എന്നത് ഉച്ചരിക്കപ്പെടുന്ന ഒരു പേര് മാത്രമല്ല, പദവി, സ്ഥാനമാനം, അല്ലെങ്കിൽ ബിരുദം എന്നിവയെയും സൂചിപ്പിക്കാം; ഏത് നാമമാണ് ഉദ്ദേശിക്കുന്നതെന്ന് ഈ വാക്യം തന്നെ വ്യക്തമാക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ καὶ
  choice: അതുകൊണ്ട് ദൈവവും
  rationale: διό എന്നതിന്റെ നിഗമനാർഥവും καί എന്നതിന്റെ കൂട്ടിച്ചേർക്കൽഭാവവും സ്വാഭാവികമായ മലയാളവാക്യക്രമത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὁ θεὸς
  choice: ദൈവം
  rationale: ഗ്രീക്കിൽ കർത്താവ് വ്യക്തവും നിർദ്ദിഷ്ടവുമാണ്; ദൈവത്തെ സൂചിപ്പിക്കുന്ന സാധാരണ മലയാളപ്രയോഗം ഉപയോഗിച്ചു.
- source_word: ὑπερύψωσεν
  choice: അത്യന്തം ഉയർത്തി
  rationale: സംയുക്തക്രിയയുടെ തീവ്രത നിലനിർത്തുകയും ‘ഏറ്റവും ഉന്നതമായ സ്ഥാനം നൽകി’ എന്ന വ്യാഖ്യാനത്തിലേക്ക് വാചകത്തെ ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐχαρίσατο
  choice: കൃപയോടെ നൽകി
  rationale: χάρις എന്ന പദകുടുംബവുമായുള്ള ബന്ധത്തിലെ കൃപാഭാവം പ്രകടമാക്കുന്നു; അതേസമയം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: τὸ ὄνομα
  choice: നാമം
  rationale: ഗ്രീക്ക് പദത്തെ നേരിട്ട് നിലനിർത്തുന്നു; അതിനെ മുഖ്യവാചകത്തിൽ ‘പദവി’ എന്നാക്കി വ്യാഖ്യാനിച്ചിട്ടില്ല.
- source_word: τὸ ὑπὲρ πᾶν ὄνομα
  choice: എല്ലാ നാമത്തിനും മീതെയുള്ള നാമം
  rationale: ഗ്രീക്കിലെ താരതമ്യഘടന കൃത്യമായും വായനാസൗകര്യത്തോടെയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘നാമം’ ഏതാണെന്ന തിരിച്ചറിയൽ
  choice: മുഖ്യവാചകത്തിൽ ‘നാമം’ എന്നു മാത്രം നിലനിർത്തി; അത് ഏതാണെന്ന് വ്യക്തമാക്കിയില്ല.
  alternative: ‘യേശു’ എന്ന നാമമെന്നോ തുടർന്നുള്ള വാക്യങ്ങളിലെ ദൈവികപദവിയായ ‘കർത്താവ്’ എന്നോ വ്യക്തമാക്കുക.
  rationale: ഈ വാക്യം തന്നെ ആ നാമം ഏതാണെന്ന് പറയുന്നില്ല. അതിനാൽ തുടർന്നുള്ള വാക്യങ്ങളിൽനിന്നുള്ള ഒരു വ്യാഖ്യാനം ഇവിടെ മുൻകൂട്ടി ചേർക്കാതെ മൂലവാചകത്തിന്റെ തുറന്ന നില സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘അത്യന്തം ഉയർത്തി’, ‘കൃപയോടെ നൽകി’ എന്നീ പ്രയോഗങ്ങൾ മൂലത്തിലെ തീവ്രതയും കൃപാഭാവവും തുറന്നുകാട്ടുന്നു; ‘നാമം’ എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
