lexical_decisions:
- source_word: Πάντα
  choice: എല്ലാം
  rationale: സമഗ്രമായ വ്യാപ്തി സ്വാഭാവികവും സംക്ഷിപ്തവുമായി പ്രകടിപ്പിക്കുന്നു.
