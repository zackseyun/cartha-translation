id: PHP.2.13
reference: Philippians 2:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀θεὸς γάρ ἐστιν ὁ ἐνεργῶν ἐν ὑμῖν καὶ τὸ θέλειν καὶ τὸ ἐνεργεῖν ὑπὲρ τῆς εὐδοκίας.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/013.yaml
  text: For God is the one working in you both to will and to work for his good pleasure[a][b].
translation:
  language: ml
  text: കാരണം, തന്റെ പ്രസാദത്തിനായി ഇച്ഛിക്കാനും പ്രവർത്തിക്കാനും നിങ്ങളിൽ പ്രവർത്തിക്കുന്നവൻ ദൈവമാണ്[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇച്ഛയെയും പ്രവർത്തനത്തെയും.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘തന്റെ പ്രസാദപ്രകാരം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ ആഹ്വാനത്തിന്റെ വിശദീകരണാടിസ്ഥാനം സൂചിപ്പിക്കുന്ന ബന്ധകശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὁ ἐνεργῶν
  choice: പ്രവർത്തിക്കുന്നവൻ
  rationale: നാമവാചകമായി ഉപയോഗിച്ചിരിക്കുന്ന വർത്തമാനകാല കൃദന്തരൂപവും പ്രവർത്തനത്തിന്റെ തുടരുന്ന സ്വഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: ἐν ὑμῖν
  choice: നിങ്ങളിൽ
  rationale: വ്യക്തികളുടെ ഉള്ളിൽ എന്നും സമൂഹത്തിനിടയിൽ എന്നും ഗ്രഹിക്കാവുന്ന ഗ്രീക്കിലെ വ്യാപ്തിസന്ദിഗ്ധത സാധ്യമായത്ര തുറന്നുവയ്ക്കുന്നു.
- source_word: τὸ θέλειν
  choice: ഇച്ഛിക്കാൻ
  rationale: മനസ്സിന്റെ നിശ്ചയത്തെയും ഇച്ഛാശക്തിയെയും സൂചിപ്പിക്കുന്ന അർഥം സംരക്ഷിക്കുകയും തുടർന്നുള്ള സമാന്തര അനന്തരൂപവുമായി പൊരുത്തപ്പെടുകയും ചെയ്യുന്നു.
- source_word: τὸ ἐνεργεῖν
  choice: പ്രവർത്തിക്കാൻ
  rationale: മുമ്പുള്ള ἐνεργῶν എന്ന പദവുമായുള്ള ശാബ്ദികബന്ധം നിലനിർത്തുകയും ഇച്ഛയും പ്രവൃത്തിയും എന്ന സമാന്തരഘടന സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ὑπὲρ τῆς εὐδοκίας
  choice: തന്റെ പ്രസാദത്തിനായി
  rationale: ὑπέρ എന്നതിന്റെ ഉദ്ദേശ്യം/പ്രയോജനം സൂചിപ്പിക്കുന്ന ശക്തിയും εὐδοκίαയുടെ പ്രസാദം എന്ന അർഥവും നൽകുന്നു; 'തന്റെ' എന്നത് ദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: ദൈവിക പ്രവർത്തനവും മനുഷ്യന്റെ ഇച്ഛയും പ്രവൃത്തിയും
  choice: ഇച്ഛിക്കാനും പ്രവർത്തിക്കാനും എന്ന ഇരട്ടപ്രയോഗം യാതൊരു മയപ്പെടുത്തലുമില്ലാതെ നിലനിർത്തി.
  alternative: ഇച്ഛയും പ്രവർത്തിക്കാനുള്ള കഴിവും; ആഗ്രഹിക്കാനും പ്രവർത്തിക്കാനും
  rationale: വിശ്വാസികളുടെ ഇച്ഛയിലും പ്രവൃത്തിയിലും ദൈവം പ്രവർത്തിക്കുന്നു എന്ന പാഠത്തിലെ ദൈവിക-മാനുഷിക പ്രവർത്തനബന്ധം ഒരു പ്രത്യേക മതവിഭാഗീയ വിശദീകരണത്തിലൂടെ തീർപ്പാക്കാതെ സംരക്ഷിക്കുന്നു.
- issue: ὑπὲρ τῆς εὐδοκίας എന്നതിന്റെ ബന്ധം
  choice: തന്റെ പ്രസാദത്തിനായി
  alternative: തന്റെ പ്രസാദപ്രകാരം
  rationale: ഗ്രീക്കിലെ ὑπέρ + ഷഷ്ഠി ഇവിടെ ഉദ്ദേശ്യം/പ്രയോജനം സൂചിപ്പിക്കാൻ സാധ്യതയുള്ളതിനാൽ മുഖ്യപാഠത്തിൽ അത് സ്വീകരിച്ചു; മാനദണ്ഡം/അനുസരണം എന്ന വായന അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘പ്രവർത്തിക്കുന്നവൻ—പ്രവർത്തിക്കാൻ’ എന്ന ആവർത്തനം ഗ്രീക്കിലെ ἐνεργῶν—ἐνεργεῖν ബന്ധം ഉദ്ദേശപൂർവം നിലനിർത്തുന്നു. ‘നിങ്ങളിൽ’ എന്നത് ഏകവചനമല്ല, ബഹുവചനസംബോധനയാണ്; വ്യക്തിപരവും സമൂഹപരവുമായ വ്യാപ്തി നിർബന്ധമായി ചുരുക്കിയിട്ടില്ല.
