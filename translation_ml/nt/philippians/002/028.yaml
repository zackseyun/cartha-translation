id: PHP.2.28
reference: Philippians 2:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: σπουδαιοτέρως οὖν ἔπεμψα αὐτὸν ἵνα ἰδόντες αὐτὸν πάλιν χαρῆτε κἀγὼ ἀλυπότερος ὦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/028.yaml
  text: Therefore I sent him all the more eagerly, so that when you see him again you may rejoice, and I may be less distressed.
translation:
  language: ml
  text: അതിനാൽ, നിങ്ങൾ അവനെ വീണ്ടും കാണുമ്പോൾ സന്തോഷിക്കേണ്ടതിനും എനിക്കു ദുഃഖം കുറയേണ്ടതിനുമായി ഞാൻ അവനെ കൂടുതൽ ഉത്സാഹത്തോടെ അയച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπουδαιοτέρως
  choice: കൂടുതൽ ഉത്സാഹത്തോടെ
  rationale: താരതമ്യരൂപത്തിലുള്ള ക്രിയാവിശേഷണത്തിന്റെ വർധിച്ച ഉത്സാഹം/ശുഷ്കാന്തി എന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവിവരണത്തിൽനിന്നുള്ള നിഗമനബന്ധം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἔπεμψα
  choice: ഞാൻ ... അയച്ചു
  rationale: അയക്കുക എന്ന ക്രിയയുടെ ഏറിസ്റ്റ് സൂചകത്തെ സന്ദർഭോചിതമായ ലളിത ഭൂതകാലമായി നൽകുന്നു.
- source_word: ἵνα
  choice: '...ആനും ...ആനുംവേണ്ടി'
  rationale: ഗ്രീക്കിലെ ഉദ്ദേശ്യാർഥം മലയാളത്തിലെ സ്വാഭാവിക ഉദ്ദേശ്യഘടനയിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: ἰδόντες
  choice: നിങ്ങൾ ... കാണുമ്പോൾ
  rationale: ഉദ്ദേശ്യവാക്യത്തിനുള്ളിലെ കാലസാഹചര്യം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; കർത്താവ് ബഹുവചനമായ ‘നിങ്ങൾ’ ആണ്.
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: അവനെ ഒരിക്കൽക്കൂടി കാണുന്നതിനെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: χαρῆτε
  choice: സന്തോഷിക്കാനും
  rationale: χαίρω എന്ന ക്രിയയുടെ ആനന്ദിക്കുക/സന്തോഷിക്കുക എന്ന അർഥവും ഉദ്ദേശ്യാധീനമായ ഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: κἀγὼ
  choice: എനിക്ക്
  rationale: καὶ ἐγώ എന്ന സംയോജനത്തിലെ രണ്ടാമത്തെ സമാന്തര ഉദ്ദേശ്യം മലയാളവാക്യഘടനയിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: ἀλυπότερος
  choice: ദുഃഖം കുറയാനും
  rationale: താരതമ്യാർത്ഥമായ ‘കുറഞ്ഞ ദുഃഖമുള്ളവൻ’ എന്ന ആശയം കൃത്രിമത്വമില്ലാതെ മലയാളത്തിൽ നൽകുന്നു; ദുഃഖം, മനോവേദന എന്നീ സാധ്യതകൾ തുറന്നുവെക്കുന്നു.
- source_word: ὦ
  choice: '...കുറയാനും'
  rationale: ‘ഞാൻ കുറവ് ദുഃഖിതനായിരിക്കേണ്ടതിന്’ എന്ന εἰμί-യുടെ വിധേയഘടന മലയാളത്തിൽ സ്വാഭാവികമായ അവസ്ഥാമാറ്റ പ്രയോഗമായി ഉൾക്കൊള്ളുന്നു.
