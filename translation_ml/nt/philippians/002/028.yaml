revisions:
- from: അതുകൊണ്ട്, നിങ്ങൾ അവനെ വീണ്ടും കാണുമ്പോൾ സന്തോഷിക്കാനും എനിക്ക് ദുഃഖം കുറയാനുംവേണ്ടി ഞാൻ അവനെ കൂടുതൽ ഉത്സാഹത്തോടെ അയച്ചു.
  to: അതിനാൽ, നിങ്ങൾ അവനെ വീണ്ടും കാണുമ്പോൾ സന്തോഷിക്കേണ്ടതിനും എനിക്കു ദുഃഖം കുറയേണ്ടതിനുമായി ഞാൻ അവനെ കൂടുതൽ ഉത്സാഹത്തോടെ അയച്ചു.
