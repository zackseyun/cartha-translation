translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ ഉദ്ദേശ്യബന്ധവും രണ്ട് സമാന്തര ഫലങ്ങളും നിലനിർത്തി; സഭാപരമായ പ്രത്യേക പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
