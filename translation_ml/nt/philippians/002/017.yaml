source:
  edition: SBLGNT
  text: ἀλλὰ εἰ καὶ σπένδομαι ἐπὶ τῇ θυσίᾳ καὶ λειτουργίᾳ τῆς πίστεως ὑμῶν, χαίρω καὶ συγχαίρω πᾶσιν ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/017.yaml
  text: But even if I am being poured out as a drink offering upon the sacrifice and service of your faith[c][b][a], I rejoice and rejoice with all of you.
translation:
  language: ml
  text: എന്നാൽ നിങ്ങളുടെ വിശ്വാസത്തിന്റെ യാഗത്തിന്മേലും ആരാധനാശുശ്രൂഷയിന്മേലും ഞാൻ പാനീയയാഗമായി ഒഴിക്കപ്പെടുകയാണെങ്കിൽപ്പോലും[a][b][c], ഞാൻ സന്തോഷിക്കുന്നു; നിങ്ങളെല്ലാവരോടും സന്തോഷിക്കുകയും ചെയ്യുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഞാൻ പാനീയാർപ്പണമായി ഒഴിക്കപ്പെടുന്നു.”'
    reason: lexical_alternative
  - marker: b
    text: “ആരാധനാശുശ്രൂഷ” എന്നത് “ശുശ്രൂഷ” എന്നോ “സേവനം” എന്നോ വിവർത്തനം ചെയ്യാം; ഗ്രീക്കിൽ ഇവിടെ ആരാധനയുമായി ബന്ധപ്പെട്ട ഭാഷ നിലനിൽക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: 'അഥവാ: “നിങ്ങളുടെ വിശ്വസ്തത.”'
    reason: alternative_reading
lexical_decisions:
- source_word: σπένδομαι
  choice: പാനീയയാഗമായി ഒഴിക്കപ്പെടുന്നു
  rationale: ബലിക്കുമേൽ ഒഴിക്കുന്ന പാനീയയാഗത്തിന്റെ ആരാധനാപരമായ രൂപകം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἐπὶ
  choice: മേൽ
  rationale: ദത്തിവിനോടുകൂടിയ ἐπί ഇവിടെ യാഗത്തിന്മേൽ അഥവാ അതിനോടു ചേർത്ത് ഒഴിക്കുന്നതെന്ന ദൃശ്യത്തെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: θυσίᾳ
  choice: യാഗം
  rationale: ആരാധനയുടെയും ബലിയർപ്പണത്തിന്റെയും ഭാഷ നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: λειτουργίᾳ
  choice: ആരാധനാശുശ്രൂഷ
  rationale: വെറും പൊതുസേവനമായി ചുരുക്കാതെ, ഈ യാഗസന്ദർഭത്തിലുള്ള ആരാധനാഭാവം നിലനിർത്തുന്നു; പുരോഹിതർക്കു മാത്രം പരിമിതമായ പദപ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: πίστεως
  choice: വിശ്വാസം
  rationale: πίστις എന്നതിന്റെ പ്രധാന അർഥം നിലനിർത്തുന്നു; ഇവിടെ വിശ്വസ്തത എന്ന അർഥവും സാധ്യമാണെന്ന് അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: χαίρω
  choice: ഞാൻ സന്തോഷിക്കുന്നു
  rationale: ഫിലിപ്പിയർ ലേഖനത്തിലെ സന്തോഷത്തിന്റെ ആവർത്തിത പ്രമേയവും വർത്തമാനകാല പ്രസ്താവനയും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: συγχαίρω
  choice: നിങ്ങളെല്ലാവരോടുംകൂടെ സന്തോഷിക്കുന്നു
  rationale: σύν ഘടകത്തിലെ കൂട്ടായ സന്തോഷം നേരിട്ട് നിലനിർത്തുന്നു; അഭിനന്ദനം എന്ന അനുയോജ്യമല്ലാത്ത അർഥം ഒഴിവാക്കുന്നു.
- source_word: πᾶσιν ὑμῖν
  choice: നിങ്ങളെല്ലാവരോടുംകൂടെ
  rationale: സമൂഹത്തിലെ എല്ലാവരെയും ഉൾക്കൊള്ളുന്ന ഊന്നൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ സാധ്യതയുള്ള മരണത്തെക്കുറിച്ചുള്ള യാഗരൂപകം
  choice: ഫിലിപ്പിയരുടെ വിശ്വാസമാകുന്ന യാഗത്തിന്റെയും ആരാധനാശുശ്രൂഷയുടെയും മേൽ താൻ പാനീയയാഗമായി ഒഴിക്കപ്പെടുന്നതായി പൗലോസ് പറയുന്നു.
  alternative: അവരുടെ ശുശ്രൂഷയോടൊപ്പം തന്റെ ജീവനും സമർപ്പിക്കപ്പെടുന്നു എന്ന പൊതുവായ അർഥം മാത്രം.
  rationale: σπένδομαι, θυσία, λειτουργία എന്നീ പദങ്ങളുടെ കൂട്ടം യാഗ-ആരാധനാ ദൃശ്യത്തെ ശക്തമായി സൂചിപ്പിക്കുന്നതിനാൽ അതിനെ പൊതുവായ സേവനഭാഷയാക്കി മങ്ങിക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. യാഗപരമായ പദസമുച്ചയം സംരക്ഷിച്ചിരിക്കുന്നു. അടിക്കുറിപ്പുകളുടെ ക്രമം അവ വിശദീകരിക്കുന്ന പദങ്ങളോടു ചേർന്ന് [a][b][c] എന്ന നിലയിൽ നൽകിയിരിക്കുന്നു.
