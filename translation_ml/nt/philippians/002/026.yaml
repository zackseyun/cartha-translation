id: PHP.2.26
reference: Philippians 2:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐπειδὴ ἐπιποθῶν ἦν πάντας ⸀ὑμᾶς, καὶ ἀδημονῶν διότι ἠκούσατε ὅτι ἠσθένησεν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/026.yaml
  text: since he was longing for all of you and was deeply distressed because you heard that he was sick[a].
translation:
  language: ml
  text: കാരണം, നിങ്ങളെ എല്ലാവരെയും അവൻ അതിയായി കൊതിച്ചിരുന്നു; താൻ രോഗിയായെന്നു നിങ്ങൾ കേട്ടതിനാൽ അവൻ അതീവ വ്യാകുലനുമായിരുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “താൻ രോഗിയായെന്നു നിങ്ങൾ കേട്ടതായി അവൻ കേട്ടതിനാൽ.”
    reason: കേൾവിവരം എപ്പഫ്രൊദിത്തൊസ് അറിഞ്ഞതാണ് അവന്റെ വ്യാകുലതയ്ക്കു കാരണമെന്ന പരോക്ഷമായ അർഥസാധ്യത രേഖപ്പെടുത്തുന്നു; എന്നാൽ ഗ്രീക്കിൽ ‘അവൻ കേട്ടു’ എന്നത് വ്യക്തമായി പറഞ്ഞിട്ടില്ല.
lexical_decisions:
- source_word: ἐπειδὴ
  choice: കാരണം
  rationale: എപ്പഫ്രൊദിത്തൊസിനെ മടക്കി അയയ്ക്കുന്നതിനുള്ള വിശദീകരണകാരണം അവതരിപ്പിക്കുന്ന സംയോജകത്തിന്റെ കാരണാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐπιποθῶν ἦν
  choice: അതിയായി ആഗ്രഹിച്ചിരുന്നു
  rationale: വർത്തമാന കൃദന്തവും εἰμί എന്ന ക്രിയയുടെ അപൂർണഭൂതരൂപവും ചേർന്ന പ്രയോഗം ഭൂതകാലത്തിൽ തുടർന്നിരുന്ന ആഗ്രഹത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ഈ രൂപം ആ തുടർച്ച നിലനിർത്തുന്നു.
- source_word: πάντας ὑμᾶς
  choice: നിങ്ങളെ എല്ലാവരെയും
  rationale: πάντας നൽകുന്ന സമഗ്രമായ ഊന്നൽ വ്യക്തമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: ἀδημονῶν
  choice: അതീവ വ്യാകുലനുമായിരുന്നു
  rationale: ലഘുവായ ആശങ്കയെക്കാൾ ശക്തമായ മാനസിക ക്ലേശം സൂചിപ്പിക്കുന്ന പദത്തിന്റെ തീവ്രത അമിതമാക്കാതെ പ്രകടിപ്പിക്കുന്നു.
- source_word: διότι
  choice: എന്നതിനാൽ
  rationale: അവന്റെ വ്യാകുലതയുടെ കാരണം വ്യക്തമാക്കുന്ന കാരണബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἠκούσατε
  choice: നിങ്ങൾ കേട്ടു
  rationale: അയോറിസ്റ്റ് ക്രിയയെ സന്ദർഭത്തിന് യോജിച്ച ലളിതമായ ഭൂതകാലത്തിൽ നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: ὅτι ἠσθένησεν
  choice: താൻ രോഗിയായി എന്ന്
  rationale: ἀσθενέω ഇവിടെ ശാരീരിക രോഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; പ്രധാനവാക്യത്തിലെ കർത്താവിലേക്കുള്ള പരാമർശം മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘താൻ’ ഉപയോഗിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. മൂലത്തിലെ തുടർച്ചയായ മാനസികാവസ്ഥകൾ ഭൂതകാല തുടർച്ചാരൂപങ്ങളിലൂടെ നിലനിർത്തി. വ്യക്തികളെ ലക്ഷ്യമാക്കിയ ἐπιποθέω മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘കാണാൻ’ എന്ന ആശയം വ്യക്തമായി ചേർത്തിരിക്കുന്നു.
