id: PHP.2.27
reference: Philippians 2:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ γὰρ ἠσθένησεν παραπλήσιον ⸀θανάτῳ· ἀλλὰ ὁ θεὸς ⸂ἠλέησεν αὐτόν⸃, οὐκ αὐτὸν δὲ μόνον ἀλλὰ καὶ ἐμέ, ἵνα μὴ λύπην ἐπὶ λύπην σχῶ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/027.yaml
  text: For indeed he was sick[a], nearly to death; but God had mercy on him, and not on him only but also on me[b], so that I might not have sorrow upon sorrow.
translation:
  language: ml
  text: തീർച്ചയായും അവൻ രോഗിയായിരുന്നു; മരണത്തോടടുത്തിരുന്നു[a]. എന്നാൽ ദൈവം അവനോടു കരുണ കാണിച്ചു; അവനോടു മാത്രമല്ല, എന്നോടും കരുണ കാണിച്ചു. എനിക്കു ദുഃഖത്തിനുമേൽ ദുഃഖം ഉണ്ടാകാതിരിക്കേണ്ടതിന്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “മരണത്തിന്റെ വക്കോളം” അല്ലെങ്കിൽ “മരിക്കാറാകുന്നതുവരെ.”
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം “ദുഃഖത്തിനുമേൽ ദുഃഖം”; ഒന്നിനോടൊന്ന് ചേർന്നുവരുന്ന സഞ്ചിതമായ ദുഃഖത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗം.
    reason: cultural_note
lexical_decisions:
- source_word: ἠσθένησεν
  choice: രോഗിയായി
  rationale: സന്ദർഭത്തിൽ ἀσθενέω ശാരീരിക രോഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘രോഗിയായി’ എന്നത് ആയിത്തീരലിനെയും രോഗാവസ്ഥയെയും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: παραπλήσιον θανάτῳ
  choice: മരണത്തോളം അടുത്തവിധം
  rationale: ദത്തിവോടുകൂടിയ παραπλήσιον മരണത്തോടുള്ള അത്യന്തം സമീപ്യതയാണ് സൂചിപ്പിക്കുന്നത്; യഥാർഥത്തിൽ മരിച്ചെന്ന അർഥം വരുത്താതെ അത് നിലനിർത്തുന്നു.
- source_word: ἠλέησεν
  choice: കരുണ കാണിച്ചു
  rationale: ദൈവത്തിന്റെ അനുകമ്പാപൂർവമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന ἐλεάω എന്ന പദത്തിന്റെ ദൈവശാസ്ത്രപരമായ ഭാരവും സ്വാഭാവിക മലയാളവും ഇത് നിലനിർത്തുന്നു.
- source_word: οὐκ αὐτὸν δὲ μόνον ἀλλὰ καὶ ἐμέ
  choice: അവനോടു മാത്രമല്ല, എന്നോടും കരുണ കാണിച്ചു
  rationale: മുൻക്രിയയുടെ അർഥം മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ആവർത്തിക്കുകയും ഗ്രീക്കിലെ ‘അവനെ മാത്രമല്ല, എന്നെയും’ എന്ന വിരുദ്ധസമാന്തര ഘടന നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἵνα μὴ
  choice: അങ്ങനെ ... ഉണ്ടാകാതിരുന്നു
  rationale: ഇവിടെ ദൈവത്തിന്റെ കരുണയുടെ ഫലമായി ഒഴിവായ സംഭവത്തെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ഗ്രീക്കിലെ ഉദ്ദേശ്യ/ഫല നിഴൽ കർശനമായി ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: λύπην ἐπὶ λύπην
  choice: ദുഃഖത്തിനുമേൽ ദുഃഖം
  rationale: ഗ്രീക്കിലെ ആവർത്തനവും സഞ്ചിതമായ ദുഃഖത്തിന്റെ ശക്തിയും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: σχῶ
  choice: ഉണ്ടാകുക
  rationale: ἔχω എന്ന വിശാലാർഥമുള്ള ക്രിയയെ ‘ദുഃഖം ഉണ്ടാകുക’ എന്ന സ്വാഭാവിക മലയാള പ്രയോഗത്തിലൂടെ കുറഞ്ഞ വ്യാഖ്യാനത്തോടെ നൽകുന്നു.
theological_decisions:
- issue: ദൈവത്തിന്റെ കരുണ പൗലോസിലേക്കും വ്യാപിക്കുന്നത്
  choice: ‘എന്നോടും കരുണ കാണിച്ചു’ എന്ന് ക്രിയ ആവർത്തിച്ചു
  alternative: ‘അവനോടു മാത്രമല്ല, എന്നോടും’ എന്ന് മാത്രം നൽകുക
  rationale: രോഗശാന്തി പൗലോസിന് നേരിട്ട് ലഭിച്ചുവെന്നല്ല, എപ്പഫ്രൊദിത്തൊസിന്റെ സൗഖ്യത്തിലൂടെ പൗലോസും ദൈവകരുണയുടെ ഗുണഭോക്താവായെന്ന ഗ്രീക്ക് വ്യാകരണബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ കാരണംസൂചകമായ καὶ γάρ, ദൈവകരുണയുടെ ആവർത്തിത പ്രയോഗം, ‘ദുഃഖത്തിനുമേൽ ദുഃഖം’ എന്ന വാക്ചാതുര്യം എന്നിവ സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
