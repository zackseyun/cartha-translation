  to: നിങ്ങളിൽ ഓരോരുത്തരും സ്വന്തം കാര്യങ്ങൾ മാത്രം ശ്രദ്ധിക്കാതെ, മറ്റുള്ളവരുടെ കാര്യങ്ങളും ശ്രദ്ധിക്കണം.[a]
