  yaml_path: translation/nt/philippians/002/004.yaml
  text: Each of you should look not only to your own interests[a], but also to the interests of others.
translation:
  language: ml
  text: നിങ്ങളിൽ ഓരോരുത്തരും സ്വന്തം കാര്യങ്ങൾ മാത്രം ശ്രദ്ധിക്കാതെ, മറ്റുള്ളവരുടെ കാര്യങ്ങളും ശ്രദ്ധിക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “ഓരോരുത്തരും സ്വന്തം കാര്യങ്ങൾ നോക്കിക്കൊണ്ടിരിക്കാതെ, മറ്റുള്ളവരുടെ കാര്യങ്ങളും നോക്കിക്കൊള്ളുക.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκοποῦντες
  choice: ശ്രദ്ധിക്കണം
  rationale: σκοπέω ഇവിടെ ശ്രദ്ധയും കരുതലും ഒരു കാര്യത്തിലേക്കു തിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിലെ പങ്കാളിക്രിയ സന്ദർഭത്തിൽ ആഹ്വാനത്തിന്റെ ശക്തി വഹിക്കുന്നതിനാൽ, സ്വാഭാവിക മലയാളത്തിൽ ‘ശ്രദ്ധിക്കണം’ എന്നു നൽകി.
- source_word: τὰ ἑαυτῶν
  choice: സ്വന്തം കാര്യങ്ങൾ
  rationale: നപുംസകലിംഗ ബഹുവചനപ്രയോഗം സ്വത്തുക്കൾക്കു മാത്രമല്ല, ഒരാളുടെ വിശാലമായ കാര്യങ്ങൾ, താൽപര്യങ്ങൾ, ആവശ്യങ്ങൾ എന്നിവയ്ക്കും ബാധകമാണ്. ‘കാര്യങ്ങൾ’ ആ വിശാലത നിലനിർത്തുന്നു.
- source_word: ἕκαστοι
  choice: നിങ്ങളിൽ ഓരോരുത്തരും
  rationale: ἕκαστοι സമൂഹത്തിലെ ഓരോ വ്യക്തിയെയും വേർതിരിച്ചു അഭിസംബോധന ചെയ്യുന്ന വിതരണാർത്ഥം വ്യക്തമാക്കുന്നു.
- source_word: ἀλλὰ καὶ
  choice: മാത്രമല്ല ... കാര്യങ്ങളും
  rationale: വിരോധത്തോടൊപ്പം കൂട്ടിച്ചേർക്കലും പ്രകടമാക്കുന്ന ഗ്രീക്ക് ഘടനയെ മലയാളത്തിലെ സ്വാഭാവികമായ ‘മാത്രമല്ല ... -ഉം’ രൂപത്തിൽ അവതരിപ്പിച്ചു.
- source_word: τὰ ἑτέρων
  choice: മറ്റുള്ളവരുടെ കാര്യങ്ങൾ
  rationale: ഈ പ്രയോഗവും മറ്റുള്ളവരുടെ സ്വത്തുക്കൾ മാത്രമല്ല, അവരുടെ താൽപര്യങ്ങൾ, ആവശ്യങ്ങൾ, ക്ഷേമം എന്നിവ ഉൾക്കൊള്ളുന്ന വിശാലമായ അർത്ഥം വഹിക്കുന്നു.
