  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “ഒരേ പ്രാണനുള്ളവരായും”; അഥവാ, “ഒരേ ആത്മാവുള്ളവരായും.”
    reason: lexical_alternative
  - marker: c
