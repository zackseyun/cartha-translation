translation:
  language: ml
  text: നിങ്ങൾ ഒരേ ചിന്താഗതിയുള്ളവരായും[a], ഒരേ സ്നേഹം പുലർത്തിയും, ഹൃദയങ്ങളിൽ ഐക്യമുള്ളവരായും[b], ഒരേ കാര്യം ചിന്തിച്ചും[c] എന്റെ സന്തോഷം പൂർണമാക്കുക.
