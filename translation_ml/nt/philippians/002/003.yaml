  - severity: medium
    issue: «പൊള്ളയായ ആത്മപ്രശംസ» for κατὰ κενοδοξίαν
    rationale: «ആത്മപ്രശംസ» denotes self-praise, an action, while κενοδοξία denotes an empty or vain self-exalting disposition. «പൊള്ളയായ അഭിമാനം» better represents the source term.
