  text: സ്വാർഥാഭിലാഷത്താലോ പൊള്ളയായ അഭിമാനത്താലോ[a] ഒന്നും ചെയ്യരുത്; പകരം, താഴ്മയോടെ മറ്റുള്ളവരെ നിങ്ങളെക്കാൾ ശ്രേഷ്ഠരായി[b] കണക്കാക്കുക.
