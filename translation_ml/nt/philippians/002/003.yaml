  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ പ്രബോധനശൈലി. ‘താഴ്മ’, ‘ശ്രേഷ്ഠർ’ തുടങ്ങിയ പരിചിത പദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് നേരിട്ട് ഗ്രഹിക്കാവുന്നതാക്കി.
