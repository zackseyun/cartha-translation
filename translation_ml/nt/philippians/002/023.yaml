id: PHP.2.23
reference: Philippians 2:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῦτον μὲν οὖν ἐλπίζω πέμψαι ὡς ἂν ἀφίδω τὰ περὶ ἐμὲ ἐξαυτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/023.yaml
  text: Therefore[a], I hope to send him as soon as I see how things go with me.
translation:
  language: ml
  text: അതുകൊണ്ട്, എന്നെ സംബന്ധിച്ച കാര്യങ്ങൾ എങ്ങനെയെന്ന് വ്യക്തമായി കണ്ടറിയുന്ന ഉടൻതന്നെ അവനെ അയയ്ക്കുമെന്ന് ഞാൻ പ്രത്യാശിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അതുകൊണ്ട്, എന്റെ സ്ഥിതിഗതികൾ എങ്ങനെയാണെന്ന് വ്യക്തമായി മനസ്സിലാകുന്ന ഉടൻ അവനെ അയയ്ക്കുമെന്ന് ഞാൻ പ്രത്യാശിക്കുന്നു.”'
    reason: ἀφίδωയുടെ ‘കണ്ടറിയുക/മനസ്സിലാക്കുക’ എന്ന സന്ദർഭാർഥവും τὰ περὶ ἐμέയുടെ ‘എന്നെ സംബന്ധിച്ച കാര്യങ്ങൾ/സ്ഥിതിഗതികൾ’ എന്ന പ്രയോഗവും വ്യക്തമാക്കുന്ന പാഠഭേദമല്ലാത്ത പരിഭാഷാവികൽപം.
lexical_decisions:
- source_word: τοῦτον
  choice: അവനെ
  rationale: തൊട്ടുമുമ്പ് പരാമർശിച്ച തിമൊഥെയൊസിനെയാണ് ഈ നിർദ്ദേശക സർവനാമം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സന്ദർഭാനുസൃതമായ സർവനാമം സ്വാഭാവികമാണ്.
- source_word: μὲν οὖν
  choice: അതുകൊണ്ട്
  rationale: മുമ്പുള്ള ആശയത്തിൽനിന്നുള്ള നിഗമനപരമായ മാറ്റം സ്വാഭാവികമായി അറിയിക്കുന്നു; μὲν എന്ന കണത്തിന് ഇവിടെ വേറിട്ടൊരു പദാനുപദ പരിഭാഷ നിർബന്ധമല്ല.
- source_word: ἐλπίζω πέμψαι
  choice: അയയ്ക്കാമെന്ന് ഞാൻ പ്രത്യാശിക്കുന്നു
  rationale: ἐλπίζω പ്രത്യാശയെയോ പ്രതീക്ഷയെയോ സൂചിപ്പിക്കുന്നു; πέμψαιയോടുള്ള ബന്ധം മലയാളത്തിൽ ഈ പൂരകഘടന സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὡς ἂν ἀφίδω
  choice: വ്യക്തമായ ഉടൻതന്നെ
  rationale: പൗലൊസിന്റെ സ്ഥിതി എങ്ങനെയാകുമെന്ന് അറിവാകുന്ന അനിശ്ചിതമായ ഭാവിസമയത്തെയും അതിനെ തുടർന്നുള്ള വേഗത്തിലുള്ള നടപടിയെയും ഈ പ്രയോഗം അറിയിക്കുന്നു.
- source_word: ἀφίδω
  choice: വ്യക്തമായ
  rationale: കാണുക എന്ന അടിസ്ഥാനരൂപകത്തെക്കാൾ, ഈ സന്ദർഭത്തിൽ കാര്യങ്ങളുടെ ഗതി മനസ്സിലാകുക/വ്യക്തമാകുക എന്ന അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὰ περὶ ἐμέ
  choice: എന്റെ കാര്യങ്ങൾ എങ്ങനെയാകുമെന്ന്
  rationale: പൗലൊസിനെ സംബന്ധിച്ച സാഹചര്യങ്ങളെയും അവയുടെ പരിണതിയെയും സൂചിപ്പിക്കുന്നു; അക്ഷരാർഥത്തിലെ ‘എന്നെക്കുറിച്ചുള്ള കാര്യങ്ങൾ’ എന്നതിനെക്കാൾ ഈ രൂപം വായനാസൗകര്യമുള്ളതാണ്.
- source_word: ἐξαυτῆς
  choice: ഉടൻതന്നെ
  rationale: അറിഞ്ഞതിന് പിന്നാലെയുള്ള തൽക്ഷണതയെ ഊന്നിപ്പറയുന്നു; മലയാളത്തിൽ സമയപ്രയോഗത്തോടു ചേർത്താണ് സ്വാഭാവികമായി നൽകുന്നത്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലത്തിലെ ഭാവിസാഹചര്യത്തിന്റെ അനിശ്ചിതത്വവും തുടർന്ന് ഉടൻ അയയ്ക്കുമെന്ന ആശയവും നിലനിർത്തിയിരിക്കുന്നു; പ്രത്യേക സഭാപാരമ്പര്യ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
