lexical_decisions:
- source_word: ἵνα
  choice: അങ്ങനെ … വേണ്ടതിന്
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞതിൽനിന്ന് ഉരുത്തിരിയുന്ന ഉദ്ദേശ്യം/ഫലം വ്യക്തമാക്കുകയും ഗ്രീക്കിലെ ലക്ഷ്യസൂചന നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐν τῷ ὀνόματι Ἰησοῦ
  choice: യേശുവിന്റെ നാമത്തിനു മുമ്പിൽ
  rationale: ആദരപൂർവം മുട്ടുമടക്കുന്ന പ്രവൃത്തിയോടൊപ്പം സ്വാഭാവികമായ മലയാളപ്രയോഗം; യേശുവിന്റെ നാമത്തിനും മഹത്വത്തിനും മുമ്പിലുള്ള വണക്കമാണ് സൂചിപ്പിക്കുന്നത്. ഗ്രീക്കിലെ ‘ἐν’ കാരണം ‘നാമത്തിൽ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: πᾶν γόνυ
  choice: ഓരോ മുട്ടും
  rationale: സാർവത്രികമായ വണക്കത്തിന്റെ ദൃശ്യമായ ശരീരബിംബം പരാവർത്തനം ചെയ്യാതെ നിലനിർത്തുന്നു; ഏകവചനത്തിലുള്ള വിതരണാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: κάμψῃ
  choice: മടങ്ങേണ്ടതിന്
  rationale: ἵνα-യോടുകൂടിയ aorist subjunctive-ന്റെ ഉദ്ദേശ്യ/ഫലഭാവം പ്രകടിപ്പിക്കുന്നു; മുട്ടുമടക്കുക എന്ന വണക്കസന്ദർഭത്തിന് യോജിച്ച പ്രയോഗം.
- source_word: ἐπουρανίων
  choice: സ്വർഗത്തിലുള്ളവരുടെ
  rationale: നാമവാചകമായി ഉപയോഗിച്ച വിശേഷണത്തെ സ്വാഭാവിക മലയാളത്തിൽ സ്ഥാനസൂചനയോടുകൂടിയ വ്യക്തിസമൂഹമായി അവതരിപ്പിക്കുന്നു; അവരുടെ കൃത്യമായ സ്വത്വം നിർണ്ണയിക്കുന്നില്ല.
- source_word: ἐπιγείων
  choice: ഭൂമിയിലുള്ളവരുടെ
  rationale: മൂന്നംഗ പ്രപഞ്ചവ്യാപക ഘടന നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ മലയാളരൂപം നൽകുന്നു.
- source_word: καταχθονίων
  choice: ഭൂമിക്കടിയിലുള്ളവരുടെ
  rationale: ‘പാതാളം’ പോലുള്ള കൂടുതൽ വ്യാഖ്യാനാത്മക പദം ഉപയോഗിക്കാതെ ഗ്രീക്കിലെ സ്ഥലബിംബം സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: ἐπουρανίων καὶ ἐπιγείων καὶ καταχθονίων എന്ന മൂന്നംഗ പ്രയോഗത്തിന്റെ വ്യാപ്തി
  choice: സ്വർഗം, ഭൂമി, ഭൂമിക്കടി എന്നീ മേഖലകളിലുള്ളവരെയെല്ലാം ഉൾക്കൊള്ളുന്ന പ്രപഞ്ചവ്യാപകമായ അർഥം; ഓരോ വിഭാഗത്തിന്റെയും സ്വത്വം കൂടുതൽ നിർവചിക്കുന്നില്ല.
  alternative: ദൂതന്മാർ, മനുഷ്യർ, മരിച്ചവർ അഥവാ ഭൂതങ്ങൾ എന്നിങ്ങനെ വിഭാഗങ്ങളെ വ്യക്തമായി പേരിട്ടു പറയുക.
  rationale: യേശുവിനുള്ള സാർവത്രിക വണക്കമാണ് പാഠത്തിന്റെ ഊന്നൽ. ഗ്രീക്ക് ആവശ്യപ്പെടാത്ത പ്രത്യേക തിരിച്ചറിയലുകൾ ചേർക്കാതെ ആ വ്യാപ്തി പരിഭാഷ നിലനിർത്തുന്നു.
- issue: ἐν τῷ ὀνόματι Ἰησοῦ എന്നതിന്റെ അർഥഭാവം
  choice: വണക്കത്തിന്റെ സന്ദർഭത്തിൽ ‘യേശുവിന്റെ നാമത്തിനു മുമ്പിൽ’ എന്ന് മുഖ്യപാഠത്തിൽ നൽകി, ‘യേശുവിന്റെ നാമത്തിൽ’ എന്ന കൂടുതൽ ഔപചാരിക സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
  alternative: ‘യേശുവിന്റെ നാമത്തിൽ’ എന്നു മാത്രം നൽകുകയും അധികാരം/പ്രതിനിധിത്വം എന്ന ഭാവത്തിലേക്ക് വായനയെ നയിക്കുകയും ചെയ്യുക.
  rationale: ‘ἐν’ എന്ന പദത്തിന്റെ യഥാർഥ വ്യാകരണസാധ്യത സംരക്ഷിക്കുമ്പോഴും ഈ സന്ദർഭത്തിലെ ആദരപ്രതികരണഭാവം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. ‘ഓരോ മുട്ടും മടങ്ങുക’ എന്ന രൂപം ഗ്രീക്കിലെ ദൃശ്യബിംബവും ഏകവചന വിതരണാർഥവും നിലനിർത്തുന്നു. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനത്തിൽ അൽപവിരാമം ചേർത്തിരിക്കുന്നു.
