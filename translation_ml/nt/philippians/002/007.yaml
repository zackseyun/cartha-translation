  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλὰ ἑαυτὸν ἐκένωσεν μορφὴν δούλου λαβών, ἐν ὁμοιώματι ἀνθρώπων γενόμενος· καὶ σχήματι εὑρεθεὶς ὡς ἄνθρωπος
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/007.yaml
  text: but emptied himself[a], taking the form of a servant, becoming in the likeness of men[d][c][b]; and being found in appearance as a man
translation:
  language: ml
  text: എന്നാൽ, അവൻ തന്നെത്തന്നെ ശൂന്യമാക്കി[a], അടിമയുടെ രൂപം സ്വീകരിച്ച്, മനുഷ്യരുടെ സാദൃശ്യത്തിൽ[b] ആയിത്തീർന്ന്, കാഴ്ചയിൽ മനുഷ്യനായി കാണപ്പെട്ട്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “തന്നെത്തന്നെ ഒന്നുമല്ലാത്തവനാക്കി.”'
    reason: lexical_alternative
  - marker: b
    text: “മനുഷ്യരുടെ സാദൃശ്യത്തിൽ” എന്നത് ഗ്രീക്കിലെ ὁμοίωμα എന്ന പദത്തെ പിന്തുടരുന്നു; ക്രിസ്തുവിന്റെ യഥാർഥ മനുഷ്യത്വത്തെ നിഷേധിക്കുന്നതായി ഇതിനെ മനസ്സിലാക്കരുത്. ഇവിടെ “മനുഷ്യൻ” എന്നത് സ്ത്രീപുരുഷഭേദമില്ലാതെ മനുഷ്യനെ സൂചിപ്പിക്കുന്ന പൊതുപദമാണ്.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλὰ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തോടുള്ള ശക്തമായ വൈരുധ്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἑαυτὸν ἐκένωσεν
  choice: അവൻ തന്നെത്തന്നെ ശൂന്യമാക്കി
  rationale: κενόω എന്ന ക്രിയയിലെ ‘ശൂന്യമാക്കുക’ എന്ന രൂപകം നിലനിർത്തുന്നു; അത് എങ്ങനെ സംഭവിച്ചു എന്ന് തുടർന്നുള്ള കൃദന്തരൂപങ്ങൾ വിശദീകരിക്കാൻ ഇടവരുത്തുന്നു.
- source_word: μορφὴν δούλου λαβών
  choice: അടിമയുടെ രൂപം സ്വീകരിച്ച്
  rationale: μορφήയ്ക്ക് ‘രൂപം’ എന്ന പദം നൽകി സന്ദർഭത്തിലെ പദസാമ്യം നിലനിർത്തുന്നു; δοῦλος സൂചിപ്പിക്കുന്ന അധീനസ്ഥിതി ‘അടിമ’ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; λαβών കൃദന്തരൂപമായി നിലനിർത്തുന്നു.
- source_word: ἐν ὁμοιώματι ἀνθρώπων γενόμενος
  choice: മനുഷ്യരുടെ സാദൃശ്യത്തിൽ ആയിത്തീർന്ന്
  rationale: γενόμενος എന്നതിന്റെ ‘ആയിത്തീരുക/വന്നുചേരുക’ എന്ന ആശയവും ὁμοίωμα എന്നതിന്റെ ‘സാദൃശ്യം’ എന്ന പദാർഥവും നേരിട്ട് സൂക്ഷിക്കുന്നു; ἀνθρώπων എന്ന ബഹുവചന പൊതുപദം ‘മനുഷ്യർ’ എന്നു നൽകുന്നു.
- source_word: σχήματι εὑρεθεὶς ὡς ἄνθρωπος
  choice: കാഴ്ചയിൽ മനുഷ്യനായി കാണപ്പെട്ട്
  rationale: σχῆμα സൂചിപ്പിക്കുന്ന കാണപ്പെടുന്ന ഭാവത്തെ ‘കാഴ്ചയിൽ’ എന്നു പ്രകടിപ്പിക്കുകയും, εὑρεθείς എന്ന കൃദന്തരൂപം നിലനിർത്തുകയും ചെയ്യുന്നു; ἄνθρωπος ലിംഗനിരപേക്ഷമായി ‘മനുഷ്യൻ’ എന്നു വിവർത്തനം ചെയ്യുന്നു.
theological_decisions:
- issue: ക്രിസ്തു ‘തന്നെത്തന്നെ ശൂന്യമാക്കി’ എന്നതിന്റെ അർഥം
  choice: ‘ശൂന്യമാക്കി’ എന്ന രൂപകം നിലനിർത്തി, തുടർന്നുള്ള കൃദന്തരൂപങ്ങൾ അതിന്റെ വിധം വിശദീകരിക്കുന്നതായി വാക്യഘടനയിൽ സൂചിപ്പിച്ചു.
  alternative: ദൈവിക ഗുണങ്ങൾ ഉപേക്ഷിച്ചു എന്നോ സ്വയം ഒന്നുമല്ലാതാക്കി എന്നോ വ്യാഖ്യാനിച്ച് വിവർത്തനം ചെയ്യുക.
  rationale: മൂലപാഠം പറയുന്നതിലധികമായ ഒരു ക്രിസ്തുശാസ്ത്ര സിദ്ധാന്തം ചേർക്കാതെ അതിലെ രൂപകവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
- issue: ‘മനുഷ്യരുടെ സാദൃശ്യത്തിൽ’ എന്ന പ്രയോഗത്തിന്റെ ശക്തി
  choice: ὁμοίωμα നേരിട്ട് ‘സാദൃശ്യം’ എന്നു വിവർത്തനം ചെയ്തു.
  alternative: വെറും മനുഷ്യസാദൃശ്യം മാത്രമെന്നോ, മറുവശത്ത് മൂലപാഠത്തേക്കാൾ ശക്തമായി പൂർണ താദാത്മ്യം പ്രസ്താവിക്കുന്നതായോ നൽകുക.
  rationale: പൗലൊസിന്റെ സൂക്ഷ്മമായ പദപ്രയോഗം നിലനിർത്തുന്നു; ഇത് ക്രിസ്തുവിന്റെ യഥാർഥ മനുഷ്യത്വത്തെ നിഷേധിക്കുന്നതായി വായിക്കരുതെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- issue: μορφήയും σχῆμαയും തമ്മിലുള്ള വ്യത്യാസം
  choice: μορφήയ്ക്ക് ‘രൂപം’, σχῆμαയ്ക്ക് ‘കാഴ്ച’ എന്നു വ്യത്യസ്ത പദങ്ങൾ ഉപയോഗിച്ചു.
  alternative: രണ്ടിനും ഒരേ മലയാളപദമായ ‘രൂപം’ ഉപയോഗിക്കുക.
  rationale: ഗ്രീക്കിലെ പദവ്യത്യാസം കഴിയുന്നത്ര നിലനിർത്തുകയും രണ്ടാമത്തേത് കാണപ്പെടുന്ന ഭാവത്തെ സംബന്ധിക്കുന്നതായി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. അടുത്ത വാക്യത്തിലേക്ക് വ്യാകരണപരമായി നീളുന്ന ഗ്രീക്ക് കൃദന്തരൂപം സൂക്ഷിക്കാൻ അവസാനഭാഗം ‘കാണപ്പെട്ട്’ എന്നു നൽകി. ഡാഷും അർദ്ധവിരാമവും പങ്കാളിക്രിയകളുടെ വിശദീകരണബന്ധവും ഘടനയും വായനക്കാരന് വ്യക്തമാക്കുന്നു.
