lexical_decisions:
- source_word: τὸ δὲ αὐτὸ
  choice: അതുപോലെതന്നെ
  rationale: τὸ αὐτό ഇവിടെ ക്രിയാവിശേഷണപരമായി മുൻവാക്യത്തിലെ പൗലോസിന്റെ സന്തോഷത്തെ ചൂണ്ടിക്കാണിക്കുന്നു. δέ നൽകുന്ന തുടർച്ചയും നേരിയ മാറ്റവും മലയാളത്തിലെ സ്വാഭാവിക ഒഴുക്കിൽ വേറൊരു പദമായി പ്രകടിപ്പിക്കാതെ ഉൾക്കൊള്ളുന്നു.
- source_word: καὶ ὑμεῖς
  choice: നിങ്ങളും
  rationale: καί ചേർക്കലിന്റെ അർഥത്തിൽ ‘ഉം’ ആയി നൽകി, പൗലോസിന്റെ സന്തോഷത്തിൽ ഫിലിപ്പിയർ പങ്കുചേരണമെന്ന ബന്ധം നിലനിർത്തുന്നു.
- source_word: χαίρετε
  choice: സന്തോഷിക്കുവിൻ
  rationale: വർത്തമാനകാല സജീവ ആജ്ഞാരൂപത്തിന്റെ ബഹുവചനബലം നിലനിർത്തുന്നു; ഫിലിപ്പിയരിലെ ആവർത്തിതമായ സന്തോഷഭാഷയോടും യോജിക്കുന്നു.
- source_word: συγχαίρετέ μοι
  choice: എന്നോടൊപ്പം സന്തോഷിക്കുവിൻ
  rationale: συγχαίρω എന്ന സംയുക്തക്രിയയിലെ പങ്കിട്ടുള്ള സന്തോഷവും μοι സൂചിപ്പിക്കുന്ന പൗലോസിനോടൊപ്പമുള്ള പങ്കാളിത്തവും വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
