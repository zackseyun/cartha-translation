id: PHP.2.6
reference: Philippians 2:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃς ἐν μορφῇ θεοῦ ὑπάρχων οὐχ ἁρπαγμὸν ἡγήσατο τὸ εἶναι ἴσα θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/006.yaml
  text: who[a], though he was in the form of God, did not consider equality with God something to be grasped[c][b],
translation:
  language: ml
  text: അവൻ ദൈവത്തിന്റെ രൂപത്തിൽ ആയിരുന്നിട്ടും[a], ദൈവത്തോടു തുല്യനായിരിക്കുന്നത്[c] മുറുകെപ്പിടിക്കേണ്ട ഒന്നായി[b] കണക്കാക്കിയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദൈവത്തിന്റെ രൂപത്തിൽ ആയിരിക്കെ.” ὑπάρχων എന്ന പദം “ആയിരുന്നിട്ടും” എന്ന concessive അർഥത്തിലോ “ആയിരിക്കെ” എന്ന stative അർഥത്തിലോ മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “പിടിച്ചെടുക്കേണ്ട ഒന്നായി” അല്ലെങ്കിൽ “സ്വപ്രയോജനത്തിനായി ഉപയോഗിക്കേണ്ട ഒന്നായി.” ἁρπαγμός എന്ന ഗ്രീക്ക് പദത്തിന്റെ അർഥം വിവാദവിധേയമാണ്.
    reason: alternative_reading
  - marker: c
    text: 'അക്ഷരാർഥം: “ദൈവത്തോടു തുല്യനായിരിക്കുക.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν μορφῇ θεοῦ
  choice: ദൈവത്തിന്റെ രൂപത്തിൽ
  rationale: μορφή എന്ന ഗ്രീക്ക് പദത്തെ വ്യാഖ്യാനപരമായി ‘സ്വഭാവം’ എന്നു ചുരുക്കാതെ ‘രൂപം’ എന്നു നിലനിർത്തുന്നു; ഇതിലൂടെ മൂലവാക്യത്തിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ ഗൗരവവും ഭാഷാപരമായ തുറന്ന നിലയും സംരക്ഷിക്കുന്നു.
- source_word: ὑπάρχων
  choice: ആയിരുന്നിട്ടും
  rationale: തുടർന്നുള്ള സ്വയം ഒഴിച്ചുകളയലുമായുള്ള വൈരുധ്യം വ്യക്തമാക്കുന്ന concessive അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. ‘ആയിരിക്കെ’ എന്ന stative സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἁρπαγμὸν
  choice: മുറുകെപ്പിടിക്കേണ്ട ഒന്നായി
  rationale: വിവാദവിധേയമായ ἁρπαγμός എന്ന പദത്തിന്റെ grasp/hold എന്ന ദൃശ്യാർഥം നേരിട്ട് സൂക്ഷിക്കുകയും ‘സ്വപ്രയോജനത്തിനായി ഉപയോഗിക്കേണ്ടത്’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക അർഥം മുഖ്യവാക്യത്തിൽ നിർബന്ധിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἡγήσατο
  choice: കണക്കാക്കിയില്ല
  rationale: പരിഗണിക്കുക, കരുതുക, വിലയിരുത്തുക എന്നീ അർഥങ്ങളുള്ള ἡγέομαι-യ്ക്ക് സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളപ്രയോഗം.
- source_word: τὸ εἶναι ἴσα θεῷ
  choice: ദൈവത്തോടു തുല്യനായിരിക്കുന്നത്
  rationale: ഗ്രീക്കിലെ articular infinitive ഘടനയും ἴσα θεῷ എന്ന ‘ദൈവത്തോടു തുല്യമായിരിക്കുക’ എന്ന അർഥവും മലയാളത്തിൽ വ്യക്തമായി പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: ἐν μορφῇ θεοῦ എന്ന പ്രയോഗത്തിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ ശക്തി
  choice: ‘ദൈവത്തിന്റെ രൂപത്തിൽ’ എന്ന് മൂലപ്രയോഗം നിലനിർത്തുക.
  alternative: ‘ദൈവസ്വഭാവത്തിൽ’ അല്ലെങ്കിൽ ‘സ്വഭാവത്താൽ ദൈവമായിരിക്കെ’.
  rationale: പൗലോസിന്റെ ഉയർന്ന ക്രിസ്തുശാസ്ത്രത്തെ നിലനിർത്തിക്കൊണ്ട്, പിൽക്കാല ദൈവശാസ്ത്രപരമായ സംഗ്രഹവാക്യം നേരിട്ട് പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതിരിക്കുന്നു.
- issue: ἁρπαγμός എന്നതും ദൈവത്തോടുള്ള തുല്യതയും തമ്മിലുള്ള ബന്ധം
  choice: ‘മുറുകെപ്പിടിക്കേണ്ട ഒന്നായി’ എന്ന് നൽകുക.
  alternative: ‘പിടിച്ചെടുക്കേണ്ട ഒന്നായി’, ‘സ്വപ്രയോജനത്തിനായി ഉപയോഗിക്കേണ്ട ഒന്നായി’.
  rationale: ഈ പദത്തിന്റെ അർഥം യഥാർഥത്തിൽ വിവാദവിധേയമാണ്. മുഖ്യവാക്യം grasp/hold എന്ന തുറന്ന അർഥം സൂക്ഷിക്കുന്നു; പിടിച്ചെടുക്കൽ എന്ന സാധ്യതയും സ്വപ്രയോജനത്തിനായി ഉപയോഗിക്കൽ എന്ന സന്ദർഭാധിഷ്ഠിത വ്യാഖ്യാനവും അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘രൂപം’, ‘തുല്യനായിരിക്കുക’ എന്നീ പദങ്ങൾ മൂലഗ്രീക്കിന്റെ ആശയഘടന സംരക്ഷിക്കുന്നു; വിവാദമുള്ള ἁρπαγμός അതിവ്യാഖ്യാനം ചെയ്യാതെ മുഖ്യവാക്യത്തിലും അടിക്കുറിപ്പിലും തുറന്ന നിലയിൽ അവതരിപ്പിക്കുന്നു.
