  text: കാരണം, നിങ്ങളെ സംബന്ധിക്കുന്ന കാര്യങ്ങളിൽ ആത്മാർഥമായി കരുതുന്ന സമാനമനസ്സുള്ള ആരും എനിക്കില്ല.[a][b]
