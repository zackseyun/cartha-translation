    reason: lexical_alternative
  - marker: b
    text: അഥവാ “നിങ്ങളെ സംബന്ധിക്കുന്ന കാര്യങ്ങളെക്കുറിച്ച് ആത്മാർഥമായി കരുതുന്ന.”
