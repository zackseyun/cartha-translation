source:
  edition: SBLGNT
  text: ἐταπείνωσεν ἑαυτὸν γενόμενος ὑπήκοος μέχρι θανάτου, θανάτου δὲ σταυροῦ·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/008.yaml
  text: he humbled himself[b][a], becoming obedient to the point of death—even death on a cross.
translation:
  language: ml
  text: അവൻ തന്നെത്തന്നെ താഴ്ത്തി, മരണംവരെ[a]—അതും ക്രൂശിലെ മരണംവരെ[b]—അനുസരണമുള്ളവനായിത്തീർന്നുകൊണ്ട്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “മരണത്തോളം” എന്നും പരിഭാഷപ്പെടുത്താം; അവന്റെ അനുസരണം മരണംവരെ നീണ്ടുനിന്നു എന്നാണ് ഈ പ്രയോഗത്തിന്റെ അർഥം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ “മരണം, അതും ക്രൂശിന്റേത്”; അർഥം “അതും ക്രൂശിലെ മരണം” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐταπείνωσεν
  choice: താഴ്ത്തി
  rationale: ക്രിയയുടെ സജീവവും സ്വമേധയുമായ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἑαυτὸν
  choice: തന്നെത്താൻ
  rationale: സ്വയം താഴ്ത്തിയെന്ന ഊന്നൽ നൽകുന്ന വ്യക്തമായ ആത്മവാചക സർവനാമം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: γενόμενος
  choice: ആയിത്തീർന്നു
  rationale: പ്രധാനക്രിയയോടുള്ള കൃതന്തബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും, താഴ്ത്തിയതിന്റെ രീതിയായി അനുസരണത്തെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ὑπήκοος
  choice: അനുസരണമുള്ളവൻ
  rationale: അനുസരണത്തിന്റെ ശക്തി കുറയ്ക്കാതെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ സമാനപദം നൽകുന്നു.
- source_word: μέχρι θανάτου
  choice: മരണംവരെ
  rationale: അവന്റെ അനുസരണം മരണംവരെ, അഥവാ മരണത്തിൽത്തന്നെ എത്തിച്ചേർന്നുവെന്ന പരിധി സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: അതും
  rationale: രണ്ടാമത്തെ മരണപ്രയോഗത്തെ വെറും ആവർത്തനമല്ലാതെ ഊന്നിപ്പറയുന്ന ഉയർച്ചയായി മലയാളത്തിൽ സ്വാഭാവികമായി അടയാളപ്പെടുത്തുന്നു.
- source_word: σταυροῦ
  choice: ക്രൂശിലെ
  rationale: സംക്ഷിപ്തമായ ഗ്രീക്ക് ഷഷ്ഠീവിഭക്തി പ്രയോഗത്തെ വ്യക്തമായ മലയാളത്തിൽ അവതരിപ്പിച്ച് ക്രൂശുമരണത്തിന്റെ മൂർത്തത നിലനിർത്തുന്നു.
theological_decisions:
- issue: θανάτου δὲ σταυροῦ എന്ന അവസാന പ്രയോഗത്തിന്റെ ബലം
  choice: “അതും ക്രൂശിലെ മരണംവരെ” എന്ന ഊന്നിയ ഉയർച്ച
  alternative: “അതായത് ക്രൂശുമരണംവരെ” അല്ലെങ്കിൽ അക്ഷരാർഥത്തിൽ “ക്രൂശിന്റെ മരണം”
  rationale: വാചകം സാധാരണ മരണത്തിൽനിന്ന് ക്രൂശിലെ മരണത്തിന്റെ ഞെട്ടിപ്പിക്കുന്ന സ്വഭാവത്തിലേക്ക് ഉയരുന്നു; അധികമായ സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കാതെ ആ വാഗ്‌വൈഭവം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ കൃതന്തഘടനയും അവസാനത്തെ ഊന്നിയ ഉയർച്ചയും വായനാസൗകര്യത്തോടെ സംരക്ഷിച്ചു; എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
