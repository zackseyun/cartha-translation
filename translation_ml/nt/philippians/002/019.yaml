id: PHP.2.19
reference: Philippians 2:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐλπίζω δὲ ἐν κυρίῳ Ἰησοῦ Τιμόθεον ταχέως πέμψαι ὑμῖν, ἵνα κἀγὼ εὐψυχῶ γνοὺς τὰ περὶ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/019.yaml
  text: But I hope in the Lord Jesus to send Timothy to you soon[a], so that I too may be encouraged when I learn the things concerning you.
translation:
  language: ml
  text: എന്നാൽ, തിമൊഥെയൊസിനെ ഉടൻ നിങ്ങളുടെ അടുക്കൽ അയയ്ക്കാൻ കർത്താവായ യേശുവിൽ ഞാൻ പ്രത്യാശിക്കുന്നു; നിങ്ങളെക്കുറിച്ചുള്ള കാര്യങ്ങൾ അറിഞ്ഞ് എനിക്കും ഉത്സാഹം ലഭിക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλπίζω
  choice: ഞാൻ പ്രത്യാശിക്കുന്നു
  rationale: വർത്തമാനകാലത്തിലെ പൗലോസിന്റെ ഇപ്പോഴത്തെ പ്രത്യാശയെയും പ്രതീക്ഷയെയും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭത്തിൽനിന്നുള്ള മൃദുവായ മാറ്റമോ വൈരുധ്യമോ സൂചിപ്പിക്കുന്നു.
- source_word: ἐν κυρίῳ Ἰησοῦ
  choice: കർത്താവായ യേശുവിൽ
  rationale: പൗലോസിന്റെ പ്രത്യാശ കർത്താവായ യേശുവുമായുള്ള ബന്ധത്തിലും ആശ്രയത്തിലും സ്ഥിതിചെയ്യുന്നു എന്ന അർഥം വ്യാഖ്യാനിച്ച് ഇല്ലാതാക്കാതെ നിലനിർത്തുന്നു.
- source_word: Τιμόθεον
  choice: തിമൊഥെയൊസിനെ
  rationale: പുതിയനിയമത്തിലെ ഗ്രീക്ക് പേരിന്റെ മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: ταχέως
  choice: ഉടൻ
  rationale: ഇവിടെ പ്രവൃത്തിയുടെ വേഗത്തെക്കാൾ അയയ്ക്കാൻ ഉദ്ദേശിക്കുന്ന സമയത്തിന്റെ സമീപ്യതയാണ് പ്രധാനമായും സൂചിപ്പിക്കുന്നത്.
- source_word: πέμψαι
  choice: അയയ്ക്കാൻ
  rationale: ἐλπίζω എന്ന ക്രിയയോടു ചേർന്ന അനന്തക്രിയയുടെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὑμῖν
  choice: നിങ്ങളുടെ അടുക്കൽ
  rationale: തിമൊഥെയൊസിന്റെ യാത്രയുടെ ലക്ഷ്യസ്ഥാനമായി വായനക്കാരെ വ്യക്തമായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: ἵνα
  choice: അങ്ങനെ
  rationale: തിമൊഥെയൊസിനെ അയയ്ക്കുന്നതിന്റെ ഉദ്ദേശ്യവും പ്രതീക്ഷിക്കുന്ന ഫലവും മലയാളത്തിൽ സുതാര്യമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: κἀγὼ
  choice: എനിക്കും
  rationale: καί ഉൾക്കൊള്ളുന്ന ‘ഞാനും/എനിക്കും’ എന്ന ഊന്നൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: εὐψυχῶ
  choice: മനസ്സിന് ഉന്മേഷം ലഭിക്കട്ടെ
  rationale: നല്ല മനോനിലയിലാകുക, ധൈര്യപ്പെടുക എന്ന ക്രിയയുടെ ഭാവം ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: γνοὺς
  choice: അറിഞ്ഞ്
  rationale: ആറിസ്റ്റ് പാർട്ടിസിപ്പിളിന്റെ മുൻകാല/സാഹചര്യബന്ധം മലയാളത്തിലെ ക്രിയാവിശേഷണരൂപത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τὰ περὶ ὑμῶν
  choice: നിങ്ങൾ എങ്ങനെയിരിക്കുന്നുവെന്ന്
  rationale: ഫിലിപ്പിയരുടെ അവസ്ഥയെയോ സാഹചര്യങ്ങളെയോ സംബന്ധിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സന്ദർഭാർഥം വായനാസൗകര്യത്തോടെ നൽകുന്നു; കൂടുതൽ രൂപാനുസൃതമായ അർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: ἐν κυρίῳ Ἰησοῦ എന്നതിലെ κύριος എന്ന ക്രിസ്തുസംബന്ധിയായ പദവി
  choice: കർത്താവ്
  alternative: നാഥൻ / യജമാനൻ
  rationale: പുതിയനിയമത്തിലെ ക്രിസ്തുസംബന്ധിയായ κύριος എന്ന പദവിയുടെ സ്ഥിരവും പരിചിതവും ദൈവശാസ്ത്രപരമായി നിഷ്പക്ഷവുമായ മലയാളരൂപം ‘കർത്താവ്’ ആണ്; ഈ വാക്യത്തിൽ മറ്റൊരു വിവർത്തനം ആവശ്യപ്പെടുന്ന സാഹചര്യമില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘കർത്താവായ യേശുവിൽ’ എന്ന പൗലോസിന്റെ ബന്ധാത്മക പ്രയോഗം നിലനിർത്തിയിട്ടുണ്ട്. അവസാന ഭാഗം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകിയതിനൊപ്പം ഗ്രീക്കിന്റെ കൂടുതൽ രൂപാനുസൃതമായ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചിട്ടുണ്ട്.
