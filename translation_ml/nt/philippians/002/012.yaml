id: PHP.2.12
reference: Philippians 2:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὥστε, ἀγαπητοί μου, καθὼς πάντοτε ὑπηκούσατε, μὴ ὡς ἐν τῇ παρουσίᾳ μου μόνον ἀλλὰ νῦν πολλῷ μᾶλλον ἐν τῇ ἀπουσίᾳ μου, μετὰ φόβου καὶ τρόμου τὴν ἑαυτῶν σωτηρίαν κατεργάζεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/012.yaml
  text: So then[a], my beloved, just as you have always obeyed—not only in my presence, but now much more in my absence—work out your own salvation with fear and trembling[c][b],
translation:
  language: ml
  text: അതുകൊണ്ട്, എന്റെ പ്രിയരേ, നിങ്ങൾ എല്ലായ്‌പ്പോഴും അനുസരിച്ചിട്ടുള്ളതുപോലെ—എന്റെ സാന്നിധ്യത്തിൽ മാത്രമല്ല, ഇപ്പോൾ എന്റെ അസാന്നിധ്യത്തിൽ അതിലുമേറെ—ഭയത്തോടും വിറയലോടുംകൂടെ[a] നിങ്ങളുടെ സ്വന്തം രക്ഷ പ്രവർത്തിച്ചു നിറവേറ്റുക[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഭയത്തോടും വിറയലോടുംകൂടെ” എന്നത് ദൈവസന്നിധിയിലെ ഭക്തിപൂർവമായ ഗൗരവത്തെയും വിനീതമായ വിറയലിനെയും സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: b
    text: “പ്രവർത്തിച്ചു നിറവേറ്റുക” എന്നത് രക്ഷയെ ജീവിതത്തിൽ ഫലപ്രാപ്തിയിലേക്കു കൊണ്ടുവരുക എന്ന ആശയം നൽകുന്നു; രക്ഷ സമ്പാദിക്കുക എന്നു വാക്യം നേരിട്ട് പറയുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὥστε
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യങ്ങളിൽനിന്നുള്ള നിഗമനാത്മകമായ ബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀγαπητοί μου
  choice: എന്റെ പ്രിയരേ
  rationale: പൗലോസിന്റെ ഊഷ്മളവും ഇടയപരിപാലനപരവുമായ അഭിസംബോധന മാന്യവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: καθὼς πάντοτε ὑπηκούσατε
  choice: നിങ്ങൾ എല്ലായ്‌പ്പോഴും അനുസരിച്ചിട്ടുള്ളതുപോലെ
  rationale: അവരുടെ തുടർച്ചയായ അനുസരണശീലം ഇപ്പോഴത്തെ പ്രബോധനവുമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: ἐν τῇ παρουσίᾳ μου / ἐν τῇ ἀπουσίᾳ μου
  choice: ഞാൻ നിങ്ങളോടൊപ്പം ഉണ്ടായിരുന്നപ്പോൾ / ഇപ്പോൾ ഞാൻ അകലെയായിരിക്കുമ്പോൾ
  rationale: ഗ്രീക്കിലെ സാന്നിധ്യം–അഭാവം എന്ന വൈരുധ്യം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി ഗ്രഹിക്കാവുന്ന രീതിയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: πολλῷ μᾶλλον
  choice: എത്രയോ അധികമായി
  rationale: താരതമ്യത്തിന്റെ ശക്തമായ ഊന്നൽ സംരക്ഷിക്കുന്നു.
- source_word: μετὰ φόβου καὶ τρόμου
  choice: ഭയത്തോടും വിറയലോടുംകൂടെ
  rationale: പ്രയോഗത്തിന്റെ ഗൗരവവും വൈകാരിക ശക്തിയും മയപ്പെടുത്താതെ നിലനിർത്തുന്നു.
- source_word: τὴν ἑαυτῶν σωτηρίαν
  choice: നിങ്ങളുടെ സ്വന്തം രക്ഷ
  rationale: σωτηρίαയുടെ ദൈവശാസ്ത്രഭാരം ‘രക്ഷ’ എന്ന പദത്തിലൂടെയും ἑαυτῶν എന്ന ആത്മവാചക ഊന്നൽ ‘സ്വന്തം’ എന്നതിലൂടെയും സംരക്ഷിക്കുന്നു.
- source_word: κατεργάζεσθε
  choice: പ്രവർത്തിച്ചുനിറവേറ്റുക
  rationale: ഒരു കാര്യത്തെ ജീവിതത്തിൽ ഫലപ്രാപ്തിയിലേക്കോ പൂർത്തീകരണത്തിലേക്കോ കൊണ്ടുവരുക എന്ന ക്രിയയുടെ വ്യാപ്തി സംരക്ഷിക്കുന്നു; ‘നേടുക’ എന്ന് പരിഭാഷപ്പെടുത്തി അർത്ഥം മുൻകൂട്ടി തീർപ്പാക്കുന്നില്ല.
theological_decisions:
- issue: ‘നിങ്ങളുടെ സ്വന്തം രക്ഷ പ്രവർത്തിച്ചുനിറവേറ്റുക’ എന്നതിന്റെ അർത്ഥം
  choice: രക്ഷയെ ജീവിതത്തിൽ പ്രവർത്തനഫലത്തിലേക്കും നിറവിലേക്കും കൊണ്ടുവരാനുള്ള ആഹ്വാനമായി തുറന്ന നിലയിൽ പരിഭാഷപ്പെടുത്തി.
  alternative: മനുഷ്യപ്രയത്‌നത്താൽ രക്ഷ സമ്പാദിക്കുക എന്നതായി വ്യക്തമാക്കുക.
  rationale: κατεργάζεσθε എന്ന ക്രിയ പ്രവർത്തിച്ചു ഫലത്തിലെത്തിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; എന്നാൽ രക്ഷ സമ്പാദിക്കുന്നുവെന്ന് വാക്യം നേരിട്ട് പറയുന്നില്ല. അടുത്ത വാക്യത്തിലെ ദൈവത്തിന്റെ പ്രവർത്തനവും പ്രസക്തമാണ്. അതിനാൽ ദൈവശാസ്ത്രപരമായ സംഘർഷം മായ്ച്ചുകളയാതെ വാചകം സംരക്ഷിച്ചു.
- issue: ‘ഭയത്തോടും വിറയലോടുംകൂടെ’ എന്ന പ്രയോഗത്തിന്റെ ശക്തി
  choice: ഗൗരവമുള്ള ഭയവും വിനീതമായ വിറയലും ഉൾക്കൊള്ളുന്ന പരമ്പരാഗത രൂപം നിലനിർത്തി.
  alternative: ‘ഭക്ത്യാദരത്തോടെ’ എന്നു മാത്രം മൃദൂകരിക്കുക, അല്ലെങ്കിൽ ‘ഭീതിയോടെ’ എന്നു മാത്രം കടുപ്പിക്കുക.
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ഗൗരവം വെറും ആദരമായി ചുരുക്കുകയോ ഭീകരഭീതിയായി മാത്രം നിർണയിക്കുകയോ ചെയ്യാതെ അതിന്റെ അർത്ഥവ്യാപ്തി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ, എന്നാൽ തിരുവെഴുത്തിനൊത്ത ഗൗരവത്തോടെ രൂപപ്പെടുത്തി. ദീർഘമായ ഗ്രീക്ക് വാക്യത്തിന്റെ ഒഴുക്ക് ഡാഷുകൾ ഉപയോഗിച്ച് വ്യക്തമായി സൂക്ഷിച്ചു; പുരാതന കല്പനാരൂപങ്ങൾ ഒഴിവാക്കി.
