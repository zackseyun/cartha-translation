revisions:
- from: അങ്ങനെ നിങ്ങൾ കുറ്റമറ്റവരും നിർമലരുമായിത്തീർന്ന്, വക്രവും വഴിതെറ്റിയതുമായ ഒരു തലമുറയുടെ നടുവിൽ കളങ്കമില്ലാത്ത ദൈവമക്കളായിരിക്കണം[a]. അവരുടെ ഇടയിൽ നിങ്ങൾ ലോകത്തിൽ വെളിച്ചങ്ങളെപ്പോലെ പ്രകാശിക്കുന്നു[b][c].
  to: അങ്ങനെ നിങ്ങൾ കുറ്റമറ്റവരും നിർമലരും, വക്രവും വികൃതവുമായ ഒരു തലമുറയുടെ നടുവിൽ കളങ്കമില്ലാത്ത ദൈവമക്കളും ആയിത്തീരേണ്ടതിന്[a]. അവരുടെ ഇടയിൽ നിങ്ങൾ ലോകത്തിൽ ജ്യോതിസ്സുകളെപ്പോലെ പ്രകാശിക്കുന്നു[b][c].
  rationale: The revision restores the Greek purpose sense of ἵνα γένησθε, preserves the direct association of ‘കളങ്കമില്ലാത്ത’ with ‘ദൈവമക്കൾ,’ uses a closer equivalent for διεστραμμένης, and relocates every footnote anchor to its proper textual referent. No disputed textual or theological interpretation is introduced.
