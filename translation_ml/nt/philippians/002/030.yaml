id: PHP.2.30
reference: Philippians 2:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι διὰ τὸ ἔργον ⸀Χριστοῦ μέχρι θανάτου ἤγγισεν, ⸀παραβολευσάμενος τῇ ψυχῇ ἵνα ἀναπληρώσῃ τὸ ὑμῶν ὑστέρημα τῆς πρός με λειτουργίας.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/030.yaml
  text: because for the work of Messiah he came near to death[c][b][a], risking his life to make up for what was lacking in your service to me.
translation:
  language: ml
  text: എന്തെന്നാൽ, മശീഹയുടെ[a] വേല നിമിത്തം[c] അവൻ മരണത്തോളം അടുത്തെത്തി; എനിക്കുള്ള നിങ്ങളുടെ സേവനത്തിൽ കുറവായിരുന്നത്[b] നികത്തുന്നതിനായി സ്വന്തം ജീവൻ പണയപ്പെടുത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, ‘ക്രിസ്തുവിന്റെ.’ ഗ്രീക്കിൽ: ‘മശീഹയുടെ/ക്രിസ്തുവിന്റെ വേല.’'
    reason: alternative_reading
  - marker: b
    text: ‘കുറവായിരുന്നത്’ എന്നത് ഫിലിപ്പിയർ അകലെയായിരുന്നതിനാൽ നേരിട്ട് നൽകാൻ കഴിയാതിരുന്ന സേവനത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അവർക്ക് സേവിക്കാൻ മനസ്സില്ലായിരുന്നു എന്നല്ല.
    reason: cultural_note
  - marker: c
    text: അഥവാ, ‘മശീഹയുടെ വേലയ്ക്കുവേണ്ടി.’
    reason: previous_rendering
lexical_decisions:
- source_word: διὰ τὸ ἔργον Χριστοῦ
  choice: മശീഹയുടെ വേലയ്ക്കുവേണ്ടി
  rationale: διά + accusative ഇവിടെ കാരണമോ ‘നിമിത്തമോ’ സൂചിപ്പിക്കുന്നു. ‘വേലയ്ക്കുവേണ്ടി’ എന്നത് ആ കാരണത്തോടൊപ്പം സ്വയം സമർപ്പിച്ച പ്രവർത്തനത്തിന്റെ ഭാവവും സ്വാഭാവികമായി അറിയിക്കുന്നു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: Χριστοῦ
  choice: മശീഹയുടെ
  rationale: Χριστός ഇവിടെ പദവിയുടെ അർഥശക്തി നിലനിർത്തുന്നതിനാൽ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി; മലയാളത്തിൽ പതിവായ ‘ക്രിസ്തു’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: μέχρι θανάτου ἤγγισεν
  choice: മരണത്തോടടുത്തു
  rationale: മരണത്തിന്റെ അതിരോളം എത്തിയെന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: παραβολευσάμενος τῇ ψυχῇ
  choice: സ്വന്തം ജീവൻ പണയപ്പെടുത്തി
  rationale: അപകടത്തിന് സ്വയം വിധേയനാക്കിയെന്ന participle-ന്റെ ശക്തി ഈ മലയാളപ്രയോഗം വ്യക്തമാക്കുന്നു; ψυχή ഇവിടെ ഭൗമികജീവനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἵνα ἀναπληρώσῃ
  choice: നികത്താൻ
  rationale: ἵνα ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു; ἀναπληρόω ഇവിടെ ലഭ്യമല്ലാതിരുന്ന സഹായം പൂരിപ്പിക്കുക എന്ന അർഥത്തിലാണ്.
- source_word: τὸ ὑμῶν ὑστέρημα
  choice: നിങ്ങളുടെ സേവനത്തിൽ കുറവായിരുന്നത്
  rationale: ഇത് ധാർമികമായ കുറ്റമോ മനസ്സില്ലായ്മയോ അല്ല, അവരുടെ അഭാവംമൂലം നേരിട്ട് നൽകാനാകാതിരുന്ന സേവനമാണ്; അതിനാൽ കുറ്റപ്പെടുത്താത്ത ഭാഷ ഉപയോഗിച്ചു.
- source_word: τῆς πρός με λειτουργίας
  choice: എനിക്കുള്ള നിങ്ങളുടെ സേവനത്തിൽ
  rationale: λειτουργία ഇവിടെ പ്രായോഗിക സഹായം ഉൾപ്പെടുന്ന വിശാലമായ സേവനത്തെ സൂചിപ്പിക്കുന്നു; ‘സേവനം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സന്ദർഭോചിതവുമാണ്.
theological_decisions:
- issue: പൗലോസിന്റെ പ്രയോഗത്തിലെ Χριστοῦ എന്ന പദവിയുടെ പരിഭാഷ
  choice: മശീഹയുടെ
  alternative: ക്രിസ്തുവിന്റെ
  rationale: പദവി എന്ന നിലയിലെ അർഥം കേൾപ്പിക്കാൻ ‘മശീഹ’ മുഖ്യവാചകത്തിൽ ഉപയോഗിച്ചു; മലയാള ക്രൈസ്തവ പ്രയോഗത്തിൽ സുപരിചിതമായ പര്യായം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: ‘കുറവ്’ ഫിലിപ്പിയരുടെ കുറ്റമാണോ എന്ന വ്യാഖ്യാനം
  choice: സേവനത്തിൽ കുറവായിരുന്നത്
  alternative: നിങ്ങളുടെ കുറവ്
  rationale: സന്ദർഭം അവരുടെ മനസ്സില്ലായ്മയെ കുറ്റപ്പെടുത്തുന്നില്ല; അവർ അകലെയായിരുന്നതിനാൽ നേരിട്ട് ചെയ്യാൻ കഴിയാതിരുന്നത് എപ്പഫ്രൊദിത്തോസ് നികത്തിയെന്നാണ് സൂചന. അതിനാൽ ഗ്രീക്കിലെ tension നിലനിർത്തിക്കൊണ്ട് അനാവശ്യ കുറ്റാരോപണം ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘സ്വന്തം ജീവൻ പണയപ്പെടുത്തി’ എന്ന സ്വാഭാവിക പ്രയോഗം അപകടകരമായ സ്വയംസമർപ്പണം വ്യക്തമാക്കുന്നു; ‘സേവനം’ പ്രായോഗിക സഹായവും ശുശ്രൂഷയും ഉൾക്കൊള്ളുന്ന വിശാലപദമായി ഉപയോഗിച്ചു.
