id: PHP.2.11
reference: Philippians 2:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ πᾶσα γλῶσσα ἐξομολογήσηται ὅτι κύριος Ἰησοῦς Χριστὸς εἰς δόξαν θεοῦ πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/011.yaml
  text: and every tongue should confess that Jesus the Messiah is Lord[b][a], to the glory of God the Father.
translation:
  language: ml
  text: എല്ലാ നാവും മശീഹയായ യേശു കർത്താവാണെന്ന്[b][a] ഏറ്റുപറയേണ്ടതിനും, പിതാവായ ദൈവത്തിന്റെ മഹത്വത്തിനായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “യേശുമശീഹാ കർത്താവാണ്.”'
    reason: alternative_reading
  - marker: b
    text: 'അല്ലെങ്കിൽ: “എല്ലാ നാവും … ഏറ്റുപറയും.”'
    reason: previous_rendering
lexical_decisions:
- source_word: πᾶσα γλῶσσα
  choice: എല്ലാ നാവും
  rationale: സാർവത്രികമായ ഏറ്റുപറച്ചിലിനെ സൂചിപ്പിക്കുന്ന ശരീരാവയവരൂപകം നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായ ബൈബിൾഭാഷ നൽകുകയും ചെയ്യുന്നു.
- source_word: ἐξομολογήσηται
  choice: ഏറ്റുപറയേണ്ടതിനും
  rationale: മുൻവാക്യത്തിൽ ആരംഭിക്കുന്ന ഉദ്ദേശ്യഘടനയോടും ഗ്രീക്കിലെ വിധിലിംഗത്തോടും ബന്ധം നിലനിർത്തുന്നു; ‘ഏറ്റുപറയുക’ എന്നത് പരസ്യമായ സമ്മതപ്രഖ്യാപനത്തിന്റെ ഭാവം അനാവശ്യ വിശദീകരണമില്ലാതെ നൽകുന്നു.
- source_word: κύριος
  choice: കർത്താവ്
  rationale: κύριος എന്ന പദത്തിന്റെ അംഗീകൃതവും സ്വാഭാവികവുമായ മലയാള സമാനപദം; ഇവിടെ ക്രിസ്തുശാസ്ത്രപരമായ പ്രഖ്യാപനവും തിരുവെഴുത്തിലെ സാർവത്രിക വണക്കം സംബന്ധിച്ച പ്രതിധ്വനിയും നിലനിർത്തുന്നു.
- source_word: Χριστός
  choice: മശീഹയായ
  rationale: ഇവിടെ Χριστός വ്യക്തിനാമത്തേക്കാൾ പദവിയായി പ്രവർത്തിക്കുന്നതിനാൽ അതിന്റെ അർത്ഥം വിവർത്തനം ചെയ്യുന്നു; ‘മശീഹയായ യേശു’ ആ പദവിയുടെ സജീവത സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: εἰς δόξαν
  choice: മഹത്വത്തിനായി
  rationale: εἰς എന്നതിന്റെ ലക്ഷ്യ/ഫലഭാവം മലയാളത്തിൽ സംക്ഷിപ്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: θεοῦ πατρός
  choice: പിതാവായ ദൈവത്തിന്റെ
  rationale: ഗ്രീക്ക് പദബന്ധത്തിന്റെ അർത്ഥം വ്യക്തമായി നൽകുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
theological_decisions:
- issue: ക്രിസ്തുശാസ്ത്രപരമായ പ്രഖ്യാപനത്തിൽ Χριστός എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: മശീഹയായ യേശു
  alternative: യേശുക്രിസ്തു
  rationale: Χριστός ഇവിടെ പദവിയെന്ന നിലയിൽ അർത്ഥവത്തായതിനാൽ ‘മശീഹ’ എന്ന് വിവർത്തനം ചെയ്യുന്നു; പരമ്പരാഗത ലിപ്യന്തരണമായ ‘ക്രിസ്തു’ പ്രധാനപാഠത്തിലേക്ക് കൊണ്ടുവന്ന് പദവിയുടെ അർത്ഥം മറയ്ക്കുന്നില്ല.
- issue: κύριος Ἰησοῦς Χριστός എന്ന പ്രഖ്യാപനത്തിന്റെ മലയാള പദക്രമം
  choice: മശീഹയായ യേശു കർത്താവാണ്
  alternative: യേശുമശീഹാ കർത്താവാണ്
  rationale: പ്രധാനപാഠം Χριστός-നെ യേശുവിനെ വിശേഷിപ്പിക്കുന്ന പദവിയായി വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു; ഗ്രീക്കിന്റെ കൂടുതൽ സംക്ഷിപ്തമായ നാമ-പദവി ക്രമം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി. വാക്യം 10-ൽ ആരംഭിക്കുന്ന ഉദ്ദേശ്യവാക്യത്തിന്റെ തുടർച്ചയായതിനാൽ ‘ഏറ്റുപറയേണ്ടതിനും’ എന്ന ബന്ധിതരൂപം ഉപയോഗിച്ചു. ദീർഘരേഖ അവസാനത്തെ ദൈവമഹത്വവാക്യഭാഗത്തെ വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു.
