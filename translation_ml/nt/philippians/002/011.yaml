- from: എല്ലാ നാവും മശീഹയായ യേശു കർത്താവാണെന്ന്[b][a] ഏറ്റുപറയേണ്ടതിനും—പിതാവായ ദൈവത്തിന്റെ മഹത്വത്തിനായി.
