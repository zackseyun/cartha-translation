    reason: previous_rendering
  revision_rationale: The revision removes only the disruptive dash and regularizes footnote b. It preserves the dependent purpose construction indicated by the wider sentence beginning in verse 10, the universal bodily metaphor, the confession’s content, and its orientation to the Father’s glory.
