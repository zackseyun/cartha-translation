id: PHP.2.24
reference: Philippians 2:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πέποιθα δὲ ἐν κυρίῳ ὅτι καὶ αὐτὸς ταχέως ἐλεύσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/024.yaml
  text: I am confident in the Lord that I myself will also come soon.
translation:
  language: ml
  text: എന്നാൽ, ഞാൻ തന്നെയും ഉടൻ വരുമെന്ന് കർത്താവിൽ എനിക്ക് ഉറപ്പുണ്ട്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഞാൻ തന്നെയും ഉടൻ വരുമെന്ന് ഞാൻ കർത്താവിൽ വിശ്വസിക്കുന്നു.”
    reason: πέποιθα എന്ന പദത്തെ ‘ഉറപ്പുണ്ട്’ എന്നതിനുപകരം ‘വിശ്വസിക്കുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം.
lexical_decisions:
- source_word: πέποιθα
  choice: എനിക്ക് ഉറപ്പുണ്ട്
  rationale: പൂർണകാലരൂപം സൂചിപ്പിക്കുന്ന, ഇപ്പോഴും നിലനിൽക്കുന്ന ഉറച്ച ആത്മവിശ്വാസം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യവുമായി ബന്ധിപ്പിക്കുന്ന മൃദുവായ സംക്രമണം പ്രകടമാക്കുന്നു; ഇവിടെ ശക്തമായ വൈരുധ്യം ഉദ്ദേശിക്കുന്നില്ല.
- source_word: ἐν κυρίῳ
  choice: കർത്താവിൽ
  rationale: പൗലോസിന്റെ പതിവുശൈലി നിലനിർത്തുകയും അദ്ദേഹത്തിന്റെ ഉറപ്പ് കർത്താവിൽ അധിഷ്ഠിതമാണെന്ന ആശയം തുറന്നുവെക്കുകയും ചെയ്യുന്നു.
- source_word: καὶ αὐτὸς
  choice: ഞാൻതന്നെയും
  rationale: καί എന്നതിന്റെ കൂട്ടിച്ചേർക്കൽഭാവവും αὐτός നൽകുന്ന പൗലോസ് വ്യക്തിപരമായി വരുമെന്ന ഊന്നലും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
- source_word: ταχέως
  choice: ഉടൻ
  rationale: യാത്രയുടെ വേഗത്തെക്കാൾ സമയസാമീപ്യമാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്.
- source_word: ἐλεύσομαι
  choice: വരും
  rationale: ഫിലിപ്പിയരോടു സംസാരിക്കുന്ന ഗ്രീക്ക് വാക്യത്തിന്റെ ദിശാസൂചനയായ ‘വരുക’ നിലനിർത്തുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ ഉറപ്പും ‘കർത്താവിൽ’ എന്ന പ്രയോഗവും തമ്മിലുള്ള ബന്ധം
  choice: കർത്താവിൽ എനിക്ക് ഉറപ്പുണ്ട്
  alternative: ഞാൻതന്നെയും ഉടൻ വരുമെന്ന് കർത്താവിൽ ഞാൻ വിശ്വസിക്കുന്നു
  rationale: പൗലോസിന്റെ പ്രതീക്ഷ വെറും വ്യക്തിപരമായ ശുഭാപ്തിവിശ്വാസമല്ലെന്നും കർത്താവിൽ അധിഷ്ഠിതമാണെന്നും പ്രകടമാക്കുന്നു; അതേസമയം ഇത് നേരിട്ടുള്ള വെളിപ്പാടോ മാറ്റമില്ലാത്ത ദൈവിക വാഗ്ദാനമോ ആണെന്ന് വാചകത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ഞാൻതന്നെയും’ എന്ന രൂപം അല്പം ഊന്നലുള്ളതാണെങ്കിലും ഗ്രീക്കിലെ καὶ αὐτός എന്ന ഇരട്ടപ്രാധാന്യം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
