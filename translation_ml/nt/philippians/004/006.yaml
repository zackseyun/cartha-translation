id: PHP.4.6
reference: Philippians 4:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μηδὲν μεριμνᾶτε, ἀλλ’ ἐν παντὶ τῇ προσευχῇ καὶ τῇ δεήσει μετ’ εὐχαριστίας τὰ αἰτήματα ὑμῶν γνωριζέσθω πρὸς τὸν θεόν·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/006.yaml
  text: Do not be anxious about anything[a], but in everything, by prayer and petition with thanksgiving[c][b], let your requests be made known to God.
translation:
  language: ml
  text: ഒന്നിനെക്കുറിച്ചും ഉത്കണ്ഠപ്പെടേണ്ട[a], പകരം എല്ലാ കാര്യത്തിലും പ്രാർഥനയാലും അപേക്ഷയാലും നന്ദിയോടെ നിങ്ങളുടെ അഭ്യർഥനകൾ ദൈവത്തോട്[c] അറിയിക്കപ്പെടട്ടെ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒന്നിനെക്കുറിച്ചും ആകുലപ്പെടേണ്ട.’
    reason: lexical_alternative
  - marker: b
    text: ‘അപേക്ഷ’ എന്നതിന് ‘യാചന’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘ദൈവസന്നിധിയിൽ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲν μεριμνᾶτε
  choice: ഒന്നിനെക്കുറിച്ചും ഉത്കണ്ഠപ്പെടരുത്
  rationale: നിഷേധകല്പനയോടുകൂടിയ μηδὲν മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഒന്നിനെക്കുറിച്ചും’ എന്നു വരുന്നു; μεριμνάω സൂചിപ്പിക്കുന്ന വ്യാകുലമായ ചിന്തയെ ‘ഉത്കണ്ഠപ്പെടുക’ വ്യക്തവും ഗൗരവമുള്ളതുമായി പകർന്നു നൽകുന്നു.
- source_word: ἀλλ’ ἐν παντὶ
  choice: പകരം, എല്ലാ കാര്യത്തിലും
  rationale: ἀλλά മുൻവിലക്കിനോടുള്ള ശക്തമായ വൈരുധ്യം സൂചിപ്പിക്കുന്നു; ἐν παντίയുടെ സമഗ്രമായ വ്യാപ്തി ‘എല്ലാ കാര്യത്തിലും’ നിലനിർത്തുന്നു.
- source_word: τῇ προσευχῇ
  choice: പ്രാർഥനയാൽ
  rationale: ദൈവത്തോടുള്ള പൊതുവായ പ്രാർഥനയെ സൂചിപ്പിക്കുന്ന προσευχήയ്ക്കുള്ള സ്വാഭാവികവും നിലവാരമുള്ളതുമായ മലയാളപദം.
- source_word: τῇ δεήσει
  choice: അപേക്ഷയാൽ
  rationale: δέησις പ്രത്യേക ആവശ്യവുമായി നടത്തുന്ന യാചനയെയാണ് സൂചിപ്പിക്കുന്നത്; പൊതുവായ ‘പ്രാർഥന’യിൽനിന്നുള്ള വ്യത്യാസം ‘അപേക്ഷ’ നിലനിർത്തുന്നു.
- source_word: μετ’ εὐχαριστίας
  choice: നന്ദിയോടെ
  rationale: കൃതജ്ഞത പ്രാർഥനയോടും അപേക്ഷയോടും കൂടെയുണ്ടാകണം എന്ന സഹചാരാർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τὰ αἰτήματα ὑμῶν
  choice: നിങ്ങളുടെ അഭ്യർഥനകൾ
  rationale: αἴτημα ചോദിക്കുന്ന പ്രത്യേക കാര്യങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; δέησις എന്നതിന് നൽകിയ ‘അപേക്ഷ’ ആവർത്തിക്കാതെ അർഥവ്യത്യാസം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: γνωριζέσθω
  choice: അറിയിക്കപ്പെടട്ടെ
  rationale: വർത്തമാനകാല കർമണിപ്രയോഗത്തിലുള്ള കല്പനയുടെ രൂപവും ആഹ്വാനശക്തിയും കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: πρὸς τὸν θεόν
  choice: ദൈവത്തോട്
  rationale: πρός ഇവിടെ അഭ്യർഥനകൾ ഏവനിലേക്കാണ് അറിയിക്കപ്പെടുന്നത് എന്നു സൂചിപ്പിക്കുന്നു; ‘ദൈവത്തോട്’ സ്വാഭാവികമായ നേരിട്ടുള്ള തുല്യപദമാണ്.
theological_decisions:
- issue: πρὸς τὸν θεόν എന്നതിന്റെ ബന്ധാർഥം
  choice: ദൈവത്തോട്
  alternative: ദൈവസന്നിധിയിൽ
  rationale: πρός എന്നത് ഇവിടെ ദൈവത്തിലേക്കുള്ള അഭിമുഖതയോ ദിശയോ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു. ‘ദൈവസന്നിധിയിൽ’ സാധ്യമായ വ്യാഖ്യാനമാണെങ്കിലും സ്ഥലം/സാന്നിധ്യം എന്ന ഭാവം കൂടുതൽ മുൻനിറുത്തുന്നു; അതിനാൽ അത് അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി. ‘പ്രാർഥന’, ‘അപേക്ഷ’, ‘അഭ്യർഥനകൾ’ എന്നീ പദങ്ങൾ ഉപയോഗിച്ച് ഗ്രീക്കിലെ ബന്ധപ്പെട്ടെങ്കിലും വ്യത്യസ്തമായ പദങ്ങളുടെ ഭേദം നിലനിർത്തി. കർമണിക കല്പനയായ γνωριζέσθω ഔപചാരികത അല്പം നിലനിർത്തുന്ന ‘അറിയിക്കപ്പെടട്ടെ’ എന്ന രൂപത്തിൽ പകർന്നു.
