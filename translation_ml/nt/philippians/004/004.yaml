  text: Χαίρετε ἐν κυρίῳ πάντοτε· πάλιν ἐρῶ, χαίρετε.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/004.yaml
  text: Rejoice in the Lord always[a]; again I will say[b], rejoice.
translation:
  language: ml
  text: കർത്താവിൽ എപ്പോഴും ആനന്ദിക്കുവിൻ[a]; വീണ്ടും ഞാൻ പറയും[b], ആനന്ദിക്കുവിൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “കർത്താവിൽ എപ്പോഴും സന്തോഷിക്കുവിൻ.”
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “വീണ്ടും ഞാൻ പറയും, ആനന്ദിക്കുവിൻ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Χαίρετε
  choice: ആനന്ദിക്കുവിൻ
  rationale: വർത്തമാനകാല സജീവ ആജ്ഞാരൂപവും ബഹുവചന അഭിസംബോധനയും നിലനിർത്തുന്നു. ആധുനിക മലയാളത്തിൽ മാന്യവും തിരുവെഴുത്തുശൈലിക്ക് യോജിച്ചതുമായ ആഹ്വാനമാണിത്.
- source_word: ἐν
  choice: -യിൽ
  rationale: കർത്താവുമായുള്ള ബന്ധത്തിലോ ഐക്യത്തിലോ ഉള്ള ആനന്ദം എന്ന വിശാലമായ ആശയം നിലനിർത്തുന്ന സ്ഥാനികപ്രയോഗം; കാരണമെന്നോ ഉപകരണമെന്നോ മാത്രം ചുരുക്കുന്നില്ല.
- source_word: κυρίῳ
  choice: കർത്താവിൽ
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിൽ ഇവിടെ ക്രിസ്തുവിനെ സൂചിപ്പിക്കുന്ന κύριος എന്ന പദത്തിന് സ്വാഭാവികവും സ്ഥാപിതവുമായ മലയാളപരിഭാഷ.
- source_word: πάντοτε
  choice: എപ്പോഴും
  rationale: തുടർച്ചയായ കാലവ്യാപ്തി ലളിതവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: ഊന്നലോടെയുള്ള ആവർത്തനം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἐρῶ
  choice: ഞാൻ പറയും
  rationale: λέγω എന്ന ക്രിയയുടെ ഭാവികാലരൂപം വർത്തമാനകാലമാക്കി മാറ്റാതെ കൃത്യമായി സൂക്ഷിക്കുന്നു.
- source_word: χαίρετε
  choice: ആനന്ദിക്കുവിൻ
  rationale: ആദ്യ ആജ്ഞയോടുള്ള പദസാമ്യം നിലനിർത്തി പൗലോസിന്റെ ആവർത്തനവും ഊന്നലും പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: “കർത്താവിൽ” എന്നതിന്റെ അർഥം
  choice: കർത്താവുമായുള്ള ബന്ധത്തിലും ഐക്യത്തിലും ആനന്ദിക്കുക എന്ന ബന്ധപരമായ/പരിധിസൂചകമായ വായന തുറന്നുവെക്കുന്നു.
  alternative: കർത്താവിനാൽ ആനന്ദിക്കുക; കർത്താവിനെച്ചൊല്ലി ആനന്ദിക്കുക.
  rationale: ἐν κυρίῳ എന്ന പ്രയോഗം ബന്ധം, ഐക്യം, പ്രവർത്തനപരിധി എന്നിവയുടെ വിശാലത വഹിക്കാം. “കർത്താവിൽ” ആ വിശാലത നിലനിർത്തി ഒരു വ്യാഖ്യാനം മാത്രം നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ബഹുവചന ആജ്ഞയുടെ ഭാവം വ്യക്തമാക്കാൻ “ആനന്ദിക്കുവിൻ” ഉപയോഗിച്ചു; “കർത്താവിൽ” എന്ന പ്രയോഗത്തിന്റെ ഉദ്ദേശ്യപൂർവമായ അർഥവിശാലത സംരക്ഷിച്ചു.
