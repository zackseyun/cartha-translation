id: PHP.4.15
reference: Philippians 4:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οἴδατε δὲ καὶ ὑμεῖς, Φιλιππήσιοι, ὅτι ἐν ἀρχῇ τοῦ εὐαγγελίου, ὅτε ἐξῆλθον ἀπὸ Μακεδονίας, οὐδεμία μοι ἐκκλησία ἐκοινώνησεν εἰς λόγον δόσεως καὶ λήμψεως εἰ μὴ ὑμεῖς μόνοι,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/015.yaml
  text: And you yourselves also know[a], Philippians, that at the beginning of the gospel, when I departed from Macedonia, no church shared with me in the matter of giving and receiving except you alone.
translation:
  language: ml
  text: ഫിലിപ്പിയരേ, സുവിശേഷത്തിന്റെ ആരംഭത്തിൽ, ഞാൻ മക്കെദോന്യയിൽനിന്ന് പുറപ്പെട്ടപ്പോൾ, കൊടുക്കലും സ്വീകരിക്കലും സംബന്ധിച്ച കാര്യത്തിൽ[a] നിങ്ങളല്ലാതെ മറ്റൊരു സഭയും എന്നോടൊപ്പം പങ്കുചേർന്നില്ലെന്ന് നിങ്ങളുംതന്നെ അറിയുന്നുവല്ലോ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കൊടുക്കലിന്റെയും സ്വീകരിക്കലിന്റെയും കണക്കിൽ.”
    reason: λόγος എന്ന പദത്തിന് വ്യാപാരമോ കണക്കുപുസ്തകമോ സംബന്ധിച്ച ‘കണക്ക്’ എന്ന സൂചന ഉണ്ടായേക്കാം; മുഖ്യവാചകത്തിലെ ‘കാര്യം’ എന്ന പരിഭാഷയ്‌ക്കൊപ്പം ഈ പദസാധ്യതയും സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: Οἴδατε
  choice: അറിയുന്നുവല്ലോ
  rationale: οἶδα എന്ന ക്രിയയുടെ സന്ദർഭോചിതമായ വർത്തമാനസ്ഥിതിയെയും, വായനക്കാരുടെ പൊതുവായ അറിവിലേക്കുള്ള പൗലോസിന്റെ അഭ്യർഥനാഭാവത്തെയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്താതെ വാക്യപ്രവാഹത്തിൽ ഉൾപ്പെടുത്തി
  rationale: ഇവിടെ ശക്തമായ വൈരുധ്യമല്ല, ആശയത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്ന ലഘുവായ ബന്ധകപ്രയോഗമാണ്; മലയാളത്തിൽ പ്രത്യേക ബന്ധകപദമില്ലാതെയും ഈ പ്രവാഹം സ്വാഭാവികമായി നിലനിൽക്കുന്നു.
- source_word: καὶ ὑμεῖς
  choice: നിങ്ങൾതന്നെയും
  rationale: καί എന്നതിന്റെ കൂട്ടിച്ചേർക്കൽഭാവവും ὑμεῖς എന്നതിന്റെ ഊന്നലും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: Φιλιππήσιοι
  choice: ഫിലിപ്പിയരേ
  rationale: നഗരനാമത്തിൽനിന്നുള്ള ജനസംബോധന മലയാളത്തിൽ സ്വാഭാവികമായും കത്തിന്റെ ഗൗരവമുള്ള ശൈലിക്ക് യോജിച്ചും നൽകുന്നു.
- source_word: ἐν ἀρχῇ τοῦ εὐαγγελίου
  choice: സുവിശേഷത്തിന്റെ ആരംഭത്തിൽ
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തപ്രയോഗം നിലനിർത്തുകയും, അത് പൗലോസിന്റെ സുവിശേഷപ്രവർത്തനത്തിന്റെ ഏത് പ്രത്യേക ഘട്ടത്തെ സൂചിപ്പിക്കുന്നു എന്ന് വാചകത്തിൽ അധികമായി വ്യാഖ്യാനിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐξῆλθον ἀπὸ Μακεδονίας
  choice: ഞാൻ മക്കെദോന്യയിൽനിന്ന് പുറപ്പെട്ടപ്പോൾ
  rationale: ἐξέρχομαι എന്നതിന്റെ പുറപ്പെടൽഭാവവും ἀπό സൂചിപ്പിക്കുന്ന ആരംഭസ്ഥാനവും വ്യക്തമായി നൽകുന്നു.
- source_word: οὐδεμία ... ἐκκλησία
  choice: മറ്റൊരു സഭയും ... ഇല്ല
  rationale: ഒരൊറ്റ സഭപോലും പങ്കുചേർന്നില്ലെന്ന സമ്പൂർണ നിഷേധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐκοινώνησεν μοι
  choice: എന്നോടൊപ്പം പങ്കുചേർന്നില്ല
  rationale: κοινωνέω സൂചിപ്പിക്കുന്ന പങ്കാളിത്തത്തെ നിലനിർത്തുന്നു; സന്ദർഭം സാമ്പത്തിക സഹായമാണെങ്കിലും അർഥം വെറും പണമിടപാടായി ചുരുക്കുന്നില്ല.
- source_word: εἰς λόγον δόσεως καὶ λήμψεως
  choice: കൊടുക്കലും വാങ്ങലും സംബന്ധിച്ച കാര്യത്തിൽ
  rationale: λόγος എന്ന പദത്തിന് ഇവിടെ ‘കാര്യം’ എന്നും ‘കണക്ക്’ എന്നും ഗ്രഹിക്കാവുന്ന സാധ്യതയുണ്ട്. മുഖ്യവാചകത്തിൽ വിശാലവും വ്യക്തവുമായ അർഥം നൽകി, കണക്കുപുസ്തകസംബന്ധമായ സൂചന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: εἰ μὴ ὑμεῖς μόνοι
  choice: നിങ്ങളല്ലാതെ
  rationale: ഒഴിവാക്കൽഭാവവും നിങ്ങൾ മാത്രം എന്ന ഊന്നലും മലയാളത്തിലെ സ്വാഭാവിക ഏകപ്രയോഗത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: “സുവിശേഷത്തിന്റെ ആരംഭം” ഏത് കാലഘട്ടത്തെ സൂചിപ്പിക്കുന്നു
  choice: സുവിശേഷത്തിന്റെ ആരംഭത്തിൽ
  alternative: നിങ്ങളുടെ ഇടയിലെ സുവിശേഷപ്രവർത്തനത്തിന്റെ ആരംഭത്തിൽ
  rationale: ഗ്രീക്ക് പാഠം സ്ഥലം അല്ലെങ്കിൽ പ്രവർത്തനഘട്ടം വിശദമായി നിർവചിക്കുന്നില്ല; അതിനാൽ വ്യാഖ്യാനപരമായ വിപുലീകരണം ഒഴിവാക്കി യഥാർഥ അവ്യക്തത നിലനിർത്തുന്നു.
- issue: സഭയുടെ പങ്കാളിത്തത്തിന്റെ സ്വഭാവം
  choice: എന്നോടൊപ്പം പങ്കുചേർന്നു
  alternative: എനിക്ക് സാമ്പത്തികസഹായം നൽകി
  rationale: സന്ദർഭം ഭൗതികസഹായത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും κοινωνέω പങ്കാളിത്തം എന്ന വിശാല ആശയവും വഹിക്കുന്നു; അതിനെ വെറും സംഭാവനയായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കത്തുശൈലി ഉപയോഗിച്ചു. അതിസംസ്കൃത പദങ്ങളും സഭാവിഭാഗവിശേഷമായ പ്രയോഗങ്ങളും ഒഴിവാക്കി. ഗ്രീക്കിലെ ദീർഘവാക്യഘടന വായിക്കാവുന്ന മലയാളക്രമത്തിൽ പുനഃക്രമീകരിച്ചെങ്കിലും അഭിസംബോധന, സമയസൂചന, നിഷേധം, ഊന്നൽ എന്നിവ മുഴുവനും നിലനിർത്തി.
