  source_fidelity: 'പ്രധാന ആശയം ഗ്രീക്കിനോട് വിശ്വസ്തമാണ്: ഫിലിപ്പിയരെ അഭിസംബോധന ചെയ്യുന്നതും, സുവിശേഷത്തിന്റെ ആരംഭവും, മക്കെദോന്യയിൽനിന്നുള്ള പൗലോസിന്റെ പുറപ്പാടും, മറ്റൊരു സഭയുടെ അഭാവവും, ഫിലിപ്പിയരുടെ բացառ്യമായ പങ്കാളിത്തവും നിലനിൽക്കുന്നു. എന്നാൽ λῆμψις-ന്റെ അടിസ്ഥാനാർഥം ‘സ്വീകരിക്കൽ’ ആയിരിക്കെ ‘വാങ്ങൽ’ എന്നു നൽകുന്നത് വാങ്ങൽ/വിലകൊടുത്തു സമ്പാദിക്കൽ എന്ന അനാവശ്യമായ അർഥസൂചന ഉണ്ടാക്കാം.'
  naturalness: ‘നിങ്ങൾതന്നെയും’ എന്ന രൂപം ആധുനിക നിലവാരമലയാളത്തിൽ അല്പം അസ്വാഭാവികമാണ്. ‘നിങ്ങളുംതന്നെ’ കൂടുതൽ സ്വാഭാവികമായി കൂട്ടിച്ചേർക്കൽഭാവവും ഊന്നലും പ്രകടിപ്പിക്കുന്നു. ‘കൊടുക്കലും സ്വീകരിക്കലും’ സാമ്പത്തിക/കണക്കുപരമായ പ്രയോഗമായും സ്വാഭാവികമാണ്.
  terminology: ‘സുവിശേഷം,’ ‘സഭ,’ ‘ഫിലിപ്പിയരേ’ എന്നിവ യോജിച്ച ഗൗരവമുള്ള ആധുനിക പ്രയോഗങ്ങളാണ്. δόσις καὶ λῆμψις എന്ന ജോടിക്ക് ‘കൊടുക്കലും സ്വീകരിക്കലും’ ഉപയോഗിക്കണം; കണക്കുപുസ്തകമോ അക്കൗണ്ടോ എന്ന λόγος-ന്റെ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്താം.
