  rationale: ‘വാങ്ങൽ’ എന്നതിനു പകരം ‘സ്വീകരിക്കൽ’ ഉപയോഗിച്ച് λῆμψις-ന്റെ അടിസ്ഥാനാർഥവും ‘giving and receiving’ എന്ന കണക്കുപരമായ ജോടിയുടെ സ്വഭാവവും സംരക്ഷിച്ചു. καὶ ὑμεῖς-ന്റെ സ്വാഭാവിക മലയാളരൂപത്തിനായി ‘നിങ്ങൾതന്നെയും’ ‘നിങ്ങളുംതന്നെ’ എന്നു തിരുത്തി. വാക്യത്തിന്റെ മറ്റു ഭാഗങ്ങൾ സ്രോതസ്സിന്റെ അർഥവും ഉദ്ദേശ്യപൂർവമായ അവ്യക്തതയും യഥാവത് നിലനിർത്തുന്നു.
