reference: Philippians 4:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐχ ὅτι ἐπιζητῶ τὸ δόμα, ἀλλὰ ἐπιζητῶ τὸν καρπὸν τὸν πλεονάζοντα εἰς λόγον ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/017.yaml
  text: Not that I seek the gift[a], but I seek the fruit that increases to your account.
translation:
  language: ml
  text: ഞാൻ സമ്മാനം അന്വേഷിക്കുന്നു എന്നല്ല; നിങ്ങളുടെ കണക്കിലേക്കു പെരുകിച്ചേരുന്ന ഫലമാണ് ഞാൻ അന്വേഷിക്കുന്നത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നിങ്ങളുടെ കണക്കിൽ വർധിച്ചുവരുന്ന ഫലം.”'
    reason: ‘εἰς λόγον ὑμῶν’ എന്ന പ്രയോഗം അവർക്കു ക്രെഡിറ്റാകുന്ന കണക്കെന്ന വ്യാപാരരൂപകത്തെ സൂചിപ്പിക്കുന്നു; ‘πλεονάζοντα’ വളരുകയും പെരുകുകയും ചെയ്യുന്ന ഫലത്തെ സൂചിപ്പിക്കുന്നു.
lexical_decisions:
- source_word: ἐπιζητῶ
  choice: അന്വേഷിക്കുന്നു
  rationale: സജീവമായി തേടുക/ആഗ്രഹിക്കുക എന്ന അർഥം നൽകുന്നു; ഗ്രീക്കിലെ ആവർത്തനവും വിരോധഘടനയും അതേപടി നിലനിർത്തുന്നു.
- source_word: τὸ δόμα
  choice: ദാനം
  rationale: ഫിലിപ്പിയർ നൽകിയ സഹായത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും മാന്യവുമായ പദം; ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത ‘തന്നെ’ എന്ന ഊന്നൽ ചേർത്തിട്ടില്ല.
- source_word: τὸν καρπὸν
  choice: ഫലം
  rationale: പ്രതിഫലം അല്ലെങ്കിൽ നേട്ടം എന്ന ആശയം ഉൾക്കൊള്ളുന്ന മൂലരൂപകം സംരക്ഷിക്കുന്നു; പിന്നാലെയുള്ള കണക്കെടുപ്പ് ഭാഷയുമായുള്ള രൂപകപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
- source_word: τὸν πλεονάζοντα
  choice: വർധിച്ചുവരുന്ന
  rationale: തുടർച്ചയായി പെരുകുന്നതിനെ സൂചിപ്പിക്കുന്ന വർത്തമാന കൃദന്തരൂപത്തിന്റെ ഗതി സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: εἰς λόγον ὑμῶν
  choice: നിങ്ങളുടെ കണക്കിൽ
  rationale: ഫിലിപ്പിയർ 4:15-ലെ വ്യാപാര/കണക്കെടുപ്പ് പശ്ചാത്തലത്തോട് യോജിച്ച്, അവർക്കു ക്രെഡിറ്റാകുന്ന നേട്ടം എന്ന രൂപകം സംരക്ഷിക്കുന്നു.
- source_word: οὐχ ὅτι ... ἀλλὰ
  choice: … എന്നല്ല; … ആണ്
  rationale: പൗലോസിന്റെ വിശദീകരണാത്മക വിരോധഘടന സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമായി പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: ‘ഫലം’ ആരാൽ അല്ലെങ്കിൽ എങ്ങനെ കണക്കിൽ ചേർക്കപ്പെടുന്നു എന്നത്
  choice: കർത്താവിനെയോ പ്രതിഫലത്തിന്റെ സ്വഭാവത്തെയോ വാചകത്തിൽ വ്യക്തമാക്കാതെ ഗ്രീക്കിലെ തുറന്ന നില സംരക്ഷിച്ചു.
  alternative: ‘ദൈവം നിങ്ങളുടെ കണക്കിൽ ചേർക്കുന്ന പ്രതിഫലം’ എന്ന് വിശദീകരിക്കുക.
  rationale: മൂലവാചകം ദൈവത്തെയോ പ്രതിഫലത്തിന്റെ കൃത്യസ്വഭാവത്തെയോ തുറന്നുപറയുന്നില്ല; അത്തരം വിശദീകരണം വ്യാഖ്യാനം ഇറക്കുമതി ചെയ്യും.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ദാനം–ഫലം–കണക്ക്’ എന്ന മൂലവാചകത്തിലെ രൂപകക്രമവും ‘അന്വേഷിക്കുന്നു’ എന്ന ആവർത്തനവും സംരക്ഷിച്ചു; ഗ്രീക്കിൽ ഇല്ലാത്ത ‘തന്നെ’ ചേർത്തിട്ടില്ല.
