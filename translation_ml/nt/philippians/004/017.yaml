revisions:
- from: ഞാൻ ദാനം അന്വേഷിക്കുന്നു എന്നല്ല; നിങ്ങളുടെ കണക്കിൽ വർധിച്ചുവരുന്ന ഫലമാണ് ഞാൻ അന്വേഷിക്കുന്നത്.[a]
  to: ഞാൻ സമ്മാനം അന്വേഷിക്കുന്നു എന്നല്ല; നിങ്ങളുടെ കണക്കിലേക്കു പെരുകിച്ചേരുന്ന ഫലമാണ് ഞാൻ അന്വേഷിക്കുന്നത്.[a]
  rationale: “ദാനം” എന്ന സാദ്ധ്യമായ അർഥസങ്കോചം ഒഴിവാക്കാൻ δόμαയ്ക്ക് “സമ്മാനം” ഉപയോഗിച്ചു. കൂടാതെ, ഫലം അവരുടെ കണക്കിലേക്കു പെരുകിച്ചേരുന്നു എന്ന ഗ്രീക്കിലെ വളർച്ചയുടെയും കണക്കെടുപ്പിന്റെയും രൂപകം മുഖ്യവാക്യത്തിൽ കൂടുതൽ നേരിട്ട് പ്രകടമാക്കി. ദൈവത്തെയോ പ്രതിഫലത്തിന്റെ സ്വഭാവത്തെയോ ചേർത്ത് വിശദീകരിച്ചിട്ടില്ല.
