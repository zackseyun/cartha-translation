id: PHP.4.5
reference: Philippians 4:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τὸ ἐπιεικὲς ὑμῶν γνωσθήτω πᾶσιν ἀνθρώποις. ὁ κύριος ἐγγύς·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/005.yaml
  text: Let your graciousness be known to all people[b][a]. The Lord is near.
translation:
  language: ml
  text: നിങ്ങളുടെ ദയാപൂർവമായ പരിഗണന എല്ലാവർക്കും വ്യക്തമാകട്ടെ.[a] കർത്താവ് അടുത്താണ്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സൗമ്യത,” “സഹിഷ്ണുത,” “വിട്ടുവീഴ്ച,” അല്ലെങ്കിൽ “ന്യായബോധം” എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: “കർത്താവ് അടുത്താണ്” എന്നത് കർത്താവ് സമീപത്തുതന്നെ സന്നിഹിതനാണ് എന്നോ, അവന്റെ വരവ് അടുത്തിരിക്കുന്നു എന്നോ, രണ്ടുംകൂടിയോ അർഥമാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιεικές
  choice: ദയാപൂർവമായ പരിഗണന
  rationale: ഈ പദം കേവലം സൗമ്യമായ സ്വഭാവത്തെയല്ല, മറ്റുള്ളവരോടുള്ള വിട്ടുവീഴ്ചയും സഹിഷ്ണുതയും ന്യായബോധവും നിറഞ്ഞ പരിഗണനാപൂർവമായ പെരുമാറ്റത്തെയാണ് സൂചിപ്പിക്കുന്നത്. സാധാരണ മലയാളത്തിൽ ഈ വിശാലമായ ധാർമ്മിക ഗുണം സ്വാഭാവികമായി അറിയിക്കാൻ ഈ പ്രയോഗം സഹായിക്കുന്നു.
- source_word: γνωσθήτω
  choice: വ്യക്തമാകട്ടെ
  rationale: ആ ഗുണം മറ്റുള്ളവർക്ക് അനുഭവിച്ചറിയാവുന്നതും തിരിച്ചറിയാവുന്നതും ആകണമെന്ന നിഷ്ക്രിയ ആജ്ഞയുടെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: πᾶσιν ἀνθρώποις
  choice: എല്ലാവർക്കും
  rationale: ഗ്രീക്കിലെ സർവരെയും ഉൾക്കൊള്ളുന്ന അർഥം ലിംഗഭേദമില്ലാതെ ലളിതവും ആധുനികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: κύριος
  choice: കർത്താവ്
  rationale: κύριος എന്ന ദൈവശാസ്ത്രപരമായ സ്ഥാനപ്പേരിന്റെ ഭാരവും മലയാള ബൈബിൾ ഭാഷയിലെ പരിചിതത്വവും നിലനിർത്തുന്നു.
- source_word: ἐγγύς
  choice: അടുത്താണ്
  rationale: സ്ഥലപരമായ സാന്നിധ്യത്തെയും കാലപരമായി അടുത്തിരിക്കുന്ന വരവിനെയും സൂചിപ്പിക്കാവുന്ന ഗ്രീക്കിന്റെ അർഥവ്യാപ്തി ഒരു പരിധിവരെ നിലനിർത്തുന്നു; കൂടുതൽ നിർദിഷ്ടമായ പരിഭാഷ വ്യാഖ്യാനം ചുരുക്കും.
theological_decisions:
- issue: ὁ κύριος ἐγγύς എന്നതിന്റെ അർഥം
  choice: കർത്താവ് അടുത്താണ്
  alternative: കർത്താവ് സമീപത്തുണ്ട്; കർത്താവിന്റെ വരവ് അടുത്തിരിക്കുന്നു
  rationale: ഗ്രീക്ക് പ്രയോഗം കർത്താവിന്റെ സമീപസാന്നിധ്യത്തെയോ അവന്റെ വരവ് അടുത്തിരിക്കുന്നു എന്നതിനെയോ രണ്ടിനെയുമോ സൂചിപ്പിക്കാം. മുഖ്യപാഠം ഈ ദൈവശാസ്ത്രപരമായ അർഥസാധ്യത ചുരുക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച മാന്യമായ ശൈലി. അമിതമായി പദാനുപദമാകാതെ ഗ്രീക്കിലെ ആജ്ഞയും അർഥവ്യാപ്തിയും നിലനിർത്തിയിരിക്കുന്നു.
