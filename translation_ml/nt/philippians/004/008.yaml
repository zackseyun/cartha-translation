id: PHP.4.8
reference: Philippians 4:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τὸ λοιπόν, ἀδελφοί, ὅσα ἐστὶν ἀληθῆ, ὅσα σεμνά, ὅσα δίκαια, ὅσα ἁγνά, ὅσα προσφιλῆ, ὅσα εὔφημα, εἴ τις ἀρετὴ καὶ εἴ τις ἔπαινος, ταῦτα λογίζεσθε·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/008.yaml
  text: Finally[a], brothers, whatever is true, whatever is honorable, whatever is just, whatever is pure, whatever is lovely, whatever is commendable—if there is any virtue and if there is any praise—think about these things.
translation:
  language: ml
  text: അവസാനമായി, സഹോദരന്മാരേ,[a] സത്യമായതെല്ലാം, മാന്യമായതെല്ലാം, നീതിയായതെല്ലാം, നിർമലമായതെല്ലാം, പ്രിയങ്കരമായതെല്ലാം, പ്രശംസനീയമായതെല്ലാം—എന്തെങ്കിലും സദ്ഗുണമുണ്ടെങ്കിൽ, എന്തെങ്കിലും പ്രശംസയുണ്ടെങ്കിൽ—ഇവയെക്കുറിച്ച് ചിന്തിച്ചുകൊണ്ടിരിക്കുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സഹോദരീസഹോദരങ്ങളേ”; ഗ്രീക്കിലെ “സഹോദരന്മാർ” എന്ന പദം വിശ്വാസസമൂഹം മുഴുവനെയും അഭിസംബോധന ചെയ്യാൻ ഉപയോഗിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: Τὸ λοιπόν
  choice: ഒടുവിൽ
  rationale: സമാപനഭാഗത്തിലേക്കുള്ള പരിവർത്തനവും തുടർന്നുള്ള പ്രബോധനവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἀδελφοί
  choice: സഹോദരങ്ങളേ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചന സംബോധനയുടെ രൂപം നിലനിർത്തുന്നു; വിശ്വാസസമൂഹം മുഴുവനും ഉൾപ്പെടാമെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὅσα
  choice: …മായതെല്ലാം
  rationale: ആവർത്തിക്കുന്ന നപുംസകലിംഗ ബഹുവചനബന്ധപദത്തിന്റെ വിതരണാത്മകവും പട്ടികാപരവുമായ സ്വഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: ἀληθῆ
  choice: സത്യമായ
  rationale: സത്യസന്ധതയും യാഥാർഥ്യവും ഉൾക്കൊള്ളുന്ന വിശാലമായ ധാർമിക-ചിന്താപര അർഥം നൽകുന്നു.
- source_word: σεμνά
  choice: ആദരണീയമായ
  rationale: ഗൗരവവും ബഹുമാനാർഹതയും സൂചിപ്പിക്കുന്നു; അത്യന്തം സാഹിത്യപരമാകാതെ വായനാസൗകര്യം നിലനിർത്തുന്നു.
- source_word: δίκαια
  choice: നീതിയായ
  rationale: ഈ ധാർമിക പട്ടികയിൽ നീതിക്കും നേരിനും ഒത്തതെന്ന അർഥം നൽകുന്നു; അനാവശ്യമായി സാങ്കേതിക ദൈവശാസ്ത്രപദമാക്കുന്നില്ല.
- source_word: ἁγνά
  choice: നിർമലമായ
  rationale: ധാർമികവും ആന്തരികവുമായ ശുദ്ധിയുടെ അർഥവ്യാപ്തി സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: προσφιλῆ
  choice: പ്രിയങ്കരമായ
  rationale: സ്നേഹവും അനുകൂലമായ ആകർഷണവും ഉളവാക്കുന്നതെന്ന അർഥം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: εὔφημα
  choice: പ്രശംസനീയമായ
  rationale: നല്ലതായി പറയപ്പെടുന്നതും നല്ല കീർത്തിയുള്ളതുമായ അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: εἴ τις ἀρετὴ
  choice: എന്തെങ്കിലും സദ്ഗുണമോ … ഉണ്ടെങ്കിൽ
  rationale: ἀρετήയുടെ ധാർമിക മികവ് അഥവാ സദ്ഗുണം എന്ന നാമരൂപവും ഗ്രീക്കിലെ നിബന്ധനാഭാവവും നിലനിർത്തുന്നു.
- source_word: εἴ τις ἔπαινος
  choice: എന്തെങ്കിലും പ്രശംസാർഹതയോ ഉണ്ടെങ്കിൽ
  rationale: ἔπαινος എന്ന പ്രശംസയുടെ ആശയം, ഇവിടെ ചിന്തയ്ക്ക് യോഗ്യമായ ഗുണത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള നാമരൂപത്തിൽ നൽകുന്നു.
- source_word: ταῦτα λογίζεσθε
  choice: ഇവയെക്കുറിച്ച് ചിന്തിച്ചുകൊണ്ടിരിക്കുക
  rationale: നിരന്തരവും മനഃപൂർവവുമായ ശ്രദ്ധയെയും പരിഗണനയെയും സൂചിപ്പിക്കുന്ന വർത്തമാനകാല ആജ്ഞയുടെ ഭാവം പ്രകടിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായ വായനയ്ക്ക് എളുപ്പവുമായ ശൈലി. മൂലത്തിലെ ആവർത്തനഘടനയും ധാർമിക പട്ടികയുടെ താളവും സംരക്ഷിച്ചിട്ടുണ്ട്; നിബന്ധനാപദങ്ങൾ വ്യാഖ്യാനിച്ച് ഉറപ്പാക്കിയിട്ടില്ല.
