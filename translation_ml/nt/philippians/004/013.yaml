id: PHP.4.13
reference: Philippians 4:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πάντα ἰσχύω ἐν τῷ ἐνδυναμοῦντί ⸀με.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/013.yaml
  text: I am able to do all things through the one who strengthens me[a][b].
translation:
  language: ml
  text: എന്നെ ശക്തിപ്പെടുത്തുന്നവനിലൂടെ എനിക്ക് എല്ലാറ്റിനും കഴിയും[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “എല്ലാറ്റിനും എനിക്കു കഴിവുണ്ട്” അഥവാ “എല്ലാം ചെയ്യാൻ എനിക്കു കഴിയും.” സന്ദർഭത്തിൽ, ഏതു സാഹചര്യത്തിലും നിലകൊള്ളാനുള്ള പ്രാപ്തിയാണ് പ്രത്യേകമായി ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ “എന്നെ ശക്തിപ്പെടുത്തുന്നവൻ” എന്നാണ്; ഈ വാക്യത്തിൽ ‘ക്രിസ്തു’ എന്നു വ്യക്തമായി പറയുന്നില്ലെങ്കിലും സന്ദർഭം അവനിലേക്കാണ് വിരൽചൂണ്ടുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: എല്ലാ സാഹചര്യങ്ങളെയും
  rationale: പദത്തിന് വിശാലമായി ‘എല്ലാം’ എന്നർഥമുണ്ടെങ്കിലും, തൃപ്തിയിലും അഭാവത്തിലും ജീവിക്കുന്നതിനെക്കുറിച്ചുള്ള സമീപസന്ദർഭം വിവിധ സാഹചര്യങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ തെറ്റായ പരിധിയില്ലാത്ത അവകാശവാദമായി കേൾക്കാതിരിക്കാൻ സന്ദർഭാർഥം മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കി.
- source_word: ἰσχύω
  choice: നേരിടാൻ എനിക്കു കഴിയും
  rationale: ക്രിയ ശക്തിയോ പ്രാപ്തിയോ ഉണ്ടായിരിക്കുക എന്ന ആശയം നൽകുന്നു. πάντα എന്നതോടും സമീപസന്ദർഭത്തോടും ചേർന്ന്, വിവിധ ജീവിതസാഹചര്യങ്ങളെ അഭിമുഖീകരിക്കാനുള്ള പ്രാപ്തി എന്ന അർഥം ഈ പ്രയോഗം വ്യക്തമായി നൽകുന്നു.
- source_word: ἐν
  choice: -ലൂടെ
  rationale: വ്യക്തിയെ സൂചിപ്പിക്കുന്ന കർത്തൃവാചക കൃതന്തത്തോടൊപ്പം ഇവിടെ ശക്തിയുടെ മാർഗമോ ഉറവിടമോ പ്രകടമാകുന്നു; മലയാളത്തിലെ ‘-ലൂടെ’ അത് സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: τῷ ἐνδυναμοῦντί με
  choice: എന്നെ ശക്തിപ്പെടുത്തുന്നവൻ
  rationale: നിശ്ചയാർഥക കൃതന്തത്തെ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന പ്രയോഗമായി പരിഭാഷപ്പെടുത്തി. തുടരുന്ന ശക്തീകരണത്തിന്റെ ഭാവം നിലനിർത്തുകയും ഗ്രീക്കിൽ ഈ വാക്യത്തിൽ ഇല്ലാത്ത ‘ക്രിസ്തു’ എന്ന പേര് ചേർക്കാതിരിക്കുകയും ചെയ്തു.
theological_decisions:
- issue: ‘എന്നെ ശക്തിപ്പെടുത്തുന്നവൻ’ ആരെന്ന പരോക്ഷ സൂചന
  choice: മുഖ്യവാചകത്തിൽ പേര് ചേർക്കാതെ ‘എന്നെ ശക്തിപ്പെടുത്തുന്നവൻ’ എന്നു നിലനിർത്തി.
  alternative: ‘എന്നെ ശക്തിപ്പെടുത്തുന്ന ക്രിസ്തുവിലൂടെ’
  rationale: സമീപവും വിശാലവുമായ സന്ദർഭം ക്രിസ്തുയേശുവിലേക്കാണ് വിരൽചൂണ്ടുന്നതെങ്കിലും, ഈ വാക്യത്തിന്റെ ഗ്രീക്ക് പാഠം ആ പേര് വ്യക്തമായി പറയുന്നില്ല. അതിനാൽ പരാമർശത്തിന്റെ പരോക്ഷത സംരക്ഷിച്ചു.
- issue: πάντα എന്നതിന്റെ വ്യാപ്തി
  choice: സന്ദർഭാനുസൃതമായി ‘എല്ലാ സാഹചര്യങ്ങളെയും നേരിടാൻ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘എല്ലാം ചെയ്യാൻ’
  rationale: മുൻവാക്യങ്ങളിലെ സമൃദ്ധി, വിശപ്പ്, സമൃദ്ധാവസ്ഥ, അഭാവം എന്നിവയാണ് പ്രാപ്തിയുടെ പരിധി നിർണ്ണയിക്കുന്നത്. അതിരില്ലാത്ത എല്ലാ പ്രവൃത്തികളും ചെയ്യാമെന്ന അവകാശവാദം പാഠം ഉന്നയിക്കുന്നില്ല; അതേസമയം ‘എല്ലാം’ എന്ന വിശാലമായ മൂലപദം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. പരമ്പരാഗതമായി പരിധിയില്ലാത്ത നേട്ടവാഗ്ദാനമായി തെറ്റിദ്ധരിക്കപ്പെടാവുന്ന ‘എല്ലാം ചെയ്യാൻ കഴിയും’ എന്ന പ്രയോഗത്തിന് പകരം സന്ദർഭം വ്യക്തമാക്കുന്ന സ്വാഭാവിക രൂപം സ്വീകരിച്ചു; മൂലപാഠത്തിന്റെ വിശാലത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
