  text: ἡ χάρις τοῦ κυρίου Ἰησοῦ Χριστοῦ μετὰ ⸂τοῦ πνεύματος⸃ ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/023.yaml
  text: The grace of the Lord Jesus Christ be with your spirit[a].
translation:
  language: ml
  text: കർത്താവായ യേശുക്രിസ്തുവിന്റെ കൃപ നിങ്ങളുടെ ആത്മാവോടുകൂടെ ഇരിക്കട്ടെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ചില കൈയെഴുത്തുപ്രതികൾ: “നിങ്ങൾ എല്ലാവരോടുംകൂടെ.” മറ്റുചില പ്രതികളിൽ അവസാനം “ആമേൻ” എന്നും ചേർത്തിട്ടുണ്ട്.'
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: കൃപ
  rationale: പൗലോസിന്റെ ആശീർവാദവാക്യങ്ങളിൽ പതിവായ ദൈവശാസ്ത്രപരമായ അർഥഭാരം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: κυρίου
  choice: കർത്താവായ
  rationale: κύριος ഇവിടെ യേശുവിന്റെ സ്ഥാനപ്പേരാണ്; പേരുകളോടൊപ്പം മലയാളത്തിൽ സ്വാഭാവികമായി ചേരാൻ ‘കർത്താവായ’ എന്നു നൽകി.
- source_word: Ἰησοῦ Χριστοῦ
  choice: യേശുക്രിസ്തുവിന്റെ
  rationale: Χριστός-ന്റെ സ്ഥാനപ്പേരായ അർഥം അംഗീകരിച്ചുകൊണ്ട്, ആധുനിക മലയാളത്തിലെ സുസ്ഥിരവും വായനക്കാർക്ക് പരിചിതവുമായ സംയുക്തരൂപം ഉപയോഗിച്ചു; ‘മശീഹയായ യേശു’ എന്നതും അർഥസാധ്യമാണ്, എന്നാൽ ഈ സ്ഥിരമായ ആശീർവാദസൂത്രത്തിൽ അത് കുറച്ച് അസ്വാഭാവികമാണ്.
- source_word: μετὰ
  choice: ഓടുകൂടെ
  rationale: ജനിറ്റീവിനോടൊപ്പമുള്ള μετά ഇവിടെ സാന്നിധ്യവും സഹവാസവും സൂചിപ്പിക്കുന്നു.
- source_word: πνεύματος
  choice: ആത്മാവ്
  rationale: സന്ദർഭത്തിൽ പരിശുദ്ധാത്മാവിനെക്കാൾ വിശ്വാസികളുടെ ആന്തരികജീവിതത്തെയോ സമൂഹത്തെ ഏകവചനത്തിൽ കാണുന്നതെയോ സൂചിപ്പിക്കുന്നു.
- source_word: ὑμῶν
  choice: നിങ്ങളുടെ
  rationale: ഗ്രീക്കിലെ രണ്ടാംപുരുഷ ബഹുവചന ഉടമസ്ഥരൂപം മലയാളത്തിൽ വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: Χριστοῦ എന്നത് ‘മശീഹ’ എന്നോ ‘ക്രിസ്തു’ എന്നോ പരിഭാഷപ്പെടുത്തണമോ
  choice: ക്രിസ്തു
  alternative: മശീഹ
  rationale: Χριστός അടിസ്ഥാനത്തിൽ സ്ഥാനപ്പേരാണെങ്കിലും, ‘കർത്താവായ യേശുക്രിസ്തു’ എന്ന പൗലോസിന്റെ സ്ഥിരസൂത്രത്തിൽ അത് പേരിനോടു ചേർന്ന രൂപത്തിലാണ് പ്രവർത്തിക്കുന്നത്. ‘ക്രിസ്തു’ എന്നത് അർഥം മറയ്ക്കാതെ ആധുനിക മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികവും സഭാഭേദാതീതവുമാണ്.
- issue: πνεύματος പരിശുദ്ധാത്മാവിനെയാണോ മനുഷ്യാത്മാവിനെയാണോ സൂചിപ്പിക്കുന്നത്
  choice: മനുഷ്യരുടെ ആത്മാവ്; ചെറിയക്ഷര ആശയം
  alternative: പരിശുദ്ധാത്മാവ്
  rationale: ὑμῶν എന്ന ഉടമസ്ഥരൂപവും ആശീർവാദസൂത്രവും ഫിലിപ്പിയരുടെ ആന്തരികജീവിതത്തെയോ അവരുടെ സമൂഹാത്മാവിനെയോ സൂചിപ്പിക്കുന്നതായി വായിക്കാൻ കൂടുതൽ അനുകൂലമാണ്; ദൈവാത്മാവിനെ നിർബന്ധിച്ച് വായിക്കുന്നില്ല.
- issue: ഏകവചനമായ ‘ആത്മാവ്’ വ്യക്തിപരമാണോ സമൂഹപരമാണോ
  choice: ഗ്രീക്കിലെ ഏകവചനം അതേപടി നിലനിർത്തി
  alternative: നിങ്ങളുടെ ആത്മാക്കളോടുകൂടെ
  rationale: മൂലപാഠത്തിലെ ഏകവചനം കൂട്ടായ അർഥമോ പങ്കിട്ട ആന്തരികജീവിതമോ വഹിക്കാം; ബഹുവചനമാക്കി ആ അർഥസാധ്യത ഇല്ലാതാക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആശീർവാദശൈലി. ‘ഇരിക്കട്ടെ’ മൂലപാഠത്തിൽ പ്രസ്താവിക്കാതെ വിട്ടിരിക്കുന്ന ആശംസാക്രിയയെ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
