id: PHP.4.22
reference: Philippians 4:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀσπάζονται ὑμᾶς πάντες οἱ ἅγιοι, μάλιστα δὲ οἱ ἐκ τῆς Καίσαρος οἰκίας.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/022.yaml
  text: All the saints greet you[a], especially those of Caesar’s household.
translation:
  language: ml
  text: എല്ലാ വിശുദ്ധരും നിങ്ങളെ അഭിവാദ്യം ചെയ്യുന്നു; പ്രത്യേകിച്ച് കൈസറുടെ ഭവനവുമായി ബന്ധപ്പെട്ടവർ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കൈസറുടെ ഭവനത്തിൽനിന്നുള്ളവർ.” ഈ പ്രയോഗം സാമ്രാജ്യത്വ ഭവനവുമായി ബന്ധപ്പെട്ടവരെയാണ് സൂചിപ്പിക്കുന്നത്; അവർ കൈസറുടെ കുടുംബാംഗങ്ങൾ തന്നെയായിരിക്കണമെന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζονται
  choice: അഭിവാദ്യം ചെയ്യുന്നു
  rationale: ലേഖനങ്ങളിലെ ആശംസ അറിയിക്കുന്നതിനുള്ള പതിവുപദമാണ്; നേരിട്ടുള്ള വ്യക്തിബന്ധത്തിന്റെ ഭാവം അനാവശ്യമായി വികസിപ്പിക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: πάντες οἱ ἅγιοι
  choice: സകല വിശുദ്ധരും
  rationale: പൗലൊസിന്റെ ലേഖനങ്ങളിൽ വിശ്വാസികളെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ പ്രയോഗമാണ്. ‘വിശുദ്ധർ’ എന്നത് മൂലപദത്തിന്റെ പദസംബന്ധവും ദൈവശാസ്ത്രപരമായ അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു.
- source_word: μάλιστα δὲ
  choice: വിശേഷിച്ച്
  rationale: മുഴുവൻ കൂട്ടത്തിനുള്ളിലെ ഒരു വിഭാഗത്തിന് പ്രത്യേക ഊന്നൽ നൽകുന്നു; δέ എന്ന ബന്ധകത്തിന്റെ ആശയം മലയാളവാക്യത്തിലെ വിരാമചിഹ്നവും പ്രയോഗവും സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: οἱ ἐκ τῆς Καίσαρος οἰκίας
  choice: കൈസറുടെ ഭവനത്തിൽപ്പെട്ടവർ
  rationale: രാജകീയ ഭവനവുമായി ബന്ധമുള്ളവരെയോ അതിൽ ഉൾപ്പെട്ടവരെയോ സൂചിപ്പിക്കുന്നു; രക്തബന്ധമുള്ള കുടുംബാംഗങ്ങൾ മാത്രമാണെന്ന ധാരണ വരുത്താതെ ഗ്രീക്കിലെ ബന്ധസൂചന നിലനിർത്തുന്നു.
- source_word: Καίσαρος
  choice: കൈസറുടെ
  rationale: ഗ്രീക്കിലെ ചരിത്രപരമായ നാമം/സാമ്രാജ്യത്വപദവി നിലനിർത്തുന്നു; ‘ചക്രവർത്തിയുടെ’ എന്ന വ്യാഖ്യാനപരമായ പകരം ഉപയോഗിക്കുന്നില്ല.
theological_decisions:
- issue: പൗലൊസിന്റെ പ്രയോഗത്തിൽ ‘വിശുദ്ധർ’ എന്നതിന്റെ അർഥം
  choice: വിശ്വാസസമൂഹത്തെ സൂചിപ്പിക്കുന്ന പദമായി ‘വിശുദ്ധർ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ദൈവജനം’ അല്ലെങ്കിൽ ‘വിശ്വാസികൾ’
  rationale: ഇവിടെ ഈ പദം അസാധാരണമായ വിശുദ്ധി നേടിയ പ്രത്യേക വിഭാഗത്തെ മാത്രം സൂചിപ്പിക്കുന്നില്ല. അതേസമയം, അർഥം പരാവർത്തനം ചെയ്ത് തീർപ്പാക്കാതെ പൗലൊസിന്റെ പദപ്രയോഗവും അതിലെ ദൈവശാസ്ത്രപരമായ അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ലേഖനശൈലി സ്വീകരിച്ചു. ‘ഭവനം’ എന്നത് ഇവിടെ ഒരു വീടിനെയോ രക്തബന്ധമുള്ള കുടുംബത്തെയോ മാത്രം അല്ല, കൈസറുമായി ബന്ധപ്പെട്ട വിപുലമായ സാമ്രാജ്യത്വ ഗൃഹസംവിധാനത്തെയും ഉൾക്കൊള്ളാൻ കഴിയുന്ന വിധത്തിലാണ് ഉപയോഗിച്ചത്.
