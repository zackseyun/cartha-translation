  to: എല്ലാ വിശുദ്ധരും നിങ്ങളെ അഭിവാദ്യം ചെയ്യുന്നു; പ്രത്യേകിച്ച് കൈസറുടെ ഭവനവുമായി ബന്ധപ്പെട്ടവർ[a].
