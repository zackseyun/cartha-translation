  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി ഉപയോഗിച്ചു. മൂലത്തിലെ പുഷ്പിക്കൽരൂപകം മുഖ്യവാചകത്തിൽ അർത്ഥപരമായി അവതരിപ്പിച്ച് അടിക്കുറിപ്പിൽ തുറന്നുകാട്ടി; പൗലോസ് ഫിലിപ്പിയരെ കുറ്റപ്പെടുത്തുന്നില്ലെന്ന തുടർവാക്യത്തിന്റെ ഭാവവും നിലനിർത്തി.
