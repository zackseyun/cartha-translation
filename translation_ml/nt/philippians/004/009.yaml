revisions:
- from: നിങ്ങൾ എന്നിൽനിന്ന് പഠിച്ചതും സ്വീകരിച്ചതും കേട്ടതും എന്നിൽ കണ്ടതുമായ കാര്യങ്ങൾ പ്രാവർത്തികമാക്കിക്കൊണ്ടിരിക്കുക[a][b]. അപ്പോൾ സമാധാനത്തിന്റെ ദൈവം നിങ്ങളോടുകൂടെ ഉണ്ടായിരിക്കും.
  to: നിങ്ങൾ പഠിച്ചതും സ്വീകരിച്ചതും കേട്ടതും എന്നിൽ കണ്ടതുമായവ[b] പ്രാവർത്തികമാക്കുക[a]. സമാധാനത്തിന്റെ ദൈവം നിങ്ങളോടുകൂടെ ഉണ്ടായിരിക്കും.
