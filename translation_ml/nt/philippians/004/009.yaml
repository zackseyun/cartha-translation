id: PHP.4.9
reference: Philippians 4:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἃ καὶ ἐμάθετε καὶ παρελάβετε καὶ ἠκούσατε καὶ εἴδετε ἐν ἐμοί, ταῦτα πράσσετε· καὶ ὁ θεὸς τῆς εἰρήνης ἔσται μεθ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/009.yaml
  text: What you also learned and received and heard and saw in me—practice these things[b][a], and the God of peace will be with you.
translation:
  language: ml
  text: നിങ്ങൾ പഠിച്ചതും സ്വീകരിച്ചതും കേട്ടതും എന്നിൽ കണ്ടതുമായവ[b] പ്രാവർത്തികമാക്കുക[a]. സമാധാനത്തിന്റെ ദൈവം നിങ്ങളോടുകൂടെ ഉണ്ടായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഈ കാര്യങ്ങൾ ചെയ്യുക.”'
    reason: lexical_alternative
  - marker: b
    text: “എന്നിൽ കണ്ടത്” എന്നത് “എന്റെ മാതൃകയിൽ കണ്ടത്” എന്നോ “എന്റെ ജീവിതത്തിൽ കണ്ടത്” എന്നോ വ്യക്തമാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ
  choice: കാര്യങ്ങൾ
  rationale: നപുംസകലിംഗ ബഹുവചന ബന്ധസർവനാമത്തിന്റെ ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; തുടർന്ന് വരുന്ന ‘-തും’ ഘടനകൾ അതിന്റെ ഉള്ളടക്കം നിർവചിക്കുന്നു.
- source_word: ἐμάθετε
  choice: പഠിച്ചതും
  rationale: ഫിലിപ്പിയർ പൗലോസിൽനിന്ന് അഭ്യസിച്ച കാര്യങ്ങളെ സൂചിപ്പിക്കുന്ന ലളിതവും സ്വാഭാവികവുമായ ഭൂതകാല പ്രയോഗം.
- source_word: παρελάβετε
  choice: സ്വീകരിച്ചതും
  rationale: ഉപദേശമോ കൈമാറിക്കിട്ടിയ പാരമ്പര്യമോ സ്വീകരിക്കുക എന്ന പൗലോസിന്റെ വിശാല പ്രയോഗസാധ്യത നിലനിർത്തുന്നു.
- source_word: ἠκούσατε
  choice: കേട്ടതും
  rationale: മൂലത്തിലെ സമാന്തര ക്രിയാശൃംഖല ചുരുക്കമായും നേരിട്ടും നിലനിർത്തുന്നു.
- source_word: εἴδετε ἐν ἐμοί
  choice: എന്നിൽ കണ്ടതുമായ
  rationale: പൗലോസിൽത്തന്നെ നിരീക്ഷിച്ച കാര്യങ്ങൾ എന്ന മൂലപ്രയോഗത്തിന്റെ തുറന്ന അർത്ഥം സംരക്ഷിക്കുന്നു; ‘എന്റെ മാതൃകയിൽ’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: ταῦτα πράσσετε
  choice: കാര്യങ്ങൾ പ്രാവർത്തികമാക്കിക്കൊണ്ടിരിക്കുക
  rationale: വെറും ഒറ്റത്തവണ ചെയ്യുക എന്നതിലുപരി പതിവായി ജീവിതത്തിൽ നടപ്പാക്കുക എന്ന വർത്തമാനകാല ആജ്ഞയുടെ തുടർച്ചാഭാവം നൽകുന്നു.
- source_word: ὁ θεὸς τῆς εἰρήνης
  choice: സമാധാനത്തിന്റെ ദൈവം
  rationale: പൗലോസിന്റെ സവിശേഷമായ ജനിറ്റീവ് പ്രയോഗം വ്യാഖ്യാനിച്ച് പരിമിതപ്പെടുത്താതെ നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: ἔσται μεθ’ ὑμῶν
  choice: നിങ്ങളോടുകൂടെ ഉണ്ടായിരിക്കും
  rationale: ദൈവസാന്നിധ്യത്തെക്കുറിച്ചുള്ള ഭാവികാല ഉറപ്പ് നേരിട്ട് നൽകുന്നു.
theological_decisions:
- issue: അനുസരണവും ദൈവസാന്നിധ്യവും തമ്മിലുള്ള ബന്ധം
  choice: ആഹ്വാനത്തിനു പിന്നാലെയുള്ള ഉറപ്പായി വിവർത്തനം ചെയ്തു; മലയാളത്തിലെ ബന്ധം സ്വാഭാവികമാക്കാൻ ‘അപ്പോൾ’ ഉപയോഗിച്ചു.
  alternative: യാന്ത്രികമായ കാരണഫല നിബന്ധനയായി ‘ഇവ ചെയ്താൽ മാത്രമേ’ എന്നോ അതിനു തുല്യമായോ വിവർത്തനം ചെയ്യുക.
  rationale: ഗ്രീക്കിൽ രണ്ടാമത്തെ വാക്യം καί കൊണ്ടാണ് ബന്ധിപ്പിച്ചിരിക്കുന്നത്; വ്യക്തമായ നിബന്ധനാസൂത്രണമില്ല. അതിനാൽ ആഹ്വാനവും വാഗ്ദാനവും തമ്മിലുള്ള ശക്തമായ ബന്ധം സൂചിപ്പിക്കുമ്പോഴും മൂലത്തിൽ ഇല്ലാത്ത ‘മാത്രമേ’ എന്ന നിബന്ധന ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ക്രിയകളുടെ സമാന്തരത നിലനിർത്തി; πράσσετε എന്നതിന്റെ പതിവായ പ്രവൃത്തിഭാവം ‘പ്രാവർത്തികമാക്കിക്കൊണ്ടിരിക്കുക’ വഴി അറിയിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി.
