id: PHP.4.20
reference: Philippians 4:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τῷ δὲ θεῷ καὶ πατρὶ ἡμῶν ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/020.yaml
  text: To our God and Father be the glory forever and ever[a]. Amen.
translation:
  language: ml
  text: നമ്മുടെ ദൈവവും പിതാവുമായവന് എന്നെന്നേക്കും മഹത്ത്വം ഉണ്ടാകട്ടെ.[a] ആമേൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “യുഗങ്ങളുടെ യുഗങ്ങളോളം.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയില്ല
  rationale: ഇവിടെ δὲ നേരിയ ബന്ധകമായി സമാപന സ്തുതിവാക്യത്തിലേക്കുള്ള നീക്കം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ പ്രത്യേകമായി ‘എന്നാൽ’ അല്ലെങ്കിൽ ‘ഇപ്പോൾ’ ചേർത്താൽ അനാവശ്യമായ വിരോധമോ കാലസൂചനയോ ഉണ്ടാകും; വാക്യക്രമം തന്നെ ബന്ധം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: θεῷ καὶ πατρὶ ἡμῶν
  choice: നമ്മുടെ ദൈവവും പിതാവുമായവന്
  rationale: θεῷ, πατρὶ എന്നീ രണ്ടു നാമങ്ങളും ഒരേ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ഏകീകൃത പ്രയോഗമായി നിലനിർത്തുകയും ἡμῶν രണ്ടിനും ബാധകമാണെന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ἡ δόξα
  choice: മഹത്ത്വം ഉണ്ടാകട്ടെ
  rationale: ക്രിയയില്ലാത്ത ഗ്രീക്ക് സ്തുതിവാക്യത്തിന് മലയാളത്തിൽ ആശംസാത്മകവും ആരാധനാപരവുമായ സ്വഭാവം നിലനിർത്താൻ ‘ഉണ്ടാകട്ടെ’ ചേർത്തു.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: എന്നെന്നേക്കും
  rationale: അവസാനമില്ലാത്ത കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന് സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാള തത്തുല്യം.
- source_word: ἀμήν
  choice: ആമേൻ
  rationale: ക്രൈസ്തവ ആരാധനാപ്രയോഗത്തിൽ സ്ഥിരപ്പെട്ട സമ്മതപ്രഖ്യാപനമായതിനാൽ ലിപ്യന്തരണം നിലനിർത്തി.
theological_decisions:
- issue: ക്രിയയില്ലാത്ത സ്തുതിവാക്യത്തിൽ സൂചിതമായ ക്രിയ പൂരിപ്പിക്കൽ
  choice: മഹത്ത്വം ഉണ്ടാകട്ടെ
  alternative: മഹത്ത്വം ഉണ്ട് / മഹത്ത്വം അവനുള്ളതാണ്
  rationale: ഗ്രീക്കിൽ ക്രിയ വ്യക്തമാക്കിയിട്ടില്ല; അതിനാൽ പ്രഖ്യാപനാത്മകമായ ‘ഉണ്ട്’ എന്നും ആശംസാത്മകമായ ‘ഉണ്ടാകട്ടെ’ എന്നും മനസ്സിലാക്കാം. സന്ദർഭത്തിലെ സ്തുതിവാക്യസ്വഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകാൻ ‘ഉണ്ടാകട്ടെ’ തിരഞ്ഞെടുത്തു; എന്നാൽ ഗ്രീക്കിന്റെ ക്രിയാരഹിതത്വം മൂലമുള്ള വ്യത്യസ്ത വായനകൾ അംഗീകരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ആരാധനാസന്ദർഭത്തിന് യോജിച്ച ഗൗരവമുള്ളതുമായ ശൈലി. പരമ്പരാഗതമായി പരിചിതമായ ‘മഹത്ത്വം’, ‘ആമേൻ’ എന്നീ പദങ്ങൾ നിലനിർത്തി; അനാവശ്യമായ സഭാവിഭാഗ-സവിശേഷ ഭാഷ ഒഴിവാക്കി.
