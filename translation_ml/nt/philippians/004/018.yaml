revisions:
- from: എന്നാൽ എല്ലാം എനിക്കു ലഭിച്ചിരിക്കുന്നു[a]; എനിക്കു സമൃദ്ധിയുമുണ്ട്. നിങ്ങളിൽനിന്നുള്ളത് എപ്പഫ്രൊദിത്തോസിൽനിന്ന് സ്വീകരിച്ചതിനാൽ എനിക്ക് ഒന്നിനും കുറവില്ല—അത് സൗരഭ്യവാസനയും സ്വീകാര്യമായ യാഗവും ദൈവത്തിനു പ്രസാദകരമായതുമാകുന്നു.
  to: എന്നാൽ, എനിക്ക് എല്ലാം ലഭിച്ചിരിക്കുന്നു[a]; എനിക്ക് സമൃദ്ധിയുണ്ട്. എപ്പഫ്രൊദിത്തോസിൽനിന്ന് നിങ്ങളിൽനിന്നു വന്നത് സ്വീകരിച്ചതിനാൽ ഞാൻ പൂർണമായി പര്യാപ്തനായിരിക്കുന്നു—സൗരഭ്യമുള്ള വാസന, സ്വീകാര്യമായ യാഗം, ദൈവത്തിന് പ്രസാദകരമായത്.
