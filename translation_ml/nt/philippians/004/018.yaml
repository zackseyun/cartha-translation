id: PHP.4.18
reference: Philippians 4:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπέχω δὲ πάντα καὶ περισσεύω· πεπλήρωμαι δεξάμενος παρὰ Ἐπαφροδίτου τὰ παρ’ ὑμῶν, ὀσμὴν εὐωδίας, θυσίαν δεκτήν, εὐάρεστον τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/018.yaml
  text: But I have received everything[a], and I abound. I am fully supplied, having received from Epaphroditus what came from you—a fragrant aroma, an acceptable sacrifice, pleasing to God.
translation:
  language: ml
  text: എന്നാൽ, എനിക്ക് എല്ലാം ലഭിച്ചിരിക്കുന്നു[a]; എനിക്ക് സമൃദ്ധിയുണ്ട്. എപ്പഫ്രൊദിത്തോസിൽനിന്ന് നിങ്ങളിൽനിന്നു വന്നത് സ്വീകരിച്ചതിനാൽ ഞാൻ പൂർണമായി പര്യാപ്തനായിരിക്കുന്നു—സൗരഭ്യമുള്ള വാസന, സ്വീകാര്യമായ യാഗം, ദൈവത്തിന് പ്രസാദകരമായത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എനിക്ക് എല്ലാം പൂർണമായി ലഭിച്ചിട്ടുണ്ട്” എന്നും “മുഴുവൻ തുകയും എനിക്ക് ലഭിച്ചിട്ടുണ്ട്” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: ἀπέχω എന്ന ക്രിയയ്ക്ക് ഈ സന്ദർഭത്തിൽ ലഭിച്ചതിന്റെ പൂർണതയെയോ പൂർണമായ കണക്കുതീർപ്പിനോടു സാമ്യമുള്ള വാണിജ്യനിറത്തെയോ സൂചിപ്പിക്കാനാകും.
lexical_decisions:
- source_word: ἀπέχω
  choice: എല്ലാം എനിക്കു ലഭിച്ചിരിക്കുന്നു
  rationale: സഹായം ലഭിച്ചതിന്റെ രസീത്-സ്വഭാവമുള്ള പൂർണത ഈ ക്രിയയ്ക്ക് സൂചിപ്പിക്കാനാകുമെങ്കിലും, മുഖ്യപാഠത്തിൽ വാണിജ്യഭാവം അമിതമായി നിർണ്ണയിക്കാതെ സ്വാഭാവികമായി വിവർത്തനം ചെയ്തു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: πάντα
  choice: എല്ലാം
  rationale: ഫിലിപ്പിയർ അയച്ച സഹായത്തിന്റെ സമഗ്രത വ്യക്തമാക്കുന്ന സ്വാഭാവികവും സംക്ഷിപ്തവുമായ പ്രയോഗം.
- source_word: περισσεύω
  choice: എനിക്കു സമൃദ്ധിയുമുണ്ട്
  rationale: ആവശ്യത്തിനപ്പുറമുള്ള സമൃദ്ധിയെ സൂചിപ്പിക്കുകയും തുടർന്നുള്ള പൂർണതാഭാഷയുമായി ചേർന്നുനിൽക്കുകയും ചെയ്യുന്നു.
- source_word: πεπλήρωμαι
  choice: എനിക്ക് ഒന്നിനും കുറവില്ല
  rationale: ലഭിച്ച സഹായത്തിന്റെ ഫലമായി ഇപ്പോൾ പൂർണമായി പര്യാപ്തനായിരിക്കുന്ന അവസ്ഥയെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: δεξάμενος
  choice: സ്വീകരിച്ചതിനാൽ
  rationale: എപ്പഫ്രൊദിത്തോസിൽനിന്ന് ലഭിച്ചതാണ് പൗലോസിന്റെ പര്യാപ്താവസ്ഥയ്ക്ക് കാരണമെന്ന സന്ദർഭബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: παρὰ Ἐπαφροδίτου
  choice: എപ്പഫ്രൊദിത്തോസിൽനിന്ന്
  rationale: സമ്മാനം കൈമാറിയ തൽക്ഷണ മനുഷ്യസ്രോതസ്സായി എപ്പഫ്രൊദിത്തോസിനെ നേരിട്ട് അടയാളപ്പെടുത്തുന്നു.
- source_word: τὰ παρ’ ὑμῶν
  choice: നിങ്ങളിൽനിന്നുള്ളത്
  rationale: സഹായത്തിന്റെ യഥാർഥ ദാതാക്കൾ ഫിലിപ്പിയരാണെന്നത് നിലനിർത്തുന്ന സംക്ഷിപ്ത പ്രയോഗം.
- source_word: ὀσμὴν εὐωδίας
  choice: സൗരഭ്യവാസന
  rationale: യാഗാരാധനയെ ഓർമിപ്പിക്കുന്ന പഴയനിയമ പ്രതിധ്വനി നഷ്ടപ്പെടുത്താതെ വ്യക്തവും ഗൗരവമുള്ളതുമായ ഭാഷ നൽകുന്നു.
- source_word: θυσίαν δεκτήν
  choice: സ്വീകാര്യമായ യാഗം
  rationale: ഫിലിപ്പിയരുടെ ദാനത്തെ യാഗാർപ്പണത്തിന്റെ രൂപകത്തിൽ അവതരിപ്പിക്കുന്ന പൗലോസിന്റെ ഭാഷ അതേപടി നിലനിർത്തുന്നു.
- source_word: εὐάρεστον τῷ θεῷ
  choice: ദൈവത്തിനു പ്രസാദകരമായത്
  rationale: ദൈവത്തിന്റെ അനുകൂലസ്വീകാര്യത വ്യക്തവും മതവിഭാഗനിരപേക്ഷവുമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഫിലിപ്പിയരുടെ സാമ്പത്തികസഹായത്തിനുള്ള യാഗരൂപകം
  choice: “സൗരഭ്യവാസനയും സ്വീകാര്യമായ യാഗവും ദൈവത്തിനു പ്രസാദകരമായതും” എന്ന ആരാധനാ-യാഗ ഭാഷ നിലനിർത്തി.
  alternative: പൊതുവായ നന്ദിപ്രസ്താവനയായി രൂപകം മൃദൂകരിക്കുക, അല്ലെങ്കിൽ “ദൈവം സന്തോഷത്തോടെ സ്വീകരിക്കുന്ന വഴിപാട്” എന്നു കൂടുതൽ ചലനാത്മകമായി നൽകുക.
  rationale: സൗരഭ്യം, യാഗം, ദൈവപ്രസാദം എന്നീ ഘടകങ്ങളുടെ ക്രമം പൗലോസ് ഉദ്ദേശപൂർവം ഉപയോഗിക്കുന്നു. അധിക സിദ്ധാന്തനിഗമനങ്ങൾ ചേർക്കാതെ അതിന്റെ ദൈവശാസ്ത്രപരമായ ശക്തി സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. പൗലോസിന്റെ പൂർണതയും സമൃദ്ധിയും സൂചിപ്പിക്കുന്ന ആവർത്തനം നിലനിർത്തി; യാഗാരാധനയുടെ രൂപകഭാഷ മൃദൂകരിച്ചില്ല. “എപ്പഫ്രൊദിത്തോസ്” എന്ന രൂപം ഗ്രീക്ക് Ἐπαφρόδιτος എന്ന പേരിനോടടുത്ത ലിപ്യന്തരണമാണ്.
