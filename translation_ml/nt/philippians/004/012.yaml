source:
  edition: SBLGNT
  text: οἶδα καὶ ταπεινοῦσθαι, οἶδα καὶ περισσεύειν· ἐν παντὶ καὶ ἐν πᾶσιν μεμύημαι, καὶ χορτάζεσθαι καὶ πεινᾶν, καὶ περισσεύειν καὶ ὑστερεῖσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/012.yaml
  text: 'I know how to be brought low, and I know how to abound. In every circumstance and in all things I have learned the secret: both to be well fed and to be hungry, both to abound and to be in need.'
translation:
  language: ml
  text: 'താഴ്ന്ന നിലയിൽ കഴിയാൻ എനിക്കറിയാം; സമൃദ്ധിയിൽ കഴിയാനും എനിക്കറിയാം. ഓരോ സാഹചര്യത്തിലും എല്ലാ കാര്യങ്ങളിലും രഹസ്യം ഞാൻ പഠിച്ചിരിക്കുന്നു[a]: വയറുനിറഞ്ഞിരിക്കാനും വിശന്നിരിക്കാനും, സമൃദ്ധിയിൽ കഴിയാനും കുറവ് അനുഭവിക്കാനും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, “എനിക്ക് ദീക്ഷ ലഭിച്ചിരിക്കുന്നു.” ഒരു രഹസ്യം പഠിച്ചതിനെ സൂചിപ്പിക്കാൻ പൗലോസ് ദീക്ഷയുടെ ഭാഷ രൂപകമായി ഉപയോഗിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: എനിക്കറിയാം
  rationale: തുടർന്നുവരുന്ന ക്രിയകളോടൊപ്പം ഇത് അനുഭവത്തിലൂടെ നേടിയ പ്രായോഗിക അറിവിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘കഴിയാൻ എനിക്കറിയാം’ എന്ന പ്രയോഗം ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ταπεινοῦσθαι
  choice: താഴ്ന്ന നിലയിൽ കഴിയാൻ
  rationale: സാഹചര്യങ്ങളാൽ താഴ്ത്തപ്പെടുകയോ എളിയ നിലയിലാകുകയോ ചെയ്യുന്ന അർഥം നിലനിർത്തുന്നു; മനോഭാവമായ വിനയത്തിലേക്ക് മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: περισσεύειν
  choice: സമൃദ്ധിയിൽ കഴിയാൻ
  rationale: ആവശ്യത്തിലധികം ഉണ്ടായിരിക്കുന്നതിന്റെ വിശാലമായ അർഥം നൽകുകയും വെറും സാമ്പത്തിക അഭിവൃദ്ധിയായി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐν παντὶ καὶ ἐν πᾶσιν
  choice: ഓരോ സാഹചര്യത്തിലും എല്ലാ കാര്യങ്ങളിലും
  rationale: ഗ്രീക്കിലെ രണ്ട് സമാന്തര സമഗ്രപ്രയോഗങ്ങളെയും വേർതിരിച്ചു നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ മലയാളം നൽകുന്നു.
- source_word: μεμύημαι
  choice: രഹസ്യം ഞാൻ പഠിച്ചിരിക്കുന്നു
  rationale: ദീക്ഷ സ്വീകരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന മൂലരൂപകം സന്ദർഭത്തിൽ ജീവിതത്തിന്റെ രഹസ്യം അനുഭവത്തിലൂടെ പഠിച്ചതിനെ കുറിക്കുന്നു; വ്യക്തതയ്ക്കായി ആശയം മുഖ്യവാചകത്തിലും രൂപകം അടിക്കുറിപ്പിലും നൽകുന്നു.
- source_word: χορτάζεσθαι
  choice: വയറുനിറഞ്ഞിരിക്കാനും
  rationale: വിശന്നിരിക്കുന്നതിനോടുള്ള ഭക്ഷണസംബന്ധമായ വ്യക്തമായ വൈരുധ്യം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: πεινᾶν
  choice: വിശന്നിരിക്കാനും
  rationale: χορτάζεσθαι എന്നതോടുള്ള ലളിതവും നേരിട്ടുമുള്ള വൈരുധ്യം സംരക്ഷിക്കുന്നു.
- source_word: ὑστερεῖσθαι
  choice: കുറവ് അനുഭവിക്കാനും
  rationale: പണമില്ലായ്മയിൽ മാത്രം ഒതുക്കാതെ പലവിധ അഭാവങ്ങളെയും ഉൾക്കൊള്ളുന്ന വിശാലമായ അർഥം നിലനിർത്തുന്നു.
