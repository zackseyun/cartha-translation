  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. വിരുദ്ധാവസ്ഥകളുടെ സമാന്തരഘടനയും ഗ്രീക്കിലെ ആശയവ്യാപ്തിയും നിലനിർത്തി; മതവിഭാഗപരമായ പ്രത്യേക വ്യാഖ്യാനങ്ങൾ ചേർത്തിട്ടില്ല.
