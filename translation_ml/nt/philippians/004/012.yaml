  to: 'താഴ്ന്ന നിലയിൽ കഴിയാൻ എനിക്കറിയാം; സമൃദ്ധിയിൽ കഴിയാനും എനിക്കറിയാം. ഓരോ സാഹചര്യത്തിലും എല്ലാ കാര്യങ്ങളിലും രഹസ്യം ഞാൻ പഠിച്ചിരിക്കുന്നു[a]: വയറുനിറഞ്ഞിരിക്കാനും വിശന്നിരിക്കാനും, സമൃദ്ധിയിൽ കഴിയാനും കുറവ് അനുഭവിക്കാനും.'
