id: PHP.4.1
reference: Philippians 4:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὥστε, ἀδελφοί μου ἀγαπητοὶ καὶ ἐπιπόθητοι, χαρὰ καὶ στέφανός μου, οὕτως στήκετε ἐν κυρίῳ, ἀγαπητοί.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/001.yaml
  text: So then[a], my beloved and longed-for brothers, my joy and crown, stand firm in the Lord in this way[b], beloved.
translation:
  language: ml
  text: അതുകൊണ്ട്, എന്റെ പ്രിയപ്പെട്ടവരും ഞാൻ അതിയായി കാണാൻ കൊതിക്കുന്നവരുമായ സഹോദരന്മാരേ[a], എന്റെ സന്തോഷവും കിരീടവുമായവരേ[b], കർത്താവിൽ ഇങ്ങനെ ഉറച്ചുനിൽക്കുവിൻ, പ്രിയരേ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സഹോദരന്മാരേ” എന്നത് ഗ്രീക്കിലെ പുല്ലിംഗരൂപത്തെ പരിഭാഷപ്പെടുത്തുന്നു; ഈ സന്ദർഭത്തിൽ പൗലോസ് പുരുഷന്മാരെ മാത്രമല്ല, സഭയിലെ സഹവിശ്വാസികളെയെല്ലാം അഭിസംബോധന ചെയ്യുന്നു.
    reason: cultural_note
  - marker: b
    text: “വിജയകിരീടം” എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്കുപദം വിജയിക്കു സമ്മാനമായി നൽകിയിരുന്ന പുഷ്പമാലയെയോ ഇലകൾകൊണ്ടുള്ള മാലയെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: അതുകൊണ്ട്
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനത്തിലേക്കുള്ള മാറ്റം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചന സംബോധനയുടെ രൂപം നിലനിർത്തുന്നു; സഭയിലെ സഹവിശ്വാസികൾ മുഴുവനും ഉദ്ദേശിക്കപ്പെടുന്നുവെന്ന സന്ദർഭസൂചന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἀγαπητοὶ
  choice: പ്രിയപ്പെട്ടവരും / പ്രിയരേ
  rationale: പൗലോസിന്റെ സ്നേഹനിർഭരമായ സംബോധനയും വാക്യത്തിലെ ആവർത്തനവും നിലനിർത്തുന്നു.
- source_word: ἐπιπόθητοι
  choice: ഞാൻ അതിയായി കാണാൻ കൊതിക്കുന്നവർ
  rationale: ആഴമായ അഭിലാഷവും വേർപാടിൽനിന്നുള്ള കാണാനുള്ള കൊതിയും സാധാരണ വായനക്കാർക്കു സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: χαρά
  choice: സന്തോഷം
  rationale: ഫിലിപ്പിയർതന്നെ പൗലോസിന്റെ സന്തോഷമാണെന്ന പ്രസ്താവന ലളിതമായും നേരിട്ടും നൽകുന്നു.
- source_word: στέφανος
  choice: കിരീടം
  rationale: വായനാസൗകര്യമുള്ള പതിവുപദം; വിജയിക്ക് നൽകുന്ന പുഷ്പമാലയോ ഇലമാലയോ എന്ന പ്രത്യേക ദൃശ്യാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: οὕτως
  choice: ഇങ്ങനെ
  rationale: ഉറച്ചുനിൽക്കേണ്ട രീതിയെ സൂചിപ്പിക്കുന്ന ക്രിയാവിശേഷണബലം ഇല്ലാതാക്കാതെ നിലനിർത്തുന്നു.
- source_word: στήκετε
  choice: ഉറച്ചുനിൽക്കുവിൻ
  rationale: സ്ഥിരതയോടെ നിലകൊള്ളാനുള്ള ബഹുവചന ആജ്ഞയെ ഗൗരവമുള്ളതും വ്യക്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐν κυρίῳ
  choice: കർത്താവിൽ
  rationale: പൗലോസിന്റെ ബന്ധാത്മകവും സ്ഥാനസൂചകവുമായ പ്രയോഗത്തെ അമിതമായി വ്യാഖ്യാനിക്കാതെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ἀδελφοί എന്ന പദത്തിന്റെ പ്രതിനിധാനപരമായ വ്യാപ്തി
  choice: മുഖ്യപാഠത്തിൽ പുല്ലിംഗരൂപം പ്രതിഫലിപ്പിക്കുന്ന “സഹോദരന്മാരേ” നിലനിർത്തി, സഭയിലെ സ്ത്രീകളും ഉൾപ്പെടുന്ന സന്ദർഭപരമായ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
  alternative: “സഹോദരീസഹോദരന്മാരേ” അല്ലെങ്കിൽ “സഹവിശ്വാസികളേ”
  rationale: മൂലത്തിലെ വ്യാകരണലിംഗം മറച്ചുവയ്ക്കാതെ, ലേഖനം സഭയെ മുഴുവനായി അഭിസംബോധന ചെയ്യുന്നതും വ്യക്തമാക്കുന്നു.
- issue: οὕτως എന്നതിന്റെ ദിശാസൂചന
  choice: “ഇങ്ങനെ” എന്ന തുറന്ന രൂപം നിലനിർത്തുന്നു.
  alternative: “മുൻപറഞ്ഞതുപോലെ” എന്ന് പിന്നോട്ടു മാത്രമായി ബന്ധിപ്പിക്കുക, അല്ലെങ്കിൽ തുടർന്നുള്ള നിർദേശങ്ങളിലേക്കു മാത്രമായി ബന്ധിപ്പിക്കുക
  rationale: ഗ്രീക്ക് പദം സൂചിപ്പിക്കുന്ന ബന്ധം മുൻസന്ദർഭത്തോടോ തുടർന്നുള്ള വിശദീകരണത്തോടോ ചേർന്ന് വായിക്കാവുന്നതിനാൽ അതിനെ നിശ്ശബ്ദമായി ഏകദിശയിൽ തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികതയും തിരുവെഴുത്തിനു യോജിച്ച ഗൗരവവും ചേർത്തിരിക്കുന്നു. “ഉറച്ചുനിൽക്കുവിൻ” എന്ന രൂപം ബഹുവചന ആജ്ഞയെയും ഔന്നത്യത്തെയും നിലനിർത്തുന്നു; പൗലോസിന്റെ ഊഷ്മളമായ ഇരട്ട സംബോധന ഒഴിവാക്കിയിട്ടില്ല.
