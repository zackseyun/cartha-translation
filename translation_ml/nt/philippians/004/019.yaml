revisions:
- from: എന്റെ ദൈവമോ, തന്റെ സമ്പത്തിനൊത്തവണ്ണം മഹത്വത്തിൽ, മശീഹയായ യേശുവിൽ, നിങ്ങളുടെ ഓരോ ആവശ്യവും നിറവേറ്റും.[a][b][c][d]
  to: എന്റെ ദൈവം തന്റെ സമ്പത്തിനൊത്തവണ്ണം മഹത്വത്തിൽ മശീഹയായ യേശുവിൽ നിങ്ങളുടെ ഓരോ ആവശ്യവും നിറവേറ്റും.[a][b][c][d]
  rationale: The revision removes an unwarranted contrastive nuance from δέ and removes punctuation that could imply a resolved relationship between the two Greek ἐν-phrases. All lexical choices and footnote anchors are otherwise retained, including the syntactic alternative that reflects a possible attachment of ‘in Messiah Jesus’ to ‘glory.’
