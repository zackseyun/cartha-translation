id: PHP.4.19
reference: Philippians 4:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ θεός μου πληρώσει πᾶσαν χρείαν ὑμῶν κατὰ ⸂τὸ πλοῦτος⸃ αὐτοῦ ἐν δόξῃ ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/019.yaml
  text: And my God will supply every need of yours according to his riches in glory in Messiah Jesus[a][b][c][d].
translation:
  language: ml
  text: എന്റെ ദൈവം തന്റെ സമ്പത്തിനൊത്തവണ്ണം മഹത്വത്തിൽ മശീഹയായ യേശുവിൽ നിങ്ങളുടെ ഓരോ ആവശ്യവും നിറവേറ്റും.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ക്രിസ്തുയേശുവിൽ.”'
    reason: lexical_alternative
  - marker: b
    text: “തന്റെ സമ്പത്തിനൊത്തവണ്ണം” എന്നത് ദൈവത്തിന്റെ കരുതലിന്റെ അളവോ മാനദണ്ഡമോ അവന്റെ സമ്പത്താണെന്ന് സൂചിപ്പിക്കുന്നു; അവന്റെ സമ്പത്തിൽനിന്ന് എന്തെങ്കിലും നൽകുന്നു എന്നതു മാത്രമല്ല.
    reason: alternative_reading
  - marker: c
    text: “മഹത്വത്തിൽ” എന്നതിന് “മഹത്വപൂർവം” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
  - marker: d
    text: 'അഥവാ: “മശീഹയായ യേശുവിലുള്ള മഹത്വത്തിൽ.”'
    reason: syntactic_alternative
lexical_decisions:
- source_word: ὁ δὲ θεός μου
  choice: എന്റെ ദൈവമോ
  rationale: δέ ഇവിടെ ശക്തമായ വിരോധത്തെക്കാൾ മൃദുവായ ബന്ധവും വിഷയമാറ്റവും സൂചിപ്പിക്കുന്നു. ‘എന്റെ ദൈവമോ’ വ്യക്തിപരമായ ഊന്നൽ നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായി വാക്യത്തെ മുൻസന്ദർഭത്തോട് ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: πληρώσει
  choice: നിറവേറ്റും
  rationale: ഈ സന്ദർഭത്തിൽ πληρόω കുറവുള്ളത് നൽകുക, ആവശ്യം നിവർത്തിക്കുക എന്ന അർഥത്തിലാണ്. ‘നിറവേറ്റും’ സാധാരണ മലയാളത്തിൽ ആവശ്യങ്ങൾ സംബന്ധിച്ച് സ്വാഭാവികവും അർഥസമീപവുമാണ്.
- source_word: πᾶσαν χρείαν ὑμῶν
  choice: നിങ്ങളുടെ ഓരോ ആവശ്യവും
  rationale: χρεία ആവശ്യം അഥവാ അനിവാര്യതയെ സൂചിപ്പിക്കുന്നു; πᾶσαν എന്നതിന്റെ വിതരണാർഥം ‘ഓരോ’ വ്യക്തമായി നിലനിർത്തുന്നു. ഏകവചനരൂപവും ഗ്രീക്കിനോട് അടുത്തതാണ്.
- source_word: κατὰ τὸ πλοῦτος αὐτοῦ
  choice: തന്റെ സമ്പത്തിനൊത്തവണ്ണം
  rationale: κατά ഇവിടെ ഉറവിടം മാത്രമല്ല, അളവോ മാനദണ്ഡമോ സൂചിപ്പിക്കുന്നു. അതിനാൽ ‘സമ്പത്തിൽനിന്ന്’ എന്നതിനെക്കാൾ ‘സമ്പത്തിനൊത്തവണ്ണം’ ഗ്രീക്ക് ആശയം കൃത്യമായി നൽകുന്നു.
- source_word: ἐν δόξῃ
  choice: മഹത്വത്തിൽ
  rationale: ഈ പദബന്ധത്തിന്റെ ബന്ധവും സൂക്ഷ്മാർഥവും ഗ്രീക്കിൽ പൂർണമായി നിർണയിക്കപ്പെട്ടിട്ടില്ല. വ്യാഖ്യാനപരമായ ‘മഹത്വപൂർവം’ എന്നതിനു പകരം ഔപചാരികമായ ‘മഹത്വത്തിൽ’ ആ തുറന്ന നില സംരക്ഷിക്കുന്നു.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: മശീഹയായ യേശുവിൽ
  rationale: Χριστός ഇവിടെ യേശുവിന്റെ അഭിഷിക്തരാജാവെന്ന പദവിയാണ്. ‘മശീഹയായ യേശു’ ആ പദവിയുടെ അർഥം പ്രകടമാക്കുന്നു; പരമ്പരാഗത ‘ക്രിസ്തുയേശു’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: ἐν Χριστῷ Ἰησοῦ എന്നതിലെ Χριστός-ന്റെ പരിഭാഷ
  choice: മശീഹയായ യേശുവിൽ
  alternative: ക്രിസ്തുയേശുവിൽ
  rationale: ഈ സന്ദർഭത്തിൽ Χριστός ഒരു യഥാർഥ പദവിയായി വായിക്കാം; അതിനാൽ അതിന്റെ അർഥം വ്യക്തമാക്കുന്ന ‘മശീഹ’ മുഖ്യവാചകത്തിൽ ഉപയോഗിച്ചു. പരിചിതമായ പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: ἐν δόξῃ ἐν Χριστῷ Ἰησοῦ എന്ന ഇരട്ട ἐν-പദബന്ധത്തിന്റെ ഘടന
  choice: ‘മഹത്വത്തിൽ’ എന്നും ‘മശീഹയായ യേശുവിൽ’ എന്നും ക്രിയയോട് ബന്ധപ്പെടാവുന്ന തുടർച്ചയായ പദബന്ധങ്ങളായി നിലനിർത്തി
  alternative: ‘മശീഹയായ യേശുവിലുള്ള മഹത്വത്തിൽ’ എന്ന് രണ്ടാമത്തേതിനെ ‘മഹത്വം’ എന്നതിനോട് നേരിട്ട് ബന്ധിപ്പിക്കുക
  rationale: ഗ്രീക്ക് വാക്യഘടന ഒന്നിലധികം ബന്ധസാധ്യത അനുവദിക്കുന്നു. മുഖ്യവാചകം അത് തീർപ്പാക്കാതെ നിലനിർത്തുന്നു; കൂടുതൽ വ്യക്തമായ മറ്റൊരു ഘടന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘എന്റെ ദൈവമോ’ മൃദുവായ ബന്ധകഭാവം നൽകുന്നു. ‘നിങ്ങളുടെ ഓരോ ആവശ്യവും നിറവേറ്റും’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്. ഗ്രീക്കിലെ ഇരട്ട ἐν-പദബന്ധത്തിന്റെ സാന്ദ്രത മുഖ്യവാചകത്തിൽ കോമകളിലൂടെ വായനാസൗകര്യത്തോടെ സൂക്ഷിച്ചു; അതിന്റെ ഘടനാപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
