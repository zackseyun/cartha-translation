  text: because even in Thessalonica you sent for my need both once and twice[a].
translation:
  language: ml
  text: എന്തെന്നാൽ, തെസ്സലോനിക്കയിൽപ്പോലും എന്റെ ആവശ്യത്തിനായി നിങ്ങൾ ഒരിക്കൽ മാത്രമല്ല, രണ്ടുതവണയും അയച്ചുതന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ, “ഒരിക്കൽയും രണ്ടുതവണയും”; അർഥം: “ഒന്നിലധികം തവണ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: എന്തെന്നാൽ
  rationale: മുൻസന്ദർഭത്തിലെ പ്രസ്താവനയ്ക്ക് വിശദീകരണമോ കാരണമോ നൽകുന്ന ബന്ധകമായി സ്വാഭാവികമായ ആധുനിക മലയാളം.
- source_word: καὶ ἐν Θεσσαλονίκῃ
  choice: തെസ്സലോനിക്കയിൽ ആയിരുന്നപ്പോൾപോലും
  rationale: സ്ഥലസൂചന നിലനിർത്തിക്കൊണ്ട്, സന്ദർഭത്തിൽ പൗലോസ് അവിടെ ഉണ്ടായിരുന്ന കാലത്തെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; καίയുടെ ഊന്നൽ ‘പോലും’ വഴി പ്രകടമാക്കുന്നു.
- source_word: καὶ ἅπαξ καὶ δὶς
  choice: ഒന്നിലധികം തവണ
  rationale: അക്ഷരാർഥത്തിലെ ‘ഒരിക്കലും രണ്ടിക്കലും’ എന്ന സെമിറ്റിക് സ്വഭാവമുള്ള പ്രയോഗത്തിന്റെ ഉദ്ദേശ്യം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; കൂടുതൽ രൂപസാദൃശ്യമുള്ള പകരം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: εἰς τὴν χρείαν μοι
  choice: എന്റെ ആവശ്യം നിറവേറ്റാൻ
  rationale: ഏകവചനമായ χρείαയുടെ അർഥം നിലനിർത്തുകയും, അയച്ചതിന്റെ ലക്ഷ്യം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പറയുകയും ചെയ്യുന്നു.
- source_word: ἐπέμψατε
  choice: നിങ്ങൾ … അയച്ചുതന്നു
  rationale: ഗ്രീക്കിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ലാത്തതിനാൽ ‘സഹായം’ അല്ലെങ്കിൽ ‘പണം’ എന്നു ചേർക്കാതെ അയയ്ക്കുക എന്ന ക്രിയയുടെ തുറന്ന സ്വഭാവം നിലനിർത്തുന്നു.
