translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലത്തിലെ ഊന്നൽ നിലനിർത്താൻ ‘പോലും’ ഉപയോഗിച്ചു; ἅπαξ καὶ δὶς എന്ന പ്രയോഗം മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി, രൂപസാദൃശ്യമുള്ള വായന അടിക്കുറിപ്പിൽ നൽകി.
