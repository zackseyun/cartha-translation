id: PHP.4.21
reference: Philippians 4:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀσπάσασθε πάντα ἅγιον ἐν Χριστῷ Ἰησοῦ. ἀσπάζονται ὑμᾶς οἱ σὺν ἐμοὶ ἀδελφοί.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/021.yaml
  text: Greet every saint in Messiah Jesus[b][a]. The brothers with me greet you.
translation:
  language: ml
  text: മശീഹായായ യേശുവിലുള്ള ഓരോ വിശുദ്ധനെയും അഭിവാദ്യം ചെയ്യുക.[a] എന്നോടൊപ്പമുള്ള സഹോദരന്മാർ[b] നിങ്ങളെ അഭിവാദ്യം ചെയ്യുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ക്രിസ്തുയേശുവിലുള്ള.”
    reason: lexical_alternative
  - marker: b
    text: “സഹോദരന്മാർ” എന്നത് ഈ സന്ദർഭത്തിൽ പൗലോസിനോടൊപ്പമുള്ള സ്ത്രീപുരുഷന്മാർ ഉൾപ്പെട്ട സഹവിശ്വാസികളെ വിശാലമായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάσασθε
  choice: അഭിവാദ്യം ചെയ്യുക
  rationale: കത്തിലെ സമാപനഭാഗത്ത് മറ്റുള്ളവരെ അഭിവാദ്യം അറിയിക്കാനുള്ള ആജ്ഞയെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: πάντα ἅγιον
  choice: ഓരോ വിശുദ്ധനെയും
  rationale: πᾶς എന്ന പദത്തോടുകൂടിയ ഏകവചനപ്രയോഗത്തിന്റെ വിതരണാർഥം ‘ഓരോ’ എന്നു വ്യക്തമാക്കുന്നു; ἅγιος വിശ്വാസികളുടെ ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ട നിലയെ സൂചിപ്പിക്കുന്ന പതിവുപദമായ ‘വിശുദ്ധൻ’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: മശീഹായായ യേശുവിലുള്ള
  rationale: Χριστός ഇവിടെ ഒരു സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നതിനാൽ ‘മശീഹാ’ എന്നു പരിഭാഷപ്പെടുത്തി; ἐν സൂചിപ്പിക്കുന്ന യേശുവുമായുള്ള ബന്ധം ‘ഉള്ള’ എന്ന സ്വാഭാവിക മലയാളഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: ἀσπάζονται
  choice: അഭിവാദ്യം ചെയ്യുന്നു
  rationale: കത്തിലെ ആശംസാസന്ദർഭത്തിൽ ഗ്രീക്ക് മധ്യരൂപത്തിന്റെ അർഥം സ്വാഭാവികമായ മലയാള സജീവപ്രയോഗത്തിലൂടെ നൽകുന്നു.
- source_word: οἱ σὺν ἐμοὶ ἀδελφοί
  choice: എന്നോടുകൂടെയുള്ള സഹോദരന്മാർ
  rationale: σὺν ἐμοὶ എന്നത് ‘എന്നോടുകൂടെയുള്ള’ എന്നും വ്യാകരണപരമായി പുല്ലിംഗ ബഹുവചനമായ ἀδελφοί ‘സഹോദരന്മാർ’ എന്നും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
theological_decisions:
- issue: Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: ഗ്രീക്ക് Χριστός അഭിഷിക്തനായ വാഗ്ദത്ത രാജാവിനെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരായതിനാൽ അതിന്റെ അർഥം വ്യക്തമാക്കുന്ന ‘മശീഹാ’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; മലയാളത്തിൽ പതിവായ ലിപ്യന്തരണം അടിക്കുറിപ്പിൽ നൽകി.
- issue: ἀδελφοί സൂചിപ്പിക്കുന്ന കൂട്ടത്തിന്റെ വ്യാപ്തി
  choice: സഹോദരന്മാർ
  alternative: സഹവിശ്വാസികൾ / സഹോദരീസഹോദരന്മാർ
  rationale: മൂലത്തിലെ വ്യാകരണപരമായ പുല്ലിംഗരൂപം മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ചു; എന്നാൽ ഈ സന്ദർഭത്തിൽ സ്ത്രീകളും പുരുഷന്മാരും ഉൾപ്പെട്ട സഹവിശ്വാസിസമൂഹത്തെ സൂചിപ്പിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കത്തുശൈലി സ്വീകരിച്ചു. ‘അഭിവാദ്യം ചെയ്യുക’ എന്ന ഏകവചന ആജ്ഞ സഭയെ കൂട്ടായ അഭിസംബോധന ചെയ്യുന്നതായി മൂലരൂപത്തോട് ചേർന്ന് നിലനിർത്തി; ദൈവശാസ്ത്രപരമായ അർഥസാധ്യതകൾ മുഖ്യപാഠത്തിൽ അനാവശ്യമായി തീർപ്പാക്കിയിട്ടില്ല.
