revisions:
- from: എല്ലാ ഗ്രാഹ്യശക്തിയെയും അതിക്രമിക്കുന്ന ദൈവത്തിന്റെ സമാധാനം മശീഹയായ യേശുവിൽ[a] നിങ്ങളുടെ ഹൃദയങ്ങളെയും ചിന്തകളെയും കാത്തുകൊള്ളും.
  to: എല്ലാ ഗ്രഹണശേഷിയെയും കവിയുന്ന ദൈവത്തിന്റെ സമാധാനം നിങ്ങളുടെ ഹൃദയങ്ങളെയും ചിന്തകളെയും മശീഹയായ യേശുവിൽ കാവൽ കാക്കും.
  rationale: The revision improves idiomatic Malayalam and places ‘in Messiah Jesus’ where it clearly modifies the guarding action, while retaining the Greek sequence of peace, its incomprehensible surpassing quality, and its guarding of both hearts and thoughts. The title ‘Messiah’ is retained in accordance with the stated translation policy; the conventional transliteration remains in the footnote.
