id: PHP.4.7
reference: Philippians 4:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἡ εἰρήνη τοῦ θεοῦ ἡ ὑπερέχουσα πάντα νοῦν φρουρήσει τὰς καρδίας ὑμῶν καὶ τὰ νοήματα ὑμῶν ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/007.yaml
  text: And the peace of God[a], which surpasses all understanding, will guard your hearts and your minds in Messiah Jesus.
translation:
  language: ml
  text: എല്ലാ ഗ്രഹണശേഷിയെയും കവിയുന്ന ദൈവത്തിന്റെ സമാധാനം നിങ്ങളുടെ ഹൃദയങ്ങളെയും ചിന്തകളെയും മശീഹയായ യേശുവിൽ കാവൽ കാക്കും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰρήνη
  choice: സമാധാനം
  rationale: ആന്തരിക ശാന്തിയും ബന്ധങ്ങളിലെ സമഗ്രക്ഷേമവും ഉൾക്കൊള്ളാൻ കഴിയുന്ന, സ്വാഭാവികവും സ്ഥിരപ്രയോഗത്തിലുള്ളതുമായ മലയാളപദം.
- source_word: τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ
  rationale: ഗ്രീക്കിലെ ഷഷ്ഠീവിഭക്തിബന്ധം വ്യാഖ്യാനിച്ച് ‘ദൈവത്തിൽനിന്നുള്ള’ എന്നു പരിമിതപ്പെടുത്താതെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἡ ὑπερέχουσα πάντα νοῦν
  choice: എല്ലാ ഗ്രാഹ്യശക്തിയെയും അതിക്രമിക്കുന്ന
  rationale: ദൈവത്തിന്റെ സമാധാനം സകല മാനസിക ഗ്രഹണശേഷിക്കും അപ്പുറമാണെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; νοῦς എന്നതിന്റെ ‘മനസ്സ്/ഗ്രാഹ്യശക്തി’ അർത്ഥപരിധിയിൽ സന്ദർഭോചിതമായത് തെരഞ്ഞെടുത്തു.
- source_word: φρουρήσει
  choice: കാത്തുകൊള്ളും
  rationale: സംരക്ഷണപരമായ കാവലിന്റെ ഭാവവും ഭാവികാലവും ലളിതവും dignified ആയ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: τὰς καρδίας ὑμῶν
  choice: നിങ്ങളുടെ ഹൃദയങ്ങളെ
  rationale: വികാരങ്ങൾക്കപ്പുറം വ്യക്തിയുടെ ആന്തരികകേന്ദ്രത്തെയും സൂചിപ്പിക്കുന്ന ബൈബിൾപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: τὰ νοήματα ὑμῶν
  choice: നിങ്ങളുടെ ചിന്തകളെ
  rationale: νοήματα എന്ന ബഹുവചനത്തിന്റെ ചിന്തകൾ, മാനസിക പ്രവർത്തനങ്ങൾ എന്ന നേരിട്ടുള്ള അർത്ഥം സംരക്ഷിക്കുന്നു.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: മശീഹയായ യേശുവിൽ
  rationale: Χριστός എന്ന പദത്തിന്റെ സ്ഥാനപ്പേരായ അർത്ഥം വിവർത്തനം ചെയ്യുകയും ἐν സൂചിപ്പിക്കുന്ന ഐക്യത്തിന്റെയും സുരക്ഷിതമായ നിലയുടെയും മേഖലയെ നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ ἐν Χριστῷ Ἰησοῦ എന്ന പ്രയോഗത്തിലെ Χριστός
  choice: മശീഹയായ യേശുവിൽ
  alternative: ക്രിസ്തുയേശുവിൽ
  rationale: ഇവിടെ Χριστός എന്നത് വെറും പേരായി ലിപ്യന്തരണം ചെയ്യാതെ ‘അഭിഷിക്തൻ/മശീഹ’ എന്ന സ്ഥാനപ്പേരിന്റെ അർത്ഥബലം വഹിക്കുന്നു. അതേസമയം പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ദൈവസമാധാനം കാവൽ നിൽക്കുന്ന മേഖല
  choice: ‘മശീഹയായ യേശുവിൽ’ എന്നത് കാത്തുകൊള്ളലുമായി ബന്ധിപ്പിച്ചു
  alternative: ഈ വാക്യഭാഗം ‘നിങ്ങളുടെ ഹൃദയങ്ങളും ചിന്തകളും’ എന്നതിനോട് കൂടുതൽ അടുത്തായി വായിക്കുക
  rationale: ഗ്രീക്ക് പദക്രമത്തിൽ ἐν Χριστῷ Ἰησοῦ അവസാനം വരുന്നതിനാൽ കാവൽ/സുരക്ഷ നടക്കുന്ന മേഖലയായി സ്വാഭാവികമായി വായിക്കാം; മലയാളക്രമം ഈ ബന്ധം വ്യക്തമാക്കുന്നുവെങ്കിലും വാക്യത്തിന്റെ അടിസ്ഥാന ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിച്ച് വികസിപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഗ്രാഹ്യശക്തി’, ‘അതിക്രമിക്കുന്ന’ എന്നീ പദങ്ങൾ ആശയത്തിന്റെ ഉയർച്ച നിലനിർത്തുമ്പോഴും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാണ്; പഴയ ശൈലിയിലെ ‘നിനവുകൾ’ ഒഴിവാക്കി ‘ചിന്തകൾ’ ഉപയോഗിച്ചു.
