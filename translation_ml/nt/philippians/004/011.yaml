id: PHP.4.11
reference: Philippians 4:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐχ ὅτι καθ’ ὑστέρησιν λέγω, ἐγὼ γὰρ ἔμαθον ἐν οἷς εἰμι αὐτάρκης εἶναι·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/011.yaml
  text: Not that I am speaking from need[a], for I have learned to be content in whatever circumstances I am in.
translation:
  language: ml
  text: എനിക്കു കുറവുള്ളതുകൊണ്ടല്ല ഞാൻ ഇങ്ങനെ പറയുന്നത്; കാരണം, ഞാൻ ഏതു സാഹചര്യത്തിലായാലും സംതൃപ്തനായിരിക്കാൻ പഠിച്ചിരിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അതായത്, ‘സ്വയംപര്യാപ്തനായിരിക്കാൻ’; ഗ്രീക്ക് വിശേഷണത്തിന് സ്വയം മതിയായിരിക്കുക എന്ന അർഥവും ഉണ്ടാകാം. എന്നാൽ ഇവിടെ സന്ദർഭാനുസൃതമായി ‘സംതൃപ്തനായിരിക്കാൻ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ὑστέρησιν
  choice: കുറവുള്ളതുകൊണ്ട്
  rationale: വ്യക്തിപരമായ അഭാവമോ ആവശ്യകതയോ മൂലമാണ് പൗലോസ് സംസാരിക്കുന്നത് എന്ന ആശയം നിഷേധിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: λέγω
  choice: ഞാൻ ഇത് പറയുന്നത്
  rationale: വർത്തമാനകാലത്തിലുള്ള പ്രസ്താവനയെ സന്ദർഭവുമായി ബന്ധിപ്പിച്ച് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἔμαθον
  choice: ഞാൻ പഠിച്ചിരിക്കുന്നു
  rationale: പഠിച്ച പ്രക്രിയ പൂർത്തിയായതും അതിന്റെ ഫലം ഇപ്പോഴും നിലനിൽക്കുന്നതുമായ ഭാവം മലയാളത്തിലെ പൂർത്തികാലപ്രയോഗത്തിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: ἐν οἷς εἰμι
  choice: ഏതു സാഹചര്യത്തിലായാലും
  rationale: വെറും സ്ഥലസൂചനയല്ല, ഒരാൾ അഭിമുഖീകരിക്കുന്ന വിവിധ ജീവിതസാഹചര്യങ്ങളെയാണ് ആപേക്ഷിക പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
- source_word: αὐτάρκης
  choice: സംതൃപ്തനായിരിക്കാൻ
  rationale: സ്വയംപര്യാപ്തത എന്ന പദാർഥസാധ്യത നിലനിൽക്കുന്നുവെങ്കിലും, മാറുന്ന സാഹചര്യങ്ങളിൽ തൃപ്തിയോടെ കഴിയാൻ പഠിച്ചതെന്ന സന്ദർഭാർഥം ഈ പരിഭാഷ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: αὐτάρκης എന്ന പദത്തിലെ തത്ത്വചിന്താപരമായ സ്വയംപര്യാപ്തതയുടെ സാധ്യത
  choice: പ്രധാന പാഠത്തിൽ ‘സംതൃപ്തനായിരിക്കാൻ’ എന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘സ്വയംപര്യാപ്തനായിരിക്കാൻ’
  rationale: സന്ദർഭം സാഹചര്യങ്ങളെ അതിജീവിക്കുന്ന പഠിച്ച മനോഭാവത്തെക്കുറിച്ചാണ്. ‘സംതൃപ്തൻ’ എന്നത് സ്വതന്ത്രമായ ആത്മപര്യാപ്തതയെ അമിതമായി സൂചിപ്പിക്കാതെ സന്ദർഭാർഥം നൽകുന്നു; യഥാർഥ പദാർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിന്റെ നിഷേധം–കാരണം എന്ന ഘടന നിലനിർത്തുകയും αὐτάρκης എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്തു.
