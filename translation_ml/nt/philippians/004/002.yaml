id: PHP.4.2
reference: Philippians 4:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εὐοδίαν παρακαλῶ καὶ Συντύχην παρακαλῶ τὸ αὐτὸ φρονεῖν ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/002.yaml
  text: I urge Euodia[a], and I urge Syntyche, to think the same way in the Lord.
translation:
  language: ml
  text: 'യൂവോദിയയോടു ഞാൻ അഭ്യർഥിക്കുന്നു; സുന്തുഖേയോടും ഞാൻ അഭ്യർഥിക്കുന്നു: കർത്താവിൽ ഒരേ മനസ്സുള്ളവരായിരിക്കാൻ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εὐοδίαν
  choice: യുവൊദ്യ
  rationale: വ്യക്തിനാമം അർഥപരിഭാഷ ചെയ്യാതെ ഗ്രീക്ക് ഉച്ചാരണത്തോട് അടുത്ത, മലയാളത്തിൽ വായിക്കാൻ സ്വാഭാവികമായ രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: παρακαλῶ
  choice: ഞാൻ ... അഭ്യർഥിക്കുന്നു
  rationale: സ്നേഹപൂർവവും ഗൗരവമുള്ളതുമായ വ്യക്തിപരമായ അഭ്യർഥനയുടെ ഭാവം നൽകുന്നു. പൗലോസ് ഓരോ സ്ത്രീയോടും വേർതിരിച്ച് പറയുന്നതിനാൽ ക്രിയയുടെ ആവർത്തനം നിലനിർത്തി.
- source_word: Συντύχην
  choice: സുന്തുക
  rationale: വ്യക്തിനാമം അർഥപരിഭാഷ ചെയ്യാതെ ഗ്രീക്ക് ഉച്ചാരണത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: τὸ αὐτὸ φρονεῖν
  choice: ഒരേ മനസ്സോടെ ചിന്തിക്കാൻ
  rationale: τὸ αὐτό സൂചിപ്പിക്കുന്ന ഏകതയും φρονεῖν സൂചിപ്പിക്കുന്ന ചിന്താ-മനോഭാവപരമായ അർഥവും ഒരുമിച്ച് നിലനിർത്തുന്നു; വെറും ‘യോജിക്കാൻ’ എന്നതിലേക്കു ചുരുക്കുന്നില്ല.
- source_word: ἐν κυρίῳ
  choice: കർത്താവിൽ
  rationale: അഭ്യർഥിക്കുന്ന ഏകത കർത്താവുമായുള്ള ബന്ധത്തിൽ അധിഷ്ഠിതമാണെന്ന സാന്ദ്രമായ ഗ്രീക്ക് പ്രയോഗം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἐν κυρίῳ എന്ന പ്രയോഗത്തിന്റെ ബന്ധപരവും പ്രവർത്തനപരവുമായ വ്യാപ്തി
  choice: കർത്താവിൽ
  alternative: കർത്താവിനോടുള്ള ഐക്യത്തിൽ
  rationale: മൂലത്തിലെ സംക്ഷിപ്തതയും ദൈവശാസ്ത്രപരമായ സാന്ദ്രതയും സംരക്ഷിച്ച്, ബന്ധം, അടിസ്ഥാനം, പ്രവർത്തനമണ്ഡലം എന്നിവയിൽ ഏതെങ്കിലും ഒന്ന് മാത്രം നിർബന്ധമായി തിരഞ്ഞെടുത്തില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. വ്യക്തിപരമായ അഭ്യർഥനയുടെ സമാന്തര ആവർത്തനം നിലനിർത്തിയിരിക്കുന്നു; ‘ഒരേ മനസ്സോടെ ചിന്തിക്കുക’ എന്നത് അറിവിലെ പൂർണ ഏകാഭിപ്രായം മാത്രമല്ല, പങ്കിട്ട മനോഭാവവും സൂചിപ്പിക്കാൻ അനുവദിക്കുന്നു.
