id: 2TH.1.1
reference: 2 Thessalonians 1:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Παῦλος καὶ Σιλουανὸς καὶ Τιμόθεος τῇ ἐκκλησίᾳ Θεσσαλονικέων ἐν θεῷ πατρὶ ἡμῶν καὶ κυρίῳ Ἰησοῦ Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/001.yaml
  text: 'Paul and Silvanus and Timothy[b][a], to the church of the Thessalonians in God our Father and the Lord Jesus the Messiah:'
translation:
  language: ml
  text: 'പൗലൊസും സിൽവാനൊസും തിമൊഥെയൊസും, നമ്മുടെ പിതാവായ ദൈവത്തിലും കർത്താവായ യേശു മശീഹായിലും ഉള്ള തെസ്സലോനിക്യരുടെ സഭയ്ക്ക്:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Παῦλος
  choice: പൗലോസ്
  rationale: Παῦλος എന്ന വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: Σιλουανὸς
  choice: സില്വാനൊസ്
  rationale: മൂലപാഠത്തിലെ Σιλουανός എന്ന പൂർണരൂപം നേരിട്ട് ലിപ്യന്തരിച്ചു; പ്രവൃത്തികളിലെ ചുരുക്കരൂപമായ ‘ശീലാസ്’ എന്നതുമായി സമീകരിച്ചില്ല.
- source_word: Τιμόθεος
  choice: തിമൊഥെയൊസ്
  rationale: Τιμόθεος എന്ന വ്യക്തിനാമത്തിന്റെ മൂലരൂപത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം.
- source_word: ἐκκλησίᾳ
  choice: സഭയ്ക്ക്
  rationale: പൗലോസിന്റെ ലേഖനസന്ദർഭത്തിൽ ἐκκλησία വിശ്വാസികളുടെ സമൂഹത്തെ സൂചിപ്പിക്കുന്നു; ‘സഭ’ സ്വാഭാവികവും പ്രചാരമുള്ളതുമായ മലയാള സമാനപദമാണ്.
- source_word: Θεσσαλονικέων
  choice: തെസ്സലോനിക്യരുടെ
  rationale: ജനങ്ങളെ സൂചിപ്പിക്കുന്ന ബഹുവചന ഷഷ്ഠിവിഭക്തി നിലനിർത്തുന്നു; നഗരത്തെ സൂചിപ്പിക്കുന്ന ‘തെസ്സലോനിക്യയിലെ’ എന്ന സ്ഥലവാചകമാക്കി മാറ്റുന്നില്ല.
- source_word: ἐν
  choice: …ലും …ലും ഉള്ള
  rationale: ദൈവത്തോടും കർത്താവായ യേശുവോടുമുള്ള സഭയുടെ ബന്ധത്തെ ‘ഉള്ള’ എന്ന സ്വാഭാവിക മലയാള ഘടനയിൽ അവതരിപ്പിക്കുന്നു; ഉൾപ്പെടൽ, ഐക്യം, ആധാരം എന്നീ സാധ്യതകളിൽ ഒന്നിലേക്ക് അർഥം ചുരുക്കുന്നില്ല.
- source_word: θεῷ πατρὶ ἡμῶν
  choice: നമ്മുടെ പിതാവായ ദൈവം
  rationale: ἡμῶν എന്ന ‘നമ്മുടെ’ എന്ന ഉടമസ്ഥസൂചന വ്യക്തമായി നിലനിർത്തുകയും πατήρ എന്നത് ദൈവത്തോടുള്ള വിശേഷണബന്ധത്തിൽ സ്വാഭാവികമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: κυρίῳ
  choice: കർത്താവ്
  rationale: യേശുവിന്റെ ബഹുമാനപദവിയായ κύριος എന്നതിന് പുതിയനിയമ മലയാളത്തിൽ സ്വാഭാവികമായ ‘കർത്താവ്’ ഉപയോഗിച്ചു.
- source_word: Ἰησοῦ Χριστῷ
  choice: മശീഹാ യേശു
  rationale: Ἰησοῦ എന്ന പേര് ലിപ്യന്തരിച്ചു; Χριστός എന്ന അഭിഷിക്തരാജാവിന്റെ പദവി ‘മശീഹാ’ എന്നു വിവർത്തനം ചെയ്തു. മലയാളത്തിൽ പദവിക്ക് സ്വാഭാവിക ഊന്നൽ ലഭിക്കാൻ ‘മശീഹാ യേശു’ എന്ന ക്രമം സ്വീകരിച്ചു.
theological_decisions:
- issue: Ἰησοῦ Χριστῷ എന്ന പേര്–പദവി സംയുക്തത്തിലെ Χριστός
  choice: മശീഹാ യേശു
  alternative: യേശുക്രിസ്തു
  rationale: Χριστός ഇവിടെ യേശുവിനോടു ചേർന്ന പദവിയായതിനാൽ അതിന്റെ അർഥം വ്യക്തമാക്കുന്ന ‘മശീഹാ’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; പരമ്പരാഗത ലിപ്യന്തരണം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- issue: ἐν θεῷ πατρὶ ἡμῶν καὶ κυρίῳ Ἰησοῦ Χριστῷ പ്രകടിപ്പിക്കുന്ന ബന്ധം
  choice: നമ്മുടെ പിതാവായ ദൈവത്തിലും കർത്താവായ മശീഹാ യേശുവിലും ഉള്ള
  alternative: നമ്മുടെ പിതാവായ ദൈവത്തിനും കർത്താവായ മശീഹാ യേശുവിനും ചേർന്ന
  rationale: ἐν എന്നതിലെ ഉൾപ്പെടൽ, ഐക്യം, ആധാരം തുടങ്ങിയ ദൈവശാസ്ത്രപരമായ വ്യാപ്തി നിലനിർത്തി; ‘ചേർന്ന’ എന്ന വ്യാഖ്യാനത്തിലേക്ക് അർഥം പരിമിതപ്പെടുത്തിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവവും വായനാസൗകര്യവും പുലർത്തുന്ന മലയാളം. ഗ്രീക്ക് അഭിവാദനവാക്യത്തിന്റെ സംക്ഷിപ്ത ഘടനയും അവസാനത്തെ ദ്വിബിന്ദുവും നിലനിർത്തി; പേരുകൾക്കിടയിലെ ആവർത്തിച്ച καί ‘ഉം’ രൂപത്തിൽ സംരക്ഷിച്ചു.
