source:
  edition: SBLGNT
  text: ἐν ⸂φλογὶ πυρός⸃, διδόντος ἐκδίκησιν τοῖς μὴ εἰδόσι θεὸν καὶ τοῖς μὴ ὑπακούουσιν τῷ εὐαγγελίῳ τοῦ κυρίου ἡμῶν Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/008.yaml
  text: in flaming fire[a], inflicting vengeance on those who do not know God and on those who do not obey the gospel of our Lord Jesus[b],
translation:
  language: ml
  text: ജ്വലിക്കുന്ന അഗ്നിയിൽ[a], ദൈവത്തെ അറിയാത്തവർക്കും നമ്മുടെ കർത്താവായ യേശുവിന്റെ സുവിശേഷം അനുസരിക്കാത്തവർക്കും പ്രതികാരം നടപ്പാക്കിക്കൊണ്ട്[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘അഗ്നിജ്വാലയിൽ.’'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: ‘ന്യായപ്രതിഫലം നൽകിക്കൊണ്ട്.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν φλογὶ πυρός
  choice: ജ്വലിക്കുന്ന അഗ്നിയിൽ
  rationale: ‘അഗ്നിജ്വാലയിൽ’ എന്നതും സാധ്യമാണെങ്കിലും, ജ്വലിക്കുന്ന അഗ്നി എന്ന പ്രയോഗം മൂലത്തിലെ ഉജ്ജ്വലമായ അഗ്നിചിത്രം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ഇത് മുൻവാക്യത്തിലെ കർത്താവിന്റെ വെളിപ്പെടലിനോടു ബന്ധപ്പെടുന്നു.
- source_word: διδόντος ἐκδίκησιν
  choice: പ്രതികാരം നൽകിക്കൊണ്ട്
  rationale: διδόντος എന്നതിന്റെ ‘നൽകുക’ എന്ന അടിസ്ഥാനാർഥവും ἐκδίκησις എന്നതിന്റെ ശക്തിയും നിലനിർത്തുന്നു. ഇവിടെ പ്രതികാരം വ്യക്തിപരമായ പകയല്ല, ദൈവിക ന്യായവിധിയുടെ നിർവഹണമാണ്.
- source_word: τοῖς μὴ εἰδόσι θεὸν
  choice: ദൈവത്തെ അറിയാത്തവർക്ക്
  rationale: οἶδα ഇവിടെ വർത്തമാനകാല അർഥത്തിൽ നിലനിൽക്കുന്ന അറിവിന്റെ അവസ്ഥയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ നേരിട്ടും സ്വാഭാവികവുമായ രൂപം.
- source_word: τοῖς μὴ ὑπακούουσιν
  choice: അനുസരിക്കാത്തവർക്ക്
  rationale: ὑπακούω എന്നതിലെ കേട്ട് അനുസരിക്കുക എന്ന ആശയം ചുരുക്കമായും കൃത്യമായും നൽകുന്നു; ‘അനുസരിക്കാൻ വിസമ്മതിക്കുന്നവർ’ എന്നു പറഞ്ഞാൽ മൂലത്തിൽ വ്യക്തമല്ലാത്ത മനഃപൂർവത അധികമായി ചേർക്കും.
- source_word: τῷ εὐαγγελίῳ
  choice: സുവിശേഷം
  rationale: പൗലോസിന്റെ രചനകളിൽ ആവർത്തിക്കുന്ന സാങ്കേതികവും മലയാള ബൈബിൾഭാഷയിൽ പരിചിതവുമായ പദമാണ്; സാധാരണ വായനക്കാർക്കും ഗ്രാഹ്യം.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: നമ്മുടെ കർത്താവായ യേശുവിന്റെ
  rationale: ജനിറ്റീവ് ബന്ധവും κύριος എന്ന പദവിയും സ്വാഭാവിക മലയാളക്രമത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ദൈവിക ന്യായവിധിയിൽ ἐκδίκησις എന്നതിന്റെ സ്വഭാവം
  choice: പ്രതികാരം
  alternative: ശിക്ഷ / ന്യായപ്രതിഫലം
  rationale: മൂലപദത്തിന്റെ തീവ്രത മയപ്പെടുത്താതെ നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ ഇത് പാപപൂർണമായ മനുഷ്യപ്പകയല്ല, കർത്താവ് നടപ്പാക്കുന്ന നീതിപൂർവമായ വിധിയാണ്.
- issue: τοῦ κυρίου ἡμῶν Ἰησοῦ എന്ന ജനിറ്റീവിന്റെ ബന്ധം
  choice: നമ്മുടെ കർത്താവായ യേശുവിന്റെ സുവിശേഷം
  alternative: നമ്മുടെ കർത്താവായ യേശുവിനെക്കുറിച്ചുള്ള സുവിശേഷം
  rationale: ജനിറ്റീവ് ഉടമസ്ഥതയോ ഉറവിടമോ വിഷയമോ സൂചിപ്പിക്കാമെന്ന ചെറിയ അർഥവ്യാപ്തി വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ ‘യേശുവിന്റെ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള, എന്നാൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ശൈലി. വാക്യം 7-ൽ ആരംഭിക്കുന്ന ദീർഘവാക്യത്തിന്റെ തുടർച്ചയായതിനാൽ അവസാനത്തിൽ പൂർണവിരാമത്തിനു പകരം അർധവിരാമസദൃശമായ തുടർച്ചാഭാവം നിലനിർത്താൻ കോമ ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
