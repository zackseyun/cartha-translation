id: 2TH.1.7
reference: 2 Thessalonians 1:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὑμῖν τοῖς θλιβομένοις ἄνεσιν μεθ’ ἡμῶν ἐν τῇ ἀποκαλύψει τοῦ κυρίου Ἰησοῦ ἀπ’ οὐρανοῦ μετ’ ἀγγέλων δυνάμεως αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/007.yaml
  text: and to you who are being afflicted[a], relief with us at the revelation of the Lord Jesus from heaven with his mighty angels.
translation:
  language: ml
  text: പീഡിപ്പിക്കപ്പെടുന്ന നിങ്ങൾക്കാകട്ടെ, ഞങ്ങളോടൊപ്പം ആശ്വാസവും—കർത്താവായ യേശു തന്റെ ശക്തിയുടെ ദൂതന്മാരോടുകൂടെ[a] സ്വർഗത്തിൽനിന്ന് വെളിപ്പെടുമ്പോൾ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, കൂടുതൽ സ്വാഭാവികമായി: “തന്റെ ശക്തരായ ദൂതന്മാരോടുകൂടെ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: θλιβομένοις
  choice: പീഡിപ്പിക്കപ്പെടുന്ന
  rationale: വർത്തമാനകാല നിഷ്ക്രിയ കൃദന്തരൂപം ഇപ്പോൾ മറ്റുള്ളവരാൽ പീഡനത്തിനോ ഞെരുക്കത്തിനോ വിധേയരാകുന്നവരെ സൂചിപ്പിക്കുന്നു; നിഷ്ക്രിയഭാവം നിലനിർത്തുന്നു.
- source_word: ἄνεσιν
  choice: ആശ്വാസം
  rationale: ഞെരുക്കത്തിൽനിന്നുള്ള വിടുതലോ അയവോ ആണ് സന്ദർഭത്തിലെ ആശയം. സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ ‘ആശ്വാസം’ ഈ വിരുദ്ധത വ്യക്തമാക്കുന്നു.
- source_word: μεθ’ ἡμῶν
  choice: ഞങ്ങളോടൊപ്പം
  rationale: μετάയുടെ സഹവർത്തിത്വഭാവം നേരിട്ട് നിലനിർത്തുകയും പൗലോസും സഹപ്രവർത്തകരും അതേ ആശ്വാസത്തിൽ പങ്കുചേരുമെന്ന ആശയം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ἐν τῇ ἀποκαλύψει
  choice: വെളിപ്പെടുമ്പോൾ
  rationale: സംഭവസൂചക നാമത്തോടുള്ള ἐν ഇവിടെ സമയബന്ധം പ്രകടിപ്പിക്കുന്നു. മലയാളത്തിൽ ക്രിയാരൂപം ഉപയോഗിക്കുന്നത് അർഥം സ്വാഭാവികമായി കൈമാറുന്നു.
- source_word: ἀποκαλύψει
  choice: വെളിപ്പെടുമ്പോൾ
  rationale: ἀποκάλυψις മറഞ്ഞിരുന്നത് വെളിവാകുന്ന സംഭവത്തെ സൂചിപ്പിക്കുന്നു; ‘വെളിപ്പെടുക’ അതിന്റെ അന്ത്യകാലപരമായ ഭാരം നിലനിർത്തുന്നു.
- source_word: κυρίου
  choice: കർത്താവായ
  rationale: κύριος എന്ന സ്ഥാനപ്പേരിന്റെ സ്ഥാപിതവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: ἀπ’ οὐρανοῦ
  choice: സ്വർഗത്തിൽനിന്ന്
  rationale: ἀπό സൂചിപ്പിക്കുന്ന ഉറവിടം അഥവാ പുറപ്പെടുന്ന സ്ഥലം നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: μετ’ ἀγγέλων δυνάμεως αὐτοῦ
  choice: തന്റെ ശക്തിയുടെ ദൂതന്മാരോടുകൂടെ
  rationale: ‘അവന്റെ ശക്തിയുടെ ദൂതന്മാർ’ എന്ന ഗ്രീക്ക് ഷഷ്ഠീവ്യാകരണ ഘടന നിലനിർത്തി, ദൂതന്മാർ ശക്തരാണെന്നോ അവന്റെ ശക്തിയുമായി ബന്ധപ്പെട്ടവരാണെന്നോ ഉള്ള സൂക്ഷ്മമായ അനിശ്ചിതത്വം തീർപ്പാക്കാതെ വിടുന്നു.
theological_decisions:
- issue: ἀγγέλων δυνάμεως αὐτοῦ എന്ന ഷഷ്ഠീഘടനയുടെ അർഥം
  choice: തന്റെ ശക്തിയുടെ ദൂതന്മാരോടുകൂടെ
  alternative: തന്റെ ശക്തരായ ദൂതന്മാരോടുകൂടെ
  rationale: ഗ്രീക്ക് പ്രയോഗം ചുരുക്കമുള്ളതും ഒന്നിലധികം സൂക്ഷ്മതകൾ അനുവദിക്കുന്നതുമാണ്. മുഖ്യപാഠം ബന്ധഘടന നിലനിർത്തുന്നു; കൂടുതൽ സ്വാഭാവികമായ ഗുണവിശേഷണ വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ἐν τῇ ἀποκαλύψει എന്നതിന്റെ കാലസൂചകഭാവം
  choice: വെളിപ്പെടുമ്പോൾ
  alternative: വെളിപ്പാടിൽ
  rationale: വാഗ്ദത്ത ആശ്വാസം യേശുവിന്റെ വെളിപ്പെടലോടു സമയപരമായി ബന്ധിപ്പിക്കുന്നതാണ് സന്ദർഭം. മലയാളത്തിലെ കാലസൂചക ഉപവാക്യം ഇത് വ്യക്തമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഈ വാക്യം മുൻവാക്യത്തിലെ പ്രതിഫലനഘടന തുടരുന്നതിനാൽ മൂലപാഠത്തിലെ അപൂർണവാക്യസ്വഭാവം ദീർഘവിരാമത്തിലൂടെ നിലനിർത്തി; മലയാളത്തിൽ ഇല്ലാത്ത പ്രധാന ക്രിയ ചേർത്തിട്ടില്ല.
