id: 2TH.1.2
reference: 2 Thessalonians 1:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ ⸀πατρὸς καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a].
translation:
  language: ml
  text: പിതാവായ ദൈവത്തിൽനിന്നും കർത്താവും മശീഹയുമായ യേശുവിൽനിന്നും നിങ്ങൾക്കു കൃപയും സമാധാനവും ഉണ്ടാകട്ടെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘കർത്താവായ യേശുക്രിസ്തുവിൽനിന്നും.’ ഗ്രീക്കിലെ Χριστός എന്ന സ്ഥാനനാമം ‘ക്രിസ്തു’ എന്നും ‘മശീഹ’ എന്നും പരിഭാഷപ്പെടുത്താം; ഇവിടെ അതിന്റെ അർഥം വ്യക്തമാക്കാൻ ‘മശീഹ’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: കൃപ
  rationale: പൗലോസിന്റെ അഭിവാദനത്തിൽ ആശംസാസ്വഭാവവും ദൈവശാസ്ത്രപരമായ ഗൗരവവും ഒരുപോലെ നിലനിർത്തുന്ന സ്ഥാപിതവും സ്വാഭാവികവുമായ മലയാളപദം.
- source_word: ὑμῖν
  choice: നിങ്ങൾക്കു
  rationale: ആശംസയുടെ സ്വീകർത്താക്കളെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് സമ്പ്രദാനവിഭക്തിക്ക് സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: εἰρήνη
  choice: സമാധാനം
  rationale: ശാന്തി, സൗഖ്യം, സമഗ്രക്ഷേമം എന്നീ ആശയവ്യാപ്തി ഉൾക്കൊള്ളാൻ കഴിയുന്ന സ്ഥാപിതമായ പരിഭാഷ.
- source_word: ἀπὸ
  choice: …യിൽനിന്നും
  rationale: കൃപയുടെയും സമാധാനത്തിന്റെയും ഉറവിടം സൂചിപ്പിക്കുന്നതിന് മലയാളത്തിൽ സ്വാഭാവികമായ രൂപം; സംയുക്തമായ രണ്ടു ഉറവിടപദങ്ങളോടും വ്യക്തതയ്ക്കായി ആവർത്തിച്ചു.
- source_word: θεοῦ πατρὸς
  choice: പിതാവായ ദൈവം
  rationale: അച്ചടിച്ച ഗ്രീക്ക് പാഠത്തിൽ ἡμῶν (‘നമ്മുടെ’) ഇല്ലാത്തതിനാൽ അത് ചേർക്കാതെ, പിതാവ് എന്ന വിശേഷണബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: κυρίου
  choice: കർത്താവ്
  rationale: κύριος എന്ന സ്ഥാനനാമത്തിന്റെ അധികാരപരവും സ്ഥാപിതവുമായ പുതിയനിയമ പ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: Ἰησοῦ Χριστοῦ
  choice: മശീഹയായ യേശു
  rationale: Χριστός എന്നത് ഇവിടെ സ്ഥാനനാമമായി ഗ്രഹിക്കാവുന്നതിനാൽ അതിന്റെ അർഥം വ്യക്തമാക്കുന്ന ‘മശീഹ’ ഉപയോഗിച്ചു; മുഴുവൻ വാക്യത്തിൽ ‘കർത്താവും മശീഹയുമായ യേശു’ എന്ന സ്വാഭാവിക രൂപമാക്കി.
theological_decisions:
- issue: അച്ചടിച്ച ഗ്രീക്ക് പാഠത്തിൽ ഇല്ലാത്ത ‘നമ്മുടെ’ എന്ന പദം ‘പിതാവ്’ എന്നതിനോടൊപ്പം ചേർക്കണമോ
  choice: ‘പിതാവായ ദൈവം’ എന്നു പരിഭാഷപ്പെടുത്തി ‘നമ്മുടെ’ ചേർത്തില്ല
  alternative: ‘നമ്മുടെ പിതാവായ ദൈവം’
  rationale: പൗലോസിന്റെ സമാന അഭിവാദനങ്ങളിൽ ‘നമ്മുടെ’ സാധാരണമാണെങ്കിലും, ഈ പാഠത്തിൽ ἡμῶν ഇല്ല. മലയാളത്തിൽ അധികപദം ചേർക്കാതെയും ബന്ധം സ്വാഭാവികമായി പറയാനാകുന്നതിനാൽ മൂലപാഠത്തിന്റെ സവിശേഷത നിലനിർത്തി.
- issue: Χριστός എന്ന സ്ഥാനനാമത്തിന്റെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ‘മശീഹ’ അഭിഷിക്തനായ വാഗ്ദത്ത രാജാവ് എന്ന സ്ഥാനനാമത്തിന്റെ അർഥം തുറന്നുകാട്ടുന്നു; പതിവായ ‘ക്രിസ്തു’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- issue: മൂലപാഠത്തിലെ ക്രിയാരഹിത ആശംസ മലയാളത്തിൽ എങ്ങനെ നൽകണം
  choice: ‘ഉണ്ടാകട്ടെ’ ചേർത്ത് ആശംസാവാക്യമാക്കി
  alternative: ‘നിങ്ങൾക്കു കൃപയും സമാധാനവും’ എന്ന ക്രിയാരഹിത രൂപം
  rationale: ഗ്രീക്കിലെ ആശംസാഭാവം മാറ്റാതെ, സാധാരണ ആധുനിക മലയാളത്തിൽ പൂർണവും സ്വാഭാവികവുമായ വാക്യം നൽകുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സഭാപാരമ്പര്യപദങ്ങൾ പരിചയമുള്ള സാധാരണ വായനക്കാർക്കും എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്ക് വാക്യത്തിന്റെ ആശംസാസ്വഭാവം നിലനിർത്താൻ ‘ഉണ്ടാകട്ടെ’ ചേർത്തു. പാഠത്തിൽ ഇല്ലാത്ത ‘നമ്മുടെ’ ഒഴിവാക്കി; എന്നാൽ ‘പിതാവായ ദൈവം’ എന്ന പ്രയോഗത്തിലൂടെ മലയാളത്തിന്റെ സ്വാഭാവികത സംരക്ഷിച്ചു.
