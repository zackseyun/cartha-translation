id: 2TH.1.11
reference: 2 Thessalonians 1:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰς ὃ καὶ προσευχόμεθα πάντοτε περὶ ὑμῶν, ἵνα ὑμᾶς ἀξιώσῃ τῆς κλήσεως ὁ θεὸς ἡμῶν καὶ πληρώσῃ πᾶσαν εὐδοκίαν ἀγαθωσύνης καὶ ἔργον πίστεως ἐν δυνάμει,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/011.yaml
  text: To this end also we always pray for you[a], that our God may count you worthy of the calling and may fulfill every good resolve and work of faith with power[c][b],
translation:
  language: ml
  text: 'ഈ ലക്ഷ്യത്തിനായിത്തന്നെ ഞങ്ങൾ നിങ്ങൾക്കുവേണ്ടി എപ്പോഴും പ്രാർഥിക്കുന്നു: നമ്മുടെ ദൈവം നിങ്ങളെ ആ വിളിക്കു യോഗ്യരായി കണക്കാക്കുകയും[a] നന്മയ്ക്കായുള്ള എല്ലാ തീരുമാനവും[b] വിശ്വാസത്തിന്റെ പ്രവൃത്തിയും[c] ശക്തിയോടെ പൂർത്തിയാക്കുകയും ചെയ്യട്ടെ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ആ വിളിക്കു യോഗ്യരാക്കുകയും.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘യോഗ്യരായി കണക്കാക്കുക’ എന്നും ‘യോഗ്യരാക്കുക’ എന്നും അർഥമാകാം.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, ‘നന്മയുടെ എല്ലാ ഉദ്ദേശ്യവും’ അല്ലെങ്കിൽ ‘നന്മ ചെയ്യാനുള്ള എല്ലാ തീരുമാനവും.’
    reason: lexical_alternative
  - marker: c
    text: ‘വിശ്വാസത്തിന്റെ പ്രവൃത്തി’ എന്നത് ‘വിശ്വാസം ഉളവാക്കുന്ന പ്രവൃത്തി’ എന്നും മനസ്സിലാക്കാം; സന്ദർഭത്തിൽ ‘വിശ്വാസം’ എന്നതിന് ‘വിശ്വസ്തത’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ὃ καὶ
  choice: ഈ ലക്ഷ്യത്തിനായിത്തന്നെ
  rationale: മുൻവാക്യത്തിലെ ആശയത്തിലേക്കു തിരിച്ചുചൂണ്ടുന്ന പ്രയോഗത്തിന്റെ ലക്ഷ്യാർഥവും καὶ നൽകുന്ന ഊന്നലും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: προσευχόμεθα πάντοτε περὶ ὑμῶν
  choice: ഞങ്ങൾ നിങ്ങൾക്കുവേണ്ടി എപ്പോഴും പ്രാർഥിക്കുന്നു
  rationale: തുടർച്ചയായ പതിവുപ്രവൃത്തിയും περὶ ὑμῶν എന്നതിന്റെ സ്വാഭാവിക അർഥവും വ്യക്തമാക്കുന്നു.
- source_word: ἀξιώσῃ
  choice: യോഗ്യരായി കണക്കാക്കുകയും
  rationale: ക്രിയയുടെ ‘യോഗ്യരെന്നു കരുതുക’ എന്ന വിലയിരുത്തൽസാധ്യത പ്രധാനപാഠത്തിൽ സൂക്ഷിക്കുന്നു; ‘യോഗ്യരാക്കുക’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: τῆς κλήσεως
  choice: ആ വിളിക്കു
  rationale: മൂലത്തിൽ ഉടമസ്ഥസർവനാമമില്ല; നിർദിഷ്ടലേഖനം സൂചിപ്പിക്കുന്ന, മുമ്പേ അറിയപ്പെടുന്ന വിളിയെ ‘ആ വിളി’ എന്നു നൽകുന്നു.
- source_word: πληρώσῃ
  choice: പൂർത്തിയാക്കുകയും ചെയ്യട്ടെ
  rationale: അനന്തരമുള്ള രണ്ടു കർമങ്ങളെയും ദൈവം പൂർണസാഫല്യത്തിലെത്തിക്കണമെന്ന പ്രാർഥനാഭാവം പ്രകടമാക്കുന്നു.
- source_word: πᾶσαν εὐδοκίαν ἀγαθωσύνης
  choice: നന്മയ്ക്കായുള്ള എല്ലാ തീരുമാനവും
  rationale: εὐδοκίαയുടെ ഉദ്ദേശ്യം/ദൃഢനിശ്ചയം എന്ന അർഥവും ἀγαθωσύνηςന്റെ നന്മ എന്ന ആശയവും സ്വാഭാവികമായി സൂക്ഷിക്കുന്നു.
- source_word: ἔργον πίστεως
  choice: വിശ്വാസത്തിന്റെ പ്രവൃത്തിയും
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്ത ജനിറ്റീവ് ബന്ധം തുറന്ന നിലയിൽ സൂക്ഷിക്കുന്നു; വിശ്വാസത്തിൽനിന്നു ജനിക്കുന്ന പ്രവൃത്തി എന്ന സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐν δυνάμει
  choice: ശക്തിയോടെ
  rationale: ദൈവം ഈ ഉദ്ദേശ്യവും പ്രവൃത്തിയും ശക്തിപൂർവം പൂർത്തിയാക്കുന്നു എന്ന ഉപാധി/വിധി സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: ἀξιώσῃ എന്ന ക്രിയയും ദൈവവിളിയോടുള്ള യോഗ്യതയും
  choice: യോഗ്യരായി കണക്കാക്കുക
  alternative: യോഗ്യരാക്കുക
  rationale: മനുഷ്യർ സ്വന്തം യോഗ്യത സമ്പാദിക്കുന്നു എന്ന ആശയം ചേർക്കാതെ ക്രിയയുടെ വിലയിരുത്തൽസാധ്യത നിലനിർത്തുന്നു; അതേസമയം ദൈവം യോഗ്യരാക്കുന്നു എന്ന കാരണാത്മകസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: ἔργον πίστεως എന്നതിലെ πίστις
  choice: വിശ്വാസത്തിന്റെ പ്രവൃത്തി
  alternative: വിശ്വാസം ഉളവാക്കുന്ന പ്രവൃത്തി; വിശ്വസ്തതയുടെ പ്രവൃത്തി
  rationale: ‘വിശ്വാസം’ എന്ന അടിസ്ഥാനാർഥവും ഗ്രീക്കിലെ ജനിറ്റീവിന്റെ അവ്യക്തതയും പ്രധാനപാഠത്തിൽ നിലനിർത്തി മറ്റു സാധ്യമായ ബന്ധങ്ങളും അർഥവും അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: εὐδοκία ἀγαθωσύνης എന്ന ബന്ധം
  choice: നന്മയ്ക്കായുള്ള തീരുമാനം
  alternative: നന്മയുടെ ഉദ്ദേശ്യം; നന്മ ചെയ്യാനുള്ള തീരുമാനം
  rationale: മൂലപദബന്ധം ഉദ്ദേശ്യം, നന്മയാൽ വിശേഷിപ്പിക്കപ്പെട്ട തീരുമാനം, അല്ലെങ്കിൽ നന്മ ലക്ഷ്യമാക്കുന്ന തീരുമാനം എന്നിങ്ങനെ ഗ്രഹിക്കാവുന്നതാണ്; പ്രധാനപാഠം വായനാസൗകര്യത്തോടെ ഒരു സാധ്യത സ്വീകരിക്കുകയും മറ്റുള്ളവ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. പ്രാർഥനയുടെ ലക്ഷ്യവും ആശംസാഭാവവും വ്യക്തമാക്കാൻ ദ്വിബിന്ദുവും ‘ചെയ്യട്ടെ’ എന്ന രൂപവും ഉപയോഗിച്ചു. മൂലത്തിലെ ദൈവശാസ്ത്രപരവും വ്യാകരണപരവുമായ അവ്യക്തതകൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
