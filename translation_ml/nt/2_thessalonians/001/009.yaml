review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the future judicial penalty (δίκην τίσουσιν), ‘eternal destruction’ (ὄλεθρον αἰώνιον), and retains the significant alternative source/origin sense of ἀπό in a footnote. However, ‘അകറ്റപ്പെട്ട്’ adds a passive expulsion/excluding action not explicitly expressed by the Greek. A wording with ‘അകന്ന്’ preserves the separation reading without adding that nuance.
  naturalness: The revised sentence is natural, clear modern standard Malayalam. ‘മഹിമ’ is the more customary and idiomatic equivalent for δόξα in this elevated biblical register.
  terminology: ‘കർത്താവ്,’ ‘സന്നിധി,’ ‘നിത്യനാശം,’ ‘ശിക്ഷ,’ and ‘മഹിമ’ appropriately preserve the legal, eschatological, and theophanic register. The wording does not decide the doctrinal nature of destruction.
  issues:
  - severity: low
    issue: The participle ‘അകറ്റപ്പെട്ട്’ introduces an explicit passive exclusion action.
    rationale: The Greek ἀπό can support separation, but it does not specify an agentive act of driving away. ‘അകന്ന്’ expresses the chosen separation reading more directly and with less added interpretation.
  - severity: low
    issue: ‘മഹത്ത്വം’ is possible but less standard here than ‘മഹിമ’ for δόξα.
    rationale: ‘മഹിമ’ is a natural, established Malayalam biblical-register term for divine glory and reads more smoothly in this phrase.
