revisions:
- from: അവർ നിത്യനാശം എന്ന ശിക്ഷ അനുഭവിക്കും[a]—കർത്താവിന്റെ സന്നിധിയിൽനിന്നും അവിടുത്തെ ശക്തിയുടെ മഹത്ത്വത്തിൽനിന്നും അകറ്റപ്പെട്ട്.
  to: അവർ കർത്താവിന്റെ സന്നിധിയിൽനിന്നും അവിടുത്തെ ശക്തിയുടെ മഹിമയിൽനിന്നും അകന്ന് നിത്യനാശമെന്ന ശിക്ഷ അനുഭവിക്കും[a].
  rationale: The revision removes the added passive nuance of expulsion while maintaining the main separation reading of ἀπό. It also uses ‘മഹിമ’ for divine glory and updates the footnote to match the revised wording. The alternative source/origin reading remains explicitly preserved, and no interpretation is imposed concerning the precise nature of eternal destruction.
