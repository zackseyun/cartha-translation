id: 2TH.1.9
reference: 2 Thessalonians 1:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἵτινες δίκην τίσουσιν ὄλεθρον αἰώνιον ἀπὸ προσώπου τοῦ κυρίου καὶ ἀπὸ τῆς δόξης τῆς ἰσχύος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/009.yaml
  text: These will pay the penalty of eternal destruction[a], away from the presence of the Lord and from the glory of his might,
translation:
  language: ml
  text: അവർ കർത്താവിന്റെ സന്നിധിയിൽനിന്നും അവിടുത്തെ ശക്തിയുടെ മഹിമയിൽനിന്നും അകന്ന് നിത്യനാശമെന്ന ശിക്ഷ അനുഭവിക്കും[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “കർത്താവിന്റെ സന്നിധിയിൽനിന്നും അവിടുത്തെ ശക്തിയുടെ മഹിമയിൽനിന്നും വരുന്ന നിത്യനാശമെന്ന ശിക്ഷ അവർ അനുഭവിക്കും.” ഗ്രീക്കിലെ പൂർവപ്രത്യയം വേർപാടിനെയോ (“...ൽനിന്ന് അകന്ന്”) ഉറവിടത്തെയോ (“...ൽനിന്ന് വരുന്ന”) സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: οἵτινες
  choice: അവർ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞവരെ സ്വാഭാവികമായി തിരിച്ചുസൂചിപ്പിക്കുന്നു; ഗ്രീക്കിലെ ബന്ധക-ഗുണസൂചനയെ അനാവശ്യമായി വികസിപ്പിക്കുന്നില്ല.
- source_word: δίκην τίσουσιν
  choice: ശിക്ഷ അനുഭവിക്കും
  rationale: ന്യായവിധിപരമായ ശിക്ഷ ഏറ്റുവാങ്ങുക എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὄλεθρον αἰώνιον
  choice: നിത്യനാശം
  rationale: വിധിയുടെ കഠിനതയും അന്തിമസ്വഭാവവും നിലനിർത്തുന്നു; നാശത്തിന്റെ കൃത്യമായ സ്വഭാവത്തെക്കുറിച്ചുള്ള പ്രത്യേക സിദ്ധാന്തം ചേർക്കുന്നില്ല.
- source_word: ἀπὸ προσώπου τοῦ κυρίου
  choice: കർത്താവിന്റെ സന്നിധിയിൽനിന്നും അകറ്റപ്പെട്ട്
  rationale: πρόσωπον ഇവിടെ സാന്നിധ്യം എന്ന അർഥത്തിൽ; ἀπόയെ പ്രധാനവായനയിൽ വേർപാട്/ഒഴിവാക്കൽ എന്ന നിലയിൽ വ്യക്തമാക്കുന്നു.
- source_word: καὶ ἀπὸ τῆς δόξης τῆς ἰσχύος αὐτοῦ
  choice: അവിടുത്തെ ശക്തിയുടെ മഹത്ത്വത്തിൽനിന്നും
  rationale: δόξα എന്നതിന് സ്വാഭാവികമായ ‘മഹത്ത്വം’, ἰσχύς എന്നതിന് ‘ശക്തി’; അവിടുത്തെ ശക്തിക്കുള്ളതോ അതിനെ വെളിപ്പെടുത്തുന്നതോ ആയ മഹത്ത്വം എന്ന ബന്ധം നിലനിർത്തുന്നു.
theological_decisions:
- issue: അന്തിമവിധിയുടെ സന്ദർഭത്തിൽ ἀπό എന്നതിന്റെ അർഥം
  choice: 'വേർപാട്/ഒഴിവാക്കൽ: ‘കർത്താവിന്റെ സന്നിധിയിൽനിന്നും ... അകറ്റപ്പെട്ട്’'
  alternative: 'ഉറവിടം: കർത്താവിന്റെ സന്നിധിയിൽനിന്നും അവിടുത്തെ ശക്തിയുടെ മഹത്ത്വത്തിൽനിന്നും വരുന്ന നാശം'
  rationale: ἀπό വേർപാടിനെയും ഉറവിടത്തെയും സൂചിപ്പിക്കാം. സന്ദർഭത്തിൽ വേർപാട് ശക്തമായ പ്രധാനവായനയാണെങ്കിലും, വ്യാകരണപരമായി സാധ്യവും വ്യാഖ്യാനപരമായി പ്രാധാന്യമുള്ളതുമായ ഉറവിടവായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: ‘നിത്യനാശം’ എന്നതിന്റെ സിദ്ധാന്തപരമായ വ്യാപ്തി
  choice: നാശത്തിന്റെ കൃത്യമായ രീതി നിർവചിക്കാതെ ‘നിത്യനാശം’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: സമ്പൂർണ ഇല്ലായ്മയെന്നോ നിത്യബോധപൂർവ ശിക്ഷയെന്നോ പ്രത്യേകം വ്യാഖ്യാനിക്കുക
  rationale: ഗ്രീക്ക് വാക്യഭാഗം ശിക്ഷയെ പ്രസ്താവിക്കുന്നുവെങ്കിലും അന്തിമശിക്ഷയുടെ കൃത്യസ്വഭാവത്തെക്കുറിച്ചുള്ള വിശാലമായ സിദ്ധാന്തവിവാദം ഒറ്റയ്ക്ക് തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. വിധിയുടെ നിയമപരമായ ഭാവവും വാക്യത്തിന്റെ ഗൗരവവും നിലനിർത്തിയിട്ടുണ്ട്; ദുഷ്കരമായ ἀπό പ്രയോഗത്തിലെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
