source:
  edition: SBLGNT
  text: Εὐχαριστεῖν ὀφείλομεν τῷ θεῷ πάντοτε περὶ ὑμῶν, ἀδελφοί, καθὼς ἄξιόν ἐστιν, ὅτι ὑπεραυξάνει ἡ πίστις ὑμῶν καὶ πλεονάζει ἡ ἀγάπη ἑνὸς ἑκάστου πάντων ὑμῶν εἰς ἀλλήλους,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/003.yaml
  text: We ought always to give thanks to God for you[a], brothers, as is fitting, because your faith is growing abundantly and the love of each and every one of you for one another is increasing[c][b],
translation:
  language: ml
  text: സഹോദരന്മാരേ[a], നിങ്ങൾക്കുവേണ്ടി ഞങ്ങൾ എപ്പോഴും ദൈവത്തിനു നന്ദി പറയേണ്ടവരാണ്, അങ്ങനെ ചെയ്യുന്നത് ഉചിതവുമാണ്; കാരണം, നിങ്ങളുടെ വിശ്വാസം അത്യധികമായി വളരുകയും നിങ്ങളിൽ ഓരോരുത്തരുടെയും മറ്റുള്ളവരോടുള്ള സ്നേഹം വർധിച്ചുവരുകയും ചെയ്യുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സഹോദരീസഹോദരന്മാരേ”; ഗ്രീക്കിൽ “സഹോദരന്മാർ” എന്നാണ്, എന്നാൽ മുഴുവൻ വിശ്വാസിസമൂഹത്തെയും ഉൾപ്പെടുത്തി ഈ പദം ഉപയോഗിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “വിശ്വാസം” എന്നതിന് “വിശ്വസ്തത” അല്ലെങ്കിൽ “ആശ്രയം” എന്ന അർഥവും വരാം.
    reason: alternative_reading
lexical_decisions:
- source_word: Εὐχαριστεῖν ὀφείλομεν
  choice: നന്ദി പറയാൻ ഞങ്ങൾ കടപ്പെട്ടിരിക്കുന്നു
  rationale: കൃതജ്ഞത അർപ്പിക്കാനുള്ള ധാർമിക ബാധ്യത എന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; കേവല അനിവാര്യതയായി അതിശക്തമാക്കുന്നില്ല.
- source_word: πάντοτε περὶ ὑμῶν
  choice: നിങ്ങൾക്കുവേണ്ടി എപ്പോഴും
  rationale: നന്ദിപ്രകടനത്തിന്റെ സന്ദർഭത്തിൽ περί എന്നതിന്റെ സ്വാഭാവിക അർഥം ‘വേണ്ടി’ എന്നാണ്; πάντοτε-യുടെ കാലസൂചനയും വ്യക്തമായി സൂക്ഷിക്കുന്നു.
- source_word: ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചന സംബോധന നേരിട്ട് നിലനിർത്തുന്നു; വിശ്വാസിസമൂഹത്തിലെ സ്ത്രീകളെയും ഉൾക്കൊള്ളാവുന്ന പ്രയോഗമാണെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: καθὼς ἄξιόν ἐστιν
  choice: അങ്ങനെ ചെയ്യുന്നത് ഉചിതമാണ്
  rationale: പ്രവൃത്തിയുടെ യുക്തിയും ഔചിത്യവും വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളം; ‘യോഗ്യമാണ്’ എന്നതിലൂടെ ഉണ്ടാകാവുന്ന അർഥവ്യതിയാനം ഒഴിവാക്കുന്നു.
- source_word: ὑπεραυξάνει ἡ πίστις ὑμῶν
  choice: നിങ്ങളുടെ വിശ്വാസം അത്യധികമായി വളരുന്നു
  rationale: ὑπεραυξάνει എന്ന ശക്തീകരിച്ച വളർച്ചാഭാവം ‘അത്യധികമായി’ എന്നതിലൂടെ നിലനിർത്തുന്നു; πίστις-ന് സന്ദർഭോചിതമായ പ്രാഥമിക പരിഭാഷ ‘വിശ്വാസം’ ആണ്.
- source_word: πλεονάζει ἡ ἀγάπη
  choice: സ്നേഹം വർധിച്ചുവരുന്നു
  rationale: തുടർച്ചയായ വർധനയെ സ്വാഭാവികമായ വർത്തമാനകാല മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἑνὸς ἑκάστου πάντων ὑμῶν εἰς ἀλλήλους
  choice: നിങ്ങൾ ഓരോരുത്തർക്കും പരസ്പരമുള്ള
  rationale: ഓരോ വ്യക്തിയെയും ഉൾക്കൊള്ളുന്ന ഗ്രീക്ക് ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായി സൂക്ഷിക്കുകയും εἰς ἀλλήλους-ന്റെ പരസ്പരബന്ധം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: πίστις എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: വിശ്വാസം
  alternative: വിശ്വസ്തത; ആശ്രയം
  rationale: ഈ സന്ദർഭത്തിൽ തെസ്സലൊനീക്യരുടെ വളരുന്ന വിശ്വാസമാണ് ഏറ്റവും സ്വാഭാവികമായ അർഥം. എങ്കിലും പദത്തിന്റെ അർഥപരിധിയിൽ വിശ്വസ്തതയും ആശ്രയവും ഉൾപ്പെടുന്നതിനാൽ ബദൽ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: മിശ്രലിംഗ വിശ്വാസിസമൂഹത്തോടുള്ള ἀδελφοί എന്ന സംബോധന
  choice: സഹോദരന്മാരേ
  alternative: സഹോദരീസഹോദരന്മാരേ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചനം മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു; മുഴുവൻ വിശ്വാസിസമൂഹത്തെയും ഉൾപ്പെടുത്തി ഉപയോഗിക്കാവുന്ന പ്രതിനിധാനശക്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിലെ ദൈർഘ്യം നിയന്ത്രിക്കാൻ അർദ്ധവിരാമം ഉപയോഗിച്ചെങ്കിലും കാരണം–ഫലം ബന്ധവും നന്ദിപ്രകടനത്തിന്റെ ഏകതയും നിലനിർത്തിയിരിക്കുന്നു.
