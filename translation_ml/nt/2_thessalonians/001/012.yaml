- from: നമ്മുടെ കർത്താവായ യേശുവിന്റെ നാമം നിങ്ങളിൽ[a] മഹത്ത്വപ്പെടാനും നിങ്ങൾ അവനിൽ മഹത്ത്വപ്പെടാനും—നമ്മുടെ ദൈവവും കർത്താവുമായ യേശുമശീഹയുടെ കൃപയ്ക്കൊത്തവിധം—വേണ്ടിയാണിത്.[b][c]
  to: നമ്മുടെ കർത്താവായ യേശുവിന്റെ നാമം നിങ്ങളിൽ[a] മഹത്ത്വപ്പെടുകയും നിങ്ങൾ അവനിൽ മഹത്ത്വപ്പെടുകയും ചെയ്യേണ്ടതിന്, നമ്മുടെ ദൈവത്തിന്റെയും കർത്താവായ യേശു മശീഹയുടെയും കൃപപ്രകാരം.[b][c]
