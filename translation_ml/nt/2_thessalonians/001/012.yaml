id: 2TH.1.12
reference: 2 Thessalonians 1:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅπως ἐνδοξασθῇ τὸ ὄνομα τοῦ κυρίου ἡμῶν Ἰησοῦ ἐν ὑμῖν, καὶ ὑμεῖς ἐν αὐτῷ, κατὰ τὴν χάριν τοῦ θεοῦ ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/012.yaml
  text: so that the name of our Lord Jesus may be glorified in you[a], and you in him[c][b], according to the grace of our God and the Lord Jesus the Messiah.
translation:
  language: ml
  text: നമ്മുടെ കർത്താവായ യേശുവിന്റെ നാമം നിങ്ങളിൽ[a] മഹത്ത്വപ്പെടുകയും നിങ്ങൾ അവനിൽ മഹത്ത്വപ്പെടുകയും ചെയ്യേണ്ടതിന്, നമ്മുടെ ദൈവത്തിന്റെയും കർത്താവായ യേശു മശീഹയുടെയും കൃപപ്രകാരം.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നിങ്ങളുടെ ഇടയിൽ” എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് ഉപസർഗത്തിന് സന്ദർഭത്തിൽ ഇരു സൂക്ഷ്മാർഥങ്ങളും ഉണ്ടാകാം.
    reason: lexical_alternative
  - marker: b
    text: “മശീഹ” എന്നതിനു പകരം “ക്രിസ്തു” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് സ്ഥാനനാമം Χριστός ആണ്.
    reason: alternative_reading
  - marker: c
    text: അവസാന പദസമുച്ചയം “നമ്മുടെ ദൈവവും കർത്താവുമായ യേശു മശീഹ” എന്ന് ഒരേയൊരു വ്യക്തിയെ അടുത്തായി വിശേഷിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം; അല്ലെങ്കിൽ “നമ്മുടെ ദൈവത്തിന്റെയും കർത്താവായ യേശു മശീഹയുടെയും” എന്ന് രണ്ടു വ്യക്തികളെ സൂചിപ്പിക്കുന്നതായും വായിക്കാം. പരിഭാഷ ഗ്രീക്ക് പദക്രമത്തിന്റെ സംക്ഷിപ്തത നിലനിർത്തി ഈ ചോദ്യം തീർപ്പാക്കുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως
  choice: വേണ്ടിയാണിത്
  rationale: മുൻവാക്യത്തിലെ പ്രാർഥനയിൽനിന്നു വരുന്ന ഉദ്ദേശ്യവും ഫലവും സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ വാക്യാന്ത്യത്തിലെ ഈ പ്രയോഗം സ്വാഭാവികമാണ്.
- source_word: ἐνδοξασθῇ
  choice: മഹത്ത്വപ്പെടാനും
  rationale: പാസീവ് ഭാവവും δοξ- പദകുടുംബത്തിന്റെ ദൈവശാസ്ത്രപരമായ ഭാരവും നിലനിർത്തുന്നു.
- source_word: τὸ ὄνομα
  choice: നാമം
  rationale: വ്യക്തിയുടെ വെളിപ്പെട്ട സ്വത്വത്തെയും കീർത്തിയെയും സൂചിപ്പിക്കാവുന്ന ബൈബിൾപ്രയോഗം വ്യാഖ്യാനിച്ച് മാറ്റാതെ അതേപടി നിലനിർത്തുന്നു.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: നമ്മുടെ കർത്താവായ യേശുവിന്റെ
  rationale: ഉടമസ്ഥതയും κύριος എന്ന സ്ഥാനനാമവും സ്വാഭാവികമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἐν ὑμῖν
  choice: നിങ്ങളിൽ
  rationale: ἐν എന്നതിന്റെ അടിസ്ഥാനരൂപം സംരക്ഷിക്കുന്നു; ബഹുവചനസന്ദർഭത്തിൽ ‘നിങ്ങളുടെ ഇടയിൽ’ എന്ന സമൂഹാർഥവും സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: καὶ ὑμεῖς ἐν αὐτῷ
  choice: നിങ്ങൾ അവനിൽ മഹത്ത്വപ്പെടാനും
  rationale: ഗ്രീക്കിൽ രണ്ടാമത്തെ ക്രിയ അധ്യാഹരിച്ചിരിക്കുന്ന സമാന്തരഘടന മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; αὐτῷ സ്വാഭാവികമായി യേശുവിനെ സൂചിപ്പിക്കുന്നു.
- source_word: κατὰ τὴν χάριν
  choice: കൃപയ്ക്കൊത്തവിധം
  rationale: κατά ഇവിടെ മാനദണ്ഡമോ അനുരൂപതയോ സൂചിപ്പിക്കുന്നു; വെറും ഉപകരണമെന്ന അർഥം നിർബന്ധിക്കാതെ അത് പ്രകടമാക്കുന്നു.
- source_word: χάριν
  choice: കൃപ
  rationale: പൗലോസിന്റെ ലേഖനസന്ദർഭത്തിലെ χάρις എന്ന പദത്തിന്റെ സ്ഥിരവും ദൈവശാസ്ത്രപരമായി സമുചിതവുമായ മലയാളരൂപം.
- source_word: τοῦ θεοῦ ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ
  choice: നമ്മുടെ ദൈവവും കർത്താവുമായ യേശുമശീഹയുടെ
  rationale: ഒരു ആർട്ടിക്കിളിന് കീഴിൽ ചേർന്നിരിക്കുന്ന പദസമുച്ചയത്തിന്റെ അടുത്ത ബന്ധം നിലനിർത്തുകയും Χριστός എന്ന സ്ഥാനനാമം ‘മശീഹ’ എന്നു നൽകുകയും ചെയ്യുന്നു; വ്യത്യസ്ത വ്യക്തികളെ സൂചിപ്പിക്കുന്ന വായന അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
theological_decisions:
- issue: Χριστοῦ എന്നതിന്റെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ Χριστός സ്ഥാനനാമമായി പ്രവർത്തിക്കുന്നതിനാൽ അതിന്റെ അർഥം പ്രകടമാക്കുന്ന ‘മശീഹ’ സ്വീകരിച്ചു; സഭാപാരമ്പര്യത്തിൽ പതിഞ്ഞ ‘ക്രിസ്തു’ എന്ന രൂപവും സാധ്യമാണ്.
- issue: αὐτῷ എന്ന സർവനാമത്തിന്റെ സൂചിതൻ
  choice: അവനിൽ—കർത്താവായ യേശുവിൽ
  alternative: അതിൽ—നാമത്തിൽ
  rationale: സർവനാമത്തിന്റെ പുരുഷലിംഗരൂപവും പരസ്പര മഹത്ത്വീകരണഘടനയും യേശുവിലേക്കുള്ള സൂചനയെ ശക്തമായി പിന്തുണയ്ക്കുന്നു; വ്യാകരണപരമായി ‘നാമം’ എന്നതിലേക്കുള്ള മടക്കസൂചന പൂർണമായി അസാധ്യമല്ല.
- issue: അവസാന ജനിറ്റീവ് പദസമുച്ചയത്തിന്റെ ബന്ധം
  choice: ‘നമ്മുടെ ദൈവവും കർത്താവുമായ യേശുമശീഹ’ എന്ന അടുത്ത ബന്ധമുള്ള ഏകപ്രയോഗം
  alternative: ‘നമ്മുടെ ദൈവത്തിന്റെയും കർത്താവായ യേശുമശീഹയുടെയും’ എന്ന രണ്ടു സൂചിതർ
  rationale: θεοῦ-ന് മുമ്പിലുള്ള ഏക ആർട്ടിക്കിളും καί വഴി ചേർക്കപ്പെട്ട κυρίου Ἰησοῦ Χριστοῦ-ഉം വ്യാകരണപരമായി അടുത്ത ബന്ധം സൃഷ്ടിക്കുന്നു. എന്നാൽ ചരിത്രപരമായി മറ്റൊരു വായനയും നിലനിൽക്കുന്നതിനാൽ അടിക്കുറിപ്പിൽ അത് തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മഹത്ത്വപ്പെടുക,’ ‘കൃപ,’ ‘കർത്താവ്,’ ‘നാമം’ എന്നീ പരിചിത ബൈബിൾപദങ്ങൾ നിലനിർത്തി. ഗ്രീക്ക് വാക്യത്തിന്റെ ലക്ഷ്യബന്ധം മലയാളത്തിൽ വ്യക്തമായി വരാൻ ‘വേണ്ടിയാണിത്’ വാക്യാന്ത്യത്തിൽ നൽകി; അവസാന പദസമുച്ചയത്തിലെ ദൈവശാസ്ത്രപരമായ സങ്കീർണത പ്രധാനപാഠത്തിലും അടിക്കുറിപ്പിലും മറച്ചുവെച്ചിട്ടില്ല.
