  terminology: 'Core biblical and theological terminology is consistent and suitable: ‘ദൈവരാജ്യം’ for βασιλεία τοῦ θεοῦ, ‘ന്യായവിധി’ for κρίσις, and ‘യോഗ്യരെന്നു കണക്കാക്കപ്പെടുക’ for passive καταξιόω. The notes offer legitimate lexical and syntactic alternatives without promoting a doctrinally loaded interpretation.'
