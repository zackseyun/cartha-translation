reference: 2 Thessalonians 1:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔνδειγμα τῆς δικαίας κρίσεως τοῦ θεοῦ, εἰς τὸ καταξιωθῆναι ὑμᾶς τῆς βασιλείας τοῦ θεοῦ, ὑπὲρ ἧς καὶ πάσχετε,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/005.yaml
  text: This is evidence of the righteous judgment of God[a], so that you may be counted worthy of the kingdom of God, for which you are also suffering[c][b],
translation:
  language: ml
  text: ഇത് ദൈവത്തിന്റെ നീതിപൂർവമായ ന്യായവിധിയുടെ തെളിവാണ്[a]. ദൈവരാജ്യത്തിന് യോഗ്യരെന്നു നിങ്ങൾ കണക്കാക്കപ്പെടേണ്ടതിനാണ്[b] ഇത്; ആ രാജ്യത്തിനുവേണ്ടി[c] നിങ്ങൾ കഷ്ടം അനുഭവിക്കുകയും ചെയ്യുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തെളിവ്’ എന്നതിന് പകരം ‘സാക്ഷ്യം’, ‘സൂചന’ എന്നുമാകാം.
    reason: lexical_alternative
  - marker: b
    text: ‘യോഗ്യരെന്നു നിങ്ങൾ കണക്കാക്കപ്പെടുന്നതിന്’ എന്നോ ‘ഇതിന്റെ ഫലമായി നിങ്ങൾ യോഗ്യരെന്നു കണക്കാക്കപ്പെടുന്നു’ എന്നോ പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് ഘടന ഉദ്ദേശ്യമോ ഫലമോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
  - marker: c
    text: ‘ആ രാജ്യത്തിന്റെ നിമിത്തം’ എന്നോ ‘ആ രാജ്യത്തിനുവേണ്ടിത്തന്നെ’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔνδειγμα
  choice: തെളിവ്
  rationale: ഒരു യാഥാർഥ്യത്തെ പ്രകടമാക്കുകയോ അതിലേക്കു വിരൽചൂണ്ടുകയോ ചെയ്യുന്ന കാര്യം എന്നാണ് ഇവിടെ അർഥം. ‘തെളിവ്’ എന്നത് അനുമാനാത്മക ശക്തി നിലനിർത്തുന്നു; നിർണായകമായ ‘തീർപ്പ് തെളിയിക്കൽ’ എന്ന അതിശക്തമായ അർഥം നിർബന്ധിക്കുന്നില്ല. ഗ്രീക്കിലെ ക്രിയയില്ലാത്ത വാക്യഖണ്ഡം മുൻവാക്യത്തെ ആശ്രയിക്കുന്നതിനാൽ മലയാളത്തിൽ ‘ഇത് … ആണ്’ എന്നു പൂർത്തിയാക്കി.
- source_word: δικαίας κρίσεως
  choice: നീതിപൂർവമായ ന്യായവിധി
  rationale: ദൈവത്തിന്റെ വിധിയുടെ ധാർമിക നീതിയെ വ്യക്തമായി സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളപ്രയോഗം.
- source_word: εἰς τὸ καταξιωθῆναι
  choice: യോഗ്യരെന്നു നിങ്ങൾ കണക്കാക്കപ്പെടേണ്ടതിനാണ്
  rationale: καταξιόω എന്ന കർമണിപ്രയോഗം ‘യോഗ്യരാക്കുക’ എന്നതിലുപരി ‘യോഗ്യരെന്നു കണക്കാക്കുക/കരുതുക’ എന്നാണ്. εἰς τό + infinitive ഉദ്ദേശ്യമോ ഫലമോ സൂചിപ്പിക്കാവുന്നതിനാൽ മുഖ്യവാചകത്തിൽ ഉദ്ദേശ്യഭാവം നൽകി മറ്റുസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: βασιλείας τοῦ θεοῦ
  choice: ദൈവരാജ്യം
  rationale: മലയാള ബൈബിൾഭാഷയിൽ പരിചിതവും സുതാര്യവുമായ സംയുക്തപദം; ഗ്രീക്കിലെ ‘ദൈവത്തിന്റെ രാജ്യം’ എന്ന ആശയം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: ὑπὲρ ἧς
  choice: ആ രാജ്യത്തിനുവേണ്ടി
  rationale: ὑπέρ + genitive നൽകുന്ന ‘അതിന്റെ നിമിത്തം/അതിനെപ്രതി/അതിന്റെ പക്ഷത്ത്’ എന്ന ഗുണഭോക്തൃ-കാരണബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: καὶ πάσχετε
  choice: നിങ്ങൾ കഷ്ടം അനുഭവിക്കുകയും ചെയ്യുന്നു
  rationale: വർത്തമാനകാലത്തിലെ തുടരുന്ന പീഡാനുഭവം പ്രകടമാക്കുന്നു. καί എന്ന ബന്ധകത്തിന്റെ ‘കൂടി/ചെയ്യുകയും’ എന്ന ചേർക്കൽഭാവവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: കഷ്ടാനുഭവവും ദൈവരാജ്യത്തിന് യോഗ്യരായി കണക്കാക്കപ്പെടുന്നതും തമ്മിലുള്ള ബന്ധം
  choice: അവരുടെ കഷ്ടാനുഭവം ദൈവത്തിന്റെ നീതിപൂർവമായ ന്യായവിധിയുടെ തെളിവായി നിലകൊള്ളുന്നു; അതുമായി ബന്ധപ്പെട്ട ഉദ്ദേശ്യമോ ഫലമോ ആയി അവർ രാജ്യത്തിന് യോഗ്യരെന്നു കണക്കാക്കപ്പെടുന്നു.
  alternative: കഷ്ടാനുഭവം ദൈവരാജ്യത്തിൽ പ്രവേശിക്കാനുള്ള യോഗ്യത സമ്പാദിക്കുകയോ പ്രതിഫലമായി നേടിക്കൊടുക്കുകയോ ചെയ്യുന്നു.
  rationale: കർമണിയായ καταξιωθῆναι ‘യോഗ്യരെന്നു കണക്കാക്കപ്പെടുക’ എന്നാണ്; ‘സ്വഭാവത്തിൽ യോഗ്യരാക്കപ്പെടുക’ എന്നോ ‘യോഗ്യത സമ്പാദിക്കുക’ എന്നോ നിർബന്ധിക്കുന്നില്ല. ഉദ്ദേശ്യം/ഫലം എന്ന വ്യാകരണപരമായ അനിശ്ചിതത്വവും അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി. ‘നീതിപൂർവമായ ന്യായവിധി’, ‘യോഗ്യരെന്നു കണക്കാക്കപ്പെടുക’ എന്നീ പ്രയോഗങ്ങൾ മൂലപാഠത്തിന്റെ നിയമപരവും ദൈവശാസ്ത്രപരവുമായ ഭാവം നിലനിർത്തുന്നു. ഗ്രീക്കിലെ ദീർഘവാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി; ‘ഇത്’ എന്ന ആവർത്തനം ബന്ധം വ്യക്തമാക്കുന്നു.
