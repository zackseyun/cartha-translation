revisions:
- from: അതുകൊണ്ട്, നിങ്ങൾ സഹിച്ചുകൊണ്ടിരിക്കുന്ന എല്ലാ പീഡനങ്ങളുടെയും കഷ്ടതകളുടെയും മധ്യേയുള്ള നിങ്ങളുടെ സഹിഷ്ണുതയെയും വിശ്വാസത്തെയും[a] കുറിച്ച് ദൈവത്തിന്റെ സഭകളിൽ ഞങ്ങൾതന്നെ നിങ്ങളെക്കുറിച്ച് അഭിമാനിക്കുന്നു.
  to: അതുകൊണ്ട്, നിങ്ങൾ സഹിച്ചുകൊണ്ടിരിക്കുന്ന എല്ലാ പീഡനങ്ങളിലും കഷ്ടതകളിലും കാണിക്കുന്ന നിങ്ങളുടെ സഹിഷ്ണുതയും വിശ്വാസവും[a] നിമിത്തം, ദൈവത്തിന്റെ സഭകളിൽ ഞങ്ങൾതന്നെ നിങ്ങളെക്കുറിച്ച് അഭിമാനിക്കുന്നു.
  rationale: വാക്യക്രമം പുനഃസംഘടിപ്പിച്ച് ഗ്രീക്കിലെ ὑπέρ (‘നിമിത്തം’) എന്നും ἐν ὑμῖν (‘നിങ്ങളെക്കുറിച്ച്’) എന്നും വഹിക്കുന്ന വ്യത്യസ്ത ബന്ധങ്ങൾ വ്യക്തമായി നിലനിർത്തി. ‘പീഡനങ്ങളിലും കഷ്ടതകളിലും കാണിക്കുന്ന’ എന്ന പ്രയോഗം സഹിഷ്ണുതയും വിശ്വാസവും പ്രകടമാകുന്ന സാഹചര്യത്തെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു. അർഥത്തിലും അടിക്കുറിപ്പിലെ വ്യാഖ്യാനസാധ്യതയിലും മാറ്റമില്ല.
