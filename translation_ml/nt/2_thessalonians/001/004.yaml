id: 2TH.1.4
reference: 2 Thessalonians 1:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὥστε ⸂αὐτοὺς ἡμᾶς⸃ ἐν ὑμῖν ⸀ἐγκαυχᾶσθαι ἐν ταῖς ἐκκλησίαις τοῦ θεοῦ ὑπὲρ τῆς ὑπομονῆς ὑμῶν καὶ πίστεως ἐν πᾶσιν τοῖς διωγμοῖς ὑμῶν καὶ ταῖς θλίψεσιν αἷς ἀνέχεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/004.yaml
  text: so that we ourselves boast about you among the churches of God because of your perseverance and faith in all your persecutions and afflictions that you are enduring,[a]
translation:
  language: ml
  text: അതുകൊണ്ട്, നിങ്ങൾ സഹിച്ചുകൊണ്ടിരിക്കുന്ന എല്ലാ പീഡനങ്ങളിലും കഷ്ടതകളിലും കാണിക്കുന്ന നിങ്ങളുടെ സഹിഷ്ണുതയും വിശ്വാസവും[a] നിമിത്തം, ദൈവത്തിന്റെ സഭകളിൽ ഞങ്ങൾതന്നെ നിങ്ങളെക്കുറിച്ച് അഭിമാനിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വിശ്വസ്തതയെ”; πίστις എന്ന പദത്തിന് വിശ്വാസം എന്നോ, പ്രത്യേകിച്ച് കഷ്ടതയുടെ സാഹചര്യത്തിൽ ഉറച്ച വിശ്വസ്തത എന്നോ അർഥമാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞതിന്റെ ഫലമോ നിഗമനമോ അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി ആ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: αὐτοὺς ἡμᾶς
  choice: ഞങ്ങൾതന്നെ
  rationale: പൗലോസിനും സഹപ്രവർത്തകർക്കും നൽകുന്ന ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: ἐν ὑμῖν
  choice: നിങ്ങളെക്കുറിച്ച്
  rationale: അഭിമാനിക്കുന്നതിന്റെ വിഷയമോ ആധാരമോ ആയ വ്യക്തികളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: ἐγκαυχᾶσθαι
  choice: അഭിമാനിക്കുന്നു
  rationale: പദത്തിന്റെ ശക്തമായ അനുകൂലമായ പ്രശംസാഭാവം സൂക്ഷിക്കുമ്പോൾ മലയാളത്തിൽ തെറ്റായ സ്വയംപുകഴ്ത്തൽധ്വനി ഒഴിവാക്കുന്നു.
- source_word: ἐν ταῖς ἐκκλησίαις τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ സഭകളിൽ
  rationale: അഭിമാനം പ്രകടിപ്പിക്കുന്ന സമൂഹപരമായ മണ്ഡലവും സഭകളുടെ ബഹുവചനവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ὑπὲρ
  choice: കുറിച്ച്
  rationale: ഇവിടെ അഭിമാനത്തിന്റെ ആധാരത്തെ അവതരിപ്പിക്കുന്നു; വാക്യത്തിലെ ഘടനയോടൊപ്പം കാരണം എന്ന അർഥവും ഗ്രഹിക്കാം.
- source_word: ὑπομονῆς
  choice: സഹിഷ്ണുത
  rationale: സമ്മർദത്തിനടിയിൽ ഉറച്ചുനിന്ന് സഹിക്കുന്ന ഭാവം പൊതുവായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: πίστεως
  choice: വിശ്വാസം
  rationale: പദത്തിന്റെ സാധാരണ പുതിയനിയമ അർഥം നിലനിർത്തുന്നു; പീഡനസന്ദർഭത്തിൽ സാധ്യമായ 'വിശ്വസ്തത' അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἐν πᾶσιν τοῖς διωγμοῖς ὑμῶν καὶ ταῖς θλίψεσιν
  choice: എല്ലാ പീഡനങ്ങളുടെയും കഷ്ടതകളുടെയും മധ്യേ
  rationale: അവരുടെ സഹിഷ്ണുതയും വിശ്വാസവും പ്രകടമാകുന്ന സാഹചര്യത്തെ വ്യക്തമാക്കുകയും ശത്രുതാപരമായ പീഡനവും വിശാലമായ കഷ്ടതകളും തമ്മിലുള്ള വ്യത്യാസം സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: αἷς ἀνέχεσθε
  choice: നിങ്ങൾ സഹിച്ചുകൊണ്ടിരിക്കുന്ന
  rationale: വർത്തമാനകാലത്തിലെ തുടരുന്ന അനുഭവവും ഭാരമേറ്റു സഹിക്കുന്ന ആശയവും പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: കഷ്ടതയുടെ പശ്ചാത്തലത്തിൽ πίστις എന്നതിന്റെ അർഥം
  choice: വിശ്വാസം
  alternative: വിശ്വസ്തത
  rationale: πίστις വിശ്വാസത്തെയോ ഉറച്ച വിശ്വസ്തതയെയോ സൂചിപ്പിക്കാം. പ്രധാനപാഠത്തിൽ പതിവായ 'വിശ്വാസം' നിലനിർത്തി, സന്ദർഭത്തിൽ യുക്തമായ മറ്റർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിലെ ഊന്നലും തുടരുന്ന പീഡനാനുഭവവും സംരക്ഷിച്ചിരിക്കുന്നു; സഭാപരമായ പ്രത്യേക സാങ്കേതിക പദാവലി അനാവശ്യമായി ചേർത്തിട്ടില്ല.
