review_pass:
  verdict: revise
  source_fidelity: ഗ്രീക്ക് വാക്യത്തിലെ മുഖ്യഘടകങ്ങൾ—ഫലസൂചകമായ ὥστε, ഊന്നലുള്ള ‘ഞങ്ങൾതന്നെ,’ ദൈവത്തിന്റെ സഭകളിലെ പ്രശംസ, സഹിഷ്ണുതയും വിശ്വാസവും, തുടരുന്ന പീഡനങ്ങളും കഷ്ടതകളും—കരടിൽ സംരക്ഷിക്കപ്പെട്ടിട്ടുണ്ട്. എന്നാൽ ‘...സഹിഷ്ണുതയെയും വിശ്വാസത്തെയും കുറിച്ച് ... നിങ്ങളെക്കുറിച്ച്’ എന്ന ഇരട്ട ‘കുറിച്ച്’ പ്രയോഗം ὑπέρ-ഉം ἐν ὑμῖν-ഉം വേർതിരിച്ചു വ്യക്തമാക്കാതെ ഭാരമുള്ളതാക്കുന്നു.
  naturalness: ‘കഷ്ടതകളുടെയും മധ്യേയുള്ള നിങ്ങളുടെ’ എന്ന വിശേഷണശൃംഖല വ്യാകരണപരമായി സാധ്യമെങ്കിലും ആധുനിക നിലവാരമലയാളത്തിൽ അനാവശ്യമായി സങ്കീർണ്ണമാണ്. ‘നിങ്ങൾ സഹിച്ചുകൊണ്ടിരിക്കുന്ന എല്ലാ പീഡനങ്ങളിലും കഷ്ടതകളിലും കാണിക്കുന്ന നിങ്ങളുടെ...’ എന്ന ക്രമം സ്വാഭാവികവും ബന്ധങ്ങൾ വ്യക്തവുമാക്കുന്നു.
  terminology: ‘സഹിഷ്ണുത,’ ‘വിശ്വാസം,’ ‘പീഡനങ്ങൾ,’ ‘കഷ്ടതകൾ,’ ‘ദൈവത്തിന്റെ സഭകൾ’ എന്നിവ സന്ദർഭത്തിനും ആധുനിക ബൈബിൾരജിസ്റ്ററിനും യോജിക്കുന്നു. πίστις-ന്റെ സന്ദർഭോചിതമായ ‘വിശ്വസ്തത’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തണം.
  issues:
  - severity: medium
    issue: ‘കുറിച്ച്’ എന്ന പദത്തിന്റെ ആവർത്തനവും ὑπέρ-ന്റെ കാരണ/ആധാരബന്ധത്തിന്റെ മങ്ങലും
    rationale: കരടിലെ ‘...സഹിഷ്ണുതയെയും വിശ്വാസത്തെയും കുറിച്ച് ദൈവത്തിന്റെ സഭകളിൽ ഞങ്ങൾതന്നെ നിങ്ങളെക്കുറിച്ച് അഭിമാനിക്കുന്നു’ എന്നതിൽ ‘കുറിച്ച്’ രണ്ടുതവണ വരുന്നു. ഗ്രീക്കിൽ ὑπέρ അവരുടെ സഹിഷ്ണുതയെയും വിശ്വാസത്തെയും പ്രശംസയുടെ ആധാരമായി സൂചിപ്പിക്കുമ്പോൾ, ἐν ὑμῖν തെസ്സലോനിക്യരെ പ്രശംസയുടെ വിഷയമായി സൂചിപ്പിക്കുന്നു. ‘നിമിത്തം’ ഉപയോഗിക്കുന്നത് ഈ വ്യത്യാസം തെളിയിക്കുന്നു.
  revised_text: അതുകൊണ്ട്, നിങ്ങൾ സഹിച്ചുകൊണ്ടിരിക്കുന്ന എല്ലാ പീഡനങ്ങളിലും കഷ്ടതകളിലും കാണിക്കുന്ന നിങ്ങളുടെ സഹിഷ്ണുതയും വിശ്വാസവും[a] നിമിത്തം, ദൈവത്തിന്റെ സഭകളിൽ ഞങ്ങൾതന്നെ നിങ്ങളെക്കുറിച്ച് അഭിമാനിക്കുന്നു.
