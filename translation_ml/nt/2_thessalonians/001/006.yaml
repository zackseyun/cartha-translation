id: 2TH.1.6
reference: 2 Thessalonians 1:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἴπερ δίκαιον παρὰ θεῷ ἀνταποδοῦναι τοῖς θλίβουσιν ὑμᾶς θλῖψιν
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/006.yaml
  text: since it is just before God to repay affliction to those who afflict you[a]
translation:
  language: ml
  text: നിങ്ങളെ കഷ്ടപ്പെടുത്തുന്നവർക്ക് കഷ്ടം തിരിച്ചുനൽകുന്നത് ദൈവത്തിന്റെ ദൃഷ്ടിയിൽ നീതിയാണല്ലോ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘നിങ്ങളെ കഷ്ടപ്പെടുത്തുന്നവർക്ക് കഷ്ടം തിരിച്ചുനൽകുന്നത് ദൈവസന്നിധിയിൽ നീതിയാണെങ്കിൽ.’'
    reason: εἴπερ എന്നതിന് ഇവിടെ ഉറപ്പോടെ അനുമാനിക്കുന്ന അടിസ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന ‘ആണല്ലോ’ എന്ന വിവർത്തനത്തിനു പകരം, അതിന്റെ കൂടുതൽ നേരിട്ടുള്ള വ്യവസ്ഥാരൂപമായ ‘ആണെങ്കിൽ’ എന്നും വിവർത്തനം ചെയ്യാം. παρὰ θεῷ എന്നതിന് ‘ദൈവസന്നിധിയിൽ’ എന്നും സാധ്യമാണ്.
lexical_decisions:
- source_word: εἴπερ
  choice: ആണല്ലോ
  rationale: ഇവിടെ εἴπερ സംശയമുള്ള ഒരു വ്യവസ്ഥയല്ല, സത്യമെന്നു കരുതുന്ന അടിസ്ഥാനത്തെ ഊന്നിപ്പറയുന്നു. മലയാളത്തിലെ ‘ആണല്ലോ’ ആ വാചാടോപപരമായ ഉറപ്പും ചുറ്റുമുള്ള വാക്യത്തോടുള്ള ബന്ധവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: δίκαιον
  choice: നീതി
  rationale: ദൈവത്തിന്റെ ന്യായവിധിയിൽ ധാർമികമായി ശരിയായതിനെ സൂചിപ്പിക്കുന്നതിനാൽ, പ്രതിഫലനത്തിന്റെ ന്യായപരമായ സന്ദർഭത്തിന് ‘നീതി’ യോജിക്കുന്നു.
- source_word: παρὰ θεῷ
  choice: ദൈവത്തിന്റെ മുമ്പാകെ
  rationale: ദൈവവുമായി ബന്ധപ്പെട്ട വിലയിരുത്തലിനെയോ ദൈവദൃഷ്ടിയിൽ നീതിയായതിനെയോ ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നു; ‘ദൈവത്തിന്റെ മുമ്പാകെ’ ആ ബന്ധം ചുരുക്കമായും ഗൗരവത്തോടെയും നിലനിർത്തുന്നു.
- source_word: ἀνταποδοῦναι
  choice: പകരം നൽകുന്നത്
  rationale: ചെയ്തതിനനുസരിച്ച് തിരിച്ചുനൽകുക എന്ന പ്രതിഫലനാർഥം വ്യക്തമാക്കുന്നു; അതേസമയം അനാവശ്യമായി സംഭാഷണശൈലിയിലേക്കോ അത്യന്തം സാങ്കേതികമായ ഭാഷയിലേക്കോ പോകുന്നില്ല.
- source_word: τοῖς θλίβουσιν ὑμᾶς
  choice: നിങ്ങളെ കഷ്ടപ്പെടുത്തുന്നവർക്ക്
  rationale: θλίβω സൂചിപ്പിക്കുന്ന സമ്മർദം, ദുരിതം, പീഡനം എന്നിവ സാധാരണ വായനക്കാർക്കു സ്വാഭാവികമായ ഭാഷയിൽ നൽകുന്നു; തുടർന്നുള്ള θλῖψις എന്ന പദത്തോടുള്ള മൂലപദബന്ധവും നിലനിർത്തുന്നു.
- source_word: θλῖψιν
  choice: കഷ്ടം
  rationale: ദുരിതം വരുത്തുന്നവർക്കു ദുരിതം തിരിച്ചുകിട്ടുന്നു എന്ന വാക്കുകളിലെ ബന്ധം ‘കഷ്ടപ്പെടുത്തുന്നവർക്ക് കഷ്ടം’ എന്ന രൂപത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദൈവിക പ്രതിഫലത്തിന്റെ സ്വഭാവം
  choice: കഷ്ടപ്പെടുത്തുന്നവർക്ക് കഷ്ടം പകരം നൽകുന്നത് ദൈവത്തിന്റെ നീതിയാണെന്ന് വാക്യം പറയുന്നു; അതിന്റെ സമയമോ രീതിയോ ഈ ഉപവാക്യത്തിൽ നിർവചിക്കുന്നില്ല.
  alternative: ഇത് അന്തിമകാല ന്യായവിധിയെ മാത്രം സൂചിപ്പിക്കുന്നു; അല്ലെങ്കിൽ ഇപ്പോഴത്തെ ചരിത്രപരമായ ന്യായവിധികളെയും അന്തിമ ന്യായവിധിയെയും ഉൾക്കൊള്ളുന്നു.
  rationale: ഗ്രീക്ക് പാഠം ദൈവത്തിന്റെ പ്രതിഫലം നീതിയുള്ളതാണെന്ന് ഉറപ്പിക്കുന്നുവെങ്കിലും അത് എപ്പോൾ, എങ്ങനെ നടപ്പാകുമെന്ന് ഈ ഉപവാക്യം മാത്രം തീർപ്പാക്കുന്നില്ല. അതിനാൽ പരിഭാഷ ഒരു പ്രത്യേക സിദ്ധാന്തപരമായ സമയക്രമം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. ‘കഷ്ടപ്പെടുത്തുന്നവർക്ക് കഷ്ടം’ എന്ന ആവർത്തനം ഗ്രീക്കിലെ θλίβω/θλῖψις പദബന്ധം ഉദ്ദേശപൂർവം നിലനിർത്തുന്നു. ഈ വാക്യം വലിയൊരു വാക്യഘടനയുടെ ഭാഗമായതിനാൽ ‘ആണല്ലോ’ മുൻസന്ദർഭത്തോടുള്ള യുക്തിബന്ധവും സൂചിപ്പിക്കുന്നു.
