id: 2TH.1.10
reference: 2 Thessalonians 1:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅταν ἔλθῃ ἐνδοξασθῆναι ἐν τοῖς ἁγίοις αὐτοῦ καὶ θαυμασθῆναι ἐν πᾶσιν τοῖς πιστεύσασιν, ὅτι ἐπιστεύθη τὸ μαρτύριον ἡμῶν ἐφ’ ὑμᾶς, ἐν τῇ ἡμέρᾳ ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/010.yaml
  text: on that day when he comes to be glorified among his saints and to be marveled at among all who have believed[b][a], because our testimony to you was believed.
translation:
  language: ml
  text: ആ ദിവസം അവൻ തന്റെ വിശുദ്ധരുടെ ഇടയിൽ മഹത്ത്വീകരിക്കപ്പെടാനും വിശ്വസിച്ച എല്ലാവരുടെയും ഇടയിൽ വിസ്മയിക്കപ്പെടാനും വരുമ്പോൾ[a], നിങ്ങളോടു നൽകിയ ഞങ്ങളുടെ സാക്ഷ്യം വിശ്വസിക്കപ്പെട്ടതുകൊണ്ട്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തന്റെ വിശുദ്ധരിൽ മഹത്ത്വീകരിക്കപ്പെടാനും വിശ്വസിച്ച എല്ലാവരിലും വിസ്മയിക്കപ്പെടാനും.” ഗ്രീക്ക് പൂർവപ്രത്യയം അവൻ തന്റെ വിശുദ്ധജനത്തിന്റെ ഇടയിൽ മഹത്ത്വീകരിക്കപ്പെടുന്നു എന്നോ അവരിൽ അവന്റെ മഹത്ത്വം വെളിപ്പെടുന്നു എന്നോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: 'ഗ്രീക്ക് പദക്രമം ഇങ്ങനെയും നൽകാം: “അവൻ തന്റെ വിശുദ്ധരുടെ ഇടയിൽ മഹത്ത്വീകരിക്കപ്പെടാനും വിശ്വസിച്ച എല്ലാവരുടെയും ഇടയിൽ വിസ്മയിക്കപ്പെടാനും—നിങ്ങളോടു നൽകിയ ഞങ്ങളുടെ സാക്ഷ്യം വിശ്വസിക്കപ്പെട്ടതുകൊണ്ട്—ആ ദിവസം വരുമ്പോൾ.”'
    reason: word_order_alternative
lexical_decisions:
- source_word: ὅταν ἔλθῃ
  choice: വരുമ്പോൾ
  rationale: ὅταν സഹിതമുള്ള aorist subjunctive ഇവിടെ നിശ്ചിതമായ ഭാവിസംഭവത്തെ സൂചിപ്പിക്കുന്നു; ‘വരുമ്പോൾ’ സ്വാഭാവികമായി ആ അർഥം നൽകുന്നു.
- source_word: ἐνδοξασθῆναι
  choice: മഹത്ത്വീകരിക്കപ്പെടാൻ
  rationale: passive infinitive-ന്റെ ഉദ്ദേശ്യ/ഫലസൂചനയും ദൈവിക മഹത്ത്വത്തിന്റെ ആശയവും നിലനിർത്തുന്നു.
- source_word: ἐν τοῖς ἁγίοις αὐτοῦ
  choice: തന്റെ വിശുദ്ധരുടെ ഇടയിൽ
  rationale: ἐν എന്നതിന്റെ സമൂഹപരമായ ‘ഇടയിൽ’ എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു; ‘അവരിൽ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: θαυμασθῆναι
  choice: വിസ്മയത്തോടെ നോക്കപ്പെടാൻ
  rationale: വെറും പ്രശംസയല്ല, അത്ഭുതവും ആദരവും കലർന്ന പ്രതികരണം പ്രകടമാക്കുന്നു.
- source_word: ἐν πᾶσιν τοῖς πιστεύσασιν
  choice: വിശ്വസിച്ച എല്ലാവരുടെയും ഇടയിൽ
  rationale: participle-ന്റെ ക്രിയാത്മകത നിലനിർത്തുകയും മുൻപത്തെ ἐν ഘടനയോടുള്ള സമാന്തരത സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ὅτι
  choice: കാരണം
  rationale: തെസ്സലൊനീക്യർ വിശ്വസിച്ചവരിൽ ഉൾപ്പെടുന്നതിന്റെ കാരണബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: ἐπιστεύθη τὸ μαρτύριον ἡμῶν ἐφ’ ὑμᾶς
  choice: നിങ്ങളോടുള്ള ഞങ്ങളുടെ സാക്ഷ്യം നിങ്ങൾ വിശ്വസിച്ചു
  rationale: ഗ്രീക്കിലെ passive രൂപം മലയാളത്തിൽ അക്ഷരാർഥമായി നൽകിയാൽ അസ്വാഭാവികമാകുന്നതിനാൽ സ്വാഭാവിക active ഘടന ഉപയോഗിക്കുന്നു; സാക്ഷ്യം അവരിലേക്കു അറിയിക്കപ്പെട്ടതും അവർ അതു വിശ്വസിച്ചതും വ്യക്തമാക്കുന്നു.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: ആ ദിവസം
  rationale: അന്ത്യകാലപരമായ സമയസൂചനയെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ‘തന്റെ വിശുദ്ധർ’ എന്നതിന്റെ സൂചനയും ἐν എന്നതിന്റെ അർഥവും
  choice: ക്രിസ്തുവിന്റെ വിശുദ്ധജനത്തെ സൂചിപ്പിക്കുന്നതായി ‘തന്റെ വിശുദ്ധരുടെ ഇടയിൽ’ എന്നു നൽകി.
  alternative: ‘തന്റെ വിശുദ്ധരിൽ’—അവരിൽ അവന്റെ മഹത്ത്വം വെളിപ്പെടുന്നു എന്ന ഊന്നൽ; അല്ലെങ്കിൽ വിശുദ്ധ ദൂതന്മാരെയും ഉൾക്കൊള്ളുന്ന വിശാലമായ വായന.
  rationale: തുടർന്നുള്ള ‘വിശ്വസിച്ച എല്ലാവരും’ എന്ന സമാന്തരവാക്യം വിശ്വാസികളെയാണ് പ്രധാനമായി സൂചിപ്പിക്കുന്നത്. എങ്കിലും ἐν എന്നതിലെ ‘അവരിൽ’ എന്ന യഥാർഥ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: πιστεύσασιν, ἐπιστεύθη എന്നീ വിശ്വാസഭാഷയുടെ അർഥം
  choice: രണ്ടിടത്തും ‘വിശ്വസിക്കുക’ എന്ന സാധാരണ വിശ്വാസഭാഷ നിലനിർത്തി.
  alternative: ‘ആശ്രയിച്ചു’ അല്ലെങ്കിൽ ‘വിശ്വാസത്തോടെ സ്വീകരിച്ചു’ എന്ന വ്യാഖ്യാനാത്മക രൂപങ്ങൾ.
  rationale: മൂലപദത്തിന്റെ ആവർത്തനബന്ധം കഴിയുന്നത്ര നിലനിർത്തുകയും പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ വ്യാഖ്യാനം ഇറക്കുമതി ചെയ്യാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: അവസാനത്തെ സമയവാക്യത്തിന്റെ ബന്ധം
  choice: ‘ആ ദിവസം’ തുടക്കത്തിൽ വെച്ച് മുഴുവൻ സംഭവത്തെയും സമയപരമായി ചുറ്റിപ്പിടിക്കുന്നതായി അവതരിപ്പിച്ചു.
  alternative: ഗ്രീക്ക് പദക്രമം പിന്തുടർന്ന് ‘ആ ദിവസം’ വാക്യത്തിന്റെ അവസാനം നൽകുക.
  rationale: ഗ്രീക്കിൽ അവസാനസ്ഥാനത്തിന് ഊന്നൽ ഉണ്ടായേക്കാമെങ്കിലും മലയാളത്തിൽ തുടക്കസ്ഥാനം കൂടുതൽ സുതാര്യമാണ്; മറുവായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വിശുദ്ധർ,’ ‘മഹത്ത്വീകരിക്കപ്പെടുക,’ ‘സാക്ഷ്യം’ എന്നീ സ്ഥാപിത ബൈബിൾപദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വാക്യഘടനയിൽ ഉപയോഗിച്ചു.
