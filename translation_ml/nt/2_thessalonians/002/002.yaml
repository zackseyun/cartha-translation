  revision_rationale: അവസാനത്തിലുള്ള അനാവശ്യമായ ‘അറിയിപ്പ് ലഭിച്ചാലും’ എന്ന സോപാധിക ചേർക്കൽ നീക്കി, കർത്താവിന്റെ ദിവസം വന്നുകഴിഞ്ഞു എന്നത് മൂന്നു അവകാശപ്പെടപ്പെട്ട മാധ്യമങ്ങളുടെയും ഉള്ളടക്കമാണെന്ന് നേരിട്ട് വ്യക്തമാക്കി. ഇതിലൂടെ ὡς ὅτι-യുടെ പ്രവർത്തനവും διὰ-യോടുള്ള മാധ്യമബന്ധവും സംരക്ഷിക്കപ്പെടുന്നു. അടിക്കുറിപ്പുകൾ മുഖ്യപാഠത്തിലെ അവ്യക്തതയും ἐνέστηκεν-ന്റെ പ്രസക്തമായ ബദൽഭാവവും നിലനിർത്തുന്നു.
