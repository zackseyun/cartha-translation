    rationale: ഗ്രീക്കിൽ ‘അറിയിപ്പ് ലഭിക്കുക’ എന്ന ക്രിയയോ സോപാധിക ‘-ആലും’ ഘടനയോ ഇല്ല. ὡς ὅτι എന്നത് ആ ആത്മാവ്/സന്ദേശം/കത്ത് ഉന്നയിക്കുന്ന അവകാശവാദത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു. അതിനാൽ ചേർക്കൽ ഒഴിവാക്കണം.
