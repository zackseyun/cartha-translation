  to: നിങ്ങളുടെ മനസ്സിന്റെ ഉറപ്പിൽനിന്ന് പെട്ടെന്ന് ഇളകിപ്പോകുകയോ പരിഭ്രാന്തരാകുകയോ ചെയ്യരുത്—കർത്താവിന്റെ ദിവസം വന്നുകഴിഞ്ഞു[b] എന്ന അവകാശവാദമുള്ള ഒരു ആത്മാവിലൂടെയോ[a], ഒരു സന്ദേശത്തിലൂടെയോ, ഞങ്ങളിൽനിന്നുള്ളതെന്ന മട്ടിലുള്ള ഒരു കത്തിലൂടെയോ.
  rationale: അവസാനത്തിലുള്ള അനാവശ്യമായ ‘അറിയിപ്പ് ലഭിച്ചാലും’ എന്ന സോപാധിക ചേർക്കൽ നീക്കി, കർത്താവിന്റെ ദിവസം വന്നുകഴിഞ്ഞു എന്നത് മൂന്നു അവകാശപ്പെടപ്പെട്ട മാധ്യമങ്ങളുടെയും ഉള്ളടക്കമാണെന്ന് നേരിട്ട് വ്യക്തമാക്കി. ഇതിലൂടെ ὡς ὅτι-യുടെ പ്രവർത്തനവും διὰ-യോടുള്ള മാധ്യമബന്ധവും സംരക്ഷിക്കപ്പെടുന്നു. അടിക്കുറിപ്പുകൾ മുഖ്യപാഠത്തിലെ അവ്യക്തതയും ἐνέστηκεν-ന്റെ പ്രസക്തമായ ബദൽഭാവവും നിലനിർത്തുന്നു.
