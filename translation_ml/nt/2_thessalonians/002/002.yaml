id: 2TH.2.2
reference: 2 Thessalonians 2:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰς τὸ μὴ ταχέως σαλευθῆναι ὑμᾶς ἀπὸ τοῦ νοὸς ⸀μηδὲ θροεῖσθαι μήτε διὰ πνεύματος μήτε διὰ λόγου μήτε δι’ ἐπιστολῆς ὡς δι’ ἡμῶν, ὡς ὅτι ἐνέστηκεν ἡ ἡμέρα τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/002.yaml
  text: that you not be quickly shaken from your mind or alarmed[a], either by a spirit or by a message or by a letter as if from us[b], to the effect that the day of the Lord has come.
translation:
  language: ml
  text: നിങ്ങളുടെ മനസ്സിന്റെ ഉറപ്പിൽനിന്ന് പെട്ടെന്ന് ഇളകിപ്പോകുകയോ പരിഭ്രാന്തരാകുകയോ ചെയ്യരുത്—കർത്താവിന്റെ ദിവസം വന്നുകഴിഞ്ഞു[b] എന്ന അവകാശവാദമുള്ള ഒരു ആത്മാവിലൂടെയോ[a], ഒരു സന്ദേശത്തിലൂടെയോ, ഞങ്ങളിൽനിന്നുള്ളതെന്ന മട്ടിലുള്ള ഒരു കത്തിലൂടെയോ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരു ആത്മിക അരുളപ്പാടിലൂടെയോ” അല്ലെങ്കിൽ “ഒരു പ്രവചനവെളിപ്പാടിലൂടെയോ.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “സന്നിഹിതമായിരിക്കുന്നു” അല്ലെങ്കിൽ “ഇപ്പോൾ നിലവിലുണ്ട്.” ഗ്രീക്ക് പൂർണകാലക്രിയ, കർത്താവിന്റെ ദിവസം ഇതിനകം എത്തി ഇപ്പോൾ സന്നിഹിതമാണ് എന്ന അവകാശവാദത്തെ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ταχέως
  choice: പെട്ടെന്ന്
  rationale: മുന്നറിയിപ്പിന്റെ ഊന്നൽ സംഭവത്തിന്റെ സമീപകാലത്തല്ല, വായനക്കാർ വേഗത്തിൽ അസ്ഥിരരാകാതിരിക്കണമെന്നതിലാണ്.
- source_word: σαλευθῆναι ὑμᾶς ἀπὸ τοῦ νοὸς
  choice: നിങ്ങളുടെ മനസ്സിന്റെ ഉറപ്പിൽനിന്ന് ... ഇളകിപ്പോകുക
  rationale: ‘കുലുക്കപ്പെടുക’ എന്ന രൂപകം നിലനിർത്തിക്കൊണ്ട്, ἀπὸ τοῦ νοός സൂചിപ്പിക്കുന്ന സ്ഥിരമായ മനോഭാവത്തിൽനിന്നോ ബോധ്യത്തിൽനിന്നോ മാറിപ്പോകുക എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: θροεῖσθαι
  choice: പരിഭ്രാന്തരാകുക
  rationale: അസ്വസ്ഥതയും ഭീതിജനകമായ കലക്കവും സൂചിപ്പിക്കുന്ന ക്രിയയുടെ വൈകാരിക ശക്തി പകരുന്നു.
- source_word: πνεύματος
  choice: ഒരു ആത്മാവിലൂടെ
  rationale: അനാർത്രസ് നാമത്തിന്റെ അക്ഷരാർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ സാധ്യതയുള്ള ‘ആത്മിക അരുളപ്പാട്/പ്രവചനവെളിപ്പാട്’ എന്ന അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: λόγου
  choice: സന്ദേശത്തിലൂടെ
  rationale: കത്തിനോട് വിരുദ്ധമായി ഇവിടെ വാചികമായ അറിയിപ്പോ ഉപദേശമോ ഉദ്ദേശിക്കപ്പെടാൻ സാധ്യതയുള്ളതിനാൽ വെറും ‘വാക്ക്’ എന്നതിനെക്കാൾ വ്യക്തമാണ്.
- source_word: ἐπιστολῆς ὡς δι’ ἡμῶν
  choice: ഞങ്ങളിൽനിന്നുള്ളതെന്നു തോന്നിക്കുന്ന കത്തിലൂടെ
  rationale: പൗലോസിനും സഹപ്രവർത്തകർക്കും വ്യാജമായി കത്ത് ചാർത്തപ്പെടുന്നതെന്ന ആശയം സ്വാഭാവികമായി അറിയിക്കുന്നു; ‘തോന്നിക്കുന്ന’ എന്നത് അവകാശവാദത്തിന്റെ സംശയാസ്പദത നിലനിർത്തുന്നു.
- source_word: ἐνέστηκεν
  choice: വന്നുകഴിഞ്ഞു
  rationale: പൂർണകാല ക്രിയ സൂചിപ്പിക്കുന്ന, ദിവസം എത്തി ഇപ്പോൾ സന്നിഹിതമായിരിക്കുന്നു എന്ന അവകാശവാദം മലയാളത്തിൽ വ്യക്തമായി പകരുന്നു; കൂടുതൽ അക്ഷരാർഥമായ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἡμέρα τοῦ κυρίου
  choice: കർത്താവിന്റെ ദിവസം
  rationale: ആഴ്ചതോറുമുള്ള ആരാധനാദിവസമല്ല, സ്ഥാപിതമായ അന്ത്യകാലപ്രയോഗമാണിത്; κύριος എന്നതിന് സ്വാഭാവികമായ ‘കർത്താവ്’ ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: ἐνέστηκεν എന്നതിന്റെ അന്ത്യകാലപരമായ അർഥം
  choice: വന്നുകഴിഞ്ഞു
  alternative: ഇപ്പോൾ വന്നിരിക്കുന്നു / സന്നിഹിതമായിരിക്കുന്നു
  rationale: എത്തിച്ചേർന്നതിന്റെ ഫലമായി ഇപ്പോൾ നിലവിലുണ്ട് എന്ന പൂർണകാലത്തിന്റെ ഇരട്ടഭാവം ‘വന്നുകഴിഞ്ഞു’ നന്നായി അറിയിക്കുന്നു. ‘സന്നിഹിതമായിരിക്കുന്നു’ എന്ന വായനയ്ക്ക് വ്യാഖ്യാനപരമായ പ്രാധാന്യമുള്ളതിനാൽ അത് അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: πνεύματος എന്നതിന്റെ സന്ദർഭോചിതമായ അർഥം
  choice: ഒരു ആത്മാവിലൂടെ
  alternative: ഒരു ആത്മിക അരുളപ്പാടിലൂടെ / ഒരു പ്രവചനവെളിപ്പാടിലൂടെ / ആത്മാവിലൂടെ
  rationale: പ്രധാനപാഠം ഗ്രീക്കിന്റെ യഥാർഥ അവ്യക്തത നിലനിർത്തുന്നു. ഇവിടെ പരിശുദ്ധാത്മാവിനെത്തന്നെ നിർബന്ധമായും ഉദ്ദേശിക്കുന്നുവെന്ന് തീർപ്പാക്കാതെ, അവകാശപ്പെടപ്പെട്ട ആത്മിക സന്ദേശമാകാം എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ ഉദ്ദേശ്യവാക്യം മുൻവാക്യവുമായി വ്യാകരണപരമായി ചേരുന്നതായതിനാൽ ഈ വാക്യം ‘ചെയ്യരുത്’ എന്ന ഉപദേശരൂപത്തിൽ അവതരിപ്പിച്ചു. മൂന്നു സാധ്യതയുള്ള മാർഗങ്ങളും ‘-ലൂടെ’ എന്ന സമാന്തരഘടനയിൽ നിലനിർത്തി; ὡς ὅτι എന്നത് മലയാളത്തിൽ ഭാരമില്ലാതെ വ്യക്തമാക്കാൻ ‘എന്ന അറിയിപ്പ് ലഭിച്ചാലും’ എന്നു നൽകി.
