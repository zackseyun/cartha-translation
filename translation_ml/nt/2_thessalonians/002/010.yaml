lexical_decisions:
- source_word: ἀπάτῃ
  choice: വഞ്ചന
  rationale: ἀπάτη സജീവമായി തെറ്റിദ്ധരിപ്പിക്കുന്ന വഞ്ചനയെയോ ചതിയെയോ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിലും ἐν എന്ന പ്രയോഗത്തോടും ‘വഞ്ചന’ സ്വാഭാവികമായി ചേരുന്നു.
- source_word: ἀδικίας
  choice: അനീതിയുടെ
  rationale: ജനിറ്റീവ് രൂപവും ധാർമിക-ദൈവശാസ്ത്രപരമായ ഭാവവും നിലനിർത്തുന്നു; ഇവിടെ വഞ്ചനയുടെ സ്വഭാവത്തെ വിശേഷിപ്പിക്കുന്നു.
- source_word: τοῖς ἀπολλυμένοις
  choice: നശിച്ചുകൊണ്ടിരിക്കുന്നവരോടുള്ള
  rationale: ദത്തിവ് രൂപത്തിന്റെ ലക്ഷ്യ/ബന്ധ ഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; വർത്തമാന കൃദന്തരൂപം തുടരുന്ന അവസ്ഥയായി നിലനിർത്തുന്നു.
- source_word: ἀνθ’ ὧν
  choice: …കൊണ്ടാണിത്
  rationale: സന്ദർഭത്തിലെ കാരണബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; പ്രതികാരപരമായ അർഥം അനാവശ്യമായി നിർബന്ധിക്കുന്നില്ല.
- source_word: ἀγάπην τῆς ἀληθείας
  choice: സത്യത്തോടുള്ള സ്നേഹം
  rationale: മലയാളത്തിൽ ‘സത്യത്തിന്റെ സ്നേഹം’ എന്നത് സത്യം പ്രകടിപ്പിക്കുന്ന സ്നേഹം എന്നായി തെറ്റിദ്ധരിക്കാം; സത്യത്തെ സ്നേഹിക്കുന്നതെന്ന സന്ദർഭസാധ്യമായ വസ്തുനിഷ്ഠ ജനിറ്റീവ് അർഥം ‘സത്യത്തോടുള്ള’ എന്ന് വ്യക്തമാക്കുന്നു.
- source_word: ἐδέξαντο
