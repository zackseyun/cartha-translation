  text: നശിച്ചുകൊണ്ടിരിക്കുന്നവരിൽ[b] അനീതിയുടെ സകല വഞ്ചനയോടുംകൂടെ[a], അവർ രക്ഷിക്കപ്പെടേണ്ടതിന്[d] സത്യത്തോടുള്ള സ്നേഹം സ്വീകരിക്കാതിരുന്നതുകൊണ്ട്[c].
