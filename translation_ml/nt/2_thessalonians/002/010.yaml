  rationale: δέχομαι എന്നതിന്റെ സ്വീകരിക്കുക/കൈക്കൊള്ളുക എന്ന അർഥം അമൂർത്തമായ കർമത്തോടൊപ്പം വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: εἰς τὸ σωθῆναι αὐτούς
  choice: അവർ രക്ഷിക്കപ്പെടേണ്ടതിന്
  rationale: εἰς + articular infinitive സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യത്തെയോ ലക്ഷ്യത്തെയോ നിലനിർത്തുന്നു; passive രൂപവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: οἱ ἀπολλύμενοι ഒരു സ്ഥിരമായി വിധിക്കപ്പെട്ട വിഭാഗമാണോ, തുടരുന്ന അവസ്ഥയിലുള്ളവരോ
  choice: നശിച്ചുകൊണ്ടിരിക്കുന്നവർ
  alternative: നാശത്തിന് വിധിക്കപ്പെട്ടവർ; നശിപ്പിക്കപ്പെടുന്നവർ
  rationale: വർത്തമാന middle/passive participle തുടരുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു; മുൻകൂട്ടി നിശ്ചയിക്കപ്പെട്ട അന്തിമവിധി എന്ന വ്യാഖ്യാനം വാചകത്തിലേക്ക് ചേർക്കുന്നില്ല.
- issue: τὴν ἀγάπην τῆς ἀληθείας എന്നതിലെ ജനിറ്റീവിന്റെ ബന്ധം
  choice: സത്യത്തോടുള്ള സ്നേഹം
  alternative: സത്യത്തിന്റെ സ്നേഹം
  rationale: സന്ദർഭം സത്യത്തെ സ്നേഹപൂർവം സ്വീകരിക്കാത്തതിലേക്കാണ് ശക്തമായി വിരൽചൂണ്ടുന്നത്. മലയാളത്തിലെ അർഥവ്യത്യാസം കാരണം objective genitive സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; സത്യം അവരെ സ്നേഹിക്കുന്നു എന്ന അപൂർവ വായന ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: εἰς τὸ σωθῆναι purpose ആണോ result ആണോ
  choice: രക്ഷിക്കപ്പെടേണ്ടതിന്
  alternative: അങ്ങനെ രക്ഷിക്കപ്പെടാൻ
  rationale: ഉദ്ദേശ്യ/ലക്ഷ്യ ഭാവം മുഖ്യവാചകത്തിൽ നൽകുന്നു; ഫലഭാവത്തിനുള്ള സാധ്യത കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ഈ വാക്യം മുൻവാക്യത്തിൽ ആരംഭിച്ച ഘടനയുടെ തുടർച്ചയായതിനാൽ തുടക്കത്തിലെ ‘…യോടുംകൂടെ’ നിലനിർത്തിയിരിക്കുന്നു. എല്ലാ കുറിപ്പുസൂചകങ്ങളും ബന്ധപ്പെട്ട വാചകഭാഗങ്ങൾക്ക് സമീപം ചേർത്തിരിക്കുന്നു.
