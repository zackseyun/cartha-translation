  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ τότε ἀποκαλυφθήσεται ὁ ἄνομος, ὃν ὁ κύριος ⸀Ἰησοῦς ⸀ἀνελεῖ τῷ πνεύματι τοῦ στόματος αὐτοῦ καὶ καταργήσει τῇ ἐπιφανείᾳ τῆς παρουσίας αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/008.yaml
  text: And then the lawless one will be revealed[a], whom the Lord Jesus will slay with the breath of his mouth and bring to nothing by the appearance of his coming[b],
translation:
  language: ml
  text: അപ്പോൾ ആ നിയമരഹിതൻ വെളിപ്പെടും. കർത്താവായ യേശു തന്റെ വായിൽനിന്നുള്ള ശ്വാസത്താൽ[a] അവനെ കൊല്ലുകയും തന്റെ വരവിന്റെ പ്രത്യക്ഷതയാൽ[b] അവനെ നിഷ്ഫലനാക്കുകയും ചെയ്യും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തന്റെ വായിൽനിന്നുള്ള ആത്മാവിനാൽ.” ഗ്രീക്കുപദത്തിന് “ശ്വാസം” എന്നും “ആത്മാവ്” എന്നും അർഥമാകാം; ഇവിടെ ഈ പ്രയോഗത്തിന് “ശ്വാസം” എന്നതാണ് കൂടുതൽ യോജിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “തന്റെ സാന്നിധ്യത്തിന്റെ പ്രത്യക്ഷതയാൽ.” ഈ സന്ദർഭത്തിൽ παρουσία എന്നതിന് സാധാരണയായി “വരവ്” എന്നാണ് അർഥം; “സാന്നിധ്യം” എന്നതും ആ പദത്തിന്റെ അർഥപരിധിയിലുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκαλυφθήσεται
  choice: വെളിപ്പെടും
  rationale: ഭാവികാല കർമണിപ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ആരാണ് വെളിപ്പെടുത്തുന്നത് എന്നു പാഠം പറയാത്തതിനാൽ അത് കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: ὁ ἄνομος
  choice: ആ നിയമരഹിതൻ
  rationale: നാമമായി ഉപയോഗിച്ചിരിക്കുന്ന വിശേഷണത്തിന്റെ നിർദിഷ്ടത നിലനിർത്തുന്നു; ഈ വാക്യത്തിൽ ഇല്ലാത്ത ‘മനുഷ്യൻ’ എന്ന പദം ചേർക്കുന്നില്ല.
- source_word: ὁ κύριος Ἰησοῦς
  choice: കർത്താവായ യേശു
  rationale: κύριος എന്ന സ്ഥാനപ്പേരും Ἰησοῦς എന്ന വ്യക്തിനാമവും മലയാളത്തിലെ സ്ഥാപിതവും സ്വാഭാവികവുമായ രൂപത്തിൽ നൽകുന്നു.
- source_word: ἀνελεῖ
  choice: കൊല്ലുകയും ചെയ്യും
  rationale: സന്ദർഭത്തിൽ ക്രിയയുടെ ‘കൊല്ലുക’ എന്ന ശക്തമായ അർഥം വ്യക്തമായി നൽകുന്നു; ‘നീക്കിക്കളയും’ എന്ന ദുർബലമായ അർഥം ഒഴിവാക്കുന്നു.
- source_word: τῷ πνεύματι τοῦ στόματος αὐτοῦ
  choice: തന്റെ വായിൽനിന്നുള്ള ശ്വാസത്താൽ
  rationale: ഇവിടത്തെ പ്രയോഗത്തിൽ πνεῦμα എന്നതിന് ‘ശ്വാസം’ എന്ന അർഥമാണ് ഏറ്റവും സ്വാഭാവികം; ‘ആത്മാവ്’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: καταργήσει
  choice: നിഷ്ഫലനാക്കുകയും ചെയ്യും
  rationale: പ്രവർത്തനശേഷി ഇല്ലാതാക്കുക, അസാധുവാക്കുക, അവസാനിപ്പിക്കുക എന്നീ അർഥങ്ങളെ ഉൾക്കൊള്ളുന്നു; വെറും ഭൗതിക നാശം എന്നതിലേക്കു പദത്തെ ചുരുക്കുന്നില്ല.
- source_word: τῇ ἐπιφανείᾳ
  choice: പ്രത്യക്ഷതയാൽ
  rationale: ἐπιφάνεια സൂചിപ്പിക്കുന്ന ദൃശ്യമായ വെളിപ്പാടിനെയോ പ്രത്യക്ഷപ്പെടലിനെയോ സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τῆς παρουσίας αὐτοῦ
  choice: തന്റെ വരവിന്റെ
  rationale: അന്ത്യകാലസന്ദർഭത്തിൽ παρουσία സാധാരണയായി ‘വരവ്’ എന്നാണ്; ‘സാന്നിധ്യം’ എന്ന പദാർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: അന്ത്യകാല എതിരാളിയുടെ തിരിച്ചറിയലും വിശേഷണവും
  choice: ആ നിയമരഹിതൻ
  alternative: നിയമരാഹിത്യത്തിന്റെ മനുഷ്യൻ
  rationale: ഈ വാക്യത്തിൽ ὁ ἄνομος എന്ന നാമീകൃത വിശേഷണമാണുള്ളത്; സമീപവാക്യത്തിലെ വിപുലമായ പ്രയോഗം ഇവിടെ ഇറക്കുമതി ചെയ്യാതെ പാഠത്തിന്റെ സ്വന്തം രൂപം നിലനിർത്തുന്നു.
- issue: കർത്താവായ യേശുവിന്റെ ജയത്തിന്റെ മാർഗം
  choice: തന്റെ വായിൽനിന്നുള്ള ശ്വാസത്താൽ
  alternative: തന്റെ വായിൽനിന്നുള്ള ആത്മാവിനാൽ
  rationale: ഈ ഭാഷാപ്രയോഗത്തിൽ ‘ശ്വാസം’ കൂടുതൽ സ്വാഭാവികവും പ്രവാചകീയ ന്യായവിധിചിത്രണവുമായി ഒത്തുപോകുന്നതുമാണ്; πνεῦμα എന്നതിന് ‘ആത്മാവ്’ എന്നും അർഥമാകാവുന്നതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: παρουσία എന്ന പദത്തിന്റെ അന്ത്യകാലസന്ദർഭത്തിലെ അർഥം
  choice: വരവ്
  alternative: സാന്നിധ്യം
  rationale: ഇവിടെ ക്രിസ്തുവിന്റെ എത്തിച്ചേരലാണ് സന്ദർഭോചിതമായ അർഥം; എന്നാൽ പദത്തിന്റെ വിശാലമായ ‘സാന്നിധ്യം’ എന്ന അർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലപാഠത്തിലെ രണ്ടു വ്യത്യസ്ത ക്രിയകളായ ἀνελεῖ, καταργήσει എന്നിവ യഥാക്രമം ‘കൊല്ലുക’, ‘നിഷ്ഫലനാക്കുക’ എന്നു വേർതിരിച്ചു. വായനാസൗകര്യത്തിനായി ഗ്രീക്ക് വാക്യം മലയാളത്തിൽ രണ്ട് വാക്യങ്ങളാക്കി; ആശയബന്ധം മാറ്റിയിട്ടില്ല.
