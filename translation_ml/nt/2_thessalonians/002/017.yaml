review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the two coordinated prayer-wish verbs, the plural ‘your hearts,’ and the sphere ‘in every good work and word.’ However, the supplied object ‘നിങ്ങളെ’ with the second verb shifts the object from the hearts (explicit with the first verb and understood with the second in Greek) to the people themselves. The revision retains ‘hearts’ as the object of both verbs.
  naturalness: The prayer-wish construction with ‘ചെയ്യട്ടെ’ is natural modern standard Malayalam. ‘പ്രോത്സാഹിപ്പിക്കുക’ more broadly represents παρακαλέω here than ‘ധൈര്യപ്പെടുത്തുക,’ which can narrow the sense specifically to giving courage. Repeating ‘നിങ്ങളുടെ ഹൃദയങ്ങളെ’ avoids an ambiguous pronoun and reads smoothly.
  terminology: ‘ഹൃദയങ്ങൾ,’ ‘സ്ഥിരപ്പെടുത്തുക,’ ‘നല്ല പ്രവൃത്തി,’ and ‘വാക്ക്’ are appropriate, dignified, and source-sensitive. ‘സ്ഥിരപ്പെടുത്തുക’ expresses στηρίζω’s sense of making firm without reducing it to merely emotional or physical strengthening.
  issues:
  - severity: medium
    issue: The second verb takes ‘നിങ്ങളെ’ as its object.
    rationale: Greek στηρίξαι has ‘your hearts’ as its understood object in coordination with παρακαλέσαι. Rendering it as ‘strengthen you’ broadens and slightly changes the syntactic focus. The Malayalam should retain the hearts as the object.
  - severity: low
    issue: ‘ധൈര്യപ്പെടുത്തുകയും’ narrows παρακαλέσαι.
    rationale: It is possible in context, but it foregrounds courage more specifically than the broader encouragement/comfort sense of παρακαλέω. ‘പ്രോത്സാഹിപ്പിക്കുക’ better preserves the breadth in modern Malayalam.
