  text: παρακαλέσαι ὑμῶν τὰς καρδίας καὶ ⸀στηρίξαι ἐν παντὶ ⸂ἔργῳ καὶ λόγῳ⸃ ἀγαθῷ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/017.yaml
  text: encourage your hearts and strengthen them in every good work and word[a][b].
translation:
  language: ml
  text: നിങ്ങളുടെ ഹൃദയങ്ങളെ പ്രോത്സാഹിപ്പിക്കുകയും[a] എല്ലാ നല്ല പ്രവൃത്തിയിലും വാക്കിലും നിങ്ങളുടെ ഹൃദയങ്ങളെ സ്ഥിരപ്പെടുത്തുകയും[b] ചെയ്യട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങളുടെ ഹൃദയങ്ങളെ ആശ്വസിപ്പിക്കുകയും” അല്ലെങ്കിൽ “ഉദ്ബോധിപ്പിക്കുകയും”; παρακαλέσαι എന്ന പദത്തിന് ഈ അർത്ഥങ്ങളും വരാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ഉറപ്പിക്കുകയും” അല്ലെങ്കിൽ “ശക്തിപ്പെടുത്തുകയും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλέσαι
  choice: ധൈര്യപ്പെടുത്തുകയും
  rationale: മുൻവാക്യത്തിലെ ‘നിത്യമായ ആശ്വാസം/ധൈര്യം’ എന്ന ആശയത്തോടുള്ള ബന്ധം നിലനിർത്തിക്കൊണ്ട്, ആശ്വസിപ്പിക്കുക, പ്രോത്സാഹിപ്പിക്കുക, ഉദ്ബോധിപ്പിക്കുക എന്നീ അർത്ഥവ്യാപ്തികൾ പൂർണമായി ചുരുക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: καρδίας
  choice: ഹൃദയങ്ങളെ
  rationale: വികാരങ്ങളെ മാത്രം സൂചിപ്പിക്കാതെ ആന്തരിക വ്യക്തിത്വത്തെ ഉൾക്കൊള്ളുന്ന ബൈബിൾപരമായ രൂപകം നിലനിർത്തുന്നു.
- source_word: στηρίξαι
  choice: ഉറപ്പിക്കുകയും
  rationale: സ്ഥിരമാക്കുക, ദൃഢപ്പെടുത്തുക, ശക്തിപ്പെടുത്തുക എന്ന അർത്ഥമുള്ള ക്രിയയെ ഈ പ്രാർഥനാസന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐν παντὶ
  choice: എല്ലാ ...യിലും
  rationale: ഉറപ്പിക്കൽ സംഭവിക്കുന്ന മേഖലയെ സൂചിപ്പിക്കുന്ന ἐν എന്ന പൂർവപ്രത്യയത്തിന്റെ അർത്ഥം നിലനിർത്തുന്നു.
- source_word: ἔργῳ
  choice: പ്രവൃത്തിയിലും
  rationale: ἔργον എന്നതിന്റെ നേരിട്ടുള്ള അർത്ഥം നൽകുകയും λόγος-നോടുള്ള സമാന്തരത നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: λόγῳ
  choice: വാക്കിലും
  rationale: പ്രവൃത്തിയോട് സമാന്തരമായി സംസാരത്തെയോ ഉച്ചാരണത്തെയോ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്ത രൂപം നിലനിർത്തുന്നു.
- source_word: ἀγαθῷ
  choice: നല്ല
  rationale: പ്രവൃത്തിയെയും വാക്കിനെയും അർത്ഥത്തിൽ വിശേഷിപ്പിക്കുന്ന ἀγαθός എന്ന പദത്തിന്റെ വിശാലവും നേരിട്ടുള്ളതുമായ തർജമയാണ്.
- source_word: ὑμῶν
  choice: നിങ്ങളുടെ / നിങ്ങളെ
  rationale: ‘നിങ്ങളുടെ ഹൃദയങ്ങൾ’ എന്ന ബന്ധം നേരിട്ട് നൽകുന്നു; രണ്ടാം ക്രിയയോടൊപ്പം മലയാളത്തിലെ സ്വാഭാവിക വാക്യഘടനയ്ക്കായി ‘നിങ്ങളെ’ ആവർത്തിക്കുന്നു.
- source_word: καὶ
  choice: -ഉം / -യും
  rationale: രണ്ട് പ്രാർഥനാക്രിയകളെയും ‘പ്രവൃത്തി—വാക്ക്’ എന്ന നാമജോടിയെയും മലയാളത്തിൽ സ്വാഭാവികമായി ഏകോപിപ്പിക്കുന്നു.
theological_decisions:
- issue: καρδία എന്നത് ആധുനിക മനശ്ശാസ്ത്രപരമായ ഒരു പരിമിത വിഭാഗമായി വ്യാഖ്യാനിക്കണമോ
  choice: ഹൃദയങ്ങളെ
  alternative: മനസ്സുകളെ / ആന്തരിക വ്യക്തിത്വത്തെ
  rationale: മൂലപാഠത്തിലെ ബൈബിൾപരമായ മനുഷ്യശാസ്ത്രരൂപകം സംരക്ഷിക്കുകയും അതിനെ വികാരമോ ബുദ്ധിയോ മാത്രമായി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: στηρίξαι എന്നത് ശക്തിപ്പെടുത്തുക എന്നോ ഉറപ്പിക്കുക എന്നോ നൽകണമോ
  choice: ഉറപ്പിക്കുകയും
  alternative: ശക്തിപ്പെടുത്തുകയും / സ്ഥിരപ്പെടുത്തുകയും
  rationale: ‘ദൃഢമാക്കുക, സ്ഥിരമാക്കുക’ എന്ന മൂലാർത്ഥം അടുത്തായി നിലനിർത്തുന്നു; പ്രവൃത്തിയിലും വാക്കിലും സ്ഥിരത വരുത്തണമെന്ന പ്രാർഥനാഭാവവും സ്വാഭാവികമായി അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിൽ ലളിതവും മാന്യവുമായ പ്രാർഥനാശൈലി. വാക്യം 16-ൽ ആരംഭിക്കുന്ന ആശംസാപ്രാർഥനയുടെ തുടർച്ചയായതിനാൽ ‘ചെയ്യട്ടെ’ ഉപയോഗിച്ചു. മൂലത്തിലെ ഏകവചന നാമജോടിയായ ‘പ്രവൃത്തി—വാക്ക്’യും ‘ഹൃദയം’ എന്ന ബൈബിൾരൂപകവും നിലനിർത്തി.
