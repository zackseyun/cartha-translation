id: 2TH.2.1
reference: 2 Thessalonians 2:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐρωτῶμεν δὲ ὑμᾶς, ἀδελφοί, ὑπὲρ τῆς παρουσίας τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ καὶ ἡμῶν ἐπισυναγωγῆς ἐπ’ αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/001.yaml
  text: We ask you[a], brothers, concerning the coming of our Lord Jesus the Messiah and our gathering together to him[b],
translation:
  language: ml
  text: 'സഹോദരങ്ങളേ[b], നമ്മുടെ കർത്താവായ യേശു മിശിഹായുടെ[a] വരവിനെയും അവന്റെ അടുക്കലേക്കുള്ള നമ്മുടെ ഒരുമിച്ചുകൂടലിനെയും സംബന്ധിച്ച് ഞങ്ങൾ നിങ്ങളോട് അഭ്യർഥിക്കുന്നു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യേശുക്രിസ്തു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ Χριστός എന്ന പദവിയുടെ അർഥം നിലനിർത്താനാണ് ഇവിടെ ‘മിശിഹാ’ എന്നു നൽകിയിരിക്കുന്നത്.
    reason: alternative_reading
  - marker: b
    text: ‘സഹോദരങ്ങളേ’ എന്നത് പൗലോസിന്റെ സംബോധനരൂപമാണ്; സന്ദർഭത്തിൽ അദ്ദേഹം വിശ്വാസിസമൂഹം മുഴുവനെയും അഭിസംബോധന ചെയ്യുന്നതായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐρωτῶμεν
  choice: ഞങ്ങൾ നിങ്ങളോട് അഭ്യർഥിക്കുന്നു
  rationale: ഇവിടെ ക്രിയ ഒരു ആജ്ഞയല്ല, സൗമ്യമായ അപ്പൊസ്തലിക അഭ്യർഥനയാണ് സൂചിപ്പിക്കുന്നത്. ‘അഭ്യർഥിക്കുന്നു’ ആ ഭാവം സ്വാഭാവികവും മാന്യവുമായി നൽകുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: δέ ഇവിടെ ശക്തമായ വിരോധമല്ല, വിഷയമാറ്റം സൂചിപ്പിക്കുന്ന ലഘു ബന്ധകമാണ്. മലയാളവാക്യത്തിന്റെ സ്വാഭാവിക പ്രവാഹത്തിൽ അത് പ്രത്യേകം പദമില്ലാതെയും പ്രകടമാണ്.
- source_word: ἀδελφοί
  choice: സഹോദരങ്ങളേ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ സംബോധനയെ ഉറവിടരൂപത്തോട് ചേർന്ന് നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ വിശ്വാസിസമൂഹം മുഴുവനും ഉൾപ്പെടാൻ സാധ്യതയുള്ളത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὑπὲρ
  choice: സംബന്ധിച്ച്
  rationale: ഇവിടെ ചർച്ചാവിഷയം അവതരിപ്പിക്കുന്ന അർഥമാണ്; ഗുണഭോക്തൃസൂചകമായ ‘വേണ്ടി’ എന്ന അർഥമല്ല.
- source_word: παρουσίας
  choice: വരവ്
  rationale: യേശുവിനെക്കുറിച്ചുള്ള അന്ത്യകാലസന്ദർഭത്തിൽ παρουσία അവന്റെ ഭാവിവരവിനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘വരവ്’ വ്യക്തവും സ്ഥാപിതവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: κυρίου
  choice: കർത്താവ്
  rationale: κύριος എന്ന അധികാരപരവും ദൈവശാസ്ത്രപരവുമായ അഭിധാനത്തിന്റെ സ്ഥാപിത മലയാളരൂപം.
- source_word: Ἰησοῦ Χριστοῦ
  choice: യേശുമിശിഹാ
  rationale: Χριστός ഇവിടെ അഭിഷിക്തനായ രാജാവിനെ സൂചിപ്പിക്കുന്ന പദവിയായി പ്രവർത്തിക്കുന്നതിനാൽ അർഥം നിലനിർത്തുന്ന ‘മിശിഹാ’ ഉപയോഗിക്കുന്നു; പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἐπισυναγωγῆς
  choice: ഒരുമിച്ചുകൂടൽ
  rationale: വിശ്വാസികൾ ക്രിസ്തുവിന്റെ അടുക്കൽ കൂട്ടിച്ചേർക്കപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്ന സംയുക്തപദത്തിന്റെ കൂട്ടായ്മാഭാവം നിലനിർത്തുന്നു; സ്ഥാപനപരമായ ‘സഭ’ എന്ന ആശയം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: ἐπ’ αὐτόν
  choice: അവന്റെ അടുക്കലേക്ക്
  rationale: ക്രിസ്തുവിലേക്കുള്ള ദിശയെയും ചലനത്തെയും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: Χριστοῦ എന്ന പദവിയുടെ പരിഭാഷ
  choice: മിശിഹാ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ Χριστός പദവി എന്ന അർഥം സജീവമായി നിലനിൽക്കുന്നു. അതിനാൽ ‘മിശിഹാ’ മുഖ്യപാഠത്തിലും പരമ്പരാഗത ‘ക്രിസ്തു’ അടിക്കുറിപ്പിലും നൽകുന്നു.
- issue: ἀδελφοί എന്ന സംബോധനയുടെ വ്യാപ്തി
  choice: സഹോദരങ്ങളേ
  alternative: സഹോദരീസഹോദരങ്ങളേ
  rationale: ഗ്രീക്കിലെ വ്യാകരണപരമായി പുല്ലിംഗമായ രൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; എന്നാൽ പൗലോസ് വിശ്വാസിസമൂഹം മുഴുവനെയും അഭിസംബോധന ചെയ്തിരിക്കാമെന്ന സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: കർത്താവിന്റെ വരവും നമ്മുടെ ഒരുമിച്ചുകൂടലും തമ്മിലുള്ള ബന്ധം
  choice: രണ്ട് കാര്യങ്ങളെയും καί മുഖേന ഏകോപിപ്പിച്ചിരിക്കുന്നതുപോലെ നിലനിർത്തുന്നു
  alternative: അവന്റെ വരവിൽ നാം ഒരുമിച്ചുകൂടുന്നത്
  rationale: ഗ്രീക്ക് അവയുടെ കൃത്യമായ കാലപരമോ താർക്കികമോ ആയ ബന്ധം നിർവചിക്കുന്നില്ല. അതിനാൽ ഒരു പ്രത്യേക അന്ത്യകാലക്രമം പരിഭാഷയിൽ ചേർക്കാതെ യഥാർഥമായ അവ്യക്തത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ദീർഘമായ ഗ്രീക്ക് വാക്യഘടനയുടെ ഏകോപനം നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പദക്രമം ഉപയോഗിച്ചു. മുഖ്യപാഠത്തിലെ [a], [b] അടയാളങ്ങൾ അനുബന്ധ അടിക്കുറിപ്പുകളുമായി പൊരുത്തപ്പെടുന്നു.
