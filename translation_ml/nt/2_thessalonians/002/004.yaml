  source_fidelity: 'പ്രധാന അർഥഘടകങ്ങൾ കരട് സൂക്ഷിക്കുന്നു: എതിർപ്പ്, സകല വിളിക്കപ്പെടുന്ന ദൈവങ്ങൾക്കും ആരാധനാവിഷയങ്ങൾക്കും മീതെയുള്ള സ്വയോന്നതി, ദൈവത്തിന്റെ ആലയത്തിലെ ഇരിപ്പ്, ദൈവമാണെന്ന സ്വയം-അവതരണം എന്നിവയെല്ലാം ഉൾപ്പെട്ടിട്ടുണ്ട്. എങ്കിലും ‘സ്വയം കാണിച്ചുകൊള്ളുന്നു’ എന്ന പ്രയോഗം ἀποδεικνύντα ἑαυτόν എന്നതിന്റെ പൊതുപ്രകടന/സ്വയം-അവതരണ ആശയം അത്ര സ്വാഭാവികമായി നൽകുന്നില്ല; ‘കൊള്ളുന്നു’ ഇവിടെ അനാവശ്യമായ സ്വാർത്ഥ/സ്വയംലാഭ സൂചന ഉണ്ടാക്കാം.'
  naturalness: ‘ദൈവം എന്നു വിളിക്കപ്പെടുന്ന എല്ലാറ്റിനെയും ആരാധനാവിഷയമായ എല്ലാറ്റിനെയും’ എന്ന ആവർത്തനഘടന മനസ്സിലാക്കാവുന്നതാണ്, എന്നാൽ ‘ദൈവം എന്നു വിളിക്കപ്പെടുന്ന ഏതിനെയും ആരാധിക്കപ്പെടുന്ന ഏതിനെയും’ എന്നത് ആധുനിക നിലവാരമലയാളത്തിൽ കൂടുതൽ ഒഴുക്കുള്ളതും σέβασμαയുടെ വിശാലത കാത്തുസൂക്ഷിക്കുന്നതുമാണ്. അവസാനഭാഗത്ത് ‘തന്നെത്തന്നെ ദൈവമായി അവതരിപ്പിച്ചുകൊണ്ട്’ എന്നത് സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
  terminology: ‘ദൈവത്തിന്റെ ആലയം’ ναός-ന് യോജിച്ച, വ്യാഖ്യാനത്തെ മുൻകൂട്ടി നിശ്ചയിക്കാത്ത തിരഞ്ഞെടുപ്പാണ്. ‘ദൈവം’ എന്ന മുഖ്യവായനയും ‘ഒരു ദൈവം’ എന്ന അടിക്കുറിപ്പ്-വൈകല്യവും ഗ്രീക്കിലെ അനാർത്ര θεός-ന്റെ സന്ദർഭപരമായ ശക്തിയും ഭാഷാപരമായ സാധ്യതയും തുല്യമായി കൈകാര്യം ചെയ്യുന്നു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവയുടെ അനുബന്ധ പദങ്ങളോട് ശരിയായി ചേർത്തിരിക്കുന്നു.
