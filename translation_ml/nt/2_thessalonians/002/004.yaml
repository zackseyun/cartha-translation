  to: ദൈവം എന്നു വിളിക്കപ്പെടുന്ന ഏതിനെയും ആരാധിക്കപ്പെടുന്ന ഏതിനെയും എതിർക്കുകയും അവയ്‌ക്കെല്ലാം മീതെ തന്നെത്താൻ ഉയർത്തുകയും ചെയ്യുന്നവൻ; അങ്ങനെ അവൻ ദൈവത്തിന്റെ ആലയത്തിൽ[b] ഇരുന്നു, തന്നെത്തന്നെ ദൈവമായി അവതരിപ്പിച്ചുകൊള്ളുന്നു[a].
  rationale: പരിഷ്കരണം അർഥത്തിൽ മാറ്റം വരുത്തുന്നില്ല. σέβασμαയുടെ വ്യാപ്തി കൂടുതൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും, ἀποδεικνύντα ἑαυτόν എന്നതിലെ സ്വയം-അവതരണ/പ്രകടന ആശയം ‘തന്നെത്തന്നെ ദൈവമായി അവതരിപ്പിച്ചുകൊണ്ട്’ എന്നതിലൂടെ വ്യക്തമായി നൽകുകയും ചെയ്യുന്നു. ‘ദൈവം’/‘ഒരു ദൈവം’ എന്ന വിവർത്തനസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തിയിരിക്കുന്നു; ναός-ന് ‘ആലയം’ എന്ന മുഖ്യവായനയും ‘വിശുദ്ധമന്ദിരം’ എന്ന വൈകല്യവും സംരക്ഷിച്ചിരിക്കുന്നു.
