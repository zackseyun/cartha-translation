id: 2TH.2.4
reference: 2 Thessalonians 2:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ ἀντικείμενος καὶ ὑπεραιρόμενος ἐπὶ πάντα λεγόμενον θεὸν ἢ σέβασμα, ὥστε αὐτὸν εἰς τὸν ναὸν τοῦ ⸀θεοῦ καθίσαι ἀποδεικνύντα ἑαυτὸν ὅτι ἔστιν θεός.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/004.yaml
  text: the one who opposes and exalts himself over every so-called god or object of worship[a], so that he takes his seat in the temple of God[b], displaying himself as being God.
translation:
  language: ml
  text: ദൈവം എന്നു വിളിക്കപ്പെടുന്ന ഏതിനെയും ആരാധിക്കപ്പെടുന്ന ഏതിനെയും എതിർക്കുകയും അവയ്‌ക്കെല്ലാം മീതെ തന്നെത്താൻ ഉയർത്തുകയും ചെയ്യുന്നവൻ; അങ്ങനെ അവൻ ദൈവത്തിന്റെ ആലയത്തിൽ[b] ഇരുന്നു, തന്നെത്തന്നെ ദൈവമായി അവതരിപ്പിച്ചുകൊള്ളുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തന്നെത്തന്നെ ഒരു ദൈവമായി അവതരിപ്പിച്ചുകൊള്ളുന്നു.”
    reason: alternative_reading
  - marker: b
    text: “ദൈവത്തിന്റെ വിശുദ്ധമന്ദിരത്തിൽ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντικείμενος
  choice: എതിർക്കുകയും ചെയ്യുന്നവൻ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ വർത്തമാനകാല മധ്യവാചക കൃദന്തത്തിന്റെ നാമസദൃശ പ്രയോഗം; സാങ്കേതികമായ ഒരു പദവി ചേർക്കാതെ തുടരുന്ന എതിർപ്പിന്റെ ഭാവം നിലനിർത്തുന്നു.
- source_word: ὑπεραιρόμενος
  choice: മീതെ തന്നെത്താൻ ഉയർത്തുകയും ചെയ്യുന്നവൻ
  rationale: സ്വയം ഉയർത്തുന്ന ഭാവം വ്യക്തമായി നിലനിർത്തുകയും ἐπί സഹിതമുള്ള മേൽക്കോയ്മയുടെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐπὶ πάντα λεγόμενον θεὸν
  choice: ദൈവം എന്നു വിളിക്കപ്പെടുന്ന എല്ലാറ്റിനും മീതെ
  rationale: λεγόμενον എന്നത് അവ ദൈവമാണെന്ന് വിവർത്തകൻ അംഗീകരിക്കാതെ അവയ്ക്ക് നൽകപ്പെടുന്ന പേരിനെ മാത്രം സൂചിപ്പിക്കുന്നു; ἐπί ഇവിടെ സ്വയം ഉയർത്തുന്നതിന്റെ താരതമ്യപരമായ മേൽക്കോയ്മ പ്രകടമാക്കുന്നു.
- source_word: σέβασμα
  choice: ആരാധനാവിഷയമായ എല്ലാം
  rationale: ദേവതകളിൽ മാത്രം ഒതുങ്ങാതെ മതപരമായി വണങ്ങപ്പെടുന്ന ഏതൊരു വസ്തുവിനെയോ സത്തയെയോ ഉൾക്കൊള്ളുന്ന വിശാലമായ അർഥം സംരക്ഷിക്കുന്നു.
- source_word: ὥστε
  choice: അങ്ങനെ
  rationale: മുൻപറഞ്ഞ സ്വയം ഉയർത്തലിന്റെ ഫലമായി തുടർന്നുള്ള പ്രവൃത്തി സംഭവിക്കുന്നു എന്ന ബന്ധം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: εἰς τὸν ναὸν τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ ആലയത്തിൽ
  rationale: ναός ദേവാലയത്തെയോ അതിന്റെ വിശുദ്ധമന്ദിരത്തെയോ സൂചിപ്പിക്കാം; മുഖ്യപാഠത്തിലെ ‘ആലയം’ വ്യക്തവും വ്യാഖ്യാനസാധ്യതകളെ അനാവശ്യമായി ചുരുക്കാത്തതുമാണ്.
- source_word: καθίσαι
  choice: ഇരുന്ന്
  rationale: ആലയത്തിൽ സ്ഥാനം ഏറ്റിരിക്കുന്ന പ്രവൃത്തി ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ അറിയിക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത രാജാസനാരോഹണ ആശയം നിർബന്ധമായി ചേർക്കുന്നില്ല.
- source_word: ἀποδεικνύντα ἑαυτὸν
  choice: സ്വയം കാണിച്ചുകൊള്ളുന്നു
  rationale: വാക്കാൽ പ്രഖ്യാപിക്കുന്നു എന്നതിലുപരി പൊതുവായി സ്വയം അങ്ങനെ അവതരിപ്പിക്കുകയോ പ്രകടമാക്കുകയോ ചെയ്യുന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: ὅτι ἔστιν θεός
  choice: താൻ ദൈവമാണെന്ന്
  rationale: സന്ദർഭത്തിലെ പരമമായ ദൈവിക അവകാശവാദത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; ആർട്ടിക്കിളില്ലാത്ത θεός കാരണം ‘ഒരു ദൈവം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: അവസാനത്തെ θεός ‘ദൈവം’ എന്നോ ‘ഒരു ദൈവം’ എന്നോ പരിഭാഷപ്പെടുത്തണമോ
  choice: ദൈവം
  alternative: ഒരു ദൈവം
  rationale: ദൈവത്തിന്റെ ആലയത്തിൽ ഇരിക്കുന്നതുമായി ബന്ധപ്പെട്ട പരമമായ ദൈവിക അവകാശവാദമാണ് സന്ദർഭത്തിന്റെ ഉച്ചസ്ഥാനം. എങ്കിലും θεός ആർട്ടിക്കിളില്ലാത്തതിനാൽ ‘ഒരു ദൈവം’ എന്ന വായന ഭാഷാപരമായി സാധ്യമാണ്; അത് അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: ναός എന്നത് ‘ആലയം’ എന്നോ കൂടുതൽ സവിശേഷമായി ‘വിശുദ്ധമന്ദിരം’ എന്നോ നൽകണമോ
  choice: ദൈവത്തിന്റെ ആലയം
  alternative: ദൈവത്തിന്റെ വിശുദ്ധമന്ദിരം
  rationale: ναός ആലയത്തെയും പ്രത്യേകിച്ച് അതിന്റെ അകത്തെ വിശുദ്ധസ്ഥാനത്തെയും സൂചിപ്പിക്കാം. ‘ആലയം’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും ഈ സ്ഥലം അക്ഷരാർഥത്തിലോ രൂപകാർഥത്തിലോ ആണെന്ന തർക്കം മുൻകൂട്ടി തീർപ്പാക്കാത്തതുമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഈ വാക്യം മുൻവാക്യത്തിൽ ആരംഭിച്ച വിവരണത്തിന്റെ തുടർച്ചയായതിനാൽ ‘ചെയ്യുന്നവൻ’ എന്ന നാമസദൃശ ഘടന നിലനിർത്തി. വ്യാഖ്യാനപരമായി അധികഭാരമുള്ള സാങ്കേതിക പദവികളും രാജാസനാരോഹണ ഭാഷയും ഒഴിവാക്കി.
