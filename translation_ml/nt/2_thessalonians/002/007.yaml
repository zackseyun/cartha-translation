  to: അധർമ്മത്തിന്റെ രഹസ്യം ഇതിനകം പ്രവർത്തിച്ചുകൊണ്ടിരിക്കുന്നു. എന്നാൽ, ഇപ്പോൾ തടഞ്ഞുനിർത്തുന്നവൻ[a] വഴിയിൽനിന്ന് മാറുന്നതുവരെ[b] മാത്രമേ തടഞ്ഞുനിർത്തൽ തുടരുകയുള്ളു.
  rationale: The revision uses “രഹസ്യം” for the Pauline μυστήριον, replaces the intensified “ഇപ്പോൾത്തന്നെ” with “ഇതിനകം,” and recasts the elliptical final clause as a clear Malayalam statement that the restraining continues only until the unidentified restrainer is out of the way. It preserves the source's ambiguity regarding both the restrainer's identity and the agency, if any, of his departure.
