reference: 2 Thessalonians 2:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τὸ γὰρ μυστήριον ἤδη ἐνεργεῖται τῆς ἀνομίας· μόνον ὁ κατέχων ἄρτι ἕως ἐκ μέσου γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/007.yaml
  text: For the mystery of lawlessness is already at work[b][a]; only the one who now restrains will do so until he is out of the way.
translation:
  language: ml
  text: അധർമ്മത്തിന്റെ രഹസ്യം ഇതിനകം പ്രവർത്തിച്ചുകൊണ്ടിരിക്കുന്നു. എന്നാൽ, ഇപ്പോൾ തടഞ്ഞുനിർത്തുന്നവൻ[a] വഴിയിൽനിന്ന് മാറുന്നതുവരെ[b] മാത്രമേ തടഞ്ഞുനിർത്തൽ തുടരുകയുള്ളു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഇപ്പോൾ പിടിച്ചുനിർത്തുന്നവൻ’ എന്നും പരിഭാഷപ്പെടുത്താം; തടഞ്ഞുനിർത്തുന്നവൻ ആരാണെന്ന് ഗ്രീക്ക് വ്യക്തമാക്കുന്നില്ല.
    reason: alternative_reading
  - marker: b
    text: ‘നീക്കം ചെയ്യപ്പെടുന്നതുവരെ’ അല്ലെങ്കിൽ ‘വഴിയിൽനിന്ന് എടുത്തുമാറ്റപ്പെടുന്നതുവരെ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇത് എങ്ങനെ സംഭവിക്കുന്നു എന്നത് ഗ്രീക്കിൽ അത്ര വ്യക്തമല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: μυστήριον
  choice: മർമ്മം
  rationale: വെറുമൊരു കടങ്കഥ എന്നതിലുപരി, മറഞ്ഞിരുന്നെങ്കിലും ഇപ്പോൾ പ്രവർത്തനനിരതമായ യാഥാർഥ്യം എന്ന പൗലോസിന്റെ ആശയം നിലനിർത്തുന്നു.
- source_word: ἐνεργεῖται
  choice: പ്രവർത്തിച്ചുകൊണ്ടിരിക്കുന്നു
  rationale: ഇപ്പോൾത്തന്നെ നടന്നുകൊണ്ടിരിക്കുന്ന തുടർച്ചയായ പ്രവർത്തനത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀνομίας
  choice: അധർമ്മത്തിന്റെ
  rationale: ദൈവിക ക്രമത്തിനും നിയമത്തിനും എതിരായ നിലയെ സൂചിപ്പിക്കുന്ന ἀνομία എന്ന പദത്തിന്റെ നേരിട്ടുള്ളതും സന്ദർഭോചിതവുമായ പരിഭാഷയാണ്.
- source_word: μόνον
  choice: മാത്രമേ
  rationale: മുൻപ്രസ്താവനയെ പരിമിതപ്പെടുത്തുന്ന μόνον എന്ന പദത്തിന്റെ ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὁ κατέχων
  choice: തടഞ്ഞുനിർത്തുന്നവൻ
  rationale: പങ്കാളിയുടെ വ്യക്തിത്വം നിർണയിക്കാതെ κατέχω എന്നതിന്റെ തടയുക/പിടിച്ചുനിർത്തുക എന്ന സന്ദർഭാർഥം സംരക്ഷിക്കുന്നു.
- source_word: ἄρτι
  choice: ഇപ്പോൾ
  rationale: തടഞ്ഞുനിർത്തൽ വർത്തമാനകാലത്ത് നടക്കുന്നു എന്ന സമയസൂചന ലളിതമായി നൽകുന്നു.
- source_word: ἕως ἐκ μέσου γένηται
  choice: വഴിയിൽ ഇല്ലാതാകുന്നതുവരെ
  rationale: ആ വ്യക്തി തടസ്സമായി ഇനി നിലനിൽക്കാത്ത ഫലാവസ്ഥ വ്യക്തമാക്കുന്നു; ആരാണ് അയാളെ മാറ്റുന്നതെന്ന കാര്യം ഗ്രീക്ക് വ്യക്തമാക്കാത്തതിനാൽ അതിന് ഒരു കർത്താവിനെ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ὁ κατέχων എന്ന ‘തടഞ്ഞുനിർത്തുന്നവന്റെ’ വ്യക്തിത്വം
  choice: ‘ഇപ്പോൾ തടഞ്ഞുനിർത്തുന്നവൻ’ എന്ന് പൊതുവായി പരിഭാഷപ്പെടുത്തി വ്യക്തിത്വം നിർണയിക്കാതിരിക്കുന്നു.
  alternative: റോമൻ ഭരണകൂടം, മനുഷ്യഭരണം, പരിശുദ്ധാത്മാവ്, ഒരു ദൂതൻ, പൗലോസ് അല്ലെങ്കിൽ അപ്പൊസ്തലിക പ്രസംഗം എന്നിങ്ങനെ തിരിച്ചറിയുക.
  rationale: ഈ വാക്യത്തിലെ ഗ്രീക്ക് ഒരു തടഞ്ഞുനിർത്തുന്ന വ്യക്തിയെ പരാമർശിക്കുന്നുവെങ്കിലും അയാൾ ആരാണെന്ന് പറയുന്നില്ല; അതിനാൽ തർക്കവിഷയമായ അന്ത്യകാല വ്യാഖ്യാനം പരിഭാഷയിൽ അടിച്ചേൽപ്പിക്കുന്നില്ല.
- issue: ἕως ἐκ μέσου γένηται എന്നതിലെ പ്രവർത്തകത്വം
  choice: ഒരു ബാഹ്യ പ്രവർത്തകനെ വ്യക്തമാക്കാത്ത ‘വഴിയിൽ ഇല്ലാതാകുന്നതുവരെ’ എന്ന ഫലാവസ്ഥ ഉപയോഗിക്കുന്നു.
  alternative: ‘നീക്കം ചെയ്യപ്പെടുന്നതുവരെ’ അല്ലെങ്കിൽ ‘വഴിയിൽനിന്ന് എടുത്തുമാറ്റപ്പെടുന്നതുവരെ’.
  rationale: ഗ്രീക്ക് പ്രയോഗം അയാൾ മധ്യത്തിൽനിന്ന്/വഴിയിൽനിന്ന് പുറത്തായിരിക്കുന്ന അവസ്ഥയെ സൂചിപ്പിക്കാം; ആരാണ് അത് വരുത്തുന്നതെന്ന് വ്യക്തമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മർമ്മം’, ‘അധർമ്മം’ എന്നീ സ്ഥാപിത ദൈവശാസ്ത്രപദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വാക്യഘടനയിൽ ഉപയോഗിച്ചു; ഗ്രീക്കിലെ അപൂർണഘടന മലയാളത്തിൽ ‘അങ്ങനെ ചെയ്തുകൊണ്ടിരിക്കൂ’ എന്നു സ്വാഭാവികമായി പൂർത്തിയാക്കി.
