id: 2TH.2.16
reference: 2 Thessalonians 2:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ὁ κύριος ἡμῶν Ἰησοῦς Χριστὸς καὶ ⸀θεὸς ⸀ὁ πατὴρ ἡμῶν, ὁ ἀγαπήσας ἡμᾶς καὶ δοὺς παράκλησιν αἰωνίαν καὶ ἐλπίδα ἀγαθὴν ἐν χάριτι,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/016.yaml
  text: May our Lord Jesus the Messiah himself[a], and God our Father, who loved us and gave us eternal encouragement and good hope by grace,
translation:
  language: ml
  text: നമ്മുടെ കർത്താവായ യേശു മശീഹ തന്നെയും നമ്മുടെ പിതാവായ ദൈവവും—നമ്മെ സ്നേഹിക്കുകയും കൃപയാൽ നിത്യമായ പ്രോത്സാഹനവും[a] നല്ല പ്രത്യാശയും നൽകുകയും ചെയ്തവൻ—,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പ്രോത്സാഹനം” എന്നതിന് “ആശ്വാസം” അല്ലെങ്കിൽ “സാന്ത്വനം” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: παράκλησις എന്ന പദത്തിന്റെ സന്ദർഭസാധുവായ അർഥവികല്പങ്ങൾ അറിയിക്കാൻ.
lexical_decisions:
- source_word: Αὐτὸς
  choice: തന്നേ
  rationale: ഊന്നൽ നൽകുന്ന αὐτός എന്ന പദത്തിന്റെ ശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; ഇത് പിന്നാലെ പറയുന്ന സംയുക്ത കർത്താവിനെ ഊന്നിപ്പറയുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: ഇവിടെ δέ ശക്തമായ വൈരുധ്യമല്ല, മൃദുവായ വാക്യപരിവർത്തനമാണ്. ഒറ്റവാക്യഭാഗമായി വായിക്കുമ്പോൾ ‘ഇപ്പോൾ’ പോലൊരു കൃത്രിമ കാലസൂചകം ചേർക്കാതെ വാക്യഘടനയിലൂടെ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: κύριος
  choice: കർത്താവ്
  rationale: ക്രിസ്തുവിനെ സൂചിപ്പിക്കുന്ന κύριος എന്ന സ്ഥാനനാമത്തിന് സ്വാഭാവികവും സ്ഥാപിതവുമായ മലയാള തുല്യം.
- source_word: Ἰησοῦς Χριστὸς
  choice: യേശു മശീഹ
  rationale: Χριστός ഇവിടെ സ്ഥാനനാമത്തിന്റെ അർഥശക്തി നിലനിർത്തുന്നതിനാൽ ‘ക്രിസ്തു’ എന്ന പേരുരൂപത്തേക്കാൾ ‘മശീഹ’ എന്നു വിവർത്തനം ചെയ്യുന്നു.
- source_word: θεὸς ὁ πατὴρ ἡμῶν
  choice: നമ്മുടെ പിതാവായ ദൈവം
  rationale: θεός, πατήρ എന്നീ രണ്ടാശയങ്ങളും സ്വാഭാവികമായ മലയാളബന്ധത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὁ ἀγαπήσας
  choice: നമ്മെ സ്നേഹിക്കുകയും ... ചെയ്തവൻ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ ഭൂതകാല പങ്കാളിത്തരൂപത്തെ മലയാളത്തിൽ ബന്ധവാക്യമായി അവതരിപ്പിക്കുന്നു; ഏകവചനരൂപം നിലനിർത്തി ഗ്രീക്കിലെ വ്യാകരണപരമായ പ്രത്യേകത മായ്ച്ചുകളയുന്നില്ല.
- source_word: δοὺς
  choice: നൽകുകയും ചെയ്തവൻ
  rationale: ἀγαπήσας എന്നതിനോട് ചേർന്ന അഓറിസ്റ്റ് പങ്കാളിത്തരൂപത്തിന്റെ ലളിതമായ ഭൂതകാലപ്രവർത്തനം വ്യക്തമാക്കുന്നു.
- source_word: παράκλησιν
  choice: പ്രോത്സാഹനം
  rationale: വിശ്വാസികളെ ഉറപ്പിക്കുന്ന അടുത്ത സന്ദർഭത്തിന് ‘പ്രോത്സാഹനം’ യോജിക്കുന്നു; ‘ആശ്വാസം’, ‘സാന്ത്വനം’ എന്നീ സാധുവായ അർഥങ്ങൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: αἰωνίαν
  choice: നിത്യമായ
  rationale: പ്രോത്സാഹനത്തിന്റെ നിലനിൽക്കുന്ന സ്വഭാവവും വ്യാപ്തിയും സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: ἐλπίδα ἀγαθὴν
  choice: നല്ല പ്രത്യാശ
  rationale: ഗുണസൂചകമായ ഗ്രീക്ക് പ്രയോഗത്തെ അമിതവ്യാഖ്യാനം കൂടാതെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐν χάριτι
  choice: കൃപയാൽ
  rationale: ἐν ഇവിടെ മാർഗമോ അടിസ്ഥാനമോ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കി, വരങ്ങൾ കൃപയാൽ ലഭിച്ചതാണെന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: ‘നമ്മെ സ്നേഹിക്കുകയും ... നൽകുകയും ചെയ്തവൻ’ എന്ന ഏകവചന വിവരണം ‘കർത്താവായ യേശു മശീഹയും ... ദൈവവും’ എന്ന സംയുക്ത കർത്താവിനുശേഷം വരുന്നത്
  choice: ഗ്രീക്കിലെ സംയുക്ത കർത്താവിനുശേഷമുള്ള ഏകവചന വിവരണരൂപം മലയാളത്തിലും ‘ചെയ്തവൻ’ എന്നു നിലനിർത്തി; ആരെ മാത്രം സൂചിപ്പിക്കുന്നു എന്ന് വിശദീകരിച്ച് തീർപ്പാക്കിയില്ല.
  alternative: വിവരണം നമ്മുടെ പിതാവായ ദൈവത്തെ മാത്രം സൂചിപ്പിക്കുന്നതായി പുനഃക്രമീകരിക്കുക; അല്ലെങ്കിൽ ഇരുവരെയും വ്യക്തമായി സൂചിപ്പിക്കുന്ന ബഹുവചനരൂപം ഉപയോഗിക്കുക.
  rationale: മൂലപാഠത്തിന്റെ വ്യാകരണം ക്രിസ്തുവിനെയും പിതാവിനെയും ചേർത്ത് അവതരിപ്പിക്കുമ്പോഴും പിന്നാലെയുള്ള വിവരണം ഏകവചനത്തിലാണ്. വിവർത്തനം ഈ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം മായ്ച്ചുകളയുകയോ അതിൽനിന്ന് അധികമായ നിഗമനം നിർബന്ധിക്കുകയോ ചെയ്യരുത്.
- issue: 16-ാം വാക്യം 17-ാം വാക്യത്തിലെ ആശംസാപ്രാർഥനയിലേക്ക് തുടരുമെന്ന വാക്യഘടന
  choice: സ്വതന്ത്രമായ പൂർണവാക്യമാക്കാതെ അവസാനത്തിൽ തുടർച്ച സൂചിപ്പിച്ചു.
  alternative: ‘ഇടയാകട്ടെ’ പോലൊരു ക്രിയ 16-ാം വാക്യത്തിൽ മുൻകൂട്ടി ചേർത്ത് പൂർണവാക്യമാക്കുക.
  rationale: മൂലഗ്രീക്കിൽ ആശംസാപ്രാർഥനയുടെ പ്രധാന ക്രിയ അടുത്ത വാക്യത്തിലാണ്; അതിനെ ഈ വാക്യത്തിലേക്ക് മുൻകൂട്ടി ഇറക്കുമതി ചെയ്യാതിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായും ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. മൂലത്തിലെ ഊന്നലും ഏകവചന-സംയുക്തകർത്തൃ പിരിമുറുക്കവും നിലനിർത്താൻ ‘തന്നേ’, ‘ചെയ്തവൻ’ എന്നിവ ഉപയോഗിച്ചു. വാക്യം 17-ാം വാക്യത്തിൽ പൂർത്തിയാകുന്നതിനാൽ ഇവിടെ ഉദ്ദേശപൂർവം അപൂർണഘടന നിലനിർത്തിയിരിക്കുന്നു.
