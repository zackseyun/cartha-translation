  yaml_path: translation/nt/2_thessalonians/002/012.yaml
  text: so that all may be judged who did not believe the truth but took pleasure in unrighteousness[a].
translation:
  language: ml
  text: സത്യം വിശ്വസിക്കാതെ, മറിച്ച് അനീതിയിൽ ആനന്ദിച്ച എല്ലാവരും വിധിക്കപ്പെടേണ്ടതിന്[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘കുറ്റംവിധിക്കപ്പെടാൻ.’ ഗ്രീക്ക് ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘വിധിക്കപ്പെടാൻ’ എന്നതാണ്; എങ്കിലും ഈ സന്ദർഭത്തിൽ അത് പ്രതികൂലമായ വിധിയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ഇടയാകേണ്ടതിനാണ്
  rationale: മുൻവാക്യവുമായി ബന്ധിപ്പിക്കുന്ന ഉദ്ദേശ്യ/ഫല സൂചന നിലനിർത്തുന്നു; ഇവയിൽ ഒന്നിനെ മാത്രം നിർബന്ധമായി നിശ്ചയിക്കുന്നില്ല.
- source_word: κριθῶσιν
  choice: വിധിക്കപ്പെടാൻ
  rationale: κρίνω എന്ന ക്രിയയുടെ അടിസ്ഥാന ന്യായവിധി-അർഥം നിലനിർത്തുന്നു. സന്ദർഭം പ്രതികൂല വിധിയെ സൂചിപ്പിക്കുന്നുവെങ്കിലും മുഖ്യപാഠത്തിൽ ‘ശിക്ഷിക്കപ്പെടാൻ’ എന്നു കൂടുതൽ വ്യക്തമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: πάντες
  choice: എല്ലാവരും
  rationale: തുടർന്നുവരുന്ന കർത്തൃവാചക ക്രിയാവിശേഷണങ്ങളാൽ വിശേഷിപ്പിക്കപ്പെടുന്ന മുഴുവൻ ആളുകളെയും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: οἱ μὴ πιστεύσαντες
  choice: വിശ്വസിക്കാതെ
  rationale: നിഷേധത്തോടുകൂടിയ aorist participle-ന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘എല്ലാവരും’ എന്നതുമായി ചേർന്ന് ‘വിശ്വസിക്കാത്തവർ എല്ലാവരും’ എന്ന ആശയം വ്യക്തമാക്കുന്നു.
- source_word: τῇ ἀληθείᾳ
  choice: സത്യത്തിൽ
  rationale: πιστεύω-യോടുള്ള ദത്തിവിഭക്തി മലയാളത്തിലെ ‘-ത്തിൽ വിശ്വസിക്കുക’ എന്ന സ്വാഭാവിക പ്രയോഗത്തിലൂടെ നൽകുന്നു; നിർദിഷ്ടമായ സത്യത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: ἀλλὰ
  choice: …ആനന്ദിച്ച
  rationale: മലയാളത്തിലെ ‘-ആതെ …-ച്ച’ ഘടന സത്യത്തിൽ വിശ്വസിക്കാതിരുന്നതും അനീതിയിൽ ആനന്ദിച്ചതും തമ്മിലുള്ള ശക്തമായ വൈരുധ്യം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; പ്രത്യേകമായ ‘എന്നാൽ’ ചേർക്കുന്നത് ഇവിടെ ഭാരമുള്ളതാകും.
- source_word: εὐδοκήσαντες
  choice: ആനന്ദിച്ച
  rationale: വെറും അംഗീകാരത്തേക്കാൾ, അനീതിയോടുള്ള മനസ്സോടെയുള്ള പ്രസാദവും ഇഷ്ടവും പ്രകടമാക്കുന്നു.
- source_word: τῇ ἀδικίᾳ
  choice: അനീതിയിൽ
  rationale: ἀδικία എന്നതിലെ ധാർമികവും ദൈവശാസ്ത്രപരവുമായ വ്യാപ്തി നിലനിർത്തുന്നു; ‘അക്രമം’ എന്നതിലേക്കോ സാമൂഹിക ‘അന്യായം’ എന്നതിലേക്കോ മാത്രം അർഥം ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: κριθῶσιν എന്നത് ‘വിധിക്കപ്പെടുക’ എന്നോ കൂടുതൽ വ്യാഖ്യാനാത്മകമായി ‘ശിക്ഷാവിധി ലഭിക്കുക’ എന്നോ പരിഭാഷപ്പെടുത്തണോ
  choice: വിധിക്കപ്പെടാൻ
  alternative: ശിക്ഷാവിധി ലഭിക്കാൻ
  rationale: സന്ദർഭത്തിലെ വിധി പ്രതികൂലമാണെങ്കിലും κρίνω സ്വതവേ വിശാലമായ ‘വിധിക്കുക’ എന്ന അർഥമുള്ളതാണ്. അതിനാൽ മുഖ്യപാഠം പദത്തിന്റെ വ്യാപ്തി നിലനിർത്തുകയും സന്ദർഭത്തിലെ ശിക്ഷാത്മക സൂചന അടിക്കുറിപ്പിൽ അറിയിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ സാധാരണ മലയാളം. വാക്യം മുൻസന്ദർഭത്തോട് ആശ്രിതമായ ἵνα ഉപവാക്യമാണെന്നത് അവസാനത്തെ ‘ഇടയാകേണ്ടതിനാണ് അത്’ എന്ന ഘടനയിലൂടെ സൂചിപ്പിക്കുന്നു. ‘അനീതിയിൽ ആനന്ദിച്ച’ എന്ന പ്രയോഗം പൗലോസിന്റെ ധാർമിക വൈരുധ്യവും മൂലപാഠത്തിന്റെ ഭാവാത്മക ശക്തിയും നിലനിർത്തുന്നു.
