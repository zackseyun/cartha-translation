revisions:
- from: സത്യത്തിൽ വിശ്വസിക്കാതെ അനീതിയിൽ ആനന്ദിച്ച എല്ലാവരും വിധിക്കപ്പെടാൻ[a] ഇടയാകേണ്ടതിനാണ് അത്.
  to: സത്യം വിശ്വസിക്കാതെ, മറിച്ച് അനീതിയിൽ ആനന്ദിച്ച എല്ലാവരും വിധിക്കപ്പെടേണ്ടതിന്[a].
  rationale: The revision removes the unclear extraposed “അത്” construction and renders ἵνα with a direct Malayalam dependent clause. It explicitly preserves ἀλλά with “മറിച്ച്,” keeps κριθῶσιν as the non-overinterpreted “വിധിക്കപ്പെടേണ്ടതിന്,” and retains the contextual adverse sense in the footnote without making it the main-text meaning.
