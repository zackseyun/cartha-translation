id: 2TH.2.6
reference: 2 Thessalonians 2:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ νῦν τὸ κατέχον οἴδατε, εἰς τὸ ἀποκαλυφθῆναι αὐτὸν ἐν τῷ ⸀ἑαυτοῦ καιρῷ·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/006.yaml
  text: And now you know what is restraining him[b][a], so that he may be revealed in his own time.
translation:
  language: ml
  text: ഇപ്പോൾ, അവനെ തടഞ്ഞുനിർത്തുന്നതെന്തെന്ന് നിങ്ങൾക്കറിയാം[a]; അവൻ അവന്റെ സ്വന്തം സമയത്ത്[b] വെളിപ്പെടേണ്ടതിനാണ് അത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അവനെ പിടിച്ചുനിർത്തുന്നതെന്തെന്ന്.” ഇവിടെ ഗ്രീക്കിൽ നപുംസകലിംഗപ്രയോഗമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; തടഞ്ഞുനിർത്തുന്ന ഘടകം എന്താണെന്ന് ഈ വാക്യം തിരിച്ചറിയിക്കുന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “അവനായി നിശ്ചയിക്കപ്പെട്ട സമയത്ത്.” ഗ്രീക്ക് പ്രയോഗത്തിന് യോജിച്ചതോ നിശ്ചയിക്കപ്പെട്ടതോ ആയ സമയം എന്ന അർഥവും ഉണ്ടാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ κατέχον
  choice: തടഞ്ഞുനിർത്തുന്നത് എന്താണെന്ന്
  rationale: നപുംസകലിംഗത്തിലുള്ള നാമവൽക്കരിച്ച കൃതന്തത്തെ വ്യക്തിയോ ശക്തിയോ ആയി തിരിച്ചറിയാതെ അവതരിപ്പിക്കുന്നു. κατέχω എന്നതിന്റെ തടയുക/പിടിച്ചുനിർത്തുക എന്ന അർഥവും നിലനിർത്തുന്നു.
- source_word: οἴδατε
  choice: നിങ്ങൾക്കറിയാം
  rationale: വർത്തമാനാർഥമുള്ള പൂർണരൂപത്തിന് സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ മലയാളം; മുൻപു ലഭിച്ച അറിവിലേക്കുള്ള പൗലോസിന്റെ സൂചന നിലനിർത്തുന്നു.
- source_word: εἰς τὸ ἀποκαλυφθῆναι αὐτόν
  choice: അങ്ങനെ അവൻ ... വെളിപ്പെടും
  rationale: ഉദ്ദേശ്യം/ഫലം സൂചിപ്പിക്കുന്ന εἰς + നാമവൽക്കരിച്ച ക്രിയാരൂപത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; കർമണി ഭാവത്തിലുള്ള വെളിപ്പെടൽ നിലനിർത്തുന്നു.
- source_word: ἐν τῷ ἑαυτοῦ καιρῷ
  choice: തനിക്കുള്ള സമയത്ത്
  rationale: ἑαυτοῦ എന്ന സ്വയംസൂചകത്തിന്റെ ബന്ധവും καιρός എന്നതിലെ യോജിച്ചോ നിശ്ചയിക്കപ്പെട്ടോ ഉള്ള സമയസൂചനയും അതിരുകടന്ന് വ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്നു.
- source_word: νῦν
  choice: ഇപ്പോൾ
  rationale: ലളിതമായ കാലസൂചകത്തിന് സ്വാഭാവികമായ തുല്യപദം.
- source_word: αὐτόν
  choice: അവനെ / അവൻ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ വെളിപ്പെടാനിരിക്കുന്ന പുരുഷനെ സൂചിപ്പിക്കുന്ന പുല്ലിംഗ സർവനാമം നിലനിർത്തുന്നു; ആളുടെ തിരിച്ചറിയൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: തടഞ്ഞുനിർത്തുന്ന ഘടകത്തിന്റെയോ വ്യക്തിയുടെയോ തിരിച്ചറിയൽ
  choice: “തടഞ്ഞുനിർത്തുന്നത് എന്ത്” എന്നു നിഷ്പക്ഷമായി പരിഭാഷപ്പെടുത്തി, അതിനെ തിരിച്ചറിയുന്നില്ല.
  alternative: റോമൻ ഭരണക്രമം; പരിശുദ്ധാത്മാവ്; ഒരു ദൂതശക്തി; ദൈവത്തിന്റെ നിർണയം/പരിപാലനം
  rationale: ഈ വാക്യം തടഞ്ഞുനിർത്തുന്നതിനെ തിരിച്ചറിയുന്നില്ല; τὸ κατέχον നപുംസകലിംഗമായതിനാൽ ദീർഘകാലമായി തർക്കവിഷയമായ തിരിച്ചറിയൽ പരിഭാഷയിൽ തീരുമാനിക്കരുത്.
- issue: അന്ത്യകാലസന്ദർഭത്തിലെ καιρός എന്ന പദത്തിന്റെ ഭാവം
  choice: “തനിക്കുള്ള സമയത്ത്”
  alternative: “അവനായി നിശ്ചയിക്കപ്പെട്ട സമയത്ത്”; “യോജിച്ച സമയത്ത്”
  rationale: καιρός നിശ്ചിതമോ യോജിച്ചതോ ആയ സമയത്തെ സൂചിപ്പിക്കാമെങ്കിലും, മുഖ്യപാഠത്തിൽ അതിനെ കൂടുതൽ നിർദിഷ്ടമാക്കാതെ മൂലത്തിന്റെ തുറന്ന ഭാവം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി. “തടഞ്ഞുനിർത്തുക” സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും മൂലത്തിലെ അവ്യക്തത സംരക്ഷിക്കുന്നതുമാണ്. പ്രധാനപാഠത്തിലെ എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട വാക്കുകൾക്കു പിന്നാലെ നൽകിയിരിക്കുന്നു.
