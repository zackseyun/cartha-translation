reference: 2 Thessalonians 2:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἡμεῖς δὲ ὀφείλομεν εὐχαριστεῖν τῷ θεῷ πάντοτε περὶ ὑμῶν, ἀδελφοὶ ἠγαπημένοι ὑπὸ κυρίου, ὅτι εἵλατο ὑμᾶς ὁ θεὸς ⸀ἀπαρχὴν εἰς σωτηρίαν ἐν ἁγιασμῷ πνεύματος καὶ πίστει ἀληθείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/013.yaml
  text: But we ought always to give thanks to God for you[a], brothers beloved by the Lord, because God chose you as firstfruits for salvation through sanctification by the Spirit and faith in the truth[b],
translation:
  language: ml
  text: എന്നാൽ, കർത്താവിനാൽ സ്നേഹിക്കപ്പെട്ട സഹോദരങ്ങളേ[b], നിങ്ങളെക്കുറിച്ച് ദൈവത്തിന് എപ്പോഴും നന്ദി പറയുവാൻ ഞങ്ങൾ കടപ്പെട്ടിരിക്കുന്നു. എന്തെന്നാൽ, ആത്മാവിനാലുള്ള വിശുദ്ധീകരണത്തിലൂടെയും സത്യത്തിലുള്ള വിശ്വാസത്തിലൂടെയും രക്ഷയ്ക്കായി, ആദ്യഫലമായി[a] നിങ്ങളെ ദൈവം തിരഞ്ഞെടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ചില കൈയെഴുത്തുപ്രതികളിൽ: “രക്ഷയ്ക്കായി ആരംഭം മുതൽ ദൈവം നിങ്ങളെ തിരഞ്ഞെടുത്തു.” മുഖ്യപാഠം ἀπαρχήν (“ആദ്യഫലമായി”) എന്ന വായന പിന്തുടരുന്നു; പാഠഭേദത്തിൽ ἀπ’ ἀρχῆς (“ആരംഭം മുതൽ”) എന്നാണ്.'
    reason: textual_variant
  - marker: b
    text: “സഹോദരങ്ങളേ” എന്നത് ഗ്രീക്കിലെ പുരുഷലിംഗ ബഹുവചനമായ ἀδελφοί എന്നതിന്റെ പരിഭാഷയാണ്; ഈ സംബോധന മുഴുവൻ വിശ്വാസസമൂഹത്തെയും—സ്ത്രീകളെയും പുരുഷന്മാരെയും—ഉൾക്കൊള്ളാം.
    reason: cultural_note
lexical_decisions:
- source_word: Ἡμεῖς δὲ
  choice: എന്നാൽ, … ഞങ്ങൾ
  rationale: δέ മുൻവാക്യത്തിലെ നശിച്ചുപോകുന്നവരെക്കുറിച്ചുള്ള വിവരണത്തോട് വൈരുധ്യം സൂചിപ്പിക്കുന്നു; പ്രത്യക്ഷമായ Ἡμεῖς നൽകുന്ന ഊന്നൽ ‘ഞങ്ങൾ’ നിലനിർത്തുന്നു.
- source_word: ὀφείλομεν
  choice: പറയേണ്ടതാണ്
  rationale: ധാർമികമായ ബാധ്യതയെയും ഉചിതമായ കടമയെയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു; നിർബന്ധത്തിന്റെ അർഥം അമിതമാക്കുന്നില്ല.
- source_word: εὐχαριστεῖν τῷ θεῷ πάντοτε περὶ ὑμῶν
  choice: നിങ്ങളെക്കുറിച്ച് ഞങ്ങൾ എപ്പോഴും ദൈവത്തിന് നന്ദി പറയുക
  rationale: പൗലോസിന്റെ പതിവായ നന്ദിപ്രകടന ശൈലി സ്വാഭാവികമായി അവതരിപ്പിക്കുമ്പോൾ πάντοτε, τῷ θεῷ, περὶ ὑμῶν എന്നിവയുടെ അർഥം നിലനിർത്തുന്നു.
- source_word: ἀδελφοὶ
  choice: സഹോദരങ്ങളേ
  rationale: ഗ്രീക്കിലെ പുരുഷലിംഗ ബഹുവചനം നേരിട്ട് നിലനിർത്തുന്നു; വിശ്വാസസമൂഹത്തിലെ സ്ത്രീകളും ഈ സംബോധനയിൽ ഉൾപ്പെടാമെന്ന സാംസ്കാരിക സൂചന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἠγαπημένοι ὑπὸ κυρίου
  choice: കർത്താവിനാൽ സ്നേഹിക്കപ്പെട്ട
  rationale: പൂർണകാല നിഷ്ക്രിയ കൃദന്തത്തിന്റെ നിലനിൽക്കുന്ന സ്നേഹബന്ധം സൂക്ഷിക്കുകയും κύριος എന്നത് ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തുകയും ചെയ്യുന്നു.
- source_word: εἵλατο
  choice: തിരഞ്ഞെടുത്തു
  rationale: αἱρέομαι എന്നതിന്റെ മധ്യമപ്രയോഗത്തിലുള്ള ‘തിരഞ്ഞെടുക്കുക’ എന്ന നേരിട്ടുള്ള അർഥം നൽകുന്നു; ഒരു പ്രത്യേക തിരഞ്ഞെടുപ്പ്-സിദ്ധാന്തം കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: ἀπαρχὴν
  choice: ആദ്യഫലമായി
  rationale: SBLGNT-യിലെ അച്ചടിച്ച പാഠമായ ἀπαρχήν എന്നതിന്റെ വിളവെടുപ്പ്-രൂപകം നിലനിർത്തുന്നു; പ്രസിദ്ധമായ പാഠഭേദം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: εἰς σωτηρίαν
  choice: രക്ഷയ്ക്കായി
  rationale: εἰς സൂചിപ്പിക്കുന്ന ലക്ഷ്യത്തെയോ ഫലത്തെയോ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἐν ἁγιασμῷ πνεύματος
  choice: ആത്മാവിനാലുള്ള വിശുദ്ധീകരണത്തിലൂടെ
  rationale: ἐν എന്നതിന്റെ ഉപാധിസൂചന മലയാളത്തിൽ ‘-ലൂടെ’ കൊണ്ടും πνεύματος എന്നതിന്റെ പ്രവർത്തകബന്ധം ‘ആത്മാവിനാൽ’ കൊണ്ടും വ്യക്തമാക്കുന്നു; സന്ദർഭം പരിശുദ്ധാത്മാവിനെ ശക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: καὶ πίστει ἀληθείας
  choice: സത്യത്തിലുള്ള വിശ്വാസത്തിലൂടെ
  rationale: πίστις എന്നത് ‘വിശ്വാസം’ എന്നും ἀληθείας എന്ന ലക്ഷ്യസംബന്ധിയായ ഷഷ്ഠിയെ സ്വാഭാവികമായി ‘സത്യത്തിലുള്ള’ എന്നും നൽകുന്നു.
theological_decisions:
- issue: ἐν ἁγιασμῷ πνεύματος എന്നതിലെ πνεύματος ആരെ സൂചിപ്പിക്കുന്നു
  choice: പരിശുദ്ധാത്മാവ് എന്ന വ്യക്തിപരമായ അർഥം സൂചിപ്പിക്കുന്ന ‘ആത്മാവ്’
  alternative: മനുഷ്യന്റെ ആത്മാവ്
  rationale: രക്ഷയെ സംബന്ധിച്ച ഈ പൗലോസീയ സന്ദർഭത്തിൽ വിശുദ്ധീകരണത്തിന്റെ പ്രവർത്തകൻ പരിശുദ്ധാത്മാവാണെന്ന വായനയാണ് കൂടുതൽ സ്വാഭാവികം. എങ്കിലും ഗ്രീക്കിൽ ‘പരിശുദ്ധ’ എന്ന വിശേഷണം ഇവിടെ ഇല്ലാത്തതിനാൽ മുഖ്യപാഠത്തിൽ ‘പരിശുദ്ധാത്മാവ്’ എന്ന് വികസിപ്പിക്കാതെ ‘ആത്മാവ്’ എന്നു മാത്രം നൽകിയിരിക്കുന്നു.
- issue: εἵλατο ὑμᾶς ὁ θεὸς എന്നതിന്റെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തി
  choice: ദൈവം നിങ്ങളെ തിരഞ്ഞെടുത്തു
  alternative: ദൈവം നിങ്ങളെ നിയമിച്ചു / തനിക്കായി സ്വീകരിച്ചു
  rationale: വാക്യം പ്രസ്താവിക്കുന്ന ദൈവിക തിരഞ്ഞെടുപ്പ് നേരിട്ട് നിലനിർത്തുന്നു; തിരഞ്ഞെടുപ്പിന്റെ ക്രമമോ വ്യവസ്ഥകളോ സംബന്ധിച്ച ഒരു പ്രത്യേക സഭാപാരമ്പര്യ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: ἀπαρχὴν എന്ന മുഖ്യപാഠവും ἀπ’ ἀρχῆς എന്ന പാഠഭേദവും
  choice: മുഖ്യപാഠത്തിൽ ‘ആദ്യഫലമായി’
  alternative: ‘ആരംഭംമുതൽ’
  rationale: നൽകപ്പെട്ട SBLGNT പാഠത്തെ മുഖ്യപാഠത്തിൽ പിന്തുടരുന്നു; അർഥത്തിൽ പ്രധാന വ്യത്യാസമുണ്ടാക്കുന്ന പാഠഭേദം അടിക്കുറിപ്പിൽ സുതാര്യമായി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ആദ്യഫലം’, ‘വിശുദ്ധീകരണം’, ‘രക്ഷ’, ‘വിശ്വാസം’ എന്നീ ദൈവശാസ്ത്രപരമായി പ്രധാനപ്പെട്ട പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വാക്യഘടനയിൽ നിലനിർത്തി. ഗ്രീക്ക് പദക്രമം യാന്ത്രികമായി പകർത്താതെ, നന്ദിപ്രസ്താവനയും അതിന്റെ കാരണവും വ്യക്തമായി വേർതിരിച്ചു.
