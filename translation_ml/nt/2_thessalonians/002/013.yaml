- from: എന്നാൽ, കർത്താവിനാൽ സ്നേഹിക്കപ്പെട്ട സഹോദരങ്ങളേ[b], നിങ്ങളെക്കുറിച്ച് ഞങ്ങൾ എപ്പോഴും ദൈവത്തിന് നന്ദി പറയേണ്ടതാണ്. എന്തെന്നാൽ, ആത്മാവിനാലുള്ള വിശുദ്ധീകരണത്തിലൂടെയും സത്യത്തിലുള്ള വിശ്വാസത്തിലൂടെയും രക്ഷയ്ക്കായി ആദ്യഫലമായി[a] ദൈവം നിങ്ങളെ തിരഞ്ഞെടുത്തു.
