  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰς ⸀ὃ ἐκάλεσεν ὑμᾶς διὰ τοῦ εὐαγγελίου ἡμῶν, εἰς περιποίησιν δόξης τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/014.yaml
  text: to which he called you through our gospel[b][a], for obtaining the glory of our Lord Jesus the Messiah.
translation:
  language: ml
  text: അതിലേക്കാണ് അവൻ ഞങ്ങളുടെ സുവിശേഷത്തിലൂടെ നിങ്ങളെ വിളിച്ചത്—നമ്മുടെ കർത്താവായ യേശു മശീഹായുടെ മഹത്ത്വം പ്രാപിക്കേണ്ടതിന്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “മഹത്ത്വം പ്രാപിക്കേണ്ടതിന്” എന്നത് “മഹത്ത്വം കൈവശമാക്കേണ്ടതിന്” എന്നോ “മഹത്ത്വത്തിൽ പങ്കുചേരേണ്ടതിന്” എന്നോ പരിഭാഷപ്പെടുത്താം. “യേശു മശീഹാ” എന്നതിന് പരമ്പരാഗതമായി “യേശുക്രിസ്തു” എന്നും പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ὃ
  choice: അതിലേക്കാണ്
  rationale: മുൻവാക്യത്തിലെ രക്ഷയും ആത്മാവിനാലുള്ള വിശുദ്ധീകരണവും സത്യത്തിലുള്ള വിശ്വാസവും ഉൾപ്പെടുന്ന ആശയസമുച്ചയത്തിലേക്കു പിന്നോട്ടു ചൂണ്ടുകയും ലക്ഷ്യത്തിലേക്കുള്ള നീക്കം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐκάλεσεν
  choice: വിളിച്ചത്
  rationale: ദൈവത്തിന്റെ രക്ഷാകരമായ വിളിയെ സൂചിപ്പിക്കുന്ന പൗലോസിന്റെ പ്രയോഗം നിലനിർത്തുന്നു; അതിനെ വെറും ക്ഷണമെന്നോ ഒരു പ്രത്യേക ദൈവശാസ്ത്ര സംവിധാനത്തിലെ സാങ്കേതിക പദമെന്നോ ചുരുക്കുന്നില്ല.
- source_word: διὰ τοῦ εὐαγγελίου ἡμῶν
  choice: ഞങ്ങളുടെ സുവിശേഷത്തിലൂടെ
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന മാർഗം അഥവാ ഉപാധി വ്യക്തമാക്കുന്നു. ‘ഞങ്ങളുടെ സുവിശേഷം’ അപ്പൊസ്തലന്മാർ പ്രസംഗിച്ച സുവിശേഷമാണെന്ന പൗലോസിന്റെ ശൈലി നിലനിർത്തുന്നു.
- source_word: εἰς περιποίησιν
  choice: പ്രാപിക്കേണ്ടതിന്
  rationale: ലക്ഷ്യാർഥകമായ εἰς-നെയും περιποίησις എന്ന പദത്തിന്റെ നേടൽ/കൈവശമാക്കൽ എന്ന അർഥപരിധിയെയും സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ‘പങ്കുചേരേണ്ടതിന്’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: δόξης
  choice: മഹത്ത്വം
  rationale: കർത്താവായ യേശുവിനോടു ബന്ധപ്പെട്ട നിർദ്ദിഷ്ടമായ അന്തിമകാല മഹിമയെ സൂചിപ്പിക്കാൻ മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും ഗൗരവമുള്ളതുമായ പദം.
- source_word: τοῦ κυρίου ἡμῶν
  choice: നമ്മുടെ കർത്താവായ
  rationale: κύριος എന്ന സ്ഥാനപ്പേരിന്റെ ദൈവശാസ്ത്രപരമായ ഭാരവും സ്വാഭാവിക മലയാള വാക്യഘടനയും നിലനിർത്തുന്നു.
- source_word: Ἰησοῦ Χριστοῦ
  choice: യേശു മശീഹായുടെ
  rationale: Χριστός ഇവിടെ സ്ഥാനപ്പേരായി അർഥസജീവമായതിനാൽ ‘മശീഹാ’ എന്നു പരിഭാഷപ്പെടുത്തി; പരമ്പരാഗത ‘ക്രിസ്തു’ രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ രക്ഷാശാസ്ത്രത്തിൽ ദൈവവിളിയുടെ സ്വഭാവം
  choice: ‘വിളിച്ചത്’ എന്ന് മാത്രം പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ഫലപ്രദമായി വിളിച്ചത്’ / ‘ക്ഷണിച്ചത്’
  rationale: വാക്യം ദൈവം സുവിശേഷത്തിലൂടെ വിളിച്ചു എന്നു പറയുന്നു; വിളിയുടെ സ്വഭാവത്തെക്കുറിച്ചുള്ള ഒരു പ്രത്യേക വിഭാഗീയ വിശദീകരണം പരിഭാഷയിൽ ചേർക്കാതെയും അതിന്റെ രക്ഷാകരമായ ശക്തി ക്ഷയിപ്പിക്കാതെയും മൂലപദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
- issue: Χριστοῦ എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: പ്രധാനപാഠത്തിൽ ‘മശീഹാ’.
  alternative: ‘ക്രിസ്തു’
  rationale: ഇവിടെ പദം സ്ഥാനപ്പേരായി അർഥസജീവമാണ്. അതിനാൽ ‘മശീഹാ’ മുൻഗണന നേടുന്നു; സഭാപാരമ്പര്യത്തിൽ പരിചിതമായ രൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- issue: περιποίησις δόξης എന്ന ബന്ധത്തിന്റെ അർഥം
  choice: ‘മഹത്ത്വം പ്രാപിക്കേണ്ടതിന്’.
  alternative: ‘മഹത്ത്വം കൈവശമാക്കേണ്ടതിന്’ / ‘മഹത്ത്വത്തിൽ പങ്കുചേരേണ്ടതിന്’
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിന് നേടൽ, കൈവശം, പങ്കാളിത്തം എന്നിവയോട് ചേർന്ന അർഥസാധ്യതകളുണ്ട്. പ്രധാനപാഠം സ്വാഭാവികമായ പൊതുവായ അർഥം നൽകുന്നു; കൂടുതൽ വ്യാഖ്യാനാത്മകമായ സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അതിലേക്കാണ്’ മുൻവാക്യത്തിലേക്കുള്ള ബന്ധം വ്യക്തമാക്കുന്നു. ‘സുവിശേഷം’, ‘കർത്താവ്’, ‘മഹത്ത്വം’ എന്നീ പരിചിത പദങ്ങൾ നിലനിർത്തുമ്പോൾ ‘മശീഹാ’ Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ അർഥം തുറന്നുകാട്ടുന്നു.
