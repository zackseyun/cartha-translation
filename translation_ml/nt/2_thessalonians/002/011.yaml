    rationale: The Greek has a simple dative, ‘to/for them.’ Malayalam ‘അവർക്കു’ is both more direct and more idiomatic; ‘അവരുടെമേൽ’ can add an ‘upon them’ nuance not expressed by the dative alone.
  revised_text: ഇക്കാരണത്താൽ, ദൈവം അവർക്കു വ്യാമോഹത്തിന്റെ പ്രവർത്തനം[a] അയയ്ക്കുന്നു, അവർ ആ നുണ വിശ്വസിക്കേണ്ടതിന്.
