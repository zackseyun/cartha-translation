source:
  edition: SBLGNT
  text: καὶ διὰ τοῦτο ⸀πέμπει αὐτοῖς ὁ θεὸς ἐνέργειαν πλάνης εἰς τὸ πιστεῦσαι αὐτοὺς τῷ ψεύδει,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/011.yaml
  text: And because of this[a], God sends them a working of delusion so that they may believe the lie,
translation:
  language: ml
  text: ഇക്കാരണത്താൽ, ദൈവം അവർക്കു വ്യാമോഹത്തിന്റെ പ്രവർത്തനം[a] അയയ്ക്കുന്നു, അവർ ആ നുണ വിശ്വസിക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘തെറ്റിദ്ധരിപ്പിക്കുന്ന സ്വാധീനം,’ ‘വഞ്ചനയുടെ പ്രവർത്തനം’; പരമ്പരാഗതമായി ‘ശക്തമായ വ്യാമോഹം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: ഇക്കാരണത്താൽ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ സത്യത്തെ സ്നേഹിച്ച് സ്വീകരിക്കാതിരുന്നതിലേക്കു വ്യക്തമായി വിരൽചൂണ്ടുന്ന കാരണബന്ധം നിലനിർത്തുന്നു.
- source_word: πέμπει
  choice: അയയ്ക്കുന്നു
  rationale: വർത്തമാനകാല ക്രിയയെയും ദൈവത്തിന്റെ നേരിട്ടുള്ള പ്രവർത്തനത്തെയും മയപ്പെടുത്താതെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἐνέργειαν πλάνης
  choice: വ്യാമോഹത്തിന്റെ പ്രവർത്തനം
  rationale: ἐνέργεια, πλάνη എന്നീ രണ്ടു നാമങ്ങളും അവയുടെ ജനിറ്റീവ് ബന്ധവും സുതാര്യമായി നിലനിർത്തുന്നു; തെറ്റിദ്ധരിപ്പിക്കുന്ന ഒരു സ്വാധീനമോ വ്യാമോഹസ്വഭാവമുള്ള ഫലപ്രദമായ പ്രവർത്തനമോ എന്ന സൂക്ഷ്മമായ അർഥവ്യാപ്തി അടച്ചുപൂട്ടുന്നില്ല.
- source_word: εἰς τὸ πιστεῦσαι
  choice: വിശ്വസിക്കേണ്ടതിന്
  rationale: ഗ്രീക്കിലുള്ള ഉദ്ദേശ്യ/ഫല അർഥം രണ്ടും അനുവദിക്കുന്ന വിധത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: τῷ ψεύδει
  choice: ആ നുണ
  rationale: നിശ്ചയാർഥക ലേഖനത്തോടുകൂടിയ ഏകവചനത്തിന്റെ പ്രത്യേകത നിലനിർത്തുകയും സന്ദർഭത്തിലെ നിർദിഷ്ട വ്യാജത്തോട് ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ന്യായവിധിസ്വഭാവമുള്ള കാഠിന്യത്തിൽ ദൈവത്തിന്റെ പ്രവർത്തനം
  choice: ദൈവം അവരുടെമേൽ ... അയയ്ക്കുന്നു
  alternative: ദൈവം ... വരാൻ അനുവദിക്കുന്നു / ദൈവം അവരെ വ്യാമോഹത്തിന് ഏല്പിക്കുന്നു
  rationale: ഗ്രീക്കിൽ ദൈവമാണ് πέμπει എന്ന ക്രിയയുടെ വ്യക്തമായ കർത്താവ്. അതിനെ വെറും അനുവാദമായി മയപ്പെടുത്താതെ, മനുഷ്യർ സത്യത്തെ നിരസിക്കുന്നതിനോടുള്ള ദൈവിക ന്യായവിധിയുടെ സംഘർഷഭരിതമായ പ്രസ്താവന അതേപടി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. ‘വ്യാമോഹത്തിന്റെ പ്രവർത്തനം’ സാധാരണ സംഭാഷണത്തിൽ അല്പം അസാധാരണമെങ്കിലും ഗ്രീക്കിലെ രണ്ടു നാമങ്ങളുടെയും ബന്ധവും യഥാർഥമായ അർഥസന്ദിഗ്ധതയും ഉദ്ദേശപൂർവം സംരക്ഷിക്കുന്നു. വായനാസൗകര്യത്തിനായി ‘അവരുടെമേൽ’ ചേർത്തിരിക്കുന്നു; ഇത് അയയ്ക്കപ്പെടുന്നവർ αὐτοῖς ആണെന്ന ദാതിവ്യാകരണബന്ധം വ്യക്തമാക്കുന്നു.
