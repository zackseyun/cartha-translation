id: 2TH.2.3
reference: 2 Thessalonians 2:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μή τις ὑμᾶς ἐξαπατήσῃ κατὰ μηδένα τρόπον· ὅτι ἐὰν μὴ ἔλθῃ ἡ ἀποστασία πρῶτον καὶ ἀποκαλυφθῇ ὁ ἄνθρωπος τῆς ⸀ἀνομίας, ὁ υἱὸς τῆς ἀπωλείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/003.yaml
  text: Let no one deceive you in any way[a], because that day will not come unless the rebellion comes first and the man of lawlessness is revealed[b], the son of destruction.
translation:
  language: ml
  text: ആരും നിങ്ങളെ ഒരു വിധത്തിലും വഞ്ചിക്കരുത്. എന്തെന്നാൽ, ആദ്യം കലാപം[a] സംഭവിക്കുകയും അധർമ്മത്തിന്റെ മനുഷ്യൻ[b]—നാശത്തിന്റെ പുത്രൻ—വെളിപ്പെടുകയും ചെയ്യാതെ ആ ദിവസം വരികയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വിശ്വാസത്യാഗം’ എന്നോ ‘വിട്ടുമാറൽ’ എന്നോ വിവർത്തനം ചെയ്യാം. ഗ്രീക്കുപദം നിർണായകമായ ഒരു കലാപത്തെ സൂചിപ്പിക്കാം; പലപ്പോഴും മതപരമായ വിശ്വാസത്യാഗമായും ഇതിനെ മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘അധർമ്മത്തിന്റെ മനുഷ്യൻ’ എന്നതിനു പകരം ‘പാപത്തിന്റെ മനുഷ്യൻ’ എന്നു കാണുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: ἐξαπατήσῃ
  choice: വഞ്ചിക്കരുത്
  rationale: വഞ്ചിക്കുക, വഴിതെറ്റിക്കുക എന്നീ അർഥങ്ങളുള്ള ക്രിയയാണ്. മുന്നറിയിപ്പിന്റെ സന്ദർഭത്തിൽ ‘വഞ്ചിക്കുക’ സ്വാഭാവികവും കൃത്യവുമാണ്; ഉപസർഗത്തിന്റെ തീവ്രത അനാവശ്യമായി അതിവിവർത്തനം ചെയ്യുന്നില്ല.
- source_word: κατὰ μηδένα τρόπον
  choice: ഒരു വിധത്തിലും
  rationale: വഞ്ചനയുടെ യാതൊരു രീതിക്കും വഴങ്ങരുതെന്ന വിലക്ക് ശക്തമാക്കുന്ന പ്രയോഗം. ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: ὅτι
  choice: എന്തെന്നാൽ
  rationale: മുൻപുള്ള വിലക്കിന്റെ കാരണം അവതരിപ്പിക്കുന്ന ബന്ധപദമായി ഗ്രഹിച്ചു. വാക്യങ്ങൾ തമ്മിലുള്ള യുക്തിബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: ἐὰν μὴ ἔλθῃ
  choice: ചെയ്യാതെ ആ ദിവസം വരികയില്ല
  rationale: മുൻവാക്യത്തിൽ പരാമർശിച്ച കർത്താവിന്റെ ദിവസമാണ് ഗ്രീക്കിൽ സൂചിതമായ കർത്താവ്. മലയാളത്തിലെ വ്യക്തതയ്ക്കായി ‘ആ ദിവസം’ എന്നു പൂരിപ്പിച്ചു; തുടർന്നുള്ള സംഭവങ്ങൾ അതിനു മുമ്പുള്ള അനിവാര്യ വ്യവസ്ഥകളാണെന്ന ഘടന നിലനിർത്തി.
- source_word: ἀποστασία
  choice: കലാപം
  rationale: ഈ പദത്തിന് കലാപം, വിപ്ലവം, വിശ്വാസത്യാഗം എന്നിങ്ങനെ അർഥവ്യാപ്തിയുണ്ട്. ‘കലാപം’ നിർണായകമായ എതിർപ്പിനെയോ വിട്ടുമാറലിനെയോ വിശാലമായി സൂചിപ്പിക്കുകയും മതപരമായ ഒരു വ്യാഖ്യാനത്തിലേക്ക് വാചകത്തെ മുൻകൂട്ടി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: πρῶτον
  choice: ആദ്യം
  rationale: സംഭവങ്ങളുടെ ക്രമം നേരിട്ട് സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള പദം.
- source_word: ἀποκαλυφθῇ
  choice: വെളിപ്പെടുകയും
  rationale: ആ വ്യക്തി പ്രകടമാകുന്നു എന്ന കർമണിപ്രയോഗത്തിന്റെ ആശയം നിലനിർത്തുന്നു; വെളിപ്പാടുസംബന്ധമായ ധ്വനിയും സംരക്ഷിക്കുന്നു.
- source_word: ὁ ἄνθρωπος τῆς ἀνομίας
  choice: അധർമ്മത്തിന്റെ മനുഷ്യൻ
  rationale: SBLGNTയിലെ ἀνομίας എന്ന പാഠത്തെ നേരിട്ട് പിന്തുടരുന്നു. ഏകവചന പുല്ലിംഗം ഒരു പ്രത്യേക വ്യക്തിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘മനുഷ്യൻ’ നിലനിർത്തി.
- source_word: ὁ υἱὸς τῆς ἀπωλείας
  choice: നാശത്തിന്റെ പുത്രൻ
  rationale: നാശത്താൽ സ്വഭാവനിർണയം ചെയ്യപ്പെട്ടവനെയോ നാശത്തിനു വിധിക്കപ്പെട്ടവനെയോ സൂചിപ്പിക്കാവുന്ന സെമിറ്റിക് ശൈലിയിലുള്ള പ്രയോഗം. വ്യാഖ്യാനം ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കാതെ ഗ്രീക്ക് രൂപം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ‘വരികയില്ല’ എന്ന ക്രിയയുടെ ഗ്രീക്കിൽ സൂചിതമായ കർത്താവിനെ പൂരിപ്പിക്കൽ
  choice: ഉടൻമുമ്പുള്ള സന്ദർഭത്തിൽനിന്ന് ‘ആ ദിവസം’ എന്നു വ്യക്തമാക്കി
  alternative: ‘ആദ്യം കലാപം സംഭവിക്കാതെ…’ എന്ന അപൂർണഘടന അതേപടി വിടുക
  rationale: 2-ാം വാക്യത്തിലെ കർത്താവിന്റെ ദിവസമാണ് സൂചിതമായത്. മലയാളത്തിൽ ആശയക്കുഴപ്പവും അപൂർണതയും ഒഴിവാക്കാൻ കർത്താവിനെ പൂരിപ്പിച്ചു; ഇത് സന്ദർഭത്തിനു പുറത്തുള്ള വ്യാഖ്യാനച്ചേർക്കലല്ല.
- issue: ἀποστασία എന്ന പദത്തിന്റെ അർഥം
  choice: വിശാലമായ അർഥത്തിൽ ‘കലാപം’
  alternative: ‘വിശ്വാസത്യാഗം’ അല്ലെങ്കിൽ ‘വിട്ടുമാറൽ’
  rationale: പദം പൊതുവായ കലാപത്തെയോ മതപരമായ വിശ്വാസത്യാഗത്തെയോ സൂചിപ്പിക്കാം. വിവാദമായ അന്ത്യകാല വ്യാഖ്യാനം മുൻകൂട്ടി തീർപ്പാക്കാതിരിക്കാൻ പ്രധാനവാചകത്തിൽ വിശാലമായ പദം ഉപയോഗിക്കുകയും മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
- issue: τῆς ἀνομίας എന്നിടത്തെ പാഠഭേദം
  choice: SBLGNT അനുസരിച്ച് ‘അധർമ്മത്തിന്റെ’
  alternative: ചില കൈയെഴുത്തുപ്രതികളിലെ ‘പാപത്തിന്റെ’
  rationale: നൽകിയിരിക്കുന്ന മൂലപാഠം ἀνομίας എന്നാണ്. പ്രസിദ്ധമായ ἁμαρτίας പാഠഭേദം പരിശോധനാസൗകര്യത്തിനായി അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- issue: ὁ υἱὸς τῆς ἀπωλείας എന്ന പ്രയോഗത്തിന്റെ വ്യാഖ്യാനം
  choice: രൂപസാദൃശ്യം നിലനിർത്തി ‘നാശത്തിന്റെ പുത്രൻ’
  alternative: ‘നാശത്തിനു വിധിക്കപ്പെട്ടവൻ’
  rationale: ഈ പ്രയോഗം നാശത്താൽ സ്വഭാവനിർണയം ചെയ്യപ്പെട്ടവൻ എന്നും നാശത്തിനു വിധിക്കപ്പെട്ടവൻ എന്നും ഗ്രഹിക്കാം. പ്രധാനവാചകത്തിൽ രൂപകം നിലനിർത്തുന്നത് യഥാർഥമായ അർഥതുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി സ്വീകരിച്ചു. ‘നാശത്തിന്റെ പുത്രൻ’ എന്ന സെമിറ്റിക് രൂപകം ഉദ്ദേശപൂർവം നിലനിർത്തി. നീണ്ട ഗ്രീക്ക് വാക്യത്തിന്റെ മുന്നറിയിപ്പും കാരണവും മലയാളത്തിൽ വ്യക്തമായി വേർതിരിക്കാൻ പൂർണവിരാമം ഉപയോഗിച്ചു; ആശയബന്ധം ‘എന്തെന്നാൽ’ വഴി സംരക്ഷിച്ചു.
