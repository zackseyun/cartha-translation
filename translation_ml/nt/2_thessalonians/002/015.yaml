id: 2TH.2.15
reference: 2 Thessalonians 2:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἄρα οὖν, ἀδελφοί, στήκετε, καὶ κρατεῖτε τὰς παραδόσεις ἃς ἐδιδάχθητε εἴτε διὰ λόγου εἴτε δι’ ἐπιστολῆς ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/015.yaml
  text: So then[a], brothers, stand firm and hold fast to the traditions that you were taught, whether by word or by our letter.
translation:
  language: ml
  text: അതുകൊണ്ട്, സഹോദരന്മാരേ,[a] ഉറച്ചുനിൽക്കുകയും വാക്കിലൂടെയോ ഞങ്ങളുടെ ലേഖനത്തിലൂടെയോ നിങ്ങൾക്കു പഠിപ്പിച്ചുതന്ന പാരമ്പര്യങ്ങളെ മുറുകെപ്പിടിക്കുകയും ചെയ്യുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സഹോദരീസഹോദരന്മാരേ”; ഗ്രീക്കിൽ “സഹോദരന്മാരേ” എന്നാണ്, എന്നാൽ ഇവിടെ മുഴുവൻ സഭാസമൂഹത്തെയായിരിക്കാം അഭിസംബോധന ചെയ്യുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനത്തെ സൂചിപ്പിക്കുന്ന ഇരട്ട അനുമാനകണങ്ങളുടെ ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചന സംബോധനയെ രൂപപരമായി നിലനിർത്തുന്നു; മുഴുവൻ സഭയെയും ഉദ്ദേശിച്ചിരിക്കാമെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: στήκετε
  choice: ഉറച്ചുനിൽക്കുക
  rationale: തുടർച്ചയായ സ്ഥിരതയും അചഞ്ചലതയും ആവശ്യപ്പെടുന്ന വർത്തമാനകാല ആജ്ഞയുടെ ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: κρατεῖτε
  choice: മുറുകെപ്പിടിക്കുക
  rationale: ലഭിച്ച ഉപദേശങ്ങളെ ദൃഢമായി കാത്തുസൂക്ഷിക്കുകയും അവയിൽ നിലനിൽക്കുകയും ചെയ്യുക എന്ന ശക്തമായ അർഥം പകരുന്നു.
- source_word: παραδόσεις
  choice: പാരമ്പര്യങ്ങൾ
  rationale: കൈമാറിക്കിട്ടിയ കാര്യങ്ങൾ എന്ന παράδοσις എന്ന പദത്തിന്റെ അടിസ്ഥാനാർഥം സംരക്ഷിക്കുന്നു; വെറും ‘ഉപദേശങ്ങൾ’ എന്നു ചുരുക്കുന്നില്ല.
- source_word: ἐδιδάχθητε
  choice: നിങ്ങൾക്കു പഠിപ്പിച്ചുതന്ന
  rationale: വായനക്കാർ സ്വീകരിച്ച അപ്പൊസ്തോലിക പ്രബോധനത്തെ സൂചിപ്പിക്കുന്ന കർമണി രൂപം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: διὰ λόγου
  choice: വാക്കിലൂടെ
  rationale: ലേഖനത്തോടുള്ള വൈരുധ്യം മൂലം വ്യക്തമാകുന്ന വാചിക ആശയവിനിമയത്തെ സംക്ഷിപ്തമായി പ്രകടമാക്കുന്നു.
- source_word: δι’ ἐπιστολῆς ἡμῶν
  choice: ഞങ്ങളുടെ ലേഖനത്തിലൂടെ
  rationale: എഴുത്തിലൂടെയുള്ള അപ്പൊസ്തോലിക പ്രബോധനവും ἡμῶν എന്ന ഉടമസ്ഥതാഭാവവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: അപ്പൊസ്തോലിക പാരമ്പര്യത്തെക്കുറിച്ചുള്ള ചർച്ചകളിൽ ഉപയോഗിക്കപ്പെടുന്ന παράδοσις എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: പാരമ്പര്യങ്ങൾ
  alternative: ഉപദേശങ്ങൾ / നിർദേശങ്ങൾ
  rationale: വാചികമായും ലിഖിതമായും കൈമാറപ്പെട്ട കാര്യങ്ങളെയാണ് ഗ്രീക്ക് പദം സൂചിപ്പിക്കുന്നത്. ‘പാരമ്പര്യങ്ങൾ’ എന്നത് ഈ കൈമാറ്റഭാവം സംരക്ഷിക്കുന്നു; എന്നാൽ പിൽക്കാല സഭാപാരമ്പര്യങ്ങളുടെ വ്യാപ്തിയെയോ അധികാരത്തെയോ കുറിച്ചുള്ള ഏതെങ്കിലും വിഭാഗീയ നിലപാട് വാക്യത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: സമ്മിശ്ര സഭാസമൂഹത്തെ ഉദ്ദേശിച്ചിരിക്കാവുന്ന ἀδελφοί എന്ന സംബോധന
  choice: സഹോദരന്മാരേ
  alternative: സഹോദരീസഹോദരന്മാരേ
  rationale: മൂലത്തിലെ പുല്ലിംഗരൂപം മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു; അഭിസംബോധന മുഴുവൻ വിശ്വാസിസമൂഹത്തെയും ഉൾക്കൊള്ളാൻ സാധ്യതയുള്ളത് അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ഉറച്ചുനിൽക്കുക’, ‘മുറുകെപ്പിടിക്കുക’ എന്നീ സമാന്തര ആജ്ഞകൾ മൂലത്തിലെ ഊന്നൽ നിലനിർത്തുന്നു; ‘പാരമ്പര്യങ്ങൾ’ എന്ന പദം മതവിഭാഗീയ വ്യാഖ്യാനം ചേർക്കാതെ കൈമാറിക്കിട്ടിയ അപ്പൊസ്തോലിക ഉള്ളടക്കത്തെ സൂചിപ്പിക്കുന്നു.
