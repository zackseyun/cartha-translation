  to: അവന്റെ വരവ് സാത്താന്റെ പ്രവർത്തനത്തിനനുസരിച്ചുള്ളതാണ്[a]; അത് വ്യാജത്തിന്റെ സകല ശക്തിയോടും അടയാളങ്ങളോടും അത്ഭുതങ്ങളോടും കൂടെയുള്ളതാണ്[b].
  rationale: പരിഷ്കരണം ψεύδους-ന്റെ ബന്ധവ്യാപ്തിയെ മുഖ്യപാഠത്തിൽ ചുരുക്കാതെ നിലനിർത്തുകയും, അത്ഭുതങ്ങൾ കേവലം വ്യാജമാണെന്നോ കൃത്രിമമാണെന്നോ തീർപ്പാക്കാതിരിക്കുകയും ചെയ്യുന്നു. ‘ആയിരിക്കും’ എന്നതിനു പകരം ‘ഉള്ളതാണ്’ ഉപയോഗിച്ച് ἐστιν-ന്റെ വർത്തമാനകാല രൂപവും പ്രതിഫലിപ്പിക്കുന്നു.
