  source_fidelity: ‘വ്യാജം നിറഞ്ഞ’ എന്ന വിശേഷണം നിലവിലെ വാചകത്തിൽ ‘അത്ഭുതങ്ങൾ’ക്കു മാത്രമായി ചുരുങ്ങുന്നു; എന്നാൽ ψεύδους എന്ന ജനിറ്റീവ് ‘അടയാളങ്ങളും അത്ഭുതങ്ങളും’ (ഒരുപക്ഷേ മുഴുവൻ ത്രയവും) സ്വഭാവപ്പെടുത്താവുന്ന തുറന്ന ബന്ധം നിലനിർത്തണം. കൂടാതെ ഗ്രീക്കിലെ വർത്തമാനകാല ἐστιν-നോടു പൊരുത്തപ്പെടാൻ ‘ആയിരിക്കും’ എന്ന ഭാവികാലം ഒഴിവാക്കുന്നത് ഉചിതമാണ്.
  naturalness: പരിഷ്കരിച്ച വാചകം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്. ‘വ്യാജത്തിന്റെ …’ എന്ന ഘടന അല്പം ഔപചാരികമാണെങ്കിലും, മൂലത്തിലെ ജനിറ്റീവ് ബന്ധവും അതിന്റെ വ്യാപ്തിയിലെ അവ്യക്തതയും സംരക്ഷിക്കാൻ ഇത് അനുയോജ്യമാണ്.
  terminology: ‘വരവ്,’ ‘സാത്താൻ,’ ‘പ്രവർത്തനം,’ ‘ശക്തി,’ ‘അടയാളങ്ങൾ,’ ‘അത്ഭുതങ്ങൾ’ എന്നിവ യോജിച്ച പുതിയനിയമ പദപ്രയോഗങ്ങളാണ്. ‘വ്യാജത്തിന്റെ’ എന്നത് പ്രതിഭാസങ്ങൾ കേവലം കൃത്രിമമാണെന്ന വ്യാഖ്യാനം അടിച്ചേൽപ്പിക്കാതെ ψεύδους-ന്റെ ഔപചാരിക ബന്ധം നിലനിർത്തുന്നു.
