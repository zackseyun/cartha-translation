  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὗ ἐστιν ἡ παρουσία κατ’ ἐνέργειαν τοῦ Σατανᾶ ἐν πάσῃ δυνάμει καὶ σημείοις καὶ τέρασιν ψεύδους
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/009.yaml
  text: whose coming is according to the working of Satan[b][a], with all power and signs and wonders of falsehood.
translation:
  language: ml
  text: അവന്റെ വരവ് സാത്താന്റെ പ്രവർത്തനത്തിനനുസരിച്ചുള്ളതാണ്[a]; അത് വ്യാജത്തിന്റെ സകല ശക്തിയോടും അടയാളങ്ങളോടും അത്ഭുതങ്ങളോടും കൂടെയുള്ളതാണ്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവന്റെ സാന്നിധ്യം/എത്തിച്ചേരൽ സാത്താന്റെ പ്രവർത്തനത്തിനനുസരിച്ചുള്ളതാണ്.”
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “വ്യാജത്തിന്റെ സകല ശക്തിയോടും അടയാളങ്ങളോടും അത്ഭുതങ്ങളോടും കൂടെ.” ‘വ്യാജത്തിന്റെ’ എന്നത് അടയാളങ്ങളെയും അത്ഭുതങ്ങളെയും—ഒരുപക്ഷേ ഈ മുഴുവൻ നിരയെയും—സ്വഭാവപ്പെടുത്താം; ഇവ വെറും കൃത്രിമങ്ങളാണോ വഞ്ചനയ്ക്കായി ഉപയോഗിക്കുന്ന പ്രതിഭാസങ്ങളാണോ എന്നു വാക്യം നിർണയിക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ
  choice: അവന്റെ
  rationale: മുൻവാക്യത്തിലെ ‘അധർമി’യെ സൂചിപ്പിക്കുന്ന ബന്ധസർവനാമത്തിന്റെ ഷഷ്ഠിവിഭക്തിബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: παρουσία
  choice: വരവ്
  rationale: അന്ത്യകാലസന്ദർഭത്തിൽ ഒരു വ്യക്തിയുടെ ആഗമനം അഥവാ എത്തിച്ചേരൽ സൂചിപ്പിക്കുന്നു; ‘സാന്നിധ്യം’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: κατ’ ἐνέργειαν
  choice: പ്രവർത്തനത്തിന് അനുസൃതമായി
  rationale: സാത്താന്റെ സജീവമായ പ്രവർത്തനത്തോടു പൊരുത്തപ്പെടുന്ന രീതിയിലാണ് ഈ വരവ് സംഭവിക്കുന്നതെന്ന ആശയം വ്യക്തമാക്കുന്നു.
- source_word: τοῦ Σατανᾶ
  choice: സാത്താന്റെ
  rationale: പുതിയ നിയമത്തിൽ പതിവായ പേരിന്റെ ലിപ്യന്തരണം ഉപയോഗിക്കുകയും പ്രവർത്തനം സാത്താനുമായി ബന്ധപ്പെട്ടതാണെന്ന ഷഷ്ഠിവിഭക്തി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐν πάσῃ δυνάμει
  choice: സകല ശക്തിയോടും
  rationale: ἐν ഇവിടെ അനുബന്ധമോ ഉപകരണമോ സൂചിപ്പിക്കുന്നു; δύναμις എന്നത് ‘അത്ഭുതപ്രവൃത്തി’ എന്നു ചുരുക്കാതെ ‘ശക്തി’യായി നിലനിർത്തുന്നു.
- source_word: σημείοις
  choice: അടയാളങ്ങളോടും
  rationale: സാക്ഷ്യപ്പെടുത്തുന്നതോ സൂചിപ്പിക്കുന്നതോ ആയ അസാധാരണ പ്രവൃത്തികൾക്കുള്ള സാധാരണ പുതിയനിയമ പദപ്രയോഗം.
- source_word: τέρασιν
  choice: അത്ഭുതങ്ങളോടും
  rationale: വിസ്മയം ഉളവാക്കുന്ന അസാധാരണ പ്രതിഭാസങ്ങളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും മാന്യവുമായ മലയാളപദം.
- source_word: ψεύδους
  choice: വ്യാജം നിറഞ്ഞ
  rationale: ഈ പ്രതിഭാസങ്ങൾ വ്യാജത്താൽ അഥവാ വഞ്ചനയാൽ സ്വഭാവപ്പെടുത്തപ്പെട്ടവയാണെന്ന അർഥം നൽകുന്നു; അവ വെറും കൃത്രിമങ്ങളാണോ യഥാർഥ അമാനുഷിക പ്രകടനങ്ങളാണോ എന്നു തീർപ്പാക്കുന്നില്ല.
theological_decisions:
- issue: സാത്താനിക പ്രതിഭാസങ്ങളുടെ സ്വഭാവം
  choice: ശക്തിയും അടയാളങ്ങളും അത്ഭുതങ്ങളും വ്യാജത്താൽ സ്വഭാവപ്പെടുത്തപ്പെട്ടവയാണെന്ന് പറയുന്നു; അവയുടെ അമാനുഷിക യാഥാർഥ്യത്തെക്കുറിച്ച് വിധി പറയുന്നില്ല.
  alternative: ഇവ വെറും കപടവിദ്യകളാണെന്നോ, മറുവശത്ത് സാത്താൻ നടത്തുന്ന യഥാർഥ അത്ഭുതങ്ങളാണെന്നോ വ്യക്തമായി വിവർത്തനം ചെയ്യുക.
  rationale: ഗ്രീക്ക് വാക്യം അവയെ സാത്താന്റെ പ്രവർത്തനവുമായി ബന്ധിപ്പിക്കുകയും ψεύδους എന്നു വിശേഷിപ്പിക്കുകയും ചെയ്യുന്നു; എന്നാൽ അവയുടെ തത്ത്വശാസ്ത്രപരമായ സ്വഭാവം വിശദീകരിക്കുന്നില്ല. അതിനാൽ ആ സംഘർഷവും അവ്യക്തതയും നിലനിർത്തുന്നു.
- issue: παρουσία എന്ന പദത്തിന്റെ കാലാന്ത്യസന്ദർഭത്തിലുള്ള അർഥം
  choice: വരവ്
  alternative: സാന്നിധ്യം / എത്തിച്ചേരൽ
  rationale: ഇവിടെ ഒരാളുടെ പ്രത്യക്ഷപ്പെടലിനെയോ ആഗമനത്തെയോ സൂചിപ്പിക്കുന്ന ‘വരവ്’ സന്ദർഭോചിതമാണ്; പദത്തിന്റെ വിശാലമായ അർഥപരിധി അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിന്റെ ബന്ധവും ത്രിപദക്രമവും കഴിയുന്നത്ര നിലനിർത്തിക്കൊണ്ട്, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ വാക്യം രണ്ടുഭാഗമായി ക്രമപ്പെടുത്തി.
