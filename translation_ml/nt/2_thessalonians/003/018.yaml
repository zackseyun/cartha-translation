id: 2TH.3.18
reference: 2 Thessalonians 3:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ μετὰ πάντων ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/018.yaml
  text: The grace of our Lord Jesus Christ be with all of you[a].
translation:
  language: ml
  text: നമ്മുടെ കർത്താവായ യേശുക്രിസ്തുവിന്റെ കൃപ നിങ്ങളെല്ലാവരോടും കൂടെ ഉണ്ടായിരിക്കട്ടെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “നമ്മുടെ കർത്താവായ യേശുക്രിസ്തുവിന്റെ കൃപ നിങ്ങളെല്ലാവരോടും കൂടെ.” മൂലഗ്രീക്കിൽ “ഉണ്ടായിരിക്കട്ടെ” എന്ന ക്രിയ വ്യക്തമാക്കിയിട്ടില്ല; ആശീർവാദത്തിന്റെ അർഥത്തിൽ അത് സൂചിതമാണ്.'
    reason: മൂലഭാഷയിലെ ക്രിയാരഹിതമായ ആശീർവാദഘടന വ്യക്തമാക്കാൻ
lexical_decisions:
- source_word: χάρις
  choice: കൃപ
  rationale: പൗലോസിന്റെ ആശീർവാദവാക്യങ്ങളിൽ ദൈവം ക്രിസ്തുവിലൂടെ നൽകുന്ന അനുഗ്രഹപൂർണമായ പ്രീതിയെയും ദാനത്തെയും സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും സ്വാഭാവികവുമായ മലയാള പദം.
- source_word: κυρίου
  choice: കർത്താവ്
  rationale: ക്രിസ്തുവിന്റെ അധികാരവും മഹത്വവും പ്രകടമാക്കുന്ന κύριος എന്ന പദത്തിന്റെ സഭാപാരമ്പര്യത്തിൽ ഉറച്ചതും ആധുനിക മലയാളത്തിൽ ഗ്രാഹ്യവുമായ വിവർത്തനം.
- source_word: Ἰησοῦ Χριστοῦ
  choice: യേശുക്രിസ്തു
  rationale: Ἰησοῦς എന്ന നാമവും Χριστός എന്ന അഭിഷിക്തസ്ഥാനപദവും ചേർന്ന പൗലോസിന്റെ സൂത്രപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികവും പരിചിതവുമായി നിലനിർത്തുന്നു; 'ക്രിസ്തു' ഇവിടെ സ്ഥാനപദത്തിന്റെ ചരിത്രപരമായ രൂപമാണ്.
- source_word: μετὰ πάντων ὑμῶν
  choice: നിങ്ങളെല്ലാവരോടുംകൂടെ
  rationale: μετάയുടെ 'കൂടെ' എന്ന അർഥവും πάντων ὑμῶν എന്നതിന്റെ സമൂഹത്തിലെ എല്ലാവരെയും ഉൾക്കൊള്ളുന്ന വ്യാപ്തിയും വ്യക്തമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: Χριστοῦ എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ക്രിസ്തു
  alternative: മശിഹാ
  rationale: അടിസ്ഥാന അർഥം 'അഭിഷിക്തൻ/മശിഹാ' ആണെങ്കിലും, ഈ സമാപന ആശീർവാദത്തിലെ Ἰησοῦ Χριστοῦ ഒരു സ്ഥിരമായ നാമ-സ്ഥാനപദ സംയോജനമായി പ്രവർത്തിക്കുന്നു. അതിനാൽ മലയാളത്തിൽ സ്ഥാപിതമായ 'യേശുക്രിസ്തു' സ്വാഭാവികതയും ദൈവശാസ്ത്രപരമായ തിരിച്ചറിയലും ഒരുമിച്ച് കാത്തുസൂക്ഷിക്കുന്നു.
- issue: ക്രിയയില്ലാത്ത ഗ്രീക്ക് ആശീർവാദവാക്യത്തിന്റെ ഭാവം
  choice: ഇരിക്കട്ടെ
  alternative: ഉണ്ടായിരിക്കട്ടെ
  rationale: മൂലത്തിൽ ക്രിയ സൂചിതമായിരിക്കുമ്പോഴും, മലയാളത്തിൽ ആശംസാപരമായ അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ 'ഇരിക്കട്ടെ' ചേർത്തു; പ്രസ്താവനയാക്കി മാറ്റാതെ ആശീർവാദത്തിന്റെ ഭാവം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആശീർവാദശൈലി. 'നിങ്ങളെല്ലാവരോടുംകൂടെ' എന്ന രൂപം മുഴുവൻ സമൂഹത്തെയും ഉൾക്കൊള്ളുന്ന ഊന്നൽ നിലനിർത്തുന്നു.
