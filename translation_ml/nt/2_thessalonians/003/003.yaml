id: 2TH.3.3
reference: 2 Thessalonians 3:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πιστὸς δέ ἐστιν ὁ κύριος, ὃς στηρίξει ὑμᾶς καὶ φυλάξει ἀπὸ τοῦ πονηροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/003.yaml
  text: But the Lord is faithful[a], who will strengthen you and guard you from the evil one.
translation:
  language: ml
  text: എന്നാൽ കർത്താവ് വിശ്വസ്തനാണ്; അവൻ നിങ്ങളെ ശക്തിപ്പെടുത്തുകയും ദുഷ്ടനിൽനിന്ന്[a] കാത്തുകൊള്ളുകയും ചെയ്യും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “തിന്മയിൽനിന്ന്.” τοῦ πονηροῦ എന്ന ഗ്രീക്ക് പ്രയോഗം പുരുഷലിംഗത്തിൽ “ദുഷ്ടൻ” എന്നും നപുംസകലിംഗത്തിൽ “തിന്മ” എന്നും വായിക്കാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: πιστὸς
  choice: വിശ്വസ്തൻ
  rationale: കർത്താവിന്റെ ആശ്രയയോഗ്യതയും വിശ്വസ്തതയും സൂചിപ്പിക്കുന്നു; മുൻവാക്യത്തിലെ മനുഷ്യരുടെ അവിശ്വാസ്യതയോടുള്ള വൈരുധ്യവും നിലനിർത്തുന്നു.
- source_word: δέ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തോടുള്ള വ്യക്തമായ വൈരുധ്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ὁ κύριος
  choice: കർത്താവ്
  rationale: κύριος എന്ന പദവിയുടെ പതിവും ഗൗരവമുള്ളതുമായ മലയാളരൂപം; ഇവിടെ ആരെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് വിവർത്തനത്തിൽ അധികമായി വ്യക്തമാക്കുന്നില്ല.
- source_word: στηρίξει
  choice: ശക്തിപ്പെടുത്തും
  rationale: ഉറപ്പിക്കുക, സ്ഥിരപ്പെടുത്തുക, ശക്തിപ്പെടുത്തുക എന്നീ അർത്ഥപരിധിയിൽ, ഇടയപരിപാലനസന്ദർഭത്തിന് സ്വാഭാവികവും സംരക്ഷണവാഗ്ദാനത്തോട് യോജിച്ചതുമായ രൂപം.
- source_word: φυλάξει
  choice: കാത്തുകൊള്ളും
  rationale: ജാഗ്രതയോടെ കാക്കുക, സംരക്ഷിക്കുക എന്ന സജീവമായ അർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀπὸ
  choice: നിന്ന്
  rationale: അപകടത്തിൽനിന്നുള്ള സംരക്ഷണവും അകറ്റിനിർത്തലും സൂചിപ്പിക്കുന്ന സ്വാഭാവിക വിഭക്തിരൂപം.
- source_word: τοῦ πονηροῦ
  choice: ദുഷ്ടൻ
  rationale: ലിംഗപരമായി പുരുഷലിംഗമായ വായന സ്വീകരിച്ച് വ്യക്തിപരമായ ദുഷ്ടശക്തിയെ സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിലെ നപുംസകലിംഗസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: τοῦ πονηροῦ എന്നതിന്റെ സൂചിതാർത്ഥം
  choice: ദുഷ്ടനിൽനിന്ന്
  alternative: തിന്മയിൽനിന്ന്
  rationale: ഗ്രീക്ക് രൂപം പുരുഷലിംഗത്തിൽ ‘ദുഷ്ടൻ’ എന്നും നപുംസകലിംഗത്തിൽ ‘തിന്മ’ എന്നും വായിക്കാം. പുതിയനിയമപ്രയോഗത്തോട് യോജിക്കുന്ന വ്യക്തിപരമായ വായന മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചെങ്കിലും യഥാർഥ വ്യാകരണദ്വയാർഥത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ ഒറ്റവാക്യഘടന അർദ്ധവിരാമം ഉപയോഗിച്ച് നിലനിർത്തി; ὃς എന്ന ബന്ധസർവനാമം മലയാളത്തിൽ സ്വാഭാവികമായി ‘അവിടന്ന്’ എന്ന ആദരസൂചക സർവനാമത്തിലൂടെ അവതരിപ്പിച്ചു.
