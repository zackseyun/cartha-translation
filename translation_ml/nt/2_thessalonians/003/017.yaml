source:
  edition: SBLGNT
  text: Ὁ ἀσπασμὸς τῇ ἐμῇ χειρὶ Παύλου, ὅ ἐστιν σημεῖον ἐν πάσῃ ἐπιστολῇ· οὕτως γράφω.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/017.yaml
  text: The greeting is by my own hand—Paul's—which is a sign in every letter[a]; this is how I write.
translation:
  language: ml
  text: പൗലോസായ എന്റെ സ്വന്തം കൈകൊണ്ടുള്ള അഭിവാദ്യം എല്ലാ കത്തിലും ഒരു അടയാളമാണ്; ഞാൻ ഇങ്ങനെയാണ് എഴുതുന്നത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, അവസാനവാക്യം: “അങ്ങനെ ഞാൻ എഴുതുന്നു” അല്ലെങ്കിൽ “ഇപ്രകാരമാണ് ഞാൻ എഴുതുന്നത്.”'
    reason: οὕτως γράφω എന്ന അവസാനപ്രയോഗം കൂടുതൽ അക്ഷരാർഥത്തിൽ നൽകാവുന്ന പകരം പരിഭാഷ.
lexical_decisions:
- source_word: ἀσπασμὸς
  choice: അഭിവാദ്യം
  rationale: കത്തിന്റെ അവസാനഭാഗത്തിലെ ആശംസയെ സൂചിപ്പിക്കുന്ന ἀσπασμός എന്ന പദത്തിന് സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: τῇ ἐμῇ χειρὶ Παύλου
  choice: പൗലോസ് എന്ന ഞാൻ സ്വന്തം കൈകൊണ്ട് എഴുതുന്ന
  rationale: ദാതിവ് പ്രയോഗം പൗലോസ് തന്നെ കൈയെഴുത്തിൽ ഈ ഭാഗം എഴുതുന്നു എന്ന ആശയം നൽകുന്നു; Παύλου എന്ന സ്വയംതിരിച്ചറിയലും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: σημεῖον
  choice: അടയാളം
  rationale: ഇവിടെ കത്തിന്റെ ആധികാരികത തിരിച്ചറിയാൻ സഹായിക്കുന്ന ചിഹ്നം അഥവാ അടയാളമാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: ἐν πάσῃ ἐπιστολῇ
  choice: എല്ലാ കത്തിലും
  rationale: പൗലോസിന്റെ കത്തുകളിലെ പതിവിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: οὕτως γράφω
  choice: ഞാൻ എഴുതുന്നത് ഇങ്ങനെയാണ്
  rationale: οὕτως എന്നതിലെ രീതിസൂചന നിലനിർത്തുന്നു; ഇത് ഇപ്പോഴത്തെ എഴുത്തിനെയോ കൈയെഴുത്തിന്റെ തിരിച്ചറിയൽരീതിയെയോ സൂചിപ്പിക്കാമെന്ന പരിധി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: പൗലോസിന്റെ സ്വന്തം കൈയെഴുത്തിന്റെ പ്രാമാണീകരണസ്വഭാവം
  choice: സ്വന്തം കൈകൊണ്ടുള്ള അഭിവാദ്യം എല്ലാ കത്തിലും ഒരു തിരിച്ചറിയൽ അടയാളമാണെന്ന് അവതരിപ്പിച്ചു.
  alternative: അവസാനവാക്യം ഇപ്പോഴത്തെ അഭിവാദ്യത്തെ മാത്രം ചൂണ്ടിക്കാട്ടി ‘ഇങ്ങനെ ഞാൻ എഴുതുന്നു’ എന്നു കൂടുതൽ അക്ഷരാർഥത്തിൽ നൽകാം.
  rationale: ‘എല്ലാ കത്തിലും ഒരു അടയാളം’ എന്ന സമീപസന്ദർഭം പ്രാമാണീകരണത്തെ സൂചിപ്പിക്കുന്നു; എന്നാൽ οὕτως γράφω എന്നതിന്റെ കൃത്യമായ ചൂണ്ടൽ പൂർണമായി നിർണയിക്കാതെ അടിക്കുറിപ്പിൽ പകരം വായന നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കത്തുഭാഷ. ‘സ്വന്തം കൈകൊണ്ട്’ എന്നത് പൗലോസിന്റെ വ്യക്തിപരമായ കൈയെഴുത്ത് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി അറിയിക്കുന്നു; ‘അടയാളം’ പ്രാമാണീകരണഭാവം അതിശയോക്തിയില്ലാതെ നൽകുന്നു.
