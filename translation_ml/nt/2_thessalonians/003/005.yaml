  terminology: ‘കർത്താവ്,’ ‘ഹൃദയങ്ങൾ,’ ‘ദൈവത്തിന്റെ സ്നേഹം,’ and title-rendering ‘മശീഹ’ are suitable. ‘സഹിഷ്ണുത’ better represents ὑπομονή while allowing the possessive/genitive wording ‘മശീഹയുടെ’ to remain open in the main text.
  issues:
