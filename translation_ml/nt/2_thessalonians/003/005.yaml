reference: 2 Thessalonians 3:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ κύριος κατευθύναι ὑμῶν τὰς καρδίας εἰς τὴν ἀγάπην τοῦ θεοῦ καὶ εἰς τὴν ὑπομονὴν τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/005.yaml
  text: May the Lord direct your hearts into the love of God and into the steadfastness of Messiah[a][b][c].
translation:
  language: ml
  text: കർത്താവ് നിങ്ങളുടെ ഹൃദയങ്ങളെ ദൈവത്തിന്റെ സ്നേഹത്തിലേക്കും[a] മശീഹയുടെ സഹിഷ്ണുതയിലേക്കും[b][c] നയിക്കുമാറാകട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദൈവത്തോടുള്ള സ്നേഹത്തിലേക്ക്’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പ്രയോഗത്തിന് ‘ദൈവം കാണിക്കുന്ന സ്നേഹത്തിലേക്ക്’ എന്ന അർഥവും വരാം.
    reason: alternative_reading
  - marker: b
    text: ‘മശീഹ കാണിച്ച സഹിഷ്ണുതയിലേക്ക്’ എന്നോ ‘മശീഹയ്ക്കുവേണ്ടിയുള്ള സഹിഷ്ണുതയിലേക്ക്’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
  - marker: c
    text: ഗ്രീക്കിൽ ‘ക്രിസ്തു’; ഇവിടെ ആ പദം സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നതിനാൽ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: കർത്താവ്
  rationale: പുതിയനിയമത്തിലെ ദൈവികവും മശീഹാസംബന്ധവുമായ അഭിസംബോധനയുടെ ഗൗരവം നിലനിർത്തുന്ന, മലയാളത്തിൽ സുപരിചിതമായ പദം.
- source_word: κατευθύναι
  choice: നയിക്കുമാറാകട്ടെ
  rationale: ഒപ്റ്റേറ്റീവ് രൂപത്തിലുള്ള പ്രാർഥനാപരമായ ആശംസയും ‘ഒരു ലക്ഷ്യത്തിലേക്ക് നേരെ നയിക്കുക’ എന്ന ക്രിയാഭാവവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: καρδίας
  choice: ഹൃദയങ്ങളെ
  rationale: ചിന്ത, ഇച്ഛ, വികാരം എന്നിവയുടെ ആന്തരിക കേന്ദ്രത്തെ സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിലെ രൂപകം നിലനിർത്തുന്നു.
- source_word: ἀγάπην
  choice: സ്നേഹം
  rationale: ἀγάπη എന്ന പദത്തിന്റെ ലളിതവും സ്വാഭാവികവുമായ മലയാള സമാനപദം.
- source_word: τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ
  rationale: ബന്ധസൂചകമായ ഗ്രീക്ക് ജനിറ്റീവ് കഴിയുന്നത്ര നേരിട്ട് നിലനിർത്തുന്നു; ‘ദൈവത്തോടുള്ള’ എന്നു പറഞ്ഞ് വസ്തുനിഷ്ഠ അർഥം മാത്രം നിർബന്ധിക്കുന്നില്ല.
- source_word: ὑπομονὴν
  choice: സ്ഥിരമായ സഹനം
  rationale: സമ്മർദത്തിലും കഷ്ടതയിലും ഉറച്ചുനിൽക്കുന്ന സഹനം എന്ന ὑπομονήയുടെ ഭാവം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: τοῦ Χριστοῦ
  choice: മശീഹയുടെ
  rationale: Χριστός ഇവിടെ സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നതിനാൽ അതിന്റെ അർഥം നൽകുന്ന ‘മശീഹ’ ഉപയോഗിച്ചു; ജനിറ്റീവ് ഘടന മുഖ്യവാചകത്തിൽ നിലനിർത്തി.
theological_decisions:
- issue: τὴν ἀγάπην τοῦ θεοῦ എന്നതിലെ ജനിറ്റീവിന്റെ അർഥവൈവിധ്യം
  choice: ദൈവത്തിന്റെ സ്നേഹം
  alternative: ദൈവത്തോടുള്ള സ്നേഹം; ദൈവം കാണിക്കുന്ന സ്നേഹം
  rationale: ഈ പ്രയോഗം ദൈവത്തിന്റെ സ്നേഹത്തെയോ ദൈവത്തോടുള്ള സ്നേഹത്തെയോ സൂചിപ്പിക്കാം. മുഖ്യവാചകം ബന്ധസൂചക ഘടന നിലനിർത്തുകയും അടിക്കുറിപ്പ് സാധ്യതകൾ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- issue: τὴν ὑπομονὴν τοῦ Χριστοῦ എന്നതിലെ ജനിറ്റീവിന്റെ അർഥവൈവിധ്യം
  choice: മശീഹയുടെ സ്ഥിരമായ സഹനം
  alternative: മശീഹ കാണിച്ച സ്ഥിരമായ സഹനം; മശീഹയ്ക്കുവേണ്ടിയുള്ള സ്ഥിരമായ സഹനം
  rationale: ഇത് മശീഹയുടെ സ്വന്തം സഹനത്തെയോ മശീഹയോടുള്ള വിശ്വസ്തമായ സഹനത്തെയോ സൂചിപ്പിക്കാം; ഒരു വ്യാഖ്യാനം മാത്രം നിർബന്ധിക്കാതിരിക്കാൻ മറ്റുള്ള സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- issue: Χριστοῦ എന്ന സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: Χριστός ഒരു സ്ഥാനപ്പേരായതിനാൽ അതിന്റെ അർഥം വ്യക്തമാക്കുന്ന ‘മശീഹ’ ഉപയോഗിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ പ്രാർഥനാഭാഷ ഉപയോഗിച്ചു. ‘നയിക്കുമാറാകട്ടെ’ എന്ന രൂപം ആശംസാപരമായ ഒപ്റ്റേറ്റീവ് ഭാവം നൽകുന്നു. മൂലപാഠത്തിലില്ലാത്ത കാലസൂചകമോ സംഭാഷണബന്ധകമോ തുടക്കത്തിൽ ചേർത്തിട്ടില്ല.
