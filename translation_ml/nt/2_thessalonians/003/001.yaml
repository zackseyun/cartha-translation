source:
  edition: SBLGNT
  text: Τὸ λοιπὸν προσεύχεσθε, ἀδελφοί, περὶ ἡμῶν, ἵνα ὁ λόγος τοῦ κυρίου τρέχῃ καὶ δοξάζηται καθὼς καὶ πρὸς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/001.yaml
  text: Finally[a], brothers, pray for us, that the word of the Lord may spread rapidly and be honored, just as it was among you[b],
translation:
  language: ml
  text: ഒടുവിൽ, സഹോദരന്മാരേ[a], കർത്താവിന്റെ വചനം വേഗത്തിൽ വ്യാപിക്കുകയും ബഹുമാനിക്കപ്പെടുകയും ചെയ്യേണ്ടതിന് ഞങ്ങൾക്കുവേണ്ടി പ്രാർഥിക്കുവിൻ—നിങ്ങളുടെ ഇടയിൽ അതു സംഭവിച്ചതുപോലെ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സഹോദരന്മാരും സഹോദരിമാരും’ എന്നും അർഥമാകാം; ഗ്രീക്കിൽ ‘സഹോദരന്മാരേ’ എന്നാണ്, എന്നാൽ അത് മുഴുവൻ സഭയെയും പ്രതിനിധിയായി അഭിസംബോധന ചെയ്യുന്നതാകാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘ഓടുകയും മഹത്വീകരിക്കപ്പെടുകയും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ λοιπὸν
  choice: ഒടുവിൽ
  rationale: ലേഖനത്തിന്റെ സമാപനഭാഗത്തിലേക്കുള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ വ്യവഹാരചിഹ്നം.
- source_word: προσεύχεσθε
  choice: പ്രാർഥിക്കുവിൻ
  rationale: രണ്ടാം പുരുഷ ബഹുവചന ആജ്ഞയെ മാന്യവും വ്യക്തവുമായ ആധുനിക നിലവാര മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; സന്ദർഭം തുടർച്ചയായ പ്രാർഥനയെ അനുവദിക്കുന്നു.
- source_word: ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: ഗ്രീക്കിലെ വ്യാകരണപരമായി പുല്ലിംഗമായ സംബോധന നേരിട്ട് നിലനിർത്തുന്നു; മുഴുവൻ സഭയെയും പ്രതിനിധിയായി ഉൾക്കൊള്ളാമെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: περὶ ἡμῶν
  choice: ഞങ്ങൾക്കുവേണ്ടി
  rationale: പ്രാർഥനയോടൊപ്പമുള്ള περί + genitive എന്ന പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: ὁ λόγος τοῦ κυρίου
  choice: കർത്താവിന്റെ വചനം
  rationale: ജനിതകബന്ധവും ബൈബിൾപരമായ ‘വചനം’ എന്ന പ്രയോഗവും നിലനിർത്തുന്നു; ഇവിടെ പ്രസംഗിക്കപ്പെടുന്ന കർത്താവിന്റെ സന്ദേശത്തെ സൂചിപ്പിക്കാം.
- source_word: τρέχῃ
  choice: അതിവേഗം വ്യാപിക്കുകയും
  rationale: ‘ഓടുക’ എന്ന അക്ഷരാർഥമുള്ള രൂപകം ഇവിടെ വചനത്തിന്റെ ദ്രുതഗതിയിലുള്ള മുന്നേറ്റത്തെ സൂചിപ്പിക്കുന്നു; ആ അർഥം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: δοξάζηται
  choice: ബഹുമാനിക്കപ്പെടുകയും
  rationale: വചനം മഹത്വമുള്ളതായി അംഗീകരിക്കപ്പെടുകയും യോജിച്ച ആദരവോടെ സ്വീകരിക്കപ്പെടുകയും ചെയ്യുന്നതിനെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: καθὼς καὶ πρὸς ὑμᾶς
  choice: നിങ്ങളുടെ ഇടയിൽ സംഭവിച്ചതുപോലെ
  rationale: തെസ്സലൊനീക്യരുടെ ഇടയിൽ നേരത്തേ ഉണ്ടായ സ്വീകരണത്തോടുള്ള താരതമ്യം മലയാളത്തിൽ സ്വാഭാവികമാക്കുന്നു; καίയിലെ ഊന്നൽ ‘പോലെ’ എന്ന താരതമ്യത്തിൽ സന്ദർഭാനുസൃതമായി ഉൾക്കൊള്ളുന്നു.
theological_decisions:
- issue: സഭയെ അഭിസംബോധന ചെയ്യുന്ന ἀδελφοίയുടെ പരിഭാഷ
  choice: സഹോദരന്മാരേ
  alternative: സഹോദരീസഹോദരന്മാരേ
  rationale: മൂലത്തിലെ പുല്ലിംഗ ബഹുവചനം മുഖ്യവാചകത്തിൽ നിലനിർത്തി, അത് സ്ത്രീകളുൾപ്പെടെയുള്ള മുഴുവൻ സഭയെയും പ്രതിനിധിയായി അഭിസംബോധന ചെയ്യാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ പറയുന്നു.
- issue: വചനത്തിന്റെ മുന്നേറ്റത്തെ സൂചിപ്പിക്കുന്ന τρέχῃ എന്ന രൂപകം
  choice: അതിവേഗം വ്യാപിക്കുകയും
  alternative: ഓടുകയും
  rationale: രൂപകത്തിന്റെ ആശയം—കർത്താവിന്റെ സന്ദേശത്തിന്റെ ദ്രുതവും തടസ്സമില്ലാത്തതുമായ മുന്നേറ്റം—ആധുനിക വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; അക്ഷരരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: δοξάζηται എന്നതിന്റെ സന്ദർഭാർഥം
  choice: ബഹുമാനിക്കപ്പെടുകയും
  alternative: മഹത്വീകരിക്കപ്പെടുകയും
  rationale: ‘വചനത്തോട്’ ചേർന്നപ്പോൾ അതിനെ ആദരപൂർവം സ്വീകരിക്കുകയും അതിന്റെ മഹത്വം അംഗീകരിക്കുകയും ചെയ്യുന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു; കൂടുതൽ അക്ഷരാർഥമുള്ള രൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും മാന്യവുമായ ബൈബിൾ ശൈലി. ‘കർത്താവ്’, ‘വചനം’ എന്നീ പരിചിതമായ പദങ്ങൾ നിലനിർത്തി; ദുർഗ്രാഹ്യമായ അക്ഷരാനുകരണം ഒഴിവാക്കി രൂപകത്തിന്റെ അർഥം മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കി.
