id: 2TH.3.15
reference: 2 Thessalonians 3:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ μὴ ὡς ἐχθρὸν ἡγεῖσθε, ἀλλὰ νουθετεῖτε ὡς ἀδελφόν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/015.yaml
  text: And do not regard him as an enemy[b][a], but admonish him as a brother.
translation:
  language: ml
  text: അവനെ ശത്രുവായി കരുതരുത്; മറിച്ച്, സഹോദരനെന്ന നിലയിൽ[a] അവനെ ബുദ്ധിയുപദേശിക്കുവിൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സഹോദരൻ’ ഇവിടെ ഒരു സഹവിശ്വാസിയെ സൂചിപ്പിക്കുന്നു; ക്രിസ്തീയ സമൂഹത്തിലെ ഒരു അംഗത്തെ പ്രതിനിധീകരിച്ചും ഈ പദം ഉപയോഗിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: ἡγεῖσθε
  choice: കരുതരുത്
  rationale: ഒരാളെ ഒരു പ്രത്യേക നിലയിൽ കണക്കാക്കുക അഥവാ പരിഗണിക്കുക എന്ന മധ്യപ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐχθρόν
  choice: ശത്രുവായി
  rationale: ὡς സഹിതമുള്ള വിധേയകർമം ആ വ്യക്തിയെ ശത്രുവിന്റെ വിഭാഗത്തിൽ ഉൾപ്പെടുത്തി കാണരുതെന്ന ആശയം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: νουθετεῖτε
  choice: ബുദ്ധിയുപദേശിക്കുവിൻ
  rationale: νουθετέω എന്നതിലെ തിരുത്തൽ ലക്ഷ്യമുള്ള മുന്നറിയിപ്പിന്റെയും ഉപദേശത്തിന്റെയും സംയുക്തബലം ഉൾക്കൊള്ളുന്നു; വെറും പഠിപ്പിക്കൽ എന്നതിനെക്കാൾ ശക്തവും ശാസിക്കൽ എന്നതിനെക്കാൾ ഇടയപരിപാലനസ്വഭാവമുള്ളതുമാണ്.
- source_word: ἀδελφόν
  choice: സഹോദരനെന്ന നിലയിൽ
  rationale: മൂലത്തിലെ ഏകവചന പുല്ലിംഗരൂപം നിലനിർത്തുന്നു; ഇവിടെ ക്രിസ്തീയ സമൂഹത്തിലെ സഹവിശ്വാസിയെ പ്രതിനിധീകരിക്കുന്ന പ്രയോഗമാണെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὡς
  choice: ആയി / എന്ന നിലയിൽ
  rationale: രണ്ടു ഘടകങ്ങളിലും ഒരാളെ ഏതു നിലയിൽ കണക്കാക്കണം, ഉപദേശിക്കണം എന്ന രീതിയോ വിഭാഗമോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി സന്ദർഭാനുസൃതമായ രണ്ടു തത്തുല്യരൂപങ്ങൾ ഉപയോഗിച്ചു.
- source_word: καὶ μὴ ... ἀλλὰ
  choice: '... കരുതരുത്; ... ഉപദേശിക്കുവിൻ'
  rationale: മലയാളത്തിൽ വാക്യാരംഭത്തിലെ ‘കൂടാതെ’ ഒഴിവാക്കിയും അർദ്ധവിരാമത്തിലൂടെയും നിഷേധവും പകരമുള്ള നടപടിയും തമ്മിലുള്ള ശക്തമായ വൈരുധ്യം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: അനുസരണക്കേടുള്ള സഹവിശ്വാസിയോടുള്ള ശിക്ഷണപരമായ നിലപാട്
  choice: ആ വ്യക്തിയെ ശത്രുവായി കാണാതെ, സഹോദരബന്ധം അംഗീകരിച്ചുകൊണ്ട് തിരുത്തൽ ലക്ഷ്യത്തോടെ ഉപദേശിക്കണം.
  alternative: സഭാശിക്ഷണത്തിന്റെ പ്രത്യേക പശ്ചാത്തലമില്ലാതെ, സാധാരണ വ്യക്തിബന്ധങ്ങളിലെ സംഘർഷത്തെക്കുറിച്ചുള്ള ഉപദേശമായി ഇതിനെ വായിക്കാം.
  rationale: 2 തെസ്സലൊനീക്യർ 3:14–15-ന്റെ സന്ദർഭം സമൂഹത്തിനുള്ളിലെ അനുസരണക്കേടിനോടുള്ള ശിക്ഷണനടപടിയാണ്. ‘സഹോദരൻ’ എന്ന പദം ശത്രുതയല്ല, തുടർന്നുനിൽക്കുന്ന സമൂഹബന്ധമാണ് സൂചിപ്പിക്കുന്നത്; എന്നാൽ വിവർത്തനം സഭാപരമായ നടപടിയുടെ കൃത്യസ്വഭാവത്തെക്കുറിച്ച് അതിലധികം നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ പൊതുമലയാളം. ‘ബുദ്ധിയുപദേശിക്കുവിൻ’ തിരുത്തലോടുകൂടിയ ഇടയപരിപാലനഭാവം നിലനിർത്തുന്നു. മൂലത്തിലെ രണ്ടാംപുരുഷ ബഹുവചന ആജ്ഞാരൂപത്തിന് ‘-വിൻ’ ഉപയോഗിച്ചു. ഇംഗ്ലീഷ് അടിക്കുറിപ്പിലെ ‘consider him an enemy’ മലയാള മുഖ്യപാഠത്തിലെ ‘ശത്രുവായി കരുതുക’ എന്നതിന്റെ നേരിട്ടുള്ള തത്തുല്യമായതിനാൽ വേറൊരു യഥാർഥ വിവർത്തനവികൽപമല്ല; അതിനാൽ അനാവശ്യ അടിക്കുറിപ്പായി ആവർത്തിച്ചിട്ടില്ല.
