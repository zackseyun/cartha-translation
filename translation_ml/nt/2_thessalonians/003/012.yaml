  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῖς δὲ τοιούτοις παραγγέλλομεν καὶ παρακαλοῦμεν ⸂ἐν κυρίῳ Ἰησοῦ Χριστῷ⸃ ἵνα μετὰ ἡσυχίας ἐργαζόμενοι τὸν ἑαυτῶν ἄρτον ἐσθίωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/012.yaml
  text: To such people we command and urge in the Lord Jesus the Messiah that[a], working quietly[c][b], they should eat their own bread.
translation:
  language: ml
  text: 'അത്തരക്കാരോടാകട്ടെ, ഞങ്ങൾ കർത്താവായ യേശു മശീഹയിൽ[a] ആജ്ഞാപിക്കുകയും പ്രേരിപ്പിക്കുകയും ചെയ്യുന്നു: അവർ ശാന്തതയോടെ[b] ജോലി ചെയ്ത് സ്വന്തം അപ്പം ഭക്ഷിക്കട്ടെ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കർത്താവായ യേശുക്രിസ്തുവിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഗ്രീക്കിലെ Χριστός ഒരു പദവിയായി പ്രവർത്തിക്കുന്നതിനാൽ പ്രധാന പാഠത്തിൽ ‘മശീഹ’ എന്നു നൽകിയിരിക്കുന്നു. ‘-യിൽ’ എന്നത് അവനോടുള്ള ബന്ധത്തെയോ അവന്റെ അധികാരമേഖലയെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
  - marker: b
    text: അഥവാ ‘സ്വസ്ഥമായി’. ഇവിടെ ഉദ്ദേശിക്കുന്നത് വെറും മിണ്ടാതിരിക്കലല്ല; മറ്റുള്ളവരുടെ കാര്യങ്ങളിൽ ഇടപെട്ട് ക്രമംകെടുത്താതെ, ശാന്തവും ക്രമമുള്ളതുമായ രീതിയിൽ ജോലി ചെയ്യുകയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς δὲ τοιούτοις
  choice: അത്തരക്കാരോടാകട്ടെ
  rationale: മുൻവാക്യങ്ങളിൽ പറഞ്ഞ ക്രമംകെട്ടും അലസരുമായ ആളുകളെ തിരിച്ചുചൂണ്ടുന്നു. ‘ആകട്ടെ’ δέയുടെ മൃദുവായ വിഷയമാറ്റം/വ്യത്യാസം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; കാലസൂചകമായ ‘ഇപ്പോൾ’ ചേർക്കുന്നില്ല.
- source_word: παραγγέλλομεν καὶ παρακαλοῦμεν
  choice: ഞങ്ങൾ ... ആജ്ഞാപിക്കുകയും അഭ്യർഥിക്കുകയും ചെയ്യുന്നു
  rationale: ആദ്യ ക്രിയയിലെ അധികാരപൂർവമായ നിർദേശം ‘ആജ്ഞാപിക്കുന്നു’ എന്നും രണ്ടാമത്തേതിലെ ആത്മാർഥമായ പ്രേരണ ‘അഭ്യർഥിക്കുന്നു’ എന്നും വേർതിരിച്ചു നിലനിർത്തുന്നു.
- source_word: ἐν κυρίῳ Ἰησοῦ Χριστῷ
  choice: കർത്താവായ യേശുമശീഹയിൽ
  rationale: ἐν എന്നതിന്റെ മേഖല/ബന്ധം/അധികാരം ഉൾക്കൊള്ളുന്ന തുറന്ന അർഥം ‘-യിൽ’ നിലനിർത്തുന്നു. Χριστός ഇവിടെ സജീവമായ പദവിയായതിനാൽ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: μετὰ ἡσυχίας ἐργαζόμενοι
  choice: ശാന്തതയോടെ അധ്വാനിച്ച്
  rationale: കലഹമുണ്ടാക്കുന്ന അലസതയ്ക്കു വിപരീതമായി ശാന്തവും ക്രമമുള്ളതുമായ രീതിയിൽ ജോലി ചെയ്യുന്നതാണ് പ്രയോഗത്തിന്റെ അർഥം. നാമരൂപത്തിന്റെ ഭാവം ‘ശാന്തതയോടെ’ നിലനിർത്തുന്നു.
- source_word: τὸν ἑαυτῶν ἄρτον
  choice: സ്വന്തം അപ്പം
  rationale: ἄρτος എന്ന മൂർത്തമായ രൂപകം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ സ്വന്തം അധ്വാനത്തിലൂടെ ലഭിക്കുന്ന ആഹാരത്തെയും ഉപജീവനത്തെയും സൂചിപ്പിക്കുന്നു.
- source_word: ἐσθίωσιν
  choice: ഭക്ഷിക്കട്ടെ
  rationale: ἵναയോടുകൂടിയ വർത്തമാനകാല ഉപവിധി, ആജ്ഞയുടെയും അഭ്യർഥനയുടെയും ഉള്ളടക്കമായ ബാധ്യതയെ മലയാളത്തിലെ ‘-ട്ടെ’ രൂപത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: Χριστός എന്ന പദവിയുടെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ Χριστός യേശുവിന്റെ പദവിയായി അർഥസജീവമായതിനാൽ ‘മശീഹ’ എന്ന് നൽകി; സ്ഥിരനാമംപോലെ മാത്രം വായിക്കപ്പെടാവുന്ന ‘ക്രിസ്തു’ പ്രധാന പാഠത്തിൽ ഉപയോഗിച്ചില്ല.
- issue: അപ്പൊസ്തലിക നിർദേശത്തിന്റെ ഇരട്ട സ്വരം
  choice: ‘ആജ്ഞാപിക്കുകയും അഭ്യർഥിക്കുകയും’ എന്ന രണ്ടു ക്രിയകളും നിലനിർത്തി
  alternative: ‘ഉപദേശിക്കുന്നു’ പോലുള്ള ഒറ്റ ക്രിയയിൽ ലയിപ്പിക്കുക
  rationale: വാക്യം അധികാരപൂർവമായ ആജ്ഞയെയും ഇടയപരമായ ആത്മാർഥ അഭ്യർഥനയെയും ഒരുമിച്ചു നിർത്തുന്നു; ഒന്നിനെ മറ്റൊന്നിൽ ലയിപ്പിക്കുന്നത് ഈ ഉദ്ദേശ്യപൂർവമായ സംഘർഷം മങ്ങിക്കും.
- issue: ἐν എന്നതിന്റെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തി
  choice: ‘യേശുമശീഹയിൽ’
  alternative: ‘യേശുമശീഹയുടെ അധികാരത്താൽ’
  rationale: ‘അധികാരത്താൽ’ എന്നത് പ്രസക്തമായ ഒരു അർഥസാധ്യതയാണെങ്കിലും, ഗ്രീക്ക് ἐν സൂചിപ്പിക്കാവുന്ന ബന്ധം, ഐക്യം, പ്രവർത്തനമേഖല എന്നിവയെ അതിലൂടെ അനാവശ്യമായി ചുരുക്കാതിരിക്കാൻ പ്രധാന പാഠത്തിൽ തുറന്ന രൂപം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘അധ്വാനിച്ച് സ്വന്തം അപ്പം ഭക്ഷിക്കട്ടെ’ എന്ന രൂപം മൂലത്തിലെ മൂർത്തമായ ഭാഷ നിലനിർത്തിക്കൊണ്ട് ഉപജീവനത്തിന്റെ സന്ദർഭാർഥവും സ്വാഭാവികമായി അറിയിക്കുന്നു.
