id: 2TH.3.2
reference: 2 Thessalonians 3:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἵνα ῥυσθῶμεν ἀπὸ τῶν ἀτόπων καὶ πονηρῶν ἀνθρώπων, οὐ γὰρ πάντων ἡ πίστις.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/002.yaml
  text: and that we may be delivered from wicked and evil men[b][a], for not all have faith.
translation:
  language: ml
  text: കൂടാതെ, വഴിവിട്ടവരും[a] ദുഷ്ടരുമായ മനുഷ്യരിൽനിന്ന് ഞങ്ങൾ വിടുവിക്കപ്പെടേണ്ടതിനും പ്രാർഥിക്കുവിൻ; കാരണം, എല്ലാവർക്കും വിശ്വാസമില്ല.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യുക്തിഹീനരും.’ ഗ്രീക്ക് പദത്തിന് ‘അനുചിതർ,’ ‘അസംബന്ധർ,’ ‘യുക്തിഹീനർ’ എന്നീ അർത്ഥങ്ങളും വരാം; ഇവിടെ അത് വഴിതെറ്റി എതിർക്കുന്നവരെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ, ‘എല്ലാവരും വിശ്വസ്തരല്ല.’ ഗ്രീക്കിൽ അക്ഷരാർഥം: ‘വിശ്വാസം എല്ലാവരുടേതുമല്ല.’'
    reason: alternative_reading
lexical_decisions:
- source_word: ῥυσθῶμεν
  choice: ഞങ്ങൾ വിടുവിക്കപ്പെടേണ്ടതിന്
  rationale: ἵνα-യോടുകൂടിയ aorist passive subjunctive ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു. ശത്രുതയുള്ളവരിൽനിന്നുള്ള മോചനത്തെ മാർഗം അനാവശ്യമായി വ്യക്തമാക്കാതെ ‘വിടുവിക്കപ്പെടുക’ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἀτόπων
  choice: വഴിവിട്ടവരും
  rationale: ‘അസ്ഥാനത്തുള്ള, അനുചിതമായ, യുക്തിഹീനമായ, വികലമായ’ എന്നീ അർത്ഥവ്യാപ്തിയുള്ള പദമാണിത്. πονηρῶν എന്നതിൽനിന്ന് വേറിട്ടുനിൽക്കുകയും സന്ദർഭത്തിലെ ധാർമികവും പെരുമാറ്റപരവുമായ വ്യതിചലനം സൂചിപ്പിക്കുകയും ചെയ്യുന്നതിനാൽ ‘വഴിവിട്ട’ തെരഞ്ഞെടുത്തു; യുക്തിഹീനർ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: πονηρῶν
  choice: ദുഷ്ടരുമായ
  rationale: വ്യക്തമായ ധാർമിക തിന്മ സൂചിപ്പിക്കുന്ന സാധാരണ പദം; ἀτόπων എന്നതിന്റെ അർത്ഥം ആവർത്തിക്കാതെ അതോടു സ്വാഭാവികമായി ചേരുന്നു.
- source_word: ἀνθρώπων
  choice: മനുഷ്യരിൽനിന്ന്
  rationale: ബഹുവചനമായ ἀνθρώπων ഇവിടെ എതിരാളികളായ വ്യക്തികളെ സൂചിപ്പിക്കുന്നു. മൂലപദം സ്വതവേ പുരുഷന്മാർക്കു മാത്രമായി അർത്ഥം പരിമിതപ്പെടുത്താത്തതിനാൽ മലയാളത്തിലെ പൊതുവായ ‘മനുഷ്യർ’ ഉപയോഗിച്ചു.
- source_word: πίστις
  choice: വിശ്വാസം
  rationale: ഇവിടെ ശത്രുതയുള്ള എതിരാളികളെക്കുറിച്ചുള്ള സന്ദർഭത്തിൽ ‘വിശ്വാസം’ ഏറ്റവും സ്വാഭാവികമാണ്. ‘വിശ്വസ്തത’ എന്ന അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: οὐ γὰρ πάντων ἡ πίστις
  choice: എല്ലാവർക്കും വിശ്വാസമില്ലല്ലോ
  rationale: അക്ഷരാർഥത്തിൽ ‘വിശ്വാസം എല്ലാവരുടേതുമല്ല’ എന്ന സംക്ഷിപ്ത ഗ്രീക്ക് പ്രയോഗം. മലയാളത്തിൽ സ്വാഭാവികമായി പറഞ്ഞുകൊണ്ട്, വിശ്വാസം ആർക്കും ലഭ്യമല്ലെന്ന ശക്തമായ അവകാശവാദം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: πίστις എന്ന പദത്തിന്റെ അർത്ഥം
  choice: വിശ്വാസം
  alternative: വിശ്വസ്തത
  rationale: അപ്പൊസ്തോലിക ദൗത്യത്തെ എതിർക്കുന്നവരെക്കുറിച്ചുള്ള സമീപസന്ദർഭം വിശ്വാസത്തിന്റെ അഭാവത്തെയാണ് കൂടുതൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്. എങ്കിലും πίστις-ന് ‘വിശ്വസ്തത’ എന്ന അർത്ഥവും വരാവുന്നതിനാൽ ആ യഥാർഥ ഭാഷാപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- issue: മുൻവാക്യത്തിൽനിന്ന് ആശ്രയിക്കുന്ന ἵνα ഘടന
  choice: ‘പ്രാർഥിക്കുവിൻ’ എന്ന മുൻവാക്യത്തിലെ നിയന്ത്രകക്രിയ വ്യക്തതയ്ക്കായി ആവർത്തിച്ചു
  alternative: ‘വിടുവിക്കപ്പെടേണ്ടതിനും’ എന്നു മാത്രം നൽകി വാക്യം 3:1-നോട് വ്യാകരണപരമായി ബന്ധിപ്പിക്കുക
  rationale: ഗ്രീക്കിൽ 3:2-ലെ καὶ ἵνα, 3:1-ലെ προσεύχεσθε എന്ന ക്രിയയെ ആശ്രയിക്കുന്നു. ഒറ്റവാക്യമായി വായിക്കുമ്പോൾ മലയാളത്തിൽ അപൂർണ്ണത ഒഴിവാക്കാൻ ആ ക്രിയ അർത്ഥാനുസൃതമായി ആവർത്തിച്ചു; പുതിയ ആശയം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്കു വ്യക്തവും ആരാധനാപരമായ വായനയ്ക്കു യോജിച്ച ഗൗരവവുമുള്ള ശൈലി. 3:1-ൽനിന്ന് തുടരുന്ന വ്യാകരണബന്ധം ഒറ്റവാക്യവായനയിൽ വ്യക്തമാക്കാൻ ‘പ്രാർഥിക്കുവിൻ’ ആവർത്തിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
