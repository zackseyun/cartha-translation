source:
  edition: SBLGNT
  text: καὶ γὰρ ὅτε ἦμεν πρὸς ὑμᾶς, τοῦτο παρηγγέλλομεν ὑμῖν, ὅτι εἴ τις οὐ θέλει ἐργάζεσθαι μηδὲ ἐσθιέτω.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/010.yaml
  text: 'For even when we were with you, we kept commanding you this: if anyone is not willing to work, neither let him eat.'
translation:
  language: ml
  text: 'എന്തെന്നാൽ, ഞങ്ങൾ നിങ്ങളോടൊപ്പമുണ്ടായിരുന്നപ്പോഴും നിങ്ങളോട് ഇങ്ങനെ കല്പിച്ചുകൊണ്ടിരുന്നു: ആരെങ്കിലും ജോലി ചെയ്യാൻ മനസ്സില്ലെങ്കിൽ[a], അയാൾ ഭക്ഷിക്കരുത്.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ അക്ഷരാർഥം ‘ജോലി ചെയ്യാൻ സന്നദ്ധനല്ലെങ്കിൽ’ എന്നാണ്; ഇവിടെ ഉദ്ദേശിക്കുന്നത് കഴിവില്ലായ്മയല്ല, മനസ്സില്ലായ്മയാണ്.
    reason: lexical_alternative
  - marker: b
    text: 'മറ്റൊരു പരിഭാഷ: ‘അയാൾ ഭക്ഷിക്കാതിരിക്കട്ടെ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: എന്തെന്നാൽ, ... പോലും
  rationale: γάρ എന്നതിന്റെ വിശദീകരണബന്ധവും καί നൽകുന്ന ഊന്നലും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὅτε ἦμεν πρὸς ὑμᾶς
  choice: ഞങ്ങൾ നിങ്ങളോടൊപ്പമുണ്ടായിരുന്നപ്പോൾ
  rationale: πρός ഇവിടെ അവരുടെ സാന്നിധ്യത്തിലും കൂട്ടത്തിലുമുണ്ടായിരുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘നിങ്ങളോടൊപ്പം’ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τοῦτο παρηγγέλλομεν ὑμῖν
  choice: നിങ്ങളോട് ഇങ്ങനെ കല്പിച്ചുകൊണ്ടിരുന്നു
  rationale: τοῦτο തുടർന്നുവരുന്ന കല്പനയുടെ ഉള്ളടക്കത്തിലേക്ക് വിരൽചൂണ്ടുന്നു. Imperfect ആയ παρηγγέλλομεν ആവർത്തിച്ചോ തുടർന്നോ നൽകിയ കല്പനയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘കല്പിച്ചുകൊണ്ടിരുന്നു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: εἴ τις
  choice: ആരെങ്കിലും
  rationale: വ്യക്തിയെ അനിശ്ചിതവും പൊതുവുമായ രീതിയിൽ സൂചിപ്പിക്കുന്ന വ്യവസ്ഥ മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: οὐ θέλει ἐργάζεσθαι
  choice: ജോലി ചെയ്യാൻ മനസ്സില്ലെങ്കിൽ
  rationale: θέλει കഴിവില്ലായ്മയെയല്ല, മനസ്സോ സന്നദ്ധതയോ ഇല്ലായ്മയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘മനസ്സില്ലെങ്കിൽ’ ഈ വ്യത്യാസം വ്യക്തമായി കാക്കുന്നു.
- source_word: μηδὲ ἐσθιέτω
  choice: അയാൾ ഭക്ഷിക്കയും അരുത്
  rationale: μηδέ നൽകുന്ന ‘അതും അരുത്’ എന്ന തുടർച്ചയും ἐσθιέτωയുടെ മൂന്നാംപുരുഷ ഏകവചന ആജ്ഞാഭാവവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: വാക്യം ജോലി ചെയ്യാനുള്ള കഴിവില്ലായ്മയെയാണോ മനസ്സില്ലായ്മയെയാണോ അഭിസംബോധന ചെയ്യുന്നത്
  choice: ‘ജോലി ചെയ്യാൻ മനസ്സില്ലെങ്കിൽ’—വാക്യം സന്നദ്ധതയില്ലായ്മയെ അഭിസംബോധന ചെയ്യുന്നു.
  alternative: ‘ജോലി ചെയ്യാൻ കഴിയുന്നില്ലെങ്കിൽ’
  rationale: θέλει ഇച്ഛയെയും സന്നദ്ധതയെയും കുറിച്ചുള്ളതാണ്. കഴിവില്ലായ്മ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് ഗ്രീക്ക് പാഠത്തിൽ ഇല്ലാത്ത കടുത്ത സാമൂഹിക നിഗമനം ഇറക്കുമതി ചെയ്യും.
- issue: ഫലവാക്യത്തിലെ മൂന്നാംപുരുഷ ഏകവചനത്തിന്റെ പ്രതിനിധാനസ്വഭാവം
  choice: ‘അയാൾ ഭക്ഷിക്കയും അരുത്’ എന്ന ഏകവചനരൂപം നിലനിർത്തി.
  alternative: ലിംഗസൂചനയില്ലാത്ത ബഹുവചനരൂപം ഉപയോഗിക്കുക
  rationale: τις എന്ന അനിശ്ചിത ഏകവചനത്തിനു പിന്നാലെ മൂന്നാംപുരുഷ ഏകവചന ആജ്ഞാരൂപമാണ് ഗ്രീക്കിലുള്ളത്; മലയാളത്തിൽ ‘അയാൾ’ പ്രതിനിധാന ഏകവചനമായി സ്വാഭാവികമാണ്.
- issue: μηδὲ ἐσθιέτω എന്നതിലെ ആജ്ഞ/അനുവാദ നിഷേധത്തിന്റെ സൂക്ഷ്മത
  choice: ‘അയാൾ ഭക്ഷിക്കയും അരുത്’
  alternative: ‘അയാളെ ഭക്ഷിക്കാൻ അനുവദിക്കരുത്’
  rationale: ഗ്രീക്ക് രൂപം നേരിട്ട് മൂന്നാംപുരുഷ ആജ്ഞയായി വായിക്കാം; അനുവദിക്കാതിരിക്കുന്നതെന്ന വ്യാഖ്യാനം പ്രധാനപാഠത്തിൽ നിർബന്ധമായി ചേർക്കാതെ പാദക്കുറിപ്പിൽ പകരംവായനയായി സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘കല്പിച്ചുകൊണ്ടിരുന്നു’ എന്ന രൂപം ആവർത്തിതമായ ഭൂതകാലപ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു. ‘മനസ്സില്ലെങ്കിൽ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ θέλει എന്ന പദത്തിന്റെ നിർണായകമായ ഇച്ഛാസൂചനയും കാക്കുന്നു.
