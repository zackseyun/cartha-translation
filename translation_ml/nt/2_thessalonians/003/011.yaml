id: 2TH.3.11
reference: 2 Thessalonians 3:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀκούομεν γάρ τινας περιπατοῦντας ἐν ὑμῖν ἀτάκτως, μηδὲν ἐργαζομένους ἀλλὰ περιεργαζομένους·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/011.yaml
  text: For we hear that some among you are walking disorderly[a], doing no work at all[b], but meddling.
translation:
  language: ml
  text: കാരണം, നിങ്ങളുടെ ഇടയിൽ ചിലർ അച്ചടക്കമില്ലാതെ[a] ജീവിക്കുകയും ഒരു ജോലിയും ചെയ്യാതിരിക്കുകയും പകരം മറ്റുള്ളവരുടെ കാര്യങ്ങളിൽ ഇടപെട്ടുനടക്കുകയും[b] ചെയ്യുന്നുവെന്ന് ഞങ്ങൾ കേൾക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അച്ചടക്കമില്ലാതെ” എന്നതിന് “അലസമായി” അല്ലെങ്കിൽ “ക്രമരഹിതമായി” എന്നും വിവർത്തനം ചെയ്യാം. സമൂഹം പ്രതീക്ഷിച്ച ക്രമത്തിനും ഉത്തരവാദിത്വത്തിനും വിരുദ്ധമായ പെരുമാറ്റത്തെ ഗ്രീക്ക് പദം സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: 'ഗ്രീക്കിൽ വാക്കുകളിലെ ഒരു കളിയുണ്ട്: അവർ “ജോലി ചെയ്യുന്നില്ല,” എന്നാൽ മറ്റുള്ളവരുടെ കാര്യങ്ങളിൽ “ഇടപെട്ട് പ്രവർത്തിക്കുന്നു.” പരമ്പരാഗതമായി ഇതിനെ “പരകാര്യങ്ങളിൽ തലയിടുന്നവർ” എന്നു വിവർത്തനം ചെയ്തിട്ടുണ്ട്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούομεν
  choice: ഞങ്ങൾ കേൾക്കുന്നു
  rationale: വർത്തമാനകാലത്തിലുള്ള ക്രിയ നിലവിൽ ലഭിച്ചുകൊണ്ടിരിക്കുന്ന വിവരത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി വർത്തമാനരൂപം നിലനിർത്തുന്നു.
- source_word: γάρ
  choice: വാക്യത്തിന്റെ വിശദീകരണബന്ധത്തിലൂടെ പ്രകടമാക്കി
  rationale: γάρ മുൻവാക്യത്തിലെ പ്രബോധനത്തിന് കാരണം നൽകുന്നു. ഒറ്റവാക്യമായി വായിക്കുമ്പോൾ അസ്വാഭാവികമായ ‘എന്തെന്നാൽ’ ഒഴിവാക്കി വാക്യക്രമത്തിലൂടെ ബന്ധം സൂചിപ്പിച്ചു.
- source_word: τινας
  choice: ചിലർ
  rationale: സമൂഹത്തിനുള്ളിലെ നിർദിഷ്ടമല്ലാത്ത ഒരു വിഭാഗത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: περιπατοῦντας
  choice: ജീവിക്കുന്നുവെന്ന്
  rationale: ഇവിടെ ‘നടക്കുക’ എന്നത് ജീവിതരീതിയെയോ പെരുമാറ്റത്തെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്; അർഥം വ്യക്തമായി നൽകാൻ ‘ജീവിക്കുക’ തെരഞ്ഞെടുത്തു.
- source_word: ἐν ὑμῖν
  choice: നിങ്ങളുടെ ഇടയിൽ
  rationale: തെസ്സലൊനീക്യ വിശ്വാസസമൂഹത്തിനുള്ളിലെ ആളുകളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἀτάκτως
  choice: ക്രമംകെട്ട്
  rationale: സമൂഹത്തിലെ പ്രതീക്ഷിത ക്രമത്തിനും ഉത്തരവാദിത്വത്തിനും വിരുദ്ധമായ, അച്ചടക്കമില്ലാത്ത പെരുമാറ്റം എന്ന വിശാല അർഥം നിലനിർത്തുന്നു; വെറും മടിയായി ചുരുക്കുന്നില്ല.
- source_word: μηδὲν ἐργαζομένους
  choice: ഒരു ജോലിയും ചെയ്യാതെ
  rationale: μηδέν നൽകുന്ന സമ്പൂർണ നിഷേധവും ഉത്പാദകമായ ജോലിയൊന്നും ചെയ്യാത്തതെന്ന ആശയവും ലളിതമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀλλὰ
  choice: മറിച്ച് എന്ന വൈരുധ്യം വാക്യഘടനയിൽ പ്രകടമാക്കി
  rationale: ജോലി ചെയ്യാത്തതും അനാവശ്യമായി തിരക്കിടുന്നതും തമ്മിലുള്ള ശക്തമായ വൈരുധ്യം ‘ചെയ്യാതെ ... ഇടപെട്ടുനടക്കുന്നുവെന്ന്’ എന്ന ഘടന വ്യക്തമാക്കുന്നു.
- source_word: περιεργαζομένους
  choice: മറ്റുള്ളവരുടെ കാര്യങ്ങളിൽ ഇടപെട്ടുനടക്കുന്നുവെന്ന്
  rationale: അനുചിതമായി മറ്റുള്ളവരുടെ കാര്യങ്ങളിൽ തിരക്കിടുക എന്ന സന്ദർഭാർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു. ἐργάζομαι/περιεργάζομαι ശബ്ദവിനോദം പൂർണമായി പുനരാവിഷ്കരിക്കാനാവാത്തതിനാൽ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മാന്യവുമായ ശൈലി. ‘നടക്കുന്നു’ എന്ന സെമിറ്റിക്/പൗലൊസീയ രൂപകം അക്ഷരാർഥത്തിൽ നിലനിർത്താതെ അതിന്റെ ജീവിതരീതി എന്ന അർഥം നൽകി. മുഖ്യവാക്യത്തിലെ രണ്ട് അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദപ്രയോഗങ്ങൾക്ക് ശേഷം ചേർത്തു.
