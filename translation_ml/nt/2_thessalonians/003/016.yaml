id: 2TH.3.16
reference: 2 Thessalonians 3:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ὁ κύριος τῆς εἰρήνης δῴη ὑμῖν τὴν εἰρήνην διὰ παντὸς ἐν παντὶ τρόπῳ. ὁ κύριος μετὰ πάντων ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/016.yaml
  text: May the Lord of peace himself give you peace at all times in every way[b][a]. The Lord be with all of you.
translation:
  language: ml
  text: സമാധാനത്തിന്റെ കർത്താവുതന്നെ നിങ്ങൾക്ക് എല്ലായ്പോഴും[a] എല്ലാ വിധത്തിലും[b] സമാധാനം നൽകട്ടെ. കർത്താവ് നിങ്ങളെല്ലാവരോടും കൂടെ ഇരിക്കട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘നിരന്തരം.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘എല്ലാ രീതിയിലും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς
  choice: കർത്താവുതന്നെ
  rationale: കർത്താവിനെ വ്യക്തിപരമായി ഊന്നിപ്പറയുന്ന αὐτός എന്ന പദത്തിന്റെ തീവ്രത സ്വാഭാവികമായ മലയാളത്തിൽ ‘തന്നെ’കൊണ്ട് നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: ഇവിടെ δέ ശക്തമായ വൈരുധ്യമല്ല, സമാപനാശീർവാദത്തിലേക്കുള്ള മൃദുവായ സംവാദമാറ്റമാണ്. ‘എന്നാൽ’ എന്നു ചേർത്താൽ അനാവശ്യമായ വൈരുധ്യം വരും; ‘ഇനി’ എന്നു ചേർത്താൽ മൂലത്തിൽ ഇല്ലാത്ത കാലസൂചന ശക്തമാകും. മലയാളത്തിലെ വാക്യക്രമം ഈ മാറ്റം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: κύριος
  choice: കർത്താവ്
  rationale: κύριος എന്ന സ്ഥാനനാമത്തിന് മലയാള ബൈബിൾ ഭാഷയിലും ആധുനിക സാധാരണ ഉപയോഗത്തിലും വ്യക്തവും മാന്യവുമായ തത്തുല്യപദമാണ് ‘കർത്താവ്’.
- source_word: τῆς εἰρήνης
  choice: സമാധാനത്തിന്റെ
  rationale: ബന്ധസൂചകമായ ഗ്രീക്ക് ഷഷ്ഠീവ്യാകരണം വ്യാഖ്യാനപരമായി വികസിപ്പിക്കാതെ ‘സമാധാനത്തിന്റെ കർത്താവ്’ എന്ന സ്ഥാനനാമരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: δῴη
  choice: നൽകട്ടെ
  rationale: ആശംസയോ പ്രാർഥനയോ സൂചിപ്പിക്കുന്ന aorist optative-ന്റെ ഭാവം മലയാളത്തിലെ ആശംസാരൂപമായ ‘നൽകട്ടെ’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὴν εἰρήνην
  choice: സമാധാനം
  rationale: ഗ്രീക്കിൽ നിർദേശകപദം ഉണ്ടായിരുന്നാലും മലയാളത്തിൽ ‘സമാധാനം നൽകട്ടെ’ എന്നതാണ് സ്വാഭാവികം; അർഥപരമായ നഷ്ടമില്ല.
- source_word: διὰ παντὸς
  choice: എല്ലായ്പോഴും
  rationale: കാലമുഴുവനുമുള്ള സ്ഥിരതയെ ചുരുക്കമായും വ്യക്തമായും സൂചിപ്പിക്കുന്നു; ‘നിരന്തരം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἐν παντὶ τρόπῳ
  choice: എല്ലാ വിധത്തിലും
  rationale: τρόπος സൂചിപ്പിക്കുന്ന രീതി/വിധത്തിന്റെ വ്യാപ്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; അടുത്ത പദസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: μετὰ πάντων ὑμῶν
  choice: നിങ്ങൾ എല്ലാവരോടുംകൂടെ
  rationale: πάντων എന്ന പദത്തിന്റെ ഉൾക്കൊള്ളുന്ന സമഗ്രത വ്യക്തമാക്കുകയും മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ആശീർവാദത്തിലെ ‘കർത്താവ്’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: വാക്യത്തിൽ ഉള്ളതുപോലെ ‘കർത്താവ്’ എന്നു മാത്രം നിലനിർത്തുന്നു
  alternative: ‘കർത്താവായ യേശു’ എന്നു വ്യക്തമാക്കി വിവർത്തനം ചെയ്യുക; അല്ലെങ്കിൽ പൊതുവായി ദൈവത്തെ സൂചിപ്പിക്കുന്നതായി വ്യാഖ്യാനിക്കുക
  rationale: ഗ്രീക്ക് വാക്യം ὁ κύριος എന്നു മാത്രമാണ് പറയുന്നത്. പൗലോസിന്റെ സന്ദർഭത്തിൽ ഇത് കർത്താവായ യേശുവിനെ സൂചിപ്പിക്കാനിടയുണ്ടെങ്കിലും, മൂലപാഠം വ്യക്തമാക്കാത്തത് വിവർത്തനം അധികമായി വ്യക്തമാക്കുന്നില്ല.
- issue: അവസാന ക്രിയാരഹിത ഉപവാക്യത്തിന്റെ ഭാവം
  choice: ‘കർത്താവ് നിങ്ങൾ എല്ലാവരോടുംകൂടെ ഇരിക്കട്ടെ’ എന്ന ആശീർവാദാശംസയായി വിവർത്തനം ചെയ്യുന്നു
  alternative: ‘കർത്താവ് നിങ്ങൾ എല്ലാവരോടുംകൂടെ ഉണ്ട്’ എന്ന പ്രസ്താവനയായി വിവർത്തനം ചെയ്യുക
  rationale: ഗ്രീക്കിൽ പ്രകടമായ ക്രിയ ഇല്ലെങ്കിലും സന്ദർഭത്തിൽ ഇത് ഒരു സമാപനാശീർവാദമാണ്; അതിനാൽ മലയാളത്തിലെ ‘ഇരിക്കട്ടെ’ ആശംസാഭാവം കൃത്യമായി നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കുമ്പോഴും ആശീർവാദത്തിന് യോജിച്ച മാന്യവും ഗൗരവമുള്ളതുമായ ശൈലി ഉപയോഗിച്ചു. ‘കർത്താവുതന്നെ’ എന്ന രൂപം മൂലത്തിലെ ഊന്നൽ നിലനിർത്തുന്നു; അനാവശ്യമായ വൈരുധ്യമോ കാലസൂചനയോ ചേർത്തിട്ടില്ല.
