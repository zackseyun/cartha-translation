translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. മൂലത്തിലെ ‘അപ്പം’ എന്ന ദൃശ്യപ്രയോഗവും നിഷേധം–വൈരുധ്യം എന്ന വാക്യഘടനയും നിലനിർത്തി; അടുത്ത അർഥമുള്ള κόπος/μόχθος എന്നീ പദങ്ങളുടെ സഞ്ചിതബലവും പ്രകടമാക്കി.
