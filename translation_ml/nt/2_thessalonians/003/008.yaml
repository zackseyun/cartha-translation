  text: οὐδὲ δωρεὰν ἄρτον ἐφάγομεν παρά τινος, ἀλλ’ ἐν κόπῳ καὶ μόχθῳ ⸂νυκτὸς καὶ ἡμέρας⸃ ἐργαζόμενοι πρὸς τὸ μὴ ἐπιβαρῆσαί τινα ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/008.yaml
  text: nor did we eat bread from anyone free of charge[a], but with labor and hardship, working night and day so as not to burden any of you.
translation:
  language: ml
  text: ഞങ്ങൾ ആരിൽനിന്നും സൗജന്യമായി അപ്പം ഭക്ഷിച്ചില്ല[a]; മറിച്ച്, നിങ്ങളിൽ ആർക്കും ഭാരമാകാതിരിക്കാൻ കഠിനാധ്വാനത്തോടും പ്രയാസത്തോടുംകൂടെ രാവും പകലും പ്രവർത്തിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞങ്ങൾ ആരുടെയും അപ്പം വെറുതെ ഭക്ഷിച്ചില്ല.” ഗ്രീക്കിൽ “അപ്പം” എന്ന പദം അക്ഷരാർഥത്തിൽ നിലനിൽക്കുന്നു; എന്നാൽ അത് ഭക്ഷണത്തെയോ ഭൗതിക സഹായത്തെയോ കൂടുതൽ വിശാലമായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: δωρεὰν
  choice: വില കൊടുക്കാതെ
  rationale: പ്രതിഫലമോ ചെലവോ നൽകാതെ സൗജന്യമായി സ്വീകരിക്കുക എന്ന സാമ്പത്തിക സൂചന സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἄρτον
  choice: അപ്പം
  rationale: മൂലത്തിലെ മൂർത്തമായ പദം നിലനിർത്തുന്നു; ഇവിടെ അത് ഭക്ഷണമോ ഭൗതിക സഹായമോ വിശാലമായി സൂചിപ്പിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: παρά τινος
  choice: ആരിൽനിന്നും
  rationale: παρά + genitive സൂചിപ്പിക്കുന്ന ഉറവിടവും τις എന്ന അനിശ്ചിത സർവനാമത്തിന്റെ വ്യാപക നിഷേധവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐν κόπῳ καὶ μόχθῳ
  choice: കഷ്ടപ്പാടോടും പ്രയാസത്തോടുംകൂടെ
  rationale: അടുത്ത അർഥമുള്ള രണ്ടു പദങ്ങളുടെയും സഞ്ചിതബലം നിലനിർത്തി കഠിനാധ്വാനവും അതോടൊപ്പമുള്ള ദുഷ്കരതയും പ്രകടമാക്കുന്നു.
- source_word: νυκτὸς καὶ ἡμέρας
  choice: രാവും പകലും
  rationale: തുടർച്ചയായ അധ്വാനത്തെ സൂചിപ്പിക്കുന്ന കാലപ്രയോഗം സ്വാഭാവികമായ മലയാള ശൈലിയിൽ നൽകുന്നു.
- source_word: ἐργαζόμενοι
  choice: അധ്വാനിച്ചുകൊണ്ട് ... പ്രവർത്തിച്ചു
  rationale: പ്രധാന ക്രിയയോടു ബന്ധമുള്ള participial ആശയം നിലനിർത്തുകയും സ്വയം ഉപജീവനത്തിനായുള്ള പ്രവൃത്തിയുടെ കഠിനത വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: πρὸς τὸ μὴ ἐπιβαρῆσαί
  choice: ഭാരമാകാതിരിക്കേണ്ടതിന്
  rationale: ഉദ്ദേശ്യം വ്യക്തമാക്കുന്ന ഘടനയും സാമ്പത്തികമോ ഭൗതികമോ ആയ ഭാരം ചുമത്താതിരിക്കുക എന്ന സന്ദർഭാർഥവും സംരക്ഷിക്കുന്നു.
- source_word: τινα ὑμῶν
  choice: നിങ്ങളിൽ ആർക്കും
  rationale: ഏതെങ്കിലും ഒരാളെയും ഒഴിവാക്കാത്ത distributive അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: οὐδὲ ... ἀλλ’
  choice: '... ഇല്ല; മറിച്ച്'
  rationale: സൗജന്യ സഹായം സ്വീകരിക്കാതിരുന്നതും പകരം കഠിനമായി പ്രവർത്തിച്ചതും തമ്മിലുള്ള ശക്തമായ വൈരുധ്യം നിലനിർത്തുന്നു.
