source:
  edition: SBLGNT
  text: Εἰ δέ τις οὐχ ὑπακούει τῷ λόγῳ ἡμῶν διὰ τῆς ἐπιστολῆς, τοῦτον σημειοῦσθε, ⸀μὴ ⸀συναναμίγνυσθαι αὐτῷ, ἵνα ἐντραπῇ·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/014.yaml
  text: And if anyone does not obey our word through this letter[a], take note of that person; do not associate with him[d][c][b], so that he may be ashamed.
translation:
  language: ml
  text: ഈ കത്തിലൂടെ ഞങ്ങൾ പറയുന്ന വചനം ആരെങ്കിലും അനുസരിക്കുന്നില്ലെങ്കിൽ, അയാളെ അടയാളപ്പെടുത്തിവെക്കുക[b]; അയാളുമായി ഇടപഴകരുത്[c][d], അയാൾക്ക് ലജ്ജ തോന്നേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: അഥവാ ‘ശ്രദ്ധയിൽ വെക്കുക’ അല്ലെങ്കിൽ ‘കുറിച്ചുവെക്കുക.’
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘അയാളുമായി കൂട്ടുകൂടരുത്.’
    reason: lexical_alternative
  - marker: d
    text: ഇതിന്റെ ലക്ഷ്യം തിരുത്തലാണ്; അയാളെ ഇപ്പോഴും ‘സഹോദരൻ’ എന്ന നിലയിൽ മുന്നറിയിപ്പു നൽകണമെന്നു പറയുന്ന 15-ാം വാക്യം കാണുക.
    reason: cross_reference
lexical_decisions:
- source_word: ὑπακούει
  choice: അനുസരിക്കുന്നില്ല
  rationale: അധികാരപൂർവമായ ഉപദേശമോ നിർദേശമോ അനുസരിക്കുക എന്ന അർഥം സന്ദർഭത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: τῷ λόγῳ ἡμῶν
  choice: ഞങ്ങൾ ... നൽകുന്ന വാക്ക്
  rationale: λόγος ഇവിടെ ഒറ്റ ഉച്ചാരണമല്ല, അപ്പൊസ്തലിക ഉപദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘വാക്ക്’ ഗ്രീക്ക് പ്രയോഗം നിലനിർത്തുന്നു, ‘നൽകുന്ന’ എന്നത് മലയാളത്തിൽ ബന്ധം സ്വാഭാവികമാക്കുന്നു.
- source_word: διὰ τῆς ἐπιστολῆς
  choice: ഈ കത്തിലൂടെ
  rationale: διά + genitive ഇവിടെ ഉപദേശം എത്തുന്ന മാർഗമോ ഉപകരണമോ സൂചിപ്പിക്കുന്നു; ‘ഈ’ എന്നത് ഇപ്പോഴുള്ള കത്തിനെ സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കുന്നു.
- source_word: σημειοῦσθε
  choice: പ്രത്യേകം ശ്രദ്ധിച്ചുവെക്കുക
  rationale: അനുസരിക്കാത്ത വ്യക്തിയെ തിരിച്ചറിഞ്ഞ് ശ്രദ്ധയിൽ വെക്കാനുള്ള ആജ്ഞയെ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; അനാവശ്യമായി കടുത്ത ശിക്ഷാഭാവം ചേർക്കുന്നില്ല.
- source_word: τοῦτον
  choice: അയാളെ
  rationale: അനുസരിക്കാത്ത ആ വ്യക്തിയിലേക്കുള്ള നിർദിഷ്ട സൂചന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: μὴ συναναμίγνυσθαι αὐτῷ
  choice: അയാളുമായി ഇടപഴകരുത്
  rationale: കൂട്ടുകൂടുകയോ അടുത്ത സാമൂഹികബന്ധം തുടരുകയോ ചെയ്യരുതെന്ന ശാസനാത്മക നിർദേശം വ്യക്തമാക്കുന്നു; പിൽക്കാല സഭാനിയമത്തിലെ സാങ്കേതിക പദങ്ങൾ ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: ἐντραπῇ
  choice: അയാൾക്ക് ലജ്ജ തോന്നട്ടെ
  rationale: ലജ്ജാബോധത്തിലേക്കു വരുക എന്ന ഉദ്ദേശ്യഫലം പ്രകടമാക്കുന്നു; പ്രതികാരപരമായ അപമാനിക്കൽ എന്ന ആശയം അതിരുകടന്ന് ചേർക്കുന്നില്ല.
- source_word: τις
  choice: ആരെങ്കിലും
  rationale: അനിശ്ചിത സർവനാമത്തിന്റെ പൊതുവായ വ്യവസ്ഥാപരമായ വ്യാപ്തി സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: αὐτῷ
  choice: അയാളുമായി
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ഏകവചന സർവനാമത്തിന്റെ പ്രതിനിധാനപരമായ ഏകവചനരൂപം നിലനിർത്തുന്നു.
theological_decisions:
- issue: μὴ συναναμίγνυσθαι αὐτῷ കല്പിക്കുന്ന ശാസനയുടെ സ്വഭാവം
  choice: അനുസരിക്കാത്ത വിശ്വാസിയെ തിരുത്താൻ ഉദ്ദേശിച്ചുള്ള സാമൂഹിക/സഭാസമൂഹപരമായ അകലം
  alternative: ഏറ്റവും ശക്തമായ ഔപചാരിക അർഥത്തിലുള്ള പൂർണ സഭാഭ്രഷ്ടാക്കൽ; അല്ലെങ്കിൽ സഭാസമൂഹപരമായ പ്രസക്തിയില്ലാത്ത സാധാരണ ഒഴിവാക്കൽ മാത്രം
  rationale: തൊട്ടടുത്ത വാക്യത്തിൽ അയാളെ ശത്രുവായി കരുതാതെ സഹോദരനെന്ന നിലയിൽ മുന്നറിയിപ്പു നൽകാൻ പറയുന്നു. അതിനാൽ ‘ഇടപഴകരുത്’ തിരുത്തൽ ലക്ഷ്യമാക്കിയ ഗൗരവമുള്ള അകലം സൂചിപ്പിക്കുമ്പോഴും പിൽക്കാല സാങ്കേതിക സഭാനിയമ വിഭാഗങ്ങൾ അടിച്ചേൽപ്പിക്കുന്നില്ല.
- issue: ἐντραπῇ എന്നതിന്റെ ഉദ്ദേശ്യശക്തി
  choice: തിരുത്തലിലേക്കു നയിക്കേണ്ട ലജ്ജാബോധം
  alternative: പരസ്യമായ അപമാനിക്കൽ തന്നെ അന്തിമലക്ഷ്യം
  rationale: ഉദ്ദേശ്യവാക്യവും തുടർന്നുള്ള 15-ാം വാക്യവും ഈ ലജ്ജയെ ശിക്ഷാത്മക അപമാനമായി മാത്രമല്ല, പരിഹാരാത്മകമായി ചട്ടക്കൂടിലാക്കുന്നു; വിവർത്തനം മാനസാന്തരം എന്ന ഫലം നേരിട്ട് ചേർക്കാതെ ഈ ദിശ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സഹവസിക്കുക’ എന്ന പദത്തിന് ഇന്നത്തെ ഉപയോഗത്തിൽ ഉണ്ടാകാവുന്ന ദാമ്പത്യ/ലൈംഗിക ധ്വനി ഒഴിവാക്കി ‘ഇടപഴകുക’ ഉപയോഗിച്ചു. ഉദ്ദേശ്യവാക്യം ലളിതമായ ‘അങ്ങനെ ... തോന്നട്ടെ’ എന്ന രൂപത്തിൽ നൽകി.
