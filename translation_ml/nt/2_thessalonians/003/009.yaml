source:
  edition: SBLGNT
  text: οὐχ ὅτι οὐκ ἔχομεν ἐξουσίαν, ἀλλ’ ἵνα ἑαυτοὺς τύπον δῶμεν ὑμῖν εἰς τὸ μιμεῖσθαι ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/009.yaml
  text: not because we do not have the right, but in order to give ourselves to you as an example for you to imitate us.
translation:
  language: ml
  text: ഞങ്ങൾക്ക് അതിനുള്ള അവകാശം[a] ഇല്ലാത്തതുകൊണ്ടല്ല, മറിച്ച്, നിങ്ങൾ ഞങ്ങളെ അനുകരിക്കേണ്ടതിന് ഞങ്ങളെത്തന്നെ നിങ്ങൾക്കു ഒരു മാതൃകയായി[b] നൽകാനാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവകാശം’ എന്നതിന് പകരം ‘അധികാരം’ അല്ലെങ്കിൽ ‘ശക്തി’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ന്യായമായി ഉന്നയിക്കാവുന്ന അവകാശം എന്ന അർഥത്തിനാണ് സന്ദർഭത്തിൽ മുൻതൂക്കം.
    reason: lexical_alternative
  - marker: b
    text: ‘ഒരു മാതൃകയായി’ എന്നതിന് പകരം ‘ഒരു ഉദാഹരണമായി’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουσίαν
  choice: അതിനുള്ള അവകാശം
  rationale: സന്ദർഭം ഭൗതികസഹായം സ്വീകരിക്കാനുള്ള ന്യായമായ അവകാശത്തെക്കുറിച്ചാണ്; ‘അധികാരം’ എന്നതിനെക്കാൾ ‘അവകാശം’ ഈ അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἑαυτοὺς
  choice: ഞങ്ങളെത്തന്നെ
  rationale: പൗലോസിനെയും സഹപ്രവർത്തകരെയും സൂചിപ്പിക്കുന്ന ആത്മവാചക സർവനാമത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: τύπον
  choice: ഒരു മാതൃകയായി
  rationale: അനുകരിക്കേണ്ട പെരുമാറ്റമാതൃക എന്ന അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: δῶμεν
  choice: നൽകാനാണ്
  rationale: ‘ഞങ്ങളെത്തന്നെ മാതൃകയായി നൽകുക’ എന്ന ഗ്രീക്ക് ദൃശ്യപ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: εἰς τὸ μιμεῖσθαι ἡμᾶς
  choice: നിങ്ങൾ ഞങ്ങളെ അനുകരിക്കേണ്ടതിന്
  rationale: ഉദ്ദേശ്യാർഥവും ‘ഞങ്ങളെ അനുകരിക്കുക’ എന്ന നേരിട്ടുള്ള പ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: οὐχ ὅτι οὐκ ... ἀλλ’ ἵνα
  choice: ഇല്ലാത്തതുകൊണ്ടല്ല, മറിച്ച് ... വേണ്ടതിന്
  rationale: കാരണം നിഷേധിച്ചശേഷം യഥാർഥ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്ന ഗ്രീക്ക് വൈരുധ്യഘടന മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: ἐξουσίαν എന്ന പദത്തിൽ പൗലോസ് ഉന്നയിക്കുന്ന അവകാശത്തിന്റെ സ്വഭാവം
  choice: പൗലോസിനും സഹപ്രവർത്തകർക്കും സഹായം സ്വീകരിക്കാനുള്ള ന്യായമായ അവകാശമുണ്ടായിരുന്നുവെങ്കിലും അവർ ഇവിടെ അത് വിനിയോഗിച്ചില്ല.
  alternative: ഇത് പൊതുവായ അപ്പൊസ്തലിക അധികാരത്തെയോ ശക്തിയെയോ സൂചിപ്പിക്കുന്നു.
  rationale: തൊട്ടുമുമ്പും പിന്നാലെയും ഉള്ള സന്ദർഭം മറ്റുള്ളവർക്ക് ഭാരമാകാതിരിക്കാൻ അധ്വാനിച്ചതിനെക്കുറിച്ചാണ്. അതിനാൽ ‘അവകാശം’ എന്ന പരിഭാഷ പ്രായോഗിക അവകാശവാദം വ്യക്തമാക്കുകയും വിപുലമായ സിദ്ധാന്തം ഇറക്കുമതി ചെയ്യാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ഞങ്ങളെത്തന്നെ ... മാതൃകയായി നൽകുക’ എന്ന പ്രയോഗം മൂലപാഠത്തിന്റെ ദൃശ്യഭാവം നിലനിർത്തുന്നു; ‘അതിനുള്ള’ എന്നത് മുൻസന്ദർഭത്തിലെ സഹായം സ്വീകരിക്കാനുള്ള അവകാശത്തിലേക്ക് വിരൽചൂണ്ടുന്നു.
