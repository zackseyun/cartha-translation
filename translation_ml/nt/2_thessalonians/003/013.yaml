source:
  edition: SBLGNT
  text: ὑμεῖς δέ, ἀδελφοί, μὴ ⸀ἐγκακήσητε καλοποιοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/013.yaml
  text: But as for you[a], brothers, do not grow weary in doing good.
translation:
  language: ml
  text: എന്നാൽ സഹോദരന്മാരേ[a], നിങ്ങൾ നന്മ ചെയ്യുന്നതിൽ മടുത്തുപോകരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സഹോദരീസഹോദരന്മാരേ”; ഗ്രീക്കിൽ “സഹോദരന്മാർ” എന്നാണ്, എന്നാൽ ഈ പദം വിശ്വാസസമൂഹത്തിലെ എല്ലാവരെയും ഉൾപ്പെടുത്തി സംബോധന ചെയ്യാൻ ഉപയോഗിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δέ
  choice: എന്നാൽ ... നിങ്ങൾ
  rationale: δέ മുൻവാക്യങ്ങളിൽ പറഞ്ഞ മടിയന്മാരിൽനിന്നുള്ള വൈരുധ്യം സൂചിപ്പിക്കുന്നു; മുൻനിരയിൽ വന്ന ὑμεῖς ഊന്നൽ നൽകുന്നു. ‘എന്നാൽ ... നിങ്ങൾ’ ഇവ രണ്ടും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചന സംബോധനയുടെ രൂപം നേരിട്ട് നിലനിർത്തുന്നു. ഇത് വിശ്വാസസമൂഹത്തിലെ സ്ത്രീകളെയും ഉൾക്കൊള്ളാവുന്നതാണെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: μὴ ἐγκακήσητε
  choice: മടുത്തുപോകരുത്
  rationale: μή സഹിതമുള്ള aorist subjunctive നിരോധനമാണ്. ἐγκακέω തുടരുന്ന പ്രവൃത്തിയിൽ ക്ഷീണിക്കുകയോ മനസ്സുതളരുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; ഇവിടെ ‘മടുത്തുപോകരുത്’ മലയാളത്തിൽ സ്വാഭാവികമായി സ്ഥിരോത്സാഹത്തിന്റെ ആശയം നൽകുന്നു.
- source_word: καλοποιοῦντες
  choice: നന്മ ചെയ്യുന്നതിൽ
  rationale: വർത്തമാനകാല കൃദന്തം തുടർന്നുകൊണ്ടിരിക്കുന്ന നല്ല പ്രവൃത്തിയുടെ മേഖലയെ സൂചിപ്പിക്കുന്നു. ‘നന്മ ചെയ്യുന്നതിൽ’ ഈ ദൈർഘ്യഭാവം ലളിതവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: സഭാസമൂഹത്തോടുള്ള സംബോധനയിൽ ἀδελφοί എന്നതിന്റെ വിവർത്തനം
  choice: സഹോദരന്മാരേ
  alternative: സഹോദരീസഹോദരന്മാരേ
  rationale: ഗ്രീക്ക് രൂപം പുല്ലിംഗ ബഹുവചനമാണെങ്കിലും പൗലോസിന്റെ ഈ സംബോധന മുഴുവൻ വിശ്വാസസമൂഹത്തെയും ഉൾക്കൊള്ളാം. മൂലരൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തി ഉൾക്കൊള്ളുന്ന പ്രയോഗസാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ സഭാസംബോധന. ‘മടുത്തുപോകരുത്’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും മൂലത്തിലെ സ്ഥിരോത്സാഹഭാവം നിലനിർത്തുന്നതുമാണ്.
