id: 2TH.3.6
reference: 2 Thessalonians 3:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Παραγγέλλομεν δὲ ὑμῖν, ἀδελφοί, ἐν ὀνόματι τοῦ κυρίου ⸀ἡμῶν Ἰησοῦ Χριστοῦ στέλλεσθαι ὑμᾶς ἀπὸ παντὸς ἀδελφοῦ ἀτάκτως περιπατοῦντος καὶ μὴ κατὰ τὴν παράδοσιν ἣν ⸀παρελάβοσαν παρ’ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/006.yaml
  text: We command you[a], brothers, in the name of our Lord Jesus the Messiah[e][d][c][b], to keep away from every brother who is walking disorderly and not according to the tradition that they received from us.
translation:
  language: ml
  text: സഹോദരങ്ങളേ, ക്രമംകെട്ട് ജീവിക്കുകയും ഞങ്ങളിൽനിന്ന് അവർ സ്വീകരിച്ച പാരമ്പര്യമനുസരിച്ച് നടക്കാതിരിക്കുകയും ചെയ്യുന്ന ഓരോ സഹോദരനിൽനിന്നും അകന്നുനിൽക്കണമെന്ന് നമ്മുടെ കർത്താവായ യേശു മശീഹയുടെ നാമത്തിൽ ഞങ്ങൾ നിങ്ങളോടു കല്പിക്കുന്നു.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സഹോദരങ്ങളേ” എന്നു പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്ക് പദം പുല്ലിംഗ ബഹുവചനമാണ്; പൗലോസ് സഭാസമൂഹത്തെയാകെ അഭിസംബോധന ചെയ്യുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “അകന്നുനിൽക്കുക” എന്നതിന് “ബന്ധം വിട്ടുനിൽക്കുക” എന്നും പരിഭാഷപ്പെടുത്താം; അടുത്ത സഹവാസത്തിൽനിന്ന് സ്വയം പിൻവാങ്ങുക എന്നതാണ് ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ആശയം.
    reason: lexical_alternative
  - marker: c
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ “നിങ്ങൾ ഞങ്ങളിൽനിന്ന് സ്വീകരിച്ച” എന്നോ “അവൻ ഞങ്ങളിൽനിന്ന് സ്വീകരിച്ച” എന്നോ വായിക്കുന്നു. ഇവിടെ പിന്തുടരുന്ന പാഠത്തിൽ “അവർ ഞങ്ങളിൽനിന്ന് സ്വീകരിച്ച” എന്നാണ്.
    reason: textual_variant
lexical_decisions:
- source_word: Παραγγέλλομεν
  choice: ഞങ്ങൾ നിങ്ങളോടു കല്പിക്കുന്നു
  rationale: παραγγέλλω വെറും അഭ്യർഥനയല്ല, അധികാരപൂർവമായ നിർദേശം സൂചിപ്പിക്കുന്നു; ‘കല്പിക്കുന്നു’ അതിന്റെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀδελφοί
  choice: സഹോദരങ്ങളേ
  rationale: വിളിവിഭക്തിയിലുള്ള പുല്ലിംഗ ബഹുവചനം നേരിട്ട് നിലനിർത്തുന്നു; അഭിസംബോധന സഭാസമൂഹത്തെയാകെ ഉദ്ദേശിക്കുന്നതായി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐν ὀνόματι τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: നമ്മുടെ കർത്താവായ യേശു മശീഹയുടെ നാമത്തിൽ
  rationale: ἐν ὀνόματι എന്ന പ്രയോഗത്തിന്റെ ഗൗരവവും അധികാരസൂചനയും ‘നാമത്തിൽ’ നിലനിർത്തുന്നു; Χριστός ഇവിടെ പദവിയായതിനാൽ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: στέλλεσθαι ὑμᾶς ἀπὸ
  choice: അകന്നുനിൽക്കണമെന്ന്
  rationale: സ്വയം പിൻവാങ്ങി അടുത്ത സഹവാസത്തിൽനിന്ന് വിട്ടുനിൽക്കുക എന്ന മധ്യപ്രയോഗത്തിന്റെ ആശയം വ്യക്തമാക്കുന്നു; ഔപചാരിക സഭാഭ്രഷ്ടാക്കൽ എന്നു അതിവ്യാഖ്യാനം ചെയ്യുന്നില്ല.
- source_word: παντὸς ἀδελφοῦ
  choice: ഓരോ സഹോദരനിൽനിന്നും
  rationale: ഏകവചനവും പുല്ലിംഗവും സഭയിലെ കുടുംബബന്ധഭാഷയും സംരക്ഷിക്കുന്നു.
- source_word: ἀτάκτως περιπατοῦντος
  choice: ക്രമംകെട്ടു ജീവിക്കുകയും
  rationale: περιπατέω എന്ന ‘നടക്കുക’ രൂപകം മലയാളത്തിൽ ഇവിടെ അക്ഷരാർഥമായി നൽകിയാൽ അസ്വാഭാവികമാകാം; ജീവിതനടപ്പാണ് ഉദ്ദേശ്യമെന്നതിനാൽ ‘ജീവിക്കുക’ ഉപയോഗിച്ചു. ἀτάκτως എന്നതിന്റെ വിശാലമായ അർഥപരിധി നിലനിർത്താൻ ‘ക്രമംകെട്ടു’ സ്വീകരിച്ചു; ‘അലസമായി’ എന്നു ചുരുക്കിയില്ല.
- source_word: μὴ κατὰ τὴν παράδοσιν
  choice: പാരമ്പര്യമനുസരിച്ച് നടക്കാതിരിക്കുകയും
  rationale: παράδοσις കൈമാറിക്കിട്ടിയ ഉപദേശമോ ആചാരമോ എന്ന ആശയം വഹിക്കുന്നു; ‘പാരമ്പര്യം’ നേരിട്ടുള്ള തുല്യപദമാണ്, ഇവിടെ അതു അപ്പൊസ്തലന്മാരിൽനിന്നു ലഭിച്ചതാണെന്ന് വാക്യം തന്നെ നിർണ്ണയിക്കുന്നു.
- source_word: ἣν παρελάβοσαν παρ’ ἡμῶν
  choice: ഞങ്ങളിൽനിന്ന് അവർ സ്വീകരിച്ച
  rationale: SBLGNT-യിലെ മൂന്നാംപുരുഷ ബഹുവചനമായ παρελάβοσαν അതേപടി പ്രതിഫലിപ്പിക്കുന്നു; മുൻപുള്ള ഏകവചനവുമായി ഉണ്ടാകുന്ന വ്യാകരണപിരിമുറുക്കം മായ്ച്ചുകളയാതെ പാഠഭേദം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
theological_decisions:
- issue: Χριστοῦ എന്ന ക്രിസ്തുശാസ്ത്രപരമായ പദവിയുടെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ Χριστός യേശുവിന്റെ പദവിയായി പ്രവർത്തിക്കുന്നു. ‘മശീഹ’ അഭിഷിക്തനായ വാഗ്ദത്ത രാജാവെന്ന പദവിയർഥം കൂടുതൽ സുതാര്യമാക്കുന്നു; പരിചിതമായ ‘ക്രിസ്തു’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: στέλλεσθαι ὑμᾶς ἀπὸ കല്പിക്കുന്ന അകൽച്ചയുടെ പരിധി
  choice: അകന്നുനിൽക്കുക
  alternative: ബന്ധം വിട്ടുനിൽക്കുക / ഒഴിവാക്കുക
  rationale: അടുത്ത സഹവാസത്തിൽനിന്നുള്ള ശാസനാത്മക പിൻവാങ്ങൽ പ്രകടമാക്കുന്നു; എന്നാൽ മൂലപാഠം വ്യക്തമായി പറയാത്ത ഔപചാരിക പുറത്താക്കൽ ഇതിൽ ചേർക്കുന്നില്ല.
- issue: παρελάβοσαν എന്ന ബഹുവചന പാഠത്തിന്റെ അസാധാരണമായ യോജിപ്പ്
  choice: അവർ സ്വീകരിച്ച
  alternative: നിങ്ങൾ സ്വീകരിച്ച / അവൻ സ്വീകരിച്ച
  rationale: അച്ചടിച്ച SBLGNT പാഠത്തിന്റെ മൂന്നാംപുരുഷ ബഹുവചനം നിലനിർത്തി അതിലെ യഥാർഥ വ്യാകരണപിരിമുറുക്കം സംരക്ഷിക്കുന്നു; സുഗമമാക്കുന്ന മറ്റു സാക്ഷ്യങ്ങൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ സഭാവായനാശൈലി. അധികാരപൂർവമായ കല്പനയുടെ ഭാവം നിലനിർത്തിയെങ്കിലും അനാവശ്യമായ നിയമസാങ്കേതിക ഭാഷ ഒഴിവാക്കി. ‘ക്രമംകെട്ടു ജീവിക്കുക’ എന്നത് സന്ദർഭത്തിലെ അലസത ഉൾക്കൊള്ളാവുന്ന വിശാല പ്രയോഗമാണ്. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
