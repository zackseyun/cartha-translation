id: 2TH.3.4
reference: 2 Thessalonians 3:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πεποίθαμεν δὲ ἐν κυρίῳ ἐφ’ ὑμᾶς, ὅτι ἃ ⸀παραγγέλλομεν καὶ ποιεῖτε καὶ ποιήσετε.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/004.yaml
  text: And we have confidence in the Lord about you, that you are doing and will do what we command.
translation:
  language: ml
  text: 'നിങ്ങളെക്കുറിച്ച് കർത്താവിൽ ഞങ്ങൾക്ക് ഉറപ്പുണ്ട്: ഞങ്ങൾ കല്പിക്കുന്ന കാര്യങ്ങൾ നിങ്ങൾ ഇപ്പോൾ ചെയ്യുന്നു, ഇനിയും ചെയ്യും.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεποίθαμεν
  choice: ഞങ്ങൾക്ക് ഉറപ്പുണ്ട്
  rationale: സന്ദർഭത്തിലെ സ്ഥിരമായ വിശ്വാസവും ആത്മവിശ്വാസവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐν κυρίῳ
  choice: കർത്താവിൽ
  rationale: ഉറപ്പിന്റെ അടിസ്ഥാനവും പരിധിയും കർത്താവാണെന്ന ഗ്രീക്ക് പ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἐφ’ ὑμᾶς
  choice: നിങ്ങളെക്കുറിച്ച്
  rationale: ഇവിടെ വ്യക്തികളോടുള്ള/അവരെക്കുറിച്ചുള്ള ആത്മവിശ്വാസം സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: παραγγέλλομεν
  choice: ഞങ്ങൾ കല്പിക്കുന്ന
  rationale: അപ്പൊസ്തലിക നിർദേശത്തിന്റെ അധികാരഭാവം നഷ്ടപ്പെടുത്താതെ παραγγέλλω എന്നതിന്റെ ശക്തി പകർന്നു നൽകുന്നു.
- source_word: καὶ ποιεῖτε καὶ ποιήσετε
  choice: നിങ്ങൾ ഇപ്പോൾ ചെയ്യുന്നു, ഇനിയും ചെയ്യും
  rationale: വർത്തമാനവും ഭാവിയും തമ്മിലുള്ള വ്യത്യാസം വ്യക്തമായി പുനരാവിഷ്കരിക്കുന്നു; ആവർത്തിച്ച καίയുടെ സംയുക്ത ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: വിശ്വാസത്തിന്റെ അടിസ്ഥാനം
  choice: കർത്താവിൽ ഞങ്ങൾക്ക് ഉറപ്പുണ്ട്
  alternative: നിങ്ങളിൽ ഞങ്ങൾക്ക് ഉറപ്പുണ്ട്
  rationale: ἐν κυρίῳ എന്നത് ഉറപ്പ് വിശ്വാസികളിൽ മാത്രം അധിഷ്ഠിതമല്ല, കർത്താവിൽ അധിഷ്ഠിതമാണെന്ന് വ്യക്തമാക്കുന്നു; അതേസമയം ἐφ’ ὑμᾶς മൂലം അത് അവരെക്കുറിച്ചുള്ള ഉറപ്പാണ്.
- issue: ആജ്ഞയുടെ സ്വഭാവം
  choice: കല്പിക്കുന്ന കാര്യങ്ങൾ
  alternative: നിർദേശിക്കുന്ന കാര്യങ്ങൾ
  rationale: παραγγέλλομεν എന്ന പദത്തിലെ അധികാരപരമായ ഭാവം സംരക്ഷിക്കുന്നു; പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗ്രീക്ക് വാക്യത്തിലെ കർത്താവിൽ അധിഷ്ഠിതമായ ഉറപ്പും വർത്തമാന-ഭാവി കാലവ്യത്യാസവും സംരക്ഷിച്ചിരിക്കുന്നു.
