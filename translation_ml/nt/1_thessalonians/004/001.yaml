id: 1TH.4.1
reference: 1 Thessalonians 4:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Λοιπὸν ⸀οὖν, ἀδελφοί, ἐρωτῶμεν ὑμᾶς καὶ παρακαλοῦμεν ἐν κυρίῳ Ἰησοῦ, ⸀ἵνα καθὼς παρελάβετε παρ’ ἡμῶν τὸ πῶς δεῖ ὑμᾶς περιπατεῖν καὶ ἀρέσκειν θεῷ, ⸂καθὼς καὶ περιπατεῖτε⸃, ἵνα περισσεύητε μᾶλλον.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/001.yaml
  text: Finally then[a], brothers, we ask and urge you in the Lord Jesus that, just as you received from us how you ought to walk and to please God, just as you are also walking, you abound more and more.
translation:
  language: ml
  text: 'അതിനാൽ, ഒടുവിലായി, സഹോദരന്മാരേ[a], കർത്താവായ യേശുവിൽ ഞങ്ങൾ നിങ്ങളോടു അപേക്ഷിക്കുകയും ഉദ്ബോധിപ്പിക്കുകയും ചെയ്യുന്നു: നിങ്ങൾ എങ്ങനെ ജീവിക്കുകയും ദൈവത്തെ പ്രസാദിപ്പിക്കുകയും വേണമെന്ന് ഞങ്ങളിൽനിന്ന് സ്വീകരിച്ചതുപോലെ—നിങ്ങൾ ഇപ്പോൾ അങ്ങനെ ജീവിക്കുന്നതുപോലെതന്നെ—കൂടുതൽ കൂടുതൽ പുരോഗമിക്കുവിൻ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സഹോദരന്മാരും സഹോദരിമാരും’ എന്നും വിവർത്തനം ചെയ്യാം; ഗ്രീക്കിൽ ‘സഹോദരന്മാർ’ എന്നാണ്, എന്നാൽ പുല്ലിംഗ ബഹുവചനം പലപ്പോഴും സ്ത്രീകളും പുരുഷന്മാരും ഉൾപ്പെട്ട ഒരു സമൂഹത്തെ അഭിസംബോധന ചെയ്യാൻ ഉപയോഗിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λοιπὸν οὖν
  choice: അതിനാൽ ഒടുവിലായി
  rationale: οὖν എന്നതിന്റെ നിഗമന/ബന്ധകഭാവവും λοιπὸν സൂചിപ്പിക്കുന്ന അവസാനഘട്ടത്തിലേക്കുള്ള വിഷയമാറ്റവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചനം നേരിട്ട് നിലനിർത്തുന്നു; മുഴുവൻ വിശ്വാസിസമൂഹത്തെയും ഉൾക്കൊള്ളാവുന്ന പ്രയോഗമാണെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐρωτῶμεν ... καὶ παρακαλοῦμεν
  choice: ഞങ്ങൾ നിങ്ങളോട് അപേക്ഷിക്കുകയും പ്രബോധിപ്പിക്കുകയും ചെയ്യുന്നു
  rationale: ആദ്യ ക്രിയയിലെ വിനയപൂർവമായ അഭ്യർഥനയും രണ്ടാമത്തേതിലെ ഗൗരവമുള്ള ഉദ്ബോധനവും വേർതിരിച്ചു പ്രകടമാക്കുന്നു.
- source_word: ἐν κυρίῳ Ἰησοῦ
  choice: കർത്താവായ യേശുവിൽ
  rationale: ἐν എന്നതിന്റെ ‘യിൽ’ എന്ന രൂപവും κύριος എന്ന ക്രിസ്തുശീർഷകത്തിന്റെ ശക്തിയും നിലനിർത്തുന്നു; അഭ്യർഥനയുടെ ബന്ധമേഖലയും അധികാരവും സൂചിപ്പിക്കുന്നു.
- source_word: τὸ πῶς δεῖ ὑμᾶς περιπατεῖν
  choice: നിങ്ങൾ എങ്ങനെ ജീവിക്കണം
  rationale: περιπατεῖν അക്ഷരാർഥത്തിൽ ‘നടക്കുക’ എന്നാണെങ്കിലും ഇവിടെ ജീവിതനടപ്പിനെ സൂചിപ്പിക്കുന്ന പൗലോസിന്റെ രൂപകമാണ്; സാധാരണ മലയാളവായനക്കാർക്ക് ഉടൻ ഗ്രഹിക്കാവുന്ന ‘ജീവിക്കുക’ തിരഞ്ഞെടുത്തു.
- source_word: καὶ ἀρέσκειν θεῷ
  choice: ദൈവത്തെ പ്രസാദിപ്പിക്കുകയും
  rationale: ദൈവത്തിന് ഇഷ്ടകരമായി ജീവിക്കുക എന്ന അർഥം നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: καθὼς καὶ περιπατεῖτε
  choice: നിങ്ങൾ ഇപ്പോൾ അങ്ങനെ ജീവിക്കുന്നുമുണ്ട്
  rationale: വായനക്കാരുടെ നിലവിലുള്ള ജീവിതനടപ്പിനെ അംഗീകരിക്കുന്ന വർത്തമാനകാലഭാവവും καί നൽകുന്ന ഊന്നലും പ്രകടമാക്കുന്നു.
- source_word: ἵνα περισσεύητε μᾶλλον
  choice: അതിൽ ഇനിയും അധികമധികം വളരുക
  rationale: നിലവിലുള്ള നല്ല ജീവിതത്തിൽ തുടർന്നും മികവിലേക്കും സമൃദ്ധിയിലേക്കും മുന്നേറണമെന്ന περισσεύωയുടെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: തെസ്സലോനിക്കയിലെ വിശ്വാസികളോടുള്ള ലിംഗസൂചക അഭിസംബോധന
  choice: മുഖ്യപാഠത്തിൽ ‘സഹോദരന്മാരേ’; ഉൾക്കൊള്ളുന്ന പ്രയോഗസാധ്യത അടിക്കുറിപ്പിൽ
  alternative: ‘സഹോദരീസഹോദരന്മാരേ’ അല്ലെങ്കിൽ ‘സഹോദരങ്ങളേ’
  rationale: ἀδελφοί വ്യാകരണപരമായി പുല്ലിംഗ ബഹുവചനമാണെങ്കിലും സന്ദർഭത്തിൽ മുഴുവൻ സഭാസമൂഹത്തെയും അഭിസംബോധന ചെയ്യുന്നു. മൂലരൂപം പാഠത്തിൽ നിലനിർത്തി സന്ദർഭപരമായ ഉൾക്കൊള്ളൽ അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
- issue: യേശുവിനെ കുറിച്ചുള്ള κύριος എന്ന ശീർഷകം
  choice: കർത്താവ്
  alternative: നാഥൻ, യജമാനൻ
  rationale: ഇവിടെ κύριος യേശുവിന്റെ അധികാരവും സ്ഥാനവും സൂചിപ്പിക്കുന്ന ക്രിസ്തുശീർഷകമാണ്; മലയാള ബൈബിൾഭാഷയിലും ആധുനിക ക്രൈസ്തവ പ്രയോഗത്തിലും ‘കർത്താവ്’ വ്യക്തവും ഗൗരവമുള്ളതുമാണ്.
- issue: ἐν κυρίῳ Ἰησοῦയുടെ ബന്ധം
  choice: ‘കർത്താവായ യേശുവിൽ’ എന്ന നിലയിൽ അവ്യക്തത സംരക്ഷിച്ചു
  alternative: ‘കർത്താവായ യേശുവിന്റെ അധികാരത്തിൽ’ അല്ലെങ്കിൽ ‘കർത്താവായ യേശുവിലൂടെ’
  rationale: ഗ്രീക്ക് പ്രയോഗം ബന്ധമേഖലയെയോ അധികാരത്തെയോ ഉൾക്കൊള്ളാം. ഒരു വ്യാഖ്യാനം മാത്രം പാഠത്തിൽ ഉറപ്പിക്കാതെ ‘യിൽ’ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘നടക്കുക’ എന്ന ഗ്രീക്ക് രൂപകം അക്ഷരാർഥത്തിൽ പകർത്താതെ സന്ദർഭാർഥമായ ‘ജീവിക്കുക’ ഉപയോഗിച്ചു. ദീർഘമായ ഗ്രീക്ക് വാക്യഘടന വായനാസൗകര്യത്തിനായി ദ്വിബിന്ദുവും ഇടവരകളും ഉപയോഗിച്ച് ക്രമപ്പെടുത്തി; ആവർത്തനപരമായ ἵνα ഘടന മലയാളത്തിൽ കല്പനാഭാവമുള്ള അവസാന പ്രയോഗമായി സ്വാഭാവികമാക്കി.
