revisions:
- from: 'അതിനാൽ ഒടുവിലായി, സഹോദരന്മാരേ[a], കർത്താവായ യേശുവിൽ ഞങ്ങൾ നിങ്ങളോട് അപേക്ഷിക്കുകയും പ്രബോധിപ്പിക്കുകയും ചെയ്യുന്നു: നിങ്ങൾ എങ്ങനെ ജീവിക്കുകയും ദൈവത്തെ പ്രസാദിപ്പിക്കുകയും വേണമെന്ന് ഞങ്ങളിൽനിന്ന് സ്വീകരിച്ചതുപോലെ—നിങ്ങൾ ഇപ്പോൾ അങ്ങനെ ജീവിക്കുന്നുമുണ്ട്—അതിൽ ഇനിയും അധികമധികം വളരുക.'
  to: 'അതിനാൽ, ഒടുവിലായി, സഹോദരന്മാരേ[a], കർത്താവായ യേശുവിൽ ഞങ്ങൾ നിങ്ങളോടു അപേക്ഷിക്കുകയും ഉദ്ബോധിപ്പിക്കുകയും ചെയ്യുന്നു: നിങ്ങൾ എങ്ങനെ ജീവിക്കുകയും ദൈവത്തെ പ്രസാദിപ്പിക്കുകയും വേണമെന്ന് ഞങ്ങളിൽനിന്ന് സ്വീകരിച്ചതുപോലെ—നിങ്ങൾ ഇപ്പോൾ അങ്ങനെ ജീവിക്കുന്നതുപോലെതന്നെ—കൂടുതൽ കൂടുതൽ പുരോഗമിക്കുവിൻ.'
  rationale: The revision makes only idiomatic and semantic clarifications. It preserves the Greek transition, address, present-tense acknowledgement, and exhortational conclusion, while removing the added/unclear ‘അതിൽ’ and using a more fitting Malayalam equivalent for the appeal to abound still more.
