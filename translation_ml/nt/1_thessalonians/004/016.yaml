id: 1TH.4.16
reference: 1 Thessalonians 4:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι αὐτὸς ὁ κύριος ἐν κελεύσματι, ἐν φωνῇ ἀρχαγγέλου καὶ ἐν σάλπιγγι θεοῦ, καταβήσεται ἀπ’ οὐρανοῦ, καὶ οἱ νεκροὶ ἐν Χριστῷ ἀναστήσονται πρῶτον,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/016.yaml
  text: For the Lord himself will descend from heaven with a command[a], with the voice of an archangel, and with the trumpet of God, and the dead in Messiah will rise first[b],
translation:
  language: ml
  text: എന്തെന്നാൽ, കർത്താവുതന്നെ ആജ്ഞാവിളിയോടും[a] ഒരു പ്രധാനദൂതന്റെ ശബ്ദത്തോടും ദൈവത്തിന്റെ കാഹളത്തോടുംകൂടെ സ്വർഗത്തിൽനിന്ന് ഇറങ്ങിവരും; മശീഹയിൽ മരിച്ചവർ ആദ്യം ഉയിർത്തെഴുന്നേൽക്കും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആജ്ഞാപിക്കുന്ന ഉച്ചവിളിയോടും.” ഗ്രീക്ക് പദം ഒരു വിളിപ്പോലെയുള്ള ആജ്ഞയെയോ ആജ്ഞാപിക്കുന്ന ഉച്ചവിളിയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: 'പരമ്പരാഗത പരിഭാഷ: “ക്രിസ്തുവിൽ മരിച്ചവർ ആദ്യം ഉയിർത്തെഴുന്നേൽക്കും.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ ആശ്വാസത്തിന് വിശദീകരണം നൽകുന്ന കാരണാത്മക-വിവരണാത്മക ബന്ധം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: αὐτὸς ὁ κύριος
  choice: കർത്താവുതന്നെ
  rationale: αὐτός നൽകുന്ന ഊന്നൽ ‘തന്നെ’ എന്ന പ്രയോഗം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: ἐν κελεύσματι
  choice: ആജ്ഞാവിളിയോടും
  rationale: κέλευσμα എന്നത് അധികാരപൂർവമായ ആജ്ഞയെയോ വിളിച്ചുപറയുന്ന ആജ്ഞയെയോ സൂചിപ്പിക്കാം; സംയുക്തപദം ഈ രണ്ടു ഭാവങ്ങളും ചുരുക്കമായി ഉൾക്കൊള്ളുന്നു.
- source_word: ἐν φωνῇ ἀρχαγγέλου
  choice: പ്രധാനദൂതന്റെ ശബ്ദത്തോടും
  rationale: φωνή എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘ശബ്ദം’ നിലനിർത്തുകയും അനിർദിഷ്ടമായ ἀρχαγγέλου-നെ നിർബന്ധമായി ഒരു പ്രത്യേക പ്രധാനദൂതനായി തിരിച്ചറിയാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐν σάλπιγγι θεοῦ
  choice: ദൈവത്തിന്റെ കാഹളനാദത്തോടുംകൂടെ
  rationale: σάλπιγξ കാഹളത്തെ സൂചിപ്പിക്കുന്നു; സംഭവത്തിൽ കേൾക്കുന്ന നാദത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ ‘കാഹളനാദം’ ഉപയോഗിച്ചു.
- source_word: καταβήσεται ἀπ’ οὐρανοῦ
  choice: സ്വർഗത്തിൽനിന്ന് ഇറങ്ങിവരും
  rationale: താഴേക്കുള്ള ചലനവും വരവിന്റെ ആശയവും മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ രീതിയിൽ നൽകുന്നു.
- source_word: οἱ νεκροὶ ἐν Χριστῷ
  choice: മശീഹയിൽ മരിച്ചവർ
  rationale: νεκροί-യെ സ്വാഭാവിക മലയാളത്തിൽ ‘മരിച്ചവർ’ എന്നു നൽകുന്നു; Χριστός ഇവിടെ അഭിഷിക്തൻ എന്ന സ്ഥാനപ്പേരായതിനാൽ ‘മശീഹ’ ഉപയോഗിക്കുന്നു.
- source_word: ἀναστήσονται πρῶτον
  choice: ആദ്യം ഉയിർത്തെഴുന്നേൽക്കും
  rationale: ക്രിയയുടെ അകർമ്മക രൂപവും അടുത്ത വാക്യവുമായി ബന്ധപ്പെട്ട ക്രമസൂചനയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἐν Χριστῷ എന്നതിലെ Χριστός-ന്റെ പരിഭാഷ
  choice: മശീഹയിൽ
  alternative: ക്രിസ്തുവിൽ
  rationale: Χριστός ഇവിടെ സ്ഥാനപ്പേരിന്റെ അർഥം വഹിക്കുന്നതിനാൽ ‘മശീഹ’ മുഖ്യപാഠത്തിൽ നൽകി; പരിചിതമായ പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- issue: ἀναστήσονται എന്ന ക്രിയയുടെ കർത്തൃ/കർമ്മണി ഭാവം
  choice: ഉയിർത്തെഴുന്നേൽക്കും
  alternative: ഉയിർപ്പിക്കപ്പെടും
  rationale: ഗ്രീക്ക് രൂപം ഭാവികാല മധ്യമാണെങ്കിലും ഇവിടെ അകർമ്മകമായ ‘rise’ എന്ന അർഥമാണ് സ്വാഭാവികം; കർമ്മണി രൂപം അനാവശ്യമായി ഇറക്കുമതി ചെയ്തില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. സമാന്തരമായ മൂന്ന് ἐν ഘടനകൾ ‘-ഓടും’ എന്ന രൂപത്തിൽ നിലനിർത്തി; അവസാനത്തേതിൽ ‘കൂടെ’ ചേർത്ത് മലയാളവാക്യത്തിന്റെ ഒഴുക്ക് സ്വാഭാവികമാക്കി.
