reference: 1 Thessalonians 4:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οὐ θέλομεν δὲ ὑμᾶς ἀγνοεῖν, ἀδελφοί, περὶ τῶν ⸀κοιμωμένων, ἵνα μὴ λυπῆσθε καθὼς καὶ οἱ λοιποὶ οἱ μὴ ἔχοντες ἐλπίδα.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/013.yaml
  text: But we do not want you to be uninformed[a], brothers, about those who have fallen asleep, so that you may not grieve as the rest do[b], who have no hope.
translation:
  language: ml
  text: എന്നാൽ സഹോദരന്മാരേ,[a] നിദ്രപ്രാപിച്ചവരെക്കുറിച്ച്[b] നിങ്ങൾ അറിയാതിരിക്കണമെന്ന് ഞങ്ങൾ ആഗ്രഹിക്കുന്നില്ല; പ്രത്യാശയില്ലാത്ത മറ്റുള്ളവരെപ്പോലെ നിങ്ങൾ ദുഃഖിക്കാതിരിക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സഹോദരന്മാർ’ എന്ന അഭിസംബോധന ഇവിടെ സഭയെ മുഴുവനായി ഉദ്ദേശിക്കുന്നതിനാൽ സ്ത്രീകളെയും പുരുഷന്മാരെയും ഉൾക്കൊള്ളുന്നു.
    reason: cultural_note
  - marker: b
    text: അഥവാ, ‘ഉറങ്ങിക്കൊണ്ടിരിക്കുന്നവർ’; ഇവിടെ മരിച്ച വിശ്വാസികളെ സൂചിപ്പിക്കാൻ പൗലോസ് ‘നിദ്ര’ എന്ന രൂപകം ഉപയോഗിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ θέλομεν δὲ
  choice: എന്നാൽ ... ഞങ്ങൾ ആഗ്രഹിക്കുന്നില്ല
  rationale: δέ ഇവിടെ മൃദുവായ ആശയബന്ധമോ വ്യത്യാസമോ സൂചിപ്പിക്കുന്നു; ‘എന്നാൽ’ സന്ദർഭമാറ്റം സ്വാഭാവികമായി അറിയിക്കുന്നു. θέλομεν എന്നതിന്റെ ബഹുവചനവും നിഷേധരൂപവും നിലനിർത്തുന്നു.
- source_word: ὑμᾶς ἀγνοεῖν
  choice: നിങ്ങൾ അറിയാതിരിക്കണമെന്ന്
  rationale: ἀγνοεῖν എന്നത് ‘അറിയാതിരിക്കുക/വിവരം ലഭിക്കാതിരിക്കുക’ എന്നാണ്. അപമാനസൂചനയുള്ള പദം ഒഴിവാക്കി, ഗ്രീക്കിലെ infinitive ഘടനയുടെ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചന അഭിസംബോധന നേരിട്ട് നിലനിർത്തുന്നു; ഇത് സഭയിലെ സ്ത്രീകളെയും പുരുഷന്മാരെയും ഉൾക്കൊള്ളുന്ന അഭിസംബോധനയായിരിക്കാമെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: περὶ τῶν κοιμωμένων
  choice: നിദ്രപ്രാപിച്ചവരെക്കുറിച്ച്
  rationale: മരിച്ച വിശ്വാസികളെ സൂചിപ്പിക്കുന്ന ‘നിദ്ര’ എന്ന രൂപകം വ്യാഖ്യാനിച്ച് ഇല്ലാതാക്കാതെ, മലയാളത്തിൽ ഗൗരവമുള്ളതും മനസ്സിലാകുന്നതുമായ രീതിയിൽ നിലനിർത്തുന്നു.
- source_word: ἵνα μὴ λυπῆσθε
  choice: നിങ്ങൾ ദുഃഖിക്കാതിരിക്കേണ്ടതിനാണ് ഇത്
  rationale: ἵνα + subjunctive സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ദുഃഖം പൂർണമായും നിരോധിക്കുന്നു എന്നതിലുപരി, പ്രത്യാശയില്ലാത്തവരുടെ രീതിയിലുള്ള ദുഃഖമാണ് താരതമ്യത്തിലൂടെ ലക്ഷ്യമാക്കപ്പെടുന്നത്.
- source_word: καθὼς καὶ οἱ λοιποὶ
  choice: മറ്റുള്ളവരെപ്പോലെ
  rationale: വിശ്വാസിസമൂഹത്തിന് പുറത്തുള്ള ശേഷിക്കുന്ന ആളുകളോടുള്ള താരതമ്യം സംക്ഷിപ്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: οἱ μὴ ἔχοντες ἐλπίδα
  choice: പ്രത്യാശയില്ലാത്ത
  rationale: പ്രത്യാശ ഇല്ലാത്തവരെന്ന പങ്കാളിത്തപ്രയോഗത്തിന്റെ അർഥവും അന്ത്യകാല പ്രത്യാശയെ സംബന്ധിച്ച വൈരുധ്യവും നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: അന്ത്യകാലസന്ദർഭത്തിൽ κοιμωμένων എന്നതിന്റെ അർഥം
  choice: ‘നിദ്രപ്രാപിച്ചവർ’ എന്ന രൂപകം മുഖ്യവാക്യത്തിൽ നിലനിർത്തി.
  alternative: ‘മരിച്ചവർ’; ‘ഉറങ്ങുന്നവർ’
  rationale: പുനരുത്ഥാനപ്രത്യാശയുടെ സന്ദർഭത്തിൽ പൗലോസ് മരിച്ച വിശ്വാസികളെ ‘നിദ്രപ്രാപിച്ചവർ’ എന്നു രൂപകമായി വിളിക്കുന്നു. ‘മരിച്ചവർ’ എന്നു മാത്രം പരിഭാഷപ്പെടുത്തുന്നത് ഈ ദൈവശാസ്ത്രപരമായ രൂപകം ഇല്ലാതാക്കും; അടിക്കുറിപ്പ് ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു.
- issue: ἀδελφοί എന്ന അഭിസംബോധനയുടെ വ്യാപ്തി
  choice: മുഖ്യവാക്യത്തിൽ ‘സഹോദരന്മാരേ’ എന്നു നൽകി, സഭയിലെ സ്ത്രീപുരുഷന്മാരെ ഉൾക്കൊള്ളാൻ സാധ്യതയുണ്ടെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: ‘സഹോദരീസഹോദരന്മാരേ’; ‘സഹോദരങ്ങളേ’
  rationale: ഗ്രീക്കിലെ വ്യാകരണപരമായ പുല്ലിംഗ ബഹുവചനം മുഖ്യവാക്യത്തിൽ സംരക്ഷിക്കുമ്പോഴും, പൗലോസിന്റെ സഭാഭിസംബോധനയുടെ സാധ്യതയുള്ള ഉൾക്കൊള്ളുന്ന വ്യാപ്തി മറച്ചുവയ്ക്കുന്നില്ല.
translation_notes:
  register: 'ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ സഭാഭാഷയാണ് ഉപയോഗിച്ചത്. ‘നിദ്രപ്രാപിച്ചവർ’ എന്ന പ്രയോഗം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ രൂപകം നിലനിർത്തുന്നു. ഇംഗ്ലീഷ് ഉപദേശപാളിയിൽ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും അവയുടെ ഉള്ളടക്കവും തമ്മിലുണ്ടായിരുന്ന സ്ഥാനവൈരുധ്യം തിരുത്തി: സഭാഭിസംബോധനയ്ക്കു [a], നിദ്രാരൂപകത്തിനു [b] ചേർത്തു.'
