  terminology: “സഹോദരസ്നേഹം” retains the familial imagery and lexical distinction from “സ്നേഹിക്കാൻ.” “ദൈവത്താൽ പഠിപ്പിക്കപ്പെട്ടവർ” accurately and naturally renders divine instruction without imposing interpretation.
