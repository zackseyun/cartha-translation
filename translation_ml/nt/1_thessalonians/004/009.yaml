  text: Περὶ δὲ τῆς φιλαδελφίας οὐ χρείαν ἔχετε γράφειν ὑμῖν, αὐτοὶ γὰρ ὑμεῖς θεοδίδακτοί ἐστε εἰς τὸ ἀγαπᾶν ἀλλήλους·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/009.yaml
  text: Concerning brotherly love, you have no need for anyone to write to you, for you yourselves are taught by God to love one another.
translation:
  language: ml
  text: സഹോദരസ്നേഹത്തെക്കുറിച്ചാകട്ടെ[a], നിങ്ങളോടു എഴുതേണ്ട ആവശ്യമില്ല[b]; കാരണം, പരസ്പരം സ്നേഹിക്കാൻ നിങ്ങൾതന്നെ ദൈവത്താൽ പഠിപ്പിക്കപ്പെട്ടവരാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ വ്യക്തമായി: ‘സഹവിശ്വാസികളോടുള്ള സ്നേഹം.’ ‘സഹോദരസ്നേഹം’ എന്നതിനുള്ള ഗ്രീക്ക് പദം വിശ്വാസസമൂഹത്തിനുള്ളിലെ കുടുംബബന്ധത്തിന്റെ ഭാവചിത്രം വഹിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ എഴുതുന്നയാളെ വ്യക്തമാക്കുന്നില്ല; സന്ദർഭത്തിൽ പൗലൊസും സഹപ്രേഷകരും ഉദ്ദേശിക്കപ്പെട്ടിരിക്കാം. ഇവിടെ അർഥം, നിങ്ങളോടു എഴുതേണ്ട ആവശ്യമില്ല എന്നതാണ്.
    reason: source_ambiguity
lexical_decisions:
- source_word: Περὶ δὲ
  choice: സഹോദരസ്നേഹത്തെക്കുറിച്ചാകട്ടെ
  rationale: περὶ പുതിയ വിഷയം അവതരിപ്പിക്കുന്നു; δέ നൽകുന്ന മൃദുവായ വിഷയമാറ്റം മലയാളത്തിലെ ‘-ആകട്ടെ’ സ്വാഭാവികമായി അറിയിക്കുന്നു. സ്രോതസ്സിൽ കാലസൂചകമായ ‘ഇപ്പോൾ’ ഇല്ലാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല.
- source_word: φιλαδελφίας
  choice: സഹോദരസ്നേഹം
  rationale: വിശ്വാസസമൂഹത്തിനുള്ളിലെ കുടുംബബന്ധസദൃശമായ സ്നേഹത്തെ സൂചിപ്പിക്കുന്ന പദം. ‘സഹോദരസ്നേഹം’ എന്നത് ആ രൂപകം നിലനിർത്തുകയും പിന്നീടുള്ള ἀγαπᾶν എന്ന ക്രിയയിൽനിന്നുള്ള പദവ്യത്യാസം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: οὐ χρείαν ἔχετε γράφειν ὑμῖν
  choice: നിങ്ങൾക്ക് എഴുതേണ്ട ആവശ്യമില്ല
  rationale: γράφειν എന്ന അനന്തക്രിയയുടെ കർത്താവ് ഗ്രീക്കിൽ വ്യക്തമാക്കിയിട്ടില്ല. മലയാളത്തിൽ കർത്താവിനെ ചേർക്കാതെതന്നെ വാക്യം സ്വാഭാവികമായതിനാൽ ‘ആരും’ എന്നോ ‘ഞങ്ങൾ’ എന്നോ അധികമായി നിർണ്ണയിക്കാതെ സ്രോതസ്സിലെ തുറന്ന നില സംരക്ഷിച്ചു.
- source_word: αὐτοὶ γὰρ ὑμεῖς
  choice: കാരണം ... നിങ്ങൾതന്നെ
  rationale: αὐτοὶ ὑμεῖς നൽകുന്ന ഊന്നൽ ‘നിങ്ങൾതന്നെ’ എന്നതിലൂടെ നിലനിർത്തി; γὰρ വിശദീകരണകാരണം അവതരിപ്പിക്കുന്നതിനാൽ ‘കാരണം’ ഉപയോഗിച്ചു.
- source_word: θεοδίδακτοί
  choice: ദൈവത്താൽ പഠിപ്പിക്കപ്പെട്ടവർ
  rationale: ദൈവമാണ് പഠിപ്പിക്കുന്നവൻ എന്ന കർത്തൃത്വം വ്യക്തമായി സൂക്ഷിക്കുന്ന, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗം.
- source_word: εἰς τὸ ἀγαπᾶν ἀλλήλους
  choice: പരസ്പരം സ്നേഹിക്കാൻ
  rationale: εἰς τό + infinitive ഇവിടെ ലക്ഷ്യമോ ഫലമോ സൂചിപ്പിക്കാം. ‘സ്നേഹിക്കാൻ’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികമാണ്; ലക്ഷ്യം/ഫലം എന്ന സൂക്ഷ്മത അനാവശ്യമായി തീർപ്പാക്കുന്നില്ല.
theological_decisions:
- issue: φιλαδελφία എന്ന നാമവും ἀγαπᾶν എന്ന ക്രിയയും തമ്മിലുള്ള പദവ്യത്യാസം
  choice: ആദ്യത്തേത് ‘സഹോദരസ്നേഹം’ എന്നും രണ്ടാമത്തേത് ‘സ്നേഹിക്കുക’ എന്നും പരിഭാഷപ്പെടുത്തി.
  alternative: രണ്ടും പൊതുവായി ‘സ്നേഹം/സ്നേഹിക്കുക’ എന്നു പരിഭാഷപ്പെടുത്തുക.
  rationale: പൗലൊസിന്റെ കുടുംബബന്ധഭാഷയും അതിൽനിന്ന് പൊതുവായ പരസ്പരസ്നേഹത്തിലേക്കുള്ള പദചലനവും ഇതിലൂടെ നിലനിൽക്കുന്നു.
- issue: γράφειν എന്ന അനന്തക്രിയയുടെ സൂചിത കർത്താവ്
  choice: മുഖ്യവാക്യത്തിൽ കർത്താവിനെ വ്യക്തമാക്കാതെ ‘നിങ്ങൾക്ക് എഴുതേണ്ട ആവശ്യമില്ല’ എന്നു നൽകി.
  alternative: ‘ഞങ്ങൾ നിങ്ങൾക്ക് എഴുതേണ്ട ആവശ്യമില്ല’ അല്ലെങ്കിൽ ‘ആരും നിങ്ങൾക്ക് എഴുതേണ്ട ആവശ്യമില്ല’ എന്നു നൽകുക.
  rationale: സന്ദർഭത്തിൽ പൗലൊസും സഹപ്രേഷകരും ആയിരിക്കാം ഉദ്ദേശിച്ച കർത്താക്കൾ; എങ്കിലും ഗ്രീക്ക് വാക്യത്തിൽ കർത്താവ് പ്രസ്താവിച്ചിട്ടില്ല. മലയാളം അത് സ്വാഭാവികമായി തുറന്നുവയ്ക്കാൻ അനുവദിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘സഹോദരസ്നേഹം’ എന്ന സഭാപരമായി പരിചിതമായ പദം നിലനിർത്തിയെങ്കിലും അതിന്റെ ഉൾക്കൊള്ളുന്ന അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി. നീണ്ട സംസ്കൃതവത്കൃത പ്രയോഗങ്ങൾ ഒഴിവാക്കി; സ്രോതസ്സിലെ ഊന്നലും കർത്താവിനെക്കുറിച്ചുള്ള അവ്യക്തതയും സംരക്ഷിച്ചു.
