id: 1TH.4.2
reference: 1 Thessalonians 4:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἴδατε γὰρ τίνας παραγγελίας ἐδώκαμεν ὑμῖν διὰ τοῦ κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/002.yaml
  text: For you know what instructions we gave you through the Lord Jesus[a].
translation:
  language: ml
  text: കാരണം, കർത്താവായ യേശുവിലൂടെ ഞങ്ങൾ നിങ്ങൾക്കു നൽകിയ നിർദേശങ്ങൾ എന്തൊക്കെയാണെന്ന് നിങ്ങൾക്കറിയാം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “കർത്താവായ യേശുവിന്റെ അധികാരത്താൽ.”
    reason: διὰ τοῦ κυρίου Ἰησοῦ എന്ന പ്രയോഗത്തിലെ അധികാരപരമായ അർഥസാദ്ധ്യത സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: οἴδατε
  choice: നിങ്ങൾക്കറിയാമല്ലോ
  rationale: οἶδα എന്ന പൂർണരൂപം കൊയ്നേ ഗ്രീക്കിൽ വർത്തമാനകാല അർഥത്തിലാണ്; സന്ദർഭത്തിലെ പൊതുവായ അറിവിനെ സ്വാഭാവിക മലയാളത്തിൽ അറിയാമല്ലോ എന്നു നൽകുന്നു.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തിന് വിശദീകരണമോ അടിസ്ഥാനമോ നൽകുന്ന ബന്ധകശക്തി വ്യക്തമാക്കുന്നു.
- source_word: τίνας παραγγελίας
  choice: നിർദേശങ്ങൾ എന്തൊക്കെയെന്ന്
  rationale: τίνας എന്ന ബഹുവചന ചോദകത്തിന്റെ ഉള്ളടക്കവും παραγγελίαയിലെ അധികാരപൂർവമായ നിർദേശത്തിന്റെ ഭാവവും സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
- source_word: ἐδώκαμεν ὑμῖν
  choice: ഞങ്ങൾ നിങ്ങൾക്കു നൽകിയ
  rationale: δίδωμι എന്ന ക്രിയയുടെ ലളിതമായ അർഥം നിലനിർത്തുകയും ὑμῖν എന്ന പരോക്ഷകർമം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: διὰ τοῦ κυρίου Ἰησοῦ
  choice: കർത്താവായ യേശുവിലൂടെ
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന മാധ്യമം/കാര്യകർത്തൃത്വം ഔപചാരികമായി നിലനിർത്തുന്നു; അധികാരത്താൽ എന്ന സാദ്ധ്യമായ അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: κυρίου
  choice: കർത്താവ്
  rationale: κύριος എന്ന പദത്തിനുള്ള സ്ഥാപിതവും മാന്യവുമായ മലയാള ക്രൈസ്തവ പ്രയോഗം.
- source_word: Ἰησοῦ
  choice: യേശു
  rationale: വ്യക്തിനാമത്തിന്റെ പ്രമാണിക മലയാളരൂപം.
theological_decisions:
- issue: διὰ τοῦ κυρίου Ἰησοῦ എന്നതിന്റെ അർഥവ്യാപ്തി
  choice: കർത്താവായ യേശുവിലൂടെ
  alternative: കർത്താവായ യേശുവിന്റെ അധികാരത്താൽ
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിന് മാധ്യമം/കാര്യകർത്തൃത്വം എന്നും അധികാരപരമായ ആധാരം എന്നും മനസ്സിലാക്കാവുന്നതാണ്. മുഖ്യപാഠം കൂടുതൽ രൂപസുതാര്യമായ വായന നിലനിർത്തുന്നു; അധികാരത്തിന്റെ സൂചന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘നിർദേശങ്ങൾ’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതോടൊപ്പം παραγγελίαയുടെ അധികാരഭാവവും വഹിക്കുന്നു; ‘എന്തൊക്കെയെന്ന്’ ഗ്രീക്കിലെ ബഹുവചനത്തെ വ്യക്തമാക്കുന്നു.
