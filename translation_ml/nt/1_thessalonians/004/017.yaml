id: 1TH.4.17
reference: 1 Thessalonians 4:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔπειτα ἡμεῖς οἱ ζῶντες οἱ περιλειπόμενοι ἅμα σὺν αὐτοῖς ἁρπαγησόμεθα ἐν νεφέλαις εἰς ἀπάντησιν τοῦ κυρίου εἰς ἀέρα· καὶ οὕτως πάντοτε σὺν κυρίῳ ἐσόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/017.yaml
  text: Then we who are alive[a], who remain, will be caught up together with them in the clouds to meet the Lord in the air[b]; and so we will always be with the Lord.
translation:
  language: ml
  text: പിന്നെ, ജീവനോടെയിരിക്കുന്നവരും ശേഷിച്ചിരിക്കുന്നവരുമായ നാം അവരോടൊപ്പം ഒരുമിച്ച് മേഘങ്ങളിൽ കർത്താവിനെ ആകാശത്തിൽ എതിരേൽക്കാൻ എടുത്തുകൊള്ളപ്പെടും[a][b]. അങ്ങനെ നാം എപ്പോഴും കർത്താവിനോടുകൂടെ ആയിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പെട്ടെന്ന് തട്ടിയെടുക്കപ്പെടും.’ ഗ്രീക്ക് ക്രിയ പെട്ടെന്നുള്ളതും ശക്തമായതുമായ പിടിച്ചെടുക്കൽ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘കർത്താവുമായുള്ള കൂടിക്കാഴ്ചയ്ക്കായി.’ ഈ പ്രയോഗം ഒരാളെ എതിരേൽക്കാൻ പുറപ്പെടുന്നതിനെ സൂചിപ്പിക്കാം; എന്നാൽ ഈ കൂടിക്കാഴ്ചയ്ക്കപ്പുറമുള്ള വിശാലമായ സംഭവക്രമം ഈ വാക്യം തന്നെ വ്യക്തമാക്കുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔπειτα
  choice: പിന്നെ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ സംഭവത്തിനുശേഷമുള്ള അടുത്ത ഘട്ടത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: οἱ ζῶντες οἱ περιλειπόμενοι
  choice: ജീവനോടെയുള്ളവരും ശേഷിച്ചിരിക്കുന്നവരുമായ നാം
  rationale: കർത്താവിന്റെ വരവുവരെ മരിക്കാതെ ശേഷിക്കുന്ന വിശ്വാസികളെയാണ് ഈ രണ്ടു വിശേഷണപദപ്രയോഗങ്ങളും സൂചിപ്പിക്കുന്നത്; അപകടത്തിൽനിന്നുള്ള അതിജീവനം എന്ന അധിക അർഥം ചേർക്കുന്നില്ല.
- source_word: ἅμα σὺν αὐτοῖς
  choice: അവരോടൊപ്പം
  rationale: ഉയിർപ്പിക്കപ്പെട്ടവരുമായുള്ള ഒരുമയും ഒരേ സംഭവത്തിലുള്ള പങ്കാളിത്തവും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἁρπαγησόμεθα
  choice: പെട്ടെന്ന് പിടിച്ചെടുക്കപ്പെടും
  rationale: ἁρπάζω എന്ന ക്രിയയുടെ ഭാവികാല കർമണിപ്രയോഗത്തിലുള്ള പെട്ടെന്നുള്ളതും ശക്തിയേറിയതുമായ പ്രവർത്തനം വ്യക്തമാക്കുന്നു; അതേസമയം പിന്നീട് രൂപപ്പെട്ട ഏതെങ്കിലും പ്രത്യേക അന്ത്യകാലസിദ്ധാന്തം പദത്തിൽ കയറ്റുന്നില്ല.
- source_word: ἐν νεφέλαις
  choice: മേഘങ്ങളിൽ
  rationale: ബഹുവചനത്തിലുള്ള ദൃശ്യബിംബം അതേപടി നിലനിർത്തുന്നു; അതിനെ വ്യാഖ്യാനപരമായി അമൂർത്തമാക്കുന്നില്ല.
- source_word: εἰς ἀπάντησιν τοῦ κυρίου
  choice: കർത്താവിനെ എതിരേൽക്കാനായി
  rationale: ദിശയും ഉദ്ദേശ്യവും ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം; കൂടിക്കാഴ്ചയ്ക്കുശേഷമുള്ള സംഭവക്രമം നിർണയിക്കുന്നില്ല.
- source_word: εἰς ἀέρα
  choice: ആകാശത്തേക്ക്
  rationale: εἰς എന്നതിന്റെ ദിശാസൂചന നിലനിർത്തിക്കൊണ്ട് ἀήρ സൂചിപ്പിക്കുന്ന ഭൂമിക്കുമുകളിലെ വായുമേഖലയെ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി മനസ്സിലാകുന്ന വിധത്തിൽ നൽകുന്നു.
- source_word: καὶ οὕτως
  choice: അങ്ങനെ
  rationale: വിവരിച്ച സംഭവക്രമത്തിന്റെ ഫലമോ രീതിയോ സംക്ഷിപ്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: πάντοτε σὺν κυρίῳ ἐσόμεθα
  choice: നാം എപ്പോഴും കർത്താവിനോടുകൂടെ ആയിരിക്കും
  rationale: ഭാവിയിലെ ഉറപ്പും കർത്താവുമായുള്ള നിലനിൽക്കുന്ന സഹവാസവും നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘ἁρπαγησόμεθα’ എന്ന പദവും ‘റാപ്ചർ’ സംബന്ധിച്ച വ്യത്യസ്ത വ്യാഖ്യാനങ്ങളും
  choice: പെട്ടെന്ന് പിടിച്ചെടുക്കപ്പെടും
  alternative: എടുത്തുകൊള്ളപ്പെടും
  rationale: ഗ്രീക്ക് ക്രിയയിലെ പെട്ടെന്നുള്ള, ശക്തമായ പ്രവർത്തനം വിവർത്തനം ചെയ്യുന്നു; എന്നാൽ സംഭവത്തിന്റെ സമയം, ഘട്ടങ്ങൾ, സഭയുടെ അന്ത്യകാലസ്ഥാനം എന്നിവയെക്കുറിച്ചുള്ള ഒരു പ്രത്യേക വിഭാഗീയ ചട്ടക്കൂട് വാക്യത്തിൽ ചേർക്കുന്നില്ല.
- issue: ‘εἰς ἀπάντησιν τοῦ κυρίου’ എന്ന പ്രയോഗത്തിന്റെ അന്ത്യകാലസംബന്ധമായ വ്യാപ്തി
  choice: കർത്താവിനെ എതിരേൽക്കാനായി
  alternative: കർത്താവുമായുള്ള കൂടിക്കാഴ്ചയ്ക്കായി
  rationale: കർത്താവുമായുള്ള നേരിടൽ വ്യക്തമായി പറയുന്നു; എതിരേൽപ്പിനുശേഷം സംഘം എവിടേക്കാണ് പോകുന്നതെന്നോ വിശാലമായ സംഭവക്രമം എന്തെന്നോ ഈ വാക്യം മാത്രം നിർണയിക്കുന്നതായി അവതരിപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. പരമ്പരാഗത ബൈബിൾപദമായ ‘കർത്താവ്’ നിലനിർത്തിയെങ്കിലും അനാവശ്യമായ പുരാതന ക്രിയാരൂപങ്ങൾ ഒഴിവാക്കി. ‘ആകാശത്തേക്ക്’ സാധാരണ വായനാസൗകര്യത്തിനായി ഉപയോഗിച്ചു; ഇവിടെ ഉദ്ദേശിക്കുന്നത് ഭൂമിക്കുമുകളിലെ വായുമേഖലയാണ്, സ്വർഗം എന്ന ദൈവിക വാസസ്ഥലം നിർബന്ധമായും അല്ല.
