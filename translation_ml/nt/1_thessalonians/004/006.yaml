id: 1TH.4.6
reference: 1 Thessalonians 4:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τὸ μὴ ὑπερβαίνειν καὶ πλεονεκτεῖν ἐν τῷ πράγματι τὸν ἀδελφὸν αὐτοῦ, διότι ἔκδικος ⸀κύριος περὶ πάντων τούτων, καθὼς καὶ προείπαμεν ὑμῖν καὶ διεμαρτυράμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/006.yaml
  text: that no one should overstep and exploit his brother in this matter[a], because the Lord is an avenger concerning all these things[b], just as we also told you beforehand and solemnly warned you.
translation:
  language: ml
  text: ഈ കാര്യത്തിൽ ആരും അതിരുകടന്ന് തന്റെ സഹോദരനെ[b] ചൂഷണം ചെയ്യരുത്[a]. കാരണം, ഞങ്ങൾ മുമ്പുതന്നെ നിങ്ങളോടു പറയുകയും ഗൗരവമായി മുന്നറിയിപ്പ് നൽകുകയും ചെയ്തതുപോലെ, ഇവയെല്ലാം സംബന്ധിച്ച് കർത്താവ് പ്രതികാരം ചെയ്യുന്നവനാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഈ കാര്യത്തിൽ തന്റെ സഹോദരനെ വഞ്ചിക്കരുത്.” ഗ്രീക്ക് ക്രിയയ്ക്ക് മറ്റൊരാളെ മുതലെടുക്കുക എന്ന വിശാലമായ അർഥമുണ്ടാകാം; ചിലർ ഇതിനെ കൂടുതൽ ചുരുങ്ങിയ അർഥത്തിൽ വഞ്ചനയായി മനസ്സിലാക്കുന്നു. സന്ദർഭത്തിൽ ഈ മുന്നറിയിപ്പ് മിക്കവാറും ലൈംഗിക തെറ്റിനെക്കുറിച്ചാണ്.
    reason: lexical_alternative
  - marker: b
    text: “തന്റെ സഹോദരൻ” എന്നത് പുല്ലിംഗ ഏകവചനത്തിലുള്ള ഗ്രീക്ക് പ്രയോഗത്തിന്റെ പരിഭാഷയാണ്. ഇത് പ്രധാനമായി ഒരു സഹവിശ്വാസിയെ സൂചിപ്പിക്കുന്നതായി തോന്നുന്നു; എങ്കിലും ഈ നൈതിക മുന്നറിയിപ്പ് വിശ്വാസസമൂഹത്തിലെ മറ്റുള്ളവർക്കും ബാധകമായേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ μὴ ὑπερβαίνειν
  choice: ആരും അതിരുകടന്ന് ... ചെയ്യരുത്
  rationale: ആർട്ടിക്കുലർ ഇൻഫിനിറ്റീവ് മുൻവാക്യത്തിലെ പ്രബോധനം തുടരുന്നു. ὑπερβαίνω ധാർമ്മിക അതിർത്തി ലംഘിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നതിനാൽ, രൂപകവും സ്വാഭാവികമായ മലയാളവും നിലനിർത്താൻ ‘അതിരുകടന്ന്’ ഉപയോഗിച്ചു.
- source_word: πλεονεκτεῖν
  choice: ചൂഷണം ചെയ്യുക
  rationale: മറ്റൊരാളുടെ നഷ്ടത്തിൽ അന്യായലാഭമെടുക്കുകയോ അയാളെ മുതലെടുക്കുകയോ ചെയ്യുന്ന വിശാലമായ അർഥം ഇത് നൽകുന്നു; സാമ്പത്തിക വഞ്ചനയിലേക്കു മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: ἐν τῷ πράγματι
  choice: ഈ കാര്യത്തിൽ
  rationale: പദപ്രയോഗത്തിന്റെ പൊതുസ്വഭാവം നിലനിർത്തിക്കൊണ്ട്, 3–5 വാക്യങ്ങളിലെ ലൈംഗിക വിശുദ്ധിയെക്കുറിച്ചുള്ള അടുത്ത സന്ദർഭത്തിലേക്കുള്ള സൂചന സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: തന്റെ സഹോദരനെ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ഏകവചനരൂപം കൃത്യമായി നിലനിർത്തുന്നു. വിശ്വാസസമൂഹത്തിലെ സഹവിശ്വാസിയെയാണ് പ്രധാനമായി സൂചിപ്പിക്കുന്നതെന്ന സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἔκδικος κύριος
  choice: കർത്താവ് പ്രതികാരം ചെയ്യുന്നവനാണ്
  rationale: ἔκδικος അനീതിക്കെതിരെ ന്യായവിധി നടപ്പാക്കുന്നവനെയോ പ്രതികാരം ചെയ്യുന്നവനെയോ സൂചിപ്പിക്കുന്നു. ‘പ്രതികാരം ചെയ്യുന്നവൻ’ അതിന്റെ ശക്തമായ ന്യായവിധിസ്വരം നിലനിർത്തുന്നു; κύριος എന്നത് ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: περὶ πάντων τούτων
  choice: ഇവയെല്ലാം സംബന്ധിച്ച്
  rationale: ചർച്ചയിലുള്ള എല്ലാ തെറ്റുകളിലേക്കും വ്യാപിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ വിശാല പരിധി നിലനിർത്തുന്നു.
- source_word: προείπαμεν
  choice: മുമ്പുതന്നെ നിങ്ങളോടു പറയുകയും
  rationale: മുൻകൂട്ടിയോ മുമ്പേയോ അറിയിച്ചതെന്ന കാലസൂചന നിലനിർത്തുന്നു; തുടർന്നുള്ള ശക്തമായ ക്രിയയുമായി അനാവശ്യ ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: διεμαρτυράμεθα
  choice: ഗൗരവമായി മുന്നറിയിപ്പു നൽകുകയും
  rationale: διαμαρτύρομαι എന്നതിലെ ഊന്നിപ്പറയുന്ന സാക്ഷ്യപ്പെടുത്തൽ/ഗൗരവമായ മുന്നറിയിപ്പ് എന്ന ഭാവം പ്രബോധനസന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: ‘ഈ കാര്യത്തിൽ’ എന്നതിന്റെ സൂചനയും തെറ്റിന്റെ സ്വഭാവവും
  choice: 3–5 വാക്യങ്ങളിലെ ലൈംഗികധാർമ്മിക ഉപദേശം തുടരുന്നതായി വായിക്കുന്നു; അതിനാൽ ഈ വിഷയത്തിൽ സഹവിശ്വാസിയുടെ അതിർത്തി ലംഘിച്ച് അയാളെ ചൂഷണം ചെയ്യുന്നതിനെ വിലക്കുന്നു.
  alternative: വ്യാപാരത്തിലോ പൊതുവായ വ്യക്തിബന്ധങ്ങളിലോ ഉള്ള വഞ്ചനയെക്കുറിച്ചുള്ള നിർദേശമായി വായിക്കാം.
  rationale: തൊട്ടുമുമ്പുള്ള സന്ദർഭം വിശുദ്ധീകരണം, ലൈംഗിക അധാർമ്മികത, വിശുദ്ധിയിലും മാന്യതയിലും ശരീരത്തെ നിയന്ത്രിക്കൽ എന്നിവയെക്കുറിച്ചാണ്. എന്നിരുന്നാലും πλεονεκτεῖν പൊതുവായ വഞ്ചനയെയും സൂചിപ്പിക്കാം; അതിനാൽ മുഖ്യവാചകം അർഥം അമിതമായി ചുരുക്കാതെ ‘ചൂഷണം’ എന്നു നൽകുകയും മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്തു.
- issue: ἀδελφός എന്നതിന്റെ പരിഭാഷ
  choice: തന്റെ സഹോദരനെ
  alternative: സഹോദരനെയോ സഹോദരിയെയോ; മറ്റൊരു വിശ്വാസിയെ
  rationale: ഗ്രീക്ക് പദം പുല്ലിംഗ ഏകവചനമാണ്. മുഖ്യവാചകത്തിൽ ആ രൂപം നിലനിർത്തി; നൈതിക നിർദേശം വിശ്വാസസമൂഹത്തിൽ കൂടുതൽ വിശാലമായി ബാധകമായേക്കാമെന്ന കാര്യം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- issue: κύριος എന്നതിന്റെ പരിഭാഷ
  choice: കർത്താവ്
  alternative: നാഥൻ
  rationale: ഇവിടെ ന്യായവിധി നടത്തുന്ന ഉയിർത്തെഴുന്നേറ്റ കർത്താവിനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘കർത്താവ്’ എന്നത് മലയാള ബൈബിൾഭാഷയിൽ സ്വാഭാവികവും ദൈവശാസ്ത്രപരമായ തുടർച്ച നിലനിർത്തുന്നതുമാണ്.
- issue: ἔκδικος എന്നതിലെ പ്രതികാരവും ന്യായവിധിയും
  choice: പ്രതികാരം ചെയ്യുന്നവൻ
  alternative: നീതി നടപ്പാക്കുന്നവൻ
  rationale: ഗ്രീക്ക് പദത്തിന്റെ ശക്തമായ പ്രതികാര/ന്യായവിധി ഭാവം മൃദൂകരിക്കാതെ നിലനിർത്തുന്നു. ഇത് സ്വകാര്യ വൈരാഗ്യത്തെയല്ല, തെറ്റിന്മേൽ കർത്താവ് നടപ്പാക്കുന്ന ന്യായവിധിയെയാണ് സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം ഉപയോഗിച്ചു. ‘അതിരുകടന്ന്’, ‘ചൂഷണം’, ‘ഗൗരവമായി മുന്നറിയിപ്പ്’ എന്നീ പദങ്ങൾ ഗ്രീക്കിന്റെ രൂപകവും ശക്തിയും നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികത നൽകുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
