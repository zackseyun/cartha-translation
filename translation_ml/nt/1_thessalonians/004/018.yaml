id: 1TH.4.18
reference: 1 Thessalonians 4:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὥστε παρακαλεῖτε ἀλλήλους ἐν τοῖς λόγοις τούτοις.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/018.yaml
  text: Therefore encourage one another with these words[a].
translation:
  language: ml
  text: അതുകൊണ്ട് ഈ വാക്കുകളാൽ അന്യോന്യം പ്രോത്സാഹിപ്പിക്കുവിൻ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഈ വാക്കുകളാൽ അന്യോന്യം ആശ്വസിപ്പിക്കുവിൻ.’ ഈ ക്രിയയ്ക്ക് പ്രോത്സാഹിപ്പിക്കുക, ആശ്വസിപ്പിക്കുക, ഉദ്ബോധിപ്പിക്കുക എന്നീ അർഥങ്ങൾ വരാം; ഇവിടെ സന്ദർഭം പ്രത്യേകിച്ച് ഇടയപരിപാലനപരമായ ആശ്വാസത്തെ പിന്തുണയ്ക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: അതുകൊണ്ട്
  rationale: മുമ്പ് പറഞ്ഞ കർത്താവിന്റെ വരവ്, മരിച്ച വിശ്വാസികളുടെ ഉയിർപ്പ്, എല്ലാവരുടെയും പുനഃസംഗമം എന്നിവയിൽനിന്നുള്ള നിഗമനമാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്.
- source_word: παρακαλεῖτε
  choice: പ്രോത്സാഹിപ്പിക്കുവിൻ
  rationale: παρακαλέω എന്നതിന് പ്രോത്സാഹിപ്പിക്കുക, ആശ്വസിപ്പിക്കുക, ഉദ്ബോധിപ്പിക്കുക എന്നീ അർഥങ്ങൾ വരാം. ഇവിടെ ദുഃഖിക്കുന്ന വിശ്വാസികൾക്കുള്ള ഉറപ്പാണ് പശ്ചാത്തലം; ‘പ്രോത്സാഹിപ്പിക്കുക’ ഈ വിശാലമായ ഇടയപരിപാലന ഭാവം നിലനിർത്തുന്നു.
- source_word: ἀλλήλους
  choice: അന്യോന്യം
  rationale: പരസ്പരത വ്യക്തമാക്കുന്ന സ്വാഭാവികവും മാന്യവുമായ മലയാളപ്രയോഗമാണിത്.
- source_word: ἐν
  choice: -ആൽ
  rationale: ഇവിടെ ἐν പ്രോത്സാഹനത്തിന്റെ മാർഗമോ ഉപാധിയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ കരണവിഭക്തിയായ ‘ഈ വാക്കുകളാൽ’ അതിനെ സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
- source_word: τοῖς λόγοις τούτοις
  choice: ഈ വാക്കുകൾ
  rationale: പൗലോസ് തൊട്ടുമുമ്പ് എഴുതിയ നിർദിഷ്ട പ്രസ്താവനകളിലേക്കാണ് ഇത് വിരൽചൂണ്ടുന്നത്; അതിനാൽ ‘ഈ വാക്കുകൾ’ നേരിട്ടും സുതാര്യവുമായ പരിഭാഷയാണ്.
theological_decisions:
- issue: παρακαλεῖτε എന്ന ക്രിയയുടെ ഇടയപരിപാലന ഭാവം
  choice: പ്രോത്സാഹിപ്പിക്കുവിൻ
  alternative: ആശ്വസിപ്പിക്കുവിൻ
  rationale: മരിച്ചവരെക്കുറിച്ചുള്ള ദുഃഖത്തിന്റെ പശ്ചാത്തലം ‘ആശ്വസിപ്പിക്കുക’ എന്ന അർഥത്തെ ശക്തമായി പിന്തുണയ്ക്കുന്നു. എങ്കിലും ക്രിയയുടെ പ്രോത്സാഹനം, ആശ്വാസം, ഉദ്ബോധനം എന്നിവ ഉൾക്കൊള്ളുന്ന വിശാലത നഷ്ടപ്പെടാതിരിക്കാൻ പ്രധാന പാഠത്തിൽ ‘പ്രോത്സാഹിപ്പിക്കുവിൻ’ സ്വീകരിച്ച് മറ്റർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ മാന്യവും പൊതുവായി ഗ്രഹിക്കാവുന്നതുമായ ബൈബിൾ ശൈലി. ‘പ്രോത്സാഹിപ്പിക്കുവിൻ’ എന്ന രൂപം ഗൗരവം നിലനിർത്തുന്നു; ‘അന്യോന്യം’ പരസ്പരത സംക്ഷിപ്തമായി അറിയിക്കുന്നു. അടിക്കുറിപ്പ് പ്രധാന പദത്തിന്റെ യഥാർഥ അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
