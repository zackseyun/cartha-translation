  to: 'കർത്താവിൽനിന്നുള്ള ഒരു വചനത്താൽ[a] ഞങ്ങൾ നിങ്ങളോടു പറയുന്നത് ഇതാണ്: ജീവിച്ചിരിക്കുന്നവരായ, കർത്താവിന്റെ വരവുവരെ[b] ശേഷിക്കുന്ന നാം ഉറങ്ങിപ്പോയവരെ[c] ഒരിക്കലും മുൻപാകുകയില്ല.'
