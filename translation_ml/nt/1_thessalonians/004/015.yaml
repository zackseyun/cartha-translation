id: 1TH.4.15
reference: 1 Thessalonians 4:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῦτο γὰρ ὑμῖν λέγομεν ἐν λόγῳ κυρίου, ὅτι ἡμεῖς οἱ ζῶντες οἱ περιλειπόμενοι εἰς τὴν παρουσίαν τοῦ κυρίου οὐ μὴ φθάσωμεν τοὺς κοιμηθέντας·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/015.yaml
  text: 'For this we say to you by a word from the Lord: that we who are living[a], who remain until the coming of the Lord[c][b], will certainly not precede those who have fallen asleep.'
translation:
  language: ml
  text: 'കർത്താവിൽനിന്നുള്ള ഒരു വചനത്താൽ[a] ഞങ്ങൾ നിങ്ങളോടു പറയുന്നത് ഇതാണ്: ജീവിച്ചിരിക്കുന്നവരായ, കർത്താവിന്റെ വരവുവരെ[b] ശേഷിക്കുന്ന നാം ഉറങ്ങിപ്പോയവരെ[c] ഒരിക്കലും മുൻപാകുകയില്ല.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘കർത്താവിന്റെ വചനത്താൽ.’ ഗ്രീക്ക് പ്രയോഗം കർത്താവായ യേശുവിൽനിന്നുള്ള ഒരു വചനത്തെയോ കർത്താവിന്റെ അധികാരത്തോടെ ലഭിച്ച ഒരു വെളിപ്പാടിനെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
  - marker: b
    text: '‘വരവ്’ എന്നതിന് ‘സാന്നിധ്യം’ അല്ലെങ്കിൽ ‘ആഗമനം’ എന്നും വിവർത്തനം ചെയ്യാം (ഗ്രീക്ക്: παρουσία).'
    reason: lexical_alternative
  - marker: c
    text: ‘ഉറങ്ങിപ്പോയവർ’ എന്നത് മരിച്ചവരെ സൂചിപ്പിക്കുന്ന ഒരു രൂപകമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν λόγῳ κυρίου
  choice: കർത്താവിൽനിന്നുള്ള ഒരു വചനത്താൽ
  rationale: ἐν എന്നതിന്റെ ആധാര/അധികാരസൂചനയും κυρίου എന്നതിന്റെ ഉറവിടബന്ധവും സ്വാഭാവികമായി നൽകുന്നു; ഇത് യേശുവിന്റെ നേരിട്ടുള്ള ഒരു വചനമാണോ കർത്താവിന്റെ അധികാരത്തോടെ ലഭിച്ച വെളിപ്പാടാണോ എന്ന് നിർണയിക്കുന്നില്ല.
- source_word: παρουσίαν
  choice: വരവ്
  rationale: കർത്താവിന്റെ ഭാവിയിലെ ആഗമനത്തെ സൂചിപ്പിക്കുന്ന ഈ സന്ദർഭത്തിൽ സാധാരണ വായനക്കാർക്ക് ഏറ്റവും സ്വാഭാവികമായ പദം; ‘സാന്നിധ്യം’, ‘ആഗമനം’ എന്നിവയും പദത്തിന്റെ അർത്ഥപരിധിയിലുണ്ട്.
- source_word: οἱ ζῶντες οἱ περιλειπόμενοι
  choice: ജീവനോടെ ശേഷിക്കുന്ന നാം
  rationale: ജീവിച്ചിരിക്കുന്നതും നിർദിഷ്ട സമയത്തോളം ശേഷിക്കുന്നതുമായ ഒരേ കൂട്ടത്തെ സൂചിപ്പിക്കുന്ന രണ്ടു പങ്കുപദങ്ങളും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു; ‘അതിജീവിക്കുന്നവർ’ എന്ന വ്യാഖ്യാനാത്മക ഭാവം ഒഴിവാക്കുന്നു.
- source_word: οὐ μὴ φθάσωμεν
  choice: മുമ്പേ ഒരിക്കലും പോകുകയില്ല
  rationale: οὐ μή എന്ന ശക്തമായ നിഷേധം ‘ഒരിക്കലും ... ഇല്ല’ എന്നതിലൂടെ പ്രകടമാക്കുകയും φθάνω എന്നതിന്റെ സന്ദർഭോചിതമായ ‘മുൻപാകുക/മുമ്പേ പോകുക’ എന്ന അർത്ഥം നൽകുകയും ചെയ്യുന്നു.
- source_word: τοὺς κοιμηθέντας
  choice: ഉറങ്ങിപ്പോയവർ
  rationale: മരിച്ചവരെക്കുറിച്ചുള്ള ഗ്രീക്ക് ഉറക്കരൂപകം വ്യാഖ്യാനിച്ച് സമതലപ്പെടുത്താതെ നിലനിർത്തുന്നു.
- source_word: κύριος / κυρίου
  choice: കർത്താവ് / കർത്താവിന്റെ
  rationale: ഈ അന്ത്യകാലസന്ദർഭത്തിൽ യേശുവിനെ സൂചിപ്പിക്കുന്ന κύριος എന്ന പദത്തിന്റെ പതിവും മാന്യവുമായ മലയാളരൂപം.
theological_decisions:
- issue: ‘കർത്താവിൽനിന്നുള്ള ഒരു വചനം’ എന്ന പൗലോസിന്റെ അവലംബത്തിന്റെ സ്വഭാവം
  choice: വചനത്തിന്റെ കർത്തൃഅധികാരം നിലനിർത്തി, അത് കൈമാറപ്പെട്ട വിധം നിർണയിക്കാത്ത ഭാഷ
  alternative: യേശുവിന്റെ അറിയപ്പെട്ട ഒരു വചനത്തിന്റെ നേരിട്ടുള്ള ഉദ്ധരണി; അല്ലെങ്കിൽ പൗലോസിനു ലഭിച്ച പ്രവചനാത്മക വെളിപ്പാട്
  rationale: ἐν λόγῳ κυρίου കർത്താവിന്റെ അധികാരം ഉറപ്പിക്കുന്നുവെങ്കിലും അതിന്റെ കൈമാറ്റരീതി വ്യക്തമാക്കുന്നില്ല; അതിനാൽ മൂലപാഠത്തിലെ അവ്യക്തത സംരക്ഷിച്ചു.
- issue: κοιμηθέντας എന്നതിലെ ഉറക്കരൂപകം
  choice: ‘ഉറങ്ങിപ്പോയവർ’ എന്നു രൂപകം നിലനിർത്തി
  alternative: ‘മരിച്ചവർ’ എന്നു നേരിട്ട് വിവർത്തനം ചെയ്യുക
  rationale: പുനരുത്ഥാനപ്രത്യാശയുടെ പശ്ചാത്തലത്തിൽ പൗലോസ് ഉപയോഗിക്കുന്ന മരണത്തിനുള്ള രൂപകത്തിന്റെ ദൈവശാസ്ത്രപരമായ ഭാവം നിലനിർത്തുന്നു; ഇത് ശാരീരികമരണത്തെ നിഷേധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘ജീവനോടെ ശേഷിക്കുന്ന നാം’ എന്ന പ്രയോഗം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാക്കിക്കൊണ്ട് ഗ്രീക്കിലെ രണ്ടു വിശേഷണങ്ങളുടെയും ആശയം സംരക്ഷിക്കുന്നു. ശക്തമായ നിഷേധം വ്യക്തമാക്കാൻ ‘ഒരിക്കലും’ ഉപയോഗിച്ചു; ഉറക്കരൂപകം പ്രധാനവാചകത്തിൽ നിലനിർത്തി.
