reference: 1 Thessalonians 4:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῦτο γάρ ἐστιν θέλημα τοῦ θεοῦ, ὁ ἁγιασμὸς ὑμῶν, ἀπέχεσθαι ὑμᾶς ἀπὸ τῆς πορνείας,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/003.yaml
  text: 'For this is the will of God: your sanctification—that you abstain from sexual immorality[a][b].'
translation:
  language: ml
  text: 'എന്തെന്നാൽ, ദൈവത്തിന്റെ ഇഷ്ടം ഇതാണ്: നിങ്ങളുടെ വിശുദ്ധീകരണം—നിങ്ങൾ ലൈംഗിക അധാർമികതയിൽനിന്ന് വിട്ടുനിൽക്കണം.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങളുടെ വിശുദ്ധി.’
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ പോർനെയിയ (porneia); അവിഹിതമായ ലൈംഗിക പെരുമാറ്റത്തെ വിശാലമായി സൂചിപ്പിക്കുന്ന പദം. പരമ്പരാഗതമായി, ‘ദുർന്നടപ്പ്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλημα
  choice: ഇഷ്ടം
  rationale: ദൈവത്തിന്റെ അധികാരപൂർവമായ ഹിതത്തെ സൂചിപ്പിക്കാൻ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സ്ഥാപിതവുമായ പദം.
- source_word: ὁ ἁγιασμὸς ὑμῶν
  choice: നിങ്ങളുടെ വിശുദ്ധീകരണം
  rationale: ἁγιασμός സൂചിപ്പിക്കുന്ന വിശുദ്ധമായ നിലയെയും വിശുദ്ധജീവിതത്തിലേക്കുള്ള പ്രക്രിയയെയും ഒരുപോലെ തുറന്നുവെക്കുന്നു; തുടർന്നുള്ള വാക്യഭാഗം അതിന്റെ ധാർമിക ഉള്ളടക്കം വ്യക്തമാക്കുന്നു.
- source_word: ἀπέχεσθαι
  choice: നിങ്ങൾ ... വിട്ടുനിൽക്കണം
  rationale: മുൻപുള്ള ‘വിശുദ്ധീകരണം’ എന്നതിന്റെ ഉള്ളടക്കം വിശദീകരിക്കുന്ന ഗ്രീക്ക് infinitive-ന്റെ പ്രവർത്തനം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: πορνείας
  choice: ലൈംഗിക അധാർമികത
  rationale: πορνείαയുടെ വിശാലമായ അർഥപരിധി നിലനിർത്തുന്നു; ഒരു പ്രത്യേകതരം അവിഹിത ലൈംഗിക പ്രവൃത്തിയിലേക്കു മാത്രം ചുരുക്കുന്നില്ല.
- source_word: γάρ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: γάρ മുൻവാക്യത്തോടുള്ള കാരണബന്ധം സൂചിപ്പിക്കുന്നു. ഒറ്റവാക്യ ഉദ്ധരണിയായ മലയാളത്തിൽ ‘എന്തെന്നാൽ’ ചേർക്കുന്നത് കൃത്രിമമായി തോന്നുന്നതിനാൽ ബന്ധം സന്ദർഭത്തിൽ ആശ്രയിപ്പിച്ചു; പൂർണ്ണ ഖണ്ഡികയിൽ ‘എന്തെന്നാൽ’ ഉപയോഗിക്കാവുന്നതാണ്.
theological_decisions:
- issue: ധാർമിക പ്രബോധനത്തിൽ ἁγιασμός എന്നതിന്റെ അർഥം
  choice: ‘വിശുദ്ധീകരണം’ എന്നു പരിഭാഷപ്പെടുത്തി, അതിന്റെ ധാർമിക ഉള്ളടക്കം തുടർന്നുള്ള വാക്യഭാഗം വ്യക്തമാക്കുന്നതായി നിലനിർത്തി.
  alternative: ‘നിങ്ങളുടെ വിശുദ്ധി’
  rationale: പദത്തെ പൂർണമായും ഒരു നിലയായോ ഒരു പ്രക്രിയയായോ ചുരുക്കാതെ പൗലോസിന്റെ പ്രയോഗത്തിലെ അർഥവ്യാപ്തിയും ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ട ജീവിതത്തിന്റെ ആശയവും സംരക്ഷിക്കുന്നു.
- issue: πορνείαയുടെ വ്യാപ്തി
  choice: ‘ലൈംഗിക അധാർമികത’ എന്ന വിശാല പ്രയോഗം
  alternative: ‘വ്യഭിചാരം’ അഥവാ വിവാഹപൂർവ ലൈംഗികബന്ധത്തെ മാത്രം സൂചിപ്പിക്കുന്ന പദം
  rationale: ഗ്രീക്ക് പദം അവിഹിതമായ ലൈംഗിക പെരുമാറ്റത്തെ വിശാലമായി സൂചിപ്പിക്കുന്നു; മൂലപാഠത്തേക്കാൾ ഇടുങ്ങിയ മതശാസ്ത്രപരമോ സാംസ്കാരികമോ ആയ നിർവചനം ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘വിശുദ്ധീകരണം’ ദൈവശാസ്ത്രപരമായി സ്ഥാപിതമായ പദമായതിനാൽ നിലനിർത്തി; അതിന്റെ കൂടുതൽ സാധാരണഭാഷാ ബദൽ അടിക്കുറിപ്പിൽ നൽകി. പ്രധാനവാചകത്തിലെ എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
