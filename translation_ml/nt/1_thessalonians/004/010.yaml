source:
  edition: SBLGNT
  text: καὶ γὰρ ποιεῖτε αὐτὸ εἰς πάντας τοὺς ἀδελφοὺς τοὺς ἐν ὅλῃ τῇ Μακεδονίᾳ. παρακαλοῦμεν δὲ ὑμᾶς, ἀδελφοί, περισσεύειν μᾶλλον,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/010.yaml
  text: For indeed you are doing this toward all the brothers throughout all Macedonia. But we urge you[a], brothers, to abound still more,
translation:
  language: ml
  text: കാരണം, തീർച്ചയായും, മക്കെദോന്യയിൽ എങ്ങുമുള്ള എല്ലാ സഹോദരങ്ങളോടും നിങ്ങൾ അങ്ങനെ ചെയ്യുന്നുണ്ട്. എന്നാൽ, സഹോദരങ്ങളേ,[a] ഇനിയും അധികമായി വളരണമെന്ന് ഞങ്ങൾ നിങ്ങളോട് അഭ്യർഥിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘സഹോദരങ്ങൾ’ എന്നത് സഹവിശ്വാസികളെയാണ് സൂചിപ്പിക്കുന്നത്; സഭകളിലെ സ്ത്രീകളും പുരുഷന്മാരും ഇതിൽ ഉൾപ്പെടുന്നതായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: തീർച്ചയായും
  rationale: γάρ-ന്റെ വിശദീകരണബന്ധവും καί-യുടെ ഊന്നലും സന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; മുൻവാക്യത്തിലെ സഹോദരസ്നേഹത്തെക്കുറിച്ചുള്ള പ്രശംസയ്ക്ക് ഇത് സ്ഥിരീകരണം നൽകുന്നു.
- source_word: ποιεῖτε αὐτό
  choice: നിങ്ങൾ അങ്ങനെ ചെയ്യുന്നുണ്ട്
  rationale: വർത്തമാനകാല ക്രിയ അവരുടെ തുടർന്നുകൊണ്ടിരിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; αὐτό മുൻവാക്യത്തിലെ സഹോദരസ്നേഹത്തെ പിന്നോട്ടു ചൂണ്ടുന്നതിനാൽ മലയാളത്തിൽ ‘അങ്ങനെ’ സ്വാഭാവികമാണ്.
- source_word: εἰς πάντας τοὺς ἀδελφοὺς
  choice: എല്ലാ സഹോദരങ്ങളോടും
  rationale: εἰς ഇവിടെ സ്നേഹപ്രവൃത്തിയുടെ വ്യക്തികളിലേക്കുള്ള ദിശയും ബന്ധപരമായ ഭാവവും സൂചിപ്പിക്കുന്നു; ‘-ഓടും’ മലയാളത്തിൽ അത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τοὺς ἐν ὅλῃ τῇ Μακεδονίᾳ
  choice: മക്കെദോന്യയിൽ എങ്ങുമുള്ള
  rationale: ἐν ὅλῃ എന്നത് പ്രദേശമൊട്ടാകെയുള്ള വ്യാപ്തി സൂചിപ്പിക്കുന്നു; ‘എങ്ങുമുള്ള’ അതിന്റെ വിതരണാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: παρακαλοῦμεν δὲ ὑμᾶς
  choice: എന്നാൽ ... ഞങ്ങൾ നിങ്ങളോട് അഭ്യർഥിക്കുന്നു
  rationale: δέ പ്രശംസയിൽനിന്ന് തുടർന്നുള്ള പ്രബോധനത്തിലേക്കുള്ള മൃദുവായ തിരിവാണ്; παρακαλέω ഇവിടെ ഗൗരവമുള്ള അഭ്യർഥന/പ്രോത്സാഹന അർഥത്തിലാണ്.
- source_word: περισσεύειν μᾶλλον
  choice: ഇനിയും അധികമായി അതിൽ വളരാൻ
  rationale: περισσεύω നിലവിലുള്ള അളവിനെക്കാൾ വർധിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; μᾶλλον-ന്റെ താരതമ്യബലം ‘ഇനിയും അധികമായി’ സംരക്ഷിക്കുന്നു. ‘അതിൽ’ എന്നത് മുൻസന്ദർഭത്തിലെ സഹോദരസ്നേഹത്തെ വ്യക്തമാക്കുന്നു.
- source_word: ἀδελφοὺς / ἀδελφοί
  choice: സഹോദരങ്ങൾ / സഹോദരങ്ങളേ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചനം നിലനിർത്തുന്നു; സഭാസന്ദർഭത്തിൽ ഇത് സ്ത്രീകളെയും പുരുഷന്മാരെയും ഉൾക്കൊള്ളുന്ന സഹവിശ്വാസികളെ പ്രതിനിധിയായി സൂചിപ്പിക്കാമെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: മിശ്രലിംഗ സഭാസന്ദർഭത്തിൽ ἀδελφοί/ἀδελφούς എന്നതിന്റെ പരിധി
  choice: പ്രധാനപാഠത്തിൽ ‘സഹോദരങ്ങൾ/സഹോദരങ്ങളേ’ നിലനിർത്തി ഉൾക്കൊള്ളുന്ന പരിധി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുക
  alternative: ‘സഹോദരീസഹോദരന്മാർ’ അല്ലെങ്കിൽ ‘സഹവിശ്വാസികൾ’ എന്ന് പരിഭാഷപ്പെടുത്തുക
  rationale: ഇത് ഉറവിടത്തിലെ വ്യാകരണരൂപം സംരക്ഷിക്കുകയും, അതേസമയം പൗലോസ് മുഴുവൻ വിശ്വാസസമൂഹത്തെയും ഉദ്ദേശിച്ചിരിക്കാമെന്ന സന്ദർഭാർഥം നിഷേധിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അഭ്യർഥിക്കുന്നു’ പ്രബോധനത്തിന്റെ ഗൗരവം നൽകുന്നു; ‘വളരാൻ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ περισσεύω സൂചിപ്പിക്കുന്ന വർധനയും നിലനിർത്തുന്നു.
