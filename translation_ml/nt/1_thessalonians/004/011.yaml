  yaml_path: translation/nt/1_thessalonians/004/011.yaml
  text: and to aspire to live quietly[a], to mind your own affairs, and to work with your own hands, just as we commanded you[b],
translation:
  language: ml
  text: ശാന്തമായി ജീവിക്കുക, സ്വന്തം കാര്യങ്ങൾ നോക്കിനടത്തുക, സ്വന്തം കൈകൾകൊണ്ട് ജോലി ചെയ്യുക എന്നിവ നിങ്ങളുടെ ലക്ഷ്യമാക്കുവിൻ[a]—ഞങ്ങൾ നിങ്ങളോടു കല്പിച്ചതുപോലെതന്നെ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ശാന്തമായിരിക്കുക, സ്വന്തം കാര്യങ്ങളിൽ ശ്രദ്ധ ചെലുത്തുക, സ്വന്തം കൈകൾകൊണ്ട് ജോലി ചെയ്യുക എന്നിവ നിങ്ങളുടെ അഭിലാഷമാക്കുവിൻ.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ഞങ്ങൾ നിങ്ങളോടു നിർദേശിച്ചതുപോലെ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλοτιμεῖσθαι
  choice: അഭിലാഷമാക്കാനും … ശ്രമിക്കുവിൻ
  rationale: മാന്യമായ ഒരു ലക്ഷ്യമായി കരുതി അതിനായി ഉത്സാഹത്തോടെ ശ്രമിക്കുക എന്ന ക്രിയയുടെ ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ പകർത്തുന്നു.
- source_word: ἡσυχάζειν
  choice: ശാന്തമായി ജീവിക്കുന്നത്
  rationale: കേവലം മിണ്ടാതിരിക്കലല്ല, ശാന്തവും അടക്കമുള്ളതുമായ ജീവിതരീതിയാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്.
- source_word: πράσσειν τὰ ἴδια
  choice: സ്വന്തം കാര്യങ്ങൾ നോക്കിനടത്താനും
  rationale: സ്വന്തം ഉത്തരവാദിത്വങ്ങളിലും കാര്യങ്ങളിലും ശ്രദ്ധ ചെലുത്തുക എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐργάζεσθαι
  choice: അധ്വാനിക്കാനും
  rationale: ജോലി ചെയ്യുക എന്ന പൊതുവായ അർഥത്തോടൊപ്പം ഇവിടെ കൈവേലയുടെ പരിശ്രമഭാവവും വ്യക്തമാക്കുന്നു.
- source_word: ταῖς χερσὶν ὑμῶν
  choice: സ്വന്തം കൈകൾകൊണ്ട്
  rationale: ദാതൃവിഭക്തിയുടെ ഉപകരണാർഥവും ὑμῶν നൽകുന്ന വ്യക്തിപരമായ ഊന്നലും നിലനിർത്തുന്നു.
- source_word: καθὼς
  choice: പോലെതന്നെ
  rationale: മുമ്പ് നൽകിയ നിർദേശവുമായി കൃത്യമായ പൊരുത്തം സൂചിപ്പിക്കുന്ന താരതമ്യഭാവം നൽകുന്നു.
- source_word: παρηγγείλαμεν
  choice: ഞങ്ങൾ നിങ്ങളോടു കല്പിച്ചതുപോലെതന്നെ
  rationale: മുമ്പ് നൽകിയ അപ്പൊസ്തലിക നിർദേശത്തിന്റെ ആധികാരിക ശക്തി ‘കല്പിച്ചു’ എന്ന പദം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: അപ്പൊസ്തലിക നിർദേശത്തിന്റെ ധാർമിക അധികാരം
  choice: കല്പിച്ചതുപോലെതന്നെ
  alternative: ഉപദേശിച്ചതുപോലെ / നിർദേശിച്ചതുപോലെ
  rationale: παραγγέλλω എന്ന ക്രിയയിലെ ആധികാരിക നിർദേശഭാവം മയപ്പെടുത്താതെ നിലനിർത്തുന്നു; അതേസമയം ഗ്രീക്കിനപ്പുറം അധിക ശക്തി ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗ്രീക്കിലെ തുടർച്ചയായ infinitive ഘടനയെ മലയാളത്തിലെ ‘-ആനും’ ശൃംഖലയായും അവസാനം ‘ശ്രമിക്കുവിൻ’ എന്ന മുഖ്യക്രിയയോടും ചേർത്തു. ‘അഭിലാഷമാക്കുക’–‘ശാന്തമായി ജീവിക്കുക’ എന്ന ഉദ്ദേശ്യപൂർവമായ വൈരുധ്യഭംഗി സംരക്ഷിച്ചിട്ടുണ്ട്.
