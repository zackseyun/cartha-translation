review_pass:
  verdict: revise
  source_fidelity: The draft conveys the three coordinated infinitival actions and the concluding reference to prior apostolic instruction. However, the Malayalam construction makes ‘ശ്രമിക്കുവിൻ’ appear to govern only the final item most directly, whereas φιλοτιμεῖσθαι governs the full series. ‘അധ്വാനിക്കുക’ can be appropriate, but ‘ജോലി ചെയ്യുക’ is broader and closer to ἐργάζεσθαι in this context.
  naturalness: ‘ശാന്തമായി ജീവിക്കുന്നത് നിങ്ങളുടെ അഭിലാഷമാക്കാനും … ശ്രമിക്കുവിൻ’ is somewhat heavy and syntactically uneven in modern Malayalam. A single, clear imperative with an ‘ഇവ’ summary naturally carries the coordinated Greek series.
  terminology: ‘കല്പിച്ചു’ adequately retains the authoritative force of παρηγγείλαμεν. ‘ലക്ഷ്യമാക്കുക’ is a more idiomatic modern rendering of φιλοτιμεῖσθαι while preserving its intentional, aspirational force. ‘സ്വന്തം കാര്യങ്ങൾ നോക്കിനടത്തുക’ appropriately renders πράσσειν τὰ ἴδια.
  issues:
  - severity: medium
    issue: Scope of the governing exhortation is unclear in the Malayalam infinitive chain.
    rationale: The final ‘ശ്രമിക്കുവിൻ’ is separated from the first two actions and can be read as governing chiefly ‘അധ്വാനിക്കാനും.’ The Greek φιλοτιμεῖσθαι governs all three following infinitives.
  - severity: low
    issue: ‘അധ്വാനിക്കാനും’ is narrower/more strenuous in connotation than the broad verb ἐργάζεσθαι.
    rationale: The source calls for working, specifically with one’s hands, but does not itself require an intensified sense of toil. ‘ജോലി ചെയ്യുക’ is a natural broader equivalent.
  revised_text: ശാന്തമായി ജീവിക്കുക, സ്വന്തം കാര്യങ്ങൾ നോക്കിനടത്തുക, സ്വന്തം കൈകൾകൊണ്ട് ജോലി ചെയ്യുക എന്നിവ നിങ്ങളുടെ ലക്ഷ്യമാക്കുവിൻ[a]—ഞങ്ങൾ നിങ്ങളോടു കല്പിച്ചതുപോലെതന്നെ.[b]
