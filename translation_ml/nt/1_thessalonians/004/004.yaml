id: 1TH.4.4
reference: 1 Thessalonians 4:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰδέναι ἕκαστον ὑμῶν τὸ ἑαυτοῦ σκεῦος κτᾶσθαι ἐν ἁγιασμῷ καὶ τιμῇ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/004.yaml
  text: that each of you know how to acquire his own vessel in holiness and honor,
translation:
  language: ml
  text: നിങ്ങളിൽ ഓരോരുത്തനും വിശുദ്ധിയോടും മാന്യതയോടുംകൂടെ സ്വന്തം പാത്രം[a] എങ്ങനെ നേടണമെന്ന് അറിയണം,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പാത്രം’ എന്നത് ഗ്രീക്കിലെ രൂപകപ്രയോഗമാണ്. ഇവിടെ അത് ഒരാളുടെ സ്വന്തം ശരീരത്തെയോ ഭാര്യയെയോ സൂചിപ്പിക്കാം; ‘നേടുക’ എന്ന ക്രിയയെ ‘സ്വായത്തമാക്കുക’ അല്ലെങ്കിൽ ‘കൈവശംവെക്കുക/നിയന്ത്രിക്കുക’ എന്നും മനസ്സിലാക്കാം.
    reason: σκεῦος, κτᾶσθαι എന്നീ പദങ്ങളുടെ ചേർച്ചയ്ക്ക് ശരീരം, ഭാര്യ, നേടുക, നിയന്ത്രിക്കുക എന്നീ വ്യാഖ്യാനസാധ്യതകൾ ഉള്ളതിനാൽ മൂലപാഠത്തിലെ യഥാർഥ അനിശ്ചിതത്വം വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: εἰδέναι
  choice: അറിയണം
  rationale: സന്ദർഭത്തിൽ മുൻവാക്യത്തെ ആശ്രയിക്കുന്ന അനന്തരൂപമാണെങ്കിലും, മലയാളത്തിൽ സ്വാഭാവികവും നിർദേശാത്മകവുമായ അർഥം വ്യക്തമാക്കാൻ ‘അറിയണം’ എന്നു നൽകി.
- source_word: ἕκαστον ὑμῶν
  choice: നിങ്ങളിൽ ഓരോരുത്തനും
  rationale: ഓരോ വ്യക്തിയെയും അഭിസംബോധന ചെയ്യുന്ന ഗ്രീക്ക് പ്രയോഗം ലിംഗം അനാവശ്യമായി ചേർക്കാതെ നിലനിർത്തുന്നു.
- source_word: τὸ ἑαυτοῦ σκεῦος
  choice: സ്വന്തം പാത്രം
  rationale: σκεῦος എന്നതിന്റെ അടിസ്ഥാനരൂപകത്തെ നിലനിർത്തുകയും ‘ശരീരം’ അല്ലെങ്കിൽ ‘ഭാര്യ’ എന്ന വിവാദ വ്യാഖ്യാനങ്ങളിൽ ഒന്നിനെ മുഖ്യപാഠത്തിൽ നിർബന്ധമായി തിരഞ്ഞെടുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: κτᾶσθαι
  choice: നേടണമെന്ന്
  rationale: ക്രിയയുടെ സാധാരണ അർഥമായ ‘നേടുക/സ്വായത്തമാക്കുക’ സംരക്ഷിക്കുന്നു; ‘നിയന്ത്രിക്കുക’ എന്ന് വ്യാഖ്യാനിച്ച് അർഥം മുൻകൂട്ടി തീർപ്പാക്കുന്നില്ല.
- source_word: ἐν ἁγιασμῷ καὶ τιμῇ
  choice: വിശുദ്ധിയോടും മാന്യതയോടുംകൂടെ
  rationale: ἁγιασμός എന്ന വിശുദ്ധീകരണം/വിശുദ്ധി ആശയവും τιμή എന്ന ബഹുമാനം/മാന്യത ആശയവും സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ‘സ്വന്തം പാത്രം നേടുക’ എന്ന പ്രയോഗത്തിന്റെ സൂചന
  choice: രൂപകഭാഷ മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ച് വ്യാഖ്യാനവൈവിധ്യം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി
  alternative: ‘സ്വന്തം ശരീരത്തെ നിയന്ത്രിക്കുക’ അല്ലെങ്കിൽ ‘സ്വന്തം ഭാര്യയെ സ്വീകരിക്കുക’
  rationale: ഗ്രീക്ക് വാചകം ശരീരനിയന്ത്രണമാണോ വിവാഹബന്ധമാണോ സൂചിപ്പിക്കുന്നത് എന്നതിൽ യഥാർഥ വ്യാഖ്യാനഭിന്നതയുണ്ട്; ഒരു നിലപാട് മാത്രം പാഠത്തിൽ സ്ഥാപിക്കുന്നത് മൂലത്തിലെ അനിശ്ചിതത്വം ഇല്ലാതാക്കും.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. വാക്യം ഗ്രീക്ക് ഘടനയുടെ തുടർച്ച സൂചിപ്പിക്കാൻ കോമയിൽ അവസാനിപ്പിച്ചിരിക്കുന്നു; അതേസമയം ഒറ്റവാക്യമായി വായിക്കുമ്പോഴും വ്യക്തമാണ്.
