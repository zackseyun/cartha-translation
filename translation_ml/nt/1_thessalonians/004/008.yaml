id: 1TH.4.8
reference: 1 Thessalonians 4:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοιγαροῦν ὁ ἀθετῶν οὐκ ἄνθρωπον ἀθετεῖ ἀλλὰ τὸν θεὸν τὸν ⸀καὶ ⸀διδόντα τὸ πνεῦμα αὐτοῦ τὸ ἅγιον εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/008.yaml
  text: Therefore[a], whoever rejects this rejects not man but God[b], who also gives his Holy Spirit to you.
translation:
  language: ml
  text: അതുകൊണ്ട്, ഇത് നിരസിക്കുന്നവൻ മനുഷ്യനെയല്ല, മറിച്ച് തന്റെ പരിശുദ്ധാത്മാവിനെ നിങ്ങൾക്കു കൂടി നൽകുന്ന ദൈവത്തെയാണ് നിരസിക്കുന്നത്[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇത് അവഗണിക്കുന്നവൻ മനുഷ്യനെയല്ല, ദൈവത്തെയാണ് അവഗണിക്കുന്നത്.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ക്രിയയ്ക്ക് ‘നിരസിക്കുക,’ ‘അവഗണിക്കുക,’ ‘തള്ളിക്കളയുക’ എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘തന്റെ പരിശുദ്ധാത്മാവിനെ നിങ്ങളിലേക്കു നൽകുന്ന.’ ഗ്രീക്ക് പൂർവപ്രത്യയത്തിന്റെ അക്ഷരാർഥം ‘നിങ്ങളിലേക്ക്/നിങ്ങളുടെ ഉള്ളിലേക്ക്’ എന്നാണ്; എന്നാൽ ഈ സന്ദർഭത്തിൽ ‘നിങ്ങൾക്കു നൽകുന്ന’ എന്നത് സ്വാഭാവികമായ മലയാളപ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιγαροῦν
  choice: അതുകൊണ്ട്
  rationale: മുൻപത്തെ പ്രബോധനത്തിൽനിന്നുള്ള നിഗമനത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് സംയോജകത്തിന്റെ യുക്തിബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὁ ἀθετῶν / ἀθετεῖ
  choice: നിരസിക്കുന്നവൻ ... നിരസിക്കുന്നത്
  rationale: ആധികാരികമായ ഉപദേശത്തെ തള്ളുകയോ അവഗണിക്കുകയോ ചെയ്യുക എന്ന അർഥപരിധിയുള്ള ἀθετέωയുടെ ആവർത്തനം നിലനിർത്തുന്നു; പൊതുവായി ആരെയും സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് കൃേദന്തരൂപവും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: οὐκ ἄνθρωπον ... ἀλλὰ τὸν θεόν
  choice: മനുഷ്യനെയല്ല, ദൈവത്തെയാണ്
  rationale: മനുഷ്യനും ദൈവവും തമ്മിലുള്ള ഗ്രീക്കിലെ സംക്ഷിപ്തവും ഊന്നലുള്ളതുമായ വിരുദ്ധത നിലനിർത്തുന്നു.
- source_word: τὸν καὶ διδόντα
  choice: നൽകുന്ന ... ദൈവത്തെത്തന്നെ
  rationale: ദൈവത്തെ കൂടുതൽ വിശേഷിപ്പിക്കുന്ന വർത്തമാന കൃേദന്തരൂപം മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണവാക്യമായി നൽകുന്നു. വാക്യഘടനയിലെ ഊന്നൽ ‘ദൈവത്തെത്തന്നെ’ എന്നതിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: τὸ πνεῦμα αὐτοῦ τὸ ἅγιον
  choice: തന്റെ പരിശുദ്ധാത്മാവിനെ
  rationale: ദൈവത്തിന്റെ പരിശുദ്ധാത്മാവിനെയാണ് ഈ പദസമുച്ചയം സൂചിപ്പിക്കുന്നത്; ‘തന്റെ’ എന്നത് ഇവിടെ ദൈവത്തിലേക്കുള്ള പ്രതിനിർദേശം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: εἰς ὑμᾶς
  choice: നിങ്ങൾക്കു
  rationale: εἰς എന്നതിന് അക്ഷരാർഥത്തിൽ ‘ഉള്ളിലേക്ക്’ എന്ന ദിശാസൂചനയുണ്ടെങ്കിലും, δίδωμι എന്ന ക്രിയയോടൊപ്പം മലയാളത്തിലെ സ്വാഭാവിക സ്വീകർത്തൃപ്രയോഗം ‘നിങ്ങൾക്കു നൽകുന്ന’ എന്നാണ്; അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ‘തന്റെ പരിശുദ്ധാത്മാവ്’ എന്നതിന്റെ സൂചിതാർഥം
  choice: ദൈവം വിശ്വാസികൾക്കു നൽകുന്ന പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്നതായി പരിഭാഷപ്പെടുത്തി.
  alternative: ഒരു വ്യക്തിത്വരഹിതമായ വിശുദ്ധ ആത്മീയ ദാനമോ മനോഭാവമോ എന്ന വായന.
  rationale: τὸ πνεῦμα αὐτοῦ τὸ ἅγιον എന്ന നിർദിഷ്ടമായ പദഘടനയും പൗലോസിന്റെ സന്ദർഭവും ദൈവത്തിന്റെ പരിശുദ്ധാത്മാവിനെയാണ് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്; അതിലധികമായ സിദ്ധാന്തവിവരണം പാഠത്തിലേക്കു ചേർത്തിട്ടില്ല.
- issue: ὁ ἀθετῶν എന്നതിന്റെ പൊതുവ്യാപകത
  choice: ലിംഗഭേദമില്ലാതെ പൊതുവായി ബാധകമായ ‘നിരസിക്കുന്നവൻ’ എന്നു നൽകി.
  alternative: പുരുഷനെ മാത്രം സൂചിപ്പിക്കുന്നതായി വായിക്കുക.
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ഏകവചനം ഇവിടെ പ്രതിനിധാനപരവും പൊതുവ്യാപകവുമാണ്; പുരുഷന്മാരിലേക്കു മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- issue: ദൈവത്തെ നിരസിക്കുന്നു എന്ന പ്രസ്താവനയുടെ ശക്തി
  choice: ഉപദേശം നിരസിക്കുന്നത് ദൈവത്തെത്തന്നെ നിരസിക്കുന്നതാണെന്ന നേരിട്ടുള്ള വിരുദ്ധത നിലനിർത്തി.
  alternative: ദൈവത്തിന്റെ സന്ദേശത്തെയോ അധികാരത്തെയോ മാത്രം അവഗണിക്കുന്നു എന്ന മൃദൂകരിച്ച വ്യാഖ്യാനം.
  rationale: οὐκ ἄνθρωπον ... ἀλλὰ τὸν θεόν എന്ന പാഠം നേരിട്ട് മനുഷ്യനെയും ദൈവത്തെയും വിരുദ്ധമായി നിർത്തുന്നു; ആ ദൈവശാസ്ത്രപരമായ ശക്തി മൃദൂകരിക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി ഉപയോഗിച്ചു. ഗ്രീക്കിലെ ആവർത്തനവും മനുഷ്യൻ–ദൈവം വിരുദ്ധതയും നിലനിർത്തിയപ്പോൾ, εἰς ὑμᾶς എന്ന പ്രയോഗത്തിന്റെ അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
