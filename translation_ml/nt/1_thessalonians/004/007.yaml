id: 1TH.4.7
reference: 1 Thessalonians 4:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐ γὰρ ἐκάλεσεν ἡμᾶς ὁ θεὸς ἐπὶ ἀκαθαρσίᾳ ἀλλ’ ἐν ἁγιασμῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/007.yaml
  text: For God did not call us for uncleanness[b][a], but in holiness.
translation:
  language: ml
  text: കാരണം, ദൈവം നമ്മെ വിളിച്ചത് അശുദ്ധിയിൽ കഴിയാനല്ല[a], വിശുദ്ധിയിൽ ജീവിക്കാനാണ്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അശുദ്ധിക്കായിട്ടല്ല.’ ഗ്രീക്ക് പദം ധാർമിക അശുദ്ധിയെയും, ഈ സന്ദർഭത്തിൽ പ്രത്യേകിച്ച് ലൈംഗിക അശുദ്ധിയെയും, സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘വിശുദ്ധീകരണത്തിൽ.’ ഗ്രീക്ക് പദം വിശുദ്ധമായ അവസ്ഥയെയോ വിശുദ്ധരാക്കപ്പെടുന്ന പ്രക്രിയയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ പ്രബോധനത്തിന് ഈ വാക്യം അടിസ്ഥാനം നൽകുന്നതിനാൽ കാരണബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἐκάλεσεν
  choice: വിളിച്ചത്
  rationale: ഗ്രീക്കിലെ ലളിത ഭൂതകാലത്തിന്റെ സ്വഭാവവും ദൈവത്തിന്റെ വിളി എന്ന ബൈബിൾപരമായ പദബന്ധവും നിലനിർത്തുന്നു; വിളിയുടെ ദൈവശാസ്ത്രപരമായ പ്രവർത്തനരീതി വിവർത്തനത്തിൽ അധികമായി നിർവചിക്കുന്നില്ല.
- source_word: ἐπὶ ἀκαθαρσίᾳ
  choice: അശുദ്ധിയിൽ കഴിയാനല്ല
  rationale: ἐπί + ദത്തിവ് ഇവിടെ ലക്ഷ്യമോ ജീവിതമേഖലയോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമാകാൻ ‘കഴിയാൻ’ ചേർത്തുകൊണ്ട്, അശുദ്ധി സ്വഭാവമാക്കിയ ജീവിതത്തിലേക്കുള്ള വിളിയല്ലെന്ന ആശയം നൽകുന്നു.
- source_word: ἀκαθαρσίᾳ
  choice: അശുദ്ധി
  rationale: പദത്തിന്റെ വിശാലമായ ധാർമിക അർഥം നിലനിർത്തുകയും സമീപസന്ദർഭത്തിലെ ലൈംഗിക അശുദ്ധിയെയും ഉൾക്കൊള്ളാൻ ഇടവരുത്തുകയും ചെയ്യുന്നു.
- source_word: ἐν ἁγιασμῷ
  choice: വിശുദ്ധിയിൽ ജീവിക്കാനാണ്
  rationale: ἐν സൂചിപ്പിക്കുന്ന ജീവിതമേഖലയെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു. ἁγιασμός എന്ന പദത്തിൽ ഉള്ള വിശുദ്ധാവസ്ഥയും വിശുദ്ധീകരണപ്രക്രിയയും തമ്മിലുള്ള അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἁγιασμῷ
  choice: വിശുദ്ധി
  rationale: അശുദ്ധിയോടുള്ള നേരിട്ടുള്ള വിരുദ്ധത വ്യക്തമാക്കുന്ന സാധാരണവും ഗൗരവമുള്ളതുമായ പദം; ‘വിശുദ്ധീകരണം’ എന്ന പ്രക്രിയാർഥം മാത്രം മുഖ്യവാചകത്തിൽ നിർബന്ധിക്കുന്നില്ല.
theological_decisions:
- issue: ദൈവത്തിന്റെ ‘വിളി’യുടെ അർഥം
  choice: വിശ്വാസികളുടെ ധാർമികജീവിതത്തിന് അടിസ്ഥാനമാകുന്ന ദൈവത്തിന്റെ യഥാർഥ വിളി എന്ന നിലയിൽ പദം സംരക്ഷിച്ചു.
  alternative: പൊതുവായ ക്ഷണം എന്നോ സാങ്കേതിക അർഥത്തിലുള്ള ഫലപ്രദമായ വിളി എന്നോ വ്യക്തമായി നിർവചിക്കുക.
  rationale: വാക്യം ദൈവത്തിന്റെ വിളിയെ വിശുദ്ധജീവിതത്തിന്റെ അടിസ്ഥാനമായി അവതരിപ്പിക്കുന്നു; എന്നാൽ ആ വിളി എങ്ങനെ പ്രവർത്തിക്കുന്നു എന്ന് നിർവചിക്കുന്നില്ല. അതിനാൽ പിൽക്കാല മതവിഭാഗപരമായ കൃത്യത വിവർത്തനത്തിലേക്ക് കൊണ്ടുവരുന്നില്ല.
- issue: 'ἁγιασμός: അവസ്ഥയോ പ്രക്രിയയോ'
  choice: മുഖ്യവാചകത്തിൽ ‘വിശുദ്ധി’ എന്ന ജീവിതമേഖല/അവസ്ഥ; പ്രക്രിയാർഥം അടിക്കുറിപ്പിൽ.
  alternative: മുഖ്യവാചകത്തിൽ ‘വിശുദ്ധീകരണം’ എന്നു നൽകുക.
  rationale: അശുദ്ധിയുമായുള്ള വിരുദ്ധസമാന്തര്യം ഇവിടെ വിശുദ്ധമായ ജീവിതാവസ്ഥയെ മുൻനിർത്തുന്നു; എങ്കിലും ഗ്രീക്ക് പദത്തിന് വിശുദ്ധീകരണപ്രക്രിയയും സൂചിപ്പിക്കാനാകുന്നതിനാൽ ആ അർഥം ഒഴിവാക്കിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളം. ‘അശുദ്ധി—വിശുദ്ധി’ എന്ന വിരുദ്ധതയും വാക്യത്തിന്റെ ഗൗരവവും നിലനിർത്തുന്നു. ഗ്രീക്ക് വിഭക്തിബന്ധങ്ങൾ യാന്ത്രികമായി പകർത്താതെ ‘കഴിയാൻ/ജീവിക്കാൻ’ എന്ന സ്വാഭാവിക ക്രിയകൾ ചേർത്ത് ജീവിതമേഖലയുടെ ആശയം വ്യക്തമാക്കുന്നു.
