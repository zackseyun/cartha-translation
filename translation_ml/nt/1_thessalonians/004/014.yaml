reference: 1 Thessalonians 4:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ γὰρ πιστεύομεν ὅτι Ἰησοῦς ἀπέθανεν καὶ ἀνέστη, οὕτως καὶ ὁ θεὸς τοὺς κοιμηθέντας διὰ τοῦ Ἰησοῦ ἄξει σὺν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/014.yaml
  text: For if we believe that Jesus died and rose again[b][a], so also God will bring with him those who have fallen asleep through Jesus.
translation:
  language: ml
  text: കാരണം, യേശു മരിക്കുകയും ഉയിർത്തെഴുന്നേൽക്കുകയും ചെയ്തു എന്ന് നാം വിശ്വസിക്കുന്നുവെങ്കിൽ, അതുപോലെതന്നെ യേശുവിലൂടെ നിദ്രപ്രാപിച്ചവരെ[a][b] ദൈവം അവനോടൊപ്പം കൊണ്ടുവരും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മരിച്ചവരെ.’ ഈ സന്ദർഭത്തിൽ വിശ്വാസികളുടെ മരണത്തെ സൂചിപ്പിക്കാനാണ് പൗലോസ് ‘നിദ്രപ്രാപിക്കുക’ എന്ന രൂപകം ഉപയോഗിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘യേശുവിൽ നിദ്രപ്രാപിച്ചവരെ.’ ‘യേശുവിലൂടെ’ (διὰ τοῦ Ἰησοῦ) എന്ന പദസമുച്ചയം യേശുവിലൂടെ എന്ന മാർഗം/കാര്യകർത്തൃഭാവം സൂചിപ്പിക്കുന്നതായോ യേശുവുമായുള്ള അടുത്ത ബന്ധം സൂചിപ്പിക്കുന്നതായോ മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ γὰρ
  choice: എന്നു നാം വിശ്വസിക്കുന്നുവെങ്കിൽ
  rationale: മുൻവാക്യത്തിലെ ആശയത്തിന് അടിസ്ഥാനം നൽകുന്ന γάρ-ന്റെ നിഗമനബന്ധവും εἰ-യുടെ വ്യവസ്ഥാഭാവവും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: πιστεύομεν
  choice: നാം വിശ്വസിക്കുന്നു
  rationale: യേശുവിന്റെ മരണത്തെയും ഉയിർത്തെഴുന്നേൽപ്പിനെയും കുറിച്ചുള്ള സമൂഹവിശ്വാസം സൂചിപ്പിക്കുന്ന സാധാരണവും യോജിച്ചതുമായ പ്രയോഗം.
- source_word: ἀπέθανεν καὶ ἀνέστη
  choice: മരിക്കുകയും ഉയിർത്തെഴുന്നേൽക്കുകയും ചെയ്തു
  rationale: രണ്ട് aorist ക്രിയകളെയും പൂർത്തിയായ ചരിത്രസംഭവങ്ങളായി അവതരിപ്പിക്കുന്നു; ἀνέστη സകർമക നിഷ്ക്രിയരൂപമല്ലാത്തതിനാൽ ‘ഉയിർപ്പിക്കപ്പെട്ടു’ എന്നതിനുപകരം ‘ഉയിർത്തെഴുന്നേറ്റു’ എന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: οὕτως καὶ
  choice: അതുപോലെതന്നെ
  rationale: യേശുവിന്റെ മരണ-ഉയിർത്തെഴുന്നേൽപ്പിനെയും മരിച്ച വിശ്വാസികളോടുള്ള ദൈവത്തിന്റെ ഭാവിപ്രവർത്തനത്തെയും ബന്ധിപ്പിക്കുന്ന സമാന്തരത നിലനിർത്തുന്നു.
- source_word: τοὺς κοιμηθέντας
  choice: നിദ്രപ്രാപിച്ചവരെ
  rationale: മരണത്തെ സൂചിപ്പിക്കാൻ പൗലോസ് ഉപയോഗിക്കുന്ന നിദ്രയുടെ രൂപകം നിലനിർത്തുന്നു; നേരിട്ട് ‘മരിച്ചവർ’ എന്നു മാറ്റി അതിന്റെ ഇടയപരവും പ്രത്യാശാഭരിതവുമായ ഭാവം ഇല്ലാതാക്കുന്നില്ല.
- source_word: διὰ τοῦ Ἰησοῦ
  choice: യേശുവിലൂടെ
  rationale: ജനിറ്റീവോടുകൂടിയ διά-യുടെ മാർഗം/കാര്യകർത്തൃത്വം സൂചിപ്പിക്കുന്ന അടിസ്ഥാന അർഥം നൽകുന്നു; കൃത്യമായ ബന്ധം വിവാദമുള്ളതിനാൽ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: ἄξει σὺν αὐτῷ
  choice: അവനോടൊപ്പം കൊണ്ടുവരും
  rationale: ἄξει-യുടെ ഭാവികാലവും σύν-ന്റെ കൂടെയുണ്ടാകൽ എന്ന ആശയവും നേരിട്ട് നിലനിർത്തുന്നു; ‘അവൻ’ എന്ന സർവനാമം ഗ്രീക്കുപോലെ സംരക്ഷിക്കുമ്പോൾ സന്ദർഭത്തിൽ അത് യേശുവിനെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: κοιμηθέντας എന്ന മരണരൂപകം
  choice: പ്രധാനവാചകത്തിൽ ‘നിദ്രപ്രാപിച്ചവർ’ എന്ന രൂപകം നിലനിർത്തി.
  alternative: മരിച്ചവർ
  rationale: ഇവിടെ മരണം യാഥാർഥ്യമാണെങ്കിലും വരാനിരിക്കുന്ന ഉയിർത്തെഴുന്നേൽപ്പിന്റെ പ്രത്യാശയുമായി അതിനെ ബന്ധിപ്പിക്കുന്ന പൗലോസിന്റെ രൂപകം തർജമയിൽ സംരക്ഷിക്കേണ്ടതാണ്.
- issue: διὰ τοῦ Ἰησοῦ എന്ന പദസമുച്ചയത്തിന്റെ അർഥവും ബന്ധവും
  choice: പ്രധാനവാചകത്തിൽ ‘യേശുവിലൂടെ’ എന്നു നൽകി.
  alternative: യേശുവിൽ നിദ്രപ്രാപിച്ചവർ; യേശു മുഖാന്തരം
  rationale: ഈ പദസമുച്ചയം യേശുവിന്റെ മാധ്യസ്ഥ്യം/കാര്യകർത്തൃത്വം സൂചിപ്പിക്കാമെങ്കിലും യേശുവുമായുള്ള അടുത്ത ബന്ധമായി മനസ്സിലാക്കുന്ന വായനയും നിലവിലുണ്ട്. പ്രധാനവാചകം ഈ വ്യാഖ്യാനഭേദം അന്തിമമായി തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘നിദ്രപ്രാപിച്ചവർ’ അല്പം ഉയർന്ന രജിസ്റ്ററിലുള്ളതാണെങ്കിലും മരണത്തിനുള്ള ബൈബിളിലെ രൂപകം വ്യക്തമായി നിലനിർത്തുകയും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതായിരിക്കുകയും ചെയ്യുന്നു.
