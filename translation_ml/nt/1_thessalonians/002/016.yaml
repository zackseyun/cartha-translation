revisions:
- from: ജാതികൾ രക്ഷിക്കപ്പെടേണ്ടതിന് അവരോടു സംസാരിക്കുന്നതിൽനിന്ന് ഞങ്ങളെ തടഞ്ഞുകൊണ്ട്, അവർ എല്ലാക്കാലത്തും തങ്ങളുടെ പാപങ്ങളുടെ അളവ് തികയ്ക്കുന്നു. എന്നാൽ ക്രോധം[b] ഒടുവിൽ[a] അവരുടെമേൽ വന്നെത്തിയിരിക്കുന്നു.
  to: വിജാതീയർ രക്ഷിക്കപ്പെടേണ്ടതിന് അവരോടു സംസാരിക്കുന്നതിൽനിന്ന് ഞങ്ങളെ തടഞ്ഞുകൊണ്ട്, അങ്ങനെ അവർ എപ്പോഴും തങ്ങളുടെ പാപങ്ങളുടെ അളവ് നിറച്ചുതികയ്ക്കുന്നു. എന്നാൽ ക്രോധം[b] ഒടുവിൽ[a] അവരുടെമേൽ വന്നെത്തിയിരിക്കുന്നു.
  rationale: മൂലത്തിലെ ആശയവും വ്യാഖ്യാനപരമായ തുറന്ന നിലയും സംരക്ഷിച്ചുകൊണ്ട്, τοῖς ἔθνεσιν-ന്റെ സന്ദർഭാർഥം വ്യക്തമാക്കാൻ ‘ജാതികൾ’ ‘വിജാതീയർ’ എന്നു മാറ്റി. πάντοτε-യ്ക്ക് ‘എപ്പോഴും’ ഉപയോഗിക്കുകയും, infinitival ഘടനയുടെ സന്ദർഭോചിതമായ ഫലബന്ധം സൂചിപ്പിക്കാൻ ‘അങ്ങനെ’ ചേർക്കുകയും ചെയ്തു. εἰς τέλος-ഉം ‘ക്രോധം’-ഉം സംബന്ധിച്ച വിവാദസാധ്യതകൾ അടിക്കുറിപ്പുകളിൽ മാറ്റമില്ലാതെ നിലനിർത്തിയിരിക്കുന്നു.
