id: 1TH.2.16
reference: 1 Thessalonians 2:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: κωλυόντων ἡμᾶς τοῖς ἔθνεσιν λαλῆσαι ἵνα σωθῶσιν, εἰς τὸ ἀναπληρῶσαι αὐτῶν τὰς ἁμαρτίας πάντοτε. ἔφθασεν δὲ ἐπ’ αὐτοὺς ἡ ⸀ὀργὴ εἰς τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/016.yaml
  text: by hindering us from speaking to the Gentiles so that they may be saved[a], so as always to fill up the measure of their sins[b]. But wrath has come upon them at last.
translation:
  language: ml
  text: വിജാതീയർ രക്ഷിക്കപ്പെടേണ്ടതിന് അവരോടു സംസാരിക്കുന്നതിൽനിന്ന് ഞങ്ങളെ തടഞ്ഞുകൊണ്ട്, അങ്ങനെ അവർ എപ്പോഴും തങ്ങളുടെ പാപങ്ങളുടെ അളവ് നിറച്ചുതികയ്ക്കുന്നു. എന്നാൽ ക്രോധം[b] ഒടുവിൽ[a] അവരുടെമേൽ വന്നെത്തിയിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘ഒടുവിൽ’ എന്നതിന് ‘പൂർണമായി’, ‘സമ്പൂർണമായി’, അല്ലെങ്കിൽ ‘അവസാനംവരെ’ എന്നും പരിഭാഷപ്പെടുത്താം (ഗ്രീക്ക്: εἰς τέλος).'
    reason: lexical_alternative
  - marker: b
    text: ‘ക്രോധം’ ദൈവിക ന്യായവിധിയെ സൂചിപ്പിക്കുന്നതാകാം. എന്നാൽ ഇപ്പോഴത്തെ ഒരു ചരിത്രന്യായവിധിയെയോ അന്തിമ ന്യായവിധിയെയോ രണ്ടിനെയുംകൂടിയോ പൗലോസ് ഉദ്ദേശിക്കുന്നുവെന്ന് ഇവിടെ വ്യക്തമാക്കുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: κωλυόντων
  choice: തടഞ്ഞുകൊണ്ട്
  rationale: വർത്തമാനകാല പങ്കാളിത്തരൂപത്തിന്റെ തുടർച്ചയായ തടസ്സപ്പെടുത്തൽ എന്ന ഭാവം നിലനിർത്തുന്നു; നിയമപരമായ വിലക്ക് എന്ന അധിക അർഥം ചേർക്കുന്നില്ല.
- source_word: τοῖς ἔθνεσιν
  choice: ജാതികൾ
  rationale: ഇവിടെ യഹൂദരല്ലാത്ത ജനങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാള ബൈബിൾ ഭാഷയിൽ ‘ജാതികൾ’ ഈ ജനവിഭാഗപരമായ അർഥം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: λαλῆσαι
  choice: സംസാരിക്കുന്നതിൽനിന്ന്
  rationale: κωλυόντων-നെ ആശ്രയിക്കുന്ന അനന്തരൂപത്തിന്റെ നേരിട്ടുള്ള അർഥം നൽകുന്നു; സുവിശേഷപ്രഘോഷണം എന്ന സന്ദർഭാർഥം അനാവശ്യമായി ക്രിയയിൽ ചേർക്കുന്നില്ല.
- source_word: ἵνα σωθῶσιν
  choice: രക്ഷിക്കപ്പെടേണ്ടതിന്
  rationale: ഉദ്ദേശ്യവാക്യവും കർമണിപ്രയോഗവും സംരക്ഷിച്ച്, രക്ഷയുടെ കർത്താവിനെ വാചകം വ്യക്തമാക്കാത്ത നിലയിൽ വിടുന്നു.
- source_word: εἰς τὸ ἀναπληρῶσαι
  choice: അവർ ... അളവ് തികയ്ക്കുന്നു
  rationale: സന്ദർഭത്തിൽ ഫലഭാവം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; പാപങ്ങൾ പൂർത്തിയാക്കുക അവരുടെ ബോധപൂർവമായ ലക്ഷ്യമായിരുന്നു എന്ന് നിർബന്ധിക്കുന്നില്ല.
- source_word: ἀναπληρῶσαι
  choice: പാപങ്ങളുടെ അളവ് തികയ്ക്കുന്നു
  rationale: പൂർണതയിലെത്തിക്കുക എന്ന ക്രിയാഭാവം മലയാളത്തിൽ വ്യക്തമായി നൽകാൻ ‘അളവ്’ എന്ന ബൈബിൾസംബന്ധിയായ രൂപകം ഉപയോഗിക്കുന്നു.
- source_word: πάντοτε
  choice: എല്ലാക്കാലത്തും
  rationale: തുടർച്ചയായ പതിവിനെയോ ആവർത്തിത സ്വഭാവത്തെയോ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ക്രിയാവിശേഷണം നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: ἔφθασεν
  choice: വന്നെത്തിയിരിക്കുന്നു
  rationale: സംഭവിച്ച പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ പ്രസക്തി പ്രകടമാക്കുന്നു; ‘പിടികൂടി’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ അർഥം ഒഴിവാക്കുന്നു.
- source_word: ὀργή
  choice: ക്രോധം
  rationale: പദത്തിന്റെ ഗൗരവവും സാധ്യതയുള്ള ദൈവിക ന്യായവിധിയുടെ ഭാവവും നിലനിർത്തുന്നു; എന്നാൽ ‘ദൈവക്രോധം’ എന്ന് മൂലത്തിൽ ഇല്ലാത്ത വിശേഷണം മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: εἰς τέλος
  choice: ഒടുവിൽ
  rationale: സമാപ്തിയിലേക്കുള്ള എത്തിച്ചേരൽ എന്ന സാധ്യതയുള്ള പ്രയോഗാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘പൂർണമായി’, ‘അവസാനംവരെ’ എന്നീ യഥാർഥ സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: ‘ക്രോധം’ ആരുടേതും ഏതു ന്യായവിധിയുമാണ്
  choice: ദൈവിക ക്രോധം/ന്യായവിധി സൂചിപ്പിക്കുന്ന ഗൗരവമുള്ളതെങ്കിലും വിശദമായി നിർവചിക്കാത്ത പദമായി നിലനിർത്തി
  alternative: ഇതിനകം സംഭവിച്ച പ്രത്യേക ചരിത്രന്യായവിധി; അന്തിമ ന്യായവിധി; ഇപ്പോഴത്തെയും ഭാവിയിലെയും ന്യായവിധി ഒരുമിച്ച്
  rationale: ക്രോധം അവരുടെമേൽ വന്നതായി പൗലോസ് പറയുന്നു; എന്നാൽ ഏതു സംഭവമാണെന്ന് ഈ വാക്യം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ ചരിത്രപരമോ അന്ത്യകാലപരമോ എന്ന് വിവർത്തനം തീരുമാനിക്കുന്നില്ല.
- issue: εἰς τὸ ἀναπληρῶσαι എന്ന ഘടനയുടെ ബലം
  choice: ബോധപൂർവമായ ഉദ്ദേശ്യം നിർബന്ധിക്കാതെ ഫലത്തിലേക്കുള്ള നീക്കം പ്രകടമാക്കി
  alternative: ‘പാപങ്ങൾ നിറച്ചുതികയ്ക്കേണ്ടതിന്’ എന്ന വ്യക്തമായ ഉദ്ദേശ്യവായന
  rationale: ഗ്രീക്ക് ഘടനയ്ക്ക് ഉദ്ദേശ്യമോ ഫലമോ സൂചിപ്പിക്കാനാകാം; സന്ദർഭത്തിൽ അവരുടെ ഉദ്ദേശ്യം പാപങ്ങളുടെ അളവ് പൂർത്തിയാക്കുക തന്നെയായിരുന്നു എന്ന് പറയാതിരിക്കുന്നതാണ് സൂക്ഷ്മം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. മുൻവാക്യത്തിൽനിന്ന് തുടരുന്ന ഗ്രീക്ക് പങ്കാളിത്തഘടന ‘തടഞ്ഞുകൊണ്ട്’ എന്ന രൂപത്തിൽ നിലനിർത്തി; ദീർഘവാക്യം വായനാസൗകര്യത്തോടെ അവതരിപ്പിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദങ്ങൾക്ക് പിന്നാലെ മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
