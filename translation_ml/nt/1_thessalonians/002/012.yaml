id: 1TH.2.12
reference: 1 Thessalonians 2:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: παρακαλοῦντες ὑμᾶς καὶ παραμυθούμενοι καὶ μαρτυρόμενοι, εἰς τὸ ⸀περιπατεῖν ὑμᾶς ἀξίως τοῦ θεοῦ τοῦ καλοῦντος ὑμᾶς εἰς τὴν ἑαυτοῦ βασιλείαν καὶ δόξαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/012.yaml
  text: encouraging[a], comforting, and urging you to walk worthily of God[c][b], who calls you into his own kingdom and glory.
translation:
  language: ml
  text: നിങ്ങളെ പ്രോത്സാഹിപ്പിച്ചും ആശ്വസിപ്പിച്ചും ഗൗരവത്തോടെ ഉദ്ബോധിപ്പിച്ചും, തന്റെ സ്വന്തം രാജ്യത്തിലേക്കും മഹത്ത്വത്തിലേക്കും നിങ്ങളെ വിളിക്കുന്ന ദൈവത്തിന് യോഗ്യമായവിധം നിങ്ങൾ നടക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρακαλοῦντες
  choice: പ്രോത്സാഹിപ്പിച്ചും
  rationale: തുടർന്നുകൊണ്ടിരുന്ന പിതൃസഹജമായ ശുശ്രൂഷയെ സൂചിപ്പിക്കുന്ന വർത്തമാനകാല കൃദന്തരൂപമാണിത്. ‘പ്രോത്സാഹിപ്പിക്കുക’ സന്ദർഭത്തിലെ സ്നേഹപൂർവമായ പ്രബോധനഭാവം സ്വാഭാവികമായി നൽകുന്നു; ‘ഉദ്ബോധിപ്പിക്കുക’ എന്ന കൂടുതൽ ശക്തമായ പദം മൂന്നാമത്തെ ക്രിയയ്ക്കായി നിലനിർത്തുന്നു.
- source_word: παραμυθούμενοι
  choice: ആശ്വസിപ്പിച്ചും
  rationale: സാന്ത്വനവും ധൈര്യപ്പെടുത്തുന്ന സംസാരവും ഉൾക്കൊള്ളുന്ന ക്രിയ. ആദ്യ ക്രിയയോടു ബന്ധമുള്ളതായിരിക്കുമ്പോഴും അതിൽനിന്നു വേറിട്ട പരിപാലനഭാവം ‘ആശ്വസിപ്പിക്കുക’ വ്യക്തമാക്കുന്നു.
- source_word: μαρτυρόμενοι
  choice: ഗൗരവപൂർവം ഉദ്ബോധിപ്പിച്ചുംകൊണ്ട്
  rationale: ഇവിടെ വെറും സാക്ഷ്യം പറയുക എന്നതിലുപരി ഗൗരവമുള്ള അഭ്യർഥനയോ നിർബന്ധപൂർവമായ പ്രബോധനമോ ആണ് ഉദ്ദേശ്യം. ‘ഗൗരവപൂർവം ഉദ്ബോധിപ്പിക്കുക’ ആ ശക്തി വ്യക്തമാക്കുകയും അതിരുകടന്ന കഠിനത ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: εἰς τὸ περιπατεῖν
  choice: നിങ്ങൾ നടക്കേണ്ടതിന്
  rationale: εἰς + articular infinitive ഉദ്ദേശ്യമോ ലക്ഷ്യമോ സൂചിപ്പിക്കുന്നു. ‘നടക്കുക’ എന്ന ബൈബിൾ രൂപകം നിലനിർത്തുകയും അതിന്റെ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ἀξίως τοῦ θεοῦ
  choice: ദൈവത്തിന് യോഗ്യമായവിധം
  rationale: ἀξίως-നോടു ചേർന്ന ജനിറ്റീവ് ‘ദൈവത്തിന് യോഗ്യമായവിധം’ എന്ന് നേരിട്ട് നൽകാം. ഇത് മനുഷ്യർ ദൈവത്തിന്റെ മൂല്യത്തിന് തുല്യരാകുന്നു എന്ന ആശയം ചേർക്കാതെ, ദൈവവിളിക്കു ചേരുന്ന ജീവിതരീതിയെ സൂചിപ്പിക്കുന്നു.
- source_word: τοῦ καλοῦντος ὑμᾶς
  choice: നിങ്ങളെ വിളിക്കുന്ന
  rationale: വർത്തമാനകാല കൃദന്തത്തെ വർത്തമാനകാല ആപേക്ഷികപ്രയോഗമായി നൽകുന്നു; വിളിയുടെ സമയം സംബന്ധിച്ച പ്രത്യേക ദൈവശാസ്ത്രനിഗമനം അടിച്ചേൽപ്പിക്കുന്നില്ല.
- source_word: εἰς τὴν ἑαυτοῦ βασιλείαν καὶ δόξαν
  choice: തന്റെ സ്വന്തം രാജ്യത്തിലേക്കും മഹത്ത്വത്തിലേക്കും
  rationale: ἑαυτοῦ എന്ന ഊന്നലുള്ള സ്വയംസൂചക സർവനാമം ‘തന്റെ സ്വന്തം’ എന്നു നിലനിർത്തുന്നു. ഒരേ εἰς രണ്ടു നാമങ്ങളെയും നിയന്ത്രിക്കുന്നതിനാൽ രാജ്യവും മഹത്ത്വവും സമാന്തര ലക്ഷ്യങ്ങളായി വിവർത്തനം ചെയ്യുന്നു.
theological_decisions:
- issue: περιπατεῖν എന്ന ജീവിതരൂപകം നിലനിർത്തണമോ പൊതുവായി ‘ജീവിക്കുക’ എന്നു വ്യാഖ്യാനിക്കണമോ
  choice: പ്രധാനപാഠത്തിൽ ‘നടക്കുക’ നിലനിർത്തി അടിക്കുറിപ്പിൽ അർഥം വിശദീകരിച്ചു.
  alternative: ‘ജീവിക്കുക’ അല്ലെങ്കിൽ ‘ജീവിതം നയിക്കുക’
  rationale: ഈ രൂപകം ബൈബിളിലെ നൈതികജീവിതഭാഷയുമായി ബന്ധം നിലനിർത്തുന്നു. എന്നാൽ ആധുനിക വായനക്കാരന് തെറ്റിദ്ധാരണ ഉണ്ടാകാതിരിക്കാൻ അതിന്റെ രൂപകാർഥം അടിക്കുറിപ്പിൽ പറയുന്നു.
- issue: τοῦ καλοῦντος എന്നതിലെ ദൈവവിളിയുടെ കാലവും സ്വഭാവവും
  choice: ‘വിളിക്കുന്ന’ എന്ന വർത്തമാനരൂപം
  alternative: ‘വിളിച്ച’ അല്ലെങ്കിൽ ‘വിളിച്ചുകൊണ്ടിരിക്കുന്ന’
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാല കൃദന്തത്തെ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു; വിളിയുടെ കൃത്യമായ കാലക്രമമോ പ്രവർത്തനരീതിയോ സംബന്ധിച്ച സിദ്ധാന്തപരമായ നിർവചനം ചേർക്കുന്നില്ല.
- issue: βασιλείαν καὶ δόξαν തമ്മിലുള്ള ബന്ധം
  choice: ‘രാജ്യത്തിലേക്കും മഹത്ത്വത്തിലേക്കും’ എന്ന സമാന്തര ഘടന
  alternative: രാജ്യത്തെ മഹത്ത്വമുള്ള രാജ്യമെന്നോ മഹത്ത്വത്തെ രാജ്യത്തിന്റെ വിവരണമായോ ലയിപ്പിക്കുക
  rationale: καί രണ്ടു നാമങ്ങളെയും ഏകോപിപ്പിക്കുന്നു. അവയുടെ കൃത്യബന്ധം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ മൂലപാഠത്തിലെ തുല്യനിലയും സാധ്യതയുള്ള ദൈവശാസ്ത്ര പിരിമുറുക്കവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി സ്വീകരിച്ചു. മൂലപാഠത്തിലെ മൂന്ന് സമാന്തര കൃദന്തരൂപങ്ങളും ഈ വാക്യം മുൻവാക്യവുമായി വ്യാകരണപരമായി ബന്ധപ്പെടുന്ന സ്വഭാവവും കഴിയുന്നത്ര നിലനിർത്തി. ‘രാജ്യം’, ‘മഹത്ത്വം’, ‘വിളിക്കുക’, ‘നടക്കുക’ എന്നീ പ്രധാന ബൈബിൾ പദങ്ങൾ വ്യാഖ്യാനപരമായി ലയിപ്പിക്കാതെ സംരക്ഷിച്ചു.
