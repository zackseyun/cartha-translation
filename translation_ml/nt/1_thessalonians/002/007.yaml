    rationale: Footnote c concerns Χριστοῦ / “മിശിഹായുടെ അപ്പൊസ്തലന്മാർ,” not τροφός or the simile. Its current placement is a misleading anchor.
  - severity: low
    issue: “നിങ്ങളോടു ഭാരമുള്ളവരാകാമായിരുന്നു” is less natural and can suggest being physically heavy rather than imposing a burden or weight.
    rationale: Using “നിങ്ങൾക്കു ഭാരമാകാമായിരുന്നു” is idiomatic Malayalam and reflects the English audit trail’s broad “been a burden,” while the footnote preserves the literal metaphor and interpretive alternatives.
