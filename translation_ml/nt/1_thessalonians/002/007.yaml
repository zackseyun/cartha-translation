  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: δυνάμενοι ἐν βάρει εἶναι ὡς Χριστοῦ ἀπόστολοι· ἀλλὰ ἐγενήθημεν ⸀ἤπιοι ἐν μέσῳ ὑμῶν, ὡς ⸀ἐὰν τροφὸς θάλπῃ τὰ ἑαυτῆς τέκνα·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/007.yaml
  text: though we could have been a burden as apostles of the Messiah[a], yet we became gentle among you[c][b], as a nursing mother cherishes her own children.
translation:
  language: ml
  text: മിശിഹായുടെ[c] അപ്പൊസ്തലന്മാർ എന്ന നിലയിൽ ഞങ്ങൾ നിങ്ങൾക്കു ഭാരമാകാമായിരുന്നെങ്കിലും[a], നിങ്ങളുടെ ഇടയിൽ ഞങ്ങൾ സൗമ്യരായിത്തീർന്നു; മുലയൂട്ടുന്ന ഒരമ്മ[b] സ്വന്തം മക്കളെ ആർദ്രമായി പരിപാലിക്കുന്നതുപോലെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മിശിഹായുടെ അപ്പൊസ്തലന്മാർ എന്ന നിലയിൽ ഞങ്ങൾക്ക് അധികാരം പ്രയോഗിക്കാമായിരുന്നു,” “ആവശ്യങ്ങൾ ഉന്നയിക്കാമായിരുന്നു,” അല്ലെങ്കിൽ “നിങ്ങൾക്കു ഭാരമാകാമായിരുന്നു.” ഗ്രീക്കിൽ അക്ഷരാർഥം “ഭാരമുള്ളവരായിരിക്കുക” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ഒരു പോറ്റമ്മ” അല്ലെങ്കിൽ “ഒരു മുലയൂട്ടമ്മ”; ആർദ്രമായ മാതൃപരിചരണമാണ് ഈ ഉപമയുടെ കേന്ദ്രം.
    reason: lexical_alternative
  - marker: c
    text: 'പരമ്പരാഗത പരിഭാഷ: “ക്രിസ്തുവിന്റെ അപ്പൊസ്തലന്മാർ.”'
    reason: alternative_reading
lexical_decisions:
- source_word: δυνάμενοι
  choice: ഞങ്ങൾക്ക് ... ആകാമായിരുന്നെങ്കിലും
  rationale: ἀλλάയോടുള്ള സന്ദർഭബന്ധത്തിൽ പങ്കാളിക്രിയയ്ക്ക് അനുവദനീയമായ concessive ഭാവം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐν βάρει εἶναι
  choice: ഭാരമുള്ളവരാകുക
  rationale: ‘ഭാരത്തിൽ ആയിരിക്കുക’ എന്ന ഗ്രീക്ക് രൂപകത്തെ നിലനിർത്തുകയും സാമ്പത്തികഭാരം, അധികാരപ്രയോഗം, ആവശ്യങ്ങൾ ഉന്നയിക്കൽ എന്നിവയിൽ ഒന്നായി അർഥം ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ὡς Χριστοῦ ἀπόστολοι
  choice: മിശിഹായുടെ അപ്പൊസ്തലന്മാർ എന്ന നിലയിൽ
  rationale: Χριστός ഇവിടെ സ്ഥാനപ്പേരായി വരുന്നതിനാൽ ‘മിശിഹാ’ എന്നു നൽകി; ὡς എന്നതിന്റെ നില/പദവി സൂചന ‘എന്ന നിലയിൽ’ വ്യക്തമാക്കുന്നു.
- source_word: ἀλλὰ ἐγενήθημεν
  choice: എന്നാൽ ... ഞങ്ങൾ ... ആയിത്തീർന്നു
  rationale: വെറും അവസ്ഥയല്ല, γίνομαιയുടെ ‘ആയിത്തീരുക’ എന്ന ചലനാത്മക അർഥം സംരക്ഷിക്കുന്നു.
- source_word: ἤπιοι
  choice: സൗമ്യർ
  rationale: മൃദുത്വവും ദയാപൂർവമായ പെരുമാറ്റവും സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും മാന്യവുമായ പദം.
- source_word: ἐν μέσῳ ὑμῶν
  choice: നിങ്ങളുടെ ഇടയിൽ
  rationale: പ്രയോഗത്തിന്റെ അർഥം നേരായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὡς ἐὰν τροφὸς
  choice: മുലയൂട്ടുന്ന ഒരമ്മ ... പോലെ
  rationale: τροφός സൂചിപ്പിക്കുന്ന സ്ത്രീസംബന്ധമായ മുലയൂട്ടലിന്റെയും മാതൃപരിചരണത്തിന്റെയും ദൃശ്യം വ്യക്തമായി എത്തിക്കുന്നു; അത് സ്വന്തം മക്കളെ പരിപാലിക്കുന്നവളാണെന്ന് തുടർന്നുള്ള വാക്കുകൾ ഉറപ്പിക്കുന്നു.
- source_word: θάλπῃ
  choice: ആർദ്രമായി പരിപാലിക്കുക
  rationale: ‘ചൂടേകുക’ എന്ന അടിസ്ഥാനദൃശ്യവും അതിൽനിന്നുള്ള വാത്സല്യപൂർവമായ പരിചരണവും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: τὰ ἑαυτῆς τέκνα
  choice: സ്വന്തം മക്കൾ
  rationale: ἑαυτῆς നൽകുന്ന ഊന്നൽ ‘സ്വന്തം’ എന്നതിലൂടെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: Χριστοῦ എന്ന സ്ഥാനപ്പേരിന്റെ വിവർത്തനം
  choice: മിശിഹായുടെ
  alternative: ക്രിസ്തുവിന്റെ
  rationale: ഇവിടെ Χριστός വ്യക്തിനാമസദൃശമായതിനേക്കാൾ സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നതിനാൽ ‘മിശിഹാ’ തിരഞ്ഞെടുത്തു; പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: അപ്പൊസ്തലിക ‘ഭാരം’ എന്തിനെ സൂചിപ്പിക്കുന്നു
  choice: ഭാരമുള്ളവരാകുക എന്ന വിശാല രൂപകം നിലനിർത്തി
  alternative: അധികാരം പ്രയോഗിക്കുക / ആവശ്യങ്ങൾ ഉന്നയിക്കുക / ഭാരമാകുക
  rationale: ἐν βάρει εἶναι സാമ്പത്തികഭാരം മാത്രമെന്നോ ഔദ്യോഗിക അധികാരം മാത്രമെന്നോ തീർച്ചപ്പെടുത്തുന്നില്ല; അതിനാൽ ഉള്ളിലെ ദൈവശാസ്ത്രപരവും പ്രായോഗികവുമായ പിരിമുറുക്കം തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ഭാരമുള്ളവരാകുക’ എന്ന അല്പം അസാധാരണമായ രൂപം മൂലഭാഷയിലെ ഉദ്ദേശ്യപൂർവമായ രൂപകവും അർഥവ്യാപ്തിയും സംരക്ഷിക്കാനാണ്; അടിക്കുറിപ്പ് സാധ്യതകൾ വ്യക്തമാക്കുന്നു. മുഖ്യവാക്യത്തിലെ അടിക്കുറിപ്പുകൾ അവ ബന്ധപ്പെട്ട പദക്രമത്തിൽ തന്നെയാണ് ചേർത്തിരിക്കുന്നത്.
