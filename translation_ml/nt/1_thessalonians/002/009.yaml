id: 1TH.2.9
reference: 1 Thessalonians 2:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Μνημονεύετε γάρ, ἀδελφοί, τὸν κόπον ἡμῶν καὶ τὸν μόχθον· ⸀νυκτὸς καὶ ἡμέρας ἐργαζόμενοι πρὸς τὸ μὴ ἐπιβαρῆσαί τινα ὑμῶν ἐκηρύξαμεν εἰς ὑμᾶς τὸ εὐαγγέλιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/009.yaml
  text: 'For you remember[a], brothers, our labor and hardship: working night and day so as not to burden any of you, we proclaimed to you the gospel of God.'
translation:
  language: ml
  text: സഹോദരന്മാരേ[a], ഞങ്ങളുടെ അധ്വാനവും കഠിനപ്രയത്നവും നിങ്ങൾ ഓർക്കുന്നുവല്ലോ. നിങ്ങളിൽ ആർക്കും ഭാരമാകാതിരിക്കാൻ രാവും പകലും ജോലി ചെയ്തുകൊണ്ട് ഞങ്ങൾ ദൈവത്തിന്റെ സുവിശേഷം നിങ്ങളോടു പ്രസംഗിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സഹോദരീസഹോദരന്മാരേ’; ഗ്രീക്കിൽ ‘സഹോദരന്മാർ’ എന്നാണ്, എന്നാൽ ഈ അഭിസംബോധന മുഴുവൻ സഭയെയും ഉൾക്കൊള്ളാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μνημονεύετε
  choice: നിങ്ങൾ ഓർക്കുന്നുവല്ലോ
  rationale: വർത്തമാനകാല നിർദേശകക്രിയയായതിനാൽ കല്പനയായി അല്ല, തെസ്സലൊനീക്യരുടെ ഓർമ്മയെ അഭിമുഖീകരിക്കുന്ന പ്രസ്താവനയായി വിവർത്തനം ചെയ്തു.
- source_word: ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചന അഭിസംബോധനയുടെ രൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തി; സഭ മുഴുവനെയും ഉൾക്കൊള്ളാവുന്ന പ്രയോഗമാണെന്ന വിവരം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: τὸν κόπον ἡμῶν καὶ τὸν μόχθον
  choice: ഞങ്ങളുടെ അധ്വാനവും കഠിനപ്രയത്നവും
  rationale: κόπος സൂചിപ്പിക്കുന്ന ശ്രമവും μόχθος സൂചിപ്പിക്കുന്ന ക്ലേശകരമായ കഠിനാധ്വാനവും തമ്മിലുള്ള അടുത്തെങ്കിലും വ്യത്യസ്തമായ ഭാവങ്ങൾ കാത്തുസൂക്ഷിച്ചു.
- source_word: νυκτὸς καὶ ἡμέρας
  choice: രാവും പകലും
  rationale: തുടർച്ചയായ പരിശ്രമം സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള പ്രയോഗം.
- source_word: ἐργαζόμενοι
  choice: ജോലി ചെയ്തുകൊണ്ട്
  rationale: സുവിശേഷപ്രഘോഷണത്തോടൊപ്പം നടത്തിയ ഉപജീവനാധ്വാനം സൂചിപ്പിക്കാൻ, മുൻപുള്ള ‘അധ്വാനം’ ആവർത്തിക്കാതെ സ്വാഭാവികമായി നൽകി.
- source_word: πρὸς τὸ μὴ ἐπιβαρῆσαί τινα ὑμῶν
  choice: നിങ്ങളിൽ ആർക്കും ഭാരമാകാതിരിക്കാൻ
  rationale: ഉദ്ദേശ്യം വ്യക്തമാക്കുന്ന ഗ്രീക്ക് ഘടനയും സാമ്പത്തികമോ പ്രായോഗികമോ ആയ ഭാരം ചുമത്താതിരിക്കുന്ന ആശയവും നിലനിർത്തുന്നു.
- source_word: ἐκηρύξαμεν εἰς ὑμᾶς
  choice: ഞങ്ങൾ നിങ്ങളോടു പ്രസംഗിച്ചു
  rationale: κηρύσσωയുടെ പരസ്യമായി അറിയിക്കുന്ന ഭാവം സഭാപരിചിതവും സ്വാഭാവികവുമായ ‘പ്രസംഗിച്ചു’ എന്ന പദത്തിൽ നൽകി; εἰς ὑμᾶς ദിശാസൂചകമായി ‘നിങ്ങളോടു’ എന്നു വിവർത്തനം ചെയ്തു.
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ സുവിശേഷം
  rationale: പരിചിതമായ പൗലോസീയ പ്രയോഗം നിലനിർത്തുകയും ജനിറ്റീവ് ദൈവമാണ് ഉറവിടമോ ഉടമയോ ഉള്ളടക്കമോ എന്നത് അനാവശ്യമായി തീർപ്പാക്കാതിരിക്കുകയും ചെയ്തു.
theological_decisions:
- issue: ἀδελφοί എന്നതിന്റെ ഉൾക്കൊള്ളുന്ന വ്യാപ്തി
  choice: മുഖ്യപാഠത്തിൽ ‘സഹോദരന്മാരേ’
  alternative: ‘സഹോദരീസഹോദരന്മാരേ’
  rationale: ഗ്രീക്ക് പദത്തിന്റെ പുല്ലിംഗ ബഹുവചനരൂപം മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ചു; സന്ദർഭത്തിൽ അത് സ്ത്രീകളുൾപ്പെടെ മുഴുവൻ സഭയെയും അഭിസംബോധന ചെയ്യാവുന്നതാണെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലത്തിലെ ദീർഘവാക്യം മലയാളത്തിൽ വ്യക്തതയ്ക്കായി രണ്ട് വാക്യങ്ങളാക്കി; ആശയബന്ധം മാറ്റിയിട്ടില്ല.
