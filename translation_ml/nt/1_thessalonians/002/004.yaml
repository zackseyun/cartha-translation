id: 1TH.2.4
reference: 1 Thessalonians 2:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλὰ καθὼς δεδοκιμάσμεθα ὑπὸ τοῦ θεοῦ πιστευθῆναι τὸ εὐαγγέλιον οὕτως λαλοῦμεν, οὐχ ὡς ἀνθρώποις ἀρέσκοντες ἀλλὰ ⸀θεῷ τῷ δοκιμάζοντι τὰς καρδίας ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/004.yaml
  text: But just as we have been approved by God to be entrusted with the gospel[a], so we speak—not as pleasing people, but God, who tests our hearts.
translation:
  language: ml
  text: എന്നാൽ, ഞങ്ങൾക്കു സുവിശേഷം ഏൽപ്പിക്കാൻ ദൈവം ഞങ്ങളെ അംഗീകരിച്ചതുപോലെതന്നെ ഞങ്ങൾ സംസാരിക്കുന്നു—മനുഷ്യരെ പ്രസാദിപ്പിക്കാനല്ല, ഞങ്ങളുടെ ഹൃദയങ്ങളെ പരിശോധിക്കുന്ന ദൈവത്തെ പ്രസാദിപ്പിക്കാനാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: മൂലഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ, “മനുഷ്യരെ പ്രസാദിപ്പിക്കുന്നവരായിട്ടല്ല, ദൈവത്തെ” എന്നാണ്. രണ്ടാം ഭാഗത്ത് “പ്രസാദിപ്പിക്കുന്നവരായി” എന്ന ആശയം അധ്യാഹരിക്കപ്പെട്ടിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεδοκιμάσμεθα
  choice: പരിശോധിച്ച് അംഗീകരിച്ചതുപോലെ
  rationale: പൂർണകാല കർമണിപ്രയോഗം മുൻപ് നടന്ന പരിശോധനയുടെയും ഇപ്പോഴും നിലനിൽക്കുന്ന അംഗീകാരത്തിന്റെയും ഫലം സൂചിപ്പിക്കുന്നു. ‘അംഗീകരിച്ചു’ എന്നതു ഫലവും ‘പരിശോധിച്ച്’ എന്നതു δοκιμάζω എന്ന പദത്തിന്റെ മൂല്യനിർണയഭാവവും നിലനിർത്തുന്നു.
- source_word: πιστευθῆναι τὸ εὐαγγέλιον
  choice: സുവിശേഷം ഞങ്ങളെ ഭരമേൽപ്പിക്കാൻ
  rationale: ഇവിടെ πιστεύω എന്നത് സുവിശേഷത്തിൽ വിശ്വസിക്കുക എന്നല്ല, അത് ഒരാളുടെ ഉത്തരവാദിത്വത്തിൽ ഏൽപ്പിക്കുക എന്ന അർഥത്തിലാണ്. ‘ഭരമേൽപ്പിക്കുക’ സ്വാഭാവികവും കൃത്യവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: τὸ εὐαγγέλιον
  choice: സുവിശേഷം
  rationale: പൗലോസിന്റെ സന്ദർഭത്തിൽ സ്ഥാപിതമായതും ദൈവശാസ്ത്രപരമായ സാന്ദ്രത നിലനിർത്തുന്നതുമായ മലയാളപദം.
- source_word: οὕτως λαλοῦμεν
  choice: അതുപോലെതന്നെ ഞങ്ങൾ സംസാരിക്കുന്നു
  rationale: ദൈവത്തിന്റെ പരിശോധനയും ഭരമേൽപ്പിക്കലും സംസാരത്തിന്റെ രീതിയുമായി ബന്ധിപ്പിക്കുന്ന οὕτως എന്ന പദത്തിന്റെ യുക്തിബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: οὐχ ὡς ἀνθρώποις ἀρέσκοντες
  choice: മനുഷ്യരെ പ്രസാദിപ്പിക്കുന്നവരായിട്ടല്ല
  rationale: ὡς സഹിതമുള്ള വർത്തമാനകാല കർത്തൃവാചക കൃദന്തത്തിന്റെ ഘടനയും മനുഷ്യരുടെ അംഗീകാരം തേടാത്തതെന്ന ആശയവും നിലനിർത്തുന്നു.
- source_word: ἀλλὰ θεῷ
  choice: ദൈവത്തെ പ്രസാദിപ്പിക്കുന്നവരായി
  rationale: ഗ്രീക്കിൽ രണ്ടാം ഭാഗത്ത് ἀρέσκοντες അധ്യാഹരിക്കപ്പെട്ടിരിക്കുന്നു. മലയാളത്തിൽ ‘ദൈവത്തെയല്ല’ എന്ന തെറ്റായ വായന ഒഴിവാക്കാൻ അധ്യാഹൃത ആശയം വ്യക്തമാക്കിയെങ്കിലും അതിന്റെ സംക്ഷിപ്തതയെക്കുറിച്ച് അടിക്കുറിപ്പ് നൽകുന്നു.
- source_word: τῷ δοκιμάζοντι
  choice: പരിശോധിക്കുന്ന
  rationale: വർത്തമാനകാല കൃദന്തം ദൈവത്തിന്റെ തുടരുന്ന പരിശോധനയെ സൂചിപ്പിക്കുന്നു; കൂടാതെ വാക്യത്തിന്റെ ആദ്യഭാഗത്തെ δεδοκιμάσμεθα യുമായുള്ള പദബന്ധവും നിലനിർത്തുന്നു.
- source_word: τὰς καρδίας ἡμῶν
  choice: ഞങ്ങളുടെ ഹൃദയങ്ങളെ
  rationale: മനുഷ്യന്റെ ആന്തരിക ചിന്ത, ഉദ്ദേശ്യം, മനോഭാവം എന്നിവ ഉൾക്കൊള്ളുന്ന വേദപുസ്തകപരമായ രൂപകം ചുരുക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: മനുഷ്യരെ പ്രസാദിപ്പിക്കുന്നതും ദൈവത്തെ പ്രസാദിപ്പിക്കുന്നതും തമ്മിലുള്ള സംക്ഷിപ്തമായ ഗ്രീക്ക് വൈരുധ്യം
  choice: പ്രധാനപാഠത്തിൽ മലയാളത്തിൽ ആവശ്യമായ അധ്യാഹാരം ചേർത്ത് ‘മനുഷ്യരെ പ്രസാദിപ്പിക്കുന്നവരായിട്ടല്ല, ... ദൈവത്തെ പ്രസാദിപ്പിക്കുന്നവരായി’ എന്ന് നൽകുന്നു.
  alternative: ഗ്രീക്കിന്റെ പദക്രമം കൂടുതൽ അക്ഷരാർഥത്തിൽ പിന്തുടർന്ന് ‘മനുഷ്യരെ പ്രസാദിപ്പിക്കുന്നവരായിട്ടല്ല, ദൈവത്തെ’ എന്നു നൽകുക.
  rationale: ഗ്രീക്കിൽ ‘പ്രസാദിപ്പിക്കുന്നവർ’ എന്ന കൃദന്തം ആദ്യഭാഗത്ത് മാത്രമേ വ്യക്തമാക്കിയിട്ടുള്ളൂ; രണ്ടാം ഭാഗത്ത് അത് അധ്യാഹരിക്കപ്പെടുന്നു. എന്നാൽ അക്ഷരാർഥത്തിലുള്ള മലയാളം അസ്വാഭാവികവും അർഥഭ്രമത്തിന് ഇടയാക്കുന്നതുമാണ്. അതിനാൽ അധ്യാഹാരം പ്രധാനപാഠത്തിൽ വ്യക്തമാക്കുകയും മൂലത്തിലെ സംക്ഷിപ്തത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഭരമേൽപ്പിക്കുക,’ ‘പ്രസാദിപ്പിക്കുക,’ ‘ഹൃദയങ്ങൾ’ എന്നീ പരിചിതമായ വേദപുസ്തകപദങ്ങൾ നിലനിർത്തിയിരിക്കുന്നു; ഗ്രീക്കിലെ ദീർഘവാക്യവും വൈരുധ്യഘടനയും വായനാസൗകര്യത്തോടെ സംരക്ഷിച്ചിട്ടുണ്ട്.
