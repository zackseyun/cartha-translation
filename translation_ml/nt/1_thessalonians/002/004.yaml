  to: എന്നാൽ, ഞങ്ങൾക്കു സുവിശേഷം ഏൽപ്പിക്കാൻ ദൈവം ഞങ്ങളെ അംഗീകരിച്ചതുപോലെതന്നെ ഞങ്ങൾ സംസാരിക്കുന്നു—മനുഷ്യരെ പ്രസാദിപ്പിക്കാനല്ല, ഞങ്ങളുടെ ഹൃദയങ്ങളെ പരിശോധിക്കുന്ന ദൈവത്തെ പ്രസാദിപ്പിക്കാനാണ്.[a]
  rationale: സുവിശേഷം ആരെ ഏൽപ്പിച്ചതാണ് എന്ന നിർണായകമായ വ്യാകരണബന്ധം തിരുത്തി. ഗ്രീക്കിലെ സംക്ഷിപ്തമായ വൈരുധ്യം മലയാളത്തിൽ സ്വാഭാവികമായി വികസിപ്പിച്ചിട്ടുണ്ട്; മൂലത്തിലെ അധ്യാഹാരം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തിയിരിക്കുന്നു. ദൈവത്തിന്റെ തുടരുന്ന ഹൃദയപരിശോധനയും ആദ്യഭാഗത്തെ ദൈവിക അംഗീകാരവും വേർതിരിച്ചുതന്നെ നിലനിൽക്കുന്നു.
