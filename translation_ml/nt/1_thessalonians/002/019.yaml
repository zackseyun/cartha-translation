id: 1TH.2.19
reference: 1 Thessalonians 2:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τίς γὰρ ἡμῶν ἐλπὶς ἢ χαρὰ ἢ στέφανος καυχήσεως— ἢ οὐχὶ καὶ ὑμεῖς— ἔμπροσθεν τοῦ κυρίου ἡμῶν Ἰησοῦ ἐν τῇ αὐτοῦ παρουσίᾳ;
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/019.yaml
  text: For what is our hope or joy or crown of boasting—is it not indeed you?—before our Lord Jesus at his coming[a].
translation:
  language: ml
  text: എന്തെന്നാൽ, നമ്മുടെ പ്രത്യാശയോ സന്തോഷമോ അഭിമാനത്തിന്റെ കിരീടമോ എന്താണ്? നമ്മുടെ കർത്താവായ യേശുവിന്റെ വരവിൽ[a] അവിടുത്തെ സന്നിധിയിൽ നിങ്ങളും അല്ലയോ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സാന്നിധ്യത്തിൽ’ അല്ലെങ്കിൽ ‘ആഗമനത്തിൽ.’ ഗ്രീക്ക് പദമായ παρουσίαയ്ക്ക് സാന്നിധ്യം അല്ലെങ്കിൽ ആഗമനം എന്ന് അർഥമാകാം; ഈ സന്ദർഭത്തിൽ അത് കർത്താവായ യേശുവിന്റെ ഭാവിവരവിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς
  choice: ആരാണ്
  rationale: τίς എന്നത് ‘ആർ’ എന്നും ‘എന്ത്’ എന്നും അർഥമാക്കാം. പ്രത്യാശ, സന്തോഷം, കിരീടം എന്നീ നാമങ്ങൾ വന്നാലും തുടർന്ന് അവയെ തെസ്സലൊനീക്യരുമായി വ്യക്തിപരമായി തിരിച്ചറിയുന്നതിനാൽ മലയാളത്തിൽ ‘ആരാണ്’ എന്നത് സ്വാഭാവികവും ഗ്രീക്കിലെ ആശയവികാസത്തോട് യോജിച്ചതുമാണ്.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തോടുള്ള വിശദീകരണബന്ധം മായ്ച്ചുകളയാതെ നിലനിർത്തുന്നു.
- source_word: ἐλπίς
  choice: പ്രത്യാശ
  rationale: ആത്മവിശ്വാസമുള്ള പ്രതീക്ഷ എന്ന പൗലോസിന്റെ സാധാരണ പ്രയോഗത്തിന് യോജിക്കുന്ന പ്രമാണികമായ മലയാളപദം.
- source_word: χαρά
  choice: സന്തോഷം
  rationale: വികാരപരമായ ശക്തി സാധാരണ ആധുനിക മലയാളത്തിൽ നേരിട്ട് അറിയിക്കുന്നു.
- source_word: στέφανος καυχήσεως
  choice: അഭിമാനത്തിന്റെ കിരീടം
  rationale: στέφανος ബഹുമതിയുടെയോ വിജയത്തിന്റെയോ കിരീടത്തെ സൂചിപ്പിക്കുന്നു; καύχησις ഇവിടെ അഭിമാനിക്കാനുള്ള അടിസ്ഥാനത്തെയോ സ്വഭാവത്തെയോ സൂചിപ്പിക്കുന്നു. വ്യാഖ്യാനം ചുരുക്കാതെ ഗ്രീക്കിലെ രൂപകം നിലനിർത്തുന്നു.
- source_word: οὐχὶ καὶ ὑμεῖς
  choice: നിങ്ങളും അല്ലയോ?
  rationale: οὐχί അനുകൂലമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന ചോദ്യമാണ്; καίയുടെ ‘ഉം/കൂടി’ എന്ന ഘടകം നിലനിർത്തിയിരിക്കുന്നു.
- source_word: ἔμπροσθεν
  choice: സന്നിധിയിൽ
  rationale: കർത്താവിന്റെ മുമ്പിൽ നിൽക്കുക എന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: κυρίου
  choice: കർത്താവ്
  rationale: κύριος എന്ന പദത്തിനുള്ള പ്രമാണികമായ പുതിയനിയമ മലയാളരൂപം; ഇവിടെ യേശുവിനെക്കുറിച്ചുള്ള ക്രിസ്തുശാസ്ത്രപരമായ പ്രയോഗത്തിനും യോജിക്കുന്നു.
- source_word: παρουσίᾳ
  choice: വരവിൽ
  rationale: ഈ അന്ത്യകാലസംബന്ധമായ സന്ദർഭത്തിൽ യേശുവിന്റെ ഭാവിവരവിനെയാണ് പദം സൂചിപ്പിക്കുന്നത്. പദത്തിന്റെ വിശാലമായ അർഥപരിധി അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: അന്ത്യകാലസന്ദർഭത്തിലെ παρουσίᾳ എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: വരവിൽ
  alternative: സാന്നിധ്യത്തിൽ; എത്തിച്ചേരലിൽ
  rationale: ഈ വാക്യത്തിൽ കർത്താവായ യേശുവിന്റെ ഭാവിവരവാണ് ഉദ്ദേശിക്കപ്പെടുന്നത് എന്നതിനാൽ ‘വരവിൽ’ വ്യക്തവും സ്വാഭാവികവുമാണ്. എന്നാൽ παρουσία എന്ന പദത്തിൽ സാന്നിധ്യം, എത്തിച്ചേരൽ എന്നീ ആശയങ്ങളും ഉള്ളതിനാൽ അവ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണിക മലയാളത്തിൽ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന വിധം ഗൗരവമുള്ളതും സ്വാഭാവികവുമായ ശൈലി ഉപയോഗിച്ചു. ഗ്രീക്കിലെ വാചാടോപചോദ്യവും ‘പ്രത്യാശയോ സന്തോഷമോ ... കിരീടമോ’ എന്ന സമാന്തരഘടനയും സംരക്ഷിച്ചു.
