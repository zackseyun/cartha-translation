source:
  edition: SBLGNT
  text: ἡ γὰρ παράκλησις ἡμῶν οὐκ ἐκ πλάνης οὐδὲ ἐξ ἀκαθαρσίας ⸀οὐδὲ ἐν δόλῳ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/003.yaml
  text: For our appeal does not come from error or impurity or deceit[b][a],
translation:
  language: ml
  text: എന്തെന്നാൽ, ഞങ്ങളുടെ ആഹ്വാനം[a] തെറ്റിൽനിന്നോ[b] അശുദ്ധിയിൽനിന്നോ ഉളവാകുന്നതല്ല, വഞ്ചനയോടെയുമല്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പ്രബോധനം,’ ‘അഭ്യർഥന,’ അല്ലെങ്കിൽ ‘പ്രോത്സാഹനം’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ παράκλησις എന്ന പദത്തിന്റെ അർഥം സന്ദർഭമനുസരിച്ച് വ്യത്യാസപ്പെടാം.
    reason: lexical_alternative
  - marker: b
    text: ‘തെറ്റ്’ എന്നതിന് പകരം ‘വഞ്ചന’ എന്നും പരിഭാഷപ്പെടുത്താം; എന്നാൽ തുടർന്നുവരുന്ന ‘വഞ്ചനയോടെ’ എന്ന പ്രയോഗം മനഃപൂർവമായ കപടതയെ കൂടുതൽ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: παράκλησις
  choice: ആഹ്വാനം
  rationale: ഈ സന്ദർഭത്തിൽ പൗലോസ് തന്റെ ശുശ്രൂഷയിലൂടെ കേൾവിക്കാരോടു നടത്തിയ ഗൗരവമുള്ള അഭ്യർഥനയും പ്രബോധനവും സൂചിപ്പിക്കുന്നു. ‘ആഹ്വാനം’ ആശ്വാസം എന്ന അർഥത്തിലേക്ക് ചുരുക്കാതെ ആ അഭ്യർഥനാത്മക ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: πλάνης
  choice: തെറ്റ്
  rationale: ἐκ എന്നതോടുകൂടി ഇത് ആഹ്വാനത്തിന്റെ ഉറവിടത്തെ സൂചിപ്പിക്കുന്നു. ‘തെറ്റ്’ അസത്യത്തെയോ തെറ്റായ ധാരണയെയോ ഉൾക്കൊള്ളുന്നു; പിന്നീടുള്ള δόλος മനഃപൂർവമായ വഞ്ചനയെ കൂടുതൽ നേരിട്ട് സൂചിപ്പിക്കുന്നതിനാൽ രണ്ടിന്റെയും വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: ἀκαθαρσίας
  choice: അശുദ്ധി
  rationale: ധാർമിക അശുദ്ധിയെ വിശാലമായി സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ പദമാണിത്. ഗ്രീക്ക് പദത്തിന് ലൈംഗിക അശുദ്ധിയും ഉൾക്കൊള്ളാനാകുമെങ്കിലും വാക്യം അതിലേക്ക് മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: δόλῳ
  choice: വഞ്ചനയോടെ
  rationale: ἐν എന്നതോടുകൂടിയ ഈ പദം പ്രവർത്തനരീതിയെ സൂചിപ്പിക്കുന്നു. ‘വഞ്ചനയോടെ’ എന്നത് മനഃപൂർവമായ കപടതയുടെ ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: ἐκ ... ἐξ ... ἐν
  choice: …യിൽനിന്നോ …യിൽനിന്നോ; …യോടെ
  rationale: ἐκ/ἐξ ഉറവിടത്തെയും ἐν പ്രവർത്തനരീതിയെയോ മേഖലയെയോ സൂചിപ്പിക്കുന്ന വ്യത്യാസം മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തെ വിശദീകരിക്കുന്ന ബന്ധകഭാവം വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ἀκαθαρσία എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: പ്രധാനപാഠത്തിൽ വിശാലമായ അർഥമുള്ള ‘അശുദ്ധി’ ഉപയോഗിച്ചു.
  alternative: ‘ലൈംഗിക അശുദ്ധി’ അല്ലെങ്കിൽ ‘ധാർമിക അശുദ്ധി’
  rationale: ഈ പദത്തിന് ലൈംഗിക സൂചന ഉണ്ടാകാമെങ്കിലും ഗ്രീക്ക് വാക്യം അശുദ്ധിയുടെ രൂപം പ്രത്യേകം നിർണയിക്കുന്നില്ല. അതിനാൽ അർഥം അനാവശ്യമായി ചുരുക്കിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി. ഉറവിടം സൂചിപ്പിക്കുന്ന ἐκ/ἐξ-ഉം പ്രവർത്തനരീതി സൂചിപ്പിക്കുന്ന ἐν-ഉം വേർതിരിച്ചു പ്രകടമാക്കി. പ്രധാനപാഠത്തിലെ എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും [a], [b] എന്ന ക്രമത്തിൽ ചേർത്തിരിക്കുന്നു.
