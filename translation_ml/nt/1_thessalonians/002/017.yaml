  source_fidelity: ഗ്രീക്ക് വാക്യത്തിലെ നേരിയ വൈരുധ്യം (δὲ), ഊന്നലുള്ള ‘ഞങ്ങൾ,’ വിയോഗത്തിന്റെ ശക്തമായ ἀπορφανισθέντες-ദൃശ്യം, ഹ്രസ്വകാല സൂചന, ‘നേരിൽ/ഹൃദയത്തിൽ’ എന്ന വൈരുധ്യം, വീണ്ടും കാണാനുള്ള തീവ്രമായ ആഗ്രഹം എന്നിവ വിശ്വസ്തമായി പ്രതിഫലിക്കുന്നു. ‘പറിച്ചുമാറ്റപ്പെട്ട’ എന്ന പ്രയോഗം അക്ഷരാർഥത്തിലെ അനാഥത്വ-രൂപകത്തെ മുഖ്യവാചകത്തിൽ നിർബന്ധമായി അടിച്ചേൽപ്പിക്കാതെ വേദനാജനകമായ വേർപാട് അറിയിക്കുന്നു; അത് അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
  naturalness: വാചകം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും വായനാസൗകര്യമുള്ളതുമാണ്. ഡാഷുകൾക്കുള്ളിലെ ‘നേരിൽ മാത്രം, ഹൃദയത്തിലല്ല’ എന്ന പ്രയോഗം ശാരീരികമായ വേർപാടും ഹൃദയബന്ധത്തിന്റെ തുടർച്ചയും സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
  terminology: ‘സഹോദരന്മാരേ’ ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചന സംബോധനരൂപം നിലനിർത്തുന്നു; സ്ത്രീകളടക്കമുള്ള വിശ്വാസസമൂഹത്തെ സന്ദർഭം ഉൾക്കൊള്ളാമെന്ന വിശദീകരണം ഉചിതമായ അടിക്കുറിപ്പിൽ നൽകിയിട്ടുണ്ട്. ‘ആകാംക്ഷ,’ ‘ഉത്സുകർ,’ ‘മുഖം കാണാൻ’ എന്നിവ സന്ദർഭത്തിനും മാന്യമായ രജിസ്റ്ററിനും യോജിക്കുന്നു.
