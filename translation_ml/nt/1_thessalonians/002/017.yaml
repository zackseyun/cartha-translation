id: 1TH.2.17
reference: 1 Thessalonians 2:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἡμεῖς δέ, ἀδελφοί, ἀπορφανισθέντες ἀφ’ ὑμῶν πρὸς καιρὸν ὥρας, προσώπῳ οὐ καρδίᾳ, περισσοτέρως ἐσπουδάσαμεν τὸ πρόσωπον ὑμῶν ἰδεῖν ἐν πολλῇ ἐπιθυμίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/017.yaml
  text: But we[a], brothers, having been torn away from you for a short time—in person, not in heart—were all the more eager, with great longing[b], to see your face.
translation:
  language: ml
  text: എന്നാൽ സഹോദരന്മാരേ,[b] കുറച്ചുകാലത്തേക്ക് നിങ്ങളിൽനിന്ന് പറിച്ചുമാറ്റപ്പെട്ട ഞങ്ങൾ[a]—നേരിൽ മാത്രം, ഹൃദയത്തിലല്ല—അതിയായ ആകാംക്ഷയോടെ നിങ്ങളുടെ മുഖം കാണാൻ അതിലേറെ ഉത്സുകരായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, ‘നിങ്ങളിൽനിന്ന് അനാഥരാക്കപ്പെട്ടവർ.’ വേർപാടിന്റെ വേദന വ്യക്തമാക്കാൻ ഗ്രീക്ക് വിയോഗത്തിന്റെ ശക്തമായ ഒരു ദൃശ്യം ഉപയോഗിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘സഹോദരന്മാരേ’ എന്നത് പൗലോസ് ഉപയോഗിക്കുന്ന സംബോധനരൂപമാണ്; ഈ സന്ദർഭത്തിൽ സ്ത്രീകൾ ഉൾപ്പെടെയുള്ള വിശ്വാസസമൂഹം മുഴുവനും ഇതിൽ ഉൾപ്പെടാൻ സാധ്യതയുണ്ട്.
    reason: cultural_note
lexical_decisions:
- source_word: Ἡμεῖς δέ
  choice: എന്നാൽ … ഞങ്ങൾ
  rationale: δέ സൂചിപ്പിക്കുന്ന നേരിയ വൈരുധ്യവും Ἡμεῖς എന്ന ഊന്നലുള്ള കർത്താവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: വ്യാകരണപരമായി പുല്ലിംഗ ബഹുവചനത്തിലുള്ള സംബോധനയെ മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു; സഭയിലെ സ്ത്രീകളും ഉൾപ്പെടുന്നുവെന്ന സന്ദർഭസൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀπορφανισθέντες ἀφ’ ὑμῶν
  choice: നിങ്ങളിൽനിന്ന് പറിച്ചുമാറ്റപ്പെട്ട
  rationale: ἀπορφανίζω വേർപാടിനോടു ബന്ധപ്പെട്ട അനാഥത്വത്തിന്റെയും വിയോഗത്തിന്റെയും ശക്തമായ ദൃശ്യം ഉണർത്തുന്നു. ‘പറിച്ചുമാറ്റപ്പെട്ട’ എന്നത് നിർബന്ധിതവും വേദനാജനകവുമായ വേർപാട് സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; അക്ഷരാർഥദൃശ്യം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: πρὸς καιρὸν ὥρας
  choice: കുറച്ചുകാലത്തേക്ക്
  rationale: ഇത് അക്ഷരാർഥത്തിൽ ഒരു മണിക്കൂറിനെക്കാൾ ഹ്രസ്വമായ ഒരു കാലയളവിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.
- source_word: προσώπῳ οὐ καρδίᾳ
  choice: നേരിൽ മാത്രം, ഹൃദയത്തിലല്ല
  rationale: ശാരീരിക സാന്നിധ്യത്തിലെ വേർപാടിനെയും ഉള്ളിലെ സ്നേഹബന്ധം തുടരുന്നതിനെയും തമ്മിലുള്ള വൈരുധ്യം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു. ‘മാത്രം’ മലയാളത്തിൽ ഈ നിയന്ത്രണം വ്യക്തമാക്കുന്നു.
- source_word: περισσοτέρως ἐσπουδάσαμεν
  choice: അതിലേറെ ഉത്സുകരായി
  rationale: περισσοτέρως എന്ന താരതമ്യ ഊന്നലും σπουδάζω എന്നതിലെ തീക്ഷ്ണമായ താത്പര്യവും പരിശ്രമസന്നദ്ധതയും ചേർത്ത് വായനാസൗകര്യത്തോടെ പ്രകടിപ്പിക്കുന്നു.
- source_word: τὸ πρόσωπον ὑμῶν ἰδεῖν
  choice: നിങ്ങളുടെ മുഖം കാണാൻ
  rationale: ‘നിങ്ങളെ കാണാൻ’ എന്നു ലഘൂകരിക്കാതെ ഗ്രീക്കിലെ ‘മുഖം’ നിലനിർത്തി നേരിട്ടുള്ള വ്യക്തിപരമായ കൂടിക്കാഴ്ചയുടെ ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: ἐν πολλῇ ἐπιθυμίᾳ
  choice: അതിയായ ആകാംക്ഷയോടെ
  rationale: ഈ സന്ദർഭത്തിൽ ἐπιθυμία ദുഷ്കാമമല്ല, ശക്തമായ സ്നേഹപൂർവമായ ആഗ്രഹമാണ്; ‘അതിയായ ആകാംക്ഷ’ ആ തീവ്രത വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ἀδελφοί എന്ന സഭാസംബോധനയിലെ ലിംഗസൂചന
  choice: സഹോദരന്മാരേ
  alternative: സഹോദരീസഹോദരന്മാരേ / സഹോദരങ്ങളേ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗരൂപം മുഖ്യവാചകത്തിൽ സംരക്ഷിച്ചു. എന്നാൽ പൗലോസിന്റെ ഈ സംബോധന സന്ദർഭത്തിൽ വിശ്വാസസമൂഹത്തിലെ സ്ത്രീകളെയും ഉൾക്കൊള്ളാൻ സാധ്യതയുള്ളതിനാൽ ആ വ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു; അങ്ങനെ രൂപവും സന്ദർഭാർഥവും രണ്ടും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ ശൈലി. വാക്യത്തിലെ വികാരതീവ്രതയും ‘നേരിൽ/ഹൃദയത്തിൽ’ എന്ന വൈരുധ്യവും ‘മുഖം കാണുക’ എന്ന മൂലദൃശ്യവും നിലനിർത്തി; അതേസമയം അസ്വാഭാവികമായ അക്ഷരാനുവാദം ഒഴിവാക്കി.
