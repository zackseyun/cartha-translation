id: 1TH.2.5
reference: 1 Thessalonians 2:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὔτε γάρ ποτε ἐν λόγῳ κολακείας ἐγενήθημεν, καθὼς οἴδατε, οὔτε ⸀ἐν προφάσει πλεονεξίας, θεὸς μάρτυς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/005.yaml
  text: For we never came with flattering speech[a], as you know[b], nor with a pretext for greed—God is witness.
translation:
  language: ml
  text: കാരണം, നിങ്ങൾക്കറിയാവുന്നതുപോലെ, ഞങ്ങൾ ഒരിക്കലും മുഖസ്തുതിയുടെ വാക്കുകളുമായി[a] വന്നിട്ടില്ല; ലോഭത്തിനുള്ള ഒരു മറവോടെയും[b] വന്നിട്ടില്ല—ദൈവം സാക്ഷി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മുഖസ്തുതിയോടെ’; അക്ഷരാർഥത്തിൽ, ‘മുഖസ്തുതിയുടെ ഒരു വാക്കിൽ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ലോഭം മറയ്ക്കാനുള്ള ഒരു മറവോടെ’ അല്ലെങ്കിൽ ‘ലോഭത്തിനായുള്ള വ്യാജഭാവത്തോടെ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔτε γάρ ποτε
  choice: കാരണം ... ഞങ്ങൾ ഒരിക്കലും ... വന്നിട്ടില്ല
  rationale: γάρ മുൻവാക്യത്തിലെ ന്യായീകരണവുമായി ബന്ധിപ്പിക്കാൻ ‘കാരണം’ എന്നു പരിഭാഷപ്പെടുത്തി. οὔτε ... ποτε എന്ന കാലവ്യാപകമായ ഊന്നിയ നിഷേധം സ്വാഭാവിക മലയാളത്തിൽ ‘ഒരിക്കലും ... വന്നിട്ടില്ല’ എന്നു നൽകി.
- source_word: ἐν λόγῳ κολακείας
  choice: മുഖസ്തുതിയുടെ വാക്കുകളുമായി
  rationale: λόγος ഇവിടെ ഒറ്റ വാക്കല്ല, സംസാരത്തെയാണ് സൂചിപ്പിക്കുന്നത്; κολακεία സ്വാർഥലക്ഷ്യത്തോടെയുള്ള മുഖസ്തുതിയാണ്. ἐν എന്നതിന്റെ സാഹചര്യപരമായ ഭാവം ‘-മായി’ നിലനിർത്തുന്നു.
- source_word: ἐγενήθημεν
  choice: വന്നിട്ടില്ല
  rationale: γίνομαι എന്നതിന്റെ അക്ഷരാർഥം ‘ആയിത്തീരുക’ ആണെങ്കിലും, തെസ്സലോനിക്കയിലെ അവരുടെ സാന്നിധ്യവും പെരുമാറ്റരീതിയും പറയുന്ന ഈ സന്ദർഭത്തിൽ ‘വന്നിട്ടില്ല’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: καθὼς οἴδατε
  choice: നിങ്ങൾക്കറിയാവുന്നതുപോലെ
  rationale: വായനക്കാരുടെ നേരിട്ടുള്ള അറിവിലേക്കുള്ള അപ്പീലിനെ ലളിതവും കൃത്യവുമായി നിലനിർത്തുന്നു.
- source_word: ἐν προφάσει πλεονεξίας
  choice: അത്യാഗ്രഹം മറച്ചുവെക്കാനുള്ള ഒരു നാട്യത്തോടെ
  rationale: πρόφασις ഒരു വ്യാജമായ പുറംഭാവത്തെയോ മറയെയോ സൂചിപ്പിക്കുന്നു; πλεονεξία മറ്റുള്ളവരുടെതുകൂടി സ്വന്തമാക്കാനുള്ള അത്യാഗ്രഹമാണ്. മലയാളത്തിൽ ഉദ്ദേശിച്ച മറച്ചുവെക്കൽ വ്യക്തമായി കേൾക്കാൻ ഈ രൂപം തിരഞ്ഞെടുത്തു.
- source_word: θεὸς μάρτυς
  choice: ദൈവം സാക്ഷി
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ ദൈവസാക്ഷ്യാഹ്വാനം ഉടമസ്ഥസർവനാമം ചേർക്കാതെ അതേപടി നിലനിർത്തുന്നു.
theological_decisions:
- issue: പൗലോസ് നിഷേധിക്കുന്ന രീതിയും ഉദ്ദേശ്യവും
  choice: സംസാരത്തിലെ മുഖസ്തുതിയും വ്യാജമായ പുറംഭാവത്തിനു പിന്നിൽ മറച്ചുവെച്ച അത്യാഗ്രഹവും രണ്ടും നിഷേധിക്കുന്നു.
  alternative: എല്ലാ വാഗ്‌ചാതുര്യത്തെയും പൊതുവായി തള്ളിക്കളയുന്നതായോ സാമ്പത്തിക ചൂഷണം മാത്രം നിഷേധിക്കുന്നതായോ വായിക്കുക.
  rationale: ഗ്രീക്ക് പാഠം κολακεία, πλεονεξία എന്നീ പ്രത്യേക കുറ്റങ്ങളാണ് പറയുന്നത്. അതിനാൽ വാക്യത്തെ എല്ലാ ശൈലിസമ്പന്നമായ സംസാരത്തിനെതിരായ പ്രസ്താവനയാക്കുകയോ അത്യാഗ്രഹത്തെ പണത്തിൽ മാത്രം ഒതുക്കുകയോ ചെയ്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘മുഖസ്തുതി’, ‘അത്യാഗ്രഹം’, ‘ദൈവം സാക്ഷി’ എന്നിവ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും മൂലപാഠത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നതുമാണ്. സമാന്തരമായ οὔτε ... οὔτε ഘടന രണ്ട് ‘വന്നിട്ടില്ല’ പ്രയോഗങ്ങളിലൂടെ വ്യക്തമായി പുനരാവിഷ്കരിച്ചു.
