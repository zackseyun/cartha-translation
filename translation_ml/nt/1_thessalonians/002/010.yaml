source:
  edition: SBLGNT
  text: ὑμεῖς μάρτυρες καὶ ὁ θεός, ὡς ὁσίως καὶ δικαίως καὶ ἀμέμπτως ὑμῖν τοῖς πιστεύουσιν ἐγενήθημεν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/010.yaml
  text: You are witnesses[a], and God also, how devoutly and righteously and blamelessly we behaved toward you who believe[b],
translation:
  language: ml
  text: നിങ്ങൾ സാക്ഷികളാണ്; ദൈവവും സാക്ഷിയാണ്—വിശ്വസിക്കുന്ന നിങ്ങളോടു ഞങ്ങൾ എങ്ങനെ ഭക്തിയോടെയും നീതിയോടെയും കുറ്റമറ്റവിധത്തിലും പെരുമാറി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നിങ്ങളുടെ ഇടയിൽ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς μάρτυρες καὶ ὁ θεός
  choice: നിങ്ങൾ സാക്ഷികളാണ്; ദൈവവും സാക്ഷിയാണ്
  rationale: തെസ്സലൊനീക്യരെ ആദ്യം അഭിസംബോധന ചെയ്യുന്ന ഊന്നൽ നിലനിർത്തിക്കൊണ്ട്, മലയാളത്തിൽ സ്വാഭാവികമാകാൻ സൂചിതമായ ക്രിയ ഇരുവശത്തും വ്യക്തമാക്കുന്നു.
- source_word: ὡς
  choice: എത്ര ... എന്ന്
  rationale: തുടർന്നുവരുന്ന മൂന്ന് ക്രിയാവിശേഷണങ്ങൾ വിവരിക്കുന്ന പെരുമാറ്റരീതിയെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ὁσίως
  choice: ഭക്തിയോടെ
  rationale: ദൈവസന്നിധിയിലെ ഭക്തിനിഷ്ഠയുള്ള പെരുമാറ്റം എന്ന ദൈവോന്മുഖ അർത്ഥം സാധാരണ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: δικαίως
  choice: നീതിയോടെ
  rationale: ധാർമികമായി ശരിയായ പെരുമാറ്റം സൂചിപ്പിക്കുന്നു; നിയമപരമായ അർത്ഥത്തിലേക്ക് അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: ἀμέμπτως
  choice: കുറ്റമറ്റവിധത്തിൽ
  rationale: ന്യായമായ കുറ്റാരോപണത്തിന് ഇടനൽകാത്ത പെരുമാറ്റം നേരിട്ട് പ്രകടിപ്പിക്കുന്നു; പാപരഹിത പൂർണത എന്ന അധികവാദം ചേർക്കുന്നില്ല.
- source_word: ὑμῖν
  choice: നിങ്ങളോട്
  rationale: ദാതൃവിഭക്തിയുടെ ബന്ധപരമായ ദിശ ‘toward you’ എന്ന അർത്ഥത്തിൽ നൽകുന്നു; ‘നിങ്ങളുടെ ഇടയിൽ’ എന്ന വായനയും വ്യാകരണപരമായി സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: τοῖς πιστεύουσιν
  choice: വിശ്വസിക്കുന്ന നിങ്ങൾ
  rationale: വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ ക്രിയാത്മകത നിലനിർത്തുകയും അഭിസംബോധിതരെ വ്യക്തമായി തിരിച്ചറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐγενήθημεν
  choice: ഞങ്ങൾ ... പെരുമാറി
  rationale: മൂന്ന് രീതിവാചക ക്രിയാവിശേഷണങ്ങളോടൊപ്പം γίνομαι ഇവിടെ സംഘത്തിന്റെ ജീവിതരീതിയെയോ പെരുമാറ്റത്തെയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘പെരുമാറി’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
theological_decisions:
- issue: അപ്പൊസ്തലിക പെരുമാറ്റത്തെ വിവരിക്കുന്ന മൂന്ന് ധാർമിക പദങ്ങൾ
  choice: മിഷനറിമാരുടെ യഥാർഥ ജീവിതരീതിയെക്കുറിച്ചുള്ള ഗൗരവമുള്ള സാക്ഷ്യാവാഹനമായി വിവർത്തനം ചെയ്തു
  alternative: ഇത് വെറും വാഗ്വൈഭവപരമായ ആത്മപ്രതിരോധമെന്നോ സമ്പൂർണ പാപരഹിതത്വത്തിന്റെ അവകാശവാദമെന്നോ വ്യക്തമാക്കുക
  rationale: മൂലവാക്യം മനുഷ്യരെയും ദൈവത്തെയും സാക്ഷികളാക്കിക്കൊണ്ട് അവരുടെ പെരുമാറ്റത്തിന്റെ നിർമലത അവകാശപ്പെടുന്നു; എന്നാൽ തത്ത്വചിന്താപരമായ പാപരഹിത പൂർണതയെ വ്യക്തമാക്കുന്നില്ല. ആ സംഘർഷം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. മൂലത്തിലെ സാക്ഷ്യാവാഹനത്തിന്റെ ഗൗരവവും മൂന്ന് സമാന്തര ക്രിയാവിശേഷണങ്ങളുടെ താളവും കഴിയുന്നത്ര നിലനിർത്തി. ‘ഭക്തിയോടെ’ എന്നത് ὁσίως എന്ന പദത്തിന്റെ ദൈവോന്മുഖ അർത്ഥം നൽകുന്നു; പ്രത്യേക അടിക്കുറിപ്പ് ആവശ്യമില്ലെന്ന് വിലയിരുത്തി.
