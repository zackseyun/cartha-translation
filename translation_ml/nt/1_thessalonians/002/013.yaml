id: 1TH.2.13
reference: 1 Thessalonians 2:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀Καὶ διὰ τοῦτο καὶ ἡμεῖς εὐχαριστοῦμεν τῷ θεῷ ἀδιαλείπτως, ὅτι παραλαβόντες λόγον ἀκοῆς παρ’ ἡμῶν τοῦ θεοῦ ἐδέξασθε οὐ λόγον ἀνθρώπων ἀλλὰ καθὼς ⸂ἀληθῶς ἐστὶν⸃ λόγον θεοῦ, ὃς καὶ ἐνεργεῖται ἐν ὑμῖν τοῖς πιστεύουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/013.yaml
  text: And because of this we also thank God continually[a], that when you received the word of God that you heard from us, you accepted it not as the word of men but, as it truly is, the word of God[c][b], which is also at work in you who believe.
translation:
  language: ml
  text: 'ഇക്കാരണത്താൽ ഞങ്ങളും ദൈവത്തിന് ഇടവിടാതെ നന്ദി പറയുന്നു: ഞങ്ങളിൽനിന്ന് നിങ്ങൾ കേട്ട ദൈവവചനം സ്വീകരിച്ചപ്പോൾ, അതിനെ മനുഷ്യവചനമായിട്ടല്ല, വാസ്തവത്തിൽ അതു ദൈവവചനം തന്നെയായതുപോലെ ദൈവവചനമായിത്തന്നെ അംഗീകരിച്ചു. ആ വചനം വിശ്വസിക്കുന്ന നിങ്ങളിൽ പ്രവർത്തിച്ചുകൊണ്ടിരിക്കുന്നു.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അവസാനഭാഗം “വിശ്വസിക്കുന്ന നിങ്ങളിൽ പ്രവർത്തിച്ചുകൊണ്ടിരിക്കുന്ന ദൈവം” എന്നും മനസ്സിലാക്കാം; ഗ്രീക്കിലെ ബന്ധസർവനാമം ‘വചനം’ എന്നതിനെയോ ‘ദൈവം’ എന്നതിനെയോ സൂചിപ്പിക്കാൻ കഴിയും.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: ഇക്കാരണത്താൽ
  rationale: മുൻസന്ദർഭവുമായി ബന്ധിപ്പിക്കുന്ന വ്യക്തമായ കാരണാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: εὐχαριστοῦμεν τῷ θεῷ ἀδιαλείπτως
  choice: ദൈവത്തിന് ഇടവിടാതെ നന്ദി പറയുന്നു
  rationale: വർത്തമാനകാലത്തിലെ തുടർച്ചയും ἀδιαλείπτως എന്നതിന്റെ ആവർത്തിതമായ നിരന്തരതയും വ്യക്തമാക്കുന്നു.
- source_word: λόγον ἀκοῆς παρ’ ἡμῶν τοῦ θεοῦ
  choice: ഞങ്ങളിൽനിന്നു കേട്ട ദൈവവചനം
  rationale: ഗ്രീക്കിലെ സങ്കുചിതമായ ഷഷ്ഠീവിഭക്തി ഘടനയെ സ്വാഭാവിക മലയാളത്തിൽ തുറന്നുപറയുകയും സന്ദേശം ഞങ്ങളിൽനിന്നു കേട്ടതാണെന്നും അത് ദൈവത്തിന്റെ വചനമാണെന്നും വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: παραλαβόντες ... ἐδέξασθε
  choice: കേട്ട ... വചനം നിങ്ങൾ സ്വീകരിച്ചപ്പോൾ ... സ്വീകരിച്ചത്
  rationale: παραλαμβάνω എന്ന പ്രാഥമിക കൈപ്പറ്റലും δέχομαι എന്ന മനസ്സോടെയുള്ള അംഗീകരണവും സന്ദർഭത്തിൽ വേർതിരിക്കാൻ മലയാളത്തിലെ ആവർത്തനം അനുവദിക്കുന്നു; രണ്ടാമത്തേതിന് ‘സ്വീകരിച്ചത്’ എന്നത് അനുകൂല അംഗീകാരത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: οὐ λόγον ἀνθρώπων
  choice: മനുഷ്യരുടെ വചനമായിട്ടല്ല
  rationale: ἀνθρώπων എന്ന പൊതുവായ മനുഷ്യസൂചനയെ ലിംഗനിരപേക്ഷമായി നൽകുകയും ‘ദൈവവചനം’ എന്ന പ്രതിവിരുദ്ധത സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀλλὰ καθὼς ἀληθῶς ἐστὶν λόγον θεοῦ
  choice: യഥാർഥത്തിൽ ആയിരിക്കുന്നതുപോലെ ദൈവവചനമായിട്ടാണ്
  rationale: ἀληθῶς എന്ന ഊന്നലും വചനം യഥാർഥത്തിൽ എന്താണെന്ന പ്രസ്താവനയും അധിക വ്യാഖ്യാനം ചേർക്കാതെ നിലനിർത്തുന്നു.
- source_word: ὃς καὶ ἐνεργεῖται
  choice: ആ വചനം ... പ്രവർത്തിച്ചുകൊണ്ടുമിരിക്കുന്നു
  rationale: ഏറ്റവും സമീപസ്ഥമായ λόγος എന്ന പൂർവ്വപദത്തെ സൂചിപ്പിക്കുന്ന പ്രധാന വായന സ്വീകരിക്കുന്നു; ἐνεργεῖται എന്നതിന്റെ തുടരുന്ന ഫലപ്രവർത്തനം ‘പ്രവർത്തിച്ചുകൊണ്ടിരിക്കുന്നു’ എന്നു നൽകുന്നു.
- source_word: ἐν ὑμῖν τοῖς πιστεύουσιν
  choice: വിശ്വസിക്കുന്ന നിങ്ങളിൽ
  rationale: വർത്തമാന കൃതന്തത്തിന്റെ തുടരുന്ന വിശ്വാസസ്വഭാവവും ἐν എന്നതിന്റെ ‘നിങ്ങളിൽ’ എന്ന അർഥവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ὃς എന്ന ബന്ധസർവനാമത്തിന്റെ പൂർവ്വപദം
  choice: ‘ആ വചനം’ എന്നു ദൈവവചനത്തെ സൂചിപ്പിക്കുന്നു
  alternative: ‘വിശ്വസിക്കുന്ന നിങ്ങളിൽ പ്രവർത്തിക്കുന്ന ദൈവം’ എന്നിങ്ങനെ ദൈവത്തെ സൂചിപ്പിക്കാം
  rationale: ὃς വ്യാകരണപരമായി λόγος, θεός എന്നീ രണ്ടിനോടും പൊരുത്തപ്പെടാമെങ്കിലും ഏറ്റവും അടുത്ത പൂർവ്വപദവും വാക്യത്തിന്റെ മുഖ്യവിഷയവും ‘വചനം’ തന്നെയാണ്. മറ്റുവായന യഥാർഥ സാധ്യതയായതിനാൽ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- issue: λόγον θεοῦ എന്നതിന്റെ ദൈവശാസ്ത്രപരമായ ഭാരം
  choice: ദൈവവചനം
  alternative: ദൈവത്തിന്റെ സന്ദേശം
  rationale: മനുഷ്യരുടെ വചനവും ദൈവവചനവും തമ്മിലുള്ള പാഠത്തിലെ നേരിട്ടുള്ള പ്രതിവിരുദ്ധത നിലനിർത്തുന്നു; ഈ വാക്യം പറയുന്നതിനെക്കാൾ വിശാലമായ പ്രചോദനസിദ്ധാന്തം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ദൈവവചനം’ എന്ന പരിചിതവും ഗൗരവമുള്ളതുമായ പദം നിലനിർത്തി; ‘മനുഷ്യരുടെ’ എന്നു നൽകി ഉൾക്കൊള്ളുന്ന ഭാഷ ഉപയോഗിച്ചു. ഗ്രീക്കിലെ നീണ്ട വാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി, എന്നാൽ തർക്കബന്ധവും ഊന്നലും സംരക്ഷിച്ചു.
