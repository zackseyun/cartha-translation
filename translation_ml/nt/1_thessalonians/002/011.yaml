translation:
  language: ml
  text: നിങ്ങൾക്കറിയാവുന്നതുപോലെ[a], ഒരു പിതാവ് സ്വന്തം മക്കളോട് ഇടപെടുന്നതുപോലെ ഞങ്ങൾ നിങ്ങളിൽ ഓരോരുത്തരോടും ഇടപെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, കൂടുതൽ പദാനുപദമായി: ‘നിങ്ങൾക്കറിയാവുന്നതുപോലെ, നിങ്ങളിൽ ഓരോരുത്തരെയും, ഒരു പിതാവ് സ്വന്തം മക്കളെ എന്നപോലെ.’ ഗ്രീക്ക് ഉപവാക്യം അപൂർണമാണ്; അതിന്റെ പൂർണമായ ക്രിയാഭാവം ചുറ്റുമുള്ള വാക്യത്തിൽനിന്നാണ് ലഭിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ
  choice: എന്നതുപോലെ
  rationale: തെസ്സലൊനീക്യർക്ക് അറിയാവുന്ന പൗലോസിന്റെ പെരുമാറ്റത്തെ ആധാരമാക്കിയുള്ള താരതമ്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: οἴδατε
  choice: നിങ്ങൾക്കറിയാം
  rationale: രൂപത്തിൽ perfect ആയിരുന്നാലും οἶδα ഇവിടെ വർത്തമാനകാല അർഥമായ ‘അറിയുക’ എന്നതാണ് നൽകുന്നത്.
- source_word: ἕνα ἕκαστον ὑμῶν
  choice: നിങ്ങളിൽ ഓരോരുത്തരോടും
  rationale: ഓരോ വ്യക്തിക്കും നൽകിയ ശ്രദ്ധയെ ഊന്നിപ്പറയുന്ന distributive force നിലനിർത്തുന്നു.
- source_word: ὡς πατὴρ
  choice: ഒരു പിതാവ് ... എന്നതുപോലെ
  rationale: ആർട്ടിക്കിൾ ഇല്ലാത്ത πατήρ താരതമ്യാത്മകവും ഗുണസൂചകവുമാണ്; മലയാളത്തിൽ ‘ഒരു പിതാവ്’ സ്വാഭാവികമാണ്.
- source_word: τέκνα
  choice: മക്കൾ
  rationale: ലിംഗഭേദം നിർണയിക്കാത്ത വിശാലമായ കുടുംബബന്ധപദമായ τέκναയെ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: ἑαυτοῦ
  choice: സ്വന്തം
  rationale: പൊതുവെ മക്കളെയല്ല, പിതാവിന്റെ സ്വന്തം മക്കളെയാണ് സൂചിപ്പിക്കുന്ന പ്രത്യയത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: '[elliptical verbal idea from context]'
  choice: ഇടപെട്ടു
  rationale: ഗ്രീക്ക് ഖണ്ഡത്തിന്റെ അപൂർണമായ ക്രിയാഭാവം സമീപസന്ദർഭത്തിൽനിന്ന് പൂരിപ്പിക്കുന്നു; പ്രബോധിപ്പിച്ചു, ആശ്വസിപ്പിച്ചു തുടങ്ങിയ ഒരു പ്രത്യേക പ്രവൃത്തിയിലേക്ക് അർഥം അനാവശ്യമായി ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: അപൂർണമായ ഗ്രീക്ക് ഉപവാക്യത്തിൽ സൂചിതമായ ക്രിയാപ്രവൃത്തി പൂരിപ്പിക്കൽ
  choice: ‘ഞങ്ങൾ നിങ്ങളിൽ ഓരോരുത്തരോടും ഇടപെട്ടു’ എന്ന വിശാലമായ ക്രിയാപ്രയോഗം
  alternative: വാക്യം ഖണ്ഡിതമായി വിടുക, അല്ലെങ്കിൽ ‘പ്രബോധിപ്പിച്ചു’ പോലുള്ള കൂടുതൽ നിർദിഷ്ടമായ ക്രിയ ചേർക്കുക
  rationale: ഗ്രീക്ക് വാചകം സമീപവാക്യത്തെ ആശ്രയിക്കുന്നതിനാൽ മലയാളത്തിൽ പൂർണമായ അർഥം നൽകാൻ ഒരു ക്രിയ ആവശ്യമാണ്. ‘ഇടപെട്ടു’ പിതൃസമാനമായ പരിചരണത്തിന്റെ പല വശങ്ങളും ഉൾക്കൊള്ളുകയും ഒരു പ്രത്യേക പ്രവൃത്തിയെ മാത്രം മുൻനിർത്താതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘മക്കൾ’ ഉൾക്കൊള്ളുന്ന കുടുംബപദമായി ഉപയോഗിച്ചു. മൂലത്തിലെ ellipse പ്രധാനവാചകത്തിൽ വായനാസൗകര്യത്തിനായി പൂരിപ്പിക്കുകയും അടിക്കുറിപ്പിൽ തുറന്നുപറയുകയും ചെയ്തു.
