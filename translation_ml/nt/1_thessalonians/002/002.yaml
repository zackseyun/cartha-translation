reference: 1 Thessalonians 2:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλὰ προπαθόντες καὶ ὑβρισθέντες καθὼς οἴδατε ἐν Φιλίπποις ἐπαρρησιασάμεθα ἐν τῷ θεῷ ἡμῶν λαλῆσαι πρὸς ὑμᾶς τὸ εὐαγγέλιον τοῦ θεοῦ ἐν πολλῷ ἀγῶνι.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/002.yaml
  text: But after we had already suffered and been shamefully mistreated[a], as you know, in Philippi[c][b], we were bold in our God to speak the gospel of God to you amid much conflict.
translation:
  language: ml
  text: എന്നാൽ, നിങ്ങൾക്കറിയാവുന്നതുപോലെ, ഫിലിപ്പിയിൽവെച്ച് മുമ്പേ കഷ്ടം അനുഭവിക്കുകയും അപമാനകരമായ പെരുമാറ്റം നേരിടുകയും ചെയ്തശേഷം[a], നമ്മുടെ ദൈവത്തിൽ ഞങ്ങൾ ധൈര്യപ്പെട്ട്[b], വലിയ സംഘർഷത്തിനിടയിൽ[c] ദൈവത്തിന്റെ സുവിശേഷം നിങ്ങളോടു പറയുകയുണ്ടായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അധിക്ഷേപിക്കപ്പെടുകയും,’ ‘ഹീനമായി പെരുമാറപ്പെടുകയും,’ അല്ലെങ്കിൽ ‘പീഡിപ്പിക്കപ്പെടുകയും.’ ധിക്കാരപരമായ പെരുമാറ്റവും പരസ്യമായ അപമാനവും ഉൾക്കൊള്ളുന്ന ഗ്രീക്ക് ക്രിയയാണിത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘നമ്മുടെ ദൈവത്തിൽ ഞങ്ങൾ ധൈര്യത്തോടെ സംസാരിച്ചു.’ ഗ്രീക്ക് ക്രിയയിൽ ധൈര്യത്തോടെ സംസാരിക്കുക എന്ന ആശയംതന്നെ ഉൾപ്പെടാം; എന്നാൽ അതിനു പിന്നാലെയുള്ള ‘പറയുക’ എന്ന ക്രിയാരൂപം പ്രതിഫലിപ്പിക്കാൻ മുഖ്യപാഠത്തിൽ ഇവ വേർതിരിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘വലിയ പോരാട്ടത്തിൽ’ അല്ലെങ്കിൽ ‘കടുത്ത എതിർപ്പിനിടയിൽ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ ആശയത്തോട് ശക്തമായ വൈരുധ്യം സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള പ്രയോഗം.
- source_word: προπαθόντες
  choice: മുമ്പുതന്നെ കഷ്ടം സഹിക്കുകയും
  rationale: പ്രധാന ക്രിയയ്ക്കു മുൻപുണ്ടായ കഷ്ടാനുഭവവും προ- എന്ന മുൻകാലസൂചനയും പ്രകടമാക്കുന്നു.
- source_word: ὑβρισθέντες
  choice: അപമാനകരമായ ദുഷ്പെരുമാറ്റം ഏൽക്കുകയും
  rationale: വെറും വാക്കാലുള്ള അധിക്ഷേപമല്ല, ധിക്കാരപരവും മാനഹാനികരവുമായ പെരുമാറ്റം ഏറ്റുവാങ്ങിയെന്ന ക്രിയയുടെ വിശാലമായ അർഥം നിലനിർത്തുന്നു.
- source_word: καθὼς οἴδατε
  choice: നിങ്ങൾക്കറിയാവുന്നതുപോലെ
  rationale: വായനക്കാരുടെ അറിവിലേക്കുള്ള പൗലോസിന്റെ നേരിട്ടുള്ള അഭ്യർഥന സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐν Φιλίπποις
  choice: ഫിലിപ്പിയിൽ
  rationale: സ്ഥലനാമത്തിന്റെ പ്രചാരത്തിലുള്ള മലയാള രൂപം.
- source_word: ἐπαρρησιασάμεθα
  choice: ഞങ്ങൾ ധൈര്യപ്പെട്ടു
  rationale: തുറന്നും ഭയമില്ലാതെയും സംസാരിക്കുന്ന ധൈര്യം സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള λαλῆσαι സംസാരപ്രവൃത്തിയെ പ്രത്യേകം വ്യക്തമാക്കുന്നതിനാൽ അനാവശ്യ ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: ἐν τῷ θεῷ ἡμῶν
  choice: നമ്മുടെ ദൈവത്തിൽ
  rationale: ദൈവത്തെ വെറും പ്രവർത്തകകാരണമായി ചുരുക്കാതെ, ധൈര്യത്തിന്റെ ബന്ധപരമായ മേഖലയോ അടിസ്ഥാനമോ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ തുറന്ന അർഥം സംരക്ഷിക്കുന്നു.
- source_word: λαλῆσαι πρὸς ὑμᾶς
  choice: നിങ്ങളോടു സംസാരിക്കാൻ
  rationale: ലളിതമായ സംസാരക്രിയയും അതിന്റെ ശ്രോതാക്കളും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ സുവിശേഷം
  rationale: പൗലോസിന്റെ ജനിതകഘടനയും പരിചിതമായ ദൈവശാസ്ത്രപരമായ പ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: ἐν πολλῷ ἀγῶνι
  choice: വലിയ പോരാട്ടത്തിനിടയിൽ
  rationale: ἀγών എന്നതിലെ പോരാട്ടം, സംഘർഷം, എതിർപ്പ് എന്നീ അർഥസാധ്യതകൾ ഒരളവുവരെ തുറന്നുവെക്കുന്നു.
theological_decisions:
- issue: ἐν τῷ θεῷ ἡμῶν എന്നതിന്റെ അർഥവ്യാപ്തി
  choice: നമ്മുടെ ദൈവത്തിൽ
  alternative: നമ്മുടെ ദൈവത്താൽ; നമ്മുടെ ദൈവത്തിലുള്ള ആശ്രയത്തോടെ
  rationale: ഈ പ്രയോഗം ദൈവത്തെ ധൈര്യത്തിന്റെ മേഖലയായോ അടിസ്ഥാനമായോ അവതരിപ്പിക്കാം. കാരണാർഥമോ മനോഭാവാർഥമോ മാത്രം തിരഞ്ഞെടുത്ത് ഗ്രീക്കിന്റെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില ചുരുക്കാതിരിക്കാനാണ് അക്ഷരഘടന നിലനിർത്തിയത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘നമ്മുടെ ദൈവത്തിൽ’ എന്നത് മലയാളത്തിൽ അല്പം ഔപചാരികമായി തോന്നാമെങ്കിലും മൂലപാഠത്തിലെ ബന്ധപരവും ദൈവശാസ്ത്രപരമായി തുറന്നതുമായ പ്രയോഗം സംരക്ഷിക്കാൻ നിലനിർത്തി. ദീർഘമായ ഗ്രീക്ക് വാക്യക്രമം വായനാസൗകര്യത്തിനായി മലയാളത്തിന്റെ സ്വാഭാവിക ക്രമത്തിലാക്കി; പങ്കാളിക്രിയകളുടെ മുൻകാലബന്ധവും ‘ചെയ്തിട്ടും’ എന്ന വൈരുധ്യശക്തിയും സൂക്ഷിച്ചു.
