id: 1TH.2.1
reference: 1 Thessalonians 2:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Αὐτοὶ γὰρ οἴδατε, ἀδελφοί, τὴν εἴσοδον ἡμῶν τὴν πρὸς ὑμᾶς ὅτι οὐ κενὴ γέγονεν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/001.yaml
  text: For you yourselves know[a], brothers, that our coming to you was not in vain,
translation:
  language: ml
  text: സഹോദരന്മാരേ[a], നിങ്ങളുടെ അടുക്കലേക്കുള്ള ഞങ്ങളുടെ വരവ് വ്യർഥമായിരുന്നില്ലെന്ന് നിങ്ങൾതന്നെ അറിയുന്നുവല്ലോ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സഹോദരീസഹോദരന്മാരേ”; ഗ്രീക്കിൽ “സഹോദരന്മാർ” എന്നാണ്. വിശ്വാസസമൂഹത്തെ മുഴുവനായി അഭിസംബോധന ചെയ്യാൻ പുല്ലിംഗരൂപം പലപ്പോഴും ഉപയോഗിക്കപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτοὶ
  choice: നിങ്ങൾതന്നെ
  rationale: തെസ്സലൊനീക്യരുടെ നേരിട്ടുള്ള അറിവിന് ഊന്നൽ നൽകുന്ന αὐτοὶ എന്ന തീവ്രപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: γὰρ
  choice: —വല്ലോ
  rationale: മുൻവാക്യത്തിന് പിന്തുണ നൽകുന്ന γὰρ-ന്റെ ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യാന്ത്യ ഊന്നലിലൂടെ പ്രകടമാക്കുന്നു; പ്രത്യേകമായി ‘എന്തെന്നാൽ’ ചേർക്കുന്നത് ഇവിടെ കൃത്രിമമാകും.
- source_word: οἴδατε
  choice: അറിയുന്നുവല്ലോ
  rationale: രൂപത്തിൽ perfect ആയിരുന്നാലും οἶδα ഇവിടെ വർത്തമാന അർഥമായ ‘അറിയുക’ എന്നതാണ്; ‘വല്ലോ’ പങ്കുവെക്കുന്ന അറിവിനും വാദബന്ധത്തിനും ഊന്നൽ നൽകുന്നു.
- source_word: ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചന സംബോധനയുടെ രൂപം പ്രധാനപാഠത്തിൽ നിലനിർത്തുന്നു; മുഴുവൻ വിശ്വാസസമൂഹത്തെയും ഉൾക്കൊള്ളാവുന്ന പ്രയോഗമാണെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: εἴσοδον
  choice: വരവ്
  rationale: അക്ഷരാർഥമായ ‘പ്രവേശനം’ എന്നതിനെക്കാൾ ഈ സന്ദർഭത്തിലെ മിഷനറി വരവിനെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: τὴν πρὸς ὑμᾶς
  choice: നിങ്ങളുടെ അടുക്കലേക്കുള്ള
  rationale: തെസ്സലൊനീക്യരിലേക്കുള്ള ദിശ വ്യക്തമാക്കുകയും ‘നിങ്ങളുടെ ഇടയിലുള്ള’ എന്ന വ്യാഖ്യാനാത്മകമായ രൂപം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: ὅτι
  choice: എന്ന്
  rationale: അവർ അറിയുന്നതിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന ὅτι-യ്ക്ക് സ്വാഭാവികമായ മലയാള സമാനരൂപം.
- source_word: οὐ κενὴ
  choice: വ്യർഥമായിരുന്നില്ല
  rationale: κενός സൂചിപ്പിക്കാവുന്ന ഫലശൂന്യതയെയും അർഥശൂന്യതയെയും മലയാളത്തിൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; ‘ശൂന്യമായിരുന്നില്ല’ ഇവിടെ അസ്വാഭാവികമാണ്.
- source_word: γέγονεν
  choice: ആയിരുന്നില്ല
  rationale: സംഭവിച്ച വരവിന്റെ നിലനിൽക്കുന്ന സ്വഭാവത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; ‘ആയിത്തീർന്നിട്ടില്ല’ എന്ന അക്ഷരാർഥരൂപം ഈ സന്ദർഭത്തിൽ കൃത്രിമമാണ്.
theological_decisions:
- issue: സമ്മിശ്ര വിശ്വാസസമൂഹത്തെ അഭിസംബോധന ചെയ്യുന്ന ἀδελφοί എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: സഹോദരന്മാരേ
  alternative: സഹോദരീസഹോദരന്മാരേ
  rationale: മൂലത്തിലെ പുല്ലിംഗ ബഹുവചനരൂപം പ്രധാനപാഠത്തിൽ സംരക്ഷിക്കുന്നു. എന്നാൽ പൗലോസിന്റെ പ്രയോഗം സ്ത്രീകളും പുരുഷന്മാരും ഉൾപ്പെടുന്ന മുഴുവൻ വിശ്വാസസമൂഹത്തെയും അഭിസംബോധന ചെയ്യുന്നതാകാം; ആ വ്യാപ്തി അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗ്രീക്ക് വാക്യത്തിലെ ഊന്നൽ ‘നിങ്ങൾതന്നെ’ എന്നതിലൂടെയും γὰρ-ന്റെ വാദബന്ധം മലയാളത്തിലെ ‘അറിയുന്നുവല്ലോ’ എന്ന സ്വാഭാവിക പ്രയോഗത്തിലൂടെയും കൈമാറി.
