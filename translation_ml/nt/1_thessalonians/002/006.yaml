translation:
  language: ml
  text: മനുഷ്യരിൽനിന്ന് ബഹുമാനം[a] തേടിയതുമില്ല—നിങ്ങളിൽനിന്നോ മറ്റുള്ളവരിൽനിന്നോ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘മഹത്ത്വം’ അല്ലെങ്കിൽ ‘പ്രശംസ’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητοῦντες
  choice: തേടിയുമില്ല
  rationale: വർത്തമാന കൃദന്തരൂപം ചുറ്റുമുള്ള വാക്യത്തിലെ കർത്താവിനോട് ചേരുന്നു. മലയാളത്തിൽ നിഷേധത്തോടുകൂടിയ ക്രിയാരൂപം ഉപയോഗിച്ച് പ്രവർത്തിയുടെ ആശയം സ്വാഭാവികമായി അറിയിച്ചു.
- source_word: ἐξ ἀνθρώπων
  choice: മനുഷ്യരിൽനിന്നുള്ള
  rationale: ἄνθρωποι ഇവിടെ പുരുഷന്മാരെ മാത്രം സൂചിപ്പിക്കുന്നതല്ല; മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു. δόξαν എന്നതോടുള്ള ഉറവിടബന്ധം മലയാളത്തിൽ ‘മനുഷ്യരിൽനിന്നുള്ള’ എന്നു സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: δόξαν
  choice: മഹത്ത്വം
  rationale: δόξα എന്ന പൊതുവായ പുതിയനിയമ പദത്തോടുള്ള പദബന്ധം നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിൽ മനുഷ്യരിൽനിന്നു ലഭിക്കുന്ന ആദരവോ പ്രശംസയോ എന്നാണ് അർഥം.
- source_word: οὔτε ... οὔτε ... οὔτε
  choice: '...യുമില്ല—...നിന്നോ ...നിന്നോ തേടിയില്ല'
  rationale: ആദ്യ οὔτε മുൻവാക്യവുമായി ബന്ധിപ്പിക്കുന്ന നിഷേധമാണ്; തുടർന്നുള്ള രണ്ടു οὔτε ഘടകങ്ങളുടെ സമാന്തരത ‘നിന്നോ ... നിന്നോ’ എന്ന രൂപത്തിൽ നിലനിർത്തി.
- source_word: ἀφ’ ὑμῶν
  choice: നിങ്ങളിൽനിന്നോ
  rationale: തെസ്സലോനിക്യരോടുള്ള നേരിട്ടുള്ള ബഹുവചന അഭിസംബോധന കൃത്യമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: ἀπ’ ἄλλων
  choice: മറ്റുള്ളവരിൽനിന്നോ
  rationale: തെസ്സലോനിക്യരെ കൂടാതെയുള്ള മറ്റു മനുഷ്യരെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; ഈ രൂപം സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
theological_decisions:
- issue: ζητοῦντες എന്ന കൃദന്തരൂപത്തിന്റെ കാല/വാക്യബന്ധം
  choice: ചുറ്റുമുള്ള വാക്യവുമായി ചേർന്ന ഭൂതകാല നിഷേധമായി ‘തേടിയുമില്ല’
  alternative: ‘തേടുന്നവരായും അല്ല’ എന്ന കൂടുതൽ രൂപാനുസൃതമായ വിവർത്തനം
  rationale: ഗ്രീക്കിൽ കൃദന്തത്തിന്റെ കാലസൂചന പ്രധാന ക്രിയയാൽ നിശ്ചയിക്കപ്പെടുന്നു. മലയാളത്തിൽ ഒറ്റയ്ക്ക് വായിക്കുമ്പോൾ സ്വാഭാവികവും അർഥവത്തുമായിരിക്കാനാണ് ഭൂതകാലരൂപം ഉപയോഗിച്ചത്; തുടരുന്ന/പതിവായ മോഹം എന്ന അധിക വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
- issue: ζητοῦντες എന്നതിന്റെ കർത്താവ്
  choice: മുൻസന്ദർഭത്തിൽ നിന്നു മനസ്സിലാകുന്ന ‘ഞങ്ങൾ’ മലയാളത്തിലും പരോക്ഷമായി നിലനിർത്തി
  alternative: ‘ഞങ്ങൾ ... തേടിയുമില്ല’ എന്നു കർത്താവിനെ വ്യക്തമായി ചേർക്കുക
  rationale: നൽകിയ ഗ്രീക്ക് ഖണ്ഡത്തിൽ കർത്താവ് പ്രത്യക്ഷമായി ഇല്ല. അതിനാൽ ഈ വാക്യഭാഗത്തിൽ ഇല്ലാത്ത പദം ചേർക്കാതെ ഉറവിടത്തിന്റെ ആശ്രിതഘടന സംരക്ഷിച്ചു.
- issue: മനുഷ്യരിൽനിന്നുള്ള δόξαയുടെ സ്വഭാവം
  choice: ‘മഹത്ത്വം’ എന്ന മുഖ്യപദം, അടിക്കുറിപ്പിൽ ‘ആദരം’ അല്ലെങ്കിൽ ‘പ്രശംസ’
  alternative: മുഖ്യപാഠത്തിൽ ‘ആദരം’ അല്ലെങ്കിൽ ‘പ്രശംസ’
  rationale: ἐξ ἀνθρώπων ഇത് ദൈവിക മഹത്ത്വമല്ല, മനുഷ്യരുടെ അംഗീകാരമാണെന്ന് വ്യക്തമാക്കുന്നു. എന്നിരുന്നാലും δόξαയുടെ വിശാലമായ പുതിയനിയമ പദബന്ധം നിലനിർത്തുകയും സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്ക് വാക്യത്തിന്റെ മുൻസന്ദർഭാശ്രിതത്വം നിലനിർത്തിക്കൊണ്ട്, നീണ്ട ആവർത്തനം ഒഴിവാക്കാൻ ഡാഷ് ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് സൂചകം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
