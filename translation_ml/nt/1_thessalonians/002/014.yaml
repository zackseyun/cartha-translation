id: 1TH.2.14
reference: 1 Thessalonians 2:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὑμεῖς γὰρ μιμηταὶ ἐγενήθητε, ἀδελφοί, τῶν ἐκκλησιῶν τοῦ θεοῦ τῶν οὐσῶν ἐν τῇ Ἰουδαίᾳ ἐν Χριστῷ Ἰησοῦ, ὅτι τὰ αὐτὰ ἐπάθετε καὶ ὑμεῖς ὑπὸ τῶν ἰδίων συμφυλετῶν καθὼς καὶ αὐτοὶ ὑπὸ τῶν Ἰουδαίων
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/014.yaml
  text: For you became imitators[a], brothers, of the churches of God that are in Judea in Messiah Jesus, because you also suffered the same things from your own countrymen[c][b], just as they did from the Jews.
translation:
  language: ml
  text: സഹോദരങ്ങളേ, മശീഹയായ യേശുവിൽ യെഹൂദ്യയിലുള്ള ദൈവത്തിന്റെ സഭകളെ നിങ്ങൾ അനുകരിക്കുന്നവരായിത്തീർന്നു; കാരണം, അവർ യെഹൂദരിൽനിന്ന് അനുഭവിച്ച അതേ കഷ്ടങ്ങൾതന്നെ നിങ്ങളും നിങ്ങളുടെ സ്വന്തം ജനതയിൽപ്പെട്ടവരിൽനിന്ന് അനുഭവിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “യെഹൂദർ” എന്നു പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്ക് പദത്തിന് സന്ദർഭമനുസരിച്ച് “യെഹൂദ്യക്കാർ” എന്നും അർഥമുണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: μιμηταὶ ἐγενήθητε
  choice: അനുകരിക്കുന്നവരായിത്തീർന്നു
  rationale: μιμηταί എന്നതിലെ വ്യക്തമായ അനുകരണാർഥവും ἐγενήθητε എന്നതിലെ ‘ആയിത്തീർന്നു’ എന്ന ഭാവവും നിലനിർത്തുന്നു.
- source_word: ἀδελφοί
  choice: സഹോദരങ്ങളേ
  rationale: സഭയെ മുഴുവനായി അഭിസംബോധന ചെയ്യുന്ന സ്വാഭാവികവും മാന്യവുമായ മലയാള പ്രയോഗം.
- source_word: ἐκκλησιῶν τοῦ θεοῦ
  choice: ദൈവസഭകളെ
  rationale: പൗലോസിന്റെ സഭാസംബന്ധമായ പ്രയോഗത്തിന് മലയാളത്തിലെ സ്ഥിരവും സ്വാഭാവികവുമായ തത്തുല്യം.
- source_word: τῶν οὐσῶν ἐν τῇ Ἰουδαίᾳ
  choice: യെഹൂദ്യയിൽ ... ഉള്ള
  rationale: സഭകളുടെ ഭൂമിശാസ്ത്രപരമായ സ്ഥാനം നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: മശീഹയായ യേശുവിൽ
  rationale: Χριστός എന്ന പദത്തിന്റെ സ്ഥാനപ്പേരായ അർഥം സംരക്ഷിക്കുമ്പോൾ മലയാളത്തിൽ സ്വാഭാവികമായ ബന്ധം നൽകുന്നു.
- source_word: τὰ αὐτὰ ἐπάθετε
  choice: അതേ കഷ്ടങ്ങൾതന്നെ ... അനുഭവിച്ചു
  rationale: πάσχω എന്നതിലെ കഷ്ടാനുഭവവും τὰ αὐτά എന്ന ഊന്നലോടെയുള്ള താരതമ്യവും വ്യക്തമായി നൽകുന്നു.
- source_word: τῶν ἰδίων συμφυλετῶν
  choice: നിങ്ങളുടെ സ്വന്തം നാട്ടുകാരിൽനിന്ന്
  rationale: ഒരേ ജനവിഭാഗത്തിലോ ദേശസമൂഹത്തിലോപ്പെട്ടവരെ സൂചിപ്പിക്കുന്ന συμφυλέταιയും ἰδίων എന്ന ഊന്നലും സ്വാഭാവികമായി പകരുന്നു.
- source_word: τῶν Ἰουδαίων
  choice: യെഹൂദരിൽനിന്ന്
  rationale: സന്ദർഭത്തിലെ ജന-മതപരമായ അർഥം നേരിട്ട് നിലനിർത്തുന്നു; എല്ലാ യെഹൂദരെയും ഒഴിവില്ലാതെ പൊതുവത്കരിക്കുന്ന കൂട്ടിച്ചേർക്കൽ വരുത്തുന്നില്ല.
theological_decisions:
- issue: Χριστῷ എന്നത് സ്ഥാനപ്പേരായോ പേരിന്റെ സ്ഥിരഘടകമായോ പരിഭാഷപ്പെടുത്തൽ
  choice: മശീഹയായ യേശുവിൽ
  alternative: ക്രിസ്തുയേശുവിൽ
  rationale: Χριστός എന്നതിലെ ‘മശീഹ’ എന്ന അർഥം തെളിമയോടെ സംരക്ഷിക്കുന്നു; അതേസമയം ἐν Χριστῷ Ἰησοῦ എന്ന പൗലോസീയ ഐക്യപ്രയോഗം മാറ്റുന്നില്ല.
- issue: τῶν Ἰουδαίων എന്നതിന്റെ വ്യാപ്തി
  choice: യെഹൂദരിൽനിന്ന്
  alternative: യെഹൂദ്യക്കാരിൽനിന്ന്
  rationale: വാക്യം സൂചിപ്പിക്കുന്ന കഷ്ടം വരുത്തിയ പ്രത്യേക കൂട്ടത്തെ മാത്രമാണ് പരിഭാഷ സൂചിപ്പിക്കുന്നത്; എല്ലാ യെഹൂദരിലേക്കും പരാമർശം വ്യാപിപ്പിക്കുന്ന വ്യാഖ്യാനം ചേർക്കുന്നില്ല. പദത്തിന്റെ ഭൂമിശാസ്ത്രപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായിക്കാൻ എളുപ്പവുമായ ശൈലി. ഗ്രീക്ക് വാക്യക്രമം യാന്ത്രികമായി അനുകരിക്കാതെ, കാരണം-താരതമ്യബന്ധം വ്യക്തമായി നിലനിർത്താൻ മലയാളത്തിലെ സ്വാഭാവിക ക്രമം ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വാക്യത്തിന്റെ അവസാനത്തിൽ ചേർത്തിരിക്കുന്നു.
