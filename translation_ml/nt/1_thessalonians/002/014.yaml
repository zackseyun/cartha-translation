  to: സഹോദരങ്ങളേ, മശീഹയായ യേശുവിൽ യെഹൂദ്യയിലുള്ള ദൈവത്തിന്റെ സഭകളെ നിങ്ങൾ അനുകരിക്കുന്നവരായിത്തീർന്നു; കാരണം, അവർ യെഹൂദരിൽനിന്ന് അനുഭവിച്ച അതേ കഷ്ടങ്ങൾതന്നെ നിങ്ങളും നിങ്ങളുടെ സ്വന്തം ജനതയിൽപ്പെട്ടവരിൽനിന്ന് അനുഭവിച്ചു.[a]
