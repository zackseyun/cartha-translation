id: 1TH.2.15
reference: 1 Thessalonians 2:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τῶν καὶ τὸν κύριον ἀποκτεινάντων Ἰησοῦν καὶ ⸀τοὺς προφήτας καὶ ἡμᾶς ἐκδιωξάντων, καὶ θεῷ μὴ ἀρεσκόντων, καὶ πᾶσιν ἀνθρώποις ἐναντίων,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/015.yaml
  text: who also killed the Lord Jesus and the prophets[a], and drove us out, and are not pleasing to God, and are hostile to all people[c][b],
translation:
  language: ml
  text: കർത്താവായ യേശുവിനെയും പ്രവാചകന്മാരെയും കൂടി കൊന്നവരും[a], ഞങ്ങളെ പുറത്താക്കിയവരും[b], ദൈവത്തിനു പ്രസാദകരല്ലാത്തവരും, എല്ലാ മനുഷ്യരോടും ശത്രുത പുലർത്തുന്നവരുമാണ് അവർ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കർത്താവായ യേശുവിനെയും പ്രവാചകന്മാരെയും വധിച്ചവരും.”
    reason: lexical_alternative
  - marker: b
    text: ഇവിടത്തെ ക്രിയയ്ക്ക് “ഞങ്ങളെ ഓടിച്ചുകളഞ്ഞു” അഥവാ “ഞങ്ങളെ പുറത്താക്കി” എന്നാണർഥം; പൊതുവായ “പീഡിപ്പിച്ചു” എന്ന ആശയത്തെക്കാൾ സവിശേഷമാണ് ഇത്.
    reason: lexical_alternative
  - marker: c
    text: ഈ വിവരണം വ്യാകരണപരമായി മുൻവാക്യത്തിൽ തിരിച്ചറിഞ്ഞ കൂട്ടത്തെക്കുറിച്ചുതന്നെ തുടരുന്നു; എല്ലാ കാലത്തെയും എല്ലാ യഹൂദരെയും കുറിച്ചുള്ള പൊതുപ്രസ്താവനയായി ഇതിനെ വായിക്കരുത്.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκτεινάντων
  choice: കൊന്നവരും
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘കൊല്ലുക/വധിക്കുക’ എന്നത് ഉദ്ദേശ്യത്തെക്കുറിച്ചുള്ള അധിക നിഗമനം ചേർക്കാതെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὸν κύριον Ἰησοῦν
  choice: കർത്താവായ യേശുവിനെ
  rationale: κύριος എന്ന ക്രിസ്തുവിശേഷണം ‘കർത്താവ്’ എന്നു നിലനിർത്തി, മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണഘടന ഉപയോഗിക്കുന്നു.
- source_word: τοὺς προφήτας
  choice: പ്രവാചകന്മാരെ
  rationale: ദൈവത്തിന്റെ അംഗീകൃത പ്രവാചകപരമ്പരയെ സൂചിപ്പിക്കുന്ന സാധാരണ മലയാളപ്രയോഗം.
- source_word: ἐκδιωξάντων
  choice: ഞങ്ങളെ പുറത്താക്കിയവരും
  rationale: പൊതുവായ ‘പീഡിപ്പിച്ചു’ എന്നതിനെക്കാൾ, ഓടിച്ചുകളയുക അഥവാ പുറത്താക്കുക എന്ന ക്രിയയുടെ മൂർത്തവും സവിശേഷവുമായ അർഥം സംരക്ഷിക്കുന്നു.
- source_word: θεῷ μὴ ἀρεσκόντων
  choice: ദൈവത്തെ പ്രസാദിപ്പിക്കാത്തവരും
  rationale: വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ തുടർച്ചയായ വിവരണസ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: πᾶσιν ἀνθρώποις ἐναντίων
  choice: എല്ലാ മനുഷ്യരോടും ശത്രുത പുലർത്തുന്നവരും
  rationale: ἐναντίος എന്നതിലെ എതിർപ്പിന്റെയും ശത്രുതയുടെയും ശക്തി ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: τῶν ... ἀποκτεινάντων ... ἐκδιωξάντων ... ἀρεσκόντων ... ἐναντίων
  choice: കൊന്നവരും ... പുറത്താക്കിയവരും ... പ്രസാദിപ്പിക്കാത്തവരും ... ശത്രുത പുലർത്തുന്നവരുമാണ് അവർ
  rationale: മുൻവാക്യത്തിലെ കൂട്ടത്തെ തുടർന്നും വിവരിക്കുന്ന ഗ്രീക്ക് കൃദന്തശൃംഖല മലയാളത്തിലെ ‘-വരും’ ഘടനയിലൂടെ നിലനിർത്തുന്നു; അവസാനത്തെ ‘അവർ’ വാക്യം സ്വാഭാവികമായി പൂർത്തിയാക്കുന്നു.
theological_decisions:
- issue: കൃദന്തവിവരണത്തിന്റെ സൂചിതവിഭാഗം
  choice: മുൻവാക്യത്തിൽ തിരിച്ചറിഞ്ഞ കൂട്ടത്തെക്കുറിച്ചുള്ള പൗലോസിന്റെ വിവരണം ഇവിടെ തുടരുന്നതായി പരിഭാഷപ്പെടുത്തുന്നു.
  alternative: എല്ലാ കാലത്തെയും എല്ലാ യഹൂദരെയും പൊതുവായി കുറ്റപ്പെടുത്തുന്ന പ്രസ്താവനയായി വായിക്കുക.
  rationale: ഗ്രീക്ക് വ്യാകരണം 2:14-ലെ മുൻഗാമിയുമായി ഈ വാക്യത്തെ ബന്ധിപ്പിക്കുന്നു. ‘അവർ’ ആ മുൻഗാമിയിലേക്കാണ് മടങ്ങിച്ചൂണ്ടുന്നത്; കാലാതീതമായ ഒരു വംശീയ പൊതുവത്കരണം പരിഭാഷയിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. കുറ്റാരോപണങ്ങളുടെ സഞ്ചിതമായ വാക്യലയം ‘-വരും’ എന്ന സമാന്തരഘടനയിലൂടെ സംരക്ഷിച്ചിരിക്കുന്നു; അനാവശ്യ മതവിഭാഗീയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
