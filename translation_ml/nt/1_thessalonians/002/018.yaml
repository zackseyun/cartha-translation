source:
  edition: SBLGNT
  text: ⸀διότι ἠθελήσαμεν ἐλθεῖν πρὸς ὑμᾶς, ἐγὼ μὲν Παῦλος καὶ ἅπαξ καὶ δίς, καὶ ἐνέκοψεν ἡμᾶς ὁ Σατανᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/018.yaml
  text: Because we wanted to come to you—I[a], Paul, again and again—but Satan hindered us.
translation:
  language: ml
  text: കാരണം, നിങ്ങളുടെ അടുക്കൽ വരാൻ ഞങ്ങൾ ആഗ്രഹിച്ചു—പൗലോസായ ഞാൻതന്നെ, ഒന്നിലധികം പ്രാവശ്യം[a]—എന്നാൽ സാത്താൻ ഞങ്ങളെ തടസ്സപ്പെടുത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘ഒരിക്കൽയും രണ്ടിക്കൽയും’; അതായത്, ഒന്നിലധികം പ്രാവശ്യം.
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: കാരണം
  rationale: മുൻ പ്രസ്താവനയുടെ കാരണം വിശദീകരിക്കുന്ന ബന്ധം നേരിട്ടും സ്വാഭാവികമായും പ്രകടമാക്കുന്നു.
- source_word: ἠθελήσαμεν
  choice: ഞങ്ങൾ ആഗ്രഹിച്ചു
  rationale: θέλω സൂചിപ്പിക്കുന്ന ഇച്ഛയെയും ആഗ്രഹത്തെയും ആധുനിക മാനക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐλθεῖν πρὸς ὑμᾶς
  choice: നിങ്ങളുടെ അടുക്കൽ വരാൻ
  rationale: ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ചലനം നിലനിർത്തുന്നു; ‘സന്ദർശിക്കാൻ’ എന്ന അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: ἐγὼ μὲν Παῦλος
  choice: പൗലോസായ ഞാൻതന്നെ
  rationale: ബഹുവചനമായ ‘ഞങ്ങൾ’ എന്നതിൽനിന്ന് പൗലോസിനെ പ്രത്യേകം എടുത്തുകാണിക്കുന്ന ഉറവിടത്തിലെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: καὶ ἅπαξ καὶ δίς
  choice: ഒന്നിലധികം പ്രാവശ്യം
  rationale: അക്ഷരാർഥത്തിൽ ‘ഒരിക്കലും രണ്ടിക്കലും’ എന്ന പ്രയോഗത്തിന്റെ സന്ദർഭോചിത അർഥം വ്യക്തമായി നൽകുന്നു; ആവർത്തനത്തിന്റെ എണ്ണം അതിരുകടന്ന് ശക്തിപ്പെടുത്തുന്നില്ല.
- source_word: ἐνέκοψεν
  choice: തടസ്സപ്പെടുത്തി
  rationale: വഴിമുടക്കുകയോ പുരോഗതിയെ തടയുകയോ ചെയ്യുന്ന ἐγκόπτωയുടെ ഭാവം നിലനിർത്തുന്നു; പൂർണമായും അസാധ്യമാക്കി എന്നതിലേക്കു ശക്തിപ്പെടുത്തുന്നില്ല.
- source_word: ὁ Σατανᾶς
  choice: സാത്താൻ
  rationale: പുതിയനിയമ പ്രയോഗത്തിൽ പതിവായ വ്യക്തിനാമം/സ്ഥാനപ്പേര് മലയാളത്തിലെ സ്ഥാപിത രൂപത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ യാത്ര തടസ്സപ്പെട്ടതിൽ സാത്താന്റെ പ്രവർത്തകത്വം
  choice: എന്നാൽ സാത്താൻ ഞങ്ങളെ തടസ്സപ്പെടുത്തി
  alternative: എന്നാൽ എതിരാളി ഞങ്ങളെ തടഞ്ഞു
  rationale: തടസ്സം സാത്താന്റെ വ്യക്തിപരമായ പ്രവർത്തനമായി വാക്യം വ്യക്തമാക്കുന്നു. അതിനെ വെറും സാഹചര്യമായി മൃദൂകരിക്കാതെയും ‘പൂർണമായി അസാധ്യമാക്കി’ എന്ന നിർണായകത ചേർക്കാതെയും ഉറവിടത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു.
