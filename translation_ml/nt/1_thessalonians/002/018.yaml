  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. പൗലോസിനെ പ്രത്യേകം ചൂണ്ടിക്കാണിക്കുന്ന ഊന്നലും ‘ഞങ്ങൾ’ എന്ന കൂട്ടായ പരാമർശവും ഒരുമിച്ച് നിലനിർത്തിയിരിക്കുന്നു.
