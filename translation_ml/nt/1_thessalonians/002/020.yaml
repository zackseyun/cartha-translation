  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὑμεῖς γάρ ἐστε ἡ δόξα ἡμῶν καὶ ἡ χαρά.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/020.yaml
  text: For you are our glory and joy[a].
translation:
  language: ml
  text: കാരണം, നിങ്ങൾ തന്നെയാണ് ഞങ്ങളുടെ മഹിമ[a]യും സന്തോഷവും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മഹിമ’ എന്നതിന് ‘അഭിമാനവിഷയം’ അല്ലെങ്കിൽ ‘ബഹുമതി’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: നിങ്ങൾ തന്നെയാണ്
  rationale: രണ്ടാംപുരുഷ ബഹുവചന സർവനാമം ഗ്രീക്കിൽ വ്യക്തമായി നൽകിയിരിക്കുന്നത് ഊന്നലിനാണ്; മലയാളത്തിൽ ‘തന്നെയാണ്’ ചേർത്ത് ആ ഊന്നൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: γάρ
  choice: —
  rationale: γάρ മുൻവാക്യത്തിന്റെ വിശദീകരണമോ കാരണമോ സൂചിപ്പിക്കുന്നു. ഒറ്റവാക്യമായി ഉദ്ധരിക്കുമ്പോൾ ‘എന്തെന്നാൽ’ അസ്വാഭാവികമാകുന്നതിനാൽ പ്രത്യേകം വിവർത്തനം ചെയ്യാതെ പ്രസ്താവനയുടെ വിശദീകരണസ്വഭാവം നിലനിർത്തുന്നു.
- source_word: ἐστε
  choice: ആണ്
  rationale: വർത്തമാനകാല സൂചകമായ ബന്ധകക്രിയ; ‘തന്നെയാണ്’ എന്ന രൂപത്തിൽ സർവനാമത്തിന്റെ ഊന്നലോടൊപ്പം സ്വാഭാവികമായി ചേർത്തിരിക്കുന്നു.
- source_word: δόξα
  choice: മഹത്ത്വം
  rationale: δόξα എന്നതിന്റെ ‘glory/honor’ അർത്ഥവ്യാപ്തിയും വാക്യത്തിന്റെ ഗൗരവവും ‘മഹത്ത്വം’ സംരക്ഷിക്കുന്നു; ‘അഭിമാനം’ എന്നത് ഇവിടെ കൂടുതൽ വ്യാഖ്യാനാത്മകമായിരിക്കും.
- source_word: ἡμῶν
  choice: ഞങ്ങളുടെ
  rationale: ഒന്നാംപുരുഷ ബഹുവചന ഷഷ്ഠീവിഭക്തിയുടെ സ്വാഭാവികമായ ഉടമസ്ഥരൂപം.
- source_word: χαρά
  choice: സന്തോഷം
  rationale: χαρά സൂചിപ്പിക്കുന്ന joy/gladness എന്ന നാമാർഥം സാധാരണ ആധുനിക മലയാളത്തിൽ നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
theological_decisions:
- issue: വ്യക്തിബന്ധപരമായ പൗലോസ് പ്രസ്താവനയിൽ δόξαയുടെ വിവർത്തനം
  choice: മഹത്ത്വം
  alternative: അഭിമാനം; ബഹുമതി
  rationale: തെസ്സലൊനീക്യർ ശുശ്രൂഷകരുടെ മഹത്ത്വത്തിന്റെയും സന്തോഷത്തിന്റെയും ആധാരമാണെന്ന വാക്യത്തിന്റെ പ്രഭാവം ഇത് നിലനിർത്തുന്നു; സ്വയംപുകഴ്ച എന്ന ആശയം അനാവശ്യമായി ഇറക്കുമതി ചെയ്യുന്നില്ല. യഥാർഥ പദാർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ പ്രകടമായ ὑμεῖς എന്ന സർവനാമത്തിന്റെ ഊന്നൽ ‘നിങ്ങൾ തന്നെയാണ്’ എന്നതിലൂടെ പുനരാവിഷ്കരിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
