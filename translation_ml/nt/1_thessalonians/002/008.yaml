id: 1TH.2.8
reference: 1 Thessalonians 2:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὕτως ὁμειρόμενοι ὑμῶν εὐδοκοῦμεν μεταδοῦναι ὑμῖν οὐ μόνον τὸ εὐαγγέλιον τοῦ θεοῦ ἀλλὰ καὶ τὰς ἑαυτῶν ψυχάς, διότι ἀγαπητοὶ ἡμῖν ⸀ἐγενήθητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/008.yaml
  text: So[a], longing for you in this way, we were pleased to share with you not only the gospel of God but also our own lives[b], because you had become dear to us.
translation:
  language: ml
  text: അങ്ങനെ, നിങ്ങളോട് അതിയായ വാത്സല്യത്തോടെ[a], ദൈവത്തിന്റെ സുവിശേഷം മാത്രമല്ല, ഞങ്ങളുടെ സ്വന്തം ജീവൻ തന്നെയും[b] നിങ്ങൾക്കു നൽകാൻ ഞങ്ങൾ സന്തോഷപൂർവം ആഗ്രഹിച്ചു; കാരണം നിങ്ങൾ ഞങ്ങൾക്ക് പ്രിയപ്പെട്ടവരായിത്തീർന്നിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങളോട് ആഴമായ വാത്സല്യം പുലർത്തിക്കൊണ്ട്” അല്ലെങ്കിൽ “നിങ്ങൾക്കായി അതിയായി വാഞ്ഛിച്ചുകൊണ്ട്.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് കൃദ്യന്തം അപൂർവമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ഞങ്ങളുടെ സ്വന്തം ആത്മാക്കൾ” അല്ലെങ്കിൽ “ഞങ്ങളെത്തന്നെ.” ഇവിടെ ഉദ്ദേശിക്കുന്നത് അവർ വ്യക്തിപരമായും ത്യാഗപൂർവമായും തങ്ങളെത്തന്നെ നൽകാൻ സന്നദ്ധരായിരുന്നു എന്നതാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: ഇങ്ങനെ
  rationale: മുൻവാക്യത്തിലെ പോറ്റിവളർത്തുന്ന അമ്മയുടെ കരുതലിനോടു ബന്ധിപ്പിക്കുന്ന രീതിസൂചകമായ അർഥം സംക്ഷിപ്തമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: ὁμειρόμενοι ὑμῶν
  choice: നിങ്ങളോടുള്ള ആഴമായ സ്നേഹവാഞ്ഛയാൽ
  rationale: അപൂർവമായ ഈ കൃുദന്തം ശക്തമായ വാത്സല്യവും അഭിലാഷവും സൂചിപ്പിക്കുന്നു. കൃുദന്തത്തിന്റെ മുഖ്യക്രിയയോടുള്ള ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ കാരണാർഥം ഉപയോഗിച്ചു; അപൂർവ പദത്തിന്റെ സാധ്യമായ മറ്റു ഊന്നലുകൾ അടിക്കുറിപ്പിൽ നൽകി.
- source_word: εὐδοκοῦμεν
  choice: ഞങ്ങൾ സന്തോഷിച്ചു
  rationale: വെറും സമ്മതമല്ല, മനസ്സോടെയും ആനന്ദത്തോടെയും ചെയ്ത സന്നദ്ധതയാണ് ക്രിയ സൂചിപ്പിക്കുന്നത്.
- source_word: μεταδοῦναι
  choice: പങ്കുവെക്കുന്നതിൽ
  rationale: സ്വന്തമായ ഒന്നിൽ മറ്റുള്ളവർക്കും പങ്കുനൽകുക എന്ന ഭാവം സുവിശേഷത്തിനും സ്വന്തം ജീവനും ഒരുപോലെ ചേരുന്ന രീതിയിൽ നൽകുന്നു.
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ സുവിശേഷം
  rationale: പൗലോസിന്റെ പ്രയോഗത്തോട് ചേർന്നുനിൽക്കുന്ന സ്ഥാപിതവും പൊതുവേ മനസ്സിലാകുന്നതുമായ ക്രൈസ്തവ പദാവലി ഉപയോഗിക്കുകയും ജനിറ്റീവ് ബന്ധം നേരിട്ട് നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: τὰς ἑαυτῶν ψυχάς
  choice: ഞങ്ങളുടെ സ്വന്തം ജീവൻതന്നെയും
  rationale: ഇവിടെ ψυχή അമൂർത്തമായ ആത്മാവിനെ മാത്രം സൂചിപ്പിക്കുന്നതല്ല, വ്യക്തിയുടെ ജീവൻ/സ്വയം എന്ന സമഗ്രമായ അർഥത്തിലാണ്. ἑαυτῶν എന്ന ഊന്നൽ ‘സ്വന്തം’ എന്നും, വാക്യത്തിലെ ശക്തി ‘തന്നെയും’ എന്നും നിലനിർത്തുന്നു.
- source_word: διότι
  choice: കാരണം
  rationale: അവരുടെ സ്വയംനൽകലിന്റെ കാരണം വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἀγαπητοὶ ἡμῖν ἐγενήθητε
  choice: നിങ്ങൾ ഞങ്ങൾക്ക് പ്രിയപ്പെട്ടവരായിത്തീർന്നിരുന്നു
  rationale: γίνομαι സൂചിപ്പിക്കുന്ന നിലയിലേക്കുള്ള വരവും ἀγαπητοί എന്നതിലെ ബന്ധപരമായ വാത്സല്യവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ψυχάς എന്ന പദത്തിന്റെ അർഥം
  choice: ‘ജീവൻ’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: ‘ആത്മാക്കൾ’ അല്ലെങ്കിൽ ‘ഞങ്ങളെത്തന്നെ’
  rationale: സന്ദർഭം ശരീരവും ആത്മാവും വേർതിരിക്കുന്ന മനുഷ്യസ്വഭാവശാസ്ത്ര പ്രസ്താവനയല്ല; സ്നേഹപൂർവവും ത്യാഗപരവുമായ അപ്പൊസ്തലിക സ്വയംനൽകലാണ്. ‘ജീവൻ’ അതിന്റെ മൂർത്തമായ ശക്തി നൽകുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- issue: ἀγαπητοὶ എന്നതിന്റെ ബന്ധപരമായ ശക്തി
  choice: ‘ഞങ്ങൾക്ക് പ്രിയപ്പെട്ടവർ’
  alternative: ‘ഞങ്ങളാൽ സ്നേഹിക്കപ്പെട്ടവർ’
  rationale: വാക്യത്തിലെ വ്യക്തിപരമായ വാത്സല്യം സ്വാഭാവികമായി നൽകുന്നു; മൂലത്തിൽ മുൻനിരയിൽ ഇല്ലാത്ത പ്രത്യേക ഉടമ്പടി-സാങ്കേതിക അർഥം ചേർക്കുന്നില്ല.
- issue: ὁμειρόμενοι എന്ന കൃുദന്തത്തിന്റെ വാക്യബന്ധം
  choice: കാരണാർഥമായി ‘സ്നേഹവാഞ്ഛയാൽ’
  alternative: രീതിസൂചകമായി ‘ഇങ്ങനെ നിങ്ങളെ വാഞ്ഛിച്ചുകൊണ്ട്’
  rationale: ഗ്രീക്കിൽ ബന്ധം ചില അളവിൽ തുറന്നതാണ്. മലയാളത്തിലെ കാരണാർഥ പ്രയോഗം വാത്സല്യമാണ് പങ്കുവെക്കലിനെ പ്രേരിപ്പിച്ചതെന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; പര്യായ നിഴലുകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധം ഗൗരവവും പൗലോസിന്റെ വാത്സല്യവും നിലനിർത്തി. ‘സ്നേഹവാഞ്ഛ’ അല്പം ഉയർന്ന ശൈലിയിലുള്ളതാണെങ്കിലും അപൂർവമായ ഗ്രീക്ക് പദത്തിന്റെ ശക്തമായ വാത്സല്യവും അഭിലാഷവും ഒരുമിച്ചു വഹിക്കുന്നു. രണ്ട് അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടുണ്ട്.
