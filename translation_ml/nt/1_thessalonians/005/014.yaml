id: 1TH.5.14
reference: 1 Thessalonians 5:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: παρακαλοῦμεν δὲ ὑμᾶς, ἀδελφοί, νουθετεῖτε τοὺς ἀτάκτους, παραμυθεῖσθε τοὺς ὀλιγοψύχους, ἀντέχεσθε τῶν ἀσθενῶν, μακροθυμεῖτε πρὸς πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/014.yaml
  text: And we urge you[a], brothers, admonish the disorderly, encourage the fainthearted, help the weak[d][c][b], be patient with everyone.
translation:
  language: ml
  text: 'സഹോദരന്മാരേ[a], ഞങ്ങൾ നിങ്ങളോട് അഭ്യർഥിക്കുന്നു: ക്രമം തെറ്റി നടക്കുന്നവരെ[b] ഉപദേശിച്ചു തിരുത്തുക; മനസ്സുതളർന്നവരെ ധൈര്യപ്പെടുത്തുക[c]; ബലഹീനരെ താങ്ങുക[d]; എല്ലാവരോടും ക്ഷമയോടിരിക്കുക.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സഹോദരീസഹോദരന്മാരേ’; പൗലോസ് സഭ മുഴുവനെയുമാണ് അഭിസംബോധന ചെയ്യുന്നത്.
    reason: alternative_reading
  - marker: b
    text: ‘ക്രമം തെറ്റി നടക്കുന്നവർ’ എന്നതിന് ‘അച്ചടക്കമില്ലാത്തവർ’, ‘അനുസരണകെട്ടവർ’, അല്ലെങ്കിൽ സന്ദർഭാനുസരണം ‘അലസർ’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘നിരുത്സാഹപ്പെട്ടവരെ ആശ്വസിപ്പിക്കുക.’
    reason: lexical_alternative
  - marker: d
    text: അഥവാ, ‘ബലഹീനർക്കു പിന്തുണ നൽകുക.’
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλοῦμεν
  choice: ഞങ്ങൾ നിങ്ങളോട് അഭ്യർഥിക്കുന്നു
  rationale: ആത്മാർഥമായ അപ്പൊസ്തലിക ആഹ്വാനത്തിന്റെ ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δέ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: ഇവിടെ δέ ശക്തമായ വൈരുധ്യമല്ല, ആശയത്തിന്റെ തുടർച്ചയെയോ മാറ്റത്തെയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ വാക്യക്രമവും ദ്വിബിന്ദുവും ആ ബന്ധം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: ഗ്രീക്ക് പുല്ലിംഗ ബഹുവചന സംബോധനയുടെ രൂപം നിലനിർത്തുന്നു; സഭ മുഴുവനുമാണ് അഭിസംബോധിതരെന്ന ഉൾക്കൊള്ളുന്ന അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: νουθετεῖτε
  choice: ഉപദേശിച്ചു തിരുത്തുക
  rationale: വെറും ശാസനയല്ല, മാറ്റം ലക്ഷ്യമാക്കുന്ന തിരുത്തൽപരമായ ഉപദേശവും മുന്നറിയിപ്പും ഉൾപ്പെടുന്ന അർഥം പ്രകടമാക്കുന്നു.
- source_word: ἀτάκτους
  choice: ക്രമം തെറ്റി നടക്കുന്നവരെ
  rationale: ക്രമത്തിനു പുറത്തായിരിക്കുക, അച്ചടക്കമില്ലാതെ നടക്കുക എന്നീ വിശാലമായ അർഥപരിധി നിലനിർത്തുന്നു; മടിയന്മാർ എന്നു മാത്രം പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: παραμυθεῖσθε
  choice: ധൈര്യപ്പെടുത്തുക
  rationale: ദയയോടെ സംസാരിച്ച് ആശ്വാസവും ആത്മവിശ്വാസവും നൽകുക എന്ന സന്ദർഭോചിതമായ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: ὀλιγοψύχους
  choice: മനസ്സുതളർന്നവരെ
  rationale: ധൈര്യം കുറഞ്ഞവരെയോ നിരുത്സാഹപ്പെട്ടവരെയോ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀντέχεσθε
  choice: താങ്ങുക
  rationale: ഒരാളോടു ചേർന്നുനിന്ന് പിന്തുണയ്ക്കുകയും സഹായിക്കുകയും ചെയ്യുക എന്ന ശക്തമായ ബന്ധപരമായ അർഥം നിലനിർത്തുന്നു.
- source_word: τῶν ἀσθενῶν
  choice: ബലഹീനരെ
  rationale: ശാരീരികമോ ധാർമികമോ സാമൂഹികമോ ആയ ദൗർബല്യം എന്ന് പ്രത്യേകിച്ച് പരിമിതപ്പെടുത്താതെ മൂലപദത്തിന്റെ വിശാലത സംരക്ഷിക്കുന്നു.
- source_word: μακροθυμεῖτε
  choice: ക്ഷമയോടിരിക്കുക
  rationale: ആളുകളോടുള്ള ദീർഘക്ഷമയും പ്രകോപനത്തെ സഹിക്കുന്ന മനോഭാവവും വ്യക്തമായ ആധുനിക മലയാളത്തിൽ പറയുന്നു.
- source_word: πρὸς πάντας
  choice: എല്ലാവരോടും
  rationale: കല്പനയുടെ സാർവത്രിക വ്യാപ്തിയും ആളുകളോടുള്ള സമീപനവും സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: സഭാസംബോധനയായ ἀδελφοί എന്ന പദത്തിന്റെ ഉൾക്കൊള്ളുന്ന പ്രയോഗം
  choice: മുഖ്യപാഠത്തിൽ ‘സഹോദരന്മാരേ’ എന്ന് നൽകി, സ്ത്രീകളും ഉൾപ്പെടുന്ന സഭ മുഴുവനാണ് ഉദ്ദേശ്യമെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുക.
  alternative: ‘സഹോദരീസഹോദരന്മാരേ’
  rationale: മൂലത്തിലെ പുല്ലിംഗ ബഹുവചനരൂപം മറയ്ക്കാതെ സൂക്ഷിക്കുകയും അതേസമയം ചരിത്രസന്ദർഭത്തിലെ മിശ്രലിംഗ സഭാസമൂഹത്തെക്കുറിച്ചുള്ള ഉൾക്കൊള്ളുന്ന അർഥം വായനക്കാരനു വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- issue: ἀσθενῶν സൂചിപ്പിക്കുന്ന ബലഹീനതയുടെ സ്വഭാവം
  choice: ‘ബലഹീനർ’ എന്ന വിശാല പ്രയോഗം നിലനിർത്തുക.
  alternative: ‘രോഗികൾ’, ‘വിശ്വാസത്തിൽ ബലഹീനർ’, അല്ലെങ്കിൽ ‘ശക്തിയില്ലാത്തവർ’
  rationale: സന്ദർഭം ബലഹീനത ശാരീരികമോ ആത്മീയമോ സാമൂഹികമോ എന്ന് തീർച്ചപ്പെടുത്തുന്നില്ല; അതിനാൽ ദൈവശാസ്ത്രപരമായി ഒരു വിഭാഗത്തിലേക്ക് ചുരുക്കാതെ യഥാർഥ അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ആദരവോടെയും ലാളിത്യത്തോടെയും ഉള്ള മലയാളം. കല്പനകളുടെ നിര വ്യക്തമായി കേൾക്കാൻ ദ്വിബിന്ദുവും അർധവിരാമങ്ങളും ഉപയോഗിച്ചു. പഴയ സഭാഭാഷയിലെ അപരിചിത പദങ്ങൾ ഒഴിവാക്കി; എന്നാൽ പാഠത്തിന്റെ ഗൗരവവും ഇടയപരമായ ഭാവവും നിലനിർത്തി.
