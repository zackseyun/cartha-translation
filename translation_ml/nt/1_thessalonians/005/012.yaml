id: 1TH.5.12
reference: 1 Thessalonians 5:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐρωτῶμεν δὲ ὑμᾶς, ἀδελφοί, εἰδέναι τοὺς κοπιῶντας ἐν ὑμῖν καὶ προϊσταμένους ὑμῶν ἐν κυρίῳ καὶ νουθετοῦντας ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/012.yaml
  text: We ask you[a], brothers, to acknowledge those who labor among you and lead you in the Lord and admonish you[c][b],
translation:
  language: ml
  text: സഹോദരന്മാരേ[a], നിങ്ങളുടെ ഇടയിൽ കഠിനമായി അധ്വാനിക്കുകയും കർത്താവിൽ നിങ്ങളെ നയിക്കുകയും[c] നിങ്ങളെ തിരുത്തി ഉപദേശിക്കുകയും ചെയ്യുന്നവരെ തിരിച്ചറിയണമെന്ന്[b] ഞങ്ങൾ നിങ്ങളോട് അപേക്ഷിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സഹോദരീസഹോദരന്മാരേ’ എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്കിൽ ‘സഹോദരന്മാരേ’ എന്നാണ്, എന്നാൽ ഇവിടെ അത് സഭയോടുള്ള അഭിസംബോധനയായി ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘അറിയുക’ അല്ലെങ്കിൽ ‘ആദരിക്കുക’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: അല്ലെങ്കിൽ, ‘കർത്താവിൽ നിങ്ങളുടെ മേൽനോട്ടം വഹിക്കുന്നവരെ.’
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐρωτῶμεν
  choice: ഞങ്ങൾ നിങ്ങളോട് അപേക്ഷിക്കുന്നു
  rationale: ἐρωτάω ഇവിടെ ഒരു ആജ്ഞയല്ല, സൗമ്യമായ ഒരു അഭ്യർഥനയാണ്. ‘അപേക്ഷിക്കുന്നു’ ആ ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: δέ ഇവിടെ ശക്തമായ വിരോധമല്ല, നേരിയ ആശയമാറ്റമാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ വാക്യത്തിന്റെ സ്വാഭാവിക തുടക്കംകൊണ്ട് ആ മാറ്റം വ്യക്തമാകുന്നതിനാൽ ‘എന്നാൽ’ എന്ന ശക്തമായ ബന്ധകം ചേർത്തിട്ടില്ല.
- source_word: ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചന അഭിസംബോധന നേരിട്ട് നിലനിർത്തുന്നു; ഇത് സഭ മുഴുവനെയും ഉൾക്കൊള്ളുന്ന അഭിസംബോധനയാകാമെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: εἰδέναι
  choice: അംഗീകരിക്കുക
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥം ‘അറിയുക’ എന്നാണെങ്കിലും ഇവിടെ സേവിക്കുന്നവരെ തിരിച്ചറിഞ്ഞ് അവർക്കുള്ള സ്ഥാനം മാനിക്കുന്ന ബന്ധപരമായ അർഥമാണ്. ‘അംഗീകരിക്കുക’ അതിനെ അനാവശ്യമായി അനുസരണയോ വണക്കമോ ആക്കാതെ അറിയിക്കുന്നു.
- source_word: κοπιῶντας
  choice: കഠിനമായി അധ്വാനിക്കുന്നവർ
  rationale: κοπιάω കഠിനവും ക്ഷീണകരവുമായ പ്രയത്‌നത്തെ സൂചിപ്പിക്കുന്നു; ‘കഠിനമായി അധ്വാനിക്കുക’ ആ ഊന്നൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ἐν ὑμῖν
  choice: നിങ്ങളുടെ ഇടയിൽ
  rationale: സഭാസമൂഹത്തിനകത്തെ അവരുടെ പ്രവർത്തനത്തെ സ്വാഭാവികവും നേരിട്ടുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: προϊσταμένους
  choice: നിങ്ങളെ നയിക്കുന്നവർ
  rationale: προΐστημι നേതൃത്വം, മേൽനോട്ടം, കരുതലോടെയുള്ള ചുമതല എന്നിവ സൂചിപ്പിക്കാം. ‘നയിക്കുക’ അധികാരവും സേവനപരമായ ഉത്തരവാദിത്വവും തമ്മിലുള്ള തുറന്ന അർഥപരിധി നിലനിർത്തുന്നു.
- source_word: ἐν κυρίῳ
  choice: കർത്താവിൽ
  rationale: അവരുടെ നേതൃത്വം കർത്താവുമായുള്ള ബന്ധത്തിൽ നിർവഹിക്കപ്പെടുന്നതാണെന്ന് ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ദൈവശാസ്ത്രപരമായ തുറന്നതോടുകൂടെ നിലനിർത്തുന്നു.
- source_word: νουθετοῦντας
  choice: തിരുത്തി ഉപദേശിക്കുന്നവർ
  rationale: νουθετέω വെറും പൊതുവായ പഠിപ്പിക്കൽ മാത്രമല്ല, തെറ്റിൽനിന്ന് തിരിക്കുന്ന മുന്നറിയിപ്പോ തിരുത്തലോടെയുള്ള ഉപദേശമോ ഉൾക്കൊള്ളുന്നു. ഈ രണ്ടു വശങ്ങളും ‘തിരുത്തി ഉപദേശിക്കുക’ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ἀδελφοί എന്ന സഭാ അഭിസംബോധനയുടെ വ്യാപ്തി
  choice: പ്രധാനപാഠത്തിൽ ‘സഹോദരന്മാരേ’
  alternative: ‘സഹോദരീസഹോദരന്മാരേ’
  rationale: മൂലത്തിലെ പുല്ലിംഗ രൂപം പ്രധാനപാഠത്തിൽ നിലനിർത്തുന്നു; എന്നാൽ അഭിസംബോധന സഭയിലെ സ്ത്രീകളെയും പുരുഷന്മാരെയും ഉൾക്കൊള്ളാമെന്ന സാന്ദർഭിക അർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: സഭയിൽ അധ്വാനിക്കുന്നവരോടുള്ള εἰδέναι എന്ന ക്രിയയുടെ ഭാവം
  choice: അംഗീകരിക്കുക
  alternative: അറിയുക; ആദരിക്കുക; തിരിച്ചറിയുക
  rationale: ഇത് അവരെ തിരിച്ചറിഞ്ഞ് വിലമതിക്കാനുള്ള ആഹ്വാനമാണ്; എന്നാൽ ഗ്രീക്ക് ഇവിടെ അനുസരിക്കണമെന്നോ പ്രത്യേക വണക്കം നൽകണമെന്നോ വ്യക്തമായി പറയുന്നില്ല.
- issue: προϊσταμένους ὑμῶν ἐν κυρίῳ എന്ന പ്രയോഗത്തിലെ നേതൃത്വത്തിന്റെ സ്വഭാവം
  choice: കർത്താവിൽ നിങ്ങളെ നയിക്കുന്നവർ
  alternative: കർത്താവിൽ നിങ്ങളുടെ മേൽനോട്ടം വഹിക്കുന്നവർ
  rationale: പങ്കാളിത്തം നേതൃത്വം, മേൽനോട്ടം, കരുതൽ എന്നിവ ഉൾക്കൊള്ളാൻ കഴിയും. ‘നയിക്കുക’ അംഗീകൃത ഉത്തരവാദിത്വം പ്രകടിപ്പിക്കുമ്പോഴും ഒരു പ്രത്യേക സഭാഭരണരീതി പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല; കൂടുതൽ അക്ഷരാർഥപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സഭാ അഭിസംബോധനയാണ് ഉപയോഗിച്ചിരിക്കുന്നത്. ഗ്രീക്കിലെ നീണ്ട പങ്കാളിത്തഘടന മലയാളത്തിൽ വായിക്കാൻ എളുപ്പമുള്ള സമാന്തര ക്രിയകളായി നിലനിർത്തി. ‘എന്നാൽ’ പോലുള്ള ശക്തമായ വിരോധബന്ധകം ഒഴിവാക്കി, δέ സൂചിപ്പിക്കുന്ന നേരിയ ആശയമാറ്റം വാക്യക്രമത്തിലൂടെ പ്രകടമാക്കി.
