id: 1TH.5.2
reference: 1 Thessalonians 5:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: αὐτοὶ γὰρ ἀκριβῶς οἴδατε ⸀ὅτι ἡμέρα κυρίου ὡς κλέπτης ἐν νυκτὶ οὕτως ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/002.yaml
  text: For you yourselves know very well that the day of the Lord comes like a thief in the night.
translation:
  language: ml
  text: കാരണം, കർത്താവിന്റെ ദിവസം രാത്രിയിൽ കള്ളൻ വരുന്നതുപോലെ വരുമെന്ന് നിങ്ങൾതന്നെ കൃത്യമായി അറിയുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτοὶ
  choice: നിങ്ങൾതന്നെ
  rationale: ക്രിയയിൽ ഇതിനകം സൂചിപ്പിച്ചിരിക്കുന്ന രണ്ടാംപുരുഷ കർത്താവിന് ഊന്നൽ നൽകുന്ന സർവനാമം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തിന് വിശദീകരണമോ കാരണമോ നൽകുന്ന ബന്ധകത്തിന്റെ അർഥം നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀκριβῶς
  choice: വളരെ നന്നായി
  rationale: οἴδατε എന്ന അറിവുസൂചക ക്രിയയോടൊപ്പം കൃത്യവും ഉറപ്പുള്ളതുമായ അറിവിനെ സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: οἴδατε
  choice: അറിയുന്നുവല്ലോ
  rationale: ‘അറിയുക’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; ‘-വല്ലോ’ വായനക്കാർക്ക് ഇക്കാര്യം ഇതിനകം അറിയാമെന്ന പൗലോസിന്റെ ഓർമ്മിപ്പിക്കൽഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἡμέρα κυρίου
  choice: കർത്താവിന്റെ ദിവസം
  rationale: ആഴ്ചയിലെ ആരാധനാദിനമല്ല, ദൈവിക ഇടപെടലുമായി ബന്ധപ്പെട്ട സ്ഥാപിതമായ അന്ത്യകാല പ്രയോഗമാണിത്.
- source_word: ὡς κλέπτης ἐν νυκτί
  choice: രാത്രിയിലെ കള്ളനെപ്പോലെ
  rationale: അപ്രതീക്ഷിതമായ വരവിനെ സൂചിപ്പിക്കുന്ന ഉപമ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: οὕτως ἔρχεται
  choice: വരും
  rationale: ഭാവിസൂചനയുള്ള ഗ്രീക്ക് വർത്തമാനകാലത്തിന്റെ അർഥം മലയാളത്തിലെ സ്വാഭാവിക ഭാവികാലത്തിൽ നൽകുന്നു; οὕτως-ന്റെ രീതിസൂചന ഉപമയോട് ചേർന്ന ‘-പ്പോലെ’യിൽ പ്രകടമാണ്.
theological_decisions:
- issue: ἡμέρα κυρίου എന്ന അന്ത്യകാല പ്രയോഗം
  choice: കർത്താവിന്റെ ദിവസം
  alternative: കർത്താവിന്റെ ദിനം / കർത്താവിനുള്ള ദിവസം
  rationale: സന്ദർഭം ആഴ്ചയിലെ ആരാധനാദിനത്തെക്കുറിച്ചല്ല, കർത്താവിന്റെ നിർണായകമായ അന്ത്യകാല വരവിനെയും ഇടപെടലിനെയും കുറിച്ചാണ്; സ്ഥാപിതമായ പ്രവാചകപ്രയോഗം അതേപടി നിലനിർത്തുന്നു.
- issue: ‘രാത്രിയിലെ കള്ളനെപ്പോലെ’ എന്ന ഉപമയുടെ വ്യാപ്തി
  choice: അപ്രതീക്ഷിത വരവിനെ സൂചിപ്പിക്കുന്ന ഉപമയായി മാത്രം നിലനിർത്തി
  alternative: രഹസ്യമായ വരവ് എന്ന ആശയം വിശദീകരണമായി ചേർക്കുക
  rationale: മൂലവാക്യം കള്ളന്റെ ഉപമ നൽകുന്നുവെങ്കിലും പ്രത്യേക അന്ത്യകാലക്രമമോ ‘രഹസ്യ’ വരവോ വ്യക്തമാക്കുന്നില്ല; അതിനാൽ അധിക സിദ്ധാന്തവിശദാംശം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം തിരുവെഴുത്തിന് യോജിച്ച മാന്യവുമായ ശൈലി. ‘ദിവസം’ സാധാരണവും സുതാര്യവുമാണ്; ‘നിങ്ങൾതന്നെ’ എന്നത് മൂലത്തിലെ ഊന്നൽ കാത്തുസൂക്ഷിക്കുന്നു.
