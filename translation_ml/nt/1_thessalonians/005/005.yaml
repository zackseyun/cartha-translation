source:
  edition: SBLGNT
  text: πάντες ⸀γὰρ ὑμεῖς υἱοὶ φωτός ἐστε καὶ υἱοὶ ἡμέρας. οὐκ ἐσμὲν νυκτὸς οὐδὲ σκότους·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/005.yaml
  text: For you are all sons of light and sons of day[a]. We are not of night or of darkness.
translation:
  language: ml
  text: എന്തെന്നാൽ, നിങ്ങൾ എല്ലാവരും വെളിച്ചത്തിന്റെ പുത്രന്മാരും പകലിന്റെ പുത്രന്മാരുമാകുന്നു.[a] നാം രാത്രിയുടേതോ ഇരുട്ടിന്റേതോ അല്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വെളിച്ചത്തിന്റെ മക്കളും പകലിന്റെ മക്കളും.” ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “പുത്രന്മാർ” എന്നാണ്; വെളിച്ചത്തിന്റെയും പകലിന്റെയും സ്വഭാവമുള്ളവരെയോ അവയോടു ചേർന്നവരെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: എല്ലാവരും
  rationale: ὑμεῖς എന്ന സർവനാമത്തോടൊപ്പം ചേർത്ത് അഭിസംബോധിതരായ എല്ലാവരെയും ഉൾക്കൊള്ളുന്ന ഊന്നൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: γάρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ ആശയത്തിന് വിശദീകരണമോ കാരണമോ നൽകുന്ന ബന്ധകത്തിന്റെ ശക്തി വ്യക്തമാക്കുന്നു.
- source_word: υἱοὶ
  choice: പുത്രന്മാർ
  rationale: ഗ്രീക്കിലെ പുരുഷലിംഗ ബഹുവചനരൂപം നിലനിർത്തുകയും, എന്തിനാൽ സ്വഭാവനിർണ്ണയം ചെയ്യപ്പെടുന്നു അല്ലെങ്കിൽ എന്തിനോടു ചേർന്നവരാണ് എന്ന സെമിറ്റിക് സ്വഭാവമുള്ള പ്രയോഗം സംരക്ഷിക്കുകയും ചെയ്യുന്നു; ഉൾക്കൊള്ളുന്ന അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: φωτός
  choice: വെളിച്ചത്തിന്റെ
  rationale: വെളിച്ചത്തോടുള്ള ബന്ധവും സ്വഭാവസാദൃശ്യവും സൂചിപ്പിക്കുന്ന ഷഷ്ഠീവിഭക്തി രൂപം നിലനിർത്തി ഇരുട്ടുമായുള്ള രൂപകവിരോധം സംരക്ഷിക്കുന്നു.
- source_word: ἡμέρας
  choice: പകലിന്റെ
  rationale: വെളിച്ചം–പകൽ, രാത്രി–ഇരുട്ട് എന്നീ സമാന്തര രൂപകജോടികൾ മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: οὐκ ἐσμὲν
  choice: നാം ... അല്ല
  rationale: ‘നിങ്ങൾ’ എന്ന രണ്ടാംപുരുഷത്തിൽനിന്ന് ‘നാം’ എന്ന ഒന്നാംപുരുഷ ബഹുവചനത്തിലേക്കുള്ള മൂലപാഠത്തിലെ മാറ്റം തിരുത്താതെ സംരക്ഷിക്കുന്നു.
- source_word: νυκτός
  choice: രാത്രിയുടേതോ
  rationale: രാത്രിയുടെ മേഖലയിലോ അതിനോടുള്ള ചേർച്ചയിലോ ഉള്ളവരല്ല എന്ന ഷഷ്ഠീവിഭക്തിയുടെ ബന്ധാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: σκότους
  choice: ഇരുട്ടിന്റേതോ
  rationale: രാത്രിയോടു സമാന്തരമായി ഇരുട്ടിനോടുള്ള ചേർച്ച നിഷേധിക്കുകയും വെളിച്ചത്തോടുള്ള ധാർമ്മിക-ആത്മീയ വിരോധം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: υἱοὶ φωτός / υἱοὶ ἡμέρας എന്ന ലിംഗസൂചക കുടുംബരൂപകം
  choice: വെളിച്ചത്തിന്റെ പുത്രന്മാരും പകലിന്റെ പുത്രന്മാരും
  alternative: വെളിച്ചത്തിന്റെ മക്കളും പകലിന്റെ മക്കളും
  rationale: മൂലപാഠത്തിലെ υἱοί എന്ന ‘പുത്രന്മാർ’ എന്ന രൂപം പ്രധാനപാഠത്തിൽ സംരക്ഷിക്കുന്നു. എന്നാൽ ഈ പ്രയോഗം പുരുഷന്മാരെ മാത്രം പരിമിതപ്പെടുത്തുന്നതല്ലെന്നും വെളിച്ചവും പകലുംകൊണ്ട് സ്വഭാവനിർണ്ണയം ചെയ്യപ്പെടുന്ന എല്ലാവരെയും സൂചിപ്പിക്കുന്നുവെന്നും അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- issue: രണ്ടാംപുരുഷത്തിൽനിന്ന് ഒന്നാംപുരുഷ ബഹുവചനത്തിലേക്കുള്ള മാറ്റം
  choice: നിങ്ങൾ എല്ലാവരും ... നാം ... അല്ല
  alternative: നിങ്ങൾ എല്ലാവരും ... നിങ്ങൾ ... അല്ല
  rationale: പൗലൊസും സഹപ്രവർത്തകരും തെസ്സലൊനീക്യ വിശ്വാസികളോടൊപ്പം സ്വയം ഉൾപ്പെടുന്നതായി കാണാവുന്ന മൂലപാഠത്തിലെ വാക്ചാതുര്യപരമായ മാറ്റം അതേപടി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘എന്തെന്നാൽ’ വിശദീകരണബന്ധം വ്യക്തമാക്കുന്നു; ‘പുത്രന്മാർ’ മൂലരൂപം സംരക്ഷിക്കുമ്പോൾ അടിക്കുറിപ്പ് അതിന്റെ ഉൾക്കൊള്ളുന്ന പ്രയോഗാർഥം നൽകുന്നു. ‘നിങ്ങൾ’ മുതൽ ‘നാം’ വരെയുള്ള വ്യക്തിമാറ്റം മനപ്പൂർവം നിലനിർത്തിയിരിക്കുന്നു.
