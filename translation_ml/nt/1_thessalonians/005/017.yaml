  text: ἀδιαλείπτως προσεύχεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/017.yaml
  text: Pray without ceasing[a].
translation:
  language: ml
  text: ഇടവിടാതെ പ്രാർഥിക്കുവിൻ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘തുടർച്ചയായി പ്രാർഥിക്കുവിൻ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδιαλείπτως
  choice: ഇടവിടാതെ
  rationale: തുടർച്ചയായും സ്ഥിരമായും നിലനിൽക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന ക്രിയാവിശേഷണത്തിന്റെ ശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; ഓരോ നിമിഷവും വാചികമായി പ്രാർഥിക്കണമെന്ന അതിവാച്യ അർഥം നിർബന്ധിക്കുന്നില്ല.
- source_word: προσεύχεσθε
  choice: പ്രാർഥിക്കുവിൻ
  rationale: രണ്ടാം പുരുഷ ബഹുവചന വർത്തമാനകാല ആജ്ഞയുടെ സമൂഹത്തോടുള്ള പ്രബോധനസ്വഭാവവും തുടരുന്ന പ്രവൃത്തിയുടെ ഭാവവും മാന്യവും വ്യക്തവുമായ മലയാളത്തിൽ നൽകുന്നു; ദൈർഘ്യഭാവം ‘ഇടവിടാതെ’ എന്ന പദം ഇതിനകം പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: കല്പനയുടെ പ്രായോഗിക വ്യാപ്തി
  choice: സ്ഥിരതയോടെയും തുടർച്ചയായ മനോഭാവത്തോടെയും പ്രാർഥിക്കാനുള്ള പൊതുവായ പ്രബോധനമായി വിവർത്തനം നിലനിർത്തുന്നു.
  alternative: ഓരോ നിമിഷവും നിർത്താതെ വാചികമായി പ്രാർഥിക്കണമെന്ന അക്ഷരാർഥ വ്യാഖ്യാനം.
  rationale: വർത്തമാനകാല ആജ്ഞയും ἀδιαλείπτως എന്ന ക്രിയാവിശേഷണവും പ്രാർഥനയിലെ നിരന്തരമായ സ്ഥിരോത്സാഹത്തെ ഊന്നുന്നു. വിവർത്തനം ഈ ശക്തി സംരക്ഷിക്കുമ്പോൾ പ്രത്യേക സന്ന്യാസപരമോ വിഭാഗീയമോ ആയ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും മാന്യവും ആരാധനാപരവുമായ ശൈലി. ‘പ്രാർഥിക്കുവിൻ’ സമൂഹത്തോടുള്ള ബഹുവചന ആജ്ഞ വ്യക്തമാക്കുന്നു; ‘ഇടവിടാതെ’ മൂലപദത്തിന്റെ ശക്തിയും അതിലെ സ്വാഭാവിക വ്യാപ്തിയും കാത്തുസൂക്ഷിക്കുന്നു.
