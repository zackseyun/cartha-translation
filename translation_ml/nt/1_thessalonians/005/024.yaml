  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πιστὸς ὁ καλῶν ὑμᾶς, ὃς καὶ ποιήσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/024.yaml
  text: Faithful is the one who calls you[a], who also will do it.
translation:
  language: ml
  text: നിങ്ങളെ വിളിക്കുന്നവൻ വിശ്വസ്തനാണ്; അവൻ അതും ചെയ്യും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നിങ്ങളെ വിളിക്കുന്നവൻ ആശ്രയയോഗ്യനാണ്; അവൻ അതും നിവർത്തിക്കും.”'
    reason: πιστός എന്നതിന് ‘ആശ്രയയോഗ്യൻ’ എന്നും ποιήσει എന്നതിന് ‘നിവർത്തിക്കും’ എന്നും പരിഭാഷപ്പെടുത്താവുന്ന ശബ്ദാർഥപരമായ മറ്റൊരു സാധ്യത രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: πιστὸς
  choice: വിശ്വസ്തൻ
  rationale: ദൈവത്തിന്റെ ആശ്രയയോഗ്യതയും വാക്കുപാലിക്കുന്ന സ്വഭാവവും സൂചിപ്പിക്കുന്ന വിധേയവിശേഷണം. മലയാള ബൈബിൾ ഭാഷയിലും സാധാരണ ക്രൈസ്തവ പ്രയോഗത്തിലും സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പദം.
- source_word: ὁ καλῶν
  choice: വിളിക്കുന്നവൻ
  rationale: വർത്തമാനകാല കർത്തൃവാചക കൃദന്തത്തിന്റെ നാമവാചകപ്രയോഗം സംക്ഷിപ്തമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു; വിളിക്കുന്ന പ്രവൃത്തി തുടരുന്നതായുള്ള ഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: ὑμᾶς
  choice: നിങ്ങളെ
  rationale: രണ്ടാം പുരുഷ ബഹുവചന കർമരൂപം. ആധുനിക മാനക മലയാളത്തിൽ സമൂഹത്തോടുള്ള അഭിസംബോധന സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ὃς καὶ
  choice: അവൻ ... ചെയ്യുകയും
  rationale: 'ഗ്രീക്കിലെ ബന്ധസർവനാമവും καί നൽകുന്ന തുടർച്ചയും ഊന്നലും സ്വാഭാവിക മലയാളവാക്യഘടനയിൽ പുനർരൂപപ്പെടുത്തി: വിളിക്കുന്ന അതേ വ്യക്തി അതു നിർവഹിക്കുകയും ചെയ്യും.'
- source_word: ποιήσει
  choice: അതു ചെയ്യുകയും ചെയ്യും
  rationale: ποιέω എന്ന വിശാലാർഥമുള്ള ക്രിയയുടെ ലാളിത്യവും ഭാവികാല ഉറപ്പും നിലനിർത്തുന്നു. 'അതു' മുൻവാക്യമായ 5:23-ലെ വിശുദ്ധീകരിക്കുകയും കാത്തുസൂക്ഷിക്കുകയും ചെയ്യുന്ന പ്രവൃത്തിയിലേക്കാണ് സൂചിപ്പിക്കുന്നത്; 'നിവർത്തിക്കും' എന്നതിനെക്കാൾ വ്യാഖ്യാനഭാരം കുറവാണ്.
theological_decisions:
- issue: ποιήσει എന്ന ക്രിയയുടെ പറയാതിരിക്കുന്ന കർമം
  choice: അതു ചെയ്യുകയും ചെയ്യും
  alternative: അതു നിവർത്തിക്കുകയും ചെയ്യും / അതു സാധ്യമാക്കും
  rationale: ഗ്രീക്കിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ല; 5:23-ൽ പ്രാർത്ഥിച്ച സമ്പൂർണ വിശുദ്ധീകരണവും സംരക്ഷണവുമാണ് സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്. 'അതു ചെയ്യും' എന്നത് ഈ ബന്ധം വായനക്കാരന് ഗ്രഹിക്കാനാകുന്ന വിധം നൽകുമ്പോഴും പ്രവൃത്തിയുടെ രീതി അതിരുകടന്ന് നിർവചിക്കുന്നില്ല.
- issue: ദൈവത്തിന്റെ വിശ്വസ്തതയും പ്രവർത്തനവും തമ്മിലുള്ള ബന്ധം
  choice: വിളിക്കുന്നവൻ വിശ്വസ്തനാണ്; അവൻ അതു ചെയ്യുകയും ചെയ്യും
  alternative: വിളിക്കുന്നവൻ ആശ്രയയോഗ്യനാണ്; അവൻ അതു നിവർത്തിക്കും
  rationale: വിളിക്കുന്ന ദൈവം തന്നെയാണ് പ്രവർത്തിച്ചു പൂർത്തിയാക്കുക എന്ന വാക്യത്തിന്റെ ഉറപ്പ് നിലനിർത്തുന്നു; മനുഷ്യപ്രവർത്തനത്തെ നിഷേധിക്കുന്നതോ പ്രത്യേക സിദ്ധാന്തപരമായ വ്യാഖ്യാനം ചേർക്കുന്നതോ ഇല്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ സഭാവായനാ ശൈലി. ‘വിശ്വസ്തൻ’ എന്ന പരിചിതമായ ദൈവശാസ്ത്രപദം നിലനിർത്തിയെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് നേരിട്ടു മനസ്സിലാകുന്ന വിധത്തിലാണ്. ഗ്രീക്കിലെ ചുരുക്കവും ഉറപ്പും അർധവിരാമത്തിലൂടെ സംരക്ഷിച്ചു.
