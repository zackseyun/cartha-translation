id: 1TH.5.3
reference: 1 Thessalonians 5:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ὅταν λέγωσιν· Εἰρήνη καὶ ἀσφάλεια, τότε αἰφνίδιος αὐτοῖς ἐφίσταται ὄλεθρος ὥσπερ ἡ ὠδὶν τῇ ἐν γαστρὶ ἐχούσῃ, καὶ οὐ μὴ ἐκφύγωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/003.yaml
  text: When they say[a], “Peace and security,” then sudden destruction comes upon them, like labor pains upon a pregnant woman[c][b], and they will certainly not escape.
translation:
  language: ml
  text: '1 തെസ്സലോനിക്യർ 5:3


    അവർ “സമാധാനവും സുരക്ഷയും” എന്നു പറയുമ്പോൾ[a], അപ്പോൾ ഗർഭിണിക്കു പ്രസവവേദന വരുന്നതുപോലെ[b] പെട്ടെന്നുള്ള നാശം അവരുടെമേൽ വന്നെത്തും; അവർ ഒരുവിധത്തിലും രക്ഷപ്പെടുകയില്ല.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സമാധാനവും ഭദ്രതയും.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ഈറ്റുനോവ്.”
    reason: lexical_alternative
  - marker: c
    text: 'ഗ്രീക്കിൽ ഇവിടെ ശക്തമായ നിഷേധപ്രയോഗമുണ്ട്: “അവർ ഒരുവിധത്തിലും രക്ഷപ്പെടുകയില്ല.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν λέγωσιν
  choice: അവർ … എന്നു പറയുമ്പോൾ
  rationale: ὅταν എന്ന അനിശ്ചിത കാലസൂചക പ്രയോഗവും അതോടൊപ്പമുള്ള വർത്തമാനകാല സബ്ജങ്ക്ടീവ് λέγωσιν-ഉം ഭാവിയെ ലക്ഷ്യമിടുന്ന സ്വാഭാവിക മലയാളത്തിൽ ഇങ്ങനെ അവതരിപ്പിക്കുന്നു; കർത്താവായ ‘അവർ’ എന്ന അനിശ്ചിത ബഹുവചനം നിലനിർത്തുന്നു.
- source_word: Εἰρήνη καὶ ἀσφάλεια
  choice: സമാധാനവും സുരക്ഷയും
  rationale: εἰρήνη എന്നതിന് ‘സമാധാനം’ എന്നും ἀσφάλεια എന്നതിന് പൊതുവായ സുരക്ഷയെയോ ഭദ്രതയെയോ സൂചിപ്പിക്കുന്ന ‘സുരക്ഷ’ എന്നും നൽകി. പൊതുവായ ഉറപ്പിന്റെ പ്രഖ്യാപനമെന്ന സന്ദർഭത്തിന് ഈ പദജോടി സ്വാഭാവികമാണ്.
- source_word: τότε
  choice: അപ്പോൾ
  rationale: പ്രഖ്യാപനത്തിനു പിന്നാലെ സംഭവിക്കുന്ന ഫലത്തെ വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: αἰφνίδιος
  choice: പെട്ടെന്നുള്ള
  rationale: നാശത്തിന്റെ അപ്രതീക്ഷിതമായ വരവിനേക്കാൾ അതിന്റെ പൊടുന്നനെയുള്ള സ്വഭാവമാണ് ഗ്രീക്ക് വിശേഷണം നേരിട്ട് ഊന്നുന്നത്.
- source_word: ἐφίσταται
  choice: അവരുടെമേൽ വന്നെത്തും
  rationale: ഒരാളുടെമേൽ ഒരു ദുരന്തം വന്നുചേരുന്നതിനെ സൂചിപ്പിക്കുന്ന സന്ദർഭോചിതമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὄλεθρος
  choice: നാശം
  rationale: രൂക്ഷമായ തകർച്ചയെയോ നാശത്തെയോ സൂചിപ്പിക്കുന്നു; അതിന്റെ കൃത്യമായ രൂപമോ ദൈർഘ്യമോ വിവർത്തനത്തിൽ അധികമായി നിർവചിക്കുന്നില്ല.
- source_word: ὥσπερ ἡ ὠδὶν
  choice: പ്രസവവേദന വരുന്നതുപോലെ
  rationale: ὥσπερ ആരംഭിക്കുന്ന ഉപമയും പ്രസവവുമായി ബന്ധപ്പെട്ട ὠδίνിന്റെ അർഥവും വ്യക്തവും ആധുനികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: τῇ ἐν γαστρὶ ἐχούσῃ
  choice: ഗർഭിണിക്കു
  rationale: അക്ഷരാർഥത്തിൽ ‘ഗർഭത്തിൽ ഉള്ളവൾ’ എന്ന പങ്കാളിത്തപ്രയോഗത്തിന്റെ സ്വാഭാവികവും കൃത്യവുമായ മലയാള തുല്യം.
- source_word: οὐ μὴ ἐκφύγωσιν
  choice: അവർ ഒരുവിധത്തിലും രക്ഷപ്പെടുകയില്ല
  rationale: οὐ μή സഹിതമുള്ള ശക്തമായ ഭാവിനിഷേധത്തെ ‘ഒരുവിധത്തിലും’ എന്ന പ്രയോഗത്തിലൂടെ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: അന്ത്യകാല മുന്നറിയിപ്പിലെ ὄλεθρος എന്ന പദത്തിന്റെ സ്വഭാവം
  choice: ‘നാശം’ എന്നു പരിഭാഷപ്പെടുത്തി; നാശത്തിന്റെ രീതി അല്ലെങ്കിൽ ദൈർഘ്യം നിർവചിച്ചില്ല.
  alternative: ‘തകർച്ച’ അല്ലെങ്കിൽ കൂടുതൽ വ്യാഖ്യാനപരമായ ‘ദുർവിധി’
  rationale: വാക്യം നിർണായക ന്യായവിധിയെക്കുറിച്ച് മുന്നറിയിപ്പ് നൽകുന്നു. എന്നാൽ ഈ നാമം മാത്രം സമ്പൂർണ ഉന്മൂലനമോ നിത്യബോധപൂർവ ശിക്ഷയോ പോലുള്ള പ്രത്യേക സിദ്ധാന്തനിഗമനം നിർബന്ധിക്കുന്നില്ല; അതിനാൽ വചനത്തിന്റെ ഗൗരവവും വ്യാഖ്യാനപരമായ തുറന്ന നിലയും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. വാക്യത്തിന്റെ മുന്നറിയിപ്പുസ്വരം നിലനിർത്തിക്കൊണ്ട് അനാവശ്യമായ പുരാതനപ്രയോഗങ്ങളും വിഭാഗീയ വ്യാഖ്യാനങ്ങളും ഒഴിവാക്കി.
