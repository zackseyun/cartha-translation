  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ μεθ’ ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/028.yaml
  text: The grace of our Lord Jesus Christ be with you[a].
translation:
  language: ml
  text: നമ്മുടെ കർത്താവായ യേശു മശീഹയുടെ കൃപ നിങ്ങളോടുകൂടെ ഇരിക്കട്ടെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'പരമ്പരാഗതമായി: “നമ്മുടെ കർത്താവായ യേശുക്രിസ്തുവിന്റെ കൃപ നിങ്ങളോടുകൂടെ ഇരിക്കട്ടെ.”'
    reason: Χριστοῦ എന്ന ശീർഷകത്തിന്റെ പരമ്പരാഗത പരിഭാഷാരൂപം നൽകുന്നു.
lexical_decisions:
- source_word: χάρις
  choice: കൃപ
  rationale: പൗലോസിന്റെ ആശീർവാദവാക്യങ്ങളിൽ ദൈവത്തിന്റെ അനുഗ്രഹപൂർണമായ കൃപയെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും കൃത്യവുമായ മലയാള പദം.
- source_word: κυρίου
  choice: കർത്താവ്
  rationale: ഇവിടെ യേശുവിന്റെ അധികാരവും ദൈവശാസ്ത്രപരമായ പദവിയും നിലനിർത്തുന്ന സ്വാഭാവികമായ മലയാള ശീർഷകം.
- source_word: Ἰησοῦ
  choice: യേശു
  rationale: മലയാളത്തിലെ സ്ഥാപിതമായ പേരുരൂപം.
- source_word: Χριστοῦ
  choice: മശീഹ
  rationale: Χριστός ഇവിടെ യേശുവിന്റെ ശീർഷകമായി മനസ്സിലാക്കാവുന്നതിനാൽ അതിന്റെ യഹൂദ മശീഹാപരമായ അർഥം സുതാര്യമാക്കുന്നു.
- source_word: μεθ’ ὑμῶν
  choice: നിങ്ങളോടുകൂടെ ഇരിക്കട്ടെ
  rationale: ഗ്രീക്കിൽ ക്രിയയില്ലാത്ത ആശീർവാദസൂത്രമാണിത്; ആശംസയുടെ ഭാവം സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ ‘ഇരിക്കട്ടെ’ ചേർത്തു.
theological_decisions:
- issue: പൗലോസിന്റെ സമാപനാശീർവാദത്തിൽ Χριστοῦ എന്നതിന്റെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ ഈ പദം ഒരു ശീർഷകമായി വായിക്കാനാകുന്നതിനാൽ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി; മലയാള ക്രൈസ്തവ പാരമ്പര്യത്തിലെ സുപരിചിതമായ ‘ക്രിസ്തു’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനികവും മാന്യവും ആരാധനാസന്ദർഭത്തിലും പൊതുവായ വായനയിലും സ്വാഭാവികവുമായ മലയാളം. ഗ്രീക്കിലെ ക്രിയാരഹിത ആശീർവാദഭാവം ‘ഇരിക്കട്ടെ’ എന്ന പ്രയോഗത്തിലൂടെ വ്യക്തമാക്കി.
