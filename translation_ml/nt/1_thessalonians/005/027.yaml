reference: 1 Thessalonians 5:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ἐνορκίζω ὑμᾶς τὸν κύριον ἀναγνωσθῆναι τὴν ἐπιστολὴν πᾶσιν ⸀τοῖς ἀδελφοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/027.yaml
  text: I put you under oath before the Lord to have this letter read to all the brothers[a][b].
translation:
  language: ml
  text: 'കർത്താവിന്റെ സന്നിധിയിൽ[a] ഞാൻ നിങ്ങളെക്കൊണ്ട് സത്യം ചെയ്യിക്കുന്നു: ഈ കത്ത് എല്ലാ സഹോദരന്മാർക്കും[b] വായിച്ചുകേൾപ്പിക്കണം.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കർത്താവിനെച്ചൊല്ലി.’ കർത്താവിനെ ആഹ്വാനം ചെയ്യപ്പെട്ട അധികാരമായി മുൻനിർത്തി പൗലോസ് അവരെ ഗൗരവമായി ബാധ്യസ്ഥരാക്കുന്നു എന്ന അർഥം ഗ്രീക്ക് പ്രയോഗത്തിനുണ്ടാകാം.
    reason: lexical_alternative
  - marker: b
    text: ‘സഹോദരന്മാർ’ എന്നത് സ്ത്രീകളുൾപ്പെടെ മുഴുവൻ സഭയെയും സൂചിപ്പിക്കുന്നതായിരിക്കാം; ഗ്രീക്കിലെ ἀδελφοῖς പുരുഷലിംഗ ബഹുവചനമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνορκίζω
  choice: ഞാൻ നിങ്ങളെക്കൊണ്ട് സത്യം ചെയ്യിക്കുന്നു
  rationale: ഒരാളെ ശപഥത്താൽ ഗൗരവമായി ബാധ്യസ്ഥനാക്കുക എന്ന ക്രിയയുടെ ശക്തി നിലനിർത്തുകയും, അപൂർവമോ അതിപുരാതനമോ ആയ പദപ്രയോഗം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: τὸν κύριον
  choice: കർത്താവിന്റെ സന്നിധിയിൽ
  rationale: കർത്താവിനെ സാക്ഷിയും അധികാരവുമായി ആഹ്വാനം ചെയ്യുന്ന ഗൗരവം സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു; ‘കർത്താവിനെച്ചൊല്ലി’ എന്ന വ്യാകരണസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἀναγνωσθῆναι
  choice: വായിച്ചുകേൾപ്പിക്കണം
  rationale: സഭായോഗത്തിൽ കത്ത് പരസ്യമായി വായിക്കപ്പെടുന്നതാണ് സന്ദർഭം. ഗ്രീക്കിലെ കർമണി ആശയവും ശ്രോതാക്കൾക്കായി വായിക്കുന്ന പ്രവൃത്തിയും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: τὴν ἐπιστολήν
  choice: ഈ കത്ത്
  rationale: ഇപ്പോൾ കൈമാറുന്ന രേഖയെയാണ് പൗലോസ് സൂചിപ്പിക്കുന്നത്; ‘ലേഖനം’ എന്നതിനെക്കാൾ സാധാരണ വായനക്കാർക്ക് ‘കത്ത്’ സ്വാഭാവികമാണ്.
- source_word: πᾶσιν τοῖς ἀδελφοῖς
  choice: എല്ലാ സഹോദരന്മാർക്കും
  rationale: ഗ്രീക്കിലെ പുരുഷലിംഗ ബഹുവചനം നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു. സഭയിലെ സ്ത്രീകളും ഉൾപ്പെടാൻ സാധ്യതയുണ്ടെന്ന പ്രയോഗവ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: സമ്മിശ്രലിംഗ സഭാസമൂഹത്തെ സൂചിപ്പിക്കാൻ സാധ്യതയുള്ള ἀδελφοῖς എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: സഹോദരന്മാർ
  alternative: സഹോദരീസഹോദരന്മാർ / വിശ്വാസികൾ
  rationale: മൂലപാഠം പുരുഷലിംഗ ബഹുവചനം ഉപയോഗിക്കുന്നു. പൗലോസിന്റെ പ്രയോഗത്തിൽ ഇത് സ്ത്രീകളുൾപ്പെടെ മുഴുവൻ സഭയെയും സൂചിപ്പിക്കാറുണ്ടെങ്കിലും, ആ ഉൾക്കൊള്ളുന്ന അർഥം മുഖ്യപാഠത്തിൽ വ്യാഖ്യാനപരമായി വികസിപ്പിക്കാതെ അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ശപഥത്തിന്റെ ശക്തി നിലനിർത്തിയിട്ടുണ്ട്; പൊതുവായ വായന സന്ദർഭാനുസൃതമായി ‘വായിച്ചുകേൾപ്പിക്കുക’ എന്നു നൽകിയിരിക്കുന്നു. യഥാർഥമായ വ്യാകരണ-അർഥവൈകല്യങ്ങൾ അടിക്കുറിപ്പുകളിൽ സൂക്ഷിച്ചിരിക്കുന്നു.
