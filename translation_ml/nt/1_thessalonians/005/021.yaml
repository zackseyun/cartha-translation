reference: 1 Thessalonians 5:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πάντα δὲ δοκιμάζετε, τὸ καλὸν κατέχετε,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/021.yaml
  text: But test everything[a]; hold fast to what is good.
translation:
  language: ml
  text: എന്നാൽ എല്ലാം പരിശോധിക്കുക[a]; നല്ലത് മുറുകെപ്പിടിക്കുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സകലവും.’ സന്ദർഭത്തിൽ, പ്രവചനങ്ങളെ വിലയിരുത്തുന്നതും ഇതിൽ പ്രത്യേകമായി ഉൾപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: എല്ലാം
  rationale: നപുംസകലിംഗ ബഹുവചനമായ പദത്തിന്റെ സമഗ്രമായ വ്യാപ്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; സന്ദർഭം പ്രവചനവചനങ്ങളുടെ വിലയിരുത്തലിനെ പ്രത്യേകമായി ഉൾക്കൊള്ളുന്നുവെങ്കിലും അർഥം അതിലേക്കു മാത്രം ചുരുക്കുന്നില്ല.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻ നിർദേശങ്ങളോടുള്ള മൃദുവായ വൈരുധ്യമോ ആശയമാറ്റമോ സൂചിപ്പിക്കുന്നു; അതിശക്തമായ എതിർപ്പ് സൃഷ്ടിക്കാതെ ഈ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: δοκιμάζετε
  choice: പരിശോധിച്ചറിയുക
  rationale: ഒന്നിന്റെ യാഥാർഥ്യമോ മൂല്യമോ വിലയിരുത്തുന്നതിനായി പരിശോധിക്കുക എന്ന അർഥവും വർത്തമാനകാല ആജ്ഞയുടെ തുടർച്ചയായ സ്വഭാവവും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: τὸ καλὸν
  choice: നല്ലത്
  rationale: നാമരൂപത്തിൽ ഉപയോഗിച്ചിരിക്കുന്ന നപുംസകലിംഗ ഏകവചന വിശേഷണത്തിന്റെ അർഥം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: κατέχετε
  choice: മുറുകെപ്പിടിക്കുക
  rationale: പരിശോധനയ്ക്കുശേഷം നല്ലതായി കണ്ടെത്തിയതിനെ ഉറച്ചുനിലനിർത്തുകയും അനുസരിക്കുകയും ചെയ്യുക എന്ന സജീവമായ ആശയം പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: പ്രവചനവും വിവേചനവും സംബന്ധിച്ച സന്ദർഭത്തിൽ πάντα എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: ‘എല്ലാം’ എന്ന് സമഗ്രമായി പരിഭാഷപ്പെടുത്തി; തൊട്ടുമുമ്പുള്ള സന്ദർഭം പ്രവചനവചനങ്ങളുടെ പരിശോധനയെ പ്രത്യേകമായി ഉൾക്കൊള്ളാൻ അനുവദിച്ചു.
  alternative: ‘എല്ലാ പ്രവചനങ്ങളും’ അല്ലെങ്കിൽ ‘പറയപ്പെടുന്നതെല്ലാം’ എന്ന് സന്ദർഭാനുസൃതമായി ചുരുക്കുക.
  rationale: ഗ്രീക്ക് പാഠത്തിൽ πάντα എന്ന വിശാല പദമാണ് ഉള്ളത്; അതിനെ പരിമിതപ്പെടുത്തുന്ന നാമപദമില്ല. അതിനാൽ സന്ദർഭത്തിന്റെ പ്രത്യേക പ്രയോഗം അംഗീകരിക്കുമ്പോഴും കല്പനയുടെ വിശാലത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവും പൊതുവായ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘പരിശോധിച്ചറിയുക’ വിലയിരുത്തലിന്റെ അർഥം വ്യക്തമാക്കുന്നു; ‘മുറുകെപ്പിടിക്കുക’ ഉറച്ച തുടർച്ചയെ പ്രകടമാക്കുന്നു.
