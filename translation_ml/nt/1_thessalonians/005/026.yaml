  text: ἀσπάσασθε τοὺς ἀδελφοὺς πάντας ἐν φιλήματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/026.yaml
  text: Greet all the brothers with a holy kiss[a][b].
translation:
  language: ml
  text: വിശുദ്ധമായ ചുംബനത്തോടെ എല്ലാ സഹോദരന്മാരെയും അഭിവാദ്യം ചെയ്യുക.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “എല്ലാ സഹോദരന്മാരെയും സഹോദരിമാരെയും”; ഇവിടെ “സഹോദരന്മാർ” എന്നത് മുഴുവൻ വിശ്വാസസമൂഹത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “വിശുദ്ധമായ ചുംബനം” ക്രിസ്തീയ കൂട്ടായ്മയും സ്നേഹവും പ്രകടിപ്പിക്കുന്ന, അന്നത്തെ സംസ്കാരത്തിൽ പരിചിതമായ ഒരു അഭിവാദനരീതിയായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: അഭിവാദ്യം ചെയ്യുക
  rationale: രണ്ടാം പുരുഷ ബഹുവചനത്തിലുള്ള നേരിട്ടുള്ള ആഹ്വാനമാണ്. ἀσπάζομαι എന്നതിന്റെ സാമൂഹികമായ ആശംസിക്കൽ എന്ന അർഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: ἀδελφοὺς
  choice: സഹോദരന്മാരെ
  rationale: ഗ്രീക്കിൽ പദം വ്യാകരണപരമായി പുല്ലിംഗ ബഹുവചനത്തിലാണ്. അതിനാൽ മുഖ്യപാഠത്തിൽ ആ രൂപം നിലനിർത്തുന്നു; മുഴുവൻ വിശ്വാസസമൂഹത്തെയും ഉൾക്കൊള്ളാനിടയുള്ള അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: πάντας
  choice: എല്ലാ
  rationale: സഹോദരന്മാർ എന്നു സൂചിപ്പിക്കുന്ന കൂട്ടത്തിലെ ഒരാളെയും ഒഴിവാക്കാതെ എല്ലാവരെയും ഊന്നിപ്പറയുന്നു.
- source_word: ἐν φιλήματι ἁγίῳ
  choice: വിശുദ്ധചുംബനത്തോടെ
  rationale: ἐν ഇവിടെ അനുബന്ധമായ രീതി അഥവാ മാർഗം സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ -ത്തോടെ എന്ന രൂപം അത് സ്വാഭാവികമായി നൽകുന്നു. φίλημα എന്നത് ചുംബനവും ἁγίῳ അതിന്റെ വിശുദ്ധ സ്വഭാവവും വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: സഭാസമൂഹത്തെ അഭിസംബോധന ചെയ്യുമ്പോൾ ἀδελφοί എന്ന പദത്തിന്റെ ലിംഗസൂചന
  choice: സഹോദരന്മാർ
  alternative: സഹോദരീസഹോദരന്മാർ
  rationale: മൂലപദത്തിന്റെ വ്യാകരണപരമായ പുല്ലിംഗരൂപം മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു. അതേസമയം, സന്ദർഭത്തിൽ ഇത് സ്ത്രീകളും പുരുഷന്മാരും ഉൾപ്പെടുന്ന മുഴുവൻ വിശ്വാസസമൂഹത്തെയും സൂചിപ്പിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആജ്ഞാരൂപം ഉപയോഗിച്ചു. ‘വിശുദ്ധചുംബനം’ എന്ന സംയുക്തപദം മൂലത്തിന്റെ സംക്ഷിപ്തതയും പരമ്പരാഗതമായി തിരിച്ചറിയാവുന്ന ആശയവും നിലനിർത്തുന്നു; സാംസ്കാരിക പശ്ചാത്തലം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
