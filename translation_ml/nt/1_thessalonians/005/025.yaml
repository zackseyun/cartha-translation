  yaml_path: translation/nt/1_thessalonians/005/025.yaml
  text: Brothers[a], pray for us.
translation:
  language: ml
  text: സഹോദരന്മാരേ[a], ഞങ്ങൾക്കുവേണ്ടി പ്രാർഥിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സഹോദരീസഹോദരന്മാരേ”; ഈ അഭിസംബോധന മുഴുവൻ സഭയെയും ഉൾക്കൊള്ളുന്നതായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: ἀδελφός എന്ന പദത്തിന്റെ സംബോധനാ ബഹുവചനം. ഗ്രീക്കിലെ പുല്ലിംഗരൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; മുഴുവൻ സഭയെയും, സ്ത്രീകളുൾപ്പെടെ, അഭിസംബോധന ചെയ്യുന്നതാകാമെന്ന അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: προσεύχεσθε
  choice: പ്രാർഥിക്കണം
  rationale: προσεύχομαι എന്ന ക്രിയയുടെ വർത്തമാനകാല ആജ്ഞാരൂപം, രണ്ടാംപുരുഷ ബഹുവചനം. മലയാളത്തിൽ വിനീതവും സ്വാഭാവികവുമായ അഭ്യർഥനയായി ‘പ്രാർഥിക്കണം’ യോജിക്കുന്നു; തുടരുന്ന പ്രവൃത്തിയുടെ ഭാവം സന്ദർഭത്തിൽനിന്ന് ഗ്രഹിക്കാവുന്നതിനാൽ ‘തുടർന്നും’ എന്നു അധികമായി ചേർത്തിട്ടില്ല.
- source_word: περὶ
  choice: വേണ്ടി
  rationale: ἡμῶν എന്ന ഷഷ്ഠീവിഭക്തി സർവനാമത്തോടൊപ്പം ഇവിടെ പ്രാർഥനയുടെ പ്രയോജനഭോക്താവിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗം ‘ഞങ്ങൾക്കുവേണ്ടി’ എന്നതാണ്.
- source_word: ἡμῶν
  choice: ഞങ്ങൾ
  rationale: ഒന്നാംപുരുഷ ബഹുവചന സർവനാമം; περί-യോടു ചേർന്ന് ‘ഞങ്ങൾക്കുവേണ്ടി’ എന്നു പരിഭാഷപ്പെടുത്തി. പൗലോസിനെയും സഹപ്രവർത്തകരെയും സൂചിപ്പിക്കുന്നുവെങ്കിലും പാഠം പറയുന്നതിലധികം വിശദീകരിച്ചിട്ടില്ല.
theological_decisions:
- issue: സാധ്യതയോടെ സ്ത്രീകളും പുരുഷന്മാരും ഉൾപ്പെട്ട സഭയോടുള്ള Ἀδελφοί എന്ന അഭിസംബോധന
  choice: സഹോദരന്മാരേ
  alternative: സഹോദരീസഹോദരന്മാരേ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചനരൂപം മുഖ്യപാഠത്തിൽ കാത്തുസൂക്ഷിക്കുന്നു. എന്നാൽ സന്ദർഭത്തിൽ ഇത് മുഴുവൻ സഭയെയും ഉൾക്കൊള്ളുന്ന അഭിസംബോധനയായിരിക്കാം; ആ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ചുരുങ്ങിയ അപ്പീലിന്റെ നേരിട്ടുള്ള സ്വഭാവം നിലനിർത്തി; ‘പ്രാർഥിക്കുക’ എന്നതിനെക്കാൾ സ്വാഭാവികമായ അഭ്യർഥനാഭാവത്തിനായി ‘പ്രാർഥിക്കണം’ ഉപയോഗിച്ചു.
