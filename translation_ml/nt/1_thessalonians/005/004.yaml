id: 1TH.5.4
reference: 1 Thessalonians 5:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὑμεῖς δέ, ἀδελφοί, οὐκ ἐστὲ ἐν σκότει, ἵνα ἡ ἡμέρα ὑμᾶς ὡς ⸀κλέπτης καταλάβῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/004.yaml
  text: But you[a], brothers, are not in darkness[b], so that the day would overtake you like a thief.
translation:
  language: ml
  text: എന്നാൽ, സഹോദരങ്ങളേ[a], ആ ദിവസം[b] ഒരു കള്ളനെപ്പോലെ നിങ്ങളെ പിടികൂടത്തക്കവിധം നിങ്ങൾ ഇരുട്ടിലല്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെയുള്ള ‘സഹോദരങ്ങളേ’ എന്ന സംബോധനത്തിൽ സഹോദരിമാരും ഉൾപ്പെടാം.
    reason: lexical_alternative
  - marker: b
    text: തൊട്ടുമുമ്പുള്ള സന്ദർഭത്തിൽ ഇത് ‘കർത്താവിന്റെ ദിവസം’ ആണ് (5:2).
    reason: cross_reference
lexical_decisions:
- source_word: ὑμεῖς δέ
  choice: എന്നാൽ ... നിങ്ങൾ
  rationale: δέ മുൻവിവരണത്തോടുള്ള വൈരുധ്യം സൂചിപ്പിക്കുന്നു; പ്രത്യക്ഷ സർവനാമമായ ὑμεῖς നൽകുന്ന ഊന്നൽ ‘നിങ്ങൾ’ നിലനിർത്തുന്നു.
- source_word: ἀδελφοί
  choice: സഹോദരങ്ങളേ
  rationale: സംബോധനരൂപവും മൂലത്തിലെ സഹോദരബന്ധത്തിന്റെ ഭാഷയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു; സഭയിലെ സ്ത്രീകളെയും ഉൾക്കൊള്ളാവുന്ന പ്രയോഗമാണെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐν σκότει
  choice: ഇരുട്ടിലല്ല
  rationale: ധാർമികവും ആത്മീയവുമായ അജ്ഞതയെ സൂചിപ്പിക്കുന്ന രൂപകത്തെ വിശദീകരിച്ചുകളയാതെ നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: ἵνα
  choice: അതുകൊണ്ട് ... -യില്ല
  rationale: അവർ ഇരുട്ടിലല്ലാത്തതിനാൽ ആ ദിവസം അവരെ കീഴടക്കുന്ന സാഹചര്യം ഉണ്ടാകില്ലെന്ന ഫലബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ഉദ്ദേശ്യമോ ഫലമോ എന്ന സൂക്ഷ്മഭേദം അമിതമായി നിർണയിക്കുന്നില്ല.
- source_word: ἡ ἡμέρα
  choice: ആ ദിവസം
  rationale: സന്ദർഭത്തിൽ ഇതിനകം പരാമർശിച്ചിരിക്കുന്ന നിർദിഷ്ട അന്ത്യകാലദിവസത്തെയാണ് സൂചിപ്പിക്കുന്നത്; പൂർണമായ ‘കർത്താവിന്റെ ദിവസം’ പ്രധാനവാക്യത്തിലേക്ക് ചേർക്കാതെ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὡς κλέπτης
  choice: ഒരു കള്ളനെപ്പോലെ
  rationale: ὡς സൂചിപ്പിക്കുന്ന ഉപമ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: καταλάβῃ
  choice: കീഴടക്കുകയില്ല
  rationale: καταλαμβάνω എന്നതിലെ അപ്രതീക്ഷിതമായി പിടികൂടുക/മേൽക്കൈ നേടുക എന്ന ശക്തമായ അർഥം സംരക്ഷിക്കുന്നു; ‘ആശ്ചര്യപ്പെടുത്തുക’ എന്ന വിശദീകരണപരമായ പരിഭാഷ ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: മിശ്രലിംഗ സഭയോടുള്ള ἀδελφοί എന്ന സംബോധന
  choice: സഹോദരങ്ങളേ
  alternative: സഹോദരീസഹോദരന്മാരേ
  rationale: മൂലത്തിലെ പുല്ലിംഗ ബഹുവചന സംബോധനയെ പ്രധാനവാക്യത്തിൽ നിലനിർത്തുന്നു; അത് സഭ മുഴുവനെയും, സ്ത്രീകളെയും ഉൾപ്പെടുത്തി, അഭിസംബോധന ചെയ്യാമെന്ന അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ἡ ἡμέρα എന്നതിന്റെ അന്ത്യകാലസൂചന
  choice: ആ ദിവസം
  alternative: കർത്താവിന്റെ ദിവസം
  rationale: ഗ്രീക്കിൽ ഇവിടെ ‘ദിവസം’ എന്നുമാത്രമാണെങ്കിലും തൊട്ടുമുമ്പുള്ള സന്ദർഭം അത് കർത്താവിന്റെ ദിവസമാണെന്ന് തിരിച്ചറിയിക്കുന്നു; അതിനാൽ വിപുലമായ പദപ്രയോഗം പ്രധാനവാക്യത്തിൽ ചേർക്കാതെ അടിക്കുറിപ്പിലാക്കുന്നു.
- issue: ἵνα ഘടനയിലെ ഉദ്ദേശ്യം/ഫലം എന്ന സൂക്ഷ്മഭേദം
  choice: അതുകൊണ്ട് ... കീഴടക്കുകയില്ല
  alternative: ആ ദിവസം ... കീഴടക്കത്തക്കവിധം നിങ്ങൾ ഇരുട്ടിലല്ല
  rationale: മലയാളത്തിൽ സ്വാഭാവികമായ ഫലബന്ധം പ്രകടിപ്പിക്കുമ്പോഴും, വിശ്വാസികളുടെ നിലയെക്കുറിച്ചുള്ള ഉറപ്പിനെ അനാവശ്യമായി ദുർബലമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഇരുട്ട്’, ‘ദിവസം’, ‘കള്ളൻ’ എന്നീ മൂലരൂപകങ്ങൾ നിലനിർത്തി; സന്ദർഭവിവരം അടിക്കുറിപ്പുകളിലേക്ക് പരിമിതപ്പെടുത്തി.
