- from: എന്നാൽ സഹോദരങ്ങളേ[a], നിങ്ങൾ ഇരുട്ടിലല്ല; അതുകൊണ്ട് ആ ദിവസം[b] ഒരു കള്ളനെപ്പോലെ നിങ്ങളെ കീഴടക്കുകയില്ല.
  to: എന്നാൽ, സഹോദരങ്ങളേ[a], ആ ദിവസം[b] ഒരു കള്ളനെപ്പോലെ നിങ്ങളെ പിടികൂടത്തക്കവിധം നിങ്ങൾ ഇരുട്ടിലല്ല.
  rationale: 'The revision retains the Greek word order’s contrast and direct address while rendering ἵνα in a Malayalam construction that preserves its purpose/result nuance: believers are not in darkness in such a way that the day would overtake them. “പിടികൂടുക” reflects καταλαμβάνω’s sense of overtaking or catching without importing a doctrinal or explanatory gloss. Footnote anchors and their scope are retained.'
