id: 1TH.5.11
reference: 1 Thessalonians 5:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διὸ παρακαλεῖτε ἀλλήλους καὶ οἰκοδομεῖτε εἷς τὸν ἕνα, καθὼς καὶ ποιεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/011.yaml
  text: Therefore encourage one another and build up one another[a], just as you are also doing.
translation:
  language: ml
  text: അതുകൊണ്ട്, പരസ്പരം പ്രോത്സാഹിപ്പിക്കുക[a]യും ഒരാൾ മറ്റൊരാളെ പടുത്തുയർത്തുകയും ചെയ്യുക, നിങ്ങൾ ചെയ്തുകൊണ്ടിരിക്കുന്നതുപോലെതന്നെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പരസ്പരം ഉദ്ബോധിപ്പിക്കുക’ എന്നും പരിഭാഷപ്പെടുത്താം; παρακαλεῖτε എന്ന പദത്തിന് ഈ സന്ദർഭത്തിൽ പ്രോത്സാഹിപ്പിക്കുക എന്ന അർഥവും ഗൗരവത്തോടെ പ്രേരിപ്പിക്കുക എന്ന അർഥവും വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യങ്ങളിലെ ആശയത്തിൽനിന്നുള്ള നിഗമനബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: παρακαλεῖτε
  choice: പ്രോത്സാഹിപ്പിക്കുക
  rationale: ഈ പരസ്പരശുശ്രൂഷയുടെ സന്ദർഭത്തിൽ ധൈര്യം പകരുക, ഉത്സാഹിപ്പിക്കുക, ഉദ്ബോധിപ്പിക്കുക എന്നീ അർഥവ്യാപ്തികളിൽ പ്രോത്സാഹനമാണ് മുഖ്യമായി പ്രകടമാകുന്നത്; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἀλλήλους
  choice: പരസ്പരം
  rationale: പരസ്പരപ്രവർത്തനം സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും വ്യക്തവുമായ മലയാളപ്രയോഗം.
- source_word: οἰκοδομεῖτε
  choice: പടുത്തുയർത്തുക
  rationale: നിർമാണത്തിന്റെ ഗ്രീക്ക് രൂപകം നിലനിർത്തുകയും ആത്മീയമായ ശക്തിപ്പെടുത്തൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന രീതിയിൽ അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: εἷς τὸν ἕνα
  choice: ഒരാൾ മറ്റൊരാളെ
  rationale: ഓരോ വ്യക്തിയും മറ്റൊരാളെ പടുത്തുയർത്തണമെന്ന ഗ്രീക്കിലെ ഊന്നൽ, മുൻപത്തെ ‘പരസ്പരം’ എന്ന പ്രയോഗം യാന്ത്രികമായി ആവർത്തിക്കാതെ, വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: καθὼς καὶ ποιεῖτε
  choice: നിങ്ങൾ ഇപ്പോൾ ചെയ്തുവരുന്നതുപോലെതന്നെ
  rationale: καθώς എന്ന താരതമ്യവും καί നൽകുന്ന സ്ഥിരീകരണവും വർത്തമാനകാല ക്രിയ സൂചിപ്പിക്കുന്ന തുടർന്നുകൊണ്ടിരിക്കുന്ന പ്രവൃത്തിയും പ്രശംസാപൂർവം പ്രകടിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘പടുത്തുയർത്തുക’ എന്നത് മൂലഭാഷയിലെ നിർമാണരൂപകം സംരക്ഷിക്കുന്നു; വാക്യക്രമം മലയാളത്തിലെ വായനാസൗകര്യത്തിനായി ക്രമപ്പെടുത്തി.
