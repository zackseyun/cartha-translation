review_pass:
  verdict: revise
  source_fidelity: The draft retains the inferential transition, the sleep/wake imagery, and the collective hortatory force. However, it does not clearly represent the adversative ἀλλά, and “ജാഗ്രതയോടെ” renders νήφω too broadly while duplicating the vigilance already expressed by γρηγορῶμεν. A rendering that preserves the sobriety/clear-mindedness component is preferable.
