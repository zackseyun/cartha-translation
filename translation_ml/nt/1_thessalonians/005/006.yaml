    issue: The adversative ἀλλά is not explicitly represented.
    rationale: The construction “ഉറങ്ങാതെ ഉണർന്നും” implies contrast, but it does not distinctly communicate Paul’s “not … but …” exhortation. “പകരം” makes the contrast clear without overtranslation.
  - severity: medium
    issue: “ജാഗ്രതയോടെ” for νήφω blurs it with γρηγορῶμεν.
    rationale: γρηγορῶμεν supplies the wakefulness/watchfulness sense. νήφω specifically retains sobriety, with associated clear-minded restraint; translating both with wakefulness/vigilance loses this lexical distinction.
