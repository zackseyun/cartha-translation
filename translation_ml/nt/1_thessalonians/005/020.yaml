  text: προφητείας μὴ ἐξουθενεῖτε·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/020.yaml
  text: Do not despise prophecies[a].
translation:
  language: ml
  text: പ്രവചനങ്ങളെ നിസ്സാരമായി കാണരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പ്രവാചകവചനങ്ങളെ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: προφητείας
  choice: പ്രവചനങ്ങളെ
  rationale: പ്രവചനത്തിന്റെ സംഭവങ്ങളെയോ പ്രകടനങ്ങളെയോ സൂചിപ്പിക്കുന്ന അക്കുസറ്റീവ് ബഹുവചനമാണിത്. മലയാളത്തിലെ ബഹുവചനരൂപം ഗ്രീക്കിലെ ബഹുവചനം നിലനിർത്തുന്നു; ഒരു പ്രത്യേക പ്രവർത്തനരീതിയിലേക്കോ പിൽക്കാല ദൈവശാസ്ത്രവിഭാഗത്തിലേക്കോ അർഥം ചുരുക്കുന്നില്ല.
- source_word: μὴ
  choice: അരുത്
  rationale: വർത്തമാനകാല ആജ്ഞാരൂപത്തോടുകൂടിയ സാധാരണ നിഷേധം മലയാളത്തിൽ സ്വാഭാവികമായ വിലക്കായി ‘അരുത്’ എന്നു നൽകിയിരിക്കുന്നു; ‘ഒരിക്കലും’ പോലുള്ള പദങ്ങൾ ചേർത്ത് ഊന്നൽ അമിതമാക്കിയിട്ടില്ല.
- source_word: ἐξουθενεῖτε
  choice: നിന്ദിക്കരുത്
  rationale: ഒന്നിനെയും വിലകെട്ടതായി കണ്ട് അവജ്ഞയോടെ പെരുമാറുക എന്ന ശക്തമായ ആശയം ‘നിന്ദിക്കുക’ സ്വാഭാവികമായും സംക്ഷിപ്തമായും അറിയിക്കുന്നു. ‘തള്ളിക്കളയുക’ എന്നത് വെറും നിരസനത്തിലേക്ക് അർഥം ചുരുക്കാം.
theological_decisions:
- issue: ആദിമ ക്രിസ്തീയസഭയുടെ പശ്ചാത്തലത്തിൽ ‘പ്രവചനങ്ങൾ’ എന്നതിന്റെ അർഥം
  choice: ‘പ്രവചനങ്ങൾ’ എന്ന വിശാലമായ പദം നിലനിർത്തി.
  alternative: ‘പ്രവാചകവചനങ്ങൾ’ അല്ലെങ്കിൽ ‘ദൈവത്തിൽനിന്നുള്ളതെന്ന് അവകാശപ്പെടുന്ന സന്ദേശങ്ങൾ’
  rationale: സഭയിലെ പ്രവചനപരമായ സംസാരത്തെ അവജ്ഞയോടെ കാണരുതെന്നാണ് വാക്യത്തിന്റെ നിർദേശം. എന്നാൽ ഗ്രീക്ക് പദം ഇതിന്റെ കൃത്യമായ പ്രവർത്തനരീതിയോ ഇന്നത്തെ ദൈവശാസ്ത്രപരമായ നിലനിൽപ്പോ അവസാനമോ നിർവചിക്കുന്നില്ല. അതിനാൽ വിഭാഗീയമായ നിഗമനം ചേർക്കാതെ ഉള്ളിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന, സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ ആജ്ഞാരൂപം. ‘പ്രവചനങ്ങൾ’ എന്ന പദം മൂലത്തിലെ ബഹുവചനവും അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു.
