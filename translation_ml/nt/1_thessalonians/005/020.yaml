- from: പ്രവചനങ്ങളെ നിന്ദിക്കരുത്.[a]
  to: പ്രവചനങ്ങളെ നിസ്സാരമായി കാണരുത്.[a]
  rationale: The plural ‘പ്രവചനങ്ങളെ’ and the broad theological scope are retained. The prohibition is revised from a term centered on reviling to an idiomatic expression for contemptuous dismissal, which more closely reflects ἐξουθενεῖτε.
  reviewer_model: gpt-5.6-terra
