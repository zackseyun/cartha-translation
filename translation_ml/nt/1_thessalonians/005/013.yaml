id: 1TH.5.13
reference: 1 Thessalonians 5:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἡγεῖσθαι αὐτοὺς ⸀ὑπερεκπερισσοῦ ἐν ἀγάπῃ διὰ τὸ ἔργον αὐτῶν. εἰρηνεύετε ἐν ⸀ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/013.yaml
  text: and to regard them very highly in love because of their work[a]. Be at peace among yourselves.
translation:
  language: ml
  text: അവരുടെ പ്രവൃത്തി നിമിത്തം അവരെ സ്നേഹത്തോടെ അത്യന്തം ആദരിക്കുവിൻ.[a] നിങ്ങൾ പരസ്പരം സമാധാനത്തോടെ കഴിയുവിൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരെ സ്നേഹത്തിൽ അളവറ്റവിധം വിലമതിക്കുവിൻ.” ഗ്രീക്കിലെ ക്രിയാവിശേഷണം അസാധാരണമായ തീവ്രതയുള്ളതാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡγεῖσθαι
  choice: ആദരിക്കുവിൻ
  rationale: ഇവിടെ ക്രിയയ്ക്ക് നേതൃത്വമെന്ന അർഥമല്ല, മുമ്പ് പരാമർശിച്ചവരെ വിലമതിച്ച് ഉന്നതമായി കാണുക എന്ന അർഥമാണ്. ‘ആദരിക്കുവിൻ’ ആ വിലയിരുത്തലും ബഹുമാനവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ὑπερεκπερισσοῦ
  choice: അത്യന്തം
  rationale: അപൂർവവും ശക്തമായി തീവ്രമാക്കിയതുമായ ഈ ക്രിയാവിശേഷണത്തിന്റെ അതിരുകടന്ന ഊന്നൽ ‘അത്യന്തം’ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: ἐν ἀγάπῃ
  choice: സ്നേഹത്തോടെ
  rationale: പ്രസ്തുത ആദരവിന്റെ രീതിയോ ഭാവമോ സൂചിപ്പിക്കുന്ന പ്രയോഗമായി വായിച്ച് ἀγάπηയുടെ ആശയം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: διὰ τὸ ἔργον αὐτῶν
  choice: അവരുടെ പ്രവൃത്തി നിമിത്തം
  rationale: διά + accusative ഇവിടെ കാരണമോ അടിസ്ഥാനമോ സൂചിപ്പിക്കുന്നു. ‘പ്രവൃത്തി’ ἔργον എന്ന നാമപദത്തെ പരാവർത്തനം ചെയ്യാതെ നിലനിർത്തുന്നു.
- source_word: εἰρηνεύετε
  choice: സമാധാനത്തോടെ കഴിയുവിൻ
  rationale: വർത്തമാനകാല ആജ്ഞ തുടരുന്ന അവസ്ഥയെയോ ജീവിതരീതിയെയോ സൂചിപ്പിക്കുന്നു; ഈ മലയാളപ്രയോഗം സമാധാനം നിലനിർത്തിക്കൊണ്ട് ജീവിക്കുക എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐν ἑαυτοῖς
  choice: പരസ്പരം
  rationale: ബഹുവചന ആത്മവാചകപ്രയോഗം സഭാസമൂഹത്തിനകത്തെ ബന്ധത്തെ സൂചിപ്പിക്കുന്നു. ‘പരസ്പരം’ ആ സമൂഹപരമായ അർഥം ലളിതമായി നൽകുന്നു.
- source_word: καὶ
  choice: വാക്യപ്രവാഹത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഈ വാക്യം മുൻവാക്യത്തിലെ ആഹ്വാനത്തിന്റെ തുടർച്ചയാണ്. ഒറ്റവാക്യമായി ഉദ്ധരിക്കുമ്പോൾ ആരംഭത്തിലെ ‘കൂടാതെ’ മലയാളത്തിൽ കൃത്രിമമാകുന്നതിനാൽ ബന്ധം ആജ്ഞാരൂപത്തിന്റെ തുടർച്ചയിലൂടെ സൂക്ഷിച്ചു.
- source_word: αὐτούς
  choice: അവരെ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ, സമൂഹത്തിൽ അധ്വാനിക്കുകയും നേതൃത്വം നൽകുകയും ഉപദേശിക്കുകയും ചെയ്യുന്നവരിലേക്കുള്ള സർവനാമസൂചന നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആജ്ഞാരൂപം ഉപയോഗിച്ചു. ‘അത്യന്തം ആദരിക്കുവിൻ’ മൂലത്തിലെ അസാധാരണ ഊന്നൽ വായനാസൗകര്യത്തോടെ നൽകുന്നു; കൂടുതൽ അക്ഷരാർഥപരമായ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
