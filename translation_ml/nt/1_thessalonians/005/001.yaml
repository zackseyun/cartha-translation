translation:
  language: ml
  text: കാലങ്ങളെയും നിശ്ചിതസമയങ്ങളെയും സംബന്ധിച്ച്[a], സഹോദരന്മാരേ[b], നിങ്ങൾക്കു എഴുതിക്കൊടുക്കേണ്ട ആവശ്യമില്ല.
  philosophy: optimal-equivalence
  footnotes:
