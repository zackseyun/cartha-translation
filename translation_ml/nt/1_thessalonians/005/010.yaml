revisions:
- from: നമുക്കുവേണ്ടി മരിച്ചവൻ—നാം ഉണർന്നിരിക്കുന്നവരായാലും ഉറങ്ങുന്നവരായാലും[a], അവനോടുകൂടെ ഒരുമിച്ചു ജീവിക്കേണ്ടതിനാണ്.
  to: നമുക്കുവേണ്ടി മരിച്ചവൻ, നാം ഉണർന്നിരിക്കുന്നവരായാലും ഉറങ്ങുന്നവരായാലും[a], അവനോടുകൂടെ ഒരുമിച്ച് ജീവിക്കേണ്ടതിന്.
  rationale: The revision removes the syntactically unsuitable final copula and makes the ἵνα purpose clause function naturally as the continuation of ‘നമുക്കുവേണ്ടി മരിച്ചവൻ,’ whose full antecedent is supplied by the preceding verse. It otherwise preserves the draft's source-faithful ambiguity and its footnote anchor.
