translation:
  language: ml
  text: എല്ലാത്തരം തിന്മകളിൽനിന്നും വിട്ടുനിൽക്കുക.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തിന്മയുടെ എല്ലാ രൂപങ്ങളിൽനിന്നും”; പരമ്പരാഗതമായി, “തിന്മയായി കാണപ്പെടുന്ന എല്ലാറ്റിൽനിന്നും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέχεσθε
  choice: വിട്ടുനിൽക്കുക
  rationale: വർത്തമാനകാല മധ്യമപ്രയോഗ ആജ്ഞാരൂപത്തിന്റെ തുടർച്ചയായ അകന്നുനിൽക്കൽ എന്ന ആശയവും ബഹുവചന അഭിസംബോധനയുടെ ആജ്ഞാശക്തിയും സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀπὸ
  choice: നിന്നും
  rationale: ἀπέχεσθε എന്ന ക്രിയയോടൊപ്പമുള്ള വേർപാടിന്റെയും അകൽച്ചയുടെയും അർഥം വ്യക്തമാക്കുന്നു.
- source_word: παντὸς
  choice: എല്ലാ-
  rationale: εἴδους എന്ന ഏകവചന നാമത്തോടൊപ്പം ‘ഓരോ തരവും ഉൾപ്പെടെ’ എന്ന സമഗ്രത മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: εἴδους
  choice: തരം
  rationale: ഈ സന്ദർഭത്തിൽ ‘കാഴ്ച’ എന്നതിലുപരി ‘ഇനം/രൂപം’ എന്ന അർഥമാണ് കൂടുതൽ സാധ്യതയുള്ളത്; ‘തരം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: πονηροῦ
  choice: തിന്മ
  rationale: εἴδους-നെ വിശേഷിപ്പിക്കുന്ന പദത്തിന്റെ ധാർമ്മിക ദോഷം എന്ന അർഥം നേരിട്ടും ഗൗരവത്തോടെയും നൽകുന്നു.
theological_decisions:
- issue: ἀπὸ παντὸς εἴδους πονηροῦ എന്ന പ്രയോഗത്തിലെ εἴδους എന്നതിന്റെ അർഥം
  choice: എല്ലാത്തരം തിന്മ
  alternative: തിന്മയുടെ എല്ലാ രൂപം; തിന്മയായി കാണപ്പെടുന്നതെല്ലാം
  rationale: സന്ദർഭത്തിൽ εἶδος എന്നത് വെറും ബാഹ്യപ്രത്യക്ഷതയെക്കാൾ ‘തരം’ അഥവാ ‘രൂപം’ എന്ന അർഥം നൽകാനാണ് കൂടുതൽ സാധ്യത. ‘തിന്മയായി തോന്നുന്നതെല്ലാം’ എന്നു മുഖ്യപാഠത്തിൽ നൽകിയാൽ, യഥാർഥത്തിൽ തിന്മയല്ലെങ്കിലും അങ്ങനെ കാണപ്പെടുന്ന കാര്യങ്ങൾ ഒഴിവാക്കണം എന്ന അധിക ആശയം വരാം. യഥാർഥ പദസാധ്യതകൾ അടിക്കുറിപ്പിൽ സുതാര്യമായി സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ചുരുക്കവും ഗൗരവമുള്ളതുമായ ആജ്ഞാവാക്യം. ‘വിട്ടുനിൽക്കുക’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും തുടർച്ചയായ ഒഴിവാക്കലിന്റെ ഭാവം നൽകുന്നതുമാണ്. അടിക്കുറിപ്പിന്റെ [a] ചിഹ്നം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
