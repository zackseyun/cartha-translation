id: 1TH.5.15
reference: 1 Thessalonians 5:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁρᾶτε μή τις κακὸν ἀντὶ κακοῦ τινι ἀποδῷ, ἀλλὰ πάντοτε τὸ ἀγαθὸν ⸀διώκετε εἰς ἀλλήλους καὶ εἰς πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/015.yaml
  text: See to it that no one repays evil for evil to anyone[b][a], but always pursue what is good toward one another and toward all people.
translation:
  language: ml
  text: ആരും ആരോടും തിന്മയ്ക്കു പകരം തിന്മ തിരിച്ചുചെയ്യാതിരിക്കാൻ ശ്രദ്ധിക്കുവിൻ;[a] പകരം, പരസ്പരവും എല്ലാവരോടും എപ്പോഴും നന്മ ചെയ്യാൻ ഉത്സാഹത്തോടെ ശ്രമിക്കുവിൻ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ആരെങ്കിലും ആരോടെങ്കിലും തിന്മയ്ക്കു പകരം തിന്മ തിരിച്ചുചെയ്യാതിരിക്കട്ടെ എന്നു ശ്രദ്ധിക്കുവിൻ.”'
    reason: lexical_alternative
  - marker: b
    text: “പരസ്പരം ... എല്ലാവരോടും” എന്ന പ്രയോഗം സഹവിശ്വാസികളിൽനിന്ന് കൂടുതൽ വിശാലമായി എല്ലാ മനുഷ്യരിലേക്കും നീങ്ങുന്നതായിരിക്കാം.
    reason: cross_reference
lexical_decisions:
- source_word: ὁρᾶτε
  choice: ശ്രദ്ധിക്കുവിൻ
  rationale: ഇവിടെ ക്രിയ അക്ഷരാർഥത്തിലുള്ള ‘കാണുക’ എന്നതിലുപരി, സമൂഹം ജാഗ്രത പുലർത്തുകയും കാര്യം ഉറപ്പാക്കുകയും വേണമെന്ന ബഹുവചന ആജ്ഞയാണ്.
- source_word: μή τις
  choice: ആരും ... ചെയ്യാതിരിക്കാൻ
  rationale: ὁρᾶτε-യോടൊപ്പം വരുമ്പോൾ തടയേണ്ട കാര്യത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ ഘടന സ്വാഭാവികമായി നിരോധനാർഥം നൽകുന്നു.
- source_word: κακὸν ἀντὶ κακοῦ
  choice: തിന്മയ്ക്കു പകരം തിന്മ
  rationale: പ്രതികാരത്തെ സൂചിപ്പിക്കുന്ന ആവർത്തനഘടനയും κακόν എന്ന പദത്തിന്റെ വിശാലമായ ധാർമ്മിക അർഥവും നിലനിർത്തുന്നു.
- source_word: τινι
  choice: ആരോടും
  rationale: പ്രതികാരപ്രവൃത്തിയുടെ ലക്ഷ്യമായ അനിശ്ചിത വ്യക്തിയെ സൂചിപ്പിക്കുകയും ഉപദേശത്തിന്റെ വ്യാപ്തി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἀποδῷ
  choice: ചെയ്യുക
  rationale: സന്ദർഭത്തിൽ ‘തിരിച്ചുനൽകുക/പകരം ചെയ്യുക’ എന്ന അർഥം ‘പകരം’ എന്ന ഘടകത്തോടൊപ്പം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാകുന്നു.
- source_word: πάντοτε
  choice: എപ്പോഴും
  rationale: കാലപരമായ സമഗ്രതയെ ലളിതവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: τὸ ἀγαθὸν
  choice: നന്മ
  rationale: സുബ്സ്റ്റാന്റീവായ വിശേഷണത്തിന്റെ ധാർമ്മിക ആശയം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: διώκετε
  choice: ഉത്സാഹത്തോടെ ശ്രമിക്കുവിൻ
  rationale: διώκω സൂചിപ്പിക്കുന്ന സജീവവും നിരന്തരവുമായ പിന്തുടരലിന്റെ ശക്തി വെറും ‘ആഗ്രഹിക്കുക’ എന്നതിനെക്കാൾ വ്യക്തമായി നൽകുന്നു.
- source_word: εἰς ἀλλήλους
  choice: പരസ്പരം
  rationale: വിശ്വാസസമൂഹത്തിനുള്ളിലെ അന്യോന്യമായ നന്മയുടെ ദിശയെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: καὶ εἰς πάντας
  choice: എല്ലാവരോടും
  rationale: പ്രവൃത്തിയുടെ ദിശയും വിശാലമായ മനുഷ്യവ്യാപ്തിയും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ക്രിസ്തീയ ധാർമ്മിക ബാധ്യതയുടെ വ്യാപ്തി
  choice: ‘പരസ്പരം’ എന്നതിൽനിന്ന് ‘എല്ലാവരോടും’ എന്ന വിശാല വൃത്തത്തിലേക്കുള്ള നീക്കം വാചകത്തിൽ നിലനിർത്തി.
  alternative: ‘എല്ലാവരും’ എന്നത് എല്ലാ വിശ്വാസികളെ മാത്രം സൂചിപ്പിക്കുന്നു എന്നു വായിക്കുക.
  rationale: εἰς ἀλλήλους καὶ εἰς πάντας എന്ന ജോടി സ്വാഭാവികമായി സമൂഹത്തിനകത്തെ ബന്ധത്തിൽനിന്ന് കൂടുതൽ വിശാലമായ കൂട്ടത്തിലേക്കു നീങ്ങുന്നു; എന്നാൽ ‘എല്ലാവരും’ ആരെല്ലാമെന്നത് മുഖ്യവാചകത്തിൽ വ്യാഖ്യാനിച്ച് പരിമിതപ്പെടുത്തിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ആജ്ഞയുടെ ബഹുവചന സാമൂഹികസ്വഭാവവും പ്രതികാരനിരോധനവും നന്മയെ സജീവമായി പിന്തുടരേണ്ട ശക്തിയും നിലനിർത്തിയിരിക്കുന്നു.
