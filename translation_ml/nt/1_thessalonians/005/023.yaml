reference: 1 Thessalonians 5:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ὁ θεὸς τῆς εἰρήνης ἁγιάσαι ὑμᾶς ὁλοτελεῖς, καὶ ὁλόκληρον ὑμῶν τὸ πνεῦμα καὶ ἡ ψυχὴ καὶ τὸ σῶμα ἀμέμπτως ἐν τῇ παρουσίᾳ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ τηρηθείη.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/023.yaml
  text: May the God of peace himself sanctify you completely[b][a], and may your whole spirit and soul and body be kept blameless at the coming of our Lord Jesus the Messiah.
translation:
  language: ml
  text: സമാധാനത്തിന്റെ ദൈവം തന്നെ നിങ്ങളെ പൂർണമായി വിശുദ്ധീകരിക്കട്ടെ; നിങ്ങളുടെ ആത്മാവും പ്രാണനും ശരീരവും മുഴുവനായും[a] നമ്മുടെ കർത്താവായ യേശു മശീഹയുടെ[b] വരവിൽ കുറ്റമറ്റവയായി കാത്തുസൂക്ഷിക്കപ്പെടട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ആത്മാവും പ്രാണനും ശരീരവും” എന്ന പൗലോസിന്റെ വാക്കുകൾ മനുഷ്യസ്വഭാവത്തിന് മൂന്നു ഘടകങ്ങളുണ്ടെന്ന് പഠിപ്പിക്കുന്നുവോ, അതോ മനുഷ്യനെ മുഴുവനായി ഊന്നിപ്പറയുന്നതാണോ എന്നതിൽ വ്യാഖ്യാതാക്കൾക്കിടയിൽ അഭിപ്രായവ്യത്യാസമുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: പരമ്പരാഗതമായി, “നമ്മുടെ കർത്താവായ യേശുക്രിസ്തുവിന്റെ” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: alternative_reading
lexical_decisions:
- source_word: Αὐτὸς δὲ
  choice: ദൈവംതന്നെ
  rationale: αὐτός നൽകുന്ന ഊന്നൽ ‘തന്നെ’ വഴി നിലനിർത്തുന്നു. δέ ഇവിടെ പ്രാർത്ഥനാസ്വഭാവമുള്ള ആശംസയിലേക്കുള്ള മൃദുവായ മാറ്റമാണ്; മലയാളത്തിൽ പ്രത്യേക ബന്ധകപദം ചേർക്കാതെ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: ὁ θεὸς τῆς εἰρήνης
  choice: സമാധാനത്തിന്റെ ദൈവം
  rationale: ദൈവത്തെ സമാധാനത്താൽ വിശേഷിപ്പിക്കുന്ന പൗലോസിന്റെ സ്ഥിരപ്രയോഗം ഔപചാരികമായും വ്യക്തമായും നിലനിർത്തുന്നു.
- source_word: ἁγιάσαι ὑμᾶς ὁλοτελεῖς
  choice: നിങ്ങളെ പൂർണമായി വിശുദ്ധീകരിക്കട്ടെ
  rationale: ആശംസാപ്രാർത്ഥന സൂചിപ്പിക്കുന്ന optative രൂപം ‘-ട്ടെ’കൊണ്ട് പ്രകടമാക്കുന്നു; ὁλοτελεῖς സൂചിപ്പിക്കുന്ന സമഗ്രത ‘പൂർണമായി’ എന്നതിൽ നിലനിൽക്കുന്നു.
- source_word: ὁλόκληρον
  choice: മുഴുവനായി
  rationale: ആത്മാവ്, പ്രാണൻ, ശരീരം എന്നിവയുടെ അഖണ്ഡമായ സമഗ്രതയെ സൂചിപ്പിക്കുന്നു; പട്ടികയിലെ മൂന്ന് പദങ്ങളെയും ഒരുമിച്ച് വിശേഷിപ്പിക്കുന്ന വിധത്തിലാണ് സ്ഥാനം.
- source_word: τὸ πνεῦμα καὶ ἡ ψυχὴ καὶ τὸ σῶμα
  choice: ആത്മാവും പ്രാണനും ശരീരവും
  rationale: ഗ്രീക്കിലെ മൂന്ന് വ്യത്യസ്ത പദങ്ങളും ചുരുക്കുകയോ ഒരു നിർദിഷ്ട മനുഷ്യഘടനാസിദ്ധാന്തമായി വ്യാഖ്യാനിക്കുകയോ ചെയ്യാതെ നിലനിർത്തുന്നു.
- source_word: ἀμέμπτως ... τηρηθείη
  choice: കുറ്റമറ്റതായി കാത്തുസൂക്ഷിക്കപ്പെടട്ടെ
  rationale: ἀμέμπτως സൂചിപ്പിക്കുന്ന കുറ്റാരോപണത്തിന് ഇടയില്ലാത്ത അവസ്ഥയും τηρηθείηയുടെ ദൈവിക സംരക്ഷണത്തെ സൂചിപ്പിക്കുന്ന passive wish-ഉം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐν τῇ παρουσίᾳ
  choice: വരവിൽ
  rationale: ഇവിടെയുള്ള παρουσία യേശുവിന്റെ ഭാവിയിലെ വരവ്/ആഗമനം സൂചിപ്പിക്കുന്നു; ‘വരവിൽ’ ലളിതവും സന്ദർഭോചിതവുമാണ്.
- source_word: Ἰησοῦ Χριστοῦ
  choice: യേശു മശീഹ
  rationale: Χριστός എന്ന അഭിഷിക്തനായ രാജാവിന്റെ സ്ഥാനപ്പേര് ലിപ്യന്തരണം മാത്രം ചെയ്യാതെ ‘മശീഹ’യായി നൽകുന്നു.
theological_decisions:
- issue: ആത്മാവ്, പ്രാണൻ, ശരീരം എന്ന ത്രിവിധ പരാമർശം
  choice: മൂന്നു പദങ്ങളും അതേ വ്യത്യാസത്തോടെ നിലനിർത്തി; മനുഷ്യസ്വഭാവത്തെക്കുറിച്ചുള്ള ത്രിഭാഗസിദ്ധാന്തം വിവർത്തനത്തിൽ ഉറപ്പിച്ചില്ല.
  alternative: ഇത് മനുഷ്യനെ മുഴുവനായി സൂചിപ്പിക്കുന്ന അലങ്കാരപ്രയോഗമാണെന്ന് മുഖ്യവാചകത്തിൽ വ്യാഖ്യാനിക്കുക.
  rationale: മൂലപാഠം മൂന്നു പദങ്ങളും വ്യക്തമായി പറയുന്നു, എന്നാൽ അവയെ ഒരു സാങ്കേതിക മനുഷ്യശാസ്ത്രസിദ്ധാന്തമായി വിശദീകരിക്കുന്നില്ല. അതിനാൽ വ്യാഖ്യാനഭേദം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- issue: Χριστοῦ എന്ന സ്ഥാനപ്പേര്
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: Χριστός ഇവിടെ സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നു. അതിന്റെ മശീഹാസംബന്ധിയായ അർഥം വായനക്കാരന് വ്യക്തമാക്കാൻ ‘മശീഹ’ ഉപയോഗിക്കുന്നു; പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ആശംസാപ്രാർത്ഥനയുടെ ഭാവം ‘-ട്ടെ’ രൂപങ്ങളിലൂടെ നിലനിർത്തി. പ്രസിദ്ധീകരണത്തിനായി മുഖ്യവാചകത്തിൽ [b] ചിഹ്നവും ചേർക്കണം; നിലവിലെ സമർപ്പിത വാചകത്തിൽ ‘മശീഹ’യ്ക്ക് പിന്നാലെ അത് ഉദ്ദേശിച്ചിരിക്കുന്നു.
