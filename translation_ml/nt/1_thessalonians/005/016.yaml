translation:
  language: ml
  text: എപ്പോഴും സന്തോഷിക്കുവിൻ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘എപ്പോഴും സന്തോഷിച്ചുകൊണ്ടിരിക്കുവിൻ.’ വർത്തമാനകാല ആജ്ഞാരൂപം തുടരുന്ന പ്രവൃത്തിക്ക് ഊന്നൽ നൽകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: എപ്പോഴും
  rationale: ഈ ക്രിയാവിശേഷണം നിരന്തരതയെയോ എല്ലാ സമയത്തെയും സൂചിപ്പിക്കുന്നു. ‘എപ്പോഴും’ അതിന്റെ സമ്പൂർണമായ വ്യാപ്തി സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നിലനിർത്തുന്നു.
- source_word: χαίρετε
  choice: സന്തോഷിക്കുവിൻ
  rationale: χαίρω എന്ന ക്രിയയുടെ രണ്ടാം പുരുഷ ബഹുവചന വർത്തമാനകാല ആജ്ഞാരൂപമാണിത്. ‘സന്തോഷിക്കുവിൻ’ ആജ്ഞാഭാവവും സന്തോഷം എന്ന ആശയവുമായുള്ള നേരിട്ടുള്ള ബന്ധവും നിലനിർത്തുന്നു; വർത്തമാനകാലരൂപം തുടർന്നുകൊണ്ടിരിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കാനും കഴിയും.
