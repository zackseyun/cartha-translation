  source_fidelity: The draft accurately conveys the causal ὅτι, God's non-appointment of believers for wrath, the contrasting purpose of salvation, and διά with the genitive as means. ‘നിയോഗിച്ചു’ appropriately avoids imposing a stronger predestinarian formulation. The revised wording makes the two εἰς-phrases structurally parallel and keeps περιποίησις’ lexical breadth in the note.
