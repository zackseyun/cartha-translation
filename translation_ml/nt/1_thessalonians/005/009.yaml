id: 1TH.5.9
reference: 1 Thessalonians 5:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι οὐκ ἔθετο ἡμᾶς ὁ θεὸς εἰς ὀργὴν ἀλλὰ εἰς περιποίησιν σωτηρίας διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/009.yaml
  text: For God did not appoint us for wrath[a], but for obtaining salvation through our Lord Jesus the Messiah[b],
translation:
  language: ml
  text: കാരണം, ദൈവം നമ്മെ ക്രോധത്തിനായല്ല, നമ്മുടെ കർത്താവായ യേശു മശീഹ മുഖാന്തരം[b] രക്ഷ കൈവരിക്കുന്നതിനായി[a] നിയോഗിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘രക്ഷ സ്വന്തമാക്കാൻ’, ‘രക്ഷ നേടാൻ’, അല്ലെങ്കിൽ ഒരുപക്ഷേ ‘രക്ഷയിലേക്കായി സംരക്ഷിക്കപ്പെടാൻ’ എന്നും പരിഭാഷപ്പെടുത്താം. περιποίησις എന്ന ഗ്രീക്ക് നാമത്തിന് ‘കൈവരിക്കൽ’ എന്നതിനെക്കാൾ വിശാലമായ അർഥവ്യാപ്തിയുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: 'പരമ്പരാഗത പരിഭാഷ: ‘നമ്മുടെ കർത്താവായ യേശുക്രിസ്തുവിലൂടെ.’ Χριστός എന്ന ഗ്രീക്ക് പദവിയുടെ അർഥം നിലനിർത്താൻ ഇവിടെ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ പ്രബോധനത്തിന് അടിസ്ഥാനം നൽകുന്ന കാരണബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: οὐκ ἔθετο ἡμᾶς ὁ θεὸς
  choice: ദൈവം നമ്മെ ... നിയോഗിച്ചതല്ല
  rationale: τίθημι ഇവിടെ ഒരാളെ ഒരു അന്തിമഫലത്തിനായി വെക്കുക അഥവാ നിയോഗിക്കുക എന്ന അർഥത്തിലാണ്. ‘മുൻനിശ്ചയിച്ചു’ എന്ന കൂടുതൽ വ്യവസ്ഥാപിതമായ ദൈവശാസ്ത്രഭാരം ചേർക്കാതെ വാക്യത്തിന്റെ അവകാശവാദം നിലനിർത്തുന്നു.
- source_word: εἰς ὀργὴν
  choice: ക്രോധത്തിനായി
  rationale: പൗലോസിന്റെ ഈ സന്ദർഭത്തിൽ ὀργή ദൈവികവും അന്ത്യകാലസംബന്ധവുമായ ക്രോധത്തെ സൂചിപ്പിക്കുന്നു; ‘വിധി’ എന്നത് ആവശ്യത്തിലധികം വ്യാഖ്യാനാത്മകമാണ്.
- source_word: εἰς περιποίησιν σωτηρίας
  choice: രക്ഷ കൈവരിക്കാൻ
  rationale: περιποίησις നേടൽ, സ്വന്തമാക്കൽ, കൈവശം, സംരക്ഷണം എന്നീ അർഥവ്യാപ്തികൾക്കിടയിൽ ഇവിടെ ഉദ്ദേശിക്കപ്പെട്ട ഫലത്തെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്ന പ്രയോഗമാണിത്; വിശാലമായ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: നമ്മുടെ കർത്താവായ യേശു മശീഹയിലൂടെ
  rationale: ജനിറ്റീവിനോടുകൂടിയ διά മാർഗം അഥവാ കർത്തൃത്വം സൂചിപ്പിക്കുന്നതിനാൽ ‘യിലൂടെ’ എന്നു പരിഭാഷപ്പെടുത്തി. Χριστός വ്യക്തിനാമത്തോടൊപ്പം വന്നാലും അർഥസമ്പന്നമായ പദവിയായതിനാൽ ‘മശീഹ’ എന്നു നൽകി.
theological_decisions:
- issue: ἔθετο എന്നതിന് ശക്തമായ മുൻനിശ്ചയാർത്ഥം നൽകണമോ
  choice: നിയോഗിച്ചു
  alternative: മുൻനിശ്ചയിച്ചു
  rationale: വാക്യം വിശ്വാസികളെ സംബന്ധിച്ച ദൈവത്തിന്റെ ഉദ്ദേശ്യമോ നിയോഗമോ പ്രസ്താവിക്കുന്നു; എന്നാൽ പ്രത്യേകമായ ഒരു മുൻനിശ്ചയസിദ്ധാന്തം ഇവിടെ നിർബന്ധമായി ഉൾക്കൊള്ളുന്നില്ല.
- issue: Χριστοῦ പദവിയായോ പേരിന്റെ ഭാഗമായോ പരിഭാഷപ്പെടുത്തണമോ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: Ἰησοῦ എന്ന പേരിനു പിന്നാലെ വന്നാലും Χριστός ‘അഭിഷിക്തൻ/മശീഹ’ എന്ന ദൈവശാസ്ത്രപരമായ പദവിയുടെ അർഥം വഹിക്കുന്നു. പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ വിരുദ്ധഘടന (‘ക്രോധത്തിനായല്ല ... രക്ഷ കൈവരിക്കാൻ’) നിലനിർത്തി; ദൈവശാസ്ത്രപരമായ അനാവശ്യ വിശദീകരണം പ്രധാനവാക്യത്തിൽ ചേർത്തിട്ടില്ല.
