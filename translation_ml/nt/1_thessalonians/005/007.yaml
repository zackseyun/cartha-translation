  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ γὰρ καθεύδοντες νυκτὸς καθεύδουσιν, καὶ οἱ μεθυσκόμενοι νυκτὸς μεθύουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/007.yaml
  text: For those who sleep, sleep at night, and those who get drunk, get drunk at night.
translation:
  language: ml
  text: കാരണം, ഉറങ്ങുന്നവർ രാത്രിയിലാണ് ഉറങ്ങുന്നത്; മദ്യലഹരിയിലാകുന്നവരും രാത്രിയിലാണ് മദ്യലഹരിയിലാകുന്നത്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ പ്രബോധനത്തിന് വിശദീകരണമായ അടിസ്ഥാനം അവതരിപ്പിക്കുന്ന ബന്ധകത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: οἱ καθεύδοντες ... καθεύδουσιν
  choice: ഉറങ്ങുന്നവർ ... ഉറങ്ങുന്നു
  rationale: കർത്തൃവാചക കൃതന്തത്തിന്റെ പൊതുവായ അർഥവും മൂലത്തിലെ പദാവർത്തനവും സമാന്തരഘടനയും നിലനിർത്തുന്നു.
- source_word: νυκτός
  choice: രാത്രിയിലാണ്
  rationale: ക്രിയാവിശേഷണമായി ഉപയോഗിച്ചിരിക്കുന്ന ഷഷ്ഠീവിഭക്തിയുടെ കാലസൂചന സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും രാത്രിയോടുള്ള ഊന്നൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: οἱ μεθυσκόμενοι ... μεθύουσιν
  choice: മദ്യപിക്കുന്നവർ ... മദ്യപിക്കുന്നു
  rationale: ലഹരിയിലാകുന്ന പ്രവൃത്തിയെ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും മാന്യവുമായ ഭാഷയിൽ അറിയിക്കുന്നു; മൂലത്തിലെ ആവർത്തനവും സമാന്തരതയും സംരക്ഷിക്കുന്നു.
- source_word: καί
  choice: ;
  rationale: രണ്ട് സമാന്തര ഉപവാക്യങ്ങളെ മലയാളത്തിൽ വ്യക്തമായി ബന്ധിപ്പിക്കാൻ അർധവിരാമം ഉപയോഗിച്ചു; ബന്ധത്തിന്റെ ഏകോപനസ്വഭാവം ഘടനയിലൂടെ നിലനിൽക്കുന്നു.
theological_decisions:
- issue: ഉറക്കവും മദ്യലഹരിയും അക്ഷരാർഥത്തിലോ രൂപകാർഥത്തിലോ വിവർത്തനം ചെയ്യുക
  choice: പ്രധാനപാഠത്തിൽ സാധാരണ രാത്രികാല പ്രവൃത്തികളായ ഉറക്കവും മദ്യപാനവും അക്ഷരാർഥത്തിൽ നിലനിർത്തി
  alternative: ആത്മീയ അശ്രദ്ധയും ധാർമിക അസംയമവും എന്ന് വ്യാഖ്യാനിച്ച് വിവർത്തനം ചെയ്യുക
  rationale: സന്ദർഭത്തിൽ പൗലോസ് സാധാരണ രാത്രികാല പെരുമാറ്റത്തെ ആത്മീയ ജാഗ്രതയ്ക്കുള്ള ഉപമയായി ഉപയോഗിക്കുന്നു. അക്ഷരാർഥം നിലനിർത്തുന്നത് ഉപമയെ സംരക്ഷിക്കുകയും വ്യാഖ്യാനം പാഠത്തിൽ ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ രണ്ടു സമാന്തര ഉപവാക്യങ്ങളും പദാവർത്തനവും സൂക്ഷിച്ചിട്ടുണ്ട്; ‘രാത്രിയിലാണ്’ എന്ന രൂപം ഇരുവാക്യങ്ങളിലെയും ഊന്നൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
