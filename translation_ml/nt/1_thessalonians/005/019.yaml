  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആത്മാവിനെ.” ഗ്രീക്കുപദത്തിന് പൊതുവായി “ആത്മാവ്” എന്നും അർഥമാകാം; എന്നാൽ തുടർന്ന് പ്രവചനങ്ങളെക്കുറിച്ചു പറയുന്നതിനാൽ ഇവിടെ പരിശുദ്ധാത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത് എന്നതാണ് കൂടുതൽ സാധ്യത.
