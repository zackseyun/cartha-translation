lexical_decisions:
- source_word: τὸ πνεῦμα
  choice: ആത്മാവിനെ
  rationale: സന്ദർഭത്തിൽ, പ്രത്യേകിച്ച് തുടർന്നുള്ള പ്രവചനങ്ങളെക്കുറിച്ചുള്ള പരാമർശത്തിന്റെ വെളിച്ചത്തിൽ, ഇത് പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്നതാണ് ഏറ്റവും സാധ്യത. മലയാളത്തിൽ ആദരസൂചകമായ പ്രയോഗവും അടിക്കുറിപ്പും ഈ അർഥം വ്യക്തമാക്കുന്നു; എന്നിരുന്നാലും മൂലഗ്രീക്കിൽ വലിയക്ഷരവ്യത്യാസമില്ല.
- source_word: μὴ
  choice: അരുത്
  rationale: വർത്തമാനകാല ആജ്ഞാരൂപത്തോടു ചേർന്ന μή നിരോധനം പ്രകടിപ്പിക്കുന്നു; മലയാളത്തിലെ സ്വാഭാവിക നിരോധനരൂപം ‘അരുത്’ ആണ്.
- source_word: σβέννυτε
  choice: കെടുത്തിക്കളയരുത്
  rationale: σβέννυμι തീ അണയ്ക്കുക/കെടുത്തുക എന്ന അടിസ്ഥാനരൂപകം വഹിക്കുന്നു. ‘കെടുത്തിക്കളയുക’ ആത്മാവിന്റെ പ്രവർത്തനത്തെ അടിച്ചമർത്തുന്നുവെന്ന രൂപകബലം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: πνεῦμα എന്ന പദത്തിന്റെ സൂചിതാർത്ഥം
  choice: പരിശുദ്ധാത്മാവ്
  alternative: മനുഷ്യാത്മാവ്; ആത്മീയ ഉത്സാഹം അല്ലെങ്കിൽ വരം
  rationale: 20–21 വാക്യങ്ങളിലെ പ്രവചനവും വിവേചനവും പരിശുദ്ധാത്മാവിന്റെ സഭയിലെ പ്രവർത്തനത്തെയാണ് ഇവിടെ പ്രധാനമായി സൂചിപ്പിക്കുന്നതെന്ന് കാണിക്കുന്നു. എങ്കിലും പദത്തിന് പൊതുവായി ‘ആത്മാവ്’ എന്നും അർഥമാകാമെന്ന യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ചുരുക്കവും ഗൗരവമുള്ളതുമായ നിരോധനവാക്യം. തീ കെടുത്തുന്നതിന്റെ മൂലരൂപകം നിലനിർത്തിയിരിക്കുന്നു; ഭാഷ സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമാണ്.
