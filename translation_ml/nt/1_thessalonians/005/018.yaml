  text: ἐν παντὶ εὐχαριστεῖτε· τοῦτο γὰρ θέλημα θεοῦ ἐν Χριστῷ Ἰησοῦ εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/018.yaml
  text: Give thanks in everything[b][a], for this is God's will in Messiah Jesus for you.
translation:
  language: ml
  text: എല്ലാറ്റിലും[a] നന്ദി അർപ്പിക്കുവിൻ. കാരണം, മശീഹയായ യേശുവിൽ[b] നിങ്ങളെ സംബന്ധിച്ച ദൈവഹിതം ഇതാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “എല്ലാ സാഹചര്യങ്ങളിലും.” ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “എല്ലാറ്റിലും” എന്നാണ്. വിശ്വാസികൾ ഏതു സാഹചര്യത്തിലും നന്ദി അർപ്പിക്കണം എന്നതാണ് ഇതിന്റെ സ്വാഭാവിക അർഥം; തിന്മയ്ക്കുതന്നെ നന്ദി അർപ്പിക്കണം എന്ന് നിർബന്ധമായി അർഥമാക്കേണ്ടതില്ല.'
    reason: lexical_alternative
  - marker: b
    text: 'പരമ്പരാഗത പരിഭാഷ: “ക്രിസ്തുയേശുവിൽ.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν παντί
  choice: എല്ലാറ്റിലും
  rationale: ἐν എന്ന പൂർവപ്രത്യയവും ദത്തിവിലുള്ള παντίയും നന്ദി അർപ്പിക്കേണ്ട സാഹചര്യമോ പരിധിയോ സൂചിപ്പിക്കുന്നു. അതിനാൽ ‘എല്ലാറ്റിനുംവേണ്ടി’ എന്നതിനു പകരം ഗ്രീക്കിന്റെ സംക്ഷിപ്തത നിലനിർത്തുന്ന ‘എല്ലാറ്റിലും’ തിരഞ്ഞെടുത്തു.
- source_word: εὐχαριστεῖτε
  choice: നന്ദി അർപ്പിക്കുവിൻ
  rationale: വർത്തമാനകാല സജീവ ആജ്ഞാരൂപം തുടർന്നുകൊണ്ടിരിക്കേണ്ട പ്രവൃത്തിയെ ആഹ്വാനം ചെയ്യുന്നു. ‘നന്ദി അർപ്പിക്കുവിൻ’ നേരിട്ടുള്ളതും മാന്യവുമായ ആജ്ഞയാണ്; ക്രിയാഭാവം അതിവ്യാഖ്യാനിക്കാതിരിക്കാൻ ‘എപ്പോഴും’ ചേർത്തിട്ടില്ല.
- source_word: τοῦτο
  choice: ഇതാണ്
  rationale: ഈ സൂചകസർവനാമം തൊട്ടുമുമ്പുള്ള നന്ദി അർപ്പിക്കാനുള്ള ആഹ്വാനത്തിലേക്കാണ് പ്രധാനമായും വിരൽചൂണ്ടുന്നത്; ഗ്രീക്കിന്റെ സംക്ഷിപ്തത നിലനിർത്തി.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻ ആജ്ഞയുടെ അടിസ്ഥാനമോ കാരണമോ അവതരിപ്പിക്കുന്ന ബന്ധകമായി സ്വാഭാവികമായ ആധുനിക മലയാളം ഉപയോഗിച്ചു.
- source_word: θέλημα θεοῦ
  choice: ദൈവഹിതം
  rationale: ദൈവത്തിന്റെ ഇഷ്ടം/ഹിതം എന്ന ഉടമസ്ഥബന്ധം മലയാളത്തിലെ സ്ഥാപിതവും സംക്ഷിപ്തവുമായ ‘ദൈവഹിതം’ എന്ന പദം കൃത്യമായി നൽകുന്നു.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: മശീഹയായ യേശുവിൽ
  rationale: Χριστός ഇവിടെ യേശുവിന്റെ പദവിയായി അർത്ഥസുതാര്യമായി നിലകൊള്ളുന്നതിനാൽ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി. ἐν നിലനിർത്തി പൗലോസിന്റെ ‘യേശുവിൽ’ എന്ന ബന്ധഭാഷ സംരക്ഷിച്ചു.
- source_word: εἰς ὑμᾶς
  choice: നിങ്ങളെ സംബന്ധിച്ച
  rationale: വ്യക്തികളോടൊപ്പം εἰς ഇവിടെ ദിശയെയോ പരാമർശബന്ധത്തെയോ സൂചിപ്പിക്കുന്നു. തെസ്സലോനിക്യ വിശ്വാസികളെ സംബന്ധിക്കുന്ന ദൈവഹിതം എന്ന അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: Χριστῷ എന്നത് പദവിയായി പരിഭാഷപ്പെടുത്തണമോ പരമ്പരാഗത രൂപത്തിൽ നൽകണമോ
  choice: മശീഹയായ യേശു
  alternative: ക്രിസ്തുയേശു
  rationale: Χριστός ഇവിടെ അർത്ഥമുള്ള പദവിയായതിനാൽ അതിന്റെ യഹൂദ മശീഹാ പശ്ചാത്തലം ‘മശീഹ’ സംരക്ഷിക്കുന്നു. പരിചിതമായ പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- issue: എല്ലാ കാര്യങ്ങൾക്കും നന്ദി പറയണമെന്നോ എല്ലാ സാഹചര്യങ്ങളിലും നന്ദി പറയണമെന്നോ
  choice: എല്ലാറ്റിലും നന്ദി അർപ്പിക്കുവിൻ
  alternative: എല്ലാ സാഹചര്യങ്ങളിലും നന്ദി അർപ്പിക്കുവിൻ; എല്ലാറ്റിനുംവേണ്ടി നന്ദി അർപ്പിക്കുവിൻ
  rationale: ἐν παντί നന്ദിയുടെ സാഹചര്യമോ പരിധിയോ ആണ് ഏറ്റവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്. തിന്മയ്ക്കുതന്നെ നന്ദി പറയണം എന്ന അധിക നിഗമനം വാക്യത്തിൽ ഇറക്കിവയ്ക്കാതെ ഗ്രീക്കിന്റെ തുറന്ന ഘടന നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച മാന്യഭാവത്തോടെ തയ്യാറാക്കി. ‘അർപ്പിക്കുവിൻ’ ആജ്ഞയുടെ ഗൗരവം സൂക്ഷിക്കുന്നു; വാക്യഘടന ഗ്രീക്കിനോട് അടുത്തിരിക്കുമ്പോഴും മലയാളത്തിൽ സ്വാഭാവികമാണ്.
