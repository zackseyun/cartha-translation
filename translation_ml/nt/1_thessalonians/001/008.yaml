id: 1TH.1.8
reference: 1 Thessalonians 1:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀφ’ ὑμῶν γὰρ ἐξήχηται ὁ λόγος τοῦ κυρίου οὐ μόνον ἐν τῇ Μακεδονίᾳ ⸀καὶ Ἀχαΐᾳ, ⸀ἀλλ’ ἐν παντὶ τόπῳ ἡ πίστις ὑμῶν ἡ πρὸς τὸν θεὸν ἐξελήλυθεν, ὥστε μὴ χρείαν ⸂ἔχειν ἡμᾶς⸃ λαλεῖν τι·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/008.yaml
  text: For from you the word of the Lord has sounded forth[a], not only in Macedonia and Achaia, but in every place your faith toward God has gone out, so that we have no need to say anything.
translation:
  language: ml
  text: നിങ്ങളിൽനിന്ന് കർത്താവിന്റെ വചനം മുഴങ്ങിപ്പുറപ്പെട്ടിരിക്കുന്നു; മക്കെദോന്യയിലും അഖായയിലും മാത്രമല്ല, എല്ലായിടത്തും ദൈവത്തോടുള്ള നിങ്ങളുടെ വിശ്വാസം[a] പരന്നിരിക്കുന്നു. അതുകൊണ്ട് ഞങ്ങൾക്ക് ഒന്നും പറയേണ്ട ആവശ്യമില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദൈവത്തിലുള്ള നിങ്ങളുടെ വിശ്വാസം.” ഗ്രീക്കിൽ കൂടുതൽ അക്ഷരാർഥമായി, “ദൈവത്തോടുള്ള നിങ്ങളുടെ വിശ്വാസം” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξήχηται
  choice: മുഴങ്ങിപ്പുറപ്പെട്ടിരിക്കുന്നു
  rationale: ശക്തമായി മുഴങ്ങി ഒരു ഉറവിടത്തിൽനിന്ന് പുറത്തേക്കു വ്യാപിക്കുന്ന ശ്രാവ്യരൂപകം നിലനിർത്തുന്നു; ഗ്രീക്കിലെ perfect കാലത്തിന്റെ ഇപ്പോഴുള്ള ഫലവും പ്രകടമാക്കുന്നു.
- source_word: ὁ λόγος τοῦ κυρίου
  choice: കർത്താവിന്റെ വചനം
  rationale: പൗലോസിന്റെ പരിചിതമായ പ്രയോഗം നിലനിർത്തുകയും കർത്താവിൽനിന്നുള്ളതോ കർത്താവിനെക്കുറിച്ചുള്ളതോ എന്ന ജനിറ്റീവിന്റെ സ്വാഭാവിക വിശാലത തുറന്നുവയ്ക്കുകയും ചെയ്യുന്നു.
- source_word: Μακεδονίᾳ καὶ Ἀχαΐᾳ
  choice: മക്കെദോന്യയിലും അഖായയിലും
  rationale: പ്രദേശനാമങ്ങളുടെ മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: ἀλλ’ ἐν παντὶ τόπῳ
  choice: എല്ലായിടത്തും
  rationale: παντὶ τόπῳ എന്നതിന്റെ വിതരണാർത്ഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἡ πίστις ὑμῶν ἡ πρὸς τὸν θεόν
  choice: ദൈവത്തോടുള്ള നിങ്ങളുടെ വിശ്വാസം
  rationale: πρὸς എന്നതിന്റെ ‘നേരെ/അഭിമുഖമായി’ എന്ന ദിശാസൂചന മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു; ‘ദൈവത്തിലുള്ള വിശ്വാസം’ എന്ന വ്യാഖ്യാനപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἐξελήλυθεν
  choice: പരന്നിരിക്കുന്നു
  rationale: വിശ്വാസത്തെക്കുറിച്ച് മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗമാണിത്; പുറത്തേക്കു പോയി എല്ലായിടത്തും എത്തിയെന്ന ഗ്രീക്ക് ചലനരൂപകത്തിന്റെ സന്ദർഭാർഥം അറിയിക്കുന്നു.
- source_word: ὥστε μὴ χρείαν ἔχειν ἡμᾶς
  choice: അതുകൊണ്ട് ഞങ്ങൾ … ആവശ്യമില്ല
  rationale: ὥστε സൂചിപ്പിക്കുന്ന ഫലബന്ധവും ‘ഞങ്ങൾക്ക് ആവശ്യമില്ല’ എന്ന ആശയവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: λαλεῖν τι
  choice: ഒന്നും പറയേണ്ട
  rationale: ‘എന്തെങ്കിലും സംസാരിക്കുക’ എന്ന അക്ഷരാർഥത്തേക്കാൾ സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളപ്രയോഗം.
theological_decisions:
- issue: πίστις എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: വിശ്വാസം
  alternative: വിശ്വസ്തത; ആശ്രയം
  rationale: ഈ സന്ദർഭത്തിൽ തെസ്സലൊനീക്യരുടെ ദൈവത്തോടുള്ള വിശ്വാസപ്രതികരണമാണ് പ്രധാനമായി ഉദ്ദേശിക്കുന്നത്; അവരുടെ വിശ്വസ്തത എന്ന അർഥമല്ല. അതിനാൽ ‘വിശ്വാസം’ ഏറ്റവും യോജിക്കുന്നു.
- issue: πρὸς τὸν θεόν എന്ന ബന്ധപ്രയോഗം
  choice: ദൈവത്തോടുള്ള
  alternative: ദൈവത്തിലുള്ള
  rationale: മൂലത്തിലെ πρὸς എന്ന ദിശാസൂചനയെ അനാവശ്യമായി ‘ൽ’ എന്നാക്കി തീർപ്പാക്കാതെ നിലനിർത്തുന്നു; സാധാരണ വിശ്വാസപ്രയോഗമായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ആദ്യ ക്രിയയിലെ ശ്രാവ്യരൂപകം നിലനിർത്തിയപ്പോൾ, രണ്ടാമത്തെ ക്രിയ വിശ്വാസം വ്യാപകമായി അറിയപ്പെട്ടതെന്ന ആശയം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വിശ്വാസപ്രയോഗത്തിനരികിൽ ചേർത്തിരിക്കുന്നു.
