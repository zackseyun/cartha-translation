  naturalness: «ദൈവത്താൽ സ്നേഹിക്കപ്പെട്ട സഹോദരന്മാരേ» സ്വാഭാവികവും മാന്യവുമാണ്. എന്നാൽ «നിങ്ങളുടെ തിരഞ്ഞെടുപ്പ് ഞങ്ങൾ അറിയുന്നു» എന്ന പദക്രമവും നാമപ്രയോഗവും അല്പം അസ്വാഭാവികവും അർഥദ്വയസാധ്യതയുള്ളതുമാണ്. «നിങ്ങൾ തിരഞ്ഞെടുക്കപ്പെട്ടിരിക്കുന്നു എന്നു ഞങ്ങൾ അറിയുന്നു» ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
