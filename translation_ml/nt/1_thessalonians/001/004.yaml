  to: ദൈവത്താൽ സ്നേഹിക്കപ്പെട്ട സഹോദരന്മാരേ[a], നിങ്ങൾ തിരഞ്ഞെടുക്കപ്പെട്ടിരിക്കുന്നു എന്നു ഞങ്ങൾ അറിയുന്നു.[b]
  rationale: ഗ്രീക്കിലെ εἰδότες-നെ മുൻവാക്യത്തിൽനിന്നു തുടർന്നുവരുന്ന വിശദീകരണമായി «ഞങ്ങൾ അറിയുന്നു» എന്നു സ്വാഭാവിക മലയാളത്തിൽ നൽകിയിരിക്കുന്നു. ἠγαπημένοι ὑπὸ θεοῦ-യുടെ കർമണിഭാവം നിലനിർത്തി. ἐκλογὴν ὑμῶν എന്ന നാമപ്രയോഗം മലയാളത്തിൽ സജീവമായ ‘നിങ്ങളുടെ തിരഞ്ഞെടുപ്പ്’ എന്ന അർഥം ഉളവാക്കാനിടയുള്ളതിനാൽ, ദൈവശാസ്ത്രവ്യാഖ്യാനം ചേർക്കാതെ തന്നെ അതിന്റെ അടിസ്ഥാന കർമണിസംബന്ധിയായ സൂചന വ്യക്തമാക്കുന്ന «നിങ്ങൾ തിരഞ്ഞെടുക്കപ്പെട്ടിരിക്കുന്നു എന്നു» എന്ന രൂപം ഉപയോഗിച്ചു. നാമരൂപസാദ്ധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
