source:
  edition: SBLGNT
  text: εἰδότες, ἀδελφοὶ ἠγαπημένοι ὑπὸ ⸀θεοῦ, τὴν ἐκλογὴν ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/004.yaml
  text: For we know[a], brothers loved by God, your election[b],
translation:
  language: ml
  text: ദൈവത്താൽ സ്നേഹിക്കപ്പെട്ട സഹോദരന്മാരേ[a], നിങ്ങൾ തിരഞ്ഞെടുക്കപ്പെട്ടിരിക്കുന്നു എന്നു ഞങ്ങൾ അറിയുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സഹോദരീസഹോദരന്മാരേ.” ഗ്രീക്കിൽ “സഹോദരന്മാർ” എന്നാണ്; എന്നാൽ പൗലോസിന്റെ ലേഖനങ്ങളിൽ ഈ പദം പലപ്പോഴും വിശ്വാസിസമൂഹം മുഴുവനെയും അഭിസംബോധന ചെയ്യുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “നിങ്ങളുടെ തിരഞ്ഞെടുക്കപ്പെടൽ.” ഗ്രീക്കിലെ നാമപദം “തിരഞ്ഞെടുപ്പ്” എന്നാണ്. ഇവിടെ പാഠം പറയുന്നതിലപ്പുറം, ഈ പദത്തെ ഒരു പ്രത്യേക ദൈവശാസ്ത്രസംവിധാനത്തിന്റെ അർഥത്തിലേക്ക് ചുരുക്കരുത്.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰδότες
  choice: ഞങ്ങൾ അറിയുന്നു
  rationale: ഗ്രീക്കിൽ ഇത് ‘അറിഞ്ഞുകൊണ്ട്’ എന്ന അർഥമുള്ള കൃതന്തമാണെങ്കിലും, മുൻവാക്യത്തിൽനിന്നു തുടരുന്ന വിശദീകരണപ്രവാഹം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമായ ക്രിയാരൂപത്തിലാക്കുന്നു. ഈ ഒറ്റ വാക്യഭാഗത്തിൽ ബന്ധകമായ ‘എന്തെന്നാൽ’ ചേർക്കാതെ മൂലത്തിലെ കൃതന്തരൂപത്തിന്റെ തുറന്ന ബന്ധം നിലനിർത്തുന്നു.
- source_word: ἀδελφοὶ
  choice: സഹോദരന്മാരേ
  rationale: ഗ്രീക്ക് പദം വ്യാകരണപരമായി പുല്ലിംഗ ബഹുവചനവും ഇവിടെ സംബോധനയും ആണ്. പൗലോസിന്റെ ലേഖനങ്ങളിൽ ഇത് സാധാരണയായി വിശ്വാസിസമൂഹം മുഴുവനെയും ഉൾക്കൊള്ളാമെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἠγαπημένοι ὑπὸ θεοῦ
  choice: ദൈവത്താൽ സ്നേഹിക്കപ്പെട്ട
  rationale: പൂർണ്ണകാല കർമണി കൃതന്തം ദൈവത്തിന്റെ സ്നേഹപ്രവൃത്തിയുടെ ഫലമായി നിലനിൽക്കുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു. ‘ദൈവത്താൽ സ്നേഹിക്കപ്പെട്ട’ എന്നത് കർമണിഭാവവും പ്രവർത്താവായ ദൈവത്തെയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἐκλογὴν
  choice: തിരഞ്ഞെടുപ്പ്
  rationale: ഗ്രീക്ക് നാമത്തിന്റെ ഔപചാരികവും ദൈവശാസ്ത്രപരവുമായ ഭാരം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപദമാണിത്. ഒരു പ്രത്യേക ദൈവശാസ്ത്രസംവിധാനത്തിന്റെ അർഥം വാക്യത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: ὑμῶν
  choice: നിങ്ങളുടെ
  rationale: ἐκλογήയെ വിശേഷിപ്പിക്കുന്ന ഉടമസ്ഥതാസംബന്ധിയായ ജനിറ്റീവിനെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; ‘നിങ്ങൾ തിരഞ്ഞെടുക്കപ്പെട്ടത്’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: ദൈവശാസ്ത്രപരമായി വിവാദമുള്ള ἐκλογήയുടെ പരിഭാഷ
  choice: തിരഞ്ഞെടുപ്പ്
  alternative: നിങ്ങൾ തിരഞ്ഞെടുക്കപ്പെട്ടത്; ദൈവം നിങ്ങളെ തിരഞ്ഞെടുത്തത്
  rationale: വാക്യം തെസ്സലൊനീക്യ വിശ്വാസികളുടെ തിരഞ്ഞെടുപ്പിനെ ഉറപ്പിക്കുന്നു; എന്നാൽ അതിന്റെ വിശാലമായ ദൈവശാസ്ത്രവ്യാഖ്യാനം ഇവിടെ തീർപ്പാക്കുന്നില്ല. നാമരൂപം നിലനിർത്തുന്നത് മൂലത്തിലെ ആശയസാന്ദ്രതയും വ്യാഖ്യാനപരമായ സംഘർഷവും സംരക്ഷിക്കുന്നു.
- issue: ἀδελφοίയെ മുഖ്യപാഠത്തിൽ വ്യക്തമായി ഉൾക്കൊള്ളുന്ന ലിംഗഭാഷയായി വികസിപ്പിക്കണമോ
  choice: സഹോദരന്മാരേ
  alternative: സഹോദരീ സഹോദരന്മാരേ; സഹോദരങ്ങളേ
  rationale: മൂലത്തിലെ വ്യാകരണപരമായ പുല്ലിംഗ ബഹുവചനം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു. അഭിസംബോധന സഭ മുഴുവനെയും ഉൾക്കൊള്ളാൻ സാധ്യതയുള്ളതിനാൽ ആ പ്രയോഗവ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ ശൈലി. ‘തിരഞ്ഞെടുപ്പ്’ എന്ന ഔപചാരിക നാമം ദൈവശാസ്ത്രപരമായ ഭാരം കാത്തുസൂക്ഷിക്കുന്നു; സംബോധനയിൽ മൂലത്തിലെ പുല്ലിംഗരൂപം നിലനിർത്തി ഉൾക്കൊള്ളുന്ന പ്രയോഗസാധ്യത അടിക്കുറിപ്പിലാക്കി.
