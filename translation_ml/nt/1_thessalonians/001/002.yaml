id: 1TH.1.2
reference: 1 Thessalonians 1:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εὐχαριστοῦμεν τῷ θεῷ πάντοτε περὶ πάντων ὑμῶν ⸀μνείαν ποιούμενοι ἐπὶ τῶν προσευχῶν ἡμῶν, ἀδιαλείπτως
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/002.yaml
  text: We always give thanks to God for all of you[a], making mention of you in our prayers unceasingly,
translation:
  language: ml
  text: നിങ്ങൾ എല്ലാവർക്കും വേണ്ടി ഞങ്ങൾ എപ്പോഴും ദൈവത്തിന് നന്ദി പറയുന്നു; ഞങ്ങളുടെ പ്രാർഥനകളിൽ നിങ്ങളെ ഓർക്കുകയും ചെയ്യുന്നു—ഇടവിടാതെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഇടവിടാതെ” എന്നത് പ്രത്യേകമായി “ഞങ്ങളുടെ പ്രാർഥനകളിൽ നിങ്ങളെ ഓർക്കുകയും ചെയ്യുന്നു” എന്നതിനോടോ, കൂടുതൽ പൊതുവായി “ദൈവത്തിന് നന്ദി പറയുന്നു” എന്നതിനോടോ ചേർത്ത് മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐχαριστοῦμεν
  choice: ഞങ്ങൾ ... നന്ദി പറയുന്നു
  rationale: വർത്തമാനകാല കർത്തരി നിർദേശകരൂപവും ഒന്നാംപുരുഷ ബഹുവചനവും നിലനിർത്തുന്നു; പൗലോസിന്റെ നന്ദിപ്രസ്താവനകളിൽ εὐχαριστέω എന്നതിന്റെ സ്വാഭാവികമായ മലയാളപ്രയോഗമാണിത്.
- source_word: τῷ θεῷ
  choice: ദൈവത്തിനു
  rationale: εὐχαριστοῦμεν എന്ന ക്രിയയുടെ ദത്തിവിഭക്തിയിലുള്ള സ്വീകർത്താവിനെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: πάντοτε
  choice: എപ്പോഴും
  rationale: πάντοτε എന്നതിന്റെ കാലസംബന്ധമായ അർഥം സാധാരണ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: περὶ πάντων ὑμῶν
  choice: നിങ്ങൾ എല്ലാവർക്കുംവേണ്ടി
  rationale: περί + ഷഷ്ഠീവിഭക്തി ഇവിടെ സംബന്ധമോ കരുതലോ സൂചിപ്പിക്കുന്നു; നന്ദിപ്രസ്താവനയിൽ “എല്ലാവർക്കുംവേണ്ടി” സ്വാഭാവികവും πάντων ὑμῶν എന്നതിന്റെ ഉൾക്കൊള്ളുന്ന ഊന്നൽ നിലനിർത്തുന്നതുമാണ്.
- source_word: μνείαν ποιούμενοι
  choice: നിങ്ങളെ ഓർക്കുകയും ചെയ്യുന്നു
  rationale: അക്ഷരാർഥത്തിൽ ‘പരാമർശം നടത്തിക്കൊണ്ട്’ എന്നാണെങ്കിലും, പ്രാർഥനാസന്ദർഭത്തിൽ ‘ഓർക്കുന്നു’ എന്നത് സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്. സന്ദർഭത്തിൽനിന്നുള്ള ‘നിങ്ങളെ’ എന്ന കർമം വ്യക്തമാക്കിയിരിക്കുന്നു; “ചെയ്യുന്നു” എന്ന ചേർക്കൽ നന്ദിപ്രസ്താവനയോടുള്ള പങ്കാളിത്തബന്ധം നിലനിർത്തുന്നു.
- source_word: ἐπὶ τῶν προσευχῶν ἡμῶν
  choice: ഞങ്ങളുടെ പ്രാർഥനകളിൽ
  rationale: ἐπί + ഷഷ്ഠീവിഭക്തിയുടെ ഈ പ്രാർഥനാപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി ‘പ്രാർഥനകളിൽ’ എന്നു നൽകുന്നു.
- source_word: ἀδιαλείπτως
  choice: ഇടവിടാതെ
  rationale: സ്ഥിരവും ആവർത്തിതവുമായ തുടർച്ചയെ ശക്തമായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളം. വാക്യാവസാനത്ത് വേർതിരിച്ചുവെച്ചത് ഗ്രീക്കിലെ സ്ഥാനവും ഏതിനോടാണ് ക്രിയാവിശേഷണം ചേരുന്നതെന്ന അനിശ്ചിതത്വവും ഭാഗികമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἀδιαλείπτως ഏത് പ്രസ്താവനയെ വിശേഷിപ്പിക്കുന്നു എന്ന അനിശ്ചിതത്വം
  choice: “ഇടവിടാതെ” വാക്യാവസാനത്ത് ഡാഷിനു ശേഷം നൽകി, അടിക്കുറിപ്പിൽ രണ്ട് വ്യാകരണസാധ്യതകളും വ്യക്തമാക്കി
  alternative: “പ്രാർഥനകളിൽ നിങ്ങളെ ഇടവിടാതെ ഓർക്കുന്നു” എന്ന് നേരിട്ട് μνείαν ποιούμενοι-യോടു മാത്രം ബന്ധിപ്പിക്കുക; അല്ലെങ്കിൽ “ഇടവിടാതെ നന്ദി പറയുന്നു” എന്ന് മുഖ്യക്രിയയോടു മാത്രം ബന്ധിപ്പിക്കുക
  rationale: ഗ്രീക്ക് പദക്രമത്തിൽ ἀδιαλείπτως പിന്നിലായതിനാൽ അത് പ്രാർഥനയിലെ ഓർക്കലിനെയോ വിശാലമായ നന്ദിപ്രസ്താവനയെയോ വിശേഷിപ്പിക്കാം. വിവർത്തനം ഒരു വ്യാഖ്യാനം മാത്രം നിർബന്ധിക്കാതിരിക്കണം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്ക് പങ്കാളിത്തരൂപം മലയാളത്തിലെ സ്വാഭാവിക ഏകോപിത ക്രിയയായി മാറ്റി; ἀδιαλείπτως എന്നതിന്റെ യഥാർഥ ബന്ധത്തിലെ അനിശ്ചിതത്വം ഡാഷും അടിക്കുറിപ്പുംകൊണ്ട് സംരക്ഷിച്ചു.
