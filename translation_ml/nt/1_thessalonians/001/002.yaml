  terminology: '"നന്ദി പറയുന്നു," "പ്രാർഥനകളിൽ," and "ഇടവിടാതെ" are appropriate, idiomatic choices. No theological terminology issue is present. The footnote appropriately preserves the disputed/modifiable scope of ἀδιαλείπτως without forcing one syntactic analysis.'
