id: 1TH.1.9
reference: 1 Thessalonians 1:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: αὐτοὶ γὰρ περὶ ἡμῶν ἀπαγγέλλουσιν ὁποίαν εἴσοδον ἔσχομεν πρὸς ὑμᾶς, καὶ πῶς ἐπεστρέψατε πρὸς τὸν θεὸν ἀπὸ τῶν εἰδώλων δουλεύειν θεῷ ζῶντι καὶ ἀληθινῷ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/009.yaml
  text: For they themselves report about us what kind of reception we had among you[a], and how you turned to God from idols to serve the living and true God[c][b],
translation:
  language: ml
  text: കാരണം, ഞങ്ങൾ നിങ്ങളുടെ അടുക്കൽ വന്നത് എങ്ങനെയായിരുന്നു[a] എന്നും, നിങ്ങൾ വിഗ്രഹങ്ങളിൽനിന്ന് ദൈവത്തിലേക്കു തിരിഞ്ഞ്[b] ജീവനുള്ളതും യഥാർഥവുമായ ദൈവത്തെ[c] സേവിക്കാനായി എന്നും, അവർ തന്നെ ഞങ്ങളെക്കുറിച്ച് അറിയിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഞങ്ങൾ നിങ്ങളുടെ അടുക്കലേക്കു പ്രവേശിച്ചത് എങ്ങനെയുള്ളതായിരുന്നു.’ ഗ്രീക്ക് പ്രയോഗം ഞങ്ങളുടെ അവരുടെ ഇടയിലേക്കുള്ള വരവിന്റെ സ്വഭാവത്തെയും ഫലത്തെയും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നിങ്ങൾ എങ്ങനെ വിഗ്രഹങ്ങളിൽനിന്ന് ദൈവത്തിലേക്കു പരിവർത്തനം പ്രാപിച്ചു.’
    reason: alternative_reading
  - marker: c
    text: ‘ജീവനുള്ളതും യഥാർഥവുമായ ദൈവം’ എന്ന പ്രയോഗം ദൈവത്തെ ജീവനില്ലാത്ത വിഗ്രഹങ്ങളിൽനിന്ന് വേർതിരിച്ചുകാട്ടുന്നു; യിരെമ്യാവ് 10:10 താരതമ്യം ചെയ്യുക.
    reason: cross_reference
lexical_decisions:
- source_word: αὐτοὶ
  choice: അവർതന്നെ
  rationale: ഊന്നൽ നൽകുന്ന സർവനാമത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; പൗലോസിന്റെ പ്രേരണയില്ലാതെ മറ്റുള്ളവർതന്നെയാണ് വാർത്ത അറിയിക്കുന്നത്.
- source_word: ἀπαγγέλλουσιν
  choice: അറിയിക്കുന്നത്
  rationale: വർത്തമാനകാലത്തിൽ വാർത്ത പറഞ്ഞറിയിക്കുന്ന പ്രവൃത്തിയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: ὁποίαν εἴσοδον ἔσχομεν πρὸς ὑμᾶς
  choice: നിങ്ങളുടെ അടുക്കലേക്കുള്ള ഞങ്ങളുടെ വരവ് എങ്ങനെയുള്ളതായിരുന്നു
  rationale: εἴσοδος എന്നതിന്റെ അടിസ്ഥാനമായ ‘വരവ്/പ്രവേശനം’ എന്ന ദൃശ്യരൂപം നിലനിർത്തുകയും ആ വരവിന്റെ സ്വഭാവവും ഫലവും സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: πῶς ἐπεστρέψατε
  choice: നിങ്ങൾ എങ്ങനെ ... തിരിഞ്ഞു
  rationale: മാനസാന്തരത്തിന്റെ ദിശാമാറ്റരൂപകം സാങ്കേതികമായ മതപദം ഉപയോഗിക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: πρὸς τὸν θεὸν ἀπὸ τῶν εἰδώλων
  choice: വിഗ്രഹങ്ങളെ വിട്ട് ദൈവത്തിലേക്കു
  rationale: ἀπό, πρός എന്നീ പൂർവപ്രത്യയങ്ങളിലെ ഉറവിടവും ലക്ഷ്യവും—വിഗ്രഹങ്ങളിൽനിന്ന് അകന്ന് ദൈവത്തിലേക്ക്—വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: εἰδώλων
  choice: വിഗ്രഹങ്ങൾ
  rationale: ആരാധനാവസ്തുക്കളെയും അവ പ്രതിനിധാനം ചെയ്യുന്ന വ്യാജദേവന്മാരെയും സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള, പൊതുവായി മനസ്സിലാകുന്ന പദം.
- source_word: δουλεύειν
  choice: സേവിക്കേണ്ടതിന്
  rationale: അടിമത്തം/സേവനം എന്ന അർത്ഥമേഖലയിലുള്ള ക്രിയ ഇവിടെ മതപരമായ സമർപ്പിത സേവനത്തെ സൂചിപ്പിക്കുന്നു; ‘സേവിക്കുക’ സന്ദർഭത്തിന് സ്വാഭാവികമാണ്.
- source_word: θεῷ ζῶντι καὶ ἀληθινῷ
  choice: ജീവനുള്ളവനും സത്യവാനുമായ ദൈവം
  rationale: ജീവനില്ലാത്ത വിഗ്രഹങ്ങളോട് ദൈവത്തെ വിരുദ്ധമായി നിർത്തുന്ന രണ്ടു വിശേഷണങ്ങളും സംരക്ഷിക്കുന്നു; ‘സത്യവാൻ’ ദൈവത്തിന്റെ യാഥാർഥ്യവും സത്യസ്വഭാവവും തുറന്നുവയ്ക്കുന്നു.
- source_word: γὰρ
  choice: എന്നും ... ആകുന്നു എന്ന വിശദീകരണബന്ധം
  rationale: മലയാളത്തിൽ ഒറ്റപ്പെട്ട ‘എന്തെന്നാൽ’ ചേർക്കുന്നതിനെക്കാൾ വാക്യഘടനയിലൂടെ മുൻവാക്യത്തിനുള്ള തെളിവ്/വിശദീകരണം സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
theological_decisions:
- issue: ἐπεστρέψατε എന്ന പരിവർത്തനഭാഷയുടെ സ്വഭാവം
  choice: ‘ദൈവത്തിലേക്കു തിരിഞ്ഞു’ എന്ന് സജീവരൂപത്തിൽ പരിഭാഷപ്പെടുത്തി
  alternative: ‘ദൈവത്തിലേക്കു പരിവർത്തിതരായി’ അല്ലെങ്കിൽ ‘തിരിക്കപ്പെട്ടു’
  rationale: ഗ്രീക്ക് ക്രിയയുടെ രൂപം സജീവമാണ്; ‘തിരിഞ്ഞു’ എന്നത് ദിശാമാറ്റത്തിന്റെ രൂപകം നിലനിർത്തുന്നു, എന്നാൽ പരിവർത്തനത്തിൽ ദൈവിക പ്രവർത്തനവും മനുഷ്യപ്രതികരണവും തമ്മിലുള്ള വിപുലമായ ദൈവശാസ്ത്രചർച്ചയെ ഈ വാക്യത്തിൽ തീർപ്പാക്കുന്നില്ല.
- issue: δουλεύειν എന്നതിലെ സേവനം/അടിമത്തം
  choice: ‘സേവിക്കുക’
  alternative: ‘ദൈവത്തിന് അടിമകളായിരിക്കുക’ അല്ലെങ്കിൽ ‘ആരാധിക്കുക’
  rationale: ക്രിയ അടിമസേവനത്തിന്റെ അർത്ഥമേഖലയിലാണെങ്കിലും ഇവിടെ ദൈവത്തോടുള്ള സമർപ്പിത അനുസരണവും സേവനവുമാണ് മുൻനിരയിൽ; ‘ആരാധിക്കുക’ അർത്ഥത്തെ ആരാധനാചടങ്ങിലേക്കു ചുരുക്കും, ‘അടിമയാകുക’ സന്ദർഭം ആവശ്യപ്പെടുന്നതിലധികം കടുപ്പം നൽകും.
- issue: ζῶντι καὶ ἀληθινῷ എന്ന വിശേഷണങ്ങളുടെ ദൈവശാസ്ത്രപരമായ വിരോധം
  choice: ‘ജീവനുള്ളവനും സത്യവാനുമായ ദൈവം’
  alternative: ‘ജീവിക്കുന്ന യഥാർഥ ദൈവം’
  rationale: ദൈവം ജീവനുള്ളവനും സത്യവാനുമാണെന്ന രണ്ടു ഗുണങ്ങളും പ്രത്യേകം നിലനിർത്തുന്നു; അതോടൊപ്പം ജീവനില്ലാത്ത, യാഥാർഥ ദൈവങ്ങളല്ലാത്ത വിഗ്രഹങ്ങളുമായുള്ള വിരോധവും വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. εἴσοδος എന്നതിന്റെ വരവ്/പ്രവേശനം എന്ന രൂപകവും ἐπιστρέφω എന്നതിന്റെ ‘തിരിയുക’ എന്ന രൂപകവും നിലനിർത്തി. ‘സത്യവാൻ’ എന്നത് ‘യഥാർഥൻ’ എന്ന അർത്ഥസാധ്യതയെ പൂർണമായി അടച്ചുപൂട്ടാതെ ദൈവത്തിന്റെ സത്യസ്വഭാവവും വിഗ്രഹങ്ങളുമായുള്ള വിരോധവും പ്രകടിപ്പിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
