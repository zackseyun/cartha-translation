review_pass:
  verdict: revise
  source_fidelity: The draft conveys the core movement from idols to God and the purpose of serving God. However, ‘സേവിക്കേണ്ടതിന്’ introduces an unwarranted sense of obligation (‘must serve’), whereas δουλεύειν is a purpose infinitive. The explanatory force of γάρ is also better represented explicitly. ‘സത്യവാൻ’ is less natural here than ‘യഥാർഥ’ for ἀληθινός, which contrasts the genuine God with idols.
  naturalness: The original word order is somewhat heavy, and ‘അവർതന്നെ’ should be spaced as ‘അവർ തന്നെ’ in standard modern Malayalam. Recasting the report clauses produces a clearer, idiomatic sentence while retaining the source structure.
  terminology: ‘വിഗ്രഹങ്ങൾ,’ ‘തിരിയുക,’ and ‘സേവിക്കുക’ are suitable. ‘ജീവനുള്ളതും യഥാർഥവുമായ ദൈവം’ naturally expresses both ζῶντι and ἀληθινῷ without reducing the latter to a statement merely about truthfulness.
  issues:
  - severity: medium
    issue: ‘സേവിക്കേണ്ടതിന്’ gives the infinitive a necessity/obligation sense.
    rationale: 'δουλεύειν expresses the purpose/result of their turning: they turned in order to serve God. ‘സേവിക്കാനായി’ preserves this without adding ‘should/must.’'
  - severity: low
    issue: The γάρ connection is left only implicit.
    rationale: An initial ‘കാരണം’ clearly retains the verse’s explanatory link to the preceding statement in natural Malayalam.
  - severity: low
    issue: ‘സത്യവാനായ’ is not the most idiomatic or contextually precise equivalent of ἀληθινός.
    rationale: In contrast with idols, ἀληθινός denotes the real/genuine God. ‘യഥാർഥമായ’ expresses this naturally.
