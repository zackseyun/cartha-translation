id: 1TH.1.5
reference: 1 Thessalonians 1:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι τὸ εὐαγγέλιον ἡμῶν οὐκ ἐγενήθη εἰς ὑμᾶς ἐν λόγῳ μόνον ἀλλὰ καὶ ἐν δυνάμει καὶ ἐν πνεύματι ἁγίῳ ⸀καὶ πληροφορίᾳ πολλῇ, καθὼς οἴδατε οἷοι ἐγενήθημεν ⸀ἐν ὑμῖν δι’ ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/005.yaml
  text: because our gospel did not come to you in word only[a], but also in power and in the Holy Spirit and with great conviction[b], just as you know what kind of men we proved to be among you for your sake.
translation:
  language: ml
  text: കാരണം, ഞങ്ങളുടെ സുവിശേഷം നിങ്ങളിലേക്കു വന്നത് വാക്കിൽ മാത്രമായിരുന്നില്ല; ശക്തിയിലും പരിശുദ്ധാത്മാവിലും തികഞ്ഞ ഉറപ്പോടെയും കൂടിയായിരുന്നു.[a] നിങ്ങൾക്കുവേണ്ടി ഞങ്ങൾ നിങ്ങളുടെ ഇടയിൽ എങ്ങനെയുള്ളവരായിരുന്നുവെന്ന് നിങ്ങൾക്കറിയാമല്ലോ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തികഞ്ഞ ഉറപ്പോടെ’ എന്നതിന് ‘വലിയ ബോധ്യത്തോടെ’ അഥവാ ‘പൂർണ നിശ്ചയത്തോടെ’ എന്നും പരിഭാഷപ്പെടുത്താം. ആരുടെ ഉറപ്പാണെന്ന് ഗ്രീക്ക് വാക്യം വ്യക്തമാക്കുന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: ‘എങ്ങനെയുള്ളവരായിരുന്നുവെന്ന്’ എന്നതിന് ‘എങ്ങനെയുള്ളവരെന്ന് തെളിഞ്ഞുവെന്ന്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐαγγέλιον
  choice: സുവിശേഷം
  rationale: പൗലോസിന്റെ അപ്പൊസ്തലിക സന്ദേശത്തെ സൂചിപ്പിക്കുന്ന, മലയാളത്തിൽ സ്ഥാപിതവും സ്വാഭാവികവുമായ പദം; ‘നല്ല വാർത്ത’ എന്ന പൊതുവായ അർഥത്തേക്കാൾ സന്ദർഭത്തിലെ പ്രത്യേകത നിലനിർത്തുന്നു.
- source_word: ἐγενήθη εἰς ὑμᾶς
  choice: നിങ്ങളിലേക്കു വന്നത്
  rationale: γίνομαι + εἰς എന്ന പ്രയോഗം ഇവിടെ സുവിശേഷം തെസ്സലൊനീക്യരിലേക്കെത്തിയതിനെ സൂചിപ്പിക്കുന്നു; അക്ഷരാർഥത്തിലുള്ള അസ്വാഭാവിക രൂപം ഒഴിവാക്കി മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗം സ്വീകരിച്ചു.
- source_word: ἐν λόγῳ μόνον
  choice: വാക്കിൽ മാത്രമായിരുന്നില്ല
  rationale: വെറും വാചികപ്രഘോഷണവും അതിനോടൊപ്പമുള്ള ദൈവിക പ്രവർത്തനവും തമ്മിലുള്ള വൈരുധ്യം നിലനിർത്തുന്നു.
- source_word: ἐν δυνάμει
  choice: ശക്തിയിലും
  rationale: ആവർത്തിക്കുന്ന ἐν ഘടനയുടെ ഊന്നലും തുടർന്നുള്ള പദങ്ങളുമായുള്ള സമാന്തരതയും കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: പരിശുദ്ധാത്മാവിലും
  rationale: ഇവിടെ പൗലോസിന്റെ സാധാരണ പ്രയോഗമനുസരിച്ച് ദൈവികനായ പരിശുദ്ധാത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്; ഒരു പൊതുവായ ആത്മീയാവസ്ഥയെയല്ല.
- source_word: πληροφορίᾳ πολλῇ
  choice: തികഞ്ഞ ഉറപ്പോടെയും
  rationale: പൂർണതയുള്ള ഉറപ്പ്/നിശ്ചയം എന്ന അർഥപരിധി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ആ ഉറപ്പ് പ്രസംഗകരിലാണോ ശ്രോതാക്കളിലാണോ സുവിശേഷത്തിന്റെ ആഗമനരീതിയിലാണോ എന്ന് വാചകം വ്യക്തമാക്കാത്തതിനാൽ അതു തുറന്നുവയ്ക്കുന്നു.
- source_word: καθὼς οἴδατε
  choice: നിങ്ങൾക്കറിയാമല്ലോ
  rationale: തെസ്സലൊനീക്യരുടെ നേരിട്ടുള്ള അറിവിനെ സ്ഥിരീകരിക്കുന്ന καθώς എന്നതിന്റെ ഭാവം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: οἷοι ἐγενήθημεν
  choice: ഞങ്ങൾ ... എങ്ങനെയുള്ളവരായിരുന്നുവെന്ന്
  rationale: പൗലോസിന്റെയും സഹപ്രവർത്തകരുടെയും സ്വഭാവവും പെരുമാറ്റഗുണവും സൂചിപ്പിക്കുന്നു. ‘ആയിത്തീർന്നു’ എന്ന അക്ഷരാർഥരൂപം മലയാളത്തിൽ അനാവശ്യമായ സ്വഭാവപരിവർത്തനം സൂചിപ്പിക്കാമെന്നതിനാൽ സന്ദർഭോചിതമായ ‘ആയിരുന്നു’ സ്വീകരിച്ചു.
- source_word: ἐν ὑμῖν
  choice: നിങ്ങളുടെ ഇടയിൽ
  rationale: തെസ്സലൊനീക്യരുടെ മധ്യേയുള്ള മിഷനറിമാരുടെ ജീവിതവും പെരുമാറ്റവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: δι’ ὑμᾶς
  choice: നിങ്ങൾക്കുവേണ്ടി
  rationale: διά + accusative ഇവിടെ അവരുടെ നന്മയ്ക്കായി/അവരുടെ നിമിത്തം എന്ന ഗുണഭോക്തൃഭാവം പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: പരിശുദ്ധാത്മാവ് എന്ന പരാമർശം
  choice: ദൈവികനായ പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്നതായി പരിഭാഷപ്പെടുത്തി.
  alternative: ഒരു വിശുദ്ധാത്മാവ് അഥവാ ആത്മീയശക്തി
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിലും വാക്ക് മാത്രവും ഫലപ്രദമായ ദൈവിക പ്രവർത്തനവും തമ്മിലുള്ള സന്ദർഭവൈരുധ്യത്തിലും πνεῦμα ἅγιον പരിശുദ്ധാത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- issue: πληροφορίᾳ πολλῇ എന്നതിലെ ഉറപ്പിന്റെ കർത്താവ്
  choice: ‘തികഞ്ഞ ഉറപ്പോടെ’ എന്നു നൽകി, ആ ഉറപ്പ് ആരുടേതെന്ന് വ്യക്തമാക്കാതെ വിട്ടു.
  alternative: പ്രസംഗകരുടെ വലിയ ബോധ്യത്തോടെ; ശ്രോതാക്കൾക്കു പൂർണ നിശ്ചയം ഉണ്ടാക്കിക്കൊണ്ട്
  rationale: ഗ്രീക്ക് വാക്യം ആ ഉറപ്പ് പ്രസംഗകരുടേതാണോ ശ്രോതാക്കളുടേതാണോ സുവിശേഷത്തിന്റെ ആഗമനത്തിന്റെ പൊതുസ്വഭാവമാണോ എന്ന് വ്യക്തമാക്കുന്നില്ല; അതിനാൽ വ്യാഖ്യാനപരമായി ചുരുക്കിയില്ല.
- issue: οἷοι ἐγενήθημεν എന്നതിന്റെ ഭാവം
  choice: ‘എങ്ങനെയുള്ളവരായിരുന്നുവെന്ന്’ എന്നു നൽകി, അവരുടെ അറിയപ്പെട്ട സ്വഭാവവും പെരുമാറ്റവും മുന്നിലെത്തിച്ചു.
  alternative: ‘എങ്ങനെയുള്ളവരെന്ന് തെളിഞ്ഞുവെന്ന്’; ‘എങ്ങനെയുള്ളവരായിത്തീർന്നുവെന്ന്’
  rationale: γίνομαι ഇവിടെ സന്ദർഭത്തിൽ ‘ആയിരുന്നു/തെളിഞ്ഞു’ എന്ന ഭാവം വഹിക്കാം. ‘ആയിത്തീർന്നു’ മലയാളത്തിൽ സംഭവിക്കാത്ത ഒരു സ്വഭാവപരിവർത്തനം അധികമായി സൂചിപ്പിക്കാൻ സാധ്യതയുണ്ട്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘സുവിശേഷം’, ‘പരിശുദ്ധാത്മാവ്’ എന്നീ സ്ഥാപിത ബൈബിൾപദങ്ങൾ നിലനിർത്തിയപ്പോൾ, അസ്വാഭാവികമായ അക്ഷരാനുകരണം ഒഴിവാക്കി. ഗ്രീക്കിലെ വാക്ക്–ശക്തി–പരിശുദ്ധാത്മാവ്–ഉറപ്പ് എന്ന ഊന്നൽക്രമം കഴിയുന്നത്ര സംരക്ഷിച്ചു.
