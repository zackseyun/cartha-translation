source:
  edition: SBLGNT
  text: ὥστε γενέσθαι ὑμᾶς ⸀τύπον πᾶσιν τοῖς πιστεύουσιν ἐν τῇ Μακεδονίᾳ καὶ ⸀ἐν τῇ Ἀχαΐᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/007.yaml
  text: so that you became an example to all the believers in Macedonia and in Achaia[a].
translation:
  language: ml
  text: അങ്ങനെ നിങ്ങൾ മക്കെദോന്യയിലും അഖായയിലുമുള്ള എല്ലാ വിശ്വാസികൾക്കും ഒരു മാതൃകയായി[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഉദാഹരണമായി” അല്ലെങ്കിൽ “അനുകരിക്കേണ്ട രൂപമായി.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: അങ്ങനെ
  rationale: മുൻവാക്യത്തിൽ വിവരിച്ച വചനം സ്വീകരിക്കലിന്റെയും അനുകരണത്തിന്റെയും ഫലം അവതരിപ്പിക്കുന്ന തുടർച്ചാഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: γενέσθαι
  choice: ആയി
  rationale: ὥστε-യോടൊപ്പമുള്ള aorist infinitive സൂചിപ്പിക്കുന്ന ഫലം മലയാളത്തിൽ പൂർത്തിയായ ക്രിയാരൂപമായി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὑμᾶς
  choice: നിങ്ങൾ
  rationale: ബഹുവചന രണ്ടാംപുരുഷ സർവനാമത്തെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: τύπον
  choice: ഒരു മാതൃക
  rationale: മറ്റുള്ളവർ പിന്തുടരേണ്ട ദൃഷ്ടാന്തം അഥവാ മാതൃക എന്ന സന്ദർഭാർഥം വ്യക്തവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ‘ഉദാഹരണം’ എന്നതും സാധുവായ മറ്റൊരു സാധ്യതയാണ്.
- source_word: πᾶσιν τοῖς πιστεύουσιν
  choice: എല്ലാ വിശ്വാസികൾക്കും
  rationale: Substantival participle-നെ ‘വിശ്വാസികൾ’ എന്നു സംക്ഷിപ്തമായും സ്വാഭാവികമായും നൽകുന്നു; dative-ന്റെ ബന്ധം ‘-ക്കും’ വഴി പ്രകടമാക്കുന്നു.
- source_word: ἐν τῇ Μακεδονίᾳ καὶ ἐν τῇ Ἀχαΐᾳ
  choice: മക്കെദോന്യയിലും അഖായയിലുമുള്ള
  rationale: രണ്ടു പ്രദേശങ്ങളിലുമുള്ള വിശ്വാസികളെ വിശേഷിപ്പിക്കുന്ന locative ബന്ധം മലയാളത്തിൽ വ്യക്തമായി നൽകുകയും സമാന്തരത നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ ഫലസൂചനയും പ്രദേശനാമങ്ങളുടെ സമാന്തരബന്ധവും നിലനിർത്തി; τύπος എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
