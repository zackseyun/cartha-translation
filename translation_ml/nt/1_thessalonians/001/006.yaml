    reason: πνεύματος ἁγίου എന്ന ജനിറ്റീവ് സന്തോഷത്തിന്റെ ഉറവിടത്തെയോ അതു ഉളവാക്കുന്നതെയോ സൂചിപ്പിക്കാം; പ്രധാനപാഠം ഗ്രീക്കിലെ സംക്ഷിപ്തമായ ജനിറ്റീവ് ബന്ധം നിലനിർത്തുന്നു.
