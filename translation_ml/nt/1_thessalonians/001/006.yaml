revisions:
- from: നിങ്ങളും വലിയ കഷ്ടതയുടെ നടുവിൽ പരിശുദ്ധാത്മാവിൽനിന്നുള്ള സന്തോഷത്തോടെ[a] വചനം സ്വീകരിച്ച് ഞങ്ങളെയും കർത്താവിനെയും അനുകരിക്കുന്നവരായിത്തീർന്നു.
  to: നിങ്ങളും വലിയ കഷ്ടതയുടെ നടുവിൽ പരിശുദ്ധാത്മാവിന്റെ സന്തോഷത്തോടെ[a] വചനം സ്വീകരിച്ച് ഞങ്ങളുടെയും കർത്താവിന്റെയും അനുകരണക്കാരായിത്തീർന്നു.
  rationale: The revision retains every semantic component of the verse while avoiding an unnecessary expansion of the ambiguous genitive in the main text. It also uses a direct Malayalam noun for ‘imitators.’ The footnote preserves the source-oriented reading without presenting it as the only meaning.
