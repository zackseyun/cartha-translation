id: 1TH.1.10
reference: 1 Thessalonians 1:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀναμένειν τὸν υἱὸν αὐτοῦ ἐκ τῶν οὐρανῶν, ὃν ἤγειρεν ἐκ τῶν νεκρῶν, Ἰησοῦν τὸν ῥυόμενον ἡμᾶς ⸀ἐκ τῆς ὀργῆς τῆς ἐρχομένης.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/010.yaml
  text: and to wait for his Son from heaven[a], whom he raised from the dead—Jesus, who rescues us from the coming wrath.
translation:
  language: ml
  text: മരിച്ചവരിൽനിന്ന് ദൈവം ഉയിർപ്പിച്ച തന്റെ പുത്രനായ യേശുവിനെ—വരാനിരിക്കുന്ന ക്രോധത്തിൽനിന്ന് നമ്മെ രക്ഷിക്കുന്നവനെ—സ്വർഗത്തിൽനിന്ന് കാത്തിരിക്കാനുമാണ് അവർ ദൈവത്തിലേക്കു തിരിഞ്ഞത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘വരുവാനുള്ള ക്രോധത്തിൽനിന്ന് നമ്മെ വിടുവിക്കുന്ന യേശുവിനെ.’'
    reason: ‘രക്ഷിക്കുന്ന’ എന്നതിന് ‘വിടുവിക്കുന്ന’ എന്നും, ‘വരാനിരിക്കുന്ന’ എന്നതിന് ‘വരുവാനുള്ള’ എന്നും നൽകാവുന്ന പദപരമായ പര്യായം.
lexical_decisions:
- source_word: ἀναμένειν
  choice: വരുന്നതും കാത്തിരിക്കാനും
  rationale: പ്രതീക്ഷയോടെയുള്ള കാത്തിരിപ്പിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; മുൻവാക്യത്തിൽ ആരംഭിച്ച ദൈവത്തിലേക്കുള്ള തിരിയലിന്റെ ഉദ്ദേശ്യം തുടരുന്നു.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: തന്റെ പുത്രൻ
  rationale: ബന്ധസൂചകമായ ക്രിസ്തുശാസ്ത്രപരമായ പദവി വിപുലീകരണമില്ലാതെ നിലനിർത്തുന്നു.
- source_word: ἐκ τῶν οὐρανῶν
  choice: സ്വർഗത്തിൽനിന്ന്
  rationale: ഗ്രീക്കിൽ ബഹുവചനമാണെങ്കിലും ഈ അർഥത്തിൽ മലയാളത്തിലെ സ്വാഭാവികമായ പ്രയോഗം ഏകവചനമായ ‘സ്വർഗം’ ആണ്.
- source_word: ὃν ἤγειρεν ἐκ τῶν νεκρῶν
  choice: മരിച്ചവരിൽനിന്ന് ദൈവം ഉയിർപ്പിച്ച
  rationale: ἐκ τῶν νεκρῶν എന്നത് ‘മരിച്ചവരിൽനിന്ന്’ എന്നു നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; ഗ്രീക്കിലെ കർത്താവ് മുൻസന്ദർഭത്തിലെ ദൈവമാണെന്നത് മലയാളത്തിലെ വ്യക്തതയ്ക്കായി ആവർത്തിക്കുന്നു.
- source_word: Ἰησοῦν
  choice: യേശുവിനെ
  rationale: മലയാളത്തിലെ സ്ഥിരപ്രയോഗത്തിലുള്ള വ്യക്തിനാമം ഉപയോഗിക്കുകയും വാക്യഘടനയ്ക്കനുസരിച്ച് വിഭക്തി ചേർക്കുകയും ചെയ്യുന്നു.
- source_word: τὸν ῥυόμενον
  choice: രക്ഷിക്കുന്ന
  rationale: വർത്തമാനകാല കൃദന്തം യേശുവിനെ രക്ഷകനായി വിശേഷിപ്പിക്കുന്ന വിധത്തിൽ നിലനിർത്തുന്നു; ‘രക്ഷിക്കാനിരിക്കുന്ന’ എന്ന ഭാവികാല നിർണ്ണയം ചേർക്കുന്നില്ല.
- source_word: ἐκ τῆς ὀργῆς
  choice: ക്രോധത്തിൽനിന്ന്
  rationale: ὀργήയുടെ ശക്തമായ അർഥം ‘ന്യായവിധി’ എന്നു പൊതുവാക്കാതെ ‘ക്രോധം’ എന്നായി സംരക്ഷിക്കുന്നു.
- source_word: τῆς ἐρχομένης
  choice: വരാനിരിക്കുന്ന
  rationale: സമീപിച്ചുകൊണ്ടിരിക്കുന്നതോ ഭാവിയിൽ വരുന്നതോ ആയ ക്രോധത്തെ സൂചിപ്പിക്കുന്ന കൃദന്തരൂപത്തിന്റെ ഭാവിമുഖത സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: ‘വരാനിരിക്കുന്ന ക്രോധം’ എന്നതിന്റെ സ്വഭാവം
  choice: അന്തിമ ന്യായവിധി, അന്ത്യകാല കഷ്ടത, അല്ലെങ്കിൽ ദൈവക്രോധം പൊതുവിൽ എന്നിവയിൽ ഒന്നായി നിർണ്ണയിക്കാതെ ‘വരാനിരിക്കുന്ന ക്രോധം’ എന്നു നിലനിർത്തി.
  alternative: ‘വരാനിരിക്കുന്ന ന്യായവിധി’ എന്നു വിവർത്തനം ചെയ്യുക, അല്ലെങ്കിൽ ഇത് ഒരു പ്രത്യേക അന്ത്യകാല സംഭവമായി വ്യക്തമാക്കുക.
  rationale: വാക്യം തന്നെ ക്രോധത്തിന്റെ കൃത്യമായ പരിധി നിർവചിക്കുന്നില്ല; അതിനാൽ വിഭാഗീയമായ അന്ത്യകാല വ്യാഖ്യാനം ഇറക്കുമതി ചെയ്യാതെ മൂലത്തിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം സംരക്ഷിക്കുന്നു.
- issue: ῥυόμενον എന്ന വർത്തമാനകാല കൃദന്തത്തിന്റെ കാലബലം
  choice: ‘രക്ഷിക്കുന്ന’
  alternative: ‘രക്ഷിക്കാനിരിക്കുന്ന’ അല്ലെങ്കിൽ ‘ഇപ്പോൾ രക്ഷിച്ചുകൊണ്ടിരിക്കുന്ന’
  rationale: സന്ദർഭം ഭാവിമുഖമാണെങ്കിലും ഗ്രീക്ക് യേശുവിനെ രക്ഷിക്കുന്നവനായി വിശേഷിപ്പിക്കുന്നു; പ്രവൃത്തിയെ ഭാവിയിലേക്കു മാത്രം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. 1:9-ൽ ആരംഭിക്കുന്ന ആശയബന്ധം വ്യക്തമാക്കാൻ ‘അവർ ദൈവത്തിലേക്കു തിരിഞ്ഞത്’ ചേർത്ത് വാക്യം സ്വതന്ത്രമായി വായിക്കാവുന്നവിധം രൂപപ്പെടുത്തി; ഇതു സന്ദർഭത്തിൽനിന്നുള്ള പൂർത്തീകരണമാണെങ്കിലും മൂലവാക്യത്തിന്റെ അർഥം മാറ്റുന്നില്ല. അടിക്കുറിപ്പിന്റെ [a] ചിഹ്നം പ്രധാനപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
