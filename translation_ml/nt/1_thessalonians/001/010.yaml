revisions:
- from: മരിച്ചവരിൽനിന്ന് ദൈവം ഉയിർപ്പിച്ച തന്റെ പുത്രൻ സ്വർഗത്തിൽനിന്ന് വരുന്നതും കാത്തിരിക്കാനുമാണ് അവർ ദൈവത്തിലേക്കു തിരിഞ്ഞത്—വരാനിരിക്കുന്ന ക്രോധത്തിൽനിന്ന് നമ്മെ രക്ഷിക്കുന്ന യേശുവിനെ.[a]
  to: മരിച്ചവരിൽനിന്ന് ദൈവം ഉയിർപ്പിച്ച തന്റെ പുത്രനായ യേശുവിനെ—വരാനിരിക്കുന്ന ക്രോധത്തിൽനിന്ന് നമ്മെ രക്ഷിക്കുന്നവനെ—സ്വർഗത്തിൽനിന്ന് കാത്തിരിക്കാനുമാണ് അവർ ദൈവത്തിലേക്കു തിരിഞ്ഞത്.[a]
  rationale: The revision corrects the object case and reorders the phrase so that ‘സ്വർഗത്തിൽനിന്ന്’ naturally belongs with waiting for the Son, not with a claim that the Son is merely characterized as coming from heaven. It retains the draft’s contextual completion (‘അവർ ദൈവത്തിലേക്കു തിരിഞ്ഞത്’), while preserving the Greek’s present participial characterization of Jesus and leaving ‘the coming wrath’ undefined.
