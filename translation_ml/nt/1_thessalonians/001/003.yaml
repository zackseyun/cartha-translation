  yaml_path: translation/nt/1_thessalonians/001/003.yaml
  text: remembering your work of faith and labor of love and steadfastness of hope in our Lord Jesus the Messiah before our God and Father[b][a],
translation:
  language: ml
  text: നമ്മുടെ ദൈവവും പിതാവുമായവന്റെ മുമ്പാകെ, നമ്മുടെ കർത്താവായ യേശു മശീഹായിലുള്ള[b] നിങ്ങളുടെ വിശ്വാസത്തിന്റെ[a] പ്രവൃത്തിയും സ്നേഹത്തിന്റെ അധ്വാനവും പ്രത്യാശയുടെ സ്ഥിരതയും ഓർത്തുകൊണ്ട്,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വിശ്വസ്തത’ എന്നോ ‘ആശ്രയം’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ ‘ക്രിസ്തു’; ഇവിടെ Χριστός ഒരു പദവിയായി പ്രവർത്തിക്കുന്നതിനാൽ ‘മശീഹാ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: μνημονεύοντες
  choice: ഓർത്തുകൊണ്ട്
  rationale: മുൻവാക്യത്തിലെ ക്രിയയോട് ബന്ധപ്പെടുന്ന വർത്തമാന കൃദന്തരൂപത്തിന്റെ തുടർച്ചയും നിരന്തരമായ ഓർമിക്കലും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἔργου
  choice: പ്രവൃത്തി
  rationale: πίστις–ἀγάπη–ἐλπίς എന്ന ത്രയത്തോടു ചേർന്ന ἔργον–κόπος–ὑπομονή എന്ന വാക്യഘടന വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: πίστεως
  choice: വിശ്വാസം
  rationale: സന്ദർഭത്തിൽ വിശ്വാസത്തിൽനിന്ന് ഉളവാകുന്നതോ വിശ്വാസം സ്വഭാവമാക്കുന്നതോ ആയ പ്രവൃത്തി എന്നാണ് സാധ്യത; പദത്തിന്റെ യഥാർഥ വ്യത്യസ്ത സൂചനകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: κόπου
  choice: അധ്വാനം
  rationale: കഠിനശ്രമം എന്ന κόπος-ന്റെ ശക്തി സാധാരണവും മാന്യവുമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἀγάπης
  choice: സ്നേഹം
  rationale: ἀγάπη എന്നതിന് സ്വാഭാവികവും വ്യാപകമായി മനസ്സിലാകുന്നതുമായ മലയാളപദം.
- source_word: ὑπομονῆς
  choice: സ്ഥിരത
  rationale: സമ്മർദത്തിനിടയിലും നിലനിൽക്കുന്ന ഉറച്ച സഹനത്തെ സൂചിപ്പിക്കുന്നു; ‘സഹിഷ്ണുത’ മാത്രം നൽകാവുന്ന നിഷ്ക്രിയഭാവം ഒഴിവാക്കുന്നു.
- source_word: ἐλπίδος
  choice: പ്രത്യാശ
  rationale: ദൈവത്തിൽ അധിഷ്ഠിതമായ ഉറച്ച പ്രതീക്ഷ എന്ന പൗലോസിന്റെ പ്രയോഗത്തിന് യോജിച്ച സ്ഥിരമായ പരിഭാഷ.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: നമ്മുടെ കർത്താവായ യേശു മശീഹായിലുള്ള
  rationale: ജനിറ്റീവ് ബന്ധം പ്രത്യാശയുടെ ആശ്രയമോ മേഖലയോ ആയി സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; Χριστός എന്ന പദത്തിന്റെ അഭിഷിക്തൻ എന്ന പദവിയർഥം ‘മശീഹാ’ നിലനിർത്തുന്നു.
- source_word: ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: നമ്മുടെ ദൈവവും പിതാവുമായവന്റെ സന്നിധിയിൽ
  rationale: ദൈവത്തിന്റെ സാന്നിധ്യത്തിൽ എന്ന ബന്ധാർഥവും θεός, πατήρ എന്നീ രണ്ടു വിശേഷണങ്ങളും ഒരേ വ്യക്തിയെ സൂചിപ്പിക്കുന്നതും വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: Χριστοῦ എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ Χριστός ഒരു പദവിയായി പ്രവർത്തിക്കുന്നതിനാൽ അതിന്റെ അർഥം വ്യക്തമാക്കുന്ന ‘മശീഹാ’ മുഖ്യവാചകത്തിൽ ഉപയോഗിച്ചു; പരിചിതമായ രൂപം അടിക്കുറിപ്പിൽ നൽകി.
- issue: τῆς πίστεως എന്നതിലെ πίστις-ന്റെ അർഥം
  choice: വിശ്വാസം
  alternative: വിശ്വസ്തത; ആശ്രയം
  rationale: ഈ സന്ദർഭത്തിൽ വിശ്വാസത്തിൽനിന്ന് ഉളവാകുന്ന പ്രവൃത്തി എന്ന അർഥമാണ് കൂടുതൽ സാധ്യതയുള്ളത്; എങ്കിലും പദത്തിനുള്ള യഥാർഥ അർഥസാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ എന്ന ജനിറ്റീവ് ഏതിനോടു ബന്ധപ്പെടുന്നു
  choice: പ്രത്യാശയോട് ബന്ധപ്പെടുത്തി ‘യേശു മശീഹായിലുള്ള പ്രത്യാശ’
  alternative: ‘നമ്മുടെ കർത്താവായ യേശു മശീഹായുടെ പ്രത്യാശ’
  rationale: ജനിറ്റീവ് പ്രത്യാശയുടെ വിഷയമോ ആശ്രയമോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘-യിലുള്ള പ്രത്യാശ’ ഈ ബന്ധം അമിതവ്യാഖ്യാനമില്ലാതെ വ്യക്തമായി നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിലെ ‘പ്രവൃത്തി—അധ്വാനം—സ്ഥിരത’, ‘വിശ്വാസം—സ്നേഹം—പ്രത്യാശ’ എന്നീ സമാന്തര ത്രയങ്ങൾ സംരക്ഷിച്ചു. വാക്യം മുൻവാക്യത്തിൽനിന്ന് തുടരുന്നതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തി.
