reference: 1 Thessalonians 1:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Παῦλος καὶ Σιλουανὸς καὶ Τιμόθεος τῇ ἐκκλησίᾳ Θεσσαλονικέων ἐν θεῷ πατρὶ καὶ κυρίῳ Ἰησοῦ Χριστῷ· χάρις ὑμῖν καὶ ⸀εἰρήνη.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/001.yaml
  text: 'Paul and Silvanus and Timothy[b][a], to the church of the Thessalonians in God the Father and the Lord Jesus the Messiah: grace to you and peace.'
translation:
  language: ml
  text: 'പൗലോസും സില്വാനോസും തിമൊഥെയോസും, പിതാവായ ദൈവത്തിലും കർത്താവായ യേശു മശീഹയിലും[b] ഉള്ള തെസ്സലൊനീക്യരുടെ സഭയ്ക്ക്[a]: നിങ്ങൾക്കു കൃപയും സമാധാനവും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സഭ’ എന്നതിന് ‘കൂടിവരുന്ന സമൂഹം’ എന്നും പറയാം. ഗ്രീക്കിലെ ἐκκλησία കൂടിച്ചേർന്ന ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘യേശു ക്രിസ്തു.’ ഗ്രീക്കിലെ Χριστός എന്ന പദവിയുടെ അർഥം ‘മശീഹ’ എന്നാണ്; ‘ക്രിസ്തു’ അതിന്റെ പരമ്പരാഗത ലിപ്യന്തരരൂപമാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: Παῦλος
  choice: പൗലോസ്
  rationale: Παῦλος എന്ന വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ സ്ഥാപിതവും സ്വാഭാവികവുമായ രൂപം.
- source_word: Σιλουανὸς
  choice: സില്വാനോസ്
  rationale: മൂലപാഠത്തിലെ Σιλουανός എന്ന പൂർണരൂപം നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; മറ്റൊരു ഗ്രീക്ക് രൂപത്തെ ആധാരമാക്കിയ ‘ശീലാസ്’ ഇവിടെ സ്വീകരിച്ചിട്ടില്ല.
- source_word: Τιμόθεος
  choice: തിമൊഥെയോസ്
  rationale: Τιμόθεος എന്ന വ്യക്തിനാമത്തിന്റെ മൂലരൂപത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം.
- source_word: ἐκκλησίᾳ
  choice: സഭയ്ക്ക്
  rationale: വിശ്വാസികളുടെ കൂടിവരുന്ന സമൂഹത്തെ സൂചിപ്പിക്കുന്ന, മലയാളത്തിൽ സ്വാഭാവികവും സ്ഥാപിതവുമായ പദം; ‘കൂടിവരവ്/സമൂഹം’ എന്ന അടിസ്ഥാനഭാവം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: Θεσσαλονικέων
  choice: തെസ്സലൊനീക്യരുടെ
  rationale: തെസ്സലൊനീക്യ നഗരവുമായി ബന്ധപ്പെട്ട ജനങ്ങളെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ബഹുവചന ജനനാമത്തെ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: ἐν
  choice: -ത്തിലും ... -യിലും ഉള്ള
  rationale: സഭയുടെ ദൈവത്തോടും കർത്താവായ യേശുവിനോടുമുള്ള ബന്ധമോ നിലനിൽപ്പിന്റെ മണ്ഡലമോ കൃത്യമായി നിർവചിക്കാതെ, ഗ്രീക്കിലെ ἐν എന്നതിന്റെ തുറന്ന അർഥവ്യാപ്തി കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: θεῷ πατρὶ
  choice: പിതാവായ ദൈവം
  rationale: ഗ്രീക്കിൽ ‘നമ്മുടെ’ എന്ന ഉടമസ്ഥസർവനാമമില്ലാത്തതിനാൽ അത് ചേർക്കാതെ, ദൈവവും പിതാവും തമ്മിലുള്ള സമാനാധികരണബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: κυρίῳ
  choice: കർത്താവ്
  rationale: പുതിയനിയമ സന്ദർഭത്തിലെ κύριος എന്ന പദത്തിന്റെ സ്ഥാപിതവും ഗൗരവമുള്ളതുമായ മലയാള വിവർത്തനം.
- source_word: Ἰησοῦ Χριστῷ
  choice: യേശു മശീഹ
  rationale: Χριστός ഇവിടെ അഭിഷിക്തനായ രക്ഷകനെ സൂചിപ്പിക്കുന്ന പദവിയായി നിലനിൽക്കുന്നതിനാൽ അർഥവിവർത്തനമായ ‘മശീഹ’ സ്വീകരിച്ചു; പരിചിതമായ ‘ക്രിസ്തു’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: χάρις
  choice: കൃപ
  rationale: പൗലോസിന്റെ അഭിവാദനങ്ങളിൽ θεologicalവും ലേഖനപരവുമായ അനുരണനം നിലനിർത്തുന്ന സ്ഥാപിത മലയാള പദം.
- source_word: εἰρήνη
  choice: സമാധാനം
  rationale: ഗ്രീക്ക്-യഹൂദ അഭിവാദനപാരമ്പര്യങ്ങളുടെ അർഥവ്യാപ്തി നിലനിർത്തുന്ന സാധാരണ മലയാള പദം.
- source_word: χάρις ὑμῖν καὶ εἰρήνη
  choice: നിങ്ങൾക്കു കൃപയും സമാധാനവും ഉണ്ടാകട്ടെ
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്ത നാമവാക്യ അഭിവാദനത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ ആശംസാരൂപത്തിൽ നൽകുന്നു; കൃപയും സമാധാനവും എന്ന ക്രമം കാത്തുസൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: Χριστός എന്ന പദവിയുടെ വിവർത്തനം
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഈ അഭിവാദനത്തിൽ പദവിയുടെ അർഥം സജീവമായി നിലനിൽക്കുന്നു. അതിനാൽ ലിപ്യന്തരണം മാത്രം ചെയ്യാതെ ‘മശീഹ’ എന്ന് നൽകിയിരിക്കുന്നു; മലയാള ക്രൈസ്തവ ഉപയോഗത്തിൽ പരിചിതമായ ‘ക്രിസ്തു’ എന്ന രൂപവും അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
- issue: ἐν θεῷ πατρὶ καὶ κυρίῳ Ἰησοῦ Χριστῷ എന്നതിലെ ബന്ധം
  choice: പിതാവായ ദൈവത്തിലും കർത്താവായ യേശു മശീഹയിലും ഉള്ള സഭ
  alternative: പിതാവായ ദൈവത്തിനും കർത്താവായ യേശു മശീഹയ്ക്കും സ്വന്തമായ സഭ
  rationale: ἐν എന്നത് ഐക്യം, ബന്ധം, അല്ലെങ്കിൽ നിലനിൽപ്പിന്റെ മണ്ഡലം എന്നിവ സൂചിപ്പിക്കാം. ‘സ്വന്തമായ’ എന്നു പറഞ്ഞ് ഉടമസ്ഥതയായി മാത്രം ചുരുക്കാതെ മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ തുറന്നത്വം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ലേഖനാഭിവാദനശൈലി. ‘ചേർന്ന്’ എന്നും ‘എഴുതുന്നത്’ എന്നും ചേർത്തത് മൂന്ന് അയച്ചവരെയും അഭിസംബോധനയെയും മലയാളത്തിൽ വ്യക്തമായി ബന്ധിപ്പിക്കാനാണ്; പുതിയ ദൈവശാസ്ത്രവിവരം ചേർക്കുന്നില്ല. പ്രധാനപാഠത്തിലെ [a], [b] അടയാളങ്ങൾ ബന്ധപ്പെട്ട പദങ്ങൾക്ക് സമീപം നൽകിയിരിക്കുന്നു.
