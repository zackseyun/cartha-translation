id: 1TH.3.12
reference: 1 Thessalonians 3:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὑμᾶς δὲ ὁ κύριος πλεονάσαι καὶ περισσεύσαι τῇ ἀγάπῃ εἰς ἀλλήλους καὶ εἰς πάντας, καθάπερ καὶ ἡμεῖς εἰς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/012.yaml
  text: And may the Lord cause you to increase and abound in love for one another and for all[a], just as we also do for you[b],
translation:
  language: ml
  text: കർത്താവ് നിങ്ങളെ പരസ്പരത്തോടും എല്ലാവരോടുമുള്ള സ്നേഹത്തിൽ വർധിക്കാനും കവിഞ്ഞൊഴുകാനും ഇടയാക്കട്ടെ[a]—ഞങ്ങൾ നിങ്ങളോടു ചെയ്യുന്നതുപോലെതന്നെ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പരസ്പരം സ്നേഹിക്കുന്നതിലും എല്ലാവരെയും സ്നേഹിക്കുന്നതിലും.’
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ അവസാന ഭാഗം അപൂർണവാക്യമാണ്; അക്ഷരാർഥത്തിൽ, ‘ഞങ്ങളും നിങ്ങളോടു.’ മുൻഭാഗത്തിലെ ‘സ്നേഹത്തിൽ വർധിക്കാനും കവിഞ്ഞൊഴുകാനും ഇടയാകുക’ എന്ന ആശയം ഇവിടെ പൂരിപ്പിച്ചു മനസ്സിലാക്കണം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ κύριος
  choice: കർത്താവ്
  rationale: പൗലോസിന്റെ പ്രാർഥനാശംസയിൽ κύριος എന്ന ദൈവിക/ക്രിസ്തുവിഷയക സ്ഥാനപ്പേരിന്റെ സ്വാഭാവികവും പരമ്പരാഗതവുമായ മലയാളരൂപം; ആരെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് വിവർത്തനത്തിൽ കൂടുതൽ വ്യക്തമാക്കുന്നില്ല.
- source_word: πλεονάσαι
  choice: വർധിക്കാൻ ഇടയാക്കട്ടെ
  rationale: ആശംസ സൂചിപ്പിക്കുന്ന ഓപ്റ്റേറ്റീവ് രൂപവും കർത്താവാണ് വർധന വരുത്തുന്നത് എന്ന കാരണാർഥവും മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: περισσεύσαι
  choice: കവിഞ്ഞൊഴുകാൻ ഇടയാക്കട്ടെ
  rationale: πλεονάσαι-യോടൊപ്പം വരുന്ന തീവ്രതയും സമൃദ്ധിയുടെ ആശയവും നിലനിർത്തിക്കൊണ്ട് രണ്ട് ക്രിയകളെയും വേർതിരിക്കുന്നു.
- source_word: τῇ ἀγάπῃ
  choice: സ്നേഹത്തിൽ
  rationale: വർധന സംഭവിക്കുന്ന മേഖലയെയോ കാര്യത്തെയോ സൂചിപ്പിക്കുന്ന ദത്തിവ് സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: εἰς ἀλλήλους καὶ εἰς πάντας
  choice: പരസ്പരവും എല്ലാവരോടുമുള്ള
  rationale: സ്നേഹത്തിന്റെ ദിശ ബന്ധസൂചകമായ മലയാളപ്രയോഗത്തിലൂടെ നൽകുന്നു; πάντας എന്നതിന്റെ പരിധി വിശ്വാസികളിലേക്കോ സകല മനുഷ്യരിലേക്കോ ചുരുക്കുന്നില്ല.
- source_word: καθάπερ καὶ ἡμεῖς εἰς ὑμᾶς
  choice: ഞങ്ങൾക്കും നിങ്ങളോടുള്ളതുപോലെതന്നെ
  rationale: ഗ്രീക്കിലെ അപൂർണവാക്യസ്വഭാവം മലയാളത്തിൽ മനസ്സിലാകുന്ന പരിധിയിൽ നിലനിർത്തുന്നു; മുൻവാക്യത്തിലെ സ്നേഹവും അതിന്റെ സമൃദ്ധിയും സ്വാഭാവികമായി പൂരിപ്പിച്ചുവായിക്കാം.
- source_word: δὲ
  choice: വാക്യാരംഭത്തിൽ പ്രത്യേകം വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: മലയാളത്തിൽ മുൻസന്ദർഭത്തോടുള്ള മൃദുവായ തുടർച്ച വിരാമമില്ലാതെ സ്വാഭാവികമായി ലഭിക്കുന്നു; ‘എന്നാൽ’ എന്നു നൽകിയാൽ ഇല്ലാത്ത ശക്തമായ വൈരുധ്യം തോന്നാം.
theological_decisions:
- issue: ‘കർത്താവ്’ എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: ‘കർത്താവ്’ എന്നു മാത്രം നൽകി
  alternative: ക്രിസ്തുവിനെ വ്യക്തമായി ചേർക്കുക; ദൈവത്തെ വ്യക്തമായി ചേർക്കുക
  rationale: κύριος എന്ന സ്ഥാനപ്പേര് തന്നെയാണ് മൂലപാഠത്തിലുള്ളത്. സന്ദർഭം ഒരു പ്രത്യേക സൂചിതവ്യക്തിയെ നിർദേശിച്ചേക്കാമെങ്കിലും ഈ വാക്യത്തിൽ ഇല്ലാത്ത വിശദീകരണം വിവർത്തനത്തിൽ ചേർക്കുന്നില്ല.
- issue: πάντας എന്നതിന്റെ പരിധി
  choice: ‘എല്ലാവരും’ എന്ന വിശാലവും നിർവചിക്കാത്തതുമായ അർഥം നിലനിർത്തി
  alternative: എല്ലാ മനുഷ്യരും; എല്ലാ വിശ്വാസികളും
  rationale: സ്നേഹം ക്രൈസ്തവസമൂഹത്തിനു പുറത്തേക്കും വ്യാപിക്കുന്നതായി മനസ്സിലാക്കാമെങ്കിലും ഗ്രീക്ക് പദം തന്നെ പരിധി നിർണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ആദരവാർന്നതുമായ പ്രാർഥനാശംസാശൈലി. ‘വർധിക്കുക/കവിഞ്ഞൊഴുകുക’ എന്ന ക്രിയാജോടി മൂലപാഠത്തിലെ ആവർത്തനതീവ്രത നിലനിർത്തുന്നു; അവസാന ഭാഗത്തിന്റെ യഥാർഥ അപൂർണത അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുന്നു.
