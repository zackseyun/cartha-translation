id: 1TH.3.13
reference: 1 Thessalonians 3:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰς τὸ στηρίξαι ὑμῶν τὰς καρδίας ἀμέμπτους ἐν ἁγιωσύνῃ ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν ἐν τῇ παρουσίᾳ τοῦ κυρίου ἡμῶν ⸀Ἰησοῦ μετὰ πάντων τῶν ἁγίων ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/013.yaml
  text: so that he may establish your hearts blameless in holiness before our God and Father at the coming of our Lord Jesus with all his holy ones[a].
translation:
  language: ml
  text: നമ്മുടെ കർത്താവായ യേശു തന്റെ സകല വിശുദ്ധരോടുംകൂടെ വരുമ്പോൾ, നമ്മുടെ ദൈവവും പിതാവുമായവന്റെ മുമ്പാകെ നിങ്ങളുടെ ഹൃദയങ്ങളെ വിശുദ്ധിയിൽ കുറ്റമറ്റവയായി ഉറപ്പിക്കട്ടെ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς τὸ στηρίξαι
  choice: ഉറപ്പിക്കേണ്ടതിന്
  rationale: മുൻവാക്യത്തിൽനിന്ന് തുടരുന്ന ഉദ്ദേശ്യാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: στηρίξαι
  choice: ഉറപ്പിക്കുക
  rationale: ഹൃദയങ്ങളെ ശക്തവും സ്ഥിരവുമാക്കുക എന്ന ക്രിയയുടെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: καρδίας
  choice: ഹൃദയങ്ങൾ
  rationale: വികാരങ്ങൾ മാത്രം അല്ല, ആന്തരിക വ്യക്തിത്വത്തെ സൂചിപ്പിക്കുന്ന പൗലൊസിന്റെ പ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: ἀμέμπτους
  choice: കുറ്റമറ്റവയായി
  rationale: ന്യായമായ കുറ്റാരോപണത്തിന് ഇടയില്ലാത്ത അവസ്ഥ എന്ന ധാർമിക അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: ἐν ἁγιωσύνῃ
  choice: വിശുദ്ധിയിൽ
  rationale: വിശുദ്ധി എന്ന ഗുണമോ അവസ്ഥയോ നേരിട്ടും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
- source_word: ἔμπροσθεν
  choice: മുമ്പാകെ
  rationale: ദൈവത്തിന്റെ സന്നിധിയിലും ദൃഷ്ടിയിലും നിൽക്കുക എന്ന ആശയം മാന്യമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: നമ്മുടെ ദൈവവും പിതാവുമായവൻ
  rationale: ദൈവവും പിതാവും എന്ന സംയുക്ത വിശേഷണം ഒരേ വ്യക്തിയെ സൂചിപ്പിക്കുന്നതായി ഗ്രീക്ക് ഘടനയ്ക്കനുസരിച്ച് നിലനിർത്തുന്നു.
- source_word: παρουσίᾳ
  choice: വരുന്ന വേളയിൽ
  rationale: ഈ അന്ത്യകാലസന്ദർഭത്തിൽ കർത്താവിന്റെ ഭാവിയിലെ ആഗമനം എന്ന അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: κυρίου ἡμῶν Ἰησοῦ
  choice: നമ്മുടെ കർത്താവായ യേശു
  rationale: κύριος എന്ന ക്രിസ്തുശീർഷകം ‘കർത്താവ്’ എന്നു നിലനിർത്തുകയും പേര് മലയാളരീതിയിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: μετὰ πάντων τῶν ἁγίων αὐτοῦ
  choice: തന്റെ സകല വിശുദ്ധരോടുംകൂടെ
  rationale: ἅγιοι ആരെ സൂചിപ്പിക്കുന്നു എന്നു മുഖ്യപാഠത്തിൽ പരിമിതപ്പെടുത്താതെ ‘വിശുദ്ധർ’ എന്ന വ്യാപകമായ പദം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: ‘തന്റെ സകല വിശുദ്ധർ’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: ദൂതന്മാരോ വിശുദ്ധജനമോ ഇരുകൂട്ടരുമോ എന്നു നിർണ്ണയിക്കാതെ ‘വിശുദ്ധർ’ എന്നു നിലനിർത്തി.
  alternative: തന്റെ സകല വിശുദ്ധജനത്തോടുംകൂടെ / തന്റെ സകല ദൂതന്മാരോടുംകൂടെ
  rationale: അന്ത്യകാലസന്ദർഭത്തിലെ ἁγίων എന്ന ഗ്രീക്ക് പദം വിശുദ്ധരായ മനുഷ്യരെയോ ദൂതന്മാരെയോ ഇരുകൂട്ടരെയുമോ സൂചിപ്പിക്കാം; വാക്യം തന്നെ തീർപ്പാക്കാത്തത് പരിഭാഷയും തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്ക് വാക്യം മുൻവാക്യത്തിൽ ആശ്രയിക്കുന്നതിനാൽ മലയാളത്തിൽ അർഥപൂർണമായ സമാപനം ലഭിക്കാൻ ‘അവൻ അങ്ങനെ ചെയ്യട്ടെ’ ചേർത്തിരിക്കുന്നു; ഉദ്ദേശ്യാർഥവും പ്രാർത്ഥനാസ്വഭാവവും നിലനിർത്തുന്നു.
