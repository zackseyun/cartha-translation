revisions:
- from: ഈ കഷ്ടതകളാൽ ആരും ചഞ്ചലരാകാതിരിക്കേണ്ടതിന്.[a][b] ഇതിനായിട്ടാണ് നാം നിയമിക്കപ്പെട്ടിരിക്കുന്നതെന്ന് നിങ്ങൾതന്നെ അറിയുന്നുവല്ലോ.[c]
