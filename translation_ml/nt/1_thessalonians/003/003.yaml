source:
  edition: SBLGNT
  text: τὸ μηδένα σαίνεσθαι ἐν ταῖς θλίψεσιν ταύταις. αὐτοὶ γὰρ οἴδατε ὅτι εἰς τοῦτο κείμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/003.yaml
  text: so that no one would be shaken by these afflictions[c][b][a]. For you yourselves know that we are appointed for this.
translation:
  language: ml
  text: ആരും ഈ കഷ്ടതകളാൽ മനസ്സിളകാതിരിക്കേണ്ടതിന്.[a][b] നാം ഇതിനായി നിയോഗിക്കപ്പെട്ടിരിക്കുന്നുവെന്ന് നിങ്ങൾതന്നെ അറിയുന്നുവല്ലോ.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മനസ്സിളകുക’ എന്നതിന് പകരം ‘അസ്വസ്ഥരാകുക’ അല്ലെങ്കിൽ ‘ഇളകിപ്പോകുക’ എന്നും പരിഭാഷപ്പെടുത്താം; അപൂർവമായ ഈ ഗ്രീക്ക് ക്രിയയ്ക്ക് മറ്റു സന്ദർഭങ്ങളിൽ ‘വഞ്ചിക്കപ്പെടുക’ അഥവാ ‘മുഖസ്തുതിയാൽ വശീകരിക്കപ്പെടുക’ എന്ന അർഥവും ഉണ്ടാകാം.
    reason: lexical_alternative
  - marker: b
    text: ‘കഷ്ടതകൾ’ എന്നതിന് പകരം ‘പീഡനങ്ങൾ’ അല്ലെങ്കിൽ ‘ദുരിതങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: ‘നാം ഇതിനായി നിശ്ചയിക്കപ്പെട്ടിരിക്കുന്നു’ അല്ലെങ്കിൽ ‘നാം ഇതിനായി വെക്കപ്പെട്ടിരിക്കുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ μηδένα σαίνεσθαι
  choice: ആരും ചഞ്ചലരാകാതിരിക്കേണ്ടതിന്
  rationale: മുൻവാക്യവുമായി ബന്ധമുള്ള ഉദ്ദേശ്യം/ഫലം സൂചിപ്പിക്കുന്ന articular infinitive മലയാളത്തിൽ ‘-ാതിരിക്കേണ്ടതിന്’ എന്നു സ്വാഭാവികമായി വരുന്നു. അപൂർവമായ σαίνεσθαι ഇവിടെ കഷ്ടതകളാൽ മനസ്സുറപ്പ് നഷ്ടപ്പെടുക, ഇളകിപ്പോകുക എന്ന ആശയം നൽകുന്നതിനാൽ ‘ചഞ്ചലരാകുക’ തിരഞ്ഞെടുത്തു.
- source_word: ἐν ταῖς θλίψεσιν ταύταις
  choice: ഈ കഷ്ടതകളാൽ
  rationale: θλῖψις സമ്മർദം, ദുരിതം, പീഡനം എന്നിവ ഉൾക്കൊള്ളുന്നു; സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ഗൗരവമുള്ളതുമായ ‘കഷ്ടതകൾ’ അനുയോജ്യം. ἐν സാഹചര്യത്തെയോ കാരണത്തെയോ സൂചിപ്പിക്കുന്നതായി ഇവിടെ ‘-ആൽ’ എന്നു സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
- source_word: αὐτοὶ
  choice: നിങ്ങൾതന്നെ
  rationale: ഊന്നൽ നൽകുന്ന സർവനാമത്തിന്റെ ശക്തി ‘തന്നെ’ നിലനിർത്തുന്നു.
- source_word: γὰρ
  choice: വല്ലോ
  rationale: γάρ നൽകുന്ന വിശദീകരണബന്ധം മലയാളവാക്യത്തിലെ ‘അറിയുന്നുവല്ലോ’ എന്ന പ്രയോഗത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: οἴδατε
  choice: അറിയുന്നു
  rationale: രൂപത്തിൽ perfect ആയിരുന്നാലും വർത്തമാനാർഥത്തിൽ പ്രവർത്തിക്കുന്നതിനാൽ സാധാരണ മലയാളമായ ‘അറിയുന്നു’ ഉപയോഗിച്ചു.
- source_word: εἰς τοῦτο
  choice: ഇതിനായി
  rationale: തൊട്ടുമുമ്പ് പറഞ്ഞ കഷ്ടതകളിലേക്കാണ് സൂചന. ‘ഇതിനായി’ സംക്ഷിപ്തമായി ആ ബന്ധം നിലനിർത്തുന്നു; ‘ഈ ഉദ്ദേശ്യത്തിനായി’ എന്നു പറഞ്ഞാൽ അനാവശ്യമായ ഉദ്ദേശ്യവ്യാഖ്യാനം വരാം.
- source_word: κείμεθα
  choice: നാം നിയമിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: κεῖμαι എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘വെക്കപ്പെട്ടിരിക്കുക’ എന്നാണെങ്കിലും ഈ പ്രയോഗത്തിൽ നിയോഗിക്കപ്പെടുക/നിശ്ചയിക്കപ്പെടുക എന്ന ആശയമാണ്. ‘നിയമിക്കപ്പെട്ടിരിക്കുന്നു’ passive ഭാവവും ദൈവിക ക്രമീകരണത്തിന്റെ സൂചനയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: εἰς τοῦτο κείμεθα എന്നതിൽ വിശ്വാസികളും കഷ്ടതയും തമ്മിലുള്ള ബന്ധം
  choice: ഇതിനായിട്ടാണ് നാം നിയമിക്കപ്പെട്ടിരിക്കുന്നത്
  alternative: ഇതിനായിട്ടാണ് നാം നിശ്ചയിക്കപ്പെട്ടിരിക്കുന്നത് / ഇതിനായിട്ടാണ് നാം വെക്കപ്പെട്ടിരിക്കുന്നത്
  rationale: വിശ്വാസജീവിതത്തിൽ കഷ്ടത പ്രതീക്ഷിക്കപ്പെടുന്നതാണെന്ന് വാക്യം വ്യക്തമാക്കുന്നു; എന്നാൽ മുൻനിശ്ചയത്തെക്കുറിച്ചുള്ള വിശദമായ ഒരു സിദ്ധാന്തം ഇത് നിർവചിക്കുന്നില്ല. ‘നിയമിക്കപ്പെട്ടിരിക്കുന്നു’ വാക്യത്തിന്റെ ദൈവശാസ്ത്രപരമായ ഭാരം നിലനിർത്തുമ്പോഴും പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ വ്യാഖ്യാനം അടിച്ചേൽപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വായനാസൗകര്യവും ഒരുമിച്ച് ലക്ഷ്യമാക്കി. ‘നിങ്ങൾതന്നെ’ മൂലത്തിലെ ഊന്നൽ സൂക്ഷിക്കുന്നു. അപൂർവക്രിയയുടെ അർഥവൈവിധ്യവും κείμεθα എന്നതിലെ ‘നിയമിക്കപ്പെട്ട/നിശ്ചയിക്കപ്പെട്ട’ വ്യത്യാസവും അടിക്കുറിപ്പുകളിൽ തുറന്നുവെച്ചു.
