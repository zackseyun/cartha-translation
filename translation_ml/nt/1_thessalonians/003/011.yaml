  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ὁ θεὸς καὶ πατὴρ ἡμῶν καὶ ὁ κύριος ἡμῶν ⸀Ἰησοῦς κατευθύναι τὴν ὁδὸν ἡμῶν πρὸς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/011.yaml
  text: May our God and Father himself[a], and our Lord Jesus[b], direct our way to you.
translation:
  language: ml
  text: നമ്മുടെ ദൈവവും പിതാവുമായവൻ തന്നെയും[a] നമ്മുടെ കർത്താവായ യേശുവും നിങ്ങളുടെ അടുക്കലേക്കുള്ള ഞങ്ങളുടെ വഴി നേരെയാക്കട്ടെ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ‘നേരെയാക്കട്ടെ’ എന്ന ക്രിയ ഏകവചനത്തിലാണ്; എന്നാൽ അതിന്റെ സംയോജിത കർത്താക്കൾ ‘നമ്മുടെ ദൈവവും പിതാവുമായവൻ’, ‘നമ്മുടെ കർത്താവായ യേശു’ എന്നിവരാണ്.
    reason: cross_reference
  - marker: b
    text: 'അഥവാ: ‘നിങ്ങളുടെ അടുക്കലേക്കുള്ള ഞങ്ങളുടെ പാത നേരെയാക്കട്ടെ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς
  choice: മായവൻതന്നെയും
  rationale: αὐτός ഇവിടെ തീവ്രത സൂചിപ്പിക്കുന്നതിനാൽ, ദൈവവും പിതാവുമായവൻ വ്യക്തിപരമായി പ്രവർത്തിക്കണമെന്ന ഊന്നൽ ‘തന്നെ’ എന്ന പദം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: δέ ഇവിടെ ശക്തമായ വിരോധമല്ല, പ്രാർത്ഥനാശംസയിലേക്കുള്ള മൃദുവായ സംക്രമണമാണ്. മലയാളത്തിൽ നിർബന്ധമായി ഒരു സംയോജകപദം ചേർത്താൽ മൂലത്തിൽ ഇല്ലാത്ത കാലികമോ വിരോധാത്മകമോ ആയ ഭാവം വരാം; അതിനാൽ വാക്യക്രമം തന്നെയാണ് സംക്രമണം വഹിക്കുന്നത്.
- source_word: ὁ θεὸς καὶ πατὴρ ἡμῶν
  choice: നമ്മുടെ ദൈവവും പിതാവുമായവൻ
  rationale: θεός, πατήρ എന്നീ രണ്ടു വിശേഷണങ്ങളും ഒരേ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ഘടന മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ὁ κύριος ἡμῶν Ἰησοῦς
  choice: നമ്മുടെ കർത്താവായ യേശു
  rationale: κύριος എന്നതിന് ‘കർത്താവ്’ എന്നും Ἰησοῦς എന്നതിന് ‘യേശു’ എന്നും നൽകി, ἡμῶν സൂചിപ്പിക്കുന്ന ‘നമ്മുടെ’ നിലനിർത്തുന്നു.
- source_word: κατευθύναι
  choice: നേരെയാക്കട്ടെ
  rationale: അയോറിസ്റ്റ് ഒപ്റ്റേറ്റീവ് പ്രാർത്ഥനാശംസ പ്രകടിപ്പിക്കുന്നു. ‘നേരെയാക്കട്ടെ’ എന്നത് വഴി നേരെയാക്കുക, യാത്ര സാധ്യമാക്കുക എന്നീ അർത്ഥസൂചനകൾ നിലനിർത്തുന്നു.
- source_word: τὴν ὁδὸν ἡμῶν
  choice: ഞങ്ങളുടെ വഴി
  rationale: ὁδός എന്നത് യഥാർത്ഥ പാതയെയോ യാത്രാമാർഗത്തെയോ സൂചിപ്പിക്കാം; ‘വഴി’ ഈ രണ്ടുതലങ്ങളും സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: πρὸς ὑμᾶς
  choice: നിങ്ങളുടെ അടുക്കലേക്കുള്ള
  rationale: πρός ഇവിടെ തെസ്സലൊനീക്യരിലേക്കുള്ള യാത്രയുടെ ദിശ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘നിങ്ങളുടെ അടുക്കലേക്ക്’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
theological_decisions:
- issue: ‘നമ്മുടെ ദൈവവും പിതാവും’, ‘നമ്മുടെ കർത്താവായ യേശു’ എന്നീ സംയോജിത കർത്താക്കളോടൊപ്പം ഏകവചന ക്രിയ ഉപയോഗിച്ചിരിക്കുന്നത്
  choice: 'രണ്ടു കർത്താക്കളെയും വ്യക്തമായി നിലനിർത്തി, ഒരേയൊരു പ്രാർത്ഥനാശംസാ ക്രിയയിൽ ചേർത്തു: ‘...വഴി നേരെയാക്കട്ടെ.’'
  alternative: ക്രിയ ദൈവത്തോടു മാത്രം ബന്ധിപ്പിക്കുകയോ, രണ്ടു വേറിട്ട ക്രിയകളാക്കി പുനർഘടിപ്പിക്കുകയോ ചെയ്യുക.
  rationale: ഗ്രീക്ക് പാഠം പിതാവിനെയും കർത്താവായ യേശുവിനെയും ഒരുമിച്ച് ഒരു ഏകവചന ഒപ്റ്റേറ്റീവിന്റെ കർത്താക്കളാക്കുന്നു. മലയാളക്രിയയിൽ സംഖ്യ നിർബന്ധമായി അടയാളപ്പെടുന്നില്ലെങ്കിലും, രണ്ടു കർത്താക്കളും ഒരൊറ്റ വിധേയത്തിൽ ചേർന്നിരിക്കുന്ന ഘടന മൂലപാഠത്തിലെ വ്യാകരണപരവും ദൈവശാസ്ത്രപരവുമായ സംഘർഷം വ്യാഖ്യാനിച്ച് തീർക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ പ്രാർത്ഥനാശംസാ ശൈലി. ‘മായവൻതന്നെ’ αὐτός നൽകുന്ന ഊന്നൽ സൂക്ഷിക്കുന്നു; ‘നേരെയാക്കട്ടെ’ മൂലത്തിലെ പാതാസങ്കൽപ്പവും യാത്ര സാധ്യമാക്കുന്ന അർത്ഥവും നിലനിർത്തുന്നു.
