id: 1TH.3.9
reference: 1 Thessalonians 3:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τίνα γὰρ εὐχαριστίαν δυνάμεθα τῷ θεῷ ἀνταποδοῦναι περὶ ὑμῶν ἐπὶ πάσῃ τῇ χαρᾷ ᾗ χαίρομεν δι’ ὑμᾶς ἔμπροσθεν τοῦ θεοῦ ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/009.yaml
  text: For what thanksgiving can we repay to God concerning you[a], for all the joy with which we rejoice because of you before our God,
translation:
  language: ml
  text: നിങ്ങൾ നിമിത്തം ഞങ്ങളുടെ ദൈവസന്നിധിയിൽ ഞങ്ങൾ സന്തോഷിക്കുന്ന ഈ സന്തോഷമെല്ലാം ഓർത്ത്, നിങ്ങളെക്കുറിച്ച് ദൈവത്തിന് എന്ത് നന്ദിയാണ് ഞങ്ങൾക്ക് തിരികെ അർപ്പിക്കാൻ കഴിയുക?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ സ്വാഭാവികമായി: “നിങ്ങൾക്കായി ദൈവത്തോട് എത്ര നന്ദി പറഞ്ഞാലും മതിയാകുമോ?” ഗ്രീക്കിൽ കൂടുതൽ അക്ഷരാർഥത്തിൽ: “നിങ്ങളെക്കുറിച്ച് ദൈവത്തിന് എന്ത് നന്ദി തിരികെ നൽകാൻ ഞങ്ങൾക്ക് കഴിയും?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνα … εὐχαριστίαν
  choice: എന്ത് നന്ദിയാണ്
  rationale: നേരിട്ടുള്ള ആലങ്കാരികചോദ്യം നിലനിർത്തുകയും അവരുടെ നന്ദി മതിയാകില്ലെന്ന ഭാവം പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: δυνάμεθα
  choice: ഞങ്ങൾക്ക് … കഴിയുക
  rationale: വർത്തമാനകാലത്തിലെ കഴിവിനെ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ ചോദ്യഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀνταποδοῦναι
  choice: തിരികെ അർപ്പിക്കാൻ
  rationale: ദൈവത്തിന് മറുപകരമായി നന്ദി നൽകുക എന്ന ക്രിയയിലെ പ്രത്യുപകാരരൂപകം നിലനിർത്തുന്നു; ‘അർപ്പിക്കുക’ ദൈവത്തോടുള്ള നന്ദിയുടെ സാഹചര്യത്തിൽ സ്വാഭാവികമാണ്.
- source_word: περὶ ὑμῶν
  choice: നിങ്ങളെക്കുറിച്ച്
  rationale: περί + genitive സൂചിപ്പിക്കുന്ന പരാമർശബന്ധം കൃത്യമായി നൽകുകയും തുടർന്നുള്ള δι’ ὑμᾶς എന്ന കാരണപ്രയോഗത്തിൽനിന്ന് വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐπὶ πάσῃ τῇ χαρᾷ
  choice: ഈ സന്തോഷമെല്ലാം ഓർത്ത്
  rationale: നന്ദിയുടെ അടിസ്ഥാനമോ സന്ദർഭമോ സൂചിപ്പിക്കുന്ന ἐπίയുടെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; πάσῃയുടെ സമഗ്രതയും നിലനിർത്തുന്നു.
- source_word: ᾗ χαίρομεν
  choice: ഞങ്ങൾ സന്തോഷിക്കുന്ന
  rationale: χαράയും χαίρωയും തമ്മിലുള്ള പദബന്ധം ‘സന്തോഷം/സന്തോഷിക്കുക’ എന്ന ആവർത്തനത്തിലൂടെ ബോധപൂർവം സംരക്ഷിക്കുന്നു.
- source_word: δι’ ὑμᾶς
  choice: നിങ്ങൾ നിമിത്തം
  rationale: διά + accusative ഇവിടെ സൂചിപ്പിക്കുന്ന കാരണബന്ധം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἔμπροσθεν τοῦ θεοῦ ἡμῶν
  choice: ഞങ്ങളുടെ ദൈവസന്നിധിയിൽ
  rationale: ദൈവത്തിന്റെ സാന്നിധ്യം സൂചിപ്പിക്കുന്ന സ്ഥാനരൂപകം ആധുനികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ദൈവത്തോടുള്ള നന്ദിയെ ‘തിരികെ നൽകൽ’ എന്നു പറയുന്നതിന്റെ ആലങ്കാരികബലം
  choice: ‘തിരികെ അർപ്പിക്കാൻ’ എന്ന പ്രയോഗത്തിലൂടെ പ്രത്യുപകാരരൂപകം നിലനിർത്തി.
  alternative: ‘നിങ്ങൾക്കായി ദൈവത്തോട് എത്ര നന്ദി പറഞ്ഞാലും മതിയാകുമോ?’
  rationale: ἀνταποδοῦναι എന്ന ക്രിയയിൽ തിരികെ നൽകുക എന്ന ആശയം വ്യക്തമാണ്. ആലങ്കാരികചോദ്യം ഇത് ദൈവത്തോടുള്ള ഇടപാടോ കടം തീർക്കലോ അല്ലെന്നും, അവരുടെ നന്ദിയുടെ അപര്യാപ്തതയാണ് ഊന്നുന്നതെന്നും വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലത്തിലെ ‘സന്തോഷം/സന്തോഷിക്കുക’ ആവർത്തനവും ആലങ്കാരികചോദ്യവും മനപ്പൂർവം നിലനിർത്തിയിരിക്കുന്നു.
