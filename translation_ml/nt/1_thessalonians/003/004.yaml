id: 1TH.3.4
reference: 1 Thessalonians 3:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ γὰρ ὅτε πρὸς ὑμᾶς ἦμεν, προελέγομεν ὑμῖν ὅτι μέλλομεν θλίβεσθαι, καθὼς καὶ ἐγένετο καὶ οἴδατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/004.yaml
  text: For even when we were with you[a], we kept telling you beforehand that we were going to suffer affliction, just as it also happened, and you know it.
translation:
  language: ml
  text: കാരണം, ഞങ്ങൾ നിങ്ങളോടുകൂടെ ഉണ്ടായിരുന്നപ്പോഴും, ഞങ്ങൾ കഷ്ടത അനുഭവിക്കേണ്ടിവരുമെന്ന്[a] നിങ്ങളോടു മുൻകൂട്ടി പറഞ്ഞുകൊണ്ടിരുന്നു; ഞങ്ങൾ മുൻകൂട്ടി പറഞ്ഞതുപോലെതന്നെ അതു സംഭവിക്കുകയും ചെയ്തു; നിങ്ങൾക്കത് അറിയാമല്ലോ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പീഡിപ്പിക്കപ്പെടുക’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് ക്രിയയ്ക്ക് സമ്മർദം, ദുരിതം, അല്ലെങ്കിൽ പീഡനം അനുഭവിക്കുക എന്ന അർത്ഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: ഞങ്ങൾ ... ഉണ്ടായിരുന്നപ്പോഴും
  rationale: γάρ മുൻവാക്യത്തെ വിശദീകരിക്കുന്നു; καί നൽകുന്ന ഊന്നൽ മലയാളത്തിലെ ‘-പ്പോഴും’ എന്ന ഘടനയിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: ὅτε πρὸς ὑμᾶς ἦμεν
  choice: ഞങ്ങൾ നിങ്ങളോടുകൂടെ ഉണ്ടായിരുന്നപ്പോൾ
  rationale: πρὸς ὑμᾶς ഇവിടെ അവരുടെ സാന്നിധ്യത്തിൽ, അവരോടൊപ്പം ആയിരുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: προελέγομεν
  choice: മുൻകൂട്ടി പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: προ- മുൻകൂട്ടിയുള്ള പ്രസ്താവനയെ സൂചിപ്പിക്കുന്നു; imperfect രൂപം ആവർത്തിച്ചോ തുടർച്ചയായോ പറഞ്ഞിരുന്നതിനെ പ്രകടമാക്കുന്നു.
- source_word: μέλλομεν θλίβεσθαι
  choice: ഞങ്ങൾ കഷ്ടം അനുഭവിക്കേണ്ടിവരും
  rationale: μέλλομεν പ്രതീക്ഷിക്കപ്പെട്ട വരാനിരിക്കുന്ന അനുഭവത്തെയും θλίβεσθαι സമ്മർദം, ദുരിതം, പീഡനം എന്നിവ ഉൾക്കൊള്ളാവുന്ന കഷ്ടാനുഭവത്തെയും സൂചിപ്പിക്കുന്നു.
- source_word: καθὼς καὶ ἐγένετο
  choice: അതുപോലെതന്നെ സംഭവിച്ചു
  rationale: പ്രവചനവും സംഭവവും തമ്മിലുള്ള കൃത്യമായ പൊരുത്തം καθώς സൂചിപ്പിക്കുന്നു; καίയുടെ ഊന്നൽ ‘തന്നെ’ നിലനിർത്തുന്നു.
- source_word: καὶ οἴδατε
  choice: എന്നു നിങ്ങൾക്കറിയാമല്ലോ
  rationale: അവർക്ക് ഈ സംഭവം അറിയാമെന്ന ഉറപ്പിനെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ഗ്രീക്കിൽ സൂചിതമായിരിക്കുന്ന വിഷയം ‘എന്നു’ വഴി ബന്ധിപ്പിക്കുന്നു.
theological_decisions:
- issue: θλίβεσθαι സൂചിപ്പിക്കുന്ന കഷ്ടത്തിന്റെ സ്വഭാവം
  choice: പീഡനം ഉൾപ്പെടാവുന്ന പൊതുവായ കഷ്ടാനുഭവം; പ്രത്യേകമായി ചുരുക്കാതെ
  alternative: പ്രത്യേകമായി ‘പീഡിപ്പിക്കപ്പെടുക’ അല്ലെങ്കിൽ സാങ്കേതിക അർത്ഥമുള്ള ‘മഹോപദ്രവം അനുഭവിക്കുക’
  rationale: സന്ദർഭത്തിൽ എതിർപ്പും പീഡനവും സാധ്യതയുള്ളതാണെങ്കിലും, ഗ്രീക്ക് പദം സമ്മർദം, ദുരിതം, പീഡനം തുടങ്ങിയ വിശാല അർത്ഥപരിധി വഹിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘പറഞ്ഞുകൊണ്ടിരുന്നു’ imperfect ഭാവം നിലനിർത്തുന്നു; ‘കഷ്ടം അനുഭവിക്കുക’ മൂലപദത്തിന്റെ വിശാല അർത്ഥം അനാവശ്യമായി ചുരുക്കുന്നില്ല. അടിക്കുറിപ്പ് ചിഹ്നം ആശയപരമായി ബാധകമായ വാക്യാവസാനത്തിൽ ചേർത്തിരിക്കുന്നു.
