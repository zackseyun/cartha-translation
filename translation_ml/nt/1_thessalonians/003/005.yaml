reference: 1 Thessalonians 3:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διὰ τοῦτο κἀγὼ μηκέτι στέγων ἔπεμψα εἰς τὸ γνῶναι τὴν πίστιν ὑμῶν, μή πως ἐπείρασεν ὑμᾶς ὁ πειράζων καὶ εἰς κενὸν γένηται ὁ κόπος ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/005.yaml
  text: For this reason[a], when I could bear it no longer, I sent to learn about your faith[b], lest somehow the tempter had tempted you and our labor might be in vain.
translation:
  language: ml
  text: അതുകൊണ്ട്, എനിക്കും ഇനി സഹിച്ചുനിൽക്കാനാകാതെ വന്നപ്പോൾ, നിങ്ങളുടെ വിശ്വാസത്തെക്കുറിച്ച് അറിയുന്നതിനായി ഞാൻ ഒരാളെ അയച്ചു; എങ്ങനെയെങ്കിലും പ്രലോഭിപ്പിക്കുന്നവൻ നിങ്ങളെ പ്രലോഭിപ്പിച്ച് ഞങ്ങളുടെ അധ്വാനം വ്യർഥമായിത്തീരുമോ എന്ന ആശങ്കയാൽ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യങ്ങളിലെ വിശദീകരണത്തിലേക്കുള്ള കാരണപരമായ പിന്നോട്ടുള്ള സൂചന സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: κἀγὼ
  choice: ഞാൻ
  rationale: καί ഘടകം സന്ദർഭത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളപ്പെടുന്നു; മലയാളത്തിൽ ‘ഞാനും’ എന്നു പറഞ്ഞാൽ അനാവശ്യമായ ഊന്നൽ വരാം.
- source_word: μηκέτι στέγων
  choice: എനിക്ക് ഇനിയും സഹിച്ചുനിൽക്കാൻ കഴിയാതായപ്പോൾ
  rationale: സഹനത്തിന്റെ പരിധിയിലെത്തിയെന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἔπεμψα
  choice: ഞാൻ ആളയച്ചു
  rationale: ഗ്രീക്കിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും അയച്ചത് ഒരാളെ എന്നത് മലയാളത്തിൽ ക്രിയയ്ക്ക് ആവശ്യമായ സ്വാഭാവിക പൂർത്തീകരണമാണ്; തിമൊഥെയൊസിന്റെ പേര് ഇവിടെ ചേർക്കുന്നില്ല.
- source_word: εἰς τὸ γνῶναι τὴν πίστιν ὑμῶν
  choice: നിങ്ങളുടെ വിശ്വാസത്തെക്കുറിച്ച് അറിയാൻ
  rationale: ഉദ്ദേശ്യസൂചക infinitive-ഉം πίστις എന്ന പദത്തിന്റെ ഈ സന്ദർഭത്തിലെ പ്രധാന അർത്ഥവും വ്യക്തമായി നൽകുന്നു.
- source_word: μή πως
  choice: …ഇരുമോ എന്നും …തീരുമോ എന്നും ഞാൻ ഭയപ്പെട്ടു
  rationale: അനിഷ്ടകരമായ സാധ്യതയെക്കുറിച്ചുള്ള ആശങ്ക മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ഗ്രീക്കിലെ apprehensive nuance നിലനിർത്തുന്നു.
- source_word: ἐπείρασεν ὑμᾶς ὁ πειράζων
  choice: പ്രലോഭിപ്പിക്കുന്നവൻ നിങ്ങളെ പ്രലോഭിപ്പിച്ചിരിക്കുമോ
  rationale: പങ്കുപദവും ക്രിയയും തമ്മിലുള്ള ഗ്രീക്ക് പദാവർത്തനം നിലനിർത്തുകയും ഇവിടെ ഉദ്ദേശിക്കുന്ന ദുഷ്പ്രേരണയുടെ അർത്ഥം നൽകുകയും ചെയ്യുന്നു.
- source_word: εἰς κενὸν γένηται ὁ κόπος ἡμῶν
  choice: ഞങ്ങളുടെ അധ്വാനം വ്യർഥമായിത്തീരുമോ
  rationale: κόπος എന്നതിലെ കഠിനാധ്വാനത്തിന്റെ ഭാരം നിലനിർത്തുന്നു; εἰς κενὸν γένηται എന്നത് സ്വാഭാവികമായ മലയാളത്തിൽ ഉദ്ദേശ്യരഹിത ഫലത്തെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഈ പൗലൊസീയ സന്ദർഭത്തിൽ πίστις എന്ന പദത്തിന്റെ അർത്ഥം
  choice: വിശ്വാസം
  alternative: വിശ്വസ്തത; ആശ്രയം
  rationale: ഇവിടെ തെസ്സലൊനീക്യരുടെ സുവിശേഷത്തോടുള്ള തുടർന്നുനിൽക്കുന്ന വിശ്വാസമാണ് ഏറ്റവും സ്വാഭാവികമായ അർത്ഥം; പദത്തിന്റെ സാധ്യതയുള്ള മറ്റു ഭാവങ്ങൾ പ്രധാനവാചകത്തിൽ നിർബന്ധിച്ച് ചേർക്കുന്നില്ല.
- issue: ὁ πειράζων എന്ന വിശേഷണാത്മക പ്രയോഗത്തിന്റെ തിരിച്ചറിയൽ
  choice: പ്രലോഭിപ്പിക്കുന്നവൻ
  alternative: സാത്താൻ
  rationale: സന്ദർഭത്തിൽ സാത്താനെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിലും ഗ്രീക്ക് മൂലപാഠം ഇവിടെ വ്യക്തിനാമമല്ല, വിവരണാത്മകമായ വിശേഷണമാണ് ഉപയോഗിക്കുന്നത്; അതിനാൽ അതേ രൂപം നിലനിർത്തുന്നു.
- issue: μή πως-നോടൊപ്പമുള്ള രണ്ട് സാധ്യതകളുടെ ബന്ധം
  choice: രണ്ടും പൗലൊസിന്റെ ആശങ്കയായി അവതരിപ്പിക്കുന്നു
  alternative: ആദ്യത്തേത് സംഭവിച്ചിരിക്കാമെന്ന ആശങ്കയും രണ്ടാമത്തേത് അതിന്റെ സാധ്യതയുള്ള ഫലവും കൂടുതൽ വ്യാകരണപരമായി വേർതിരിക്കുക
  rationale: ഗ്രീക്ക് വാക്യത്തിലെ കാല-ഭാവ വ്യത്യാസം ‘പ്രലോഭിപ്പിച്ചിരിക്കുമോ’ / ‘വ്യർഥമായിത്തീരുമോ’ എന്ന രൂപങ്ങളിൽ സൂക്ഷിച്ചുകൊണ്ട് മലയാളവാക്യം വായനാസൗകര്യമുള്ളതാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും ലളിതവുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിലെ ആശങ്കയും പദാവർത്തനവും നിലനിർത്തിയപ്പോൾ മലയാളത്തിലെ സ്വാഭാവിക വാക്യഘടനയ്ക്കായി ‘ഞാൻ ഭയപ്പെട്ടു’ എന്നു വ്യക്തമായി ചേർത്തു. അടിക്കുറിപ്പ് ചിഹ്നം പ്രധാനവാചകത്തിൽ നൽകിയിട്ടുണ്ട്.
