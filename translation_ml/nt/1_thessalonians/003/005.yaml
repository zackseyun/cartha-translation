revisions:
- from: അതുകൊണ്ട്, എനിക്ക് ഇനിയും സഹിച്ചുനിൽക്കാൻ കഴിയാതായപ്പോൾ, നിങ്ങളുടെ വിശ്വാസത്തെക്കുറിച്ച് അറിയാൻ ഞാൻ ആളയച്ചു; പ്രലോഭിപ്പിക്കുന്നവൻ നിങ്ങളെ പ്രലോഭിപ്പിച്ചിരിക്കുമോ എന്നും ഞങ്ങളുടെ അധ്വാനം വ്യർഥമായിത്തീരുമോ എന്നും ഞാൻ ഭയപ്പെട്ടു.[a]
  to: അതുകൊണ്ട്, എനിക്കും ഇനി സഹിച്ചുനിൽക്കാനാകാതെ വന്നപ്പോൾ, നിങ്ങളുടെ വിശ്വാസത്തെക്കുറിച്ച് അറിയുന്നതിനായി ഞാൻ ഒരാളെ അയച്ചു; എങ്ങനെയെങ്കിലും പ്രലോഭിപ്പിക്കുന്നവൻ നിങ്ങളെ പ്രലോഭിപ്പിച്ച് ഞങ്ങളുടെ അധ്വാനം വ്യർഥമായിത്തീരുമോ എന്ന ആശങ്കയാൽ.
  rationale: The sentence has been recast so that Paul’s sending is motivated by apprehension that the tempter may have acted with the result that their labor would become futile. ‘എനിക്കും’ retains the additive force of κἀγώ. The footnote anchor remains attached to ‘വിശ്വാസം’ in the complete text.
