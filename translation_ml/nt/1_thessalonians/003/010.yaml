  yaml_path: translation/nt/1_thessalonians/003/010.yaml
  text: night and day praying most earnestly to see your face and to supply what is lacking in your faith,[a]
translation:
  language: ml
  text: 'ഞങ്ങൾ രാവും പകലും അത്യന്തം ആത്മാർഥമായി പ്രാർഥിക്കുന്നു: നിങ്ങളെ നേരിൽ കാണാനും നിങ്ങളുടെ വിശ്വാസത്തിലെ കുറവുകൾ പരിഹരിക്കാനും.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങളുടെ വിശ്വാസത്തിൽ കുറവായിരിക്കുന്നത്.’ ഗ്രീക്കുപദങ്ങൾ നിങ്ങളുടെ വിശ്വാസത്തിൽ ഇനിയും ബലപ്പെടുത്തുകയോ പൂർണമാക്കുകയോ വേണ്ടതിനെ കൂടുതൽ വിശാലമായി സൂചിപ്പിക്കാനും കഴിയും.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυκτὸς καὶ ἡμέρας
  choice: രാവും പകലും
  rationale: കാലസൂചകമായ ഷഷ്ഠികൾ ആവർത്തിച്ചോ തുടർച്ചയായോ നടക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘രാവും പകലും’ ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗമാണ്.
- source_word: ὑπερεκπερισσοῦ
  choice: അത്യന്തം ആത്മാർഥമായി
  rationale: അപൂർവമായ ഈ ക്രിയാവിശേഷണം അതിശക്തമായ തീവ്രത പ്രകടിപ്പിക്കുന്നു. പ്രാർഥനയുടെ ആത്മാർഥതയും അസാധാരണമായ തീവ്രതയും ഈ പരിഭാഷ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: δεόμενοι
  choice: പ്രാർഥിച്ചുകൊണ്ടിരിക്കുന്നു
  rationale: ഈ വർത്തമാനകാല കൃദന്തം ആത്മാർഥമായ അപേക്ഷയെ സൂചിപ്പിക്കുന്നു. നൽകിയിരിക്കുന്ന വാക്യഖണ്ഡം സ്വതന്ത്രമായി വായിക്കാവുന്നതാക്കാൻ സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്ന ഒന്നാംപുരുഷ ബഹുവചനവും തുടരുന്ന പ്രവൃത്തിയും ക്രിയാരൂപത്തിൽ വ്യക്തമാക്കിയിരിക്കുന്നു.
- source_word: εἰς τὸ ἰδεῖν
  choice: കാണാനും വേണ്ടി
  rationale: εἰς സഹിതമുള്ള articular infinitive ഇവിടെ ഉദ്ദേശ്യം പ്രകടിപ്പിക്കുന്നു.
- source_word: ὑμῶν τὸ πρόσωπον
  choice: നിങ്ങളുടെ മുഖം
  rationale: മൂലത്തിലെ ദൃശ്യമായ ‘നിങ്ങളുടെ മുഖം’ എന്ന പ്രയോഗം നിലനിർത്തുന്നു; അത് നേരിട്ടുള്ള വ്യക്തിപരമായ കൂടിക്കാഴ്ചയെയും സാന്നിധ്യത്തെയും സൂചിപ്പിക്കുന്നു.
- source_word: καταρτίσαι
  choice: നികത്താനും
  rationale: καταρτίζω എന്നതിന് ക്രമപ്പെടുത്തുക, പുനഃസ്ഥാപിക്കുക, സജ്ജമാക്കുക, പൂർണമാക്കുക എന്നീ അർഥവ്യാപ്തികളുണ്ട്. ‘കുറവുള്ളത്’ എന്നതിനൊപ്പം ‘നികത്തുക’ സ്വാഭാവികമായ യോജിപ്പാണ്; ആവശ്യമായത് നൽകി കുറവ് പരിഹരിക്കുന്ന ആശയം കൈമാറുന്നു.
- source_word: τὰ ὑστερήματα
  choice: കുറവുള്ളത്
  rationale: ബഹുവചനനാമം കുറവുകളെയോ അപൂർണതകളെയോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ഇവിടെ സമൂഹാർഥമുള്ള ഏകവചനപ്രയോഗം സ്വാഭാവികമാണ്.
- source_word: τῆς πίστεως ὑμῶν
  choice: നിങ്ങളുടെ വിശ്വാസത്തിൽ
  rationale: πίστις ഇവിടെ തെസ്സലൊനീക്യരുടെ വിശ്വാസം/ആശ്രയം എന്ന നിലയിലാണ്. ‘വിശ്വാസത്തിൽ’ എന്നത് വിശ്വാസം ഇല്ലെന്നല്ല, അതിൽ ഇനിയും ബലപ്പെടുത്തേണ്ട മേഖലകളുണ്ടെന്ന ആശയം നൽകുന്നു.
theological_decisions:
- issue: πίστις എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: വിശ്വാസം
  alternative: വിശ്വസ്തത; ആശ്രയം
  rationale: ഈ സന്ദർഭത്തിൽ തെസ്സലൊനീക്യരുടെ ദൈവത്തിലുള്ള വിശ്വാസവും ആശ്രയവുമാണ് പ്രധാനമായി ഉദ്ദേശിക്കുന്നത്; പെരുമാറ്റപരമായ ‘വിശ്വസ്തത’ മുഖ്യാർഥമല്ല, എങ്കിലും പദത്തിന്റെ അർഥവ്യാപ്തിയിൽ അത് സാധ്യമാണ്.
- issue: വിശ്വാസത്തിലെ ‘കുറവ്’ എന്നതിന്റെ വ്യാപ്തി
  choice: കുറവുള്ളത് നികത്തുക
  alternative: ഇനിയും ബലപ്പെടുത്തുകയോ പൂർണമാക്കുകയോ വേണ്ടത്
  rationale: മൂലത്തിലെ καταρτίσαι τὰ ὑστερήματα എന്ന കൂട്ടുപ്രയോഗം യഥാർഥമായ കുറവ് പരിഹരിക്കുന്നതോടൊപ്പം ബലപ്പെടുത്തൽ, ക്രമപ്പെടുത്തൽ, പൂർത്തീകരണം എന്നിവയും ഉൾക്കൊള്ളാം. പ്രധാനപാഠം സംക്ഷിപ്തമായി നിലനിർത്തി വിശാലമായ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. ‘നിങ്ങളുടെ മുഖം’ എന്ന മൂലഭാഷയിലെ വ്യക്തമായ ദൃശ്യപ്രയോഗവും വിശ്വാസത്തിലെ കുറവിനെക്കുറിച്ചുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തിയിരിക്കുന്നു.
