- from: നിങ്ങളുടെ മുഖം കാണാനും നിങ്ങളുടെ വിശ്വാസത്തിൽ കുറവുള്ളത് നികത്താനും വേണ്ടി രാവും പകലും അത്യന്തം ആത്മാർഥമായി പ്രാർഥിച്ചുകൊണ്ടിരിക്കുന്നു.[a]
  to: 'ഞങ്ങൾ രാവും പകലും അത്യന്തം ആത്മാർഥമായി പ്രാർഥിക്കുന്നു: നിങ്ങളെ നേരിൽ കാണാനും നിങ്ങളുടെ വിശ്വാസത്തിലെ കുറവുകൾ പരിഹരിക്കാനും.[a]'
