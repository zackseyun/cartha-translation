  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐπέμψαμεν Τιμόθεον, τὸν ἀδελφὸν ἡμῶν καὶ ⸀συνεργὸν τοῦ ⸀θεοῦ ἐν τῷ εὐαγγελίῳ τοῦ Χριστοῦ, εἰς τὸ στηρίξαι ὑμᾶς καὶ παρακαλέσαι ⸀ὑπὲρ τῆς πίστεως ὑμῶν
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/002.yaml
  text: and we sent Timothy[a], our brother and God's fellow worker in the gospel of the Messiah, to strengthen you and to encourage you concerning your faith[b],
translation:
  language: ml
  text: ഞങ്ങളുടെ സഹോദരനും മശീഹയുടെ[b] സുവിശേഷത്തിൽ ദൈവത്തിന്റെ സഹപ്രവർത്തകനുമായ[a] തിമൊഥെയൊസിനെ, നിങ്ങളെ ഉറപ്പിക്കാനും നിങ്ങളുടെ വിശ്വാസത്തെക്കുറിച്ച് നിങ്ങളെ പ്രോത്സാഹിപ്പിക്കാനുമായി, ഞങ്ങൾ അയച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദൈവത്തോടൊപ്പം പ്രവർത്തിക്കുന്നവൻ’ എന്നും പരിഭാഷപ്പെടുത്താം. ചില കൈയെഴുത്തുപ്രതികളിലും പരിഭാഷകളിലും ‘ദൈവത്തിന്റെ ശുശ്രൂഷകൻ’ പോലുള്ള വ്യത്യസ്ത പാഠമുണ്ട്.
    reason: alternative_reading
  - marker: b
    text: ഗ്രീക്കിൽ ‘ക്രിസ്തു’; ഇവിടെ പദവിനാമത്തിന്റെ അർഥം മുൻനിൽക്കുന്നതിനാൽ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέμψαμεν
  choice: ഞങ്ങൾ അയച്ചു
  rationale: πέμπω എന്ന ക്രിയയുടെ aorist indicative രൂപം ലളിതമായ ഭൂതകാല ആഖ്യാനമായി സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
- source_word: Τιμόθεον
  choice: തിമൊഥെയൊസിനെ
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ പരിചിതമായ ലിപ്യന്തരണം നിലനിർത്തുന്നു.
- source_word: ἀδελφὸν ἡμῶν
  choice: ഞങ്ങളുടെ സഹോദരൻ
  rationale: വിശ്വാസസമൂഹത്തിനുള്ളിലെ കുടുംബബന്ധത്തിന്റെ രൂപകം വ്യാഖ്യാനാത്മകമായി വികസിപ്പിക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: συνεργὸν τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ സഹപ്രവർത്തകൻ
  rationale: SBLGNT പാഠത്തിലെ ശക്തമായ പ്രയോഗം ദുർബലപ്പെടുത്താതെ, τοῦ θεοῦ എന്ന genitive ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐν τῷ εὐαγγελίῳ τοῦ Χριστοῦ
  choice: മശീഹയുടെ സുവിശേഷവേലയിൽ
  rationale: ἐν സൂചിപ്പിക്കുന്ന പ്രവർത്തനമേഖല വ്യക്തമാക്കാൻ ‘സുവിശേഷവേലയിൽ’ എന്നു നൽകി; τοῦ Χριστοῦ എന്ന genitive ആരെക്കുറിച്ചുള്ളതോ ആരിൽനിന്നുള്ളതോ എന്ന് അനാവശ്യമായി തീർപ്പാക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: Χριστοῦ
  choice: മശീഹ
  rationale: ഇവിടെ Χριστός പദവിനാമസ്വഭാവത്തിൽ വരുന്നതിനാൽ ‘മശീഹ’ എന്ന് പരിഭാഷപ്പെടുത്തി.
- source_word: εἰς τὸ στηρίξαι
  choice: ഉറപ്പിക്കാനായി
  rationale: εἰς + articular infinitive ലക്ഷ്യം സൂചിപ്പിക്കുന്നു; στηρίζω വിശ്വാസത്തിൽ ദൃഢരാക്കുക എന്ന സന്ദർഭാർഥം നൽകുന്നു.
- source_word: παρακαλέσαι
  choice: പ്രോത്സാഹിപ്പിക്കാനായി
  rationale: സമ്മർദത്തിനിടയിലെ ഇടയപരമായ പിന്തുണയുടെ വിശാല അർഥം നൽകുന്നു; ‘ആശ്വസിപ്പിക്കുക’ അല്ലെങ്കിൽ ‘ഉപദേശിക്കുക’ എന്ന ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: ὑπὲρ τῆς πίστεως ὑμῶν
  choice: നിങ്ങളുടെ വിശ്വാസത്തെക്കുറിച്ച്
  rationale: ὑπέρ + genitive ഇവിടെ ‘സംബന്ധിച്ച്’ എന്നും ‘നിമിത്തം’ എന്നും ഗ്രഹിക്കാവുന്നതാണ്; പ്രധാന പാഠത്തിൽ സ്വാഭാവികമായ ബന്ധാർഥം നൽകി, മറ്റുസാധ്യത കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: πίστεως
  choice: വിശ്വാസം
  rationale: ഈ സന്ദർഭത്തിൽ തെസ്സലൊനീക്യരുടെ വിശ്വസിക്കുന്ന പ്രതികരണവും അതിൽ നിലനിൽക്കലുമാണ് മുഖ്യം; ‘വിശ്വസ്തത’ എന്ന ഗുണാർഥം മാത്രം ഉദ്ദേശിക്കുന്നില്ല.
theological_decisions:
- issue: συνεργὸν τοῦ θεοῦ എന്ന പ്രയോഗം
  choice: ദൈവത്തിന്റെ സഹപ്രവർത്തകൻ
  alternative: ദൈവത്തോടൊപ്പം പ്രവർത്തിക്കുന്നവൻ; ദൈവത്തിന്റെ ശുശ്രൂഷകൻ
  rationale: SBLGNTയിലെ συνεργὸν τοῦ θεοῦ എന്ന ശക്തമായ പാഠം ദൈവശാസ്ത്രപരമായ അസൗകര്യം ഒഴിവാക്കാൻ ദുർബലപ്പെടുത്തുന്നില്ല. അതേസമയം കൈയെഴുത്തുപ്രതികളിലെ വ്യത്യസ്ത പാഠങ്ങൾ കുറിപ്പിൽ അറിയിക്കുന്നു.
- issue: εὐαγγελίῳ τοῦ Χριστοῦ എന്നതിലെ Χριστοῦ
  choice: മശീഹയുടെ സുവിശേഷം
  alternative: ക്രിസ്തുവിന്റെ സുവിശേഷം
  rationale: ഇവിടെ Χριστός പദവിയായി പ്രവർത്തിക്കുന്നതിനാൽ ‘മശീഹ’ തിരഞ്ഞെടുക്കുന്നു; പരിചിതമായ ‘ക്രിസ്തു’ രൂപം കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിലെ ലക്ഷ്യക്രമം മലയാളത്തിൽ വ്യക്തതയ്ക്കായി മുൻവശത്താക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാന പാഠത്തിൽ ഉൾപ്പെടുത്തി.
