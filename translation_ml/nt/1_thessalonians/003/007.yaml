id: 1TH.3.7
reference: 1 Thessalonians 3:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διὰ τοῦτο παρεκλήθημεν, ἀδελφοί, ἐφ’ ὑμῖν ἐπὶ πάσῃ τῇ ⸂ἀνάγκῃ καὶ θλίψει⸃ ἡμῶν διὰ τῆς ὑμῶν πίστεως,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/007.yaml
  text: For this reason[a], brothers, concerning you, in all our distress and affliction[b], we were comforted through your faith.
translation:
  language: ml
  text: അതുകൊണ്ട്, സഹോദരന്മാരേ,[a] നിങ്ങളെക്കുറിച്ച്, ഞങ്ങളുടെ സകല ഞെരുക്കത്തിലും കഷ്ടതയിലും, നിങ്ങളുടെ വിശ്വാസത്താൽ[b] ഞങ്ങൾ ആശ്വാസം പ്രാപിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സഹോദരന്മാർ” എന്നത് സഭയെ അഭിസംബോധന ചെയ്യാൻ പൗലൊസ് പതിവായി ഉപയോഗിക്കുന്ന സംബോധനയാണ്; വിശ്വാസിസമൂഹം മുഴുവനും ഇതിൽ ഉൾപ്പെടാം.
    reason: cultural_note
  - marker: b
    text: “നിങ്ങളുടെ വിശ്വസ്തതയാൽ” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദമായ പിസ്റ്റിസ് വിശ്വാസം, ആശ്രയം, വിശ്വസ്തത എന്നിവ സൂചിപ്പിക്കാം; ഇവിടെ തെസ്സലോനിക്യർ വിശ്വാസത്തിൽ ഉറച്ചുനിന്നതും അർഥത്തിൽ ഉൾപ്പെട്ടിരിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യത്തിലെ തിമൊഥെയൊസിന്റെ റിപ്പോർട്ടുമായി ഈ വാക്യത്തെ ബന്ധിപ്പിക്കുന്ന കാരണാത്മക നിഗമനം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: παρεκλήθημεν
  choice: ഞങ്ങൾ ആശ്വാസം പ്രാപിച്ചു
  rationale: കഷ്ടതയുടെ നടുവിൽ ലഭിച്ച സാന്ത്വനവും ധൈര്യവും സൂചിപ്പിക്കുന്ന സന്ദർഭോചിതമായ നിഷ്ക്രിയ അർഥം നൽകുന്നു.
- source_word: ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചന സംബോധന നേരിട്ട് നിലനിർത്തുന്നു; പൗലൊസിന്റെ പ്രയോഗത്തിൽ സഭാസമൂഹം മുഴുവനും ഉൾപ്പെടാമെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐφ’ ὑμῖν
  choice: നിങ്ങളെക്കുറിച്ച്
  rationale: അപ്പോസ്തലന്മാരുടെ ആശ്വാസം തെസ്സലോനിക്യരെ സംബന്ധിച്ചതാണെന്ന് വ്യക്തമാക്കുന്നു; അവരുടെ കഷ്ടതയ്ക്ക് തെസ്സലോനിക്യർ കാരണമായെന്ന തെറ്റായ ധാരണ ഒഴിവാക്കുന്നു.
- source_word: ἐπὶ πάσῃ τῇ ἀνάγκῃ καὶ θλίψει ἡμῶν
  choice: ഞങ്ങളുടെ സകല ഞെരുക്കത്തിലും കഷ്ടതയിലും
  rationale: ആശ്വാസം ലഭിച്ച സാഹചര്യത്തെ സൂചിപ്പിക്കുകയും സമീപാർഥമുള്ള രണ്ടു ദുഃഖപദങ്ങളെയും വേർതിരിച്ച് നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἀνάγκῃ
  choice: ഞെരുക്കം
  rationale: ഇവിടെ വെറും ആവശ്യകതയല്ല, സമ്മർദവും പ്രയാസവും നിറഞ്ഞ അവസ്ഥയെയാണ് പദം സൂചിപ്പിക്കുന്നത്.
- source_word: θλίψει
  choice: കഷ്ടത
  rationale: പീഡനവും ക്ലേശവും ഉൾക്കൊള്ളാവുന്ന ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ പദമാണ്.
- source_word: διὰ τῆς ὑμῶν πίστεως
  choice: നിങ്ങളുടെ വിശ്വാസത്താൽ
  rationale: διά + ജനിറ്റീവ് ഇവിടെ മാർഗമോ കാരണമോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘-ത്താൽ’ ഈ ബന്ധം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: πίστεως
  choice: വിശ്വാസം
  rationale: πίστις എന്നതിന്റെ പ്രധാന അർഥം നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിൽ ‘വിശ്വസ്തത/സ്ഥിരത’ എന്ന ഭാവവും ഉണ്ടാകാമെന്നത് അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: തെസ്സലോനിക്യരുടെ തുടർച്ചയായ ഉറച്ചുനിൽപ്പ് സൂചിപ്പിക്കാവുന്ന സന്ദർഭത്തിൽ πίστις എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: വിശ്വാസം
  alternative: വിശ്വസ്തത; വിശ്വാസത്തിൽ ഉറച്ചുനിൽപ്പ്
  rationale: വാക്യം അവരുടെ ദൈവവിശ്വാസത്തെ നേരിട്ട് സൂചിപ്പിക്കുമ്പോഴും, അത് തുടരുന്ന സ്ഥിരതയും ഉൾക്കൊള്ളാം. പ്രധാന പാഠത്തിൽ ‘വിശ്വാസം’ നിലനിർത്തി ഈ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ നൽകുന്നത് യഥാർഥമായ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്ക് വാക്യക്രമത്തിന്റെ പ്രധാന ബന്ധങ്ങൾ സംരക്ഷിച്ചുകൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ വിരാമചിഹ്നങ്ങളും പദക്രമവും ഉപയോഗിച്ചു; ദുഃഖത്തെ സൂചിപ്പിക്കുന്ന രണ്ടു മൂലപദങ്ങളും വേർതിരിച്ചു നിലനിർത്തി.
