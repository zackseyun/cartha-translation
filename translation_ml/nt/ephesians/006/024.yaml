revisions:
- from: നമ്മുടെ കർത്താവായ യേശു മശീഹയെ അക്ഷയതയിൽ സ്നേഹിക്കുന്ന എല്ലാവരോടും കൃപ ഉണ്ടായിരിക്കട്ടെ.[a]
  to: നമ്മുടെ കർത്താവായ യേശു മശീഹയെ അക്ഷയതയോടെ സ്നേഹിക്കുന്ന എല്ലാവരോടും കൃപ ഉണ്ടായിരിക്കട്ടെ.[a]
  rationale: ‘അക്ഷയതയിൽ’ എന്ന അത്യന്തം അക്ഷരാർഥപരമായ locative രൂപം ‘അക്ഷയതയോടെ’ എന്ന സ്വാഭാവിക മലയാളരൂപത്തിലേക്ക് മാറ്റി. ഇതിലൂടെ സ്നേഹത്തിന്റെ ക്ഷയിക്കാത്ത ഗുണം സൂചിപ്പിക്കുന്ന വായന ലഭിക്കുന്നുവെങ്കിലും, ‘അക്ഷയമായ സ്നേഹത്തോടെ’ എന്ന വിശദീകരണത്തെ മുഖ്യവാക്യത്തിൽ നിർബന്ധിക്കുന്നില്ല; വാക്യത്തിന്റെ സംക്ഷിപ്തതയും വിവാദ്യമായ വ്യാപ്തിയും അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു. അടിക്കുറിപ്പിൽ ഗ്രീക്ക് പ്രയോഗവും കൃത്യമായി ചേർത്തു.
