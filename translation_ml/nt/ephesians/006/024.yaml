id: EPH.6.24
reference: Ephesians 6:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἡ χάρις μετὰ πάντων τῶν ἀγαπώντων τὸν κύριον ἡμῶν Ἰησοῦν Χριστὸν ἐν ⸀ἀφθαρσίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/024.yaml
  text: Grace be with all who love our Lord Jesus the Messiah with incorruptibility[a].
translation:
  language: ml
  text: നമ്മുടെ കർത്താവായ യേശു മശീഹയെ അക്ഷയതയോടെ സ്നേഹിക്കുന്ന എല്ലാവരോടും കൃപ ഉണ്ടായിരിക്കട്ടെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, ‘അക്ഷയമായ സ്നേഹത്തോടെ’; മറ്റു സാധ്യതകൾ: ‘ആത്മാർഥതയോടെ’, ‘ഒരിക്കലും മങ്ങാത്ത സ്നേഹത്തോടെ.’ ‘ἐν ἀφθαρσίᾳ’ എന്ന ഗ്രീക്ക് പ്രയോഗം സംക്ഷിപ്തവും ഒന്നിലധികം അർത്ഥസാധ്യതകളുള്ളതുമാണ്.'
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: കൃപ
  rationale: പൗലോസിന്റെ ലേഖനാന്ത്യ ആശീർവാദശൈലിക്ക് യോജിക്കുന്ന പതിവും അർത്ഥസമ്പന്നവുമായ മലയാളപദം.
- source_word: μετὰ πάντων
  choice: എല്ലാവരോടും ... ഉണ്ടായിരിക്കട്ടെ
  rationale: ഗ്രീക്കിൽ ക്രിയ ഇല്ലെങ്കിലും, ആശീർവാദവാക്യം സ്വാഭാവികമാക്കാൻ മലയാളത്തിൽ ‘ഉണ്ടായിരിക്കട്ടെ’ ചേർത്തു; μετάയുടെ സഹവർത്തിത്വാർഥം ‘-ഓടും’ വഴി നിലനിർത്തി.
- source_word: ἀγαπώντων
  choice: സ്നേഹിക്കുന്ന
  rationale: വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ തുടർച്ചയായ സ്വഭാവം സ്വാഭാവികമായ മലയാള വിശേഷണവാക്യരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: κύριον
  choice: കർത്താവ്
  rationale: ക്രിസ്തുശീർഷകമായി κύριος എന്നതിന്റെ സ്ഥാപിതവും മാന്യവുമായ മലയാള പരിഭാഷ.
- source_word: Ἰησοῦν Χριστόν
  choice: യേശു മശീഹ
  rationale: Χριστός എന്നതിന്റെ ശീർഷകാർഥം ‘മശീഹ’ എന്നു തുറന്നുകാട്ടുന്നു; κύριον ἡμῶν എന്ന ഘടനയോടൊപ്പം ‘നമ്മുടെ കർത്താവായ’ എന്നു സ്വാഭാവികമാക്കി.
- source_word: ἐν ἀφθαρσίᾳ
  choice: അക്ഷയതയിൽ
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സംക്ഷിപ്തതയും യഥാർഥമായ അർത്ഥവ്യക്തതക്കുറവും മുഖ്യവാക്യത്തിൽ നിലനിർത്തുന്ന ഔപചാരികമായി സുതാര്യമായ പരിഭാഷ.
theological_decisions:
- issue: ἐν ἀφθαρσίᾳ എന്ന പ്രയോഗത്തിന്റെ വ്യാഖ്യാനം
  choice: മുഖ്യവാക്യത്തിൽ ‘അക്ഷയതയിൽ’ എന്ന സംക്ഷിപ്തവും അവ്യക്തത നിലനിർത്തുന്നതുമായ രൂപം
  alternative: ‘അക്ഷയമായ സ്നേഹത്തോടെ’; ‘ആത്മാർഥതയോടെ’; ‘ഒരിക്കലും മങ്ങാത്ത സ്നേഹത്തോടെ’
  rationale: ἀφθαρσία വിശ്വാസികളുടെ സ്നേഹത്തിന്റെ ഗുണമാണോ, ആശീർവാദത്തിന്റെ മേഖലയോ രീതിയോ ആണോ, അതോ ആത്മാർഥതയെ സൂചിപ്പിക്കുന്നതാണോ എന്നു ഗ്രീക്ക് നിർവിവാദമായി വ്യക്തമാക്കുന്നില്ല. അതിനാൽ ഒരു വ്യാഖ്യാനം മാത്രം മുഖ്യവാക്യത്തിൽ ഉറപ്പിക്കാതെ സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, ലേഖനാന്ത്യ ആശീർവാദത്തിന്റെ ഗൗരവം നിലനിർത്തിക്കൊണ്ടും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന രീതിയിലും രൂപപ്പെടുത്തി. ‘അക്ഷയതയിൽ’ അപൂർവമെങ്കിലും മനസ്സിലാക്കാവുന്ന നാമരൂപമാണ്; മൂലത്തിലെ ഉദ്ദേശ്യപൂർവമായ അവ്യക്തത സംരക്ഷിക്കാൻ അത് നിലനിർത്തി.
