id: EPH.6.23
reference: Ephesians 6:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εἰρήνη τοῖς ἀδελφοῖς καὶ ἀγάπη μετὰ πίστεως ἀπὸ θεοῦ πατρὸς καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/023.yaml
  text: Peace to the brothers[a], and love with faith[c][b], from God the Father and the Lord Jesus the Messiah.
translation:
  language: ml
  text: സഹോദരന്മാർക്ക്[a] സമാധാനവും വിശ്വാസത്തോടുകൂടിയ സ്നേഹവും[b] പിതാവായ ദൈവത്തിൽനിന്നും കർത്താവായ യേശു മശീഹയിൽനിന്നും[c] ഉണ്ടാകട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സഹോദരീസഹോദരന്മാർക്ക്.’ ഗ്രീക്കിൽ പുല്ലിംഗ ബഹുവചനമായ ‘സഹോദരന്മാർ’ എന്നാണ്; എന്നാൽ അത് വിശ്വാസസമൂഹം മുഴുവനെയും അഭിസംബോധന ചെയ്യാം.
    reason: alternative_reading
  - marker: b
    text: ‘വിശ്വാസം’ എന്നതിനുള്ള ഗ്രീക്ക് പദത്തിന് ‘വിശ്വസ്തത’ അല്ലെങ്കിൽ ‘ആശ്രയം’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: c
    text: ഗ്രീക്കിൽ ‘യേശു ക്രിസ്തു’ എന്നാണ്. Χριστός എന്ന പദവിയുടെ അർഥം നിലനിർത്താൻ ഇവിടെ ‘മശീഹ’ എന്നു വിവർത്തനം ചെയ്തിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: Εἰρήνη
  choice: സമാധാനം ... ഉണ്ടാകട്ടെ
  rationale: ക്രിയയില്ലാത്ത ഗ്രീക്ക് ആശീർവാദവാക്യത്തിന്റെ ആശംസാഭാവം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τοῖς ἀδελφοῖς
  choice: സഹോദരന്മാർക്ക്
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചനരൂപം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ വിശ്വാസസമൂഹം മുഴുവനും ഉൾപ്പെടാവുന്ന അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἀγάπη μετὰ πίστεως
  choice: വിശ്വാസത്തോടുകൂടിയ സ്നേഹം
  rationale: μετάയുടെ സഹവർത്തിത്വാർഥവും πίστις എന്നതിന്റെ സാധാരണ വിവർത്തനമായ ‘വിശ്വാസം’ എന്നതും സംരക്ഷിക്കുന്നു.
- source_word: ἀπὸ θεοῦ πατρὸς
  choice: പിതാവായ ദൈവത്തിൽനിന്നും
  rationale: ‘നമ്മുടെ’ എന്ന പദം ചേർക്കാതെ ഉറവിടം സൂചിപ്പിക്കുന്ന ἀπόയും θεὸς πατήρ എന്ന ബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: κυρίου Ἰησοῦ Χριστοῦ
  choice: കർത്താവായ യേശു മശീഹയിൽനിന്നും
  rationale: κύριος എന്നത് ‘കർത്താവ്’ എന്നും Χριστός എന്ന അഭിഷിക്തപദവി അർഥസമ്പന്നമായി ‘മശീഹ’ എന്നും വിവർത്തനം ചെയ്യുന്നു.
theological_decisions:
- issue: Χριστοῦ എന്ന പദവിയുടെ വിവർത്തനം
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: Χριστός ഇവിടെ യേശുവിന്റെ മശീഹാപദവി വഹിക്കുന്നു; അതിനാൽ ശബ്ദാന്തരീകരണം മാത്രം ചെയ്യാതെ പദവിയുടെ അർഥം നൽകുന്നു.
- issue: ἀδελφοῖς എന്ന അഭിസംബോധനയുടെ വ്യാപ്തി
  choice: സഹോദരന്മാർ
  alternative: സഹോദരീസഹോദരന്മാർ / വിശ്വാസസമൂഹം
  rationale: മൂലത്തിലെ പുല്ലിംഗ ബഹുവചനരൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തുമ്പോഴും പൗലോസിന്റെ പ്രയോഗത്തിൽ സഭ മുഴുവനും ഉദ്ദേശിക്കപ്പെടാമെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: πίστις എന്നതിന്റെ അർഥം
  choice: വിശ്വാസം
  alternative: വിശ്വസ്തത / ആശ്രയം
  rationale: ഈ ഘടനയിൽ ‘വിശ്വാസം’ സ്വാഭാവികമായ പ്രാഥമിക അർഥമാണ്; മറ്റു സാധ്യമായ അർഥങ്ങൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആശീർവാദശൈലി. ‘നിന്നും ... നിന്നും’ എന്ന സമാന്തരഘടന രണ്ട് ഉറവിടനാമങ്ങളെയും വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു; ‘മശീഹ’ പദവിയായാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
