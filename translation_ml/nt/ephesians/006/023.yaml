  naturalness: ‘സഹോദരന്മാർക്ക് സമാധാനവും വിശ്വാസത്തോടുകൂടിയ സ്നേഹവും’ എന്നത് ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ള അനുഗ്രഹശൈലിയുമാണ്. ‘നിന്ന്’ എന്ന രൂപം ഇവിടെ അല്പം കൂടുതൽ ലളിതമാണ്.
