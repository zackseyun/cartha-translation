  to: സഹോദരന്മാർക്ക്[a] സമാധാനവും വിശ്വാസത്തോടുകൂടിയ സ്നേഹവും[b] പിതാവായ ദൈവത്തിൽനിന്നും കർത്താവായ യേശു മശീഹയിൽനിന്നും[c] ഉണ്ടാകട്ടെ.
