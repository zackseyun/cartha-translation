source:
  edition: SBLGNT
  text: καὶ ὑποδησάμενοι τοὺς πόδας ἐν ἑτοιμασίᾳ τοῦ εὐαγγελίου τῆς εἰρήνης,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/015.yaml
  text: and having shod your feet with the readiness of the gospel of peace,[a]
translation:
  language: ml
  text: സമാധാനത്തിന്റെ സുവിശേഷത്തിന്റെ ഒരുക്കം നിങ്ങളുടെ കാലുകളിൽ ചെരിപ്പായി ധരിച്ചും,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποδησάμενοι
  choice: ചെരിപ്പണിയിച്ചും
  rationale: കാലുകളിൽ പാദരക്ഷ ധരിക്കുക എന്ന മൂലക്രിയയുടെ ദൃശ്യരൂപവും, ചുറ്റുമുള്ള ആജ്ഞയോട് ചേർന്നുനിൽക്കുന്ന പങ്കാളിക്രിയയുടെ സ്വഭാവവും നിലനിർത്തുന്നു.
- source_word: τοὺς πόδας
  choice: നിങ്ങളുടെ കാലുകൾ
  rationale: നേരിട്ടുള്ള കർമം ‘കാലുകൾ’ തന്നെയാണ്; ശരീരസംബന്ധമായ ആയുധസജ്ജീകരണരൂപകം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἐν
  choice: കൊണ്ട്
  rationale: ഇവിടെ ἐν സജ്ജീകരണമോ ഉപാധിയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘കൊണ്ട്’ സ്വാഭാവികമായി ആ ബന്ധം അറിയിക്കുന്നു.
- source_word: ἑτοιμασίᾳ
  choice: സന്നദ്ധത
  rationale: ‘ഒരുക്കം/സന്നദ്ധത’ എന്ന അടിസ്ഥാന അർഥം നൽകുന്നു; സുവിശേഷം അറിയിക്കാനുള്ള സന്നദ്ധതയാണോ സുവിശേഷം നൽകുന്ന ഉറച്ച നിലയാണോ എന്ന് മുഖ്യവാചകത്തിൽ തീർപ്പാക്കുന്നില്ല.
- source_word: εὐαγγελίου
  choice: സുവിശേഷം
  rationale: പൗലോസിന്റെ രചനകളിൽ സ്ഥിരമായി ഉപയോഗിക്കുന്ന, ആധുനിക മലയാള ക്രൈസ്തവഭാഷയിൽ വ്യാപകമായി മനസ്സിലാകുന്ന പദമാണ്.
- source_word: εἰρήνης
  choice: സമാധാനം
  rationale: εἰρήνηയുടെ സാധാരണ തത്തുല്യം; ഇവിടെ ‘സുവിശേഷത്തെ’ വിശേഷിപ്പിക്കുന്ന ജനിറ്റീവ് ബന്ധം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἐν ἑτοιμασίᾳ τοῦ εὐαγγελίου τῆς εἰρήνης എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: സമാധാനത്തിന്റെ സുവിശേഷത്തിൽനിന്നുള്ള സന്നദ്ധതകൊണ്ട് കാലുകൾ സജ്ജമാക്കുക
  alternative: സമാധാനത്തിന്റെ സുവിശേഷം അറിയിക്കാനുള്ള സന്നദ്ധതകൊണ്ട് കാലുകൾ സജ്ജമാക്കുക; അല്ലെങ്കിൽ സമാധാനത്തിന്റെ സുവിശേഷം നൽകുന്ന ഉറച്ച നില കാലുകൾക്ക് ചെരിപ്പാക്കുക
  rationale: ഗ്രീക്ക് പ്രയോഗം സംക്ഷിപ്തവും ഒന്നിലധികം വ്യാഖ്യാനങ്ങൾക്ക് ഇടവരുത്തുന്നതുമാണ്. ‘യിൽനിന്നുള്ള’ എന്ന പ്രയോഗം സുവിശേഷവുമായി സന്നദ്ധതയ്ക്കുള്ള ബന്ധം വ്യക്തമാക്കുമ്പോഴും, അത് പ്രഘോഷണസന്നദ്ധതയോ ഉറച്ച നിലയോ എന്ന് മുഖ്യവാചകത്തിൽ അന്തിമമായി നിർണ്ണയിക്കുന്നില്ല; സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. യുദ്ധസജ്ജീകരണത്തിലെ പാദരക്ഷാരൂപകം നിലനിർത്തിയിരിക്കുന്നു. മുൻവാക്യത്തിലെ ‘നിൽക്കുക’ എന്ന ആജ്ഞയോടുള്ള വ്യാകരണബന്ധം വ്യക്തമാക്കാൻ അത് വാചകത്തിൽ ഉൾപ്പെടുത്തി.
