id: EPH.6.4
reference: Ephesians 6:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ οἱ πατέρες, μὴ παροργίζετε τὰ τέκνα ὑμῶν, ἀλλὰ ἐκτρέφετε αὐτὰ ἐν παιδείᾳ καὶ νουθεσίᾳ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/004.yaml
  text: And fathers[a], do not provoke your children to anger[c][b], but bring them up in the discipline and instruction of the Lord.
translation:
  language: ml
  text: പിതാക്കന്മാരേ, നിങ്ങളുടെ മക്കളെ കോപിപ്പിക്കരുത്[a]; പകരം, കർത്താവിന്റെ[c] ശിക്ഷണത്തിലും ഉപദേശത്തിലും[b] അവരെ വളർത്തുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങളുടെ മക്കളെ നീരസപ്പെടുത്തരുത്.” ഗ്രീക്ക് ക്രിയയ്ക്ക് കോപമോ നീരസമോ ഉളവാക്കുക എന്ന അർഥമുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “കർത്താവിന്റെ പരിശീലനത്തിലും പ്രബോധനത്തിലും.” ‘ശിക്ഷണം’ രൂപപ്പെടുത്തുന്ന പരിശീലനവും ആവശ്യമായ തിരുത്തലും ഉൾക്കൊള്ളുന്നു; ‘ഉപദേശം’ വാക്കുകളിലൂടെയുള്ള മാർഗനിർദേശത്തെയും തിരുത്തലിനെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: “കർത്താവിന്റെ” എന്നത് ശിക്ഷണവും ഉപദേശവും കർത്താവിൽനിന്നു വരുന്നതോ, കർത്താവിന്റേതോ, അല്ലെങ്കിൽ കർത്താവിനാൽ നയിക്കപ്പെടുന്നതോ ആണെന്ന് സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: πατέρες
  choice: പിതാക്കന്മാരേ
  rationale: ഗ്രീക്ക് പദം വ്യക്തമായി പുല്ലിംഗ ബഹുവചനമായ ‘പിതാക്കന്മാർ’ എന്നാണ്; സന്ദർഭത്തിലെ നേരിട്ടുള്ള അഭിസംബോധന പൊതുവായി ‘മാതാപിതാക്കൾ’ എന്നു വിപുലീകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: παροργίζετε
  choice: കോപത്തിലേക്കു പ്രകോപിപ്പിക്കരുത്
  rationale: കോപമോ നീരസമോ ഉളവാക്കുക എന്ന കാരണാത്മക അർഥം വ്യക്തമായി പ്രകടിപ്പിക്കുകയും മൂലപദത്തിലെ കോപസൂചന നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: τέκνα
  choice: മക്കളെ
  rationale: കുടുംബസന്ദർഭത്തിൽ ആൺമക്കളെയും പെൺമക്കളെയും ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളപദമാണ്.
- source_word: ἐκτρέφετε
  choice: വളർത്തുക
  rationale: അക്ഷരാർഥത്തിൽ പോഷിപ്പിക്കുക എന്ന ആശയം ഉണ്ടായാലും, ഇവിടെ കുട്ടികളെ പരിപാലിച്ചു വളർത്തുക എന്ന സന്ദർഭോചിത അർഥമാണ്.
- source_word: παιδείᾳ
  choice: ശിക്ഷണത്തിൽ
  rationale: രൂപപ്പെടുത്തുന്ന പരിശീലനവും തിരുത്തലും ഉൾക്കൊള്ളുന്ന പദം; ‘ശിക്ഷ’ എന്ന പരിമിതമായ ശിക്ഷാനടപടി എന്ന ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: νουθεσίᾳ
  choice: ഉപദേശത്തിൽ
  rationale: വാക്കുകളിലൂടെയുള്ള മാർഗനിർദേശം, മുന്നറിയിപ്പ്, തിരുത്തൽ എന്നിവ ഉൾക്കൊള്ളുന്ന, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പദമാണ്.
- source_word: κυρίου
  choice: കർത്താവിന്റെ
  rationale: ഉറവിടം, ഉടമസ്ഥത, സ്വഭാവം, ദിശാബോധം എന്നിവയിൽ ഏതാണ് ഉദ്ദേശിച്ചതെന്ന് ചുരുക്കി നിശ്ചയിക്കാതെ ഗ്രീക്ക് ഷഷ്ഠിവിഭക്തിയുടെ വിശാലത സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: πατέρες എന്ന അഭിസംബോധനയുടെ വ്യാപ്തി
  choice: ‘മാതാപിതാക്കളേ’ എന്നു പൊതുവാക്കാതെ ‘പിതാക്കന്മാരേ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: മാതാപിതാക്കളേ
  rationale: മൂലപാഠം പിതാക്കന്മാരെയാണ് വ്യക്തമായി അഭിസംബോധന ചെയ്യുന്നത്; പ്രയോഗം കൂടുതൽ വ്യാപകമാകാമെങ്കിലും പരിഭാഷ മൂലത്തിന്റെ പരിധി വിപുലീകരിക്കരുത്.
- issue: ἐν παιδείᾳ καὶ νουθεσίᾳ κυρίου എന്നതിലെ κυρίου-യുടെ ബന്ധം
  choice: ‘കർത്താവിന്റെ’ എന്ന വിശാലമായ ഷഷ്ഠിവിഭക്തിരൂപം നിലനിർത്തി.
  alternative: കർത്താവിൽനിന്നുള്ള / കർത്താവിനെക്കുറിച്ചുള്ള / കർത്താവനുസരിച്ചുള്ള
  rationale: ശിക്ഷണവും ഉപദേശവും കർത്താവിൽനിന്നു വരുന്നതോ, കർത്താവിനുള്ളതോ, കർത്താവിനാൽ നയിക്കപ്പെടുന്നതോ എന്ന വിവിധ സാധ്യതകൾ ഗ്രീക്ക് അനുവദിക്കുന്നു; മുഖ്യപാഠത്തിൽ ഒറ്റ അർഥം നിർബന്ധിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവമുള്ള ശൈലി. കുടുംബസന്ദർഭത്തിന് സ്വാഭാവികമായ ‘മക്കൾ’, ‘വളർത്തുക’ എന്നീ പദങ്ങൾ ഉപയോഗിച്ചു; ഗ്രീക്കിലെ നേരിട്ടുള്ള അഭിസംബോധനയും കർത്താവിനെ സംബന്ധിച്ച ഷഷ്ഠിവിഭക്തിയുടെ അർഥവ്യാപ്തിയും സംരക്ഷിച്ചു.
