source:
  edition: SBLGNT
  text: ἵνα εὖ σοι γένηται καὶ ἔσῃ μακροχρόνιος ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/003.yaml
  text: so that it may go well with you and you may live long on the earth[a].
translation:
  language: ml
  text: നിനക്കു നന്മ വരാനും നീ ഭൂമിയിൽ[a] ദീർഘകാലം ജീവിക്കാനും വേണ്ടിയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ദേശത്ത്’; പുറപ്പാട് 20:12-ലും ആവർത്തനം 5:16-ലും കാണുന്ന അഞ്ചാം കല്പനയുടെ വാക്കുകൾ ഇവിടെ പ്രതിധ്വനിക്കുന്നുണ്ടാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: വേണ്ടിയാണ്
  rationale: മുൻവാക്യത്തിലെ കല്പനയോടു ചേർന്ന വാഗ്ദാനത്തിന്റെ ഉദ്ദേശ്യ/ഫലബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: εὖ σοι γένηται
  choice: നിനക്കു നന്മ വരാനും
  rationale: ‘കാര്യങ്ങൾ നിനക്കു നന്നായി ഭവിക്കുക’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: καὶ
  choice: -ഉം
  rationale: വാഗ്ദാനം ചെയ്യുന്ന രണ്ടു ഫലങ്ങളെയും സമനിലയിൽ ബന്ധിപ്പിക്കുന്നു.
- source_word: ἔσῃ μακροχρόνιος
  choice: നീ ദീർഘകാലം ജീവിക്കാനും
  rationale: അക്ഷരാർഥത്തിൽ ‘നീ ദീർഘായുസ്സുള്ളവനായിരിക്കും’ എന്ന ആശയം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: ἐπὶ τῆς γῆς
  choice: ഭൂമിയിൽ
  rationale: ഗ്രീക്കിലെ വിശാലമായ പ്രയോഗം അതേപടി നിലനിർത്തുന്നു; പത്തുകല്പനയുടെ പശ്ചാത്തലത്തിൽ ‘ദേശത്ത്’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: അഞ്ചാം കല്പനയിലെ വാഗ്ദാനവുമായി ബന്ധപ്പെട്ട് ἐπὶ τῆς γῆς എന്നതിന്റെ വ്യാപ്തി
  choice: ഭൂമിയിൽ
  alternative: ദേശത്ത്
  rationale: ഇവിടത്തെ ഗ്രീക്ക് വാചകം ഒരു പ്രത്യേക ഉടമ്പടിദേശത്തെ വ്യക്തമാക്കുന്നില്ല. അതിനാൽ വിശാലമായ അർഥം മുഖ്യവാചകത്തിൽ നിലനിർത്തുകയും, പുറപ്പാട് 20:12; ആവർത്തനം 5:16 എന്നിവയുടെ പ്രതിധ്വനിയാകാവുന്ന മറ്റൊരു വിവർത്തനം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. മുൻവാക്യത്തിൽ ആരംഭിച്ച ഉദ്ധരണിയുടെ തുടർച്ചയായതിനാൽ ലക്ഷ്യ/ഫലബന്ധം അവസാനത്തിലെ ‘വേണ്ടിയാണ്’ എന്ന രൂപത്തിൽ ചേർത്തിരിക്കുന്നു.
