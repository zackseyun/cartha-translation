id: EPH.6.10
reference: Ephesians 6:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂Τοῦ λοιποῦ⸃ ἐνδυναμοῦσθε ἐν κυρίῳ καὶ ἐν τῷ κράτει τῆς ἰσχύος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/010.yaml
  text: Finally[a], be strengthened in the Lord and in the strength of his might.
translation:
  language: ml
  text: അവസാനമായി[a], കർത്താവിലും അവിടുത്തെ ശക്തിയുടെ പ്രാബല്യത്തിലും ശക്തി പ്രാപിക്കുവിൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇനിമുതൽ.’ ഗ്രീക്ക് പ്രയോഗത്തിന് ‘ശേഷിക്കുന്ന കാര്യമായി’ എന്ന ഭാവവും ഉണ്ടാകാം; ഇവിടെ അത് സമാപനഭാഗത്തിലേക്കുള്ള മാറ്റമായി മനസ്സിലാക്കിയിരിക്കുന്നു.
    reason: textual_and_lexical_alternative
lexical_decisions:
- source_word: Τοῦ λοιποῦ
  choice: അവസാനമായി
  rationale: ലേഖനത്തിന്റെ സമാപനഭാഗത്തിലേക്കുള്ള മാറ്റം സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ വ്യവഹാരചിഹ്നമായി വിവർത്തനം ചെയ്തു; ‘ഇനിമുതൽ’ എന്ന കാലസൂചന ഇവിടെ നിർബന്ധമല്ല.
- source_word: ἐνδυναμοῦσθε
  choice: ശക്തി പ്രാപിക്കുവിൻ
  rationale: വർത്തമാനകാല ആജ്ഞാരൂപത്തിലെ പാസീവ്/മിഡിൽ ഭാവം നിലനിർത്തി, സ്വന്തം ശക്തി സമാഹരിക്കുക എന്നതിലുപരി ശക്തി ലഭിക്കുക എന്ന ആശയം പ്രകടമാക്കുന്നു.
- source_word: ἐν κυρίῳ
  choice: കർത്താവിൽ
  rationale: ἐν എന്നതിന്റെ ബന്ധപരവും മേഖലാസൂചകവുമായ വ്യാപ്തി സംരക്ഷിക്കുന്നു; ‘കർത്താവിനാൽ’ എന്നു പറഞ്ഞ് കരണാർഥം മാത്രം നിർണ്ണയിക്കുന്നില്ല.
- source_word: κράτει
  choice: പ്രാബല്യം
  rationale: പ്രവർത്തനത്തിൽ പ്രകടമാകുന്ന ശക്തി എന്ന κράτος-ന്റെ ഭാവം നൽകുകയും ἰσχύς-ൽനിന്ന് പദപരമായി വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἰσχύος
  choice: ശക്തി
  rationale: ആന്തരികമായ ബലം/സാമർഥ്യം എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; κράτος-നോടൊപ്പമുള്ള ഗ്രീക്ക് ശക്തിപദങ്ങളുടെ സാന്ദ്രത നിലനിർത്തുന്നു.
- source_word: αὐτοῦ
  choice: അവിടുത്തെ
  rationale: കർത്താവിനെ ആദരസൂചകമായി തിരിച്ചുപറയുന്ന സ്വാഭാവിക മലയാള സർവനാമം; അവലംബം വ്യക്തമാണ്.
theological_decisions:
- issue: ἐνδυναμοῦσθε എന്ന ക്രിയയിലെ voice-വും ശക്തിയുടെ ഉറവിടവും
  choice: വിശ്വാസികൾ ശക്തി സ്വയം ഉൽപാദിപ്പിക്കണമെന്നല്ല, കർത്താവിൽ ശക്തി പ്രാപിക്കണമെന്ന സ്വീകരണാത്മക ആഹ്വാനം.
  alternative: ‘കർത്താവിൽ ശക്തരായിരിക്കുവിൻ’ എന്ന സജീവഭാവമുള്ള സ്വാഭാവിക പ്രയോഗം.
  rationale: പാസീവ്/മിഡിൽ രൂപത്തിന്റെ സൂക്ഷ്മഭാവം ‘ശക്തി പ്രാപിക്കുവിൻ’ കൂടുതൽ വ്യക്തമായി സംരക്ഷിക്കുന്നു; അതേസമയം ശക്തി നൽകുന്ന പ്രക്രിയയെക്കുറിച്ചുള്ള പ്രത്യേക സിദ്ധാന്തം കൂട്ടിച്ചേർക്കുന്നില്ല.
- issue: κύριος എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: കർത്താവ്
  alternative: നാഥൻ / യജമാനൻ
  rationale: പൗലോസിന്റെ ഈ സന്ദർഭത്തിൽ ഉയിർത്തെഴുന്നേറ്റ യേശുവിനെ സൂചിപ്പിക്കുന്ന പതിവും ഗൗരവമുള്ളതുമായ മലയാള ബൈബിൾപദമാണ് ‘കർത്താവ്’; അധിക വ്യാഖ്യാനം ആവശ്യമില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വായനാസൗകര്യവും ഒരുമിപ്പിച്ചു. ആജ്ഞാരൂപത്തിന് ‘-വിൻ’ ഉപയോഗിച്ചത് ബഹുവചന അഭിസംബോധനയും തിരുവെഴുത്തിന് യോജിച്ച dignified register-വും നിലനിർത്താനാണ്. ‘ശക്തിയുടെ പ്രാബല്യം’ ഗ്രീക്കിലെ കൂട്ടിയിട്ടിരിക്കുന്ന രണ്ട് ശക്തിപദങ്ങളുടെ വ്യത്യാസവും ഊന്നലും കഴിയുന്നത്ര സംരക്ഷിക്കുന്നു.
