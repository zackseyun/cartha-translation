id: EPH.6.14
reference: Ephesians 6:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: στῆτε οὖν περιζωσάμενοι τὴν ὀσφὺν ὑμῶν ἐν ἀληθείᾳ, καὶ ἐνδυσάμενοι τὸν θώρακα τῆς δικαιοσύνης,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/014.yaml
  text: Stand[a], therefore, having fastened your waist with truth and having put on the breastplate of righteousness[b],
translation:
  language: ml
  text: അതുകൊണ്ട്, നിങ്ങളുടെ അര സത്യംകൊണ്ട് കെട്ടിമുറുക്കി[a], നീതിയുടെ[b] നെഞ്ചുകവചം ധരിച്ച് നിൽക്കുക,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “സത്യത്തിൽ നിങ്ങളുടെ അര കെട്ടിമുറുക്കി.”
    reason: ἐν ἀληθείᾳ എന്ന പ്രയോഗം ഉപാധി (‘സത്യംകൊണ്ട്’) എന്നോ മേഖല/അവസ്ഥ (‘സത്യത്തിൽ’) എന്നോ അർത്ഥമാക്കാം.
  - marker: b
    text: അല്ലെങ്കിൽ, “ന്യായത്തിന്റെ.”
    reason: δικαιοσύνη എന്ന ഗ്രീക്കുപദത്തിന് ‘നീതി’ എന്നതോടൊപ്പം ‘ന്യായം/justice’ എന്ന അർത്ഥവശവും ഉണ്ടായേക്കാം.
lexical_decisions:
- source_word: στῆτε
  choice: നിൽക്കുക
  rationale: ബഹുവചനത്തിലുള്ള നിർണായക ആജ്ഞയാണ്. സന്ദർഭം ഉറച്ചുനിൽക്കുന്നതിനെ സൂചിപ്പിക്കുന്നുണ്ടെങ്കിലും, ഈ ക്രിയയിൽ പ്രത്യേകം ക്രിയാവിശേഷണം ഇല്ലാത്തതിനാൽ ലളിതമായ ‘നിൽക്കുക’ തെരഞ്ഞെടുത്തു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുമ്പുള്ള പ്രബോധനത്തിൽനിന്നുള്ള നിഗമനബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: περιζωσάμενοι
  choice: മുറുക്കിക്കെട്ടി
  rationale: അരയ്ക്കുചുറ്റും കെട്ടുക എന്ന പ്രവൃത്തിയെ സ്വാഭാവികമായി അറിയിക്കുന്നു; ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത ‘അരപ്പട്ട’ എന്ന നാമം മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: τὴν ὀσφὺν ὑμῶν
  choice: നിങ്ങളുടെ അര
  rationale: ὀσφύς സൂചിപ്പിക്കുന്ന അര/കടിപ്രദേശത്തിന് സാധാരണ ആധുനിക മലയാളപ്രയോഗം.
- source_word: ἐν ἀληθείᾳ
  choice: സത്യംകൊണ്ട്
  rationale: സത്യം കെട്ടുന്നതിനുള്ള മാർഗമോ ഉപാധിയോ ആണെന്ന സാധ്യത വ്യക്തമാക്കുമ്പോഴും, ‘സത്യത്തിന്റെ അരപ്പട്ട’ എന്ന് രൂപകം വികസിപ്പിച്ചു ചേർക്കുന്നത് ഒഴിവാക്കുന്നു.
- source_word: ἐνδυσάμενοι
  choice: ധരിച്ച്
  rationale: വസ്ത്രമോ പടച്ചട്ടയോ അണിയുക എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: θώρακα
  choice: നെഞ്ചുകവചം
  rationale: ശരീരത്തിന്റെ നെഞ്ചുഭാഗത്തെ സംരക്ഷിക്കുന്ന പടച്ചട്ടയെ വ്യക്തമായി സൂചിപ്പിക്കുകയും സൈനികരൂപകം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: δικαιοσύνης
  choice: നീതി
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിൽ righteousness എന്ന ആശയത്തിന് അനുയോജ്യമായ സ്ഥാപിത മലയാളപദം; അതോടൊപ്പം നൈതികവും ന്യായപരവുമായ അർത്ഥവ്യാപ്തി പൂർണമായി അടച്ചുപൂട്ടുന്നില്ല.
theological_decisions:
- issue: പൗലോസിന്റെ പടച്ചട്ടാരൂപകത്തിൽ δικαιοσύνη എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: നീതി
  alternative: ന്യായം
  rationale: ‘നീതി’ ദൈവസന്നിധിയിലെ ശരിയായ നിലയെയും നീതിയുള്ള ജീവിതത്തെയും ഉൾക്കൊള്ളാൻ കഴിയുന്ന വിശാലമായ മലയാളപദമാണ്. δικαιοσύνη എന്ന പദത്തിനുള്ള പൊതുന്യായത്തിന്റെ അർത്ഥസാധ്യത ‘ന്യായം’ എന്ന പാഠഭേദമായി അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- issue: ἐν ἀληθείᾳ എന്ന പ്രയോഗത്തിന്റെ ബന്ധം
  choice: സത്യംകൊണ്ട് നിങ്ങളുടെ അര മുറുക്കിക്കെട്ടി
  alternative: സത്യത്തിൽ നിങ്ങളുടെ അര മുറുക്കിക്കെട്ടി
  rationale: ἐν എന്ന പൂർവപ്രത്യയം ഇവിടെ ഉപാധിയെയോ മേഖലയെയോ സൂചിപ്പിക്കാം. മുഖ്യവാചകം ഉപാധിസാധ്യത സ്വീകരിക്കുന്നു; മേഖലയെ സൂചിപ്പിക്കുന്ന വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ പ്രധാന ആജ്ഞയെ അവസാനത്തിൽ വെച്ചത് മലയാളവാക്യക്രമത്തിന് സ്വാഭാവികമാണ്; പങ്കാളിക്രിയകൾ ‘മുറുക്കിക്കെട്ടി’, ‘ധരിച്ച്’ എന്നിങ്ങനെ പ്രധാന ആജ്ഞയോടൊപ്പം നടക്കുന്ന സജ്ജീകരണപ്രവൃത്തികളായി അവതരിപ്പിച്ചു. തുടർന്നുള്ള വാക്യവുമായി ബന്ധം നിലനിർത്താൻ അവസാനത്തിൽ കോമ ഉപയോഗിച്ചു.
