id: EPH.6.11
reference: Ephesians 6:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐνδύσασθε τὴν πανοπλίαν τοῦ θεοῦ πρὸς τὸ δύνασθαι ὑμᾶς στῆναι πρὸς τὰς μεθοδείας τοῦ διαβόλου·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/011.yaml
  text: Put on the full armor of God[b][a], so that you may be able to stand against the schemes of the devil.
translation:
  language: ml
  text: പിശാചിന്റെ കുതന്ത്രങ്ങൾക്കെതിരെ[b] ഉറച്ചുനിൽക്കാൻ നിങ്ങൾക്കു കഴിയേണ്ടതിന് ദൈവത്തിന്റെ സമ്പൂർണ പടച്ചട്ട[a] ധരിക്കുവിൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദൈവത്തിന്റെ മുഴുവൻ പടച്ചട്ട.’ ഈ ഗ്രീക്ക് പദം ഒരു സൈനികന്റെ സമ്പൂർണ യുദ്ധസജ്ജീകരണത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘പിശാചിന്റെ വഞ്ചനാപരമായ തന്ത്രങ്ങൾ’ അല്ലെങ്കിൽ ‘കൗശലപൂർവമായ രീതികൾ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδύσασθε
  choice: ധരിക്കുവിൻ
  rationale: രണ്ടാം പുരുഷ ബഹുവചനത്തിലുള്ള ആജ്ഞയുടെ ശക്തി നിലനിർത്തുകയും പടച്ചട്ട അണിയുന്നതിനെ സ്വാഭാവികമായി അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: πανοπλίαν
  choice: സമ്പൂർണ പടച്ചട്ട
  rationale: ഒരു സൈനികന്റെ മുഴുവൻ യുദ്ധസജ്ജീകരണത്തെയും സൂചിപ്പിക്കുന്ന പദത്തിന്റെ സമഗ്രത ‘സമ്പൂർണ’ എന്നതിലൂടെ വ്യക്തമാക്കുന്നു; മുഖ്യവാചകം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ
  rationale: ഈ ഷഷ്ഠീബന്ധം ഉടമസ്ഥതയോ ഉറവിടമോ എന്നതിൽ അനാവശ്യമായി കൃത്യത വരുത്താതെ, ഗ്രീക്കിലെ വിശാലബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: πρὸς τὸ δύνασθαι ὑμᾶς στῆναι
  choice: ഉറച്ചുനിൽക്കാൻ നിങ്ങൾക്കു കഴിയേണ്ടതിന്
  rationale: ആജ്ഞയുടെ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു. സൈനികസന്ദർഭത്തിൽ στῆναι സൂചിപ്പിക്കുന്ന നിലയുറപ്പിന്റെ ഭാവം ‘ഉറച്ചുനിൽക്കുക’ എന്ന സ്വാഭാവിക മലയാളപ്രയോഗത്തിലൂടെ നൽകുന്നു.
- source_word: μεθοδείας
  choice: കുതന്ത്രങ്ങൾ
  rationale: വഞ്ചനയും കൗശലവും നിറഞ്ഞ പദ്ധതികളെയോ രീതികളെയോ സൂചിപ്പിക്കുന്ന പദത്തിന് വ്യക്തവും സമകാലികവുമായ തുല്യപ്രയോഗം.
- source_word: τοῦ διαβόλου
  choice: പിശാചിന്റെ
  rationale: ആത്മീയ പോരാട്ടത്തിന്റെ ഈ സന്ദർഭത്തിൽ διάβολος ഒരു വ്യക്തിപരമായ ദുഷ്ട എതിരാളിയുടെ സ്ഥിരനാമമായി പ്രവർത്തിക്കുന്നു; മലയാളത്തിലെ പൊതുവായ ബൈബിൾപ്രയോഗം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: διάβολος എന്ന പദത്തിന്റെ സൂചിതവ്യക്തിയും പരിഭാഷയും
  choice: പിശാച് എന്ന വ്യക്തിപരമായ ദുഷ്ട എതിരാളി
  alternative: അപവാദി
  rationale: എഫെസ്യർ 6-ലെ ആത്മീയ പോരാട്ടസന്ദർഭം ഒരു സാധാരണ മനുഷ്യ അപവാദിയെക്കാൾ വ്യക്തിപരമായ അമാനുഷിക എതിരാളിയെയാണ് സൂചിപ്പിക്കുന്നത്. വാക്യം പറയുന്നതിൽ കവിഞ്ഞ സിദ്ധാന്തവിശദാംശങ്ങൾ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും ആരാധനാവായനയ്ക്ക് യോജിച്ച മാന്യതയുള്ളതുമായ ശൈലി. ബഹുവചന ആജ്ഞയ്ക്ക് ‘ധരിക്കുവിൻ’ ഉപയോഗിച്ചു. ഗ്രീക്കിലെ ദൈവബന്ധ ഷഷ്ഠിയുടെ അർത്ഥവ്യാപ്തി ‘ദൈവത്തിന്റെ’ എന്നു നിലനിർത്തി; ‘ദൈവം നൽകുന്ന’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കിയിട്ടില്ല.
