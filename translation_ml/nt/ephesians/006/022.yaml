id: EPH.6.22
reference: Ephesians 6:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃν ἔπεμψα πρὸς ὑμᾶς εἰς αὐτὸ τοῦτο ἵνα γνῶτε τὰ περὶ ἡμῶν καὶ παρακαλέσῃ τὰς καρδίας ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/022.yaml
  text: 'I sent him to you for this very purpose: that you may know how we are[a], and that he may encourage your hearts.'
translation:
  language: ml
  text: ഞങ്ങളെ സംബന്ധിച്ച കാര്യങ്ങൾ[a] നിങ്ങൾ അറിയേണ്ടതിനും അവൻ നിങ്ങളുടെ ഹൃദയങ്ങളെ പ്രോത്സാഹിപ്പിക്കേണ്ടതിനുമായി, ഈ ഉദ്ദേശ്യത്തിനായിത്തന്നെ ഞാൻ അവനെ നിങ്ങളുടെ അടുക്കൽ അയച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞങ്ങളുടെ സാഹചര്യങ്ങൾ” അല്ലെങ്കിൽ “ഞങ്ങൾ എങ്ങനെയിരിക്കുന്നുവെന്ന്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: അവനെ
  rationale: മുൻവാക്യത്തിലെ തിഹിക്കൊസിനെയാണ് പുംലിംഗ ഏകവചന ബന്ധസർവനാമം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ മുഖ്യവാക്യത്തിന്റെ സ്വാഭാവിക ഘടനയിൽ ‘അവനെ’ യോജിക്കുന്നു.
- source_word: ἔπεμψα
  choice: ഞാൻ ... അയച്ചത്
  rationale: അഓറിസ്റ്റ് ക്രിയയുടെ സംഭവസൂചന ലളിതമായ ഭൂതകാലത്തിൽ സ്വാഭാവികമായി പകരുന്നു.
- source_word: πρὸς ὑμᾶς
  choice: നിങ്ങളുടെ അടുക്കൽ
  rationale: അയയ്ക്കുക എന്ന ക്രിയയോടൊപ്പം πρός വ്യക്തികളിലേക്കുള്ള ദിശ സൂചിപ്പിക്കുന്നു.
- source_word: εἰς αὐτὸ τοῦτο
  choice: ഈ ഉദ്ദേശ്യത്തോടുതന്നെയാണ്
  rationale: αὐτὸ τοῦτο നൽകുന്ന ഊന്നൽ ‘തന്നെയാണ്’ എന്ന പ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: ἵνα
  choice: '... വേണ്ടതിനും ... വേണ്ടതിനുമായി'
  rationale: രണ്ട് സമാന്തര ലക്ഷ്യങ്ങളെയും മലയാളത്തിൽ വ്യക്തമായ ഉദ്ദേശ്യഘടനയായി ബന്ധിപ്പിക്കുന്നു.
- source_word: γνῶτε τὰ περὶ ἡμῶν
  choice: നമ്മുടെ സ്ഥിതി നിങ്ങൾ അറിയേണ്ടതിന്
  rationale: τὰ περὶ ἡμῶν എന്നത് പൗലോസിനെയും കൂട്ടാളികളെയും സംബന്ധിക്കുന്ന അവസ്ഥയും കാര്യങ്ങളും ഉൾക്കൊള്ളുന്നു; ‘നമ്മുടെ സ്ഥിതി’ സ്വാഭാവികമാണ്, എന്നാൽ സാധ്യതയുള്ള വിപുലാർത്ഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: παρακαλέσῃ
  choice: ധൈര്യപ്പെടുത്തേണ്ടതിന്
  rationale: ഹൃദയങ്ങൾ എന്ന കർമപദത്തോടൊപ്പം ഇവിടെ ആശ്വസിപ്പിക്കുകയും ശക്തിപ്പെടുത്തുകയും ചെയ്യുന്ന അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὰς καρδίας ὑμῶν
  choice: നിങ്ങളുടെ ഹൃദയങ്ങളെ
  rationale: ബൈബിളിലെ മാനവാന്തരത്തിന്റെ രൂപകം മലയാളത്തിലും സ്വാഭാവികവും അർത്ഥവത്തുമായതിനാൽ നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: τὰ περὶ ἡμῶν എന്ന പ്രയോഗത്തിന്റെ വ്യാപ്തി
  choice: മുഖ്യപാഠത്തിൽ ‘നമ്മുടെ സ്ഥിതി’
  alternative: ‘ഞങ്ങളെ സംബന്ധിച്ച കാര്യങ്ങൾ’ അല്ലെങ്കിൽ ‘ഞങ്ങൾ എങ്ങനെയിരിക്കുന്നു’
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിന് വ്യക്തിപരമായ സുഖസ്ഥിതിയും ചുറ്റുപാടുകളും ഉൾക്കൊള്ളാനാകും. മുഖ്യപാഠം സ്വാഭാവികമാക്കിക്കൊണ്ട് അതിന്റെ യഥാർഥ വ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: παρακαλέω എന്ന ക്രിയയുടെ അർത്ഥനിറം
  choice: ‘ധൈര്യപ്പെടുത്തുക’
  alternative: ‘ആശ്വസിപ്പിക്കുക’ അല്ലെങ്കിൽ ‘പ്രോത്സാഹിപ്പിക്കുക’
  rationale: ഈ പശ്ചാത്തലത്തിൽ വിശ്വാസികളുടെ ഹൃദയങ്ങളെ ശക്തിപ്പെടുത്തുക എന്ന ഇടയപരമായ ആശയം മുൻനിൽക്കുന്നു; ഒരു പ്രത്യേക ഉപദേശപരമായ അർത്ഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിലെ രണ്ട് ലക്ഷ്യങ്ങളും സമാന്തരമായി സൂക്ഷിച്ചിരിക്കുന്നു; ‘ഹൃദയങ്ങൾ’ എന്ന ബൈബിൾ രൂപകം നിലനിർത്തിയിരിക്കുന്നു.
