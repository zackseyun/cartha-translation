id: EPH.6.7
reference: Ephesians 6:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μετ’ εὐνοίας δουλεύοντες, ὡς τῷ κυρίῳ καὶ οὐκ ἀνθρώποις,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/007.yaml
  text: serving with goodwill[a], as to the Lord and not to men,
translation:
  language: ml
  text: സന്മനസ്സോടെ സേവിക്കുവിൻ; മനുഷ്യരോടല്ല, കർത്താവിനോടെന്നപോലെ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετ’ εὐνοίας
  choice: സന്മനസ്സോടെ
  rationale: μετά + genitive ഇവിടെ സേവനത്തോടൊപ്പമുള്ള മനോഭാവത്തെയോ രീതിയെയോ സൂചിപ്പിക്കുന്നു. εὔνοια എന്നത് നല്ല മനസ്സ്, സന്നദ്ധമായ അനുകൂലഭാവം എന്നിവ പ്രകടിപ്പിക്കുന്നു; ‘സന്മനസ്സോടെ’ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളമാണ്.
- source_word: δουλεύοντες
  choice: സേവിക്കുവിൻ
  rationale: δουλεύωയ്ക്ക് അടിമയായി സേവിക്കുക എന്ന ശക്തമായ പശ്ചാത്തലാർഥമുണ്ടെങ്കിലും, 6:5-ലെ സന്ദർഭം അവരുടെ അടിമസ്ഥിതി ഇതിനകം വ്യക്തമാക്കുന്നു. ഇവിടെ ഊന്നൽ സേവനം ചെയ്യുന്ന രീതിയിലാണ്. മുൻവാക്യത്തിന്റെ ആജ്ഞാഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി തുടരാൻ കൃതന്തത്തെ ‘സേവിക്കുവിൻ’ എന്നു വിവർത്തനം ചെയ്തു.
- source_word: ὡς
  choice: എന്നപോലെ
  rationale: ὡς സേവനം ആരോടുള്ളതെന്ന നിലയിൽ കാണണമെന്ന താരതമ്യഭാവം നൽകുന്നു. ‘എന്നപോലെ’ അധിക വ്യാഖ്യാനം ചേർക്കാതെ ആ ഭാവം നിലനിർത്തുന്നു.
- source_word: τῷ κυρίῳ
  choice: കർത്താവിന്
  rationale: κύριος ഇവിടെ ഭൂമിയിലെ യജമാനന്മാരിൽനിന്ന് വ്യത്യസ്തനായ ദിവ്യകർത്താവിനെ സൂചിപ്പിക്കുന്നു. ‘കർത്താവ്’ ക്രിസ്തുസംബന്ധമായ സ്ഥാനപ്പേരും സന്ദർഭത്തിലെ വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: ἀνθρώποις
  choice: മനുഷ്യർക്ക്
  rationale: ἄνθρωποι ഇവിടെ ലിംഗഭേദം ഉദ്ദേശിക്കാതെ മനുഷ്യരെ ദിവ്യകർത്താവിനോട് വിപരീതമായി നിർത്തുന്നു. ‘മനുഷ്യർ’ ആ പൊതുവായ അർഥം ആധുനിക മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
theological_decisions:
- issue: κύριος എന്ന പദം മനുഷ്യരായ യജമാനന്മാരോടുള്ള വിപരീതത്തിൽ എങ്ങനെ വിവർത്തനം ചെയ്യണം
  choice: കർത്താവ്
  alternative: യജമാനൻ
  rationale: ‘കർത്താവ്’ ദിവ്യവും ക്രിസ്തുസംബന്ധവുമായ സ്ഥാനപ്പേര് സംരക്ഷിക്കുകയും സമീപസന്ദർഭത്തിലെ ഭൂമിയിലെ യജമാനന്മാരുമായി ആശയക്കുഴപ്പം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- issue: δουλεύοντες എന്നതിലെ അടിമസേവനത്തിന്റെ ഭാവം എത്ര ശക്തമായി പ്രകടിപ്പിക്കണം
  choice: സേവിക്കുവിൻ
  alternative: അടിമകളായി സേവിക്കുവിൻ
  rationale: അഭിസംബോധന ചെയ്യപ്പെടുന്നവരുടെ അടിമസ്ഥിതി മുൻസന്ദർഭത്തിൽ വ്യക്തമാണ്. അതിനാൽ ഇവിടെ അതു വീണ്ടും ചേർക്കാതെ, സേവനത്തിന്റെ മനോഭാവത്തിലെ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗ്രീക്കിലെ വാക്കുകളുടെ ക്രമം പകർത്താതെ, ‘മനുഷ്യർക്കല്ല, കർത്താവിനെന്നപോലെ’ എന്ന വിരോധം വ്യക്തമായി മുന്നിൽ കൊണ്ടുവന്നു. വാക്യം മുൻസന്ദർഭത്തിലെ ആജ്ഞ തുടരുന്നതിനാൽ മലയാളത്തിൽ ആജ്ഞാരൂപം ഉപയോഗിച്ചു.
