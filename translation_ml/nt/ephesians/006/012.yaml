id: EPH.6.12
reference: Ephesians 6:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι οὐκ ἔστιν ἡμῖν ἡ πάλη πρὸς αἷμα καὶ σάρκα, ἀλλὰ πρὸς τὰς ἀρχάς, πρὸς τὰς ἐξουσίας, πρὸς τοὺς κοσμοκράτορας τοῦ ⸀σκότους τούτου, πρὸς τὰ πνευματικὰ τῆς πονηρίας ἐν τοῖς ἐπουρανίοις.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/012.yaml
  text: For our struggle is not against flesh and blood[a], but against the rulers, against the authorities, against the world-rulers of this darkness[c][b], against the spiritual forces of evil in the heavenly realms.
translation:
  language: ml
  text: കാരണം, നമ്മുടെ പോരാട്ടം മാംസരക്തങ്ങളോടല്ല[a]; ഭരണാധികാരികളോടും അധികാരശക്തികളോടും ഈ അന്ധകാരത്തിന്റെ ലോകാധിപന്മാരോടും[b] സ്വർഗീയമണ്ഡലങ്ങളിലെ[c] ദുഷ്ടതയുടെ ആത്മീയശക്തികളോടുമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നമ്മുടെ മല്ലയുദ്ധം മാംസരക്തങ്ങളോടല്ല.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഇപ്പോഴത്തെ ഈ അന്ധകാരത്തിന്റെ ലോകാധിപന്മാരോട്.’ ‘ഇപ്പോഴത്തെ’ എന്ന ആശയം സന്ദർഭത്തിൽനിന്നുള്ള വ്യാഖ്യാനമാണ്; ഗ്രീക്കിൽ അത് പ്രത്യേകം പറഞ്ഞിട്ടില്ല.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘സ്വർഗീയസ്ഥലങ്ങളിലെ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλη
  choice: പോരാട്ടം
  rationale: മല്ലയുദ്ധമോ അടുത്തുനിന്നുള്ള ഏറ്റുമുട്ടലോ സൂചിപ്പിക്കുന്ന പദമാണ്; ‘പോരാട്ടം’ രൂപകത്തിന്റെ ശക്തി നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ ആധുനിക മലയാളം നൽകുന്നു.
- source_word: πρὸς αἷμα καὶ σάρκα
  choice: മാംസരക്തങ്ങളോട്
  rationale: മനുഷ്യരായ എതിരാളികളെ സൂചിപ്പിക്കുന്ന പ്രയോഗം. ഗ്രീക്കിലെ ‘രക്തവും മാംസവും’ എന്ന ക്രമത്തേക്കാൾ മലയാളത്തിൽ പരിചിതവും സ്വാഭാവികവുമായ ‘മാംസരക്തങ്ങൾ’ ഉപയോഗിച്ചു.
- source_word: ἀρχάς
  choice: ഭരണാധികാരികൾ
  rationale: ഭരിക്കുന്ന പ്രബലശക്തികളെയോ പ്രഥമസ്ഥാനത്തുള്ള ഭരണശക്തികളെയോ സൂചിപ്പിക്കുന്നു; പഴയ ‘പ്രഭുത്വങ്ങൾ’ എന്നതിനെക്കാൾ സാധാരണ വായനക്കാർക്ക് സുതാര്യമാണ്.
- source_word: ἐξουσίας
  choice: അധികാരശക്തികൾ
  rationale: അധികാരമോ അധികാരം പ്രയോഗിക്കുന്ന ശക്തികളെയോ സൂചിപ്പിക്കുന്നു; വ്യക്തികളെന്ന അർഥത്തിൽ മാത്രം ചുരുക്കാതിരിക്കാൻ ഈ രൂപം തെരഞ്ഞെടുത്തു.
- source_word: κοσμοκράτορας
  choice: ലോകാധിപന്മാർ
  rationale: ലോകത്തെ ഭരിക്കുന്നവർ എന്ന സംയുക്തപദത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; ‘പ്രാപഞ്ചിക ശക്തികൾ’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ പരിഭാഷ ഒഴിവാക്കി.
- source_word: τοῦ σκότους τούτου
  choice: ഈ അന്ധകാരത്തിന്റെ
  rationale: ‘ഇപ്പോഴത്തെ’ എന്നത് മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്തതിനാൽ ചേർക്കാതെ, ലോകാധിപന്മാരെ വിശേഷിപ്പിക്കുന്ന ജനിറ്റീവ് ബന്ധം നിലനിർത്തി.
- source_word: τὰ πνευματικὰ τῆς πονηρίας
  choice: ദുഷ്ടതയുടെ ആത്മീയശക്തികൾ
  rationale: നപുംസകലിംഗ ബഹുവചന വിശേഷണം ഇവിടെ ആത്മീയ സത്തകളെയോ ശക്തികളെയോ സൂചിപ്പിക്കുന്നു. ‘ആത്മീയശക്തികൾ’ അർഥം വ്യക്തമാക്കുന്നു, എന്നാൽ ‘സൈന്യങ്ങൾ’ എന്ന അതിവ്യക്തീകരണം ഒഴിവാക്കുന്നു.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: സ്വർഗീയമണ്ഡലങ്ങളിൽ
  rationale: എഫെസ്യരിൽ ആവർത്തിക്കുന്ന സ്വർഗീയ മേഖലയെ സൂചിപ്പിക്കുന്ന പ്രയോഗം; കേവലം ഒരു ഭൗതിക സ്ഥലമായി ചുരുക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: വാക്യത്തിൽ പറയുന്ന എതിരാളികളുടെ സ്വഭാവം
  choice: മനുഷ്യർക്കതീതമായ ആത്മീയ ശക്തികളാണ് മുഖ്യമായി സൂചിപ്പിക്കപ്പെടുന്നത്.
  alternative: മാനുഷിക ഭരണാധികാരികളും സ്ഥാപനങ്ങളും മാത്രം; അല്ലെങ്കിൽ ആത്മീയ ശക്തികളും അവയുടെ ഭൗമിക പ്രകടനങ്ങളും ഒരുമിച്ച്.
  rationale: κοσμοκράτορας, τὰ πνευματικὰ τῆς πονηρίας എന്നീ പദങ്ങളുടെ കൂട്ടിച്ചേർക്കൽ ആത്മീയ എതിരാളികളിലേക്കാണ് നേരിട്ട് വിരൽചൂണ്ടുന്നത്. എങ്കിലും അവയുടെ ഭൗമിക പ്രകടനങ്ങളുടെ സാധ്യത പരിഭാഷ നിഷേധിക്കുന്നില്ല.
- issue: σάρξ എന്ന പദത്തിന്റെ അർഥം
  choice: ‘മാംസരക്തങ്ങൾ’ എന്ന മനുഷ്യരെ സൂചിപ്പിക്കുന്ന പ്രയോഗത്തിനുള്ളിൽ അക്ഷരാർഥം നിലനിർത്തി.
  alternative: ‘പാപസ്വഭാവം’ എന്നു പരിഭാഷപ്പെടുത്തുക.
  rationale: ഇവിടെ σάρξ പൗലോസിന്റെ ‘പാപസ്വഭാവം’ എന്ന സാങ്കേതിക അർഥത്തിലല്ല; ശരീരമുള്ള മനുഷ്യജീവിതത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരപ്രയോഗത്തിന്റെ ഭാഗമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ആവർത്തിക്കുന്ന πρὸς എന്ന ഘടനയ്ക്ക് മലയാളത്തിലെ ‘-ഓടും’ സമാന്തരക്രമം ഉപയോഗിച്ചു. ‘മാംസരക്തങ്ങൾ’ എന്ന പരിചിത പ്രയോഗം നിലനിർത്തി; ആത്മീയ എതിരാളികളെ സൂചിപ്പിക്കുന്ന പദങ്ങളിൽ പാരമ്പര്യപരമായെങ്കിലും അസ്പഷ്ടമായ രൂപങ്ങൾ ഒഴിവാക്കി.
