source:
  edition: SBLGNT
  text: καὶ τὴν περικεφαλαίαν τοῦ σωτηρίου ⸀δέξασθε, καὶ τὴν μάχαιραν τοῦ πνεύματος, ὅ ἐστιν ῥῆμα θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/017.yaml
  text: And receive the helmet of salvation[a], and the sword of the Spirit, which is the word of God[b],
translation:
  language: ml
  text: രക്ഷയുടെ ശിരസ്ത്രവും ആത്മാവിന്റെ വാളും സ്വീകരിക്കുവിൻ[a]—അതായത് ദൈവത്തിന്റെ വചനം[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘രക്ഷയുടെ ശിരസ്ത്രവും ആത്മാവിന്റെ വാളും എടുക്കുവിൻ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ദൈവത്തിന്റെ അരുളപ്പാട്’; ഗ്രീക്ക് rhēma എന്ന പദം പറയപ്പെട്ട വാക്കിനെയോ സന്ദേശത്തെയോ ഊന്നിക്കാട്ടാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: δέξασθε
  choice: സ്വീകരിക്കുക
  rationale: രണ്ടാംപുരുഷ ബഹുവചനത്തിലുള്ള ആജ്ഞയാണ്. നൽകപ്പെടുന്നതിനെ ഏറ്റുവാങ്ങുക എന്ന ഭാവം ‘സ്വീകരിക്കുക’ സ്വാഭാവികമായി നിലനിർത്തുന്നു; ആയുധസജ്ജീകരണത്തിന്റെ പശ്ചാത്തലത്തിൽ ‘എടുക്കുക’ എന്നും അർഥമാകാം.
- source_word: περικεφαλαίαν
  choice: ശിരസ്ത്രം
  rationale: തലയെ സംരക്ഷിക്കുന്ന സൈനികോപകരണത്തിനുള്ള കൃത്യവും മലയാളത്തിൽ പരിചിതവുമായ പദം.
- source_word: τοῦ σωτηρίου
  choice: രക്ഷയുടെ
  rationale: രക്ഷയെയോ വിടുതലെയോ സൂചിപ്പിക്കുന്ന ജനിറ്റീവ് പ്രയോഗം. പൗലോസിന്റെ സന്ദർഭത്തിലും ആയുധരൂപകത്തിലും ‘രക്ഷയുടെ’ എന്നത് അർഥം അമിതമായി നിർണയിക്കാതെ നിലനിർത്തുന്നു.
- source_word: μάχαιραν
  choice: വാൾ
  rationale: μάχαιρα സാധാരണയായി ഒരു വാളിനെയോ ചെറുവാളിനെയോ സൂചിപ്പിക്കുന്നു. പ്രധാനവാചകത്തിൽ അനാവശ്യമായ സാങ്കേതിക കൃത്യത ഒഴിവാക്കി സ്വാഭാവികമായ പൊതുപദം ഉപയോഗിച്ചു.
- source_word: τοῦ πνεύματος
  choice: ആത്മാവിന്റെ
  rationale: ഈ പൗലോസീയ സന്ദർഭത്തിൽ പരിശുദ്ധാത്മാവാണ് ഏറ്റവും സ്വാഭാവികമായ സൂചന. മലയാളത്തിലെ ‘ആത്മാവ്’ സന്ദർഭത്തിലൂടെ ഈ ദൈവിക സൂചന വഹിക്കുന്നു.
- source_word: ὅ ἐστιν
  choice: അത് ... ആണ്
  rationale: പിന്നാലെയുള്ള പദസമുച്ചയം വാളിനെ വിശദീകരിക്കുന്ന തിരിച്ചറിയൽപ്രയോഗമാണെന്ന് വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ῥῆμα θεοῦ
  choice: ദൈവത്തിന്റെ വചനം
  rationale: ῥῆμα പറയപ്പെട്ട വാക്കിനെയോ സന്ദേശത്തെയോ ഊന്നിക്കാട്ടാം. ‘ദൈവത്തിന്റെ വചനം’ സ്വാഭാവികവും പരിചിതവുമാണ്; സംസാരിക്കപ്പെട്ട അരുളപ്പാട് എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
theological_decisions:
- issue: ‘ആത്മാവ്’ എന്നതിന്റെ സൂചന
  choice: പരിശുദ്ധാത്മാവ്
  alternative: മനുഷ്യാത്മാവ് അല്ലെങ്കിൽ പൊതുവായ ആത്മീയത
  rationale: ദൈവത്തിന്റെ സർവായുധവർഗത്തിന്റെ സന്ദർഭവും തുടർന്ന് വരുന്ന ‘ദൈവത്തിന്റെ വചനം’ എന്ന തിരിച്ചറിയലും പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്ന വായനയെ ശക്തമാക്കുന്നു. എന്നാൽ വാൾ ആത്മാവിനാൽ നൽകപ്പെട്ടതാണോ ആത്മാവിനോടു ബന്ധപ്പെട്ടതാണോ എന്ന ജനിറ്റീവിന്റെ ബന്ധം കൂടുതൽ നിർണ്ണയിച്ചിട്ടില്ല.
- issue: വാളും ദൈവവചനവും തമ്മിലുള്ള ബന്ധം
  choice: വാൾ ‘ദൈവത്തിന്റെ വചനം’ ആണെന്ന തിരിച്ചറിയൽ
  alternative: വാൾ ദൈവവചനത്തെ പ്രതിനിധീകരിക്കുന്നു എന്ന ശിഥിലമായ ഉപമ
  rationale: ὅ ἐστιν എന്ന നേരിട്ടുള്ള തിരിച്ചറിയൽപ്രയോഗം നിലനിർത്തി; ഉപമയുടെ തത്ത്വശാസ്ത്രപരമായ പ്രവർത്തനം കൂടുതൽ വിശദീകരിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. ‘ഹെൽമെറ്റ്’ എന്ന വായ്പ്പദത്തിനു പകരം ബൈബിൾ ആയുധരൂപകത്തിന് യോജിച്ച ‘ശിരസ്ത്രം’ ഉപയോഗിച്ചു. ആദ്യ ക്രിയയിലെ ‘സ്വീകരിക്കുക’ എന്ന സൂക്ഷ്മത നിലനിർത്തുകയും രണ്ടാമത്തെ ഘടകത്തിൽ മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി ‘എടുക്കുക’ പൂരിപ്പിക്കുകയും ചെയ്തു; ഗ്രീക്കിൽ രണ്ടിനെയും ഒരേ ആജ്ഞാക്രിയ നിയന്ത്രിക്കുന്നു.
