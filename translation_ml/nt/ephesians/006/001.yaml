source:
  edition: SBLGNT
  text: Τὰ τέκνα, ὑπακούετε τοῖς γονεῦσιν ὑμῶν ἐν κυρίῳ, τοῦτο γάρ ἐστιν δίκαιον·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/001.yaml
  text: Children[a], obey your parents in the Lord, for this is right.
translation:
  language: ml
  text: മക്കളേ, നിങ്ങളുടെ മാതാപിതാക്കളെ കർത്താവിൽ[a] അനുസരിക്കുവിൻ; എന്തെന്നാൽ ഇത് ശരിയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കർത്താവിനുള്ളവരെന്ന നിലയിൽ’ എന്നും ‘കർത്താവുമായി ഐക്യത്തിൽ’ എന്നും മനസ്സിലാക്കാം. ‘കർത്താവിൽ’ എന്ന പ്രയോഗം അനുസരണം നടക്കുന്ന മണ്ഡലത്തെയോ രീതിയെയോ സൂചിപ്പിക്കാം; അത്തരം അനുസരണത്തിന് കർത്താവിനോടുള്ള വിശ്വസ്തത പരിധി നിശ്ചയിക്കുമെന്ന സൂചനയും ഇതിൽ ഉണ്ടായേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκνα
  choice: മക്കളേ
  rationale: സംബോധനാരൂപത്തിലുള്ള ബഹുവചനം കുടുംബത്തിലെ മക്കളെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്നു. ആൺമക്കളെയും പെൺമക്കളെയും ഉൾക്കൊള്ളുന്ന സ്വാഭാവികമായ മലയാളപ്രയോഗമാണിത്.
- source_word: ὑπακούετε
  choice: അനുസരിക്കുവിൻ
  rationale: വർത്തമാനകാല സജീവ ആജ്ഞാരൂപം കേൾക്കുക മാത്രമല്ല, കേട്ട് അനുസരിക്കുന്ന പ്രതികരണമാണ് ആവശ്യപ്പെടുന്നത്. dignified plural imperative matching direct address.
- source_word: γονεῦσιν
  choice: മാതാപിതാക്കളെ
  rationale: ഈ ബഹുവചനനാമം അപ്പനെയും അമ്മയെയും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു; ആധുനിക നിലവാരമലയാളത്തിൽ കൃത്യവും സ്വാഭാവികവുമായ തുല്യപദമാണിത്.
- source_word: ἐν κυρίῳ
  choice: കർത്താവിൽ
  rationale: പൗലോസിന്റെ സാന്ദ്രമായ പ്രയോഗം അതേപടി നിലനിർത്തുന്നു. കർത്താവുമായുള്ള ബന്ധത്തിന്റെ മണ്ഡലത്തിലോ വിധത്തിലോ ഉള്ള അനുസരണത്തെ ഇത് സൂചിപ്പിക്കാം; കർത്താവിനോടുള്ള വിശ്വസ്തതയാണ് അതിന്റെ പരിധിയെന്ന സൂചനയും ഇതിൽ ഉണ്ടായേക്കാം.
- source_word: δίκαιον
  choice: ശരിയായത്
  rationale: ഇവിടെ ധാർമികമായി ഉചിതവും യുക്തവുമായതിനെ വിശേഷണം സൂചിപ്പിക്കുന്നു. ‘നീതിയായത്’ എന്നതിനെക്കാൾ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ നൈതിക അർഥം ‘ശരിയായത്’ നൽകുന്നു.
theological_decisions:
- issue: ‘കർത്താവിൽ’ (ἐν κυρίῳ) എന്ന പ്രയോഗത്തിന്റെ വ്യാപ്തി
  choice: ‘കർത്താവിൽ നിങ്ങളുടെ മാതാപിതാക്കളെ അനുസരിക്കുവിൻ’ എന്ന് ആജ്ഞയോടു ചേർത്ത്, അർഥവ്യാപ്തി തുറന്നുവെച്ചു.
  alternative: ‘കർത്താവിലുള്ള മക്കൾ മാതാപിതാക്കളെ അനുസരിക്കട്ടെ’; അല്ലെങ്കിൽ ‘കർത്താവിൽ ഉചിതമായവിധം മാതാപിതാക്കളെ അനുസരിക്കുവിൻ.’
  rationale: ഗ്രീക്കിൽ ἐν κυρίῳ ഏറ്റവും സ്വാഭാവികമായി ആജ്ഞയോടാണ് ചേരുന്നത്; എന്നാൽ അത് മക്കളുടെ കർത്താവിലുള്ള സ്ഥാനം, അനുസരണത്തിന്റെ മണ്ഡലം/വിധം, അല്ലെങ്കിൽ കർത്താവിനോടുള്ള വിശ്വസ്തത നിർണ്ണയിക്കുന്ന പരിധി—ഇവയിൽ ഏതാണ് പ്രത്യേകം ഉദ്ദേശിക്കുന്നതെന്ന് വാക്യം തീർപ്പാക്കുന്നില്ല. അതിനാൽ സാന്ദ്രമായ പ്രയോഗവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ബൈബിൾ ശൈലി. നേരിട്ടുള്ള അഭിസംബോധനയ്ക്കും ആജ്ഞയ്ക്കും ‘മക്കളേ’ / ‘അനുസരിക്കുവിൻ’ എന്ന ഗൗരവമുള്ള രൂപങ്ങൾ ഉപയോഗിച്ചു; മൂലത്തിലെ പൗലോസീയ ‘കർത്താവിൽ’ എന്ന സാന്ദ്രപ്രയോഗം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തി.
