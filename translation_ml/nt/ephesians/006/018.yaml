id: EPH.6.18
reference: Ephesians 6:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διὰ πάσης προσευχῆς καὶ δεήσεως, προσευχόμενοι ἐν παντὶ καιρῷ ἐν πνεύματι, καὶ εἰς ⸀αὐτὸ ἀγρυπνοῦντες ἐν πάσῃ προσκαρτερήσει καὶ δεήσει περὶ πάντων τῶν ἁγίων,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/018.yaml
  text: with every prayer and petition, praying at all times in the Spirit, and for this very thing staying alert with all perseverance in petition for all the saints,
translation:
  language: ml
  text: എല്ലാത്തരം പ്രാർഥനയോടും അപേക്ഷയോടുംകൂടെ, എല്ലാ സമയത്തും പരിശുദ്ധാത്മാവിൽ[a] പ്രാർഥിച്ചുകൊണ്ടും, ഇതിനായി സകല സ്ഥിരോത്സാഹത്തോടുംകൂടെ ജാഗരൂകരായിരിക്കുകയും എല്ലാ വിശുദ്ധന്മാർക്കുവേണ്ടി[b] അപേക്ഷിക്കുകയും ചെയ്യുവിൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ആത്മാവിൽ’ അഥവാ ‘ആത്മഭാവത്തോടെ’ എന്നും വായിക്കാം. ഗ്രീക്ക് പദപ്രയോഗത്തിന് പൊതുവായ ഈ അർഥം സാധ്യമാണെങ്കിലും, സന്ദർഭത്തിൽ പരിശുദ്ധാത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത് എന്നതാണ് കൂടുതൽ സാധ്യത.
    reason: alternative_reading
  - marker: b
    text: ഇവിടെ ‘വിശുദ്ധന്മാർ’ എന്നത് ദൈവത്തിന്റെ വിശുദ്ധജനമായ എല്ലാ വിശ്വാസികളെയും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ πάσης προσευχῆς καὶ δεήσεως
  choice: എല്ലാത്തരം പ്രാർഥനയോടും അപേക്ഷയോടുംകൂടെ
  rationale: διά + genitive ഇവിടെ മാർഗമോ ഉപാധിയോ സൂചിപ്പിക്കുന്നു. πάσης എന്നതിന്റെ സമഗ്രത ‘എല്ലാത്തരം’ എന്നു സ്വാഭാവികമായി നൽകി; προσευχή എന്ന പൊതുപദവും δέησις എന്ന പ്രത്യേക അപേക്ഷയും വേർതിരിച്ചു.
- source_word: προσευχόμενοι ἐν παντὶ καιρῷ
  choice: എല്ലാ സമയത്തും ... പ്രാർഥിച്ചുകൊള്ളുക
  rationale: വർത്തമാനകാല പങ്കാളിക്രിയ മുൻവാക്യത്തിലെ ആഹ്വാനത്തിന്റെ തുടർച്ചയാണ്. മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ ആജ്ഞാരൂപം ഉപയോഗിച്ച് നിരന്തര പ്രവർത്തനത്തിന്റെ ഭാവം നിലനിർത്തി.
- source_word: ἐν πνεύματι
  choice: ആത്മാവിൽ
  rationale: സമീപസന്ദർഭവും എഫെസ്യരിലെ പൗലോസിന്റെ പ്രയോഗവും പരിഗണിക്കുമ്പോൾ പരിശുദ്ധാത്മാവാണ് ഏറ്റവും സാധ്യതയുള്ള സൂചന. എങ്കിലും ഗ്രീക്കിലെ വ്യാകരണരൂപം മനുഷ്യാത്മാവെന്ന വായനയെ പൂർണമായി ഒഴിവാക്കുന്നില്ല; അതിനാൽ അടിക്കുറിപ്പ് ചേർത്തു.
- source_word: εἰς αὐτὸ ἀγρυπνοῦντες
  choice: ഇതിനായി ... ജാഗരൂകരായിരുന്ന്
  rationale: εἰς αὐτό ലക്ഷ്യമോ ഉദ്ദേശ്യമോ ചൂണ്ടുന്നു; ἀγρυπνέω ഉറക്കമൊഴിഞ്ഞ ജാഗ്രതയും നിരീക്ഷണവും സൂചിപ്പിക്കുന്നു.
- source_word: ἐν πάσῃ προσκαρτερήσει καὶ δεήσει
  choice: പൂർണമായ സ്ഥിരോത്സാഹത്തോടെ ... അപേക്ഷിച്ചുകൊള്ളുക
  rationale: προσκαρτέρησις വിട്ടുകളയാത്ത സ്ഥിരതയെ സൂചിപ്പിക്കുന്നു. മലയാളവാക്യത്തിൽ ജാഗ്രതയോടും അപേക്ഷയോടും ബന്ധിപ്പിക്കാവുന്ന വിധത്തിൽ ‘സ്ഥിരോത്സാഹത്തോടെ’ എന്നു നൽകി; καίയുടെ കൂടുതൽ നേരിട്ടുള്ള സമാന്തര വായന അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: περὶ πάντων τῶν ἁγίων
  choice: വിശുദ്ധന്മാർക്കെല്ലാവർക്കുംവേണ്ടി
  rationale: ἅγιοι പൗലോസിന്റെ പ്രയോഗത്തിൽ ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ട വിശ്വാസസമൂഹത്തെ മുഴുവനായി സൂചിപ്പിക്കുന്നു. സഭാപരമായി പരിചിതമായ ‘വിശുദ്ധന്മാർ’ നിലനിർത്തി, പിന്നീടുണ്ടായ പരിമിത അർഥം ഒഴിവാക്കാൻ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
theological_decisions:
- issue: πνεύματι എന്നതിന്റെ സൂചന
  choice: പരിശുദ്ധാത്മാവ് എന്ന സാധ്യത മുൻനിർത്തി ‘ആത്മാവിൽ’
  alternative: മനുഷ്യന്റെ ആത്മാവിൽ അഥവാ ആത്മഭാവത്തോടെ
  rationale: വാക്യം 17-ലെ ‘ആത്മാവിന്റെ വാൾ’ എന്ന സമീപസന്ദർഭവും എഫെസ്യരിലെ ആത്മാവിനോടു ബന്ധപ്പെട്ട പ്രാർഥനാഭാഷയും പരിശുദ്ധാത്മാവിനെ പിന്തുണയ്ക്കുന്നു. എന്നാൽ ഗ്രീക്കിൽ നിർണായക ഉപപദമില്ലാത്തതിനാൽ യഥാർഥമായ അവ്യക്തത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- issue: ἅγιοι എന്നതിന്റെ വ്യാപ്തി
  choice: ദൈവത്തിന്റെ വിശുദ്ധജനമായ എല്ലാ വിശ്വാസികളും
  alternative: പിന്നീടുള്ള സഭാപ്രയോഗത്തിലെ പ്രത്യേകമായി അംഗീകരിക്കപ്പെട്ട വിശുദ്ധർ മാത്രം
  rationale: പൗലോസിന്റെ കത്തുകളിൽ ഈ ബഹുവചനപദം സാധാരണയായി മുഴുവൻ വിശ്വാസസമൂഹത്തെയും സൂചിപ്പിക്കുന്നു; പരിമിതമായ പിന്നീടുള്ള അർഥം ഇവിടെ യോജിക്കുന്നില്ല.
- issue: ἐν πάσῃ προσκαρτερήσει καὶ δεήσει എന്ന ഘടന
  choice: സ്ഥിരോത്സാഹത്തോടെ അപേക്ഷിക്കുന്ന സംയുക്ത ആശയം
  alternative: ‘സകല സ്ഥിരോത്സാഹത്തോടും അപേക്ഷയോടുംകൂടെ’ എന്ന രണ്ട് സമാന്തര ഘടകങ്ങൾ
  rationale: സന്ദർഭത്തിൽ സ്ഥിരോത്സാഹം ജാഗ്രതയെയും അപേക്ഷയെയും വിശേഷിപ്പിക്കുന്നതായി സ്വാഭാവികമായി ഗ്രഹിക്കാം. καίയുടെ വ്യക്തമായ സാന്നിധ്യം കാരണം നേരിട്ടുള്ള സമാന്തര വായന അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. പ്രാർഥന/അപേക്ഷ എന്ന പദവ്യത്യാസം സംരക്ഷിച്ചു. ‘ആത്മാവിൽ’ എന്ന രൂപം മലയാളത്തിൽ പരിശുദ്ധാത്മാവിനെയും മനുഷ്യാത്മാവിനെയും ഭാഷാതലത്തിൽ തുറന്നുവെക്കുന്നതിനാൽ യഥാർഥ ഗ്രീക്ക് അവ്യക്തതയ്ക്ക് അനുയോജ്യമാണ്; അടിക്കുറിപ്പ് സാധ്യതകൾ വ്യക്തമാക്കുന്നു.
