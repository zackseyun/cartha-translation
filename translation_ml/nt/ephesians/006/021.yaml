id: EPH.6.21
reference: Ephesians 6:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἵνα δὲ ⸂εἰδῆτε καὶ ὑμεῖς⸃ τὰ κατ’ ἐμέ, τί πράσσω, πάντα ⸂γνωρίσει ὑμῖν⸃ Τυχικὸς ὁ ἀγαπητὸς ἀδελφὸς καὶ πιστὸς διάκονος ἐν κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/021.yaml
  text: So that you also may know the things concerning me[a], what I am doing, Tychicus, the beloved brother and faithful minister in the Lord[b], will make everything known to you.
translation:
  language: ml
  text: എന്നെ സംബന്ധിച്ച കാര്യങ്ങളും ഞാൻ എന്തു ചെയ്യുന്നു എന്നതും നിങ്ങളും അറിയേണ്ടതിന്, കർത്താവിൽ പ്രിയ സഹോദരനും വിശ്വസ്ത ശുശ്രൂഷകനുമായ തിഹിക്കൊസ് എല്ലാം നിങ്ങളോട് അറിയിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ശുശ്രൂഷകൻ’ എന്നതിന് ‘ദാസൻ’ എന്നും പരിഭാഷപ്പെടുത്താം; ചില സന്ദർഭങ്ങളിൽ ഗ്രീക്ക് διάκονος ഔദ്യോഗികമായ ‘ഡീക്കൻ’ എന്ന പദവിയെയും സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἵνα δὲ
  choice: അറിയേണ്ടതിന്
  rationale: ἵνα സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; δέയുടെ മൃദുവായ ബന്ധകബലം പ്രത്യേകം പദമാക്കാതെ വാക്യബന്ധത്തിൽ നിലനിർത്തുന്നു.
- source_word: εἰδῆτε καὶ ὑμεῖς
  choice: നിങ്ങളും അറിയേണ്ടതിന്
  rationale: καίയും ഊന്നലുള്ള ὑμεῖςയും നൽകുന്ന ‘നിങ്ങളും’ എന്ന കൂട്ടിച്ചേർക്കൽ കൃത്യമായി സൂക്ഷിക്കുന്നു.
- source_word: τὰ κατ’ ἐμέ
  choice: എന്നെ സംബന്ധിച്ച കാര്യങ്ങൾ
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിന്റെ വിശാലത നിലനിർത്തുന്നു; അതിനെ വെറും ആരോഗ്യസ്ഥിതിയോ സാഹചര്യങ്ങളോ ആയി ചുരുക്കുന്നില്ല.
- source_word: τί πράσσω
  choice: ഞാൻ എന്തു ചെയ്യുന്നു
  rationale: പൗലോസ് ചെയ്യുന്നോ ഏർപ്പെട്ടിരിക്കുന്നോ ആയ കാര്യങ്ങളെ നേരിട്ട്, സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: πάντα γνωρίσει ὑμῖν
  choice: എല്ലാം നിങ്ങളെ അറിയിക്കും
  rationale: γνωρίζωയുടെ ‘അറിയിക്കുക’ എന്ന അർഥം മലയാളത്തിലെ സ്വാഭാവിക വാക്യഘടനയിൽ നൽകുന്നു.
- source_word: Τυχικὸς
  choice: തിഹിക്കൊസ്
  rationale: ഗ്രീക്ക് ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: ὁ ἀγαπητὸς ἀδελφὸς
  choice: പ്രിയ സഹോദരൻ
  rationale: സ്നേഹവും ക്രിസ്തീയ കുടുംബബന്ധവും സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ സൂക്ഷിക്കുന്നു.
- source_word: πιστὸς διάκονος
  choice: വിശ്വസ്ത ശുശ്രൂഷകൻ
  rationale: ഇവിടെ ഔദ്യോഗിക സഭാപദവി നിർബന്ധമായി സൂചിപ്പിക്കാതെ, വിശ്വസ്തമായ സേവന-ശുശ്രൂഷാഭൂമിക പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐν κυρίῳ
  choice: കർത്താവിൽ
  rationale: പൗലോസിന്റെ പതിവായ ബന്ധപരവും പ്രവർത്തനമണ്ഡലപരവുമായ പ്രയോഗം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: തിഹിക്കൊസിനെക്കുറിച്ചുള്ള διάκονος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ശുശ്രൂഷകൻ
  alternative: ദാസൻ; ഡീക്കൻ
  rationale: സന്ദർഭം തിഹിക്കൊസിന്റെ വിശ്വസ്തമായ ശുശ്രൂഷയെ സൂചിപ്പിക്കുന്നു; ഔദ്യോഗിക ‘ഡീക്കൻ’ പദവി ഇവിടെ നിർവിവാദമല്ല. ‘ശുശ്രൂഷകൻ’ പ്രവർത്തനാർഥം നിലനിർത്തുകയും സഭാഭരണരീതി ഇറക്കുമതി ചെയ്യാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: ἀδελφός എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: സഹോദരൻ
  alternative: സഹോദരൻ/സഹോദരി എന്ന ഉൾക്കൊള്ളുന്ന രൂപം
  rationale: ഇവിടെ പരാമർശിക്കപ്പെടുന്നത് തിഹിക്കൊസ് എന്ന പുരുഷ സഹപ്രവർത്തകനായതിനാൽ ‘സഹോദരൻ’ കൃത്യമാണ്.
- issue: κύριος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: കർത്താവ്
  alternative: നാഥൻ; യജമാനൻ
  rationale: ἐν κυρίῳ എന്നത് യേശുവിനെക്കുറിച്ചുള്ള പൗലോസിന്റെ സ്ഥിരപ്രയോഗമായതിനാൽ ‘കർത്താവ്’ ദൈവശാസ്ത്രപരമായ അർഥവും മലയാള ബൈബിൾ ഭാഷയിലെ സ്വാഭാവികതയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിന്റെ ഉദ്ദേശ്യഘടനയും ‘നിങ്ങളും’ എന്ന ഊന്നലും നിലനിർത്തി. τὰ κατ’ ἐμέയുടെ അർഥവ്യാപ്തി ചുരുക്കാതിരിക്കാൻ ‘എന്നെ സംബന്ധിച്ച കാര്യങ്ങൾ’ എന്നു നൽകി. διάκονος സംബന്ധിച്ച യഥാർഥ അർഥസാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
