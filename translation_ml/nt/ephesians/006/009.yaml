id: EPH.6.9
reference: Ephesians 6:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ οἱ κύριοι, τὰ αὐτὰ ποιεῖτε πρὸς αὐτούς, ἀνιέντες τὴν ἀπειλήν, εἰδότες ὅτι καὶ ⸂αὐτῶν καὶ ὑμῶν⸃ ὁ κύριός ἐστιν ἐν οὐρανοῖς, καὶ προσωπολημψία οὐκ ἔστιν παρ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/009.yaml
  text: And masters[a], do the same things toward them, giving up threatening, knowing that both their Master and yours is in heaven[c][b], and there is no partiality with him.
translation:
  language: ml
  text: യജമാനന്മാരേ, അവരുടെയും നിങ്ങളുടെയും കർത്താവ് സ്വർഗത്തിലാണെന്നും[c] അവിടുത്തെ പക്കൽ പക്ഷപാതമില്ലെന്നും അറിഞ്ഞുകൊണ്ട്, നിങ്ങളും അവരോട് അതേവിധം പെരുമാറുക[a]; ഭീഷണിപ്പെടുത്തുന്നത് ഉപേക്ഷിക്കുക[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവരോടും അതേ കാര്യങ്ങൾ ചെയ്യുക.’ ഗ്രീക്ക് മുൻ നിർദേശത്തെ അടുത്തായി പ്രതിധ്വനിപ്പിക്കുകയും പരസ്പര ഉത്തരവാദിത്വത്തിന് ഊന്നൽ നൽകുകയും ചെയ്യുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നിങ്ങളുടെ ഭീഷണികൾ ഉപേക്ഷിക്കുക.’ ഗ്രീക്ക് പദത്തിന് ഭീഷണിപ്പെടുത്തുന്ന പതിവ് നിർത്തുക എന്ന അർഥമുണ്ട്.
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ, ‘സ്വർഗങ്ങളിൽ’; മലയാളത്തിൽ ഈ പ്രയോഗത്തിന്റെ സ്വാഭാവിക രൂപം ‘സ്വർഗത്തിൽ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριοι
  choice: യജമാനന്മാർ
  rationale: മുൻവാക്യത്തിലെ അടിമകൾ/ദാസർ എന്ന സാമൂഹിക പശ്ചാത്തലത്തിൽ മനുഷ്യരായ അധികാരികളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘തൊഴിലുടമകൾ’ എന്നു പറയുന്നത് കാലാനുസൃതമല്ല; ‘യജമാനന്മാർ’ പുരാതന ഗൃഹവ്യവസ്ഥയിലെ ബന്ധം നിലനിർത്തുന്നു.
- source_word: τὰ αὐτὰ ποιεῖτε πρὸς αὐτούς
  choice: നിങ്ങളും അവരോട് അതേ കാര്യങ്ങൾ ചെയ്യുക
  rationale: മുൻ നിർദേശവുമായി ഗ്രീക്കിലുള്ള വ്യക്തമായ പ്രതിധ്വനിയും പരസ്പര ഉത്തരവാദിത്വത്തിന്റെ ഊന്നലും സംരക്ഷിക്കുന്നു. മലയാളത്തിൽ അർഥം വ്യക്തമാക്കാൻ ‘നിങ്ങളും’ ചേർത്തിരിക്കുന്നു.
- source_word: ἀνιέντες τὴν ἀπειλήν
  choice: ഭീഷണിപ്പെടുത്തുന്നത് അവസാനിപ്പിക്കുക
  rationale: ഭീഷണിയുടെ പതിവ് ഉപേക്ഷിക്കുകയോ നിർത്തുകയോ ചെയ്യുക എന്ന പങ്കാളിക്രിയയുടെ പ്രായോഗിക അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: εἰδότες
  choice: അറിഞ്ഞുകൊള്ളുക
  rationale: തുടർന്നുള്ള കല്പനയുടെ അടിസ്ഥാനമായ അറിവിനെ വ്യക്തമാക്കുന്നു; ഗ്രീക്കിലെ പങ്കാളിക്രിയയുടെ കാരണാർഥബന്ധം സന്ദർഭത്തിൽ നിലനിൽക്കുന്നു.
- source_word: καὶ αὐτῶν καὶ ὑμῶν ὁ κύριος
  choice: അവരുടെയും നിങ്ങളുടെയും കർത്താവ്
  rationale: അടിമകൾക്കും ഭൂമിയിലെ യജമാനന്മാർക്കും മീതെയുള്ള ഒരേ ദിവ്യ കർത്താവിനെ സൂചിപ്പിക്കുന്നു. മനുഷ്യ κύριοι-യിൽനിന്ന് ദിവ്യ κύριος-നെ മലയാളത്തിൽ വ്യക്തമായി വേർതിരിക്കുന്നു.
- source_word: ἐν οὐρανοῖς
  choice: സ്വർഗത്തിൽ
  rationale: ഗ്രീക്കിൽ ബഹുവചനമാണെങ്കിലും ഈ പ്രയോഗത്തിന്റെ സ്വാഭാവിക ആധുനിക മലയാള തുല്യം ഏകവചനമായ ‘സ്വർഗത്തിൽ’ ആണ്.
- source_word: προσωπολημψία οὐκ ἔστιν παρ’ αὐτῷ
  choice: അവിടുന്ന് ആരോടും പക്ഷപാതം കാണിക്കുന്നില്ല
  rationale: ദൈവസന്നിധിയിലും സ്വഭാവത്തിലും പക്ഷപാതമില്ലെന്ന ആശയം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു; പഴഞ്ചൻ ‘മുഖപക്ഷം’ ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: ഒരേ വാക്യത്തിൽ മനുഷ്യരെയും ദൈവത്തെയും കുറിച്ച് κύριος ഉപയോഗിക്കുന്നത്
  choice: മനുഷ്യരെ ‘യജമാനന്മാർ’ എന്നും ദിവ്യ വ്യക്തിയെ ‘കർത്താവ്’ എന്നും പരിഭാഷപ്പെടുത്തുക
  alternative: രണ്ടിടത്തും ‘യജമാനൻ’ ഉപയോഗിക്കുക
  rationale: ഗ്രീക്കിലെ ഒരേ പദത്തിന്റെ ബന്ധം പൂർണമായി മായ്ക്കാതെ, ഭൂമിയിലെ യജമാനന്മാർക്കും മീതെ സ്വർഗീയ കർത്താവുണ്ടെന്ന വിരോധാഭാസം മലയാളത്തിൽ വ്യക്തമായി പ്രകടമാക്കുന്നു.
- issue: പുരാതന ഗൃഹവ്യവസ്ഥയിലെ സാമൂഹിക പദവി
  choice: ‘യജമാനന്മാർ’ ഉപയോഗിച്ച് ചരിത്രപരമായ ബന്ധം നിലനിർത്തുക
  alternative: ‘തൊഴിലുടമകൾ’ അല്ലെങ്കിൽ ‘ഉടമകൾ’
  rationale: ‘തൊഴിലുടമകൾ’ ആധുനിക തൊഴിൽബന്ധം അനാവശ്യമായി പാഠത്തിലേക്ക് കൊണ്ടുവരും; ‘ഉടമകൾ’ ബന്ധത്തെ സ്വത്തവകാശത്തിലേക്ക് മാത്രം ചുരുക്കും.
- issue: ദൈവത്തിന്റെ പക്ഷപാതരാഹിത്യം
  choice: ‘അവിടുന്ന് ആരോടും പക്ഷപാതം കാണിക്കുന്നില്ല’
  alternative: ‘അവിടുത്തെ പക്കൽ പക്ഷപാതമില്ല’
  rationale: ആരെയും സാമൂഹിക പദവിയുടെ അടിസ്ഥാനത്തിൽ അനുകൂലിക്കാത്ത ദൈവസ്വഭാവം ലളിതമായി അറിയിക്കുന്നു; അസ്വാഭാവികമായ മലയാള പ്രയോഗം ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും മാന്യവുമായ ശൈലി. ‘യജമാനന്മാരേ’, ‘കർത്താവ്’ എന്നിവ ചരിത്രപരവും ദൈവശാസ്ത്രപരവുമായ വ്യത്യാസം സംരക്ഷിക്കുന്നു. സങ്കീർണമായ ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് പ്രസ്താവനകളായി ക്രമപ്പെടുത്തിയെങ്കിലും അതിലെ കല്പന, അടിസ്ഥാനം, പക്ഷപാതരാഹിത്യം എന്നീ ബന്ധങ്ങൾ നിലനിർത്തിയിരിക്കുന്നു.
