lexical_decisions:
- source_word: τίμα
  choice: ബഹുമാനിക്കുക
  rationale: τιμάω എന്ന ക്രിയയുടെ ആജ്ഞാരൂപം ഉള്ളിലെ ആദരവിൽ ഒതുങ്ങാതെ പ്രവൃത്തിയിലൂടെ ബഹുമാനം കാണിക്കണമെന്ന് ആവശ്യപ്പെടുന്നു; കല്പനയുടെ ധാർമിക ഭാരം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്.
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα
  choice: നിന്റെ അപ്പനെയും അമ്മയെയും
  rationale: നേരിട്ടുള്ള കുടുംബബന്ധപദങ്ങൾ സാധാരണ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകി; ആവർത്തിച്ച possessive അർത്ഥം ‘നിന്റെ’ എന്ന ഒറ്റ പ്രയോഗത്തിൽ വ്യക്തമാണ്.
- source_word: ἥτις ἐστὶν
  choice: ഇതാണ്
  rationale: മുമ്പ് ഉദ്ധരിച്ച കല്പനയിലേക്കു തിരിച്ചുചൂണ്ടുന്ന വിശദീകരണഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; ഡാഷുകൾ അതിന്റെ ഇടക്കുറിപ്പുസ്വഭാവം നിലനിർത്തുന്നു.
- source_word: ἐντολὴ
  choice: കല്പന
  rationale: ദശകല്പനയോടുള്ള തിരുവെഴുത്തുപരമായ ബന്ധവും ആജ്ഞയുടെ ഔദ്യോഗിക ഭാരവും ‘കല്പന’ നിലനിർത്തുന്നു.
- source_word: πρώτη
  choice: ആദ്യത്തെ
  rationale: ക്രമസൂചകമായ അർത്ഥം നേരിട്ട് നിലനിർത്തുന്നു; ‘പ്രധാനമായ’ എന്ന വ്യാഖ്യാനം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: ἐν ἐπαγγελίᾳ
  choice: വാഗ്ദാനത്തോടുകൂടിയ
  rationale: അക്ഷരാർഥത്തിൽ ‘വാഗ്ദാനത്തിൽ’ എന്നാണെങ്കിലും, കല്പനയോടൊപ്പം ഒരു വാഗ്ദാനം ചേർന്നിരിക്കുന്നു എന്ന സന്ദർഭാർഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
theological_decisions:
- issue: ‘ആദ്യത്തെ കല്പന’യും ദശകല്പനയുടെ ക്രമവും തമ്മിലുള്ള ബന്ധം
  choice: വാഗ്ദാനത്തോടുകൂടിയ ആദ്യത്തെ കല്പന
  alternative: രണ്ടാം വിഭാഗത്തിലെ ആദ്യത്തെ കല്പന; വാഗ്ദാനത്തിലുള്ള ആദ്യത്തെ കല്പന; വാഗ്ദാനത്തോടുകൂടിയ പ്രധാന കല്പന
  rationale: πρώτη എന്നതിന്റെ ക്രമസൂചകബലം നിലനിർത്തുകയും ἐν ἐπαγγελίᾳ എന്ന ദുഷ്കരമായ പ്രയോഗത്തിന്റെ സന്ദർഭാർഥം വ്യക്തമാക്കുകയും ചെയ്യുന്നു. ഏതെങ്കിലും പ്രത്യേക ദശകല്പനാ-എണ്ണൽരീതി ഇറക്കുമതി ചെയ്യുകയോ ‘ആദ്യത്തെ’ എന്നത് ‘ഏറ്റവും പ്രധാനമായ’ എന്നു മാറ്റുകയോ ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘അപ്പൻ, അമ്മ’ എന്നീ സാധാരണ കുടുംബപദങ്ങളും ‘ബഹുമാനിക്കുക, കല്പന, വാഗ്ദാനം’ എന്നീ പരിചിതമായ ഗൗരവപദങ്ങളും ഉപയോഗിച്ചു. മൂലത്തിലെ ഉദ്ധരണിയും വിശദീകരണ ഇടക്കുറിപ്പും ഡാഷുകളിലൂടെ സൂക്ഷിച്ചു.
