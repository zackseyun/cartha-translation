id: EPH.6.16
reference: Ephesians 6:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ἐν πᾶσιν ἀναλαβόντες τὸν θυρεὸν τῆς πίστεως, ἐν ᾧ δυνήσεσθε πάντα τὰ βέλη τοῦ ⸀πονηροῦ πεπυρωμένα σβέσαι·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/016.yaml
  text: In all circumstances[a], taking up the shield of faith[c][b], with which you will be able to extinguish all the flaming arrows of the evil one.
translation:
  language: ml
  text: എല്ലാ സാഹചര്യങ്ങളിലും[a] വിശ്വാസത്തിന്റെ പരിച എടുത്തുകൊള്ളുക. അതുപയോഗിച്ച് ദുഷ്ടന്റെ[b] തീകൊളുത്തപ്പെട്ട എല്ലാ അമ്പുകളും[c] കെടുത്താൻ നിങ്ങൾക്കു കഴിയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇവയെല്ലാറ്റിനോടും ചേർത്ത്.’ ഗ്രീക്ക് പ്രയോഗത്തിന് ‘എല്ലാ സാഹചര്യങ്ങളിലും’ എന്ന ക്രിയാവിശേഷണാർഥമോ, മുമ്പ് പറഞ്ഞ ആയുധങ്ങളോടു ചേർത്ത് എന്ന അർഥമോ ഉണ്ടാകാം.
    reason: ἐν πᾶσιν എന്ന പ്രയോഗത്തിന്റെ സന്ദർഭപരമായ മറ്റൊരു സാധ്യത സംരക്ഷിക്കുന്നു.
  - marker: b
    text: അഥവാ, ‘തിന്മയുടെ.’ ഗ്രീക്ക് പ്രയോഗം അമൂർത്തമായ തിന്മയെ സൂചിപ്പിക്കാം; എന്നാൽ യുദ്ധത്തിന്റെ ഈ സന്ദർഭത്തിൽ വ്യക്തിപരമായ അർഥം കൂടുതൽ യോജിക്കുന്നു.
    reason: τοῦ πονηροῦ എന്നതിലെ യഥാർഥ വ്യാകരണ-സന്ദർഭപരമായ അവ്യക്തത സംരക്ഷിക്കുന്നു.
  - marker: c
    text: ‘അമ്പുകൾ’ എന്നു പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്ക് പദം എറിയുന്ന ആയുധങ്ങൾക്കുള്ള പൊതുപദവുമാകാം; ‘കുന്തങ്ങൾ’ അല്ലെങ്കിൽ പരമ്പരാഗതമായി ‘തീ അമ്പുകൾ’ എന്നും വിവർത്തനം ചെയ്യാറുണ്ട്.
    reason: βέλη എന്ന പദത്തിന്റെ വിശാലമായ ലെക്സിക്കൽ പരിധിയും പരമ്പരാഗത വിവർത്തനസാധ്യതയും രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: ἐν πᾶσιν
  choice: എല്ലാ സാഹചര്യങ്ങളിലും
  rationale: ഈ ആയുധവർഗണനയുടെ പശ്ചാത്തലത്തിൽ പ്രയോഗം ക്രിയാവിശേഷണപരമായി എടുത്ത് ‘എല്ലാ സാഹചര്യങ്ങളിലും’ എന്നു നൽകി. ‘ഇവയ്‌ക്കെല്ലാം പുറമേ’ എന്ന ബന്ധാർഥവും സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: ἀναλαβόντες
  choice: എടുത്തുകൊള്ളുക
  rationale: മുൻവാക്യത്തിലെ ആഹ്വാനത്തോടു ചേർന്ന അനുബന്ധപ്രവൃത്തിയാണ് കർത്തൃവാചകമായ ഈ ഭൂതകാല കൃദന്തം സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ വാക്യം സ്വാഭാവികവും ആഹ്വാനത്തിന്റെ ശക്തി വ്യക്തവുമാക്കാൻ വിധിരൂപം ഉപയോഗിച്ചു.
- source_word: τὸν θυρεὸν τῆς πίστεως
  choice: വിശ്വാസമാകുന്ന പരിച
  rationale: θυρεός ഒരു വലിയ സംരക്ഷണപരിചയെ സൂചിപ്പിക്കുന്നു; സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ‘പരിച’ മതിയാകുന്നു. ജനിറ്റീവ് രൂപകബന്ധം സ്വാഭാവിക മലയാളത്തിൽ ‘വിശ്വാസമാകുന്ന’ എന്നു പ്രകടിപ്പിച്ചു.
- source_word: ἐν ᾧ
  choice: അതുകൊണ്ട്
  rationale: ബന്ധസർവനാമം പരിചയെ പരാമർശിക്കുകയും ἐν ഉപകരണാർഥം വഹിക്കുകയും ചെയ്യുന്നു. അതിനാൽ ‘അതുകൊണ്ട്’ മാർഗം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: δυνήσεσθε
  choice: നിങ്ങൾക്കു കഴിയും
  rationale: ഭാവികാലത്തിലെ കഴിവിനെ സൂചിപ്പിക്കുന്ന രൂപം. മലയാളത്തിലെ ഈ പ്രയോഗം സന്ദർഭത്തിൽ ഭാവിസാധ്യത സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: βέλη
  choice: അമ്പുകൾ
  rationale: βέλη എന്നത് പൊതുവായി എറിയുന്ന ആയുധങ്ങളെ സൂചിപ്പിക്കാമെങ്കിലും യുദ്ധരൂപകത്തിൽ ‘അമ്പുകൾ’ വ്യക്തവും സ്വാഭാവികവുമാണ്; വിശാലമായ അർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: τοῦ πονηροῦ
  choice: ദുഷ്ടന്റെ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ ഏകവചനരൂപവും ആത്മീയയുദ്ധത്തിന്റെ സന്ദർഭവും വ്യക്തിപരമായ ‘ദുഷ്ടൻ’ എന്ന വായനയെ പിന്തുണയ്ക്കുന്നു.
- source_word: πεπυρωμένα
  choice: തീപിടിച്ച
  rationale: ‘തീ കൊളുത്തപ്പെട്ട’ എന്ന perfect passive ആശയം ചുരുക്കവും ദൃശ്യവുമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: σβέσαι
  choice: കെടുത്താൻ
  rationale: തീയെ അണയ്ക്കുക എന്ന σβέννυμι-യുടെ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: τοῦ πονηροῦ എന്നതിന്റെ വ്യക്തിപരമോ അമൂർത്തമോ ആയ അർഥം
  choice: ദുഷ്ടന്റെ
  alternative: തിന്മയുടെ
  rationale: ആത്മീയയുദ്ധവും ശത്രുതാപരമായ ആക്രമണവും ചിത്രീകരിക്കുന്ന സന്ദർഭത്തിൽ വ്യക്തിപരമായ വായന കൂടുതൽ യോജിക്കുന്നു. എന്നാൽ ഗ്രീക്ക് വ്യാകരണത്തിൽ അമൂർത്തമായ ‘തിന്മ’ എന്ന വായന സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: πίστις എന്നതിന്റെ വിവർത്തനം
  choice: വിശ്വാസം
  alternative: ആശ്രയം; വിശ്വസ്തത
  rationale: ഈ സന്ദർഭത്തിൽ ദൈവത്തിലുള്ള വിശ്വാസപരമായ ആശ്രയമാണ് പ്രതിരോധപരിചയുടെ രൂപകത്തോട് ഏറ്റവും നന്നായി ചേരുന്നത്. ‘വിശ്വസ്തത’ എന്ന ലെക്സിക്കൽ സാധ്യത ഇവിടെ താരതമ്യേന ദുർബലമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. യുദ്ധരൂപകം നിലനിർത്തി; അനാവശ്യമായി സാങ്കേതികമോ പുരാതനമോ ആയ പദങ്ങൾ ഒഴിവാക്കി. ഒറ്റവാക്യമായി വായിക്കുമ്പോൾ വ്യക്തതയ്ക്കായി പങ്കാളികൃദന്തത്തെ ആഹ്വാനരൂപത്തിൽ അവതരിപ്പിച്ചു.
