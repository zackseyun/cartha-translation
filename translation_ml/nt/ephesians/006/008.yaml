source:
  edition: SBLGNT
  text: εἰδότες ὅτι ⸂ἕκαστος, ὃ ἂν⸃ ποιήσῃ ἀγαθόν, τοῦτο ⸀κομίσεται ⸀παρὰ κυρίου, εἴτε δοῦλος εἴτε ἐλεύθερος.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/008.yaml
  text: knowing that each one[a], whatever good he does, this he will receive back from the Lord[b], whether servant or free.
translation:
  language: ml
  text: ഓരോരുത്തനും, താൻ ചെയ്യുന്ന ഏതു നന്മയായാലും, അത് കർത്താവിൽനിന്ന് തിരികെ ലഭിക്കുമെന്ന് അറിഞ്ഞുകൊണ്ട്—അവൻ അടിമയായാലും സ്വതന്ത്രനായാലും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഓരോരുത്തൻ ചെയ്യുന്ന ഏതു നന്മയ്ക്കും കർത്താവ് അവനു പ്രതിഫലം നൽകും; അവൻ അടിമയായാലും സ്വതന്ത്രനായാലും.” ഗ്രീക്ക് ക്രിയയ്ക്ക് ഒരാളുടെ പ്രവൃത്തിക്കു യോജിച്ചതു പ്രത്യുപകാരമായി ലഭിക്കുക എന്ന അർഥവും ഉണ്ടാകാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδότες
  choice: അറിഞ്ഞുകൊള്ളുവിൻ
  rationale: മുൻവാക്യത്തിലെ ആഹ്വാനത്തെ അടിസ്ഥാനപ്പെടുത്തുന്ന ക്രിയാവിശേഷണസ്വഭാവമുള്ള പങ്കാളിക്രിയയാണ്. മലയാളത്തിൽ ഒറ്റവാക്യമായി സ്വാഭാവികമാക്കാൻ ആഹ്വാനരൂപം ഉപയോഗിച്ചു; കാരണംബന്ധം അതിരുകടന്ന് വ്യക്തമാക്കിയിട്ടില്ല.
- source_word: ἕκαστος
  choice: ഓരോരുത്തനും
  rationale: വിതരണാത്മകമായ ഏകവചന ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: ὃ ἂν ποιήσῃ ἀγαθόν
  choice: താൻ ചെയ്യുന്ന ഏതു നന്മയ്ക്കും
  rationale: ἄν ചേർന്ന ബന്ധവാക്യത്തിന്റെ അനിശ്ചിതമായ ‘എന്തുതന്നെയായാലും’ എന്ന അർഥവും പ്രവൃത്തിയുടെ നൈതികനന്മയും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: τοῦτο κομίσεται
  choice: അതിനു തക്കതു തിരികെ ലഭിക്കും
  rationale: τοῦτο മുമ്പ് ചെയ്ത നന്മയിലേക്കു ചൂണ്ടുന്നു; κομίσεται പ്രവൃത്തിയോടു പൊരുത്തപ്പെടുന്ന പ്രതിഫലം തിരികെ ലഭിക്കുന്ന ആശയം വഹിക്കുന്നു. കർശനമായ വാണിജ്യഭാവം ഒഴിവാക്കി.
- source_word: παρὰ κυρίου
  choice: കർത്താവിൽനിന്ന്
  rationale: παρά + genitive ഉറവിടത്തെ സൂചിപ്പിക്കുന്നു. ‘കർത്താവ്’ ദൈവികവും സാധ്യതയേറിയ ക്രിസ്തുസംബന്ധവുമായ സൂചന സംരക്ഷിക്കുന്നു.
- source_word: δοῦλος
  choice: അടിമ
  rationale: ἐλεύθερος എന്നതുമായുള്ള വ്യക്തമായ സാമൂഹിക-നിയമപരമായ വിരോധം കാരണം ബന്ധിത നില മൃദൂകരിക്കാതെ നൽകുന്നു.
- source_word: ἐλεύθερος
  choice: സ്വതന്ത്രൻ
  rationale: അടിമയല്ലാത്ത സാമൂഹിക നിലയെ സംക്ഷിപ്തമായും വ്യക്തമായും അടയാളപ്പെടുത്തുന്നു.
theological_decisions:
- issue: വീട്ടുക്രമസന്ദർഭത്തിലെ δοῦλος എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: അടിമ
  alternative: ദാസൻ / സേവകൻ
  rationale: δοῦλος–ἐλεύθερος വിരോധം അടിമയും സ്വതന്ത്രനും എന്ന സാമൂഹിക വ്യത്യാസം വ്യക്തമായി ഉന്നയിക്കുന്നു; ‘സേവകൻ’ ചരിത്രയാഥാർഥ്യം മൃദൂകരിക്കും.
- issue: κυρίου എന്നതിന്റെ സൂചനയും വിവർത്തനവും
  choice: കർത്താവ്
  alternative: യജമാനൻ
  rationale: സന്ദർഭത്തിൽ മനുഷ്യയജമാനന്മാരെക്കുറിച്ചുണ്ടെങ്കിലും പ്രതിഫലത്തിന്റെ ഉറവിടം ദൈവിക കർത്താവാണ്. ‘കർത്താവ്’ സാധ്യതയേറിയ ക്രിസ്തുസംബന്ധ സൂചന നിലനിർത്തുന്നു.
- issue: പ്രതിഫലത്തിന്റെ സ്വഭാവം
  choice: അതിനു തക്കതു തിരികെ ലഭിക്കും
  alternative: അതേ കാര്യം തിരികെ ലഭിക്കും / അതിനുള്ള പ്രതിഫലം ലഭിക്കും
  rationale: τοῦτο എന്ന ചൂണ്ടുപദവും κομίσεται എന്ന ക്രിയയിലെ തിരിച്ചുലഭിക്കൽ/തത്തുല്യഫലം എന്ന ആശയവും നിലനിർത്തുന്നു; ചെയ്ത നന്മ തന്നെ അക്ഷരാർഥത്തിൽ തിരികെ കിട്ടുമെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അടിമ’ ചരിത്രപരമായ സാമൂഹികവിരോധം വ്യക്തമായി സൂക്ഷിക്കുന്നു. വാക്യം മുൻസന്ദർഭത്തിലെ ആഹ്വാനത്തോട് ചേരുന്ന വിധത്തിൽ ‘അറിഞ്ഞുകൊള്ളുവിൻ’ എന്നു നൽകിയിരിക്കുന്നു.
