id: EPH.6.6
reference: Ephesians 6:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μὴ κατ’ ὀφθαλμοδουλίαν ὡς ἀνθρωπάρεσκοι ἀλλ’ ὡς ⸀δοῦλοι Χριστοῦ ποιοῦντες τὸ θέλημα τοῦ θεοῦ, ἐκ ψυχῆς
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/006.yaml
  text: not by eye-service[a], as people-pleasers, but as servants of Messiah[c][b], doing the will of God from the soul.
translation:
  language: ml
  text: കാണിക്കായുള്ള സേവനം ചെയ്യാതെ[a], മനുഷ്യരെ പ്രസാദിപ്പിക്കുന്നവരെപ്പോലെയല്ല; മശീഹയുടെ[b] അടിമകളായി, ദൈവത്തിന്റെ ഇഷ്ടം മുഴുമനസ്സോടെ[c] ചെയ്തുകൊണ്ട്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥം ‘കണ്ണുസേവനം’; അതായത്, ആളുകൾ കണ്ടുനിൽക്കുമ്പോൾ മാത്രം കാണിക്കായി ചെയ്യുന്ന സേവനം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ ‘ക്രിസ്തുവിന്റെ’; ഗ്രീക്ക് Christos, ‘അഭിഷിക്തൻ’ എന്നർഥമുള്ള സ്ഥാനപ്പേര്.
    reason: alternative_reading
  - marker: c
    text: അല്ലെങ്കിൽ ‘ഉള്ളിൽനിന്ന്’; അക്ഷരാർഥം ‘ജീവനിൽനിന്ന്’ അല്ലെങ്കിൽ ‘ആത്മാവിൽനിന്ന്’ എന്ന ആശയമുള്ള പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀφθαλμοδουλίαν
  choice: ആളുകൾ നോക്കുമ്പോൾ മാത്രം സേവിക്കുക
  rationale: ‘കണ്ണ്’ + ‘സേവനം/അടിമപ്പണി’ എന്ന അപൂർവ ഗ്രീക്ക് സംയുക്തപദം മേൽനോട്ടമുള്ളപ്പോൾ മാത്രം കാണിക്കായി ജോലി ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. അക്ഷരാർഥത്തിലുള്ള ഒരു അസ്വാഭാവിക സംയുക്തപദത്തേക്കാൾ ഈ പ്രയോഗം ആ ആശയം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; പദത്തിന്റെ രൂപകം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: ἀνθρωπάρεσκοι
  choice: മനുഷ്യരെ പ്രസാദിപ്പിക്കുന്നവർ
  rationale: മനുഷ്യരുടെ അംഗീകാരം നേടാൻ അവരെ സന്തോഷിപ്പിക്കാൻ ശ്രമിക്കുന്നവരെയാണ് പദം സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ സ്വാഭാവികവും നിഷേധാത്മകമായ ധ്വനി നിലനിർത്തുന്നതുമായ പ്രയോഗമാണിത്.
- source_word: δοῦλοι
  choice: അടിമകൾ
  rationale: സമീപസന്ദർഭം യഥാർഥ അടിമകളെ അഭിസംബോധന ചെയ്യുന്നു; ഇവിടെ മശീഹയോടുള്ള പൂർണമായ ഉടമസ്ഥബന്ധവും അനുസരണവും പ്രധാനമാണ്. അതിനാൽ മൃദുവായ ‘ദാസന്മാർ/സേവകർ’ എന്നതിനു പകരം ‘അടിമകൾ’ ഉപയോഗിച്ചു.
- source_word: Χριστοῦ
  choice: മശീഹയുടെ
  rationale: Χριστός അഭിഷിക്തനായ രാജാവിനെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരാണ്. ആ അർഥം തുറന്നുകാട്ടാൻ ‘മശീഹ’ ഉപയോഗിച്ചു; പരിചിതമായ ‘ക്രിസ്തു’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ποιοῦντες
  choice: ചെയ്തുകൊണ്ട്
  rationale: വാക്യത്തിന്റെ മുൻസന്ദർഭത്തിലെ ആജ്ഞയോടൊപ്പം നടക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന വർത്തമാന കർത്തൃവാചക കൃദന്തരൂപം മലയാളത്തിലും കൃദന്തരൂപമായി നിലനിർത്തുന്നു.
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ ഇഷ്ടം
  rationale: ദൈവം ചെയ്യണമെന്ന് ആഗ്രഹിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സാധാരണവും വ്യക്തവുമായ മലയാളപ്രയോഗം.
- source_word: ἐκ ψυχῆς
  choice: മുഴുമനസ്സോടെ
  rationale: അക്ഷരാർഥം ‘പ്രാണനിൽനിന്ന്/ജീവനിൽനിന്ന്’ എന്നാണെങ്കിലും, ഇവിടെ ഉള്ളിലെ ആത്മാർഥതയോടെയും പൂർണസന്നദ്ധതയോടെയും ചെയ്യുക എന്നതാണ് പ്രയോഗാർഥം. ‘മുഴുമനസ്സോടെ’ സ്വാഭാവിക മലയാളത്തിൽ ആ തീവ്രത നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: അടിമത്തസന്ദർഭത്തിൽ δοῦλοι എന്നതിന്റെ പരിഭാഷ
  choice: മശീഹയുടെ അടിമകൾ
  alternative: മശീഹയുടെ ദാസന്മാർ / സേവകർ
  rationale: ഭൗമിക യജമാനന്മാരുടെ കീഴിലുള്ള യഥാർഥ അടിമകളെക്കുറിച്ചുള്ള സമീപസന്ദർഭത്തിൽ, അവരുടെ ആത്യന്തിക ഉടമസ്ഥബന്ധം മശീഹയുമായി ബന്ധപ്പെടുത്തി പൗലോസ് പുനർനിർവചിക്കുന്നു. അതിനാൽ ബന്ധനത്തിന്റെയും ഉടമസ്ഥതയുടെയും ശക്തി നഷ്ടപ്പെടാതിരിക്കാൻ ‘അടിമകൾ’ നിലനിർത്തി.
- issue: Χριστοῦ സ്ഥാനപ്പേരായോ പേരുപോലുള്ള രൂപമായോ നൽകുക
  choice: മശീഹയുടെ
  alternative: ക്രിസ്തുവിന്റെ
  rationale: അഭിഷിക്തനായ ഭരണാധികാരിയോടുള്ള വിധേയത്വമാണ് ‘അടിമകൾ’ എന്നതിനോടുള്ള ബന്ധത്തിൽ മുന്നിൽ വരുന്നത്. അതിനാൽ സ്ഥാനപ്പേരിന്റെ അർഥം വ്യക്തമാക്കുന്ന ‘മശീഹ’ തിരഞ്ഞെടുത്തു; പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- issue: ἐκ ψυχῆς എന്ന മനുഷ്യാന്തരത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗം
  choice: മുഴുമനസ്സോടെ
  alternative: പ്രാണനിൽനിന്ന് / ഉള്ളിൽനിന്ന്
  rationale: ഇത് ആത്മാർഥമായ സമഗ്രസന്നദ്ധതയെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണെങ്കിലും ψυχή എന്ന പദത്തിന്റെ അക്ഷരാർഥം മാത്രം ഉപയോഗിച്ചാൽ മലയാളത്തിൽ ‘ആത്മാവ്’ എന്ന വേറിട്ട ദൈവശാസ്ത്രപരമായ ആശയവുമായി കുഴയാം. അതിനാൽ പ്രയോഗാർഥം മുഖ്യവാചകത്തിലും അക്ഷരാർഥം അടിക്കുറിപ്പിലും നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. മുൻവാക്യത്തിൽ ആരംഭിച്ച ആജ്ഞയുടെ തുടർച്ചയാണെന്ന ഗ്രീക്ക് വാക്യഘടന നിലനിർത്താൻ അവസാനം ‘ചെയ്തുകൊണ്ട്’ എന്ന കൃദന്തരൂപം ഉപയോഗിച്ചു. അപൂർവമായ ഗ്രീക്ക് സംയുക്തപദവും ψυχή-പ്രയോഗവും മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി, അവയുടെ അക്ഷരരൂപങ്ങൾ അടിക്കുറിപ്പുകളിൽ സൂക്ഷിച്ചു.
