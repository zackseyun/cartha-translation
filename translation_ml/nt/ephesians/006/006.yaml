    issue: The order of the two opening expressions is reversed, and the main-text wording for ὀφθαλμοδουλίαν is somewhat expanded.
    rationale: Greek first says ‘not according to eye-service,’ then ‘as people-pleasers.’ A more compact Malayalam rendering better retains the rhetorical sequence, while the explanatory ‘only when watched’ wording belongs well in a note.
  - severity: low
    issue: Footnote c’s literal gloss is too narrow and potentially misleading.
    rationale: ψυχή has a range including life/self/soul; ‘പ്രാണനിൽനിന്ന്’ alone can suggest a more specific sense than the Greek requires. A range-based gloss preserves the ambiguity.
