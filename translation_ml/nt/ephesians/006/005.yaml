id: EPH.6.5
reference: Ephesians 6:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οἱ δοῦλοι, ὑπακούετε τοῖς ⸂κατὰ σάρκα κυρίοις⸃ μετὰ φόβου καὶ τρόμου ἐν ἁπλότητι τῆς καρδίας ὑμῶν ὡς τῷ Χριστῷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/005.yaml
  text: Servants[a], obey your masters according to the flesh with fear and trembling, in sincerity of your heart, as to Messiah[b],
translation:
  language: ml
  text: അടിമകളേ, ജഡപ്രകാരമുള്ള യജമാനന്മാരെ[a] ഭയത്തോടും വിറയലോടുംകൂടെ, നിഷ്കപടമായ ഹൃദയത്തോടെ, മശീഹയെ[b] അനുസരിക്കുന്നതുപോലെ അനുസരിക്കുവിൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘ജഡപ്രകാരമുള്ള യജമാനന്മാർ’; അതായത്, ഈ ലോകത്തിലെ മാനുഷികബന്ധത്തിന്റെ പരിധിയിൽ മാത്രം യജമാനന്മാരായവർ.
    reason: lexical_alternative
  - marker: b
    text: 'ഗ്രീക്ക്: ‘ക്രിസ്തു’; ഇവിടെ ഈ പദം സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നതിനാൽ ‘മശീഹ’ എന്നു വിവർത്തനം ചെയ്തിരിക്കുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: δοῦλοι
  choice: അടിമകളേ
  rationale: ഉടമസ്ഥതയ്ക്കു കീഴിലുള്ള ബന്ധിതരായ ആളുകളെയാണ് ഗൃഹനിയമങ്ങളുടെ ഈ സന്ദർഭത്തിൽ പദം സൂചിപ്പിക്കുന്നത്. ‘ദാസന്മാർ’ എന്ന മൃദൂകരണം ഒഴിവാക്കി സാമൂഹിക യാഥാർഥ്യം സുതാര്യമാക്കുന്നു.
- source_word: ὑπακούετε
  choice: അനുസരിക്കുവിൻ
  rationale: തുടർച്ചയായ അനുസരണം ആവശ്യപ്പെടുന്ന വർത്തമാനകാല ബഹുവചന ആജ്ഞയെ വ്യക്തവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: κατὰ σάρκα
  choice: ജഡപ്രകാരമുള്ള
  rationale: ഗ്രീക്കിലെ ശരീര/മാനുഷിക തലത്തിലുള്ള ബന്ധം സൂചിപ്പിക്കുന്ന പ്രയോഗം അതിന്റെ വൈരുധ്യവും അല്പം അസാധാരണമായ രൂപവും സഹിതം നിലനിർത്തുന്നു; തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ അടിക്കുറിപ്പ് ചേർക്കുന്നു.
- source_word: κυρίοις
  choice: യജമാനന്മാരെ
  rationale: അടിമകളുടെ ഉടമകളെയോ ഗൃഹനാഥന്മാരെയോ സൂചിപ്പിക്കുന്ന സന്ദർഭോചിത പദം; പിന്നാലെയുള്ള മശീഹാ പരാമർശവുമായി ആശയക്കുഴപ്പം ഉണ്ടാക്കുന്ന ‘കർത്താക്കൾ’ ഒഴിവാക്കുന്നു.
- source_word: μετὰ φόβου καὶ τρόμου
  choice: ഭയത്തോടും വിറയലോടുംകൂടെ
  rationale: പൗലോസിന്റെ സ്ഥിരപ്രയോഗത്തിന്റെ ശക്തിയും പരസ്പരഗ്രന്ഥബന്ധവും നിലനിർത്തുന്ന അടുത്ത വിവർത്തനം.
- source_word: ἐν ἁπλότητι τῆς καρδίας ὑμῶν
  choice: നിഷ്കപടമായ ഹൃദയത്തോടെ
  rationale: ἁπλότης സൂചിപ്പിക്കുന്ന ആത്മാർഥത, കപടമില്ലായ്മ, വിഭജിക്കപ്പെടാത്ത ഉള്ളം എന്നിവ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ὡς τῷ Χριστῷ
  choice: മശീഹയെ അനുസരിക്കുന്നതുപോലെ
  rationale: ὡς എന്നതിന്റെ താരതമ്യബലം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ ആവശ്യമായ ക്രിയ പുനരാവർത്തിക്കുന്നു; Χριστός ഇവിടെ സ്ഥാനപ്പേരായി ‘മശീഹ’ എന്നു വിവർത്തനം ചെയ്യുന്നു.
theological_decisions:
- issue: Χριστῷ എന്നതിന്റെ വിവർത്തനം
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: Χριστός ഇവിടെ വ്യക്തിനാമംപോലെ മാത്രമല്ല, അഭിഷിക്തൻ എന്ന സ്ഥാനപ്പേരായും പ്രവർത്തിക്കുന്നു; അതിനാൽ അർഥം വിവർത്തനം ചെയ്യുന്ന ‘മശീഹ’ സ്വീകരിച്ചു.
- issue: അടിമത്തസന്ദർഭത്തിലെ δοῦλοι
  choice: അടിമകൾ
  alternative: ദാസന്മാർ / സേവകർ
  rationale: യജമാനന്മാരുടെ അധികാരത്തിനു കീഴിലുള്ള ബന്ധിതരെയാണ് വാക്യം നേരിട്ട് അഭിസംബോധന ചെയ്യുന്നത്. ‘സേവകർ’ എന്നത് മൂലപാഠത്തിലെ സാമൂഹിക യാഥാർഥ്യം മൃദൂകരിക്കും.
- issue: κατὰ σάρκα എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: ജഡപ്രകാരമുള്ള
  alternative: ഭൗമികരായ / മാനുഷികനിലയിലുള്ള
  rationale: ഇവിടെ ‘ജഡം’ പാപസ്വഭാവത്തെ സൂചിപ്പിക്കുന്നില്ല; മശീഹയോടുള്ള ബന്ധത്തിൽനിന്നു വ്യത്യസ്തമായി, ശരീരപരവും താൽക്കാലികവുമായ മനുഷ്യബന്ധത്തിന്റെ പരിധിയെയാണ് സൂചിപ്പിക്കുന്നത്. മുഖ്യപാഠത്തിൽ രൂപം നിലനിർത്തി അടിക്കുറിപ്പിൽ അർഥം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന വിധത്തിൽ മാന്യമായ തിരുവെഴുത്തുശൈലി സ്വീകരിച്ചു. ‘ജഡപ്രകാരമുള്ള’ എന്ന മൂലപ്രയോഗത്തിന്റെ അസാധാരണത സംരക്ഷിച്ചെങ്കിലും അടിക്കുറിപ്പിലൂടെ അതിന്റെ മാനുഷിക/ഭൗമിക പരിധി വ്യക്തമാക്കി. ‘അനുസരിക്കുവിൻ’ എന്ന രൂപം ബഹുവചന ആജ്ഞയുടെ ഗൗരവം നിലനിർത്തുന്നു.
