review_pass:
  verdict: revise
  source_fidelity: 'The clause sequence and the purpose sense are retained well: taking the divine armor enables resistance in the evil day and continued standing after accomplishing all that is required. However, ‘പടച്ചട്ട’ normally denotes a specific piece of armor (a breastplate/cuirass), whereas πανοπλία denotes the full armor or complete military equipment. The main-text term should therefore be broadened.'
  naturalness: The Malayalam is clear and appropriately serious. ‘ദുഷ്ടദിവസത്തിൽ,’ ‘ചെറുത്തുനിൽക്കാനും,’ and ‘ഉറച്ചുനിൽക്കാനും’ are natural modern-standard phrasing. ‘സമ്പൂർണ കവചം എടുത്തുകൊള്ളുക’ is more idiomatic and semantically accurate than the narrower ‘സമ്പൂർണ പടച്ചട്ട എടുത്തണിയുക.’
  terminology: Retain ‘ദൈവത്തിന്റെ’ without resolving the broad genitive. Render πανοπλία as ‘സമ്പൂർണ കവചം’; this conveys complete armor without confusing it with the specific breastplate later named in Ephesians 6:14. The footnote may retain ‘മുഴുവൻ യുദ്ധസജ്ജീകരണം’ as an explanatory alternative.
  issues:
  - severity: medium
    issue: ‘പടച്ചട്ട’ is too narrow for πανοπλία.
    rationale: In Malayalam, ‘പടച്ചട്ട’ ordinarily identifies a breastplate or protective chest-piece. The Greek denotes the complete armor/equipment, not one item. This also risks terminological collision with θώραξ in the following verse.
