  text: διὰ τοῦτο ἀναλάβετε τὴν πανοπλίαν τοῦ θεοῦ, ἵνα δυνηθῆτε ἀντιστῆναι ἐν τῇ ἡμέρᾳ τῇ πονηρᾷ καὶ ἅπαντα κατεργασάμενοι στῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/013.yaml
  text: Therefore take up the full armor of God[a], so that you may be able to withstand in the evil day, and having done everything[d][c][b], to stand firm.
translation:
  language: ml
  text: അതുകൊണ്ട്, ദുഷ്ടദിവസത്തിൽ ചെറുത്തുനിൽക്കാനും എല്ലാം ചെയ്തുതീർത്തശേഷം ഉറച്ചുനിൽക്കാനും നിങ്ങൾക്കു കഴിയേണ്ടതിന് ദൈവത്തിന്റെ സമ്പൂർണ കവചം എടുത്തുകൊള്ളുക.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദൈവത്തിന്റെ മുഴുവൻ യുദ്ധസജ്ജീകരണം.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദം ഒരു പടയാളിയുടെ സമ്പൂർണ ആയുധസജ്ജീകരണത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യത്തിലെ ആഹ്വാനവുമായി ബന്ധിപ്പിക്കുന്ന സ്വാഭാവികവും സംക്ഷിപ്തവുമായ അനുമാനസൂചക പ്രയോഗം.
- source_word: ἀναλάβετε
  choice: എടുത്തണിയുക
  rationale: വെറുതെ ‘ധരിക്കുക’ എന്നതിലുപരി യുദ്ധസജ്ജീകരണം എടുത്ത് അണിയുന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὴν πανοπλίαν τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ സമ്പൂർണ പടച്ചട്ട
  rationale: πανοπλία ഒരു പടയാളിയുടെ മുഴുവൻ യുദ്ധസജ്ജീകരണത്തെയും സൂചിപ്പിക്കുന്നു. ‘ദൈവത്തിന്റെ’ എന്ന ഷഷ്ഠീവിഭക്തി ഉടമസ്ഥതയോ ദൈവം നൽകുന്നതോ എന്ന് നിർണയിക്കാതെ ഗ്രീക്കിലെ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: ἵνα δυνηθῆτε
  choice: കഴിയേണ്ടതിന്
  rationale: ഉദ്ദേശ്യവും പ്രാപ്തിയും ഒരുമിച്ച് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀντιστῆναι
  choice: ചെറുത്തുനിൽക്കാൻ
  rationale: എതിർപ്പിനെ നേരിട്ട് നിലകൊള്ളുക എന്ന സൈനികസന്ദർഭത്തിലെ അർത്ഥം പകർത്തുന്നു.
- source_word: ἐν τῇ ἡμέρᾳ τῇ πονηρᾷ
  choice: ദുഷ്ടദിവസത്തിൽ
  rationale: പ്രത്യേക അന്ത്യകാലദിവസമായി ചുരുക്കാതെ, തിന്മ ശക്തമായി നേരിടേണ്ട സമയമെന്ന തുറന്ന അർത്ഥം നിലനിർത്തുന്നു.
- source_word: ἅπαντα κατεργασάμενοι
  choice: എല്ലാം ചെയ്തുതീർത്തശേഷം
  rationale: ആവശ്യമായതെല്ലാം നിർവഹിക്കുകയോ പൂർത്തിയാക്കുകയോ ചെയ്തതിനെ സൂചിപ്പിക്കുന്നു; വിജയം നേടിയെന്ന അധിക അർത്ഥം ചേർക്കുന്നില്ല.
- source_word: στῆναι
  choice: ഉറച്ചുനിൽക്കാൻ
  rationale: യുദ്ധസന്ദർഭത്തിൽ സ്ഥാനം കൈവിടാതെ നിലകൊള്ളുക എന്ന പ്രാബല്യം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ‘ദുഷ്ടദിവസം’ എന്നതിന്റെ സൂചന
  choice: തിന്മയുടെയോ ആത്മീയ പോരാട്ടത്തിന്റെയോ സമയം എന്ന പൊതുവായ അർത്ഥത്തിൽ തുറന്നുവെച്ചു
  alternative: ഒരു നിർദിഷ്ട അന്ത്യകാലദിവസം; വ്യക്തിപരമായ പരീക്ഷയുടെ ദിവസം
  rationale: ഗ്രീക്ക് പ്രയോഗം ഒരു നിർദിഷ്ട സംഭവത്തിലേക്ക് മാത്രം ചുരുക്കാൻ നിർബന്ധിക്കുന്നില്ല; അതിന്റെ ഉദ്ദേശ്യപൂർവമായ വ്യാപ്തി വിവർത്തനം സംരക്ഷിക്കുന്നു.
- issue: ‘ദൈവത്തിന്റെ പടച്ചട്ട’ എന്ന ഷഷ്ഠീബന്ധത്തിന്റെ ബലം
  choice: ‘ദൈവത്തിന്റെ’ എന്ന് വിശാലമായി നിലനിർത്തി
  alternative: ദൈവത്തിന്റേതായ പടച്ചട്ട; ദൈവം നൽകുന്ന പടച്ചട്ട
  rationale: τοῦ θεοῦ ദൈവത്തിന്റേതെന്നോ ദൈവം നൽകുന്നതെന്നോ ബന്ധപ്പെട്ട മറ്റ് സൂക്ഷ്മാർഥങ്ങളോ ഉൾക്കൊള്ളാം; അവയിൽ ഒന്ന് മാത്രം തിരഞ്ഞെടുത്ത് ആശയം ചുരുക്കിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘പടച്ചട്ട’ എന്ന സംക്ഷിപ്ത ദൃശ്യപദം മുഖ്യവാചകത്തിൽ ഉപയോഗിച്ച്, അത് വെറും കവചമല്ല സമ്പൂർണ യുദ്ധസജ്ജീകരണമാണെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
