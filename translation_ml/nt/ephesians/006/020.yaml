  text: ὑπὲρ οὗ πρεσβεύω ἐν ἁλύσει, ἵνα ἐν αὐτῷ παρρησιάσωμαι ὡς δεῖ με λαλῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/020.yaml
  text: for which I am an ambassador in chains[a], so that in it I may speak boldly[c][b], as I ought to speak.
translation:
  language: ml
  text: അതിനു വേണ്ടി ഞാൻ ചങ്ങലയിൽ കഴിയുന്ന ഒരു സ്ഥാനപതിയാണ്; അതിൽ ഞാൻ സംസാരിക്കേണ്ടതുപോലെ തുറന്നും ധൈര്യത്തോടെയും സംസാരിക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπὲρ οὗ
  choice: അതിന്റെ പേരിൽ
  rationale: οὗ നപുംസകലിംഗ ഏകവചനമായതിനാൽ മുൻവാക്യത്തിലെ ‘സുവിശേഷത്തിന്റെ മർമം’ എന്നതിലേക്കാണ് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്. ὑπέρ ഇവിടെ അതിനുവേണ്ടി അഥവാ അതുമായി ബന്ധപ്പെട്ട് എന്ന ആശയം നൽകുന്നു.
- source_word: πρεσβεύω
  choice: ഞാൻ ... ഒരു സ്ഥാനപതിയാണ്
  rationale: ഔദ്യോഗികമായി മറ്റൊരാളെ പ്രതിനിധീകരിക്കുന്ന ദൂതൻ അഥവാ സ്ഥാനപതി എന്ന ക്രിയയുടെ അർഥം ‘സ്ഥാനപതി’ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἐν ἁλύσει
  choice: ചങ്ങലയിൽ കഴിയുന്ന
  rationale: ഗ്രീക്കിൽ ഏകവചനമായ ‘ഒരു ചങ്ങലയിൽ’ എന്ന രൂപമുണ്ടെങ്കിലും തടവിലായിരിക്കുന്നതിന്റെ ദൃശ്യബിംബം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കാൻ ഈ പ്രയോഗം ഉപയോഗിച്ചു.
- source_word: ἵνα
  choice: '... എനിക്കാകേണ്ടതിനാണിത്'
  rationale: ἵνα സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടമാക്കുന്നു.
- source_word: ἐν αὐτῷ
  choice: അതിനെക്കുറിച്ച്
  rationale: αὐτῷ നപുംസകലിംഗ ഏകവചനമായതിനാൽ ‘സുവിശേഷം’ അഥവാ അതിന്റെ മർമം തന്നെയാണ് സാധ്യതയേറിയ സൂചന. സന്ദർഭബന്ധമായ ‘അതിൽ/അതുമായി ബന്ധപ്പെട്ട്’ എന്ന അർഥം മലയാളത്തിൽ ‘അതിനെക്കുറിച്ച്’ എന്നു സ്വാഭാവികമാക്കി.
- source_word: παρρησιάσωμαι
  choice: ധൈര്യത്തോടെ സംസാരിക്കാൻ
  rationale: തുറന്നും നിർഭയമായും സംസാരിക്കുക എന്ന ക്രിയയുടെ ആശയം ഈ പ്രയോഗം നൽകുന്നു.
- source_word: ὡς δεῖ με λαλῆσαι
  choice: ഞാൻ സംസാരിക്കേണ്ടതുപോലെ
  rationale: δεῖ സൂചിപ്പിക്കുന്ന ആവശ്യകതയും കടമയും അമിതമായി യാന്ത്രികമാകാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: οὗ, αὐτῷ എന്നീ സർവനാമങ്ങളുടെ സൂചിതവസ്തു
  choice: രണ്ടും മുൻവാക്യത്തിലെ സുവിശേഷത്തെയോ ‘സുവിശേഷത്തിന്റെ മർമത്തെയോ’ സൂചിപ്പിക്കുന്ന നപുംസകലിംഗ രൂപങ്ങളായി വിവർത്തനം ചെയ്തു.
  alternative: ചില വ്യാഖ്യാനങ്ങളിൽ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ‘ആർക്കുവേണ്ടി’, ‘അവനിൽ’ എന്നിങ്ങനെ ഗ്രഹിക്കാം.
  rationale: SBLGNT രൂപവിശകലനത്തിൽ οὗ ജനിറ്റീവ് നപുംസകലിംഗ ഏകവചനവും αὐτῷ ഡേറ്റീവ് നപുംസകലിംഗ ഏകവചനവുമാണ്. അതിനാൽ വ്യക്തിപരമോ ക്രിസ്തുവിനെ നേരിട്ട് സൂചിപ്പിക്കുന്നതോ ആയ അർഥം മുഖ്യവാചകത്തിൽ ഇറക്കുമതി ചെയ്യാതെ വ്യാകരണപരമായി സാധ്യതയേറിയ നപുംസക സൂചന നിലനിർത്തി.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘സ്ഥാനപതി’ ഔദ്യോഗിക പ്രതിനിധിത്വത്തിന്റെ രൂപകം നിലനിർത്തുന്നു. ഗ്രീക്കിലെ നപുംസകലിംഗ സൂചന മുഖ്യവാചകത്തിൽ സംരക്ഷിച്ചു; ആവർത്തനം ഒഴിവാക്കാതെ ആശയവ്യക്തതയ്ക്കായി രണ്ടാം വാക്യം സ്വാഭാവിക മലയാളക്രമത്തിൽ നൽകി.
