reference: Ephesians 4:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διὸ λέγει· Ἀναβὰς εἰς ὕψος ᾐχμαλώτευσεν αἰχμαλωσίαν, ⸀ἔδωκεν δόματα τοῖς ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/008.yaml
  text: Therefore it says[a], “Having ascended on high[b], he led captivity captive and gave gifts to men.”
translation:
  language: ml
  text: 'അതുകൊണ്ട് ഇങ്ങനെ പറയുന്നു: “ഉന്നതത്തിലേക്ക് കയറിയശേഷം, അവൻ ബന്ദികളെ ബന്ദികളാക്കി കൊണ്ടുപോയി[a]; മനുഷ്യർക്കു ദാനങ്ങൾ നൽകി[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തോട് കൂടുതൽ അടുത്ത്: “തടവിനെ തടവിലാക്കി കൊണ്ടുപോയി.” “ബന്ദികളെ ബന്ദികളായി കൊണ്ടുപോയി” എന്നും “ഒരു ബന്ദിസംഘത്തെ പിടിച്ചുകൊണ്ടുപോയി” എന്നും അർഥമാക്കാം. ഗ്രീക്കിൽ ഒരേ ധാതുകുടുംബത്തിൽപ്പെട്ട പദങ്ങൾ ഉപയോഗിച്ചുള്ള സജീവമായ പ്രയോഗമാണിത്; സങ്കീർത്തനം 68:18-ന്റെ പ്രതിധ്വനിയും ഇതിലുണ്ട്.'
    reason: lexical_alternative
  - marker: b
    text: “മനുഷ്യർ” ഇവിടെ പൊതുവായി മനുഷ്യരെയോ ആളുകളെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യത്തിലെ വാദവുമായി ഉദ്ധരണിയെ ബന്ധിപ്പിക്കുന്ന അനുമാനസൂചകമായ സംയോജകത്തിന്റെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: λέγει
  choice: തിരുവെഴുത്ത് പറയുന്നു
  rationale: ഗ്രീക്കിൽ കർത്താവ് വ്യക്തമല്ല; ഇത് തിരുവെഴുത്ത് ഉദ്ധരിക്കുന്ന പതിവുശൈലിയാണ്. മലയാളത്തിൽ ‘പറയുന്നു’ എന്നതിന് കർത്താവ് ആവശ്യമായതിനാൽ സന്ദർഭത്തിൽ സൂചിതമായ ‘തിരുവെഴുത്ത്’ ചേർത്തു.
- source_word: Ἀναβὰς εἰς ὕψος
  choice: അവൻ ഉന്നതത്തിലേക്ക് കയറിയപ്പോൾ
  rationale: ആരോഹണവും തുടർന്നുള്ള പ്രധാനക്രിയകളും തമ്മിലുള്ള ബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും സങ്കീർത്തനത്തിലെ ഉന്നതിയിലേക്കുള്ള കയറ്റത്തിന്റെ പ്രതിധ്വനി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ᾐχμαλώτευσεν αἰχμαλωσίαν
  choice: ബന്ദികളെ തടവിലാക്കി കൊണ്ടുപോയി
  rationale: ഗ്രീക്കിലെ ഒരേ ധാതുകുടുംബത്തിൽപ്പെട്ട ക്രിയയും കർമവും സൃഷ്ടിക്കുന്ന ഊന്നൽ മലയാളത്തിൽ കഴിയുന്നത്ര നിലനിർത്തുന്നു; അക്ഷരാർഥത്തിലുള്ള ‘തടവിനെ തടവിലാക്കി’ എന്ന അസ്വാഭാവിക പ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: ἔδωκεν δόματα
  choice: ദാനങ്ങൾ നൽകി
  rationale: നൽകിയ അനുഗ്രഹങ്ങളെയോ വരങ്ങളെയോ സൂചിപ്പിക്കുന്ന നേരിട്ടും ഗൗരവമുള്ളതുമായ മലയാളപ്രയോഗം.
- source_word: τοῖς ἀνθρώποις
  choice: മനുഷ്യർക്കു
  rationale: ἄνθρωποι ഇവിടെ പൊതുവായി മനുഷ്യരെയോ ആളുകളെയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ലിംഗപരമായി കൃത്യവും സ്വാഭാവികവുമായ രൂപം.
theological_decisions:
- issue: സങ്കീർത്തനം 68:18-ന്റെ പ്രതിധ്വനിയിലുള്ള ബന്ദിത്വപ്രയോഗം
  choice: ബന്ദികളെ തടവിലാക്കി കൊണ്ടുപോയി
  alternative: തടവിനെ തടവിലാക്കി കൊണ്ടുപോയി; അനേകം ബന്ദികളെ പിടിച്ചുകൊണ്ടുപോയി
  rationale: ഗ്രീക്കിലെ സജീവമായ cognate പ്രയോഗത്തിന്റെ ആവർത്തനവും സങ്കീർത്തനപ്രതിധ്വനിയും ഭാഗികമായി സൂക്ഷിക്കുന്നു; ബന്ദികൾ ആരാണെന്നോ ഈ വിജയത്തിന്റെ ദൈവശാസ്ത്രപരമായ അർഥം എന്തെന്നോ വിവർത്തനം മുൻകൂട്ടി നിശ്ചയിക്കുന്നില്ല.
- issue: λέγει എന്ന ക്രിയയുടെ വ്യക്തമല്ലാത്ത കർത്താവ്
  choice: തിരുവെഴുത്ത് പറയുന്നു
  alternative: അവൻ പറയുന്നു; അത് പറയുന്നു
  rationale: ഇത് ഒരു തിരുവെഴുത്ത്-ഉദ്ധരണി സൂത്രമാണെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നു. ‘അവൻ’ എന്ന് നൽകിയാൽ ദൈവത്തെ വ്യക്തമായ കർത്താവായി ചേർക്കും; ‘അത്’ മലയാളത്തിൽ അസ്വാഭാവികമാണ്.
- issue: τοῖς ἀνθρώποις എന്നതിന്റെ ലിംഗവ്യാപ്തി
  choice: മനുഷ്യർക്കു
  alternative: പുരുഷന്മാർക്ക്; ആളുകൾക്ക്
  rationale: ഗ്രീക്ക് ബഹുവചനം ഈ സന്ദർഭത്തിൽ പൊതുവായ മനുഷ്യസമൂഹത്തെ സൂചിപ്പിക്കാൻ കഴിയും. ‘മനുഷ്യർക്കു’ ആ വ്യാപ്തി സുതാര്യമായി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ തിരുവെഴുത്ത് ഉദ്ധരണിക്ക് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ഗ്രീക്കിലെ കർത്താവില്ലാത്ത citation formula മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘തിരുവെഴുത്ത്’ വ്യക്തമാക്കി. പ്രധാനവാചകത്തിലെ രണ്ടു അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും അനുബന്ധ കുറിപ്പുകളുമായി പൊരുത്തപ്പെടുന്നു.
