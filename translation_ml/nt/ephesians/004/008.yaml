  naturalness: പരിഷ്കരിച്ച പാഠം ആധുനിക മാനക മലയാളത്തിൽ സ്വാഭാവികവും ഉദ്ധരണിശൈലിക്ക് യോജിച്ച ഗൗരവമുള്ളതുമാണ്. ‘ബന്ദികളെ ബന്ദികളാക്കി കൊണ്ടുപോയി’ എന്ന ആവർത്തനം സാധാരണ ഗദ്യത്തിൽ അല്പം ചിഹ്നിതമാണെങ്കിലും, ഗ്രീക്കിലെ ഉദ്ദേശ്യപൂർവമായ ഊന്നലും സങ്കീർത്തനപ്രതിധ്വനിയും നിലനിർത്തുന്നതിനാൽ ഇവിടെ ഉചിതമാണ്.
