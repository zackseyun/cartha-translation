  to: 'അതുകൊണ്ട് ഇങ്ങനെ പറയുന്നു: “ഉന്നതത്തിലേക്ക് കയറിയശേഷം, അവൻ ബന്ദികളെ ബന്ദികളാക്കി കൊണ്ടുപോയി[a]; മനുഷ്യർക്കു ദാനങ്ങൾ നൽകി[b].”'
