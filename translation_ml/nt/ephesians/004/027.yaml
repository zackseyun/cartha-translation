  text: and do not give place to the devil[a].
translation:
  language: ml
  text: പിശാചിന് ഇടം കൊടുക്കുകയുമരുത്[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പിശാചിന് അവസരം കൊടുക്കുകയുമരുത്.” ഗ്രീക്കിൽ അക്ഷരാർഥം “പിശാചിന് ഇടം കൊടുക്കരുത്” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲ
  choice: കൊടുക്കുകയുമരുത്
  rationale: മുൻവാക്യത്തിലെ പ്രബോധനത്തോട് ഈ നിരോധനം ബന്ധിപ്പിക്കുന്ന തുടർച്ചാഭാവം ‘-യുമരുത്’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: δίδοτε
  choice: കൊടുക്കുക
  rationale: δίδωμι എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥമായ ‘കൊടുക്കുക’ നിലനിർത്തുന്നു; τόπον എന്നതിനോടൊപ്പം മലയാളത്തിലും സ്വാഭാവികമായ പ്രയോഗമാണിത്.
- source_word: τόπον
  choice: ഇടം
  rationale: ഗ്രീക്കിലെ അടിസ്ഥാനാർഥമായ ‘സ്ഥലം/ഇടം’ നേരിട്ട് സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ പ്രവർത്തിക്കാനുള്ള അവസരം അല്ലെങ്കിൽ സ്വാതന്ത്ര്യം എന്ന രൂപകാർഥവും ‘ഇടം കൊടുക്കുക’ എന്ന മലയാളപ്രയോഗത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: τῷ διαβόλῳ
  choice: പിശാചിന്
  rationale: ഇവിടെ ലേഖനത്തോടുകൂടിയ διάβολος വ്യക്തിപരമായ ദുഷ്ടവൈരിയെ സൂചിപ്പിക്കുന്നു; അതിനുള്ള നിലവാരമുള്ള മലയാള പദമാണ് ‘പിശാച്’.
theological_decisions:
- issue: διάβολος എന്നത് പൊതുനാമമായ ‘അപവാദി’ എന്നോ വ്യക്തിപരമായ ദുഷ്ടശക്തിയായ ‘പിശാച്’ എന്നോ വിവർത്തനം ചെയ്യണമോ
  choice: പിശാച്
  alternative: അപവാദി
  rationale: പൗലോസിന്റെ ഈ പ്രബോധനസന്ദർഭത്തിൽ പദം സാധാരണയായി വ്യക്തിപരമായ ദുഷ്ടവൈരിയെ സൂചിപ്പിക്കുന്നു. ‘പിശാച്’ എന്ന പരിഭാഷ ഈ സാധ്യതയേറിയ സൂചന വ്യക്തമാക്കുന്നു; വാക്യത്തിൽ ഇല്ലാത്ത കൂടുതൽ വിശദീകരണം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘ഇടം കൊടുക്കുക’ എന്ന സ്വാഭാവിക പ്രയോഗം മൂലപാഠത്തിന്റെ അക്ഷരാർഥവും സന്ദർഭത്തിലെ രൂപകാർഥവും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
