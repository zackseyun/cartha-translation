id: EPH.4.30
reference: Ephesians 4:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ μὴ λυπεῖτε τὸ πνεῦμα τὸ ἅγιον τοῦ θεοῦ, ἐν ᾧ ἐσφραγίσθητε εἰς ἡμέραν ἀπολυτρώσεως.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/030.yaml
  text: And do not grieve the Holy Spirit of God[a], in whom you were sealed for the day of redemption.
translation:
  language: ml
  text: ദൈവത്തിന്റെ പരിശുദ്ധാത്മാവിനെ ദുഃഖിപ്പിക്കരുത്; വീണ്ടെടുപ്പിന്റെ ദിവസത്തിനായി[a] ആ ആത്മാവിൽ നിങ്ങൾ മുദ്രയിടപ്പെട്ടിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വീണ്ടെടുപ്പിന്റെ ദിവസംവരെ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിൽ ‘വീണ്ടെടുപ്പിന്റെ ദിവസത്തിനായി’ (εἰς ἡμέραν ἀπολυτρώσεως) എന്നാണ്; ഈ പ്രയോഗത്തിന് ഭാവിയിലേക്കു നോക്കുന്ന കാലപരമായ അർഥവും ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπεῖτε
  choice: ദുഃഖിപ്പിക്കരുത്
  rationale: μή ചേർന്ന വർത്തമാനകാല ആജ്ഞാരൂപം നിരോധനത്തെ സൂചിപ്പിക്കുന്നു. ‘ദുഃഖിപ്പിക്കുക’ എന്നത് പരിശുദ്ധാത്മാവിനോടുള്ള വ്യക്തിപരവും ബന്ധപരവുമായ അർഥബലം നിലനിർത്തുന്നു.
- source_word: πνεῦμα τὸ ἅγιον τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ പരിശുദ്ധാത്മാവ്
  rationale: ഗ്രീക്കിലെ പൂർണമായ ഷഷ്ഠീവാചകപ്രയോഗം നിലനിർത്തുകയും മലയാളത്തിലെ പ്രചാരമുള്ള ആദരപൂർവമായ നാമരൂപം ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐν ᾧ
  choice: ആ ആത്മാവിൽ
  rationale: ἐν എന്നതിന്റെ ‘ൽ’ എന്ന സ്ഥല/ബന്ധസൂചക ഭാവം നിലനിർത്തുന്നു. ഗ്രീക്കിലെ നപുംസകലിംഗ വ്യാകരണരൂപം യാന്ത്രികമായി അനുകരിക്കാതെ, പരിശുദ്ധാത്മാവിലേക്കുള്ള വ്യക്തമായ പരാമർശം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐσφραγίσθητε
  choice: നിങ്ങൾ മുദ്രയിടപ്പെട്ടിരിക്കുന്നു
  rationale: കർമണിപ്രയോഗവും മുദ്രയുടെ രൂപകവും സംരക്ഷിക്കുന്നു; ഉടമസ്ഥത, ആധികാരികത, സംരക്ഷണം എന്നിവയിൽ ഏതെങ്കിലും ഒറ്റ ആശയം മാത്രം വിശദീകരിച്ച് അടിച്ചേൽപ്പിക്കുന്നില്ല.
- source_word: εἰς ἡμέραν ἀπολυτρώσεως
  choice: വീണ്ടെടുപ്പിന്റെ ദിവസത്തിനായി
  rationale: εἰς എന്നതിലെ ലക്ഷ്യോന്മുഖവും ഭാവിയിലേക്കു നോക്കുന്നതുമായ ഭാവം ‘ദിവസത്തിനായി’ എന്ന പ്രയോഗം നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ നിർദിഷ്ടമായ അന്തിമ വീണ്ടെടുപ്പിന്റെ ദിവസത്തെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: പരിശുദ്ധാത്മാവിലേക്കുള്ള വ്യക്തിപരമായ പരാമർശം
  choice: ‘ആ ആത്മാവിൽ’ എന്ന വ്യക്തമായ പരാമർശം
  alternative: ‘അതിൽ’
  rationale: πνεῦμα എന്ന പദത്തോടുള്ള വ്യാകരണസാമ്യംമൂലം ഗ്രീക്ക് സർവനാമം നപുംസകലിംഗമാണെങ്കിലും, ദുഃഖിപ്പിക്കപ്പെടാവുന്ന പരിശുദ്ധാത്മാവാണ് പരാമർശവിഷയം. ‘അതിൽ’ എന്നത് വ്യക്തിത്വരഹിതമായ ശക്തിയെന്ന തെറ്റിദ്ധാരണയ്ക്ക് ഇടയാക്കാം.
- issue: മുദ്രയിടലും വീണ്ടെടുപ്പിന്റെ ദിവസവും തമ്മിലുള്ള ബന്ധം
  choice: ‘വീണ്ടെടുപ്പിന്റെ ദിവസത്തിനായി’
  alternative: ‘വീണ്ടെടുപ്പിന്റെ ദിവസംവരെ’
  rationale: εἰς എന്നതിന്റെ ലക്ഷ്യോന്മുഖത സംരക്ഷിക്കുന്നു; വിശ്വാസസ്ഥിരതയെയോ കൂദാശാസംബന്ധമായ പ്രവർത്തനരീതിയെയോ കുറിച്ചുള്ള ഒരു പ്രത്യേക ദൈവശാസ്ത്രസംവിധാനം വാക്യത്തിൽ ചേർക്കുന്നില്ല. കാലപരമായ ‘വരെ’ എന്ന വായനയും അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മുദ്രയിടപ്പെട്ടിരിക്കുന്നു’ എന്ന രൂപം ബൈബിൾപരമായ രൂപകം വിശദീകരിച്ചു ചുരുക്കാതെ നിലനിർത്തുന്നു; അർഥവ്യക്തതയ്ക്കായി രണ്ടാം ഉപവാക്യത്തിൽ ‘ആ ആത്മാവിൽ’ എന്നു പറയുന്നു.
