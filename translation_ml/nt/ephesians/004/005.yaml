  text: one Lord[a], one faith, one baptism;
translation:
  language: ml
  text: ഒരേ കർത്താവ്, ഒരേ വിശ്വാസം[a], ഒരേ സ്നാനം;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വിശ്വാസം’ എന്നതിനുള്ള ഗ്രീക്ക് പദത്തിന് ‘വിശ്വസ്തത’ എന്നോ ‘ആശ്രയം’ എന്നോ അർത്ഥമാകാം; എന്നാൽ ഇവിടെ ഊന്നിപ്പറയുന്ന പൊതുവായ ഐക്യത്തിന് ‘വിശ്വാസം’ ഏറ്റവും യോജിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἷς / μία / ἓν
  choice: ഒരേ
  rationale: ലിംഗഭേദമുള്ള ഒരേ സംഖ്യാവിശേഷണത്തിന്റെ മൂന്നു രൂപങ്ങളാണിവ. ഐക്യത്തിനുള്ള ആവർത്തിച്ച ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്താൻ മൂന്നിടത്തും ‘ഒരേ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: κύριος
  choice: കർത്താവ്
  rationale: പൗലോസിന്റെ ഈ സന്ദർഭത്തിൽ ക്രിസ്തുവിനെ സൂചിപ്പിക്കുന്ന സ്ഥാനനാമമായി വരുന്ന κύριος-ന്റെ പ്രചാരമുള്ളതും മാന്യവുമായ മലയാളപരിഭാഷയാണ് ‘കർത്താവ്’.
- source_word: πίστις
  choice: വിശ്വാസം
  rationale: ഇവിടെ സഭയെ ഏകീകരിക്കുന്ന പൊതുവായ വിശ്വാസത്തെയോ വിശ്വസിക്കുന്ന പ്രതികരണത്തെയോ സൂചിപ്പിക്കാൻ ഏറ്റവും യോജിച്ച പദം. ‘വിശ്വസ്തത’, ‘ആശ്രയം’ എന്നീ അർത്ഥസാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: βάπτισμα
  choice: സ്നാനം
  rationale: ക്രൈസ്തവ പ്രവേശനകർമത്തെ സൂചിപ്പിക്കുന്ന βάπτισμα എന്ന പദത്തിന് മലയാള ബൈബിൾഭാഷയിലും പൊതുവായ ക്രൈസ്തവ ഉപയോഗത്തിലും പരിചിതമായ കൃത്യപദം; അതിന്റെ രീതി, ഫലപ്രാപ്തി എന്നിവ വ്യാഖ്യാനിച്ച് ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ‘കർത്താവ്’ എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: ക്രിസ്തുവിന്റെ സ്ഥാനനാമമായി ‘കർത്താവ്’ നിലനിർത്തി; എഫെസ്യർ 4:4–6-ലെ ഒഴുക്കിൽ ഇത് ഏറ്റവും സ്വാഭാവികമായി യേശുവിനെ സൂചിപ്പിക്കുന്നു.
  alternative: ദൈവത്തെ പൊതുവായി സൂചിപ്പിക്കുന്നത്
  rationale: ‘ഒരേ ആത്മാവ്’ (വ. 4), ‘ഒരേ കർത്താവ്’ (വ. 5), ‘എല്ലാവർക്കും ഒരേ ദൈവവും പിതാവും’ (വ. 6) എന്ന ത്രിഭാഗസന്ദർഭം പുത്രനിലേക്കുള്ള സൂചന ശക്തമാക്കുന്നു; എന്നാൽ പരിഭാഷ മൂലപാഠത്തേക്കാൾ വ്യക്തമായി പേര് ചേർക്കുന്നില്ല.
- issue: ‘ഒരേ സ്നാനം’ എന്നതിന്റെ അർത്ഥം
  choice: ‘ഒരേ സ്നാനം’ എന്ന് നിഷ്പക്ഷമായി പരിഭാഷപ്പെടുത്തി.
  alternative: പ്രത്യേകമായി കൂദാശാപരമായ ഊന്നൽ; അല്ലെങ്കിൽ പ്രധാനമായും രൂപകാത്മകമായ/ആത്മീയ സ്നാനം
  rationale: വാക്യം ഐക്യം പ്രഖ്യാപിക്കുന്നുവെങ്കിലും സ്നാനത്തിന്റെ രീതി, ഫലപ്രാപ്തി, കൂദാശാസ്വഭാവം തുടങ്ങിയ സഭാവിഭാഗപരമായ ചർച്ചകൾ സ്വയം തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ സമാന്തരഘടന. εἷς/μία/ἓν എന്ന ആവർത്തനം ‘ഒരേ’ എന്നതിലൂടെ നിലനിർത്തി; വാക്യത്തിന്റെ പട്ടികാസ്വഭാവം കാക്കാൻ അർദ്ധവിരാമവും സൂക്ഷിച്ചു.
