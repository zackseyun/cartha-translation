id: EPH.4.29
reference: Ephesians 4:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πᾶς λόγος σαπρὸς ἐκ τοῦ στόματος ὑμῶν μὴ ἐκπορευέσθω, ἀλλὰ εἴ τις ἀγαθὸς πρὸς οἰκοδομὴν τῆς χρείας, ἵνα δῷ χάριν τοῖς ἀκούουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/029.yaml
  text: Let no rotten word come out of your mouth[a], but only such as is good for building up according to the need[d][c][b], so that it may give grace to those who hear.
translation:
  language: ml
  text: നിങ്ങളുടെ വായിൽനിന്ന് ചീഞ്ഞ വാക്കൊന്നും പുറത്തുവരരുത്[a]; പകരം, ആവശ്യത്തിനനുസരിച്ച് പടുത്തുയർത്താൻ ഉപകരിക്കുന്ന നല്ല വാക്കു മാത്രമേ പുറത്തുവരാവൂ[b], അത് കേൾക്കുന്നവർക്ക് കൃപ നൽകേണ്ടതിന്[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘ദുഷിച്ച സംസാരമൊന്നും’ അല്ലെങ്കിൽ ‘അനാരോഗ്യകരമായ വാക്കൊന്നും.’ ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘ചീഞ്ഞ വാക്ക്’ എന്നാണ്.'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: ‘ആവശ്യം ആവശ്യപ്പെടുന്നതുപോലെ പടുത്തുയർത്താൻ ഉപകരിക്കുന്ന.’ ഗ്രീക്കിലെ ബന്ധം സംക്ഷിപ്തമായതിനാൽ ‘ആവശ്യത്തിനനുസരിച്ച്’ എന്നും ‘സന്ദർഭത്തിന് യോജിച്ചതുപോലെ’ എന്നും മനസ്സിലാക്കാം.'
    reason: lexical_alternative
  - marker: c
    text: 'അഥവാ: ‘അത് കേൾക്കുന്നവർക്ക് നന്മ ചെയ്യേണ്ടതിന്’ അല്ലെങ്കിൽ ‘പ്രയോജനം നൽകേണ്ടതിന്.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς λόγος σαπρὸς
  choice: ചീഞ്ഞ ഒരു വാക്കും
  rationale: നിഷേധത്തോടുകൂടിയ πᾶς എന്നതിന്റെ ‘ഒന്നും ... അരുത്’ എന്ന വിതരണാർഥം നിലനിർത്തുന്നു. σαπρός എന്നതിലെ ‘ചീഞ്ഞ’ എന്ന സജീവമായ രൂപകം സംരക്ഷിക്കുകയും λόγος ഇവിടെ സംസാരത്തിലെ ഉച്ചാരണത്തെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐκ τοῦ στόματος ὑμῶν μὴ ἐκπορευέσθω
  choice: നിങ്ങളുടെ വായിൽനിന്ന് ... പുറത്തുവരരുത്
  rationale: സംസാരം വായിൽനിന്ന് പുറപ്പെടുന്നു എന്ന മൂലഭാഷയിലെ ദേഹരൂപകം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; μή സഹിതമുള്ള ആജ്ഞാരൂപത്തിന്റെ നിരോധനബലവും വ്യക്തമാക്കുന്നു.
- source_word: ἀλλὰ εἴ τις ἀγαθὸς
  choice: പകരം ... നല്ല വാക്കു മാത്രമേ പുറത്തുവരാവൂ
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തവും അപൂർണ്ണവുമായ വിരുദ്ധഘടനയെ മലയാളത്തിൽ സ്വാഭാവികമാക്കുന്നു; മോശമായ വാക്കിന് പകരം നല്ല വാക്കു മാത്രം എന്ന നിയന്ത്രണം വ്യക്തമാക്കുന്നു.
- source_word: πρὸς οἰκοδομὴν τῆς χρείας
  choice: ആവശ്യത്തിനനുസരിച്ച് പടുത്തുയർത്താൻ ഉതകുന്ന
  rationale: οἰκοδομήയിലെ കെട്ടിപ്പടുക്കൽരൂപകം ‘പടുത്തുയർത്തുക’ എന്നതിലൂടെ സംരക്ഷിക്കുന്നു. τῆς χρείας എന്ന സംക്ഷിപ്തബന്ധത്തെ ‘ആവശ്യത്തിനനുസരിച്ച്’ എന്നു നൽകുന്നത് സന്ദർഭത്തിലെ യഥാർഥ ആവശ്യം മുൻനിർത്തുന്നു.
- source_word: ἵνα δῷ χάριν τοῖς ἀκούουσιν
  choice: അതു കേൾക്കുന്നവർക്ക് കൃപ പകരേണ്ടതിന്
  rationale: ἵναയുടെ ഉദ്ദേശ്യാർഥം നിലനിർത്തുന്നു. χάρις എന്ന പദത്തിലെ കൃപ, ദയാപൂർവമായ പ്രയോജനം എന്നീ അർഥസാധ്യതകളിൽ ‘കൃപ’ തിരഞ്ഞെടുക്കുന്നത് പൗലോസിന്റെ പദപ്രയോഗത്തിന്റെ ധാർമികവും ദൈവശാസ്ത്രപരവുമായ അനുരണനം ചുരുക്കാതെ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: ധാർമിക പ്രബോധനത്തിന്റെ പശ്ചാത്തലത്തിൽ χάριν എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: കൃപ
  alternative: നന്മ / പ്രയോജനം
  rationale: ഇവിടെ കേൾക്കുന്നവർക്ക് ഗുണം ചെയ്യുന്ന സംസാരമാണ് ഉദ്ദേശ്യം. എങ്കിലും ‘പ്രയോജനം’ എന്നു മാത്രം നൽകിയാൽ χάρις എന്ന പദത്തിന്റെ ബന്ധപരവും ദൈവശാസ്ത്രപരവുമായ അനുരണനം നഷ്ടപ്പെടാം. ‘കൃപ പകരുക’ എന്നത് അതിനെ നിലനിർത്തുന്നു; അതേസമയം വാക്യം പറയുന്നതിലും ശക്തമായ ഒരു പ്രത്യേക സിദ്ധാന്തവാദം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ പ്രബോധനശൈലി ഉപയോഗിച്ചു. ‘ചീഞ്ഞ വാക്ക്,’ ‘വായിൽനിന്ന് പുറത്തുവരുക,’ ‘പടുത്തുയർത്തുക’ എന്നീ മൂലഭാഷയിലെ രൂപകങ്ങൾ സാധ്യമായത്ര നിലനിർത്തി; ‘കൃപ’ എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ തുറന്നുവച്ചു.
