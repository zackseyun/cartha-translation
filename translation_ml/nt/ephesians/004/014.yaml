id: EPH.4.14
reference: Ephesians 4:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἵνα μηκέτι ὦμεν νήπιοι, κλυδωνιζόμενοι καὶ περιφερόμενοι παντὶ ἀνέμῳ τῆς διδασκαλίας ἐν τῇ κυβείᾳ τῶν ἀνθρώπων ἐν πανουργίᾳ πρὸς τὴν μεθοδείαν τῆς πλάνης,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/014.yaml
  text: so that we may no longer be children[a], tossed by waves and carried about by every wind of teaching, by human trickery, by craftiness in the scheming of error[c][b],
translation:
  language: ml
  text: ഇനി നാം ശിശുക്കളായിരിക്കാതിരിക്കാനും, തിരമാലകളാൽ ആടിയുലയപ്പെടുകയും ഉപദേശത്തിന്റെ ഓരോ കാറ്റിനാലും അങ്ങുമിങ്ങും കൊണ്ടുപോകപ്പെടുകയും ചെയ്യാതിരിക്കാനുമാണ്—മനുഷ്യരുടെ ചതിയാലും, വഴിതെറ്റലിന്റെ കുതന്ത്രത്തിലേക്കു നയിക്കുന്ന കപടകൗശലത്താലും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മനുഷ്യരുടെ ചതി’ എന്നു വിവർത്തനം ചെയ്ത പ്രയോഗത്തിന്റെ അക്ഷരാർഥചിത്രം ‘മനുഷ്യരുടെ പകിടകളി’ എന്നാണ്; ഇത് വഞ്ചനാപരമായ ചതിയെ സൂചിപ്പിക്കുന്നു. അവസാന പ്രയോഗം ‘വഴിതെറ്റലിന്റെ കുതന്ത്രത്തിലേക്ക്’ എന്നാണ് അക്ഷരാർഥത്തിൽ; ‘തെറ്റിന്റെ കുതന്ത്രത്തിലേക്ക്,’ ‘വഞ്ചനയുടെ കുതന്ത്രത്തിലേക്ക്,’ അല്ലെങ്കിൽ ‘വഞ്ചനയുടെ കുതന്ത്രത്തിൽ’ എന്നും മനസ്സിലാക്കാം.
    reason: κυβείαയുടെ പകിടകളി-രൂപകവും πλάνηയുടെ അർത്ഥവ്യാപ്തിയും πρὸς τὴν μεθοδείαν τῆς πλάνης എന്ന സങ്കീർണമായ പ്രയോഗത്തിന്റെ ബന്ധവും വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: ἵνα μηκέτι ὦμεν νήπιοι
  choice: ഇനി നാം ശിശുക്കളായിരിക്കാതെ ... ചെയ്യാതിരിക്കേണ്ടതിനാണ്
  rationale: ἵναയുടെ ഉദ്ദേശ്യ/ഫലഭാവവും μηκέτιയുടെ ‘ഇനി ... അല്ല’ എന്ന കാലസൂചനയും നിലനിർത്തുന്നു. νήπιοι ഇവിടെ ആത്മീയ അപക്വതയെ സൂചിപ്പിക്കുന്ന രൂപകമായതിനാൽ ‘ശിശുക്കൾ’ തെരഞ്ഞെടുത്തു.
- source_word: κλυδωνιζόμενοι
  choice: തിരമാലകളാൽ ആടിയുലയുകയും
  rationale: കടലിലെ തിരകളാൽ അസ്ഥിരമായി എറിയപ്പെടുന്ന ദൃശ്യരൂപം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: περιφερόμενοι παντὶ ἀνέμῳ τῆς διδασκαλίας
  choice: ഉപദേശത്തിന്റെ ഓരോ കാറ്റിനാലും അങ്ങുമിങ്ങും കൊണ്ടുപോകപ്പെടുകയും
  rationale: കർമണിപ്രയോഗവും കാറ്റിന്റെ രൂപകവും διδασκαλίαയുടെ പൊതുവായ ‘ഉപദേശം/പഠിപ്പിക്കൽ’ എന്ന അർത്ഥവും സംരക്ഷിക്കുന്നു.
- source_word: ἐν τῇ κυβείᾳ τῶν ἀνθρώπων
  choice: മനുഷ്യരുടെ ചതിയാൽ
  rationale: κυβείαയുടെ അക്ഷരാർഥമായ പകിടകളിയിൽ നിന്നുള്ള വഞ്ചന/ചതി എന്ന വ്യഞ്ജനാർഥം ലക്ഷ്യഭാഷയിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ἐν πανουργίᾳ
  choice: കൗശലത്താലും
  rationale: πανουργία ഇവിടെ നിഷ്കളങ്കമായ വൈദഗ്ധ്യമല്ല, വഞ്ചനാപരമായ കപടകൗശലമാണ്; സമീപത്തെ ‘ചതി’, ‘കുതന്ത്രം’ എന്നിവ അതിന്റെ നിഷേധാത്മകത വ്യക്തമാക്കുന്നു.
- source_word: πρὸς τὴν μεθοδείαν τῆς πλάνης
  choice: വഴിതെറ്റിക്കാനുള്ള കുതന്ത്രത്തിലേക്കു നയിക്കുന്ന
  rationale: πρός സൂചിപ്പിക്കുന്ന ദിശ/ലക്ഷ്യം ഉപേക്ഷിക്കാതെ, μεθοδείαയുടെ ആസൂത്രിത കുതന്ത്രവും πλάνηയുടെ ‘വഴിതെറ്റൽ/വഴിതെറ്റിക്കൽ’ എന്ന ഉദ്ദേശ്യസന്ദിഗ്ധതയും വായനയോഗ്യമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: διδασκαλίαയുടെ പരിഭാഷ
  choice: ഉപദേശം
  alternative: സിദ്ധാന്തം
  rationale: ഗ്രീക്ക് പദം ഔപചാരിക മതസിദ്ധാന്തങ്ങളിൽ മാത്രം ഒതുങ്ങുന്നില്ല. ‘ഉപദേശം’ പൊതുവായ പഠിപ്പിക്കലിനെയും ഇവിടെ കാണുന്ന അസ്ഥിരപ്പെടുത്തുന്ന നിർദേശങ്ങളെയും ഉൾക്കൊള്ളുന്നു.
- issue: πλάνηയുടെ പരിഭാഷ
  choice: വഴിതെറ്റിക്കൽ
  alternative: തെറ്റ്; വഞ്ചന
  rationale: πλάνηയ്ക്ക് തെറ്റ്, വ്യാമോഹം, വഞ്ചന, വഴിതെറ്റൽ എന്നീ അർത്ഥനിറങ്ങളുണ്ട്. ചുറ്റുമുള്ള κυβεία, πανουργία, μεθοδεία എന്നീ പദങ്ങൾ മനഃപൂർവമായ വഞ്ചനയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘വഴിതെറ്റിക്കൽ’ സന്ദർഭോചിതമാണ്; എന്നിരുന്നാലും പദത്തിന്റെ അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- issue: πρὸς τὴν μεθοδείαν എന്ന ബന്ധം
  choice: കുതന്ത്രത്തിലേക്കു നയിക്കുന്ന
  alternative: കുതന്ത്രത്തിൽ; കുതന്ത്രത്തിനായി
  rationale: πρός എന്നതിലെ ദിശ/ലക്ഷ്യഭാവം നിലനിർത്തുകയും കൗശലം വഴിതെറ്റിക്കുന്ന ആസൂത്രിത പദ്ധതിയിലേക്കു പ്രവർത്തിക്കുന്നു എന്ന ഗ്രീക്ക് വാക്യത്തിന്റെ കുരുക്കുള്ള ബന്ധം അമിതമായി തീർപ്പാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. കടൽ, കാറ്റ് എന്നീ തുടർച്ചയായ രൂപകങ്ങൾ നിലനിർത്തി. ദീർഘമായ ഗ്രീക്ക് വാക്യത്തിന്റെ ഗതി വ്യക്തമാക്കാൻ ഡാഷ് ഉപയോഗിച്ചു; മുഖ്യവാക്യത്തിലെ ആവർത്തിക്കുന്ന നിഷേധം മലയാളത്തിൽ വ്യക്തമായി പൂർത്തിയാക്കി.
