id: EPH.4.16
reference: Ephesians 4:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐξ οὗ πᾶν τὸ σῶμα συναρμολογούμενον καὶ συμβιβαζόμενον διὰ πάσης ἁφῆς τῆς ἐπιχορηγίας κατ’ ἐνέργειαν ἐν μέτρῳ ἑνὸς ἑκάστου μέρους τὴν αὔξησιν τοῦ σώματος ποιεῖται εἰς οἰκοδομὴν ἑαυτοῦ ἐν ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/016.yaml
  text: from whom the whole body[a], being joined together and held together through every supporting joint, according to the working in measure of each individual part[d][c][b], causes the growth of the body for building itself up in love.
translation:
  language: ml
  text: അവനിൽനിന്ന്, ശരീരം മുഴുവനും കൂട്ടിച്ചേർക്കപ്പെട്ടും പിന്തുണ നൽകുന്ന ഓരോ സന്ധിയിലൂടെയും ചേർത്തുനിർത്തപ്പെട്ടും, ഓരോ ഭാഗവും അതതിനുള്ള അളവിൽ പ്രവർത്തിക്കുന്നതനുസരിച്ച്, സ്നേഹത്തിൽ സ്വയം കെട്ടിപ്പടുക്കുന്നതിനായി ശരീരത്തിന്റെ വളർച്ച ഉണ്ടാക്കുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξ οὗ
  choice: അവനിൽനിന്ന്
  rationale: തൊട്ടുമുമ്പുള്ള വാക്യത്തിലെ ക്രിസ്തുവാണ് ബന്ധസർവനാമത്തിന്റെ പൂർവപദം; അതിനാൽ വ്യക്തിപരമായ ഉറവിടം വ്യക്തമാക്കുന്നു.
- source_word: πᾶν τὸ σῶμα
  choice: ശരീരം മുഴുവനും
  rationale: ഏകവചനത്തിലുള്ള സമൂഹരൂപകത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: συναρμολογούμενον καὶ συμβιβαζόμενον
  choice: കൂട്ടിയോജിപ്പിക്കപ്പെടുകയും ... ചേർത്തുനിർത്തപ്പെടുകയും
  rationale: ഭാഗങ്ങൾ ഒന്നായി ഘടിപ്പിക്കപ്പെടുന്നതും ഏകതയിൽ നിലനിർത്തപ്പെടുന്നതുമായ രണ്ടു ആശയങ്ങളും കർമണിപ്രയോഗത്തോടെ സംരക്ഷിക്കുന്നു.
- source_word: διὰ πάσης ἁφῆς τῆς ἐπιχορηγίας
  choice: പിന്തുണ നൽകുന്ന ഓരോ സന്ധിയിലൂടെയും
  rationale: ἁφήയിലെ ശരീരസംബന്ധമായ സമ്പർക്കം/സന്ധി എന്ന രൂപകവും ἐπιχορηγίαയിലെ ലഭ്യമാക്കൽ അല്ലെങ്കിൽ പിന്തുണ എന്ന ആശയവും വായനാസൗകര്യത്തോടെ ഒരുമിപ്പിക്കുന്നു.
- source_word: κατ’ ἐνέργειαν ἐν μέτρῳ ἑνὸς ἑκάστου μέρους
  choice: ഓരോരോ ഭാഗത്തിന്റെ അളവനുസരിച്ചുള്ള പ്രവർത്തനത്താൽ
  rationale: ഓരോ ഭാഗത്തിന്റെയും പ്രവർത്തനം അതതിനുള്ള അളവിനൊത്തതാണെന്ന ആശയം നിലനിർത്തുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘ശരിയായ’ എന്ന വിലയിരുത്തൽ ചേർക്കുന്നില്ല.
- source_word: τὴν αὔξησιν τοῦ σώματος ποιεῖται
  choice: അത് ശരീരത്തിന്റെ വളർച്ച വരുത്തുന്നു
  rationale: ശരീരം തന്നെയാണ് വളർച്ച വരുത്തുന്ന വ്യാകരണപരമായ കർത്താവ് എന്നത് സംരക്ഷിക്കുമ്പോൾ മലയാളത്തിൽ സ്വാഭാവികമായ കാരണപ്രയോഗം ഉപയോഗിക്കുന്നു.
- source_word: εἰς οἰκοδομὴν ἑαυτοῦ ἐν ἀγάπῃ
  choice: സ്നേഹത്തിൽ സ്വയം പണിയുന്നു
  rationale: കെട്ടിപ്പടുക്കൽ എന്ന പൗലോസിന്റെ രൂപകവും ἑαυτοῦ എന്ന ആത്മനിർദേശവും ചുരുക്കവും വ്യക്തവുമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: സഭയുടെ വളർച്ചയുടെ ഉറവിടവും പ്രവർത്തകത്വവും
  choice: ശരീരം ക്രിസ്തുവിൽനിന്ന് ഉത്ഭവിക്കുകയും ഓരോ ഭാഗത്തിന്റെയും പ്രവർത്തനത്തിലൂടെ സ്വന്തം വളർച്ച വരുത്തുകയും ചെയ്യുന്നു.
  alternative: വളർച്ചയുടെ പ്രവർത്തകത്വം ക്രിസ്തുവിനോ സന്ധികൾക്കോ മാത്രം നൽകി വായിക്കുക.
  rationale: സന്ദർഭം ക്രിസ്തുവിനെ ഉറവിടമായി കാണിക്കുമ്പോൾ, വാക്യത്തിന്റെ വ്യാകരണം മുഴുവൻ ശരീരത്തെ വളർച്ച വരുത്തുന്ന കർത്താവായി അവതരിപ്പിക്കുന്നു; പരിഭാഷ രണ്ടും നിലനിർത്തുന്നു.
- issue: ἁφῆς τῆς ἐπιχορηγίας എന്ന ശരീരരൂപകം
  choice: പിന്തുണ നൽകുന്ന ഓരോ സന്ധി
  alternative: വിതരണം ചെയ്യുന്ന ബന്ധം; പിന്തുണ നൽകുന്ന ബന്ധനി
  rationale: ശരീരത്തിന്റെ ഏകോപനവും ലഭ്യമാക്കുന്ന പിന്തുണയും ഒരുമിച്ച് സൂചിപ്പിക്കുമ്പോൾ ഗ്രീക്ക് പദത്തെ അതിരുകടന്ന ശരീരശാസ്ത്ര കൃത്യതയോടെ നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. നീണ്ട ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി രണ്ടു മലയാളവാക്യങ്ങളാക്കി; ശരീരരൂപകവും കർമണി പങ്കാളിത്തങ്ങളും ദൈവശാസ്ത്രപരമായ പ്രവർത്തകത്വവും സംരക്ഷിച്ചു.
