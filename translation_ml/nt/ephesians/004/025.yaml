  text: Διὸ ἀποθέμενοι τὸ ψεῦδος λαλεῖτε ἀλήθειαν ἕκαστος μετὰ τοῦ πλησίον αὐτοῦ, ὅτι ἐσμὲν ἀλλήλων μέλη.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/025.yaml
  text: Therefore[a], having put away falsehood, let each one speak truth with his neighbor, because we are members of one another.
translation:
  language: ml
  text: അതുകൊണ്ട്, അസത്യം ഉപേക്ഷിച്ച്[a], ഓരോരുത്തനും തന്റെ അയൽക്കാരനോടു സത്യം സംസാരിക്കട്ടെ; കാരണം നാം പരസ്പരം അവയവങ്ങളാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആ കള്ളം ഉപേക്ഷിച്ച്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: അതുകൊണ്ട്
  rationale: മുൻപുള്ള പ്രബോധനത്തിൽനിന്നുള്ള നിഗമനം സൂചിപ്പിക്കുന്ന ബന്ധപദത്തിന്റെ യുക്തിബന്ധം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἀποθέμενοι
  choice: ഉപേക്ഷിച്ചിട്ട്
  rationale: പ്രധാന കല്പനയ്ക്കു മുൻപുള്ള നിർണായകമായ വിട്ടുകളയലിനെ സൂചിപ്പിക്കുന്ന aorist participle-ന്റെ attendant circumstance ഭാവം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὸ ψεῦδος
  choice: വ്യാജം
  rationale: ഒരു പ്രത്യേക കള്ളത്തെക്കാൾ അസത്യത്തിന്റെയും വഞ്ചനയുടെയും പൊതുവായ ധാർമിക വിഭാഗം ഇവിടെ ഉദ്ദേശിക്കുന്നതായി സന്ദർഭം സൂചിപ്പിക്കുന്നു; നിർദ്ദിഷ്ടതയുള്ള മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: λαλεῖτε ἀλήθειαν
  choice: സത്യം സംസാരിക്കട്ടെ
  rationale: വർത്തമാനകാല കല്പനയുടെ തുടർച്ചയായ ധാർമിക ബാധ്യതയും ‘വ്യാജം—സത്യം’ എന്ന വിരുദ്ധതയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἕκαστος μετὰ τοῦ πλησίον αὐτοῦ
  choice: ഓരോരുത്തനും തന്റെ അയൽക്കാരനോടു
  rationale: വിതരണാത്മക ഏകവചനവും വ്യക്തിഗത ബാധ്യതയും സൂക്ഷിക്കുന്നു. ‘അയൽക്കാരൻ’ എന്നത് πλησίον-ന്റെ സാമൂഹിക-ധാർമിക അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὅτι
  choice: കാരണം
  rationale: കല്പനയ്ക്കുള്ള അടിസ്ഥാനകാരണം അവതരിപ്പിക്കുന്ന causal force വ്യക്തമായി നൽകുന്നു.
- source_word: ἐσμὲν ἀλλήλων μέλη
  choice: നാം പരസ്പരം അവയവങ്ങളാണ്
  rationale: μέλη എന്ന ശരീരരൂപകത്തെ ‘അവയവങ്ങൾ’ വഴി നേരിട്ട് സംരക്ഷിക്കുകയും സഭയിലെ പരസ്പരാശ്രിതത്വം അമിതവ്യാഖ്യാനം കൂടാതെ അറിയിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ധാർമിക പ്രബോധനത്തിലെ വ്യാകരണപരമായി പുല്ലിംഗമായ വിതരണഭാഷ
  choice: ‘ഓരോരുത്തനും തന്റെ അയൽക്കാരനോടു’ എന്ന പ്രതിനിധാന ഏകവചനം നിലനിർത്തി
  alternative: ‘ഓരോ വ്യക്തിയും തന്റെ സമീപവാസിയോടു’ എന്ന ലിംഗനിരപേക്ഷ രൂപം
  rationale: ഗ്രീക്കിലെ ἕκαστος ... αὐτοῦ എന്ന ഏകവചന ഘടനയെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു; ഇതിന്റെ അർഥം മുഴുവൻ സഭയെയും ഉൾക്കൊള്ളുന്നതാണ്.
- issue: ψεῦδος എന്നതിന്റെ വ്യാപ്തി
  choice: ‘വ്യാജം’
  alternative: ‘ആ വ്യാജം’ അഥവാ ‘കള്ളം’
  rationale: സമീപസന്ദർഭം പൊതുവായ വഞ്ചനാപരമായ സംസാരത്തെയും സത്യസംസാരത്തെയും തമ്മിൽ വിരുദ്ധമായി നിർത്തുന്നു. എങ്കിലും articular singular മൂലം ‘ആ വ്യാജം’ എന്ന വായന സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ അത് നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ പ്രബോധനശൈലി. ‘പരസ്പരം അവയവങ്ങൾ’ എന്ന അല്പം അസാധാരണമായ പ്രയോഗം ഗ്രീക്കിലെ ശരീരരൂപകവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും സംരക്ഷിക്കാൻ ഉദ്ദേശപൂർവം നിലനിർത്തിയിരിക്കുന്നു.
