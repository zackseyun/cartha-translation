source:
  edition: SBLGNT
  text: πρὸς τὸν καταρτισμὸν τῶν ἁγίων εἰς ἔργον διακονίας, εἰς οἰκοδομὴν τοῦ σώματος τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/012.yaml
  text: for the equipping of the saints for the work of ministry[a], for the building up of the body of Messiah[c][b],
translation:
  language: ml
  text: വിശുദ്ധരെ ശുശ്രൂഷയുടെ വേലയ്ക്കായി സജ്ജരാക്കുന്നതിനായി[a], മശീഹയുടെ[b] ശരീരത്തെ കെട്ടിപ്പടുക്കുന്നതിനായി[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സേവനത്തിന്റെ വേലയ്ക്കായി’ എന്നും വിവർത്തനം ചെയ്യാം. διακονία എന്ന ഗ്രീക്കുപദത്തിന് ‘സേവനം’ എന്നും ‘ശുശ്രൂഷ’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: ‘ക്രിസ്തുവിന്റെ’ എന്നും വിവർത്തനം ചെയ്യാം. Χριστός എന്ന ഗ്രീക്ക് സ്ഥാനപ്പേരിന്റെ അർഥം വ്യക്തമാക്കാൻ ഇവിടെ ‘മശീഹ’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: alternative_reading
  - marker: c
    text: 'ഈ ഗ്രീക്ക് വാക്യഘടനയെ മൂന്ന് സമാന്തര ഉദ്ദേശ്യങ്ങളായും മനസ്സിലാക്കാം: ‘വിശുദ്ധരെ സജ്ജരാക്കുന്നതിനായി, ശുശ്രൂഷയുടെ വേലയ്ക്കായി, മശീഹയുടെ ശരീരത്തെ കെട്ടിപ്പടുക്കുന്നതിനായി.’'
    reason: alternative_reading
lexical_decisions:
- source_word: πρὸς τὸν καταρτισμὸν
  choice: സജ്ജരാക്കുന്നതിനായി
  rationale: καταρτισμός എന്നത് ഒരാളെ ഒരു ദൗത്യത്തിന് യോഗ്യനും ഒരുക്കമുള്ളവനുമാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘സജ്ജരാക്കുക’ ആ ആശയം സ്വാഭാവികവും വ്യക്തവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ‘പൂർണരാക്കുക’ എന്നത് ഇവിടെ ഉദ്ദേശിക്കാത്ത പാപരഹിതത്വമോ സമ്പൂർണതയോ സൂചിപ്പിക്കാം.
- source_word: τῶν ἁγίων
  choice: വിശുദ്ധരെ
  rationale: ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ട വിശ്വാസികളെ സൂചിപ്പിക്കുന്ന പൗലോസിന്റെ പതിവുപദമാണ് ἅγιοι. ‘വിശുദ്ധർ’ സ്ഥാപിതമായ ബൈബിൾപദം നിലനിർത്തുന്നു; ഇവിടെ പിന്നീട് ഔദ്യോഗികമായി വിശുദ്ധരായി പ്രഖ്യാപിക്കപ്പെട്ട വ്യക്തികൾ എന്ന അർഥമല്ല.
- source_word: εἰς ἔργον διακονίας
  choice: ശുശ്രൂഷയുടെ വേലയ്ക്കായി
  rationale: διακονία സേവനത്തെയും ശുശ്രൂഷയെയും സൂചിപ്പിക്കാം. സഭാസന്ദർഭത്തിൽ ‘ശുശ്രൂഷ’ യോജിച്ചതാണ്; അത് പുരോഹിതരുടെയോ ഔദ്യോഗിക ശുശ്രൂഷകരുടെയോ പ്രവർത്തനത്തിൽ മാത്രം ഒതുങ്ങുന്നില്ല. ഏകവചനമായ ἔργον ‘വേല’ എന്നു പ്രതിഫലിപ്പിച്ചു.
- source_word: εἰς οἰκοδομὴν
  choice: പണിതുയർത്തുന്നതിനായി
  rationale: οἰκοδομή ഇവിടെ സമൂഹത്തെ ശക്തിപ്പെടുത്തുന്നതിന്റെ കെട്ടിടരൂപകമാണ്. ‘പണിതുയർത്തുക’ ആ രൂപകം വ്യക്തമാക്കുകയും സ്വാഭാവികമായ മലയാളം നൽകുകയും ചെയ്യുന്നു.
- source_word: τοῦ σώματος
  choice: ശരീരം
  rationale: σῶμα എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘ശരീരം’ നിലനിർത്തുന്നു; ഇവിടെ അത് വിശ്വാസിസമൂഹത്തെ സൂചിപ്പിക്കുന്ന പൗലോസിന്റെ രൂപകമാണ്.
- source_word: τοῦ Χριστοῦ
  choice: മശീഹയുടെ
  rationale: Χριστός ഇവിടെ ഒരു സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നു. അതിന്റെ അഭിഷിക്തരാജാവെന്ന സ്ഥാനപരമായ അർഥം നിലനിർത്താൻ ‘മശീഹ’ ഉപയോഗിച്ചു; മലയാള ക്രൈസ്തവ പ്രയോഗത്തിൽ പരിചിതമായ ‘ക്രിസ്തു’ അടിക്കുറിപ്പിൽ പകരമായി നൽകി.
theological_decisions:
- issue: πρὸς ... εἰς ... εἰς എന്ന മൂന്ന് ഉദ്ദേശ്യവാക്യങ്ങളുടെ പരസ്പരബന്ധം
  choice: 'മൂന്ന് ഉദ്ദേശ്യഘടകങ്ങളും ഒരേ നിരയിൽ വച്ച് ഗ്രീക്ക് ഘടനയുടെ തുറന്ന സ്വഭാവം നിലനിർത്തി: ‘സജ്ജരാക്കുന്നതിനായി, ... വേലയ്ക്കായി, ... പണിതുയർത്തുന്നതിനായി.’'
  alternative: ‘വിശുദ്ധരെ ശുശ്രൂഷയുടെ വേലയ്ക്കായി സജ്ജരാക്കുന്നതിനും അതുവഴി മശീഹയുടെ ശരീരം പണിതുയർത്തുന്നതിനും’ എന്ന പുരോഗമനപരമായ വായന.
  rationale: ഗ്രീക്ക് ഘടനയെ മൂന്ന് സമാന്തര ലക്ഷ്യങ്ങളായോ, വിശുദ്ധരെ സജ്ജരാക്കൽ → അവരുടെ ശുശ്രൂഷ → ശരീരത്തിന്റെ വളർച്ച എന്ന പുരോഗതിയായോ മനസ്സിലാക്കാം. പ്രധാനവാചകം ബന്ധം നിർബന്ധമായി തീർപ്പാക്കാതെ ഘടന നിലനിർത്തുന്നു; പകരവായന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘സജ്ജരാക്കുക’, ‘വേല’, ‘പണിതുയർത്തുക’ എന്നീ സുതാര്യമായ പദങ്ങൾ ഉപയോഗിച്ചു. വാക്യം 4:11-ൽ ആരംഭിക്കുന്ന വ്യാകരണഘടനയുടെ തുടർച്ചയായതിനാൽ അവസാനത്തിൽ പൂർണവിരാമത്തിനു പകരം കോമ നിലനിർത്തി.
