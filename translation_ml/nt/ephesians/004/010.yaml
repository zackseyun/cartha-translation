source:
  edition: SBLGNT
  text: ὁ καταβὰς αὐτός ἐστιν καὶ ὁ ἀναβὰς ὑπεράνω πάντων τῶν οὐρανῶν, ἵνα πληρώσῃ τὰ πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/010.yaml
  text: The one who descended is himself also the one who ascended far above all the heavens[b][a], so that he might fill all things.
translation:
  language: ml
  text: ഇറങ്ങിവന്നവൻ തന്നെയാണ് എല്ലാ ആകാശങ്ങൾക്കും വളരെ മീതെ കയറിപ്പോയവനും, സകലവും നിറയ്ക്കേണ്ടതിന്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സകലവും പൂർത്തിയാക്കേണ്ടതിന്.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് ക്രിയയ്ക്ക് ചില സന്ദർഭങ്ങളിൽ “പൂർത്തിയാക്കുക” എന്നും അർഥമാകാം; എന്നാൽ ഈ സന്ദർഭത്തിൽ “നിറയ്ക്കുക” എന്നതാണ് കൂടുതൽ യോജിച്ചത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ καταβὰς
  choice: ഇറങ്ങിവന്നവൻ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ ഭൂതകാല കൃദന്തരൂപം വ്യക്തിയെ സൂചിപ്പിക്കുന്നതിനാൽ, സ്വാഭാവികമായ മലയാളത്തിൽ ബന്ധവാക്യസമാനമായ ഈ രൂപം ഉപയോഗിച്ചു.
- source_word: αὐτός ἐστιν καὶ
  choice: തന്നെയാണ് ... -വനും
  rationale: ഇറങ്ങിയവനും കയറിയവനും ഒരേ വ്യക്തിയാണെന്ന αὐτός എന്ന പദത്തിന്റെ ഊന്നൽ ‘തന്നെയാണ്’ നിലനിർത്തുന്നു; καί-യുടെ ബന്ധവും ചേർത്ത ഘടനയിൽ പ്രകടമാകുന്നു.
- source_word: ὁ ἀναβὰς
  choice: കയറിപ്പോയവൻ
  rationale: ὁ καταβὰς എന്നതിന് സമാന്തരമായ വ്യക്തിസൂചക കൃദന്തരൂപം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകി.
- source_word: ὑπεράνω πάντων τῶν οὐρανῶν
  choice: സകല ആകാശങ്ങൾക്കും അത്യുന്നതത്തിലേക്ക്
  rationale: ὑπεράνω എന്നതിലെ വളരെ മുകളിലുള്ള സ്ഥാനം/മഹത്വം ‘അത്യുന്നതത്തിലേക്ക്’ പ്രകടമാക്കുന്നു; οὐρανῶν എന്ന ബഹുവചനം ‘ആകാശങ്ങൾ’ എന്നു നിലനിർത്തി.
- source_word: ἵνα
  choice: '... വേണ്ടതിനായിരുന്നു'
  rationale: ἵνα സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: πληρώσῃ
  choice: നിറയ്ക്കേണ്ടതിനായിരുന്നു
  rationale: സന്ദർഭത്തിൽ ‘നിറയ്ക്കുക’ എന്ന അർഥമാണ് മുൻഗണന; എന്നാൽ ‘നിവർത്തിക്കുക’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: τὰ πάντα
  choice: സകലവും
  rationale: ഗ്രീക്കിലെ വ്യാപകവും മനപ്പൂർവം പരിധിനിർണയം ചെയ്യാത്തതുമായ അർഥം നിലനിർത്തുന്നു; അതിനെ ആളുകളിലേക്കോ പ്രപഞ്ചത്തിലേക്കോ മാത്രം ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: ഇറങ്ങിയവന്റെയും കയറിയവന്റെയും വ്യക്തിത്വം
  choice: ഇരുവരും ഒരേ വ്യക്തിയാണെന്ന ഊന്നൽ ‘തന്നെയാണ്’ എന്നതിലൂടെ നിലനിർത്തി.
  alternative: ഏകത്വത്തിന് പ്രത്യേക ഊന്നൽ നൽകാതെ സംഭവങ്ങളുടെ ക്രമം മാത്രം പറയുക.
  rationale: αὐτός എന്ന ഊന്നൽസർവനാമവും ആവർത്തിക്കുന്ന ആർട്ടിക്കിളോടുകൂടിയ കൃദന്തരൂപങ്ങളും ഒരേ വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്; വിവർത്തനം പാഠത്തിനപ്പുറം വിശദീകരണം ചേർക്കാതെ അത് പ്രകടമാക്കുന്നു.
- issue: τὰ πάντα എന്നതിന്റെ വ്യാപ്തി
  choice: സകലവും
  alternative: എല്ലാ മനുഷ്യരും; പ്രപഞ്ചം മുഴുവനും
  rationale: പ്രയോഗം വിശാലമാണ്. ഒരു പ്രത്യേക വിഭാഗത്തിലേക്ക് അതിനെ ചുരുക്കാതെ മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തിയും തുറന്ന നിലയും സംരക്ഷിച്ചു.
- issue: πληρόω എന്ന ക്രിയയുടെ അർഥം
  choice: നിറയ്ക്കുക
  alternative: നിവർത്തിക്കുക
  rationale: സമീപസന്ദർഭത്തിൽ ‘നിറയ്ക്കുക’ കൂടുതൽ യോജിക്കുന്നു; എങ്കിലും ക്രിയയുടെ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകി, യഥാർഥമായ അർഥസാധ്യത മറച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ആകാശങ്ങൾ’ എന്ന ബഹുവചനം ഗ്രീക്ക് രൂപം നിലനിർത്തുന്നു. നീണ്ട ഗ്രീക്ക് വാക്യത്തിന്റെ ഊന്നലും ഉദ്ദേശ്യബന്ധവും മലയാളത്തിൽ വായനാസൗകര്യത്തോടെ സംരക്ഷിച്ചു.
