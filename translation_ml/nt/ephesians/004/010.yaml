  to: ഇറങ്ങിവന്നവൻ തന്നെയാണ് എല്ലാ ആകാശങ്ങൾക്കും വളരെ മീതെ കയറിപ്പോയവനും, സകലവും നിറയ്ക്കേണ്ടതിന്.[a]
  rationale: The spatial phrase has been corrected to express ascent far above all the heavens, while retaining the plural ‘heavens.’ The purpose clause now directly modifies the ascending one and preserves the Greek’s purposive force. The alternative lexical footnote has been retained with more natural Malayalam wording.
