id: EPH.4.32
reference: Ephesians 4:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀γίνεσθε εἰς ἀλλήλους χρηστοί, εὔσπλαγχνοι, χαριζόμενοι ἑαυτοῖς καθὼς καὶ ὁ θεὸς ἐν Χριστῷ ἐχαρίσατο ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/032.yaml
  text: And be kind to one another[a], tenderhearted, forgiving one another[b], just as God in Messiah forgave you.
translation:
  language: ml
  text: പരസ്പരം ദയയുള്ളവരും മനസ്സലിവുള്ളവരും ആയിരിക്കുക. മശീഹയിൽ[a] ദൈവം നിങ്ങളോടു ക്ഷമിച്ചതുപോലെ നിങ്ങളും പരസ്പരം ക്ഷമിക്കുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ക്രിസ്തുവിൽ.’
    reason: Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ പരമ്പരാഗത മലയാള രൂപം.
lexical_decisions:
- source_word: γίνεσθε
  choice: ആയിരിക്കുക
  rationale: വർത്തമാനകാല ആജ്ഞയുടെ തുടർച്ചയായ ധാർമിക ആഹ്വാനം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: εἰς ἀλλήλους
  choice: പരസ്പരം
  rationale: ബന്ധത്തിന്റെ പരസ്പരദിശ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി വ്യക്തമാക്കുന്നു.
- source_word: χρηστοί
  choice: ദയയുള്ളവർ
  rationale: ഈ പരസ്പരബന്ധപരമായ സന്ദർഭത്തിൽ നന്മയും കരുണാപൂർവമായ പെരുമാറ്റവും സൂചിപ്പിക്കുന്നു.
- source_word: εὔσπλαγχνοι
  choice: മനസ്സലിവുള്ളവർ
  rationale: ഹൃദയത്തിൽനിന്നുള്ള ആർദ്രകരുണയെ സൂചിപ്പിക്കുകയും χρηστοί എന്ന പദവുമായി അർത്ഥവ്യത്യാസം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: χαριζόμενοι ἑαυτοῖς
  choice: നിങ്ങളും പരസ്പരം ക്ഷമിക്കുക
  rationale: ഇവിടെ χαρίζομαι കുറ്റം ക്ഷമിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ബഹുവചനത്തിലെ ἑαυτοῖς പരസ്പര അർത്ഥത്തിലാണ്. മലയാളത്തിലെ വ്യക്തതയ്ക്കായി കർത്താവ് വീണ്ടും വ്യക്തമാക്കിയിരിക്കുന്നു.
- source_word: καθὼς καὶ
  choice: ക്ഷമിച്ചതുപോലെ ... നിങ്ങളും
  rationale: താരതമ്യവും καί നൽകുന്ന അനുരൂപതയുടെ ഊന്നലും സ്വാഭാവികമായ മലയാള വാക്യക്രമത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἐν Χριστῷ
  choice: മശീഹയിൽ
  rationale: ἐν എന്ന ബന്ധസൂചകത്തിന്റെ തുറന്ന അർത്ഥവും Χριστός എന്ന പദത്തിന്റെ സ്ഥാനപ്പേരായ സ്വഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: ἐχαρίσατο ὑμῖν
  choice: നിങ്ങളോടു ക്ഷമിച്ചു
  rationale: ദൈവത്തിന്റെ പൂർത്തിയായ ക്ഷമാപ്രവൃത്തിയെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: Χριστῷ എന്ന സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: മശീഹയിൽ
  alternative: ക്രിസ്തുവിൽ
  rationale: Χριστός ഇവിടെ സ്ഥാനപ്പേരായതിനാൽ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി; പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ നൽകി.
- issue: ἐν Χριστῷ എന്ന പ്രയോഗത്തിലെ ബന്ധം
  choice: മശീഹയിൽ
  alternative: മശീഹ മുഖാന്തരം
  rationale: ‘മുഖാന്തരം’ എന്ന് കാരണോപാധിയായി വ്യാഖ്യാനിച്ച് പരിമിതപ്പെടുത്താതെ ഗ്രീക്കിലെ ἐν എന്നതിന്റെ വിശാലമായ ബന്ധാർഥം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ പ്രബോധനശൈലി. ഗ്രീക്കിലെ ദീർഘവാക്യം വായനാസൗകര്യത്തിനായി രണ്ടു വാക്യങ്ങളാക്കിയെങ്കിലും ആശയബന്ധം നിലനിർത്തിയിരിക്കുന്നു.
