  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πᾶσα πικρία καὶ θυμὸς καὶ ὀργὴ καὶ κραυγὴ καὶ βλασφημία ἀρθήτω ἀφ’ ὑμῶν σὺν πάσῃ κακίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/031.yaml
  text: Let all bitterness and wrath and anger and clamor and slander be taken away from you[a], along with all malice.
translation:
  language: ml
  text: എല്ലാ കയ്പ്പും ക്രോധവും കോപവും ആക്രോശവും ദൂഷണവും[a], സകല ദുഷ്ടമനോഭാവത്തോടും കൂടി, നിങ്ങളിൽനിന്ന് നീക്കപ്പെടട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നിന്ദാപരമായ സംസാരം”; പരമ്പരാഗതമായി “ദൈവനിന്ദ.” ഈ സന്ദർഭത്തിൽ ഗ്രീക്ക് പദം മറ്റുള്ളവർക്കെതിരായ ഹാനികരമായ സംസാരത്തെയാണ് സാധ്യതയേറെ സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα πικρία
  choice: എല്ലാ കൈപ്പും
  rationale: πᾶσαയുടെ സമഗ്രതയും πικρία സൂചിപ്പിക്കുന്ന ഉള്ളിലെ കയ്പേറിയ വിരോധമനോഭാവവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: θυμός
  choice: ക്രോധം
  rationale: പെട്ടെന്ന് ജ്വലിക്കുന്ന തീവ്രവികാരത്തെ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള ὀργήയിൽനിന്ന് വ്യത്യാസപ്പെടുത്താൻ അനുയോജ്യം.
- source_word: ὀργή
  choice: കോപം
  rationale: കൂടുതൽ പൊതുവായോ നിലനിൽക്കുന്നതായോ ഉള്ള anger എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും θυμόςയിൽനിന്നുള്ള വ്യത്യാസം കാക്കുകയും ചെയ്യുന്നു.
- source_word: κραυγή
  choice: ആക്രോശം
  rationale: വെറും ഉച്ചത്തിലുള്ള ശബ്ദമല്ല, ശത്രുതാപൂർവമായ നിലവിളിയോ ഒച്ചവയ്ക്കലോ എന്ന സന്ദർഭാർഥം നൽകുന്നു.
- source_word: βλασφημία
  choice: ദൂഷണം
  rationale: മനുഷ്യബന്ധങ്ങളെ തകർക്കുന്ന നിന്ദാപരമോ ഹാനികരമോ ആയ സംസാരമാണ് ഈ സന്ദർഭത്തിൽ പ്രധാനമായും സൂചിപ്പിക്കുന്നത്; ദൈവനിന്ദ എന്ന അർഥസാധ്യത കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἀρθήτω ἀφ’ ὑμῶν
  choice: നിങ്ങളിൽനിന്ന് നീക്കപ്പെടട്ടെ
  rationale: അയോറിസ്റ്റ് പാസീവ് ആജ്ഞയുടെ നീക്കം ചെയ്യപ്പെടുക എന്ന ബലവും ἀφ’ ὑμῶν എന്ന പ്രയോഗവും ഔപചാരികവും വ്യക്തവുമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: σὺν πάσῃ κακίᾳ
  choice: സകല ദുഷ്ടമനോഭാവത്തോടുംകൂടെ
  rationale: σύν എന്ന സഹവർത്തിത്വവും πάσῃയുടെ സമഗ്രതയും കാക്കുന്നു; κακίαയെ പൊതുവായ തിന്മയെന്നതിലുപരി ദ്രോഹമോ ദുഷ്ടലക്ഷ്യമോ നിറഞ്ഞ മനോഭാവമായി സന്ദർഭോചിതമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: βλασφημίαയുടെ സന്ദർഭാർഥം
  choice: മനുഷ്യർക്കെതിരായ ഹാനികരമായ സംസാരത്തെ സൂചിപ്പിക്കുന്ന “ദൂഷണം”
  alternative: “ദൈവനിന്ദ” അല്ലെങ്കിൽ കൂടുതൽ വിശാലമായ “നിന്ദാപരമായ സംസാരം”
  rationale: ചുറ്റുമുള്ള ദോഷപ്പട്ടിക മനുഷ്യബന്ധങ്ങളിലെ നശിപ്പിക്കുന്ന വികാരങ്ങളെയും സംസാരത്തെയും കേന്ദ്രീകരിക്കുന്നു. എങ്കിലും ഗ്രീക്ക് പദത്തിന്റെ വിശാലമായ അർഥപരിധി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ദോഷപ്പട്ടികയിലെ സമാന്തര ഘടനയും പാസീവ് ആജ്ഞയുടെ ഭാവവും നിലനിർത്തി; അതേസമയം θυμός/ὀργή വ്യത്യാസം ക്രോധം/കോപം എന്ന സ്വാഭാവിക പദജോടിയിലൂടെ പ്രകടമാക്കി.
