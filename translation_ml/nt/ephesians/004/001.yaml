revisions:
- from: അതുകൊണ്ട്, കർത്താവിൽ തടവുകാരനായ ഞാൻ[a], നിങ്ങൾക്കു ലഭിച്ച വിളിക്കു യോഗ്യമായി ജീവിക്കാൻ[b] നിങ്ങളെ പ്രബോധിപ്പിക്കുന്നു.
  to: അതിനാൽ, കർത്താവിൽ തടവുകാരനായ ഞാൻ[a], നിങ്ങൾ വിളിക്കപ്പെട്ട ആ വിളിക്കു യോഗ്യമായി ജീവിക്കാൻ[b] നിങ്ങളോടു അഭ്യർഥിക്കുന്നു.
  rationale: The revision replaces a teaching-oriented verb with an appeal-oriented verb that reflects Παρακαλῶ, and restores the explicit connection between ‘calling’ and ‘were called.’ It retains the formal but theologically broad expression കർത്താവിൽ and keeps the life-conduct sense of περιπατῆσαι in idiomatic Malayalam, with the literal metaphor noted in the footnote.
  reviewer_model: gpt-5.6-terra
