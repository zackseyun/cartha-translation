  terminology: ‘ദൈവം,’ ‘പിതാവ്,’ and the reverential ‘അവിടുന്ന്’ are suitable. ‘സകലത്തിന്റെയും’ and the corresponding three phrases preserve the Greek’s unspecified breadth without deciding whether persons, things, or both are in view.
  issues:
