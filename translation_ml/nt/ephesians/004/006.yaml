  text: one God and Father of all[b][a], who is over all and through all and in all.
translation:
  language: ml
  text: സകലത്തിന്റെയും ഏക ദൈവവും പിതാവും ഒരുവനാണ്; അവിടുന്ന് സകലത്തിനും മീതെയും സകലത്തിലൂടെയും സകലത്തിലും ഉള്ളവനാണ്.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സകലത്തിന്റെയും,’ ‘സകലത്തിനും മീതെ,’ ‘സകലത്തിലൂടെ,’ ‘സകലത്തിൽ’ എന്നിവയ്ക്ക് ‘എല്ലാവരുടെയും,’ ‘എല്ലാവർക്കും മീതെ,’ ‘എല്ലാവരിലൂടെ,’ ‘എല്ലാവരിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിൽ ആവർത്തിക്കുന്ന ‘എല്ലാം’ എന്ന പദത്തിന് വ്യക്തമായ നാമപദം ചേർത്തിട്ടില്ല.
    reason: lexical_alternative
  - marker: b
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘നിങ്ങൾ എല്ലാവരിലും’ എന്നു കാണുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: εἷς θεὸς καὶ πατὴρ πάντων
  choice: എല്ലാവരുടെയും ഏക ദൈവവും പിതാവുമായവൻ ഒരുവനേ ഉള്ളൂ
  rationale: εἷς എന്ന ഐക്യപ്രമേയത്തെ ഊന്നിപ്പറയാൻ ‘ഏക’യും ‘ഒരുവനേ ഉള്ളൂ’യും ചേർന്ന സ്വാഭാവിക മലയാളഘടന ഉപയോഗിച്ചു; θεός, πατήρ എന്നീ ദൈവിക പദവികളും πάντων എന്നതിന്റെ വ്യക്തിസൂചനയും നിലനിർത്തുന്നു.
- source_word: ὁ ἐπὶ πάντων
  choice: അവിടുന്ന് എല്ലാവർക്കും മീതെ
  rationale: ἐπί + genitive സൂചിപ്പിക്കുന്ന മേൽക്കോയ്മയും പരമാധികാരവും ‘മീതെ’ എന്നതിലൂടെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: διὰ πάντων
  choice: എല്ലാവരിലൂടെയും
  rationale: διά + genitive-ന്റെ മാധ്യമം/പ്രവർത്തനമാർഗം എന്ന ആശയം അധിക വ്യാഖ്യാനപദങ്ങൾ ചേർക്കാതെ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἐν πᾶσιν
  choice: എല്ലാവരിലും
  rationale: ἐν + dative-ന്റെ നേരിട്ടുള്ള അർത്ഥം നൽകുന്നു; സന്ദർഭത്തിലെ സമൂഹകേന്ദ്രിതമായ വ്യക്തിസൂചന മലയാളത്തിൽ സ്വാഭാവികമാക്കുന്നു, എന്നാൽ വിശാലമായ ‘എല്ലാറ്റിലും’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: πάντων / πᾶσιν എന്ന ആവർത്തനത്തിന്റെ വ്യാപ്തി
  choice: പ്രധാനപാഠത്തിൽ ‘എല്ലാവർ/എല്ലാവരും’ എന്ന വ്യക്തിസൂചക വായന
  alternative: ‘എല്ലാറ്റിന്റെയും / എല്ലാറ്റിനും മീതെ / എല്ലാറ്റിലൂടെയും / എല്ലാറ്റിലും’ എന്ന സകലവസ്തുസൂചക വായന
  rationale: എഫെസ്യർ 4-ലെ സഭയുടെ ഐക്യമാണ് അടുത്ത സന്ദർഭം; അതിനാൽ മലയാളത്തിലെ സ്വാഭാവിക വ്യക്തിസൂചക രൂപം പ്രധാനപാഠത്തിൽ സ്വീകരിച്ചു. എങ്കിലും ഗ്രീക്കിൽ വ്യക്തമായ നാമപദമില്ലാത്തതിനാൽ വിശാലമായ സകലവസ്തുസൂചക സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: ἐν πᾶσιν എന്നിടത്തെ പാഠഭേദം
  choice: SBLGNT പാഠമായ ‘എല്ലാവരിലും’
  alternative: 'ചില കൈയെഴുത്തുപ്രതികളിലെ ἐν ὑμῖν πᾶσιν: ‘നിങ്ങൾ എല്ലാവരിലും’'
  rationale: നൽകിയിരിക്കുന്ന വിമർശനാത്മക മൂലപാഠത്തെ പ്രധാനപാഠമായി പിന്തുടർന്നു; പ്രസക്തമായ കൈയെഴുത്തുപ്രതി ഭേദം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ‘അവിടുന്ന്’ ദൈവത്തെ സൂചിപ്പിക്കുന്ന ആദരസൂചക സർവനാമമായി ഉപയോഗിച്ചു. ഗ്രീക്കിലെ ത്രിഭാഗ സമാന്തരത ‘മീതെയും…ലൂടെയും…ലും’ എന്ന ആവർത്തനത്തിലൂടെ നിലനിർത്തി; അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ പ്രധാനപാഠത്തിൽ ഉൾപ്പെടുത്തി.
