  text: കോപിക്കുവിൻ[a]; പാപം ചെയ്യരുത്. നിങ്ങളുടെ കോപത്തിന്മേൽ[c] സൂര്യൻ അസ്തമിക്കരുത്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങൾ കോപിച്ചാൽ, പാപം ചെയ്യരുത്.” ഗ്രീക്കിൽ ഇത് ഔപചാരികമായി ആജ്ഞാരൂപത്തിലാണ് (“കോപിക്കുവിൻ”); എന്നാൽ സന്ദർഭത്തിൽ ചിലർ ഇതിനെ സമ്മതസൂചകമായ ആജ്ഞയായി മനസ്സിലാക്കുന്നു.
