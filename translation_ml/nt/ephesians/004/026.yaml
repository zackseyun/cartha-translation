lexical_decisions:
- source_word: ὀργίζεσθε
  choice: കോപിക്കുവിൻ
  rationale: ഗ്രീക്കിലെ ആജ്ഞാരൂപം നേരിട്ട് നിലനിർത്തുന്നു; അതേസമയം തുടർന്നുള്ള വിലക്ക് കോപത്തെ ധാർമികമായി നിയന്ത്രിക്കുന്നു. സങ്കീർത്തനം 4:4-ലെ ഗ്രീക്ക് പാഠത്തിന്റെ പ്രതിധ്വനിയും ഇതിലൂടെ സംരക്ഷിക്കപ്പെടുന്നു.
- source_word: μὴ ἁμαρτάνετε
  choice: എന്നാൽ പാപം ചെയ്യരുത്
  rationale: നിഷേധാത്മക ആജ്ഞ കൃത്യമായി നൽകുന്നു. καί എന്ന ബന്ധകത്തിന് ഇവിടെ വിരുദ്ധഭാവമുള്ള സ്വാഭാവിക മലയാളമായി ‘എന്നാൽ’ ഉപയോഗിച്ചെങ്കിലും പുതിയ ആശയം ചേർക്കുന്നില്ല.
- source_word: ὁ ἥλιος
  choice: സൂര്യൻ
  rationale: മൂലപദത്തിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ വിവർത്തനം.
- source_word: μὴ ἐπιδυέτω
  choice: അസ്തമിക്കരുത്
  rationale: മൂന്നാംപുരുഷ നിഷേധാത്മക ആജ്ഞയുടെ ശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐπὶ παροργισμῷ ὑμῶν
  choice: നിങ്ങളുടെ കോപത്തിന്മേൽ
  rationale: παροργισμός കോപം, പ്രകോപനം, മനസ്സിലെ നീരസം എന്നിവ സൂചിപ്പിക്കാം. മുൻവാക്യത്തിലെ കോപവുമായി ബന്ധം നിലനിർത്തുന്ന ഏറ്റവും വ്യക്തമായ മുഖ്യപാഠമാണ് ഇത്; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: ആദ്യ ഉപവാക്യം കോപിക്കാനുള്ള ആജ്ഞയാണോ, വ്യവസ്ഥാപരമായ സമ്മതമാണോ
  choice: ആജ്ഞാരൂപമായി ‘കോപിക്കുവിൻ’ എന്നു വിവർത്തനം ചെയ്തു.
  alternative: ‘നിങ്ങൾ കോപിച്ചാൽ, പാപം ചെയ്യരുത്.’
  rationale: ഗ്രീക്കിൽ വ്യക്തമായ ആജ്ഞാരൂപമാണുള്ളത്. അതിനെ നിലനിർത്തുന്നത് കോപത്തെ പൂർണമായി അംഗീകരിക്കുന്നതായി നിർബന്ധമായും അർഥമാക്കുന്നില്ല; ഉടൻ വരുന്ന പാപനിരോധനവും സമയപരിധിയും അതിനെ നിയന്ത്രിക്കുന്നു. അതിനാൽ പാഠത്തിലെ യഥാർഥമായ സംഘർഷം പരിഹരിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ ആജ്ഞാരൂപവും അതിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്താൻ ‘കോപിക്കുവിൻ’ തിരഞ്ഞെടുത്തു. ‘സൂര്യൻ അസ്തമിക്കരുത്’ എന്നത് സംക്ഷിപ്തവും മലയാളത്തിൽ സ്വാഭാവികവുമാണ്.
