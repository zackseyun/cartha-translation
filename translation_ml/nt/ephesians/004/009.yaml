id: EPH.4.9
reference: Ephesians 4:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τὸ δὲ Ἀνέβη τί ἐστιν εἰ μὴ ὅτι καὶ ⸀κατέβη εἰς τὰ κατώτερα μέρη τῆς γῆς;
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/009.yaml
  text: What does “he ascended” mean except that he also descended into the lower parts of the earth?[a]
translation:
  language: ml
  text: “അവൻ കയറി” എന്നതിന്റെ അർഥം എന്താണ്? അവൻ ഭൂമിയുടെ താഴ്ന്ന ഭാഗങ്ങളിലേക്ക് ഇറങ്ങുകയും ചെയ്തു എന്നല്ലാതെ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “താഴ്ന്ന പ്രദേശങ്ങളിലേക്ക്, അതായത് ഭൂമിയിലേക്ക്.” ഈ പ്രയോഗം ഭൂമിയിലേക്കുള്ള ഇറക്കത്തെ പൊതുവായി സൂചിപ്പിക്കാം; അല്ലെങ്കിൽ കൂടുതൽ പ്രത്യേകമായി മരിച്ചവരുടെ ലോകത്തേക്കുള്ള ഇറക്കത്തെ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀνέβη
  choice: അവൻ കയറിപ്പോയി
  rationale: ἀναβαίνω എന്ന ക്രിയയുടെ ലംബചലനദൃശ്യം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; തുടർന്നുള്ള ‘ഇറങ്ങിവന്നു’ എന്ന വിരുദ്ധചലനവുമായി വ്യക്തമായ സമാന്തരതയും ഉണ്ടാക്കുന്നു.
- source_word: τί ἐστιν εἰ μὴ ὅτι
  choice: എന്നതിന്റെ അർഥമെന്താണ്? ... എന്നല്ലാതെ?
  rationale: ഉദ്ധരിച്ച പദത്തിൽനിന്നുള്ള നിഗമനം അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ വാദാത്മക ശക്തി, അതികഠിനമായ പദാനുപദ ഘടന ഒഴിവാക്കി, ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: καὶ κατέβη
  choice: അവൻ ... ഇറങ്ങിവന്നു
  rationale: καί സൂചിപ്പിക്കുന്ന കൂട്ടിച്ചേർക്കൽ ‘എന്നല്ലാതെ’ എന്ന നിഗമനഘടനയ്ക്കുള്ളിൽ സ്വാഭാവികമായി പ്രകടമാകുന്നു; കയറ്റത്തിനും ഇറക്കത്തിനുമിടയിലെ വിരോധം നിലനിർത്തുന്നു.
- source_word: εἰς
  choice: -ലേക്ക്
  rationale: ഒരു സ്ഥലത്തിനകത്തേക്കുള്ള ദിശയും ചലനവും സൂചിപ്പിക്കുന്ന εἰς എന്നതിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: τὰ κατώτερα μέρη
  choice: താഴ്ന്ന ഭാഗങ്ങൾ
  rationale: താരതമ്യരൂപമായ κατώτερα (‘താഴ്ന്ന’) എന്നതും μέρη (‘ഭാഗങ്ങൾ/പ്രദേശങ്ങൾ’) എന്നതും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; ‘മരിച്ചവരുടെ ലോകം’ പോലുള്ള വ്യാഖ്യാനം മുഖ്യവാക്യത്തിൽ നിർബന്ധിക്കുന്നില്ല.
- source_word: τῆς γῆς
  choice: ഭൂമിയുടെ
  rationale: γῆയുടെ ‘ഭൂമി’ എന്ന പ്രപഞ്ചപരമായ അർഥം സന്ദർഭത്തിന് യോജിക്കുന്നു. ബന്ധികാരരൂപം നിലനിർത്തുന്നതിനാൽ ‘ഭൂമിയുടെ താഴ്ന്ന ഭാഗങ്ങൾ’ എന്നും ‘താഴ്ന്ന പ്രദേശങ്ങൾ, അതായത് ഭൂമി’ എന്നും മനസ്സിലാക്കാവുന്ന മൂലഭാഷയിലെ സാധ്യത തുറന്നുവെക്കുന്നു.
theological_decisions:
- issue: εἰς τὰ κατώτερα μέρη τῆς γῆς എന്ന പ്രയോഗത്തിന്റെ വ്യാഖ്യാനം
  choice: ‘ഭൂമിയുടെ താഴ്ന്ന ഭാഗങ്ങളിലേക്ക്’ എന്ന് സുതാര്യമായി പരിഭാഷപ്പെടുത്തി വ്യാഖ്യാനപരമായ അനിശ്ചിതത്വം നിലനിർത്തുക.
  alternative: ‘താഴ്ന്ന പ്രദേശങ്ങളിലേക്ക്, അതായത് ഭൂമിയിലേക്ക്’ അല്ലെങ്കിൽ ‘മരിച്ചവരുടെ ലോകത്തിലേക്ക്’ എന്ന് വ്യാഖ്യാനിക്കുക.
  rationale: ഗ്രീക്ക് ഘടന ഭൂമിയിലേക്കുള്ള ഇറക്കത്തെയോ ഭൂമിയുടെ അടിയിലെ/മരിച്ചവരുടെ ലോകത്തിലേക്കുള്ള ഇറക്കത്തെയോ സൂചിപ്പിക്കാം. ഒരു പ്രത്യേക ഉപദേശപരമായ വായന മുഖ്യവാക്യത്തിൽ ഉറപ്പിക്കാതെ പ്രധാന സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ഉദ്ധരണിയും ചോദ്യംരൂപത്തിലുള്ള നിഗമനവും നിലനിർത്തിയിരിക്കുന്നു; വ്യാഖ്യാനപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
