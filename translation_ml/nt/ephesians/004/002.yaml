id: EPH.4.2
reference: Ephesians 4:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μετὰ πάσης ταπεινοφροσύνης καὶ πραΰτητος, μετὰ μακροθυμίας, ἀνεχόμενοι ἀλλήλων ἐν ἀγάπῃ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/002.yaml
  text: with all humility and gentleness, with patience, bearing with one another in love,
translation:
  language: ml
  text: പൂർണ വിനയത്തോടും സൗമ്യതയോടുംകൂടെ, ദീർഘക്ഷമയോടെ, സ്നേഹത്തിൽ പരസ്പരം സഹിച്ചുകൊണ്ട്,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ πάσης
  choice: പൂർണമായ …-യോടുംകൂടെ
  rationale: ജനിറ്റീവിനോടുകൂടിയ μετά സഹവർത്തിത്വത്തെയും πάσης ഗുണത്തിന്റെ സമഗ്രതയെയും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘പൂർണമായ …-യോടുംകൂടെ’ എന്നത് ആ ഊന്നൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ταπεινοφροσύνης
  choice: താഴ്മ
  rationale: മനസ്സിന്റെ വിനയത്തെയോ സ്വയം താഴ്ത്തുന്ന മനോഭാവത്തെയോ സൂചിപ്പിക്കുന്ന നാമം. ‘താഴ്മ’ ആ ധാർമ്മിക അർത്ഥം ലളിതവും മാന്യവുമായി നൽകുന്നു.
- source_word: πραΰτητος
  choice: സൗമ്യത
  rationale: നിയന്ത്രിതമായ മൃദുത്വവും മറ്റുള്ളവരോടുള്ള ശാന്തമായ സമീപനവും സൂചിപ്പിക്കുന്നു. ‘സൗമ്യത’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്; ‘വിധേയത്വം’ എന്ന തെറ്റായ ധ്വനി ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: μακροθυμίας
  choice: ക്ഷമ
  rationale: മറ്റുള്ളവരോടു ദീർഘക്ഷമ കാണിക്കുകയും കോപിക്കാൻ വൈകുകയും ചെയ്യുന്ന മനോഭാവമാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്. ‘ക്ഷമ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: ἀνεχόμενοι
  choice: സഹിച്ചുകൊണ്ട്
  rationale: വർത്തമാനകാല മധ്യകർത്തരി കൃദന്തം തുടർച്ചയായ പരസ്പര സഹനത്തെ സൂചിപ്പിക്കുന്നു. ‘സഹിച്ചുകൊണ്ട്’ അതിന്റെ പ്രവാഹവും ബന്ധപരമായ അർത്ഥവും നിലനിർത്തുന്നു.
- source_word: ἀλλήλων
  choice: പരസ്പരം
  rationale: പരസ്പരസർവനാമത്തിന്റെ അർത്ഥം മലയാളത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: ἐν ἀγάπῃ
  choice: സ്നേഹത്തിൽ
  rationale: ἐν + ദത്തിവ് ഇവിടെ പരസ്പരം സഹിക്കുന്നതിന്റെ മേഖലയെയോ രീതിയെയോ സൂചിപ്പിക്കാം. നേരിട്ടുള്ള ‘സ്നേഹത്തിൽ’ ആ സാധ്യതകൾ തുറന്നുവെക്കുന്നു.
theological_decisions:
- issue: ἀγάπη എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: സ്നേഹം
  alternative: പ്രേമം
  rationale: ‘സ്നേഹം’ ആധുനിക മലയാളത്തിൽ വ്യാപകവും മാന്യവുമായ പദമാണ്; ഇവിടെ ഉദ്ദേശിക്കുന്ന സ്വയംനൽകുന്ന ബന്ധപരമായ ഗുണത്തെ അനാവശ്യമായ പ്രണയധ്വനിയില്ലാതെ അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. വാക്യം ഗ്രീക്ക് മൂലപാഠത്തിലെ തുടർവാക്യഘടന അനുസരിച്ച് കോമയിൽ അവസാനിപ്പിച്ചിരിക്കുന്നു; ഗുണങ്ങളെ സൂചിപ്പിക്കുന്ന പദങ്ങളും കൃദന്തരൂപവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നിലനിർത്തി.
