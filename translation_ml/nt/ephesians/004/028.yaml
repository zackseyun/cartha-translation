revisions:
- from: മോഷ്ടിക്കുന്നവൻ ഇനി മോഷ്ടിക്കരുത്. പകരം, ആവശ്യത്തിലിരിക്കുന്നവനുമായി[b] പങ്കിടാൻ തനിക്കു വകയുണ്ടാകേണ്ടതിന്, സ്വന്തം കൈകൾകൊണ്ട് നല്ലതു പ്രവർത്തിച്ച്[a] അധ്വാനിക്കട്ടെ.
  to: മോഷ്ടിക്കുന്നവൻ ഇനി മോഷ്ടിക്കരുത്. പകരം, സ്വന്തം കൈകൊണ്ട് നല്ലതു ചെയ്തുകൊണ്ട് കഠിനാധ്വാനം ചെയ്യട്ടെ[a]; അങ്ങനെ ആവശ്യത്തിലിരിക്കുന്നവനു പങ്കുവെക്കാൻ അവന്റെ കൈവശം എന്തെങ്കിലും ഉണ്ടാകേണ്ടതിന്[b].
  rationale: The revision corrects the recipient relation required by the Greek dative, improves idiomatic modern Malayalam, and makes explicit only the resource implied by “so that he may have [something] to share.” It preserves the source’s contrast between theft and honest, personally performed labor, as well as its stated purpose of generosity toward a needy person.
  reviewer_model: gpt-5.6-terra
