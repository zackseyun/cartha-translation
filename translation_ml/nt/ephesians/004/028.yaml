id: EPH.4.28
reference: Ephesians 4:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ κλέπτων μηκέτι κλεπτέτω, μᾶλλον δὲ κοπιάτω ἐργαζόμενος ⸂ταῖς ἰδίαις χερσὶν τὸ ἀγαθόν⸃, ἵνα ἔχῃ μεταδιδόναι τῷ χρείαν ἔχοντι.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/028.yaml
  text: The one who steals must steal no longer[a], but rather must labor, doing good work with his own hands[b], so that he may have something to share with the one who has need.
translation:
  language: ml
  text: മോഷ്ടിക്കുന്നവൻ ഇനി മോഷ്ടിക്കരുത്. പകരം, സ്വന്തം കൈകൊണ്ട് നല്ലതു ചെയ്തുകൊണ്ട് കഠിനാധ്വാനം ചെയ്യട്ടെ[a]; അങ്ങനെ ആവശ്യത്തിലിരിക്കുന്നവനു പങ്കുവെക്കാൻ അവന്റെ കൈവശം എന്തെങ്കിലും ഉണ്ടാകേണ്ടതിന്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നല്ലതായ/ഉപകാരപ്രദമായ ജോലി ചെയ്തുകൊണ്ട്.”
    reason: ἐργαζόμενος τὸ ἀγαθόν എന്ന പ്രയോഗം “നല്ലതു ചെയ്യുക” എന്നും, സന്ദർഭത്തിൽ, “നല്ലതോ ഉപകാരപ്രദമോ ആയ ജോലി ചെയ്യുക” എന്നും വിവർത്തനം ചെയ്യാം.
  - marker: b
    text: അഥവാ, “ആവശ്യമുള്ളവനു.”
    reason: τῷ χρείαν ἔχοντι എന്ന ദത്തിവ് പ്രയോഗം പങ്കുവെക്കലിന്റെ സ്വീകർത്താവിനെ സൂചിപ്പിക്കുന്നു; “ആവശ്യത്തിലിരിക്കുന്നവനു” എന്നതും കൂടുതൽ സംക്ഷിപ്തമായ “ആവശ്യമുള്ളവനു” എന്നതും സാധുവാണ്.
lexical_decisions:
- source_word: ὁ κλέπτων
  choice: മോഷ്ടിക്കുന്നവൻ
  rationale: നാമപദമായി ഉപയോഗിച്ചിരിക്കുന്ന വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ പ്രവൃത്തിസ്വഭാവം നിലനിർത്തുന്നു; വ്യക്തിയെ സ്ഥിരമായി ‘കള്ളൻ’ എന്നു മുദ്രകുത്തുന്നതും ഒഴിവാക്കുന്നു.
- source_word: μηκέτι κλεπτέτω
  choice: ഇനി മോഷ്ടിക്കരുത്
  rationale: മുമ്പുണ്ടായിരുന്ന പ്രവൃത്തി അവസാനിപ്പിക്കണമെന്ന μηκέτιയുടെ കാലസൂചനയും ആജ്ഞാരൂപത്തിന്റെ ശക്തിയും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: μᾶλλον δὲ
  choice: പകരം
  rationale: മോഷണത്തിനു വിരുദ്ധമായി നിർദേശിക്കുന്ന ശരിയായ ബദൽ പ്രവൃത്തിയെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അടയാളപ്പെടുത്തുന്നു.
- source_word: κοπιάτω
  choice: അധ്വാനിക്കട്ടെ
  rationale: വെറും ജോലി ചെയ്യുക എന്നതിലുപരി പ്രയത്നപൂർവം പണിയെടുക്കുക എന്ന κοπιάωയുടെ ഊന്നൽ സംരക്ഷിക്കുന്നു; മൂന്നാംപുരുഷ ആജ്ഞയുടെ സ്വഭാവവും നിലനിർത്തുന്നു.
- source_word: ἐργαζόμενος τὸ ἀγαθόν
  choice: നല്ലതു പ്രവർത്തിച്ച്
  rationale: ‘നല്ലത്/ഉചിതമായത്/പ്രയോജനകരമായത് ചെയ്യുക’ എന്ന വിശാലത നിലനിർത്തുന്നു; അതിനെ തൊഴിൽഫലം മാത്രമായോ പൊതുവായ സൽപ്രവൃത്തി മാത്രമായോ ചുരുക്കുന്നില്ല.
- source_word: ταῖς ἰδίαις χερσὶν
  choice: സ്വന്തം കൈകൾകൊണ്ട്
  rationale: വ്യക്തിപരവും സത്യസന്ധവുമായ അധ്വാനത്തെ ഊന്നുന്ന മൂലപാഠത്തിലെ മൂർത്തമായ പ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἵνα ἔχῃ
  choice: തനിക്കു വകയുണ്ടാകേണ്ടതിന്
  rationale: ഉദ്ദേശ്യവാക്യത്തിന്റെ ശക്തി സംരക്ഷിക്കുകയും പങ്കിടാനുള്ള ഉപാധി അല്ലെങ്കിൽ സമ്പത്ത് കൈവശമുണ്ടാകുക എന്ന അന്തർനിഹിത ആശയം സ്വാഭാവികമായി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: μεταδιδόναι
  choice: പങ്കിടാൻ
  rationale: സ്വന്തമായി ഉള്ളതിൽനിന്ന് മറ്റൊരാൾക്കു നൽകുക എന്ന പങ്കുവെക്കലിന്റെ ഭാവം സാധാരണ ‘കൊടുക്കുക’ എന്നതിനെക്കാൾ നന്നായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τῷ χρείαν ἔχοντι
  choice: ആവശ്യത്തിലിരിക്കുന്നവനുമായി
  rationale: ആവശ്യമുള്ള വ്യക്തിയെ പങ്കിടലിന്റെ സ്വീകർത്താവായി സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിലെ കൃദന്തപ്രയോഗത്തിന്റെ വിവരണാത്മക സ്വഭാവം നിലനിർത്തുന്നു.
theological_decisions:
- issue: അധ്വാനത്തിന്റെ ധാർമിക ലക്ഷ്യം
  choice: സത്യസന്ധമായ അധ്വാനം മോഷണത്തിനുള്ള ബദലായും ആവശ്യത്തിലിരിക്കുന്നവരുമായി പങ്കിടാനുള്ള മാർഗമായും അവതരിപ്പിക്കുന്നു.
  alternative: പ്രധാന ഊന്നൽ സ്വയംപര്യാപ്തതയിലോ മോഷ്ടിച്ചതിന്റെ നഷ്ടപരിഹാരത്തിലോ ആണെന്ന വായന.
  rationale: ἵνα എന്ന ഉദ്ദേശ്യവാക്യം അധ്വാനത്തിന്റെ പ്രഖ്യാപിത ലക്ഷ്യമായി ആവശ്യക്കാരനുമായുള്ള പങ്കിടലിനെ മുന്നിലെത്തിക്കുന്നു. സ്വയംപര്യാപ്തത പരോക്ഷമായി ഉൾക്കൊള്ളാമെങ്കിലും നഷ്ടപരിഹാരം ഇവിടെ വ്യക്തമായി പറയുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മോഷ്ടിക്കുന്നവൻ’ എന്നത് വ്യക്തിയെ മുദ്രകുത്താതെ മൂലത്തിലെ പ്രവൃത്തിസ്വഭാവം സൂക്ഷിക്കുന്നു. ആജ്ഞകൾ സ്വാഭാവിക മലയാളത്തിൽ ‘മോഷ്ടിക്കരുത്’, ‘അധ്വാനിക്കട്ടെ’ എന്നിങ്ങനെ നൽകിയിരിക്കുന്നു; വാക്യത്തിന്റെ നൈതിക വൈരുധ്യവും പങ്കിടലിലേക്കുള്ള ലക്ഷ്യഗതിയും വ്യക്തമാണ്.
