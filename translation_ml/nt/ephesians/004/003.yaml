id: EPH.4.3
reference: Ephesians 4:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: σπουδάζοντες τηρεῖν τὴν ἑνότητα τοῦ πνεύματος ἐν τῷ συνδέσμῳ τῆς εἰρήνης·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/003.yaml
  text: making every effort to keep the unity of the Spirit in the bond of peace[a][b].
translation:
  language: ml
  text: സമാധാനത്തിന്റെ ബന്ധത്തിൽ ആത്മാവിന്റെ ഐക്യം കാത്തുസൂക്ഷിക്കാൻ എല്ലാ ശ്രമവും ചെയ്തുകൊണ്ട്[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിലനിർത്താൻ ശ്രദ്ധാപൂർവം ശ്രമിച്ചുകൊണ്ട്” അല്ലെങ്കിൽ “സംരക്ഷിക്കാൻ ഉത്സാഹിച്ചുകൊണ്ട്.”
    reason: lexical_alternative
  - marker: b
    text: “ആത്മാവ്” ഇവിടെ മിക്കവാറും പരിശുദ്ധാത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്; എന്നാൽ വിശ്വാസികൾക്കിടയിലെ പങ്കിട്ട ആത്മീയമനോഭാവം എന്ന പൊതുവായ അർഥത്തിലും ചിലർ ഇതിനെ മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: σπουδάζοντες
  choice: എല്ലാ ശ്രമവും നടത്തിക്കൊണ്ട്
  rationale: വർത്തമാനകാല കർത്തൃപ്രയോഗമായ ഈ പദം വെറും താത്പര്യമല്ല, ജാഗ്രതയോടെയുള്ള സജീവ പരിശ്രമമാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ഈ പ്രയോഗം ആ ശക്തി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τηρεῖν
  choice: കാത്തുസൂക്ഷിക്കാൻ
  rationale: ഇതിനകം ലഭിച്ചിരിക്കുന്ന ഒന്നിനെ നിലനിർത്തുകയും സംരക്ഷിക്കുകയും ചെയ്യുക എന്ന അർഥം വ്യക്തമാക്കുന്നു; ഐക്യം പുതുതായി സൃഷ്ടിക്കുന്നു എന്ന ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: ἑνότητα
  choice: ഐക്യം
  rationale: ἑνότης എന്നതിന്റെ സാധാരണവും വ്യക്തവുമായ മലയാള സമാനപദം.
- source_word: τοῦ πνεύματος
  choice: ആത്മാവിന്റെ
  rationale: സമീപസന്ദർഭവും എഫേസ്യരിലെ പ്രയോഗവും പരിശുദ്ധാത്മാവിനെയാണ് പ്രധാനമായി സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ‘ആത്മാവ്’ എന്ന രൂപം ആ വായന നിലനിർത്തുന്നു.
- source_word: ἐν
  choice: -ത്തിൽ
  rationale: ഐക്യം കാത്തുസൂക്ഷിക്കപ്പെടുന്ന ബന്ധമോ മേഖലയോ സൂചിപ്പിക്കുന്ന ἐν എന്ന പൂർവപ്രത്യയത്തെ സ്വാഭാവികമായ സ്ഥലവിഭക്തിയാൽ അവതരിപ്പിക്കുന്നു.
- source_word: συνδέσμῳ
  choice: ബന്ധം
  rationale: കൂട്ടിക്കെട്ടുന്നതോ ഒരുമിപ്പിക്കുന്നതോ ആയതിനെ സൂചിപ്പിക്കുന്ന രൂപകം നിലനിർത്തുന്ന, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ പദം.
- source_word: τῆς εἰρήνης
  choice: സമാധാനമാകുന്ന
  rationale: ഗ്രീക്കിലെ ലളിതമായ ഷഷ്ഠീബന്ധം സമാധാനം തന്നെയാണ് ആളുകളെ ചേർത്തുനിർത്തുന്ന ബന്ധം എന്ന സാധ്യതയോടെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ‘സമാധാനത്തിന്റെ ബന്ധം’ എന്ന കൃത്രിമത്വം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: πνεύματος എന്നതിന്റെ സൂചന
  choice: പരിശുദ്ധാത്മാവ്
  alternative: മനുഷ്യരുടെ പങ്കിട്ട മനോഭാവം അഥവാ ഐക്യത്തിന്റെ ആത്മാവ്
  rationale: എഫേസ്യർ 4:4, 4:30 എന്നിവ ഉൾപ്പെടെയുള്ള സമീപസന്ദർഭത്തിൽ πνεῦμα ദൈവത്തിന്റെ ആത്മാവിനെ സൂചിപ്പിക്കാനുള്ള സാധ്യത ശക്തമാണ്; എങ്കിലും മറ്റൊരു വായനയുടെ സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- issue: ഐക്യത്തിന്റെ സ്വഭാവം
  choice: ഇതിനകം നൽകിയ ഐക്യം കാത്തുസൂക്ഷിക്കുക
  alternative: വിശ്വാസികൾ പുതുതായി ഐക്യം സൃഷ്ടിക്കുക
  rationale: τηρεῖν എന്നത് നിലവിലുള്ള ഒന്നിനെ കാത്തുസൂക്ഷിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; അതിനാൽ വാക്യം വിശ്വാസികൾ ഐക്യം നിർമ്മിക്കണമെന്ന് പറയുന്നതായി വികസിപ്പിച്ചിട്ടില്ല.
- issue: സമാധാനവും ബന്ധവും തമ്മിലുള്ള ബന്ധം
  choice: സമാധാനം ഒരുമിപ്പിക്കുന്ന ബന്ധമാണ്
  alternative: സമാധാനം ഉളവാക്കുന്ന ബന്ധം, അല്ലെങ്കിൽ സമാധാനത്തിലൂടെയുള്ള ബന്ധം
  rationale: τῷ συνδέσμῳ τῆς εἰρήνης എന്ന ഷഷ്ഠീപ്രയോഗം ഒന്നിലധികം സൂക്ഷ്മബന്ധങ്ങൾ അനുവദിക്കുന്നു. പ്രധാന പാഠം സ്വാഭാവികമായി സമാധാനം ബന്ധമായി പ്രവർത്തിക്കുന്നു എന്ന വായന സ്വീകരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ കർത്തൃപ്രയോഗം മുൻവാക്യങ്ങളിലെ പ്രബോധനപ്രവാഹത്തോട് ചേരുന്ന വിധത്തിൽ ‘നടത്തിക്കൊണ്ട്’ എന്നു നിലനിർത്തി. ‘സമാധാനമാകുന്ന ബന്ധം’ എന്നത് രൂപകവും അർഥവും സ്വാഭാവികമായി നൽകുന്നു.
