id: EPH.4.21
reference: Ephesians 4:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἴ γε αὐτὸν ἠκούσατε καὶ ἐν αὐτῷ ἐδιδάχθητε, καθώς ἐστιν ἀλήθεια ἐν τῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/021.yaml
  text: if indeed you heard him and were taught in him[a], just as truth is in Jesus[b],
translation:
  language: ml
  text: നിങ്ങൾ വാസ്തവമായിത്തന്നെ അവനെ കേൾക്കുകയും അവനിൽ പഠിപ്പിക്കപ്പെടുകയും ചെയ്തിട്ടുണ്ടെങ്കിൽ[a]—യേശുവിൽ സത്യം ഉള്ളതുപോലെ[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങൾ അവനെക്കുറിച്ച് കേട്ടിട്ടുണ്ടെങ്കിൽ.’ ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘നിങ്ങൾ അവനെ കേട്ടു’ എന്നാണ്. അപ്പൊസ്തലിക സന്ദേശത്തിലൂടെ അവർ ക്രിസ്തുവിനെത്തന്നെ കേട്ടു എന്ന ആശയം ഇതിൽ സൂചിപ്പിച്ചിരിക്കാം.
    reason: alternative_reading
  - marker: b
    text: ‘അവനിൽ’, ‘യേശുവിൽ’ എന്നീ പ്രയോഗങ്ങൾ മേഖല, ഐക്യം, അല്ലെങ്കിൽ അടുത്ത ബന്ധം എന്നിവ സൂചിപ്പിക്കാം. ഗ്രീക്കിലെ അർത്ഥവ്യാപ്തി ‘അവനാൽ’ എന്നതിനെക്കാൾ വിശാലമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ γε
  choice: വാസ്തവമായി ... ചെയ്തിട്ടുണ്ടെങ്കിൽ
  rationale: നിബന്ധനാരൂപവും γε നൽകുന്ന നേരിയ ഊന്നലും നിലനിർത്തുന്നു; അതിനെ ‘തീർച്ചയായും’ എന്ന ഉറപ്പായോ ‘ആകയാൽ’ എന്ന കാരണമായോ മാറ്റുന്നില്ല.
- source_word: αὐτὸν ἠκούσατε
  choice: അവനെ കേൾക്കുകയും
  rationale: αὐτόν നേരിട്ടുള്ള കർമമായതിനാൽ ‘അവനെ കേട്ടു’ എന്ന അസാധാരണമായെങ്കിലും അർത്ഥസമ്പന്നമായ പ്രയോഗം നിലനിർത്തുന്നു; ‘അവനെക്കുറിച്ചു കേട്ടു’ എന്ന് വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: ἐν αὐτῷ
  choice: അവനിൽ
  rationale: ἐν എന്നതിന്റെ സ്ഥലം, ബന്ധം, ഐക്യം എന്നീ സാധ്യതകൾ തുറന്നുവയ്ക്കുന്നു; വെറും കർത്തൃത്വം സൂചിപ്പിക്കുന്ന ‘അവനാൽ’ ഒഴിവാക്കുന്നു.
- source_word: ἐδιδάχθητε
  choice: ഉപദേശം ലഭിക്കുകയും
  rationale: ഗ്രീക്കിലെ കർമണിപ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: καθώς
  choice: ഉള്ളതുപോലെ
  rationale: വായനക്കാരുടെ പഠിപ്പിക്കപ്പെടലിനെയും യേശുവിലുള്ള സത്യത്തെയും ബന്ധിപ്പിക്കുന്ന താരതമ്യശക്തി നിലനിർത്തുന്നു.
- source_word: ἀλήθεια
  choice: സത്യം
  rationale: ആർട്ടിക്കിൾ ഇല്ലാത്ത ἀλήθεια ലളിതമായി ‘സത്യം’ എന്നു നൽകുന്നു; ‘യാഥാർഥ്യം’ എന്ന വ്യാഖ്യാനപരമായ പദം ഒഴിവാക്കുന്നു.
- source_word: ἐν τῷ Ἰησοῦ
  choice: യേശുവിൽ
  rationale: വ്യക്തിനാമമായ ‘യേശു’ സംരക്ഷിക്കുകയും ἐν സൂചിപ്പിക്കാവുന്ന മേഖല, ഐക്യം, അടുത്ത ബന്ധം എന്നിവയിൽ ഒന്ന് മാത്രം നിർബന്ധിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: αὐτὸν ἠκούσατε എന്നത് ‘അവനെ കേട്ടു’ എന്നോ ‘അവനെക്കുറിച്ചു കേട്ടു’ എന്നോ നൽകണോ
  choice: അവനെ കേട്ടു
  alternative: അവനെക്കുറിച്ചു കേട്ടു
  rationale: നേരിട്ടുള്ള കർമം മൂലപാഠത്തിലെ ശ്രദ്ധേയമായ പ്രയോഗത്തെ പിന്തുണയ്ക്കുന്നു. അപ്പൊസ്തലിക സന്ദേശത്തിൽ ക്രിസ്തുവിനെത്തന്നെ കേട്ടുവെന്ന സൂചന നിലനിൽക്കുന്നു; എന്നാൽ അടിക്കുറിപ്പിൽ സാധ്യമായ ഇടിയോമാറ്റിക് വായനയും നൽകുന്നു.
- issue: ἐν αὐτῷ, ἐν τῷ Ἰησοῦ എന്നീ ആവർത്തിച്ചുള്ള ἐν പ്രയോഗങ്ങളുടെ സൂക്ഷ്മാർഥം
  choice: അവനിൽ / യേശുവിൽ
  alternative: അവനാൽ / യേശുവുമായുള്ള ഐക്യത്തിൽ
  rationale: പൗലോസിന്റെ ഭാഷയിലെ മേഖല, ഐക്യം, അടുത്ത ബന്ധം എന്നീ അർത്ഥസാധ്യതകൾ നിലനിർത്തുന്നു; വെറും കർത്തൃത്വമായോ വിശദീകരിച്ച ഐക്യമായോ ഒതുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് വ്യാകരണപരമായി നീളുന്നതിനാൽ അവസാനത്തിൽ ദീർഘവിരാമചിഹ്നം ഉപയോഗിച്ചു. ‘ഉപദേശം ലഭിച്ചു’ എന്നത് കർമണിഭാവം സ്വാഭാവികമായി നൽകുന്നു; ആവർത്തിച്ചുള്ള ‘-യിൽ’ പ്രയോഗം മൂലത്തിലെ ഉദ്ദേശ്യപരമായ ἐν ആവർത്തനം സംരക്ഷിക്കുന്നു.
