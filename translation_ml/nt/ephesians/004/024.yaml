id: EPH.4.24
reference: Ephesians 4:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐνδύσασθαι τὸν καινὸν ἄνθρωπον τὸν κατὰ θεὸν κτισθέντα ἐν δικαιοσύνῃ καὶ ὁσιότητι τῆς ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/024.yaml
  text: and to put on the new man[d][c][b][a], created according to God in righteousness and holiness of the truth.
translation:
  language: ml
  text: ദൈവത്തിന് അനുസൃതമായി സത്യത്തിന്റെ നീതിയിലും വിശുദ്ധിയിലും സൃഷ്ടിക്കപ്പെട്ട പുതിയ മനുഷ്യനെ[a] ധരിക്കാനും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പുതിയ സ്വത്വം’ എന്നോ ‘പുതിയ വ്യക്തി’ എന്നോ പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിൽ ‘പുതിയ മനുഷ്യൻ’; സമീപസന്ദർഭത്തിലെ ‘പഴയ മനുഷ്യൻ’ എന്ന പ്രയോഗവുമായി ഇത് പൊരുത്തപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδύσασθαι
  choice: ധരിക്കാനും
  rationale: വസ്ത്രം ധരിക്കുന്ന രൂപകം നിലനിർത്തുകയും മുൻസന്ദർഭത്തിലെ ‘ഉരിഞ്ഞുകളയുക/ധരിക്കുക’ എന്ന വൈരുധ്യവുമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: καινὸν
  choice: പുതിയ
  rationale: കാലപരമായ പുതുമ മാത്രമല്ല, സ്വഭാവത്തിലും ഗുണത്തിലും ഉള്ള പുതുമയും ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: ἄνθρωπον
  choice: മനുഷ്യനെ
  rationale: സമീപസന്ദർഭത്തിലെ ‘പഴയ മനുഷ്യൻ’ എന്ന പ്രയോഗവുമായുള്ള പദബന്ധം നിലനിർത്തുന്നു; ‘സ്വയം’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: κατὰ θεὸν
  choice: ദൈവത്തിന് അനുസൃതമായി
  rationale: κατάയുടെ അനുരൂപത/മാനദണ്ഡം എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘ദൈവത്തിന്റെ സാദൃശ്യത്തിൽ’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക അർഥം നേരിട്ട് ചേർക്കുന്നില്ല.
- source_word: κτισθέντα
  choice: സൃഷ്ടിക്കപ്പെട്ട
  rationale: നിഷ്ക്രിയ പങ്കുപദത്തിന്റെ അർഥവും സൃഷ്ടി സംബന്ധമായ ഭാഷയും നിലനിർത്തുന്നു.
- source_word: δικαιοσύνῃ
  choice: നീതിയിൽ
  rationale: δικαιοσύνηയുടെ നൈതിക ശരിത്വവും നീതിപൂർവതയും ഉൾക്കൊള്ളുന്ന പൊതുവായ മലയാള സമാനപദം.
- source_word: ὁσιότητι
  choice: വിശുദ്ധിയിൽ
  rationale: ദൈവികമായ വിശുദ്ധി/ഭക്തിപൂർവമായ ശുദ്ധി എന്ന അർഥം dignifiedവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: τῆς ἀληθείας
  choice: സത്യത്തിന്റെ
  rationale: ജനിറ്റീവ് ബന്ധം ഔപചാരികമായി നിലനിർത്തി അത് ‘യഥാർഥമായ’ എന്ന വിശേഷണമായി മാത്രം വ്യാഖ്യാനിക്കുന്നത് ഒഴിവാക്കുന്നു; നീതിയെയും വിശുദ്ധിയെയും ഒരുപോലെ വിശേഷിപ്പിക്കാനുള്ള സാധ്യത തുറന്നുവയ്ക്കുന്നു.
theological_decisions:
- issue: ‘പുതിയ മനുഷ്യൻ’ എന്ന മനുഷ്യശാസ്ത്രപരമായ പ്രയോഗം
  choice: പുതിയ മനുഷ്യൻ
  alternative: പുതിയ സ്വത്വം / പുതിയ വ്യക്തി
  rationale: ἄνθρωπος എന്ന പദവും സന്ദർഭത്തിലെ ‘പഴയ മനുഷ്യൻ’ എന്ന പ്രതിരൂപവുമായുള്ള ബന്ധവും നിലനിർത്തുന്നു; ‘സ്വത്വം’ എന്ന വ്യാഖ്യാനപരമായ ചുരുക്കം ഒഴിവാക്കുന്നു.
- issue: κατὰ θεὸν എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: ദൈവത്തിന് അനുസൃതമായി
  alternative: ദൈവത്തിന്റെ സാദൃശ്യത്തിൽ / ദൈവത്തെ മാതൃകയാക്കി
  rationale: ദൈവത്തോടുള്ള അനുരൂപത എന്ന ആശയം നൽകുമ്പോഴും രൂപസാദൃശ്യം എന്ന പ്രത്യേക വ്യാഖ്യാനം നിർബന്ധിക്കുന്നില്ല.
- issue: τῆς ἀληθείας ഏതിനോട് ബന്ധപ്പെടുന്നു
  choice: സത്യത്തിന്റെ നീതിയിലും വിശുദ്ധിയിലും
  alternative: യഥാർഥ നീതിയിലും വിശുദ്ധിയിലും / സത്യത്തിൽനിന്നു വരുന്ന നീതിയിലും വിശുദ്ധിയിലും
  rationale: ഗ്രീക്കിലെ ജനിറ്റീവ് ഘടനയും അതിന്റെ അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു; സത്യം ഉറവിടമാണോ ഗുണമാണോ എന്നത് അനാവശ്യമായി തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. വസ്ത്രധാരണരൂപകവും ‘പഴയ മനുഷ്യൻ/പുതിയ മനുഷ്യൻ’ എന്ന പദബന്ധവും ഗ്രീക്കിലെ ജനിറ്റീവ് അസ്പഷ്ടതയും സംരക്ഷിച്ചു.
