  naturalness: ‘നാം … വളരുക’ is not a natural Malayalam hortatory construction. ‘നാം … വളരാം’ clearly and idiomatically conveys the first-person plural hortatory subjunctive. The reordered phrase ‘തലയായ മശീഹയിലേക്ക്’ is acceptable modern Malayalam and preserves the appositional identification without imposing an interpretation.
