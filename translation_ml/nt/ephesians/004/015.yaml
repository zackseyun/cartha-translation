id: EPH.4.15
reference: Ephesians 4:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀληθεύοντες δὲ ἐν ἀγάπῃ αὐξήσωμεν εἰς αὐτὸν τὰ πάντα, ὅς ἐστιν ἡ κεφαλή, ⸀Χριστός,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/015.yaml
  text: but speaking truth in love[a], let us grow in every way into him who is the head, Messiah[c][b],
translation:
  language: ml
  text: എന്നാൽ സ്നേഹത്തോടെ സത്യം സംസാരിച്ചുകൊണ്ട്[a], തലയായ മശീഹയിലേക്ക്[c] നാം എല്ലാ വിധത്തിലും[b] വളരാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സത്യസന്ധമായി ജീവിച്ചുകൊണ്ട്’ അല്ലെങ്കിൽ ‘സത്യം ആചരിച്ചുകൊണ്ട്’; ഗ്രീക്ക് ക്രിയയിൽ സത്യമായ സംസാരം മാത്രമല്ല, സത്യസന്ധമായ പെരുമാറ്റവും ഉൾപ്പെടാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘എല്ലാ കാര്യങ്ങളിലും’; കൂടുതൽ അക്ഷരാർഥത്തിൽ, ‘സകലവും.’
    reason: lexical_alternative
  - marker: c
    text: 'ഗ്രീക്ക്: ‘ക്രിസ്തോസ്’; ഇവിടെ ഈ പദം ഒരു പദവിയായി പ്രവർത്തിക്കുന്നതിനാൽ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀληθεύοντες
  choice: സത്യം പറഞ്ഞുകൊണ്ട്
  rationale: സത്യസന്ധമായി സംസാരിക്കുക എന്നത് ഈ സന്ദർഭത്തിൽ—വഞ്ചനാപരമായ ഉപദേശത്തോടുള്ള വൈരുധ്യത്തിൽ—സ്വാഭാവികമായ മുഖ്യ അർഥമാണ്. സത്യമായി ജീവിക്കുക എന്ന വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ അസ്ഥിരതയോടും വഞ്ചനയോടും ഉള്ള മൃദുവായ വൈരുധ്യം വ്യക്തമാക്കുന്നു.
- source_word: ἐν ἀγάπῃ
  choice: സ്നേഹത്തോടെ
  rationale: പ്രവൃത്തിയുടെ രീതിയായി സ്നേഹത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ഗ്രീക്കിലെ ἐν എന്നതിന്റെ മണ്ഡലാർഥവും രീതിയാർഥവും സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: αὐξήσωμεν
  choice: നാം … വളരുക
  rationale: ഒന്നാംപുരുഷ ബഹുവചനത്തിലെ ആഹ്വാനാത്മക subjunctive രൂപത്തിന്റെ പ്രബോധനശക്തി നിലനിർത്തുന്നു.
- source_word: εἰς αὐτὸν
  choice: മശീഹയിലേക്ക്
  rationale: εἰς എന്നതിന്റെ ദിശാസൂചകശക്തി ‘-യിലേക്ക്’ എന്ന രൂപത്തിൽ സംരക്ഷിക്കുന്നു. ബന്ധവാക്യത്തെയും അനുബന്ധമായി നിൽക്കുന്ന Χριστός എന്ന പദത്തെയും സ്വാഭാവിക മലയാളവാക്യഘടനയിൽ ചേർത്തിരിക്കുന്നു.
- source_word: τὰ πάντα
  choice: എല്ലാ വിധത്തിലും
  rationale: വളർച്ച സമഗ്രമായി, എല്ലാ കാര്യങ്ങളിലും സംഭവിക്കണമെന്ന ക്രിയാവിശേഷണപരമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു; അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: κεφαλή
  choice: തല
  rationale: പൗലോസിന്റെ ശരീരരൂപകം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: Χριστός
  choice: മശീഹ
  rationale: ഇവിടെ ‘തല’ എന്നതിനെ വിശദീകരിക്കുന്ന സ്ഥാനത്ത് Χριστός ഒരു പദവിയായി പ്രവർത്തിക്കുന്നതിനാൽ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: ἀληθεύοντες എന്നതിന്റെ അർഥവ്യാപ്തി
  choice: മുഖ്യപാഠത്തിൽ ‘സത്യം പറഞ്ഞുകൊണ്ട്’
  alternative: ‘സത്യസന്ധരായിക്കൊണ്ട്’ അല്ലെങ്കിൽ ‘സത്യം ആചരിച്ചുകൊണ്ട്’
  rationale: തൊട്ടുമുമ്പുള്ള സന്ദർഭം വ്യാജോപദേശത്തെയും വഞ്ചനയെയും കുറിച്ചായതിനാൽ സംസാരവുമായി ബന്ധപ്പെട്ട അർഥം മുഖ്യപാഠത്തിന് യോജിക്കുന്നു. എങ്കിലും ക്രിയയ്ക്ക് സത്യസന്ധമായ ജീവിതത്തെയും ഉൾക്കൊള്ളാൻ കഴിയുന്നതിനാൽ ആ വിശാലത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: κεφαλή എന്ന രൂപകത്തിന്റെ വ്യാഖ്യാനം
  choice: ‘തല’ എന്നു മാത്രം പരിഭാഷപ്പെടുത്തി
  alternative: ‘ഉറവിടം’ അല്ലെങ്കിൽ ‘അധികാരിയായവൻ’
  rationale: ഗ്രീക്ക് പാഠത്തിലെ ശരീരരൂപകം അതേപടി നിലനിർത്തുകയും വിവാദമായ പ്രത്യേക ദൈവശാസ്ത്രവ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ പ്രബോധനശൈലി ഉപയോഗിച്ചു. ‘സത്യം പറഞ്ഞുകൊണ്ട്’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; ‘തല’ എന്ന രൂപകം വ്യാഖ്യാനാത്മക വികസനം കൂടാതെ നിലനിർത്തി. വാക്യത്തിന്റെ സ്വാഭാവികതയ്ക്കായി ഗ്രീക്കിലെ ബന്ധവാക്യം ‘തലയായ മശീഹയിലേക്ക്’ എന്ന സംക്ഷിപ്ത ഘടനയിൽ പുനഃക്രമീകരിച്ചു.
