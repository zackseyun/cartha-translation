revisions:
- from: ശരീരം ഒന്ന്, ആത്മാവ്[a] ഒന്ന്. അതുപോലെ, നിങ്ങളുടെ വിളിയുടെ ഒരേയൊരു പ്രത്യാശയിൽ നിങ്ങളും വിളിക്കപ്പെട്ടു.
  to: ഒരു ശരീരവും ഒരു ആത്മാവും[a] ഉണ്ട്; നിങ്ങളുടെ വിളിയുടെ ഒരേ പ്രത്യാശയിൽ നിങ്ങളും വിളിക്കപ്പെട്ടതുപോലെ.
  rationale: The revision improves Malayalam clause structure, renders the repeated ‘one’ without added exclusivity, and replaces the self-duplicating footnote with one that accurately distinguishes lexical range from contextual reference. It retains the ambiguity of πνεῦμα sufficiently by keeping ‘ആത്മാവ്’ in the text and documenting the likely contextual reference.
