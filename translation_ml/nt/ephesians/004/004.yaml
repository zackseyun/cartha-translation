id: EPH.4.4
reference: Ephesians 4:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἓν σῶμα καὶ ἓν πνεῦμα, καθὼς καὶ ἐκλήθητε ἐν μιᾷ ἐλπίδι τῆς κλήσεως ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/004.yaml
  text: There is one body and one Spirit[a], just as you also were called in one hope of your calling.
translation:
  language: ml
  text: ഒരു ശരീരവും ഒരു ആത്മാവും[a] ഉണ്ട്; നിങ്ങളുടെ വിളിയുടെ ഒരേ പ്രത്യാശയിൽ നിങ്ങളും വിളിക്കപ്പെട്ടതുപോലെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘പരിശുദ്ധാത്മാവ്’. πνεῦμα എന്ന ഗ്രീക്ക് പദത്തിന് ‘ആത്മാവ്’ എന്നും അർത്ഥമാകാം; ഈ ഐക്യപ്രഖ്യാപനങ്ങളുടെ പശ്ചാത്തലത്തിൽ അത് പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്നതാണു കൂടുതൽ സാധ്യത.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἓν / μιᾷ
  choice: ഒന്ന് / ഒരേയൊരു
  rationale: ഐക്യത്തിന് ഊന്നൽ നൽകുന്ന ആവർത്തനം നിലനിർത്തുന്നു; മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി നാമവിധേയ ഭാഗങ്ങളിൽ ‘ഒന്ന്’ എന്നും പ്രത്യാശയോടൊപ്പം ‘ഒരേയൊരു’ എന്നും ഉപയോഗിച്ചു.
- source_word: σῶμα
  choice: ശരീരം
  rationale: മൂലപദത്തിന്റെ രൂപകം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ അതേപടി നിലനിർത്തുന്ന സാധാരണ മലയാളപദം.
- source_word: πνεῦμα
  choice: ആത്മാവ്
  rationale: ഈ ഭാഗത്തിലെ ഐക്യപ്രഖ്യാപനങ്ങളുടെ പശ്ചാത്തലത്തിൽ പരിശുദ്ധാത്മാവിനെയാണ് ഏറ്റവും സാധ്യതയോടെ സൂചിപ്പിക്കുന്നത്; എന്നാൽ ഗ്രീക്കിൽ വലിയക്ഷരവ്യത്യാസമില്ലാത്തതിനാൽ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: καθὼς καὶ
  choice: അതുപോലെ ... നിങ്ങളും
  rationale: താരതമ്യബന്ധവും καί നൽകുന്ന ‘നിങ്ങളും’ എന്ന ഉൾപ്പെടുത്തൽഭാവവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἐκλήθητε
  choice: വിളിക്കപ്പെട്ടു
  rationale: പരോക്ഷപ്രയോഗം നിലനിർത്തുകയും വിളിച്ച കർത്താവിനെ മൂലപാഠം വ്യക്തമാക്കാത്തതുപോലെ വ്യക്തമാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐν μιᾷ ἐλπίδι
  choice: ഒരേയൊരു പ്രത്യാശയിൽ
  rationale: ἐν എന്നതിന്റെ അടിസ്ഥാനബന്ധവും ഐക്യത്തിന് നൽകുന്ന ഊന്നലും നിലനിർത്തുന്നു.
- source_word: τῆς κλήσεως ὑμῶν
  choice: നിങ്ങളുടെ വിളിയുടെ
  rationale: ἐκλήθητε–κλῆσις എന്ന പദബന്ധം ‘വിളിക്കപ്പെട്ടു–വിളി’ എന്നായി സംരക്ഷിക്കുകയും ജനിറ്റീവ് ബന്ധം അമിതമായി വിശദീകരിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: πνεῦμα എന്നതിന്റെ സൂചിതാർത്ഥം
  choice: പരിശുദ്ധാത്മാവ് എന്ന സാധ്യത മുൻനിർത്തി ‘ആത്മാവ്’
  alternative: വിശ്വാസികൾക്കിടയിലെ ഒരേ ആത്മീയ മനോഭാവം അഥവാ ‘ആത്മാവ്’
  rationale: എഫെസ്യർ 4:4–6-ലെ ‘ഒരു ശരീരം ... ഒരു ആത്മാവ് ... ഒരു കർത്താവ് ... ഒരു ദൈവവും പിതാവും’ എന്ന ക്രമം പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്നതായി ശക്തമായി പിന്തുണയ്ക്കുന്നു. എങ്കിലും ഗ്രീക്ക് ലിപി ഈ വ്യത്യാസം നിർണയിക്കാത്തതിനാൽ അടിക്കുറിപ്പിലൂടെ അർത്ഥസാധ്യത സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ശരീരം’, ‘വിളി’, ‘പ്രത്യാശ’ എന്നീ രൂപക-ദൈവശാസ്ത്ര പദങ്ങൾ വിശദീകരിച്ച് ചുരുക്കാതെ നിലനിർത്തി; ആവർത്തനത്തിലെ ഐക്യഊന്നൽ സ്വാഭാവിക മലയാളവാക്യക്രമത്തിൽ സംരക്ഷിച്ചു.
