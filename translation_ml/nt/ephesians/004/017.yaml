  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണമായ മലയാളം. ‘നടക്കുക’ എന്ന ആവർത്തിത രൂപകം മനപ്പൂർവം നിലനിർത്തി. വാക്യത്തിലെ ഇരട്ട ‘ചെയ്യുകയും’ ഘടന ഗ്രീക്കിലെ λέγω καὶ μαρτύρομαι എന്ന കൂട്ടുപ്രയോഗത്തെ വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്നു.
