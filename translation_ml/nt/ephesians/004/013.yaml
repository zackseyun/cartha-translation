id: EPH.4.13
reference: Ephesians 4:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μέχρι καταντήσωμεν οἱ πάντες εἰς τὴν ἑνότητα τῆς πίστεως καὶ τῆς ἐπιγνώσεως τοῦ υἱοῦ τοῦ θεοῦ, εἰς ἄνδρα τέλειον, εἰς μέτρον ἡλικίας τοῦ πληρώματος τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/013.yaml
  text: until we all attain to the unity of the faith and of the knowledge of the Son of God[a], to a mature man, to the measure of the stature of the fullness of Messiah[e][d][c][b],
translation:
  language: ml
  text: നാം എല്ലാവരും വിശ്വാസത്തിന്റെയും[a] ദൈവപുത്രനെക്കുറിച്ചുള്ള പരിജ്ഞാനത്തിന്റെയും[b] ഐക്യത്തിലേക്കും, പക്വനായ ഒരു പുരുഷനിലേക്കും[c], മശീഹയുടെ[e] നിറവിന്റെ വളർച്ചയുടെ[d] അളവിലേക്കും എത്തിച്ചേരുന്നതുവരെ—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വിശ്വാസം’ എന്നത് സഭ പങ്കിടുന്ന വിശ്വാസസത്യങ്ങളുടെ സമാഹാരത്തെയോ വിശ്വാസികൾ പ്രകടിപ്പിക്കുന്ന വിശ്വാസത്തെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
  - marker: b
    text: ‘പരിജ്ഞാനം’ എന്നതിന് ‘പൂർണമായ അറിവ്’ എന്നോ ‘ആഴത്തിലുള്ള അറിവ്’ എന്നോ വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘പക്വമായ പുരുഷാവസ്ഥയിലേക്ക്.’ ഗ്രീക്കിൽ അക്ഷരാർഥം ‘പക്വനായ ഒരു പുരുഷനിലേക്ക്’ എന്നാണ്; സഭ മുഴുവനും കൈവരിക്കേണ്ട സമൂഹപക്വതയെ പുല്ലിംഗ ഏകവചന രൂപകത്തിലൂടെ ചിത്രീകരിക്കുന്നു.
    reason: lexical_alternative
  - marker: d
    text: ‘വളർച്ച’ എന്നതിന് ‘പക്വത’ എന്നോ ‘ഉയരം’ എന്നോ വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: e
    text: 'ഗ്രീക്ക്: ‘ക്രിസ്തു.’ അഭിഷിക്തൻ എന്ന സ്ഥാനപ്പേരിന്റെ അർത്ഥം ഇവിടെ മുൻനിൽക്കുന്നതിനാൽ ‘മശീഹ’ എന്നു നൽകിയിരിക്കുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: μέχρι καταντήσωμεν οἱ πάντες
  choice: നാം എല്ലാവരും ... എത്തിച്ചേരുന്നതുവരെ
  rationale: μέχριയോടുകൂടിയ ഉപവാക്യം മുമ്പത്തെ ശുശ്രൂഷയുടെ ലക്ഷ്യപരിധി സൂചിപ്പിക്കുന്നു; οἱ πάντες സഭാസമൂഹത്തെ മുഴുവനായി ഉൾക്കൊള്ളുന്നു.
- source_word: εἰς τὴν ἑνότητα τῆς πίστεως καὶ τῆς ἐπιγνώσεως
  choice: വിശ്വാസത്തിന്റെയും ദൈവപുത്രനെക്കുറിച്ചുള്ള പരിജ്ഞാനത്തിന്റെയും ഐക്യത്തിലേക്ക്
  rationale: രണ്ട് സമാന്തര ജനിറ്റീവ് ഘടകങ്ങളും ἑνότηταയോടു ബന്ധിപ്പിക്കുന്ന ഗ്രീക്ക് ഘടന വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἐπίγνωσις
  choice: പരിജ്ഞാനം
  rationale: സാധാരണ അറിവിനേക്കാൾ ആഴമുള്ള അറിവെന്ന സാധ്യത സൂക്ഷിക്കുന്നതോടൊപ്പം, ഗ്രീക്ക് പദത്തിന്റെ തീവ്രത അമിതമായി നിർവചിക്കാത്ത മാന്യമായ ആധുനിക പദം.
- source_word: εἰς ἄνδρα τέλειον
  choice: പക്വനായ ഒരു പുരുഷനിലേക്ക്
  rationale: ἀνήρ എന്ന പുല്ലിംഗ ഏകവചന രൂപകം നിലനിർത്തുന്നു; വളർച്ചയുടെ സന്ദർഭത്തിൽ τέλειος എന്നതിന് ‘പക്വനായ’ എന്നത് ‘പരിപൂർണനായ’ എന്നതിനെക്കാൾ യോജിക്കുന്നു.
- source_word: εἰς μέτρον ἡλικίας τοῦ πληρώματος
  choice: നിറവിന്റെ പക്വതയുടെ അളവിലേക്ക്
  rationale: μέτρον എന്ന അളവിന്റെ ആശയവും πλήρωμα എന്ന ദൈവശാസ്ത്രഭാരമുള്ള ‘നിറവ്’ എന്ന ആശയവും നിലനിർത്തുന്നു; ἡλικία ഇവിടെ ശരീരവളർച്ചാരൂപകത്തിൽ പക്വതയെ സൂചിപ്പിക്കുന്നു.
- source_word: τοῦ Χριστοῦ
  choice: മശീഹയുടെ
  rationale: Χριστός ഇവിടെ അഭിഷിക്തനെ സൂചിപ്പിക്കുന്ന ദൈവശാസ്ത്രപരമായ സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നതിനാൽ ‘മശീഹ’ എന്നു വിവർത്തനം ചെയ്തു.
theological_decisions:
- issue: τῆς πίστεως എന്നതിന്റെ അർത്ഥം
  choice: വിശ്വാസം; അടിക്കുറിപ്പിൽ സഭ പങ്കിടുന്ന വിശ്വാസസംഹിത എന്ന സാധ്യത
  alternative: വിശ്വാസികളുടെ വ്യക്തിപരമായ വിശ്വാസം അല്ലെങ്കിൽ ആശ്രയം
  rationale: നിശ്ചയോപപദവും സമൂഹത്തിന്റെ ഐക്യവും വളർച്ചയും പറയുന്ന സന്ദർഭവും പങ്കിടുന്ന വിശ്വാസത്തെ അനുകൂലിക്കുന്നു; എന്നാൽ മലയാള മുഖ്യപാഠം വിവാദം തീർപ്പാക്കാതെ ‘വിശ്വാസം’ എന്നു നിലനിർത്തുന്നു.
- issue: εἰς ἄνδρα τέλειον എന്ന സമൂഹരൂപകം
  choice: പക്വനായ ഒരു പുരുഷനിലേക്ക്
  alternative: പക്വമായ പുരുഷാവസ്ഥയിലേക്ക്; പൂർണവളർച്ചയിലേക്ക്
  rationale: സഭ മുഴുവനെയും ഏകപുരുഷനായി ചിത്രീകരിക്കുന്ന ഗ്രീക്ക് പുല്ലിംഗ ഏകവചന രൂപകം മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ചു.
- issue: ἡλικίας എന്ന പദത്തിന്റെ അർത്ഥം
  choice: പക്വത
  alternative: ഉയരം; വളർച്ച
  rationale: സന്ദർഭത്തിലെ ആത്മീയവും സമൂഹപരവുമായ വളർച്ചയ്ക്ക് ‘പക്വത’ സ്വാഭാവികമാണ്; ശരീരവളർച്ചയുടെ രൂപകത്താൽ ‘ഉയരം/വളർച്ച’ എന്ന അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- issue: Χριστοῦ എന്ന സ്ഥാനപ്പേര്
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ പദം പേരുപോലെ മാത്രം അല്ല, ദൈവത്തിന്റെ അഭിഷിക്തൻ എന്ന സ്ഥാനപ്പേരായും ദൈവശാസ്ത്രപരമായും പ്രവർത്തിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായിക്കാൻ എളുപ്പവുമായ ശൈലി. ഗ്രീക്കിലെ ആവർത്തിക്കുന്ന εἰς ലക്ഷ്യഘടനകൾ ‘ഐക്യത്തിലേക്കും ... പുരുഷനിലേക്കും ... അളവിലേക്കും’ എന്ന ക്രമത്തിൽ നിലനിർത്തി. വാക്യം മുൻവാക്യത്തിന്റെ തുടർച്ചയായതിനാൽ അവസാനം ദീർഘരേഖ ഉപയോഗിച്ചു.
