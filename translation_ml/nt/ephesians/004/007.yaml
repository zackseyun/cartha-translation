id: EPH.4.7
reference: Ephesians 4:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἑνὶ δὲ ἑκάστῳ ἡμῶν ἐδόθη ⸀ἡ χάρις κατὰ τὸ μέτρον τῆς δωρεᾶς τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/007.yaml
  text: But grace was given to each one of us according to the measure of Messiah’s gift[a].
translation:
  language: ml
  text: എന്നാൽ നമ്മിൽ ഓരോരുത്തനും മശീഹയുടെ ദാനത്തിന്റെ അളവനുസരിച്ച് കൃപ നൽകപ്പെട്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ക്രിസ്തുവിന്റെ ദാനം.” ഗ്രീക്കിലെ Χριστοῦ എന്ന സ്ഥാനപ്പേര് പേരുപോലെ പ്രവർത്തിക്കുന്നിടത്ത് “ക്രിസ്തു” എന്നു നൽകാം; ഇവിടെ “മശീഹ” എന്നത് സ്ഥാനപ്പേരിന്റെ അർഥം നിലനിർത്തുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἑνὶ ... ἑκάστῳ ἡμῶν
  choice: നമ്മിൽ ഓരോരുത്തനും
  rationale: ἑνὶയും ἑκάστῳയും ചേർന്നുള്ള ഊന്നലോടുകൂടിയ വിതരണാർഥം നിലനിർത്തുന്നു; സമൂഹത്തിലെ ഓരോ വ്യക്തിയെയും പ്രത്യേകം സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യങ്ങളിലെ ഐക്യത്തിൽനിന്ന് കൃപയുടെ വ്യക്തിഗതവും വ്യത്യസ്തവുമായ പങ്കുവെപ്പിലേക്കുള്ള മൃദുവായ വൈരുധ്യപരമായ തിരിവ് സൂചിപ്പിക്കുന്നു.
- source_word: ἐδόθη
  choice: നൽകപ്പെട്ടു
  rationale: അയോറിസ്റ്റ് കർമണിപ്രയോഗത്തെ ലളിതമായ ഭൂതകാല കർമണിരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἡ χάρις
  choice: കൃപ
  rationale: ശുശ്രൂഷയ്ക്കായി നൽകപ്പെടുന്ന കൃപാപൂർവമായ പ്രാപ്തി എന്ന സന്ദർഭാർഥം ഉൾക്കൊള്ളുമ്പോഴും പൗലോസിന്റെ ദൈവശാസ്ത്രപരമായ പദപ്രയോഗം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: κατὰ τὸ μέτρον
  choice: അളവനുസരിച്ച്
  rationale: κατά ഇവിടെ മാനദണ്ഡമോ അനുപാതമോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി ആ ആശയം നൽകുന്നു.
- source_word: τῆς δωρεᾶς
  choice: ദാനത്തിന്റെ
  rationale: δωρεάയുടെ സൗജന്യമായി നൽകപ്പെട്ട സമ്മാനം എന്ന ആശയം 'ദാനം' സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: τοῦ Χριστοῦ
  choice: മശീഹയുടെ
  rationale: Χριστός എന്ന പദത്തിന്റെ സ്ഥാനപ്പേരായ അർഥം ഇവിടെ സജീവമായതിനാൽ പരമ്പരാഗത ലിപ്യന്തരണത്തിന് പകരം അതിന്റെ അർഥം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ഈ സന്ദർഭത്തിലെ χάρις എന്ന പദത്തിന്റെ അർഥം
  choice: '''കൃപ'' എന്നതുതന്നെ നിലനിർത്തി; സന്ദർഭത്തിൽ അത് സഭയിലെ ഓരോരുത്തർക്കും പങ്കിട്ടുനൽകുന്ന ശുശ്രൂഷാപ്രാപ്തിയെയും ഉൾക്കൊള്ളുന്നു.'
  alternative: പൊതുവായ ദൈവാനുകൂല്യം; രക്ഷാകൃപ മാത്രം; കൃപാദാനം
  rationale: 7–11 വാക്യങ്ങളുടെ സന്ദർഭം വ്യത്യസ്ത ശുശ്രൂഷാദാനങ്ങളിലേക്കാണ് നീങ്ങുന്നത്. എങ്കിലും 'കൃപാദാനം' എന്നു വ്യാഖ്യാനിച്ച് വിവർത്തനം ചെയ്യാതെ ഗ്രീക്കിലെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തിയും സംഘർഷവും നിലനിർത്തുന്നു.
- issue: τοῦ Χριστοῦ എന്നതിലെ ജനിറ്റീവിന്റെ ബന്ധം
  choice: മശീഹയുടെ ദാനം
  alternative: മശീഹ നൽകുന്ന ദാനം; മശീഹ തന്നെയാകുന്ന ദാനം
  rationale: ജനിറ്റീവ് ഉടമസ്ഥതയെയോ ഉറവിടത്തെയോ സൂചിപ്പിക്കാം. മൂലപാഠം ബന്ധം വ്യക്തമായി പരിമിതപ്പെടുത്താത്തതിനാൽ മലയാളത്തിലും സ്വാഭാവികമായ ജനിറ്റീവ് ഉപയോഗിച്ച് ആ അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
- issue: Χριστοῦ എന്ന സ്ഥാനപ്പേരിന്റെ വിവർത്തനം
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ സ്ഥാനപ്പേരിന്റെ അർഥം സജീവമായി നിലകൊള്ളുന്നതിനാൽ 'മശീഹ' ഉപയോഗിക്കുന്നു; പരിചിതമായ മറ്റൊരു രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. 'നമ്മിൽ ഓരോരുത്തനും' എന്ന പ്രയോഗം വ്യക്തിഗത പങ്കുവെപ്പിലെ ഊന്നൽ നിലനിർത്തുന്നു. 'അളവനുസരിച്ച്' എന്നത് കൃത്യമായ അനുപാതം സൂചിപ്പിക്കുമ്പോഴും അസ്വാഭാവികമായ പദാനുപദഘടന ഒഴിവാക്കുന്നു.
