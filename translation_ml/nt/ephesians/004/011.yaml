source:
  edition: SBLGNT
  text: καὶ αὐτὸς ἔδωκεν τοὺς μὲν ἀποστόλους, τοὺς δὲ προφήτας, τοὺς δὲ εὐαγγελιστάς, τοὺς δὲ ποιμένας καὶ διδασκάλους,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/011.yaml
  text: And he himself gave some as apostles[a], some as prophets, some as evangelists, and some as shepherds and teachers[b],
translation:
  language: ml
  text: അവൻതന്നെ ചിലരെ അപ്പൊസ്തലന്മാരായും, ചിലരെ പ്രവാചകന്മാരായും, ചിലരെ സുവിശേഷകരായും, ചിലരെ ഇടയന്മാരായും[a] അധ്യാപകരായും[b] നൽകി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പാസ്റ്റർമാർ.’ ഗ്രീക്കിൽ അക്ഷരാർഥം ‘ഇടയന്മാർ’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘ഇടയന്മാരും അധ്യാപകരും’ എന്നതിനു മുമ്പ് ഗ്രീക്കിൽ ഒരൊറ്റ ആർട്ടിക്കിൾ മാത്രമാണുള്ളത്. അതിനാൽ ഈ ചുമതലകൾ തമ്മിൽ അടുത്ത ബന്ധമുണ്ടാകാമെങ്കിലും, ഈ പ്രയോഗം അവ നിർബന്ധമായും ഒരൊറ്റ പദവിയാണെന്ന് തെളിയിക്കുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ αὐτὸς
  choice: അവൻതന്നെ
  rationale: καὶ ഈ വാക്യത്തെ മുൻസന്ദർഭത്തോടു ബന്ധിപ്പിക്കുന്നു; എന്നാൽ മലയാളത്തിൽ വാക്യാരംഭത്തിലെ വേറിട്ട ‘കൂടാതെ/എന്നിട്ട്’ അനാവശ്യമായി ഭാരമുള്ളതിനാൽ, αὐτός നൽകുന്ന ഊന്നൽ ‘അവൻതന്നെ’ എന്നതിൽ സ്വാഭാവികമായി നിലനിർത്തി.
- source_word: ἔδωκεν
  choice: നൽകി
  rationale: δίδωμι എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം നിലനിർത്തുന്നു. ‘നിയമിച്ചു’ എന്നു വിവർത്തനം ചെയ്താൽ മൂലപാഠത്തേക്കാൾ നിർദിഷ്ടമായ ഔദ്യോഗിക അർഥം ചേർന്നുപോകും.
- source_word: τοὺς μὲν ... τοὺς δὲ
  choice: ചിലരെ ... ചിലരെ
  rationale: μέν/δέ സഹിതമുള്ള ആവർത്തിത ആർട്ടിക്കിളുകൾ ആളുകളെ വിവിധ വിഭാഗങ്ങളായി വിതരണം ചെയ്യുന്നു; മലയാളത്തിലെ ‘ചിലരെ ... ചിലരെ’ ഈ ഘടന സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀποστόλους
  choice: അപ്പൊസ്തലന്മാർ
  rationale: പുതിയനിയമസന്ദർഭത്തിൽ സ്ഥാപിതവും അർഥകൃത്യവുമായ പദം; ഇവിടെ ബഹുവചന കർമരൂപമായി ‘അപ്പൊസ്തലന്മാരായും’ എന്നു വന്നു.
- source_word: προφήτας
  choice: പ്രവാചകന്മാർ
  rationale: προφήτης എന്നതിന്റെ നേരിട്ടുള്ള, പൊതുവേ മനസ്സിലാകുന്ന മലയാളപരിഭാഷ.
- source_word: εὐαγγελιστάς
  choice: സുവിശേഷകർ
  rationale: സുവിശേഷം അറിയിക്കുന്ന ശുശ്രൂഷകരെ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തവും നിലവിലുള്ളതുമായ മലയാളപദം.
- source_word: ποιμένας
  choice: ഇടയന്മാർ
  rationale: ποιμήν എന്നതിലെ ‘ആട്ടിടയൻ’ എന്ന രൂപകം നിലനിർത്തുന്നു; സഭാപദവിയായ ‘പാസ്റ്റർമാർ’ എന്ന പരമ്പരാഗത സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: διδασκάλους
  choice: ഉപദേഷ്ടാക്കൾ
  rationale: പഠിപ്പിക്കുന്ന ശുശ്രൂഷകരെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ സഭാസന്ദർഭപദം; സാധാരണ വിദ്യാഭ്യാസസ്ഥാപനത്തിലെ തൊഴിൽപദമെന്ന ധ്വനി കൂടുതലുള്ള ‘അധ്യാപകർ’ ഒഴിവാക്കി.
theological_decisions:
- issue: ποιμένας എന്നത് രൂപകാത്മകമായി വിവർത്തനം ചെയ്യണമോ സഭാപദവിയായി വിവർത്തനം ചെയ്യണമോ
  choice: പ്രധാനപാഠത്തിൽ ‘ഇടയന്മാർ’
  alternative: ‘പാസ്റ്റർമാർ’
  rationale: മൂലഗ്രീക്കിലെ ഇടയരൂപകം പ്രധാനപാഠത്തിൽ സംരക്ഷിച്ചു. പിൽക്കാല സഭാപദവിയുടെ ധ്വനി കൂടുതൽ ശക്തമായ ‘പാസ്റ്റർമാർ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- issue: ‘ഇടയന്മാരും ഉപദേഷ്ടാക്കളും’ ഒരൊറ്റ സംയുക്ത ചുമതലയെയാണോ രണ്ടു വ്യത്യസ്ത ചുമതലകളെയാണോ സൂചിപ്പിക്കുന്നത്
  choice: രണ്ട് നാമങ്ങളും ഏകോപിപ്പിച്ച് വിവർത്തനം ചെയ്തു; ബന്ധത്തിന്റെ കൃത്യസ്വഭാവം നിർണയിച്ചില്ല
  alternative: ‘ഇടയ-ഉപദേഷ്ടാക്കൾ’ എന്ന ഒരൊറ്റ സംയുക്ത വിഭാഗമായി അവതരിപ്പിക്കുക
  rationale: രണ്ടു നാമങ്ങൾക്കും മുമ്പിൽ ഒരൊറ്റ ആർട്ടിക്കിൾ മാത്രമുള്ളത് അടുത്ത ബന്ധം സൂചിപ്പിക്കാം; എന്നാൽ അത് നിർബന്ധമായും ഒരൊറ്റ പദവിയാണെന്ന് വ്യാകരണം തെളിയിക്കുന്നില്ല. അതിനാൽ മൂലപാഠത്തിലെ വ്യാഖ്യാനസാധ്യത തുറന്നുവച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി പിന്തുടർന്നു. ശുശ്രൂഷാഭൂമികകളുടെ പട്ടികയിൽ സമാന്തരത നിലനിർത്തുകയും, ‘അവൻതന്നെ’ എന്നതിലൂടെ കർത്താവിന്റെ വ്യക്തിപരമായ പ്രവർത്തനത്തിന് ഗ്രീക്ക് നൽകുന്ന ഊന്നൽ സംരക്ഷിക്കുകയും ചെയ്തു.
