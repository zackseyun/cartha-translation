  to: അവൻതന്നെ ചിലരെ അപ്പൊസ്തലന്മാരായും, ചിലരെ പ്രവാചകന്മാരായും, ചിലരെ സുവിശേഷകരായും, ചിലരെ ഇടയന്മാരായും[a] അധ്യാപകരായും[b] നൽകി.
