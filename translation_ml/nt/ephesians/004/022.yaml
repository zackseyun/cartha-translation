- from: നിങ്ങളുടെ മുൻകാല ജീവിതരീതിയെ സംബന്ധിച്ചിടത്തോളം, വഞ്ചനയുടെ മോഹങ്ങൾക്കനുസരിച്ച് ദുഷിച്ചുകൊണ്ടിരിക്കുന്ന പഴയ മനുഷ്യനെ[a] അഴിച്ചുകളയാൻ[b],
