  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b].
translation:
  language: ml
  text: നമ്മുടെ പിതാവായ ദൈവത്തിൽനിന്നും കർത്താവായ യേശു മശീഹയിൽനിന്നും നിങ്ങൾക്കു കൃപയും സമാധാനവും ഉണ്ടാകട്ടെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘കർത്താവായ യേശുക്രിസ്തുവിൽനിന്നും.’ ഗ്രീക്ക് Χριστός എന്ന പദം ‘മശീഹ’ എന്ന സ്ഥാനനാമമായോ ചില സന്ദർഭങ്ങളിൽ ‘ക്രിസ്തു’ എന്ന നാമസദൃശരൂപമായോ ഉപയോഗിക്കാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: കൃപ
  rationale: പൗലോസിന്റെ അഭിവാദനത്തിൽ സാധാരണ ആശംസയും ദൈവിക അനുഗ്രഹവും ഒരുമിച്ചു സൂചിപ്പിക്കുന്നതിനാൽ സ്ഥാപിതവും അർത്ഥസമ്പന്നവുമായ പദം.
- source_word: ὑμῖν
  choice: നിങ്ങൾക്കു
  rationale: ദത്തിവ് രൂപത്തിന്റെ സ്വാഭാവിക മലയാളപ്രയോഗം; ആശംസയുടെ സ്വീകർത്താക്കളെ വ്യക്തമാക്കുന്നു.
- source_word: εἰρήνη
  choice: സമാധാനം
  rationale: സാധാരണ സമാധാനത്തെയും യഹൂദ ‘ശാലോം’ ആശയത്തിന്റെ സമഗ്രക്ഷേമധ്വനിയെയും നിലനിർത്തുന്നു.
- source_word: ἀπὸ
  choice: നിന്നും
  rationale: കൃപയുടെയും സമാധാനത്തിന്റെയും ഉറവിടത്തെ സൂചിപ്പിക്കുന്നു; രണ്ടു സമാന്തര ഉറവിടപദങ്ങളോടും ചേർത്ത് സ്വാഭാവികമായി ആവർത്തിച്ചു.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: നമ്മുടെ പിതാവായ ദൈവം
  rationale: πατρὸς ἡμῶν എന്നത് θεοῦ-നെ സമാനാധികരണമായി വിശേഷിപ്പിക്കുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത ‘ഉം’ ചേർത്ത് ‘നമ്മുടെ ദൈവവും പിതാവും’ എന്നാക്കുന്നത് ഒഴിവാക്കുന്നു.
- source_word: κυρίου
  choice: കർത്താവ്
  rationale: κύριος എന്ന ക്രിസ്തുശാസ്ത്രപരമായ സ്ഥാനനാമത്തിന്റെ സ്ഥാപിതവും ഗൗരവമുള്ളതുമായ മലയാളരൂപം.
- source_word: Ἰησοῦ Χριστοῦ
  choice: യേശുമശീഹ
  rationale: Χριστός-ന്റെ ‘മശീഹ’ എന്ന സ്ഥാനനാമാർത്ഥം സുതാര്യമാക്കുന്നു; മലയാളത്തിൽ യേശുവിന്റെ സ്ഥാനനാമത്തോടുകൂടിയ സ്വാഭാവിക സംയുക്തപ്രയോഗം.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ എന്ന സ്ഥാനനാമ-നാമക്രമത്തിലെ Χριστοῦ-ന്റെ പരിഭാഷ
  choice: യേശുമശീഹ
  alternative: യേശുക്രിസ്തു
  rationale: Χριστός എന്ന പദത്തിന്റെ ‘അഭിഷിക്തൻ/മശീഹ’ എന്ന സ്ഥാനനാമബലം പ്രധാനപാഠത്തിൽ പ്രകടമാക്കുന്നു; പാരമ്പര്യ നാമസദൃശരൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: θεοῦ πατρὸς ἡμῶν എന്ന ഘടന
  choice: നമ്മുടെ പിതാവായ ദൈവം
  alternative: നമ്മുടെ ദൈവവും പിതാവും
  rationale: ഗ്രീക്കിലെ പദക്രമവും സമാനാധികരണബന്ധവും കാത്തുസൂക്ഷിക്കുകയും മൂലത്തിൽ ഇല്ലാത്ത സംയോജകത്തെ ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- issue: നാമവാക്യരൂപത്തിലുള്ള അനുഗ്രഹാശംസ
  choice: ഉണ്ടാകട്ടെ എന്ന ക്രിയ ചേർത്തു
  alternative: നിങ്ങൾക്കു കൃപയും സമാധാനവും
  rationale: ഗ്രീക്കിൽ ക്രിയ അധ്യാഹരിക്കപ്പെട്ടിരിക്കുന്നു; മലയാളത്തിൽ ആശംസയായി സ്വാഭാവികവും വ്യക്തവുമാകാൻ ‘ഉണ്ടാകട്ടെ’ ചേർക്കുന്നു, എന്നാൽ ആശീർവാദസ്വഭാവം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന, എന്നാൽ ആരാധനാപരമായ ഗൗരവം നിലനിർത്തുന്ന ശൈലി. മലയാളത്തിലെ സ്വാഭാവിക ആശംസാരൂപത്തിനായി അധ്യാഹരിക്കപ്പെട്ട ക്രിയ ‘ഉണ്ടാകട്ടെ’ എന്നു വ്യക്തമാക്കി.
