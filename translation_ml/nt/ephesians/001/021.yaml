id: EPH.1.21
reference: Ephesians 1:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὑπεράνω πάσης ἀρχῆς καὶ ἐξουσίας καὶ δυνάμεως καὶ κυριότητος καὶ παντὸς ὀνόματος ὀνομαζομένου οὐ μόνον ἐν τῷ αἰῶνι τούτῳ ἀλλὰ καὶ ἐν τῷ μέλλοντι·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/021.yaml
  text: far above every rule and authority and power and dominion[a], and every name that is named[c][b], not only in this age but also in the one to come.
translation:
  language: ml
  text: എല്ലാ ഭരണത്തിനും അധികാരത്തിനും ശക്തിക്കും ആധിപത്യത്തിനും, വിളിക്കപ്പെടുന്ന എല്ലാ നാമത്തിനും വളരെ മീതെ—ഈ യുഗത്തിൽ മാത്രമല്ല, വരാനിരിക്കുന്ന യുഗത്തിലും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπεράνω
  choice: അത്യന്തം മീതെ
  rationale: ക്രിസ്തുവിന്റെ പരമമായ ഔന്നത്യവും മേന്മയും സൂചിപ്പിക്കുന്ന തീവ്രത സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: πάσης ἀρχῆς
  choice: എല്ലാ ഭരണത്തിനും
  rationale: ἀρχή ഇവിടെ ഭരണാധികാരത്തിന്റെ വിഭാഗത്തെയോ ഭരണശക്തിയെയോ സൂചിപ്പിക്കുന്നു; വ്യക്തികളായ ഭരണാധികാരികൾ എന്നു ചുരുക്കാതെ അമൂർത്തമായ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: ἐξουσίας
  choice: അധികാരത്തിനും
  rationale: ഏൽപ്പിക്കപ്പെട്ടതോ പ്രയോഗിക്കപ്പെടുന്നതോ ആയ അധികാരം എന്ന അർഥം നൽകുകയും δύναμις എന്ന പദത്തിൽനിന്നുള്ള വ്യത്യാസം കാത്തുസൂക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: δυνάμεως
  choice: ശക്തിക്കും
  rationale: ശേഷി/ബലം എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു; അധികാരം എന്ന മുൻപദവുമായി ലയിപ്പിക്കുന്നില്ല.
- source_word: κυριότητος
  choice: ആധിപത്യത്തിനും
  rationale: കർത്തൃത്വമോ അധീശത്വമോ എന്ന അധികാരവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു; ദൈവിക സ്ഥാനനാമമായ ‘കർത്താവ്’ എന്നതുമായി അനാവശ്യ ആശയക്കുഴപ്പം ഒഴിവാക്കുന്നു.
- source_word: παντὸς ὀνόματος ὀνομαζομένου
  choice: വിളിക്കപ്പെടുന്ന എല്ലാ നാമത്തിനും
  rationale: ‘നാമം’ എന്നതിന്റെ വിശാലതയും ὀνομάζω എന്ന ക്രിയയുമായുള്ള ഗ്രീക്ക് ആവർത്തനവും കഴിയുന്നത്ര നിലനിർത്തുന്നു; പദവി എന്ന ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: മാത്രമല്ല ... -ത്തിലും
  rationale: ഗ്രീക്കിലെ പരസ്പരബന്ധിത ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐν τῷ αἰῶνι τούτῳ
  choice: ഈ യുഗത്തിൽ
  rationale: αἰών എന്നതിന്റെ കാലപരമായ അർഥവും വരാനിരിക്കുന്ന യുഗത്തോടുള്ള വൈരുധ്യവും സംരക്ഷിക്കുന്നു.
- source_word: ἐν τῷ μέλλοντι
  choice: വരാനിരിക്കുന്ന യുഗത്തിലും
  rationale: ഗ്രീക്കിൽ മുൻപുള്ള αἰών അർഥത്തിൽ ഉൾക്കൊള്ളപ്പെട്ടിരിക്കുന്നതിനാൽ, മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ‘യുഗം’ ആവർത്തിക്കുന്നു.
theological_decisions:
- issue: ἀρχή, ἐξουσία, δύναμις, κυριότης എന്നീ ശക്തികളുടെ സ്വഭാവം
  choice: മനുഷ്യരോ ദൂതന്മാരോ എന്നു പ്രധാനപാഠത്തിൽ നിർണ്ണയിക്കാതെ ഭരണത്തിന്റെയും അധികാരത്തിന്റെയും വിശാല വിഭാഗങ്ങളായി പരിഭാഷപ്പെടുത്തുക.
  alternative: പ്രാപഞ്ചിക/ആത്മിക ശക്തികളെന്നോ ദൂതഗണങ്ങളുടെ പദവികളെന്നോ വ്യക്തമായി വിവർത്തനം ചെയ്യുക.
  rationale: സന്ദർഭത്തിൽ ആത്മികമോ പ്രാപഞ്ചികമോ ആയ ശക്തികൾ ഉൾപ്പെട്ടിരിക്കാമെങ്കിലും, ഗ്രീക്ക് അവയുടെ അസ്തിത്വസ്വഭാവം വ്യക്തമാക്കാതെ അധികാരവിഭാഗങ്ങളുടെ പട്ടികയാണ് നൽകുന്നത്. അതിനാൽ ഉള്ളിലെ വ്യാപ്തിയും ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും സംരക്ഷിക്കുന്നു.
- issue: παντὸς ὀνόματος എന്നതിലെ ‘നാമം’
  choice: ‘നാമം’ എന്ന വിശാലവും ആലങ്കാരികവുമായ പദം പ്രധാനപാഠത്തിൽ നിലനിർത്തുക.
  alternative: ‘നൽകപ്പെടുന്ന എല്ലാ പദവിയും’ എന്നു വ്യാഖ്യാനപരമായി വിവർത്തനം ചെയ്യുക.
  rationale: ഇത് പദവികളെയും സ്ഥാനങ്ങളെയും അധികാരങ്ങളെയും ഉൾക്കൊള്ളാമെങ്കിലും, മൂലപാഠം ‘നാമം’ എന്നു പറയുന്നതിനാൽ അതിന്റെ വ്യാപ്തി ചുരുക്കാതിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വാക്യം മുൻവാക്യത്തെ ആശ്രയിക്കുന്ന ഖണ്ഡമായതിനാൽ അതിന്റെ തുടർച്ചാസ്വഭാവം നിലനിർത്തിയിരിക്കുന്നു. അധികാരപദങ്ങളുടെ ക്രമവും വ്യത്യാസവും കഴിയുന്നത്ര സംരക്ഷിച്ചു; പ്രസിദ്ധമായെങ്കിലും കൂടുതൽ സാങ്കേതികമായ പദങ്ങൾ അടിക്കുറിപ്പിൽ നൽകി.
