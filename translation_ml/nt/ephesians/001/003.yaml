source:
  edition: SBLGNT
  text: Εὐλογητὸς ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ εὐλογήσας ἡμᾶς ἐν πάσῃ εὐλογίᾳ πνευματικῇ ἐν τοῖς ἐπουρανίοις ἐν Χριστῷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/003.yaml
  text: Blessed be the God and Father of our Lord Jesus the Messiah[a], who has blessed us with every spiritual blessing in the heavenly realms in Messiah[c][b],
translation:
  language: ml
  text: നമ്മുടെ കർത്താവായ യേശു മശീഹയുടെ[c] ദൈവവും പിതാവുമായവൻ വാഴ്ത്തപ്പെട്ടവൻ. അവൻ മശീഹയിൽ, സ്വർഗീയ മണ്ഡലങ്ങളിലെ[b] എല്ലാ ആത്മീയ[a] അനുഗ്രഹങ്ങളാലും നമ്മെ അനുഗ്രഹിച്ചിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ആത്മാവിനോടു ബന്ധപ്പെട്ട എല്ലാ അനുഗ്രഹങ്ങളും.’ ഗ്രീക്ക് വിശേഷണം പൊതുവായി ‘ആത്മീയ’ എന്നും പ്രത്യേകമായി ദൈവാത്മാവിനോടു ബന്ധപ്പെട്ടത് എന്നും അർഥമാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘സ്വർഗീയ സ്ഥലങ്ങളിലെ.’
    reason: lexical_alternative
  - marker: c
    text: 'പരമ്പരാഗത പരിഭാഷ: ‘യേശുക്രിസ്തുവിന്റെ’ എന്നും പിന്നീട് ‘ക്രിസ്തുവിൽ’ എന്നും. Χριστός എന്ന ഗ്രീക്ക് സ്ഥാനപ്പേരിന്റെ അർഥം വ്യക്തമാക്കാൻ ഇവിടെ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: വാഴ്ത്തപ്പെടട്ടെ
  rationale: ദൈവത്തെ അഭിസംബോധന ചെയ്യുന്ന സ്തുതിവാക്യത്തിന്റെ ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു; വെറും ഗുണവിശേഷണമായി ചുരുക്കുന്നില്ല.
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: ദൈവവും പിതാവുമായവൻ
  rationale: ഒരേ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ഘടന നിലനിർത്തുകയും ‘ദൈവം’, ‘പിതാവ്’ എന്നീ രണ്ടു ബന്ധപദങ്ങളും സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: τοῦ κυρίου ἡμῶν
  choice: നമ്മുടെ കർത്താവായ
  rationale: κύριος എന്ന ക്രിസ്തുശാസ്ത്രപരമായ സ്ഥാനപ്പേരിന് മലയാളത്തിലെ സാധാരണവും മാന്യവുമായ ‘കർത്താവ്’ ഉപയോഗിക്കുന്നു.
- source_word: Ἰησοῦ Χριστοῦ
  choice: യേശു എന്ന മശീഹയുടെ
  rationale: Ἰησοῦ ഒരു പേരായും Χριστός ‘മശീഹ’ എന്ന സ്ഥാനപ്പേരായും വ്യക്തമായി അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്ഥാനപ്പേരിന്റെ സ്വഭാവം വ്യക്തമാക്കാൻ ‘എന്ന’ ചേർക്കുന്നു.
- source_word: ὁ εὐλογήσας
  choice: അവൻ ... അനുഗ്രഹിച്ചിരിക്കുന്നു
  rationale: പൂർത്തിയായ ദൈവിക പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ പ്രസക്തി മലയാളത്തിലെ പൂർണ്ണവർത്തമാന രൂപത്തിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: ἐν πάσῃ εὐλογίᾳ πνευματικῇ
  choice: എല്ലാ ആത്മീയ അനുഗ്രഹങ്ങളാലും
  rationale: ‘അനുഗ്രഹിച്ചു’ എന്ന ക്രിയയോടൊപ്പം ἐν-ന്റെ ഉപാധി/ഉള്ളടക്ക അർഥം സ്വാഭാവിക മലയാളത്തിലെ ‘-ആലും’ രൂപത്തിൽ നൽകുന്നു; πνευματικός എന്നതിന്റെ വിശാലത ‘ആത്മീയ’ സംരക്ഷിക്കുന്നു.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: സ്വർഗീയ മണ്ഡലങ്ങളിലെ
  rationale: നാമപദം വ്യക്തമല്ലാത്ത ഗ്രീക്ക് ബഹുവചന വിശേഷണപ്രയോഗത്തെ ഒരു സ്വർഗീയ മേഖല/പരിധി എന്ന നിലയിൽ വായിക്കാവുന്ന ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐν Χριστῷ
  choice: മശീഹയിൽ
  rationale: പൗലോസിന്റെ സാന്ദ്രമായ ‘മശീഹയിൽ’ എന്ന ഐക്യഭാഷ അർഥവ്യാഖ്യാനത്തിലൂടെ വികസിപ്പിക്കാതെ അതേ സംക്ഷിപ്തതയിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: ആദ്യ പ്രയോഗത്തിൽ ‘യേശു എന്ന മശീഹ’; രണ്ടാമത്തേതിൽ ‘മശീഹയിൽ’
  alternative: ‘യേശുക്രിസ്തു’; ‘ക്രിസ്തുവിൽ’
  rationale: Χριστός എന്നതിന്റെ മശീഹാപരമായ സ്ഥാനപ്പേർ അർഥം മുഖ്യപാഠത്തിൽ സുതാര്യമാക്കുന്നു; പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: πνευματικῇ എന്നതിന്റെ പരിധി
  choice: ആത്മീയ
  alternative: ആത്മാവിനോടു ബന്ധപ്പെട്ട / ആത്മാവിനാൽ ലഭിക്കുന്ന
  rationale: ഈ വിശേഷണം പൊതുവായ ‘ആത്മീയ’ അർഥമോ ദൈവാത്മാവിനെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്ന അർഥമോ വഹിക്കാം; മുഖ്യപാഠം ഈ സന്ദിഗ്ധത ചുരുക്കുന്നില്ല.
- issue: ἐν τοῖς ἐπουρανίοις എന്ന പ്രയോഗം
  choice: സ്വർഗീയ മണ്ഡലങ്ങളിലെ
  alternative: സ്വർഗീയ സ്ഥലങ്ങളിലെ
  rationale: സ്വർഗീയ പരിധി/മേഖല എന്ന ആശയം നൽകുന്നു; അതിനെ അമിതമായി ഭൗതിക സ്ഥലങ്ങളായി നിർണ്ണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും ആരാധനാത്മകവുമായ ശൈലി. നീണ്ട ഗ്രീക്ക് വാക്യത്തിന്റെ ബന്ധങ്ങൾ നിലനിർത്തിക്കൊണ്ട് വായനാസൗകര്യത്തിനായി സ്തുതിഭാഗത്തിനു ശേഷം ആശ്ചര്യചിഹ്നം ഉപയോഗിച്ചു. ‘മണ്ഡലം’, ‘ആത്മീയ’, ‘അനുഗ്രഹം’ എന്നീ പരിചിതമായ പദങ്ങൾ ഉപയോഗിച്ച് സഭാപരമായ ഗൗരവവും സാധാരണ വായനക്കാരനുള്ള വ്യക്തതയും സന്തുലിതമാക്കി.
