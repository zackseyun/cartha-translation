source:
  edition: SBLGNT
  text: οὐ παύομαι εὐχαριστῶν ὑπὲρ ὑμῶν ⸀μνείαν ποιούμενος ἐπὶ τῶν προσευχῶν μου,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/016.yaml
  text: I do not cease giving thanks for you[a], making mention of you in my prayers,
translation:
  language: ml
  text: നിങ്ങൾക്കുവേണ്ടി നന്ദി പറയുന്നതും എന്റെ പ്രാർഥനകളിൽ നിങ്ങളെ പരാമർശിക്കുന്നതും ഞാൻ നിർത്തുന്നില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എന്റെ പ്രാർഥനകളിൽ നിങ്ങളെ ഓർക്കുന്നതും.’ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അക്ഷരാർഥം ‘എന്റെ പ്രാർഥനകളിൽ [നിങ്ങളെക്കുറിച്ച്] പരാമർശം നടത്തുന്നതും’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ παύομαι
  choice: നിർത്തുന്നില്ല
  rationale: വർത്തമാനകാലത്തിലുള്ള തുടർച്ചയായ നിർത്താതിരിക്കലിനെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: εὐχαριστῶν
  choice: നന്ദി പറയുന്നതു
  rationale: പ്രധാന ക്രിയയോടൊപ്പം നടക്കുന്ന തുടർച്ചയായ നന്ദിപറച്ചിലിനെ ക്രിയാനാമരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὑπὲρ ὑμῶν
  choice: നിങ്ങൾക്കുവേണ്ടി
  rationale: ഇവിടെ നന്ദി അർപ്പിക്കപ്പെടുന്നത് വായനക്കാരെ സംബന്ധിച്ചാണെന്ന ὑπέρ + genitive പ്രയോഗത്തിന്റെ അർഥം നൽകുന്നു.
- source_word: μνείαν ποιούμενος
  choice: നിങ്ങളെ ഓർക്കുന്നു
  rationale: ‘പരാമർശം നടത്തുന്നു’ എന്ന അക്ഷരാർഥത്തേക്കാൾ പ്രാർഥനാസന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളം; സന്ദർഭത്തിൽ സൂചിതമായ ‘നിങ്ങളെ’ എന്ന കർമം വ്യക്തമാക്കുന്നു.
- source_word: ἐπὶ τῶν προσευχῶν μου
  choice: എന്റെ പ്രാർഥനകളിൽ
  rationale: പരാമർശിക്കുകയോ ഓർക്കുകയോ ചെയ്യുന്ന സന്ദർഭം/അവസരം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിന്റെ തുടർച്ചയും പ്രാർഥനാസന്ദർഭവും സ്വാഭാവികമായി നിലനിർത്തി; ‘ഓർക്കുന്നു’ എന്ന മലയാളപ്രയോഗത്തിന്റെ പിന്നിലെ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകി.
