revisions:
- from: നിങ്ങൾക്കുവേണ്ടി നന്ദി പറയുന്നതു ഞാൻ നിർത്തുന്നില്ല; എന്റെ പ്രാർഥനകളിൽ നിങ്ങളെ ഓർക്കുന്നു.[a]
  to: നിങ്ങൾക്കുവേണ്ടി നന്ദി പറയുന്നതും എന്റെ പ്രാർഥനകളിൽ നിങ്ങളെ പരാമർശിക്കുന്നതും ഞാൻ നിർത്തുന്നില്ല.[a]
  rationale: The revision keeps both present participial actions—giving thanks and making mention—dependent on the single expression of non-cessation. It uses ‘പരാമർശിക്കുന്നതും’ for the more explicit lexical sense of μνείαν ποιούμενος, while preserving ‘ഓർക്കുന്നതും’ as a natural contextual alternative in the footnote.
