  terminology: ‘പരിശുദ്ധാത്മാവ്,’ ‘സുവാർത്ത,’ ‘വചനം,’ ‘മുദ്രയിടപ്പെട്ടു’ എന്നീ പദങ്ങൾ യോജിച്ചതാണ്. ‘വാഗ്ദത്ത പരിശുദ്ധാത്മാവ്’ ഗ്രീക്കിലെ ‘പരിശുദ്ധമായ വാഗ്ദത്തത്തിന്റെ ആത്മാവ്’ എന്ന പദക്രമത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുകയും ‘promised Holy Spirit’ എന്ന സാധുവായ വായന സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
