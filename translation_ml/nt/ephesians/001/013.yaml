  to: അവനിൽ[a] നിങ്ങളും, സത്യത്തിന്റെ വചനം—നിങ്ങളുടെ രക്ഷയുടെ സുവാർത്ത[b]—കേട്ടശേഷം, അവനിൽ വിശ്വസിച്ചശേഷം[d], വാഗ്ദത്ത പരിശുദ്ധാത്മാവിനാൽ[c] മുദ്രയിടപ്പെട്ടു.
