id: EPH.1.13
reference: Ephesians 1:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν ᾧ καὶ ὑμεῖς ἀκούσαντες τὸν λόγον τῆς ἀληθείας, τὸ εὐαγγέλιον τῆς σωτηρίας ὑμῶν, ἐν ᾧ καὶ πιστεύσαντες ἐσφραγίσθητε τῷ πνεύματι τῆς ἐπαγγελίας τῷ ἁγίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/013.yaml
  text: In him[a], you also, after hearing the word of truth, the good news of your salvation, in him, and after believing, were sealed with the Holy Spirit of promise[d][c][b],
translation:
  language: ml
  text: അവനിൽ[a] നിങ്ങളും, സത്യത്തിന്റെ വചനം—നിങ്ങളുടെ രക്ഷയുടെ സുവാർത്ത[b]—കേട്ടശേഷം, അവനിൽ വിശ്വസിച്ചശേഷം[d], വാഗ്ദത്ത പരിശുദ്ധാത്മാവിനാൽ[c] മുദ്രയിടപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആരിൽ.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “നിങ്ങളുടെ രക്ഷയുടെ സുവിശേഷം.”
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “വാഗ്ദാനം ചെയ്യപ്പെട്ട പരിശുദ്ധാത്മാവിനാൽ”; ‘പരിശുദ്ധാത്മാവുകൊണ്ട്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
  - marker: d
    text: അഥവാ, “അവനിൽ തന്നേ, വിശ്വസിച്ചശേഷം.” ഇവിടെ ‘അവനിൽ’ എന്നത് വിശ്വസിക്കുന്നതിന്റെ ലക്ഷ്യത്തെയോ മുഴുവൻ സംഭവത്തിന്റെ ക്രിസ്തുവിലുള്ള സ്ഥാനത്തെയോ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ἐν ᾧ
  choice: അവനിൽ
  rationale: ബന്ധസർവനാമം മുൻസന്ദർഭത്തിലെ ക്രിസ്തുവിനെ സൂചിപ്പിക്കുന്നു. ‘അവനിൽ’ എന്നത് ക്രിസ്തുവുമായുള്ള ഐക്യത്തിന്റെ പൗലോസീയ ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: καὶ ὑμεῖς
  choice: നിങ്ങളും
  rationale: മുൻവാക്യങ്ങളിലെ ‘ഞങ്ങൾ’ എന്ന കൂട്ടത്തോടൊപ്പം വായനക്കാരും ഉൾപ്പെടുന്നു എന്ന കൂട്ടിച്ചേർക്കൽ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: ἀκούσαντες
  choice: കേട്ടശേഷം
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള aorist participle സൂചിപ്പിക്കുന്ന മുൻക്രമം വ്യക്തമായി നൽകുന്നു; കൃത്യമായ രക്ഷാക്രമത്തെക്കുറിച്ചുള്ള അധിക സിദ്ധാന്തനിഗമനം ചേർക്കുന്നില്ല.
- source_word: τὸν λόγον τῆς ἀληθείας
  choice: സത്യത്തിന്റെ വചനം
  rationale: λόγος എന്നതിന്റെ ‘വചനം/സന്ദേശം’ എന്ന അർഥവും പൗലോസിന്റെ തിരിച്ചറിയാവുന്ന പ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: τὸ εὐαγγέλιον τῆς σωτηρίας ὑμῶν
  choice: നിങ്ങളുടെ രക്ഷയുടെ സുവാർത്ത
  rationale: εὐαγγέλιον എന്നതിന്റെ അടിസ്ഥാന അർഥം സാധാരണ വായനക്കാർക്ക് സുതാര്യമായി നൽകുകയും genitive ഘടന നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: πιστεύσαντες
  choice: വിശ്വസിച്ചശേഷം
  rationale: പ്രധാനക്രിയയായ ‘മുദ്രയിടപ്പെട്ടു’ എന്നതിനോടുള്ള മുൻക്രമം സൂചിപ്പിക്കുന്നു; അതിനെക്കാൾ കൃത്യമായ കാലക്രമസിദ്ധാന്തം അടിച്ചേൽപ്പിക്കുന്നില്ല.
- source_word: ἐσφραγίσθητε
  choice: മുദ്രയിടപ്പെട്ടു
  rationale: ദൈവത്താൽ അടയാളപ്പെടുത്തപ്പെടുക, ഉടമസ്ഥതയോ അംഗീകാരമോ ലഭിക്കുക എന്നീ മുദ്രാരൂപകത്തിന്റെ ആശയങ്ങൾ passive രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: τῷ πνεύματι
  choice: പരിശുദ്ധാത്മാവിനാൽ
  rationale: dative-ന്റെ instrumental അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; മുദ്രയിടുന്ന പ്രവൃത്തിയിൽ ആത്മാവിന്റെ പങ്ക് വ്യക്തമാക്കുന്നു.
- source_word: τῆς ἐπαγγελίας τῷ ἁγίῳ
  choice: വാഗ്ദത്തത്തിന്റെ പരിശുദ്ധാത്മാവ്
  rationale: ഗ്രീക്കിലെ ചുരുക്കമുള്ള genitive ഘടന പ്രധാനപാഠത്തിൽ ഔപചാരികമായി സംരക്ഷിക്കുന്നു; കൂടുതൽ വ്യാഖ്യാനപരമായ ‘വാഗ്ദാനം ചെയ്യപ്പെട്ട’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: കേൾക്കൽ, വിശ്വസിക്കൽ, മുദ്രയിടപ്പെടൽ എന്നിവ തമ്മിലുള്ള ബന്ധം
  choice: ‘കേട്ടശേഷം … വിശ്വസിച്ചശേഷം … മുദ്രയിടപ്പെട്ടു’ എന്ന ക്രമം
  alternative: ‘കേട്ടപ്പോൾ … വിശ്വസിച്ചപ്പോൾ … മുദ്രയിടപ്പെട്ടു’ എന്ന സമകാലികത കൂടുതൽ പ്രകടമാക്കുന്ന രൂപം
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള aorist participles മുൻക്രമമോ അനുബന്ധസമയമോ സൂചിപ്പിക്കാം. പ്രധാനപാഠം സ്വാഭാവികമായ മുൻക്രമം നൽകുന്നു, എന്നാൽ ആത്മസ്വീകരണത്തിന്റെ കൃത്യനിമിഷത്തെക്കുറിച്ചുള്ള വിഭാഗീയ നിലപാട് പ്രഖ്യാപിക്കുന്നില്ല.
- issue: രണ്ടാമത്തെ ἐν ᾧ-യുടെ ബന്ധം
  choice: ‘അവനിൽ വിശ്വസിച്ചശേഷം’
  alternative: ‘അവനിൽ തന്നേ, വിശ്വസിച്ചശേഷം’—ἐν ᾧ മുഴുവൻ ഉപവാക്യത്തിന്റെയും ക്രിസ്തുവിലുള്ള സ്ഥാനം സൂചിപ്പിക്കുന്നു
  rationale: മലയാളത്തിലെ പ്രധാനരൂപം സ്വാഭാവികമായി ‘അവനിൽ വിശ്വസിക്കുക’ എന്നു വായിക്കാം. എന്നാൽ ഗ്രീക്ക് ഘടനയ്ക്ക് ക്രിസ്തുവിലുള്ള സ്ഥാനം വിശാലമായി സൂചിപ്പിക്കാനും കഴിയുന്നതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: ‘വാഗ്ദത്തത്തിന്റെ ആത്മാവ്’ എന്നതിന്റെ അർഥം
  choice: വാഗ്ദത്തത്തിന്റെ പരിശുദ്ധാത്മാവ്
  alternative: വാഗ്ദാനം ചെയ്യപ്പെട്ട പരിശുദ്ധാത്മാവ്
  rationale: ഗ്രീക്ക് genitive സംക്ഷിപ്തവും അർഥസമ്പന്നവുമാണ്. പ്രധാനപാഠം അതിന്റെ രൂപം സംരക്ഷിക്കുന്നു; ദൈവം വാഗ്ദാനം ചെയ്ത ആത്മാവ് എന്ന വ്യക്തമായ വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: τῷ πνεύματι എന്ന dative-ന്റെ പ്രവർത്തനം
  choice: പരിശുദ്ധാത്മാവിനാൽ
  alternative: പരിശുദ്ധാത്മാവുകൊണ്ട്
  rationale: ഇത് ഉപകരണമോ പ്രവർത്തകബന്ധമോ സൂചിപ്പിക്കാം. ‘-നാൽ’ സ്വാഭാവികവും മാന്യവുമായ രൂപമാണ്; മറ്റൊരു സാധുവായ മലയാളഭാവം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനയ്ക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘വചനം’, ‘പരിശുദ്ധാത്മാവ്’, ‘മുദ്രയിടപ്പെട്ടു’ എന്നീ പരിചിതമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തിയപ്പോൾ ‘സുവാർത്ത’ ഉപയോഗിച്ച് εὐαγγέλιον എന്നതിന്റെ അർഥം സുതാര്യമാക്കി. ദീർഘവാക്യത്തിലെ apposition വ്യക്തമാക്കാൻ em dash ഉപയോഗിച്ചു.
