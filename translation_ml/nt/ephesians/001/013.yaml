  source_fidelity: 'പ്രധാന അർഥവും ക്രമവും കരട് നന്നായി നിലനിർത്തുന്നു: ‘നിങ്ങളും,’ കേൾക്കലും വിശ്വസിക്കലും മുഖ്യക്രിയയ്ക്കു മുമ്പായി അവതരിപ്പിക്കുന്നു; ‘മുദ്രയിടപ്പെട്ടു’ passive-നെ ശരിയായി നൽകുന്നു. എന്നാൽ ‘വാഗ്ദത്തത്തിന്റെ പരിശുദ്ധാത്മാവ്’ മലയാളത്തിൽ അസ്വാഭാവികവും ബന്ധം അവ്യക്തവുമാണ്; τῆς ἐπαγγελίας-ന്റെ സ്വാഭാവിക അർഥമായ ‘വാഗ്ദാനം ചെയ്യപ്പെട്ട’ എന്ന വിശേഷണബന്ധം പ്രധാനപാഠത്തിൽ നൽകണം.'
