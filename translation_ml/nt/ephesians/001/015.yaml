id: EPH.1.15
reference: Ephesians 1:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Διὰ τοῦτο κἀγώ, ἀκούσας τὴν καθ’ ὑμᾶς πίστιν ἐν τῷ κυρίῳ Ἰησοῦ καὶ τὴν ⸂ἀγάπην τὴν⸃ εἰς πάντας τοὺς ἁγίους,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/015.yaml
  text: For this reason[a], I also, having heard of your faith in the Lord Jesus and your love for all the saints[b],
translation:
  language: ml
  text: ഇക്കാരണത്താൽ, കർത്താവായ യേശുവിലുള്ള നിങ്ങളുടെ വിശ്വാസത്തെക്കുറിച്ചും[a] എല്ലാ വിശുദ്ധന്മാരോടുമുള്ള നിങ്ങളുടെ സ്നേഹത്തെക്കുറിച്ചും[b] കേട്ടിട്ട് ഞാനും,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കർത്താവായ യേശുവിലുള്ള നിങ്ങളുടെ ആശ്രയം’ എന്നും പരിഭാഷപ്പെടുത്താം; πίστις എന്ന ഗ്രീക്കുപദത്തിന് ചില സന്ദർഭങ്ങളിൽ ‘വിശ്വസ്തത’ എന്ന അർഥവും വരാം.
    reason: lexical_alternative
  - marker: b
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, ‘എല്ലാ വിശുദ്ധന്മാരിലേക്കുമുള്ള നിങ്ങളുടെ സ്നേഹം.’ ചില ഗ്രീക്ക് കൈയെഴുത്തുപ്രതികളിൽ ‘എല്ലാ വിശുദ്ധന്മാരോടുമുള്ള നിങ്ങളുടെ സ്നേഹം’ എന്ന ഭാഗം കാണുന്നില്ല.
    reason: lexical_alternative; textual_variant
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: ഇക്കാരണത്താൽ
  rationale: മുൻവാക്യങ്ങളിലെ അനുഗ്രഹവിവരണത്തിലേക്കു പിന്നോട്ടു ചൂണ്ടിക്കൊണ്ട് പൗലോസിന്റെ പ്രതികരണത്തിന് അടിസ്ഥാനം നൽകുന്ന പ്രയോഗം; ഗ്രീക്കിലെ അനുമാനാത്മക-കാരണബലം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: κἀγώ
  choice: ഞാനും
  rationale: καί + ἐγώ എന്ന സംയുക്തരൂപത്തിലെ കൂട്ടിച്ചേർക്കൽ ഊന്നൽ അതിരുകടക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀκούσας
  choice: കേട്ടിട്ട്
  rationale: പൗലോസിനെ വിശേഷിപ്പിക്കുന്ന aorist participle-ന്റെ മുൻകാലബന്ധം നിലനിർത്തുകയും വാക്യം അടുത്ത വാക്യത്തിലേക്കു തുടരുന്ന ഘടന സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: τὴν καθ’ ὑμᾶς πίστιν
  choice: നിങ്ങളുടെ വിശ്വാസം
  rationale: καθ’ ὑμᾶς വായനക്കാരെ സംബന്ധിക്കുന്ന വിശ്വാസത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘നിങ്ങളുടെ വിശ്വാസം’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: πίστιν
  choice: വിശ്വാസം
  rationale: ഈ സന്ദർഭത്തിൽ കർത്താവായ യേശുവിലുള്ള വിശ്വസിക്കുന്ന ബന്ധമാണ് പ്രധാന അർഥം; ‘ആശ്രയം’, ചില സന്ദർഭങ്ങളിലെ ‘വിശ്വസ്തത’ എന്നീ സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἐν τῷ κυρίῳ Ἰησοῦ
  choice: കർത്താവായ യേശുവിലുള്ള
  rationale: ἐν എന്നതിന്റെ ‘ഉള്ളിൽ/ൽ’ ബന്ധവും പൗലോസിന്റെ പതിവായ പ്രയോഗവും നിലനിർത്തുന്നു; ‘കർത്താവായ യേശു’ മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുമാനപൂർണ രൂപമാണ്.
- source_word: κυρίῳ
  choice: കർത്താവ്
  rationale: യേശുവിന്റെ ദൈവശാസ്ത്രപരമായി പ്രാധാന്യമുള്ള സ്ഥാനപ്പേരായി κύριος ഇവിടെ ഉപയോഗിക്കപ്പെടുന്നതിനാൽ ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: ἀγάπην
  choice: സ്നേഹം
  rationale: ἀγάπη എന്നതിന്റെ സാധാരണയും സമകാലികവുമായ മലയാളരൂപം; പഴഞ്ചൻ അല്ലെങ്കിൽ സാങ്കേതിക പദം ഒഴിവാക്കുന്നു.
- source_word: εἰς πάντας τοὺς ἁγίους
  choice: എല്ലാ വിശുദ്ധന്മാരോടുമുള്ള
  rationale: സ്നേഹം ആരിലേക്കാണ് തിരിഞ്ഞിരിക്കുന്നതെന്ന് εἰς സൂചിപ്പിക്കുന്നു; വ്യക്തികളോടുള്ള സ്നേഹം മലയാളത്തിൽ ‘-ഓടുമുള്ള’ എന്നു പറയുന്നത് സ്വാഭാവികമാണ്.
- source_word: ἁγίους
  choice: വിശുദ്ധന്മാർ
  rationale: പൗലോസ് വിശ്വാസികളെ സമൂഹമായി വിളിക്കുന്ന സ്ഥാപിതമായ പദം നിലനിർത്തുന്നു; പിന്നീടുണ്ടായ വിശുദ്ധപദവി പ്രഖ്യാപനത്തിന്റെ ആശയം ഇവിടെ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: πίστις എന്ന പദത്തിന്റെ സന്ദർഭോചിത അർഥം
  choice: വിശ്വാസം
  alternative: ആശ്രയം; വിശ്വസ്തത
  rationale: ἐν τῷ κυρίῳ Ἰησοῦ എന്ന ഘടന ഇവിടെ വായനക്കാരുടെ യേശുവിലുള്ള വിശ്വസിക്കുന്ന ബന്ധത്തെയാണ് ഏറ്റവും നേരിട്ട് സൂചിപ്പിക്കുന്നത്. എന്നിരുന്നാലും പദത്തിന്റെ ബന്ധപ്പെട്ട അർഥസാധ്യതകൾ അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
- issue: κύριος എന്ന ക്രിസ്തുസംബന്ധിയായ സ്ഥാനപ്പേര്
  choice: കർത്താവ്
  alternative: യജമാനൻ
  rationale: ഇവിടെ κύριος യേശുവിന്റെ സ്ഥാനപ്പേരാണ്; ‘കർത്താവ്’ അതിന്റെ ദൈവശാസ്ത്രഭാരം ദുർബലമാക്കാതെ മലയാളത്തിൽ സ്ഥാപിതവും സ്വാഭാവികവുമായ പരിഭാഷയാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ സഭാപാരായണ ശൈലി സ്വീകരിച്ചു. ഗ്രീക്ക് വാക്യം അടുത്ത വാക്യത്തിലേക്കു തുടരുന്നതിനാൽ അവസാനത്തിലെ അപൂർണതയും കോമയും നിലനിർത്തി. ഇംഗ്ലീഷ് consultation layer-ൽ [a] ‘ഇക്കാരണത്താൽ’ എന്നതിനു പിന്നാലെ വന്നിരുന്നെങ്കിലും അതിന്റെ ഉള്ളടക്കം πίστις-നെക്കുറിച്ചായതിനാൽ, ഉറവിടബന്ധം വ്യക്തമാക്കാൻ അടയാളം ‘വിശ്വാസം’ എന്ന പദത്തിനു പിന്നാലെ സ്ഥാപിച്ചു.
