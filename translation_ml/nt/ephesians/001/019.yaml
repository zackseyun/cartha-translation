id: EPH.1.19
reference: Ephesians 1:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ τί τὸ ὑπερβάλλον μέγεθος τῆς δυνάμεως αὐτοῦ εἰς ἡμᾶς τοὺς πιστεύοντας κατὰ τὴν ἐνέργειαν τοῦ κράτους τῆς ἰσχύος αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/019.yaml
  text: and what is the surpassing greatness of his power toward us who believe[a], according to the working of the might of his strength
translation:
  language: ml
  text: വിശ്വസിക്കുന്ന നമ്മിലേക്കുള്ള[a] അവന്റെ ശക്തിയുടെ അതിരുകവിഞ്ഞ മഹത്ത്വം എന്തെന്നും, അവന്റെ ബലത്തിന്റെ പ്രാബല്യത്തിന്റെ പ്രവർത്തനത്തിന് അനുസൃതമായി
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘വിശ്വസിക്കുന്ന നമ്മിൽ.’ ഗ്രീക്കിൽ അക്ഷരാർഥം ‘നമ്മിലേക്ക്’ എന്നാണ്; എന്നാൽ ചില വിവർത്തനങ്ങൾ ദൈവത്തിന്റെ ശക്തി വിശ്വാസികളുടെ ഉള്ളിൽ പ്രവർത്തിക്കുന്നു എന്ന അർഥത്തിൽ കൂടുതൽ വ്യാഖ്യാനാത്മകമായി ‘നമ്മിൽ’ എന്നു നൽകുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπερβάλλον
  choice: അതിരുകവിഞ്ഞ
  rationale: μέγεθος എന്ന നാമത്തെ വിശേഷിപ്പിക്കുന്ന ഈ പദത്തിന്റെ ‘പരിധിയെ കവിയുന്ന’ താരതമ്യഭാവം നിലനിർത്തുന്നു; ഗ്രീക്കിലുള്ളതിനെക്കാൾ ശക്തമായ ‘അളക്കാനാവാത്ത’ എന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: μέγεθος
  choice: മഹത്ത്വം
  rationale: അമൂർത്തമായ വലുപ്പത്തെയും ശ്രേഷ്ഠതയെയും സൂചിപ്പിക്കാൻ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളപദം.
- source_word: δύναμις
  choice: ശക്തി
  rationale: പ്രവർത്തനക്ഷമമായ ദൈവിക കഴിവിനുള്ള സ്വാഭാവിക പദം; തുടർന്നുവരുന്ന സമാനാർഥപദങ്ങളിൽനിന്ന് വേർതിരിച്ചും നിർത്താം.
- source_word: εἰς ἡμᾶς
  choice: നമ്മിലേക്കുള്ള
  rationale: ἐν എന്നതിനു പകരം εἰς ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ ദിശയുടെയോ പ്രയോഗത്തിന്റെയോ ഭാവം നേരിട്ട് സംരക്ഷിക്കുന്നു; ശക്തി ഉള്ളിൽ പ്രവർത്തിക്കുന്നുവെന്ന വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ നിർബന്ധിക്കുന്നില്ല.
- source_word: τοὺς πιστεύοντας
  choice: വിശ്വസിക്കുന്നവരായ
  rationale: വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ ക്രിയാത്മക ഭാവം നിലനിർത്തുകയും മലയാളത്തിൽ വ്യക്തികളെ സ്വാഭാവികമായി വിശേഷിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: κατά
  choice: അനുസൃതമായി
  rationale: തുടർന്നുപറയുന്ന ദൈവിക പ്രവർത്തനവുമായി ഒത്തുപോകുന്ന അളവോ മാനദണ്ഡമോ ആണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
- source_word: ἐνέργεια
  choice: പ്രവർത്തനം
  rationale: ഫലപ്രദമായി പ്രവർത്തിക്കുന്ന ക്രിയാശക്തിയെ സൂചിപ്പിക്കുന്നു; ആധുനിക ഉപയോഗത്തിൽ തെറ്റിദ്ധരിപ്പിക്കാവുന്ന ‘ഊർജം’ ഒഴിവാക്കുന്നു.
- source_word: κράτος
  choice: പ്രാബല്യമാർന്ന
  rationale: പ്രകടമാകുന്ന ബലപ്രഭാവം സൂചിപ്പിക്കുകയും ἰσχύς എന്ന പദത്തിന് ഉപയോഗിച്ച ‘ബലം’ എന്നതിൽനിന്ന് വേർതിരിക്കുകയും ചെയ്യുന്നു. മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി ബന്ധനാമത്തിന്റെ ആശയം വിശേഷണരൂപത്തിൽ നൽകിയിരിക്കുന്നു.
- source_word: ἰσχύς
  choice: ബലം
  rationale: അന്തർലീനമായ ശക്തിയോ കരുത്തോ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപദം; δύναμις, κράτος എന്നിവയോടുള്ള പദവ്യത്യാസം കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: καὶ τί
  choice: എന്തെന്നും
  rationale: മുൻവാക്യത്തിൽ ആരംഭിച്ച പ്രാർഥനയിലെ അറിവിന്റെ പട്ടിക ഈ വാക്യം തുടരുന്നതായി മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ഗ്രീക്കിലെ καί-യുടെ തുടർച്ചാഭാവം ‘-എന്നും’ വഹിക്കുന്നു.
theological_decisions:
- issue: δύναμις / ἐνέργεια / κράτος / ἰσχύς എന്ന ശക്തിസംബന്ധമായ പദസഞ്ചയം
  choice: ‘ശക്തി ... പ്രവർത്തനം ... പ്രാബല്യം ... ബലം’ എന്നിങ്ങനെ പരസ്പരം ബന്ധപ്പെട്ടെങ്കിലും വ്യത്യസ്തമായ പദങ്ങൾ നിലനിർത്തി.
  alternative: എല്ലാം ചേർത്ത് ‘അവന്റെ ശക്തിയുടെ പൂർണപ്രവർത്തനം’ എന്നോ സമാനമായ ഒറ്റ പ്രയോഗമായോ വിവർത്തനം ചെയ്യുക.
  rationale: പൗലോസ് ദൈവശക്തിയുടെ വലുപ്പവും ഫലപ്രാപ്തിയും ഊന്നാൻ സമാനാർഥപദങ്ങൾ അടുക്കിവയ്ക്കുന്നു. അവയെ പൂർണമായി ചുരുക്കുന്നത് വാക്യത്തിന്റെ വാചാലബലം നഷ്ടപ്പെടുത്തും; അതേസമയം ഓരോന്നിനും പ്രത്യേക സാങ്കേതിക ദൈവശാസ്ത്രാർഥം ചുമത്തിയിട്ടില്ല.
- issue: εἰς ἡμᾶς എന്നതിൽ ദൈവശക്തിയുടെ ദിശ
  choice: ‘നമ്മിലേക്കുള്ള’
  alternative: ‘നമ്മിൽ’ അല്ലെങ്കിൽ ‘നമുക്കുവേണ്ടിയുള്ള’
  rationale: εἰς എന്ന ഉപസർഗത്തിന്റെ ദിശാഭാവം സംരക്ഷിക്കുന്നു. ശക്തി വിശ്വാസികളുടെ ഉള്ളിൽ പ്രവർത്തിക്കുന്നതാണോ അവർക്ക് അനുകൂലമായി പ്രയോഗിക്കപ്പെടുന്നതാണോ എന്ന വ്യത്യാസം മുഖ്യവാചകം അനാവശ്യമായി തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഈ വാക്യം മുൻവാക്യത്തിലെ പട്ടിക തുടരുന്നതിനാൽ ‘എന്തെന്നും’ ഉപയോഗിച്ചു. മൂലത്തിലെ നീണ്ട വാക്യഘടനയും അടുത്ത വാക്യത്തിലേക്കുള്ള ആശയതുടർച്ചയും അനാവശ്യമായി പൂർണവാക്യമാക്കി മാറ്റിയിട്ടില്ല.
