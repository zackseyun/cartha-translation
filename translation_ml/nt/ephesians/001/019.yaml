revisions:
- from: വിശ്വസിക്കുന്നവരായ നമ്മിലേക്കുള്ള[a] അവന്റെ ശക്തിയുടെ അതിരുകവിഞ്ഞ മഹത്ത്വം എന്തെന്നും, അവന്റെ ബലത്തിന്റെ പ്രാബല്യമാർന്ന പ്രവർത്തനത്തിന് അനുസൃതമായി
  to: വിശ്വസിക്കുന്ന നമ്മിലേക്കുള്ള[a] അവന്റെ ശക്തിയുടെ അതിരുകവിഞ്ഞ മഹത്ത്വം എന്തെന്നും, അവന്റെ ബലത്തിന്റെ പ്രാബല്യത്തിന്റെ പ്രവർത്തനത്തിന് അനുസൃതമായി
  rationale: 'The revision makes two limited changes: it streamlines the participial expression for idiomatic Malayalam, and it restores the source''s nested power-language sequence (‘working of might of strength’) rather than making ‘might’ merely an adjective of ‘working.’ The directional ambiguity of εἰς ἡμᾶς and the verse''s dependence on the preceding sentence are retained.'
