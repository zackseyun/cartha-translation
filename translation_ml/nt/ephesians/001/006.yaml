id: EPH.1.6
reference: Ephesians 1:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰς ἔπαινον δόξης τῆς χάριτος αὐτοῦ ⸀ἧς ἐχαρίτωσεν ἡμᾶς ἐν τῷ ἠγαπημένῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/006.yaml
  text: to the praise of the glory of his grace[a], with which he has favored us in the Beloved[b],
translation:
  language: ml
  text: തന്റെ കൃപയുടെ മഹത്വം പുകഴ്ത്തപ്പെടേണ്ടതിന്, ആ കൃപയാൽ അവൻ പ്രിയനായവനിൽ[b] നമ്മോടു കൃപ കാണിച്ചു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആ കൃപ അവൻ നമുക്കു സൗജന്യമായി നൽകി’ എന്നും ‘ആ കൃപയാൽ അവൻ നമ്മോടു പ്രീതി കാണിച്ചു’ എന്നും വിവർത്തനം ചെയ്യാം. ‘കൃപ’ എന്ന നാമവും ‘കൃപ കാണിച്ചു’ എന്ന ക്രിയയും ഗ്രീക്കിൽ ഒരേ പദകുടുംബത്തിൽപ്പെട്ടവയാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘പ്രിയനായവൻ’ എന്നത് പുത്രനെ, അതായത് മശിഹായെ, സൂചിപ്പിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: εἰς ἔπαινον
  choice: പുകഴ്ത്തപ്പെടേണ്ടതിന്
  rationale: ഉദ്ദേശ്യം അഥവാ ഫലം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: δόξης τῆς χάριτος αὐτοῦ
  choice: തന്റെ കൃപയുടെ മഹത്വം
  rationale: δόξα എന്നതിന് ‘മഹത്വം’ എന്നും χάρις എന്നതിന് ‘കൃപ’ എന്നും നൽകി പൗലോസിന്റെ സ്തുതിപരമായ ഭാഷ നിലനിർത്തുന്നു.
- source_word: ἧς ἐχαρίτωσεν ἡμᾶς
  choice: ആ കൃപയാൽ അവൻ ... നമ്മോടു കൃപ കാണിച്ചു
  rationale: ἧς എന്നത് മുൻപുള്ള χάρις-ലേക്കു തിരിഞ്ഞുനിൽക്കുന്നതും χάρις–χαριτόω എന്ന പദബന്ധവും മലയാളത്തിൽ ‘കൃപ’ ആവർത്തിച്ചുകൊണ്ട് സംരക്ഷിക്കുന്നു.
- source_word: ἐν τῷ ἠγαπημένῳ
  choice: പ്രിയനായവനിൽ
  rationale: ἐν എന്നതിന്റെ അടിസ്ഥാന അർത്ഥമായ ‘-യിൽ’ നിലനിർത്തുകയും, പുത്രൻ എന്നു വാക്യത്തിൽ ഇല്ലാത്ത പദം ചേർക്കാതെ substantival participle-നെ പദവിപോലെ അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: χάρις–χαριτόω പദബന്ധത്തിന്റെ വിവർത്തനം
  choice: ആ കൃപയാൽ അവൻ നമ്മോടു കൃപ കാണിച്ചു
  alternative: അവൻ നമുക്കു സൗജന്യമായി കൃപ നൽകി / ആ കൃപയാൽ അവൻ നമ്മെ അനുഗ്രഹിച്ചു
  rationale: ദൈവത്തിന്റെ കൃപയും അവന്റെ കൃപാപൂർവമായ പ്രവൃത്തിയും തമ്മിലുള്ള ഗ്രീക്ക് പദബന്ധം വ്യക്തമാക്കുന്നു; ‘അനുഗ്രഹിച്ചു’ എന്നത് εὐλογέω എന്ന വേറൊരു ആശയവുമായി കലരാൻ ഇടയുള്ളതിനാൽ ഒഴിവാക്കി.
- issue: τῷ ἠγαπημένῳ എന്നതിന്റെ ക്രിസ്തുവിനെ സൂചിപ്പിക്കുന്ന ശക്തി
  choice: പ്രിയനായവൻ
  alternative: പ്രിയപുത്രൻ / അവൻ സ്നേഹിക്കുന്നവൻ
  rationale: ഇത് മശിഹായെ സൂചിപ്പിക്കുന്ന പദവിയാണെങ്കിലും ഈ വാക്യത്തിൽ ‘പുത്രൻ’ പ്രത്യക്ഷമായി ഇല്ല. അതിനാൽ സൂചന നിലനിർത്തി അനാവശ്യമായ വിശദീകരണം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
- issue: ἐν എന്ന ബന്ധത്തിന്റെ അർത്ഥവ്യാപ്തി
  choice: പ്രിയനായവനിൽ
  alternative: പ്രിയനായവനിലൂടെ / പ്രിയനായവനോടുള്ള ഐക്യത്തിൽ
  rationale: ‘-യിൽ’ എന്ന രൂപം മണ്ഡലം, ബന്ധം, ഐക്യം തുടങ്ങിയ സാദ്ധ്യമായ സൂക്ഷ്മതകൾ തുറന്നുവെക്കുന്നു; ഉപാധി എന്ന ഒറ്റ അർത്ഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കൃപയുടെ മഹത്വം’ എന്ന സാന്ദ്രമായ പൗലോസീയ ഘടന നിലനിർത്തി; ‘പ്രിയനായവനിൽ’ എന്ന രൂപം മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ അർത്ഥവ്യാപ്തി തുറന്നുവെക്കുന്നു.
