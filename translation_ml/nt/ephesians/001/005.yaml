source:
  edition: SBLGNT
  text: προορίσας ἡμᾶς εἰς υἱοθεσίαν διὰ Ἰησοῦ Χριστοῦ εἰς αὐτόν, κατὰ τὴν εὐδοκίαν τοῦ θελήματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/005.yaml
  text: having predestined us for adoption through Jesus the Messiah to himself[a], according to the good pleasure of his will[c][b],
translation:
  language: ml
  text: തന്റെ ഇഷ്ടത്തിന്റെ പ്രസാദമനുസരിച്ച്, യേശു മശീഹായിലൂടെ നമ്മെ തനിക്കായി[a] പുത്രന്മാരായി ദത്തെടുക്കാൻ[b] അവൻ മുൻകൂട്ടി നിശ്ചയിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തന്നിലേക്കു.’ ഗ്രീക്ക് പ്രയോഗത്തിന് ദൈവത്തിലേക്കുള്ള ദിശയെയോ ദൈവത്തിനായുള്ള ഉദ്ദേശ്യത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്ക് പദം അക്ഷരാർഥത്തിൽ പുത്രസ്ഥാനം നൽകുന്ന ദത്തെടുക്കലിനെ സൂചിപ്പിക്കുന്നു; നിയമപരമായ അവകാശസ്ഥാനത്തിനാണ് ഇവിടെ ഊന്നൽ.
    reason: lexical_alternative
lexical_decisions:
- source_word: προορίσας
  choice: മുൻകൂട്ടി നിശ്ചയിച്ചു
  rationale: προορίζω എന്ന ക്രിയയിലെ ‘മുൻകൂട്ടി’ എന്ന കാലസൂചനയും ‘നിശ്ചയിക്കുക’ എന്ന ശക്തമായ അർഥവും നിലനിർത്തുന്നു. മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി ഗ്രീക്കിലെ കർത്തൃവാചകത്തെ പൂർണക്രിയയായി അവതരിപ്പിക്കുന്നു; മുൻവാക്യത്തിൽ നിന്നുള്ള കർത്താവ് ‘അവൻ’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: εἰς υἱοθεσίαν
  choice: പുത്രന്മാരായി ദത്തെടുക്കാൻ
  rationale: υἱοθεσία സൂചിപ്പിക്കുന്ന ദത്തെടുക്കലിനെയും പുത്രന്റെ നിയമപരവും അവകാശപരവുമായ സ്ഥാനത്തെയും ഒരുമിച്ച് പ്രകടിപ്പിക്കുന്നു.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: യേശു മശീഹായിലൂടെ
  rationale: ജനിറ്റീവോടുകൂടിയ διά മാർഗമോ ഇടനിലക്കാരനെയോ സൂചിപ്പിക്കുന്നു. Χριστός എന്ന സ്ഥാനപ്പേര് അർഥവിവർത്തനമായി ‘മശീഹാ’ എന്നു നൽകുന്നു.
- source_word: εἰς αὐτόν
  choice: തനിക്കായി
  rationale: പ്രവൃത്തിയുടെ ലക്ഷ്യം ദൈവം തന്നെയാണെന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘തന്നിലേക്കു’ എന്ന ദിശാസൂചനയും സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: κατὰ τὴν εὐδοκίαν
  choice: പ്രസാദപ്രകാരം
  rationale: κατά എന്നതിന്റെ ‘അനുസരിച്ച്’ എന്ന ബന്ധവും εὐδοκίαയുടെ സന്തോഷപൂർവമായ അംഗീകാരം/നല്ല ഇഷ്ടം എന്ന ഭാവവും ചുരുക്കമായും ഗൗരവമായും നൽകുന്നു.
- source_word: τοῦ θελήματος αὐτοῦ
  choice: തന്റെ ഹിതത്തിന്റെ
  rationale: θέλημα എന്നതിന് ‘ഹിതം’ എന്നത് ദൈവത്തിന്റെ ഇഷ്ടം/മനസ്സാക്ഷി എന്ന അർഥം നേരിട്ട് നൽകുന്നു; ‘പദ്ധതി’ പോലുള്ള വ്യാഖ്യാനപരമായ വിപുലീകരണം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: പ്രോഒരിസാസ് (προορίσας) എന്ന പദത്തിന്റെ സിദ്ധാന്തപരമായി വിവാദമുള്ള അർഥം
  choice: മുൻകൂട്ടി നിശ്ചയിച്ചു
  alternative: മുൻകൂട്ടി തീരുമാനിച്ചു
  rationale: മൂലപദത്തിന്റെ ശക്തി മയപ്പെടുത്താതെയും മുൻനിശ്ചയത്തെക്കുറിച്ചുള്ള സമ്പൂർണ സിദ്ധാന്തവ്യവസ്ഥ വാക്യത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതെയും നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു.
- issue: υἱοθεσίαയിലെ ലിംഗസൂചകവും നിയമപരമായ സ്ഥാനവും
  choice: പുത്രന്മാരായി ദത്തെടുക്കാൻ
  alternative: ദത്തെടുക്കാൻ
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിലെ ‘പുത്രന്റെ സ്ഥാനം’ എന്ന അവകാശപരമായ സൂചന സംരക്ഷിക്കുന്നു. ഇത് വിശ്വാസികളായ സ്ത്രീകളെ ഒഴിവാക്കുന്നുവെന്ന് വ്യാഖ്യാനിക്കാതെ മൂലഭാഷയുടെ ലിംഗസൂചന നിലനിർത്തുന്നു.
- issue: Χριστός എന്ന സ്ഥാനപ്പേര്
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ Χριστός ഒരു സ്ഥാനപ്പേരായതിനാൽ അതിന്റെ അർഥം പ്രകടമാക്കുന്ന ‘മശീഹാ’ ഉപയോഗിക്കുന്നു.
- issue: εἰς αὐτόν എന്ന പ്രയോഗത്തിന്റെ ദിശ/ഉദ്ദേശ്യ ദ്വയാർഥം
  choice: തനിക്കായി
  alternative: തന്നിലേക്കു
  rationale: മലയാളത്തിൽ ഉദ്ദേശ്യാർഥം സ്വാഭാവികമാണ്; എന്നാൽ ഗ്രീക്കിൽ ദിശാസൂചനയും സാധ്യമാകുന്നതിനാൽ അതിനെ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്ക് മൂലത്തിലെ ദീർഘവാക്യബന്ധം മലയാളത്തിൽ വ്യക്തതയ്ക്കായി പൂർണക്രിയയായി നൽകിയിരിക്കുന്നു. ‘പ്രസാദം,’ ‘ഹിതം’ എന്നീ പദങ്ങൾ ഔപചാരികത നിലനിർത്തുമ്പോഴും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാണ്.
