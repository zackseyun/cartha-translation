translation:
  language: ml
  text: അവിടുന്ന് ആ കൃപ നമ്മിലേക്കു സമൃദ്ധമായി ചൊരിഞ്ഞു—സകല ജ്ഞാനത്തിലും വിവേകത്തിലും.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ആ കൃപ അവിടുന്ന് നമ്മിലേക്കു പെരുകുമാറാക്കി.”'
    reason: lexical_alternative
  - marker: b
    text: “സകല ജ്ഞാനത്തിലും വിവേകത്തിലും” എന്നത് ദൈവം തന്റെ കൃപ ചൊരിഞ്ഞ രീതിയെയോ, വിശ്വാസികൾക്കു നൽകിയ ജ്ഞാനവും വിവേകവും സൂചിപ്പിക്കുന്നതായോ വായിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἧς
  choice: ആ കൃപ
  rationale: ബന്ധസർവനാമം മുൻവാക്യത്തിലെ ‘കൃപയുടെ സമ്പത്ത്’ എന്ന ആശയത്തിലേക്കാണ് വിരൽചൂണ്ടുന്നത്. മലയാളത്തിൽ വാക്യം സ്വാഭാവികവും വ്യക്തവുമാക്കാൻ സൂചിതമായ ‘കൃപ’ ആവർത്തിച്ചു.
- source_word: ἐπερίσσευσεν
  choice: സമൃദ്ധമായി ചൊരിഞ്ഞു
  rationale: περισσεύω ഇവിടെ കാരകമായ അർഥത്തിൽ, ദൈവം കൃപ സമൃദ്ധമാക്കിയെന്ന ആശയം നൽകുന്നു. ‘സമൃദ്ധമായി ചൊരിഞ്ഞു’ അതിന്റെ കവിഞ്ഞൊഴുകുന്ന ധാരാളിത്തം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: εἰς ἡμᾶς
  choice: നമ്മിലേക്ക്
  rationale: εἰς സൂചിപ്പിക്കുന്ന സ്വീകർത്താക്കളിലേക്കുള്ള ദിശ നിലനിർത്തുന്നു; ‘ചൊരിഞ്ഞു’ എന്ന ക്രിയയോടും സ്വാഭാവികമായി ചേരുന്നു.
- source_word: ἐν πάσῃ σοφίᾳ καὶ φρονήσει
  choice: സകല ജ്ഞാനത്തിലും വിവേകത്തിലും
  rationale: ἐν എന്നതിന്റെ രൂപം നിലനിർത്തി ഈ പദസമുച്ചയം ദൈവത്തിന്റെ പ്രവൃത്തിയുടെ രീതിയെയാണോ നൽകിയ കൃപയോടനുബന്ധിച്ച ജ്ഞാനവിവേകങ്ങളെയാണോ സൂചിപ്പിക്കുന്നത് എന്ന വ്യാകരണപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
- source_word: σοφίᾳ
  choice: ജ്ഞാനം
  rationale: σοφία എന്നതിന്റെ സുതാര്യവും പതിവുമായ മലയാള പരിഭാഷ.
- source_word: φρονήσει
  choice: വിവേകം
  rationale: പ്രായോഗിക തിരിച്ചറിവും സൂക്ഷ്മബോധവും സൂചിപ്പിക്കുകയും σοφίαയിൽനിന്നുള്ള വ്യത്യാസം വായനാസൗകര്യത്തോടെ നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘സകല ജ്ഞാനത്തിലും വിവേകത്തിലും’ എന്ന പദസമുച്ചയത്തിന്റെ ബന്ധം
  choice: ദൈവം കൃപ ചൊരിഞ്ഞ രീതിയാണോ, വിശ്വാസികൾക്കു ലഭിച്ച കൃപയോടൊപ്പം ബന്ധപ്പെട്ട ജ്ഞാനവും വിവേകവുമാണോ എന്നു മുഖ്യവാചകത്തിൽ നിർണയിക്കാതെ വിട്ടു.
  alternative: ഇത് ദൈവത്തിന്റെ ജ്ഞാനവിവേകങ്ങളെയോ വിശ്വാസികൾക്കു നൽകപ്പെട്ട ജ്ഞാനവിവേകങ്ങളെയോ വ്യക്തമായി സൂചിപ്പിക്കുന്നതായി പരിഭാഷപ്പെടുത്തുക.
  rationale: ഗ്രീക്ക് വാക്യഘടന രണ്ട് ബന്ധങ്ങൾക്കും ഇടനൽകുന്നതിനാൽ യഥാർഥമായ വ്യാകരണ-ദൈവശാസ്ത്രപരമായ അനിശ്ചിതത്വം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘അവിടന്ന്’ ദൈവത്തെ സൂചിപ്പിക്കുന്ന ആദരസൂചക സർവനാമമായി ഉപയോഗിച്ചു. ‘സമൃദ്ധമായി ചൊരിഞ്ഞു’ മൂലത്തിലെ അതിസമൃദ്ധിയുടെ ഭാവം സ്വാഭാവികമായി കൈമാറുന്നു.
