translation:
  language: ml
  text: അങ്ങനെ, ലോകസ്ഥാപനത്തിനുമുമ്പ് അവിടുന്ന് നമ്മെ ക്രിസ്തുവിൽ തിരഞ്ഞെടുത്തു; അവിടുത്തെ സന്നിധിയിൽ സ്നേഹത്തിൽ[a] വിശുദ്ധരും കുറ്റമറ്റവരും[b] ആയിരിക്കാനായി[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘സ്നേഹത്തിൽ’ എന്ന പദസമുച്ചയം അടുത്ത വാക്യത്തോടും ചേർത്തു വായിക്കാം: ‘സ്നേഹത്തിൽ അവിടുന്ന് നമ്മെ മുൻകൂട്ടി നിശ്ചയിച്ചു…’'
