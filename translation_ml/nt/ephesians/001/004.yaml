lexical_decisions:
- source_word: καθὼς
  choice: അതുപോലെതന്നെ
  rationale: മുൻവാക്യത്തിലെ അനുഗ്രഹപ്രസ്താവനയുമായി ഈ വാക്യത്തെ ബന്ധിപ്പിക്കുന്ന താരതമ്യപരവും വിശദീകരണപരവുമായ ശക്തി നിലനിർത്തുന്നു.
- source_word: ἐξελέξατο
  choice: തിരഞ്ഞെടുത്തു
  rationale: ദൈവത്തിന്റെ തിരഞ്ഞെടുപ്പിനെ വ്യക്തമായി അറിയിക്കുമ്പോഴും, പിൽക്കാല സാങ്കേതിക ദൈവശാസ്ത്രപദാവലി അനാവശ്യമായി ചുമത്തുന്നില്ല.
- source_word: ἐν αὐτῷ
  choice: ക്രിസ്തുവിൽ
  rationale: ഗ്രീക്കിൽ സർവനാമമാണെങ്കിലും സന്ദർഭത്തിൽ അതിന്റെ സൂചിതൻ ക്രിസ്തുവാണ്; മലയാളത്തിൽ തുടർച്ചയായ സർവനാമങ്ങൾ സൃഷ്ടിക്കുന്ന ആശയക്കുഴപ്പം ഒഴിവാക്കി പൗലൊസിന്റെ സംക്ഷിപ്തമായ ‘ക്രിസ്തുവിൽ’ എന്ന ഐക്യഭാഷ സംരക്ഷിക്കുന്നു.
- source_word: πρὸ καταβολῆς κόσμου
  choice: ലോകത്തിന്റെ സ്ഥാപനംമുമ്പേ
  rationale: ലോകം സ്ഥാപിക്കപ്പെടുന്നതിനു മുമ്പുള്ള കാലസൂചനയെ ഔപചാരികവും വായനാസൗകര്യമുള്ളതുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: εἶναι ἡμᾶς
  choice: ആയിരിക്കേണ്ടതിനാണ്
  rationale: അനന്തക്രിയയുടെ ഉദ്ദേശ്യ/ഫലസാധ്യത നിലനിർത്തുന്നു; ‘നമ്മെ’ മുമ്പേ ക്രിയയുടെ കർമമായി വന്നതിനാൽ മലയാളത്തിൽ അത് വീണ്ടും ആവർത്തിക്കേണ്ടതില്ല.
- source_word: ἁγίους
  choice: വിശുദ്ധരും
  rationale: വേർതിരിക്കപ്പെട്ട നിലയും ധാർമ്മിക വിശുദ്ധിയും ഉൾക്കൊള്ളുന്ന പ്രാഥമിക സമാനപദം.
- source_word: ἀμώμους
  choice: കുറ്റമറ്റവരും
  rationale: ധാർമ്മികമായും ആരാധനാസംബന്ധമായും കുറ്റം ചുമത്താനാകാത്ത നിലയെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; ‘കളങ്കമില്ലാത്തവർ’ എന്ന ബലിപരമായ പ്രതിധ്വനി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: κατενώπιον αὐτοῦ
  choice: അവിടുത്തെ സന്നിധിയിൽ
  rationale: ദൈവത്തിന്റെ സാന്നിധ്യത്തിലും ദൃഷ്ടിയിലും എന്ന ബന്ധപരമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐν ἀγάπῃ
  choice: സ്നേഹത്തോടെ
  rationale: പ്രധാനവാചകത്തിൽ മുൻവാക്യഭാഗത്തോട് ചേർത്ത് സ്വാഭാവിക മലയാളം നൽകുന്നു; അടുത്ത വാക്യത്തോട് ചേർക്കാവുന്ന യഥാർഥ വാക്യഘടനാസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἐξελέξατο എന്ന പദത്തെ മുൻനിർണ്ണയവുമായി ബന്ധപ്പെട്ട ഒരു പ്രത്യേക സിദ്ധാന്തരീതിയിൽ വായിക്കാനുള്ള സാധ്യത
  choice: തിരഞ്ഞെടുത്തു
  alternative: തിരഞ്ഞെടുക്കപ്പെട്ടവരാക്കി / ഇലക്ട് ചെയ്തു
  rationale: മൂലപാഠം ദൈവിക തിരഞ്ഞെടുപ്പിനെ വ്യക്തമായി പറയുന്നു; എന്നാൽ ഒരു പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ സാങ്കേതിക വ്യാഖ്യാനം പദത്തിൽ ചേർക്കുന്നില്ല.
- issue: ἐν ἀγάπῃ എന്ന പദസമുച്ചയത്തിന്റെ വാക്യഘടനാപരമായ ബന്ധം
  choice: വാക്യം 4-ലെ ‘വിശുദ്ധരും കുറ്റമറ്റവരും’ എന്ന ആശയത്തോട് ചേർത്ത് ‘സ്നേഹത്തോടെ’ എന്നു നൽകുന്നു
  alternative: വാക്യം 5-നോട് ചേർത്ത് ‘സ്നേഹത്തിൽ അവിടുന്ന് നമ്മെ മുൻകൂട്ടി നിശ്ചയിച്ചു…’ എന്നു വായിക്കാം
  rationale: ഗ്രീക്ക് പദക്രമം ഇരുവായനകൾക്കും ഇടനൽകുന്നു. പ്രധാനവാചകത്തിൽ സ്വാഭാവികമായ ഒരു വായന നൽകിയിട്ടും മറ്റേതിനെ അടിക്കുറിപ്പിലൂടെ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ദീർഘമായ ഗ്രീക്ക് വാക്യത്തിന്റെ ബന്ധം ‘അതുപോലെതന്നെ’ എന്നു നിലനിർത്തി; വായനാസൗകര്യത്തിനായി അർധവിരാമം ഉപയോഗിച്ചു. ‘അവൻ’ എന്ന സർവനാമത്തിന്റെ മലയാളത്തിലെ സാധ്യതയുള്ള ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ സന്ദർഭസൂചിതനായ ക്രിസ്തുവിനെ പേരെടുത്ത് പറഞ്ഞു.
