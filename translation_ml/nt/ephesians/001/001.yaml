id: EPH.1.1
reference: Ephesians 1:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ τοῖς ἁγίοις τοῖς οὖσιν ⸂[ἐν Ἐφέσῳ]⸃ καὶ πιστοῖς ἐν Χριστῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/001.yaml
  text: 'Paul[a], an apostle of Messiah Jesus by the will of God[c][b], to the saints who are [in Ephesus] and faithful in Messiah Jesus:'
translation:
  language: ml
  text: 'ദൈവഹിതത്താൽ മശീഹാ യേശുവിന്റെ അപ്പൊസ്തലനായ പൗലോസ്, [എഫെസൊസിലുള്ള][a] വിശുദ്ധരും മശീഹാ യേശുവിൽ വിശ്വസ്തരുമായവർക്ക്[b][c]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പ്രധാനപ്പെട്ട ചില പുരാതന കൈയെഴുത്തുപ്രതികളിൽ ‘എഫെസൊസിലുള്ള’ എന്ന വാക്ക് കാണുന്നില്ല. അതിനാൽ ഈ ലേഖനം എഫെസൊസിലെ സഭയ്ക്കു മാത്രമല്ല, കൂടുതൽ വ്യാപകമായി വായിക്കപ്പെടാൻ ഉദ്ദേശിച്ചതാകാമെന്ന് ചിലർ കരുതുന്നു.
    reason: textual_variant
  - marker: b
    text: അല്ലെങ്കിൽ, ‘മശീഹാ യേശുവിൽ വിശ്വസിക്കുന്നവർക്ക്.’
    reason: lexical_alternative
  - marker: c
    text: ഗ്രീക്കിൽ Χριστός എന്നത് ‘അഭിഷിക്തൻ’ എന്ന അർഥമുള്ള പദമാണ്; ഇവിടെ അത് ഒരു പദവിയായി പ്രവർത്തിക്കുന്നതിനാൽ ‘മശീഹാ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόστολος
  choice: അപ്പൊസ്തലൻ
  rationale: ഇവിടെ പൗലോസിന്റെ ദൈവിക നിയോഗവും അധികാരവും സൂചിപ്പിക്കുന്ന ആദിമ ക്രൈസ്തവ സ്ഥാനനാമമായതിനാൽ, പൊതുവായ ‘ദൂതൻ’ എന്നതിനെക്കാൾ സാങ്കേതിക അർഥം നിലനിർത്തുന്നു.
- source_word: Χριστοῦ Ἰησοῦ / ἐν Χριστῷ Ἰησοῦ
  choice: മശീഹായായ യേശുവിന്റെ / മശീഹായായ യേശുവിൽ
  rationale: Χριστός ഇവിടെ പേരിന്റെ വെറും ഭാഗമായി മാത്രമല്ല, യേശുവിന്റെ ‘മശീഹാ’ എന്ന പദവിയായി പ്രവർത്തിക്കുന്നു. വിഭക്തികളും ἐν എന്ന ബന്ധസൂചനയും മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തിയിരിക്കുന്നു.
- source_word: διὰ θελήματος θεοῦ
  choice: ദൈവഹിതത്താൽ
  rationale: διά + genitive ഇവിടെ പൗലോസിന്റെ അപ്പൊസ്തലത്വത്തിന്റെ ദൈവിക ഉറവിടവും അധികാരപ്പെടുത്തലും സൂചിപ്പിക്കുന്നു; സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗം.
- source_word: ἁγίοις
  choice: വിശുദ്ധർ
  rationale: ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ട ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്ന പൗലോസിന്റെ അഭിസംബോധന നിലനിർത്തുന്നു; അസാധാരണമായ ആത്മീയ പ്രമുഖർ എന്ന പരിമിത അർഥം നിർബന്ധിക്കുന്നില്ല.
- source_word: '[ἐν Ἐφέσῳ]'
  choice: '[എഫെസൊസിലുള്ള]'
  rationale: മൂലപാഠത്തിൽ പാഠഭേദസംശയം അടയാളപ്പെടുത്തിയിരിക്കുന്നതിനാൽ ചതുരബ്രാക്കറ്റുകൾ അതേപടി നിലനിർത്തി.
- source_word: πιστοῖς
  choice: വിശ്വസ്തർ
  rationale: πιστός എന്ന പദത്തിന്റെ ‘വിശ്വസ്തർ’ എന്ന വിശേഷണാർഥം നിലനിർത്തുന്നു; സാധ്യമായ ‘വിശ്വാസികൾ’ എന്ന അർഥം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
theological_decisions:
- issue: Χριστός എന്ന പദത്തിന്റെ പൗലോസിന്റെ അഭിവാദ്യത്തിലെ അർഥം
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: ഈ സന്ദർഭത്തിൽ Χριστός യേശുവിന്റെ പദവിയെ വ്യക്തമായി സൂചിപ്പിക്കുന്നതിനാൽ ‘മശീഹാ’ എന്നു പരിഭാഷപ്പെടുത്തി; പേരുപോലെ മാത്രം വായിക്കാവുന്ന വിധത്തിൽ അർഥം മങ്ങിച്ചിട്ടില്ല.
- issue: ἐν Ἐφέσῳ എന്ന വാക്കുകളുടെ പാഠസ്ഥിതി
  choice: പ്രധാനപാഠത്തിൽ [എഫെസൊസിലുള്ള] എന്നു ബ്രാക്കറ്റിൽ നിലനിർത്തി
  alternative: ഈ വാക്കുകൾ ഒഴിവാക്കുക
  rationale: പ്രധാനപ്പെട്ട ചില പുരാതന കൈയെഴുത്തുപ്രതികളിൽ ഈ വാക്കുകൾ ഇല്ല. അതിനാൽ ഒരു വായനയെ നിശ്ശബ്ദമായി തീരുമാനിക്കാതെ പാഠത്തിലെ അനിശ്ചിതത്വം ദൃശ്യമാക്കി.
- issue: πιστοῖς എന്നതിന്റെ അർഥം
  choice: വിശ്വസ്തർ
  alternative: വിശ്വാസികൾ
  rationale: ഈ പദത്തിന് വിശ്വസ്തതയെയും വിശ്വസിക്കുന്നവരുടെ തിരിച്ചറിയലിനെയും സൂചിപ്പിക്കാം. പ്രധാനപാഠത്തിൽ വിശേഷണസ്വഭാവം നിലനിർത്തി, മറ്റൊരു സാധുവായ വായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ലേഖനാരംഭശൈലി ഉപയോഗിച്ചു. മൂലത്തിലെ പദവികൾ, ബന്ധങ്ങൾ, പാഠഭേദം, πιστοῖς എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി എന്നിവ അനാവശ്യമായി വിശദീകരിക്കുകയോ ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കുകയോ ചെയ്തിട്ടില്ല.
