- from: അതാണ് അവന്റെ ശരീരം—എല്ലാറ്റിനെയും എല്ലാവരിലും നിറയ്ക്കുന്നവന്റെ നിറവ്.[a][b]
  to: അത് അവന്റെ ശരീരമാണ്—എല്ലാറ്റിനെയും എല്ലാറ്റിലും നിറയ്ക്കുന്നവന്റെ നിറവ്.[a][b]
  rationale: The revision removes an unwarranted restriction of ἐν πᾶσιν to persons and retains the Greek phrase's disputed breadth. It also makes the opening copular clause more idiomatic Malayalam without changing its referent or sense. The footnotes preserve both the personal alternative for ἐν πᾶσιν and the grammatically possible passive understanding of πληρουμένου.
