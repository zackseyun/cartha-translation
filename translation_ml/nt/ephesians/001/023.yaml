  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἥτις ἐστὶν τὸ σῶμα αὐτοῦ, τὸ πλήρωμα τοῦ τὰ πάντα ἐν πᾶσιν πληρουμένου.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/023.yaml
  text: which is his body[b][a], the fullness of the one who fills all things in all.
translation:
  language: ml
  text: അത് അവന്റെ ശരീരമാണ്—എല്ലാറ്റിനെയും എല്ലാറ്റിലും നിറയ്ക്കുന്നവന്റെ നിറവ്.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘എല്ലാറ്റിലും’ എന്നതിന് ‘എല്ലാവരിലും’ എന്നും മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “നിറയ്ക്കുന്നവൻ” എന്നതിനു പകരം ഈ പങ്കുപദത്തെ “നിറയ്ക്കപ്പെടുന്നവൻ” എന്നും മനസ്സിലാക്കാം; എങ്കിലും ഇവിടെ മിക്ക വ്യാഖ്യാതാക്കളും സകർമക അർത്ഥമാണ് സ്വീകരിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: ἥτις
  choice: അതാണ്
  rationale: മുൻവാക്യത്തിലെ സഭയെ സൂചിപ്പിക്കുന്ന ഗുണാത്മക ബന്ധസർവനാമം; മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: σῶμα
  choice: ശരീരം
  rationale: സഭയും മശീഹയും തമ്മിലുള്ള ബന്ധത്തിനുള്ള പൗലോസിന്റെ സ്ഥിരമായ രൂപകം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: πλήρωμα
  choice: നിറവ്
  rationale: ‘നിറയ്ക്കപ്പെട്ടത്’ എന്നോ ‘പൂർത്തീകരണം’ എന്നോ വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ, പദത്തിന്റെ സാന്ദ്രതയും അർത്ഥതുറപ്പും സൂക്ഷിക്കുന്നു.
- source_word: τοῦ ... πληρουμένου
  choice: നിറയ്ക്കുന്നവന്റെ
  rationale: രൂപപരമായി മധ്യമ/കർമണി പങ്കുപദമാണെങ്കിലും സന്ദർഭത്തിൽ സകർമകമായ അർത്ഥം ഏറ്റവും സ്വാഭാവികം; കർമണിവായന അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: τὰ πάντα
  choice: എല്ലാറ്റിനെയും
  rationale: നപുംസക ബഹുവചനത്തിന്റെ സമഗ്രവും പ്രാപഞ്ചികവുമായ വ്യാപ്തി നൽകുന്നു.
- source_word: ἐν πᾶσιν
  choice: എല്ലാവരിലും
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തവും അവ്യക്തവുമായ പ്രയോഗത്തെ വ്യക്തികളെ സൂചിപ്പിക്കാവുന്ന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘എല്ലാറ്റിലും’ എന്ന വിപുലമായ വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: സഭയും മശീഹയും തമ്മിലുള്ള ബന്ധത്തിൽ πλήρωμα എന്നതിന്റെ അർത്ഥം
  choice: സഭയെ അവന്റെ ശരീരവും ‘നിറവും’ എന്നു പറയുന്നു; അവൻ നിറയ്ക്കുന്നതാണോ അവനെ ഏതോ അർത്ഥത്തിൽ പൂർത്തിയാക്കുന്നതാണോ എന്ന് വിവർത്തനം തീർപ്പാക്കുന്നില്ല.
  alternative: അവനാൽ നിറയ്ക്കപ്പെടുന്നത്; അവന്റെ പൂരകം/പൂർത്തീകരണം
  rationale: ഗ്രീക്ക് ഒന്നിലധികം ബന്ധപ്പെട്ട വ്യാഖ്യാനങ്ങൾ അനുവദിക്കുന്നു; ‘നിറവ്’ ആ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം നിലനിർത്തുന്നു.
- issue: πληρουμένου എന്നതിന്റെ വാച്യഭേദം
  choice: ‘നിറയ്ക്കുന്നവൻ’ എന്ന സകർമക അർത്ഥം
  alternative: ‘നിറയ്ക്കപ്പെടുന്നവൻ’
  rationale: സന്ദർഭവും കൊയ്നേ പ്രയോഗവും സകർമക അർത്ഥത്തെ പിന്തുണയ്ക്കുന്നു; എന്നാൽ രൂപപരമായി സാധ്യമായ കർമണിവായന അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ മലയാളം. ‘നിറവ്’ എന്ന സംക്ഷിപ്ത പദം മൂലത്തിലെ ദൈവശാസ്ത്രസാന്ദ്രത നിലനിർത്തുന്നു; ദീർഘവാക്യം ഡാഷ് ഉപയോഗിച്ച് വായനാസൗകര്യത്തോടെ ബന്ധിപ്പിച്ചു.
