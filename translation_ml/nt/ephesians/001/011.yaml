id: EPH.1.11
reference: Ephesians 1:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν ᾧ καὶ ἐκληρώθημεν προορισθέντες κατὰ πρόθεσιν τοῦ τὰ πάντα ἐνεργοῦντος κατὰ τὴν βουλὴν τοῦ θελήματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/011.yaml
  text: In him we also were made an inheritance[a], having been predestined according to the purpose of the one who works all things according to the counsel of his will,
translation:
  language: ml
  text: തന്റെ ഹിതത്തിന്റെ ആലോചനയനുസരിച്ച് സകലവും പ്രവർത്തിപ്പിക്കുന്നവന്റെ ഉദ്ദേശ്യപ്രകാരം മുൻകൂട്ടി നിശ്ചയിക്കപ്പെട്ടവരായി, അവനിൽ നാമും അവകാശസ്വത്തായി തീർക്കപ്പെട്ടു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവനിൽ നമുക്കും ഒരു അവകാശം ലഭിച്ചു.” ഗ്രീക്ക് ക്രിയയ്ക്ക് ഒരു അവകാശം ലഭിച്ചു എന്നോ ദൈവത്തിന്റെ അവകാശസ്വത്തായി തീർക്കപ്പെട്ടു എന്നോ അർഥമാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: അവനിൽ
  rationale: മുൻസന്ദർഭത്തിലെ മശീഹയെയാണ് ബന്ധസർവനാമം സൂചിപ്പിക്കുന്നത്. ‘അവനിൽ’ എന്നത് ക്രിസ്തുവുമായുള്ള ഐക്യത്തിന്റെ ആശയം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἐκληρώθημεν
  choice: നാമും അവകാശസ്വത്താക്കപ്പെട്ടു
  rationale: κληρόω എന്ന ക്രിയയുടെ നിഷ്ക്രിയരൂപം ഒരു അവകാശം ലഭിക്കുന്നതിനെയോ ദൈവത്തിന്റെ ഓഹരി/അവകാശജനമായി തീരുന്നതിനെയോ സൂചിപ്പിക്കാം. നിഷ്ക്രിയരൂപവും ദൈവജനത്തെ അവന്റെ അവകാശമായി കാണുന്ന പഴയനിയമ പശ്ചാത്തലവും കണക്കിലെടുത്ത് രണ്ടാമത്തെ അർഥം മുഖ്യവാചകത്തിൽ സ്വീകരിച്ചു; യഥാർഥമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: προορισθέντες
  choice: മുൻകൂട്ടി നിശ്ചയിക്കപ്പെട്ടവരായി
  rationale: മുൻകൂട്ടിയുള്ള നിർണയമാണ് പദം വ്യക്തമാക്കുന്നത്. ഒരു സമ്പൂർണ ദൈവശാസ്ത്ര വ്യവസ്ഥയെ വാചകത്തിലേക്ക് കൊണ്ടുവരാതെ അതിന്റെ കാലപരവും നിർണായകവുമായ ബലം ഈ പരിഭാഷ നിലനിർത്തുന്നു.
- source_word: κατὰ πρόθεσιν
  choice: ഉദ്ദേശ്യപ്രകാരം
  rationale: πρόθεσις ഇവിടെ ഉദ്ദേശ്യപൂർവമായ ലക്ഷ്യത്തെയോ പദ്ധതിയെയോ സൂചിപ്പിക്കുന്നു. ‘ഉദ്ദേശ്യപ്രകാരം’ ചുരുക്കവും സ്വാഭാവികവും മൂലത്തോട് അടുത്തതുമാണ്.
- source_word: τοῦ τὰ πάντα ἐνεργοῦντος
  choice: സകലവും പ്രവർത്തിപ്പിക്കുന്നവന്റെ
  rationale: ദൈവത്തെ പ്രവർത്തിക്കുന്ന കർത്താവായി കൃത്തിന് സൂചിപ്പിക്കുന്നു. ‘പ്രവർത്തിപ്പിക്കുന്ന’ എന്നത് ദൈവിക പ്രവർത്തനത്തിന്റെ രീതി അനാവശ്യമായി വിശദീകരിക്കാതെ ἐνεργέωയുടെ സജീവശക്തി നൽകുന്നു.
- source_word: τὰ πάντα
  choice: സകലവും
  rationale: പ്രസ്താവനയുടെ സമഗ്രവ്യാപ്തി നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: κατὰ τὴν βουλὴν
  choice: ആലോചനയനുസരിച്ച്
  rationale: βουλήയിൽ ആലോചിച്ചുറച്ച തീരുമാനം എന്ന ഭാവമുണ്ട്. ‘ആലോചന’ വെറും ‘പദ്ധതി’യെക്കാൾ ആ വിവേചനാത്മക ഭാവം നിലനിർത്തുന്നു.
- source_word: τοῦ θελήματος αὐτοῦ
  choice: തന്റെ ഹിതത്തിന്റെ
  rationale: θέλημα ദൈവത്തിന്റെ ഇച്ഛയെയോ ഹിതത്തെയോ സൂചിപ്പിക്കുന്നു. ‘തന്റെ ഹിതം’ ആധുനിക മലയാളത്തിൽ മാന്യവും സ്വാഭാവികവുമായ പ്രയോഗമാണ്; βουλήയുമായുള്ള ജനിറ്റീവ് ബന്ധവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἐκληρώθημεν എന്നതിന്റെ അർഥം
  choice: വിശ്വാസികൾ ദൈവത്തിന്റെ അവകാശസ്വത്തായി തീർക്കപ്പെട്ടുവെന്ന് മുഖ്യവാചകം പറയുന്നു.
  alternative: വിശ്വാസികൾക്ക് ഒരു അവകാശം ലഭിച്ചു.
  rationale: നിഷ്ക്രിയമായ κληρόω ഇരുവിധത്തിലും മനസ്സിലാക്കാവുന്നതാണ്. ദൈവത്തിന്റെ രക്ഷോദ്ദേശ്യത്തെക്കുറിച്ചുള്ള സമീപസന്ദർഭവും ദൈവജനത്തെ അവന്റെ അവകാശമായി അവതരിപ്പിക്കുന്ന പഴയനിയമ പശ്ചാത്തലവും മുഖ്യവായനയെ പിന്തുണയ്ക്കുന്നു. എങ്കിലും മറ്റേ വായനയും ശക്തമായ സാധ്യതയായതിനാൽ അതിനെ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി സ്വീകരിച്ചു. ഗ്രീക്കിലെ നീണ്ട വാക്യഘടന പരമാവധി നിലനിർത്തിയെങ്കിലും മലയാളത്തിലെ സ്വാഭാവിക വിവരക്രമത്തിനായി ദൈവിക പ്രവർത്തകനെ സൂചിപ്പിക്കുന്ന ഭാഗം ആദ്യം വെച്ചു. സാങ്കേതിക ദൈവശാസ്ത്രപദമായേക്കാവുന്ന ‘മുൻനിർണയം’ ഒഴിവാക്കി, വ്യക്തമായ ‘മുൻകൂട്ടി നിശ്ചയിക്കപ്പെട്ടവർ’ ഉപയോഗിച്ചു.
