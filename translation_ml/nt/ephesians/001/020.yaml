- from: മരിച്ചവരിൽനിന്ന് അവനെ ഉയിർപ്പിച്ച് സ്വർഗീയ മണ്ഡലങ്ങളിൽ[b] തന്റെ വലതുഭാഗത്ത് ഇരുത്തിയപ്പോൾ, അവൻ ആ ശക്തി മശീഹയിൽ[a] പ്രവർത്തിപ്പിച്ചു.
