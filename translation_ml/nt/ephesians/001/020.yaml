id: EPH.1.20
reference: Ephesians 1:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἣν ⸀ἐνήργηκεν ἐν τῷ Χριστῷ ἐγείρας αὐτὸν ⸀ἐκ νεκρῶν, καὶ ⸀καθίσας ἐν δεξιᾷ αὐτοῦ ἐν τοῖς ἐπουρανίοις
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/020.yaml
  text: which he worked in the Messiah when he raised him from the dead and seated him at his right hand in the heavenly places[b][a],
translation:
  language: ml
  text: മരിച്ചവരിൽനിന്ന് അവനെ ഉയിർപ്പിച്ച് സ്വർഗീയ മണ്ഡലങ്ങളിൽ[b] തന്റെ വലതുഭാഗത്ത് ഇരുത്തി, അവൻ മശീഹയിൽ[a] ആ ശക്തി പ്രവർത്തിപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ക്രിസ്തുവിൽ.’
    reason: alternative_reading
  - marker: b
    text: അഥവാ, ‘സ്വർഗീയ ഇടങ്ങളിൽ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν
  choice: ആ ശക്തി
  rationale: സ്ത്രീലിംഗ സർവനാമം മുൻസന്ദർഭത്തിലെ ‘ശക്തി’യെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ആശ്രിതവാക്യത്തേക്കാൾ വ്യക്തവും സ്വാഭാവികവുമായ ബന്ധം നൽകാൻ സൂചിത നാമം ആവർത്തിച്ചു.
- source_word: ἐνήργηκεν
  choice: പ്രവർത്തിപ്പിച്ചു
  rationale: ദൈവശക്തി ഫലപ്രദമായി പ്രയോഗിക്കപ്പെട്ടുവെന്ന ക്രിയയുടെ സജീവമായ അർഥം പ്രകടമാക്കുന്നു.
- source_word: ἐν τῷ Χριστῷ
  choice: മശീഹയിൽ
  rationale: ഇവിടെ Χριστός അഭിഷിക്തനായ രാജാവിനെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നു; ἐν എന്ന മുൻവാക്കും നിലനിർത്തുന്നു.
- source_word: ἐγείρας αὐτὸν ἐκ νεκρῶν
  choice: മരിച്ചവരിൽനിന്ന് അവനെ ഉയിർപ്പിച്ച്
  rationale: പുനരുത്ഥാനത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുകയും പങ്കാളിക്രിയയുടെ ബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: καθίσας ἐν δεξιᾷ αὐτοῦ
  choice: തന്റെ വലതുഭാഗത്ത് ഇരുത്തിയപ്പോൾ
  rationale: ഉന്നതസ്ഥാനവും അധികാരവും സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തെ അക്ഷരാർഥത്തിലെ ‘വലതുകൈയിൽ’ എന്നു തെറ്റിദ്ധരിക്കാതെയുള്ള സ്വാഭാവിക സ്ഥലപ്രയോഗമായി പരിഭാഷപ്പെടുത്തി.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: സ്വർഗീയ മണ്ഡലങ്ങളിൽ
  rationale: നാമവൽക്കരിച്ച ബഹുവചന വിശേഷണം സൂചിപ്പിക്കുന്ന സ്വർഗീയ മേഖലയെ ആധുനികവും വായനാസുഖമുള്ളതുമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
theological_decisions:
- issue: Χριστῷ എന്നതിന്റെ പരിഭാഷ
  choice: മശീഹയിൽ
  alternative: ക്രിസ്തുവിൽ
  rationale: സന്ദർഭത്തിൽ പദത്തിന്റെ സ്ഥാനപ്പേരായ സ്വഭാവം പ്രകടമാക്കുന്നു; കൂടുതൽ പരിചിതമായ പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: ἐν τοῖς ἐπουρανίοις എന്നതിന്റെ പരിഭാഷ
  choice: സ്വർഗീയ മണ്ഡലങ്ങളിൽ
  alternative: സ്വർഗീയ ഇടങ്ങളിൽ
  rationale: സ്വർഗീയ മേഖലയെന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു; കൂടുതൽ നേരിട്ടുള്ള സ്ഥലസൂചനയുള്ള പരിഭാഷ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗ്രീക്ക് വാക്യത്തിലെ പങ്കാളിക്രിയകളുടെ ബന്ധം ‘ഉയിർപ്പിച്ച്… ഇരുത്തിയപ്പോൾ’ എന്ന ഘടനയിൽ നിലനിർത്തി; മുൻവാക്യത്തിലെ ശക്തിയിലേക്കുള്ള ബന്ധം വ്യക്തമാക്കാൻ ‘ആ ശക്തി’ എന്നു പറഞ്ഞു.
