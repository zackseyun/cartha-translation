source:
  edition: SBLGNT
  text: γνωρίσας ἡμῖν τὸ μυστήριον τοῦ θελήματος αὐτοῦ, κατὰ τὴν εὐδοκίαν αὐτοῦ ἣν προέθετο ἐν αὐτῷ
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/009.yaml
  text: having made known to us the mystery of his will[a], according to his good pleasure, which he purposed in himself
translation:
  language: ml
  text: തന്റെ ഇഷ്ടത്തിന്റെ രഹസ്യം നമുക്കു അറിയിച്ചുകൊണ്ട്, അവനിൽ[a] നിശ്ചയിച്ച തന്റെ പ്രസാദപ്രകാരം—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ക്രിസ്തുവിൽ’; ചിലർ ‘അവനിൽ’ എന്നതിനെ ദൈവത്തെ സൂചിപ്പിക്കുന്നതായി ഗ്രഹിച്ച്, ‘തന്നിൽത്തന്നെ’ എന്നും മനസ്സിലാക്കുന്നു.
    reason: ἐν αὐτῷ എന്ന സർവനാമത്തിന്റെ പൂർവപദം വ്യത്യസ്തമായി ഗ്രഹിക്കാവുന്നതാണ്.
lexical_decisions:
- source_word: γνωρίσας
  choice: അറിയിച്ചുകൊണ്ട്
  rationale: പ്രധാനവാക്യത്തിലെ ദൈവത്തെ കർത്താവായി സ്വീകരിക്കുന്ന എയോറിസ്റ്റ് കർത്തൃവാചക ക്രിയാനാമരൂപം. ചുറ്റുമുള്ള ദീർഘവാക്യവുമായുള്ള വ്യാകരണബന്ധം നിലനിർത്താൻ മലയാളത്തിൽ ക്രിയാനാമരൂപമായി പരിഭാഷപ്പെടുത്തി.
- source_word: ἡμῖν
  choice: നമുക്ക്
  rationale: γνωρίζω എന്ന ക്രിയയുടെ പരോക്ഷകർമത്തെ സൂചിപ്പിക്കുന്ന ദാതിവ് രൂപമാണ്.
- source_word: μυστήριον
  choice: മർമം
  rationale: മുമ്പ് മറഞ്ഞിരുന്നതും ഇപ്പോൾ വെളിപ്പെടുത്തപ്പെട്ടതുമായ ദൈവിക ഉദ്ദേശ്യം എന്ന പൗലൊസിന്റെ ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; വെറും പരിഹരിക്കാനാവാത്ത കടങ്കഥ എന്ന ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: θέλημα
  choice: ഇഷ്ടം
  rationale: ദൈവത്തിന്റെ ഇച്ഛയെ സൂചിപ്പിക്കുന്നു; പിന്നീട് വരുന്ന προέθετο എന്ന ഉദ്ദേശ്യക്രിയയിൽനിന്ന് അർത്ഥവ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: κατὰ
  choice: പ്രകാരം
  rationale: അക്കുസറ്റീവോടുകൂടിയ κατά ഇവിടെ മാനദണ്ഡമോ അനുരൂപതയോ സൂചിപ്പിക്കുന്നു.
- source_word: εὐδοκίαν
  choice: പ്രസാദം
  rationale: ദൈവത്തിന്റെ സന്തോഷപൂർവമായ ഹിതവും അനുകൂല ഉദ്ദേശ്യവും ഉൾക്കൊള്ളുന്ന പദം; ഔന്നത്യമുള്ളതെങ്കിലും മലയാള വായനക്കാർക്ക് പരിചിതമാണ്.
- source_word: προέθετο
  choice: നിശ്ചയിച്ച
  rationale: സന്ദർഭത്തിൽ ദൈവം തന്റെ ഉദ്ദേശ്യം നിശ്ചയിച്ചതിനെ സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിൽ നിർബന്ധമില്ലാത്ത കാലസൂചന ചേർക്കാതിരിക്കാൻ ‘മുൻകൂട്ടി’ ഒഴിവാക്കി.
- source_word: ἐν αὐτῷ
  choice: അവനിൽ
  rationale: ഗ്രീക്കിലെ സർവനാമം സുതാര്യമായി നിലനിർത്തുകയും അതിന്റെ പൂർവപദം മുഖ്യപാഠത്തിൽ തീർപ്പാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ἐν αὐτῷ എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: മുഖ്യപാഠത്തിൽ ‘അവനിൽ’ എന്ന സർവനാമം നിലനിർത്തി.
  alternative: ‘ക്രിസ്തുവിൽ’ എന്നും, പ്രതിഫലനാർഥത്തിൽ ‘തന്നിൽത്തന്നെ’ എന്നും ഗ്രഹിക്കാം.
  rationale: സമീപസന്ദർഭം ക്രിസ്തുവിനെ സൂചിപ്പിക്കാമെങ്കിലും, ദൈവത്തെത്തന്നെ സൂചിപ്പിക്കുന്ന പ്രതിഫലനവായനയും വ്യാകരണപരമായി സാധ്യമാണ്. അതിനാൽ ആശയപരമായ സംഘർഷം മുഖ്യപാഠത്തിൽ ഏകപക്ഷീയമായി പരിഹരിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. ഈ വാക്യം ഗ്രീക്കിൽ മുൻവാക്യവുമായി ബന്ധിപ്പിച്ചിരിക്കുന്ന ക്രിയാനാമഘടനയായതിനാൽ അവസാനത്തിലെ ദീർഘരേഖ അതിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്നു. ‘പ്രസാദം’ ദൈവത്തിന്റെ സന്തോഷപൂർവമായ ഹിതം എന്ന അർത്ഥത്തിൽ ഉപയോഗിച്ചിരിക്കുന്നു; ‘മർമം’ വെളിപ്പെടുത്തപ്പെട്ട ദൈവിക രഹസ്യം എന്ന പൗലൊസീയ അർത്ഥം നൽകുന്നു.
