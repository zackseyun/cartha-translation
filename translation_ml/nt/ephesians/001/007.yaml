id: EPH.1.7
reference: Ephesians 1:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν ᾧ ἔχομεν τὴν ἀπολύτρωσιν διὰ τοῦ αἵματος αὐτοῦ, τὴν ἄφεσιν τῶν παραπτωμάτων, κατὰ ⸂τὸ πλοῦτος⸃ τῆς χάριτος αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/007.yaml
  text: In him we have redemption through his blood[a], the forgiveness of trespasses[b], according to the riches of his grace
translation:
  language: ml
  text: അവനിൽ[a] നമുക്കു അവന്റെ രക്തത്തിലൂടെ വീണ്ടെടുപ്പുണ്ട്—അതിക്രമങ്ങളുടെ[b] ക്ഷമ—അവന്റെ കൃപയുടെ സമൃദ്ധിക്ക് അനുസൃതമായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ആരിൽ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ലംഘനങ്ങളുടെ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: അവനിൽ
  rationale: മുൻവാക്യത്തിലെ പ്രിയനായവനെ സൂചിപ്പിക്കുന്ന ബന്ധസർവനാമമാണിത്. ‘അവനിൽ’ എന്നത് ക്രിസ്തുവുമായുള്ള ബന്ധം നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: ἔχομεν
  choice: നമുക്ക് … ലഭിച്ചിരിക്കുന്നു
  rationale: വർത്തമാനകാലത്തിലുള്ള കൈവശത്തെയും അനുഭവിക്കുന്ന യാഥാർഥ്യത്തെയും വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: ἀπολύτρωσιν
  choice: വീണ്ടെടുപ്പ്
  rationale: വിലയേറിയ മാർഗത്തിലൂടെ സാധ്യമാകുന്ന മോചനമെന്ന പൗലോസിന്റെ ആശയഭാരം ‘വീണ്ടെടുപ്പ്’ നിലനിർത്തുന്നു.
- source_word: διὰ τοῦ αἵματος αὐτοῦ
  choice: അവന്റെ രക്തത്തിലൂടെ
  rationale: διά + സമ്പന്നവിഭക്തി മാർഗമോ ഉപാധിയോ സൂചിപ്പിക്കുന്നു; രക്തത്തിന്റെ ബലിമരണ-ഉടമ്പടി ദൃശ്യഭാഷയെ വ്യാഖ്യാനിച്ച് മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: ἄφεσιν
  choice: ക്ഷമ
  rationale: ഇവിടെ വീണ്ടെടുപ്പിനോട് സമാനാധികരണത്തിൽ നിൽക്കുന്ന ഈ പദം കുറ്റങ്ങളുടെ മോചനം അഥവാ ക്ഷമയെ സൂചിപ്പിക്കുന്നു.
- source_word: παραπτωμάτων
  choice: അതിക്രമങ്ങളുടെ
  rationale: തെറ്റായ ചുവടുവെപ്പ്, കുറ്റം, ലംഘനം എന്നീ ധാർമിക-ബന്ധപരമായ അർഥവ്യാപ്തി ‘അതിക്രമങ്ങൾ’ മതിയായ രീതിയിൽ വഹിക്കുന്നു.
- source_word: κατὰ τὸ πλοῦτος
  choice: സമൃദ്ധിക്കൊത്തവിധം
  rationale: κατά ഇവിടെ ഉറവിടം മാത്രമല്ല, മാനദണ്ഡമോ അളവോ സൂചിപ്പിക്കുന്നു; ദൈവകൃപയുടെ സമൃദ്ധിക്കനുസൃതമായ അളവ് ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: χάριτος
  choice: കൃപ
  rationale: ദൈവത്തിന്റെ അർഹിക്കാത്ത അനുഗ്രഹപൂർണമായ പ്രീതിയെ സൂചിപ്പിക്കുന്ന പൗലോസിന്റെ കേന്ദ്രപദത്തിന് സ്ഥാപിതവും അർഥസമ്പന്നവുമായ മലയാളരൂപം.
theological_decisions:
- issue: ‘വീണ്ടെടുപ്പ്’ എന്നതും ‘അതിക്രമങ്ങളുടെ ക്ഷമ’ എന്നതും തമ്മിലുള്ള ബന്ധം
  choice: ഇരുപദസമുച്ചയങ്ങളെയും സമാനാധികരണത്തിൽ നിലനിർത്തി, ഇടയിൽ ഡാഷുകൾ ഉപയോഗിച്ചു.
  alternative: ‘വീണ്ടെടുപ്പ്, അതായത് അതിക്രമങ്ങളുടെ ക്ഷമ’ എന്നു വ്യക്തമായി വ്യാഖ്യാനിക്കുക.
  rationale: രണ്ടാമത്തെ നാമപദസമുച്ചയം ആദ്യത്തേതിനെ വിശദീകരിക്കുന്നതായി സ്വാഭാവികമായി വായിക്കാമെങ്കിലും, ‘അതായത്’ ചേർത്ത് ബന്ധം പൂർണമായി നിർണയിക്കാതെ ഗ്രീക്ക് ഘടനയിലെ സംക്ഷിപ്തതയും ആശയസമ്മർദവും നിലനിർത്തുന്നു.
- issue: ‘അവന്റെ രക്തത്തിലൂടെ’ എന്ന പ്രായശ്ചിത്തഭാഷ
  choice: രക്തത്തെക്കുറിച്ചുള്ള മൂർത്തമായ പദപ്രയോഗം അതേപടി നിലനിർത്തി.
  alternative: ‘അവന്റെ മരണത്തിലൂടെ’ അല്ലെങ്കിൽ ‘അവന്റെ ബലിമരണത്തിലൂടെ’.
  rationale: മൂലപാഠം നേരിട്ട് ‘രക്തം’ എന്നാണ് പറയുന്നത്. അതിനെ ‘മരണം’ എന്നു മാറ്റുന്നത് പരിഭാഷയെക്കാൾ വ്യാഖ്യാനമാകുകയും ബലി-ഉടമ്പടി ദൃശ്യഭാഷയെ ക്ഷയിപ്പിക്കുകയും ചെയ്യും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ദൈവശാസ്ത്രപരമായി ഭാരം വഹിക്കുന്ന ‘വീണ്ടെടുപ്പ്,’ ‘രക്തം,’ ‘ക്ഷമ,’ ‘കൃപ’ എന്നീ പദങ്ങൾ നിലനിർത്തി; സമാനാധികരണ ഘടനയെ അമിതമായി വിശദീകരിച്ചിട്ടില്ല.
