id: EPH.1.10
reference: Ephesians 1:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰς οἰκονομίαν τοῦ πληρώματος τῶν καιρῶν, ἀνακεφαλαιώσασθαι τὰ πάντα ἐν τῷ Χριστῷ, τὰ ἐπὶ τοῖς οὐρανοῖς καὶ τὰ ἐπὶ τῆς γῆς· ἐν αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/010.yaml
  text: for the administration of the fullness of the times[a], to sum up all things in the Messiah—the things in the heavens and the things on the earth—in him,
translation:
  language: ml
  text: കാലങ്ങൾ പൂർണതയിലെത്തുമ്പോഴുള്ള ഭരണക്രമത്തിനായി, സകലത്തെയും മശീഹയിൽ സംഗ്രഹിക്കാൻ[a]—സ്വർഗങ്ങളിലുള്ളവയെയും ഭൂമിയിലുള്ളവയെയും—അവനിൽ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സകലത്തെയും മശീഹ എന്ന ശിരസ്സിന്റെ കീഴിൽ ഒന്നിച്ചുചേർക്കാൻ”; ഗ്രീക്ക് ക്രിയയ്ക്ക് സംഗ്രഹിക്കുക എന്നോ ഒരു ശിരസ്സിന്റെ കീഴിൽ ഏകീകരിക്കുക എന്നോ അർഥമാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: οἰκονομίαν
  choice: കാര്യനിർവഹണം
  rationale: ദൈവിക ഉദ്ദേശ്യം ക്രമമായി നടപ്പാക്കുന്നതെന്ന ആശയം നിലനിർത്തുന്നു; ‘പദ്ധതി’ എന്നു മാത്രം പറഞ്ഞ് അർഥം ചുരുക്കുന്നില്ല.
- source_word: πληρώματος τῶν καιρῶν
  choice: കാലങ്ങളുടെ പൂർണത
  rationale: കാലങ്ങൾ അവയുടെ പൂർണ അളവിലോ നിശ്ചിത പൂർത്തിയിലോ എത്തുന്നതെന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ഗൗരവവും തുറന്ന അർഥവും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: ἀνακεφαλαιώσασθαι
  choice: സംഗ്രഹിക്കാൻ
  rationale: സകലത്തെയും ഒന്നിച്ചു സമാഹരിക്കുക, ആകെച്ചേർക്കുക എന്നീ ആശയങ്ങൾ നൽകുന്നു; ‘ഒരു ശിരസ്സിൻ കീഴിൽ’ എന്ന സാധ്യതയുള്ള സൂചന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: τὰ πάντα
  choice: സകലത്തെയും
  rationale: നപുംസകലിംഗ ബഹുവചനത്തിന്റെ സമഗ്രമായ പ്രപഞ്ചവ്യാപക പരിധി സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐν τῷ Χριστῷ
  choice: മശീഹയിൽ
  rationale: ഇവിടെ Χριστός ഒരു സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നതിനാൽ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: τὰ ἐπὶ τοῖς οὐρανοῖς
  choice: സ്വർഗങ്ങളിലുള്ളവയെയും
  rationale: οὐρανοῖς എന്ന ഗ്രീക്ക് ബഹുവചനം നിലനിർത്തുകയും സ്വർഗീയ മണ്ഡലത്തിലുള്ളവയെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: ഭൂമിയിലുള്ളവയെയും
  rationale: സ്വർഗങ്ങളിലുള്ളവയോടുള്ള സ്ഥാനപരമായ വിരുദ്ധത വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἐν αὐτῷ
  choice: അവനിൽത്തന്നെ
  rationale: മശീഹയിലേക്കു മടങ്ങിച്ചൂണ്ടുന്ന സർവനാമവും ഗ്രീക്കിലെ ആവർത്തനത്തിന്റെ ഊന്നലും നിലനിർത്തുന്നു.
theological_decisions:
- issue: Χριστῷ എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മശീഹയിൽ
  alternative: ക്രിസ്തുവിൽ
  rationale: ഈ സന്ദർഭത്തിൽ പദം വ്യക്തിനാമത്തേക്കാൾ അഭിഷിക്തനായ രാജാവിന്റെ സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നു.
- issue: ἀνακεφαλαιώσασθαι എന്ന ക്രിയയുടെ അർഥം
  choice: സകലത്തെയും സംഗ്രഹിക്കാൻ
  alternative: സകലത്തെയും മശീഹ എന്ന ശിരസ്സിൻ കീഴിൽ ഒന്നിച്ചുചേർക്കാൻ
  rationale: ക്രിയയ്ക്ക് ആകെച്ചേർക്കുക, ഒന്നിപ്പിക്കുക, ഒരു ശിരസ്സിൻ കീഴിൽ കൊണ്ടുവരുക എന്നീ പരസ്പരം ബന്ധപ്പെട്ട അർഥസാധ്യതകളുണ്ട്. പ്രധാന പാഠം കൂടുതൽ നേരിട്ടുള്ള അർഥം നൽകുന്നു; ശിരഃസ്ഥാനത്തിന്റെ സൂചന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി ഉപയോഗിച്ചു. വാക്യം ചുറ്റുമുള്ള വാക്യഘടനയുടെ ഭാഗമായതിനാൽ മൂലപാഠത്തിലെ അപൂർണ വാക്യസ്വഭാവവും അവസാന കോമയും നിലനിർത്തി; മശീഹയിലുള്ളതെന്ന ആവർത്തന ഊന്നലും ഒഴിവാക്കിയിട്ടില്ല.
