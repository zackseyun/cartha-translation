revisions:
- from: കാലങ്ങളുടെ പൂർണതയിലെ കാര്യനിർവഹണത്തിനായി, സകലത്തെയും മശീഹയിൽ സംഗ്രഹിക്കാൻ[a]—സ്വർഗങ്ങളിലുള്ളവയെയും ഭൂമിയിലുള്ളവയെയും—അവനിൽത്തന്നെ,
