  yaml_path: translation/nt/ephesians/001/018.yaml
  text: having the eyes of your heart enlightened[a], so that you may know what is the hope of his calling, what is the wealth of the glory of his inheritance among the saints[b],
translation:
  language: ml
  text: നിങ്ങളുടെ ഹൃദയത്തിന്റെ കണ്ണുകൾ പ്രകാശിതമായിരിക്കെ, അവന്റെ വിളിയുടെ പ്രത്യാശ എന്തെന്നും വിശുദ്ധന്മാരുടെ ഇടയിലെ[b] അവന്റെ അവകാശത്തിന്റെ മഹത്വത്തിന്റെ സമൃദ്ധി[a] എന്തെന്നും നിങ്ങൾ അറിയേണ്ടതിന്,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മഹത്വത്തിന്റെ സമ്പത്ത്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘വിശുദ്ധന്മാരിലുള്ള അവന്റെ അവകാശം’ അല്ലെങ്കിൽ ‘അവന്റെ വിശുദ്ധജനത്തിന്റെ ഇടയിലുള്ള അവകാശം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
lexical_decisions:
- source_word: πεφωτισμένους
  choice: പ്രകാശിപ്പിക്കപ്പെട്ട നിലയിൽ
  rationale: പൂർണകാല നിഷ്ക്രിയ കൃദന്തരൂപത്തിന്റെ പൂർത്തിയായ പ്രവൃത്തിയും തുടരുന്ന ഫലാവസ്ഥയും കഴിയുന്നത്ര സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ὀφθαλμοὺς τῆς καρδίας ὑμῶν
  choice: നിങ്ങളുടെ ഹൃദയത്തിന്റെ കണ്ണുകൾ
  rationale: ‘ഗ്രഹണം’ എന്നാക്കി രൂപകം ഇല്ലാതാക്കാതെ പൗലോസിന്റെ ദൃശ്യരൂപം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: εἰς τὸ εἰδέναι ὑμᾶς
  choice: നിങ്ങൾ അറിയേണ്ടതിന്
  rationale: ഗ്രീക്കിലെ ഉദ്ദേശ്യസൂചക infinitival construction മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἐλπὶς
  choice: പ്രത്യാശ
  rationale: ഉറപ്പോടെയുള്ള പ്രതീക്ഷയെ സൂചിപ്പിക്കുന്ന പൗലോസിന്റെ പതിവ് പദപ്രയോഗത്തിന് യോജിച്ച വേദപാരമ്പര്യസമ്പന്നമായ മലയാളപദം.
- source_word: κλήσεως αὐτοῦ
  choice: അവന്റെ വിളി
  rationale: Genitive ബന്ധം വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: πλοῦτος
  choice: സമൃദ്ധി
  rationale: അളവറ്റ ധാരാളിത്തത്തിന്റെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘സമ്പത്ത്’ എന്നതിനെക്കാൾ ഈ ഗുണപരമായ genitive നിരയിൽ ഒഴുക്കുള്ളത്.
- source_word: δόξης
  choice: മഹത്വം
  rationale: δόξα എന്ന ദൈവശാസ്ത്രപരമായി പ്രാധാന്യമുള്ള പദത്തിന്റെ പതിവും പ്രസക്തവുമായ മലയാളരൂപം.
- source_word: κληρονομίας αὐτοῦ
  choice: അവന്റെ അവകാശം
  rationale: അത് ദൈവത്തിനുള്ള അവകാശമാണോ ദൈവം നൽകുന്ന അവകാശമാണോ എന്ന് ഗ്രീക്ക് തീർപ്പാക്കാത്തതിനാൽ അതേ തുറന്ന നില സംരക്ഷിക്കുന്നു.
- source_word: ἐν τοῖς ἁγίοις
  choice: വിശുദ്ധന്മാരുടെ ഇടയിൽ
  rationale: ἐν എന്നതിന്റെ സാമൂഹിക അർത്ഥമായ ‘ഇടയിൽ’ സ്വാഭാവികമായി നൽകുന്നു; ‘വിശുദ്ധന്മാർ’ എന്ന മൂലപദസൂചനയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘വിശുദ്ധന്മാരിൽ/വിശുദ്ധന്മാരുടെ ഇടയിൽ അവന്റെ അവകാശം’ എന്നത് ദൈവം തന്റെ ജനത്തെ സ്വന്തമാക്കിയതാണോ, അവൻ വിശ്വാസികൾക്കു നൽകുന്ന അവകാശമാണോ എന്ന ചോദ്യം
  choice: വിശുദ്ധന്മാരുടെ ഇടയിൽ അവന്റെ അവകാശം
  alternative: വിശുദ്ധന്മാരിലുള്ള അവന്റെ അവകാശം; വിശുദ്ധജനത്തിന്റെ ഇടയിൽ അവന്റെ അവകാശം
  rationale: Genitive-ഉം ἐν എന്ന preposition-ഉം ഒന്നിലധികം സൂക്ഷ്മാർഥങ്ങൾക്ക് ഇടനൽകുന്നു. മുഖ്യപാഠം ഒരു പ്രത്യേക ദൈവശാസ്ത്രവ്യാഖ്യാനം നിർബന്ധിക്കാതെ ഈ പിരിമുറുക്കം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗഹൃദവുമായ ശൈലി. വാക്യത്തിന്റെ പൗലോസീയമായ ദീർഘഘടനയും ‘ഹൃദയത്തിന്റെ കണ്ണുകൾ’ എന്ന രൂപകവും ദൈവശാസ്ത്രപരമായ അനിശ്ചിതത്വവും നിലനിർത്തിയിരിക്കുന്നു. ഇംഗ്ലീഷ് അടിക്കുറിപ്പ് a നൽകിയ സ്ഥാനം ഉള്ളടക്കവുമായി പൊരുത്തപ്പെടാത്തതായി തോന്നുന്നതിനാൽ, രണ്ടു നിർബന്ധിത സൂചകങ്ങളും വാക്യാവസാനത്തിൽ ചേർത്തിരിക്കുന്നു.
