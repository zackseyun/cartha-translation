  terminology: ‘ഹൃദയത്തിന്റെ കണ്ണുകൾ,’ ‘പ്രത്യാശ,’ ‘വിളി,’ ‘മഹത്വം,’ ‘അവകാശം,’ and ‘വിശുദ്ധന്മാർ’ are appropriate and retain the biblical-register terminology without imposing an interpretation. ‘സമൃദ്ധി’ suitably conveys πλοῦτος in this context.
