id: EPH.1.14
reference: Ephesians 1:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ὅ ἐστιν ἀρραβὼν τῆς κληρονομίας ἡμῶν, εἰς ἀπολύτρωσιν τῆς περιποιήσεως, εἰς ἔπαινον τῆς δόξης αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/014.yaml
  text: who is the down payment of our inheritance, toward the redemption of the possession, to the praise of his glory.
translation:
  language: ml
  text: അവനാണ് നമ്മുടെ അവകാശത്തിന്റെ മുൻകൂർ ഉറപ്പ്; സ്വന്തമാക്കപ്പെട്ടവരുടെ വീണ്ടെടുപ്പിലേക്കായി, അവന്റെ മഹത്ത്വത്തിന്റെ പുകഴ്ചയ്ക്കായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀρραβών
  choice: മുൻകൂർ ഉറപ്പ്
  rationale: പിന്നീട് പൂർണമായി ലഭിക്കാനിരിക്കുന്നതിന്റെ ആദ്യഗഡുവും ഉറപ്പും എന്ന പദത്തിന്റെ ഇരട്ട ആശയം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: κληρονομία
  choice: അവകാശം
  rationale: ദൈവജനത്തിനു വാഗ്ദാനം ചെയ്യപ്പെട്ട ഭാവി പങ്ക്/പൈതൃകം എന്ന അർഥം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: ἀπολύτρωσις
  choice: വീണ്ടെടുപ്പ്
  rationale: മോചനവിലയുമായി ബന്ധപ്പെട്ട വിടുതൽ എന്ന പുതിയനിയമ ആശയത്തിന് പ്രചാരത്തിലുള്ളതും യോജിച്ചതുമായ പദം.
- source_word: περιποίησις
  choice: ദൈവം സ്വന്തമാക്കിയവർ
  rationale: ഇവിടെ ‘സ്വത്താക്കപ്പെട്ട ജനത/സ്വന്തമായവർ’ എന്ന അർഥം സന്ദർഭത്തിനു യോജിക്കുന്നു; വെറും ‘സ്വത്ത്’ എന്ന അമൂർത്ത പ്രയോഗം മലയാളത്തിൽ അവ്യക്തമാകും.
- source_word: εἰς
  choice: …ലേക്കായി / …ക്കായി
  rationale: ആദ്യ പ്രയോഗത്തിൽ ലക്ഷ്യത്തിലേക്കുള്ള ദിശയും രണ്ടാമത്തേതിൽ ഉദ്ദേശ്യവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ὅ എന്ന ബന്ധസർവനാമത്തിന്റെ സൂചകം
  choice: അവനാണ്
  alternative: അതുതന്നെയാണ്
  rationale: മുൻവാക്യത്തിലെ τῷ πνεύματι എന്ന നപുംസകലിംഗരൂപത്തെ ആശയപരമായി വ്യക്തിയായ പരിശുദ്ധാത്മാവിനോട് ബന്ധിപ്പിക്കുന്ന പുല്ലിംഗ ὅയെ പ്രതിഫലിപ്പിക്കുന്നു; ആത്മാവിന്റെ വ്യക്തിത്വം മായ്ച്ചുകളയുന്നില്ല.
- issue: τῆς περιποιήσεως എന്നതിന്റെ അർഥം
  choice: ദൈവം സ്വന്തമാക്കിയവർ
  alternative: സ്വത്തിന്റെ / സമ്പാദിക്കപ്പെട്ട അവകാശത്തിന്റെ
  rationale: ജനങ്ങളെ ദൈവത്തിന്റെ സ്വന്തമായി കാണുന്ന വായന സന്ദർഭത്തോടും പുതിയനിയമ പ്രയോഗത്തോടും നന്നായി ചേരുന്നു; എന്നാൽ വ്യാകരണപരമായി ‘സ്വത്ത്/സ്വന്തമാക്കിയത്’ എന്ന വിശാലത പൂർണമായി ഇല്ലാതാക്കുന്നില്ല.
- issue: εἰς ἀπολύτρωσιν എന്നതിന്റെ ബന്ധം
  choice: വീണ്ടെടുപ്പിലേക്കായി
  alternative: വീണ്ടെടുപ്പിനായി
  rationale: വരാനിരിക്കുന്ന പൂർണ വീണ്ടെടുപ്പിലേക്കുള്ള ദിശ/ലക്ഷ്യം എന്ന ഗ്രീക്ക് εἰς-ന്റെ സൂക്ഷ്മത കാത്തുസൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സഭാപരമായി പരിചിതമായെങ്കിലും സാധാരണ വായനക്കാർക്കും ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. മുൻവാക്യത്തിൽ പറഞ്ഞ പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അവനാണ്’ ഉപയോഗിച്ചു; ഈ വാക്യം ഒറ്റയ്ക്കും വായിക്കാവുന്നവിധം അനാവശ്യ വിശദീകരണം ചേർത്തിട്ടില്ല.
