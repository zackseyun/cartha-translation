revisions:
- from: അവനാണ് നമ്മുടെ അവകാശത്തിന്റെ മുൻകൂർ ഉറപ്പ്; ദൈവം സ്വന്തമാക്കിയവരുടെ വീണ്ടെടുപ്പിലേക്കായി, അവന്റെ മഹത്ത്വത്തിന്റെ പുകഴ്ചയ്ക്കായി തന്നത്.
  to: അവനാണ് നമ്മുടെ അവകാശത്തിന്റെ മുൻകൂർ ഉറപ്പ്; സ്വന്തമാക്കപ്പെട്ടവരുടെ വീണ്ടെടുപ്പിലേക്കായി, അവന്റെ മഹത്ത്വത്തിന്റെ പുകഴ്ചയ്ക്കായി.
