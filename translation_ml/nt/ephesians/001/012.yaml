id: EPH.1.12
reference: Ephesians 1:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰς τὸ εἶναι ἡμᾶς εἰς ἔπαινον δόξης αὐτοῦ τοὺς προηλπικότας ἐν τῷ Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/012.yaml
  text: so that we who had already hoped in Messiah might be for the praise of his glory[a][b].
translation:
  language: ml
  text: മശീഹയിൽ നേരത്തേതന്നെ പ്രത്യാശവെച്ചിരുന്ന നാം അവന്റെ മഹത്വത്തിന്റെ സ്തുതിക്കായി ആയിരിക്കേണ്ടതിന്.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മശീഹയിൽ ആദ്യം പ്രത്യാശവെച്ചവരായ.’
    reason: alternative_reading
  - marker: b
    text: 'മറ്റൊരു പദക്രമം: ‘അവന്റെ മഹത്വത്തിന്റെ സ്തുതിക്കായി, മശീഹയിൽ നേരത്തേതന്നെ പ്രത്യാശവെച്ചിരുന്ന നാം ആയിരിക്കേണ്ടതിന്.’'
    reason: previous_rendering
lexical_decisions:
- source_word: εἰς τὸ εἶναι
  choice: ആയിത്തീരേണ്ടതിന്
  rationale: ഉദ്ദേശ്യമോ ഫലമോ സൂചിപ്പിക്കുന്ന εἰς + articular infinitive ഘടനയെ സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; സന്ദർഭത്തിലെ തുടർച്ചയും നിലനിർത്തുന്നു.
- source_word: ἡμᾶς
  choice: നാം
  rationale: ഗ്രീക്കിൽ infinitive-ന്റെ accusative subject ആണെങ്കിലും, മലയാളത്തിലെ പുനർഘടിപ്പിച്ച ഉദ്ദേശ്യവാക്യത്തിൽ ‘നാം’ സ്വാഭാവികമാണ്.
- source_word: εἰς ἔπαινον
  choice: പുകഴ്ചയ്ക്കായി
  rationale: ഉദ്ദേശ്യം/ഫലം സൂചിപ്പിക്കുന്ന ആവർത്തിത എഫെസ്യൻ പ്രയോഗത്തിന്റെ രൂപവും ‘praise’ എന്ന അർഥവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: δόξης αὐτοῦ
  choice: അവന്റെ മഹത്വത്തിന്റെ
  rationale: ഗ്രീക്ക് genitive ബന്ധം സംരക്ഷിക്കുകയും δόξαയുടെ ദൈവശാസ്ത്രപരമായ ഭാരമുള്ള ‘മഹത്വം’ എന്ന അർഥം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: τοὺς προηλπικότας
  choice: നേരത്തേതന്നെ പ്രത്യാശവെച്ചിരുന്ന
  rationale: προ- സൂചിപ്പിക്കുന്ന കാലപരമായ മുൻതൂക്കവും perfect participle-ന്റെ തുടരുന്ന പ്രസക്തിയും പ്രകടമാക്കുന്നു; ‘ആദ്യം പ്രത്യാശവെച്ചവർ’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക അർഥം മുഖ്യപാഠത്തിൽ നിർബന്ധിക്കുന്നില്ല.
- source_word: ἐν τῷ Χριστῷ
  choice: മശീഹയിൽ
  rationale: Χριστός ഇവിടെ അഭിഷിക്തന്റെ പദവിയായാണ് പ്രവർത്തിക്കുന്നത്; ‘മശീഹ’ ആ പദവിയുടെ അർഥം നിലനിർത്തുന്നു. ἐν എന്ന ബന്ധവും ‘-യിൽ’ വഴി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: προηλπικότας എന്നത് മുമ്പേ പ്രത്യാശവെച്ചവരെയാണോ, അതോ ആദ്യം പ്രത്യാശവെച്ച പ്രത്യേക സംഘത്തെയാണോ സൂചിപ്പിക്കുന്നത്?
  choice: നേരത്തേതന്നെ പ്രത്യാശവെച്ചിരുന്ന
  alternative: മശീഹയിൽ ആദ്യം പ്രത്യാശവെച്ചവരായ
  rationale: προ- മുൻകാലത്വം വ്യക്തമാക്കുന്നു; എന്നാൽ ‘ആദ്യ സംഘം’—പലപ്പോഴും യഹൂദവിശ്വാസികൾ എന്നു വ്യാഖ്യാനിക്കപ്പെടുന്നത്—എന്ന തിരിച്ചറിയൽ പദത്തിൽനിന്നു മാത്രം നിർബന്ധിതമല്ല. അതിനാൽ സൂക്ഷ്മമായ വായന മുഖ്യപാഠത്തിലും ശക്തമായ സാധ്യത അടിക്കുറിപ്പിലും നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ ശൈലി. വാക്യം മുൻവാക്യത്തിന്റെ ഉദ്ദേശ്യഘടകമായി തുടരുന്നതിനാൽ ഗ്രീക്ക് മൂലത്തിലെ fragment സ്വഭാവം അനാവശ്യമായി പൂർണ്ണവാക്യമാക്കി മാറ്റിയിട്ടില്ല. ‘മഹത്വത്തിന്റെ പുകഴ്ച’ എന്ന പൗലോസീയ genitive ബന്ധം വ്യാഖ്യാനിച്ച് ലഘൂകരിക്കാതെ സംരക്ഷിച്ചു.
