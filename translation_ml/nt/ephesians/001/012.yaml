- from: മശീഹയിൽ നേരത്തേതന്നെ പ്രത്യാശവെച്ചിരുന്ന[a] നാം അവന്റെ മഹത്വത്തിന്റെ പുകഴ്ചയ്ക്കായി ആയിത്തീരേണ്ടതിന്.[b]
  to: മശീഹയിൽ നേരത്തേതന്നെ പ്രത്യാശവെച്ചിരുന്ന നാം അവന്റെ മഹത്വത്തിന്റെ സ്തുതിക്കായി ആയിരിക്കേണ്ടതിന്.[a][b]
