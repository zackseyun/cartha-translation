id: EPH.1.22
reference: Ephesians 1:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ πάντα ὑπέταξεν ὑπὸ τοὺς πόδας αὐτοῦ, καὶ αὐτὸν ἔδωκεν κεφαλὴν ὑπὲρ πάντα τῇ ἐκκλησίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/022.yaml
  text: And he subjected all things under his feet[a], and gave him as head over all things to the church[b],
translation:
  language: ml
  text: അവൻ എല്ലാം അവന്റെ പാദങ്ങൾക്കു കീഴിലാക്കി[a]; എല്ലാറ്റിനും മീതെ തലയായി അവനെ സഭയ്ക്കു നൽകി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഇവിടെ സങ്കീർത്തനം 8:6-ന്റെ പ്രതിധ്വനിയുണ്ട്: സകലവും ഭരണാധികാരിയുടെ പാദങ്ങൾക്കു കീഴിൽ വെക്കപ്പെടുന്ന തിരുവെഴുത്തിലെ ദൃശ്യരൂപം.'
    reason: cross_reference
  - marker: b
    text: അഥവാ, ‘സഭയ്ക്കുവേണ്ടി’; τῇ ἐκκλησίᾳ എന്ന ദാതൃവിഭക്തി സ്വീകരിക്കുന്നവളെ എന്നതുപോലെ പ്രയോജനം ലഭിക്കുന്നവളെയും സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: എല്ലാം / എല്ലാറ്റിനും
  rationale: നപുംസകലിംഗ ബഹുവചനം സകല വസ്തുക്കളുടെയും സമഗ്രതയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സന്ദർഭാനുസൃതമായ വിഭക്തികളോടെ ഈ സമഗ്രവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: ὑπέταξεν
  choice: കീഴിലാക്കി
  rationale: ὑποτάσσω മറ്റൊന്നിന്റെ അധീനതയിൽ ആക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘കാൽക്കീഴിലാക്കി’ എന്ന പ്രയോഗം അധീനതയുടെ ശക്തിയും സങ്കീർത്തനപ്രതിധ്വനിയും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ὑπὸ τοὺς πόδας αὐτοῦ
  choice: അവന്റെ കാൽക്കീഴിൽ
  rationale: ആധിപത്യത്തിന്റെയും കീഴടക്കത്തിന്റെയും ദൃശ്യരൂപകമാണിത്; സങ്കീർത്തനം 8:6-ലെ പ്രതിധ്വനി സംരക്ഷിക്കാൻ അക്ഷരാർഥ രൂപം നിലനിർത്തുന്നു.
- source_word: αὐτὸν ἔδωκεν
  choice: അവനെ ... നൽകി
  rationale: δίδωμι എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘നൽകുക’ നിലനിർത്തുന്നു; ‘നിയമിച്ചു’ എന്നു വ്യാഖ്യാനിച്ച് അർഥം ചുരുക്കുന്നില്ല.
- source_word: κεφαλὴν
  choice: തലയായിരിക്കുന്ന
  rationale: ‘തല’ എന്ന രൂപകം അധികാരവും പ്രാമുഖ്യവും സൂചിപ്പിക്കുമ്പോഴും അതിന്റെ മുഴുവൻ അർഥം മുൻകൂട്ടി നിർവചിക്കാതെ നിലനിർത്തുന്നു. മലയാള വാക്യഘടനയ്ക്ക് ‘തലയായിരിക്കുന്ന’ സ്വാഭാവികമാണ്.
- source_word: ὑπὲρ πάντα
  choice: എല്ലാറ്റിനും മീതെ
  rationale: ὑπέρ ഇവിടെ സകലത്തിന്മേലുള്ള പരമാധികാരത്തെയോ ഉന്നതസ്ഥാനത്തെയോ സൂചിപ്പിക്കുന്നു; ‘മീതെ’ ഈ രണ്ടു ഭാവങ്ങളും തുറന്നുവയ്ക്കുന്നു.
- source_word: τῇ ἐκκλησίᾳ
  choice: സഭയ്ക്കു
  rationale: ἐκκλησίαയ്ക്ക് പൗലോസിന്റെ സന്ദർഭത്തിൽ പതിവും സ്വാഭാവികവുമായ മലയാളം ‘സഭ’യാണ്. ദാതൃവിഭക്തിയായ ‘സഭയ്ക്കു’ സ്വീകരിക്കുന്നവൾ എന്ന അർഥത്തോടൊപ്പം സഭയുടെ പ്രയോജനത്തിനായി എന്ന സാധ്യതയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ക്രിസ്തുവിന്റെ ശിരസ്സായ സ്ഥാനത്തിന് സകലത്തോടും സഭയോടുമുള്ള ബന്ധം
  choice: എല്ലാറ്റിനും മീതെ തലയായിരിക്കുന്ന ക്രിസ്തുവിനെ ദൈവം സഭയ്ക്കു നൽകി.
  alternative: സഭയുടെ പ്രയോജനത്തിനായി ദൈവം ക്രിസ്തുവിനെ എല്ലാറ്റിനും മീതെ തലയാക്കി.
  rationale: വാക്യഘടന κεφαλὴν ὑπὲρ πάντα എന്നതിനെ ഒരുമിച്ച് വായിക്കാൻ അനുകൂലമാണ്; τῇ ἐκκλησίᾳ സ്വീകരിക്കുന്നവളെയോ പ്രയോജനം ലഭിക്കുന്നവളെയോ സൂചിപ്പിക്കാം. മുഖ്യപാഠവും അടിക്കുറിപ്പും ഈ വ്യാകരണ-ദൈവശാസ്ത്ര പിരിമുറുക്കം പരിഹരിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കാൽക്കീഴിൽ’, ‘തല’, ‘സഭ’ എന്നീ പരിചിതമായ ബൈബിൾ രൂപകങ്ങളും പദങ്ങളും നിലനിർത്തിയിരിക്കുന്നു. നൽകിയ ഇംഗ്ലീഷ് consultation layer-ൽ footnote marker-കളുടെ സ്ഥാനവും ഉള്ളടക്കവും തമ്മിൽ പൊരുത്തക്കേട് കാണുന്നതിനാൽ, മൂലഗ്രീക്കുമായി പൊരുത്തപ്പെടുന്നവിധം cross-reference [a]-യോടും dative alternative [b]-യോടും ചേർത്തിരിക്കുന്നു.
