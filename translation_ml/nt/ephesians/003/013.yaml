id: EPH.3.13
reference: Ephesians 3:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διὸ αἰτοῦμαι μὴ ⸀ἐγκακεῖν ἐν ταῖς θλίψεσίν μου ὑπὲρ ὑμῶν, ἥτις ἐστὶν δόξα ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/013.yaml
  text: Therefore I ask you not to lose heart because of my afflictions for your sake[b][a], which are your glory.
translation:
  language: ml
  text: അതുകൊണ്ട്, നിങ്ങൾക്കുവേണ്ടിയുള്ള എന്റെ കഷ്ടതകൾ നിമിത്തം നിങ്ങൾ ധൈര്യം കൈവിടരുതെന്ന് ഞാൻ അപേക്ഷിക്കുന്നു[a]; അവ നിങ്ങളുടെ മഹത്വമാണ്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘നിങ്ങൾക്കുവേണ്ടിയുള്ള എന്റെ കഷ്ടതകൾ കണ്ടു നിങ്ങൾ നിരുത്സാഹപ്പെടരുതെന്ന് ഞാൻ അപേക്ഷിക്കുന്നു.’'
    reason: ἐν എന്ന പദബന്ധം കാരണമെന്നോ കഷ്ടതകളെ അഭിമുഖീകരിക്കുന്ന സാഹചര്യമെന്നോ ഗ്രഹിക്കാം; ἐγκακεῖν എന്നതിന് ‘നിരുത്സാഹപ്പെടുക’ എന്നും പറയാം.
  - marker: b
    text: ‘അവ’ എന്നത് പൗലോസിന്റെ കഷ്ടതകളെയോ, കൂടുതൽ വിശാലമായി അവർക്കുവേണ്ടിയുള്ള അദ്ദേഹത്തിന്റെ ശുശ്രൂഷയും കഷ്ടാനുഭവവും ഉൾപ്പെട്ട മുഴുവൻ സാഹചര്യത്തെയോ സൂചിപ്പിക്കാം.
    reason: ἥτις എന്ന ബന്ധസർവനാമത്തിന്റെ സൂചിതവിഷയത്തിൽ യഥാർഥ വ്യാഖ്യാനവ്യാപ്തിയുണ്ട്.
lexical_decisions:
- source_word: διὸ
  choice: അതുകൊണ്ട്
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനബന്ധം ചുരുക്കമായും സ്വാഭാവികമായും സൂചിപ്പിക്കുന്നു.
- source_word: αἰτοῦμαι
  choice: ഞാൻ അപേക്ഷിക്കുന്നു
  rationale: പൗലോസിന്റെ അഭ്യർഥനയുടെ ഗൗരവവും വിനയവും ആധുനിക മാനക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; സന്ദർഭത്തിൽനിന്ന് ഗ്രാഹകരായ ‘നിങ്ങൾ’ ചേർത്തിരിക്കുന്നു.
- source_word: μὴ ἐγκακεῖν
  choice: നിങ്ങൾ ധൈര്യം കൈവിടരുതെന്ന്
  rationale: നിരുത്സാഹപ്പെടുക, മനസ്സുതളരുക എന്ന ആശയം സ്വാഭാവികമായ മലയാള പ്രയോഗത്തിൽ നൽകുന്നു.
- source_word: ἐν ταῖς θλίψεσίν μου
  choice: എന്റെ കഷ്ടതകൾ നിമിത്തം
  rationale: ἐν എന്നതിന്റെ ഇവിടെ സാധ്യതയുള്ള കാരണ/സന്ദർഭബന്ധം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: θλίψεσίν
  choice: കഷ്ടതകൾ
  rationale: സമ്മർദം, പീഡനം, ദുഃഖാനുഭവം എന്നിവ ഉൾക്കൊള്ളുന്ന θλῖψις എന്ന പദത്തിന്റെ ഗൗരവം സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന വിധം നിലനിർത്തുന്നു.
- source_word: ὑπὲρ ὑμῶν
  choice: നിങ്ങൾക്കുവേണ്ടിയുള്ള
  rationale: അവരുടെ നന്മയ്ക്കായും അവർക്കുവേണ്ടിയും അനുഭവിക്കുന്ന കഷ്ടതകൾ എന്ന ഗുണകര/പ്രതിനിധാനപരമായ അർഥം നൽകുന്നു.
- source_word: ἥτις
  choice: അവ
  rationale: സമീപസ്ഥമായ ‘കഷ്ടതകൾ’ എന്ന ബഹുവചന മലയാള നാമത്തെ സൂചിപ്പിക്കുമ്പോഴും, ഗ്രീക്കിൽ ആ കഷ്ടതകളെ ഒരു ആശയസമുച്ചയമായി കാണുന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δόξα ὑμῶν
  choice: നിങ്ങളുടെ മഹത്വം
  rationale: δόξαയുടെ ദൈവശാസ്ത്രപരവും വാഗ്മയപരവുമായ ഭാരം ‘മഹത്വം’ സൂക്ഷിക്കുന്നു; ‘ബഹുമാനം’ എന്നതിലേക്കു മാത്രം അർഥം ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: ἥτις ἐστὶν δόξα ὑμῶν എന്ന ഏകവചന ബന്ധവാക്യത്തിന്റെ സൂചിതവിഷയം
  choice: പൗലോസിന്റെ കഷ്ടതകളെ ആശയപരമായ ഒരു സമുച്ചയമായി എടുത്ത് അവ എഫെസ്യരുടെ മഹത്വമാണെന്ന് വിവർത്തനം ചെയ്യുന്നു.
  alternative: അവർക്കുവേണ്ടിയുള്ള പൗലോസിന്റെ ശുശ്രൂഷയും കഷ്ടാനുഭവവും കൂടുതൽ വിശാലമായി അവരുടെ മഹത്വമാണെന്ന് മനസ്സിലാക്കാം.
  rationale: ഏറ്റവും അടുത്ത മുൻപദം ‘എന്റെ കഷ്ടതകൾ’ എന്നതാണ്. എന്നാൽ ബന്ധസർവനാമത്തിന്റെ ഗുണാത്മക സ്വഭാവവും ഏകവചനവും മുഴുവൻ സാഹചര്യത്തെ സൂചിപ്പിക്കാനുള്ള സാധ്യത തുറന്നുവയ്ക്കുന്നു; മുഖ്യവാചകം അതിനെ ഒരു പ്രത്യേക ഉപദേശമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ dignified, പൊതുവായ സഭാവായനയ്ക്ക് അനുയോജ്യമായ ശൈലി. ‘ധൈര്യം കൈവിടുക’, ‘കഷ്ടതകൾ’, ‘മഹത്വം’ എന്നിവ സാധാരണ വായനക്കാർക്കു ഗ്രാഹ്യമായിരിക്കെ മൂലപാഠത്തിന്റെ വാഗ്മയഭാരം നിലനിർത്തുന്നു.
