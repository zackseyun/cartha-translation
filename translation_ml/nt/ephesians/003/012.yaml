revisions:
- from: അവനിൽ നമുക്ക് ധൈര്യവും, അവനിലുള്ള വിശ്വാസത്തിലൂടെ ആത്മവിശ്വാസത്തോടെ ദൈവസന്നിധിയിലേക്കുള്ള പ്രവേശനവും ഉണ്ട്[a].
  to: അവനിൽ, അവനിലുള്ള വിശ്വാസത്തിലൂടെ, നമുക്ക് ധൈര്യവും ആത്മവിശ്വാസത്തോടെയുള്ള പ്രവേശനവും ഉണ്ട്[a].
  rationale: The revision removes the contextually plausible but unstated ‘into God’s presence,’ retains the Greek distinction between boldness and confidence, and preserves the contested objective/subjective-genitive possibilities of πίστεως αὐτοῦ in the footnote. The revised word order is natural Malayalam while clearly linking the faith phrase to the access and boldness described.
