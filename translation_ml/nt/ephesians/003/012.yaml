id: EPH.3.12
reference: Ephesians 3:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν ᾧ ἔχομεν τὴν παρρησίαν ⸀καὶ προσαγωγὴν ἐν πεποιθήσει διὰ τῆς πίστεως αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/012.yaml
  text: in whom we have boldness and access with confidence through faith in him[a].
translation:
  language: ml
  text: അവനിൽ, അവനിലുള്ള വിശ്വാസത്തിലൂടെ, നമുക്ക് ധൈര്യവും ആത്മവിശ്വാസത്തോടെയുള്ള പ്രവേശനവും ഉണ്ട്[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവന്റെ വിശ്വസ്തതയിലൂടെ.” ഗ്രീക്ക് പ്രയോഗത്തിന് ‘അവനിലുള്ള വിശ്വാസത്തിലൂടെ’ എന്നോ ‘അവന്റെ സ്വന്തം വിശ്വസ്തതയിലൂടെ’ എന്നോ അർഥമാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: അവനിൽ
  rationale: പുരുഷലിംഗ ഏകവചനത്തിലുള്ള ബന്ധസർവനാമം മുൻസന്ദർഭത്തിലെ ക്രിസ്തുവിനെയാണ് ഏറ്റവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്; ക്രിസ്തുവുമായുള്ള ഐക്യത്തിന്റെ ആശയവും ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: παρρησίαν
  choice: ധൈര്യം
  rationale: തുറന്ന മനസ്സോടെ ഭയമില്ലാതെ സംസാരിക്കുകയോ സമീപിക്കുകയോ ചെയ്യാനുള്ള ധൈര്യമാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്. തുടർന്ന് വരുന്ന πεποίθησις എന്ന പദത്തിൽനിന്ന് ഇതിനെ വേർതിരിച്ചും നിലനിർത്തുന്നു.
- source_word: προσαγωγὴν
  choice: ദൈവസന്നിധിയിലേക്കുള്ള പ്രവേശനം
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിൽ ഈ പദം ദൈവസന്നിധിയിലേക്കുള്ള പ്രവേശനത്തെയോ സമീപനത്തെയോ സൂചിപ്പിക്കുന്നു. ലക്ഷ്യം സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാകുന്നതിനാൽ സ്വാഭാവികമായ മലയാളത്തിനായി ‘ദൈവസന്നിധിയിലേക്ക്’ എന്നു വ്യക്തമാക്കി.
- source_word: ἐν πεποιθήσει
  choice: ആത്മവിശ്വാസത്തോടെ
  rationale: ഉറപ്പോടെയും ഭയമില്ലാതെയും സമീപിക്കുന്ന രീതിയെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; παρρησίαν എന്നതിനു നൽകിയ ‘ധൈര്യം’ എന്ന പരിഭാഷയുമായി അനാവശ്യമായി ലയിപ്പിക്കുന്നില്ല.
- source_word: διὰ τῆς πίστεως αὐτοῦ
  choice: അവനിലുള്ള വിശ്വാസത്തിലൂടെ
  rationale: αὐτοῦ എന്ന ജനിറ്റീവിനെ ക്രിസ്തുവിലേക്കു തിരിയുന്ന വിശ്വാസമായി ഗ്രഹിക്കുന്ന സാധാരണ വായന മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു. ‘അവന്റെ വിശ്വസ്തതയിലൂടെ’ എന്ന മറ്റൊരു സാധ്യവായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: διὰ τῆς πίστεως αὐτοῦ എന്നതിലെ ജനിറ്റീവിന്റെ വ്യാഖ്യാനം
  choice: അവനിലുള്ള വിശ്വാസത്തിലൂടെ
  alternative: അവന്റെ വിശ്വസ്തതയിലൂടെ
  rationale: ഗ്രീക്ക് പ്രയോഗം ക്രിസ്തുവിലുള്ള വിശ്വാസത്തെയോ ക്രിസ്തുവിന്റെ സ്വന്തം വിശ്വസ്തതയെയോ സൂചിപ്പിക്കാം. വിശ്വാസികൾക്കുള്ള ഇപ്പോഴത്തെ പ്രവേശനമാണ് വാക്യത്തിന്റെ ഊന്നൽ എന്നതിനാൽ മുഖ്യപാഠത്തിൽ ആദ്യ വായന സ്വീകരിച്ചു; യഥാർഥമായ വ്യാഖ്യാനസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ധൈര്യം’ എന്നും ‘ആത്മവിശ്വാസത്തോടെ’ എന്നും നൽകി ഗ്രീക്കിലെ ബന്ധമുള്ള രണ്ടു ആശയങ്ങൾ തമ്മിലുള്ള വ്യത്യാസം നിലനിർത്തി. ‘ദൈവസന്നിധിയിലേക്ക്’ എന്നത് സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്ന പ്രവേശനലക്ഷ്യം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു.
