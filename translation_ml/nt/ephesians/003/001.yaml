id: EPH.3.1
reference: Ephesians 3:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τούτου χάριν ἐγὼ Παῦλος ὁ δέσμιος τοῦ Χριστοῦ Ἰησοῦ ὑπὲρ ὑμῶν τῶν ἐθνῶν—
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/001.yaml
  text: For this reason I[a], Paul[c][b], the prisoner of Messiah Jesus on behalf of you Gentiles—
translation:
  language: ml
  text: ഇക്കാരണത്താൽ ഞാൻ, പൗലോസ്, യഹൂദരല്ലാത്തവരായ നിങ്ങൾക്കുവേണ്ടി മശീഹയായ യേശുവിന്റെ തടവുകാരൻ—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τούτου χάριν
  choice: ഇക്കാരണത്താൽ
  rationale: മുൻപുള്ള ആശയത്തെ അടിസ്ഥാനമാക്കി നിഗമനത്തിലേക്കോ തുടർവിവരണത്തിലേക്കോ നയിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: ἐγὼ Παῦλος
  choice: പൗലോസ് എന്ന ഞാൻ
  rationale: ഗ്രീക്കിലെ വ്യക്തിപ്രാധാന്യം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ സ്വയംപരിചയപ്പെടുത്തൽ നൽകുന്നു.
- source_word: ὁ δέσμιος
  choice: തടവുകാരനായ
  rationale: കസ്റ്റഡിയിൽ കഴിയുന്ന ഒരാളെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥം; ‘ചങ്ങലയിൽ കഴിയുന്നവൻ’ എന്ന വ്യാഖ്യാനാത്മക വിപുലീകരണം ഒഴിവാക്കുന്നു.
- source_word: τοῦ Χριστοῦ Ἰησοῦ
  choice: മശീഹയായ യേശുവിന്റെ
  rationale: Χριστός ഇവിടെ യേശുവിനോടു ചേർന്ന അഭിഷിക്തന്റെ പദവിയായതിനാൽ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി; ജനിറ്റീവ് ബന്ധത്തിലെ ഉടമസ്ഥത/സേവനബന്ധത്തിന്റെ തുറന്ന സ്വഭാവം ‘യുടെ’ നിലനിർത്തുന്നു.
- source_word: ὑπὲρ ὑμῶν
  choice: നിങ്ങൾക്കുവേണ്ടി
  rationale: പൗലോസിന്റെ തടവ് വായനക്കാരുടെ നന്മയ്ക്കോ കാരണത്താലോ ബന്ധപ്പെട്ടിരിക്കുന്നു എന്ന benefactive അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τῶν ἐθνῶν
  choice: യഹൂദരല്ലാത്തവരായ
  rationale: ഇവിടെ രണ്ടാംപുരുഷസംബോധനയോടു ചേർന്ന ἔθνη രാഷ്ട്രീയ ‘രാഷ്ട്രങ്ങളെ’ അല്ല, യഹൂദരല്ലാത്ത ജനങ്ങളെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: Χριστοῦ എന്ന പദം പദവിയായോ പേരിന്റെ ഭാഗമായോ അവതരിപ്പിക്കൽ
  choice: മശീഹയായ യേശു
  alternative: ക്രിസ്തുയേശു
  rationale: Χριστός എന്നത് ‘അഭിഷിക്തൻ/മശീഹ’ എന്ന പദവിയായതിനാൽ മുഖ്യവാചകത്തിൽ അതിന്റെ അർഥം പരിഭാഷപ്പെടുത്തി; സഭാപാരമ്പര്യത്തിൽ പരിചിതമായ രൂപം അടിക്കുറിപ്പിൽ നൽകി.
- issue: ‘മശീഹയായ യേശുവിന്റെ തടവുകാരൻ’ എന്ന ജനിറ്റീവ് ബന്ധം
  choice: ‘യുടെ’ എന്ന തുറന്ന ബന്ധരൂപം നിലനിർത്തി
  alternative: മശീഹയായ യേശുവിനുവേണ്ടി തടവിലായവൻ
  rationale: ഗ്രീക്ക് ജനിറ്റീവ് പൗലോസ് മശീഹയുടേതാണെന്ന സേവന/ഉടമസ്ഥബന്ധത്തെയും മശീഹയുടെ കാരണത്താൽ തടവിലാണെന്ന ആശയത്തെയും ഉൾക്കൊള്ളാൻ ഇടയുണ്ട്; ഒരു വ്യാഖ്യാനം മാത്രം മുഖ്യവാചകത്തിൽ ഉറപ്പിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ഗ്രീക്കിലും വാക്യം അടുത്ത വാക്യങ്ങളിലേക്കു നീളുന്ന അപൂർണ ഘടനയായതിനാൽ അവസാനത്തിലെ ദീർഘവിരാമചിഹ്നം നിലനിർത്തി.
