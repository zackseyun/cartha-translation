- from: ഇക്കാരണത്താൽ, യഹൂദരല്ലാത്തവരായ നിങ്ങൾക്കുവേണ്ടി മശീഹയായ യേശുവിന്റെ[a] തടവുകാരനായ പൗലോസ് എന്ന ഞാൻ—
  to: ഇക്കാരണത്താൽ ഞാൻ, പൗലോസ്, യഹൂദരല്ലാത്തവരായ നിങ്ങൾക്കുവേണ്ടി മശീഹയായ യേശുവിന്റെ തടവുകാരൻ—
