id: EPH.3.8
reference: Ephesians 3:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐμοὶ τῷ ἐλαχιστοτέρῳ πάντων ἁγίων ἐδόθη ἡ χάρις αὕτη— ⸀τοῖς ἔθνεσιν εὐαγγελίσασθαι ⸂τὸ ἀνεξιχνίαστον πλοῦτος⸃ τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/008.yaml
  text: To me[a], the very least of all the saints, this grace was given—to proclaim to the Gentiles the unsearchable riches of Messiah[c][b],
translation:
  language: ml
  text: സകല വിശുദ്ധരിലും ഏറ്റവും ചെറിയവനായ[a] എനിക്ക് ഈ കൃപ ലഭിച്ചു—യെഹൂദേതരരോട്[b] മശീഹായുടെ[c] അന്വേഷിച്ചറിയാനാകാത്ത സമ്പത്ത് സുവിശേഷമായി അറിയിക്കുന്നതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തോട് കൂടുതൽ അടുത്ത രൂപം: ‘സകല വിശുദ്ധരിലും ഏറ്റവും ചെറിയവനേക്കാളും ചെറിയവനായ.’'
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ ‘ജനതകളോട്.’ ഈ സന്ദർഭത്തിൽ യെഹൂദരല്ലാത്ത ജനങ്ങളെയാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: അല്ലെങ്കിൽ ‘ക്രിസ്തുവിന്റെ.’ ഗ്രീക്കിലെ Χριστός എന്ന സ്ഥാനപ്പേര് ‘മശീഹാ’ എന്നോ ‘ക്രിസ്തു’ എന്നോ നൽകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλαχιστοτέρῳ
  choice: ഏറ്റവും ചെറിയവനായ
  rationale: അസാധാരണമായ താരതമ്യരൂപത്തിലൂടെ പൗലോസ് പ്രകടിപ്പിക്കുന്ന അത്യന്തമായ വിനയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἁγίων
  choice: വിശുദ്ധർ
  rationale: ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ട വിശ്വാസികളെ സൂചിപ്പിക്കുന്ന പൗലോസിന്റെ പതിവുപ്രയോഗത്തോട് അടുത്തുനിൽക്കുന്ന സംക്ഷിപ്തമായ പദം.
- source_word: χάρις
  choice: കൃപ
  rationale: ദൈവത്തിന്റെ സൗജന്യമായ അനുഗ്രഹവും ഏല്പിക്കപ്പെട്ട ദൗത്യവും ഉൾക്കൊള്ളുന്ന പൗലോസിന്റെ പദപ്രയോഗവുമായി തുടർച്ച നിലനിർത്തുന്നു.
- source_word: ἔθνεσιν
  choice: യെഹൂദേതരരോട്
  rationale: ഈ സന്ദർഭത്തിലെ യെഹൂദർ–യെഹൂദേതരർ വ്യത്യാസം വ്യക്തമായി അറിയിക്കുന്നു; രാഷ്ട്രീയ അർഥത്തിലുള്ള രാജ്യങ്ങൾ എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: εὐαγγελίσασθαι
  choice: സുവിശേഷമായി അറിയിക്കേണ്ടതിന്
  rationale: നല്ല വാർത്ത പ്രഖ്യാപിക്കുക എന്ന ക്രിയയുടെ അർഥം വ്യക്തമാക്കുകയും പിന്നാലെയുള്ള സമ്പത്ത് എന്ന കർമവുമായി സ്വാഭാവികമായി ചേരുകയും ചെയ്യുന്നു.
- source_word: ἀνεξιχνίαστον
  choice: അന്വേഷിച്ചറിയാനാകാത്ത
  rationale: പൂർണമായി പിന്തുടർന്ന് കണ്ടെത്താനോ ഗ്രഹിക്കാനോ കഴിയാത്തത് എന്ന രൂപകവും അർഥവും സംരക്ഷിക്കുന്നു.
- source_word: πλοῦτος
  choice: സമ്പത്ത്
  rationale: മശീഹായിൽ ലഭിക്കുന്ന അളവറ്റ ആത്മീയ സമൃദ്ധിയെ സൂചിപ്പിക്കുന്ന ഏകവചന കൂട്ടാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: Χριστοῦ
  choice: മശീഹായുടെ
  rationale: Χριστός ഇവിടെ അഭിഷിക്തനായവന്റെ സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നതിനാൽ അതിന്റെ ശീർഷകാർഥം നിലനിർത്തുന്നു.
theological_decisions:
- issue: Χριστοῦ എന്ന സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: മശീഹായുടെ
  alternative: ക്രിസ്തുവിന്റെ
  rationale: പേരുപോലെയുള്ള ലിപ്യന്തരണത്തേക്കാൾ ‘അഭിഷിക്തൻ’ എന്ന സ്ഥാനപ്പേരിന്റെ അർഥം ഇവിടെ മുൻനിർത്തുന്നു; പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: ἔθνεσιν എന്നതിന്റെ സന്ദർഭാർഥം
  choice: യെഹൂദേതരരോട്
  alternative: ജനതകളോട്
  rationale: എഫെസ്യർ 3-ലെ യെഹൂദർ–യെഹൂദേതരർ സന്ദർഭം വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്നു, എന്നാൽ പദത്തിന്റെ വിപുലമായ അർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ദീർഘമായ ഗ്രീക്ക് വാക്യബന്ധം ഡാഷ് ഉപയോഗിച്ച് നിലനിർത്തി. ‘സുവിശേഷമായി അറിയിക്കുക’ എന്ന പ്രയോഗം സഭാസാങ്കേതികതയിൽ മാത്രം ഒതുങ്ങാതെ സാധാരണ വായനക്കാരനും ഗ്രഹിക്കാവുന്ന വിധത്തിലാണ്.
