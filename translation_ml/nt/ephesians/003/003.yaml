lexical_decisions:
- source_word: κατὰ ἀποκάλυψιν
  choice: വെളിപ്പാടിലൂടെ
  rationale: κατά + accusative ഇവിടെ വെളിപ്പെടുത്തൽ നടന്ന മാർഗമോ രീതിയോ സൂചിപ്പിക്കുന്നു. ‘വെളിപ്പാടിലൂടെ’ എന്നത് സ്വാഭാവികമായ മലയാളത്തിൽ ആ അർഥം നൽകുന്നു.
- source_word: ἐγνωρίσθη μοι
  choice: എനിക്ക് അറിയിക്കപ്പെട്ടു
  rationale: γνωρίζω എന്ന ക്രിയയുടെ aorist passive രൂപം നിലനിർത്തുന്നു; പ്രവർത്തകനെ വാക്യത്തിൽ ചേർക്കാതെ ഗ്രീക്കിലെ ദൈവിക passive-ന്റെ തുറന്ന സ്വഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: τὸ μυστήριον
  choice: ആ രഹസ്യം
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിൽ മുമ്പ് മറഞ്ഞിരുന്നതും ഇപ്പോൾ വെളിപ്പെടുത്തപ്പെട്ടതുമായ ദൈവിക ഉദ്ദേശ്യത്തെ സൂചിപ്പിക്കുന്നു. മുൻസന്ദർഭബന്ധം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ നിർദ്ദേശകമായ ‘ആ’ ഉപയോഗിക്കുന്നു; ഉള്ളടക്കം ഇവിടെ വിശദീകരിക്കുന്നില്ല.
- source_word: καθὼς
  choice: അതിനെക്കുറിച്ച് … ഉണ്ടല്ലോ
  rationale: മുമ്പെഴുതിയ കാര്യവുമായി താരതമ്യവും ഓർമ്മപ്പെടുത്തലും ബന്ധിപ്പിക്കുന്നു. മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിനായി ബന്ധം പ്രസക്തമായ അനുബന്ധരൂപത്തിൽ നൽകുന്നു.
- source_word: προέγραψα
  choice: ഞാൻ മുമ്പ് … എഴുതിയിട്ടുണ്ട്
  rationale: ഈ ലേഖനത്തിൽ ഇതിനുമുമ്പ് എഴുതിയതിനെ സൂചിപ്പിക്കുന്ന കാലിക അർഥം നൽകുന്നു; പരസ്യമായി പ്രദർശിപ്പിച്ചു തുടങ്ങിയ മറ്റു സാദ്ധ്യതകൾ സന്ദർഭത്തിന് യോജിക്കുന്നില്ല.
- source_word: ἐν ὀλίγῳ
  choice: ചുരുക്കമായി
  rationale: കുറച്ച് വാക്കുകളിൽ അഥവാ സംക്ഷിപ്തമായി എന്ന idiomatic അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ μυστήριον എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: ‘രഹസ്യം’ എന്ന പദം നിലനിർത്തി, അതിന്റെ ഉള്ളടക്കം ഈ വാക്യത്തിൽ വിശദീകരിക്കാതിരിക്കുക
  alternative: ‘ദൈവത്തിന്റെ മറഞ്ഞിരുന്ന പദ്ധതി’ എന്ന് വ്യാഖ്യാനിച്ച് പരിഭാഷപ്പെടുത്തുക
  rationale: ഈ വാക്യം ആശയത്തെ പേരിട്ടു പറയുന്നതേയുള്ളൂ; തുടർന്നുള്ള സന്ദർഭമാണ് അതിന്റെ ഉള്ളടക്കം വിശദീകരിക്കുന്നത്. ഇവിടെ വിശദീകരണം ചേർത്താൽ ഉറവിടവാക്യത്തെ അതിക്രമിക്കും.
- issue: ἐγνωρίσθη എന്ന passive-ന്റെ പ്രവർത്തകൻ
  choice: പ്രവർത്തകനെ വ്യക്തമാക്കാതെ ‘അറിയിക്കപ്പെട്ടു’ എന്ന് പരിഭാഷപ്പെടുത്തുക
  alternative: ‘ദൈവം എനിക്ക് അറിയിച്ചു’ എന്ന് പ്രവർത്തകനെ വ്യക്തമാക്കുക
  rationale: സന്ദർഭത്തിൽ ദൈവമാണ് സൂചിത പ്രവർത്തകൻ എന്നത് ശക്തമായിരിക്കുമ്പോഴും, ഗ്രീക്ക് വാക്യം പ്രവർത്തകനെ നേരിട്ട് പറയുന്നില്ല. അതിനാൽ യഥാർഥമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗ്രീക്കിലെ passive രൂപവും μυστήριον എന്ന ദൈവശാസ്ത്രപരമായ പദത്തിന്റെ വ്യാഖ്യാനതുറവും നിലനിർത്തിയിട്ടുണ്ട്. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
