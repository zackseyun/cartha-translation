id: EPH.3.21
reference: Ephesians 3:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: αὐτῷ ἡ δόξα ἐν τῇ ἐκκλησίᾳ ⸀καὶ ἐν Χριστῷ Ἰησοῦ εἰς πάσας τὰς γενεὰς τοῦ αἰῶνος τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/021.yaml
  text: To him be glory in the church and in Messiah Jesus through all generations forever and ever[a]. Amen.
translation:
  language: ml
  text: അവനു സഭയിലും മശീഹാ യേശുവിലും[a] എല്ലാ തലമുറകളിലും എന്നെന്നേക്കും മഹത്വം ഉണ്ടാകട്ടെ. ആമേൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ക്രിസ്തുവായ യേശുവിൽ.” Χριστός എന്ന ഗ്രീക്ക് സ്ഥാനപ്പേരിനെ ഇവിടെ “മശീഹാ” എന്നു നൽകിയിരിക്കുന്നു.
    reason: alternative_rendering
lexical_decisions:
- source_word: αὐτῷ ἡ δόξα
  choice: അവനു … മഹത്ത്വം ഉണ്ടാകട്ടെ
  rationale: ക്രിയയില്ലാത്ത ഗ്രീക്ക് സ്തുതിവാക്യത്തിന്റെ മഹത്ത്വാർപ്പണഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ‘അവനു’ എന്ന ദത്തിവും δόξα എന്നതിന്റെ അർഥവും നിലനിർത്തുന്നു.
- source_word: ἐν τῇ ἐκκλησίᾳ
  choice: സഭയിൽ
  rationale: ഇവിടെ ἐκκλησία ദൈവജനത്തിന്റെ സമൂഹത്തെ സൂചിപ്പിക്കുന്നു; സ്ഥാപിതവും സ്വാഭാവികവുമായ മലയാള പദം ‘സഭ’യാണ്. ἐν എന്നതിന് ‘യിൽ’ നൽകി സമാന്തരഘടന സംരക്ഷിക്കുന്നു.
- source_word: καὶ ἐν Χριστῷ Ἰησοῦ
  choice: മശീഹായായ യേശുവിലും
  rationale: Χριστός ഇവിടെ യേശുവിന്റെ സ്ഥാനപ്പേരായതിനാൽ ‘മശീഹാ’ എന്ന അർഥസമ്പന്നമായ പദം ഉപയോഗിക്കുന്നു. ἐν എന്നത് ‘യിൽ’ ആയി നിലനിർത്തി ‘സഭയിലും … യേശുവിലും’ എന്ന സമാന്തരത സംരക്ഷിക്കുന്നു.
- source_word: εἰς πάσας τὰς γενεὰς
  choice: എല്ലാ തലമുറകളിലും
  rationale: കാലത്തിലൂടെയുള്ള വ്യാപ്തി സൂചിപ്പിക്കുന്ന εἰς എന്നതിന്റെ ആശയം സ്വാഭാവികമായ മലയാള കാലപ്രയോഗത്തിലൂടെ നൽകുന്നു.
- source_word: τοῦ αἰῶνος τῶν αἰώνων
  choice: എന്നെന്നേക്കും
  rationale: അവസാനമില്ലാത്ത കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് അതിശയോക്തിപരമായ പ്രയോഗത്തിന്റെ വ്യക്തവും പ്രചാരത്തിലുള്ളതുമായ മലയാള സമാനരൂപം.
- source_word: ἀμήν
  choice: ആമേൻ
  rationale: ആരാധനാപരമായ സ്ഥിരീകരണത്തിന് മലയാളത്തിൽ സ്ഥാപിതമായ ലിപ്യന്തരണം.
theological_decisions:
- issue: Χριστῷ എന്നത് സ്ഥാനപ്പേരായോ പേരിന്റെ ഭാഗംപോലെയോ പരിഭാഷപ്പെടുത്തൽ
  choice: മശീഹായായ യേശു
  alternative: ക്രിസ്തുവായ യേശു / ക്രിസ്തുയേശു
  rationale: Χριστός എന്ന പദത്തിന്റെ സ്ഥാനപ്പേര് സ്വഭാവം വ്യക്തമാക്കുകയും യേശുവെന്ന വ്യക്തിയെ മാറ്റമില്ലാതെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു. പരമ്പരാഗത ‘ക്രിസ്തു’ രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: മഹത്ത്വം സഭയിലും മശീഹായായ യേശുവിലും എന്ന സമാന്തരബന്ധം
  choice: രണ്ട് ἐν ഘടകങ്ങളും ‘യിൽ’ ഉപയോഗിച്ച് നിലനിർത്തുന്നു
  alternative: സഭയിലൂടെ, മശീഹായായ യേശുവിലൂടെ
  rationale: ഗ്രീക്ക് വാക്യത്തിലെ യഥാർഥ സമാന്തരതയും അതിലെ വ്യാഖ്യാനസാധ്യതയും സംരക്ഷിക്കാൻ കൂടുതൽ വ്യാഖ്യാനാത്മകമായ ‘മുഖാന്തരം’ ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ സ്തുതിവാക്യശൈലി. ഗ്രീക്കിലെ സമാന്തരഘടന നിലനിർത്തിയിട്ടും മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കാവുന്ന വാക്യക്രമം ഉപയോഗിച്ചു.
