id: EPH.3.9
reference: Ephesians 3:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ φωτίσαι ⸀πάντας τίς ἡ οἰκονομία τοῦ μυστηρίου τοῦ ἀποκεκρυμμένου ἀπὸ τῶν αἰώνων ἐν τῷ θεῷ τῷ τὰ πάντα ⸀κτίσαντι,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/009.yaml
  text: and to bring to light for everyone what is the administration of the mystery hidden from the ages in God[a], who created all things[b],
translation:
  language: ml
  text: എല്ലാം സൃഷ്ടിച്ച ദൈവത്തിൽ യുഗങ്ങൾ മുതൽ മറഞ്ഞുകിടന്ന രഹസ്യത്തിന്റെ കാര്യനിർവഹണം എന്താണെന്ന് എല്ലാവർക്കും വ്യക്തമാക്കാനും,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φωτίσαι
  choice: വെളിച്ചത്തുകൊണ്ടുവരാനും
  rationale: അറിവിക്കുകയെന്ന ആശയം സ്വാഭാവികമായി അറിയിക്കുമ്പോഴും ഗ്രീക്കിലെ പ്രകാശരൂപകം നിലനിർത്തുന്നു; മുമ്പത്തെ ഉദ്ദേശ്യപ്രസ്താവന തുടരുന്ന അനന്തക്രിയാരൂപവും സൂക്ഷിക്കുന്നു.
- source_word: πάντας
  choice: എല്ലാവരുടെയും മുമ്പിൽ
  rationale: πάντας എന്നതിന്റെ വ്യക്തികളെ ഉൾക്കൊള്ളുന്ന സർവവ്യാപകത മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുകയും ‘വെളിച്ചത്തുകൊണ്ടുവരുക’ എന്ന പ്രയോഗവുമായി നന്നായി ചേരുകയും ചെയ്യുന്നു.
- source_word: τίς ἡ οἰκονομία
  choice: നിർവഹണം എന്താണെന്ന്
  rationale: οἰκονομία ഇവിടെ ഒരു കാര്യത്തെ പ്രാവർത്തികമായി നടത്തുന്നതോ ക്രമീകരിക്കുന്നതോ എന്ന ആശയം നൽകുന്നു. ‘നിർവഹണം’ അതിന്റെ കാര്യനടത്തിപ്പ് എന്ന ഭാവം നിലനിർത്തുന്നു; ‘പദ്ധതി’ എന്നു മാത്രം പറഞ്ഞ് ആശയം ചുരുക്കുന്നില്ല.
- source_word: μυστήριον
  choice: രഹസ്യം
  rationale: മുമ്പ് മറഞ്ഞിരുന്നതും ഇപ്പോൾ വെളിപ്പെടുത്തപ്പെടുന്നതുമായ ദൈവിക ഉദ്ദേശ്യത്തെ സൂചിപ്പിക്കുന്ന പൗലോസിന്റെ പ്രയോഗത്തിന് ‘രഹസ്യം’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: ἀποκεκρυμμένου
  choice: മറഞ്ഞുകിടന്ന
  rationale: പൂർവകാലത്ത് മറയ്ക്കപ്പെട്ടതിന്റെ ഫലമായി തുടർന്നിരുന്ന അവസ്ഥയെ ഗ്രീക്കിലെ perfect passive participle സൂചിപ്പിക്കുന്നു; ‘മറഞ്ഞുകിടന്ന’ ആ നിലനിൽക്കുന്ന ഭാവം പ്രകടമാക്കുന്നു.
- source_word: ἀπὸ τῶν αἰώνων
  choice: യുഗങ്ങൾമുതൽ
  rationale: ഗ്രീക്കിലെ ‘യുഗങ്ങളിൽനിന്ന്’ എന്ന കാലഭാവം അടുത്തായി നിലനിർത്തുകയും ‘നിത്യതമുതൽ’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ അർഥം മുഖ്യപാഠത്തിൽ അടിച്ചേൽപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐν τῷ θεῷ
  choice: ദൈവത്തിൽ
  rationale: ἐν എന്നതിന്റെ നേരിട്ടുള്ള സ്ഥാനബന്ധം നിലനിർത്തുന്നു; രഹസ്യം ദൈവത്തോടൊപ്പം മാത്രമല്ല, ദൈവത്തിൽ മറഞ്ഞിരുന്നു എന്ന പൗലോസിന്റെ ഭാഷ സംരക്ഷിക്കുന്നു.
- source_word: τῷ τὰ πάντα κτίσαντι
  choice: എല്ലാം സൃഷ്ടിച്ച ദൈവത്തിൽ
  rationale: കർത്താവിനെ വിശേഷിപ്പിക്കുന്ന ഗ്രീക്ക് participial phrase മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണഘടനയായി നൽകുന്നു; τὰ πάντα എന്നത് ‘എല്ലാം’ എന്നു സമഗ്രമായി പരിഭാഷപ്പെടുത്തുന്നു.
theological_decisions:
- issue: രഹസ്യത്തോടുള്ള οἰκονομίαയുടെ ബന്ധവും അർഥവും
  choice: രഹസ്യത്തിന്റെ നിർവഹണം
  alternative: രഹസ്യത്തിന്റെ കാര്യനടത്തിപ്പ് / രഹസ്യത്തെക്കുറിച്ചുള്ള പദ്ധതി
  rationale: ദൈവിക രഹസ്യത്തിന്റെ ഉള്ളടക്കം മാത്രം അല്ല, അതിന്റെ നടപ്പാക്കലോ ക്രമീകരണമോ ഇവിടെ മുൻനിൽക്കാം. ‘നിർവഹണം’ ആ ഭരണപരമായ ഭാവം സൂക്ഷിക്കുമ്പോൾ പിൽക്കാലത്തെ ഏതെങ്കിലും പ്രത്യേക ദൈവശാസ്ത്രസംവിധാനം ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: ἀπὸ τῶν αἰώνων എന്നതിന്റെ കാലസൂചന
  choice: യുഗങ്ങൾമുതൽ
  alternative: യുഗങ്ങളായി / നിത്യതമുതൽ
  rationale: ഗ്രീക്ക് നേരിട്ട് ‘യുഗങ്ങളെ’ പരാമർശിക്കുന്നു; ‘നിത്യത’ എന്നു മുഖ്യപാഠത്തിൽ പറയുന്നത് ഉറവിടത്തേക്കാൾ കൂടുതൽ നിർണയാത്മകമാകും. അതിനാൽ യഥാർഥ കാലസംബന്ധമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. വാക്യം മുൻവാക്യത്തിലെ ഉദ്ദേശ്യപ്രസ്താവന തുടരുന്നതിനാൽ അവസാനത്തിൽ ‘-ആനും’ രൂപവും കോമയും നിലനിർത്തിയിരിക്കുന്നു. പ്രകാശരൂപകം ‘വെളിച്ചത്തുകൊണ്ടുവരുക’ എന്ന സാധാരണ പ്രയോഗത്തിലൂടെ സംരക്ഷിച്ചു.
