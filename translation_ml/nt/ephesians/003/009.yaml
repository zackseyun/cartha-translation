revisions:
- from: എല്ലാം സൃഷ്ടിച്ച ദൈവത്തിൽ യുഗങ്ങൾമുതൽ[b] മറഞ്ഞുകിടന്ന രഹസ്യത്തിന്റെ നിർവഹണം[a] എന്താണെന്ന് എല്ലാവരുടെയും മുമ്പിൽ വെളിച്ചത്തുകൊണ്ടുവരാനും,
  to: എല്ലാം സൃഷ്ടിച്ച ദൈവത്തിൽ യുഗങ്ങൾ മുതൽ മറഞ്ഞുകിടന്ന രഹസ്യത്തിന്റെ കാര്യനിർവഹണം എന്താണെന്ന് എല്ലാവർക്കും വ്യക്തമാക്കാനും,
  rationale: 'The revision changes the universal recipient from “before everyone” to “to everyone,” preserving the force of φωτίσαι πάντας. It retains the source’s illumination/disclosure sense through «വ്യക്തമാക്കാനും», keeps the mystery hidden “in God” and “from the ages,” and improves both spacing and the administrative nuance of οἰκονομία. Footnote anchors remain attached to the relevant terms: [a] to the administration term and [b] to the temporal phrase.'
