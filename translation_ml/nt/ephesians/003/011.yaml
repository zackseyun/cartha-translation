source:
  edition: SBLGNT
  text: κατὰ πρόθεσιν τῶν αἰώνων ἣν ἐποίησεν ἐν ⸀τῷ Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/011.yaml
  text: according to the eternal purpose that he accomplished in Messiah Jesus our Lord[c][b][a],
translation:
  language: ml
  text: യുഗങ്ങളുടെ ഉദ്ദേശ്യപ്രകാരം[a]—ആ ഉദ്ദേശ്യം അവൻ നമ്മുടെ കർത്താവായ മശീഹാ[b] യേശുവിൽ[c] നടപ്പിലാക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിത്യമായ ഉദ്ദേശ്യപ്രകാരം.” ഗ്രീക്ക് പദപ്രയോഗം കൂടുതൽ അക്ഷരാർഥത്തിൽ “യുഗങ്ങളുടെ ഉദ്ദേശ്യം” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: 'ഗ്രീക്ക്: “ക്രിസ്തു.” ഇവിടെ പദം ഒരു സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നതിനാൽ “മശീഹാ” എന്നു പരിഭാഷപ്പെടുത്തി.'
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “മശീഹാ യേശുവിലൂടെ.” ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “മശീഹാ യേശുവിൽ” എന്നാണെങ്കിലും, സന്ദർഭത്തിൽ അതിന് ഉപകരണാർഥവും ഉണ്ടായേക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: κατὰ πρόθεσιν
  choice: ഉദ്ദേശ്യപ്രകാരം
  rationale: κατά ഇവിടെ പൊരുത്തമോ അനുസൃതതയോ സൂചിപ്പിക്കുന്നു; πρόθεσις ദൈവത്തിന്റെ ബോധപൂർവമായ ഉദ്ദേശ്യത്തെ കുറിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ സംയുക്തപ്രയോഗമാണിത്.
- source_word: τῶν αἰώνων
  choice: യുഗങ്ങളുടെ
  rationale: ഗ്രീക്കിലെ ബഹുവചന ഷഷ്ഠിവിഭക്തിയായ ‘യുഗങ്ങളുടെ’ എന്ന രൂപം നിലനിർത്തുന്നു; അതിനെ വ്യാഖ്യാനാത്മകമായി ‘നിത്യമായ’ എന്നു മാത്രം ചുരുക്കുന്നില്ല.
- source_word: ἣν
  choice: ആ ഉദ്ദേശ്യം
  rationale: ബന്ധസർവനാമം πρόθεσις എന്ന മുൻപദത്തെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ആശയക്കുഴപ്പമില്ലാതെ ബന്ധം വ്യക്തമാക്കാൻ നാമം ആവർത്തിച്ചു.
- source_word: ἐποίησεν
  choice: നടപ്പിലാക്കി
  rationale: ποιέω എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘ചെയ്തു’ എന്നാണെങ്കിലും, ‘ഉദ്ദേശ്യം’ എന്ന കർമത്തോടൊപ്പം ഇവിടെ ഉദ്ദേശ്യം പ്രാവർത്തികമാക്കിയെന്ന അർഥമാണ് സ്വാഭാവികം. ‘നിറവേറ്റി’ എന്നതിനെക്കാൾ പൂർത്തീകരണത്തിന്റെ അധികഭാരം കുറവാണ്.
- source_word: ἐν
  choice: യിൽ
  rationale: ἐν എന്നതിന്റെ നേരിട്ടുള്ള സ്ഥാന/ബന്ധസൂചന നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ ഉപകരണാർഥമായ ‘മുഖാന്തരം’ സാധ്യമാണെന്നത് അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
- source_word: Χριστῷ
  choice: മശീഹാ
  rationale: Χριστός ഇവിടെ ഒരു സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നതിനാൽ അതിന്റെ അഭിഷിക്തൻ എന്ന യഹൂദ പശ്ചാത്തലം നിലനിർത്തുന്ന ‘മശീഹാ’ ഉപയോഗിച്ചു.
- source_word: Ἰησοῦ
  choice: യേശു
  rationale: മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ശരിയായ പേരുരൂപം.
- source_word: κυρίῳ ἡμῶν
  choice: നമ്മുടെ കർത്താവായ
  rationale: κύριος എന്ന സ്ഥാനപ്പേരിന്റെ ദൈവശാസ്ത്രപരമായ ഗൗരവം ‘കർത്താവ്’ നിലനിർത്തുന്നു; ἡμῶν എന്ന ഉടമസ്ഥബന്ധം ‘നമ്മുടെ’ എന്നു നേരിട്ട് പകർന്നു.
theological_decisions:
- issue: πρόθεσιν τῶν αἰώνων എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: യുഗങ്ങളുടെ ഉദ്ദേശ്യം
  alternative: നിത്യമായ ഉദ്ദേശ്യം
  rationale: ഈ പ്രയോഗം ദൈവത്തിന്റെ നിത്യമായ ഉദ്ദേശ്യത്തെ സൂചിപ്പിക്കാം; എങ്കിലും ഗ്രീക്ക് പദപ്രയോഗം അക്ഷരാർഥത്തിൽ ‘യുഗങ്ങളുടെ ഉദ്ദേശ്യം’ എന്നാണ്. മുഖ്യപാഠത്തിൽ ആ രൂപം നിലനിർത്തി, സാധാരണ വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകി.
- issue: ἐν τῷ Χριστῷ Ἰησοῦ എന്നതിലെ ἐν-ന്റെ പ്രയോഗശക്തി
  choice: മശീഹാ യേശുവിൽ
  alternative: മശീഹാ യേശുവിലൂടെ
  rationale: ἐν-ന്റെ നേരിട്ടുള്ള രൂപം ബന്ധമോ മേഖലയോ സൂചിപ്പിക്കാം; ഉപകരണാർഥവും സന്ദർഭത്തിൽ സാധ്യമാണ്. മുഖ്യപാഠം ഈ വ്യാഖ്യാനഭേദം തീർപ്പാക്കാതെ നിലനിർത്തുന്നു.
- issue: Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ പദം വെറും പേരിന്റെ ഭാഗമായി മാത്രം അല്ല, സ്ഥാനപ്പേരായും പ്രവർത്തിക്കുന്നു. അതിനാൽ അതിന്റെ അർഥവും യഹൂദ പശ്ചാത്തലവും പ്രകടമാക്കുന്ന ‘മശീഹാ’ തിരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. മൂലത്തിലെ ബന്ധവാക്യം വ്യക്തമാക്കാൻ ‘ആ ഉദ്ദേശ്യം’ എന്നു ആവർത്തിച്ചു. വാക്യം മുൻസന്ദർഭത്തോട് വ്യാകരണപരമായി ബന്ധപ്പെടുന്നതിനാൽ തുടക്കത്തിലെ κατὰ-പ്രയോഗം ‘ഉദ്ദേശ്യപ്രകാരം’ എന്ന ആശ്രിതരൂപത്തിൽ തന്നെയാണ് നിലനിർത്തിയത്.
