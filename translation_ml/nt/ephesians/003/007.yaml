id: EPH.3.7
reference: Ephesians 3:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὗ ⸀ἐγενήθην διάκονος κατὰ τὴν δωρεὰν τῆς χάριτος τοῦ θεοῦ ⸂τῆς δοθείσης⸃ μοι κατὰ τὴν ἐνέργειαν τῆς δυνάμεως αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/007.yaml
  text: of which I became a servant according to the gift of God's grace given to me according to the working of his power—[a]
translation:
  language: ml
  text: ഞാൻ ആ സുവിശേഷത്തിന്റെ സേവകനായിത്തീർന്നു—എനിക്കു നൽകപ്പെട്ട ദൈവകൃപയുടെ ദാനപ്രകാരം, അവിടുത്തെ ശക്തിയുടെ പ്രവർത്തനപ്രകാരം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഞാൻ ആ സുവിശേഷത്തിന്റെ ശുശ്രൂഷകനാക്കപ്പെട്ടു.”
    reason: ἐγενήθην എന്ന ക്രിയയുടെ സാധ്യമായ കർമണിഭാവവും διάκονος എന്നതിന് ‘ശുശ്രൂഷകൻ’ എന്ന സാധ്യമായ പദവും സൂചിപ്പിക്കുന്നു.
lexical_decisions:
- source_word: οὗ
  choice: ആ സുവിശേഷത്തിന്റെ
  rationale: ബന്ധസർവനാമം മുൻവാക്യത്തിലെ നപുംസകലിംഗപദമായ εὐαγγέλιον (‘സുവിശേഷം’) എന്നതിലേക്കാണ് വിരൽചൂണ്ടുന്നത്. മലയാളത്തിൽ ബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കാൻ നാമം ആവർത്തിച്ചു.
- source_word: ἐγενήθην
  choice: ആയിത്തീർന്നു
  rationale: γίνομαι എന്ന ക്രിയയുടെ ‘ആയിത്തീർന്നു/ആയി’ എന്ന സാധാരണ അർഥം നൽകുന്നു; അതേസമയം ചുറ്റുപാടിലുള്ള കൃപാദാനവും ദൈവശക്തിയും ഈ നിയോഗത്തിന്റെ ദൈവിക ഉറവിടം വ്യക്തമാക്കുന്നു.
- source_word: διάκονος
  choice: സേവകൻ
  rationale: ഇവിടെ സുവിശേഷവുമായി ബന്ധപ്പെട്ട സേവനമാണ് ഉദ്ദേശിക്കുന്നത്. ‘ഡീക്കൻ’ എന്ന പിൽക്കാല സഭാപദവിയുടെ അർഥം അനാവശ്യമായി വരാതിരിക്കാനും സാധാരണ വായനക്കാർക്ക് വ്യക്തമാകാനും ‘സേവകൻ’ സ്വീകരിച്ചു.
- source_word: κατὰ τὴν δωρεὰν
  choice: ദാനപ്രകാരം
  rationale: κατά എന്നതിലെ മാനദണ്ഡം/അടിസ്ഥാനം എന്ന ഭാവവും δωρεάയിലെ സൗജന്യദാനം എന്ന ആശയവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: τῆς χάριτος τοῦ θεοῦ
  choice: അവിടത്തെ കൃപയുടെ
  rationale: ‘ദൈവത്തിന്റെ’ എന്ന മുൻപ്രയോഗത്തെ അനാവശ്യമായി ആവർത്തിക്കാതെ, ദാനം ദൈവകൃപയുടേതാണെന്ന ജനിറ്റീവ് ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: τῆς δοθείσης μοι
  choice: എനിക്കു നൽകപ്പെട്ട
  rationale: ദൈവിക ദാനത്തിന്റെ സ്വീകരണഭാവം നിലനിർത്തുന്നു. ഗ്രീക്കിൽ ഈ കൃതി ‘കൃപ’യെ വിശേഷിപ്പിക്കുന്നതിനാൽ മലയാളത്തിലും അതിനോടു ചേർത്തു.
- source_word: κατὰ τὴν ἐνέργειαν
  choice: പ്രവർത്തനത്തിനൊത്തവിധം
  rationale: ἐνέργεια സൂചിപ്പിക്കുന്ന ഫലപ്രദമായ പ്രവർത്തനവും κατά സൂചിപ്പിക്കുന്ന അനുരൂപതയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: τῆς δυνάμεως αὐτοῦ
  choice: ദൈവത്തിന്റെ ശക്തിയുടെ
  rationale: δύναμις എന്നതിന് സാധാരണയും പൗലൊസിന്റെ പ്രയോഗത്തിന് യോജിച്ചതുമായ ‘ശക്തി’ ഉപയോഗിച്ചു; αὐτοῦയുടെ സൂചന ആശയക്കുഴപ്പമില്ലാതെ വ്യക്തമാക്കാൻ ‘ദൈവത്തിന്റെ’ എന്നു പറഞ്ഞു.
theological_decisions:
- issue: διάκονος സൂചിപ്പിക്കുന്ന പൗലൊസിന്റെ പങ്ക്
  choice: സേവകൻ
  alternative: ശുശ്രൂഷകൻ; ഡീക്കൻ
  rationale: വാക്യം ഔപചാരിക സഭാപദവിയെക്കാൾ സുവിശേഷത്തിനായുള്ള നിയോഗിത സേവനത്തെക്കുറിച്ചാണ്. അതിനാൽ സ്ഥാപനപരമായ അർഥം ഇറക്കുമതി ചെയ്യാത്ത പൊതുവായ പദം തിരഞ്ഞെടുത്തു.
- issue: ἐγενήθην എന്നതിലെ കർത്തൃത്വം
  choice: ഞാൻ ... സേവകനായിത്തീർന്നു
  alternative: ഞാൻ ... ശുശ്രൂഷകനാക്കപ്പെട്ടു
  rationale: ക്രിയയുടെ സ്വാഭാവിക ‘ആയിത്തീർന്നു’ എന്ന അർഥം മുഖ്യപാഠത്തിൽ നിലനിർത്തി. എന്നാൽ കൃപയും ശക്തിയും ദൈവിക കർത്തൃത്വം സൂചിപ്പിക്കുന്നതിനാൽ സാധ്യതയുള്ള കർമണിപ്രയോഗം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ നീണ്ട ജനിറ്റീവ് ഘടന മലയാളത്തിൽ സ്വാഭാവിക ക്രമത്തിലാക്കി; ദൈവകൃപ, ശക്തി, സേവനം എന്നിവ തമ്മിലുള്ള ബന്ധം നിലനിർത്തി.
