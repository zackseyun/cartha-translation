revisions:
- from: ദൈവത്തിന്റെ ശക്തിയുടെ പ്രവർത്തനത്തിനൊത്തവിധം എനിക്കു നൽകപ്പെട്ട അവിടത്തെ കൃപയുടെ ദാനപ്രകാരം, ഞാൻ ആ സുവിശേഷത്തിന്റെ സേവകനായിത്തീർന്നു—[a]
  to: ഞാൻ ആ സുവിശേഷത്തിന്റെ സേവകനായിത്തീർന്നു—എനിക്കു നൽകപ്പെട്ട ദൈവകൃപയുടെ ദാനപ്രകാരം, അവിടുത്തെ ശക്തിയുടെ പ്രവർത്തനപ്രകാരം.[a]
  rationale: The revision explicitly renders the genitive ‘of God’ as ‘ദൈവകൃപ,’ preserves the two κατὰ phrases as the basis/standard for Paul’s service, and uses a more direct Malayalam expression for God’s power at work. The em dash is retained as supplied by the source/audit tradition, while the footnote anchor is placed after the completed sentence for cleaner Malayalam punctuation.
