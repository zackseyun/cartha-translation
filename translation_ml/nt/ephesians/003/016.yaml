reference: Ephesians 3:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἵνα ⸀δῷ ὑμῖν κατὰ ⸂τὸ πλοῦτος⸃ τῆς δόξης αὐτοῦ δυνάμει κραταιωθῆναι διὰ τοῦ πνεύματος αὐτοῦ εἰς τὸν ἔσω ἄνθρωπον,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/016.yaml
  text: that he may grant you[a], according to the riches of his glory, to be strengthened with power through his Spirit in the inner man,
translation:
  language: ml
  text: തന്റെ മഹത്ത്വത്തിന്റെ സമൃദ്ധിക്കൊത്തവണ്ണം, തന്റെ ആത്മാവിലൂടെ ശക്തിയാൽ നിങ്ങളുടെ അന്തരംഗ മനുഷ്യനിൽ[a] നിങ്ങൾ ശക്തരാക്കപ്പെടാൻ അവിടുന്ന് നിങ്ങൾക്കു നൽകണമേ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങളുടെ അന്തരംഗ വ്യക്തിയിൽ.’ ഗ്രീക്കിൽ അക്ഷരാർഥം ‘അന്തരംഗ മനുഷ്യൻ’ എന്നാണ്; മനുഷ്യന്റെ ആന്തരിക സ്വത്വത്തെ സൂചിപ്പിക്കുന്ന പ്രതിനിധാനപരമായ ഏകവചനപ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δῷ ὑμῖν
  choice: അവിടുന്ന് നിങ്ങൾക്കു നൽകണമേ
  rationale: ἵναയും aorist subjunctive ആയ δῷയും പൗലോസിന്റെ പ്രാർഥനാഭ്യർഥനയുടെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു. മുൻവാക്യത്തോടുള്ള ആശ്രിതബന്ധവും പ്രാർഥനാഭാവവും മലയാളത്തിലെ ‘നൽകണമേ’ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: κατὰ τὸ πλοῦτος τῆς δόξης αὐτοῦ
  choice: തന്റെ മഹത്ത്വത്തിന്റെ സമൃദ്ധിക്കൊത്തവണ്ണം
  rationale: κατά ഇവിടെ അളവോ മാനദണ്ഡമോ സൂചിപ്പിക്കുന്നു; ‘സമൃദ്ധിയിൽനിന്ന്’ എന്നതിനെക്കാൾ ‘സമൃദ്ധിക്കൊത്തവണ്ണം’ ആ ആശയം കൃത്യമായി നിലനിർത്തുന്നു. δόξαയുടെ ദൈവശാസ്ത്രപരമായ ഭാരം ‘മഹത്ത്വം’ സംരക്ഷിക്കുന്നു.
- source_word: δυνάμει κραταιωθῆναι
  choice: ശക്തിയാൽ ... ശക്തിപ്പെടേണ്ടതിന്
  rationale: δυνάμει ഉപാധി സൂചിപ്പിക്കുന്ന ദത്തിവും κραταιωθῆναι നിഷ്ക്രിയ infinitive-ഉം ആണ്. മലയാളത്തിൽ ആവർത്തനം ഉണ്ടായാലും മൂലത്തിലെ δύναμις/κραταιόω ആശയബന്ധവും നിഷ്ക്രിയതയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: διὰ τοῦ πνεύματος αὐτοῦ
  choice: തന്റെ ആത്മാവിലൂടെ
  rationale: διά + genitive ഉപാധിയോ പ്രവർത്തകമാധ്യമമോ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ πνεῦμα ദൈവത്തിന്റെ ആത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ആദരസൂചകമായ ‘തന്റെ’യും ‘ആത്മാവ്’ എന്ന പ്രയോഗവും ഉപയോഗിച്ചു.
- source_word: εἰς τὸν ἔσω ἄνθρωπον
  choice: നിങ്ങളുടെ അന്തരംഗമനുഷ്യനിൽ
  rationale: εἰς ശക്തിപ്പെടുത്തൽ ലക്ഷ്യമാകുന്ന ആന്തരിക വ്യക്തിത്വത്തെ സൂചിപ്പിക്കുന്നു. ഏകവചനത്തിലുള്ള ἄνθρωπος പ്രതിനിധാനപരമായതിനാൽ ‘അന്തരംഗമനുഷ്യൻ’ മൂലരൂപം സംരക്ഷിക്കുന്നു; മലയാളസ്വാഭാവികതയ്ക്കായി ‘-യിൽ’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: πνεῦμα എന്നതിന്റെ സൂചിതാർത്ഥം
  choice: ദൈവത്തിന്റെ ആത്മാവ് (‘തന്റെ ആത്മാവിലൂടെ’)
  alternative: വ്യക്തിത്വമില്ലാത്ത ദൈവിക സ്വാധീനമെന്ന പൊതുവായ അർത്ഥത്തിലുള്ള ‘അവന്റെ ആത്മാവ്’
  rationale: സന്ദർഭത്തിലെ ദൈവിക പ്രവർത്തനവും പൗലോസിന്റെ സാധാരണ പ്രയോഗവും പരിശുദ്ധാത്മാവിനെയാണ് ശക്തമായി സൂചിപ്പിക്കുന്നത്. എങ്കിലും പരിഭാഷ മൂലത്തിലെ ലളിതമായ ‘തന്റെ ആത്മാവ്’ എന്ന രൂപത്തിനപ്പുറം വിശദീകരണം ചേർക്കുന്നില്ല.
- issue: ἔσω ἄνθρωπον എന്നതിന്റെ വിവർത്തനം
  choice: അന്തരംഗമനുഷ്യൻ
  alternative: അന്തരംഗവ്യക്തി / ആന്തരിക സ്വത്വം
  rationale: ἄνθρωπος ഇവിടെ പുരുഷന്മാരെ മാത്രം സൂചിപ്പിക്കുന്നതല്ല, മനുഷ്യന്റെ ആന്തരിക സ്വത്വത്തെ പ്രതിനിധാനപരമായ ഏകവചനത്തിൽ പറയുന്നു. മൂലത്തിലെ പൗലോസീയ പ്രയോഗം മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ച് ഉൾക്കൊള്ളുന്ന അർത്ഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള പ്രാർഥനാശൈലി സ്വീകരിച്ചു. വാക്യം 3:14–19-ലെ ദീർഘപ്രാർഥനാവാക്യത്തിന്റെ ആശ്രിതഘടകമായതിനാൽ അവസാനം പൂർണവിരാമത്തിനു പകരം അൽപവിരാമം നിലനിർത്തി. ‘അവിടുന്ന്’ ദൈവത്തെ ആദരപൂർവം സൂചിപ്പിക്കുന്നു; ‘അന്തരംഗമനുഷ്യൻ’ അല്പം ഔപചാരികമായിരുന്നാലും മൂലത്തിലെ സവിശേഷ രൂപകത്തെ സംരക്ഷിക്കുന്നു.
