  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἵνα γνωρισθῇ νῦν ταῖς ἀρχαῖς καὶ ταῖς ἐξουσίαις ἐν τοῖς ἐπουρανίοις διὰ τῆς ἐκκλησίας ἡ πολυποίκιλος σοφία τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/010.yaml
  text: so that now[a], through the church, the manifold wisdom of God might be made known to the rulers and the authorities in the heavenly realms[c][b],
translation:
  language: ml
  text: ഇപ്പോൾ സഭയിലൂടെ ദൈവത്തിന്റെ ബഹുമുഖമായ ജ്ഞാനം സ്വർഗീയ മണ്ഡലങ്ങളിലെ[c] ഭരണാധികാരികൾക്കും അധികാരങ്ങൾക്കും[b] അറിയിക്കപ്പെടേണ്ടതിന്[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: മൂലഭാഷയിലെ വാക്യം മുൻവാക്യങ്ങളുമായി ചേർന്ന് ഇതു ദൈവത്തിന്റെ പദ്ധതിയുടെ ഉദ്ദേശ്യമാണെന്ന് സൂചിപ്പിക്കുന്നു.
    reason: discourse_note
  - marker: b
    text: ‘സ്വർഗീയ മണ്ഡലങ്ങളിലെ ഭരണാധികാരികളും അധികാരങ്ങളും’ എന്നത് മനുഷ്യാധികാരികളെ മാത്രം അല്ല, സ്വർഗീയമോ ആത്മീയമോ ആയ ശക്തികളെയാണു സാധ്യതയേറിയതായി സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
  - marker: c
    text: 'അല്ലെങ്കിൽ: ‘സ്വർഗീയ സ്ഥലങ്ങളിലെ’.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: വെളിപ്പെടേണ്ടതിനാണ്
  rationale: ഉദ്ദേശ്യത്തെ സൂചിപ്പിക്കുന്ന ἵναയുടെ ശക്തി സ്വാഭാവികമായ മലയാളവാക്യഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: γνωρισθῇ
  choice: വെളിപ്പെടേണ്ടതിനാണ്
  rationale: അറിയിക്കപ്പെടുക/അറിയപ്പെടുക എന്ന നിഷ്ക്രിയ ആശയവും ഉദ്ദേശ്യസൂചനയും സംയോജിപ്പിക്കുന്ന സ്വാഭാവിക പ്രയോഗം.
- source_word: νῦν
  choice: ഇപ്പോൾ
  rationale: കാലസൂചക ക്രിയാവിശേഷണത്തിന്റെ നേരിട്ടുള്ള പരിഭാഷ.
- source_word: ταῖς ἀρχαῖς καὶ ταῖς ἐξουσίαις
  choice: ഭരണാധികാരികൾക്കും അധികാരശക്തികൾക്കും
  rationale: ഈ പൗലോസീയ പദജോടിയുടെ ഭരണവും അധികാരവും സംബന്ധിച്ച അർത്ഥഭേദം നിലനിർത്തുന്നു; സ്വർഗീയ പശ്ചാത്തലം അമാനുഷിക ശക്തികളെ സൂചിപ്പിക്കുന്നുവെങ്കിലും മുഖ്യപാഠത്തിൽ അതിനെ അതിയായി നിർവചിക്കുന്നില്ല.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: സ്വർഗീയ മണ്ഡലങ്ങളിലുള്ള
  rationale: എഫെസ്യരിലെ സ്വർഗീയ മേഖലയെന്ന സ്ഥാനപരമായ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: διὰ τῆς ἐκκλησίας
  choice: സഭയിലൂടെ
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന ഉപാധി അഥവാ മാധ്യമം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἡ πολυποίκιλος σοφία
  choice: ബഹുമുഖമായ ജ്ഞാനം
  rationale: πολυποίκιλος എന്ന പദത്തിലെ അനേകം വശങ്ങളുള്ള, സമൃദ്ധവൈവിധ്യമാർന്ന എന്ന ആശയം സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ
  rationale: ജ്ഞാനം ദൈവത്തിന്റേതാണെന്ന് വ്യക്തമാക്കുന്ന സ്വാഭാവിക ഷഷ്ഠീവ്യാകരണ രൂപം.
theological_decisions:
- issue: ‘ഭരണാധികാരികളും അധികാരശക്തികളും’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: മുഖ്യപാഠം വിശാലമായ പദപ്രയോഗം നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് സ്വർഗീയമോ ആത്മീയമോ ആയ ശക്തികളെയാണ് സാധ്യതയേറിയതായി ചൂണ്ടിക്കാണിക്കുന്നത്.
  alternative: മനുഷ്യരായ ഭരണാധികാരികൾ മാത്രം; അല്ലെങ്കിൽ ഭൗമികവും സ്വർഗീയവുമായ എല്ലാ അധികാരങ്ങളും.
  rationale: ‘സ്വർഗീയ മണ്ഡലങ്ങളിൽ’ എന്ന വിശേഷണം അമാനുഷിക ശക്തികളിലേക്കാണ് ശക്തമായി വിരൽചൂണ്ടുന്നത്. എന്നിരുന്നാലും മുഖ്യപാഠത്തിൽ ‘ദൂതന്മാർ’ പോലുള്ള കൂടുതൽ നിർദ്ദിഷ്ടമായ വ്യാഖ്യാനം ചേർക്കാതെ മൂലത്തിലെ വ്യാപ്തി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും വായനാസൗഹൃദവുമായ മലയാളം. വാക്യം ഗ്രീക്ക് മൂലത്തിലെ ഉദ്ദേശ്യഘടനയും സ്വർഗീയ ശക്തികളെക്കുറിച്ചുള്ള വ്യാഖ്യാനപരമായ നിയന്ത്രണവും നിലനിർത്തുന്നു. [a] മുൻവാക്യബന്ധം വ്യക്തമാക്കാൻ നൽകിയതാണ്; എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
