  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τούτου χάριν κάμπτω τὰ γόνατά μου πρὸς τὸν ⸀πατέρα,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/014.yaml
  text: For this reason I bend my knees to the Father,
translation:
  language: ml
  text: ഇക്കാരണത്താൽ ഞാൻ പിതാവിന്റെ മുമ്പിൽ മുട്ടുകുത്തുന്നു,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τούτου χάριν
  choice: ഇക്കാരണത്താൽ
  rationale: ഈ പ്രയോഗം തുടർന്നുവരുന്ന പ്രാർഥനയുടെ കാരണമോ പ്രേരണയോ മുൻസന്ദർഭവുമായി ബന്ധിപ്പിക്കുന്നു. ‘ഇക്കാരണത്താൽ’ എന്നത് ആ വ്യവഹാരബന്ധം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നിലനിർത്തുന്നു.
- source_word: κάμπτω τὰ γόνατά μου
  choice: ഞാൻ ... മുട്ടുകുത്തുന്നു
  rationale: ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘എന്റെ മുട്ടുകൾ വളയ്ക്കുന്നു’ എന്ന ശരീരഭാവമാണ്. മലയാളത്തിൽ പ്രാർഥനാഭാവം അതേ ദൃശ്യത്തോടെ സ്വാഭാവികമായി അറിയിക്കുന്ന പ്രയോഗം ‘മുട്ടുകുത്തുന്നു’ ആണ്; അക്ഷരാനുവാദം അസ്വാഭാവികമാകും.
- source_word: πρὸς
  choice: മുമ്പിൽ
  rationale: ഇവിടെ പ്രാർഥനയിൽ അഭിമുഖീകരിക്കുന്ന വ്യക്തിയിലേക്കുള്ള ദിശയോ അഭിമുഖത്വമോ സൂചിപ്പിക്കുന്നു. ‘പിതാവിനോട്’ എന്നതും സാധ്യമാണ്; എന്നാൽ മുട്ടുകുത്തുന്ന ശരീരഭാവത്തോടൊപ്പം ‘പിതാവിന്റെ മുമ്പിൽ’ സ്വാഭാവിക മലയാളമാണ്.
- source_word: πατέρα
  choice: പിതാവ്
  rationale: സന്ദർഭത്തിൽ പ്രാർഥന അഭിസംബോധന ചെയ്യപ്പെടുന്ന ദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്. അതിനാൽ പൊതുവായ ‘ഒരു പിതാവ്’ എന്നതിനു പകരം ദൈവിക അഭിസംബോധനയായ ‘പിതാവ്’ യോജിക്കുന്നു.
theological_decisions:
- issue: πατέρα എന്നത് ദൈവിക സ്ഥാനനാമമായി പരിഭാഷപ്പെടുത്തണമോ
  choice: പിതാവ്
  alternative: പിതാവ്/അച്ഛൻ എന്ന പൊതുവായ ബന്ധനാമം
  rationale: പൗലോസ് ദൈവത്തോടുള്ള പ്രാർഥനയെ വിവരിക്കുന്ന സന്ദർഭവും തുടർന്നുള്ള വാക്യത്തിലെ പിതൃത്വഭാഷയും നിർദിഷ്ട ദൈവിക പരാമർശത്തെ പിന്തുണയ്ക്കുന്നു. ‘പിതാവ്’ ആദരപൂർവവും സഭാവിഭാഗനിരപേക്ഷവുമായ ആധുനിക പ്രയോഗമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗ്രീക്കിലെ ശരീരഭാവം മലയാളത്തിലെ സ്വാഭാവികമായ ‘മുട്ടുകുത്തുന്നു’ എന്ന പ്രയോഗത്തിലൂടെ സംരക്ഷിച്ചു; വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തി.
