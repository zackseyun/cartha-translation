  terminology: ‘അപ്പൊസ്തലന്മാർ,’ ‘പ്രവാചകന്മാർ,’ ‘വെളിപ്പെടുത്തപ്പെട്ടിരിക്കുന്നു,’ and ‘ആത്മാവിൽ’ are appropriate. ‘മനുഷ്യരുടെ പുത്രന്മാർക്ക്’ more transparently represents the literal genitive expression than the compounded ‘മനുഷ്യപുത്രന്മാർക്ക്’; the footnote retains its idiomatic inclusive sense. ‘ആത്മാവിൽ’ appropriately leaves the sphere/means nuance open.
