id: EPH.3.5
reference: Ephesians 3:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃ ἑτέραις γενεαῖς οὐκ ἐγνωρίσθη τοῖς υἱοῖς τῶν ἀνθρώπων ὡς νῦν ἀπεκαλύφθη τοῖς ἁγίοις ἀποστόλοις αὐτοῦ καὶ προφήταις ἐν πνεύματι,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/005.yaml
  text: which was not made known to the sons of men in other generations as it has now been revealed to his holy apostles and prophets in the Spirit[b][a],
translation:
  language: ml
  text: ഇപ്പോൾ ആത്മാവിൽ അവന്റെ വിശുദ്ധ അപ്പൊസ്തലന്മാർക്കും പ്രവാചകന്മാർക്കും വെളിപ്പെടുത്തപ്പെട്ടിരിക്കുന്നതുപോലെ, മറ്റു തലമുറകളിൽ മനുഷ്യരുടെ പുത്രന്മാർക്ക്[a] അത് അറിയിച്ചുകൊടുക്കപ്പെട്ടിരുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘മനുഷ്യർക്ക്’ / ‘മനുഷ്യവർഗത്തിന്’; ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘മനുഷ്യരുടെ പുത്രന്മാർക്ക്’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ
  choice: അത്
  rationale: നപുംസകലിംഗ ആപേക്ഷിക സർവനാമം മുൻവാക്യത്തിലെ ‘രഹസ്യം’ എന്നതിലേക്കാണ് വിരൽചൂണ്ടുന്നത്. മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യബന്ധത്തിനായി ‘അത്’ ഉപയോഗിച്ചു; ‘ഈ രഹസ്യം’ എന്ന് ആവർത്തിച്ച് മൂലത്തിൽ ഇല്ലാത്ത നാമം ചേർത്തില്ല.
- source_word: ἑτέραις γενεαῖς
  choice: മറ്റു തലമുറകളിൽ
  rationale: ദത്തിവ് ഇവിടെ കാലസൂചകമായി മനസ്സിലാക്കുന്നു. ‘മുൻ തലമുറകളിൽ’ എന്നതിനെക്കാൾ ‘മറ്റു’ എന്നത് ἑτέραις എന്ന പദത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: οὐκ ἐγνωρίσθη
  choice: അറിയിച്ചുകൊടുക്കപ്പെട്ടിരുന്നില്ല
  rationale: γνωρίζω എന്ന ക്രിയയുടെ കർമണിപ്രയോഗവും ‘അറിയിക്കുക’ എന്ന കാരകഭാവവും നിലനിർത്തുന്നു; വെറും ‘അറിയപ്പെട്ടിരുന്നില്ല’ എന്നതിനെക്കാൾ മൂലത്തോട് അടുത്തതാണ്.
- source_word: τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: മനുഷ്യപുത്രന്മാർക്ക്
  rationale: മനുഷ്യവർഗത്തെ പൊതുവായി സൂചിപ്പിക്കുന്ന സെമിറ്റിക് സ്വഭാവമുള്ള പ്രയോഗത്തിന്റെ രൂപം നിലനിർത്തി. അതിന്റെ ഉൾക്കൊള്ളുന്ന അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- source_word: ὡς νῦν
  choice: എന്നാൽ ഇപ്പോൾ
  rationale: മുൻകാലത്തെ വെളിപ്പെടുത്തലും ഇപ്പോഴത്തെ വെളിപ്പെടുത്തലും തമ്മിലുള്ള താരതമ്യവൈരുധ്യം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു. ഇത് മുൻപ് ഒട്ടും അറിവുണ്ടായിരുന്നില്ലെന്നതിലുപരി, ഇപ്പോൾ വെളിപ്പെട്ടിരിക്കുന്ന വിധത്തിലോ അളവിലോ അന്ന് അറിയിക്കപ്പെട്ടിരുന്നില്ലെന്ന സൂക്ഷ്മത സംരക്ഷിക്കുന്നു.
- source_word: ἀπεκαλύφθη
  choice: വെളിപ്പെടുത്തപ്പെട്ടിരിക്കുന്നു
  rationale: കർമണിപ്രയോഗവും പൗലോസിന്റെ വെളിപ്പെടുത്തൽസംബന്ധമായ പ്രധാന പദപ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: τοῖς ἁγίοις ἀποστόλοις αὐτοῦ καὶ προφήταις
  choice: അവന്റെ വിശുദ്ധ അപ്പൊസ്തലന്മാർക്കും പ്രവാചകന്മാർക്കും
  rationale: ἁγίοις എന്ന വിശേഷണം ഏകോപിപ്പിച്ചിരിക്കുന്ന അപ്പൊസ്തലന്മാരെയും പ്രവാചകന്മാരെയും സ്വാഭാവികമായി വിശേഷിപ്പിക്കുന്നതായി സ്വീകരിച്ചു. αὐτοῦ എന്നതിനെ സന്ദർഭം അതിലധികം നിർണ്ണയിക്കാതെ ‘അവന്റെ’ എന്നു നിലനിർത്തി.
- source_word: ἐν πνεύματι
  choice: ആത്മാവിൽ
  rationale: ദൈവിക വെളിപ്പെടുത്തലിന്റെ സന്ദർഭത്തിൽ പരിശുദ്ധാത്മാവാണ് സാധ്യതയേറിയ സൂചന. ἐν എന്നതിന്റെ മണ്ഡലം/മാധ്യമം എന്നീ രണ്ടർഥസാധ്യതകളും നിലനിർത്താൻ ‘ആത്മാവിൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: πνεύματι എന്നതിന്റെ സൂചിതാർത്ഥം
  choice: പരിശുദ്ധാത്മാവ്; മുഖ്യപാഠത്തിൽ ‘ആത്മാവിൽ’
  alternative: മനുഷ്യാത്മാവ്, അല്ലെങ്കിൽ ആത്മീയ മണ്ഡലം/വിധം
  rationale: അപ്പൊസ്തലന്മാർക്കും പ്രവാചകന്മാർക്കും ലഭിച്ച ദൈവിക വെളിപ്പെടുത്തലിന്റെ സന്ദർഭം പരിശുദ്ധാത്മാവിനെ ശക്തമായി സൂചിപ്പിക്കുന്നു. എങ്കിലും ἐν എന്നത് മണ്ഡലമോ മാധ്യമമോ സൂചിപ്പിക്കാം; അതിനാൽ മുഖ്യപാഠം ആ വ്യത്യാസം തീർപ്പാക്കുന്നില്ല.
- issue: മുൻകാലത്ത് രഹസ്യം എത്രത്തോളം അറിയപ്പെട്ടിരുന്നു എന്നത്
  choice: ഇപ്പോൾ വെളിപ്പെട്ടിരിക്കുന്ന വിധത്തിലോ അളവിലോ മുൻപ് അറിയിക്കപ്പെട്ടിരുന്നില്ല
  alternative: മുൻപ് അത് പൂർണമായും അജ്ഞാതമായിരുന്നു
  rationale: οὐκ ... ὡς νῦν എന്ന താരതമ്യഘടന മുൻകാലത്തെ എല്ലാ അറിവും നിഷേധിക്കണമെന്നില്ല. അതിനാൽ പൂർണമായ അജ്ഞാതത്വം പരിഭാഷയിൽ നിർബന്ധിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി സ്വീകരിച്ചു. ‘മനുഷ്യപുത്രന്മാർ’ എന്ന അല്പം മൂലഭാഷാസാന്നിധ്യമുള്ള പ്രയോഗം ഉദ്ദേശപൂർവം നിലനിർത്തി അടിക്കുറിപ്പിലൂടെ സ്വാഭാവിക അർഥം നൽകി. ‘അപ്പൊസ്തലന്മാർ’ എന്ന വ്യാപകമായ ബൈബിൾ പദം ഉപയോഗിച്ചു; മറ്റു പദക്രമം മലയാളത്തിന്റെ സ്വാഭാവികതയ്ക്കനുസരിച്ച് ക്രമപ്പെടുത്തി.
