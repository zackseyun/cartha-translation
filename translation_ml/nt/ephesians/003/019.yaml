  to: അറിവിനെ അതിക്രമിക്കുന്ന മശീഹായുടെ സ്നേഹം അറിയാനും, അങ്ങനെ നിങ്ങൾ ദൈവത്തിന്റെ മുഴുവൻ സമ്പൂർണതയിലേക്കു നിറയ്ക്കപ്പെടേണ്ടതിനും.[a]
