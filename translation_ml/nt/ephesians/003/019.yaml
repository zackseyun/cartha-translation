id: EPH.3.19
reference: Ephesians 3:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: γνῶναί τε τὴν ὑπερβάλλουσαν τῆς γνώσεως ἀγάπην τοῦ Χριστοῦ, ἵνα πληρωθῆτε εἰς πᾶν τὸ πλήρωμα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/019.yaml
  text: and to know the love of Messiah that surpasses knowledge[b][a], so that you may be filled unto all the fullness of God.
translation:
  language: ml
  text: അറിവിനെ അതിക്രമിക്കുന്ന മശീഹായുടെ സ്നേഹം അറിയാനും, അങ്ങനെ നിങ്ങൾ ദൈവത്തിന്റെ മുഴുവൻ സമ്പൂർണതയിലേക്കു നിറയ്ക്കപ്പെടേണ്ടതിനും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദൈവത്തിന്റെ മുഴുവൻ സമ്പൂർണതകൊണ്ട് നിറയ്ക്കപ്പെടേണ്ടതിനും.” ഗ്രീക്കിൽ അക്ഷരാർഥം “ദൈവത്തിന്റെ മുഴുവൻ സമ്പൂർണതയിലേക്കു നിറയ്ക്കപ്പെടേണ്ടതിനും” എന്നാണ്; ഈ ചുരുക്കപ്രയോഗം ദൈവത്തിന്റെ സമ്പൂർണതയുടെ പൂർണമായ അളവിലേക്കുള്ള മുന്നേറ്റം സൂചിപ്പിച്ചേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνῶναί
  choice: അറിയാനും
  rationale: γινώσκω എന്ന ക്രിയയുടെ അർത്ഥം നേരിട്ട് നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ബൗദ്ധിക അറിവിനൊപ്പം അനുഭവപരമായ അറിവും ഉൾക്കൊള്ളാൻ ഈ രൂപത്തിന് കഴിയും.
- source_word: τε
  choice: -ഉം
  rationale: മുൻപുള്ള പ്രാർഥനാവിനയങ്ങളോടു ഈ അനന്തക്രിയയെ ലഘുവായി ബന്ധിപ്പിക്കുന്ന ഗ്രീക്ക് സംയോജകത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: τὴν ὑπερβάλλουσαν τῆς γνώσεως
  choice: അറിവിനെ അതിക്രമിക്കുന്ന
  rationale: ഉറവിടത്തിലെ ‘അറിയുക/അറിവ്’ എന്ന പദബന്ധവും, അറിവിനെ അതിക്രമിക്കുന്നതിനെ അറിയുക എന്ന വിരോധാഭാസവും സംരക്ഷിക്കുന്നു.
- source_word: ἀγάπην τοῦ Χριστοῦ
  choice: മശീഹായുടെ സ്നേഹം
  rationale: Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ മശീഹാ എന്ന അർത്ഥം പ്രകടമാക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ ഉടമസ്ഥബന്ധം ഉപയോഗിക്കുമ്പോഴും, സന്ദർഭം സൂചിപ്പിക്കുന്ന മശീഹായുടെ സ്നേഹം എന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: ἵνα
  choice: അങ്ങനെ
  rationale: ഉദ്ദേശ്യത്തെയോ ഫലത്തെയോ അവതരിപ്പിക്കുന്ന ἵναയുടെ ബലം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: πληρωθῆτε
  choice: നിങ്ങൾ ... നിറയപ്പെടാനും
  rationale: അയോറിസ്റ്റ് പാസീവ് സബ്ജങ്ക്റ്റീവിന്റെ കർമണിപ്രയോഗവും ആശ്രിതമായ പ്രാർഥനാവിനയവും നിലനിർത്തുന്നു.
- source_word: εἰς πᾶν τὸ πλήρωμα τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ സർവസമ്പൂർണതയിലേക്കു
  rationale: εἰς എന്നതിന്റെ ലക്ഷ്യദിശാബലം ‘-ലേക്ക്’ വഴി സംരക്ഷിക്കുന്നു; πᾶν τὸ πλήρωμα എന്ന സമഗ്രവും ഊന്നലുള്ളതുമായ പ്രയോഗത്തിന് ‘സർവസമ്പൂർണത’ ഗൗരവമുള്ളതും ഗ്രഹിക്കാവുന്നതുമായ രൂപമാണ്.
theological_decisions:
- issue: Χριστοῦ എന്നതിന്റെ പരിഭാഷ
  choice: മശീഹായുടെ
  alternative: ക്രിസ്തുവിന്റെ
  rationale: Χριστός ഇവിടെ സ്ഥാനപ്പേരായതിനാൽ അതിന്റെ മശീഹാ എന്ന അർത്ഥം പരിഭാഷയിൽ പ്രകടമാക്കുന്നു.
- issue: ἀγάπην τοῦ Χριστοῦ എന്ന ബന്ധത്തിന്റെ അർത്ഥം
  choice: മശീഹായുടെ സ്നേഹം
  alternative: മശീഹാവിനോടുള്ള സ്നേഹം
  rationale: സന്ദർഭം പ്രധാനമായി മശീഹാ കാണിക്കുന്ന സ്നേഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്. എങ്കിലും ഗ്രീക്ക് ജനിറ്റീവിന്റെ ചുരുക്കം അനാവശ്യ വിശദീകരണമില്ലാതെ നിലനിർത്തുന്നു.
- issue: εἰς πᾶν τὸ πλήρωμα τοῦ θεοῦ എന്ന ചുരുക്കപ്രയോഗം
  choice: ദൈവത്തിന്റെ സർവസമ്പൂർണതയിലേക്കു നിറയപ്പെടുക
  alternative: ദൈവത്തിന്റെ സർവസമ്പൂർണതകൊണ്ട് നിറയപ്പെടുക
  rationale: ‘-ലേക്ക്’ എന്ന രൂപം εἰς-ന്റെ ദിശയും ലക്ഷ്യബലവും കാത്തുസൂക്ഷിക്കുന്നു; ‘കൊണ്ട്’ എന്നു മാറ്റി നിറയ്ക്കപ്പെടുന്ന ഉള്ളടക്കം മാത്രമായി അർത്ഥം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും പ്രാർഥനാഭാവവും നിലനിർത്തി. ‘സർവസമ്പൂർണത’ പൗലോസിന്റെ ഉന്നതവും ചുരുക്കവുമായ പ്രയോഗത്തെ സംരക്ഷിക്കുന്നു. പ്രധാനവാക്യത്തിൽ ഉപയോഗിച്ച [a] അടയാളം അനുബന്ധ അടിക്കുറിപ്പുമായി പൊരുത്തപ്പെടുന്നു.
