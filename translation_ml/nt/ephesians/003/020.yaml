revisions:
- from: നാം ചോദിക്കുകയോ ചിന്തിക്കുകയോ[b] ചെയ്യുന്നതെല്ലാം അതിലംഘിച്ച്, അളവറ്റവിധം ചെയ്യാൻ കഴിയുന്നവന്[a]—നമ്മിൽ പ്രവർത്തിക്കുന്ന ശക്തിക്കനുസരിച്ച്—
