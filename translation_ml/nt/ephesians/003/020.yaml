  rationale: The revision replaces the misleading “അതിലംഘിച്ച്” with “കവിഞ്ഞും,” which naturally expresses exceeding. It retains both the comparative-exceeding sense (ὑπὲρ πάντα) and the unusually strong intensive adverb (ὑπερεκπερισσοῦ) through “കവിഞ്ഞും അത്യധികമായും.” Footnote a has been moved to the expression it explains. The opening dative and unfinished doxological syntax are preserved for continuation in verse 21.
