id: EPH.3.20
reference: Ephesians 3:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τῷ δὲ δυναμένῳ ὑπὲρ πάντα ποιῆσαι ὑπερεκπερισσοῦ ὧν αἰτούμεθα ἢ νοοῦμεν κατὰ τὴν δύναμιν τὴν ἐνεργουμένην ἐν ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/020.yaml
  text: To the one who is able to do far beyond all that we ask or think[a], according to the power at work in us[b],
translation:
  language: ml
  text: നാം ചോദിക്കുകയോ ചിന്തിക്കുകയോ[b] ചെയ്യുന്നതെല്ലാം കവിഞ്ഞും അത്യധികമായും[a] ചെയ്യാൻ കഴിയുന്നവന്—നമ്മിൽ പ്രവർത്തിക്കുന്ന ശക്തിക്കനുസരിച്ച്—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അതിസമൃദ്ധമായി’ അല്ലെങ്കിൽ ‘ഏതളവിനും അപ്പുറം’; ചോദിക്കുന്നതും ചിന്തിക്കുന്നതും കവിയുന്നതിനെ ഗ്രീക്ക് പദം ശക്തമായി ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ചിന്തിക്കുക’ എന്നത് ഇവിടെ ‘സങ്കൽപ്പിക്കുക’ എന്നും പരിഭാഷപ്പെടുത്താം; മനസ്സിനു ധരിക്കാനോ വിഭാവനം ചെയ്യാനോ കഴിയുന്നതാണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῷ ... δυναμένῳ
  choice: ചെയ്യാൻ കഴിയുന്നവന്
  rationale: ആർട്ടിക്കിളോടുകൂടിയ ദത്തിവിഭക്തിയിലുള്ള കൃദന്തത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ നാമവൽക്കരിച്ച് അവതരിപ്പിക്കുന്നു. അടുത്ത വാക്യത്തിൽ തുടരുന്ന സ്തുതിവാക്യത്തിന്റെ സ്വീകർത്താവിനെ ‘ദൈവം’ എന്നു ഈ വാക്യത്തിൽ പ്രത്യേകം ചേർക്കുന്നില്ല.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇവിടെ δέ ശക്തമായ വിരോധമല്ല, സ്തുതിവാക്യത്തിലേക്കുള്ള മൃദുവായ മാറ്റമാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിലെ വാക്യപ്രവാഹത്തിൽ അധികമായ ‘എന്നാൽ’ ചേർക്കാതെ തന്നെ ഈ ബന്ധം വ്യക്തമാകുന്നു.
- source_word: ὑπὲρ πάντα
  choice: ചെയ്യുന്നതെല്ലാം അതിലംഘിച്ച്
  rationale: ποιῆσαι എന്ന ക്രിയയോടൊപ്പം പരിധിയെ കവിയുന്ന അർഥം നൽകുന്നു; ‘എല്ലാറ്റിനും മീതെ’ എന്ന അസ്വാഭാവികമായ രൂപത്തേക്കാൾ താരതമ്യബന്ധം ഇതിൽ വ്യക്തമാണ്.
- source_word: ποιῆσαι
  choice: ചെയ്യാൻ
  rationale: ποιέω എന്ന പൊതുവായ ക്രിയയുടെ ലാളിത്യവും അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു; ‘നിവർത്തിക്കാൻ’ പോലുള്ള കൂടുതൽ പ്രത്യേകമായ അർഥം ചേർക്കുന്നില്ല.
- source_word: ὑπερεκπερισσοῦ
  choice: അളവറ്റവിധം
  rationale: പരിധിയെ അത്യധികമായി കവിയുന്നതിനെ ഊന്നിപ്പറയുന്ന ഗ്രീക്ക് ക്രിയാവിശേഷണത്തിന്റെ ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὧν αἰτούμεθα ἢ νοοῦμεν
  choice: നാം ചോദിക്കുകയോ ചിന്തിക്കുകയോ ചെയ്യുന്നതെല്ലാം
  rationale: αἰτέομαι എന്നതിനെ ‘ചോദിക്കുക’ എന്നും νοέω എന്നതിനെ മനസ്സിൽ ധരിക്കുകയോ സങ്കൽപ്പിക്കുകയോ ചെയ്യുന്നതുൾപ്പെടുന്ന വിശാലമായ ‘ചിന്തിക്കുക’ എന്നും പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: κατὰ τὴν δύναμιν
  choice: ശക്തിക്കനുസരിച്ച്
  rationale: κατά ഇവിടെ വെറും ഉപകരണമല്ല, മാനദണ്ഡമോ അളവോ സൂചിപ്പിക്കുന്നു; അതിനാൽ ‘ശക്തിയാൽ’ എന്നതിനെക്കാൾ ‘ശക്തിക്കനുസരിച്ച്’ കൃത്യമാണ്.
- source_word: τὴν ἐνεργουμένην
  choice: പ്രവർത്തിക്കുന്ന
  rationale: തുടർച്ചയായി ഫലപ്രദമായി പ്രവർത്തിച്ചുകൊണ്ടിരിക്കുന്ന ശക്തിയെ മലയാളത്തിൽ ലളിതമായ വർത്തമാന കൃദന്തരൂപംകൊണ്ട് വ്യക്തമാക്കുന്നു.
- source_word: ἐν ἡμῖν
  choice: നമ്മിൽ
  rationale: വിശ്വാസികളുടെ ഉള്ളിലും സമൂഹപരമായ നിലയിലും പ്രവർത്തിക്കുന്ന ശക്തി എന്ന വിശാലത നിലനിർത്തുന്നു; ‘നമ്മുടെ ഇടയിൽ’ എന്നു മാത്രം പരിമിതപ്പെടുത്തുന്നില്ല.
theological_decisions:
- issue: സ്തുതിയുടെ പരോക്ഷ സ്വീകർത്താവ്
  choice: ‘കഴിയുന്നവന്’ എന്നു മാത്രം നൽകി, ‘ദൈവം’ എന്ന നാമം ഈ വാക്യത്തിൽ ചേർത്തിട്ടില്ല.
  alternative: ‘ചെയ്യാൻ കഴിയുന്ന ദൈവത്തിന്’
  rationale: സന്ദർഭത്തിൽ സ്വീകർത്താവ് ദൈവമാണെന്നത് വ്യക്തമാണെങ്കിലും ഈ വാക്യത്തിലെ ഗ്രീക്ക് പാഠം ‘ദൈവം’ എന്ന നാമം ആവർത്തിക്കുന്നില്ല. അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്ന സ്തുതിവാക്യത്തിന്റെ ഘടനയും അതുവഴി സംരക്ഷിക്കുന്നു.
- issue: വിശ്വാസികളിൽ പ്രവർത്തിക്കുന്ന ശക്തിയുടെ സ്വഭാവം
  choice: ‘നമ്മിൽ പ്രവർത്തിക്കുന്ന ശക്തി’
  alternative: ‘നമ്മുടെ ഇടയിൽ പ്രവർത്തിക്കുന്ന ശക്തി’
  rationale: ദൈവിക ശക്തി വിശ്വാസികളിൽ ഫലപ്രദമായി പ്രവർത്തിക്കുന്നു എന്ന വാചകത്തിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു; വിശുദ്ധീകരണമോ ആത്മീയവരങ്ങളോ സംബന്ധിച്ച ഏതെങ്കിലും പ്രത്യേക സഭാപരമായ വ്യാഖ്യാനം ഇതിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. അടുത്ത വാക്യത്തിൽ പൂർത്തിയാകുന്ന സ്തുതിവാക്യമാണെന്നതിനാൽ അവസാനം പൂർണ്ണവിരാമമിടാതെ ഡാഷുകളാൽ ഉപവാക്യം വേർതിരിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും അവ വിശദീകരിക്കുന്ന പദപ്രയോഗങ്ങൾക്ക് തൊട്ടുപിന്നാലെ ചേർത്തിരിക്കുന്നു.
