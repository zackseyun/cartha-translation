revisions:
- from: നിങ്ങൾക്കുവേണ്ടി എനിക്കു നൽകപ്പെട്ട ദൈവകൃപയുടെ കാര്യവിചാരകത്വത്തെക്കുറിച്ചു നിങ്ങൾ തീർച്ചയായും കേട്ടിട്ടുണ്ടെങ്കിൽ[a][b]—
  to: നിങ്ങൾക്കുവേണ്ടി എനിക്കു നൽകപ്പെട്ട ദൈവകൃപയുടെ നടത്തിപ്പുചുമതലയെക്കുറിച്ച്[b] നിങ്ങൾ കേട്ടിട്ടുണ്ടെങ്കിൽ[a]—
  rationale: The revision preserves the Greek conditional form, the passive statement that grace was given to Paul for the readers, and the entrusted-management sense of οἰκονομία. It uses more idiomatic modern Malayalam and attaches each note to its relevant expression. The dash is retained because the Greek sentence continues into the following verse.
