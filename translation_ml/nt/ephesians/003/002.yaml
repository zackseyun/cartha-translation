  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἴ γε ἠκούσατε τὴν οἰκονομίαν τῆς χάριτος τοῦ θεοῦ τῆς δοθείσης μοι εἰς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/002.yaml
  text: assuming indeed that you have heard of the stewardship of God's grace that was given to me for you[b][a],
translation:
  language: ml
  text: നിങ്ങൾക്കുവേണ്ടി എനിക്കു നൽകപ്പെട്ട ദൈവകൃപയുടെ നടത്തിപ്പുചുമതലയെക്കുറിച്ച്[b] നിങ്ങൾ കേട്ടിട്ടുണ്ടെങ്കിൽ[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങൾ വാസ്തവമായി കേട്ടിട്ടുണ്ടെങ്കിൽ.” ഗ്രീക്കിൽ സോപാധിക രൂപമാണുള്ളത്; എന്നാൽ സന്ദർഭത്തിൽ ഇത് സത്യമാണെന്ന് പൗലോസ് കരുതുന്നതായിരിക്കാം.
    reason: alternative_reading
  - marker: b
    text: “നടത്തിപ്പുചുമതല” എന്നതിന് “ഭരമേൽപ്പിക്കപ്പെട്ട നടത്തിപ്പ്” എന്നോ “ദൗത്യം” എന്നോ പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കുപദം ഏൽപ്പിക്കപ്പെട്ട കാര്യങ്ങളുടെ നടത്തിപ്പിനെയോ ഭരണച്ചുമതലയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ γε
  choice: തീർച്ചയായും ... എങ്കിൽ
  rationale: ഗ്രീക്കിലെ സോപാധിക രൂപം നിലനിർത്തിക്കൊണ്ട്, അത് യഥാർഥ സംശയത്തേക്കാൾ സത്യമെന്നു പ്രതീക്ഷിക്കുന്ന ഒരു വാഗ്മയ അനുമാനമാണെന്ന സൂചന നൽകുന്നു.
- source_word: ἠκούσατε
  choice: കേട്ടിട്ടുണ്ടെങ്കിൽ
  rationale: അയോറിസ്റ്റ് സൂചിപ്പിക്കുന്ന കേൾവിസംഭവത്തെ മലയാളത്തിൽ ഇപ്പോഴത്തെ പ്രസക്തിയോടെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: οἰκονομίαν
  choice: കാര്യവിചാരകത്വം
  rationale: ഒരാൾക്കു ഭരമേൽപ്പിക്കപ്പെട്ട നടത്തിപ്പിന്റെയും ഉത്തരവാദിത്വത്തിന്റെയും ആശയം സംരക്ഷിക്കുന്നു; ‘പദ്ധതി’ എന്നു പരിഭാഷപ്പെടുത്തി ദൈവിക രക്ഷാപദ്ധതി എന്ന അർഥത്തിലേക്ക് മാത്രം ചുരുക്കുന്നില്ല.
- source_word: χάριτος τοῦ θεοῦ
  choice: ദൈവകൃപ
  rationale: പൗലോസിന്റെ ഭാഷയിലെ ദൈവത്തിൽനിന്നുള്ള കൃപ എന്ന ആശയവും പദപരമായ തുടർച്ചയും നിലനിർത്തുന്നു.
- source_word: τῆς δοθείσης μοι
  choice: എനിക്കു നൽകപ്പെട്ട
  rationale: ദൈവം നൽകുന്നവൻ എന്ന സൂചനയുള്ള കർമണിപ്രയോഗവും പൗലോസാണ് സ്വീകരിച്ചവൻ എന്ന ദത്തബന്ധവും സംരക്ഷിക്കുന്നു.
- source_word: εἰς ὑμᾶς
  choice: നിങ്ങൾക്കുവേണ്ടി
  rationale: പൗലോസിനു ഭരമേൽപ്പിക്കപ്പെട്ട ശുശ്രൂഷ വായനക്കാരെ ലക്ഷ്യമാക്കുന്നതും അവരുടെ നന്മയ്ക്കായുള്ളതുമാണെന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: ‘ദൈവകൃപയുടെ കാര്യവിചാരകത്വം’ എന്നതിന്റെ സൂചിതാർഥം
  choice: വായനക്കാർക്കുവേണ്ടി പൗലോസിനു നൽകപ്പെട്ട, ദൈവകൃപയോടു ബന്ധപ്പെട്ട ഭരമേൽപ്പിച്ച ദൗത്യം/നടത്തിപ്പ്
  alternative: ദൈവത്തിന്റെ രക്ഷാപദ്ധതി അഥവാ യുഗനിർവഹണം എന്ന കൂടുതൽ അമൂർത്തമായ അർഥം
  rationale: തൊട്ടടുത്ത സന്ദർഭം ജനതകൾക്കായുള്ള പൗലോസിന്റെ ശുശ്രൂഷയെ ഊന്നുന്നു. എങ്കിലും ‘കാര്യവിചാരകത്വം’ വിശാലമായ ദൈവിക നടത്തിപ്പുമായുള്ള ബന്ധം പൂർണമായി ഒഴിവാക്കുന്നില്ല.
- issue: εἴ γε എന്നതിന്റെ ഭാവം
  choice: സത്യമെന്നു പ്രതീക്ഷിക്കുന്ന വാഗ്മയ അനുമാനം
  alternative: യഥാർഥ സംശയം പ്രകടിപ്പിക്കുന്ന നേരിട്ടുള്ള ‘എങ്കിൽ’
  rationale: ഗ്രീക്ക് സോപാധിക രൂപം ഉപയോഗിക്കുന്നുണ്ടെങ്കിലും, വായനക്കാർ ഇതു കേട്ടിട്ടുണ്ടെന്ന് പൗലോസ് പ്രതീക്ഷിക്കുന്നതാണ് സന്ദർഭത്തിൽ കൂടുതൽ സാധ്യതയുള്ളത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും വായനാസൗഹൃദവുമായ ശൈലി. വാക്യം അടുത്ത വാക്യത്തിലേക്കു തുടരുന്നതിനാൽ അവസാനത്തിൽ ദീർഘരേഖ ചേർത്തിരിക്കുന്നു. ‘കാര്യവിചാരകത്വം’ അല്പം ഔപചാരികമാണെങ്കിലും ഭരമേൽപ്പിച്ച നടത്തിപ്പ് എന്ന മൂലാർഥം കൃത്യമായി സൂക്ഷിക്കുന്നു.
