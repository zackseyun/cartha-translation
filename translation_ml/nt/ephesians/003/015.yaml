  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐξ οὗ πᾶσα πατριὰ ἐν οὐρανοῖς καὶ ἐπὶ γῆς ὀνομάζεται,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/015.yaml
  text: from whom every family in heaven and on earth is named,[a]
translation:
  language: ml
  text: സ്വർഗത്തിലും ഭൂമിയിലുമുള്ള ഓരോ കുടുംബവും ആ പിതാവിൽനിന്ന് പേര് ലഭിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സ്വർഗത്തിലും ഭൂമിയിലുമുള്ള മുഴുവൻ കുടുംബവും ആ പിതാവിൽനിന്ന് പേര് ലഭിക്കുന്നു”; കൂടുതൽ വ്യാഖ്യാനാത്മകമായി, “സ്വർഗത്തിലും ഭൂമിയിലുമുള്ള എല്ലാ പിതൃത്വവും ആ പിതാവിൽനിന്ന് അതിന്റെ പേര് പ്രാപിക്കുന്നു.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξ οὗ
  choice: ആ പിതാവിൽനിന്നാണ്
  rationale: ബന്ധസർവനാമത്തിന്റെ പൂർവപദം മുൻവാക്യത്തിലെ ‘പിതാവ്’ ആയതിനാൽ മലയാളത്തിൽ അത് വ്യക്തമായി ആവർത്തിക്കുന്നത് സ്വാഭാവികമാണ്. ἐκ + genitive സൂചിപ്പിക്കുന്ന ഉറവിടബന്ധം ‘-ൽനിന്ന്’ കൃത്യമായി നൽകുന്നു.
- source_word: πᾶσα
  choice: ഓരോ
  rationale: ഏകവചന നാമത്തോടുകൂടിയ πᾶσα ഇവിടെ വിതരണാർഥത്തിൽ ‘ഓരോ’ എന്നു സ്വാഭാവികമായി വായിക്കാം. ‘മുഴുവൻ’ എന്ന കൂട്ടായ വായന സാധ്യമെങ്കിലും പ്രധാനപാഠത്തിൽ അതിനെ നിർബന്ധിക്കുന്നില്ല.
- source_word: πατριά
  choice: കുടുംബം
  rationale: πατριά സാധാരണയായി കുടുംബസംഘം, വംശം, കുലം എന്നിവയെ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ ‘കുടുംബം’ ഏറ്റവും വ്യക്തവും പൊതുവുമായ തത്തുല്യമാണ്; πατήρ എന്നതുമായുള്ള പദബന്ധം വിവർത്തനത്തിൽ പൂർണമായി പുനരാവിഷ്കരിക്കാൻ കഴിയില്ല.
- source_word: ἐν οὐρανοῖς καὶ ἐπὶ γῆς
  choice: സ്വർഗത്തിലും ഭൂമിയിലുമുള്ള
  rationale: ഗ്രീക്കിലെ സ്ഥലംസൂചക പ്രയോഗങ്ങളെ സ്വാഭാവിക മലയാളത്തിൽ വിശേഷണഘടനയായി നൽകുന്നു. οὐρανοῖς ബഹുവചനമാണെങ്കിലും ഈ സന്ദർഭത്തിൽ ‘സ്വർഗത്തിൽ’ എന്ന ഏകവചന രൂപം മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: ὀνομάζεται
  choice: പേര് ലഭിക്കുന്നത്
  rationale: വർത്തമാനകാല കർമണിപ്രയോഗമായ ὀνομάζεταιയുടെ ‘പേരിടപ്പെടുന്നു/പേര് വിളിക്കപ്പെടുന്നു’ എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ ‘പേര് ലഭിക്കുന്നു’ എന്നു നൽകുന്നു. ഉറവിടത്തിൽനിന്നുള്ള നാമലാഭത്തിന്റെ സൂചന നിലനിർത്തുകയും ‘ഉത്ഭവിക്കുന്നു’ എന്ന ശക്തമായ വ്യാഖ്യാനം പ്രധാനപാഠത്തിൽ ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: മുൻവാക്യത്തിലെ പിതാവുമായി πᾶσα πατριάയ്ക്കുള്ള ബന്ധം
  choice: ഓരോ കുടുംബത്തിനും പേര് ലഭിക്കുന്നത് ആ പിതാവിൽനിന്നാണ്
  alternative: സ്വർഗത്തിലും ഭൂമിയിലുമുള്ള മുഴുവൻ കുടുംബത്തിനും ആ പിതാവിൽനിന്നാണ് പേര് ലഭിക്കുന്നത്; അല്ലെങ്കിൽ, സ്വർഗത്തിലും ഭൂമിയിലുമുള്ള എല്ലാ പിതൃത്വവും അവനിൽനിന്ന് അതിന്റെ പേര് പ്രാപിക്കുന്നു
  rationale: പ്രധാനപാഠം πᾶσα എന്നതിന്റെ വിതരണാർഥവും πατριάയുടെ സാധാരണ സാമൂഹികാർഥവും നിലനിർത്തുന്നു. ‘ഒരു മുഴുവൻ കുടുംബം’ എന്ന കൂട്ടായ വായനയും πατήρ–πατριά പദബന്ധത്തെ മുൻനിർത്തിയ ‘എല്ലാ പിതൃത്വവും’ എന്ന വ്യാഖ്യാനവും സാധ്യതകളായി അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു; അവയിൽ ഒന്നിനെ ദൈവശാസ്ത്രപരമായി നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘പേരിടപ്പെടുന്നു’ എന്ന കൃത്രിമ കർമണിരൂപത്തിനു പകരം ‘പേര് ലഭിക്കുന്നത്’ എന്ന സ്വാഭാവിക പ്രയോഗം സ്വീകരിച്ചു; മുൻവാക്യബന്ധം വ്യക്തമാക്കാൻ ‘ആ പിതാവ്’ എന്നു ആവർത്തിച്ചു.
