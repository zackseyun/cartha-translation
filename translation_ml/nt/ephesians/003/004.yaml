id: EPH.3.4
reference: Ephesians 3:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πρὸς ὃ δύνασθε ἀναγινώσκοντες νοῆσαι τὴν σύνεσίν μου ἐν τῷ μυστηρίῳ τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/004.yaml
  text: By reading this[a], you are able to understand my insight into the mystery of Messiah,
translation:
  language: ml
  text: ഇതു വായിക്കുമ്പോൾ, മശീഹായുടെ[a] മർമ്മത്തെക്കുറിച്ചുള്ള എന്റെ ഉൾക്കാഴ്ച നിങ്ങൾക്കു ഗ്രഹിക്കാനാകും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മശീഹാ’ എന്നതിന് പരമ്പരാഗതമായി ‘ക്രിസ്തു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
lexical_decisions:
- source_word: πρὸς ὃ … ἀναγινώσκοντες
  choice: ഇതു വായിക്കുമ്പോൾ
  rationale: πρὸς ὃ മുൻപ് എഴുതിയ കാര്യത്തിലേക്കു തിരിഞ്ഞുനോക്കുന്നു; ἀναγινώσκοντες വായനയോടൊപ്പം സംഭവിക്കുന്ന സാഹചര്യത്തെയും ഗ്രഹണത്തിനുള്ള മാർഗത്തെയും സൂചിപ്പിക്കുന്നു. ഇവ രണ്ടും ചേർത്ത് സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിച്ചു.
- source_word: δύνασθε … νοῆσαι
  choice: നിങ്ങൾക്കു ഗ്രഹിക്കാനാകും
  rationale: കഴിവിനെയും മാനസികമായി മനസ്സിലാക്കുന്നതിനെയും വ്യക്തമാക്കുന്ന സ്വാഭാവികവും മാന്യവുമായ മലയാളപ്രയോഗം.
- source_word: τὴν σύνεσίν μου
  choice: എന്റെ ഉൾക്കാഴ്ച
  rationale: σύνεσις ഇവിടെ വിഷയത്തെക്കുറിച്ചുള്ള ഗ്രാഹ്യത്തെയോ ഉൾക്കാഴ്ചയെയോ സൂചിപ്പിക്കുന്നു. νοῆσαι എന്നതിനെ ‘ഗ്രഹിക്കുക’ എന്നു പരിഭാഷപ്പെടുത്തിയതിനാൽ അനാവശ്യമായ പദാവർത്തനം ഒഴിവാക്കുകയും ചെയ്തു.
- source_word: ἐν τῷ μυστηρίῳ
  choice: മർമ്മത്തെക്കുറിച്ചുള്ള
  rationale: ἐν എന്നത് ഇവിടെ പൗലോസിന്റെ ഉൾക്കാഴ്ചയുടെ വിഷയമേഖലയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ഉൾക്കാഴ്ച’ എന്നതിനോടൊപ്പം ‘മർമ്മത്തെക്കുറിച്ചുള്ള’ എന്നത് സ്വാഭാവികമായി ആ ബന്ധം അറിയിക്കുന്നു.
- source_word: τοῦ Χριστοῦ
  choice: മശീഹായുടെ
  rationale: Χριστός ഇവിടെ അഭിഷിക്തനായവനെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നു; അതിനാൽ അർത്ഥം പ്രകടമാക്കുന്ന ‘മശീഹാ’ തിരഞ്ഞെടുത്തു.
theological_decisions:
- issue: τοῦ Χριστοῦ എന്നതിന്റെ പരിഭാഷ
  choice: മശീഹായുടെ
  alternative: ക്രിസ്തുവിന്റെ
  rationale: Χριστός ഇവിടെ സ്ഥാനപ്പേരായതിനാൽ ‘മശീഹാ’ മൂലപദത്തിന്റെ അർത്ഥം കൂടുതൽ നേരിട്ട് നൽകുന്നു. സഭാപാരമ്പര്യത്തിൽ സുപരിചിതമായ ‘ക്രിസ്തു’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- issue: ‘മശീഹായുടെ മർമ്മം’ എന്ന ഷഷ്ഠീബന്ധത്തിന്റെ അർത്ഥവ്യാപ്തി
  choice: മശീഹായുടെ മർമ്മം
  alternative: മശീഹായെക്കുറിച്ചുള്ള മർമ്മം
  rationale: τοῦ Χριστοῦ എന്ന ഷഷ്ഠീബന്ധം മർമ്മത്തിന്റെ ഉള്ളടക്കം, ബന്ധം, അല്ലെങ്കിൽ ഉടമസ്ഥത എന്നിവയിൽ ഒന്നിലധികം നിഴലുകൾ വഹിക്കാം. പ്രധാനവാക്യത്തിൽ ‘മശീഹായുടെ മർമ്മം’ എന്ന് നിലനിർത്തുന്നത് ഈ യഥാർഥ അർത്ഥവ്യാപ്തി അനാവശ്യമായി ചുരുക്കാതിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന വിധം ‘ഗ്രഹിക്കാനാകും’, ‘ഉൾക്കാഴ്ച’ എന്നീ പദങ്ങൾ ഉപയോഗിച്ചു. ‘മർമ്മം’ എന്നത് തിരുവെഴുത്തുപരമായ ഗൗരവവും വെളിപ്പെടുത്തപ്പെട്ട ദൈവിക രഹസ്യം എന്ന ആശയവും നിലനിർത്തുന്നു.
