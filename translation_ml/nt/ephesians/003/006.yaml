  text: εἶναι τὰ ἔθνη συγκληρονόμα καὶ σύσσωμα καὶ συμμέτοχα τῆς ἐπαγγελίας ⸂ἐν Χριστῷ Ἰησοῦ⸃ διὰ τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/006.yaml
  text: that the Gentiles are fellow heirs[a], fellow members of the body, and fellow partakers of the promise in Messiah Jesus through the gospel[c][b],
translation:
  language: ml
  text: സുവിശേഷത്തിലൂടെ, യഹൂദേതരർ[a] സഹാവകാശികളും ഒരേ ശരീരത്തിലെ സഹഅംഗങ്ങളും[c] മശീഹയായ യേശുവിൽ[b] വാഗ്ദാനത്തിന്റെ സഹപങ്കാളികളും ആകുന്നു എന്നതാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ജനതകൾ.’ ഇവിടെ ഈ പദം പ്രത്യേകിച്ച്, ദൈവത്തിന്റെ രക്ഷാവാഗ്ദാനത്തിൽ യിസ്രായേലിനോടൊപ്പം ഉൾപ്പെടുന്ന യഹൂദേതര ജനങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'പരമ്പരാഗത വിവർത്തനം: ‘ക്രിസ്തുയേശുവിൽ.’ ഗ്രീക്കിലെ Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ അർഥം നിലനിർത്താൻ ഇവിടെ ‘മശീഹാ’ എന്നു വിവർത്തനം ചെയ്തിരിക്കുന്നു.'
    reason: alternative_reading
  - marker: c
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘ഒരേ ശരീരത്തിൽ ഉൾപ്പെട്ടവരും.’'
    reason: literal_rendering
lexical_decisions:
- source_word: τὰ ἔθνη
  choice: യഹൂദേതരർ
  rationale: ഇവിടെ പൗലോസ് ഉദ്ദേശിക്കുന്നത് ഭൗമരാഷ്ട്രീയ അർഥത്തിലുള്ള ‘ജനതകൾ’ എന്നതിലുപരി, യഹൂദരോടൊപ്പം ദൈവത്തിന്റെ വാഗ്ദാനത്തിൽ ഉൾപ്പെടുന്ന യഹൂദരല്ലാത്ത ആളുകളെയാണ്.
- source_word: συγκληρονόμα
  choice: സഹാവകാശികൾ
  rationale: σύν- സംയുക്തപദം മറ്റുള്ളവരോടൊപ്പം ഒരേ അവകാശത്തിൽ പങ്കുചേരുന്നതിനെ ഊന്നുന്നു; ‘സഹാവകാശികൾ’ അത് സംക്ഷിപ്തമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: σύσσωμα
  choice: ഒരേ ശരീരത്തിലെ സഹഅംഗങ്ങൾ
  rationale: അപൂർവമായ ഈ പദം ഒരേ ശരീരത്തിൽ ഒരുമിച്ച് ഉൾപ്പെട്ടിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ശരീരരൂപകം വ്യക്തമാക്കിക്കൊണ്ട് മുൻപും പിന്നെയും വരുന്ന സഹ-പദങ്ങളുടെ സമാന്തരത നിലനിർത്തുന്നു.
- source_word: συμμέτοχα
  choice: സഹപങ്കാളികൾ
  rationale: ഒന്നിൽ മറ്റുള്ളവരോടൊപ്പം പങ്കുചേരുന്ന അർഥവും മൂന്ന് σύν-സംയുക്തപദങ്ങളുടെ അലങ്കാരപരമായ സമാന്തരതയും നിലനിർത്തുന്നു.
- source_word: τῆς ἐπαγγελίας
  choice: വാഗ്ദാനത്തിന്റെ
  rationale: ഗ്രീക്കിലെ ഏകവചനവും συμμέτοχα-യോടുള്ള ഷഷ്ഠീവിവക്തിബന്ധവും നേരിട്ട് നിലനിർത്തുന്നു; വാഗ്ദാനത്തിന്റെ ഉള്ളടക്കം വിശദീകരിച്ച് ചുരുക്കുന്നില്ല.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: മശീഹയായ യേശുവിൽ
  rationale: ഈ രക്ഷാചരിത്രപരമായ സന്ദർഭത്തിൽ Χριστός എന്ന പദത്തിന്റെ സ്ഥാനപ്പേരായ ശക്തി സജീവമാണ്; ‘മശീഹയായ യേശു’ അത് മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: διὰ τοῦ εὐαγγελίου
  choice: സുവിശേഷത്തിലൂടെ
  rationale: ഷഷ്ഠീവിവക്തിയോടെയുള്ള διά ഇവിടെ മാർഗമോ ഉപാധിയോ സൂചിപ്പിക്കുന്നു; ‘സുവിശേഷത്തിലൂടെ’ അതിനെ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: εἶναι
  choice: ആകുന്നു എന്നതാണ്
  rationale: ഈ അനന്തക്രിയ മുൻവാക്യത്തിൽ പറഞ്ഞ രഹസ്യത്തിന്റെ ഉള്ളടക്കം വിശദീകരിക്കുന്നു; മലയാളത്തിൽ ‘ആകുന്നു എന്നതാണ്’ ആ വാക്യബന്ധം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: Χριστῷ എന്നത് സ്ഥാനപ്പേരായോ പേരിന്റെ ഭാഗമായോ വിവർത്തനം ചെയ്യൽ
  choice: മശീഹയായ യേശുവിൽ
  alternative: ക്രിസ്തുയേശുവിൽ
  rationale: ജാതികളുടെ ഉൾപ്പെടുത്തലും ദൈവത്തിന്റെ വാഗ്ദാനവും വിശദീകരിക്കുന്ന ഈ സന്ദർഭത്തിൽ Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ മശീഹാസംബന്ധമായ അർഥം പ്രസക്തമായി തുടരുന്നു.
- issue: ἔθνη എന്നതിന്റെ സന്ദർഭപരമായ സൂചന
  choice: യഹൂദേതരർ
  alternative: ജനതകൾ
  rationale: രക്ഷാവാഗ്ദാനത്തിൽ യഹൂദരോടൊപ്പം ഉൾപ്പെടുന്ന യഹൂദരല്ലാത്തവരാണ് ഇവിടെ പ്രത്യേകമായി ഉദ്ദേശിക്കപ്പെടുന്നത്; ‘ജനതകൾ’ എന്നത് സാധ്യമെങ്കിലും ഈ സന്ദർഭത്തിൽ കുറച്ച് അസ്പഷ്ടമാണ്.
- issue: ἐν Χριστῷ Ἰησοῦ എന്ന പദസമുച്ചയത്തിന്റെ വ്യാപ്തി
  choice: പ്രധാന പട്ടികയ്ക്കു മുമ്പായി വെച്ച് മൂന്ന് പങ്കാളിത്തവിവരണങ്ങളോടും ബന്ധപ്പെടാൻ അനുവദിച്ചു
  alternative: വാഗ്ദാനത്തിന്റെ സഹപങ്കാളികൾ എന്ന അവസാന ഘടകത്തോടു മാത്രം ചേർത്തുവെക്കൽ
  rationale: ഗ്രീക്ക് വാക്യക്രമത്തിൽ ഇത് അവസാന ഘടകത്തിനു പിന്നാലെയാണെങ്കിലും, മശീഹായിലുള്ള സ്ഥിതി മുഴുവൻ ത്രിഭാഗ വിവരണത്തെയും ചുറ്റിപ്പറ്റുന്നതായി വായിക്കാം. മലയാളത്തിലെ മുൻസ്ഥാനം ആ വിശാലബന്ധം സ്വാഭാവികമാക്കുന്നു; വാഗ്ദാനത്തോടുള്ള അടുത്ത ബന്ധവും നിഷേധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ മൂന്ന് σύν-സംയുക്തപദങ്ങളുടെ താളവും സമാന്തരതയും ‘സഹാവകാശികൾ—സഹഅംഗങ്ങൾ—സഹപങ്കാളികൾ’ എന്ന നിരയിലൂടെ സൂക്ഷിച്ചു. ‘ഒരേ ശരീരം’ എന്ന പൗലോസിന്റെ രൂപകം വിശദീകരിച്ച് ലഘൂകരിക്കാതെ നിലനിർത്തി.
