  footnotes:
  - marker: a
    text: അഥവാ, ‘പ്രവൃത്തികളിൽ നിന്നു.’ ഈ പ്രയോഗം ഉറവിടത്തെയോ ഉത്ഭവത്തെയോ സൂചിപ്പിക്കുന്നു; ചില വ്യാഖ്യാതാക്കൾ ഇതിൽ ‘പ്രവൃത്തികളാൽ’ എന്ന ഉപകരണാർഥവും കാണുന്നു.
