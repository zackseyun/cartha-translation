lexical_decisions:
- source_word: οὐκ ἐξ ἔργων
  choice: പ്രവൃത്തികളിൽനിന്നല്ല
  rationale: οὐκ എന്ന നിഷേധവും ἐξ എന്ന ഉറവിടസൂചക മുൻപ്രത്യയവും ഒരുമിച്ച് സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; ‘പ്രവൃത്തികളാൽ അല്ല’ എന്ന ഉപകരണാർഥത്തിലേക്ക് വിവർത്തനം ചുരുക്കുന്നില്ല.
- source_word: ἔργων
  choice: പ്രവൃത്തികൾ
  rationale: പാഠത്തിലുള്ള പൊതുവായ ‘പ്രവൃത്തികൾ’ എന്ന അർഥം നിലനിർത്തുന്നു; ‘ന്യായപ്രമാണത്തിന്റെ പ്രവൃത്തികൾ’, ‘നല്ല പ്രവൃത്തികൾ’, ‘മനുഷ്യപ്രയത്നം’ എന്നിവ പാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: ἵνα μή τις
  choice: അതുകൊണ്ട് ആരും ... അതിരിക്കേണ്ടതിനാണ്
  rationale: ἵνα കൊണ്ടുവരുന്ന ഉദ്ദേശ്യം/ഫലം എന്ന ബന്ധവും μή τις നൽകുന്ന നിഷേധാത്മക അനിശ്ചിതത്വവും വ്യക്തമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: καυχήσηται
  choice: പ്രശംസിക്കാതിരിക്കുക
  rationale: καυχάομαι എന്നതിന്റെ ഇവിടെ യോജിച്ച അർഥമായ സ്വയം പ്രശംസിക്കുക അഥവാ വീമ്പുപറയുക എന്ന ആശയം dignified Malayalam-ൽ നൽകുന്നു; സന്ദർഭത്തിൽ ‘സ്വയം’ എന്നത് സ്വാഭാവികമായി ഉൾക്കൊള്ളപ്പെടുന്നു.
theological_decisions:
- issue: ‘പ്രവൃത്തികൾ’ എന്നതിന്റെ വ്യാപ്തി
  choice: ഗ്രീക്കിലുള്ള പൊതുവായ ‘പ്രവൃത്തികൾ’ എന്ന പദം നിലനിർത്തി.
  alternative: ‘ന്യായപ്രമാണത്തിന്റെ പ്രവൃത്തികൾ’, ‘മനുഷ്യപ്രയത്നം’, അല്ലെങ്കിൽ ‘നല്ല പ്രവൃത്തികൾ’ എന്നു വ്യാഖ്യാനിച്ച് വ്യക്തമാക്കുക.
  rationale: ἔργων എന്ന പദത്തിന് പാഠം പ്രത്യേക വിശേഷണം നൽകുന്നില്ല; കൂടുതൽ ചുരുക്കുകയോ വികസിപ്പിക്കുകയോ ചെയ്യുന്നത് വിവർത്തനത്തേക്കാൾ വ്യാഖ്യാനമായിരിക്കും.
- issue: ἐξ എന്നതിന്റെ അർഥനിറം
  choice: ഉറവിടം/ഉത്ഭവം സൂചിപ്പിക്കുന്ന ‘-യിൽനിന്ന്’ ഉപയോഗിച്ചു.
  alternative: ഉപകരണാർഥം മുൻനിർത്തി ‘പ്രവൃത്തികളാൽ’ എന്നു നൽകുക.
  rationale: ἐξ സാധാരണയായി ഉറവിടമോ ഉത്ഭവമോ സൂചിപ്പിക്കുന്നു; എന്നാൽ ഉപകരണാർഥമായി ഗ്രഹിക്കാനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- issue: ἵνα ഘടനയിലെ ഉദ്ദേശ്യം/ഫലം
  choice: ‘അതുകൊണ്ട് ... അതിരിക്കേണ്ടതിനാണ്’ എന്ന ഘടനയിൽ ഉദ്ദേശ്യത്തിന്റെ ശക്തി നിലനിർത്തി.
  alternative: ശുദ്ധ ഫലമായി ‘അതിനാൽ ആരും പ്രശംസിക്കുകയില്ല’ എന്നു നൽകുക.
  rationale: ἵνα ഉദ്ദേശ്യമോ ഉദ്ദേശ്യത്തോടു ചേർന്ന ഫലമോ സൂചിപ്പിക്കാം; നിർണ്ണായകമായി ശുദ്ധ ഫലമാക്കി മാറ്റാതെ ഗ്രീക്ക് ഘടനയുടെ ദിശ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. മുൻവാക്യവുമായി ബന്ധപ്പെട്ടു നിൽക്കുന്ന അപൂർണ്ണവാക്യസ്വഭാവം മൂലപാഠംപോലെ നിലനിർത്തിയിരിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
