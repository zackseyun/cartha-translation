  naturalness: ‘പ്രവൃത്തികളിൽ നിന്നല്ല’ is natural modern Malayalam. ‘ആരും വീമ്പുപറയാതിരിക്കേണ്ടതിന്’ is a more idiomatic and direct rendering of the negative purpose clause than ‘അതുകൊണ്ട് ആരും പ്രശംസിക്കാതിരിക്കേണ്ടതിനാണ്.’
  terminology: ‘പ്രവൃത്തികൾ’ properly retains the broad, unqualified sense of ἔργων. ‘വീമ്പുപറയുക’ conveys καυχάομαι without importing a specific theological interpretation. The footnote retains the source/origin nuance of ἐξ while noting, without endorsing, the possible instrumental construal.
