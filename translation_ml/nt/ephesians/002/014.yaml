id: EPH.2.14
reference: Ephesians 2:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: αὐτὸς γάρ ἐστιν ἡ εἰρήνη ἡμῶν, ὁ ποιήσας τὰ ἀμφότερα ἓν καὶ τὸ μεσότοιχον τοῦ φραγμοῦ λύσας, τὴν ἔχθραν ἐν τῇ σαρκὶ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/014.yaml
  text: For he himself is our peace[a], who made both one and broke down the dividing wall of the barrier—the hostility—in his flesh[d][c][b],
translation:
  language: ml
  text: കാരണം, അവൻ തന്നെയാണ് നമ്മുടെ സമാധാനം; അവൻ ഇരുകൂട്ടരെയും ഒന്നാക്കി, വേർതിരിക്കുന്ന തടസ്സമതിൽ—ശത്രുത—തന്റെ ജഡത്തിൽ തകർത്തുകളഞ്ഞു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഇരുകൂട്ടർ’ എന്നത് ഈ സന്ദർഭത്തിൽ യെഹൂദരെയും ജനതകളെയും സൂചിപ്പിക്കുന്നു.
    reason: contextual_clarification
  - marker: b
    text: ‘തന്റെ ജഡത്തിൽ’ എന്നത് ക്രിസ്തു ശരീരധാരിയായി മരിച്ചതിലൂടെ എന്ന അർഥത്തിലാണ്; ശത്രുത അവന്റെ ജഡത്തിനുള്ളിലായിരുന്നു എന്നല്ല.
    reason: syntactic_and_lexical_clarification
lexical_decisions:
- source_word: αὐτὸς
  choice: അവൻ തന്നെ
  rationale: ഊന്നൽ നൽകുന്ന സർവനാമത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; സമാധാനത്തിന്റെ ഉറവിടം ക്രിസ്തു തന്നെയാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: γάρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ പ്രസ്താവനയ്ക്കുള്ള അടിസ്ഥാനം അവതരിപ്പിക്കുന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἡ εἰρήνη ἡμῶν
  choice: നമ്മുടെ സമാധാനം
  rationale: ക്രിസ്തു സമാധാനം വരുത്തുന്നവൻ മാത്രമല്ല, അവൻ തന്നെയാണ് സമാധാനം എന്ന മൂലപാഠത്തിന്റെ ശക്തമായ പ്രസ്താവന സംരക്ഷിക്കുന്നു.
- source_word: τὰ ἀμφότερα
  choice: ഇരുകൂട്ടരെയും
  rationale: ഉടൻമുമ്പുള്ള സന്ദർഭത്തിലെ യെഹൂദരെയും ജനതകളെയും സൂചിപ്പിക്കുന്ന രണ്ട് കൂട്ടങ്ങളെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἓν
  choice: ഒന്നാക്കി
  rationale: രണ്ടു കൂട്ടങ്ങളെയും ഏകതയിലാക്കിയ ഫലം ചുരുക്കമായും വ്യക്തമായും നൽകുന്നു.
- source_word: τὸ μεσότοιχον τοῦ φραγμοῦ
  choice: വേർതിരിക്കുന്ന തടസ്സമതിൽ
  rationale: μεσότοιχον എന്ന വേർതിരിക്കൽ-മതിലിന്റെയും φραγμός എന്ന തടസ്സത്തിന്റെയും സംയുക്ത ദൃശ്യരൂപം ആവർത്തനഭാരം കൂടാതെ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: λύσας
  choice: തകർത്തുകളഞ്ഞു
  rationale: മതിൽ പൊളിച്ചുനീക്കുന്നതിന്റെ സമ്പൂർണതയും ശക്തിയും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: τὴν ἔχθραν
  choice: ശത്രുത
  rationale: ബന്ധപരമായ വൈരത്തെ സൂചിപ്പിക്കുന്ന ലളിതവും ഗൗരവമുള്ളതുമായ പദം; മുൻപറഞ്ഞ തടസ്സമതിലിനെ വിശദീകരിക്കുന്ന സമാനാധികരണമായി ഡാഷുകൾക്കിടയിൽ നൽകിയിരിക്കുന്നു.
- source_word: ἐν τῇ σαρκὶ αὐτοῦ
  choice: തന്റെ ജഡത്തിൽ
  rationale: σάρξ എന്ന പദത്തിന്റെ ദേഹസംബന്ധിയായ കാഠിന്യം സംരക്ഷിക്കുകയും ക്രിസ്തുവിന്റെ ശരീരധാരിയായ മരണത്തിലൂടെ നടന്ന പ്രവൃത്തിയിലേക്കു വിരൽചൂണ്ടുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: τὰ ἀμφότερα എന്നതിന്റെ സൂചിതർ
  choice: ഇരുകൂട്ടർ—സന്ദർഭത്തിൽ യെഹൂദരും ജനതകളും
  alternative: ‘ഇരുവരെയും’ അല്ലെങ്കിൽ ‘രണ്ടിനെയും’ എന്നു സൂചിതരെ പരോക്ഷമായി വിടുക
  rationale: എഫെസ്യർ 2-ലെ ഉടൻമുമ്പുള്ള സന്ദർഭം രണ്ടു ജനവിഭാഗങ്ങളെയാണ് എതിർനിറുത്തുന്നത്; ‘ഇരുകൂട്ടർ’ ലിംഗഭേദമില്ലാതെ ആ സന്ദർഭം വ്യക്തമാക്കുന്നു.
- issue: τὴν ἔχθραν എന്നതിന്റെ വാക്യബന്ധം
  choice: തടസ്സമതിലിനെ വിശദീകരിക്കുന്ന സമാനാധികരണമായി ‘—ശത്രുത—’
  alternative: ‘ശത്രുത’യെ അടുത്ത വാക്യത്തോടു ചേർക്കുക, അല്ലെങ്കിൽ ക്രിസ്തുവിന്റെ ജഡത്തിനുള്ളിലുണ്ടായിരുന്ന ശത്രുതയായി വായിക്കുക
  rationale: ഗ്രീക്കിലെ ഘടനയിൽ ശത്രുത മുൻപറഞ്ഞ വേർതിരിവിന്റെ വിശദീകരണമായി വായിക്കാവുന്നതാണ്; ഇരട്ട ഡാഷ് ‘തന്റെ ജഡത്തിൽ’ എന്നത് തകർക്കൽപ്രവൃത്തിയോടു ബന്ധിപ്പിക്കുകയും തെറ്റായ ദേഹാന്തർസ്ഥ വായന ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- issue: σάρξ എന്നതിന്റെ വിവർത്തനം
  choice: ജഡം
  alternative: ശരീരം; പാപസ്വഭാവം
  rationale: ഇവിടെ പാപസ്വഭാവമല്ല, ക്രിസ്തുവിന്റെ ദേഹധാരിയായ അസ്തിത്വവും മരണവുമാണ് ഉദ്ദേശ്യം. ‘ജഡം’ മൂലപദത്തിന്റെ രൂപവും ദൈവശാസ്ത്രപരമായ സാന്ദ്രതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. വാക്യം അടുത്ത വാക്യത്തിലേക്കു തുടരുന്ന ഗ്രീക്ക് പ്രവാഹമുള്ളതാണെങ്കിലും, ഒറ്റവാക്യ ഉദ്ധരണിയായി സ്വാഭാവികമായി വായിക്കാനായി സമ്പൂർണ വിരാമം നൽകി. ‘തടസ്സമതിൽ—ശത്രുത—’ എന്ന ഘടന മൂലപാഠത്തിലെ ദൃശ്യരൂപവും വ്യാഖ്യാനബന്ധവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
