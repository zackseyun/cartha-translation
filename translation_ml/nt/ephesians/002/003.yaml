  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν οἷς καὶ ἡμεῖς πάντες ἀνεστράφημέν ποτε ἐν ταῖς ἐπιθυμίαις τῆς σαρκὸς ἡμῶν, ποιοῦντες τὰ θελήματα τῆς σαρκὸς καὶ τῶν διανοιῶν, καὶ ⸀ἤμεθα τέκνα φύσει ὀργῆς ὡς καὶ οἱ λοιποί·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/003.yaml
  text: among whom we all also once lived in the desires of our flesh[a], fulfilling the desires of the flesh and of the mind, and we were by nature children of wrath[e][d][c][b], just as the rest were.
translation:
  language: ml
  text: അവരുടെ ഇടയിൽ[a] നാമെല്ലാവരും ഒരിക്കൽ നമ്മുടെ ജഡത്തിന്റെ[b] മോഹങ്ങളിൽ ജീവിച്ചിരുന്നു; ജഡത്തിന്റെയും ചിന്തകളുടെയും ഇച്ഛകൾ നിറവേറ്റിക്കൊണ്ടിരുന്നു. മറ്റുള്ളവരെപ്പോലെതന്നെ നാമും സ്വഭാവത്താൽ ക്രോധത്തിന്റെ മക്കളായിരുന്നു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവയിൽ.” ഗ്രീക്കിലെ പ്രയോഗം അനുസരണക്കേടിന്റെ മേഖലയെയോ അതിനാൽ വിശേഷിപ്പിക്കപ്പെടുന്ന ആളുകളെയോ സൂചിപ്പിക്കാം; ഇവിടെ സന്ദർഭമനുസരിച്ച് വ്യക്തികളെയാണ് സൂചിപ്പിക്കുന്നതായി പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നത്.
    reason: alternative_reading
  - marker: b
    text: “ജഡം” എന്നത് ഇവിടെ “പാപസ്വഭാവം” എന്നും പരിഭാഷപ്പെടുത്താം. എന്നാൽ പൗലോസിന്റെ പദത്തിനുള്ള വിശാലമായ ദൈവശാസ്ത്രപരമായ അർഥം വ്യാഖ്യാനിച്ച് ചുരുക്കാതിരിക്കാനാണ് മുഖ്യപാഠത്തിൽ “ജഡം” നിലനിർത്തിയത്.
    reason: lexical_alternative
  - marker: c
    text: “ക്രോധത്തിന്റെ മക്കൾ” എന്നത് ഗ്രീക്കിലെ പദാനുപദ ശൈലിയാണ്; അർഥം “ക്രോധത്തിന് വിധേയരായവർ” എന്നും പ്രകടിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν οἷς
  choice: അവരുടെ ഇടയിൽ
  rationale: സന്ദർഭത്തിൽ ഈ ബന്ധസർവനാമം മുൻവാക്യത്തിലെ അനുസരണക്കേടിന്റെ മക്കളെ വ്യക്തിപരമായി സൂചിപ്പിക്കുന്നതായി എടുക്കുന്നു. എന്നാൽ ‘അവയിൽ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἀνεστράφημέν ποτε
  choice: ഒരിക്കൽ ... ജീവിച്ചു
  rationale: മുൻകാലത്തെ ജീവിതരീതിയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐπιθυμίαις
  choice: മോഹങ്ങളിൽ
  rationale: ലൈംഗിക അർഥത്തിലേക്ക് മാത്രം ചുരുക്കാതെ, ധാർമികമായി വഴിതെറ്റിയ ആഗ്രഹങ്ങളുടെ വിശാലമായ അർഥം നൽകുന്നു.
- source_word: σάρξ
  choice: ജഡം
  rationale: പൗലോസിന്റെ പ്രധാന പദവും അതിലെ മാനവശാസ്ത്രപരവും ധാർമികവുമായ പിരിമുറുക്കവും സംരക്ഷിക്കുന്നു; ‘പാപസ്വഭാവം’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: ποιοῦντες τὰ θελήματα
  choice: ഇച്ഛകൾ നിറവേറ്റിക്കൊണ്ടിരുന്നു
  rationale: അവരുടെ ആഗ്രഹങ്ങളും മനോവൃത്തികളും പ്രവൃത്തിയിൽ നടപ്പാക്കിയിരുന്ന തുടർച്ചയായ ജീവിതരീതി മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: διανοιῶν
  choice: ചിന്തകളുടെ
  rationale: ബഹുവചനത്തിലുള്ള മാനസിക പ്രവണതകളെയും ചിന്താരീതികളെയും സംക്ഷിപ്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: τέκνα ὀργῆς
  choice: ക്രോധത്തിന്റെ മക്കൾ
  rationale: ഗ്രീക്കിലെ സെമിറ്റിക് ശൈലി സംരക്ഷിച്ച്, അത് ‘ക്രോധത്തിന് വിധേയർ’ എന്ന വ്യാഖ്യാനത്തിലേക്ക് മുൻകൂട്ടി ചുരുക്കുന്നില്ല.
- source_word: φύσει
  choice: സ്വഭാവത്താൽ
  rationale: ‘പ്രകൃത്യാ’ എന്നതിനെക്കാൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ രൂപം; ജനനം മാത്രം എന്ന അർഥത്തിലേക്ക് ചുരുക്കാതെ ജന്മസിദ്ധമായ അവസ്ഥയെക്കുറിച്ചുള്ള വിവാദസാധ്യത തുറന്നുവെക്കുന്നു.
- source_word: οἱ λοιποί
  choice: മറ്റുള്ളവർ
  rationale: ക്രിസ്തുവിന് പുറത്തുള്ള ശേഷിച്ച മനുഷ്യരെ സൂചിപ്പിക്കുന്ന താരതമ്യം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ധാർമിക അർഥമുള്ള പൗലോസിന്റെ σάρξ
  choice: ജഡം
  alternative: പാപസ്വഭാവം
  rationale: ‘പാപസ്വഭാവം’ കൂടുതൽ വ്യാഖ്യാനപരമാണ്. ‘ജഡം’ മൂലപദത്തിന്റെ വ്യാപ്തിയും ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും നിലനിർത്തുന്നു.
- issue: τέκνα φύσει ὀργῆς എന്ന പ്രയോഗത്തിന്റെ അർഥബലം
  choice: സ്വഭാവത്താൽ ക്രോധത്തിന്റെ മക്കൾ
  alternative: ജന്മനാ ക്രോധത്തിന് വിധേയർ
  rationale: മനുഷ്യന്റെ സ്വാഭാവിക അവസ്ഥയെയും ന്യായവിധിയുമായുള്ള ബന്ധത്തെയും കുറിച്ചുള്ള ദൈവശാസ്ത്രപരമായ ചോദ്യങ്ങൾ പരിഭാഷയിൽ തീർപ്പാക്കാതെ ഗ്രീക്ക് ശൈലി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ദീർഘമായ ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് മലയാള വാക്യങ്ങളാക്കി; ആശയബന്ധം സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
