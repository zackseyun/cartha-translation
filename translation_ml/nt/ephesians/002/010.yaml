source:
  edition: SBLGNT
  text: αὐτοῦ γάρ ἐσμεν ποίημα, κτισθέντες ἐν Χριστῷ Ἰησοῦ ἐπὶ ἔργοις ἀγαθοῖς οἷς προητοίμασεν ὁ θεὸς ἵνα ἐν αὐτοῖς περιπατήσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/010.yaml
  text: For we are his workmanship[a], created in Messiah Jesus for good works[b], which God prepared beforehand so that we might walk in them.
translation:
  language: ml
  text: എന്തെന്നാൽ, നാം ദൈവത്തിന്റെ കൈവേലയാണ്[a]; നല്ല പ്രവൃത്തികൾക്കായി മശീഹ യേശുവിൽ സൃഷ്ടിക്കപ്പെട്ടവരാണ് നാം. നാം അവയിൽ നടക്കേണ്ടതിന്, ദൈവം ആ പ്രവൃത്തികൾ മുൻകൂട്ടി ഒരുക്കിയിരിക്കുന്നു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കൈവേല’ എന്നതിന് ‘അവിടുന്ന് ഉണ്ടാക്കിയത്’ അഥവാ ‘സൃഷ്ടി’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: ഇവിടെ ‘നടക്കുക’ എന്നത് ഒരാളുടെ ജീവിതരീതിയെയോ പെരുമാറ്റത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποίημα
  choice: കൈവേല
  rationale: ദൈവം നിർമിച്ചതോ രൂപപ്പെടുത്തിയതോ ആയ സൃഷ്ടി എന്ന മൂർത്തമായ അർഥം നിലനിർത്തുന്നു; ‘ഉൽപ്പന്നം’ എന്ന യാന്ത്രിക ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: κτισθέντες
  choice: സൃഷ്ടിക്കപ്പെട്ടവരാണ്
  rationale: κτίζω എന്ന ക്രിയയുടെ ഭൂതകാല നിഷ്ക്രിയ പങ്കാളിത്തരൂപം വ്യക്തമായി പ്രതിഫലിപ്പിക്കുകയും മുൻവാക്യത്തിലെ ‘നാം’ എന്നതിനോട് സ്വാഭാവികമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: മശീഹയായ യേശുവിൽ
  rationale: Χριστός എന്ന പദത്തിന്റെ അഭിഷിക്തൻ/മശീഹ എന്ന പദവിയർഥം സംരക്ഷിക്കുകയും ἐν എന്നതിന്റെ ഐക്യ-ബന്ധപരമായ ഭാഷ ‘യേശുവിൽ’ എന്ന രൂപത്തിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐπὶ ἔργοις ἀγαθοῖς
  choice: നല്ല പ്രവൃത്തികൾക്കായി
  rationale: ἐπί സഹിതമുള്ള ദത്തിവിന്റെ ഉദ്ദേശ്യധ്വനി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ധാർമിക പ്രവൃത്തികൾ എന്ന ആശയം അധികവ്യാഖ്യാനം കൂടാതെ നിലനിർത്തുന്നു.
- source_word: προητοίμασεν
  choice: മുൻകൂട്ടി ഒരുക്കി
  rationale: προ- ഉപസർഗത്തിലെ മുൻകാലസൂചന വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἵνα
  choice: വേണ്ടതിന്
  rationale: വാക്യത്തിലെ ഉദ്ദേശ്യബന്ധം ലളിതവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐν αὐτοῖς περιπατήσωμεν
  choice: നാം അവയിൽ നടക്കേണ്ടതിന്
  rationale: പൗലോസിന്റെ ‘നടക്കുക’ എന്ന ജീവിതരീതിസൂചക രൂപകം നിലനിർത്തുന്നു; ‘അവയിൽ’ എന്നത് നല്ല പ്രവൃത്തികളിലേക്കു തിരിച്ചുപോകുന്നു.
- source_word: γάρ
  choice: കാരണം
  rationale: മുൻസന്ദർഭത്തോടുള്ള വിശദീകരണബന്ധം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: αὐτοῦ
  choice: ദൈവത്തിന്റെ
  rationale: സന്ദർഭത്തിലെ സൂചിത പരാമർശം മലയാളത്തിൽ അസന്ദിഗ്ധമാക്കുന്നു; അതേ വാക്യത്തിൽ ὁ θεός വ്യക്തമായി വരുന്നതുമായി യോജിക്കുന്നു.
theological_decisions:
- issue: Χριστῷ എന്നത് പദവിയായോ പേരുപോലുള്ള രൂപമായോ വിവർത്തനം ചെയ്യുക
  choice: മശീഹയായ യേശുവിൽ
  alternative: ക്രിസ്തുയേശുവിൽ
  rationale: Χριστός എന്നതിന്റെ പദവിയർഥം തുറന്നുകാട്ടുന്നു; അതിനെ വെറും പേരുപോലെ ലിപ്യന്തരണം ചെയ്യാതെ ‘അഭിഷിക്തൻ/മശീഹ’ എന്ന അർഥം സംരക്ഷിക്കുന്നു.
- issue: ദൈവത്തിന്റെ മുൻകൂട്ടിയുള്ള ഒരുക്കവും മനുഷ്യരുടെ ജീവിതനടപ്പും തമ്മിലുള്ള ബന്ധം
  choice: നാം അവയിൽ നടക്കേണ്ടതിന് ദൈവം അവ മുൻകൂട്ടി ഒരുക്കി
  alternative: നാം അവ ചെയ്യേണ്ടതിന് ദൈവം അവ മുൻകൂട്ടി ഒരുക്കി
  rationale: ദൈവിക മുൻകൈയും മനുഷ്യരുടെ അനുസരണജീവിതവും ഒരുമിച്ച് നിലനിർത്തുന്നു; മുൻനിർണയം സംബന്ധിച്ച വിപുലമായ തർക്കങ്ങളെ വാക്യത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
