- from: കാരണം, നാം ദൈവത്തിന്റെ കൈവേലയാണ്[a]; നല്ല പ്രവൃത്തികൾക്കായി മശീഹയായ യേശുവിൽ[b] സൃഷ്ടിക്കപ്പെട്ടവരാണ് നാം. നാം അവയിൽ നടക്കേണ്ടതിന്[c] ദൈവം അവ മുൻകൂട്ടി ഒരുക്കി.
