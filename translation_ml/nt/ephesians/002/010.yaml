  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കൈവേല’ ദൃശ്യമായ സൃഷ്ടിഭാവം നൽകുന്നു; ‘അവയിൽ നടക്കുക’ എന്ന പൗലോസീയ രൂപകം അടിക്കുറിപ്പിന്റെ സഹായത്തോടെ മനസ്സിലാക്കാവുന്ന വിധത്തിൽ നിലനിർത്തി.
