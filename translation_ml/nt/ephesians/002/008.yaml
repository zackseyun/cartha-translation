id: EPH.2.8
reference: Ephesians 2:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τῇ γὰρ χάριτί ἐστε σεσῳσμένοι ⸀διὰ πίστεως· καὶ τοῦτο οὐκ ἐξ ὑμῶν, θεοῦ τὸ δῶρον·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/008.yaml
  text: For by grace you have been saved through faith[a], and this is not from yourselves[b]; it is the gift of God.
translation:
  language: ml
  text: കൃപയാലല്ലോ നിങ്ങൾ വിശ്വാസത്തിലൂടെ[a] രക്ഷിക്കപ്പെട്ടിരിക്കുന്നത്. ഇതു[b] നിങ്ങളിൽനിന്നുള്ളതല്ല; ദൈവത്തിന്റെ ദാനമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വിശ്വാസം’ എന്നതിന് ഇവിടെ ‘ആശ്രയം’ എന്നും അർഥമാക്കാം; ചില സന്ദർഭങ്ങളിൽ ഗ്രീക്ക് പദത്തിന് ‘വിശ്വസ്തത’ എന്നും അർഥമുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: ‘ഇതു’ എന്നത് വിശ്വാസത്തെ മാത്രം സൂചിപ്പിക്കുന്നതായി ചിലർ മനസ്സിലാക്കുന്നു. എന്നാൽ ഗ്രീക്കിലെ നപുംസകലിംഗ സർവനാമം, ‘കൃപയാൽ വിശ്വാസത്തിലൂടെ രക്ഷിക്കപ്പെട്ടിരിക്കുന്നു’ എന്ന മുൻപറഞ്ഞ യാഥാർഥ്യത്തെ മുഴുവനായി സൂചിപ്പിക്കുന്നതാകാം കൂടുതൽ സാധ്യത.
    reason: alternative_reading
lexical_decisions:
- source_word: χάριτί
  choice: കൃപയാൽ
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിൽ χάρις ദൈവത്തിന്റെ ഉദാരവും അർഹതയില്ലാതെ ലഭിക്കുന്നതുമായ അനുഗ്രഹത്തെ സൂചിപ്പിക്കുന്നു. ‘കൃപ’ ഈ സ്ഥാപിതമായ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐστε σεσῳσμένοι
  choice: രക്ഷിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: εἰμίയുടെ വർത്തമാനരൂപവും σῴζωയുടെ പൂർണകാല കർമണി കൃദന്തരൂപവും ചേർന്ന ഈ ഘടന, പൂർത്തിയായ രക്ഷാപ്രവൃത്തിയും അതിന്റെ ഇപ്പോഴും തുടരുന്ന ഫലാവസ്ഥയും സൂചിപ്പിക്കുന്നു. ‘രക്ഷിക്കപ്പെട്ടിരിക്കുന്നു’ രണ്ടും സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: διὰ πίστεως
  choice: വിശ്വാസത്തിലൂടെ
  rationale: ജനിറ്റീവോടുകൂടിയ διά മാർഗമോ ഉപാധിയോ സൂചിപ്പിക്കുന്നു; അതിനാൽ ‘-ത്തിലൂടെ’ യോജിക്കുന്നു. πίστις ഇവിടെ പതിവായ പൗലോസീയ പ്രയോഗമനുസരിച്ച് ‘വിശ്വാസം’ എന്നു നൽകിയിരിക്കുന്നു; ‘ആശ്രയം’ എന്ന ആശയവും സന്ദർഭത്തിൽ ഉൾക്കൊള്ളാം.
- source_word: τοῦτο
  choice: ഇതു
  rationale: നപുംസകലിംഗത്തിലുള്ള τοῦτο, സ്ത്രീലിംഗത്തിലുള്ള χάρις അല്ലെങ്കിൽ πίστις എന്ന ഒറ്റ നാമത്തേക്കാൾ മുൻപറഞ്ഞ ‘കൃപയാൽ വിശ്വാസത്തിലൂടെ രക്ഷിക്കപ്പെട്ടിരിക്കുന്ന’ യാഥാർഥ്യത്തെ മൊത്തമായി ചൂണ്ടുന്നതായി കൂടുതൽ സ്വാഭാവികമാണ്. ‘ഇതു’ ഗ്രീക്കിലെ സംക്ഷിപ്തതയും സാധ്യതയുള്ള വ്യാപക സൂചനയും നിലനിർത്തുന്നു.
- source_word: οὐκ ἐξ ὑμῶν
  choice: നിങ്ങളിൽനിന്നുള്ളതല്ല
  rationale: ജനിറ്റീവോടുകൂടിയ ἐκ ഉറവിടം സൂചിപ്പിക്കുന്നു. ഈ രക്ഷായാഥാർഥ്യത്തിന്റെ ഉത്ഭവം വായനക്കാരിൽ തന്നെയല്ലെന്ന ആശയം ‘നിങ്ങളിൽനിന്നുള്ളതല്ല’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: θεοῦ τὸ δῶρον
  choice: ദൈവത്തിന്റെ ദാനമാണ്
  rationale: ഈ പ്രയോഗം മുൻപറഞ്ഞ യാഥാർഥ്യത്തെ ദൈവത്തിന്റെ ദാനമായി തിരിച്ചറിയിക്കുന്നു. ‘ദൈവത്തിന്റെ ദാനമാണ്’ മലയാളത്തിൽ സ്വാഭാവികവും ജനിറ്റീവ് ബന്ധം വ്യക്തമാക്കുന്നതുമാണ്.
theological_decisions:
- issue: τοῦτο (‘ഇതു’) കൃപയെയോ വിശ്വാസത്തെയോ രക്ഷായാഥാർഥ്യം മുഴുവനെയോ സൂചിപ്പിക്കുന്നുവോ
  choice: ‘ഇതു’ മുൻപറഞ്ഞ കൃപയാലും വിശ്വാസത്തിലൂടെയുമുള്ള രക്ഷായാഥാർഥ്യത്തെ മൊത്തമായി സൂചിപ്പിക്കുന്നു.
  alternative: ‘ഇതു’ പ്രത്യേകിച്ച് വിശ്വാസത്തെയോ പ്രത്യേകിച്ച് കൃപയെയോ സൂചിപ്പിക്കുന്നു.
  rationale: നപുംസകലിംഗത്തിലുള്ള demonstrative, സ്ത്രീലിംഗത്തിലുള്ള χάρις, πίστις എന്നീ നാമങ്ങളിൽ ഒന്നിനോട് നേരിട്ട് പൊരുത്തപ്പെടുന്നില്ല; അതിനാൽ മുൻവാക്യത്തിന്റെ മുഴുവൻ ആശയത്തെയും സൂചിപ്പിക്കുന്നതായി വായിക്കുന്നത് വ്യാകരണപരമായി സ്വാഭാവികമാണ്. എന്നിരുന്നാലും അടിക്കുറിപ്പിൽ പ്രത്യേക സൂചനയുടെ സാധ്യത തുറന്നുവെച്ച് വേദശാസ്ത്രപരമായ സംഘർഷം അനാവശ്യമായി തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘കൃപ’, ‘വിശ്വാസം’, ‘രക്ഷ’ എന്നീ പരിചിതമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തിയിട്ടുണ്ട്; വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കാനായി രണ്ടു വാക്യങ്ങളാക്കി. γάρ എന്ന ബന്ധകത്തിന്റെ വിശദീകരണഭാവം ‘-യാലല്ലോ’ വഴി സൂചിപ്പിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ നൽകിയിട്ടുണ്ട്.
