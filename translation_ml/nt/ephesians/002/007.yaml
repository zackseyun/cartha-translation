id: EPH.2.7
reference: Ephesians 2:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἵνα ἐνδείξηται ἐν τοῖς αἰῶσιν τοῖς ἐπερχομένοις ⸂τὸ ὑπερβάλλον πλοῦτος⸃ τῆς χάριτος αὐτοῦ ἐν χρηστότητι ἐφ’ ἡμᾶς ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/007.yaml
  text: so that in the coming ages he might display the surpassing riches of his grace in kindness toward us in Messiah Jesus[a][b][c].
translation:
  language: ml
  text: വരാനിരിക്കുന്ന യുഗങ്ങളിൽ[a] തന്റെ കൃപയുടെ അതിരുകവിഞ്ഞ സമൃദ്ധി[b] നമ്മോടുള്ള ദയയിൽ മശീഹാ യേശുവിൽ[c] അവൻ പ്രകടമാക്കേണ്ടതിനാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വരാനുള്ള യുഗങ്ങളിൽ.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “തന്റെ കൃപയുടെ അളവറ്റ സമൃദ്ധി.”
    reason: lexical_alternative
  - marker: c
    text: ഗ്രീക്കിൽ, “ക്രിസ്തു യേശുവിൽ”; Χριστός ഇവിടെ ഒരു പദവിയായി കണക്കാക്കുന്നതിനാൽ “മശീഹാ യേശുവിൽ” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: —വേണ്ടതിനാണ്
  rationale: മുൻസന്ദർഭത്തിൽനിന്നു വരുന്ന ഉദ്ദേശ്യാർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐνδείξηται
  choice: അവൻ പ്രകടമാക്കേണ്ടതിന്
  rationale: ἐνδείκνυμι എന്ന പദത്തിന്റെ പരസ്യമായി കാണിക്കുക, തെളിയിച്ചുകാട്ടുക എന്നീ ഭാവങ്ങൾ സാങ്കേതികതയില്ലാതെ നൽകുന്നു; ἵναയോടുകൂടിയ ഉപവാക്യത്തിന്റെ ഭാവവും നിലനിർത്തുന്നു.
- source_word: ἐν τοῖς αἰῶσιν τοῖς ἐπερχομένοις
  choice: വരാനിരിക്കുന്ന യുഗങ്ങളിൽ
  rationale: αἰῶνες എന്നതിന്റെ ബഹുവചനം നിലനിർത്തുകയും ഭാവിയിൽ വരുന്ന കാലഘട്ടങ്ങളെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: τὸ ὑπερβάλλον πλοῦτος
  choice: അതിരുകവിഞ്ഞ സമൃദ്ധി
  rationale: ὑπερβάλλον എന്നതിലെ പരിധിയെ മറികടക്കുന്ന ഭാവവും πλοῦτος എന്നതിലെ സമൃദ്ധിയുടെ ആശയവും സ്വാഭാവികമായി ചേർക്കുന്നു.
- source_word: τῆς χάριτος αὐτοῦ
  choice: തന്റെ കൃപയുടെ
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിലെ ദൈവിക കൃപയുടെ സ്ഥാപിതമായ അർഥം സംരക്ഷിക്കുന്നു; പ്രതിപാദ്യനായ ദൈവത്തോടുള്ള ബന്ധം ‘തന്റെ’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: ἐν χρηστότητι ἐφ’ ἡμᾶς
  choice: നമ്മോടുള്ള ദയയിലൂടെ
  rationale: χρηστότης എന്നതിലെ ദയയും കരുണാപൂർവമായ നന്മയും, ἐπί എന്നതിലെ നമ്മിലേക്കുള്ള അനുകൂല ദിശയും ഉൾക്കൊള്ളുന്നു; ഇവിടെ ἐν രീതിയോ മാധ്യമമോ സൂചിപ്പിക്കാവുന്ന യഥാർഥ അർഥവ്യാപ്തി ‘—യിലൂടെ’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: മശീഹയായ യേശുവിൽ
  rationale: Χριστός ഇവിടെ പദവിയായി പരിഭാഷപ്പെടുത്തുന്നു; ἐν എന്നത് സൂചിപ്പിക്കുന്ന മശീഹയുമായുള്ള ഐക്യത്തിന്റെ പൗലോസീയ ഭാഷയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: Χριστῷ എന്നത് പദവിയായോ പേരിനോടു ചേർന്ന രൂപമായോ പരിഭാഷപ്പെടുത്തൽ
  choice: മശീഹയായ യേശുവിൽ
  alternative: ക്രിസ്തുയേശുവിൽ
  rationale: ഈ പൗലോസീയ പ്രയോഗത്തിൽ Χριστός എന്ന പദത്തിന്റെ ‘മശീഹാ’ എന്ന പദവിയർഥം സജീവമായി നിലനിൽക്കുന്നു. മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി ‘മശീഹയായ യേശു’ എന്നു നൽകി.
- issue: ἐν χρηστότητι എന്നതും കൃപയുടെ സമൃദ്ധിയും തമ്മിലുള്ള ബന്ധം
  choice: നമ്മോടുള്ള ദയയിലൂടെ തന്റെ കൃപയുടെ ... സമൃദ്ധി
  alternative: നമ്മോടുള്ള ദയയിൽ തന്റെ കൃപയുടെ ... സമൃദ്ധി
  rationale: ദയയെ കൃപ പ്രകടമാകുന്ന രീതിയോ മാധ്യമമോ ആയി വായിക്കുന്നു; എന്നാൽ ഗ്രീക്കിലെ ἐν അനുവദിക്കുന്ന ‘ദയയിൽ’ എന്ന മേഖലാഭാവം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘കൃപ’, ‘യുഗം’, ‘മശീഹാ’ എന്നീ സ്ഥാപിത ബൈബിൾ പദങ്ങൾ നിലനിർത്തി; വാക്യക്രമം മലയാളത്തിലെ സ്വാഭാവിക ഊന്നലിനനുസരിച്ച് ക്രമപ്പെടുത്തി.
