  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: νυνὶ δὲ ἐν Χριστῷ Ἰησοῦ ὑμεῖς οἵ ποτε ὄντες μακρὰν ⸂ἐγενήθητε ἐγγὺς⸃ ἐν τῷ αἵματι τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/013.yaml
  text: But now in Messiah Jesus[d][c][b][a], you who once were far away have become near by the blood of the Messiah.
translation:
  language: ml
  text: എന്നാൽ ഇപ്പോൾ മശീഹയായ യേശുവിൽ[d], ഒരിക്കൽ അകലെയായിരുന്ന[a] നിങ്ങൾ മശീഹയുടെ രക്തത്താൽ[c] അടുത്തവരായിത്തീർന്നിരിക്കുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ദൂരെയായിരുന്ന.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘അടുത്തായിത്തീർന്നിരിക്കുന്നു’ / ‘അടുത്തുകൊണ്ടുവരപ്പെട്ടിരിക്കുന്നു.’
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘മശീഹയുടെ രക്തത്തിലൂടെ.’
    reason: lexical_alternative
  - marker: d
    text: ഗ്രീക്കിൽ ‘ക്രിസ്തോസ്’; Χριστός ഇവിടെ ഒരു സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നതിനാൽ ‘മശീഹ’ എന്നു വിവർത്തനം ചെയ്തിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: എന്നാൽ ഇപ്പോൾ
  rationale: νυνίയുടെ കാലസൂചനയും δέയുടെ വൈരുധ്യപരമായ മാറ്റവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: മശീഹയായ യേശുവിൽ
  rationale: ἐν എന്ന പൗലോസീയ ഐക്യ/ഉൾച്ചേരൽ ഭാഷയെ ‘-യിൽ’ കൊണ്ട് സംരക്ഷിക്കുന്നു; Χριστός ഇവിടെ സ്ഥാനപ്പേരായതിനാൽ ‘മശീഹ’ എന്നു അർത്ഥപരമായി വിവർത്തനം ചെയ്യുന്നു.
- source_word: ὑμεῖς οἵ ποτε ὄντες
  choice: ഒരിക്കൽ ... ആയിരുന്ന നിങ്ങൾ
  rationale: മുൻകാല അവസ്ഥയെ സൂചിപ്പിക്കുന്ന ποτεയും ὄντεςഉം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: μακρὰν
  choice: അകലെയായിരുന്ന
  rationale: ഭൗതികവും ബന്ധപരവുമായ അകലം ഒരുപോലെ സൂചിപ്പിക്കാവുന്ന സാധാരണ മലയാളപ്രയോഗം.
- source_word: ἐγενήθητε ἐγγὺς
  choice: അടുത്തായിത്തീർന്നിരിക്കുന്നു
  rationale: γίνομαιയുടെ ‘ആയിത്തീരുക’ എന്ന പരിവർത്തനാർഥം നേരിട്ട് നിലനിർത്തുകയും ദൈവിക പ്രവർത്തകനെ വാചകത്തിൽ അധികമായി ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐν τῷ αἵματι
  choice: രക്തത്താൽ
  rationale: ഇവിടെ ἐν മാർഗം/ഉപാധി സൂചിപ്പിക്കുന്നതായി വായിച്ച് മലയാളത്തിലെ കരണവിഭക്തിയാൽ സംക്ഷിപ്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: τοῦ Χριστοῦ
  choice: മശീഹയുടെ
  rationale: Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ അർത്ഥം നിലനിർത്താൻ ‘മശീഹ’ ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: Χριστός എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഈ വാക്യത്തിൽ Χριστός ഒരു സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നതിനാൽ പാരമ്പര്യ ലിപ്യന്തരണത്തേക്കാൾ അതിന്റെ സ്ഥാനപ്പേരായ അർത്ഥം വ്യക്തമാക്കുന്നു.
- issue: ἐν τῷ αἵματι τοῦ Χριστοῦ എന്നതിലെ ἐνയുടെ പ്രാബല്യം
  choice: മശീഹയുടെ രക്തത്താൽ
  alternative: മശീഹയുടെ രക്തത്തിലൂടെ / മശീഹയുടെ രക്തത്തിൽ
  rationale: സമീപതയിലേക്കുള്ള മാറ്റത്തിന്റെ മാർഗം എന്ന ഉപകരണാർഥം സന്ദർഭത്തിന് യോജിക്കുന്നു; അതേസമയം രക്തത്തെക്കുറിച്ച് വാക്യം പറയുന്നതിലധികം വികസിതമായ പ്രായശ്ചിത്തസിദ്ധാന്തം ചേർക്കുന്നില്ല.
- issue: ἐγενήθητε എന്ന ക്രിയയിലെ പ്രവർത്തകത്വം
  choice: അടുത്തായിത്തീർന്നിരിക്കുന്നു
  alternative: അടുത്തുകൊണ്ടുവരപ്പെട്ടിരിക്കുന്നു / അടുത്തവരാക്കപ്പെട്ടിരിക്കുന്നു
  rationale: മൂലത്തിലെ γίνομαι പരിവർത്തനം വ്യക്തമാക്കുന്നുവെങ്കിലും പ്രവർത്തകനെ തുറന്നു പറയുന്നില്ല; അതിനാൽ ദൈവിക പ്രവർത്തകത്വം വ്യാകരണത്തിൽ അനാവശ്യമായി നിർണ്ണയിക്കാതെ അവ്യക്തത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. പൗലോസിന്റെ ‘യേശുവിൽ’ എന്ന ഉൾച്ചേരൽഭാഷയും ‘അകലെ/അടുത്ത്’ എന്ന പ്രതിവിരുദ്ധ രൂപകവും വ്യക്തമായി നിലനിർത്തി; അനാവശ്യമായ സഭാപാരമ്പര്യ പദാവലിയോ വ്യാഖ്യാനവികാസമോ ചേർത്തിട്ടില്ല.
