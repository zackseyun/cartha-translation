- from: ആ കാലത്ത് നിങ്ങൾ മശീഹയെ[a] കൂടാതെയുള്ളവരും, ഇസ്രായേലിന്റെ പൗരസമൂഹത്തിൽനിന്ന് അകറ്റപ്പെട്ടവരും, വാഗ്ദാനത്തിന്റെ ഉടമ്പടികൾക്ക്[b] അന്യരായവരും, പ്രത്യാശയില്ലാത്തവരും, ലോകത്തിൽ ദൈവമില്ലാത്തവരും[c] ആയിരുന്നു എന്ന്.
  to: ആ കാലത്ത് നിങ്ങൾ മശീഹയില്ലാത്തവരും[a], ഇസ്രായേലിന്റെ പൗരസമൂഹത്തിൽനിന്ന് അകറ്റപ്പെട്ടവരും, വാഗ്ദാനത്തിന്റെ ഉടമ്പടികൾക്ക്[b] അന്യരായവരും, പ്രത്യാശയില്ലാത്തവരും, ലോകത്തിൽ ദൈവമില്ലാത്തവരും[c] ആയിരുന്നു എന്ന്.
  rationale: മൂലപാഠത്തിന്റെ അർഥമോ വാക്യഘടനയോ മാറ്റാതെ, χωρὶς Χριστοῦ-വിന്റെ മലയാളപ്രയോഗം സ്വാഭാവികമാക്കി; അതിനനുസരിച്ച് അടിക്കുറിപ്പ് a-യിലെ പകരവായനയും പൂർണ പ്രയോഗമായി പരിഷ്കരിച്ചു. മറ്റെല്ലാ പദതെരഞ്ഞെടുപ്പുകളും മൂലഗ്രീക്കിനോടും ഇംഗ്ലീഷ് ഓഡിറ്റ് പാതയിലെ തീരുമാനങ്ങളോടും യോജിച്ചതിനാൽ നിലനിർത്തി.
