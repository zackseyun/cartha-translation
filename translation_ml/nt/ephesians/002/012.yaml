id: EPH.2.12
reference: Ephesians 2:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι ⸀ἦτε τῷ καιρῷ ἐκείνῳ χωρὶς Χριστοῦ, ἀπηλλοτριωμένοι τῆς πολιτείας τοῦ Ἰσραὴλ καὶ ξένοι τῶν διαθηκῶν τῆς ἐπαγγελίας, ἐλπίδα μὴ ἔχοντες καὶ ἄθεοι ἐν τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/012.yaml
  text: that at that time you were without Messiah[a], alienated from the commonwealth of Israel and strangers to the covenants of the promise[c][b], having no hope and without God in the world.
translation:
  language: ml
  text: ആ കാലത്ത് നിങ്ങൾ മശീഹയില്ലാത്തവരും[a], ഇസ്രായേലിന്റെ പൗരസമൂഹത്തിൽനിന്ന് അകറ്റപ്പെട്ടവരും, വാഗ്ദാനത്തിന്റെ ഉടമ്പടികൾക്ക്[b] അന്യരായവരും, പ്രത്യാശയില്ലാത്തവരും, ലോകത്തിൽ ദൈവമില്ലാത്തവരും[c] ആയിരുന്നു എന്ന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ക്രിസ്തുവില്ലാത്തവരും.’ ഗ്രീക്കിലെ Χριστός എന്ന പദവി ‘ക്രിസ്തു’ എന്നും ‘മശീഹ’ എന്നും പരിഭാഷപ്പെടുത്താം; ഇവിടെ യഹൂദ-ഉടമ്പടി പശ്ചാത്തലം കണക്കിലെടുത്ത് ‘മശീഹ’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, ‘വാഗ്ദാനമുള്ള ഉടമ്പടികൾക്ക്.’
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘ദൈവഭക്തിയില്ലാത്തവരും.’ ഇവിടെ ആധുനിക അർഥത്തിലുള്ള നിരീശ്വരവാദത്തേക്കാൾ സത്യദൈവത്തെ കൂടാതെയുള്ള അവസ്ഥയായിരിക്കാം ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι ἦτε τῷ καιρῷ ἐκείνῳ
  choice: ആ കാലത്ത് നിങ്ങൾ ... ആയിരുന്നു എന്ന്
  rationale: ὅτι എന്ന ബന്ധകവും ἦτε എന്ന ഭൂതകാല ക്രിയയും നിലനിർത്തി; മുൻവാക്യത്തിലെ ‘ഓർക്കുക’ എന്ന ആഹ്വാനത്തോട് ഈ വാക്യം ആശ്രിതമായി ബന്ധപ്പെടുന്ന ഘടനയും സംരക്ഷിക്കുന്നു.
- source_word: χωρὶς Χριστοῦ
  choice: മശീഹയെ കൂടാതെയുള്ളവർ
  rationale: ഈ യഹൂദ-ഉടമ്പടി പശ്ചാത്തലത്തിൽ Χριστός അഭിഷിക്തനായ രക്ഷകനെ സൂചിപ്പിക്കുന്ന പദവിയായതിനാൽ ‘മശീഹ’ എന്നു നൽകി; χωρὶς സൂചിപ്പിക്കുന്ന വേർപെട്ട അവസ്ഥയും നിലനിർത്തി.
- source_word: ἀπηλλοτριωμένοι τῆς πολιτείας τοῦ Ἰσραήλ
  choice: ഇസ്രായേലിന്റെ പൗരസമൂഹത്തിൽനിന്ന് അകറ്റപ്പെട്ടവർ
  rationale: കർത്തരിപ്രയോഗമല്ലാത്ത പൂർണ്ണകാല കൃദന്തരൂപം സൂചിപ്പിക്കുന്ന തുടർന്നുനിന്ന വേർപെട്ട അവസ്ഥ ‘അകറ്റപ്പെട്ടവർ’ എന്നതിലൂടെ പ്രകടമാക്കുന്നു. πολιτείαയിലെ സാമൂഹികവും പൗരപരവുമായ കൂട്ടായ അർഥം ‘പൗരസമൂഹം’ സംരക്ഷിക്കുന്നു.
- source_word: ξένοι τῶν διαθηκῶν τῆς ἐπαγγελίας
  choice: വാഗ്ദാനത്തിന്റെ ഉടമ്പടികൾക്ക് അന്യർ
  rationale: διαθηκῶν എന്ന ബഹുവചനം ‘ഉടമ്പടികൾ’ എന്നു നിലനിർത്തി; ഏകവചനമായ ἐπαγγελίαയെ അവയോടു ബന്ധിപ്പിക്കുന്ന ജനിറ്റീവ് ഘടന ‘വാഗ്ദാനത്തിന്റെ’ എന്നു പരിഭാഷപ്പെടുത്തി. ξένοι സൂചിപ്പിക്കുന്ന ഉടമ്പടി-വലയത്തിനു പുറത്തുള്ള നില ‘അന്യർ’ എന്നു നൽകി.
- source_word: ἐλπίδα μὴ ἔχοντες
  choice: പ്രത്യാശയില്ലാത്തവർ
  rationale: പ്രത്യാശ ഇല്ലാത്ത മുൻകാല അവസ്ഥ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἄθεοι ἐν τῷ κόσμῳ
  choice: ലോകത്തിൽ ദൈവമില്ലാത്തവർ
  rationale: ആധുനിക ദാർശനിക നിരീശ്വരവാദം എന്ന ആശയം അനാവശ്യമായി ചുമത്താതെ, സത്യദൈവവുമായുള്ള ബന്ധത്തിന് പുറത്തായിരുന്ന അവസ്ഥയെ അടുപ്പമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: Χριστός എന്ന പദവിയുടെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഇസ്രായേൽ, ഉടമ്പടികൾ, വാഗ്ദാനം എന്നിവയുടെ പശ്ചാത്തലം ഇവിടെ പദവിയുടെ യഹൂദ-മശീഹീയ അർഥം മുൻനിരയിൽ കൊണ്ടുവരുന്നു. അതിനാൽ പേരുപോലെ കേൾക്കാവുന്ന ‘ക്രിസ്തു’വിനുപകരം അർഥസൂചകമായ ‘മശീഹ’ പ്രധാന പാഠത്തിൽ നൽകി; പര്യായം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: ἄθεοι എന്നതിന്റെ അർഥപരിധി
  choice: ദൈവമില്ലാത്തവർ
  alternative: ദൈവഭക്തിയില്ലാത്തവർ
  rationale: വിജാതീയർ ദൈവത്തിന്റെ ഉടമ്പടി-ബന്ധത്തിനു പുറത്തായിരുന്നുവെന്ന ആശയം നിലനിർത്തുന്നു; അവർ ദേവന്മാരുടെ അസ്തിത്വം ദാർശനികമായി നിഷേധിച്ചിരുന്നുവെന്ന വിധി ഇതിൽ ചേർക്കുന്നില്ല.
- issue: διαθηκῶν τῆς ἐπαγγελίας എന്ന ജനിറ്റീവ് ബന്ധം
  choice: വാഗ്ദാനത്തിന്റെ ഉടമ്പടികൾ
  alternative: വാഗ്ദാനമുള്ള ഉടമ്പടികൾ
  rationale: ഉടമ്പടികളുടെ ബഹുവചനവും വാഗ്ദാനത്തിന്റെ ഏകവചനവും ഔപചാരികമായി സംരക്ഷിക്കുന്നു; ഇവ തമ്മിലുള്ള കൃത്യബന്ധത്തെ അതിലധികം വിശദീകരിക്കാതെ ഗ്രീക്കിലെ അർഥസമ്മർദം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി സ്വീകരിച്ചു. മൂലത്തിലെ ആശ്രിതവാക്യഘടന അവസാനത്തെ ‘എന്ന്’ വഴി നിലനിർത്തി. സമാന്തരമായ അവസ്ഥാവിവരണങ്ങൾ ‘-വരും’ എന്ന ആവർത്തനത്തിലൂടെ വ്യക്തമായി ബന്ധിപ്പിച്ചു.
