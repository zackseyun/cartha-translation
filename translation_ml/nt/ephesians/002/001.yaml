revisions:
- from: നിങ്ങളാകട്ടെ, നിങ്ങളുടെ അതിക്രമങ്ങളും പാപങ്ങളും നിമിത്തം മരിച്ചവരായിരുന്നു.
  to: നിങ്ങളും നിങ്ങളുടെ അതിക്രമങ്ങളിലും പാപങ്ങളിലും മരിച്ചവരായിരുന്നു.
  rationale: The revision retains the audit trail’s finite past rendering while changing the dative relation from an interpretively narrowed causal phrase to the more source-transparent Malayalam locative expression. It also uses a more natural connective for καί. The original metaphor and theological openness are preserved.
  reviewer_model: gpt-5.6-terra
