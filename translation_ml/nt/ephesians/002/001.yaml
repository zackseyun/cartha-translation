source:
  edition: SBLGNT
  text: Καὶ ὑμᾶς ὄντας νεκροὺς τοῖς παραπτώμασιν καὶ ταῖς ἁμαρτίαις ⸀ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/001.yaml
  text: And you were dead in your trespasses and sins,
translation:
  language: ml
  text: നിങ്ങളും നിങ്ങളുടെ അതിക്രമങ്ങളിലും പാപങ്ങളിലും മരിച്ചവരായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραπτώμασιν
  choice: അതിക്രമങ്ങൾ
  rationale: ദൈവഹിതത്തിൽനിന്നുള്ള വ്യതിചലനങ്ങളെയോ ലംഘനങ്ങളെയോ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἁμαρτίαις
  choice: പാപങ്ങൾ
  rationale: പുതിയനിയമത്തിലെ പതിവായ നൈതിക-ദൈവശാസ്ത്ര അർഥം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: νεκρούς
  choice: മരിച്ചവർ
  rationale: രൂപകത്തിന്റെ ശക്തി മൃദൂകരിക്കാതെ നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: τοῖς ... καὶ ταῖς ...
  choice: '... നിമിത്തം'
  rationale: ഡേറ്റീവ് ഇവിടെ അവരെ മരിച്ച നിലയിൽ ആക്കിയ കാരണമായോ അടിസ്ഥാനമായോ വായിക്കാം; ആ ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὄντας
  choice: ആയിരുന്നു
  rationale: ഗ്രീക്കിൽ ഇത് ആശ്രിത കൃുദന്തരൂപമാണെങ്കിലും 2:1–5 ലെ ദീർഘവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കാൻ സമാപിക ക്രിയയായി നൽകുന്നു; ഇംഗ്ലീഷ് പരിശോധനാപാഠത്തോടും യോജിക്കുന്നു.
theological_decisions:
- issue: ‘മരിച്ചവർ’ എന്നതിന്റെ രൂപകാത്മക ദൈവശാസ്ത്രഭാരം
  choice: മരിച്ചവരായിരുന്നു
  alternative: ആത്മീയമായി മരിച്ചവരായിരുന്നു
  rationale: മൂലപാഠത്തിൽ ‘ആത്മീയമായി’ എന്ന വിശദീകരണം ഇല്ല. അതു ചേർക്കാതെ രൂപകവും അതിലെ വ്യാഖ്യാനസാധ്യതയും നിലനിർത്തുന്നു.
- issue: ഡേറ്റീവ് ഘടനയുടെ ബന്ധം
  choice: അതിക്രമങ്ങളും പാപങ്ങളും നിമിത്തം
  alternative: അതിക്രമങ്ങളിലും പാപങ്ങളിലും
  rationale: ഗ്രീക്ക് ഡേറ്റീവ് കാരണത്തെയോ മേഖല/അവസ്ഥയെയോ സൂചിപ്പിക്കാം. സന്ദർഭത്തിൽ കാരണവായന സ്വാഭാവികമാണെങ്കിലും പര്യായവായന സാധ്യമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘നിങ്ങളാകട്ടെ’ എന്നത് Καὶ ὑμᾶς എന്ന മുന്നോട്ടുവെച്ച ഘടനയും തുടർന്നുള്ള വാക്യബന്ധവും സൂചിപ്പിക്കുന്നു.
