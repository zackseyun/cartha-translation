id: EPH.2.18
reference: Ephesians 2:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι δι’ αὐτοῦ ἔχομεν τὴν προσαγωγὴν οἱ ἀμφότεροι ἐν ἑνὶ πνεύματι πρὸς τὸν πατέρα.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/018.yaml
  text: For through him we both have access in one Spirit to the Father[a][b][c].
translation:
  language: ml
  text: എന്തെന്നാൽ[a], അവനിലൂടെ നാം ഇരുകൂട്ടരും ഒരു ആത്മാവിൽ[c] പിതാവിന്റെ അടുക്കലേക്ക് പ്രവേശനമുള്ളവരാണ്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കാരണം, അവനിലൂടെ…’
    reason: lexical_alternative
  - marker: b
    text: ‘പ്രവേശനം’ എന്നത് ‘സമീപിക്കാനുള്ള അവസരം’ എന്നോ ‘സന്നിധിയിലേക്കുള്ള പ്രവേശനാവകാശം’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘ഒരു ആത്മാവിനാൽ’; ‘ഒരു ആത്മാവിൽ’ എന്നത് ഗ്രീക്കിലെ പദപ്രയോഗം നിലനിർത്തുന്നു; അത് മാർഗത്തെയോ പങ്കാളിത്തമേഖലയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ സമാധാനത്തിന്റെയും അനുരഞ്ജനത്തിന്റെയും അടിസ്ഥാനം വിശദീകരിക്കുന്ന ബന്ധകമായി സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്; ‘കാരണം’ എന്നതും സാധ്യമാണ്.
- source_word: δι’ αὐτοῦ
  choice: അവനിലൂടെ
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന മാർഗമോ മധ്യസ്ഥതയോ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ‘അവൻ’ ക്രിസ്തുവിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἔχομεν
  choice: പ്രവേശനമുള്ളവരാണ്
  rationale: വർത്തമാനകാലത്തിലുള്ള പങ്കിട്ട യാഥാർഥ്യമായ ‘നമുക്കുണ്ട്’ എന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; ‘ലഭിച്ചു’ എന്നു പറഞ്ഞ് ലഭിച്ച സംഭവത്തിന് അനാവശ്യ ഊന്നൽ നൽകുന്നില്ല.
- source_word: τὴν προσαγωγὴν
  choice: പ്രവേശനം
  rationale: ഉന്നതസ്ഥാനത്തുള്ള ഒരാളുടെ സന്നിധിയിലേക്കുള്ള സമീപനമോ പ്രവേശനാവകാശമോ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
- source_word: οἱ ἀμφότεροι
  choice: നാം ഇരുകൂട്ടരും
  rationale: യെഹൂദരും ജാതികളും എന്ന മുമ്പ് വേർപെട്ടിരുന്ന രണ്ടു കൂട്ടരെയും സൂചിപ്പിക്കുകയും ഗ്രീക്കിലെ ഒന്നാംപുരുഷ ഐക്യബോധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐν ἑνὶ πνεύματι
  choice: ഒരേ ആത്മാവിൽ
  rationale: ἐν എന്നതിന്റെ അടിസ്ഥാനരൂപം നിലനിർത്തുകയും രണ്ടു കൂട്ടരും പങ്കിടുന്ന ഏക പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു; മാർഗം, പ്രവർത്തനമാധ്യമം, പങ്കാളിത്തമേഖല എന്നീ നിഴലർഥങ്ങൾ തുറന്നുവെക്കുന്നു.
- source_word: πρὸς τὸν πατέρα
  choice: പിതാവിന്റെ അടുക്കലേക്ക്
  rationale: πρός + accusative സൂചിപ്പിക്കുന്ന വ്യക്തിയുടെ സന്നിധിയിലേക്കുള്ള ദിശയും സമീപനവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ‘ഒരേ ആത്മാവ്’ എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: പരിശുദ്ധാത്മാവ്
  alternative: ഇരുകൂട്ടരും പങ്കിടുന്ന മനുഷ്യാത്മാവോ മനോഭാവമോ
  rationale: ‘അവനിലൂടെ’ (പുത്രൻ), ‘ഒരേ ആത്മാവിൽ’, ‘പിതാവിന്റെ അടുക്കലേക്ക്’ എന്ന ത്രിത്വപരമായ വാക്യഘടനയിൽ പരിശുദ്ധാത്മാവാണ് ഏറ്റവും സ്വാഭാവികമായ സൂചന. എന്നാൽ മുഖ്യവാചകത്തിൽ ‘പരിശുദ്ധ’ എന്നു ചേർത്ത് മൂലത്തിൽ ഇല്ലാത്ത വ്യക്തീകരണം വരുത്തിയിട്ടില്ല.
- issue: προσαγωγή എന്നതിന്റെ ശക്തി
  choice: പിതാവിന്റെ അടുക്കലേക്കുള്ള പങ്കിട്ട പ്രവേശനം
  alternative: പിതാവിന്റെ സന്നിധിയിലേക്കുള്ള ഔപചാരിക പരിചയപ്പെടുത്തൽ
  rationale: ‘പ്രവേശനം’ തുടർന്നുനിൽക്കുന്ന സമീപനസൗകര്യവും അവകാശവും വ്യക്തമാക്കുന്നു; രാജസദസ്സിലെയോ ആരാധനയിലെയോ ഔപചാരിക ദൃശ്യത്തെ അനാവശ്യമായി പരിമിതപ്പെടുത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘നാം ഇരുകൂട്ടരും’ എന്ന പ്രയോഗം യെഹൂദ-ജാതി വിഭാഗങ്ങളെ അധികവാക്കുകൾ ചേർക്കാതെ വ്യക്തമാക്കുന്നു. ‘പ്രവേശനമുള്ളവരാണ്’ അല്പം ഔപചാരികമെങ്കിലും ἔχομεν + προσαγωγή എന്ന നാമപ്രയോഗം സംരക്ഷിക്കുകയും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതായിരിക്കുകയും ചെയ്യുന്നു.
