id: EPH.2.17
reference: Ephesians 2:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν εὐηγγελίσατο εἰρήνην ὑμῖν τοῖς μακρὰν καὶ ⸀εἰρήνην τοῖς ἐγγύς·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/017.yaml
  text: And he came and proclaimed peace to you who were far away[b][a], and peace to those who were near.
translation:
  language: ml
  text: അവൻ വന്ന്, ദൂരെയായിരുന്ന നിങ്ങളോടു[a] സമാധാനവും അടുത്തിരുന്നവരോടു സമാധാനവും സുവിശേഷമായി അറിയിച്ചു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അതായത്, മുമ്പ് ദൂരെയായിരുന്നവരോടും അടുത്തിരുന്നവരോടും സമാധാനം അറിയിക്കപ്പെട്ടു; സന്ദർഭത്തിൽ ഇവർ യഥാക്രമം വിജാതീയരെയും യെഹൂദരെയും സൂചിപ്പിക്കുന്നു (എഫെസ്യർ 2:11–13 കാണുക).
    reason: cross_reference
  - marker: b
    text: അല്ലെങ്കിൽ, “സമാധാനം പ്രസംഗിച്ചു” അല്ലെങ്കിൽ “സമാധാനത്തിന്റെ സുവാർത്ത അറിയിച്ചു.” ഗ്രീക്കിലെ ക്രിയ സാധാരണയായി ‘സുവാർത്ത അറിയിക്കുക’ എന്നാണ് അർഥം; എന്നാൽ ഇവിടെ അതിന്റെ നേരിട്ടുള്ള കർമം ‘സമാധാനം’ ആണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: അവൻ വന്ന്
  rationale: മുൻകൂർ/അനുബന്ധ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന എയോറിസ്റ്റ് കൃദന്തരൂപം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുകയും വരവിന്റെ ദൃശ്യബിംബം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: εὐηγγελίσατο
  choice: പ്രസംഗിച്ചു
  rationale: ഈ ക്രിയയ്ക്ക് സുവാർത്ത അറിയിക്കുക എന്ന അടിസ്ഥാനഭാവമുണ്ട്. ഇവിടെ നേരിട്ടുള്ള കർമം ‘സമാധാനം’ ആയതിനാൽ, ഇല്ലാത്ത വാക്കുകൾ മുഖ്യപാഠത്തിൽ ചേർക്കാതെ പ്രഖ്യാപനത്തിന്റെ പരസ്യസ്വഭാവം ‘പ്രസംഗിച്ചു’ എന്നതിലൂടെ നൽകുന്നു; സുവാർത്താഭാവം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: εἰρήνην
  choice: സമാധാനം
  rationale: ബന്ധങ്ങളുടെ പുനഃസ്ഥാപനവും ശാലോം എന്ന വിശാലഭാവവും ഉൾക്കൊള്ളാൻ കഴിയുന്ന നേരിട്ടും പതിവുമായ തുല്യപദം.
- source_word: ὑμῖν
  choice: നിങ്ങളോടു
  rationale: ദാതൃകാർഥം അഭിസംബോധനയുടെ സ്വാഭാവിക മലയാളരൂപത്തിൽ നൽകുന്നു; സമീപസന്ദർഭത്തിൽ ഇത് വിജാതീയരായ വായനക്കാരെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്നു.
- source_word: τοῖς μακρὰν
  choice: ദൂരെയായിരുന്ന നിങ്ങളോട്
  rationale: സ്ഥാനസൂചക രൂപകം നിലനിർത്തുന്നു. ‘ആയിരുന്ന’ എന്നത് മുൻകാല അകൽച്ചയെ സന്ദർഭാനുസൃതമായി സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τοῖς ἐγγύς
  choice: സമീപത്തായിരുന്നവരോട്
  rationale: ‘ദൂരെയായിരുന്നവർ’ എന്നതിന് സമാന്തരമായ വിരുദ്ധരൂപം നിലനിർത്തുന്നു; ഇവരുടെ തിരിച്ചറിയൽ മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: καὶ ... καὶ
  choice: …വും …വും
  rationale: രണ്ടു കൂട്ടങ്ങളോടും ഒരേ സമാധാനം പ്രസംഗിക്കപ്പെട്ടുവെന്ന സമാന്തരഘടനയും ഗ്രീക്കിലെ ആവർത്തനവും മലയാളത്തിലെ സഹബന്ധക രൂപത്തിലൂടെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘ദൂരെയായിരുന്നവർ’, ‘സമീപത്തായിരുന്നവർ’ എന്നിവരുടെ തിരിച്ചറിയൽ
  choice: രൂപകപരമായ ‘ദൂരെ’, ‘സമീപം’ എന്നീ പ്രയോഗങ്ങൾ മുഖ്യപാഠത്തിൽ അതേപടി നിലനിർത്തി.
  alternative: ‘ദൂരെയായിരുന്ന വിജാതീയർ’, ‘സമീപത്തായിരുന്ന യെഹൂദർ’ എന്ന് വ്യക്തമായി ചേർക്കുക.
  rationale: എഫെസ്യർ 2:11–13-ന്റെ സന്ദർഭത്തിൽ യഥാക്രമം വിജാതീയരും യെഹൂദരും ഉദ്ദേശിക്കപ്പെടുന്നു. എന്നാൽ ഈ വാക്യം തന്നെ രൂപകപരമായ വിഭാഗങ്ങളാണ് ഉപയോഗിക്കുന്നത്; അതിനാൽ സന്ദർഭപരമായ തിരിച്ചറിയൽ അടിക്കുറിപ്പിൽ മാത്രം നൽകുന്നത് പൗലോസിന്റെ വാചാലതയും വ്യാഖ്യാനസാധ്യതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ ‘സമാധാനം’ എന്ന ആവർത്തനം ഉദ്ദേശപൂർവം നിലനിർത്തി. ‘പ്രസംഗിച്ചു’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ പ്രഖ്യാപനത്തിന്റെ പരസ്യസ്വഭാവവും വഹിക്കുന്നു; ക്രിയയിലെ സുവാർത്താഭാവം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
