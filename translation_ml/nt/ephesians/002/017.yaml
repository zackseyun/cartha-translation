revisions:
- from: അവൻ വന്ന്, ദൂരെയായിരുന്ന നിങ്ങളോടു[a] സമാധാനവും സമീപത്തായിരുന്നവരോടു സമാധാനവും പ്രസംഗിച്ചു.[b]
  to: അവൻ വന്ന്, ദൂരെയായിരുന്ന നിങ്ങളോടു[a] സമാധാനവും അടുത്തിരുന്നവരോടു സമാധാനവും സുവിശേഷമായി അറിയിച്ചു.[b]
  rationale: The revision retains the source’s participial sequence, both recipient groups, and the deliberate repetition of ‘peace.’ It replaces a narrower sermon-oriented verb with a natural Malayalam expression that better reflects the good-news sense of εὐηγγελίσατο, and it uses the more idiomatic antonymic pair ‘ദൂരെയായിരുന്ന / അടുത്തിരുന്ന.’ Footnote wording is adjusted to identify the groups contextually without importing the interpretation into the verse or treating it as part of its explicit wording.
