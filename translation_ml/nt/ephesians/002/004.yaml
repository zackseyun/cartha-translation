id: EPH.2.4
reference: Ephesians 2:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς πλούσιος ὢν ἐν ἐλέει, διὰ τὴν πολλὴν ἀγάπην αὐτοῦ ἣν ἠγάπησεν ἡμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/004.yaml
  text: But God[a], being rich in mercy, because of his great love with which he loved us,
translation:
  language: ml
  text: എന്നാൽ, കരുണയിൽ സമ്പന്നനായ ദൈവം, അവൻ നമ്മെ സ്നേഹിച്ച തന്റെ മഹത്തായ സ്നേഹം നിമിത്തം,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുമ്പുള്ള മനുഷ്യന്റെ പാപാവസ്ഥയോടുള്ള ശക്തമായ വൈരുധ്യം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: πλούσιος ὢν ἐν ἐλέει
  choice: കരുണയിൽ സമ്പന്നനായ
  rationale: ‘കരുണ’ എന്ന ആശയവും ‘സമ്പന്നൻ’ എന്ന സമൃദ്ധിയുടെ രൂപകവും ഗ്രീക്ക് പ്രയോഗത്തോട് അടുത്തുനിന്ന് നിലനിർത്തുന്നു.
- source_word: διὰ τὴν πολλὴν ἀγάπην αὐτοῦ
  choice: തന്റെ മഹത്തായ സ്നേഹം നിമിത്തം
  rationale: διά + accusative സൂചിപ്പിക്കുന്ന കാരണബന്ധവും πολλήν എന്നതിന്റെ തീവ്രതയും വ്യക്തമായി നൽകുന്നു; αὐτοῦ ദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἣν ἠγάπησεν ἡμᾶς
  choice: നമ്മെ സ്നേഹിച്ച
  rationale: ἀγάπην ... ἠγάπησεν എന്ന നാമ-ക്രിയ ആവർത്തനം ‘സ്നേഹം ... സ്നേഹിച്ച’ എന്ന രൂപത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ‘സ്നേഹം ... സ്നേഹിച്ചു’ എന്ന ഒരേ ധാതുവിലുള്ള ആവർത്തനം
  choice: ‘നമ്മെ സ്നേഹിച്ച തന്റെ മഹത്തായ സ്നേഹം’ എന്ന ആവർത്തനം നിലനിർത്തി.
  alternative: ‘നമ്മോടുള്ള തന്റെ മഹത്തായ സ്നേഹം’
  rationale: ഗ്രീക്കിലെ ἀγάπην ... ἠγάπησεν എന്ന ഊന്നലുള്ള ആവർത്തനം മിനുക്കിക്കളയാതെ സംരക്ഷിക്കുന്നു.
- issue: കരുണയും സ്നേഹവും തമ്മിലുള്ള ബന്ധം
  choice: ‘കരുണയിൽ സമ്പന്നനായ ... മഹത്തായ സ്നേഹം നിമിത്തം’ എന്ന് രണ്ടിനെയും വേറിട്ടെങ്കിലും ബന്ധപ്പെട്ട ആശയങ്ങളായി നിലനിർത്തി.
  alternative: ‘കരുണാപൂർണമായ സ്നേഹം നിമിത്തം’ എന്നൊറ്റ ആശയമാക്കുക
  rationale: മൂലപാഠം കരുണയെയും സ്നേഹത്തെയും പരസ്പരം ബന്ധപ്പെട്ടതായിട്ടാണ് അവതരിപ്പിക്കുന്നത്; എന്നാൽ അവയെ ഒന്നാക്കി ലയിപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വായനാസൗകര്യവും നിലനിർത്തി. ഈ വാക്യം അടുത്ത വാക്യത്തിലേക്ക് വ്യാകരണപരമായി തുടരുന്നതിനാൽ അവസാനത്തിൽ അർധവിരാമസ്വഭാവമുള്ള കോമ നിലനിർത്തി.
