id: EPH.2.5
reference: Ephesians 2:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὄντας ἡμᾶς νεκροὺς τοῖς παραπτώμασιν συνεζωοποίησεν τῷ Χριστῷ— χάριτί ἐστε σεσῳσμένοι—
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/005.yaml
  text: even when we were dead in our trespasses[a], he made us alive together with Messiah—by grace you have been saved—
translation:
  language: ml
  text: നാം അതിക്രമങ്ങളിൽ മരിച്ചവരായിരുന്നപ്പോഴും, അവൻ നമ്മെ മശീഹയോടൊപ്പം[a] ജീവിപ്പിച്ചു—കൃപയാലാണ് നിങ്ങൾ രക്ഷിക്കപ്പെട്ടിരിക്കുന്നത്—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ക്രിസ്തുവിനോടൊപ്പം.” ഗ്രീക്ക് Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ അർഥം നിലനിർത്താൻ ഇവിടെ “മശീഹ” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ പരമ്പരാഗത മലയാളരൂപമായ ‘ക്രിസ്തു’ എന്ന പരിഭാഷാവികൽപം അറിയിക്കാൻ.
lexical_decisions:
- source_word: ὄντας ἡμᾶς νεκροὺς
  choice: മരിച്ചവരായിരുന്ന നമ്മെപ്പോലും
  rationale: കർത്തൃകൃദ്യന്തഘടനയുടെ സന്ദർഭത്തിലുള്ള കാലസൂചനയും വഴങ്ങിക്കൊടുക്കുന്ന ഭാവവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; νεκρούς എന്നതിന്റെ ശക്തി ‘മരിച്ചവർ’ എന്നു നിലനിർത്തുന്നു.
- source_word: τοῖς παραπτώμασιν
  choice: അതിക്രമങ്ങളിൽ
  rationale: ദത്തിവ് ഇവിടെ അതിക്രമങ്ങളുടെ മേഖലയിലോ അവയോടുള്ള ബന്ധത്തിലോ മരിച്ച അവസ്ഥയെ സൂചിപ്പിക്കുന്നു. ‘അതിക്രമങ്ങളിൽ’ പൗലോസിന്റെ രൂപകം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: συνεζωοποίησεν
  choice: മശീഹയോടൊപ്പം ജീവിപ്പിച്ചു
  rationale: സംയുക്തക്രിയയിലെ ജീവൻ നൽകലും ‘ഒപ്പം’ എന്ന സഹബന്ധവും തുടർന്നുള്ള τῷ Χριστῷ എന്ന പദസമുച്ചയത്തോടുകൂടെ വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: τῷ Χριστῷ
  choice: മശീഹയോടൊപ്പം
  rationale: Χριστός ഇവിടെ അഭിഷിക്തനായ പ്രത്യാശിത രാജാവിനെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നു; ദത്തിവ് സഹബന്ധം സൂചിപ്പിക്കുന്നതായി പരിഭാഷപ്പെടുത്തി.
- source_word: χάριτί
  choice: കൃപയാലാണ്
  rationale: ഉപാധി സൂചിപ്പിക്കുന്ന ദത്തിവിനെ കൃത്യമായി നൽകുകയും ഇടക്കുള്ള പ്രസ്താവനയുടെ ഊന്നൽ ‘ആണ്’ വഴി സ്വാഭാവികമായി പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: ἐστε σεσῳσμένοι
  choice: നിങ്ങൾ രക്ഷിക്കപ്പെട്ടിരിക്കുന്നത്
  rationale: പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ ഫലം ഊന്നുന്ന പരിഫ്രാസ്റ്റിക് പെർഫെക്റ്റും കർമണിപ്രയോഗവും മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: Χριστῷ എന്നതിന്റെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: സ്ഥാനപ്പേരിന്റെ ‘അഭിഷിക്തൻ’ എന്ന മശീഹാസംബന്ധിയായ അർഥം ഇവിടെ സജീവമാണ്. പരമ്പരാഗത ‘ക്രിസ്തു’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: χάριτί ἐστε σεσῳσμένοι എന്ന ഇടയ്ക്കുള്ള പ്രസ്താവനയുടെ രൂപം
  choice: ദീർഘവരകൾക്കിടയിലെ ഊന്നിയ പ്രസ്താവനയായി നിലനിർത്തുക
  alternative: വാക്യത്തിൽ പ്രത്യേക വിരാമമില്ലാതെ ചേർക്കുക
  rationale: കൃപയെക്കുറിച്ചുള്ള പൗലോസിന്റെ പെട്ടെന്നുള്ള ഇടക്കുചേർക്കൽ വാക്യത്തിന്റെ വാഗ്മിതയും ദൈവശാസ്ത്രപരമായ ഊന്നലും വഹിക്കുന്നു; ദീർഘവരകൾ അത് വികസിപ്പിക്കാതെ സംരക്ഷിക്കുന്നു.
- issue: τοῖς παραπτώμασιν എന്ന ദത്തിവിന്റെ ബന്ധം
  choice: അതിക്രമങ്ങളിൽ
  alternative: അതിക്രമങ്ങൾ നിമിത്തം
  rationale: ഗ്രീക്ക് രൂപം കാരണത്തെയും മേഖലയെയും അനുവദിച്ചേക്കാം; ‘അതിക്രമങ്ങളിൽ’ എന്നത് മേഖലയെന്ന രൂപകം സംരക്ഷിക്കുകയും കാരണം മാത്രമായി അർഥം പരിമിതപ്പെടുത്താതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. പൗലോസിന്റെ ദീർഘവാക്യഘടനയുമായി ബന്ധിപ്പിക്കാൻ വാക്യം അവസാന ദീർഘവരയോടെ നിലനിർത്തി; ദൈവം എന്ന കർത്താവ് മുൻസന്ദർഭത്തിൽനിന്ന് ലഭിക്കുന്നതിനാൽ ഗ്രീക്കുപോലെ ഇവിടെ പേരെടുത്ത് ചേർത്തിട്ടില്ല.
