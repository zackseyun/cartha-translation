  text: having abolished the law of commandments expressed in decrees, so that he might create the two into one new man in himself, making peace,
translation:
  language: ml
  text: ചട്ടങ്ങളിൽ[a] ഉൾക്കൊള്ളപ്പെട്ട കൽപ്പനകളുടെ നിയമത്തെ അവൻ അസാധുവാക്കി; അങ്ങനെ സമാധാനം സ്ഥാപിച്ചുകൊണ്ട്, ആ രണ്ടു കൂട്ടങ്ങളെയും തന്നിൽ[c] ഒരൊറ്റ പുതിയ മനുഷ്യനായി[b] സൃഷ്ടിക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ചട്ടങ്ങളിൽ,” “ചട്ടങ്ങളായി നിലകൊള്ളുന്ന,” അല്ലെങ്കിൽ പരമ്പരാഗതമായി “വിധികളിൽ.”'
    reason: lexical_alternative
  - marker: b
    text: “ഒരൊറ്റ പുതിയ മനുഷ്യൻ” എന്നത് ഏകവചനത്തിലുള്ള ഒരു സമൂഹരൂപകമാണ്; “ഒരൊറ്റ പുതിയ മനുഷ്യസമൂഹം” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: c
    text: 'അഥവാ: “ആ രണ്ടു കൂട്ടങ്ങളെയും ഒരൊറ്റ പുതിയ മനുഷ്യനായി തന്നിൽ സൃഷ്ടിക്കേണ്ടതിന്.”'
    reason: syntactic_alternative
lexical_decisions:
- source_word: νόμον τῶν ἐντολῶν
  choice: കൽപ്പനകളുടെ നിയമം
  rationale: ഗ്രീക്കിലെ ജനിറ്റീവ് ഘടനയും ഉടമ്പടിസംബന്ധമായ ഔപചാരിക ഭാവവും നിലനിർത്തുന്നു.
- source_word: ἐν δόγμασιν
  choice: ചട്ടങ്ങളിൽ പ്രകടമായിരുന്ന രൂപത്തിൽ
  rationale: ἐν എന്നതിന്റെ ബന്ധം കൽപ്പനകളുടെ നിയമത്തോടാണെന്നു വായനാസൗകര്യത്തോടെ വ്യക്തമാക്കുന്നു; ‘ചട്ടങ്ങളിൽ’ എന്ന കൂടുതൽ അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: καταργήσας
  choice: അസാധുവാക്കി
  rationale: καταργέω എന്നതിന്റെ നിർവീര്യമാക്കുക/പ്രാബല്യമില്ലാതാക്കുക എന്ന ശക്തമായ അർഥം നൽകുന്നു; വാക്യത്തിന്റെ പ്രത്യേക കർമ്മത്തെക്കാൾ വ്യാപകമായ ദൈവശാസ്ത്രനിഗമനം ചേർക്കുന്നില്ല.
- source_word: τοὺς δύο
  choice: ആ രണ്ടുപേരെയും
  rationale: സമീപസന്ദർഭത്തിലെ യെഹൂദരും ജാതികളും എന്ന രണ്ടു കൂട്ടങ്ങളെ സൂചിപ്പിക്കുന്ന വ്യക്തമായ സംഖ്യ നിലനിർത്തുന്നു.
- source_word: κτίσῃ
  choice: സൃഷ്ടിക്കേണ്ടതിന്
  rationale: κτίζωയിലെ പുതിയ സൃഷ്ടിയുടെ ഭാവവും ἵναയുടെ ഉദ്ദേശ്യാർഥവും സംരക്ഷിക്കുന്നു.
- source_word: ἐν αὑτῷ
  choice: തന്നിൽ
  rationale: പ്രതിഫലക സർവനാമത്തിന്റെ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: εἰς ἕνα καινὸν ἄνθρωπον
  choice: ഒരൊറ്റ പുതിയ മനുഷ്യനായി
  rationale: ഏകവചനത്തിലുള്ള സമൂഹപ്രതിനിധിയായ മനുഷ്യരൂപകം നിലനിർത്തുന്നു; ‘ഒരു പുതിയ മനുഷ്യസമൂഹമായി’ എന്ന വ്യാഖ്യാനപരമായ വിവർത്തനം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: ποιῶν εἰρήνην
  choice: സമാധാനം സ്ഥാപിച്ചുകൊണ്ട്
  rationale: സമാധാനം ഉളവാക്കുന്ന പ്രവർത്തിയെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ἄνθρωπον എന്ന ഏകവചന സമൂഹരൂപകം
  choice: ഒരൊറ്റ പുതിയ മനുഷ്യൻ
  alternative: ഒരൊറ്റ പുതിയ മനുഷ്യസമൂഹം
  rationale: യെഹൂദരെയും ജാതികളെയും ഒരുമിപ്പിക്കുന്ന സമൂഹാർഥം സന്ദർഭത്തിൽ വ്യക്തമാണെങ്കിലും, മുഖ്യപാഠം ഗ്രീക്കിലെ ഏകവചന മനുഷ്യരൂപകവും അതിലെ ദൈവശാസ്ത്രപരമായ പ്രതിധ്വനികളും തുറന്ന നിലയിൽ സൂക്ഷിക്കുന്നു.
- issue: καταργήσας എന്നതിന്റെ ശക്തിയും പരിധിയും
  choice: അസാധുവാക്കി
  alternative: ഇല്ലാതാക്കി
  rationale: പൗലോസിന്റെ ശക്തമായ പ്രയോഗം നിലനിർത്തുമ്പോഴും, പ്രത്യേകമായി പറഞ്ഞിരിക്കുന്ന ‘കൽപ്പനകളുടെ നിയമം...ചട്ടങ്ങളിൽ’ എന്ന കർമ്മത്തിനപ്പുറം സമസ്ത ദൈവഹിതവും ഇല്ലാതായി എന്ന നിഗമനം ഭാഷയിൽ ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: ἐν αὑτῷ എന്നതിന്റെ ഘടനാബന്ധം
  choice: ആ രണ്ടുപേരെയും തന്നിൽ ഒരൊറ്റ പുതിയ മനുഷ്യനായി സൃഷ്ടിക്കുക
  alternative: ആ രണ്ടുപേരെയും ഒരൊറ്റ പുതിയ മനുഷ്യനായി സൃഷ്ടിക്കുക—തന്നിൽ
  rationale: ഗ്രീക്ക് പദക്രമവും മശിഹായിൽ നടക്കുന്ന ഐക്യസൃഷ്ടിയും മുൻനിർത്തുന്നു; മറ്റൊരു സാധ്യമായ ഘടനാബന്ധം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും പൊതുവായ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ഗ്രീക്ക് വാക്യഘടനയിലെ സാന്ദ്രത സ്വാഭാവികമാക്കുമ്പോഴും സമൂഹരൂപകവും ‘തന്നിൽ’ എന്ന ഘടനാപരമായ അനിശ്ചിതത്വവും സംരക്ഷിച്ചു.
