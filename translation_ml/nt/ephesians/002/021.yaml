id: EPH.2.21
reference: Ephesians 2:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν ᾧ ⸀πᾶσα οἰκοδομὴ συναρμολογουμένη αὔξει εἰς ναὸν ἅγιον ἐν κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/021.yaml
  text: in whom the whole building[a], being fitted together, grows into a holy temple in the Lord,
translation:
  language: ml
  text: അവനിൽ മുഴുവൻ കെട്ടിടവും[a] ഒത്തുചേർക്കപ്പെട്ടുകൊണ്ട്, കർത്താവിൽ ഒരു വിശുദ്ധമന്ദിരമായി വളരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഓരോ കെട്ടിടവും.” ഗ്രീക്ക് പ്രയോഗം ഓരോന്നായി സൂചിപ്പിക്കുന്ന രീതിയിലും ഒരു സമഗ്രഘടനയെ സൂചിപ്പിക്കുന്ന രീതിയിലും വായിക്കാം; സന്ദർഭത്തിലെ ഏകീകൃത മന്ദിരരൂപകത്തെ പിന്തുടർന്നാണ് മുഖ്യപാഠം നൽകിയിരിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: അവനിൽ
  rationale: മുൻസന്ദർഭത്തിലെ വ്യക്തിപരമായ മുൻപദമായ മശീഹയായ യേശുവിലേക്കാണ് ബന്ധസർവനാമം സ്വാഭാവികമായി ചൂണ്ടുന്നത്; അതിനാൽ ക്രിസ്തുവിലുള്ള ബന്ധം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: πᾶσα οἰκοδομὴ
  choice: കെട്ടിടം മുഴുവനും
  rationale: നിർണ്ണയോപപദമില്ലാത്ത ഈ ഏകവചന ഗ്രീക്ക് പ്രയോഗത്തിന് ‘ഓരോ കെട്ടിടവും’ എന്നും ‘കെട്ടിടം മുഴുവനും’ എന്നും അർഥമാകാം. യെഹൂദരും ജാതികളും ചേർന്ന ഏക മന്ദിരമെന്ന സന്ദർഭരൂപകം മുൻനിർത്തി സമഗ്രമായ അർഥം മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു.
- source_word: συναρμολογουμένη
  choice: യോജിച്ചുചേർക്കപ്പെട്ട്
  rationale: വിവിധ ഭാഗങ്ങൾ പരസ്പരം ഒത്തുചേർത്ത് ഏകീകൃത ഘടനയാക്കപ്പെടുന്ന തുടർച്ചയായ കർമണി പ്രക്രിയയും വാസ്തുശില്പരൂപകവും ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: αὔξει
  choice: വളരുന്നു
  rationale: വർത്തമാനകാലത്തിലെ തുടർച്ചയായ വികാസം നേരിട്ട് പ്രകടിപ്പിക്കുകയും കെട്ടിടത്തോടൊപ്പം ജൈവവളർച്ചയുടെ സമ്മിശ്രരൂപകം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: εἰς
  choice: ആയി
  rationale: വളർച്ചയുടെ ലക്ഷ്യമോ ഫലമോ സൂചിപ്പിക്കുന്ന εἰς എന്നതിന്റെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ ‘ഒരു വിശുദ്ധമന്ദിരമായി’ എന്നു നൽകി.
- source_word: ναὸν ἅγιον
  choice: ഒരു വിശുദ്ധമന്ദിരം
  rationale: ναός വിശാലമായ ആലയപരിസരത്തേക്കാൾ വിശുദ്ധമന്ദിരത്തെ സൂചിപ്പിക്കുന്നു; ‘വിശുദ്ധമന്ദിരം’ അതിന്റെ വിശുദ്ധിയും ആരാധനാകേന്ദ്രസ്വഭാവവും വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: ἐν κυρίῳ
  choice: കർത്താവിൽ
  rationale: ബന്ധത്തിന്റെയോ മണ്ഡലത്തിന്റെയോ അർഥം നിർബന്ധമായി ഒന്നിലേക്ക് ചുരുക്കാതെ പൗലോസിന്റെ വിശാലമായ ദൈവശാസ്ത്രപ്രയോഗം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ᾧ എന്ന ബന്ധസർവനാമം ക്രിസ്തുവിനെയാണോ അതോ കെട്ടിടരൂപകത്തെയാണോ സൂചിപ്പിക്കുന്നത്
  choice: ക്രിസ്തുവിനെ വ്യക്തിപരമായി സൂചിപ്പിക്കുന്ന ‘അവനിൽ’
  alternative: കെട്ടിടത്തെയോ മൂലക്കല്ലിന്റെ രൂപകത്തെയോ സൂചിപ്പിക്കുന്ന ‘അതിൽ’
  rationale: മുൻവാക്യത്തിലെ ‘മശീഹയായ യേശു തന്നെയാണ് മൂലക്കല്ല്’ എന്ന വ്യക്തിപരമായ പരാമർശവും ഈ ഭാഗത്തെ ആവർത്തിതമായ ‘അവനിൽ’ ഭാഷയും ക്രിസ്തുവിലേക്കുള്ള സൂചനയെ പിന്തുണയ്ക്കുന്നു.
- issue: πᾶσα οἰκοδομὴ വിതരണാർഥത്തിലാണോ സമഗ്രാർഥത്തിലാണോ വായിക്കേണ്ടത്
  choice: 'ഏകീകൃതമായ സമഗ്രാർഥം: ‘കെട്ടിടം മുഴുവനും’'
  alternative: 'വിതരണാർഥം: ‘ഓരോ കെട്ടിടവും’'
  rationale: 2:14–22-ൽ യെഹൂദരും ജാതികളും ചേർന്ന് ഒരൊറ്റ പുതിയ മനുഷ്യനും ദൈവത്തിന്റെ ഒരൊറ്റ വാസസ്ഥാനവുമായി തീരുന്ന ഐക്യം ഊന്നപ്പെടുന്നു. എങ്കിലും ഗ്രീക്ക് വ്യാകരണം അനുവദിക്കുന്ന മറുവായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കെട്ടിടം—മന്ദിരം—വളരുന്നു’ എന്ന മൂലപാഠത്തിലെ സമ്മിശ്രരൂപകം ലളിതമാക്കാതെ നിലനിർത്തിയിരിക്കുന്നു; ജീവിച്ചിരിക്കുന്ന വ്യാകരണപരമായ മറുവായന അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
