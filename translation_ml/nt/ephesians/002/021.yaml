  to: അവനിൽ മുഴുവൻ കെട്ടിടവും[a] ഒത്തുചേർക്കപ്പെട്ടുകൊണ്ട്, കർത്താവിൽ ഒരു വിശുദ്ധമന്ദിരമായി വളരുന്നു.
