  text: ἐν ᾧ καὶ ὑμεῖς συνοικοδομεῖσθε εἰς κατοικητήριον τοῦ θεοῦ ἐν πνεύματι.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/022.yaml
  text: in whom you also are being built together into a dwelling place for God in the Spirit[a][b].
translation:
  language: ml
  text: അവനിൽ നിങ്ങളും ദൈവത്തിന്റെ വാസസ്ഥലമായി ആത്മാവിൽ ഒരുമിച്ചു പണിയപ്പെടുന്നു[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അതിൽ’; ബന്ധസർവനാമം ക്രിസ്തുവിനെ നേരിട്ട് സൂചിപ്പിക്കുന്നതിനു പകരം മുഴുവൻ കെട്ടിടത്തെ സൂചിപ്പിക്കുന്നതായി എടുക്കാം.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, ‘ആത്മാവിനാൽ’ അല്ലെങ്കിൽ ‘ആത്മിക മണ്ഡലത്തിൽ.’ ഈ പ്രയോഗം ദൈവം വസിക്കുന്ന മണ്ഡലത്തെയോ പരിശുദ്ധാത്മാവിന്റെ പ്രവർത്തനത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: അവനിൽ
  rationale: അടുത്തുള്ള വ്യക്തിപരമായ പൂർവപദമായ ക്രിസ്തുവിനെയാണ് സന്ദർഭത്തിൽ ഇത് ഏറ്റവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്. എങ്കിലും മുഴുവൻ കെട്ടിടത്തെ സൂചിപ്പിക്കുന്നതായി എടുക്കാനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: καὶ ὑμεῖς
  choice: നിങ്ങളും
  rationale: καίയുടെ കൂട്ടിച്ചേർക്കൽഭാവവും ഊന്നിപ്പറഞ്ഞിരിക്കുന്ന ബഹുവചന സർവനാമവും സ്വാഭാവികമായ മലയാളത്തിൽ ഒരുമിച്ചു പ്രകടമാക്കുന്നു.
- source_word: συνοικοδομεῖσθε
  choice: ഒരുമിച്ചു പണിയപ്പെട്ടുകൊണ്ടിരിക്കുന്നു
  rationale: വർത്തമാനകാല കർമണിപ്രയോഗത്തിലെ തുടരുന്ന പ്രവർത്തനവും σύν എന്ന ഉപസർഗത്തിന്റെ ‘ഒരുമിച്ച്’ എന്ന ആശയവും സംരക്ഷിക്കുന്നു.
- source_word: εἰς κατοικητήριον τοῦ θεοῦ
  choice: ദൈവത്തിനു വസിക്കാനുള്ള ഒരു ആലയമായി
  rationale: εἰς സൂചിപ്പിക്കുന്ന ലക്ഷ്യവും ഫലവും ‘ആയി’ എന്ന പ്രയോഗത്തിലൂടെ നൽകുന്നു. κατοικητήριον എന്നത് ദൈവം വസിക്കുന്ന ഇടമാണെന്ന് വ്യക്തമാക്കുകയും സന്ദർഭത്തിലെ ദേവാലയരൂപകം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐν πνεύματι
  choice: ആത്മാവിൽ
  rationale: പൗലോസിന്റെ ദേവാലയ-വാസഭാഷയിൽ പരിശുദ്ധാത്മാവാണ് ഏറ്റവും സാധ്യതയുള്ള സൂചന. ἐν എന്നതിലെ മണ്ഡലം/മാധ്യമം എന്ന രണ്ടർഥസാധ്യത അമിതമായി തീർപ്പാക്കാതെ ‘ആത്മാവിൽ’ എന്നു നൽകുന്നു.
theological_decisions:
- issue: ἐν ᾧ എന്നതിന്റെ പൂർവപദം
  choice: ക്രിസ്തുവിനെ സൂചിപ്പിക്കുന്ന ‘അവനിൽ’
  alternative: മുഴുവൻ കെട്ടിടത്തെ സൂചിപ്പിക്കുന്ന ‘അതിൽ’
  rationale: മുൻവാക്യത്തിലെ ‘അവനിൽ’ എന്ന ക്രിസ്തുകേന്ദ്രിത പ്രവാഹവും അടുത്തുള്ള വ്യക്തിപരമായ സൂചനയും ‘അവനിൽ’ എന്ന വായനയെ പിന്തുണയ്ക്കുന്നു; യഥാർഥ വ്യാകരണ-സന്ദർഭ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: ἐν πνεύματι എന്നതിന്റെ അർഥം
  choice: പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്ന ‘ആത്മാവിൽ’
  alternative: ‘ആത്മീയമായി’ അല്ലെങ്കിൽ ‘ആത്മാവിനാൽ’
  rationale: എഫെസ്യരിലെ ദൈവവാസവും ദേവാലയവും സംബന്ധിച്ച സന്ദർഭം പരിശുദ്ധാത്മാവിന്റെ സാന്നിധ്യത്തെ ശക്തമായി സൂചിപ്പിക്കുന്നു. അതേസമയം ἐν എന്നതിന്റെ മണ്ഡലപരവും കാരണപരവുമായ ഭാവങ്ങൾ അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വായനാസൗകര്യവും നിലനിർത്തി. ‘ആലയം’ എന്നത് മുൻസന്ദർഭത്തിലെ വിശുദ്ധ ദേവാലയരൂപകം സ്വാഭാവികമായി തുടരുന്നു; തുടരുന്ന കർമണിപ്രവർത്തനം ‘പണിയപ്പെട്ടുകൊണ്ടിരിക്കുന്നു’ എന്ന രൂപത്തിൽ സംരക്ഷിച്ചു.
