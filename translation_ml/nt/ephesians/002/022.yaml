revisions:
- from: അവനിൽ നിങ്ങളും ദൈവത്തിനു വസിക്കാനുള്ള ഒരു ആലയമായി ആത്മാവിൽ ഒരുമിച്ചു പണിയപ്പെട്ടുകൊണ്ടിരിക്കുന്നു[a][b].
  to: അവനിൽ നിങ്ങളും ദൈവത്തിന്റെ വാസസ്ഥലമായി ആത്മാവിൽ ഒരുമിച്ചു പണിയപ്പെടുന്നു[a][b].
  rationale: The revision replaces the overly specific and less idiomatic ‘ദൈവത്തിനു വസിക്കാനുള്ള ഒരു ആലയമായി’ with ‘ദൈവത്തിന്റെ വാസസ്ഥലമായി,’ which directly reflects κατοικητήριον τοῦ θεοῦ. It also smooths the present passive construction and refines the Spirit footnote to preserve the Greek phrase’s unresolved semantic range.
