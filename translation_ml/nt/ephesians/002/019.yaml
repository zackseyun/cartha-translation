id: EPH.2.19
reference: Ephesians 2:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἄρα οὖν οὐκέτι ἐστὲ ξένοι καὶ πάροικοι, ἀλλὰ ⸀ἐστὲ συμπολῖται τῶν ἁγίων καὶ οἰκεῖοι τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/019.yaml
  text: So then[a], you are no longer strangers and resident foreigners, but you are fellow citizens with the saints and members of God's household[c][b],
translation:
  language: ml
  text: അതുകൊണ്ട്, നിങ്ങൾ ഇനി അന്യരും പൂർണ പൗരാവകാശമില്ലാത്ത വിദേശതാമസക്കാരും[a] അല്ല; വിശുദ്ധരോടൊത്തുള്ള സഹപൗരന്മാരും[b] ദൈവത്തിന്റെ കുടുംബാംഗങ്ങളുമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പരദേശവാസികൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഗ്രീക്കുപദം ഒരു സ്ഥലത്ത് താമസിക്കുന്നവരായിട്ടും പൂർണ പൗരപദവി ഇല്ലാത്തവരെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘വിശുദ്ധരുടെ സഹപൗരന്മാർ’ എന്നും പരിഭാഷപ്പെടുത്താം. വിശുദ്ധജനത്തോടൊപ്പം ഒരേ പൗരത്വത്തിൽ പങ്കുചേരുന്നതാണ് ആശയം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവിവരണത്തിൽനിന്നുള്ള ശക്തമായ നിഗമനം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: οὐκέτι
  choice: ഇനി ... അല്ല
  rationale: മുമ്പുണ്ടായിരുന്ന നില അവസാനിച്ചുവെന്ന കാലപരമായ നിഷേധം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ξένοι
  choice: അന്യർ
  rationale: ഒരു സമൂഹത്തിൽ ഉൾപ്പെടാത്തവരെന്ന ആശയം നിലനിർത്തുകയും തുടർന്നുള്ള കുടുംബരൂപകത്തോട് യോജിക്കുകയും ചെയ്യുന്നു.
- source_word: πάροικοι
  choice: പൗരാവകാശമില്ലാതെ താമസിക്കുന്ന വിദേശികൾ
  rationale: ഒരു സ്ഥലത്ത് താമസിക്കുന്നവരായിട്ടും പൂർണ പൗരപദവി ഇല്ലാത്തവരെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ സാമൂഹിക-നിയമപരമായ ഭാവം വ്യക്തമാക്കുന്നു.
- source_word: συμπολῖται
  choice: സഹപൗരന്മാർ
  rationale: പങ്കിടുന്ന പൗരത്വത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് സംയുക്തപദത്തിന് സംക്ഷിപ്തവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: τῶν ἁγίων
  choice: വിശുദ്ധരോടൊപ്പം
  rationale: ഷഷ്ഠീവാക്യബന്ധത്തെ പങ്കാളിത്തമായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; ആരെയാണ് കൃത്യമായി ഉദ്ദേശിക്കുന്നതെന്ന വ്യാഖ്യാനപരമായ വിശാലത നിലനിർത്തുന്നു.
- source_word: οἰκεῖοι
  choice: കുടുംബാംഗങ്ങൾ
  rationale: ഒരു ഭവനത്തിനോ കുടുംബത്തിനോ ഉള്ളവരെന്ന ബന്ധപരമായ രൂപകം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ
  rationale: ഉടമസ്ഥതയും ബന്ധവും മലയാളത്തിലെ സ്വാഭാവിക ഷഷ്ഠീരൂപത്തിൽ പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: τῶν ἁγίων എന്നതിന്റെ സൂചിതർ
  choice: പ്രധാനപാഠത്തിൽ ‘വിശുദ്ധർ’ എന്ന വിശാലമായ ബൈബിൾപദം നിലനിർത്തി
  alternative: ദൂതന്മാർ; യഹൂദവിശ്വാസികൾ മാത്രം; എല്ലാ വിശ്വാസികളും
  rationale: സന്ദർഭം ജാതികൾ ദൈവജനത്തിൽ ഉൾക്കൊള്ളപ്പെടുന്നതിനെക്കുറിച്ചാണെങ്കിലും, സൂചിതരുടെ പരിധി വിവർത്തനത്തിൽ അനാവശ്യമായി ചുരുക്കാതെ മൂലപാഠത്തിലെ വ്യാഖ്യാനസാധ്യത നിലനിർത്തുന്നു.
- issue: συμπολῖται τῶν ἁγίων എന്ന ബന്ധം
  choice: ‘വിശുദ്ധരോടൊപ്പം സഹപൗരന്മാർ’
  alternative: ‘വിശുദ്ധരുടെ സഹപൗരന്മാർ’
  rationale: ഇരുവിധവും ഗ്രീക്ക് ഷഷ്ഠീബന്ധത്തെ പ്രതിഫലിപ്പിക്കാം; പ്രധാനപാഠം പങ്കിട്ട പൗരത്വം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു, മറ്റൊരു രൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. പൗരത്വവും കുടുംബാംഗത്വവും എന്ന രണ്ടു മുഖ്യരൂപകങ്ങളും നിലനിർത്തിയിരിക്കുന്നു; ‘പൗരാവകാശമില്ലാതെ താമസിക്കുന്ന’ എന്ന വിശദീകരണം πάροικοι എന്ന പദത്തിന്റെ പുരാതന സാമൂഹിക-നിയമപരമായ ഭാവം വ്യക്തമാക്കുന്നു.
