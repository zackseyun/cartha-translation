source:
  edition: SBLGNT
  text: Διὸ μνημονεύετε ὅτι ⸂ποτὲ ὑμεῖς⸃ τὰ ἔθνη ἐν σαρκί, οἱ λεγόμενοι ἀκροβυστία ὑπὸ τῆς λεγομένης περιτομῆς ἐν σαρκὶ χειροποιήτου,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/011.yaml
  text: Therefore remember that formerly you[a], the Gentiles in the flesh[d][c][b], who are called “uncircumcision” by what is called “circumcision,” made by hands in the flesh—
translation:
  language: ml
  text: അതുകൊണ്ട്, ഒരിക്കൽ നിങ്ങൾ ശരീരപരമായി യഹൂദേതരരായിരുന്നു[a] എന്നും, ശരീരത്തിൽ മനുഷ്യകൈകളാൽ ചെയ്യപ്പെട്ട “പരിച്ഛേദനം” എന്നു വിളിക്കപ്പെടുന്നവരാൽ[c] “അപരിച്ഛേദനം” എന്നു വിളിക്കപ്പെട്ടിരുന്നു[b] എന്നും ഓർക്കുക—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഒരിക്കൽ ജഡത്തിൽ ജനതകളായിരുന്ന നിങ്ങൾ.” ഇവിടെ “ജനതകൾ” എന്നത് യഹൂദരല്ലാത്തവരെ സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിൽ “നിങ്ങൾ” എന്നതിന് ഊന്നലുണ്ട്.'
    reason: lexical_alternative
  - marker: b
    text: “പരിച്ഛേദനം”, “അപരിച്ഛേദനം” എന്നിവ ഇവിടെ കേവലം ശരീരാവസ്ഥകളല്ല; ഉടമ്പടി-വംശീയ കൂട്ടപ്പേരുകളുമാണ്.
    reason: cultural_note
  - marker: c
    text: 'അഥവാ: “ശരീരത്തിൽ മനുഷ്യകൈകളാൽ ചെയ്യപ്പെട്ട ‘പരിച്ഛേദനം’ എന്നു പറയപ്പെടുന്നവരാൽ.” പൗലോസിന്റെ വാക്കുകളിൽ കേവലം ബാഹ്യമായ പരിച്ഛേദനത്തോടുള്ള വിമർശനത്തിന്റെ സൂചന ഉണ്ടായേക്കാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: Διὸ
  choice: അതുകൊണ്ട്
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനാത്മകമായ മാറ്റം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: μνημονεύετε
  choice: ഓർക്കുക
  rationale: വർത്തമാനകാല ബഹുവചന ആജ്ഞയുടെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളരൂപം.
- source_word: ποτὲ ὑμεῖς
  choice: ഒരിക്കൽ ... നിങ്ങളെ
  rationale: മുൻകാലാവസ്ഥയോടുള്ള വ്യത്യാസവും ὑμεῖς എന്നതിലെ ഊന്നലും വാക്യഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: τὰ ἔθνη
  choice: ജനതകളായിരുന്ന
  rationale: യഹൂദരല്ലാത്തവരെ സൂചിപ്പിക്കുന്ന പൗലോസിന്റെ പ്രയോഗമാണ്; 'ജാതികൾ' എന്ന പദത്തിന്റെ ജാതിവ്യവസ്ഥാസംബന്ധിയായ ആധുനിക അനിശ്ചിതത്വം ഒഴിവാക്കുന്നു.
- source_word: ἐν σαρκί
  choice: ജഡപ്രകാരം
  rationale: ഇവിടെ ധാർമ്മികമായ പാപസ്വഭാവമല്ല, ദേഹപരവും വംശീയ-സാമൂഹികവുമായ നിലയാണ് സൂചിപ്പിക്കുന്നത്; σάρξ എന്ന പദബന്ധം നിലനിർത്തുന്നു.
- source_word: οἱ λεγόμενοι ἀκροβυστία
  choice: “അപരിച്ഛേദനം” എന്നു വിളിച്ചിരുന്ന
  rationale: സാമൂഹികമായി ചാർത്തപ്പെട്ട ഉടമ്പടി-വംശീയ വിശേഷണം എന്ന ആശയവും കർത്തരിപ്രയോഗമല്ലാത്ത ഗ്രീക്ക് രൂപവും നിലനിർത്തുന്നു.
- source_word: ὑπὸ τῆς λεγομένης περιτομῆς
  choice: “പരിച്ഛേദനം” എന്നു വിളിക്കപ്പെടുന്നവർ
  rationale: രണ്ടു കൂട്ടങ്ങളെയും സംബന്ധിച്ച λεγόμενοι/λεγομένης എന്ന ആവർത്തനത്തിലെ വാചകസമത്വവും വിമർശനാത്മക അകലവും നിലനിർത്തുന്നു; അമൂർത്തനാമം കൂട്ടത്തെ പ്രതിനിധീകരിക്കുന്നതായി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐν σαρκὶ χειροποιήτου
  choice: ജഡത്തിൽ കൈകൊണ്ടു ചെയ്ത
  rationale: χειροποίητος എന്നതിന്റെ മനുഷ്യകൈകളാൽ നിർവഹിക്കപ്പെട്ട ബാഹ്യക്രിയ എന്ന അർഥം പരിച്ഛേദനത്തോടു ചേർത്ത് വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: ധാർമ്മികമല്ലാത്ത സന്ദർഭത്തിലെ σάρξ
  choice: ജഡപ്രകാരം / ജഡത്തിൽ
  alternative: ശരീരപ്രകാരം / ശരീരത്തിൽ
  rationale: ദേഹപരവും ഉടമ്പടി-വംശീയവുമായ നിലയാണ് ഇവിടെ വിഷയം; പാപസ്വഭാവം എന്ന വ്യാഖ്യാനം ചേർക്കാതെ ഉറവിടത്തിന്റെ പദബന്ധവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും സംരക്ഷിക്കുന്നു.
- issue: περιτομή, ἀκροβυστία എന്നീ നാമങ്ങളുടെ കൂട്ടവിശേഷണപ്രയോഗം
  choice: “പരിച്ഛേദനം”, “അപരിച്ഛേദനം”
  alternative: പരിച്ഛേദിതർ, അപരിച്ഛേദിതർ
  rationale: ഇവ കേവലം ശരീരഘടനാവിവരണങ്ങളല്ല, ഉടമ്പടി-വംശീയ കൂട്ടപ്പേരുകളാണെന്ന ഗ്രീക്ക് രൂപവും പൗലോസിന്റെ വാചകസമത്വവും നിലനിർത്തുന്നു.
- issue: λεγομένης എന്നതിന്റെ ഭാവം
  choice: എന്നു വിളിക്കപ്പെടുന്നവർ
  alternative: പരിച്ഛേദനം എന്നു പറയപ്പെടുന്നവർ / പരിച്ഛേദിതർ എന്നു വിളിക്കപ്പെടുന്നവർ
  rationale: പൗലോസ് ബാഹ്യമായ അടയാളത്തെ പൂർണമായി നിരസിക്കുന്നുവെന്ന് അതിശക്തമായി വ്യാഖ്യാനിക്കാതെ, പേരിനോടുള്ള അദ്ദേഹത്തിന്റെ സൂക്ഷ്മമായ അകലം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. “ജാതികൾ” എന്നതിന്റെ സാമൂഹിക അനിശ്ചിതത്വം ഒഴിവാക്കാൻ “ജനതകൾ” ഉപയോഗിച്ചു. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനം ദീർഘരേഖ നിലനിർത്തി.
