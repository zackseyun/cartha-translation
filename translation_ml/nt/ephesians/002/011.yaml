revisions:
- from: അതുകൊണ്ട്, ഒരിക്കൽ ജഡപ്രകാരം ജനതകളായിരുന്ന നിങ്ങളെ[a] ജഡത്തിൽ കൈകൊണ്ടു ചെയ്ത, “പരിച്ഛേദനം” എന്നു വിളിക്കപ്പെടുന്നവർ “അപരിച്ഛേദനം” എന്നു വിളിച്ചിരുന്നുവെന്നു ഓർക്കുക[b][c]—
