revisions:
- from: അവയിൽ നിങ്ങൾ ഒരിക്കൽ ജീവിച്ചിരുന്നത് ഈ ലോകത്തിന്റെ യുഗത്തിന്[a] അനുസരിച്ചും വായുമണ്ഡലത്തിന്മേലുള്ള അധികാരത്തിന്റെ അധിപന്[b] അനുസരിച്ചുമായിരുന്നു—അനുസരണക്കേടിന്റെ പുത്രന്മാരിൽ[c] ഇപ്പോൾ പ്രവർത്തിക്കുന്ന ആത്മാവിന് അനുസരിച്ച്.
  to: അവയിൽ നിങ്ങൾ ഒരിക്കൽ ജീവിച്ചിരുന്നത് ഈ ലോകത്തിന്റെ യുഗത്തിന്[a] അനുസരിച്ചും വായുമണ്ഡലത്തിന്റെ അധികാരത്തിന്റെ അധിപന്[b] അനുസരിച്ചുമായിരുന്നു—അനുസരണക്കേടിന്റെ പുത്രന്മാരിൽ[c] ഇപ്പോൾ പ്രവർത്തിക്കുന്ന ആത്മാവ്.
  rationale: The revision removes the added third ‘according to’ relation and presents ‘the spirit now at work’ as an appositional/descriptive continuation of the preceding ruler expression, as permitted by the Greek and reflected in the English audit trail. It also changes ‘authority over the air’ to ‘authority of the air,’ avoiding a reversal of the genitive relationship. Footnote anchors and content remain appropriate.
