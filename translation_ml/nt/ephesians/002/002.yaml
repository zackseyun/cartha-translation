reference: Ephesians 2:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν αἷς ποτε περιεπατήσατε κατὰ τὸν αἰῶνα τοῦ κόσμου τούτου, κατὰ τὸν ἄρχοντα τῆς ἐξουσίας τοῦ ἀέρος, τοῦ πνεύματος τοῦ νῦν ἐνεργοῦντος ἐν τοῖς υἱοῖς τῆς ἀπειθείας·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/002.yaml
  text: in which you once walked[a], according to the age of this world, according to the ruler of the authority of the air[c][b], the spirit now at work in the sons of disobedience.
translation:
  language: ml
  text: അവയിൽ നിങ്ങൾ ഒരിക്കൽ ജീവിച്ചിരുന്നത് ഈ ലോകത്തിന്റെ യുഗത്തിന്[a] അനുസരിച്ചും വായുമണ്ഡലത്തിന്റെ അധികാരത്തിന്റെ അധിപന്[b] അനുസരിച്ചുമായിരുന്നു—അനുസരണക്കേടിന്റെ പുത്രന്മാരിൽ[c] ഇപ്പോൾ പ്രവർത്തിക്കുന്ന ആത്മാവ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഈ ലോകത്തിന്റെ ഗതിക്ക് അനുസരിച്ച്’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്കിലെ αἰών എന്ന പദം ഇപ്പോഴത്തെ ലോകയുഗത്തെയോ അതിന്റെ പ്രബലമായ ജീവിതക്രമത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘വായുമണ്ഡലം’ എന്നത് ശത്രുതാപരമായ ആത്മീയ ശക്തികളുമായി ബന്ധപ്പെടുത്തിയിരുന്ന മേഖലയെക്കുറിച്ചുള്ള പുരാതന പ്രപഞ്ചധാരണയെ പ്രതിഫലിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: c
    text: ‘അനുസരണക്കേടിന്റെ മക്കൾ’ എന്നും പറയാം; അനുസരണക്കേട് സ്വഭാവമാക്കിയ ആളുകളെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν αἷς ποτε περιεπατήσατε
  choice: അവയിൽ നിങ്ങൾ ഒരിക്കൽ ജീവിച്ചിരുന്നത്
  rationale: മുൻവാക്യത്തിലെ ‘അതിക്രമങ്ങളും പാപങ്ങളും’ എന്നതിലേക്കുള്ള ബന്ധം ‘അവയിൽ’ നിലനിർത്തുന്നു. περιπατέωയിലെ ജീവിതനടപ്പിന്റെ രൂപകം മലയാളത്തിൽ ‘നടന്നു’ എന്നു പറഞ്ഞാൽ അസ്വാഭാവികമാകുന്നതിനാൽ അതിന്റെ ആശയം സ്വാഭാവികമായി ‘ജീവിച്ചിരുന്നത്’ എന്നു നൽകി.
- source_word: κατὰ τὸν αἰῶνα τοῦ κόσμου τούτου
  choice: ഈ ലോകത്തിന്റെ യുഗത്തിന് അനുസരിച്ച്
  rationale: αἰών എന്ന ‘യുഗം’ κόσμος എന്ന ‘ലോകം’ എന്നിവ തമ്മിലുള്ള വ്യത്യാസം നിലനിർത്തുകയും κατά സൂചിപ്പിക്കുന്ന അനുരൂപത വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: τὸν ἄρχοντα τῆς ἐξουσίας τοῦ ἀέρος
  choice: വായുമണ്ഡലത്തിന്മേലുള്ള അധികാരത്തിന്റെ അധിപൻ
  rationale: ἄρχων എന്നതിന് ആധുനികവും ഗൗരവമുള്ളതുമായ ‘അധിപൻ’ ഉപയോഗിച്ചു. സങ്കീർണമായ ജനിറ്റീവ് ബന്ധം വായുവുമായി ബന്ധപ്പെട്ട അധികാരമേഖലയുടെ അധിപൻ എന്ന സ്വാഭാവിക മലയാളരൂപത്തിൽ നൽകി; പുരാതന പ്രപഞ്ചധാരണ അടിക്കുറിപ്പിൽ വിശദീകരിക്കുന്നു.
- source_word: τοῦ πνεύματος τοῦ νῦν ἐνεργοῦντος
  choice: ഇപ്പോൾ പ്രവർത്തിക്കുന്ന ആത്മാവ്
  rationale: തുടർച്ചയായ വർത്തമാന പ്രവർത്തനം നിലനിർത്തുന്നു. സന്ദർഭം പരിശുദ്ധാത്മാവിനെയല്ല, ശത്രുതാപരമായ ആത്മീയ സ്വാധീനത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ സാധാരണ അക്ഷരരൂപത്തിലുള്ള ‘ആത്മാവ്’ യോജിക്കുന്നു.
- source_word: ἐν τοῖς υἱοῖς τῆς ἀπειθείας
  choice: അനുസരണക്കേടിന്റെ പുത്രന്മാരിൽ
  rationale: υἱοί എന്ന പുരുഷലിംഗരൂപവും സെമിറ്റിക് ശൈലിയിലുള്ള സ്വഭാവസൂചക പ്രയോഗവും നിലനിർത്തുന്നു; അതിന്റെ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ‘ഇപ്പോൾ പ്രവർത്തിക്കുന്ന ആത്മാവ്’ എന്നതും വായുമണ്ഡലത്തിന്മേലുള്ള അധികാരത്തിന്റെ അധിപനും തമ്മിലുള്ള ബന്ധം
  choice: ഡാഷും ‘അനുസരിച്ച്’ എന്ന ആവർത്തനവും ഉപയോഗിച്ച് ‘ആത്മാവ്’ മുമ്പുള്ള അധിപനെ കൂടുതൽ വിവരിക്കുന്ന സമാനാധികരണ പ്രയോഗമായി അവതരിപ്പിച്ചു.
  alternative: ഇത് അധിപനിൽനിന്നു വേറിട്ട ഒരു ആത്മീയ ശക്തിയാണെന്ന് വ്യക്തമായി വ്യാഖ്യാനിക്കുക.
  rationale: ഗ്രീക്ക് ജനിറ്റീവ് ശൃംഖല സമാനാധികരണബന്ധം അനുവദിക്കുന്നുവെങ്കിലും ആത്മാവ് സാത്താൻ തന്നെയോ അവന്റെ കീഴിലുള്ള ശക്തിയോ എന്ന് വാക്യം നിർണയിക്കുന്നില്ല; അതിനാൽ ആ അനിശ്ചിതത്വം നിലനിർത്തി.
- issue: υἱοῖς എന്നതിന്റെ വിവർത്തനം
  choice: ‘അനുസരണക്കേടിന്റെ പുത്രന്മാർ’ എന്നു മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
  alternative: ‘അനുസരണക്കേടുള്ളവർ’ അല്ലെങ്കിൽ ‘അനുസരണക്കേടിന്റെ മക്കൾ’.
  rationale: മൂലത്തിലെ പുരുഷലിംഗ പദവും സ്വഭാവത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രായശൈലിയും സംരക്ഷിച്ചു; ഉൾപ്പെടുന്ന ആളുകളെക്കുറിച്ചുള്ള അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. മൂലത്തിലെ ദീർഘമായ ഘടനയും ആവർത്തിച്ച κατά-ബന്ധവും കഴിയുന്നത്ര നിലനിർത്തിയപ്പോൾ, വ്യക്തതയ്ക്കായി ഡാഷ് ഉപയോഗിച്ചു.
