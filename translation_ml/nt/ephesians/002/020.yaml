theological_decisions:
- issue: ‘അപ്പൊസ്തലന്മാരുടെയും പ്രവാചകന്മാരുടെയും അടിത്തറ’ എന്നതിന്റെ ബന്ധം
  choice: ബന്ധിവിഭക്തിയുടെ വിശാലത നിലനിർത്തി; അവരുടെ സാക്ഷ്യവുമായി ബന്ധപ്പെട്ട അടിത്തറ, അവർ ഇട്ട അടിത്തറ, അല്ലെങ്കിൽ അവർ ഉൾപ്പെടുന്ന അടിത്തറ എന്നീ സാധ്യതകളിൽ ഒന്നും മുഖ്യവാചകത്തിൽ നിർബന്ധിച്ചിട്ടില്ല.
  alternative: ‘അപ്പൊസ്തലന്മാരും പ്രവാചകന്മാരും ഇട്ട അടിത്തറ’ അല്ലെങ്കിൽ ‘അപ്പൊസ്തലന്മാരും പ്രവാചകന്മാരുമാകുന്ന അടിത്തറ’
  rationale: ഗ്രീക്ക് ബന്ധിവിഭക്തി ബന്ധത്തിന്റെ കൃത്യസ്വഭാവം നിർണ്ണയിക്കുന്നില്ല; അതിനാൽ സഭാശാസ്ത്രപരമായ അർഥസാധ്യതകൾ വിവർത്തനംകൊണ്ട് ചുരുക്കുന്നത് ഒഴിവാക്കി.
- issue: Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ വിവർത്തനം
  choice: മശീഹയായ യേശു
  alternative: ക്രിസ്തുയേശു
  rationale: ഈ കെട്ടിടരൂപകസന്ദർഭത്തിൽ Χριστός എന്നതിന്റെ സ്ഥാനപ്പേരായ അർഥം സജീവമാണ്; ‘മശീഹ’ അതിനെ സാധാരണ വായനക്കാർക്കായി പ്രകടമാക്കുന്നു, പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. മൂലവാക്യം അടുത്ത വാക്യവുമായി തുടരുന്ന പങ്കാളിത്തഘടനയായതിനാൽ അവസാനത്തിൽ പൂർണ്ണവിരാമത്തിനു പകരം അല്പവിരാമം നിലനിർത്തി. ‘അടിത്തറ’, ‘മൂലക്കല്ല്’ എന്നീ പദങ്ങൾ കെട്ടിടരൂപകത്തിന്റെ ഏകോപനം കാത്തുസൂക്ഷിക്കുന്നു.
