id: EPH.2.16
reference: Ephesians 2:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀποκαταλλάξῃ τοὺς ἀμφοτέρους ἐν ἑνὶ σώματι τῷ θεῷ διὰ τοῦ σταυροῦ ἀποκτείνας τὴν ἔχθραν ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/016.yaml
  text: and might reconcile both to God in one body through the cross, having put the hostility to death by it.
translation:
  language: ml
  text: കുരിശിലൂടെ ശത്രുതയെ അതിൽ കൊന്നുകളഞ്ഞ്, ഇരുകൂട്ടരെയും ഒരേ ശരീരത്തിൽ ദൈവത്തോടു നിരപ്പിക്കേണ്ടതിനും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκαταλλάξῃ
  choice: നിരപ്പിക്കേണ്ടതിന്
  rationale: ദൈവത്തോടുള്ള തകർന്ന ബന്ധം പൂർണമായി പുനഃസ്ഥാപിക്കുക എന്ന ശക്തമായ സമാധാനപ്പെടുത്തൽ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: τοὺς ἀμφοτέρους
  choice: ഇരുകൂട്ടരെയും
  rationale: മുൻസന്ദർഭത്തിലെ യെഹൂദരും ജാതികളും എന്ന രണ്ടു കൂട്ടരെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ഇരുവരെയും’ എന്നതിനെക്കാൾ കൂട്ടായ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: ἐν ἑνὶ σώματι
  choice: ഒരേ ശരീരത്തിൽ
  rationale: സഭയെക്കുറിച്ചുള്ള പൗലോസിന്റെ ‘ശരീരം’ എന്ന രൂപകം നിലനിർത്തുകയും ἑνίയുടെ ഏകത്വ ഊന്നൽ പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: διὰ τοῦ σταυροῦ
  choice: കുരിശിലൂടെ
  rationale: കുരിശാണ് നിരപ്പിക്കലിന്റെ ഉപാധി എന്ന അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: ἀποκτείνας τὴν ἔχθραν
  choice: ശത്രുതയെ ... കൊന്നുകളഞ്ഞ്
  rationale: അസൽ പാഠത്തിലെ ശക്തമായ മരണരൂപകം മയപ്പെടുത്താതെ നിലനിർത്തുന്നു.
- source_word: ἐν αὐτῷ
  choice: അതിനാൽ
  rationale: പുരുഷലിംഗത്തിലുള്ള αὐτῷ ഏറ്റവും സ്വാഭാവികമായി സമീപസ്ഥമായ ‘കുരിശ്’ എന്നതിലേക്കാണ് മടങ്ങുന്നത്; കുരിശിനാൽ ശത്രുതയെ നശിപ്പിച്ചു എന്ന ഉപാധ്യർഥം നൽകുന്നു.
theological_decisions:
- issue: ‘ഒരേ ശരീരം’ എന്നതിന്റെ സൂചന
  choice: രൂപകം വിശദീകരിക്കാതെ ‘ഒരേ ശരീരത്തിൽ’ എന്ന് നിലനിർത്തി
  alternative: ‘ഒരൊറ്റ സഭാശരീരത്തിൽ’
  rationale: സഭ എന്ന ആശയം സന്ദർഭത്തിൽ ശക്തമായിരിക്കുമ്പോഴും, വിവർത്തനത്തിനുള്ളിൽ വ്യാഖ്യാനം ചേർക്കാതെ പൗലോസിന്റെ രൂപകവും അതിലെ സാന്ദ്രതയും സംരക്ഷിക്കുന്നു.
- issue: ἐν αὐτῷ എന്നതിന്റെ ബന്ധം
  choice: ‘അതിനാൽ’—കുരിശിനാൽ
  alternative: ‘അതിൽ’—ശരീരത്തിൽ അല്ലെങ്കിൽ കുരിശിൽ
  rationale: വ്യാകരണപരമായി αὐτῷ സമീപസ്ഥമായ σταυροῦ-വിലേക്കു മടങ്ങുന്നതാണ് കൂടുതൽ സാധ്യത; ഇംഗ്ലീഷ് POB-യിലെ ‘by it’ എന്ന പുതിയ വിധിയോടും യോജിക്കുന്നു. എങ്കിലും മൂലത്തിലെ ἐν എന്ന പ്രയോഗത്തിന്റെ സാന്ദ്രത കാരണം ചെറിയ വ്യാഖ്യാനസാധ്യത നിലനിൽക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള, പൊതുവായ ബൈബിൾ ശൈലി. ഈ വാക്യം മുൻവാക്യത്തിലെ ഉദ്ദേശ്യഘടനയുടെ തുടർച്ചയായതിനാൽ ‘...വേണ്ടതിനുമായിരുന്നു അത്’ എന്ന് ബന്ധിപ്പിച്ചു; സ്വതന്ത്രമായി വായിക്കുമ്പോഴും വ്യാകരണപൂർണത ലഭിക്കുന്നു.
