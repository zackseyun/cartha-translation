  source_fidelity: Draft accurately conveys the prohibition against sharing in the unfruitful works associated with darkness. Its rendering of ἐλέγχετε as bringing them into the light is contextually defensible, but the main-clause wording is less direct than the Greek and awkwardly adds a redundant auxiliary construction.
