id: EPH.5.11
reference: Ephesians 5:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ μὴ συγκοινωνεῖτε τοῖς ἔργοις τοῖς ἀκάρποις τοῦ σκότους, μᾶλλον δὲ καὶ ἐλέγχετε,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/011.yaml
  text: And do not participate in the unfruitful works of darkness[a], but instead even expose them[b],
translation:
  language: ml
  text: ഇരുട്ടിന്റെ ഫലമില്ലാത്ത പ്രവൃത്തികളിൽ പങ്കുചേരരുത്[a]; മറിച്ച് അവയെ തുറന്നുകാട്ടുക[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അവയിൽ പങ്കാളികളാകരുത്’ അല്ലെങ്കിൽ ‘അവയുമായി കൂട്ടായ്മ പുലർത്തരുത്.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘അവയെ ശാസിക്കുക’ അല്ലെങ്കിൽ ‘അവയുടെ തെറ്റ് ബോധ്യപ്പെടുത്തുക.’ ഗ്രീക്ക് പദത്തിന് വാക്കാലുള്ള തിരുത്തൽ എന്ന അർഥവും ഉണ്ടാകാം; എന്നാൽ ഈ സന്ദർഭത്തിൽ അത്തരം പ്രവൃത്തികളെ വെളിച്ചത്തിലേക്കു കൊണ്ടുവരുകയോ വെളിപ്പെടുത്തുകയോ ചെയ്യുക എന്ന ആശയവും അതിലുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: συγκοινωνεῖτε
  choice: പങ്കുചേരരുത്
  rationale: ക്രിയ മറ്റുള്ളവരോടൊപ്പം ഒരു കാര്യത്തിൽ പങ്കാളിയാകുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പങ്കുചേരുക’ സജീവമായ പങ്കാളിത്തം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἔργοις
  choice: പ്രവൃത്തികളിൽ
  rationale: പൗലോസിന്റെ ധാർമിക പദപ്രയോഗവുമായി യോജിക്കുന്നതും ഇവിടെ പ്രവർത്തനങ്ങളെയോ ചെയ്തികളെയോ സൂചിപ്പിക്കുന്നതുമായ പൊതുവായ പരിഭാഷയാണ് ‘പ്രവൃത്തികൾ’.
- source_word: ἀκάρποις
  choice: ഫലമില്ലാത്ത
  rationale: ഗ്രീക്കിലെ ഫലധാരണ നിലനിർത്തുന്നതിനൊപ്പം, ഇത്തരം പ്രവൃത്തികൾ നല്ല ഫലം ഉളവാക്കുന്നില്ലെന്ന ധാർമിക ആശയം സാധാരണ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: τοῦ σκότους
  choice: ഇരുട്ടിന്റെ
  rationale: ജനിറ്റീവ് ബന്ധം നിർവചിച്ച് ചുരുക്കാതെ നേരിട്ട് നിലനിർത്തുന്നു; ചുറ്റുപാടിലെ വെളിച്ചം–ഇരുട്ട് രൂപകവും സംരക്ഷിക്കുന്നു.
- source_word: μᾶλλον δὲ καὶ
  choice: പകരം ... ചെയ്യുക കൂടി
  rationale: പങ്കുചേരാതിരിക്കുക മാത്രമല്ല, അതിനപ്പുറം സജീവമായി പ്രതികരിക്കണമെന്ന വിരോധവും കൂട്ടിച്ചേർക്കുന്ന ഊന്നലും മലയാളത്തിലെ സ്വാഭാവിക ഘടനയിൽ പ്രകടമാക്കുന്നു.
- source_word: ἐλέγχετε
  choice: വെളിച്ചത്തുകൊണ്ടുവരിക
  rationale: ക്രിയയ്ക്ക് ശാസിക്കുക, കുറ്റം തെളിയിക്കുക, തുറന്നുകാട്ടുക എന്നീ അർഥസാധ്യതകളുണ്ട്. 5:8–13-ലെ വെളിച്ചം–ഇരുട്ട് പശ്ചാത്തലത്തിൽ ‘വെളിച്ചത്തുകൊണ്ടുവരിക’ സന്ദർഭബന്ധം സംരക്ഷിക്കുന്നു; എന്നാൽ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἐλέγχετε എന്ന ക്രിയയുടെ അർഥം
  choice: അവയെ വെളിച്ചത്തുകൊണ്ടുവരിക
  alternative: അവയെ തുറന്നുകാട്ടുക; അവയെ ശാസിക്കുക; അവയുടെ തെറ്റ് ബോധ്യപ്പെടുത്തുക
  rationale: തുടർന്നുള്ള വാക്യങ്ങളിൽ വെളിച്ചം കാര്യങ്ങളെ ദൃശ്യമാക്കുന്നതാണ് പ്രമേയം. അതിനാൽ ഈ പരിഭാഷ സന്ദർഭത്തിലെ രൂപകബന്ധം നിലനിർത്തുന്നു; അതേസമയം ക്രിയയെ വാക്കാലുള്ള ശാസനയിൽ മാത്രം ഒതുക്കുന്നില്ല.
- issue: നിഷേധാത്മകവും സജീവവുമായ കല്പനകളുടെ വിരോധം
  choice: പങ്കുചേരരുത്; പകരം ... ചെയ്യുക കൂടി
  alternative: കൂട്ടാളികളാകരുത്; മറിച്ച് ശാസിക്കുക
  rationale: ഗ്രീക്ക് പാഠം ദുഷ്പ്രവൃത്തിയിൽനിന്നുള്ള വിട്ടുനിൽപ്പിനോടൊപ്പം അതിനെ നേരിടുന്ന സജീവ പ്രതികരണവും ആവശ്യപ്പെടുന്നു. പ്രതികരണത്തിന്റെ കൃത്യമായ രീതി പാഠത്തിൽ ഉള്ളതിലധികം വികസിപ്പിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ഇരുട്ടിന്റെ’–‘വെളിച്ചത്തുകൊണ്ടുവരിക’ എന്ന പദബന്ധം മൂലപാഠത്തിന്റെ രൂപകാത്മക ഐക്യം നിലനിർത്തുന്നു. കല്പനയുടെ നേരിട്ടുള്ള സ്വരം സംരക്ഷിച്ചിരിക്കുന്നു.
