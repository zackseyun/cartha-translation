id: EPH.5.1
reference: Ephesians 5:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: γίνεσθε οὖν μιμηταὶ τοῦ θεοῦ, ὡς τέκνα ἀγαπητά,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/001.yaml
  text: Therefore[a], become imitators of God, as beloved children,
translation:
  language: ml
  text: അതുകൊണ്ട്, പ്രിയപ്പെട്ട മക്കളെന്ന നിലയിൽ ദൈവത്തെ അനുകരിക്കുന്നവരായിത്തീരുവിൻ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അതുകൊണ്ട്, പ്രിയപ്പെട്ട മക്കളെന്ന നിലയിൽ ദൈവത്തെ അനുകരിക്കുന്നവരായിരിക്കുവിൻ.’ ഗ്രീക്ക് ആജ്ഞാരൂപത്തിന് ആയിത്തീരുന്നതിനെയോ തുടർന്നും അങ്ങനെ ആയിരിക്കുന്നതിനെയോ ഊന്നിക്കാട്ടാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: γίνεσθε
  choice: ആയിത്തീരുവിൻ
  rationale: വർത്തമാനകാല ആജ്ഞാരൂപത്തിലുള്ള γίνομαι ക്രമമായി ആയിത്തീരുക എന്ന പ്രക്രിയാഭാവം നൽകാം. ‘ആയിരിക്കുവിൻ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: μιμηταὶ
  choice: അനുകരിക്കുന്നവർ
  rationale: ദൈവത്തിന്റെ മാതൃക പിന്തുടർന്ന് അനുകരിക്കുക എന്ന വ്യക്തമായ ആശയം സൂക്ഷിക്കുന്നു; പൊതുവായ ‘പിന്തുടരുന്നവർ’ എന്നതിനെക്കാൾ കൃത്യമാണ്.
- source_word: τοῦ θεοῦ
  choice: ദൈവത്തെ
  rationale: μιμηταί എന്ന ആശയത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി ക്രിയാപദരൂപത്തിൽ അവതരിപ്പിക്കുമ്പോൾ കർമരൂപമായ ‘ദൈവത്തെ’ യോജിക്കുന്നു.
- source_word: ὡς
  choice: എന്ന നിലയിൽ
  rationale: പ്രിയമക്കൾ എന്ന അവരുടെ തിരിച്ചറിവിനനുസരിച്ചുള്ള രീതിയും അടിസ്ഥാനവും സംക്ഷിപ്തമായി സൂക്ഷിക്കുന്നു; അനുകരണത്തിലൂടെ മക്കളാകുന്നു എന്ന ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: τέκνα
  choice: മക്കൾ
  rationale: ലിംഗഭേദമില്ലാത്ത കുടുംബബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀγαπητά
  choice: പ്രിയ
  rationale: സ്നേഹിക്കപ്പെടുന്നവരും പ്രിയപ്പെട്ടവരുമെന്ന സ്നേഹഭാരം സംക്ഷിപ്തവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ദൈവമക്കളെന്ന തിരിച്ചറിവും അനുകരണത്തിനുള്ള ആഹ്വാനവും തമ്മിലുള്ള ബന്ധം
  choice: വിശ്വാസികൾ പ്രിയമക്കളെന്ന നിലയിൽ ദൈവത്തെ അനുകരിക്കുന്നവരായിത്തീരണമെന്ന് വാക്യം ആഹ്വാനം ചെയ്യുന്നു.
  alternative: പ്രിയമക്കൾ ചെയ്യുന്നതുപോലെ ദൈവത്തെ അനുകരിക്കുക എന്ന ലളിതമായ ഉപമയായി വായിക്കാം.
  rationale: ὡς τέκνα ἀγαπητά ആജ്ഞയുടെ രീതിയോ അടിസ്ഥാനമോ സൂചിപ്പിക്കാൻ കഴിയും. ‘എന്ന നിലയിൽ’ എന്നത് അനുകരണത്തിലൂടെയാണ് അവർ ദൈവമക്കളാകുന്നത് എന്ന ആശയം ഇറക്കുമതി ചെയ്യാതെ ഈ ബന്ധം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അനുകരിക്കുന്നവരായിത്തീരുവിൻ’ മൂലത്തിലെ നാമപ്രയോഗവും ആജ്ഞയുടെ പ്രക്രിയാഭാവവും സൂക്ഷിക്കുന്നു; ‘പ്രിയമക്കൾ’ സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതാണ്.
