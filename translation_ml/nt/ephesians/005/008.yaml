lexical_decisions:
- source_word: ἦτε
  choice: ആയിരുന്നു
  rationale: εἰμίയുടെ അപൂർണഭൂതകാലരൂപം കഴിഞ്ഞകാലത്തെ ഒരു അവസ്ഥയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ആയിരുന്നു’ അത് നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: γάρ
  choice: കാരണം
  rationale: മുൻപുള്ള പ്രബോധനത്തിന് വിശദീകരണപരമായ അടിസ്ഥാനം നൽകുന്ന ബന്ധകശക്തി വ്യക്തമാക്കുന്നു.
- source_word: ποτε
  choice: ഒരിക്കൽ
  rationale: മുൻകാലാവസ്ഥയും ഇപ്പോഴത്തെ അവസ്ഥയും തമ്മിലുള്ള വൈരുധ്യം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: σκότος
  choice: ഇരുൾ
  rationale: മൂലപാഠത്തിൽ ഇത് വിശേഷണമായോ ‘ഇരുളിൽ’ എന്ന സ്ഥാനസൂചനയായോ അല്ല, വിധേയനാമമായാണ് വരുന്നത്; അതിനാൽ ശക്തമായ സ്വത്വരൂപകം നിലനിർത്തുന്നു.
- source_word: νῦν δὲ
  choice: എന്നാൽ ഇപ്പോൾ
  rationale: മുൻകാലവും വർത്തമാനവും തമ്മിലുള്ള ശക്തമായ വൈരുധ്യം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: φῶς
  choice: വെളിച്ചം
  rationale: ‘ഇരுள்’ എന്നതുപോലെ ഇതും വിധേയനാമമാണ്; ‘വെളിച്ചത്തിലാണ്’ എന്നാക്കി ദുർബലപ്പെടുത്താതെ സ്വത്വപരമായ രൂപകം സംരക്ഷിക്കുന്നു.
- source_word: ἐν κυρίῳ
  choice: കർത്താവിൽ
  rationale: ἐν + ദത്തിവ് ഇവിടെ കർത്താവുമായുള്ള ബന്ധത്തിന്റെയോ ഐക്യത്തിന്റെയോ മണ്ഡലം സൂചിപ്പിക്കുന്നു; പൗലോസിന്റെ പ്രയോഗവും theological resonance-ഉം നിലനിർത്തുന്നു.
- source_word: ὡς
  choice: ആയി
  rationale: വെളിച്ചത്തിന്റെ മക്കൾ എന്ന സ്വത്വത്തിന് യോജിച്ച ജീവിതരീതിയെ സൂചിപ്പിക്കുന്നു; വെറും ഉപമയായി ചുരുക്കുന്നില്ല.
- source_word: τέκνα φωτός
  choice: വെളിച്ചത്തിന്റെ മക്കൾ
  rationale: τέκνα ലിംഗസമാവേശിയായ ‘മക്കൾ’ എന്നാണ്; ‘വെളിച്ചത്തിന്റെ’ എന്ന ഷഷ്ഠീവിന്യാസം മൂലരൂപകം നിലനിർത്തുന്നു.
- source_word: περιπατεῖτε
  choice: നടക്കുവിൻ
  rationale: വർത്തമാനകാല ആജ്ഞാരൂപവും പൗലോസിന്റെ നൈതിക ‘നടപ്പ്’ രൂപകവും സംരക്ഷിക്കുന്നു; അർത്ഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ‘നിങ്ങൾ ഒരിക്കൽ ഇരുളായിരുന്നു; ഇപ്പോൾ ... വെളിച്ചമാണ്’ എന്ന സ്വത്വരൂപകം
  choice: ‘ഇരുൾ’, ‘വെളിച്ചം’ എന്നീ ശക്തമായ വിധേയനാമരൂപങ്ങൾ അതേപടി നിലനിർത്തി.
  alternative: ‘നിങ്ങൾ ഇരുളിലായിരുന്നു; ഇപ്പോൾ വെളിച്ചത്തിലാണ്’ അല്ലെങ്കിൽ ‘ഇരുണ്ടവരായിരുന്നു; ഇപ്പോൾ പ്രകാശിതരാണ്’.
  rationale: ഗ്രീക്കിൽ മുൻപ്രത്യയങ്ങളില്ലാത്ത predicate nominatives ആണ്; പരിസരമോ അനുഭവമോ മാത്രം അല്ല, സ്വത്വത്തിലും ധാർമ്മിക-ആത്മീയ നിലയിലും വന്ന മാറ്റത്തിന്റെ ശക്തി ഇതിലൂടെ നിലനിൽക്കുന്നു.
- issue: κύριος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: കർത്താവ്
  alternative: നാഥൻ / യജമാനൻ
  rationale: പുതിയനിയമത്തിലെ പതിവായ ദൈവശാസ്ത്രപ്രാധാന്യം അനാവശ്യമായി ചുരുക്കാതെ മലയാളത്തിലെ സ്ഥാപിതവും സ്വാഭാവികവുമായ പദം ഉപയോഗിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള തിരുവെഴുത്തുശൈലി. ‘നടക്കുവിൻ’ എന്നത് ദൈനംദിന സംഭാഷണത്തിൽ കുറച്ച് ഔപചാരികമാണെങ്കിലും മൂലരൂപകവും ആജ്ഞയുടെ ഭാവവും നിലനിർത്തുന്നതിനായി തെരഞ്ഞെടുത്തു; അതിന്റെ ആശയം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി. ‘ഇരുളായിരുന്നു/വെളിച്ചമാണ്’ എന്ന അസാധാരണമായെങ്കിലും ഉദ്ദേശപൂർവമായ സ്വത്വഭാഷ മൃദൂകരിച്ചിട്ടില്ല.
