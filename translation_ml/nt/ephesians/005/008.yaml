  text: For you were once darkness[a], but now you are light in the Lord. Walk as children of light,
translation:
  language: ml
  text: കാരണം, നിങ്ങൾ ഒരിക്കൽ ഇരുളായിരുന്നു; എന്നാൽ ഇപ്പോൾ കർത്താവിൽ വെളിച്ചമാണ്. വെളിച്ചത്തിന്റെ മക്കളായി നടക്കുവിൻ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, അർത്ഥം കൂടുതൽ വ്യക്തമാക്കി: ‘വെളിച്ചത്തിന്റെ മക്കളായി ജീവിക്കുവിൻ.’ ഗ്രീക്കിൽ ‘നടക്കുവിൻ’ എന്നാണ്; ഒരാളുടെ ജീവിതരീതിയെ സൂചിപ്പിക്കാൻ പൗലോസ് പതിവായി ഉപയോഗിക്കുന്ന രൂപകമാണിത്.'
