source:
  edition: SBLGNT
  text: λαλοῦντες ⸀ἑαυτοῖς ψαλμοῖς καὶ ὕμνοις καὶ ᾠδαῖς πνευματικαῖς, ᾄδοντες καὶ ⸀ψάλλοντες τῇ καρδίᾳ ὑμῶν τῷ κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/019.yaml
  text: speaking to one another with psalms and hymns and spiritual songs[a], singing and making melody with your heart to the Lord[b],
translation:
  language: ml
  text: സങ്കീർത്തനങ്ങളാലും സ്തുതിഗീതങ്ങളാലും ആത്മികഗാനങ്ങളാലും പരസ്പരം[a] സംസാരിച്ചുകൊണ്ട്, നിങ്ങളുടെ ഹൃദയത്തോടെ കർത്താവിനു പാടുകയും ഈണമുയർത്തുകയും ചെയ്തുകൊണ്ട്[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘നിങ്ങളുടെ ഇടയിൽ’ അല്ലെങ്കിൽ ‘നിങ്ങൾക്കുതന്നെ’; ഇവിടെയുള്ള ഗ്രീക്ക് ആത്മവാചക സർവനാമം സാധാരണയായി പരസ്പരവാചക അർഥത്തിൽ, ‘പരസ്പരം’ എന്നാണ് മനസ്സിലാക്കപ്പെടുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘സ്തുതിപാടിക്കൊണ്ട്’; ഗ്രീക്ക് പദത്തിന് സ്തുതിപാടുക എന്നോ ഈണമുയർത്തുക എന്നോ അർഥമാകാം; വാദ്യോപകരണത്തിന്റെ അകമ്പടി അതു നിർബന്ധമായി സൂചിപ്പിക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλοῦντες
  choice: സംസാരിച്ചുകൊണ്ട്
  rationale: വർത്തമാനകാല കൃദന്തരൂപവും വിശാലമായ ‘സംസാരിക്കുക’ എന്ന അർഥവും നിലനിർത്തുന്നു; ഔപചാരിക അഭിസംബോധന എന്ന ആശയം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: ἑαυτοῖς
  choice: പരസ്പരം
  rationale: ബഹുവചനസന്ദർഭത്തിലെ ആത്മവാചക സർവനാമത്തിന് ഇവിടെ പരസ്പരവാചക അർഥമാണ് സ്വാഭാവികം; സമൂഹത്തിനുള്ളിലെ ആശയവിനിമയം വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: ψαλμοῖς
  choice: സങ്കീർത്തനങ്ങളാൽ
  rationale: പരമ്പരാഗതവും വ്യക്തവുമായ തത്തുല്യപദം; ഇത് തിരുവെഴുത്തിലെ സങ്കീർത്തനങ്ങളിൽ മാത്രം ഒതുങ്ങുന്നു എന്ന് വിവർത്തനം നിർബന്ധിക്കുന്നില്ല.
- source_word: ὕμνοις
  choice: സ്തുതിഗീതങ്ങളാൽ
  rationale: ψαλμοῖς, ᾠδαῖς എന്നീ പദങ്ങളിൽനിന്നുള്ള വ്യത്യാസം സൂക്ഷിച്ചുകൊണ്ട് സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന പദം ഉപയോഗിക്കുന്നു.
- source_word: ᾠδαῖς πνευματικαῖς
  choice: ആത്മികഗാനങ്ങളാൽ
  rationale: πνευματικαῖς എന്ന വിശേഷണം ᾠδαῖς എന്ന പദത്തെ വിശേഷിപ്പിക്കുന്ന ഘടന നേരിട്ട് നിലനിർത്തുന്നു; ‘ആത്മാവിനാൽ നിശ്വസിക്കപ്പെട്ട’ എന്ന കൂടുതൽ ശക്തമായ അവകാശവാദം ചേർക്കുന്നില്ല.
- source_word: ᾄδοντες
  choice: പാടുകയും
  rationale: നേരിട്ടുള്ള കൃദന്തരൂപാർഥം; ψάλλοντες എന്ന അനുബന്ധ സംഗീതപ്രവർത്തനത്തിൽനിന്ന് വേർതിരിച്ചും നിലനിർത്തുന്നു.
- source_word: ψάλλοντες
  choice: ഈണമുയർത്തുകയും ചെയ്തുകൊണ്ട്
  rationale: പാടിസ്തുതിക്കുക അഥവാ ഈണമുണ്ടാക്കുക എന്ന സംഗീതസൂചന നിലനിർത്തുന്നു; വാദ്യോപകരണത്തിന്റെ ഉപയോഗം നിർബന്ധമായി സൂചിപ്പിക്കുന്നില്ല.
- source_word: τῇ καρδίᾳ ὑμῶν
  choice: നിങ്ങളുടെ ഹൃദയത്തോടെ
  rationale: ദത്തിവിന്റെ രീതി/ഉപാധി സൂചിപ്പിക്കുന്ന സാധ്യത സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; പുറമേയുള്ള ശബ്ദമാത്രമല്ല, ഉള്ളാർന്ന പങ്കാളിത്തവുമാണെന്ന ഭാഷാപരമായ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: τῷ κυρίῳ
  choice: കർത്താവിനു
  rationale: പാട്ടിന്റെയും ഈണത്തിന്റെയും ലക്ഷ്യം/സ്വീകർത്താവ് കർത്താവാണെന്ന ദത്തിവർഥം നിലനിർത്തുന്നു; ഈ വാക്യത്തിൽ പറയാത്ത കൂടുതൽ വ്യക്തമായ തിരിച്ചറിയൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ψάλλοντες എന്ന പദവും സംഗീതാചരണവും
  choice: വാദ്യോപകരണത്തെ നിർബന്ധമായി സൂചിപ്പിക്കാതെ ‘ഈണമുയർത്തുക’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘സ്തുതിപാടുക’ എന്നോ ‘വാദ്യം വായിക്കുക’ എന്നോ പരിഭാഷപ്പെടുത്തുക.
  rationale: ഈ ഗ്രീക്ക് പദത്തിന് ചരിത്രപരമായി തന്ത്രി മീട്ടുക എന്ന അർഥമുണ്ടായിരുന്നെങ്കിലും, കൊയ്നേ പ്രയോഗത്തിലും ഈ സന്ദർഭത്തിലും വാദ്യോപകരണം നിർബന്ധമല്ല. അതിനാൽ വാദ്യസംഗീതത്തെ അനുകൂലിക്കുകയോ എതിർക്കുകയോ ചെയ്യുന്ന സഭാവിഭാഗപരമായ നിലപാട് വിവർത്തനത്തിൽ ചേർക്കുന്നില്ല.
- issue: τῷ κυρίῳ എന്നതിലെ ‘കർത്താവ്’ ആരെന്ന ചോദ്യം
  choice: ‘കർത്താവിനു’ എന്നുതന്നെ നിലനിർത്തി.
  alternative: ‘കർത്താവായ യേശുവിനു’ എന്ന് വ്യക്തമായി ചേർക്കുക.
  rationale: എഫേസ്യലേഖനത്തിന്റെ വിശാലസന്ദർഭത്തിൽ ക്രിസ്തുവായിരിക്കാം ഉദ്ദേശ്യം; എങ്കിലും ഈ വാക്യം κύριος എന്നു മാത്രമാണ് പറയുന്നത്. അതിനാൽ വാക്യത്തിന്റെ സ്വന്തം പദപ്രയോഗം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലത്തിലെ കൃദന്തരൂപങ്ങളുടെ തുടർച്ച നിലനിർത്തുന്നതിനാൽ വാക്യം മുൻവാക്യത്തെ ആശ്രയിക്കുന്ന ഘടനയായി അവസാനിക്കുന്നു. ‘സങ്കീർത്തനങ്ങൾ—സ്തുതിഗീതങ്ങൾ—ആത്മികഗാനങ്ങൾ’ എന്ന ത്രിപദക്രമവും സംഗീതത്തെക്കുറിച്ചുള്ള യഥാർഥ അർഥവ്യാപ്തിയും സംരക്ഷിച്ചിട്ടുണ്ട്.
