id: EPH.5.24
reference: Ephesians 5:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλὰ ⸀ὡς ἡ ἐκκλησία ὑποτάσσεται τῷ Χριστῷ, οὕτως καὶ αἱ γυναῖκες ⸀τοῖς ἀνδράσιν ἐν παντί.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/024.yaml
  text: But as the church submits to Messiah[a], so also wives to their husbands in everything.
translation:
  language: ml
  text: എന്നാൽ, സഭ മശീഹായ്ക്ക്[a] കീഴടങ്ങുന്നതുപോലെ, അതുപോലെ ഭാര്യമാരും എല്ലാ കാര്യങ്ങളിലും തങ്ങളുടെ ഭർത്താക്കന്മാർക്ക് കീഴടങ്ങണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘ക്രിസ്തുവിന്.’ ഗ്രീക്കിലെ Χριστός എന്ന സ്ഥാനപ്പേര് ഇവിടെ ‘മശീഹാ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തോടുള്ള വൈരുധ്യവും ആശയത്തിന്റെ തുടർച്ചയും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ὡς ... οὕτως καὶ
  choice: …പോലെ, …യും
  rationale: ഗ്രീക്കിലെ പരസ്പരബന്ധമുള്ള താരതമ്യഘടന മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἡ ἐκκλησία
  choice: സഭ
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിൽ വിശ്വാസികളുടെ സമൂഹത്തെ സൂചിപ്പിക്കുന്ന, മലയാളത്തിൽ പ്രചാരമുള്ള പദം.
- source_word: ὑποτάσσεται
  choice: കീഴടങ്ങുന്നു
  rationale: സ്വയം മറ്റൊരാളുടെ അധികാരക്രമത്തിനു വിധേയമാകുന്ന ബന്ധപരമായ അർഥം നൽകുന്നു; ബലപ്രയോഗത്തിന്റെ ആശയം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: τῷ Χριστῷ
  choice: മശീഹായ്ക്ക്
  rationale: Χριστός ഇവിടെ സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നതിനാൽ അതിന്റെ അർഥം വിവർത്തനം ചെയ്തു; പരമ്പരാഗതമായ ‘ക്രിസ്തു’ അടിക്കുറിപ്പിൽ നൽകി.
- source_word: αἱ γυναῖκες
  choice: ഭാര്യമാർ
  rationale: ഗാർഹികബന്ധത്തിന്റെ പശ്ചാത്തലവും ἀνδράσιν എന്ന പദവുമായുള്ള ജോടിയും ‘സ്ത്രീകൾ’ എന്ന പൊതുവായ അർഥത്തിനു പകരം ‘ഭാര്യമാർ’ ആവശ്യപ്പെടുന്നു.
- source_word: τοῖς ἀνδράσιν
  choice: തങ്ങളുടെ ഭർത്താക്കന്മാർക്ക്
  rationale: വിവാഹസന്ദർഭത്തിൽ ἀνήρ എന്നത് ‘ഭർത്താവ്’ എന്നാണ്; ഗ്രീക്കിൽ സൂചിതമായ പരസ്പര ദാമ്പത്യബന്ധം മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘തങ്ങളുടെ’ ചേർത്തു.
- source_word: ἐν παντί
  choice: എല്ലാ കാര്യങ്ങളിലും
  rationale: പ്രയോഗത്തിന്റെ വ്യാപ്തി ചുരുക്കുകയോ വ്യാഖ്യാനപരമായ നിയന്ത്രണം ചേർക്കുകയോ ചെയ്യാതെ നേരിട്ട് നൽകുന്നു.
- source_word: '[ellipsis in the second clause]'
  choice: കീഴടങ്ങണം
  rationale: രണ്ടാം ഉപവാക്യത്തിൽ ഗ്രീക്ക് ക്രിയ ആവർത്തിക്കുന്നില്ലെങ്കിലും മുൻസന്ദർഭത്തിൽനിന്ന് അത് വ്യക്തമായി അധ്യാഹരിക്കപ്പെടുന്നു; പൂർണവും സ്വാഭാവികവുമായ മലയാളവാക്യത്തിനായി ക്രിയ ചേർത്തു.
theological_decisions:
- issue: Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: ഈ താരതമ്യത്തിൽ പദം സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നു. അർഥപരിഭാഷ മുഖ്യപാഠത്തിൽ നൽകി, ശക്തമായ പാരമ്പര്യപ്രയോഗം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: ദാമ്പത്യത്തിലെ കീഴടങ്ങലിന്റെ വ്യാപ്തി
  choice: ‘എല്ലാ കാര്യങ്ങളിലും’ എന്നത് യാതൊരു വിശദീകരണപരമായ നിയന്ത്രണവും ചേർക്കാതെ നിലനിർത്തി
  alternative: ‘ഉചിതമായ എല്ലാ കാര്യങ്ങളിലും’ പോലുള്ള വ്യാഖ്യാനപരമായ വിപുലീകരണം
  rationale: ഗ്രീക്ക് പാഠം ἐν παντί എന്നു മാത്രമാണ് പറയുന്നത്; ഈ വാക്യത്തിൽ ഇല്ലാത്ത പരിധികൾ ചേർക്കുന്നത് അതിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം മുൻകൂട്ടി പരിഹരിക്കും.
- issue: രണ്ടാം ഉപവാക്യത്തിലെ അധ്യാഹൃത ക്രിയ
  choice: മലയാളത്തിൽ ‘കീഴടങ്ങണം’ എന്നു വ്യക്തമാക്കി
  alternative: ‘ഭാര്യമാരും എല്ലാ കാര്യങ്ങളിലും തങ്ങളുടെ ഭർത്താക്കന്മാർക്ക്’ എന്ന ക്രിയയില്ലാത്ത രൂപം
  rationale: ഗ്രീക്കിൽ ക്രിയ അധ്യാഹൃതമാണെങ്കിലും മലയാളത്തിൽ അത് ഒഴിവാക്കുന്നത് അസ്വാഭാവികവും അപൂർണവുമായ വാക്യം സൃഷ്ടിക്കും. ചേർത്ത ക്രിയ പുതിയ ആശയം കൊണ്ടുവരുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘കീഴടങ്ങുക’ ബന്ധപരമായ അർഥം നിലനിർത്തുന്നു. മുഖ്യപാഠത്തിലെ [a] അടയാളം അനുബന്ധ അടിക്കുറിപ്പുമായി കൃത്യമായി പൊരുത്തപ്പെടുന്നു.
