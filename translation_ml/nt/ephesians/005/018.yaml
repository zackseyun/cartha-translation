- from: വീഞ്ഞുകൊണ്ട് മത്തരാകരുത്; അതിലുള്ളത് കുത്തഴിഞ്ഞ ജീവിതമാണ്. മറിച്ച്, ആത്മാവിനാൽ നിറയപ്പെടുവിൻ[a].
  to: വീഞ്ഞുകൊണ്ട് മത്തരാകരുത്; അതിൽ കുത്തഴിഞ്ഞ ജീവിതമുണ്ട്. മറിച്ച്, ആത്മാവിനാൽ നിറയപ്പെടുവിൻ[a].
