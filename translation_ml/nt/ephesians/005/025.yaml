id: EPH.5.25
reference: Ephesians 5:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οἱ ἄνδρες, ἀγαπᾶτε τὰς ⸀γυναῖκας, καθὼς καὶ ὁ Χριστὸς ἠγάπησεν τὴν ἐκκλησίαν καὶ ἑαυτὸν παρέδωκεν ὑπὲρ αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/025.yaml
  text: Husbands[a], love your wives, just as Messiah also loved the church and gave himself up for her[b],
translation:
  language: ml
  text: ഭർത്താക്കന്മാരേ, നിങ്ങളുടെ ഭാര്യമാരെ സ്നേഹിക്കുവിൻ; മശീഹയും സഭയെ സ്നേഹിക്കുകയും അവൾക്കുവേണ്ടി തന്നെത്തന്നെ ഏല്പിച്ചുകൊടുക്കുകയും ചെയ്തതുപോലെതന്നെ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄνδρες
  choice: ഭർത്താക്കന്മാരേ
  rationale: വിവാഹബന്ധത്തെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ ἄνδρες എന്നത് പൊതുവായി ‘പുരുഷന്മാർ’ എന്നല്ല, ഭാര്യമാരോടുള്ള ബന്ധത്തിൽ ഭർത്താക്കന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἀγαπᾶτε / ἠγάπησεν
  choice: സ്നേഹിക്കുവിൻ / സ്നേഹിക്കുകയും
  rationale: ഒരേ ഗ്രീക്ക് ക്രിയയുടെ ആജ്ഞാരൂപവും ഭൂതകാലരൂപവും തമ്മിലുള്ള പദബന്ധം മലയാളത്തിലും ‘സ്നേഹിക്കുക’ എന്ന ഒരേ ക്രിയയിലൂടെ നിലനിർത്തുന്നു.
- source_word: γυναῖκας
  choice: നിങ്ങളുടെ ഭാര്യമാരെ
  rationale: ഭർത്താക്കന്മാരോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയും എഫെസ്യർ 5:22–33-ലെ വിവാഹസന്ദർഭവും കണക്കിലെടുത്ത് ‘ഭാര്യമാർ’ എന്നാണ് അർത്ഥം; സ്വാഭാവിക മലയാളത്തിനായി ‘നിങ്ങളുടെ’ ചേർത്തിരിക്കുന്നു.
- source_word: καθὼς καὶ
  choice: മശീഹയും ... ചെയ്തതുപോലെതന്നെ
  rationale: καθώς എന്ന താരതമ്യവും καί നൽകുന്ന ചേർക്കൽ/ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: Χριστός
  choice: മശീഹ
  rationale: ഇവിടെ നിർദ്ദേശകപദത്തോടുകൂടി വരുന്ന Χριστός ഒരു സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നതിനാൽ അതിന്റെ അർത്ഥം സംരക്ഷിക്കുന്ന ‘മശീഹ’ ഉപയോഗിച്ചു.
- source_word: ἐκκλησίαν
  choice: സഭയെ
  rationale: ഇവിടെ ദൈവജനത്തെ ഒരു സമൂഹമായി സൂചിപ്പിക്കുന്ന പൗലോസിന്റെ പ്രയോഗത്തിന് മലയാളത്തിൽ സ്ഥാപിതവും വ്യക്തവുമായ പദം ‘സഭ’യാണ്.
- source_word: ἑαυτὸν παρέδωκεν
  choice: തന്നെത്തന്നെ ഏല്പിച്ചുകൊടുക്കുകയും ചെയ്തു
  rationale: മനസ്സോടെയുള്ള സ്വയംസമർപ്പണത്തെ പ്രകടമാക്കുന്നു; മൂലവാക്യത്തിൽ വ്യക്തമാക്കാത്ത പ്രായശ്ചിത്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: ὑπὲρ αὐτῆς
  choice: സഭയ്ക്കുവേണ്ടി
  rationale: ὑπέρ എന്നതിന്റെ ‘വേണ്ടി/നിമിത്തം’ എന്ന അർത്ഥം നിലനിർത്തുന്നു. മലയാളത്തിൽ അസ്വാഭാവികമായ സ്ത്രീലിംഗ സർവനാമം ഒഴിവാക്കി സൂചിതനാമമായ ‘സഭ’ ആവർത്തിക്കുന്നത് പരാമർശം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: വിവാഹ-സഭാ ഉപമയിൽ Χριστός എന്നതിന്റെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഗ്രീക്ക് പദത്തിന്റെ സ്ഥാനപ്പേർ എന്ന അർത്ഥം തുറന്നുകാട്ടുന്നു; മലയാളത്തിൽ പതിവായ ‘ക്രിസ്തു’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: παρέδωκεν ὑπὲρ αὐτῆς എന്നതിലെ ബലിദാനപരമായ സൂചനയുടെ വ്യാപ്തി
  choice: സഭയ്ക്കുവേണ്ടി തന്നെത്തന്നെ ഏല്പിച്ചുകൊടുത്തു
  alternative: സഭയ്ക്കുവേണ്ടി തന്നെത്തന്നെ വിട്ടുകൊടുത്തു
  rationale: മശീഹയുടെ സ്വമേധയായ സ്വയംസമർപ്പണവും സഭയ്ക്കുവേണ്ടിയുള്ള പ്രവർത്തിയും നിലനിർത്തുന്നു; എന്നാൽ ഗ്രീക്കിൽ നേരിട്ട് പറയാത്ത പ്രത്യേക പ്രായശ്ചിത്തസിദ്ധാന്തം വാക്യത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. നേരിട്ടുള്ള അഭിസംബോധനയ്ക്ക് ‘ഭർത്താക്കന്മാരേ’ എന്നും ആജ്ഞയ്ക്ക് ഗൗരവമുള്ള ‘സ്നേഹിക്കുവിൻ’ എന്നും ഉപയോഗിച്ചു. മൂലവാക്യത്തിലെ താരതമ്യക്രമവും ‘സ്നേഹിക്കുക’ എന്ന പദത്തിന്റെ ആവർത്തനബന്ധവും സംരക്ഷിച്ചു.
