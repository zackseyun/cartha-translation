id: EPH.5.31
reference: Ephesians 5:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀντὶ τούτου καταλείψει ἄνθρωπος ⸀τὸν ⸀πατέρα καὶ ⸀τὴν μητέρα καὶ προσκολληθήσεται ⸂τῇ γυναικὶ⸃ αὐτοῦ, καὶ ἔσονται οἱ δύο εἰς σάρκα μίαν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/031.yaml
  text: For this reason a man will leave his father and mother and be joined to his wife[a], and the two will become one flesh.
translation:
  language: ml
  text: ഇക്കാരണത്താൽ[a] ഒരു പുരുഷൻ തന്റെ അപ്പനെയും അമ്മയെയും വിട്ട് ഭാര്യയോടു ചേരും; ഇരുവരും ഒരു ദേഹമായിത്തീരും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഇതുകൊണ്ട്.” ഇവിടെ ഗ്രീക്ക് പ്രയോഗം കാരണബന്ധം സൂചിപ്പിക്കുന്നു.
    reason: Preserves the documented causal alternative for ἀντὶ τούτου without suggesting its literal substitutional sense.
  - marker: b
    text: അക്ഷരാർഥം, “ഒരു മാംസം.” ‘ഒരു ദേഹം’ ഉല്പത്തി 2:24-ലെ ദാമ്പത്യഐക്യത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാപിത ബൈബിൾ പ്രയോഗമാണ്.
    reason: Preserves the lexical force of σάρξ (‘flesh’) while retaining the natural, established Malayalam biblical idiom in the text.
lexical_decisions:
- source_word: ἀντὶ τούτου
  choice: ഇക്കാരണത്താൽ
  rationale: ഉല്പത്തി 2:24-ലെ ഉദ്ധരണിയിൽ ഈ പ്രയോഗം പകരംവയ്ക്കൽ എന്നതിലുപരി കാരണസൂചകമായാണ് പ്രവർത്തിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കാരണബന്ധം ഇത് വ്യക്തമാക്കുന്നു.
- source_word: καταλείψει
  choice: വിട്ട്
  rationale: മാതാപിതാക്കളുടെ കുടുംബഗൃഹം വിട്ട് പുതിയ ദാമ്പത്യബന്ധം സ്ഥാപിക്കുന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു; ഉപേക്ഷിക്കൽ എന്ന പ്രതികൂല ഭാവം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: ἄνθρωπος
  choice: ഒരു പുരുഷൻ
  rationale: പദത്തിന് പൊതുവായി മനുഷ്യൻ എന്നർഥമുണ്ടാകാമെങ്കിലും ഇവിടെ ‘തന്റെ ഭാര്യ’ എന്നതിനോടു ചേർന്നുള്ള വിവാഹസന്ദർഭം പുരുഷപങ്കാളിയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: തന്റെ അപ്പനെയും അമ്മയെയും
  rationale: ബന്ധം വ്യക്തമാക്കാൻ മലയാളത്തിൽ സ്വാഭാവികമായ ഉടമസ്ഥസൂചന ചേർത്തു; ആവർത്തനം ഒഴിവാക്കിയിട്ടും രണ്ടുപേരോടുമുള്ള ബന്ധം വ്യക്തമാണ്.
- source_word: προσκολληθήσεται
  choice: ചേർന്നിരിക്കും
  rationale: ഭാര്യയോടുള്ള ദൃഢവും നിലനിൽക്കുന്നതുമായ ഐക്യം വ്യക്തമാക്കുന്നു; അമിതമായി ശാരീരികമോ സംഭാഷണശൈലിയിലോ ആകുന്ന പദങ്ങൾ ഒഴിവാക്കുന്നു.
- source_word: τῇ γυναικὶ αὐτοῦ
  choice: ഭാര്യയോടു
  rationale: വിവാഹസന്ദർഭത്തിൽ γυνή എന്നത് ‘ഭാര്യ’ എന്നാണ്; αὐτοῦ നൽകുന്ന ബന്ധസൂചന മലയാളവാക്യത്തിൽ വ്യക്തമാണ്.
- source_word: ἔσονται οἱ δύο
  choice: ഇരുവരും ... ആയിത്തീരും
  rationale: ഗ്രീക്കിൽ അക്ഷരാർഥം ‘ഇരുവരും ആയിരിക്കും’ എന്നാണെങ്കിലും ഫലമായി ഉണ്ടാകുന്ന ഐക്യം മലയാളത്തിൽ ‘ആയിത്തീരും’ എന്നു സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: εἰς σάρκα μίαν
  choice: ഒരു ദേഹം
  rationale: ഇവിടെ σάρξ പാപസ്വഭാവത്തെ സൂചിപ്പിക്കുന്നില്ല; ഉല്പത്തി ഉദ്ധരണിയിലെ ദാമ്പത്യഐക്യമാണ്. മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും സ്വാഭാവികവുമായ ‘ഒരു ദേഹം’ ആ അർഥം നൽകുന്നു.
theological_decisions:
- issue: വിവാഹ ഉദ്ധരണിയിലെ ലിംഗസൂചക ഭാഷ
  choice: ഒരു പുരുഷൻ ... ഭാര്യ
  alternative: ഒരു വ്യക്തി ... ജീവിതപങ്കാളി
  rationale: ഉറവിടവാക്യം ഉല്പത്തി 2:24 ഉദ്ധരിച്ച് പുരുഷനെയും അവന്റെ ഭാര്യയെയും വ്യക്തമാക്കുന്നു; അതിനാൽ ലിംഗസൂചന നിഷ്പക്ഷമാക്കാതെ നിലനിർത്തുന്നു.
- issue: εἰς σάρκα μίαν എന്നതിലെ σάρξ-ന്റെ വിവർത്തനം
  choice: ഒരു ദേഹം
  alternative: ഒരേ ശരീരം / ഒരു മാംസം
  rationale: ഇത് പാപസ്വഭാവത്തെക്കുറിച്ചുള്ള പൗലൊസീയ രൂപകമല്ല, ദാമ്പത്യത്തിലെ സമഗ്ര ഐക്യത്തെക്കുറിച്ചുള്ള ഉല്പത്തി ഭാഷയാണ്. ‘ഒരു ദേഹം’ ഈ സ്ഥാപിത ബൈബിൾ ആശയം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ തിരുവെഴുത്ത് ഉദ്ധരണിക്ക് യോജിച്ച ഗൗരവമുള്ള ശൈലി. അനാവശ്യ സാങ്കേതികതയും മതവിഭാഗ-വിശേഷ പദപ്രയോഗങ്ങളും ഒഴിവാക്കി.
