revisions:
- from: വചനത്തോടുകൂടിയ[c] ജലത്താലുള്ള കഴുകലിലൂടെ[b] അവളെ ശുദ്ധീകരിച്ച് വിശുദ്ധീകരിക്കേണ്ടതിനായിരുന്നു[a].
  to: ജലത്താലുള്ള കഴുകലിലൂടെ വചനത്താൽ അവളെ ശുദ്ധീകരിച്ച്, അവളെ വിശുദ്ധീകരിക്കേണ്ടതിന്[a][b][c].
  rationale: ‘വചനത്താൽ’ എന്നത് ‘ജലത്താലുള്ള കഴുകൽ’ എന്ന നാമഘടകത്തിന്റെ വിശേഷണമാക്കാതെ സ്വതന്ത്രമായി നൽകിയിരിക്കുന്നു. ഇതിലൂടെ ἐν ῥήματι-യുടെ ഉപകരണമോ അനുബന്ധസാഹചര്യമോ ആയേക്കാവുന്ന ബന്ധം നിലനിർത്തുന്നു; സ്നാനപരമോ മറ്റേതെങ്കിലും പ്രത്യേക ദൈവശാസ്ത്രവായനയോ മുഖ്യപാഠത്തിൽ അടിച്ചേൽപ്പിക്കുന്നില്ല. ഉദ്ദേശ്യവും ശുദ്ധീകരണം–വിശുദ്ധീകരണം എന്ന ക്രമവും നിലനിർത്തിയിട്ടുണ്ട്.
