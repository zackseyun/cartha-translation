  yaml_path: translation/nt/ephesians/005/026.yaml
  text: so that he might sanctify her[a], having cleansed her by the washing of water with the word[c][b],
translation:
  language: ml
  text: ജലത്താലുള്ള കഴുകലിലൂടെ വചനത്താൽ അവളെ ശുദ്ധീകരിച്ച്, അവളെ വിശുദ്ധീകരിക്കേണ്ടതിന്[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ജലത്താലുള്ള കഴുകലിലൂടെ വചനത്താൽ അവളെ ശുദ്ധീകരിച്ച് അവളെ വിശുദ്ധയാക്കേണ്ടതിന്.’
    reason: lexical_alternative
  - marker: b
    text: ‘ജലത്താലുള്ള കഴുകൽ’ എന്ന പ്രയോഗം സ്നാനത്തിന്റെ ദൃശ്യം ഓർമിപ്പിക്കുന്നതാകാം; എന്നാൽ ഇത് എത്രത്തോളം പ്രത്യേകമായി കൂദാശാപരമാണെന്ന് ഗ്രീക്ക് വാചകം മാത്രം നിർണയിക്കുന്നില്ല.
    reason: cultural_note
  - marker: c
    text: '‘വചനം’ എന്നതിന് ‘സന്ദേശം’ എന്നും വിവർത്തനം ചെയ്യാം (ഗ്രീക്ക്: rhēma).'
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: —വേണ്ടതിനായിരുന്നു
  rationale: മുൻവാക്യത്തിലെ ക്രിസ്തുവിന്റെ സ്വയംസമർപ്പണത്തിന്റെ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്ന ἵναയുടെ ഉദ്ദേശ്യാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: αὐτὴν
  choice: അവളെ
  rationale: സന്ദർഭത്തിൽ സഭയെ സൂചിപ്പിക്കുന്ന സ്ത്രീലിംഗ ഏകവചന സർവനാമം അതേ രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἁγιάσῃ
  choice: വിശുദ്ധീകരിക്കേണ്ടതിന്
  rationale: ‘വിശുദ്ധയാക്കുക’ എന്ന അർഥവും ദൈവശാസ്ത്രപരമായ പദബന്ധവും സംരക്ഷിക്കുന്നു; ἵναയോടുകൂടിയ ഉദ്ദേശ്യഭാവവും വ്യക്തമാക്കുന്നു.
- source_word: καθαρίσας
  choice: ശുദ്ധീകരിച്ച്
  rationale: പ്രധാനക്രിയയോടു ബന്ധപ്പെട്ട മുൻകാലമോ അനുബന്ധമോ ആയ പ്രവർത്തനം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് കൃദ്‌രൂപം മലയാളത്തിലെ സ്വാഭാവിക ക്രിയാവിശേഷണരൂപത്തിൽ നൽകുന്നു.
- source_word: τῷ λουτρῷ
  choice: കഴുകലിലൂടെ
  rationale: ദത്തിവിന്റെ ഉപകരണാർഥം ‘—ലൂടെ’ എന്ന രൂപത്തിൽ നൽകുന്നു; λουτρόν എന്നത് ഇവിടെ ‘കഴുകൽ’ എന്നു വിവർത്തനം ചെയ്യുന്നത് സ്വാഭാവികവും അനാവശ്യ വ്യാഖ്യാനം ഒഴിവാക്കുന്നതുമാണ്.
- source_word: τοῦ ὕδατος
  choice: ജലത്താലുള്ള
  rationale: കഴുകൽ ജലവുമായി ബന്ധപ്പെട്ടതാണെന്ന ഗ്രീക്ക് ഷഷ്ഠീവാക്യബന്ധം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടമാക്കുന്നു.
- source_word: ἐν ῥήματι
  choice: വചനത്തോടുകൂടിയ
  rationale: ἐν എന്നതിന്റെ ഉപകരണമോ അനുബന്ധസാഹചര്യമോ സൂചിപ്പിക്കാവുന്ന വിശാലത സംരക്ഷിക്കുന്നു; ബന്ധം കൂടുതൽ കൃത്യമായി നിർവചിക്കുന്നില്ല.
- source_word: ῥήματι
  choice: വചനം
  rationale: ῥῆμα എന്ന പദത്തിന്റെ ‘വാക്ക്/ഉച്ചാരണം/സന്ദേശം’ എന്നീ സാധ്യതകളെ അതിയായി ചുരുക്കാതെ, മാന്യവും പരിചിതവുമായ മലയാളപദം തിരഞ്ഞെടുക്കുന്നു.
theological_decisions:
- issue: ശുദ്ധീകരണം, ജലത്താലുള്ള കഴുകൽ, വചനം എന്നിവ തമ്മിലുള്ള ബന്ധത്തിന്റെ സാധ്യതയുള്ള സ്നാനപരമായ അർഥം
  choice: ജലത്താലുള്ള കഴുകലിന്റെ ദൃശ്യവും വചനവുമായുള്ള ബന്ധവും പ്രധാനപാഠത്തിൽ നിലനിർത്തി; ഒരു പ്രത്യേക കൂദാശാസിദ്ധാന്തം വ്യക്തമാക്കിയില്ല.
  alternative: ഇത് വ്യക്തമായി സ്നാനകൂദാശയെ മാത്രം സൂചിപ്പിക്കുന്നു എന്നു പറയുക, അല്ലെങ്കിൽ പൂർണമായും രൂപകാർഥമായി മാത്രം അവതരിപ്പിക്കുക.
  rationale: ഗ്രീക്ക് വാചകം സ്നാനത്തെ ഓർമിപ്പിക്കുന്നതാണെങ്കിലും അതിന്റെ കൂദാശാപരമായ കൃത്യസ്വഭാവം സ്വയം നിർണയിക്കുന്നില്ല; അതിനാൽ ദൈവശാസ്ത്രപരമായ സംഘർഷവും തുറന്ന നിലയും സംരക്ഷിച്ചു.
- issue: ῥήματι എന്നത് പൊതുവായ ‘വചനം’ ആണോ കൂടുതൽ നിർദിഷ്ടമായ സന്ദേശമോ
  choice: പ്രധാനപാഠത്തിൽ ‘വചനം’ ഉപയോഗിച്ചു.
  alternative: ‘സന്ദേശം’, ‘ഉച്ചരിച്ച വാക്ക്’, അല്ലെങ്കിൽ ‘സുവിശേഷസന്ദേശം’.
  rationale: സന്ദർഭം പ്രഖ്യാപിക്കപ്പെട്ട സന്ദേശത്തെ സൂചിപ്പിക്കാമെങ്കിലും ഗ്രീക്ക് പദം അതിലധികം വിശാലമാണ്; ‘വചനം’ അർഥം അനാവശ്യമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘വിശുദ്ധീകരിക്കുക’, ‘ശുദ്ധീകരിക്കുക’, ‘വചനം’ എന്നീ പരിചിതമായ ദൈവശാസ്ത്രപദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നവിധം ക്രമപ്പെടുത്തി. മുൻവാക്യത്തോടുള്ള ഉദ്ദേശ്യബന്ധം വ്യക്തമാക്കാൻ ‘—വേണ്ടതിനായിരുന്നു’ ഉപയോഗിച്ചു.
