  source_fidelity: 'പ്രധാന ആശയം ശരിയാണ്: ക്രിസ്തുവിന്റെ ഉദ്ദേശ്യവും, സഭയെ (അവളെ) ശുദ്ധീകരിച്ച് വിശുദ്ധീകരിക്കുന്നതും, ജലകഴുകലും വചനവും സംരക്ഷിച്ചിട്ടുണ്ട്. എന്നാൽ ‘വചനത്തോടുകൂടിയ ജലത്താലുള്ള കഴുകൽ’ എന്ന ഘടന ἐν ῥήματι-യെ ‘ജലക്കഴുകലിന്റെ’ വിശേഷണമായി വളരെ ഉറപ്പോടെ ചേർക്കുന്നു. ഗ്രീക്കിൽ അതിന്റെ കൃത്യമായ ബന്ധം അത്ര നിർണീതമല്ല; അതിനെ സ്വതന്ത്രമായ ‘വചനത്താൽ’ എന്ന ഉപാധിയായി നിലനിർത്തുന്നതാണ് കൂടുതൽ വിശ്വസ്തം.'
  naturalness: ‘ജലത്താലുള്ള കഴുകലിലൂടെ’ എന്ന പ്രയോഗം ഗ്രഹിക്കാവുന്നതാണ്; എന്നാൽ ‘വചനത്തോടുകൂടിയ ജലത്താലുള്ള’ എന്ന ഇരട്ട വിശേഷണഘടന ഭാരമുള്ളതാണ്. ‘ജലത്താലുള്ള കഴുകലിലൂടെ വചനത്താൽ’ എന്ന ക്രമം ആധുനിക നിലവാരമലയാളത്തിൽ കൂടുതൽ നേരിട്ടതും വായനാസൗകര്യമുള്ളതുമാണ്.
  terminology: ‘വിശുദ്ധീകരിക്കുക,’ ‘ശുദ്ധീകരിക്കുക,’ ‘വചനം’ എന്നിവ ഉചിതവും സ്ഥിരതയുള്ളതുമാണ്. λουτρόν-നുള്ള ‘കഴുകൽ’ സ്നാനത്തെ നിർബന്ധമായി വ്യാഖ്യാനിക്കാതെ യോജിച്ചിരിക്കുന്നു. അടിക്കുറിപ്പിലെ ‘കൂദാശാപര’ വിശദീകരണം നിർപക്ഷമാണ്.
