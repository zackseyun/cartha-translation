id: EPH.5.28
reference: Ephesians 5:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὕτως ὀφείλουσιν ⸀καὶ οἱ ἄνδρες ἀγαπᾶν τὰς ἑαυτῶν γυναῖκας ὡς τὰ ἑαυτῶν σώματα· ὁ ἀγαπῶν τὴν ἑαυτοῦ γυναῖκα ἑαυτὸν ἀγαπᾷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/028.yaml
  text: In the same way, husbands also ought to love their own wives as their own bodies. He who loves his own wife loves himself,
translation:
  language: ml
  text: അതുപോലെതന്നെ, ഭർത്താക്കന്മാരും സ്വന്തം ശരീരങ്ങളെപ്പോലെ സ്വന്തം ഭാര്യമാരെ സ്നേഹിക്കേണ്ടതാണ്. സ്വന്തം ഭാര്യയെ സ്നേഹിക്കുന്നവൻ തന്നെത്തന്നെ സ്നേഹിക്കുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: അതുപോലെതന്നെ
  rationale: മുൻവാക്യത്തിലെ മാതൃകയിലേക്കും താരതമ്യത്തിലേക്കും ബന്ധിപ്പിക്കുന്ന വിധത്തിൽ ഗ്രീക്കിലെ അനുമാനാത്മക-താരതമ്യ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὀφείλουσιν
  choice: സ്നേഹിക്കേണ്ടതാണ്
  rationale: ധാർമിക ബാധ്യത പ്രകടമാക്കുന്നു; ഗ്രീക്ക് നിർദേശാത്മക സന്ദർഭത്തിലെ വർത്തമാന സൂചകക്രിയയെ അതിരുകടന്ന കർശന കല്പനയാക്കി മാറ്റുന്നില്ല.
- source_word: καὶ οἱ ἄνδρες
  choice: ഭർത്താക്കന്മാരും
  rationale: καίയുടെ കൂട്ടിച്ചേർക്കൽഭാവം '-ഉം' കൊണ്ടും, ദാമ്പത്യസന്ദർഭത്തിലെ ἄνδρες എന്നതിന്റെ അർഥം 'ഭർത്താക്കന്മാർ' കൊണ്ടും വ്യക്തമാക്കുന്നു.
- source_word: ἀγαπᾶν
  choice: സ്നേഹിക്കേണ്ടതാണ്
  rationale: വാക്യത്തിൽ ആവർത്തിക്കുന്ന ἀγαπάω എന്ന ക്രിയയുടെ അർഥബന്ധം 'സ്നേഹിക്കുക' എന്ന ഒരേ പദത്തിലൂടെ സൂക്ഷിക്കുന്നു.
- source_word: τὰς ἑαυτῶν γυναῖκας
  choice: സ്വന്തം ഭാര്യമാരെ
  rationale: γυναῖκας എന്നത് ഇവിടെ ദാമ്പത്യസന്ദർഭത്തിൽ 'ഭാര്യമാർ' എന്നും ἑαυτῶν എന്ന പ്രത്യാവർത്തക ഊന്നൽ 'സ്വന്തം' എന്നും പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: ὡς τὰ ἑαυτῶν σώματα
  choice: സ്വന്തം ശരീരങ്ങളെപ്പോലെ
  rationale: ὡς എന്ന താരതമ്യവും σώματα എന്ന ബഹുവചനവും സ്വാഭാവികവും നേരിട്ടുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὁ ἀγαπῶν τὴν ἑαυτοῦ γυναῖκα
  choice: സ്വന്തം ഭാര്യയെ സ്നേഹിക്കുന്നവൻ
  rationale: പുരുഷ ഏകവചന ദാമ്പത്യസൂചനയും substantival participle-ന്റെ പൊതുസ്വഭാവവും മലയാളത്തിലെ '-ുന്നവൻ' രൂപത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: ἑαυτὸν ἀγαπᾷ
  choice: തന്നെത്തന്നെ സ്നേഹിക്കുന്നു
  rationale: പ്രത്യാവർത്തക സർവനാമത്തിന്റെ ഊന്നലും ആവർത്തിച്ചിരിക്കുന്ന 'സ്നേഹിക്കുക' എന്ന ക്രിയയും നേരിട്ട് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ദാമ്പത്യോപദേശത്തിലെ ലിംഗസൂചക ഭാഷ
  choice: '''ഭർത്താക്കന്മാർ'', ''സ്നേഹിക്കുന്നവൻ'' എന്നീ പുരുഷലിംഗ ദാമ്പത്യപദങ്ങൾ നിലനിർത്തി.'
  alternative: പൊതുവായ 'പുരുഷന്മാർ' അല്ലെങ്കിൽ ലിംഗനിരപേക്ഷമായ 'സ്നേഹിക്കുന്നയാൾ' എന്നു നൽകുക.
  rationale: സന്ദർഭം മനുഷ്യരെ പൊതുവായി കുറിച്ചല്ല, ഭർത്താക്കന്മാരോടുള്ള പ്രത്യേക ദാമ്പത്യോപദേശമാണ്; അതിനാൽ മൂലത്തിലെ ലിംഗവും ബന്ധവും കൃത്യമായി സൂക്ഷിക്കുന്നു.
- issue: ഭാര്യയെയും ശരീരത്തെയും സംബന്ധിച്ച താരതമ്യത്തിന്റെ സ്വഭാവം
  choice: താരതമ്യവും അതിൽനിന്നുള്ള നിഗമനവും വിശദീകരണം ചേർക്കാതെ നിലനിർത്തി.
  alternative: ഭാര്യയും ഭർത്താവിന്റെ ശരീരവും തമ്മിലുള്ള തത്ത്വശാസ്ത്രപരമായ ഐക്യം എന്ന നിലയിൽ വിപുലീകരിക്കുക.
  rationale: പൗലോസിന്റെ വാക്കുകൾ ഭർത്താവ് ഭാര്യയെ സ്നേഹിക്കുന്നതിനെ സ്വന്തം ശരീരത്തോടുള്ള സ്നേഹവുമായി താരതമ്യം ചെയ്ത്, ഭാര്യയെ സ്നേഹിക്കുന്നത് തന്നെത്തന്നെ സ്നേഹിക്കുന്നതാണെന്ന് പറയുന്നു. പരിഭാഷ ഈ ധാർമിക-ദൈവശാസ്ത്രപരമായ സംഘർഷം വ്യാഖ്യാനത്തിലൂടെ പരിഹരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. 'അതുപോലെതന്നെ' മുൻസന്ദർഭബന്ധം വ്യക്തമാക്കുന്നു; 'സ്നേഹിക്കേണ്ടതാണ്' ധാർമിക ബാധ്യതയെ സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായി അവതരിപ്പിക്കുന്നു. പദാവർത്തനങ്ങൾ മൂലത്തിലെ തർക്കഘടന സംരക്ഷിക്കാൻ ഉദ്ദേശപൂർവം നിലനിർത്തിയിരിക്കുന്നു.
