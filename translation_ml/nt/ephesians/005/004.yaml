source:
  edition: SBLGNT
  text: καὶ αἰσχρότης καὶ μωρολογία ἢ εὐτραπελία, ⸂ἃ οὐκ ἀνῆκεν⸃, ἀλλὰ μᾶλλον εὐχαριστία.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/004.yaml
  text: And obscenity and foolish talk or crude joking[a], which are not fitting[b], but rather thanksgiving.
translation:
  language: ml
  text: അശ്ലീലതയും മൂഢസംസാരമോ തരംതാണ തമാശയോ[a]—ഇവ ഉചിതമല്ല[b]—ഉണ്ടാകരുത്; പകരം നന്ദിപ്രകടനം ഉണ്ടാകട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അശോഭനമായ തമാശ.’ ഗ്രീക്ക് പദത്തിന് പൊതുവായി നർമ്മചാതുര്യം എന്ന അർഥവും വരാം; എന്നാൽ ഇവിടെ ഉചിതമല്ലാത്ത സംസാരത്തോടൊപ്പം ചേർത്തിരിക്കുന്നതിനാൽ അത് നിഷേധാർഥത്തിലാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഇവ യോജിച്ചതല്ല’ അല്ലെങ്കിൽ ‘ഇവ അനുചിതമാണ്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰσχρότης
  choice: അശ്ലീലത
  rationale: ഈ സന്ദർഭത്തിൽ തുടർന്നുവരുന്ന സംസാരദോഷങ്ങളോടും നന്ദിപ്രകടനത്തോടുള്ള വൈരുധ്യത്തോടും ചേർന്ന്, ലജ്ജാകരവും അശോഭനവുമായ സംസാരത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: μωρολογία
  choice: മൂഢസംസാരം
  rationale: മൂഢമോ വിവേകശൂന്യമോ ആയ സംസാരമെന്ന സംയുക്തപദത്തിന്റെ അർഥം വ്യക്തവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἢ
  choice: -യും
  rationale: ഗ്രീക്കിലെ ἢ പട്ടികയിലെ അവസാന ഇനത്തെ ബന്ധിപ്പിക്കുന്നു. മലയാളത്തിൽ ഈ നിരോധിത കാര്യങ്ങളുടെ സഞ്ചിത പട്ടിക സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ ‘-യും’ ഉപയോഗിച്ചു; അർഥം ഐച്ഛികമാക്കുന്നില്ല.
- source_word: εὐτραπελία
  choice: തരംതാണ തമാശ
  rationale: മറ്റിടങ്ങളിൽ ചാതുര്യമുള്ള നർമ്മം എന്ന നിഷ്പക്ഷ അർഥം വരാമെങ്കിലും, ഇവിടെ ദോഷങ്ങളുടെ കൂട്ടത്തിലും ‘ഉചിതമല്ല’ എന്ന വിലയിരുത്തലിനടിയിലും വരുന്നതിനാൽ അശോഭനമായ തമാശ എന്ന നിഷേധാർഥം ആവശ്യമാണ്.
- source_word: ἃ οὐκ ἀνῆκεν
  choice: ഇവ ഉചിതമല്ല
  rationale: നപുംസകലിംഗ ബഹുവചന സർവനാമം മുൻപുള്ള കാര്യങ്ങളെ ഒന്നാകെ സൂചിപ്പിക്കുന്നു; ‘ഉചിതമല്ല’ എന്നത് അനുചിതവും യോജിക്കാത്തതുമായ ധാർമിക ഭാവം ചുരുക്കമായി നിലനിർത്തുന്നു.
- source_word: ἀλλὰ μᾶλλον
  choice: പകരം
  rationale: നിരോധിത സംസാരത്തിനുപകരം വരേണ്ട സകാരാത്മക പ്രവൃത്തിയിലേക്കുള്ള ശക്തമായ വൈരുധ്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: εὐχαριστία
  choice: നന്ദിപ്രകടനം
  rationale: വെറും ഉള്ളിലെ നന്ദിയേക്കാൾ നന്ദി വാക്കായി പ്രകടിപ്പിക്കുന്ന നാമരൂപത്തെ സൂചിപ്പിക്കുകയും മുൻപുള്ള സംസാരദോഷങ്ങളോടുള്ള വൈരുധ്യം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ദോഷപ്പട്ടികയുടെ സംസാരസംബന്ധമായ വ്യാപ്തി
  choice: മൂന്നു നാമങ്ങളെയും പ്രധാനമായും സംസാരവുമായി ബന്ധപ്പെട്ട ദോഷങ്ങളായി അവതരിപ്പിച്ചു; അവയ്ക്കു പകരം നന്ദിപ്രകടനം വെച്ചു.
  alternative: αἰσχρότης എന്നത് സംസാരത്തിൽ മാത്രം ഒതുങ്ങാതെ പൊതുവായ ധാർമിക അശോഭനതയായി പരിഭാഷപ്പെടുത്തുക.
  rationale: μωρολογία, εὐτραπελία എന്നിവ വ്യക്തമായി സംസാരവുമായി ബന്ധപ്പെട്ടവയാണ്; εὐχαριστίαയും പ്രകടിപ്പിക്കപ്പെടുന്ന നന്ദിയെ സൂചിപ്പിക്കുന്നു. അതിനാൽ αἰσχρότης ഇവിടെ സംസാരസന്ദർഭത്തിൽ വായിക്കുന്നത് സന്ദർഭസഹജമാണ്, എങ്കിലും പദത്തിന്റെ വിശാലസാധ്യത കുറിപ്പിലൂടെ പൂർണമായി നിഷേധിക്കുന്നില്ല.
- issue: εὐτραπελίαയുടെ ധാർമിക മൂല്യനിർണയം
  choice: മുഖ്യപാഠത്തിൽ ‘തരംതാണ തമാശ’ എന്ന നിഷേധാർഥമുള്ള പ്രയോഗം സ്വീകരിച്ചു.
  alternative: ‘നർമ്മചാതുര്യം’ അല്ലെങ്കിൽ ‘ചാതുര്യമുള്ള തമാശ’ എന്ന നിഷ്പക്ഷ പ്രയോഗം.
  rationale: പദത്തിന് ചില ഗ്രീക്ക് പ്രയോഗങ്ങളിൽ അനുകൂലമോ നിഷ്പക്ഷമോ ആയ അർഥമുണ്ടെങ്കിലും, ഇവിടെ ദോഷങ്ങളുടെ പട്ടികയും ‘ഇവ ഉചിതമല്ല’ എന്ന വാക്യഭാഗവും നിഷേധാർഥം ആവശ്യപ്പെടുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിൽ പ്രധാനക്രിയ അധ്യാഹൃതമായതിനാൽ, മലയാളത്തിൽ പൂർണവാക്യത്തിനായി ‘ഉണ്ടാകരുത്’ എന്നും വൈരുധ്യം വ്യക്തമാക്കാൻ ‘ഉണ്ടാകേണ്ടത്’ എന്നും ചേർത്തു. മുഖ്യപാഠത്തിലെ എല്ലാ കുറിപ്പടയാളങ്ങളും [a], [b] എന്നിങ്ങനെ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
