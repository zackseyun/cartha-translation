translation:
  language: ml
  text: അതുകൊണ്ട്, അവരോടൊപ്പം പങ്കാളികളാകരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവരോടൊപ്പം പങ്കുചേരുന്നവരാകരുത്’ എന്നും വിവർത്തനം ചെയ്യാം. സന്ദർഭത്തിൽ, അവരുടെ പാപകരമായ നടത്തത്തിലോ അതിന്റെ ഫലങ്ങളിലോ പങ്കുചേരുന്നതാണ് ഉദ്ദേശ്യം.
