  text: For this reason[a], do not become foolish, but understand what the will of the Lord is.
translation:
  language: ml
  text: അതുകൊണ്ട്[a], വിവേകമില്ലാത്തവരായിത്തീരരുത്; പകരം, കർത്താവിന്റെ ഇഷ്ടം എന്താണെന്ന് മനസ്സിലാക്കുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അതിനാൽ, വിവേകമില്ലാത്തവരാകരുത്.’ ഗ്രീക്ക് ക്രിയയെ കൂടുതൽ അവസ്ഥാസൂചകമായി ‘ആകരുത്’ എന്നു പരിഭാഷപ്പെടുത്താം; എന്നാൽ ‘ആയിത്തീരരുത്’ എന്നത് γίνεσθε എന്ന ക്രിയയുടെ ഭാവം കൂടുതൽ വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: അതുകൊണ്ട്
  rationale: മുൻപത്തെ പ്രബോധനത്തിൽനിന്നുള്ള നിഗമനമോ കാരണബന്ധമോ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: μὴ γίνεσθε
  choice: ആയിത്തീരരുത്
  rationale: γίνομαι എന്ന ക്രിയയിലെ ഒരു അവസ്ഥയിലേക്കു വരുക എന്ന ചലനാത്മക ഭാവം വെറും ‘ആകരുത്’ എന്നതിനെക്കാൾ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἄφρονες
  choice: വിവേകമില്ലാത്തവർ
  rationale: പ്രായോഗിക ഗ്രാഹ്യത്തിന്റെയും ബുദ്ധിയുടെയും അഭാവമാണ് ἄφρων സൂചിപ്പിക്കുന്നത്; തുടർന്നുള്ള ‘മനസ്സിലാക്കുക’ എന്ന കല്പനയോടുള്ള വൈരുധ്യവും ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: ἀλλὰ
  choice: പകരം
  rationale: നിഷേധാത്മക കല്പനയ്ക്കും അനുകൂല കല്പനയ്ക്കും ഇടയിലെ ശക്തമായ വൈരുധ്യം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: συνίετε
  choice: മനസ്സിലാക്കുക
  rationale: ഗ്രഹിക്കുക, അർഥം തിരിച്ചറിയുക എന്ന συνίημι-യുടെ അടിസ്ഥാന ആശയം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: τί
  choice: എന്താണെന്ന്
  rationale: മനസ്സിലാക്കേണ്ട കാര്യത്തിന്റെ ഉള്ളടക്കം മലയാളത്തിൽ സ്വാഭാവികമായ പരോക്ഷചോദ്യരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: τὸ θέλημα
  choice: ഇഷ്ടം
  rationale: θέλημα ഇവിടെ ആഗ്രഹം, ഉദ്ദേശ്യം, ചെയ്യപ്പെടേണ്ടത് എന്നിവ ഉൾക്കൊള്ളുന്നു; ‘കർത്താവിന്റെ ഇഷ്ടം’ എന്നത് മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ പ്രയോഗമാണ്.
- source_word: τοῦ κυρίου
  choice: കർത്താവിന്റെ
  rationale: ഗ്രീക്കിലെ ബന്ധസൂചക രൂപം സംക്ഷിപ്തമായി നൽകുകയും, വാക്യം വ്യക്തമാക്കുന്നതിലധികം ‘കർത്താവ്’ ആരെന്നു നിർണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: τοῦ κυρίου എന്നതിലെ ‘കർത്താവ്’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: പ്രധാന പാഠത്തിൽ ‘കർത്താവ്’ എന്നു മാത്രം നിലനിർത്തി.
  alternative: ‘കർത്താവായ യേശു’ അല്ലെങ്കിൽ ‘ദൈവം’
  rationale: എഫെസ്യർ ലേഖനത്തിന്റെ സാഹചര്യത്തിൽ ഇത് യേശുവിനെ സൂചിപ്പിക്കാനുള്ള സാധ്യത ശക്തമാണെങ്കിലും, ഈ വാക്യം κυρίου എന്നു മാത്രമാണ് പറയുന്നത്. അതിനാൽ വിവർത്തനം അനാവശ്യമായ വ്യക്തീകരണം ചേർക്കുന്നില്ല.
- issue: μὴ γίνεσθε എന്ന വിലക്കിന്റെ ശക്തി
  choice: ‘ആയിത്തീരരുത്’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ആകരുത്’ അല്ലെങ്കിൽ ‘ആയിരിക്കുന്നതു നിർത്തുക’
  rationale: ഒരു അവസ്ഥയിലേക്കു വരുന്നതിനെ വിലക്കുന്ന ക്രിയാഭാവം നിലനിർത്തുന്നു; വായനക്കാർ ഇതിനകം പൂർണമായി അത്തരക്കാരാണെന്ന് പൗലോസ് കരുതുന്നു എന്ന ധ്വനി ഒഴിവാക്കുന്നു.
