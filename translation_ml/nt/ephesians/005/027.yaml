revisions:
- from: അവൻതന്നെ സഭയെ തേജസ്സോടെ[a] തനിക്കുതന്നെ സമർപ്പിക്കേണ്ടതിനും—അവൾക്ക് കറയോ ചുളിവോ അത്തരത്തിലുള്ള മറ്റെന്തെങ്കിലുമോ[b] ഇല്ലാതെ, വിശുദ്ധയും കുറ്റമറ്റവളുമായിരിക്കേണ്ടതിനും—ആണത്.
  to: അവൻതന്നെ സഭയെ തനിക്കുതന്നെ തേജസ്സുള്ളവളായി[a] സമർപ്പിക്കേണ്ടതിന്—അവൾ കറയോ ചുളിവോ അത്തരത്തിലുള്ള മറ്റെന്തെങ്കിലുമോ ഇല്ലാത്തവളായി, മറിച്ച് വിശുദ്ധയും കുറ്റമറ്റവളുമായിരിക്കേണ്ടതിന്.
  rationale: 'സഭയെ വിശേഷിപ്പിക്കുന്ന ἔνδοξον-ന്റെ ബന്ധം ‘തേജസ്സുള്ളവളായി’ എന്നതിലൂടെ വ്യക്തമാക്കി; മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘ആണത്’ നീക്കി ഉദ്ദേശ്യഘടന നിലനിർത്തി. ἀλλάയുടെ വിപരീതബന്ധം ‘മറിച്ച്’ എന്നതിലൂടെ സൂചിപ്പിച്ചു. മുഖ്യപാഠത്തിലെ b അടിക്കുറിപ്പ് അടയാളം ഇംഗ്ലീഷ് audit trail-ൽ ‘or any such thing’ എന്നതിന് ഉണ്ട്; തിരുത്തിയ മലയാള മുഖ്യപാഠത്തിൽ അതേ സ്ഥാനത്ത് [b] ഉൾപ്പെടുത്തേണ്ടതായിരുന്നു. അതിനാൽ പൂർണമായി ശരിയാക്കിയ പാഠം താഴെപ്പറയുന്നതാണ്: ‘അവൻതന്നെ സഭയെ തനിക്കുതന്നെ തേജസ്സുള്ളവളായി[a] സമർപ്പിക്കേണ്ടതിന്—അവൾ കറയോ ചുളിവോ അത്തരത്തിലുള്ള മറ്റെന്തെങ്കിലുമോ[b] ഇല്ലാത്തവളായി, മറിച്ച് വിശുദ്ധയും കുറ്റമറ്റവളുമായിരിക്കേണ്ടതിന്.’'
