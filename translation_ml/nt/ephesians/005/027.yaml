id: EPH.5.27
reference: Ephesians 5:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἵνα παραστήσῃ ⸀αὐτὸς ἑαυτῷ ἔνδοξον τὴν ἐκκλησίαν, μὴ ἔχουσαν σπίλον ἢ ῥυτίδα ἤ τι τῶν τοιούτων, ἀλλ’ ἵνα ᾖ ἁγία καὶ ἄμωμος.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/027.yaml
  text: so that he himself might present the church to himself in splendor[a], not having spot or wrinkle or anything like that[c][b], but so that she might be holy and blameless.
translation:
  language: ml
  text: അവൻതന്നെ സഭയെ തനിക്കുതന്നെ തേജസ്സുള്ളവളായി[a] സമർപ്പിക്കേണ്ടതിന്—അവൾ കറയോ ചുളിവോ അത്തരത്തിലുള്ള മറ്റെന്തെങ്കിലുമോ ഇല്ലാത്തവളായി, മറിച്ച് വിശുദ്ധയും കുറ്റമറ്റവളുമായിരിക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘മഹത്ത്വമുള്ളവളായി’; ἔνδοξον എന്ന ഗ്രീക്ക് വിശേഷണം ഒരു ഗുണമായോ (‘മഹത്ത്വമുള്ള’) ഒരു അവസ്ഥയായോ (‘തേജസ്സുള്ളവളായി’) പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραστήσῃ
  choice: സമർപ്പിക്കേണ്ടതിന്
  rationale: ἵναയോടുകൂടിയ aorist subjunctive ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു. ഔപചാരികമായി ഒരാളെ മുമ്പിൽ കൊണ്ടുവന്ന് നിർത്തുക/സമർപ്പിക്കുക എന്ന അർഥവും വിവാഹരൂപകവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: αὐτὸς
  choice: അവൻതന്നെ
  rationale: പ്രകടമായി നൽകിയിരിക്കുന്ന emphatic pronoun-ന്റെ ഊന്നൽ സംരക്ഷിക്കുന്നു.
- source_word: ἑαυτῷ
  choice: തനിക്കുതന്നെ
  rationale: reflexive dative-ന്റെ ശക്തി നിലനിർത്തുകയും, അത് ദൈവത്തിന്റെ മുമ്പാകെയെന്ന വ്യാഖ്യാനമായി മാറ്റാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἔνδοξον
  choice: തേജസ്സോടെ
  rationale: സഭയെ സമർപ്പിക്കുന്ന അവസ്ഥയായി adjective-നെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ‘മഹത്ത്വമുള്ള’ എന്നും സാധ്യമാണ്.
- source_word: ἐκκλησίαν
  choice: സഭയെ
  rationale: ഇവിടെ പൗലോസിന്റെ പ്രയോഗത്തിൽ ദൈവജനത്തിന്റെ സമൂഹത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും സന്ദർഭോചിതവുമായ പദം.
- source_word: μὴ ἔχουσαν
  choice: അവൾക്ക് ... ഇല്ലാതെ
  rationale: സ്ത്രീലിംഗ participle സഭയുടെ അവസ്ഥയെ വിവരിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ രീതിയിൽ നിഷേധാത്മക അവസ്ഥ പ്രകടമാക്കുന്നു.
- source_word: σπίλον
  choice: കറ
  rationale: ശുദ്ധിയുടെയും വധൂസൗന്ദര്യത്തിന്റെയും മൂർത്തമായ രൂപകം നിലനിർത്തുന്നു; ‘കളങ്കം’ എന്ന അമൂർത്ത അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: ῥυτίδα
  choice: ചുളിവ്
  rationale: നേരിട്ടുള്ള ആധുനിക മലയാള തുല്യപദം; വധൂരൂപകത്തിലെ ദൃശ്യചിത്രം സംരക്ഷിക്കുന്നു.
- source_word: ἤ τι τῶν τοιούτων
  choice: അത്തരത്തിലുള്ള മറ്റെന്തെങ്കിലുമോ
  rationale: രണ്ട് ഉദാഹരണങ്ങൾക്കപ്പുറം വിഭാഗത്തെ തുറന്നുവയ്ക്കുന്ന ഗ്രീക്ക് പ്രയോഗം സ്വാഭാവികമായി പകരുന്നു.
- source_word: ἀλλ’ ἵνα ᾖ
  choice: വിശുദ്ധയും കുറ്റമറ്റവളുമായിരിക്കേണ്ടതിന്
  rationale: രണ്ടാമത്തെ ἵνα clause ആദ്യ ഉദ്ദേശ്യവാക്യത്തിന്റെ അനുകൂല പൂരകമാണ്; സ്ത്രീലിംഗരൂപം സഭയിലേക്കുള്ള സൂചന വ്യക്തമാക്കുന്നു.
- source_word: ἁγία
  choice: വിശുദ്ധ
  rationale: സ്ഥാപിതവും ദൈവശാസ്ത്രഭാരം നിലനിർത്തുന്നതുമായ പരിഭാഷ; വെറും ‘വേർതിരിക്കപ്പെട്ട’ എന്ന വിശദീകരണത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: ἄμωμος
  choice: കുറ്റമറ്റ
  rationale: ദോഷമോ കുറ്റാരോപണത്തിനുള്ള അടിസ്ഥാനമോ ഇല്ലാത്ത അവസ്ഥ സൂചിപ്പിക്കുന്നു; മുമ്പുള്ള ‘കറ’ ദൃശ്യമായ blemish imagery ഇതിനകം വഹിക്കുന്നു.
theological_decisions:
- issue: ക്രിസ്തു സഭയെ തനിക്കുതന്നെ സമർപ്പിക്കുന്ന reflexive രൂപകം
  choice: ‘അവൻതന്നെ ... തനിക്കുതന്നെ’ എന്ന ഇരട്ട ഊന്നൽ നിലനിർത്തി.
  alternative: ‘സഭയെ സമർപ്പിക്കാൻ’ എന്നു ലളിതമാക്കുക, അല്ലെങ്കിൽ ‘ദൈവത്തിന്റെ മുമ്പാകെ’ എന്ന് വ്യാഖ്യാനിച്ച് ചേർക്കുക.
  rationale: ഗ്രീക്കിൽ αὐτός, ἑαυτῷ എന്നിവ രണ്ടും വ്യക്തമാണ്. അവയുടെ ദൈവശാസ്ത്രപരവും സാഹിത്യപരവുമായ സംഘർഷം പരിഹരിക്കാതെ സംരക്ഷിക്കണം.
- issue: സഭയെക്കുറിച്ചുള്ള ശുദ്ധിഭാഷ
  choice: ‘കറയോ ചുളിവോ ... വിശുദ്ധയും കുറ്റമറ്റവളും’ എന്ന് വധൂസൗന്ദര്യവും നൈതിക/യാഗശുദ്ധിയും ഒരുമിച്ച് നിലനിർത്തി.
  alternative: ‘കളങ്കമോ ചുളിവോ ... വിശുദ്ധയും കളങ്കമില്ലാത്തവളും’ എന്ന് ഒരേ blemish പദസഞ്ചയം ആവർത്തിക്കുക.
  rationale: വാക്യം മൂർത്തമായ ശരീര/വധൂരൂപകവും വിശുദ്ധി-ദോഷരാഹിത്യ ഭാഷയും ചേർക്കുന്നു; ഒറ്റ സിദ്ധാന്തവായനയിലേക്ക് ചുരുക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നീണ്ട ഗ്രീക്ക് ഉദ്ദേശ്യഘടനയുടെ ബന്ധം വ്യക്തമാക്കാൻ dash ഉപയോഗിച്ചു. സഭയെ സൂചിപ്പിക്കുന്ന സ്ത്രീലിംഗസർവനാമവും വിധേയവിശേഷണങ്ങളും വിവാഹരൂപകം നിലനിർത്തുന്നു; എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
