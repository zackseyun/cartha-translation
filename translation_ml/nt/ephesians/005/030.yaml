lexical_decisions:
- source_word: ὅτι
  choice: കാരണം
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞതിന്റെ അടിസ്ഥാനമോ വിശദീകരണമോ അവതരിപ്പിക്കുന്ന കാരണസൂചക പ്രയോഗം; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി കാരണബന്ധം നിലനിർത്തുന്നു.
- source_word: μέλη
  choice: അവയവങ്ങൾ
  rationale: ശരീരത്തിന്റെ ഘടകഭാഗങ്ങളെ സൂചിപ്പിക്കുകയും പൗലോസിന്റെ ശരീരരൂപകത്തെ വ്യക്തമായി നിലനിർത്തുകയും ചെയ്യുന്നു; വെറും ‘ഭാഗങ്ങൾ’ എന്നതിനെക്കാൾ ജൈവശരീരത്തിന്റെ ചിത്രം ശക്തമാണ്.
- source_word: ἐσμὲν
  choice: ആണ്
  rationale: ഒന്നാംപുരുഷ ബഹുവചന വർത്തമാനകാല അർഥം ‘നാം ... ആണ്’ എന്ന സ്വാഭാവിക മലയാളഘടനയിൽ നൽകുന്നു.
- source_word: τοῦ σώματος
  choice: ശരീരത്തിന്റെ
  rationale: സഭയും ക്രിസ്തുവും തമ്മിലുള്ള ബന്ധത്തെ അവതരിപ്പിക്കുന്ന ശരീരരൂപകം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: αὐτοῦ
  choice: അവന്റെ
  rationale: സന്ദർഭത്തിൽ സർവനാമം ക്രിസ്തുവിനെ സൂചിപ്പിക്കുന്നു; വ്യക്തിപരമായ പരാമർശം മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘അവന്റെ മാംസത്തിൽനിന്നും അവന്റെ അസ്ഥികളിൽനിന്നും’ എന്ന ദീർഘമായ ബൈസന്റൈൻ വായന ഉൾപ്പെടുത്തണമോ എന്നത്
  choice: 'SBLGNT-യിലെ ഹ്രസ്വവായന മാത്രം മുഖ്യപാഠത്തിൽ പരിഭാഷപ്പെടുത്തി: ‘കാരണം നാം അവന്റെ ശരീരത്തിന്റെ അവയവങ്ങളാണ്.’'
  alternative: ‘കാരണം നാം അവന്റെ ശരീരത്തിന്റെ—അവന്റെ മാംസത്തിന്റെയും അസ്ഥികളുടെയും—അവയവങ്ങളാണ്.’
  rationale: നൽകിയിരിക്കുന്ന ഗ്രീക്ക് സ്രോതസ്സിൽ ഹ്രസ്വവായനയാണ് ഉള്ളത്. ദീർഘവായന പാഠഭേദമായി അടിക്കുറിപ്പിൽ നൽകുന്നത് സ്രോതസ്സിനോടുള്ള വിശ്വസ്തതയും പാഠചരിത്രത്തിലെ സുതാര്യതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘അവയവങ്ങൾ’ എന്ന പദം ഗ്രീക്കിലെ ശരീരരൂപകവും സഭയുടെ കൂട്ടായ ബന്ധസൂചനയും നിലനിർത്തുന്നു.
