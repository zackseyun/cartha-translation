source:
  edition: SBLGNT
  text: Μηδεὶς ὑμᾶς ἀπατάτω κενοῖς λόγοις, διὰ ταῦτα γὰρ ἔρχεται ἡ ὀργὴ τοῦ θεοῦ ἐπὶ τοὺς υἱοὺς τῆς ἀπειθείας.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/006.yaml
  text: Let no one deceive you with empty words[a], for because of these things the wrath of God comes upon the sons of disobedience.
translation:
  language: ml
  text: പൊള്ളയായ വാക്കുകളാൽ ആരും നിങ്ങളെ വഞ്ചിക്കാതിരിക്കട്ടെ. ഈ കാര്യങ്ങൾ നിമിത്തം ദൈവത്തിന്റെ ക്രോധം അനുസരണക്കേടിന്റെ പുത്രന്മാരുടെ മേൽ വരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അനുസരണക്കേടിന്റെ മക്കൾ’; അതായത്, അനുസരണക്കേടാൽ അടയാളപ്പെടുന്നവർ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδεὶς … ἀπατάτω
  choice: ആരും നിങ്ങളെ വഞ്ചിക്കാതിരിക്കട്ടെ
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാല ആജ്ഞാരൂപത്തിലുള്ള നിരോധനത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ കൃത്യമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: κενοῖς λόγοις
  choice: പൊള്ളയായ വാക്കുകൾകൊണ്ട്
  rationale: κενοῖς എന്നതിലെ ഉള്ളടക്കമില്ലായ്മയും വ്യർഥതയും സൂചിപ്പിക്കുന്ന രൂപകം നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി ഗ്രഹിക്കാവുന്ന പ്രയോഗം.
- source_word: διὰ ταῦτα
  choice: ഇവ നിമിത്തമാണ്
  rationale: διάയും ദ്വിതീയാവിഭക്തിയും ചേർന്നുള്ള കാരണാർഥം വ്യക്തമായി നൽകുകയും മുൻസന്ദർഭത്തിലെ പ്രവൃത്തികളിലേക്കുള്ള ταῦτα എന്ന സൂചന നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἔρχεται
  choice: വരുന്നത്
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാലരൂപം ഭാവികാലമായി മാത്രം പരിമിതപ്പെടുത്താതെ പൊതുവായതോ അടുത്തുവരുന്നതോ ആയ അർഥസാധ്യത നിലനിർത്തുന്നു.
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ ക്രോധം
  rationale: ὀργήയുടെ ശക്തമായ ദൈവന്യായവിധിസംബന്ധിയായ ഭാഷ മയപ്പെടുത്താതെ നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: τοὺς υἱοὺς τῆς ἀπειθείας
  choice: അനുസരണക്കേടിന്റെ പുത്രന്മാർ
  rationale: ഗ്രീക്കിലെ സെമിറ്റിക് സ്വഭാവസൂചക പ്രയോഗവും υἱούς എന്ന പദത്തിന്റെ രൂപവും മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; ഉദ്ദേശ്യാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ദൈവക്രോധത്തെ സൂചിപ്പിക്കുന്ന ഭാഷ
  choice: ദൈവത്തിന്റെ ക്രോധം
  alternative: ദൈവത്തിന്റെ ന്യായവിധി
  rationale: മൂലപാഠത്തിൽ പൊതുവായ ന്യായവിധിപദമല്ല, ὀργή എന്ന വ്യക്തമായ പദമാണ്; അതിന്റെ ദൈവശാസ്ത്രപരമായ ശക്തി മയപ്പെടുത്തുന്നില്ല.
- issue: τοὺς υἱοὺς τῆς ἀπειθείας എന്ന സ്വഭാവസൂചക പ്രയോഗം
  choice: അനുസരണക്കേടിന്റെ പുത്രന്മാർ
  alternative: അനുസരണക്കേടുള്ളവർ
  rationale: മൂലത്തിലെ രൂപകം മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുകയും അത് അനുസരണക്കേടിനാൽ സ്വഭാവീകരിക്കപ്പെടുന്ന ആളുകളെ സൂചിപ്പിക്കുന്നുവെന്ന് അടിക്കുറിപ്പിൽ വിശദീകരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അനുസരണക്കേടിന്റെ പുത്രന്മാർ’ എന്ന അല്പം ഔപചാരികമായ പ്രയോഗം മൂലത്തിലെ രൂപകം സംരക്ഷിക്കാൻ ബോധപൂർവം നിലനിർത്തി; അതിന്റെ അർഥം അടിക്കുറിപ്പിൽ തുറന്നുകാട്ടുന്നു.
