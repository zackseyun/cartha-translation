  yaml_path: translation/nt/ephesians/005/003.yaml
  text: But sexual immorality and every impurity or greed must not even be named among you[a], as is proper for saints[c][b],
translation:
  language: ml
  text: എന്നാൽ ലൈംഗിക അധാർമികതയും എല്ലാത്തരം അശുദ്ധിയും അത്യാഗ്രഹവും[b] നിങ്ങളുടെ ഇടയിൽ പേരുപോലും പറയപ്പെടരുത്[a]; വിശുദ്ധർക്കു യോജിക്കുന്നതുപോലെ.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘ഇവയെക്കുറിച്ച് നിങ്ങളുടെ ഇടയിൽ പരാമർശംപോലും ഉണ്ടാകരുത്.’'
    reason: lexical_alternative
  - marker: b
    text: ‘അത്യാഗ്രഹം’ എന്നതിന് ‘ദുരാഗ്രഹം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: ഇവിടെ ‘വിശുദ്ധർ’ എന്നു പറയുന്നത് പിന്നീട് ഔദ്യോഗികമായി വിശുദ്ധപദവി ലഭിച്ച ഒരു പ്രത്യേക വിഭാഗത്തെയല്ല, ദൈവത്തിന്റെ വിശുദ്ധജനമായ എല്ലാ വിശ്വാസികളെയുമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: Πορνεία
  choice: ലൈംഗിക അധാർമികത
  rationale: അനുവദനീയമല്ലാത്ത ലൈംഗിക പെരുമാറ്റങ്ങളെ വിശാലമായി സൂചിപ്പിക്കുന്ന പദമാണിത്; വിവാഹപൂർവ ലൈംഗികബന്ധത്തിലേക്ക് മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിൽനിന്നുള്ള മൃദുവായ വിരുദ്ധതയും വിഷയമാറ്റവും വ്യക്തമാക്കുന്നു.
- source_word: ἀκαθαρσία πᾶσα
  choice: ഏതുതരം അശുദ്ധി
  rationale: πᾶσα നൽകുന്ന സമഗ്രത സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἢ
  choice: അല്ലെങ്കിൽ
  rationale: പട്ടികയിലെ മറ്റൊരു നിരോധിത വിഭാഗത്തെ വേർതിരിക്കുന്ന ഗ്രീക്കിലെ വികല്പസൂചക ബന്ധകം നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: πλεονεξία
  choice: അത്യാഗ്രഹം
  rationale: കൂടുതൽ സ്വന്തമാക്കാനുള്ള സ്വാർഥവും പിടിച്ചുപറിയുമായ മോഹത്തെ സൂചിപ്പിക്കുന്ന വിശാലമായ അർഥം നിലനിർത്തുന്നു; ലൈംഗികമോഹത്തിലേക്ക് മാത്രമായി ചുരുക്കുന്നില്ല.
- source_word: μηδὲ ὀνομαζέσθω
  choice: പേരുപോലും പറയപ്പെടരുത്
  rationale: ശക്തമായ നിരോധനവും ‘പോലും’ എന്ന ഊന്നലും പാസീവ് രൂപവും നിലനിർത്തുന്നു.
- source_word: ἐν ὑμῖν
  choice: നിങ്ങളുടെ ഇടയിൽ
  rationale: വ്യക്തിയുടെ ഉള്ളിലുള്ള അനുഭവമെന്നതിലുപരി വിശ്വാസിസമൂഹത്തിനിടയിലെ അവസ്ഥയാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്.
- source_word: καθὼς πρέπει
  choice: യോജിച്ചതും അതുതന്നെ
  rationale: വിശുദ്ധർക്കു ചേരുന്ന ധാർമിക ഔചിത്യത്തിന്റെ മാനദണ്ഡം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἁγίοις
  choice: വിശുദ്ധർ
  rationale: ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ട വിശ്വാസികളെ സൂചിപ്പിക്കുന്ന പൗലോസിന്റെ പതിവുപയോഗം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ലൈംഗിക ദുഷ്പ്രവൃത്തികൾ ഉൾപ്പെടുന്ന പട്ടികയിൽ πλεονεξία എന്നതിന്റെ അർഥം
  choice: വിശാലമായ ‘അത്യാഗ്രഹം’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ദുരാഗ്രഹം; ലൈംഗിക അത്യാഗ്രഹം
  rationale: സന്ദർഭം ലൈംഗിക ധാർമികതയെ ഉൾക്കൊള്ളുന്നുവെങ്കിലും πλεονεξία എന്ന പദം പൗലോസിന്റെ പ്രയോഗത്തിൽ വിശാലമായ ദോഷമാണ്; വാചകത്തിൽ വ്യക്തമായ അടിസ്ഥാനമില്ലാതെ അതിനെ ലൈംഗികമോഹമായി ചുരുക്കിയിട്ടില്ല.
- issue: ἁγίοις ആരെ സൂചിപ്പിക്കുന്നു
  choice: എല്ലാ വിശ്വാസികളെയും ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ട ജനമായി സൂചിപ്പിക്കുന്ന ‘വിശുദ്ധർ’.
  alternative: വിശുദ്ധജനങ്ങൾ; ദൈവത്തിന്റെ വിശുദ്ധജനം
  rationale: പിന്നീടുള്ള ഔദ്യോഗിക വിശുദ്ധപദവി ലഭിച്ച ഒരു പ്രത്യേക വിഭാഗത്തെയല്ല, ക്രിസ്തുവിലുള്ള വിശ്വാസിസമൂഹത്തെയാണ് പദം സൂചിപ്പിക്കുന്നത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ പട്ടികയുടെ വ്യാപ്തിയും ‘പേരുപോലും’ എന്ന ഊന്നലും നിലനിർത്തി; സഭാപാരമ്പര്യത്തിലെ പ്രത്യേക അർഥം തെറ്റായി വായിക്കാതിരിക്കാൻ ‘വിശുദ്ധർ’ എന്നതിന് വിശദീകരണ അടിക്കുറിപ്പ് ചേർത്തു.
