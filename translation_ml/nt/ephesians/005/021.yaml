  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മശീഹയോടുള്ള ഭയഭക്തിയിൽ’ അല്ലെങ്കിൽ ‘മശീഹയോടുള്ള വിസ്മയാദരത്തിൽ.’
