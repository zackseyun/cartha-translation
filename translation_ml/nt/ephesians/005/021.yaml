lexical_decisions:
- source_word: ὑποτασσόμενοι
  choice: കീഴടങ്ങിക്കൊണ്ട്
  rationale: വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ തുടർച്ചാഭാവം നിലനിർത്തുന്നു; ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത ആത്മനേപദപ്രയോഗം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: ἀλλήλοις
  choice: പരസ്പരം
  rationale: ദത്തിവിലുള്ള അന്യോന്യസർവനാമത്തിന്റെ അർഥം സ്വാഭാവികവും വ്യക്തവുമായി നൽകുന്നു.
- source_word: ἐν
  choice: -ത്തിൽ
  rationale: φόβῳ എന്ന പദത്തോടൊപ്പം സാഹചര്യമോ മനോഭാവമോ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം മലയാളത്തിൽ ‘ഭയത്തിൽ’ എന്നു സമീപമായി നിലനിർത്തുന്നു.
- source_word: φόβῳ
  choice: ഭയം
  rationale: പദത്തിന്റെ അടിസ്ഥാനാർഥവും ദൈവശാസ്ത്രപരമായ ശക്തിയും നിലനിർത്തുന്നു; ‘ഭയഭക്തി’, ‘ആദരവ്’ തുടങ്ങിയ മൃദുവായ സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: Χριστοῦ
  choice: മശീഹ
  rationale: ഇവിടെ Χριστός പദവിനാമമായി പ്രവർത്തിക്കുന്നതിനാൽ പരമ്പരാഗത ലിപ്യന്തരണമായ ‘ക്രിസ്തു’ എന്നതിനു പകരം ‘മശീഹ’ ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: ‘മശീഹയോടുള്ള ഭയം’ എന്നതിന്റെ അർഥം
  choice: മശീഹയെ ലക്ഷ്യമാക്കിയ ഭയഭക്തിയുള്ള ഭയം
  alternative: മശീഹ ഉളവാക്കുന്ന ഭയം; മശീഹയോടുള്ള ആദരവ്
  rationale: ബന്ധത്തിന്റെ ഏറ്റവും സ്വാഭാവികമായ വായന മശീഹയോടു directed ആയ ഭയമാണ്. മുഖ്യപാഠത്തിൽ ‘ഭയം’ നിലനിർത്തുന്നത് അതിനെ വെറും ആദരവായി ചുരുക്കാതെ ഉള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷം സംരക്ഷിക്കുന്നു.
- issue: Χριστοῦ എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഈ സന്ദർഭത്തിൽ പദവിനാമത്തിന്റെ ശക്തി സജീവമായതിനാൽ അർഥപരമായ പരിഭാഷ തിരഞ്ഞെടുത്തു; പരിചിതമായ പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- issue: കൃദന്തരൂപത്തിന്റെ വാക്യബന്ധം
  choice: ‘കീഴടങ്ങിക്കൊണ്ട്’ എന്ന അപൂർണ ക്രിയാരൂപം
  alternative: ‘കീഴടങ്ങുവിൻ’ എന്ന സ്വതന്ത്ര ആജ്ഞ
  rationale: ὑποτασσόμενοι ഒരു കൃദന്തരൂപമാണ്; അതിനെ സ്വതന്ത്ര ആജ്ഞയാക്കി മാറ്റാതെ മുൻസന്ദർഭത്തോടുള്ള വ്യാകരണബന്ധം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘കീഴടങ്ങിക്കൊണ്ട്’ കൃദന്തരൂപം സംരക്ഷിക്കുന്നു; ‘പരസ്പരം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ നൽകിയിട്ടുണ്ട്.
