  source_fidelity: The main clause accurately reflects the reciprocal dative (ἀλλήλοις), the participial form (ὑποτασσόμενοι), and the objective sense of ἐν φόβῳ Χριστοῦ. ‘മശീഹയോടുള്ള ഭയത്തിൽ’ suitably retains the stronger lexical sense of φόβος without reducing it to mere respect.
