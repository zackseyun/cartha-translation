  terminology: ‘മശീഹ’ appropriately renders Χριστός as a title in accordance with the supplied translation policy. The draft’s theological decision says the conventional ‘ക്രിസ്തു’ is preserved in a footnote, but its current footnotes do not provide that alternative. The revised footnote set restores it while retaining the useful grammatical clarification.
