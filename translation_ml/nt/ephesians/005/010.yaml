  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: δοκιμάζοντες τί ἐστιν εὐάρεστον τῷ κυρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/010.yaml
  text: testing what is pleasing to the Lord;[a]
translation:
  language: ml
  text: കർത്താവിന് പ്രസാദകരമായത് എന്തെന്ന് പരിശോധിച്ചറിഞ്ഞുകൊണ്ട്;[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കർത്താവിന് പ്രസാദകരമായത് എന്തെന്ന് വിവേചിച്ചറിഞ്ഞുകൊണ്ട്” അല്ലെങ്കിൽ “കണ്ടെത്തിക്കൊണ്ട്.”
    reason: δοκιμάζοντες എന്ന പദത്തിന് പരിശോധിച്ച് വിലയിരുത്തുക, വിവേചിച്ചറിയുക, കണ്ടെത്തുക എന്നീ പരസ്പരം ബന്ധപ്പെട്ട അർഥസാധ്യതകളുണ്ട്.
lexical_decisions:
- source_word: δοκιμάζοντες
  choice: പരിശോധിച്ചറിയുവിൻ
  rationale: ഈ വർത്തമാനകാല കർത്തരി കൃദന്തം ചുറ്റുപാടിലെ പ്രബോധനധാര തുടരുന്നു. മലയാളത്തിൽ പൂർണ്ണമായ സ്വാഭാവികതയ്ക്കായി ആജ്ഞാരൂപത്തിൽ നൽകി. ‘പരിശോധിക്കുക’ എന്ന വിലയിരുത്തൽഭാവവും ‘അറിയുക’ എന്ന കണ്ടെത്തൽഭാവവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: τί
  choice: എന്തെന്ന്
  rationale: പരോക്ഷചോദ്യത്തിലെ ‘എന്ത്’ എന്ന അർഥം സ്വാഭാവികമായ മലയാളവാക്യഘടനയിൽ ‘എന്തെന്ന്’ ആയി നൽകി.
- source_word: ἐστιν
  choice: ആയത്
  rationale: ഗ്രീക്കിലെ ബന്ധകക്രിയയുടെ അർഥം ‘പ്രസാദകരമായത്’ എന്ന മലയാള നാമീകൃത ഘടനയിൽ ഉൾക്കൊള്ളുന്നു; വേറൊരു ‘ആകുന്നു’ ചേർക്കുന്നത് അസ്വാഭാവികമാകും.
- source_word: εὐάρεστον
  choice: പ്രസാദകരമായത്
  rationale: കർത്താവിന് ഇഷ്ടവും അംഗീകാര്യവുമായതെന്ന ബന്ധപരമായ അർഥം മാന്യവും സാധാരണക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: τῷ κυρίῳ
  choice: കർത്താവിന്
  rationale: εὐάρεστον-നോടൊപ്പമുള്ള ദത്തിവിഭക്തി മലയാളത്തിൽ ‘കർത്താവിന് പ്രസാദകരം’ എന്ന് സ്വാഭാവികമായി വരുന്നു. κύριος എന്ന പദത്തെ കൂടുതൽ വിശദീകരിക്കാതെ ‘കർത്താവ്’ എന്നു നിലനിർത്തുന്നു.
theological_decisions:
- issue: κύριος എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: കർത്താവ്
  alternative: കർത്താവായ യേശു / ദൈവം
  rationale: ഗ്രീക്ക് പാഠം κύριος എന്ന സ്ഥാനപ്പേര് മാത്രമേ ഉപയോഗിക്കുന്നുള്ളൂ. സന്ദർഭത്തിൽ അത് ക്രിസ്തുവിനെ സൂചിപ്പിക്കാമെങ്കിലും, വിവർത്തനം വാക്യം വ്യക്തമായി പറയുന്നതിലപ്പുറം നിർണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ചുറ്റുപാടിലെ കൃദന്തരൂപത്തിലുള്ള പ്രബോധനധാര മലയാളത്തിൽ ഒറ്റവാക്യമായി സ്വാഭാവികമായി വായിക്കാനായി ആജ്ഞാരൂപം ഉപയോഗിച്ചു. ‘പ്രസാദകരമായത്’ സഭാപരിചയമുള്ളതും പൊതുവായ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ പദമാണ്.
