source:
  edition: SBLGNT
  text: πλὴν καὶ ὑμεῖς οἱ καθ’ ἕνα ἕκαστος τὴν ἑαυτοῦ γυναῖκα οὕτως ἀγαπάτω ὡς ἑαυτόν, ἡ δὲ γυνὴ ἵνα φοβῆται τὸν ἄνδρα.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/033.yaml
  text: Nevertheless[a], you also—each one individually—must love his own wife as himself[b], and the wife must fear her husband.
translation:
  language: ml
  text: എന്നിരുന്നാലും, നിങ്ങളും—ഓരോരുത്തനും—തന്റെ ഭാര്യയെ തന്നെപ്പോലെ ഇങ്ങനെ സ്നേഹിക്കട്ടെ[b]; ഭാര്യയാകട്ടെ ഭർത്താവിനോട് ഭയഭക്തി കാണിക്കട്ടെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഭയഭക്തി കാണിക്കട്ടെ” എന്നതിന് അക്ഷരാർഥത്തിൽ “ഭയപ്പെടട്ടെ” എന്നും പറയാം; ഇവിടെ ഭീതിയേക്കാൾ ആദരപൂർവമായ ഭയഭക്തിയാണ് ഉദ്ദേശിക്കപ്പെടുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: “നിങ്ങളും—ഓരോരുത്തനും—” എന്നത് ഈ നിർദേശം ഓരോ ഭർത്താവിനും വ്യക്തിപരമായി ബാധകമാണെന്ന് ഊന്നിപ്പറയുന്ന ഗ്രീക്ക് വിതരണാത്മക പ്രയോഗത്തെ പ്രതിഫലിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: എന്നിരുന്നാലും
  rationale: മുൻചർച്ചയിൽനിന്ന് പ്രായോഗികമായ സമാപനനിർദേശത്തിലേക്കുള്ള വിരുദ്ധതയോടുകൂടിയ മാറ്റം സൂചിപ്പിക്കുന്നു.
- source_word: καὶ ὑμεῖς οἱ καθ’ ἕνα ἕκαστος
  choice: നിങ്ങളിൽ ഓരോരുത്തനും
  rationale: ഓരോ ഭർത്താവിനും വ്യക്തിപരമായി ബാധകമായ വിതരണാത്മക ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τὴν ἑαυτοῦ γυναῖκα
  choice: തന്റെ ഭാര്യയെ
  rationale: വൈവാഹിക സന്ദർഭത്തിലെ γυνή എന്നതും ἑαυτοῦ എന്ന പ്രത്യാവർത്തക ഉടമസ്ഥതയും കൃത്യമായി നൽകുന്നു.
- source_word: οὕτως ἀγαπάτω
  choice: ഇങ്ങനെ സ്നേഹിക്കട്ടെ
  rationale: οὕτως എന്ന പിന്നോട്ടു ചൂണ്ടുന്ന ഭാവവും മൂന്നാംപുരുഷ ആജ്ഞാരൂപത്തിന്റെ പ്രബോധനശക്തിയും സംരക്ഷിക്കുന്നു.
- source_word: ὡς ἑαυτόν
  choice: തന്നെപ്പോലെ
  rationale: സ്വയം സ്നേഹിക്കുന്നതിനെ താരതമ്യത്തിന്റെ മാനദണ്ഡമാക്കുന്ന ഗ്രീക്ക് പ്രയോഗം ചുരുക്കമായി നിലനിർത്തുന്നു.
- source_word: ἡ δὲ γυνὴ
  choice: ഭാര്യയാകട്ടെ
  rationale: δέ രണ്ടാമത്തെ സമാന്തര നിർദേശം അടയാളപ്പെടുത്തുന്നു; വൈവാഹിക സന്ദർഭത്തിൽ γυνή ‘ഭാര്യ’ എന്നാണ്.
- source_word: ἵνα φοβῆται
  choice: ഭയഭക്തിയോടെ ആദരിക്കട്ടെ
  rationale: φοβέομαι എന്നതിലെ ‘ഭയം’ എന്ന പദാർഥബന്ധം മറയ്ക്കാതെ, ഈ ബന്ധസന്ദർഭത്തിലെ ഭക്ത്യാദരത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τὸν ἄνδρα
  choice: ഭർത്താവിനെ
  rationale: വൈവാഹിക സന്ദർഭത്തിൽ ἀνήρ വ്യക്തമായി ‘ഭർത്താവ്’ എന്നാണ്.
theological_decisions:
- issue: വൈവാഹിക പ്രബോധനത്തിൽ φοβῆται എന്നതിന്റെ വിവർത്തനം
  choice: ഭയഭക്തിയോടെ ആദരിക്കട്ടെ
  alternative: ഭയപ്പെടട്ടെ; ബഹുമാനിക്കട്ടെ
  rationale: മൂലപദത്തിന്റെ ‘ഭയം’ എന്ന യഥാർഥ ഘടകം പൂർണമായി നീക്കുകയോ ഭീതിയെന്ന ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കുകയോ ചെയ്യാതെ, സന്ദർഭസംബന്ധിയായ ആദരപൂർവ ഭാവം നിലനിർത്തുന്നു.
- issue: ലിംഗനിർദിഷ്ട ഏകവചന പ്രബോധനം
  choice: തന്റെ ഭാര്യയെ ... ഭാര്യയാകട്ടെ ഭർത്താവിനെ
  alternative: തങ്ങളുടെ ജീവിതപങ്കാളികളെ
  rationale: ഗ്രീക്കിലെ ഭർത്താവ്–ഭാര്യ ബന്ധമുള്ള ലിംഗനിർദിഷ്ട ഏകവചനരൂപങ്ങൾ നിഷ്പക്ഷമാക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രബോധനശൈലി. മൂലത്തിലെ ആജ്ഞാഭാവം ‘സ്നേഹിക്കട്ടെ/ആദരിക്കട്ടെ’ എന്ന രൂപങ്ങളിൽ നിലനിർത്തി. വായനാസൗകര്യത്തിനായി കുറിപ്പടയാളങ്ങൾ ബന്ധപ്പെട്ട ആശയങ്ങൾക്ക് പിന്നാലെ വാക്യാവസാനത്തിൽ ചേർത്തിരിക്കുന്നു.
