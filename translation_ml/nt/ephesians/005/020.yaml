  source_fidelity: 'മുഖ്യവാക്യം ഗ്രീക്കിലെ ആശയക്രമം കൃത്യമായി നിലനിർത്തുന്നു: നിരന്തരം നന്ദി അർപ്പിക്കൽ, എല്ലാറ്റിനുവേണ്ടിയുള്ള നന്ദി, നമ്മുടെ കർത്താവായ യേശു മശീഹയുടെ നാമത്തിലുള്ള മധ്യസ്ഥസൂചന, ദൈവവും പിതാവുമായ ഒരേ വ്യക്തിക്കുള്ള നന്ദി എന്നിവയെല്ലാം പ്രതിഫലിക്കുന്നു. εὐχαριστοῦντες മുൻവാക്യത്തിലെ ആജ്ഞയെ ആശ്രയിക്കുന്ന പങ്കാളിത്തരൂപമാണെങ്കിലും, മലയാളത്തിൽ ‘നന്ദി അർപ്പിച്ചുകൊണ്ടിരിക്കുക’ എന്ന തുടർച്ചാസൂചക രൂപം സ്വീകരിക്കാവുന്നതാണ്.'
  naturalness: ‘ദൈവവും പിതാവുമായവനു’ വ്യാകരണപരമായി മനസ്സിലാക്കാമെങ്കിലും ആധുനിക നിലവാരമലയാളത്തിൽ അല്പം കൃത്രിമവും അവ്യക്തവുമാണ്. ‘ദൈവമായ പിതാവിന്’ എന്നത് ഗ്രീക്കിലെ ഒരേ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ഘടനയെ സ്വാഭാവികമായും വ്യക്തമായും നൽകുന്നു. അടിക്കുറിപ്പ്-ചിഹ്നങ്ങൾ അവ ബാധിക്കുന്ന പദങ്ങളോടു ചേർത്ത് സ്ഥാപിക്കണം.
  terminology: ‘കർത്താവ്,’ ‘മശീഹ,’ ‘നാമത്തിൽ’ എന്നിവ യോജിച്ച പദങ്ങളാണ്. ‘യേശു മശീഹ’യിൽ മലയാളത്തിന് പ്രത്യേക നിർണയപദമില്ലാത്തതിനാൽ ഗ്രീക്കിലെ ബിരുദസ്വഭാവം മതിയായവിധം പ്രതിഫലിക്കുന്നു. ‘യേശുക്രിസ്തുവിന്റെ’ എന്ന പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നതും ഉചിതമാണ്.
