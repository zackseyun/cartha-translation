  yaml_path: translation/nt/ephesians/005/013.yaml
  text: But all things[a], when exposed by the light, are made visible,
translation:
  language: ml
  text: എന്നാൽ സകലവും[a] വെളിച്ചത്താൽ തുറന്നുകാട്ടപ്പെടുമ്പോൾ ദൃശ്യമാകുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘വെളിച്ചത്താൽ തുറന്നുകാട്ടപ്പെടുന്നതെല്ലാം ദൃശ്യമാകുന്നു.’ ഗ്രീക്കിലെ പങ്കുപദവും ക്രിയയും പരസ്പരം അടുത്ത ബന്ധത്തിൽ ഗ്രഹിക്കാം; ഊന്നൽ തുറന്നുകാട്ടുന്ന പ്രവൃത്തിയിലോ അതിന്റെ ഫലമായ ദൃശ്യതയിലോ ആകാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ... πάντα
  choice: സകലവും
  rationale: ആർട്ടിക്കിളോടുകൂടിയ നപുംസകലിംഗ ബഹുവചനം വിശാലവും സമഗ്രവുമായ പരിധി സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘സകലവും’ ഈ വ്യാപ്തി സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തോടുള്ള മൃദുവായ വൈരുധ്യമോ ആശയവികാസമോ സൂചിപ്പിക്കുന്ന δέ-യെ ‘എന്നാൽ’ യോജിച്ചവിധം പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐλεγχόμενα
  choice: തുറന്നുകാട്ടപ്പെടുമ്പോൾ
  rationale: ἐλέγχω എന്നതിന് ശാസിക്കുക, കുറ്റം ബോധ്യപ്പെടുത്തുക, വെളിപ്പെടുത്തുക എന്നീ അർഥങ്ങൾ ഉണ്ടാകാം. ഇവിടെ വെളിച്ചം കർത്താവായും φανεροῦται തുടർന്നുവരുന്നതിനാലും മറഞ്ഞിരുന്നത് വെളിച്ചത്തിൽ തുറന്നുകാട്ടപ്പെടുന്നതാണ് മുഖ്യഭാവം. ‘-പ്പെടുമ്പോൾ’ കർമ്മണിപ്രയോഗവും പങ്കുപദത്തിന്റെ കാലിക/താർക്കിക ബന്ധവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὑπὸ τοῦ φωτὸς
  choice: വെളിച്ചത്താൽ
  rationale: ജനിറ്റീവിനോടുകൂടിയ ὑπό പ്രവർത്തകനെ സൂചിപ്പിക്കുന്നു. ‘വെളിച്ചത്താൽ’ ആ കർമ്മണി-പ്രവർത്തകബന്ധവും സന്ദർഭത്തിലെ നിർദിഷ്ട വെളിച്ചത്തിന്റെ രൂപകവും നിലനിർത്തുന്നു.
- source_word: φανεροῦται
  choice: ദൃശ്യമാകുന്നു
  rationale: φανερόω-യുടെ കർമ്മണി രൂപം കാണപ്പെടുക, പ്രത്യക്ഷമാകുക, വെളിപ്പെടുക എന്ന ഫലത്തെ സൂചിപ്പിക്കുന്നു. വെളിച്ചത്തിന്റെ ദൃശ്യരൂപകത്തോട് ‘ദൃശ്യമാകുന്നു’ നേരിട്ട് യോജിക്കുന്നു.
theological_decisions:
- issue: ‘വെളിച്ചം’ എന്നതിന്റെ സന്ദർഭപരമായ അർഥം
  choice: വാക്യത്തിൽ ‘വെളിച്ചം’ എന്നു മാത്രം വിവർത്തനം ചെയ്ത് അതിന്റെ സൂചിതത്തെ കൂടുതൽ നിർവചിക്കാതിരിക്കുക.
  alternative: ക്രിസ്തു; സുവിശേഷം; ധാർമിക സത്യം; വിശ്വാസസമൂഹത്തിന്റെ സാക്ഷ്യം
  rationale: സമീപസന്ദർഭം വിശ്വാസികളെ കർത്താവിൽ വെളിച്ചം എന്നു വിളിക്കുകയും ഇരുട്ടിന്റെ പ്രവൃത്തികളെ തുറന്നുകാട്ടുന്നതിനെപ്പറ്റി പറയുകയും ചെയ്യുന്നു. എന്നാൽ ഈ വാക്യം വെളിച്ചത്തിന്റെ സൂചിതത്തെ വ്യക്തമായി ഒരൊറ്റ അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല; അതിനാൽ രൂപകത്തിന്റെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. വെളിച്ചം, തുറന്നുകാട്ടൽ, ദൃശ്യത എന്നീ പരസ്പരബന്ധിത രൂപകങ്ങൾ നിലനിർത്തിയിരിക്കുന്നു; അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
