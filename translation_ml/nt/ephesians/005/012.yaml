language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τὰ γὰρ κρυφῇ γινόμενα ὑπ’ αὐτῶν αἰσχρόν ἐστιν καὶ λέγειν·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/012.yaml
  text: For it is shameful even to speak of the things done by them in secret[a].
translation:
  language: ml
  text: എന്തെന്നാൽ, അവർ രഹസ്യമായി ചെയ്യുന്ന കാര്യങ്ങളെക്കുറിച്ച് പറയുന്നതുപോലും ലജ്ജാകരമാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവർ രഹസ്യമായി ചെയ്യുന്നതിനെക്കുറിച്ച്.’
    reason: τὰ ... γινόμενα എന്ന നാമപദസമാന കൃദന്തരൂപത്തെ ‘അവർ ചെയ്യുന്നത്’ എന്നു നൽകുന്ന സ്വാഭാവിക പരിഭാഷാവികല്പം; κρυφῇ-യുടെ അർഥം ‘രഹസ്യമായി’ എന്നു നിലനിർത്തുന്നു.
lexical_decisions:
- source_word: τὰ ... γινόμενα
  choice: ചെയ്യുന്ന കാര്യങ്ങൾ
  rationale: നിശ്ചയാർഥക ഉപപദത്തോടുകൂടിയ വർത്തമാനകാല കൃദന്തം ഇവിടെ നാമപദസമാനമായി പ്രവർത്തിച്ച് പ്രവൃത്തികളെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ചെയ്യുന്ന കാര്യങ്ങൾ’ സ്വാഭാവികവും മൂലത്തിന്റെ അർഥത്തിന് അടുത്തതുമാണ്.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ ആഹ്വാനത്തിന് വിശദീകരണപരമായ അടിസ്ഥാനം നൽകുന്ന ബന്ധകത്തെ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: κρυφῇ
  choice: രഹസ്യമായി
  rationale: മറച്ചുവെച്ച രീതിയിൽ ചെയ്യുന്നതെന്ന ക്രിയാവിശേഷണാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: γινόμενα
  choice: ചെയ്യുന്ന
  rationale: കൃദന്തത്തിന്റെ വർത്തമാനകാല സ്വഭാവം മലയാളത്തിൽ നിലനിർത്തുകയും, ὑπ’ αὐτῶν സൂചിപ്പിക്കുന്ന കർത്താവിനോടൊപ്പം സ്വാഭാവിക സജീവവാക്യഘടന ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: ὑπ’ αὐτῶν
  choice: അവർ
  rationale: ഗ്രീക്കിലെ കർമണിപ്രയോഗത്തിലെ കർത്തൃസൂചകമായ ‘അവരാൽ’ എന്നത് മലയാളത്തിലെ കൂടുതൽ സ്വാഭാവികമായ സജീവവാക്യത്തിൽ ‘അവർ’ എന്ന് നൽകി; സർവനാമത്തിന്റെ സന്ദർഭാധീനത നിലനിർത്തുന്നു.
- source_word: αἰσχρόν
  choice: ലജ്ജാകരമാണ്
  rationale: ധാർമികമായി നാണക്കേടുണ്ടാക്കുന്നതോ അപമാനകരമോ ആയ സ്വഭാവം ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: καὶ λέγειν
  choice: പറയുന്നതുപോലും
  rationale: καί-യുടെ ഊന്നൽപ്രയോഗം ‘പോലും’ എന്നതിലൂടെ സംരക്ഷിക്കുന്നു; കാര്യങ്ങളെ പരാമർശിക്കുക എന്ന അർഥത്തിൽ ‘കുറിച്ച് പറയുക’ സ്വാഭാവികമാണ്.
theological_decisions:
- issue: αὐτῶν എന്ന സർവനാമത്തിന്റെ വ്യാപ്തി
  choice: വാക്യത്തിൽ മുൻഗാമിയെ വിശദീകരിക്കാതെ ‘അവർ’ എന്നു നിലനിർത്തുക
  alternative: ‘അനുസരണക്കേടുള്ളവർ’ എന്നോ ‘ഇരുട്ടിന്റെ പ്രവൃത്തികൾ ചെയ്യുന്നവർ’ എന്നോ വികസിപ്പിക്കുക
  rationale: മുൻഗാമി ചുറ്റുപാടിൽനിന്നാണ് മനസ്സിലാകുന്നത്. വാക്യത്തിനുള്ളിൽ അതിനെ വ്യക്തമാക്കുന്നത് ഗ്രീക്കിൽ ഇല്ലാത്ത വ്യാഖ്യാനം ചേർക്കുന്നതായിരിക്കും.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ കർമണിഘടന പദാനുപദമായി ‘അവരാൽ ചെയ്യപ്പെടുന്ന’ എന്നു നൽകാതെ, അർഥവും വർത്തമാനകാലസ്വഭാവവും നിലനിർത്തുന്ന സ്വാഭാവിക സജീവഘടന സ്വീകരിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
