id: EPH.5.16
reference: Ephesians 5:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐξαγοραζόμενοι τὸν καιρόν, ὅτι αἱ ἡμέραι πονηραί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/016.yaml
  text: making the most of the time[a], because the days are evil.
translation:
  language: ml
  text: സമയത്തെ പരമാവധി പ്രയോജനപ്പെടുത്തിക്കൊള്ളുക[a]; കാരണം ദിവസങ്ങൾ ദുഷിച്ചതാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സമയം വീണ്ടെടുക്കുക”; ഗ്രീക്ക് പ്രയോഗത്തിന് “അവസരം പൂർണമായി പ്രയോജനപ്പെടുത്തുക” എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαγοραζόμενοι
  choice: പരമാവധി പ്രയോജനപ്പെടുത്തിക്കൊണ്ട്
  rationale: പദത്തിന്റെ അക്ഷരാർഥത്തിലുള്ള ‘വിലയ്ക്കു വാങ്ങുക/വീണ്ടെടുക്കുക’ എന്ന രൂപകം നിലനിൽക്കുന്നുണ്ടെങ്കിലും, ഈ സന്ദർഭത്തിൽ ലഭ്യമായ സമയമോ അവസരമോ ഏറ്റവും നന്നായി ഉപയോഗിക്കുക എന്നതാണ് പ്രയോഗാർഥം. ആധുനിക മലയാളത്തിൽ ഈ ആശയം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: τὸν καιρόν
  choice: സമയം
  rationale: καιρός ഇവിടെ വെറും കാലദൈർഘ്യത്തേക്കാൾ യോജിച്ച സമയത്തെയോ അവസരത്തെയോ സൂചിപ്പിക്കാം. മുഖ്യപാഠത്തിൽ പരിചിതമായ ‘സമയം’ നിലനിർത്തുകയും അവസരം എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുകയും ചെയ്തു.
- source_word: ὅτι
  choice: കാരണം
  rationale: മുൻപുള്ള പ്രബോധനത്തിനുള്ള കാരണം അവതരിപ്പിക്കുന്ന ബന്ധകത്തിന്റെ വ്യക്തമായ ആധുനിക മലയാളരൂപം.
- source_word: αἱ ἡμέραι
  choice: ഈ നാളുകൾ
  rationale: ഗ്രീക്കിൽ നിർദ്ദിഷ്ടമായ ‘നാളുകൾ’ എന്നാണ്; മലയാളത്തിൽ സന്ദർഭസൂചന വ്യക്തമായി വരാൻ ‘ഈ’ ചേർത്തു. ഇത് ഇപ്പോഴത്തെ കാലസാഹചര്യത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: πονηραί
  choice: ദുഷ്ടമാണ്
  rationale: നാളുകളുടെ ധാർമിക ദുഷിപ്പും പ്രതികൂല സ്വഭാവവും നേരിട്ട് അറിയിക്കുന്നു; ‘കഷ്ടമാണ്’ പോലുള്ള പരിഭാഷകൾ മൂലപദത്തിന്റെ ധാർമിക ഭാരം കുറയ്ക്കും.
theological_decisions:
- issue: ἐξαγοραζόμενοι എന്നത് രക്ഷയോടു ബന്ധപ്പെട്ട ‘വീണ്ടെടുപ്പ്’ ഭാഷയായി തെറ്റിദ്ധരിക്കപ്പെടാനുള്ള സാധ്യത
  choice: സമയമോ അവസരമോ ജ്ഞാനപൂർവം പരമാവധി ഉപയോഗിക്കാനുള്ള പ്രബോധനം
  alternative: സമയം വീണ്ടെടുത്തുകൊണ്ട്
  rationale: ഈ പ്രബോധനസന്ദർഭത്തിൽ ക്രിയയുടെ അർഥം പ്രായോഗികമാണ്; പ്രായശ്ചിത്തമോ രക്ഷയോ വ്യക്തമായി ഉദ്ദേശിക്കുന്നില്ല. എങ്കിലും അക്ഷരാർഥരൂപകവും ‘അവസരം’ എന്ന അർഥസാധ്യതയും അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഈ വാക്യം മുൻവാക്യത്തിലെ നടത്തത്തെക്കുറിച്ചുള്ള പ്രബോധനവുമായി വ്യാകരണപരമായി ബന്ധപ്പെടുന്നതിനാൽ സ്വാഭാവികതയ്ക്കായി ‘ജീവിക്കുക’ ചേർത്തിരിക്കുന്നു; അർഥവിപുലീകരണം ഒഴിവാക്കി.
