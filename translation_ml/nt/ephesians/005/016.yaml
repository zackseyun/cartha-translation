revisions:
- from: സമയം പരമാവധി പ്രയോജനപ്പെടുത്തിക്കൊണ്ട്[a] ജീവിക്കുക; കാരണം ഈ നാളുകൾ ദുഷ്ടമാണ്.
  to: സമയത്തെ പരമാവധി പ്രയോജനപ്പെടുത്തിക്കൊള്ളുക[a]; കാരണം ദിവസങ്ങൾ ദുഷിച്ചതാണ്.
  rationale: The revision removes the unsupported addition “ജീവിക്കുക,” avoids the interpretive demonstrative “ഈ,” and uses idiomatic Malayalam for “evil days.” It retains the practical exhortational sense of the Greek and preserves the literal/traditional and opportunity-related alternatives in the footnote.
  reviewer_model: gpt-5.6-terra
