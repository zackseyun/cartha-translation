reference: Ephesians 5:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ περιπατεῖτε ἐν ἀγάπῃ, καθὼς καὶ ὁ Χριστὸς ἠγάπησεν ⸀ἡμᾶς καὶ παρέδωκεν ἑαυτὸν ὑπὲρ ⸀ἡμῶν προσφορὰν καὶ θυσίαν τῷ θεῷ εἰς ὀσμὴν εὐωδίας.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/002.yaml
  text: and walk in love[a], just as the Messiah also loved us and gave himself up for us[c][b], an offering and sacrifice to God for a fragrant aroma.
translation:
  language: ml
  text: മശീഹാ[a] നമ്മെ സ്നേഹിക്കുകയും നമുക്കുവേണ്ടി[b] തന്നെത്തന്നെ ദൈവത്തിന് ഒരു വഴിപാടും യാഗവുമായി സൗരഭ്യമായി അർപ്പിക്കുകയും ചെയ്തതുപോലെ, നിങ്ങളും സ്നേഹത്തിൽ ജീവിക്കുവിൻ.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ക്രിസ്തു.’ ഗ്രീക്കിലെ Χριστός ഇവിടെ സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നതിനാൽ മുഖ്യവാചകത്തിൽ ‘മശീഹാ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: അഥവാ ‘നമ്മുടെ പക്ഷത്ത്.’ ‘നമുക്കുവേണ്ടി’ എന്നു പരിഭാഷപ്പെടുത്തിയ ὑπὲρ ἡμῶν എന്ന പ്രയോഗത്തിന് ഈ സന്ദർഭത്തിൽ ഗുണഭോക്തൃപരമോ പ്രതിനിധിപരമോ ആയ അർഥം വഹിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: ‘സൗരഭ്യമായി’ എന്ന പ്രയോഗം ദൈവത്തിന് പ്രസാദകരമായ അർപ്പണത്തെക്കുറിച്ചുള്ള പഴയനിയമ യാഗഭാഷയെ പ്രതിധ്വനിപ്പിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: περιπατεῖτε
  choice: ജീവിക്കുവിൻ
  rationale: അക്ഷരാർഥത്തിൽ ‘നടക്കുവിൻ’ എന്നാണെങ്കിലും, ഇവിടെ പൗലോസ് ഉദ്ദേശിക്കുന്നത് ജീവിതരീതിയാണ്. ആ രൂപകത്തിന്റെ ആശയം സാധാരണ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കാൻ ‘ജീവിക്കുവിൻ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: ἐν ἀγάπῃ
  choice: സ്നേഹത്തിൽ
  rationale: സ്നേഹം ജീവിതത്തിന്റെ മേഖലയോ സ്വഭാവമോ ആണെന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: ὁ Χριστός
  choice: മശീഹാ
  rationale: നിശ്ചയാർഥക ഉപപദത്തോടുകൂടിയ Χριστός ഇവിടെ അഭിഷിക്തനായവനെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നു; അതിനാൽ അർഥപരിഭാഷയായ ‘മശീഹാ’ സ്വീകരിച്ചു.
- source_word: ἠγάπησεν ἡμᾶς
  choice: നമ്മെ സ്നേഹിക്കുകയും
  rationale: ἀγάπη എന്ന നാമപദത്തോടുള്ള മൂലപദബന്ധം മലയാളത്തിലും ‘സ്നേഹം/സ്നേഹിക്കുക’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: παρέδωκεν ἑαυτόν
  choice: തന്നെത്തന്നെ ... അർപ്പിക്കുകയും
  rationale: സ്വയം സമർപ്പിക്കുന്ന പ്രവൃത്തിയും തുടർന്നുള്ള യാഗാർപ്പണഭാഷയും സ്വാഭാവിക മലയാളത്തിൽ ഒരുമിച്ചു പ്രകടമാക്കുന്നു. ‘അർപ്പിച്ചു’ എന്നത് പ്രസംഗസന്ദർഭത്തിലെ സമർപ്പണാർഥം വ്യക്തമാക്കുന്നു, എന്നാൽ സ്വമേധയായുള്ള സ്വയംനൽകൽ നിലനിർത്തുന്നു.
- source_word: ὑπὲρ ἡμῶν
  choice: നമുക്കുവേണ്ടി
  rationale: ഗുണഭോക്തൃപരവും പ്രതിനിധിപരവുമായ അർഥസാധ്യതകൾ തുറന്നുവെക്കുന്നു; ‘നമ്മുടെ സ്ഥാനത്ത്’ എന്നു പറഞ്ഞ് പകരസ്ഥാപനാർഥം മാത്രം നിർബന്ധിക്കുന്നില്ല.
- source_word: προσφορὰν καὶ θυσίαν
  choice: ഒരു വഴിപാടും യാഗവുമായി
  rationale: യാഗാരാധനയുമായി ബന്ധപ്പെട്ട രണ്ടു വ്യത്യസ്ത ഗ്രീക്ക് നാമങ്ങളും ഒന്നാക്കി ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: τῷ θεῷ
  choice: ദൈവത്തിന്
  rationale: അർപ്പണത്തിന്റെ സ്വീകർത്താവിനെയോ ദിശയെയോ സൂചിപ്പിക്കുന്ന ദാതൃവിഭക്തിയുടെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: εἰς ὀσμὴν εὐωδίας
  choice: സുഗന്ധസൗരഭ്യമായിരുന്നു
  rationale: പഴയനിയമത്തിലെ യാഗഭാഷയുടെ മൂർത്തമായ ഗന്ധബിംബം നിലനിർത്തുന്നു. നീണ്ട ഗ്രീക്ക് വാക്യം സ്വാഭാവിക മലയാളത്തിനായി രണ്ടാമത്തെ വാക്യമായി അവതരിപ്പിച്ചു.
theological_decisions:
- issue: Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ പദം പേരുപോലെ മാത്രമല്ല, നിശ്ചയാർഥക ഉപപദത്തോടുകൂടിയ സ്ഥാനപ്പേരായാണ് വരുന്നത്. അതിനാൽ ‘അഭിഷിക്തൻ’ എന്ന ആശയം വഹിക്കുന്ന ‘മശീഹാ’ ഉപയോഗിച്ചു; പരിചിതമായ മറ്റുരൂപം അടിക്കുറിപ്പിൽ നൽകി.
- issue: യാഗസന്ദർഭത്തിലെ ὑπὲρ ἡμῶν എന്നതിന്റെ ശക്തി
  choice: നമുക്കുവേണ്ടി
  alternative: നമ്മുടെ പക്ഷത്ത്; നമ്മുടെ സ്ഥാനത്ത്
  rationale: മശീഹായുടെ സ്വയംസമർപ്പണം യാഗപരവും നമ്മുടെ നന്മയ്ക്കായുള്ളതുമാണെന്ന് വാക്യം വ്യക്തമാക്കുന്നു. എന്നാൽ ὑπέρ എന്ന പദം മാത്രം നിർബന്ധിക്കാത്ത വിധത്തിൽ പകരസ്ഥാപനത്തെ മുഖ്യവാചകത്തിൽ കൂടുതൽ കൃത്യമാക്കി ചുരുക്കിയിട്ടില്ല.
- issue: εἰς ὀσμὴν εὐωδίας എന്ന യാഗപ്രയോഗം
  choice: ആ അർപ്പണം സുഗന്ധസൗരഭ്യമായിരുന്നു
  alternative: ദൈവത്തിന് പ്രസാദകരമായ അർപ്പണമായിരുന്നു
  rationale: ‘ദൈവത്തിന് പ്രസാദകരം’ എന്നത് സന്ദർഭാർഥമാണെങ്കിലും, ഗ്രീക്കിലെ ഗന്ധബിംബവും പഴയനിയമ യാഗഭാഷയുടെ പ്രതിധ്വനിയും നേരിട്ട് നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. ‘സ്നേഹത്തിൽ ജീവിക്കുവിൻ’ എന്നത് പൗലോസിന്റെ ‘നടക്കുക’ എന്ന ജീവിതരീതി-രൂപകത്തിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു. ഗ്രീക്കിലെ ദീർഘവാക്യം മലയാളത്തിലെ വ്യക്തതയ്ക്കായി രണ്ടു വാക്യങ്ങളാക്കി; ആവർത്തിച്ച ‘ജീവിക്കുക’ ആദ്യ നിർദേശം മശീഹായുടെ മാതൃകയുമായി വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു.
