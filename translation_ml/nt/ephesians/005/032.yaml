  text: This mystery is great[c][b][a], but I am speaking with reference to Messiah and the church.
translation:
  language: ml
  text: ഈ മർമ്മം മഹത്തരമാണ്[a]; എന്നാൽ ഞാൻ മശീഹയെയും സഭയെയും സംബന്ധിച്ചാണ് പറയുന്നത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഈ മർമ്മം അഗാധമാണ്.’ ഗ്രീക്കിൽ കൂടുതൽ അക്ഷരാർഥത്തിൽ ‘വലുതാണ്’ എന്നാണ്; അത് ബൗദ്ധികമായ ആഴം മാത്രമല്ല, മഹത്ത്വമോ പ്രാധാന്യമോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: μυστήριον
  choice: മർമ്മം
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിൽ ഇത് വെറുമൊരു ദുർഗ്രഹമായ കാര്യമല്ല, മുമ്പ് മറഞ്ഞിരുന്നതും ദൈവം വെളിപ്പെടുത്തിയതുമായ സത്യത്തെ സൂചിപ്പിക്കാം. ‘മർമ്മം’ ഈ അർഥവ്യാപ്തിയും പൗലോസിന്റെ ദൈവശാസ്ത്രപരമായ ഭാവവും നിലനിർത്തുന്നു.
- source_word: μέγα
  choice: മഹത്തരമാണ്
  rationale: μέγα എന്നതിന്റെ മഹത്ത്വം/പ്രാധാന്യം എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘അഗാധമാണ്’ എന്നു വിവർത്തനം ചെയ്ത് ബൗദ്ധിക ആഴം മാത്രം മുൻനിർത്തുന്നത് ഒഴിവാക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മർമ്മത്തെക്കുറിച്ചുള്ള പ്രസ്താവനയിൽനിന്ന് പൗലോസ് ഉദ്ദേശിക്കുന്ന കാര്യത്തിന്റെ വിശദീകരണത്തിലേക്കുള്ള നേരിയ വൈരുധ്യവും മാറ്റവും സൂചിപ്പിക്കുന്നു.
- source_word: λέγω
  choice: പറയുന്നത്
  rationale: വർത്തമാനകാല ക്രിയയുടെ ശക്തി സ്വാഭാവികമായ മലയാളവാക്യഘടനയിൽ നിലനിർത്തുന്നു; ‘അർഥമാക്കുന്നത്’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക രൂപം ഒഴിവാക്കുന്നു.
- source_word: εἰς
  choice: സംബന്ധിച്ചാണ്
  rationale: λέγω എന്നതിനുശേഷമുള്ള εἰς ഇവിടെ ദിശയെയല്ല, പരാമർശവിഷയത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘സംബന്ധിച്ച്’ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: Χριστόν
  choice: മശീഹ
  rationale: ഈ സന്ദർഭത്തിൽ Χριστός ഒരു സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നതിനാൽ അതിന്റെ സ്ഥാനപ്പേരായ അർഥം ‘മശീഹ’ എന്നു നിലനിർത്തുന്നു.
- source_word: ἐκκλησίαν
  choice: സഭ
  rationale: ഇവിടെ പൗലോസ് ഉദ്ദേശിക്കുന്നത് ദൈവജനത്തിന്റെ സമൂഹപരമായ ഏകതയാണ്; മലയാള ക്രൈസ്തവ പ്രയോഗത്തിൽ ‘സഭ’ അതിന് വ്യക്തവും പ്രസക്തവുമായ പദമാണ്.
theological_decisions:
- issue: ‘ഈ മർമ്മം’ എന്നതിന്റെ കൃത്യമായ സൂചിതവിഷയം
  choice: മർമ്മം വിവാഹത്തെയോ ഉല്പത്തി 2:24-ലെ വചനത്തെയോ മശീഹ-സഭ ബന്ധത്തിലേക്കു വിരൽചൂണ്ടുന്ന മാതൃകാത്മക അർഥത്തെയോ മാത്രം സൂചിപ്പിക്കുന്നു എന്നു മുഖ്യവാചകത്തിൽ നിശ്ചയിക്കാതെ, ഗ്രീക്കിലെ വിശദീകരണക്രമം അതേപടി നിലനിർത്തി.
  alternative: ‘ഈ മർമ്മം’ വിവാഹത്തിലെ ഏകശരീരബന്ധത്തെയോ ഉല്പത്തി 2:24-ലെ ഉദ്ധരണിയെയോ മശീഹയും സഭയും തമ്മിലുള്ള ബന്ധത്തിന്റെ മാതൃകാത്മക പ്രാധാന്യത്തെയോ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നു എന്നു വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്ക് ആദ്യം മർമ്മം മഹത്തരമാണെന്നു പ്രസ്താവിച്ച്, തുടർന്ന് പൗലോസ് മശീഹയെയും സഭയെയും സംബന്ധിച്ചാണ് പറയുന്നതെന്നു വ്യക്തമാക്കുന്നു. വിവർത്തനം ഈ നീക്കവും വ്യാഖ്യാനസാധ്യതകളും സംരക്ഷിക്കണം.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘മർമ്മം’, ‘മശീഹ’, ‘സഭ’ എന്നീ സ്ഥാപിത ദൈവശാസ്ത്രപദങ്ങൾ നിലനിർത്തിയപ്പോൾ വാക്യഘടന സ്വാഭാവികമാക്കി; ഗ്രീക്കിലെ ആവർത്തിച്ച εἰς മലയാളത്തിൽ അനാവശ്യമായി ആവർത്തിച്ചില്ല.
