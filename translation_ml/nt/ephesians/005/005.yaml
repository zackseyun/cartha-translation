revisions:
- from: കാരണം, നിങ്ങൾക്ക് ഇക്കാര്യം അറിയാം[a]; ലൈംഗികമായി അധാർമികനായവനോ അശുദ്ധനായവനോ അത്യാഗ്രഹിയോ—അവൻ വിഗ്രഹാരാധകനാണ്[b]—മശീഹയുടെയും[c] ദൈവത്തിന്റെയും രാജ്യത്തിൽ യാതൊരു അവകാശവുമില്ലെന്ന് നിങ്ങൾ മനസ്സിലാക്കുന്നു.
  to: 'കാരണം, ഇത് ഉറപ്പായി അറിഞ്ഞുകൊള്ളുവിൻ: ലൈംഗികമായി അധാർമികനായവനോ അശുദ്ധനായവനോ അത്യാഗ്രഹിയോ—അവൻ വിഗ്രഹാരാധകനാണ്[b]—മശീഹയുടെയും[c] ദൈവത്തിന്റെയും രാജ്യത്തിൽ യാതൊരു അനന്തരാവകാശവും ഇല്ല[a].'
  rationale: The revision corrects the imperative force of ἴστε, expresses the participial emphasis without an awkward delayed finite clause, and uses “അനന്തരാവകാശം” for κληρονομία. The footnote on the neuter relative clause preserves the real grammatical ambiguity rather than imposing a theological interpretation.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:16:53Z'
review_pass:
  verdict: revise
  source_fidelity: The Greek ἴστε is a second-person plural imperative (the indicative would be οἴδατε), so the draft's indicative framing, “നിങ്ങൾക്ക് ഇക്കാര്യം അറിയാം ... നിങ്ങൾ മനസ്സിലാക്കുന്നു,” does not preserve the source's exhortational force. The vice terms, present-tense exclusion (“... ഇല്ല”), and the coordinate expression “മശീഹയുടെയും ദൈവത്തിന്റെയും” are otherwise conveyed faithfully. The ambiguous neuter relative clause is reasonably represented in the main text and retained in a footnote.
  naturalness: The draft's split construction—first “നിങ്ങൾക്ക് ... അറിയാം,” then after the full clause “നിങ്ങൾ മനസ്സിലാക്കുന്നു”—is cumbersome in modern Malayalam and makes the long sentence difficult to process. An imperative introductory formula followed by a colon is both natural and closer to the Greek.
  terminology: “ലൈംഗികമായി അധാർമികനായവൻ,” “അശുദ്ധനായവൻ,” “അത്യാഗ്രഹി,” “വിഗ്രഹാരാധകൻ,” and “മശീഹ” suit a serious modern Malayalam register. “അനന്തരാവകാശം” more explicitly conveys κληρονομία than the broader “അവകാശം.”
  issues:
  - severity: high
    issue: ἴστε is translated as an indicative statement rather than an imperative.
    rationale: The source form is imperative plural, not indicative plural. The Malayalam must express the command/exhortation to know or recognize this.
  - severity: medium
    issue: The two-finite-verb rendering of ἴστε γινώσκοντες is syntactically delayed and unnatural.
    rationale: Placing “നിങ്ങൾ മനസ്സിലാക്കുന്നു” after the entire content clause makes the construction heavy. “ഇത് ഉറപ്പായി അറിഞ്ഞുകൊള്ളുവിൻ” conveys the imperative and the participial emphasis idiomatically.
  - severity: low
    issue: “അവകാശം” is less specific than κληρονομία.
    rationale: “അനന്തരാവകാശം” preserves the inheritance sense while remaining natural Malayalam.
  revised_text: 'കാരണം, ഇത് ഉറപ്പായി അറിഞ്ഞുകൊള്ളുവിൻ: ലൈംഗികമായി അധാർമികനായവനോ അശുദ്ധനായവനോ അത്യാഗ്രഹിയോ—അവൻ വിഗ്രഹാരാധകനാണ്[b]—മശീഹയുടെയും[c] ദൈവത്തിന്റെയും രാജ്യത്തിൽ യാതൊരു അനന്തരാവകാശവും ഇല്ല[a].'
