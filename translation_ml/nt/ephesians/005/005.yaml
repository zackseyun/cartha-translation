id: EPH.5.5
reference: Ephesians 5:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῦτο γὰρ ⸀ἴστε γινώσκοντες ὅτι πᾶς πόρνος ἢ ἀκάθαρτος ἢ πλεονέκτης, ⸀ὅ ἐστιν εἰδωλολάτρης, οὐκ ἔχει κληρονομίαν ἐν τῇ βασιλείᾳ τοῦ Χριστοῦ καὶ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/005.yaml
  text: For you know this[a], understanding that every sexually immoral or unclean or greedy person, who is an idolater[b], has no inheritance in the kingdom of Messiah and God.
translation:
  language: ml
  text: 'കാരണം, ഇത് ഉറപ്പായി അറിഞ്ഞുകൊള്ളുവിൻ: ലൈംഗികമായി അധാർമികനായവനോ അശുദ്ധനായവനോ അത്യാഗ്രഹിയോ—അവൻ വിഗ്രഹാരാധകനാണ്[b]—മശീഹയുടെയും[c] ദൈവത്തിന്റെയും രാജ്യത്തിൽ യാതൊരു അനന്തരാവകാശവും ഇല്ല[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ‘അറിഞ്ഞുകൊള്ളുവിൻ’ എന്നതിനോടൊപ്പം ‘അറിഞ്ഞുകൊണ്ട്/മനസ്സിലാക്കിക്കൊണ്ട്’ എന്ന കൃദന്തരൂപവും വരുന്നു; ഈ ചേർച്ച ഉറപ്പുള്ള അറിവിലേക്കുള്ള ഊന്നൽ നൽകുന്നു.
    reason: source_form
  - marker: b
    text: 'കൂടുതൽ പദാനുപദമായി: ‘അത് വിഗ്രഹാരാധനയാണ്’; ഇത് പ്രത്യേകിച്ച് അത്യാഗ്രഹത്തെ സൂചിപ്പിക്കുന്നതായിരിക്കാം.'
    reason: alternative_reading
  - marker: c
    text: 'ഗ്രീക്ക്: ‘ക്രിസ്തോസ്’; ഇവിടെ അത് പദവിയായി പ്രവർത്തിക്കുന്നതിനാൽ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴστε γινώσκοντες
  choice: നിങ്ങൾക്ക് ഇക്കാര്യം അറിയാം ... നിങ്ങൾ മനസ്സിലാക്കുന്നു
  rationale: οἶδα എന്ന ക്രിയയുടെയും γινώσκω എന്നതിന്റെ കൃുദന്തരൂപത്തിന്റെയും ഊന്നൽ പൂർണമായി ചുരുക്കാതെ, സ്വാഭാവികമായ മലയാളത്തിൽ അറിവും ഗ്രഹിക്കലും പ്രകടമാക്കുന്നു.
- source_word: πόρνος
  choice: ലൈംഗികമായി അധാർമികനായവൻ
  rationale: ലൈംഗിക അധാർമികത സ്വഭാവമാക്കിയ വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്; പഴഞ്ചനോ അനാവശ്യമായി സങ്കുചിതമോ ആയ പദം ഒഴിവാക്കി ആധുനികവും വ്യക്തവുമായ ഭാഷ ഉപയോഗിക്കുന്നു.
- source_word: ἀκάθαρτος
  choice: അശുദ്ധനായവൻ
  rationale: ധാർമ്മിക അശുദ്ധിയെയും പദത്തിന്റെ ശുദ്ധി-അശുദ്ധി പ്രതിധ്വനിയെയും നിലനിർത്തുന്നു.
- source_word: πλεονέκτης
  choice: അത്യാഗ്രഹി
  rationale: കൂടുതൽ സ്വന്തമാക്കാൻ പിടിച്ചുപറ്റുന്ന അത്യാഗ്രഹം സ്വഭാവമാക്കിയ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: ὅ ἐστιν εἰδωλολάτρης
  choice: അവൻ വിഗ്രഹാരാധകനാണ്
  rationale: സന്ദർഭത്തിലും കൊലൊസ്സ്യർ 3:5-ലെ സമാന്തരത്തിലും ഇത് പ്രത്യേകിച്ച് അത്യാഗ്രഹിയെ വിശേഷിപ്പിക്കുന്നതായി സ്വാഭാവികമായി വായിക്കാം; ഗ്രീക്കിലെ നപുംസകലിംഗ ആപേക്ഷിക സർവനാമം സൃഷ്ടിക്കുന്ന മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: κληρονομίαν
  choice: അവകാശം
  rationale: രാജ്യത്തിൽ ലഭിക്കുന്ന പൈതൃകപങ്ക് എന്ന പൗലോസിന്റെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘യാതൊരു’ എന്നത് οὐκ എന്ന നിഷേധത്തിന്റെ ശക്തി വ്യക്തമാക്കുന്നു.
- source_word: βασιλείᾳ
  choice: രാജ്യം
  rationale: ഭരണവും ഭരണപരിധിയും ഉൾക്കൊള്ളുന്ന സ്ഥാപിതവും കൃത്യവുമായ ബൈബിൾപ്രയോഗം.
- source_word: Χριστοῦ
  choice: മശീഹയുടെ
  rationale: Χριστός ഇവിടെ പേരിനേക്കാൾ പദവിയായി പ്രവർത്തിക്കുന്നതിനാൽ ‘മശീഹ’ എന്ന് പരിഭാഷപ്പെടുത്തി.
- source_word: τοῦ Χριστοῦ καὶ θεοῦ
  choice: മശീഹയുടെയും ദൈവത്തിന്റെയും
  rationale: രണ്ട് ഏകവചന സംബന്ധികപദങ്ങളെ നേരിട്ട് ഏകോപിപ്പിച്ച് ഗ്രീക്കിന്റെ രൂപം നിലനിർത്തുന്നു; വിവാദമായ വ്യാകരണ-ദൈവശാസ്ത്ര നിഗമനം പരിഭാഷയിൽ നിർബന്ധിക്കുന്നില്ല.
theological_decisions:
- issue: ὅ ἐστιν εἰδωλολάτρης എന്നതിന്റെ സൂചിതം
  choice: വ്യക്തിയെ, സന്ദർഭത്തിൽ പ്രത്യേകിച്ച് അത്യാഗ്രഹിയെ, സൂചിപ്പിക്കുന്ന ‘അവൻ വിഗ്രഹാരാധകനാണ്’
  alternative: ‘അത് വിഗ്രഹാരാധനയാണ്’ എന്ന് ദോഷത്തെ, പ്രത്യേകിച്ച് അത്യാഗ്രഹത്തെ, സൂചിപ്പിക്കൽ
  rationale: നപുംസകലിംഗമായ ὅ കാരണം യഥാർഥമായ വ്യാകരണദ്വയാർഥതയുണ്ട്. പ്രധാനവാചകം സന്ദർഭോചിതമായ വ്യക്തിപര വായന നൽകുന്നു; കൂടുതൽ പദാനുപദമായ അമൂർത്ത വായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: രാജ്യത്തിലെ അവകാശത്തിൽനിന്നുള്ള ഒഴിവാക്കലിന്റെ കാലസൂചന
  choice: വർത്തമാനസ്ഥിതി സൂചിപ്പിക്കുന്ന ‘അവകാശമില്ല’
  alternative: ഭാവികാലമായി ‘രാജ്യം അവകാശമാക്കുകയില്ല’
  rationale: മൂലത്തിൽ ഭാവികാലക്രിയയല്ല, വർത്തമാനകാലമായ οὐκ ἔχει ആണ്; മുന്നറിയിപ്പിന്റെ ശക്തി കുറയ്ക്കാതെ അതേ കാലസൂചന നിലനിർത്തുന്നു.
- issue: ‘മശീഹയുടെയും ദൈവത്തിന്റെയും’ തമ്മിലുള്ള ബന്ധം
  choice: നേരിട്ടുള്ള ഏകോപിത സംബന്ധികപ്രയോഗം
  alternative: ഒരു പ്രത്യേക ക്രിസ്തുശാസ്ത്ര വ്യാകരണനിഗമനം വ്യക്തമായി ചേർത്ത വ്യാഖ്യാനപര പരിഭാഷ
  rationale: ഗ്രീക്ക് പ്രസ്താവിക്കുന്നതിൽക്കാൾ അധികം നിർണ്ണയിക്കാതെ വാചകത്തിന്റെ ദൈവശാസ്ത്രപരമായ ഗൗരവവും യഥാർഥ ഘടനയും സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ദോഷപ്പട്ടിക വ്യക്തികളെ സൂചിപ്പിക്കുന്ന സമാന്തരരൂപത്തിൽ നൽകിയിരിക്കുന്നു. ദീർഘവാക്യത്തിലെ ആശയബന്ധം വ്യക്തമാക്കാൻ അർധവിരാമവും ഇടവരകളും ഉപയോഗിച്ചു; മൂലത്തിലെ ആവർത്തിച്ച അറിവ്-ഗ്രഹിക്കൽ ഊന്നൽ ഒഴിവാക്കിയിട്ടില്ല.
