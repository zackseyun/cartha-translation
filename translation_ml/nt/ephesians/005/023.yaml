source:
  edition: SBLGNT
  text: ὅτι ἀνήρ ἐστιν κεφαλὴ τῆς γυναικὸς ὡς καὶ ὁ Χριστὸς κεφαλὴ τῆς ἐκκλησίας, ⸀αὐτὸς σωτὴρ τοῦ σώματος.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/023.yaml
  text: For the husband is the head of the wife[a], as the Messiah also is the head of the church[d][c][b], himself the Savior of the body.
translation:
  language: ml
  text: കാരണം, ഭർത്താവ് ഭാര്യയുടെ ശിരസ്സാണ്; അതുപോലെ മശീഹയും സഭയുടെ ശിരസ്സാണ്[a], അവിടുന്നുതന്നെ ശരീരത്തിന്റെ രക്ഷകൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ശിരസ്സ്’ ഗ്രീക്കിലെ രൂപകത്തെ അതേപടി നിലനിർത്തുന്നു. ഇവിടെ അത് അധികാരം, പ്രാമുഖ്യം, അല്ലെങ്കിൽ ഉറവിടം എന്നിവയിൽ ഏതിനെയാണ് സൂചിപ്പിക്കുന്നതെന്ന കാര്യത്തിൽ വ്യാഖ്യാതാക്കൾക്കിടയിൽ അഭിപ്രായവ്യത്യാസമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ ആഹ്വാനത്തിന് അടിസ്ഥാനമോ വിശദീകരണമോ നൽകുന്ന കാരണസൂചക പ്രയോഗം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἀνήρ / γυνή
  choice: ഭർത്താവ് / ഭാര്യ
  rationale: ഗൃഹബന്ധങ്ങളെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ പൊതുവായ ‘പുരുഷൻ / സ്ത്രീ’ എന്നതല്ല, ദാമ്പത്യബന്ധം സൂചിപ്പിക്കുന്ന അർഥമാണ് ആവശ്യമായത്.
- source_word: κεφαλή
  choice: ശിരസ്സ്
  rationale: ഗ്രീക്കിലെ ശരീരരൂപകം നിലനിർത്തുകയും ‘അധികാരി’, ‘നേതാവ്’, ‘ഉറവിടം’ തുടങ്ങിയ വിവാദ വ്യാഖ്യാനങ്ങളിൽ ഒന്നിനെ മുഖ്യപാഠത്തിൽ ഉറപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ὡς καὶ
  choice: അതുപോലെ ...യും
  rationale: ഭർത്താവ്–ഭാര്യ ബന്ധവും മശീഹ–സഭ ബന്ധവും തമ്മിലുള്ള താരതമ്യഘടന സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: Χριστός
  choice: മശീഹ
  rationale: ഇവിടെ പദത്തിന്റെ അഭിഷിക്തനായവൻ എന്ന സ്ഥാനപ്പേരിന്റെ അർഥം സജീവമായതിനാൽ അർഥസൂചകമായ രൂപം ഉപയോഗിക്കുന്നു.
- source_word: ἐκκλησία
  choice: സഭ
  rationale: പൗലോസിന്റെ ഈ പ്രയോഗത്തിൽ വിശ്വാസികളുടെ സമൂഹത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും വ്യക്തവുമായ മലയാള പദമാണ്.
- source_word: αὐτὸς
  choice: അവിടുന്നുതന്നെ
  rationale: മശീഹയെ ആദരസൂചകമായി പരാമർശിക്കുമ്പോൾ ഗ്രീക്കിലെ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: σωτὴρ τοῦ σώματος
  choice: ശരീരത്തിന്റെ രക്ഷകൻ
  rationale: ‘രക്ഷകൻ’ രക്ഷയുടെ ശക്തി നിലനിർത്തുന്നു; ‘ശരീരം’ സഭയ്ക്കായുള്ള പൗലോസിന്റെ രൂപകം സംരക്ഷിക്കുന്നു. ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത ‘തന്റെ’ എന്ന ഉടമസ്ഥസർവനാമം ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: κεφαλή എന്ന രൂപകത്തിന്റെ അർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘ശിരസ്സ്’ എന്ന രൂപകം നിലനിർത്തുക
  alternative: അധികാരി / നേതാവ് / ഉറവിടം
  rationale: ഈ പദത്തിന്റെ ബന്ധസൂചനയെക്കുറിച്ച് വ്യത്യസ്ത വ്യാഖ്യാനങ്ങൾ ഉള്ളതിനാൽ അവയിൽ ഒന്നിനെ വിവർത്തനത്തിൽ നിർബന്ധിതമാക്കാതെ ഗ്രീക്ക് രൂപകവും അതിലെ വ്യാഖ്യാനസാധ്യതയും സംരക്ഷിക്കുന്നു.
- issue: Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ വിവർത്തനം
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഈ വാക്യത്തിൽ സഭയോടുള്ള ബന്ധത്തിൽ അഭിഷിക്തനായ രക്ഷകനെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരിന്റെ അർഥം പ്രകടമാണ്.
- issue: αὐτὸς σωτὴρ τοῦ σώματος എന്നതിന്റെ വാക്യബന്ധം
  choice: ‘അവിടുന്നുതന്നെ ശരീരത്തിന്റെ രക്ഷകൻ’ എന്ന ഊന്നലുള്ള സമാനാധികരണ പ്രയോഗം
  alternative: ‘ശരീരത്തിന്റെ രക്ഷകനായിരിക്കുന്ന അവിടുന്ന്’
  rationale: മൂലപാഠത്തിൽ പങ്കാളിക്രിയ ഇല്ലാത്ത സംക്ഷിപ്ത സമാനാധികരണ ഘടനയും αὐτός എന്നതിന്റെ ഊന്നലും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ശിരസ്സ്’ എന്ന പദം രൂപകത്തിന്റെ സാഹിത്യ-ദൈവശാസ്ത്ര ഭാരം നിലനിർത്തുന്നു; ‘അവിടുന്ന്’ മശീഹയെ പരാമർശിക്കുന്ന ആദരസൂചക സർവനാമമായി ഉപയോഗിച്ചു. ഗ്രീക്കിലെ സംക്ഷിപ്ത അവസാനഘടന ദീർഘമായി വിശദീകരിക്കാതെ ഡാഷ് ഉപയോഗിച്ച് വേർതിരിച്ചു.
