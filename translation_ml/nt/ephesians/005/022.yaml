translation:
  language: ml
  text: ഭാര്യമാരേ[a], സ്വന്തം ഭർത്താക്കന്മാർക്ക് കർത്താവിനെന്നപോലെ—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പല പരിഭാഷകളും 21-ാം വാക്യത്തിൽനിന്ന് ‘കീഴടങ്ങുക’ എന്ന ക്രിയ ഇവിടെ ചേർത്ത്, ‘ഭാര്യമാരേ, സ്വന്തം ഭർത്താക്കന്മാർക്കു കർത്താവിനെന്നപോലെ കീഴടങ്ങുക’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു. എന്നാൽ 22-ാം വാക്യത്തിന്റെ ഗ്രീക്കിൽ ക്രിയയില്ല; അതിന്റെ അപൂർണ്ണവാക്യഘടന മുൻവാക്യത്തെ ആശ്രയിച്ചിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: Αἱ γυναῖκες
  choice: ഭാര്യമാരേ
  rationale: ഗൃഹബന്ധങ്ങളെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിലും ἰδίοις ἀνδράσιν എന്ന അനുബന്ധപ്രയോഗത്തിലും γυνή എന്നത് പൊതുവായി ‘സ്ത്രീകൾ’ എന്നതിലുപരി ‘ഭാര്യമാർ’ എന്നാണ് അർഥമാക്കുന്നത്. മലയാളത്തിലെ സംബോധനരൂപം വാക്യത്തിന്റെ അഭിസംബോധനസ്വഭാവം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: സ്വന്തം ഭർത്താക്കന്മാർക്ക്
  rationale: ἀνήρ എന്നതിന് ‘പുരുഷൻ’ എന്നും ‘ഭർത്താവ്’ എന്നും അർഥമാകാം; ἰδίοις എന്ന ഉടമസ്ഥസൂചനയും വിവാഹബന്ധസന്ദർഭവും ഇവിടെ ‘ഭർത്താക്കന്മാർ’ എന്ന അർഥം ഉറപ്പിക്കുന്നു. ഗ്രീക്കിലുള്ള ‘സ്വന്തം’ എന്ന ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: ὡς
  choice: എന്നപോലെ
  rationale: താരതമ്യത്തിന്റെ കൃത്യമായ വ്യാപ്തി മുൻകൂട്ടി വിശദീകരിക്കാതെ ലളിതമായ താരതമ്യബന്ധം നിലനിർത്തുന്നു.
- source_word: τῷ κυρίῳ
  choice: കർത്താവിന്
  rationale: പൗലോസിന്റെ ഈ സന്ദർഭത്തിൽ κύριος കർത്താവായ യേശുവിനെ സൂചിപ്പിക്കുന്നു; മലയാള ബൈബിൾഭാഷയിൽ സ്വാഭാവികവും മാന്യവുമായ ‘കർത്താവ്’ ഉപയോഗിക്കുന്നു.
- source_word: implicit verb from context
  choice: പ്രധാനപാഠത്തിൽ ക്രിയ ചേർത്തിട്ടില്ല
  rationale: ഈ വാക്യത്തിന്റെ ഗ്രീക്ക് പാഠത്തിൽ ക്രിയയില്ല; 21-ാം വാക്യത്തിലെ ὑποτασσόμενοι എന്നതിൽനിന്നാണ് ആശയം തുടരുന്നത്. അതിനാൽ ദീർഘവിരാമം ഉപയോഗിച്ച് അപൂർണ്ണഘടന സംരക്ഷിക്കുകയും വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: 22-ാം വാക്യത്തിന്റെ ഗ്രീക്കിൽ ഇല്ലാത്ത ‘കീഴടങ്ങുക’ എന്ന ക്രിയ പ്രധാനപാഠത്തിൽ ചേർക്കണമോ
  choice: ക്രിയ ചേർക്കാതെ ഗ്രീക്കിലെ അപൂർണ്ണവാക്യഘടന നിലനിർത്തുക
  alternative: ഭാര്യമാരേ, കർത്താവിനെന്നപോലെ സ്വന്തം ഭർത്താക്കന്മാർക്കു കീഴടങ്ങുക.
  rationale: ‘കീഴടങ്ങുക’ എന്ന ആശയം 21-ാം വാക്യത്തിൽനിന്ന് വ്യാകരണപരമായി മനസ്സിലാക്കാമെങ്കിലും, അത് 22-ാം വാക്യത്തിൽ പ്രത്യേകം എഴുതിയിട്ടില്ല. ക്രിയ ചേർക്കാതിരിക്കുന്നത് മൂലപാഠത്തിന്റെ ആശ്രിതഘടനയും അതിലെ വ്യാഖ്യാനസാധ്യതയും കൂടുതൽ സുതാര്യമായി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. മൂലപാഠത്തിലെ ക്രിയാരഹിതമായ ഘടന ഉദ്ദേശപൂർവം നിലനിർത്താൻ അവസാനം ദീർഘവിരാമം ഉപയോഗിച്ചിരിക്കുന്നു.
