revisions:
- from: കാരണം, ആരും ഒരിക്കലും സ്വന്തം ജഡത്തെ വെറുത്തിട്ടില്ല; മറിച്ച് അതിനെ പോറ്റിവളർത്തുകയും കരുതലോടെ പരിപാലിക്കുകയും ചെയ്യുന്നു—മശീഹയും സഭയെ അങ്ങനെതന്നെ ചെയ്യുന്നതുപോലെ.
  to: കാരണം, ആരും ഒരിക്കലും സ്വന്തം ജഡത്തെ വെറുത്തിട്ടില്ല; മറിച്ച് അതിനെ പോറ്റിവളർത്തുകയും സ്നേഹപൂർവം പരിപാലിക്കുകയും ചെയ്യുന്നു, മശീഹയും സഭയെ അങ്ങനെതന്നെ പോറ്റിവളർത്തുകയും സ്നേഹപൂർവം പരിപാലിക്കുകയും ചെയ്യുന്നു.
  rationale: The revision resolves the malformed Malayalam rendering of the Greek verb ellipsis by explicitly repeating “പോറ്റിവളർത്തുകയും സ്നേഹപൂർവം പരിപാലിക്കുകയും ചെയ്യുന്നു” for the Messiah’s relation to the church. This preserves the source’s comparison and its beneficent actions while producing idiomatic modern Malayalam. “കരുതലോടെ പരിപാലിക്കുന്നു” has been refined to “സ്നേഹപൂർവം പരിപാലിക്കുന്നു” to better represent θάλπει’s sense of tender cherishing.
