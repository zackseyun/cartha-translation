id: EPH.5.29
reference: Ephesians 5:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐδεὶς γάρ ποτε τὴν ἑαυτοῦ σάρκα ἐμίσησεν, ἀλλὰ ἐκτρέφει καὶ θάλπει αὐτήν, καθὼς καὶ ὁ ⸀Χριστὸς τὴν ἐκκλησίαν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/029.yaml
  text: For no one ever hated his own flesh[a], but nourishes and cherishes it, just as the Messiah also does the church[c][b],
translation:
  language: ml
  text: കാരണം, ആരും ഒരിക്കലും സ്വന്തം ജഡത്തെ വെറുത്തിട്ടില്ല; മറിച്ച് അതിനെ പോറ്റിവളർത്തുകയും സ്നേഹപൂർവം പരിപാലിക്കുകയും ചെയ്യുന്നു, മശീഹയും സഭയെ അങ്ങനെതന്നെ പോറ്റിവളർത്തുകയും സ്നേഹപൂർവം പരിപാലിക്കുകയും ചെയ്യുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδεὶς γάρ ποτε
  choice: കാരണം, ആരും ഒരിക്കലും
  rationale: γάρ മുൻവാക്യത്തിന് വിശദീകരണാടിസ്ഥാനം നൽകുന്നു; οὐδεὶς ... ποτε എന്ന സമുച്ചയത്തിന്റെ സർവകാല നിഷേധബലം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τὴν ἑαυτοῦ σάρκα
  choice: സ്വന്തം ജഡത്തെ
  rationale: σάρξ ഇവിടെ പാപസ്വഭാവമല്ല, ഒരാളുടെ ശാരീരിക സ്വയം എന്ന അക്ഷരാർഥത്തിലാണ്. 'ജഡം' മൂലപദത്തിന്റെ വ്യത്യസ്തത കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: ἐμίσησεν
  choice: വെറുത്തിട്ടില്ല
  rationale: മുൻകാല ക്രിയയും നിഷേധവും ചേർന്ന ഗ്രീക്ക് പ്രയോഗം മലയാളത്തിൽ അനുഭവസാർവത്രികത സൂചിപ്പിക്കുന്ന പൂർണകാല നിഷേധമായി സ്വാഭാവികമായി വരുന്നു.
- source_word: ἐκτρέφει
  choice: പോറ്റിവളർത്തുന്നു
  rationale: ഭക്ഷണം നൽകി പരിപോഷിപ്പിക്കുക എന്നതിലുപരി വളർത്തിപ്പോറ്റുന്ന പരിചരണവും ഈ ക്രിയയിൽ ഉൾപ്പെടുന്നു.
- source_word: θάλπει
  choice: കരുതലോടെ പരിപാലിക്കുന്നു
  rationale: അക്ഷരാർഥത്തിലുള്ള 'ചൂടേകുന്നു' എന്നതിനെക്കാൾ ഈ സന്ദർഭത്തിൽ ആർദ്രവും സ്നേഹപൂർവവുമായ പരിചരണമാണ് ഉദ്ദേശ്യം.
- source_word: καθὼς καὶ
  choice: അങ്ങനെതന്നെ ... പോലെ
  rationale: താരതമ്യവും καίയുടെ അനുബന്ധ ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ὁ Χριστὸς
  choice: മശീഹ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ Χριστός ഇവിടെ അഭിഷിക്തനായ രക്ഷകൻ എന്ന പദവിയായി പ്രവർത്തിക്കുന്നു; അതിനാൽ അർഥം വ്യക്തമാക്കുന്ന 'മശീഹ' ഉപയോഗിച്ചു.
- source_word: τὴν ἐκκλησίαν
  choice: സഭയെ
  rationale: ഇവിടെ ἐκκλησία വിശ്വാസികളുടെ സമൂഹത്തെ സമഗ്രമായി സൂചിപ്പിക്കുന്നു; മലയാള ബൈബിൾഭാഷയിൽ സ്ഥാപിതവും സ്വാഭാവികവുമായ പദം 'സഭ'യാണ്.
theological_decisions:
- issue: Χριστός എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ പദം പേരുപോലെ മാത്രമല്ല, പദവിയായി ഉപയോഗിക്കുന്നു. അതിനാൽ അതിന്റെ 'അഭിഷിക്തൻ' എന്ന മശീഹാസംബന്ധമായ അർഥം നിലനിർത്തി.
- issue: σάρξ എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ജഡം
  alternative: ശരീരം
  rationale: വിവാഹ-ശരീര ഉപമയിൽ സ്വന്തം ഭൗതികസ്വയം ആണ് ഉദ്ദേശ്യം; 'പാപസ്വഭാവം' എന്ന ധാർമിക അർഥമല്ല. 'ജഡം' മൂലത്തിലെ σάρξ എന്ന പദത്തെ സുതാര്യമായി പ്രതിഫലിപ്പിക്കുന്നു.
- issue: അവസാന ഉപവാക്യത്തിലെ ക്രിയാലോപം
  choice: സഭയെ അങ്ങനെതന്നെ ചെയ്യുന്നതുപോലെ
  alternative: സഭയെ പോറ്റിവളർത്തുകയും കരുതലോടെ പരിപാലിക്കുകയും ചെയ്യുന്നതുപോലെ
  rationale: ഗ്രീക്കിൽ അവസാന ഭാഗത്ത് ക്രിയകൾ ആവർത്തിക്കാതെ വിട്ടിരിക്കുന്നു. മുഖ്യപാഠത്തിൽ ആ ലോപഘടന മലയാളത്തിൽ മനസ്സിലാകുന്ന വിധം നിലനിർത്തി; വ്യക്തതയ്ക്കായി ക്രിയകൾ പൂർണമായി ആവർത്തിക്കുന്നതും സാധുവായൊരു പരിഭാഷയാണ്.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. 'പോറ്റിവളർത്തുകയും കരുതലോടെ പരിപാലിക്കുകയും' എന്ന കൂട്ടുപ്രയോഗം രണ്ടു ഗ്രീക്ക് ക്രിയകളുടെയും വ്യത്യസ്ത ഛായകൾ നിലനിർത്തുന്നു. മൂലത്തിലെ അവസാന കോമയ്ക്ക് പകരം മലയാളത്തിൽ വാക്യം പൂർണവിരാമത്തോടെ സമാപിപ്പിച്ചു.
