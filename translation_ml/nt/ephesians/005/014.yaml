  terminology: '‘വെളിച്ചം,’ ‘വെളിപ്പെടുത്തപ്പെടുന്നത്,’ ‘മശീഹ’ എന്നിവ യോജിച്ചതാണ്. എന്നാൽ അടിക്കുറിപ്പ് c-യിൽ ‘ഗ്രീക്ക്: “മശീഹ”’ എന്നു പറയുന്നത് കൃത്യമല്ല; ഗ്രീക്ക് പദം ὁ Χριστός ആണ്. ‘മശീഹ’ പരിഭാഷയാണ്, ഗ്രീക്ക് ലിപ്യന്തരണം അല്ല.'
