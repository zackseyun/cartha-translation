id: EPH.5.14
reference: Ephesians 5:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πᾶν γὰρ τὸ φανερούμενον φῶς ἐστιν. διὸ λέγει· Ἔγειρε, ὁ καθεύδων, καὶ ἀνάστα ἐκ τῶν νεκρῶν, καὶ ἐπιφαύσει σοι ὁ Χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/014.yaml
  text: For everything that is made visible is light[a]. Therefore it says, “Wake up, sleeper, and rise from the dead[c][b], and Messiah will shine on you.”
translation:
  language: ml
  text: 'വെളിപ്പെടുത്തപ്പെടുന്നതെല്ലാം വെളിച്ചമാണ്.[a] അതുകൊണ്ട് ഇങ്ങനെ പറയുന്നു: “ഉറങ്ങുന്നവനേ, ഉണരുക; മരിച്ചവരുടെ ഇടയിൽനിന്ന് എഴുന്നേൽക്കുക; മശീഹ നിന്റെമേൽ പ്രകാശിക്കും.”[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “തുറന്നുകാട്ടപ്പെടുന്നതെല്ലാം വെളിച്ചമാണ്.” φανερούμενον എന്ന പദത്തിന് “വെളിപ്പെടുത്തപ്പെടുന്നത്,” “ദൃശ്യമാക്കപ്പെടുന്നത്,” അല്ലെങ്കിൽ “തുറന്നുകാട്ടപ്പെടുന്നത്” എന്നിങ്ങനെ അർഥമാകാം.'
    reason: lexical_alternative
  - marker: b
    text: ഈ ഉദ്ധരണിയുടെ കൃത്യമായ ഉറവിടം അനിശ്ചിതമാണ്. ഇത് തിരുവെഴുത്തിലെ ആശയങ്ങളെ—പ്രത്യേകിച്ച് യെശയ്യാവ് 60:1-നെ—പ്രതിധ്വനിപ്പ Jenningsുന്നതോ ആദിമ ക്രൈസ്തവഗീതത്തിൽനിന്നുള്ളതോ ആയിരിക്കാം.
    reason: cross_reference
  - marker: c
    text: 'ഗ്രീക്കിൽ: “ക്രിസ്തു” (ὁ Χριστός); ഇവിടെ “മശീഹ” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു. പരമ്പരാഗതമായി “ക്രിസ്തു” എന്നും പരിഭാഷപ്പെടുത്തുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶν
  choice: എല്ലാം
  rationale: നപുംസക ഏകവചനമായ ഈ പ്രയോഗത്തിന്റെ പൊതുവ്യാപ്തി നിലനിർത്തുന്നു; വ്യക്തികളെ മാത്രം സൂചിപ്പിക്കുന്നതായി പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: φανερούμενον
  choice: വെളിപ്പെടുത്തപ്പെടുന്നത്
  rationale: φανερόω എന്ന ക്രിയയുടെ ‘ദൃശ്യമാക്കപ്പെടുക/വെളിപ്പെടുത്തപ്പെടുക’ എന്ന ഇരട്ടസാധ്യതയിൽ, മുൻവാക്യത്തിലെ വെളിച്ചം വെളിപ്പെടുത്തുന്നു എന്ന ആശയബന്ധം സ്വാഭാവികമായി നിലനിർത്തുന്നു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: φῶς
  choice: വെളിച്ചം
  rationale: മൂലത്തിലെ പ്രകാശരൂപകം വിശദീകരിച്ചു ചുരുക്കാതെ അതേപടി നിലനിർത്തുന്നു.
- source_word: διὸ
  choice: അതുകൊണ്ട്
  rationale: മുൻപ്രസ്താവനയിൽനിന്നുള്ള നിഗമനബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: λέγει
  choice: ഇങ്ങനെ പറയുന്നു
  rationale: ഗ്രീക്കിൽ കർത്താവ് വ്യക്തമല്ല; ‘തിരുവെഴുത്ത് പറയുന്നു’ എന്നോ ‘അവൻ പറയുന്നു’ എന്നോ ഉറവിടം നിർണയിക്കാതെ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു.
- source_word: Ἔγειρε
  choice: ഉണരുക
  rationale: ഉറക്കത്തിൽനിന്ന് ഉണരാനുള്ള ആജ്ഞയെ സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὁ καθεύδων
  choice: ഉറങ്ങുന്നവനേ
  rationale: നാമവാചകമായി ഉപയോഗിച്ചിരിക്കുന്ന വർത്തമാന കൃദന്തത്തിന്റെ നേരിട്ടുള്ള സംബോധനശക്തി നിലനിർത്തുന്നു.
- source_word: ἀνάστα
  choice: എഴുന്നേൽക്കുക
  rationale: ‘മരിച്ചവരുടെ ഇടയിൽനിന്ന്’ എന്ന അനുബന്ധത്തോടൊപ്പം ഉയിർത്തെഴുന്നേൽപ്പിന്റെ അനുരണനവും സാധാരണ എഴുന്നേൽപ്പിന്റെ ദൃശ്യവും നിലനിർത്തുന്നു.
- source_word: ἐκ τῶν νεκρῶν
  choice: മരിച്ചവരുടെ ഇടയിൽനിന്ന്
  rationale: ബഹുവചനമായ τῶν νεκρῶν-ന്റെ ‘മരിച്ചവരുടെ കൂട്ടത്തിൽനിന്ന്’ എന്ന അർഥം വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: ἐπιφαύσει
  choice: നിന്റെമേൽ പ്രകാശിക്കും
  rationale: പ്രകാശം ചൊരിയുക എന്ന മൂലരൂപകം വ്യാഖ്യാനപരമായി മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: ὁ Χριστός
  choice: മശീഹ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ Χριστός ഇവിടെ സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നതിനാൽ അതിന്റെ അർഥം മലയാളത്തിൽ ‘മശീഹ’ എന്നു നൽകുന്നു.
theological_decisions:
- issue: ഉദ്ധരണിയുടെ ഉറവിടം
  choice: ‘ഇങ്ങനെ പറയുന്നു’ എന്ന കർത്താവില്ലാത്ത അവതരണം
  alternative: ‘തിരുവെഴുത്ത് പറയുന്നു’; ‘അവൻ പറയുന്നു’; ‘ഒരു ഗീതത്തിൽ പറയുന്നു’
  rationale: ഗ്രീക്ക് വാചകം സംസാരിക്കുന്നവനെയോ ഉദ്ധരണിയുടെ ഉറവിടത്തെയോ വ്യക്തമാക്കുന്നില്ല; അതിനാൽ വിവാദമായ തിരിച്ചറിയൽ പരിഭാഷയിൽ തീർപ്പാക്കുന്നില്ല.
- issue: Χριστός എന്ന സ്ഥാനപ്പേര്
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ὁ Χριστός ഇവിടെ സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നു; ‘മശീഹ’ അഭിഷിക്തൻ എന്ന പദത്തിന്റെ സ്ഥാനപ്പേർസ്വഭാവം നിലനിർത്തുന്നു.
- issue: ‘വെളിപ്പെടുത്തപ്പെടുന്നതെല്ലാം വെളിച്ചമാണ്’ എന്ന പ്രസ്താവനയുടെ അർഥം
  choice: മൂലത്തിലെ സംക്ഷിപ്തവും ദൈവശാസ്ത്രപരമായി സംഘർഷമുള്ളതുമായ രൂപം നിലനിർത്തുക
  alternative: ‘വെളിച്ചത്താൽ വെളിപ്പെടുത്തപ്പെടുന്നതെല്ലാം ദൃശ്യമാകുന്നു’ എന്ന വ്യാഖ്യാനപരമായ പരിഭാഷ
  rationale: ഗ്രീക്കിൽ φῶς ἐστιν എന്നത് ‘വെളിച്ചമാണ്’ എന്നാണ്; അതിനെ ‘ദൃശ്യമാകുന്നു’ എന്നു മാറ്റുന്നത് യഥാർഥ വാക്യഘടനയും ആശയസംഘർഷവും മായ്ച്ചുകളയും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഉദ്ധരണിയിൽ കവിതാസ്വഭാവമുള്ള സമാന്തര ഘടന നിലനിർത്തിയിട്ടുണ്ട്. ‘വെളിപ്പെടുത്തപ്പെടുന്നതെല്ലാം വെളിച്ചമാണ്’ എന്ന ദുഷ്കരമായ പ്രസ്താവന ലളിതീകരിക്കാതെ സംരക്ഷിച്ചിട്ടുണ്ട്.
