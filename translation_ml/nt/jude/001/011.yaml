id: JUD.1.11
reference: Jude 1:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐαὶ αὐτοῖς, ὅτι τῇ ὁδῷ τοῦ Κάϊν ἐπορεύθησαν, καὶ τῇ πλάνῃ τοῦ Βαλαὰμ μισθοῦ ἐξεχύθησαν, καὶ τῇ ἀντιλογίᾳ τοῦ Κόρε ἀπώλοντο.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/011.yaml
  text: Woe to them[a], because they have walked in the way of Cain, and have poured themselves out for pay into Balaam’s error, and have perished in Korah’s rebellion.
translation:
  language: ml
  text: അവർക്ക് അയ്യോ![a] കാരണം, അവർ കയീന്റെ വഴിയിൽ നടന്നു; കൂലിക്കായി ബിലെയാമിന്റെ വഴിതെറ്റലിലേക്കു സ്വയം വിട്ടുകൊടുത്തു[b]; കോരഹിന്റെ കലാപത്തിൽ നശിച്ചുപോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “അവർക്ക് ഹാ കഷ്ടം!”'
    reason: οὐαί എന്ന വിധിവിലാപത്തിന്റെ സ്വാഭാവിക പകരംവിവർത്തനം.
  - marker: b
    text: 'അല്ലെങ്കിൽ: “ലാഭത്തിനായി അവർ ബിലെയാമിന്റെ വഴിതെറ്റലിലേക്കു തലകുത്തിപ്പാഞ്ഞു.”'
    reason: ἐξεχύθησαν എന്ന ദുഷ്കരമായ രൂപകപ്രയോഗത്തിന്റെ കൂടുതൽ വ്യാഖ്യാനാത്മകവും സ്വാഭാവികവുമായ പകരംവിവർത്തനം.
lexical_decisions:
- source_word: οὐαὶ αὐτοῖς
  choice: അവർക്ക് അയ്യോ കഷ്ടം!
  rationale: വിധിപ്രഖ്യാപനത്തിന്റെ പ്രവാചകീയ ശക്തി നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി കേൾക്കുകയും ചെയ്യുന്നു.
- source_word: τῇ ὁδῷ τοῦ Κάϊν ἐπορεύθησαν
  choice: കയീന്റെ വഴിയിൽ നടന്നു
  rationale: ὁδός എന്ന ജീവിതരീതിയുടെ രൂപകവും ἐπορεύθησαν എന്ന സഞ്ചാരഭാവവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: τῇ πλάνῃ τοῦ Βαλαὰμ
  choice: ബിലെയാമിന്റെ വഴിതെറ്റലിലേക്ക്
  rationale: πλάνηയിലെ തെറ്റായ വഴിയും ധാർമിക വ്യതിചലനവും ഉൾക്കൊള്ളുന്നു; ക്രിയയിലെ ചലനഭാവത്തോടു യോജിക്കാൻ ‘-ലേക്ക്’ ഉപയോഗിച്ചു.
- source_word: μισθοῦ
  choice: കൂലി മോഹിച്ച്
  rationale: μισθός പ്രതിഫലത്തെയോ കൂലിയെയോ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിലെ ലാഭലോലുപമായ പ്രേരണ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐξεχύθησαν
  choice: തങ്ങളെത്തന്നെ ഒഴുക്കിക്കളഞ്ഞു
  rationale: ‘ഒഴുക്കുക/ചൊരിയുക’ എന്ന ദൃശ്യരൂപം സംരക്ഷിച്ചുകൊണ്ട് നിയന്ത്രണമില്ലാത്ത സ്വയംവിട്ടുകൊടുക്കൽ സൂചിപ്പിക്കുന്നു.
- source_word: τῇ ἀντιλογίᾳ τοῦ Κόρε
  choice: കോരഹിന്റെ മത്സരത്തിൽ
  rationale: ἀντιλογίαയിലെ എതിർപ്പ്, മറുത്തുനിൽപ്പ്, കലാപം എന്നീ അർത്ഥങ്ങളിൽ സംഖ്യ 16-ലെ സംഭവത്തിന് യോജിച്ച ‘മത്സരം’ തെരഞ്ഞെടുത്തു.
- source_word: ἀπώλοντο
  choice: നശിച്ചുപോയി
  rationale: പൂർണമായ നാശഫലത്തെ ഗൗരവത്തോടെ, എന്നാൽ നാശത്തിന്റെ രീതി അധികമായി നിർവചിക്കാതെ അറിയിക്കുന്നു.
- source_word: Κάϊν / Βαλαὰμ / Κόρε
  choice: കയീൻ / ബിലെയാം / കോരഹ്
  rationale: മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ പേരുരൂപങ്ങൾ ഉപയോഗിച്ചു.
theological_decisions:
- issue: καὶ τῇ πλάνῃ τοῦ Βαλαὰμ μισθοῦ ἐξεχύθησαν എന്ന ദുഷ്കരമായ രൂപകപ്രയോഗം
  choice: കൂലി മോഹിച്ച് ബിലെയാമിന്റെ വഴിതെറ്റലിലേക്ക് തങ്ങളെത്തന്നെ ഒഴുക്കിക്കളഞ്ഞു
  alternative: ലാഭത്തിനായി അവർ ബിലെയാമിന്റെ വഴിതെറ്റലിലേക്ക് തലകുത്തിപ്പാഞ്ഞു
  rationale: പ്രധാനപാഠം ἐξεχύθησαν എന്ന ‘ഒഴുക്കിക്കളയുക’ രൂപകം നിലനിർത്തുന്നു; μισθοῦ സൂചിപ്പിക്കുന്ന പ്രതിഫലപ്രേരണയും വ്യക്തമാക്കുന്നു. കൂടുതൽ വ്യാഖ്യാനാത്മകവും സ്വാഭാവികവുമായ പകരം അടിക്കുറിപ്പിൽ നൽകി.
- issue: ἀντιλογίαയുടെ അർത്ഥപരിധി
  choice: മത്സരം
  alternative: കലാപം / എതിർപ്പ്
  rationale: കോരഹിന്റെ സംഭവത്തിലെ അധികാരത്തോടുള്ള മറുത്തുനിൽപ്പിനെ സൂചിപ്പിക്കുന്നു; വെറും വാക്കുതർക്കമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള പ്രവാചകീയ ശൈലി. മൂന്നു പഴയനിയമ ഉദാഹരണങ്ങളുടെ സമാന്തരഘടന സെമിക്കോളണുകൾകൊണ്ട് നിലനിർത്തി; ദുഷ്കരമായ ബിലെയാം വാക്യഭാഗത്തിന്റെ രൂപകം മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ചു.
