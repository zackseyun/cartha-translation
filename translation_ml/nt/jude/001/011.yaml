- from: അവർക്ക് അയ്യോ കഷ്ടം![a] കാരണം, അവർ കയീന്റെ വഴിയിൽ നടന്നു; കൂലി മോഹിച്ച് ബിലെയാമിന്റെ വഴിതെറ്റലിലേക്ക് തങ്ങളെത്തന്നെ ഒഴുക്കിക്കളഞ്ഞു; കോരഹിന്റെ മത്സരത്തിൽ നശിച്ചുപോയി.
  to: അവർക്ക് അയ്യോ![a] കാരണം, അവർ കയീന്റെ വഴിയിൽ നടന്നു; കൂലിക്കായി ബിലെയാമിന്റെ വഴിതെറ്റലിലേക്കു സ്വയം വിട്ടുകൊടുത്തു[b]; കോരഹിന്റെ കലാപത്തിൽ നശിച്ചുപോയി.
