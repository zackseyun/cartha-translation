id: JUD.1.16
reference: Jude 1:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὗτοί εἰσιν γογγυσταί, μεμψίμοιροι, κατὰ τὰς ἐπιθυμίας ⸀αὐτῶν πορευόμενοι, καὶ τὸ στόμα αὐτῶν λαλεῖ ὑπέρογκα, θαυμάζοντες πρόσωπα ὠφελείας χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/016.yaml
  text: These are grumblers[a], malcontents, walking according to their own desires, and their mouth speaks arrogant things[c][b], showing favoritism for the sake of gain.
translation:
  language: ml
  text: ഇവർ പിറുപിറുക്കുന്നവരും തങ്ങളുടെ ജീവിതാവസ്ഥയെക്കുറിച്ച് പരാതിപ്പെടുന്നവരുമാണ്; സ്വന്തം ആഗ്രഹങ്ങൾക്കനുസരിച്ച് ജീവിക്കുന്നവരാണ്[a]. അവരുടെ വായ് അഹങ്കാരം നിറഞ്ഞ വാക്കുകൾ പറയുന്നു[b]. നേട്ടത്തിനുവേണ്ടി അവർ ആളുകളോട് പക്ഷപാതം കാണിക്കുന്നു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സ്വന്തം ദുർമോഹങ്ങളെ പിന്തുടരുന്നവർ.’
    reason: alternative_reading
  - marker: b
    text: പദാനുപദമായി, ‘അവരുടെ വായ് വീർത്തുപൊങ്ങുന്ന വാക്കുകൾ പറയുന്നു.’ അഹങ്കാരവും വീമ്പും നിറഞ്ഞ സംസാരമാണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
  - marker: c
    text: പദാനുപദമായി, ‘മുഖങ്ങളെ ആദരിക്കുന്നു’—ആളുകളോട് പക്ഷപാതമോ പ്രത്യേക പ്രീതിയോ കാണിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ഒരു ഇടിയം.
    reason: lexical_alternative
lexical_decisions:
- source_word: γογγυσταί
  choice: പിറുപിറുക്കുന്നവർ
  rationale: മറ്റുള്ളവർ കേൾക്കത്തക്കവിധം ആവർത്തിച്ച് അസന്തോഷത്തോടെ പരാതി പറയുന്നവരെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: μεμψίμοιροι
  choice: തങ്ങളുടെ ജീവിതാവസ്ഥയെക്കുറിച്ച് പരാതിപ്പെടുന്നവർ
  rationale: ഈ അപൂർവപദം പൊതുവായ കുറ്റംകണ്ടെത്തലിനേക്കാൾ സ്വന്തം പങ്കിനെയോ അവസ്ഥയെയോ കുറിച്ചുള്ള അസന്തോഷവും പരാതിയും സൂചിപ്പിക്കുന്നു.
- source_word: κατὰ τὰς ἐπιθυμίας αὐτῶν πορευόμενοι
  choice: സ്വന്തം ആഗ്രഹങ്ങൾക്കനുസരിച്ച് ജീവിക്കുന്നവർ
  rationale: πορεύομαι ഇവിടെ ജീവിതനടപ്പിനെ സൂചിപ്പിക്കുന്നു. ἐπιθυμίαι എന്നത് ആഗ്രഹങ്ങളെ വിശാലമായി സൂചിപ്പിക്കാം; സന്ദർഭം അവയുടെ ധാർമികമായ തെറ്റായ സ്വഭാവം വ്യക്തമാക്കുന്നു.
- source_word: τὸ στόμα αὐτῶν λαλεῖ ὑπέρογκα
  choice: അവരുടെ വായ് അഹങ്കാരം നിറഞ്ഞ വാക്കുകൾ പറയുന്നു
  rationale: ഗ്രീക്കിലെ ഏകവചനമായ ‘വായ്’ എന്ന പ്രയോഗം നിലനിർത്തുന്നു; ὑπέρογκα എന്നത് വീമ്പും അതിരുകടന്ന അഹങ്കാരവും നിറഞ്ഞ സംസാരത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: θαυμάζοντες πρόσωπα
  choice: ആളുകളോട് പക്ഷപാതം കാണിക്കുന്നു
  rationale: ‘മുഖങ്ങളെ ആദരിക്കുക’ എന്ന പദാനുപദരൂപത്തിനുപിന്നിലെ വ്യക്തികളോടുള്ള സ്വാർഥമായ പ്രത്യേക പരിഗണന എന്ന ഇടിയത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὠφελείας χάριν
  choice: നേട്ടത്തിനുവേണ്ടി
  rationale: സ്വന്തം പ്രയോജനമോ ആനുകൂല്യമോ ലക്ഷ്യമാക്കിയുള്ള പ്രവൃത്തിയുടെ ഉദ്ദേശ്യം സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ἐπιθυμίαι എന്ന പദത്തിന്റെ ധാർമിക വ്യാപ്തി
  choice: പ്രധാനപാഠത്തിൽ ‘ആഗ്രഹങ്ങൾ’; പ്രതികൂല ധാർമികഭാവം സന്ദർഭത്തിൽനിന്ന് ലഭിക്കുന്നു
  alternative: ദുർമോഹങ്ങൾ / കാമങ്ങൾ
  rationale: പദത്തെ ലൈംഗിക കാമത്തിലേക്ക് അനാവശ്യമായി ചുരുക്കാതെ, യൂദായുടെ കുറ്റാരോപണത്തിലെ സ്വേച്ഛാനുസൃതമായ ആഗ്രഹങ്ങളുടെ വിശാലത സംരക്ഷിക്കുന്നു.
- issue: θαυμάζοντες πρόσωπα എന്ന ഇടിയത്തിന്റെ അർഥം
  choice: ആളുകളോട് പക്ഷപാതം കാണിക്കുന്നു
  alternative: ആളുകളെ മുഖസ്തുതി ചെയ്യുന്നു / മുഖങ്ങളെ ആദരിക്കുന്നു
  rationale: സ്വാർഥനേട്ടത്തിനായി വ്യക്തികൾക്ക് പ്രത്യേക പരിഗണന നൽകുന്നതാണ് സന്ദർഭത്തിലെ ധാർമിക കുറ്റം; പദാനുപദമായ വിവർത്തനം മലയാളത്തിൽ അർഥം മറയ്ക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ കുറ്റാരോപണങ്ങളുടെ കാഠിന്യം നിലനിർത്തിക്കൊണ്ട് അപൂർവപദവും ഇടിയങ്ങളും സാധാരണ വായനക്കാർക്ക് സുതാര്യമാക്കി; പദാർഥവ്യാപ്തിയും പദാനുപദരൂപങ്ങളും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
