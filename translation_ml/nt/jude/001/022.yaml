    text: അഥവാ, ‘ചാഞ്ചാടുന്നവർ’; ഒരുപക്ഷേ, ‘തർക്കിക്കുന്നവർ.’ ഈ സന്ദർഭത്തിൽ ഗ്രീക്ക് കൃദ്‌ന്തത്തിന് ഒന്നിലധികം അർഥസൂക്ഷ്മതകൾ ഉണ്ടാകാം.
