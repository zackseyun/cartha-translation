source:
  edition: SBLGNT
  text: Προεφήτευσεν δὲ καὶ τούτοις ἕβδομος ἀπὸ Ἀδὰμ Ἑνὼχ λέγων· Ἰδοὺ ἦλθεν κύριος ἐν ἁγίαις μυριάσιν αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/014.yaml
  text: And Enoch[a], the seventh from Adam, also prophesied to these, saying, “Behold[c][b], the Lord came with his holy myriads,”
translation:
  language: ml
  text: 'ആദാമിൽനിന്ന് ഏഴാമനായ ഹാനോക്കും ഇവരെക്കുറിച്ച് പ്രവചിച്ചു: “ഇതാ,[a] കർത്താവ് തന്റെ വിശുദ്ധരായ പതിനായിരങ്ങളോടുകൂടെ വന്നു.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ ഉദ്ധരണി 1 ഹാനോക്ക് 1:9-നെ പ്രതിധ്വനിപ്പിക്കുന്നു.
    reason: cross_reference
  - marker: b
    text: ‘തന്റെ വിശുദ്ധരായ അസംഖ്യരോടുകൂടെ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദത്തിന് ‘പതിനായിരങ്ങൾ’ അഥവാ അതിവലിയ ഒരു സമൂഹം എന്ന അർഥമുണ്ട്; ഈ വിശുദ്ധസമൂഹം ആരെ സൂചിപ്പിക്കുന്നു എന്ന് ഗ്രീക്ക് വ്യക്തമായി പറയുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: Προεφήτευσεν
  choice: പ്രവചിച്ചു
  rationale: προφητεύω എന്ന ക്രിയയുടെ പ്രവാചകവചനമറിയിക്കൽ എന്ന വിശാല അർഥം നിലനിർത്തുന്നു; വെറും ഭാവിപ്രവചനം എന്നതിലേക്കു ചുരുക്കുന്നില്ല.
- source_word: δὲ καὶ
  choice: -ക്കും ... പ്രവചിച്ചു
  rationale: δέയുടെ മൃദുവായ ബന്ധകസ്വഭാവവും καίയുടെ കൂട്ടിച്ചേർക്കൽശക്തിയും മലയാളത്തിലെ ‘ഹാനോക്കും’ എന്ന രൂപത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: τούτοις
  choice: ഇവരെക്കുറിച്ച്
  rationale: προφητεύωയോടൊപ്പമുള്ള ദത്തിവ് പ്രവചനത്തിന്റെ വിഷയത്തെയോ ലക്ഷ്യത്തെയോ സൂചിപ്പിക്കാം. മലയാളത്തിൽ ‘ഇവരെക്കുറിച്ച്’ സ്വാഭാവികമാണ്; ‘ഇവർക്കെതിരെ’ എന്ന സാധ്യത മാത്രം നിർബന്ധിക്കുന്നില്ല.
- source_word: ἕβδομος ἀπὸ Ἀδὰμ
  choice: ആദാമിൽനിന്ന് ഏഴാമനായ
  rationale: വംശാവലിസൂചനയെ നേരിട്ടും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
- source_word: Ἑνὼχ
  choice: ഹാനോക്ക്
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: λέγων
  choice: പറഞ്ഞത്
  rationale: ഉദ്ധരണി അവതരിപ്പിക്കുന്ന വർത്തമാന കൃതന്തത്തിന്റെ പ്രവർത്തനം മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: Ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗൗരവമുള്ള പ്രവാചകീയ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἦλθεν
  choice: വന്നു
  rationale: ഗ്രീക്കിലെ aorist ഭൂതകാലരൂപം അതേപടി സൂക്ഷിക്കുന്നു; ‘വരും’ എന്നു വ്യാഖ്യാനപരമായി മാറ്റുന്നില്ല.
- source_word: κύριος
  choice: കർത്താവ്
  rationale: κύριος എന്ന പദത്തിന്റെ സാധാരണ മലയാള ബൈബിൾ തുല്യം; ഇവിടെ സൂചിപ്പിക്കുന്നത് ദൈവമാണോ യേശുവാണോ എന്നു വിവർത്തനം നിർണ്ണയിക്കുന്നില്ല.
- source_word: ἐν ἁγίαις μυριάσιν αὐτοῦ
  choice: തന്റെ വിശുദ്ധരായ പതിനായിരങ്ങളോടുകൂടെ
  rationale: ἐν എന്നത് ഇവിടെ സഹവർത്തിത്വമായി ‘-ഓടുകൂടെ’ എന്നും μυριάσιν എന്നത് വലിയ വിശുദ്ധസമൂഹത്തെ സൂചിപ്പിക്കുന്ന ‘പതിനായിരങ്ങൾ’ എന്നും നൽകുന്നു; ഗ്രീക്ക് വ്യക്തമാക്കാത്ത ‘ദൂതന്മാർ’ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ഉദ്ധരണിയിലെ ‘കർത്താവ്’ ആരെന്ന തിരിച്ചറിയൽ
  choice: ‘കർത്താവ്’ എന്നു മാത്രം വിവർത്തനം ചെയ്യുന്നു.
  alternative: ഹാനോക്കീയ പശ്ചാത്തലത്തിൽ ദൈവത്തെ സൂചിപ്പിക്കുന്നതായി കാണുക; അല്ലെങ്കിൽ യൂദായുടെ പ്രയോഗത്തിൽ യേശുവിനെ സൂചിപ്പിക്കുന്നതായി കാണുക.
  rationale: ഗ്രീക്കിൽ κύριος എന്നു മാത്രമാണ്. ദൈവശാസ്ത്രപരമായ ഈ തുറന്ന നില വിവർത്തനം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
- issue: ഹാനോക്കിന്റെ വചനത്തിന്റെ ഉറവിടവും പദവിയും
  choice: യൂദാ അവതരിപ്പിക്കുന്നതുപോലെ പ്രവചനമായി വിവർത്തനം ചെയ്യുന്നു; മുഖ്യവാക്യത്തിൽ ഗ്രന്ഥപദവിയെക്കുറിച്ച് വിധിനിർണ്ണയം ചേർക്കുന്നില്ല.
  alternative: 1 ഹാനോക്ക് 1:9-ന്റെ നേരിട്ടുള്ള ഉദ്ധരണിയായി മാത്രം നിർവചിക്കുക; അല്ലെങ്കിൽ ഹാനോക്കിനോടു ബന്ധിപ്പിച്ച പാരമ്പര്യവചനമായി നിർവചിക്കുക.
  rationale: യൂദായുടെ ഭാഷ പ്രവചനത്തെ ഉറപ്പിക്കുന്നു, എന്നാൽ ഉദ്ധരിക്കപ്പെട്ട ഗ്രന്ഥത്തിന്റെ കാനോനിക പദവിയെക്കുറിച്ച് ഈ വാക്യം പ്രസ്താവന നടത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഹാനോക്ക്’, ‘കർത്താവ്’ എന്നീ പരിചിത ബൈബിൾരൂപങ്ങൾ നിലനിർത്തി. പ്രവാചകീയ ഭൂതകാലവും ‘വിശുദ്ധർ’ ആരെന്ന അപൂർണനിർണ്ണയവും പരിഹരിക്കാതെ സൂക്ഷിച്ചു.
