  source_fidelity: 'The draft accurately conveys the prior apostolic utterances and avoids unnecessarily turning προειρημένων into predictive prophecy. However, the emphatic contrastive subject Ὑμεῖς δέ is not adequately represented: ‘എന്നാൽ പ്രിയരേ’ supplies the contrast and vocative but omits ‘you.’'
