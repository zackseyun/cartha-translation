id: JUD.1.9
reference: Jude 1:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ Μιχαὴλ ὁ ἀρχάγγελος, ὅτε τῷ διαβόλῳ διακρινόμενος διελέγετο περὶ τοῦ Μωϋσέως σώματος, οὐκ ἐτόλμησεν κρίσιν ἐπενεγκεῖν βλασφημίας, ἀλλὰ εἶπεν· Ἐπιτιμήσαι σοι κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/009.yaml
  text: But Michael the archangel[a], when he was disputing with the devil and arguing about Moses' body, did not dare to bring a slanderous judgment against him, but said[b], “May the Lord rebuke you.”
translation:
  language: ml
  text: എന്നാൽ പ്രധാനദൂതനായ മീഖായേൽ പിശാചിനോടു തർക്കത്തിൽ ഏർപ്പെട്ട് മോശെയുടെ ശരീരത്തെക്കുറിച്ചു വാദിച്ചപ്പോൾ, അവന്റെമേൽ ദൂഷണപരമായ വിധി ചുമത്താൻ ധൈര്യപ്പെട്ടില്ല[a]. പകരം, “കർത്താവ് നിന്നെ ശാസിക്കട്ടെ” എന്നു പറഞ്ഞു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, കൂടുതൽ പരമ്പരാഗതമായി: “അവനെതിരെ നിന്ദാപരമായ കുറ്റാരോപണം ഉന്നയിക്കാൻ ധൈര്യപ്പെട്ടില്ല.”'
    reason: lexical_alternative
  - marker: b
    text: ഈ വാക്കുകൾ സെഖര്യാവ് 3:2-നെ പ്രതിധ്വനിപ്പിക്കുന്നു; അവിടെ കർത്താവ് സാത്താനെ ശാസിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: ἀρχάγγελος
  choice: പ്രധാനദൂതൻ
  rationale: ദൂതന്മാരിൽ മുഖ്യസ്ഥാനമുള്ളവൻ എന്ന പദവിയെ വ്യക്തവും മലയാളത്തിൽ സ്ഥാപിതവുമായ രീതിയിൽ അറിയിക്കുന്നു.
- source_word: διαβόλῳ
  choice: പിശാച്
  rationale: ഈ സന്ദർഭത്തിൽ വ്യക്തിപരമായ ദുഷ്ട എതിരാളിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അപവാദി’ എന്ന പദാർത്ഥപരമായ വിവർത്തനത്തേക്കാൾ സ്വാഭാവികമാണ്.
- source_word: διακρινόμενος ... διελέγετο
  choice: തർക്കത്തിൽ ഏർപ്പെട്ട് ... വാദിച്ചപ്പോൾ
  rationale: പരസ്പരം ബന്ധപ്പെട്ടെങ്കിലും വ്യത്യസ്തമായ രണ്ടു ഗ്രീക്ക് ക്രിയാരൂപങ്ങളും നിലനിർത്തി, തുടരുന്ന പ്രതികൂല വാഗ്വാദത്തിന്റെ ഭാവം നൽകുന്നു.
- source_word: περὶ τοῦ Μωϋσέως σώματος
  choice: മോശെയുടെ ശരീരത്തെക്കുറിച്ച്
  rationale: ഗ്രീക്കിലെ ബന്ധവും മൂർത്തമായ ‘ശരീരം’ എന്ന സൂചനയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: οὐκ ἐτόλμησεν
  choice: ധൈര്യപ്പെട്ടില്ല
  rationale: ഒരു കാര്യം ചെയ്യാൻ തുനിയുകയോ അതിനുള്ള ധൈര്യം കാണിക്കുകയോ ചെയ്തില്ല എന്ന τολμάωയുടെ അർത്ഥം നേരിട്ട് നൽകുന്നു.
- source_word: κρίσιν ἐπενεγκεῖν βλασφημίας
  choice: അവന്റെമേൽ ദൂഷണപരമായ വിധി ചുമത്താൻ
  rationale: പ്രയോഗത്തിന്റെ ന്യായവിധിസംബന്ധമായ സ്വരം നിലനിർത്തുകയും βλασφημίας എന്ന ദുഷ്കരമായ ഘടകത്തെ ദൂഷണസ്വഭാവമുള്ള വിധിയായി അവതരിപ്പിക്കുകയും ചെയ്യുന്നു; മറ്റൊരു സാദ്ധ്യമായ വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: Ἐπιτιμήσαι σοι κύριος
  choice: കർത്താവ് നിന്നെ ശാസിക്കട്ടെ
  rationale: ഓപ്റ്റേറ്റീവ് ക്രിയയുടെ ആശംസാ/ആഹ്വാന ഭാവം മലയാളത്തിലെ ‘-ട്ടെ’ രൂപം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: κύριος
  choice: കർത്താവ്
  rationale: κύριος എന്ന ദൈവിക അഭിസംബോധനയ്ക്കുള്ള സ്ഥാപിതവും മാന്യവുമായ മലയാളരൂപം.
theological_decisions:
- issue: പിശാചിനെ അഭിസംബോധന ചെയ്യുന്നതിൽ മീഖായേൽ കാണിച്ച നിയന്ത്രണത്തിന്റെ സ്വഭാവം
  choice: മീഖായേൽ സ്വന്തം അധികാരത്തിൽ ദൂഷണപരമായ വിധി ചുമത്താതെ കർത്താവിന്റെ ശാസന അഭ്യർഥിക്കുന്നു.
  alternative: മീഖായേൽ നിന്ദാപരമായ കുറ്റാരോപണം ഉന്നയിക്കാൻ ധൈര്യപ്പെട്ടില്ല.
  rationale: 'κρίσιν ... βλασφημίας എന്ന ഗ്രീക്ക് പ്രയോഗം വ്യാഖ്യാനവ്യത്യാസമുള്ളതാണ്. വിവർത്തനം വിശദമായ ദൂതശാസ്ത്രം ചേർക്കാതെ വ്യക്തമായ വൈരുധ്യം സംരക്ഷിക്കുന്നു: മീഖായേൽ സ്വയം വിധി ചുമത്തുന്നില്ല; കർത്താവിന്റെ അധികാരത്തിലേക്കാണ് തിരിയുന്നത്.'
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘തർക്കത്തിൽ ഏർപ്പെട്ട് ... വാദിച്ചപ്പോൾ’ എന്ന ഘടന മൂലത്തിലെ രണ്ടു ക്രിയകളെയും അനാവശ്യമായി ഒന്നാക്കി ചുരുക്കാതെ വായനാസൗകര്യം നിലനിർത്തുന്നു. വാക്യത്തിന്റെ വൈരുധ്യം വ്യക്തമാക്കാൻ ‘പകരം’ ഉപയോഗിച്ചിട്ടുണ്ട്.
