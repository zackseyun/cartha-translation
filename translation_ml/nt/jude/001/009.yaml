  naturalness: വാചകം ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും മാന്യവുമാണ്. ‘തർക്കത്തിൽ ഏർപ്പെട്ട് ... വാദിച്ചപ്പോൾ’ എന്ന പ്രയോഗം ചിലവണ്ണം ഔപചാരികമാണെങ്കിലും തിരുവെഴുത്തിന്റെ രജിസ്റ്ററിന് യോജിക്കുകയും മൂലത്തിലെ രണ്ടു ക്രിയകളെ വേർതിരിച്ചു നിലനിർത്തുകയും ചെയ്യുന്നു. ‘പകരം’ വൈരുധ്യം വ്യക്തമായി അടയാളപ്പെടുത്തുന്നു.
