id: JUD.1.12
reference: Jude 1:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὗτοί εἰσιν ⸀οἱ ἐν ταῖς ἀγάπαις ὑμῶν σπιλάδες συνευωχούμενοι, ἀφόβως ἑαυτοὺς ποιμαίνοντες, νεφέλαι ἄνυδροι ὑπὸ ἀνέμων παραφερόμεναι, δένδρα φθινοπωρινὰ ἄκαρπα δὶς ἀποθανόντα ἐκριζωθέντα,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/012.yaml
  text: These are hidden reefs at your love feasts[a], feasting together without fear, shepherding themselves; waterless clouds carried along by winds; autumn trees without fruit, twice dead[c][b], uprooted.
translation:
  language: ml
  text: ഇവർ നിങ്ങളുടെ സ്നേഹവിരുന്നുകളിൽ[a] നിങ്ങളോടൊപ്പം നിർഭയം വിരുന്നുണ്ണുന്ന മറഞ്ഞുകിടക്കുന്ന പാറക്കെട്ടുകളാണ്; തങ്ങളെത്തന്നെ മേയിക്കുന്നവർ[b]; കാറ്റുകളാൽ പറത്തിക്കൊണ്ടുപോകപ്പെടുന്ന വെള്ളമില്ലാത്ത മേഘങ്ങൾ; ഫലമില്ലാത്ത ശരത്കാലവൃക്ഷങ്ങൾ—രണ്ടുവട്ടം മരിച്ചവ, വേരോടെ പിഴുതെറിയപ്പെട്ടവ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘നിങ്ങളുടെ സ്നേഹവിരുന്നുകളിലെ കളങ്കങ്ങൾ’ അഥവാ ‘കറകൾ’. ഗ്രീക്കുപദത്തിന് നൈതികമായ കളങ്കം എന്ന അർഥമുണ്ടാകാം; അപകടകരമായ മറഞ്ഞുകിടക്കുന്ന പാറക്കെട്ടുകളെയും അത് സൂചിപ്പിക്കാം. ഇവിടെ തുടർന്നുവരുന്ന ശക്തമായ രൂപകങ്ങളുടെ നിരയോട് രണ്ടാമത്തെ അർഥം കൂടുതൽ യോജിക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: ‘തങ്ങളെത്തന്നെ മേയിക്കുന്നവർ’ എന്നത് ‘തങ്ങളെത്തന്നെ പോറ്റുന്നവർ’ എന്നും പരിഭാഷപ്പെടുത്താം; ഇത് അവരുടെ സ്വാർഥമായ പെരുമാറ്റത്തെ ഊന്നിക്കാട്ടുന്നു. സ്വയം പോറ്റുന്ന ഇടയന്മാരുടെ ചിത്രത്തിനായി യെഹെസ്കേൽ 34 കാണുക.
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: σπιλάδες
  choice: മറഞ്ഞുകിടക്കുന്ന പാറക്കെട്ടുകൾ
  rationale: സമൂഹവിരുന്നിനുള്ളിലെ ഒളിഞ്ഞ അപകടത്തെ സൂചിപ്പിക്കുന്ന സമുദ്രരൂപകം നിലനിർത്തുന്നു. ‘കളങ്കങ്ങൾ’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἀγάπαις
  choice: സ്നേഹവിരുന്നുകൾ
  rationale: ക്രൈസ്തവസ്നേഹത്താൽ അടയാളപ്പെട്ട സമൂഹഭോജനങ്ങളെ സൂചിപ്പിക്കുന്ന ബഹുവചനപ്രയോഗം; മലയാളത്തിൽ കൃത്യവും സ്വാഭാവികവുമായ പദം.
- source_word: συνευωχούμενοι
  choice: നിങ്ങളോടൊപ്പം ... വിരുന്നുണ്ണുന്ന
  rationale: ഒരുമിച്ച് വിരുന്നിൽ പങ്കുചേരുന്നതെന്ന ആശയം വ്യക്തമാക്കുന്നു; സന്ദർഭത്തിലെ ‘നിങ്ങളുടെ സ്നേഹവിരുന്നുകൾ’ എന്നതിൽനിന്ന് പങ്കാളിത്തബന്ധം സ്വാഭാവികമായി വരുന്നു.
- source_word: ἀφόβως
  choice: നിർഭയം
  rationale: ഭയമില്ലായ്മ, ലജ്ജയില്ലായ്മ, ആദരവില്ലായ്മ എന്നിവയിൽ ഒന്നായി മാത്രം വ്യാഖ്യാനിക്കാതെ ഗ്രീക്കിലെ സംക്ഷിപ്തതയും സാധ്യതാവ്യാപ്തിയും നിലനിർത്തുന്നു.
- source_word: ἑαυτοὺς ποιμαίνοντες
  choice: തങ്ങളെത്തന്നെ മേയിക്കുന്നവർ
  rationale: ποιμαίνω എന്ന ക്രിയയുടെ ഇടയരൂപകം സംരക്ഷിക്കുകയും സ്വാർഥപരിചരണത്തിന്റെ ധ്വനി നൽകുകയും ചെയ്യുന്നു; ‘തങ്ങളെത്തന്നെ പോറ്റുന്നവർ’ എന്ന അർഥവും സാധ്യമാണ്.
- source_word: νεφέλαι ἄνυδροι
  choice: വെള്ളമില്ലാത്ത മേഘങ്ങൾ
  rationale: പ്രതീക്ഷ നൽകിയും പ്രയോജനം നൽകാതെയും ഇരിക്കുന്നതിന്റെ ദൃശ്യരൂപകം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: παραφερόμεναι
  choice: ഒഴുക്കിക്കൊണ്ടുപോകപ്പെടുന്ന
  rationale: കാറ്റുകൾക്കു വിധേയമായി കൊണ്ടുപോകപ്പെടുന്നതെന്ന കർമണിപ്രയോഗം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: δένδρα φθινοπωρινὰ ἄκαρπα
  choice: ഫലമില്ലാത്ത ശരത്കാലവൃക്ഷങ്ങൾ
  rationale: ഫലം പ്രതീക്ഷിക്കപ്പെടുന്ന കാലത്തും ഫലരഹിതമായ മരങ്ങളുടെ മൂർത്തമായ ചിത്രം സംരക്ഷിക്കുന്നു.
- source_word: δὶς ἀποθανόντα
  choice: രണ്ടുവട്ടം മരിച്ചവ
  rationale: വാചകത്തിന്റെ ഉദ്ദേശപൂർവമായ ശക്തിയും വ്യാഖ്യാനിക്കപ്പെടാത്ത ദൈവശാസ്ത്രപരമായ സംഘർഷവും അതേപടി നിലനിർത്തുന്നു.
- source_word: ἐκριζωθέντα
  choice: വേരോടെ പിഴുതെറിയപ്പെട്ടവ
  rationale: പൂർണവും മാറ്റാനാവാത്തതുമായ ജീവഹീനതയുടെ ശക്തമായ ചിത്രം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: σπιλάδες എന്ന പദം വ്യാജോപദേഷ്ടാക്കളെ എങ്ങനെ ചിത്രീകരിക്കുന്നു
  choice: സമൂഹത്തിന്റെ സ്നേഹവിരുന്നുകളിലെ മറഞ്ഞ അപകടങ്ങളായ പാറക്കെട്ടുകൾ
  alternative: സ്നേഹവിരുന്നുകളിലെ കളങ്കങ്ങൾ അഥവാ കറകൾ
  rationale: തുടർന്നുവരുന്ന പ്രകൃതിരൂപകങ്ങളുടെ നിരയിൽ മറഞ്ഞ പാറക്കെട്ടുകൾ എന്ന വായന ശക്തമായി ചേരുന്നു; എങ്കിലും നൈതികകളങ്കം എന്ന പുരാതന വിവർത്തനസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: ἑαυτοὺς ποιμαίνοντες എന്നതിലെ ποιμαίνοντες-ന്റെ ശക്തി
  choice: ഇടയരൂപകം നിലനിർത്തി ‘തങ്ങളെത്തന്നെ മേയിക്കുന്നവർ’
  alternative: ‘തങ്ങളെത്തന്നെ പോറ്റുന്നവർ’
  rationale: മൂലക്രിയ സാധാരണയായി മേയിക്കുക/ഇടയനായിരിക്കുക എന്നർഥം നൽകുന്നു; യെഹെസ്കേൽ 34-ലെ സ്വാർഥ ഇടയന്മാരുമായുള്ള പ്രതിധ്വനി വ്യാഖ്യാനമായി അടിച്ചേൽപ്പിക്കാതെ നിലനിർത്തുന്നു.
- issue: δὶς ἀποθανόντα എന്ന പ്രയോഗത്തിന്റെ വ്യാഖ്യാനം
  choice: ‘രണ്ടുവട്ടം മരിച്ചവ’ എന്ന് നേരിട്ട് നിലനിർത്തി
  alternative: ‘പൂർണമായി മരിച്ചവ’ എന്ന വിശദീകരണപരമായ വിവർത്തനം
  rationale: ഗ്രീക്കിലെ അസാധാരണവും ശക്തവുമായ വാചകം ഒരു പ്രത്യേക ദൈവശാസ്ത്രവ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. യൂദായുടെ അതിവേഗ രൂപകനിര നിലനിർത്താൻ അർദ്ധവിരാമങ്ങളും ദീർഘവിരാമവും ഉപയോഗിച്ചു. ‘നിർഭയം’, ‘രണ്ടുവട്ടം മരിച്ചവ’ തുടങ്ങിയ അർഥസന്ദിഗ്ധമായ പ്രയോഗങ്ങൾ അമിതവ്യാഖ്യാനം കൂടാതെ സംരക്ഷിച്ചു.
