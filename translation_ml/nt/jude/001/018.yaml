id: JUD.1.18
reference: Jude 1:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι ἔλεγον ⸀ὑμῖν· ⸂Ἐπ’ ἐσχάτου χρόνου⸃ ἔσονται ἐμπαῖκται κατὰ τὰς ἑαυτῶν ἐπιθυμίας πορευόμενοι τῶν ἀσεβειῶν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/018.yaml
  text: that they were saying to you[a], “In the last time there will be mockers[b], going according to their own ungodly desires.”
translation:
  language: ml
  text: 'അവർ നിങ്ങളോടു ഇങ്ങനെ പറഞ്ഞുകൊണ്ടിരുന്നു: “അവസാനകാലത്ത് തങ്ങളുടെ ഭക്തികെട്ട മോഹങ്ങൾക്കനുസരിച്ച് നടക്കുന്ന പരിഹാസികൾ ഉണ്ടാകും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: പറഞ്ഞുകൊണ്ടിരുന്നത്
  rationale: അപൂർണ ഭൂതകാലരൂപം ആവർത്തിച്ചോ തുടർന്നോ ഉണ്ടായിരുന്ന പ്രസ്താവനയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ ഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: Ἐπ’ ἐσχάτου χρόνου
  choice: അവസാനകാലത്ത്
  rationale: χρόνου ഏകവചനമായതിനാൽ ‘അവസാനനാളുകളിൽ’ എന്നു മാറ്റാതെ, കാലത്തെ സൂചിപ്പിക്കുന്ന ഏകവചനപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: ἐμπαῖκται
  choice: പരിഹാസികൾ
  rationale: മറ്റുള്ളവരെയും വിശ്വാസസത്യങ്ങളെയും അവഹേളിച്ച് പരിഹസിക്കുന്നവരെ സൂചിപ്പിക്കുന്ന, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ആധുനിക പദം.
- source_word: κατὰ τὰς ἑαυτῶν ἐπιθυμίας
  choice: തങ്ങളുടെ ... മോഹങ്ങൾക്കനുസരിച്ച്
  rationale: κατάയുടെ അനുരൂപത/അനുസരണം എന്ന ആശയം കാത്തുസൂക്ഷിക്കുന്നു; ἐπιθυμίαιയെ ലൈംഗിക മോഹങ്ങളിൽ മാത്രം ഒതുക്കാതെ വിശാലമായി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: πορευόμενοι
  choice: ജീവിക്കും
  rationale: അക്ഷരാർഥത്തിൽ ‘നടക്കുക/പോകുക’ എന്നാണെങ്കിലും ഇവിടെ ജീവിതരീതിയെ സൂചിപ്പിക്കുന്ന രൂപകപ്രയോഗമാണ്; ആ അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τῶν ἀσεβειῶν
  choice: ഭക്തികെട്ട
  rationale: ദൈവത്തോടുള്ള ആദരവും ഭക്തിയും ഇല്ലാത്ത സ്വഭാവം മോഹങ്ങളെ വിശേഷിപ്പിക്കുന്നതായി സംക്ഷിപ്തവും വ്യക്തവുമായി നൽകുന്നു.
theological_decisions:
- issue: അന്ത്യകാലപ്രയോഗം
  choice: അവസാനകാലത്ത്
  alternative: അവസാനനാളുകളിൽ; കാലത്തിന്റെ അവസാനത്തിൽ
  rationale: മൂലത്തിലെ χρόνος എന്ന ഏകവചനം സംരക്ഷിക്കുകയും മറ്റു വേദഭാഗങ്ങളിലെ പരിചിതമായ ‘അവസാനനാളുകൾ’ എന്ന പ്രയോഗത്തോട് സമന്വയിപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: മോഹങ്ങളുടെ ധാർമിക വിശേഷണം
  choice: ഭക്തികെട്ട മോഹങ്ങൾ
  alternative: അഭക്തിയുടെ മോഹങ്ങൾ; ദൈവഭക്തിയില്ലാത്ത മോഹങ്ങൾ
  rationale: മൂലപാഠത്തിലെ ധാർമിക വിധി നിലനിർത്തുന്നു; എന്നാൽ ἐπιθυμίαιയെ ലൈംഗിക കാമമായി മാത്രം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, പൊതുവായ വായനയ്ക്ക് വ്യക്തവും സഭാവായനയ്ക്ക് മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ ഏകവചനമായ ‘കാലം’ സംരക്ഷിച്ചു; ജീവിതരീതിയെ സൂചിപ്പിക്കുന്ന πορευόμενοι സ്വാഭാവികതയ്ക്കായി ‘ജീവിക്കും’ എന്നു നൽകി.
