revisions:
- from: സൊദോമും ഗൊമോറയും അവയുടെ ചുറ്റുമുള്ള പട്ടണങ്ങളും ഇവരെപ്പോലെതന്നെ[a] ലൈംഗിക അധാർമികതയിൽ ഏർപ്പെടുകയും വ്യത്യസ്തമായ ജഡത്തെ പിന്തുടരുകയും ചെയ്തതിനാൽ, നിത്യാഗ്നിയുടെ ശിക്ഷ അനുഭവിച്ചുകൊണ്ട് മുന്നറിയിപ്പായ ഒരു ഉദാഹരണമായി നിലകൊള്ളുന്നു.[b]
  to: അതുപോലെതന്നെ, സൊദോമും ഗൊമോറയും അവയ്ക്കു ചുറ്റുമുള്ള പട്ടണങ്ങളും, അവരോടു സമാനമായ രീതിയിൽ[a] ലൈംഗിക അധാർമികതയിൽ ഏർപ്പെടുകയും വ്യത്യസ്തമായ ജഡത്തെ[b] പിന്തുടരുകയും ചെയ്ത്, നിത്യാഗ്നിയുടെ ശിക്ഷ അനുഭവിച്ചുകൊണ്ട് ഒരു ഉദാഹരണമായി വെച്ചിരിക്കുകയാണ്.
  rationale: The revision removes an unsupported causal link, translates δεῖγμα without interpretive expansion, and places each footnote marker beside the expression it documents. It preserves the ambiguity of τούτοις and σαρκὸς ἑτέρας, as well as the ongoing exemplary/judicial presentation expressed by the Greek present forms.
  reviewer_model: gpt-5.6-terra
