id: JUD.1.7
reference: Jude 1:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὡς Σόδομα καὶ Γόμορρα καὶ αἱ περὶ αὐτὰς πόλεις, τὸν ὅμοιον ⸂τρόπον τούτοις⸃ ἐκπορνεύσασαι καὶ ἀπελθοῦσαι ὀπίσω σαρκὸς ἑτέρας, πρόκεινται δεῖγμα πυρὸς αἰωνίου δίκην ὑπέχουσαι.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/007.yaml
  text: just as Sodom and Gomorrah and the cities around them[a], having in like manner committed sexual immorality and gone after other flesh, are set forth as an example[b], undergoing the punishment of eternal fire.
translation:
  language: ml
  text: അതുപോലെതന്നെ, സൊദോമും ഗൊമോറയും അവയ്ക്കു ചുറ്റുമുള്ള പട്ടണങ്ങളും, അവരോടു സമാനമായ രീതിയിൽ[a] ലൈംഗിക അധാർമികതയിൽ ഏർപ്പെടുകയും വ്യത്യസ്തമായ ജഡത്തെ[b] പിന്തുടരുകയും ചെയ്ത്, നിത്യാഗ്നിയുടെ ശിക്ഷ അനുഭവിച്ചുകൊണ്ട് ഒരു ഉദാഹരണമായി വെച്ചിരിക്കുകയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവരോടു സമാനമായ രീതിയിൽ’ എന്നതിലെ ‘അവർ’ 6-ാം വാക്യത്തിൽ പറഞ്ഞ ദൂതന്മാരെയോ, കൂടുതൽ പൊതുവായി മുൻപു പറഞ്ഞ കലാപത്തിന്റെയും ന്യായവിധിയുടെയും ഉദാഹരണങ്ങളെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
  - marker: b
    text: ‘വ്യത്യസ്തമായ ജഡം’ എന്നതിന് ‘അന്യജഡം’ എന്നും പരിഭാഷപ്പെടുത്താം. ഈ പദപ്രയോഗത്തെ ഒരൊറ്റ പ്രത്യേക വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതെ അക്ഷരാർഥത്തിൽ നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: …പോലെതന്നെ
  rationale: മുൻവാക്യത്തിലെ ഉദാഹരണങ്ങളോടുള്ള താരതമ്യം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: Σόδομα καὶ Γόμορρα
  choice: സൊദോമും ഗൊമോറയും
  rationale: സ്ഥലനാമങ്ങളുടെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: αἱ περὶ αὐτὰς πόλεις
  choice: അവയുടെ ചുറ്റുമുള്ള പട്ടണങ്ങളും
  rationale: περὶ എന്നതിന്റെ ഭൂമിശാസ്ത്രപരമായ ചുറ്റുപാടെന്ന അർഥം നിലനിർത്തുന്നു; നപുംസക ബഹുവചനമായ പട്ടണങ്ങളോട് യോജിക്കുന്ന സർവനാമം ഉപയോഗിക്കുന്നു.
- source_word: τὸν ὅμοιον τρόπον τούτοις
  choice: ഇവരെപ്പോലെതന്നെ
  rationale: ഗ്രീക്കിലെ താരതമ്യവും τούτοις എന്ന സർവനാമവും നേരിട്ട് നിലനിർത്തുന്നു; അതിന്റെ കൃത്യമായ പൂർവപദം അടിക്കുറിപ്പിൽ തുറന്നുവയ്ക്കുന്നു.
- source_word: ἐκπορνεύσασαι
  choice: ലൈംഗിക അധാർമികതയിൽ ഏർപ്പെടുകയും
  rationale: ക്രിയയുടെ ലൈംഗിക ദുർനടപ്പെന്ന അർഥം വ്യക്തവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀπελθοῦσαι ὀπίσω
  choice: പിന്തുടരുകയും
  rationale: എന്തിന്റെയോ പിന്നാലെ പോകുക അഥവാ അതിനെ തേടിപ്പോകുക എന്ന പ്രയോഗാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: σαρκὸς ἑτέρας
  choice: വ്യത്യസ്തമായ ജഡത്തെ
  rationale: ἑτέρας എന്നതിന്റെ ‘മറ്റൊരു/വ്യത്യസ്തമായ’ അർഥവും σάρξ എന്നതിന്റെ ദേഹപരമായ ‘ജഡം’ എന്ന പദവും നിലനിർത്തി, പ്രത്യേക വ്യാഖ്യാനം അടിച്ചേൽപ്പിക്കുന്നില്ല.
- source_word: πρόκεινται δεῖγμα
  choice: മുന്നറിയിപ്പായ ഒരു ഉദാഹരണമായി നിലകൊള്ളുന്നു
  rationale: പരസ്യമായി മുന്നിൽ വെച്ചിരിക്കുന്ന മാതൃക എന്ന ആശയവും സന്ദർഭത്തിലെ മുന്നറിയിപ്പിന്റെ സ്വഭാവവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: πυρὸς αἰωνίου
  choice: നിത്യാഗ്നിയുടെ
  rationale: അഗ്നിയോടു ബന്ധിപ്പിച്ച αἰώνιος എന്ന വിശേഷണത്തിന്റെ ഗൗരവം ചുരുക്കുകയോ വികസിപ്പിക്കുകയോ ചെയ്യാതെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: δίκην ὑπέχουσαι
  choice: ശിക്ഷ അനുഭവിച്ചുകൊണ്ട്
  rationale: ശിക്ഷയ്ക്ക് വിധേയരാകുക എന്ന ന്യായവിധിസംബന്ധമായ പ്രയോഗാർഥവും പങ്കാളിക്രിയയുടെ ബന്ധവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: τούτοις എന്നതിന്റെ പൂർവപദം
  choice: പ്രധാനവാചകത്തിൽ ‘ഇവരെപ്പോലെതന്നെ’ എന്നു സർവനാമം നിലനിർത്തി.
  alternative: ഇത് 6-ാം വാക്യത്തിലെ ദൂതന്മാരെയോ, കൂടുതൽ പൊതുവായി മുൻപുള്ള കലാപ-ന്യായവിധി ഉദാഹരണങ്ങളെയോ സൂചിപ്പിക്കാം.
  rationale: ഗ്രീക്ക് വ്യക്തമായൊരു താരതമ്യം നടത്തുന്നു, എന്നാൽ സർവനാമത്തിന്റെ കൃത്യമായ പൂർവപദം വിവാദവിധേയമാണ്; അതിനാൽ വിവർത്തനം അത് തീർപ്പാക്കുന്നില്ല.
- issue: σαρκὸς ἑτέρας എന്നതിന്റെ കൃത്യമായ സൂചന
  choice: ‘വ്യത്യസ്തമായ ജഡം’ എന്നു അക്ഷരാർഥത്തോട് ചേർന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘അന്യജഡം’; സ്വവർഗ ലൈംഗികതയെന്നോ ദൂത-മനുഷ്യ അതിർത്തിലംഘനമെന്നോ പ്രത്യേകമായി വ്യാഖ്യാനിക്കൽ.
  rationale: വാക്യഘടകത്തിന്റെ കൃത്യമായ ചരിത്ര-വ്യാഖ്യാന സൂചന വിവാദവിധേയമായതിനാൽ ഗ്രീക്ക് പറയുന്നതിനെക്കാൾ ഇടുങ്ങിയ സിദ്ധാന്തപരമായ നിഗമനം ചേർക്കുന്നില്ല.
- issue: πυρὸς αἰωνίου എന്ന വിധിന്യായഭാഷ
  choice: ‘നിത്യാഗ്നി’ എന്ന മൂലവാചകപ്രയോഗം നിലനിർത്തി.
  alternative: ‘എന്നേക്കുമുള്ള അഗ്നി’.
  rationale: വാക്യത്തിന്റെ ഗൗരവം മൃദൂകരിക്കാതെയും അതിൽനിന്ന് സമ്പൂർണമായൊരു വ്യവസ്ഥാപിത സിദ്ധാന്തം വികസിപ്പിക്കാതെയും നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു.
- issue: പട്ടണങ്ങൾ ശിക്ഷ അനുഭവിക്കുന്നു എന്ന വർത്തമാനകാലപ്രയോഗം
  choice: ‘ശിക്ഷ അനുഭവിച്ചുകൊണ്ട് … നിലകൊള്ളുന്നു’ എന്ന ഗ്രീക്ക് ഘടന നിലനിർത്തി.
  alternative: പട്ടണങ്ങളുടെ നാശം മാത്രം ചരിത്രസംഭവമായി പരാവർത്തനം ചെയ്യുക.
  rationale: πρόκεινται, ὑπέχουσαι എന്നീ വർത്തമാനരൂപങ്ങളുടെ അലങ്കാരപരവും വിധിന്യായപരവുമായ സംഘർഷം വിവർത്തനത്തിൽ മായ്ച്ചുകളയുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘ജഡം’, ‘നിത്യാഗ്നി’ എന്നീ ദൈവശാസ്ത്രഭാരമുള്ള പദങ്ങൾ മൂലത്തിലെ രൂപകവും ഗൗരവവും സംരക്ഷിക്കാൻ ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
