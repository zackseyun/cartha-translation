id: JUD.1.23
reference: Jude 1:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὓς δὲ σῴζετε ἐκ πυρὸς ἁρπάζοντες, οὓς δὲ ἐλεᾶτε ἐν φόβῳ⸃, μισοῦντες καὶ τὸν ἀπὸ τῆς σαρκὸς ἐσπιλωμένον χιτῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/023.yaml
  text: save others by snatching them out of the fire[a]; and have mercy on others with fear[d][c][b], hating even the tunic stained by the flesh.
translation:
  language: ml
  text: മറ്റു ചിലരെ തീയിൽനിന്ന് വലിച്ചെടുത്ത് രക്ഷിക്കുക[a]; മറ്റു ചിലരോടാകട്ടെ ഭയത്തോടെ കരുണ കാണിക്കുക[b]—ജഡത്താൽ കറപറ്റിയ ഉള്ളുടുപ്പുപോലും വെറുത്തുകൊണ്ട്[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മറ്റു ചിലരെ തീയിൽനിന്ന് പിടിച്ചുവലിച്ച് രക്ഷിക്കുക.” ഈ ചിത്രം വരാനിരിക്കുന്ന ന്യായവിധിയെയോ ഗുരുതരമായ ആത്മീയ അപകടത്തെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
  - marker: b
    text: “ഭയത്തോടെ” എന്നത് ദൈവത്തോടുള്ള ഭക്തിപൂർവമായ ഭയത്തോടെയെന്നോ, താനും ദുഷിപ്പിക്കപ്പെടാതിരിക്കാനുള്ള ജാഗ്രതയോടെയെന്നോ അർത്ഥമാക്കാം.
    reason: lexical_alternative
  - marker: c
    text: 'അഥവാ, “പാപസ്വഭാവത്താൽ മലിനമായ വസ്ത്രംപോലും.” ഗ്രീക്ക്: “ജഡം.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: σῴζετε
  choice: രക്ഷിക്കുക
  rationale: വർത്തമാനകാല ആജ്ഞയുടെ ശക്തിയും രക്ഷ എന്ന ദൈവശാസ്ത്രപരമായ അർത്ഥസാധ്യതയും നിലനിർത്തുന്നു; തീയിൽനിന്നുള്ള അടിയന്തര രക്ഷ എന്ന സന്ദർഭത്തിലും സ്വാഭാവികമാണ്.
- source_word: ἐκ πυρὸς ἁρπάζοντες
  choice: തീയിൽനിന്ന് വലിച്ചെടുത്ത്
  rationale: ἁρπάζω സൂചിപ്പിക്കുന്ന ശക്തവും അടിയന്തരവുമായ പ്രവർത്തനം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; കൃദന്തരൂപം രക്ഷിക്കുന്ന രീതിയെ വ്യക്തമാക്കുന്നു.
- source_word: ἐλεᾶτε
  choice: കരുണ കാണിക്കുക
  rationale: ആജ്ഞാഭാവം വ്യക്തമായി നൽകുന്ന, ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗം.
- source_word: ἐν φόβῳ
  choice: ഭയത്തോടെ
  rationale: ദൈവത്തോടുള്ള ഭക്തിപൂർവമായ ഭയമോ സ്വയം മലിനപ്പെടാതിരിക്കാനുള്ള ജാഗ്രതയോ എന്ന അർത്ഥദ്വയത്തെ പരിഭാഷയിൽ തീർപ്പാക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: μισοῦντες
  choice: വെറുത്തുകൊണ്ട്
  rationale: കരുണ കാണിക്കുന്നതിനൊപ്പം നിലനിൽക്കേണ്ട ധാർമിക നിരാകരണത്തിന്റെ തീക്ഷ്ണത നേരിട്ട് പകരുന്നു.
- source_word: χιτῶνα
  choice: ഉള്ളുടുപ്പ്
  rationale: χιτών ശരീരത്തോട് ചേർന്ന് ധരിച്ചിരുന്ന അടിവസ്ത്രസ്വഭാവമുള്ള വസ്ത്രമാണെന്ന പ്രത്യേകത വ്യക്തമാക്കുന്നു; പൊതുവായ ‘വസ്ത്രം’ എന്നതിനെക്കാൾ കൃത്യമാണ്.
- source_word: ἐσπιλωμένον
  choice: കറപറ്റിയ
  rationale: വസ്ത്രരൂപകത്തോട് സ്വാഭാവികമായി ചേരുകയും ധാർമിക മലിനതയുടെ സൂചന നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: σάρξ
  choice: ജഡം
  rationale: മൂലപദത്തിന്റെ രൂപകവും ദൈവശാസ്ത്രപരമായ അർത്ഥവ്യാപ്തിയും നിലനിർത്തുന്നു; ‘പാപസ്വഭാവം’ എന്നു വ്യാഖ്യാനിച്ച് അർത്ഥം ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: രക്ഷാചിത്രത്തിലെ ‘തീ’ എന്തിനെ സൂചിപ്പിക്കുന്നു
  choice: പ്രധാനപാഠത്തിൽ ‘തീ’ എന്ന ചിത്രം വിശദീകരിക്കാതെ നിലനിർത്തുക
  alternative: അന്ത്യന്യായവിധി; ഇപ്പോഴത്തെ ഗുരുതരമായ ആത്മീയ അപകടം
  rationale: മൂലപാഠം തീയുടെ സൂചന വ്യക്തമായി നിർവചിക്കുന്നില്ല; അതിനാൽ മുന്നറിയിപ്പിന്റെ ശക്തി നിലനിർത്തിക്കൊണ്ട് വ്യാഖ്യാനസാധ്യത തുറന്നുവയ്ക്കുന്നു.
- issue: ‘ജഡത്താൽ കറപറ്റിയ’ എന്നതിലെ σάρξ
  choice: പ്രധാനപാഠത്തിൽ ‘ജഡം’
  alternative: പാപസ്വഭാവം
  rationale: ധാർമിക മലിനത ഇവിടെ ഉദ്ദേശിക്കപ്പെടുന്നുവെങ്കിലും ‘ജഡം’ മൂലരൂപകവും അതിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും സംരക്ഷിക്കുന്നു.
- issue: ‘ഭയത്തോടെ’ എന്നതിന്റെ അർത്ഥം
  choice: അവ്യക്തത നിലനിർത്തുന്ന ‘ഭയത്തോടെ’
  alternative: ദൈവഭക്തിയോടെ; മലിനപ്പെടാതിരിക്കാനുള്ള ജാഗ്രതയോടെ
  rationale: ἐν φόβῳ എന്നത് ദൈവസന്നിധിയിലെ ഭക്തിപൂർവമായ ഭയത്തെയോ സഹായിക്കുന്നവൻ തന്നെയും ദുഷിപ്പിക്കപ്പെടാതിരിക്കാനുള്ള സൂക്ഷ്മതയെയോ സൂചിപ്പിക്കാം; പ്രധാനപാഠം ഒന്നിനെ മാത്രം തിരഞ്ഞെടുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആജ്ഞാശൈലി ഉപയോഗിച്ചു. ‘രക്ഷിക്കുവിൻ’ പോലുള്ള പഴമയേറിയ രൂപങ്ങൾ ഒഴിവാക്കി ‘രക്ഷിക്കുക’ സ്വീകരിച്ചു. കരുണയും ധാർമിക ജാഗ്രതയും തമ്മിലുള്ള വാക്യത്തിലെ പിരിമുറുക്കം ഡാഷ് ഉപയോഗിച്ച് വ്യക്തമായി നിലനിർത്തി.
