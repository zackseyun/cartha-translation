id: JUD.1.2
reference: Jude 1:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔλεος ὑμῖν καὶ εἰρήνη καὶ ἀγάπη πληθυνθείη.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/002.yaml
  text: May mercy and peace and love be multiplied to you[a].
translation:
  language: ml
  text: കരുണയും സമാധാനവും സ്നേഹവും നിങ്ങൾക്കു പെരുകട്ടെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വർധിക്കട്ടെ’ അല്ലെങ്കിൽ ‘സമൃദ്ധമാകട്ടെ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεος
  choice: കരുണ
  rationale: ലേഖനാശംസയുടെ സന്ദർഭത്തിൽ ദൈവിക ദയയുടെയും അനുകമ്പയുടെയും അർഥവ്യാപ്തി സ്വാഭാവികമായി നിലനിർത്തുന്ന സാധാരണ മലയാളപദം.
- source_word: ὑμῖν
  choice: നിങ്ങൾക്കു
  rationale: ആശംസ ലഭിക്കുന്നവരിലേക്കുള്ള ദിശ സൂചിപ്പിക്കുന്ന ദത്തിവിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: εἰρήνη
  choice: സമാധാനം
  rationale: വ്യക്തിപരമായ ശാന്തിയെയും ബന്ധപരവും ദൈവബന്ധപരവുമായ ക്ഷേമത്തെയും ഉൾക്കൊള്ളാൻ കഴിയുന്ന സ്ഥാപിതമായ പരിഭാഷ.
- source_word: ἀγάπη
  choice: സ്നേഹം
  rationale: ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ പദം; മൂലപദത്തിന്റെ വിശാലമായ അർഥം ഏതെങ്കിലും പ്രത്യേക വ്യാഖ്യാനത്തിലേക്കു ചുരുക്കുന്നില്ല.
- source_word: πληθυνθείη
  choice: വർധിച്ചുവരട്ടെ
  rationale: അനുഗ്രഹാശംസയായ ഒപ്റ്റേറ്റീവ് ഭാവം ‘-ട്ടെ’ എന്ന രൂപത്തിലൂടെ പ്രകടമാക്കുകയും വർധനയുടെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: καὶ ... καὶ ... καὶ
  choice: -യും ... -വും ... -വും
  rationale: മൂലത്തിലെ ആവർത്തിത καί സൃഷ്ടിക്കുന്ന ഗൗരവമുള്ള സഞ്ചയലയം മലയാളത്തിലെ ആവർത്തിത സമുച്ചയപ്രത്യയങ്ങളിലൂടെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ഒപ്റ്റേറ്റീവ് അനുഗ്രഹാശംസയുടെ അവതരണം
  choice: കരുണയും സമാധാനവും സ്നേഹവും നിങ്ങൾക്കു വർധിച്ചുവരട്ടെ.
  alternative: കരുണയും സമാധാനവും സ്നേഹവും നിങ്ങൾക്കു പെരുകട്ടെ.
  rationale: ‘-ട്ടെ’ എന്ന ക്രിയാരൂപം ആശംസയുടെ ഭാവം വ്യക്തമായി നൽകുന്നു. ‘വർധിച്ചുവരട്ടെ’ മൂലത്തിലെ വർധനാഭാവം നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുന്നു; ആശംസയുടെ ഉറവിടമോ പ്രവർത്തകനോ പാഠത്തിൽ ഇല്ലാത്തവിധം വ്യക്തമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ലേഖനാശംസാശൈലി. ആവർത്തിത ‘-യും/-വും’ പ്രയോഗം മൂലത്തിലെ ത്രിഭാഗ ലയത്തെ നിലനിർത്തുന്നു.
