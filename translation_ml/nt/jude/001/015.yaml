id: JUD.1.15
reference: Jude 1:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ποιῆσαι κρίσιν κατὰ πάντων καὶ ἐλέγξαι ⸂πάντας τοὺς ἀσεβεῖς⸃ περὶ πάντων τῶν ἔργων ἀσεβείας αὐτῶν ὧν ἠσέβησαν καὶ περὶ πάντων τῶν σκληρῶν ὧν ἐλάλησαν κατ’ αὐτοῦ ἁμαρτωλοὶ ἀσεβεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/015.yaml
  text: to execute judgment against all and to convict all the ungodly concerning all their ungodly deeds that they committed in ungodliness[c][b][a], and concerning all the harsh things that ungodly sinners have spoken against him.
translation:
  language: ml
  text: എല്ലാവർക്കെതിരെയും ന്യായവിധി നടത്താനും, എല്ലാ അഭക്തരെയും അവർ അഭക്തമായി പ്രവർത്തിച്ച അവരുടെ സകല അഭക്തപ്രവൃത്തികളെക്കുറിച്ചും, അഭക്തരായ പാപികൾ അവനെതിരെ[b] പറഞ്ഞ എല്ലാ കടുത്ത വാക്കുകളെക്കുറിച്ചും[c] കുറ്റക്കാരാണെന്ന് തെളിയിക്കാനും[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കുറ്റം വെളിപ്പെടുത്താനും’ അല്ലെങ്കിൽ ‘കുറ്റം തെളിയിക്കാനും.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് തെറ്റ് വെളിച്ചത്തുകൊണ്ടുവരുക എന്ന അർഥവും ഉണ്ടാകാം; എന്നാൽ ഇവിടെ അത് ‘ന്യായവിധി നടത്തുക’ എന്ന ന്യായിക പ്രയോഗത്തോടൊപ്പമാണ് വരുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘അവൻ’ എന്നത് സന്ദർഭത്തിൽ മുൻവാക്യത്തിൽ പറഞ്ഞിരിക്കുന്ന കർത്താവിനെ സൂചിപ്പിക്കുന്നു.
    reason: cross_reference
  - marker: c
    text: അഥവാ ‘കഠിനമായ കാര്യങ്ങൾ.’ ഇവിടെ ഗ്രീക്ക് പദം അവനെതിരെ പറഞ്ഞ കടുത്തതോ ധിക്കാരപരമോ ആയ വാക്കുകളെ സൂചിപ്പിക്കുന്നതായി തോന്നുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιῆσαι κρίσιν
  choice: ന്യായവിധി നടത്താനും
  rationale: ഈ പ്രയോഗം ഒരു വിധി തീരുമാനിക്കുന്നതിലുപരി ന്യായവിധി നടപ്പാക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ന്യായവിധി നടത്തുക’ നിയമപരവും അന്ത്യന്യായവിധിയോടു യോജിക്കുന്നതുമായ സ്വാഭാവിക പ്രയോഗമാണ്.
- source_word: κατὰ πάντων
  choice: എല്ലാവർക്കുമെതിരെ
  rationale: ജനിറ്റീവിനോടുകൂടിയ κατά ഇവിടെ പ്രതികൂലമായ ന്യായിക ദിശയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ‘എല്ലാവർക്കുമെതിരെ’ എന്നത് അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: ἐλέγξαι
  choice: കുറ്റക്കാരെന്നു തെളിയിക്കാനും
  rationale: κρίσιν എന്ന ന്യായിക പ്രയോഗത്തോടൊപ്പം വരുന്നതിനാൽ, ഇത് ശാസിക്കുക എന്നതിലുപരി കുറ്റം വെളിപ്പെടുത്തി സ്ഥാപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: πάντας τοὺς ἀσεβεῖς
  choice: എല്ലാ അഭക്തരെയും
  rationale: സുബ്സ്റ്റാന്റീവായി ഉപയോഗിച്ചിരിക്കുന്ന ബഹുവചനത്തെ നേരിട്ട് പുനരാവിഷ്കരിക്കുകയും തുടർന്നുവരുന്ന ἀσεβ- പദകുടുംബവുമായുള്ള ആവർത്തനബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: περὶ πάντων τῶν ἔργων ἀσεβείας αὐτῶν
  choice: അവരുടെ ... സകല അഭക്തപ്രവൃത്തികളെക്കുറിച്ചും
  rationale: ‘അഭക്തിയുടെ പ്രവൃത്തികൾ’ എന്ന കൂടുതൽ അക്ഷരാർഥപരമായ രൂപത്തേക്കാൾ ‘അഭക്തപ്രവൃത്തികൾ’ ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: ὧν ἠσέβησαν
  choice: അഭക്തിയോടെ ചെയ്ത
  rationale: ἀσέβεια/ἀσεβέω എന്ന മൂലപദാവർത്തനം മലയാളത്തിൽ ‘അഭക്തപ്രവൃത്തികൾ’ എന്നും ‘അഭക്തിയോടെ ചെയ്ത’ എന്നും നൽകി പരമാവധി നിലനിർത്തുന്നു.
- source_word: σκληρῶν
  choice: കടുത്ത വാക്കുകൾ
  rationale: σκληρός എന്നതിന് അക്ഷരാർഥത്തിൽ ‘കഠിനമായ’ എന്നാണെങ്കിലും, സംസാരത്തെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ ദുഷ്കരവും ധിക്കാരപരവുമായ വാക്കുകളാണ് ഉദ്ദേശ്യം. ‘കടുത്ത വാക്കുകൾ’ മലയാളത്തിൽ സ്വാഭാവികവും അർഥവ്യാപ്തി നിലനിർത്തുന്നതുമാണ്.
- source_word: ἐλάλησαν κατ’ αὐτοῦ
  choice: അവനെതിരെ പറഞ്ഞ
  rationale: κατάയുടെ പ്രതികൂല അർഥവും പൂർത്തിയായ സംസാരപ്രവൃത്തിയും ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: αὐτοῦ
  choice: അവനെതിരെ
  rationale: ഗ്രീക്കിലെ സർവനാമം വികസിപ്പിച്ച് ‘കർത്താവിനെതിരെ’ എന്നാക്കാതെ അതേപടി നിലനിർത്തുന്നു; അതിന്റെ സൂചിതൻ മുൻവാക്യത്തിലെ സന്ദർഭത്തിൽനിന്ന് മനസ്സിലാക്കാം.
- source_word: ἁμαρτωλοὶ ἀσεβεῖς
  choice: അഭക്തരായ പാപികൾ
  rationale: രണ്ട് വിശേഷണഘടകങ്ങളും നിലനിർത്തുകയും വാക്യത്തിലുടനീളമുള്ള ‘അഭക്ത’ പദാവർത്തനത്തിന് മുൻതൂക്കം നൽകുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘അവനെതിരെ’ എന്നതിലെ αὐτοῦ എന്ന സർവനാമത്തിന്റെ സൂചിതൻ
  choice: പ്രധാനപാഠത്തിൽ ‘അവനെതിരെ’ എന്ന സർവനാമരൂപം നിലനിർത്തി.
  alternative: ‘കർത്താവിനെതിരെ’ അല്ലെങ്കിൽ ‘ദൈവത്തിനെതിരെ’ എന്നു വ്യക്തമാക്കുക.
  rationale: മുൻവാക്യത്തിലെ സന്ദർഭം സൂചിതനെ കർത്താവായി തിരിച്ചറിയാൻ സഹായിക്കുന്നുവെങ്കിലും, ഗ്രീക്ക് പാഠം സർവനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ വ്യാഖ്യാനപരമായി വികസിപ്പിക്കാതെ മൂലപാഠത്തിന്റെ രൂപവും ഉള്ളിലെ സൂക്ഷ്മമായ അനിശ്ചിതത്വവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി സ്വീകരിച്ചു. നീണ്ട ഗ്രീക്ക് വാക്യത്തിന്റെ ന്യായിക ഘടന നിലനിർത്തിക്കൊണ്ട്, ‘അഭക്ത’ എന്ന പദകുടുംബത്തിന്റെ ഉദ്ദേശ്യപൂർവമായ ആവർത്തനം മലയാളത്തിലും സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും അവ വിശദീകരിക്കുന്ന പദപ്രയോഗങ്ങൾക്ക് പിന്നാലെ പ്രധാനപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
