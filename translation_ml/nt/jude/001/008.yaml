id: JUD.1.8
reference: Jude 1:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὁμοίως μέντοι καὶ οὗτοι ἐνυπνιαζόμενοι σάρκα μὲν μιαίνουσιν, κυριότητα δὲ ἀθετοῦσιν, δόξας δὲ βλασφημοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/008.yaml
  text: Yet in the same way, these people also, relying on dreams, defile the flesh, reject authority, and slander glorious ones.
translation:
  language: ml
  text: എന്നിട്ടും ഇവരും അതുപോലെതന്നെ, സ്വപ്നങ്ങളെ ആശ്രയിച്ച്[a] ജഡത്തെ മലിനമാക്കുന്നു; അധികാരത്തെ തള്ളിക്കളയുന്നു; മഹിമയുള്ളവരെ[b] ദുഷിച്ചുപറയുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “സ്വപ്നം കണ്ടുകൊണ്ട്.” ഗ്രീക്ക് കൃദ്യന്തം കൂടുതൽ അക്ഷരാർഥത്തിൽ ഇങ്ങനെ പരിഭാഷപ്പെടുത്താം; എന്നാൽ തങ്ങളുടെ പെരുമാറ്റത്തിന് അവർ സ്വപ്നങ്ങളെ ആധാരമാക്കുന്നു എന്ന ആശയമായിരിക്കാം ഇവിടെ ഉദ്ദേശിക്കുന്നത്.'
    reason: lexical_alternative
  - marker: b
    text: '“മഹിമയുള്ളവർ” എന്നത് മഹത്ത്വമുള്ള സ്വർഗീയ ജീവികളെ, ഒരുപക്ഷേ ദൂതന്മാരെ, സൂചിപ്പിക്കുന്നതായിരിക്കാം; ഗ്രീക്കിൽ അക്ഷരാർഥം: “മഹിമകൾ.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁμοίως μέντοι
  choice: എന്നിട്ടും ... അതുപോലെതന്നെ
  rationale: ὁμοίως എന്നതിലെ മുൻ ഉദാഹരണങ്ങളോടുള്ള താരതമ്യവും μέντοι എന്നതിലെ നേരിയ വൈരുധ്യഭാവവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: οὗτοι
  choice: ഇവരും
  rationale: സന്ദർഭത്തിൽ മുമ്പ് പരാമർശിച്ച നുഴഞ്ഞുകയറിയ ആളുകളെയാണ് സൂചിപ്പിക്കുന്നത്; ഗ്രീക്കിൽ ഇല്ലാത്ത ലിംഗസൂചന ചേർക്കാതെ സ്വാഭാവികമായി പറയുന്നു.
- source_word: ἐνυπνιαζόμενοι
  choice: സ്വപ്നങ്ങളെ ആശ്രയിച്ച്
  rationale: അവരുടെ പ്രവൃത്തികൾക്ക് സ്വപ്നാനുഭവങ്ങളെ ആധാരമാക്കുന്നു എന്ന സാധ്യതയുള്ള ആശയം വ്യക്തമാക്കുന്നു; കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: σάρκα
  choice: ജഡത്തെ
  rationale: ശരീരം എന്നതിലേക്കോ ഒരു സാങ്കേതിക ദൈവശാസ്ത്രാർഥത്തിലേക്കോ അർഥം ചുരുക്കാതെ ഗ്രീക്ക് പദത്തിന്റെ നൈതികവും ദേഹസംബന്ധവുമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: μιαίνουσιν
  choice: മലിനമാക്കുന്നു
  rationale: ആചാരപരവും നൈതികവുമായ അശുദ്ധീകരണത്തിന്റെ ഗൗരവം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: κυριότητα
  choice: അധികാരത്തെ
  rationale: ദൈവിക കർത്തൃത്വമോ സ്വർഗീയ അധികാരമോ പൊതുവായ അധികാരമോ എന്ന നിർണ്ണയിക്കപ്പെടാത്ത വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: ἀθετοῦσιν
  choice: തള്ളിക്കളയുന്നു
  rationale: അംഗീകരിക്കേണ്ടതിനെ നിരസിക്കുകയോ വകവയ്ക്കാതിരിക്കുകയോ ചെയ്യുന്ന ശക്തമായ അർഥം നൽകുന്നു.
- source_word: δόξας
  choice: മഹിമയുള്ളവരെ
  rationale: വാചകത്തിൽ നേരിട്ട് ‘ദൂതന്മാർ’ എന്നു നിർണ്ണയിക്കാതെ മഹത്ത്വമുള്ള സ്വർഗീയ വ്യക്തികളെ സൂചിപ്പിക്കാവുന്ന ഗ്രീക്ക് ബഹുവചനത്തിന്റെ വിശാലത സംരക്ഷിക്കുന്നു.
- source_word: βλασφημοῦσιν
  choice: ദുഷിച്ചുപറയുന്നു
  rationale: ദൈവത്തിനെതിരായ വാക്കുകൾക്ക് മാത്രമായി തെറ്റിദ്ധരിക്കാവുന്ന ‘ദൈവദൂഷണം’ ഒഴിവാക്കി, ഇവിടെ ഉദ്ദേശിക്കുന്ന നിന്ദാപരവും അധിക്ഷേപകരവുമായ സംസാരത്തെ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: δόξας എന്നതിന്റെ സൂചിതർ
  choice: ‘മഹിമയുള്ളവർ’ എന്ന വിശാല പ്രയോഗം
  alternative: ദൂതന്മാർ അഥവാ മഹത്ത്വമുള്ള സ്വർഗീയ ജീവികൾ
  rationale: തൊട്ടടുത്ത സന്ദർഭം സ്വർഗീയ ജീവികളിലേക്കു വിരൽചൂണ്ടുന്നുവെങ്കിലും നാമം തന്നെ അത്ര വ്യക്തമായി അവരെ നിർണ്ണയിക്കുന്നില്ല; അതിനാൽ പ്രധാനവാചകത്തിൽ ഗ്രീക്കിന്റെ തുറന്ന സ്വഭാവം നിലനിർത്തുന്നു.
- issue: ἐνυπνιαζόμενοι എന്നതിന്റെ പ്രയോഗശക്തി
  choice: അവരുടെ പെരുമാറ്റം സ്വപ്നങ്ങളെ ആശ്രയിക്കുന്നതുമായി ബന്ധപ്പെട്ടിരിക്കുന്നു
  alternative: സ്വപ്നം കണ്ടുകൊണ്ട് അഥവാ സ്വപ്നം കാണുന്നവർ
  rationale: കൃദ്യന്തം അവരുടെ പ്രവൃത്തിയുടെ അടിസ്ഥാനമോ രീതിയോ സൂചിപ്പിക്കാം; വ്യാഖ്യാനസാധ്യത മറച്ചുവയ്ക്കാതെ കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. സമാന്തരമായ മൂന്ന് ക്രിയകൾ അർദ്ധവിരാമങ്ങളാൽ വേർതിരിച്ച് ഗ്രീക്ക് വാക്യത്തിന്റെ കുറ്റാരോപണാത്മക താളം നിലനിർത്തി. ‘ജഡം,’ ‘അധികാരം,’ ‘മഹിമയുള്ളവർ’ എന്നീ പദങ്ങളിൽ മൂലത്തിലെ അർഥവ്യാപ്തിയും ദൈവശാസ്ത്രപരമായ അനിശ്ചിതത്വവും സംരക്ഷിച്ചു.
