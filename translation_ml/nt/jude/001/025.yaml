id: JUD.1.25
reference: Jude 1:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀μόνῳ θεῷ σωτῆρι ἡμῶν ⸂διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν⸃ ⸀δόξα μεγαλωσύνη κράτος καὶ ἐξουσία ⸂πρὸ παντὸς τοῦ αἰῶνος⸃ καὶ νῦν καὶ εἰς πάντας τοὺς αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/025.yaml
  text: to the only God our Savior[a], through Jesus the Messiah our Lord, be glory, majesty, dominion, and authority, before all time and now and forever[b]. Amen.
translation:
  language: ml
  text: നമ്മുടെ കർത്താവായ മശീഹയായ യേശുവിലൂടെ, നമ്മുടെ രക്ഷകനായ ഏക ദൈവത്തിന് തേജസ്സും മഹിമയും ആധിപത്യവും അധികാരവും സകല കാലത്തിനും മുമ്പും ഇപ്പോഴും എന്നെന്നേക്കും ഉണ്ടായിരിക്കട്ടെ. ആമേൻ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μόνῳ θεῷ
  choice: ഏക ദൈവത്തിന്
  rationale: μόνῳ ദൈവത്തിന്റെ അതുല്യതയും ഏകത്വവും ഊന്നിപ്പറയുന്നു; സ്തുതിവാക്യത്തിന്റെ ദാതൃവിഭക്തി മലയാളത്തിൽ ‘ദൈവത്തിന്’ എന്നു സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: σωτῆρι ἡμῶν
  choice: നമ്മുടെ രക്ഷകനായ
  rationale: σωτήρ എന്നതിന്റെ രക്ഷാസംബന്ധമായ അർഥം ‘രക്ഷകൻ’ വ്യക്തമായും സ്വാഭാവികമായും നൽകുന്നു; ഇത് ‘ഏക ദൈവം’ എന്നതിനോടുള്ള വിശേഷണമായി ചേർക്കുന്നു.
- source_word: διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν
  choice: നമ്മുടെ കർത്താവായ യേശു മശീഹയിലൂടെ
  rationale: ജനിറ്റീവോടുകൂടിയ διά മധ്യസ്ഥതയെയോ മാർഗത്തെയോ സൂചിപ്പിക്കുന്നതിനാൽ ‘യിലൂടെ’ എന്നു വിവർത്തനം ചെയ്തു. Χριστός ഇവിടെ സ്ഥാനപ്പേരായതിനാൽ ‘മശീഹ’ എന്നു നൽകി.
- source_word: δόξα
  choice: തേജസ്സ്
  rationale: ദൈവിക മഹത്വത്തെ സൂചിപ്പിക്കുന്ന സ്തുതിപദമായി ‘തേജസ്സ്’ ഉപയോഗിച്ചു; അടുത്തുള്ള μεγαλωσύνηയിൽനിന്ന് അർഥവ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: μεγαλωσύνη
  choice: മഹിമ
  rationale: വലിപ്പവും രാജകീയ പ്രതാപവും സൂചിപ്പിക്കുന്ന ഈ പദത്തിന് ഉയർന്നെങ്കിലും പൊതുവായി ഗ്രഹിക്കാവുന്ന ‘മഹിമ’ യോജിക്കുന്നു.
- source_word: κράτος
  choice: ആധിപത്യം
  rationale: പ്രകടമാകുന്ന ഭരണശക്തി എന്ന ആശയം നൽകുകയും ἐξουσίαയുമായി വ്യത്യാസം സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐξουσία
  choice: അധികാരം
  rationale: അവകാശപ്പെട്ട അധികാരത്തെയും അധികാരപ്രയോഗത്തെയും വ്യക്തമായി നൽകുന്ന സാധാരണ മലയാളപദം.
- source_word: πρὸ παντὸς τοῦ αἰῶνος
  choice: സകല കാലത്തിനും മുമ്പും
  rationale: അക്ഷരാർഥത്തിലെ ‘എല്ലാ യുഗത്തിനും മുമ്പ്’ എന്ന കാലാതീത വ്യാപ്തി സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: καὶ νῦν καὶ εἰς πάντας τοὺς αἰῶνας
  choice: ഇപ്പോഴും എന്നെന്നേക്കും
  rationale: ഇപ്പോഴത്തെയും അവസാനമില്ലാത്ത ഭാവിയെയും ഉൾക്കൊള്ളുന്ന സ്തുതിവാക്യത്തിന്റെ കാലവ്യാപ്തി ലളിതമായി നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
theological_decisions:
- issue: സ്തുതി ദൈവത്തോടും യേശുവിലൂടെയുള്ള മധ്യസ്ഥതയോടും എങ്ങനെ ബന്ധപ്പെടുന്നു
  choice: സ്തുതി നമ്മുടെ രക്ഷകനായ ഏക ദൈവത്തിന് അർപ്പിക്കപ്പെടുന്നു; അത് നമ്മുടെ കർത്താവായ യേശു മശീഹയിലൂടെ അർപ്പിക്കപ്പെടുന്നു.
  alternative: ‘യേശു മശീഹയിലൂടെ’ എന്ന ഭാഗം വാക്യത്തോട് കൂടുതൽ ശിഥിലമായി ബന്ധിപ്പിക്കാമെങ്കിലും, യേശുവിലൂടെയുള്ള മധ്യസ്ഥത തന്നെയാണ് അപ്പോഴും സൂചിപ്പിക്കുന്നത്.
  rationale: ഗ്രീക്ക് വാക്യഘടന διὰ എന്ന പദസമുച്ചയത്തെ ദൈവത്തിന് അർപ്പിക്കുന്ന സ്തുതിയോടാണ് ഏറ്റവും സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നത്. ഇതിലൂടെ ഏകദൈവകേന്ദ്രവും യേശുവിന്റെ മധ്യസ്ഥസ്ഥാനവും തമ്മിൽ ലയിപ്പിക്കാതെ നിലനിർത്തുന്നു.
- issue: Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ വിവർത്തനം
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ Χριστός വെറും പേരിന്റെ ഭാഗമായി മാത്രമല്ല, അഭിഷിക്തനായവൻ എന്ന സ്ഥാനപ്പേരായും പ്രവർത്തിക്കുന്നു; ‘മശീഹ’ ആ അർഥം തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സ്തുതിവാക്യത്തിന് യോജിച്ച ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ഗ്രീക്കിലെ നാല് സ്തുതിപദങ്ങളുടെ വ്യത്യാസം കഴിയുന്നത്ര നിലനിർത്താൻ ‘തേജസ്സ്, മഹിമ, ആധിപത്യം, അധികാരം’ എന്ന നിര ഉപയോഗിച്ചു.
