id: JUD.1.19
reference: Jude 1:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὗτοί εἰσιν οἱ ἀποδιορίζοντες, ψυχικοί, πνεῦμα μὴ ἔχοντες.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/019.yaml
  text: These are the ones who cause divisions[a], worldly people[c][b], not having the Spirit.
translation:
  language: ml
  text: വിഭജനങ്ങൾ ഉണ്ടാക്കുന്നവർ[a] ഇവരാണ്; ഇവർ ആത്മികരല്ലാത്തവർ[b], ആത്മാവ് ഇല്ലാത്തവർ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സ്വയം വേർപെടുന്നവർ” / “ഭിന്നതകൾ സൃഷ്ടിക്കുന്നവർ.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ലൗകിക മനുഷ്യർ” / “സ്വാഭാവിക മനുഷ്യർ.”
    reason: lexical_alternative
  - marker: c
    text: ഇവിടെ “ആത്മാവ്” എന്നത് മിക്കവാറും പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്നു; “ആത്മാവ്” എന്ന പൊതുവായ അർഥവും സാധ്യമാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτοί
  choice: ഇവരാണ്
  rationale: മുൻസന്ദർഭത്തിൽ വിവരിച്ച നുഴഞ്ഞുകയറ്റക്കാരിലേക്കുള്ള സൂചനാഭാവവും ഗ്രീക്കിലെ ഊന്നലും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: οἱ ἀποδιορίζοντες
  choice: വിഭജനങ്ങൾ ഉണ്ടാക്കുന്നവർ
  rationale: അവരുടെ വിഭാഗീയ പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്ന സന്ദർഭസാധ്യതയേറിയ അർഥം വ്യക്തമാക്കുന്നു; ‘സ്വയം വേർപെടുന്നവർ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ψυχικοί
  choice: ആത്മികരല്ലാത്ത മനുഷ്യർ
  rationale: വെറും സ്വാഭാവികമായ മനുഷ്യജീവിതത്താൽ നയിക്കപ്പെടുകയും ആത്മാവിനാൽ നയിക്കപ്പെടാതിരിക്കുകയും ചെയ്യുന്നവർ എന്ന വിരോധം ആധുനിക മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന വിധം നൽകുന്നു.
- source_word: πνεῦμα
  choice: ആത്മാവ്
  rationale: സന്ദർഭത്തിൽ പരിശുദ്ധാത്മാവാണ് ഏറ്റവും സാധ്യതയുള്ള സൂചന; എന്നാൽ ഗ്രീക്കിൽ പദം നിർദേശകപദമില്ലാതെ വരുന്നതിനാൽ ‘മനുഷ്യാത്മാവ്’ എന്ന അപൂർവസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: μὴ ἔχοντες
  choice: ഇല്ലാത്തവർ
  rationale: നിഷേധാത്മക കൃുദന്തരൂപത്തിന്റെ വിവരണാത്മക സ്വഭാവം ചുരുക്കവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: πνεῦμα എന്നതിന്റെ സൂചിതാർഥം
  choice: പരിശുദ്ധാത്മാവ്
  alternative: മനുഷ്യാത്മാവ് / ആത്മാവ്
  rationale: ψυχικοί എന്ന പദത്തോടുള്ള ഉടനെയുള്ള വിരോധവും യൂദായുടെ സന്ദർഭവും പരിശുദ്ധാത്മാവിനെയാണ് ശക്തമായി സൂചിപ്പിക്കുന്നത്. എങ്കിലും മൂലപാഠത്തിലെ വ്യാകരണരൂപം മറ്റൊരു വായനയെ പൂർണമായി അസാധ്യമാക്കാത്തതിനാൽ അത് അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. പരസ്പരം ബന്ധപ്പെട്ട മൂന്ന് വിവരണങ്ങൾ അർധവിരാമവും അല്പവിരാമവും ഉപയോഗിച്ച് വ്യക്തമായി ക്രമപ്പെടുത്തി; യഥാർഥമായ പദാർഥ-ദൈവശാസ്ത്ര അവ്യക്തതകൾ അടിക്കുറിപ്പുകളിൽ നിലനിർത്തി.
