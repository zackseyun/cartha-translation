  source_fidelity: The main exhortation and the ambiguity of ἐν ἀγάπῃ θεοῦ are well represented. However, προσδεχόμενοι is an accompanying present participle, not a second coordinate imperative; the revision represents its attendant, ongoing sense. The mercy remains the object awaited, and εἰς ζωὴν αἰώνιον retains its goal-oriented wording without adding a causal explanation.
  naturalness: ‘മശീഹയായ യേശുവിന്റെ’ is grammatically and idiomatically awkward in this genitive construction. ‘യേശു മശീഹയുടെ’ is a natural Malayalam title-name sequence. ‘കരുണയെ പ്രതീക്ഷിച്ചുകൊണ്ട്’ also expresses ‘awaiting the mercy’ more directly than ‘കരുണയ്ക്കായി കാത്തിരിക്കുക.’
