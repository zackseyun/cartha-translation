source:
  edition: SBLGNT
  text: ἑαυτοὺς ἐν ἀγάπῃ θεοῦ τηρήσατε προσδεχόμενοι τὸ ἔλεος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/021.yaml
  text: keep yourselves in the love of God[c][b][a], waiting for the mercy of our Lord Jesus the Messiah unto eternal life.
translation:
  language: ml
  text: ദൈവത്തിന്റെ സ്നേഹത്തിൽ നിങ്ങളെത്തന്നെ കാത്തുകൊള്ളുക[a]; നിത്യജീവനിലേക്കായി[c] നമ്മുടെ കർത്താവായ യേശു മശീഹയുടെ[b] കരുണയെ പ്രതീക്ഷിച്ചുകൊണ്ട്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദൈവത്തിന്റെ സ്നേഹത്തിൽ’ എന്ന ഗ്രീക്ക് പ്രയോഗം ദൈവം നമ്മോടു കാണിക്കുന്ന സ്നേഹത്തെയോ ദൈവത്തോടുള്ള നമ്മുടെ സ്നേഹത്തെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
  - marker: b
    text: ഗ്രീക്കിൽ ‘യേശു ക്രിസ്തു’; Χριστός ഇവിടെ ഒരു പദവിയായതിനാൽ ‘യേശു മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: ‘നിത്യജീവനുവേണ്ടി’ എന്നും ‘നിത്യജീവനിലേക്കു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: τηρήσατε
  choice: കാത്തുകൊള്ളുക
  rationale: രണ്ടാം പുരുഷ ബഹുവചനത്തിലെ നേരിട്ടുള്ള കല്പനയുടെ ശക്തി നിലനിർത്തുന്നു; ἑαυτούς എന്നതിനെ ‘നിങ്ങളെത്തന്നെ’ എന്നു പ്രത്യേകം പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: ἐν ἀγάπῃ θεοῦ
  choice: ദൈവത്തിന്റെ സ്നേഹത്തിൽ
  rationale: θεοῦ എന്ന ഷഷ്ഠീവിഭക്തി ദൈവം കാണിക്കുന്ന സ്നേഹത്തെയോ ദൈവത്തോടുള്ള സ്നേഹത്തെയോ സൂചിപ്പിക്കാമെന്ന ഗ്രീക്ക് അവ്യക്തത പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: προσδεχόμενοι
  choice: കാത്തിരിക്കുക
  rationale: പ്രധാന കല്പനയോടൊപ്പമുള്ള തുടർച്ചയായ പ്രതീക്ഷാഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ἔλεος
  choice: കരുണ
  rationale: അർഹതയെ ആശ്രയിക്കാത്ത ദയയും അനുകമ്പയും ഉൾക്കൊള്ളുന്ന സാധാരണ പുതിയനിയമ പദപ്രയോഗം.
- source_word: κυρίου
  choice: കർത്താവ്
  rationale: പുതിയനിയമത്തിലെ κύριος എന്ന പദത്തിന്റെ പദവിപരമായ അർഥം നിലനിർത്തുന്നു.
- source_word: Ἰησοῦ Χριστοῦ
  choice: മശീഹയായ യേശു
  rationale: Ἰησοῦ എന്ന പേര് നിലനിർത്തുകയും Χριστοῦ എന്ന അഭിഷിക്തന്റെ പദവിയെ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തുകയും ചെയ്യുന്നു.
- source_word: εἰς ζωὴν αἰώνιον
  choice: നിത്യജീവനിലേക്കായി
  rationale: εἰς സൂചിപ്പിക്കുന്ന ലക്ഷ്യദിശയെ വ്യാഖ്യാനപരമായി വികസിപ്പിക്കാതെ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ἀγάπῃ θεοῦ എന്നതിലെ ഷഷ്ഠീവിഭക്തിയുടെ അർഥം
  choice: ‘ദൈവത്തിന്റെ സ്നേഹം’ എന്ന അവ്യക്തമായ രൂപം നിലനിർത്തുക
  alternative: ‘ദൈവം നിങ്ങളോടു കാണിക്കുന്ന സ്നേഹം’ അല്ലെങ്കിൽ ‘ദൈവത്തോടുള്ള നിങ്ങളുടെ സ്നേഹം’
  rationale: മൂലപാഠം ഇരുവായനകൾക്കും ഇടനൽകുന്നു; അടുത്ത സന്ദർഭം ഒന്നിനെ നിർബന്ധിക്കുന്നില്ല.
- issue: Χριστοῦ എന്ന പദവിയുടെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ Χριστός യേശുവിന്റെ പദവിയായി പ്രവർത്തിക്കുന്നതിനാൽ അതിന്റെ അർഥം വ്യക്തമാക്കുന്ന ‘മശീഹ’ ഉപയോഗിക്കുന്നു.
- issue: εἰς ζωὴν αἰώνιον എന്നതിന്റെ ബന്ധം
  choice: ‘നിത്യജീവനിലേക്കായി’ എന്ന ലക്ഷ്യാർഥം
  alternative: ‘നിത്യജീവനിലേക്കു നയിക്കുന്ന’ അല്ലെങ്കിൽ ‘നിത്യജീവനുവേണ്ടി’
  rationale: കരുണയും കാത്തിരിപ്പും നിത്യജീവനെ ലക്ഷ്യമാക്കുന്നു എന്ന ദിശ നിലനിർത്തുന്നു; വ്യക്തമായ കാരണഫലബന്ധം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. പ്രധാന കല്പനയും അതിനോടൊപ്പമുള്ള പ്രതീക്ഷാഭാവവും വായനാസൗകര്യത്തിനായി അർധവിരാമംകൊണ്ട് ബന്ധിപ്പിച്ചിരിക്കുന്നു; മൂലത്തിലെ ദൈവസ്നേഹത്തെക്കുറിച്ചുള്ള അവ്യക്തത നിലനിർത്തിയിരിക്കുന്നു.
