id: JUD.1.4
reference: Jude 1:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: παρεισέδυσαν γάρ τινες ἄνθρωποι, οἱ πάλαι προγεγραμμένοι εἰς τοῦτο τὸ κρίμα, ἀσεβεῖς, τὴν τοῦ θεοῦ ἡμῶν χάριτα μετατιθέντες εἰς ἀσέλγειαν καὶ τὸν μόνον ⸀δεσπότην καὶ κύριον ἡμῶν Ἰησοῦν Χριστὸν ἀρνούμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/004.yaml
  text: For certain men have slipped in unnoticed[a], who long ago were designated for this judgment, ungodly men who turn the grace of our God into sensuality and deny our only Master and Lord[d][c][b], Jesus the Messiah.
translation:
  language: ml
  text: കാരണം, ചിലർ ആരുമറിയാതെ നുഴഞ്ഞുകയറിയിരിക്കുന്നു[a]. ഈ വിധിക്കായി വളരെ മുമ്പേ രേഖപ്പെടുത്തപ്പെട്ടവരാണ്[b] അവർ. ദൈവഭക്തിയില്ലാത്ത ആ മനുഷ്യർ നമ്മുടെ ദൈവത്തിന്റെ കൃപയെ ധാർമ്മിക കുത്തഴിഞ്ഞതാക്കി മാറ്റുകയും[c] നമ്മുടെ ഏക അധിപനും കർത്താവുമായ മശീഹയായ യേശുവിനെ[d] നിഷേധിക്കുകയും ചെയ്യുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ആരും ശ്രദ്ധിക്കാതെ പതുങ്ങിക്കയറിയിരിക്കുന്നു.’
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്ക് പദപ്രയോഗം ‘ഈ വിധിയെക്കുറിച്ച് വളരെ മുമ്പേ എഴുതപ്പെട്ടവർ’ എന്നോ ‘ഈ വിധിക്കായി മുൻകൂട്ടി അടയാളപ്പെടുത്തപ്പെട്ടവർ’ എന്നോ മനസ്സിലാക്കാം.
    reason: alternative_reading
  - marker: c
    text: ‘ധാർമ്മിക കുത്തഴിഞ്ഞത്’ എന്നതിന് ‘ലജ്ജയില്ലാത്ത ദുർവൃത്തി’ അല്ലെങ്കിൽ ‘കാമാസക്തി’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: d
    text: ഗ്രീക്കിൽ ‘യേശു ക്രിസ്തു.’ Χριστός എന്നത് ‘അഭിഷിക്തൻ’ എന്ന സ്ഥാനപ്പേരായി എടുത്തതിനാൽ ‘മശീഹയായ യേശു’ എന്നു പരിഭാഷപ്പെടുത്തി. ഗ്രീക്ക് വാക്യഘടന പ്രകാരം ‘അധിപൻ’, ‘കർത്താവ്’ എന്നീ രണ്ട് സ്ഥാനപ്പേരും യേശുവിനോടു ബന്ധിപ്പിക്കുന്നതാണ് ഏറ്റവും സ്വാഭാവികം; ചിലർ ആദ്യത്തേത് പിതാവായ ദൈവത്തോടു ബന്ധിപ്പിക്കുന്നു.
    reason: theological_ambiguity
lexical_decisions:
- source_word: παρεισέδυσαν
  choice: ആരുമറിയാതെ നിങ്ങളുടെ ഇടയിൽ നുഴഞ്ഞുകയറിയിരിക്കുന്നു
  rationale: ക്രിയ സൂചിപ്പിക്കുന്ന രഹസ്യമായ കടന്നുകയറ്റവും അതിന്റെ ഇപ്പോഴത്തെ ഫലവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു. സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്ന ‘നിങ്ങളുടെ ഇടയിൽ’ വ്യക്തതയ്ക്കായി ചേർത്തിരിക്കുന്നു.
- source_word: πάλαι προγεγραμμένοι
  choice: വളരെ മുമ്പേ രേഖപ്പെടുത്തപ്പെട്ടവർ
  rationale: πάλαιയുടെ വിദൂരമായ മുൻകാലസൂചനയും προγεγραμμένοιയുടെ ‘മുൻകൂട്ടി എഴുതപ്പെട്ട/രേഖപ്പെടുത്തപ്പെട്ട’ അർഥവും നിലനിർത്തുന്നു; വ്യക്തിപരമായ മുൻനിർണയം എന്ന് അനിവാര്യമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: κρίμα
  choice: വിധി
  rationale: ന്യായവിധി, വിധിപ്രസ്താവം, ശിക്ഷാവിധി എന്നീ സാധ്യതകൾക്കിടയിൽ വിശാലമായ ന്യായിക അർഥം നിലനിർത്തുന്നു.
- source_word: ἀσεβεῖς
  choice: ദൈവഭക്തിയില്ലാത്ത ആ മനുഷ്യർ
  rationale: ദൈവത്തോടുള്ള ഭക്തിയുടെയും ആദരവിന്റെയും അഭാവം വ്യക്തമാക്കുകയും substantival adjective മുൻപുള്ള ἄνθρωποι എന്നതുമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: χάριτα
  choice: കൃപ
  rationale: ദൈവത്തിന്റെ അനുഗ്രഹപൂർണമായ പ്രസാദത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും സ്വാഭാവികവുമായ ദൈവശാസ്ത്രപദം.
- source_word: μετατιθέντες εἰς
  choice: …ആക്കി മാറ്റുകയും
  rationale: ഒന്നിനെ മറ്റൊന്നാക്കി മാറ്റുന്നു എന്ന ഗ്രീക്ക് ഘടന നേരിട്ട് നിലനിർത്തുന്നു; ‘ദുഷിപ്പിക്കുന്നു’ പോലുള്ള കൂടുതൽ വ്യാഖ്യാനാത്മകമായ പദം ഒഴിവാക്കുന്നു.
- source_word: ἀσέλγειαν
  choice: കുത്തഴിഞ്ഞ ജീവിതം
  rationale: ലജ്ജയില്ലാത്ത സ്വയംഭോഗപരമായ ധാർമ്മിക കുത്തഴിഞ്ഞതിനെ സൂചിപ്പിക്കുന്നു; അർഥം ലൈംഗിക പാപത്തിൽ മാത്രം അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: μόνον δεσπότην καὶ κύριον
  choice: ഏക അധിപനും കർത്താവും
  rationale: δεσπότης, κύριος എന്നീ രണ്ട് അധികാരപദങ്ങളും വേർതിരിച്ചു പ്രതിനിധീകരിക്കുന്നു; ‘അധിപൻ’ പരമാധികാരവും ‘കർത്താവ്’ κύριος എന്ന സ്ഥാപിത സംബോധനയും നൽകുന്നു.
- source_word: Ἰησοῦν Χριστόν
  choice: മശീഹയായ യേശു
  rationale: Χριστός ഇവിടെ വെറും പേരിന്റെ ഭാഗമെന്നതിലുപരി അഭിഷിക്തൻ എന്ന സ്ഥാനപ്പേരായി കേൾക്കാൻ ‘മശീഹ’ ഉപയോഗിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘മശീഹയായ യേശു’ എന്ന് ക്രമപ്പെടുത്തി.
- source_word: ἀρνούμενοι
  choice: നിഷേധിക്കുകയും ചെയ്യുന്നു
  rationale: വിശ്വാസത്തിലും പെരുമാറ്റത്തിലും ഉള്ള തള്ളിപ്പറയൽ എന്ന ആശയം നേരിട്ടും മാന്യമായും നൽകുന്നു.
theological_decisions:
- issue: προγεγραμμένοι εἰς τοῦτο τὸ κρίμα എന്നതിന്റെ ബലം
  choice: ഈ വിധിക്കായി വളരെ മുമ്പേ രേഖപ്പെടുത്തപ്പെട്ടവർ
  alternative: ഈ വിധിക്ക് മുൻകൂട്ടി നിശ്ചയിക്കപ്പെട്ടവർ; അല്ലെങ്കിൽ ഈ വിധിയെക്കുറിച്ച് വളരെ മുമ്പേ എഴുതപ്പെട്ടവർ
  rationale: ഗ്രീക്ക് പദത്തിന് മുൻകൂട്ടിയുള്ള എഴുത്തോ രേഖപ്പെടുത്തലോ നിയോഗമോ സൂചിപ്പിക്കാം. മുഖ്യപാഠം മുൻകാല രേഖപ്പെടുത്തലും ന്യായിക ലക്ഷ്യവും നിലനിർത്തുന്നു; വ്യക്തികളുടെ മുൻനിർണയത്തെക്കുറിച്ചുള്ള ശക്തമായ സിദ്ധാന്തനിഗമനം നിർബന്ധിക്കുന്നില്ല.
- issue: ‘ഏക അധിപനും കർത്താവും’ എന്ന രണ്ട് സ്ഥാനപ്പേരുകളുടെ സൂചിതവ്യക്തി
  choice: രണ്ട് സ്ഥാനപ്പേരും മശീഹയായ യേശുവിനെ സൂചിപ്പിക്കുന്നു
  alternative: ‘അധിപൻ’ പിതാവായ ദൈവത്തെയും ‘കർത്താവ്’ യേശുവിനെയും വേർതിരിച്ച് സൂചിപ്പിക്കുന്നു
  rationale: ഗ്രീക്ക് വാക്യഘടനയിൽ രണ്ട് സ്ഥാനപ്പേരുകളും ഒരുമിച്ച് Ἰησοῦν Χριστόν എന്ന ഒരേ വ്യക്തിയോടു ബന്ധിപ്പിക്കുന്നതാണ് ഏറ്റവും സ്വാഭാവികമായ വായന. എന്നിരുന്നാലും വ്യത്യസ്തമായ വായനയുടെ സാന്നിധ്യം അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. നീണ്ട ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി മൂന്ന് മലയാളവാക്യങ്ങളാക്കി; ബന്ധങ്ങളും പങ്കാളിക്രിയകളുടെ ആശയക്രമവും നിലനിർത്തി. ‘നുഴഞ്ഞുകയറുക,’ ‘കുത്തഴിഞ്ഞ ജീവിതം,’ ‘അധിപൻ’ എന്നീ പദങ്ങൾ വ്യക്തവും ഗൗരവമുള്ളതുമാണ്; സഭാവിഭാഗവിശേഷമായ പ്രയോഗങ്ങൾ ഒഴിവാക്കി.
