id: JUD.1.20
reference: Jude 1:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὑμεῖς δέ, ἀγαπητοί, ⸂ἐποικοδομοῦντες ἑαυτοὺς τῇ ἁγιωτάτῃ ὑμῶν πίστει⸃, ἐν πνεύματι ἁγίῳ προσευχόμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/020.yaml
  text: But you[a], beloved, building yourselves up in your most holy faith and praying in the Holy Spirit[c][b],
translation:
  language: ml
  text: എന്നാൽ പ്രിയരേ, നിങ്ങളുടെ അതിവിശുദ്ധമായ വിശ്വാസത്തിൽ[a] നിങ്ങളെത്തന്നെ പടുത്തുയർത്തിക്കൊണ്ടും പരിശുദ്ധാത്മാവിൽ[b] പ്രാർഥിച്ചുകൊണ്ടും,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങളുടെ അതിവിശുദ്ധമായ വിശ്വാസത്തിന്മേൽ.’ ഗ്രീക്ക് ഘടനയ്ക്ക് ഒരു അടിസ്ഥാനത്തിന്മേൽ പണിയുക എന്ന അർഥവും വിശ്വാസവുമായി ബന്ധപ്പെട്ട് പടുത്തുയർത്തുക എന്ന അർഥവും ഉണ്ടാകാം. ഇവിടെ ‘വിശ്വാസം’ എന്നത് ‘വിശ്വസ്തത’ എന്നോ ‘ആശ്രയം’ എന്നോ മനസ്സിലാക്കാനും കഴിയും; എന്നാൽ യൂദായിൽ സമൂഹം പങ്കിടുന്ന ക്രൈസ്തവവിശ്വാസമാണ് കൂടുതൽ സാധ്യതയുള്ളത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘പരിശുദ്ധാത്മാവിനാൽ.’ ഈ പ്രയോഗം പ്രാർഥന പരിശുദ്ധാത്മാവിന്റെ സാന്നിധ്യത്തിലും സ്വാധീനത്തിലും നടക്കുന്നതിനെ (‘ആത്മാവിൽ’) അല്ലെങ്കിൽ ആത്മാവിന്റെ പ്രാപ്തീകരണത്താൽ നടക്കുന്നതിനെ (‘ആത്മാവിനാൽ’) ഊന്നാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑμεῖς δέ
  choice: എന്നാൽ ... നിങ്ങൾ
  rationale: δέ മുൻസന്ദർഭത്തിലെ ഭക്തികെട്ട എതിരാളികളോടുള്ള വ്യത്യാസം സൂചിപ്പിക്കുന്നു; വ്യക്തമായ ὑμεῖς അഭിസംബോധനയ്ക്ക് ഊന്നൽ നൽകുന്നു. മലയാളത്തിൽ ‘എന്നാൽ’ എന്നതും ക്രിയയിലെ ബഹുവചനരൂപവും ഈ വ്യത്യാസവും നേരിട്ടുള്ള അഭിസംബോധനയും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἀγαπητοί
  choice: പ്രിയരേ
  rationale: സ്നേഹപൂർവവും ഗൗരവമുള്ളതുമായ ബഹുവചന സംബോധനയായി ‘പ്രിയരേ’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്; ‘ദൈവത്താൽ സ്നേഹിക്കപ്പെട്ടവർ’ എന്ന വ്യാഖ്യാനം വാചകത്തിൽ അധികമായി ചേർക്കുന്നില്ല.
- source_word: ἐποικοδομοῦντες
  choice: പടുത്തുയർത്തിക്കൊണ്ടും
  rationale: നിലവിലുള്ള അടിസ്ഥാനത്തിന്മേൽ പണിയുക, അതുവഴി ശക്തിപ്പെടുത്തുക എന്നീ രൂപകാർഥങ്ങൾ ഈ പ്രയോഗം നിലനിർത്തുന്നു. ദാതിവിഭക്തിയുടെ അടിസ്ഥാന/മേഖലാഭാവത്തിലെ അവ്യക്തത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἑαυτοὺς
  choice: നിങ്ങളെത്തന്നെ
  rationale: ഗ്രീക്കിലെ ആത്മവാചക സർവനാമത്തിന്റെ ബഹുവചനശക്തി നേരിട്ട് നിലനിർത്തുന്നു. സമൂഹപരമായ അർഥം ഉൾക്കൊള്ളാമെങ്കിലും ‘പരസ്പരം’ എന്ന് മാറ്റി വ്യാഖ്യാനം ഉറപ്പിക്കുന്നില്ല.
- source_word: τῇ ἁγιωτάτῃ ὑμῶν πίστει
  choice: നിങ്ങളുടെ അതിവിശുദ്ധമായ വിശ്വാസത്തിൽ
  rationale: ἁγιωτάτῃ എന്ന അതിശയോന്നതരൂപം ‘അതിവിശുദ്ധമായ’ എന്ന് നിലനിർത്തുന്നു. πίστις-ന് ‘വിശ്വാസം’ ഉപയോഗിക്കുന്നു; ഇവിടെ സമൂഹം സ്വീകരിച്ചുപോരുന്ന ക്രൈസ്തവവിശ്വാസമാണ് സാധ്യതയേറിയത്, എങ്കിലും പദത്തിന്റെ വിശ്വസിക്കൽ/വിശ്വസ്തതാ സാധ്യതകൾ വാചകത്തിൽ അനാവശ്യമായി അടച്ചുപൂട്ടുന്നില്ല.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: പരിശുദ്ധാത്മാവിൽ
  rationale: ἐν എന്നതിന്റെ അടിസ്ഥാനമായ ‘-യിൽ’ ബന്ധം നിലനിർത്തുകയും ദൈവിക പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം സ്വീകരിക്കുകയും ചെയ്യുന്നു. പ്രവർത്തകസാധനമായ ‘പരിശുദ്ധാത്മാവിനാൽ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: προσευχόμενοι
  choice: പ്രാർഥിച്ചുകൊണ്ടും
  rationale: വർത്തമാനകാല പങ്കാളിക്രിയയുടെ തുടരുന്ന പ്രവർത്തനവും മുൻപത്തെ പങ്കാളിക്രിയയോടുള്ള സമന്വയവും നിലനിർത്തുന്നു; അടുത്ത വാക്യത്തിലേക്ക് നീളുന്ന വാക്യഘടന തുറന്നുവയ്ക്കാൻ അവസാനത്തിൽ വിരാമചിഹ്നമായി കോമ ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: ἐν πνεύματι ἁγίῳ എന്നതിലെ πνεῦμα ἅγιον ആരെ സൂചിപ്പിക്കുന്നു
  choice: ദൈവിക പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്ന ‘പരിശുദ്ധാത്മാവിൽ’
  alternative: ‘വിശുദ്ധമായ ആത്മഭാവത്തിൽ’ എന്ന മനുഷ്യന്റെ ആത്മീയ മനോഭാവം
  rationale: ആദിമ ക്രൈസ്തവ പ്രയോഗത്തിലും യൂദായുടെ പ്രബോധനസന്ദർഭത്തിലും പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്നതാണ് ഏറ്റവും സ്വാഭാവികം. ഗ്രീക്കിൽ നിർദേശകോപപദമില്ലാത്തത് അനിശ്ചിതത്വം നിർബന്ധിക്കുന്നില്ല.
- issue: πίστις എന്നതിന്റെ അർഥം
  choice: സമൂഹം സ്വീകരിച്ചുപോരുന്ന ക്രൈസ്തവവിശ്വാസത്തെ പ്രധാനമായി സൂചിപ്പിക്കുന്ന ‘വിശ്വാസം’
  alternative: വ്യക്തിപരമായ ആശ്രയം/വിശ്വസിക്കൽ; വിശ്വസ്തത
  rationale: യൂദാ 3-ലെ ‘ഒരിക്കൽ ഏല്പിക്കപ്പെട്ട വിശ്വാസം’ എന്ന പ്രയോഗം സമൂഹത്തിന്റെ പങ്കിട്ട വിശ്വാസസമ്പത്തിനെ പിന്തുണയ്ക്കുന്നു. എങ്കിലും ‘വിശ്വാസം’ എന്ന പരിഭാഷ പദത്തിന്റെ വിശാലമായ അർഥപരിധി നിലനിർത്തുന്നു.
- issue: പടുത്തുയർത്തലും വിശ്വാസവും തമ്മിലുള്ള ബന്ധം
  choice: ‘വിശ്വാസത്തിൽ’—വിശ്വാസത്തിന്റെ മേഖലയിലോ ബന്ധത്തിലോ പടുത്തുയർത്തൽ
  alternative: ‘വിശ്വാസത്തിന്മേൽ’—വിശ്വാസം അടിസ്ഥാനം എന്ന ഊന്നൽ
  rationale: ഗ്രീക്ക് ദാതിവിഭക്തി മേഖലയെയോ അടിസ്ഥാനത്തെയോ സൂചിപ്പിക്കാം. പ്രധാനവാചകത്തിലെ ‘-ത്തിൽ’ സ്വാഭാവികവും താരതമ്യേന തുറന്നതുമാണ്; അടിസ്ഥാനരൂപകം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ തിരുവെഴുത്തുശൈലി. ‘പ്രിയരേ’, ‘അതിവിശുദ്ധമായ’, ‘പരിശുദ്ധാത്മാവ്’ തുടങ്ങിയ സഭാപരിചിത പദങ്ങൾ നിലനിർത്തുമ്പോഴും പഴഞ്ചൻ ക്രിയാരൂപങ്ങൾ ഒഴിവാക്കി. മൂലത്തിലെ രണ്ട് പങ്കാളിക്രിയകളുടെ സമാന്തരത ‘-ക്കൊണ്ടും ... -ക്കൊണ്ടും’ എന്ന ഘടനയിൽ സൂക്ഷിച്ചു; വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ കോമയിൽ അവസാനിപ്പിച്ചു.
