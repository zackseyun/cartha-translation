  text: ἀγγέλους τε τοὺς μὴ τηρήσαντας τὴν ἑαυτῶν ἀρχὴν ἀλλὰ ἀπολιπόντας τὸ ἴδιον οἰκητήριον εἰς κρίσιν μεγάλης ἡμέρας δεσμοῖς ἀϊδίοις ὑπὸ ζόφον τετήρηκεν·
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/006.yaml
  text: And the angels who did not keep their own domain[a], but abandoned their proper dwelling[c][b], he has kept in eternal chains under gloom for the judgment of the great day.
translation:
  language: ml
  text: തങ്ങളുടെ സ്വന്തം സ്ഥാനം[a] കാത്തുസൂക്ഷിക്കാതെ, തങ്ങൾക്കുള്ള വാസസ്ഥലം ഉപേക്ഷിച്ച ദൂതന്മാരെക്കൂടി, മഹാദിവസത്തിലെ ന്യായവിധിക്കായി അവൻ നിത്യബന്ധനങ്ങളിൽ കൂരിരുളിൻ കീഴിൽ സൂക്ഷിച്ചിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘തങ്ങളുടെ അധികാരമണ്ഡലം’ അല്ലെങ്കിൽ ‘തങ്ങളുടെ പദവി.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγέλους
  choice: ദൂതന്മാർ
  rationale: വിധിന്യായത്തിന്റെ ഈ സന്ദർഭത്തിൽ മനുഷ്യസന്ദേശവാഹകരെയല്ല, അതിമാനുഷിക ജീവികളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: τηρήσαντας / τετήρηκεν
  choice: കാത്തുസൂക്ഷിക്കാതെ / സൂക്ഷിച്ചിരിക്കുന്നു
  rationale: 'ഒരേ ഗ്രീക്ക് ക്രിയയുടെ ആവർത്തനവും വിരോധാഭാസവും കഴിയുന്നത്ര നിലനിർത്തുന്നു: അവർ തങ്ങളുടെ സ്ഥാനം കാത്തുസൂക്ഷിച്ചില്ല; അവൻ അവരെ വിധിക്കായി സൂക്ഷിച്ചിരിക്കുന്നു.'
- source_word: τὴν ἑαυτῶν ἀρχὴν
  choice: തങ്ങളുടെ സ്വന്തം അധികാരസ്ഥാനം
  rationale: ἀρχή ഇവിടെ അധികാരം, പദവി, അല്ലെങ്കിൽ നിയുക്തമായ പ്രവർത്തനമണ്ഡലം എന്ന അർഥസാധ്യതകൾ വഹിക്കുന്നു. ‘അധികാരസ്ഥാനം’ ഈ അർഥവ്യാപ്തി ഭാഗികമായി നിലനിർത്തുന്നു; ‘ആരംഭം’ എന്ന കാലസംബന്ധിയായ അർഥം സന്ദർഭത്തിന് യോജിക്കുന്നില്ല.
- source_word: ἀπολιπόντας
  choice: ഉപേക്ഷിച്ച
  rationale: കുറ്റബോധമുള്ള മനഃപൂർവമായ വിട്ടുപോകലിന്റെ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: τὸ ἴδιον οἰκητήριον
  choice: തങ്ങൾക്കുള്ള വാസസ്ഥലം
  rationale: οἰκητήριον എന്നത് വസിക്കുന്ന ഇടമാണ്; ἴδιον സൂചിപ്പിക്കുന്ന ‘സ്വന്തമായ/തങ്ങൾക്കു ചേർന്ന’ എന്ന ആശയം ‘തങ്ങൾക്കുള്ള’ എന്നു നൽകി, അതിന്റെ കൃത്യസ്വഭാവം വ്യാഖ്യാനിച്ച് നിശ്ചയിക്കുന്നില്ല.
- source_word: εἰς κρίσιν μεγάλης ἡμέρας
  choice: മഹാദിവസത്തിലെ ന്യായവിധിക്കായി
  rationale: εἰς എന്നതിന്റെ ലക്ഷ്യാഭിമുഖതയും വലിയ ദിവസവുമായി ബന്ധപ്പെട്ട അന്തിമവിധിയുടെ ആശയവും വ്യക്തമായി നൽകുന്നു; ‘വരെ’ എന്ന് വ്യാഖ്യാനപരമായി ചേർക്കുന്നില്ല.
- source_word: δεσμοῖς ἀϊδίοις
  choice: നിത്യബന്ധനങ്ങളിൽ
  rationale: δεσμοί ബന്ധനങ്ങളെയോ ചങ്ങലകളെയോ സൂചിപ്പിക്കാം. ‘ബന്ധനങ്ങൾ’ രൂപകവും യാഥാർഥ്യവുമായ സാധ്യത തുറന്നുവെക്കുന്നു; ἀΐδιος-ന്റെ നിലനിൽക്കുന്ന ദൈർഘ്യം ‘നിത്യ’ എന്നു നൽകുന്നു.
- source_word: ὑπὸ ζόφον
  choice: കൂരിരുളിൻ കീഴിൽ
  rationale: ζόφος സാധാരണ ഇരുട്ടിനേക്കാൾ ഗാഢവും ഭീതിജനകവുമായ ഇരുളാണ്; ‘കൂരിരுள்’ ആ ഭാവം നൽകുകയും ὑπό-യുടെ ‘കീഴിൽ’ എന്ന ദൃശ്യരൂപം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: τε
  choice: -ക്കൂടി
  rationale: മുൻവാക്യത്തിലെ വിധിന്യായ ഉദാഹരണത്തോട് ഇതിനെ ചേർക്കുന്ന അനുബന്ധബലം സ്വാഭാവിക മലയാളത്തിൽ ‘ദൂതന്മാരെക്കൂടി’ എന്നു നൽകുന്നു.
theological_decisions:
- issue: ദൂതന്മാരുടെ അതിക്രമത്തിന്റെ കൃത്യസ്വഭാവം
  choice: അവർ തങ്ങളുടെ നിയുക്ത അധികാരസ്ഥാനം കാത്തുസൂക്ഷിക്കാതെ തങ്ങൾക്കുള്ള വാസസ്ഥലം ഉപേക്ഷിച്ചു എന്നു മാത്രം പറയുന്നു.
  alternative: ഉല്പത്തി 6-ലെ ദൂതകലാപത്തെക്കുറിച്ചുള്ള പ്രത്യേക പരാമർശം; അല്ലെങ്കിൽ ആദിമകാലത്തെ പൊതുവായ ദൂതപതനം.
  rationale: യൂദാ അറിയപ്പെട്ടിരുന്ന ഒരു യഹൂദപാരമ്പര്യം ഉണർത്തുന്നുണ്ടാകാം; എന്നാൽ ഈ വാക്യത്തിലെ ഗ്രീക്ക് പാഠം ആ പശ്ചാത്തലം വിശദമായി നിർവചിക്കുന്നില്ല. അതിനാൽ പ്രത്യേക വ്യാഖ്യാനം മുഖ്യപാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്തിട്ടില്ല.
- issue: ἀΐδιος എന്നതിന്റെ ബലം
  choice: നിത്യ
  alternative: ശാശ്വത; എന്നേക്കുമുള്ള
  rationale: തുടർന്നുനിൽക്കുന്ന സ്ഥിരതയാണ് പദം സൂചിപ്പിക്കുന്നത്. ബന്ധനങ്ങളുടെ സ്വഭാവത്തെക്കുറിച്ച് പാഠം പറയുന്നതിലധികം സിദ്ധാന്തപരമായ വിശദീകരണം ചേർക്കാതെ സാധാരണ ബൈബിൾ മലയാളത്തിൽ അർഥം നൽകുന്നു.
