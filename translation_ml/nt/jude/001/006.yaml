  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ദീർഘമായ ഗ്രീക്ക് വാക്യഘടന മലയാളത്തിൽ വായനാസൗകര്യത്തോടെ നിലനിർത്തിയിരിക്കുന്നു. മുഖ്യപാഠത്തിലെ [a] അടയാളം പദത്തിന്റെ യഥാർഥ അർഥവ്യാപ്തി രേഖപ്പെടുത്തുന്നു.
