id: JUD.1.10
reference: Jude 1:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὗτοι δὲ ὅσα μὲν οὐκ οἴδασιν βλασφημοῦσιν, ὅσα δὲ φυσικῶς ὡς τὰ ἄλογα ζῷα ἐπίστανται, ἐν τούτοις φθείρονται.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/010.yaml
  text: But these people slander whatever they do not understand[a], and whatever they understand naturally, like irrational animals[c][b], by these things they are corrupted.
translation:
  language: ml
  text: എന്നാൽ ഈ ആളുകൾ തങ്ങൾക്കു മനസ്സിലാകാത്തതിനെയെല്ലാം ദുഷിച്ചു പറയുന്നു[a]; വിവേകമില്ലാത്ത മൃഗങ്ങളെപ്പോലെ സ്വാഭാവികമായി അറിയുന്ന കാര്യങ്ങളാൽ അവർ നശിച്ചുപോകുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “തങ്ങൾക്കറിയാത്തതിനെയെല്ലാം ദൂഷണം പറയുന്നു” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: οἴδασιν എന്നതിന് ‘അറിയുക’ എന്നും βλασφημοῦσιν എന്നതിന് ‘ദൂഷണം പറയുക’ എന്നും നേരിട്ട് പരിഭാഷപ്പെടുത്താവുന്ന പദവൈകല്യം രേഖപ്പെടുത്തുന്നു.
  - marker: b
    text: അഥവാ “ഈ കാര്യങ്ങളിൽ അവർ ദുഷിച്ചുപോകുന്നു” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: ἐν τούτοις എന്നതിന്റെ മേഖലാസൂചനയും φθείρονται എന്നതിന്റെ ധാർമിക ദുഷിപ്പ് എന്ന അർഥവും സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: οὗτοι
  choice: ഈ ആളുകൾ
  rationale: സന്ദർഭത്തിൽ കുറ്റപ്പെടുത്തപ്പെടുന്ന നുഴഞ്ഞുകയറിയവരെയാണ് സൂചിപ്പിക്കുന്നത്; ലിംഗസൂചന അനാവശ്യമായി ചേർക്കാതെ മലയാളത്തിൽ വ്യക്തത നൽകുന്നു.
- source_word: βλασφημοῦσιν
  choice: ദുഷിച്ചു പറയുന്നു
  rationale: വ്യക്തികളെയോ വിശുദ്ധ യാഥാർഥ്യങ്ങളെയോ അധിക്ഷേപിക്കുന്ന വിശാല അർഥം നിലനിർത്തുന്നു; ദൈവത്തിനെതിരായ ദൂഷണം എന്ന അർഥത്തിലേക്ക് മാത്രം ചുരുക്കുന്നില്ല.
- source_word: ὅσα μὲν οὐκ οἴδασιν
  choice: തങ്ങൾക്കു മനസ്സിലാകാത്തതിനെയെല്ലാം
  rationale: οἶδα അടിസ്ഥാനമായി ‘അറിയുക’ എന്നാണെങ്കിലും, സഹജമായ അറിവുമായുള്ള വൈരുധ്യം ഇവിടെ ഗ്രഹിക്കാത്തത് എന്ന ആശയം മുൻനിർത്തുന്നു.
- source_word: φυσικῶς
  choice: സ്വാഭാവികമായി
  rationale: കാര്യങ്ങൾ എങ്ങനെ അറിയുന്നു എന്ന ക്രിയാവിശേഷണബന്ധം നേരിട്ട് നിലനിർത്തുകയും മൃഗങ്ങളോടുള്ള ഉപമ സഹജപ്രേരണയുടെ ഭാവം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ἄλογα ζῷα
  choice: വിവേകമില്ലാത്ത മൃഗങ്ങൾ
  rationale: യുക്തിപൂർവമായ ഗ്രഹണശേഷിയുടെ അഭാവം സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐπίστανται
  choice: അറിയുന്ന
  rationale: പരിമിതമായ സഹജജ്ഞാനത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ഇവിടെ ‘അറിയുക’ സ്വാഭാവികമാണ്; മുൻവാക്യത്തിലെ ‘മനസ്സിലാകുക’ എന്നതുമായുള്ള സൂക്ഷ്മ വ്യത്യാസവും നിലനിൽക്കുന്നു.
- source_word: ἐν τούτοις
  choice: കാര്യങ്ങളാൽ
  rationale: 'ἐν എന്നതിന്റെ ഉപകരണാർഥസാധ്യത സ്വീകരിക്കുന്നു: അവർ പിന്തുടരുന്ന അതേ സഹജകാര്യങ്ങൾ അവരുടെ നാശത്തിനുള്ള മാർഗമാകുന്നു.'
- source_word: φθείρονται
  choice: നശിച്ചുപോകുന്നു
  rationale: ധാർമിക ദുഷിപ്പും അന്തിമ നാശവും ഉൾക്കൊള്ളാവുന്ന ശക്തമായ പദം; രൂപത്തിലെ മധ്യ/കർമണി ഭാവം അനാവശ്യമായി നിർണ്ണയിക്കാതെ ഫലമായ സ്വനാശം പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ദൈവിക വസ്തു വ്യക്തമായി പറയാത്തിടത്തെ βλασφημέω എന്ന പദത്തിന്റെ അർഥം
  choice: ദുഷിച്ചു പറയുന്നു
  alternative: ദൂഷണം പറയുന്നു / അധിക്ഷേപിക്കുന്നു
  rationale: അവർക്കു ഗ്രഹിക്കാനാകാത്ത കാര്യങ്ങളെക്കുറിച്ചുള്ള നിന്ദാഭാഷയാണ് വാക്യം കുറ്റപ്പെടുത്തുന്നത്; നേരിട്ട് ദൈവദൂഷണം മാത്രമാണെന്ന് ചുരുക്കുന്നില്ല.
- issue: φθείρονται എന്നതിലെ ദുഷിപ്പും നാശവും തമ്മിലുള്ള അർഥവ്യാപ്തി
  choice: നശിച്ചുപോകുന്നു
  alternative: ദുഷിച്ചുപോകുന്നു
  rationale: യൂദായുടെ ന്യായവിധിസന്ദർഭത്തിലെ നാശത്തിന്റെ ഗൗരവം പ്രകടമാക്കുന്നു; അതിലേക്കു നയിക്കുന്ന ധാർമിക ദുഷിപ്പിന്റെ ഭാവവും പൂർണമായി ഒഴിവാക്കുന്നില്ല.
- issue: ἐν τούτοις എന്നതിന്റെ ബന്ധം
  choice: കാര്യങ്ങളാൽ എന്ന ഉപകരണാർഥം
  alternative: ഇക്കാര്യങ്ങളിൽ എന്ന മേഖലാസൂചന
  rationale: ഗ്രീക്ക് പ്രയോഗം രണ്ടിനും ഇട നൽകുന്നു. പ്രധാനവാചകത്തിൽ കാരണ/ഉപകരണബന്ധം സ്വാഭാവികമായി നൽകുകയും മറ്റുസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിലെ അറിയാതിരിക്കൽ–സഹജമായി അറിയൽ എന്ന വൈരുധ്യവും അവസാനത്തെ നാശവിധിയും നിലനിർത്തി; പദാർഥത്തിലെ യഥാർഥ അനിശ്ചിതത്വങ്ങൾ അടിക്കുറിപ്പുകളിൽ നൽകി.
