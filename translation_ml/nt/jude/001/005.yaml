id: JUD.1.5
reference: Jude 1:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὑπομνῆσαι δὲ ὑμᾶς βούλομαι, εἰδότας ⸂ὑμᾶς ἅπαξ⸃ ⸀πάντα, ὅτι ⸀Ἰησοῦς λαὸν ἐκ γῆς Αἰγύπτου σώσας τὸ δεύτερον τοὺς μὴ πιστεύσαντας ἀπώλεσεν,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/005.yaml
  text: I want to remind you[a], though you know all things once for all, that Jesus, having saved a people out of the land of Egypt, afterward destroyed those who did not believe.
translation:
  language: ml
  text: 'നിങ്ങൾ ഇതെല്ലാം ഒരിക്കൽത്തന്നെ അറിഞ്ഞവരാണെങ്കിലും, നിങ്ങളെ ഓർമിപ്പിക്കാൻ ഞാൻ ആഗ്രഹിക്കുന്നു: യേശു[a] ഈജിപ്തുദേശത്തുനിന്ന് ഒരു ജനത്തെ രക്ഷിച്ചശേഷം, വിശ്വസിക്കാതിരുന്നവരെ പിന്നീട് നശിപ്പിച്ചു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘യേശു’ എന്നതിനുപകരം ‘കർത്താവ്’ എന്നോ ‘ദൈവം’ എന്നോ കാണുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: Ὑπομνῆσαι
  choice: ഓർമിപ്പിക്കാൻ
  rationale: അറിയാവുന്ന കാര്യം വീണ്ടും മനസ്സിലേക്കു കൊണ്ടുവരുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: βούλομαι
  choice: ഞാൻ ആഗ്രഹിക്കുന്നു
  rationale: പ്രഥമപുരുഷത്തിലെ ഇച്ഛയെ വ്യക്തമായും മാന്യമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: εἰδότας ὑμᾶς ἅπαξ πάντα
  choice: നിങ്ങൾ ഇതെല്ലാം ഒരിക്കലായി അറിഞ്ഞിരിക്കുന്നവരാണെങ്കിലും
  rationale: പങ്കുവെക്കുന്ന രക്ഷാചരിത്രജ്ഞാനത്തെയാണ് πάντα സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്; concessive ബന്ധവും ἅπαξ എന്നതിലെ നിർണായകമായ ‘ഒരിക്കലായി’ എന്ന ഭാവവും നിലനിർത്തുന്നു.
- source_word: Ἰησοῦς
  choice: യേശു
  rationale: നൽകിയിരിക്കുന്ന SBLGNT പാഠത്തിൽ Ἰησοῦς എന്നാണ്; പുറപ്പാടിൽ യേശുവിനെ പ്രവർത്തകവിഷയമായി അവതരിപ്പിക്കുന്ന പാഠത്തിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ ശക്തി മയപ്പെടുത്താതെ നിലനിർത്തുന്നു.
- source_word: λαὸν
  choice: ഒരു ജനത്തെ
  rationale: നിർദ്ദിഷ്ട article ഇല്ലാത്ത രൂപത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുകയും ഇസ്രായേലിനെ സമൂഹമായി സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐκ γῆς Αἰγύπτου
  choice: ഈജിപ്തുദേശത്തുനിന്ന്
  rationale: പുറപ്പാട് വിവരണത്തിന്റെ ബൈബിൾപരമായ പ്രതിധ്വനി സൂക്ഷിക്കുന്നതോടൊപ്പം മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: σώσας
  choice: രക്ഷിച്ചശേഷം
  rationale: പ്രധാനക്രിയയ്ക്ക് മുമ്പ് നടന്ന പ്രവൃത്തിയാണെന്ന aorist participle-ന്റെ കാലക്രമം വ്യക്തമായി നൽകുന്നു.
- source_word: τὸ δεύτερον
  choice: പിന്നീട്
  rationale: രക്ഷാപ്രവൃത്തിക്കു ശേഷമുള്ള തുടർനടപടിയെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; അക്ഷരാർഥത്തിലുള്ള അസ്വാഭാവികമായ ‘രണ്ടാമതായി’ ഒഴിവാക്കുന്നു.
- source_word: τοὺς μὴ πιστεύσαντας
  choice: വിശ്വസിക്കാതിരുന്നവരെ
  rationale: വിശ്വാസം പ്രകടിപ്പിക്കാതിരുന്ന കൂട്ടത്തെ നേരിട്ടും വ്യക്തമായും തിരിച്ചറിയിക്കുന്നു.
- source_word: ἀπώλεσεν
  choice: നശിപ്പിച്ചു
  rationale: ദൈവിക ന്യായവിധിയുടെ കാഠിന്യം കുറയ്ക്കാതെ ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നൽകുന്നു.
theological_decisions:
- issue: പുറപ്പാട് വാക്യത്തിലെ ക്രിസ്തുശാസ്ത്രപരമായ കർത്താവ്
  choice: മുഖ്യപാഠത്തിൽ ‘യേശു’ എന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘കർത്താവ്’ അല്ലെങ്കിൽ ‘ദൈവം’
  rationale: നൽകിയിരിക്കുന്ന ഗ്രീക്ക് പാഠം Ἰησοῦς എന്നാണ് വായിക്കുന്നത്. അതിനാൽ യേശുവിനെ പുറപ്പാടിലെ പ്രവർത്തകവിഷയമായി അവതരിപ്പിക്കുന്ന യഥാർഥ പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ സൂക്ഷിച്ചു; പ്രധാനപ്പെട്ട മറ്റു കൈയെഴുത്തുപ്രതി വായനകൾ അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി. മൂലപാഠത്തിൽ വ്യക്തമായ കാലസൂചകമായ ‘ഇപ്പോൾ’ ഇല്ലാത്തതിനാൽ അത്തരമൊരു പദം ചേർത്തിട്ടില്ല. വാക്യത്തിന്റെ ദീർഘമായ ഗ്രീക്ക് ഘടന വായനാസൗകര്യത്തിനായി ദ്വിബിന്ദുവിലൂടെ ക്രമപ്പെടുത്തി; അർഥബന്ധം മാറ്റിയിട്ടില്ല.
