id: JUD.1.13
reference: Jude 1:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: κύματα ἄγρια θαλάσσης ἐπαφρίζοντα τὰς ἑαυτῶν αἰσχύνας, ἀστέρες πλανῆται οἷς ὁ ζόφος τοῦ σκότους εἰς αἰῶνα τετήρηται.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/013.yaml
  text: wild waves of the sea[a], foaming up their own shames; wandering stars[b], for whom the gloom of darkness has been reserved forever.
translation:
  language: ml
  text: കടലിലെ ഉഗ്രമായ തിരമാലകൾ, തങ്ങളുടേതായ അപമാനങ്ങൾ[a] നുരച്ചുപൊങ്ങിച്ചെറിയുന്ന; അലഞ്ഞുതിരിയുന്ന നക്ഷത്രങ്ങൾ, അവർക്കായി അന്ധകാരത്തിന്റെ കൂരിരുട്ട്[b] എന്നേക്കുമായി കാത്തുവെച്ചിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തങ്ങളുടേതായ അപമാനം നുരയായി പുറത്തേക്കെറിയുന്ന” അല്ലെങ്കിൽ “തങ്ങളുടേതായ ലജ്ജാകരമായ പ്രവൃത്തികൾ നുരച്ചുപൊങ്ങിച്ചെറിയുന്ന.” ഗ്രീക്കിലെ “അപമാനങ്ങൾ/ലജ്ജകൾ” എന്ന ബഹുവചനം അപമാനത്തെയോ അവരെ വെളിപ്പെടുത്തുന്ന ലജ്ജാകരമായ പ്രവൃത്തികളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ഇരുട്ടിന്റെ കരിമ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κύματα ἄγρια θαλάσσης
  choice: കടലിലെ വന്യമായ തിരമാലകൾ
  rationale: കടൽത്തിരമാലകളുടെ നിയന്ത്രണമില്ലാത്ത, ഉഗ്രമായ സ്വഭാവം വ്യക്തമാക്കുകയും മൂലത്തിലെ സജീവമായ രൂപകം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐπαφρίζοντα
  choice: നുരച്ചുപൊന്തിക്കുന്നവർ
  rationale: നുര ഉത്പാദിപ്പിച്ച് പുറത്തുകൊണ്ടുവരുന്ന തുടർച്ചയായ പ്രവർത്തനത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: τὰς ἑαυτῶν αἰσχύνας
  choice: തങ്ങളുടെതന്നെ ലജ്ജാകരമായ പ്രവൃത്തികളെ
  rationale: αἰσχύνας എന്ന ബഹുവചനം അപമാനകരമായ കാര്യങ്ങളെയോ പ്രവൃത്തികളെയോ സൂചിപ്പിക്കാം. മലയാളത്തിൽ അസ്വാഭാവികമായ ‘ലജ്ജകൾ’ എന്ന രൂപം ഒഴിവാക്കി പ്രവൃത്തിസൂചന പ്രധാനവാചകത്തിൽ നൽകി, മറ്റർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἀστέρες πλανῆται
  choice: അലഞ്ഞുതിരിയുന്ന നക്ഷത്രങ്ങൾ
  rationale: ആധുനിക ജ്യോതിശാസ്ത്രപരമായ ‘ഗ്രഹങ്ങൾ’ എന്ന കൃത്യത അനാവശ്യമായി ഇറക്കുമതി ചെയ്യാതെ, വഴിതെറ്റി സഞ്ചരിക്കുന്ന ആകാശഗോളങ്ങളുടെ രൂപകം നിലനിർത്തുന്നു.
- source_word: οἷς
  choice: അവർക്കായി
  rationale: നക്ഷത്രങ്ങൾ എന്ന രൂപകത്തിലൂടെ വിവരിക്കപ്പെടുന്ന വ്യക്തികളിലേക്കാണ് സർവനാമം തിരിച്ചുപോകുന്നത്; അതിനാൽ വ്യക്തിപരമായ സൂചന വ്യക്തമാക്കുന്നു.
- source_word: ὁ ζόφος τοῦ σκότους
  choice: അന്ധകാരത്തിന്റെ കൂരിരുട്ട്
  rationale: ζόφος-σκότος സംയോജനത്തിലെ തീവ്രമായ ഇരുട്ടിന്റെ ചിത്രം നിലനിർത്തുന്നു; ‘കൂരിരുട്ട്’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: εἰς αἰῶνα
  choice: എന്നേക്കുമായി
  rationale: ന്യായവിധിയുടെ ഈ സന്ദർഭത്തിൽ തുടർച്ചയും അന്തിമത്വവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τετήρηται
  choice: കാത്തുവെച്ചിരിക്കുന്നു
  rationale: പൂർണകാല നിഷ്ക്രിയരൂപം മുൻകൂട്ടി വെച്ചതിന്റെ ഫലമായി ഇപ്പോഴും സംവരണം ചെയ്തിരിക്കുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: εἰς αἰῶνα എന്നതിലെ ന്യായവിധിയുടെ ദൈർഘ്യം
  choice: എന്നേക്കുമായി
  alternative: യുഗത്തോളം
  rationale: ഈ ന്യായവിധിസന്ദർഭത്തിൽ പ്രയോഗം സ്വാഭാവികമായി അവസാനമില്ലാത്ത ദൈർഘ്യം അറിയിക്കുന്നു; അതിലപ്പുറം ഒരു പ്രത്യേക സിദ്ധാന്തവ്യാഖ്യാനവും ചേർക്കുന്നില്ല.
- issue: τὰς ἑαυτῶν αἰσχύνας എന്നതിന്റെ അർഥപരിധി
  choice: തങ്ങളുടെതന്നെ ലജ്ജാകരമായ പ്രവൃത്തികളെ
  alternative: തങ്ങളുടെതന്നെ അപമാനം
  rationale: ഗ്രീക്ക് ബഹുവചനം ലജ്ജാകരമായ പ്രവൃത്തികളെയോ അവ മൂലമുള്ള അപമാനത്തെയോ സൂചിപ്പിക്കാം. പ്രധാനവാചകം വ്യക്തവും സ്വാഭാവികവുമാക്കി, യഥാർഥ ദ്വയാർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ മലയാളം. മൂലത്തിലെ തുടർച്ചയായ രൂപകപ്പട്ടികയും ന്യായവിധിയുടെ ശക്തമായ ദൃശ്യഭാഷയും സംരക്ഷിച്ചു.
