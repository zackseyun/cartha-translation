id: JUD.1.1
reference: Jude 1:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἰούδας Ἰησοῦ Χριστοῦ δοῦλος, ἀδελφὸς δὲ Ἰακώβου, τοῖς ἐν θεῷ πατρὶ ⸀ἠγαπημένοις καὶ Ἰησοῦ Χριστῷ τετηρημένοις κλητοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/001.yaml
  text: 'Jude[a], a servant of Jesus the Messiah and brother of James, to those who are loved in God the Father and kept for Jesus the Messiah[c][b], called:'
translation:
  language: ml
  text: 'യേശു മശീഹായുടെ അടിമയും യാക്കോബിന്റെ സഹോദരനുമായ യൂദാ, പിതാവായ ദൈവത്തിൽ സ്നേഹിക്കപ്പെട്ടവരും[b] യേശു മശീഹായ്ക്കായി കാത്തുസൂക്ഷിക്കപ്പെട്ടവരും[a] വിളിക്കപ്പെട്ടവരുമായ[c] നിങ്ങൾക്ക്:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘യേശു മശീഹായാൽ കാത്തുസൂക്ഷിക്കപ്പെട്ടവർ.’ ഗ്രീക്ക് ദാതിവ് ‘ആരാൽ’ എന്ന കർത്തൃത്വമോ ‘ആർക്കായി’ എന്ന ലക്ഷ്യം/പ്രയോജനമോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
  - marker: b
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘പിതാവായ ദൈവത്തിൽ വിശുദ്ധീകരിക്കപ്പെട്ടവർ’ എന്നു കാണുന്നു.
    reason: textual_variant
  - marker: c
    text: അക്ഷരാർഥത്തിൽ ‘വിളിക്കപ്പെട്ടവർ’.
    reason: translation_note
lexical_decisions:
- source_word: δοῦλος
  choice: അടിമ
  rationale: ബന്ധിതമായ ഉടമസ്ഥതയും പൂർണമായ വിധേയത്വവും സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പദത്തിന്റെ ശക്തി ‘അടിമ’ നിലനിർത്തുന്നു; ‘ദാസൻ’ എന്നത് ഈ അർഥം മൃദൂകരിക്കാം.
- source_word: Χριστοῦ / Χριστῷ
  choice: മശീഹാ
  rationale: Χριστός ഇവിടെ വെറും പേരല്ല, അഭിഷിക്തൻ എന്ന പദവിയാണ്; ‘മശീഹാ’ അതിന്റെ പദവിസ്വഭാവം നിലനിർത്തുന്നു.
- source_word: ἀδελφὸς δὲ Ἰακώβου
  choice: യാക്കോബിന്റെ സഹോദരൻ
  rationale: δέ ഇവിടെ ശക്തമായ വിരോധമല്ല, മൃദുവായ ബന്ധകമാണ്; മലയാളത്തിലെ സംയുക്തഘടനയിൽ അത് സ്വാഭാവികമായി പ്രകടമാകുന്നു. Ἰάκωβος എന്ന പേരിന് ഉറവിടരൂപത്തോട് അടുത്ത ‘യാക്കോബ്’ സ്വീകരിച്ചു.
- source_word: ἐν θεῷ πατρὶ
  choice: പിതാവായ ദൈവത്തിൽ
  rationale: ἐν എന്നതിന്റെ സ്ഥലം/ബന്ധമണ്ഡലം സൂചിപ്പിക്കുന്ന അർഥം നിലനിർത്തുകയും ‘ദൈവത്താൽ’ എന്ന കാരകവ്യാഖ്യാനം അനാവശ്യമായി ചുമത്താതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἠγαπημένοις
  choice: സ്നേഹിക്കപ്പെട്ടവർ
  rationale: പൂർണ നിഷ്ക്രിയ കൃദന്തരൂപം ദൈവസ്നേഹത്തിന്റെ ഫലമായി തുടരുന്ന അവസ്ഥ സൂചിപ്പിക്കുന്നു; ഈ മലയാളപ്രയോഗം അത് വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: τετηρημένοις
  choice: കാത്തുസൂക്ഷിക്കപ്പെട്ടവർ
  rationale: സംരക്ഷിക്കപ്പെട്ട നിലയെ സൂചിപ്പിക്കുന്ന പൂർണ നിഷ്ക്രിയ കൃദന്തരൂപം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: κλητοῖς
  choice: വിളിക്കപ്പെട്ടവർ
  rationale: സ്വീകർത്താക്കളെ വിശേഷിപ്പിക്കുന്ന substantival adjective-ന്റെ ദൈവിക വിളിയുടെ ഭാരം നിലനിർത്തുന്നു; മറ്റു വിശേഷണങ്ങളോടുള്ള വ്യാകരണസമാന്തരതയും സംരക്ഷിക്കുന്നു.
- source_word: Ἰούδας
  choice: യൂദാ
  rationale: പുതിയനിയമത്തിലെ ഈ പേരിന്റെ മലയാളത്തിൽ പരിചിതവും ഉറവിടത്തോട് അടുത്തതുമായ രൂപം.
- source_word: Ἰάκωβος
  choice: യാക്കോബ്
  rationale: ഗ്രീക്ക് പേരിന്റെ സെമിറ്റിക് അടിസ്ഥാനരൂപത്തോട് അടുത്തതും മലയാളത്തിൽ വ്യക്തവുമായ രൂപം; ഇംഗ്ലീഷ് പതിവായ ‘James’ അനുകരിക്കുന്നില്ല.
theological_decisions:
- issue: τετηρημένοις എന്നതും Ἰησοῦ Χριστῷ എന്ന ദാതിവും തമ്മിലുള്ള ബന്ധം
  choice: യേശു മശീഹായ്ക്കായി കാത്തുസൂക്ഷിക്കപ്പെട്ടവർ
  alternative: യേശു മശീഹായാൽ കാത്തുസൂക്ഷിക്കപ്പെട്ടവർ
  rationale: ദാതിവ് ലക്ഷ്യം/പ്രയോജനം (‘മശീഹായ്ക്കായി’) അല്ലെങ്കിൽ കർത്തൃത്വം (‘മശീഹായാൽ’) സൂചിപ്പിക്കാം. മുഖ്യപാഠത്തിൽ സാധ്യതയേറിയ ലക്ഷ്യാർഥം സ്വീകരിച്ച് യഥാർഥമായ വ്യാകരണസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: ἠγαπημένοις എന്ന പാഠരൂപം
  choice: സ്നേഹിക്കപ്പെട്ടവർ
  alternative: വിശുദ്ധീകരിക്കപ്പെട്ടവർ
  rationale: നൽകിയ SBLGNT പാഠത്തിലെ ἠγαπημένοις പിന്തുടരുന്നു; ἡγιασμένοις എന്ന പ്രധാന കൈയെഴുത്തുപ്രതി വ്യത്യാസം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- issue: κλητοῖς എന്നതിന്റെ വാക്യഘടന
  choice: വിളിക്കപ്പെട്ടവരുമായ നിങ്ങൾക്ക്
  alternative: വിളിക്കപ്പെട്ടവർക്ക്
  rationale: സ്വീകർത്താക്കളെ സൂചിപ്പിക്കുന്ന τοῖς-നോടൊപ്പം വരുന്ന മൂന്ന് വിശേഷണങ്ങളുടെ സമാന്തരത മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; ‘വിളിക്കപ്പെട്ടവർ’ എന്ന സ്വതന്ത്രരൂപവും സാധ്യമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കത്താരംഭശൈലി സ്വീകരിച്ചു. ഗ്രീക്ക് മൂലത്തിലെ ദീർഘമായ സ്വപരിചയവും സ്വീകർത്താക്കളുടെ മൂന്ന് സമാന്തര വിശേഷണങ്ങളും നിലനിർത്തിയെങ്കിലും, മലയാളത്തിൽ കർത്താവിനെ വ്യക്തമായി കാണിക്കാൻ ‘നിങ്ങൾക്ക് എഴുതുന്നത്’ എന്നു സ്വാഭാവികമാക്കി. മതവിഭാഗവിശേഷമായ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
