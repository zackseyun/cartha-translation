id: JUD.1.24
reference: Jude 1:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τῷ δὲ δυναμένῳ φυλάξαι ⸀ὑμᾶς ἀπταίστους καὶ στῆσαι κατενώπιον τῆς δόξης αὐτοῦ ἀμώμους ἐν ἀγαλλιάσει
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/024.yaml
  text: To the one who is able to keep you from stumbling and to present you blameless before his glory with rejoicing[c][b][a],
translation:
  language: ml
  text: നിങ്ങളെ ഇടറാതെ[a] കാത്തുസൂക്ഷിക്കാനും തന്റെ മഹത്വത്തിന്റെ[b] മുമ്പിൽ ആനന്ദത്തോടെ കുറ്റമറ്റവരായി[c] നിർത്താനും കഴിയുന്നവന്,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘വീഴാതെ.’ ഗ്രീക്ക് പദം ഇടറാതിരിക്കുകയോ വീഴാതിരിക്കുകയോ ചെയ്യുക എന്ന ആശയം വഹിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: 'കൂടുതൽ വ്യാഖ്യാനാത്മകമായി: ‘തന്റെ മഹത്വപൂർണമായ സാന്നിധ്യത്തിൽ.’ അക്ഷരാർഥത്തോട് കൂടുതൽ അടുത്തത് ‘തന്റെ മഹത്വത്തിന്റെ മുമ്പിൽ’ എന്നാണ്.'
    reason: alternative_reading
  - marker: c
    text: 'അഥവാ: ‘കളങ്കമില്ലാത്തവരായി.’ ഗ്രീക്ക് പദത്തിന് കുറ്റമില്ലായ്മയോടൊപ്പം യാഗവസ്തുവിന്റെ കളങ്കമില്ലായ്മയെയും ഓർമിപ്പിക്കാനാകും.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῷ ... δυναμένῳ
  choice: കഴിയുന്നവന്
  rationale: ആശീർവാദസ്തുതിയുടെ വാക്യഘടന 25-ാം വാക്യത്തിൽ തുടരുന്നതിനാൽ, ദാതൃവിഭക്തിയിലുള്ള കർത്തൃവാചക കൃതന്തത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ ‘കഴിയുന്നവന്’ എന്നു നൽകി.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയില്ല
  rationale: ഇവിടെ δέ ശക്തമായ വിരോധമല്ല, സമാപനസ്തുതിയിലേക്കുള്ള മൃദുവായ സംവാദമാറ്റമാണ്. ‘എന്നാൽ’ എന്നത് അനാവശ്യമായ വിരോധവും ‘ഇനി’ എന്നത് മൂലത്തിൽ ഇല്ലാത്ത കാലസൂചനയും നൽകാൻ ഇടയുള്ളതിനാൽ മലയാള വാക്യപ്രവാഹത്തിൽ സൂചന പരോക്ഷമായി നിലനിർത്തി.
- source_word: φυλάξαι
  choice: കാത്തുസൂക്ഷിക്കാനും
  rationale: φυλάσσω എന്നതിലെ കാക്കുക, സൂക്ഷിക്കുക, സംരക്ഷിക്കുക എന്നീ ആശയങ്ങൾ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്ന പ്രയോഗം.
- source_word: ὑμᾶς
  choice: നിങ്ങളെ
  rationale: രണ്ടാംപുരുഷ ബഹുവചന കർമത്തെ നേരിട്ട് പ്രതിനിധീകരിക്കുന്നു.
- source_word: ἀπταίστους
  choice: ഇടറാതെ
  rationale: ഇടറാതിരിക്കുക എന്ന മൂലരൂപകം നിലനിർത്തുകയും അതിനെ പാപരഹിതത്വമോ അന്തിമ വിശ്വാസത്യാഗമോ എന്ന ഒറ്റ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: καὶ στῆσαι
  choice: നിർത്താനും
  rationale: ἵστημι എന്ന പദത്തിന്റെ ‘നിൽക്കുമാറാക്കുക/നിർത്തുക’ എന്ന അടിസ്ഥാനചിത്രം നിലനിർത്തുന്നു; ദൈവമഹത്ത്വത്തിന്റെ മുമ്പിൽ ഒരാളെ ഹാജരാക്കുന്ന ആശയവും സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: κατενώπιον
  choice: മുമ്പിൽ
  rationale: ‘സന്നിധിയിൽ/ദൃഷ്ടിയിൽ’ എന്ന അർഥമുള്ള പദത്തിന് സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ തുല്യപ്രയോഗം.
- source_word: τῆς δόξης αὐτοῦ
  choice: തന്റെ മഹത്ത്വത്തിന്റെ
  rationale: δόξαയെ വ്യാഖ്യാനപരമായി ‘മഹത്ത്വപൂർണമായ സാന്നിധ്യം’ എന്നു വികസിപ്പിക്കാതെ ‘മഹത്ത്വം’ എന്ന നാമമായി നിലനിർത്തുന്നു. ‘തന്റെ’ എന്നത് കഴിയുന്നവനിലേക്കുള്ള ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἀμώμους
  choice: കുറ്റമറ്റവരായി
  rationale: ധാർമിക കുറ്റമില്ലായ്മയെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; പദത്തിനുള്ള യാഗസംബന്ധമായ ‘കളങ്കമില്ലാത്ത’ ധ്വനി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἐν ἀγαλλιάσει
  choice: ആനന്ദത്തോടെ
  rationale: ഉല്ലാസപൂർണമായ ആനന്ദത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; മൂലത്തിൽ വ്യക്തമായി ഇല്ലാത്ത ‘മഹാ’ എന്ന തീവ്രത ചേർക്കുന്നില്ല.
theological_decisions:
- issue: τῆς δόξης αὐτοῦ എന്നത് ‘തന്റെ മഹത്ത്വം’ എന്നോ ‘തന്റെ മഹത്ത്വപൂർണമായ സാന്നിധ്യം’ എന്നോ നൽകണമോ
  choice: തന്റെ മഹത്ത്വത്തിന്റെ മുമ്പിൽ
  alternative: തന്റെ മഹത്ത്വപൂർണമായ സാന്നിധ്യത്തിൽ
  rationale: ഗ്രീക്കിൽ δόξα എന്ന നാമമാണ് നേരിട്ട് ഉള്ളത്; παρουσία ഇല്ല. അതിനാൽ സാന്നിധ്യം എന്ന സന്ദർഭസൂചന വായനക്കാർക്ക് തുറന്നുവെച്ചുകൊണ്ട് മൂലപദത്തിന്റെ ദൈവശാസ്ത്രഭാരം നിലനിർത്തി.
- issue: ἀπταίστους എന്നത് സാധാരണ ഇടർച്ചയെയോ അന്തിമ വീഴ്ചയെയോ സൂചിപ്പിക്കുന്നതായി നിർണ്ണയിക്കണമോ
  choice: ഇടറാതെ
  alternative: വീഴാതെ
  rationale: ‘ഇടറുക’ എന്ന രൂപകം ധാർമിക പരാജയവും കൂടുതൽ ഗൗരവമുള്ള വീഴ്ചയും ഉൾക്കൊള്ളാൻ കഴിയുന്നതിനാൽ, വാക്യം തീർപ്പാക്കാത്ത ദൈവശാസ്ത്രപരമായ വ്യാപ്തി പരിഭാഷയും തീർപ്പാക്കുന്നില്ല.
- issue: στῆσαι എന്നത് ‘ഹാജരാക്കുക’ എന്നോ ‘നിർത്തുക’ എന്നോ നൽകണമോ
  choice: നിർത്താനും
  alternative: ഹാജരാക്കാനും
  rationale: ‘നിർത്തുക’ മൂലക്രിയയുടെ ദൃശ്യരൂപം കാത്തുസൂക്ഷിക്കുന്നു; മഹത്ത്വത്തിന്റെ മുമ്പിൽ എന്ന ഘടകം ഔപചാരികമായ സമർപ്പണം/ഹാജരാക്കൽ എന്ന ആശയം ആവശ്യത്തിന് സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ സ്തുതിഗീതശൈലി സ്വീകരിച്ചു. ഈ വാക്യം 25-ാം വാക്യത്തിൽ പൂർത്തിയാകുന്ന ആശീർവാദസ്തുതിയുടെ ആദ്യഭാഗമായതിനാൽ അവസാനം അർദ്ധവിരാമസ്വഭാവമുള്ള കോമ നിലനിർത്തി. അനാവശ്യമായ സഭാപാരമ്പര്യ സാങ്കേതികപദങ്ങളും വിഭാഗീയ വ്യാഖ്യാനങ്ങളും ഒഴിവാക്കി.
