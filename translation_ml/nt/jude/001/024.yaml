  source_fidelity: 'വാക്യഘടനയും പ്രധാന അർഥങ്ങളും മൂലഗ്രീക്കിനോട് വിശ്വസ്തമാണ്: δυναμένῳ-യുടെ ദാതൃസ്വരം ‘കഴിയുന്നവന്’ എന്നതിൽ നിലനിൽക്കുന്നു; φυλάξαι ἀπταίστους, στῆσαι, κατενώπιον, ἀμώμους, ἐν ἀγαλλιάσει എന്നിവ യഥാക്രമം സ്വാഭാവികമായി പ്രതിഫലിക്കുന്നു. എന്നാൽ δόξαയ്ക്ക് സ്ഥാപിതവും കൂടുതൽ കൃത്യവുമായ മലയാള ദൈവശാസ്ത്രപദം ‘മഹത്വം’ ആണ്; നിലവിലെ ‘മഹത്ത്വം’ ‘greatness’ എന്ന ആശയത്തിലേക്ക് അല്പം വഴുതാം.'
  naturalness: ‘നിങ്ങളെ ഇടറാതെ കാത്തുസൂക്ഷിക്കാനും … നിർത്താനും കഴിയുന്നവന്,’ എന്നത് ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സ്വാഭാവികവുമാണ്. വാക്യം അടുത്ത വാക്യത്തിൽ തുടരുന്നതിനാൽ അവസാന കോമ യുക്തമാണ്.
  terminology: δόξαയ്ക്ക് ‘മഹത്വം’ എന്ന് ഏകീകരിക്കുന്നത് ഉചിതമാണ്. ‘കുറ്റമറ്റവരായി’ ἀμώμους-ന്റെ ധാർമികവും യാഗസംബന്ധവുമായ വ്യാപ്തി പ്രധാനവാചകത്തിലും അടിക്കുറിപ്പിലും സമതുലിതമായി നൽകുന്നു. ‘ഇടറാതെ’ എന്നത് ἀπταίστους-ന്റെ രൂപകം നിലനിർത്തുകയും അന്തിമവീഴ്ചയെന്ന ഒരൊറ്റ വ്യാഖ്യാനം നിർബന്ധിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
