source:
  edition: SBLGNT
  text: Λουκᾶς ἐστιν μόνος μετ’ ἐμοῦ. Μᾶρκον ἀναλαβὼν ἄγε μετὰ σεαυτοῦ, ἔστιν γάρ μοι εὔχρηστος εἰς διακονίαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/011.yaml
  text: Luke alone is with me. Pick up Mark and bring him with you, for he is useful to me for ministry.
translation:
  language: ml
  text: ലൂക്കോസ് മാത്രമാണ് എന്നോടുകൂടെ ഉള്ളത്. മർക്കോസിനെ കൂട്ടിക്കൊണ്ടു വരിക; കാരണം, ശുശ്രൂഷയ്ക്കായി[a] അവൻ എനിക്ക് ഉപകാരമുള്ളവനാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സേവനത്തിനായി.” ഗ്രീക്ക് പദം പൊതുവായ സേവനത്തെയും സൂചിപ്പിക്കാം; ഇവിടെ അത് ശുശ്രൂഷാപ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λουκᾶς
  choice: ലൂക്കോസ്
  rationale: മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ സ്ഥിരപ്പെട്ട വ്യക്തിനാമരൂപം; ഗ്രീക്ക് നാമത്തെ സ്വാഭാവികമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: μόνος
  choice: മാത്രമാണ്
  rationale: ലൂക്കോസ് മാത്രമാണ് ഇപ്പോൾ പൗലോസിനോടുകൂടെ ഉള്ളത് എന്ന ഏകത്വത്തിന്റെ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: μετ’ ἐμοῦ
  choice: എന്നോടുകൂടെ ഉള്ളത്
  rationale: ജനിറ്റീവോടുകൂടിയ μετά സൂചിപ്പിക്കുന്ന സഹവാസം നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: Μᾶρκον
  choice: മർക്കോസിനെ
  rationale: മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ സ്ഥിരപ്പെട്ട വ്യക്തിനാമരൂപം; വാക്യത്തിലെ കർമവിഭക്തിയും വ്യക്തമാക്കുന്നു.
- source_word: ἀναλαβὼν
  choice: കൂട്ടിക്കൊണ്ട്
  rationale: മർക്കോസിനെ ആദ്യം കൂടെ ചേർത്തശേഷം കൊണ്ടുവരണമെന്ന പങ്കാളിക്രിയയുടെ ക്രമാർഥം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: ἄγε
  choice: കൊണ്ടുവരിക
  rationale: ഈ യാത്രാസന്ദർഭത്തിൽ ἄγω എന്ന ആജ്ഞാരൂപം ഒരാളെ കൂടെ കൊണ്ടുവരുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: μετὰ σεαυτοῦ
  choice: നിന്നോടൊപ്പം
  rationale: മർക്കോസ് തിമൊഥെയൊസിന്റെ കൂടെ വരണമെന്ന അനുഗമനാർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: γάρ μοι
  choice: അവൻ എനിക്ക് ... ആണ്
  rationale: γάρ നൽകുന്ന കാരണബന്ധം മലയാളത്തിലെ അർദ്ധവിരാമത്തിനു ശേഷമുള്ള വിശദീകരണത്തിലൂടെ നിലനിർത്തുകയും μοι എന്ന വ്യക്തിപരമായ ബന്ധം ‘എനിക്ക്’ എന്നു വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: εὔχρηστος
  choice: ഉപകാരമുള്ളവൻ
  rationale: പ്രയോജനകരൻ, സഹായകരൻ എന്ന അർഥം വ്യക്തിയെ വസ്തുവൽക്കരിക്കാതെ സ്വാഭാവികവും മാന്യവുമായി നൽകുന്നു.
- source_word: εἰς διακονίαν
  choice: ശുശ്രൂഷയ്ക്ക്
  rationale: ഇവിടെ പൗലോസിന്റെ പ്രവർത്തനവുമായി ബന്ധപ്പെട്ട സേവനത്തെ സൂചിപ്പിക്കുന്ന സാധ്യതയുള്ള മലയാള സഭാപദമാണ്; ഗ്രീക്ക് പദത്തിന്റെ വിശാലമായ ‘സേവനം’ എന്ന അർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: διακονία എന്ന പദത്തിന്റെ പരിധി
  choice: ശുശ്രൂഷയ്ക്ക്
  alternative: സേവനത്തിന്
  rationale: സന്ദർഭം പൗലോസിന്റെ അപ്പൊസ്തലിക പ്രവർത്തനത്തെ സൂചിപ്പിക്കാമെന്നതിനാൽ ‘ശുശ്രൂഷ’ പ്രധാനപാഠത്തിൽ യോജിക്കുന്നു. എന്നാൽ ഇത് ഔദ്യോഗിക സഭാപദവിയായി ചുരുക്കാതെ, വിശാലമായ സേവനം എന്ന സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘ലൂക്കോസ്’, ‘മർക്കോസ്’ എന്നീ പരിചിത ബൈബിൾ നാമരൂപങ്ങൾ നിലനിർത്തി. ആജ്ഞ വ്യക്തവും സ്വാഭാവികവുമാക്കാൻ ‘കൂട്ടിക്കൊണ്ട് ... കൊണ്ടുവരിക’ ഉപയോഗിച്ചു; διακονίαയുടെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
