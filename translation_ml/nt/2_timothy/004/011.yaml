- from: ലൂക്കോസ് മാത്രമാണ് എന്നോടുകൂടെ ഉള്ളത്. മർക്കോസിനെ കൂട്ടിക്കൊണ്ട് നിന്നോടൊപ്പം കൊണ്ടുവരിക; ശുശ്രൂഷയ്ക്ക്[a] അവൻ എനിക്ക് ഉപകാരമുള്ളവനാണ്.
