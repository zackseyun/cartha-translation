id: 2TI.4.9
reference: 2 Timothy 4:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Σπούδασον ἐλθεῖν πρός με ταχέως·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/009.yaml
  text: Make every effort to come to me quickly[a].
translation:
  language: ml
  text: എന്റെ അടുക്കൽ വേഗം വരാൻ പരമാവധി ശ്രമിക്കുക[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എന്റെ അടുക്കൽ താമസിയാതെ വരാൻ ആത്മാർഥമായി ശ്രമിക്കുക.’
    reason: Σπούδασον എന്നതിന് ‘ആത്മാർഥമായി ശ്രമിക്കുക’ എന്നും ταχέως എന്നതിന് ‘താമസിയാതെ’ എന്നും അർഥമാകാം.
lexical_decisions:
- source_word: Σπούδασον
  choice: പരമാവധി ശ്രമിക്കുക
  rationale: σπουδάζω എന്ന ക്രിയയുടെ ആജ്ഞാരൂപം ആത്മാർഥമായ ഉത്സാഹവും മനഃപൂർവമായ പരിശ്രമവും സൂചിപ്പിക്കുന്നു. ‘പരമാവധി ശ്രമിക്കുക’ എന്നത് ഈ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ‘വേഗം വരുക’ എന്നു മാത്രം പറഞ്ഞാൽ ταχέως എന്ന പദവുമായി ഇതിന്റെ അർഥവ്യത്യാസം ഇല്ലാതാകും.
- source_word: ἐλθεῖν
  choice: വരാൻ
  rationale: ἔρχομαι എന്ന ക്രിയയുടെ അനന്തക്രിയാരൂപം; πρός με എന്നതിനോടൊപ്പം സംസാരിക്കുന്നയാളുടെ അടുക്കലേക്കുള്ള വരവിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘വരാൻ’ സ്വാഭാവികമാണ്.
- source_word: πρός με
  choice: എന്റെ അടുക്കൽ
  rationale: πρός + accusative ഒരു വ്യക്തിയുടെ അടുത്തേക്കുള്ള ചലനം സൂചിപ്പിക്കുന്നു. ‘എന്റെ അടുക്കൽ’ ദിശയും വ്യക്തിബന്ധവും വ്യക്തമായി നൽകുന്നു.
- source_word: ταχέως
  choice: വേഗം
  rationale: ഈ ക്രിയാവിശേഷണം ‘വേഗത്തിൽ’ അല്ലെങ്കിൽ ‘താമസിയാതെ’ എന്ന സമയപരമായ അടിയന്തരത സൂചിപ്പിക്കുന്നു. ‘വേഗം’ മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്; Σπούδασον സൂചിപ്പിക്കുന്ന പരിശ്രമത്തിൽനിന്ന് ഇതിനെ വേർതിരിച്ചും നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആജ്ഞാരൂപം ഉപയോഗിച്ചു. വാക്യത്തിലെ ആത്മാർഥമായ പരിശ്രമവും സമയപരമായ അടിയന്തരതയും രണ്ടു വ്യത്യസ്ത ഘടകങ്ങളായി നിലനിർത്തി.
