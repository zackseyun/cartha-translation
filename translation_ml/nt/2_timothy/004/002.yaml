  naturalness: ഗൗരവമുള്ള ആധുനിക നിലവാരമലയാളത്തിൽ വാക്യം വ്യക്തവും വായനാസുഗമവുമാണ്. സമയം സൂചിപ്പിക്കുന്ന പദബന്ധത്തോടു [b]യും ‘സന്നദ്ധനായിരിക്കുക’ എന്ന ക്രിയയോടു [a]യും നേരിട്ടു ചേർക്കുന്നത് അടിക്കുറിപ്പ്-ആശ്രയബന്ധം വായനക്കാരന് വ്യക്തതയോടെ കാണിക്കും.
