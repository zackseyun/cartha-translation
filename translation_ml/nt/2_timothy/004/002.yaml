revisions:
- from: വചനം പ്രസംഗിക്കുക; സമയം അനുകൂലമായാലും അല്ലെങ്കിലും സന്നദ്ധനായിരിക്കുക[a][b]. തെറ്റ് ബോധ്യപ്പെടുത്തുക, ശാസിക്കുക, പ്രബോധിപ്പിക്കുക[c]—പൂർണ ക്ഷമയോടും ഉപദേശത്തോടുംകൂടെ.
  to: വചനം പ്രസംഗിക്കുക; അനുകൂലസമയത്തായാലും പ്രതികൂലസമയത്തായാലും[b] സന്നദ്ധനായിരിക്കുക[a]. തെറ്റ് ബോധ്യപ്പെടുത്തുക, ശാസിക്കുക, പ്രബോധിപ്പിക്കുക[c]—പൂർണ ക്ഷമയോടും ഉപദേശത്തോടുംകൂടെ.
  rationale: മുഖ്യവാക്യത്തിന്റെ അർഥത്തിൽ മാറ്റം വരുത്താതെ, അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവയുടെ യഥാർഥ ഗ്രീക്ക് പദബന്ധങ്ങളോടു നേരിട്ടു ചേർത്തു. ‘സന്നദ്ധനായിരിക്കുക’ എന്നതോടു [a]യും കാലാനുകൂല്യം/പ്രതികൂല്യം സൂചിപ്പിക്കുന്ന പദബന്ധത്തോടു [b]യും ചേർക്കുന്നതിനായി വാക്യഘടന സ്വാഭാവിക മലയാളക്രമത്തിലാക്കി.
