id: 2TI.4.2
reference: 2 Timothy 4:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: κήρυξον τὸν λόγον, ἐπίστηθι εὐκαίρως ἀκαίρως, ἔλεγξον, ἐπιτίμησον, παρακάλεσον, ἐν πάσῃ μακροθυμίᾳ καὶ διδαχῇ.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/002.yaml
  text: Preach the word[a]; be ready in season and out of season; reprove, rebuke, exhort[c][b], with all patience and teaching.
translation:
  language: ml
  text: വചനം പ്രസംഗിക്കുക; അനുകൂലസമയത്തായാലും പ്രതികൂലസമയത്തായാലും[b] സന്നദ്ധനായിരിക്കുക[a]. തെറ്റ് ബോധ്യപ്പെടുത്തുക, ശാസിക്കുക, പ്രബോധിപ്പിക്കുക[c]—പൂർണ ക്ഷമയോടും ഉപദേശത്തോടുംകൂടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഉറച്ചുനിൽക്കുക,’ ‘സന്നിഹിതനായിരിക്കുക,’ അല്ലെങ്കിൽ ‘അടിയന്തരമായി പ്രവർത്തിക്കുക.’ ഗ്രീക്ക് ആജ്ഞാരൂപത്തിന് ഒരുക്കമായിരിക്കുക, സമീപത്തുണ്ടായിരിക്കുക, കാര്യം അടിയന്തരമായി മുന്നോട്ടുകൊണ്ടുപോകുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘സമയം അനുകൂലമായാലും പ്രതികൂലമായാലും.’
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘പ്രോത്സാഹിപ്പിക്കുക’ അല്ലെങ്കിൽ ‘നിർബന്ധപൂർവം പ്രേരിപ്പിക്കുക.’
    reason: lexical_alternative
lexical_decisions:
- source_word: κήρυξον
  choice: പ്രസംഗിക്കുക
  rationale: പൊതുവായി വിളിച്ചറിയിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ആജ്ഞാരൂപം. ഈ ശുശ്രൂഷാസന്ദർഭത്തിൽ ‘പ്രസംഗിക്കുക’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: τὸν λόγον
  choice: വചനം
  rationale: തിമൊഥെയൊസ് അറിയിക്കേണ്ട അപ്പൊസ്തോലിക സന്ദേശത്തെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്. ‘സുവിശേഷം’ എന്നോ ‘തിരുവെഴുത്ത്’ എന്നോ പരിധി ചുരുക്കാതെ മൂലപാഠത്തിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: ἐπίστηθι
  choice: സന്നദ്ധനായിരിക്കുക
  rationale: സന്നിഹിതനും പ്രവർത്തിക്കാൻ ഒരുക്കമുള്ളവനുമായിരിക്കുക എന്ന പ്രായോഗിക ബലം നൽകുന്നു. അടിയന്തരമായി നിർബന്ധിക്കുക എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: εὐκαίρως ἀκαίρως
  choice: സമയം അനുകൂലമായാലും അല്ലെങ്കിലും
  rationale: സാഹചര്യം യോജിച്ചതായി തോന്നിയാലും തോന്നാതിരുന്നാലും എന്ന വിരുദ്ധജോടിയുടെ അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ἔλεγξον
  choice: തെറ്റ് ബോധ്യപ്പെടുത്തുക
  rationale: തെറ്റ് വെളിപ്പെടുത്തി തിരുത്തലിലേക്കു കൊണ്ടുവരുന്ന ക്രിയയുടെ അർഥം വ്യക്തമാക്കുന്നു; തുടർന്നുള്ള കൂടുതൽ ശക്തമായ ശാസനയിൽനിന്ന് വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: ἐπιτίμησον
  choice: ശാസിക്കുക
  rationale: മുൻക്രിയയെക്കാൾ ശക്തമായ താക്കീതിന്റെ സ്വരം ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: παρακάλεσον
  choice: പ്രബോധിപ്പിക്കുക
  rationale: ഗൗരവത്തോടെ പ്രേരിപ്പിക്കുകയും ഉത്സാഹപ്പെടുത്തുകയും ചെയ്യുന്ന അർഥവ്യാപ്തി ഈ ശുശ്രൂഷാസന്ദർഭത്തിൽ നൽകുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἐν πάσῃ μακροθυμίᾳ
  choice: പൂർണ ക്ഷമയോടെ
  rationale: ആളുകളോടു ദീർഘമായി ക്ഷമ കാണിക്കുന്നതും πάσῃ നൽകുന്ന സമഗ്രതയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: καὶ διδαχῇ
  choice: ഉപദേശത്തോടുംകൂടെ
  rationale: തിരുത്തലിനും പ്രബോധനത്തിനും ഒപ്പമുള്ള പഠിപ്പിക്കൽ/ബോധനത്തെ നാമരൂപത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘വചനം’ എന്നതിന്റെ വ്യാപ്തി
  choice: പ്രധാനപാഠത്തിൽ ‘വചനം’ എന്നു തന്നെയാക്കി.
  alternative: ‘സന്ദേശം’, ‘സുവിശേഷം’, അല്ലെങ്കിൽ ‘തിരുവെഴുത്ത്’
  rationale: സമീപസന്ദർഭം തിരുവെഴുത്തിൽ വേരൂന്നിയ അപ്പൊസ്തോലിക പ്രഖ്യാപനത്തെക്കുറിച്ചാണെങ്കിലും λόγος ഇവിടെ അതിലൊന്നായി വ്യക്തമായി പരിമിതപ്പെടുത്തിയിട്ടില്ല. അതിനാൽ മൂലപാഠത്തിന്റെ വിശാലതയും ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ആജ്ഞാശൈലി. ഗ്രീക്കിലെ തുടർച്ചയായ ആജ്ഞകളുടെ വേഗവും ശക്തിയും ചെറുവാക്യങ്ങളിലൂടെ നിലനിർത്തി. [a] ἐπίστηθι-യോടും [b] εὐκαίρως ἀκαίρως-യോടും [c] παρακάλεσον-നോടും ചേർത്ത് അടിക്കുറിപ്പുകൾ കൃത്യമായി സ്ഥാപിച്ചു.
