  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്ക് ഇടിയത്തിന്റെ അക്ഷരാർഥം മുഖ്യവാചകത്തിൽ അടിച്ചേൽപ്പിക്കാതെ അർത്ഥം വ്യക്തമാക്കുകയും അതിനെ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുകയും ചെയ്തു.
