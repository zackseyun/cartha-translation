language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀλέξανδρος ὁ χαλκεὺς πολλά μοι κακὰ ἐνεδείξατο— ⸀ἀποδώσει αὐτῷ ὁ κύριος κατὰ τὰ ἔργα αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/014.yaml
  text: Alexander the metalworker showed me many evils[c][b][a]; the Lord will repay him according to his works.
translation:
  language: ml
  text: ലോഹപ്പണിക്കാരനായ അലക്സാണ്ടർ എനിക്ക് വളരെ ദോഷം ചെയ്തു[a]. കർത്താവ് അവന്റെ പ്രവൃത്തികൾക്കനുസരിച്ച് അവന് തിരിച്ചുനൽകും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: ‘എന്നോട് അനേകം തിന്മകൾ കാണിച്ചു.’'
    reason: lexical_alternative
  - marker: b
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ, ‘കർത്താവ് അവന്റെ പ്രവൃത്തികൾക്കനുസരിച്ച് അവന് തിരിച്ചുനൽകട്ടെ’ എന്നു വായിക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: χαλκεὺς
  choice: ലോഹപ്പണിക്കാരൻ
  rationale: പദം ചെമ്പ്/വെങ്കലം ഉൾപ്പെടെയുള്ള ലോഹത്തിൽ പണിയെടുക്കുന്നയാളെ സൂചിപ്പിക്കാം. ഏതു ലോഹമെന്ന് മൂലപാഠം കൃത്യമായി നിർണയിക്കാത്തതിനാൽ ‘ലോഹപ്പണിക്കാരൻ’ അനാവശ്യമായ അതിസൂക്ഷ്മത ഒഴിവാക്കുന്നു.
- source_word: πολλά μοι κακὰ ἐνεδείξατο
  choice: എനിക്ക് വളരെ ദോഷം ചെയ്തു
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർത്ഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു. അക്ഷരാർഥത്തിനടുത്ത ‘എന്നോട് അനേകം തിന്മകൾ കാണിച്ചു’ എന്നത് മലയാളത്തിൽ അസ്വാഭാവികവും അർത്ഥം മങ്ങിയതുമാണ്.
- source_word: ἀποδώσει
  choice: പ്രതിഫലം നൽകും
  rationale: ഭാവികാല നിർദേശരൂപത്തിന്റെ ഉറപ്പ് നിലനിർത്തുകയും പ്രവൃത്തിക്ക് തക്ക തിരിച്ചുനൽകൽ എന്ന ന്യായവിധിസംബന്ധമായ ആശയം അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: ὁ κύριος
  choice: കർത്താവ്
  rationale: നിശ്ചിതനായ ‘കർത്താവ്’ എന്ന അർത്ഥം മലയാളത്തിലെ പതിവും ഗൗരവമുള്ളതുമായ രൂപത്തിൽ നൽകുന്നു.
- source_word: κατὰ τὰ ἔργα αὐτοῦ
  choice: അവന്റെ പ്രവൃത്തികൾക്കനുസരിച്ച്
  rationale: പ്രവൃത്തികളെ അടിസ്ഥാനമാക്കിയുള്ള പ്രതിഫലത്തിന്റെ ആശയം പദസാമീപ്യത്തോടെയും വ്യക്തതയോടെയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἀποδώσει എന്നത് ഭാവികാല പ്രസ്താവനയോ പ്രാർഥന/ആശംസയോ എന്ന ചോദ്യം
  choice: കർത്താവ് ... പ്രതിഫലം നൽകും
  alternative: കർത്താവ് ... പ്രതിഫലം നൽകട്ടെ
  rationale: SBLGNT മുഖ്യപാഠത്തിലെ ἀποδώσει ഭാവികാല നിർദേശരൂപമാണ്; അതിനാൽ മുഖ്യവാചകം ദൈവിക പ്രതിഫലത്തെക്കുറിച്ചുള്ള പ്രസ്താവനയായി വിവർത്തനം ചെയ്യുന്നു. ചില കൈയെഴുത്തുപ്രതികളിലെ പ്രാർഥനാരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
