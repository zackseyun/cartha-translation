id: 2TI.4.1
reference: 2 Timothy 4:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀Διαμαρτύρομαι ἐνώπιον τοῦ θεοῦ καὶ ⸂Χριστοῦ Ἰησοῦ⸃, τοῦ μέλλοντος κρίνειν ζῶντας καὶ νεκρούς, ⸀καὶ τὴν ἐπιφάνειαν αὐτοῦ καὶ τὴν βασιλείαν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/001.yaml
  text: 'I solemnly charge you before God and Messiah Jesus[a], who is about to judge the living and the dead[b], and by his appearing and his kingdom:'
translation:
  language: ml
  text: 'ദൈവത്തിന്റെയും ജീവനുള്ളവരെയും മരിച്ചവരെയും ന്യായംവിധിക്കാനിരിക്കുന്നവനായ[a] മശീഹയായ യേശുവിന്റെയും സന്നിധിയിൽ, അവന്റെ പ്രത്യക്ഷതയെയും അവന്റെ രാജ്യത്തെയും മുൻനിർത്തി[b], ഞാൻ നിന്നോട് ഗൗരവപൂർവം ആജ്ഞാപിക്കുന്നു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ജീവനുള്ളവരെയും മരിച്ചവരെയും ന്യായംവിധിക്കുന്നവനായ.” μέλλω എന്ന ഗ്രീക്ക് ക്രിയയെ സന്ദർഭാനുസരണം ലളിതമായ ഭാവികാലസൂചനയായി ഗ്രഹിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, “അവന്റെ പ്രത്യക്ഷതയും അവന്റെ രാജ്യവും.” ഇവ ആജ്ഞയുടെ അടിസ്ഥാനമാണെന്ന ബന്ധം ഗ്രീക്കിൽ കൂടുതൽ പരോക്ഷമാണ്.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: Διαμαρτύρομαι
  choice: ഞാൻ നിന്നോട് ഗൗരവമായി ആജ്ഞാപിക്കുന്നു
  rationale: ഈ നിയോഗസന്ദർഭത്തിൽ ക്രിയയ്ക്ക് വെറും സാക്ഷ്യപ്പെടുത്തലിനെക്കാൾ ശക്തമായ, ഔപചാരികവും ഗൗരവമുള്ളതുമായ ആജ്ഞയുടെ ഭാവമുണ്ട്. ഗ്രീക്കിൽ പരോക്ഷമായി മനസ്സിലാകുന്ന കർമ്മം മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി ‘നിന്നോട്’ എന്നു വ്യക്തമാക്കിയിരിക്കുന്നു.
- source_word: ἐνώπιον
  choice: സന്നിധിയിൽ
  rationale: ദൈവത്തിന്റെയും മശീഹയായ യേശുവിന്റെയും സാക്ഷാത് സാന്നിധ്യത്തിലും ദൃഷ്ടിയിലും എന്ന ഗൗരവം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: Χριστοῦ Ἰησοῦ
  choice: മശീഹയായ യേശു
  rationale: Χριστός ഇവിടെ പദവിനാമത്തിന്റെ സജീവ അർഥം നിലനിർത്തുന്നതിനാൽ ‘മശീഹ’ എന്നു വിവർത്തനം ചെയ്തു; മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘മശീഹയായ യേശു’ എന്ന രൂപം സ്വീകരിച്ചു.
- source_word: τοῦ μέλλοντος κρίνειν
  choice: ന്യായംവിധിക്കാനിരിക്കുന്നവനായ
  rationale: μέλλω സൂചിപ്പിക്കുന്ന ഭാവികാലസൂചനയും പ്രതീക്ഷിക്കപ്പെടുന്ന സംഭവത്തിന്റെ അടുപ്പവും ലളിതമായ ഭാവികാലമായി ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: ζῶντας καὶ νεκρούς
  choice: ജീവനുള്ളവരെയും മരിച്ചവരെയും
  rationale: രണ്ടു വിഭാഗങ്ങളെയും ഉൾക്കൊള്ളുന്ന ന്യായവിധിയുടെ വ്യാപ്തി നേരിട്ടും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐπιφάνειαν
  choice: പ്രത്യക്ഷത
  rationale: ദൃശ്യമായ വെളിപ്പെടൽ എന്ന അന്ത്യകാലസംബന്ധിയായ ആശയം ‘വരവ്’ എന്ന് വ്യാഖ്യാനിച്ച് പരിമിതപ്പെടുത്താതെ നിലനിർത്തുന്നു.
- source_word: βασιλείαν
  choice: രാജ്യം
  rationale: βασιλείαയുടെ സാധാരണ അർഥവും അന്ത്യകാലസന്ദർഭത്തിലെ വ്യാപ്തിയും നിലനിർത്തുന്ന സ്ഥാപിതമായ പദമാണ്.
- source_word: καὶ τὴν ἐπιφάνειαν αὐτοῦ καὶ τὴν βασιλείαν αὐτοῦ
  choice: അവന്റെ പ്രത്യക്ഷതയെയും അവന്റെ രാജ്യത്തെയും മുൻനിർത്തി
  rationale: പ്രത്യക്ഷതയും രാജ്യവും ഗൗരവമായ ആജ്ഞയുടെ അടിസ്ഥാനമായി വിളിച്ചുപറയുന്നതായി വാക്യഘടന മനസ്സിലാക്കി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ഗ്രീക്കിലെ കൂടുതൽ പരോക്ഷമായ ഏകോപനം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: Χριστός എന്ന പദവിനാമത്തിന്റെ വിവർത്തനം
  choice: മശീഹയായ യേശു
  alternative: ക്രിസ്തുയേശു
  rationale: ഈ ഗൗരവമുള്ള ന്യായവിധിവിവരണത്തിൽ Χριστός എന്ന പദത്തിന്റെ മശീഹാപദവിയുടെ അർഥം സജീവമാണ്; അതിനാൽ അതിനെ വെറും പേരിന്റെ ഭാഗമായി മാത്രം അവതരിപ്പിച്ചില്ല.
- issue: μέλλωയുടെ അന്ത്യകാലസംബന്ധിയായ ശക്തി
  choice: ന്യായംവിധിക്കാനിരിക്കുന്നവനായ
  alternative: ന്യായംവിധിക്കുന്നവനായ / ന്യായംവിധിക്കുവാൻ പോകുന്നവനായ
  rationale: സംഭവം ഭാവിയിൽ പ്രതീക്ഷിക്കപ്പെടുന്നു എന്ന ഗ്രീക്ക് സൂചന നിലനിർത്തുന്നു; എന്നാൽ കൃത്യമായ സമയക്രമം വാക്യത്തിൽ ചേർക്കുന്നില്ല.
- issue: പ്രത്യക്ഷതയും രാജ്യവും ആജ്ഞയുമായി ബന്ധപ്പെടുന്ന വിധം
  choice: മുൻനിർത്തി
  alternative: അവന്റെ പ്രത്യക്ഷതയും അവന്റെ രാജ്യവും എന്നും
  rationale: അക്കൂസറ്റീവ് പദസമുച്ചയങ്ങളെ ഗൗരവമായ അഭ്യർഥനയുടെയോ ആജ്ഞയുടെയോ അടിസ്ഥാനമായി കാണുന്ന വായന മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; ഗ്രീക്ക് വാക്യഘടനയിലെ പരോക്ഷത അടിക്കുറിപ്പിലൂടെ തുറന്നുവെച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. വാക്യത്തിന്റെ ഔപചാരിക നിയോഗഭാവം നിലനിർത്തിയെങ്കിലും ദൈനംദിന വായനക്കാർക്ക് ഗ്രഹിക്കാനാകാത്ത പുരാതന പദക്രമം ഒഴിവാക്കി. ‘പ്രത്യക്ഷത’, ‘മശീഹ’, ‘ന്യായംവിധിക്കുക’ എന്നീ ദൈവശാസ്ത്രപരമായി ആവശ്യമായ പദങ്ങൾ വ്യക്തമായ സന്ദർഭത്തിൽ ഉപയോഗിച്ചു.
