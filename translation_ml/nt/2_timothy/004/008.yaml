  source_fidelity: ‘ഇനി’ എന്നത് λοιπὸν-ന്റെ കാലപരമായ അർത്ഥം സൂചിപ്പിക്കുന്നുവെങ്കിലും, ഈ സന്ദർഭത്തിലെ ‘henceforth/from now on’ എന്ന വ്യക്തമായ മുന്നോട്ടുള്ള കാലസൂചനയ്ക്ക് ‘ഇനിമുതൽ’ കൂടുതൽ കൃത്യമാണ്. ശേഷിക്കുന്ന വാചകം ἀπόκειται, ἀποδώσει, ὁ δίκαιος κριτής, പൂർണ്ണകാല കൃദന്തം ἠγαπηκόσι, ἐπιφάνεια എന്നിവയെ വിശ്വസ്തമായി പ്രതിഫലിപ്പിക്കുന്നു. ‘നീതിയുടെ കിരീടം’ ഗ്രീക്ക് ഷഷ്ഠീവിഭക്തിയുടെ തുറന്ന അർത്ഥബന്ധം അനാവശ്യമായി വ്യാഖ്യാനിക്കാതെ സംരക്ഷിക്കുന്നു.
  naturalness: വാചകം ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും മാന്യവുമാണ്. ‘ഇനിമുതൽ’ എന്ന ചെറിയ ഭേദഗതി തുടക്കത്തെ കൂടുതൽ സ്വാഭാവികവും സന്ദർഭനിഷ്ഠവുമാക്കുന്നു. ‘അവിടുത്തെ പ്രത്യക്ഷതയെ സ്നേഹിച്ച എല്ലാവർക്കും’ എന്ന പ്രയോഗം സ്വാഭാവികമാണ്; ആദരസൂചക സർവനാമവും യോജിച്ചതാണ്.
  terminology: ‘കിരീടം,’ ‘നീതി,’ ‘കർത്താവ്,’ ‘ന്യായാധിപൻ,’ ‘പ്രത്യക്ഷത’ എന്നിവ സ്ഥിരതയുള്ളതും സന്ദർഭോചിതവുമായ പദങ്ങളാണ്. അടിക്കുറിപ്പ് δικαιοσύνηയ്ക്കുള്ള ‘justice’ എന്ന സാധ്യതയെ രേഖപ്പെടുത്തുന്നു; മുഖ്യവാക്യത്തിലെ ‘നീതി’യുമായി അത് ആശയക്കുഴപ്പം സൃഷ്ടിക്കുന്നില്ല.
