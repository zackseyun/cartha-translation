id: 2TI.4.8
reference: 2 Timothy 4:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λοιπὸν ἀπόκειταί μοι ὁ τῆς δικαιοσύνης στέφανος, ὃν ἀποδώσει μοι ὁ κύριος ἐν ἐκείνῃ τῇ ἡμέρᾳ, ὁ δίκαιος κριτής, οὐ μόνον δὲ ἐμοὶ ἀλλὰ καὶ πᾶσιν τοῖς ἠγαπηκόσι τὴν ἐπιφάνειαν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/008.yaml
  text: From now on the crown of righteousness is laid up for me[a], which the Lord, the righteous judge, will award to me on that day—and not only to me, but also to all who have loved his appearing.
translation:
  language: ml
  text: ഇനിമുതൽ നീതിയുടെ കിരീടം എനിക്കായി സൂക്ഷിച്ചുവെച്ചിരിക്കുന്നു[a]. നീതിയുള്ള ന്യായാധിപനായ കർത്താവ് ആ ദിവസം അത് എനിക്കു നൽകും; എനിക്കു മാത്രമല്ല, അവിടുത്തെ പ്രത്യക്ഷതയെ സ്നേഹിച്ച എല്ലാവർക്കും നൽകും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നീതിയുടെ കിരീടം’ എന്നതിന് ‘ന്യായത്തിന്റെ കിരീടം’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദത്തിന് ‘നീതി’ എന്നും ചില സന്ദർഭങ്ങളിൽ ‘ന്യായം’ എന്നും അർത്ഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: λοιπὸν
  choice: ഇനി
  rationale: മുൻവാക്യത്തിൽ ഓട്ടം പൂർത്തിയാക്കിയെന്ന പ്രസ്താവനയ്ക്കുശേഷം ശേഷിക്കുന്നതിലേക്കാണ് ഈ പദം വിരൽചൂണ്ടുന്നത്; മലയാളത്തിൽ കാലസൂചന സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀπόκειταί
  choice: സൂക്ഷിച്ചുവെച്ചിരിക്കുന്നു
  rationale: ഒരാൾക്കായി മാറ്റിവെച്ചോ കരുതിവെച്ചോ ഉള്ള ഇപ്പോഴത്തെ അവസ്ഥയെ ഈ രൂപം വ്യക്തമാക്കുന്നു.
- source_word: ὁ τῆς δικαιοσύνης στέφανος
  choice: നീതിയുടെ കിരീടം
  rationale: ഗ്രീക്കിലെ ഷഷ്ഠീവിഭക്തിബന്ധം അതേപടി നിലനിർത്തി, നീതിക്കുള്ള പ്രതിഫലമാണോ നീതി തന്നെയാകുന്ന കിരീടമാണോ നീതീകരണവുമായി ബന്ധപ്പെട്ട കിരീടമാണോ എന്ന് അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: δικαιοσύνης
  choice: നീതി
  rationale: δικαιοσύνηയുടെ ധാർമിക ശരിതനിമയും ന്യായസംബന്ധമായ അർത്ഥസാധ്യതയും ഉൾക്കൊള്ളാൻ കഴിയുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: ἀποδώσει
  choice: നൽകും
  rationale: അർഹമായത് നൽകുക എന്ന ആശയം വ്യക്തമാക്കുകയും വിജയകിരീടത്തിന്റെ സന്ദർഭത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: ὁ κύριος
  choice: കർത്താവ്
  rationale: κύριος എന്ന പദത്തിന്റെ സ്ഥാപിതവും മാന്യവുമായ മലയാളപരിഭാഷ; കൂടുതൽ വിശദീകരണം മുഖ്യവാക്യത്തിലേക്ക് ചേർക്കുന്നില്ല.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: ആ ദിവസം
  rationale: അന്ത്യകാല ന്യായവിധിദിവസത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: ὁ δίκαιος κριτής
  choice: നീതിയുള്ള ന്യായാധിപൻ
  rationale: കർത്താവിന്റെ ന്യായവിധിയുടെ നീതിയുക്ത സ്വഭാവം വ്യക്തമാക്കുന്ന വിശേഷണപ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: πᾶσιν τοῖς ἠγαπηκόσι
  choice: സ്നേഹിച്ച എല്ലാവർക്കും
  rationale: പൂർണ്ണകാല കൃദന്തരൂപം ഇന്നോളം നിലനിന്ന സ്നേഹമനോഭാവത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഭൂതകാലരൂപം ആ വശം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: τὴν ἐπιφάνειαν αὐτοῦ
  choice: അവിടുത്തെ പ്രത്യക്ഷത
  rationale: ἐπιφάνεια എന്നതിന്റെ വെളിവാകൽ/കാണപ്പെടൽ എന്ന ആശയം നേരിട്ട് നൽകുന്നു; αὐτοῦ എന്ന സർവനാമത്തെ കർത്താവിനോടുള്ള ആദരസൂചകമായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘നീതിയുടെ കിരീടം’ എന്നതിന്റെ അർത്ഥം
  choice: ഷഷ്ഠീവിഭക്തിബന്ധം വ്യാഖ്യാനിച്ച് തീർക്കാതെ ‘നീതിയുടെ കിരീടം’ എന്നു നിലനിർത്തി.
  alternative: നീതിക്കുള്ള പ്രതിഫലമായ കിരീടം; നീതി തന്നെയാകുന്ന കിരീടം; നീതീകരണത്തിന്റെ/ന്യായസ്ഥാപനത്തിന്റെ കിരീടം.
  rationale: ഗ്രീക്ക് ഘടന ഈ സൂക്ഷ്മാർത്ഥങ്ങളിൽ ഒന്നിനെ മാത്രം നിർബന്ധിക്കുന്നില്ല; അതിനാൽ യഥാർത്ഥ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിച്ചു.
- issue: ‘കർത്താവ്’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: മുഖ്യവാക്യത്തിൽ ‘കർത്താവ്’ എന്ന പദം മാത്രം നിലനിർത്തി; സന്ദർഭത്തിൽ അത് യേശുക്രിസ്തുവിലേക്കാണ് ശക്തമായി വിരൽചൂണ്ടുന്നത്.
  alternative: ദൈവത്തെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
  rationale: ‘അവിടുത്തെ പ്രത്യക്ഷത’ എന്ന സമീപപ്രയോഗം പാസ്റ്ററൽ ലേഖനങ്ങളുടെ സന്ദർഭത്തിൽ ക്രിസ്തുവിനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, ഗ്രീക്കിനേക്കാൾ വിശദമായ വ്യാഖ്യാനം മുഖ്യവാക്യത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘ന്യായാധിപൻ’, ‘പ്രത്യക്ഷത’ എന്നീ പദങ്ങൾ വാക്യത്തിന്റെ ദൈവശാസ്ത്രഗൗരവം നിലനിർത്തുമ്പോഴും അമിതമായ പുരാതനഭാഷ ഒഴിവാക്കുന്നു.
