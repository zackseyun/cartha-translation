id: 2TI.4.10
reference: 2 Timothy 4:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Δημᾶς γάρ με ⸀ἐγκατέλιπεν ἀγαπήσας τὸν νῦν αἰῶνα, καὶ ἐπορεύθη εἰς Θεσσαλονίκην, Κρήσκης εἰς Γαλατίαν, Τίτος εἰς Δαλματίαν·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/010.yaml
  text: For Demas deserted me[a], having loved the present age, and went to Thessalonica; Crescens to Galatia, Titus to Dalmatia.
translation:
  language: ml
  text: എന്തെന്നാൽ, ദേമാസ് ഇപ്പോഴത്തെ യുഗത്തെ സ്നേഹിച്ച് എന്നെ ഉപേക്ഷിച്ചു; അവൻ തെസ്സലോനീക്യയിലേക്കു പോയി[a]. ക്രേസ്കെസ് ഗലാത്യയിലേക്കും തീത്തോസ് ദൽമാത്യയിലേക്കും പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഇപ്പോഴത്തെ ലോകത്തെ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ഇപ്പോഴത്തെ യുഗത്തെയോ കാലഘട്ടത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγκατέλιπεν
  choice: ഉപേക്ഷിച്ച്
  rationale: സന്ദർഭത്തിലെ ഗൗരവവും പ്രതികൂലമായ ധാർമിക സൂചനയും നിലനിർത്തുന്നു; എന്നാൽ ദേമാസ് വിശ്വാസം പൂർണമായി ത്യജിച്ചുവെന്ന് പാഠത്തിനപ്പുറം പ്രസ്താവിക്കുന്നില്ല.
- source_word: ἀγαπήσας
  choice: സ്നേഹിച്ച്
  rationale: ഗ്രീക്ക് ഭൂതകാല പങ്കാളിക്രിയയുടെ രൂപവും ദേമാസിന്റെ സ്നേഹവും ഉപേക്ഷിക്കലും തമ്മിലുള്ള ബന്ധവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; ബന്ധം നിർബന്ധമായി കാരണാർഥത്തിൽ മാത്രം തീർപ്പാക്കുന്നില്ല.
- source_word: τὸν νῦν αἰῶνα
  choice: ഈ ഇപ്പോഴത്തെ യുഗത്തെ
  rationale: αἰών എന്നതിന്റെ കാലഘട്ടസംബന്ധമായ അർഥം സംരക്ഷിക്കുകയും ഭൗതിക ലോകം എന്ന ആശയത്തിലേക്ക് ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐπορεύθη
  choice: പോയി
  rationale: ലക്ഷ്യസ്ഥാനങ്ങളിലേക്കുള്ള സഞ്ചാരം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ലളിതമായി അറിയിക്കുന്നു.
- source_word: γάρ
  choice: വാക്യത്തിന്റെ വിശദീകരണബന്ധത്തിലൂടെ പരോക്ഷമായി പ്രകടിപ്പിച്ചു
  rationale: മുൻവാക്യത്തോടുള്ള വിശദീകരണബന്ധം മലയാളത്തിലെ സ്വാഭാവിക പ്രവാഹത്തിൽ നിലനിൽക്കുന്നു; നിർബന്ധിതമായ ‘എന്തെന്നാൽ’ ഒഴിവാക്കി.
- source_word: Θεσσαλονίκην
  choice: തെസ്സലോനീക്യ
  rationale: ഗ്രീക്ക് സ്ഥലനാമത്തോട് ചേർന്ന, മലയാള ബൈബിൾ വായനക്കാർക്ക് തിരിച്ചറിയാവുന്ന ലിപ്യന്തരണം.
- source_word: Κρήσκης
  choice: ക്രെസ്കെസ്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ നേരിട്ടുള്ള മലയാള ലിപ്യന്തരണം.
- source_word: Γαλατίαν
  choice: ഗലാത്യ
  rationale: ഗ്രീക്ക് പ്രദേശനാമത്തിന്റെ പതിവായ മലയാള രൂപം.
- source_word: Τίτος
  choice: തീത്തോസ്
  rationale: ഗ്രീക്ക് ഉച്ചാരണത്തോട് അടുത്ത വ്യക്തിനാമരൂപം.
- source_word: Δαλματίαν
  choice: ദൽമാത്യ
  rationale: ഗ്രീക്ക് പ്രദേശനാമത്തിന്റെ സ്വാഭാവിക മലയാള ലിപ്യന്തരണം.
theological_decisions:
- issue: ദേമാസിന്റെ പുറപ്പെടൽ വിശ്വാസത്യാഗമായി വ്യക്തമാക്കണമോ, പൗലോസിനെ ഉപേക്ഷിച്ചതായി മാത്രം പരിഭാഷപ്പെടുത്തണമോ
  choice: ‘എന്നെ ഉപേക്ഷിച്ച്’ എന്ന് പരിഭാഷപ്പെടുത്തി, പ്രവൃത്തിയുടെ പ്രതികൂലത നിലനിർത്തി; അന്തിമ വിശ്വാസത്യാഗം തുറന്നുപറഞ്ഞില്ല.
  alternative: ‘വിശ്വാസം ഉപേക്ഷിച്ചു’ എന്നതുപോലെ വിശ്വാസത്യാഗം വ്യക്തമായി സൂചിപ്പിക്കുക.
  rationale: ദേമാസ് ഇപ്പോഴത്തെ യുഗത്തെ സ്നേഹിച്ച് പൗലോസിനെ ഉപേക്ഷിച്ചുവെന്നാണ് പാഠം നേരിട്ട് പറയുന്നത്; അവൻ അന്തിമമായി വിശ്വാസം ത്യജിച്ചുവെന്ന് വാക്യം വ്യക്തമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. പേരുകൾ ഗ്രീക്ക് രൂപങ്ങളോട് അടുത്തതായി ലിപ്യന്തരിച്ചു. അവസാനത്തെ രണ്ടു ഉപവാക്യങ്ങളിൽ ഗ്രീക്കിൽ ‘പോയി’ ആവർത്തിക്കാത്തതെങ്കിലും മലയാളത്തിലെ വ്യക്തതയ്ക്കായി ഒരിക്കൽ ചേർത്തു.
