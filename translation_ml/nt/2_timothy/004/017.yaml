id: 2TI.4.17
reference: 2 Timothy 4:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ κύριός μοι παρέστη καὶ ἐνεδυνάμωσέν με, ἵνα δι’ ἐμοῦ τὸ κήρυγμα πληροφορηθῇ καὶ ⸀ἀκούσωσιν πάντα τὰ ἔθνη, καὶ ἐρρύσθην ἐκ στόματος λέοντος.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/017.yaml
  text: But the Lord stood by me and strengthened me[a], so that through me the proclamation might be fully accomplished and all the Gentiles might hear[b], and I was rescued from the lion’s mouth.
translation:
  language: ml
  text: എന്നാൽ കർത്താവ് എന്റെ അരികിൽ നിന്നു എന്നെ ശക്തിപ്പെടുത്തി; എന്നിലൂടെ പ്രഘോഷണം പൂർണമായി നിർവഹിക്കപ്പെടാനും എല്ലാ ജനതകളും[a] അതു കേൾക്കാനുംവേണ്ടി. സിംഹത്തിന്റെ വായിൽനിന്ന്[b] ഞാൻ രക്ഷിക്കപ്പെടുകയും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘എല്ലാ ജനതകളും’ എന്നതിന് ‘യഹൂദേതരരെല്ലാം’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ ἔθνη എന്ന പദത്തിന് ‘ജനതകൾ’ എന്നും ‘യഹൂദേതരർ’ എന്നും അർഥമാകാം; ഇവിടെ യഹൂദേതര ജനങ്ങൾ പ്രഘോഷണം കേൾക്കുന്നതായിരിക്കാം പ്രധാന ഉദ്ദേശ്യം.
    reason: lexical_alternative
  - marker: b
    text: ‘സിംഹത്തിന്റെ വായിൽനിന്ന്’ എന്നത് അക്ഷരാർഥത്തിൽ ഒരു സിംഹത്തെ സൂചിപ്പിക്കുന്നതിനു പകരം, മാരകമായ അപകടത്തിൽനിന്നുള്ള വിടുതലിനെ സൂചിപ്പിക്കുന്ന രൂപകപ്രയോഗമായിരിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ κύριός
  choice: എന്നാൽ കർത്താവ്
  rationale: δέ മുൻവാക്യത്തോടുള്ള വൈരുധ്യം സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ എന്നു നൽകി; κύριος എന്നത് ആരെയാണു സൂചിപ്പിക്കുന്നതെന്ന് കൂടുതൽ വ്യക്തമാക്കാതെ ‘കർത്താവ്’ എന്നു നിലനിർത്തി.
- source_word: μοι παρέστη
  choice: എന്റെ അരികിൽ നിന്നു
  rationale: വെറും സ്ഥലസാന്നിധ്യമല്ല, പിന്തുണയ്ക്കുന്ന വ്യക്തിപരമായ സാന്നിധ്യമാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്.
- source_word: ἐνεδυνάμωσέν με
  choice: എന്നെ ശക്തിപ്പെടുത്തി
  rationale: ἐνδυναμόω എന്നതിന്റെ ശക്തി നൽകുക/ബലപ്പെടുത്തുക എന്ന അർഥം സ്വാഭാവികമായി പകരുന്നു.
- source_word: ἵνα δι’ ἐμοῦ
  choice: അങ്ങനെ എന്നിലൂടെ
  rationale: ἵναയുടെ ഉദ്ദേശ്യ-ഫലഭാവവും διάയുടെ മാധ്യമാർഥവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: τὸ κήρυγμα πληροφορηθῇ
  choice: സുവിശേഷപ്രഘോഷണം പൂർണമായി നിർവഹിക്കപ്പെടുകയും
  rationale: κήρυγμα ഇവിടെ പ്രഖ്യാപിക്കപ്പെട്ട സുവിശേഷസന്ദേശത്തെയും അതിന്റെ പ്രഘോഷണത്തെയും സൂചിപ്പിക്കുന്നു; πληροφορηθῇ എന്നതിലെ പൂർണത/സമ്പൂർണ നിർവഹണം എന്ന വിശാലത ചുരുക്കാതെ നൽകിയിരിക്കുന്നു.
- source_word: ἀκούσωσιν πάντα τὰ ἔθνη
  choice: എല്ലാ ജനതകളും അതു കേൾക്കുകയും ചെയ്തു
  rationale: ἔθνη എന്ന പദത്തിന്റെ ‘ജനതകൾ’/‘ജാതികൾ’ എന്ന സ്വാഭാവിക അർഥം നിലനിർത്തുന്നു; പ്രസക്തിയിൽ യഹൂദേതര ജനങ്ങളിലേക്കുള്ള വ്യാപ്തിയും ഉൾക്കൊള്ളാം. ‘അതു’ എന്നത് പ്രഘോഷണത്തെ സ്വാഭാവികമായി തിരിച്ചുചൂണ്ടുന്നു.
- source_word: ἐρρύσθην
  choice: ഞാൻ രക്ഷിക്കപ്പെടുകയും ചെയ്തു
  rationale: അപകടത്തിൽനിന്നുള്ള വിടുതൽ എന്ന ῥύομαιയുടെ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: ἐκ στόματος λέοντος
  choice: സിംഹത്തിന്റെ വായിൽനിന്ന്
  rationale: ഇത് അക്ഷരാർഥമോ രൂപകാലങ്കാരമോ എന്ന് തീർപ്പാക്കാതെ മൂലത്തിലെ ദൃശ്യരൂപം അതേപടി സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: κύριος എന്നതിന്റെ നിർദ്ദിഷ്ട സൂചിതൻ
  choice: ‘കർത്താവ്’ എന്നു മാത്രം പരിഭാഷപ്പെടുത്തി.
  alternative: പ്രത്യേകിച്ച് യേശു; അല്ലെങ്കിൽ പൊതുവായി ദൈവം.
  rationale: സന്ദർഭത്തിൽ ഉയിർത്തെഴുന്നേറ്റ യേശുവിനെ ഉദ്ദേശിച്ചതായി മനസ്സിലാക്കാനാകുമെങ്കിലും, മൂലവാക്യം തന്നെ നൽകാത്ത വിശദീകരണം പാഠത്തിൽ ചേർക്കാതെ അവ്യക്തത നിലനിർത്തുന്നു.
- issue: ‘സിംഹത്തിന്റെ വായിൽനിന്ന്’ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: മൂലത്തിലെ ദൃശ്യപ്രയോഗം നേരിട്ട് നിലനിർത്തി.
  alternative: നീറോയെ സൂചിപ്പിക്കുന്ന രൂപകം; സാത്താനെ സൂചിപ്പിക്കുന്ന രൂപകം; മൃഗങ്ങളാൽ വധിക്കപ്പെടുന്നതിനെക്കുറിച്ചുള്ള അക്ഷരാർഥ പരാമർശം; പൊതുവായി മാരകാപകടത്തിന്റെ രൂപകം.
  rationale: പല വ്യാഖ്യാനങ്ങൾ സാധ്യമാണ്; വാക്യം അവയിൽ ഒന്നിനെയും നിർണായകമായി വ്യക്തമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘സുവിശേഷപ്രഘോഷണം’ സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു; എന്നാൽ വ്യാഖ്യാനപരമായ അനിശ്ചിതത്വങ്ങൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
