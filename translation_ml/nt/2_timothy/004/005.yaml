- from: എന്നാൽ നീയോ, എല്ലാ കാര്യങ്ങളിലും മനസ്സിന്റെ തെളിമ നിലനിർത്തുക[a]; കഷ്ടത സഹിക്കുക[b]; സുവിശേഷകന്റെ ജോലി ചെയ്യുക; നിന്റെ ശുശ്രൂഷ പൂർണമായി നിർവഹിക്കുക[c].
