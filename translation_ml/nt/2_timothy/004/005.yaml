id: 2TI.4.5
reference: 2 Timothy 4:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: σὺ δὲ νῆφε ἐν πᾶσιν, κακοπάθησον, ἔργον ποίησον εὐαγγελιστοῦ, τὴν διακονίαν σου πληροφόρησον.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/005.yaml
  text: But as for you[a], keep a clear head in all things, endure hardship, do the work of an evangelist[c][b], fully carry out your ministry.
translation:
  language: ml
  text: എന്നാൽ നീയോ, എല്ലാറ്റിലും സുബോധമുള്ളവനായിരിക്കുക[a]; കഷ്ടത സഹിക്കുക[b]; സുവിശേഷപ്രഘോഷകന്റെ പ്രവൃത്തി ചെയ്യുക; നിന്റെ ശുശ്രൂഷ പൂർണമായി നിർവഹിക്കുക[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എല്ലാറ്റിലും ജാഗ്രതയോടെയും സമചിത്തതയോടെയും ഇരിക്കുക.’ ഗ്രീക്ക് ക്രിയയുടെ വാച്യാർഥം ‘ലഹരിയില്ലാതിരിക്കുക’ എന്നാണെങ്കിലും, പുതിയനിയമത്തിൽ അത് മനസ്സിന്റെ തെളിമ, ആത്മനിയന്ത്രണം, സമ്മർദത്തിനിടയിലെ സ്ഥിരത എന്നിവയെ സൂചിപ്പിക്കുന്ന രൂപകപ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘കഷ്ടം അനുഭവിക്കുക.’
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘നിന്റെ ശുശ്രൂഷ പൂർത്തിയാക്കുക.’ ഗ്രീക്ക് ക്രിയ അതിനെ പൂർണമായി നിർവഹിച്ച് പൂർത്തിയിലെത്തിക്കുക എന്ന ആശയം നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ δὲ
  choice: എന്നാൽ നീയോ
  rationale: δέ സൂചിപ്പിക്കുന്ന മുൻവാക്യങ്ങളോടുള്ള വൈരുധ്യവും σὺ എന്ന സർവനാമത്തിന്റെ ഊന്നലും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: νῆφε
  choice: മനസ്സിന്റെ തെളിമ നിലനിർത്തുക
  rationale: വാച്യാർഥത്തിൽ മദ്യലഹരിയില്ലാതിരിക്കുക എന്ന അർഥമുള്ള νήφω പുതിയനിയമത്തിൽ ഇവിടെ മാനസിക ജാഗ്രത, ആത്മനിയന്ത്രണം, സമ്മർദത്തിനിടയിലെ സ്ഥിരത എന്നിവ സൂചിപ്പിക്കുന്ന രൂപകാലങ്കാരപ്രയോഗമാണ്. മലയാളത്തിൽ മദ്യവർജനം മാത്രം ധ്വനിപ്പിക്കാതെ ആ പ്രായോഗിക അർഥം വ്യക്തമാക്കുന്നു.
- source_word: ἐν πᾶσιν
  choice: എല്ലാ കാര്യങ്ങളിലും
  rationale: ഗ്രീക്കിലെ സമഗ്രത നിലനിർത്തുന്നു; അത് സാഹചര്യങ്ങളെയോ അവസരങ്ങളെയോ മാത്രം സൂചിപ്പിക്കുന്നു എന്ന് അനാവശ്യമായി പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: κακοπάθησον
  choice: കഷ്ടത സഹിക്കുക
  rationale: കഷ്ടാനുഭവം ഏറ്റുവാങ്ങുന്നതും അതിൽ ഉറച്ചുനിൽക്കുന്നതും ഉൾക്കൊള്ളുന്ന സംക്ഷിപ്തവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: ἔργον ποίησον
  choice: ജോലി ചെയ്യുക
  rationale: സാധാരണ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: εὐαγγελιστοῦ
  choice: സുവിശേഷകന്റെ
  rationale: സുവിശേഷം അറിയിക്കുന്ന ഒരാളെ സൂചിപ്പിക്കുന്ന, മലയാള ക്രൈസ്തവ പ്രയോഗത്തിൽ സുപരിചിതമായ പദം; പ്രത്യേക സഭാപദവിയാണെന്ന് അധികമായി നിർവചിക്കുന്നില്ല.
- source_word: τὴν διακονίαν σου
  choice: നിന്റെ ശുശ്രൂഷ
  rationale: പൊതുവായ സേവനം എന്ന അർഥസാധ്യത നിലനിൽക്കുന്നുവെങ്കിലും, തിമോത്തിയൊസിനെ ഏല്പിച്ച സുവിശേഷപ്രവർത്തനവും ഇടയചുമതലയും എന്ന സന്ദർഭത്തിന് ‘ശുശ്രൂഷ’ യോജിക്കുന്നു.
- source_word: πληροφόρησον
  choice: പൂർണമായി നിർവഹിക്കുക
  rationale: ഏല്പിക്കപ്പെട്ട ശുശ്രൂഷയെ അതിന്റെ പൂർണതയിലെത്തിക്കുകയോ മുഴുവനായി നിറവേറ്റുകയോ ചെയ്യുക എന്ന ക്രിയയുടെ ശക്തി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: διακονία എന്ന പദത്തിലെ ചുമതലയുടെ സ്വഭാവം
  choice: ശുശ്രൂഷ
  alternative: സേവനം
  rationale: ഉടൻമുമ്പും ശേഷവും പറയുന്നത് തിമോത്തിയൊസിനെ ഏല്പിച്ച സുവിശേഷപ്രഘോഷണവും ഇടയചുമതലയും ആയതിനാൽ ‘ശുശ്രൂഷ’ സന്ദർഭോചിതമാണ്. ഇതിനെ ഏതെങ്കിലും പ്രത്യേക സഭാപദവിയായി പരിമിതപ്പെടുത്തുന്നില്ല.
- issue: εὐαγγελιστής ഒരു ഔദ്യോഗിക പദവിയാണോ പ്രവർത്തനവിവരണമാണോ
  choice: സുവിശേഷകൻ
  alternative: സുവിശേഷം അറിയിക്കുന്നവൻ
  rationale: ഗ്രീക്ക് നാമത്തിന്റെ സ്വാഭാവിക തുല്യപദം ഉപയോഗിച്ചു; ഇത് നിർബന്ധമായും ഔദ്യോഗിക സഭാപദവിയെ സൂചിപ്പിക്കുന്നു എന്ന് വിവർത്തനം തീരുമാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ആജ്ഞകളുടെ നേരിട്ടുള്ള ഭാവവും പൗലോസിന്റെ വ്യക്തിപരമായ ഊന്നലും നിലനിർത്തി. അർധവിരാമങ്ങൾ തുടർച്ചയായ നാല് നിർദേശങ്ങളെ വ്യക്തമായി വേർതിരിക്കുന്നു.
