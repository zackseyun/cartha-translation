    text: ഗ്രീക്കിൽ ‘പ്രിസ്ക’; മറ്റിടങ്ങളിൽ അവളെ ‘പ്രിസ്കില്ല’ എന്നും വിളിക്കുന്നു (ഉദാഹരണത്തിന്, അപ്പൊസ്തലപ്രവൃത്തികൾ 18:2, 18, 26).
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄσπασαι
  choice: അഭിവാദ്യം ചെയ്യുക
  rationale: ἀσπάζομαι എന്ന ക്രിയയുടെ ആജ്ഞാർഥം നേരിട്ട് നിലനിർത്തുന്നു; മൂലത്തിൽ വ്യക്തമല്ലാത്ത അധിക ഊഷ്മളത ചേർക്കാതെ കത്തുകളിലെ അഭിവാദനത്തിന്റെ സ്വാഭാവിക അർഥം നൽകുന്നു.
- source_word: Πρίσκαν
  choice: പ്രിസ്ക
  rationale: ഗ്രീക്ക് പാഠത്തിലെ Πρίσκαν എന്ന ഔപചാരിക നാമരൂപത്തിന്റെ നേരിട്ടുള്ള മലയാള ലിപ്യന്തരണം; മറ്റിടങ്ങളിൽ കാണുന്ന ‘പ്രിസ്കില്ല’ എന്ന രൂപം മുഖ്യപാഠത്തിലേക്ക് പകരുന്നില്ല.
- source_word: Ἀκύλαν
  choice: അക്വില
  rationale: Ἀκύλας എന്ന വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ സ്വാഭാവിക ലിപ്യന്തരണം.
- source_word: τὸν Ὀνησιφόρου οἶκον
  choice: ഒനേസിഫൊരൊസിന്റെ കുടുംബാംഗങ്ങൾ
  rationale: οἶκος ഇവിടെ കെട്ടിടത്തെയല്ല, ആ വീട്ടുമായി ബന്ധപ്പെട്ട ആളുകളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘കുടുംബാംഗങ്ങൾ’ എന്നത് രക്തബന്ധുക്കളിൽ മാത്രം നിർബന്ധമായി ചുരുക്കാതെ അഭിവാദനത്തിന്റെ സാമൂഹിക അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആജ്ഞാരൂപം ഉപയോഗിച്ചു. വ്യക്തിനാമങ്ങൾ ഗ്രീക്ക് ഉച്ചാരണത്തോട് അടുത്ത് ലിപ്യന്തരിച്ചു; οἶκος എന്നതിന്റെ വ്യക്തികളെ സൂചിപ്പിക്കുന്ന അർഥം സ്വാഭാവികമാക്കാൻ ‘കുടുംബാംഗങ്ങൾ’ തെരഞ്ഞെടുത്തു.
