  text: Greet Prisca and Aquila[a], and the household of Onesiphorus.
translation:
  language: ml
  text: പ്രിസ്കയെ[a]യും അക്വിലയെയും ഒനേസിഫൊരൊസിന്റെ വീട്ടുകാരെയും അഭിവാദ്യം ചെയ്യുക.
  philosophy: optimal-equivalence
