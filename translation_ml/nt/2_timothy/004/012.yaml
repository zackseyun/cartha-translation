id: 2TI.4.12
reference: 2 Timothy 4:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τυχικὸν δὲ ἀπέστειλα εἰς Ἔφεσον.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/012.yaml
  text: But I sent Tychicus to Ephesus[a].
translation:
  language: ml
  text: എന്നാൽ തിഹിക്കൊസിനെ ഞാൻ എഫെസൊസിലേക്ക് അയച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തിഹിക്കൊസിനെ ഞാൻ എഫെസൊസിലേക്ക് അയച്ചു’ എന്നോ ‘ഇപ്പോൾ തിഹിക്കൊസിനെ ഞാൻ എഫെസൊസിലേക്ക് അയച്ചു’ എന്നോ വിവർത്തനം ചെയ്യാം; ഗ്രീക്കിലെ δέ എന്ന ബന്ധകം ലളിതമായ തുടർച്ചയെയോ നേരിയ വ്യത്യാസത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τυχικὸν
  choice: തിഹിക്കൊസിനെ
  rationale: കർമകാരകത്തിലുള്ള വ്യക്തിനാമം; മലയാള ബൈബിൾനാമങ്ങളുടെ പ്രചാരത്തിലുള്ള ലിപ്യന്തരണരീതിയോട് ചേർന്ന് രൂപപ്പെടുത്തി.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിൽനിന്നുള്ള നേരിയ വ്യത്യാസമോ വിഷയമാറ്റമോ സൂചിപ്പിക്കുന്ന മൃദുവായ ബന്ധകം; ഗ്രീക്കിലെ അർത്ഥസാധ്യത മുഴുവൻ ഒറ്റ വിവർത്തനത്തിൽ തീർപ്പാക്കാതിരിക്കാൻ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകി.
- source_word: ἀπέστειλα
  choice: ഞാൻ ... അയച്ചു
  rationale: ἀποστέλλω എന്ന ക്രിയയുടെ ഒന്നാംപുരുഷ ഏകവചന ഏറിസ്റ്റ് സജീവ നിർദ്ദേശകരൂപം; മലയാളത്തിൽ സ്വാഭാവികമായ ഭൂതകാലപ്രയോഗം.
- source_word: εἰς
  choice: -ലേക്ക്
  rationale: നഗരത്തെ ലക്ഷ്യസ്ഥാനമായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള ദിശാവിഭക്തി.
- source_word: Ἔφεσον
  choice: എഫെസൊസ്
  rationale: സ്ഥലനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകി; ദിശാവിഭക്തിയോടൊപ്പം ‘എഫെസൊസിലേക്ക്’ എന്ന രൂപം വരുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഗ്രീക്ക് വാക്യക്രമം കർശനമായി പകർത്താതെ മലയാളത്തിൽ സ്വാഭാവികമായ ക്രമം സ്വീകരിച്ചു; δέയിലെ വ്യവഹാരപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
