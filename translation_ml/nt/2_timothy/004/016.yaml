id: 2TI.4.16
reference: 2 Timothy 4:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐν τῇ πρώτῃ μου ἀπολογίᾳ οὐδείς μοι ⸀παρεγένετο, ἀλλὰ πάντες με ⸀ἐγκατέλιπον— μὴ αὐτοῖς λογισθείη—
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/016.yaml
  text: At my first defense no one stood with me[a], but all deserted me[c][b]. May it not be counted against them.
translation:
  language: ml
  text: എന്റെ ആദ്യ പ്രതിവാദത്തിൽ[a] എന്നെ പിന്തുണയ്ക്കാൻ ആരും ഹാജരായില്ല[b]; എല്ലാവരും എന്നെ ഉപേക്ഷിച്ചു. അത് അവർക്കെതിരെ കണക്കാക്കപ്പെടാതിരിക്കട്ടെ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘എന്റെ ആദ്യ വിചാരണാവേളയിൽ’ അല്ലെങ്കിൽ ‘എന്റെ ആദ്യ നിയമപരമായ പ്രതിവാദത്തിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ അക്ഷരാർഥം ‘എന്നോടൊപ്പം സന്നിഹിതനാകാൻ ആരും വന്നില്ല’; പൗലോസിനെ പിന്തുണയ്ക്കാൻ ആരും ഹാജരായില്ല എന്നതാണ് സന്ദർഭത്തിലെ ആശയം.
    reason: lexical_alternative
  - marker: c
    text: ‘അത് അവരുടെമേൽ ചുമത്തപ്പെടാതിരിക്കട്ടെ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολογίᾳ
  choice: പ്രതിവാദവേളയിൽ
  rationale: ന്യായാധികാരികളുടെ മുമ്പാകെയുള്ള ഔപചാരിക പ്രതിവാദത്തെയാണ് ഈ പദം ഇവിടെ സൂചിപ്പിക്കുന്നത്. ‘പ്രതിവാദവേളയിൽ’ എന്നത് നിയമപരമായ ആശയം നിലനിർത്തുന്നതോടൊപ്പം മലയാളത്തിൽ സ്വാഭാവികവുമാണ്.
- source_word: πρώτῃ
  choice: ആദ്യ
  rationale: പ്രതിവാദത്തിന്റെ ആദ്യ ഘട്ടത്തെയോ ആദ്യ അവസരത്തെയോ നേരിട്ട് സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിലെ സാധ്യതാപരമായ അവ്യക്തത നിലനിർത്തുന്നു.
- source_word: οὐδείς μοι παρεγένετο
  choice: എന്നെ പിന്തുണയ്ക്കാൻ ആരും ഹാജരായില്ല
  rationale: παρεγένετο എന്നതിന് അക്ഷരാർഥത്തിൽ ‘സന്നിഹിതനാകാൻ വന്നു’ എന്നാണെങ്കിലും, ഈ നിയമസന്ദർഭത്തിൽ പൗലോസിനെ പിന്തുണച്ച് ഹാജരാകുക എന്നതാണ് ആശയം.
- source_word: ἐγκατέλιπον
  choice: ഉപേക്ഷിച്ചു
  rationale: അപകടകരമായ സാഹചര്യത്തിൽ ഒരാളെ തനിച്ചാക്കി പോകുന്നതിനെ സൂചിപ്പിക്കുന്ന, ആധുനികവും ഗൗരവമുള്ളതുമായ പ്രയോഗം.
- source_word: μὴ αὐτοῖς λογισθείη
  choice: അത് അവർക്കെതിരെ കണക്കാക്കപ്പെടാതിരിക്കട്ടെ
  rationale: μή ചേർന്ന വിധിലിംഗരൂപം ഒരു ആശംസയോ പ്രാർഥനയോ പ്രകടിപ്പിക്കുന്നു. ‘കണക്കാക്കപ്പെടുക’ എന്നത് ഗ്രീക്കിലെ കണക്കെടുപ്പ്/ന്യായവിധി രൂപകം സംരക്ഷിക്കുന്നു; ‘അത്’ എന്നത് അവർ ഉപേക്ഷിച്ച പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: പൗലോസിനെ ഉപേക്ഷിച്ചവരെക്കുറിച്ചുള്ള അവസാന വാക്യത്തിന്റെ ഭാവം
  choice: 'അവരുടെ കുറ്റമായി അത് കണക്കാക്കപ്പെടരുതെന്ന പ്രാർഥനാസദൃശമായ ആശംസ: ‘അത് അവർക്കെതിരെ കണക്കാക്കപ്പെടാതിരിക്കട്ടെ.’'
  alternative: ‘അത് അവരുടെമേൽ ചുമത്തപ്പെടാതിരിക്കട്ടെ’ അല്ലെങ്കിൽ അനുമതിസൂചകമായി ‘അത് അവർക്കെതിരെ കണക്കാക്കരുത്.’
  rationale: λογισθείη എന്ന വിധിലിംഗരൂപം ഒരു പ്രസ്താവനയേക്കാൾ ആശംസയെയോ പ്രാർഥനയെയോ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു. ക്ഷമയുടെ ധ്വനി നിലനിർത്തുമ്പോഴും ഗ്രീക്ക് പറയുന്നതിലധികമായ പ്രത്യേക സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. നിയമസന്ദർഭം വ്യക്തമാക്കിയെങ്കിലും ‘ആദ്യ’ എന്നത് വിചാരണയുടെ ഘട്ടമാണോ വേറൊരു അവസരമാണോ എന്ന മൂലപാഠത്തിലെ അവ്യക്തത അടിക്കുറിപ്പിലൂടെ നിലനിർത്തി. ക്ഷമാസദൃശമായ അവസാന ആശംസയെ സിദ്ധാന്തപരമായി വികസിപ്പിച്ചിട്ടില്ല.
