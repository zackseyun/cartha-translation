id: 2TI.4.18
reference: 2 Timothy 4:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ῥύσεταί με ὁ κύριος ἀπὸ παντὸς ἔργου πονηροῦ καὶ σώσει εἰς τὴν βασιλείαν αὐτοῦ τὴν ἐπουράνιον· ᾧ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων, ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/018.yaml
  text: The Lord will rescue me from every evil deed and will bring me safely into his heavenly kingdom[a]. To him be the glory forever and ever[c][b]. Amen.
translation:
  language: ml
  text: കർത്താവ് എല്ലാ ദുഷ്പ്രവൃത്തികളിൽനിന്നും എന്നെ വിടുവിക്കുകയും തന്റെ സ്വർഗീയരാജ്യത്തിലേക്ക് എന്നെ സുരക്ഷിതമായി എത്തിക്കുകയും ചെയ്യും[a]. അവിടുത്തേക്കു എന്നെന്നേക്കും മഹത്വം ഉണ്ടായിരിക്കട്ടെ[b]. ആമേൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തന്റെ സ്വർഗീയരാജ്യത്തിലേക്ക് എന്നെ രക്ഷിച്ചെത്തിക്കുകയും ചെയ്യും.’
    reason: σώσει εἰς എന്ന പ്രയോഗത്തിൽ രക്ഷയും ലക്ഷ്യത്തിലേക്കുള്ള പ്രവേശനവും ഒന്നിച്ചുണ്ട്; മുഖ്യപാഠം സ്വാഭാവിക മലയാളം ഉപയോഗിക്കുമ്പോൾ ഈ ബദൽ ആ ഘടന വ്യക്തമാക്കുന്നു.
  - marker: b
    text: 'അക്ഷരാർഥം: ‘യുഗങ്ങളുടെ യുഗങ്ങളിലേക്ക്.’'
    reason: ഗ്രീക്ക് കാലപ്രയോഗത്തിന്റെ അക്ഷരാർഥരൂപം നൽകുന്നു.
lexical_decisions:
- source_word: ῥύσεταί
  choice: വിടുവിക്കുകയും ചെയ്യും
  rationale: ῥύομαι അപകടത്തിൽനിന്നോ ദോഷത്തിൽനിന്നോ രക്ഷിച്ചു വിടുവിക്കുക എന്ന അർഥം നൽകുന്നു. ‘വിടുവിക്കുക’ ആ അർഥം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀπὸ παντὸς ἔργου πονηροῦ
  choice: എല്ലാ ദുഷ്പ്രവൃത്തിയിൽനിന്നും
  rationale: ἔργον പ്രവൃത്തി/ചെയ്തി എന്നും πονηρός ദുഷ്ടമായ/തിന്മയായ എന്നും അർഥമാക്കുന്നു. ‘എല്ലാ ദുഷ്പ്രവൃത്തിയിൽനിന്നും’ ഏകവചന-സമാഹാര ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: σώσει εἰς
  choice: സുരക്ഷിതമായി എത്തിക്കുകയും ചെയ്യും
  rationale: σῴζω രക്ഷിക്കുക/സംരക്ഷിക്കുക എന്ന അർഥം വഹിക്കുമ്പോൾ εἰς ലക്ഷ്യത്തിലേക്കുള്ള പ്രവേശനം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ അസ്വാഭാവികമായ ‘രാജ്യത്തിലേക്ക് രക്ഷിക്കും’ എന്നതിനു പകരം, രക്ഷയുടെയും അന്തിമ പ്രവേശനത്തിന്റെയും ആശയം ‘സുരക്ഷിതമായി എത്തിക്കും’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: εἰς τὴν βασιλείαν αὐτοῦ τὴν ἐπουράνιον
  choice: തന്റെ സ്വർഗീയരാജ്യത്തിലേക്ക്
  rationale: εἰς ലക്ഷ്യത്തിലേക്കോ അതിനുള്ളിലേക്കോ ഉള്ള ചലനം സൂചിപ്പിക്കുന്നു; ἐπουράνιον ‘സ്വർഗീയ’ എന്നാണ്. ‘തന്റെ’ എന്നത് αὐτοῦ കർത്താവിനെ സൂചിപ്പിക്കുന്നതായി വ്യക്തമാക്കുന്നു.
- source_word: κύριος
  choice: കർത്താവ്
  rationale: κύριος എന്നതിന്റെ പതിവായ ഭക്തിപൂർവവും അധികാരസൂചകവുമായ മലയാള സമാനപദം.
- source_word: ᾧ ἡ δόξα
  choice: അവിടത്തേക്ക് ... മഹത്ത്വം ഉണ്ടാകട്ടെ
  rationale: ഇത് മഹത്ത്വം അർപ്പിക്കുന്ന സ്തുതിവാക്യമാണ്. ദാതൃവിഭക്തിയായ ᾧ-ന്റെ ‘അവന്’ എന്ന അർഥം ആദരസൂചകമായി ‘അവിടത്തേക്ക്’ എന്നു നൽകി.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: എന്നെന്നേക്കും
  rationale: അക്ഷരാർഥത്തിൽ ‘യുഗങ്ങളുടെ യുഗങ്ങളിലേക്ക്’; അനന്തകാല ദൈർഘ്യം സ്വാഭാവിക മലയാളത്തിൽ ‘എന്നെന്നേക്കും’ നൽകുന്നു.
- source_word: ἀμήν
  choice: ആമേൻ
  rationale: സഭാപരവും പൊതുവായി അംഗീകരിക്കപ്പെട്ടതുമായ മലയാള ലിപ്യന്തരണം.
theological_decisions:
- issue: ഇപ്പോഴത്തെ വിടുതലും അന്തിമ രക്ഷയും തമ്മിലുള്ള ബന്ധം
  choice: ദുഷ്പ്രവൃത്തിയിൽനിന്നുള്ള കർത്താവിന്റെ വിടുതലിനെയും സ്വർഗീയരാജ്യത്തിലേക്കുള്ള അന്തിമവും സുരക്ഷിതവുമായ പ്രവേശനത്തെയും വേർതിരിച്ചെങ്കിലും ബന്ധപ്പെടുത്തി അവതരിപ്പിച്ചു.
  alternative: പൗലോസ് ശാരീരികമരണത്തിൽനിന്ന് നിർബന്ധമായും രക്ഷിക്കപ്പെടും എന്നോ, ഇവിടെ ആത്മീയ രക്ഷ മാത്രം ഉദ്ദേശിക്കുന്നു എന്നോ വ്യാഖ്യാനിച്ച് പരിഭാഷപ്പെടുത്തുക.
  rationale: ῥύσεταί, σώσει എന്നീ ക്രിയകളും ‘സ്വർഗീയരാജ്യത്തിലേക്ക്’ എന്ന ലക്ഷ്യപ്രയോഗവും ദൈവിക സംരക്ഷണത്തെയും അന്തിമ പ്രവേശനത്തെയും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു. പരിഭാഷ പൗലോസിന് താൽക്കാലിക ശാരീരിക വിടുതൽ ഉറപ്പുനൽകുന്നില്ല; അതേസമയം രക്ഷയുടെ ദൈവശാസ്ത്രപരമായ ഭാരം നഷ്ടപ്പെടുത്തുന്നുമില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവും ആരാധനാസൗഹൃദവുമായ ശൈലി. ‘സ്വർഗീയരാജ്യം’, ‘മഹത്ത്വം’, ‘ആമേൻ’ തുടങ്ങിയ പരിചിതമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തി; അസ്വാഭാവികമായ പദാനുപദ ഘടന ഒഴിവാക്കി.
