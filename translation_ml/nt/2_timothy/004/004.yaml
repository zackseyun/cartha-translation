revisions:
- from: അവർ സത്യത്തിൽനിന്ന് തങ്ങളുടെ കേൾവി[a] തിരിച്ചുകളയുകയും കെട്ടുകഥകളിലേക്കു[b] വഴിതെറ്റിപ്പോകുകയും ചെയ്യും.
  to: അവർ സത്യത്തിൽനിന്ന് തങ്ങളുടെ കേൾവി[a] തിരിച്ചുവിടുകയും കെട്ടുകഥകളിലേക്കു[b] വഴിമാറുകയും ചെയ്യും.
  rationale: 'The revision makes the Malayalam idiomatic while preserving the Greek contrast: they actively turn their hearing away from the truth and subsequently turn aside toward myths. It avoids importing the stronger interpretive notion of being lost or deceived.'
