  text: καὶ ἀπὸ μὲν τῆς ἀληθείας τὴν ἀκοὴν ἀποστρέψουσιν, ἐπὶ δὲ τοὺς μύθους ἐκτραπήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/004.yaml
  text: and they will turn away their hearing from the truth[b][a], and turn aside to myths.
translation:
  language: ml
  text: അവർ സത്യത്തിൽനിന്ന് തങ്ങളുടെ കേൾവി[a] തിരിച്ചുവിടുകയും കെട്ടുകഥകളിലേക്കു[b] വഴിമാറുകയും ചെയ്യും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തങ്ങളുടെ ചെവി.’ ഗ്രീക്കിൽ ‘തങ്ങളുടെ കേൾവി.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘കൽപ്പിതകഥകളിലേക്ക്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀληθείας
  choice: സത്യം
  rationale: ഗ്രീക്കിലെ നിർദിഷ്ടതയും സന്ദർഭത്തിലെ അംഗീകൃത അപ്പൊസ്തലിക സത്യത്തിന്റെ സൂചനയും നിലനിർത്താൻ വിഭക്തിരൂപത്തിൽ ‘സത്യത്തിൽനിന്ന്’ എന്നു നൽകി.
- source_word: ἀκοὴν
  choice: തങ്ങളുടെ കേൾവി
  rationale: ‘കേൾവി’ എന്നത് കേൾക്കുന്ന പ്രവൃത്തി/ശേഷി എന്ന ഗ്രീക്ക് അർഥം നേരിട്ട് നിലനിർത്തുന്നു; സ്വാഭാവികമായ ‘ചെവി’ എന്ന പ്രയോഗം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: ἀποστρέψουσιν
  choice: തിരിച്ചുകളയും
  rationale: സത്യത്തിൽനിന്ന് മനഃപൂർവം ശ്രദ്ധ മാറ്റുന്ന സജീവവും ദിശാസൂചകവുമായ രൂപകം സംരക്ഷിക്കുന്നു.
- source_word: μύθους
  choice: കെട്ടുകഥകൾ
  rationale: സത്യത്തിനു വിരുദ്ധമായ നിർമിതമോ ഊഹാധിഷ്ഠിതമോ ആയ കഥകൾ എന്ന സന്ദർഭാർഥം സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ἐκτραπήσονται
  choice: വഴിതെറ്റിപ്പോകും
  rationale: മധ്യ/കർമണി രൂപത്തിന്റെ കർത്തൃത്വം അമിതമായി നിർണയിക്കാതെ, മറ്റൊരു ദിശയിലേക്കു തിരിഞ്ഞുപോകുന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀπὸ μὲν ... ἐπὶ δὲ
  choice: …യിൽനിന്ന് …യിലേക്ക്
  rationale: μέν…δέ സൂചിപ്പിക്കുന്ന വൈരുധ്യവും ‘സത്യത്തിൽനിന്ന്’ ‘കെട്ടുകഥകളിലേക്ക്’ എന്ന ദിശാമാറ്റവും വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘സത്യം’ എന്നതിന്റെ സന്ദർഭപരമായ സ്വഭാവം
  choice: സത്യം
  alternative: ശുദ്ധോപദേശം; സുവിശേഷസത്യം
  rationale: സന്ദർഭം അപ്പൊസ്തലിക ഉപദേശത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, മൂലപാഠത്തിലെ വിശാലമായ ἀλήθεια എന്ന പദത്തെ വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ അതിന്റെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തി സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കേൾവി തിരിച്ചുകളയുക’ എന്ന പ്രയോഗം ഗ്രീക്ക് രൂപകം സംരക്ഷിക്കുമ്പോൾ, കൂടുതൽ പതിവായ ‘ചെവി തിരിക്കുക’ അടിക്കുറിപ്പിൽ നൽകുന്നു. രണ്ടു ക്രിയകളുടെയും ഭാവികാലവും സത്യത്തിൽനിന്ന് കെട്ടുകഥകളിലേക്കുള്ള വൈരുധ്യദിശയും വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു.
