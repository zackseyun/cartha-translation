id: 2TI.4.7
reference: 2 Timothy 4:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τὸν ⸂καλὸν ἀγῶνα⸃ ἠγώνισμαι, τὸν δρόμον τετέλεκα, τὴν πίστιν τετήρηκα·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/007.yaml
  text: I have fought the good fight[a], I have finished the race, I have kept the faith.
translation:
  language: ml
  text: നല്ല പോരാട്ടം ഞാൻ പൊരുതിയിരിക്കുന്നു; ഓട്ടം ഞാൻ പൂർത്തിയാക്കിയിരിക്കുന്നു; വിശ്വാസം ഞാൻ കാത്തുസൂക്ഷിച്ചിരിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ വിശ്വസ്തത കാത്തുപോന്നിരിക്കുന്നു,” അല്ലെങ്കിൽ “ഞാൻ വിശ്വസ്തനായി നിലനിന്നിരിക്കുന്നു.” ഗ്രീക്കിലെ τὴν πίστιν എന്നത് ക്രിസ്തീയ വിശ്വാസത്തെ സൂചിപ്പിക്കാം; അതുപോലെ കാത്തുപോന്ന വിശ്വസ്തത എന്ന അർഥവും നൽകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: καλὸν ἀγῶνα
  choice: നല്ല പോരാട്ടം
  rationale: ἀγών പോരാട്ടം, മത്സരം, കഠിനശ്രമം എന്നിവ സൂചിപ്പിക്കാം. ഇവിടെ കായിക-യുദ്ധ രൂപകങ്ങളുടെ ബലം നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ മലയാളമായി ‘പോരാട്ടം’ സ്വീകരിച്ചു; καλός എന്നതിന് ‘നല്ല’ എന്നു നൽകി.
- source_word: ἠγώνισμαι
  choice: ഞാൻ പൊരുതിയിരിക്കുന്നു
  rationale: ἀγωνίζομαι എന്ന ക്രിയയുടെ പൂർണ്ണകാലരൂപം പൂർത്തിയായ പ്രവൃത്തിയെയും അതിന്റെ ഇപ്പോഴത്തെ പ്രസക്തിയെയും സൂചിപ്പിക്കുന്നു. ‘പൊരുതിയിരിക്കുന്നു’ ആ ഭാവവും മൂന്നു വാക്യഘടകങ്ങളിലെ സമാന്തരതയും നിലനിർത്തുന്നു.
- source_word: δρόμον
  choice: ഓട്ടം
  rationale: δρόμος ഓട്ടപ്പന്തയത്തെയോ അതിന്റെ ഗതിപഥത്തെയോ സൂചിപ്പിക്കുന്നു. ആ കായികരൂപകം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്താൻ ‘ഓട്ടം’ ഉപയോഗിച്ചു.
- source_word: τετέλεκα
  choice: ഞാൻ പൂർത്തിയാക്കിയിരിക്കുന്നു
  rationale: τελέωയുടെ പൂർണ്ണകാലം ഉദ്ദേശിച്ച അന്ത്യത്തിലെത്തിച്ചതിനെ സൂചിപ്പിക്കുന്നു. ‘പൂർത്തിയാക്കിയിരിക്കുന്നു’ പൂർത്തീകരണവും നിലനിൽക്കുന്ന ഫലവും പ്രകടമാക്കുന്നു.
- source_word: πίστιν
  choice: വിശ്വാസം
  rationale: πίστις എന്നത് വിശ്വാസത്തെയോ വിശ്വസ്തതയെയോ സൂചിപ്പിക്കാം. നിർദ്ദിഷ്ട ആർട്ടിക്കിൾ ഉണ്ടായിരുന്നാലും മലയാളത്തിൽ ‘വിശ്വാസം’ എന്ന രൂപം ക്രിസ്തീയ വിശ്വാസസത്യത്തെയും വ്യക്തിപരമായ വിശ്വാസനിഷ്ഠയെയും അനാവശ്യമായി വേർതിരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: τετήρηκα
  choice: ഞാൻ കാത്തുസൂക്ഷിച്ചിരിക്കുന്നു
  rationale: τηρέωയ്ക്ക് കാക്കുക, പാലിക്കുക, സംരക്ഷിക്കുക എന്നീ അർഥങ്ങളുണ്ട്. ‘കാത്തുസൂക്ഷിച്ചിരിക്കുന്നു’ സംരക്ഷണത്തിന്റെയും വിശ്വസ്തമായി നിലനിർത്തുന്നതിന്റെയും സൂചനകൾ ഉൾക്കൊള്ളുന്നു.
theological_decisions:
- issue: τὴν πίστιν എന്നതിന്റെ അർഥം
  choice: വിശ്വാസം
  alternative: വിശ്വസ്തത / വിശ്വാസത്തിൽ വിശ്വസ്തനായി നിലനിൽക്കുക
  rationale: സന്ദർഭവും നിർദ്ദിഷ്ട ആർട്ടിക്കിളും ഇത് അപ്പൊസ്തലൻ കാത്തുപോന്ന ക്രിസ്തീയ വിശ്വാസത്തെ സൂചിപ്പിക്കാമെന്നു കാണിക്കുന്നു. എങ്കിലും വ്യക്തിപരമായ വിശ്വസ്തത എന്ന അർഥച്ചായയും സാധുവാണ്. മുഖ്യപാഠത്തിൽ ‘വിശ്വാസം’ നിലനിർത്തി ഈ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ഗ്രീക്കിലെ മൂന്നു സമാന്തര പൂർണ്ണകാല പ്രസ്താവനകൾ മലയാളത്തിലും ഒരേ ഘടനയിൽ നിലനിർത്തി; പോരാട്ടം, ഓട്ടം എന്നീ രൂപകങ്ങൾ നേരിട്ട് സംരക്ഷിച്ചു.
