source:
  edition: SBLGNT
  text: Σπούδασον πρὸ χειμῶνος ἐλθεῖν. Ἀσπάζεταί σε Εὔβουλος καὶ Πούδης καὶ Λίνος καὶ Κλαυδία καὶ οἱ ἀδελφοὶ πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/021.yaml
  text: Make every effort to come before winter. Eubulus sends greetings to you[a], and so do Pudens and Linus and Claudia and all the brothers.
translation:
  language: ml
  text: ശീതകാലത്തിനുമുമ്പ് വരാൻ എല്ലാ ശ്രമവും ചെയ്യുക. യൂബൂലൊസും പൂദെൻസും ലീനൊസും ക്ലൗദിയയും എല്ലാ സഹോദരന്മാരും നിനക്കു വന്ദനം അറിയിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എല്ലാ സഹോദരന്മാരും സഹോദരിമാരും.’ ഗ്രീക്കിൽ ‘സഹോദരന്മാർ’ എന്നാണ്; എന്നാൽ ഈ സന്ദർഭത്തിൽ അത് വിശ്വാസികളുടെ വിശാലസമൂഹത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σπούδασον
  choice: എല്ലാ ശ്രമവും ചെയ്യുക
  rationale: σπουδάζω എന്ന ക്രിയയുടെ ആജ്ഞാരൂപം ഉത്സാഹത്തോടെയും അടിയന്തരതയോടെയും പ്രവർത്തിക്കണമെന്ന ആശയം നൽകുന്നു. ‘എല്ലാ ശ്രമവും ചെയ്യുക’ എന്നത് ഈ രണ്ടും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: πρὸ χειμῶνος
  choice: ശീതകാലത്തിനുമുമ്പ്
  rationale: πρό + ഷഷ്ഠീവിഭക്തി ഒരു കാലഘട്ടത്തിനു മുമ്പുള്ള സമയത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: ἐλθεῖν
  choice: വരാൻ
  rationale: ഈ infinitive Σπούδασον എന്ന ക്രിയയെ പൂർത്തിയാക്കുകയും തിമൊഥെയൊസ് പൗലൊസിന്റെ അടുക്കൽ വരുന്നതിനെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: Ἀσπάζεταί σε
  choice: നിനക്കു വന്ദനം അറിയിക്കുന്നു
  rationale: ലേഖനസന്ദർഭത്തിൽ ἀσπάζομαι അഭിവാദ്യം അയയ്ക്കുക എന്ന അർഥത്തിലാണ്; ‘വന്ദനം അറിയിക്കുന്നു’ മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമാണ്.
- source_word: Εὔβουλος
  choice: യൂബൂലൊസ്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: Πούδης
  choice: പൂദെൻസ്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം.
- source_word: Λίνος
  choice: ലീനൊസ്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: Κλαυδία
  choice: ക്ലൗദിയ
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: οἱ ἀδελφοὶ πάντες
  choice: എല്ലാ സഹോദരന്മാരും
  rationale: മൂലപാഠത്തിലെ ἀδελφοί വ്യാകരണപരമായി പുല്ലിംഗ ബഹുവചനമാണ്. അതിനാൽ പ്രധാന പാഠത്തിൽ ‘സഹോദരന്മാർ’ നിലനിർത്തുന്നു; എന്നാൽ ഈ ലേഖനസന്ദർഭത്തിൽ വിശ്വാസിസമൂഹത്തെ മുഴുവനായി സൂചിപ്പിക്കാനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
theological_decisions:
- issue: സമ്മിശ്രമായിരിക്കാവുന്ന ക്രൈസ്തവസമൂഹത്തെ ἀδελφοί എന്നു വിളിക്കുന്നത്
  choice: എല്ലാ സഹോദരന്മാരും
  alternative: എല്ലാ സഹോദരീസഹോദരന്മാരും; എല്ലാ വിശ്വാസികളും
  rationale: ഗ്രീക്ക് പദത്തിന്റെ വ്യാകരണപരമായ പുല്ലിംഗരൂപം പ്രധാന പാഠത്തിൽ സംരക്ഷിച്ചു. അതേസമയം, പ്രാചീന ക്രൈസ്തവ ലേഖനങ്ങളിലെ പ്രയോഗത്തിൽ ഈ പദം വിശ്വാസികളുടെ വിശാലസമൂഹത്തെയും ഉൾക്കൊള്ളാം; അതിനാൽ ആ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ലേഖനശൈലി സ്വീകരിച്ചു. വ്യക്തിനാമങ്ങൾ ഗ്രീക്ക് ശബ്ദരൂപത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു; മൂലത്തിലെ സംയുക്ത അഭിവാദ്യവാക്യം മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തി.
