source:
  edition: SBLGNT
  text: τὸν φαιλόνην, ὃν ⸀ἀπέλιπον ἐν Τρῳάδι παρὰ Κάρπῳ, ἐρχόμενος φέρε, καὶ τὰ βιβλία, μάλιστα τὰς μεμβράνας.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/013.yaml
  text: When you come[a], bring the cloak that I left in Troas with Carpus, and the books[b], especially the parchments.
translation:
  language: ml
  text: നീ വരുമ്പോൾ, ത്രോവാസിൽ കർപ്പൊസിന്റെ പക്കൽ ഞാൻ വിട്ടുപോന്ന മേലങ്കിയും[b] പുസ്തകങ്ങളും[a]—വിശേഷിച്ച് തോൽപ്പത്രങ്ങളും—കൊണ്ടുവരിക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ചുരുളുകൾ’; ഗ്രീക്ക് പദം എഴുത്തുള്ള ചുരുളുകളെയോ സമാനമായ എഴുത്തുസാമഗ്രികളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘മേലങ്കി’ എന്നത് പുസ്തകങ്ങൾ സൂക്ഷിക്കുന്ന സഞ്ചിയോ പൊതിയോ ആണെന്ന് ചിലർ മനസ്സിലാക്കുന്നു; എന്നാൽ ഗ്രീക്ക് പദത്തിന്റെ സാധാരണ അർഥം പുറംവസ്ത്രം എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: φαιλόνην
  choice: മേലങ്കി
  rationale: ഈ പദത്തിന്റെ സാധാരണ അർഥം ശരീരത്തിനു മുകളിൽ ധരിക്കുന്ന പുറംവസ്ത്രമാണ്. ‘പുസ്തകസഞ്ചി’ എന്ന നിർദേശം ഉണ്ടായിട്ടുണ്ടെങ്കിലും അതിന് ശക്തമായ പദാർഥപിന്തുണയില്ല.
- source_word: ἀπέλιπον
  choice: ഞാൻ വെച്ചിട്ടുപോന്ന
  rationale: അവിടെ വിട്ടുപോന്നുവെന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: παρὰ Κάρπῳ
  choice: കർപ്പൊസിന്റെ പക്കൽ
  rationale: παρά + ദത്തിവ് ഇവിടെ ഒരാളുടെ കൈവശമോ പരിപാലനത്തിലോ എന്ന സ്ഥലബന്ധം സൂചിപ്പിക്കുന്നു.
- source_word: ἐρχόμενος
  choice: നീ വരുമ്പോൾ
  rationale: ആജ്ഞയോടു കാലബന്ധമുള്ള ക്രിയാവിശേഷണീയ പങ്കാളിത്തരൂപത്തെ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: φέρε
  choice: കൊണ്ടുവരിക
  rationale: സാധനങ്ങൾ പൗലൊസിന്റെ അടുക്കലേക്ക് എത്തിക്കണമെന്ന ആജ്ഞ മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: τὰ βιβλία
  choice: പുസ്തകങ്ങൾ
  rationale: βιβλία എഴുത്തുള്ള പുസ്തകങ്ങളെയോ ചുരുളുകളെയോ സൂചിപ്പിക്കാം; പൊതുവായ അർഥത്തിന് ‘പുസ്തകങ്ങൾ’ നിലനിർത്തി ഭൗതികരൂപത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: μάλιστα
  choice: വിശേഷിച്ച്
  rationale: തുടർന്നുവരുന്ന വസ്തുക്കൾക്ക് നൽകുന്ന പ്രത്യേക ഊന്നൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τὰς μεμβράνας
  choice: തോൽപ്പത്രങ്ങൾ
  rationale: എഴുത്തിനായി ഒരുക്കിയ മൃഗത്തോലുകൊണ്ടുള്ള വസ്തുക്കളെയാണ് പദം സൂചിപ്പിക്കുന്നത്; സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന കൃത്യമായ രൂപമാണിത്.
