source:
  edition: SBLGNT
  text: Ἔραστος ἔμεινεν ἐν Κορίνθῳ, Τρόφιμον δὲ ⸀ἀπέλιπον ἐν Μιλήτῳ ἀσθενοῦντα.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/020.yaml
  text: Erastus remained in Corinth[a], but I left Trophimus sick in Miletus.
translation:
  language: ml
  text: 'എരസ്തൊസ് കൊരിന്തിൽ താമസിച്ചു; എന്നാൽ ത്രൊഫിമൊസിനെ രോഗിയായി ഞാൻ മിലേത്തൊസിൽ വിട്ടു.[a]


    [a] അല്ലെങ്കിൽ, “ത്രൊഫിമൊസ് രോഗിയായിരിക്കെ ഞാൻ അവനെ മിലേത്തൊസിൽ വിട്ടു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ത്രൊഫിമൊസ് രോഗിയായിരിക്കെ ഞാൻ അവനെ മിലേത്തൊസിൽ വിട്ടു.”
    reason: ഗ്രീക്കിലെ വർത്തമാന കൃദന്തമായ ἀσθενοῦντα ത്രൊഫിമൊസിന്റെ അവസ്ഥയെ (‘രോഗിയായി’) വിശേഷിപ്പിക്കുന്നു. അതിനെ അവനെ വിട്ട സമയത്തെ സാഹചര്യമായി ‘രോഗിയായിരിക്കെ’ എന്നും സ്വാഭാവികമായി പ്രകടിപ്പിക്കാം.
lexical_decisions:
- source_word: Ἔραστος
  choice: എരസ്തോസ്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം ആധുനിക മലയാളലിപിയിൽ സ്വാഭാവികമായി പകർത്തുന്നു.
- source_word: ἔμεινεν
  choice: താമസിച്ചു
  rationale: ഒരു സ്ഥലത്ത് തുടരുകയോ തങ്ങുകയോ ചെയ്തുവെന്ന യാത്രാവിവരണസന്ദർഭത്തിലെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐν Κορίνθῳ
  choice: കൊരിന്തിൽ
  rationale: നഗരനാമത്തോടുള്ള സ്ഥലസൂചന മലയാളത്തിലെ ‘-യിൽ’ വിഭക്തിയിലൂടെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: Τρόφιμον
  choice: ത്രൊഫിമോസിനെ
  rationale: ഗ്രീക്ക് വ്യക്തിനാമം ലിപ്യന്തരണം ചെയ്ത് വാക്യത്തിലെ കർമസ്ഥാനം ‘-നെ’ ചേർത്ത് വ്യക്തമാക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: രണ്ട് യാത്രാവിവരങ്ങൾക്കിടയിലെ മിതമായ വൈരുധ്യം വ്യക്തമാക്കുന്നു; വെറും ‘ഉം/കൂടാതെ’ എന്നതിനെക്കാൾ സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: ἀπέλιπον
  choice: ഞാൻ … വിട്ടുപോന്നു
  rationale: ഒന്നാംപുരുഷ ഏകവചന ഭൂതകാലക്രിയയുടെ അർഥം നിലനിർത്തുകയും ആ വ്യക്തിയെ ആ സ്ഥലത്ത് പിന്നിൽ വിട്ട് യാത്ര തുടർന്നുവെന്ന ഭാവം സ്വാഭാവികമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: ἐν Μιλήτῳ
  choice: മിലേത്തോസിൽ
  rationale: ഗ്രീക്ക് സ്ഥലനാമത്തിന്റെ ലിപ്യന്തരണത്തോടൊപ്പം സ്ഥലസൂചകമായ ‘-യിൽ’ ഉപയോഗിക്കുന്നു.
- source_word: ἀσθενοῦντα
  choice: അസുഖബാധിതനായി
  rationale: ത്രൊഫിമോസിനെ വിട്ടുപോയ സമയത്തെ രോഗാവസ്ഥ സൂചിപ്പിക്കുന്ന വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ സന്ദർഭാർഥം സംക്ഷിപ്തമായി നൽകുന്നു; പൊതുവായ ‘ബലഹീനനായി’ എന്നതിനെക്കാൾ ഇവിടെ ‘അസുഖബാധിതനായി’ യോജിക്കുന്നു.
