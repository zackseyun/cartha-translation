translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ യാത്രാവിവരണശൈലി സ്വീകരിച്ചു. പരമ്പരാഗതമായി തിരിച്ചറിയാവുന്ന ബൈബിൾ വ്യക്തി-സ്ഥലനാമരൂപങ്ങൾ ഉപയോഗിച്ചെങ്കിലും പഴഞ്ചൻ ക്രിയാരൂപങ്ങൾ ഒഴിവാക്കി. അടിക്കുറിപ്പ് നേരിട്ട് ബാധിക്കുന്ന ‘അസുഖബാധിതനായി … വിട്ടുപോന്നു’ എന്ന ഭാഗത്തിനു ശേഷമാണ് [a] നൽകിയിരിക്കുന്നത്.
