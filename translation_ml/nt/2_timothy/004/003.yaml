id: 2TI.4.3
reference: 2 Timothy 4:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔσται γὰρ καιρὸς ὅτε τῆς ὑγιαινούσης διδασκαλίας οὐκ ἀνέξονται, ἀλλὰ κατὰ τὰς ⸂ἰδίας ἐπιθυμίας⸃ ἑαυτοῖς ἐπισωρεύσουσιν διδασκάλους κνηθόμενοι τὴν ἀκοήν,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/003.yaml
  text: For the time will come when they will not put up with sound teaching[a], but according to their own desires they will heap up teachers for themselves[b], having itching ears.
translation:
  language: ml
  text: എന്തെന്നാൽ, ആരോഗ്യകരമായ പഠിപ്പിക്കൽ[a] സഹിക്കാൻ അവർ തയ്യാറാകാത്ത ഒരു കാലം വരും. പകരം, സ്വന്തം ആഗ്രഹങ്ങൾക്കനുസരിച്ച്, കേൾവിയിൽ ചൊറിച്ചിലുണ്ടായവരായി[b], അവർ തങ്ങൾക്കുവേണ്ടി അധ്യാപകരെ കൂട്ടിക്കൂട്ടിവെക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ആരോഗ്യമുള്ള ഉപദേശം” അഥവാ “ശരിയായ ഉപദേശം.”
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “കേൾവിയിൽ ചൊറിച്ചിലുണ്ടായവരായി.” തങ്ങൾ കേൾക്കാൻ ആഗ്രഹിക്കുന്ന കാര്യങ്ങൾ കേൾക്കാനുള്ള അതിയായ ആഗ്രഹത്തെയാണ് ഈ രൂപകം സൂചിപ്പിക്കുന്നത്.
    reason: idiom_explanation
lexical_decisions:
- source_word: καιρὸς
  choice: ഒരു കാലം
  rationale: വരാനിരിക്കുന്ന ഒരു പ്രത്യേക സമയഘട്ടത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ പ്രവചനപ്രയോഗമാണിത്.
- source_word: ὑγιαινούσης διδασκαλίας
  choice: ആരോഗ്യകരമായ ഉപദേശം
  rationale: ‘ആരോഗ്യമുള്ളത്’ എന്ന മൂലരൂപകവും ശരിയും ഗുണകരവുമായ പഠിപ്പിക്കൽ എന്ന അർഥവും നിലനിർത്തുന്നു.
- source_word: οὐκ ἀνέξονται
  choice: സഹിക്കാത്ത
  rationale: ἀνέχομαι എന്നതിലെ സഹിക്കുക, പൊറുക്കുക എന്ന ആശയം നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: κατὰ τὰς ἰδίας ἐπιθυμίας
  choice: സ്വന്തം ആഗ്രഹങ്ങൾക്കനുസരിച്ച്
  rationale: ἐπιθυμίαιയെ ലൈംഗിക മോഹങ്ങളിലേക്കു ചുരുക്കാതെ സ്വയം നയിക്കുന്ന ആഗ്രഹങ്ങൾ എന്ന വിശാല അർഥത്തിൽ നൽകുന്നു.
- source_word: ἑαυτοῖς ἐπισωρεύσουσιν διδασκάλους
  choice: അവർ തങ്ങൾക്കുവേണ്ടി ഉപദേഷ്ടാക്കളെ കൂമ്പാരമാക്കും
  rationale: പ്രതിഫലന ദാതുവായ ἑαυτοῖς എന്നതും, അധികമായി കൂട്ടിവയ്ക്കുക എന്ന ἐπισωρεύωയുടെ ശക്തമായ ദൃശ്യരൂപകവും സംരക്ഷിക്കുന്നു.
- source_word: κνηθόμενοι τὴν ἀκοήν
  choice: കേൾവിക്ക് ചൊറിച്ചിലുള്ളവരായി
  rationale: കാരണബന്ധം നിർബന്ധമായി ചേർക്കാതെ ഗ്രീക്കിലെ വർത്തമാന മധ്യ കൃദന്തരൂപവും ‘കേൾവി ചൊറിയുക’ എന്ന വിചിത്രവും ശക്തവുമായ രൂപകവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: διδασκαλία എന്ന പദത്തിന്റെ അവതരണം
  choice: ഉപദേശം
  alternative: പഠിപ്പിക്കൽ; സിദ്ധാന്തം
  rationale: സന്ദർഭത്തിലെ വിശ്വാസബോധനത്തെ വ്യക്തമാക്കുമ്പോഴും ഒരു പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ സാങ്കേതിക പദപ്രയോഗം ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: κνηθόμενοι τὴν ἀκοήν എന്നതിന്റെ ബന്ധം
  choice: കേൾവിക്ക് ചൊറിച്ചിലുള്ളവരായി
  alternative: കേൾക്കാൻ കൊതിയുള്ളതിനാൽ; ചെവികൾ ചൊറിയുന്നവരായി
  rationale: കൃദന്തരൂപത്തെ സാഹചര്യവിവരണമായി നിലനിർത്തി, മൂലപാഠത്തിൽ നിർവ്യാജമല്ലാത്ത കാരണാർഥം മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ആരോഗ്യകരമായ ഉപദേശം’, ‘കൂമ്പാരമാക്കും’, ‘കേൾവിക്ക് ചൊറിച്ചിലുള്ളവരായി’ എന്നീ പ്രയോഗങ്ങൾ മൂലപാഠത്തിലെ ആരോഗ്യ-കൂമ്പാരം-ചൊറിച്ചിൽ രൂപകങ്ങൾ ബോധപൂർവം നിലനിർത്തുന്നു.
