  text: Ὁ ⸀κύριος μετὰ τοῦ πνεύματός σου. ἡ χάρις μεθ’ ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/022.yaml
  text: The Lord be with your spirit[a]. Grace be with you all.
translation:
  language: ml
  text: കർത്താവ് നിന്റെ ആത്മാവോടുകൂടെ ഇരിക്കട്ടെ.[a] കൃപ നിങ്ങളെല്ലാവരോടുകൂടെ ഇരിക്കട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഗ്രീക്കിൽ ആദ്യഭാഗം ഏകവചനത്തിലാണ്: ‘നിന്റെ ആത്മാവോടുകൂടെ’; രണ്ടാമത്തെ ഭാഗം ബഹുവചനത്തിലാണ്: ‘നിങ്ങളെല്ലാവരോടുകൂടെ’.'
    reason: ആദ്യ ആശംസയിലെ ഏകവചനത്തിൽനിന്ന് രണ്ടാം ആശംസയിലെ ബഹുവചനത്തിലേക്കുള്ള മാറ്റം വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: κύριος
  choice: കർത്താവ്
  rationale: പൗലോസിന്റെ സമാപനാശംസയുടെ പശ്ചാത്തലത്തിൽ ഉന്നതനായ യേശുവിനെ സൂചിപ്പിക്കുന്ന κύριος എന്ന പദത്തിന് പുതിയനിയമ മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ സമാനപദം.
- source_word: μετὰ
  choice: ഓടുകൂടെ ഇരിക്കട്ടെ
  rationale: ഗ്രീക്കിൽ ക്രിയ വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും ആശംസാരൂപത്തിന്റെ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ ‘ഇരിക്കട്ടെ’ ചേർത്തു; μετά + genitive എന്നതിന്റെ ‘കൂടെ’ എന്ന ബന്ധം നിലനിർത്തി.
- source_word: πνεύματός
  choice: ആത്മാവ്
  rationale: സൂ എന്ന ഏകവചന ഉടമസ്ഥസർവനാമം തിമൊഥെയൊസിന്റെ മാനുഷിക ആത്മാവിനെയാണ് നേരിട്ട് സൂചിപ്പിക്കുന്നത്; അതിനാൽ പരിശുദ്ധാത്മാവ് എന്ന് വ്യാഖ്യാനിച്ചു വികസിപ്പിച്ചില്ല.
- source_word: σου
  choice: നിന്റെ
  rationale: ആദ്യ ആശംസ തിമൊഥെയൊസിനോട് വ്യക്തിപരമായി പറയുന്നതായ ഏകവചനം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: χάρις
  choice: കൃപ
  rationale: പൗലോസിന്റെ സമാപനാശംസകളിലെ ദൈവശാസ്ത്രപരമായ സമൃദ്ധിയുള്ള χάρις എന്ന പദത്തിന് നിലവാരമുള്ള മലയാള സമാനപദം.
- source_word: ὑμῶν
  choice: നിങ്ങളെല്ലാവരോടും
  rationale: രണ്ടാം ആശംസയിലെ ബഹുവചനം വ്യക്തമായി പ്രകടിപ്പിക്കുകയും ആദ്യവാക്യത്തിലെ ഏകവചനത്തിൽനിന്നുള്ള മാറ്റം വായനക്കാരന് മനസ്സിലാക്കാൻ സഹായിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘കർത്താവ്’ എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: പൗലോസിന്റെ സമാപനാശംസയിൽ കർത്താവായ യേശുവിനെ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കുന്നു; എന്നാൽ പാഠത്തിൽ ‘യേശു’ എന്ന് കൂട്ടിച്ചേർക്കുന്നില്ല.
  alternative: ദൈവത്തെ പൊതുവായി സൂചിപ്പിക്കുന്നതായി വായിക്കുക.
  rationale: പൗലോസിന്റെ ലേഖനസമാപനങ്ങളിൽ ‘കർത്താവ്’ സാധാരണയായി യേശുവിനെ സൂചിപ്പിക്കുന്നു. എങ്കിലും ഗ്രീക്ക് κύριος മാത്രമേ പറയുന്നുള്ളൂ; അതിനാൽ പരിഭാഷ ആ പദത്തിന്റെ പരിധി അതിക്രമിക്കുന്നില്ല.
- issue: രണ്ടു വാക്യഭാഗങ്ങൾക്കിടയിലെ വചനമാറ്റം
  choice: ആദ്യഭാഗം തിമൊഥെയൊസിനോട് ഏകവചനത്തിലും രണ്ടാംഭാഗം വിശാലമായ ഒരു കൂട്ടത്തോട് ബഹുവചനത്തിലും ഉള്ള ആശംസയായി നിലനിർത്തി.
  alternative: മലയാളത്തിലെ പൊതുവായ ആദരബഹുവചനം ഉപയോഗിച്ച് രണ്ടു ഭാഗങ്ങളിലെയും സംഖ്യാഭേദം മങ്ങിക്കുക.
  rationale: സൂ എന്ന ഏകവചനവും ὑμῶν എന്ന ബഹുവചനവും തമ്മിലുള്ള വ്യക്തമായ വ്യത്യാസം സാഹിത്യപരമായും വ്യാഖ്യാനപരമായും പ്രസക്തമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘നിന്റെ’ എന്ന ഏകവചനരൂപം മൂലപാഠത്തിലെ സംഖ്യ കാക്കുന്നു; ‘നിങ്ങളെല്ലാവരോടും’ ബഹുവചനം തുറന്നുകാട്ടുന്നു. ആശംസാഭാവം സ്വാഭാവികമാക്കാൻ രണ്ടു വാക്യഭാഗങ്ങളിലും ‘ഇരിക്കട്ടെ’ ഉപയോഗിച്ചു.
