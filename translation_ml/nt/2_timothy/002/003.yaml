source:
  edition: SBLGNT
  text: ⸀συγκακοπάθησον ὡς καλὸς στρατιώτης ⸂Χριστοῦ Ἰησοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/003.yaml
  text: Share in suffering as a good soldier of Messiah Jesus[a][b].
translation:
  language: ml
  text: ക്രിസ്തുയേശുവിന്റെ നല്ല പടയാളിയെപ്പോലെ കഷ്ടതയിൽ പങ്കുചേരുക.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ക്രിസ്തുയേശുവിന്റെ നല്ല പടയാളിയെപ്പോലെ എന്നോടൊപ്പം കഷ്ടം സഹിക്കുക.”
    reason: lexical_alternative
  - marker: b
    text: 'ഗ്രീക്ക്: “ക്രിസ്തുയേശു”; സ്ഥാനപ്പേരിന്റെ അർത്ഥം തുറന്നുകാട്ടി “മശീഹായായ യേശു” എന്നും പരിഭാഷപ്പെടുത്താം.'
    reason: alternative_rendering
lexical_decisions:
- source_word: συγκακοπάθησον
  choice: കഷ്ടതയിൽ പങ്കുചേരുക
  rationale: രണ്ടാംപുരുഷ ഏകവചനത്തിലുള്ള ആജ്ഞാരൂപം. σύν- എന്ന ഉപസർഗം ഒറ്റയ്ക്കു കഷ്ടപ്പെടുന്നതിലുപരി മറ്റുള്ളവരോടൊപ്പം കഷ്ടത അനുഭവിക്കുന്ന പങ്കാളിത്തം സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിൽ ഇവിടെ വ്യക്തമല്ലാത്ത ‘എന്നോടൊപ്പം’ എന്ന കർമം മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: ὡς
  choice: …യെപ്പോലെ
  rationale: തിമൊഥെയൊസ് എങ്ങനെ കഷ്ടതയിൽ പങ്കുചേരണം എന്നു കാണിക്കുന്ന താരതമ്യപ്രയോഗം.
- source_word: καλὸς
  choice: നല്ല
  rationale: പടയാളിയോടു ചേർന്നപ്പോൾ പ്രശംസാർഹമായ ഗുണവും യോഗ്യതയും സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: στρατιώτης
  choice: പടയാളി
  rationale: സാധാരണ സൈനികനെ സൂചിപ്പിക്കുന്ന പദം; പൗലൊസിന്റെ രൂപകപ്രയോഗത്തിനും യോജിക്കുന്നു.
- source_word: Χριστοῦ
  choice: ക്രിസ്തു
  rationale: Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ മലയാളത്തിൽ ഉറച്ചും വ്യാപകമായും ഉപയോഗിക്കുന്ന പരിഭാഷാരൂപം. ‘മശീഹാ’ അർത്ഥം കൂടുതൽ തുറന്നുകാട്ടുന്ന പകരമാണ്.
- source_word: Ἰησοῦ
  choice: യേശു
  rationale: Ἰησοῦς എന്ന വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ പ്രമാണരൂപം; Χριστοῦവിനോടൊപ്പം ഷഷ്ഠിവിഭക്തി അർത്ഥത്തിൽ നൽകിയിരിക്കുന്നു.
theological_decisions:
- issue: Χριστοῦ Ἰησοῦ എന്ന പ്രയോഗത്തിന്റെ പരിഭാഷ
  choice: ക്രിസ്തുയേശു
  alternative: മശീഹായായ യേശു
  rationale: ഇവിടെ Χριστός സ്ഥാനപ്പേരും Ἰησοῦς വ്യക്തിനാമവുമാണ്. മലയാള ക്രൈസ്തവ പ്രയോഗത്തിൽ ‘ക്രിസ്തുയേശു’ സ്വാഭാവികവും അർത്ഥസമ്പന്നവുമാണ്; ‘മശീഹായായ യേശു’ സ്ഥാനപ്പേരിന്റെ അർത്ഥം കൂടുതൽ പ്രകടമാക്കുന്ന പകരവായനയായി അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- issue: συγκακοπάθησον എന്നതിലെ സഹപങ്കാളിത്തം
  choice: കഷ്ടതയിൽ പങ്കുചേരുക
  alternative: എന്നോടൊപ്പം കഷ്ടം സഹിക്കുക
  rationale: σύν- സഹപങ്കാളിത്തം സൂചിപ്പിച്ചാലും ഈ വാക്യത്തിൽ ‘എന്നോടൊപ്പം’ എന്നത് തുറന്നുപറയുന്നില്ല. അതിനാൽ മുഖ്യവാചകം അവ്യക്തത നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ പൗലൊസിനോടൊപ്പമെന്ന ധാരണ സാധ്യമായതിനാൽ പകരം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ആജ്ഞയുടെ നേരിട്ടുള്ള ശക്തിയും സൈനികരൂപകവും നിലനിർത്തി. ‘പങ്കുചേരുക’ സഹകഷ്ടാനുഭവത്തിന്റെ ആശയം സ്വാഭാവികമായി നൽകുന്നു; അടിക്കുറിപ്പ് പകരവായനകളും ക്രിസ്തു/മശീഹാ വ്യത്യാസവും വ്യക്തമാക്കുന്നു.
