id: 2TI.2.4
reference: 2 Timothy 2:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐδεὶς στρατευόμενος ἐμπλέκεται ταῖς τοῦ βίου πραγματείαις, ἵνα τῷ στρατολογήσαντι ἀρέσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/004.yaml
  text: No one serving as a soldier gets entangled in the affairs of ordinary life[a], so that he may please the one who enlisted him.
translation:
  language: ml
  text: സൈനികസേവനത്തിൽ ഏർപ്പെട്ടിരിക്കുന്ന ആരും ജീവിതത്തിലെ സാധാരണ കാര്യങ്ങളിൽ കുരുങ്ങുന്നില്ല; തന്നെ സൈന്യത്തിൽ ചേർത്തവനെ പ്രസാദിപ്പിക്കേണ്ടതിനായാണ് അവൻ അങ്ങനെ ചെയ്യുന്നത്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδεὶς
  choice: ആരും … ഇല്ല
  rationale: സാർവത്രികമായ നിഷേധാർഥം സ്വാഭാവികമായ മലയാള നിഷേധഘടനയിൽ പ്രകടമാക്കുന്നു.
- source_word: στρατευόμενος
  choice: സൈനികസേവനത്തിലിരിക്കുന്ന
  rationale: സൈനികസേവനത്തിൽ തുടർന്നും ഏർപ്പെട്ടിരിക്കുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്ന വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ ഭാവം നിലനിർത്തുന്നു.
- source_word: ἐμπλέκεται
  choice: കുരുങ്ങിപ്പോകുന്നില്ല
  rationale: പ്രവർത്തനസ്വാതന്ത്ര്യത്തെ തടസ്സപ്പെടുത്തുന്ന വിധത്തിൽ കുടുങ്ങുക എന്ന സജീവമായ രൂപകം സംരക്ഷിക്കുന്നു.
- source_word: ταῖς τοῦ βίου πραγματείαις
  choice: സാധാരണ ജീവിതത്തിലെ കാര്യങ്ങളിൽ
  rationale: πραγματεία സൂചിപ്പിക്കുന്ന ഇടപാടുകൾ/കാര്യങ്ങളും βίος സൂചിപ്പിക്കുന്ന ദൈനംദിന ജീവിതവും സൈനികസേവനത്തോടുള്ള വൈരുധ്യത്തിൽ ലളിതമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἵνα
  choice: … പ്രസാദിപ്പിക്കാനാണ്
  rationale: വാക്യത്തിലെ ഉദ്ദേശ്യബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τῷ στρατολογήσαντι
  choice: തന്നെ സൈന്യത്തിൽ ചേർത്തവനെ
  rationale: ഗ്രീക്കിലെ ‘സൈന്യത്തിൽ ചേർത്ത വ്യക്തി’ എന്ന അർഥം നിലനിർത്തുന്നു; മൂലത്തിൽ ഇല്ലാത്ത പ്രത്യേക സൈനികപദവിയൊന്നും ചേർക്കുന്നില്ല.
- source_word: ἀρέσῃ
  choice: പ്രസാദിപ്പിക്കാൻ
  rationale: ἵναയോടു ചേർന്ന ഉദ്ദേശ്യാർഥം നിലനിർത്തിക്കൊണ്ട്, ആ വ്യക്തിയുടെ അംഗീകാരം നേടുക/അയാളെ സന്തോഷിപ്പിക്കുക എന്ന അർഥം നൽകുന്നു.
theological_decisions:
- issue: സൈനികരൂപകത്തിന്റെ വ്യാപ്തി
  choice: സൈനികൻ സാധാരണ ജീവിതകാര്യങ്ങളിൽ കുരുങ്ങാതെ തന്നെ സൈന്യത്തിൽ ചേർത്തവനെ പ്രസാദിപ്പിക്കുന്നതായി രൂപകം നേരിട്ട് നിലനിർത്തി.
  alternative: ശുശ്രൂഷയിലെ മുൻഗണനകളെക്കുറിച്ചുള്ള പൊതുവായ പ്രബോധനമായി രൂപകത്തെ നേരിട്ട് വ്യാഖ്യാനിക്കുക.
  rationale: വിവർത്തനം രൂപകത്തിന്റെ പ്രയോഗം മുൻകൂട്ടി നിർണയിക്കാതെ, പൗലൊസ് ഉപയോഗിച്ച സൈനികചിത്രവും അതിലെ ഉദ്ദേശ്യബന്ധവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘സൈനികസേവനം,’ ‘കുരുങ്ങിപ്പോകുക’ എന്നീ പ്രയോഗങ്ങൾ മൂലത്തിലെ സൈനികചിത്രവും സജീവമായ രൂപകവും സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നിലനിർത്തുന്നു.
