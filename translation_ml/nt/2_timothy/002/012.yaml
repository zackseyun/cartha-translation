id: 2TI.2.12
reference: 2 Timothy 2:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ ὑπομένομεν, καὶ συμβασιλεύσομεν· εἰ ⸀ἀρνησόμεθα, κἀκεῖνος ἀρνήσεται ἡμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/012.yaml
  text: If we endure[a], we will also reign with him; if we deny him, he also will deny us.
translation:
  language: ml
  text: നാം സഹിച്ചുനിൽക്കുന്നെങ്കിൽ, അവനോടൊപ്പം വാഴുകയും ചെയ്യും; നാം അവനെ തള്ളിപ്പറയുന്നെങ്കിൽ[a], അവനും നമ്മെ തള്ളിപ്പറയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നാം അവനെ നിഷേധിച്ചാൽ, അവനും നമ്മെ നിഷേധിക്കും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομένομεν
  choice: സഹിച്ചുനിൽക്കുന്നെങ്കിൽ
  rationale: ὑπομένω ഇവിടെ കഷ്ടതയിലോ പരീക്ഷയിലോ ഉറച്ചുനിന്ന് സഹിക്കുക എന്ന അർഥം നൽകുന്നു. ‘സഹിച്ചുനിൽക്കുക’ ആ സജീവവും തുടർച്ചയുള്ളതുമായ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: συμβασιλεύσομεν
  choice: അവനോടൊപ്പം വാഴുകയും ചെയ്യും
  rationale: സംയുക്തക്രിയയുടെ അർഥം ‘ഒരുമിച്ച് രാജാവായി വാഴുക’ എന്നാണ്. സന്ദർഭത്തിൽ കൂടെ വാഴുന്നത് ക്രിസ്തുവിനോടൊപ്പമാണെന്നതിനാൽ ‘അവനോടൊപ്പം’ ചേർത്തു; ‘വാഴുക’ രാജകീയ ഭാവം നിലനിർത്തുന്നു.
- source_word: ἀρνησόμεθα
  choice: അവനെ തള്ളിപ്പറയുന്നെങ്കിൽ
  rationale: ἀρνέομαι എന്നതിന് നിഷേധിക്കുക, തള്ളിപ്പറയുക, ബന്ധം അംഗീകരിക്കാതിരിക്കുക എന്നീ അർഥങ്ങളുണ്ട്. വ്യക്തിയെ ലക്ഷ്യമാക്കിയുള്ള ശക്തമായ നിരാകരണം ‘തള്ളിപ്പറയുക’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ഗ്രീക്കിൽ സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്ന ‘അവനെ’ മലയാളത്തിൽ വ്യക്തമാക്കി.
- source_word: κἀκεῖνος
  choice: അവനും
  rationale: καὶ ἐκεῖνος എന്നതിന്റെ സങ്കുചിതരൂപമായ κἀκεῖνος പരസ്പരപ്രതികരണത്തെ സൂചിപ്പിക്കുന്നു. ‘അവനും’ സമാന്തരതയും തിരിച്ചുള്ള പ്രതികരണവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἀρνήσεται ἡμᾶς
  choice: നമ്മെ തള്ളിപ്പറയും
  rationale: മുൻ ഉപവാക്യത്തിലെ അതേ ἀρνέομαι ക്രിയ ആവർത്തിക്കുന്നതിനാൽ ‘തള്ളിപ്പറയുക’ തന്നെയായി നിലനിർത്തി. ഇതിലൂടെ മുന്നറിയിപ്പിന്റെ ഉദ്ദേശ്യപൂർവമായ വാചകസമാന്തരത സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: രണ്ടാമത്തെ സോപാധിക ഉപവാക്യത്തിലെ മുന്നറിയിപ്പിന്റെ സ്വഭാവം
  choice: ‘നാം അവനെ തള്ളിപ്പറയുന്നെങ്കിൽ, അവനും നമ്മെ തള്ളിപ്പറയും’ എന്ന യഥാർഥവും ഗൗരവമുള്ളതുമായ മുന്നറിയിപ്പായി നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: ഇത് അന്തിമവിധിയെയല്ല, പ്രതിഫലം നഷ്ടപ്പെടുന്നതിനെ മാത്രം സൂചിപ്പിക്കുന്നു എന്നോ; യാഥാർഥ്യസാധ്യതയില്ലാത്ത സാങ്കൽപ്പിക നിബന്ധന മാത്രമാണെന്നോ വ്യാഖ്യാനിക്കുക.
  rationale: ഗ്രീക്ക് പാഠം സമാന്തരമായ സോപാധിക വാക്യങ്ങളിലൂടെ മുന്നറിയിപ്പ് അവതരിപ്പിക്കുന്നു. വിശ്വാസത്യാഗം, വിശ്വാസത്തിൽ നിലനിൽപ്പ്, പ്രതിഫലം എന്നിവയെക്കുറിച്ചുള്ള തർക്കങ്ങളിൽ ഒന്നിനെ പരിഭാഷയിലൂടെ തീർപ്പാക്കാതെ, പാഠത്തിന്റെ ഗൗരവവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ഓർമ്മയിൽ നിൽക്കുന്ന ചൊല്ലിന്റെ സമാന്തരഘടനയും ആവർത്തനവും സംരക്ഷിച്ചു. ഇംഗ്ലീഷ് ഉപദേശകപാഠത്തിൽ [a] അടയാളം ആദ്യ ഉപവാക്യത്തിനു പിന്നാലെയാണെങ്കിലും അതിലെ അടിക്കുറിപ്പ് ἀρνέομαι എന്ന ക്രിയയുടെ അർഥവികൽപത്തെക്കുറിച്ചായതിനാൽ, മലയാളത്തിൽ പ്രസക്തമായ ‘തള്ളിപ്പറയുന്നെങ്കിൽ’ എന്നിടത്ത് അടയാളം ചേർത്തു.
