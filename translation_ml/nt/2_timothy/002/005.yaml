id: 2TI.2.5
reference: 2 Timothy 2:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐὰν δὲ καὶ ἀθλῇ τις, οὐ στεφανοῦται ἐὰν μὴ νομίμως ἀθλήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/005.yaml
  text: And if anyone also competes as an athlete[a], he is not crowned unless he competes according to the rules.
translation:
  language: ml
  text: അതുപോലെ, ഒരാൾ കായികമത്സരത്തിൽ പങ്കെടുക്കുന്നുവെങ്കിൽ, ചട്ടപ്രകാരം[a] മത്സരിച്ചില്ലെങ്കിൽ അവന് കിരീടം ലഭിക്കുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിയമാനുസൃതമായി.” ഗ്രീക്ക് പദത്തിന് “നിയമാനുസൃതമായ രീതിയിൽ” എന്നർഥമുണ്ട്; ഇവിടെ അത് മത്സരത്തിന്റെ ചട്ടങ്ങൾ പാലിച്ച് മത്സരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθλῇ / ἀθλήσῃ
  choice: കായികമത്സരത്തിൽ പങ്കെടുക്കുന്നെങ്കിൽ / മത്സരിച്ചില്ലെങ്കിൽ
  rationale: ἀθλέω സൂചിപ്പിക്കുന്ന കായികമത്സരത്തിന്റെ ചിത്രം വ്യക്തമായി നിലനിർത്തുന്നു; രണ്ട് പ്രയോഗങ്ങളിലുമുള്ള ഒരേ ഗ്രീക്ക് ധാതുവിന്റെ ബന്ധവും മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: τις
  choice: ഒരാൾ
  rationale: പൊതുവായ അർഥമുള്ള അനിശ്ചിത സർവനാമത്തെ സ്വാഭാവികവും ഉൾക്കൊള്ളുന്നതുമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: στεφανοῦται
  choice: വിജയകിരീടം ലഭിക്കുകയില്ല
  rationale: മത്സരവിജയിക്ക് നൽകുന്ന στεφανός എന്ന കിരീടത്തിന്റെ പശ്ചാത്തലം വ്യക്തമാക്കുന്നു; ആത്മീയ പ്രതിഫലത്തെക്കുറിച്ചുള്ള പ്രത്യേക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: νομίμως
  choice: നിയമാനുസൃതമായി
  rationale: ഗ്രീക്കിലെ ‘നിയമപ്രകാരം/വിധിപ്രകാരം’ എന്ന അർഥവ്യാപ്തി നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് മത്സരനിയമങ്ങൾ പാലിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: καὶ
  choice: അതുപോലെ
  rationale: ചുറ്റുമുള്ള ഉപമകളുടെ നിരയിൽ മറ്റൊരു ഉദാഹരണം കൂടിയാണിതെന്ന് സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: δὲ
  choice: അതുപോലെ
  rationale: മുൻ ഉദാഹരണത്തിൽനിന്ന് അടുത്തതിലേക്കുള്ള മൃദുവായ മാറ്റം καὶയോടൊപ്പം മലയാളത്തിൽ ഒറ്റ സ്വാഭാവിക ബന്ധപദത്തിലൂടെ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: കിരീടത്തിന്റെ പ്രതീകാർഥം
  choice: മത്സരവിജയിക്ക് കിരീടം ലഭിക്കുന്ന കായികരൂപകം മാത്രം നിലനിർത്തുക
  alternative: കിരീടത്തെ അന്ത്യകാല പ്രതിഫലമായോ ശുശ്രൂഷയ്ക്കുള്ള അംഗീകാരമായോ വ്യക്തമായി വ്യാഖ്യാനിക്കുക
  rationale: ഗ്രീക്ക് വാക്യം പ്രതിഫലത്തിന്റെ ദൈവശാസ്ത്രപരമായ സ്വഭാവം വ്യക്തമാക്കുന്നില്ല; അതിനാൽ പരിഭാഷ അതിനെ നിർണയിക്കാതെ രൂപകത്തിലെ സംഘർഷം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. ‘വിജയകിരീടം’ കായികസന്ദർഭം വ്യക്തമാക്കുന്നു; ‘നിയമാനുസൃതമായി’ എന്നതിന്റെ സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ വിശദീകരിക്കുന്നു.
