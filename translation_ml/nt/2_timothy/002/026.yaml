id: 2TI.2.26
reference: 2 Timothy 2:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀνανήψωσιν ἐκ τῆς τοῦ διαβόλου παγίδος, ἐζωγρημένοι ὑπ’ αὐτοῦ εἰς τὸ ἐκείνου θέλημα.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/026.yaml
  text: and they may come to their senses out of the devil’s snare[b][a], having been captured alive by him for his will.
translation:
  language: ml
  text: അങ്ങനെ, പിശാചിനാൽ ജീവനോടെ പിടിക്കപ്പെട്ടവരായ അവർ അവന്റെ ഇഷ്ടം നിറവേറ്റാൻ സുബോധം വീണ്ടെടുത്ത് പിശാചിന്റെ കെണിയിൽനിന്ന് പുറത്തുവരാം.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവന്റെ ഇഷ്ടം നിറവേറ്റാൻ അവനാൽ ബന്ദികളാക്കപ്പെട്ടവർ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ‘അവന്റെ’ എന്നത് പിശാചിനെയല്ല, ദൈവത്തെയാണു സൂചിപ്പിക്കുന്നതെന്ന് ചിലർ മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: ‘ജീവനോടെ പിടിക്കപ്പെട്ട’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ഗ്രീക്ക് ക്രിയയെ പൊതുവായി ‘ബന്ദികളാക്കപ്പെട്ട’ എന്നും പരിഭാഷപ്പെടുത്താം; എന്നാൽ അതിന് കൂടുതൽ പ്രത്യേകമായി ‘ജീവനോടെ പിടിക്കുക’ എന്ന അർഥമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνανήψωσιν
  choice: സുബോധം വീണ്ടെടുത്ത്
  rationale: മദ്യലഹരിയിൽനിന്ന് തെളിഞ്ഞ ബോധത്തിലേക്കു മടങ്ങുക എന്ന പദത്തിന്റെ രൂപകാർഥം ഇവിടെ വഞ്ചനയിൽനിന്നുള്ള മാനസാന്തരത്തെയും വ്യക്തമായ തിരിച്ചറിവിനെയും സൂചിപ്പിക്കുന്നു.
- source_word: παγίδος
  choice: കെണി
  rationale: ഇരയെ കുടുക്കാനുള്ള ഉപകരണമെന്ന അടിസ്ഥാനാർഥവും പിശാചിന്റെ വഞ്ചനയിൽ അകപ്പെടുന്നതെന്ന രൂപകവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: διαβόλου
  choice: പിശാചിന്റെ
  rationale: ഇവിടെ διάβολος സാത്താന്റെ വ്യക്തിപരമായ വിശേഷണനാമമായതിനാൽ മലയാളത്തിലെ സാധാരണ ബൈബിൾപ്രയോഗമായ ‘പിശാച്’ യോജിക്കുന്നു.
- source_word: ἐζωγρημένοι
  choice: ജീവനോടെ പിടികൂടിയിരിക്കുകയാണ്
  rationale: ζωγρέω എന്ന ക്രിയയുടെ ‘ജീവനോടെ പിടിക്കുക’ എന്ന പ്രത്യേക അർഥവും perfect passive participle സൂചിപ്പിക്കുന്ന നിലവിലെ ബദ്ധാവസ്ഥയും നിലനിർത്തുന്നു.
- source_word: ὑπ’ αὐτοῦ
  choice: അവൻ അവരെ
  rationale: പ്രധാനവാക്യത്തിലെ സജീവരൂപം മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികമാണ്; ഏറ്റവും അടുത്ത മുൻപദമായ പിശാചിനെയാണ് ‘അവൻ’ സൂചിപ്പിക്കുന്നത്.
- source_word: εἰς τὸ ἐκείνου θέλημα
  choice: അവന്റെ ഇഷ്ടത്തിനായി
  rationale: εἰς എന്നതിന്റെ ലക്ഷ്യസൂചനയും ഗ്രീക്കിലെ സംക്ഷിപ്തതയും നിലനിർത്തുന്നു; ἐκείνου ആരെ സൂചിപ്പിക്കുന്നു എന്ന യഥാർഥ ആശയക്കുഴപ്പം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
theological_decisions:
- issue: εἰς τὸ ἐκείνου θέλημα എന്നതിലെ ἐκείνου എന്ന സർവനാമത്തിന്റെ സൂചിതൻ
  choice: 'പ്രധാനപാഠത്തിൽ അത് പിശാചിനെ സൂചിപ്പിക്കുന്നു: ‘അവന്റെ ഇഷ്ടത്തിനായി.’'
  alternative: ചിലർ അത് ദൈവത്തെ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കുന്നു; അപ്പോൾ ആശയം ദൈവത്തിന്റെ ഇഷ്ടത്തിലേക്കുള്ള വീണ്ടെടുപ്പായിരിക്കും.
  rationale: തൊട്ടുമുമ്പുള്ള ‘അവനാൽ’ എന്നതിന്റെ ഏറ്റവും അടുത്ത സൂചിതൻ പിശാചാണ്; അതിനാൽ ഈ വായന വ്യാകരണപരമായി സ്വാഭാവികമാണ്. എന്നാൽ ഗ്രീക്ക് സർവനാമം സൃഷ്ടിക്കുന്ന പഴയ വ്യാഖ്യാനഭിന്നത ഇല്ലാതാക്കാതെ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സുബോധം വീണ്ടെടുക്കുക,’ ‘കെണി’ എന്നീ പ്രയോഗങ്ങൾ രൂപകങ്ങൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു. ഗ്രീക്കിലെ നീണ്ട പങ്കുപദഘടന മലയാളത്തിൽ വായനാസൗകര്യത്തിനായി അർധവിരാമത്തോടെ സ്വതന്ത്ര ഉപവാക്യമായി നൽകിയെങ്കിലും അതിന്റെ ഫലാവസ്ഥയും ആശയബന്ധവും നിലനിർത്തിയിട്ടുണ്ട്.
