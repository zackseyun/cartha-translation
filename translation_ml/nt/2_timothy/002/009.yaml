id: 2TI.2.9
reference: 2 Timothy 2:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν ᾧ κακοπαθῶ μέχρι δεσμῶν ὡς κακοῦργος. ἀλλὰ ὁ λόγος τοῦ θεοῦ οὐ δέδεται·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/009.yaml
  text: for which I am suffering hardship[a], even to the point of chains, as a criminal[b]. But the word of God is not bound.
translation:
  language: ml
  text: അതിന്റെ നിമിത്തം ഞാൻ കഷ്ടം സഹിക്കുന്നു[a]—ഒരു കുറ്റവാളിയെപ്പോലെ ചങ്ങലകൾ വരെ[b]. എന്നാൽ ദൈവവചനം ബന്ധിക്കപ്പെട്ടിട്ടില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അതിൽ’ അല്ലെങ്കിൽ ‘അതിന്റെ നിമിത്തം’; ഗ്രീക്കിലെ പ്രയോഗം മുൻവാക്യത്തിൽ പറഞ്ഞ സുവിശേഷത്തെയാണ് മിക്കവാറും സൂചിപ്പിക്കുന്നത്.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, ‘ഒരു ദുഷ്പ്രവൃത്തിക്കാരനെപ്പോലെ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: അതിന്റെ പേരിലാണ്
  rationale: മുൻവാക്യത്തിലെ സുവിശേഷത്തെയാണ് ആപേക്ഷിക പ്രയോഗം മിക്കവാറും സൂചിപ്പിക്കുന്നത്; സന്ദർഭത്തിൽ കാരണാർഥം സ്വാഭാവികമായി അറിയിക്കുമ്പോഴും ‘അതിൽ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: κακοπαθῶ
  choice: ഞാൻ കഷ്ടം സഹിക്കുന്നത്
  rationale: തുടർന്നുകൊണ്ടിരിക്കുന്ന ദുരിതാനുഭവത്തെ ആധുനികവും സ്വാഭാവികവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: μέχρι δεσμῶν
  choice: ചങ്ങലകളിൽ കഴിയുന്നതുവരെ
  rationale: μέχρι സൂചിപ്പിക്കുന്ന പരിധിയും δεσμάയുടെ ദൃശ്യമായ ‘ചങ്ങല’ രൂപകവും നിലനിർത്തുന്നു; തടവിലായ അവസ്ഥയും സ്വാഭാവികമായി ധ്വനിപ്പിക്കുന്നു.
- source_word: ὡς κακοῦργος
  choice: ഒരു കുറ്റവാളിയെപ്പോലെ
  rationale: ന്യായികവും തടവുസംബന്ധവുമായ സന്ദർഭത്തിൽ κακοῦργος എന്നതിന്റെ വ്യക്തമായ സമകാലിക തുല്യപദമാണ്; ‘ദുഷ്‌പ്രവൃത്തിക്കാരൻ’ എന്ന വിപുലമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἀλλὰ
  choice: എന്നാൽ
  rationale: പൗലോസിന്റെ ബന്ധനവും ദൈവവചനത്തിന്റെ അഭേദ്യമായ സ്വാതന്ത്ര്യവും തമ്മിലുള്ള ശക്തമായ വൈരുധ്യം സ്വാഭാവികമായി അടയാളപ്പെടുത്തുന്നു.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: ദൈവവചനം
  rationale: സുവിശേഷപ്രഘോഷണത്തെ സന്ദർഭം സൂചിപ്പിച്ചാലും, λόγος എന്ന പദത്തെ ‘സുവിശേഷസന്ദേശം’ എന്നതിലേക്കു മാത്രം ചുരുക്കാതെ അതിന്റെ വിശാലത നിലനിർത്തുന്നു.
- source_word: οὐ δέδεται
  choice: ബന്ധിക്കപ്പെട്ടിട്ടില്ല
  rationale: പൂർണ്ണകാല കർമണി രൂപം സൂചിപ്പിക്കുന്ന ബന്ധിതാവസ്ഥയുടെ നിഷേധം സംരക്ഷിക്കുകയും പൗലോസിന്റെ ചങ്ങലകളോടുള്ള ഉദ്ദേശ്യപൂർവമായ രൂപകവൈരുധ്യം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘ദൈവവചനം’ എന്നതിന്റെ വ്യാപ്തി
  choice: ദൈവവചനം
  alternative: സുവിശേഷസന്ദേശം; തിരുവെഴുത്ത്
  rationale: ഉടൻമുമ്പുള്ള സന്ദർഭം പ്രത്യേകിച്ച് പ്രഖ്യാപിക്കപ്പെട്ട സുവിശേഷത്തിലേക്കു വിരൽചൂണ്ടുന്നു; എങ്കിലും ഗ്രീക്ക് പ്രയോഗം അതിലധികം വിശാലമാണ്. അതിനാൽ വിവർത്തനം ആശയത്തെ അനാവശ്യമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ ചങ്ങല/ബന്ധനം എന്ന ദൃശ്യ-രൂപക ബന്ധം സംരക്ഷിച്ചു. പ്രധാന പാഠത്തിൽ ആവശ്യമായ [a], [b] അടയാളങ്ങൾ രണ്ടും ഉൾപ്പെടുത്തി.
