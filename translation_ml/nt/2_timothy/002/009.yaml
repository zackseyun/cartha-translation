  - severity: medium
    issue: The lexical-alternative footnote for ὡς κακοῦργος is absent.
    rationale: The draft’s lexical decision says that an alternative is given in a footnote, and the translation notes claim both [a] and [b] markers are present, but the text and footnote list contain only [a]. Adding [b] completes the stated audit trail without altering meaning.
