revisions:
- from: അതിന്റെ പേരിലാണ് ഞാൻ കഷ്ടം സഹിക്കുന്നത്[a]—ഒരു കുറ്റവാളിയെപ്പോലെ ചങ്ങലകളിൽ കഴിയുന്നതുവരെ. എന്നാൽ ദൈവവചനം ബന്ധിക്കപ്പെട്ടിട്ടില്ല.
  to: അതിന്റെ നിമിത്തം ഞാൻ കഷ്ടം സഹിക്കുന്നു[a]—ഒരു കുറ്റവാളിയെപ്പോലെ ചങ്ങലകൾ വരെ[b]. എന്നാൽ ദൈവവചനം ബന്ധിക്കപ്പെട്ടിട്ടില്ല.
