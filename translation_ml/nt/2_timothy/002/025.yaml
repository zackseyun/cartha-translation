revisions:
- from: എതിർക്കുന്നവരെ സൗമ്യതയോടെ തിരുത്തിക്കൊണ്ട്[a] ഇരിക്കണം; ഒരുപക്ഷേ സത്യത്തിന്റെ പരിജ്ഞാനത്തിലേക്കു നയിക്കുന്ന മാനസാന്തരം ദൈവം അവർക്കു നൽകുമായിരിക്കും[b].
  to: സൗമ്യതയോടെ എതിർക്കുന്നവരെ തിരുത്തണം[a]; ഒരുപക്ഷേ, സത്യത്തിന്റെ പരിജ്ഞാനത്തിലേക്കു നയിക്കുന്ന മാനസാന്തരം ദൈവം അവർക്കു നൽകിയേക്കാം[b].
  rationale: സാധ്യതാഭാവത്തെ ‘നൽകിയേക്കാം’ എന്നു കൃത്യമായി പ്രതിഫലിപ്പിക്കുകയും, പങ്കാളിത്തരൂപത്തിന്റെ നിർദേശപരമായ ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ ‘തിരുത്തണം’ എന്നു അവതരിപ്പിക്കുകയും ചെയ്തു. ദൈവം മാനസാന്തരം നൽകുന്നവനാണെന്ന വാക്യത്തിന്റെ പ്രസ്താവന നിലനിർത്തിയിരിക്കുന്നു; ദൈവിക പ്രവർത്തനവും മനുഷ്യപ്രതികരണവും സംബന്ധിച്ച യാതൊരു ദൈവശാസ്ത്രനിഗമനവും ചേർത്തിട്ടില്ല. അടിക്കുറിപ്പ് b പ്രധാനപാഠത്തിന്റെ പകർപ്പാകാതെ εἰς ἐπίγνωσιν ἀληθείας-ന്റെ ബന്ധം വ്യക്തമാക്കുന്നവിധം പരിഷ്കരിച്ചു.
