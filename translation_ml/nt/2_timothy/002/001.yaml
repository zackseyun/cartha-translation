  naturalness: വാക്യം ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ വ്യക്തവും ആദരപൂർണവുമാണ്. ‘എന്റെ കുഞ്ഞേ’ ഇവിടെ സ്നേഹപൂർണമായ ആത്മീയ അഭിസംബോധനയായി സ്വാഭാവികമായി പ്രവർത്തിക്കുന്നു; ‘ശക്തി പ്രാപിക്കുക’ ഔപചാരിക ബൈബിൾ രജിസ്റ്ററിലും വായനാസൗകര്യത്തിലും സമതുലിതമാണ്.
  terminology: ‘കൃപ’ χάρις-നുള്ള സ്ഥാപിതവും യോജിച്ചതുമായ മലയാള പദമാണ്. Χριστός-ന്റെ അർത്ഥസൂചകമായ പദവി നിലനിർത്താൻ ‘മശീഹയായ യേശു’ ഉപയോഗിച്ചിരിക്കുന്നത് നൽകിയ പദ്ധതിതീരുമാനത്തോടു യോജിക്കുന്നു. പേരും ദൈവശാസ്ത്രപരമായ ഭാഷയും അനാവശ്യ വ്യാഖ്യാനം ചേർക്കാതെ കൈകാര്യം ചെയ്തിരിക്കുന്നു.
