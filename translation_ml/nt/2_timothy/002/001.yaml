id: 2TI.2.1
reference: 2 Timothy 2:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Σὺ οὖν, τέκνον μου, ἐνδυναμοῦ ἐν τῇ χάριτι τῇ ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/001.yaml
  text: You[a], then, my child, be strengthened in the grace that is in Messiah Jesus[b],
translation:
  language: ml
  text: അതുകൊണ്ട്, എന്റെ കുഞ്ഞേ, നീ മശീഹയായ യേശുവിൽ[a] ഉള്ള കൃപയിൽ ശക്തി പ്രാപിക്കുക[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ക്രിസ്തുയേശുവിൽ.’ Χριστός എന്ന ഗ്രീക്ക് പദവി ഇവിടെ അതിന്റെ അർത്ഥം നിലനിർത്താൻ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു; പല പരിഭാഷകളും പാരമ്പര്യരൂപമായ ‘ക്രിസ്തു’ ഉപയോഗിക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, ‘ശക്തനായിരിക്കുക.’ ഗ്രീക്ക് ക്രിയ ഇങ്ങനെ ചുരുക്കി പരിഭാഷപ്പെടുത്താം; എന്നാൽ ശക്തി ലഭിക്കുന്നു എന്ന സാധ്യതയുള്ള അർത്ഥം ‘ശക്തി പ്രാപിക്കുക’ കൂടുതൽ വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σὺ
  choice: നീ
  rationale: ഗ്രീക്കിൽ സർവനാമം വ്യക്തമായി ചേർത്തിരിക്കുന്നതിനാൽ അതിന്റെ ഊന്നൽ നിലനിർത്തുന്നു; മലയാളത്തിൽ സന്ദർഭവും പദക്രമവും ഈ വ്യത്യാസസൂചന സ്വാഭാവികമായി നൽകുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യങ്ങളുമായുള്ള നിഗമനപരമായ ബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: τέκνον μου
  choice: എന്റെ കുഞ്ഞേ
  rationale: τέκνον ലിംഗനിർണയം ചെയ്യാതെ ‘കുഞ്ഞ്/മകൻ’ എന്ന സ്നേഹബന്ധം സൂചിപ്പിക്കുന്നു. അഭിസംബോധനയുടെ വാത്സല്യവും നിലനിർത്തുന്നു.
- source_word: ἐνδυναμοῦ
  choice: ശക്തി പ്രാപിക്കുക
  rationale: മധ്യ/കർമണിപ്രയോഗത്തിന്റെ സ്വീകരണഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ശക്തി സ്വയം ഉത്പാദിപ്പിക്കുന്നതല്ല, ലഭിക്കുന്നതാണ് എന്ന സാധ്യത സംരക്ഷിക്കുന്നു.
- source_word: ἐν τῇ χάριτι
  choice: കൃപയിൽ
  rationale: ἐν സൂചിപ്പിക്കുന്ന മണ്ഡലവും ഉപാധിയും തമ്മിലുള്ള അർത്ഥവ്യാപ്തി ചുരുക്കാതെ ‘യിൽ’ നിലനിർത്തുന്നു.
- source_word: χάριτι
  choice: കൃപ
  rationale: ദൈവത്തിന്റെ അനുഗ്രഹപൂർണമായ പ്രസാദത്തെയും ശക്തി നൽകുന്ന പ്രവർത്തനത്തെയും ഉൾക്കൊള്ളുന്ന പതിവായ ബൈബിൾപദമാണ്.
- source_word: τῇ ἐν Χριστῷ Ἰησοῦ
  choice: മശീഹയായ യേശുവിൽ ഉള്ള
  rationale: കൃപ മശീഹയായ യേശുവിൽ സ്ഥിതിചെയ്യുന്നു എന്ന ഗ്രീക്ക് വിശേഷണഘടനയുടെ അർത്ഥം വ്യക്തമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Χριστῷ
  choice: മശീഹയായ
  rationale: Χριστός എന്ന അഭിഷിക്തപദവിയുടെ അർത്ഥം വെറും പാരമ്പര്യനാമരൂപമായി മാറ്റാതെ സംരക്ഷിക്കുന്നു.
- source_word: Ἰησοῦ
  choice: യേശു
  rationale: Ἰησοῦς എന്ന വ്യക്തിനാമത്തിന്റെ നിലവാരമുള്ള മലയാളരൂപം.
theological_decisions:
- issue: ἐνδυναμοῦ എന്ന ക്രിയയിലെ വാച്യവും ശക്തിയുടെ ഉറവിടവും
  choice: ശക്തി പ്രാപിക്കുക
  alternative: ശക്തനായിരിക്കുക; ശക്തനാക്കപ്പെടുക
  rationale: മധ്യ/കർമണി ആജ്ഞാരൂപം ശക്തി ലഭിക്കുന്നുവെന്ന ഭാവം അനുവദിക്കുന്നു. തുടർന്നുള്ള ‘കൃപയിൽ’ എന്ന പ്രയോഗത്തോടും ഇത് യോജിക്കുന്നു; അതേസമയം കർമവാചകത്തിന്റെ അസ്വാഭാവിക കാഠിന്യം ഒഴിവാക്കുന്നു.
- issue: Χριστός എന്ന പദവിയുടെ പരിഭാഷ
  choice: മശീഹയായ യേശു
  alternative: ക്രിസ്തുയേശു
  rationale: അഭിഷിക്തൻ എന്ന ഗ്രീക്ക് പദവിയുടെ അർത്ഥം പ്രകടമാക്കുകയും അത് വെറും പേരായി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ആദരപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘എന്റെ കുഞ്ഞേ’ പൗലോസിന്റെ വാത്സല്യഭാവം നിലനിർത്തുന്നു; ‘ശക്തി പ്രാപിക്കുക’ സ്വാഭാവികതയും മൂലഭാഷയിലെ വാച്യസൂക്ഷ്മതയും തമ്മിൽ തുലനം ചെയ്യുന്നു.
