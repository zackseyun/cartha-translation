    rationale: ‘ഞാൻ പറയുന്നത് ആലോചിച്ചുനോക്കുക’ preserves active reflection while sounding more natural than the nominalized ‘പറയുന്നതിനെക്കുറിച്ച് ചിന്തിക്കുക.’
