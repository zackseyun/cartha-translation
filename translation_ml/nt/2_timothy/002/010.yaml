id: 2TI.2.10
reference: 2 Timothy 2:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διὰ τοῦτο πάντα ὑπομένω διὰ τοὺς ἐκλεκτούς, ἵνα καὶ αὐτοὶ σωτηρίας τύχωσιν τῆς ἐν Χριστῷ Ἰησοῦ μετὰ δόξης αἰωνίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/010.yaml
  text: For this reason I endure everything for the sake of the elect[c][b][a], so that they also may obtain the salvation that is in Messiah Jesus with eternal glory.
translation:
  language: ml
  text: അതുകൊണ്ട്, തിരഞ്ഞെടുക്കപ്പെട്ടവർക്കുവേണ്ടി[a] ഞാൻ എല്ലാം സഹിച്ചുനിൽക്കുന്നു; അവരും മശീഹയായ യേശുവിലുള്ള[b] നിത്യമായ മഹത്ത്വത്തോടുകൂടിയ രക്ഷ പ്രാപിക്കേണ്ടതിനായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘തിരഞ്ഞെടുത്തവർക്കുവേണ്ടി.’ ഗ്രീക്ക് പദം ἐκλεκτούς.
    reason: lexical_alternative
  - marker: b
    text: 'പരമ്പരാഗത പരിഭാഷ: ‘ക്രിസ്തുയേശുവിലുള്ള.’'
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: ഇക്കാരണത്താൽ
  rationale: മുൻസന്ദർഭത്തെ പൗലോസിന്റെ സഹനത്തിന്റെ കാരണമായി ചൂണ്ടിക്കാണിക്കുന്ന പ്രയോഗത്തിന്റെ കാരണാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: πάντα ὑπομένω
  choice: ഞാൻ എല്ലാം സഹിക്കുന്നു
  rationale: πάντα എന്നതിന്റെ സമഗ്രതയും ὑπομένω സൂചിപ്പിക്കുന്ന കഷ്ടതയ്ക്കടിയിലെ ഉറച്ച സഹനവും സംക്ഷിപ്തമായി പകരുന്നു.
- source_word: διὰ τοὺς ἐκλεκτούς
  choice: തിരഞ്ഞെടുക്കപ്പെട്ടവർക്കുവേണ്ടി
  rationale: διά + accusative ഇവിടെ അവരുടെ നന്മയ്ക്കുവേണ്ടിയുള്ള സഹനത്തെ സൂചിപ്പിക്കുന്നു. ἐκλεκτούς എന്ന തിരഞ്ഞെടുപ്പ്-ഭാഷയെ ദൈവശാസ്ത്രപരമായി മയപ്പെടുത്താതെയും ഒരു പ്രത്യേക വ്യവസ്ഥയിലേക്ക് ചുരുക്കാതെയും നിലനിർത്തുന്നു.
- source_word: ἵνα καὶ αὐτοὶ
  choice: അവരും … പ്രാപിക്കേണ്ടതിനാണ്
  rationale: ἵναയുടെ ഉദ്ദേശ്യാർഥവും καίയുടെ ‘അവരും’ എന്ന കൂട്ടിച്ചേർക്കൽഭാവവും മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: σωτηρίας τύχωσιν
  choice: രക്ഷ … പ്രാപിക്കുക
  rationale: τυγχάνω + genitive എന്ന ഘടനയിലെ ലഭിക്കുക/പ്രാപിക്കുക എന്ന ആശയം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ പകരുന്നു.
- source_word: τῆς ἐν Χριστῷ Ἰησοῦ
  choice: മശീഹയായ യേശുവിലുള്ള
  rationale: രക്ഷയെ വിശേഷിപ്പിക്കുന്ന ἐν-പ്രയോഗം ‘ഉള്ളിൽ/ബന്ധത്തിൽ’ എന്ന പൗലോസിന്റെ ഭാഷ നഷ്ടപ്പെടുത്താതെ സൂക്ഷിക്കുന്നു; Χριστός എന്ന പദത്തിന്റെ പദവിയർഥം ‘മശീഹ’യായി വ്യക്തമാക്കുന്നു.
- source_word: μετὰ δόξης αἰωνίου
  choice: നിത്യമായ മഹത്ത്വത്തോടുകൂടെ
  rationale: μετά + genitive സൂചിപ്പിക്കുന്ന അനുഗമനത്തെ നിലനിർത്തുകയും നിത്യമായ മഹത്ത്വം രക്ഷയോടൊപ്പം വരുന്നതായി ഗ്രീക്ക് വാക്യഘടനയെ പിന്തുടരുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ἐκλεκτούς എന്നതിന്റെ പരിഭാഷ
  choice: തിരഞ്ഞെടുക്കപ്പെട്ടവർ
  alternative: തിരഞ്ഞെടുത്തവർ
  rationale: മൂലപദത്തിലെ തിരഞ്ഞെടുപ്പ്-ഭാഷ നേരിട്ട് നിലനിർത്തുന്നു; ആരാണ് തിരഞ്ഞെടുക്കുന്നത്, തിരഞ്ഞെടുപ്പിന്റെ രീതി എന്ത് തുടങ്ങിയ ചോദ്യങ്ങൾ പരിഭാഷയിൽ അധികമായി നിർണയിക്കുന്നില്ല.
- issue: Χριστῷ എന്നത് പദവിയായോ പരമ്പരാഗത നാമരൂപമായോ നൽകുക
  choice: മശീഹയായ യേശു
  alternative: ക്രിസ്തുയേശു
  rationale: ഇവിടെ Χριστός എന്ന പദത്തിന്റെ മശീഹാ-പദവിയർഥം പ്രസക്തമായി നിലനിൽക്കുന്നതിനാൽ അർഥം തുറന്നുകാട്ടുന്ന രൂപം മുഖ്യവാചകത്തിൽ ഉപയോഗിക്കുന്നു; പരിചിതമായ പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: μετὰ δόξης αἰωνίου ഏതിനോടാണ് ചേരുന്നത്
  choice: രക്ഷയോടൊപ്പം വരുന്ന നിത്യമായ മഹത്ത്വം
  alternative: പ്രാപിക്കുന്ന പ്രവൃത്തിയോടു പൊതുവായി ബന്ധിപ്പിച്ച വായന
  rationale: ഗ്രീക്കിൽ ഈ പദസമുച്ചയം ഏറ്റവും സ്വാഭാവികമായി σωτηρίας എന്ന ‘രക്ഷ’യോടാണ് ചേരുന്നത്; മലയാളത്തിലെ സ്ഥാനം ആ ബന്ധം സൂക്ഷിക്കുന്നു, എന്നാൽ അനാവശ്യമായ വിശദീകരണം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘മഹത്ത്വം,’ ‘രക്ഷ,’ ‘മശീഹ’ എന്നീ വാക്കുകൾ തിരുവെഴുത്തിന്റെ ദൈവശാസ്ത്രഭാരം നിലനിർത്തുമ്പോഴും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി സൂക്ഷിച്ചിരിക്കുന്നു.
