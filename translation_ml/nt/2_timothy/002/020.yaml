id: 2TI.2.20
reference: 2 Timothy 2:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐν μεγάλῃ δὲ οἰκίᾳ οὐκ ἔστιν μόνον σκεύη χρυσᾶ καὶ ἀργυρᾶ ἀλλὰ καὶ ξύλινα καὶ ὀστράκινα, καὶ ἃ μὲν εἰς τιμὴν ἃ δὲ εἰς ἀτιμίαν·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/020.yaml
  text: In a large house there are not only gold and silver vessels[a], but also wooden and earthenware ones, and some are for honor[b], but others for dishonor.
translation:
  language: ml
  text: ഒരു വലിയ വീട്ടിൽ സ്വർണംകൊണ്ടും വെള്ളികൊണ്ടും നിർമിച്ച പാത്രങ്ങൾ മാത്രമല്ല, മരംകൊണ്ടും ചുട്ട കളിമണ്ണുകൊണ്ടും നിർമിച്ചവയും[a] ഉണ്ട്. അവയിൽ ചിലത് ബഹുമാനത്തിനും മറ്റു ചിലത് അപമാനത്തിനും വേണ്ടിയുള്ളവയാണ്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ചുട്ട കളിമണ്ണുകൊണ്ടുള്ളവ’ എന്നത് ചുട്ട കളിമണ്ണിൽ നിർമിച്ച മൺപാത്രങ്ങളെയോ അത്തരം വസ്തുക്കളെയോ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: b
    text: അഥവാ, ‘ബഹുമാനകരമായ ഉപയോഗത്തിനും ... അപമാനകരമായ ഉപയോഗത്തിനും.’ ഗ്രീക്കിൽ കൂടുതൽ അക്ഷരാർഥമായി, ‘ബഹുമാനത്തിന് ... അപമാനത്തിന്’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγάλῃ οἰκίᾳ
  choice: ഒരു വലിയ വീട്ടിൽ
  rationale: വീടിന്റെ വലുപ്പമോ പ്രാധാന്യമോ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്; സന്ദർഭത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ ‘വലിയ വീട്’ രൂപകം നിലനിർത്തുന്നു.
- source_word: σκεύη
  choice: പാത്രങ്ങൾ
  rationale: വീട്ടിൽ വിവിധ ആവശ്യങ്ങൾക്കായി ഉപയോഗിക്കുന്ന വസ്തുക്കളെയോ കൊള്ളാവുന്ന ഉപകരണങ്ങളെയോ സൂചിപ്പിക്കുന്ന വിശാലമായ പദമാണ്. ഇവിടെ വസ്തുസാമഗ്രികളുടെ പട്ടികയോടു ചേർന്ന് ‘പാത്രങ്ങൾ’ സ്വാഭാവികമാണ്; രൂപകത്തിന്റെ വ്യാപ്തിയും നിലനിർത്തുന്നു.
- source_word: χρυσᾶ καὶ ἀργυρᾶ
  choice: സ്വർണംകൊണ്ടും വെള്ളികൊണ്ടും നിർമിച്ച
  rationale: പാത്രങ്ങൾ ഏതു വസ്തുവിൽനിന്നാണ് നിർമിച്ചതെന്ന് ഗ്രീക്ക് വിശേഷണങ്ങൾ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ രൂപം വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: ξύλινα καὶ ὀστράκινα
  choice: മരംകൊണ്ടും ചുട്ട കളിമണ്ണുകൊണ്ടും നിർമിച്ചവ
  rationale: ὀστράκινος ചുട്ട കളിമണ്ണിലോ മൺപാത്രവസ്തുവിലോ നിർമിച്ചതിനെ സൂചിപ്പിക്കുന്നു. ‘ചുട്ട കളിമണ്ണ്’ എന്നത് അസംസ്കൃത മണ്ണല്ല, pottery/earthenware ആണെന്ന ഭേദം വ്യക്തമാക്കുന്നു.
- source_word: καὶ ἃ μὲν ... ἃ δὲ ...
  choice: അവയിൽ ചിലത് ... മറ്റു ചിലത് ...
  rationale: μέν...δέ ഘടന ഒരേ കൂട്ടത്തിനുള്ളിലെ വൈരുധ്യം അടയാളപ്പെടുത്തുന്നു; മലയാളത്തിലെ ഈ ഘടന അത് വ്യക്തമായി പകർന്നു നൽകുന്നു.
- source_word: εἰς τιμήν
  choice: മാനത്തിന്
  rationale: അമൂർത്തനാമമായ τιμήയെ പ്രവർത്തനപരമായ വ്യാഖ്യാനമാക്കി മാറ്റാതെ ‘മാനം’ എന്ന നിലയിൽ നിലനിർത്തുന്നു.
- source_word: εἰς ἀτιμίαν
  choice: അപമാനത്തിന്
  rationale: τιμήയുടെ വിപരീതമായ ἀτιμίαയുടെ മാനംകുറവ്/അപമാനം എന്ന ആശയം നേരിട്ട് നിലനിർത്തുന്നു; ‘സാധാരണ ഉപയോഗം’ എന്ന സന്ദർഭവ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: δὲ (initial)
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇവിടെ δέ ഒരു ലഘു ബന്ധകമോ തുടർച്ചാസൂചകമോ ആണ്. മലയാളവാക്യം ബന്ധകപദമില്ലാതെയും സ്വാഭാവികമായി തുടരുമെന്നതിനാൽ ‘എന്നാൽ’ പോലുള്ള ശക്തമായ വൈരുധ്യം ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: τιμή/ἀτιμία എന്നതിനെ ഉപയോഗത്തിന്റെ സ്വഭാവമായി വ്യാഖ്യാനിക്കണമോ, ‘മാനം/അപമാനം’ എന്ന അമൂർത്ത വൈരുധ്യമായി നിലനിർത്തണമോ
  choice: മുഖ്യപാഠത്തിൽ ‘മാനത്തിനും ... അപമാനത്തിനും’ എന്നു നിലനിർത്തി
  alternative: ‘മാന്യമായ ഉപയോഗത്തിനും ... അപമാനകരമായ ഉപയോഗത്തിനും’ അഥവാ ‘വിശിഷ്ട ഉപയോഗത്തിനും ... സാധാരണ ഉപയോഗത്തിനും’
  rationale: ഗൃഹോപകരണങ്ങളുടെ രൂപകം ഉപയോഗത്തെ സൂചിപ്പിക്കാമെങ്കിലും ഗ്രീക്കിൽ ഉപയോഗം എന്ന പദമില്ല; τιμή, ἀτιμία എന്നീ അമൂർത്തനാമങ്ങളാണ്. കൂടുതൽ പ്രവർത്തനപരമായ അർഥം മുഖ്യപാഠത്തിൽ ഉറപ്പിക്കാതെ അടുത്ത വാക്യത്തിലേക്കുള്ള ദൈവശാസ്ത്രപരവും വാഗ്മയപരവുമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘പാത്രങ്ങൾ’ എന്ന പരിചിതപദം ഗൃഹരൂപകം വ്യക്തമാക്കുന്നു. ഗ്രീക്കിലെ അമൂർത്തമായ മാനം/അപമാനം വൈരുധ്യം അനാവശ്യമായി വ്യാഖ്യാനിക്കാതെ സൂക്ഷിച്ചു. വായനക്കാരുടെ കുറിപ്പുകൾ അവ വിശദീകരിക്കുന്ന പദങ്ങൾക്കരികിൽ [a], [b] എന്നിങ്ങനെ ക്രമപ്പെടുത്തി.
