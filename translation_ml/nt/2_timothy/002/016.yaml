  text: τὰς δὲ βεβήλους κενοφωνίας περιΐστασο· ἐπὶ πλεῖον γὰρ προκόψουσιν ἀσεβείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/016.yaml
  text: But avoid profane empty talk[a], for they will advance further into ungodliness,
translation:
  language: ml
  text: എന്നാൽ ദൈവഭക്തിയില്ലാത്ത പൊള്ളയായ സംസാരങ്ങൾ ഒഴിവാക്കുക[a]. കാരണം, അവയിൽ ഏർപ്പെടുന്നവർ കൂടുതൽ കൂടുതൽ ദൈവഭക്തിയില്ലായ്മയിലേക്കു മുന്നേറും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദൈവഭക്തിയില്ലാത്ത വ്യർഥസംസാരങ്ങൾ,’ ‘നിരർഥകമായ സംസാരങ്ങൾ,’ അല്ലെങ്കിൽ ‘സാരമില്ലാത്ത വാക്കുകൾ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: βεβήλους
  choice: വിശുദ്ധിയില്ലാത്ത
  rationale: വിശുദ്ധമായതിന് എതിരായ, ദൈവഭക്തിയില്ലാത്തതോ ആദരവില്ലാത്തതോ ആയ സ്വഭാവം വ്യക്തമാക്കുന്നു; ‘ലൗകികമായ’ എന്നതിനെക്കാൾ മൂലപദത്തിന്റെ മത-ധാർമിക ഭാരം നിലനിർത്തുന്നു.
- source_word: κενοφωνίας
  choice: പൊള്ളയായ സംസാരങ്ങൾ
  rationale: ഉള്ളടക്കമോ മൂല്യമോ ഇല്ലാത്ത വാക്കുകളെന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: περιΐστασο
  choice: ഒഴിവാക്കുക
  rationale: അത്തരം സംസാരങ്ങളിൽനിന്ന് അകന്നുനിൽക്കുക എന്ന മധ്യമപ്രയോഗത്തിലുള്ള ആജ്ഞയുടെ അർഥം ലളിതമായും ശക്തമായും നൽകുന്നു.
- source_word: ἐπὶ πλεῖον
  choice: കൂടുതൽ കൂടുതൽ ...ലേക്ക്
  rationale: ഒരു ദോഷാവസ്ഥയിൽ വർധിച്ച അളവിലേക്ക് നീങ്ങുന്നതിനെ പ്രകടമാക്കുന്നു.
- source_word: προκόψουσιν
  choice: മുന്നേറും
  rationale: ‘പുരോഗമിക്കുക/മുന്നേറുക’ എന്ന മൂലാർഥം സൂക്ഷിക്കുകയും ഇവിടെ ദോഷകരമായ ദിശയിലുള്ള മുന്നേറ്റത്തിന്റെ വിരോധാഭാസം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἀσεβείας
  choice: ഭക്തികേട്
  rationale: ദൈവത്തോടുള്ള ഭക്തിയുടെയും ആദരവിന്റെയും അഭാവം സൂചിപ്പിക്കുന്ന മത-ധാർമിക അർഥം നൽകുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ ഉപദേശത്തോടുള്ള വൈരുധ്യപരമായ തിരിവ് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: മുന്നറിയിപ്പ് കേവലം പ്രയോജനമില്ലാത്ത സംസാരത്തെക്കുറിച്ചാണോ, അതോ മത-ധാർമികമായി ദുഷിച്ച സംസാരത്തെക്കുറിച്ചാണോ
  choice: ‘വിശുദ്ധിയില്ലാത്ത പൊള്ളയായ സംസാരങ്ങൾ’ എന്ന് പരിഭാഷപ്പെടുത്തി, അതിന്റെ പൊള്ളത്തവും വിശുദ്ധതയ്ക്കു വിരുദ്ധമായ സ്വഭാവവും ഒരുപോലെ നിലനിർത്തി.
  alternative: ‘ദൈവഭക്തിയില്ലാത്ത വ്യർഥസംസാരം’ അല്ലെങ്കിൽ ‘അശുദ്ധമായ വിടുവായത്തം’
  rationale: βεβήλους എന്നത് കേവലം ഉപയോഗശൂന്യതയല്ല, വിശുദ്ധമായതിന് വിരുദ്ധമായ സ്വഭാവവും സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള ἀσέβεια ഈ മത-ധാർമിക ഭാരം ഉറപ്പിക്കുന്നു.
- issue: προκόψουσιν എന്ന ക്രിയയുടെ സൂചിത കർത്താവ്
  choice: സ്വാഭാവിക മലയാളത്തിനായി ‘അവയിൽ ഏർപ്പെടുന്നവർ’ എന്നു വ്യക്തമാക്കി.
  alternative: ‘അവ കൂടുതൽ കൂടുതൽ ഭക്തികേടിലേക്കു മുന്നേറും’ എന്നപോലെ സംസാരങ്ങളെത്തന്നെ കർത്താവാക്കുക
  rationale: ഗ്രീക്കിലെ ബഹുവചന ക്രിയയുടെ കർത്താവ് സന്ദർഭത്തിൽ അത്തരം സംസാരത്തിൽ ഏർപ്പെടുന്ന മനുഷ്യരായി ഗ്രഹിക്കപ്പെടുന്നു; മലയാളത്തിൽ അവ്യക്തതയും ജഡവസ്തുവിനെ കർത്താവാക്കുന്ന അസ്വാഭാവികതയും ഒഴിവാക്കാൻ ഇത് വ്യക്തമാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘വിശുദ്ധിയില്ലാത്ത’ മത-ധാർമിക ഭാരം സൂക്ഷിക്കുന്നു; ‘പൊള്ളയായ സംസാരങ്ങൾ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്. വാക്യാവസാനത്തിലെ കോമയ്ക്ക് പകരം മലയാളത്തിലെ സ്വാഭാവിക പൂർണ്ണവിരാമം ഉപയോഗിച്ചു.
