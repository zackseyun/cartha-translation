revisions:
- from: എന്നാൽ വിശുദ്ധിയില്ലാത്ത പൊള്ളയായ സംസാരങ്ങൾ ഒഴിവാക്കുക[a]. കാരണം, അവയിൽ ഏർപ്പെടുന്നവർ കൂടുതൽ കൂടുതൽ ഭക്തികേടിലേക്കു മുന്നേറും.
