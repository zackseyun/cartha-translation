  source_fidelity: The draft accurately conveys the completed deviation (ἠστόχησαν), the reported claim that the resurrection has already occurred (ἀνάστασιν ἤδη γεγονέναι), and the ongoing damage to the faith of some (ἀνατρέπουσιν τήν τινων πίστιν). The revision keeps these aspectual distinctions while making the relationship of the participle λέγοντες to the claim more direct.
