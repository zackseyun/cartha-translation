id: 2TI.2.18
reference: 2 Timothy 2:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἵτινες περὶ τὴν ἀλήθειαν ἠστόχησαν, ⸀λέγοντες ἀνάστασιν ἤδη γεγονέναι, καὶ ἀνατρέπουσιν τήν τινων πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/018.yaml
  text: who have gone astray from the truth[a], saying that the resurrection has already happened[e][d][c][b], and are upsetting the faith of some.
translation:
  language: ml
  text: അവർ സത്യത്തിൽനിന്ന് വഴിതെറ്റിപ്പോയി[a]; “പുനരുത്ഥാനം ഇതിനകം സംഭവിച്ചുകഴിഞ്ഞു”[b] എന്നു പറഞ്ഞ് ചിലരുടെ വിശ്വാസം അട്ടിമറിക്കുന്നു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സത്യത്തെ സംബന്ധിച്ച് ലക്ഷ്യം തെറ്റിപ്പോയി.’
    reason: lexical_alternative
  - marker: b
    text: അതായത്, ഭാവിയിൽ പ്രതീക്ഷിക്കപ്പെട്ടിരുന്ന പുനരുത്ഥാനം ഇതിനകം കഴിഞ്ഞുപോയി എന്നായിരുന്നു അവരുടെ വാദം; ഈ വാക്യം ആ വാദത്തിന്റെ കൂടുതൽ വിശദാംശങ്ങൾ നൽകുന്നില്ല.
    reason: theological_clarification
  - marker: c
    text: അഥവാ, ‘മറിച്ചിടുന്നു’ അല്ലെങ്കിൽ ‘തകർക്കുന്നു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: അവർ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞിരിക്കുന്ന വ്യാജോപദേഷ്ടാക്കളിലേക്കാണ് ബന്ധസർവനാമം വിരൽചൂണ്ടുന്നത്. മലയാളത്തിൽ വാക്യാരംഭത്തിൽ ‘അവർ’ എന്നു പുനരുച്ഛരിക്കുന്നത് സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: περὶ τὴν ἀλήθειαν ἠστόχησαν
  choice: സത്യത്തിൽനിന്ന് വഴിതെറ്റിപ്പോയി
  rationale: ‘സത്യത്തെ സംബന്ധിച്ച് ലക്ഷ്യം തെറ്റി’ എന്ന മൂലരൂപകത്തിന്റെ ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; സത്യോപദേശത്തിൽനിന്നുള്ള വ്യതിചലനമാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: λέγοντες
  choice: എന്നു പറഞ്ഞുകൊണ്ട്
  rationale: വർത്തമാനകാല കൃദന്തരൂപം അവരുടെ വഴിതെറ്റലിന്റെ ഉള്ളടക്കമോ രീതിയോ അവതരിപ്പിക്കുന്നു; ഇവയിൽ ഒന്നിനെ മാത്രം നിർബന്ധമായി നിശ്ചയിക്കാതെ ബന്ധം നിലനിർത്തുന്നു.
- source_word: ἀνάστασιν ἤδη γεγονέναι
  choice: പുനരുത്ഥാനം ഇതിനകം സംഭവിച്ചുകഴിഞ്ഞു
  rationale: γίνομαι എന്ന ക്രിയയുടെ perfect infinitive പൂർത്തിയായ സംഭവവും അതിന്റെ ഇപ്പോഴത്തെ പ്രസക്തിയും സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ അറിയപ്പെട്ട അന്ത്യകാല പുനരുത്ഥാനമാണ് ഉദ്ദേശിക്കപ്പെടുന്നത്.
- source_word: ἀνατρέπουσιν
  choice: അട്ടിമറിക്കുകയും ചെയ്യുന്നു
  rationale: ക്രിയയുടെ വർത്തമാനകാലം തുടരുന്ന ഫലത്തെ സൂചിപ്പിക്കുന്നു. ‘അട്ടിമറിക്കുക’ എന്നത് വിശ്വാസത്തെ മറിച്ചിടുക/ദുർബലപ്പെടുത്തുക എന്ന ശക്തമായ അർഥം നിലനിർത്തുന്നു; പൂർണ വിശ്വാസത്യാഗം നിർബന്ധമായി പ്രഖ്യാപിക്കുന്നില്ല.
- source_word: τήν τινων πίστιν
  choice: ചിലരുടെ വിശ്വാസം
  rationale: πίστις എന്നതിന് ഇവിടെ വ്യാഖ്യാനഭാരം കുറഞ്ഞ സാധാരണ പദമായ ‘വിശ്വാസം’ ഉപയോഗിച്ചു; τινων എന്ന അനിശ്ചിത ബഹുവചനത്തെ ‘ചിലരുടെ’ എന്നു നൽകി.
theological_decisions:
- issue: ‘പുനരുത്ഥാനം ഇതിനകം സംഭവിച്ചുകഴിഞ്ഞു’ എന്ന അവകാശവാദത്തിന്റെ സ്വഭാവം
  choice: ഭാവിയിൽ പ്രതീക്ഷിക്കപ്പെടുന്ന പുനരുത്ഥാനം ഇതിനകം നടന്നുവെന്ന വ്യാജവാദമായി വാചകം അതേപടി നിലനിർത്തി.
  alternative: ആത്മീയ പുനരുത്ഥാനം മാത്രമേയുള്ളൂ എന്ന വാദമെന്നോ ഭാവിയിലെ ശാരീരിക പുനരുത്ഥാനത്തിന്റെ നിഷേധമെന്നോ വിശദീകരിക്കുക.
  rationale: ഈ വാക്യം വ്യാജോപദേശത്തിന്റെ ഉള്ളടക്കം അറിയിക്കുന്നുവെങ്കിലും അതിന്റെ സമ്പൂർണ സിദ്ധാന്തഘടന വിശദീകരിക്കുന്നില്ല. അതിനാൽ വാചകത്തിൽ ഇല്ലാത്ത പ്രത്യേക പുനർനിർമ്മാണം വിവർത്തനത്തിലേക്ക് ചേർത്തിട്ടില്ല.
- issue: πίστις എന്ന പദത്തിന്റെ അർഥം
  choice: വിശ്വാസം
  alternative: ആശ്രയം / വിശ്വസ്തത
  rationale: ഈ സന്ദർഭത്തിൽ വിശ്വാസികളുടെ ദൈവാശ്രയമോ അവർ അംഗീകരിക്കുന്ന വിശ്വാസമോ ഉദ്ദേശിക്കാം. ‘വിശ്വാസം’ ഈ സാധ്യതകളെ അനാവശ്യമായി ചുരുക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ഗ്രീക്കിലെ ബന്ധവാക്യം മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിനായി ‘അവർ’ എന്ന കർത്താവോടെ അവതരിപ്പിച്ചു. ആദ്യ ക്രിയയുടെ പൂർത്തിയായ വ്യതിചലനവും അവസാന ക്രിയയുടെ തുടരുന്ന ഫലവും യഥാക്രമം ‘വഴിതെറ്റിപ്പോയി’, ‘അട്ടിമറിക്കുകയും ചെയ്യുന്നു’ എന്നിങ്ങനെ വേർതിരിച്ചു.
