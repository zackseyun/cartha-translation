revisions:
- from: മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിക്കപ്പെട്ടവനും ദാവീദിന്റെ സന്തതിയിൽ ജനിച്ചവനുമായ യേശു മശീഹായെ ഓർത്തുകൊള്ളുക—ഇതാണ് എന്റെ സുവിശേഷം.[a]
  to: എന്റെ സുവിശേഷപ്രകാരം, മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിക്കപ്പെട്ടവനും ദാവീദിന്റെ സന്തതിയിൽനിന്നുള്ളവനുമായ യേശു മശീഹാവിനെ ഓർത്തുകൊള്ളുക.[a]
  rationale: The revision restores the direct sense of κατὰ τὸ εὐαγγέλιόν μου as «എന്റെ സുവിശേഷപ്രകാരം», corrects the Malayalam object form for “Jesus the Messiah,” and uses «ദാവീദിന്റെ സന്തതിയിൽനിന്നുള്ളവൻ» to express lineage without adding an explicit birth assertion. The passive resurrection wording and the source’s compact appositional structure are retained.
