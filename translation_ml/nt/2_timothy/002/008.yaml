id: 2TI.2.8
reference: 2 Timothy 2:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Μνημόνευε Ἰησοῦν Χριστὸν ἐγηγερμένον ἐκ νεκρῶν, ἐκ σπέρματος Δαυίδ, κατὰ τὸ εὐαγγέλιόν μου·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/008.yaml
  text: Remember Jesus the Messiah[a], raised from the dead, descended from David[b], according to my gospel.
translation:
  language: ml
  text: എന്റെ സുവിശേഷപ്രകാരം, മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിക്കപ്പെട്ടവനും ദാവീദിന്റെ സന്തതിയിൽനിന്നുള്ളവനുമായ യേശു മശീഹാവിനെ ഓർത്തുകൊള്ളുക.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “യേശുക്രിസ്തുവിനെ.” ഗ്രീക്കിലെ Χριστός എന്ന പദം “ക്രിസ്തു” എന്നും “മശീഹാ” എന്നും വിവർത്തനം ചെയ്യാം; ദാവീദുമായുള്ള വംശബന്ധത്തിന്റെ പശ്ചാത്തലത്തിൽ ഇവിടെ “മശീഹാ” എന്നത് പദവിയുടെ അർഥം വ്യക്തമാക്കുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: Μνημόνευε
  choice: ഓർത്തുകൊള്ളുക
  rationale: വർത്തമാനകാല ആജ്ഞാരൂപം തുടർച്ചയായി മനസ്സിൽ സൂക്ഷിക്കാനുള്ള ആഹ്വാനം നൽകുന്നു; ‘ഓർത്തുകൊള്ളുക’ സ്വാഭാവികമായ മലയാളത്തിൽ ആ ആജ്ഞാശക്തി നിലനിർത്തുന്നു.
- source_word: Ἰησοῦν Χριστόν
  choice: യേശു മശീഹായെ
  rationale: Χριστός ഇവിടെ ദാവീദിക വംശപരമ്പരയോടു ചേർന്ന മശീഹാപദവിയായി തെളിഞ്ഞുനിൽക്കുന്നു; ‘മശീഹാ’ അതിന്റെ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: ἐγηγερμένον ἐκ νεκρῶν
  choice: മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിക്കപ്പെട്ടവൻ
  rationale: സമ്പൂർണകാല കർമണിപ്രയോഗം യേശു ഉയിർപ്പിക്കപ്പെട്ടുവെന്നും ആ നില തുടരുന്നുവെന്നും സൂചിപ്പിക്കുന്നു; കർമണിരൂപം മൂലഭാഷയുടെ വ്യാകരണദിശ സംരക്ഷിക്കുന്നു.
- source_word: ἐκ σπέρματος Δαυίδ
  choice: ദാവീദിന്റെ സന്തതിയിൽ ജനിച്ചവൻ
  rationale: σπέρμα എന്നതിന്റെ അക്ഷരാർഥം ‘വിത്ത്’ ആണെങ്കിലും വംശാവലി സന്ദർഭത്തിൽ ‘സന്തതി’ സ്വാഭാവികവും കൃത്യവുമാണ്; ἐκ എന്നത് വംശോത്ഭവം സൂചിപ്പിക്കുന്നു.
- source_word: κατὰ τὸ εὐαγγέλιόν μου
  choice: ഇതാണ് എന്റെ സുവിശേഷം
  rationale: κατά ഇവിടെ മുമ്പുള്ള പ്രസ്താവന പൗലൊസിന്റെ സുവിശേഷപ്രഘോഷണത്തോട് യോജിക്കുന്നതായി ബന്ധിപ്പിക്കുന്നു. മലയാളത്തിൽ ഡാഷോടുകൂടിയ ഈ രൂപം അർഥം സ്വാഭാവികമായി നൽകുന്നു; അടിക്കുറിപ്പിൽ കൂടുതൽ ഔപചാരികമായ പദാനുപദ സാധ്യത നൽകിയിരിക്കുന്നു.
theological_decisions:
- issue: Χριστός എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: പുനരുത്ഥാനത്തോടും ദാവീദിക വംശത്തോടും ചേർന്നതിനാൽ ഇവിടെ പദവിയുടെ അർഥം മുൻനിൽക്കുന്നു. ‘മശീഹാ’ ആ പദവിയെ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; പരമ്പരാഗത ‘ക്രിസ്തു’ എന്ന രൂപവും സാധുവാണ്.
- issue: ἐγηγερμένον എന്ന സമ്പൂർണകാല കർമണി കൃദന്തരൂപം
  choice: ഉയിർപ്പിക്കപ്പെട്ടവൻ
  alternative: ഉയിർത്തെഴുന്നേറ്റവൻ
  rationale: മൂലത്തിലെ കർമണിദിശയും സംഭവത്തിന്റെ നിലനിൽക്കുന്ന ഫലവും കഴിയുന്നത്ര സംരക്ഷിക്കുന്നു; ആരാണ് ഉയിർപ്പിച്ചതെന്ന് വാക്യം വ്യക്തമാക്കാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല.
- issue: ‘എന്റെ സുവിശേഷം’ എന്നതിന്റെ അർഥം
  choice: ഉടമസ്ഥസർവനാമം അതേപടി നിലനിർത്തി
  alternative: ഞാൻ പ്രസംഗിക്കുന്ന സുവിശേഷം
  rationale: μου എന്നത് നേരിട്ട് ‘എന്റെ’ എന്നാണ്. ഇത് വേറിട്ടൊരു സുവിശേഷം സൂചിപ്പിക്കുന്നുവെന്നോ വെറും ചുമതലപ്പെടുത്തിയ സന്ദേശം മാത്രമാണെന്നോ മുഖ്യപാഠത്തിൽ വ്യാഖ്യാനിച്ച് തീർപ്പാക്കിയിട്ടില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും സഭാപാരമ്പര്യപരിചയമുള്ളതുമായ മലയാളം. ‘ഉയിർപ്പിക്കപ്പെട്ടവൻ’ എന്ന രൂപം അല്പം ഔപചാരികമാണെങ്കിലും ഗ്രീക്കിലെ കർമണിപ്രയോഗം നിലനിർത്താൻ തെരഞ്ഞെടുത്തു. മുഖ്യപാഠത്തിലെ എല്ലാ അടിക്കുറിപ്പുകുറികളും ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
