id: 2TI.2.13
reference: 2 Timothy 2:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ ἀπιστοῦμεν, ἐκεῖνος πιστὸς μένει· ⸀ἀρνήσασθαι ἑαυτὸν οὐ δύναται.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/013.yaml
  text: If we are faithless[a], he remains faithful[b], for he cannot deny himself.
translation:
  language: ml
  text: നാം അവിശ്വസ്തരായാലും[a], അവൻ വിശ്വസ്തനായി നിലനിൽക്കുന്നു[b]; തന്നെത്തന്നെ നിഷേധിക്കാൻ അവനു കഴിയുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നാം വിശ്വസിക്കാതിരുന്നാലും.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘വിശ്വസിക്കാതിരിക്കുക’ എന്നും ‘അവിശ്വസ്തരായിരിക്കുക’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘വിശ്വാസയോഗ്യനായി.’ ‘അവിശ്വസ്തരായാലും’ എന്നതിനോടുള്ള വൈരുധ്യം നിലനിർത്താൻ മുഖ്യവാചകത്തിൽ ‘വിശ്വസ്തനായി’ എന്നു ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπιστοῦμεν
  choice: നാം അവിശ്വസ്തരായാലും
  rationale: ἀπιστέω എന്ന ക്രിയയ്ക്ക് ‘വിശ്വസിക്കാതിരിക്കുക’ എന്നും ‘അവിശ്വസ്തരായിരിക്കുക’ എന്നും അർഥമാകാം. ‘അവിശ്വസ്തരായാലും’ എന്നത് πιστός എന്ന പദത്തോടുള്ള പ്രതിവിരുദ്ധത നിലനിർത്തുന്നു; അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: πιστὸς
  choice: വിശ്വസ്തനായി
  rationale: ‘വിശ്വസ്തൻ’ എന്നത് ἀπιστοῦμεν എന്നതോടുള്ള മനപ്പൂർവമായ പദവൈരുധ്യം സംരക്ഷിക്കുന്നു. ‘വിശ്വാസയോഗ്യൻ’ എന്നതും സാധ്യമെങ്കിലും ആ വൈരുധ്യം അത്ര വ്യക്തമായി നിലനിർത്തുന്നില്ല.
- source_word: μένει
  choice: നിലനിൽക്കുന്നു
  rationale: തുടരുന്ന സ്ഥിരതയെ ആധുനികവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀρνήσασθαι
  choice: നിഷേധിക്കാൻ
  rationale: ἀρνέομαι എന്നതിന്റെ നേരിട്ടുള്ള അർഥവും പ്രസ്താവനയുടെ ശക്തിയും നിലനിർത്തുന്നു.
- source_word: ἑαυτὸν
  choice: തന്നെത്തന്നെ
  rationale: ἐκεῖνος എന്ന കർത്താവിലേക്കു മടങ്ങിച്ചൂണ്ടുന്ന ആത്മവാചക സർവനാമം വ്യക്തമായി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: οὐ δύναται
  choice: കഴിയുകയില്ല
  rationale: വെറും മനസ്സില്ലായ്മയല്ല, അസാധ്യതയാണ് ഗ്രീക്ക് പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: മനുഷ്യരുടെ അവിശ്വസ്തതയോടുള്ള ബന്ധത്തിൽ ദൈവത്തിന്റെ വിശ്വസ്തതയുടെ അർഥം
  choice: അവൻ തന്റെ സ്വഭാവത്തെ നിഷേധിക്കാൻ കഴിയാത്തതിനാൽ അവന്റെ വിശ്വസ്തത നിലനിൽക്കുന്നു എന്നു മാത്രം വാക്യം പ്രസ്താവിക്കുന്ന വിധത്തിൽ പരിഭാഷപ്പെടുത്തി.
  alternative: ഇത് അവൻ തന്റെ ജനത്തെ തീർച്ചയായും രക്ഷിക്കുമെന്നോ, വിശ്വാസത്യാഗത്തെക്കുറിച്ചുള്ള ന്യായവിധിയുടെ മുന്നറിയിപ്പുകൾ ഉൾപ്പെടെ തന്റെ വചനമെല്ലാം നിറവേറ്റുമെന്നോ മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്ക് പാഠം ദൈവിക സ്ഥിരത ഉറപ്പിക്കുന്നുവെങ്കിലും അതിന്റെ രക്ഷാപരമോ ന്യായവിധിപരമോ ആയ പ്രത്യേക പ്രയോഗം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ ആ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഭാഷയിൽ പരിഹരിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത കാരണബന്ധം ചേർക്കാതെ അർധവിരാമം ഉപയോഗിച്ചു; പദവൈരുധ്യവും ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും സംരക്ഷിച്ചു.
