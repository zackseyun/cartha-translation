  - severity: low
    issue: The footnote on δικαιοσύνη does not clearly preserve ‘justice’ as the alternative lexical rendering.
    rationale: The existing note describes possible senses of ‘നീതി’ but does not distinguish the audit trail’s primary righteousness sense from its justice alternative. The revision makes that alternative explicit.
