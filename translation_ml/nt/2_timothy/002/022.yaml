id: 2TI.2.22
reference: 2 Timothy 2:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τὰς δὲ νεωτερικὰς ἐπιθυμίας φεῦγε, δίωκε δὲ δικαιοσύνην, πίστιν, ἀγάπην, εἰρήνην μετὰ τῶν ἐπικαλουμένων τὸν κύριον ἐκ καθαρᾶς καρδίας.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/022.yaml
  text: But flee youthful desires[a], and pursue righteousness, faith, love, and peace[c][b], together with those who call on the Lord from a pure heart.
translation:
  language: ml
  text: എന്നാൽ യൗവനസഹജമായ മോഹങ്ങളെ[a] വിട്ടോടുക; ശുദ്ധഹൃദയത്തിൽനിന്ന് കർത്താവിനെ വിളിച്ചപേക്ഷിക്കുന്നവരോടൊപ്പം നീതിനിഷ്ഠയും[b] വിശ്വാസവും[c] സ്നേഹവും സമാധാനവും പിന്തുടരുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യൗവനസഹജമായ തീവ്രമോഹങ്ങൾ.’ ഈ ഗ്രീക്കുപ്രയോഗം ലൈംഗികമോഹം മാത്രമല്ല, പൊതുവേ യൗവനത്തിന്റെ സവിശേഷതയായ ആഗ്രഹങ്ങളെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നീതി.’ ഗ്രീക്കുപദത്തിന് നൈതികമായ ശരിതനിമയുടെയും ന്യായമായ ബന്ധങ്ങളുടെയും ഭാവങ്ങൾ ഉണ്ടായേക്കാം.
    reason: alternative_reading
  - marker: c
    text: അഥവാ, ‘വിശ്വസ്തത.’ ഗ്രീക്കുപദത്തിന് സന്ദർഭമനുസരിച്ച് വിശ്വാസം, ആശ്രയം, വിശ്വസ്തത എന്നീ അർഥങ്ങൾ വരാം.
    reason: alternative_reading
lexical_decisions:
- source_word: νεωτερικὰς ἐπιθυμίας
  choice: യൗവനസഹജമായ മോഹങ്ങൾ
  rationale: യൗവനത്തിന്റെ സവിശേഷതകളുമായി ബന്ധപ്പെട്ട ആഗ്രഹങ്ങളെയോ തീവ്രമായ മോഹങ്ങളെയോ സൂചിപ്പിക്കുന്നു; ലൈംഗികമോഹത്തിൽ മാത്രം അർഥം പരിമിതപ്പെടുത്താതെ വിശാലമായ നൈതിക വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: φεῦγε
  choice: വിട്ടോടുക
  rationale: വെറുതെ ഒഴിവാക്കുക എന്നതിനെക്കാൾ ശക്തമായ, തുടർച്ചയായ അകന്നുനിൽക്കലിനെ സൂചിപ്പിക്കുകയും δίωκε എന്ന വിപരീത ആഹ്വാനത്തോടുള്ള സജീവത നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: δίωκε
  choice: പിന്തുടരുക
  rationale: നിരന്തരവും സജീവവുമായ പരിശ്രമത്തെ പ്രകടമാക്കുന്നു; ‘വിട്ടോടുക’ എന്നതിനോടുള്ള വാക്യത്തിലെ ശക്തമായ വൈരുധ്യം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: δικαιοσύνην
  choice: നീതി
  rationale: മലയാളത്തിൽ വ്യക്തിയുടെ ശരിയായ ജീവിതവും മറ്റുള്ളവരോടുള്ള ന്യായമായ ബന്ധവും ഉൾക്കൊള്ളാൻ കഴിയുന്ന സ്വാഭാവിക പദമാണ്; ഗ്രീക്കിലെ നൈതികവും ബന്ധപരവുമായ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: πίστιν
  choice: വിശ്വാസം
  rationale: πίστις എന്ന പദത്തിന്റെ സാധാരണ പുതിയനിയമ പ്രയോഗം നിലനിർത്തുന്നു; ഈ സദ്ഗുണപ്പട്ടികയിൽ ‘വിശ്വസ്തത’ എന്ന നൈതിക അർഥവും സാദ്ധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: ἀγάπην
  choice: സ്നേഹം
  rationale: ἀγάπηയ്ക്ക് സ്വാഭാവികവും വ്യാപകമായി മനസ്സിലാക്കപ്പെടുന്നതുമായ മലയാളപരിഭാഷ.
- source_word: εἰρήνην
  choice: സമാധാനം
  rationale: സദ്ഗുണപ്പട്ടികയിൽ εἰρήνηയുടെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: μετὰ τῶν ἐπικαλουμένων τὸν κύριον
  choice: കർത്താവിനെ വിളിച്ചപേക്ഷിക്കുന്നവരോടൊപ്പം
  rationale: μετάയുടെ സഹവാസാർഥവും ἐπικαλέωയുടെ പ്രാർഥനാപൂർവമായ ‘വിളിച്ചപേക്ഷിക്കുക’ എന്ന ഭാവവും വ്യക്തമാക്കുന്നു.
- source_word: ἐκ καθαρᾶς καρδίας
  choice: ശുദ്ധഹൃദയത്തോടെ
  rationale: ആ വിളിച്ചപേക്ഷയുടെ ആന്തരിക ഉറവിടമായ നിർമ്മലഹൃദയത്തെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘യൗവനസഹജമായ മോഹങ്ങൾ’ എന്നതിന്റെ വ്യാപ്തി
  choice: യൗവനവുമായി ബന്ധപ്പെട്ട വിശാലമായ ആഗ്രഹങ്ങളും തീവ്രമോഹങ്ങളും; ലൈംഗികമോഹത്തിൽ മാത്രം പരിമിതമല്ല
  alternative: പ്രധാനമായും ലൈംഗിക വികാരങ്ങൾ
  rationale: νεωτερικὰς ἐπιθυμίας എന്ന പ്രയോഗം സ്വതവേ വിശാലമാണ്; സന്ദർഭവും സ്വഭാവത്തെയും പെരുമാറ്റത്തെയും സംബന്ധിച്ച പൊതുവായ പ്രബോധനമാണ്.
- issue: δικαιοσύνηയുടെ പരിഭാഷ
  choice: പ്രധാനവാക്യത്തിൽ ‘നീതി’
  alternative: ‘നീതിനിഷ്ഠ’ അല്ലെങ്കിൽ ‘നീതിയുള്ള ജീവിതം’
  rationale: ‘നീതി’ ഗ്രീക്കുപദത്തിന്റെ നൈതികവും ബന്ധപരവുമായ അർഥങ്ങൾ സംക്ഷിപ്തമായി വഹിക്കുന്നു; വ്യക്തിജീവിതത്തിലെ ശരിതനിമ എന്ന സാദ്ധ്യമായ ഊന്നൽ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: πίστις എന്ന സദ്ഗുണപദത്തിന്റെ അർഥം
  choice: പ്രധാനവാക്യത്തിൽ ‘വിശ്വാസം’
  alternative: ‘വിശ്വസ്തത’
  rationale: വിശ്വാസം സാധാരണവും സന്ദർഭസഹജവുമായ പരിഭാഷയാണ്; എന്നാൽ സദ്ഗുണപ്പട്ടികയിൽ വിശ്വസ്തത എന്ന അർഥസാദ്ധ്യത യഥാർഥമായതിനാൽ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ളതുമായ ശൈലി. ‘വിട്ടോടുക—പിന്തുടരുക’ എന്ന ഗ്രീക്ക് വാക്യത്തിലെ സജീവ വൈരുധ്യം സംരക്ഷിച്ചിട്ടുണ്ട്; അവ്യക്തമായ പദവ്യാപ്തികൾ അടിക്കുറിപ്പുകളിൽ നിലനിർത്തിയിട്ടുണ്ട്.
