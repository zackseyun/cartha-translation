  terminology: ‘വിശ്വാസം,’ ‘സ്നേഹം,’ ‘സമാധാനം,’ and ‘കർത്താവ്’ are appropriate. To align the main rendering of δικαιοσύνη with the audit trail’s ‘righteousness’ while retaining the viable justice nuance, ‘നീതിനിഷ്ഠ’ is used in the text and ‘നീതി’ is supplied as the footnoted alternative.
