  source_fidelity: The draft accurately preserves the paired imperatives (φεῦγε/δίωκε), the broad scope of νεωτερικαὶ ἐπιθυμίαι, the virtue list, and the communal force of μετά. However, ‘ശുദ്ധഹൃദയത്തോടെ’ more naturally means ‘with a pure heart,’ whereas ἐκ καθαρᾶς καρδίας identifies the source of the calling; ‘ശുദ്ധഹൃദയത്തിൽനിന്ന്’ more directly retains that force.
