  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: σπούδασον σεαυτὸν δόκιμον παραστῆσαι τῷ θεῷ, ἐργάτην ἀνεπαίσχυντον, ὀρθοτομοῦντα τὸν λόγον τῆς ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/015.yaml
  text: Be diligent to present yourself approved to God[a], a worker with no need to be ashamed, rightly handling the word of truth.
translation:
  language: ml
  text: നിന്നെത്തന്നെ ദൈവസന്നിധിയിൽ അംഗീകൃതനായി അവതരിപ്പിക്കാൻ ശ്രദ്ധയോടെ പരിശ്രമിക്കൂ—ലജ്ജിക്കേണ്ടതില്ലാത്ത ഒരു വേലക്കാരനായി, സത്യവചനം ശരിയായി കൈകാര്യം ചെയ്യുന്നവനായി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സത്യവചനം ശരിയായി പഠിപ്പിക്കുന്നവൻ’ എന്നും വിവർത്തനം ചെയ്യാം; കൂടുതൽ അക്ഷരാർഥത്തിൽ, ‘സത്യവചനത്തെ നേരെ മുറിക്കുന്നവൻ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: σπούδασον
  choice: ഉത്സാഹിക്കൂ
  rationale: ഏകാഗ്രവും ആത്മാർഥവുമായ പരിശ്രമത്തിനുള്ള ആജ്ഞയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; ‘കഴിവിന്റെ പരമാവധി ശ്രമിക്കൂ’ എന്നതിനെക്കാൾ ഗ്രീക്കിലെ ഗൗരവം നിലനിർത്തുന്നു.
- source_word: σεαυτὸν ... παραστῆσαι
  choice: നിന്നെത്തന്നെ സമർപ്പിക്കാൻ
  rationale: ദൈവസന്നിധിയിൽ വിലയിരുത്തലിനോ സേവനത്തിനോ സ്വയം ഹാജരാക്കുക എന്ന ആശയം സംക്ഷിപ്തമായി നൽകുന്നു; ‘സമർപ്പിക്കുക’ എന്നത് ഇവിടെ വെറും ആന്തരിക അർപ്പണമെന്നല്ല, ദൈവത്തിനു മുമ്പാകെ സ്വയം അവതരിപ്പിക്കലാണ്.
- source_word: δόκιμον
  choice: അംഗീകാരം നേടിയവനായി
  rationale: പരിശോധനയിൽ നിലനിന്നതിനാൽ അംഗീകരിക്കപ്പെട്ടവൻ എന്ന δόκιμος എന്ന പദത്തിന്റെ ഫലം വ്യക്തമാക്കുന്നു. ‘അംഗീകൃതനായി’ എന്നതിനെക്കാൾ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്.
- source_word: τῷ θεῷ
  choice: ദൈവത്തിന്റെ
  rationale: δόκιμον എന്ന ആശയത്തോടു ചേർത്ത് ‘ദൈവത്തിന്റെ അംഗീകാരം’ എന്നു സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ഗ്രീക്കിലെ ദൈവത്തോടുള്ള ബന്ധം നിലനിർത്തുന്നു.
- source_word: ἐργάτην
  choice: ഒരു വേലക്കാരനായി
  rationale: തൊഴിലാളി/പ്രവർത്തകൻ എന്ന രൂപകം നിലനിർത്തുകയും സഭാപദവിയിലേക്ക് അർത്ഥം ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀνεπαίσχυντον
  choice: ലജ്ജിക്കേണ്ടതില്ലാത്ത
  rationale: വ്യക്തിയുടെ ലജ്ജയില്ലാത്ത മനോഭാവത്തേക്കാൾ, ലജ്ജിക്കാനുള്ള കാരണം ഇല്ലാത്ത അംഗീകൃത നിലയാണ് പദം സൂചിപ്പിക്കുന്നത്.
- source_word: ὀρθοτομοῦντα
  choice: ശരിയായി കൈകാര്യം ചെയ്യുന്നവനായി
  rationale: സത്യസന്ദേശത്തെ കൃത്യമായും വിശ്വസ്തമായും കൈകാര്യം ചെയ്യുക എന്ന സന്ദർഭാർഥം നൽകുന്നു; പഠിപ്പിക്കൽ എന്ന ഒറ്റ ശുശ്രൂഷാപ്രവൃത്തിയിലേക്ക് അർത്ഥം ചുരുക്കുന്നില്ല. അപൂർവമായ പദത്തിന്റെ അക്ഷരാർഥരൂപകം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: τὸν λόγον τῆς ἀληθείας
  choice: സത്യവചനം
  rationale: ഗ്രീക്കിലെ ‘സത്യത്തിന്റെ വചനം’ എന്ന ബന്ധം സ്വാഭാവികവും പരിചിതവുമായ മലയാള സംയുക്തപദത്തിൽ നിലനിർത്തുന്നു; ‘സത്യസന്ദേശം’ സാധ്യമായിരുന്നാലും കൂടുതൽ വ്യാഖ്യാനാത്മകമാണ്.
theological_decisions:
- issue: ശുശ്രൂഷാസന്ദർഭത്തിൽ ὀρθοτομοῦντα എന്നതിന്റെ അർഥം
  choice: സത്യവചനം ശരിയായി കൈകാര്യം ചെയ്യുന്നവനായി
  alternative: സത്യവചനം ശരിയായി പഠിപ്പിക്കുന്നവനായി; അക്ഷരാർഥത്തിൽ, സത്യവചനത്തെ നേരെ മുറിക്കുന്നവനായി
  rationale: ഈ കൃതന്തം സുവിശേഷസന്ദേശത്തെ കൃത്യമായും വിശ്വസ്തമായും കൈകാര്യം ചെയ്യുന്നതിനെ വിശാലമായി സൂചിപ്പിക്കാം. ‘പഠിപ്പിക്കുക’ എന്നു മാത്രം നൽകിയാൽ അർഥം അനാവശ്യമായി ചുരുങ്ങും; ‘നേരെ മുറിക്കുക’ എന്നു മുഖ്യപാഠത്തിൽ നൽകിയാൽ മലയാളത്തിൽ രൂപകം അവ്യക്തമാകും. അതിനാൽ വിശാലമായ സന്ദർഭാർഥം മുഖ്യപാഠത്തിലും യഥാർഥ രൂപകവും വ്യാഖ്യാനസാധ്യതയും അടിക്കുറിപ്പിലും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ആദരവുറ്റതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. തിമൊഥെയൊസിനോടുള്ള ഏകവചന ആജ്ഞയ്ക്ക് ‘ഉത്സാഹിക്കൂ’ ഉപയോഗിച്ചു. വാക്യത്തിലെ പരസ്പരം ബന്ധപ്പെട്ട വിശേഷണഭാവങ്ങൾ ഡാഷും സമാന്തരമായ ‘-ആയി’ ഘടനകളുംകൊണ്ട് വ്യക്തമായി ക്രമപ്പെടുത്തി; അപൂർവമായ ഗ്രീക്ക് രൂപകത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
