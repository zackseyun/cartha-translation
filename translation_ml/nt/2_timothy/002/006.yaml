  text: τὸν κοπιῶντα γεωργὸν δεῖ πρῶτον τῶν καρπῶν μεταλαμβάνειν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/006.yaml
  text: The hardworking farmer must be the first to receive a share of the crops[a].
translation:
  language: ml
  text: കഠിനാധ്വാനം ചെയ്യുന്ന കർഷകനാണ് വിളവിൽനിന്ന് ആദ്യം പങ്കു ലഭിക്കേണ്ടത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അധ്വാനിക്കുന്ന കർഷകൻ ആദ്യം വിളവിൽ പങ്കുകൊള്ളണം.” ‘പങ്കുകൊള്ളുക’ എന്നത് ഗ്രീക്കിനോട് കൂടുതൽ പദാനുപദമായി അടുത്തതാണ്; മുഖ്യപാഠത്തിലെ ‘പങ്കു ലഭിക്കുക’ ആധുനിക മലയാളത്തിൽ അർത്ഥം കൂടുതൽ വ്യക്തമായി പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: κοπιῶντα
  choice: കഠിനാധ്വാനം ചെയ്യുന്ന
  rationale: ഈ വർത്തമാനകാല കൃദന്തം അധ്വാനത്തിന്റെയും കഠിനപ്രയത്നത്തിന്റെയും തുടർച്ചയായ സ്വഭാവം സൂചിപ്പിക്കുന്നു; ഈ പ്രയോഗം അത് സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: γεωργὸν
  choice: കർഷകൻ
  rationale: നിലം കൃഷി ചെയ്യുന്ന ആളെ സൂചിപ്പിക്കുന്നതിന് ആധുനിക മലയാളത്തിലെ വ്യക്തവും സാധാരണവുമായ പദമാണിത്.
- source_word: δεῖ
  choice: ലഭിക്കേണ്ടത്
  rationale: δεῖ സൂചിപ്പിക്കുന്ന ആവശ്യകതയെയോ ബാധ്യതയെയോ ‘-േണ്ടത്’ എന്ന രൂപം സംക്ഷിപ്തമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: πρῶτον
  choice: ആദ്യം
  rationale: വിളവിൽ പങ്കു ലഭിക്കുന്നതിലെ മുൻഗണനയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; അധ്വാനം ആദ്യം ചെയ്യണം എന്ന സമയക്രമമല്ല.
- source_word: τῶν καρπῶν
  choice: വിളവിൽനിന്ന്
  rationale: കൃഷിസന്ദർഭത്തിൽ καρποί എന്നത് വയലിലെ ഉൽപ്പന്നത്തെ പൊതുവായി സൂചിപ്പിക്കുന്നു; ‘വിളവ്’ അതിന്റെ സ്വാഭാവിക മലയാളസമാനമാണ്. ജനിറ്റീവ് രൂപത്തോടുള്ള പങ്കാളിത്തബന്ധം ‘-ൽനിന്ന്’ വ്യക്തമാക്കുന്നു.
- source_word: μεταλαμβάνειν
  choice: പങ്കു ലഭിക്കുക
  rationale: μεταλαμβάνω എന്നത് ഒന്നിൽ പങ്കുചേരുക അഥവാ അതിൽനിന്ന് ഒരു പങ്ക് കൈപ്പറ്റുക എന്നാണ്; ‘പങ്കു ലഭിക്കുക’ ഇവിടെ അർത്ഥം വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: സദൃശവാക്യസ്വഭാവമുള്ള പ്രസ്താവനയുടെ ഊന്നൽ
  choice: അധ്വാനിക്കുന്ന കർഷകനാണ് അധ്വാനഫലത്തിൽ ആദ്യം പങ്കു ലഭിക്കേണ്ടത്.
  alternative: കർഷകൻ വിളവിൽ പങ്കുകൊള്ളുന്നതിനുമുമ്പ് ആദ്യം അധ്വാനിക്കണം.
  rationale: ഗ്രീക്ക് പദക്രമവും വാക്യഘടനയും πρῶτον എന്നതിനെ μεταλαμβάνειν എന്ന ക്രിയാഭാവത്തോടാണ് ഏറ്റവും സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നത്. അതിനാൽ ഊന്നൽ അധ്വാനത്തിന്റെ സമയക്രമത്തിലല്ല, വിളവിലെ പങ്കാളിത്തത്തിനുള്ള മുൻഗണനയിലാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഭാഷ ഉപയോഗിച്ചു. ഗ്രീക്കിലെ ആവശ്യകത, തുടർച്ചയായ കഠിനാധ്വാനം, വിളവിലെ മുൻഗണനാപൂർവമായ പങ്കാളിത്തം എന്നിവ നിലനിർത്തി.
