id: 2TI.2.23
reference: 2 Timothy 2:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τὰς δὲ μωρὰς καὶ ἀπαιδεύτους ζητήσεις παραιτοῦ, εἰδὼς ὅτι γεννῶσι μάχας·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/023.yaml
  text: But refuse foolish and ignorant controversies[b][a], knowing that they produce quarrels.
translation:
  language: ml
  text: എന്നാൽ ബുദ്ധിശൂന്യവും അറിവില്ലാത്തതുമായ വാദപ്രശ്നങ്ങൾ[a] ഒഴിവാക്കുക; അവ കലഹങ്ങൾക്കു ജന്മം നൽകുന്നു[b] എന്നു നീ അറിയുന്നുവല്ലോ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ചോദ്യങ്ങൾ’ അല്ലെങ്കിൽ ‘വിവാദങ്ങൾ.’ ഗ്രീക്ക് പദത്തിന് അന്വേഷണങ്ങൾ എന്നും അർഥമാകാം; എന്നാൽ ഇവിടെ സത്യസന്ധമായ അന്വേഷണത്തേക്കാൾ കലഹമുണ്ടാക്കുന്ന തർക്കങ്ങളെയാണ് സാധ്യതയേറിയവിധം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘ജനിപ്പിക്കുന്നു.’ കലഹങ്ങൾ ഉണ്ടാക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന രൂപകപ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: μωρὰς
  choice: ബുദ്ധിശൂന്യമായ
  rationale: വിവേകമോ നല്ല ബോധമോ ഇല്ലാത്തതിനെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀπαιδεύτους
  choice: അറിവില്ലാത്ത
  rationale: പരിശീലനത്തിന്റെയോ പഠിപ്പിന്റെയോ അഭാവമാണ് ഗ്രീക്ക് പദം സൂചിപ്പിക്കുന്നത്. ഇവിടെ വിഷയങ്ങളെ വിശേഷിപ്പിക്കുമ്പോൾ ‘അറിവില്ലാത്ത’ എന്നത് സ്വാഭാവികമാണ്; അവ വെറും സത്യസന്ധമായ അന്വേഷണങ്ങളല്ലെന്ന ഭാവവും നൽകുന്നു.
- source_word: ζητήσεις
  choice: വാദപ്രശ്നങ്ങൾ
  rationale: ഈ പദത്തിന് ചോദ്യങ്ങൾ, അന്വേഷണങ്ങൾ, വിവാദങ്ങൾ എന്നീ അർഥങ്ങൾ വരാം. സന്ദർഭത്തിലെ കലഹഫലം കണക്കിലെടുത്ത് തർക്കസ്വഭാവം വ്യക്തമാക്കുന്ന ‘വാദപ്രശ്നങ്ങൾ’ തിരഞ്ഞെടുത്തു.
- source_word: παραιτοῦ
  choice: ഒഴിവാക്കുക
  rationale: ഇത്തരം കാര്യങ്ങളിൽ ഏർപ്പെടാതെ മാറിനിൽക്കണമെന്ന മധ്യമപ്രയോഗത്തിലുള്ള ആജ്ഞയെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: εἰδὼς
  choice: എന്നു നീ അറിയുന്നുവല്ലോ
  rationale: ആജ്ഞയ്ക്കുള്ള കാരണമായി വരുന്ന കൃദ്യന്തരൂപത്തെ വ്യക്തവും സംഭാഷണസഹജവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: γεννῶσι
  choice: ജന്മം നൽകുന്നു
  rationale: ‘ജനിപ്പിക്കുന്നു’ എന്ന ഗ്രീക്ക് രൂപകത്തെ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: μάχας
  choice: കലഹങ്ങൾ
  rationale: ഇവിടെ ശാരീരിക പോരാട്ടത്തേക്കാൾ വാക്കുതർക്കവും ബന്ധപരമായ സംഘർഷവുമാണ് ഉദ്ദേശിക്കുന്നത്; ‘കലഹങ്ങൾ’ അതിന് യോജിക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തോടുള്ള മൃദുവായ വൈരുധ്യം സൂചിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലത്തിലെ ആജ്ഞാഭാവവും ‘ജനിപ്പിക്കുക’ എന്ന രൂപകവും നിലനിർത്തി; ζητήσεις എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
