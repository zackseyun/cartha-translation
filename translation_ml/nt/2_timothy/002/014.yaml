id: 2TI.2.14
reference: 2 Timothy 2:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ταῦτα ὑπομίμνῃσκε, διαμαρτυρόμενος ἐνώπιον τοῦ ⸀κυρίου, μὴ λογομαχεῖν, ⸀ἐπ’ οὐδὲν χρήσιμον, ἐπὶ καταστροφῇ τῶν ἀκουόντων.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/014.yaml
  text: Keep reminding them of these things[a], solemnly charging them before the Lord not to quarrel about words[b], which is useful for nothing and leads to the ruin of those who hear.
translation:
  language: ml
  text: ഈ കാര്യങ്ങൾ അവരെ നിരന്തരം ഓർമിപ്പിക്കുക. വാക്കുകളെച്ചൊല്ലി തർക്കിക്കരുതെന്ന് കർത്താവിന്റെ സന്നിധിയിൽ[b] അവരോടു ഗൗരവപൂർവം ഉറപ്പിച്ചു പറയുക. അത്തരം തർക്കം യാതൊരു പ്രയോജനവുമില്ലാത്തതാണ്[a]; അത് കേൾക്കുന്നവരുടെ നാശത്തിന് ഇടയാക്കുകയും ചെയ്യുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യാതൊരു പ്രയോജനത്തിനുമല്ല.’
    reason: lexical_alternative
  - marker: b
    text: ‘കർത്താവിന്റെ സന്നിധിയിൽ’ എന്നത് ദൈവിക സാക്ഷ്യത്തെ പൊതുവായി സൂചിപ്പിക്കാം; ഇവിടെ ‘കർത്താവ്’ പ്രത്യേകമായി കർത്താവായ യേശുവിനെയാണോ, കൂടുതൽ പൊതുവായി ദൈവത്തെയാണോ സൂചിപ്പിക്കുന്നത് എന്നു പാഠം വ്യക്തമാക്കുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: Ταῦτα
  choice: ഈ കാര്യങ്ങൾ
  rationale: മുമ്പ് പറഞ്ഞ ഉപദേശങ്ങളിലേക്കു തിരിഞ്ഞുനോക്കുന്ന നപുംസകലിംഗ ബഹുവചന സർവനാമത്തിന്റെ സൂചന നിലനിർത്തുന്നു.
- source_word: ὑπομίμνῃσκε
  choice: നിരന്തരം ഓർമിപ്പിക്കുക
  rationale: വർത്തമാനകാല ആജ്ഞാരൂപത്തിലെ തുടർച്ചയോ ആവർത്തനമോ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: διαμαρτυρόμενος
  choice: ഗൗരവപൂർവം ആജ്ഞാപിക്കുക
  rationale: ശക്തമായ സാക്ഷ്യപ്പെടുത്തലോടുകൂടിയ ഗൗരവമേറിയ നിർദേശം എന്ന ആശയം ഇടയപരിപാലനസന്ദർഭത്തിന് യോജിച്ചവിധം നൽകുന്നു; കർമം സന്ദർഭത്തിൽനിന്ന് ‘അവരോട്’ എന്നു വ്യക്തമാക്കിയിരിക്കുന്നു.
- source_word: ἐνώπιον τοῦ κυρίου
  choice: കർത്താവിന്റെ സന്നിധിയിൽ
  rationale: ദൈവിക സാക്ഷ്യത്തിന്റെയും ഉത്തരവാദിത്വത്തിന്റെയും ഗൗരവം സൂചിപ്പിക്കുന്ന പ്രയോഗം; κύριος എന്നതിന്റെ വ്യക്തമായിട്ടില്ലാത്ത സൂചന ‘കർത്താവ്’ എന്ന പദത്തിൽ നിലനിർത്തുന്നു.
- source_word: μὴ λογομαχεῖν
  choice: വാക്കുകളെച്ചൊല്ലി തർക്കിക്കരുത്
  rationale: വാക്കുകളെ ആസ്പദമാക്കിയുള്ള ഫലശൂന്യമായ വാദപ്രതിവാദം എന്ന നിന്ദാസൂചന സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἐπ’ οὐδὲν χρήσιμον
  choice: ഒരു പ്രയോജനവും നൽകുന്നില്ല
  rationale: പൂർണമായ പ്രയോജനശൂന്യത വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; ഈ വാക്യഭാഗം വാക്കുതർക്കത്തോടാണ് ബന്ധിപ്പിച്ചിരിക്കുന്നത്.
- source_word: ἐπὶ καταστροφῇ
  choice: നാശത്തിന് ഇടയാക്കുന്നു
  rationale: καταστροφήയുടെ ശക്തമായ ദോഷഫലവും ἐπί സൂചിപ്പിക്കുന്ന പരിണതഫലവും വ്യക്തമായി നൽകുന്നു.
- source_word: τῶν ἀκουόντων
  choice: കേൾക്കുന്നവരുടെ
  rationale: നാമവൽക്കരിച്ച വർത്തമാന കൃദന്തരൂപത്തിന്റെ തുടർച്ചയായ ശ്രവണസൂചന ലളിതവും വിശാലവുമായ രീതിയിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: κύριος എന്നതിന്റെ സൂചിത വ്യക്തി
  choice: കർത്താവ്
  alternative: ദൈവം; കർത്താവായ യേശു
  rationale: ഗ്രീക്ക് പാഠം പ്രത്യേകമായി ആരെന്നു നിർണയിക്കാതെ ‘കർത്താവ്’ എന്നു മാത്രമാണ് പറയുന്നത്. അതിനാൽ യേശുവിനെയോ പിതാവായ ദൈവത്തെയോ എന്നു വിവർത്തനത്തിൽ ചുരുക്കാതെ യഥാർത്ഥ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘വാക്കുകളെച്ചൊല്ലി തർക്കിക്കുക’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ ഗ്രീക്കിലെ നിന്ദാസൂചനയും നിലനിർത്തുന്നു. ദീർഘമായ ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി മൂന്ന് മലയാള വാക്യങ്ങളാക്കി; ആശയബന്ധം ‘അത്തരം തർക്കം’, ‘മറിച്ച്’ എന്നിവകൊണ്ട് വ്യക്തമാക്കിയിരിക്കുന്നു.
