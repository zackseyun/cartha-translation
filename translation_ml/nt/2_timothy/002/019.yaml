id: 2TI.2.19
reference: 2 Timothy 2:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ μέντοι στερεὸς θεμέλιος τοῦ θεοῦ ἕστηκεν, ἔχων τὴν σφραγῖδα ταύτην· Ἔγνω κύριος τοὺς ὄντας αὐτοῦ, καί· Ἀποστήτω ἀπὸ ἀδικίας πᾶς ὁ ὀνομάζων τὸ ὄνομα κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/019.yaml
  text: 'Nevertheless[a], the firm foundation of God stands, having this seal: “The Lord knows those who are his,” and[b], “Let everyone who names the name of the Lord depart from unrighteousness.”'
translation:
  language: ml
  text: 'എന്നിരുന്നാലും, ദൈവത്തിന്റെ ഉറച്ച അടിത്തറ നിലനിൽക്കുന്നു; അത് ഈ മുദ്ര വഹിക്കുന്നു[a]: “കർത്താവ് തനിക്കുള്ളവരെ അറിയുന്നു”; കൂടാതെ, “കർത്താവിന്റെ നാമം എടുത്തുപറയുന്ന ഏവനും[b] അനീതിയിൽനിന്ന് വിട്ടകലട്ടെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഈ ലിഖിതം വഹിക്കുന്നു.” ‘മുദ്ര’ എന്നു പരിഭാഷപ്പെടുത്തിയ പദം ഒരു മുദ്രയിലെ തിരിച്ചറിയൽചിഹ്നത്തെയോ ലിഖിതത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “കർത്താവിന്റെ നാമം വിളിച്ചപേക്ഷിക്കുന്ന ഏവനും.” ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘കർത്താവിന്റെ നാമം നാമകരിക്കുന്നവൻ’ എന്നാണ്; ഇത് അവനെ വിളിച്ചപേക്ഷിക്കുന്നതിനെയോ അവനോടുള്ള കൂറ് ഏറ്റുപറയുന്നതിനെയോ സൂചിപ്പിക്കുന്ന ശൈലിയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: μέντοι
  choice: എന്നിരുന്നാലും
  rationale: മുമ്പ് പറഞ്ഞ വ്യാജോപദേശത്തിന്റെ പശ്ചാത്തലത്തോടുള്ള ശക്തമായ വൈരുധ്യം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: στερεὸς θεμέλιος
  choice: ഉറച്ച അടിത്തറ
  rationale: സ്ഥിരതയും നിലനിൽപ്പും സൂചിപ്പിക്കുന്ന രൂപകം വ്യക്തവും സ്വാഭാവികവുമായി സംരക്ഷിക്കുന്നു.
- source_word: τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ
  rationale: ഉടമസ്ഥത, ഉറവിടം, സ്വഭാവബന്ധം എന്നിവയിൽ ഒന്നിനെ മാത്രം നിർബന്ധിച്ച് നിശ്ചയിക്കാതെ ഗ്രീക്ക് ഷഷ്ഠീവിഭക്തിബന്ധം നിലനിർത്തുന്നു.
- source_word: ἕστηκεν
  choice: നിലനിൽക്കുന്നു
  rationale: പെർഫെക്റ്റ് ക്രിയയുടെ ഉറച്ചുനിൽക്കുന്ന നിലവിലെ അവസ്ഥ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἔχων τὴν σφραγῖδα ταύτην
  choice: ഈ മുദ്ര വഹിക്കുന്നു
  rationale: തിരിച്ചറിയലോ ആധികാരികതയോ സൂചിപ്പിക്കുന്ന മുദ്രയുടെ രൂപകം നിലനിർത്തുന്നു; ലിഖിതമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: Ἔγνω
  choice: അറിയുന്നു
  rationale: ഉദ്ധരണിയിലെ കാലാതീതവും നിലനിൽക്കുന്നതുമായ ദൈവിക അറിവ് സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: κύριος
  choice: കർത്താവ്
  rationale: തിരുവെഴുത്തുസംബന്ധമായ ഭാരമുള്ള κύριος എന്ന പദത്തിന്റെ പതിവായതും ഗൗരവമുള്ളതുമായ മലയാളരൂപം ഉപയോഗിക്കുന്നു.
- source_word: τοὺς ὄντας αὐτοῦ
  choice: തനിക്കുള്ളവരെ
  rationale: അവനോടുള്ള സ്വന്തബന്ധവും അവന്റെ ജനമെന്ന തിരിച്ചറിയലും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: Ἀποστήτω
  choice: വിട്ടകലട്ടെ
  rationale: അനീതിയിൽനിന്നുള്ള നിർണായകമായ വേർപാടിനുള്ള ആജ്ഞയുടെ ശക്തി പ്രകടമാക്കുന്നു.
- source_word: ἀπὸ ἀδικίας
  choice: അനീതിയിൽനിന്ന്
  rationale: തെറ്റ്, അധാർമികത, അന്യായം എന്നിവ ഉൾക്കൊള്ളാവുന്ന വിശാലമായ നൈതിക അർഥം സംരക്ഷിക്കുന്നു.
- source_word: πᾶς ὁ ὀνομάζων τὸ ὄνομα κυρίου
  choice: കർത്താവിന്റെ നാമം ഉച്ചരിക്കുന്ന ഏവനും
  rationale: ഗ്രീക്കിലെ ‘നാമം നാമകരണം ചെയ്യുന്ന’ എന്ന വാക്യഘടനയുടെ പ്രതിധ്വനി സൂക്ഷിക്കുമ്പോഴും മലയാളത്തിൽ അസ്വാഭാവികമായ ആവർത്തനം ഒഴിവാക്കുന്നു; വിളിച്ചപേക്ഷിക്കൽ അല്ലെങ്കിൽ കൂറ് ഏറ്റുപറയൽ എന്ന പ്രയോഗാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: രണ്ട് മുദ്രാവാക്യങ്ങളിലുമുള്ള ‘കർത്താവ്’ എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: രണ്ടിടത്തും ‘കർത്താവ്’ എന്നു മാത്രം പരിഭാഷപ്പെടുത്തി, പിതാവിനെയോ ക്രിസ്തുവിനെയോ പ്രത്യേകം നിർണ്ണയിച്ചില്ല.
  alternative: രണ്ടിടത്തും പിതാവായ ദൈവമെന്ന് വ്യാഖ്യാനിക്കുക; രണ്ടിടത്തും ക്രിസ്തുവെന്ന് വ്യാഖ്യാനിക്കുക; അല്ലെങ്കിൽ രണ്ടു വാക്യങ്ങളിലും വ്യത്യസ്ത സൂചിതവ്യക്തികളെ കാണുക.
  rationale: ഗ്രീക്ക് പാഠം κύριος എന്ന പദത്തിന്റെ സൂചിതവ്യക്തിയെ തുറന്ന് വ്യക്തമാക്കുന്നില്ല. പഴയ തിരുവെഴുത്തിലെ ഭാഷ ക്രിസ്തീയ സന്ദർഭത്തിൽ പ്രയോഗിക്കുന്നതിലൂടെ ഉണ്ടാകുന്ന ദൈവശാസ്ത്രപരമായ സാന്ദ്രത പരിഭാഷയിൽ പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ തിരുവെഴുത്തുശൈലി സ്വീകരിച്ചു. ‘അടിത്തറ’, ‘മുദ്ര’, ‘വിട്ടകലട്ടെ’ എന്നീ പദങ്ങൾ മൂലത്തിലെ രൂപകവും ആജ്ഞയുടെ ശക്തിയും നിലനിർത്തുന്നു; അപൂർവമോ അത്യന്തം സംസ്കൃതവത്കൃതമോ ആയ ഭാഷ ഒഴിവാക്കി.
