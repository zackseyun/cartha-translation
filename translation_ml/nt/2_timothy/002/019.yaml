revisions:
- from: 'എന്നിരുന്നാലും, ദൈവത്തിന്റെ ഉറച്ച അടിത്തറ നിലനിൽക്കുന്നു; അത് ഈ മുദ്ര വഹിക്കുന്നു[a]: “കർത്താവ് തനിക്കുള്ളവരെ അറിയുന്നു”; കൂടാതെ, “കർത്താവിന്റെ നാമം ഉച്ചരിക്കുന്ന ഏവനും[b] അനീതിയിൽനിന്ന് വിട്ടകലട്ടെ.”'
  to: 'എന്നിരുന്നാലും, ദൈവത്തിന്റെ ഉറച്ച അടിത്തറ നിലനിൽക്കുന്നു; അത് ഈ മുദ്ര വഹിക്കുന്നു[a]: “കർത്താവ് തനിക്കുള്ളവരെ അറിയുന്നു”; കൂടാതെ, “കർത്താവിന്റെ നാമം എടുത്തുപറയുന്ന ഏവനും[b] അനീതിയിൽനിന്ന് വിട്ടകലട്ടെ.”'
  rationale: The revision replaces a wording that can denote only pronunciation with “എടുത്തുപറയുന്ന,” which better carries the Greek expression’s naming/profession dimension while leaving its full idiomatic range open through the footnote. Footnote b is corrected to avoid the inaccurate ‘നാമകരണം ചെയ്യുന്ന’ explanation and to preserve the source’s ambiguity between invocation and profession.
