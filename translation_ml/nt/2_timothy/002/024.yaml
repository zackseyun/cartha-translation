  text: And the Lord’s servant must not quarrel[a], but must be gentle toward everyone, able to teach, patient when wronged,
translation:
  language: ml
  text: കർത്താവിന്റെ ദാസൻ[a] കലഹിക്കരുത്; പകരം, എല്ലാവരോടും സൗമ്യതയുള്ളവനും പഠിപ്പിക്കാൻ കഴിവുള്ളവനും അനീതി ക്ഷമയോടെ സഹിക്കുന്നവനും ആയിരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കർത്താവിന്റെ അടിമ.” ഗ്രീക്കിലെ δοῦλος എന്ന പദത്തിന് സന്ദർഭമനുസരിച്ച് “ദാസൻ” എന്നോ “അടിമ” എന്നോ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλον
  choice: ദാസൻ
  rationale: δοῦλος എന്ന പദത്തിന് സന്ദർഭമനുസരിച്ച് ദാസൻ എന്നും അടിമ എന്നും അർഥമാകാം. ഇവിടെ കർത്താവിനെ സേവിക്കുന്ന ഒരാളിൽ ആവശ്യമായ പെരുമാറ്റമാണ് പ്രധാനം; അതിനാൽ സ്വാഭാവികമായ ‘ദാസൻ’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു, ‘അടിമ’ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: κυρίου
  choice: കർത്താവിന്റെ
  rationale: κυρίου എന്ന ജനിറ്റീവ് രൂപം മലയാളത്തിൽ സ്വാഭാവികമായി ‘കർത്താവിന്റെ’ എന്നു നൽകി.
- source_word: οὐ δεῖ μάχεσθαι
  choice: കലഹിക്കരുത്
  rationale: δεῖയുടെ നിർബന്ധസ്വഭാവവും μάχεσθαιയുടെ ഈ സന്ദർഭത്തിലെ വാക്കുതർക്കപരമായ അർഥവും സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἤπιον εἶναι πρὸς πάντας
  choice: എല്ലാവരോടും സൗമ്യതയുള്ളവൻ ആയിരിക്കണം
  rationale: ἤπιος സൂചിപ്പിക്കുന്ന മൃദുവും കലഹരഹിതവുമായ പെരുമാറ്റവും πρὸς πάντας എന്നതിന്റെ സർവവ്യാപക പരിധിയും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: διδακτικόν
  choice: പഠിപ്പിക്കാൻ കഴിവുള്ളവൻ
  rationale: ഈ പദം ‘പഠിക്കാൻ തയ്യാറുള്ളവൻ’ എന്നതല്ല, പഠിപ്പിക്കാൻ യോഗ്യതയോ പ്രാപ്തിയോ ഉള്ളവൻ എന്നാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἀνεξίκακον
  choice: ദ്രോഹം സഹിക്കുന്നവൻ
  rationale: അപൂർവമായ ഈ പദം മറ്റുള്ളവർ ചെയ്യുന്ന ദോഷമോ അനീതിയോ പ്രതികാരമില്ലാതെ സഹിക്കുന്ന സ്വഭാവത്തെ സൂചിപ്പിക്കുന്നു. ‘ക്ഷമയുള്ളവൻ’ എന്ന പൊതുപദത്തേക്കാൾ സന്ദർഭാർഥം വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: ശുശ്രൂഷാസംബന്ധമായ നിർദേശത്തിൽ δοῦλος എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: ദാസൻ
  alternative: അടിമ
  rationale: ഈ വാക്യത്തിന്റെ ഊന്നൽ സാമൂഹികമായി ബന്ധിക്കപ്പെട്ട നിലയിലല്ല, കർത്താവിനെ സേവിക്കുന്നയാളുടെ പെരുമാറ്റത്തിലാണ്. അതിനാൽ ‘ദാസൻ’ മുഖ്യപാഠത്തിൽ സ്വാഭാവികമാണ്; മൂലപദത്തിന്റെ ശക്തമായ മറ്റർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: κύριος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: കർത്താവ്
  alternative: യജമാനൻ
  rationale: പുതിയനിയമത്തിലെ ഈ ശീർഷകത്തിന് പതിവും സന്ദർഭോചിതവുമായ മലയാളരൂപം ‘കർത്താവ്’ ആണ്; ഇവിടെ ‘യജമാനൻ’ ആവശ്യപ്പെടുന്ന പ്രത്യേക സൂചനയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിലെ വിരോധഘടന ‘കലഹിക്കരുത്; പകരം’ എന്ന രൂപത്തിൽ നിലനിർത്തി. ഗുണവിശേഷണങ്ങളുടെ പട്ടിക മലയാളത്തിൽ ഏകീകൃതമായ ‘-വൻ’ ഘടനയിൽ നൽകി.
