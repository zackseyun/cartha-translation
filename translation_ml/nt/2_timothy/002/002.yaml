id: 2TI.2.2
reference: 2 Timothy 2:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἃ ἤκουσας παρ’ ἐμοῦ διὰ πολλῶν μαρτύρων, ταῦτα παράθου πιστοῖς ἀνθρώποις, οἵτινες ἱκανοὶ ἔσονται καὶ ἑτέρους διδάξαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/002.yaml
  text: And what you heard from me in the presence of many witnesses[a], entrust these things to faithful men[b], who will be competent to teach others also.
translation:
  language: ml
  text: അനേകം സാക്ഷികളുടെ സാന്നിധ്യത്തിൽ എന്നിൽനിന്ന് നീ കേട്ട ഈ കാര്യങ്ങൾ[a], മറ്റുള്ളവരെയും പഠിപ്പിക്കാൻ പ്രാപ്തരായിരിക്കുന്ന വിശ്വസ്തരായ ആളുകൾക്ക് ഏൽപ്പിക്കുക[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അനേകം സാക്ഷികളുടെ മുമ്പാകെ.” ഗ്രീക്ക് പ്രയോഗം, അനേകം സാക്ഷികൾ സന്നിഹിതരായിരിക്കെ പൗലോസിന്റെ ഉപദേശം നൽകപ്പെട്ടു എന്ന അർഥം സൂചിപ്പിക്കാം; സാധ്യത കുറവാണെങ്കിലും, “അനേകം സാക്ഷികളിലൂടെ” എന്നും മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ “വിശ്വസ്തരായ മനുഷ്യർ/ആളുകൾ” എന്നാണ്; രൂപം വ്യാകരണപരമായി പുല്ലിംഗ ബഹുവചനമാണ്. അതിനെ “വിശ്വസ്തരായ പുരുഷന്മാർ” എന്നും വിവർത്തനം ചെയ്യാം; എന്നാൽ പൊതുവായോ പ്രതിനിധാനാർഥത്തിലോ ഉപയോഗിച്ചിരിക്കാനും കഴിയും.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ ἤκουσας παρ’ ἐμοῦ
  choice: എന്നിൽനിന്നു നീ കേട്ട കാര്യങ്ങൾ
  rationale: ഉപദേശത്തിന്റെ ഉള്ളടക്കത്തെ സൂചിപ്പിക്കുന്ന നപുംസകലിംഗ ബഹുവചന സർവനാമവും, കേട്ടതിന്റെ ഉറവിടമായി പൗലോസിനെ സൂചിപ്പിക്കുന്ന παρά + genitive ഘടനയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: διὰ πολλῶν μαρτύρων
  choice: അനേകം സാക്ഷികളുടെ സന്നിധിയിൽവെച്ച്
  rationale: διά + genitive ഇവിടെ ഉപദേശം അനേകം സാക്ഷികൾ സന്നിഹിതരായിരിക്കെ പരസ്യമായി ലഭിച്ചതിനെ സൂചിപ്പിക്കുന്നതാണ് ഏറ്റവും സാധ്യതയുള്ളത്. എന്നാൽ ‘സാക്ഷികളിലൂടെ’ എന്ന ഉപാധിയർഥം വ്യാകരണപരമായി സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: παράθου
  choice: ഏൽപ്പിക്കുക
  rationale: മറ്റൊരാളുടെ ഉത്തരവാദിത്വത്തിലും സംരക്ഷണത്തിലും ഒരു കാര്യം ഭരമേൽപ്പിക്കുന്ന അർഥം നൽകുന്ന, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗം.
- source_word: πιστοῖς ἀνθρώποις
  choice: വിശ്വസ്തരായ മനുഷ്യരെ
  rationale: πιστός എന്നതിലെ വിശ്വാസ്യതയും ἀνθρώποις എന്ന പദത്തിന്റെ മനുഷ്യർ/വ്യക്തികൾ എന്ന അർഥവും നൽകുന്നു. ഗ്രീക്കിലെ വ്യാകരണപരമായ പുല്ലിംഗരൂപത്തിന്റെ പ്രതിനിധാനസാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἱκανοὶ ἔσονται
  choice: പ്രാപ്തരായിരിക്കാവുന്ന
  rationale: ആവശ്യമായ കഴിവും യോഗ്യതയും ഉണ്ടായിരിക്കും എന്ന ഭാവികാല ആശയം മലയാളത്തിൽ തിരഞ്ഞെടുക്കപ്പെടേണ്ടവരുടെ സവിശേഷതയായി സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: καὶ ἑτέρους διδάξαι
  choice: മറ്റുള്ളവരെയും പഠിപ്പിക്കാൻ
  rationale: καίയിലെ ‘യും/കൂടി’ എന്ന ഉൾക്കൊള്ളുന്ന ഊന്നലും ἑτέρους എന്നതിലെ മറ്റുള്ളവർ എന്ന അർഥവും നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: πιστοῖς എന്നതിന്റെ അർഥവ്യാപ്തി
  choice: വിശ്വസ്തരായ
  alternative: വിശ്വാസികളായ
  rationale: സന്ദർഭത്തിൽ ലഭിച്ച ഉപദേശം ഉത്തരവാദിത്വത്തോടെ മറ്റുള്ളവർക്കു കൈമാറാനുള്ള ആശ്രയയോഗ്യതയാണ് മുഖ്യമായത്; ‘വിശ്വസ്തർ’ എന്നത് ഈ അർഥം നൽകുന്നതിനൊപ്പം വിശ്വാസബന്ധിയായ പ്രതിധ്വനിയും പൂർണമായി ഇല്ലാതാക്കുന്നില്ല.
- issue: πιστοῖς ἀνθρώποις എന്നതിലെ ലിംഗസൂചന
  choice: വിശ്വസ്തരായ മനുഷ്യരെ
  alternative: വിശ്വസ്തരായ പുരുഷന്മാരെ
  rationale: ἄνθρωπος സാധാരണയായി ‘മനുഷ്യൻ/വ്യക്തി’ എന്ന പൊതുവായ അർഥത്തിൽ വരാം; ബഹുവചന പുല്ലിംഗരൂപം പുരുഷന്മാരെ മാത്രം നിർബന്ധമായി പരിമിതപ്പെടുത്തുന്നില്ല. അതിനാൽ മലയാളത്തിൽ യഥാർഥമായ അർഥവ്യാപ്തി നിലനിർത്തുകയും വ്യാകരണരൂപത്തിന്റെ സാധ്യത അടിക്കുറിപ്പിൽ അറിയിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സന്നിധിയിൽവെച്ച്,’ ‘ഏൽപ്പിക്കുക,’ ‘പ്രാപ്തർ’ എന്നിവ സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായിരിക്കെ മൂലത്തിലെ പരസ്യസാക്ഷ്യം, ഭരമേൽപ്പിക്കൽ, അധ്യാപനയോഗ്യത എന്നീ ആശയങ്ങൾ നിലനിർത്തുന്നു.
