revisions:
- from: 'അതുകൊണ്ട്, ആരെങ്കിലും ഇവയിൽനിന്ന് തന്നെ ശുദ്ധീകരിച്ചാൽ, ആ വ്യക്തി മാനത്തിനുള്ള പാത്രവും[a], വിശുദ്ധീകരിക്കപ്പെട്ടവനും[b], യജമാനന് ഉപകാരപ്രദനും, എല്ലാ നല്ല പ്രവൃത്തിക്കും ഒരുക്കപ്പെട്ടവനും ആയിരിക്കും.


    [a] അഥവാ, “മാന്യമായ ഉപയോഗത്തിനുള്ള പാത്രം.”

    [b] അഥവാ, “വിശുദ്ധനാക്കപ്പെട്ടവൻ” അല്ലെങ്കിൽ “വേർതിരിക്കപ്പെട്ടവൻ.”'
  to: 'അതുകൊണ്ട്, ആരെങ്കിലും ഇവയിൽനിന്ന് തന്നെത്തന്നെ ശുദ്ധീകരിച്ചാൽ, ആ വ്യക്തി മാനത്തിനുള്ള ഒരു പാത്രമായിരിക്കും: വിശുദ്ധീകരിക്കപ്പെട്ടതും[b] യജമാനന് ഉപകാരപ്രദവും എല്ലാ നല്ല പ്രവൃത്തിക്കും ഒരുക്കപ്പെട്ടതുമായ ഒരു പാത്രം[a].


    [a] അഥവാ, “മാന്യമായ ഉപയോഗത്തിനുള്ള പാത്രം.”


    [b] അഥവാ, “വിശുദ്ധമാക്കപ്പെട്ടത്” അല്ലെങ്കിൽ “വേർതിരിക്കപ്പെട്ടത്.”'
  rationale: 'The revision retains the draft’s lexical choices and ambiguity while correcting the grammatical relationship required by the Greek: the vessel is sanctified, useful to the master, and prepared for every good work. The footnote anchors are placed on the expressions they explain, and footnote b is adjusted to neuter agreement.'
