id: 2TI.1.5
reference: 2 Timothy 1:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὑπόμνησιν ⸀λαβὼν τῆς ἐν σοὶ ἀνυποκρίτου πίστεως, ἥτις ἐνῴκησεν πρῶτον ἐν τῇ μάμμῃ σου Λωΐδι καὶ τῇ μητρί σου Εὐνίκῃ, πέπεισμαι δὲ ὅτι καὶ ἐν σοί.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/005.yaml
  text: having been reminded of the sincere faith in you, which first lived in your grandmother Lois and your mother Eunice, I am persuaded that it is also in you.
translation:
  language: ml
  text: നിന്നിലുള്ള കപടമില്ലാത്ത വിശ്വാസത്തെക്കുറിച്ച് ഓർമിപ്പിക്കപ്പെട്ടതുകൊണ്ട്, അത് ആദ്യം നിന്റെ മുത്തശ്ശി ലോയിസിലും നിന്റെ അമ്മ യൂനീക്കയിലും വസിച്ചിരുന്നു എന്നും നിന്നിലും ഉണ്ടെന്നും എനിക്ക് ഉറപ്പുണ്ട്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπόμνησιν λαβών
  choice: എനിക്ക് ഓർമവന്നു
  rationale: ഓർമിപ്പിക്കപ്പെട്ടതിന്റെ ഫലമായി ഓർക്കുക എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ഓർമിപ്പിച്ചത് ആരോ എന്തോ എന്നത് മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ അതും തുറന്നുവയ്ക്കുന്നു.
- source_word: ἀνυποκρίτου πίστεως
  choice: കപടമില്ലാത്ത വിശ്വാസം
  rationale: ἀνυπόκριτος എന്നതിന്റെ ‘വ്യാജമോ കപടമോ ഇല്ലാത്ത’ അർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἐνῴκησεν
  choice: വസിച്ചിരുന്നു
  rationale: ‘ഉള്ളിൽ പാർക്കുക/വസിക്കുക’ എന്ന രൂപകത്തെ നിലനിർത്തുന്നു; വെറും ‘ഉണ്ടായിരുന്നു’ എന്നതിലേക്കു ചുരുക്കുന്നില്ല.
- source_word: μάμμῃ
  choice: മുത്തശ്ശി
  rationale: സ്ത്രീലിംഗ ബന്ധപദമായ ‘grandmother’ എന്ന അർഥം ആധുനിക സാധാരണ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: πέπεισμαι
  choice: എനിക്ക് ഉറപ്പുണ്ട്
  rationale: പൂർണകാല രൂപം സൂചിപ്പിക്കുന്ന ഉറച്ച ബോധ്യത്തിന്റെ നിലവിലെ അവസ്ഥയെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘വിശ്വാസം നിന്നിൽ’ എന്ന പ്രയോഗത്തിന്റെ സ്വഭാവം
  choice: നിന്നിലുള്ള കപടമില്ലാത്ത വിശ്വാസം
  alternative: നിന്റെ കപടമില്ലാത്ത വിശ്വാസം
  rationale: ἐν σοί എന്ന ‘നിന്നിൽ’ എന്ന സ്ഥലംസൂചക രൂപം നിലനിർത്തി, വിശ്വാസം വ്യക്തിയിൽ വസിക്കുന്നു എന്ന തുടർന്നുള്ള രൂപകവുമായി ബന്ധം കാത്തുസൂക്ഷിക്കുന്നു.
- issue: കുടുംബാംഗങ്ങളിൽ വിശ്വാസം ‘വസിച്ചു’ എന്ന രൂപകം
  choice: ആ വിശ്വാസം ... വസിച്ചിരുന്നു
  alternative: ആ വിശ്വാസം ... ഉണ്ടായിരുന്നു
  rationale: മൂലപാഠത്തിലെ ἐνοικέω എന്ന ശക്തമായ വാസരൂപകം നിലനിർത്തുന്നു; പാരമ്പര്യമായി വിശ്വാസം സ്വയമേവ കൈമാറപ്പെട്ടു എന്ന അധിക ആശയം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗ്രീക്ക് വാക്യത്തിലെ ദീർഘ ഘടന വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി; ആശയബന്ധം ‘ആ വിശ്വാസം’ എന്ന ആവർത്തനത്തിലൂടെ നിലനിർത്തി. പേരുകൾ ലോവീസ്, യൂനീക്ക എന്നിങ്ങനെ ഗ്രീക്ക് രൂപങ്ങളോട് ചേർന്ന് ലിപ്യന്തരിച്ചു.
