id: 2TI.1.11
reference: 2 Timothy 1:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰς ὃ ἐτέθην ἐγὼ κῆρυξ καὶ ἀπόστολος καὶ ⸀διδάσκαλος.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/011.yaml
  text: for which I was appointed a herald and an apostle and a teacher[a].
translation:
  language: ml
  text: ആ സുവിശേഷത്തിനുവേണ്ടി ഞാൻ ഒരു പ്രഘോഷകനായും അപ്പൊസ്തലനായും അധ്യാപകനായും നിയമിക്കപ്പെട്ടു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς ὃ
  choice: ആ സുവിശേഷത്തിനുവേണ്ടിയാണ്
  rationale: മുൻവാക്യത്തിലെ സുവിശേഷത്തിലേക്കുള്ള പിന്നോട്ടുള്ള സൂചന വ്യക്തമാക്കുകയും εἰς എന്നതിന്റെ ഉദ്ദേശ്യം/ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐτέθην
  choice: എന്നെ ... നിയമിച്ചത്
  rationale: τίθημι എന്ന ക്രിയയുടെ കർമണി രൂപം ഇവിടെ ശുശ്രൂഷാപങ്കുകളിലേക്കുള്ള നിയമനത്തെ സൂചിപ്പിക്കുന്നു; ഭൗതികമായി ‘വെച്ചു’ എന്നതല്ല.
- source_word: ἐγώ
  choice: എന്നെ
  rationale: ഗ്രീക്കിലെ വ്യക്തമായ സർവനാമത്തിന് നേരിയ ഊന്നലുണ്ട്. മലയാളത്തിലെ ‘എന്നെ ... നിയമിച്ചത്’ എന്ന ഘടന അത് അമിതമാക്കാതെ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: κῆρυξ
  choice: വിളംബരക്കാരൻ
  rationale: ഔദ്യോഗികമായി പരസ്യമായി പ്രഖ്യാപിക്കുന്നവൻ എന്ന പദത്തിന്റെ അർത്ഥം നിലനിർത്തുന്നു; ‘പ്രസംഗകൻ’ എന്നത് പിൽക്കാല സഭാപദവിയുടെ ധ്വനി അനാവശ്യമായി വരുത്താം.
- source_word: ἀπόστολος
  choice: അപ്പൊസ്തലൻ
  rationale: പൗലൊസിന്റെ അംഗീകൃത ദൗത്യപദവി സൂചിപ്പിക്കുന്ന സ്ഥാപിതമായ മലയാള ബൈബിൾപദം.
- source_word: διδάσκαλος
  choice: ഉപദേഷ്ടാവ്
  rationale: പഠിപ്പിക്കുന്ന വ്യക്തി എന്ന സാധാരണ അർത്ഥം dignified, current Malayalam-ൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: κῆρυξ എന്നത് പരമ്പരാഗത സഭാപദമായ ‘പ്രസംഗകൻ’ എന്നു വേണമോ, ഔദ്യോഗിക പ്രഖ്യാപകനെ സൂചിപ്പിക്കുന്ന പദമായി വേണമോ
  choice: വിളംബരക്കാരൻ
  alternative: പ്രസംഗകൻ
  rationale: ഗ്രീക്ക് പദത്തിലെ നിയോഗിക്കപ്പെട്ട പൊതുപ്രഖ്യാപകന്റെ ഭാവം മുൻനിർത്തുകയും അതിനെ ഒരു പിൽക്കാല സഭാപദവിയായി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂന്ന് ശുശ്രൂഷാപങ്കുകളുടെ സമാന്തരഘടന കാത്തുസൂക്ഷിച്ചിട്ടുണ്ട്; മൂലപാഠത്തിൽ ഇല്ലാത്ത ആശയങ്ങൾ ചേർത്തിട്ടില്ല.
