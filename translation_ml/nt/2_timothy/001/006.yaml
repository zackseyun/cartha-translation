id: 2TI.1.6
reference: 2 Timothy 1:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: δι’ ἣν αἰτίαν ἀναμιμνῄσκω σε ἀναζωπυρεῖν τὸ χάρισμα τοῦ θεοῦ, ὅ ἐστιν ἐν σοὶ διὰ τῆς ἐπιθέσεως τῶν χειρῶν μου·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/006.yaml
  text: For this reason I remind you to rekindle the gift of God that is in you through the laying on of my hands[a].
translation:
  language: ml
  text: ഇക്കാരണത്താൽ, എന്റെ കൈവെപ്പിലൂടെ നിന്നിലുള്ള ദൈവത്തിന്റെ കൃപാവരം വീണ്ടും ജ്വലിപ്പിക്കണമെന്ന് ഞാൻ നിന്നെ ഓർമിപ്പിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വീണ്ടും ആളിക്കത്തിക്കുക.” ഗ്രീക്ക് ക്രിയ, തീയിനെ വീണ്ടും പൂർണ ജ്വാലയായി ആളിക്കത്തിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ἣν αἰτίαν
  choice: ഇക്കാരണത്താൽ
  rationale: മുൻസന്ദർഭവുമായി ബന്ധിപ്പിക്കുന്ന കാരണസൂചക പ്രയോഗം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നിലനിർത്തുന്നു.
- source_word: ἀναμιμνῄσκω
  choice: ഞാൻ നിന്നെ ഓർമിപ്പിക്കുന്നു
  rationale: വർത്തമാനകാല ക്രിയയെയും വ്യക്തിപരമായ അഭിസംബോധനയെയും വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: σε ἀναζωπυρεῖν
  choice: വീണ്ടും ജ്വലിപ്പിക്കണമെന്ന്
  rationale: അണയാറായ തീയെയോ മങ്ങിയ തീയെയോ വീണ്ടും പൂർണമായി ജ്വലിപ്പിക്കുന്നതിന്റെ രൂപകം നിലനിർത്തുന്നു; ക്രിയയുടെ പുതുക്കൽസൂചനയും പ്രകടമാക്കുന്നു.
- source_word: τὸ χάρισμα τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ കൃപാവരം
  rationale: χάρισμα എന്നത് കൃപയാൽ നൽകപ്പെട്ട വരം എന്ന ആശയം വഹിക്കുന്നു. ‘കൃപാവരം’ അത് അനാവശ്യമായി പ്രത്യേകതരം ആത്മീയവരമായി നിർവചിക്കാതെ സംക്ഷിപ്തമായി അറിയിക്കുന്നു.
- source_word: ὅ ἐστιν ἐν σοὶ
  choice: നിന്നിലുള്ള
  rationale: വരം തിമൊഥെയൊസിൽ ഇപ്പോൾ ഉള്ളതാണെന്ന ബന്ധവാക്യത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: διὰ τῆς ἐπιθέσεως τῶν χειρῶν μου
  choice: എന്റെ കൈകൾ നിന്റെമേൽ വെച്ചതിലൂടെ
  rationale: കൈകൾ വെക്കുക എന്ന ആചാരപരമായ പ്രവൃത്തിയെയും διά + genitive സൂചിപ്പിക്കുന്ന മാർഗം/മാധ്യമം എന്ന ബന്ധത്തെയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: പൗലൊസിന്റെ കൈവെപ്പിലൂടെ വരം ലഭിച്ചതിന്റെ സ്വഭാവം
  choice: എന്റെ കൈകൾ നിന്റെമേൽ വെച്ചതിലൂടെ
  alternative: എന്റെ കൈവെപ്പിനോടനുബന്ധിച്ച്
  rationale: വരം പൗലൊസിന്റെ കൈവെപ്പിലൂടെ തിമൊഥെയൊസിൽ ഉണ്ടെന്ന വാക്യത്തിന്റെ ശക്തമായ മാധ്യമബന്ധം നിലനിർത്തുന്നു; അതേസമയം അതിൽനിന്ന് വികസിതമായ ഒരു പ്രത്യേക കൂദാശാസിദ്ധാന്തം നിർബന്ധമായി വായിച്ചെടുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. തീയുടെ രൂപകം വ്യക്തമായി നിലനിർത്തി; കൈവെപ്പിന്റെ മാധ്യമബന്ധം മൃദൂകരിക്കുകയോ സിദ്ധാന്തപരമായി വികസിപ്പിക്കുകയോ ചെയ്തിട്ടില്ല.
