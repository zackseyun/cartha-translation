  to: ഇക്കാരണത്താൽ, എന്റെ കൈവെപ്പിലൂടെ നിന്നിലുള്ള ദൈവത്തിന്റെ കൃപാവരം വീണ്ടും ജ്വലിപ്പിക്കണമെന്ന് ഞാൻ നിന്നെ ഓർമിപ്പിക്കുന്നു.[a]
