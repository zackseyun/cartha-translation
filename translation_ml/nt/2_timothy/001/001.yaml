id: 2TI.1.1
reference: 2 Timothy 1:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ κατ’ ἐπαγγελίαν ζωῆς τῆς ἐν Χριστῷ Ἰησοῦ
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/001.yaml
  text: Paul[a], an apostle of Messiah Jesus by the will of God, according to the promise of the life that is in Messiah Jesus,
translation:
  language: ml
  text: ദൈവഹിതപ്രകാരം, മശീഹായായ യേശുവിലുള്ള ജീവന്റെ വാഗ്ദത്തമനുസരിച്ച് മശീഹായായ യേശുവിന്റെ[a] അപ്പൊസ്തലനായ പൗലോസ്,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: രണ്ടിടത്തും “ക്രിസ്തുയേശു” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: Χριστός എന്ന പദത്തെ ‘മശീഹാ’ എന്ന പദവിയായി പരിഭാഷപ്പെടുത്തുന്നതിനുപകരം സ്ഥാപിതമായ ‘ക്രിസ്തു’ എന്ന രൂപത്തിൽ ലിപ്യന്തരം ചെയ്യാവുന്നതാണ്.
lexical_decisions:
- source_word: Παῦλος
  choice: പൗലോസ്
  rationale: ഈ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ സ്ഥാപിതമായ ലിപ്യന്തരണം.
- source_word: ἀπόστολος
  choice: അപ്പൊസ്തലൻ
  rationale: പൗലോസിന്റെ ഔദ്യോഗിക സ്വയംപരിചയത്തിൽ ഇത് ഒരു പൊതുവായ ദൂതനെക്കാൾ നിയോഗിക്കപ്പെട്ട ‘അപ്പൊസ്തലൻ’ എന്ന സാങ്കേതിക അർഥം വഹിക്കുന്നു.
- source_word: Χριστοῦ Ἰησοῦ / Χριστῷ Ἰησοῦ
  choice: മശീഹയായ യേശു
  rationale: Χριστός ഇവിടെ വെറും പേരായി ലിപ്യന്തരം ചെയ്യുന്നതിനേക്കാൾ അഭിഷിക്തനായ മശീഹാ എന്ന പദവിയുടെ അർഥം നിലനിർത്തുന്നു; സ്വാഭാവിക മലയാളത്തിനായി ‘മശീഹയായ യേശു’ എന്നു നൽകി.
- source_word: διὰ θελήματος θεοῦ
  choice: ദൈവഹിതപ്രകാരം
  rationale: διάയും ഷഷ്ഠിയും ഇവിടെ ദൈവത്തിന്റെ ഇച്ഛയാൽ ലഭിച്ച നിയോഗത്തിന്റെ അടിസ്ഥാനവും അധികാരവും സൂചിപ്പിക്കുന്നു; ‘ദൈവഹിതപ്രകാരം’ അത് സ്വാഭാവികമായും സംക്ഷിപ്തമായും അറിയിക്കുന്നു.
- source_word: κατ’ ἐπαγγελίαν
  choice: വാഗ്ദത്തമനുസരിച്ച്
  rationale: κατά ഇവിടെ അനുരൂപതയോ മാനദണ്ഡമോ സൂചിപ്പിക്കുന്നു. അപ്പൊസ്തലനിയോഗവും ജീവന്റെ വാഗ്ദത്തവും തമ്മിലുള്ള ബന്ധം നിർവചിക്കാതെ നിലനിർത്തുന്നു.
- source_word: ζωῆς
  choice: ജീവന്റെ
  rationale: ἐπαγγελίαν എന്നതിനെ വിശേഷിപ്പിക്കുന്ന ഷഷ്ഠിരൂപം മലയാളത്തിൽ ‘ജീവന്റെ വാഗ്ദത്തം’ എന്നു നേരിട്ട് പുനരാവിഷ്കരിച്ചു.
- source_word: τῆς ἐν Χριστῷ Ἰησοῦ
  choice: മശീഹയായ യേശുവിലുള്ള
  rationale: ആർട്ടിക്കിളോടുകൂടിയ പ്രയോഗം ഏതു ജീവനാണെന്ന് നിർണ്ണയിക്കുന്നു; ἐν എന്നതിന്റെ ബന്ധപരവും സ്ഥാനപരവുമായ തുറന്ന അർഥം ‘ഉള്ള’ എന്ന രൂപത്തിൽ സംരക്ഷിച്ചു.
theological_decisions:
- issue: Χριστός എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: ഈ അഭിവാദനത്തിൽ പദവിയെന്ന അർഥം തിരിച്ചറിയാവുന്നതിനാൽ ‘മശീഹാ’ എന്നു പരിഭാഷപ്പെടുത്തി; മലയാളത്തിൽ പതിവായ ‘ക്രിസ്തു’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നൽകി.
- issue: κατ’ ἐπαγγελίαν എന്നത് അപ്പൊസ്തലനിയോഗത്തോടുള്ള ബന്ധം
  choice: വാഗ്ദത്തമനുസരിച്ച്
  alternative: വാഗ്ദത്തത്തിനുവേണ്ടി
  rationale: മൂലപദം അനുരൂപത, മാനദണ്ഡം, അല്ലെങ്കിൽ ബന്ധം സൂചിപ്പിക്കാം. ലക്ഷ്യാർഥം മാത്രം ഉറപ്പിക്കുന്ന ‘വേണ്ടി’ എന്നതിനു പകരം കൂടുതൽ തുറന്ന ‘അനുസരിച്ച്’ തെരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കത്തുശൈലി ഉപയോഗിച്ചു. ഗ്രീക്ക് വാക്യത്തിന്റെ അഭിവാദനഘടനയും അടുത്ത വാക്യത്തിലേക്കു നീളുന്ന അപൂർണതയും സൂചിപ്പിക്കാൻ അവസാനം കോമ നിലനിർത്തി. ‘മശീഹാ യേശു’ എന്ന കൃത്രിമ പദക്രമത്തിനു പകരം സ്വാഭാവികമായ ‘മശീഹയായ യേശു’ ഉപയോഗിച്ചു.
