id: 2TI.1.9
reference: 2 Timothy 1:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῦ σώσαντος ἡμᾶς καὶ καλέσαντος κλήσει ἁγίᾳ, οὐ κατὰ τὰ ἔργα ἡμῶν ἀλλὰ κατὰ ἰδίαν πρόθεσιν καὶ χάριν, τὴν δοθεῖσαν ἡμῖν ἐν Χριστῷ Ἰησοῦ πρὸ χρόνων αἰωνίων,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/009.yaml
  text: who saved us and called us with a holy calling[a], not according to our works but according to his own purpose and grace, which was given to us in Messiah Jesus before eternal ages[d][c][b],
translation:
  language: ml
  text: അവിടുന്ന് നമ്മെ രക്ഷിക്കുകയും വിശുദ്ധമായ ഒരു വിളിയോടെ നമ്മെ വിളിക്കുകയും ചെയ്തു[a]. അത് നമ്മുടെ പ്രവൃത്തികൾക്കനുസരിച്ചല്ല, അവിടുത്തെ സ്വന്തം ഉദ്ദേശ്യത്തിനും കൃപയ്ക്കും അനുസരിച്ചാണ്. ആ കൃപ മശീഹ യേശുവിൽ[b] നിത്യയുഗങ്ങൾക്കുമുമ്പ്[c][d] നമുക്കു നൽകപ്പെട്ടതാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വിശുദ്ധമായ ഒരു വിളിയിലേക്കു’ എന്നോ ‘വിശുദ്ധമായ ഒരു വിളിയാൽ’ എന്നോ പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് ദത്തിവ് ഒന്നിലധികം വിധത്തിൽ മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘ക്രിസ്തുയേശുവിൽ.’ ഇവിടെ Χριστός ഒരു പദവിയാണെന്ന ധാരണയിൽ മുഖ്യവാചകത്തിൽ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: alternative_reading
  - marker: c
    text: ‘നിത്യയുഗങ്ങൾക്കുമുമ്പ്,’ ‘യുഗങ്ങൾ ആരംഭിക്കുന്നതിനുമുമ്പ്,’ അല്ലെങ്കിൽ കൂടുതൽ സ്വാഭാവികമായി ‘കാലം ആരംഭിക്കുന്നതിനുമുമ്പ്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: d
    text: 'കൂടുതൽ പദാനുപദമായി: ‘നിത്യമായ കാലങ്ങൾക്കുമുമ്പ്.’'
    reason: previous_rendering
lexical_decisions:
- source_word: σώσαντος
  choice: രക്ഷിക്കുകയും ചെയ്തു
  rationale: σῴζω എന്ന ക്രിയയുടെ രക്ഷാസംബന്ധമായ പൗലോസീയ അർഥഭാരം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: καλέσαντος
  choice: വിളിക്കുകയും ചെയ്തു
  rationale: ദൈവിക വിളി എന്ന ആശയം നിലനിർത്തുന്നു; ‘ക്ഷണിച്ചു’ എന്നതിനെക്കാൾ മൂലപദത്തിന്റെ ദൈവശാസ്ത്രപരമായ പ്രതിധ്വനി കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: κλήσει ἁγίᾳ
  choice: വിശുദ്ധമായ ഒരു വിളിയോടെ
  rationale: ഗ്രീക്ക് ദത്തിവിന്റെ ഉപകരണം, ലക്ഷ്യം, അനുബന്ധം എന്നീ സാധ്യതകളിൽ ഒന്നിനെ മാത്രം നിർബന്ധിക്കാതെ ‘with a holy calling’ എന്ന വിശാലത സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: οὐ κατὰ τὰ ἔργα ἡμῶν
  choice: നമ്മുടെ പ്രവൃത്തികൾക്കനുസരിച്ചല്ല
  rationale: κατά ഇവിടെ മാനദണ്ഡമോ അടിസ്ഥാനമോ സൂചിപ്പിക്കുന്നു; ‘പ്രവൃത്തികൾ’ എന്ന പൗലോസീയ മുഖ്യപദവും സംരക്ഷിക്കുന്നു.
- source_word: ἰδίαν πρόθεσιν
  choice: അവിടുത്തെ സ്വന്തം ഉദ്ദേശ്യം
  rationale: സന്ദർഭത്തിലെ ദൈവത്തെ സൂചിപ്പിക്കുന്ന സ്വാമിത്വവും πρόθεσις എന്ന പദത്തിന്റെ ലക്ഷ്യബോധവും വ്യക്തമാക്കുന്നു.
- source_word: χάριν
  choice: കൃപ
  rationale: χάρις എന്ന പൗലോസീയ ദൈവശാസ്ത്രപദത്തിന് മലയാളത്തിൽ സ്ഥാപിതവും അർഥസമ്പന്നവുമായ തുല്യം.
- source_word: τὴν δοθεῖσαν ἡμῖν
  choice: ആ കൃപ ... നമുക്കു നൽകപ്പെട്ടതാണ്
  rationale: സ്ത്രീലിംഗത്തിലുള്ള പങ്കാളിക്രിയ χάριν എന്ന ‘കൃപ’യെയാണ് വിശേഷിപ്പിക്കുന്നതെന്ന് വാക്യഘടനയിൽ വ്യക്തമാക്കുന്നു; കർമണിപ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: മശീഹയായ യേശുവിൽ
  rationale: Χριστός ഇവിടെ പദവിയായി അർഥവത്തായി പരിഭാഷപ്പെടുത്തുകയും ἐν എന്ന ബന്ധം ‘യിൽ’കൊണ്ട് നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: πρὸ χρόνων αἰωνίων
  choice: അനാദികാലങ്ങൾക്കുമുമ്പേ
  rationale: ‘നിത്യമായ കാലങ്ങൾക്കുമുമ്പ്’ എന്ന അസ്വാഭാവിക പദാനുപദരൂപം ഒഴിവാക്കി, കാലത്തിന്റെ അതിപുരാതനത/കാലാതീത മുൻസ്ഥിതി സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം ഗൗരവമുള്ള സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: Χριστῷ എന്നത് പദവിയായോ പേരിന്റെ ഭാഗമായോ പരിഭാഷപ്പെടുത്തൽ
  choice: മശീഹയായ യേശുവിൽ
  alternative: ക്രിസ്തുയേശുവിൽ
  rationale: Χριστός എന്ന പദത്തിന്റെ ‘അഭിഷിക്തൻ/മശീഹ’ എന്ന പദവിയർഥം ഇവിടെ സജീവമായി നിലനിർത്തുന്നു; പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: κλήσει ἁγίᾳ എന്ന ദത്തിവിന്റെ വ്യാഖ്യാനബലം
  choice: വിശുദ്ധമായ ഒരു വിളിയോടെ
  alternative: വിശുദ്ധമായ ഒരു വിളിയിലേക്കു / വിശുദ്ധമായ ഒരു വിളിയാൽ
  rationale: ദത്തിവ് ഉപാധിയെയോ ലക്ഷ്യത്തെയോ അനുബന്ധത്തെയോ സൂചിപ്പിക്കാമെന്ന യഥാർഥ അവ്യക്തത മുഖ്യവാചകത്തിൽ അതിയായി പരിഹരിക്കാതെ സൂക്ഷിക്കുന്നു.
- issue: πρὸ χρόνων αἰωνίων എന്ന കാലപ്രയോഗം
  choice: അനാദികാലങ്ങൾക്കുമുമ്പേ
  alternative: യുഗങ്ങൾ ആരംഭിക്കുന്നതിനുമുമ്പ് / കാലം ആരംഭിക്കുന്നതിനുമുമ്പ്
  rationale: ദൈവകൃപയുടെ കാലാതീത മുൻനിശ്ചയം സൂചിപ്പിക്കുന്ന വാചകത്തിന്റെ സംഘർഷം നിലനിർത്തുന്നു; ‘കാലം ആരംഭിക്കുന്നതിനുമുമ്പ്’ എന്ന വ്യാഖ്യാനാത്മക മിനുക്കൽ മുഖ്യവാചകത്തിൽ നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മുൻവാക്യത്തിലെ θεοῦ എന്ന മുൻപദത്തെ ആശ്രയിക്കുന്ന ഗ്രീക്ക് ബന്ധഘടന മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ‘അവിടുന്ന്’ എന്നു തുടക്കമിട്ടിരിക്കുന്നു. ‘അവിടുന്ന്/അവിടുത്തെ’ എന്ന ആദരസൂചക ദൈവപരാമർശം സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായ സഭാതീത രജിസ്റ്റർ നൽകുന്നു.
