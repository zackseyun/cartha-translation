revisions:
- from: അവിടുന്ന് നമ്മെ രക്ഷിക്കുകയും വിശുദ്ധമായ ഒരു വിളിയോടെ നമ്മെ വിളിക്കുകയും ചെയ്തു[a]. അത് നമ്മുടെ പ്രവൃത്തികൾക്കനുസരിച്ചല്ല, അവിടുത്തെ സ്വന്തം ഉദ്ദേശ്യത്തിനും കൃപയ്ക്കും അനുസരിച്ചാണ്. ആ കൃപ മശീഹയായ യേശുവിൽ[b] അനാദികാലങ്ങൾക്കുമുമ്പേ[c][d] നമുക്കു നൽകപ്പെട്ടതാണ്.
  to: അവിടുന്ന് നമ്മെ രക്ഷിക്കുകയും വിശുദ്ധമായ ഒരു വിളിയോടെ നമ്മെ വിളിക്കുകയും ചെയ്തു[a]. അത് നമ്മുടെ പ്രവൃത്തികൾക്കനുസരിച്ചല്ല, അവിടുത്തെ സ്വന്തം ഉദ്ദേശ്യത്തിനും കൃപയ്ക്കും അനുസരിച്ചാണ്. ആ കൃപ മശീഹ യേശുവിൽ[b] നിത്യയുഗങ്ങൾക്കുമുമ്പ്[c][d] നമുക്കു നൽകപ്പെട്ടതാണ്.
  rationale: The revision replaces the misleading ‘അനാദികാലങ്ങൾക്കുമുമ്പേ’ with a direct rendering of ‘before eternal ages’ and changes the Messiah-title construction to idiomatic Malayalam apposition. No doctrinal inference is added, and the dative ambiguity in κλήσει ἁγίᾳ remains documented by footnote a.
