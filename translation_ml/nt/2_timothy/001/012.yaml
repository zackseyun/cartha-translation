id: 2TI.1.12
reference: 2 Timothy 1:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: δι’ ἣν αἰτίαν καὶ ταῦτα πάσχω, ἀλλ’ οὐκ ἐπαισχύνομαι, οἶδα γὰρ ᾧ πεπίστευκα, καὶ πέπεισμαι ὅτι δυνατός ἐστιν τὴν παραθήκην μου φυλάξαι εἰς ἐκείνην τὴν ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/012.yaml
  text: For this reason I also suffer these things[a], but I am not ashamed, for I know whom I have believed[c][b], and I am convinced that he is able to guard my deposit until that day.
translation:
  language: ml
  text: ഈ കാരണത്താലാണ് ഞാനും ഈ കഷ്ടങ്ങൾ സഹിക്കുന്നത്. എങ്കിലും ഞാൻ ലജ്ജിക്കുന്നില്ല; കാരണം, ഞാൻ ആരിൽ വിശ്വാസമർപ്പിച്ചിരിക്കുന്നുവെന്ന്[a] എനിക്കറിയാം. എന്റെ നിക്ഷേപം[b] ആ ദിവസംവരെ[c] കാത്തുസൂക്ഷിക്കാൻ അവനു കഴിവുണ്ടെന്ന് എനിക്ക് ഉറപ്പുണ്ട്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഞാൻ ആരെ വിശ്വസിച്ചിരിക്കുന്നുവെന്ന്’; ‘ഞാൻ ആരെ ആശ്രയിച്ചിരിക്കുന്നുവെന്ന്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘എന്റെ നിക്ഷേപം’ എന്നത് സുരക്ഷിതമായി സൂക്ഷിക്കാനായി മറ്റൊരാളെ ഏൽപ്പിച്ചതിനെ സൂചിപ്പിക്കുന്ന പദമാണ്. പൗലോസ് ദൈവത്തെ ഏൽപ്പിച്ചതിനെയോ ദൈവം പൗലോസിന് ഏൽപ്പിച്ചതിനെയോ ഇത് സൂചിപ്പിക്കാം.
    reason: alternative_reading
  - marker: c
    text: അതായത്, ദൈവത്തിന്റെ അന്തിമ ന്യായവിധിയുടെയും നീതിസ്ഥാപനത്തിന്റെയും ഭാവിദിവസം.
    reason: cross_reference
lexical_decisions:
- source_word: δι’ ἣν αἰτίαν
  choice: ഈ കാരണത്താലാണ്
  rationale: മുൻസന്ദർഭവുമായി ബന്ധിപ്പിക്കുന്ന കാരണസൂചക പ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ταῦτα πάσχω
  choice: ഞാനും ഈ കഷ്ടങ്ങൾ സഹിക്കുന്നത്
  rationale: πάσχω എന്നതിന്റെ കഷ്ടം അനുഭവിക്കുക/സഹിക്കുക എന്ന അർഥവും ταῦτα എന്ന സൂചനയും നിലനിർത്തുന്നു; കഷ്ടങ്ങളുടെ സ്വഭാവം അനാവശ്യമായി വ്യക്തമാക്കുന്നില്ല.
- source_word: οὐκ ἐπαισχύνομαι
  choice: ഞാൻ ലജ്ജിക്കുന്നില്ല
  rationale: സന്ദർഭത്തിൽ പൗലോസിന്റെ നിലപാടിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ പരിഭാഷ.
- source_word: οἶδα
  choice: എനിക്കറിയാം
  rationale: രൂപത്തിൽ perfect ആയിരുന്നാലും വർത്തമാനകാല സ്ഥിതിവാചക അർഥമുള്ള οἶδα യെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ᾧ πεπίστευκα
  choice: ഞാൻ ആരിൽ വിശ്വാസമർപ്പിച്ചിരിക്കുന്നുവെന്ന്
  rationale: ദത്തിവിലുള്ള വ്യക്തിപരമായ ബന്ധവും πιστεύω യുടെ വിശ്വസിക്കുക/ആശ്രയിക്കുക എന്ന ഭാവവും perfect രൂപത്തിലെ ഉറച്ചുനിൽക്കുന്ന വിശ്വാസവും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: πέπεισμαι
  choice: എനിക്ക് ഉറപ്പുണ്ട്
  rationale: perfect passive രൂപത്തിന്റെ നിലനിൽക്കുന്ന ബോധ്യം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: δυνατός ἐστιν
  choice: അവൻ ശക്തനാണ്
  rationale: ശേഷി പ്രകടിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ദൈവശാസ്ത്രപരമായ ഭാരം നിലനിർത്തുന്നു; വെറും ‘കഴിയും’ എന്നതിനെക്കാൾ മൂലരൂപത്തോട് അടുത്തതാണ്.
- source_word: τὴν παραθήκην μου
  choice: എന്റെ നിക്ഷേപം
  rationale: സൂക്ഷിക്കാനായി ഏൽപ്പിച്ച വസ്തു/ഉത്തരവാദിത്വം എന്ന παραθήκη യുടെ രൂപകം നിലനിർത്തുകയും അത് പൗലോസ് ദൈവത്തെ ഏൽപ്പിച്ചതാണോ പൗലോസിനെ ഏൽപ്പിച്ചതാണോ എന്ന അവ്യക്തത പരിഹരിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: φυλάξαι
  choice: കാത്തുസൂക്ഷിക്കാൻ
  rationale: കാവൽ, സംരക്ഷണം, സുരക്ഷിതമായി നിലനിർത്തൽ എന്നീ φυλάσσω യുടെ അർഥങ്ങൾ നിക്ഷേപരൂപകത്തിന് യോജിച്ചവിധം നൽകുന്നു.
- source_word: εἰς ἐκείνην τὴν ἡμέραν
  choice: ആ ദിവസംവരെ
  rationale: ഭാവിയിലെ നിർണായക ദിവസത്തിലേക്കുള്ള കാലസൂചന സ്വാഭാവികമായി നൽകുന്നു; മൂലത്തിൽ ഇല്ലാത്ത അധിക വിശദീകരണം മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ᾧ എന്നതിന്റെ സൂചിതവ്യക്തിയും ‘അവൻ ശക്തനാണ്’ എന്നതിലെ കർത്താവും
  choice: മുഖ്യവാചകത്തിൽ ‘ആരിൽ’ എന്നും ‘അവൻ’ എന്നും മാത്രം നൽകി സൂചിതവ്യക്തിയെ പേരെടുത്ത് വ്യക്തമാക്കുന്നില്ല.
  alternative: ‘ദൈവത്തിൽ’ എന്നോ ‘ക്രിസ്തുയേശുവിൽ’ എന്നോ തുറന്നുപറയുക.
  rationale: സന്ദർഭം ദൈവത്തെയോ ക്രിസ്തുവിനെയോ ശക്തമായി സൂചിപ്പിക്കുന്നുവെങ്കിലും ഈ ഉപവാക്യത്തിൽ ഗ്രീക്ക് പേര് പറയുന്നില്ല. അതിനാൽ മൂലത്തിന്റെ വ്യക്തതയുടെ പരിധി നിലനിർത്തുന്നു.
- issue: παραθήκη μου എന്നതിന്റെ ദിശ
  choice: ‘എന്റെ നിക്ഷേപം’ എന്നു നൽകി ഏൽപ്പിക്കൽ ഏതു ദിശയിലാണെന്ന അവ്യക്തത നിലനിർത്തുന്നു.
  alternative: പൗലോസ് ദൈവത്തെ ഏൽപ്പിച്ച ജീവൻ/രക്ഷ; അല്ലെങ്കിൽ ദൈവം പൗലോസിനെ ഏൽപ്പിച്ച സുവിശേഷം/ശുശ്രൂഷ.
  rationale: μου എന്ന ജനിറ്റീവ് ഏത് ബന്ധം സൂചിപ്പിക്കുന്നു എന്ന് ഈ വാക്യം മാത്രം നിർബന്ധമായി തീർപ്പാക്കുന്നില്ല. അതിനാൽ ഏതെങ്കിലും ദൈവശാസ്ത്ര വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ അടിച്ചേൽപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവവും മാന്യതയും പുലർത്തുന്ന മലയാളം. ‘എന്റെ നിക്ഷേപം’ എന്ന അല്പം ഔപചാരികമായ രൂപം മൂലത്തിലെ നിയമപര/സംരക്ഷണ രൂപകവും വ്യാഖ്യാനാവ്യക്തതയും കാക്കുന്നതിനായി ഉദ്ദേശപൂർവം നിലനിർത്തി.
