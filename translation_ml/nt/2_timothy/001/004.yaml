  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐπιποθῶν σε ἰδεῖν, μεμνημένος σου τῶν δακρύων, ἵνα χαρᾶς πληρωθῶ
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/004.yaml
  text: longing to see you[a], remembering your tears, so that I may be filled with joy,
translation:
  language: ml
  text: നിന്നെ കാണാൻ അതിയായി ആഗ്രഹിച്ചും നിന്റെ കണ്ണുനീർ ഓർത്തും, ഞാൻ സന്തോഷംകൊണ്ട് നിറയേണ്ടതിനായി,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιποθῶν
  choice: അതിയായി ആഗ്രഹിച്ചുകൊണ്ടും
  rationale: വർത്തമാനകാല കൃുദന്തം ശക്തമായ വ്യക്തിപരമായ ആഗ്രഹം പ്രകടിപ്പിക്കുന്നു. ‘അതിയായി ആഗ്രഹിക്കുക’ എന്നത് വികാരതീവ്രത സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: σε ἰδεῖν
  choice: നിന്നെ കാണാൻ
  rationale: ἐπιποθῶν എന്നതിനെ പൂർത്തിയാക്കുന്ന infinitive construction ആഗ്രഹത്തിന്റെ വിഷയം തിമൊഥെയൊസിനെ കാണുന്നതാണെന്ന് നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: μεμνημένος
  choice: ഓർത്തുകൊണ്ടും
  rationale: Perfect participle മുൻകാല ഓർമ്മയുടെ തുടരുന്ന നില സൂചിപ്പിക്കുന്നു; ‘ഓർത്തുകൊണ്ടും’ വാക്യത്തിന്റെ കൃുദന്തരൂപ പ്രവാഹം നിലനിർത്തുന്നു.
- source_word: σου τῶν δακρύων
  choice: നിന്റെ കണ്ണുനീർ
  rationale: Genitive പ്രയോഗം തിമൊഥെയൊസിന്റെ കണ്ണുനീരിനെ നേരിട്ട് സൂചിപ്പിക്കുന്നു; ‘കരച്ചിൽ’ എന്നതിനെക്കാൾ ഇത് മൂലരൂപത്തോട് അടുത്തതാണ്.
- source_word: ἵνα
  choice: വേണ്ടതിന്
  rationale: ഉദ്ദേശ്യം അല്ലെങ്കിൽ ഫലം സൂചിപ്പിക്കുന്ന ബന്ധം നിലനിർത്തുന്നു; ഈ വാക്യഘടനയിൽ ‘വേണ്ടതിന്’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: χαρᾶς
  choice: സന്തോഷംകൊണ്ട്
  rationale: πληρόω എന്ന ക്രിയയോടുള്ള genitive മലയാളത്തിൽ സ്വാഭാവികമായി ‘സന്തോഷംകൊണ്ട് നിറയുക’ എന്നു നൽകുന്നു.
- source_word: πληρωθῶ
  choice: ഞാൻ ... നിറയേണ്ടതിന്
  rationale: Aorist passive subjunctive-ന്റെ അർഥം ഉദ്ദേശ്യവാക്യത്തിനുള്ളിൽ ‘നിറയേണ്ടതിന്’ എന്നു സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; നിറയ്ക്കപ്പെടുക എന്ന passive ആശയവും മലയാളപ്രയോഗത്തിൽ നിലനിൽക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഈ വാക്യം മുൻവാക്യത്തിൽ ആരംഭിച്ച ആശയത്തിന്റെ തുടർച്ചയായതിനാൽ അവസാനം കോമ നിലനിർത്തിയിരിക്കുന്നു. എല്ലാ കൃുദന്തബന്ധങ്ങളും കഴിയുന്നത്ര സമാന്തരമായി നൽകിയിരിക്കുന്നു.
