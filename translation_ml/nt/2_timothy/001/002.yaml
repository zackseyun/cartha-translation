id: 2TI.1.2
reference: 2 Timothy 1:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τιμοθέῳ ἀγαπητῷ τέκνῳ· χάρις, ἔλεος, εἰρήνη ἀπὸ θεοῦ πατρὸς καὶ Χριστοῦ Ἰησοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/002.yaml
  text: 'To Timothy[a], beloved child: grace, mercy, and peace from God the Father and Messiah Jesus our Lord.'
translation:
  language: ml
  text: 'പ്രിയ മകനായ തിമൊഥെയൊസിന്: പിതാവായ ദൈവത്തിൽനിന്നും നമ്മുടെ കർത്താവായ മശീഹാ യേശുവിൽനിന്നും[a] കൃപയും കരുണയും സമാധാനവും ഉണ്ടാകട്ടെ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ക്രിസ്തു യേശു.” ഗ്രീക്കിലെ Χριστός എന്ന പദവി പരമ്പരാഗതമായി “ക്രിസ്തു” എന്നു ലിപ്യന്തരം ചെയ്യപ്പെടുന്നു; ഇവിടെ അതിന്റെ അർഥം നിലനിർത്താൻ “മശീഹാ” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: Τιμοθέῳ
  choice: തിമൊഥെയൊസിന്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തെ മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന വിധം ലിപ്യന്തരിച്ചു; ദാതൃവിഭക്തി ‘-ന്’ ഉപയോഗിച്ച് കത്തിന്റെ സ്വീകർത്താവിനെ സൂചിപ്പിച്ചു.
- source_word: ἀγαπητῷ τέκνῳ
  choice: പ്രിയ മകനായ
  rationale: ἀγαπητός എന്നതിന്റെ സ്നേഹപൂർവവും ഗൗരവമുള്ളതുമായ ഭാവം ‘പ്രിയ’ നിലനിർത്തുന്നു. τέκνον പൊതുവായി ‘കുട്ടി/സന്തതി’ എന്നർഥമുള്ളതാണെങ്കിലും, മുതിർന്ന തിമൊഥെയൊസിനോടുള്ള ആത്മീയ പിതൃബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ ‘മകൻ’ തിരഞ്ഞെടുത്തു; ജൈവപുത്രത്വം ഇതിലൂടെ ഉദ്ദേശിക്കുന്നില്ല.
- source_word: χάρις
  choice: കൃപ
  rationale: പൗലോസിന്റെ അഭിവാദനങ്ങളിൽ പതിവായ ദൈവശാസ്ത്രപരവും ബന്ധപരവുമായ അർഥം നിലനിർത്തുന്ന സ്ഥാപിത മലയാള പദം.
- source_word: ἔλεος
  choice: കരുണ
  rationale: ‘കൃപ’യിൽ ലയിപ്പിക്കാതെ, ഗ്രീക്കിലെ വേറിട്ട അനുഗ്രഹമായി നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: εἰρήνη
  choice: സമാധാനം
  rationale: ബന്ധപരവും ഉടമ്പടിസംബന്ധവുമായ വിശാല അർഥസാധ്യതകൾ ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാള തുല്യപദം.
- source_word: θεοῦ πατρὸς
  choice: പിതാവായ ദൈവം
  rationale: ഇവിടെ ‘നമ്മുടെ’ എന്ന വിശേഷണം ഗ്രീക്കിൽ ‘പിതാവ്’ എന്നതിനോടില്ല; അതിനാൽ അത് ചേർക്കാതെ പിതാവായ ദൈവം എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: Χριστοῦ Ἰησοῦ
  choice: മശീഹാ യേശു
  rationale: Χριστός എന്ന അഭിഷിക്തനായ രാജാവിനെ സൂചിപ്പിക്കുന്ന പദവിയുടെ അർഥം ‘മശീഹാ’ എന്നതിലൂടെ നിലനിർത്തി; Ἰησοῦ എന്ന പേര് ‘യേശു’യായി നൽകി.
- source_word: κυρίου
  choice: കർത്താവ്
  rationale: അധികാരവും ക്രിസ്തുശാസ്ത്രപരമായ ഗൗരവവും നിലനിർത്തുന്ന സ്ഥാപിതവും സ്വാഭാവികവുമായ മലയാള പരിഭാഷ.
theological_decisions:
- issue: Χριστοῦ Ἰησοῦ എന്നതിന്റെ പരിഭാഷ
  choice: മശീഹാ യേശു
  alternative: ക്രിസ്തു യേശു
  rationale: Χριστός ഇവിടെ പദവിയുടെ ശക്തി വഹിക്കുന്നതിനാൽ അതിന്റെ അർഥം വ്യക്തമാക്കുന്ന ‘മശീഹാ’ മുഖ്യവാചകത്തിൽ ഉപയോഗിച്ചു; പരമ്പരാഗത ലിപ്യന്തരണം അടിക്കുറിപ്പിൽ നൽകി.
- issue: ἀγαπητῷ τέκνῳ എന്ന ആത്മീയ ബന്ധഭാഷ
  choice: പ്രിയ മകനായ
  alternative: പ്രിയ കുഞ്ഞായ / പ്രിയ സന്തതിയായ
  rationale: τέκνον ലിംഗപരമായി പൊതുവായ പദമാണെങ്കിലും ഇവിടെ അറിയപ്പെടുന്ന പുരുഷനായ തിമൊഥെയൊസിനോടുള്ള പൗലോസിന്റെ ആത്മീയ പിതൃബന്ധമാണ് സൂചിപ്പിക്കുന്നത്. ‘കുഞ്ഞ്’ പ്രായത്തെക്കുറിച്ച് തെറ്റായ ധാരണ നൽകാം; ‘സന്തതി’ അഭിസംബോധനയിൽ കൃത്രിമമാണ്. അതിനാൽ മലയാളത്തിലെ സ്വാഭാവിക ബന്ധപ്രയോഗമായ ‘മകൻ’ തിരഞ്ഞെടുത്തു.
- issue: അനുഗ്രഹവാക്യത്തിലെ സൂചിത ക്രിയ
  choice: ഉണ്ടാകട്ടെ
  alternative: ക്രിയയില്ലാത്ത നാമപദ അഭിവാദനം
  rationale: ഗ്രീക്കിൽ ക്രിയ സൂചിതമാണെങ്കിലും മലയാളത്തിൽ പൂർണ്ണവും സ്വാഭാവികവുമായ ആശംസയായി വായിക്കാൻ ‘ഉണ്ടാകട്ടെ’ ചേർത്തു; ഇത് പുതിയ ആശയം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ സംക്ഷിപ്ത അഭിവാദനഘടന നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ ആശംസാവാക്യത്തിനായി ‘ഉണ്ടാകട്ടെ’ ചേർത്തിരിക്കുന്നു. ‘എന്റെ’ എന്ന പദം മൂലപാഠത്തിൽ ഇല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല.
