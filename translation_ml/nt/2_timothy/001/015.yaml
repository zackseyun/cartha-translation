id: 2TI.1.15
reference: 2 Timothy 1:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οἶδας τοῦτο ὅτι ἀπεστράφησάν με πάντες οἱ ἐν τῇ Ἀσίᾳ, ὧν ἐστιν Φύγελος καὶ Ἑρμογένης.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/015.yaml
  text: 'You know this: all those in Asia turned away from me[b][a], among whom are Phygelus and Hermogenes.'
translation:
  language: ml
  text: 'ഇതു നിനക്കറിയാം: ഏഷ്യയിലുള്ള എല്ലാവരും[a] എന്നിൽനിന്ന് പിന്തിരിഞ്ഞു[b]. അവരിൽ ഫുഗെലൊസും ഹെർമൊഗെനസും ഉൾപ്പെടുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ “ഏഷ്യ” എന്നു പറയുന്നത് ഏഷ്യാമൈനറിന്റെ പടിഞ്ഞാറൻ ഭാഗത്തുണ്ടായിരുന്ന റോമൻ പ്രവിശ്യയെയാണ്; ഇന്നത്തെ ഏഷ്യാ ഭൂഖണ്ഡത്തെയല്ല.
    reason: cultural_note
  - marker: b
    text: അഥവാ, “എന്നെ ഉപേക്ഷിച്ചു.” ഗ്രീക്കിൽ കൂടുതൽ അക്ഷരാർഥമായി, “എന്നിൽനിന്ന് പിന്തിരിഞ്ഞു” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδας
  choice: നിനക്കറിയാം
  rationale: നിലവിലുള്ള അറിവിനെ സൂചിപ്പിക്കുന്ന വർത്തമാനകാലസ്വഭാവമുള്ള പ്രയോഗം; ആധുനിക മലയാളത്തിൽ നേരിട്ടും സ്വാഭാവികവുമാണ്.
- source_word: τοῦτο ὅτι
  choice: 'ഇതു നിനക്കറിയാം:'
  rationale: τοῦτο പിന്നാലെയുള്ള ὅτι-വാക്യത്തിന്റെ ഉള്ളടക്കത്തെ മുന്നോട്ടു ചൂണ്ടുന്നു. മലയാളത്തിൽ ദ്വിബിന്ദു ഈ ബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀπεστράφησάν με
  choice: എന്നിൽനിന്ന് പിന്തിരിഞ്ഞുപോയി
  rationale: ബന്ധപരമായ വിശ്വസ്തതയിലോ പിന്തുണയിലോ നിന്നുള്ള പിന്മാറ്റത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ദൃശ്യരൂപം നിലനിർത്തുന്നു; ‘എന്നെ ഉപേക്ഷിച്ചു’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ അർഥവും അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: πάντες οἱ ἐν τῇ Ἀσίᾳ
  choice: ഏഷ്യയിലുള്ള എല്ലാവരും
  rationale: πάντες എന്ന പദത്തിന്റെ സമഗ്രമായ ഊന്നൽ മയപ്പെടുത്താതെ നിലനിർത്തുന്നു; അതിന്റെ സന്ദർഭപരമായ പരിധി പ്രധാനവാചകത്തിൽ നിർവചിക്കുന്നില്ല.
- source_word: Ἀσίᾳ
  choice: ഏഷ്യ
  rationale: പരമ്പരാഗത ഭൂനാമം നിലനിർത്തുന്നു; ഇവിടെ ഉദ്ദേശിക്കുന്നത് ആധുനിക ഭൂഖണ്ഡമല്ല, റോമൻ പ്രവിശ്യയാണെന്ന വിവരം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὧν ἐστιν
  choice: അവരിൽ ... ഉൾപ്പെടുന്നു
  rationale: വലിയ സംഘത്തിൽ നിന്നുള്ള പേരെടുത്ത ഉദാഹരണങ്ങളാണിവർ എന്ന ഭാഗാത്മകബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: Φύγελος
  choice: ഫുഗെലൊസ്
  rationale: ഗ്രീക്ക് Φύγελος എന്ന പേരിന്റെ ശബ്ദരൂപത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം.
- source_word: Ἑρμογένης
  choice: ഹെർമൊഗെനസ്
  rationale: ഗ്രീക്ക് Ἑρμογένης എന്ന പേരിന്റെ ശബ്ദരൂപത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം.
theological_decisions:
- issue: ‘ഏഷ്യയിലുള്ള എല്ലാവരും’ എന്നതിന്റെ വ്യാപ്തി
  choice: ‘എല്ലാവരും’ എന്ന വിശാലപ്രയോഗം യഥാവിധി നിലനിർത്തി; അതിന്റെ പരിധി സന്ദർഭം നിർണ്ണയിക്കാൻ വിട്ടിരിക്കുന്നു.
  alternative: ഏഷ്യയിലെ ഓരോ വ്യക്തിയെയും അക്ഷരാർഥത്തിൽ സൂചിപ്പിക്കുന്നു; അല്ലെങ്കിൽ ‘പലരും’ എന്നു മയപ്പെടുത്തി പരിഭാഷപ്പെടുത്തുന്നു.
  rationale: πάντες സന്ദർഭത്താൽ പരിധിപ്പെട്ട സമഗ്രപ്രയോഗമായിരിക്കാം. പൗലൊസിന്റെ പരാതിയുടെ ശക്തി കുറയ്ക്കാതെയും അതിനെ പ്രദേശത്തെ ഓരോ വ്യക്തിയിലേക്കും നിർബന്ധമായി വ്യാപിപ്പിക്കാതെയും മൂലപാഠത്തിലെ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘പിന്തിരിഞ്ഞുപോയി’ എന്ന പ്രയോഗം മൂലത്തിലെ ദൃശ്യരൂപവും ബന്ധപരമായ വേർപാടിന്റെ ഗൗരവവും ഒരുമിച്ച് നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ഇംഗ്ലീഷ് ഓഡിറ്റ് പാളിയിലെ ക്രമമായ [b][a] അനുസരിച്ച് ബന്ധപ്പെട്ട പദപ്രയോഗങ്ങൾക്ക് പിന്നാലെ നൽകിയിരിക്കുന്നു.
