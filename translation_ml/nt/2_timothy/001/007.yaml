id: 2TI.1.7
reference: 2 Timothy 1:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐ γὰρ ἔδωκεν ἡμῖν ὁ θεὸς πνεῦμα δειλίας, ἀλλὰ δυνάμεως καὶ ἀγάπης καὶ σωφρονισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/007.yaml
  text: For God did not give us a spirit of cowardice[b][a], but of power and love and self-control.
translation:
  language: ml
  text: എന്തെന്നാൽ, ദൈവം നമുക്കു നൽകിയത് ഭീരുത്വത്തിന്റെ[a] ആത്മാവല്ല, മറിച്ച് ശക്തിയുടെയും സ്നേഹത്തിന്റെയും ആത്മനിയന്ത്രണത്തിന്റെയും[b] ആത്മാവാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഭീരുത്വം’ എന്നതിനു പകരം ‘ധൈര്യക്കുറവ്’ അല്ലെങ്കിൽ ‘പേടിത്തം’ എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്കുപദം സാധാരണ ഭയത്തേക്കാൾ ഭീരുത്വത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ആത്മനിയന്ത്രണം’ എന്നതിനു പകരം ‘സുബോധം’ അല്ലെങ്കിൽ ‘സ്വയംശിക്ഷണം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ
  choice: എന്തെന്നാൽ ... അല്ല
  rationale: γάρ മുൻവാക്യത്തിലെ പ്രബോധനത്തിന് വിശദീകരണം നൽകുന്നതിനാൽ ‘എന്തെന്നാൽ’ എന്നു പരിഭാഷപ്പെടുത്തി; οὐ നിഷേധം ‘അല്ല’ എന്നതിലൂടെ വ്യക്തമാക്കി.
- source_word: ἔδωκεν ἡμῖν ὁ θεὸς
  choice: ദൈവം നമുക്കു നൽകിയതു
  rationale: അയോറിസ്റ്റ് ക്രിയയുടെ പൂർത്തിയായ പ്രവർത്തനം സ്വാഭാവികമായ മലയാള ഭൂതകാലത്തിൽ നൽകി; ἡμῖν പരോക്ഷകർമമായി ‘നമുക്കു’ എന്നു നിലനിർത്തി.
- source_word: πνεῦμα
  choice: ആത്മാവ്
  rationale: ഇവിടെ ഈ പദം ദൈവം നൽകുന്ന ആത്മാവിനെയോ മനോഭാവത്തെയോ സൂചിപ്പിക്കാം. ‘ആത്മാവ്’ എന്ന പദം മൂലത്തിലെ ഈ തുറന്ന നില സംരക്ഷിക്കുന്നു; ‘പരിശുദ്ധാത്മാവ്’ എന്നാക്കി അർഥം അമിതമായി നിർണയിച്ചിട്ടില്ല.
- source_word: δειλίας
  choice: ഭീരുത്വം
  rationale: സാധാരണ ഭയത്തേക്കാൾ അപകീർത്തികരമായ പേടിത്തത്തെയും ധൈര്യമില്ലായ്മയെയും സൂചിപ്പിക്കുന്ന δειλίαയുടെ ശക്തമായ നിഷേധാർഥം ‘ഭീരുത്വം’ നന്നായി നൽകുന്നു.
- source_word: δυνάμεως
  choice: ശക്തി
  rationale: δύναμις എന്നതിന്റെ കഴിവ്, ബലം, പ്രാബല്യം എന്നീ ആശയങ്ങൾ ഉൾക്കൊള്ളുന്ന നേരിട്ടുള്ള ആധുനിക മലയാള പദമാണ് ‘ശക്തി’.
- source_word: ἀγάπης
  choice: സ്നേഹം
  rationale: ἀγάπηയുടെ സാധാരണവും സ്വാഭാവികവുമായ ആധുനിക മലയാള പരിഭാഷയാണ് ‘സ്നേഹം’.
- source_word: σωφρονισμοῦ
  choice: ആത്മനിയന്ത്രണം
  rationale: സ്വയം നിയന്ത്രിക്കൽ, ശിക്ഷണം, സുബോധം എന്നിവ ഉൾക്കൊള്ളുന്ന അപൂർവ പദമാണിത്. ഈ ത്രയത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ പ്രധാന പരിഭാഷ ‘ആത്മനിയന്ത്രണം’ ആണ്; മറ്റ് സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകി.
theological_decisions:
- issue: πνεῦμα എന്നതിന്റെ സൂചിതാർത്ഥം
  choice: ‘ആത്മാവ്’ എന്നു നൽകി, ഒരു മനോഭാവം മാത്രമെന്നോ പരിശുദ്ധാത്മാവിന്റെ നേരിട്ടുള്ള ശീർഷകമെന്നോ നിർണയിക്കാതെ വിട്ടു
  alternative: ‘മനോഭാവം’ അല്ലെങ്കിൽ ‘പരിശുദ്ധാത്മാവ്’
  rationale: അനാർത്രസ് πνεῦμα എന്ന പദവും അതിനെ വിശേഷിപ്പിക്കുന്ന സമാന്തര ഷഷ്ഠീവാക്യങ്ങളും ഗുണസ്വഭാവപരമായ അർഥത്തെ പിന്തുണയ്ക്കുന്നു; എങ്കിലും ദൈവം നൽകുന്ന ‘ആത്മാവ്’ എന്ന ഭാഷ പരിശുദ്ധാത്മാവുമായുള്ള ബന്ധത്തെ പൂർണമായി ഒഴിവാക്കുന്നില്ല. അതിനാൽ മൂലത്തിലെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ ആവർത്തിക്കാത്ത πνεῦμα മലയാളത്തിൽ വാക്യത്തിന്റെ അവസാനം വീണ്ടും ചേർത്തത് ബന്ധവും വൈരുധ്യവും വ്യക്തമായി വായിക്കാനാണ്; അതിലൂടെ ഭീരുത്വം, ശക്തി, സ്നേഹം, ആത്മനിയന്ത്രണം എന്നിവയെല്ലാം ‘ആത്മാവ്’ എന്നതോടു ബന്ധിപ്പിക്കുന്നു.
