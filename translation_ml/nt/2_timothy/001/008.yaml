id: 2TI.1.8
reference: 2 Timothy 1:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Μὴ οὖν ἐπαισχυνθῇς τὸ μαρτύριον τοῦ κυρίου ἡμῶν μηδὲ ἐμὲ τὸν δέσμιον αὐτοῦ, ἀλλὰ συγκακοπάθησον τῷ εὐαγγελίῳ κατὰ δύναμιν θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/008.yaml
  text: Therefore, do not be ashamed of the testimony about our Lord, nor of me, his prisoner, but suffer hardship with the gospel according to the power of God,
translation:
  language: ml
  text: അതുകൊണ്ട്, നമ്മുടെ കർത്താവിനെക്കുറിച്ചുള്ള സാക്ഷ്യത്തെയോ അവന്റെ തടവുകാരനായ എന്നെയോ ലജ്ജിക്കരുത്. മറിച്ച്, ദൈവത്തിന്റെ ശക്തിക്കൊത്തവണ്ണം സുവിശേഷത്തിനുവേണ്ടി കഷ്ടതയിൽ പങ്കുചേരുക.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: അഥവാ, “സുവിശേഷത്തോടൊപ്പം കഷ്ടം സഹിക്കുക.” ഗ്രീക്ക് ക്രിയയിൽ മറ്റുള്ളവരോടൊപ്പം കഷ്ടതയിൽ പങ്കുചേരുന്ന ആശയം ഉൾപ്പെടുന്നു.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “ദൈവത്തിന്റെ ശക്തിയാൽ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ οὖν
  choice: അതുകൊണ്ട്, ... ലജ്ജിക്കരുത്
  rationale: οὖν മുൻവാക്യങ്ങളിലെ പ്രബോധനത്തിൽനിന്നുള്ള നിഗമനബന്ധം സൂചിപ്പിക്കുന്നു; μή സഹിതമുള്ള ക്രിയ നിരോധനമാണ്.
- source_word: ἐπαισχυνθῇς
  choice: ലജ്ജിക്കരുത്
  rationale: അപമാനമോ നാണക്കേടോ ഭയന്ന് പിന്മാറുന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τὸ μαρτύριον τοῦ κυρίου ἡμῶν
  choice: നമ്മുടെ കർത്താവിനെക്കുറിച്ചുള്ള സാക്ഷ്യം
  rationale: സന്ദർഭത്തിൽ ജനിറ്റീവ് കർത്താവിനെ വിഷയമാക്കിയുള്ള സാക്ഷ്യമായി മനസ്സിലാക്കുന്നതാണ് കൂടുതൽ സാധ്യത; മറ്റൊരു സാധ്യവായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: μηδὲ ἐμὲ τὸν δέσμιον αὐτοῦ
  choice: അവന്റെ തടവുകാരനായ എന്നെക്കുറിച്ചോ
  rationale: μηδέ ലജ്ജിക്കേണ്ട രണ്ടാമത്തെ കാര്യത്തെ ബന്ധിപ്പിക്കുന്നു; αὐτοῦ സൂചിപ്പിക്കുന്ന കർത്താവുമായുള്ള ഉടമസ്ഥത/ബന്ധം ‘അവന്റെ’ എന്നു നിലനിർത്തുന്നു.
- source_word: συγκακοπάθησον
  choice: കഷ്ടതയിൽ പങ്കുചേരുക
  rationale: συν- ഉപസർഗത്തിലെ മറ്റുള്ളവരോടൊപ്പം കഷ്ടം അനുഭവിക്കുന്ന പങ്കാളിത്തഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τῷ εὐαγγελίῳ
  choice: സുവിശേഷത്തിനുവേണ്ടിയുള്ള
  rationale: ദത്തിവ് ബന്ധം ചുരുക്കമായതിനാൽ, സുവിശേഷത്തോടനുബന്ധിച്ചും അതിന്റെ നിമിത്തവും അനുഭവിക്കുന്ന കഷ്ടത എന്ന സന്ദർഭോചിത അർത്ഥം നൽകുന്നു; ഗ്രീക്കിലെ ചുരുക്കം മറ്റൊരു വിവർത്തനത്തിനും ഇടനൽകുന്നു.
- source_word: κατὰ δύναμιν θεοῦ
  choice: ദൈവത്തിന്റെ ശക്തിക്കൊത്തവണ്ണം
  rationale: κατά + accusative സൂചിപ്പിക്കുന്ന അളവ്, മാനദണ്ഡം, അല്ലെങ്കിൽ അനുരൂപത നിലനിർത്തുന്നു; ശക്തി ഉപാധിയാണെന്ന വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ നിർബന്ധിക്കുന്നില്ല.
theological_decisions:
- issue: ‘സാക്ഷ്യം’ എന്നതും ‘നമ്മുടെ കർത്താവ്’ എന്നതും തമ്മിലുള്ള ബന്ധം
  choice: കർത്താവിനെക്കുറിച്ചുള്ള സാക്ഷ്യം എന്ന objective genitive വായന
  alternative: നമ്മുടെ കർത്താവ് നൽകിയ സാക്ഷ്യം / നമ്മുടെ കർത്താവിന്റെ സാക്ഷ്യം
  rationale: പൗലോസിനെക്കുറിച്ചു ലജ്ജിക്കരുതെന്ന സമാന്തര പ്രബോധനത്തോടൊപ്പം, ക്രിസ്തുവിനെ കേന്ദ്രമാക്കിയുള്ള സാക്ഷ്യമാണ് സന്ദർഭത്തിൽ കൂടുതൽ യോജിക്കുന്നത്; യഥാർഥ വ്യാകരണദ്വയാർത്ഥത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: ‘അവന്റെ തടവുകാരൻ’ എന്നതിലെ തടവിന്റെ ദൈവശാസ്ത്രപരമായ ബന്ധം
  choice: കർത്താവുമായുള്ള ബന്ധം ‘അവന്റെ തടവുകാരൻ’ എന്നു നിലനിർത്തുക
  alternative: അവനുവേണ്ടി തടവിലായവൻ
  rationale: αὐτοῦ എന്ന ജനിറ്റീവ് പൗലോസിന്റെ തടവ് കർത്താവിനോടുള്ള ബന്ധത്തിൽ അവതരിപ്പിക്കുന്നു; അത് കാരണമാത്രമായി ചുരുക്കാതെ വാചകത്തിലെ സാന്ദ്രത സംരക്ഷിക്കുന്നു.
- issue: κατὰ δύναμιν θεοῦ എന്നതിലെ ശക്തിയുടെ പങ്ക്
  choice: ദൈവത്തിന്റെ ശക്തിക്കൊത്തവണ്ണം
  alternative: ദൈവത്തിന്റെ ശക്തിയാൽ
  rationale: ഗ്രീക്ക് പ്രയോഗം അളവ്/അനുരൂപതയെയും പ്രാപ്തീകരണത്തെയും സൂചിപ്പിക്കാവുന്നതാണ്; മുഖ്യവാചകം ഔപചാരികമായ തുറന്ന നിലപാട് നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘സാക്ഷ്യം’, ‘സുവിശേഷം’, ‘കർത്താവ്’ എന്നീ പരിചിത ബൈബിൾ പദങ്ങൾ നിലനിർത്തി; ഗ്രീക്കിലെ ജനിറ്റീവ്, ദത്തിവ്, κατά പ്രയോഗങ്ങളിലെ യഥാർഥ അർത്ഥസാധ്യതകൾ അടിക്കുറിപ്പുകളിലൂടെ സംരക്ഷിച്ചു.
