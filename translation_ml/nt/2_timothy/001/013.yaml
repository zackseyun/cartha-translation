id: 2TI.1.13
reference: 2 Timothy 1:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὑποτύπωσιν ἔχε ὑγιαινόντων λόγων ὧν παρ’ ἐμοῦ ἤκουσας ἐν πίστει καὶ ἀγάπῃ τῇ ἐν Χριστῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/013.yaml
  text: Hold to the pattern of sound words that you heard from me[c][b][a], in the faith and love that are in Messiah Jesus.
translation:
  language: ml
  text: എന്നിൽനിന്ന് നീ കേട്ട ആരോഗ്യകരമായ വചനങ്ങളുടെ മാതൃക മശീഹാ യേശു[c]വിലുള്ള വിശ്വാസ[a]ത്തിലും സ്നേഹത്തിലും മുറുകെപ്പിടിക്കുക.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വിശ്വസ്തതയിലും സ്നേഹത്തിലും.” ‘വിശ്വാസം’ എന്നു പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്ക് പദത്തിന് ‘വിശ്വസ്തത’ അല്ലെങ്കിൽ ‘ആശ്രയം’ എന്ന അർഥവും വരാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “മശീഹാ യേശുവിലുള്ള വിശ്വാസത്തെയും സ്നേഹത്തെയും സംബന്ധിച്ച് എന്നിൽനിന്ന് നീ കേട്ട ആരോഗ്യകരമായ വചനങ്ങളുടെ മാതൃക മുറുകെപ്പിടിക്കുക.” ഗ്രീക്ക് വാക്യഘടനയിൽ വിശ്വാസവും സ്നേഹവും മാതൃക മുറുകെപ്പിടിക്കേണ്ട വിധത്തെയോ കേട്ട വചനങ്ങളുടെ ഉള്ളടക്കത്തെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
  - marker: c
    text: 'പരമ്പരാഗത പരിഭാഷ: “ക്രിസ്തു യേശു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποτύπωσιν
  choice: മാതൃക
  rationale: പിന്തുടരേണ്ട രൂപം, മാതൃക, രൂപരേഖ എന്നീ അർഥങ്ങൾ നൽകുന്ന പദം; ‘മാതൃക’ സ്വാഭാവികവും മാനദണ്ഡസ്വഭാവം അനാവശ്യമായി അതിശയിപ്പിക്കാത്തതുമാണ്.
- source_word: ἔχε
  choice: മുറുകെപ്പിടിക്കുക
  rationale: അക്ഷരാർഥത്തിൽ ‘കൈവശം വെക്കുക/ഉണ്ടായിരിക്കുക’ എന്നായാലും, ഇവിടെ അപ്പൊസ്തലിക മാതൃക നിലനിർത്താനും അതിൽ ഉറച്ചുനിൽക്കാനുമുള്ള ആജ്ഞയാണ്.
- source_word: ὑγιαινόντων λόγων
  choice: സൗഖ്യമുള്ള വചനങ്ങൾ
  rationale: ὑγιαίνω എന്നതിലെ ആരോഗ്യത്തിന്റെ രൂപകം നിലനിർത്തുന്നു; λόγοι എന്ന ബഹുവചനത്തെ വ്യാഖ്യാനാത്മകമായ ‘ഉപദേശം’ എന്നതിനു പകരം ‘വചനങ്ങൾ’ എന്നു നൽകുന്നു.
- source_word: ὧν παρ’ ἐμοῦ ἤκουσας
  choice: എന്നിൽനിന്ന് നീ കേട്ട
  rationale: παρά + genitive ഇവിടെ ഉറവിടത്തെ സൂചിപ്പിക്കുന്നു; ബന്ധവാക്യം ‘വചനങ്ങൾ’ എന്നതിനെ വിശേഷിപ്പിക്കുന്നു.
- source_word: ἐν πίστει
  choice: വിശ്വാസത്തിൽ
  rationale: πίστις എന്നതിന്റെ പ്രധാന അർഥമായ ‘വിശ്വാസം’ നിലനിർത്തുന്നു; ‘വിശ്വസ്തത’ എന്ന സാദ്ധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: καὶ ἀγάπῃ
  choice: സ്നേഹത്തിലും
  rationale: ἀγάπη എന്നതിന് സ്വാഭാവികവും നിലവാരമുള്ളതുമായ മലയാളരൂപം.
- source_word: τῇ ἐν Χριστῷ Ἰησοῦ
  choice: മശീഹാ യേശുവിലുള്ള
  rationale: ഈ ഘടകം വിശ്വാസത്തെയും സ്നേഹത്തെയും ഒരുമിച്ച് വിശേഷിപ്പിക്കുന്നതായി മുഖ്യവാചകത്തിൽ നൽകുന്നു.
- source_word: Χριστῷ Ἰησοῦ
  choice: മശീഹാ യേശു
  rationale: Χριστός ഇവിടെ പദവിനാമത്തിന്റെ അർഥം നിലനിർത്തുന്നതിനാൽ ‘മശീഹാ’ എന്നു പരിഭാഷപ്പെടുത്തി; പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ἐν πίστει καὶ ἀγάπῃ τῇ ἐν Χριστῷ Ἰησοῦ എന്ന ഘടകത്തിന്റെ ബന്ധം
  choice: മാതൃക മുറുകെപ്പിടിക്കേണ്ട വിധമോ മണ്ഡലമോ ആയി—മശീഹാ യേശുവിലുള്ള വിശ്വാസത്തിലും സ്നേഹത്തിലും—വായിക്കുന്നു.
  alternative: ‘മശീഹാ യേശുവിലുള്ള വിശ്വാസത്തെയും സ്നേഹത്തെയും സംബന്ധിച്ച് എന്നിൽനിന്ന് കേട്ട സൗഖ്യമുള്ള വചനങ്ങൾ’ എന്ന ഉള്ളടക്കബന്ധം.
  rationale: ഗ്രീക്ക് വാക്യഘടന ഇരു ബന്ധങ്ങൾക്കും ഇടനൽകുന്നു. പ്രബോധനത്തിന്റെ ഒഴുക്ക് ആദ്യ വായനയെ പിന്തുണയ്ക്കുന്നുവെങ്കിലും മറ്റേ വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: Χριστός എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ പദവിനാമസ്വഭാവം വ്യക്തമായതിനാൽ അർഥം തുറന്നുകാട്ടുന്ന ‘മശീഹാ’ തിരഞ്ഞെടുത്തു; പരിചിതമായ പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള പ്രബോധനശൈലി. ‘സൗഖ്യമുള്ള വചനങ്ങൾ’ എന്ന പ്രയോഗം മൂലഭാഷയിലെ ആരോഗ്യരൂപകം നിലനിർത്തുന്നു; സാധാരണ വായനക്കാർക്ക് അർഥം ഗ്രഹിക്കാവുന്ന വിധത്തിൽ വാക്യക്രമം സ്വാഭാവികമാക്കി. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
