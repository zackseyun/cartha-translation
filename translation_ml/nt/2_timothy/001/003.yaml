  rationale: 'പ്രധാനവാചകത്തിൽ അടിക്കുറിപ്പ്-ചിഹ്നങ്ങൾ ഒഴിവാക്കിയിരിക്കുന്നു, കാരണം നിലവിലെ കരടിലെ a, b, c ചിഹ്നങ്ങൾക്ക് യഥാക്രമം ‘ഞാൻ സേവിക്കുന്ന’, ‘എന്റെ പൂർവികരെപ്പോലെ’, ‘ഓർക്കുമ്പോൾ’ എന്നിവയ്ക്കു പിന്നാലെ വ്യക്തമായ നങ്കൂരസ്ഥാനം നൽകേണ്ടതാണ്. ശരിയായ നങ്കൂരങ്ങളോടെ പാഠം ഇപ്രകാരം വായിക്കണം: ‘എന്റെ പൂർവികരെപ്പോലെ[b] ശുദ്ധമായ മനസ്സാക്ഷിയോടെ ഞാൻ സേവിക്കുന്ന[a] ദൈവത്തിന്, രാവും പകലും എന്റെ പ്രാർഥനകളിൽ നിന്നെ ഇടവിടാതെ ഓർക്കുമ്പോൾ[c], ഞാൻ നന്ദി പറയുന്നു.’ ഈ പരിഷ്കാരം ഗ്രീക്ക് പദക്രമം പകർത്താതെ അതിന്റെ അർഥവും ὡς-ന്റെ തുറന്ന സാഹചര്യബന്ധവും നിലനിർത്തുന്നു.'
