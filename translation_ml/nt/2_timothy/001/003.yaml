id: 2TI.1.3
reference: 2 Timothy 1:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Χάριν ἔχω τῷ θεῷ, ᾧ λατρεύω ἀπὸ προγόνων ἐν καθαρᾷ συνειδήσει, ὡς ἀδιάλειπτον ἔχω τὴν περὶ σοῦ μνείαν ἐν ταῖς δεήσεσίν μου, νυκτὸς καὶ ἡμέρας
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/003.yaml
  text: I thank God[a], whom I serve as my ancestors did with a clean conscience[c][b], as I constantly remember you in my prayers night and day.
translation:
  language: ml
  text: എന്റെ പൂർവികരെപ്പോലെ ശുദ്ധമായ മനസ്സാക്ഷിയോടെ ഞാൻ സേവിക്കുന്ന ദൈവത്തിന്, രാവും പകലും എന്റെ പ്രാർഥനകളിൽ നിന്നെ ഇടവിടാതെ ഓർക്കുമ്പോൾ, ഞാൻ നന്ദി പറയുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Χάριν ἔχω τῷ θεῷ
  choice: ദൈവത്തിന് ... ഞാൻ നന്ദി പറയുന്നു
  rationale: ഗ്രീക്ക് പ്രയോഗം ദൈവത്തോടുള്ള നന്ദിപ്രകടനമാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ‘നന്ദി പറയുന്നു’ സ്വാഭാവികവും നേരിട്ടുള്ളതുമാണ്.
- source_word: ᾧ λατρεύω
  choice: ഞാൻ സേവിക്കുന്ന
  rationale: λατρεύω ദൈവത്തിനു നൽകുന്ന ആരാധനാപൂർവമായ സേവനത്തെ സൂചിപ്പിക്കാം. ‘സേവിക്കുന്ന’ എന്നത് ആരാധനയിൽ മാത്രം അർഥം ചുരുക്കാതെ വിശാലമായ ആശയം നിലനിർത്തുന്നു.
- source_word: ἀπὸ προγόνων
  choice: എന്റെ പൂർവികർ ചെയ്തതുപോലെ
  rationale: പൂർവികരുടെ വിശ്വാസപരമായ സേവനത്തോടുള്ള തുടർച്ചയാണ് സന്ദർഭത്തിൽ പ്രധാനമായി തോന്നുന്നത്. വാച്യരൂപമായ ‘പൂർവികരിൽനിന്ന്’ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἐν καθαρᾷ συνειδήσει
  choice: ശുദ്ധമായ മനസ്സാക്ഷിയോടെ
  rationale: സേവനത്തിന്റെ ധാർമികമായ ആത്മാർഥതയും നിർമലതയും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὡς ἀδιάλειπτον ἔχω τὴν περὶ σοῦ μνείαν
  choice: നിന്നെ ഇടവിടാതെ ഓർത്തുകൊണ്ട്
  rationale: μνείαν ἔχω എന്ന നാമപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായ ക്രിയാരൂപത്തിൽ നൽകി; ὡς-ന്റെ സാഹചര്യബന്ധം ‘ഓർത്തുകൊണ്ട്’ എന്നതിലൂടെ അമിതമായി കാരണബന്ധമാക്കാതെ സൂക്ഷിച്ചു.
- source_word: ἐν ταῖς δεήσεσίν μου
  choice: എന്റെ പ്രാർഥനകളിൽ
  rationale: δέησις പ്രത്യേകിച്ച് അപേക്ഷാപൂർവമായ പ്രാർഥനയെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, ഇവിടെ ‘പ്രാർഥനകൾ’ എന്നത് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: νυκτὸς καὶ ἡμέρας
  choice: രാവും പകലും
  rationale: തുടർച്ചയായ പതിവിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
theological_decisions:
- issue: ἀπὸ προγόνων എന്നതിൽ പൗലോസും പൂർവികരുടെ വിശ്വാസപാരമ്പര്യവും തമ്മിലുള്ള ബന്ധം
  choice: പൂർവികർ ദൈവത്തെ സേവിച്ചതിനോടുള്ള തുടർച്ചയായി പൗലോസ് തന്റെ സേവനത്തെ അവതരിപ്പിക്കുന്നു.
  alternative: ‘പൂർവികരിൽനിന്ന്’ അഥവാ ‘പൂർവികരുടെ പാരമ്പര്യത്തിൽ’ സേവിക്കുന്നു.
  rationale: പ്രധാനവാചകം വിശ്വാസപരമായ തുടർച്ച വ്യക്തമാക്കുന്നു; എന്നാൽ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സംക്ഷിപ്തതയും മറ്റു സാധ്യതകളും അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
- issue: λατρεύω എന്നതിന്റെ അർഥപരിധി
  choice: സേവിക്കുന്നു
  alternative: ആരാധിക്കുന്നു
  rationale: ഈ ക്രിയ ദൈവത്തോടുള്ള ആരാധനാപൂർവമായ സേവനത്തെ ഉൾക്കൊള്ളുന്നു. ‘സേവിക്കുന്നു’ എന്നത് അതിന്റെ വിശാലത നിലനിർത്തുന്നു; ‘ആരാധിക്കുന്നു’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ὡς എന്ന ബന്ധകത്തിന്റെ സ്വഭാവം
  choice: ഓർത്തുകൊണ്ട് എന്ന സാഹചര്യബന്ധം
  alternative: ഓർക്കുമ്പോൾ; ഓർക്കുന്നതിനാൽ
  rationale: കാരണം, സമയം, സാഹചര്യം എന്നിവയിൽ ഒന്നിനെ നിർബന്ധമായി നിശ്ചയിക്കാതെ നന്ദിപറച്ചിലും ഓർമയും തമ്മിലുള്ള അടുത്ത ബന്ധം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്ക് വാക്യത്തിന്റെ ദൈർഘ്യം നിലനിർത്തിയെങ്കിലും കോമകൾ ഉപയോഗിച്ച് ഘടന വ്യക്തമാക്കി. ദൈവസേവനത്തിന്റെ പൂർവികതുടർച്ച ഏതെങ്കിലും പ്രത്യേക സഭാപാരമ്പര്യമായി ചുരുക്കിയിട്ടില്ല.
