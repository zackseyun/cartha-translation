  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: δῴη αὐτῷ ὁ κύριος εὑρεῖν ἔλεος παρὰ κυρίου ἐν ἐκείνῃ τῇ ἡμέρᾳ— καὶ ὅσα ἐν Ἐφέσῳ διηκόνησεν, βέλτιον σὺ γινώσκεις.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/018.yaml
  text: May the Lord grant him to find mercy from the Lord on that day—and you know better how much he served in Ephesus[a][b][c].
translation:
  language: ml
  text: ആ ദിവസം കർത്താവിൽനിന്ന് കരുണ കണ്ടെത്താൻ കർത്താവ് അവന് ഇടയാക്കട്ടെ[a][b]—എഫെസൊസിൽ അവൻ എത്രമാത്രം സേവനം ചെയ്തുവെന്ന് നിനക്കു കൂടുതൽ നന്നായി അറിയാം[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കർത്താവിന്റെ സന്നിധിയിൽ”; കർത്താവിൽനിന്നാണ് കരുണ വരുന്നതെന്ന് ഈ വാക്യം സൂചിപ്പിക്കാം; കർത്താവിന്റെ സന്നിധിയിൽ കരുണ കണ്ടെത്തുന്നതിനെ ഊന്നുന്നതായും ചിലർ മനസ്സിലാക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “ആ ദിവസം” എന്നത് വരാനിരിക്കുന്ന ദൈവിക ന്യായവിധിയുടെയോ നീതീകരണത്തിന്റെയോ ദിവസത്തെ സൂചിപ്പിക്കാൻ പുതിയ നിയമത്തിൽ സാധാരണയായി ഉപയോഗിക്കുന്ന പ്രയോഗമാണ്.
    reason: cross_reference
  - marker: c
    text: അഥവാ, “അവൻ ചെയ്ത സകല സേവനങ്ങളും.” എഫെസൊസിലെ അവന്റെ സേവനത്തിന്റെ വ്യാപ്തിയെ ഗ്രീക്ക് പ്രയോഗം സംഗ്രഹിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: δῴη αὐτῷ ... εὑρεῖν
  choice: അവന് ... കണ്ടെത്താൻ ... ഇടയാക്കട്ടെ
  rationale: ആശംസയെയോ പ്രാർഥനയെയോ സൂചിപ്പിക്കുന്ന optative ഭാവവും തുടർന്നുള്ള infinitive ഘടനയും സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ὁ κύριος
  choice: കർത്താവ്
  rationale: κύριος എന്ന പദത്തിന്റെ പതിവായ ബൈബിൾ-മലയാള പരിഭാഷ; മൂലത്തിലെ ആവർത്തനം നിലനിർത്തുന്നു.
- source_word: εὑρεῖν ἔλεος
  choice: കരുണ കണ്ടെത്താൻ
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിന്റെ രൂപകാത്മകതയും ബൈബിൾ ഭാഷയിലെ പരിചിതമായ ആശയവും സംരക്ഷിക്കുന്നു; വ്യാഖ്യാനാത്മകമായി ‘കരുണ ലഭിക്കാൻ’ എന്ന് മാറ്റുന്നില്ല.
- source_word: παρὰ κυρίου
  choice: കർത്താവിൽനിന്ന്
  rationale: γενitive-നോടുകൂടിയ παρά ഇവിടെ ഉറവിടത്തെ സൂചിപ്പിക്കുന്നതായി സ്വാഭാവികമായി വായിക്കാം; സാന്നിധ്യത്തെ ഊന്നുന്ന മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: ആ ദിവസത്തിൽ
  rationale: കാലസൂചകമായ ἐν-ന്റെ സ്വാഭാവിക മലയാളരൂപം; അന്ത്യകാലപരമായ സൂചനയെ വിശദീകരിച്ച് മുഖ്യവാചകത്തിൽ ചേർക്കാതെ നിലനിർത്തുന്നു.
- source_word: ὅσα ... διηκόνησεν
  choice: എത്രമാത്രം സേവനം ചെയ്തുവെന്ന്
  rationale: ὅσα സേവനത്തിന്റെ വ്യാപ്തിയോ അളവോ സംഗ്രഹിക്കുന്നു; διακονέω-യ്ക്ക് സാധാരണ വായനക്കാർക്ക് വ്യക്തമാകുന്ന ‘സേവനം ചെയ്തു’ ഉപയോഗിക്കുന്നു.
- source_word: βέλτιον σὺ γινώσκεις
  choice: നിനക്കാണ് കൂടുതൽ നന്നായി അറിയാവുന്നത്
  rationale: βέλτιον എന്ന താരതമ്യഭാവം നിലനിർത്തുകയും σὺ എന്ന ഊന്നൽ ‘നിനക്കാണ്’ എന്നതിലൂടെ പ്രകടമാക്കുകയും ചെയ്യുന്നു; താരതമ്യത്തിന്റെ പറയാത്ത രണ്ടാം ഘടകം കൂട്ടിച്ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ὁ κύριος ... παρὰ κυρίου എന്നതിലെ ആവർത്തിച്ചുള്ള ‘കർത്താവ്’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: രണ്ടിടത്തും ‘കർത്താവ്’ എന്നു തന്നെയാണ് നൽകിയിരിക്കുന്നത്; വ്യക്തികളെ വേർതിരിച്ചിട്ടില്ല.
  alternative: ആദ്യത്തേത് ക്രിസ്തുവിനെയും രണ്ടാമത്തേത് പിതാവിനെയും സൂചിപ്പിക്കുന്നു; അല്ലെങ്കിൽ രണ്ടും ക്രിസ്തുവിനെ സൂചിപ്പിക്കുന്നു.
  rationale: ഗ്രീക്ക് പാഠം രണ്ടു പ്രയോഗങ്ങളെയും വ്യക്തമായി വേർതിരിക്കുന്നില്ല. അതിനാൽ ദൈവശാസ്ത്രപരമായ അവ്യക്തത പരിഭാഷയിൽ സംരക്ഷിക്കുന്നു.
- issue: ‘ആ ദിവസം’ എന്നതിന്റെ അന്ത്യകാലപരമായ അർഥം
  choice: മുഖ്യവാചകത്തിൽ ‘ആ ദിവസം’ എന്നു മാത്രം നൽകിയിരിക്കുന്നു.
  alternative: ന്യായവിധിദിവസം; കർത്താവിന്റെ ദിവസം; അന്ത്യദിവസം.
  rationale: സന്ദർഭത്തിൽ ദൈവിക ന്യായവിധിയുടെയോ വിടുതലിന്റെയോ വരാനിരിക്കുന്ന ദിവസത്തെ സൂചിപ്പിക്കാമെങ്കിലും, പാഠം അതിനെ കൂടുതൽ വ്യക്തമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘കർത്താവ്’, ‘കരുണ’ തുടങ്ങിയ പരിചിതമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തി; അതേസമയം പഴഞ്ചൻ ക്രിയാരൂപങ്ങളും അനാവശ്യ സഭാപദാവലിയും ഒഴിവാക്കി. മൂലത്തിലെ ആശംസാഭാവം, താരതമ്യം, ആവർത്തനം, ദൈവശാസ്ത്രപരമായ അവ്യക്തത എന്നിവ സംരക്ഷിച്ചു.
