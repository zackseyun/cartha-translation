  rationale: ഗൗരവമുള്ള, ഉത്സാഹപൂർവമായ പരിശ്രമത്തെ സൂചിപ്പിക്കുന്നതും തിരച്ചിലിന്റെ തീവ്രത സ്വാഭാവികമായി അറിയിക്കുന്നതുമായ പ്രയോഗം.
- source_word: ἐζήτησέν με
  choice: എന്നെ ... അന്വേഷിച്ച്
  rationale: ഒരാളെ കണ്ടെത്താൻ ലക്ഷ്യമിട്ടുള്ള സജീവമായ തിരച്ചിൽ എന്ന അർഥം നൽകുന്നു.
- source_word: καὶ εὗρεν
  choice: കണ്ടെത്തി
  rationale: തിരച്ചിലിന്റെ വിജയകരമായ ഫലം ലളിതമായ ഏകോപിത പ്രവൃത്തിയായി അറിയിക്കുന്നു; 'എന്നെ' എന്ന കർമം മുൻക്രിയയിൽനിന്ന് സ്വാഭാവികമായി ബാധകമാണ്.
