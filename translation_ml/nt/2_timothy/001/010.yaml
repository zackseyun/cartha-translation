id: 2TI.1.10
reference: 2 Timothy 1:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: φανερωθεῖσαν δὲ νῦν διὰ τῆς ἐπιφανείας τοῦ σωτῆρος ἡμῶν ⸂Ἰησοῦ Χριστοῦ⸃, καταργήσαντος μὲν τὸν θάνατον φωτίσαντος δὲ ζωὴν καὶ ἀφθαρσίαν διὰ τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/010.yaml
  text: but has now been revealed through the appearing of our Savior Jesus the Messiah[a], who indeed abolished death and brought life and incorruptibility to light through the gospel[b],
translation:
  language: ml
  text: എന്നാൽ ഇപ്പോൾ നമ്മുടെ രക്ഷകനായ യേശു മശീഹയുടെ[a] പ്രത്യക്ഷതയിലൂടെ അത് വെളിപ്പെട്ടിരിക്കുന്നു; അവിടുന്ന് മരണത്തെ നിർവീര്യമാക്കിയും ജീവനും അക്ഷയതയും സുവിശേഷത്തിലൂടെ വെളിച്ചത്തിലേക്കു കൊണ്ടുവന്നും ചെയ്തു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യേശുക്രിസ്തു.” ഗ്രീക്കിലെ Χριστός എന്ന പദം “മശീഹ” എന്ന സ്ഥാനപ്പേരായോ “ക്രിസ്തു” എന്ന പേരുപോലുള്ള പദമായോ പ്രവർത്തിക്കാം.
    reason: alternative_reading
  - marker: b
    text: “അക്ഷയത” എന്നതിന് “അമർത്യത” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദം ക്ഷയത്തിനും നാശത്തിനും വിധേയമല്ലാത്ത അവസ്ഥയ്ക്ക് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: φανερωθεῖσαν
  choice: അത് വെളിപ്പെട്ടിരിക്കുന്നു
  rationale: മുൻവാക്യത്തിലെ ദൈവകൃപയെ സൂചിപ്പിക്കുന്ന കർമണിപ്രയോഗം നിലനിർത്തുന്നു; മലയാളത്തിലെ സ്വാഭാവിക ബന്ധത്തിനായി സർവനാമം ചേർത്തു.
- source_word: ἐπιφανείας
  choice: പ്രത്യക്ഷത
  rationale: യേശുവിന്റെ ചരിത്രപരമായ പ്രത്യക്ഷപ്പെടലിനെ സൂചിപ്പിക്കുന്ന ഗൗരവമുള്ളതും പ്രചാരത്തിലുള്ളതുമായ പദം.
- source_word: σωτῆρος
  choice: രക്ഷകൻ
  rationale: ക്രിസ്തുശാസ്ത്രപരമായ സ്ഥാനപ്പേരിന്റെ സ്ഥാപിതവും വ്യക്തവുമായ മലയാളരൂപം.
- source_word: Ἰησοῦ Χριστοῦ
  choice: യേശു മശീഹ
  rationale: Χριστός ഇവിടെ വ്യക്തിനാമത്തോടു ചേർന്നിരുന്നാലും 'നമ്മുടെ രക്ഷകൻ' എന്ന സ്ഥാനപ്പേരിനു പിന്നാലെ വരുന്നതിനാൽ മശീഹ എന്ന പദവിയുടെ അർഥം സജീവമായി നിലനിൽക്കുന്നു.
- source_word: καταργήσαντος
  choice: നിർവീര്യമാക്കുകയും
  rationale: മരണത്തെ ഇല്ലാതാക്കി അസ്തിത്വരഹിതമാക്കി എന്നു അതിരുകടക്കാതെ, അതിന്റെ അധികാരവും ഫലപ്രാപ്തിയും നിർണായകമായി തകർത്തുവെന്ന ശക്തമായ ആശയം നൽകുന്നു.
- source_word: θάνατον
  choice: മരണം
  rationale: മൂലപദത്തിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: φωτίσαντος
  choice: വെളിച്ചത്തിലേക്കു കൊണ്ടുവരുകയും
  rationale: മറഞ്ഞിരുന്നത് വെളിപ്പെടുത്തുക എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ദൃശ്യരൂപകവും വെളിപ്പെടുത്തൽഭാവവും സൂക്ഷിക്കുന്നു.
- source_word: ζωὴν
  choice: ജീവൻ
  rationale: രക്ഷാശാസ്ത്രപരവും അന്ത്യകാലപരവുമായ ഭാരം വികസിപ്പിക്കാതെ നിലനിർത്തുന്ന പതിവ് പരിഭാഷ.
- source_word: ἀφθαρσίαν
  choice: അക്ഷയത
  rationale: ക്ഷയം, നാശം എന്നിവയ്ക്ക് വിധേയമല്ലാത്ത അവസ്ഥയെ സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി സൂചിപ്പിക്കുന്നു; 'അമർത്യത' എന്ന പര്യായത്തേക്കാൾ പദത്തിന്റെ ക്ഷയരാഹിത്യഭാവം നിലനിർത്തുന്നു.
- source_word: διὰ τοῦ εὐαγγελίου
  choice: സുവിശേഷത്തിലൂടെ
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന മാധ്യമം/ഉപാധി എന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: μὲν ... δὲ
  choice: നിർവീര്യമാക്കുകയും ... കൊണ്ടുവരുകയും
  rationale: മരണത്തെ നിർവീര്യമാക്കിയതും ജീവനും അക്ഷയതയും വെളിപ്പെടുത്തിയതുമായ പരസ്പരപൂരകമായ രണ്ടു പ്രവർത്തനങ്ങൾ മലയാളത്തിലെ സമാന്തര ക്രിയാരൂപങ്ങളാൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ എന്ന പേര്–പദവി സംയോജനത്തിലെ Χριστοῦ
  choice: യേശു മശീഹ
  alternative: യേശുക്രിസ്തു
  rationale: ഈ സന്ദർഭത്തിൽ Χριστός എന്നതിന്റെ മശീഹാപദവിയിലുള്ള അർഥം നിലനിർത്തുന്നു; മലയാളത്തിൽ പദവിക്കു പ്രത്യേക നിർദേശകപദം നിർബന്ധമല്ല.
- issue: മരണത്തെ സംബന്ധിച്ച καταργήσαντος എന്നതിന്റെ ശക്തി
  choice: മരണം നിർവീര്യമാക്കി
  alternative: മരണം ഇല്ലാതാക്കി
  rationale: ക്രിസ്തുവിന്റെ നിർണായക വിജയം ഉറപ്പായി പറയുന്നു; എന്നാൽ ഇപ്പോൾ മരണം പൂർണമായി അസ്തിത്വരഹിതമായെന്ന വ്യാഖ്യാനം വിവർത്തനം തന്നെ നിർബന്ധിക്കുന്നില്ല.
- issue: ἀφθαρσίαν എന്ന പദത്തിന്റെ അർഥം
  choice: അക്ഷയത
  alternative: അമർത്യത
  rationale: പദത്തിന്റെ മുഖ്യമായ ക്ഷയരാഹിത്യ/നാശരാഹിത്യ ആശയം കാത്തുസൂക്ഷിക്കുന്നു; പരിചിതമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മുൻവാക്യത്തോടുള്ള വ്യാകരണബന്ധം വ്യക്തമാക്കാൻ ‘അത്’ ചേർത്തു. ദീർഘമായ ഗ്രീക്ക് പങ്കാളിത്തഘടന വായനാസൗകര്യത്തിനായി രണ്ടു മലയാളവാക്യങ്ങളാക്കി; ആശയബന്ധം നിലനിർത്തി.
