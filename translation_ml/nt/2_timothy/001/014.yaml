source:
  edition: SBLGNT
  text: τὴν καλὴν παραθήκην φύλαξον διὰ πνεύματος ἁγίου τοῦ ἐνοικοῦντος ἐν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/014.yaml
  text: Guard the good deposit through the Holy Spirit who dwells in us[a][b].
translation:
  language: ml
  text: നമ്മിൽ വസിക്കുന്ന പരിശുദ്ധാത്മാവിലൂടെ ആ നല്ല നിക്ഷേപം കാത്തുസൂക്ഷിക്കുക.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ആ ശ്രേഷ്ഠമായ നിക്ഷേപം’ അല്ലെങ്കിൽ ‘നിനക്കു ഏൽപ്പിക്കപ്പെട്ടത്.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘നമ്മിൽ വസിക്കുന്ന പരിശുദ്ധാത്മാവിനാൽ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: παραθήκην
  choice: നിക്ഷേപം
  rationale: സൂക്ഷിക്കാനായി ഏൽപ്പിച്ച വിലപ്പെട്ട വസ്തു എന്ന രൂപകം ചുരുക്കമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു; ഇവിടെ സാമ്പത്തിക അർഥമല്ല, ഏൽപ്പിക്കപ്പെട്ട ഉത്തരവാദിത്വമാണ് ഉദ്ദേശ്യം.
- source_word: καλὴν
  choice: നല്ല
  rationale: ധാർമികമായും സ്വഭാവപരമായും നല്ലത് എന്ന വിശാലമായ അർഥം നിലനിർത്തുന്നു; ‘ശ്രേഷ്ഠമായ’ എന്നതിനെക്കാൾ മൂലപദത്തിന്റെ ലാളിത്യം സംരക്ഷിക്കുന്നു.
- source_word: φύλαξον
  choice: കാത്തുസൂക്ഷിക്കുക
  rationale: ഏൽപ്പിക്കപ്പെട്ടതിനെ ജാഗ്രതയോടെ സംരക്ഷിക്കണമെന്ന ആജ്ഞയുടെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: διὰ πνεύματος ἁγίου
  choice: പരിശുദ്ധാത്മാവിലൂടെ
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന ഉപാധി അഥവാ പ്രവർത്തകത്വം നിലനിർത്തുന്നു; അതിനെ വെറും സഹായം എന്നാക്കി ചുരുക്കുന്നില്ല.
- source_word: τοῦ ἐνοικοῦντος ἐν ἡμῖν
  choice: നമ്മിൽ വസിക്കുന്ന
  rationale: ആത്മാവിന്റെ ഇപ്പോഴും തുടരുന്ന സാന്നിധ്യം സാങ്കേതിക പദപ്രയോഗമില്ലാതെ വ്യക്തമായി നൽകുന്നു.
- source_word: ἐν ἡμῖν
  choice: നമ്മിൽ
  rationale: ‘നമ്മുടെ ഉള്ളിൽ’ എന്ന ആന്തരിക സാന്നിധ്യവും സമൂഹത്തിനിടയിലെ സാന്നിധ്യവും അനാവശ്യമായി വേർതിരിച്ചുറപ്പിക്കാതെ ഗ്രീക്കിലെ സർവനാമം നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘നല്ല നിക്ഷേപം’ എന്നതിന്റെ സൂചിതവിഷയം
  choice: സുവിശേഷം എന്നോ ശുശ്രൂഷാഭാരം എന്നോ മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കാതെ ‘നല്ല നിക്ഷേപം’ എന്നു പൊതുവായി നിലനിർത്തി.
  alternative: തിമോത്തെയൊസിനെ ഏൽപ്പിച്ച സുവിശേഷസന്ദേശം; അവന്റെ ശുശ്രൂഷാദൗത്യം
  rationale: സന്ദർഭം അപ്പൊസ്തലിക സുവിശേഷവിശ്വാസത്തെ ശക്തമായി സൂചിപ്പിച്ചാലും ഗ്രീക്ക് പ്രയോഗം സംക്ഷിപ്തവും രൂപകാത്മകവുമാണ്; അതിനാൽ അതിന്റെ സൂചിതവിഷയം വിവർത്തനത്തിൽ തീർപ്പാക്കിയില്ല.
- issue: ‘നമ്മിൽ’ എന്നതിന്റെ വ്യാപ്തി
  choice: പൗലൊസും തിമോത്തെയൊസും മാത്രമെന്നോ എല്ലാ വിശ്വാസികളും എന്നോ പരിമിതപ്പെടുത്താതെ ‘നമ്മിൽ’ എന്നു നിലനിർത്തി.
  alternative: പൊതുവായി വിശ്വാസികളിൽ; പ്രത്യേകിച്ച് പൗലൊസിലും തിമോത്തെയൊസിലും
  rationale: ἡμῖν എന്നത് ഉടനെയുള്ള വ്യക്തികളെയും അവരിലൂടെ പ്രതിനിധീകരിക്കപ്പെടുന്ന വിശ്വാസിസമൂഹത്തെയും ഉൾക്കൊള്ളാനിടയുള്ളതിനാൽ അർഥവ്യാപ്തി തുറന്നുവെച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘നിക്ഷേപം’ എന്ന രൂപകം നിലനിർത്തിയെങ്കിലും അതിന്റെ ഏൽപ്പിക്കൽസന്ദർഭം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി. ആജ്ഞയ്ക്ക് സ്വാഭാവികമായ ആദരസൂചക ക്രിയാരൂപമായ ‘കാത്തുസൂക്ഷിക്കുക’ ഉപയോഗിച്ചു.
