id: 2TI.1.16
reference: 2 Timothy 1:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: δῴη ἔλεος ὁ κύριος τῷ Ὀνησιφόρου οἴκῳ, ὅτι πολλάκις με ἀνέψυξεν, καὶ τὴν ἅλυσίν μου οὐκ ἐπαισχύνθη·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/016.yaml
  text: May the Lord grant mercy to the household of Onesiphorus[a], because he often refreshed me and was not ashamed of my chain.
translation:
  language: ml
  text: ഒനേസിഫൊരൊസിന്റെ കുടുംബത്തോട് കർത്താവ് കരുണ കാണിക്കട്ടെ. കാരണം, അവൻ പലപ്പോഴും എനിക്ക് ആശ്വാസം പകർന്നു; എന്റെ ചങ്ങലയെക്കുറിച്ച് ലജ്ജിച്ചതുമില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘എന്റെ തടവിനെക്കുറിച്ച്’; അക്ഷരാർഥം ‘എന്റെ ചങ്ങല’.
    reason: lexical_alternative
lexical_decisions:
- source_word: δῴη
  choice: കാണിക്കട്ടെ
  rationale: അയോറിസ്റ്റ് ഓപ്റ്റേറ്റീവ് ഒരു പ്രാർഥനാപരമായ ആശംസയാണ് സൂചിപ്പിക്കുന്നത്. ‘കരുണ കാണിക്കട്ടെ’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികമായി ആ ഭാവം നൽകുന്നു.
- source_word: ἔλεος
  choice: കരുണ
  rationale: ദുരിതത്തിലിരിക്കുന്നവരോടുള്ള ദൈവിക ദയയെ സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾഭാഷയിലും പൊതുഭാഷയിലും വ്യക്തമായ പദം.
- source_word: ὁ κύριος
  choice: കർത്താവ്
  rationale: ദൈവിക സ്ഥാനനാമമായ κύριος എന്നതിന്റെ സ്വാഭാവികവും മാന്യവുമായ മലയാളരൂപം; ആരെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് വാക്യം വ്യക്തമാക്കാത്തതിനാൽ അതിനെ കൂടുതൽ നിർവചിക്കുന്നില്ല.
- source_word: τῷ Ὀνησιφόρου οἴκῳ
  choice: ഒനേസിഫൊരൊസിന്റെ കുടുംബത്തോട്
  rationale: οἶκος ഇവിടെ കെട്ടിടത്തെക്കാൾ കുടുംബം/ഗൃഹസമൂഹം എന്ന സാമൂഹിക അർഥത്തിലാണ്; ‘കുടുംബം’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്.
- source_word: ὅτι
  choice: കാരണം
  rationale: മുൻപുള്ള ആശംസയുടെ കാരണം വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: πολλάκις
  choice: പലപ്പോഴും
  rationale: ആവർത്തിച്ചുണ്ടായ പ്രവൃത്തിയെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി വ്യക്തമാക്കുന്നു.
- source_word: ἀνέψυξεν
  choice: എനിക്ക് ആശ്വാസം പകർന്നു
  rationale: ആശ്വാസവും ഉന്മേഷവും നൽകുക എന്ന ക്രിയയുടെ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; വെറും മാനസിക പ്രോത്സാഹനമായി അതിനെ ചുരുക്കുന്നില്ല.
- source_word: τὴν ἅλυσίν μου
  choice: എന്റെ ചങ്ങല
  rationale: ഏകവചനത്തിലുള്ള മൂർത്തമായ പ്രതീകം നിലനിർത്തുന്നു; അത് തടവിനെ സൂചിപ്പിക്കുന്ന ലക്ഷണപ്രയോഗമായിരിക്കാമെന്നത് അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: οὐκ ἐπαισχύνθη
  choice: ലജ്ജിച്ചതുമില്ല
  rationale: സാമൂഹികവും ധാർമികവുമായ ലജ്ജാഭാവത്തെ നേരിട്ടും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ അനുഗ്രഹാശംസയിലെ ‘കർത്താവ്’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: ‘കർത്താവ്’ എന്നു മാത്രം പരിഭാഷപ്പെടുത്തി വ്യക്തിയെ കൂടുതൽ നിർവചിക്കാതിരിക്കുക
  alternative: പിതാവായ ദൈവം; കർത്താവായ യേശു
  rationale: ഗ്രീക്ക് പാഠത്തിൽ ὁ κύριος എന്നു മാത്രമാണ്. അതിനാൽ വാക്യം തുറന്നുവെക്കുന്ന സൂചന പരിഭാഷയും തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘ചങ്ങല’ എന്ന മൂർത്തമായ മൂലപാഠചിത്രം മുഖ്യവാചകത്തിൽ നിലനിർത്തി, അതിന്റെ സാധ്യതയുള്ള ലക്ഷണാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
