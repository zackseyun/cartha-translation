source:
  edition: SBLGNT
  text: ἐκ τούτων γάρ εἰσιν οἱ ἐνδύνοντες εἰς τὰς οἰκίας καὶ ⸀αἰχμαλωτίζοντες γυναικάρια σεσωρευμένα ἁμαρτίαις, ἀγόμενα ἐπιθυμίαις ποικίλαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/006.yaml
  text: For among these are those who slip into households and capture little women burdened with sins[a], led along by various desires[c][b],
translation:
  language: ml
  text: ഇവരിൽപ്പെട്ടവരാണ് വീടുകളിലേക്ക് നുഴഞ്ഞുകയറി, പാപഭാരത്താൽ മൂടപ്പെട്ടവരും പലതരം മോഹങ്ങളാൽ നയിക്കപ്പെടുന്നവരുമായ ദുർബലരായ സ്ത്രീകളെ[a] തടവുകാരാക്കുന്നവർ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദുർബലരായ സ്ത്രീകൾ’ എന്നു പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്കുപദം ലഘുരൂപവും നിന്ദാസൂചകവുമാണ്; ഇവിടെ സ്ത്രീകളെ പൊതുവായി അല്ല, എളുപ്പം ഇരയാകുന്ന ഒരു വിഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കുപദത്തിന് യുദ്ധത്തിൽ ആളുകളെ പിടികൂടി തടവിലാക്കുന്നതിന്റെ ദൃശ്യഭാവമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τούτων
  choice: ഇക്കൂട്ടത്തിൽപ്പെട്ട
  rationale: മുൻവാക്യങ്ങളിൽ വിവരിച്ച വിഭാഗത്തിൽ ഇവരും ഉൾപ്പെടുന്നു എന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐνδύνοντες εἰς τὰς οἰκίας
  choice: വീടുകളിൽ നുഴഞ്ഞുകയറി
  rationale: രഹസ്യമായും കപടമായും അകത്തു കടക്കുന്നതിന്റെ ഭാവം നിലനിർത്തുന്നു; οἰκίας എന്ന ബഹുവചനത്തിന് നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ തുല്യം.
- source_word: αἰχμαλωτίζοντες
  choice: വശത്താക്കുന്നു
  rationale: ഇവിടെ ആളുകളെ സ്വാധീനത്തിനും നിയന്ത്രണത്തിനും കീഴിലാക്കുന്നതാണ് സന്ദർഭാർഥം; മൂലപദത്തിലെ യുദ്ധത്തടവുകാരാക്കുന്ന ദൃശ്യഭാവം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: γυναικάρια
  choice: ദുർബലസ്ത്രീകളെ
  rationale: സ്ത്രീകളെ പൊതുവായി വിശേഷിപ്പിക്കാതെ, സന്ദർഭത്തിലെ എളുപ്പം ഇരയാകുന്ന ഒരു വിഭാഗത്തെ സൂചിപ്പിക്കുന്ന നിന്ദാസൂചക ലഘുരൂപത്തിന്റെ പ്രയോഗബലം നൽകുന്നു.
- source_word: σεσωρευμένα ἁμαρτίαις
  choice: പാപങ്ങളാൽ ഭാരം ചുമക്കുന്നവരും
  rationale: പാപങ്ങൾ കുമിഞ്ഞുകൂടിയുണ്ടായ നിലയും അവയുടെ ഭാരവും പൂർത്തകാല നിഷ്ക്രിയ കൃദന്തത്തിന്റെ ആശയവും വ്യക്തമാക്കുന്നു.
- source_word: ἀγόμενα
  choice: നയിക്കപ്പെടുന്നവരുമായ
  rationale: പല മോഹങ്ങളുടെ സ്വാധീനത്തിൽ തുടർച്ചയായി കൊണ്ടുപോകപ്പെടുന്ന നിഷ്ക്രിയഭാവം നിലനിർത്തുന്നു.
- source_word: ἐπιθυμίαις ποικίλαις
  choice: പലതരം മോഹങ്ങളാൽ
  rationale: ധാർമികമായി പ്രതികൂലമായ ആഗ്രഹങ്ങളെയോ കാമനകളെയോ സൂചിപ്പിക്കുന്ന വിശാലതയും ποικίλαις എന്ന വൈവിധ്യവും സ്വാഭാവികമായി പകരുന്നു.
theological_decisions:
- issue: γυναικάρια എന്ന നിന്ദാസൂചക പരാമർശം
  choice: ദുർബലസ്ത്രീകൾ
  alternative: ചെറിയ സ്ത്രീകൾ; വിവേകമില്ലാത്ത സ്ത്രീകൾ; എളുപ്പം വഞ്ചിക്കപ്പെടുന്ന സ്ത്രീകൾ
  rationale: മൂലപദം സ്ത്രീകളെ പൊതുവായി കുറ്റപ്പെടുത്തുന്നില്ല; വ്യാജോപദേശകരുടെ ഇരകളാകുന്ന ഒരു പ്രത്യേക വിഭാഗത്തെ നിന്ദാസൂചകമായി പരാമർശിക്കുന്നു. ‘ദുർബലസ്ത്രീകൾ’ സന്ദർഭപരമായ ഇരയാകാവുന്ന നില വ്യക്തമാക്കുന്നു; ‘ചെറിയ സ്ത്രീകൾ’ മലയാളത്തിൽ ശരീരവലുപ്പമെന്ന തെറ്റായ അർഥം നൽകാം.
- issue: αἰχμαλωτίζοντες എന്ന തടവുകാരാക്കൽ ദൃശ്യഭാവം
  choice: പ്രധാനവാചകത്തിൽ ‘വശത്താക്കുന്നു’; അടിക്കുറിപ്പിൽ ‘തടവുകാരാക്കുന്നു’
  alternative: പിടിച്ചടക്കുന്നു; തടവിലാക്കുന്നു
  rationale: സാമൂഹികവും ആത്മീയവുമായ നിയന്ത്രണം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നതിനൊപ്പം മൂലത്തിലെ സൈനിക ദൃശ്യഭാവം മറച്ചുവയ്ക്കാതെ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: οἰκίας എന്ന ഗൃഹപരാമർശം
  choice: വീടുകളിൽ
  alternative: കുടുംബങ്ങളിൽ; ഭവനങ്ങളിൽ
  rationale: മൂലപദം ആദ്യം വീടുകളെ സൂചിപ്പിക്കുന്നു. ‘വീടുകളിൽ’ പ്രവേശനത്തിന്റെ ദൃശ്യഭാവം നിലനിർത്തുന്നു; ‘കുടുംബങ്ങളിൽ’ സാമൂഹികവ്യാപ്തി വ്യക്തമാക്കിയാലും വാചകത്തിൽ ഇല്ലാത്ത വ്യാഖ്യാനം കൂട്ടിച്ചേർക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘നുഴഞ്ഞുകയറി’ എന്നത് കപടമായ പ്രവേശനവും ‘വശത്താക്കുന്നു’ എന്നത് നിയന്ത്രണവിധേയമാക്കലും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു. ഓരോ അടിക്കുറിപ്പിന്റെയും സൂചകം മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
