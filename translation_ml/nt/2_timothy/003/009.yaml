- from: എന്നാൽ അവർ ഇനിയും മുന്നേറുകയില്ല[a]. കാരണം, അവരുടെ ഭോഷത്തം എല്ലാവർക്കും വ്യക്തമായിത്തീരും; ആ മനുഷ്യരുടേത് വ്യക്തമായതുപോലെതന്നെ[b].
