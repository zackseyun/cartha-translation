id: 2TI.3.9
reference: 2 Timothy 3:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλ’ οὐ προκόψουσιν ἐπὶ πλεῖον, ἡ γὰρ ἄνοια αὐτῶν ἔκδηλος ἔσται πᾶσιν, ὡς καὶ ἡ ἐκείνων ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/009.yaml
  text: But they will not advance any further[a], for their foolishness will be plain to everyone[b], as that of those men also became.
translation:
  language: ml
  text: എന്നാൽ അവർ ഇതിൽക്കൂടുതൽ മുന്നേറുകയില്ല[a]. കാരണം, അവരുടെ മൂഢത എല്ലാവർക്കും വ്യക്തമായിത്തീരും; ആ മനുഷ്യരുടെ മൂഢത വ്യക്തമായതുപോലെതന്നെ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കൂടുതൽ പുരോഗതി കൈവരിക്കുകയില്ല.’
    reason: lexical_alternative
  - marker: b
    text: മുൻവാക്യത്തിൽ പറഞ്ഞ യന്നേസിന്റെയും യംബ്രേസിന്റെയും മൂഢതയെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്.
    reason: cross_reference
lexical_decisions:
- source_word: προκόψουσιν
  choice: മുന്നേറുകയില്ല
  rationale: προκόπτω എന്ന പദത്തിലെ മുന്നോട്ടുള്ള നീക്കം എന്ന രൂപകം നിലനിർത്തുന്നു; വ്യാജോപദേഷ്ടാക്കളുടെ പ്രവർത്തനം വിജയകരമായി വളരുന്നു എന്ന അനുകൂലസൂചന ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: ἐπὶ πλεῖον
  choice: ഇനിയും
  rationale: നിഷേധത്തോടൊപ്പം ഈ പ്രയോഗം ‘കൂടുതൽ മുന്നോട്ട്’ അഥവാ ‘ഇതിലപ്പുറം’ എന്ന അർഥം നൽകുന്നു; മലയാളത്തിൽ ‘ഇനിയും മുന്നേറുകയില്ല’ സ്വാഭാവികമാണ്.
- source_word: ἄνοια
  choice: ഭോഷത്തം
  rationale: ബുദ്ധിയില്ലായ്മയും വിവേകശൂന്യതയും ഉൾക്കൊള്ളുന്ന ധാർമിക-ബൗദ്ധിക അർഥം ലളിതവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἔκδηλος
  choice: വ്യക്തമായിത്തീരും
  rationale: ഇപ്പോൾ മറഞ്ഞിരിക്കുന്ന കാര്യം എല്ലാവർക്കും പ്രകടമാകുമെന്ന ഭാവികാല അർഥം വ്യക്തമാക്കുന്നു.
- source_word: πᾶσιν
  choice: എല്ലാവർക്കും
  rationale: ദത്തിവ് ബഹുവചനത്തിന്റെ സർവവ്യാപക പരിധി സ്വാഭാവിക മലയാളത്തിൽ നേരിട്ട് അറിയിക്കുന്നു.
- source_word: ὡς καὶ ἡ ἐκείνων ἐγένετο
  choice: ആ മനുഷ്യരുടേത് വ്യക്തമായതുപോലെതന്നെ
  rationale: ἡ എന്നത് മുൻപുള്ള ‘ഭോഷത്തം’ എന്ന ആശയത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ലോപപ്രയോഗമാണ്. ‘ആ മനുഷ്യരുടേത്’ എന്ന് നൽകി താരതമ്യവും ἐκείνων എന്ന മുൻപരാമർശബന്ധവും നിലനിർത്തുന്നു; καίയുടെ ഊന്നൽ ‘പോലെതന്നെ’യിൽ പ്രതിഫലിക്കുന്നു.
theological_decisions:
- issue: ἐκείνων എന്നതിന്റെ സൂചിതർ
  choice: ‘ആ മനുഷ്യർ’ എന്നത് മുൻവാക്യത്തിൽ പറഞ്ഞ യന്നേസിനെയും യംബ്രേസിനെയും സൂചിപ്പിക്കുന്നു.
  alternative: പണ്ടുണ്ടായിരുന്ന വ്യാജോപദേഷ്ടാക്കളെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
  rationale: 3:8-ൽ യന്നേസും യംബ്രേസും ഉടൻ മുൻപ് പരാമർശിക്കപ്പെട്ടതിനാൽ അവരാണ് ഏറ്റവും സ്വാഭാവികമായ സൂചിതർ. മുഖ്യവാചകത്തിൽ പേരുകൾ ചേർക്കാതെ ‘ആ മനുഷ്യർ’ എന്നു നിലനിർത്തുന്നത് ഗ്രീക്കിന്റെ അനാഫോറയും സംക്ഷിപ്തതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘മുന്നേറുക’ മൂലപദത്തിലെ പുരോഗതിയുടെ രൂപകം നിലനിർത്തുന്നു. അവസാന ഉപവാക്യത്തിലെ ഗ്രീക്ക് ലോപപ്രയോഗം മലയാളത്തിൽ വായനാസൗകര്യത്തിനായി ‘വ്യക്തമായത്’ എന്ന് പൂർത്തിയാക്കിയെങ്കിലും, സൂചിതരുടെ പേരുകൾ മുഖ്യവാചകത്തിൽ ചേർത്ത് വ്യാഖ്യാനം കഠിനമാക്കിയിട്ടില്ല.
