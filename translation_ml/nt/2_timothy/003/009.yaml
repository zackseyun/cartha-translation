  terminology: ‘മൂഢത’ appropriately conveys the moral-intellectual folly of ἄνοια. ‘വ്യക്തമായിത്തീരും’ accurately renders ἔκδηλος ἔσται, and ‘എല്ലാവർക്കും’ preserves πᾶσιν. ‘ആ മനുഷ്യർ’ remains an appropriately anaphoric reference, with the footnote identifying the immediately preceding Jannes and Jambres.
  issues:
