id: 2TI.3.11
reference: 2 Timothy 3:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῖς διωγμοῖς, τοῖς παθήμασιν, οἷά μοι ἐγένετο ἐν Ἀντιοχείᾳ, ἐν Ἰκονίῳ, ἐν Λύστροις, οἵους διωγμοὺς ὑπήνεγκα· καὶ ἐκ πάντων με ἐρρύσατο ὁ κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/011.yaml
  text: the persecutions[a], the sufferings, such as happened to me in Antioch, in Iconium, in Lystra—what persecutions I endured[b]; and from them all the Lord rescued me.
translation:
  language: ml
  text: പീഡനങ്ങളും കഷ്ടാനുഭവങ്ങളും—അന്ത്യോക്യയിലും ഇക്കോന്യയിലും ലുസ്ത്രയിലും എനിക്ക് സംഭവിച്ചവയും—എന്തെല്ലാം പീഡനങ്ങളാണ് ഞാൻ സഹിച്ചത്![a] അവയിൽനിന്നെല്ലാം കർത്താവ്[b] എന്നെ വിടുവിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘എന്തുതരം പീഡനങ്ങളാണ് ഞാൻ സഹിച്ചത്!’'
    reason: οἵους διωγμούς എന്ന പ്രയോഗത്തിന്റെ ഗുണപരമായ അർഥം കൂടുതൽ നേരിട്ട് നൽകുന്ന പരിഭാഷാവികല്പം.
  - marker: b
    text: ‘കർത്താവ്’ എന്നത് മിക്കവാറും കർത്താവായ യേശുവിനെ സൂചിപ്പിക്കുന്നു; എന്നാൽ ഗ്രീക്ക് പാഠത്തിൽ ‘കർത്താവ്’ എന്നു മാത്രമേ ഉള്ളൂ.
    reason: ‘കർത്താവ്’ എന്ന പദവിയുടെ സാധ്യതയുള്ള സൂചിതവ്യക്തിയെ വ്യക്തമാക്കുമ്പോഴും ഉറവിടപാഠത്തിന്റെ അവ്യക്തത സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: διωγμοῖς / διωγμούς
  choice: പീഡനങ്ങൾ
  rationale: വിശ്വാസമോ ദൗത്യമോ നിമിത്തമുള്ള ശത്രുതാപരമായ വേട്ടയാടലും അടിച്ചമർത്തലും സൂചിപ്പിക്കുന്നതിനാൽ ‘പീഡനങ്ങൾ’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: παθήμασιν
  choice: കഷ്ടാനുഭവങ്ങൾ
  rationale: πάθημα സൂചിപ്പിക്കുന്ന അനുഭവിച്ച ദുരിതങ്ങളുടെ വിശാലത നിലനിർത്തുന്നു; ബാഹ്യമായ ഉപദ്രവത്തിലേക്ക് മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: οἷά μοι ἐγένετο
  choice: എനിക്ക് സംഭവിച്ചവയും
  rationale: മുമ്പു പറഞ്ഞ പീഡനങ്ങളുടെയും കഷ്ടാനുഭവങ്ങളുടെയും ഉദാഹരണങ്ങളായി മൂന്നു സ്ഥലങ്ങളിലെ സംഭവങ്ങളെ അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ബന്ധം നിലനിർത്തുന്നു.
- source_word: ἐν Ἀντιοχείᾳ, ἐν Ἰκονίῳ, ἐν Λύστροις
  choice: അന്ത്യോക്യയിലും ഇക്കോന്യയിലും ലുസ്ത്രയിലും
  rationale: സ്ഥലനാമങ്ങൾ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു; ഓരോ സ്ഥലത്തെയും ബന്ധിപ്പിക്കുന്ന ഗ്രീക്ക് ആവർത്തനത്തിന്റെ താളം ‘-യിലും’ എന്ന ആവർത്തനത്തിലൂടെ നിലനിർത്തി.
- source_word: οἵους διωγμοὺς
  choice: എന്തെല്ലാം പീഡനങ്ങൾ
  rationale: οἵους എന്നതിന്റെ ഗുണപരവും ആശ്ചര്യസൂചകവുമായ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ὑπήνεγκα
  choice: ഞാൻ സഹിച്ചത്
  rationale: സമ്മർദത്തിനുകീഴിൽ താങ്ങിനിൽക്കുകയോ സഹിക്കുകയോ ചെയ്യുക എന്ന ὑποφέρωയുടെ അർഥം ലളിതമായി നൽകുന്നു.
- source_word: ἐκ πάντων
  choice: അവയിൽ നിന്നെല്ലാം
  rationale: മുമ്പ് പറഞ്ഞ എല്ലാ പീഡനങ്ങളെയും കഷ്ടാനുഭവങ്ങളെയും പിന്നോട്ടു ചൂണ്ടുകയും അവയിൽനിന്നുള്ള വിടുതലിന്റെ ആശയം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐρρύσατο
  choice: വിടുവിച്ചു
  rationale: അപകടത്തിൽനിന്നോ കഷ്ടതയിൽനിന്നോ രക്ഷിച്ചെടുക്കുക എന്ന ῥύομαιയുടെ സന്ദർഭാർഥം നൽകുന്നു; ഇവിടെ അനാവശ്യമായ വിശാല രക്ഷാശാസ്ത്ര അർഥം അടിച്ചേൽപ്പിക്കുന്നില്ല.
- source_word: ὁ κύριος
  choice: കർത്താവ്
  rationale: പേര് വ്യക്തമാക്കാതെ ഗ്രീക്കിലുള്ള പദവി അതേപടി പരിഭാഷപ്പെടുത്തുന്നു.
theological_decisions:
- issue: ‘കർത്താവ്’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: പ്രധാനപാഠത്തിൽ ‘കർത്താവ്’ എന്നു മാത്രം നൽകി.
  alternative: ‘കർത്താവായ യേശു’
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിൽ ഇത് മിക്കവാറും യേശുവിനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും ഗ്രീക്ക് പാഠത്തിൽ ὁ κύριος എന്നു മാത്രമാണ്; ഉറവിടപാഠത്തിൽ ഇല്ലാത്ത പേര് പ്രധാനപാഠത്തിൽ ചേർക്കാതെ അവ്യക്തത നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. വാക്യം മുൻവാക്യത്തിലെ പട്ടികയുടെ തുടർച്ചയായതിനാൽ ആരംഭത്തിലെ നാമപദങ്ങൾ അതേ ഘടനയിൽ നിലനിർത്തി; ആശ്ചര്യസൂചകമായ οἵους എന്നതിന്റെ ഊന്നൽ മലയാളത്തിൽ ‘എന്തെല്ലാം’ എന്നും ആശ്ചര്യചിഹ്നം കൊണ്ടും പ്രകടമാക്കി.
