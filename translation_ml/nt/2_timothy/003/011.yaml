    issue: Footnote a is anchored to the first occurrence of “പീഡനങ്ങളും,” although its content concerns the later phrase οἵους διωγμούς.
    rationale: The marker should follow “എന്തെല്ലാം പീഡനങ്ങളാണ് ഞാൻ സഹിച്ചത്!” so that the anchor precisely identifies the expression for which the alternative is offered.
