id: 2TI.3.2
reference: 2 Timothy 3:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔσονται γὰρ οἱ ἄνθρωποι φίλαυτοι, φιλάργυροι, ἀλαζόνες, ὑπερήφανοι, βλάσφημοι, γονεῦσιν ἀπειθεῖς, ἀχάριστοι, ἀνόσιοι,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/002.yaml
  text: For people will be lovers of self[a], lovers of money, boastful, arrogant, slanderous, disobedient to parents, ungrateful, unholy,
translation:
  language: ml
  text: എന്തെന്നാൽ, മനുഷ്യർ സ്വയം സ്നേഹിക്കുന്നവരും പണത്തെ സ്നേഹിക്കുന്നവരും പൊങ്ങച്ചക്കാരും അഹങ്കാരികളും ദൂഷണം പറയുന്നവരും[a] മാതാപിതാക്കളെ അനുസരിക്കാത്തവരും നന്ദിയില്ലാത്തവരും വിശുദ്ധിയില്ലാത്തവരും ആയിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദൈവദൂഷണം പറയുന്നവർ” അല്ലെങ്കിൽ “അധിക്ഷേപിക്കുന്നവർ.” ഗ്രീക്ക് പദം മനുഷ്യരെയോ ദൈവത്തെയോ അപമാനിക്കുന്ന സംസാരത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσονται
  choice: ആയിരിക്കും
  rationale: εἰμί എന്ന ക്രിയയുടെ ഭാവികാലരൂപം; പട്ടികയിലെ എല്ലാ വിശേഷണങ്ങളെയും സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ പ്രസ്താവനയ്ക്കുള്ള വിശദീകരണമാണ് ഇവിടെ തുടങ്ങുന്നതെന്ന് വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളബന്ധകം.
- source_word: οἱ ἄνθρωποι
  choice: മനുഷ്യർ
  rationale: വ്യാകരണപരമായി പുല്ലിംഗ ബഹുവചനമായിരുന്നാലും പ്രയോഗം മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു; പുരുഷന്മാരിലേക്കു മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: φίλαυτοι
  choice: സ്വയം സ്നേഹിക്കുന്നവർ
  rationale: സ്വാർഥമായ ആത്മസ്നേഹത്തെ സൂചിപ്പിക്കുന്ന സംയുക്തപദം; സന്ദർഭത്തിലെ ദോഷപ്പട്ടിക ആ പ്രതികൂലഭാവം വ്യക്തമാക്കുന്നു, അതേസമയം മൂലത്തിലെ ‘സ്നേഹിക്കുന്നവർ’ എന്ന ഘടന നിലനിർത്തുന്നു.
- source_word: φιλάργυροι
  choice: പണത്തെ സ്നേഹിക്കുന്നവർ
  rationale: അക്ഷരാർഥത്തിൽ വെള്ളിയെയോ പണത്തെയോ സ്നേഹിക്കുന്നവർ; φίλαυτοι എന്നതിനോടുള്ള രൂപസമാന്തര്യം നിലനിർത്തുകയും പൊതുവായ ‘അത്യാഗ്രഹം’ എന്ന ആശയത്തിലേക്ക് അർഥം വിപുലീകരിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀλαζόνες
  choice: പൊങ്ങച്ചക്കാർ
  rationale: സ്വന്തം മഹത്വം വീമ്പോടെ പ്രദർശിപ്പിക്കുന്നവരെ സൂചിപ്പിക്കുന്ന, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: ὑπερήφανοι
  choice: അഹങ്കാരികൾ
  rationale: പദത്തിന്റെ പ്രതികൂലമായ ധാർമികഭാവം വ്യക്തമായി നൽകുകയും ἀλαζόνες എന്നതിൽനിന്ന് ആശയപരമായ വ്യത്യാസം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: βλάσφημοι
  choice: ദൂഷണം പറയുന്നവർ
  rationale: മനുഷ്യരെയോ ദൈവത്തെയോ അപമാനിക്കുന്ന ഹാനികരമായ സംസാരത്തെ ഉൾക്കൊള്ളാൻ കഴിയുന്ന വിശാലമായ പ്രയോഗം; സാധ്യതയുള്ള മറ്റു അർഥങ്ങൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: γονεῦσιν ἀπειθεῖς
  choice: മാതാപിതാക്കളെ അനുസരിക്കാത്തവർ
  rationale: ദത്തിവോടുകൂടിയ ἀπειθεῖς എന്ന പ്രയോഗത്തിന്റെ നേരായതും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: ἀχάριστοι
  choice: നന്ദിയില്ലാത്തവർ
  rationale: നന്ദിബോധത്തിന്റെ അഭാവം സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: ἀνόσιοι
  choice: വിശുദ്ധിയില്ലാത്തവർ
  rationale: വിശുദ്ധമായതിനോടുള്ള ഭക്തിയും ആദരവും ഇല്ലായ്മയെന്ന മതധാർമിക ശക്തി നിലനിർത്തുന്നു; ‘അഭക്തർ’ എന്നതുപോലെ അർഥം ഒരു പ്രത്യേക വശത്തിലേക്ക് ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: οἱ ἄνθρωποι എന്ന പൊതുവായ പുല്ലിംഗപ്രയോഗം
  choice: മനുഷ്യർ
  alternative: പുരുഷന്മാർ
  rationale: ഇവിടെ ഉദ്ദേശിക്കുന്നത് പുരുഷന്മാരെ മാത്രം അല്ല, മനുഷ്യരെ പൊതുവായാണ്; അതിനാൽ ലിംഗപരമായി അനാവശ്യമായ പരിമിതി വരുത്തുന്നില്ല.
- issue: βλάσφημοι എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി
  choice: ദൂഷണം പറയുന്നവർ
  alternative: ദൈവദൂഷണം പറയുന്നവർ / അധിക്ഷേപിക്കുന്നവർ
  rationale: ഗ്രീക്ക് പദത്തിന് മനുഷ്യർക്കെതിരായ ദൂഷണത്തെയും ദൈവത്തിനെതിരായ ദൂഷണത്തെയും സൂചിപ്പിക്കാം. മുഖ്യപാഠത്തിലെ വിശാലമായ പരിഭാഷയും അടിക്കുറിപ്പിലെ പകരങ്ങളും ഈ യഥാർഥ സന്ദിഗ്ധത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ദോഷപ്പട്ടികാശൈലി ഉപയോഗിച്ചു. ആവർത്തിക്കുന്ന ‘-വരും’ ഘടന മൂലപാഠത്തിലെ പട്ടികയുടെ താളവും സമാന്തര്യവും മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു. നൽകിയ ഇംഗ്ലീഷ് പാഠത്തിൽ [a] ചിഹ്നം ‘lovers of self’ എന്നതിനുശേഷം പ്രത്യക്ഷപ്പെട്ടിരുന്നെങ്കിലും അടിക്കുറിപ്പിന്റെ ഉള്ളടക്കവും βλάσφημοι എന്ന ഗ്രീക്ക് പദവും തമ്മിലുള്ള വ്യക്തമായ ബന്ധം കാരണം മലയാള മുഖ്യപാഠത്തിൽ അത് ‘ദൂഷണം പറയുന്നവർ’ എന്നതിനുശേഷം ചേർത്തു.
