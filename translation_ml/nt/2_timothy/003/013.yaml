id: 2TI.3.13
reference: 2 Timothy 3:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πονηροὶ δὲ ἄνθρωποι καὶ γόητες προκόψουσιν ἐπὶ τὸ χεῖρον, πλανῶντες καὶ πλανώμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/013.yaml
  text: But evil people and impostors will go on from bad to worse[b][a], deceiving and being deceived.
translation:
  language: ml
  text: എന്നാൽ ദുഷ്ടരായ മനുഷ്യരും കപടന്മാരും[a] വഞ്ചിച്ചും വഞ്ചിക്കപ്പെട്ടും കൂടുതൽ വഷളായിക്കൊണ്ടിരിക്കും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കപടന്മാർ’ എന്നതിന് ‘തട്ടിപ്പുകാർ,’ ‘വഞ്ചകർ’ എന്നും വിവർത്തനം ചെയ്യാം; ഗ്രീക്കുപദത്തിന് ചില സന്ദർഭങ്ങളിൽ മന്ത്രവാദത്തിന്റെയോ വ്യാജചികിത്സയുടെയോ അർഥനിറവും ഉണ്ടാകാം.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘വഷളായതിലേക്കു മുന്നേറും.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηροὶ
  choice: ദുഷ്ടരായ
  rationale: കേവലം മോശം എന്നതിലുപരി ധാർമിക തിന്മയെ സൂചിപ്പിക്കുന്ന വിശേഷണം.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ ആശയത്തോടുള്ള വൈരുധ്യം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἄνθρωποι
  choice: മനുഷ്യർ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചനം ഇവിടെ പുരുഷന്മാരെ മാത്രം അല്ല, പൊതുവായി മനുഷ്യരെ സൂചിപ്പിക്കുന്നു.
- source_word: γόητες
  choice: കപടന്മാർ
  rationale: വ്യാജവേഷവും വഞ്ചനയുംകൊണ്ട് മറ്റുള്ളവരെ തെറ്റിക്കുന്നവരെന്ന ആശയം നൽകുന്നു; സന്ദർഭം ഉറപ്പിക്കാത്ത മന്ത്രവാദാർഥം മുഖ്യപാഠത്തിൽ അനാവശ്യമായി ചുമത്തുന്നില്ല.
- source_word: προκόψουσιν ἐπὶ τὸ χεῖρον
  choice: കൂടുതൽ വഷളായിക്കൊണ്ടിരിക്കും
  rationale: അക്ഷരാർഥമായ ‘കൂടുതൽ മോശമായതിലേക്കു മുന്നേറും’ എന്ന വിരോധാഭാസപരമായ ചലനത്തെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: πλανῶντες
  choice: വഞ്ചിച്ചും
  rationale: തുടർച്ചയായ പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്ന വർത്തമാന കൃദന്തരൂപത്തിന്റെ അർഥം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: πλανώμενοι
  choice: വഞ്ചിക്കപ്പെട്ടും
  rationale: വഞ്ചിക്കുന്നവർ തന്നെ വഞ്ചനയ്ക്ക് വിധേയരാകുന്നു എന്ന കർമണിപ്രയോഗം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἄνθρωποι എന്ന പുല്ലിംഗ രൂപത്തിന്റെ വ്യാപ്തി
  choice: മനുഷ്യർ
  alternative: പുരുഷന്മാർ
  rationale: ഇവിടെ വ്യാകരണപരമായ പുല്ലിംഗം പുരുഷന്മാരെ മാത്രം പരാമർശിക്കുന്നില്ല; പൊതുവായ മനുഷ്യവ്യക്തികളാണ് ഉദ്ദേശ്യം.
- issue: γόητες എന്ന പദത്തിന്റെ അർഥനിറം
  choice: കപടന്മാർ
  alternative: മന്ത്രവാദികൾ / തട്ടിപ്പുകാർ
  rationale: പദത്തിന് ചില സന്ദർഭങ്ങളിൽ മന്ത്രവാദത്തിന്റെയോ വ്യാജചികിത്സയുടെയോ അർഥനിറം ഉണ്ടാകാമെങ്കിലും, ഇവിടെ ഉറപ്പുള്ളത് വഞ്ചനാപരമായ കപടതയാണ്; അതിനാൽ മുഖ്യപാഠം അതിലൊതുക്കുന്നു.
- issue: πλανώμενοι എന്ന രൂപത്തിന്റെ കർമണിത്വം
  choice: വഞ്ചിക്കപ്പെട്ടും
  alternative: വഴിതെറ്റിയും
  rationale: അവർ മറ്റുള്ളവരെ വഞ്ചിക്കുന്നവരായിരിക്കുമ്പോഴും സ്വയം വഞ്ചിക്കപ്പെടുന്നവരാണ് എന്ന പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. ‘വഞ്ചിച്ചും വഞ്ചിക്കപ്പെട്ടും’ എന്ന സമാന്തരഘടന മൂലപാഠത്തിന്റെ ആവർത്തനവും കർമണി വൈരുധ്യവും സംരക്ഷിക്കുന്നു. അടിക്കുറിപ്പുകളുടെ ക്രമം മുഖ്യപാഠത്തിലെ ബന്ധപ്പെട്ട ഘടകങ്ങളുടെ ക്രമത്തിന് അനുസരിച്ചാണ്.
