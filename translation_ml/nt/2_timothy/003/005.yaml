revisions:
- from: ദൈവഭക്തിയുടെ രൂപം[a] ഉള്ളവരെങ്കിലും അതിന്റെ ശക്തിയെ നിഷേധിച്ചവരായിരിക്കും; ഇങ്ങനെയുള്ളവരിൽനിന്ന് അകന്നുനിൽക്കുക.[b]
  to: ദൈവഭക്തിയുടെ രൂപം[a] ഉള്ളവരായിരിക്കെ അതിന്റെ ശക്തിയെ നിഷേധിച്ചവർ; അങ്ങനെയുള്ളവരിൽനിന്ന് അകന്നുനിൽക്കുക.[b]
  rationale: The revision removes the erroneous future nuance, makes the concessive relationship between outward form and denial of power idiomatic in modern Malayalam, and preserves the source’s open-ended theological contrast. Footnote anchors remain attached to the same translated terms and command.
