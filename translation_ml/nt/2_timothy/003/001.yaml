id: 2TI.3.1
reference: 2 Timothy 3:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τοῦτο δὲ γίνωσκε ὅτι ἐν ἐσχάταις ἡμέραις ἐνστήσονται καιροὶ χαλεποί·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/001.yaml
  text: 'But know this: in the last days difficult times will come[a].'
translation:
  language: ml
  text: 'എന്നാൽ ഇതു മനസ്സിലാക്കുക: അന്ത്യനാളുകളിൽ ദുഷ്കരമായ കാലങ്ങൾ വന്നുചേരും.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അപകടകരമായ കാലങ്ങൾ’ അല്ലെങ്കിൽ ‘കഠിനമായ കാലങ്ങൾ.’ ഗ്രീക്ക് വിശേഷണം പ്രയാസകരമോ അപകടകരമോ അത്യന്തം കഠിനമോ ആയ കാലങ്ങളെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο
  choice: ഇതു
  rationale: ὅτι ആരംഭിക്കുന്ന തുടർവാക്യത്തിലെ ഉള്ളടക്കത്തിലേക്ക് മുൻകൂട്ടി ചൂണ്ടുന്ന നപുംസകലിംഗ സർവനാമത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭത്തിൽനിന്നുള്ള മൃദുവായ വൈരുധ്യമോ ആശയവികാസമോ സൂചിപ്പിക്കുന്നു; അതിനെ അതിശയിപ്പിക്കാതെ നിലനിർത്തുന്നു.
- source_word: γίνωσκε
  choice: മനസ്സിലാക്കുക
  rationale: വർത്തമാനകാല ആജ്ഞാരൂപം ഇവിടെ ഒരു യാഥാർഥ്യം തിരിച്ചറിഞ്ഞ് ബോധ്യത്തോടെ ഇരിക്കാനുള്ള ആഹ്വാനമാണ്. 'അറിയുക' സാധ്യമെങ്കിലും മലയാളത്തിൽ ഈ ഘടനയിൽ 'മനസ്സിലാക്കുക' കൂടുതൽ സ്വാഭാവികമാണ്.
- source_word: ὅτι
  choice: ':'
  rationale: '''ഇതു'' എന്നതിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ദ്വിബിന്ദു അതിന്റെ പ്രവർത്തനം സ്വാഭാവികമായി നിർവഹിക്കുന്നു.'
- source_word: ἐν ἐσχάταις ἡμέραις
  choice: അന്ത്യനാളുകളിൽ
  rationale: സ്ഥിരമായ അന്ത്യകാലപ്രയോഗം നിലനിർത്തുന്നു; അതിന്റെ കാലപരിധിയെ വിവർത്തനംകൊണ്ട് കൂടുതൽ ചുരുക്കുന്നില്ല.
- source_word: ἐνστήσονται
  choice: വന്നുചേരും
  rationale: കാലങ്ങൾ നിലവിൽ വരികയോ എത്തിച്ചേരുകയോ ചെയ്യുന്നതാണ് ഭാവി മധ്യരൂപത്തിന്റെ ആശയം; 'വന്നുചേരും' അത് സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: καιροὶ
  choice: കാലങ്ങൾ
  rationale: വെറും ക്രമാനുസൃത സമയത്തേക്കാൾ പ്രത്യേക കാലഘട്ടങ്ങളെയോ സാഹചര്യങ്ങളെയോ സൂചിപ്പിക്കുന്ന καιρός എന്ന പദത്തിന് യോജിച്ച പൊതുരൂപം.
- source_word: χαλεποί
  choice: ദുഷ്കരമായ
  rationale: പ്രയാസകരം, അപകടകരം, കഠിനം എന്നീ അർഥവ്യാപ്തി അനുവദിക്കുന്ന ഗൗരവമുള്ള ആധുനിക മലയാളപദം.
theological_decisions:
- issue: '''അന്ത്യനാളുകൾ'' എന്നതിന്റെ കാലപരിധി'
  choice: '''അന്ത്യനാളുകളിൽ'' എന്ന അന്ത്യകാലപ്രയോഗം അതേപടി നിലനിർത്തി; ക്രിസ്തുവിന്റെ മടങ്ങിവരവിന് തൊട്ടുമുമ്പുള്ള കാലത്തേക്ക് മാത്രം ചുരുക്കിയില്ല.'
  alternative: അവസാനത്തിനു തൊട്ടുമുമ്പുള്ള അന്തിമഘട്ടം; അല്ലെങ്കിൽ പുതിയനിയമത്തിലെ വിശാലമായ, ഇതിനകം ആരംഭിച്ച അന്ത്യകാലം.
  rationale: ഗ്രീക്ക് പ്രയോഗം ഇരു വായനകൾക്കും ഇടം നൽകുന്നു. ഒരു പ്രത്യേക അന്ത്യകാലവ്യവസ്ഥ അടിച്ചേൽപ്പിക്കാതെ അതിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും തുറന്ന നിലയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. വാക്യത്തിന്റെ മുന്നറിയിപ്പുസ്വരം നിലനിർത്തിക്കൊണ്ട് പദാർഥത്തിലെ വ്യാപ്തിയും അന്ത്യകാലപ്രയോഗത്തിലെ അനിശ്ചിതത്വവും സംരക്ഷിച്ചു.
