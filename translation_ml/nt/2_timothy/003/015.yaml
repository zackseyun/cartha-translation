id: 2TI.3.15
reference: 2 Timothy 3:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὅτι ἀπὸ βρέφους ⸀ἱερὰ γράμματα οἶδας, τὰ δυνάμενά σε σοφίσαι εἰς σωτηρίαν διὰ πίστεως τῆς ἐν Χριστῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/015.yaml
  text: and that from infancy you have known the sacred writings[b][a], which are able to make you wise for salvation through faith in Messiah Jesus.
translation:
  language: ml
  text: ശൈശവം മുതൽ നീ വിശുദ്ധ ലിഖിതങ്ങൾ[a] അറിഞ്ഞിരിക്കുന്നു; അവ നിനക്കു മശീഹയായ യേശുവിലുള്ള വിശ്വാസത്തിലൂടെ[b] രക്ഷയ്ക്കായി ജ്ഞാനിയാകാൻ കഴിവുള്ളവയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വിശുദ്ധ തിരുവെഴുത്തുകൾ.’ ഗ്രീക്കിൽ അക്ഷരാർഥം ‘വിശുദ്ധ ലിഖിതങ്ങൾ’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘മശീഹയായ യേശുവിന്റെ വിശ്വസ്തതയിലൂടെ.’ എന്നാൽ ഇവിടെ ‘മശീഹയായ യേശുവിലുള്ള വിശ്വാസത്തിലൂടെ’ എന്ന അർഥമാണ് കൂടുതൽ സ്വാഭാവികം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπὸ βρέφους
  choice: ശൈശവംമുതൽ
  rationale: βρέφος വളരെ ചെറിയ കുട്ടിയെയോ ശിശുവെയോ സൂചിപ്പിക്കുന്നു; പൊതുവായ ‘കുട്ടിക്കാലംമുതൽ’ എന്നതിനെക്കാൾ ശക്തമായ അർഥം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἱερὰ γράμματα
  choice: വിശുദ്ധ ലിഖിതങ്ങൾ
  rationale: ‘വിശുദ്ധമായ എഴുത്തുകൾ’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം അടുത്തായി നിലനിർത്തുകയും പിന്നീട് രൂപപ്പെട്ട സാങ്കേതിക സംജ്ഞ അനാവശ്യമായി ഇറക്കുമതി ചെയ്യാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: οἶδας
  choice: അറിഞ്ഞിരിക്കുന്നു
  rationale: രൂപത്തിൽ പൂർണകാലമായ οἶδα വർത്തമാന അർഥം നൽകുന്നു; ശൈശവംമുതൽ തുടരുന്ന അറിവ് മലയാളത്തിൽ ഈ പ്രയോഗം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: τὰ δυνάμενά
  choice: അവയ്ക്കു കഴിയും
  rationale: കഴിവിനെ സൂചിപ്പിക്കുന്ന കർത്തൃപ്രയോഗം നിലനിർത്തുകയും അതിന്റെ പൂർവപദം വിശുദ്ധ ലിഖിതങ്ങളാണെന്ന് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: σε σοφίσαι
  choice: നിന്നെ ജ്ഞാനിയാക്കാൻ
  rationale: σοφίζω എന്നതിന്റെ ‘ജ്ഞാനിയാക്കുക/ജ്ഞാനം പകരുക’ എന്ന നേരിട്ടുള്ള അർഥം സംരക്ഷിക്കുന്നു.
- source_word: εἰς σωτηρίαν
  choice: രക്ഷയ്ക്കായി
  rationale: εἰς സൂചിപ്പിക്കുന്ന ലക്ഷ്യമോ ഫലമോ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: διὰ πίστεως
  choice: വിശ്വാസത്തിലൂടെ
  rationale: ഇവിടെ πίστις സാധാരണയായി വിശ്വാസം എന്ന അർഥത്തിലാണ്; διά മാർഗത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: മശീഹയായ യേശുവിലുള്ള
  rationale: Χριστός എന്ന പദത്തിന്റെ സ്ഥാനപ്പേരായ അർഥം ‘മശീഹാ’ എന്നു പരിഭാഷപ്പെടുത്തി, ἐν സൂചിപ്പിക്കുന്ന വിശ്വാസത്തിന്റെ ആധാരം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: Χριστῷ എന്നത് സ്ഥാനപ്പേരായോ പേരിന്റെ ഭാഗമായോ പരിഭാഷപ്പെടുത്തൽ
  choice: മശീഹയായ യേശു
  alternative: ക്രിസ്തുയേശു
  rationale: ഈ പൗലോസീയ പ്രയോഗത്തിലും Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ അർഥം സജീവമാണ്; അതിനാൽ പരമ്പരാഗത ലിപ്യന്തരണത്തിനു പകരം അതിന്റെ അർഥം പരിഭാഷയിൽ നിലനിർത്തുന്നു.
- issue: διὰ πίστεως τῆς ἐν Χριστῷ Ἰησοῦ എന്നതിലെ πίστεως-ന്റെ അർഥം
  choice: മശീഹയായ യേശുവിലുള്ള വിശ്വാസത്തിലൂടെ
  alternative: മശീഹയായ യേശുവിന്റെ വിശ്വസ്തതയിലൂടെ
  rationale: ഈ ഘടന ഏറ്റവും സ്വാഭാവികമായി യേശുവിൽ അർപ്പിക്കുന്ന വിശ്വാസത്തെയാണ് സൂചിപ്പിക്കുന്നത്; എങ്കിലും ‘മശീഹയുടെ വിശ്വസ്തത’ എന്ന വ്യാകരണപരമായി സാധ്യമായ വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. വാക്യത്തിന്റെ തുടക്കത്തിലെ καὶ ὅτι മുൻസന്ദർഭവുമായി ബന്ധിപ്പിക്കുന്നതിനാൽ ‘എന്നും’ എന്ന ഘടനയിൽ പ്രതിഫലിപ്പിച്ചു; വായനാസൗകര്യത്തിനായി മലയാളത്തിൽ രണ്ടു വാക്യങ്ങളാക്കി.
