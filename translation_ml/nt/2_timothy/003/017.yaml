id: 2TI.3.17
reference: 2 Timothy 3:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἵνα ἄρτιος ᾖ ὁ τοῦ θεοῦ ἄνθρωπος, πρὸς πᾶν ἔργον ἀγαθὸν ἐξηρτισμένος.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/017.yaml
  text: so that the man of God may be complete[b][a], equipped for every good work.
translation:
  language: ml
  text: ദൈവത്തിന്റെ മനുഷ്യൻ[b] പൂർണമായി പ്രാപ്തനായും എല്ലാ സൽപ്രവൃത്തികൾക്കും സജ്ജനായും ഇരിക്കേണ്ടതിന്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എല്ലാ സൽപ്രവൃത്തികൾക്കും പൂർണമായി ഒരുക്കപ്പെട്ടവനായും.’ ἐξηρτισμένος എന്ന ഗ്രീക്ക് പദം ആവശ്യമായതെല്ലാം നൽകി സമഗ്രമായി ഒരുക്കപ്പെട്ട അവസ്ഥയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ദൈവത്തിന്റെ മനുഷ്യൻ’ എന്നത് ഗ്രീക്കിൽ പുൽലിംഗ ഏകവചനത്തിലുള്ള, തിരുവെഴുത്തിൽ പരിചിതമായ ഒരു പദപ്രയോഗമാണ്. സന്ദർഭത്തിൽ ഇത് പ്രത്യേകിച്ച് ദൈവശുശ്രൂഷകനെ സൂചിപ്പിക്കാമെങ്കിലും, തിരുവെഴുത്തിനാൽ രൂപപ്പെടുന്ന വിശ്വാസിക്കും വിശാലമായി ബാധകമാകാം.
    reason: cultural_note
lexical_decisions:
- source_word: ἵνα
  choice: ആയിരിക്കേണ്ടതിന്
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ തിരുവെഴുത്തിന്റെ പ്രയോജനത്തിന്റെ ഉദ്ദേശ്യഫലം വ്യക്തമാക്കുന്ന ἵνα-ഉപവാക്യത്തിന്റെ ലക്ഷ്യാർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἄρτιος
  choice: പൂർണയോഗ്യനായി
  rationale: പൂർണതയോടൊപ്പം ഒരു ദൗത്യത്തിന് തക്ക യോഗ്യതയുള്ളവൻ എന്ന അർഥവും നൽകുന്നു; പാപരഹിതമായ പരിപൂർണത എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: ὁ τοῦ θεοῦ ἄνθρωπος
  choice: ദൈവത്തിന്റെ മനുഷ്യൻ
  rationale: ഗ്രീക്കിലെ പുൽലിംഗ ഏകവചനവും തിരുവെഴുത്തിൽ പരിചിതമായ വിശേഷണരൂപവും നിലനിർത്തുന്നു. ‘ദൈവമനുഷ്യൻ’ എന്ന ഒറ്റപ്പദം ദൈവ-മനുഷ്യ സ്വഭാവത്തെക്കുറിച്ചുള്ള സാങ്കേതിക പ്രയോഗമായി തെറ്റിദ്ധരിക്കപ്പെടാം എന്നതിനാൽ ഒഴിവാക്കി.
- source_word: πρὸς πᾶν ἔργον ἀγαθόν
  choice: എല്ലാ സൽപ്രവൃത്തിക്കും
  rationale: πᾶν എന്നതിന്റെ സമഗ്രവ്യാപ്തിയും ἀγαθόν എന്നതിന്റെ ധാർമിക ഗുണവും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: ἐξηρτισμένος
  choice: സജ്ജനായിരിക്കേണ്ടതിന്
  rationale: ἐξαρτίζω എന്ന ക്രിയയുടെ perfect passive participle രൂപം സൂചിപ്പിക്കുന്ന, ആവശ്യമായ ഒരുക്കവും ഉപകരണലഭ്യതയും കൈവന്ന അവസ്ഥ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ‘പൂർണമായി സജ്ജനായ’ എന്ന സാധുവായ ശക്തമായ വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: ὁ τοῦ θεοῦ ἄνθρωπος എന്ന പുൽലിംഗ ഏകവചനപ്രയോഗത്തിന്റെ പരിധി
  choice: ദൈവത്തിന്റെ മനുഷ്യൻ
  alternative: ദൈവത്തിന്റേതായ വ്യക്തി
  rationale: ഗ്രീക്ക് പാഠത്തിലെ പുൽലിംഗ ഏകവചനവും അംഗീകൃതമായ ബൈബിൾ വിശേഷണവും മറച്ചുവയ്ക്കുന്നില്ല. സന്ദർഭത്തിൽ ഇത് ആദ്യം ദൈവശുശ്രൂഷകനെ സൂചിപ്പിക്കാമെങ്കിലും, തിരുവെഴുത്തിനാൽ രൂപപ്പെടുന്ന വിശ്വാസിക്ക് വിശാലമായി ബാധകമാകുന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘സൽപ്രവൃത്തി’ എന്ന പരിചിതമായ ബൈബിൾ പദപ്രയോഗം നിലനിർത്തി. ‘പൂർണയോഗ്യൻ’ എന്നും ‘സജ്ജൻ’ എന്നും ഉപയോഗിച്ച് ἄρτιος, ἐξηρτισμένος എന്നീ പരസ്പരം ബന്ധപ്പെട്ടെങ്കിലും വ്യത്യസ്തമായ ആശയങ്ങൾ വേർതിരിച്ചു.
