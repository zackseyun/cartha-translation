revisions:
- from: ദൈവത്തിന്റെ മനുഷ്യൻ[b] പൂർണയോഗ്യനായി, എല്ലാ സൽപ്രവൃത്തിക്കും സജ്ജനായിരിക്കേണ്ടതിന്.[a]
