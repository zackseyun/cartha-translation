id: 2TI.3.8
reference: 2 Timothy 3:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃν τρόπον δὲ Ἰάννης καὶ Ἰαμβρῆς ἀντέστησαν Μωϋσεῖ, οὕτως καὶ οὗτοι ἀνθίστανται τῇ ἀληθείᾳ, ἄνθρωποι κατεφθαρμένοι τὸν νοῦν, ἀδόκιμοι περὶ τὴν πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/008.yaml
  text: Just as Jannes and Jambres opposed Moses[a], so also these men oppose the truth—men corrupted in mind[b], disqualified regarding the faith.
translation:
  language: ml
  text: യന്നേസും യംബ്രേസും മോശെയെ എതിർത്തതുപോലെ[a], ഇവരും സത്യത്തെ എതിർക്കുന്നു—ബുദ്ധി ദുഷിച്ചവരും വിശ്വാസത്തിന്റെ[b] കാര്യത്തിൽ അയോഗ്യരായവരുമായ മനുഷ്യർ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മോശെയെ ചെറുത്തുനിന്നതുപോലെ”; തുടർന്ന്, “സത്യത്തെ ചെറുത്തുനിൽക്കുന്നു.”
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ “വിശ്വാസം” എന്നത് വ്യക്തിപരമായ വിശ്വസിക്കൽ മാത്രമല്ല, ക്രൈസ്തവ വിശ്വാസത്തെയോ അപ്പൊസ്തോലിക സന്ദേശത്തെയോ സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: cross_reference
lexical_decisions:
- source_word: ὃν τρόπον δὲ
  choice: …എതിർത്തതുപോലെ
  rationale: ὃν τρόπον എന്ന താരതമ്യപ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം. δέ ഇവിടെ മൃദുവായ ആശയപുരോഗതിയാണ്; മലയാളത്തിൽ പ്രത്യേക പദം ചേർക്കാതെ വാക്യബന്ധത്തിലൂടെ അത് പ്രകടമാകുന്നു.
- source_word: Ἰάννης καὶ Ἰαμβρῆς
  choice: യന്നേസും യംബ്രേസും
  rationale: ഗ്രീക്ക് പേരുകളുടെ ശബ്ദരൂപം മലയാളലിപിയിൽ പകർന്നു.
- source_word: ἀντέστησαν / ἀνθίστανται
  choice: എതിർത്തു / എതിർക്കുന്നു
  rationale: മോശെയോടുള്ള കഴിഞ്ഞകാല എതിർപ്പും ഇവരുടെ തുടരുന്ന ഇപ്പോഴത്തെ എതിർപ്പും സമാന്തരമായി നിലനിർത്തുന്നു.
- source_word: τῇ ἀληθείᾳ
  choice: സത്യത്തെ
  rationale: ഗ്രീക്കിലെ വിശാലമായ അർഥം നിലനിർത്തുന്നു; മുഖ്യവാചകത്തിൽ അതിനെ സുവിശേഷസത്യമെന്നു പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: ἄνθρωποι κατεφθαρμένοι τὸν νοῦν
  choice: ഇവർ മനസ്സു ദുഷിച്ചവർ
  rationale: perfect passive participle സൂചിപ്പിക്കുന്ന ദുഷിച്ച നിലയും τὸν νοῦν എന്ന respect accusative-ന്റെ മാനസിക-ബൗദ്ധിക മേഖലയുമാണ് സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നത്.
- source_word: ἀδόκιμοι
  choice: അംഗീകാരമില്ലാത്തവർ
  rationale: പരിശോധനയിൽ യോഗ്യരെന്ന അംഗീകാരം ലഭിക്കാത്തവർ എന്ന evaluative അർഥം നൽകുന്നു; 'അയോഗ്യർ' എന്നതിനെക്കാൾ പരീക്ഷിക്കപ്പെട്ടിട്ടും അംഗീകരിക്കപ്പെടാത്തതിന്റെ ഭാവം നിലനിർത്തുന്നു.
- source_word: περὶ τὴν πίστιν
  choice: വിശ്വാസത്തിന്റെ കാര്യത്തിൽ
  rationale: περί + accusative സൂചിപ്പിക്കുന്ന സംബന്ധമേഖല സ്വാഭാവികമായി നൽകുന്നു; πίστις വ്യക്തിപരമായ വിശ്വാസമോ ക്രൈസ്തവ വിശ്വാസസന്ദേശമോ എന്ന സാധ്യത മുഖ്യവാചകം തീർപ്പാക്കുന്നില്ല.
theological_decisions:
- issue: ‘സത്യം’, ‘വിശ്വാസം’ എന്നിവയുടെ സൂചന
  choice: രണ്ടും വിശാലമായ പൗലോസീയ പ്രയോഗങ്ങളായി നിലനിർത്തി.
  alternative: ‘സത്യം’ എന്നത് സുവിശേഷസത്യം എന്നും ‘വിശ്വാസം’ എന്നത് ക്രൈസ്തവ വിശ്വാസസമുച്ചയം എന്നും മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കുക.
  rationale: സന്ദർഭം അപ്പൊസ്തോലിക സന്ദേശത്തെയും ക്രൈസ്തവ വിശ്വാസത്തെയും സൂചിപ്പിക്കാൻ സാധ്യതയുണ്ടെങ്കിലും ഗ്രീക്ക് പദങ്ങളുടെ യഥാർഥ വിശാലതയും അർഥസമ്മർദവും പരിഭാഷയിൽ സംരക്ഷിക്കുന്നു.
- issue: ἄνθρωποι എന്നതിന്റെ ലിംഗസൂചന
  choice: ആവർത്തിച്ച ‘ഇവർ’ മുഖേന സന്ദർഭത്തിലെ നിർദ്ദിഷ്ട വ്യക്തികളെ സൂചിപ്പിച്ചു.
  alternative: ‘പുരുഷന്മാർ’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തുക.
  rationale: സന്ദർഭത്തിലെ പുരുഷവാചക സൂചന നിഷേധിക്കാതെ, മലയാളത്തിൽ അസ്വാഭാവികമായ ആവർത്തനം ഒഴിവാക്കുന്നു; ഇത് മനുഷ്യരാശിയെ പൊതുവായി സൂചിപ്പിക്കുന്ന പ്രയോഗമല്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. താരതമ്യഘടനയും രണ്ട് ക്രിയകളിലെ കാലവ്യത്യാസവും സംരക്ഷിച്ചു. മുഖ്യവാചകത്തിൽ സാങ്കേതിക പദാവലി കുറച്ചെങ്കിലും ഗ്രീക്കിലെ അർഥസമ്മർദം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
