  language: ml
  text: വിശ്വാസഘാതകർ[a], അവിവേകമായി എടുത്തുചാടുന്നവർ[b], അഹങ്കാരത്താൽ വീർത്തവർ[c], ദൈവത്തെക്കാൾ സുഖഭോഗങ്ങളെ സ്നേഹിക്കുന്നവർ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘ഒറ്റിക്കൊടുക്കുന്നവർ.’
