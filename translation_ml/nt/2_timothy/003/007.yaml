  text: πάντοτε μανθάνοντα καὶ μηδέποτε εἰς ἐπίγνωσιν ἀληθείας ἐλθεῖν δυνάμενα.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/007.yaml
  text: always learning and never able to come to the knowledge of the truth[a].
translation:
  language: ml
  text: എപ്പോഴും പഠിച്ചുകൊണ്ടിരിക്കുന്നവരും സത്യത്തിന്റെ പരിജ്ഞാനത്തിലേക്ക് ഒരിക്കലും എത്തിച്ചേരാൻ കഴിയാത്തവരും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സത്യത്തിന്റെ പൂർണജ്ഞാനത്തിലേക്ക്.” ഗ്രീക്ക് പദത്തിന് കൂടുതൽ സമഗ്രമോ പൂർണമോ ആയ അറിവ് എന്ന അർത്ഥനിറം ഉണ്ടായേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: എപ്പോഴും
  rationale: തുടർച്ചയായും ആവർത്തിച്ചും നടക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; μηδέποτε എന്നതുമായുള്ള ശക്തമായ വൈരുധ്യവും നിലനിർത്തുന്നു.
- source_word: μανθάνοντα
  choice: പഠിച്ചുകൊണ്ടിരിക്കുന്നവർ
  rationale: വർത്തമാനകാല പങ്കാളിക്രിയയുടെ തുടർച്ചാഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ പകർത്തുന്നു; ഔപചാരിക പഠനമോ അനൗപചാരിക പഠനമോ എന്ന് അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: μηδέποτε
  choice: ഒരിക്കലും ... കഴിയാത്തവർ
  rationale: πάντοτε എന്നതിനു വിപരീതമായ ശക്തമായ കാലനിഷേധം മലയാളത്തിലെ സ്വാഭാവിക നിഷേധഘടനയിൽ പ്രകടമാക്കുന്നു.
- source_word: εἰς ἐπίγνωσιν
  choice: പരിജ്ഞാനത്തിലേക്ക്
  rationale: εἰς സൂചിപ്പിക്കുന്ന ലക്ഷ്യത്തിലേക്കുള്ള നീക്കം നിലനിർത്തുകയും ἐπίγνωσις എന്നതിന്റെ അറിവ്/പൂർണമായ അറിവ് എന്ന സാധ്യത മലയാളത്തിലെ ‘പരിജ്ഞാനം’ വഴി സംക്ഷിപ്തമായി സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀληθείας
  choice: സത്യത്തിന്റെ
  rationale: ἐπίγνωσιν-നെ ആശ്രയിക്കുന്ന ജനിറ്റീവ് ബന്ധം നേരിട്ട് പകർത്തുന്നു; പൗലോസിന്റെ പ്രയോഗത്തിൽ ഉദ്ദേശിക്കുന്ന നിർദിഷ്ട സത്യത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἐλθεῖν
  choice: എത്തിച്ചേരാൻ
  rationale: അറിവിലേക്കുള്ള വരവ് അഥവാ പ്രാപ്തി എന്ന രൂപകം വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: δυνάμενα
  choice: കഴിയാത്തവർ
  rationale: കഴിവില്ലായ്മയെ സൂചിപ്പിക്കുന്ന പങ്കാളിക്രിയ മലയാളത്തിലെ സ്വാഭാവിക വിധേയഘടനയിൽ പകർത്തുന്നു; മുൻവാക്യത്തിൽ പരാമർശിച്ച സ്ത്രീകളാണ് വ്യാകരണപരമായ വിഷയം.
theological_decisions:
- issue: പൗലോസിന്റെ പ്രയോഗത്തിലെ ἐπίγνωσις എന്ന പദത്തിന്റെ അർത്ഥനിറം
  choice: പരിജ്ഞാനം
  alternative: സത്യത്തെക്കുറിച്ചുള്ള പൂർണജ്ഞാനം
  rationale: സദാ പഠിച്ചിട്ടും സത്യത്തെ യഥാർഥമായി അറിയുന്നതിലേക്കെത്താത്തതാണു വാക്യത്തിന്റെ മുഖ്യ ഊന്നൽ. ‘പരിജ്ഞാനം’ അറിവിനേക്കാൾ ആഴമുള്ള അറിവിന്റെ സാധ്യത തുറന്നുവെക്കുന്നു; എന്നാൽ പദത്തെ നിർബന്ധമായി ഒരു സാങ്കേതിക ‘പൂർണജ്ഞാനം’ ആയി വ്യാഖ്യാനിക്കുന്നില്ല. ശക്തമായ മറ്റർത്ഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഈ വാക്യം മുൻവാക്യത്തിലെ സ്ത്രീകളെ തുടർന്നാണ് പറയുന്നത്; അതിനാൽ സ്ത്രീലിംഗസൂചന മലയാളത്തിൽ കൃത്രിമമായി ആവർത്തിക്കാതെ ബഹുവചനരൂപം ഉപയോഗിച്ചു. ‘എപ്പോഴും’/‘ഒരിക്കലും’ എന്ന വൈരുധ്യം വ്യക്തമായി നിലനിർത്തി.
