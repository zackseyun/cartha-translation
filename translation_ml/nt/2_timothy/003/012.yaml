id: 2TI.3.12
reference: 2 Timothy 3:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ πάντες δὲ οἱ θέλοντες ⸂ζῆν εὐσεβῶς⸃ ἐν Χριστῷ Ἰησοῦ διωχθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/012.yaml
  text: And indeed[a], all who want to live godly in Messiah Jesus will be persecuted.
translation:
  language: ml
  text: വാസ്തവത്തിൽ, മശീഹയായ യേശുവിൽ ദൈവഭക്തിയോടെ ജീവിക്കാൻ ആഗ്രഹിക്കുന്ന എല്ലാവരും പീഡിപ്പിക്കപ്പെടും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ πάντες δὲ
  choice: വാസ്തവത്തിൽ ... എല്ലാവരും
  rationale: καὶ-δέ സംയോജനം മുൻസന്ദർഭത്തോടുള്ള ബന്ധവും ഉറപ്പിച്ചുപറയുന്ന ഭാവവും നൽകുന്നു. മലയാളത്തിൽ അനാവശ്യമായ ഇരട്ട സംയോജകം ഒഴിവാക്കി ‘വാസ്തവത്തിൽ’ എന്നതിലൂടെ ആ ഭാവം സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
- source_word: οἱ θέλοντες
  choice: ആഗ്രഹിക്കുന്ന
  rationale: θέλωയുടെ ഇച്ഛയെയും മനസ്സോടെയുള്ള അഭിലാഷത്തെയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ζῆν εὐσεβῶς
  choice: ദൈവഭക്തിയോടെ ജീവിക്കാൻ
  rationale: εὐσεβῶς എന്ന ക്രിയാവിശേഷണത്തിന്റെ ദൈവത്തോടുള്ള ഭക്തിയിലും അതിനൊത്ത ജീവിതത്തിലും കേന്ദ്രീകരിക്കുന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: മശീഹയായ യേശുവിൽ
  rationale: ἐν സൂചിപ്പിക്കുന്ന ബന്ധത്തിന്റെയും ജീവിതമണ്ഡലത്തിന്റെയും ഭാവം ‘യിൽ’ നിലനിർത്തുന്നു; Χριστός ഇവിടെ പദവിയായി ഗ്രഹിക്കാവുന്നതിനാൽ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: διωχθήσονται
  choice: പീഡിപ്പിക്കപ്പെടും
  rationale: ഭാവികാല കർമണിപ്രയോഗവും ശത്രുതാപരമായ διώκωയുടെ അർഥവും നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: Χριστῷ എന്നത് പദവിയായോ പേരുപോലുള്ള രൂപമായോ പരിഭാഷപ്പെടുത്തൽ
  choice: മശീഹയായ യേശു
  alternative: ക്രിസ്തുയേശു
  rationale: പൗലോസിന്റെ ഈ പ്രയോഗത്തിൽ അഭിഷിക്തനായവൻ എന്ന പദവിയുടെ അർഥം സജീവമായി നിലനിൽക്കുന്നു; അതിനാൽ പേരുപോലെ ലിപ്യന്തരണം ചെയ്യാതെ പദവിയായി പരിഭാഷപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ ഉറപ്പിച്ചുപറയുന്ന ഭാവം സ്വാഭാവികമായി പകർന്നു; വാക്യത്തിന്റെ സർവവ്യാപക അവകാശവാദവും പീഡനത്തിന്റെ ഉറപ്പും മൃദൂകരിച്ചിട്ടില്ല.
