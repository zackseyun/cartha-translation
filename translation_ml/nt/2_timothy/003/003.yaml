id: 2TI.3.3
reference: 2 Timothy 3:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἄστοργοι, ἄσπονδοι, διάβολοι, ἀκρατεῖς, ἀνήμεροι, ἀφιλάγαθοι,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/003.yaml
  text: without natural affection[a], irreconcilable, slanderous, without self-control, savage, without love for what is good[c][b],
translation:
  language: ml
  text: സ്വാഭാവിക സ്നേഹമില്ലാത്തവരും, അനുരഞ്ജനത്തിന് വഴങ്ങാത്തവരും[a], അപവാദം പറയുന്നവരും[b], ആത്മനിയന്ത്രണമില്ലാത്തവരും, ക്രൂരരും, നന്മയെ സ്നേഹിക്കാത്തവരും[c] ആയിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരിക്കലും അനുനയിക്കാനാവാത്തവർ” അല്ലെങ്കിൽ “സമാധാന ഉടമ്പടി ലംഘിക്കുന്നവർ.”
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെയുള്ള ഗ്രീക്ക് പദമായ διάβολοι എന്നത് “അപവാദം പറയുന്നവർ” എന്നാണർഥം; പിശാചിനെക്കുറിച്ചുള്ള പരാമർശമല്ല.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “നന്മയെ വെറുക്കുന്നവർ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄστοργοι
  choice: സ്വാഭാവിക സ്നേഹമില്ലാത്തവർ
  rationale: στοργή സൂചിപ്പിക്കുന്ന, പ്രത്യേകിച്ച് കുടുംബബന്ധങ്ങളിൽ സ്വാഭാവികമായി പ്രതീക്ഷിക്കപ്പെടുന്ന വാത്സല്യത്തിന്റെ അഭാവം വ്യക്തമാക്കുന്നു; പൊതുവായ ‘സ്നേഹമില്ലാത്തവർ’ എന്നതിനെക്കാൾ മൂലപദത്തിന്റെ പ്രത്യേകത നിലനിർത്തുന്നു.
- source_word: ἄσπονδοι
  choice: അനുരഞ്ജനത്തിന് വഴങ്ങാത്തവർ
  rationale: സമാധാനത്തിനോ ഒത്തുതീർപ്പിനോ തയ്യാറാകാത്ത, വഴങ്ങാത്ത മനോഭാവത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; നിലവിലുള്ള ഉടമ്പടി ലംഘിക്കുന്നു എന്ന അർഥം അനാവശ്യമായി ചുമത്തുന്നില്ല.
- source_word: διάβολοι
  choice: അപവാദം പറയുന്നവർ
  rationale: ഈ ദുർഗുണപ്പട്ടികയിൽ ബഹുവചനമായ പദം പിശാചിനെയല്ല, മറ്റുള്ളവർക്കെതിരെ ദുഷ്ടമായ ആരോപണമോ അപവാദമോ പറയുന്ന മനുഷ്യരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἀκρατεῖς
  choice: ആത്മനിയന്ത്രണമില്ലാത്തവർ
  rationale: ആഗ്രഹങ്ങളെയും പ്രേരണകളെയും നിയന്ത്രിക്കാനുള്ള കഴിവില്ലായ്മ വ്യക്തമാക്കുന്ന, പ്രചാരത്തിലുള്ള കൃത്യമായ പ്രയോഗം.
- source_word: ἀνήμεροι
  choice: ക്രൂരർ
  rationale: മെരുക്കമില്ലാത്തതും നിർദയവും ഉഗ്രവുമായ പെരുമാറ്റത്തെ ‘ക്രൂരർ’ സംക്ഷിപ്തമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: ἀφιλάγαθοι
  choice: നന്മയെ സ്നേഹിക്കാത്തവർ
  rationale: ‘നല്ലതിനെ സ്നേഹിക്കാത്ത’ എന്ന നിഷേധാത്മക ഘടന നിലനിർത്തുന്നു; സജീവമായ വെറുപ്പ് എന്ന ശക്തമായ അർഥം മുഖ്യപാഠത്തിൽ നിർബന്ധിക്കുന്നില്ല.
theological_decisions:
- issue: ദുർഗുണപ്പട്ടികയിലെ διάβολοι എന്ന പദത്തിന്റെ അർഥം
  choice: അപവാദം പറയുന്നവർ എന്ന പൊതുവായ നൈതിക വിശേഷണം
  alternative: പിശാചുക്കൾ; പൈശാചികർ
  rationale: ബഹുവചനരൂപവും ചുറ്റുമുള്ള ദുർഗുണവിശേഷണങ്ങളും മനുഷ്യരുടെ പെരുമാറ്റത്തെ വിവരിക്കുന്നു. ‘പിശാചുക്കൾ’ എന്നു വിവർത്തനം ചെയ്താൽ സ്വഭാവവിവരണത്തെ അസ്തിത്വപരമായ പരാമർശമായി തെറ്റിദ്ധരിപ്പിക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ഗ്രീക്കിലെ തുടർച്ചയായ വിശേഷണപ്പട്ടിക മലയാളത്തിൽ ‘-വരും’ എന്ന സമാന്തരഘടനയിലൂടെ നിലനിർത്തി. എല്ലാ പദങ്ങളെയും ഒരൊറ്റ വാക്യത്തിലെ പ്രവചനഘടനയോട് ബന്ധിപ്പിക്കാൻ അവസാനം ‘ആയിരിക്കും’ ചേർത്തിരിക്കുന്നു.
