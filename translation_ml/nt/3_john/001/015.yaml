  to: നിനക്കു സമാധാനം ഉണ്ടാകട്ടെ.[a] സ്നേഹിതർ നിനക്കു വന്ദനം അറിയിക്കുന്നു. സ്നേഹിതരിൽ ഓരോരുത്തർക്കും പേരുപറഞ്ഞ് വന്ദനം അറിയിക്കുക.[b]
