  text: Εἰρήνη σοι. ἀσπάζονταί σε οἱ φίλοι. ἀσπάζου τοὺς φίλους κατ’ ὄνομα.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/015.yaml
  text: Peace to you[a]. The friends greet you[b]. Greet the friends by name.
translation:
  language: ml
  text: നിനക്കു സമാധാനം ഉണ്ടാകട്ടെ.[a] സ്നേഹിതർ നിനക്കു വന്ദനം അറിയിക്കുന്നു. സ്നേഹിതരിൽ ഓരോരുത്തർക്കും പേരുപറഞ്ഞ് വന്ദനം അറിയിക്കുക.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിനക്കു സമാധാനം.” ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “നിനക്കു സമാധാനം” എന്ന സംക്ഷിപ്തമായ കത്തുരൂപ ആശംസയാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “സ്നേഹിതരെ വ്യക്തിപരമായി” അല്ലെങ്കിൽ “ഓരോരുത്തരെയായി വന്ദനം അറിയിക്കുക.” ഗ്രീക്കിൽ “പേരുപ്രകാരം” എന്നാണ്; ഓരോരുത്തർക്കുമുള്ള വ്യക്തിപരമായ അഭിവാദ്യത്തെ ഇത് ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰρήνη σοι
  choice: നിനക്കു സമാധാനം ഉണ്ടാകട്ടെ
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തമായ കത്തുരൂപ ആശംസയുടെ ആശീർവാദഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘നിനക്കു സമാധാനം’ എന്ന കൂടുതൽ അക്ഷരാർഥ രൂപവും സാധ്യമാണ്.
- source_word: ἀσπάζονταί σε
  choice: നിനക്കു വന്ദനം പറയുന്നു
  rationale: കത്തുകളിലെ പതിവ് അഭിവാദനക്രിയയെ മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: οἱ φίλοι / τοὺς φίλους
  choice: സ്നേഹിതർ / സ്നേഹിതരെ
  rationale: φίλοι എന്ന പദത്തിന്റെ സാധാരണ അർഥം നിലനിർത്തുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘സഹോദരന്മാർ’ എന്ന സഭാപരമായ പദമോ ‘നമ്മുടെ’ എന്ന ഉടമസ്ഥസൂചനയോ ചേർക്കുന്നില്ല.
- source_word: κατ’ ὄνομα
  choice: ഓരോരുത്തരെയും പേരെടുത്തു
  rationale: ‘പേരുപ്രകാരം’ എന്ന അക്ഷരാർഥത്തോടൊപ്പം ഓരോ വ്യക്തിയെയും വ്യക്തിപരമായി അഭിവാദ്യം ചെയ്യണമെന്ന പ്രയോഗാർഥം സ്വാഭാവിക മലയാളത്തിൽ പകർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കത്തുരൂപ ഭാഷ ഉപയോഗിച്ചു. ‘സ്നേഹിതർ’ എന്നത് മൂലപദത്തിന്റെ പ്രത്യേകത നിലനിർത്തുന്നു; വ്യക്തിപരമായ അഭിവാദനത്തിന്റെ ഊന്നൽ പ്രധാനവാചകത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
