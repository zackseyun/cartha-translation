id: 3JN.1.1
reference: 3 John 1:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὁ πρεσβύτερος Γαΐῳ τῷ ἀγαπητῷ, ὃν ἐγὼ ἀγαπῶ ἐν ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/001.yaml
  text: The elder to beloved Gaius[a], whom I love in truth.
translation:
  language: ml
  text: മൂപ്പൻ, ഞാൻ സത്യത്തിൽ സ്നേഹിക്കുന്ന പ്രിയനായ ഗായൊസിന്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ πρεσβύτερος
  choice: മൂപ്പൻ
  rationale: ലേഖകന്റെ സ്വയംപരാമർശമായി വരുന്ന ഈ പദം പ്രായത്തെയോ സഭയിലെ അംഗീകൃത സ്ഥാനത്തെയോ സൂചിപ്പിക്കാം. സന്ദർഭത്തിന് ചേരാത്ത ‘വൃദ്ധൻ’ എന്നതിനെക്കാളും അതിയായി സാങ്കേതികമായ ‘പ്രസ്ബിറ്റർ’ എന്നതിനെക്കാളും ‘മൂപ്പൻ’ സ്വാഭാവികവും അർത്ഥവ്യാപ്തി കാത്തുസൂക്ഷിക്കുന്നതുമാണ്.
- source_word: Γαΐῳ
  choice: ഗായൊസിന്
  rationale: Γάϊος എന്ന പേരിന്റെ ഗ്രീക്ക് ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന, മലയാളത്തിൽ വ്യക്തമായ ലിപ്യന്തരണമാണ് ‘ഗായൊസ്’; ദാതൃവിഭക്തി ‘-ന്’ കൊണ്ട് അടയാളപ്പെടുത്തി.
- source_word: τῷ ἀγαπητῷ
  choice: പ്രിയനായ
  rationale: സ്വീകർത്താവിനോടുള്ള ഊഷ്മളമായ സ്നേഹം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; തുടർന്നുള്ള ἀγαπῶ എന്ന ക്രിയയുമായുള്ള ആശയബന്ധവും നിലനിർത്തുന്നു.
- source_word: ὃν ἐγὼ ἀγαπῶ
  choice: ഞാൻ സ്നേഹിക്കുന്നവന്
  rationale: ആപേക്ഷിക സർവനാമത്തിന്റെ കർമബന്ധം മലയാളത്തിലെ ‘-വൻ’ ഘടനയിൽ സ്വാഭാവികമായി പുനർരൂപപ്പെടുത്തി; ἐγώ എന്ന വ്യക്തമായ സർവനാമത്തിലെ നേരിയ ഊന്നൽ ‘ഞാൻ’ എന്നു നിലനിർത്തി.
- source_word: ἐν ἀληθείᾳ
  choice: സത്യത്തിൽ
  rationale: ഈ പ്രയോഗം ‘യഥാർഥമായി’ എന്ന ആത്മാർഥതയെയോ സത്യത്തിൽ/സുവിശേഷസത്യത്തിൽ അധിഷ്ഠിതമായ സ്നേഹത്തെയോ രണ്ടിനെയും സൂചിപ്പിക്കാം. ‘സത്യത്തിൽ’ ഈ അർത്ഥവ്യാപ്തിയും യോഹന്നാനീയ പ്രതിധ്വനിയും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ἐν ἀληθείᾳ എന്ന യോഹന്നാനീയ പ്രയോഗത്തിന്റെ അർത്ഥനിറം
  choice: സത്യത്തിൽ
  alternative: യഥാർഥമായി; സത്യത്തിനുള്ളിൽ
  rationale: വാക്യം വെറും ആത്മാർഥതയാണോ സുവിശേഷസത്യത്തിൽ അധിഷ്ഠിതമായ സ്നേഹമാണോ രണ്ടുമാണോ എന്ന് നിർബന്ധമായി തീർപ്പാക്കുന്നില്ല. അതിനാൽ പ്രധാന പാഠം ആ ദൈവശാസ്ത്രപരമായ അർത്ഥവ്യാപ്തി തുറന്നുവെക്കുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ലേഖനശൈലി. മൂലത്തിലെ ചുരുക്കവും അഭിസംബോധനയുടെ ഊഷ്മളതയും സംരക്ഷിക്കാൻ ഡാഷ് ഉപയോഗിച്ചു; സഭാപദവിയെ അനാവശ്യമായി സാങ്കേതികമാക്കാതിരിക്കാൻ ‘മൂപ്പൻ’ തെരഞ്ഞെടുത്തു.
