id: 3JN.1.8
reference: 3 John 1:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἡμεῖς οὖν ὀφείλομεν ⸀ὑπολαμβάνειν τοὺς τοιούτους, ἵνα συνεργοὶ γινώμεθα τῇ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/008.yaml
  text: Therefore[a], we ought to receive such people[b], so that we may become fellow workers for the truth.
translation:
  language: ml
  text: അതുകൊണ്ട്, അങ്ങനെയുള്ളവരെ നാം സ്വീകരിക്കേണ്ടതാണ്[a]; അങ്ങനെ നാം സത്യത്തിനുവേണ്ടി സഹപ്രവർത്തകരായിത്തീരും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് ക്രിയയ്ക്ക് അങ്ങനെയുള്ള യാത്രാശുശ്രൂഷകരെ സ്വാഗതം ചെയ്യുക, ആതിഥ്യമരുളുക, അവരുടെ ആവശ്യങ്ങൾക്ക് സഹായം നൽകുക എന്നീ അർഥങ്ങളും ഉൾക്കൊള്ളാം.
    reason: lexical_alternative
  - marker: b
    text: ‘സത്യത്തോടൊപ്പം സഹപ്രവർത്തകർ’ എന്നോ ‘സത്യത്തിൽ സഹപ്രവർത്തകർ’ എന്നോ പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ ദത്തിവിഭക്തി ഒന്നിലധികം വിധത്തിൽ മനസ്സിലാക്കാം; മുഖ്യവാചകം സത്യത്തിന്റെ കാര്യത്തെ പിന്തുണയ്ക്കുക എന്ന അർഥം സ്വീകരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ἡμεῖς
  choice: നാം
  rationale: ഗ്രീക്കിലെ വ്യക്തമായ സർവനാമം ഊന്നൽ നിലനിർത്തുന്നതിനായി പരിഭാഷയിൽ ചേർത്തു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യത്തിൽനിന്നുള്ള നിഗമനബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὀφείλομεν
  choice: സ്വീകരിച്ചു പിന്തുണയ്ക്കേണ്ടതാണ്
  rationale: ധാർമ്മിക ബാധ്യതയെ വ്യക്തമാക്കുന്ന ‘വേണ്ടതാണ്’ ഉപയോഗിച്ചു; ക്രിയയുടെ ആതിഥ്യവും സഹായവും ഉൾക്കൊള്ളുന്ന സന്ദർഭാർഥം കൂട്ടുപ്രയോഗത്തിലൂടെ അറിയിച്ചു.
- source_word: ὑπολαμβάνειν
  choice: സ്വീകരിച്ചു പിന്തുണയ്ക്കുക
  rationale: യാത്രചെയ്യുന്ന ശുശ്രൂഷകരെ വരവേൽക്കുന്നതും അവരുടെ ആവശ്യങ്ങൾ നിറവേറ്റുന്നതും ഉൾപ്പെടുന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ‘സ്വീകരിക്കുക’ മാത്രം മലയാളത്തിൽ സമ്മതമെന്ന അർഥത്തിലേക്ക് തെറ്റിപ്പോകാം.
- source_word: τοὺς τοιούτους
  choice: അങ്ങനെയുള്ളവരെ
  rationale: മുൻവാക്യത്തിൽ വിവരിച്ച തരത്തിലുള്ള ആളുകളിലേക്കുള്ള സൂചന ലിംഗനിരപേക്ഷമായും സംക്ഷിപ്തമായും നിലനിർത്തുന്നു.
- source_word: ἵνα
  choice: അങ്ങനെ
  rationale: പിന്തുണയ്ക്കുന്നതിന്റെ ഉദ്ദേശവും ഫലവും മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: συνεργοὶ
  choice: സഹപ്രവർത്തകർ
  rationale: ഒരേ പ്രവർത്തനത്തിൽ പങ്കുചേരുന്നവരെന്ന സഹകരണാർഥം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: γινώμεθα
  choice: ആയിത്തീരും
  rationale: γίνομαι സൂചിപ്പിക്കുന്ന ‘ആയിത്തീരുക’ എന്ന ചലനാത്മക ഭാവം നിലനിർത്തുന്നു; ഗ്രീക്കിലെ ഉദ്ദേശസൂചക ഘടന മലയാളത്തിൽ സ്വാഭാവികമായ ഭാവികാലരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: τῇ ἀληθείᾳ
  choice: സത്യത്തിനുവേണ്ടി
  rationale: സത്യത്തിന്റെ കാര്യത്തിനായി പ്രവർത്തിക്കുന്ന സഹപ്രവർത്തകർ എന്ന സന്ദർഭാർഥം മുഖ്യവാചകത്തിൽ നൽകുന്നു; ദത്തിവിന്റെ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: συνεργοὶ എന്നതോടുള്ള τῇ ἀληθείᾳ എന്ന ദത്തിവിന്റെ ബന്ധം
  choice: ‘സത്യത്തിനുവേണ്ടി’—സത്യത്തിന്റെ ദൗത്യത്തിൽ പങ്കാളികളാകുക
  alternative: ‘സത്യത്തോടൊപ്പം’ അല്ലെങ്കിൽ ‘സത്യത്തിൽ’
  rationale: മുൻസന്ദർഭം നാമത്തിനുവേണ്ടി പുറപ്പെട്ട യാത്രാശുശ്രൂഷകരെ സഹായിക്കുന്നതിനെക്കുറിച്ചാണ്. അതിനാൽ മുഖ്യവാചകം സത്യത്തിന്റെ കാര്യത്തിനുള്ള സഹകരണം പ്രകടിപ്പിക്കുന്നു; എന്നാൽ ഗ്രീക്ക് ദത്തിവിന്റെ യഥാർഥ വ്യാകരണപരമായ ബഹുവ്യാഖ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘സ്വീകരിച്ചു പിന്തുണയ്ക്കുക’ എന്ന കൂട്ടുപ്രയോഗം ആതിഥ്യവും പ്രായോഗിക സഹായവും വ്യക്തമാക്കുന്നു. വാക്യാവസാനത്തിലെ ദത്തിവിന്റെ ബഹുവ്യാഖ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചിരിക്കുന്നു.
