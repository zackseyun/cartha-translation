id: 3JN.1.7
reference: 3 John 1:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὑπὲρ γὰρ τοῦ ὀνόματος ἐξῆλθον μηδὲν λαμβάνοντες ἀπὸ τῶν ⸀ἐθνικῶν.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/007.yaml
  text: For they went out for the sake of the Name[a], taking nothing from the Gentiles.
translation:
  language: ml
  text: കാരണം, അവർ ആ നാമത്തിനുവേണ്ടി വിജാതീയരിൽനിന്ന്[a] ഒന്നും സ്വീകരിക്കാതെ പുറപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘വിഗ്രഹാരാധകരിൽനിന്ന്’ അല്ലെങ്കിൽ ‘അവിശ്വാസികളിൽനിന്ന്’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ
  choice: വേണ്ടി
  rationale: ഷഷ്ഠീവിവക്തിയിലുള്ള ‘നാമം’ എന്ന പദത്തോടൊപ്പം ഇവിടെ ὑπέρ പകരംനിൽക്കലിനേക്കാൾ ലക്ഷ്യമോ കാരണമോ സൂചിപ്പിക്കുന്നു. ‘വേണ്ടി’ ഈ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: τοῦ ὀνόματος
  choice: ആ നാമം
  rationale: ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘നാമം’ എന്ന ആദരസൂചകമായ പരാമർശമാണുള്ളത്. അത് യേശുവിനെയോ കർത്താവിനെയോ സൂചിപ്പിക്കുന്നുവെങ്കിലും, മൂലപാഠത്തിൽ ഇല്ലാത്ത പേര് ചേർക്കാതെ ‘ആ നാമം’ എന്നു നിലനിർത്തുന്നു.
- source_word: ἐξῆλθον
  choice: പുറപ്പെട്ടു
  rationale: മിഷൻയാത്രയ്ക്കായി പുറപ്പെട്ടതിനെ സൂചിപ്പിക്കുന്ന ലളിതവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗം.
- source_word: μηδὲν λαμβάνοντες
  choice: ഒന്നും സ്വീകരിച്ചില്ല
  rationale: പ്രധാനക്രിയയോടൊപ്പമുള്ള ഈ വർത്തമാനകൃദന്തം അവർ പുറപ്പെട്ടപ്പോൾ പാലിച്ച രീതി വ്യക്തമാക്കുന്നു. പണമോ ഭൗതികസഹായമോ കൈപ്പറ്റാതിരുന്നതിനെ ‘സ്വീകരിച്ചില്ല’ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: ἀπὸ τῶν ἐθνικῶν
  choice: ജാതികളിൽനിന്ന്
  rationale: ἐθνικός ഇവിടെ ക്രിസ്തീയസമൂഹത്തിനു പുറത്തുള്ള ജാതികളെ സൂചിപ്പിക്കുന്നു. ‘ജാതികൾ’ എന്നത് പദത്തിന്റെ ചരിത്രപരവും യഹൂദ-ക്രിസ്തീയവുമായ പശ്ചാത്തലം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ‘വിഗ്രഹാരാധകർ’ അല്ലെങ്കിൽ ‘അവിശ്വാസികൾ’ എന്ന അർഥവും സാധ്യമാണ്.
theological_decisions:
- issue: ‘നാമം’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: യേശുവിനെയോ കർത്താവിനെയോ ആദരപൂർവം സൂചിപ്പിക്കുന്ന ‘ആ നാമം’ എന്ന പരോക്ഷപ്രയോഗം നിലനിർത്തി.
  alternative: ‘ക്രിസ്തുവിന്റെ നാമം’ അല്ലെങ്കിൽ ‘അവന്റെ നാമം’ എന്ന് വ്യക്തമാക്കുക.
  rationale: മൂലപാഠം വ്യക്തിയുടെ പേര് പറയാതെ ആദരസൂചകമായ പരോക്ഷപ്രയോഗം ഉപയോഗിക്കുന്നു. അതിനാൽ സന്ദർഭം നൽകുന്ന സൂചന നിലനിർത്തിക്കൊണ്ട് മൂലത്തിൽ ഇല്ലാത്ത വ്യക്തീകരണം ചേർത്തിട്ടില്ല.
- issue: ἐθνικῶν എന്നതിന്റെ അർഥം
  choice: പ്രധാനപാഠത്തിൽ ‘ജാതികൾ’.
  alternative: ‘വിഗ്രഹാരാധകർ’ അല്ലെങ്കിൽ ‘അവിശ്വാസികൾ’.
  rationale: ‘ജാതികൾ’ എന്ന പരിഭാഷ ഗ്രീക്ക് പദത്തിന്റെ ചരിത്രപരമായ ജാതി-മത നിറം സംരക്ഷിക്കുന്നു. എന്നാൽ ഈ സന്ദർഭത്തിൽ ക്രിസ്തീയവിശ്വാസത്തിനു പുറത്തുള്ളവരെന്ന മതപരമായ അർഥം പ്രധാനമായിരിക്കാമെന്നതിനാൽ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ആ നാമം’ എന്ന പ്രയോഗം മൂലത്തിലെ ആദരസൂചകമായ പരോക്ഷത നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് സൂചിപ്പിക്കുന്ന പദത്തോടുതന്നെ [a] ചേർത്തിരിക്കുന്നു.
