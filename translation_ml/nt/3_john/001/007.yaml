revisions:
- from: കാരണം, അവർ ആ നാമത്തിനുവേണ്ടിയാണ് പുറപ്പെട്ടത്; ജാതികളിൽനിന്ന്[a] ഒന്നും സ്വീകരിച്ചില്ല.
  to: കാരണം, അവർ ആ നാമത്തിനുവേണ്ടി വിജാതീയരിൽനിന്ന്[a] ഒന്നും സ്വീകരിക്കാതെ പുറപ്പെട്ടു.
  rationale: The revision clarifies the referent class denoted by ἐθνικῶν without importing a doctrinal interpretation, and it represents the participial construction more closely. The reverential ambiguity of ‘the Name’ remains intact.
