  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ കത്തുശൈലി. ഗ്രീക്കിലെ മൃദുവായ ആശയമാറ്റവും നേരിട്ടുള്ള സംഭാഷണത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗവും സംരക്ഷിച്ചിരിക്കുന്നു.
