base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/014.yaml
  text: But I hope to see you soon[a], and we will speak face to face.
translation:
  language: ml
  text: എന്നാൽ നിന്നെ വേഗം കാണുമെന്ന് ഞാൻ പ്രത്യാശിക്കുന്നു; നാം മുഖാമുഖം സംസാരിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥം, ‘വായോടു വായ്.’ നേരിട്ടുള്ള വ്യക്തിപരമായ സംഭാഷണം എന്ന അർഥത്തിലാണ് ഇവിടെ ‘മുഖാമുഖം’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίζω
  choice: ഞാൻ പ്രത്യാശിക്കുന്നു
  rationale: വർത്തമാനകാല ക്രിയ എഴുത്തുകാരന്റെ വ്യക്തിപരമായ പ്രത്യാശയെയും പ്രതീക്ഷയെയും പ്രകടിപ്പിക്കുന്നു; മാന്യവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗമാണിത്.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുമ്പത്തെ വാക്യത്തിലെ എഴുത്തിനെക്കുറിച്ചുള്ള പരാമർശത്തിൽനിന്നുള്ള മൃദുവായ വൈരുധ്യവും ആശയമാറ്റവും നിലനിർത്തുന്നു.
- source_word: εὐθέως
  choice: ഉടൻ
  rationale: ഈ സന്ദർശനസന്ദർഭത്തിൽ അടുത്ത കാലത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം; ക്ഷണനേരത്തിനുള്ളിലെ നടപടി എന്ന അർഥം നിർബന്ധമാക്കുന്നില്ല.
- source_word: σε ἰδεῖν
  choice: നിന്നെ ... കാണാൻ
  rationale: ഗ്രീക്കിലെ ലളിതമായ ‘നിന്നെ കാണുക’ എന്ന ആശയം നിലനിർത്തുന്നു; ‘സന്ദർശിക്കുക’ എന്ന വ്യാഖ്യാനം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: στόμα πρὸς στόμα
  choice: മുഖാമുഖം
  rationale: അക്ഷരാർഥം ‘വായോടുവായ്’ എന്നാണെങ്കിലും നേരിട്ടുള്ള വ്യക്തിപരമായ സംഭാഷണമാണ് സന്ദർഭാർഥം; ‘മുഖാമുഖം’ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: λαλήσομεν
  choice: നാം ... സംസാരിക്കും
  rationale: ഭാവികാലത്തിലുള്ള പ്രതീക്ഷിത സംഭാഷണത്തെ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മാന്യവുമായി അവതരിപ്പിക്കുന്നു.
