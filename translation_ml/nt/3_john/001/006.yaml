id: 3JN.1.6
reference: 3 John 1:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἳ ἐμαρτύρησάν σου τῇ ἀγάπῃ ἐνώπιον ἐκκλησίας, οὓς καλῶς ποιήσεις προπέμψας ἀξίως τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/006.yaml
  text: They testified before the church about your love[a], and you will do well to send them on their way in a manner worthy of God.
translation:
  language: ml
  text: അവർ സഭയുടെ സാന്നിധ്യത്തിൽ നിന്റെ സ്നേഹത്തെക്കുറിച്ച് സാക്ഷ്യം പറഞ്ഞു; അവരെ ദൈവത്തിന് യോഗ്യമായ വിധത്തിൽ യാത്രയയച്ചാൽ നീ നന്നായി ചെയ്യും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμαρτύρησάν
  choice: സാക്ഷ്യം പറഞ്ഞു
  rationale: ഏറിസ്റ്റ് സൂചിപ്പിക്കുന്ന പൂർത്തിയായ സംഭവത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ നേരിട്ടു പറയുന്നു; μαρτυρέωയുടെ സാക്ഷ്യപ്പെടുത്തൽ/റിപ്പോർട്ട് ചെയ്യൽ ഭാവവും നിലനിർത്തുന്നു.
- source_word: σου τῇ ἀγάπῃ
  choice: നിന്റെ സ്നേഹത്തെക്കുറിച്ചു
  rationale: ഡേറ്റീവ് ഇവിടെ സാക്ഷ്യത്തിന്റെ വിഷയമോ പരാമർശമോ സൂചിപ്പിക്കുന്നു; ഗായൊസിന്റെ സ്നേഹത്തെക്കുറിച്ചാണ് അവർ സഭയോട് പറഞ്ഞതെന്ന അർഥം വ്യക്തമാണ്.
- source_word: ἐνώπιον ἐκκλησίας
  choice: സഭയുടെ മുമ്പാകെ
  rationale: കൂടിവന്ന ക്രൈസ്തവസമൂഹത്തിന്റെ സാന്നിധ്യത്തിൽ എന്ന അർഥം ചുരുക്കമായും ഗൗരവത്തോടെയും നൽകുന്നു.
- source_word: καλῶς ποιήσεις
  choice: നീ നന്നായി ചെയ്യും
  rationale: ഭാവികാലരൂപത്തോടൊപ്പം ഇതിലുള്ള വിനീതമായ പ്രബോധനവും പ്രശംസാത്മക ഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: προπέμψας
  choice: അവരെ യാത്രയയച്ചാൽ
  rationale: യാത്രക്കാരെ തുടർയാത്രയ്ക്കായി അയയ്ക്കുക എന്ന അടിസ്ഥാനാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ആവശ്യമായ പ്രായോഗിക സഹായം നൽകുക എന്ന ഉൾസൂചന അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: ἀξίως τοῦ θεοῦ
  choice: ദൈവത്തിന് യോഗ്യമായ വിധത്തിൽ
  rationale: അവരെ അയയ്ക്കേണ്ട രീതിയുടെ മാനദണ്ഡം ദൈവത്തിന്റെ മഹത്വത്തിന് യോജിച്ചതായിരിക്കണം എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ദൈവശാസ്ത്രഭാരം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ക്രൈസ്തവാതിഥ്യത്തിൽ προπέμπω എന്നതിന്റെ വ്യാപ്തി
  choice: പ്രധാനപാഠത്തിൽ ‘യാത്രയയച്ചാൽ’ എന്നും, തുടർയാത്രയ്ക്കുള്ള പ്രായോഗിക സഹായത്തിന്റെ ഉൾസൂചന അടിക്കുറിപ്പിലും നൽകി.
  alternative: ‘അവരുടെ യാത്രയ്ക്കു വേണ്ട സഹായം നൽകി അയച്ചാൽ’
  rationale: പദം വെറും വിടപറഞ്ഞയയ്ക്കലിനേക്കാൾ കൂടുതലായി യാത്രയ്ക്കാവശ്യമായ സഹായം നൽകുന്നതും സൂചിപ്പിക്കാം. എന്നാൽ സഹായത്തിന്റെ കൃത്യരൂപം മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ പ്രധാനപാഠത്തിൽ അതിനെ അതിയായി നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘സഭ’, ‘സാക്ഷ്യം’, ‘ദൈവത്തിന് യോഗ്യമായ വിധത്തിൽ’ എന്നീ പരിചിത പദപ്രയോഗങ്ങൾ ഉപയോഗിച്ചു; ഗ്രീക്ക് വാക്യഘടന യാന്ത്രികമായി പകർത്താതെ അർഥബന്ധം വ്യക്തമായി നിലനിർത്തി.
