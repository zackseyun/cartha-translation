revisions:
- from: അവർ സഭയുടെ മുമ്പാകെ നിന്റെ സ്നേഹത്തെക്കുറിച്ചു സാക്ഷ്യം പറഞ്ഞു. ദൈവത്തിന് യോഗ്യമായ വിധത്തിൽ അവരെ യാത്രയയച്ചാൽ[a] നീ നന്നായി ചെയ്യും.
  to: അവർ സഭയുടെ സാന്നിധ്യത്തിൽ നിന്റെ സ്നേഹത്തെക്കുറിച്ച് സാക്ഷ്യം പറഞ്ഞു; അവരെ ദൈവത്തിന് യോഗ്യമായ വിധത്തിൽ യാത്രയയച്ചാൽ നീ നന്നായി ചെയ്യും.
