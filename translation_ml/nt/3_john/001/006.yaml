  - severity: low
    issue: Sentence division and spelling form
    rationale: The Greek joins the testimony and the ensuing exhortation in one construction; a semicolon preserves this relation smoothly. ‘സ്നേഹത്തെക്കുറിച്ച്’ is the more standard contemporary orthography.
  revised_text: അവർ സഭയുടെ സാന്നിധ്യത്തിൽ നിന്റെ സ്നേഹത്തെക്കുറിച്ച് സാക്ഷ്യം പറഞ്ഞു; അവരെ ദൈവത്തിന് യോഗ്യമായ വിധത്തിൽ യാത്രയയച്ചാൽ നീ നന്നായി ചെയ്യും.
