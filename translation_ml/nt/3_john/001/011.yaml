id: 3JN.1.11
reference: 3 John 1:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀγαπητέ, μὴ μιμοῦ τὸ κακὸν ἀλλὰ τὸ ἀγαθόν. ὁ ἀγαθοποιῶν ἐκ τοῦ θεοῦ ἐστιν· ὁ κακοποιῶν οὐχ ἑώρακεν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/011.yaml
  text: Beloved[a], do not imitate what is evil, but what is good. The one who does good is from God; the one who does evil has not seen God.
translation:
  language: ml
  text: പ്രിയനേ, തിന്മയെ അനുകരിക്കാതെ നന്മയെ അനുകരിക്കുക. നന്മ ചെയ്യുന്നവൻ ദൈവത്തിൽനിന്നുള്ളവനാണ്; തിന്മ ചെയ്യുന്നവൻ ദൈവത്തെ കണ്ടിട്ടില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നന്മ ചെയ്തുകൊണ്ടിരിക്കുന്നവൻ ... തിന്മ ചെയ്തുകൊണ്ടിരിക്കുന്നവൻ’ എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്കിലെ വർത്തമാനകാല കൃദന്തരൂപങ്ങൾ തുടരുന്ന പ്രവൃത്തിയെയോ സ്വഭാവസവിശേഷമായ പെരുമാറ്റത്തെയോ ഊന്നിക്കാട്ടാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητέ
  choice: പ്രിയനേ
  rationale: ἀγαπητός എന്ന പദത്തിന്റെ ഏകവചന സംബോധനരൂപം സ്നേഹപൂർവമായ അഭിസംബോധനയാണ്. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികതയും യോഹന്നാനീയമായ ഊഷ്മളതയും ‘പ്രിയനേ’ നിലനിർത്തുന്നു.
- source_word: μὴ μιμοῦ
  choice: അനുകരിക്കാതെ ... അനുകരിക്കുക
  rationale: μιμέομαι എന്ന ക്രിയയുടെ മാതൃക പിന്തുടരുക/അനുകരിക്കുക എന്ന നേരിട്ടുള്ള ആശയം നിലനിർത്തുന്നു. ഗ്രീക്കിലെ നിരോധനവും ἀλλά മുഖേനയുള്ള അനുകൂല വിപരീതനിർദേശവും മലയാളത്തിൽ സ്വാഭാവികമായി ഒരൊറ്റ ഘടനയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: τὸ κακὸν / τὸ ἀγαθόν
  choice: തിന്മ / നന്മ
  rationale: നാമവൽക്കരിക്കപ്പെട്ട നപുംസകലിംഗ വിശേഷണങ്ങൾ പൊതുവായ ധാർമിക വിഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘തിന്മ’, ‘നന്മ’ എന്നിവ ഈ സാമാന്യമായ വൈരുധ്യം ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: ὁ ἀγαθοποιῶν
  choice: നന്മ ചെയ്യുന്നവൻ
  rationale: നാമവൽക്കരിക്കപ്പെട്ട വർത്തമാനകാല കർത്തൃവാചക കൃദന്തരൂപത്തിന്റെ വ്യക്തിനിർദേശകവും പ്രവൃത്തികേന്ദ്രിതവുമായ അർഥം നിലനിർത്തുന്നു; തുടർച്ചയായതോ സ്വഭാവസവിശേഷമായതോ ആയ പെരുമാറ്റത്തിന്റെ സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἐκ τοῦ θεοῦ ἐστιν
  choice: ദൈവത്തിൽനിന്നുള്ളവനാണ്
  rationale: ἐκ എന്നതിന്റെ ഉറവിടം/ബന്ധം സൂചിപ്പിക്കുന്ന യോഹന്നാനീയ പ്രയോഗം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ὁ κακοποιῶν
  choice: തിന്മ ചെയ്യുന്നവൻ
  rationale: ὁ ἀγαθοποιῶν എന്നതിന് സമാന്തരമായ നാമവൽക്കരിക്കപ്പെട്ട വർത്തമാനകാല കൃദന്തരൂപം; ദുഷ്പ്രവൃത്തിയിലുള്ള തുടരുന്ന അല്ലെങ്കിൽ സ്വഭാവസവിശേഷമായ നടത്തത്തെ സൂചിപ്പിക്കാം.
- source_word: οὐχ ἑώρακεν τὸν θεόν
  choice: ദൈവത്തെ കണ്ടിട്ടില്ല
  rationale: ὁράω എന്ന ക്രിയയുടെ പൂർണകാല രൂപത്തിലെ അനുഭവപരവും നിലനിൽക്കുന്ന ഫലമുള്ളതുമായ അർഥം സംരക്ഷിക്കുന്നു. ‘ദൈവത്തെ അറിയുന്നില്ല’ എന്നു മാറ്റുന്നത് മൂലപാഠത്തേക്കാൾ വ്യാഖ്യാനപരമായിരിക്കും.
theological_decisions:
- issue: ധാർമിക നടത്തവും ദൈവവുമായുള്ള ബന്ധവും സംബന്ധിച്ച യോഹന്നാനീയ പ്രസ്താവന
  choice: നന്മ ചെയ്യുന്നവൻ ‘ദൈവത്തിൽനിന്നുള്ളവൻ’ എന്നും തിന്മ ചെയ്യുന്നവൻ ‘ദൈവത്തെ കണ്ടിട്ടില്ല’ എന്നും പാഠത്തിന്റെ സ്വന്തം വിഭാഗങ്ങളാൽ പ്രസ്താവിക്കുന്നു.
  alternative: ഇവയെ പുനർജനനം, പാപരഹിത പൂർണത, അല്ലെങ്കിൽ ഒരിക്കലും ദൈവവുമായി യാതൊരു ബന്ധവും ഉണ്ടായിട്ടില്ലെന്ന വ്യവസ്ഥിത ദൈവശാസ്ത്രനിഗമനം എന്നിങ്ങനെ വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്ക് പാഠം ധാർമിക-ആത്മീയ തിരിച്ചറിയൽ യോഹന്നാനീയ ഭാഷയിൽ നൽകുന്നു. പിന്നീടുള്ള സിദ്ധാന്തപരമായ നിർവചനങ്ങൾ ചേർക്കാതെയും മുന്നറിയിപ്പിന്റെ ശക്തി മയപ്പെടുത്താതെയും അതിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘പ്രിയനേ’ വ്യക്തിപരമായ സ്നേഹസംബോധന നിലനിർത്തുന്നു; സമാന്തര വാക്യഘടന മൂലപാഠത്തിലെ ധാർമിക വൈരുധ്യം തെളിച്ചത്തോടെ അവതരിപ്പിക്കുന്നു.
