id: 3JN.1.2
reference: 3 John 1:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀγαπητέ, περὶ πάντων εὔχομαί σε εὐοδοῦσθαι καὶ ὑγιαίνειν, καθὼς εὐοδοῦταί σου ἡ ψυχή.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/002.yaml
  text: Beloved[a], I pray that in all respects you may prosper and be healthy[d][c][b], just as your soul prospers.
translation:
  language: ml
  text: പ്രിയനേ, നിന്റെ ആത്മാവ്[b] അഭിവൃദ്ധിപ്പെടുന്നതുപോലെ, നീ എല്ലാ വിധത്തിലും[a] അഭിവൃദ്ധിപ്പെടുകയും ആരോഗ്യത്തോടെ ഇരിക്കുകയും ചെയ്യട്ടെയെന്ന് ഞാൻ പ്രാർഥിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എല്ലാ കാര്യങ്ങളിലും.’ ‘എല്ലാറ്റിനുമുപരി’ എന്ന പരമ്പരാഗത വിവർത്തനത്തേക്കാൾ, ഗ്രീക്ക് ഇവിടെ മുൻഗണനയല്ല, വ്യാപ്തിയാണ് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്. ‘സകല കാര്യങ്ങളെയുംകുറിച്ച്, നീ അഭിവൃദ്ധിപ്പെടുകയും … ചെയ്യട്ടെയെന്ന് ഞാൻ പ്രാർഥിക്കുന്നു’ എന്നും വാക്യബന്ധം ഗ്രഹിക്കാം.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, ‘നിന്റെ ഉള്ളിലെ സ്വത്വം’; ‘നിന്റെ ആത്മാവിനു നന്നായി വരുന്നതുപോലെ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητέ
  choice: പ്രിയനേ
  rationale: ἀγαπητός എന്ന പദത്തിന്റെ ഏകവചന സംബോധനരൂപം സ്നേഹപൂർവമായ അഭിസംബോധനയാണ്. സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ ‘പ്രിയനേ’ ആ സ്നേഹഭാവം നിലനിർത്തുന്നു.
- source_word: περὶ πάντων
  choice: എല്ലാ കാര്യങ്ങളിലും
  rationale: ഈ പ്രയോഗം മുൻഗണനയേക്കാൾ വ്യാപ്തിയാണ് സൂചിപ്പിക്കുന്നത്. അതിനാൽ പരമ്പരാഗതമായ ‘എല്ലാറ്റിനുമുപരി’ എന്നതിനു പകരം ‘എല്ലാ കാര്യങ്ങളിലും’ എന്നു നൽകി.
- source_word: εὔχομαί
  choice: ഞാൻ പ്രാർഥിക്കുന്നു
  rationale: ലേഖനസന്ദർഭത്തിൽ εὔχομαι പ്രാർഥനയോടുകൂടിയ ആശംസയെ സൂചിപ്പിക്കുന്നു. ‘പ്രാർഥിക്കുന്നു’ അതിന്റെ മതപരമായ ഭാവം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: σε εὐοδοῦσθαι
  choice: നീ ... അഭിവൃദ്ധിപ്പെടുക
  rationale: εὐοδόομαι എന്നത് കാര്യങ്ങൾ നന്നായി നടക്കുക, ക്ഷേമം പ്രാപിക്കുക, അഭിവൃദ്ധിപ്പെടുക എന്നീ അർഥങ്ങൾ നൽകുന്നു. ‘അഭിവൃദ്ധിപ്പെടുക’ സംക്ഷിപ്തവും രണ്ടാമത്തെ പ്രയോഗത്തിലും ആവർത്തിക്കാവുന്നതുമാണ്.
- source_word: ὑγιαίνειν
  choice: ആരോഗ്യവാനായിരിക്കുക
  rationale: ഇവിടെ ഈ ക്രിയ ശാരീരിക ആരോഗ്യം സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ പ്രയോഗമാണിത്.
- source_word: καθὼς
  choice: പോലെതന്നെ
  rationale: καθώς രണ്ട് നിലകളെ താരതമ്യം ചെയ്യുന്നു. ‘പോലെതന്നെ’ ആ താരതമ്യബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: εὐοδοῦταί σου ἡ ψυχή
  choice: നിന്റെ ആത്മാവ് അഭിവൃദ്ധിപ്പെടുന്നു
  rationale: മൂലത്തിലെ εὐοδόομαι എന്ന ക്രിയയുടെ ആവർത്തനം നിലനിർത്താൻ മുൻപ്രയോഗത്തിലേതുപോലെ ‘അഭിവൃദ്ധിപ്പെടുന്നു’ ഉപയോഗിച്ചു. വർത്തമാനകാലം തുടരുന്ന ക്ഷേമാവസ്ഥയെ സൂചിപ്പിക്കുന്നു.
- source_word: ψυχή
  choice: ആത്മാവ്
  rationale: ψυχήയ്ക്ക് ജീവൻ, വ്യക്തിത്വം, ഉള്ളിലെ സ്വത്വം, ആത്മാവ് എന്നീ അർഥസാധ്യതകളുണ്ട്. ഇവിടെ ശാരീരിക ആരോഗ്യത്തോടും ബാഹ്യ ക്ഷേമത്തോടും താരതമ്യപ്പെടുന്ന ആന്തരിക ജീവിതത്തെ ‘ആത്മാവ്’ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; അതേസമയം വിശദമായ മനുഷ്യഘടനാസിദ്ധാന്തം പാഠത്തിൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ആരംഭത്തിലെ περὶ πάντων എന്നതിന്റെ അർഥം
  choice: ‘എല്ലാ കാര്യങ്ങളിലും’—വ്യാപ്തി സൂചിപ്പിക്കുന്നതായി
  alternative: ‘എല്ലാറ്റിനുമുപരി’—മുൻഗണന സൂചിപ്പിക്കുന്നതായി; അല്ലെങ്കിൽ ‘സകല കാര്യങ്ങളെയുംകുറിച്ച് ഞാൻ പ്രാർഥിക്കുന്നു’
  rationale: ഗ്രീക്ക് പ്രയോഗം ഏറ്റവും സ്വാഭാവികമായി പ്രാർഥനയുടെ വിഷയങ്ങൾക്ക് മുൻഗണന നിശ്ചയിക്കുന്നതല്ല, ഗായൊസിന്റെ ക്ഷേമം ഏതു വ്യാപ്തിയിൽ ആശംസിക്കുന്നു എന്നതാണ് സൂചിപ്പിക്കുന്നത്.
- issue: ψυχή എന്നതിന്റെ ആശയം
  choice: ആത്മാവ്
  alternative: ജീവൻ; ഉള്ളിലെ സ്വത്വം
  rationale: ശാരീരിക ആരോഗ്യവും പൊതുവായ ക്ഷേമവും ആന്തരിക നിലയും തമ്മിലുള്ള താരതമ്യം ‘ആത്മാവ്’ നിലനിർത്തുന്നു. എന്നാൽ മനുഷ്യന്റെ ഘടനയെക്കുറിച്ചുള്ള പ്രത്യേക സിദ്ധാന്തം ഇതിലൂടെ നിർബന്ധിക്കുന്നില്ല.
- issue: εὐοδοῦσθαι, εὐοδοῦται എന്നീ രൂപങ്ങളിലെ പദാവർത്തനം
  choice: രണ്ടിടത്തും ‘അഭിവൃദ്ധിപ്പെടുക’
  alternative: ആദ്യത്തേത് ‘അഭിവൃദ്ധിപ്പെടുക,’ രണ്ടാമത്തേത് ‘നന്നായിരിക്കുക’
  rationale: ഒരേ ഗ്രീക്ക് ക്രിയയുടെ ആവർത്തനം ബാഹ്യ ക്ഷേമവും ആത്മാവിന്റെ ക്ഷേമവും തമ്മിലുള്ള താരതമ്യത്തെ ശക്തമാക്കുന്നു. അല്പം അസാധാരണമായ രൂപകഭാവം ഉണ്ടായാലും അത് മായ്ച്ചുകളയാതെ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. ‘പ്രിയനേ’ ലേഖനത്തിലെ സ്നേഹപൂർവമായ ഏകവചന അഭിസംബോധന നിലനിർത്തുന്നു. ‘അഭിവൃദ്ധിപ്പെടുക’ എന്ന ആവർത്തനം മലയാളത്തിൽ അല്പം ഔപചാരികമാണെങ്കിലും മൂലത്തിലെ നിർണായകമായ പദപ്രതിധ്വനി സംരക്ഷിക്കുന്നു.
