- from: സഹോദരന്മാർ വന്ന്, നീ സത്യത്തോടു വിശ്വസ്തനാണെന്ന്—അതായത്, നീ സത്യത്തിൽ നടക്കുന്നു എന്ന്—സാക്ഷ്യം പറഞ്ഞപ്പോൾ ഞാൻ അത്യന്തം സന്തോഷിച്ചു.[a]
