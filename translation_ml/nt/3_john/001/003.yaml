source:
  edition: SBLGNT
  text: ἐχάρην γὰρ λίαν ἐρχομένων ἀδελφῶν καὶ μαρτυρούντων σου τῇ ἀληθείᾳ, καθὼς σὺ ἐν ἀληθείᾳ περιπατεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/003.yaml
  text: For I rejoiced greatly when brothers came and testified to your truth[c][b][a], just as you are walking in truth.
translation:
  language: ml
  text: എന്തെന്നാൽ, സഹോദരന്മാർ വന്ന്, നീ സത്യത്തിൽ നടക്കുന്നതുപോലെ, നിന്റെ സത്യത്തെക്കുറിച്ച് സാക്ഷ്യം പറഞ്ഞപ്പോൾ ഞാൻ അത്യന്തം സന്തോഷിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “നീ സത്യത്തോടു കാണിക്കുന്ന വിശ്വസ്തതയെക്കുറിച്ച് സാക്ഷ്യം പറഞ്ഞപ്പോൾ.” പദശഃ, “നിന്റെ സത്യത്തെക്കുറിച്ച്.” ‘സഹോദരന്മാർ’ എന്നത് സഹവിശ്വാസികളെ സൂചിപ്പിക്കാം; ഗ്രീക്കിൽ പുല്ലിംഗ ബഹുവചനമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐχάρην γὰρ λίαν
  choice: ഞാൻ അത്യന്തം സന്തോഷിച്ചു
  rationale: ἐχάρην സജീവാർഥത്തിൽ ‘സന്തോഷിച്ചു’ എന്നും λίαν ശക്തമായ അളവ് സൂചിപ്പിക്കുന്നതിനാൽ ‘അത്യന്തം’ എന്നും പരിഭാഷപ്പെടുത്തി. γάρ മുൻവാക്യത്തോടുള്ള വിശദീകരണബന്ധം ഇവിടെ മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിൽ പ്രത്യേകം പദമില്ലാതെ പ്രകടമാകുന്നു.
- source_word: ἐρχομένων ἀδελφῶν
  choice: സഹോദരന്മാർ വന്ന് ... പറഞ്ഞപ്പോൾ
  rationale: ജനിറ്റീവ് പാർട്ടിസിപ്പിൾ ഘടനയുടെ കാലസാഹചര്യാർഥം സ്വാഭാവിക മലയാളത്തിൽ ‘വന്ന് ... പറഞ്ഞപ്പോൾ’ എന്നു നൽകി. ἀδελφῶν എന്ന പുല്ലിംഗ ബഹുവചനം മുഖ്യപാഠത്തിൽ കൃത്യമായി നിലനിർത്തി.
- source_word: μαρτυρούντων
  choice: സാക്ഷ്യം പറഞ്ഞപ്പോൾ
  rationale: μαρτυρέω എന്നതിലെ സാക്ഷ്യഭാഷ നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: σου τῇ ἀληθείᾳ
  choice: നീ സത്യത്തോടു വിശ്വസ്തനാണെന്ന്
  rationale: ദത്തിവ് ഘടന ഗായൊസിന്റെ സത്യത്തോടുള്ള ബന്ധത്തെയോ വിശ്വസ്തതയെയോ സൂചിപ്പിക്കുന്നതായി സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ‘നിന്റെ സത്യം’ എന്നത് മലയാളത്തിൽ സ്വകാര്യസത്യം എന്ന തെറ്റായ ധാരണ നൽകാം. കൂടുതൽ പദശഃ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: καθὼς σὺ ἐν ἀληθείᾳ περιπατεῖς
  choice: അതായത്, നീ സത്യത്തിൽ നടക്കുന്നു എന്ന്
  rationale: καθώς ഇവിടെ മുൻസാക്ഷ്യത്തിന്റെ ഉള്ളടക്കത്തെ സ്ഥിരീകരിക്കുന്ന വിധത്തിൽ വായിക്കാം. περιπατεῖς എന്ന നൈതിക രൂപകം ‘നടക്കുന്നു’ എന്നു നിലനിർത്തി.
theological_decisions:
- issue: യോഹന്നാനീയ പ്രയോഗത്തിൽ ‘സത്യം’ എന്നതിന്റെ അർഥവ്യാപ്തി
  choice: രണ്ടാം പ്രയോഗത്തിൽ ‘സത്യം’ നിലനിർത്തി; ആദ്യ പ്രയോഗം ‘സത്യത്തോടു വിശ്വസ്തൻ’ എന്നു സ്വാഭാവികമാക്കി.
  alternative: രണ്ടിടത്തും പദശഃ ‘സത്യം’; അല്ലെങ്കിൽ ആദ്യത്തേത് ‘നിന്റെ സത്യം’.
  rationale: ഇത് ഉപദേശസത്യത്തെയും ജീവിതവിശ്വസ്തതയെയും ബന്ധിപ്പിക്കുന്നു. മുഖ്യപാഠം സ്വകാര്യമായ ‘നിന്റെ സത്യം’ എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുമ്പോഴും, സത്യത്തിന്റെ ഉപദേശപരവും നൈതികവുമായ പിരിമുറുക്കം പരിഹരിച്ചുകളയുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘സത്യത്തിൽ നടക്കുന്നു’ എന്ന യോഹന്നാനീയ നൈതിക രൂപകം സംരക്ഷിച്ചു; അസ്വാഭാവികമായ ‘നിന്റെ സത്യം’ മുഖ്യപാഠത്തിൽ ഒഴിവാക്കി, അടിക്കുറിപ്പിൽ പദശഃ സാധ്യത നൽകി.
