  to: നിനക്കെഴുതാൻ എനിക്ക് പല കാര്യങ്ങളുമുണ്ടായിരുന്നു; എന്നാൽ മഷിയും പേനയും ഉപയോഗിച്ച് നിനക്കെഴുതാൻ ഞാൻ ആഗ്രഹിക്കുന്നില്ല.
