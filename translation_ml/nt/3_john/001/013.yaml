id: 3JN.1.13
reference: 3 John 1:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Πολλὰ εἶχον ⸂γράψαι σοι⸃, ἀλλ’ οὐ θέλω διὰ μέλανος καὶ καλάμου σοι ⸀γράφειν·
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/013.yaml
  text: I had many things to write to you[a], but I do not want to write to you with ink and pen;
translation:
  language: ml
  text: നിനക്കെഴുതാൻ എനിക്ക് പല കാര്യങ്ങളുമുണ്ടായിരുന്നു; എന്നാൽ മഷിയും പേനയും ഉപയോഗിച്ച് നിനക്കെഴുതാൻ ഞാൻ ആഗ്രഹിക്കുന്നില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πολλὰ
  choice: പല കാര്യങ്ങളും
  rationale: നപുംസകലിംഗ ബഹുവചന വിശേഷണം നാമമായി ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ, ബഹുവചനാർത്ഥം വ്യക്തമായി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: εἶχον
  choice: എനിക്കുണ്ടായിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപത്തിന്റെ കാലചട്ടക്കൂട് നിലനിർത്തിക്കൊണ്ട്, എഴുതാൻ ഉദ്ദേശിച്ചിരുന്നെങ്കിലും എഴുതാതിരുന്ന കാര്യങ്ങളെ സൂചിപ്പിക്കുന്നു.
- source_word: γράψαι σοι
  choice: നിനക്ക് എഴുതാൻ
  rationale: ചിന്തിക്കപ്പെട്ട എഴുത്തുപ്രവൃത്തിയെ ലളിതമായ ക്രിയാരൂപത്തിൽ അവതരിപ്പിക്കുകയും σοι എന്ന പരോക്ഷ കർമത്തെ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ἀλλ’ οὐ θέλω
  choice: എന്നാൽ … ഞാൻ ആഗ്രഹിക്കുന്നില്ല
  rationale: θέλω സൂചിപ്പിക്കുന്ന ആഗ്രഹമോ മനസ്സോ ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: διὰ μέλανος καὶ καλάμου
  choice: മഷിയും പേനയുംകൊണ്ട്
  rationale: διάയുടെ ഉപകരണാർത്ഥം ‘കൊണ്ട്’ എന്നതിലൂടെ നൽകുന്നു. κάλαμος അക്ഷരാർഥത്തിൽ ഞാങ്ങണകൊണ്ടുള്ള എഴുത്താണിയാണെങ്കിലും, മുഖ്യവാചകത്തിൽ അതിന്റെ പ്രവർത്തനം വ്യക്തമാക്കുന്ന ‘പേന’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: γράφειν
  choice: എഴുതാൻ
  rationale: വർത്തമാനകാല അനന്തക്രിയയുടെ പ്രവർത്തനസ്വഭാവം അമിതമായി വിശദീകരിക്കാതെ സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കത്തുശൈലി. ഗ്രീക്കിലെ ഭൂതകാലചട്ടക്കൂടും ‘പല കാര്യങ്ങൾ’ എന്ന ബഹുവചനവും നിലനിർത്തിയിരിക്കുന്നു; κάλαμος എന്ന ഉപകരണത്തിന്റെ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
