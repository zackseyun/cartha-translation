source:
  edition: SBLGNT
  text: Ἀγαπητέ, πιστὸν ποιεῖς ὃ ἐὰν ἐργάσῃ εἰς τοὺς ἀδελφοὺς καὶ ⸀τοῦτο ξένους,
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/005.yaml
  text: Beloved[a], you are acting faithfully in whatever you do for the brothers[b], and especially when they are strangers.
translation:
  language: ml
  text: പ്രിയനേ, സഹോദരന്മാർക്കുവേണ്ടി നീ എന്തു ചെയ്താലും വിശ്വസ്തതയോടെയാണ് ചെയ്യുന്നത്—പ്രത്യേകിച്ച് അപരിചിതരായവർക്കുവേണ്ടി.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “പ്രിയനേ, സഹോദരന്മാർക്കുവേണ്ടി നീ ചെയ്യുന്ന ഏതൊരു കാര്യവും വിശ്വസ്തമായ കാര്യമാണ്—അതും അപരിചിതരായവർക്കുവേണ്ടി.”'
    reason: lexical_alternative
  - marker: b
    text: “സഹോദരന്മാർ” എന്നത് പുല്ലിംഗ ബഹുവചനമായ ἀδελφούς എന്ന പദത്തിന്റെ പരിഭാഷയാണ്. സന്ദർഭത്തിൽ ഇത് സഹവിശ്വാസികളെ സൂചിപ്പിക്കുന്നു; ആ കൂട്ടത്തിൽ സ്ത്രീകളും ഉണ്ടായിരുന്നിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητέ
  choice: പ്രിയനേ
  rationale: ἀγαπητός എന്ന ഏകവചന സംബോധനയുടെ സ്നേഹവും ലേഖനശൈലിയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: πιστὸν ποιεῖς
  choice: വിശ്വസ്തതയോടെ പ്രവർത്തിക്കുന്നു
  rationale: അക്ഷരാർഥത്തിലെ ‘വിശ്വസ്തമായൊരു കാര്യം ചെയ്യുന്നു’ എന്ന പ്രയോഗത്തെ സ്വാഭാവികമാക്കി, ഗായൊസിന്റെ വിശ്വസ്തമായ പെരുമാറ്റത്തെക്കുറിച്ചുള്ള പ്രശംസ സംരക്ഷിക്കുന്നു.
- source_word: ὃ ἐὰν ἐργάσῃ
  choice: നീ ചെയ്യുന്നതെന്തിലും
  rationale: ἐάν-ഉം സാധ്യതാസൂചക ക്രിയാരൂപവും ചേർന്ന അനിശ്ചിത ആപേക്ഷിക പ്രയോഗത്തിന്റെ ‘എന്തു ചെയ്താലും/ചെയ്യുന്നതെന്തിലും’ എന്ന വ്യാപ്തി നൽകുന്നു.
- source_word: εἰς τοὺς ἀδελφοὺς
  choice: സഹോദരന്മാർക്കുവേണ്ടി
  rationale: വ്യാകരണപരമായി പുല്ലിംഗ ബഹുവചനമായ ἀδελφούς നെ കൃത്യമായി പ്രതിഫലിപ്പിക്കുകയും εἰς എന്നതിന്റെ ഗുണഭോക്തൃസൂചന സ്വാഭാവികമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: καὶ τοῦτο ξένους
  choice: അവർ അപരിചിതരായിരിക്കുമ്പോൾ വിശേഷിച്ചും
  rationale: τοῦτο-യുടെ ഊന്നലിനെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; ഇവിടെ ξένοι ആതിഥേയന് പരിചയമില്ലാത്ത സഹവിശ്വാസികളെയാണ് സൂചിപ്പിക്കുന്നത്, വിദേശികളെന്നല്ല.
- source_word: ξένους
  choice: അപരിചിതർ
  rationale: ആതിഥ്യമരുളുന്ന വ്യക്തിക്ക് മുമ്പ് പരിചയമില്ലാത്തവരെ സൂചിപ്പിക്കുന്നതിനാൽ ‘വിദേശികൾ’ എന്നതിനെക്കാൾ ‘അപരിചിതർ’ സന്ദർഭോചിതമാണ്.
