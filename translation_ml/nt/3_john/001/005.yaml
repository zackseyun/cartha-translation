  naturalness: The current wording is understandable, but “അവർ അപരിചിതരായിരിക്കുമ്പോൾ വിശേഷിച്ചും” is somewhat awkward and leaves “വിശേഷിച്ചും” loosely attached. A direct benefactive phrase is clearer in modern standard Malayalam.
  terminology: “പ്രിയനേ,” “സഹോദരന്മാർ,” “വിശ്വസ്തതയോടെ,” and “അപരിചിതർ” are appropriate. The revised wording keeps the grammatically masculine “സഹോദരന്മാർ” while the footnote responsibly explains its contextual reference.
