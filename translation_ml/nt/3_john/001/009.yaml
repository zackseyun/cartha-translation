id: 3JN.1.9
reference: 3 John 1:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἔγραψά ⸀τι τῇ ἐκκλησίᾳ· ἀλλ’ ὁ φιλοπρωτεύων αὐτῶν Διοτρέφης οὐκ ἐπιδέχεται ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/009.yaml
  text: I wrote something to the church[a], but Diotrephes, who loves to be first among them[b], does not receive us.
translation:
  language: ml
  text: ഞാൻ സഭയ്ക്ക് എന്തോ എഴുതി[a]. എന്നാൽ അവരുടെ ഇടയിൽ ഒന്നാമനായിരിക്കാൻ ഇഷ്ടപ്പെടുന്ന ദിയൊത്രെഫേസ് ഞങ്ങളെ സ്വീകരിക്കുന്നില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ സഭയ്ക്ക് ഒരു ചെറിയ കുറിപ്പ് എഴുതി.” ഗ്രീക്കിൽ അനിശ്ചിതമായ പ്രയോഗമാണ് (“എന്തോ എഴുതി”); ചില കൈയെഴുത്തുപ്രതികൾ വാചകം വികസിപ്പിച്ചിരിക്കുന്നു.
    reason: textual_variant
  - marker: b
    text: അഥവാ, “ഞങ്ങളെ സ്വാഗതം ചെയ്യുന്നില്ല” അല്ലെങ്കിൽ “ഞങ്ങളെ അംഗീകരിക്കുന്നില്ല.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔγραψά
  choice: എഴുതി
  rationale: ഗ്രീക്ക് എയോറിസ്റ്റ് സൂചകരൂപത്തിന്റെ നേരായ ഭൂതകാല അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: τι
  choice: എന്തോ
  rationale: നപുംസകലിംഗ അനിശ്ചിത സർവനാമത്തിന്റെ അനിശ്ചിതത്വം നിലനിർത്തുന്നു; മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്ത ‘കുറിപ്പ്’ എന്ന ആശയം മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: τῇ ἐκκλησίᾳ
  choice: സഭയ്ക്ക്
  rationale: ഇവിടെ പ്രാദേശിക ക്രൈസ്തവസമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘സഭ’ ആധുനിക മലയാളത്തിൽ പരിചിതവും സ്വാഭാവികവുമായ പദമാണ്.
- source_word: ἀλλ’
  choice: എന്നാൽ
  rationale: ലേഖകന്റെ പ്രവൃത്തിയും ദിയൊത്രെഫേസിന്റെ പ്രതികരണവും തമ്മിലുള്ള ശക്തമായ വൈരുധ്യം വ്യക്തമാക്കുന്നു.
- source_word: ὁ φιλοπρωτεύων
  choice: ഒന്നാമനായിരിക്കാൻ ഇഷ്ടപ്പെടുന്ന
  rationale: മുൻസ്ഥാനം ആഗ്രഹിക്കുന്ന മനോഭാവം വ്യക്തമായി അറിയിക്കുന്നു; ഔദ്യോഗിക പദവിയെയോ പ്രത്യേക സഭാഭരണരീതിയെയോ അനാവശ്യമായി സൂചിപ്പിക്കുന്നില്ല.
- source_word: αὐτῶν
  choice: അവരുടെ ഇടയിൽ
  rationale: ദിയൊത്രെഫേസ് ഒന്നാം സ്ഥാനം തേടുന്ന സമൂഹപരമായ പരിധി വ്യക്തമാക്കുന്നു; ‘അവരുടെമേൽ’ എന്ന് പരിഭാഷപ്പെടുത്തി ഔദ്യോഗിക അധികാരം മുൻകൂട്ടി നിശ്ചയിക്കുന്നില്ല.
- source_word: Διοτρέφης
  choice: ദിയൊത്രെഫേസ്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമം മലയാളലിപിയിൽ ഉച്ചാരണസമീപമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: οὐκ ἐπιδέχεται ἡμᾶς
  choice: ഞങ്ങളെ സ്വീകരിക്കുന്നില്ല
  rationale: ἐπιδέχομαι എന്ന ക്രിയയിൽ അതിഥിയായി സ്വാഗതം ചെയ്യുക, അംഗീകരിക്കുക, സ്വീകരിക്കുക എന്നീ സാധ്യതകൾ ഉൾപ്പെടാം; ‘സ്വീകരിക്കുന്നില്ല’ ഈ അർഥവ്യാപ്തി പരമാവധി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദിയൊത്രെഫേസിന്റെ എതിർപ്പിന്റെ സ്വഭാവം
  choice: ‘ഞങ്ങളെ സ്വീകരിക്കുന്നില്ല’ എന്ന വിശാലമായ പ്രയോഗം
  alternative: ‘ഞങ്ങളെ സ്വാഗതം ചെയ്യുന്നില്ല’ അല്ലെങ്കിൽ ‘ഞങ്ങളെ അംഗീകരിക്കുന്നില്ല’
  rationale: പ്രശ്നം വ്യക്തിപരമായ ആതിഥ്യമാണോ, പ്രതിനിധികളെ സ്വീകരിക്കാത്തതാണോ, ലേഖകന്റെ അധികാരം അംഗീകരിക്കാത്തതാണോ എന്ന് വാക്യം ഒറ്റയ്ക്ക് തീർച്ചപ്പെടുത്തുന്നില്ല. അതിനാൽ ഈ ദൈവശാസ്ത്രപരവും സഭാശാസ്ത്രപരവുമായ സംഘർഷം പരിഭാഷയിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘എന്തോ’ എന്നത് മൂലത്തിലെ അനിശ്ചിതത്വവും ‘സ്വീകരിക്കുന്നില്ല’ എന്നത് ക്രിയയുടെ വിശാലമായ അർഥസാധ്യതയും നിലനിർത്തുന്നു. വാക്യവിഭജനം മലയാളത്തിലെ വായനാസൗകര്യത്തിനായി ഉപയോഗിച്ചു.
