id: 3JN.1.12
reference: 3 John 1:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Δημητρίῳ μεμαρτύρηται ὑπὸ πάντων καὶ ὑπὸ αὐτῆς τῆς ἀληθείας· καὶ ἡμεῖς δὲ μαρτυροῦμεν, καὶ ⸀οἶδας ὅτι ἡ μαρτυρία ἡμῶν ἀληθής ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/012.yaml
  text: Demetrius has received testimony from everyone[a], and from the truth itself. We also testify[b], and you know that our testimony is true.
translation:
  language: ml
  text: ദെമേത്രിയോസിനെക്കുറിച്ച് എല്ലാവരും[a] സാക്ഷ്യം നൽകിയിട്ടുണ്ട്; സത്യംതന്നെയും[b] അദ്ദേഹത്തെക്കുറിച്ച് സാക്ഷ്യം നൽകിയിട്ടുണ്ട്. ഞങ്ങളും സാക്ഷ്യം പറയുന്നു; ഞങ്ങളുടെ സാക്ഷ്യം സത്യമാണെന്ന് നിനക്കറിയാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എല്ലാവരാലും സാക്ഷ്യപ്പെടുത്തപ്പെട്ടിരിക്കുന്നു.’ ഗ്രീക്കിലെ സമ്പൂർണ നിഷ്ക്രിയക്രിയ, ഇതിനകം ഉറപ്പിക്കപ്പെട്ടതും ഇപ്പോഴും നിലനിൽക്കുന്നതുമായ സാക്ഷ്യത്തെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ അത് ദെമേത്രിയോസിന് അനുകൂലമായ സാക്ഷ്യമാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘സത്യംതന്നെ’ എന്നത് ദെമേത്രിയോസിന്റെ ജീവിതം സത്യത്തോട് ഒത്തുപോകുന്നു എന്നോ, കൂടുതൽ വിശാലമായി സുവിശേഷം അഥവാ സത്യം അദ്ദേഹത്തിന് അനുകൂലമായി സാക്ഷ്യം വഹിക്കുന്നു എന്നോ അർഥമാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: Δημητρίῳ
  choice: ദെമേത്രിയോസിനെക്കുറിച്ച്
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ സ്വാഭാവിക രൂപത്തിൽ ലിപ്യന്തരിച്ചു. ഗ്രീക്കിലെ ദത്തിവിഭക്തി സാക്ഷ്യത്തിന്റെ വിഷയത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘-നെക്കുറിച്ച്’ എന്നു വ്യക്തമാക്കി.
- source_word: μεμαρτύρηται
  choice: സാക്ഷ്യം പറഞ്ഞിട്ടുണ്ട്
  rationale: സമ്പൂർണ നിഷ്ക്രിയരൂപം മുമ്പേ നൽകപ്പെട്ടതും ഇപ്പോഴും നിലനിൽക്കുന്നതുമായ സാക്ഷ്യത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി കർത്തൃപ്രയോഗമായി മാറ്റിയെങ്കിലും ഫലാവസ്ഥ ‘പറഞ്ഞിട്ടുണ്ട്’ എന്നതിലൂടെ നിലനിർത്തി; മൂലത്തിൽ ഇല്ലാത്ത ‘നല്ല’ എന്ന വിശേഷണം ചേർത്തില്ല.
- source_word: ὑπὸ πάντων
  choice: എല്ലാവരും
  rationale: ὑπό സഹിതമുള്ള ഷഷ്ഠി നിഷ്ക്രിയവാക്യത്തിലെ കർത്താക്കളെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ കർത്തൃപ്രയോഗത്തിൽ ‘എല്ലാവരും’ എന്നു സ്വാഭാവികമായി നൽകി.
- source_word: ὑπὸ αὐτῆς τῆς ἀληθείας
  choice: സത്യംതന്നെയും
  rationale: αὐτῆς എന്ന ഊന്നൽ ‘തന്നെയും’ എന്നതിലൂടെ സംരക്ഷിച്ചു. ‘സുവിശേഷം’ എന്നോ ‘അദ്ദേഹത്തിന്റെ ജീവിതം’ എന്നോ വ്യാഖ്യാനിച്ച് അർഥം ചുരുക്കിയില്ല.
- source_word: καὶ ἡμεῖς δὲ μαρτυροῦμεν
  choice: ഞങ്ങളും സാക്ഷ്യം പറയുന്നു
  rationale: δέ ഇവിടെ ശക്തമായ വിരോധത്തേക്കാൾ കൂട്ടിച്ചേർക്കൽ സൂചിപ്പിക്കുന്നു; ‘ഞങ്ങളും’ അതു സ്വാഭാവികമായി നൽകുന്നു. μαρτυρέω-യുടെ ആശയം തുടർച്ചയായി ‘സാക്ഷ്യം പറയുന്നു’ എന്നു നിലനിർത്തി.
- source_word: οἶδας
  choice: നിനക്കറിയാം
  rationale: രൂപത്തിൽ സമ്പൂർണമാണെങ്കിലും കൊയ്നേ ഗ്രീക്കിൽ വർത്തമാന അറിവിന്റെ അവസ്ഥയാണ്; ഏകവചന അഭിസംബോധനയും സംരക്ഷിച്ചു.
- source_word: ἡ μαρτυρία ἡμῶν
  choice: ഞങ്ങളുടെ സാക്ഷ്യം
  rationale: μαρτυρέω എന്ന ക്രിയയുമായുള്ള പദബന്ധം നിലനിർത്തുന്ന നേരിട്ടുള്ള മലയാളരൂപം.
- source_word: ἀληθής ἐστιν
  choice: സത്യമാണ്
  rationale: ἀλήθεια എന്ന മുൻപത്തെ പദവുമായുള്ള ശബ്ദാർഥബന്ധം സംരക്ഷിക്കുന്ന ലളിതവും നേരിട്ടുമുള്ള പരിഭാഷ.
theological_decisions:
- issue: ‘സത്യംതന്നെ’ എന്ന യോഹന്നാനീയ പ്രയോഗത്തിന്റെ അർഥം
  choice: ‘സത്യംതന്നെയും അദ്ദേഹത്തെക്കുറിച്ച് സാക്ഷ്യം പറയുന്നു’ എന്ന വിശാലവും വ്യക്തിവൽക്കൃതവുമായ പ്രയോഗം നിലനിർത്തി.
  alternative: ‘സുവിശേഷം അദ്ദേഹത്തിന് അനുകൂലമായി സാക്ഷ്യം പറയുന്നു’ അല്ലെങ്കിൽ ‘അദ്ദേഹത്തിന്റെ സത്യാനുസൃതമായ ജീവിതം സാക്ഷ്യം പറയുന്നു.’
  rationale: ഈ വാക്കുകൾ സുവിശേഷത്തെയോ ദെമേത്രിയോസിന്റെ സത്യാനുസൃത ജീവിതത്തെയോ സൂചിപ്പിക്കാം. ഗ്രീക്ക് അതിനെ വ്യക്തമായി ചുരുക്കാത്തതിനാൽ ദൈവശാസ്ത്രപരവും സാഹിത്യപരവുമായ അർഥസാന്ദ്രത സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ഗ്രീക്കിലെ നിഷ്ക്രിയവാക്യം മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികമായ കർത്തൃപ്രയോഗമാക്കി; എന്നാൽ സ്ഥാപിതമായ സാക്ഷ്യത്തിന്റെ ഫലാവസ്ഥയും ‘സത്യംതന്നെ’ എന്ന ഉദ്ദേശ്യപൂർവമായ അർഥവ്യാപ്തിയും സംരക്ഷിച്ചു.
