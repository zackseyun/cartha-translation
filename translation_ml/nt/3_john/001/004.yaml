id: 3JN.1.4
reference: 3 John 1:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μειζοτέραν τούτων οὐκ ἔχω ⸀χαράν, ἵνα ἀκούω τὰ ἐμὰ τέκνα ἐν ⸀τῇ ἀληθείᾳ περιπατοῦντα.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/004.yaml
  text: 'I have no greater joy than this: to hear that my children are walking in the truth[a][b].'
translation:
  language: ml
  text: എന്റെ മക്കൾ[b] സത്യത്തിൽ നടക്കുന്നു എന്നു കേൾക്കുന്നതിനെക്കാൾ വലിയ സന്തോഷം എനിക്കില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘ഇവയെക്കാൾ വലിയ സന്തോഷം എനിക്കില്ല.’'
    reason: lexical_alternative
  - marker: b
    text: ‘എന്റെ മക്കൾ’ എന്നത് യോഹന്നാന്റെ ആത്മീയമക്കളെ—അദ്ദേഹത്തിന്റെ ഇടയപരിപാലനത്തിലുള്ള വിശ്വാസികളെ—സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: μειζοτέραν
  choice: വലിയ
  rationale: χαράν എന്ന നാമത്തെ വിശേഷിപ്പിക്കുന്ന താരതമ്യരൂപമാണ്; ‘...ക്കാൾ വലിയ സന്തോഷം’ എന്നത് മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗമാണ്.
- source_word: τούτων
  choice: '...കേൾക്കുന്നതിനെക്കാൾ'
  rationale: താരതമ്യത്തെ സൂചിപ്പിക്കുന്ന ബഹുവചന ജനിറ്റീവ് രൂപത്തിന്റെ ആശയം മലയാളത്തിൽ തുടർന്നുവരുന്ന ഉള്ളടക്കവാക്യത്തോടു ചേർത്ത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; മൂലത്തിലെ ബഹുവചനരൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: χαράν
  choice: സന്തോഷം
  rationale: വികാരത്തിന്റെ ശക്തി നിലനിർത്തുന്നതും സാധാരണ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവുമായ പദം.
- source_word: ἵνα ἀκούω
  choice: എന്നു കേൾക്കുന്നത്
  rationale: ഇവിടെ ἵνα കർശനമായ ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നതിനെക്കാൾ സന്തോഷത്തിന്റെ ഉള്ളടക്കം വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ ‘എന്നു കേൾക്കുന്നത്’ അത് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὰ ἐμὰ τέκνα
  choice: എന്റെ മക്കൾ
  rationale: കുടുംബബന്ധത്തിന്റെ രൂപകം അതേപടി നിലനിർത്തുന്നു; ജൈവമക്കളോ ആത്മീയമക്കളോ എന്ന് മുഖ്യവാചകത്തിൽ നിർണയിക്കുന്നില്ല.
- source_word: ἐν τῇ ἀληθείᾳ
  choice: സത്യത്തിൽ
  rationale: യോഹന്നാന്റെ രചനകളിൽ സത്യവിശ്വാസവും സത്യാനുസൃതമായ ജീവിതവും ഉൾക്കൊള്ളാവുന്ന വിശാലമായ അർഥം നിലനിർത്തുന്നു.
- source_word: περιπατοῦντα
  choice: നടക്കുന്നു
  rationale: ജീവിതരീതിയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് രൂപകം സംരക്ഷിക്കുകയും പരിചിതമായ ബൈബിൾ പ്രയോഗം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: τέκνα എന്നത് ജൈവമക്കളെയോ ആത്മീയമക്കളെയോ സൂചിപ്പിക്കുന്നുവോ
  choice: മുഖ്യവാചകത്തിൽ ‘എന്റെ മക്കൾ’ എന്നു തന്നെയാക്കി.
  alternative: ‘എന്റെ ആത്മീയമക്കൾ’ അല്ലെങ്കിൽ ‘ഞാൻ വിശ്വാസത്തിലേക്കു നയിച്ചവർ’.
  rationale: സന്ദർഭം ആത്മീയപരിപാലനത്തിലുള്ള വിശ്വാസികളെയാണ് ശക്തമായി സൂചിപ്പിക്കുന്നതെങ്കിലും ഗ്രീക്ക് പാഠം കുടുംബബന്ധത്തിന്റെ രൂപകം ഉപയോഗിക്കുന്നു. അതിനാൽ മുഖ്യവാചകം അതിനെ ചുരുക്കി വ്യാഖ്യാനിക്കുന്നില്ല.
- issue: ἐν τῇ ἀληθείᾳ എന്നതിന്റെ വ്യാപ്തി
  choice: ‘സത്യത്തിൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘സത്യസന്ധമായി’ അല്ലെങ്കിൽ ‘സത്യോപദേശമനുസരിച്ച്’.
  rationale: ഈ പ്രയോഗത്തിൽ ഉപദേശപരവും ജീവിതാചാരപരവുമായ അർഥങ്ങൾ ഒരുമിച്ചു നിലനിൽക്കാം; ഏതെങ്കിലും ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കാതെ ആ ദൈവശാസ്ത്രപരമായ വ്യാപ്തി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ പദക്രമം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ സന്തോഷത്തിന്റെ ഉള്ളടക്കവാക്യം ആദ്യം നൽകിയിരിക്കുന്നു; ‘നടക്കുന്നു’ എന്ന നൈതിക-ജീവിതരൂപകം നിലനിർത്തിയിരിക്കുന്നു.
