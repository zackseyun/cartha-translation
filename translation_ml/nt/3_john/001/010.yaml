id: 3JN.1.10
reference: 3 John 1:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διὰ τοῦτο, ἐὰν ἔλθω, ὑπομνήσω αὐτοῦ τὰ ἔργα ἃ ποιεῖ, λόγοις πονηροῖς φλυαρῶν ἡμᾶς, καὶ μὴ ἀρκούμενος ἐπὶ τούτοις οὔτε αὐτὸς ἐπιδέχεται τοὺς ἀδελφοὺς καὶ τοὺς βουλομένους κωλύει καὶ ἐκ τῆς ἐκκλησίας ἐκβάλλει.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/010.yaml
  text: For this reason[a], if I come, I will call attention to the works he is doing, maliciously babbling against us with evil words; and not content with these things, he himself does not receive the brothers[c][b], and he hinders those who want to do so and throws them out of the church.
translation:
  language: ml
  text: അതുകൊണ്ട്, ഞാൻ വന്നാൽ, അവൻ ചെയ്തുകൊണ്ടിരിക്കുന്ന പ്രവൃത്തികൾ ഞാൻ ശ്രദ്ധയിൽപ്പെടുത്തും—അവൻ ദുഷ്ടവാക്കുകളാൽ ഞങ്ങൾക്കെതിരെ അസംബന്ധം പറഞ്ഞുനടക്കുന്നു. ഇതിൽ തൃപ്തിപ്പെടാതെ, അവൻ തന്നെ സഹോദരന്മാരെ[a] സ്വീകരിക്കുന്നില്ല[b]; അവരെ സ്വീകരിക്കാൻ ആഗ്രഹിക്കുന്നവരെ തടയുകയും സഭയിൽ നിന്ന് പുറത്താക്കുകയും ചെയ്യുന്നു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സഹോദരന്മാർ’ എന്നത് ഇവിടെ യാത്ര ചെയ്യുന്ന ക്രൈസ്തവ സഹോദരന്മാരെയോ ശുശ്രൂഷകരെയോ സൂചിപ്പിക്കാനാണ് സാധ്യത. ചില പരിഭാഷകൾ ഇത് ‘സഹവിശ്വാസികൾ’ എന്നും നൽകുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘സ്വാഗതം ചെയ്യുന്നില്ല’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് ക്രിയയ്ക്ക്, പ്രത്യേകിച്ച് ആതിഥ്യം നൽകുന്ന അർത്ഥത്തിൽ, ‘സ്വീകരിക്കുക’ അല്ലെങ്കിൽ ‘സ്വാഗതം ചെയ്യുക’ എന്നർത്ഥമാകാം.
    reason: lexical_alternative
  - marker: c
    text: 'അക്ഷരാർഥത്തോട് കൂടുതൽ അടുത്തായി: ‘സഭയിൽ നിന്ന് തള്ളിക്കളയുന്നു.’ ഇവിടെ സഭാസമൂഹത്തിൽ നിന്നുള്ള പുറത്താക്കലാണ് ഉദ്ദേശിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യത്തിലെ സാഹചര്യത്തിൽനിന്നുള്ള അനന്തരഫലം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὑπομνήσω αὐτοῦ τὰ ἔργα ἃ ποιεῖ
  choice: അവൻ ചെയ്തുകൊണ്ടിരിക്കുന്ന പ്രവൃത്തികൾ ഞാൻ ചൂണ്ടിക്കാണിക്കും
  rationale: ὑπομιμνῄσκω എന്നതിന്റെ ‘ഓർമിപ്പിക്കുക/ശ്രദ്ധയിൽപ്പെടുത്തുക’ എന്ന വ്യാപ്തിയിൽ, ഇവിടെ ദിയൊത്രെഫേസിന്റെ പ്രവൃത്തികളെ പരസ്യമായി ശ്രദ്ധയിൽപ്പെടുത്തുന്ന സന്ദർഭാർത്ഥം ‘ചൂണ്ടിക്കാണിക്കും’ വ്യക്തമാക്കുന്നു; ഇപ്പോഴത്തെ തുടർച്ചയായ പെരുമാറ്റം ‘ചെയ്തുകൊണ്ടിരിക്കുന്ന’ എന്നതിൽ നിലനിർത്തുന്നു.
- source_word: λόγοις πονηροῖς φλυαρῶν ἡμᾶς
  choice: ഞങ്ങൾക്കെതിരെ ദുഷ്ടമായ വാക്കുകൾകൊണ്ട് അസംബന്ധം പറഞ്ഞുനടക്കുകയാണ്
  rationale: φλυαρέωയിലെ പൊള്ളയായ/അസംബന്ധമായ സംസാരത്തിന്റെ അർത്ഥവും, πονηροῖς നൽകുന്ന ദുഷ്ടമായ വൈരഭാവവും, ἡμᾶς സൂചിപ്പിക്കുന്ന ലക്ഷ്യവും നിലനിർത്തുന്നു.
- source_word: μὴ ἀρκούμενος ἐπὶ τούτοις
  choice: അതുകൊണ്ടും തൃപ്തനാകാതെ
  rationale: മുൻപറഞ്ഞ ദുഷ്പ്രവൃത്തി മാത്രം പോരെന്നപോലെ തുടർന്നുള്ള പ്രവൃത്തികളിലേക്കു കടക്കുന്നതിനെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: οὔτε αὐτὸς ἐπιδέχεται τοὺς ἀδελφούς
  choice: അവൻതന്നെ സഹോദരന്മാരെ സ്വീകരിക്കുന്നില്ല
  rationale: ἐπιδέχομαι എന്നതിലെ സ്വീകരിക്കൽ/ആതിഥ്യത്തോടെ സ്വാഗതംചെയ്യൽ എന്ന അർത്ഥവ്യാപ്തി ‘സ്വീകരിക്കുക’ നിലനിർത്തുന്നു; αὐτός എന്ന ഊന്നൽ ‘അവൻതന്നെ’ എന്നതിൽ പ്രതിഫലിക്കുന്നു.
- source_word: τοὺς βουλομένους κωλύει
  choice: അവരെ സ്വീകരിക്കാൻ ആഗ്രഹിക്കുന്നവരെ തടയുന്നു
  rationale: ഗ്രീക്കിൽ വിട്ടുപോയിരിക്കുന്ന പ്രവൃത്തിയെ മുൻവാക്യത്തിൽനിന്ന് വ്യക്തതയ്ക്കായി പൂരിപ്പിക്കുന്നു; βούλομαιയുടെ മനസ്സോടെയുള്ള ആഗ്രഹവും κωλύωയുടെ തടസ്സപ്പെടുത്തലും സംരക്ഷിക്കുന്നു.
- source_word: ἐκ τῆς ἐκκλησίας ἐκβάλλει
  choice: സഭയിൽനിന്ന് പുറത്താക്കുന്നു
  rationale: പ്രാദേശിക ക്രൈസ്തവസമൂഹത്തിൽനിന്നുള്ള ശക്തമായ ബഹിഷ്കരണത്തെ വ്യക്തവും മാന്യവുമായ മലയാളത്തിൽ പറയുന്നു.
theological_decisions:
- issue: τοὺς ἀδελφούς എന്ന പുരുഷലിംഗ ബഹുവചനത്തിന്റെ സന്ദർഭാർത്ഥം
  choice: സഹോദരന്മാർ
  alternative: സഹവിശ്വാസികൾ / സഹോദരീസഹോദരന്മാർ
  rationale: 3 യോഹന്നാനിലെ സന്ദർഭം യാത്രചെയ്യുന്ന ക്രൈസ്തവ ശുശ്രൂഷകരെ സൂചിപ്പിക്കുന്നതിനാൽ മൂലത്തിലെ പുരുഷലിംഗ അടയാളം നിലനിർത്തുന്നു; പൊതുവായ മിശ്രസംഘമായി അനാവശ്യമായി വികസിപ്പിക്കുന്നില്ല.
- issue: സഭയിൽനിന്ന് പുറത്താക്കപ്പെടുന്നവരുടെ സൂചന
  choice: അവരെ സ്വീകരിക്കാൻ ആഗ്രഹിക്കുന്നവരെയാണ് പുറത്താക്കുന്നത് എന്ന സ്വാഭാവിക ബന്ധം
  alternative: ‘അവരെ’ എന്ന് ആവർത്തിച്ച് കർമം വ്യക്തമാക്കുക
  rationale: ഗ്രീക്കിലെ τοὺς βουλομένους എന്നതാണ് അടുത്തുള്ള വ്യക്തമായ മുൻസൂചന; എന്നാൽ ἐκβάλλει-ന്റെ കർമം പ്രത്യേകം ആവർത്തിക്കാത്ത മൂലവാക്യത്തിന്റെ സംക്ഷിപ്തത പ്രധാനപാഠത്തിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. നീണ്ട ഗ്രീക്ക് വാക്യത്തിന്റെ ആശയബന്ധം നിലനിർത്തിക്കൊണ്ട് വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി; രണ്ടാം വാക്യത്തിലെ സമാന്തര പ്രവൃത്തികൾ അർദ്ധവിരാമംകൊണ്ട് ബന്ധിപ്പിച്ചു.
