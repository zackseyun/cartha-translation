- from: 'അതുകൊണ്ട്, ഞാൻ വന്നാൽ, അവൻ ചെയ്തുകൊണ്ടിരിക്കുന്ന പ്രവൃത്തികൾ ഞാൻ ചൂണ്ടിക്കാണിക്കും: ഞങ്ങൾക്കെതിരെ ദുഷ്ടമായ വാക്കുകൾകൊണ്ട് അസംബന്ധം പറഞ്ഞുനടക്കുകയാണ് അവൻ. അതുകൊണ്ടും തൃപ്തനാകാതെ, അവൻതന്നെ സഹോദരന്മാരെ[a] സ്വീകരിക്കുന്നില്ല[b]; അവരെ സ്വീകരിക്കാൻ ആഗ്രഹിക്കുന്നവരെ തടയുകയും സഭയിൽനിന്ന് പുറത്താക്കുകയും ചെയ്യുന്നു[c].'
  to: അതുകൊണ്ട്, ഞാൻ വന്നാൽ, അവൻ ചെയ്തുകൊണ്ടിരിക്കുന്ന പ്രവൃത്തികൾ ഞാൻ ശ്രദ്ധയിൽപ്പെടുത്തും—അവൻ ദുഷ്ടവാക്കുകളാൽ ഞങ്ങൾക്കെതിരെ അസംബന്ധം പറഞ്ഞുനടക്കുന്നു. ഇതിൽ തൃപ്തിപ്പെടാതെ, അവൻ തന്നെ സഹോദരന്മാരെ[a] സ്വീകരിക്കുന്നില്ല[b]; അവരെ സ്വീകരിക്കാൻ ആഗ്രഹിക്കുന്നവരെ തടയുകയും സഭയിൽ നിന്ന് പുറത്താക്കുകയും ചെയ്യുന്നു[c].
  rationale: The revision corrects the connective governing the escalation clause, while retaining the draft’s faithful handling of the Greek syntax, ongoing actions, hospitality sense, and church-exclusion language. Minor spacing and phrasing adjustments improve modern standard Malayalam.
