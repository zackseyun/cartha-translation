id: JHN.13.37
reference: John 13:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸀ὁ Πέτρος· Κύριε, διὰ τί οὐ δύναμαί σοι ⸀ἀκολουθῆσαι ἄρτι; τὴν ψυχήν μου ὑπὲρ σοῦ θήσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/037.yaml
  text: Peter said to him[a], “Lord[b], why am I not able to follow you now? I will lay down my life for you.”
translation:
  language: ml
  text: 'പത്രോസ് അവനോടു പറഞ്ഞു: “കർത്താവേ, എനിക്ക് ഇപ്പോൾ[a] അങ്ങയെ അനുഗമിക്കാൻ കഴിയാത്തത് എന്തുകൊണ്ട്? അങ്ങേക്കുവേണ്ടി ഞാൻ എന്റെ ജീവൻ[b] വെച്ചുകൊടുക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഇപ്പോൾ” എന്നതിന് “ഇപ്പോൾത്തന്നെ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “എന്റെ പ്രാണൻ”; ഈ പ്രയോഗത്തിൽ ഉദ്ദേശിക്കുന്നത് “എന്റെ ജീവൻ” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിൽ ആഖ്യാനപരമായ വർത്തമാനകാലമാണ് (‘പറയുന്നു’); സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലിക്കായി ഭൂതകാലം ഉപയോഗിച്ചു.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: യേശുവിനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയിലെ ആദരവും സാധ്യതയുള്ള ദൈവശാസ്ത്രഭാരവും അനാവശ്യമായി നിർവചിക്കാതെ നിലനിർത്തുന്നു.
- source_word: διὰ τί οὐ δύναμαί
  choice: കഴിയാത്തത് എന്തുകൊണ്ട്?
  rationale: ഗ്രീക്ക് ചോദ്യത്തിന്റെ അർഥവും ഊന്നലും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: σοι ἀκολουθῆσαι
  choice: അങ്ങയെ അനുഗമിക്കാൻ
  rationale: ἀκολουθέω എന്ന പദത്തിലെ കൂടെ പോകുക എന്ന സ്ഥലപരമായ അർഥവും ശിഷ്യത്വപരമായ ‘പിന്തുടരുക’ എന്ന ധ്വനിയും ‘അനുഗമിക്കുക’ നിലനിർത്തുന്നു.
- source_word: ἄρτι
  choice: ഇപ്പോൾ
  rationale: സമയത്തിന്റെ ഉടൻപ്രാബല്യം ലളിതവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു; ‘ഇപ്പോൾത്തന്നെ’ എന്ന കൂടുതൽ ഊന്നലുള്ള രൂപം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: τὴν ψυχήν μου
  choice: എന്റെ ജീവൻ
  rationale: τίθημι τὴν ψυχήν എന്ന പ്രയോഗം ഇവിടെ മരണം ഏറ്റെടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ജീവൻ’ എന്നാണ് സ്വാഭാവിക അർഥം; ‘ആത്മാവ്’ എന്നു പറയുന്നത് അനാവശ്യമായ തത്ത്വചിന്താപരമായ അർഥം വരുത്തും.
- source_word: ὑπὲρ σοῦ
  choice: അങ്ങേക്കുവേണ്ടി
  rationale: മറ്റൊരാളുടെ നന്മയ്ക്കായോ അയാൾക്കുവേണ്ടിയോ പ്രവർത്തിക്കുന്നതെന്ന വിശാലമായ അർഥം നിലനിർത്തുന്നു; പകരംവയ്ക്കൽ എന്ന പ്രത്യേക വ്യാഖ്യാനം നിർബന്ധിക്കുന്നില്ല.
- source_word: θήσω
  choice: വെച്ചുകൊടുക്കും
  rationale: ψυχήയോടൊപ്പം τίθημι രൂപപ്പെടുത്തുന്ന ‘ജീവൻ വെച്ചുകൊടുക്കുക’ എന്ന പ്രയോഗത്തെ സ്രോതസ്സിനോട് അടുത്തും മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന വിധത്തിലും അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: പത്രോസിന്റെ പ്രഖ്യാപനത്തിൽ ψυχή എന്നതിന്റെ അർഥം
  choice: ‘ആത്മാവ്’ എന്നതിനു പകരം ‘ജീവൻ’
  alternative: എന്റെ ആത്മാവ് / എന്റെ പ്രാണൻ
  rationale: സന്ദർഭം യേശുവിനുവേണ്ടി മരിക്കാൻ പത്രോസ് സന്നദ്ധനാണെന്ന അവകാശവാദത്തെക്കുറിച്ചാണ്; അതിനാൽ ഇവിടെ ψυχή എന്നത് വ്യക്തിയുടെ ജീവനെ സൂചിപ്പിക്കുന്നു.
- issue: ἀκολουθέω എന്ന ക്രിയയുടെ ഇരട്ടധ്വനി
  choice: ‘അനുഗമിക്കുക’
  alternative: കൂടെ പോകുക / പിന്തുടരുക
  rationale: യേശു പോകുന്നിടത്തേക്കുള്ള യാത്രയും അവന്റെ ശിഷ്യനായി പിന്തുടരുന്നതും ഒരുമിച്ച് ധ്വനിപ്പിക്കുന്ന യോഹന്നാനീയ പിരിമുറുക്ക് ‘അനുഗമിക്കുക’ നിലനിർത്തുന്നു.
- issue: ὑπέρ എന്നതിലെ ബന്ധസൂചന
  choice: ‘അങ്ങേക്കുവേണ്ടി’ എന്ന വിശാലമായ പ്രയോഗം
  alternative: അങ്ങയുടെ സ്ഥാനത്ത് / അങ്ങയുടെ നിമിത്തം
  rationale: പത്രോസിന്റെ വാക്കുകളിൽ ഉപകാരത്തിനായുള്ളതോ പ്രതിനിധിയായുള്ളതോ ആയ സൂക്ഷ്മത കൃത്യമായി നിർണ്ണയിക്കാതെ ഗ്രീക്കിലെ അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. യേശുവിനോടുള്ള അഭിസംബോധനയിൽ ‘അങ്ങ്’ രൂപം ഉപയോഗിച്ചു. വാക്യഘടന സ്രോതസ്സിനോട് അടുത്തുനിൽക്കുമ്പോഴും മലയാളത്തിൽ സ്വാഭാവികമായ ചോദ്യക്രമം സ്വീകരിച്ചു.
