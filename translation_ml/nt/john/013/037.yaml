  naturalness: വാക്യം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമാണ്. യേശുവിനോടുള്ള അഭിസംബോധനയിലെ “അങ്ങയെ/അങ്ങേക്കുവേണ്ടി” രൂപങ്ങൾ രജിസ്റ്ററിനൊത്തതാണ്. “അനുഗമിക്കുക” അല്പം ഔപചാരികമാണെങ്കിലും ഈ സന്ദർഭത്തിലെ ശിഷ്യത്വധ്വനിക്ക് അനുയോജ്യവും വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമാണ്.
