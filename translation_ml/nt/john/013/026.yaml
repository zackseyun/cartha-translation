id: JHN.13.26
reference: John 13:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ἀποκρίνεται ὁ Ἰησοῦς· Ἐκεῖνός ἐστιν ᾧ ἐγὼ ⸀βάψω τὸ ψωμίον ⸂καὶ δώσω αὐτῷ⸃· ⸂βάψας οὖν⸃ τὸ ⸀ψωμίον δίδωσιν Ἰούδᾳ Σίμωνος ⸀Ἰσκαριώτου.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/026.yaml
  text: Jesus answers[a], “It is he to whom I will dip the piece of bread and give it.” So, having dipped the piece of bread, he gives it to Judas, the son of Simon Iscariot.
translation:
  language: ml
  text: 'യേശു മറുപടി പറയുന്നു: “ഞാൻ അപ്പക്കഷണം മുക്കി ആർക്കു കൊടുക്കുമോ, അവൻ തന്നെയാണ്.” അങ്ങനെ, അപ്പക്കഷണം മുക്കിയശേഷം, ഇസ്കര്യോത്തായ ശിമോന്റെ മകനായ യൂദാസിന് അത് കൊടുക്കുന്നു.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ശിമോന്റെ മകനായ ഇസ്കര്യോത്തായ യൂദാസിന്.” ഗ്രീക്ക് പദക്രമം രണ്ടുവിധത്തിലും മനസ്സിലാക്കാവുന്നതാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκρίνεται
  choice: മറുപടി പറയുന്നു
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാല ആഖ്യാനരൂപത്തിന്റെ സജീവത നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി കേൾക്കുകയും ചെയ്യുന്നു.
- source_word: Ἐκεῖνός ἐστιν
  choice: അവൻ തന്നെയാണ്
  rationale: ചോദിക്കപ്പെട്ട വ്യക്തിയെ ഊന്നിപ്പറഞ്ഞ് തിരിച്ചറിയിക്കുന്ന സർവനാമ-ക്രിയാസംയോജനത്തിന്റെ ബലം സ്വാഭാവിക മലയാളത്തിൽ പകരുന്നു.
- source_word: ᾧ ἐγὼ βάψω τὸ ψωμίον καὶ δώσω αὐτῷ
  choice: ഞാൻ അപ്പക്കഷണം മുക്കി ആർക്കു കൊടുക്കുമോ
  rationale: ബന്ധസർവനാമഘടന മലയാളത്തിന് സ്വാഭാവികമായ വിധത്തിൽ പുനഃക്രമീകരിച്ചിരിക്കുന്നു; βάψω എന്ന ഭാവികാലവും കൊടുക്കൽ ലക്ഷ്യമാക്കുന്ന വ്യക്തിയും ഈ ഘടനയിൽ വ്യക്തമാണ്.
- source_word: ψωμίον
  choice: അപ്പക്കഷണം
  rationale: ചെറിയ അപ്പക്കഷണം എന്ന അർഥം ലളിതവും വ്യക്തവുമായി നൽകുന്നു; അതിയായി സാഹിത്യപരമായ പദം ഒഴിവാക്കുന്നു.
- source_word: βάψας οὖν
  choice: അങ്ങനെ, അപ്പക്കഷണം മുക്കിയശേഷം
  rationale: മുക്കൽ ആദ്യം നടന്നു, തുടർന്ന് കൊടുക്കൽ സംഭവിച്ചു എന്ന ഏഓറിസ്റ്റ് കൃതന്തത്തിന്റെ കാലക്രമവും οὖν എന്ന ബന്ധകത്തിന്റെ ഫലസൂചനയും നിലനിർത്തുന്നു.
- source_word: δίδωσιν
  choice: കൊടുക്കുന്നു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനത്തിന്റെ സജീവത മലയാളത്തിലും വർത്തമാനകാലത്തിൽ നിലനിർത്തുന്നു.
- source_word: Ἰούδᾳ Σίμωνος Ἰσκαριώτου
  choice: ശിമോൻ ഇസ്കര്യോത്തിന്റെ മകനായ യൂദാസിന്
  rationale: തൊട്ടടുത്ത ഗ്രീക്ക് വ്യാകരണഘടനപ്രകാരം Ἰσκαριώτου എന്ന വിശേഷണം ശിമോനോടു ചേർത്ത് മുഖ്യവാചകത്തിൽ നൽകുന്നു; മറ്റൊരു സാധ്യമായ ബന്ധം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: അവസാന വാക്യഭാഗത്തിൽ ‘ഇസ്കര്യോത്ത്’ ആരെ വിശേഷിപ്പിക്കുന്നു എന്നത്
  choice: ‘ശിമോൻ ഇസ്കര്യോത്തിന്റെ മകനായ യൂദാസ്’
  alternative: ‘ശിമോന്റെ മകനായ യൂദാസ് ഇസ്കര്യോത്ത്’
  rationale: Σίμωνος Ἰσκαριώτου എന്ന തുടർച്ചയായ ഷഷ്ഠീവിഭക്തിരൂപങ്ങൾ ഏറ്റവും നേരിട്ട് ‘ശിമോൻ ഇസ്കര്യോത്തിന്റെ’ എന്നു വായിക്കാം. എന്നാൽ പരമ്പരാഗതമായി ‘ഇസ്കര്യോത്ത്’ യൂദാസിനോടു ചേർത്തും ഈ പ്രയോഗം മനസ്സിലാക്കാം. അതിനാൽ മുഖ്യവാചകം അടുത്ത വ്യാകരണഘടന പിന്തുടരുകയും മറുവായന അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ ചരിത്രവർത്തമാനം ‘മറുപടി പറയുന്നു’, ‘കൊടുക്കുന്നു’ എന്നീ രൂപങ്ങളിൽ നിലനിർത്തി. ബന്ധവാക്യം മലയാളത്തിന്റെ സ്വാഭാവിക ക്രമത്തിലാക്കി; തിരിച്ചറിയൽവാക്യത്തിലെ ഊന്നൽ ‘അവൻ തന്നെയാണ്’ എന്നതിലൂടെ സംരക്ഷിച്ചു.
