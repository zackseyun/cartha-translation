id: JHN.13.13
reference: John 13:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὑμεῖς φωνεῖτέ με Ὁ διδάσκαλος καὶ Ὁ κύριος, καὶ καλῶς λέγετε, εἰμὶ γάρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/013.yaml
  text: You call me Teacher and Lord, and you speak rightly, for I am.
translation:
  language: ml
  text: നിങ്ങൾ എന്നെ ‘ഗുരു’ എന്നും ‘കർത്താവ്’[a] എന്നും വിളിക്കുന്നു; നിങ്ങൾ പറയുന്നത് ശരിയാണ്, കാരണം ഞാൻ അങ്ങനെയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘യജമാനൻ.’ ഗ്രീക്കിലെ κύριος എന്ന പദം അധികാരത്തെയോ ആധിപത്യത്തെയോ സൂചിപ്പിക്കാം; ഇവിടെ പതിവായ പദവിരൂപമായി ‘കർത്താവ്’ നിലനിർത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνεῖτέ
  choice: വിളിക്കുന്നു
  rationale: ഒരാളെ ഒരു പദവിപ്പേരിൽ വിളിക്കുക എന്ന ഈ വാക്യഘടനയിൽ ‘വിളിക്കുന്നു’ സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ മലയാളപ്രയോഗമാണ്.
- source_word: Ὁ διδάσκαλος
  choice: ഗുരു
  rationale: പഠിപ്പിക്കുന്നവൻ എന്ന അർഥവും യേശുവിനെ അഭിസംബോധന ചെയ്യുന്ന പദവിയുടെ സ്വഭാവവും സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; ഗ്രീക്ക് നിർദേശകം പദവിയെ അടയാളപ്പെടുത്തുന്നതിനാൽ മലയാളത്തിൽ ഉദ്ധരണിചിഹ്നങ്ങൾ ഉപയോഗിച്ചു.
- source_word: Ὁ κύριος
  choice: കർത്താവ്
  rationale: κύριος എന്ന പദത്തിന്റെ അധികാരവും പുതിയനിയമത്തിലെ യേശുവിനുള്ള പദവിയുടെ ദൈവശാസ്ത്രഭാരവും നിലനിർത്തുന്ന പതിവും വ്യക്തവുമായ മലയാളരൂപമാണിത്.
- source_word: καλῶς λέγετε
  choice: നിങ്ങൾ പറയുന്നത് ശരിയാണ്
  rationale: അവരുടെ പ്രസ്താവന ശരിയാണെന്ന വിലയിരുത്തൽ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; ‘നന്നായി പറയുന്നു’ എന്ന അസ്വാഭാവികമായ പദാനുപദരൂപം ഒഴിവാക്കുന്നു.
- source_word: εἰμὶ γάρ
  choice: കാരണം, ഞാൻ അങ്ങനെയാണ്
  rationale: γάρ എന്ന കാരണബന്ധവും εἰμί എന്ന സംക്ഷിപ്തമായ സ്വയംസ്ഥിരീകരണവും അധിക വിശദീകരണം ചേർക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശുവിനുള്ള κύριος എന്ന പദവിയുടെ പരിഭാഷ
  choice: കർത്താവ്
  alternative: യജമാനൻ
  rationale: ‘കർത്താവ്’ പുതിയനിയമത്തിലെ പദവിയുടെ അധികാരപരവും ദൈവശാസ്ത്രപരവുമായ വ്യാപ്തി നിലനിർത്തുന്നു. ‘യജമാനൻ’ സാമൂഹിക അധികാരത്തിന്റെ അർഥം നൽകാമെങ്കിലും ഇവിടെ പദവിയുടെ മുഴുവൻ ഭാരവും അതിലൂടെ വ്യക്തമാകണമെന്നില്ല; അതിനാൽ അത് അടിക്കുറിപ്പിലെ പകരമായി നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. പദവികൾ ഉദ്ധരണിചിഹ്നങ്ങളിൽ നൽകി; മൂലത്തിലെ കാരണബന്ധവും യേശുവിന്റെ സംക്ഷിപ്തമായ സ്വയംസ്ഥിരീകരണവും നിലനിർത്തി.
