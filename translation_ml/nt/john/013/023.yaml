- from: യേശു സ്നേഹിച്ചിരുന്ന ശിഷ്യന്മാരിൽ ഒരാൾ യേശുവിനോടു തൊട്ടുചേർന്ന് ഭക്ഷണത്തിനായി ചാരിക്കിടക്കുകയായിരുന്നു[a].
  to: യേശുവിന്റെ ശിഷ്യന്മാരിൽ യേശു സ്നേഹിച്ചിരുന്ന ഒരാൾ യേശുവിന്റെ തൊട്ടടുത്തായി ഭക്ഷണവേളയിൽ ചാരിക്കിടക്കുകയായിരുന്നു[a].
  rationale: The revision clarifies that Jesus loved this individual disciple, rather than potentially qualifying a group of disciples. It also renders the ancient reclining arrangement idiomatically without adding an implication of bodily contact, while preserving the literal ‘in Jesus’ bosom’ expression and its dining-context explanation in the footnote.
