  text: ⸀ἦν ἀνακείμενος εἷς ⸀ἐκ τῶν μαθητῶν αὐτοῦ ἐν τῷ κόλπῳ τοῦ Ἰησοῦ, ὃν ἠγάπα ὁ Ἰησοῦς·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/023.yaml
  text: One of his disciples[a], whom Jesus loved, was reclining in Jesus' bosom.
translation:
  language: ml
  text: യേശുവിന്റെ ശിഷ്യന്മാരിൽ യേശു സ്നേഹിച്ചിരുന്ന ഒരാൾ യേശുവിന്റെ തൊട്ടടുത്തായി ഭക്ഷണവേളയിൽ ചാരിക്കിടക്കുകയായിരുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘യേശുവിന്റെ മാറിൽ.’ വിരുന്നിൽ ഒരാൾ മറ്റൊരാളുടെ തൊട്ടടുത്തായി ചാരിക്കിടന്ന സ്ഥാനത്തെ വിവരിക്കുന്ന പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνακείμενος
  choice: ഭക്ഷണത്തിനായി ചാരിക്കിടക്കുകയായിരുന്നു
  rationale: പുരാതന വിരുന്നുകളിൽ വശംചാരി ഭക്ഷണം കഴിക്കുന്ന പതിവിനെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്. ‘ചാരിക്കിടക്കുകയായിരുന്നു’ ശരീരനില വ്യക്തമാക്കുന്നു; ‘ഭക്ഷണത്തിനായി’ എന്നത് സന്ദർഭം ആധുനിക വായനക്കാരന് ഗ്രഹിക്കാവുന്നതാക്കുന്നു.
- source_word: εἷς ἐκ τῶν μαθητῶν αὐτοῦ
  choice: ശിഷ്യന്മാരിൽ ഒരാൾ
  rationale: ഗ്രീക്കിലെ ഭാഗസൂചക പ്രയോഗത്തിന്റെ സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ മലയാളരൂപമാണിത്. യേശുവിനെ സൂചിപ്പിക്കുന്ന ഉടമസ്ഥസർവനാമം തുടർന്നുള്ള വാക്യഘടനയിൽ വ്യക്തമായതിനാൽ അനാവശ്യ ആവർത്തനം ഒഴിവാക്കി.
- source_word: ἐν τῷ κόλπῳ τοῦ Ἰησοῦ
  choice: യേശുവിനോടു തൊട്ടുചേർന്ന്
  rationale: κόλπος നെഞ്ച്/മാർവ് എന്ന ശരീരഭാഗത്തെ അക്ഷരാർഥത്തിൽ സൂചിപ്പിക്കാമെങ്കിലും, ഇവിടെ വിരുന്നിൽ യേശുവിനടുത്തായി ചാരിക്കിടന്ന സ്ഥാനമാണ് ഉദ്ദേശിക്കുന്നത്. ‘തൊട്ടുചേർന്ന്’ ആ സ്ഥാനപരമായ അടുപ്പം തെറ്റിദ്ധാരണയില്ലാതെ അറിയിക്കുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ὃν ἠγάπα ὁ Ἰησοῦς
  choice: യേശു സ്നേഹിച്ചിരുന്ന
  rationale: ബന്ധവാക്യം മലയാളത്തിൽ വിശേഷണഘടനയായി സ്വാഭാവികമായി വരുന്നു. ἀγαπάω എന്നതിന്റെ സാധാരണവും അർഥസമ്പൂർണ്ണവുമായ പരിഭാഷ ‘സ്നേഹിക്കുക’ ആണ്.
theological_decisions:
- issue: യേശുവിനോടുള്ള പ്രിയശിഷ്യന്റെ സ്ഥാനം എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: വിരുന്നിലെ സ്ഥാനപരമായ അടുപ്പം ‘യേശുവിനോടു തൊട്ടുചേർന്ന്’ എന്നു മുഖ്യപാഠത്തിൽ നൽകുക
  alternative: ‘യേശുവിന്റെ മാർവിൽ’ അഥവാ ‘യേശുവിന്റെ നെഞ്ചിൽ’
  rationale: ഇവിടെ പ്രാഥമികമായി വിവരിക്കുന്നത് വിരുന്നിലെ ഇരിപ്പു/ചാരൽക്രമമാണ്; മിസ്റ്റികമായ ഐക്യമോ ആധുനിക വായനക്കാരൻ ധരിക്കാവുന്ന വേറൊരു ശാരീരിക ഭാവമോ നിർബന്ധിച്ച് ചേർക്കരുത്. അതേസമയം യോഹന്നാന്റെ ഭാഷയിലെ പ്രതിധ്വനി നഷ്ടപ്പെടാതിരിക്കാൻ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. പുരാതന ഭക്ഷണരീതി വ്യക്തമാക്കാൻ ‘ഭക്ഷണത്തിനായി ചാരിക്കിടക്കുകയായിരുന്നു’ എന്നും, തെറ്റിദ്ധാരണ ഒഴിവാക്കിക്കൊണ്ട് ഗ്രീക്കിലെ സ്ഥാനപരമായ അടുപ്പം കൈവിടാതിരിക്കാൻ ‘തൊട്ടുചേർന്ന്’ എന്നും ഉപയോഗിച്ചു.
