id: JHN.13.36
reference: John 13:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Λέγει αὐτῷ Σίμων Πέτρος· Κύριε, ποῦ ὑπάγεις; ⸀ἀπεκρίθη Ἰησοῦς· Ὅπου ὑπάγω οὐ δύνασαί μοι νῦν ἀκολουθῆσαι, ⸂ἀκολουθήσεις δὲ ὕστερον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/036.yaml
  text: Simon Peter says to him[a], “Lord, where are you going?” Jesus answered, “Where I am going, you are not able to follow me now[b], but you will follow later.”
translation:
  language: ml
  text: 'ശിമോൻ പത്രോസ് അവനോടു ചോദിക്കുന്നു: “കർത്താവേ, അങ്ങ് എവിടേക്കാണ് പോകുന്നത്?” യേശു മറുപടി പറഞ്ഞു: “ഞാൻ പോകുന്നിടത്തേക്ക് ഇപ്പോൾ എന്നെ അനുഗമിക്കാൻ നിനക്കു കഴിയില്ല[a]; എന്നാൽ പിന്നീട് നീ അനുഗമിക്കും[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഇപ്പോൾ എന്നെ അനുഗമിക്കാൻ നിനക്കാവില്ല” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിൽ കഴിവിനെ സൂചിപ്പിക്കുന്ന ക്രിയ വ്യക്തമായി ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “പിന്നീട് നീ അനുഗമിക്കും” എന്നത് പത്രോസ് പിന്നീട് യേശുവിനെ കഷ്ടാനുഭവത്തിലോ മരണത്തിലോ അനുഗമിക്കുന്നതിനെ സൂചിപ്പിച്ചേക്കാം; എന്നാൽ എങ്ങനെയെന്ന് ഈ വാക്കുകൾതന്നെ വ്യക്തമാക്കുന്നില്ല.
    reason: cross_reference
lexical_decisions:
- source_word: Λέγει
  choice: ചോദിക്കുന്നു
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാല ആഖ്യാനരൂപം നിലനിർത്തുന്നു; ചോദ്യം അവതരിപ്പിക്കുന്ന സാഹചര്യത്തിൽ മലയാളത്തിൽ സ്വാഭാവികമായി ‘ചോദിക്കുന്നു’ എന്നു നൽകി.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: യേശുവിനോടുള്ള ആദരപൂർവമായ നേരിട്ടുള്ള സംബോധനയും τίτλος എന്ന നിലയിലെ ദൈവശാസ്ത്രപരമായ അനുരണനവും നിലനിർത്തുന്നു.
- source_word: ποῦ ὑπάγεις
  choice: അങ്ങ് എവിടേക്കാണ് പോകുന്നത്?
  rationale: ὑπάγω എന്നതിന്റെ സാധാരണ ഗതിസൂചക അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ആദരസൂചകമായി ‘അങ്ങ്’ ഉപയോഗിച്ചു.
- source_word: ἀπεκρίθη
  choice: മറുപടി പറഞ്ഞു
  rationale: സംഭാഷണത്തിലെ ഗ്രീക്ക് ഭൂതകാലരൂപത്തിന് സ്വാഭാവികമായ മലയാള ആഖ്യാനപ്രയോഗം.
- source_word: Ὅπου ὑπάγω
  choice: ഞാൻ പോകുന്നിടത്തേക്ക്
  rationale: പത്രോസിന്റെ ചോദ്യത്തിലെ ‘പോകുക’ എന്ന ക്രിയാബന്ധം നിലനിർത്തുകയും, അനുഗമിക്കുന്നതിന്റെ ലക്ഷ്യസ്ഥാനം മലയാളത്തിൽ വ്യക്തമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: οὐ δύνασαί μοι νῦν ἀκολουθῆσαι
  choice: ഇപ്പോൾ എന്നെ അനുഗമിക്കാൻ നിനക്കു കഴിയില്ല
  rationale: δύναμαι എന്ന കഴിവുസൂചക ക്രിയയുടെ അർഥം തുറന്നുവെക്കുന്നു; μοι എന്നത് ‘എന്നെ’ എന്നും νῦν എന്നത് ‘ഇപ്പോൾ’ എന്നും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἀκολουθήσεις δὲ ὕστερον
  choice: എന്നാൽ പിന്നീട് നീ അനുഗമിക്കും
  rationale: ഭാവികാലം നിലനിർത്തുന്നു; δέ സൂചിപ്പിക്കുന്ന വൈരുധ്യം ‘എന്നാൽ’ എന്നും ὕστερον ‘പിന്നീട്’ എന്നും സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: പത്രോസ് പിന്നീട് യേശുവിനെ അനുഗമിക്കുമെന്ന വാക്കിന്റെ സൂചന
  choice: അനുഗമിക്കൽ എങ്ങനെയായിരിക്കുമെന്ന് മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കാതെ വാക്യത്തിന്റെ തുറന്ന അർഥം നിലനിർത്തി.
  alternative: ഇത് പത്രോസിന്റെ രക്തസാക്ഷിത്വത്തെയോ, പുനഃസ്ഥാപനത്തിനുശേഷമുള്ള ശിഷ്യത്വത്തെയോ, മരണത്തിലും മഹത്ത്വത്തിലും യേശുവിനെ അനുഗമിക്കുന്നതിനെയോ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നതായി പരിഭാഷപ്പെടുത്തുക.
  rationale: ഗ്രീക്ക് പാഠം പത്രോസിന് ഇപ്പോൾ അനുഗമിക്കാൻ കഴിയില്ലെന്നും പിന്നീട് അനുഗമിക്കുമെന്നും മാത്രമാണ് പറയുന്നത്. അതിനാൽ ഒരു പ്രത്യേക ദൈവശാസ്ത്ര വ്യാഖ്യാനം മുഖ്യപാഠത്തിലേക്ക് ചേർക്കാതെ ആഖ്യാനപരമായ തുറന്ന നില സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ സംഭാഷണശൈലി ഉപയോഗിച്ചു. യേശുവിനെ അഭിസംബോധന ചെയ്യുമ്പോൾ ‘അങ്ങ്’ എന്നും, യേശുവിന്റെ മറുപടിയിൽ പത്രോസിനോട് ‘നീ’ എന്നും നൽകി; ഇത് ആദരവും ഗുരു–ശിഷ്യ ബന്ധത്തിന്റെ സ്വാഭാവിക അസമത്വവും പ്രകടിപ്പിക്കുന്നു. ഗ്രീക്കിലെ ചരിത്രവർത്തമാനമായ Λέγει ‘ചോദിക്കുന്നു’ എന്ന രൂപത്തിൽ നിലനിർത്തി.
