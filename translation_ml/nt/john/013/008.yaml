id: JHN.13.8
reference: John 13:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγει αὐτῷ Πέτρος· Οὐ μὴ νίψῃς ⸂μου τοὺς πόδας⸃ εἰς τὸν αἰῶνα. ἀπεκρίθη ⸂Ἰησοῦς αὐτῷ⸃· Ἐὰν μὴ νίψω σε, οὐκ ἔχεις μέρος μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/008.yaml
  text: Peter said to him[a], “You will never wash my feet.” Jesus answered him, “If I do not wash you, you have no share with me.”
translation:
  language: ml
  text: 'പത്രോസ് അവനോട് പറഞ്ഞു: “അങ്ങ് ഒരിക്കലും എന്റെ കാലുകൾ കഴുകുകയില്ല.” യേശു അവനോട് ഉത്തരം പറഞ്ഞു: “ഞാൻ നിന്നെ കഴുകുന്നില്ലെങ്കിൽ, നിനക്ക് എന്നോടൊപ്പം പങ്കില്ല[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നിനക്ക് എന്നോടൊപ്പം യാതൊരു ഭാഗവുമില്ല.”'
    reason: μέρος എന്ന പദത്തിന് ‘പങ്ക്’ എന്നും ‘ഭാഗം’ എന്നും വിവർത്തനം സാധ്യമാണ്; രണ്ടാമത്തേത് കൂടുതൽ പദാനുപദമായ പര്യായമാണ്.
lexical_decisions:
- source_word: Οὐ μὴ νίψῃς … εἰς τὸν αἰῶνα
  choice: അങ്ങ് ഒരിക്കലും … കഴുകുകയില്ല
  rationale: οὐ μή എന്ന ശക്തമായ നിഷേധവും εἰς τὸν αἰῶνα എന്ന പ്രയോഗവും ചേർന്ന് ഭാവിയിലെ പ്രവൃത്തിയെക്കുറിച്ചുള്ള പത്രോസിന്റെ ഉറച്ച നിരാകരണം പ്രകടമാക്കുന്നു. ‘ഒരിക്കലും … കഴുകുകയില്ല’ അത് സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: μου τοὺς πόδας
  choice: എന്റെ കാലുകൾ
  rationale: ഗ്രീക്കിലെ വ്യക്തമായ ഉടമസ്ഥതയും ബഹുവചനത്തിലുള്ള ശരീരഭാഗവും നേരിട്ട് പകർന്നു.
- source_word: ἀπεκρίθη Ἰησοῦς αὐτῷ
  choice: യേശു അവനോട് ഉത്തരം പറഞ്ഞു
  rationale: സുവിശേഷവിവരണശൈലിക്ക് യോജിച്ച സ്വാഭാവികമായ മറുപടി-ക്രിയാപ്രയോഗം; αὐτῷ എന്ന പരാമർശവും നിലനിർത്തുന്നു.
- source_word: Ἐὰν μὴ νίψω σε
  choice: ഞാൻ നിന്നെ കഴുകുന്നില്ലെങ്കിൽ
  rationale: വ്യവസ്ഥാസൂചകമായ ἐὰν μή ഘടനയും ഒന്നാംപുരുഷ കർത്താവും വ്യക്തമായി നിലനിർത്തുന്നു; കഴുകുന്നത് കാലുകൾ മാത്രമാണെന്ന് ഇവിടെ ആവർത്തിക്കാതെ σε എന്ന സമഗ്രമായ ‘നിന്നെ’ സംരക്ഷിക്കുന്നു.
- source_word: οὐκ ἔχεις μέρος
  choice: നിനക്ക് … പങ്കില്ല
  rationale: μέρος എന്നതിന് പങ്ക്, ഭാഗം, ഓഹരി എന്നീ അർഥസാധ്യതകളുണ്ട്. ‘പങ്ക്’ യേശുവുമായുള്ള പങ്കാളിത്തം എന്ന വിശാലമായ ആശയം സ്വാഭാവികമായി അറിയിക്കുകയും പ്രത്യേക ദൈവശാസ്ത്രവ്യാഖ്യാനം നിർബന്ധിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: μετ’ ἐμοῦ
  choice: എന്നോടൊപ്പം
  rationale: μετά + genitive സൂചിപ്പിക്കുന്ന സഹവാസമോ ബന്ധമോ നേരിട്ട് പകർന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘എന്നിൽ’ എന്ന യോഹന്നാനീയ പ്രയോഗം ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: യേശുവിനോടൊപ്പം μέρος ഉണ്ടായിരിക്കുക എന്നതിന്റെ അർഥം
  choice: യേശുവുമായുള്ള പങ്കാളിത്തം/ബന്ധം എന്ന വിശാലമായ അർഥം ‘എന്നോടൊപ്പം പങ്ക്’ എന്ന പ്രയോഗത്തിലൂടെ നിലനിർത്തി.
  alternative: ഇത് പ്രാഥമികമായി കൂദാശാപരമായ ശുദ്ധീകരണമോ, താഴ്മയുള്ള സേവനത്തിന്റെ പ്രതീകമോ, രക്ഷാപരമായ ഉടമസ്ഥതയുടെ നേരിട്ടുള്ള പ്രസ്താവനയോ ആണെന്ന് വിവർത്തനത്തിൽ വ്യക്തമാക്കുക.
  rationale: യേശുവിന്റെ കഴുകൽ അനിവാര്യമാണെന്ന് വാക്യം ഉറപ്പിക്കുന്നു; എന്നാൽ അതിന്റെ കൃത്യമായ ദൈവശാസ്ത്രപ്രവർത്തനം ഗ്രീക്ക് വാചകം നിർവചിക്കുന്നില്ല. അതിനാൽ ആ പിരിമുറുക്കവും വ്യാഖ്യാനസാധ്യതയും തുറന്നുവെച്ചു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി സ്വീകരിച്ചു. പത്രോസ് യേശുവിനെ അഭിസംബോധന ചെയ്യുമ്പോൾ ‘അങ്ങ്’ എന്നും യേശു പത്രോസിനോട് പറയുമ്പോൾ ‘നീ/നിന്നെ’ എന്നതിന്റെ രൂപങ്ങളും ഉപയോഗിച്ച് സംഭാഷണത്തിലെ ബന്ധഭേദം സ്വാഭാവികമായി പ്രകടമാക്കി.
