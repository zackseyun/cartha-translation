  source_fidelity: The Malayalam accurately represents Peter’s emphatic refusal (οὐ μὴ … εἰς τὸν αἰῶνα) as “അങ്ങ് ഒരിക്കലും … കഴുകുകയില്ല,” retains the explicit object “my feet,” and renders Jesus’ conditional response without narrowing the scope of “wash you.” “എന്നോടൊപ്പം പങ്കില്ല” appropriately conveys οὐκ ἔχεις μέρος μετ’ ἐμοῦ as participation/share with Jesus, without imposing a particular theological explanation.
  naturalness: The dialogue is fluent, clear modern standard Malayalam. The respectful “അങ്ങ്” for Peter’s address to Jesus and the direct singular forms in Jesus’ reply are natural and suitably maintain the conversational relationship. “യേശു അവനോട് ഉത്തരം പറഞ്ഞു” is idiomatic narrative Malayalam.
  terminology: “കാലുകൾ കഴുകുക” naturally communicates foot-washing in context. “പങ്ക്” is an apt broad equivalent for μέρος, and the footnote provides “ഭാഗം” as a viable more literal alternative. No doctrinal narrowing or problematic name/term usage is present.
