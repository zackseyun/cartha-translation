reference: John 13:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Ὁ λελουμένος ⸂οὐκ ἔχει χρείαν⸃ ⸂εἰ μὴ⸃ τοὺς πόδας νίψασθαι, ἀλλ’ ἔστιν καθαρὸς ὅλος· καὶ ὑμεῖς καθαροί ἐστε, ἀλλ’ οὐχὶ πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/010.yaml
  text: Jesus said to him[a], “The one who has bathed has no need except to wash his feet, but is completely clean. And you are clean, but not all of you.”
translation:
  language: ml
  text: 'യേശു അവനോടു പറഞ്ഞു: “കുളിച്ചവന്[a] തന്റെ കാലുകൾ കഴുകുന്നതല്ലാതെ മറ്റൊന്നും ആവശ്യമില്ല; അവൻ പൂർണമായും ശുദ്ധനാണ്. നിങ്ങളും ശുദ്ധരാണ്; എന്നാൽ നിങ്ങളിൽ എല്ലാവരും ശുദ്ധരല്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഗ്രീക്കിൽ കഴുകലിനെ സൂചിപ്പിക്കാൻ ഇവിടെ രണ്ടു വ്യത്യസ്ത ക്രിയകളുണ്ട്: λούω എന്നത് ശരീരം മുഴുവൻ ‘കുളിക്കുക’ എന്നും νίπτω എന്നത് കാലുകൾ പോലുള്ള ഒരു ശരീരഭാഗം ‘കഴുകുക’ എന്നും സാധാരണയായി സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ λελουμένος
  choice: കുളിച്ചവന്
  rationale: λούω എന്ന ക്രിയ ശരീരം മുഴുവൻ കുളിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. Perfect participle പൂർത്തിയായ കുളിയുടെ ഫലമായി നിലനിൽക്കുന്ന അവസ്ഥയും ഇവിടെ നിലനിർത്തുന്നു.
- source_word: οὐκ ἔχει χρείαν
  choice: മറ്റൊന്നും ആവശ്യമില്ല
  rationale: ‘ആവശ്യമില്ല’ എന്നത് ἔχει χρείαν എന്ന പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളമാണ്; εἰ μὴ അവതരിപ്പിക്കുന്ന ഏക അപവാദത്തോടൊപ്പം വായിക്കാൻ ‘മറ്റൊന്നും’ ചേർത്തത് വാക്യം വ്യക്തമാക്കുന്നു.
- source_word: εἰ μὴ
  choice: …യല്ലാതെ
  rationale: മുൻപറഞ്ഞ നിഷേധത്തിന് ഏക അപവാദം അവതരിപ്പിക്കുന്ന εἰ μὴ എന്നതിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: τοὺς πόδας νίψασθαι
  choice: കാലുകൾ കഴുകുക
  rationale: νίπτω സാധാരണയായി കാലുകൾ പോലുള്ള ശരീരഭാഗം കഴുകുന്നതിനെ സൂചിപ്പിക്കുന്നു; λούω എന്ന ‘കുളിക്കുക’ എന്ന ക്രിയയിൽനിന്നുള്ള വ്യത്യാസം മലയാളത്തിലും നിലനിർത്തുന്നു.
- source_word: καθαρὸς ὅλος
  choice: പൂർണമായും ശുദ്ധനാണ്
  rationale: ὅλος സൂചിപ്പിക്കുന്ന സമ്പൂർണത നിലനിർത്തുന്നു. ‘ശുദ്ധൻ’ എന്നത് കഴുകലിന്റെ ദൃശ്യാർഥവും പ്രതീകാത്മകമായ ധാർമിക/ആത്മീയ സൂചനയും ഒരുപോലെ തുറന്നുവയ്ക്കുന്നു.
- source_word: καὶ ὑμεῖς καθαροί ἐστε
  choice: നിങ്ങളും ശുദ്ധരാണ്
  rationale: ബഹുവചന അഭിസംബോധനയും καθαρός എന്ന പദത്തിന്റെ ആവർത്തനവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἀλλ’ οὐχὶ πάντες
  choice: എന്നാൽ നിങ്ങളെല്ലാവരും അല്ല
  rationale: ശിഷ്യസംഘത്തെക്കുറിച്ചുള്ള പൊതുപ്രസ്താവനയ്ക്കുള്ളിലെ അപവാദം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: യേശു അവനോടു പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ historical present മലയാള ആഖ്യാനശൈലിക്കനുസരിച്ച് ഭൂതകാലത്തിൽ നൽകിയിരിക്കുന്നു; αὐτῷ എന്ന ഏകവചന പരാമർശം നിലനിർത്തുന്നു.
theological_decisions:
- issue: അക്ഷരാർഥത്തിലുള്ള കഴുകലും പ്രതീകാത്മകമായ ശുദ്ധിയും
  choice: ‘കുളിക്കുക,’ ‘കാലുകൾ കഴുകുക,’ ‘ശുദ്ധൻ’ എന്നീ പദങ്ങൾ വ്യാഖ്യാനപരമായ വിശദീകരണമില്ലാതെ നിലനിർത്തി.
  alternative: ‘ആത്മീയമായി ശുദ്ധൻ’ എന്നു വ്യക്തമാക്കി പരിഭാഷപ്പെടുത്തുക, അല്ലെങ്കിൽ λούω, νίπτω എന്നീ രണ്ടു ക്രിയകളും ഒരേ ‘കഴുകുക’ എന്ന പദത്തിൽ ലയിപ്പിക്കുക.
  rationale: വാക്യം അക്ഷരാർഥത്തിലും പ്രതീകാത്മകതലത്തിലും പ്രവർത്തിക്കുന്നു. ക്രിയാവ്യത്യാസവും ‘ശുദ്ധൻ’ എന്ന ആവർത്തനവും നിലനിർത്തുന്നത് പ്രത്യേക സിദ്ധാന്തവ്യാഖ്യാനം അടിച്ചേൽപ്പിക്കാതെ യോഹന്നാനിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം സംരക്ഷിക്കുന്നു.
- issue: Ὁ λελουμένος എന്ന പുല്ലിംഗ ഏകവചന participle-ന്റെ പൊതുവായ പ്രയോഗം
  choice: കുളിച്ചവന്
  alternative: കുളിച്ച പുരുഷന്
  rationale: ഗ്രീക്കിൽ വ്യാകരണപരമായി പുല്ലിംഗ ഏകവചനമാണെങ്കിലും ചൊല്ലിൽ പൊതുവായ വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. ‘കുളിച്ചവന്’ ഏകവചനം നിലനിർത്തിക്കൊണ്ട് അനാവശ്യമായ ജൈവലിംഗ നിർണ്ണയം ഒഴിവാക്കുന്നു.
- issue: കാലുകൾ കഴുകുന്നതിനെക്കുറിച്ചുള്ള പാഠഭേദം
  choice: SBLGNT മുഖ്യപാഠപ്രകാരം ‘കാലുകൾ കഴുകുകയല്ലാതെ’ മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തി, പാഠഭേദം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
  alternative: ഈ വാക്കുകൾ മുഖ്യവാചകത്തിൽനിന്ന് ഒഴിവാക്കുക.
  rationale: ലഭ്യമായ ഗ്രീക്ക് സ്രോതസ്സ് ഈ വാക്കുകൾ മുഖ്യപാഠമായി അച്ചടിക്കുന്നു; എന്നാൽ ചില പുരാതന സാക്ഷ്യങ്ങളിലെ ഒഴിവാക്കൽ വായനക്കാരനിൽനിന്ന് മറച്ചുവയ്ക്കരുത്.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യം. ‘അവനോടു’ എന്ന രൂപം അല്പം ഔപചാരികമായ തിരുവെഴുത്ത് ശൈലി നിലനിർത്തുമ്പോഴും സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്. വാക്യത്തിലെ കുളിക്കൽ/കഴുകൽ പദവ്യത്യാസവും ‘ശുദ്ധൻ’ എന്ന ഇരട്ട അർഥസാധ്യതയും സംരക്ഷിച്ചിട്ടുണ്ട്.
