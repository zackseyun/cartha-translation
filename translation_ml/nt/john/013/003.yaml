id: JHN.13.3
reference: John 13:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀εἰδὼς ὅτι πάντα ⸀ἔδωκεν αὐτῷ ὁ πατὴρ εἰς τὰς χεῖρας, καὶ ὅτι ἀπὸ θεοῦ ἐξῆλθεν καὶ πρὸς τὸν θεὸν ὑπάγει,
base_translation:
  language: en
  yaml_path: translation/nt/john/013/003.yaml
  text: Jesus[a], knowing that the Father had given all things into his hands, and that he had come from God and was going to God[b],
translation:
  language: ml
  text: യേശു, പിതാവ് സകലവും യേശുവിന്റെ കൈകളിൽ ഏൽപ്പിച്ചിരുന്നുവെന്നും, താൻ ദൈവത്തിൽനിന്ന് വന്നതാണെന്നും[a] ദൈവത്തിന്റെ അടുക്കലേക്കു പോകുകയാണെന്നും[b] അറിഞ്ഞുകൊണ്ട്,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദൈവത്തിൽനിന്ന് പുറപ്പെട്ടുവന്നതാണെന്നും.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ദൈവത്തിന്റെ അടുക്കലേക്കു തിരികെ പോകുകയാണെന്നും’; ഗ്രീക്കിൽ ലളിതമായി ‘ദൈവത്തിന്റെ അടുക്കലേക്കു പോകുകയാണ്’ എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰδὼς
  choice: അറിഞ്ഞുകൊണ്ട്
  rationale: തുടർന്നുവരുന്ന പ്രവൃത്തിയുടെ പശ്ചാത്തലവും പ്രേരകസാഹചര്യവും സൂചിപ്പിക്കുന്ന പങ്കാളിക്രിയയെ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: πάντα
  choice: സകലവും
  rationale: നപുംസകലിംഗ ബഹുവചനത്തിന്റെ സമഗ്രമായ വ്യാപ്തി മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ἔδωκεν
  choice: ഏല്പിച്ചിരിക്കുന്നു
  rationale: വെറും കൈമാറ്റത്തേക്കാൾ അധികാരവും ഉത്തരവാദിത്വവും ഏല്പിക്കുന്ന ആശയം സന്ദർഭത്തിൽ വ്യക്തമാക്കുകയും, മുൻപ് പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴുള്ള ഫലം സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: εἰς τὰς χεῖρας
  choice: തന്റെ കൈകളിൽ
  rationale: അധികാരത്തിന്റെയും നിയന്ത്രണത്തിന്റെയും മൂർത്തമായ ഗ്രീക്ക് രൂപകം മലയാളത്തിലും ഗ്രാഹ്യമായതിനാൽ നിലനിർത്തുന്നു.
- source_word: ὁ πατὴρ
  choice: പിതാവ്
  rationale: ഗ്രീക്കിലെ വിശേഷണപദസഹിതമായ സ്ഥാനപ്പേരിന്റെ യോഹന്നാനീയ പ്രാധാന്യം സംരക്ഷിക്കുന്നു; ‘തന്റെ പിതാവ്’ എന്ന് പാഠത്തിൽ ഇല്ലാത്ത ഉടമസ്ഥസർവനാമം ചേർക്കുന്നില്ല.
- source_word: ἀπὸ θεοῦ
  choice: ദൈവത്തിൽനിന്ന്
  rationale: ‘പിതാവിൽനിന്ന്’ എന്നാക്കി വ്യാഖ്യാനിക്കാതെ ഗ്രീക്കിലെ ‘ദൈവത്തിൽനിന്ന്’ എന്ന വാക്ക് കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: ἐξῆλθεν
  choice: വന്നതാണ്
  rationale: ഉത്ഭവത്തെയോ അയക്കപ്പെട്ടുവരവിനെയോ സൂചിപ്പിക്കുന്ന യോഹന്നാനീയ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘പുറപ്പെട്ടുവന്നു’ എന്ന കൂടുതൽ രൂപസാദൃശ്യമുള്ള സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: πρὸς τὸν θεὸν
  choice: ദൈവത്തിന്റെ അടുക്കലേക്ക്
  rationale: ദൈവത്തിലേക്കുള്ള ദിശയും ബന്ധപരമായ സൂക്ഷ്മതയും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: ὑπάγει
  choice: പോകുകയാണ്
  rationale: ആസന്നമായ പുറപ്പാടിനെ സൂചിപ്പിക്കുന്ന വർത്തമാനകാലഭാവം നിലനിർത്തുന്നു; പാഠത്തിൽ വ്യക്തമല്ലാത്ത ‘തിരികെ’ എന്ന ആശയം മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ἀπὸ θεοῦ ἐξῆλθεν എന്നതിലെ ക്രിസ്തുവിന്റെ ഉത്ഭവഭാഷ
  choice: താൻ ദൈവത്തിൽനിന്ന് വന്നതാണ്
  alternative: താൻ ദൈവത്തിൽനിന്ന് പുറപ്പെട്ടുവന്നതാണ്
  rationale: യേശുവിന്റെ ദൈവിക ഉത്ഭവത്തെയോ ദൗത്യത്തെയോ കുറിച്ചുള്ള യോഹന്നാനീയ പ്രസ്താവനയുടെ ഭാരം നിലനിർത്തുന്നു; എന്നാൽ വാക്യം വ്യക്തമാക്കാത്ത പിൽക്കാല സിദ്ധാന്തപരമായ വിശദീകരണങ്ങൾ ചേർക്കുന്നില്ല.
- issue: πρὸς τὸν θεὸν ὑπάγει എന്നതിലെ ലക്ഷ്യഭാഷ
  choice: ദൈവത്തിന്റെ അടുക്കലേക്കു പോകുകയാണ്
  alternative: ദൈവത്തിന്റെ അടുക്കലേക്കു തിരികെ പോകുകയാണ്
  rationale: സന്ദർഭത്തിൽ മടങ്ങിപ്പോകൽ ഉൾക്കൊള്ളാമെങ്കിലും ഈ ഉപവാക്യത്തിൽ ‘തിരികെ’ എന്ന പദം ഇല്ല. അതിനാൽ മുഖ്യവാചകം ഗ്രീക്കിന്റെ ലളിതമായ ലക്ഷ്യപ്രസ്താവന നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഈ വാക്യം അടുത്ത വാക്യത്തിലെ മുഖ്യപ്രവൃത്തിയിലേക്കു നീളുന്ന ആശ്രിതഘടനയായതിനാൽ അവസാനത്തിൽ അർധവിരാമസ്വഭാവമുള്ള കോമ നിലനിർത്തിയിരിക്കുന്നു. ‘കൈകളിൽ’ എന്ന രൂപകം ഉദ്ദേശപൂർവം സംരക്ഷിച്ചു.
