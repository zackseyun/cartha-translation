id: JHN.13.35
reference: John 13:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν τούτῳ γνώσονται πάντες ὅτι ἐμοὶ μαθηταί ἐστε, ἐὰν ἀγάπην ἔχητε ἐν ἀλλήλοις.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/035.yaml
  text: By this everyone will know that you are my disciples[b][a], if you have love for one another.
translation:
  language: ml
  text: ഇതിലൂടെ[a] എല്ലാവരും നിങ്ങൾ എന്റെ ശിഷ്യന്മാരാണെന്ന് അറിയും—നിങ്ങൾക്കു പരസ്പരം സ്നേഹമുണ്ടെങ്കിൽ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇതിൽ’; അല്ലെങ്കിൽ ‘ഈ മാർഗത്തിലൂടെ’.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘നിങ്ങൾ പരസ്പരം സ്നേഹം ഉള്ളവരായിരുന്നാൽ’; അതായത്, നിങ്ങൾ പരസ്പരം സ്നേഹിക്കുന്നുവെങ്കിൽ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: ഇതിലൂടെ
  rationale: തിരിച്ചറിയാനുള്ള അടയാളമോ തെളിവോ എന്ന ഉപകരണാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘ഇതിൽ’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: γνώσονται
  choice: അറിയും
  rationale: ഭാവികാലത്തിലുള്ള ‘അറിയുക/തിരിച്ചറിയുക’ എന്ന വിശാലമായ അർഥം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: πάντες
  choice: എല്ലാവരും
  rationale: ഗ്രീക്കിലെ പൊതുവായ ബഹുവചനത്തിന്റെ സർവവ്യാപകത ലിംഗപരമായ അനാവശ്യ പരിമിതിയില്ലാതെ സംരക്ഷിക്കുന്നു.
- source_word: ἐμοὶ μαθηταί ἐστε
  choice: നിങ്ങൾ എന്റെ ശിഷ്യന്മാരാണ്
  rationale: ദത്തിവിന്റെ ഉടമസ്ഥാർഥവും μαθηταί എന്ന പദത്തിലെ ഗുരു-ശിഷ്യബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐὰν
  choice: എങ്കിൽ
  rationale: ഗ്രീക്ക് വ്യവസ്ഥാവാചകത്തിന്റെ ശക്തി വ്യാഖ്യാനിച്ച് മാറ്റാതെ നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: ἀγάπην ἔχητε ἐν ἀλλήλοις
  choice: നിങ്ങൾക്കു പരസ്പരം സ്നേഹമുണ്ടെങ്കിൽ
  rationale: ‘ഒരുവർക്കിടയിൽ മറ്റൊരുവർക്കായി സ്നേഹം ഉണ്ടായിരിക്കുക’ എന്ന പരസ്പരബന്ധാർഥം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ἐὰν അവതരിപ്പിക്കുന്ന വ്യവസ്ഥയുടെ സ്വഭാവം
  choice: നിങ്ങൾക്കു പരസ്പരം സ്നേഹമുണ്ടെങ്കിൽ
  alternative: നിങ്ങൾക്കു പരസ്പരം സ്നേഹമുള്ളപ്പോൾ
  rationale: ശിഷ്യത്വം സമ്പാദിക്കാനുള്ള മാർഗമായി ഇതിനെ വ്യാഖ്യാനിക്കാതെ, ശിഷ്യത്വത്തെ തിരിച്ചറിയിക്കുന്ന വ്യവസ്ഥയോ തെളിവോ എന്ന നിലയിൽ ഗ്രീക്കിലെ ‘എങ്കിൽ’ സംരക്ഷിക്കുന്നു.
- issue: πάντες എന്ന പൊതുവായ പുരുഷലിംഗ ബഹുവചനം
  choice: എല്ലാവരും
  alternative: എല്ലാ മനുഷ്യരും
  rationale: പുരുഷന്മാരെ മാത്രം സൂചിപ്പിക്കാത്ത ഗ്രീക്ക് പൊതുപ്രയോഗത്തിന്റെ സർവജനീന അർഥം കൃത്യമായി നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ ആദ്യം വരുന്ന സൂചനാപദവും തുടർന്ന് വരുന്ന വ്യവസ്ഥയും ദീർഘരേഖയിലൂടെ ബന്ധിപ്പിച്ചിരിക്കുന്നു; ‘ശിഷ്യന്മാർ’ എന്ന സ്ഥാപിത ബൈബിൾപദം നിലനിർത്തി.
