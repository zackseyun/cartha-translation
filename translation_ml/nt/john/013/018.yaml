id: JHN.13.18
reference: John 13:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐ περὶ πάντων ὑμῶν λέγω· ἐγὼ οἶδα ⸀τίνας ἐξελεξάμην· ἀλλ’ ἵνα ἡ γραφὴ πληρωθῇ· Ὁ τρώγων ⸀μου τὸν ἄρτον ἐπῆρεν ἐπ’ ἐμὲ τὴν πτέρναν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/018.yaml
  text: 'I am not speaking about all of you[a]. I know whom I have chosen[c][b]. But this is so that the Scripture may be fulfilled: ‘The one who eats my bread has lifted up his heel against me.’'
translation:
  language: ml
  text: '“ഞാൻ പറയുന്നത് നിങ്ങളെല്ലാവരെയും കുറിച്ചല്ല.[a] ഞാൻ ആരെയൊക്കെയാണ് തിരഞ്ഞെടുത്തതെന്ന് എനിക്കറിയാം. എന്നാൽ ഇതു തിരുവെഴുത്ത് നിറവേറേണ്ടതിനാണ്: ‘എന്റെ അപ്പം തിന്നുന്നവൻ എനിക്കെതിരെ തന്റെ കുതികാൽ ഉയർത്തിയിരിക്കുന്നു.’[b][c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ ഔപചാരികമായി: “നിങ്ങളെല്ലാവരെയും സംബന്ധിച്ചല്ല ഞാൻ പറയുന്നത്.”'
    reason: lexical_alternative
  - marker: b
    text: സങ്കീർത്തനം 41:9-ൽനിന്നുള്ള ഉദ്ധരണി/സൂചന (മലയാളം ഉൾപ്പെടെയുള്ള ചില വാക്യക്രമങ്ങളിൽ 41:10).
    reason: cross_reference
  - marker: c
    text: 'അല്ലെങ്കിൽ: “എനിക്കെതിരെ തന്റെ കുതികാൽ പൊക്കിയിരിക്കുന്നു.” ശത്രുതയെയും വഞ്ചനയെയും സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ περὶ πάντων ὑμῶν λέγω
  choice: ഞാൻ പറയുന്നത് നിങ്ങളെല്ലാവരെയും കുറിച്ചല്ല
  rationale: περί എന്നതിന്റെ ‘കുറിച്ച്/സംബന്ധിച്ച്’ എന്ന അർഥവും നിഷേധത്തിന്റെ വ്യാപ്തിയും നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: οἶδα
  choice: എനിക്കറിയാം
  rationale: രൂപത്തിൽ perfect ആയിരുന്നാലും കൊയ്നേ ഗ്രീക്കിൽ വർത്തമാനാർഥത്തിൽ പ്രവർത്തിക്കുന്നതിനാൽ ‘എനിക്കറിയാം’ എന്നാണ് യോജിച്ചത്.
- source_word: τίνας ἐξελεξάμην
  choice: ഞാൻ ആരെയൊക്കെയാണ് തിരഞ്ഞെടുത്തതെന്ന്
  rationale: τίνας എന്ന ബഹുവചന വ്യക്തിവാചക കർമത്തിന്റെ ഭാവം ‘ആരെയൊക്കെ’ എന്നതിലൂടെ സൂക്ഷിക്കുകയും ἐκλέγομαι എന്നതിനെ നേരിട്ട് ‘തിരഞ്ഞെടുക്കുക’ എന്നു പരിഭാഷപ്പെടുത്തുകയും ചെയ്യുന്നു.
- source_word: ἀλλ’ ἵνα
  choice: എന്നാൽ ഇതു ... വേണ്ടതിനാണ്
  rationale: ഗ്രീക്കിൽ സൂചിതമായിരിക്കുന്ന മുഖ്യപ്രസ്താവന മലയാളത്തിൽ വായനാസൗകര്യത്തിനായി ‘ഇതു’ എന്നു വ്യക്തമാക്കുന്നു; ഉദ്ദേശ്യം/ഫലം എന്ന രണ്ടിനുമിടയിലെ സാധ്യത അനാവശ്യമായി കടുപ്പിക്കുന്നില്ല.
- source_word: ἡ γραφὴ πληρωθῇ
  choice: തിരുവെഴുത്ത് നിറവേറേണ്ടതിന്
  rationale: യോഹന്നാന്റെ പ്രയോഗത്തിൽ γραφή വിശുദ്ധ തിരുവെഴുത്തിനെ സൂചിപ്പിക്കുന്നു; πληρωθῇ എന്ന fulfillment ഭാഷ ‘നിറവേറുക’ എന്ന പരമ്പരാഗതവും വ്യക്തവുമായ പദത്തിൽ നിലനിർത്തുന്നു.
- source_word: Ὁ τρώγων μου τὸν ἄρτον
  choice: എന്റെ അപ്പം തിന്നുന്നവൻ
  rationale: സുബ്സ്റ്റാന്റീവൽ participle സ്വാഭാവികമായി ‘തിന്നുന്നവൻ’ എന്നും μου τὸν ἄρτον ‘എന്റെ അപ്പം’ എന്നും പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: ἐπῆρεν ἐπ’ ἐμὲ τὴν πτέρναν αὐτοῦ
  choice: എനിക്കെതിരെ തന്റെ കുതികാൽ ഉയർത്തിയിരിക്കുന്നു
  rationale: സങ്കീർത്തന ഉദ്ധരണിയിലെ കുതികാൽ എന്ന രൂപകം പരത്തിപ്പറയാതെ സംരക്ഷിക്കുന്നു; പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ പ്രസക്തി ‘ഉയർത്തിയിരിക്കുന്നു’ എന്നതിൽ പ്രകടമാണ്.
theological_decisions:
- issue: യേശു തിരഞ്ഞെടുത്തവരും വഞ്ചകനുമായുള്ള ബന്ധം
  choice: ἐξελεξάμην എന്നത് ‘തിരഞ്ഞെടുത്തു’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തി, തിരഞ്ഞെടുപ്പിന്റെ ദൈവശാസ്ത്രപരമായ വിഭാഗം നിർവചിക്കാതെ വിടുന്നു.
  alternative: ഇത് രക്ഷയ്ക്കായുള്ള തിരഞ്ഞെടുപ്പാണെന്നോ അപ്പൊസ്തലസ്ഥാനത്തേക്കുള്ള നിയമനം മാത്രമാണെന്നോ വാചകത്തിൽ വ്യക്തമാക്കുക.
  rationale: വാക്യം തന്നെ ‘തിരഞ്ഞെടുപ്പ്’ ഏതു ദൈവശാസ്ത്രപരമായ വിഭാഗമാണെന്ന് നിർവചിക്കുന്നില്ല. അതിനാൽ യൂദാസിനെക്കുറിച്ചുള്ള തിരഞ്ഞെടുപ്പ്, വിശ്വാസത്യാഗം തുടങ്ങിയ സഭാപാരമ്പര്യ തർക്കങ്ങൾ പരിഭാഷയിൽ തീർപ്പാക്കുന്നില്ല.
- issue: ἀλλ’ ἵναയും തിരുവെഴുത്തിന്റെ നിറവേറും
  choice: ‘എന്നാൽ ഇതു തിരുവെഴുത്ത് നിറവേറേണ്ടതിനാണ്’ എന്ന് പരിഭാഷപ്പെടുത്തി fulfillment പ്രസ്താവന നിലനിർത്തുന്നു.
  alternative: വഞ്ചന തിരുവെഴുത്തിനാൽ നിർബന്ധിതമായി സംഭവിച്ചതാണെന്ന് കാരണപരമായി വികസിപ്പിച്ചു പറയുക.
  rationale: ഗ്രീക്ക് തിരുവെഴുത്തിന്റെ നിറവേറിനെ പ്രസ്താവിക്കുന്നുണ്ടെങ്കിലും മനുഷ്യപ്രവൃത്തിയും ദൈവിക നിർണ്ണയവും തമ്മിലുള്ള ബന്ധത്തെക്കുറിച്ച് അധിക വിശദീകരണം നൽകുന്നില്ല; അതിനാൽ നിർണ്ണയവാദപരമായ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. ‘തിരുവെഴുത്ത്’, ‘നിറവേറുക’ എന്നീ പരിചിത ബൈബിൾപദങ്ങൾ നിലനിർത്തിയപ്പോൾ, വാക്യഘടന സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാക്കി. ഉദ്ധരണിയിലെ ‘കുതികാൽ ഉയർത്തുക’ എന്ന അപരിചിത രൂപകം മൂലപാഠത്തോടുള്ള വിശ്വസ്തതയ്ക്കായി നിലനിർത്തി അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
