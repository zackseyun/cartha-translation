revisions:
- from: ഇവ നിങ്ങൾ അറിയുന്നെങ്കിൽ, അവ അനുഷ്ഠിച്ചാൽ നിങ്ങൾ അനുഗൃഹീതരാണ്.[a]
  to: നിങ്ങൾ ഇവ അറിയുന്നുവെങ്കിൽ, അവ ചെയ്യുന്നുവെങ്കിൽ, നിങ്ങൾ അനുഗൃഹീതരാണ്.[a]
  rationale: The revision retains the Greek’s two explicit conditional clauses and plural demonstratives while using natural modern Malayalam. ‘ചെയ്യുന്നുവെങ്കിൽ’ renders the general conditional force of ποιῆτε without introducing ritual or completion nuances.
