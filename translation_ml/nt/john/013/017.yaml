  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ ταῦτα οἴδατε, μακάριοί ἐστε ἐὰν ποιῆτε αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/017.yaml
  text: If you know these things[a], you are blessed if you do them.
translation:
  language: ml
  text: നിങ്ങൾ ഇവ അറിയുന്നുവെങ്കിൽ, അവ ചെയ്യുന്നുവെങ്കിൽ, നിങ്ങൾ അനുഗൃഹീതരാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സന്തുഷ്ടർ’ അല്ലെങ്കിൽ ‘ഭാഗ്യവാന്മാർ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കുപദം വെറും സന്തോഷവികാരത്തെക്കാൾ അനുഗ്രഹിക്കപ്പെട്ട, അനുകൂലവും നന്മ നിറഞ്ഞതുമായ അവസ്ഥയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: എങ്കിൽ
  rationale: ഗ്രീക്കിലെ സോപാധിക ഘടന നേരിട്ട് നിലനിർത്തുന്നു; മലയാളത്തിൽ മുൻവാക്യത്തിലെ ക്രിയയോടു ചേർന്ന ‘അറിയുന്നെങ്കിൽ’ സ്വാഭാവികമാണ്.
- source_word: ταῦτα
  choice: ഇവ
  rationale: യേശുവിന്റെ തൊട്ടുമുമ്പുള്ള മാതൃകയെയും ഉപദേശത്തെയും സൂചിപ്പിക്കുന്ന നപുംസകലിംഗ ബഹുവചനം മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: οἴδατε
  choice: നിങ്ങൾ അറിയുന്നു
  rationale: οἶδα എന്ന ക്രിയയുടെ അറിവ്/ബോധ്യം എന്ന അടിസ്ഥാനാർഥം ‘അറിയുക’ നേരിട്ട് നൽകുന്നു; ‘മനസ്സിലാക്കുക’ എന്ന് കൂടുതൽ വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: μακάριοί
  choice: അനുഗൃഹീതർ
  rationale: വെറും മാനസിക സന്തോഷത്തേക്കാൾ ദൈവാനുകൂല്യവും നന്മ നിറഞ്ഞ അവസ്ഥയും സൂചിപ്പിക്കുന്ന μακάριος എന്ന പദത്തിന്റെ ബൈബിൾപരമായ ഭാരം നിലനിർത്തുന്നു.
- source_word: ἐστε
  choice: ആണ്
  rationale: വർത്തമാനകാലത്തിലെ ലളിതമായ സംയോജകക്രിയയെ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐὰν
  choice: എങ്കിൽ
  rationale: ποιῆτε എന്ന സാധ്യതാസൂചക ക്രിയയോടൊപ്പം വരുന്ന നിബന്ധനയെ ‘ചെയ്താൽ’ എന്ന മലയാള ഘടന സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ποιῆτε
  choice: അനുഷ്ഠിക്കുക
  rationale: ഇവിടെ ഉപദേശം പ്രവൃത്തിയിൽ കൊണ്ടുവരുക എന്ന സന്ദർഭാർഥം നൽകുന്നു; ‘പ്രവർത്തിക്കുക’ എന്നതിനെക്കാൾ ഈ കർമത്തിന് സ്വാഭാവികമാണ്, എന്നാൽ അർഥം അമിതമായി വികസിപ്പിക്കുന്നില്ല.
- source_word: αὐτά
  choice: അവ
  rationale: ταῦτα എന്ന ബഹുവചന മുൻപദത്തിലേക്ക് വ്യക്തമായി മടങ്ങിച്ചൂണ്ടുകയും അനാവശ്യ ആവർത്തനം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ശിഷ്യത്വത്തിന്റെ പശ്ചാത്തലത്തിൽ μακάριοι എന്നതിന്റെ പരിഭാഷ
  choice: അനുഗൃഹീതർ
  alternative: സന്തുഷ്ടർ; ഭാഗ്യവാന്മാർ
  rationale: അറിയുന്നതു മാത്രം അല്ല, യേശുവിന്റെ ഉപദേശം അനുഷ്ഠിക്കുന്നവരുടെ ദൈവാനുകൂല്യമുള്ള, നന്മ നിറഞ്ഞ അവസ്ഥയാണ് വാക്യം സൂചിപ്പിക്കുന്നത്. ‘അനുഗൃഹീതർ’ ഈ ദൈവശാസ്ത്രപരമായ ഭാരം നിലനിർത്തുന്നു; അതിനെ വെറും വികാരമോ യാദൃച്ഛിക ഭാഗ്യമോ ആക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ രണ്ട് നിബന്ധനകളും ബഹുവചന സൂചനകളും നിലനിർത്തിയിരിക്കുന്നു; പദക്രമം മലയാളത്തിന്റെ സ്വാഭാവിക ഒഴുക്കിനനുസരിച്ച് ക്രമപ്പെടുത്തി.
