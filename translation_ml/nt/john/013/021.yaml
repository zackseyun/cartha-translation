id: JHN.13.21
reference: John 13:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ταῦτα εἰπὼν ⸀ὁ Ἰησοῦς ἐταράχθη τῷ πνεύματι καὶ ἐμαρτύρησεν καὶ εἶπεν· Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι εἷς ἐξ ὑμῶν παραδώσει με.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/021.yaml
  text: After saying these things[a], Jesus was troubled in spirit, and testified and said, “Truly, truly, I say to you, one of you will betray me.”
translation:
  language: ml
  text: 'ഇവ പറഞ്ഞശേഷം യേശു ആത്മാവിൽ കലങ്ങി; സാക്ഷ്യപ്പെടുത്തി ഇങ്ങനെ പറഞ്ഞു: “സത്യമായി, സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: നിങ്ങളിൽ ഒരാൾ എന്നെ ഒറ്റിക്കൊടുക്കും[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, കൂടുതൽ അക്ഷരാർഥത്തിൽ, “എന്നെ ഏൽപ്പിച്ചുകൊടുക്കും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα εἰπὼν
  choice: ഇതു പറഞ്ഞശേഷം
  rationale: Aorist participle സമയക്രമം സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള ഉപവാക്യമായി പരിഭാഷപ്പെടുത്തി; മുൻവചനങ്ങളെയാണ് ‘ഇതു’ സൂചിപ്പിക്കുന്നത്.
- source_word: ἐταράχθη τῷ πνεύματι
  choice: ആത്മാവിൽ കലങ്ങി
  rationale: അകത്തെ ആഴമുള്ള അസ്വസ്ഥതയെ അധിക തീവ്രത ചേർക്കാതെ പ്രകടമാക്കുന്നു; τῷ πνεύματι എന്നതിന്റെ sphere/respect അർഥവും നിലനിർത്തുന്നു.
- source_word: ἐμαρτύρησεν
  choice: സാക്ഷ്യപ്പെടുത്തി
  rationale: യോഹന്നാന്റെ രചനയിൽ ആവർത്തിക്കുന്ന μαρτυρέω എന്ന സാക്ഷ്യപദാവലി നിലനിർത്തുകയും പ്രസ്താവനയുടെ ഗൗരവം അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: Ἀμὴν ἀμὴν
  choice: സത്യമായി, സത്യമായി
  rationale: യോഹന്നാനിലെ ഊന്നലുള്ള ഇരട്ടപ്രയോഗം ആവർത്തനത്തോടെതന്നെ സാധാരണ വായനക്കാർക്ക് അർഥവത്തായി നൽകുന്നു.
- source_word: λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: λέγω എന്നതിന്റെ നേരിട്ടുള്ളതും ഗൗരവമുള്ളതുമായ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ സൂക്ഷിക്കുന്നു.
- source_word: εἷς ἐξ ὑμῶν
  choice: നിങ്ങളിൽ ഒരാൾ
  rationale: Partitive expression-ന്റെ സ്വാഭാവിക മലയാളരൂപം; അടുത്ത ശിഷ്യവൃത്തത്തിൽ നിന്നുള്ള ഒരാളെന്ന ഞെട്ടിക്കുന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: παραδώσει με
  choice: എന്നെ ഒറ്റിക്കൊടുക്കും
  rationale: ഈ സന്ദർഭത്തിലെ വഞ്ചനാപരമായ ഏല്പിച്ചുകൊടുക്കലിനെ മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു; പദത്തിന്റെ കൂടുതൽ അക്ഷരാർഥപരമായ രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ ആന്തരിക കലക്കം
  choice: ആത്മാവിൽ കലങ്ങി
  alternative: തന്റെ ആത്മാവിൽ കലങ്ങി; മനസ്സിൽ അതിയായി അസ്വസ്ഥനായി
  rationale: യേശുവിന്റെ യഥാർഥ ആന്തരിക വ്യാകുലതയെ ലഘൂകരിക്കാതെയും ഗ്രീക്കിൽ ഇല്ലാത്ത തീവ്രതയോ വ്യാഖ്യാനമോ ചേർക്കാതെയും അവതരിപ്പിക്കുന്നു.
- issue: വഞ്ചനയുടെ പ്രവചനത്തിൽ παραδίδωμι എന്ന പദം
  choice: ഒറ്റിക്കൊടുക്കും
  alternative: ഏല്പിച്ചുകൊടുക്കും
  rationale: തൊട്ടടുത്ത സന്ദർഭത്തിൽ ശിഷ്യരിലൊരാളുടെ വഞ്ചനയാണ് ഉദ്ദേശിക്കുന്നത്; എങ്കിലും ‘കൈമാറുക/ഏല്പിച്ചുകൊടുക്കുക’ എന്ന വിശാലമായ പദാർഥം അടിക്കുറിപ്പിലൂടെ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. യോഹന്നാന്റെ സാക്ഷ്യപദാവലിയും ‘സത്യമായി, സത്യമായി’ എന്ന ആവർത്തനവും നിലനിർത്തി. അടിക്കുറിപ്പ് സൂചകം അതു വിശദീകരിക്കുന്ന ‘ഒറ്റിക്കൊടുക്കും’ എന്ന പദത്തോടു ചേർത്തിരിക്കുന്നു.
