source:
  edition: SBLGNT
  text: καὶ μετὰ τὸ ψωμίον τότε εἰσῆλθεν εἰς ἐκεῖνον ὁ Σατανᾶς. λέγει οὖν αὐτῷ ⸀ὁ Ἰησοῦς· Ὃ ποιεῖς ποίησον τάχιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/027.yaml
  text: And after the piece of bread[a], then Satan entered into him. So Jesus said to him, “What you are doing[b], do more quickly.”
translation:
  language: ml
  text: 'ആ അപ്പക്കഷണത്തിനു ശേഷം, അപ്പോൾ സാത്താൻ അവനിൽ പ്രവേശിച്ചു. അതുകൊണ്ട് യേശു അവനോടു പറഞ്ഞു: “നീ ചെയ്യുന്നത് കൂടുതൽ വേഗത്തിൽ[a] ചെയ്യുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വേഗത്തിൽ.” ഗ്രീക്കിലെ τάχιον താരതമ്യരൂപമായതിനാൽ മുഖ്യപാഠത്തിൽ “കൂടുതൽ വേഗത്തിൽ” എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ψωμίον
  choice: അപ്പക്കഷണം
  rationale: ചെറിയൊരു ഭക്ഷണക്കഷണം എന്ന അർഥമുള്ള പദം ഈ ഭക്ഷണസന്ദർഭത്തിൽ മുക്കിക്കൊടുത്ത അപ്പക്കഷണത്തെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവും ദൃശ്യവുമായ പ്രയോഗമാണിത്.
- source_word: εἰσῆλθεν εἰς ἐκεῖνον
  choice: അവനിൽ പ്രവേശിച്ചു
  rationale: εἰσέρχομαι + εἰς എന്ന നേരിട്ടുള്ള പ്രയോഗത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; ‘സ്വാധീനിച്ചു’ എന്നാക്കി മൃദൂകരിക്കുകയോ അതിനപ്പുറം വ്യാഖ്യാനിക്കുകയോ ചെയ്യുന്നില്ല.
- source_word: ὁ Σατανᾶς
  choice: സാത്താൻ
  rationale: പുതിയനിയമത്തിലെ ഈ പേരിന്റെ മലയാളത്തിൽ സ്ഥാപിതമായ രൂപം ഉപയോഗിക്കുന്നു.
- source_word: λέγει οὖν αὐτῷ ὁ Ἰησοῦς
  choice: അതിനാൽ യേശു അവനോട് പറഞ്ഞു
  rationale: οὖν-ന്റെ നിഗമനാത്മക ബന്ധം ‘അതിനാൽ’ കൊണ്ട് സൂചിപ്പിക്കുന്നു. യോഹന്നാന്റെ ചരിത്രവർത്തമാനകാലത്തെ സ്വാഭാവിക മലയാള ആഖ്യാനത്തിനായി ഭൂതകാലത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: Ὃ ποιεῖς
  choice: നീ ചെയ്യുന്നത്
  rationale: വർത്തമാനകാലത്തിന്റെ ഉടനടിയുള്ളതും പുരോഗമിക്കുന്നതുമായ ഭാവം നിലനിർത്തുന്നു; ‘ചെയ്യാൻ പോകുന്നത്’ എന്ന വ്യാഖ്യാനപരമായ വികസനം ഒഴിവാക്കുന്നു.
- source_word: ποίησον
  choice: ചെയ്യുക
  rationale: ആജ്ഞയുടെ സംക്ഷിപ്തതയും നിർണായകതയും ലളിതമായ ക്രിയയിലൂടെ സംരക്ഷിക്കുന്നു.
- source_word: τάχιον
  choice: കൂടുതൽ വേഗത്തിൽ
  rationale: ഗ്രീക്കിലെ താരതമ്യരൂപം നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; സാധാരണ മലയാളത്തിൽ ‘വേഗത്തിൽ’ എന്നു മിനുക്കാനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: യൂദാസിനോടുള്ള സാത്താന്റെ പ്രവർത്തനത്തിന്റെ സ്വഭാവം
  choice: ‘സാത്താൻ അവനിൽ പ്രവേശിച്ചു’ എന്ന നേരിട്ടുള്ള ഭാഷ നിലനിർത്തി.
  alternative: ‘സാത്താൻ അവനെ നിയന്ത്രണത്തിലാക്കി’ അല്ലെങ്കിൽ ‘യൂദാസ് സാത്താനു വഴങ്ങി.’
  rationale: വാക്യം പറയുന്ന വ്യക്തിപരമായ സാത്താനിക പ്രവേശനം മൃദൂകരിക്കുന്നില്ല; അതേസമയം വാക്യം വ്യക്തമാക്കാത്ത പൂർണമായ ആവേശബാധയെയോ നിയന്ത്രണത്തെയോ കുറിച്ചുള്ള സിദ്ധാന്തം കൂട്ടിച്ചേർക്കുന്നുമില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘അപ്പക്കഷണം’, ‘അവനിൽ പ്രവേശിച്ചു’ എന്നീ പ്രയോഗങ്ങൾ മൂലപാഠത്തിന്റെ ദൃശ്യതയും ശക്തിയും നിലനിർത്തുന്നു. താരതമ്യരൂപത്തിന്റെ മലയാളം അല്പം അടയാളപ്പെടുത്തിയതായി തോന്നാമെങ്കിലും ഗ്രീക്ക് രൂപം സംരക്ഷിക്കാൻ മുഖ്യപാഠത്തിൽ വെച്ചിരിക്കുന്നു.
