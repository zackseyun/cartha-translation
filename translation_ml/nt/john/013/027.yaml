revisions:
- from: 'അവൻ ആ അപ്പക്കഷണം സ്വീകരിച്ചതിനുശേഷം, അപ്പോൾ സാത്താൻ അവനിൽ പ്രവേശിച്ചു. അതിനാൽ യേശു അവനോട് പറഞ്ഞു: “നീ ചെയ്യുന്നത് കൂടുതൽ വേഗത്തിൽ ചെയ്യുക.”[a]'
  to: 'ആ അപ്പക്കഷണത്തിനു ശേഷം, അപ്പോൾ സാത്താൻ അവനിൽ പ്രവേശിച്ചു. അതുകൊണ്ട് യേശു അവനോടു പറഞ്ഞു: “നീ ചെയ്യുന്നത് കൂടുതൽ വേഗത്തിൽ[a] ചെയ്യുക.”'
  rationale: The revision removes the interpretive specification that Judas received the bread, preserving the Greek’s concise and contextually elliptical wording. It also moves the lexical-note anchor to the comparative phrase. No theological expansion or softening has been introduced.
