id: JHN.13.31
reference: John 13:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὅτε ⸀οὖν ἐξῆλθεν ⸀λέγει Ἰησοῦς· Νῦν ἐδοξάσθη ὁ υἱὸς τοῦ ἀνθρώπου, καὶ ὁ θεὸς ἐδοξάσθη ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/031.yaml
  text: So when he had gone out[a], Jesus said, “Now the Son of Man has been glorified, and God has been glorified in him.”
translation:
  language: ml
  text: 'അതുകൊണ്ട്, അവൻ പുറത്തുപോയപ്പോൾ യേശു പറഞ്ഞു: “ഇപ്പോൾ മനുഷ്യപുത്രൻ മഹത്ത്വീകരിക്കപ്പെട്ടിരിക്കുന്നു; ദൈവവും അവനിൽ മഹത്ത്വീകരിക്കപ്പെട്ടിരിക്കുന്നു[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അവനിലൂടെ.” ദൈവം പുത്രനിൽ മഹത്ത്വീകരിക്കപ്പെട്ടു എന്നോ, പുത്രനിലൂടെ മഹത്ത്വീകരിക്കപ്പെട്ടു എന്നോ ഗ്രീക്ക് പ്രയോഗം മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅτε οὖν
  choice: അവൻ … പോയപ്പോൾ
  rationale: ὅτε സൂചിപ്പിക്കുന്ന സമയബന്ധം ‘പോയപ്പോൾ’ എന്ന പ്രയോഗത്തിൽ സ്വാഭാവികമായി വരുന്നു. οὖν നൽകുന്ന കഥാപുരോഗതി മലയാളത്തിലെ വാക്യക്രമത്തിലും സന്ദർഭബന്ധത്തിലും പ്രതിഫലിക്കുന്നതിനാൽ പ്രത്യേകം ‘അതിനാൽ’ ചേർത്ത് ഭാരം കൂട്ടിയില്ല.
- source_word: ἐξῆλθεν
  choice: പുറത്തുപോയപ്പോൾ
  rationale: ἐξέρχομαι എന്ന ക്രിയയുടെ പുറത്തേക്കുള്ള ചലനം നിലനിർത്തുകയും മുൻസന്ദർഭത്തിലെ യൂദാസിന്റെ പുറപ്പെടലുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: λέγει
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനകാലത്തെ ആധുനിക മലയാളത്തിലെ സ്വാഭാവികമായ ഭൂതകാല ആഖ്യാനരീതിയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: Νῦν
  choice: ഇപ്പോൾ
  rationale: യൂദാസ് പുറത്തുപോയതോടെ ആരംഭിച്ച നിർണായക നിമിഷത്തെ സൂചിപ്പിക്കുന്ന νῦν എന്ന പദത്തിന്റെ കാലികവും പ്രഭാഷണപരവുമായ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: ἐδοξάσθη
  choice: മഹത്ത്വീകരിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: ദൈവിക മഹത്ത്വപ്രാപ്തിയെ സൂചിപ്പിക്കുന്ന δοξάζωയുടെ നിഷ്ക്രിയരൂപം നിലനിർത്തുന്നു. ഗ്രീക്ക് ഏഓറിസ്റ്റിന്റെ സന്ദർഭപരമായ പൂർത്തീകരണവും ഇപ്പോഴത്തെ പ്രസക്തിയും മലയാളത്തിലെ ‘പ്പെട്ടിരിക്കുന്നു’ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: യേശുവിന്റെ സ്ഥാപിതമായ സ്വയംവിശേഷണവും ദാനീയേൽ 7-നോടുള്ള അന്തർപാഠബന്ധവും നിലനിർത്തുന്ന പരിചിതമായ മലയാളരൂപം.
- source_word: ὁ θεὸς
  choice: ദൈവം
  rationale: θεός എന്ന പദത്തിന്റെ നേരിട്ടുള്ള, സ്വാഭാവികമായ മലയാളപരിഭാഷ.
- source_word: ἐν αὐτῷ
  choice: അവനിൽ
  rationale: ἐν എന്നതിന്റെ ഏറ്റവും നേരിട്ടുള്ള ബന്ധാത്മക/സ്ഥാനാത്മക അർഥം സംരക്ഷിക്കുന്നു; ഉപകരണാർഥമായ ‘അവനിലൂടെ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ മഹത്ത്വീകരണപ്രസ്താവനയുടെ വ്യാപ്തി
  choice: രണ്ട് നിഷ്ക്രിയക്രിയകളും മഹത്ത്വീകരണം ഇപ്പോൾ സംഭവിച്ച യാഥാർഥ്യമായി നേരിട്ട് പരിഭാഷപ്പെടുത്തി; അത് ക്രൂശുമരണം, പുനരുത്ഥാനം, ഉയർത്തപ്പെടൽ എന്നിവയിൽ ഏതെങ്കിലുമൊന്നിൽ മാത്രം ഒതുക്കിയില്ല.
  alternative: ഇത് ക്രൂശുമരണത്തെ മാത്രം അല്ലെങ്കിൽ പുനരുത്ഥാനത്തെയും ഉയർത്തപ്പെടലിനെയും മാത്രം സൂചിപ്പിക്കുന്നതായി വ്യക്തമാക്കുക.
  rationale: യോഹന്നാന്റെ സുവിശേഷത്തിൽ യേശുവിന്റെ മഹത്ത്വീകരണം അവന്റെ മരണം, പുനരുത്ഥാനം, പിതാവിങ്കലേക്കുള്ള മടങ്ങിപ്പോക്ക് എന്നിവ ഉൾക്കൊള്ളുന്ന ഏകീകൃത യാഥാർഥ്യമായി പ്രവർത്തിക്കുന്നു. മൂലവാക്യം തന്നെ നൽകാത്ത ചുരുക്കിയ വ്യാഖ്യാനം പരിഭാഷയിൽ ചേർത്തിട്ടില്ല.
- issue: ἐν αὐτῷ എന്നതിന്റെ അർഥം
  choice: അവനിൽ
  alternative: അവനിലൂടെ
  rationale: ഈ പ്രയോഗം ബന്ധാത്മകമായോ ഉപകരണാർഥത്തിലോ ഗ്രഹിക്കാം. മുഖ്യപാഠത്തിൽ നേരിട്ടുള്ള രൂപം നിലനിർത്തുകയും മറ്റൊരു സാധുവായ ധാരണ അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘മനുഷ്യപുത്രൻ’, ‘മഹത്ത്വീകരിക്കപ്പെട്ടിരിക്കുന്നു’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ അന്തർപാഠവും ദൈവശാസ്ത്രപരമായ സാന്ദ്രതയും നിലനിർത്തുന്നതിനായി ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് ചൂണ്ടിക്കാണിക്കുന്ന [a] മുഖ്യപാഠത്തിലെ ‘അവനിൽ’ എന്ന വാക്കിനോടാണ് ചേർത്തിരിക്കുന്നത്.
