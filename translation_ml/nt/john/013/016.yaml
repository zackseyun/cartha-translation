source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, οὐκ ἔστιν δοῦλος μείζων τοῦ κυρίου αὐτοῦ οὐδὲ ἀπόστολος μείζων τοῦ πέμψαντος αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/016.yaml
  text: Truly[a], truly, I say to you, a servant is not greater than his master[c][b], nor is an apostle greater than the one who sent him.
translation:
  language: ml
  text: '“സത്യമായി, സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: ഒരു അടിമ[a] തന്റെ യജമാനനെക്കാൾ[b] വലിയവനല്ല; ഒരു അപ്പൊസ്തലൻ[c] അവനെ അയച്ചവനെക്കാൾ വലിയവനുമല്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അടിമ’ എന്നതിന് ‘ദാസൻ’ എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്ക് പദം യജമാനന്റെ അധികാരത്തിൻ കീഴിലുള്ള ഒരാളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘യജമാനൻ’ എന്നതിന് ‘കർത്താവ്’ എന്നും പരിഭാഷപ്പെടുത്താം; ഇവിടെ അടിമ–യജമാനൻ ബന്ധത്തിന്റെ സാമൂഹിക അർഥമാണ് മുൻനിൽക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: ‘അപ്പൊസ്തലൻ’ എന്നതിന് ‘ദൂതൻ’ അല്ലെങ്കിൽ ‘അയയ്ക്കപ്പെട്ട പ്രതിനിധി’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: സത്യമായി, സത്യമായി
  rationale: യോഹന്നാനിലെ ഗൗരവപൂർണമായ ഉറപ്പിക്കൽ സൂത്രത്തിന്റെ ആവർത്തനവും ഊന്നലും സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: ഗ്രീക്കിലെ നേരിട്ടുള്ള വാക്യഘടനയും വർത്തമാനകാല പ്രസ്താവനാശൈലിയും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: δοῦλος
  choice: അടിമ
  rationale: യജമാനന്റെ അധികാരത്തിൻ കീഴിലുള്ള ബന്ധിത സാമൂഹികനില ഇവിടെ താരതമ്യത്തിന്റെ കേന്ദ്രമായതിനാൽ, ‘ദാസൻ’ എന്നതിനെക്കാൾ ശക്തമായ ഗ്രീക്ക് അർഥം ‘അടിമ’ വ്യക്തമാക്കുന്നു.
- source_word: μείζων
  choice: വലിയവൻ
  rationale: പദവിയിലോ അധികാരത്തിലോ ഉള്ള മേന്മയെ സൂചിപ്പിക്കുന്ന താരതമ്യം ഇരു ഉപവാക്യങ്ങളിലും വിശാലമായി നിലനിർത്തുന്നു.
- source_word: κύριος
  choice: യജമാനൻ
  rationale: അടിമ–യജമാനൻ എന്ന സാമൂഹികബന്ധമാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്; ഇവിടെ നേരിട്ടുള്ള ദൈവിക സ്ഥാനപ്പേരായി വായിക്കേണ്ടതില്ല.
- source_word: ἀπόστολος
  choice: അയയ്ക്കപ്പെട്ട ഒരു ദൂതൻ
  rationale: ഈ സന്ദർഭത്തിൽ പദത്തിന്റെ അടിസ്ഥാനമായ നിയോഗിക്കപ്പെട്ട സന്ദേശവാഹകൻ എന്ന അർഥം വ്യക്തമാക്കുകയും തുടർന്നുള്ള ‘അയച്ചവൻ’ എന്ന പ്രയോഗവുമായി ബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: τοῦ πέμψαντος αὐτόν
  choice: തന്നെ അയച്ചവൻ
  rationale: ഗ്രീക്കിലെ കർത്തൃബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമായി അവതരിപ്പിക്കുന്നു; ‘തന്നെ’ ദൂതനെയാണ് അയച്ചത് എന്നു സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: κύριος എന്ന പദം സ്ഥാനപ്പേരായോ സാമൂഹികബന്ധപദമായോ പരിഭാഷപ്പെടുത്തൽ
  choice: യജമാനൻ
  alternative: കർത്താവ്
  rationale: വാക്യത്തിലെ സമാന്തരഘടന അടിമ/യജമാനൻ, ദൂതൻ/അയച്ചവൻ എന്നീ അധികാരബന്ധങ്ങളാണ് താരതമ്യം ചെയ്യുന്നത്. അതിനാൽ ‘യജമാനൻ’ സന്ദർഭാർഥം സംരക്ഷിക്കുകയും അനാവശ്യമായി ക്രിസ്തുശാസ്ത്രപരമായ സ്ഥാനപ്പേര് ഇറക്കുമതി ചെയ്യാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: ἀπόστολος സാങ്കേതിക സഭാപദമായോ പൊതുവായ നിയോഗിതദൂതനായോ പരിഭാഷപ്പെടുത്തൽ
  choice: അയയ്ക്കപ്പെട്ട ഒരു ദൂതൻ
  alternative: അപ്പൊസ്തലൻ
  rationale: ‘അയച്ചവൻ’ എന്ന ഉടൻ വരുന്ന സമാന്തരപ്രയോഗം പൊതുവായ അയയ്ക്കപ്പെട്ട പ്രതിനിധി എന്ന അർഥത്തെ മുന്നിൽ കൊണ്ടുവരുന്നു. എങ്കിലും സാങ്കേതിക വായനയുടെ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ആവർത്തനവും രണ്ടു താരതമ്യവാക്യങ്ങളുടെ സമാന്തരതയും സംരക്ഷിച്ചു. അപരിചിതമായ സഭാപദം മുഖ്യവാചകത്തിൽ നിർബന്ധിക്കാതെ അതിന്റെ സാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
