id: JHN.13.19
reference: John 13:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπ’ ἄρτι λέγω ὑμῖν πρὸ τοῦ γενέσθαι, ἵνα ⸂πιστεύσητε ὅταν γένηται⸃ ὅτι ἐγώ εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/019.yaml
  text: From now on I am telling you before it happens[a], so that when it does happen, you may believe that I am he.
translation:
  language: ml
  text: ഇനി മുതൽ, അത് സംഭവിക്കുന്നതിനുമുമ്പ് ഞാൻ നിങ്ങളോടു പറയുന്നു; അത് സംഭവിക്കുമ്പോൾ, “ഞാൻ ആകുന്നു” എന്നു നിങ്ങൾ വിശ്വസിക്കേണ്ടതിനായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπ’ ἄρτι
  choice: ഇനി മുതൽ
  rationale: ഇപ്പോഴത്തെ സമയം മുതൽ മുന്നോട്ടുള്ള കാലത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: വർത്തമാനകാലവും നേരിട്ടുള്ള അഭിസംബോധനയും ലളിതവും മാന്യവുമായി നിലനിർത്തുന്നു.
- source_word: πρὸ τοῦ γενέσθαι
  choice: സംഭവിക്കുന്നതിനുമുമ്പേ
  rationale: πρόയോടുകൂടിയ articular infinitive സൂചിപ്പിക്കുന്ന മുൻകാലബന്ധം വ്യക്തമാക്കുന്നു; സംഭവം ഗ്രീക്കിലെപ്പോലെ നിർദിഷ്ടമാക്കാതെ വിടുന്നു.
- source_word: ἵνα
  choice: വിശ്വസിക്കേണ്ടതിനാണ്
  rationale: ഉദ്ദേശ്യാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: πιστεύσητε
  choice: നിങ്ങൾ വിശ്വസിക്കേണ്ടതിനാണ്
  rationale: πιστεύω എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം നിലനിർത്തുകയും ingressive ഭാവം അനാവശ്യമായി ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ὅταν γένηται
  choice: അതു സംഭവിക്കുമ്പോൾ
  rationale: ഭാവിയിൽ സംഭവിക്കാനുള്ള കാര്യത്തെ സൂചിപ്പിക്കുന്ന ὅταν + subjunctive ഘടനയെ വ്യക്തമായി പകരുന്നു.
- source_word: ὅτι ἐγώ εἰμι
  choice: ഞാൻ ആകുന്നു
  rationale: ഗ്രീക്കിൽ വ്യക്തമായ പൂരകം ഇല്ലാത്ത absolute expression അതേ തുറന്ന നിലയിൽ സൂക്ഷിക്കുന്നു; യോഹന്നാനിലും യെശയ്യാവിലും കാണുന്ന ദൈവിക സ്വയംതിരിച്ചറിയൽ ഭാഷയുടെ സാധ്യത മായ്ച്ചുകളയുന്നില്ല.
theological_decisions:
- issue: യോഹന്നാനിലെ ἐγώ εἰμι എന്ന absolute expression-ന്റെ ദൈവിക സ്വയംതിരിച്ചറിയൽ സൂചന
  choice: ഞാൻ ആകുന്നു
  alternative: ഞാൻ തന്നെയാണ്
  rationale: മൂലഗ്രീക്കിൽ പൂരകം ഇല്ല. ‘ഞാൻ തന്നെയാണ്’ സന്ദർഭത്തിലെ സാധാരണ സ്വയംതിരിച്ചറിയൽ കൂടുതൽ സ്വാഭാവികമാക്കുമെങ്കിലും, ‘ഞാൻ ആകുന്നു’ മൂലത്തിന്റെ അസാധാരണതയും യെശയ്യാവിലേക്കുള്ള സാധ്യതയുള്ള പ്രതിധ്വനിയും സംരക്ഷിക്കുന്നു; അടിക്കുറിപ്പ് മറ്റൊരു വായന നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. വാക്യത്തിന്റെ പ്രവചനാത്മക ഊന്നലും ἐγώ εἰμι എന്ന പ്രയോഗത്തിന്റെ യഥാർഥ അർഥതുറപ്പും ദൈവശാസ്ത്രപരമായ സംഘർഷവും സംരക്ഷിച്ചിരിക്കുന്നു.
