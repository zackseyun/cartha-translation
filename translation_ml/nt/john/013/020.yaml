revisions:
- from: '“സത്യം, സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: ഞാൻ അയയ്ക്കുന്ന ആരെയും സ്വീകരിക്കുന്നവൻ[a] എന്നെ സ്വീകരിക്കുന്നു; എന്നെ സ്വീകരിക്കുന്നവൻ എന്നെ അയച്ചവനെ[b] സ്വീകരിക്കുന്നു.”'
  to: '“സത്യം സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: ഞാൻ അയയ്ക്കുന്ന ആരെയെങ്കിലും സ്വീകരിക്കുന്നയാൾ എന്നെ സ്വീകരിക്കുന്നു; എന്നെ സ്വീകരിക്കുന്നയാൾ എന്നെ അയച്ചവനെ സ്വീകരിക്കുന്നു.”'
  rationale: The revision corrects the Malayalam rendering of the doubled introductory affirmation, retains the source's indefinite and generic force, and uses inclusive modern standard Malayalam. The repeated ‘സ്വീകരിക്കുന്നു’ and the verse's representative chain remain intact. Footnote anchors a and b are preserved at their corresponding expressions.
