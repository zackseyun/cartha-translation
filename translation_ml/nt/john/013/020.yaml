id: JHN.13.20
reference: John 13:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ λαμβάνων ⸀ἄν τινα πέμψω ἐμὲ λαμβάνει, ὁ δὲ ἐμὲ λαμβάνων λαμβάνει τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/020.yaml
  text: Truly[a], truly, I say to you, whoever receives anyone I send receives me[b], and whoever receives me receives the one who sent me.
translation:
  language: ml
  text: '“സത്യം സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: ഞാൻ അയയ്ക്കുന്ന ആരെയെങ്കിലും സ്വീകരിക്കുന്നയാൾ എന്നെ സ്വീകരിക്കുന്നു; എന്നെ സ്വീകരിക്കുന്നയാൾ എന്നെ അയച്ചവനെ സ്വീകരിക്കുന്നു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: സത്യം, സത്യമായി
  rationale: യോഹന്നാനിലെ ഇരട്ട ഊന്നൽ നിലനിർത്തിക്കൊണ്ട് സാധാരണ മലയാളവായനക്കാർക്ക് സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രാരംഭപ്രയോഗം നൽകുന്നു.
- source_word: λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാല ക്രിയയും ബഹുവചന ദാതൃസർവനാമവും നേരിട്ട്, യോഹന്നാന്റെ പ്രഭാഷണശൈലി നിലനിർത്തി അവതരിപ്പിക്കുന്നു.
- source_word: ὁ λαμβάνων
  choice: സ്വീകരിക്കുന്നവൻ
  rationale: ലിംഗപരമായി പരിമിതമല്ലാത്ത പൊതുവായ അർഥമാണ് ഇവിടെ കർത്തൃവാചക വർത്തമാനകാല കൃദന്തത്തിനുള്ളത്; മലയാളത്തിൽ ‘സ്വീകരിക്കുന്നവൻ’ പ്രതിനിധിപരമായ ആ പൊതുവായ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἄν τινα πέμψω
  choice: ഞാൻ അയയ്ക്കുന്ന ആരെയും
  rationale: ἄν, അനിശ്ചിതസർവനാമം, വിധിലിംഗക്രിയ എന്നിവ ചേർന്ന് യേശു അയച്ചേക്കാവുന്ന ഏതൊരു വ്യക്തിയെയും സൂചിപ്പിക്കുന്നു. ഈ പരിധി മലയാളത്തിൽ ‘ആരെയും’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: λαμβάνει
  choice: സ്വീകരിക്കുന്നു
  rationale: ഒരു വ്യക്തിയെ സ്വീകരിക്കുക/അംഗീകരിക്കുക എന്ന അർഥം നൽകുകയും വാക്യത്തിലുടനീളമുള്ള ആവർത്തനം സംരക്ഷിക്കുകയും ചെയ്യുന്നു; ‘സ്വാഗതം ചെയ്യുന്നു’ എന്നു പറഞ്ഞാൽ ആതിഥ്യമെന്ന അർഥത്തിലേക്ക് അനാവശ്യമായി ചുരുങ്ങാം.
- source_word: ὁ δὲ ἐμὲ λαμβάνων
  choice: എന്നെ സ്വീകരിക്കുന്നവൻ
  rationale: δέ ഇവിടെ ശക്തമായ വിരോധമല്ല, തുടർന്നുയരുന്ന സമാന്തരബന്ധമാണ്. മലയാളത്തിലെ അർധവിരാമത്തിനു ശേഷമുള്ള ഘടന ആ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: τὸν πέμψαντά με
  choice: എന്നെ അയച്ചവനെ
  rationale: അയച്ച വ്യക്തിയെ ബന്ധപരമായി തിരിച്ചറിയുന്ന ഗ്രീക്ക് കൃദന്തരൂപം സംരക്ഷിക്കുന്നു; മൂലവാക്യത്തിൽ ഇല്ലാത്ത ‘പിതാവ്’ എന്ന പദവി മുഖ്യവാചകത്തിലേക്ക് ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ‘എന്നെ അയച്ചവൻ’ ആരെന്ന തിരിച്ചറിയൽ
  choice: എന്നെ അയച്ചവൻ
  alternative: എന്നെ അയച്ച പിതാവ്
  rationale: യോഹന്നാന്റെ വിശാലമായ സന്ദർഭത്തിൽ ഇത് പിതാവിനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, ഈ വാക്യം ‘പിതാവ്’ എന്ന പദവിക്കു പകരം ബന്ധപരമായ പ്രയോഗമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ മുഖ്യവാചകം മൂലരൂപം നിലനിർത്തുകയും സന്ദർഭപരമായ തിരിച്ചറിയൽ അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
- issue: പൊതുവായ അർഥമുള്ള പുരുഷലിംഗ കൃദന്തരൂപങ്ങൾ
  choice: സ്വീകരിക്കുന്നവൻ
  alternative: ആർ സ്വീകരിക്കുന്നുവോ ആ വ്യക്തി
  rationale: ഗ്രീക്ക് രൂപം പുരുഷന്മാരിൽ മാത്രം പരിമിതമല്ല. മലയാളത്തിലെ പൊതുവായ വ്യക്തിസൂചകപ്രയോഗം ലിംഗപരമായ നിയന്ത്രണം ഉദ്ദേശിക്കാതെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി അർഥം നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി. ‘സ്വീകരിക്കുന്നു’ എന്ന ആവർത്തനം പ്രതിനിധിത്വത്തിന്റെ ശൃംഖല—അയക്കപ്പെട്ടവൻ, യേശു, യേശുവിനെ അയച്ചവൻ—വ്യക്തമായി നിലനിർത്തുന്നു.
