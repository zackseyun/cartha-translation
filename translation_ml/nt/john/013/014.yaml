id: JHN.13.14
reference: John 13:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ οὖν ἐγὼ ἔνιψα ὑμῶν τοὺς πόδας ὁ κύριος καὶ ὁ διδάσκαλος, καὶ ὑμεῖς ὀφείλετε ἀλλήλων νίπτειν τοὺς πόδας·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/014.yaml
  text: If I then[a], the Lord and the Teacher, have washed your feet, you also ought to wash one another’s feet.
translation:
  language: ml
  text: അതിനാൽ, കർത്താവും[a] ഗുരുവുമായ ഞാൻ നിങ്ങളുടെ കാലുകൾ കഴുകിയെങ്കിൽ, നിങ്ങളും പരസ്പരം കാലുകൾ കഴുകേണ്ടതാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘യജമാനൻ.’ ഇവിടെ ഗ്രീക്ക് κύριος എന്ന പദം അതിന്റെ പതിവ് പദവ്യർഥമനുസരിച്ച് ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ οὖν
  choice: അതിനാൽ ... കഴുകിയെങ്കിൽ
  rationale: εἰ എന്ന വ്യവസ്ഥയും οὖν എന്ന നിഗമനസൂചനയും സ്വാഭാവികമായ മലയാള വാക്യഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: ἐγὼ
  choice: ഞാൻ
  rationale: ഗ്രീക്കിലെ വ്യക്തമായ സർവനാമം യേശുവിന്റെ പ്രവൃത്തിയും ശിഷ്യരുടെ ബാധ്യതയും തമ്മിലുള്ള ഊന്നൽ നിലനിർത്തുന്നതിനായി ഉൾപ്പെടുത്തി.
- source_word: ἔνιψα
  choice: കഴുകിയെങ്കിൽ
  rationale: തൊട്ടുമുമ്പ് പൂർത്തിയായ കാൽകഴുകൽ പ്രവൃത്തിയെ വ്യവസ്ഥാവാക്യത്തിനുള്ളിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ὑμῶν τοὺς πόδας
  choice: നിങ്ങളുടെ കാലുകൾ
  rationale: ഗ്രീക്ക് ഷഷ്ഠീവിഭക്തി-കർമഘടനയുടെ സ്വാഭാവിക മലയാള പരിഭാഷ.
- source_word: ὁ κύριος
  choice: കർത്താവ്
  rationale: യേശുവിനെ സൂചിപ്പിക്കുന്ന പതിവ് ബഹുമാനപദവിയായി κύριος-നെ പരിഭാഷപ്പെടുത്തി; സന്ദർഭത്തിലെ ഉയർന്ന സ്ഥാനവും വിനീതപ്രവൃത്തിയും തമ്മിലുള്ള വൈരുധ്യം നിലനിർത്തുന്നു.
- source_word: ὁ διδάσκαλος
  choice: ഗുരു
  rationale: പഠിപ്പിക്കുന്നവനെന്ന അർഥമുള്ള പദവിയെ സാധാരണക്കാർക്ക് സ്വാഭാവികവും മാന്യവുമായി ഗ്രഹിക്കാവുന്ന മലയാളത്തിൽ നൽകുന്നു.
- source_word: καὶ ὑμεῖς
  choice: നിങ്ങളും
  rationale: καί-യുടെ ‘കൂടി’ എന്ന ആശയവും ഊന്നലുള്ള ὑμεῖς-ഉം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ὀφείλετε
  choice: കഴുകേണ്ടതാണ്
  rationale: കടപ്പാടിന്റെയും ധാർമിക ബാധ്യതയുടെയും ശക്തി നിലനിർത്തുന്നു; ഗ്രീക്കിനെ നേരിട്ടുള്ള കൽപ്പനയായി അതിശക്തമാക്കുന്നില്ല.
- source_word: ἀλλήλων
  choice: പരസ്പരം
  rationale: പരസ്പരതയെ ആധുനികവും സ്വാഭാവികവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: νίπτειν τοὺς πόδας
  choice: കാലുകൾ കഴുകുക
  rationale: ശരീരത്തിന്റെ ഒരു ഭാഗം കഴുകുന്നതിനെ സൂചിപ്പിക്കുന്ന νίπτω-യുടെ മൂർത്തമായ പ്രവൃത്തി പൊതുവായ സേവനമെന്ന ആശയമായി ലയിപ്പിക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: κύριος എന്ന പദത്തിന്റെ ക്രിസ്തുവിനെ സൂചിപ്പിക്കുന്ന പദവിയായ പരിഭാഷ
  choice: കർത്താവ്
  alternative: യജമാനൻ
  rationale: ഇവിടെ യേശു തന്നെക്കുറിച്ച് ഉപയോഗിക്കുന്ന പദവിയാണിത്. ‘കർത്താവ്’ എന്നത് പതിവ് പദവ്യർഥം നിലനിർത്തുകയും യേശുവിന്റെ ഉന്നതസ്ഥാനവും വിനീതമായ പ്രവൃത്തിയും തമ്മിലുള്ള ബന്ധം പ്രകടമാക്കുകയും ചെയ്യുന്നു; ‘യജമാനൻ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: കാൽകഴുകലിനെക്കുറിച്ചുള്ള ബാധ്യതയുടെ സ്വഭാവം
  choice: ‘പരസ്പരം കാലുകൾ കഴുകുക’ എന്ന മൂർത്തമായ പ്രവൃത്തി അതേപടി നിലനിർത്തുക
  alternative: ‘പരസ്പരം വിനയത്തോടെ സേവിക്കുക’ എന്ന് പൊതുവായി വ്യാഖ്യാനിക്കുക
  rationale: ഗ്രീക്ക് പാഠം കാലുകൾ കഴുകുന്നതിനെ വ്യക്തമായി പറയുന്നു. അതിന്റെ മാതൃകാപരമായ വിശാലപ്രസക്തി ഉണ്ടായാലും, ഈ വാക്യത്തിൽ പാഠം പറയുന്നതിനെ പൊതുവായ വ്യാഖ്യാനമായി മാറ്റിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അധ്യാപകൻ’ എന്ന വിദ്യാലയസംബന്ധിയായ ഭാവത്തിനു പകരം പദവിസ്വഭാവം നിലനിർത്താൻ ‘ഗുരു’ ഉപയോഗിച്ചു. വ്യവസ്ഥയും അതിൽനിന്നുള്ള നിഗമനവും വ്യക്തമാക്കാൻ ‘അതിനാൽ ... എങ്കിൽ’ ഘടന സ്വീകരിച്ചു.
