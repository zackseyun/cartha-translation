  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ὃ ἐγὼ ποιῶ σὺ οὐκ οἶδας ἄρτι, γνώσῃ δὲ μετὰ ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/007.yaml
  text: Jesus answered and said to him[a], “What I am doing you do not know now[b], but you will understand after these things.”
translation:
  language: ml
  text: 'യേശു അവനോട് ഉത്തരം പറഞ്ഞു: “ഞാൻ ചെയ്യുന്നത് എന്താണെന്ന് ഇപ്പോൾ നിനക്ക് അറിയില്ല[a]; എന്നാൽ ഈ കാര്യങ്ങൾക്കു ശേഷം നീ മനസ്സിലാക്കും[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ഇവിടെ ‘അറിയുക’ എന്നും തുടർന്ന് ‘മനസ്സിലാക്കുക/അറിഞ്ഞുവരുക’ എന്നും പരിഭാഷപ്പെടുത്താവുന്ന രണ്ട് വ്യത്യസ്ത ക്രിയകളാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: “ഈ കാര്യങ്ങൾക്കു ശേഷം” എന്നത് ഈ സംഭവത്തിൽ ഉടനെ തുടർന്നുവരുന്ന കാര്യങ്ങളെയോ, യേശുവിന്റെ പ്രവൃത്തിയുടെ അർഥം പിന്നീട് വ്യക്തമാക്കുന്ന വിശാലമായ സംഭവങ്ങളെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: ഉത്തരം പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ഇരട്ട പ്രയോഗത്തിന്റെ പ്രതികരണവും സംസാരവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഒറ്റ സംയുക്തപ്രയോഗത്തിലൂടെ അറിയിക്കുന്നു; ‘ഉത്തരം പറഞ്ഞുകൊണ്ട് പറഞ്ഞു’ എന്ന കൃത്രിമ ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: Ὃ ἐγὼ ποιῶ
  choice: ഞാൻ ചെയ്യുന്നത് എന്താണെന്ന്
  rationale: നടന്നുകൊണ്ടിരിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന വർത്തമാനകാലഭാവവും അതിന്റെ അർഥത്തെക്കുറിച്ചുള്ള അറിവില്ലായ്മയും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: οὐκ οἶδας ἄρτι
  choice: ഇപ്പോൾ നിനക്ക് അറിയില്ല
  rationale: οἶδα എന്ന അറിവുസൂചക ക്രിയയെ ‘അറിയുക’ എന്നു പരിഭാഷപ്പെടുത്തി, തുടർന്ന് വരുന്ന γινώσκωയുമായുള്ള പദവ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: γνώσῃ
  choice: നീ മനസ്സിലാക്കും
  rationale: പിന്നീട് പ്രവൃത്തിയുടെ അർഥം ഗ്രഹിക്കുമെന്ന സന്ദർഭസൂചന നൽകുകയും οἶδας എന്നതിലെ ‘അറിയുക’ എന്ന പ്രയോഗത്തിൽനിന്നുള്ള ഗ്രീക്ക് ക്രിയാഭേദം പ്രതിഫലിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: μετὰ ταῦτα
  choice: ഇതിനു ശേഷം
  rationale: ‘ഈ കാര്യങ്ങൾക്കു ശേഷം’ എന്ന കൂടുതൽ അക്ഷരാർഥപരമായ രൂപത്തേക്കാൾ സ്വാഭാവികമാണ്; അതേസമയം ‘പിന്നീട്’ എന്നതിനെക്കാൾ ഗ്രീക്കിലെ സൂചനാത്മകമായ ബഹുവചനപ്രയോഗത്തിന്റെ തുറന്ന അർഥം സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: ഭാവിയിലെ മനസ്സിലാക്കലിന്റെ സമയപരിധി
  choice: ‘ഇതിനു ശേഷം’ എന്നു പൊതുവായി നിലനിർത്തി
  alternative: കാലുകഴുകൽ പൂർത്തിയായ ശേഷമെന്നോ, ക്രൂശുമരണവും ഉയിർപ്പും കഴിഞ്ഞെന്നോ, ആത്മാവിലൂടെ പിന്നീട് ലഭിക്കുന്ന ബോധ്യമെന്നോ വ്യക്തമാക്കുക
  rationale: μετὰ ταῦτα ഒരു പ്രത്യേക ഘട്ടം നിർബന്ധമായി നിശ്ചയിക്കുന്നില്ല. അതിനാൽ ഈ സംഭവത്തിലെ തുടർവിവരണവും പിന്നീടുള്ള വിശാല സംഭവങ്ങളും ഉൾക്കൊള്ളാവുന്ന അർഥതുറപ്പ് പരിഭാഷ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. പത്രോസിനോടുള്ള ഏകവചന അഭിസംബോധനയ്ക്ക് സന്ദർഭോചിതമായ ‘നിനക്ക്/നീ’ ഉപയോഗിച്ചു. ഗ്രീക്കിലെ ആവർത്തനാത്മകമായ പ്രസംഗപരിചയം മലയാളത്തിൽ സ്വാഭാവികമാക്കി; എന്നാൽ രണ്ട് അറിവുസൂചക ക്രിയകളുടെ വ്യത്യാസം മുഖ്യവാക്യത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
