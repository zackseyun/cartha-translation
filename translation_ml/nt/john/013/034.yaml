id: JHN.13.34
reference: John 13:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐντολὴν καινὴν δίδωμι ὑμῖν ἵνα ἀγαπᾶτε ἀλλήλους, καθὼς ἠγάπησα ὑμᾶς ἵνα καὶ ὑμεῖς ἀγαπᾶτε ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/034.yaml
  text: 'A new commandment I give to you: that you love one another[a]. Just as I loved you[b], you also are to love one another.'
translation:
  language: ml
  text: 'ഒരു പുതിയ കൽപ്പന ഞാൻ നിങ്ങൾക്കു നൽകുന്നു: നിങ്ങൾ പരസ്പരം സ്നേഹിക്കണം[a]. ഞാൻ നിങ്ങളെ സ്നേഹിച്ചതുപോലെ, നിങ്ങളും പരസ്പരം സ്നേഹിക്കണം[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കൽപ്പന’ എന്നതിന് പകരം ‘ആജ്ഞ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദത്തിന് രണ്ടുവിധത്തിലുള്ള പരിഭാഷയും സാധ്യമാണ്; ഇവിടെ ഔപചാരികമായ ധാർമിക നിർദേശത്തിന്റെ ശക്തി നിലനിർത്താൻ ‘കൽപ്പന’ ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: രണ്ടാമത്തെ ἵνα-ഘടകം ഉദ്ദേശ്യമോ ഫലമോ ആയി എടുത്താൽ, വാക്യത്തിന്റെ അവസാനഭാഗം ‘നിങ്ങളും പരസ്പരം സ്നേഹിക്കേണ്ടതിന്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐντολὴν
  choice: കൽപ്പന
  rationale: യോഹന്നാന്റെ പ്രയോഗത്തിലെ ഔപചാരികമായ ധാർമിക നിർദേശത്തിന്റെ ശക്തി നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: καινὴν
  choice: പുതിയ
  rationale: καινός എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥം നൽകുന്നു; ഈ പുതുമ കാലപരമാണോ ഗുണപരമാണോ എന്ന് വാക്യത്തിൽ വിശദീകരിക്കാതെ അവ്യക്തത നിലനിർത്തുന്നു.
- source_word: δίδωμι ὑμῖν
  choice: ഞാൻ നിങ്ങൾക്കു നൽകുന്നു
  rationale: വർത്തമാനകാല ക്രിയയും ദാതൃവിഭക്തിയിലുള്ള സ്വീകർത്താക്കളെയും വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്നു; യേശുവിന്റെ നേരിട്ടുള്ള പ്രഖ്യാപനത്തിന്റെ ഗൗരവവും നിലനിർത്തുന്നു.
- source_word: ἵνα ἀγαπᾶτε ἀλλήλους
  choice: നിങ്ങൾ പരസ്പരം സ്നേഹിക്കണം
  rationale: ἐντολήν δίδωμι എന്ന പ്രയോഗത്തിനു പിന്നാലെയുള്ള ἵνα കല്പനയുടെ ഉള്ളടക്കവും ഉദ്ദേശ്യവും സൂചിപ്പിക്കുന്നു. ‘സ്നേഹിക്കണം’ മലയാളത്തിൽ അതിന്റെ നിർദേശാത്മക ശക്തി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀγαπᾶτε / ἠγάπησα
  choice: സ്നേഹിക്കണം / സ്നേഹിച്ചു
  rationale: ഒരേ പദകുടുംബത്തിന്റെ ആവർത്തനവും വാക്യത്തിന്റെ ദൈവശാസ്ത്രപരമായ ഊന്നലും ‘സ്നേഹം’ എന്ന ഭാഷയിലൂടെ നിലനിർത്തുന്നു.
- source_word: ἀλλήλους
  choice: പരസ്പരം
  rationale: പരസ്പരബന്ധത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളപ്രയോഗമാണ്.
- source_word: καθὼς
  choice: സ്നേഹിച്ചതുപോലെ
  rationale: ‘പോലെ’ എന്ന ഘടന യേശുവിന്റെ സ്നേഹം ശിഷ്യരുടെ സ്നേഹത്തിന് മാതൃകയും മാനദണ്ഡവുമായി അവതരിപ്പിക്കുന്ന താരതമ്യം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἠγάπησα
  choice: ഞാൻ നിങ്ങളെ സ്നേഹിച്ചു
  rationale: ഗ്രീക്ക് aorist-നെ ലളിതമായ ഭൂതകാലമായി നൽകുന്നു; ഇംഗ്ലീഷ് perfect-നോടു സാമ്യമുള്ള കൂടുതൽ വ്യാഖ്യാനാത്മക രൂപം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: ἵνα καὶ ὑμεῖς ἀγαπᾶτε ἀλλήλους
  choice: നിങ്ങളും പരസ്പരം സ്നേഹിക്കണം
  rationale: καὶ ὑμεῖς എന്നതിലെ ‘നിങ്ങളും’ എന്ന ഊന്നൽ സംരക്ഷിച്ച്, രണ്ടാമത്തെ ἵνα ഘടകത്തിന്റെ പ്രബോധനാത്മക ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ‘പുതിയ കൽപ്പന’യുടെ പുതുമയുടെ സ്വഭാവം
  choice: പ്രധാന പാഠത്തിൽ വിശദീകരണമില്ലാതെ ‘ഒരു പുതിയ കൽപ്പന’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: കാലത്തിൽ പുതിയത്; ഗുണത്തിൽ പുതിയത്; യേശുവിന്റെ മാതൃകയിലൂടെ പുതിയ ഉടമ്പടിയിൽ സാക്ഷാത്കരിക്കപ്പെട്ടത്.
  rationale: ഈ വാക്യം കൽപ്പനയെ ‘പുതിയത്’ എന്നു വിശേഷിപ്പിക്കുന്നുവെങ്കിലും അതിന്റെ പുതുമ ഏതു അർഥത്തിലാണെന്ന് ഇവിടെ നിർവചിക്കുന്നില്ല. അതിനാൽ ദൈവശാസ്ത്രപരമായ തുറന്ന നില പരിഭാഷയിൽ സംരക്ഷിച്ചു.
- issue: രണ്ടാമത്തെ ἵνα ഘടകത്തിന്റെ ബന്ധം
  choice: ‘നിങ്ങളും പരസ്പരം സ്നേഹിക്കണം’ എന്ന പ്രബോധനാത്മക വായന പ്രധാന പാഠത്തിൽ നൽകി.
  alternative: ‘അങ്ങനെ നിങ്ങളും പരസ്പരം സ്നേഹിക്കേണ്ടതിന്’ എന്ന ഉദ്ദേശ്യ/ഫല വായന.
  rationale: ἐντολήν δίδωμι എന്ന പശ്ചാത്തലത്തിൽ കല്പനയുടെ ഉള്ളടക്കമായി വായിക്കുന്നത് സ്വാഭാവികമാണെങ്കിലും, ἵνα ഉദ്ദേശ്യമോ ഫലമോ സൂചിപ്പിക്കാനുള്ള സാധ്യതയും അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘പരസ്പരം’, ‘സ്നേഹിക്കണം’ എന്നീ പ്രയോഗങ്ങൾ സാധാരണ വായനക്കാർക്ക് സുതാര്യമാണ്; മൂലത്തിലെ ആവർത്തനവും നേരിട്ടുള്ള കല്പനാഭാവവും നിലനിർത്തിയിരിക്കുന്നു.
