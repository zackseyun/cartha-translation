  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγει αὐτῷ Σίμων Πέτρος· Κύριε, μὴ τοὺς πόδας μου μόνον ἀλλὰ καὶ τὰς χεῖρας καὶ τὴν κεφαλήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/009.yaml
  text: Simon Peter says to him[a], “Lord, not only my feet, but also my hands and my head.”
translation:
  language: ml
  text: 'ശിമോൻ പത്രോസ് അവനോടു പറയുന്നു: “കർത്താവേ,[a] എന്റെ കാലുകൾ മാത്രമല്ല, എന്റെ കൈകളും തലയും കൂടി കഴുകണമേ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ “യജമാനനേ.” ഗ്രീക്ക്: “ക്യൂരിയോസ്.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: പറയുന്നു
  rationale: ഗ്രീക്കിലെ ആഖ്യാന വർത്തമാനകാലം നിലനിർത്തി യോഹന്നാന്റെ വിവരണത്തിലെ സജീവത സംരക്ഷിക്കുന്നു.
- source_word: αὐτῷ
  choice: അവനോടു
  rationale: സന്ദർഭത്തിൽ പരാമർശിക്കുന്നത് യേശുവിനെയാണെങ്കിലും, ഗ്രീക്കിലെ സർവനാമരൂപം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: Σίμων Πέτρος
  choice: ശിമോൻ പത്രോസ്
  rationale: മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ നാമരൂപങ്ങൾ ഉപയോഗിക്കുന്നു.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: ആദരസൂചകമായ അഭിസംബോധനയും യോഹന്നാനിലെ ദൈവശാസ്ത്രപരമായ അനുരണനവും സംരക്ഷിക്കുന്ന പതിവ് മലയാള പരിഭാഷയാണ്.
- source_word: μὴ ... μόνον ἀλλὰ καὶ
  choice: മാത്രമല്ല ... കൂടെ
  rationale: ഒന്നിൽ ഒതുങ്ങാതെ മറ്റുള്ളവയും ഉൾപ്പെടുത്തുന്ന ഗ്രീക്ക് വൈരുധ്യവികാസം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: τοὺς πόδας μου ... τὰς χεῖρας καὶ τὴν κεφαλήν
  choice: എന്റെ കാലുകൾ ... കൈകളും തലയും
  rationale: μου എന്ന ഉടമസൂചകം കാലുകളോടു മാത്രമേ പ്രത്യക്ഷമായി ചേർന്നിട്ടുള്ളൂ; ഏകോപിത ശരീരഭാഗങ്ങൾക്കൊക്കെയും അത് ബാധകമാണെന്ന അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി മനസ്സിലാകുന്നു.
- source_word: ellipsis of washing verb
  choice: കഴുകണമേ
  rationale: ഗ്രീക്കിൽ മുൻവാക്യത്തിൽനിന്ന് മനസ്സിലാക്കേണ്ട ക്രിയ ഇവിടെ വിട്ടുകളഞ്ഞിരിക്കുന്നു. മലയാളത്തിൽ പൂർണ്ണവും സ്വാഭാവികവുമായ അഭ്യർഥനയ്ക്കായി ‘കഴുകണമേ’ വ്യക്തമാക്കി ചേർത്തു.
theological_decisions:
- issue: യേശുവിനെ അഭിസംബോധന ചെയ്യുന്ന κύριος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: കർത്താവേ
  alternative: ഗുരുവേ / യജമാനനേ
  rationale: κύριος എന്ന പദത്തിന്റെ സാധാരണ പുതിയനിയമ പ്രയോഗവും ഈ സന്ദർഭത്തിലെ ആദരവും യോഹന്നാനിലെ വിശാലമായ ദൈവശാസ്ത്രപരമായ അനുരണനവും ‘കർത്താവേ’ സംരക്ഷിക്കുന്നു; സന്ദർഭം അനുവദിക്കുന്ന മറ്റൊരു അർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ ചരിത്രവർത്തമാനം ‘പറയുന്നു’ എന്നു നിലനിർത്തി. മുൻസന്ദർഭത്തിൽനിന്ന് ഗ്രഹിക്കേണ്ട ‘കഴുകുക’ എന്ന ക്രിയ മലയാളത്തിലെ വ്യക്തതയ്ക്കായി പൂരിപ്പിച്ചു.
