  text: But none of those reclining at the table knew why he said this to him[a].
translation:
  language: ml
  text: എന്നാൽ ഭക്ഷണത്തിനായി ചാരിക്കിടന്നിരുന്നവരിൽ ആരും, എന്തിനാണ് അവൻ അവനോട് ഇതു പറഞ്ഞതെന്ന് അറിഞ്ഞില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
