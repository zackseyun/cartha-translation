id: JHN.13.33
reference: John 13:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τεκνία, ἔτι μικρὸν μεθ’ ὑμῶν εἰμι· ζητήσετέ με, καὶ καθὼς εἶπον τοῖς Ἰουδαίοις ὅτι Ὅπου ⸂ἐγὼ ὑπάγω⸃ ὑμεῖς οὐ δύνασθε ἐλθεῖν, καὶ ὑμῖν λέγω ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/033.yaml
  text: Little children[a], I am with you a little while longer. You will seek me, and just as I said to the Jews, ‘Where I am going[b], you are not able to come,’ so now I also say to you.
translation:
  language: ml
  text: കുഞ്ഞുമക്കളേ, ഞാൻ ഇനിയും അല്പസമയം കൂടി നിങ്ങളോടൊപ്പം ഉണ്ട്. നിങ്ങൾ എന്നെ അന്വേഷിക്കും. ‘ഞാൻ പോകുന്നിടത്തേക്ക് വരാൻ നിങ്ങൾക്കു കഴിയുകയില്ല’[b] എന്നു യെഹൂദരോട്[a] പറഞ്ഞതുപോലെ, ഇപ്പോൾ നിങ്ങളോടും ഞാൻ പറയുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: സന്ദർഭമനുസരിച്ച്, ‘യെഹൂദനേതാക്കളോട്’ എന്നും അർഥമാകാം; യോഹന്നാന്റെ സുവിശേഷത്തിൽ ‘യെഹൂദർ’ എന്ന പദം ചിലപ്പോൾ പ്രത്യേകിച്ച് യെഹൂദ്യയിലെ അധികാരികളെ സൂചിപ്പിക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: 'കൂടുതൽ ലളിതമായി: ‘നിങ്ങൾക്കു വരാനാവില്ല.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: τεκνία
  choice: കുഞ്ഞുമക്കളേ
  rationale: τεκνίον എന്ന പദത്തിന്റെ സംബോധന ബഹുവചനം വാത്സല്യവും കുടുംബബന്ധത്തിന്റെ രൂപകവും ലഘുത്വഭാവവും പ്രകടിപ്പിക്കുന്നു. ‘കുഞ്ഞുമക്കളേ’ ഇവയെ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത ‘എന്റെ’ ചേർത്തിട്ടില്ല.
- source_word: ἔτι μικρόν
  choice: ഇനി അല്പസമയംകൂടി
  rationale: ശേഷിക്കുന്ന ഹ്രസ്വകാലത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗം. ‘ഇനി’യും ‘കൂടി’യും ചേർന്ന് ἔτιയുടെ ‘ഇനിയും/കൂടുതൽ’ എന്ന സമയബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: μεθ’ ὑμῶν εἰμι
  choice: ഞാൻ നിങ്ങളോടുകൂടെ ഉണ്ട്
  rationale: യേശുവിന്റെ ഇപ്പോഴത്തെ സാന്നിധ്യം നേരിട്ടും വർത്തമാനകാലത്തിലും നിലനിർത്തുന്നു.
- source_word: ζητήσετέ με
  choice: നിങ്ങൾ എന്നെ അന്വേഷിക്കും
  rationale: ζητέωയുടെ ‘അന്വേഷിക്കുക/തിരയുക’ എന്ന അർഥം. യോഹന്നാനിലെ പദപ്രയോഗത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നതിനാൽ ‘തിരയും’ എന്നതിനെക്കാൾ ‘അന്വേഷിക്കും’ തെരഞ്ഞെടുത്തു.
- source_word: καθὼς εἶπον τοῖς Ἰουδαίοις
  choice: യെഹൂദരോട് പറഞ്ഞതുപോലെ
  rationale: Ἰουδαίοις എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ഈ വാക്യം മാത്രം ആശ്രയിച്ച് അതിനെ ‘യെഹൂദനേതാക്കൾ’ എന്നു ചുരുക്കുന്നില്ല. καθώς എന്ന താരതമ്യബന്ധം ‘പറഞ്ഞതുപോലെ’ വ്യക്തമാക്കുന്നു.
- source_word: Ὅπου ἐγὼ ὑπάγω
  choice: ഞാൻ പോകുന്നിടത്തേക്ക്
  rationale: ὑπάγω ഇവിടെ പുറപ്പെടുക/പോകുക എന്ന ആശയം നൽകുന്നു. മലയാളത്തിൽ ലക്ഷ്യസ്ഥാനം സൂചിപ്പിക്കുന്ന സ്വാഭാവിക രൂപമാണിത്.
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: വരാൻ നിങ്ങൾക്കു കഴിയുകയില്ല
  rationale: δύνασθε എന്ന ശേഷി/സാധ്യതാസൂചനയെ ‘കഴിയുക’ വഴി തുറന്നുവെക്കുന്നു; കഴിയാതിരിക്കുന്നതിന്റെ കാരണം വിവർത്തനം സ്വയം നിർണയിക്കുന്നില്ല.
- source_word: καὶ ὑμῖν λέγω ἄρτι
  choice: ഇപ്പോൾ നിങ്ങളോടും ഞാൻ പറയുന്നു
  rationale: ἄρτιയുടെ വർത്തമാനകാലസൂചന ‘ഇപ്പോൾ’ എന്നും, മുമ്പ് യെഹൂദരോടു പറഞ്ഞ കാര്യം ഇപ്പോൾ ശിഷ്യന്മാർക്കും ബാധകമാക്കുന്ന സമാന്തരബന്ധം ദത്തിവിലെ ‘-ഓടും’ എന്നും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: യോഹന്നാന്റെ സന്ദർഭത്തിലെ Ἰουδαίοις എന്നതിന്റെ പരിഭാഷ
  choice: യെഹൂദർ
  alternative: യെഹൂദനേതാക്കൾ
  rationale: ഗ്രീക്ക് പദത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘യെഹൂദർ’ എന്നാണ്. യോഹന്നാനിൽ ചില സന്ദർഭങ്ങളിൽ ഇത് പ്രത്യേകിച്ച് യെഹൂദ്യയിലെ അധികാരികളെ സൂചിപ്പിക്കാമെങ്കിലും, ഈ വാക്യം തന്നെ അങ്ങനെ ചുരുക്കാൻ നിർബന്ധിക്കുന്നില്ല. അതിനാൽ പ്രധാനപാഠം വിശാലമായ പദം നിലനിർത്തുകയും സന്ദർഭപരമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
- issue: οὐ δύνασθε ἐλθεῖν സൂചിപ്പിക്കുന്ന അസാധ്യതയുടെ സ്വഭാവം
  choice: വരാൻ നിങ്ങൾക്കു കഴിയുകയില്ല
  alternative: നിങ്ങൾക്കു വരാനാവില്ല
  rationale: വാക്യം അസാധ്യത പ്രസ്താവിക്കുന്നുവെങ്കിലും അതിന്റെ കാരണം ഇവിടെ വിശദീകരിക്കുന്നില്ല. ‘കഴിയുകയില്ല’ എന്നത് ആ തുറന്ന നില നിലനിർത്തുന്നു; ദൈവശാസ്ത്രപരമായ ഒരു പ്രത്യേക കാരണം വിവർത്തനത്തിലേക്ക് ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സംസാരശൈലി ഉപയോഗിച്ചു. വാത്സല്യമുള്ള സംബോധനയും യേശുവിന്റെ വിടവാങ്ങൽവാക്കുകളുടെ ഗൗരവവും നിലനിർത്തി. ഉദ്ധരണിയിലെ ലക്ഷ്യസ്ഥാനം മലയാളത്തിൽ വ്യക്തമായി വരാൻ ‘പോകുന്നിടത്തേക്ക്’ എന്നു നൽകി. ലഭിച്ച ഇംഗ്ലീഷ് consultation layer-ൽ അടിക്കുറിപ്പുകളുടെ സൂചകങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങളോട് പൊരുത്തപ്പെട്ടിരുന്നില്ല; പ്രസിദ്ധീകരണരൂപത്തിൽ [a] ‘യെഹൂദരോട്’ എന്നതിനും [b] അസാധ്യതാവാക്യത്തിനും ചേർത്ത് ശരിയാക്കി.
