base_translation:
  language: en
  yaml_path: translation/nt/john/013/015.yaml
  text: For I have given you an example[a], so that just as I have done to you[c][b], you also may do.
translation:
  language: ml
  text: എന്തെന്നാൽ, ഞാൻ നിങ്ങൾക്കു ഒരു മാതൃക[a] നൽകി; ഞാൻ നിങ്ങൾക്കു ചെയ്തതുപോലെ നിങ്ങളും ചെയ്യേണ്ടതിനാണ് അത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഉദാഹരണം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπόδειγμα
  choice: ഒരു മാതൃക
  rationale: അനുകരിക്കേണ്ട ഉദാഹരണം അഥവാ മാതൃക എന്ന അർഥം നൽകുന്നു. കാൽ കഴുകിയ പ്രവൃത്തിയെ അനുകരണീയമായ മാതൃകയായി അവതരിപ്പിക്കുന്ന സന്ദർഭത്തിന് ‘മാതൃക’ സ്വാഭാവികമായി യോജിക്കുന്നു.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ ഉപദേശത്തിന് യേശു ചെയ്ത പ്രവൃത്തി അടിസ്ഥാനമാകുന്നതെങ്ങനെയെന്ന് വിശദീകരിക്കുന്ന ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: ἔδωκα
  choice: നൽകി
  rationale: ഗ്രീക്കിലെ ലളിതമായ ഭൂതകാലരൂപത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; ആ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ പ്രസക്തി സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാണ്.
- source_word: ἵνα
  choice: ചെയ്യേണ്ടതിന്
  rationale: യേശു മാതൃക നൽകിയതിന്റെ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ ഉദ്ദേശ്യവും പ്രതീക്ഷിക്കപ്പെടുന്ന അനുസരണവും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: καθὼς
  choice: ചെയ്തതുപോലെ
  rationale: യേശുവിന്റെ പ്രവൃത്തിയും ശിഷ്യരുടെ പ്രവൃത്തിയും തമ്മിലുള്ള അനുരൂപത സംരക്ഷിക്കുന്നു.
- source_word: ἐποίησα ὑμῖν
  choice: ഞാൻ നിങ്ങൾക്കു ചെയ്തതുപോലെ
  rationale: ποιέω എന്നതിന്റെ വിശാലമായ ‘ചെയ്യുക’ എന്ന അർഥവും ὑμῖν എന്ന ദത്തിവിന്റെ രൂപവും നിലനിർത്തുന്നു. ‘നിങ്ങൾക്കു’ എന്ന മലയാളപ്രയോഗം സന്ദർഭത്തിലെ പ്രയോജനാർഥവും അവരോടു ചെയ്ത പ്രവൃത്തി എന്ന ആശയവും അനാവശ്യമായി ഒന്നിലേക്കു ചുരുക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: καὶ ὑμεῖς ποιῆτε
  choice: നിങ്ങളും ചെയ്യേണ്ടതിന്
  rationale: ‘നിങ്ങളും’ എന്നത് ശിഷ്യരുടെ അനുരൂപമായ പങ്കാളിത്തം പ്രകടമാക്കുന്നു; ἵναയോടുകൂടിയ ഉപവാക്യത്തിന്റെ ഉദ്ദേശ്യബലവും നൈതിക പ്രതീക്ഷയും ‘ചെയ്യേണ്ടതിന്’ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ പ്രവൃത്തി ശിഷ്യർ അനുകരിക്കണമെന്ന പ്രസ്താവനയുടെ വ്യാപ്തി
  choice: യേശുവിന്റെ പ്രവൃത്തിയെ ശിഷ്യർ അനുകരിക്കേണ്ട മാതൃകയായി അവതരിപ്പിക്കുക; എന്നാൽ അത് എല്ലാ സാഹചര്യങ്ങളിലും നിർബന്ധമായ ഒരു പ്രത്യേക ആചാരമാണോ വിപുലമായ സേവനമാതൃകയാണോ എന്ന് പരിഭാഷയിൽ തീർപ്പാക്കാതിരിക്കുക.
  alternative: ഇത് എല്ലായിടത്തും അക്ഷരാർഥത്തിൽ പാലിക്കേണ്ട കാൽ കഴുകൽവിധിയാണെന്ന് വ്യക്തമാക്കുക, അല്ലെങ്കിൽ ഇതിന് മൂർത്തമായ അനുകരണബലം ഇല്ലാത്ത പ്രതീകാർഥം മാത്രമാണെന്ന് പറയുക.
  rationale: വാക്യം യേശുവിന്റെ പ്രവൃത്തിക്കും ശിഷ്യരുടെ തുടർപ്രവൃത്തിക്കും ഇടയിൽ വ്യക്തമായ അനുരൂപത സ്ഥാപിക്കുന്നു. എന്നാൽ ആ അനുകരണത്തിന്റെ ആചാരപരമായ വ്യാപ്തി ഈ വാക്യം മാത്രം നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘എന്തെന്നാൽ’ മുൻസന്ദർഭത്തോടുള്ള വിശദീകരണബന്ധം നിലനിർത്തുന്നു. ‘നിങ്ങൾക്കു ചെയ്തത്’ എന്ന പ്രയോഗം ഗ്രീക്ക് ദത്തിവിലുള്ള ‘അവരോടു ചെയ്തത്/അവർക്കുവേണ്ടി ചെയ്തത്’ എന്ന സാദ്ധ്യമായ ഭാവവ്യത്യാസം തുറന്നുവയ്ക്കുന്നു.
