id: JHN.13.25
reference: John 13:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ἀναπεσὼν ἐκεῖνος οὕτως ἐπὶ τὸ στῆθος τοῦ Ἰησοῦ λέγει αὐτῷ· Κύριε, τίς ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/john/013/025.yaml
  text: So he[a], leaning back in this way against Jesus' chest, says to him, “Lord, who is it?”
translation:
  language: ml
  text: 'അവൻ അങ്ങനെ യേശുവിന്റെ നെഞ്ചോടു ചാഞ്ഞുകിടന്ന് അവനോടു പറയുന്നു: “കർത്താവേ, അത് ആരാണ്?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναπεσὼν
  choice: ചാഞ്ഞുകൊണ്ട്
  rationale: ഭക്ഷണമേശയിൽ ചാരിക്കിടക്കുന്ന പശ്ചാത്തലത്തിൽ, യേശുവിന്റെ നെഞ്ചിലേക്കുള്ള ശരീരചലനം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἐκεῖνος
  choice: അവൻ
  rationale: മുൻവാക്യത്തിൽ പരാമർശിച്ച ശിഷ്യനെയാണ് സർവനാമം സൂചിപ്പിക്കുന്നത്; മൂലത്തിലെ സർവനാമസ്വഭാവം നിലനിർത്തുന്നു.
- source_word: οὕτως
  choice: അങ്ങനെ
  rationale: തൊട്ടുമുമ്പ് വിവരിച്ചിരുന്ന ഇരിപ്പിന്റെയോ ചാരിക്കിടപ്പിന്റെയോ നിലയുമായി ഈ പ്രവൃത്തിയെ ബന്ധിപ്പിക്കുന്നു.
- source_word: ἐπὶ τὸ στῆθος τοῦ Ἰησοῦ
  choice: യേശുവിന്റെ നെഞ്ചിലേക്കു
  rationale: ദിശ സൂചിപ്പിക്കുന്ന ἐπὶ + accusative-ഉം ഭക്ഷണസമയത്തെ ചാരിക്കിടക്കുന്ന ഭാവവും സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: λέγει αὐτῷ
  choice: അവനോടു ചോദിക്കുന്നു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനകാലം നിലനിർത്തുന്നു; തുടർന്നുള്ള ചോദ്യം കണക്കിലെടുത്ത് λέγει എന്നതിനെ സ്വാഭാവികമായി ‘ചോദിക്കുന്നു’ എന്നു നൽകുന്നു.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: യേശുവിനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയിൽ ബഹുമാനവും യോഹന്നാനിലെ ദൈവശാസ്ത്രപരമായ തുറന്ന അർത്ഥവും നിലനിർത്തുന്നു.
- source_word: τίς ἐστιν;
  choice: അത് ആരാണ്?
  rationale: യേശു സൂചിപ്പിച്ച വ്യക്തിയുടെ തിരിച്ചറിയൽ ചോദിക്കുന്ന സന്ദർഭത്തിന് സ്വാഭാവികമായ മലയാളപ്രയോഗം.
theological_decisions:
- issue: യേശുവിനെ അഭിസംബോധന ചെയ്യുന്ന κύριος
  choice: കർത്താവേ
  alternative: ഗുരുവേ / യജമാനനേ
  rationale: വെറും ബഹുമാനസൂചകമായി ചുരുക്കാതെ, യോഹന്നാന്റെ സുവിശേഷത്തിലെ പദത്തിന്റെ വിശാലമായ ക്രിസ്തുശാസ്ത്രപരമായ സാധ്യത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും ലളിതവും മാന്യവുമായ മലയാളം. ഭക്ഷണസമയത്തെ പുരാതന ശരീരനില വായനക്കാരന് മനസ്സിലാക്കാൻ അടിക്കുറിപ്പ് നൽകിയിരിക്കുന്നു; മൂലത്തിലെ ചരിത്രവർത്തമാനകാലവും സർവനാമവും നിലനിർത്തിയിരിക്കുന്നു.
