id: JHN.13.29
reference: John 13:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τινὲς γὰρ ἐδόκουν, ἐπεὶ τὸ γλωσσόκομον ⸀εἶχεν Ἰούδας, ὅτι λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Ἀγόρασον ὧν χρείαν ἔχομεν εἰς τὴν ἑορτήν, ἢ τοῖς πτωχοῖς ἵνα τι δῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/029.yaml
  text: For some thought that[a], because Judas had the money box, Jesus was telling him[b], “Buy what we need for the feast,” or that he should give something to the poor.
translation:
  language: ml
  text: യൂദാസിന്റെ കൈവശം പണപ്പെട്ടി[a] ഉണ്ടായിരുന്നതിനാൽ, യേശു അവനോട്, “പെരുന്നാളിന്[b] നമുക്ക് ആവശ്യമുള്ളത് വാങ്ങുക” എന്നു പറയുകയോ, അല്ലെങ്കിൽ ദരിദ്രർക്കു എന്തെങ്കിലും കൊടുക്കാൻ പറയുകയോ ചെയ്യുകയാണെന്ന് ചിലർ കരുതി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പണസഞ്ചി.” സംഘത്തിന്റെ പണം സൂക്ഷിച്ചിരുന്ന പാത്രത്തെയാണ് ഗ്രീക്ക് പദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടത്തെ “പെരുന്നാൾ” ഈ ഭാഗത്തിന്റെ സന്ദർഭമായ പെസഹാപ്പെരുന്നാളിനെ സൂചിപ്പിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: τινὲς
  choice: ചിലർ
  rationale: അവിടെ ഉണ്ടായിരുന്നവരിൽ നിർവചിക്കപ്പെടാത്ത ചിലരെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സംക്ഷിപ്തവുമായ പ്രയോഗം.
- source_word: ἐδόκουν
  choice: കരുതി
  rationale: ശിഷ്യന്മാരുടെ അനുമാനത്തെ സൂചിപ്പിക്കുന്നു; അപൂർണ്ണകാലത്തിന്റെ വിവരണാത്മക സ്വഭാവം സന്ദർഭത്തിൽ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: ἐπεὶ
  choice: എന്നതിനാൽ
  rationale: അവരുടെ അനുമാനത്തിനുള്ള കാരണം—പണപ്പെട്ടി യൂദാസിന്റെ കൈവശമായിരുന്നത്—വ്യക്തമാക്കുന്നു.
- source_word: γλωσσόκομον
  choice: പണപ്പെട്ടി
  rationale: സംഘത്തിന്റെ പണം സൂക്ഷിച്ചിരുന്ന പാത്രത്തെ സൂചിപ്പിക്കുന്ന, ഗ്രീക്ക് പദത്തോട് അടുത്തും മലയാളത്തിൽ സുതാര്യവുമായ വിവർത്തനം.
- source_word: εἶχεν
  choice: കൈവശമായിരുന്നു
  rationale: അക്ഷരാർഥമായ ‘ഉണ്ടായിരുന്നു/കൈവശം വെച്ചിരുന്നു’ എന്ന ആശയം നിലനിർത്തിക്കൊണ്ട് പണപ്പെട്ടിയുടെ ചുമതല യൂദാസിനായിരുന്നു എന്ന സന്ദർഭസൂചന സ്വാഭാവികമായി നൽകുന്നു.
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: യേശു അവനോട് ... പറയുകയാണെന്ന്
  rationale: ചരിത്രവർത്തമാനകാലത്തെ മലയാള വിവരണത്തിൽ സ്വാഭാവികമായ പരോക്ഷവാക്യരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: Ἀγόρασον
  choice: വാങ്ങുക
  rationale: ലളിതവും നേരിട്ടുള്ളതുമായ ആജ്ഞാരൂപം.
- source_word: ὧν χρείαν ἔχομεν
  choice: നമുക്ക് ആവശ്യമുള്ളത്
  rationale: ഗ്രീക്ക് ബന്ധവാക്യത്തിന്റെ അർഥം കൃത്യമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: εἰς τὴν ἑορτήν
  choice: പെരുന്നാളിന്
  rationale: മതപരമായ ഉത്സവത്തെ സൂചിപ്പിക്കുന്നു; ഈ വാക്യത്തിൽ വ്യക്തമാക്കാത്ത ‘പെസഹ’ എന്ന പദം മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: τοῖς πτωχοῖς
  choice: ദരിദ്രർക്കു
  rationale: ദരിദ്രരായ ആളുകളെ സൂചിപ്പിക്കുന്ന നാമവൽക്കരിച്ച വിശേഷണത്തിന്റെ നേരിട്ടുള്ള മലയാളസമാനത.
- source_word: ἵνα τι δῷ
  choice: എന്തെങ്കിലും കൊടുക്കണമെന്ന്
  rationale: ശിഷ്യന്മാർ മനസ്സിലാക്കിയ മറ്റൊരു ഉദ്ദേശ്യം പരോക്ഷവാക്യത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ἑορτήയുടെ പ്രത്യേക തിരിച്ചറിയൽ
  choice: മുഖ്യവാചകത്തിൽ ‘പെരുന്നാൾ’ എന്നു മാത്രം നൽകി; അടിക്കുറിപ്പിൽ പെസഹാസന്ദർഭം വ്യക്തമാക്കി.
  alternative: ‘പെസഹാപ്പെരുന്നാൾ’ എന്ന് മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കുക.
  rationale: ഈ ഭാഗത്തിന്റെ സന്ദർഭം പെസഹയാണെങ്കിലും ഈ വാക്യത്തിലെ ഗ്രീക്ക് പാഠം ἑορτή (‘പെരുന്നാൾ/ഉത്സവം’) എന്നു മാത്രമാണ് പറയുന്നത്; അതിനാൽ വ്യക്തീകരണം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ഗ്രീക്ക് വാക്യത്തിലെ രണ്ട് സാധ്യതകളുള്ള അനുമാനം (‘വാങ്ങുക’ അല്ലെങ്കിൽ ‘കൊടുക്കുക’) പരിഹരിക്കാതെ നിലനിർത്തിയിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
