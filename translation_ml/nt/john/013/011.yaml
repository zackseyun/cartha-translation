    issue: Awkward punctuation and quotation-complement construction
    rationale: ‘അതുകൊണ്ടാണ്, … എന്ന് അദ്ദേഹം പറഞ്ഞത്’ contains an unnecessary comma and is stylistically less smooth in modern Malayalam. Recasting it as ‘അതിനാലാണ് അദ്ദേഹം, “…,” എന്നു പറഞ്ഞത്’ retains the Greek causal connection and direct quotation.
  - severity: low
    issue: Direct expression of πάντες ἐστε
    rationale: ‘നിങ്ങളെല്ലാവരും ശുദ്ധരല്ല’ more directly expresses ‘not all of you are clean’ than ‘നിങ്ങളിൽ എല്ലാവരും ശുദ്ധരല്ല,’ without changing the meaning.
  - severity: low
    issue: Footnote spelling
    rationale: ‘ഏൽപ്പിച്ചുകൊടുക്കുന്നവനെ’ is the standard spelling for the literal alternative.
