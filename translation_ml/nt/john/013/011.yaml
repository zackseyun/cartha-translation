id: JHN.13.11
reference: John 13:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ᾔδει γὰρ τὸν παραδιδόντα αὐτόν· διὰ τοῦτο εἶπεν ⸀ὅτι Οὐχὶ πάντες καθαροί ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/011.yaml
  text: For he knew the one who was betraying him; for this reason he said[a], “Not all of you are clean.”
translation:
  language: ml
  text: കാരണം, തന്നെ ഒറ്റിക്കൊടുക്കുന്നവനെ[a] യേശുവിന് അറിയാമായിരുന്നു. അതിനാലാണ് അദ്ദേഹം, “നിങ്ങളെല്ലാവരും ശുദ്ധരല്ല,” എന്നു പറഞ്ഞത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, “തന്നെ ഏൽപ്പിച്ചുകൊടുക്കുന്നവനെ.” ഈ സന്ദർഭത്തിൽ ഇത് യൂദാസ് യേശുവിനെ ഒറ്റിക്കൊടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: അറിയാമായിരുന്നു
  rationale: οἶδα എന്ന ക്രിയാരൂപം ഇവിടെ യേശുവിന്റെ അന്നത്തെ നിലനിന്ന അറിവിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘അറിയാമായിരുന്നു’ സ്വാഭാവികമായ ആഖ്യാനരൂപമാണ്.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ പ്രസ്താവനയ്ക്കുള്ള വിശദീകരണമാണ് γάρ നൽകുന്നത്; ‘കാരണം’ ആ ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: τὸν παραδιδόντα αὐτόν
  choice: തന്നെ ഒറ്റിക്കൊടുക്കുന്നവനെ
  rationale: παραδίδωμι എന്നതിന് അക്ഷരാർഥത്തിൽ ‘കൈമാറുക/ഏല്പിച്ചുകൊടുക്കുക’ എന്നാണെങ്കിലും, യോഹന്നാന്റെ പീഡാനുഭവവിവരണത്തിൽ യൂദാസിന്റെ വഞ്ചനാപരമായ പ്രവൃത്തിയാണ് ഉദ്ദേശിക്കുന്നത്. ‘ഒറ്റിക്കൊടുക്കുന്നവൻ’ ആ സന്ദർഭാർഥവും വർത്തമാനകൃദന്തരൂപത്തിന്റെ ഭാവവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: διὰ τοῦτο
  choice: അതുകൊണ്ടാണ്
  rationale: യേശുവിന്റെ അറിവും തുടർന്നുള്ള പ്രസ്താവനയും തമ്മിലുള്ള കാരണബന്ധം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: εἶπεν ὅτι
  choice: എന്ന് അദ്ദേഹം പറഞ്ഞത്
  rationale: ὅτι കൊണ്ടാരംഭിക്കുന്ന നേരിട്ടുള്ള ഉദ്ധരണി മലയാളത്തിൽ ഉദ്ധരണിക്കു ശേഷമുള്ള ‘എന്ന് ... പറഞ്ഞു’ എന്ന സ്വാഭാവിക ഘടനയിൽ പ്രതിനിധീകരിക്കുന്നു.
- source_word: Οὐχὶ πάντες
  choice: നിങ്ങളിൽ എല്ലാവരും ... അല്ല
  rationale: അഭിസംബോധന ചെയ്യപ്പെടുന്നവരിൽ എല്ലാവർക്കും പ്രസ്താവന ബാധകമല്ലെന്ന അർഥം നൽകുന്നു; ‘ആരും അല്ല’ എന്ന അർഥത്തിലേക്ക് മാറാതിരിക്കാൻ ‘നിങ്ങളിൽ’ ചേർത്തിരിക്കുന്നു.
- source_word: καθαροί
  choice: ശുദ്ധർ
  rationale: കാലുകഴുകൽസന്ദർഭത്തിലെ ദേഹശുദ്ധിയുടെയും ആന്തരിക/ആത്മീയ ശുദ്ധിയുടെയും ഇരട്ടധ്വനി ‘ശുദ്ധർ’ നിലനിർത്തുന്നു; ‘നിർമലർ’ എന്നത് അർഥത്തെ ധാർമ്മികതയിലേക്ക് മാത്രം ചുരുക്കാം.
- source_word: ἐστε
  choice: ആണ് (അല്ല എന്ന നിഷേധഘടനയിൽ)
  rationale: ബഹുവചന വർത്തമാനകാല സംയോജകക്രിയ മലയാളത്തിലെ സ്വാഭാവിക നിഷേധപ്രയോഗമായ ‘ശുദ്ധരല്ല’ എന്നതിൽ ഉൾക്കൊള്ളുന്നു.
theological_decisions:
- issue: യൂദാസിന്റെ പ്രവൃത്തിയുമായി ബന്ധപ്പെട്ട παραδιδόντα എന്ന പദത്തിന്റെ അർഥം
  choice: ഒറ്റിക്കൊടുക്കുന്നവൻ
  alternative: ഏല്പിച്ചുകൊടുക്കുന്നവൻ
  rationale: മൂലപദത്തിന്റെ അക്ഷരാർഥം ‘ഏല്പിച്ചുകൊടുക്കുക/കൈമാറുക’ എന്നതാണെങ്കിലും, ഈ സന്ദർഭത്തിൽ വഞ്ചനാപരമായി ശത്രുക്കളുടെ കൈയിൽ ഏല്പിക്കുന്നതാണ് ഉദ്ദേശ്യം. മുഖ്യവാചകം സന്ദർഭാർഥം നൽകുകയും അടിക്കുറിപ്പ് അക്ഷരാർഥം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- issue: കാലുകഴുകൽപ്രഭാഷണത്തിലെ καθαροί എന്ന പദത്തിന്റെ അർഥം
  choice: ശുദ്ധർ
  alternative: നിർമലർ
  rationale: ‘ശുദ്ധർ’ എന്നത് കഴുകലിന്റെ ദൃശ്യാർഥവും ആന്തരിക ശുദ്ധിയുടെ സൂചനയും ഒരുമിച്ച് നിലനിർത്തുന്നു; അർഥത്തെ വെറും ധാർമ്മിക വിഭാഗമായി തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘യേശുവിന്’ എന്നു വ്യക്തമാക്കിയത് ഒറ്റപ്പെട്ട വാക്യമായും വായിക്കുമ്പോൾ സർവനാമത്തിന്റെ കർത്താവ് വ്യക്തമാകാൻ സഹായിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം അതു വിശദീകരിക്കുന്ന ‘ഒറ്റിക്കൊടുക്കുന്നവനെ’ എന്ന പദബന്ധത്തോടുതന്നെ ചേർത്തിരിക്കുന്നു.
