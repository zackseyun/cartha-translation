reference: John 13:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂εἰ ὁ θεὸς ἐδοξάσθη ἐν αὐτῷ,⸃ καὶ ὁ θεὸς δοξάσει αὐτὸν ἐν ⸀αὑτῷ, καὶ εὐθὺς δοξάσει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/032.yaml
  text: If God was glorified in him[a], God will also glorify him in himself[b], and will glorify him at once.
translation:
  language: ml
  text: ദൈവം അവനിൽ മഹത്ത്വപ്പെട്ടുവെങ്കിൽ[a], ദൈവവും അവനെ തന്നിൽത്തന്നെ[b] മഹത്ത്വപ്പെടുത്തും; ഉടൻതന്നെ അവനെ മഹത്ത്വപ്പെടുത്തുകയും ചെയ്യും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദൈവം അവനിൽ മഹത്ത്വപ്പെട്ടതിനാൽ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിൽ ‘എങ്കിൽ’ എന്നർഥമുള്ള εἰ ആണ് ഉപയോഗിച്ചിരിക്കുന്നത്; എന്നാൽ സന്ദർഭത്തിൽ ഈ വ്യവസ്ഥ സത്യമായി കരുതപ്പെടുന്നതായിരിക്കാം.
    reason: alternative_reading
  - marker: b
    text: ‘തന്നിൽത്തന്നെ’ എന്നത് ‘തന്നോടൊപ്പം’ എന്നോ ‘സ്വയം’ എന്നോ മനസ്സിലാക്കാനും കഴിയും; ഗ്രീക്ക് പ്രയോഗം ചുരുക്കമുള്ളതും ദൈവശാസ്ത്രപരമായി സാന്ദ്രവുമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: എങ്കിൽ
  rationale: ഗ്രീക്കിലെ സോപാധിക കണികയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ ഈ വ്യവസ്ഥ സത്യമായി കരുതപ്പെടുന്നുവെങ്കിലും, മുഖ്യപാഠത്തിൽ അതിനെ കാരണാർഥമാക്കി മാറ്റുന്നില്ല.
- source_word: ἐδοξάσθη
  choice: മഹത്ത്വപ്പെട്ടു
  rationale: δοξάζω എന്ന ക്രിയയുടെ aorist passive രൂപം ചുരുക്കമായും സ്വാഭാവികമായും നൽകുകയും കർത്തരിപ്രയോഗമാക്കി മാറ്റാതെ നിഷ്ക്രിയഭാവം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐν αὐτῷ
  choice: അവനിൽ
  rationale: ἐν എന്ന പദത്തിന്റെ അടിസ്ഥാനാർഥവും യോഹന്നാനിലെ സാന്ദ്രമായ പ്രയോഗവും നിലനിർത്തുന്നു; ‘അവനിലൂടെ’ എന്നു വ്യാഖ്യാനിച്ച് അർഥം പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: δοξάσει
  choice: മഹത്ത്വപ്പെടുത്തും
  rationale: മുമ്പുള്ള δοξάζω-യുമായുള്ള പദബന്ധവും ഭാവികാലവും നിലനിർത്തുന്നു; ‘ബഹുമാനിക്കും’ എന്നത് ഈ സന്ദർഭത്തിൽ അർഥബലം കുറയ്ക്കും.
- source_word: ἐν αὑτῷ
  choice: തന്നിൽത്തന്നെ
  rationale: പ്രതിഫലന സർവനാമം ദൈവത്തിലേക്കാണ് മടങ്ങിച്ചൂണ്ടുന്നത്. ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സാന്ദ്രത നിലനിർത്തുകയും ‘തന്നോടൊപ്പം’ അല്ലെങ്കിൽ ‘സ്വയം’ എന്ന ഒറ്റ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: εὐθύς
  choice: ഉടൻതന്നെ
  rationale: സംഭവത്തിന്റെ തൽക്ഷണത സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: സന്ദർഭത്തിൽ സത്യമായി കരുതപ്പെടുന്ന കാര്യത്തെ εἰ സോപാധികമായി അവതരിപ്പിക്കുന്നത്
  choice: മുഖ്യപാഠത്തിൽ ‘ദൈവം അവനിൽ മഹത്ത്വപ്പെട്ടുവെങ്കിൽ’ എന്നു നിലനിർത്തി
  alternative: ‘ദൈവം അവനിൽ മഹത്ത്വപ്പെട്ടതിനാൽ’
  rationale: സന്ദർഭം വ്യവസ്ഥ സത്യമാണെന്ന് ശക്തമായി സൂചിപ്പിച്ചാലും ഗ്രീക്കിൽ വ്യക്തമായ കാരണസൂചകമല്ല, εἰ തന്നെയാണ്. അതിനാൽ പാഠത്തിലെ വ്യാകരണപരവും ദൈവശാസ്ത്രപരവുമായ സംഘർഷം നിലനിർത്തി, സന്ദർഭപരമായ അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ἐν αὑτῷ എന്ന പ്രയോഗത്തിൽ ദൈവവും പുത്രനും തമ്മിലുള്ള മഹത്ത്വപ്പെടുത്തലിന്റെ ബന്ധം
  choice: ‘തന്നിൽത്തന്നെ’ എന്ന സാന്ദ്രമായ രൂപം നിലനിർത്തി
  alternative: ‘തന്നോടൊപ്പം’ അല്ലെങ്കിൽ ‘സ്വയം’
  rationale: ഗ്രീക്ക് വാചകം ഈ ബന്ധത്തിന്റെ കൃത്യസ്വഭാവം വിശദീകരിക്കുന്നില്ല. കൂടുതൽ വ്യാഖ്യാനാത്മകമായ മലയാളരൂപം തിരഞ്ഞെടുത്താൽ പരസ്പര മഹത്ത്വപ്പെടുത്തലിന്റെ തുറന്ന അർഥസാധ്യത അനാവശ്യമായി ചുരുങ്ങും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. δοξάζω ആവർത്തിക്കുന്നിടത്തെല്ലാം ‘മഹത്ത്വപ്പെടുക/മഹത്ത്വപ്പെടുത്തുക’ എന്ന ഒരേ പദകുടുംബം ഉപയോഗിച്ച് മൂലപാഠത്തിലെ ആവർത്തനവും ആശയബന്ധവും നിലനിർത്തി.
