  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶτα βάλλει ὕδωρ εἰς τὸν νιπτῆρα, καὶ ἤρξατο νίπτειν τοὺς πόδας τῶν μαθητῶν καὶ ἐκμάσσειν τῷ λεντίῳ ᾧ ἦν διεζωσμένος.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/005.yaml
  text: Then he pours water into the washbasin[b][a], and began to wash the disciples’ feet and to wipe them with the towel with which he was girded.
translation:
  language: ml
  text: പിന്നെ അവൻ കഴുകാനുള്ള പാത്രത്തിൽ[a] വെള്ളം ഒഴിച്ചു; ശിഷ്യന്മാരുടെ കാലുകൾ കഴുകാനും അരയിൽ ചുറ്റിയിരുന്ന[b] തൂവാലകൊണ്ട് അവ തുടയ്ക്കാനും തുടങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കഴുകുപാത്രത്തിൽ.’ ഗ്രീക്ക് പദം കഴുകാൻ ഉപയോഗിക്കുന്ന ഒരു പാത്രത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘അവൻ അരയിൽ കെട്ടിയിരുന്ന.’ ഗ്രീക്ക് പ്രയോഗം ശുശ്രൂഷയ്ക്കായി തൂവാല ശരീരത്തിനു ചുറ്റും കെട്ടിയിരുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα
  choice: പിന്നെ
  rationale: വിവരണത്തിലെ തുടർന്നുള്ള പ്രവൃത്തിയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: βάλλει ὕδωρ
  choice: വെള്ളം ഒഴിച്ചു
  rationale: βάλλω എന്നതിന് പൊതുവേ ‘ഇടുക’ എന്ന അർഥമുണ്ടെങ്കിലും, ഒരു പാത്രത്തിലേക്ക് വെള്ളം ഇടുന്ന സന്ദർഭത്തിൽ ‘ഒഴിക്കുക’ എന്നതാണ് സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: νιπτῆρα
  choice: കഴുകാനുള്ള പാത്രം
  rationale: കഴുകുന്നതിനായി ഉപയോഗിക്കുന്ന പാത്രം എന്ന പദത്തിന്റെ പ്രവർത്തനപരമായ അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: ἤρξατο νίπτειν
  choice: കഴുകാൻ തുടങ്ങി
  rationale: ἄρχομαι + infinitive സൂചിപ്പിക്കുന്ന പ്രവൃത്തിയുടെ ആരംഭം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: τοὺς πόδας τῶν μαθητῶν
  choice: ശിഷ്യന്മാരുടെ കാലുകൾ
  rationale: ഗ്രീക്ക് ഷഷ്ഠീവ്യാകരണബന്ധം സ്വാഭാവികമായ മലയാള ഉടമസ്ഥപ്രയോഗത്തിലൂടെ നൽകുന്നു.
- source_word: ἐκμάσσειν
  choice: അവ തുടയ്ക്കാൻ
  rationale: കാലുകളെ തുണികൊണ്ട് തുടയ്ക്കുകയോ ഉണക്കുകയോ ചെയ്യുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘അവ’ എന്നത് കാലുകളെ വ്യക്തമായി തിരിച്ചുസൂചിപ്പിക്കുന്നു.
- source_word: τῷ λεντίῳ
  choice: തൂവാലകൊണ്ട്
  rationale: തുടയ്ക്കാൻ ഉപയോഗിക്കുന്ന തുണിയെ സന്ദർഭോചിതവും ആധുനികവുമായ ഭാഷയിൽ വ്യക്തമാക്കുന്നു.
- source_word: ᾧ ἦν διεζωσμένος
  choice: അരയിൽ ചുറ്റിയിരുന്ന
  rationale: തൂവാല ശരീരത്തിനു ചുറ്റും കെട്ടിയിരുന്നതായി സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി ഉപയോഗിച്ചു. ഗ്രീക്കിലെ ചരിത്രവർത്തമാനമായ βάλλει മലയാളത്തിലെ തുടർച്ചയായ ഭൂതകാലവിവരണത്തിന് യോജിച്ച് ‘ഒഴിച്ചു’ എന്നു നൽകി; ἤρξατο സൂചിപ്പിക്കുന്ന പ്രവൃത്തിയുടെ ആരംഭം ‘തുടങ്ങി’ എന്നതിലൂടെ നിലനിർത്തി.
