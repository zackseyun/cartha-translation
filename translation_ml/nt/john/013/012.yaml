id: JHN.13.12
reference: John 13:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὅτε οὖν ἔνιψεν τοὺς πόδας αὐτῶν ⸀καὶ ἔλαβεν τὰ ἱμάτια αὐτοῦ ⸂καὶ ἀνέπεσεν⸃, πάλιν εἶπεν αὐτοῖς· Γινώσκετε τί πεποίηκα ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/013/012.yaml
  text: So when he had washed their feet and taken his garments and reclined again[a], he said to them[b], “Do you understand what I have done for you?”
translation:
  language: ml
  text: 'അങ്ങനെ, അവൻ അവരുടെ കാലുകൾ കഴുകി, തന്റെ വസ്ത്രങ്ങൾ എടുത്ത്, വീണ്ടും ഭക്ഷണമേശയ്ക്കരികിൽ ചാരിക്കിടന്നശേഷം[a], അവരോടു പറഞ്ഞു: “ഞാൻ നിങ്ങൾക്കുവേണ്ടി ചെയ്തത് എന്താണെന്ന് നിങ്ങൾ മനസ്സിലാക്കുന്നുണ്ടോ[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വീണ്ടും ഇരുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്ക് ക്രിയ ഭക്ഷണമേശയ്ക്കരികിൽ ചാരിക്കിടക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ഞാൻ നിങ്ങളോടു ചെയ്തത് എന്താണെന്ന്’ എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്കിലെ ദത്തിവിഭക്തിക്ക് രണ്ടർത്ഥവും സാധ്യമാണ്, എങ്കിലും സേവനത്തിന്റെ ഈ സന്ദർഭത്തിൽ ‘നിങ്ങൾക്കുവേണ്ടി’ കൂടുതൽ യോജിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅτε οὖν
  choice: അങ്ങനെ, ... ശേഷം
  rationale: ὅτε എന്നതിന്റെ കാലസൂചനയും οὖν എന്നതിന്റെ ആഖ്യാനബന്ധവും സ്വാഭാവികമായ മലയാളത്തിൽ ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: ἔνιψεν τοὺς πόδας αὐτῶν
  choice: അവരുടെ കാലുകൾ കഴുകി
  rationale: ഗ്രീക്കിലെ ക്രിയയും കർമവും നേരിട്ട്, സ്വാഭാവികമായ മലയാളവാക്യക്രമത്തിൽ നൽകുന്നു.
- source_word: ἔλαβεν τὰ ἱμάτια αὐτοῦ
  choice: തന്റെ വസ്ത്രങ്ങൾ എടുത്ത്
  rationale: ἔλαβεν എന്നതിന്റെ അടിസ്ഥാനാർത്ഥമായ ‘എടുത്തു’ നിലനിർത്തുന്നു; ‘ധരിച്ചു’ എന്ന് വ്യാഖ്യാനിച്ച് ചേർക്കുന്നില്ല. ἱμάτια ഇവിടെ പൊതുവായി ‘വസ്ത്രങ്ങൾ’ എന്നാണ്.
- source_word: ἀνέπεσεν
  choice: വീണ്ടും ഭക്ഷണമേശയ്ക്കരികിൽ ചാരിക്കിടന്നശേഷം
  rationale: പുരാതനകാലത്തെ ഭക്ഷണസമയത്തെ ചാരിക്കിടക്കുന്ന ശരീരനില വ്യക്തമാക്കുന്നു; മലയാളത്തിലെ ‘ഇരുന്നു’ എന്ന പതിവുപ്രയോഗം ചരിത്രപരമായ ദൃശ്യത്തെ മറയ്ക്കാതിരിക്കാൻ ഭക്ഷണമേശയുടെ സന്ദർഭം സംക്ഷിപ്തമായി വ്യക്തമാക്കിയിരിക്കുന്നു.
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: ആവർത്തനത്തെ സൂചിപ്പിക്കുന്ന ക്രിയാവിശേഷണത്തിന്റെ നേരിട്ടുള്ള മലയാളപരിഭാഷ.
- source_word: Γινώσκετε
  choice: മനസ്സിലാക്കുന്നുണ്ടോ
  rationale: ചെയ്ത പ്രവൃത്തിയുടെ അർത്ഥം ഗ്രഹിക്കുന്നതിനെക്കുറിച്ചുള്ള ചോദ്യമായതിനാൽ ‘അറിയുന്നുണ്ടോ’ എന്നതിനെക്കാൾ സന്ദർഭോചിതം.
- source_word: τί πεποίηκα ὑμῖν
  choice: ഞാൻ നിങ്ങൾക്കുവേണ്ടി ചെയ്തത് എന്താണെന്ന്
  rationale: പൂർണ്ണകാലക്രിയയുടെ ഇപ്പോഴും പ്രസക്തമായ ഫലം മലയാളത്തിൽ സ്വാഭാവികമായി ‘ചെയ്തത്’ എന്ന രൂപത്തിൽ വരുന്നു. ὑμῖν എന്ന ദത്തിവിഭക്തിക്ക് സന്ദർഭത്തിലെ സേവനഭാവം അനുസരിച്ച് ‘നിങ്ങൾക്കുവേണ്ടി’ എടുത്തു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: കാലുകൾ കഴുകിയശേഷമുള്ള യേശുവിന്റെ ഭക്ഷണമേശയിലെ ശരീരനില
  choice: ഭക്ഷണമേശയ്ക്കരികിൽ ചാരിക്കിടന്നു
  alternative: വീണ്ടും ഇരുന്നു / വീണ്ടും മേശയിൽ തന്റെ സ്ഥാനം സ്വീകരിച്ചു
  rationale: ἀναπίπτω ഭക്ഷണസന്ദർഭത്തിൽ മേശയ്ക്കരികിൽ ചാരിക്കിടക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ചരിത്രപരമായ ദൃശ്യം കൃത്യമായി നിലനിർത്തുന്നു; പ്രത്യേക ഉപദേശപരമായ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: τί πεποίηκα ὑμῖν എന്നതിലെ ὑμῖν-ന്റെ അർത്ഥവ്യാപ്തി
  choice: നിങ്ങൾക്കുവേണ്ടി ചെയ്തത്
  alternative: നിങ്ങളോടു ചെയ്തത്
  rationale: ദത്തിവിഭക്തിക്ക് രണ്ടുവിധ പരിഭാഷയും സാധ്യമാണ്. കാലുകഴുകലിന്റെ സേവനസന്ദർഭത്തിൽ ഗുണഭോക്തൃഭാവമുള്ള ‘നിങ്ങൾക്കുവേണ്ടി’ മുഖ്യപാഠത്തിൽ സ്വാഭാവികമാണ്; യഥാർഥ ഭാഷാപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. പുരാതന ഭക്ഷണരീതി മനസ്സിലാകാൻ ‘ഭക്ഷണമേശയ്ക്കരികിൽ’ എന്ന് വ്യക്തമാക്കിയെങ്കിലും ക്രിയയിലെ ചാരിക്കിടക്കുന്ന ദൃശ്യം നിലനിർത്തി. വാചകത്തിലെ എല്ലാ അടിക്കുറിപ്പുകൾക്കും മുഖ്യപാഠത്തിൽ [a], [b] അടയാളങ്ങൾ നൽകിയിരിക്കുന്നു.
