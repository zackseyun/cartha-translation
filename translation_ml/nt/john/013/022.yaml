  text: ⸀ἔβλεπον εἰς ἀλλήλους οἱ μαθηταὶ ἀπορούμενοι περὶ τίνος λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/022.yaml
  text: The disciples were looking at one another, at a loss about whom he was speaking.
translation:
  language: ml
  text: അവൻ ആരെക്കുറിച്ചാണു പറയുന്നതെന്നറിയാതെ ശിഷ്യന്മാർ പരസ്പരം നോക്കിക്കൊണ്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘അവൻ ആരെക്കുറിച്ചാണു പറയുന്നതെന്നറിയാതെ, ആശയക്കുഴപ്പത്തോടെ ശിഷ്യന്മാർ പരസ്പരം നോക്കിക്കൊണ്ടിരുന്നു.’'
    reason: ἀπορούμενοι എന്ന പങ്കുപദത്തിലെ ആശയക്കുഴപ്പത്തിന്റെയും നിശ്ചയമില്ലായ്മയുടെയും ഭാവം കൂടുതൽ പ്രകടമാക്കുന്ന പദാന്തരം.
lexical_decisions:
- source_word: ἔβλεπον
  choice: നോക്കിക്കൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം തുടരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; രംഗത്തിന്റെ ദൈർഘ്യഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: εἰς ἀλλήλους
  choice: പരസ്പരം
  rationale: ശിഷ്യന്മാർ അന്യോന്യം നോക്കിയതിനെ ചുരുക്കവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: οἱ μαθηταὶ
  choice: ശിഷ്യന്മാർ
  rationale: സന്ദർഭത്തിൽ ഇതിനകം അറിയപ്പെടുന്ന ശിഷ്യസംഘത്തെയാണ് നിർദ്ദിഷ്ട ആർട്ടിക്കിൾ സൂചിപ്പിക്കുന്നത്; ഗ്രീക്കിൽ ഇല്ലാത്ത ‘അവന്റെ’ എന്നത് ചേർത്തിട്ടില്ല.
- source_word: ἀπορούμενοι
  choice: മനസ്സിലാകാതെ
  rationale: ആരെ ഉദ്ദേശിച്ചാണ് പറയുന്നതെന്ന കാര്യത്തിലുള്ള ആശയക്കുഴപ്പവും നിശ്ചയമില്ലായ്മയും സാധാരണ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: περὶ τίνος
  choice: ആരെക്കുറിച്ചാണ്
  rationale: περί സഹിതമുള്ള ചോദക സർവനാമം പ്രസ്താവന ഏതു വ്യക്തിയെക്കുറിച്ചാണെന്ന് ചോദിക്കുന്നു.
- source_word: λέγει
  choice: പറയുന്നതെന്ന്
  rationale: ചരിത്രവർത്തമാനകാലത്തിലുള്ള ഗ്രീക്ക് ക്രിയയെ മലയാള പരോക്ഷവാക്യത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; ‘ഉദ്ദേശിക്കുന്നത്’ എന്നു വ്യാഖ്യാനിച്ചു ചേർക്കുന്നില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള ആഖ്യാനശൈലി. അപൂർണ ഭൂതകാലത്തിന്റെ തുടർച്ചാഭാവവും മൂലപാഠത്തിലെ നിശ്ചയമില്ലായ്മയും നിലനിർത്തിയിരിക്കുന്നു.
