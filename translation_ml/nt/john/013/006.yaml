id: JHN.13.6
reference: John 13:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔρχεται οὖν πρὸς Σίμωνα Πέτρον. ⸀λέγει ⸀αὐτῷ· Κύριε, σύ μου νίπτεις τοὺς πόδας;
base_translation:
  language: en
  yaml_path: translation/nt/john/013/006.yaml
  text: So he comes to Simon Peter. He says to him[a], “Lord, are you washing my feet?”
translation:
  language: ml
  text: 'അങ്ങനെ അവൻ ശിമോൻ പത്രോസിന്റെ അടുത്തേക്ക് വരുന്നു. പത്രോസ് അവനോടു ചോദിക്കുന്നു: “കർത്താവേ,[a] അങ്ങ് എന്റെ കാലുകൾ കഴുകുകയാണോ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അയ്യാ.” ഗ്രീക്കിലെ κύριε ബഹുമാനപൂർവമായ അഭിസംബോധനയായും ഉപയോഗിക്കാം; ഇവിടെ “കർത്താവേ” എന്ന പരിഭാഷയാണ് സ്വീകരിച്ചിരിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔρχεται
  choice: അടുത്തെത്തുന്നു
  rationale: യോഹന്നാന്റെ ആഖ്യാനത്തിലെ ചരിത്രവർത്തമാനകാലം നിലനിർത്തുന്നു; ശിമോൻ പത്രോസിന്റെ അടുത്തേക്കുള്ള ചലനവും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: οὖν
  choice: അങ്ങനെ
  rationale: മുൻവിവരണത്തിൽനിന്നുള്ള ആഖ്യാനപുരോഗതി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: πρὸς Σίμωνα Πέτρον
  choice: ശിമോൻ പത്രോസിന്റെ അടുത്ത്
  rationale: πρός സഹിതമുള്ള വ്യക്തിയിലേക്കുള്ള ചലനം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: λέγει αὐτῷ
  choice: പത്രോസ് അവനോടു ചോദിക്കുന്നു
  rationale: ഗ്രീക്കിൽ കർത്താവ് സന്ദർഭത്തിൽനിന്ന് മനസ്സിലാകുന്ന ശിമോൻ പത്രോസാണ്; ഉദ്ധരിച്ച വാക്ക് ചോദ്യം ആയതിനാൽ ‘ചോദിക്കുന്നു’ സ്വാഭാവികവും അർത്ഥസത്യവുമാണ്. ചരിത്രവർത്തമാനകാലവും നിലനിർത്തുന്നു.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: ബഹുമാനസംബോധനയും യോഹന്നാനിലെ ക്രിസ്തുശാസ്ത്രപരമായ അനുരണനവും സംരക്ഷിക്കുന്ന പതിവ് പരിഭാഷ.
- source_word: σύ
  choice: അങ്ങാണോ
  rationale: പ്രകടമായ σύ നൽകുന്ന ഊന്നൽ ‘അങ്ങാണോ’ എന്ന ചോദ്യഘടനയിലൂടെ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: μου
  choice: എന്റെ
  rationale: കാലുകളോടുള്ള ഉടമസ്ഥബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: νίπτεις
  choice: കഴുകുന്നത്
  rationale: ശരീരത്തിന്റെ ഒരു ഭാഗം കഴുകുന്നതിനെ സൂചിപ്പിക്കുന്നു; നടന്നുകൊണ്ടിരിക്കുന്ന പ്രവൃത്തിയെക്കുറിച്ചുള്ള പത്രോസിന്റെ അമ്പരപ്പുള്ള ചോദ്യം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τοὺς πόδας
  choice: കാലുകൾ
  rationale: μου-യോടൊപ്പം ‘എന്റെ കാലുകൾ’ എന്നതാണ് സ്വാഭാവിക മലയാളപ്രയോഗം.
theological_decisions:
- issue: യേശുവിനെ അഭിസംബോധന ചെയ്യുന്ന Κύριε എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: കർത്താവേ
  alternative: യജമാനനേ / പ്രഭോ
  rationale: ഇവിടെ പദം ബഹുമാനപൂർവമായ അഭിസംബോധനയായിരിക്കാം; അതേസമയം യോഹന്നാന്റെ സുവിശേഷത്തിലെ ക്രിസ്തുശാസ്ത്രപരമായ ആഴവും ഉണ്ടായേക്കാം. ‘കർത്താവേ’ ഈ രണ്ടു സാധ്യതകളും അമിതമായി നിർണയിക്കാതെ നിലനിർത്തുന്നു; മറ്റ് സാധ്യത footnote-ൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ രണ്ടു ചരിത്രവർത്തമാനകാല ക്രിയകളും മലയാളത്തിൽ വർത്തമാനകാലമായി നിലനിർത്തി. അമ്പരപ്പും ഊന്നലും ‘അങ്ങാണോ’ എന്ന ഘടനയിലൂടെ പ്രകടിപ്പിച്ചു.
