revisions:
- from: 'അങ്ങനെ അവൻ ശിമോൻ പത്രോസിന്റെ അടുത്തെത്തുന്നു. പത്രോസ് അവനോടു ചോദിക്കുന്നു: “കർത്താവേ,[a] അങ്ങാണോ എന്റെ കാലുകൾ കഴുകുന്നത്?”'
  to: 'അങ്ങനെ അവൻ ശിമോൻ പത്രോസിന്റെ അടുത്തേക്ക് വരുന്നു. പത്രോസ് അവനോടു ചോദിക്കുന്നു: “കർത്താവേ,[a] അങ്ങ് എന്റെ കാലുകൾ കഴുകുകയാണോ?”'
  rationale: The revision preserves the narrative historical present, Peter’s emphatic and startled question, and the default rendering of Κύριε. It makes the movement verb and progressive question more direct and idiomatic in modern standard Malayalam, and refines the alternative-reading footnote.
