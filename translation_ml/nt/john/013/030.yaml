source:
  edition: SBLGNT
  text: λαβὼν οὖν τὸ ψωμίον ἐκεῖνος ⸂ἐξῆλθεν εὐθύς⸃. ἦν δὲ νύξ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/030.yaml
  text: So after taking the piece of bread[a], he went out immediately[c][b]. And it was night.
translation:
  language: ml
  text: അങ്ങനെ, ആ അപ്പക്കഷണം[a] എടുത്തശേഷം, അയാൾ[b] ഉടനെ പുറത്തേക്കു പോയി. രാത്രിയായിരുന്നു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആ ഭക്ഷണക്കഷണം’ എന്നും പരിഭാഷപ്പെടുത്താം. ψωμίον എന്ന ഗ്രീക്കുപദം ഭക്ഷണസമയത്ത് നൽകുന്ന ചെറിയ അപ്പക്കഷണത്തെയോ ഭക്ഷണക്കഷണത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ അക്ഷരാർഥം ‘ആ ഒരുവൻ.’ ലളിതമായ ‘അവൻ’ എന്നതിനേക്കാൾ ഈ പ്രയോഗത്തിന് ഊന്നൽ കൂടുതലാണ്; ഇവിടെ അത് യൂദാസിലേക്കു ശ്രദ്ധ തിരിക്കുന്നതാകാം.
    reason: lexical_alternative
  - marker: c
    text: ‘രാത്രിയായിരുന്നു’ എന്നത് നേരിട്ടുള്ള സമയസൂചനയാണ്; അതോടൊപ്പം യോഹന്നാന്റെ സുവിശേഷത്തിലെ വെളിച്ചം–ഇരുട്ട് പ്രമേയത്തെ ഇത് പ്രതിധ്വനിപ്പിക്കുന്നതുമാകാം.
    reason: cross_reference
lexical_decisions:
- source_word: λαβὼν
  choice: വാങ്ങിയശേഷം
  rationale: Aorist participle പ്രധാനക്രിയയ്ക്കു മുമ്പുണ്ടായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. സ്വാഭാവികമായ മലയാളത്തിൽ സംഭവക്രമം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: οὖν
  choice: അതിനാൽ
  rationale: മുൻവിവരണത്തിന്റെ ഫലമായുള്ള ആഖ്യാനപുരോഗതി സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിലെ അനുമാനബന്ധവും നിലനിർത്തുന്നു.
- source_word: τὸ ψωμίον
  choice: ആ അപ്പക്കഷണം
  rationale: ψωμίον ഭക്ഷണസമയത്ത് നൽകിയ ചെറിയ അപ്പക്കഷണത്തെയോ ഭക്ഷണക്കഷണത്തെയോ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ പ്രയോഗമാണിത്.
- source_word: ἐκεῖνος
  choice: അയാൾ
  rationale: ലളിതമായ ‘അവൻ’ എന്നതിനേക്കാൾ അല്പം അകലം പാലിക്കുന്ന പരാമർശമായതിനാൽ ഗ്രീക്കിലെ അടയാളപ്പെടുത്തിയ ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; കൂടുതൽ കൃത്രിമമായ ‘അവൻതന്നെ’ ഒഴിവാക്കുന്നു.
- source_word: ἐξῆλθεν
  choice: പുറത്തേക്കു പോയി
  rationale: സ്ഥലത്തുനിന്ന് പുറത്തേക്കുള്ള നീക്കം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: εὐθύς
  choice: ഉടനെ
  rationale: പ്രവൃത്തിയുടെ തൽക്ഷണത കൃത്യവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: ἦν δὲ νύξ
  choice: അപ്പോൾ രാത്രിയായിരുന്നു
  rationale: സമയസൂചന ലളിതമായി നിലനിർത്തുകയും ഗ്രീക്കിലെ ആഖ്യാനമാറ്റം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുകയും ചെയ്യുന്നു; പ്രതീകാർഥം മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: യോഹന്നാന്റെ സന്ദർഭത്തിൽ ‘രാത്രി’ എന്നതിന്റെ സാധ്യതയുള്ള പ്രതീകാർഥം
  choice: ‘അപ്പോൾ രാത്രിയായിരുന്നു’ എന്ന അക്ഷരാർഥ സമയസൂചനയായി പരിഭാഷപ്പെടുത്തി.
  alternative: ആത്മീയ അന്ധകാരത്തിന്റെ പ്രതീകമാണെന്ന് മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കുക.
  rationale: വെളിച്ചം–ഇരുട്ട് പ്രമേയം യോഹന്നാനിൽ പ്രധാനമാണെങ്കിലും ഇവിടെ ഗ്രീക്ക് വാചകം നേരിട്ടുള്ള സമയസൂചനയാണ്. സാധ്യതയുള്ള സാഹിത്യപ്രതിധ്വനി അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ച് മുഖ്യവാചകത്തിലെ അർഥതുറപ്പ് സംരക്ഷിക്കുന്നു.
- issue: യൂദാസിനെ സൂചിപ്പിക്കുന്ന ἐκεῖνος എന്ന പദത്തിന്റെ ഊന്നൽ
  choice: ‘അയാൾ’ എന്ന് നൽകി, സാധാരണ ‘അവൻ’ എന്നതിനേക്കാൾ അകലം സൂചിപ്പിച്ചു.
  alternative: ‘അവൻ’ അല്ലെങ്കിൽ കൂടുതൽ അക്ഷരാർഥമായി ‘അവൻതന്നെ/ആ ഒരുവൻ’.
  rationale: ഗ്രീക്കിലെ demonstrative രൂപത്തിന് ആഖ്യാനപരമായ ഊന്നലും അകലവും ഉണ്ടാകാം. ‘അയാൾ’ അത് സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു; അടിക്കുറിപ്പ് അക്ഷരാർഥം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘അപ്പക്കഷണം,’ ‘ഉടനെ,’ ‘പുറത്തേക്കു പോയി’ തുടങ്ങിയ സാധാരണ പ്രയോഗങ്ങൾ ഉപയോഗിച്ചു; ‘അയാൾ’ വഴി മൂലത്തിലെ പരാമർശദൂരം സൂക്ഷ്മമായി നിലനിർത്തി.
