revisions:
- from: അപ്പോൾ ശിമോൻ പത്രോസ് അവനോട് ആംഗ്യം കാണിച്ച്, അദ്ദേഹം ആരെക്കുറിച്ചായിരിക്കാം പറയുന്നതെന്ന് ചോദിക്കാൻ പറഞ്ഞു.[a]
  to: 'അപ്പോൾ ശിമോൻ പത്രോസ് അവനോട് ആംഗ്യം കാണിച്ചു: അദ്ദേഹം ആരെക്കുറിച്ചായിരിക്കാം പറയുന്നതെന്ന് ചോദിക്കണമെന്ന്.'
  rationale: The revision removes the added implication that Peter verbally spoke (“പറഞ്ഞു”) and makes the inquiry the content communicated by his gesture. It preserves the narrative connection of οὖν, the demonstrative reference of τούτῳ, and the tentativeness conveyed by τίς ἂν εἴη.
