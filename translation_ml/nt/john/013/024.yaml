id: JHN.13.24
reference: John 13:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: νεύει οὖν τούτῳ Σίμων Πέτρος ⸂πυθέσθαι τίς ἂν εἴη⸃ περὶ οὗ λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/024.yaml
  text: So Simon Peter motioned to this one to ask who it might be about whom he was speaking[a].
translation:
  language: ml
  text: 'അപ്പോൾ ശിമോൻ പത്രോസ് അവനോട് ആംഗ്യം കാണിച്ചു: അദ്ദേഹം ആരെക്കുറിച്ചായിരിക്കാം പറയുന്നതെന്ന് ചോദിക്കണമെന്ന്.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νεύει
  choice: ആംഗ്യം കാണിച്ച്
  rationale: വാക്കുകളില്ലാതെ അടയാളം കാണിക്കുകയോ സൂചന നൽകുകയോ ചെയ്യുന്ന പ്രവൃത്തിയാണ് ഇവിടെ; ‘തലയാട്ടി’ എന്നതിനെക്കാൾ വിശാലവും സന്ദർഭോചിതവുമാണ് ‘ആംഗ്യം കാണിച്ച്’.
- source_word: οὖν
  choice: അപ്പോൾ
  rationale: മുൻവാക്യത്തിൽനിന്നുള്ള കഥാപരമായ തുടർച്ചയും അതിന്റെ ഫലമായ നടപടിയും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τούτῳ
  choice: അവനോട്
  rationale: സന്ദർഭത്തിൽ ഇതിനകം പരാമർശിക്കപ്പെട്ട ശിഷ്യനെയാണ് സർവനാമം ചൂണ്ടിക്കാണിക്കുന്നത്; മലയാളത്തിൽ ‘ഇവനോട്’ എന്നതിനേക്കാൾ ‘അവനോട്’ സ്വാഭാവികമാണ്.
- source_word: πυθέσθαι
  choice: ചോദിക്കാൻ
  rationale: വിവരം അന്വേഷിച്ചറിയുന്നതിനായി ചോദിക്കുക എന്ന ആശയം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: τίς ἂν εἴη
  choice: ആരെക്കുറിച്ചായിരിക്കാം
  rationale: ἄν സഹിതമുള്ള optative നൽകുന്ന അനിശ്ചിതത്വം ‘ആയിരിക്കാം’ നിലനിർത്തുന്നു; περὶ οὗ എന്ന തുടർന്നുള്ള ഘടനയുമായി മലയാളത്തിൽ സ്വാഭാവികമായി ചേർക്കുന്നു.
- source_word: περὶ οὗ λέγει
  choice: അദ്ദേഹം ആരെക്കുറിച്ച് … പറയുന്നതെന്ന്
  rationale: ‘ആരെക്കുറിച്ച്’ ബന്ധത്തിന്റെ അർഥം വ്യക്തമായി നൽകുന്നു; വർത്തമാനകാല രൂപത്തിന്റെ കഥാപരമായ പ്രവർത്തനം മലയാളത്തിലെ തുടർച്ചാസ്വഭാവമുള്ള ‘പറയുന്നതെന്ന്’ കൊണ്ട് സ്വാഭാവികമാക്കുന്നു.
theological_decisions:
- issue: λέγει എന്ന ക്രിയയുടെ അപ്രകടമായ കർത്താവ്
  choice: ‘അദ്ദേഹം’ എന്ന ബഹുമാനസൂചക സർവനാമം ഉപയോഗിച്ചു
  alternative: ‘യേശു’ എന്ന് പേര് വ്യക്തമാക്കുക
  rationale: ഗ്രീക്കിൽ പേര് ആവർത്തിക്കുന്നില്ല. സന്ദർഭത്തിൽ കർത്താവ് യേശുവാണെന്ന് വ്യക്തമാണെങ്കിലും പേര് ചേർക്കാതെ മൂലവാക്യത്തിന്റെ സർവനാമപരമായ ഘടന നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി സ്വീകരിച്ചു. ‘ആയിരിക്കാം’ ഉപയോഗിച്ച് മൂലത്തിലെ അനിശ്ചിതത്വം സൂക്ഷിച്ചു; ‘അദ്ദേഹം’ യേശുവിനെ ബഹുമാനത്തോടെ സൂചിപ്പിക്കുമ്പോഴും മൂലത്തിൽ ഇല്ലാത്ത പേര് പ്രധാനവാചകത്തിൽ ചേർത്തിട്ടില്ല.
