source:
  edition: SBLGNT
  text: ἐγείρεται ἐκ τοῦ δείπνου καὶ τίθησιν τὰ ἱμάτια καὶ λαβὼν λέντιον διέζωσεν ἑαυτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/004.yaml
  text: He rises from the supper and lays aside his outer garments[a], and taking a towel[b], tied it around himself.
translation:
  language: ml
  text: അവൻ അത്താഴത്തിൽനിന്ന് എഴുന്നേറ്റ് തന്റെ മേലങ്കികൾ അഴിച്ചുവെച്ചു; പിന്നെ ഒരു തുവാല എടുത്ത് അരയിൽ ചുറ്റിക്കെട്ടി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγείρεται
  choice: എഴുന്നേറ്റ്
  rationale: ആഖ്യാനത്തിലെ വർത്തമാനകാലരൂപം സംഭവത്തെ സജീവമായി അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ തുടർന്നുവരുന്ന ക്രിയകളോടൊപ്പം സ്വാഭാവികമായി ചേരാൻ ‘എഴുന്നേറ്റ്’ ഉപയോഗിച്ചു.
- source_word: ἐκ τοῦ δείπνου
  choice: അത്താഴത്തിൽനിന്ന്
  rationale: δεῖπνον ഇവിടെ ഭക്ഷണവേളയെ സൂചിപ്പിക്കുന്നു; യോഹന്നാന്റെ സന്ദർഭത്തിലും മലയാള ബൈബിൾ ഭാഷയിലും ‘അത്താഴം’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: τίθησιν τὰ ἱμάτια
  choice: തന്റെ മേലങ്കികൾ അഴിച്ചുവെച്ചു
  rationale: τίθημι സന്ദർഭത്തിൽ മാറ്റിവെക്കുക എന്ന അർഥത്തിലും ἱμάτια പുറമേ ധരിക്കുന്ന വസ്ത്രങ്ങൾ എന്ന അർഥത്തിലും വരുന്നു. പൂർണമായി നഗ്നനായെന്ന തെറ്റായ ധാരണ ഒഴിവാക്കാൻ ‘മേലങ്കികൾ’ എന്നു വിവർത്തനം ചെയ്തു.
- source_word: λαβὼν λέντιον
  choice: ഒരു തുവാല എടുത്ത്
  rationale: λέντιον സേവനത്തിനുപയോഗിക്കുന്ന തുണി അഥവാ തുവാലയാണ്; ‘തുവാല’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ആധുനിക പദമാണ്.
- source_word: διέζωσεν ἑαυτόν
  choice: അരയിൽ ചുറ്റിക്കെട്ടി
  rationale: διαζώννυμι സ്വയം അരകെട്ടുക, ചുറ്റിക്കെട്ടുക എന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. മുൻപറഞ്ഞ തുവാലയാണ് ചുറ്റിക്കെട്ടിയതെന്ന ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി ഗ്രഹിക്കാം.
