id: JHN.13.1
reference: John 13:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Πρὸ δὲ τῆς ἑορτῆς τοῦ πάσχα εἰδὼς ὁ Ἰησοῦς ὅτι ⸀ἦλθεν αὐτοῦ ἡ ὥρα ἵνα μεταβῇ ἐκ τοῦ κόσμου τούτου πρὸς τὸν πατέρα ἀγαπήσας τοὺς ἰδίους τοὺς ἐν τῷ κόσμῳ εἰς τέλος ἠγάπησεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/001.yaml
  text: Before the Feast of the Passover[a], Jesus, knowing that his hour had come to depart from this world to the Father, having loved his own who were in the world[b], loved them to the end.
translation:
  language: ml
  text: പെസഹാ പെരുന്നാളിന് മുമ്പ്, ഈ ലോകം വിട്ട് പിതാവിന്റെ അടുക്കലേക്കു പോകാനുള്ള തന്റെ നാഴിക വന്നെത്തിയെന്ന് യേശു അറിഞ്ഞിരുന്നു. ലോകത്തിലുള്ള തന്റെ സ്വന്തക്കാരെ സ്നേഹിച്ചിരുന്ന അവൻ അവരെ അവസാനംവരെ[a] സ്നേഹിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പൂർണമായി’ എന്നും ‘പരമാവധിവരെ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പ്രയോഗം അവസാന നിമിഷംവരെ നിലനിന്ന സ്നേഹത്തെയും അതിന്റെ പൂർണമായ അളവിനെയും ഒരുപോലെ സൂചിപ്പിച്ചേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρὸ δὲ τῆς ἑορτῆς τοῦ πάσχα
  choice: പെസഹാപ്പെരുന്നാളിനു മുമ്പ്
  rationale: πρό എന്നത് സമയപരമായ മുൻഗണന സൂചിപ്പിക്കുന്നു; δέ മൃദുവായ ബന്ധകമായതിനാൽ മലയാളത്തിൽ പ്രത്യേകം പദം ചേർക്കാതെ സ്വാഭാവികമായി അവതരിപ്പിച്ചു. ἑορτήയും πάσχαയും ചേർന്ന പ്രയോഗം ഉത്സവസ്വഭാവം നിലനിർത്തി ‘പെസഹാപ്പെരുന്നാൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: εἰδὼς
  choice: അറിഞ്ഞിരുന്നു
  rationale: യേശുവിന് ആ സന്ദർഭത്തിൽ ഉണ്ടായിരുന്ന ബോധ്യത്തെ സൂചിപ്പിക്കുന്ന പങ്കാളിക്രിയ മലയാളത്തിൽ സ്വാഭാവികമായ കാലബന്ധത്തോടെ അവതരിപ്പിക്കുന്നു.
- source_word: ἦλθεν αὐτοῦ ἡ ὥρα
  choice: തന്റെ നാഴിക വന്നെത്തിയെന്ന്
  rationale: യോഹന്നാനിലെ ‘അവന്റെ നാഴിക’ എന്ന നിർണായകവും ദൈവനിശ്ചിതവുമായ സമയത്തിന്റെ പ്രയോഗവും അതിന്റെ ദൈവശാസ്ത്രപരമായ പ്രതിധ്വനിയും നിലനിർത്തുന്നു.
- source_word: ἵνα μεταβῇ ἐκ τοῦ κόσμου τούτου πρὸς τὸν πατέρα
  choice: ഈ ലോകം വിട്ട് പിതാവിന്റെ അടുക്കലേക്കു പോകാനുള്ള
  rationale: μεταβῇ സൂചിപ്പിക്കുന്ന ഈ ലോകത്തിൽനിന്ന് പിതാവിലേക്കുള്ള മാറ്റം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; മരണവും മഹത്ത്വീകരണവും എന്ന് വ്യാഖ്യാനിച്ച് പരിമിതപ്പെടുത്തിയിട്ടില്ല.
- source_word: ἀγαπήσας τοὺς ἰδίους τοὺς ἐν τῷ κόσμῳ
  choice: ലോകത്തിലുണ്ടായിരുന്ന തന്റെ സ്വന്തക്കാരെ സ്നേഹിച്ചിരുന്ന അവൻ
  rationale: τοὺς ἰδίους എന്ന ബന്ധപരവും ഉദ്ദേശപൂർവം വിശാലവുമായ പ്രയോഗം ‘തന്റെ സ്വന്തക്കാർ’ എന്നു നിലനിർത്തുന്നു; ‘ശിഷ്യന്മാർ’ എന്നു ചുരുക്കുന്നില്ല. പങ്കാളിക്രിയ മുൻകാലംമുതലുള്ള സ്നേഹത്തെ സൂചിപ്പിക്കുന്ന വിധത്തിൽ നൽകി.
- source_word: εἰς τέλος
  choice: അവസാനംവരെ
  rationale: കാലപരമായ ‘അവസാനംവരെ’ എന്ന അർഥം മുഖ്യപാഠത്തിൽ നിലനിർത്തുമ്പോഴും, പൂർണമായും അളവറ്റ രീതിയിലും എന്ന ഗുണപരമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἠγάπησεν αὐτούς
  choice: അവരെ ... സ്നേഹിച്ചു
  rationale: ἀγαπάω എന്ന ക്രിയയുടെ ലളിതവും ശക്തവുമായ അർഥം ‘സ്നേഹിച്ചു’ എന്നു നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: εἰς τέλος എന്ന പ്രയോഗത്തിൽ യേശുവിന്റെ സ്നേഹത്തിന്റെ കാലപരവും ഗുണപരവുമായ വ്യാപ്തി
  choice: മുഖ്യപാഠത്തിൽ ‘അവസാനംവരെ’
  alternative: ‘പൂർണമായി’ അല്ലെങ്കിൽ ‘പരമാവധിവരെ’
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിന് അന്തിമ നിമിഷംവരെ നിലനിന്ന സ്നേഹവും അതിന്റെ പൂർണമായ അളവും ഒരുമിച്ച് സൂചിപ്പിക്കാനാകാം. മുഖ്യപാഠം ഈ യോഹന്നാനീയ ദ്വയാർഥം അടച്ചുപൂട്ടാതെ കൂടുതൽ ശബ്ദാനുസൃതമായ രൂപം നിലനിർത്തുന്നു; മറ്റർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി. ‘നാഴിക’, ‘പിതാവ്’, ‘തന്റെ സ്വന്തക്കാർ’ എന്നീ പദങ്ങൾ യോഹന്നാന്റെ സവിശേഷ ഭാഷയും ബന്ധപരമായ അർഥവും നിലനിർത്തുന്നു. ദീർഘമായ ഗ്രീക്ക് വാക്യം മലയാളത്തിലെ വ്യക്തതയ്ക്കായി രണ്ട് വാക്യങ്ങളാക്കി; ആശയബന്ധം മാറ്റിയിട്ടില്ല.
