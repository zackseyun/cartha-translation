  naturalness: വാചകങ്ങൾ വായനാസുഗമവും ഗൗരവമുള്ള ആധുനിക നിലവാരമലയാളത്തിലുമാണ്. ‘പെസഹാ പെരുന്നാളിന്’ എന്ന വേർതിരിച്ചെഴുത്ത് കൂടുതൽ സ്വാഭാവികമാണ്. ‘അവസാനംവരെ’ എന്നത് εἰς τέλος-ന്റെ മുഖ്യപാഠത്തിന് യോജിച്ചതാണ്.
