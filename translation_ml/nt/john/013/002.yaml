id: JHN.13.2
reference: John 13:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ δείπνου ⸀γινομένου, τοῦ διαβόλου ἤδη βεβληκότος εἰς τὴν καρδίαν ⸂ἵνα παραδοῖ αὐτὸν Ἰούδας Σίμωνος ⸀Ἰσκαριώτου⸃,
base_translation:
  language: en
  yaml_path: translation/nt/john/013/002.yaml
  text: And during supper[a], when the devil had already put it into the heart of Judas Iscariot, Simon's son, to betray him[c][b],
translation:
  language: ml
  text: അത്താഴം നടന്നുകൊണ്ടിരിക്കുമ്പോൾ[a], ഇസ്കര്യോത്താവായ ശിമോന്റെ മകൻ യൂദായുടെ ഹൃദയത്തിൽ, അവനെ ഒറ്റിക്കൊടുക്കണമെന്ന[c] ചിന്ത പിശാച് നേരത്തേതന്നെ ഇട്ടിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അത്താഴം നടന്നുകൊണ്ടിരുന്ന സമയത്ത്.’ അത്താഴം ഇതിനകം കഴിഞ്ഞിരുന്നു എന്നല്ല ഗ്രീക്കിന്റെ അർഥം.
    reason: lexical_alternative
  - marker: b
    text: ‘പ്രേരിപ്പിച്ചിരുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം. അക്ഷരാർഥം, ‘ഹൃദയത്തിൽ ഇട്ടിരുന്നു.’
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘അവനെ ഏല്പിച്ചുകൊടുക്കണമെന്ന.’ ഈ സന്ദർഭത്തിൽ ‘ഒറ്റിക്കൊടുക്കുക’ എന്നത് പ്രയോഗത്തിന്റെ വഞ്ചനാത്മക അർഥം വ്യക്തമാക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: δείπνου γινομένου
  choice: അത്താഴം നടന്നുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് അത്താഴം നടന്നുകൊണ്ടിരുന്ന അതേ സമയത്തെ സൂചിപ്പിക്കുന്നു; അത്താഴം കഴിഞ്ഞുവെന്ന അർഥം വരാതിരിക്കാൻ ഈ രൂപം സ്വീകരിച്ചു.
- source_word: διάβολος
  choice: പിശാച്
  rationale: യോഹന്നാന്റെ വിവരണത്തിൽ ഇത് വ്യക്തിപരമായ ദുഷ്ടശക്തിയെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ വിശേഷനാമമാണ്.
- source_word: ἤδη βεβληκότος εἰς τὴν καρδίαν
  choice: ഹൃദയത്തിൽ ... പിശാച് നേരത്തേതന്നെ ഇട്ടിരുന്നു
  rationale: ഉദ്ദേശ്യം ഉള്ളിൽ നിക്ഷേപിക്കുന്നതിന്റെ ഗ്രീക്ക് രൂപകം നിലനിർത്തുകയും പൂർത്തിയായ മുൻകാലഭാവം ‘നേരത്തേതന്നെ ... ഇട്ടിരുന്നു’ എന്നു പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: καρδίαν
  choice: ഹൃദയം
  rationale: വികാരം മാത്രമല്ല, ഇച്ഛയും ഉദ്ദേശ്യവും ഉൾക്കൊള്ളുന്ന ബൈബിൾരൂപകം സംരക്ഷിക്കുന്നു.
- source_word: ἵνα παραδοῖ
  choice: ഒറ്റിക്കൊടുക്കണമെന്ന
  rationale: യൂദായുടെ സന്ദർഭത്തിൽ παραδίδωμι എന്നതിന്റെ വഞ്ചനാത്മക ശക്തി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘ഏല്പിച്ചുകൊടുക്കുക’ എന്ന കൂടുതൽ അക്ഷരാർഥപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: αὐτόν
  choice: അവനെ
  rationale: സർവനാമം യേശുവിനെ സൂചിപ്പിക്കുന്നതിനാൽ മൂലപാഠത്തിലെ സർവനാമരൂപം തന്നെ നിലനിർത്തുന്നു.
- source_word: Ἰούδας Σίμωνος Ἰσκαριώτου
  choice: ഇസ്കര്യോത്താവായ ശിമോന്റെ മകൻ യൂദാ
  rationale: Σίμωνος, Ἰσκαριώτου എന്നീ ജനിറ്റീവ് രൂപങ്ങളുടെ വ്യാകരണബന്ധം അനുസരിച്ച് ‘ഇസ്കര്യോത്താവായ ശിമോന്റെ മകൻ’ എന്നു നൽകി.
theological_decisions:
- issue: യൂദായുടെ വഞ്ചനയിലെ പിശാചിന്റെ സ്വാധീനവും യൂദായുടെ പ്രവർത്തകത്വവും
  choice: പിശാച് യൂദായുടെ ഹൃദയത്തിൽ ഉദ്ദേശ്യം ഇട്ടുവെന്നും യൂദാ തന്നെയാണ് യേശുവിനെ ഒറ്റിക്കൊടുക്കുന്നതെന്നും ഒരുമിച്ച് നിലനിർത്തി.
  alternative: പിശാച് യൂദായെ പ്രേരിപ്പിച്ചിരുന്നു.
  rationale: ഗ്രീക്ക് പിശാചിന്റെ സ്വാധീനം പ്രസ്താവിക്കുന്നതോടൊപ്പം യൂദായെ ഒറ്റിക്കൊടുക്കുന്ന വ്യക്തിയായി തന്നെ അവതരിപ്പിക്കുന്നു; നിർണയവാദത്തെക്കുറിച്ചോ ഏകകാരണത്തെക്കുറിച്ചോ പാഠം പറയുന്നതിലധികം വിവർത്തനം തീരുമാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നടന്നുകൊണ്ടിരിക്കുമ്പോൾ,’ ‘നേരത്തേതന്നെ,’ ‘ഒറ്റിക്കൊടുക്കുക’ എന്നിവ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്. വാക്യം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ യൂദായെ ‘ഹൃദയം’ എന്നതിനോടു ബന്ധിപ്പിച്ചെങ്കിലും മൂലത്തിലെ രൂപകവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തി.
