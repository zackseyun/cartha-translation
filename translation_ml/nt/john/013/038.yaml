  source_fidelity: 'ഗ്രീക്ക് വാക്യത്തിന്റെ എല്ലാ മുഖ്യഘടകങ്ങളും വിശ്വസ്തമായി പ്രതിഫലിക്കുന്നു: യേശുവിന്റെ മറുപടി, ‘നിന്റെ ജീവൻ’ എന്ന ψυχήയുടെ സന്ദർഭാനുസൃത അർഥം, ὑπὲρ ἐμοῦ എന്ന ‘എനിക്കുവേണ്ടി,’ ഇരട്ടയായ ἀμὴν, οὐ μήയുടെ ശക്തമായ നിഷേധം, കോഴിയുടെ കൂവൽ, പത്രോസിന്റെ മൂന്നുവട്ട നിഷേധം എന്നിവയെല്ലാം നിലനിൽക്കുന്നു. ‘തള്ളിപ്പറയുന്നതുവരെ’ എന്നത് ἕως οὗ-വിന്റെ കാലപരിധിയും നിഷേധം കൂവലിനു മുമ്പ് പൂർത്തിയാകുമെന്ന ആശയവും യോജിച്ചപടി അറിയിക്കുന്നു.'
  naturalness: വാചകം ആധുനിക മാന്യമായ മലയാളത്തിൽ സ്വാഭാവികവും വായനാസുഖമുള്ളതുമാണ്. ‘സത്യം സത്യമായി’യും ‘കൂകുകയേ ഇല്ല’യും യഥാക്രമം ഗൗരവവും ശക്തമായ നിഷേധവും സ്വാഭാവികമായി നൽകുന്നു. ‘ജീവൻ വെച്ചുകൊടുക്കുമോ?’ യോഹന്നാനിലെ ഉദ്ദേശ്യപൂർവമായ പ്രയോഗചിത്രം സംരക്ഷിക്കുന്ന ഗ്രഹിക്കാവുന്ന പ്രയോഗമാണ്.
  terminology: ‘ജീവൻ’ ψυχήയുടെ ഈ സന്ദർഭത്തിലെ ശരിയായ തിരഞ്ഞെടുപ്പാണ്; അതിനെ അശരീരിയായ ആത്മാവിലേക്ക് അനാവശ്യമായി പരിമിതപ്പെടുത്തുന്നില്ല. ‘തള്ളിപ്പറയുക’ ἀρνήσῃ με എന്ന പത്രോസിന്റെ യേശുവിനെ അറിയില്ലെന്ന നിഷേധസന്ദർഭത്തിന് യോജിക്കുന്നു. അടിക്കുറിപ്പ് ‘ആത്മാവ്’ എന്ന ലെക്സിക്കൽ സാധ്യത സൂചിപ്പിക്കുകയും സന്ദർഭാർഥം വ്യക്തമായി വിശദീകരിക്കുകയും ചെയ്യുന്നു.
