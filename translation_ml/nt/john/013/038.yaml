source:
  edition: SBLGNT
  text: ⸀ἀποκρίνεται Ἰησοῦς· Τὴν ψυχήν σου ὑπὲρ ἐμοῦ θήσεις; ἀμὴν ἀμὴν λέγω σοι, οὐ μὴ ἀλέκτωρ φωνήσῃ ἕως οὗ ⸀ἀρνήσῃ με τρίς.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/038.yaml
  text: Jesus answered[a], “Will you lay down your life for me? Truly, truly, I say to you, the rooster will certainly not crow until you have denied me three times.”
translation:
  language: ml
  text: 'യേശു മറുപടി പറഞ്ഞു: “എനിക്കുവേണ്ടി നിന്റെ ജീവൻ[a] വെച്ചുകൊടുക്കുമോ? സത്യം സത്യമായി ഞാൻ നിന്നോടു പറയുന്നു: നീ എന്നെ മൂന്നുവട്ടം തള്ളിപ്പറയുന്നതുവരെ കോഴി കൂകുകയേ ഇല്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ “ആത്മാവ്”: “എനിക്കുവേണ്ടി നിന്റെ ആത്മാവ് വെച്ചുകൊടുക്കുമോ?” ഗ്രീക്ക് ψυχή എന്ന പദത്തിന് “ആത്മാവ്” എന്നും “ജീവൻ” എന്നും അർഥമാകാം; ഇവിടെ സ്വന്തം ജീവൻ നൽകുക എന്നതാണ് സന്ദർഭാർഥം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκρίνεται
  choice: മറുപടി പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനകാലത്തെ മലയാള ആഖ്യാനശൈലിക്ക് സ്വാഭാവികമായ ഭൂതകാലത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ψυχήν
  choice: ജീവൻ
  rationale: τίθημι τὴν ψυχήν എന്ന പ്രയോഗത്തിൽ അശരീരിയായ ‘ആത്മാവ്’ എന്ന പരിമിത അർഥത്തേക്കാൾ, മരിക്കാൻ സന്നദ്ധനായി സ്വന്തം ജീവൻ നൽകുക എന്നതാണ് സന്ദർഭാർഥം.
- source_word: ὑπὲρ ἐμοῦ
  choice: എനിക്കുവേണ്ടി
  rationale: പ്രയോജനത്തിനോ പ്രതിനിധാനത്തിനോ വേണ്ടിയുള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന ὑπέρ എന്നതിന്റെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളരൂപം.
- source_word: θήσεις
  choice: വെച്ചുകൊടുക്കുമോ
  rationale: ‘ജീവൻ വെച്ചുകൊടുക്കുക’ എന്ന പ്രയോഗം τίθημι എന്നതിന്റെ അടിസ്ഥാനചിത്രവും യോഹന്നാനിലെ ആവർത്തിത പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: ἀμὴν ἀμὴν
  choice: സത്യം സത്യമായി
  rationale: യോഹന്നാനിൽ യേശു ഉപയോഗിക്കുന്ന ഗൗരവപൂർണമായ ഉറപ്പിക്കൽസൂത്രത്തിന്റെ ആവർത്തനവും ഊന്നലും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: οὐ μὴ
  choice: കൂകുകയേ ഇല്ല
  rationale: οὐ μή നൽകുന്ന ശക്തമായ നിഷേധത്തെ മലയാളത്തിലെ ‘-യേ ഇല്ല’ എന്ന ഊന്നൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀλέκτωρ φωνήσῃ
  choice: കോഴി കൂകുക
  rationale: കോഴിയുടെ ശബ്ദത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: ἕως οὗ
  choice: വരെ
  rationale: നിഷേധിക്കപ്പെട്ട പ്രവൃത്തി സംഭവിക്കാതിരിക്കുന്ന സമയപരിധിയെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: ἀρνήσῃ με
  choice: എന്നെ തള്ളിപ്പറയുക
  rationale: വാക്കാൽ അറിയില്ലെന്ന് നിഷേധിക്കുന്നതും ബന്ധം നിരാകരിക്കുന്നതുമായ സന്ദർഭാർഥം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: τρίς
  choice: മൂന്നുവട്ടം
  rationale: ആവർത്തനത്തിന്റെ എണ്ണം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ശിഷ്യത്വത്തിന്റെയും സ്വയംത്യാഗത്തിന്റെയും സന്ദർഭത്തിൽ ψυχή എന്നതിന്റെ പരിഭാഷ
  choice: ജീവൻ
  alternative: ആത്മാവ്
  rationale: പത്രോസ് യേശുവിനുവേണ്ടി മരിക്കാൻ സന്നദ്ധനാണെന്ന അവകാശവാദമാണ് ഇവിടെ വിഷയം. അതിനാൽ ‘ജീവൻ’ എന്നത് മൂർത്തമായ സ്വയംത്യാഗാർഥം നൽകുകയും സന്ദർഭം ആവശ്യപ്പെടാത്ത ദേഹി-ആത്മാവ് വിഭജനം അടിച്ചേൽപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘ജീവൻ വെച്ചുകൊടുക്കുക’ എന്ന യോഹന്നാനീയ പ്രയോഗചിത്രം നിലനിർത്തിയിട്ടുണ്ട്; ശക്തമായ നിഷേധത്തിന് ‘കൂകുകയേ ഇല്ല’ ഉപയോഗിച്ചു.
