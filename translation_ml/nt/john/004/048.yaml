id: JHN.4.48
reference: John 4:48
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν οὖν ὁ Ἰησοῦς πρὸς αὐτόν· Ἐὰν μὴ σημεῖα καὶ τέρατα ἴδητε, οὐ μὴ πιστεύσητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/048.yaml
  text: So Jesus said to him[a], “Unless you see signs and wonders, you will certainly not believe.”
translation:
  language: ml
  text: 'അതിനാൽ യേശു അവനോടു പറഞ്ഞു[a]: “നിങ്ങൾ അടയാളങ്ങളും അത്ഭുതങ്ങളും കണ്ടില്ലെങ്കിൽ ഒരിക്കലും വിശ്വസിക്കുകയില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കാണുക’, ‘വിശ്വസിക്കുക’ എന്നീ ക്രിയകൾ ഗ്രീക്കിൽ ബഹുവചനത്തിലാണ്. അതിനാൽ യേശുവിന്റെ വാക്കുകൾ ആ ഉദ്യോഗസ്ഥനിൽ മാത്രം ഒതുങ്ങാതെ കൂടുതൽ ആളുകളെയും ഉൾക്കൊള്ളുന്നതായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: അതിനാൽ
  rationale: മുൻവാക്യത്തിൽനിന്നുള്ള ആഖ്യാനപരവും യുക്തിപരവുമായ തുടർച്ച സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിലെ അനുമാനബന്ധം നിലനിർത്തുന്നു.
- source_word: πρὸς αὐτόν
  choice: അവനോടു
  rationale: സംസാരത്തിന്റെ ഏകവചന അഭിസംബോധിതനെ സ്വാഭാവികമായ മലയാളത്തിൽ നേരിട്ട് അടയാളപ്പെടുത്തുന്നു.
- source_word: Ἐὰν μὴ
  choice: കണ്ടില്ലെങ്കിൽ
  rationale: നിഷേധാത്മക നിബന്ധനയെ മലയാളത്തിലെ സ്വാഭാവികമായ ‘-ഇല്ലെങ്കിൽ’ ഘടനയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: σημεῖα
  choice: അടയാളങ്ങൾ
  rationale: യോഹന്നാനിൽ പ്രവൃത്തിയുടെ അത്ഭുതസ്വഭാവത്തിനപ്പുറം അതിന്റെ അർഥത്തിലേക്കു ചൂണ്ടുന്ന സവിശേഷ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: τέρατα
  choice: അത്ഭുതങ്ങൾ
  rationale: വിസ്മയം ജനിപ്പിക്കുന്ന അസാധാരണ പ്രവൃത്തികൾ എന്ന അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; ‘അടയാളങ്ങൾ’ എന്ന പദത്തിൽനിന്നുള്ള വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: ἴδητε
  choice: നിങ്ങൾ ... കണ്ടില്ലെങ്കിൽ
  rationale: ഗ്രീക്കിലെ രണ്ടാംപുരുഷ ബഹുവചനം മലയാളത്തിലെ ‘നിങ്ങൾ’ വഴി വ്യക്തമായി സംരക്ഷിക്കുന്നു; നിബന്ധനാവാക്യത്തിലെ aorist subjunctive സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: οὐ μὴ πιστεύσητε
  choice: ഒരിക്കലും വിശ്വസിക്കുകയില്ല
  rationale: οὐ μή എന്ന ശക്തമായ നിഷേധം ‘ഒരിക്കലും ... ഇല്ല’ എന്ന മലയാളപ്രയോഗത്തിലൂടെ ഊന്നിപ്പറയുന്നു.
- source_word: πιστεύσητε
  choice: വിശ്വസിക്കുകയില്ല
  rationale: യോഹന്നാനിലെ πιστεύω എന്ന പദത്തിന്റെ വിശ്വാസം/ആശ്രയം ഉൾക്കൊള്ളുന്ന സാധാരണവും കുറഞ്ഞ വ്യാഖ്യാനഭാരമുള്ളതുമായ തുല്യപദം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: അഭിസംബോധിതന്റെ എണ്ണവും വാക്കുകളുടെ വ്യാപ്തിയും
  choice: ആഖ്യാനമുഖത്തിൽ ‘അവനോടു’ എന്ന ഏകവചനം നിലനിർത്തുകയും യേശുവിന്റെ വാക്കുകളിൽ ‘നിങ്ങൾ’ എന്ന ബഹുവചനം വ്യക്തമാക്കുകയും ചെയ്തു.
  alternative: വാക്യം മുഴുവൻ ഉദ്യോഗസ്ഥനോടു മാത്രമുള്ള ഏകവചന അഭിസംബോധനയായി പരിഭാഷപ്പെടുത്തുക; അല്ലെങ്കിൽ ‘നിങ്ങളെപ്പോലുള്ളവർ’ എന്നു വ്യാഖ്യാനപരമായി വികസിപ്പിക്കുക.
  rationale: πρὸς αὐτόν ഏകവചനമാണ്; എന്നാൽ ἴδητε, πιστεύσητε എന്നിവ ബഹുവചനമാണ്. അതിനാൽ യേശു ഒരാളോടു സംസാരിക്കുമ്പോഴും പ്രസ്താവനയുടെ വ്യാപ്തി വിശാലമായ ഒരു കൂട്ടത്തിലേക്കോ മനോഭാവത്തിലേക്കോ നീളുന്നു എന്ന മൂലപാഠത്തിലെ സംഘർഷം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അടയാളങ്ങൾ’ എന്ന യോഹന്നാനീയ പദപ്രയോഗവും ശക്തമായ നിഷേധവും സംരക്ഷിച്ചിരിക്കുന്നു; ബഹുവചന അഭിസംബോധന പ്രധാനപാഠത്തിൽ തന്നെ വ്യക്തമാണ്.
