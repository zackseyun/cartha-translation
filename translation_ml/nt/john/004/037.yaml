  terminology: “ചൊല്ല്” appropriately renders λόγος here as a saying/maxim rather than the theological title “വചനം.” The footnote should be anchored to “ചൊല്ല്” and should not call an alternative involving agent nouns “more literal” when the main text already uses agent forms.
