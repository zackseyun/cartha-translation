  text: ἐν γὰρ τούτῳ ὁ λόγος ⸀ἐστὶν ἀληθινὸς ὅτι Ἄλλος ἐστὶν ὁ σπείρων καὶ ἄλλος ὁ θερίζων·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/037.yaml
  text: 'For in this the saying is true: one is the one sowing[c][b][a], and another the one reaping.'
translation:
  language: ml
  text: 'എന്തെന്നാൽ, ഇക്കാര്യത്തിൽ ഈ ചൊല്ല്[a] സത്യമാണ്: ‘വിതയ്ക്കുന്നവൻ ഒരാളും കൊയ്യുന്നവൻ മറ്റൊരാളുമാണ്.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ചൊല്ല്’ എന്നതിന് ‘വാക്ക്’ അല്ലെങ്കിൽ ‘പഴമൊഴി’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: ഇക്കാര്യത്തിൽ
  rationale: യേശു വിവരിക്കുന്ന ഇപ്പോഴത്തെ സാഹചര്യത്തിലേക്കുള്ള സൂചന സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: γὰρ
  choice: ഒഴിവാക്കി; വിശദീകരണബന്ധം വാക്യക്രമത്തിലൂടെ പ്രകടമാക്കി
  rationale: ഗ്രീക്കിൽ മുൻവാക്യത്തിനുള്ള വിശദീകരണമാണ്. ഒറ്റവാക്യമായി ഉദ്ധരിക്കുമ്പോൾ ‘എന്തെന്നാൽ’ ചേർക്കുന്നത് മലയാളത്തിൽ കൃത്രിമമാകാം; ബന്ധം സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: ὁ λόγος
  choice: ഈ ചൊല്ല്
  rationale: ഇവിടെ λόγος ദൈവശാസ്ത്രപരമായ ‘വചനം’ എന്ന ശീർഷകമല്ല, തുടർന്ന് ഉദ്ധരിക്കുന്ന പ്രചാരത്തിലുള്ള ഒരു പ്രസ്താവനയോ പഴമൊഴിയോ ആണ്. ‘ചൊല്ല്’ അതിന്റെ സൂക്തസ്വഭാവം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἀληθινός
  choice: സത്യമാണ്
  rationale: ചൊല്ലിന്റെ സാധുതയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ നേരിട്ടും സ്വാഭാവികവുമായ തുല്യം.
- source_word: ὅτι
  choice: ':'
  rationale: ചൊല്ലിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന ὅτιയെ മലയാളത്തിൽ ദ്വിബിന്ദുവും ഉദ്ധരണിയുംകൊണ്ട് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἄλλος ... καὶ ἄλλος
  choice: ഒരാൾ ... മറ്റൊരാൾ
  rationale: രണ്ടു വ്യത്യസ്ത വ്യക്തികളോ കൂട്ടങ്ങളോ തമ്മിലുള്ള വൈരുധ്യം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ὁ σπείρων
  choice: വിതയ്ക്കുന്നത്
  rationale: നാമവൽക്കരിച്ച വർത്തമാനകൃത്തിന്റെയും പ്രവർത്തനസ്വഭാവം സൂക്ഷിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: ὁ θερίζων
  choice: കൊയ്യുന്നത്
  rationale: ὁ σπείρων എന്നതിനോടുള്ള സമാന്തരതയും പ്രവർത്തനസ്വഭാവവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: കാർഷിക ചൊല്ലിലെ വിതയ്ക്കുന്നവന്റെയും കൊയ്യുന്നവന്റെയും തിരിച്ചറിയൽ
  choice: വാക്യത്തിൽ പൊതുവായ ചൊല്ലായി മാത്രം നിലനിർത്തി; വ്യക്തികളെയോ കൂട്ടങ്ങളെയോ പേരെടുത്ത് തിരിച്ചറിഞ്ഞില്ല.
  alternative: വിതയ്ക്കുന്നവനെ പ്രവാചകന്മാർ, യോഹന്നാൻ, അല്ലെങ്കിൽ യേശു എന്നും കൊയ്യുന്നവനെ ശിഷ്യന്മാർ എന്നും വിവർത്തനത്തിൽ വ്യക്തമാക്കുക.
  rationale: ഈ വാക്യത്തിലെ ഗ്രീക്ക് അവരെ തിരിച്ചറിയിക്കുന്നില്ല; പ്രയോഗം സന്ദർഭത്തിൽനിന്നാണ് മനസ്സിലാകുന്നത്. അതിനാൽ വ്യാഖ്യാനം വിവർത്തനത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതെ ഉള്ള ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവും ചൊല്ലിനൊത്ത താളമുള്ളതുമായ ഭാഷ. പ്രധാനവാചകം സ്വാഭാവികമാക്കുമ്പോഴും ഗ്രീക്കിലെ പ്രവർത്തനാത്മക കൃദ്‌രൂപങ്ങളും വ്യത്യസ്ത കർത്താക്കളുടെ വൈരുധ്യവും സംരക്ഷിച്ചു.
