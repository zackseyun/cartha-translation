id: JHN.4.17
reference: John 4:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπεκρίθη ἡ γυνὴ καὶ εἶπεν ⸀αὐτῷ· Οὐκ ἔχω ἄνδρα. λέγει αὐτῇ ὁ Ἰησοῦς· Καλῶς εἶπας ὅτι Ἄνδρα οὐκ ἔχω·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/017.yaml
  text: 'The woman answered and said to him[a], “I do not have a husband.” Jesus said to her[b], “You have spoken well: ‘I do not have a husband.’”'
translation:
  language: ml
  text: 'സ്ത്രീ അവനോടു മറുപടി പറഞ്ഞു: “എനിക്കു ഭർത്താവില്ല[a].” യേശു അവളോടു പറഞ്ഞു: “നീ പറഞ്ഞത് ശരിയാണ്: ‘എനിക്കു ഭർത്താവില്ല.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഭർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ἀνήρ എന്ന ഗ്രീക്കുപദത്തിന് ‘പുരുഷൻ’ എന്നും അർഥമാകാം; ഇവിടെ സന്ദർഭം ‘ഭർത്താവ്’ എന്ന അർഥം സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ἡ γυνὴ καὶ εἶπεν
  choice: സ്ത്രീ അവനോടു മറുപടി പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ‘മറുപടി നൽകി, പറഞ്ഞു’ എന്ന ഇരട്ട പ്രയോഗത്തിന്റെ അർഥം നിലനിർത്തിക്കൊണ്ട്, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ ആഖ്യാനശൈലി ഉപയോഗിക്കുന്നു.
- source_word: Οὐκ ἔχω ἄνδρα
  choice: എനിക്കു ഭർത്താവില്ല
  rationale: ἔχω എന്ന ക്രിയയെയും നിഷേധത്തെയും മലയാളത്തിൽ സ്വാഭാവികമായി ‘എനിക്കു … ഇല്ല’ എന്നു നൽകുന്നു. തുടർന്നുള്ള വാക്യത്തിലെ വിവാഹസന്ദർഭം ἄνδρα എന്നതിന് ‘ഭർത്താവ്’ എന്ന അർഥം സൂചിപ്പിക്കുന്നു.
- source_word: λέγει
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിൽ ചരിത്രവർത്തമാനകാലമാണെങ്കിലും, മലയാള ആഖ്യാനത്തിൽ ഭൂതകാലരൂപം കൂടുതൽ സ്വാഭാവികമാണ്.
- source_word: Καλῶς εἶπας
  choice: നീ പറഞ്ഞതു ശരിയാണ്
  rationale: ഇവിടെ καλῶς അവളുടെ പ്രസ്താവനയുടെ സത്യതയെയും കൃത്യതയെയും അംഗീകരിക്കുന്നു. ‘നന്നായി പറഞ്ഞു’ എന്ന അക്ഷരസമീപ രൂപത്തേക്കാൾ സന്ദർഭത്തിലെ ആശയം ഇത് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ὅτι Ἄνδρα οὐκ ἔχω
  choice: ‘എനിക്കു ഭർത്താവില്ല’ എന്നു
  rationale: ὅτι ഇവിടെ അവൾ പറഞ്ഞ വാക്കുകളുടെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു; യേശു അവളുടെ വാക്കുകൾ ആവർത്തിക്കുന്നതു നേരിട്ടുള്ള ഉദ്ധരണിയായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἀνήρ എന്ന പദത്തിന്റെ സന്ദർഭാർഥം
  choice: ഭർത്താവ്
  alternative: പുരുഷൻ
  rationale: ἀνήρ എന്നതിന് ‘പുരുഷൻ’ എന്നും ‘ഭർത്താവ്’ എന്നും അർഥമാകാം. അടുത്ത വാക്യത്തിൽ അവളുടെ വിവാഹചരിത്രം വ്യക്തമായി പരാമർശിക്കുന്നതിനാൽ പ്രധാനപാഠത്തിൽ ‘ഭർത്താവ്’ യോജിക്കുന്നു; പദത്തിന്റെ വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. യേശു സ്ത്രീയുടെ വാക്കുകൾ ആവർത്തിക്കുന്ന ഘടന സംരക്ഷിച്ചിരിക്കുന്നു; അനാവശ്യമായ മതവിഭാഗപരമായ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
