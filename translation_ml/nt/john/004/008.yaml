lexical_decisions:
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവിവരണത്തിന് വിശദീകരണപരമായ കാരണം നൽകുന്ന γάρ എന്ന ബന്ധകത്തിന്റെ ശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: μαθηταὶ αὐτοῦ
  choice: അവന്റെ ശിഷ്യന്മാർ
  rationale: യോഹന്നാന്റെ ആഖ്യാനത്തിലെ ഉടമസ്ഥബന്ധവും μαθηταί എന്ന പദത്തിന്റെ സാധാരണ അർത്ഥവും വ്യക്തമായി നൽകുന്നു.
- source_word: ἀπεληλύθεισαν
  choice: പോയിരുന്നു
  rationale: പ്രധാന സംഭവത്തിനു മുമ്പേ നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന pluperfect കാലഭാവം മലയാളത്തിലെ ‘പോയിരുന്നു’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ വേർപെട്ടുപോകൽ വ്യക്തമായതിനാൽ അധികമായി ‘അകന്നുപോയിരുന്നു’ എന്നു പറയേണ്ടതില്ല.
- source_word: εἰς τὴν πόλιν
  choice: പട്ടണത്തിലേക്കു
  rationale: εἰς ചലനത്തിന്റെ ലക്ഷ്യം സൂചിപ്പിക്കുന്നു. πόλις എന്നത് സന്ദർഭാനുസൃതമായി ‘പട്ടണം’ അല്ലെങ്കിൽ ‘നഗരം’ ആകാം; സുഖാർ പോലുള്ള സ്ഥലത്തെപ്പറ്റിയുള്ള സ്വാഭാവിക മലയാളപ്രയോഗമായി ‘പട്ടണം’ തിരഞ്ഞെടുത്തു.
- source_word: ἵνα
  choice: വാങ്ങാൻ
  rationale: ἵνα സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യം മലയാളത്തിലെ ക്രിയാനാമരൂപം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τροφὰς
  choice: ഭക്ഷണം
  rationale: τροφάς ഇവിടെ ആഹാരത്തെയോ ഭക്ഷ്യസാധനങ്ങളെയോ സൂചിപ്പിക്കുന്നു; ‘ഭക്ഷണം’ സാധാരണവും വ്യക്തവുമായ സമാനപദമാണ്.
- source_word: ἀγοράσωσιν
  choice: വാങ്ങാൻ
  rationale: ഉദ്ദേശ്യവാക്യത്തിലെ വാങ്ങൽപ്രവൃത്തിയെ ലളിതവും ആധുനികവുമായ മലയാളത്തിൽ നൽകുന്നു.
