  text: For his disciples had gone away into the city to buy food[a][b].
translation:
  language: ml
  text: കാരണം, ഭക്ഷണം വാങ്ങാൻ അവന്റെ ശിഷ്യന്മാർ പട്ടണത്തിലേക്കു പോയിരുന്നു.[a][b]
