id: JHN.4.15
reference: John 4:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγει πρὸς αὐτὸν ἡ γυνή· Κύριε, δός μοι τοῦτο τὸ ὕδωρ, ἵνα μὴ διψῶ μηδὲ ⸀διέρχωμαι ἐνθάδε ἀντλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/015.yaml
  text: The woman said to him[a], “Lord, give me this water, so that I may not be thirsty or come here to draw.”
translation:
  language: ml
  text: 'ആ സ്ത്രീ അവനോടു പറഞ്ഞു: “കർത്താവേ,[a] എനിക്ക് ഈ വെള്ളം തരണമേ; അങ്ങനെ എനിക്കു ദാഹിക്കാതിരിക്കാനും കോരാൻ ഇവിടെ വരാതിരിക്കാനും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “യജമാനനേ”
    reason: κύριε ഇവിടെ ആദരസൂചകമായ സാധാരണ അഭിസംബോധനയായും മനസ്സിലാക്കാം.
lexical_decisions:
- source_word: λέγει
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിൽ ചരിത്രവർത്തമാനകാലമാണെങ്കിലും, ആധുനിക മലയാള ആഖ്യാനശൈലിയിൽ ഭൂതകാലമായ ‘പറഞ്ഞു’ സ്വാഭാവികമായി അതേ വ്യവഹാരധർമ്മം നൽകുന്നു.
- source_word: γυνή
  choice: ആ സ്ത്രീ
  rationale: സന്ദർഭത്തിൽ ശമര്യസ്ത്രീയെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ആ സ്ത്രീ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: κύριε എന്നതിന് ‘കർത്താവേ’ എന്ന അടിസ്ഥാന അർഥവും ആദരസൂചകമായ ‘യജമാനനേ’ എന്ന സംഭാഷണാർഥവും സാധ്യമാണ്. യോഹന്നാനിലെ അർഥതലം തുറന്നുവയ്ക്കാൻ മുഖ്യപാഠത്തിൽ ‘കർത്താവേ’ നിലനിർത്തുന്നു.
- source_word: δός μοι
  choice: എനിക്ക് ... തരണമേ
  rationale: ആജ്ഞാരൂപത്തിന്റെ നേരിട്ടുള്ള അഭ്യർഥന മലയാളത്തിൽ മാന്യവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τοῦτο τὸ ὕδωρ
  choice: ഈ വെള്ളം
  rationale: ഇവിടെ ഗ്രീക്ക് പാഠത്തിലുള്ളത് ‘ഈ വെള്ളം’ മാത്രമാണ്; മുൻസന്ദർഭത്തിലെ ‘ജീവജലം’ അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: ἵνα μὴ ... μηδὲ
  choice: അങ്ങനെ ... ചെയ്യാതിരിക്കട്ടെ
  rationale: ഉദ്ദേശ്യത്തെ സൂചിപ്പിക്കുന്ന ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുകയും രണ്ടു നിഷേധങ്ങളെയും ഒരേ ഘടനയിൽ ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: διψῶ
  choice: എനിക്ക് ദാഹിക്കുകയോ
  rationale: വർത്തമാന സബ്ജങ്ക്ടീവിന്റെ തുടർച്ചയായ അവസ്ഥാസൂചന നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണ്.
- source_word: διέρχωμαι ἐνθάδε
  choice: ഇവിടെ വരേണ്ടിവരുകയോ
  rationale: കിണറിലേക്കുള്ള ആവർത്തിച്ചുള്ള വരവിന്റെ പ്രായോഗിക അർഥം വ്യക്തമാക്കുന്നു; ‘വരേണ്ടിവരുക’ സ്ത്രീ ഒഴിവാക്കാൻ ആഗ്രഹിക്കുന്ന ആവശ്യകതയും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀντλεῖν
  choice: കോരാൻ
  rationale: കിണറ്റിൽനിന്ന് വെള്ളം എടുക്കുന്നതിന് മലയാളത്തിൽ ‘കോരുക’ കൃത്യവും സ്വാഭാവികവുമാണ്; വെള്ളം എന്ന കർമം ക്രിയയിൽ സന്ദർഭപരമായി ഉൾക്കൊള്ളുന്നതിനാൽ വീണ്ടും ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ശമര്യസ്ത്രീയുടെ അഭിസംബോധനയിൽ κύριος എന്നതിന്റെ പരിഭാഷ
  choice: കർത്താവേ
  alternative: യജമാനനേ
  rationale: ഈ പദം സാധാരണ ആദരസൂചക അഭിസംബോധനയായിരിക്കാം; അതേസമയം യോഹന്നാന്റെ സുവിശേഷത്തിൽ കൂടുതൽ ആഴമുള്ള ധ്വനിയും ഉണ്ടാകാം. മുഖ്യപാഠത്തിൽ ‘കർത്താവേ’ ഉപയോഗിച്ച് ആ സാധ്യത നിലനിർത്തുകയും അടിക്കുറിപ്പിൽ സംഭാഷണതലത്തിലെ മറ്റൊരു അർഥം നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ മാന്യമായ സംഭാഷണശൈലി. ‘തരണമേ’, ‘ചെയ്യാതിരിക്കട്ടെ’ എന്നിവ അഭ്യർഥനയുടെ സ്വരം കാത്തുസൂക്ഷിക്കുന്നു; ‘കോരാൻ’ കിണറ്റിൽനിന്ന് വെള്ളമെടുക്കുന്ന പ്രവൃത്തിയെ ചുരുക്കമായും കൃത്യമായും പറയുന്നു.
