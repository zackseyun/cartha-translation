revisions:
- from: 'ആ സ്ത്രീ അവനോടു പറഞ്ഞു: “കർത്താവേ,[a] എനിക്ക് ഈ വെള്ളം തരണമേ; അങ്ങനെ എനിക്ക് ദാഹിക്കുകയോ കോരാൻ ഇവിടെ വരേണ്ടിവരുകയോ ചെയ്യാതിരിക്കട്ടെ.”'
  to: 'ആ സ്ത്രീ അവനോടു പറഞ്ഞു: “കർത്താവേ,[a] എനിക്ക് ഈ വെള്ളം തരണമേ; അങ്ങനെ എനിക്കു ദാഹിക്കാതിരിക്കാനും കോരാൻ ഇവിടെ വരാതിരിക്കാനും.”'
  rationale: The revision removes the added necessity sense in “വരേണ്ടിവരുക” and uses parallel purpose expressions that naturally convey “so that I may not be thirsty or come here to draw.” No theological or interpretive clarification has been added.
