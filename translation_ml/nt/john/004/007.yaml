id: JHN.4.7
reference: John 4:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἔρχεται γυνὴ ἐκ τῆς Σαμαρείας ἀντλῆσαι ὕδωρ. λέγει αὐτῇ ὁ Ἰησοῦς· Δός μοι πεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/007.yaml
  text: A woman from Samaria came to draw water. Jesus said to her[a], “Give me a drink.”
translation:
  language: ml
  text: വെള്ളം കോരാൻ സമര്യയിൽനിന്ന് ഒരു സ്ത്രീ വന്നു. യേശു അവളോട്[a], “എനിക്ക് കുടിക്കാൻ തരൂ” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തോട് കൂടുതൽ അടുത്ത്: “വരുന്നു … പറയുന്നു”; ആഖ്യാനത്തിൽ ഗ്രീക്ക് ചരിത്രവർത്തമാനകാലം ഉപയോഗിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔρχεται
  choice: വന്നു
  rationale: ആഖ്യാനത്തിൽ ഭൂതകാലസംഭവത്തെ സജീവമായി അവതരിപ്പിക്കുന്ന ചരിത്രവർത്തമാനമാണിത്; സ്വാഭാവികമായ മലയാള ആഖ്യാനത്തിന് ഭൂതകാലരൂപം അനുയോജ്യം.
- source_word: γυνὴ
  choice: ഒരു സ്ത്രീ
  rationale: ഇവിടെ അജ്ഞാതയായ ഒരു സ്ത്രീയെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ഭാര്യ’ എന്ന അർഥം സന്ദർഭത്തിന് യോജിക്കുന്നില്ല.
- source_word: ἐκ τῆς Σαμαρείας
  choice: സമര്യയിൽനിന്ന്
  rationale: ἐκ സ്ഥലപരമായ ഉറവിടത്തെയോ വരവിന്റെ ഇടത്തെയോ സൂചിപ്പിക്കുന്നു. മൂലപാഠത്തിലുള്ള സ്ഥലനാമപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: ἀντλῆσαι ὕδωρ
  choice: വെള്ളം കോരാൻ
  rationale: ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന infinitive മലയാളത്തിൽ സ്വാഭാവികമായി ‘-ആൻ’ രൂപത്തിൽ നൽകി; കിണറ്റിൽനിന്ന് വെള്ളമെടുക്കുന്നതിന് ‘കോരുക’ കൃത്യവും സാധാരണവുമായ പദമാണ്.
- source_word: λέγει αὐτῇ
  choice: അവളോട് … എന്നു പറഞ്ഞു
  rationale: ആഖ്യാനത്തിലെ ചരിത്രവർത്തമാനം സ്വാഭാവിക മലയാളത്തിൽ ഭൂതകാലമായി നൽകി.
- source_word: Δός μοι πεῖν
  choice: എനിക്ക് കുടിക്കാൻ തരൂ
  rationale: കല്പനാരൂപത്തിലുള്ള ചുരുക്കമായ അഭ്യർഥനയുടെ ഘടനയും അർഥവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ‘സമര്യ’ എന്ന സ്ഥലസൂചനയുടെ പരിധി
  choice: സമര്യയിൽനിന്ന് ഒരു സ്ത്രീ
  alternative: ഒരു സമര്യക്കാരി; സമര്യനഗരത്തിൽനിന്ന് ഒരു സ്ത്രീ
  rationale: ഈ വാക്യത്തിലെ ഗ്രീക്ക് പാഠം സ്ത്രീയെ നേരിട്ട് ‘സമര്യക്കാരി’ എന്നു വിളിക്കാതെ ‘സമര്യയിൽനിന്ന്’ എന്നു പറയുന്നു. അതിനാൽ വംശീയമോ മതപരമോ ആയ വിശദീകരണം വിവർത്തനത്തിൽ കൂട്ടിച്ചേർക്കാതെ മൂലപാഠത്തിന്റെ രൂപം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായതും മാന്യവുമായ മലയാളം. ‘വെള്ളം കോരാൻ’, ‘കുടിക്കാൻ തരൂ’ എന്നീ പ്രയോഗങ്ങൾ കൃത്യവും സ്വാഭാവികവുമാണ്; ചരിത്രവർത്തമാനത്തിന്റെ വിവരം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
