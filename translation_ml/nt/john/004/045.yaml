source:
  edition: SBLGNT
  text: ὅτε οὖν ἦλθεν εἰς τὴν Γαλιλαίαν, ἐδέξαντο αὐτὸν οἱ Γαλιλαῖοι, πάντα ἑωρακότες ⸀ὅσα ἐποίησεν ἐν Ἱεροσολύμοις ἐν τῇ ἑορτῇ, καὶ αὐτοὶ γὰρ ἦλθον εἰς τὴν ἑορτήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/045.yaml
  text: So when he came into Galilee[a], the Galileans welcomed him, having seen all that he had done in Jerusalem at the feast[b], for they too had gone to the feast.
translation:
  language: ml
  text: അങ്ങനെ, അവൻ ഗലീലയിൽ എത്തിയപ്പോൾ, പെരുന്നാളിനിടെ[b] യെരൂശലേമിൽ അവൻ ചെയ്തതെല്ലാം കണ്ടിരുന്ന ഗലീലക്കാർ അവനെ സ്വാഗതം ചെയ്തു[a], കാരണം അവരും ആ പെരുന്നാളിന് പോയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവനെ സ്വീകരിച്ചു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് ക്രിയയ്ക്ക് സ്വീകരിക്കുക, സ്വാഗതം ചെയ്യുക എന്നീ അർഥങ്ങളുണ്ട്; ഇവിടെ സന്ദർഭം അനുകൂലമായ വരവേൽപ്പിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ഉത്സവത്തിനിടെ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദം ഒരു മതപരമായ പെരുന്നാളിനെ സൂചിപ്പിക്കുന്നു; ചുറ്റുമുള്ള സന്ദർഭത്തിൽ യെരൂശലേമിലേക്കു തീർഥാടകർ പോയിരുന്ന പെരുന്നാളാണ് ഉദ്ദേശിക്കപ്പെടുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: ὅτε οὖν
  choice: അങ്ങനെ, … എത്തിയപ്പോൾ
  rationale: οὖν സൂചിപ്പിക്കുന്ന ആഖ്യാനത്തുടർച്ചയും ὅτε സൂചിപ്പിക്കുന്ന സമയബന്ധവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἦλθεν εἰς τὴν Γαλιλαίαν
  choice: അവൻ ഗലീലയിൽ എത്തിയപ്പോൾ
  rationale: εἰς സൂചിപ്പിക്കുന്ന ഒരു പ്രദേശത്തേക്കുള്ള പ്രവേശനം ‘ഗലീലയിൽ എത്തുക’ എന്ന സ്വാഭാവിക പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: ἐδέξαντο αὐτὸν
  choice: അവനെ സ്വാഗതം ചെയ്തു
  rationale: സന്ദർഭത്തിൽ δέχομαι വെറും സ്വീകരണമല്ല, അനുകൂലമായ വരവേൽപ്പാണ് സൂചിപ്പിക്കുന്നത്; ‘സ്വീകരിച്ചു’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: οἱ Γαλιλαῖοι
  choice: ഗലീലക്കാർ
  rationale: പ്രദേശവാസികളെ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തവും സാധാരണവുമായ മലയാളരൂപം.
- source_word: πάντα ἑωρακότες ὅσα ἐποίησεν
  choice: അവൻ ചെയ്തതെല്ലാം കണ്ടിരുന്ന
  rationale: മുൻപ് നടന്നതും ഇപ്പോഴത്തെ സ്വീകരണത്തിന് പശ്ചാത്തലമായതുമായ കാഴ്ചയെ perfect participle സൂചിപ്പിക്കുന്നതിനാൽ ‘കണ്ടിരുന്ന’ എന്നു നൽകി.
- source_word: ἐν Ἱεροσολύμοις ἐν τῇ ἑορτῇ
  choice: പെരുന്നാളിനിടെ യെരൂശലേമിൽ
  rationale: സ്ഥലവും ഉത്സവകാലവും വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: καὶ αὐτοὶ γὰρ ἦλθον εἰς τὴν ἑορτήν
  choice: അവരും ആ പെരുന്നാളിനു പോയിരുന്നു
  rationale: γάρ നൽകുന്ന വിശദീകരണം മുൻവാക്യവുമായി അർധവിരാമത്തിലൂടെ ബന്ധിപ്പിക്കുകയും αὐτοίയുടെ ഉൾപ്പെടുത്തൽ/ഊന്നൽ ‘അവരും’ എന്നതിലൂടെ സംരക്ഷിക്കുകയും ചെയ്യുന്നു; മുൻകാലയാത്ര ‘പോയിരുന്നു’ എന്നു വ്യക്തമാക്കുന്നു.
