translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായതും മാന്യവുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിലെ കാരണപശ്ചാത്തലം സ്വാഭാവിക മലയാള പദക്രമത്തിലാക്കി; വ്യാഖ്യാനപരമായ അധികവിശദീകരണം മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
