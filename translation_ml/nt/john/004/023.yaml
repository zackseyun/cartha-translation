reference: John 4:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλὰ ἔρχεται ὥρα καὶ νῦν ἐστιν, ὅτε οἱ ἀληθινοὶ προσκυνηταὶ προσκυνήσουσιν τῷ πατρὶ ἐν πνεύματι καὶ ἀληθείᾳ, καὶ γὰρ ὁ πατὴρ τοιούτους ζητεῖ τοὺς προσκυνοῦντας αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/023.yaml
  text: But an hour is coming[a], and is now here, when the true worshipers will worship the Father in spirit and truth; for the Father indeed seeks such people to worship him.
translation:
  language: ml
  text: എന്നാൽ ഒരു സമയം വരുന്നു; അത് ഇപ്പോഴാണ്. അപ്പോൾ യഥാർഥ ആരാധകർ പിതാവിനെ ആത്മാവിലും സത്യത്തിലും[a] ആരാധിക്കും. കാരണം, തന്നെ ആരാധിക്കുന്ന അങ്ങനെയുള്ളവരെയാണ് പിതാവ് അന്വേഷിക്കുന്നത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പരിശുദ്ധാത്മാവിലും സത്യത്തിലും’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്ക് പ്രയോഗം പരിശുദ്ധാത്മാവിനാൽ ശക്തിപ്പെടുന്ന ആരാധനയെയോ മനുഷ്യന്റെ ആത്മാവിലുള്ള ആരാധനയെയോ ആത്മീയ യാഥാർഥ്യത്തിന്റെ സ്വഭാവമുള്ള ആരാധനയെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: എന്നാൽ
  rationale: സ്ഥലബന്ധിതമായ ആരാധനയെക്കുറിച്ചുള്ള മുൻചർച്ചയോടുള്ള വ്യക്തമായ വൈരുധ്യം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἔρχεται ὥρα
  choice: ഒരു നാഴിക വരുന്നു
  rationale: ὥρα എന്ന യോഹന്നാനീയ പദപ്രയോഗവും അതിന്റെ യുഗാന്ത്യസൂചനയും നിലനിർത്തുന്നു; അനിർദ്ദിഷ്ടതയ്ക്കായി ‘ഒരു’ ചേർത്തു.
- source_word: καὶ νῦν ἐστιν
  choice: ഇപ്പോൾ വന്നിരിക്കുന്നു
  rationale: പ്രതീക്ഷിച്ചിരുന്ന നാഴിക ഇതിനകം സന്നിഹിതമായെന്ന സാക്ഷാത്കൃത വർത്തമാനബലം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: οἱ ἀληθινοὶ προσκυνηταὶ
  choice: യഥാർഥ ആരാധകർ
  rationale: ἀληθινοί എന്നത് വ്യാജമല്ലാത്തതും ദൈവിക യാഥാർഥ്യത്തോട് ഒത്തുപോകുന്നതുമായ അർഥം വഹിക്കുന്നു; വിഭാഗീയ വ്യത്യാസം ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: προσκυνήσουσιν
  choice: ആരാധിക്കും
  rationale: ഭാവികാല സൂചന നേരായും അനാവശ്യ വ്യാഖ്യാനവിപുലീകരണമില്ലാതെയും നൽകുന്നു.
- source_word: τῷ πατρὶ
  choice: പിതാവിനെ
  rationale: യോഹന്നാനീയ സന്ദർഭത്തിലെ ദൈവിക അഭിധാനം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐν πνεύματι καὶ ἀληθείᾳ
  choice: ആത്മാവിലും സത്യത്തിലും
  rationale: ἐν രണ്ടു നാമങ്ങളെയും നിയന്ത്രിക്കുന്ന ഘടന നിലനിർത്തുകയും πνεῦμα മനുഷ്യാത്മാവിനെയോ പരിശുദ്ധാത്മാവിനെയോ ആത്മീയ മണ്ഡലത്തെയോ സൂചിപ്പിക്കാമെന്ന അവ്യക്തത പ്രധാനപാഠത്തിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: καὶ γὰρ
  choice: ആണല്ലോ
  rationale: γάρ നൽകുന്ന കാരണബന്ധവും καί നൽകുന്ന ഊന്നലും മലയാളത്തിലെ സ്വാഭാവിക ഊന്നൽഘടനയിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: τοιούτους ζητεῖ τοὺς προσκυνοῦντας αὐτόν
  choice: തന്നെ ആരാധിക്കുന്ന ഇങ്ങനെയുള്ളവരെയാണ് പിതാവ് അന്വേഷിക്കുന്നത്
  rationale: τοιούτους എന്ന ഗുണസൂചനയും തുടർന്നുള്ള കർത്തൃവാചക വിശേഷണത്തിന്റെ അർഥവും വ്യക്തമായി നിലനിർത്തുന്നു; ζητεῖ വർത്തമാനകാലത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ἐν πνεύματι എന്നതിന്റെ അർഥം
  choice: പ്രധാനപാഠത്തിൽ ‘ആത്മാവിൽ’ എന്ന് നിർവചനമില്ലാതെ നൽകി.
  alternative: ‘പരിശുദ്ധാത്മാവിൽ’; ‘ആത്മീയമായി’
  rationale: ആർട്ടിക്കിൾ ഇല്ലാത്ത ഗ്രീക്ക് പ്രയോഗം മനുഷ്യന്റെ ആത്മാവിനെയും പരിശുദ്ധാത്മാവിനെയും ആത്മീയ യാഥാർഥ്യത്തിന്റെ മണ്ഡലത്തെയും സൂചിപ്പിക്കാൻ കഴിയുന്നു. അതിനാൽ പ്രധാനപാഠം ഒരു വ്യാഖ്യാനം മാത്രം നിർബന്ധിക്കുന്നില്ല.
- issue: ‘യഥാർഥ ആരാധകർ’ എന്നതിന്റെ പരിധി
  choice: ഗുണപരമായി യഥാർഥമായ ആരാധകരെന്ന നിലയിൽ വിവർത്തനം ചെയ്തു.
  alternative: ‘സത്യസന്ധരായ ആരാധകർ’; ‘യഥാർഥത്തിലുള്ള ആരാധകർ’
  rationale: സ്ഥലബന്ധിത ആരാധനയും ദൈവത്തിന്റെ യാഥാർഥ്യത്തോട് ഒത്ത ആരാധനയും തമ്മിലുള്ള യോഹന്നാനീയ വൈരുധ്യം നിലനിർത്തുന്നു; വിഭാഗീയമായ തിരിച്ചറിയൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘നാഴിക’ യോഹന്നാനിലെ ὥρα എന്ന പ്രാധാന്യമുള്ള പദത്തെ നിലനിർത്തുന്നു. ദീർഘമായ ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി മൂന്ന് മലയാളവാക്യങ്ങളാക്കി; ആശയബന്ധം സംരക്ഷിച്ചു.
