  to: എന്നാൽ ഒരു സമയം വരുന്നു; അത് ഇപ്പോഴാണ്. അപ്പോൾ യഥാർഥ ആരാധകർ പിതാവിനെ ആത്മാവിലും സത്യത്തിലും[a] ആരാധിക്കും. കാരണം, തന്നെ ആരാധിക്കുന്ന അങ്ങനെയുള്ളവരെയാണ് പിതാവ് അന്വേഷിക്കുന്നത്.
  rationale: The revision corrects the aspectual overstatement in ‘വന്നിരിക്കുന്നു’ and replaces the potentially misleading traditional time-measure term ‘നാഴിക’ with idiomatic modern ‘സമയം.’ It retains the Greek ambiguity in ‘ആത്മാവിലും,’ the future force of προσκυνήσουσιν, and the explanatory-emphatic force of καὶ γάρ.
