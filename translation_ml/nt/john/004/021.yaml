id: JHN.4.21
reference: John 4:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγει αὐτῇ ὁ Ἰησοῦς· ⸂Πίστευέ μοι, γύναι⸃, ὅτι ἔρχεται ὥρα ὅτε οὔτε ἐν τῷ ὄρει τούτῳ οὔτε ἐν Ἱεροσολύμοις προσκυνήσετε τῷ πατρί.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/021.yaml
  text: Jesus said to her[a], “Believe me, woman[c][b], an hour is coming when neither on this mountain nor in Jerusalem will you worship the Father.”
translation:
  language: ml
  text: 'യേശു അവളോടു പറഞ്ഞു: “സ്ത്രീയേ[b], എന്നെ വിശ്വസിക്കൂ[a]. ഒരു സമയം[c] വരുന്നു; അപ്പോൾ നിങ്ങൾ പിതാവിനെ ഈ മലയിലോ യെരൂശലേമിലോ ആരാധിക്കുകയില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എന്നിൽ ആശ്രയിക്കൂ.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് ഒരാൾ പറയുന്നത് വിശ്വസിക്കുക എന്നും ആ വ്യക്തിയിൽ ആശ്രയിക്കുക എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: ഈ സന്ദർഭത്തിൽ ‘സ്ത്രീയേ’ എന്നത് ആദരവോടെയുള്ള സംബോധനയാണ്; പരുഷമായ പ്രയോഗമല്ല.
    reason: cultural_note
  - marker: c
    text: അഥവാ, ‘ആ സമയം വരുന്നു.’ ഇവിടെ നാമത്തിന് നിർദേശക ഉപപദമില്ലെങ്കിലും, ദൈവത്തിന്റെ പദ്ധതിയിലെ നിർണായക സമയത്തെ സൂചിപ്പിക്കാൻ യോഹന്നാൻ ‘സമയം’ എന്ന പദം പ്രമേയാത്മകമായി ഉപയോഗിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστευέ μοι
  choice: എന്നെ വിശ്വസിക്കൂ
  rationale: തുടർന്ന് യേശു പറയുന്ന കാര്യം സത്യമെന്നു സ്വീകരിക്കാനുള്ള നേരിട്ടുള്ള ആഹ്വാനമാണ്. യോഹന്നാനിൽ ആവർത്തിക്കുന്ന πιστεύω എന്ന ക്രിയയുമായുള്ള പദബന്ധവും ഇത് നിലനിർത്തുന്നു; ‘എന്നിൽ ആശ്രയിക്കൂ’ എന്നത് ബന്ധപരമായ ആശ്രയത്തിന് കൂടുതൽ ഊന്നൽ നൽകും.
- source_word: γύναι
  choice: സ്ത്രീയേ
  rationale: ഗ്രീക്കിലെ നേരിട്ടുള്ള സംബോധനത്തിന്റെ അർത്ഥം കൃത്യമായി നിലനിർത്തുന്നു. ഈ സന്ദർഭത്തിൽ അത് അപമര്യാദയല്ലെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു; ‘മഹതിയേ’ പോലുള്ള പദങ്ങൾ മൂലത്തിൽ ഇല്ലാത്ത ഭാവം ചേർക്കും.
- source_word: ἔρχεται ὥρα
  choice: ഒരു നാഴിക വരുന്നു
  rationale: ὥραയ്ക്ക് നിർദേശക ഉപപദം ഇല്ലാത്തതിനാൽ ‘ഒരു നാഴിക’ എന്നു പരിഭാഷപ്പെടുത്തി. ‘നാഴിക’ നിലനിർത്തുന്നത് യോഹന്നാനിലെ നിർണായകമായ ദൈവിക സമയത്തെ സൂചിപ്പിക്കുന്ന ആവർത്തിത പ്രമേയത്തെ സംരക്ഷിക്കുന്നു; ‘ഒരു സമയം’ കൂടുതൽ പൊതുവായിരിക്കും.
- source_word: ἐν τῷ ὄρει τούτῳ
  choice: ഈ മലയിൽ
  rationale: ആരാധനയുടെ സ്ഥലമായി ചർച്ച ചെയ്യപ്പെടുന്ന സമര്യരുടെ വിശുദ്ധമലയെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ സ്വാഭാവിക സ്ഥലപ്രയോഗമാണ് ‘ഈ മലയിൽ’.
- source_word: ἐν Ἱεροσολύμοις
  choice: യെരൂശലേമിൽ
  rationale: നഗരത്തിനുള്ള മലയാളത്തിലെ സ്വാഭാവിക സ്ഥലരൂപം ഉപയോഗിക്കുന്നു.
- source_word: προσκυνήσετε
  choice: നിങ്ങൾ ... ആരാധിക്കുക
  rationale: ഭാവികാലത്തെ സൂചിപ്പിക്കുന്ന വാക്യഘടനയിൽ ‘ആരാധിക്കുക’ എന്നത് ഇവിടെ ഉദ്ദേശിക്കുന്ന മതപരമായ പ്രവർത്തനത്തിന്റെ വ്യാപ്തി നൽകുന്നു. ‘കുമ്പിടുക’ ശരീരഭാവത്തിന് അനാവശ്യമായി പരിമിതപ്പെടുത്താം.
- source_word: τῷ πατρί
  choice: പിതാവിനെ
  rationale: യോഹന്നാന്റെ സന്ദർഭത്തിൽ ദൈവത്തെ പിതാവായി സൂചിപ്പിക്കുന്നതിനാൽ വ്യക്തിപരമായ ദൈവിക അഭിസംബോധന നിലനിർത്തുന്നു.
- source_word: οὔτε ... οὔτε
  choice: ഈ മലയിലോ യെരൂശലേമിലോ അല്ല
  rationale: രണ്ട് ആരാധനാകേന്ദ്രങ്ങളെയും ഒരുപോലെ നിഷേധിക്കുന്ന ഗ്രീക്ക് സഹബന്ധത്തെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: γύναι എന്ന സംബോധനയുടെ ഭാവം
  choice: ‘സ്ത്രീയേ’ എന്ന് നേരിട്ട് പരിഭാഷപ്പെടുത്തി; ആദരസൂചക സ്വഭാവം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി
  alternative: മഹതിയേ; പ്രിയ സ്ത്രീയേ
  rationale: മൂലവാക്ക് നിലനിർത്തുമ്പോഴും യേശുവിന്റെ വാക്കുകൾ പരുഷമായി തെറ്റിദ്ധരിക്കാതിരിക്കാൻ സാംസ്കാരിക വിശദീകരണം നൽകുന്നു; പ്രധാനപാഠത്തിൽ മൂലത്തിൽ ഇല്ലാത്ത സ്നേഹമോ ഔപചാരിക ബഹുമാനമോ ചേർക്കുന്നില്ല.
- issue: യോഹന്നാനിലെ ὥρα പ്രമേയം
  choice: ‘സമയം’ എന്ന് പൊതുവാക്കാതെ ‘നാഴിക’ നിലനിർത്തി
  alternative: ഒരു സമയം വരുന്നു; ആ സമയം വരുന്നു
  rationale: ദൈവിക പദ്ധതിയിലെ നിർണായക ഘട്ടത്തെക്കുറിച്ചുള്ള യോഹന്നാന്റെ ആവർത്തിത ഭാഷയും അതിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും വ്യാഖ്യാനിച്ച് തീർക്കാതെ സംരക്ഷിക്കുന്നു.
- issue: ആരാധനയുടെ സ്ഥലത്തെക്കുറിച്ചുള്ള നിഷേധം
  choice: ഈ മലയെയും യെരൂശലേമിനെയും സമാന്തരമായി നിഷേധിച്ചു
  alternative: ഈ സ്ഥലങ്ങളിൽ ആരാധന അവസാനിക്കും എന്ന വിശദീകരണപരമായ പുനരാഖ്യാനം
  rationale: വാക്യം ആരാധന അവസാനിക്കുമെന്ന് പറയുന്നില്ല; പിതാവിനോടുള്ള ആരാധന ഒരു പ്രത്യേക മത്സരാധിഷ്ഠിത കേന്ദ്രത്തിൽ ബന്ധിതമല്ലാത്ത ഘട്ടത്തെ സൂചിപ്പിക്കുന്നു. അതിലധികം വ്യാഖ്യാനം പ്രധാനപാഠത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വാക്യഘടനയാണ് ഉപയോഗിച്ചത്. ‘നാഴിക’ സാധാരണ സംഭാഷണത്തിൽ കുറച്ച് ഔപചാരികമെങ്കിലും, യോഹന്നാനിലെ ആവർത്തിത ὥρα പ്രമേയം സംരക്ഷിക്കാൻ ഉദ്ദേശപൂർവം നിലനിർത്തി. ‘നിങ്ങൾ’ എന്ന രൂപം ഗ്രീക്കിലെ ബഹുവചനത്തെ പ്രതിഫലിപ്പിക്കുമ്പോൾ മലയാളത്തിൽ സ്ത്രീയോടുള്ള മാന്യമായ ഏകവചന സംബോധനയായും സ്വാഭാവികമാണ്.
