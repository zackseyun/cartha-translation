id: JHN.4.6
reference: John 4:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἦν δὲ ἐκεῖ πηγὴ τοῦ Ἰακώβ. ὁ οὖν Ἰησοῦς κεκοπιακὼς ἐκ τῆς ὁδοιπορίας ἐκαθέζετο οὕτως ἐπὶ τῇ πηγῇ· ὥρα ἦν ⸀ὡς ἕκτη.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/006.yaml
  text: Jacob’s well was there[a]. So Jesus, wearied from the journey, was sitting there by the well[c][b]. It was about the sixth hour.
translation:
  language: ml
  text: യാക്കോബിന്റെ കിണർ അവിടെ ഉണ്ടായിരുന്നു[a]. യാത്ര ചെയ്ത് ക്ഷീണിച്ച യേശു അതിനാൽ കിണറിനരികെ അങ്ങനെ ഇരിക്കുകയായിരുന്നു[b]. സമയം ഏകദേശം ആറാം മണിക്കൂറായിരുന്നു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഉറവ’; πηγή എന്ന ഗ്രീക്ക് പദത്തിന് ഉറവയെയോ കിണറിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘അങ്ങനെ’ എന്നതിന് ‘ആ നിലയിൽത്തന്നെ’ അല്ലെങ്കിൽ ‘ആ രീതിയിൽ’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: c
    text: യഹൂദരുടെ പകൽ-മണിക്കൂർ കണക്കനുസരിച്ചാൽ ഇത് ഏകദേശം ഉച്ചയാണ്. റോമൻ സമയക്കണക്കാണ് ഉദ്ദേശിച്ചതെന്ന വ്യാഖ്യാനത്തിൽ ഏകദേശം വൈകുന്നേരം ആറുമണി എന്നും മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: πηγὴ τοῦ Ἰακώβ
  choice: യാക്കോബിന്റെ കിണർ
  rationale: πηγή എന്നതിന് ‘ഉറവ’ എന്നും ‘കിണർ’ എന്നും അർഥമാകാം. വെള്ളം കോരുന്നതിനെക്കുറിച്ചുള്ള തുടർസന്ദർഭവും ഈ സ്ഥലത്തിന്റെ പരമ്പരാഗത പേരും കണക്കിലെടുത്ത് മുഖ്യപാഠത്തിൽ ‘കിണർ’ സ്വീകരിച്ചു; മറ്റർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: κεκοπιακὼς ἐκ τῆς ὁδοιπορίας
  choice: യാത്രചെയ്തു ക്ഷീണിച്ചിരുന്ന
  rationale: κεκοπιακὼς എന്ന perfect participle യാത്രയുടെ അധ്വാനഫലമായി തുടരുന്ന ക്ഷീണാവസ്ഥയെ സൂചിപ്പിക്കുന്നു. ഈ മലയാളപ്രയോഗം കാരണവും നിലനിൽക്കുന്ന അവസ്ഥയും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἐκαθέζετο
  choice: ഇരിക്കുകയായിരുന്നു
  rationale: Imperfect രൂപത്തിന്റെ വിവരണാത്മകവും തുടരുന്നതുമായ ഭൂതകാലഭാവം മലയാളത്തിലെ ‘ഇരിക്കുകയായിരുന്നു’ വ്യക്തമാക്കുന്നു.
- source_word: οὕτως
  choice: അങ്ങനെ
  rationale: പദത്തിന്റെ രീതിസൂചകമായ അർഥം ഒഴിവാക്കാതെ നിലനിർത്തുന്നു. അത് ‘ആ നിലയിൽ’ അല്ലെങ്കിൽ ‘ഉണ്ടായിരുന്നതുപോലെതന്നെ’ എന്ന സൂക്ഷ്മാർഥം നൽകാമെന്ന കാര്യം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: ἐπὶ τῇ πηγῇ
  choice: കിണറിനരികെ
  rationale: ἐπί + dative ഇവിടെയുള്ള സ്ഥാനസൂചനയാണ്; ഇരിക്കുന്ന ഒരാളുടെ സ്ഥാനം മലയാളത്തിൽ സ്വാഭാവികമായി ‘കിണറിനരികെ’ എന്നു പറയുന്നു.
- source_word: ὥρα ἦν ὡς ἕκτη
  choice: അപ്പോൾ ഏകദേശം ആറാം മണിക്കൂറായിരുന്നു
  rationale: ὡς എന്നതിന്റെ ഏകദേശാർഥം ‘ഏകദേശം’കൊണ്ട് നൽകി. ആധുനിക ഘടികാരസമയം മുഖ്യപാഠത്തിൽ നിശ്ചയിക്കാതെ മൂലത്തിലെ ‘ആറാം മണിക്കൂർ’ നിലനിർത്തി.
- source_word: οὖν
  choice: അതിനാൽ
  rationale: മുൻപറഞ്ഞ യാത്രാക്ഷീണവും യേശു ഇരുന്നതും തമ്മിലുള്ള അനുമാനാത്മക/കാരണബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ‘ആറാം മണിക്കൂർ’ എന്ന സമയസൂചന
  choice: മുഖ്യപാഠത്തിൽ ‘ഏകദേശം ആറാം മണിക്കൂർ’ എന്ന മൂലരൂപം നിലനിർത്തി.
  alternative: യഹൂദരുടെ പകൽസമയ കണക്കനുസരിച്ച് ഏകദേശം ഉച്ച; റോമൻ സമയക്കണക്കെന്ന വ്യാഖ്യാനത്തിൽ ഏകദേശം വൈകുന്നേരം ആറുമണി.
  rationale: ഗ്രീക്ക് പാഠം ആധുനിക ഘടികാരസമയം വ്യക്തമാക്കുന്നില്ല. യോഹന്നാനിലെ സമയക്കണക്കിനെക്കുറിച്ചുള്ള വ്യാഖ്യാനവ്യത്യാസം പരിഭാഷയിൽ തീർപ്പാക്കാതെ അടിക്കുറിപ്പിലൂടെ അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘അങ്ങനെ’, ‘ആറാം മണിക്കൂർ’ എന്നീ മൂലപാഠത്തിലെ വ്യാഖ്യാനസാധ്യതയുള്ള പ്രയോഗങ്ങൾ മുഖ്യപാഠത്തിൽ നിലനിർത്തി; ആവശ്യമായ വിശദീകരണം അടിക്കുറിപ്പുകളിൽ നൽകി.
