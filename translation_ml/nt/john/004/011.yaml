id: JHN.4.11
reference: John 4:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸂ἡ γυνή⸃· Κύριε, οὔτε ἄντλημα ἔχεις καὶ τὸ φρέαρ ἐστὶν βαθύ· πόθεν οὖν ἔχεις τὸ ὕδωρ τὸ ζῶν;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/011.yaml
  text: The woman said to him[a], “Lord, you have neither a bucket nor is the well deep[b]. So where do you get the living water?”
translation:
  language: ml
  text: 'ആ സ്ത്രീ അവനോടു പറഞ്ഞു: “കർത്താവേ[a], അങ്ങേക്കു വെള്ളം കോരാനുള്ള പാത്രമില്ല; കിണർ ആഴമുള്ളതുമാണ്. അങ്ങനെയെങ്കിൽ ആ ജീവനുള്ള വെള്ളം[b] അങ്ങേക്ക് എവിടെനിന്നാണ് ലഭിക്കുന്നത്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അയ്യാ.” ഗ്രീക്കിലെ κύριε ആദരസൂചകമായ സംബോധനമായും “കർത്താവേ” എന്ന അർഥത്തിലും ഉപയോഗിക്കാം.
    reason: alternative_reading
  - marker: b
    text: അഥവാ “ഒഴുകുന്ന വെള്ളം,” അതായത് കെട്ടിക്കിടക്കുന്ന വെള്ളത്തിനു പകരം ഉറവയിൽനിന്നോ മറ്റോ ഒഴുകിവരുന്ന ശുദ്ധജലം. യേശുവിന്റെ വാക്കുകളിലെ ആഴമുള്ള അർഥവും മുഖ്യപാഠത്തിലെ പ്രയോഗം നിലനിർത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: അവനോടു പറഞ്ഞു
  rationale: ഗ്രീക്കിൽ ചരിത്രവർത്തമാനകാലമാണെങ്കിലും, മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനശൈലിക്കായി ഭൂതകാലപ്രയോഗം സ്വീകരിച്ചു.
- source_word: ἡ γυνή
  choice: ആ സ്ത്രീ
  rationale: സന്ദർഭത്തിൽ കിണറിനരികിലുള്ള ശമര്യസ്ത്രീയെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ മുൻപ് പരാമർശിച്ച വ്യക്തിയെ സ്വാഭാവികമായി ചൂണ്ടിക്കാണിക്കാൻ ‘ആ’ ചേർത്തു.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: κύριος എന്ന പദത്തിന്റെ പതിവ് ദൈവശാസ്ത്രപരമായ രൂപം നിലനിർത്തുന്നു; എന്നാൽ ഇവിടെ ആദരസൂചകമായ സംബോധന മാത്രമായിരിക്കാം എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: ἄντλημα
  choice: വെള്ളം കോരാനുള്ള പാത്രം
  rationale: കിണറ്റിൽനിന്നു വെള്ളം കോരാൻ ഉപയോഗിക്കുന്ന ഉപകരണത്തെയാണ് പദം സൂചിപ്പിക്കുന്നത്. ‘പാത്രം’ എന്ന പൊതുവായ രൂപം ബക്കറ്റ്, കുടം തുടങ്ങിയ പ്രത്യേക രൂപങ്ങൾ അനാവശ്യമായി നിർണയിക്കുന്നത് ഒഴിവാക്കുന്നു.
- source_word: τὸ φρέαρ
  choice: കിണർ
  rationale: ഈ സന്ദർഭത്തിൽ വെള്ളം കോരുന്ന ആഴമുള്ള കിണറാണ് ഉദ്ദേശ്യം.
- source_word: βαθύ
  choice: ആഴമുള്ളത്
  rationale: മൂലത്തിലെ ലളിതമായ ഗുണവിശേഷണം അതിശയോക്തിയില്ലാതെ പകർത്തുന്നു.
- source_word: πόθεν οὖν
  choice: അങ്ങനെയെങ്കിൽ … എവിടെനിന്ന്
  rationale: πόθεν ഉറവിടത്തെക്കുറിച്ചു ചോദിക്കുന്നു; οὖν മുൻവാക്യങ്ങളിൽനിന്നുള്ള നിഗമനബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ ‘അങ്ങനെയെങ്കിൽ’ എന്നു നൽകി.
- source_word: τὸ ὕδωρ τὸ ζῶν
  choice: ഈ ജീവനുള്ള വെള്ളം
  rationale: സാധാരണ ഭാഷയിൽ ‘ഒഴുകുന്ന ശുദ്ധജലം’ എന്ന അർഥവും യോഹന്നാന്റെ വിവരണത്തിലെ ആഴമുള്ള രൂപകാർഥവും ഒരുമിച്ചു നിലനിർത്തുന്നു.
theological_decisions:
- issue: ശമര്യസ്ത്രീ യേശുവിനെ Κύριε എന്നു സംബോധന ചെയ്യുന്നത്
  choice: കർത്താവേ
  alternative: യജമാനനേ / അങ്ങുന്നേ
  rationale: ‘കർത്താവേ’ κύριος എന്ന പദത്തിന്റെ പ്രധാന അർഥവും തുടർന്നുള്ള യോഹന്നാനീയ പ്രതിധ്വനിയും നിലനിർത്തുന്നു. സംഭാഷണത്തിന്റെ ഈ ഘട്ടത്തിൽ അത് ആദരസൂചകമായ ‘യജമാനനേ’ എന്ന അർഥത്തിലാകാമെന്ന സന്ദർഭസാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി; സ്ത്രീയുടെ വിശ്വാസബോധം മുൻകൂട്ടി നിർണയിച്ചിട്ടില്ല.
- issue: ὕδωρ τὸ ζῶν എന്ന പ്രയോഗത്തിലെ ഇരട്ട അർഥം
  choice: ജീവനുള്ള വെള്ളം
  alternative: ഒഴുകുന്ന വെള്ളം
  rationale: ‘ഒഴുകുന്ന വെള്ളം’ എന്ന സാധാരണ അർഥത്തിലേക്കു മാത്രം ചുരുക്കാതെ, സ്ത്രീയുടെ അക്ഷരാർഥബോധവും യേശുവിന്റെ വാക്കുകളിലെ ആഴമുള്ള അർഥവും തമ്മിലുള്ള ഉദ്ദേശ്യപൂർവമായ സംഘർഷം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സംഭാഷണശൈലി സ്വീകരിച്ചു. ‘അങ്ങേക്ക്’ എന്ന ആദരസൂചക സർവനാമം സംബോധനത്തിന്റെ സ്വരം നിലനിർത്തുന്നു. ഗ്രീക്കിലെ οὔτε … καί ഘടനയെ അസ്വാഭാവികമായ ‘ഒന്നുമില്ല, കിണർ ആഴമുള്ളതുമല്ല’ എന്ന രൂപത്തിലാക്കാതെ, രണ്ടു വസ്തുതകൾ ചേർത്ത് പറയുന്ന സ്വാഭാവിക മലയാളമായി നൽകി.
