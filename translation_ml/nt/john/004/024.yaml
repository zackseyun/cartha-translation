id: JHN.4.24
reference: John 4:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πνεῦμα ὁ θεός, καὶ τοὺς προσκυνοῦντας αὐτὸν ἐν πνεύματι καὶ ἀληθείᾳ δεῖ προσκυνεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/024.yaml
  text: God is spirit[b][a], and those who worship him must worship in spirit and truth.
translation:
  language: ml
  text: ദൈവം ആത്മാവാണ്[b]; അവനെ ആരാധിക്കുന്നവർ ആത്മാവിലും സത്യത്തിലും[a] ആരാധിക്കേണ്ടതാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പരിശുദ്ധാത്മാവിലും സത്യത്തിലും.’ ഗ്രീക്ക് പ്രയോഗത്തെ കൂടുതൽ സവിശേഷമായി ഇങ്ങനെ മനസ്സിലാക്കാം; മുഖ്യപാഠം അതിന്റെ വിശാലമായ അർഥം നിലനിർത്തുന്നു.
    reason: alternative_reading
  - marker: b
    text: ‘ദൈവം ആത്മാവാണ്’ എന്നത് ദൈവത്തിന്റെ സ്വഭാവത്തെക്കുറിച്ചുള്ള പ്രസ്താവനയാണ്; ദൈവം മറ്റു ആത്മജീവികളിൽ ഒരാൾ മാത്രമാണെന്ന് ഇതിന് അർഥമില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα
  choice: ആത്മാവ്
  rationale: ലേഖനമില്ലാതെ വിഷയത്തിനു മുമ്പിൽ വരുന്ന വിധേയനാമം ദൈവത്തിന്റെ സ്വഭാവഗുണം പ്രസ്താവിക്കുന്നു; ദൈവം മറ്റു ആത്മജീവികളിൽ ഒരാൾ മാത്രമാണെന്ന അർഥം ഒഴിവാക്കാൻ ‘ഒരു ആത്മാവ്’ എന്നു ചേർത്തിട്ടില്ല.
- source_word: ὁ θεός
  choice: ദൈവം
  rationale: θεός എന്നതിന്റെ സ്വാഭാവികവും പ്രാമാണികവുമായ മലയാളരൂപം; ഗ്രീക്കിലെ ലേഖനം ഈ വാക്യത്തിൽ ‘ദൈവം’ തന്നെയാണ് വിഷയം എന്നു വ്യക്തമാക്കുന്നു.
- source_word: τοὺς προσκυνοῦντας αὐτὸν
  choice: അവിടത്തെ ആരാധിക്കുന്നവർ
  rationale: ലേഖനത്തോടുകൂടിയ വർത്തമാനകാല കൃദന്തം ആരാധിക്കുന്നവരെ ഒരു പൊതുവിഭാഗമായി സൂചിപ്പിക്കുന്നു; ‘ആരാധിക്കുന്നവർ’ അതിന്റെ പൊതുവായതും തുടരുന്നതുമായ ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐν πνεύματι
  choice: ആത്മാവിൽ
  rationale: πνεύματι ലേഖനമില്ലാത്തതും ἀληθείᾳ-യോടു സമാന്തരമായി നിൽക്കുന്നതുമാകയാൽ വിശാലമായ അർഥം നിലനിർത്തുന്നു; ഇത് പരിശുദ്ധാത്മാവിനെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്ന വായനയ്ക്കും ഇടനൽകുന്നതിനാൽ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: ἀληθείᾳ
  choice: സത്യത്തിൽ
  rationale: യോഹന്നാന്റെ പ്രയോഗത്തിൽ വസ്തുത, വെളിപ്പെടുത്തപ്പെട്ട യാഥാർഥ്യം എന്നീ ഭാവങ്ങൾ ഉൾക്കൊള്ളുന്ന ἀλήθεια-യുടെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: δεῖ προσκυνεῖν
  choice: ആരാധിക്കേണ്ടതാണ്
  rationale: δεῖ പ്രകടിപ്പിക്കുന്ന അനിവാര്യതയും ബാധ്യതയും മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ രീതിയിൽ നൽകുന്നു.
theological_decisions:
- issue: ‘ദൈവം ആത്മാവാകുന്നു’ എന്നതിന്റെ അർഥം
  choice: ദൈവത്തിന്റെ സ്വഭാവത്തെക്കുറിച്ചുള്ള ഗുണാത്മക പ്രസ്താവനയായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ദൈവം ഒരു ആത്മാവാണ്.’
  rationale: ഗ്രീക്ക് പദക്രമവും πνεῦμα-യ്ക്ക് ലേഖനമില്ലാത്തതും ഗുണാത്മക വിധേയത്തെ പിന്തുണയ്ക്കുന്നു. അതിനാൽ ദൈവം ആത്മജീവികളുടെ ഒരു വർഗത്തിലെ ഒരംഗം മാത്രമാണെന്ന ധ്വനി ഒഴിവാക്കുന്നു.
- issue: ‘ആത്മാവിലും സത്യത്തിലും’ എന്നതിന്റെ അർഥം
  choice: വാക്യത്തിന്റെ വിശാലത നിലനിർത്തുന്ന ‘ആത്മാവിലും സത്യത്തിലും’ എന്ന രൂപം സ്വീകരിച്ചു.
  alternative: ‘പരിശുദ്ധാത്മാവിലും സത്യത്തിലും’; ‘ആത്മാർഥതയോടും സത്യത്തോടുംകൂടെ.’
  rationale: ലേഖനമില്ലാത്ത πνεύματι, ἀληθείᾳ എന്നീ പദങ്ങൾ വാക്യത്തെ പരിശുദ്ധാത്മാവിനെ മാത്രം സൂചിപ്പിക്കുന്നതായോ വെറും ആത്മാർഥത മാത്രമായോ ചുരുക്കാൻ നിർബന്ധിക്കുന്നില്ല. കൂടുതൽ പ്രത്യേകമായ വായന അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ദൈവത്തെ സൂചിപ്പിക്കാൻ ആദരസൂചകമായ ‘അവിടത്തെ’ ഉപയോഗിച്ചു. ‘ആരാധിക്കേണ്ടതാണ്’ δεῖ-യുടെ അനിവാര്യത നിലനിർത്തുന്നു; വ്യാഖ്യാനപരമായി നിർണായകമായ രണ്ടു സാധ്യതകളും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
