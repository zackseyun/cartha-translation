revisions:
- from: എങ്കിലും, യേശു തന്നെയല്ല സ്നാനം കഴിപ്പിച്ചുകൊണ്ടിരുന്നത്[a]; അവന്റെ ശിഷ്യന്മാരായിരുന്നു—
  to: എങ്കിലും, യേശു തന്നേ സ്നാനം കഴിപ്പിച്ചുകൊണ്ടിരുന്നതല്ല; മറിച്ച്, അവന്റെ ശിഷ്യന്മാരായിരുന്നു—
  rationale: The revision explicitly renders the Greek adversative ἀλλ’ with ‘മറിച്ച്’ and adjusts the negative verbal construction to idiomatic modern Malayalam. It preserves the emphatic ‘തന്നേ,’ the imperfect’s possible ongoing/customary sense, the ellipsis in the second clause, and the source’s trailing dash.
