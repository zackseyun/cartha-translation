translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. നേരിട്ടുള്ള സംഭാഷണത്തിന്റെ സ്വാഭാവികതയ്ക്കായി ‘ഭക്ഷണം കഴിക്കൂ’ എന്നും, മൂലത്തിലെ തുടർച്ചയായ അഭ്യർഥന പ്രകടമാക്കാൻ ‘നിർബന്ധിച്ചുകൊണ്ടിരുന്നു’ എന്നും നൽകി.
