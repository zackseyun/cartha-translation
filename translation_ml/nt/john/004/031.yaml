  text: ⸀Ἐν τῷ μεταξὺ ἠρώτων αὐτὸν οἱ μαθηταὶ λέγοντες· Ῥαββί, φάγε.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/031.yaml
  text: Meanwhile, the disciples were urging him, saying, “Rabbi, eat.”
translation:
  language: ml
  text: അതിനിടെ[a] ശിഷ്യന്മാർ അവനോട്, “റബ്ബീ[c], ഭക്ഷണം കഴിക്കൂ,” എന്നു പറഞ്ഞ് അഭ്യർഥിച്ചുകൊണ്ടിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അതേസമയം.”
    reason: lexical_alternative
  - marker: b
    text: ഈ ക്രിയയെ “ചോദിച്ചുകൊണ്ടിരുന്നു” എന്നോ “വീണ്ടുംവീണ്ടും അഭ്യർഥിച്ചുകൊണ്ടിരുന്നു” എന്നോ പരിഭാഷപ്പെടുത്താം; ഇവിടെ യേശു ഭക്ഷണം കഴിക്കണമെന്ന് അവർ തുടർച്ചയായി അഭ്യർഥിക്കുന്ന അർഥമാണ്.
    reason: lexical_alternative
  - marker: c
    text: “റബ്ബീ” എന്നത് യഹൂദർ അഭിസംബോധനയ്ക്കായി ഉപയോഗിച്ചിരുന്ന ഒരു ബഹുമാനപദമാണ്; അതിന് “ഗുരു” എന്നും അർഥമുണ്ട്.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐν τῷ μεταξὺ
  choice: അതിനിടെ
  rationale: സ്ത്രീ പോയതിനും തുടർന്നുള്ള സംഭാഷണത്തിനും ഇടയിലുള്ള സമയത്തെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്. ‘അതിനിടെ’ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: ἠρώτων
  choice: നിർബന്ധിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാല ക്രിയ തുടർന്നുകൊണ്ടിരുന്നോ ആവർത്തിച്ചോ ഉള്ള അഭ്യർഥനയെ സൂചിപ്പിക്കുന്നു. യേശു ഭക്ഷണം കഴിക്കണമെന്ന് ശിഷ്യന്മാർ വെറുതെ ചോദിക്കുകയല്ല, പ്രേരിപ്പിച്ച് അഭ്യർഥിക്കുകയാണ് എന്ന സന്ദർഭാർഥം ഈ പരിഭാഷ നൽകുന്നു; ബലപ്രയോഗം എന്ന അർഥമല്ല ഇവിടെ ഉദ്ദേശിക്കുന്നത്.
- source_word: αὐτὸν
  choice: അവനോട്
  rationale: സർവനാമം യേശുവിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സംസാരത്തിന്റെ സ്വീകർത്താവിനെ ‘അവനോട്’ എന്ന് സ്വാഭാവികമായി രേഖപ്പെടുത്തുന്നു.
- source_word: οἱ μαθηταὶ
  choice: ശിഷ്യന്മാർ
  rationale: സന്ദർഭത്തിൽ ഇതിനകം അറിയപ്പെടുന്ന ശിഷ്യസംഘത്തെയാണ് നിർദ്ദിഷ്ട പദം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ പ്രത്യേക നിർദ്ദേശകപദം ചേർക്കേണ്ടതില്ല.
- source_word: λέγοντες
  choice: എന്നു പറഞ്ഞ്
  rationale: കൃദ്യന്തം ശിഷ്യന്മാരുടെ അഭ്യർഥനയുടെ വാക്കുകൾ അവതരിപ്പിക്കുന്നു. ‘എന്നു പറഞ്ഞ്’ പ്രധാനക്രിയയുമായുള്ള ബന്ധം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: Ῥαββί
  choice: റബ്ബീ
  rationale: യേശുവിനെ അഭിസംബോധന ചെയ്യുന്ന യഹൂദ ബഹുമാനപദം ലിപ്യന്തരണം ചെയ്ത് നിലനിർത്തുന്നു; യോഹന്നാനിലെ സാംസ്കാരിക നിറം ഇതിലൂടെ സംരക്ഷിക്കപ്പെടുന്നു.
- source_word: φάγε
  choice: ഭക്ഷണം കഴിക്കൂ
  rationale: ഏകവചന ആജ്ഞാരൂപത്തിന്റെ നേരിട്ടുള്ള അർഥം നൽകുന്നു. മലയാളത്തിൽ ‘കഴിക്കൂ’ എന്നതിനെക്കാൾ ‘ഭക്ഷണം കഴിക്കൂ’ സന്ദർഭത്തിന് വ്യക്തവും സ്വാഭാവികവുമാണ്.
