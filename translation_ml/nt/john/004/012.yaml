source:
  edition: SBLGNT
  text: μὴ σὺ μείζων εἶ τοῦ πατρὸς ἡμῶν Ἰακώβ, ὃς ἔδωκεν ἡμῖν τὸ φρέαρ καὶ αὐτὸς ἐξ αὐτοῦ ἔπιεν καὶ οἱ υἱοὶ αὐτοῦ καὶ τὰ θρέμματα αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/012.yaml
  text: Are you greater than our father Jacob[a], who gave us the well and drank from it himself, as did his sons and his livestock?
translation:
  language: ml
  text: ഈ കിണർ ഞങ്ങൾക്കു തന്ന നമ്മുടെ പിതാവായ യാക്കോബിനെക്കാൾ നീ വലിയവനല്ലല്ലോ?[a] അദ്ദേഹംതന്നെ ഇതിൽനിന്ന് കുടിച്ചു; അദ്ദേഹത്തിന്റെ പുത്രന്മാരും വളർത്തുമൃഗങ്ങളും കുടിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “നമ്മുടെ പിതാവായ യാക്കോബിനെക്കാൾ നീ വലിയവനാണോ?” ഗ്രീക്കിലെ μή ഉപയോഗിച്ചുള്ള ചോദ്യം ‘അല്ല’ എന്ന ഉത്തരം പ്രതീക്ഷിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ σὺ
  choice: വലിയവനാണോ നീ?
  rationale: μή കൊണ്ടു തുടങ്ങുന്ന ചോദ്യം ‘അല്ല’ എന്ന ഉത്തരം പ്രതീക്ഷിക്കുന്ന വെല്ലുവിളിയാണ്. മലയാളത്തിലെ ചോദ്യം അതിന്റെ വാഗ്‌ഭാവം നിലനിർത്തുന്നു; അവസാനത്തെ ‘നീ’ σὺയുടെ ഊന്നൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: μείζων
  choice: വലിയവൻ
  rationale: ഇവിടെ ശാരീരിക വലിപ്പമല്ല, മഹത്ത്വമോ പദവിയോ ആണ് ഉദ്ദേശ്യം. ‘വലിയവൻ’ ആ അർഥത്തിൽ സ്വാഭാവികമായ മലയാളപ്രയോഗമാണ്.
- source_word: τοῦ πατρὸς ἡμῶν Ἰακώβ
  choice: നമ്മുടെ പിതാവായ യാക്കോബ്
  rationale: സമര്യസ്ത്രീ അവകാശപ്പെടുന്ന പൂർവികബന്ധവും ആദരസൂചകമായ കുടുംബഭാഷയും ഇത് നിലനിർത്തുന്നു.
- source_word: ἔδωκεν ἡμῖν
  choice: ഞങ്ങൾക്കു തന്നത്
  rationale: ഏറിസ്റ്റ് ക്രിയയുടെ ഭൂതകാലസംഭവം ലളിതവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: τὸ φρέαρ
  choice: ഈ കിണർ
  rationale: φρέαρ ഇവിടെ വെള്ളം കോരുന്ന കിണറിനെയാണ് സൂചിപ്പിക്കുന്നത്; അടുത്തുള്ള ദൃശ്യസന്ദർഭം കണക്കിലെടുത്ത് മലയാളത്തിൽ ‘ഈ’ സ്വാഭാവികമാണ്.
- source_word: καὶ αὐτὸς
  choice: അദ്ദേഹവും
  rationale: αὐτός നൽകുന്ന ഊന്നൽ ‘അദ്ദേഹവും’ എന്ന രൂപത്തിൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἐξ αὐτοῦ
  choice: ഇതിൽനിന്നു
  rationale: സർവനാമം കിണറിലേക്കാണ് തിരിച്ചുപോകുന്നത്; കുടിക്കുന്ന ഉറവിടം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἔπιεν
  choice: കുടിച്ചു
  rationale: ചരിത്രസംഭവത്തെ സൂചിപ്പിക്കുന്ന ഏറിസ്റ്റ് മലയാളത്തിൽ ലളിത ഭൂതകാലമായി നൽകുന്നു.
- source_word: οἱ υἱοὶ αὐτοῦ
  choice: അദ്ദേഹത്തിന്റെ പുത്രന്മാർ
  rationale: υἱοί ഇവിടെ വ്യക്തമായി പുത്രന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്; ലിംഗസൂചന നിലനിർത്തുന്നു.
- source_word: τὰ θρέμματα αὐτοῦ
  choice: കന്നുകാലികൾ
  rationale: θρέμματα വളർത്തുമൃഗങ്ങളെ പൊതുവായി സൂചിപ്പിക്കുന്നു. ‘കന്നുകാലികൾ’ ആ അർഥം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: μή അവതരിപ്പിക്കുന്ന വാഗ്‌ചോദ്യത്തിന്റെ ശക്തി
  choice: ‘അല്ല’ എന്ന ഉത്തരം പ്രതീക്ഷിക്കുന്ന ചോദ്യം
  alternative: ‘നമ്മുടെ പിതാവായ യാക്കോബിനെക്കാൾ വലിയവനല്ലല്ലോ നീ?’ എന്ന വ്യക്തമായ നിഷേധരൂപം
  rationale: ഗ്രീക്കിലെ μή സംസാരിക്കുന്നവൾ നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്നുവെന്ന് സൂചിപ്പിക്കുന്നു. പ്രധാനപാഠത്തിലെ സ്വാഭാവിക ചോദ്യം വെല്ലുവിളിയും ആശയസംഘർഷവും നിലനിർത്തുന്നു; പ്രതീക്ഷിക്കുന്ന ഉത്തരം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. യാക്കോബിനെ പരാമർശിക്കുമ്പോൾ ആദരസൂചകമായി ‘അദ്ദേഹം’ ഉപയോഗിച്ചു; rhetorical force അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
