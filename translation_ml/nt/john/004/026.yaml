id: JHN.4.26
reference: John 4:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγει αὐτῇ ὁ Ἰησοῦς· Ἐγώ εἰμι, ὁ λαλῶν σοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/026.yaml
  text: Jesus said to her[a], “I am, the one speaking to you.”
translation:
  language: ml
  text: 'യേശു അവളോടു പറഞ്ഞു: “നിന്നോടു സംസാരിക്കുന്ന ഞാൻ തന്നെയാണ്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിൽ വർത്തമാനകാലരൂപമാണെങ്കിലും ഇത് ആഖ്യാനത്തിലെ ചരിത്രവർത്തമാനമാണ്; സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലിയിൽ ഭൂതകാലമായ ‘പറഞ്ഞു’ യോജിക്കുന്നു.
- source_word: αὐτῇ
  choice: അവളോടു
  rationale: ദാതൃവിഭക്തിയിലുള്ള പരോക്ഷകർമത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘അവളോടു’ എന്നു നൽകി.
- source_word: Ἐγώ εἰμι
  choice: ഞാൻ ആകുന്നു
  rationale: ഗ്രീക്കിലെ വ്യക്തമായ പദപ്രയോഗം കഴിയുന്നത്ര നേരിട്ട് നിലനിർത്തുന്നു. മുൻവാക്യത്തിലെ മശീഹയെ സൂചിപ്പിക്കുന്ന ‘അവൻ’ സന്ദർഭത്തിൽനിന്ന് മനസ്സിലാകുമെങ്കിലും ഗ്രീക്കിൽ ആ പദം ഇല്ല; അതിനാൽ മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല. ഈ രൂപം വാക്യത്തിന്റെ തിരിച്ചറിയൽഭാവവും സാധ്യതയുള്ള ദൈവശാസ്ത്രപരമായ അനുരണനവും തുറന്നുവെക്കുന്നു.
- source_word: ὁ λαλῶν σοι
  choice: നിന്നോടു സംസാരിക്കുന്നവൻ
  rationale: നിശ്ചയോപപദത്തോടുകൂടിയ വർത്തമാന കൃദന്തരൂപത്തിന്റെ നാമവാചകസ്വഭാവം ‘സംസാരിക്കുന്നവൻ’ എന്നു നിലനിർത്തി; σοι എന്നത് സ്വാഭാവികമായി ‘നിന്നോടു’ എന്നു പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: മശീഹയായുള്ള തിരിച്ചറിയൽ മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കണമോ
  choice: ‘ഞാൻ ആകുന്നു’ എന്ന ഗ്രീക്ക് സംക്ഷിപ്തരൂപം നിലനിർത്തി.
  alternative: ‘ഞാൻ തന്നെയാണ് അവൻ’ അല്ലെങ്കിൽ ‘നിന്നോടു സംസാരിക്കുന്ന ഞാൻ തന്നെയാണ് മശീഹ’ എന്നു വ്യക്തമാക്കുക.
  rationale: യോഹന്നാൻ 4:25-ലെ സന്ദർഭം യേശു പ്രതീക്ഷിക്കപ്പെട്ട മശീഹയായി തന്നെ തിരിച്ചറിയുന്നതാണെന്ന് വ്യക്തമാക്കുന്നു. എന്നാൽ ഈ വാക്യത്തിലെ ഗ്രീക്കിൽ ‘അവൻ’ അല്ലെങ്കിൽ ‘മശീഹ’ എന്ന വിധേയപദം പ്രകടമല്ല. അതിനാൽ അവ ചേർക്കാതെ മൂലപാഠത്തിന്റെ അർഥസാന്ദ്രതയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും സംരക്ഷിച്ചു; സന്ദർഭാനുസൃതമായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി സ്വീകരിച്ചു. ‘ഞാൻ ആകുന്നു’ സാധാരണ സംഭാഷണത്തിൽ അല്പം അസാധാരണമായി തോന്നാമെങ്കിലും മൂലഗ്രീക്കിന്റെ സംക്ഷിപ്തതയും ഉദ്ദേശ്യപൂർവമായ അനിശ്ചിതത്വവും സംരക്ഷിക്കാൻ അത് നിലനിർത്തി.
