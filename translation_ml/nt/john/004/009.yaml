id: JHN.4.9
reference: John 4:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγει οὖν αὐτῷ ἡ γυνὴ ἡ Σαμαρῖτις· Πῶς σὺ Ἰουδαῖος ὢν παρ’ ἐμοῦ πεῖν αἰτεῖς ⸂γυναικὸς Σαμαρίτιδος οὔσης⸃; οὐ γὰρ συγχρῶνται Ἰουδαῖοι Σαμαρίταις.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/009.yaml
  text: So the Samaritan woman said to him[a], “How is it that you, being a Jew, ask for a drink from me, a Samaritan woman?” (For Jews do not associate with Samaritans.)
translation:
  language: ml
  text: 'അപ്പോൾ ശമര്യക്കാരിയായ സ്ത്രീ അവനോടു പറഞ്ഞു: “യഹൂദനായ നീ ശമര്യക്കാരിയായ എന്നോടു കുടിക്കാൻ ചോദിക്കുന്നതെങ്ങനെ?” (യഹൂദർ ശമര്യക്കാരുമായി ഇടപഴകാറില്ല[a].)'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹൂദർ ശമര്യക്കാരുമായി യാതൊരു ഇടപാടും പുലർത്താറില്ല.” ഒരേ കുടിപ്പാത്രം പോലുള്ള വസ്തുക്കൾ അവർ പങ്കിട്ട് ഉപയോഗിക്കാറില്ല എന്ന കൂടുതൽ പ്രത്യേക അർഥവും ഇവിടെ സാധ്യമാണ്.
    reason: συγχρῶνται എന്ന പദത്തിന് പൊതുവായ സാമൂഹിക സമ്പർക്കത്തെയും വസ്തുക്കളുടെ പങ്കിട്ട ഉപയോഗത്തെയും സൂചിപ്പിക്കാനാകുന്നതിനാൽ അർഥവൈവിധ്യം സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: λέγει οὖν
  choice: അപ്പോൾ ... ചോദിച്ചു
  rationale: οὖν ഇവിടെ കഥയുടെ തുടർച്ച സൂചിപ്പിക്കുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായ മലയാളത്തിൽ ആ ബന്ധം നിലനിർത്തുന്നു. λέγει എന്ന ചരിത്രവർത്തമാനത്തെ മലയാള ആഖ്യാനശൈലിക്കനുസരിച്ച് ഭൂതകാലത്തിൽ അവതരിപ്പിച്ചു; പിന്നാലെയുള്ള നേരിട്ടുള്ള ചോദ്യം കണക്കിലെടുത്ത് ‘പറഞ്ഞു’ എന്നതിനു പകരം ‘ചോദിച്ചു’ ഉപയോഗിച്ചു.
- source_word: ἡ γυνὴ ἡ Σαμαρῖτις
  choice: ശമര്യക്കാരിയായ സ്ത്രീ
  rationale: സ്ത്രീയുടെ ലിംഗവും സമുദായപരമായ തിരിച്ചറിയലും വ്യക്തമായി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: Πῶς
  choice: എങ്ങനെ / ചോദിക്കുന്നതെങ്ങനെ
  rationale: സാമൂഹികമായി അസാധാരണമായ അഭ്യർഥനയോടുള്ള അതിശയം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ചോദിക്കുന്നതെങ്ങനെ?’ ഈ അവിശ്വാസഭാവം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: Ἰουδαῖος
  choice: യഹൂദൻ
  rationale: ഇവിടെ ശമര്യക്കാരുമായുള്ള സമുദായ-മതപരമായ വ്യത്യാസമാണ് പ്രസക്തം; ഭൂമിശാസ്ത്രപരമായ ‘യെഹൂദ്യക്കാരൻ’ എന്നതിനെക്കാൾ ‘യഹൂദൻ’ യോജിക്കുന്നു.
- source_word: παρ’ ἐμοῦ πεῖν αἰτεῖς
  choice: എന്നോട് കുടിക്കാൻ വെള്ളം ചോദിക്കുന്നു
  rationale: αἰτεῖς + πεῖν എന്നത് കുടിക്കാൻ ആവശ്യപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ സന്ദർഭത്തിൽ വ്യക്തമായിരിക്കുന്ന ‘വെള്ളം’ ചേർത്തു.
- source_word: γυναικὸς Σαμαρίτιδος οὔσης
  choice: ശമര്യക്കാരിയായ എന്നോട്
  rationale: സംസാരിക്കുന്ന സ്ത്രീയുടെ സ്വയംപരാമർശവും അവളുടെ സമുദായ-ലിംഗ തിരിച്ചറിയലും ചുരുക്കമായും സ്വാഭാവികമായും സംരക്ഷിക്കുന്നു.
- source_word: συγχρῶνται
  choice: ഇടപഴകാറില്ല
  rationale: പൊതുവായ സാമൂഹിക സമ്പർക്കമില്ലായ്മ വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളം. ഒരേ പാത്രങ്ങളോ വസ്തുക്കളോ പങ്കിട്ട് ഉപയോഗിക്കാത്തതെന്ന കൂടുതൽ പ്രത്യേക അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
theological_decisions:
- issue: യോഹന്നാന്റെ പ്രയോഗത്തിലെ Ἰουδαῖος എന്ന പദത്തിന്റെ അർഥം
  choice: യഹൂദൻ
  alternative: യെഹൂദ്യക്കാരൻ
  rationale: വാക്യം യെഹൂദയും ശമര്യയും എന്ന പ്രദേശങ്ങളെ മാത്രം താരതമ്യം ചെയ്യുന്നില്ല; യഹൂദരും ശമര്യക്കാരും എന്ന മത-സാമൂഹിക സമൂഹങ്ങൾ തമ്മിലുള്ള പതിവ് അകലം വിശദീകരിക്കുന്നു.
- issue: συγχρῶνται എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: പൊതുവായ സാമൂഹിക ഇടപഴകൽ
  alternative: പാത്രങ്ങൾ ഉൾപ്പെടെയുള്ള വസ്തുക്കൾ പങ്കിട്ട് ഉപയോഗിക്കൽ
  rationale: വിശദീകരണവാക്യം രണ്ടു സമൂഹങ്ങൾക്കുമിടയിലെ വിശാലമായ സാമൂഹിക അകലം സൂചിപ്പിക്കാം. എന്നാൽ കുടിക്കാനുള്ള പാത്രം പങ്കിടുന്നതാണ് തത്സമയ സന്ദർഭം എന്നതിനാൽ കൂടുതൽ പ്രത്യേക അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘ശമര്യക്കാരി’, ‘യഹൂദൻ’ എന്നീ സാധാരണ വായനക്കാർക്ക് പരിചിതമായ രൂപങ്ങൾ ഉപയോഗിച്ചു; ഗ്രീക്കിലെ സാമൂഹിക-സമുദായപരമായ സംഘർഷവും συγχρῶνται എന്ന പദത്തിന്റെ യഥാർഥ അർഥവൈവിധ്യവും നിലനിർത്തി.
