  terminology: ‘യഹൂദൻ,’ ‘ശമര്യക്കാരിയായ സ്ത്രീ,’ and ‘ഇടപഴകാറില്ല’ are suitable modern-standard Malayalam choices. The footnote appropriately retains the possible narrower sense of συγχρῶνται as sharing or using items in common.
