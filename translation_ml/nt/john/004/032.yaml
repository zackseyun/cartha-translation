id: JHN.4.32
reference: John 4:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Ἐγὼ βρῶσιν ἔχω φαγεῖν ἣν ὑμεῖς οὐκ οἴδατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/032.yaml
  text: But he said to them[a], “I have food to eat that you do not know.”
translation:
  language: ml
  text: 'എന്നാൽ അവൻ അവരോടു പറഞ്ഞു: “നിങ്ങൾ അറിയാത്ത ആഹാരം എനിക്കു കഴിക്കാനുണ്ട്.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നിങ്ങൾ അറിയാത്ത എന്തോ ഒന്ന് എനിക്കു കഴിക്കാനുണ്ട്.” തുടർന്നുള്ള സന്ദർഭം വ്യക്തമാക്കുന്നതുപോലെ, യേശു ഇവിടെ രൂപകമായി സംസാരിക്കുകയാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: ശിഷ്യന്മാരുടെ വാക്കുകളോടുള്ള മൃദുവായ വൈരുധ്യവും ആഖ്യാനത്തിന്റെ തുടർച്ചയും സൂചിപ്പിക്കുന്നു.
- source_word: εἶπεν αὐτοῖς
  choice: അവൻ അവരോടു പറഞ്ഞു
  rationale: λέγω എന്ന ക്രിയയും പരോക്ഷ കർമ്മവും ലളിതവും സ്വാഭാവികവുമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: Ἐγὼ
  choice: എനിക്ക്
  rationale: ഗ്രീക്കിലെ വ്യക്തമായ സർവനാമം നൽകുന്ന വൈരുധ്യാത്മക ഊന്നൽ മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിൽ നിലനിർത്തുന്നു.
- source_word: βρῶσιν
  choice: ആഹാരം
  rationale: ഇവിടെ പദം ഭക്ഷിക്കുന്ന പ്രവൃത്തിയെയല്ല, ഭക്ഷണത്തെയാണ് സൂചിപ്പിക്കുന്നത്; രൂപകത്തെ മുൻകൂട്ടി വ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്നു.
- source_word: ἔχω φαγεῖν
  choice: എനിക്കു ഭക്ഷിക്കാനുണ്ട്
  rationale: കഴിക്കാനുള്ള ആഹാരം തന്റെ പക്കലുണ്ടെന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി പകരുന്നു.
- source_word: ἣν
  choice: ആ
  rationale: ബന്ധസർവനാമം സൂചിപ്പിക്കുന്ന ആഹാരത്തെ മലയാളത്തിൽ വിശേഷണോപവാക്യക്രമത്തിലൂടെ ബന്ധിപ്പിക്കുന്നു.
- source_word: ὑμεῖς οὐκ οἴδατε
  choice: നിങ്ങൾ അറിയാത്ത
  rationale: വ്യക്തമായ ὑμεῖς നൽകുന്ന വൈരുധ്യം സൂക്ഷിക്കുകയും οὐκ οἴδατε എന്നതിനെ അധിക വ്യാഖ്യാനം ചേർക്കാതെ നേരിട്ട് പരിഭാഷപ്പെടുത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ ‘ആഹാരം’ എന്ന പ്രയോഗത്തിന്റെ രൂപകാലങ്കാരിക അർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘ആഹാരം’ എന്ന പദം നിലനിർത്തി രൂപകത്തിന്റെ അർഥം ഇവിടെ വിശദീകരിക്കാതിരിക്കുക.
  alternative: ‘നിങ്ങൾ അറിയാത്ത എന്തോ ഒന്ന് എനിക്കു കഴിക്കാനുണ്ട്’
  rationale: തുടർന്നുള്ള സന്ദർഭം പിതാവിന്റെ ഇഷ്ടം ചെയ്യുന്നതിനെക്കുറിച്ചുള്ള രൂപകമാണെന്ന് വ്യക്തമാക്കുന്നു; എന്നാൽ ഈ വാക്യത്തിൽ ശിഷ്യന്മാരുടെ തെറ്റിദ്ധാരണയ്ക്കുള്ള സാധ്യത ഉദ്ദേശപൂർവം നിലനിൽക്കുന്നു. അതിനാൽ അതിനെ മുൻകൂട്ടി പരിഹരിക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ആഹാരം’ എന്നത് സാധാരണക്കാർക്ക് മനസ്സിലാകുന്നതും ബൈബിൾസന്ദർഭത്തിന് യോജിച്ചതുമാണ്; ഗ്രീക്കിലെ ഉദ്ദേശപൂർവമായ ദ്വയാർഥസാധ്യത നിലനിർത്തിയിരിക്കുന്നു.
