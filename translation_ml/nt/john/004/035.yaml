  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐχ ὑμεῖς λέγετε ὅτι Ἔτι τετράμηνός ἐστιν καὶ ὁ θερισμὸς ἔρχεται; ἰδοὺ λέγω ὑμῖν, ἐπάρατε τοὺς ὀφθαλμοὺς ὑμῶν καὶ θεάσασθε τὰς χώρας ὅτι λευκαί εἰσιν πρὸς θερισμόν· ἤδη
base_translation:
  language: en
  yaml_path: translation/nt/john/004/035.yaml
  text: 'Do you not say[a], ‘There are still four months, and then the harvest comes’? Look, I tell you: lift up your eyes and see the fields, that they are white for harvest already.'
translation:
  language: ml
  text: '‘ഇനിയും നാല് മാസമുണ്ട്; പിന്നെ കൊയ്ത്തു വരും’ എന്നു നിങ്ങൾ പറയാറില്ലേ? ഇതാ, ഞാൻ നിങ്ങളോടു പറയുന്നു: നിങ്ങളുടെ കണ്ണുകൾ ഉയർത്തി വയലുകളെ നോക്കൂ; അവ ഇപ്പോൾത്തന്നെ കൊയ്ത്തിനായി വെളുത്തുകിടക്കുന്നു[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവ കൊയ്ത്തിന് പാകമായിരിക്കുന്നു.’ ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘വെളുത്തുകിടക്കുന്നു’ എന്നാണ്; കൊയ്ത്തിന്റെ ദൃശ്യരൂപം നിലനിർത്തിക്കൊണ്ട് ഇത് വയലുകൾ കൊയ്ത്തിന് സജ്ജമാണെന്ന ആശയം സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ ὑμεῖς λέγετε
  choice: നിങ്ങൾ പറയാറില്ലേ
  rationale: നിഷേധരൂപത്തിലുള്ള ചോദ്യത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം; ὑμεῖς എന്ന കർത്താവിന്റെ ഊന്നൽ ‘നിങ്ങൾ’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: Ἔτι τετράμηνός ἐστιν
  choice: ഇനിയും നാലുമാസമുണ്ട്
  rationale: കൊയ്ത്തുവരെ ശേഷിക്കുന്ന കാലയളവിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്കിന്റെ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളാവിഷ്കാരം.
- source_word: ὁ θερισμὸς ἔρχεται
  choice: പിന്നെ കൊയ്ത്തു വരും
  rationale: പ്രയോഗത്തിലെ കാലക്രമബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കിക്കൊണ്ട് കൊയ്ത്തിന്റെ ദൃശ്യഭാഷ നിലനിർത്തുന്നു.
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗ്രീക്ക് സംഭാഷണചിഹ്നത്തിന്റെ മാന്യവും നിലവിലുള്ളതുമായ മലയാളസമം.
- source_word: ἐπάρατε τοὺς ὀφθαλμοὺς ὑμῶν
  choice: നിങ്ങളുടെ കണ്ണുകൾ ഉയർത്തി
  rationale: ‘കണ്ണുകൾ ഉയർത്തുക’ എന്ന മൂലപാഠത്തിലെ സജീവമായ ദൃശ്യപ്രയോഗം ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: θεάσασθε τὰς χώρας
  choice: വയലുകളിലേക്കു നോക്കൂ
  rationale: θεάσασθε ഉദ്ദേശപൂർവമായ നിരീക്ഷണത്തെയും χώρας കൊയ്ത്തിന്റെ പശ്ചാത്തലത്തിൽ കൃഷിവയലുകളെയും സൂചിപ്പിക്കുന്നു.
- source_word: λευκαί εἰσιν πρὸς θερισμόν
  choice: കൊയ്ത്തിനായി വെളുത്തിരിക്കുന്നു
  rationale: ‘പാകമായിരിക്കുന്നു’ എന്ന് വ്യാഖ്യാനിച്ചുമാറ്റാതെ ഗ്രീക്കിലെ ‘വെളുത്ത’ എന്ന ദൃശ്യരൂപകം നിലനിർത്തുന്നു.
- source_word: ἤδη
  choice: ഇപ്പോൾത്തന്നെ
  rationale: നാലുമാസത്തെ കാത്തിരിപ്പിനോടുള്ള വൈരുധ്യവും ഉടനടിയുള്ള സജ്ജതയും ശക്തമായി പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: കൊയ്ത്തിനെ മുഖ്യപാഠത്തിൽ അക്ഷരാർഥ കൃഷിദൃശ്യമായോ ആത്മീയ അർഥം തുറന്നുപറഞ്ഞോ അവതരിപ്പിക്കണമോ
  choice: കൃഷിയുമായി ബന്ധപ്പെട്ട കൊയ്ത്തുരൂപകം അതേപടി നിലനിർത്തുക
  alternative: ‘ആളുകൾ ഇപ്പോൾത്തന്നെ സമാഹരിക്കപ്പെടാൻ തയ്യാറാണ്’ എന്നിങ്ങനെ ആത്മീയ സൂചന നേരിട്ട് ചേർക്കുക
  rationale: സന്ദർഭത്തിൽ മനുഷ്യരുടെ ആത്മീയ സജ്ജതയാണ് സൂചനയെങ്കിലും ഗ്രീക്ക് പാഠം അത് കൊയ്ത്തുരൂപകത്തിലൂടെയാണ് പറയുന്നത്; വിവർത്തനം ആ രൂപകവും അതിലെ വ്യാഖ്യാനസാധ്യതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ഇതാ’, ‘കണ്ണുകൾ ഉയർത്തി’ എന്നീ പ്രയോഗങ്ങൾ മൂലപാഠത്തിന്റെ ശ്രദ്ധാകർഷണവും ദൃശ്യസാന്ദ്രതയും സംരക്ഷിക്കുന്നു; അപരിചിതമായ ‘വെളുത്തിരിക്കുന്നു’ എന്ന കൊയ്ത്തുചിത്രം വ്യാഖ്യാനിച്ച് നീക്കാതെ അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുന്നു.
