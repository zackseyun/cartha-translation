  terminology: “കൊയ്ത്തു,” “വയലുകൾ,” and “കണ്ണുകൾ ഉയർത്തി” appropriately retain the Greek agricultural image and register. The note correctly distinguishes the literal visual image from the contextual implication of ripeness, without importing a spiritual interpretation.
