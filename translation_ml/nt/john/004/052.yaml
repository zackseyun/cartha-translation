id: JHN.4.52
reference: John 4:52
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐπύθετο οὖν ⸂τὴν ὥραν παρ’ αὐτῶν⸃ ἐν ᾗ κομψότερον ἔσχεν· ⸂εἶπαν οὖν⸃ αὐτῷ ὅτι ⸀Ἐχθὲς ὥραν ἑβδόμην ἀφῆκεν αὐτὸν ὁ πυρετός.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/052.yaml
  text: So he asked them the hour in which he got better. Then they said to him[a], “Yesterday at the seventh hour the fever left him.”
translation:
  language: ml
  text: 'അതിനാൽ അവൻ അവരോടു തന്റെ മകന്റെ നില മെച്ചപ്പെടാൻ തുടങ്ങിയ സമയം ചോദിച്ചു. അപ്പോൾ അവർ അവനോടു പറഞ്ഞു: “ഇന്നലെ ഏഴാം മണിക്കൂറിൽ[a] പനി അവനെ വിട്ടുമാറി.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: സൂര്യോദയം മുതൽ മണിക്കൂറുകൾ എണ്ണുന്ന രീതിയിലാണെങ്കിൽ, ‘ഏഴാം മണിക്കൂർ’ ഏകദേശം ഉച്ചയ്ക്ക് ഒരു മണിയാണ്; യോഹന്നാനിലെ സമയഗണനയെ ചിലർ വ്യത്യസ്തമായി മനസ്സിലാക്കുന്നു.
    reason: പുരാതന സമയഗണനയിലെ അനിശ്ചിതത്വം വ്യക്തമാക്കുന്ന മറ്റൊരു വായന.
lexical_decisions:
- source_word: ἐπύθετο οὖν
  choice: അതിനാൽ ... ചോദിച്ചു
  rationale: ἐπύθετο എന്നത് അന്വേഷിച്ചുചോദിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; οὖν മുൻവാക്യവുമായി നിഗമനാത്മകമായ ആഖ്യാനബന്ധം സ്ഥാപിക്കുന്നു. മലയാളത്തിൽ ഈ രണ്ടും സ്വാഭാവികമായി പകർത്തുന്നു.
- source_word: τὴν ὥραν παρ’ αὐτῶν
  choice: അവരോട് ... സമയം ചോദിച്ചു
  rationale: പദാനുപദമായ ‘അവരിൽനിന്ന് മണിക്കൂർ അന്വേഷിച്ചു’ എന്നതിനുപകരം, ചോദിക്കപ്പെട്ടവരെയും അന്വേഷിച്ച സമയത്തെയും വ്യക്തമായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: ἐν ᾗ κομψότερον ἔσχεν
  choice: തനിക്കു ഭേദമായ സമയം
  rationale: κομψότερον ἔσχεν ആരോഗ്യനില മെച്ചപ്പെട്ടതിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗമാണ്. ‘ഭേദമായ’ എന്നത് പൂർണസൗഖ്യം നിർബന്ധമായി സൂചിപ്പിക്കാതെ ആരോഗ്യത്തിലെ മെച്ചം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: εἶπαν οὖν αὐτῷ
  choice: അവർ അവനോട് പറഞ്ഞു
  rationale: മറുപടിയായുള്ള ആഖ്യാനതുടർച്ച മലയാളത്തിൽ ലളിതവും വ്യക്തവുമായി നൽകുന്നു; രണ്ടാമത്തെ οὖν വേറൊരു ഭാരമുള്ള ബന്ധപദം ചേർക്കാതെ ക്രമത്തിൽ പ്രതിഫലിക്കുന്നു.
- source_word: Ἐχθὲς ὥραν ἑβδόμην
  choice: ഇന്നലെ ഏഴാം മണിക്കൂറിൽ
  rationale: പുരാതന സമയഗണനയെ ആധുനിക ക്ലോക്ക് സമയമായി നിർണ്ണയിക്കാതെ ഗ്രീക്കിലെ മണിക്കൂർനാമം നിലനിർത്തുന്നു.
- source_word: ἀφῆκεν αὐτὸν ὁ πυρετός
  choice: പനി അവനെ വിട്ടുമാറി
  rationale: ഗ്രീക്കിൽ പനിയാണ് കർത്താവ്. ‘വിട്ടുമാറി’ രോഗം നീങ്ങിയതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണ്; മൂലത്തിലെ വ്യക്തിവൽക്കരിച്ച ഘടനയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘ഏഴാം മണിക്കൂർ’ എന്നതിന്റെ സമയഗണന
  choice: പ്രധാനപാഠത്തിൽ ‘ഏഴാം മണിക്കൂർ’ എന്ന മൂലരൂപം നിലനിർത്തി.
  alternative: സൂര്യോദയം മുതൽ എണ്ണിയാൽ ഏകദേശം ഉച്ചയ്ക്ക് ഒരു മണി; മറ്റൊരു സമയഗണന അനുസരിച്ച് വേറൊരു ആധുനിക സമയം.
  rationale: യോഹന്നാൻ ഇവിടെ ഏത് സമയഗണനയാണ് ഉപയോഗിക്കുന്നതെന്ന് വാക്യം തന്നെ വ്യക്തമാക്കുന്നില്ല. ആധുനിക സമയം നിർണ്ണയിക്കുന്നത് മൂലപാഠത്തിലെ യഥാർഥ അനിശ്ചിതത്വം അനാവശ്യമായി പരിഹരിക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘തനിക്കു ഭേദമായ’ എന്നത് സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും ആരോഗ്യത്തിലെ മെച്ചം മാത്രം സൂചിപ്പിക്കുന്നതുമാണ്; ‘ഏഴാം മണിക്കൂർ’ മൂലപാഠത്തിന്റെ സാംസ്കാരികവും കാലഗണനാപരവുമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
