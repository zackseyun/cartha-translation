id: JHN.4.29
reference: John 4:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Δεῦτε ἴδετε ἄνθρωπον ὃς εἶπέ μοι πάντα ⸀ὅσα ἐποίησα· μήτι οὗτός ἐστιν ὁ χριστός;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/029.yaml
  text: Come[a], see a man who told me everything I have done. Could this be the Messiah?
translation:
  language: ml
  text: “വരൂ, ഞാൻ ചെയ്തതെല്ലാം എന്നോടു പറഞ്ഞ ഒരു മനുഷ്യനെ കാണൂ. ഇയാൾ മശീഹാ[a] ആയിരിക്കുമോ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഇയാൾ ക്രിസ്തു ആയിരിക്കുമോ?”
    reason: χριστός എന്ന പദവിക്ക് മലയാളത്തിൽ പതിവായ ‘ക്രിസ്തു’ എന്ന ലിപ്യന്തരണവും സാധ്യമാണ്.
lexical_decisions:
- source_word: Δεῦτε
  choice: വരൂ
  rationale: മറ്റുള്ളവരെ ക്ഷണിച്ചുകൊണ്ടുള്ള ബഹുവചന ആഹ്വാനം; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ക്ഷണത്തിന്റെ ഭാവം നിലനിർത്തുന്നതുമാണ്.
- source_word: ἴδετε
  choice: കാണൂ
  rationale: Δεῦτε എന്നതിനോടു ചേർന്ന നേരിട്ടുള്ള ക്ഷണം ‘വരൂ ... കാണൂ’ എന്ന് സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: ἄνθρωπον
  choice: ഒരു മനുഷ്യനെ
  rationale: യേശുവിനെ ഒരു പുരുഷവ്യക്തിയായി സൂചിപ്പിക്കുന്ന ഏകവചന പദത്തിന്റെ അർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ὃς εἶπέ μοι
  choice: എന്നോടു പറഞ്ഞ
  rationale: μοι എന്ന പരോക്ഷ കർമവും തുടർന്നുള്ള ഉള്ളടക്കവും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: πάντα ὅσα ἐποίησα
  choice: ഞാൻ ചെയ്തതെല്ലാം
  rationale: πάντα ὅσα നൽകുന്ന സമഗ്രത സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു; അഒറിസ്റ്റ് ഇവിടെ കഴിഞ്ഞകാല പ്രവൃത്തികളെ സൂചിപ്പിക്കുന്നു.
- source_word: μήτι οὗτός ἐστιν
  choice: ഇയാൾ ... ആയിരിക്കുമോ?
  rationale: μήτι നൽകുന്ന മടിയോടും സാധ്യത പരിശോധിക്കുന്നതുമായ ചോദ്യഭാവം കർശനമായ നിഷേധചോദ്യമാക്കാതെ നിലനിർത്തുന്നു.
- source_word: ὁ χριστός
  choice: മശീഹാ
  rationale: ഇവിടെ χριστός ഒരു യഹൂദ മശീഹാപദവിയായി പ്രവർത്തിക്കുന്നതിനാൽ പേരുപോലെ ലിപ്യന്തരണം ചെയ്യാതെ പദവിയുടെ അർഥം നൽകുന്നു.
theological_decisions:
- issue: χριστός എന്ന പദവിയുടെ പരിഭാഷ
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: സന്ദർഭത്തിൽ ഇത് പേരല്ല, പ്രതീക്ഷിക്കപ്പെട്ട അഭിഷിക്തനെ സൂചിപ്പിക്കുന്ന അംഗീകൃത പദവിയാണ്; ‘മശീഹാ’ യോഹന്നാൻ 4-ലെ യഹൂദ-ശമര്യ മശീഹാപശ്ചാത്തലം വ്യക്തമാക്കുന്നു.
- issue: μήτι ഉള്ള ചോദ്യത്തിന്റെ പ്രവണത
  choice: ഇയാൾ മശീഹാ ആയിരിക്കുമോ?
  alternative: ഇയാൾ മശീഹാ അല്ലായിരിക്കുമോ?
  rationale: ചോദ്യത്തിൽ നിഷേധപ്രതീക്ഷയുടെ സൂചന ഉണ്ടെങ്കിലും, ഈ സന്ദർഭത്തിൽ സ്ത്രീ മറ്റുള്ളവരെ സാധ്യത പരിഗണിക്കാൻ ക്ഷണിക്കുന്നു. അതിനാൽ ഉറച്ച നിഷേധമോ പ്രഖ്യാപനമോ ചേർക്കാതെ സന്ദിഗ്ധത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ഭാഷ. ‘വരൂ ... കാണൂ’ എന്ന നേരിട്ടുള്ള ക്ഷണശൈലി നിലനിർത്തി; ‘ഇയാൾ’ അനാവശ്യമായ ഉയർന്ന ആദരസൂചനയോ അവമതിപ്പോ ഒഴിവാക്കുന്നു.
