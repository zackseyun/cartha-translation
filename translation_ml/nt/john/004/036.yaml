source:
  edition: SBLGNT
  text: ⸀ὁ θερίζων μισθὸν λαμβάνει καὶ συνάγει καρπὸν εἰς ζωὴν αἰώνιον, ⸀ἵνα ὁ σπείρων ὁμοῦ χαίρῃ καὶ ὁ θερίζων.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/036.yaml
  text: The one who reaps is receiving wages and gathering fruit for eternal life[b][a], so that the one who sows and the one who reaps may rejoice together.
translation:
  language: ml
  text: കൊയ്യുന്നവൻ കൂലി[a] വാങ്ങുകയും നിത്യജീവനിലേക്കായി[b] ഫലം ശേഖരിക്കുകയും ചെയ്യുന്നു; അങ്ങനെ വിതയ്ക്കുന്നവനും കൊയ്യുന്നവനും ഒരുമിച്ച് ആനന്ദിക്കാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘പ്രതിഫലം.’ ഗ്രീക്കുപദത്തിന് ചെയ്ത ജോലിക്കുള്ള കൂലിയെയോ ലഭിക്കുന്ന പ്രതിഫലത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘നിത്യജീവനുവേണ്ടി.’ ഈ പ്രയോഗത്തിന് ലക്ഷ്യമോ ഫലമോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ θερίζων
  choice: കൊയ്യുന്നവൻ
  rationale: നാമമായി പ്രവർത്തിക്കുന്ന വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ പ്രവർത്തനാത്മക സ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: μισθὸν
  choice: കൂലി
  rationale: കൊയ്ത്തുവേലയുടെ ദൃശ്യരൂപം നിലനിർത്തുന്ന നേരിട്ടുള്ള അർത്ഥം; ഈ പദത്തിന് പ്രതിഫലം എന്ന അർത്ഥവും വരാം.
- source_word: λαμβάνει
  choice: വാങ്ങുകയും
  rationale: വർത്തമാനകാല പ്രവർത്തനം സൂചിപ്പിക്കുന്നു; പിന്നാലെയുള്ള συνάγει എന്ന ക്രിയയുമായി സമാന്തരമായി ചേർക്കുന്നു.
- source_word: συνάγει καρπὸν
  choice: ഫലം ശേഖരിക്കുകയും
  rationale: ‘ഫലം’ എന്ന രൂപകം നിലനിർത്തുകയും കൊയ്യുന്നതും ശേഖരിക്കപ്പെടുന്നതും തമ്മിലുള്ള വ്യത്യാസം മായ്ക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: εἰς ζωὴν αἰώνιον
  choice: നിത്യജീവനിലേക്കായി
  rationale: εἰς സൂചിപ്പിക്കാവുന്ന ലക്ഷ്യം/ഫലം എന്ന ദിശാബോധം നിലനിർത്തുന്നു.
- source_word: ἵνα
  choice: അങ്ങനെ
  rationale: ഉദ്ദേശ്യമോ ഫലമോ സൂചിപ്പിക്കാവുന്ന ബന്ധം അതിരുകടന്ന് നിർണ്ണയിക്കാതെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ὁ σπείρων
  choice: വിതയ്ക്കുന്നവൻ
  rationale: ὁ θερίζων എന്നതിനോടുള്ള സമാന്തരമായ നാമവൽക്കരിച്ച കൃദന്തരൂപം നിലനിർത്തുന്നു.
- source_word: ὁμοῦ χαίρῃ
  choice: ഒരുമിച്ച് ആനന്ദിക്കാം
  rationale: പങ്കിട്ടുള്ള ആനന്ദവും ἵνα-യോടുകൂടിയ സാധ്യത/ഉദ്ദേശ്യ ഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: εἰς ζωὴν αἰώνιον എന്നതിലെ ലക്ഷ്യം/ഫലം സംബന്ധിച്ച അനിശ്ചിതത്വം
  choice: നിത്യജീവനിലേക്കായി
  alternative: നിത്യജീവനുവേണ്ടി
  rationale: ഫലം നിത്യജീവനിലേക്കു ലക്ഷ്യമിട്ടതോ അതിലേക്കു നയിക്കുന്നതോ ആയ അർത്ഥം തുറന്നുവെക്കുന്നു; വ്യാഖ്യാനം അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- issue: ἵνα ഉപവാക്യത്തിലെ ഉദ്ദേശ്യം/ഫലം
  choice: അങ്ങനെ ... ആനന്ദിക്കാം
  alternative: '... ആനന്ദിക്കേണ്ടതിന്'
  rationale: ഗ്രീക്കിലെ ഉദ്ദേശ്യ-ഫല ബന്ധം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ അതിനെ കർശനമായി ഒരേയൊരു വിഭാഗമായി നിർണ്ണയിക്കുന്നില്ല.
- issue: മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘ഇതിനകം’ എന്ന ആശയം ചേർക്കണമോ
  choice: ചേർത്തിട്ടില്ല
  alternative: ഇതിനകം കൊയ്യുന്നവൻ...
  rationale: സന്ദർഭത്തിൽ കൊയ്ത്തിന്റെ ഇപ്പോഴത്തെ യാഥാർഥ്യം ഉണ്ടെങ്കിലും ഈ വാക്യഘടകത്തിൽ പ്രത്യേകമായി ‘ഇതിനകം’ എന്ന ക്രിയാവിശേഷണം ഇല്ല; അതിനാൽ മൂലപാഠത്തിന്റെ പരിധി പാലിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. വിതയ്ക്കൽ, കൊയ്ത്ത്, കൂലി, ഫലം എന്നീ കൃഷിരൂപകങ്ങൾ നിലനിർത്തി; മതവിഭാഗ-വിശേഷ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി. അടിക്കുറിപ്പുസൂചകങ്ങൾ അവ വിശദീകരിക്കുന്ന പദപ്രയോഗങ്ങൾക്ക് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
