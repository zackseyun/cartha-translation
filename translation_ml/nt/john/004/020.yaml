reference: John 4:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ πατέρες ἡμῶν ἐν τῷ ὄρει τούτῳ προσεκύνησαν· καὶ ὑμεῖς λέγετε ὅτι ἐν Ἱεροσολύμοις ἐστὶν ὁ τόπος ὅπου ⸂προσκυνεῖν δεῖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/020.yaml
  text: Our fathers worshiped on this mountain[b][a], and you say that in Jerusalem is the place where one must worship.
translation:
  language: ml
  text: ഞങ്ങളുടെ പിതാക്കന്മാർ ഈ മലയിൽ ആരാധിച്ചു; ആരാധിക്കേണ്ട സ്ഥലം യെരൂശലേമിലാണെന്ന് നിങ്ങൾ പറയുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ πατέρες ἡμῶν
  choice: ഞങ്ങളുടെ പിതാക്കന്മാർ
  rationale: ഗ്രീക്കിലെ കുടുംബ-സമൂഹ പാരമ്പര്യത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു; ഇവിടെ ‘പൂർവികർ’ എന്ന വിശാല അർഥവും ഉൾപ്പെടാം.
- source_word: ἐν τῷ ὄρει τούτῳ
  choice: ഈ മലയിൽ
  rationale: മലയാളത്തിൽ ഒരു മല ആരാധനയുടെ സ്ഥലമായി പറയുമ്പോൾ ‘മലയിൽ’ എന്നത് സ്വാഭാവികമായ സ്ഥലസൂചനയാണ്.
- source_word: προσεκύνησαν
  choice: ആരാധിച്ചു
  rationale: ആരാധനയ്ക്കുള്ള ശരിയായ സ്ഥലത്തെക്കുറിച്ചുള്ള സന്ദർഭത്തിൽ προσκυνέω എന്നതിന്റെ മതപരമായ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: καὶ ὑμεῖς λέγετε
  choice: എന്നാൽ ... നിങ്ങൾ പറയുന്നു
  rationale: καί അടിസ്ഥാനമായി ബന്ധകമാണെങ്കിലും, ‘ഞങ്ങളുടെ പിതാക്കന്മാർ’ എന്നും ‘നിങ്ങൾ’ എന്നും ഉള്ള വ്യക്തമായ സന്ദർഭവിരോധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ ‘എന്നാൽ’ ഉപയോഗിച്ചു; സമര്യർ/യെഹൂദർ എന്ന തിരിച്ചറിയൽ കൂട്ടിച്ചേർത്തിട്ടില്ല.
- source_word: ἐν Ἱεροσολύμοις
  choice: യെരൂശലേമിലാണ്
  rationale: നഗരത്തിനുള്ളിലെ സ്ഥലം സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം; ἐστίν നൽകുന്ന ഊന്നലും ‘ആണ്’ ഘടനയിൽ നിലനിൽക്കുന്നു.
- source_word: ὁ τόπος
  choice: സ്ഥലം
  rationale: നിശ്ചിതമായ ആരാധനാസ്ഥലത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്നു; ‘ശരിയായ സ്ഥലം’ എന്ന വ്യാഖ്യാനപരമായ വിശേഷണം ചേർത്തിട്ടില്ല.
- source_word: προσκυνεῖν δεῖ
  choice: ആരാധിക്കേണ്ട
  rationale: δεῖയുടെ ആവശ്യകതയും ബാധ്യതയും മലയാളത്തിലെ ‘-േണ്ട’ രൂപം സംക്ഷിപ്തമായും സ്വാഭാവികമായും നൽകുന്നു; ബാധ്യത ആരെയെങ്കിലും പ്രത്യേകമായി അഭിസംബോധന ചെയ്യുന്നതല്ല.
theological_decisions:
- issue: സമര്യ-യെഹൂദ ആരാധനാസ്ഥലങ്ങളുടെ വിരോധം വാക്യത്തിൽ എത്രത്തോളം വ്യക്തമാക്കണം
  choice: ‘ഞങ്ങളുടെ പിതാക്കന്മാർ ... എന്നാൽ ... നിങ്ങൾ പറയുന്നു’ എന്ന പ്രയോഗത്തിലൂടെ മാത്രം വിരോധം പ്രകടിപ്പിച്ചു.
  alternative: ‘ഞങ്ങളുടെ സമര്യൻ പൂർവികർ ... എന്നാൽ യെഹൂദരായ നിങ്ങൾ ...’ എന്ന് തിരിച്ചറിയലുകൾ തുറന്നുപറയുക.
  rationale: സന്ദർഭം ആ തിരിച്ചറിയലുകൾ വ്യക്തമാക്കുന്നുവെങ്കിലും ഈ വാക്യത്തിലെ ഗ്രീക്ക് അവയെ പേരെടുത്ത് പറയുന്നില്ല; അതിനാൽ മൂലപാഠത്തേക്കാൾ അധികം വിശദീകരിച്ചിട്ടില്ല.
- issue: προσκυνεῖν δεῖ എന്നതിലെ വ്യക്തിനിരപേക്ഷമായ ആവശ്യകത
  choice: ‘ആരാധിക്കേണ്ട സ്ഥലം’
  alternative: ‘ആരാധിക്കുന്നത് ആവശ്യമായ സ്ഥലം’ / ‘ആളുകൾ ആരാധിക്കേണ്ട സ്ഥലം’
  rationale: പൊതുവായ നിബന്ധനാത്മക അവകാശവാദം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ഒരു പ്രത്യേക വ്യക്തിയോടുള്ള കല്പനയായി മാറ്റുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘പിതാക്കന്മാർ’ എന്ന ഉറവിടസന്നിഹിത പ്രയോഗം നിലനിർത്തി; മലയാളത്തിൽ അത് മുൻതലമുറകളെയും ഉൾക്കൊള്ളാൻ കഴിയുന്നതിനാൽ പ്രത്യേക പദവികൽപ്പന അടിക്കുറിപ്പായി നൽകിയിട്ടില്ല. വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കാനായി സ്ഥാനവാക്യം സ്വാഭാവികമായി ക്രമപ്പെടുത്തി.
