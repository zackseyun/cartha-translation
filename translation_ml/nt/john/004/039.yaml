language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐκ δὲ τῆς πόλεως ἐκείνης πολλοὶ ἐπίστευσαν εἰς αὐτὸν τῶν Σαμαριτῶν διὰ τὸν λόγον τῆς γυναικὸς μαρτυρούσης ὅτι Εἶπέν μοι πάντα ⸀ἃ ἐποίησα.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/039.yaml
  text: And many of the Samaritans from that town believed in him because of the word of the woman who was testifying, “He told me everything I did.”
translation:
  language: ml
  text: ആ പട്ടണത്തിൽനിന്നുള്ള ശമര്യരിൽ പലരും, “ഞാൻ ചെയ്തതെല്ലാം അദ്ദേഹം എന്നോടു പറഞ്ഞു” എന്നു സാക്ഷ്യം പറഞ്ഞുകൊണ്ടിരുന്ന ആ സ്ത്രീയുടെ വാക്ക്[a] നിമിത്തം അദ്ദേഹത്തിൽ വിശ്വസിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആ സ്ത്രീയുടെ സന്ദേശം നിമിത്തം.” λόγος എന്ന ഗ്രീക്ക് പദത്തിന് “വാക്ക്,” “സന്ദേശം,” “വാർത്ത” എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐκ δὲ τῆς πόλεως ἐκείνης
  choice: ആ പട്ടണത്തിലെ
  rationale: ἐκ ഉറവിടം സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളത്തിന് ‘ആ പട്ടണത്തിലെ’ എന്നു നൽകി. δέ ഇവിടെ നേരിയ ആഖ്യാനബന്ധമാണ്; പ്രത്യേക സംയോജകം ചേർക്കാതെയും മലയാളത്തിൽ അത് നിലനിൽക്കുന്നു.
- source_word: πολλοὶ ... τῶν Σαμαριτῶν
  choice: ശമര്യരിൽ പലരും
  rationale: ഭാഗിക ഷഷ്ഠിയുടെ അർഥമായ ‘ശമര്യരിൽ പലർ’ എന്ന ആശയം സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: അദ്ദേഹത്തിൽ വിശ്വസിച്ചു
  rationale: πιστεύω εἰς യേശുവിലേക്കു ദിശപ്പെടുത്തിയ വിശ്വാസത്തെ സൂചിപ്പിക്കുന്നു. ‘അദ്ദേഹത്തിൽ വിശ്വസിച്ചു’ എന്നത് ബന്ധപരമായ അർഥം വ്യാഖ്യാനവിപുലീകരണമില്ലാതെ നിലനിർത്തുന്നു.
- source_word: διὰ τὸν λόγον
  choice: വാക്ക് നിമിത്തം
  rationale: διά + accusative കാരണമോ അടിസ്ഥാനമോ സൂചിപ്പിക്കുന്നു. λόγος എന്നതിലെ ‘വാക്ക്/സന്ദേശം/വിവരണം’ എന്ന അർഥവ്യാപ്തി ‘വാക്ക്’ ഭാഗികമായി തുറന്നുവയ്ക്കുന്നു; മറ്റൊരു സ്വാഭാവിക സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
- source_word: τῆς γυναικὸς μαρτυρούσης
  choice: സാക്ഷ്യം പറഞ്ഞുകൊണ്ടിരുന്ന ആ സ്ത്രീയുടെ
  rationale: വർത്തമാന കൃദന്തരൂപം അവൾ തുടർന്നുകൊണ്ടിരുന്ന സാക്ഷ്യപ്രവർത്തനമായി അവതരിപ്പിക്കുന്നു; ‘പറഞ്ഞുകൊണ്ടിരുന്ന’ ആ പുരോഗമനഭാവം നിലനിർത്തുന്നു.
- source_word: Εἶπέν μοι
  choice: അദ്ദേഹം എന്നോടു പറഞ്ഞു
  rationale: λέγω + പരോക്ഷ കർമം മലയാളത്തിൽ സ്വാഭാവികമായി ‘എന്നോടു പറഞ്ഞു’ എന്നാണ്.
- source_word: πάντα ἃ ἐποίησα
  choice: ഞാൻ ചെയ്തതെല്ലാം
  rationale: സമഗ്രതയും aorist-ന്റെ ഭൂതകാലസൂചനയും ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു; ‘ചെയ്തിട്ടുള്ളതെല്ലാം’ എന്ന വ്യാഖ്യാനപരമായ perfect രൂപം നിർബന്ധിക്കുന്നില്ല.
theological_decisions:
- issue: യോഹന്നാനിലെ πιστεύω εἰς പ്രയോഗത്തിന്റെ സ്വഭാവം
  choice: അദ്ദേഹത്തിൽ വിശ്വസിച്ചു
  alternative: അദ്ദേഹത്തിൽ ആശ്രയം വെച്ചു
  rationale: വാക്യം യേശുവിലേക്കു ദിശപ്പെടുത്തിയ വിശ്വാസം രേഖപ്പെടുത്തുന്നു; പിന്നീട് നിർവചിക്കപ്പെട്ട ഒരു സിദ്ധാന്തവിഭാഗം ഇതിൽ ചേർക്കാതെ ബന്ധപരമായ ശക്തി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ മാന്യവും ലളിതവുമായ ആഖ്യാനശൈലി. യേശുവിനെ സൂചിപ്പിക്കാൻ ആദരസൂചകമായ ‘അദ്ദേഹം’ ഉപയോഗിച്ചു. മുഖ്യവാക്യത്തിലെ [a] അടിക്കുറിപ്പ് λόγος എന്ന പദത്തിന്റെ യഥാർഥ അർഥവ്യാപ്തി വ്യക്തമാക്കുന്നു.
