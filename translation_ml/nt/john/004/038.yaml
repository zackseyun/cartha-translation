id: JHN.4.38
reference: John 4:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐγὼ ἀπέστειλα ὑμᾶς θερίζειν ὃ οὐχ ὑμεῖς κεκοπιάκατε· ἄλλοι κεκοπιάκασιν, καὶ ὑμεῖς εἰς τὸν κόπον αὐτῶν εἰσεληλύθατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/038.yaml
  text: I sent you to reap what you have not labored for[a]; others have labored[b], and you have entered into their labor.
translation:
  language: ml
  text: നിങ്ങൾ അധ്വാനിക്കാത്തത് കൊയ്യാൻ[a] ഞാൻ നിങ്ങളെ അയച്ചു. മറ്റുള്ളവർ അധ്വാനിച്ചിട്ടുണ്ട്; നിങ്ങൾ അവരുടെ അധ്വാനത്തിലേക്കു പ്രവേശിച്ചിരിക്കുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘വിളവെടുക്കാൻ.’'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: ‘നിങ്ങൾ അവരുടെ അധ്വാനഫലത്തിൽ പങ്കുചേർന്നിരിക്കുന്നു’ അല്ലെങ്കിൽ ‘അവരുടെ വേലയിൽ പങ്കാളികളായിരിക്കുന്നു.’ ഗ്രീക്കിൽ കൂടുതൽ അക്ഷരാർഥമായി: ‘നിങ്ങൾ അവരുടെ അധ്വാനത്തിലേക്കു പ്രവേശിച്ചിരിക്കുന്നു.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλα
  choice: അയച്ചു
  rationale: സംഭാഷണസന്ദർഭത്തിലെ പൂർത്തിയായ അയയ്ക്കലിനെ ലളിതമായ ഭൂതകാലത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ‘നിയോഗിച്ചു’ എന്ന വ്യാഖ്യാനവികാസം ഒഴിവാക്കുന്നു.
- source_word: θερίζειν
  choice: കൊയ്യാൻ
  rationale: സന്ദർഭത്തിലെ കാർഷികരൂപകം നിലനിർത്തുന്ന നേരിട്ടുള്ളതും മലയാളത്തിൽ സ്വാഭാവികവുമായ പദം.
- source_word: ὃ
  choice: അധ്വാനിക്കാത്തത്
  rationale: നപുംസകലിംഗ ബന്ധസർവനാമത്തിന്റെ കർമാർഥം ‘-ത്’ രൂപത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: κεκοπιάκατε
  choice: നിങ്ങൾ അധ്വാനിക്കാത്തത്
  rationale: കൊയ്ത്തിന്റെ വിഷയവുമായി ബന്ധം വ്യക്തമാക്കിക്കൊണ്ട് മുൻ അധ്വാനത്തിന്റെ അഭാവം രേഖപ്പെടുത്തുന്നു; ഗ്രീക്കിലെ perfect രൂപത്തിന്റെ ഇപ്പോഴത്തെ പ്രസക്തി സന്ദർഭത്തിൽ നിലനിൽക്കുന്നു.
- source_word: ἄλλοι
  choice: മറ്റുള്ളവർ
  rationale: പ്രത്യേക വ്യക്തികളെയോ കൂട്ടങ്ങളെയോ തിരിച്ചറിയാതെ ഗ്രീക്കിലെ വിശാലവും അനിശ്ചിതവുമായ പരാമർശം സംരക്ഷിക്കുന്നു.
- source_word: κεκοπιάκασιν
  choice: അധ്വാനിച്ചിരിക്കുന്നു
  rationale: മുൻപ് നടന്ന അധ്വാനത്തിന്റെ ഇപ്പോഴും നിലനിൽക്കുന്ന പ്രസക്തി മലയാളത്തിലെ perfect സ്വഭാവമുള്ള രൂപം പ്രകടിപ്പിക്കുന്നു.
- source_word: εἰς τὸν κόπον αὐτῶν εἰσεληλύθατε
  choice: നിങ്ങൾ അവരുടെ അധ്വാനത്തിലേക്കു പ്രവേശിച്ചിരിക്കുന്നു
  rationale: ‘അവരുടെ അധ്വാനത്തിലേക്ക് പ്രവേശിച്ചു’ എന്ന ഗ്രീക്കിലെ അസാധാരണമായെങ്കിലും അർത്ഥസമ്പന്നമായ പ്രയോഗം വ്യാഖ്യാനിച്ച് മിനുക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: ἐγὼ ... ὑμεῖς
  choice: ഞാൻ ... നിങ്ങൾ
  rationale: വ്യക്തമായ സർവനാമങ്ങൾ നിലനിർത്തി ഗ്രീക്കിലെ ലഘുവായ ഊന്നൽ സംരക്ഷിക്കുന്നു.
- source_word: κόπον
  choice: അധ്വാനം
  rationale: κοπιάω എന്ന ക്രിയയ്ക്ക് നൽകിയ ‘അധ്വാനിക്കുക’ എന്ന വിവർത്തനവുമായി പദബന്ധം നിലനിർത്തുന്നു.
theological_decisions:
- issue: കൊയ്ത്തുരൂപകവും ‘മറ്റുള്ളവർ’ എന്നതിന്റെ പരാമർശവും
  choice: കാർഷികരൂപകം നിലനിർത്തുകയും ‘മറ്റുള്ളവർ’ ആരെന്നത് വ്യക്തമാക്കാതിരിക്കുകയും ചെയ്തു.
  alternative: ‘മറ്റുള്ളവർ’ പ്രവാചകന്മാരെയോ യോഹന്നാൻ സ്നാപകനെയോ യേശുവിനെയോ സൂചിപ്പിക്കുന്നു എന്നു നിർദിഷ്ടമാക്കുക.
  rationale: വാക്യം തന്നെ അവരുടെ തിരിച്ചറിയൽ വ്യക്തമാക്കുന്നില്ല; അതിനാൽ അതിലെ ഉദ്ദേശപൂർവമായ വിശാലതയും ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും സംരക്ഷിച്ചു.
- issue: ‘അവരുടെ അധ്വാനത്തിലേക്കു പ്രവേശിച്ചു’ എന്ന പ്രയോഗത്തിന്റെ അർത്ഥം
  choice: ഗ്രീക്കിലെ നേരിട്ടുള്ള രൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
  alternative: ‘അവരുടെ അധ്വാനഫലത്തിൽ പങ്കുചേർന്നു’ അല്ലെങ്കിൽ ‘അവരുടെ വേലയിൽ പങ്കാളികളായി’ എന്നു വ്യാഖ്യാനിക്കുക.
  rationale: ഇത്തരം വ്യാഖ്യാനങ്ങൾ സാദ്ധ്യമാണെങ്കിലും ഗ്രീക്ക് അധ്വാനത്തെയാണു നേരിട്ട് പറയുന്നത്, അതിന്റെ ഫലത്തെ മാത്രമല്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘കൊയ്യുക/അധ്വാനം’ എന്ന പദക്രമം കാർഷികരൂപകവും ആവർത്തനബന്ധവും നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
