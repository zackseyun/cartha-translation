  to: നിങ്ങൾ അധ്വാനിക്കാത്തത് കൊയ്യാൻ[a] ഞാൻ നിങ്ങളെ അയച്ചു. മറ്റുള്ളവർ അധ്വാനിച്ചിട്ടുണ്ട്; നിങ്ങൾ അവരുടെ അധ്വാനത്തിലേക്കു പ്രവേശിച്ചിരിക്കുന്നു.[b]
