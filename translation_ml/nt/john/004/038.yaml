review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the agricultural metaphor, the unspecified scope of “others,” the repeated labor terminology, and the direct—somewhat unusual—image of entering into others’ labor. The relative expression “നിങ്ങൾ അധ്വാനിക്കാത്തത്” adequately represents ὃ οὐχ ὑμεῖς κεκοπιάκατε without identifying the object more narrowly than the Greek does.
  naturalness: “അധ്വാനിച്ചിരിക്കുന്നു” is grammatical but less idiomatic in modern standard Malayalam than “അധ്വാനിച്ചിട്ടുണ്ട്.” The latter naturally conveys completed prior labor with present relevance. The deliberately literal “അവരുടെ അധ്വാനത്തിലേക്കു പ്രവേശിച്ചിരിക്കുന്നു” remains intelligible and appropriately preserves the Greek expression; it should not be replaced in the main text by a more interpretive paraphrase.
  terminology: “കൊയ്യാൻ,” “അധ്വാനിക്കുക,” and “അധ്വാനം” preserve both the harvest metaphor and the lexical linkage between κοπιάω and κόπος. “മറ്റുള്ളവർ” properly leaves the referent unidentified. The footnotes are correctly anchored and distinguish lexical alternatives from the more literal wording.
  issues:
  - severity: low
    issue: Modern idiom in the second clause
    rationale: Change “മറ്റുള്ളവർ അധ്വാനിച്ചിരിക്കുന്നു” to “മറ്റുള്ളവർ അധ്വാനിച്ചിട്ടുണ്ട്.” This is more natural contemporary standard Malayalam while retaining the completed-action sense of κεκοπιάκασιν.
