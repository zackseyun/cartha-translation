  terminology: ‘അടയാളം’ is the appropriate consistent rendering of σημεῖον in Johannine usage. ‘യെഹൂദ്യ’ and ‘ഗലീല’ are standard biblical Malayalam forms. The lexical-alternative footnote is clear and appropriately limited.
