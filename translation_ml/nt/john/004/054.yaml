id: JHN.4.54
reference: John 4:54
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῦτο ⸀δὲ πάλιν δεύτερον σημεῖον ἐποίησεν ὁ Ἰησοῦς ἐλθὼν ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/054.yaml
  text: This again was the second sign Jesus did after coming from Judea into Galilee[a].
translation:
  language: ml
  text: യെഹൂദ്യയിൽനിന്ന് ഗലീലയിലേക്കു വീണ്ടും വന്നശേഷം യേശു ചെയ്ത രണ്ടാമത്തെ അടയാളം ഇതായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അത്ഭുതം.” യോഹന്നാൻ സാധാരണയായി “അടയാളം” എന്ന പദം ഉപയോഗിക്കുന്നത് ആ പ്രവൃത്തിയുടെ ശക്തിയോടൊപ്പം അതിന്റെ അർഥത്തിനും ഊന്നൽ നൽകാനാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: ഇത്
  rationale: ഇപ്പോൾ വിവരിച്ച സൗഖ്യപ്പെടുത്തലിനെ പിന്നോട്ടു ചൂണ്ടിക്കാണിക്കുന്ന സ്വാഭാവിക മലയാള പ്രയോഗം.
- source_word: δὲ πάλιν δεύτερον
  choice: രണ്ടാമത്തെ
  rationale: πάλιν, δεύτερον എന്നിവ ചേർന്ന് മുൻപ് ഗലീലയിൽ ചെയ്ത അടയാളത്തെ തുടർന്നുള്ള ക്രമം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘വീണ്ടും രണ്ടാമത്തെ’ എന്നത് അസ്വാഭാവികമായതിനാൽ ‘രണ്ടാമത്തെ’ എന്നതിൽ ആവർത്തനഭാവം ഉൾക്കൊള്ളുന്നു.
- source_word: σημεῖον
  choice: അടയാളം
  rationale: യോഹന്നാനിൽ ഈ പദം അത്ഭുതപ്രവൃത്തിയുടെ ശക്തിയോടൊപ്പം അതു വെളിപ്പെടുത്തുന്ന അർഥത്തെയും ചൂണ്ടുന്നു; അതിനാൽ ‘അത്ഭുതം’ എന്നതിനെക്കാൾ ‘അടയാളം’ മൂലപദത്തിന്റെ സാഹിത്യ-ദൈവശാസ്ത്രപരമായ ഭാരം നന്നായി നിലനിർത്തുന്നു.
- source_word: ἐποίησεν
  choice: ചെയ്ത
  rationale: σημεῖον എന്നതിനോടൊപ്പം ποιέωയുടെ സാധാരണ പ്രവർത്തനാർഥം ലളിതമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: ἐλθὼν
  choice: വന്നശേഷം
  rationale: സന്ദർഭത്തിൽ aorist participle-ന്റെ കാലസംബന്ധമായ മുൻക്രമം വ്യക്തമാക്കുന്നു; അടയാളം യേശു ഗലീലയിൽ എത്തിയശേഷമാണ് ചെയ്തത്.
- source_word: ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν
  choice: യെഹൂദ്യയിൽനിന്ന് ഗലീലയിലേക്ക്
  rationale: ἐκ ... εἰς എന്ന ഉറവിട-ലക്ഷ്യ ദിശാസംബന്ധം സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: യോഹന്നാനിലെ σημεῖον എന്ന സാങ്കേതിക പ്രയോഗം
  choice: അടയാളം
  alternative: അത്ഭുതം
  rationale: പ്രവൃത്തിയുടെ അത്ഭുതസ്വഭാവം മാത്രമല്ല, യേശുവിനെക്കുറിച്ച് അതു വെളിപ്പെടുത്തുന്ന അർഥവും യോഹന്നാന്റെ പദപ്രയോഗത്തിൽ ഉൾപ്പെടുന്നു. ‘അടയാളം’ ആ സാഹിത്യ-ദൈവശാസ്ത്രപരമായ പ്രവർത്തനം വ്യാഖ്യാനിച്ച് തീർക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘വന്നശേഷം ചെയ്ത’ എന്ന ഘടന ഗ്രീക്ക് participle-ന്റെ ബന്ധം വ്യക്തമായി നൽകുന്നു. ‘വീണ്ടും രണ്ടാമത്തെ’ എന്ന പദാനുപദ ആവർത്തനം ഒഴിവാക്കി സ്വാഭാവിക മലയാള ക്രമവാക്യം ഉപയോഗിച്ചു.
