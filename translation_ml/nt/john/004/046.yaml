source:
  edition: SBLGNT
  text: Ἦλθεν οὖν ⸀πάλιν εἰς τὴν Κανὰ τῆς Γαλιλαίας, ὅπου ἐποίησεν τὸ ὕδωρ οἶνον. καὶ ἦν τις βασιλικὸς οὗ ὁ υἱὸς ἠσθένει ἐν Καφαρναούμ.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/046.yaml
  text: So he came again to Cana of Galilee[a], where he had made the water wine[b]. And there was a certain royal official whose son was sick in Capernaum.
translation:
  language: ml
  text: അതുകൊണ്ട് അവൻ വീണ്ടും ഗലീലയിലെ കാനായിൽ എത്തി. അവിടെയാണ് അവൻ വെള്ളത്തെ വീഞ്ഞാക്കിയിരുന്നത്.[a] കഫർന്നഹൂമിൽ മകൻ രോഗിയായിരുന്ന ഒരു രാജകീയ ഉദ്യോഗസ്ഥൻ അവിടെ ഉണ്ടായിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ വ്യാഖ്യാനാത്മകമായി: “വെള്ളം വീഞ്ഞാക്കി മാറ്റിയിരുന്നത്.” ഗ്രീക്കിൽ കൂടുതൽ അക്ഷരാർഥമായി, “വെള്ളത്തെ വീഞ്ഞാക്കിയിരുന്നത്” എന്നാണ്.'
    reason: lexical_alternative
  - marker: b
    text: “രാജസേവകൻ” എന്നോ “കൊട്ടാര ഉദ്യോഗസ്ഥൻ” എന്നോ വിവർത്തനം ചെയ്യാം. βασιλικός എന്ന ഗ്രീക്ക് പദം രാജാവുമായോ രാജസദസ്സുമായോ രാജസേവനവുമായോ ബന്ധമുള്ള ഒരാളെ സൂചിപ്പിക്കുന്നു; കൃത്യമായ പദവി ഇവിടെ വ്യക്തമല്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻസന്ദർഭവുമായി ഈ സംഭവത്തെ ബന്ധിപ്പിക്കുന്ന ആഖ്യാനപരമായ തുടർച്ചയും നിഗമനസ്വഭാവവും നിലനിർത്തുന്നു.
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: ആവർത്തിച്ചുള്ള വരവിനെ സ്വാഭാവികവും നേരിട്ടുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: Κανὰ τῆς Γαλιλαίας
  choice: ഗലീലയിലെ കാനാ
  rationale: പ്രദേശത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ഷഷ്ഠീവാക്യത്തെ സ്വാഭാവിക മലയാള സ്ഥലപ്രയോഗമായി നൽകുന്നു.
- source_word: ἐποίησεν τὸ ὕδωρ οἶνον
  choice: വെള്ളത്തെ വീഞ്ഞാക്കിയിരുന്നത്
  rationale: ഗ്രീക്കിലെ ‘വെള്ളത്തെ വീഞ്ഞാക്കി’ എന്ന നേരിട്ടുള്ള ഘടന സംരക്ഷിക്കുകയും ഇപ്പോഴത്തെ വരവിനു മുമ്പു നടന്ന സംഭവമാണെന്ന കാലബന്ധം ‘-യിരുന്നത്’ വഴി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: βασιλικός
  choice: രാജാവിന്റെ ഉദ്യോഗസ്ഥൻ
  rationale: കൃത്യമായ പദവിയോ സാമൂഹികസ്ഥാനമോ അനുമാനിക്കാതെ രാജാവുമായോ രാജസേവനവുമായോ ഉള്ള ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: τις
  choice: ഒരു
  rationale: പേരറിയിക്കാത്ത ഒരു പ്രത്യേക വ്യക്തിയെ പരിചയപ്പെടുത്തുന്ന അനിശ്ചിത സർവനാമത്തിന്റെ പ്രവർത്തനം സ്വാഭാവിക മലയാളത്തിൽ നിർവഹിക്കുന്നു.
- source_word: υἱός
  choice: മകൻ
  rationale: രോഗിയായ വ്യക്തിയെ ഗ്രീക്ക് വാചകം പുത്രനായി വ്യക്തമായി തിരിച്ചറിയുന്നു.
- source_word: ἠσθένει
  choice: രോഗിയായിരുന്നു
  rationale: സന്ദർഭത്തിൽ ശാരീരിക അസുഖത്തെ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ സ്വാഭാവിക മലയാള പരിഭാഷ.
- source_word: Καφαρναούμ
  choice: കഫർന്നഹൂം
  rationale: സ്ഥലനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: βασιλικός എന്ന പദം ആ മനുഷ്യന്റെ കൃത്യമായ പദവിയോ ഹെരോദാവിന്റെ കൊട്ടാരവുമായുള്ള പ്രത്യേക ചരിത്രബന്ധമോ ഉറപ്പിക്കുന്നുണ്ടോ
  choice: രാജാവിന്റെ ഉദ്യോഗസ്ഥൻ
  alternative: രാജസേവകൻ; പ്രഭു; കൊട്ടാര ഉദ്യോഗസ്ഥൻ
  rationale: മൂലവാചകം രാജകീയബന്ധം സൂചിപ്പിക്കുന്നുവെങ്കിലും പദവിയോ കുലീനവർഗ്ഗസ്ഥാനമോ വ്യക്തമാക്കുന്നില്ല. അതിനാൽ ചരിത്രപരമായി അധികം നിർണ്ണയിക്കാതെ ആ ബന്ധം മാത്രം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം മാന്യവുമായ ആഖ്യാനശൈലി. ‘അതുകൊണ്ട്’ സന്ദർഭബന്ധം നിലനിർത്തുന്നു; ‘വെള്ളത്തെ വീഞ്ഞാക്കിയിരുന്നത്’ മൂലഘടനയും മുൻകാലസംഭവത്തിന്റെ കാലബന്ധവും സംരക്ഷിക്കുന്നു. രാജകീയ ഉദ്യോഗസ്ഥന്റെ കൃത്യമായ പദവി അനാവശ്യമായി നിർണ്ണയിച്ചിട്ടില്ല.
