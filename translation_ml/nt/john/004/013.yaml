id: JHN.4.13
reference: John 4:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῇ· Πᾶς ὁ πίνων ἐκ τοῦ ὕδατος τούτου διψήσει πάλιν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/013.yaml
  text: Jesus answered and said to her[a], “Everyone who drinks from this water will be thirsty again.”
translation:
  language: ml
  text: 'യേശു അവളോട് ഉത്തരം പറഞ്ഞു: “ഈ വെള്ളം കുടിക്കുന്ന എല്ലാവർക്കും വീണ്ടും ദാഹിക്കും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη ... καὶ εἶπεν αὐτῇ
  choice: അവളോട് ഉത്തരം പറഞ്ഞു
  rationale: മലയാളത്തിലെ സ്വാഭാവികമായ മറുപടി-പ്രയോഗത്തിലൂടെ രണ്ട് ഗ്രീക്ക് ക്രിയകളുടെയും ആശയം നിലനിർത്തുന്നു; ‘ഉത്തരം പറഞ്ഞുകൊണ്ട് പറഞ്ഞു’ എന്ന അസ്വാഭാവിക ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: Πᾶς ὁ πίνων
  choice: കുടിക്കുന്ന എല്ലാവർക്കും
  rationale: വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ പൊതുവായ, പതിവുസ്വഭാവമുള്ള അർഥവും എല്ലാവരെയും ഉൾക്കൊള്ളുന്ന വ്യാപ്തിയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἐκ τοῦ ὕδατος τούτου
  choice: ഈ വെള്ളം
  rationale: സംസാരവിഷയമായ ഭൗതിക വെള്ളത്തെ τούτου വ്യക്തമായി ചൂണ്ടിക്കാണിക്കുന്നു; ‘കുടിക്കുക’ എന്ന ക്രിയയോടൊപ്പം ἐκ സൂചിപ്പിക്കുന്ന ഉറവിടബന്ധം മലയാളത്തിൽ വിഭക്തിയിലൂടെ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: διψήσει πάλιν
  choice: വീണ്ടും ദാഹിക്കും
  rationale: ഭാവികാലവും ആവർത്തനവും നേരിട്ട്, സംക്ഷിപ്തമായി സംരക്ഷിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
theological_decisions:
- issue: ἀπεκρίθη ... καὶ εἶπεν എന്ന ഇരട്ട സംസാരസൂത്രം
  choice: ‘ഉത്തരം പറഞ്ഞു’ എന്ന് വിവർത്തനം ചെയ്യുക
  alternative: ‘ഉത്തരം പറഞ്ഞ് അവളോട് പറഞ്ഞു’ എന്നിങ്ങനെ രണ്ട് ക്രിയകളും വേർതിരിച്ച് നിലനിർത്തുക
  rationale: ഗ്രീക്കിൽ രണ്ട് ക്രിയകളുണ്ടെങ്കിലും ഇത് ഒരു സാധാരണ ആഖ്യാനസൂത്രമാണ്. മലയാളത്തിൽ രണ്ടും അക്ഷരാർഥത്തിൽ ആവർത്തിക്കുന്നത് കൃത്രിമമാകും; ‘ഉത്തരം പറഞ്ഞു’ പ്രതികരണവും സംസാരവും ഒരുമിച്ച് കൃത്യമായി നൽകുന്നു.
- issue: Πᾶς ὁ πίνων എന്ന വ്യാകരണപരമായി പുല്ലിംഗത്തിലുള്ള പൊതുപ്രയോഗം
  choice: ‘കുടിക്കുന്ന എല്ലാവർക്കും’ എന്ന ഉൾക്കൊള്ളുന്ന രൂപം
  alternative: ‘കുടിക്കുന്ന ഏവനും’
  rationale: ഗ്രീക്ക് രൂപം പുരുഷന്മാർക്കു മാത്രമായുള്ളതല്ല; പൊതുവായി ഏതു വ്യക്തിയെയും സൂചിപ്പിക്കുന്നു. തിരഞ്ഞെടുത്ത രൂപം ആ സർവവ്യാപ്തി ലിംഗപരമായ അനാവശ്യ നിയന്ത്രണമില്ലാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വാക്യക്രമം സ്വാഭാവികമാക്കിയെങ്കിലും ഈ വെള്ളം, എല്ലാവരും, വീണ്ടും ദാഹിക്കുക എന്നീ ഉറവിടഘടകങ്ങൾ വ്യക്തമായി സംരക്ഷിച്ചിരിക്കുന്നു.
