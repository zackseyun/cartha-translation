id: JHN.4.14
reference: John 4:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃς δ’ ἂν πίῃ ἐκ τοῦ ὕδατος οὗ ἐγὼ δώσω αὐτῷ, οὐ μὴ ⸀διψήσει εἰς τὸν αἰῶνα, ἀλλὰ τὸ ὕδωρ ὃ δώσω αὐτῷ γενήσεται ἐν αὐτῷ πηγὴ ὕδατος ἁλλομένου εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/014.yaml
  text: But whoever drinks from the water that I will give him will never thirst forever; rather, the water that I will give him will become in him a spring of water welling up to eternal life.
translation:
  language: ml
  text: എന്നാൽ, ഞാൻ അവന് കൊടുക്കുന്ന വെള്ളത്തിൽനിന്ന് കുടിക്കുന്നവന് ഒരിക്കലും ദാഹിക്കുകയില്ല; മറിച്ച്, ഞാൻ അവന് കൊടുക്കുന്ന വെള്ളം അവനിൽ നിത്യജീവനിലേക്കു കുതിച്ചുയരുന്ന നീരുറവയായിത്തീരും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ μὴ διψήσει εἰς τὸν αἰῶνα
  choice: ഒരിക്കലും ദാഹിക്കുകയില്ല
  rationale: οὐ μή എന്ന ശക്തമായ നിഷേധവും εἰς τὸν αἰῶνα എന്ന കാലപരമായ ഊന്നലും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഒരുമിച്ച് പ്രകടിപ്പിക്കുന്നു.
- source_word: πηγὴ ὕδατος
  choice: നീരുറവ
  rationale: ഉള്ളിൽനിന്ന് തുടർച്ചയായി ഉദ്ഭവിക്കുന്ന ജലസ്രോതസ്സ് എന്ന ദൃശ്യത്തെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἁλλομένου
  choice: കുതിച്ചുയരുന്ന
  rationale: ἅλλομαι എന്ന ക്രിയയുടെ പൊങ്ങുകയോ ചാടിയുയരുകയോ ചെയ്യുന്ന സജീവ ജലചലനം നിലനിർത്തുന്നു; വെറും ‘ഒഴുകുന്ന’ എന്നതിനെക്കാൾ ഉറവയുടെ ദൃശ്യത്തിന് അടുത്തതാണ്.
- source_word: ζωὴν αἰώνιον
  choice: നിത്യജീവൻ
  rationale: യോഹന്നാന്റെ രചനകളിലെ സ്ഥിരമായ ദൈവശാസ്ത്രപരമായ പ്രയോഗം നിലനിർത്തുന്ന, മലയാളത്തിൽ സുപരിചിതമായ സമാനപദം.
theological_decisions:
- issue: εἰς ζωὴν αἰώνιον എന്നതിന്റെ ബന്ധവും ദിശയും
  choice: നിത്യജീവനിലേക്കു കുതിച്ചുയരുന്ന
  alternative: നിത്യജീവൻ നൽകുന്നവിധം കുതിച്ചുയരുന്ന
  rationale: εἰς എന്നതിന്റെ ദിശാസൂചകത നിലനിർത്തുകയും, വെള്ളം എങ്ങനെ നിത്യജീവനുമായി ബന്ധപ്പെട്ടിരിക്കുന്നു എന്ന് വിശദീകരിച്ച് വാചകത്തിൽ ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: εἰς τὸν αἰῶνα എന്നതിലെ കാലപരമായ ഊന്നൽ
  choice: ഒരിക്കലും ദാഹിക്കുകയില്ല
  alternative: എന്നേക്കും ദാഹിക്കുകയില്ല
  rationale: ശക്തമായ ശാശ്വത നിഷേധം സ്വാഭാവികമായി അറിയിക്കുന്നു; ‘എന്നേക്കും ദാഹിക്കുകയില്ല’ എന്ന മലയാളപ്രയോഗത്തിൽ ഉണ്ടാകാവുന്ന അസ്വാഭാവികത ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മൂലവാക്യത്തിലെ വിരോധസൂചക ഘടനയും ജീവജലത്തിന്റെ സജീവ ദൃശ്യവും സംരക്ഷിച്ചിട്ടുണ്ട്.
