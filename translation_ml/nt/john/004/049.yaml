- from: 'രാജസേവകൻ അവനോട് പറഞ്ഞു: “കർത്താവേ[a], എന്റെ കുഞ്ഞ് മരിക്കുന്നതിനുമുമ്പ് ഇറങ്ങിവരണമേ.”'
  to: 'രാജകീയ ഉദ്യോഗസ്ഥൻ അവനോട് പറഞ്ഞു: “കർത്താവേ[a], എന്റെ കുഞ്ഞ് മരിക്കുന്നതിനുമുമ്പ് ഇറങ്ങിവരണമേ.”'
