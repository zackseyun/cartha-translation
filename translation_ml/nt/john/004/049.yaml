id: JHN.4.49
reference: John 4:49
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγει πρὸς αὐτὸν ὁ βασιλικός· Κύριε, κατάβηθι πρὶν ἀποθανεῖν τὸ παιδίον μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/049.yaml
  text: The royal official said to him[a], “Lord, come down before my child dies.”
translation:
  language: ml
  text: 'രാജകീയ ഉദ്യോഗസ്ഥൻ അവനോട് പറഞ്ഞു: “കർത്താവേ[a], എന്റെ കുഞ്ഞ് മരിക്കുന്നതിനുമുമ്പ് ഇറങ്ങിവരണമേ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അയ്യാ.” ഗ്രീക്കിലെ κύριε ആദരപൂർവമായ സംബോധനമായും “കർത്താവേ” എന്ന അർഥത്തിലും ഉപയോഗിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ βασιλικός
  choice: രാജസേവകൻ
  rationale: രാജാവിനോടോ രാജകൊട്ടാരത്തോടോ ഔദ്യോഗികമായി ബന്ധപ്പെട്ട വ്യക്തിയെയാണ് ഇവിടെ substantival ആയ βασιλικός സൂചിപ്പിക്കുന്നത്. ‘രാജസേവകൻ’ ഈ ബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുകയും ‘പ്രഭു’ പോലുള്ള സാമൂഹികപദവിയുടെ തെറ്റായ ധ്വനി ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: κύριε ആദരപൂർവമായ സംബോധനയായും ‘കർത്താവേ’ എന്ന കൂടുതൽ സമ്പന്നമായ അർഥത്തിലും വരാം. യോഹന്നാനിലെ പാളികളുള്ള അർഥസാധ്യത നിലനിർത്താൻ മുഖ്യപാഠത്തിൽ ‘കർത്താവേ’ ഉപയോഗിച്ചു; ‘അങ്ങേ’ എന്ന സന്ദർഭോചിതമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
- source_word: κατάβηθι
  choice: ഇറങ്ങിവരണമേ
  rationale: ആജ്ഞാരൂപം താഴോട്ടുള്ള യാത്രയെ സൂചിപ്പിക്കുന്നു. സംസാരിക്കുന്നവൻ യേശുവിനെ തന്റെ കുട്ടിയുള്ള സ്ഥലത്തേക്കു ക്ഷണിക്കുന്നതിനാൽ ‘ഇറങ്ങിവരണമേ’ ദിശയും ഭൂപ്രകൃതിസൂചനയും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: πρὶν ἀποθανεῖν
  choice: മരിക്കുന്നതിനുമുമ്പ്
  rationale: πρίν + infinitive മുൻകാലബന്ധം, ‘മരിക്കുന്നതിനുമുമ്പ്’, വ്യക്തമാക്കുന്നു. മലയാളത്തിൽ കുട്ടിയാണ് ക്രിയയുടെ കർത്താവെന്ന് വാക്യഘടനയിൽനിന്ന് സ്വാഭാവികമായി വ്യക്തമാകുന്നു.
- source_word: τὸ παιδίον μου
  choice: എന്റെ കുഞ്ഞ്
  rationale: παιδίον ഒരു കുട്ടിയെയോ ചെറിയ കുട്ടിയെയോ സൂചിപ്പിക്കുന്നു; ഈ വാക്യത്തിൽ ലിംഗം പ്രത്യേകം നിർണ്ണയിക്കാതെ സ്നേഹസാന്ദ്രവും സ്വാഭാവികവുമായ ‘എന്റെ കുഞ്ഞ്’ മൂലപദത്തിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: λέγει πρὸς αὐτόν
  choice: അവനോട് പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനകാലം മലയാളകഥനത്തിൽ സ്വാഭാവികമായ ഭൂതകാലമായി നൽകി; πρὸς αὐτόν എന്ന അഭിമുഖത ‘അവനോട്’ എന്നു നിലനിർത്തി.
theological_decisions:
- issue: യേശുവിനെ സംബോധന ചെയ്യുന്ന κύριε എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: കർത്താവേ
  alternative: അങ്ങേ
  rationale: ഉടൻചുറ്റുപാടിൽ ഇത് ആദരപൂർവമായ സാധാരണ സംബോധനയായിരിക്കാം; അതേസമയം യോഹന്നാന്റെ സുവിശേഷത്തിൽ ‘കർത്താവ്’ എന്ന കൂടുതൽ ആഴമുള്ള ധ്വനിയും സാധ്യമാണ്. മുഖ്യപാഠം ആ പാളിയുള്ള അർഥം നിലനിർത്തുന്നു; സംസാരിച്ചയാളുടെ ദൈവശാസ്ത്രബോധം അനാവശ്യമായി ഉറപ്പിക്കാതിരിക്കാൻ സാധാരണ ആദരസംബോധന അടിക്കുറിപ്പിൽ ചേർത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. അപേക്ഷയുടെ അടിയന്തരത നിലനിർത്താൻ ‘ഇറങ്ങിവരണമേ’ ഉപയോഗിച്ചു; കുട്ടിയുടെ ലിംഗം മൂലപാഠത്തെക്കാൾ അധികമായി നിർണ്ണയിച്ചിട്ടില്ല.
