id: JHN.4.43
reference: John 4:43
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Μετὰ δὲ τὰς δύο ἡμέρας ἐξῆλθεν ⸀ἐκεῖθεν εἰς τὴν Γαλιλαίαν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/043.yaml
  text: After the two days[a], he departed from there for Galilee.
translation:
  language: ml
  text: ആ രണ്ടു ദിവസങ്ങൾക്കുശേഷം[a] അദ്ദേഹം അവിടെനിന്ന് ഗലീലയിലേക്കു പുറപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “രണ്ടു ദിവസത്തിനുശേഷം.”
    reason: ഗ്രീക്കിലെ നിർദേശക ആർട്ടിക്കിൾ മുൻപ് പറഞ്ഞ രണ്ടു ദിവസത്തെ സൂചിപ്പിക്കുന്നതായി ‘ആ രണ്ടു ദിവസങ്ങൾ’ എന്നു വ്യക്തമാക്കാം; എന്നാൽ സ്വാഭാവിക മലയാളത്തിൽ നിർദേശകത്വം പ്രത്യേകം പ്രകടിപ്പിക്കാതെയും പരിഭാഷപ്പെടുത്താം.
lexical_decisions:
- source_word: Μετὰ δὲ τὰς δύο ἡμέρας
  choice: ആ രണ്ടു ദിവസങ്ങൾക്കുശേഷം
  rationale: μετά + accusative കാലക്രമത്തിൽ ‘ശേഷം’ എന്ന അർഥം നൽകുന്നു. നിർദേശക ഘടകമുള്ള τὰς δύο ἡμέρας മുൻവാക്യങ്ങളിൽ പറഞ്ഞ രണ്ടു ദിവസത്തെ താമസത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ആ രണ്ടു ദിവസങ്ങൾ’ എന്നു പരിഭാഷപ്പെടുത്തി. δέ ഇവിടെ നേരിയ ആഖ്യാനബന്ധകമായതിനാൽ മലയാളത്തിൽ പ്രത്യേകം പദമാക്കാതെ സ്വാഭാവികമായി വിട്ടിരിക്കുന്നു.
- source_word: ἐξῆλθεν
  choice: പുറപ്പെട്ടു
  rationale: ἐξέρχομαι എന്ന ക്രിയയുടെ aorist രൂപം അക്ഷരാർഥത്തിൽ ‘പുറത്തുപോയി’ എന്നാണ്. യാത്രാവിവരണത്തിൽ മുൻസ്ഥലത്തുനിന്നുള്ള പുറപ്പാട് സ്വാഭാവികമായി അറിയിക്കാൻ ‘പുറപ്പെട്ടു’ അനുയോജ്യം.
- source_word: ἐκεῖθεν
  choice: അവിടെനിന്ന്
  rationale: മുമ്പ് പരാമർശിച്ച സ്ഥലത്തുനിന്നുള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്ന സ്ഥലക്രിയാവിശേഷണം; ‘അവിടെനിന്ന്’ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: ഗലീലയിലേക്ക്
  rationale: εἰς ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ചലനം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ഗലീലയിലേക്ക്’ ഈ ദിശാബോധം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, ഗൗരവമുള്ള മലയാളം. ഗ്രീക്ക് ആഖ്യാനത്തിന്റെ സംക്ഷിപ്തതയും സ്ഥലചലനവും നിലനിർത്തി.
