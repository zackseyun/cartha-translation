id: JHN.4.19
reference: John 4:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ἡ γυνή· Κύριε, θεωρῶ ὅτι προφήτης εἶ σύ.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/019.yaml
  text: The woman said to him[a], “Lord, I see that you are a prophet.”
translation:
  language: ml
  text: 'ആ സ്ത്രീ അവനോടു പറഞ്ഞു: “കർത്താവേ[a], അങ്ങ് ഒരു പ്രവാചകനാണെന്ന് ഞാൻ മനസ്സിലാക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സാർ.” ഗ്രീക്കിലെ κύριε എന്നത് “കർത്താവേ” എന്നതിനുപുറമെ ആദരസൂചകമായ അഭിസംബോധനയായും ഉപയോഗിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിൽ ചരിത്രവർത്തമാനകാലമാണെങ്കിലും, ആധുനിക മലയാളത്തിലെ സ്വാഭാവികമായ ആഖ്യാനശൈലിക്ക് ഭൂതകാലരൂപം യോജിക്കുന്നു.
- source_word: αὐτῷ
  choice: അവനോടു
  rationale: സംസാരത്തിന്റെ പരോക്ഷ കർമം സൂചിപ്പിക്കുന്ന ദത്തിവ് സർവനാമത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: ἡ γυνή
  choice: ആ സ്ത്രീ
  rationale: സന്ദർഭത്തിൽ മുമ്പേ പരാമർശിക്കപ്പെട്ട ശമര്യസ്ത്രീയെയാണ് സൂചിപ്പിക്കുന്നത്; ഭാര്യ എന്ന അർഥമല്ല.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: κύριος എന്ന പദത്തിന്റെ അഭിസംബോധനാരൂപത്തിന് പദ്ധതിയുടെ പതിവ് പരിഭാഷ നിലനിർത്തുന്നു; ഇവിടെ ആദരസൂചകമായ ‘യജമാനനേ’ എന്ന അർഥവും സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: θεωρῶ
  choice: ഞാൻ മനസ്സിലാക്കുന്നു
  rationale: യേശു വെളിപ്പെടുത്തിയ അറിവിനെ അടിസ്ഥാനമാക്കിയുള്ള തിരിച്ചറിവാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; വെറും കാഴ്ചയേക്കാൾ ഗ്രഹിക്കൽ എന്ന ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὅτι
  choice: എന്ന്
  rationale: അവളുടെ തിരിച്ചറിവിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന മലയാളത്തിലെ സ്വാഭാവിക പൂരകബന്ധകം.
- source_word: προφήτης
  choice: ഒരു പ്രവാചകൻ
  rationale: നിർദേശക ഉപപദമില്ലാത്ത വിധേയനാമം; ‘ആ പ്രവാചകൻ’ എന്ന പ്രത്യേക തിരിച്ചറിയലല്ല, പ്രവാചകരിൽ ഒരാളെന്ന തിരിച്ചറിവാണ് ഇവിടെ പ്രകടമാകുന്നത്.
- source_word: σύ
  choice: അങ്ങ്
  rationale: ഗ്രീക്കിലെ വ്യക്തമായ സർവനാമത്തിന് തുല്യമായി, അഭിസംബോധനയുടെ ആദരഭാവം നിലനിർത്തുന്ന മലയാളരൂപം.
theological_decisions:
- issue: യേശുവിനോടുള്ള അഭിസംബോധനയായി κύριος
  choice: കർത്താവേ
  alternative: യജമാനനേ
  rationale: സന്ദർഭത്തിൽ ഇത് പൂർണമായ ക്രിസ്തുശാസ്ത്രപരമായ ഏറ്റുപറച്ചിലല്ലാതെ ആദരസൂചക അഭിസംബോധനയായിരിക്കാം. പ്രധാന പാഠത്തിൽ പതിവ് പരിഭാഷയായ ‘കർത്താവേ’ നിലനിർത്തുകയും യഥാർഥ അർഥവൈവിധ്യം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അങ്ങ്’ എന്നത് സ്ത്രീയുടെ ആദരപൂർവമായ അഭിസംബോധനയോടു പൊരുത്തപ്പെടുന്നു; ‘കർത്താവേ’ എന്ന പദത്തിലെ സന്ദർഭപരമായ അർഥവൈവിധ്യം അടിക്കുറിപ്പിലൂടെ നിലനിർത്തിയിരിക്കുന്നു.
