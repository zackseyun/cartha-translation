id: JHN.4.10
reference: John 4:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῇ· Εἰ ᾔδεις τὴν δωρεὰν τοῦ θεοῦ καὶ τίς ἐστιν ὁ λέγων σοι· Δός μοι πεῖν, σὺ ἂν ᾔτησας αὐτὸν καὶ ἔδωκεν ἄν σοι ὕδωρ ζῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/010.yaml
  text: Jesus answered and said to her[a], “If you knew the gift of God, and who it is who says to you, ‘Give me a drink,’ you would have asked him, and he would have given you living water.”
translation:
  language: ml
  text: 'യേശു അവളോടു മറുപടി പറഞ്ഞു: “ദൈവത്തിന്റെ ദാനവും, ‘എനിക്ക് കുടിക്കാൻ തരൂ’ എന്നു നിന്നോടു പറയുന്നവൻ ആരാണെന്നും നീ അറിഞ്ഞിരുന്നെങ്കിൽ, നീ അവനോടു ചോദിക്കുമായിരുന്നു; അവൻ നിനക്കു ജീവജലം[a] തരുമായിരുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഒഴുകുന്ന വെള്ളം” അല്ലെങ്കിൽ “ഉറവുവെള്ളം.” ഈ പ്രയോഗം സാധാരണയായി ഒഴുകുന്ന വെള്ളത്തെ സൂചിപ്പിക്കാം; എന്നാൽ ഇവിടെ യേശു ഉദ്ദേശിക്കുന്ന ഇരട്ട അർഥം “ജീവജലം” എന്ന പ്രയോഗം നിലനിർത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: മറുപടി പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ പതിവായ ഇരട്ട സംസാരസൂത്രത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ‘മറുപടി നൽകി പറഞ്ഞു’ എന്ന പദാനുപദ രൂപത്തിന്റെ അസ്വാഭാവികത ഒഴിവാക്കുന്നു.
- source_word: τὴν δωρεὰν τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ ദാനം
  rationale: δωρεά സൗജന്യമായി നൽകപ്പെടുന്ന ദാനത്തെ സൂചിപ്പിക്കുന്നു. ജനിറ്റീവിന്റെ ഉറവിടമോ ഉടമസ്ഥതയോ എന്ന സൂക്ഷ്മത അനാവശ്യമായി തീർപ്പാക്കാതെ ‘ദൈവത്തിന്റെ’ എന്നു നിലനിർത്തുന്നു.
- source_word: τίς ἐστιν ὁ λέγων σοι
  choice: നിന്നോടു പറയുന്നവൻ ആരെന്ന്
  rationale: പറയുന്ന വ്യക്തിയുടെ തിരിച്ചറിയലിനുള്ള ഗ്രീക്കിലെ ഊന്നൽ വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: Δός μοι πεῖν
  choice: എനിക്ക് കുടിക്കാൻ തരൂ
  rationale: ആജ്ഞയും കുടിക്കുക എന്ന ഇൻഫിനിറ്റീവും മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ഒരു വസ്തുനാമം ചേർക്കുന്നില്ല.
- source_word: ᾔτησας … ἔδωκεν ἄν
  choice: ചോദിക്കുമായിരുന്നു … തരുമായിരുന്നു
  rationale: സംഭവിക്കാതെ പോയ നിബന്ധനയും അതിന്റെ സാധ്യതാഫലവും മലയാളത്തിലെ ‘-മായിരുന്നു’ രൂപങ്ങൾകൊണ്ട് വ്യക്തമാക്കുന്നു.
- source_word: ὕδωρ ζῶν
  choice: ജീവജലം
  rationale: ഒഴുകുന്ന വെള്ളം എന്ന സാധാരണ അർഥത്തെയും യോഹന്നാന്റെ വിവരണത്തിലെ ആഴമുള്ള പ്രതീകാർഥത്തെയും ഒരുമിച്ച് നിലനിർത്തുന്ന പരമ്പരാഗതവും മനസ്സിലാകുന്നതുമായ പ്രയോഗമാണിത്.
theological_decisions:
- issue: ὕδωρ ζῶν എന്നതിന്റെ ഭൗതികവും പ്രതീകാത്മകവുമായ ഇരട്ട അർഥം
  choice: ജീവജലം
  alternative: ഒഴുകുന്ന വെള്ളം / ശുദ്ധജലം
  rationale: വെള്ളത്തിന്റെ ഭൗതിക അർഥത്തിൽ തെറ്റിദ്ധാരണയ്ക്ക് ഇടവരുത്തിക്കൊണ്ടുതന്നെ കൂടുതൽ ആഴമുള്ള യാഥാർഥ്യത്തിലേക്കു ചൂണ്ടുന്ന വാക്കുകളാണ് യേശു ഉപയോഗിക്കുന്നത്. ‘ജീവജലം’ ഈ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം തീർപ്പാക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ സംഭാഷണശൈലി സ്വീകരിച്ചു. ഗ്രീക്കിലെ സംസാരസൂത്രം മലയാളത്തിൽ സ്വാഭാവികമാക്കി; നിബന്ധനാവാക്യത്തിലെ സംഭവിക്കാതെ പോയ സാധ്യതയും ‘ജീവജലം’ എന്ന ഇരട്ട അർഥവും നിലനിർത്തി.
