    issue: അടിക്കുറിപ്പിൽ ‘ശുദ്ധജലം’ എന്ന പകരംവായന
    rationale: ὕδωρ ζῶν സാധാരണ ഉപയോഗത്തിൽ ഒഴുകുന്നതോ ഉറവിൽനിന്നുള്ളതോ ആയ വെള്ളത്തെ സൂചിപ്പിക്കാം. ‘ശുദ്ധജലം’ മലയാളത്തിൽ purified/pure water എന്ന അർഥത്തിലേക്ക് വഴുതാം; അതിനാൽ പദാർഥം കൃത്യമായി അറിയിക്കുന്നില്ല.
