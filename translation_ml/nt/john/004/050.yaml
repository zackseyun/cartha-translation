id: JHN.4.50
reference: John 4:50
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Πορεύου· ὁ υἱός σου ζῇ. ⸀ἐπίστευσεν ὁ ἄνθρωπος τῷ λόγῳ ⸀ὃν εἶπεν αὐτῷ ὁ Ἰησοῦς καὶ ἐπορεύετο.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/050.yaml
  text: Jesus said to him[a], “Go; your son lives.” The man believed the word that Jesus spoke to him and went on his way.
translation:
  language: ml
  text: 'യേശു അവനോട് പറഞ്ഞു: “പോകുക; നിന്റെ മകൻ ജീവിച്ചിരിക്കുന്നു.” യേശു തന്നോടു പറഞ്ഞ വാക്ക് ആ മനുഷ്യൻ വിശ്വസിച്ചു[a]; അവൻ യാത്രയായി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “യേശു തന്നോടു പറഞ്ഞ വാക്കിൽ ആശ്രയിച്ചു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πορεύου
  choice: പോകുക
  rationale: മടങ്ങിപ്പോകാനുള്ള നേരിട്ടുള്ള കല്പനയെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: ὁ υἱός σου
  choice: നിന്റെ മകൻ
  rationale: υἱός എന്നത് പൊതുവായ ‘കുട്ടി’ എന്നതിലുപരി വ്യക്തമായി ‘മകൻ’ എന്നാണ്.
- source_word: ζῇ
  choice: ജീവിച്ചിരിക്കുന്നു
  rationale: വർത്തമാനകാല പ്രസ്താവനയുടെ അർഥം നിലനിർത്തുകയും മകൻ ജീവനോടെയുണ്ടെന്ന ഉറപ്പ് സ്വാഭാവികമായി അറിയിക്കുകയും ചെയ്യുന്നു; ഭാവികാലമായ ‘ജീവിക്കും’ എന്ന് മാറ്റുന്നില്ല.
- source_word: ἐπίστευσεν
  choice: വിശ്വസിച്ചു
  rationale: πιστεύω എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥവും യേശുവിന്റെ വാക്കിനോടുള്ള മനുഷ്യന്റെ പ്രതികരണവും നിലനിർത്തുന്നു; ‘ആശ്രയിച്ചു’ എന്ന സാന്ദർഭിക സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ὁ ἄνθρωπος
  choice: ആ മനുഷ്യൻ
  rationale: മുൻസന്ദർഭത്തിലെ ‘രാജസേവകൻ’ എന്ന വിശേഷണം ഇവിടെ ഇറക്കുമതി ചെയ്യാതെ ഗ്രീക്കിലെ പൊതുവായ പദപ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: τῷ λόγῳ
  choice: വാക്ക്
  rationale: യേശു പറഞ്ഞ പ്രസ്താവനയെയാണ് λόγος ഇവിടെ സൂചിപ്പിക്കുന്നത്; തുടർന്നുള്ള ഉപവാക്യം അതിനെ വ്യക്തമാക്കുന്നു.
- source_word: ὃν εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: യേശു തന്നോടു പറഞ്ഞ
  rationale: ബന്ധവാക്യത്തെ സ്വാഭാവിക മലയാളക്രമത്തിൽ അവതരിപ്പിക്കുമ്പോഴും യേശുവാണ് പറഞ്ഞതെന്നും അത് ആ മനുഷ്യനോടായിരുന്നെന്നും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἐπορεύετο
  choice: അവൻ യാത്രയായി
  rationale: വിശ്വസിച്ചതിനു പിന്നാലെ അയാൾ പുറപ്പെട്ടു യാത്ര തുടർന്നുവെന്ന ആഖ്യാനചലനം സ്വാഭാവികമായി അറിയിക്കുന്നു; ഗ്രീക്ക് അപൂർണഭൂതകാലത്തിന് അമിതമായ ദൈർഘ്യാർഥം നൽകുന്നില്ല.
theological_decisions:
- issue: യേശുവിന്റെ വാഗ്ദത്തവചനത്തോടുള്ള പ്രതികരണത്തിൽ πιστεύω എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: വിശ്വസിച്ചു
  alternative: ആശ്രയിച്ചു
  rationale: ഈ വാക്യം മനുഷ്യന്റെ പ്രതികരണത്തെ വിവരിക്കുന്നുവെങ്കിലും അത് രക്ഷാകരമായ വിശ്വാസമാണോ വെറും ഉറപ്പോ എന്ന് നിർബന്ധമായി തീർപ്പാക്കുന്നില്ല. ‘വിശ്വസിച്ചു’ എന്നത് ഈ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ സംക്ഷിപ്തമായ കല്പനയും പ്രഖ്യാപനവും നിലനിർത്തി; മുൻസന്ദർഭത്തിൽ നിന്നുള്ള ഔദ്യോഗിക പദവി ഈ വാക്യത്തിലേക്ക് ചേർത്തിട്ടില്ല.
