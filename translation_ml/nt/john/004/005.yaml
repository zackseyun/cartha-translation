translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്ക് വാക്യത്തിലെ ഏകവാക്യഘടന മലയാളത്തിൽ വ്യക്തതയ്ക്കായി രണ്ട് വാക്യങ്ങളാക്കി; അർഥബന്ധം നിലനിർത്തി. വ്യക്തിസർവനാമമായി മാന്യരൂപമായ ‘അദ്ദേഹം’ ഉപയോഗിച്ചു.
