id: JHN.4.5
reference: John 4:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔρχεται οὖν εἰς πόλιν τῆς Σαμαρείας λεγομένην Συχὰρ πλησίον τοῦ χωρίου ὃ ἔδωκεν Ἰακὼβ ⸀τῷ Ἰωσὴφ τῷ υἱῷ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/005.yaml
  text: So he came to a town of Samaria called Sychar[b][a], near the piece of land that Jacob had given to Joseph his son.
translation:
  language: ml
  text: അങ്ങനെ അദ്ദേഹം സുഖാർ എന്നു വിളിക്കപ്പെടുന്ന ശമര്യയിലെ ഒരു പട്ടണത്തിൽ എത്തി.[a] അത് യാക്കോബ് തന്റെ മകനായ യോസേഫിനു കൊടുത്തിരുന്ന ഭൂമിയുടെ ഒരു ഭാഗത്തിനു സമീപമായിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ശമര്യയിലെ ഒരു നഗരം.” πόλις എന്ന ഗ്രീക്ക് പദം സന്ദർഭമനുസരിച്ച് പട്ടണത്തെയോ നഗരത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “വയൽ” അല്ലെങ്കിൽ “ഭൂസ്വത്ത്.” χωρίον എന്ന ഗ്രീക്ക് പദം വയൽ, ഭൂസ്വത്ത്, അല്ലെങ്കിൽ ഒരു ഭൂഭാഗം എന്നിവയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: എത്തി
  rationale: ആഖ്യാനത്തിലെ ചരിത്രവർത്തമാനകാലത്തെ സ്വാഭാവികമായ മലയാള ഭൂതകാലത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: οὖν
  choice: അങ്ങനെ
  rationale: മുൻസന്ദർഭത്തിൽനിന്നുള്ള ആഖ്യാനപുരോഗതിയും ബന്ധവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: πόλιν τῆς Σαμαρείας
  choice: ശമര്യയിലെ ഒരു പട്ടണം
  rationale: πόλις പട്ടണമോ നഗരമോ സൂചിപ്പിക്കാം; സ്ഥലത്തിന്റെ വലിപ്പം അനാവശ്യമായി നിർണയിക്കാതെ ‘പട്ടണം’ വായനാസൗകര്യം നൽകുന്നു. ബന്ധകവിഭക്തി മലയാളത്തിൽ സ്വാഭാവികമായി സ്ഥലസൂചകമായി വിവർത്തനം ചെയ്തു.
- source_word: λεγομένην Συχὰρ
  choice: സുഖാർ എന്നു വിളിക്കപ്പെടുന്ന
  rationale: നാമം തിരിച്ചറിയിക്കുന്ന ഗ്രീക്ക് കർമണി വർത്തമാനകൃദന്തത്തിന്റെ രൂപവും അർഥവും നിലനിർത്തുന്നു.
- source_word: πλησίον
  choice: സമീപം
  rationale: ലളിതമായ സ്ഥലസാമീപ്യം വ്യക്തമാക്കുന്നു.
- source_word: χωρίου
  choice: ഭൂമിയുടെ ഒരു ഭാഗം
  rationale: χωρίον വയൽ, ഭൂസ്വത്ത്, അല്ലെങ്കിൽ ഒരു ഭൂഭാഗം എന്നിവയെ സൂചിപ്പിക്കാം; കൃഷിഭൂമി മാത്രമാണെന്ന് നിർണയിക്കാതെ വിശാലമായ അർഥം നിലനിർത്തുന്നു.
- source_word: ὃ ἔδωκεν Ἰακὼβ
  choice: യാക്കോബ് ... കൊടുത്തിരുന്ന
  rationale: മുഖ്യ ആഖ്യാനസംഭവത്തിനു മുമ്പുള്ള പശ്ചാത്തലസംഭവം മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: τῷ Ἰωσὴφ τῷ υἱῷ αὐτοῦ
  choice: തന്റെ മകനായ യോസേഫിനു
  rationale: സ്വീകർത്താവിനെയും യോസേഫ് യാക്കോബിന്റെ മകനാണെന്ന സമാനാധികരണ തിരിച്ചറിയലിനെയും വ്യക്തമായി നിലനിർത്തുന്നു.
