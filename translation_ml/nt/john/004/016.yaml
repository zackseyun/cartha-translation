translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘പോകുക ... വിളിക്കുക ... വരിക’ എന്ന യാന്ത്രിക ക്രമത്തിനു പകരം മലയാളത്തിൽ സ്വാഭാവികമായ ക്രിയാശൃംഖല ഉപയോഗിച്ചെങ്കിലും ‘തിരികെ’ അല്ലെങ്കിൽ ‘കൂട്ടിക്കൊണ്ടുവരിക’ പോലുള്ള വ്യക്തമല്ലാത്ത ആശയങ്ങൾ ചേർത്തിട്ടില്ല.
