id: JHN.4.16
reference: John 4:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Λέγει ⸀αὐτῇ· Ὕπαγε φώνησον ⸂τὸν ἄνδρα σου⸃ καὶ ἐλθὲ ἐνθάδε.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/016.yaml
  text: He said to her[a], “Go, call your husband, and come here.”
translation:
  language: ml
  text: 'അവൻ അവളോടു പറഞ്ഞു[a]: “പോയി നിന്റെ ഭർത്താവിനെ വിളിച്ച് ഇവിടെ വരിക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൻ അവളോടു പറയുന്നു”—ഗ്രീക്കിൽ ഇവിടെ കഥനപരമായ വർത്തമാനകാലമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലിയിൽ അത് ഭൂതകാലമായി നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγει
  choice: പറഞ്ഞു
  rationale: കഥനത്തിൽ വർത്തമാനകാല ക്രിയാരൂപം ചരിത്രവർത്തമാനമായി ഉപയോഗിച്ചിരിക്കുന്നു. സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലിയിൽ ഭൂതകാലമായ ‘പറഞ്ഞു’ എന്നാണ് നൽകിയത്.
- source_word: αὐτῇ
  choice: അവളോടു
  rationale: സംസാരത്തിന്റെ പരോക്ഷ കർമം സൂചിപ്പിക്കുന്ന സ്ത്രീലിംഗ ഏകവചന ദാതിവ്; മലയാളത്തിൽ സ്വാഭാവികമായി ‘അവളോടു’.
- source_word: Ὕπαγε
  choice: പോയി
  rationale: തുടർന്നുള്ള പ്രവൃത്തി ചെയ്യുന്നതിനായി പോകാനുള്ള ആജ്ഞ. അടുത്ത ആജ്ഞയുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ ‘പോയി’ എന്ന് പരിഭാഷപ്പെടുത്തി.
- source_word: φώνησον
  choice: വിളിച്ചുകൊണ്ട്
  rationale: ഇവിടെ ഒരാളെ വിളിക്കുകയോ കൂട്ടിക്കൊണ്ടുവരാൻ വിളിക്കുകയോ ചെയ്യുക എന്ന അർഥം. ‘കൂട്ടിക്കൊണ്ടുവരിക’ എന്ന് വ്യക്തമായി ചേർക്കാതെ മൂലപാഠത്തിന്റെ പരിധി നിലനിർത്തുന്നു.
- source_word: τὸν ἄνδρα σου
  choice: നിന്റെ ഭർത്താവിനെ
  rationale: ἀνήρ എന്നതിന് ‘പുരുഷൻ’ എന്നും ‘ഭർത്താവ്’ എന്നും അർഥമുണ്ടാകാം; ഉടമസ്ഥസർവനാമവും തുടർന്നുള്ള സംഭാഷണസന്ദർഭവും ഇവിടെ ‘ഭർത്താവ്’ എന്ന അർഥം വ്യക്തമാക്കുന്നു.
- source_word: καὶ
  choice: —
  rationale: രണ്ട് ആജ്ഞകളെ ബന്ധിപ്പിക്കുന്ന καὶ മലയാളത്തിലെ ക്രിയാശൃംഖലയായ ‘വിളിച്ചുകൊണ്ട് ... വരിക’ എന്ന ഘടനയിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളിച്ചിരിക്കുന്നു.
- source_word: ἐλθὲ
  choice: വരിക
  rationale: നേരിട്ടുള്ള ആജ്ഞാരൂപം; ‘തിരികെ’ എന്ന ആശയം സന്ദർഭത്തിൽ സൂചിതമായേക്കാമെങ്കിലും ഗ്രീക്കിൽ പ്രകടമല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല.
- source_word: ἐνθάδε
  choice: ഇവിടെ
  rationale: സ്ഥലസൂചക ക്രിയാവിശേഷണം; ആധുനിക മലയാളത്തിലെ നേരിട്ടും സ്വാഭാവികവുമായ തുല്യപദം.
