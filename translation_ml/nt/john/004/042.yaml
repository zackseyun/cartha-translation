id: JHN.4.42
reference: John 4:42
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τῇ τε γυναικὶ ἔλεγον ὅτι Οὐκέτι διὰ τὴν σὴν λαλιὰν πιστεύομεν· αὐτοὶ γὰρ ἀκηκόαμεν, καὶ οἴδαμεν ὅτι οὗτός ἐστιν ἀληθῶς ὁ σωτὴρ τοῦ ⸀κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/042.yaml
  text: And they were saying to the woman[a], “We no longer believe because of your word, for we ourselves have heard[b], and we know that this one truly is the Savior of the world.”
translation:
  language: ml
  text: 'അവർ ആ സ്ത്രീയോട് പറഞ്ഞുകൊണ്ടിരുന്നു: “ഇനി നീ പറഞ്ഞതുകൊണ്ടുമാത്രമല്ല ഞങ്ങൾ വിശ്വസിക്കുന്നത്; ഞങ്ങൾതന്നെ കേട്ടിരിക്കുന്നു. ഇദ്ദേഹം യഥാർഥത്തിൽ ലോകത്തിന്റെ രക്ഷകനാണെന്ന് ഞങ്ങൾ അറിയുന്നു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῇ τε γυναικὶ ἔλεγον
  choice: അവർ ആ സ്ത്രീയോട് പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: ദാതൃവിഭക്തി അഭിസംബോധിതയെ സൂചിപ്പിക്കുന്നു; അപൂർണഭൂതകാലമായ ἔλεγον-ന്റെ തുടർച്ചയുള്ള ഭാവം ‘പറഞ്ഞുകൊണ്ടിരുന്നു’ നിലനിർത്തുന്നു. τε-യുടെ മൃദുവായ ബന്ധകബലം മലയാളത്തിൽ പ്രത്യേകമായി പ്രകടിപ്പിക്കേണ്ടതില്ല.
- source_word: Οὐκέτι διὰ τὴν σὴν λαλιὰν πιστεύομεν
  choice: ഇനി നിന്റെ വാക്ക് കേട്ടതുകൊണ്ടുമാത്രമല്ല ഞങ്ങൾ വിശ്വസിക്കുന്നത്
  rationale: Οὐκέτι മുൻകാലത്തെ ഒരു അടിസ്ഥാനത്തിന്റെ അവസാനത്തെ സൂചിപ്പിക്കുന്നു. λαλιά സ്ത്രീയുടെ വാചികസാക്ഷ്യത്തെയാണ് സൂചിപ്പിക്കുന്നത്. സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്ന വൈരുധ്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘മാത്രം’ ഉപയോഗിച്ചു; അവർ അവളുടെ സാക്ഷ്യം അവിശ്വസിക്കുന്നു എന്ന തെറ്റിദ്ധാരണയും ഇതിലൂടെ ഒഴിവാകുന്നു.
- source_word: αὐτοὶ γὰρ ἀκηκόαμεν
  choice: ഞങ്ങൾതന്നെ കേട്ടിരിക്കുന്നു
  rationale: αὐτοί നൽകുന്ന ഊന്നൽ ‘ഞങ്ങൾതന്നെ’ സൂക്ഷിക്കുന്നു. പൂർണകാലരൂപമായ ἀκηκόαμεν-ന്റെ ഇപ്പോഴത്തെ പ്രസക്തി ‘കേട്ടിരിക്കുന്നു’ വഴി നിലനിർത്തുന്നു.
- source_word: καὶ οἴδαμεν
  choice: ഞങ്ങൾ അറിയുന്നു
  rationale: οἶδα രൂപത്തിൽ പൂർണകാലമാണെങ്കിലും അർഥത്തിൽ ഇപ്പോഴത്തെ അറിവിനെ സൂചിപ്പിക്കുന്ന നിലാവസ്ഥാക്രിയയാണ്.
- source_word: οὗτός
  choice: ഇദ്ദേഹം
  rationale: യേശുവിനെ ചൂണ്ടിക്കാണിക്കുന്ന ഗ്രീക്ക് നിർദ്ദേശകസർവനാമത്തിന്റെ ഊന്നൽ, മാന്യവും സ്വാഭാവികവുമായ മലയാളത്തിൽ ‘ഇദ്ദേഹം’ പകരുന്നു.
- source_word: ἀληθῶς
  choice: യഥാർഥത്തിൽ
  rationale: പ്രസ്താവനയുടെ സത്യതയെ ഊന്നുന്ന ഗൗരവമുള്ള, ആധുനിക മലയാളപ്രയോഗം.
- source_word: ὁ σωτὴρ τοῦ κόσμου
  choice: ലോകത്തിന്റെ രക്ഷകൻ
  rationale: ക്രിസ്തുശാസ്ത്രപരമായ ഭാരമുള്ള σωτήρ-ന് പതിവായ ‘രക്ഷകൻ’ ഉപയോഗിക്കുന്നു; κόσμος-ന്റെ വിശാലതയെ കൂട്ടുകയോ ചുരുക്കുകയോ ചെയ്യാതെ ‘ലോകം’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: ശമര്യക്കാരുടെ ഏറ്റുപറച്ചിലിൽ ‘ലോകം’ എന്നതിന്റെ വ്യാപ്തി
  choice: ഇദ്ദേഹം യഥാർഥത്തിൽ ലോകത്തിന്റെ രക്ഷകനാണ്
  alternative: ഇദ്ദേഹം സകല മനുഷ്യരുടെയും രക്ഷകനാണ് / ലോകത്തിൽനിന്നുള്ള തിരഞ്ഞെടുക്കപ്പെട്ടവരുടെ രക്ഷകനാണ്
  rationale: മൂലപാഠം κόσμος എന്നു വിശാലമായി പറയുന്നു. അതിനെ ഒരു പ്രത്യേക കൂട്ടത്തിലേക്ക് ചുരുക്കുകയോ ‘സകല മനുഷ്യരും’ എന്ന വ്യാഖ്യാനവികാസം ചേർക്കുകയോ ചെയ്യാതെ പാഠത്തിലെ വ്യാപ്തിയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. നേരിട്ടുള്ള സംഭാഷണത്തിന്റെ വായനാസൗകര്യം നിലനിർത്തിയിട്ടുണ്ട്; ഈ വാക്യത്തിന് പ്രസിദ്ധീകരണാവശ്യമായ അടിക്കുറിപ്പുകൾ ചേർത്തിട്ടില്ല.
