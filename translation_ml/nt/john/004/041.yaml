lexical_decisions:
- source_word: πολλῷ πλείους
  choice: ഇനിയും വളരെപ്പേർ
  rationale: πολλῷ എന്ന ദത്തിവിഭക്തിരൂപം πλείους എന്ന താരതമ്യരൂപത്തെ ശക്തിപ്പെടുത്തുന്നു. ‘ഇനിയും വളരെപ്പേർ’ എന്നത് മുൻവാക്യത്തെക്കാൾ വിശ്വസിച്ചവരുടെ എണ്ണം വർധിച്ചതായി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐπίστευσαν
  choice: വിശ്വസിച്ചു
  rationale: πιστεύω എന്ന ക്രിയയുടെ ഏറിസ്റ്റ് സജീവ നിർദേശകരൂപത്തിന്റെ നേരിട്ടുള്ള പരിഭാഷയാണിത്. ‘വിശ്വാസത്തിലേക്കു വന്നു’ എന്നിങ്ങനെ ക്രിയയുടെ ആരംഭഭാവം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: διὰ
  choice: നിമിത്തം
  rationale: ദ്വിതീയാവിഭക്തിയിലുള്ള τὸν λόγον എന്നതിനോടുകൂടിയ διά ഇവിടെ കാരണമോ അടിസ്ഥാനമോ സൂചിപ്പിക്കുന്നു. ‘നിമിത്തം’ ഈ കാരണബന്ധം സംക്ഷിപ്തമായും ഗൗരവമുള്ള ഭാഷയിലും നിലനിർത്തുന്നു.
- source_word: λόγον
  choice: വചനം
  rationale: ഇവിടെ λόγος യേശു പറഞ്ഞ വാക്കിനെയോ സന്ദേശത്തെയോ സൂചിപ്പിക്കുന്നു. ‘വചനം’ യോഹന്നാന്റെ സുവിശേഷത്തിലെ പദപ്രതിധ്വനി നിലനിർത്തുന്നു; ‘സന്ദേശം’ എന്ന അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: αὐτοῦ
  choice: അവന്റെ
  rationale: സമീപസന്ദർഭത്തിൽ സർവനാമം യേശുവിനെ സൂചിപ്പിക്കുന്നു; ‘അവന്റെ’ എന്നത് അതിന്റെ നേരിട്ടുള്ള മലയാളസമാനമാണ്.
theological_decisions:
- issue: രക്ഷാസംബന്ധമായ ആഖ്യാനത്തിൽ πιστεύω പരിഭാഷപ്പെടുത്തുന്നത്
  choice: വിശ്വസിച്ചു
  alternative: അവനിൽ വിശ്വാസമർപ്പിച്ചു
  rationale: ഗ്രീക്കിൽ ഈ വാക്യത്തിൽ വിശ്വാസത്തിന്റെ കർമം പ്രത്യേകം പറഞ്ഞിട്ടില്ല. അതിനാൽ സന്ദർഭം യേശുവിനെ സൂചിപ്പിക്കാൻ അനുവദിക്കുമ്പോഴും, മൂലപാഠത്തിലില്ലാത്ത സമ്പൂർണ ദൈവശാസ്ത്രവാക്യം പരിഭാഷയിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ‘വചനം’ യോഹന്നാനിലെ പദപ്രതിധ്വനി നിലനിർത്തുന്നു; ‘നിമിത്തം’ കാരണബന്ധം വ്യക്തമായി നൽകുന്നു.
