  text: Ὡς οὖν ἔγνω ὁ ⸀Ἰησοῦς ὅτι ἤκουσαν οἱ Φαρισαῖοι ὅτι Ἰησοῦς πλείονας μαθητὰς ποιεῖ καὶ βαπτίζει ἢ Ἰωάννης—
base_translation:
  language: en
  yaml_path: translation/nt/john/004/001.yaml
  text: Therefore[a], when Jesus knew that the Pharisees had heard that Jesus was making and baptizing more disciples than John—
translation:
  language: ml
  text: അതിനാൽ, യേശു യോഹന്നാനെക്കാൾ[a] കൂടുതൽ ആളുകളെ ശിഷ്യരാക്കുകയും സ്നാനം കഴിപ്പിക്കുകയും ചെയ്യുന്നു എന്നു പരീശന്മാർ കേട്ടതായി യേശു അറിഞ്ഞപ്പോൾ—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യേശു യോഹന്നാനെക്കാൾ കൂടുതൽ ആളുകളെ ശിഷ്യരാക്കുകയും കൂടുതൽ സ്നാനം കഴിപ്പിക്കുകയും ചെയ്യുന്നു.’ ഗ്രീക്കിൽ ‘യോഹന്നാനെക്കാൾ’ എന്ന താരതമ്യം ‘കൂടുതൽ ആളുകളെ’ എന്നതോടു മാത്രമല്ല, ശിഷ്യരാക്കലും സ്നാനം കഴിപ്പിക്കലും ഉൾപ്പെടുന്ന സംയുക്തപ്രവർത്തനത്തോടും ബന്ധിപ്പിച്ചു വായിക്കാം.
    reason: lexical_alternative
