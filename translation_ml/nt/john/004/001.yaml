theological_decisions:
- issue: യേശു വ്യക്തിപരമായി സ്നാനം കഴിപ്പിച്ചു എന്ന തോന്നൽ ഉണ്ടാകാനുള്ള സാധ്യത
  choice: '4:1-ലെ ഉപരിതലവാചകം അതേപടി നിലനിർത്തി: യേശു ശിഷ്യന്മാരാക്കുകയും സ്നാനം കഴിപ്പിക്കുകയും ചെയ്യുന്നു.'
  alternative: 4:2-ലെ വിശദീകരണം മുൻകൂട്ടി ചേർത്ത്, യേശുവിന്റെ ശിഷ്യന്മാരാണ് സ്നാനം കഴിപ്പിച്ചതെന്ന് ഇവിടെത്തന്നെ പറയുക.
  rationale: അടുത്ത വാക്യം യേശു തന്നെയല്ല, അവന്റെ ശിഷ്യന്മാരാണ് സ്നാനം കഴിപ്പിച്ചതെന്ന് വ്യക്തമാക്കുന്നു. ആ വിശദീകരണം ഈ വാക്യത്തിലേക്ക് മുൻകൂട്ടി കൊണ്ടുവന്ന് ഉള്ളിലെ ആഖ്യാനപിരിമുറുക്കം ഇല്ലാതാക്കുന്നില്ല.
- issue: ‘യോഹന്നാനെക്കാൾ അധികം’ എന്ന താരതമ്യത്തിന്റെ വ്യാപ്തി
  choice: താരതമ്യം ‘ശിഷ്യന്മാരാക്കുകയും സ്നാനം കഴിപ്പിക്കുകയും’ എന്ന സംയുക്തപ്രവർത്തനത്തോടു സ്വാഭാവികമായി ബന്ധപ്പെടാവുന്ന ഘടന ഉപയോഗിച്ചു.
  alternative: ‘അധികം’ എന്നത് ശിഷ്യന്മാരുടെ എണ്ണത്തോടു മാത്രം കർശനമായി ബന്ധിപ്പിക്കുക.
  rationale: ഗ്രീക്ക് വാക്യഘടനയിൽ താരതമ്യത്തിന്റെ വ്യാപ്തിക്ക് ചെറിയൊരു ദ്വയാർഥസാധ്യതയുണ്ട്; മലയാളത്തിൽ അതിനെ അനാവശ്യമായി ഒറ്റ വായനയാക്കി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ ഗൗരവമുള്ള ആഖ്യാനശൈലി. ഗ്രീക്ക് വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനത്തിലെ ദീർഘരേഖ നിലനിർത്തി.
