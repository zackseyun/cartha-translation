  yaml_path: translation/nt/john/004/004.yaml
  text: He had to pass through Samaria[a].
translation:
  language: ml
  text: അവൻ ശമര്യയിലൂടെ കടന്നുപോകേണ്ടിയിരുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അവൻ ശമര്യയിലൂടെ പോകുന്നത് ആവശ്യമായിരുന്നു.” ഗ്രീക്ക് ആവശ്യകത വ്യക്തമാക്കുന്നുവെങ്കിലും അതിന്റെ കൃത്യമായ അടിസ്ഥാനം പറയുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδει
  choice: കടന്നുപോകേണ്ടിയിരുന്നു
  rationale: ഭൂതകാല ആഖ്യാനത്തിലെ ആവശ്യകതയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു; ആ ആവശ്യകതയുടെ കാരണം വ്യക്തമാക്കുന്നില്ല.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തില്ല
  rationale: ഇവിടെ ശക്തമായ വൈരുധ്യമല്ല, ലഘുവായ ആഖ്യാന പുരോഗതിയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ പ്രത്യേക ബന്ധകപദം ചേർക്കാതെ വാക്യം സ്വാഭാവികമാണ്.
- source_word: αὐτὸν
  choice: അവൻ
  rationale: ഗ്രീക്കിലെ infinitive construction-ൽ accusative ആയിരുന്നാലും, മലയാളത്തിലെ finite clause-ൽ സ്വാഭാവികമായി കർത്തൃരൂപം ഉപയോഗിക്കുന്നു.
- source_word: διέρχεσθαι
  choice: കടന്നുപോകുക
  rationale: ഒരു പ്രദേശത്തിലൂടെ സഞ്ചരിക്കുക എന്ന ഭൂമിശാസ്ത്രപരമായ അർഥം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: διὰ τῆς Σαμαρείας
  choice: ശമര്യയിലൂടെ
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന ഒരു സ്ഥലത്തിലൂടെയുള്ള സഞ്ചാരം വ്യക്തമായി നൽകുന്നു; ‘പ്രദേശം’ എന്നു ചേർക്കേണ്ടതില്ല.
theological_decisions:
- issue: ἔδει എന്നതിലെ ആവശ്യകതയുടെ സ്വഭാവം
  choice: യഥാർഥ ആവശ്യകതയായി പ്രകടിപ്പിച്ചെങ്കിലും അതിന്റെ അടിസ്ഥാനം വ്യക്തമാക്കിയില്ല
  alternative: ഭൂമിശാസ്ത്രപരമായ സൗകര്യം മാത്രമെന്നോ ദൈവിക ദൗത്യത്തിന്റെ അനിവാര്യതയെന്നോ വ്യക്തമാക്കുക
  rationale: ഈ വാക്യത്തിലെ ഗ്രീക്ക് ആവശ്യകത പ്രസ്താവിക്കുന്നുവെങ്കിലും അതിന്റെ കൃത്യമായ കാരണം പറയുന്നില്ല; അതിനാൽ വ്യാഖ്യാനപരമായി തീർപ്പാക്കാതെ ഉള്ളിലുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ശമര്യ’ എന്ന പരിചിത ബൈബിൾ സ്ഥലനാമരൂപം നിലനിർത്തി; വാക്യത്തിന്റെ ആവശ്യകത വ്യാഖ്യാനിച്ച് പരിമിതപ്പെടുത്തിയിട്ടില്ല.
