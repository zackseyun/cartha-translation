id: JHN.4.47
reference: John 4:47
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὗτος ἀκούσας ὅτι Ἰησοῦς ἥκει ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν ἀπῆλθεν πρὸς αὐτὸν καὶ ⸀ἠρώτα ἵνα καταβῇ καὶ ἰάσηται αὐτοῦ τὸν υἱόν, ἤμελλεν γὰρ ἀποθνῄσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/047.yaml
  text: When this man heard that Jesus had come from Judea into Galilee[a], he went to him and asked him to come down and heal his son[b], for he was about to die.
translation:
  language: ml
  text: ഈ മനുഷ്യൻ യേശു യെഹൂദ്യയിൽനിന്ന് ഗലീലയിലേക്കു വന്നിരിക്കുന്നുവെന്ന് കേട്ടപ്പോൾ, യേശുവിന്റെ അടുക്കലേക്കു ചെന്ന്, യേശു താഴേക്കു വന്ന്[a] അയാളുടെ മകനെ സുഖപ്പെടുത്തണമെന്ന് അവനോട് അപേക്ഷിച്ചുകൊണ്ടിരുന്നു[b]. കാരണം, അയാളുടെ മകൻ മരിക്കാനിരിക്കുകയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘താഴേക്കു വന്ന്’ എന്നത് സ്ഥലങ്ങൾ തമ്മിലുള്ള ഉയരവ്യത്യാസത്തെ പ്രതിഫലിപ്പിക്കുന്നു; യേശു കാനായിൽനിന്ന് കഫർന്നഹൂമിലേക്കു താഴേക്കു പോകണമെന്നായിരുന്നു അപേക്ഷ.
    reason: cultural_note
  - marker: b
    text: അഥവാ ‘അപേക്ഷിച്ചു.’ ഗ്രീക്കിലെ അപൂർണ്ണഭൂതകാലം തുടരുന്നതോ ആവർത്തിക്കുന്നതോ ആയ അപേക്ഷയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: ഈ മനുഷ്യൻ
  rationale: മുൻവാക്യത്തിലെ രാജസേവകനെ വ്യക്തമായി സൂചിപ്പിക്കുകയും ഗ്രീക്കിലെ നിർദേശകസർവനാമത്തിന്റെ ഊന്നൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἀκούσας
  choice: കേട്ടപ്പോൾ
  rationale: പ്രധാനക്രിയയോടുള്ള കാലബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്ന വിധത്തിൽ എയോറിസ്റ്റ് പാർട്ടിസിപ്പിളിനെ കാലസൂചക ഉപവാക്യമായി പരിഭാഷപ്പെടുത്തി.
- source_word: ἥκει
  choice: വന്നിരിക്കുന്നുവെന്ന്
  rationale: വന്നതിന്റെ ഫലമായി ഇപ്പോൾ അവിടെ സന്നിഹിതനായിരിക്കുന്ന അവസ്ഥയെ ἥκω സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ഈ രൂപം വരവും അതിന്റെ നിലവിലുള്ള ഫലവും ഉൾക്കൊള്ളുന്നു.
- source_word: ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν
  choice: യെഹൂദ്യയിൽനിന്ന് ഗലീലയിലേക്ക്
  rationale: ἐκ സൂചിപ്പിക്കുന്ന പുറപ്പെടുന്ന സ്ഥലവും εἰς സൂചിപ്പിക്കുന്ന ലക്ഷ്യദിശയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἀπῆλθεν πρὸς αὐτόν
  choice: അവന്റെ അടുക്കൽ ചെന്ന്
  rationale: മറ്റൊരു സ്ഥലത്തുനിന്ന് യേശുവിന്റെ അടുക്കലേക്കുള്ള നീക്കം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ἠρώτα
  choice: അപേക്ഷിച്ചുകൊണ്ടിരുന്നു
  rationale: അപേക്ഷിക്കുക എന്ന അർഥം വികാരതീവ്രത അമിതമായി ചേർക്കാതെ നൽകുന്നു; അപൂർണ്ണഭൂതകാലരൂപത്തിന്റെ തുടരുന്ന സ്വഭാവവും പ്രകടമാക്കുന്നു.
- source_word: ἵνα καταβῇ
  choice: ഇറങ്ങിവന്ന്
  rationale: അപേക്ഷയെ മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുമ്പോഴും καταβαίνω എന്ന പദത്തിലെ താഴോട്ടുള്ള ഭൗമചലനം സംരക്ഷിക്കുന്നു.
- source_word: ἰάσηται
  choice: സുഖപ്പെടുത്തണമെന്ന്
  rationale: ശാരീരിക രോഗസൗഖ്യത്തെ വ്യക്തവും സാധാരണക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ഭാഷയിൽ അറിയിക്കുന്നു.
- source_word: αὐτοῦ τὸν υἱόν
  choice: തന്റെ മകനെ
  rationale: അപേക്ഷിക്കുന്ന മനുഷ്യന്റെ മകനെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് മലയാളത്തിലെ സ്വാഭാവിക പ്രത്യാവർത്തക ഉടമസ്ഥരൂപം വ്യക്തമാക്കുന്നു.
- source_word: ἤμελλεν γὰρ ἀποθνῄσκειν
  choice: കാരണം, അവന്റെ മകൻ മരിക്കാനിരിക്കുകയായിരുന്നു
  rationale: μέλλω കൂടിയുള്ള ക്രിയാരൂപം സൂചിപ്പിക്കുന്ന ആസന്നത നിലനിർത്തുകയും ആരാണ് മരിക്കാനിരുന്നതെന്നത് മലയാളത്തിൽ അവ്യക്തമാകാതിരിക്കാൻ ‘മകൻ’ ആവർത്തിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘മരിക്കാനിരിക്കുകയായിരുന്നു’ എന്നതിന്റെ കർത്താവ്
  choice: രാജസേവകന്റെ മകൻ
  alternative: യേശുവോ രാജസേവകനോ
  rationale: തൊട്ടുമുമ്പുള്ള ‘തന്റെ മകനെ’ എന്ന പരാമർശവും കഥാസന്ദർഭവും മകനെയാണ് കർത്താവായി നിർണയിക്കുന്നത്; ഇത് സാന്ദർഭികവും വ്യാകരണപരവുമായ തീരുമാനമാണ്.
- issue: ἠρώτα എന്ന അപൂർണ്ണഭൂതകാലത്തിന്റെ ഭാവം
  choice: അപേക്ഷിച്ചുകൊണ്ടിരുന്നു
  alternative: അപേക്ഷിച്ചു
  rationale: ഗ്രീക്ക് അപൂർണ്ണഭൂതകാലം തുടരുന്ന അഥവാ ആവർത്തിക്കുന്ന അപേക്ഷയെ സൂചിപ്പിക്കാൻ കഴിയും. പ്രധാനപാഠത്തിൽ ആ ഭാവം പ്രതിഫലിപ്പിച്ചെങ്കിലും, ലളിത ഭൂതകാലപരിഭാഷയും സാധ്യമാണെന്ന് അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘അപേക്ഷിച്ചുകൊണ്ടിരുന്നു’ എന്നത് ഗ്രീക്ക് ക്രിയയുടെ അപൂർണ്ണഭൂതകാലഭാവം പ്രകടമാക്കുന്നു; ‘മരിക്കാനിരിക്കുകയായിരുന്നു’ ആസന്നമരണത്തിന്റെ അടിയന്തരതയെ അതിരുകടക്കാതെ നൽകുന്നു. അടിക്കുറിപ്പുകളുടെ ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങൾക്കു പിന്നാലെ തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
