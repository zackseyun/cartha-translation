id: JHN.4.27
reference: John 4:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἐπὶ τούτῳ ἦλθαν οἱ μαθηταὶ αὐτοῦ, καὶ ⸀ἐθαύμαζον ὅτι μετὰ γυναικὸς ἐλάλει· οὐδεὶς μέντοι εἶπεν· Τί ζητεῖς; ἢ τί λαλεῖς μετ’ αὐτῆς;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/027.yaml
  text: And at this point his disciples came[a], and they were amazed that he was speaking with a woman. Yet no one said, “What are you seeking?” or[b], “Why are you speaking with her?”
translation:
  language: ml
  text: അപ്പോഴാണ് അവന്റെ ശിഷ്യന്മാർ വന്നത്. അവൻ ഒരു സ്ത്രീയോടു സംസാരിച്ചുകൊണ്ടിരിക്കുന്നത് കണ്ട് അവർ ആശ്ചര്യപ്പെട്ടു. എങ്കിലും, “നീ എന്താണ് അന്വേഷിക്കുന്നത്?”[a] എന്നോ, “നീ എന്തിനാണ് അവളോടു സംസാരിക്കുന്നത്?”[b] എന്നോ ആരും ചോദിച്ചില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിനക്ക് എന്താണ് വേണ്ടത്?”
    reason: lexical_alternative
  - marker: b
    text: 'പദശഃ, “നീ അവളോടൊപ്പം എന്താണു സംസാരിക്കുന്നത്?” സന്ദർഭത്തിലെ അർഥം: “നീ എന്തിനാണ് അവളോടു സംസാരിക്കുന്നത്?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τούτῳ
  choice: അപ്പോൾത്തന്നെ
  rationale: സ്ഥലസൂചനയല്ല, ആ നിമിഷത്തിലെ സംഭവക്രമം സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. ‘അപ്പോൾത്തന്നെ’ ആഖ്യാനത്തിലെ സമയബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἐθαύμαζον
  choice: അവർ ആശ്ചര്യപ്പെട്ടു
  rationale: അപൂർണ്ണഭൂതകാലരൂപം ശിഷ്യന്മാരുടെ തുടർന്നുനിന്ന പ്രതികരണത്തെ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രയോഗമാണിത്.
- source_word: μετὰ γυναικὸς
  choice: ഒരു സ്ത്രീയോടു
  rationale: നിർദേശകപദമില്ലാത്ത γυναικός ഇവിടെ അനിശ്ചിതമായ ‘ഒരു സ്ത്രീ’ എന്നാണ്. സന്ദർഭം ഭാര്യയെയല്ല, സമര്യക്കാരിയായ സ്ത്രീയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἐλάλει
  choice: സംസാരിച്ചുകൊണ്ടിരുന്നതിൽ
  rationale: അപൂർണ്ണഭൂതകാലം നടന്നുകൊണ്ടിരുന്ന സംഭാഷണത്തെ അവതരിപ്പിക്കുന്നു; തുടർന്നുള്ള λαλεῖς എന്ന ക്രിയയുമായുള്ള പദബന്ധവും ‘സംസാരിക്കുക’ നിലനിർത്തുന്നു.
- source_word: μέντοι
  choice: എങ്കിലും
  rationale: അവർ ആശ്ചര്യപ്പെട്ടിട്ടും ചോദ്യം തുറന്നു ചോദിച്ചില്ല എന്ന വിരുദ്ധഭാവം വ്യക്തമായി നൽകുന്നു.
- source_word: Τί ζητεῖς;
  choice: നീ എന്താണ് അന്വേഷിക്കുന്നത്?
  rationale: ζητέω എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘അന്വേഷിക്കുക’ നിലനിർത്തുന്നു. കർമം വ്യക്തമാക്കിയിട്ടില്ലാത്തതിനാൽ മൂലത്തിലെ തുറന്ന സ്വഭാവവും ചോദ്യം ആരോടാണെന്ന അവ്യക്തതയും മലയാളത്തിൽ നിലനിൽക്കുന്നു.
- source_word: τί λαλεῖς μετ’ αὐτῆς;
  choice: നീ എന്തിനാണ് അവളോടു സംസാരിക്കുന്നത്?
  rationale: പദശഃ ‘നീ അവളോടു എന്താണ് സംസാരിക്കുന്നത്?’ എന്നായാലും, μετά സഹിതമുള്ള ഈ സന്ദർഭത്തിൽ ചോദ്യത്തിന്റെ സ്വാഭാവിക ഉദ്ദേശ്യം കാരണം ചോദിക്കലാണ്. മലയാളത്തിൽ അർഥം വ്യക്തമാക്കുന്ന സ്വാഭാവിക രൂപം തെരഞ്ഞെടുത്തു.
theological_decisions:
- issue: യേശു ഒരു സ്ത്രീയോടു സംസാരിച്ചതിനെക്കുറിച്ചുള്ള സാമൂഹിക സൂചന
  choice: ശിഷ്യന്മാരുടെ ആശ്ചര്യം മാത്രം മുഖ്യപാഠത്തിൽ രേഖപ്പെടുത്തി; അതിന്റെ സാമൂഹികമോ വംശീയമോ ആയ കാരണം വിശദീകരിച്ചില്ല.
  alternative: യഹൂദ-സമര്യ ബന്ധമോ പുരുഷ-സ്ത്രീ സാമൂഹികനിയമങ്ങളോ വാക്യത്തിൽ തന്നെ ചേർത്ത് വിശദീകരിക്കുക.
  rationale: ഗ്രീക്ക് പാഠം അവർ ആശ്ചര്യപ്പെട്ടുവെന്നു മാത്രമാണ് പറയുന്നത്; കാരണം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ പാഠത്തിന്റെ സംയമനവും വ്യാഖ്യാനസാധ്യതയും നിലനിർത്തി.
- issue: ആദ്യ ചോദ്യം ആരോടാണ് ഉന്നയിക്കപ്പെടുന്നത്
  choice: മലയാളത്തിലെ ലിംഗഭേദമില്ലാത്ത ‘നീ’ ഉപയോഗിച്ച് മൂലപാഠത്തിലെ അവ്യക്തത നിലനിർത്തി.
  alternative: ‘നിനക്ക് അവനിൽനിന്ന് എന്താണ് വേണ്ടത്?’ എന്നിങ്ങനെ സ്ത്രീയെയോ, മറ്റൊരു വിപുലീകരണത്തിലൂടെ യേശുവിനെയോ വ്യക്തമായി ലക്ഷ്യമാക്കുക.
  rationale: ഗ്രീക്കിൽ അഭിസംബോധന ചെയ്യപ്പെടുന്ന വ്യക്തിയെ പേരോ സർവനാമമോ കൊണ്ട് വ്യക്തമാക്കുന്നില്ല. അതിനാൽ വിവർത്തനം ആ അവ്യക്തത പരിഹരിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘സംസാരിക്കുക’, ‘ആശ്ചര്യപ്പെടുക’ തുടങ്ങിയ സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്ന പദങ്ങൾ തെരഞ്ഞെടുത്തു; പഴഞ്ചൻ ശൈലിയും അനാവശ്യമായ സാമൂഹിക-മതപര വിശദീകരണവും ഒഴിവാക്കി.
