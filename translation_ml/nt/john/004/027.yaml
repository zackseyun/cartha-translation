revisions:
- from: അപ്പോൾത്തന്നെ അവന്റെ ശിഷ്യന്മാർ വന്നു. അവൻ ഒരു സ്ത്രീയോടു സംസാരിച്ചുകൊണ്ടിരുന്നതിൽ അവർ ആശ്ചര്യപ്പെട്ടു. എങ്കിലും, “നീ എന്താണ് അന്വേഷിക്കുന്നത്?”[a] എന്നോ, “നീ എന്തിനാണ് അവളോടു സംസാരിക്കുന്നത്?”[b] എന്നോ ആരും ചോദിച്ചില്ല.
  to: അപ്പോഴാണ് അവന്റെ ശിഷ്യന്മാർ വന്നത്. അവൻ ഒരു സ്ത്രീയോടു സംസാരിച്ചുകൊണ്ടിരിക്കുന്നത് കണ്ട് അവർ ആശ്ചര്യപ്പെട്ടു. എങ്കിലും, “നീ എന്താണ് അന്വേഷിക്കുന്നത്?”[a] എന്നോ, “നീ എന്തിനാണ് അവളോടു സംസാരിക്കുന്നത്?”[b] എന്നോ ആരും ചോദിച്ചില്ല.
  rationale: ചെറിയ ശൈലീപരവും അർഥസൂക്ഷ്മതയുമായി ബന്ധപ്പെട്ടതുമായ തിരുത്തലുകൾ മാത്രമാണ് ആവശ്യമായത്. പരിഷ്കാരം സമയസൂചനയിലെ അനാവശ്യമായ ‘ഉടൻ’ ഊന്നൽ ഒഴിവാക്കുകയും, നടന്നുകൊണ്ടിരുന്ന സംഭാഷണം കൂടുതൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും, രണ്ടാം അടിക്കുറിപ്പിന്റെ പദശഃ വായന മെച്ചപ്പെടുത്തുകയും ചെയ്യുന്നു. മൂലപാഠത്തിലെ ചോദ്യങ്ങളുടെ അഭിസംബോധന-അവ്യക്തതയും സാമൂഹികകാരണം വിശദീകരിക്കാതിരിക്കുന്ന സംയമനവും നിലനിർത്തിയിരിക്കുന്നു.
