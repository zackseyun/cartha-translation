source:
  edition: SBLGNT
  text: ἤδη δὲ αὐτοῦ καταβαίνοντος οἱ δοῦλοι αὐτοῦ ⸀ὑπήντησαν ⸀αὐτῷ λέγοντες ὅτι ὁ παῖς ⸀αὐτοῦ ζῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/051.yaml
  text: And while he was already going down[a], his servants met him, saying that his child was alive.
translation:
  language: ml
  text: അവൻ ഇതിനകം ഇറങ്ങിപ്പൊയ്ക്കൊണ്ടിരിക്കെ, അവന്റെ ദാസന്മാർ അവനെ എതിരേറ്റു; അവന്റെ കുട്ടി ജീവനോടെയുണ്ടെന്ന് അവർ പറഞ്ഞു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവന്റെ മകൻ.” ഗ്രീക്കിലെ παῖς (പൈസ്) എന്ന പദത്തിന് “കുട്ടി,” “ബാലൻ,” ചില സന്ദർഭങ്ങളിൽ “ദാസൻ” എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη
  choice: -ക്കൊണ്ടിരിക്കുമ്പോൾത്തന്നെ
  rationale: യാത്ര ഇതിനകം പുരോഗമിച്ചുകൊണ്ടിരിക്കെ കൂടിക്കാഴ്ച നടന്നുവെന്ന ഭാവം ‘തന്നെ’ സഹിതമുള്ള പ്രയോഗം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയില്ല
  rationale: ഇത് കഥ മുന്നോട്ടുകൊണ്ടുപോകുന്ന മൃദുവായ ബന്ധകമാണ്; മലയാളത്തിലെ വാക്യക്രമവും സന്ദർഭവും ആ ബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: καταβαίνοντος
  choice: ഇറങ്ങിപ്പൊയ്ക്കൊണ്ടിരിക്കുമ്പോൾ
  rationale: വർത്തമാന കൃദന്തരൂപത്തിന്റെ സമകാലികവും തുടരുന്നതുമായ പ്രവൃത്തി നിലനിർത്തുന്നു; കാനായിൽനിന്ന് കഫർന്നഹൂമിലേക്കുള്ള താഴോട്ടുള്ള യാത്രയും സൂചിപ്പിക്കുന്നു.
- source_word: δοῦλοι
  choice: ദാസന്മാർ
  rationale: വീട്ടധികാരിയുടെ കീഴിലുള്ള ആശ്രിതരുടെ സാമൂഹികസ്ഥാനം ‘ദാസന്മാർ’ വ്യക്തമായി സൂചിപ്പിക്കുന്നു; ഇവിടെ ആധുനിക തൊഴിൽബന്ധം മാത്രം സൂചിപ്പിക്കുന്ന ‘വേലക്കാർ’ എന്നതിനെക്കാൾ യോജ്യം.
- source_word: ὑπήντησαν αὐτῷ
  choice: അവനെ എതിരേറ്റുവന്ന്
  rationale: അവർ അവനെ കാണാൻ മുന്നോട്ടുവന്ന് കണ്ടുമുട്ടിയെന്ന ക്രിയയുടെ ദിശാഭാവം ലളിതമായ ‘കണ്ടു’ എന്നതിനെക്കാൾ നന്നായി നിലനിർത്തുന്നു.
- source_word: λέγοντες
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ അനുബന്ധ കൃദന്തക്രിയ മലയാളത്തിൽ സ്വാഭാവികമായ സമാപകക്രിയയായി നൽകുന്നു.
- source_word: παῖς
  choice: കുട്ടി
  rationale: പദത്തിന് കുട്ടി, ബാലൻ, മകൻ, ചില സന്ദർഭങ്ങളിൽ ദാസൻ എന്നീ അർഥസാധ്യതകളുണ്ട്; ഈ സന്ദർഭത്തിലെ കുടുംബബന്ധം നിലനിർത്തിക്കൊണ്ട് ലിംഗവും പ്രായവും അനാവശ്യമായി ചുരുക്കാത്ത പദമാണ് ‘കുട്ടി’.
- source_word: ζῇ
  choice: ജീവനോടെയുണ്ട്
  rationale: വർത്തമാനകാലത്തിലെ ‘ജീവിക്കുന്നു/ജീവനോടെയുണ്ട്’ എന്ന നേരിട്ടുള്ള വാർത്താഭാവം നിലനിർത്തുന്നു; ‘സുഖപ്പെട്ടു’ എന്ന അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: സൗഖ്യപ്രാപിച്ച വ്യക്തിയെ സൂചിപ്പിക്കുന്ന παῖς എന്ന പദത്തിന്റെ പരിധി
  choice: അവന്റെ കുട്ടി
  alternative: അവന്റെ മകൻ; അവന്റെ ദാസൻ
  rationale: യോഹന്നാൻ 4-ന്റെ വിശാലസന്ദർഭം മകനെയാണു സൂചിപ്പിക്കുന്നതെങ്കിലും ഈ വാക്യത്തിലെ παῖς അത്ര കൃത്യമായി പരിമിതമല്ല. ‘കുട്ടി’ കുടുംബബന്ധം സ്വാഭാവികമായി സൂചിപ്പിക്കുകയും മൂലപദത്തിന്റെ പരിധി അനാവശ്യമായി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു; പ്രധാന മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. യാത്രയുടെ താഴോട്ടുള്ള ദിശയും പ്രവൃത്തി നടന്നുകൊണ്ടിരുന്ന ഭാവവും നിലനിർത്തിയിരിക്കുന്നു. ‘ദാസന്മാർ’ എന്നത് പുരാതന വീട്ടാശ്രിതരുടെ സാമൂഹിക യാഥാർഥ്യം മൃദൂകരിക്കാതെ അറിയിക്കുന്നു.
