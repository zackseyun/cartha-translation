id: JHN.4.34
reference: John 4:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς ὁ Ἰησοῦς· Ἐμὸν βρῶμά ἐστιν ἵνα ⸀ποιήσω τὸ θέλημα τοῦ πέμψαντός με καὶ τελειώσω αὐτοῦ τὸ ἔργον.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/034.yaml
  text: Jesus said to them[b][a], “My food is to do the will of him who sent me and to complete his work.”
translation:
  language: ml
  text: 'യേശു അവരോടു പറഞ്ഞു: “എന്നെ അയച്ചവന്റെ[b] ഇഷ്ടം ചെയ്യുകയും അവന്റെ പ്രവൃത്തി പൂർത്തിയാക്കുകയും[a] ചെയ്യുന്നതാണ് എന്റെ ആഹാരം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവന്റെ പ്രവൃത്തി തീർക്കുക.”
    reason: lexical_alternative
  - marker: b
    text: “എന്നെ അയച്ചവൻ” എന്നത് സന്ദർഭത്തിൽ പിതാവിനെ സൂചിപ്പിക്കുന്നു; എന്നാൽ ഇവിടെ ഗ്രീക്ക് മൂലപാഠം ആ പദവി നേരിട്ട് ഉപയോഗിക്കുന്നില്ല.
    reason: cross_reference
lexical_decisions:
- source_word: βρῶμά
  choice: ആഹാരം
  rationale: ശിഷ്യന്മാർ യഥാർഥ ഭക്ഷണത്തെക്കുറിച്ച് സംസാരിക്കുന്ന സന്ദർഭത്തിലെ മൂർത്തമായ രൂപകം നിലനിർത്തുന്നു; ‘പോഷണം’ എന്ന വിശദീകരണാത്മക പദം ഒഴിവാക്കുന്നു.
- source_word: Ἐμὸν βρῶμά ἐστιν
  choice: എന്റെ ആഹാരം ... ചെയ്യുന്നതാണ്
  rationale: ഗ്രീക്കിലെ രൂപകം സ്വാഭാവികമായ മലയാള വാക്യക്രമത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἵνα ποιήσω
  choice: ചെയ്യുന്നതാണ്
  rationale: ἵναയും ഉപവിധിക്രിയയും ഇവിടെ ഉള്ളടക്കവും ലക്ഷ്യവും സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ക്രിയാനാമരൂപം സ്വാഭാവികമായി ആ അർഥം നൽകുന്നു.
- source_word: τὸ θέλημα
  choice: ഇഷ്ടം
  rationale: θέλημα എന്ന പദത്തിന്റെ ഉദ്ദേശ്യം/ഹിതം എന്ന അർഥം ലളിതവും ദൈവശാസ്ത്രപരമായി നിഷ്പക്ഷവുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: τοῦ πέμψαντός με
  choice: എന്നെ അയച്ചവന്റെ
  rationale: പദവിയോ പേരോ ചേർക്കാതെ ഗ്രീക്കിലെ നാമവൽക്കരിച്ച കൃതന്തത്തിന്റെ വ്യക്തിപരമായ പരാമർശം സംരക്ഷിക്കുന്നു.
- source_word: τελειώσω
  choice: പൂർത്തിയാക്കുക
  rationale: പ്രവൃത്തി അതിന്റെ ഉദ്ദേശിച്ച സമാപ്തിയിലെത്തിക്കുക എന്ന τελειόωയുടെ അർഥം നൽകുന്നു; ‘തീർക്കുക’ എന്നത് പാദക്കുറിപ്പിൽ പദാന്തരമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἔργον
  choice: പ്രവൃത്തി
  rationale: ഏല്പിക്കപ്പെട്ട ദൗത്യത്തെയും അതിന്റെ നിർവഹണത്തെയും സൂചിപ്പിക്കാൻ ἔργον എന്ന പദത്തിന് യോജിച്ച വിശാലമായ മലയാള പദമാണിത്.
- source_word: λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: യേശു അവരോടു പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനത്തെ സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലിയിൽ ഭൂതകാലമായി നൽകുന്നു.
theological_decisions:
- issue: ‘എന്നെ അയച്ചവൻ’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: വാക്യത്തിൽ ‘എന്നെ അയച്ചവൻ’ എന്ന പരോക്ഷപ്രയോഗം അതേപടി നിലനിർത്തി; സന്ദർഭപരമായി പിതാവിനെ സൂചിപ്പിക്കുന്നുവെന്ന് പാദക്കുറിപ്പിൽ അറിയിച്ചു.
  alternative: ‘എന്നെ അയച്ച പിതാവ്’ എന്ന് വാക്യത്തിൽ തന്നെ വ്യക്തമാക്കുക.
  rationale: യോഹന്നാന്റെ വിശാലസന്ദർഭം പിതാവിനെയാണ് സൂചിപ്പിക്കുന്നത്; എന്നാൽ ഈ വാക്യത്തിലെ ഗ്രീക്ക് മൂലപാഠം ‘പിതാവ്’ എന്ന പദവി പ്രസ്താവിക്കുന്നില്ല. അതിനാൽ വ്യാഖ്യാനം മുഖ്യവാചകത്തിലേക്ക് ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. മൂലപാഠത്തിലെ ‘ആഹാരം’ എന്ന രൂപകവും അയച്ചവനെക്കുറിച്ചുള്ള പരോക്ഷതയും നിലനിർത്തി; അനാവശ്യമായ സഭാപാരമ്പര്യ പദാവലി ഒഴിവാക്കി.
