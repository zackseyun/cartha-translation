source:
  edition: SBLGNT
  text: πέντε γὰρ ἄνδρας ἔσχες, καὶ νῦν ὃν ἔχεις οὐκ ἔστιν σου ἀνήρ· τοῦτο ἀληθὲς εἴρηκας.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/018.yaml
  text: For you have had five husbands[a], and the man you now have is not your husband; this you have said truly.
translation:
  language: ml
  text: കാരണം, നിനക്ക് അഞ്ചു ഭർത്താക്കന്മാർ ഉണ്ടായിരുന്നു[a]; ഇപ്പോൾ നിനക്കുള്ള പുരുഷൻ നിന്റെ ഭർത്താവല്ല. ഇത് നീ സത്യമായിട്ടാണ് പറഞ്ഞത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: ‘നിനക്കു അഞ്ചു പുരുഷന്മാർ ഉണ്ടായിരുന്നു; ഇപ്പോൾ നിനക്കുള്ളവൻ നിന്റെ ഭർത്താവല്ല.’ ഗ്രീക്കിലെ ἀνήρ എന്ന പദത്തിന് ‘പുരുഷൻ’ എന്നും ‘ഭർത്താവ്’ എന്നും അർഥമാകാം. രണ്ടാമത്തെ പ്രയോഗവും പദാനുപദമായി ‘നിന്റെ പുരുഷൻ’ എന്നു വായിക്കാവുന്നതാണ്; എന്നാൽ ഇവിടെ സന്ദർഭം ‘ഭർത്താവ്’ എന്ന അർഥത്തെയാണ് പിന്തുണയ്ക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πέντε
  choice: അഞ്ചു
  rationale: ἄνδρας എന്ന ബഹുവചനനാമത്തെ വിശേഷിപ്പിക്കുന്ന വ്യക്തമായ സംഖ്യാവാചകം.
- source_word: γὰρ
  choice: കാരണം
  rationale: സ്ത്രീ പറഞ്ഞത് സത്യമാണെന്ന യേശുവിന്റെ പ്രസ്താവനയ്ക്കുള്ള വിശദീകരണകാരണം ഇവിടെ γάρ നൽകുന്നു.
- source_word: ἄνδρας
  choice: ഭർത്താക്കന്മാർ
  rationale: ἀνήρ എന്ന പദത്തിന് ‘പുരുഷൻ’ എന്നും ‘ഭർത്താവ്’ എന്നും അർഥമുണ്ടെങ്കിലും, മുൻകാല വിവാഹബന്ധങ്ങളും ഇപ്പോഴുള്ള വിവാഹേതരബന്ധവും തമ്മിലുള്ള സന്ദർഭപരമായ വൈരുധ്യം ഇവിടെ ‘ഭർത്താക്കന്മാർ’ എന്ന അർഥത്തെ പിന്തുണയ്ക്കുന്നു.
- source_word: ἔσχες
  choice: ഉണ്ടായിട്ടുണ്ട്
  rationale: മുൻകാല അനുഭവത്തിന് ഇപ്പോഴത്തെ പ്രസക്തിയുണ്ടെന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: νῦν
  choice: ഇപ്പോൾ
  rationale: നിലവിലെ സാഹചര്യത്തെ സൂചിപ്പിക്കുന്ന ലളിതമായ കാലവാചകം.
- source_word: ὃν ἔχεις
  choice: നിനക്കുള്ള പുരുഷൻ
  rationale: ബന്ധപരമായ അർഥത്തിലുള്ള ἔχωയെ കഴിയുന്നത്ര അടുത്തും മലയാളത്തിൽ മനസ്സിലാകുന്ന വിധത്തിലും നൽകുന്നു; ‘കൂടെ കഴിയുന്ന’ എന്ന് ചേർത്ത് മൂലത്തിൽ വ്യക്തമല്ലാത്ത വിവരം ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: οὐκ ἔστιν σου ἀνήρ
  choice: നിന്റെ ഭർത്താവല്ല
  rationale: σου എന്ന ബന്ധസൂചക സർവനാമത്തോടുകൂടിയ ἀνήρ ഇവിടെ വിവാഹബന്ധത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: τοῦτο ἀληθὲς εἴρηκας
  choice: നീ പറഞ്ഞ ഈ കാര്യം സത്യമാണ്
  rationale: സ്ത്രീയുടെ തൊട്ടുമുമ്പത്തെ പ്രസ്താവനയിലേക്കുള്ള τοῦτοയുടെ സൂചന വ്യക്തമാക്കുകയും, perfect രൂപമായ εἴρηκαςന്റെ ഫലപ്രസക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: രണ്ട് സ്ഥാനങ്ങളിലുമുള്ള ἀνήρ എന്ന പദത്തിന്റെ അർഥം
  choice: ആദ്യത്തേത് ‘ഭർത്താക്കന്മാർ’ എന്നും രണ്ടാമത്തെ പദപ്രയോഗത്തിൽ ‘പുരുഷൻ’ എന്നും ‘ഭർത്താവ്’ എന്നും സന്ദർഭാനുസൃതമായി നൽകുക.
  alternative: രണ്ടിടത്തും കൂടുതൽ പദാനുപദമായി ‘പുരുഷന്മാർ/പുരുഷൻ’ എന്നു നൽകുക.
  rationale: വിവാഹചരിത്രവും ഇപ്പോഴത്തെ വിവാഹമല്ലാത്ത ബന്ധവും തമ്മിലുള്ള വൈരുധ്യമാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്. അതേസമയം പദത്തിന്റെ യഥാർഥ ദ്വയാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. മൂലത്തിലെ വിശദീകരണബന്ധം ‘കാരണം’ എന്നും, ἀνήρ എന്ന പദത്തിന്റെ സന്ദർഭാർഥവും യഥാർഥ ദ്വയാർഥവും മുഖ്യവാചകത്തിലും അടിക്കുറിപ്പിലും യഥാക്രമം സംരക്ഷിച്ചിട്ടുണ്ട്.
