id: JHN.4.44
reference: John 4:44
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: αὐτὸς ⸀γὰρ Ἰησοῦς ἐμαρτύρησεν ὅτι προφήτης ἐν τῇ ἰδίᾳ πατρίδι τιμὴν οὐκ ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/044.yaml
  text: For Jesus himself testified that a prophet has no honor in his own homeland[a].
translation:
  language: ml
  text: കാരണം, ഒരു പ്രവാചകന് സ്വന്തം നാട്ടിൽ ബഹുമാനമില്ലെന്ന് യേശു തന്നേ സാക്ഷ്യപ്പെടുത്തി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സ്വന്തം ദേശത്ത്’ അല്ലെങ്കിൽ ‘സ്വന്തം ജന്മപ്രദേശത്ത്.’ ഗ്രീക്ക് πατρίς എന്ന പദം ഒരാളുടെ സ്വദേശത്തെയോ ജന്മപ്രദേശത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: കാരണം
  rationale: ചുറ്റുമുള്ള വിവരണവുമായി ഈ വാക്യത്തെ ബന്ധിപ്പിക്കുന്ന വിശദീകരണസ്വഭാവമുള്ള പ്രയോഗം; മലയാളത്തിൽ ‘കാരണം’ ആ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: αὐτὸς ... Ἰησοῦς
  choice: യേശുതന്നെ
  rationale: αὐτός നൽകുന്ന ഊന്നൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നിലനിർത്തുന്നു.
- source_word: ἐμαρτύρησεν
  choice: സാക്ഷ്യപ്പെടുത്തിയിരുന്നു
  rationale: യോഹന്നാനിലെ സാക്ഷ്യഭാഷ നിലനിർത്തുകയും, സന്ദർഭത്തിലെ മുൻകാല പ്രസ്താവനയെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ὅτι
  choice: എന്ന്
  rationale: യേശുവിന്റെ സാക്ഷ്യത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള പൂരകപ്രയോഗം.
- source_word: προφήτης
  choice: ഒരു പ്രവാചകൻ
  rationale: നിശ്ചയാർഥക നിർദ്ദേശകമില്ലാത്ത ഏകവചനം പഴഞ്ചൊല്ലുസ്വഭാവമുള്ള പൊതുപ്രസ്താവനയായി അവതരിപ്പിക്കുന്നു.
- source_word: ἐν τῇ ἰδίᾳ πατρίδι
  choice: സ്വന്തം നാട്ടിൽ
  rationale: πατρίς സൂചിപ്പിക്കുന്ന ജന്മദേശം, സ്വദേശം, അല്ലെങ്കിൽ സ്വന്തം പ്രദേശം എന്ന അർഥവ്യാപ്തി ലളിതവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: τιμὴν οὐκ ἔχει
  choice: ബഹുമാനമില്ല
  rationale: τιμή എന്ന നാമപദത്തെ നിലനിർത്തിക്കൊണ്ട് ഗ്രീക്കിലെ ‘ബഹുമാനം ഇല്ല’ എന്ന ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി പകരുന്നു.
theological_decisions:
- issue: യോഹന്നാന്റെ വിവരണത്തിൽ ‘സ്വന്തം നാട്’ എന്നതിന്റെ ഭൂമിശാസ്ത്രപരമായ സൂചന
  choice: പഴഞ്ചൊല്ല് നേരിട്ട് വിവർത്തനം ചെയ്ത് ഭൂമിശാസ്ത്രപരമായ സൂചന നിർണയിക്കാതെ വിടുക
  alternative: യെഹൂദ്യ, ഗലീല, അല്ലെങ്കിൽ നസറെത്ത് എന്ന് പ്രത്യേകമായി വ്യക്തമാക്കുക
  rationale: വാക്യം തന്നെ സ്ഥലം വ്യക്തമായി നിർണയിക്കുന്നില്ല. അതിനാൽ വ്യാഖ്യാനപരമായ സംഘർഷം സംരക്ഷിച്ച് ഏതെങ്കിലും സമന്വയവായന മുഖ്യപാഠത്തിലേക്ക് കൊണ്ടുവരുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘യേശുതന്നെ’ എന്നത് മൂലത്തിലെ ഊന്നൽ നിലനിർത്തുന്നു; ‘സ്വന്തം നാട്’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായിരിക്കെ മൂലപദത്തിന്റെ ഭൂമിശാസ്ത്രപരമായ അനിശ്ചിതത്വവും സംരക്ഷിക്കുന്നു.
