language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ἡ γυνή· Οἶδα ὅτι Μεσσίας ἔρχεται, ὁ λεγόμενος χριστός· ὅταν ἔλθῃ ἐκεῖνος, ἀναγγελεῖ ἡμῖν ⸀ἅπαντα.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/025.yaml
  text: The woman said to him[a], “I know that Messiah is coming” (the one called Messiah). “When he comes, he will tell us all things.”
translation:
  language: ml
  text: 'സ്ത്രീ അവനോടു പറഞ്ഞു: “മശീഹാ വരുമെന്ന് എനിക്കറിയാം—ക്രിസ്തു എന്നു വിളിക്കപ്പെടുന്നവൻ[a]. അവൻ വരുമ്പോൾ, എല്ലാം ഞങ്ങൾക്ക് അറിയിച്ചുതരും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “മശീഹാ” എന്ന സെമിറ്റിക് പദത്തെ യോഹന്നാൻ “ക്രിസ്തു” എന്ന ഗ്രീക്ക് പദംകൊണ്ട് വിശദീകരിക്കുന്നു; രണ്ടിന്റെയും അർഥം “അഭിഷിക്തൻ” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിൽ ചരിത്രവർത്തമാനകാലമാണെങ്കിലും, ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനശൈലിക്ക് ഭൂതകാലരൂപം യോജിക്കുന്നു.
- source_word: γυνή
  choice: സ്ത്രീ
  rationale: സന്ദർഭത്തിൽ ഇത് ശമര്യസ്ത്രീയെ സൂചിപ്പിക്കുന്നു; ‘സ്ത്രീ’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: Οἶδα
  choice: എനിക്കറിയാം
  rationale: അറിവിനെ നേരിട്ടും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്ന മലയാളപ്രയോഗം.
- source_word: Μεσσίας
  choice: മശീഹാ
  rationale: സെമിറ്റിക് പദത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം; യോഹന്നാൻ നിലനിർത്തുന്ന പദവിനാമത്തിന്റെ സാംസ്കാരിക പശ്ചാത്തലവും ഇതിലൂടെ നിലനിൽക്കുന്നു.
- source_word: ἔρχεται
  choice: വരുമെന്ന്
  rationale: ഇവിടെ വർത്തമാനകാലരൂപത്തിന് ഭാവിസൂചനയുണ്ട്; മലയാളത്തിലെ പരോക്ഷവാക്യത്തിൽ ‘വരുമെന്ന്’ സ്വാഭാവികമായി അതു നൽകുന്നു.
- source_word: ὁ λεγόμενος χριστός
  choice: ക്രിസ്തു എന്നു വിളിക്കപ്പെടുന്നവൻ
  rationale: Μεσσίας എന്ന സെമിറ്റിക് പദവിനാമത്തെ χριστός എന്ന ഗ്രീക്ക് പദവിനാമംകൊണ്ട് വിശദീകരിക്കുന്ന മൂലപാഠത്തിന്റെ ദ്വിഭാഷാ ഘടന നിലനിർത്തുന്നു.
- source_word: ὅταν ἔλθῃ ἐκεῖνος
  choice: അവൻ വരുമ്പോൾ
  rationale: ഭാവിയിലെ വരവിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളം; ἐκεῖνος സൂചിപ്പിക്കുന്ന വ്യക്തിയെ ‘അവൻ’ വ്യക്തമായി തിരിച്ചറിയിക്കുന്നു.
- source_word: ἀναγγελεῖ ἡμῖν ἅπαντα
  choice: എല്ലാം ഞങ്ങൾക്ക് അറിയിച്ചുതരും
  rationale: ἀναγγέλλω ഇവിടെ കാര്യങ്ങൾ വെളിപ്പെടുത്തി അറിയിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘അറിയിച്ചുതരും’ എന്നത് ദാതൃപ്രത്യയത്തോടൊപ്പം സ്വാഭാവികവും ἅπαντα എന്നതിന്റെ സമഗ്രത നിലനിർത്തുന്നതുമാണ്.
theological_decisions:
- issue: Μεσσίας, χριστός എന്നീ രണ്ടു പദവിനാമങ്ങളുടെ അവതരണം
  choice: പ്രധാന പ്രസ്താവനയിൽ ‘മശീഹാ’ എന്നും വിശദീകരണത്തിൽ ‘ക്രിസ്തു’ എന്നും നിലനിർത്തി.
  alternative: രണ്ടിടത്തും ‘മശീഹാ’ എന്നു നൽകി പദങ്ങൾ തമ്മിലുള്ള വ്യത്യാസം അടിക്കുറിപ്പിൽ മാത്രം സൂചിപ്പിക്കുക; അല്ലെങ്കിൽ χριστός എന്നത് ‘അഭിഷിക്തൻ’ എന്നു നേരിട്ട് വിവർത്തനം ചെയ്യുക.
  rationale: മൂലപാഠം സെമിറ്റിക് Μεσσίας എന്ന പദത്തെ ഗ്രീക്ക് χριστός കൊണ്ട് വിശദീകരിക്കുന്നു. രണ്ടു രൂപങ്ങളും നിലനിർത്തുന്നത് യോഹന്നാന്റെ വിശദീകരണഘടന സംരക്ഷിക്കുകയും അവ രണ്ടും ഒരേ പദവിനാമത്തെ സൂചിപ്പിക്കുന്നുവെന്ന് അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുകയും ചെയ്യുന്നു; വേറിട്ട ദൈവശാസ്ത്രപരമായ അർഥം ചുമത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അറിയിച്ചുതരും’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായിരിക്കെ പ്രഖ്യാപിച്ച് വെളിപ്പെടുത്തുക എന്ന ഗ്രീക്ക് ക്രിയയുടെ ആശയവും നിലനിർത്തുന്നു.
