  text: ἔλεγον οὖν οἱ μαθηταὶ πρὸς ἀλλήλους· Μή τις ἤνεγκεν αὐτῷ φαγεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/033.yaml
  text: So the disciples were saying to one another[a], “Has anyone brought him something to eat?”
translation:
  language: ml
  text: അപ്പോൾ ശിഷ്യന്മാർ പരസ്പരം പറഞ്ഞുകൊണ്ടിരുന്നു[a], “ആരും അദ്ദേഹത്തിന് കഴിക്കാൻ എന്തെങ്കിലും കൊണ്ടുവന്നിട്ടില്ലല്ലോ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആരെങ്കിലും അദ്ദേഹത്തിന് കഴിക്കാൻ എന്തെങ്കിലും കൊണ്ടുവന്നിട്ടുണ്ടാകുമോ?” μή ചേർന്ന ഗ്രീക്ക് ചോദ്യം സാധാരണയായി ‘ഇല്ല’ എന്ന ഉത്തരം പ്രതീക്ഷിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം സംഭാഷണം നടന്നുകൊണ്ടിരുന്നതിനെ സൂചിപ്പിക്കുന്നു; അതിനാൽ തുടർച്ചാഭാവം നിലനിർത്തുന്നു.
- source_word: οὖν
  choice: അപ്പോൾ
  rationale: മുൻസന്ദർഭത്തിൽനിന്നുള്ള ആഖ്യാനത്തുടർച്ചയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അടയാളപ്പെടുത്തുന്നു.
- source_word: οἱ μαθηταὶ
  choice: ശിഷ്യന്മാർ
  rationale: യോഹന്നാനിലെ μαθηταί എന്ന പദത്തിന്റെ പതിവും സന്ദർഭോചിതവുമായ മലയാള പരിഭാഷ.
- source_word: πρὸς ἀλλήλους
  choice: പരസ്പരം
  rationale: സംഘത്തിനുള്ളിലെ അന്യോന്യസംഭാഷണം ചുരുക്കമായും വ്യക്തമായും അറിയിക്കുന്നു.
- source_word: Μή τις
  choice: ആരെങ്കിലും ... കൊണ്ടുവന്നോ?
  rationale: μή ചേർന്ന ചോദ്യം നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്നുവെങ്കിലും മലയാളത്തിലെ സ്വാഭാവിക ചോദ്യരൂപം ഉപയോഗിച്ച് അടിസ്ഥാനചോദ്യം നിലനിർത്തുന്നു; പ്രതീക്ഷിക്കുന്ന നിഷേധഭാവം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἤνεγκεν
  choice: കൊണ്ടുവന്നോ
  rationale: ഇവിടെ ഭക്ഷണം യേശുവിന്റെ അടുക്കൽ കൊണ്ടുവരുന്നതാണ് അർഥം; സന്ദർഭത്തിൽ ഏറ്റവും സ്വാഭാവികമായ തുല്യപദം.
- source_word: αὐτῷ
  choice: അദ്ദേഹത്തിന്
  rationale: പരോക്ഷ കർമത്തിന്റെ ദാതൃഭാവം വ്യക്തമായി പ്രകടിപ്പിക്കുകയും യേശുവിനെ സൂചിപ്പിക്കുന്നതിന് മാന്യമായ ആധുനിക മലയാളരൂപം ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: φαγεῖν
  choice: ഭക്ഷിക്കാൻ എന്തെങ്കിലും
  rationale: പദശഃ ‘ഭക്ഷിക്കാൻ’ എന്ന അനന്തക്രിയാരൂപമാണ്; മലയാളവാക്യം പൂർത്തിയാക്കാൻ സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്ന വസ്തുവിനെ ‘എന്തെങ്കിലും’ എന്നു സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: μή ഉപയോഗിച്ച ചോദ്യത്തിന്റെ പ്രതീക്ഷിത ഉത്തരം
  choice: മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായ തുറന്ന ചോദ്യരൂപം; നിഷേധാത്മക ഉത്തരപ്രതീക്ഷ അടിക്കുറിപ്പിൽ
  alternative: “ആരും അദ്ദേഹത്തിന് ഭക്ഷിക്കാൻ ഒന്നും കൊണ്ടുവന്നിട്ടില്ലല്ലോ?”
  rationale: ഗ്രീക്ക് ചോദ്യം സാധാരണയായി ‘ഇല്ല’ എന്ന ഉത്തരം പ്രതീക്ഷിക്കുന്നു. എന്നാൽ അതിന്റെ ശക്തി അമിതമായി നിർണ്ണയിക്കാതെ മുഖ്യവാചകം സ്വാഭാവികമാക്കുകയും യഥാർഥ വ്യാകരണസൂചന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പറഞ്ഞുകൊണ്ടിരുന്നു’ എന്ന രൂപം ഗ്രീക്ക് അപൂർണ ഭൂതകാലത്തിന്റെ തുടർച്ചാഭാവം നിലനിർത്തുന്നു; ചോദ്യം സാധാരണ വായനക്കാർക്ക് സുതാര്യമായി നൽകി അതിലെ നിഷേധാത്മക ഉത്തരപ്രതീക്ഷ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
