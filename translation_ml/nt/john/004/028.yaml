source:
  edition: SBLGNT
  text: ἀφῆκεν οὖν τὴν ὑδρίαν αὐτῆς ἡ γυνὴ καὶ ἀπῆλθεν εἰς τὴν πόλιν καὶ λέγει τοῖς ἀνθρώποις·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/028.yaml
  text: So the woman left her water jar and went into the town and says to the people,
translation:
  language: ml
  text: 'അങ്ങനെ ആ സ്ത്രീ തന്റെ വെള്ളക്കുടം വിട്ട് പട്ടണത്തിലേക്കു പോയി പുരുഷന്മാരോടു പറയുന്നു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑδρία
  choice: വെള്ളപ്പാത്രം
  rationale: വെള്ളം കോരാനും കൊണ്ടുപോകാനും ഉപയോഗിച്ചിരുന്ന പാത്രത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു; പാത്രത്തിന്റെ വസ്തുവോ കൃത്യരൂപമോ മൂലപാഠം വ്യക്തമാക്കുന്നില്ല.
- source_word: ἀφῆκεν
  choice: അവിടെവെച്ചിട്ട്
  rationale: സന്ദർഭത്തിൽ പാത്രം കിണറിനരികിൽ വിട്ടുവെച്ചതെന്ന ആശയം നൽകുന്നു; ഉപേക്ഷിച്ചു എന്ന അതിശക്തമായ അർഥം ഒഴിവാക്കുന്നു.
- source_word: πόλιν
  choice: പട്ടണത്തിലേക്കു
  rationale: ഈ സന്ദർഭത്തിലെ വാസസ്ഥലത്തെ സൂചിപ്പിക്കാൻ സാധാരണവും യോജിച്ചതുമായ പദം.
- source_word: τοῖς ἀνθρώποις
  choice: ആളുകളോടു
  rationale: ലിംഗനിർണ്ണയം ചേർക്കാതെ പൊതുവായ മനുഷ്യസമൂഹത്തെ സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: λέγει
  choice: പറയുന്നു
  rationale: കഥനത്തിലെ ചരിത്രവർത്തമാനകാലം നിലനിർത്തി, മുൻകാല ക്രിയകളിൽനിന്നുള്ള ഉദ്ദേശ്യപൂർവമായ കാലമാറ്റം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: λέγει എന്ന ചരിത്രവർത്തമാനകാലത്തിന്റെ വിവർത്തനം
  choice: പറയുന്നു
  alternative: പറഞ്ഞു
  rationale: മൂലഗ്രീക്കിലെ ഭൂതകാല ക്രിയകൾക്കു പിന്നാലെയുള്ള വർത്തമാനകാലമാറ്റം മായ്ച്ചുകളയാതെ കഥനത്തിന്റെ സജീവതയും രൂപഭേദവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. വാക്യാവസാനത്തിലെ ദ്വിബിന്ദു അടുത്ത വാക്യത്തിൽ വരുന്ന നേരിട്ടുള്ള വാക്കുകളിലേക്കുള്ള സ്വാഭാവിക പ്രവേശനം നൽകുന്നു.
