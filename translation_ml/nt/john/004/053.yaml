  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔγνω οὖν ὁ πατὴρ ⸀ὅτι ἐκείνῃ τῇ ὥρᾳ ἐν ᾗ εἶπεν αὐτῷ ὁ ⸀Ἰησοῦς· Ὁ υἱός σου ζῇ, καὶ ἐπίστευσεν αὐτὸς καὶ ἡ οἰκία αὐτοῦ ὅλη.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/053.yaml
  text: So the father knew that it was at that hour when Jesus said to him[a], “Your son lives,” and he himself believed[b], and his whole household.
translation:
  language: ml
  text: അതിനാൽ, യേശു അവനോടു, “നിന്റെ മകൻ ജീവിച്ചിരിക്കുന്നു[a]” എന്നു പറഞ്ഞ അതേ മണിക്കൂറിലാണെന്ന് പിതാവ് മനസ്സിലാക്കി. അവനും അവന്റെ കുടുംബം മുഴുവനും വിശ്വസിച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നിന്റെ മകൻ ജീവനോടെയുണ്ട്.”
    reason: lexical_alternative
  - marker: b
    text: “വിശ്വസിച്ചു” എന്നത് യേശുവിന്റെ വാക്കു പ്രത്യേകമായി വിശ്വസിച്ചതിനെയോ യേശുവിലുള്ള കൂടുതൽ പൂർണമായ വിശ്വാസത്തിലേക്കു വന്നതിനെയോ സൂചിപ്പിക്കാം; ഗ്രീക്ക് ക്രിയ വിശ്വാസത്തിന്റെ വ്യാപ്തി വ്യക്തമാക്കുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔγνω
  choice: മനസ്സിലാക്കി
  rationale: ദാസന്മാർ അറിയിച്ച സമയവും യേശുവിന്റെ വാക്കും ഒന്നാണെന്ന് പിതാവ് തിരിച്ചറിഞ്ഞതിനെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: οὖν
  choice: അതിനാൽ
  rationale: മുൻവാക്യത്തിലെ ദാസന്മാരുടെ വിവരത്തിൽനിന്നുള്ള നിഗമനബന്ധം നിലനിർത്തുന്നു.
- source_word: ὁ πατὴρ
  choice: പിതാവ്
  rationale: ഗ്രീക്കിലെ കുടുംബബന്ധസൂചന നേരിട്ട് നിലനിർത്തുന്നു; ‘ഉദ്യോഗസ്ഥൻ’ എന്നു തിരിച്ചുമാറ്റുന്നില്ല.
- source_word: ἐκείνῃ τῇ ὥρᾳ ἐν ᾗ
  choice: അതേ സമയത്താണ്
  rationale: നിർദിഷ്ട സമയത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത അധിക ഊന്നൽ ചേർക്കുന്നില്ല.
- source_word: Ὁ υἱός σου ζῇ
  choice: നിന്റെ മകൻ ജീവിച്ചിരിക്കുന്നു
  rationale: ζῇ എന്ന വർത്തമാനകാല ക്രിയയെ ജീവൻ നിലനിൽക്കുന്ന ഇപ്പോഴത്തെ അവസ്ഥയായി അവതരിപ്പിക്കുന്നു.
- source_word: ἐπίστευσεν
  choice: വിശ്വസിച്ചു
  rationale: വിശ്വാസത്തിന്റെ കൃത്യമായ വ്യാപ്തി വ്യക്തമാക്കാതെ πιστεύωയുടെ സാധാരണ അർഥം നിലനിർത്തുന്നു.
- source_word: αὐτὸς
  choice: അയാളും
  rationale: പ്രകടമായ സർവനാമത്തിന്റെ ഊന്നൽ മലയാളത്തിൽ നിലനിർത്തുകയും തുടർന്ന് കുടുംബത്തെയും ഉൾപ്പെടുത്തുന്ന καίയുടെ ബന്ധം സ്വാഭാവികമാക്കുകയും ചെയ്യുന്നു.
- source_word: ἡ οἰκία αὐτοῦ ὅλη
  choice: അയാളുടെ കുടുംബം മുഴുവനും
  rationale: οἰκία ഇവിടെ കെട്ടിടമല്ല, വീട്ടിലുള്ളവരുടെ സമൂഹമാണെന്ന അർഥം വ്യക്തമാക്കുന്നു; ὅληയുടെ സമഗ്രതയും സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: പിതാവിന്റെ വിശ്വാസത്തിന്റെ വ്യാപ്തി
  choice: ‘വിശ്വസിച്ചു’ എന്ന് മാത്രം പറഞ്ഞ് വിശ്വാസത്തിന്റെ ലക്ഷ്യവും പൂർണതയും സന്ദർഭത്തിൽ പരോക്ഷമായി വിടുന്നു.
  alternative: യേശുവിന്റെ പ്രത്യേക വാക്ക് മാത്രം വിശ്വസിച്ചു; അല്ലെങ്കിൽ ഈ നിമിഷം യേശുവിൽ പൂർണമായ രക്ഷാവിശ്വാസത്തിലെത്തി.
  rationale: യോഹന്നാനിൽ πιστεύωയ്ക്ക് ദൈവശാസ്ത്രപരമായ ആഴമുണ്ടെങ്കിലും ഈ വാക്യം പിതാവിന്റെ വിശ്വാസത്തിന്റെ വ്യാപ്തി വ്യക്തമായി നിർവചിക്കുന്നില്ല; അതിനാൽ ആ അർഥവ്യാപ്തി വിവർത്തനം തീരുമാനിച്ചുറപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവും മാന്യവുമായ മലയാളം. ‘മണിക്കൂർ’ എന്ന അക്ഷരാർഥപ്രയോഗത്തേക്കാൾ സന്ദർഭത്തിലെ നിർദിഷ്ട സമയത്തെ സ്വാഭാവികമായി അറിയിക്കാൻ ‘സമയം’ ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
