source:
  edition: SBLGNT
  text: ὑμεῖς προσκυνεῖτε ὃ οὐκ οἴδατε, ἡμεῖς προσκυνοῦμεν ὃ οἴδαμεν, ὅτι ἡ σωτηρία ἐκ τῶν Ἰουδαίων ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/022.yaml
  text: You worship what you do not know; we worship what we know[a], because salvation is from the Jews.
translation:
  language: ml
  text: നിങ്ങൾ അറിയാത്തതിനെ ആരാധിക്കുന്നു; ഞങ്ങൾ അറിയുന്നതിനെ ആരാധിക്കുന്നു; കാരണം, രക്ഷ യഹൂദന്മാരിൽനിന്നാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘യഹൂദജനതയിൽനിന്ന്’. യോഹന്നാനിലെ ചില സന്ദർഭങ്ങളിൽ ഈ പദത്തിന് ‘യെഹൂദ്യർ’ എന്നർഥം യോജിച്ചേക്കാം; എന്നാൽ ഇവിടെ ശമര്യരുമായുള്ള ആരാധനയുടെയും രക്ഷാചരിത്രത്തിന്റെയും പശ്ചാത്തലത്തിൽ യഹൂദജനതയാണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκυνεῖτε / προσκυνοῦμεν
  choice: ആരാധിക്കുന്നു
  rationale: ഈ യോഹന്നാനീയ സന്ദർഭത്തിൽ ക്രിയ മതപരമായ ആരാധനയെ സൂചിപ്പിക്കുന്നു; കേവലം കുമ്പിടൽ അല്ലെങ്കിൽ ആദരാഞ്ജലി അർപ്പിക്കൽ എന്നതിലുപരി സ്വാഭാവികവും കൃത്യവുമായ മലയാളപ്രയോഗമാണിത്.
- source_word: ὃ
  choice: അതിനെ
  rationale: ഗ്രീക്കിലെ നപുംസകലിംഗ ആപേക്ഷിക സർവനാമത്തിന്റെ പൊതുവായ സൂചന നിലനിർത്തുന്നു; ‘ആരെയാണോ’ എന്നു വ്യക്തിവൽക്കരിച്ച് മൂലപാഠത്തേക്കാൾ അധികം നിർവചിക്കുന്നില്ല.
- source_word: οἴδατε / οἴδαμεν
  choice: അറിയാത്ത / അറിയുന്നതിനെ
  rationale: ആരാധനാവിഷയത്തെക്കുറിച്ചുള്ള അറിവിന്റെ മൂർച്ചയുള്ള വൈരുധ്യം നേരിട്ടും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: σωτηρία
  choice: രക്ഷ
  rationale: താൽക്കാലിക മോചനത്തേക്കാൾ വിശാലമായ ദൈവത്തിന്റെ രക്ഷാപ്രവൃത്തിയെ ഈ സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്ന പതിവും യോജിച്ചതുമായ മലയാളപദമാണ്.
- source_word: ἐκ
  choice: -യിൽനിന്നാണ്
  rationale: ഉറവിടമോ ഉത്ഭവമോ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് മുൻവാക്യത്തിന്റെ അർഥം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: τῶν Ἰουδαίων
  choice: യഹൂദജനത്തിൽനിന്ന്
  rationale: ഇവിടെ ശമര്യരുമായുള്ള ആരാധനാപരവും രക്ഷാചരിത്രപരവുമായ വൈരുധ്യമാണ് പ്രധാനം. അതിനാൽ ‘യെഹൂദ്യർ’ എന്ന പ്രദേശിക അർഥത്തേക്കാൾ യഹൂദജനതയെ സൂചിപ്പിക്കുന്ന പ്രയോഗം യോജിക്കുന്നു; സമൂഹത്തെ പൊതുവായി കുറ്റപ്പെടുത്തുന്ന ധ്വനിയും ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: ‘രക്ഷ യഹൂദജനത്തിൽനിന്നാണ്’ എന്നതിന്റെ അർഥം
  choice: ദൈവത്തിന്റെ രക്ഷാപ്രവൃത്തി ചരിത്രത്തിൽ യഹൂദജനത്തിലൂടെ വന്നുവെന്ന ഉറവിടസൂചനയായി വിവർത്തനം ചെയ്തു.
  alternative: മശിഹായുടെ യഹൂദവംശീയ ഉത്ഭവത്തെ മാത്രം സൂചിപ്പിക്കൽ; അല്ലെങ്കിൽ യഹൂദ വെളിപ്പാടിന്റെയും ആരാധനയുടെയും മുൻഗണനയെക്കുറിച്ചുള്ള കൂടുതൽ വിശാലമായ അവകാശവാദം.
  rationale: ἐκ ഉറവിടത്തെ സൂചിപ്പിക്കുന്നു. വാക്യം വംശീയ മേന്മ പ്രഖ്യാപിക്കുന്നതായി വിപുലീകരിക്കാതെയും, മശിഹായുടെ ഉത്ഭവത്തിലേക്ക് മാത്രം ചുരുക്കാതെയും, മൂലപാഠത്തിലെ രക്ഷാചരിത്രപരമായ വ്യാപ്തിയും പിരിമുറുക്കവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം ഗൗരവമുള്ളതുമായ മലയാളം. ആവർത്തനവും ‘അറിയുക/അറിയാതിരിക്കുക’ എന്ന മൂലപാഠത്തിലെ വൈരുധ്യവും സംരക്ഷിച്ചിട്ടുണ്ട്.
