source:
  edition: SBLGNT
  text: Τότε οὖν ἔλαβεν ὁ Πιλᾶτος τὸν Ἰησοῦν καὶ ἐμαστίγωσεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/001.yaml
  text: Then Pilate took Jesus and flogged him[a].
translation:
  language: ml
  text: അപ്പോൾ പീലാത്തോസ് യേശുവിനെ ഏറ്റെടുത്ത് ചമ്മട്ടികൊണ്ട് അടിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'പ്രതിനിധിമുഖേന ചെയ്യിച്ചതായി കൂടുതൽ വ്യക്തമാക്കിയും പരിഭാഷപ്പെടുത്താം: “അപ്പോൾ പീലാത്തോസ് യേശുവിനെ ഏറ്റെടുത്ത് ചമ്മട്ടികൊണ്ട് അടിപ്പിച്ചു.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Τότε
  choice: അപ്പോൾ
  rationale: കഥയിലെ അടുത്ത സംഭവത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സംക്ഷിപ്തവുമായ കാലസൂചകം.
- source_word: οὖν
  choice: പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: യുക്തിപരവും ആഖ്യാനപരവുമായ മുന്നേറ്റം ‘അപ്പോൾ’ എന്നതിലൂടെ മലയാള വാക്യപ്രവാഹത്തിൽ മതിയായവിധം ഉൾക്കൊള്ളുന്നു; രണ്ടും പ്രത്യേകം ചേർത്താൽ അസ്വാഭാവികമാകും.
- source_word: ἔλαβεν
  choice: കൊണ്ടുപോയി
  rationale: λαμβάνω എന്നതിന്റെ സന്ദർഭോചിതമായ അർഥം നൽകുന്നു. ‘പിടിച്ചെടുത്തു’ എന്നത് മൂലക്രിയയിൽ ഇല്ലാത്ത ബലപ്രയോഗം ശക്തമായി സൂചിപ്പിക്കും.
- source_word: ὁ Πιλᾶτος
  choice: പീലാത്തോസ്
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം; ഗ്രീക്കിലെ നിർദേശകപദം പ്രത്യേകം പ്രതിനിധീകരിക്കേണ്ടതില്ല.
- source_word: τὸν Ἰησοῦν
  choice: യേശുവിനെ
  rationale: വ്യക്തിനാമത്തിന്റെ നേരിട്ടുള്ള കർമരൂപം സ്വാഭാവിക മലയാളത്തിൽ നൽകിയിരിക്കുന്നു.
- source_word: ἐμαστίγωσεν
  choice: ചമ്മട്ടികൊണ്ട് അടിച്ചു
  rationale: μαστιγόω സൂചിപ്പിക്കുന്ന ചമ്മട്ടിയാലുള്ള കഠിനമായ പ്രഹരം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്ന ആധുനിക മലയാളപ്രയോഗം.
theological_decisions:
- issue: ἔλαβεν ... ἐμαστίγωσεν എന്നതിലെ പീലാത്തോസിന്റെ പ്രവർത്തകത്വവും റോമൻ നടപടിക്രമവും
  choice: രണ്ട് ക്രിയകളുടെയും വ്യാകരണകർത്താവായി പീലാത്തോസിനെ നിലനിർത്തി; അവൻ നേരിട്ട് അടിച്ചതാണോ അധികാരപ്പെടുത്തി അടിപ്പിച്ചതാണോ എന്ന് മുഖ്യപാഠത്തിൽ നിർണയിച്ചിട്ടില്ല.
  alternative: പീലാത്തോസ് യേശുവിനെ കൊണ്ടുപോയി ചമ്മട്ടികൊണ്ട് അടിപ്പിച്ചു.
  rationale: ഗ്രീക്ക് വാക്യത്തിൽ രണ്ടു ക്രിയകൾക്കും പീലാത്തോസ് തന്നെയാണ് കർത്താവ്. നേരിട്ടുള്ള പ്രവർത്തനമോ പ്രതിനിധിയിലൂടെയുള്ള പ്രവർത്തനമോ എന്ന് ചരിത്രപരമായ അനുമാനത്തിലൂടെ തീർപ്പാക്കാതെ മൂലപാഠത്തിന്റെ ഘടനയും അർഥതുറപ്പും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സ്വാഭാവികവും മാന്യവുമായ മലയാളം. ‘പ്രഹരിച്ചു’ പോലുള്ള ഔപചാരിക പദത്തിനുപകരം സാധാരണ വായനക്കാർക്ക് ഉടൻ മനസ്സിലാകുന്ന ‘ചമ്മട്ടികൊണ്ട് അടിച്ചു’ ഉപയോഗിച്ചു; പീലാത്തോസിന്റെ നേരിട്ടോ പ്രതിനിധിയിലൂടെയോ ഉള്ള പ്രവർത്തകത്വത്തിലെ മൂലപാഠപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പോടെ നിലനിർത്തി.
