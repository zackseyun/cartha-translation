id: JHN.19.27
reference: John 19:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶτα λέγει τῷ μαθητῇ· ⸀Ἴδε ἡ μήτηρ σου. καὶ ἀπ’ ἐκείνης τῆς ὥρας ἔλαβεν ὁ μαθητὴς αὐτὴν εἰς τὰ ἴδια.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/027.yaml
  text: Then he said to the disciple, “Look, your mother.” And from that hour the disciple took her into his own home.
translation:
  language: ml
  text: 'പിന്നെ അവൻ ആ ശിഷ്യനോടു പറഞ്ഞു: “ഇതാ, നിന്റെ അമ്മ.” ആ സമയംമുതൽ ആ ശിഷ്യൻ അവളെ തന്റെ വീട്ടിലേക്ക് കൂട്ടിക്കൊണ്ടുപോയി.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἴδε
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും പുതിയ ബന്ധത്തെ ചൂണ്ടിക്കാണിക്കുകയും ചെയ്യുന്ന ഗ്രീക്ക് ആജ്ഞാരൂപത്തിന്റെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാള സമാനപദം.
- source_word: ἀπ’ ἐκείνης τῆς ὥρας
  choice: ആ നാഴികമുതൽ
  rationale: ഇവിടെ ὥρα ഒരു കൃത്യമായ അറുപത് മിനിറ്റിനെക്കാൾ ആ സംഭവസമയത്തെ സൂചിപ്പിക്കുന്നു; ‘നാഴിക’ ബൈബിൾശൈലിയുടെ ഗൗരവം നിലനിർത്തുന്നു.
- source_word: ἔλαβεν
  choice: സ്വീകരിച്ചു
  rationale: വെറും കൂട്ടിക്കൊണ്ടുപോകൽ മാത്രമല്ല, മറിയയെ തന്റെ സംരക്ഷണത്തിലും ജീവിതക്രമത്തിലുമേക്ക് ഏറ്റെടുത്തതെന്ന സന്ദർഭാർഥം നൽകുന്നു.
- source_word: εἰς τὰ ἴδια
  choice: തന്റെ വീട്ടിൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘തനിക്കുള്ളവയിലേക്കു/സ്വന്തമായതിലേക്കു’ എന്ന വിശാല പ്രയോഗമാണെങ്കിലും, ഈ സന്ദർഭത്തിൽ ശിഷ്യന്റെ ഭവനത്തിലേക്കും ഗൃഹപരിപാലനത്തിലേക്കും സ്വീകരിച്ചതാണ് സ്വാഭാവിക മലയാളത്തിൽ ഉദ്ദേശിക്കുന്നത്.
theological_decisions:
- issue: യേശു ശിഷ്യനെയും മറിയയെയും പുതിയ കുടുംബബന്ധത്തിൽ ഏൽപ്പിക്കുന്നതിന്റെ വ്യാപ്തി
  choice: വാക്യം പറയുന്ന വ്യക്തിപരമായ അമ്മ–മകൻ ബന്ധം മാത്രം നേരിട്ട് വിവർത്തനം ചെയ്തു
  alternative: മറിയയുടെ സർവസഭാമാതൃത്വം പോലുള്ള വിപുലമായ സിദ്ധാന്താർഥം വിവർത്തനത്തിൽ വ്യക്തമാക്കുക
  rationale: ഗ്രീക്ക് പാഠം ഇവിടെ അത്തരം വിപുലമായ സിദ്ധാന്തനിഗമനം നേരിട്ട് പ്രസ്താവിക്കുന്നില്ല; അതിനാൽ വ്യാഖ്യാനപരമായ മതവിഭാഗീയ പ്രത്യേകത പാഠത്തിലേക്ക് ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. ‘ഇതാ’ മൂലപാഠത്തിലെ ശ്രദ്ധാകർഷണം സംരക്ഷിക്കുന്നു; ‘സ്വീകരിച്ചു’ എന്നത് അതിഥിസൽക്കാരത്തെക്കാൾ ദീർഘകാല ഗൃഹപരിപാലനത്തിന്റെ സന്ദർഭം സ്വാഭാവികമായി അറിയിക്കുന്നു.
