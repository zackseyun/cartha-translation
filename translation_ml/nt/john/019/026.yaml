id: JHN.19.26
reference: John 19:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἰησοῦς οὖν ἰδὼν τὴν μητέρα καὶ τὸν μαθητὴν παρεστῶτα ὃν ἠγάπα λέγει τῇ ⸀μητρί· Γύναι, ⸀ἴδε ὁ υἱός σου·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/026.yaml
  text: So when Jesus saw his mother and the disciple whom he loved standing there[a], he says to his mother, “Woman, behold, your son.”
translation:
  language: ml
  text: 'അപ്പോൾ യേശു തന്റെ അമ്മയെയും താൻ സ്നേഹിച്ച ശിഷ്യനെയും അരികിൽ നിൽക്കുന്നതായി കണ്ടപ്പോൾ അമ്മയോടു പറയുന്നു: “സ്ത്രീയേ[a], ഇതാ നിന്റെ മകൻ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിലെ ഈ സംബോധന ആദരവുള്ളതാണ്; ആധുനിക മലയാളത്തിൽ ‘സ്ത്രീയേ’ എന്നു കേൾക്കാവുന്ന പരുഷതയോ അവഹേളനമോ അതിന് ഇല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: അപ്പോൾ
  rationale: മുൻവിവരണത്തിൽനിന്നുള്ള ആഖ്യാനപുരോഗതിയും സന്ദർഭബന്ധവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു; ‘അതിനാൽ’ എന്നത് ഇവിടെ അനാവശ്യമായി യുക്തിനിഗമനഭാവം ശക്തമാക്കാം.
- source_word: ἰδὼν
  choice: കണ്ടപ്പോൾ
  rationale: അയോറിസ്റ്റ് കൃദന്തരൂപത്തിന്റെ കാലസംബന്ധമായ അർഥം സ്വാഭാവികമായി നൽകുകയും തുടർന്നുള്ള വാക്കിന്റെ സാഹചര്യത്തെ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: τὴν μητέρα
  choice: തന്റെ അമ്മയെ
  rationale: ഗ്രീക്കിൽ വ്യക്തമായ ഉടമസർവനാമമില്ലെങ്കിലും സന്ദർഭത്തിൽ ഇത് യേശുവിന്റെ അമ്മയാണെന്നത് മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: τὸν μαθητὴν
  choice: ശിഷ്യൻ
  rationale: നിർദിഷ്ടവും ഇതിനകം തിരിച്ചറിയാവുന്നതുമായ ശിഷ്യനെയാണ് സൂചിപ്പിക്കുന്നത്; അനുബന്ധ വിശേഷണവാക്യം ആ നിർദിഷ്ടത വ്യക്തമാക്കുന്നു.
- source_word: παρεστῶτα
  choice: അരികിൽ നിൽക്കുന്നതും
  rationale: അവിടെ സമീപത്തായി സന്നിഹിതനായി നിൽക്കുന്നതിന്റെ ദൃശ്യവും ഫലസ്ഥിതിയും പ്രകടമാക്കുന്നു; വ്യാകരണപരമായി ഇത് ശിഷ്യനോടാണ് ബന്ധിപ്പിച്ചിരിക്കുന്നത്.
- source_word: ὃν ἠγάπα
  choice: താൻ സ്നേഹിച്ച
  rationale: സ്നേഹിച്ചവൻ യേശുവാണെന്ന് മുഖ്യകർത്താവുമായുള്ള ബന്ധത്തിലൂടെ വ്യക്തമാക്കുന്നു; പേര് അനാവശ്യമായി ആവർത്തിക്കാതെ ഗ്രീക്കിന്റെ രൂപം നിലനിർത്തുന്നു.
- source_word: λέγει
  choice: പറയുന്നു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനകാലം നിലനിർത്തി യോഹന്നാന്റെ ആഖ്യാനത്തിന് സജീവത നൽകുന്നു.
- source_word: Γύναι
  choice: സ്ത്രീയേ
  rationale: നേരിട്ടുള്ള സംബോധന സംരക്ഷിക്കുന്നു. ഗ്രീക്കിൽ ഇത് ആദരവുള്ളതും അവഹേളനമല്ലാത്തതുമാണെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἴδε
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിച്ചുകൊണ്ടുള്ള ഗൗരവമുള്ള ചൂണ്ടിക്കാണിക്കൽ മലയാളത്തിൽ സ്വാഭാവികമായും സംക്ഷിപ്തമായും നൽകുന്നു.
- source_word: ὁ υἱός σου
  choice: നിന്റെ മകൻ
  rationale: ശിഷ്യനെ അമ്മയോടുള്ള പുത്രബന്ധത്തിൽ അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം നേരിട്ട് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: Γύναι എന്ന സംബോധനയുടെ ഭാവം
  choice: പ്രധാനവാചകത്തിൽ ‘സ്ത്രീയേ’ നിലനിർത്തി, അത് അവഹേളനമല്ലെന്ന് അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
  alternative: ‘പ്രിയ സ്ത്രീയേ’ അല്ലെങ്കിൽ ആദരസൂചകമായ മറ്റൊരു സ്വതന്ത്ര വിവർത്തനം
  rationale: മൂലപദത്തിന്റെ നേരിട്ടുള്ള രൂപവും യോഹന്നാനിലെ അതിന്റെ ആവർത്തിത ഉപയോഗവും സംരക്ഷിക്കുമ്പോൾ, ആധുനിക വായനക്കാരൻ അതിനെ പരുഷമായി തെറ്റിദ്ധരിക്കാതിരിക്കാൻ അടിക്കുറിപ്പ് സഹായിക്കുന്നു.
- issue: λέγει എന്ന ചരിത്രവർത്തമാനകാലം
  choice: ‘പറയുന്നു’ എന്ന് വർത്തമാനകാലത്തിൽ നൽകി.
  alternative: ‘പറഞ്ഞു’ എന്ന സാധാരണ ഭൂതകാല ആഖ്യാനം
  rationale: മൂലത്തിലെ ആഖ്യാനസജീവത സംരക്ഷിക്കുന്നു; മലയാളത്തിലും സന്ദർഭത്തിൽ ചരിത്രവർത്തമാനകാലം മനസ്സിലാക്കാവുന്നതാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ ചരിത്രവർത്തമാനകാലവും നേരിട്ടുള്ള സംബോധനയും നിലനിർത്തിയിട്ടുണ്ട്; അടിക്കുറിപ്പ് സാംസ്കാരികമായി ഉണ്ടാകാവുന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
