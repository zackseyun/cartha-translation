id: JHN.19.17
reference: John 19:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ βαστάζων ⸂αὑτῷ τὸν σταυρὸν⸃ ἐξῆλθεν εἰς ⸀τὸν λεγόμενον Κρανίου Τόπον, ⸀ὃ λέγεται Ἑβραϊστὶ Γολγοθα,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/017.yaml
  text: And carrying the cross by himself[a], he went out to the place called Skull Place, which in Hebrew is called Golgotha.
translation:
  language: ml
  text: സ്വന്തം കുരിശ് ചുമന്നുകൊണ്ട് അവൻ തലയോട്ടിയുടെ സ്ഥലം എന്നു വിളിക്കപ്പെടുന്ന സ്ഥലത്തേക്ക് പുറപ്പെട്ടു. അതിനെ എബ്രായ ഭാഷയിൽ[a] ഗൊൽഗൊഥാ എന്നു വിളിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ഒരുപക്ഷേ, ‘അരമായ ഭാഷയിൽ.’ യോഹന്നാൻ ഉപയോഗിക്കുന്ന ‘എബ്രായ ഭാഷയിൽ’ എന്ന പ്രയോഗം യെഹൂദ്യയിലെ പ്രാദേശിക സെമിറ്റിക് ഭാഷയെയും സൂചിപ്പിക്കാം.
    reason: Ἑβραϊστί എന്ന പദം പാഠത്തിൽ ‘എബ്രായ ഭാഷയിൽ’ എന്നാണ്; എന്നാൽ അത് പ്രാദേശിക സെമിറ്റിക് ഭാഷയായ അരമായഭാഷയെ സൂചിപ്പിക്കാനും സാധ്യതയുണ്ട്.
lexical_decisions:
- source_word: βαστάζων
  choice: ചുമന്നുകൊണ്ട്
  rationale: ശാരീരികമായി വഹിക്കുന്ന പ്രവൃത്തിയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: αὑτῷ τὸν σταυρόν
  choice: അവൻതന്നെ കുരിശ്
  rationale: പ്രത്യാവർത്തക സർവനാമത്തിന്റെ ഊന്നൽ നിലനിർത്തി, കുരിശ് അവൻതന്നെ ചുമന്നുവെന്ന അർഥം നൽകുന്നു; ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത ഉടമസ്ഥത അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: σταυρός
  choice: കുരിശ്
  rationale: പീഡാനുഭവസന്ദർഭത്തിലെ സ്ഥാപിതവും വ്യക്തവുമായ തുല്യപദം; ‘കുറുകെമരം’ എന്ന കൂടുതൽ ഇടുങ്ങിയ ചരിത്രപുനർനിർമാണം ഗ്രീക്ക് പദം നിർബന്ധിക്കുന്നില്ല.
- source_word: ἐξῆλθεν
  choice: പുറപ്പെട്ടു
  rationale: ‘പുറത്തേക്കു പോയി’ എന്ന ആശയം ഈ യാത്രാസന്ദർഭത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: τὸν λεγόμενον Κρανίου Τόπον
  choice: തലയോട്ടിസ്ഥലം എന്നു വിളിക്കപ്പെടുന്ന സ്ഥലം
  rationale: κρανίον, τόπος എന്നീ പദങ്ങളുടെ അർഥം നിലനിർത്തിക്കൊണ്ട് സ്ഥലനാമസൂത്രം മലയാളത്തിൽ വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: Ἑβραϊστί
  choice: എബ്രായഭാഷയിൽ
  rationale: ഗ്രീക്ക് പാഠത്തിലെ പ്രത്യക്ഷമായ ഭാഷാനാമം പ്രധാനപാഠത്തിൽ സംരക്ഷിക്കുന്നു; അരമായഭാഷയെ സൂചിപ്പിക്കാനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: Γολγοθα
  choice: ഗൊൽഗൊഥാ
  rationale: സെമിറ്റിക് സ്ഥലനാമത്തിന്റെ ഗ്രീക്ക് ലിപ്യന്തരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
theological_decisions:
- issue: Ἑβραϊστί എന്ന ഭാഷാസൂചനയുടെ വിവർത്തനം
  choice: എബ്രായഭാഷയിൽ
  alternative: അരമായഭാഷയിൽ
  rationale: മൂലപാഠം നേരിട്ട് ‘എബ്രായഭാഷയിൽ’ എന്നു പറയുന്നു. എന്നാൽ യോഹന്നാന്റെ പ്രയോഗം യെഹൂദ്യയിലെ പ്രാദേശിക സെമിറ്റിക് ഭാഷയായ അരമായഭാഷയെയും സൂചിപ്പിക്കാമെന്ന യഥാർഥ ഭാഷാശാസ്ത്രപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: αὑτῷ എന്നതിലെ പ്രത്യാവർത്തക ഊന്നൽ
  choice: അവൻതന്നെ കുരിശ് ചുമന്നുകൊണ്ട്
  alternative: സ്വന്തം കുരിശ് ചുമന്നുകൊണ്ട്
  rationale: വാചകം കുരിശ് ചുമന്നത് അവൻതന്നെയാണെന്ന ഊന്നൽ നൽകുന്നു. ‘സ്വന്തം’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് ഉടമസ്ഥതയെ മുൻനിർത്താൻ ഇടയുള്ളതിനാൽ, പ്രത്യാവർത്തക ഊന്നൽ നേരിട്ട് സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അവൻതന്നെ’ എന്ന രൂപം പ്രത്യാവർത്തക ഊന്നൽ വ്യക്തമാക്കുന്നു. പരമ്പരാഗതമായി പരിചിതമായ ‘കുരിശ്’, ‘ഗൊൽഗൊഥാ’ എന്നിവ നിലനിർത്തിയപ്പോൾ, Κρανίου Τόπον എന്നതിനെ സുതാര്യമായി ‘തലയോട്ടിസ്ഥലം’ എന്നു നൽകി.
