source:
  edition: SBLGNT
  text: τότε οὖν παρέδωκεν αὐτὸν αὐτοῖς ἵνα σταυρωθῇ. Παρέλαβον ⸀οὖν τὸν ⸀Ἰησοῦν·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/016.yaml
  text: Then he handed him over to them to be crucified[b][a]. So they took Jesus.
translation:
  language: ml
  text: അപ്പോൾ അവൻ അവനെ ക്രൂശിക്കപ്പെടേണ്ടതിന് അവർക്കു ഏൽപ്പിച്ചുകൊടുത്തു.[a] അങ്ങനെ അവർ യേശുവിനെ ഏറ്റെടുത്തു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു സ്വാഭാവിക പരിഭാഷ: ‘അപ്പോൾ അവനെ ക്രൂശിക്കാനായി അവൻ അവർക്കു ഏൽപ്പിച്ചുകൊടുത്തു.’ ഗ്രീക്കിലെ ഉദ്ദേശ്യവാക്യം മലയാളത്തിൽ ഇങ്ങനെ കൂടുതൽ സംക്ഷിപ്തമായും നൽകാം.'
    reason: lexical_alternative
  - marker: b
    text: ‘അവർക്കു’ എന്നും ‘അവർ’ എന്നും പറയുന്നത് ആരെയാണെന്ന് ഈ വാക്യം വ്യക്തമായി പേരെടുത്തു പറയുന്നില്ല; സമീപസന്ദർഭമാണ് അതിലേക്കു വഴികാട്ടുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε οὖν
  choice: അപ്പോൾ
  rationale: തുടർന്നുണ്ടായ സംഭവത്തെയും മുൻസന്ദർഭത്തിൽനിന്നുള്ള പരിണതിയെയും സ്വാഭാവികമായ മലയാളത്തിൽ ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു; രണ്ട് ബന്ധകപദങ്ങളും യാന്ത്രികമായി നിരത്തുന്നത് ഒഴിവാക്കുന്നു.
- source_word: παρέδωκεν
  choice: ഏൽപ്പിച്ചുകൊടുത്തു
  rationale: മറ്റൊരാളുടെ അധികാരത്തിലേക്കു കൈമാറുക എന്ന നീതിന്യായപരമായ ഭാവം നിലനിർത്തുന്ന സ്വാഭാവിക പ്രയോഗം.
- source_word: αὐτὸν
  choice: അവനെ
  rationale: യേശുവിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് സർവനാമം പേരാക്കി വികസിപ്പിക്കാതെ നിലനിർത്തുന്നു.
- source_word: αὐτοῖς
  choice: അവർക്കു
  rationale: സ്വീകർത്താക്കളെ വാക്യം പേരെടുത്തു പറയാത്തതിനാൽ പൊതുവായ ബഹുവചന സർവനാമം നിലനിർത്തുന്നു.
- source_word: ἵνα σταυρωθῇ
  choice: ക്രൂശിക്കേണ്ടതിന്
  rationale: ἵνα ഉദ്ദേശ്യത്തെ സൂചിപ്പിക്കുന്നതും σταυρωθῇ കർമണിപ്രയോഗമായിരിക്കുന്നതും മലയാളത്തിൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: Παρέλαβον
  choice: ഏറ്റെടുത്തു
  rationale: ഒരാളെ തങ്ങളുടെ ചുമതലയിലോ കാവലിലോ സ്വീകരിച്ചു കൊണ്ടുപോകുക എന്ന സന്ദർഭാർഥം അനാവശ്യ വിശദീകരണമില്ലാതെ നൽകുന്നു.
- source_word: οὖν
  choice: അങ്ങനെ
  rationale: മുൻപ്രവൃത്തിയുടെ തുടർച്ചയും ഫലമായി നടന്ന അടുത്ത നടപടിയും സൂചിപ്പിക്കുന്നു.
- source_word: Ἰησοῦν
  choice: യേശുവിനെ
  rationale: മലയാളത്തിൽ പതിവായ വ്യക്തിനാമരൂപം വിഭക്തിയോടെ ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: αὐτοῖς എന്നതും Παρέλαβον എന്ന ക്രിയയുടെ കർത്താവും ആരെ സൂചിപ്പിക്കുന്നു
  choice: പ്രധാനപാഠത്തിൽ ‘അവർക്ക്/അവർ’ എന്ന പൊതുവായ സർവനാമങ്ങൾ നിലനിർത്തുക
  alternative: മുഖ്യപുരോഹിതന്മാരും അവരുടെ ഉദ്യോഗസ്ഥരും എന്നോ റോമൻ പടയാളികൾ എന്നോ വ്യക്തമായി ചേർക്കുക
  rationale: ഈ വാക്യത്തിലെ ഗ്രീക്ക് പാഠം ആ കൂട്ടത്തെ പേരെടുത്തു പറയുന്നില്ല. ഒരു പ്രത്യേക കൂട്ടത്തെ ചേർക്കുന്നത് മൂലപാഠം തുറന്നുവെക്കുന്ന സൂചനയെ വ്യാഖ്യാനത്തിലൂടെ തീർപ്പാക്കും.
- issue: ἵνα σταυρωθῇ എന്ന ഉദ്ദേശ്യവാക്യത്തിന്റെ അവതരണം
  choice: ‘ക്രൂശിക്കേണ്ടതിന്’ എന്ന് ഉദ്ദേശ്യവും കർമണിഭാവവും നിലനിർത്തുക
  alternative: ‘ക്രൂശിക്കാനായി’ എന്ന് കൂടുതൽ സംഭാഷണസഹജമായി ചുരുക്കുക
  rationale: യേശു ക്രൂശിക്കൽ പ്രവൃത്തിക്ക് വിധേയനാകുന്നു എന്ന കർമണിഭാവവും കൈമാറ്റത്തിന്റെ ലക്ഷ്യവും വ്യക്തമായി സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. സർവനാമങ്ങളുടെ മൂലപാഠപരമായ അനിശ്ചിതത്വം നിലനിർത്തി; വിഭാഗീയമോ വ്യാഖ്യാനപരമോ ആയ തിരിച്ചറിയൽ പ്രധാനപാഠത്തിൽ ചേർത്തിട്ടില്ല.
