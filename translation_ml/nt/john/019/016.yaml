    issue: The main-text rendering ‘ക്രൂശിക്കേണ്ടതിന്’ does not explicitly retain the passive voice of σταυρωθῇ.
    rationale: The Greek says that he was handed over ‘in order that he might be crucified.’ ‘ക്രൂശിക്കപ്പെടേണ്ടതിന്’ makes Jesus the recipient of crucifixion and preserves the source's passive construction.
