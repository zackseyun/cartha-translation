  text: Pilate answered[a], “What I have written, I have written.”
translation:
  language: ml
  text: 'പീലാത്തോസ് മറുപടി പറഞ്ഞു: “ഞാൻ എഴുതിയത് എഴുതിയതുതന്നെ.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ എഴുതിയത് ഞാൻ എഴുതി.” ഗ്രീക്കിൽ ‘എഴുതുക’ എന്ന ക്രിയ രണ്ടുതവണ പൂർണകാലരൂപത്തിൽ വരുന്നു; പീലാത്തോസ് എഴുതിയത് മാറ്റമില്ലാതെ നിലനിൽക്കുമെന്ന ഉറച്ച അന്തിമത്വത്തിന് ഇത് ഊന്നൽ നൽകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: മറുപടി പറഞ്ഞു
  rationale: ἀποκρίνομαι എന്ന ക്രിയയുടെ ഭൂതകാലരൂപം സംഭാഷണസന്ദർഭത്തിൽ സ്വാഭാവികമായി ‘മറുപടി പറഞ്ഞു’ എന്നാണ് അർഥമാക്കുന്നത്.
- source_word: ὁ Πιλᾶτος
  choice: പീലാത്തോസ്
  rationale: ഗ്രീക്ക് ആഖ്യാനശൈലിയിലെ നിർദേശകപദം മലയാളത്തിൽ ആവശ്യമില്ല; പേരിന്റെ പ്രചാരത്തിലുള്ള മലയാളരൂപം ഉപയോഗിച്ചു.
- source_word: Ὃ
  choice: ഞാൻ എഴുതിയത്
  rationale: നാമവാചകമായി പ്രവർത്തിക്കുന്ന നപുംസകലിംഗ ഏകവചന ബന്ധസർവനാമം ‘എന്താണോ/അത്’ എന്ന ആശയം നൽകുന്നു; ക്രിയയോടുചേർന്ന ‘ഞാൻ എഴുതിയത്’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: γέγραφα
  choice: എഴുതിയത് എഴുതിയതുതന്നെ
  rationale: ഒരേ പൂർണകാലക്രിയയുടെ ആവർത്തനം നിലനിൽക്കുന്ന ഫലത്തെയും തീരുമാനത്തിന്റെ അന്തിമത്വത്തെയും ഊന്നുന്നു. മലയാളത്തിലെ ‘-തുതന്നെ’ ആ ഉറച്ച ആവർത്തനബലം സ്വാഭാവികമായി പകരുന്നു.
theological_decisions:
- issue: γέγραφα γέγραφα എന്ന ആവർത്തിച്ച പൂർണകാലരൂപത്തിന്റെ പ്രാബല്യം
  choice: “ഞാൻ എഴുതിയത് എഴുതിയതുതന്നെ” എന്ന് നൽകി ഉറച്ച അന്തിമത്വവും എഴുതിയ കാര്യം മാറ്റമില്ലാതെ നിലനിൽക്കുന്നതും സൂചിപ്പിക്കുക.
  alternative: “ഞാൻ എഴുതിയത് ഞാൻ എഴുതി.”
  rationale: ഗ്രീക്കിലെ ആവർത്തനം പീലാത്തോസിന്റെ തീരുമാനം മാറ്റില്ലെന്ന ഉറപ്പാണ് പ്രകടമാക്കുന്നത്. ‘എഴുതിയതുതന്നെ’ എന്ന രൂപം വ്യാഖ്യാനം അധികമായി ചേർക്കാതെ മലയാളത്തിൽ ആ പ്രാബല്യം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ സംക്ഷിപ്തതയും ഊന്നലും കഴിയുന്നത്ര നിലനിർത്തി.
