id: JHN.19.31
reference: John 19:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οἱ οὖν Ἰουδαῖοι, ⸂ἐπεὶ παρασκευὴ ἦν, ἵνα μὴ μείνῃ ἐπὶ τοῦ σταυροῦ τὰ σώματα ἐν τῷ σαββάτῳ⸃, ἦν γὰρ μεγάλη ἡ ἡμέρα ἐκείνου τοῦ σαββάτου, ἠρώτησαν τὸν Πιλᾶτον ἵνα κατεαγῶσιν αὐτῶν τὰ σκέλη καὶ ἀρθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/031.yaml
  text: Therefore the Jews[a], because it was the day of preparation[d][c][b], asked Pilate that the bodies might not remain on the cross on the Sabbath—for that Sabbath day was a great one—and that their legs might be broken and they might be taken away.
translation:
  language: ml
  text: അതുകൊണ്ട് യെഹൂദർ[a], അത് ഒരുക്കദിവസമായിരുന്നതിനാൽ, ശബ്ബത്തിൽ ശരീരങ്ങൾ ക്രൂശിൽ ശേഷിക്കാതിരിക്കേണ്ടതിന്—ആ ശബ്ബത്ത് മഹാദിവസമായിരുന്നതിനാൽ[b]—അവരുടെ കാലുകൾ ഒടിക്കപ്പെടുകയും ശരീരങ്ങൾ എടുത്തുമാറ്റപ്പെടുകയും ചെയ്യണമെന്ന് പീലാത്തോസിനോട് അപേക്ഷിച്ചു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: യോഹന്നാന്റെ സുവിശേഷത്തിൽ ‘യെഹൂദർ’ എന്ന പദം ചില സന്ദർഭങ്ങളിൽ കൂടുതൽ പ്രത്യേകമായി യെഹൂദ്യരെയോ യെഹൂദ അധികാരികളെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘ആ ശബ്ബത്തിന്റെ ദിവസം വലിയതായിരുന്നു’; അതായത്, പ്രത്യേക പ്രാധാന്യമുള്ള ഒരു ശബ്ബത്തായിരുന്നു.
    reason: lexical_alternative
  - marker: c
    text: ‘എടുത്തുമാറ്റപ്പെടുക’ എന്നതിന് ‘നീക്കപ്പെടുക’ എന്നോ, സന്ദർഭപരമായി ‘താഴെയിറക്കപ്പെടുക’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ οὖν Ἰουδαῖοι
  choice: അതുകൊണ്ട് യെഹൂദർ
  rationale: οὖν-ന്റെ നിഗമനാത്മക/തുടർച്ചാസൂചന ‘അതുകൊണ്ട്’ എന്നു നിലനിർത്തുന്നു. Ἰουδαῖοι എന്നത് യോഹന്നാനിൽ സന്ദർഭാനുസരിച്ച് വ്യത്യസ്ത പരിധികളിൽ ഉപയോഗിക്കപ്പെടുന്നതിനാൽ മുഖ്യപാഠത്തിൽ വ്യാഖ്യാനം ചുരുക്കാതെ ‘യെഹൂദർ’ എന്നു നൽകി; സാധ്യതയുള്ള കൂടുതൽ സങ്കുചിത അർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: ἐπεὶ παρασκευὴ ἦν
  choice: അത് ഒരുക്കനാളായിരുന്നതിനാൽ
  rationale: παρασκευή ശബ്ബത്തിന് മുമ്പുള്ള ഒരുക്കദിവസത്തെ സൂചിപ്പിക്കുന്നു. ‘ഒരുക്കനാൾ’ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: ἵνα μὴ μείνῃ ἐπὶ τοῦ σταυροῦ τὰ σώματα ἐν τῷ σαββάτῳ
  choice: ശബ്ബത്തിൽ ശരീരങ്ങൾ ക്രൂശിന്മേൽ കിടക്കാതിരിക്കേണ്ടതിന്
  rationale: ἵναയുടെ ഉദ്ദേശ്യഭാവം ‘-ാതിരിക്കേണ്ടതിന്’ എന്നു പ്രകടമാക്കുന്നു; μείνῃ ഇവിടെ ശരീരങ്ങൾ ക്രൂശിൽ തുടരുന്നതിനെ സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ‘കിടക്കുക’ എന്നു നൽകി.
- source_word: ἦν γὰρ μεγάλη ἡ ἡμέρα ἐκείνου τοῦ σαββάτου
  choice: ആ ശബ്ബത്തിന്റെ ദിവസം വിശേഷപ്രാധാന്യമുള്ളതായിരുന്നു
  rationale: μεγάληയുടെ അക്ഷരാർഥം ‘വലിയ’ എന്നാണെങ്കിലും ഒരു ദിവസത്തെക്കുറിച്ച് ഇവിടെ പ്രത്യേക മഹത്ത്വം/പ്രാധാന്യം സൂചിപ്പിക്കുന്നു. ‘വിശേഷപ്രാധാന്യമുള്ളത്’ അർഥം വ്യക്തമാക്കുന്നു; കൂടുതൽ അക്ഷരാർഥപരമായ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἠρώτησαν τὸν Πιλᾶτον
  choice: പീലാത്തോസിനോട് അപേക്ഷിച്ചു
  rationale: ἠρώτησαν ഇവിടെ അധികാരിയോടുള്ള അഭ്യർഥനയായതിനാൽ ‘അപേക്ഷിച്ചു’ എന്നത് സന്ദർഭോചിതവും സ്വാഭാവികവുമാണ്.
- source_word: ἵνα κατεαγῶσιν αὐτῶν τὰ σκέλη
  choice: അവരുടെ കാലുകൾ ഒടിച്ച്
  rationale: κατάγνυμι ശരീരാവയവം ഒടിക്കുന്നതിനെ നേരിട്ട് സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിലെ കർമണിഭാവം മലയാളത്തിലെ അഭ്യർഥനാഘടനയിൽ സ്വാഭാവികമായ സംയുക്തക്രിയയായി നൽകി.
- source_word: καὶ ἀρθῶσιν
  choice: അവരെ നീക്കിക്കളയണമെന്ന്
  rationale: αἴρωയ്ക്ക് ഉയർത്തുക, എടുത്തുമാറ്റുക, നീക്കുക എന്നീ അർഥങ്ങളുണ്ട്. ഇവിടെ ക്രൂശുകളിൽനിന്നുള്ള ശരീരനീക്കമാണ് സന്ദർഭം; എന്നാൽ ‘താഴെയിറക്കുക’ എന്നതിലേക്കു മാത്രം അർഥം ചുരുക്കാതെ ‘നീക്കിക്കളയുക’ എന്നു നൽകി.
theological_decisions:
- issue: Ἰουδαῖοι എന്നതിന്റെ സന്ദർഭപരമായ പരിധി
  choice: മുഖ്യപാഠത്തിൽ ‘യെഹൂദർ’
  alternative: ‘യെഹൂദ്യർ’ അല്ലെങ്കിൽ ‘യെഹൂദനേതാക്കൾ/അധികാരികൾ’
  rationale: യോഹന്നാനിൽ ഈ പദം ചില സന്ദർഭങ്ങളിൽ യെഹൂദ്യരെയോ അധികാരികളെയോ പ്രത്യേകമായി സൂചിപ്പിക്കാം. എന്നാൽ ഈ വാക്യം തന്നെ ‘നേതാക്കൾ’ എന്നു വ്യക്തമാക്കാത്തതിനാൽ മുഖ്യപാഠത്തിൽ വിശാലമായ രൂപം നിലനിർത്തി, സന്ദർഭപരമായ സാധ്യത അടിക്കുറിപ്പിൽ അറിയിച്ചു.
- issue: μεγάλη എന്ന പദം ശബ്ബത്തിനെക്കുറിച്ച് സൂചിപ്പിക്കുന്നത്
  choice: ‘വിശേഷപ്രാധാന്യമുള്ളതായിരുന്നു’
  alternative: ‘വലിയ ദിവസമായിരുന്നു’ അല്ലെങ്കിൽ ‘മഹാദിവസമായിരുന്നു’
  rationale: ഇവിടെ സാധാരണ വലിപ്പമല്ല, ആ ശബ്ബത്തിന്റെ പ്രത്യേക പ്രാധാന്യമാണ് ഉദ്ദേശ്യം. മലയാളത്തിൽ അർഥം സ്വാഭാവികമായി നൽകുമ്പോഴും അക്ഷരാർഥപരമായ രൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- issue: ἀρθῶσιν എന്നതിന്റെ പ്രവൃത്തിപരമായ അർഥം
  choice: ‘നീക്കിക്കളയുക’
  alternative: ‘താഴെയിറക്കുക’ അല്ലെങ്കിൽ ‘എടുത്തുമാറ്റുക’
  rationale: സന്ദർഭത്തിൽ ക്രൂശുകളിൽനിന്ന് ശരീരങ്ങൾ മാറ്റുന്നതാണ് ഉദ്ദേശ്യം. എന്നാൽ ക്രിയ സ്വതവേ താഴേക്കുള്ള ദിശ വ്യക്തമാക്കാത്തതിനാൽ മുഖ്യപാഠം വിശാലമായി നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘ഒരുക്കനാൾ’, ‘ശബ്ബത്ത്’, ‘ക്രൂശ്’ എന്നീ ബൈബിൾസന്ദർഭത്തിൽ പരിചിതമായ പദങ്ങൾ ഉപയോഗിച്ചു. ഗ്രീക്ക് വാക്യത്തിലെ ദീർഘമായ കാരണ-ഉദ്ദേശ്യഘടന ഡാഷ് ഉപയോഗിച്ച് വായനാസൗകര്യത്തോടെ നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
