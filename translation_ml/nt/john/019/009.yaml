id: JHN.19.9
reference: John 19:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἰσῆλθεν εἰς τὸ πραιτώριον πάλιν καὶ λέγει τῷ Ἰησοῦ· Πόθεν εἶ σύ; ὁ δὲ Ἰησοῦς ἀπόκρισιν οὐκ ἔδωκεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/009.yaml
  text: And he entered the governor’s headquarters again and said to Jesus[a], “Where are you from?” But Jesus gave him no answer.
translation:
  language: ml
  text: അവൻ ഗവർണറുടെ ആസ്ഥാനത്തിലേക്ക്[a] വീണ്ടും പ്രവേശിച്ച് യേശുവിനോട്, “നീ എവിടെനിന്നുള്ളവനാണ്?” എന്നു ചോദിച്ചു. എന്നാൽ യേശു അവന് ഒരു മറുപടിയും നൽകിയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഗവർണറുടെ ആസ്ഥാനം’ എന്നതിന് ‘പ്രൈറ്റോറിയം’ എന്നും പറയാം; ഇത് റോമൻ ഗവർണറുടെ ഔദ്യോഗിക വസതിയെയോ ആസ്ഥാനത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: കടന്നുചെന്ന്
  rationale: ഒരു സ്ഥലത്തിന്റെ അകത്തേക്കുള്ള ചലനം സൂചിപ്പിക്കുന്ന ക്രിയ; ആഖ്യാനസന്ദർഭത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളപ്രയോഗം.
- source_word: πραιτώριον
  choice: ഗവർണറുടെ ആസ്ഥാനം
  rationale: റോമൻ ഗവർണറുടെ ഔദ്യോഗിക വസതിയെയോ കാര്യാലയ-ആസ്ഥാനത്തെയോ സൂചിപ്പിക്കുന്നു; അപരിചിതമായ ലിപ്യന്തരണത്തേക്കാൾ പ്രവർത്തനാർഥം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: പ്രവൃത്തി ആവർത്തിക്കുന്നതായി നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: λέγει
  choice: ചോദിച്ചു
  rationale: ഗ്രീക്കിൽ പൊതുവായി ‘പറയുന്നു’ എന്ന ചരിത്രവർത്തമാനമാണെങ്കിലും പിന്നാലെയുള്ള ചോദ്യം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കാൻ ‘ചോദിച്ചു’ എന്നു നൽകി.
- source_word: Πόθεν εἶ σύ
  choice: നീ എവിടെനിന്നുള്ളവനാണ്?
  rationale: ഉത്ഭവമോ വരവിന്റെ ഉറവിടമോ ചോദിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം; ചോദ്യത്തിലെ സാധ്യതാപൂർണമായ ആഴം വിശദീകരിച്ചു തീർക്കുന്നില്ല.
- source_word: ἀπόκρισιν οὐκ ἔδωκεν αὐτῷ
  choice: അവന് ഒരു മറുപടിയും നൽകിയില്ല
  rationale: ‘അവന് ഉത്തരം നൽകിയില്ല’ എന്ന ഗ്രീക്ക് ഘടനയും ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ക്രിയകളിലെ അപ്രകട കർത്താവിന്റെ സൂചിതവ്യക്തി
  choice: ‘അവൻ’ എന്നു നൽകി; സന്ദർഭത്തിൽ പീലാത്തോസാണ് സൂചിതൻ.
  alternative: പ്രധാനപാഠത്തിൽ ‘പീലാത്തോസ്’ എന്നു വ്യക്തമായി ചേർക്കുക.
  rationale: ഗ്രീക്ക് കർത്താവിന്റെ പേര് ആവർത്തിക്കുന്നില്ല. മുൻസന്ദർഭം തിരിച്ചറിയൽ വ്യക്തമാക്കുന്നതിനാൽ ‘അവൻ’ എന്നത് മൂലപാഠത്തോട് കൂടുതൽ ചേർന്നുനിൽക്കുന്നു.
- issue: ‘നീ എവിടെനിന്നുള്ളവനാണ്?’ എന്ന ചോദ്യത്തിന്റെ അർഥവ്യാപ്തി
  choice: ഉത്ഭവത്തെക്കുറിച്ചുള്ള ചോദ്യം എന്ന നിലയിൽ തുറന്നുവെച്ചു.
  alternative: ഭൗമിക സ്വദേശമെന്നോ ദൈവിക ഉത്ഭവമെന്നോ വ്യക്തമാക്കി വിവർത്തനം ചെയ്യുക.
  rationale: Πόθεν എന്നത് സന്ദർഭത്തിൽ ഒന്നിലധികം തലത്തിലുള്ള അർഥം വഹിക്കാം; വിവർത്തനം ആ ദൈവശാസ്ത്രപരമായ സംഘർഷം മായ്ച്ചുകളയരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പ്രൈറ്റോറിയം’ പ്രധാനപാഠത്തിൽ ഒഴിവാക്കി അർഥം സുതാര്യമാക്കി, പകരംപദം അടിക്കുറിപ്പിൽ നൽകി. അടിക്കുറിപ്പ് അടയാളം ബന്ധപ്പെട്ട ‘ഗവർണറുടെ ആസ്ഥാനം’ എന്ന പദത്തിനരികിലായിരിക്കണം.
