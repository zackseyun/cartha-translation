source:
  edition: SBLGNT
  text: ⸀σκεῦος ἔκειτο ὄξους μεστόν· ⸂σπόγγον οὖν μεστὸν τοῦ⸃ ὄξους ⸀ὑσσώπῳ περιθέντες προσήνεγκαν αὐτοῦ τῷ στόματι.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/029.yaml
  text: A container full of sour wine was lying there[b][a]; so they put a sponge full of the sour wine on hyssop and brought it to his mouth.
translation:
  language: ml
  text: പുളിച്ച വീഞ്ഞ് നിറഞ്ഞ ഒരു പാത്രം അവിടെ ഉണ്ടായിരുന്നു. അതുകൊണ്ട് അവർ പുളിച്ച വീഞ്ഞിൽ മുക്കിയ ഒരു സ്പോഞ്ച് ഈസോപ്പിന്മേൽ വെച്ച്[a] അവന്റെ വായിലേക്കു കൊണ്ടുവന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഈസോപ്പിന്റെ ഒരു കൊമ്പിന്മേൽ വെച്ച്” അല്ലെങ്കിൽ “ഈസോപ്പുകൊണ്ട്” എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്കിൽ “ഈസോപ്പിന്മേൽ/ഈസോപ്പുകൊണ്ട്” എന്നേ ഉള്ളൂ; കൃത്യമായ ദൃശ്യം വിവാദവിധേയമാണ്.
    reason: lexical_alternative
  - marker: b
    text: “പുളിച്ച വീഞ്ഞ്” എന്നതിന് “വിനാഗിരി” എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്കുപദം രണ്ടും സൂചിപ്പിക്കാം; ഇവിടെ സൈനികർക്കു ലഭ്യമായിരുന്ന പുളിച്ച വീഞ്ഞായിരിക്കാനാണ് കൂടുതൽ സാധ്യത.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκεῦος
  choice: പാത്രം
  rationale: വസ്തുവിന്റെ പ്രത്യേക രൂപം അനാവശ്യമായി നിർണയിക്കാതെ, പൊതുവായ container/vessel എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἔκειτο
  choice: അവിടെ ഉണ്ടായിരുന്നു
  rationale: ഒരു സ്ഥലത്ത് സ്ഥിതിചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന അപൂർണകാലത്തിന്റെ പശ്ചാത്തലവിവരണ സ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὄξος
  choice: പുളിച്ച വീഞ്ഞ്
  rationale: ഈ സന്ദർഭത്തിൽ കുടിക്കാൻ ഉപയോഗിച്ചിരുന്ന വിലകുറഞ്ഞ പുളിച്ച വീഞ്ഞിനെയാണ് സാധ്യതയോടെ സൂചിപ്പിക്കുന്നത്; വെറും പാചകവിനാഗിരി എന്നു ചുരുക്കുന്നില്ല.
- source_word: μεστόν
  choice: നിറച്ച
  rationale: പാത്രത്തിന്റെയും നീർപ്പഞ്ഞിയുടെയും നിറഞ്ഞ അവസ്ഥ മലയാളത്തിൽ സംക്ഷിപ്തമായും സ്വാഭാവികമായും വ്യക്തമാക്കുന്നു.
- source_word: σπόγγον
  choice: നീർപ്പഞ്ഞി
  rationale: ദ്രാവകം വലിച്ചെടുക്കുന്ന sponge എന്ന വസ്തുവിന് സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മലയാളപദം.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യവുമായി പ്രവർത്തിയുടെ ആഖ്യാനപരമായ ബന്ധം സൂചിപ്പിക്കുന്നു.
- source_word: ὑσσώπῳ
  choice: ഈസോപ്പിന്മേൽ
  rationale: ദാതിവിന്റെ ഉപാധി/ബന്ധിപ്പിക്കൽ എന്ന അനിശ്ചിതത്വം പൂർണമായി പരിഹരിക്കാതെ, സസ്യനാമവും അതിന്റെ സാധ്യതയുള്ള പ്രതീകാത്മക അനുരണനവും നിലനിർത്തുന്നു.
- source_word: περιθέντες
  choice: വെച്ച്
  rationale: മുഖ്യക്രിയയ്ക്കു മുമ്പുണ്ടായ പ്രവർത്തിയെ മലയാളത്തിലെ ക്രിയാവിശേഷണരൂപത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: προσήνεγκαν
  choice: വായോടു ചേർത്തു
  rationale: προσφέρω എന്നതിന്റെ കൊണ്ടുവരുക/അടുത്തേക്കു നീക്കുക എന്ന ഭൗതിക പ്രവർത്തി ഈ സന്ദർഭത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു; കുടിപ്പിച്ചു എന്ന അധിക നിഗമനം ചേർക്കുന്നില്ല.
- source_word: αὐτοῦ τῷ στόματι
  choice: അവന്റെ വായോടു
  rationale: ലക്ഷ്യസ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന ദാതിവിനെ സന്ദർഭാനുസൃതമായ മലയാളരൂപത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ὑσσώπῳ എന്ന പദത്തിന്റെ ചരിത്രപരവും ആരാധനാചാരപരവുമായ അനുരണനം
  choice: മുഖ്യവാചകത്തിൽ “ഈസോപ്പ്” നിലനിർത്തി, അതിന്റെ പ്രതീകാത്മകത വിശദീകരിക്കാതിരിക്കുക.
  alternative: “ഈസോപ്പുകൊമ്പ്” എന്നു കൂടുതൽ വ്യക്തമായി വിവർത്തനം ചെയ്യുക, അല്ലെങ്കിൽ വെറും തണ്ട്/കോൽ എന്നു നൽകുക.
  rationale: യോഹന്നാന്റെ പ്രയോഗത്തിന് പെസഹയുടെയോ ശുദ്ധീകരണാചാരങ്ങളുടെയോ അനുരണനം ഉണ്ടായേക്കാം; എന്നാൽ വാക്യം തന്നെ അതു തുറന്നുപറയുന്നില്ല. അതിനാൽ പദം നിലനിർത്തുകയും വ്യാഖ്യാനം വാചകത്തിലേക്ക് ഇറക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. സാങ്കേതികത ഒഴിവാക്കി സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമാക്കിയെങ്കിലും, ὑσσώπῳ എന്നതിലെ യഥാർഥ വ്യാകരണ-ദൃശ്യ അനിശ്ചിതത്വവും സാധ്യതയുള്ള ദൈവശാസ്ത്രാനുരണനവും അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
