    text: ‘അരമായഭാഷയിൽ’ എന്നും അർഥമാകാം; പ്രാദേശിക സെമിറ്റിക് ഭാഷയെ സൂചിപ്പിക്കാൻ യോഹന്നാൻ ‘എബ്രായഭാഷ’ എന്ന പദം ഉപയോഗിക്കുന്നു.
    reason: lexical_alternative
  revision_rationale: The revision explicitly translates the source’s causal clause and makes the referent of ‘was written’ unambiguous by restating ‘the inscription.’ It retains the source wording ‘Hebrew’ in the main text and preserves the Aramaic possibility in the footnote.
