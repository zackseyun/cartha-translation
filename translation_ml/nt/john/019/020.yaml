id: JHN.19.20
reference: John 19:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῦτον οὖν τὸν τίτλον πολλοὶ ἀνέγνωσαν τῶν Ἰουδαίων, ὅτι ἐγγὺς ἦν ὁ τόπος τῆς πόλεως ὅπου ἐσταυρώθη ὁ Ἰησοῦς· καὶ ἦν γεγραμμένον Ἑβραϊστί, ⸂Ῥωμαϊστί, Ἑλληνιστί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/020.yaml
  text: Therefore many of the Jews read this inscription[a], because the place where Jesus was crucified was near the city; and it was written in Hebrew, in Latin, and in Greek.
translation:
  language: ml
  text: അതുകൊണ്ട് യെഹൂദരിൽ പലരും ഈ ലിഖിതം വായിച്ചു; കാരണം, യേശുവിനെ ക്രൂശിച്ച സ്ഥലം നഗരത്തിനടുത്തായിരുന്നു. ആ ലിഖിതം എബ്രായ, ലത്തീൻ, ഗ്രീക്ക് ഭാഷകളിൽ എഴുതിയതായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίτλον
  choice: ലിഖിതം
  rationale: ക്രൂശിന്മേൽ സ്ഥാപിച്ച എഴുത്തിനെ സൂചിപ്പിക്കുന്ന സന്ദർഭത്തിൽ ‘ലിഖിതം’ സ്വാഭാവികവും കൃത്യവുമാണ്; ‘ശീർഷകം’ എന്ന അത്യന്തം അക്ഷരാർഥപരമായ രൂപം ഇവിടെ അനുയോജ്യമല്ല.
- source_word: πολλοὶ ... τῶν Ἰουδαίων
  choice: യെഹൂദരിൽ പലരും
  rationale: ജനവിഭാഗം മുഴുവനെയും പൊതുവത്കരിക്കാതെ ഗ്രീക്കിലെ ഭാഗിക-ജനിറ്റീവ് അർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀνέγνωσαν
  choice: വായിച്ചു
  rationale: എഴുത്ത് വായിച്ച ലളിതമായ പ്രവൃത്തിയാണ് സൂചിപ്പിക്കുന്നത്; ‘ഉറക്കെ വായിച്ചു’ എന്നു ചേർക്കാൻ മൂലപാഠത്തിൽ വ്യക്തമായ അടിസ്ഥാനമില്ല.
- source_word: ἐγγὺς ἦν ὁ τόπος τῆς πόλεως
  choice: സ്ഥലം നഗരത്തിനടുത്തായിരുന്നു
  rationale: നഗരവാതിൽപോലുള്ള വിശദാംശങ്ങൾ ചേർക്കാതെ ഗ്രീക്കിന്റെ നേരിട്ടുള്ള അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὅπου ἐσταυρώθη ὁ Ἰησοῦς
  choice: യേശുവിനെ ക്രൂശിച്ച സ്ഥലം
  rationale: ഗ്രീക്കിലെ നിഷ്ക്രിയരൂപത്തിന്റെ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; കർത്താവിനെ പ്രത്യേകം നിർദേശിക്കുന്നില്ല.
- source_word: γεγραμμένον
  choice: എഴുതിയിരുന്നു
  rationale: എഴുതപ്പെട്ട നിലയെ സൂചിപ്പിക്കുന്ന പെരിഫ്രാസ്റ്റിക് പൂർണരൂപത്തിന്റെ ഫലാവസ്ഥ മലയാളത്തിൽ സംക്ഷിപ്തമായി പ്രകടമാക്കുന്നു.
- source_word: Ἑβραϊστί
  choice: എബ്രായഭാഷയിൽ
  rationale: മൂലഗ്രീക്കിലെ ഭാഷാനാമം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; യോഹന്നാന്റെ പ്രയോഗത്തിൽ അരമായഭാഷ ഉദ്ദേശിച്ചിരിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: Ῥωμαϊστί
  choice: ലത്തീൻഭാഷയിൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘റോമൻ ഭാഷയിൽ’ എന്നാണെങ്കിലും ഉദ്ദേശിക്കുന്ന ഭാഷ ലത്തീൻ ആയതിനാൽ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: Ἑλληνιστί
  choice: ഗ്രീക്കുഭാഷയിൽ
  rationale: ഭാഷാവാചക ക്രിയാവിശേഷണത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യവുമായുള്ള യുക്തിപരവും ആഖ്യാനപരവുമായ ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: യോഹന്നാന്റെ പ്രയോഗത്തിലെ Ἑβραϊστί എന്നതിന്റെ വിവർത്തനം
  choice: മുഖ്യപാഠത്തിൽ ‘എബ്രായഭാഷയിൽ’
  alternative: ‘അരമായഭാഷയിൽ’
  rationale: ഗ്രീക്ക് പദം ‘എബ്രായഭാഷയിൽ’ എന്നാണ് പറയുന്നത്; എന്നാൽ പ്രാദേശിക സെമിറ്റിക് സംസാരഭാഷയായ അരമായയെ ഈ പദം സൂചിപ്പിച്ചിരിക്കാമെന്ന യഥാർഥ ഭാഷാശാസ്ത്രപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘യെഹൂദരിൽ പലരും’ എന്ന രൂപം ഭാഗികത സൂക്ഷിക്കുന്നു; ഭാഷാനാമങ്ങളിൽ ‘ഭാഷയിൽ’ ചേർത്തത് സാധാരണ വായനക്കാർക്ക് വ്യക്തത നൽകുന്നു.
