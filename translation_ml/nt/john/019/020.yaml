revisions:
- from: അതുകൊണ്ട് യെഹൂദരിൽ പലരും ഈ ലിഖിതം വായിച്ചു[a]. യേശുവിനെ ക്രൂശിച്ച സ്ഥലം നഗരത്തിനടുത്തായിരുന്നു; അത് എബ്രായഭാഷയിലും ലത്തീൻഭാഷയിലും ഗ്രീക്കുഭാഷയിലും എഴുതിയിരുന്നു.
  to: അതുകൊണ്ട് യെഹൂദരിൽ പലരും ഈ ലിഖിതം വായിച്ചു; കാരണം, യേശുവിനെ ക്രൂശിച്ച സ്ഥലം നഗരത്തിനടുത്തായിരുന്നു. ആ ലിഖിതം എബ്രായ, ലത്തീൻ, ഗ്രീക്ക് ഭാഷകളിൽ എഴുതിയതായിരുന്നു.
