source:
  edition: SBLGNT
  text: ἀλλ’ εἷς τῶν στρατιωτῶν λόγχῃ αὐτοῦ τὴν πλευρὰν ἔνυξεν, καὶ ⸂ἐξῆλθεν εὐθὺς⸃ αἷμα καὶ ὕδωρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/034.yaml
  text: But one of the soldiers pierced his side with a spear[b][a], and immediately blood and water came out.
translation:
  language: ml
  text: എന്നാൽ പടയാളികളിൽ ഒരാൾ തന്റെ കുന്തംകൊണ്ട് യേശുവിന്റെ പാർശ്വം കുത്തി[a]; ഉടനെ രക്തവും വെള്ളവും പുറത്തുവന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഈട്ടികൊണ്ട്.’
    reason: lexical_alternative
  - marker: b
    text: ‘രക്തവും വെള്ളവും’ എന്നത് പ്രതീകാത്മകമായോ കൂദാശാപരമായോ ചിലർ മനസ്സിലാക്കുന്നു; മറ്റുചിലർ ഇതിനെ ശാരീരികമായ ഒരു വിവരണമായി കാണുന്നു. ഇവിടെ ഗ്രീക്ക് മൂലപാഠംതന്നെ ഇതിന്റെ പ്രാധാന്യം വിശദീകരിക്കുന്നില്ല.
    reason: interpretive_ambiguity
lexical_decisions:
- source_word: ἀλλ’
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിൽ യേശുവിന്റെ കാലുകൾ ഒടിക്കാതിരുന്നതിനു വിരുദ്ധമായി നടന്ന കാര്യം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: εἷς τῶν στρατιωτῶν
  choice: പടയാളികളിൽ ഒരാൾ
  rationale: ഗ്രീക്കിലെ ഭാഗികബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു; ‘ഒരു പടയാളി’ എന്ന് ലഘൂകരിക്കുന്നില്ല.
- source_word: λόγχῃ
  choice: കുന്തംകൊണ്ട്
  rationale: പടയാളി ഉപയോഗിക്കുന്ന spear/lance എന്ന ആയുധത്തെ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്ന സാധാരണ പദം.
- source_word: αὐτοῦ τὴν πλευρὰν
  choice: അവന്റെ വശത്ത്
  rationale: സർവനാമം സന്ദർഭത്തിൽ യേശുവിനെ സൂചിപ്പിക്കുന്നു; πλευράയുടെ പൊതുവായ അർഥമായ ‘വശം’ നിലനിർത്തി ശരീരഭാഗം അനാവശ്യമായി കൂടുതൽ നിർവചിക്കുന്നില്ല.
- source_word: ἔνυξεν
  choice: കുത്തി
  rationale: മുനയുള്ള ആയുധംകൊണ്ട് തുളയ്ക്കുന്ന പ്രവൃത്തിയെ സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: καὶ ⸂ἐξῆλθεν εὐθὺς⸃
  choice: ഉടനെ ... പുറത്തുവന്നു
  rationale: εὐθύς എന്നതിന്റെ തൽക്ഷണതയും സംഭവക്രമവും മലയാളത്തിലെ സ്വാഭാവിക പദക്രമത്തിൽ നിലനിർത്തുന്നു.
- source_word: αἷμα καὶ ὕδωρ
  choice: രക്തവും വെള്ളവും
  rationale: അസാധാരണമായ മൂലപ്രയോഗം വ്യാഖ്യാനവികാസമില്ലാതെ നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘രക്തവും വെള്ളവും’ എന്ന പ്രയോഗത്തെ കൂദാശാപരമായോ ശാരീരിക പ്രതിഭാസമായോ മുഖ്യവാചകത്തിൽ വ്യാഖ്യാനിക്കണമോ
  choice: ‘രക്തവും വെള്ളവും’ എന്ന അക്ഷരാർഥപ്രയോഗം വിശദീകരണ വ്യാഖ്യാനമില്ലാതെ നിലനിർത്തി.
  alternative: ഇത് കൂദാശാപരമായ സൂചനയായോ മുറിവിന്റെ ശാരീരിക ഫലത്തിന്റെ വിവരണമായോ വ്യക്തമാക്കുക.
  rationale: വാക്യം സംഭവത്തെ പ്രസ്താവിക്കുന്നുവെങ്കിലും അതിന്റെ പ്രാധാന്യം ഇവിടെ വിശദീകരിക്കുന്നില്ല. അതിനാൽ പ്രത്യേക വ്യാഖ്യാനപാരമ്പര്യം മുഖ്യവാചകത്തിലേക്ക് കൊണ്ടുവരാതെ മൂലത്തിലെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പടയാളികളിൽ ഒരാൾ’ എന്ന രൂപം ഗ്രീക്കിലെ ഭാഗികബന്ധം സൂക്ഷിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
