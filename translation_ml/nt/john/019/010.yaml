id: JHN.19.10
reference: John 19:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγει οὖν αὐτῷ ὁ Πιλᾶτος· Ἐμοὶ οὐ λαλεῖς; οὐκ οἶδας ὅτι ἐξουσίαν ἔχω ⸂ἀπολῦσαί σε καὶ ἐξουσίαν ἔχω σταυρῶσαί⸃ σε;
base_translation:
  language: en
  yaml_path: translation/nt/john/019/010.yaml
  text: So Pilate said to him[a], “Will you not speak to me? Do you not know that I have authority to release you and authority to crucify you?”
translation:
  language: ml
  text: 'അപ്പോൾ പീലാത്തോസ് അവനോടു പറഞ്ഞു: “നീ എന്നോടു സംസാരിക്കുന്നില്ലേ? നിന്നെ വിട്ടയയ്ക്കാൻ എനിക്ക് അധികാരമുണ്ടെന്നും[a] നിന്നെ ക്രൂശിക്കാൻ എനിക്ക് അധികാരമുണ്ടെന്നും നിനക്കറിയില്ലേ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അധികാരം’ എന്നതിനുപകരം ‘ശക്തി’ എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്കിലെ ἐξουσία എന്ന പദത്തിന് അധികാരം, അവകാശം, ശക്തി എന്നീ അർഥങ്ങൾ വരാം. ഇവിടെ പീലാത്തോസ് നിയമപരവും ഭരണപരവുമായ സാഹചര്യത്തിൽ സംസാരിക്കുന്നതിനാൽ ‘അധികാരം’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει οὖν
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: οὖν ഇവിടെ ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്ന ബന്ധകമാണ്; ‘അപ്പോൾ’ അതിന്റെ ക്രമാനുഗത സ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: αὐτῷ
  choice: അവനോടു
  rationale: ദാതൃവിഭക്തിയിലുള്ള പരോക്ഷ കർമത്തെ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: Πιλᾶτος
  choice: പീലാത്തോസ്
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: Ἐμοὶ οὐ λαλεῖς
  choice: നീ എന്നോടു സംസാരിക്കുന്നില്ലേ?
  rationale: മുൻസ്ഥാനത്തുള്ള Ἐμοὶ-യുടെ ഊന്നൽ ‘എന്നോടു’ എന്നതിലൂടെ നിലനിർത്തുകയും ചോദ്യം പീലാത്തോസിന്റെ നീരസവും ശാസനാഭാവവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: οὐκ οἶδας
  choice: നിനക്കറിയില്ലേ?
  rationale: οἶδα എന്നതിന്റെ സാധാരണ അർഥമായ ‘അറിയുക’ നിലനിർത്തുന്നു; വാചാടോപപരമായ ചോദ്യം മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: ἐξουσίαν ἔχω
  choice: എനിക്ക് അധികാരമുണ്ട്
  rationale: നിയമപരവും ഭരണപരവുമായ സാഹചര്യത്തിൽ ἐξουσία-യുടെ ‘authority’ എന്ന അർഥത്തിന് ‘അധികാരം’ ഏറ്റവും യോജിക്കുന്നു; വെറും ശക്തി എന്ന ആശയം മാത്രം നൽകുന്നില്ല.
- source_word: ἀπολῦσαί σε
  choice: നിന്നെ വിട്ടയയ്ക്കാൻ
  rationale: ന്യായവിധി സാഹചര്യത്തിലെ ἀπολύω-യുടെ ‘release’ എന്ന അർഥം കൃത്യമായി നൽകുന്നു; കുറ്റവിമുക്തനാക്കുക എന്ന അധികവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: καὶ ἐξουσίαν ἔχω σταυρῶσαί σε
  choice: നിന്നെ ക്രൂശിക്കാൻ എനിക്ക് അധികാരമുണ്ട്
  rationale: ഗ്രീക്കിലെ ἐξουσίαν ἔχω എന്ന ആവർത്തനം നിലനിർത്തി വിട്ടയക്കലും ക്രൂശിക്കലും തമ്മിലുള്ള വാചാടോപപരമായ വിരുദ്ധത ഊന്നിപ്പറയുന്നു.
theological_decisions:
- issue: പീലാത്തോസ് അവകാശപ്പെടുന്ന ἐξουσία-യുടെ സ്വഭാവം
  choice: ‘അധികാരം’ എന്ന് പരിഭാഷപ്പെടുത്തി, അവന്റെ അവകാശവാദത്തിന്റെ നിയമസാധുതയെയോ പരമസ്വഭാവത്തെയോ സ്ഥിരീകരിക്കാതിരിക്കുക.
  alternative: ‘ശക്തി’ അല്ലെങ്കിൽ ‘അവകാശം’
  rationale: വാക്യം പീലാത്തോസിന്റെ അവകാശവാദമാണ് രേഖപ്പെടുത്തുന്നത്; റോമൻ ഭരണാധികാരം സ്വതന്ത്രവും പരമവുമാണെന്ന് ആഖ്യാതാവ് അംഗീകരിക്കുന്നില്ല. അടുത്ത വാക്യത്തിൽ യേശു ഉന്നയിക്കുന്ന ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. പീലാത്തോസിന്റെ ആത്മപ്രാധാന്യവും ശാസനാഭാവവും നിലനിർത്താൻ ‘എന്നോടു’ എന്ന ഊന്നലും ‘അധികാരമുണ്ട്’ എന്ന ആവർത്തനവും സംരക്ഷിച്ചു.
