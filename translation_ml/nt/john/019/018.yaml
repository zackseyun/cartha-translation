id: JHN.19.18
reference: John 19:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅπου αὐτὸν ἐσταύρωσαν, καὶ μετ’ αὐτοῦ ἄλλους δύο ἐντεῦθεν καὶ ἐντεῦθεν, μέσον δὲ τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/018.yaml
  text: where they crucified him[a], and with him two others, one on each side, and Jesus in the middle.
translation:
  language: ml
  text: അവിടെ അവർ അവനെയും അവനോടൊപ്പം മറ്റു രണ്ടുപേരെയും ക്രൂശിച്ചു—ഒരാളെ ഇപ്പുറത്തും മറ്റേയാളെ അപ്പുറത്തും, യേശുവിനെ നടുവിൽ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπου
  choice: അവിടെ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ സ്ഥാനസൂചക പ്രയോഗം.
- source_word: ἐσταύρωσαν
  choice: അവർ ക്രൂശിച്ചു
  rationale: യോഹന്നാന്റെ പീഡാനുഭവവിവരണത്തിൽ σταυρόω ക്രൂശിക്കലിനെയാണ് സൂചിപ്പിക്കുന്നത്; നടപടിയുടെ വിശദാംശങ്ങൾ അനാവശ്യമായി കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: μετ’ αὐτοῦ
  choice: അവനോടൊപ്പം
  rationale: μετά + ജനിറ്റീവ് നൽകുന്ന സഹവർത്തിത്വത്തിന്റെ അർഥം നേരിട്ടും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: ἄλλους δύο
  choice: വേറെ രണ്ടുപേരെയും
  rationale: ഗ്രീക്കിലെ ‘മറ്റു രണ്ടുപേർ’ എന്ന അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ പുരുഷന്മാരാണെങ്കിലും മൂലത്തിൽ ഇല്ലാത്ത വിശേഷണം ചേർക്കുന്നില്ല.
- source_word: ἐντεῦθεν καὶ ἐντεῦθεν
  choice: ഒരാളെ ഇപ്പുറത്തും മറ്റേയാളെ അപ്പുറത്തും
  rationale: രണ്ടുപേരെ യേശുവിന്റെ എതിർവശങ്ങളിലായി നിർത്തിയ സ്ഥാനക്രമം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: μέσον δὲ τὸν Ἰησοῦν
  choice: യേശുവോ നടുവിലായിരുന്നു
  rationale: μέσον സൂചിപ്പിക്കുന്ന മധ്യസ്ഥാനം നിലനിർത്തുകയും δέയുടെ നേരിയ വിഷയമാറ്റം ‘യേശുവോ’ എന്ന പ്രയോഗത്തിലൂടെ പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: യേശു മറ്റു രണ്ടുപേരുടെയും ഇടയിലായിരുന്നു എന്നത് എത്രമാത്രം വ്യക്തമാക്കണം
  choice: ഇരുവശങ്ങളിലെ സ്ഥാനക്രമവും തുടർന്ന് യേശു നടുവിലായിരുന്നു എന്നതും പ്രത്യേകം പ്രസ്താവിച്ചു.
  alternative: ‘യേശുവിനെ അവരുടെ നടുവിലാക്കി’ എന്ന് ചുരുക്കി പറയാം.
  rationale: മൂലപാഠം ആദ്യം ‘ഇപ്പുറത്തും അപ്പുറത്തും’ എന്ന വിന്യാസവും പിന്നെ യേശുവിന്റെ മധ്യസ്ഥാനവും പറയുന്നു. വിവർത്തനം ഈ ദൃശ്യക്രമം നിലനിർത്തുന്നു; ‘അവരുടെ ഇടയിൽ’ എന്ന ന്യായമായ നിഗമനം മാത്രം മുഖ്യപാഠമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളം. ‘ക്രൂശിച്ചു’ എന്ന സഭാപാരമ്പര്യത്തിൽ പരിചിതവും കൃത്യവുമായ പദം നിലനിർത്തി; വാക്യഘടന സ്വാഭാവികമാക്കാൻ ക്രിയ ആവർത്തിച്ചു.
