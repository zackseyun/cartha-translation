  text: ἦλθεν δὲ καὶ Νικόδημος, ὁ ἐλθὼν πρὸς ⸀αὐτὸν νυκτὸς τὸ πρῶτον, φέρων ⸀μίγμα σμύρνης καὶ ἀλόης ὡς λίτρας ἑκατόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/039.yaml
  text: Nicodemus also came—the one who had first come to him at night—bringing a mixture of myrrh and aloes[b][a], about a hundred litras.
translation:
  language: ml
  text: നിക്കോദേമൊസും വന്നു—ആദ്യം രാത്രിയിൽ യേശുവിന്റെ അടുക്കൽ വന്നയാൾ തന്നെ—ഏകദേശം നൂറ് ലിത്രാ തൂക്കമുള്ള, മൂരും അകിലും ചേർന്ന മിശ്രിതം കൊണ്ടുവന്നു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആദ്യം രാത്രിയിൽ വന്നയാൾ’ എന്നതിന് ‘മുമ്പ് രാത്രിയിൽ വന്നയാൾ’ എന്നും പരിഭാഷപ്പെടുത്താം; യോഹന്നാൻ 3:1–2 കാണുക.
    reason: translation_alternative_cross_reference
  - marker: b
    text: ഒരു ലിത്രാ റോമൻ പൗണ്ടായിരുന്നു, ഏകദേശം 327 ഗ്രാം. നൂറ് ലിത്രാ ഏകദേശം 32–33 കിലോഗ്രാം വരും.
    reason: cultural_note
lexical_decisions:
- source_word: ἦλθεν δὲ καὶ Νικόδημος
  choice: നിക്കോദേമൊസും വന്നു
  rationale: δέയെ ലഘുവായ ആഖ്യാനബന്ധമായി സ്വാഭാവിക മലയാളത്തിൽ പ്രത്യേകം പദമാക്കാതെ വിടുകയും, καίയുടെ കൂട്ടിച്ചേർക്കൽഭാവം ‘-ഉം’കൊണ്ട് നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ὁ ἐλθὼν πρὸς αὐτὸν νυκτὸς τὸ πρῶτον
  choice: ആദ്യം രാത്രിയിൽ യേശുവിന്റെ അടുക്കൽ വന്നയാൾതന്നെ
  rationale: നിക്കോദേമൊസിനെ തിരിച്ചറിയിക്കുന്ന വിശേഷണഘടനയും യോഹന്നാൻ 3:1–2-ലേക്കുള്ള ആഖ്യാനസ്മരണയും നിലനിർത്തുന്നു. αὐτόν എന്നതിന്റെ സന്ദർഭസൂചിതമായ വ്യക്തതയ്ക്കായി ‘യേശു’ എന്നു പറയുന്നു; τὸ πρῶτον എന്നതിലെ ‘ആദ്യം/മുമ്പ്’ എന്ന സൂക്ഷ്മതയ്ക്ക് അടിക്കുറിപ്പ് നൽകുന്നു.
- source_word: φέρων
  choice: കൊണ്ടുവന്നു
  rationale: വരുന്നതിനോടൊപ്പമുള്ള പ്രവൃത്തിയെ സ്വാഭാവികമായ മലയാള ആഖ്യാനരീതിയിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: μίγμα σμύρνης καὶ ἀλόης
  choice: മൂറും അകിലും ചേർന്ന മിശ്രിതം
  rationale: σμύρνηയ്ക്ക് നിലവാരമുള്ള ബൈബിൾ-മലയാള പദമായ ‘മൂർ’ ഉപയോഗിക്കുന്നു. ἀλόη ഇവിടെ ശവസംസ്കാരത്തിൽ ഉപയോഗിച്ചിരുന്ന സുഗന്ധദ്രവ്യമായ അകിലിനെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക കറ്റാർവാഴയുമായി തെറ്റിദ്ധരിക്കാതിരിക്കാൻ ‘അകിൽ’ തിരഞ്ഞെടുക്കുന്നു.
- source_word: ὡς λίτρας ἑκατόν
  choice: ഏകദേശം നൂറു ലിത്രാ
  rationale: ὡςയുടെ ഏകദേശത ‘ഏകദേശം’കൊണ്ട് വ്യക്തമാക്കുന്നു. പുരാതന റോമൻ തൂക്കയൂണിറ്റിനെ ആധുനിക പൗണ്ടുമായി കലരാതിരിക്കാൻ ‘ലിത്രാ’ എന്ന ലിപ്യന്തരണം നിലനിർത്തുന്നു; തുല്യഭാരം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: തിരിച്ചറിയിക്കൽ ഉപവാക്യത്തിലെ αὐτόν ആരെ സൂചിപ്പിക്കുന്നു
  choice: ‘യേശുവിന്റെ അടുക്കൽ’
  alternative: ‘അവന്റെ അടുക്കൽ’
  rationale: യോഹന്നാൻ 3:1–2-ലെ മുൻസന്ദർശനമാണ് ഇവിടെ വ്യക്തമായി ഓർമിപ്പിക്കുന്നത്. മലയാളത്തിൽ സർവനാമത്തിന്റെ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ സൂചിതനാമം വ്യക്തമാക്കുന്നു; പുതിയ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: τὸ πρῶτον എന്നതിന്റെ കാലസൂചന
  choice: ‘ആദ്യം’ മുഖ്യപാഠത്തിൽ; ‘മുമ്പ്’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ
  alternative: ‘മുമ്പ്’ മാത്രം
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിന് ‘ആദ്യം’ എന്നും ‘മുമ്പ്’ എന്നും ഗ്രഹിക്കാവുന്ന സൂക്ഷ്മതയുണ്ട്. മുഖ്യപാഠം ആദ്യ സന്ദർശനത്തെ സൂചിപ്പിക്കുമ്പോൾ അടിക്കുറിപ്പ് യഥാർഥ പരിഭാഷാവികൽപം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘മൂർ’, ‘അകിൽ’ എന്നീ പരിചിത ബൈബിൾ പദങ്ങൾ നിലനിർത്തിയെങ്കിലും അളവായ ‘ലിത്രാ’യുടെ അർഥം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ നൽകിയിരിക്കുന്നു.
