id: JHN.19.35
reference: John 19:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὁ ἑωρακὼς μεμαρτύρηκεν, καὶ ἀληθινὴ ⸂αὐτοῦ ἐστιν⸃ ἡ μαρτυρία, καὶ ἐκεῖνος οἶδεν ὅτι ἀληθῆ λέγει, ἵνα ⸀καὶ ὑμεῖς ⸀πιστεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/035.yaml
  text: And the one who has seen has testified[a], and his testimony is true, and that one knows that he is telling the truth, so that you also may believe.
translation:
  language: ml
  text: കണ്ടവൻ സാക്ഷ്യം പറഞ്ഞിരിക്കുന്നു; അവന്റെ സാക്ഷ്യം സത്യമാണ്. താൻ സത്യം പറയുന്നുവെന്ന് അവൻ അറിയുന്നു—നിങ്ങളും വിശ്വസിക്കേണ്ടതിനായി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങളും വിശ്വസിച്ചുകൊണ്ടിരിക്കേണ്ടതിനായി.’ വർത്തമാനകാല സബ്ജങ്ക്ടീവ് രൂപത്തിന് തുടരുന്ന വിശ്വാസത്തിന്റെ ഭാവം സൂചിപ്പിക്കാനാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἑωρακὼς
  choice: കണ്ടവൻ
  rationale: സുബ്സ്റ്റാന്റീവായി ഉപയോഗിച്ചിരിക്കുന്ന പൂർണകാല കൃദന്തത്തിന്റെ ദൃക്സാക്ഷിത്വഭാവം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നിലനിർത്തുന്നു; ‘ദൃക്സാക്ഷി’ എന്ന വ്യാഖ്യാനപരമായ നാമം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: μεμαρτύρηκεν
  choice: സാക്ഷ്യം പറഞ്ഞിരിക്കുന്നു
  rationale: പൂർത്തിയായ സാക്ഷ്യപ്രവൃത്തിക്കും അതിന്റെ തുടരുന്ന പ്രാബല്യത്തിനും ഇടം നൽകുന്ന പൂർണകാലഭാവം മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀληθινὴ ... ἡ μαρτυρία
  choice: അവന്റെ സാക്ഷ്യം സത്യമാണ്
  rationale: സാക്ഷ്യത്തിന്റെ സത്യതയും വിശ്വാസ്യതയും നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐκεῖνος
  choice: അവൻ
  rationale: മലയാളത്തിലെ ‘അവൻ’ മൂന്നാംപുരുഷ പരാമർശം സ്വാഭാവികമായി നിലനിർത്തുന്നു; സാക്ഷി വിവരണകർത്താവുതന്നെയാണോ മറ്റൊരാളാണോ എന്നു നിർണ്ണയിക്കുന്നില്ല. ‘ആ ആൾ’ എന്ന അത്യന്തം അടയാളപ്പെടുത്തിയ രൂപം ഇവിടെ അസ്വാഭാവികമാണ്.
- source_word: οἶδεν
  choice: അറിയുന്നു
  rationale: രൂപത്തിൽ പൂർണകാലമായിരുന്നാലും വർത്തമാന സ്ഥിതിഭാവമുള്ള οἶδα-യുടെ സാധാരണ അർഥം നൽകുന്നു.
- source_word: ἀληθῆ λέγει
  choice: താൻ സത്യമാണു പറയുന്നത്
  rationale: നപുംസകലിംഗ ബഹുവചന വിശേഷണവും λέγει-യും ചേർന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള അർഥം നൽകുന്നു.
- source_word: ἵνα καὶ ὑμεῖς πιστεύητε
  choice: നിങ്ങളും വിശ്വസിക്കേണ്ടതിനായി
  rationale: ἵνα-യുടെ ഉദ്ദേശ്യഭാവവും καί-യുടെ ഉൾപ്പെടുത്തൽഭാവവും നിലനിർത്തുന്നു; πιστεύητε-യിലെ വിശ്വാസത്തിന്റെ ആരംഭമോ തുടർച്ചയോ മുഖ്യപാഠത്തിൽ നിർണ്ണയിക്കുന്നില്ല.
theological_decisions:
- issue: വാക്യത്തിലെ ഊന്നലുള്ള മൂന്നാംപുരുഷ പരാമർശങ്ങളുടെ സൂചിതവ്യക്തി
  choice: ‘കണ്ടവൻ’, ‘അവൻ’ എന്നീ മൂന്നാംപുരുഷ രൂപങ്ങൾ നിലനിർത്തി സൂചിതവ്യക്തിയെ തിരിച്ചറിയാതെ വിടുന്നു.
  alternative: പ്രിയശിഷ്യൻ/വിവരണകർത്താവ് തന്നെ മൂന്നാംപുരുഷനായി പറയുന്നതായി വ്യക്തമാക്കുക; അല്ലെങ്കിൽ വേറൊരു ദൃക്സാക്ഷിയെന്ന് വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്ക് പാഠം സാക്ഷിയെ പേരെടുത്തു തിരിച്ചറിയുന്നില്ല; അതിനാൽ വിവർത്തനം ആ അവ്യക്തത സംരക്ഷിക്കുന്നു.
- issue: πιστεύητε എന്നതിന്റെ കാലഭാവം
  choice: വിശ്വസിക്കേണ്ടതിനായി
  alternative: വിശ്വാസത്തിൽ തുടരേണ്ടതിനായി
  rationale: വർത്തമാനകാല സബ്ജങ്ക്ടീവിന് തുടർച്ചയുടെ ഭാവം ഉണ്ടാകാമെങ്കിലും, ഈ സന്ദർഭത്തിൽ ആരംഭപരവും തുടർച്ചാപരവുമായ അർഥങ്ങൾക്ക് സാധ്യതയുണ്ട്. നിർണ്ണയിക്കാത്ത രൂപം മുഖ്യപാഠത്തിലും തുടർച്ചാഭാവം അടിക്കുറിപ്പിലും നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. സാക്ഷ്യവുമായി ബന്ധപ്പെട്ട പദസാമ്യം നിലനിർത്തുകയും ദൃക്സാക്ഷിയുടെ തിരിച്ചറിയലും വിശ്വാസത്തിന്റെ കാലഭാവവും അനാവശ്യമായി തീർപ്പാക്കാതിരിക്കുകയും ചെയ്തു.
