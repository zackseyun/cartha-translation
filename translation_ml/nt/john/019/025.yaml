reference: John 19:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εἱστήκεισαν δὲ παρὰ τῷ σταυρῷ τοῦ Ἰησοῦ ἡ μήτηρ αὐτοῦ καὶ ἡ ἀδελφὴ τῆς μητρὸς αὐτοῦ, Μαρία ἡ τοῦ Κλωπᾶ καὶ Μαρία ἡ Μαγδαληνή.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/025.yaml
  text: Standing by the cross of Jesus were his mother[a], and his mother's sister, Mary the wife of Clopas[b], and Mary Magdalene.
translation:
  language: ml
  text: യേശുവിന്റെ ക്രൂശിനരികെ അവന്റെ അമ്മയും, അവന്റെ അമ്മയുടെ സഹോദരിയും[b], ക്ലോപ്പാസിന്റെ മറിയയും[a], മഗ്ദലക്കാരിയായ മറിയയും നിന്നിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ മറിയയ്ക്ക് ക്ലോപ്പാസുമായുള്ള കൃത്യമായ ബന്ധം ഗ്രീക്ക് വ്യക്തമാക്കുന്നില്ല; ‘ക്ലോപ്പാസിന്റെ ഭാര്യയായ മറിയ’ എന്ന വ്യാഖ്യാനം സാധാരണമാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘അവന്റെ അമ്മയുടെ സഹോദരി’യും ‘ക്ലോപ്പാസിന്റെ മറിയ’യും ഒരേ വ്യക്തിയാണെന്നു വായിച്ചാൽ, ഇവിടെ നാലുപേർക്കു പകരം മൂന്നു സ്ത്രീകളെയാണ് പരാമർശിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: Εἱστήκεισαν
  choice: നിന്നിരുന്നു
  rationale: പ്ലൂപർഫെക്റ്റ് രൂപം ഇവിടെ തുടരുന്ന നിലയെ വിവരിക്കുന്നു; ‘നിന്നിരുന്നു’ എന്നത് ആ ദൈർഘ്യഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇവിടെ ശക്തമായ വിരോധമല്ല, ആഖ്യാനത്തിലെ മൃദുവായ മാറ്റമാണ് സൂചിപ്പിക്കുന്നത്; മലയാള വാക്യക്രമത്തിൽ അധിക ബന്ധകപദമില്ലാതെയും അത് സ്വാഭാവികമാണ്.
- source_word: παρὰ τῷ σταυρῷ
  choice: ക്രൂശിനരികെ
  rationale: ദത്തിവിനോടുകൂടിയ παρά സമീപസ്ഥിതിയെ സൂചിപ്പിക്കുന്നു; ‘ക്രൂശിനരികെ’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: τοῦ Ἰησοῦ
  choice: യേശുവിന്റെ
  rationale: ക്രൂശുമായുള്ള ഗ്രീക്ക് ഷഷ്ഠീബന്ധം വികസിപ്പിക്കാതെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἡ μήτηρ αὐτοῦ
  choice: അവന്റെ അമ്മ
  rationale: മൂലത്തിലെ സർവനാമവും ബന്ധവും നേരിട്ട്, സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἡ ἀδελφὴ τῆς μητρὸς αὐτοῦ
  choice: അമ്മയുടെ സഹോദരി
  rationale: ഗ്രീക്ക് ഷഷ്ഠീഘടനയുടെ സ്വാഭാവിക മലയാളരൂപം; ‘അവന്റെ’ എന്നത് സമീപസന്ദർഭത്തിൽ വ്യക്തമായതിനാൽ അനാവശ്യ ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: Μαρία ἡ τοῦ Κλωπᾶ
  choice: ക്ലോപ്പാസിന്റെ ഭാര്യ മറിയ
  rationale: ബന്ധസൂചകമായ ലേഖനം + ഷഷ്ഠീ ഘടനയെ സന്ദർഭത്തിൽ സാധാരണയായി മനസ്സിലാക്കുന്ന ദാമ്പത്യബന്ധമായി മുഖ്യവാചകത്തിൽ അവതരിപ്പിക്കുന്നു; ഗ്രീക്കിൽ ‘ഭാര്യ’ എന്ന് തുറന്നുപറയാത്തതിനാൽ കൂടുതൽ അക്ഷരാർഥമായ രൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: Μαρία ἡ Μαγδαληνή
  choice: മഗ്ദലക്കാരി മറിയ
  rationale: മഗ്ദല സ്വദേശിനിയെന്ന തിരിച്ചറിയൽ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: ക്രൂശിനരികിലുണ്ടായിരുന്ന സ്ത്രീകളുടെ തിരിച്ചറിയലും എണ്ണവും
  choice: യേശുവിന്റെ അമ്മ, അവന്റെ അമ്മയുടെ സഹോദരി, ക്ലോപ്പാസിന്റെ ഭാര്യ മറിയ, മഗ്ദലക്കാരി മറിയ എന്നിങ്ങനെ നാലുപേരെ പട്ടികപ്പെടുത്തുന്നതായി മുഖ്യവാചകം നൽകുന്നു.
  alternative: ‘അമ്മയുടെ സഹോദരി’യും ‘ക്ലോപ്പാസിന്റെ മറിയ’യും ഒരേ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സമാനാധികരണ പ്രയോഗമായി എടുത്ത് മൂന്നു സ്ത്രീകളുടെ പട്ടികയായി വായിക്കാം.
  rationale: ഗ്രീക്ക് വാക്യഘടന നാലു സമാന്തര നാമഘടകങ്ങളായി വായിക്കാൻ അനുകൂലമാണെങ്കിലും, ചുരുക്കിയ ഘടന മൂന്നു സ്ത്രീകളുടെ വായനയും അനുവദിക്കുന്നു. അതിനാൽ മുഖ്യവാചകത്തിൽ നാലുപേരുടെ വായന പിന്തുടർന്ന് മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘ക്രൂശ്’, ‘മഗ്ദലക്കാരി’ എന്നീ പരിചിതമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തി; ഗ്രീക്കിലെ ദൈർഘ്യഭാവവും വ്യക്തികളുടെ എണ്ണത്തെക്കുറിച്ചുള്ള യഥാർഥ അനിശ്ചിതത്വവും സംരക്ഷിച്ചു.
