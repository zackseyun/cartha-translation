id: JHN.19.11
reference: John 19:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀αὐτῷ Ἰησοῦς· Οὐκ εἶχες ἐξουσίαν ⸂κατ’ ἐμοῦ οὐδεμίαν⸃ εἰ μὴ ἦν ⸂δεδομένον σοι⸃ ἄνωθεν· διὰ τοῦτο ὁ ⸀παραδούς μέ σοι μείζονα ἁμαρτίαν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/011.yaml
  text: Jesus answered him[a], “You would have no authority over me at all unless it had been given to you from above[b]. Therefore the one who handed me over to you has the greater sin.”
translation:
  language: ml
  text: 'യേശു അവനോടു ഉത്തരം പറഞ്ഞു: “മുകളിൽനിന്ന്[a] നിനക്കു നൽകപ്പെട്ടിരുന്നില്ലെങ്കിൽ, എന്റെമേൽ നിനക്ക് യാതൊരു അധികാരവും ഉണ്ടാകുമായിരുന്നില്ല. അതുകൊണ്ട്, എന്നെ നിനക്ക് ഏൽപ്പിച്ചവന്റെ[b] പാപമാണ് കൂടുതൽ ഗുരുതരം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സ്വർഗത്തിൽനിന്ന്.” ഗ്രീക്കിൽ “മുകളിൽനിന്ന്” എന്നാണ്; യോഹന്നാന്റെ രചനകളിൽ ഇത് പലപ്പോഴും ദൈവിക ഉറവിടത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: യേശുവിനെ ഏൽപ്പിച്ചവൻ ആരാണെന്ന് ഇവിടെ വ്യക്തമായി പറയുന്നില്ല. യൂദാസ്, കയ്യഫാവ്, അല്ലെങ്കിൽ യെഹൂദനേതൃത്വം എന്നിങ്ങനെ വ്യത്യസ്തമായി മനസ്സിലാക്കപ്പെട്ടിട്ടുണ്ട്.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξουσίαν
  choice: അധികാരം
  rationale: പീലാത്തൊസിന്റെ ഭരണപരവും ന്യായാധിപത്യപരവുമായ അധികാരപരിധിയെ സന്ദർഭത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; വെറും ബലശേഷി എന്ന അർഥം ഒഴിവാക്കുന്നു.
- source_word: κατ’ ἐμοῦ οὐδεμίαν
  choice: എന്റെമേൽ ... യാതൊരു അധികാരവും
  rationale: κατάയോടുകൂടിയ ἐξουσίαയുടെ സന്ദർഭോചിതമായ അർഥം ‘എന്റെമേലുള്ള അധികാരം’ എന്നാണ്; ‘യാതൊരു ...വും’ οὐδεμίαν എന്ന ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: δεδομένον σοι
  choice: നിനക്കു നൽകപ്പെട്ടിരുന്നില്ലെങ്കിൽ
  rationale: പീലാത്തൊസിന്റെ ഇപ്പോഴുള്ള അധികാരത്തിനു മുമ്പേ അത് നൽകപ്പെട്ടതാണെന്ന പൂർത്തീകരിക്കപ്പെട്ട കർമഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἄνωθεν
  choice: മുകളിൽനിന്ന്
  rationale: യോഹന്നാനിലെ ദൈവിക ഉറവിടസൂചന നിലനിർത്തിക്കൊണ്ട്, ‘സ്വർഗത്തിൽനിന്ന്’ എന്നു വ്യാഖ്യാനം കൂടുതൽ വ്യക്തമാക്കാതെ ഗ്രീക്കിന്റെ അടിസ്ഥാനരൂപം സംരക്ഷിക്കുന്നു.
- source_word: διὰ τοῦτο
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യത്തിൽനിന്നുള്ള കാരണപരവും നിഗമനാത്മകവുമായ ബന്ധം ലളിതമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὁ παραδούς μέ σοι
  choice: എന്നെ നിനക്ക് ഏൽപ്പിച്ചവൻ
  rationale: παραδίδωμι എന്നതിന്റെ പീഡാനുഭവവിവരണത്തിലെ അർഥം നൽകുന്നു; യൂദാസ്, കയ്യഫാവ്, യെഹൂദനേതൃത്വം എന്നിവയിൽ ആരെയെങ്കിലും മുൻകൂട്ടി നിർണ്ണയിക്കുന്നില്ല.
- source_word: μείζονα ἁμαρτίαν ἔχει
  choice: പാപമാണ് കൂടുതൽ ഗുരുതരം
  rationale: താരതമ്യാത്മകമായ μείζονα വ്യക്തമായി നിലനിർത്തുകയും ‘കൂടുതൽ വലിയ പാപം അവനുണ്ട്’ എന്ന അസ്വാഭാവികമായ പദാനുപദരൂപം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ἄνωθεν സൂചിപ്പിക്കുന്ന പീലാത്തൊസിന്റെ അധികാരത്തിന്റെ ഉറവിടം
  choice: ‘മുകളിൽനിന്ന്’ എന്ന് പരിഭാഷപ്പെടുത്തി ദൈവിക ഉറവിടസൂചന നിലനിർത്തുന്നു; ഈ ഒറ്റ സംഭവത്തിനപ്പുറമുള്ള സമഗ്ര രാഷ്ട്രീയദൈവശാസ്ത്രം വാക്യത്തിൽ ചേർക്കുന്നില്ല.
  alternative: ‘സ്വർഗത്തിൽനിന്ന്’
  rationale: ഇവിടെ ഉയർന്ന ദൈവിക ഉറവിടമാണ് സൂചിപ്പിക്കപ്പെടുന്നത്; എങ്കിലും മൂലപദത്തിന്റെ രൂപകാത്മക തുറവ് സംരക്ഷിക്കുന്നതാണ് ഉചിതം.
- issue: ὁ παραδούς μέ σοι എന്നതിന്റെ വ്യക്തിത്വം
  choice: പ്രധാനപാഠത്തിൽ ‘എന്നെ നിനക്ക് ഏൽപ്പിച്ചവൻ’ എന്നു വ്യക്തിയെ പേരുപറയാതെ നിലനിർത്തുന്നു.
  alternative: യൂദാസ്, കയ്യഫാവ്, അല്ലെങ്കിൽ യെഹൂദനേതൃത്വം
  rationale: ഗ്രീക്ക് പാഠം ഇവിടെ ആ വ്യക്തിയെ വ്യക്തമായി തിരിച്ചറിയുന്നില്ല; അതിനാൽ വിവാദമായ തിരിച്ചറിയൽ പരിഭാഷയിൽ തീർപ്പാക്കുന്നില്ല.
- issue: ‘കൂടുതൽ ഗുരുതരമായ പാപം’ എന്ന താരതമ്യം
  choice: പീലാത്തൊസിനും ഏൽപ്പിച്ചവനും ഉത്തരവാദിത്വമുണ്ടെന്ന സൂചന നിലനിർത്തിക്കൊണ്ട്, ഏൽപ്പിച്ചവന്റെ പാപം കൂടുതൽ ഗുരുതരമാണെന്ന് പറയുന്നു.
  alternative: പീലാത്തൊസ് പാപരഹിതനാണെന്ന വായന
  rationale: താരതമ്യം പീലാത്തൊസിന്റെ കുറ്റം ഇല്ലാതാക്കുന്നില്ല; മറ്റേയാളുടെ കുറ്റം കൂടുതലാണെന്നു മാത്രമാണ് പ്രസ്താവിക്കുന്നത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ഗദ്യം. ‘എന്റെമേൽ’ എന്ന പ്രയോഗം അധികാരബന്ധം വ്യക്തമാക്കുന്നു; ‘പാപമാണ് കൂടുതൽ ഗുരുതരം’ എന്ന രൂപം ഗ്രീക്കിലെ താരതമ്യം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു. അടിക്കുറിപ്പുകളുടെ ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങളോടുതന്നെ ചേർത്തിരിക്കുന്നു.
