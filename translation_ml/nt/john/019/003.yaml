- from: അവർ അവന്റെ അടുത്തേക്കു വന്ന്, “യഹൂദന്മാരുടെ രാജാവേ, ജയജയ![a]” എന്നു പറഞ്ഞുകൊണ്ടിരുന്നു.[b] അവർ അവനെ അടിച്ചുകൊണ്ടുമിരുന്നു.
  to: അവർ അവന്റെ അടുക്കലേക്കു വന്ന്, “യഹൂദന്മാരുടെ രാജാവേ, ജയ![a]” എന്നു പറഞ്ഞുകൊണ്ടിരുന്നു.[b] അവർ അവനെ കൈപ്പത്തികൊണ്ട് അടിച്ചുകൊണ്ടുമിരുന്നു.
  rationale: The revision replaces the less idiomatic reduplicated acclamation with natural ‘ജയ!’ and makes the final action correspond more closely to ῥαπίσματα as hand-slaps. It also corrects the aspectual footnote so that it accounts for every imperfect verb in the verse. No doctrinal interpretation is added.
