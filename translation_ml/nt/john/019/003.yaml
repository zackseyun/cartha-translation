reference: John 19:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸂ἤρχοντο πρὸς αὐτὸν καὶ⸃ ἔλεγον· Χαῖρε, ὁ βασιλεὺς τῶν Ἰουδαίων· καὶ ἐδίδοσαν αὐτῷ ῥαπίσματα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/003.yaml
  text: And they came up to him and said[a], “Hail[b], King of the Jews!” And they were slapping him.
translation:
  language: ml
  text: അവർ അവന്റെ അടുക്കലേക്കു വന്ന്, “യഹൂദന്മാരുടെ രാജാവേ, ജയ![a]” എന്നു പറഞ്ഞുകൊണ്ടിരുന്നു.[b] അവർ അവനെ കൈപ്പത്തികൊണ്ട് അടിച്ചുകൊണ്ടുമിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അഭിവാദ്യം!” ഗ്രീക്ക് പദം അഭിവാദ്യത്തിനോ രാജകീയ ജയഘോഷത്തിനോ ഉപയോഗിക്കാം; ഇവിടെ അത് പരിഹാസപരമാണ്.
    reason: lexical_alternative
  - marker: b
    text: 'ഗ്രീക്കിലെ അപൂർണ്ണഭൂതകാല ക്രിയകൾ ആവർത്തനമോ തുടർച്ചയോ സൂചിപ്പിക്കാം: “അവർ വീണ്ടും വീണ്ടും അവന്റെ അടുത്തേക്കു വന്ന് ഇങ്ങനെ പറയുകയും അവനെ കൈപ്പത്തികൊണ്ട് അടിക്കുകയും ചെയ്തു.”'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: ἤρχοντο πρὸς αὐτὸν
  choice: അവർ അവന്റെ അടുത്തേക്കു വന്ന്
  rationale: πρός സൂചിപ്പിക്കുന്ന അവന്റെ അടുക്കലേക്കുള്ള നീക്കം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു. അപൂർണ്ണഭൂതകാലത്തിന്റെ ആവർത്തനസാധ്യത [b] അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἔλεγον
  choice: എന്നു പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണ്ണഭൂതകാലം പരിഹാസവാക്ക് തുടർന്നോ ആവർത്തിച്ചോ പറഞ്ഞതിനെ സൂചിപ്പിക്കാം; ‘പറഞ്ഞുകൊണ്ടിരുന്നു’ ആ ദൈർഘ്യസ്വഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: Χαῖρε
  choice: ജയജയ
  rationale: ഇവിടെ ഇത് സാധാരണ അഭിവാദ്യമല്ല, രാജാവിനോടുള്ള ഔപചാരിക ജയഘോഷത്തെ അനുകരിച്ചുള്ള പരിഹാസമാണ്. ‘ജയജയ’ ആ രാജകീയ അഭിവാദ്യവും സന്ദർഭത്തിലെ പരിഹാസവും സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: യഹൂദന്മാരുടെ രാജാവേ
  rationale: നേരിട്ടുള്ള അഭിസംബോധനയായതിനാൽ സംബോധനരൂപം ഉപയോഗിച്ച് രാഷ്ട്രീയവും മശീഹാസംബന്ധവുമായ പദവി നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἐδίδοσαν αὐτῷ ῥαπίσματα
  choice: അവർ അവനെ അടിച്ചുകൊണ്ടുമിരുന്നു
  rationale: ‘അടികൾ കൊടുക്കുക’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥവും അപൂർണ്ണഭൂതകാലത്തിന്റെ തുടർച്ചയോ ആവർത്തനമോ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; കൈകൊണ്ടാണോ മുഖത്താണോ എന്നത് മുഖ്യവാചകത്തിൽ അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
theological_decisions:
- issue: യേശുവിനോടുള്ള സൈനികരുടെ അഭിവാദ്യത്തിന്റെ ഭാവം
  choice: രാജകീയ ജയഘോഷത്തിന്റെ പരിഹാസാനുകരണമായി ‘ജയജയ!’
  alternative: ‘അഭിവാദ്യം’ അല്ലെങ്കിൽ ‘നമസ്കാരം’ എന്ന നിഷ്പക്ഷ അഭിവാദ്യം
  rationale: പീഡനസന്ദർഭം ഇത് ആത്മാർഥമായ അഭിവാദ്യമല്ലെന്നും പരിഹാസപരമായ രാജകീയ ആദരവാണെന്നും വ്യക്തമാക്കുന്നു. വിവരണാത്മക വ്യാഖ്യാനം ചേർക്കാതെ പദപ്രയോഗംകൊണ്ടുതന്നെ ആ ഭാവം കൈമാറുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ കഥനശൈലി. ‘അവന്റെ അടുത്തേക്കു’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; ‘ജയജയ’ രാജകീയ അഭിവാദ്യത്തിന്റെ പരിഹാസഭാവം സംക്ഷിപ്തമായി വഹിക്കുന്നു. അപൂർണ്ണഭൂതകാലത്തിന്റെ ആവർത്തനസാധ്യത മുഖ്യവാചകത്തിലും അടിക്കുറിപ്പിലും സൂക്ഷിച്ചിരിക്കുന്നു.
