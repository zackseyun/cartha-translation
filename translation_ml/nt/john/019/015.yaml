id: JHN.19.15
reference: John 19:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂ἐκραύγασαν οὖν ἐκεῖνοι⸃· Ἆρον ἆρον, σταύρωσον αὐτόν. λέγει αὐτοῖς ὁ Πιλᾶτος· Τὸν βασιλέα ὑμῶν σταυρώσω; ἀπεκρίθησαν οἱ ἀρχιερεῖς· Οὐκ ἔχομεν βασιλέα εἰ μὴ Καίσαρα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/015.yaml
  text: So they cried out[a], “Away, away! Crucify him!” Pilate said to them, “Shall I crucify your king?” The chief priests answered, “We have no king except Caesar.”
translation:
  language: ml
  text: 'അപ്പോൾ അവർ ഉച്ചത്തിൽ വിളിച്ചുപറഞ്ഞു: “കൊണ്ടുപോകൂ! കൊണ്ടുപോകൂ! അവനെ ക്രൂശിക്കൂ!” പീലാത്തോസ് അവരോട് ചോദിച്ചു: “നിങ്ങളുടെ രാജാവിനെ ഞാൻ ക്രൂശിക്കണമെന്നോ?” മുഖ്യപുരോഹിതന്മാർ മറുപടി പറഞ്ഞു: “കൈസറല്ലാതെ ഞങ്ങൾക്ക് രാജാവില്ല.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκραύγασαν
  choice: ഉച്ചത്തിൽ വിളിച്ചുപറഞ്ഞു
  rationale: വലിയ ശബ്ദത്തിലുള്ള കൂട്ടനിലവിളി എന്ന ശക്തി നിലനിർത്തുന്നു; പ്രത്യേകമായ വികാരഭാവം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: οὖν
  choice: അപ്പോൾ
  rationale: ഇവിടെ മുൻസംഭവത്തിന്റെ ഫലത്തെയും കഥയുടെ തുടർച്ചയെയും സ്വാഭാവികമായ മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἐκεῖνοι
  choice: അവർ
  rationale: ഗ്രീക്കിലെ ചൂണ്ടിക്കാട്ടുന്ന സർവനാമത്തിന്റെ ഊന്നൽ സന്ദർഭത്തിൽ വ്യക്തമാണ്; മലയാളത്തിൽ ‘അവർ’ സ്വാഭാവികമാണ്.
- source_word: Ἆρον ἆρον
  choice: കൊണ്ടുപോകൂ! കൊണ്ടുപോകൂ!
  rationale: ആവർത്തിച്ച ആജ്ഞയുടെ അടിയന്തരതയും നീക്കംചെയ്യണമെന്ന ജനക്കൂട്ടത്തിന്റെ ആവശ്യവും നിലനിർത്തുന്നു. ഗ്രീക്കിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ലാത്തതിനാൽ ഈ വാക്യഭാഗത്തിൽ ‘അവനെ’ ചേർത്തിട്ടില്ല.
- source_word: σταύρωσον αὐτόν
  choice: അവനെ ക്രൂശിക്കൂ
  rationale: റോമൻ വധശിക്ഷയുടെ ചരിത്രപരമായ അർഥം കൃത്യമായി നൽകുന്നു; αὐτόν എന്ന കർമവും വ്യക്തമാക്കുന്നു.
- source_word: λέγει αὐτοῖς ὁ Πιλᾶτος
  choice: പീലാത്തോസ് അവരോട് ചോദിച്ചു
  rationale: ചരിത്രവർത്തമാനത്തെ സ്വാഭാവിക മലയാള ആഖ്യാനത്തിലെ ഭൂതകാലമാക്കി; പിന്നാലെയുള്ള ചോദ്യം കണക്കിലെടുത്ത് ‘ചോദിച്ചു’ എന്നു നൽകി.
- source_word: Τὸν βασιλέα ὑμῶν σταυρώσω
  choice: നിങ്ങളുടെ രാജാവിനെ ഞാൻ ക്രൂശിക്കണമെന്നോ?
  rationale: ആലോചനാത്മക subjunctive-ന്റെ പരിഹാസവും വെല്ലുവിളിയും നിറഞ്ഞ ചോദ്യശക്തി സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: οἱ ἀρχιερεῖς
  choice: മുഖ്യപുരോഹിതന്മാർ
  rationale: നേതൃത്വസ്ഥാനത്തുള്ള പുരോഹിതാധികാരികളെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗതവും വ്യക്തവുമായ മലയാള പദപ്രയോഗം.
- source_word: Οὐκ ἔχομεν βασιλέα εἰ μὴ Καίσαρα
  choice: കൈസറല്ലാതെ ഞങ്ങൾക്ക് രാജാവില്ല
  rationale: εἰ μὴ സൂചിപ്പിക്കുന്ന ഏക അപവാദവും രാഷ്ട്രീയ കൂറിന്റെ കടുത്ത പ്രഖ്യാപനവും അധിക വ്യാഖ്യാനം കൂടാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: മുഖ്യപുരോഹിതന്മാരുടെ രാഷ്ട്രീയ കൂറിന്റെ പ്രഖ്യാപനം
  choice: കൈസറല്ലാതെ ഞങ്ങൾക്ക് രാജാവില്ല
  alternative: കൈസർ ഒഴികെ ഞങ്ങൾക്ക് രാജാവില്ല
  rationale: കൈസർ മാത്രമാണ് രാജാവ് എന്ന പ്രസ്താവനയുടെ ശക്തിയും യേശുവിന്റെ രാജത്വത്തെക്കുറിച്ചുള്ള ആഖ്യാനത്തിലെ സംഘർഷവും വിശദീകരിച്ച് തീർപ്പാക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ജനക്കൂട്ടത്തിന്റെ ആവർത്തിച്ച ആജ്ഞയ്ക്ക് ചുരുങ്ങിയ, ശക്തമായ രൂപവും പീലാത്തോസിന്റെ ചോദ്യത്തിന് പരിഹാസാത്മക വെല്ലുവിളി കേൾക്കുന്ന രൂപവും ഉപയോഗിച്ചു. നൽകിയ ഇംഗ്ലീഷ് അടിക്കുറിപ്പ് അതിന്റെ സൂചകസ്ഥാനത്തോടും ഉള്ളടക്കത്തോടും പൊരുത്തപ്പെടാത്തതിനാൽ, ഗ്രീക്ക് സ്രോതസ്സിൽ ആവശ്യമായ ലെക്സിക്കൽ ബദൽ ഇല്ലാത്ത സാഹചര്യത്തിൽ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
