  source_fidelity: 'ഗ്രീക്ക് പാഠത്തിലെ ക്രമവും അർഥവും നന്നായി നിലനിർത്തിയിരിക്കുന്നു: οὖν-ന്റെ ആഖ്യാനപുരോഗതി, ആവർത്തിച്ച Ἆρον ἆρον, σταύρωσον αὐτόν-ന്റെ വ്യക്തമായ കർമം, പീലാത്തോസിന്റെ ആലോചനാത്മക ചോദ്യം, εἰ μὴ-യുടെ բացառണാർഥം എന്നിവ എല്ലാം യോജിച്ചതാണ്. ‘കൊണ്ടുപോകൂ! കൊണ്ടുപോകൂ!’ ഗ്രീക്കിൽ കർമം പറയാതിരിക്കുന്നതും സംരക്ഷിക്കുന്നു.'
