source:
  edition: SBLGNT
  text: ἐγένετο γὰρ ταῦτα ἵνα ἡ γραφὴ πληρωθῇ· Ὀστοῦν οὐ συντριβήσεται ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/036.yaml
  text: 'For these things happened so that the Scripture might be fulfilled: “Not one of his bones will be broken.”[a]'
translation:
  language: ml
  text: 'കാരണം, തിരുവെഴുത്ത് നിറവേറേണ്ടതിന് ഇവ സംഭവിച്ചു: “അവന്റെ ഒരു അസ്ഥിയും ഒടിക്കപ്പെടുകയില്ല.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഗ്രീക്ക്: “അവന്റെ ഒരു അസ്ഥി ഒടിക്കപ്പെടുകയില്ല.” ഗ്രീക്കിലെ ഏകവചനമായ “അസ്ഥി” ഇവിടെ “ഒരു അസ്ഥിയും” എന്ന മലയാള പ്രയോഗത്തിലൂടെ സ്വാഭാവികമായി പ്രകടിപ്പിച്ചിരിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο γὰρ ταῦτα
  choice: ഇവ സംഭവിച്ചത്
  rationale: മുൻവിവരിച്ച സംഭവങ്ങളെയാണ് ταῦτα സൂചിപ്പിക്കുന്നത്. γάρ നൽകുന്ന വിശദീകരണബന്ധം മലയാളത്തിലെ കാരണ-ഉദ്ദേശ്യഘടനയിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: ἵνα ἡ γραφὴ πληρωθῇ
  choice: തിരുവെഴുത്ത് നിറവേറേണ്ടതിനായിരുന്നു
  rationale: ἵνα സഹിതമുള്ള കർമണിപ്രയോഗം ഉദ്ദേശ്യവും നിറവേറലും സൂചിപ്പിക്കുന്നു. ഈ രൂപം ദൈവിക ഉദ്ദേശ്യത്തിന്റെ ഭാവം നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ മലയാളം നൽകുന്നു.
- source_word: ἡ γραφή
  choice: തിരുവെഴുത്ത്
  rationale: യോഹന്നാന്റെ പ്രയോഗത്തിൽ ഇത് വിശുദ്ധലിഖിതത്തെ സൂചിപ്പിക്കുന്നു; ആ അർത്ഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: Ὀστοῦν
  choice: അസ്ഥികളിൽ ഒന്നുപോലും
  rationale: ഗ്രീക്കിൽ ഏകവചനമായ ‘അസ്ഥി’ കൂട്ടായ അർത്ഥത്തിൽ ഉപയോഗിച്ചിരിക്കുന്നു. മലയാളത്തിൽ ഉദ്ദേശിച്ച അർത്ഥം സ്വാഭാവികമായി അറിയിക്കാൻ ഈ നിഷേധാത്മക പ്രയോഗം അനുയോജ്യമാണ്.
- source_word: οὐ συντριβήσεται
  choice: ഒടിക്കപ്പെടുകയില്ല
  rationale: ഭാവികാല കർമണിപ്രയോഗം നിലനിർത്തുന്നു; അസ്ഥിയുടെ സന്ദർഭത്തിൽ συντρίβω എന്നതിന്റെ യോജിച്ച അർത്ഥം ‘ഒടിക്കുക’ എന്നാണ്.
- source_word: αὐτοῦ
  choice: അവന്റെ
  rationale: ഗ്രീക്ക് സംബന്ധിക സർവനാമത്തെ മലയാളത്തിലെ സ്വാഭാവികമായ ഉടമസ്ഥരൂപത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: പുറപ്പാട് 12:46, സംഖ്യ 9:12, സങ്കീർത്തനം 34:20 എന്നിവയോടുള്ള സൂചന നിലനിർത്തിക്കൊണ്ട് ഏകവചന ഉദ്ധരണി മലയാളത്തിൽ അവതരിപ്പിക്കൽ
  choice: അവന്റെ അസ്ഥികളിൽ ഒന്നുപോലും ഒടിക്കപ്പെടുകയില്ല
  alternative: അവന്റെ ഒരു അസ്ഥി ഒടിക്കപ്പെടുകയില്ല
  rationale: ഗ്രീക്ക് പദം ഏകവചനമാണെങ്കിലും കൂട്ടായ അർത്ഥത്തിലാണ്. ‘അസ്ഥികളിൽ ഒന്നുപോലും’ എന്നത് ഉള്ളടക്കം കൂട്ടിച്ചേർക്കാതെ ആ അർത്ഥവും പഴയനിയമ സൂചനയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. പരമ്പരാഗത ബൈബിൾഭാഷയുടെ ഗൗരവം നിലനിർത്തിയെങ്കിലും പഴഞ്ചൻ പദക്രമം ഒഴിവാക്കി.
