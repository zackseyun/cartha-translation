  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐπὶ δὲ τὸν Ἰησοῦν ἐλθόντες, ὡς εἶδον ⸂ἤδη αὐτὸν⸃ τεθνηκότα, οὐ κατέαξαν αὐτοῦ τὰ σκέλη,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/033.yaml
  text: But when they came to Jesus[a], seeing that he was already dead[b], they did not break his legs.
translation:
  language: ml
  text: എന്നാൽ അവർ യേശുവിന്റെ അടുക്കൽ വന്നപ്പോൾ[a], അവൻ ഇതിനകം മരിച്ചുകഴിഞ്ഞതായി കണ്ടതിനാൽ[b], അവന്റെ കാലുകൾ ഒടിച്ചില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഈ പ്രവൃത്തിയെ യോഹന്നാൻ പിന്നീട് തിരുവെഴുത്തുമായി ബന്ധിപ്പിക്കുന്നു: “അവന്റെ അസ്ഥികളിൽ ഒന്നുപോലും ഒടിക്കപ്പെടുകയില്ല” (യോഹന്നാൻ 19:36; പുറപ്പാട് 12:46; സംഖ്യ 9:12; സങ്കീർത്തനം 34:20 എന്നിവയും കാണുക).'
    reason: cross_reference
  - marker: b
    text: 'അല്ലെങ്കിൽ: “അവൻ ഇതിനകം മരിച്ചിരുന്നുവെന്നു കണ്ടപ്പോൾ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ δὲ τὸν Ἰησοῦν ἐλθόντες
  choice: എന്നാൽ അവർ യേശുവിന്റെ അടുക്കൽ വന്നപ്പോൾ
  rationale: δέ മുൻവാക്യത്തിലെ മറ്റുള്ളവരോടു ചെയ്തതുമായി മൃദുവായ വൈരുധ്യം സൂചിപ്പിക്കുന്നു; പങ്കുപദപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായ കാലസൂചക ഉപവാക്യമായി നൽകി, യേശുവിന്റെ അടുക്കലേക്കുള്ള ചലനം നിലനിർത്തുന്നു.
- source_word: ὡς εἶδον
  choice: കണ്ടതിനാൽ
  rationale: ὡς ഇവിടെ തുടർന്നുള്ള നടപടി അവർ കണ്ട സാഹചര്യത്തെ ആശ്രയിച്ചതാണെന്ന ബോധവും കാരണബന്ധവും നൽകുന്നു; ‘കണ്ടതിനാൽ’ രണ്ടും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἤδη
  choice: ഇതിനകം
  rationale: അവർ എത്തുന്നതിനു മുമ്പേ മരണം സംഭവിച്ചിരുന്നു എന്ന കാലസൂചന നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: τεθνηκότα
  choice: മരിച്ചുകഴിഞ്ഞതായി
  rationale: θνῄσκω എന്ന ക്രിയയുടെ perfect participle മരണം സംഭവിച്ചതും അതിന്റെ ഫലാവസ്ഥ തുടരുന്നതും സൂചിപ്പിക്കുന്നു; ‘മരിച്ചുകഴിഞ്ഞതായി’ ഈ പൂർത്തിയായ സംഭവവും നിലയും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: οὐ κατέαξαν
  choice: ഒടിച്ചില്ല
  rationale: κατάγνυμι ഇവിടെ കൈകാലുകളിലെ അസ്ഥി ഒടിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘കാലുകൾ ഒടിക്കുക’ എന്നതാണ് കൃത്യവും സ്വാഭാവികവും.
- source_word: τὰ σκέλη
  choice: അവന്റെ കാലുകൾ
  rationale: σκέλη എന്നത് കാലുകളെ സൂചിപ്പിക്കുന്നു. അസ്ഥികളാണ് യാഥാർഥ്യത്തിൽ ഒടിക്കപ്പെടുന്നതെങ്കിലും, ‘കാലുകൾ ഒടിക്കുക’ എന്ന പ്രയോഗം മൂലവാചകത്തിന്റെ സാധാരണ അർഥം അനാവശ്യ വിശദീകരണമില്ലാതെ നൽകുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ കാലുകൾ ഒടിക്കാതിരുന്നതിൽ തിരുവെഴുത്തിന്റെ നിവൃത്തിയിലേക്കുള്ള സൂചന
  choice: മുഖ്യവാചകം സംഭവത്തെ നേരിട്ട് വിവരിക്കുന്നു; നിവൃത്തി എന്ന ആശയം ഈ വാക്യത്തിലേക്ക് ചേർത്തിട്ടില്ല.
  alternative: യോഹന്നാൻ 19:36-ലെ ‘അസ്ഥി’ എന്ന പദവുമായി ബന്ധം മുൻകൂട്ടി വ്യക്തമാക്കാൻ ‘കാലെല്ലുകൾ’ എന്നു പരിഭാഷപ്പെടുത്തുക.
  rationale: നിവൃത്തിയുമായുള്ള ബന്ധം യോഹന്നാൻ 19:36 തന്നെ വ്യക്തമായി പറയുന്നു. ഈ വാക്യത്തിൽ σκέλη എന്നത് സ്വാഭാവികമായി ‘കാലുകൾ’ എന്നാണ്; അതിനാൽ വ്യാഖ്യാനം മുഖ്യവാചകത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതെ ബന്ധം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം ഗൗരവമുള്ളതുമായ മലയാളം. ‘എന്നാൽ’ മൃദുവായ വൈരുധ്യം നിലനിർത്തുന്നു; ‘യേശുവിന്റെ അടുക്കൽ’ ദിശാബോധം സൂക്ഷിക്കുന്നു. മുഖ്യവാചകത്തിലെ [a], [b] അടയാളങ്ങൾ അനുബന്ധ അടിക്കുറിപ്പുകളുമായി കൃത്യമായി പൊരുത്തപ്പെടുന്നു.
