    rationale: ഗ്രീക്കിൽ പൂർത്തിയായതിന്റെ വ്യക്തമായ വിഷയം ഇല്ല. ‘എല്ലാം’ ചേർക്കുന്നത് വാക്യത്തിന്റെ തുറന്ന അർഥപരിധിയെ ചുരുക്കുകയും അധിക സമഗ്രത സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
