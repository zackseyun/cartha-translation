reference: John 19:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτε οὖν ἔλαβεν τὸ ὄξος ὁ Ἰησοῦς εἶπεν· Τετέλεσται, καὶ κλίνας τὴν κεφαλὴν παρέδωκεν τὸ πνεῦμα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/030.yaml
  text: So when Jesus had received the sour wine[a], he said, “It is finished,” and bowing his head[c][b], he gave up his spirit.
translation:
  language: ml
  text: 'അങ്ങനെ യേശു പുളിച്ച വീഞ്ഞ് സ്വീകരിച്ചപ്പോൾ പറഞ്ഞു: “പൂർത്തിയായിരിക്കുന്നു.”[a] പിന്നെ തല കുനിച്ച് തന്റെ ആത്മാവിനെ വിട്ടുകൊടുത്തു.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പൂർത്തിയായി,” “നിറവേറി,” അല്ലെങ്കിൽ “സമ്പൂർണമായി” എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്ക് പദം ഒരു പ്രവൃത്തി പൂർത്തിയായിരിക്കുന്നതും അതിന്റെ ഫലം നിലനിൽക്കുന്നതും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “അന്ത്യശ്വാസം വിട്ടു” എന്നും അർഥമാക്കാം. ഗ്രീക്കിൽ കൂടുതൽ അക്ഷരാർഥമായി, “തന്റെ ആത്മാവിനെ വിട്ടുകൊടുത്തു” എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτε οὖν
  choice: അങ്ങനെ, …പ്പോൾ
  rationale: ὅτε എന്നതിന്റെ കാലസൂചനയും οὖν എന്നതിന്റെ ആഖ്യാനപരമായ തുടർച്ചയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἔλαβεν
  choice: സ്വീകരിച്ചപ്പോൾ
  rationale: മുൻവാക്യത്തിൽ നീട്ടിക്കൊടുത്ത പുളിച്ച വീഞ്ഞ് യേശു സ്വീകരിച്ചതാണ് സന്ദർഭം; ‘എടുത്തപ്പോൾ’ എന്നതിനെക്കാൾ ‘സ്വീകരിച്ചപ്പോൾ’ ഇവിടെ സ്വാഭാവികമാണ്.
- source_word: τὸ ὄξος
  choice: പുളിച്ച വീഞ്ഞ്
  rationale: ὄξος സാധാരണയായി പുളിച്ച വീഞ്ഞിനെയോ വീഞ്ഞിൽനിന്നുള്ള വിനാഗിരിയെയോ സൂചിപ്പിക്കുന്നു. ആധുനിക വായനക്കാരന് തെറ്റിദ്ധാരണ കുറയ്ക്കുന്ന കൃത്യമായ പ്രയോഗമാണിത്.
- source_word: Τετέλεσται
  choice: എല്ലാം പൂർത്തിയായിരിക്കുന്നു
  rationale: τελέωയുടെ perfect രൂപം പൂർത്തിയായ പ്രവൃത്തിയെയും നിലനിൽക്കുന്ന ഫലത്തെയും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വതന്ത്രമായി നിൽക്കുന്ന വാക്കായി സ്വാഭാവികമാക്കാൻ ‘എല്ലാം’ ചേർത്തിട്ടുണ്ടെങ്കിലും പൂർത്തിയായത് എന്തെന്നത് വിശദീകരിച്ച് ദൈവശാസ്ത്രപരമായി ചുരുക്കുന്നില്ല.
- source_word: κλίνας τὴν κεφαλήν
  choice: തല കുനിച്ച്
  rationale: aorist participle സൂചിപ്പിക്കുന്ന, മുഖ്യക്രിയയ്ക്കു മുമ്പുള്ള പ്രവൃത്തി സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: παρέδωκεν τὸ πνεῦμα
  choice: തന്റെ ആത്മാവിനെ ഏൽപ്പിച്ചുകൊടുത്തു
  rationale: παραδίδωμι എന്ന ക്രിയയുടെ ‘ഏൽപ്പിക്കുക/കൈമാറുക’ എന്ന സജീവഭാവവും πνεῦμα എന്നതിന്റെ ‘ആത്മാവ്’ എന്ന അർഥഭാരവും നിലനിർത്തുന്നു; ‘മരിച്ചു’ എന്നു മാത്രം പറഞ്ഞ് സവിശേഷമായ ഗ്രീക്ക് പ്രയോഗത്തെ പൊതുവാക്കുന്നില്ല.
theological_decisions:
- issue: παρέδωκεν τὸ πνεῦμα എന്നത് മരണത്തെ സൂചിപ്പിക്കുന്ന സാധാരണ ശൈലിയായി മാത്രം വിവർത്തനം ചെയ്യണമോ, ആത്മാവിനെ ഏൽപ്പിക്കുന്ന സജീവഭാവം നിലനിർത്തണമോ
  choice: തന്റെ ആത്മാവിനെ ഏൽപ്പിച്ചുകൊടുത്തു
  alternative: അന്ത്യശ്വാസം വിട്ടു
  rationale: മൂലത്തിലെ വാക്കുകൾ മരണത്തെ സൂചിപ്പിക്കുമ്പോഴും, യേശുവിന്റെ പ്രവൃത്തിയുടെ സജീവവും വ്യക്തിപരവുമായ ഭാവത്തിന് സാധ്യത നൽകുന്നു. അതിനെ വ്യാഖ്യാനിച്ച് ഉറപ്പിക്കാതെയും നഷ്ടപ്പെടുത്താതെയും വാചകം സംരക്ഷിക്കുന്നു.
- issue: Τετέλεσται എന്നതിൽ പൂർത്തിയായത് എന്താണെന്ന് വ്യക്തമാക്കണമോ
  choice: എല്ലാം പൂർത്തിയായിരിക്കുന്നു
  alternative: അത് പൂർത്തിയായിരിക്കുന്നു
  rationale: ഗ്രീക്കിൽ വ്യക്തമായ കർത്താവോ വിഷയമോ ഇല്ല. മലയാളത്തിലെ ഉച്ചാരണത്തിന് സ്വാഭാവികത നൽകാൻ ‘എല്ലാം’ ഉപയോഗിച്ചെങ്കിലും, നിർദ്ദിഷ്ടമായ ഒരു ദൈവശാസ്ത്ര വ്യാഖ്യാനം ചേർക്കുന്നില്ല; പകരം അർഥപരിധി തുറന്നുവയ്ക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. പരമ്പരാഗത മതഭാഷയുടെ അനാവശ്യ കാഠിന്യം ഒഴിവാക്കി; എന്നാൽ ‘ആത്മാവ്’, ‘ഏൽപ്പിച്ചുകൊടുത്തു’ എന്നീ പദങ്ങളിലൂടെ മൂലത്തിന്റെ ദൈവശാസ്ത്രപരമായ സാധ്യതയും ഗൗരവവും സംരക്ഷിച്ചു.
