revisions:
- from: 'അങ്ങനെ, യേശു പുളിച്ച വീഞ്ഞ് സ്വീകരിച്ചപ്പോൾ പറഞ്ഞു: “എല്ലാം പൂർത്തിയായിരിക്കുന്നു.”[a] പിന്നെ തല കുനിച്ച് തന്റെ ആത്മാവിനെ ഏൽപ്പിച്ചുകൊടുത്തു.[b]'
  to: 'അങ്ങനെ യേശു പുളിച്ച വീഞ്ഞ് സ്വീകരിച്ചപ്പോൾ പറഞ്ഞു: “പൂർത്തിയായിരിക്കുന്നു.”[a] പിന്നെ തല കുനിച്ച് തന്റെ ആത്മാവിനെ വിട്ടുകൊടുത്തു.[b]'
  rationale: വാക്യത്തിന്റെ അടിസ്ഥാന അർഥവും ആഖ്യാനക്രമവും നിലനിർത്തിക്കൊണ്ട്, മൂലത്തിൽ ഇല്ലാത്ത ‘എല്ലാം’ ഒഴിവാക്കി. അവസാന ക്രിയയെ സ്വീകർത്താവിനെ നിർബന്ധമായി സൂചിപ്പിക്കാത്തതും ഗ്രീക്കിലെ സജീവമായ ഭാഷ സംരക്ഷിക്കുന്നതുമായ രീതിയിൽ പരിഷ്കരിച്ചു. അടിക്കുറിപ്പുകളും പരിഷ്കരിച്ച മുഖ്യവാചകവുമായി ഒത്തുനിൽക്കുന്നു.
