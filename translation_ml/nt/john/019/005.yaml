  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐξῆλθεν οὖν ὁ Ἰησοῦς ἔξω, φορῶν τὸν ἀκάνθινον στέφανον καὶ τὸ πορφυροῦν ἱμάτιον. καὶ λέγει αὐτοῖς· ⸀Ἰδοὺ ὁ ἄνθρωπος.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/005.yaml
  text: So Jesus came out[a], wearing the crown of thorns and the purple robe. And he says to them, “Behold, the man.”
translation:
  language: ml
  text: 'അപ്പോൾ യേശു മുൾക്കിരീടവും ധൂമ്രവർണത്തിലുള്ള മേലങ്കിയും ധരിച്ച് പുറത്തുവന്നു. അവൻ അവരോടു പറയുന്നു: “ഇതാ[a], ആ മനുഷ്യൻ!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നോക്കൂ” അല്ലെങ്കിൽ “കാണൂ” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ Ἰδοὺ ശ്രദ്ധ ക്ഷണിക്കുന്ന ഒരു പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν … ἔξω
  choice: പുറത്തുവന്നു
  rationale: പുറത്തേക്കുള്ള ചലനത്തെ സൂചിപ്പിക്കുന്ന ക്രിയയും അതിനെ ഊന്നുന്ന ക്രിയാവിശേഷണവും മലയാളത്തിൽ സ്വാഭാവികമായി ഒറ്റ ക്രിയയിൽ പ്രകടമാക്കുന്നു.
- source_word: οὖν
  choice: അപ്പോൾ
  rationale: മുൻസംഭവത്തിന്റെ തുടർച്ചയും അതിന്റെ ഫലമായി നടക്കുന്ന അടുത്ത സംഭവവും സ്വാഭാവികമായ ആഖ്യാനബന്ധകത്തിലൂടെ സൂചിപ്പിക്കുന്നു.
- source_word: φορῶν
  choice: ധരിച്ച്
  rationale: കിരീടവും വസ്ത്രവും ശരീരത്തിൽ അണിഞ്ഞിരിക്കുന്നതിനെ വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: ἀκάνθινον στέφανον
  choice: മുൾക്കിരീടം
  rationale: മുള്ളുകൾകൊണ്ടുണ്ടാക്കിയ കിരീടം എന്ന അർഥം ചുരുക്കമായും കൃത്യമായും നൽകുന്ന പ്രചാരത്തിലുള്ള മലയാളപ്രയോഗം.
- source_word: πορφυροῦν ἱμάτιον
  choice: ധൂമ്രവർണത്തിലുള്ള മേലങ്കി
  rationale: πορφυροῦν എന്ന നിറസൂചനയും ἱμάτιον എന്ന പുറംവസ്ത്രത്തിന്റെ പൊതുവായ അർഥവും നിലനിർത്തുന്നു; രാജവസ്ത്രമെന്ന് പാഠത്തിൽ ഇല്ലാത്ത പ്രത്യേകത ചേർക്കുന്നില്ല.
- source_word: λέγει
  choice: പറയുന്നു
  rationale: യോഹന്നാന്റെ ആഖ്യാനത്തിലെ ചരിത്രവർത്തമാനകാലത്തിന്റെ സജീവത നിലനിർത്തുന്നു.
- source_word: Ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിച്ചുകൊണ്ട് മുന്നിലുള്ള വ്യക്തിയെ പരസ്യമായി ചൂണ്ടിക്കാണിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ഗൗരവവും ദൃശ്യസ്വഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὁ ἄνθρωπος
  choice: ആ മനുഷ്യൻ
  rationale: ജനക്കൂട്ടത്തിനു മുന്നിൽ നിൽക്കുന്ന യേശുവെന്ന നിർദിഷ്ട പുരുഷനെ സൂചിപ്പിക്കുന്നു; അതോടൊപ്പം ഈ വാക്കുകളുടെ വിപുലമായ സാദ്ധ്യപ്രതിധ്വനികളെ വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: പീലാത്തോസിന്റെ പ്രഖ്യാപനത്തിലെ ὁ ἄνθρωπος
  choice: ആ മനുഷ്യൻ
  alternative: ആ മനുഷ്യജീവി
  rationale: സന്ദർഭത്തിൽ മുന്നിൽ നിൽക്കുന്ന യേശുവെന്ന നിർദിഷ്ട പുരുഷനെയാണ് നേരിട്ട് സൂചിപ്പിക്കുന്നത്. പ്രതിനിധി-മാനവത്വത്തെക്കുറിച്ചുള്ള സാദ്ധ്യമായ ദൈവശാസ്ത്രപ്രതിധ്വനി മുഖ്യവാചകത്തിൽ വിശദീകരിച്ച് അടിച്ചേൽപ്പിക്കാതെ വാചകത്തിന്റെ സാന്ദ്രത നിലനിർത്തുന്നു.
- issue: λέγει എന്ന ചരിത്രവർത്തമാനത്തിന്റെ കർത്താവ്
  choice: അവൻ അവരോടു പറയുന്നു
  alternative: പീലാത്തോസ് അവരോടു പറഞ്ഞു
  rationale: ഗ്രീക്കിൽ കർത്താവിന്റെ പേര് ഈ വാക്യത്തിൽ ആവർത്തിക്കുന്നില്ല; മുൻസന്ദർഭത്തിൽനിന്ന് പീലാത്തോസാണെന്ന് വ്യക്തമാണ്. സർവനാമവും വർത്തമാനകാലവും ഉപയോഗിച്ച് മൂലത്തിന്റെ ആഖ്യാനരീതിയും സജീവതയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. “ധൂമ്രവർണത്തിലുള്ള മേലങ്കി” നിറവും വസ്ത്രവിഭാഗവും വ്യക്തമായി നൽകുന്നു; “പറയുന്നു” ചരിത്രവർത്തമാനത്തിന്റെ സജീവത സംരക്ഷിക്കുന്നു.
