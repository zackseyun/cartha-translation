id: JHN.19.2
reference: John 19:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ οἱ στρατιῶται πλέξαντες στέφανον ἐξ ἀκανθῶν ἐπέθηκαν αὐτοῦ τῇ κεφαλῇ, καὶ ἱμάτιον πορφυροῦν περιέβαλον αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/002.yaml
  text: And the soldiers, after weaving a crown out of thorns, put it on his head and clothed him in a purple robe,
translation:
  language: ml
  text: പടയാളികൾ മുള്ളുകൾകൊണ്ട് ഒരു കിരീടം മെടഞ്ഞ് അവന്റെ തലയിൽ വെക്കുകയും അവനെ ഒരു ധൂമ്രവർണ വസ്ത്രം ധരിപ്പിക്കുകയും ചെയ്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στρατιῶται
  choice: പടയാളികൾ
  rationale: റോമൻ സൈനികരെ സൂചിപ്പിക്കുന്ന സന്ദർഭത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ ആധുനിക മലയാള പദം.
- source_word: πλέξαντες
  choice: മെടഞ്ഞ്
  rationale: മുള്ളുകൾ ചേർത്ത് കിരീടരൂപത്തിൽ ഉണ്ടാക്കിയ പ്രവൃത്തിയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുകയും പ്രധാന ക്രിയയ്ക്കു മുമ്പുള്ള പ്രവർത്തനക്രമം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: στέφανον ἐξ ἀκανθῶν
  choice: മുള്ളുകൾകൊണ്ട് ഒരു കിരീടം
  rationale: ἐξ എന്നത് വസ്തു/ഉറവിടം സൂചിപ്പിക്കുന്നതിനാൽ ‘മുള്ളുകൾകൊണ്ട്’ എന്ന് നൽകി; പരിഹാസാത്മകമായ രാജകീയ പ്രതീകം നിലനിർത്താൻ στέφανος ‘കിരീടം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: ἐπέθηκαν αὐτοῦ τῇ κεφαλῇ
  choice: അവന്റെ തലയിൽ വെക്കുകയും
  rationale: ഗ്രീക്കിലെ ദത്തിവ് ഘടനയെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; കിരീടമാണ് വെച്ചതെന്ന് സന്ദർഭം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἱμάτιον πορφυροῦν
  choice: ഒരു ധൂമ്രവർണ വസ്ത്രം
  rationale: ἱμάτιον എന്ന പൊതുവായ പുറംവസ്ത്രപദത്തെ ‘മേലങ്കി’യോ ‘രാജവസ്ത്രം’ എന്നോ അതിവിശദമാക്കാതെ ‘വസ്ത്രം’ എന്നു നൽകി; πορφυροῦν എന്ന വർണവും അതിന്റെ രാജകീയ സൂചനയും നിലനിർത്തുന്നു.
- source_word: περιέβαλον αὐτόν
  choice: അവനെ … ധരിപ്പിക്കുകയും ചെയ്തു
  rationale: വസ്ത്രം ഒരാളുടെ മേൽ അണിയിക്കുന്ന περιβάλλω എന്ന പ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാള രൂപം.
theological_decisions:
- issue: പടയാളികളുടെ പ്രവൃത്തികളിലെ പരിഹാസാത്മക രാജകീയ ദൃശ്യഭാവം
  choice: കിരീടവും ധൂമ്രവർണ വസ്ത്രവും സംബന്ധിച്ച പ്രവൃത്തികൾ ഉറവിടത്തിലുള്ളതുപോലെ നേരിട്ട് വിവരിക്കുക.
  alternative: ‘രാജാവെന്നു പരിഹസിക്കാൻ’ തുടങ്ങിയ വ്യാഖ്യാനാത്മക വാക്കുകൾ ചേർക്കുക.
  rationale: പരിഹാസം വിശാലസന്ദർഭത്തിൽ വ്യക്തമാണെങ്കിലും ഈ വാക്യം പ്രവൃത്തികൾ മാത്രമാണ് വിവരിക്കുന്നത്; ഉറവിടത്തിൽ ഇല്ലാത്ത ഉദ്ദേശ്യവിവരണം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വിവരണശൈലി. ഗ്രീക്കിലെ രണ്ട് καί ഘടകങ്ങളുടെ ഏകോപനം ‘വെക്കുകയും … ധരിപ്പിക്കുകയും ചെയ്തു’ എന്ന ഘടനയിൽ നിലനിർത്തി. പ്രസിദ്ധീകരണവാചകത്തിൽ അടിക്കുറിപ്പുകളില്ല; അതിനാൽ മുഖ്യപാഠത്തിൽ അടിക്കുറിപ്പ് ചിഹ്നവും ആവശ്യമില്ല.
