id: JHN.19.28
reference: John 19:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Μετὰ τοῦτο ⸀εἰδὼς ὁ Ἰησοῦς ὅτι ⸂ἤδη πάντα⸃ τετέλεσται ἵνα τελειωθῇ ἡ γραφὴ λέγει· Διψῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/028.yaml
  text: After this[a], Jesus, knowing that all things had already been completed, in order that the Scripture might be fulfilled, said, “I thirst.”
translation:
  language: ml
  text: ഇതിനുശേഷം, എല്ലാം ഇതിനകം പൂർത്തിയായിരിക്കുന്നുവെന്ന് അറിഞ്ഞ യേശു, തിരുവെഴുത്ത് നിറവേറേണ്ടതിന്, “എനിക്കു ദാഹിക്കുന്നു” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ τοῦτο
  choice: ഇതിനുശേഷം
  rationale: ഏകവചന സൂചകമായ τοῦτο നിലനിർത്തിക്കൊണ്ട് യോഹന്നാന്റെ ആഖ്യാനശൈലിക്ക് യോജിക്കുന്ന സ്വാഭാവികമായ കാലസൂചന.
- source_word: εἰδὼς
  choice: അറിഞ്ഞ
  rationale: യേശുവിന്റെ അറിവിനെ സൂചിപ്പിക്കുന്ന സമകാലിക സാഹചര്യകൃുദന്തം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἤδη πάντα τετέλεσται
  choice: എല്ലാം ഇതിനകം പൂർത്തിയായിരിക്കുന്നുവെന്ന്
  rationale: πάντα എന്നതിനെ ‘എല്ലാം’ എന്നും, perfect രൂപം സൂചിപ്പിക്കുന്ന പൂർത്തിയായ നിലയെ ‘പൂർത്തിയായിരിക്കുന്നു’ എന്നും പ്രകടമാക്കുന്നു.
- source_word: ἵνα τελειωθῇ
  choice: നിറവേറേണ്ടതിന്
  rationale: തിരുവെഴുത്ത് കർത്താവായിരിക്കുമ്പോൾ τελειόω എന്നതിന്റെ സന്ദർഭോചിതമായ അർഥം നൽകുകയും ἵναയുടെ ഉദ്ദേശ്യഭാവം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἡ γραφή
  choice: തിരുവെഴുത്ത്
  rationale: വിശുദ്ധ ലിഖിതത്തെ സൂചിപ്പിക്കുന്ന, ആധുനിക മലയാളത്തിൽ പരിചിതവും മാന്യവുമായ പ്രയോഗം.
- source_word: λέγει
  choice: എന്നു പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനത്തെ മലയാള ആഖ്യാനത്തിന് സ്വാഭാവികമായ ഭൂതകാലത്തിൽ നൽകുന്നു.
- source_word: Διψῶ
  choice: എനിക്കു ദാഹിക്കുന്നു
  rationale: വർത്തമാനകാല അനുഭവത്തെ നേരിട്ടും സ്വാഭാവികമായും ഗൗരവത്തോടെയും അറിയിക്കുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ അറിവ്, എല്ലാറ്റിന്റെയും പൂർത്തീകരണം, തിരുവെഴുത്തിന്റെ നിറവേറൽ എന്നിവ തമ്മിലുള്ള ബന്ധം
  choice: എല്ലാം ഇതിനകം പൂർത്തിയായിരിക്കുന്നുവെന്ന് യേശു അറിഞ്ഞു; തുടർന്ന് തിരുവെഴുത്ത് നിറവേറേണ്ടതിന് അവൻ സംസാരിച്ചു.
  alternative: യേശുവിന്റെ വാക്കിന്റെ ഫലമായി തിരുവെഴുത്ത് നിറവേറി എന്ന ഫലാർഥത്തിൽ ἵνα മനസ്സിലാക്കാം.
  rationale: ഗ്രീക്കിലെ ക്രമവും ഉദ്ദേശ്യ/ഫലസാധ്യതയുള്ള ἵναയുടെ ഭാവവും നിലനിർത്തുന്നു; ദൈവിക മുൻജ്ഞാനം അല്ലെങ്കിൽ മുൻനിശ്ചയം സംബന്ധിച്ച വികസിത സിദ്ധാന്തം വാക്യത്തിൽ ചേർക്കുന്നില്ല. τετέλεσται എന്ന പൂർത്തിയായ നിലയും τελειωθῇ എന്ന തിരുവെഴുത്തിന്റെ നിറവേറലും വേർതിരിച്ചും സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളം; സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ആരാധനാവായനയ്ക്ക് യോജിച്ച ഗൗരവമുള്ളതുമായ ശൈലി. മൂലപാഠത്തിലെ ആവർത്തനാത്മകമായ ‘പൂർത്തിയാകുക/നിറവേറുക’ ബന്ധം സന്ദർഭോചിതമായ മലയാളപദങ്ങളിലൂടെ സംരക്ഷിച്ചിരിക്കുന്നു.
