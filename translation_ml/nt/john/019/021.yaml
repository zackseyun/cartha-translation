id: JHN.19.21
reference: John 19:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔλεγον οὖν τῷ Πιλάτῳ οἱ ἀρχιερεῖς τῶν Ἰουδαίων· Μὴ γράφε· Ὁ βασιλεὺς τῶν Ἰουδαίων, ἀλλ’ ὅτι ἐκεῖνος εἶπεν Βασιλεὺς ⸂τῶν Ἰουδαίων εἰμί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/021.yaml
  text: So the chief priests of the Jews were saying to Pilate[a], “Do not write, ‘The King of the Jews,’ but that he said[b], ‘I am King of the Jews.’”
translation:
  language: ml
  text: 'അതുകൊണ്ട് യെഹൂദന്മാരുടെ[a] മുഖ്യപുരോഹിതന്മാർ പീലാത്തൊസിനോട് ഇങ്ങനെ പറഞ്ഞുകൊണ്ടിരുന്നു: “『യെഹൂദന്മാരുടെ രാജാവ്』 എന്ന് എഴുതരുത്; പകരം, 『ഞാൻ യെഹൂദന്മാരുടെ രാജാവാണ്[b]』 എന്നു അയാൾ പറഞ്ഞു എന്ന് എഴുതുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “യെഹൂദ്യരുടെ”; ഗ്രീക്ക് പദം സന്ദർഭമനുസരിച്ച് പൊതുവായി യെഹൂദന്മാരെയോ കൂടുതൽ പ്രത്യേകമായി യെഹൂദ്യരെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
  - marker: b
    text: ഗ്രീക്കിൽ ഇവിടെ “രാജാവ്” എന്ന പദത്തിനു മുമ്പിൽ നിർദേശക ഉപപദമില്ല. ‘ഞാൻ രാജാവാണ്’ എന്ന മലയാളപ്രയോഗത്തിൽ ഈ വ്യത്യാസം സാധാരണയായി പ്രത്യേകം പ്രകടമാകുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം തുടരുന്ന അല്ലെങ്കിൽ ആവർത്തിച്ച പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘പറഞ്ഞുകൊണ്ടിരുന്നു’ ആ ഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവിവരണവുമായി ബന്ധിപ്പിക്കുന്ന തുടർച്ചയോ നിഗമനമോ സൂചിപ്പിക്കുന്നു.
- source_word: ἀρχιερεῖς
  choice: മുഖ്യപുരോഹിതന്മാർ
  rationale: ഒരേ സമയം പല മഹാപുരോഹിതന്മാർ പദവിയിലുണ്ടായിരുന്നു എന്ന അർഥമല്ല; പുരോഹിതനേതാക്കളെ സൂചിപ്പിക്കുന്ന പതിവായ വിവർത്തനം.
- source_word: τῶν Ἰουδαίων
  choice: യെഹൂദന്മാരുടെ
  rationale: പീഡാനുഭവവിവരണത്തിലെ രാഷ്ട്രീയ-മതപരമായ ‘യെഹൂദന്മാരുടെ രാജാവ്’ എന്ന അറിയപ്പെടുന്ന പദവി നിലനിർത്തുന്നു; ‘യെഹൂദ്യരുടെ’ എന്ന പ്രദേശാധിഷ്ഠിത അർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: Μὴ γράφε
  choice: എഴുതരുത്
  rationale: നിഷേധാത്മക വർത്തമാനകാല ആജ്ഞയുടെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: Ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: യെഹൂദന്മാരുടെ രാജാവ്
  rationale: തർക്കവിഷയമായ ശിലാലിഖിതത്തിന്റെ കൃത്യമായ പദവിരൂപം നിലനിർത്തുന്നു.
- source_word: ἀλλ’ ὅτι
  choice: പകരം ... എന്ന് എഴുതുക
  rationale: അവർ ആവശ്യപ്പെട്ട തിരുത്തലിലെ വൈരുധ്യം വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു; ‘എഴുതുക’ മലയാളവാക്യത്തിൽ അർഥപൂർണതയ്ക്കായി സന്ദർഭത്തിൽനിന്ന് പൂരിപ്പിച്ചതാണ്.
- source_word: ἐκεῖνος
  choice: അയാൾ
  rationale: സാധാരണ ‘അവൻ’ എന്നതിനെക്കാൾ അല്പം അകലം സൂചിപ്പിക്കാൻ കഴിയുന്ന പ്രയോഗം; അതേസമയം അതിരുകടന്ന അവജ്ഞ നിർബന്ധിച്ച് ചേർക്കുന്നില്ല.
- source_word: εἶπεν
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്ക് ക്രിയയുടെ ലളിതമായ അർഥം നിലനിർത്തുന്നു; ‘അവകാശപ്പെട്ടു’ പോലുള്ള വ്യാഖ്യാനഭാരം ചേർക്കുന്നില്ല.
- source_word: Βασιλεὺς τῶν Ἰουδαίων εἰμί
  choice: ഞാൻ യെഹൂദന്മാരുടെ രാജാവാണ്
  rationale: മലയാളത്തിൽ വിധേയനാമത്തോടൊപ്പം പ്രത്യേകം നിർദേശക ഉപപദം ഇല്ലാത്തതിനാൽ ഗ്രീക്കിലെ അനാർത്രസ് രൂപം സ്വാഭാവികമായി പ്രതിഫലിക്കുന്നു.
theological_decisions:
- issue: യോഹന്നാന്റെ പീഡാനുഭവസന്ദർഭത്തിൽ Ἰουδαῖος/Ἰουδαίων എന്നതിന്റെ വിവർത്തനം
  choice: യെഹൂദന്മാർ / യെഹൂദന്മാരുടെ
  alternative: യെഹൂദ്യർ / യെഹൂദ്യരുടെ
  rationale: ഇവിടെ ‘യെഹൂദന്മാരുടെ രാജാവ്’ എന്നത് പൊതുവായി തിരിച്ചറിയപ്പെടുന്ന രാഷ്ട്രീയ-മതപരമായ പദവിയാണ്. എങ്കിലും ഗ്രീക്ക് പദത്തിന് ചില സന്ദർഭങ്ങളിൽ പ്രദേശാധിഷ്ഠിതമായി ‘യെഹൂദ്യർ’ എന്ന അർഥം വരാമെന്ന യഥാർഥ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: ἐκεῖνος എന്ന സർവനാമത്തിലെ അകലം
  choice: അയാൾ
  alternative: അവൻ / ആ മനുഷ്യൻ
  rationale: പ്രകടമായ അകലം ഒരു പരിധിവരെ നിലനിർത്തുന്നു; എന്നാൽ ‘ആ മനുഷ്യൻ’ എന്നതിലൂടെ അവജ്ഞയുടെ തീവ്രത നിർബന്ധിച്ച് ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഉദ്ധരണിക്കുള്ളിലെ ശിലാലിഖിതവും നിർദേശിച്ച പകരംവാചകവും വ്യക്തമായി വേർതിരിക്കാൻ കോണാകൃതിയിലുള്ള ഉദ്ധരണിചിഹ്നങ്ങൾ ഉപയോഗിച്ചു. ‘പീലാത്തൊസ്’, ‘മുഖ്യപുരോഹിതന്മാർ’ തുടങ്ങിയ സഭാപരിചിത രൂപങ്ങൾ സാധാരണ വായനക്കാർക്കുള്ള ഗ്രാഹ്യതയ്ക്കായി നിലനിർത്തി.
