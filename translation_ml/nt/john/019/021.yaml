- from: 'അതുകൊണ്ട് യെഹൂദന്മാരുടെ[a] മുഖ്യപുരോഹിതന്മാർ പീലാത്തൊസിനോട് ഇങ്ങനെ പറഞ്ഞുകൊണ്ടിരുന്നു: “『യെഹൂദന്മാരുടെ രാജാവ്』 എന്ന് എഴുതരുത്; പകരം, 『ഞാൻ യെഹൂദന്മാരുടെ രാജാവാണ്[b] എന്ന് അയാൾ പറഞ്ഞു』 എന്ന് എഴുതുക.”'
  to: 'അതുകൊണ്ട് യെഹൂദന്മാരുടെ[a] മുഖ്യപുരോഹിതന്മാർ പീലാത്തൊസിനോട് ഇങ്ങനെ പറഞ്ഞുകൊണ്ടിരുന്നു: “『യെഹൂദന്മാരുടെ രാജാവ്』 എന്ന് എഴുതരുത്; പകരം, 『ഞാൻ യെഹൂദന്മാരുടെ രാജാവാണ്[b]』 എന്നു അയാൾ പറഞ്ഞു എന്ന് എഴുതുക.”'
  rationale: വാക്യത്തിന്റെ അർഥം മാറ്റാതെ, പീലാത്തൊസ് എഴുതണമെന്നു മുഖ്യപുരോഹിതന്മാർ ആവശ്യപ്പെടുന്ന പകരംവാചകത്തിന്റെ പരിധി വ്യക്തമാക്കി. ‘അയാൾ’ ἐκεῖνος-ന്റെ അകലസൂചനയെ അതിരുകടന്ന അവജ്ഞ ചേർക്കാതെ നിലനിർത്തുന്നു. b അടിക്കുറിപ്പ് ഗ്രീക്കിന്റെയും മലയാളത്തിന്റെയും ആർട്ടിക്കിൾ-സംവിധാനങ്ങളിലെ വ്യത്യാസം കൃത്യമായി വിവരിക്കുന്നവിധം തിരുത്തി.
