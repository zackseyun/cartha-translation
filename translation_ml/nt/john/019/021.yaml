  verdict: revise
  source_fidelity: 'മുഖ്യഗ്രീക്ക് പാഠത്തിലെ അപൂർണഭൂതകാലമായ ἔλεγον, ‘യെഹൂദന്മാരുടെ രാജാവ്’ എന്ന പദവി, ἐκεῖνος എന്ന സൂചന, εἶπεν എന്ന ലളിതക്രിയ എന്നിവ കരടിൽ പൊതുവേ നന്നായി പ്രതിഫലിക്കുന്നു. എന്നാൽ പകരം എഴുതേണ്ട വാചകത്തിന്റെ ഉദ്ധരണിഘടന കൂടുതൽ വ്യക്തമായി ക്രമീകരിക്കേണ്ടതുണ്ട്: അവർ എഴുതാൻ ആവശ്യപ്പെടുന്നത് ‘അയാൾ, “ഞാൻ …” എന്നു പറഞ്ഞു’ എന്ന പ്രസ്താവനയാണ്.'
  naturalness: ‘പകരം, 『ഞാൻ … എന്ന് അയാൾ പറഞ്ഞു』 എന്ന് എഴുതുക’ എന്ന നിലവിലെ കൂടുകൂട്ടിയ ഉദ്ധരണി വായനയിൽ ആശയക്കുഴപ്പം സൃഷ്ടിക്കാം. നേരിട്ടുള്ള ആന്തരിക ഉദ്ധരണിക്കുശേഷം ‘അയാൾ … എന്നു പറഞ്ഞു എന്ന് എഴുതുക’ എന്ന ക്രമം ആധുനിക മാനകമലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
