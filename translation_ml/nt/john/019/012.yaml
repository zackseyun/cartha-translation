  to: 'അന്നുമുതൽ പീലാത്തൊസ് അവനെ വിട്ടയയ്ക്കാൻ ശ്രമിച്ചുകൊണ്ടിരുന്നു.[a] എന്നാൽ യെഹൂദന്മാർ[b] വിളിച്ചുപറഞ്ഞു: “ഇവനെ വിട്ടയച്ചാൽ നീ കൈസറുടെ സുഹൃത്തല്ല. സ്വയം രാജാവാക്കുന്ന ഏവനും കൈസറിനെ എതിർക്കുന്നു.”[c]'
  rationale: The revision retains the source-level wording and all stated ambiguity while improving modern Malayalam idiom. It renders ἀντιλέγει as ‘എതിർക്കുന്നു,’ which appropriately conveys the political accusation without over-translating it as a speech act. Footnote c has been adjusted so its first alternative remains genuinely alternative to the revised main-text rendering.
