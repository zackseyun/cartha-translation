id: JHN.19.12
reference: John 19:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐκ τούτου ⸂ὁ Πιλᾶτος ἐζήτει⸃ ἀπολῦσαι αὐτόν· οἱ δὲ Ἰουδαῖοι ⸀ἐκραύγασαν λέγοντες· Ἐὰν τοῦτον ἀπολύσῃς, οὐκ εἶ φίλος τοῦ Καίσαρος· πᾶς ὁ βασιλέα ἑαυτὸν ποιῶν ἀντιλέγει τῷ Καίσαρι.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/012.yaml
  text: From then on Pilate was seeking to release him. But the Jews shouted, saying, “If you release this man, you are not Caesar’s friend. Everyone who makes himself a king speaks against Caesar.”
translation:
  language: ml
  text: 'അന്നുമുതൽ പീലാത്തൊസ് അവനെ വിട്ടയയ്ക്കാൻ ശ്രമിച്ചുകൊണ്ടിരുന്നു.[a] എന്നാൽ യെഹൂദന്മാർ[b] വിളിച്ചുപറഞ്ഞു: “ഇവനെ വിട്ടയച്ചാൽ നീ കൈസറുടെ സുഹൃത്തല്ല. സ്വയം രാജാവാക്കുന്ന ഏവനും കൈസറിനെ എതിർക്കുന്നു.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇതുകൊണ്ട് പീലാത്തൊസ് അവനെ വിട്ടയയ്ക്കാൻ ശ്രമിച്ചുകൊണ്ടിരുന്നു.” ἐκ τούτου എന്ന ഗ്രീക്ക് പ്രയോഗം കാലപരമായി (“അന്നുമുതൽ”) അല്ലെങ്കിൽ കാരണപരമായി (“ഇതുകൊണ്ട്”) മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: യോഹന്നാന്റെ സുവിശേഷത്തിൽ “യെഹൂദന്മാർ” എന്ന പ്രയോഗം പലപ്പോഴും മുഴുവൻ യെഹൂദജനതയെയല്ല, സന്ദർഭത്തിലെ യെഹൂദ്യ അധികാരികളെയോ യേശുവിനെ എതിർത്ത ചില യെഹൂദരെയോ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: c
    text: അഥവാ, “കൈസറിനെതിരെ സംസാരിക്കുന്നു” അല്ലെങ്കിൽ “കൈസറിനെതിരെ നിലകൊള്ളുന്നു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τούτου
  choice: അന്നുമുതൽ
  rationale: സന്ദർഭത്തിൽ തുടർന്നുണ്ടായ പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്ന കാലപരമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു; കാരണപരമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἐζήτει
  choice: ശ്രമിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലത്തിന്റെ തുടർച്ചയായതോ ആവർത്തിച്ചുള്ളതോ ആയ ശ്രമം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀπολῦσαι / ἀπολύσῃς
  choice: വിട്ടയയ്ക്കാൻ / വിട്ടയച്ചാൽ
  rationale: തടങ്കലിൽനിന്നുള്ള ഔദ്യോഗിക മോചനമെന്ന ന്യായവ്യവസ്ഥാപരമായ അർഥത്തിന് യോജിക്കുന്നു.
- source_word: οἱ δὲ Ἰουδαῖοι
  choice: എന്നാൽ യെഹൂദന്മാർ
  rationale: മൂലപാഠത്തിലെ പൊതുവായ ജനനാമം വ്യാഖ്യാനപരമായി ചുരുക്കാതെ നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ പ്രത്യേക സൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐκραύγασαν λέγοντες
  choice: ഇങ്ങനെ വിളിച്ചുപറഞ്ഞു
  rationale: ഉച്ചത്തിലുള്ള പരസ്യമായ നിലവിളിയും തുടർന്നുള്ള നേരിട്ടുള്ള വാക്കുകളുടെ അവതരണവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: τοῦτον
  choice: ഇവനെ
  rationale: ഗ്രീക്കിലെ സൂചകസർവനാമത്തിന്റെ നേരിട്ടുള്ളതും അല്പം അവജ്ഞാഭരിതവുമായ ഭാവം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: φίλος τοῦ Καίσαρος
  choice: കൈസറുടെ സ്നേഹിതൻ
  rationale: രാഷ്ട്രീയ വിശ്വസ്തതയെ ചോദ്യം ചെയ്യുന്ന പ്രയോഗം അധിക വ്യാഖ്യാനം ചേർക്കാതെ ഉടമസ്ഥബന്ധത്തോടെ നൽകുന്നു.
- source_word: πᾶς ὁ βασιλέα ἑαυτὸν ποιῶν
  choice: തന്നെത്താൻ രാജാവാക്കുന്ന ഏവനും
  rationale: ‘സ്വയം രാജാവാക്കുക’ എന്ന മൂലപാഠത്തിന്റെ ശക്തമായ പ്രയോഗം ‘രാജാവാണെന്ന് അവകാശപ്പെടുക’ എന്നു ദുർബലപ്പെടുത്താതെ സംരക്ഷിക്കുന്നു.
- source_word: ἀντιλέγει τῷ Καίσαρι
  choice: കൈസറിനെ എതിർത്തു സംസാരിക്കുന്നു
  rationale: ἀντιλέγω എന്ന പദത്തിലെ സംസാരിക്കുക, എതിർക്കുക എന്നീ ഘടകങ്ങൾ രണ്ടും നിലനിർത്തുന്നു; രാഷ്ട്രീയ എതിർപ്പിന്റെ അർഥവും വ്യക്തമാകുന്നു.
theological_decisions:
- issue: യോഹന്നാനിലെ ‘യെഹൂദന്മാർ’ എന്ന പ്രയോഗത്തിന്റെ സൂചന
  choice: പ്രധാനപാഠത്തിൽ ‘യെഹൂദന്മാർ’ എന്നു നിലനിർത്തി
  alternative: യെഹൂദനേതാക്കൾ / യെഹൂദ്യർ
  rationale: οἱ Ἰουδαῖοι എന്ന മൂലപാഠത്തെ വ്യാഖ്യാനപരമായി ചുരുക്കാതിരിക്കാൻ പ്രധാനപാഠത്തിൽ നേരിട്ടുള്ള പദം നിലനിർത്തുന്നു; മുഴുവൻ യെഹൂദജനതയെയും ഉദ്ദേശിക്കുന്നുവെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ സന്ദർഭസൂചന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ന്യായവ്യവസ്ഥാപരവും രാഷ്ട്രീയവുമായ ഭാവം നിലനിർത്തിയിരിക്കുന്നു; മൂലപാഠത്തിലെ യഥാർഥ അർഥവൈവിധ്യങ്ങൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
