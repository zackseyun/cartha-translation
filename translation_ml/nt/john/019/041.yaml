source:
  edition: SBLGNT
  text: ἦν δὲ ἐν τῷ τόπῳ ὅπου ἐσταυρώθη κῆπος, καὶ ἐν τῷ κήπῳ μνημεῖον καινόν, ἐν ᾧ οὐδέπω οὐδεὶς ⸂ἦν τεθειμένος⸃·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/041.yaml
  text: In the place where he was crucified there was a garden, and in the garden a new tomb, in which no one had yet been laid.
translation:
  language: ml
  text: അവൻ ക്രൂശിക്കപ്പെട്ട സ്ഥലത്ത് ഒരു തോട്ടം ഉണ്ടായിരുന്നു; ആ തോട്ടത്തിൽ ഒരു പുതിയ ശവകുടീരം ഉണ്ടായിരുന്നു; അതിൽ അതുവരെ ആരെയും കിടത്തിയിരുന്നില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയില്ല
  rationale: ഇവിടെ δὲ മൃദുവായ ആഖ്യാനബന്ധം മാത്രമാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ വാക്യക്രമവും സന്ദർഭവും ആ ബന്ധം സ്വാഭാവികമായി വഹിക്കുന്നതിനാൽ ‘എന്നാൽ’ പോലുള്ള വൈരുധ്യസൂചകം ചേർക്കുന്നത് അർത്ഥം അധികരിപ്പിക്കും.
- source_word: τόπῳ
  choice: സ്ഥലത്ത്
  rationale: ആഖ്യാനസന്ദർഭത്തിൽ τόπος എന്നതിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളസമാനം.
- source_word: ὅπου ἐσταυρώθη
  choice: അവനെ ക്രൂശിച്ച
  rationale: ഗ്രീക്കിൽ കർത്തരിപ്രയോഗമല്ലെങ്കിലും, ‘അവൻ ക്രൂശിക്കപ്പെട്ട’ എന്നതിനെക്കാൾ ‘അവനെ ക്രൂശിച്ച’ സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമാണ്; പ്രവർത്തകരെ വ്യക്തമായി നിർദേശിക്കാതെ മൂലത്തിലെ അർത്ഥം നിലനിർത്തുന്നു.
- source_word: κῆπος
  choice: തോട്ടം
  rationale: κῆπος എന്നതിന്റെ സാധാരണ അർത്ഥം ‘തോട്ടം’ ആണ്; പ്രത്യേകിച്ച് ഫലത്തോട്ടം എന്ന് ചുരുക്കേണ്ട തെളിവില്ല.
- source_word: μνημεῖον
  choice: കല്ലറ
  rationale: ശരീരം അകത്ത് വെക്കാവുന്ന സംസ്കാരസ്ഥലമാണ് ഇവിടെ ഉദ്ദേശ്യം; ആ സന്ദർഭത്തിൽ ആധുനിക മലയാളത്തിൽ ‘കല്ലറ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: καινόν
  choice: പുതിയ
  rationale: മൂലത്തിലെ വിശേഷണം നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു; ഉപയോഗിക്കാത്തത് എന്ന ആശയം തുടർന്നുള്ള ഉപവാക്യം പ്രത്യേകം വ്യക്തമാക്കുന്നു.
- source_word: ἐν ᾧ
  choice: അതിൽ
  rationale: മുൻപറഞ്ഞ കല്ലറയിലേക്കുള്ള ബന്ധം മലയാളത്തിൽ ചുരുക്കമായും വ്യക്തമായും സൂചിപ്പിക്കുന്നു.
- source_word: οὐδέπω οὐδεὶς
  choice: അതുവരെ ആരെയും ... ഇല്ല
  rationale: οὐδέπωയുടെ കാലസൂചനയും οὐδείςന്റെ സമ്പൂർണ നിഷേധവും സ്വാഭാവിക മലയാളത്തിൽ ഒരുമിച്ച് പകരുന്നു.
- source_word: ἦν τεθειμένος
  choice: വെച്ചിരുന്നില്ല
  rationale: περίφραστικός pluperfect സൂചിപ്പിക്കുന്ന മുൻകാലാവസ്ഥ ‘വെച്ചിരുന്നു’ എന്ന രൂപത്തിൽ പകരുന്നു; നിഷേധത്തോടൊപ്പം ആരെയും മുമ്പ് അവിടെ സംസ്കാരത്തിനായി വെച്ചിട്ടില്ലെന്ന അർത്ഥം ലഭിക്കുന്നു.
theological_decisions:
- issue: μνημεῖον, τεθειμένος എന്നിവയുടെ സംസ്കാരസന്ദർഭ പദപ്രയോഗം
  choice: കല്ലറ ... വെച്ചിരുന്നില്ല
  alternative: ശവകുടീരം ... കിടത്തിയിരുന്നില്ല
  rationale: വാക്യം വിവരണാത്മകമാണ്. സംസ്കാരസന്ദർഭം വ്യക്തമാക്കിക്കൊണ്ട്, മൂലത്തിൽ ഇല്ലാത്ത ആചാരപരമോ ദൈവശാസ്ത്രപരമോ ആയ വിശദീകരണം ചേർക്കുന്നില്ല.
- issue: ἐσταυρώθηയുടെ പ്രയോഗരീതി
  choice: അവനെ ക്രൂശിച്ച
  alternative: അവൻ ക്രൂശിക്കപ്പെട്ട
  rationale: മൂലത്തിലെ നിഷ്ക്രിയരൂപം രണ്ടാമത്തെ വഴിയിൽ കൂടുതൽ ഔപചാരികമായി പ്രതിഫലിക്കുമെങ്കിലും അത് മലയാളത്തിൽ കൃത്രിമമാണ്. തിരഞ്ഞെടുത്ത രൂപം നിർദിഷ്ട കർത്താവിനെ ചേർക്കാതെ അതേ സംഭവാർഥം സ്വാഭാവികമായി നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ശവകുടീരം’ എന്ന കൂടുതൽ ഔപചാരിക പദത്തിന് പകരം സാധാരണ വായനക്കാർക്ക് പരിചിതമായ ‘കല്ലറ’ ഉപയോഗിച്ചു. വിശദീകരണാത്മക ചേർക്കലുകളോ സഭാവിഭാഗപരമായ പദങ്ങളോ ഇല്ല.
