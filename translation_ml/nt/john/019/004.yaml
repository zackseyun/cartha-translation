  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂καὶ ἐξῆλθεν⸃ πάλιν ἔξω ὁ Πιλᾶτος καὶ λέγει αὐτοῖς· Ἴδε ἄγω ὑμῖν αὐτὸν ἔξω, ἵνα γνῶτε ὅτι ⸂οὐδεμίαν αἰτίαν εὑρίσκω ἐν αὐτῷ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/004.yaml
  text: Then Pilate went outside again and said to them[a], “Look, I am bringing him out to you so that you may know that I find no case against him.”
translation:
  language: ml
  text: 'പീലാത്തോസ് വീണ്ടും പുറത്തേക്കു ചെന്നു അവരോടു പറഞ്ഞു: “നോക്കൂ, അവനെതിരെ യാതൊരു കുറ്റാരോപണത്തിനും അടിസ്ഥാനമില്ലെന്ന് നിങ്ങൾ അറിയേണ്ടതിന് ഞാൻ അവനെ പുറത്തേക്കു നിങ്ങളുടെ അടുക്കലേക്കു കൊണ്ടുവരുന്നു.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവനിൽ ഒരു കുറ്റവും ഞാൻ കാണുന്നില്ല.” ഗ്രീക്ക് പ്രയോഗം പരമ്പരാഗതമായി ഇങ്ങനെയും വിവർത്തനം ചെയ്യാം; എന്നാൽ ഇവിടെ പീലാത്തോസ് യേശുവിനെതിരെ സാധുവായ ഒരു കുറ്റാരോപണമോ നിയമനടപടിക്കുള്ള അടിസ്ഥാനമോ കണ്ടെത്തുന്നില്ല എന്ന ന്യായവ്യവഹാരപരമായ അർഥമാണ് സാധ്യതയേറിയത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν ... ἔξω
  choice: പുറത്തേക്കു വന്നു
  rationale: ക്രിയയും ἔξω എന്ന ദിശാസൂചകവും ചേർന്നുള്ള പുറത്തേക്കുള്ള ചലനം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; രംഗത്തിന്റെ വീക്ഷണകോണിൽ ‘വന്നു’ യോജിക്കുന്നു.
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: പ്രവൃത്തി ആവർത്തിക്കുന്നതിനെ ലളിതമായ ആധുനിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: λέγει
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനത്തെ മലയാള ആഖ്യാനശൈലിക്ക് സ്വാഭാവികമായ ഭൂതകാലത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: Ἴδε
  choice: നോക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ആജ്ഞാരൂപത്തിന്റെ ജീവന്തതയും നേരിട്ടുള്ള അഭിസംബോധനയും നിലനിർത്തുന്നു.
- source_word: ἄγω ... αὐτὸν ἔξω
  choice: ഞാൻ അവനെ നിങ്ങളുടെ അടുക്കലേക്കു പുറത്തുകൊണ്ടുവരുന്നു
  rationale: ἄγω എന്നതിന്റെ ‘കൊണ്ടുവരുക/നയിക്കുക’ എന്ന അർഥവും ജനക്കൂട്ടത്തിന്റെ മുമ്പിലേക്കുള്ള അവതരണവും സന്ദർഭസഹജമായി നൽകുന്നു.
- source_word: ἵνα γνῶτε
  choice: നിങ്ങൾ അറിയേണ്ടതിന്
  rationale: ἵναയുടെ ഉദ്ദേശ്യാർഥം വ്യക്തമായി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: οὐδεμίαν αἰτίαν
  choice: കുറ്റം ചുമത്താൻ യാതൊരു അടിസ്ഥാനവും
  rationale: നിയമപരമായ സന്ദർഭത്തിൽ αἰτία സൂചിപ്പിക്കുന്ന കുറ്റാരോപണത്തിനുള്ള കാരണം അഥവാ നിയമസാധുവായ അടിസ്ഥാനം വ്യക്തമാക്കുന്നു.
- source_word: εὑρίσκω ἐν αὐτῷ
  choice: അവന്റെമേൽ ... ഞാൻ കണ്ടെത്തുന്നില്ല
  rationale: വ്യക്തിക്കെതിരായ നിയമപരമായ അടിസ്ഥാനം കണ്ടെത്തുക എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: യേശുവിനെക്കുറിച്ചുള്ള പീലാത്തോസിന്റെ പ്രഖ്യാപനത്തിന്റെ നിയമപരമായ ഭാഷ
  choice: അവന്റെമേൽ കുറ്റം ചുമത്താൻ യാതൊരു അടിസ്ഥാനവും ഞാൻ കണ്ടെത്തുന്നില്ല
  alternative: അവനിൽ ഒരു കുറ്റവും ഞാൻ കാണുന്നില്ല
  rationale: ഇവിടെ പീലാത്തോസ് നടത്തുന്നത് നിയമപരമായ വിലയിരുത്തലാണ്. തിരഞ്ഞെടുത്ത രൂപം αἰτίαയുടെ ന്യായവ്യവഹാരപരമായ അർഥം വ്യക്തമാക്കുന്നു; അതേസമയം യേശുവിന്റെ നിരപരാധിത്വത്തെക്കുറിച്ചുള്ള വിപുലമായ ദൈവശാസ്ത്രനിഗമനം വിവർത്തനം തന്നെ ചേർത്തു പറയുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. കോടതി-സന്ദർഭം വ്യക്തമാക്കാൻ ‘കുറ്റം ചുമത്താൻ ... അടിസ്ഥാനം’ ഉപയോഗിച്ചു; അനാവശ്യമായ സഭാപാരമ്പര്യഭാഷയും അതിപുരാതന പ്രയോഗങ്ങളും ഒഴിവാക്കി.
