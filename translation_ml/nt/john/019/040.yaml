review_pass:
  verdict: revise
  source_fidelity: The rendering accurately conveys taking Jesus’s body, using linen cloths and aromatics, and the reference to Jewish burial practice. However, «അങ്ങനെയായിരുന്നു» makes the custom simply past-tense, whereas ἔθος ἐστίν expresses a customary practice ('as is the custom').
  naturalness: The Malayalam is generally clear and suitably dignified. Recasting the final clause as an action performed according to the customary burial practice is more idiomatic and preserves the Greek’s customary force.
  terminology: «യേശുവിന്റെ ശരീരം», «സുഗന്ധദ്രവ്യങ്ങൾ», and «യെഹൂദരുടെ» are appropriate. «ചണത്തുണികൾ» is an acceptable rendering of burial linen cloths in this context. The alternative «യെഹൂദ്യരുടെ» is retained in the footnote to reflect the geographic reading without imposing it on the text.
  issues:
  - severity: medium
    issue: The final clause uses «അങ്ങനെയായിരുന്നു» ('was like that').
    rationale: The present-tense ἔθος ἐστίν means 'it is the custom,' not merely that it was customary on this occasion. The revision expresses that they acted in accordance with the Jewish burial custom.
  revised_text: അങ്ങനെ അവർ യേശുവിന്റെ ശരീരം എടുത്ത്, സുഗന്ധദ്രവ്യങ്ങളോടുകൂടെ ചണത്തുണികളിൽ പൊതിഞ്ഞു; യെഹൂദരുടെ ശവസംസ്കാരരീതി അനുസരിച്ചാണ് അവർ അങ്ങനെ ചെയ്തത്.[a]
