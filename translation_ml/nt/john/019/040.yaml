  to: അങ്ങനെ അവർ യേശുവിന്റെ ശരീരം എടുത്ത്, സുഗന്ധദ്രവ്യങ്ങളോടുകൂടെ ചണത്തുണികളിൽ പൊതിഞ്ഞു; യെഹൂദരുടെ ശവസംസ്കാരരീതി അനുസരിച്ചാണ് അവർ അങ്ങനെ ചെയ്തത്.[a]
