source:
  edition: SBLGNT
  text: ἔλαβον οὖν τὸ σῶμα τοῦ Ἰησοῦ καὶ ἔδησαν ⸀αὐτὸ ὀθονίοις μετὰ τῶν ἀρωμάτων, καθὼς ἔθος ἐστὶν τοῖς Ἰουδαίοις ἐνταφιάζειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/040.yaml
  text: So they took Jesus’s body and wrapped it in linen cloths with the spices[a], as is the burial custom of the Jews.
translation:
  language: ml
  text: അങ്ങനെ അവർ യേശുവിന്റെ ശരീരം എടുത്ത്, സുഗന്ധദ്രവ്യങ്ങളോടുകൂടെ ചണത്തുണികളിൽ പൊതിഞ്ഞു; യെഹൂദരുടെ ശവസംസ്കാരരീതി അനുസരിച്ചാണ് അവർ അങ്ങനെ ചെയ്തത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യെഹൂദ്യരുടെ’ എന്നും പരിഭാഷപ്പെടുത്താം; എന്നാൽ ഇവിടെ ഒരു പ്രദേശപരമായ തിരിച്ചറിയലിനെക്കാൾ പൊതുവായ യെഹൂദ ശവസംസ്കാരരീതിയെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλαβον οὖν
  choice: അങ്ങനെ അവർ ... എടുത്ത്
  rationale: οὖν മുൻവാക്യത്തിന്റെ ഫലമായി കഥ മുന്നോട്ടു നീക്കുന്നു; ἔλαβον ശരീരം സംസ്കാരത്തിനായി ഏറ്റെടുത്ത ഭൗതികപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു.
- source_word: τὸ σῶμα τοῦ Ἰησοῦ
  choice: യേശുവിന്റെ ശരീരം
  rationale: σῶμα എന്നതിന്റെ നേരിട്ടും ആദരപൂർവവുമായ അർഥം ‘ശരീരം’ ആണ്; ‘മൃതശരീരം’ എന്നു വ്യക്തമാക്കേണ്ട ആവശ്യം ഗ്രീക്കിൽ ഇല്ല.
- source_word: ἔδησαν αὐτὸ ὀθονίοις
  choice: ചണത്തുണികളിൽ പൊതിഞ്ഞു
  rationale: δέω അടിസ്ഥാനമായി കെട്ടുക/ബന്ധിക്കുക എന്നാണെങ്കിലും, ὀθόνια ഉപയോഗിച്ചുള്ള ശവസംസ്കാരസന്ദർഭത്തിൽ ‘പൊതിഞ്ഞു’ എന്നത് പ്രവൃത്തിയെ സ്വാഭാവികമായി അറിയിക്കുന്നു; ബഹുവചനമായ ὀθονίοις ‘ചണത്തുണികൾ’ എന്നു നിലനിർത്തുന്നു.
- source_word: μετὰ τῶν ἀρωμάτων
  choice: സുഗന്ധദ്രവ്യങ്ങളോടുകൂടെ
  rationale: ἀρώματα ശവസംസ്കാരത്തിൽ ഉപയോഗിച്ചിരുന്ന സുഗന്ധമുള്ള വസ്തുക്കളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘സുഗന്ധദ്രവ്യങ്ങൾ’ ആ അർഥം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: καθὼς ἔθος ἐστὶν ... ἐνταφιάζειν
  choice: ശവസംസ്കാരരീതി അങ്ങനെയായിരുന്നു
  rationale: ഈ പ്രയോഗം മൃതദേഹം സംസ്കാരത്തിനായി ഒരുക്കുന്നതുൾപ്പെടുന്ന പതിവിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ഈ വാക്യക്രമം താരതമ്യവും പതിവിന്റെ ആശയവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τοῖς Ἰουδαίοις
  choice: യെഹൂദരുടെ
  rationale: ഇവിടെ ഒരു പൊതുവായ യെഹൂദ ശവസംസ്കാരപതിവാണ് ഉദ്ദേശിക്കുന്നത്; യെഹൂദ്യപ്രദേശവാസികളെ മാത്രം സൂചിപ്പിക്കുന്നതല്ല.
theological_decisions:
- issue: τοῖς Ἰουδαίοις എന്നതിന്റെ പരിധി
  choice: യെഹൂദരുടെ
  alternative: യെഹൂദ്യരുടെ
  rationale: യോഹന്നാനിൽ പദത്തിന് സന്ദർഭാനുസരണം ‘യെഹൂദർ’ എന്നും ‘യെഹൂദ്യർ’ എന്നും അർഥമാകാം. ഇവിടെ മത-സാംസ്കാരികമായ ശവസംസ്കാരപതിവാണ് പ്രസക്തം; അതിനാൽ ‘യെഹൂദരുടെ’ എന്നതാണ് യോജിച്ചത്.
- issue: ἔδησαν എന്ന ക്രിയയുടെ ശവസംസ്കാരസന്ദർഭത്തിലെ അർഥം
  choice: പൊതിഞ്ഞു
  alternative: കെട്ടി
  rationale: ‘കെട്ടി’ പദത്തിന്റെ അടിസ്ഥാനബലം കൂടുതൽ നേരിട്ട് നിലനിർത്തുമെങ്കിലും, ചണത്തുണികളും സുഗന്ധദ്രവ്യങ്ങളും ഉപയോഗിച്ചുള്ള ഒരുക്കത്തെ മലയാളത്തിൽ ‘പൊതിഞ്ഞു’ സ്വാഭാവികമായി വിവരിക്കുന്നു; ശരീരത്തെ കയറുകൊണ്ട് ബന്ധിച്ചു എന്ന തെറ്റായ ധാരണയും ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വിവരണം. ‘ചണത്തുണികൾ’, ‘സുഗന്ധദ്രവ്യങ്ങൾ’, ‘ശവസംസ്കാരരീതി’ എന്നിവ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ മൂലപാഠത്തിന്റെ ചരിത്രസന്ദർഭവും നിലനിർത്തുന്നു.
