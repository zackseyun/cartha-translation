id: JHN.19.7
reference: John 19:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν αὐτῷ οἱ Ἰουδαῖοι· Ἡμεῖς νόμον ἔχομεν, καὶ κατὰ τὸν ⸀νόμον ὀφείλει ἀποθανεῖν, ὅτι ⸂υἱὸν θεοῦ ἑαυτὸν⸃ ἐποίησεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/007.yaml
  text: The Jews answered him[a], “We have a law, and according to that law he ought to die[b], because he made himself the Son of God.”
translation:
  language: ml
  text: 'യെഹൂദന്മാർ അവനോടു മറുപടി പറഞ്ഞു: “ഞങ്ങൾക്ക് ഒരു നിയമമുണ്ട്; ആ നിയമപ്രകാരം[a] അവൻ മരിക്കേണ്ടതാണ്, കാരണം അവൻ തന്നെത്തന്നെ ദൈവപുത്രനാക്കി[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിയമപ്രകാരം.” ഗ്രീക്കിൽ “നിയമം” എന്ന പദം ആവർത്തിക്കുന്നു; രണ്ടാമത്തേത് ആദ്യം പറഞ്ഞ നിയമത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ദൈവത്തിന്റെ പുത്രനാക്കി.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: മറുപടി പറഞ്ഞു
  rationale: കഥനസന്ദർഭത്തിലെ സാധാരണ പ്രതികരണക്രിയയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: οἱ Ἰουδαῖοι
  choice: യെഹൂദന്മാർ
  rationale: ഗ്രീക്കിലെ സമൂഹനാമം നേരിട്ട് നിലനിർത്തുന്നു; ഈ വാക്യം നേതാക്കളെ മാത്രം പ്രത്യേകം പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: νόμον ἔχομεν
  choice: ഞങ്ങൾക്ക് ഒരു നിയമമുണ്ട്
  rationale: ആദ്യത്തെ νόμον അനിർദ്ദിഷ്ടമായതിനാൽ ‘ഒരു നിയമം’ എന്ന് നൽകി ഗ്രീക്ക് രൂപവും നിയമപരമായ അടിസ്ഥാനത്തിലേക്കുള്ള അഭ്യർഥനയും നിലനിർത്തുന്നു.
- source_word: κατὰ τὸν νόμον
  choice: ആ നിയമപ്രകാരം
  rationale: രണ്ടാമത്തെ νόμον മുമ്പ് പറഞ്ഞ നിയമത്തെ തിരികെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ആ’ എന്നു ചേർത്തു.
- source_word: ὀφείλει ἀποθανεῖν
  choice: അവൻ മരിക്കേണ്ടതാണ്
  rationale: ὀφείλει സൂചിപ്പിക്കുന്ന നിയമപരമായ ബാധ്യതയെ സ്വാഭാവികമായി നൽകുന്നു; കേവല അനിവാര്യതയായി അതിശക്തമാക്കുന്നില്ല.
- source_word: υἱὸν θεοῦ
  choice: ദൈവപുത്രൻ
  rationale: അനിർദ്ദിഷ്ടമായ ‘ദൈവത്തിന്റെ ഒരു പുത്രൻ’ എന്ന അർഥത്തിലേക്ക് ചുരുക്കാതെ, യോഹന്നാന്റെ സന്ദർഭത്തിലെ വിശിഷ്ടവും പദവിസൂചകവുമായ പുത്രത്വാരോപണം നിലനിർത്തുന്നു.
- source_word: ἑαυτὸν ἐποίησεν
  choice: അവൻ തന്നെത്തന്നെ … ആക്കി
  rationale: പ്രതിയോഗികളുടെ ആരോപണരൂപം വ്യാഖ്യാനിച്ച് മൃദൂകരിക്കാതെ ποιέω എന്ന ക്രിയയുടെ ആശയം കഴിയുന്നത്ര നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: വിരോധികളുടെ ആരോപണത്തിൽ υἱὸν θεοῦ എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: ദൈവപുത്രൻ
  alternative: ദൈവത്തിന്റെ ഒരു പുത്രൻ
  rationale: സന്ദർഭം യേശു പലരിൽ ഒരാളായ പുത്രനാണെന്ന അവകാശമല്ല, അതുല്യമായ ദൈവിക പുത്രത്വം അവകാശപ്പെട്ടുവെന്ന ആരോപണമാണ് സൂചിപ്പിക്കുന്നത്. ‘ദൈവപുത്രൻ’ ആ ശക്തി നിലനിർത്തുന്നു; അതേസമയം ഇത് വിരോധികളുടെ ആരോപണമാണെന്ന കഥനസ്വഭാവവും മാറ്റുന്നില്ല.
- issue: ἑαυτὸν ἐποίησεν എന്ന പ്രയോഗത്തിലെ ആരോപണസ്വരം
  choice: അവൻ തന്നെത്തന്നെ ദൈവപുത്രനാക്കി
  alternative: താൻ ദൈവപുത്രനാണെന്ന് അവൻ അവകാശപ്പെട്ടു
  rationale: ‘അവകാശപ്പെട്ടു’ എന്നത് മലയാളത്തിൽ കൂടുതൽ വ്യാഖ്യാനാത്മകവും സ്വാഭാവികവുമാണെങ്കിലും, മൂലത്തിലെ ‘തന്നെത്തന്നെ ആക്കി’ എന്ന മൂർച്ചയുള്ള ആരോപണരൂപം പ്രധാന പാഠത്തിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ കഥനശൈലി സ്വീകരിച്ചു. നിയമപരമായ ആരോപണത്തിന്റെ സ്വരവും മൂലത്തിലെ ആവർത്തനബന്ധവും ക്രിസ്തുവിന്റെ പുത്രത്വത്തെച്ചൊല്ലിയുള്ള സംഘർഷവും വ്യാഖ്യാനത്തിലൂടെ തീർപ്പാക്കാതെ നിലനിർത്തി.
