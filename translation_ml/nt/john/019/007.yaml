  source_fidelity: 'ഗ്രീക്കിലെ നിയമപരമായ വാദക്രമം വിശ്വസ്തമായി പ്രതിഫലിക്കുന്നു: ആദ്യത്തെ νόμον-ന് “ഒരു നിയമം,” മുമ്പ് പറഞ്ഞതിലേക്കു മടങ്ങുന്ന κατὰ τὸν νόμον-ന് “ആ നിയമപ്രകാരം,” ὀφείλει ἀποθανεῖν-ന് നിയമബാധ്യത സൂചിപ്പിക്കുന്ന “മരിക്കേണ്ടതാണ്” എന്നിവ യോജിച്ചതാണ്. ἑαυτὸν ἐποίησεν എന്ന ആരോപണരൂപം “തന്നെത്തന്നെ ദൈവപുത്രനാക്കി” എന്നതിലൂടെ നിലനിർത്തിയിരിക്കുന്നു.'
