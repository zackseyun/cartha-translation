id: JHN.19.14
reference: John 19:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἦν δὲ παρασκευὴ τοῦ πάσχα, ὥρα ⸂ἦν ὡς⸃ ἕκτη. καὶ λέγει τοῖς Ἰουδαίοις· Ἴδε ὁ βασιλεὺς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/014.yaml
  text: It was the day of preparation of the Passover[a]; it was about the sixth hour. And he says to the Jews, “Behold[b], your king!”
translation:
  language: ml
  text: 'അത് പെസഹയുടെ ഒരുക്കനാളായിരുന്നു; ഏകദേശം ആറാം മണിയായിരുന്നു.[a] പീലാത്തോസ് യെഹൂദരോട്[b] പറയുന്നു: “ഇതാ, നിങ്ങളുടെ രാജാവ്!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: മണിക്കൂർ കണക്കാക്കുന്ന രീതിയെ ആശ്രയിച്ച്, ആധുനിക സമയപ്രകാരം ഇത് ‘ഏകദേശം ഉച്ചസമയം’ ആയിരിക്കാം.
    reason: cultural_note
  - marker: b
    text: ‘യെഹൂദർ’ എന്നത് ഈ സന്ദർഭത്തിൽ കൂടുതൽ പ്രത്യേകമായി യെഹൂദ്യ അധികാരികളെയോ യെഹൂദനേതാക്കളെയോ സൂചിപ്പിച്ചിരിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: παρασκευὴ τοῦ πάσχα
  choice: പെസഹയുടെ ഒരുക്കനാൾ
  rationale: παρασκευή ഇവിടെ ഒരു വിരുന്നിനോ ശബ്ബത്തിനോ മുന്നോടിയായ ഒരുക്കദിവസത്തെ സൂചിപ്പിക്കുന്നു. ‘ഒരുക്കനാൾ’ കാലസൂചന സ്വാഭാവികമായി നൽകുന്നു; τοῦ πάσχα എന്ന ബന്ധം ‘പെസഹയുടെ’ എന്നു നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ὥρα ἦν ὡς ἕκτη
  choice: ഏകദേശം ആറാം മണിയായിരുന്നു
  rationale: ὡς എന്ന ഏകദേശസൂചനയും പുരാതന മണിക്കൂർപ്രയോഗവും നിലനിർത്തുന്നു; ആധുനിക സമയമായി നിർണയിച്ച് കാലക്രമപ്രശ്നം തീർപ്പാക്കുന്നില്ല.
- source_word: λέγει
  choice: പറയുന്നു
  rationale: യോഹന്നാന്റെ ചരിത്രവർത്തമാനകാലത്തിന്റെ സജീവത സംരക്ഷിക്കുന്നു. മലയാളത്തിൽ കർത്താവ് വ്യക്തമാകേണ്ടതിനാൽ മുൻസന്ദർഭത്തിൽനിന്നുള്ള ‘പീലാത്തോസ്’ ചേർത്തിരിക്കുന്നു.
- source_word: τοῖς Ἰουδαίοις
  choice: യെഹൂദരോട്
  rationale: ഗ്രീക്കിലെ വിശാലമായ പദത്തെ നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു; ‘യെഹൂദ്യർ’ എന്ന ഭൂമിശാസ്ത്രപരമായോ ‘യെഹൂദനേതാക്കൾ’ എന്ന പരിമിതമായോ ഉള്ള വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ അടിച്ചേൽപ്പിക്കുന്നില്ല.
- source_word: Ἴδε
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗൗരവമുള്ള പൊതുപ്രഖ്യാപനത്തിന്റെ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὁ βασιλεὺς ὑμῶν
  choice: നിങ്ങളുടെ രാജാവ്
  rationale: സ്വാഭാവികമായ ഉടമസ്ഥപ്രയോഗത്തിലൂടെ മൂലത്തിലെ രാഷ്ട്രീയ പരിഹാസവും ഊന്നലും നിലനിർത്തുന്നു.
theological_decisions:
- issue: യോഹന്നാന്റെ സുവിശേഷത്തിലെ ‘യെഹൂദർ’ എന്ന പരാമർശത്തിന്റെ വ്യാപ്തി
  choice: മുഖ്യപാഠത്തിൽ ‘യെഹൂദർ’ നിലനിർത്തുക
  alternative: യെഹൂദ്യർ; യെഹൂദനേതാക്കൾ
  rationale: τοῖς Ἰουδαίοις എന്ന മൂലപാഠം ഈ വാക്യത്തിൽ പരാമർശത്തെ വ്യക്തമായി ചുരുക്കുന്നില്ല. സന്ദർഭത്തിൽ അധികാരികളെയോ നേതാക്കളെയോ കൂടുതൽ പ്രത്യേകമായി ഉദ്ദേശിച്ചിരിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- issue: ‘ആറാം മണി’ എന്ന പുരാതന സമയസൂചന
  choice: മൂലസംസ്കാരത്തിലെ സമയപ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തുക
  alternative: ഏകദേശം ഉച്ചസമയം
  rationale: പുരാതന മണിക്കൂർ കണക്കെടുപ്പിനെക്കുറിച്ചുള്ള അനിശ്ചിതത്വം പരിഹരിക്കാതെ ὡς എന്ന ഏകദേശഭാവം സംരക്ഷിക്കുന്നു; സാധ്യതയുള്ള ആധുനിക തുല്യം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘പെസഹ’, ‘ഒരുക്കനാൾ’, ‘ഇതാ’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ ഉപയോഗിച്ചെങ്കിലും അനാവശ്യമായ പഴമൊഴിനട ഒഴിവാക്കി. പ്രധാനപാഠത്തിലെ [a], [b] അടയാളങ്ങൾ അനുബന്ധ അടിക്കുറിപ്പുകളുമായി കൃത്യമായി പൊരുത്തപ്പെടുന്നു.
