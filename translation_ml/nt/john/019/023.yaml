    issue: The connective οὖν is omitted from the translated text.
    rationale: Although it is a light narrative connective, ‘അപ്പോൾ’ naturally represents the transition and also matches the stated lexical decision.
  - severity: medium
    issue: ‘മുകളിൽനിന്ന് അടിവരെ ഒറ്റത്തുണിയായി’ over-specifies ἐκ τῶν ἄνωθεν ὑφαντὸς δι’ ὅλου.
    rationale: The Greek explicitly describes the tunic as woven from the top throughout; ‘to the bottom’ and ‘as one piece’ are plausible interpretive implications but should remain outside the main wording where the source does not state them directly.
