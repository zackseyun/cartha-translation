id: JHN.19.23
reference: John 19:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ οὖν στρατιῶται ὅτε ἐσταύρωσαν τὸν Ἰησοῦν ἔλαβον τὰ ἱμάτια αὐτοῦ καὶ ἐποίησαν τέσσαρα μέρη, ἑκάστῳ στρατιώτῃ μέρος, καὶ τὸν χιτῶνα. ἦν δὲ ὁ χιτὼν ἄραφος, ἐκ τῶν ἄνωθεν ὑφαντὸς δι’ ὅλου·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/023.yaml
  text: So when the soldiers had crucified Jesus[a], they took his outer garments and made four parts, a part for each soldier, and also the tunic. Now the tunic was seamless[c][b], woven from the top throughout.
translation:
  language: ml
  text: അപ്പോൾ പടയാളികൾ യേശുവിനെ ക്രൂശിച്ചശേഷം, അവന്റെ മേൽവസ്ത്രങ്ങൾ എടുത്ത് നാലായി പങ്കിട്ടു—ഓരോ പടയാളിക്കും ഓരോ പങ്ക്. ഉള്ളങ്കിയും അവർ എടുത്തു. ആ ഉള്ളങ്കിയാകട്ടെ തുന്നലില്ലാത്തതും മുകളിൽനിന്ന് മുഴുവനായും നെയ്തതുമായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “മുകളിൽനിന്ന് നെയ്തത്.” ഗ്രീക്ക് പ്രയോഗം ഉള്ളങ്കി മുകൾഭാഗം മുതൽ മുഴുവൻ തുടർച്ചയായി നെയ്തതാണെന്ന് സൂചിപ്പിക്കുന്നു; ‘ഒറ്റത്തുണിയായി നെയ്തത്’ എന്നും മനസ്സിലാക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ οὖν στρατιῶται
  choice: അപ്പോൾ പടയാളികൾ
  rationale: οὖν ഇവിടെ കഥ മുന്നോട്ടുകൊണ്ടുപോകുന്ന ബന്ധകമാണ്; ശക്തമായ നിഗമനം സൂചിപ്പിക്കാതെ സ്വാഭാവികമായ ആഖ്യാനതുടർച്ച നൽകുന്നു.
- source_word: ὅτε ἐσταύρωσαν τὸν Ἰησοῦν
  choice: യേശുവിനെ ക്രൂശിച്ചശേഷം
  rationale: ὅτε-യോടുകൂടിയ aorist ക്രൂശിക്കൽ തുടർന്നുള്ള പ്രവൃത്തികൾക്കു മുമ്പുണ്ടായതായി കാണിക്കുന്നു; മലയാളത്തിൽ ‘ക്രൂശിച്ചശേഷം’ ക്രമം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἔλαβον τὰ ἱμάτια αὐτοῦ
  choice: അവന്റെ മേൽവസ്ത്രങ്ങൾ എടുത്ത്
  rationale: ἱμάτια പൊതുവേ വസ്ത്രങ്ങളെ സൂചിപ്പിക്കാമെങ്കിലും, പിന്നാലെ χιτών പ്രത്യേകം പറയുന്നതിനാൽ ഇവിടെ ‘മേൽവസ്ത്രങ്ങൾ’ എന്നത് സാധ്യതയുള്ള വ്യത്യാസം വ്യക്തമാക്കുന്നു.
- source_word: ἐποίησαν τέσσαρα μέρη, ἑκάστῳ στρατιώτῃ μέρος
  choice: നാലായി പങ്കിട്ടു—ഓരോ പടയാളിക്കും ഓരോ പങ്ക്
  rationale: ഗ്രീക്കിലെ ‘നാല് ഭാഗങ്ങളാക്കി; ഓരോ പടയാളിക്കും ഒരു ഭാഗം’ എന്ന ആശയം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: καὶ τὸν χιτῶνα
  choice: ഉള്ളങ്കിയും അവർ എടുത്തു
  rationale: χιτών ശരീരത്തോടു ചേർന്ന് ധരിക്കുന്ന വസ്ത്രമാണ്. ‘ഉള്ളങ്കി’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും മേൽവസ്ത്രങ്ങളിൽനിന്നുള്ള വ്യത്യാസം സൂക്ഷിക്കുന്നതുമാണ്; ‘അവർ എടുത്തു’ എന്നത് ഗ്രീക്കിൽ മുൻക്രിയയിൽനിന്ന് മനസ്സിലാകുന്ന അർത്ഥം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἦν δὲ ὁ χιτὼν ἄραφος
  choice: ആ ഉള്ളങ്കിയാകട്ടെ തുന്നലില്ലാത്തതും
  rationale: δέ ഇവിടെ പുതിയ വിവരണവിശദാംശത്തിലേക്കുള്ള മൃദുവായ മാറ്റം നൽകുന്നു; ‘ആകട്ടെ’ അതിനെ സ്വാഭാവികമായി അടയാളപ്പെടുത്തുന്നു. ἄραφος എന്നത് ‘തുന്നലില്ലാത്ത’ എന്നാണ്.
- source_word: ἐκ τῶν ἄνωθεν ὑφαντὸς δι’ ὅλου
  choice: മുകളിൽനിന്ന് അടിവരെ ഒറ്റത്തുണിയായി നെയ്തതുമായിരുന്നു
  rationale: വസ്ത്രനിർമാണസന്ദർഭത്തിൽ ἄνωθεν ‘മുകളിൽനിന്ന്’ എന്നും δι’ ὅλου മുഴുവൻ വ്യാപ്തിയെയും സൂചിപ്പിക്കുന്നു. ‘അടിവരെ’ സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്ന പരിധി വ്യക്തമാക്കുന്നു; ‘ഒറ്റത്തുണിയായി’ വസ്ത്രം മുഴുവനും തുടർച്ചയായി നെയ്തതെന്ന അർത്ഥം നൽകുന്നു.
theological_decisions:
- issue: തുന്നലില്ലാത്ത ഉള്ളങ്കിക്ക് പ്രതീകാത്മക അർത്ഥം ചേർക്കാനുള്ള സാധ്യത
  choice: വസ്ത്രത്തിന്റെ നിർമ്മാണരീതിയെ വിവരണാത്മകമായി മാത്രം പരിഭാഷപ്പെടുത്തി.
  alternative: പുരോഹിതവസ്ത്രത്തോടുള്ള സൂചനയായോ സഭയുടെ ഐക്യത്തിന്റെ പ്രതീകമായോ മുഖ്യവാക്യത്തിൽ വ്യാഖ്യാനിക്കുക.
  rationale: ഈ വാക്യം പടയാളികളുടെ പ്രവൃത്തിയും വസ്ത്രത്തിന്റെ നിർമ്മാണവും മാത്രമാണ് നേരിട്ട് വിവരിക്കുന്നത്; വാക്യം പ്രസ്താവിക്കാത്ത ദൈവശാസ്ത്രപ്രതീകം പരിഭാഷയിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. വസ്ത്രപദങ്ങളിലെ വ്യത്യാസം നിലനിർത്താൻ ἱμάτια എന്നതിന് ‘മേൽവസ്ത്രങ്ങൾ’, χιτών എന്നതിന് ‘ഉള്ളങ്കി’ എന്നു നൽകി. പ്രതീകാത്മക ദൈവശാസ്ത്രവ്യാഖ്യാനങ്ങൾ ചേർത്തിട്ടില്ല.
