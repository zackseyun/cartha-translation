  text: Ὅτε οὖν ἤκουσεν ὁ Πιλᾶτος τοῦτον τὸν λόγον, μᾶλλον ἐφοβήθη,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/008.yaml
  text: When Pilate heard this statement, he became even more afraid,
translation:
  language: ml
  text: പീലാത്തോസ് ഈ കാര്യം കേട്ടപ്പോൾ കൂടുതൽ ഭയപ്പെട്ടു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅτε οὖν
  choice: അതുകൊണ്ട് ... കേട്ടപ്പോൾ
  rationale: Ὅτε എന്നതിന്റെ കാലസൂചന ‘കേട്ടപ്പോൾ’ എന്നും οὖν എന്നതിന്റെ സന്ദർഭബന്ധം ‘അതുകൊണ്ട്’ എന്നും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἤκουσεν
  choice: കേട്ടപ്പോൾ
  rationale: മുമ്പ് പറഞ്ഞ കാര്യം കേട്ടറിഞ്ഞ സംഭവമാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
- source_word: ὁ Πιλᾶτος
  choice: പീലാത്തോസ്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം ഉപയോഗിച്ചു.
- source_word: τοῦτον τὸν λόγον
  choice: ഈ വാക്കു
  rationale: λόγος ഇവിടെ തൊട്ടുമുമ്പ് ഉന്നയിച്ച പ്രസ്താവനയുടെ ഉള്ളടക്കത്തെ സൂചിപ്പിക്കുന്നു; ‘ഈ വാക്കു’ മലയാളത്തിൽ അതിനെ സംക്ഷിപ്തമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: μᾶλλον ἐφοβήθη
  choice: കൂടുതൽ ഭയപ്പെട്ടു
  rationale: μᾶλλον ഭയത്തിന്റെ വർധന വ്യക്തമാക്കുന്നു; ἐφοβήθηയെ സ്വാഭാവികമായ സംഭവവിവരണമായി ‘ഭയപ്പെട്ടു’ എന്നു പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: പീലാത്തോസിന്റെ ഭയത്തിന്റെ സ്വഭാവം
  choice: ഭയം വർധിച്ചു എന്നു മാത്രം പറയുക
  alternative: രാഷ്ട്രീയ ഭയം അല്ലെങ്കിൽ ദൈവിക അവകാശവാദത്തെക്കുറിച്ചുള്ള ഭയം എന്നു വ്യക്തമാക്കുക
  rationale: ഭയത്തിന്റെ കാരണം രാഷ്ട്രീയമോ അന്ധവിശ്വാസപരമോ ദൈവശാസ്ത്രപരമോ എന്ന് ഗ്രീക്ക് പാഠം നിർണയിക്കുന്നില്ല; അതിനാൽ ആ ആഖ്യാനപരമായ അനിശ്ചിതത്വം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ചെറുവാക്യത്തിന്റെ ആഖ്യാനഗതിയും ഭയത്തിന്റെ വർധനയും വ്യക്തമായി സൂക്ഷിച്ചു.
