revisions:
- from: അതുകൊണ്ട് പീലാത്തോസ് ഈ വാക്കു കേട്ടപ്പോൾ കൂടുതൽ ഭയപ്പെട്ടു.
  to: പീലാത്തോസ് ഈ കാര്യം കേട്ടപ്പോൾ കൂടുതൽ ഭയപ്പെട്ടു.
  rationale: The revision retains the temporal relation, Pilate's heightened fear, and the ambiguity concerning its cause. It avoids making the connective more explicitly causal than required and renders λόγος as the preceding matter/statement rather than a literal single word.
