theological_decisions:
- issue: പീഡാനുഭവവിവരണത്തിലെ παρασκευήയുടെ വിവർത്തനം
  choice: ഒരുക്കനാൾ
  alternative: ഒരുക്കം
  rationale: ഇത് ഒരു നിശ്ചിത കലണ്ടർദിവസത്തിന്റെ പേരായി പ്രവർത്തിക്കാമെന്ന സൂചന നിലനിർത്തിക്കൊണ്ട്, ആ പദം പരിചയമില്ലാത്ത ആധുനിക വായനക്കാർക്കും അർഥം വ്യക്തമാക്കുന്നു; ഏത് പ്രത്യേക ഉത്സവത്തിനുള്ള ഒരുക്കമെന്നത് പാഠത്തേക്കാൾ കൃത്യമായി നിർണ്ണയിക്കുന്നില്ല.
- issue: യോഹന്നാന്റെ വിവരണത്തിലെ τῶν Ἰουδαίων
  choice: യെഹൂദരുടെ ഒരുക്കനാൾ
  alternative: യെഹൂദീയ ഒരുക്കനാൾ
  rationale: ഗ്രീക്ക് ബന്ധികഘടന ദൃശ്യമാക്കി നിലനിർത്തുന്നു; യെഹൂദജനത്തെക്കുറിച്ചുള്ള ഒരു ദൈവശാസ്ത്രവിധിയായി ഇതിനെ വികസിപ്പിക്കുകയോ മയപ്പെടുത്തുകയോ ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഒരുക്കനാൾ’ എന്നത് ചരിത്രപരമായ കലണ്ടർപ്രയോഗം വ്യക്തമാക്കുന്നു; ‘വെച്ചു’ എന്നത് മൂലപാഠത്തിന്റെ മിതത്വം കാത്തുസൂക്ഷിക്കുന്നു.
