id: JHN.19.6
reference: John 19:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτε οὖν εἶδον αὐτὸν οἱ ἀρχιερεῖς καὶ οἱ ὑπηρέται ἐκραύγασαν λέγοντες· Σταύρωσον ⸀σταύρωσον. λέγει αὐτοῖς ὁ Πιλᾶτος· Λάβετε αὐτὸν ὑμεῖς καὶ σταυρώσατε, ἐγὼ γὰρ οὐχ εὑρίσκω ἐν αὐτῷ αἰτίαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/006.yaml
  text: So when the chief priests and the officers saw him[a], they cried out, saying, “Crucify him! Crucify him!” Pilate said to them, “You take him and crucify him[b], for I find no charge against him.”
translation:
  language: ml
  text: 'അങ്ങനെ മുഖ്യപുരോഹിതന്മാരും ഉദ്യോഗസ്ഥരും അവനെ കണ്ടപ്പോൾ, “അവനെ ക്രൂശിക്കുക! ക്രൂശിക്കുക!” എന്ന് ആർത്തുവിളിച്ചു. പീലാത്തോസ് അവരോടു പറഞ്ഞു: “നിങ്ങൾതന്നെ അവനെ എടുത്ത് ക്രൂശിക്കൂ[a]. അവനെതിരേ ഒരു കുറ്റാരോപണവും ഞാൻ കണ്ടെത്തുന്നില്ല[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങൾ തന്നെ അവനെ എടുത്ത് ക്രൂശിക്കുക.” ഗ്രീക്കിൽ “നിങ്ങൾ” എന്ന സർവനാമം പ്രകടമായി ചേർത്തിരിക്കുന്നതിനാൽ അതിന് ഊന്നലുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അവനിൽ ഒരു തെറ്റും ഞാൻ കാണുന്നില്ല.” ഗ്രീക്ക് പദത്തിന് കുറ്റാരോപണം, കുറ്റം ചുമത്താനുള്ള അടിസ്ഥാനം, തെറ്റ് എന്നീ അർഥങ്ങൾ വരാം; ഇവിടെ നിയമപരമായ അർഥത്തിനാണ് മുൻതൂക്കം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε οὖν
  choice: അപ്പോൾ ... കണ്ടപ്പോൾ
  rationale: ὅτε നൽകുന്ന കാലസൂചനയും οὖν നൽകുന്ന കഥാഗതിയിലെ തുടർച്ചയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സംയോജിപ്പിക്കുന്നു.
- source_word: ἀρχιερεῖς
  choice: മുഖ്യപുരോഹിതന്മാർ
  rationale: യെരൂശലേമിലെ പുരോഹിതനേതൃത്വത്തെ സൂചിപ്പിക്കുന്ന ബഹുവചനത്തിന് കൃത്യവും പരിചിതവുമായ പ്രയോഗം.
- source_word: ὑπηρέται
  choice: ഉദ്യോഗസ്ഥർ
  rationale: യഹൂദ അധികാരികൾക്കു കീഴിലുള്ള ഔദ്യോഗിക സേവകരെ സൂചിപ്പിക്കുന്നു; മൂലവാക്യം വ്യക്തമാക്കാത്ത സൈനികമോ ദേവാലയമോ ആയ പ്രത്യേകത അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: ἐκραύγασαν λέγοντες
  choice: എന്ന് ആർത്തുവിളിച്ചു
  rationale: ഉച്ചത്തിലുള്ള പരസ്യമായ നിലവിളിയുടെ ശക്തി മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; λέγοντες എന്നതിന്റെ ഉദ്ധരണി-ആമുഖവും ഉൾക്കൊള്ളുന്നു.
- source_word: Σταύρωσον σταύρωσον
  choice: അവനെ ക്രൂശിക്കുക! ക്രൂശിക്കുക!
  rationale: ആജ്ഞയുടെ ആവർത്തനവും അതിന്റെ തീവ്രതയും നിലനിർത്തുന്നു; ഗ്രീക്കിൽ സന്ദർഭത്തിൽ വ്യക്തമാകുന്ന കർമം മലയാളത്തിൽ ആദ്യ ആജ്ഞയിൽ വ്യക്തമാക്കുന്നു.
- source_word: Λάβετε αὐτὸν ὑμεῖς
  choice: നിങ്ങൾതന്നെ അവനെ കൊണ്ടുപോയി
  rationale: പ്രകടമായി നൽകിയിരിക്കുന്ന ὑμεῖς എന്ന സർവനാമത്തിന്റെ ഊന്നൽ ‘നിങ്ങൾതന്നെ’ എന്നു സംരക്ഷിക്കുന്നു; Λάβετε ഇവിടെ ആളെ ഏറ്റെടുത്ത് കൊണ്ടുപോകുക എന്ന സന്ദർഭാർഥത്തിൽ നൽകുന്നു.
- source_word: σταυρώσατε
  choice: ക്രൂശിക്കൂ
  rationale: പ്രത്യക്ഷമായ ആജ്ഞാരൂപത്തിന്റെ ശക്തി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: αἰτίαν
  choice: കുറ്റം
  rationale: പീലാത്തോസിന്റെ ന്യായവിധിസംബന്ധമായ പ്രഖ്യാപനത്തിൽ നിയമപരമായ കുറ്റാരോപണം എന്ന അർഥം മുൻനിർത്തുന്നു; മലയാളത്തിൽ ‘അവനെതിരേ ഒരു കുറ്റം കണ്ടെത്തുക’ എന്നത് സ്വാഭാവികമായ നിയമഭാഷയാണ്.
theological_decisions:
- issue: യേശുവിനെക്കുറിച്ചുള്ള പീലാത്തോസിന്റെ കുറ്റമില്ലായ്മാ പ്രഖ്യാപനം
  choice: അവനെതിരേ ഒരു കുറ്റവും ഞാൻ കണ്ടെത്തുന്നില്ല
  alternative: അവനിൽ ഒരു തെറ്റും ഞാൻ കാണുന്നില്ല
  rationale: αἰτία എന്ന പദത്തിന്റെ ഈ സന്ദർഭത്തിലെ ന്യായാധിപത്യപരമായ അർഥം സംരക്ഷിക്കുന്നു. ഇത് പൊതുവായ ധാർമികമോ സിദ്ധാന്തപരമോ ആയ പ്രസ്താവനയായി വിപുലീകരിക്കാതെ വിചാരണയിലെ നിയമപരമായ വിലയിരുത്തലായി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. കോടതി-വിചാരണാസന്ദർഭം നിലനിർത്താൻ ‘കുറ്റം’ ഉപയോഗിച്ചു; ജനക്കൂട്ടത്തിന്റെ ആവർത്തിച്ച ആജ്ഞയുടെ ശക്തി ചുരുക്കാതെ സൂക്ഷിച്ചു. ഇംഗ്ലീഷ് ഉപദേശപാഠത്തിലെ അടിക്കുറിപ്പ്-ചിഹ്നങ്ങളുടെ സ്ഥാനവൈരുധ്യം തിരുത്തി, ബന്ധപ്പെട്ട മലയാളവാചകങ്ങൾക്ക് പിന്നാലെ [a], [b] ചേർത്തിരിക്കുന്നു.
