  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ πάλιν ἑτέρα γραφὴ λέγει· Ὄψονται εἰς ὃν ἐξεκέντησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/037.yaml
  text: And again another Scripture says[a], “They will look on the one whom they pierced.”
translation:
  language: ml
  text: 'വീണ്ടും മറ്റൊരു തിരുവെഴുത്ത് പറയുന്നു: “അവർ കുത്തിത്തുളച്ചവന്റെ നേരെ നോക്കിനിൽക്കും.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അവർ കുത്തിത്തുളച്ചവനെ നോക്കും” എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്ക് പ്രയോഗം ആ വ്യക്തിയിലേക്കു തിരിയുന്ന ദൃഷ്ടിയെ സൂചിപ്പിക്കുന്നു; ഈ വാക്കുകൾ സെഖര്യാവ് 12:10-നെ പ്രതിധ്വനിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: കൂടുതലായി ഉദ്ധരിക്കുന്ന മറ്റൊരു തിരുവെഴുത്തിലേക്കുള്ള സ്വാഭാവികമായ ബന്ധകമായി പ്രവർത്തിക്കുന്നു.
- source_word: ἑτέρα γραφή
  choice: മറ്റൊരു തിരുവെഴുത്ത്
  rationale: യോഹന്നാന്റെ പ്രയോഗത്തിൽ γραφή വിശുദ്ധ തിരുവെഴുത്തിനെ സൂചിപ്പിക്കുന്നു; ἑτέρα മറ്റൊരു സാക്ഷ്യവാക്യം അവതരിപ്പിക്കുന്നു.
- source_word: λέγει
  choice: പറയുന്നു
  rationale: തിരുവെഴുത്തിനെ ഉദ്ധരിക്കുന്ന ഗ്രീക്ക് വർത്തമാനകാലത്തിന്റെ സജീവതയും മലയാളത്തിലെ സ്വാഭാവിക ഉദ്ധരണിശൈലിയും നിലനിർത്തുന്നു.
- source_word: Ὄψονται εἰς ὃν
  choice: അവർ കുത്തിത്തുളച്ചവനെ അവർ നോക്കും
  rationale: ὁράω-യോടുകൂടിയ εἰς ദൃഷ്ടി ഒരാളിലേക്കു തിരിയുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ കർമപ്രത്യയവും ‘നോക്കും’ എന്ന ക്രിയയും ഇത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; കർത്താവാചകം ആവർത്തിക്കുന്നത് മൂലപാഠത്തിലെ രണ്ട് ബഹുവചന ക്രിയകളുടെ കർത്തൃബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: ἐξεκέντησαν
  choice: കുത്തിത്തുളച്ചു
  rationale: കുത്തി ശരീരത്തിലൂടെ തുളച്ച പ്രവൃത്തിയെ വ്യക്തമാക്കുകയും ക്രൂശീകരണസന്ദർഭത്തോടും പ്രവാചകപ്രതിധ്വനിയോടും യോജിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: സെഖര്യാവ് 12:10-ലെ പ്രതിധ്വനി യോഹന്നാന്റെ ക്രിസ്തുവിനെക്കുറിച്ചുള്ള പ്രയോഗമായി നിലനിർത്തുക, എന്നാൽ അവിടത്തെ ഹീബ്രു ഒന്നാംപുരുഷരൂപം ഇവിടെ ചേർക്കാതിരിക്കുക
  choice: “അവർ കുത്തിത്തുളച്ചവനെ അവർ നോക്കും.”
  alternative: “അവർ കുത്തിത്തുളച്ചവന്റെ നേരെ അവർ നോക്കും.”
  rationale: വാക്യത്തിന്റെ വിവർത്തനത്തിൽ യോഹന്നാന്റെ ഗ്രീക്ക് രൂപം തന്നെയാണ് നിയന്ത്രകമായത്. ‘കുത്തിത്തുളച്ചവനെ’ എന്നത് ആ വ്യക്തിയെ നേരിട്ടുള്ള ദൃഷ്ടിവിഷയമായി നിലനിർത്തുന്നു; സെഖര്യാവിലെ കൂടുതൽ വ്യക്തമായ ദൈവിക ഒന്നാംപുരുഷരൂപം ഇറക്കുമതി ചെയ്യാതെ സന്ദർഭത്തിലെ യേശുവുമായുള്ള തിരിച്ചറിയൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘തിരുവെഴുത്ത്’ ബൈബിൾസംബന്ധമായ γραφή എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു. ‘കുത്തിത്തുളച്ചു’ എന്നത് ‘കുത്തി’ എന്നതിനെക്കാൾ ἐκκεντέωയുടെ തുളച്ചുകയറൽഭാവം വ്യക്തമായി സൂക്ഷിക്കുന്നു.
