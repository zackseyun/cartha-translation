id: JHN.19.13
reference: John 19:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὁ οὖν Πιλᾶτος ἀκούσας ⸂τῶν λόγων τούτων⸃ ἤγαγεν ἔξω τὸν Ἰησοῦν, καὶ ἐκάθισεν ⸀ἐπὶ βήματος εἰς τόπον λεγόμενον Λιθόστρωτον, Ἑβραϊστὶ δὲ Γαββαθα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/013.yaml
  text: So when Pilate heard these words[a], he brought Jesus outside and sat down on the judgment seat at a place called the Stone Pavement, and in Hebrew[b], Gabbatha.
translation:
  language: ml
  text: അതിനാൽ പീലാത്തോസ് ഈ വാക്കുകൾ കേട്ടപ്പോൾ, യേശുവിനെ പുറത്തേക്കു കൊണ്ടുവന്നു; കൽപ്പാകിയ തറ എന്നു വിളിക്കപ്പെട്ടതും എബ്രായഭാഷയിൽ[b] ഗബ്ബഥാ എന്നു വിളിക്കപ്പെട്ടതുമായ സ്ഥലത്ത് ന്യായാസനത്തിൽ ഇരുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവനെ ന്യായാസനത്തിൽ ഇരുത്തി.” ഗ്രീക്ക് ക്രിയയെ സകർമകമായി മനസ്സിലാക്കാം; എങ്കിലും ഇവിടെ പീലാത്തോസ് തന്നെയാണ് ന്യായാസനത്തിൽ ഇരുന്നതെന്ന അർഥത്തിനാണ് കൂടുതൽ സാധ്യത.
    reason: alternative_reading
  - marker: b
    text: “എബ്രായഭാഷയിൽ” എന്നത് യോഹന്നാനിലെ മറ്റു പ്രയോഗങ്ങളിലേതുപോലെ, ഒരുപക്ഷേ അരമായയായിരുന്ന പ്രാദേശിക സെമിറ്റിക് ഭാഷയെ സൂചിപ്പിക്കുന്നതാകാം.
    reason: cultural_note
lexical_decisions:
- source_word: οὖν
  choice: അതിനാൽ
  rationale: മുൻവാക്യങ്ങളിലെ സംഭവങ്ങളുമായുള്ള നിഗമനാത്മകമായ ആഖ്യാനബന്ധം നിലനിർത്തുന്നു.
- source_word: ἀκούσας τῶν λόγων τούτων
  choice: ഈ വാക്കുകൾ കേട്ടപ്പോൾ
  rationale: ഭൂതകാല കൃദന്തരൂപത്തെ സ്വാഭാവികമായ കാലസൂചക ഉപവാക്യമായി നൽകുന്നു; λόγοι മുമ്പ് പറഞ്ഞ വാക്കുകളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἤγαγεν ἔξω τὸν Ἰησοῦν
  choice: യേശുവിനെ പുറത്തേക്കു കൊണ്ടുവന്നു
  rationale: ἄγωയും ἔξωയും സൂചിപ്പിക്കുന്ന പുറത്തേക്കുള്ള നീക്കം വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐκάθισεν ἐπὶ βήματος
  choice: ന്യായാസനത്തിൽ ഇരുന്നു
  rationale: നിയമപരമായ ഔദ്യോഗിക ഇരിപ്പിടം എന്ന βῆμαയുടെ അർഥം നൽകുന്നു. ഏറ്റവും സാധ്യതയുള്ള വായനയിൽ ഇരുന്നത് പീലാത്തോസാണ്; മറ്റൊരു വ്യാകരണസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: εἰς τόπον λεγόμενον Λιθόστρωτον
  choice: കൽപ്പാത എന്നു വിളിക്കപ്പെട്ട സ്ഥലത്തെ
  rationale: Λιθόστρωτον എന്ന സുതാര്യമായ ഗ്രീക്ക് സ്ഥലനാമത്തിന്റെ അർഥം വിവർത്തനം ചെയ്യുന്നു; εἰς ഇവിടെ ഇരിപ്പിന്റെ ഫലമായ സ്ഥാനം സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ സ്ഥലസൂചകമായി സ്വാഭാവികമാക്കുന്നു.
- source_word: Ἑβραϊστὶ δὲ Γαββαθα
  choice: എബ്രായഭാഷയിൽ ആ സ്ഥലത്തിന് ഗബ്ബഥാ എന്നു പേര്
  rationale: മൂലപാഠത്തിലെ ഭാഷാനാമം മുഖ്യപാഠത്തിൽ അതേപടി സംരക്ഷിക്കുന്നു; ഗബ്ബഥാ എന്ന തദ്ദേശീയ സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: ἐκάθισεν എന്ന ക്രിയയുടെ കർത്താവും പ്രയോഗവും
  choice: പീലാത്തോസ് ന്യായാസനത്തിൽ ഇരുന്നു
  alternative: പീലാത്തോസ് യേശുവിനെ ന്യായാസനത്തിൽ ഇരുത്തി
  rationale: ഗ്രീക്ക് ക്രിയാരൂപം അകർമകമായോ സകർമകമായോ മനസ്സിലാക്കാം. ന്യായവിധിയുടെ സന്ദർഭവും സാധാരണ വാക്യഘടനയും പീലാത്തോസ് തന്നെയാണ് ഇരുന്നതെന്ന വായനയ്ക്ക് കൂടുതൽ പിന്തുണ നൽകുന്നു; എന്നാൽ യഥാർഥമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. “ന്യായാസനം” നിയമപരമായ പശ്ചാത്തലം വ്യക്തമാക്കുന്നു; “കൽപ്പാത” സ്ഥലനാമത്തിന്റെ ഗ്രീക്ക് അർഥം സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നൽകുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
