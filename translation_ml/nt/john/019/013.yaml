revisions:
- from: അതിനാൽ പീലാത്തോസ് ഈ വാക്കുകൾ കേട്ടപ്പോൾ, യേശുവിനെ പുറത്തേക്കു കൊണ്ടുവന്നു; കൽപ്പാത എന്നു വിളിക്കപ്പെട്ട സ്ഥലത്തെ ന്യായാസനത്തിൽ ഇരുന്നു[a]. എബ്രായഭാഷയിൽ[b] ആ സ്ഥലത്തിന് ഗബ്ബഥാ എന്നു പേര്.
