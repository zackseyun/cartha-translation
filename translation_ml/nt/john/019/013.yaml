  rationale: 'The revision retains the draft''s sound rendering decisions and both footnotes, while restoring the Greek structure: the Stone Pavement and Gabbatha are two designations for one location, and Pilate sat on the judgment seat there. It also replaces the potentially road-like ''കൽപ്പാത'' with the clearer ''കൽപ്പാകിയ തറ'' for Λιθόστρωτον.'
