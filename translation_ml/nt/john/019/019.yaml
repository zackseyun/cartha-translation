id: JHN.19.19
reference: John 19:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔγραψεν δὲ καὶ τίτλον ὁ Πιλᾶτος καὶ ἔθηκεν ἐπὶ τοῦ σταυροῦ· ἦν δὲ γεγραμμένον· Ἰησοῦς ὁ Ναζωραῖος ὁ βασιλεὺς τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/019.yaml
  text: 'Pilate also wrote an inscription and put it on the cross. It was written: “Jesus the Nazarene[a], the King of the Jews.”'
translation:
  language: ml
  text: 'പീലാത്തോസ് ഒരു ലിഖിതം എഴുതി കുരിശിന്മേൽ വെച്ചു. അതിൽ ഇങ്ങനെ എഴുതിയിരുന്നു: “നസറായനായ യേശു, യെഹൂദന്മാരുടെ രാജാവ്.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “യെഹൂദ്യരുടെ രാജാവ്.” ഗ്രീക്ക് പദം സന്ദർഭമനുസരിച്ച് പൊതുവേ യെഹൂദന്മാരെയോ പ്രത്യേകിച്ച് യെഹൂദ്യരെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: τίτλον
  choice: എഴുത്ത്
  rationale: ക്രൂശിക്കപ്പെട്ടവന്റെ കുറ്റമോ തിരിച്ചറിയലോ രേഖപ്പെടുത്തി കുരിശിൽ വെച്ച ലിഖിതത്തെ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ ‘എഴുത്ത്’ സ്വാഭാവികവും തുടർന്നുള്ള ‘എഴുതിയിരുന്നു’ എന്ന പ്രയോഗവുമായി യോജിച്ചതുമാണ്.
- source_word: ἔθηκεν ἐπὶ τοῦ σταυροῦ
  choice: കുരിശിന്മേൽ വെച്ചു
  rationale: ഗ്രീക്കിലെ ἐπί + genitive ഇവിടെ ‘കുരിശിന്മേൽ’ എന്ന നേരിട്ടുള്ള ബന്ധമാണ് നൽകുന്നത്; ‘കുരിശിനു മുകളിൽ’ എന്ന സന്ദർഭാനുമാനം ചേർക്കുന്നില്ല.
- source_word: ἦν ... γεγραμμένον
  choice: അതിൽ ഇങ്ങനെ എഴുതിയിരുന്നു
  rationale: പെരിഫ്രാസ്റ്റിക് ഘടനയുടെ നിലനിൽക്കുന്ന ഫലാവസ്ഥ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ‘ഇങ്ങനെ’ ഉദ്ധരണിയിലേക്കുള്ള സുതാര്യമായ പ്രവേശനം നൽകുന്നു.
- source_word: Ναζωραῖος
  choice: നസറായനായ
  rationale: നസറത്തുമായി ബന്ധപ്പെട്ട തിരിച്ചറിയൽവിശേഷണം നിലനിർത്തുകയും മലയാളത്തിലെ ബൈബിൾ-സാഹിത്യപരമായ പരിചിതരൂപം ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: βασιλεὺς τῶν Ἰουδαίων
  choice: യെഹൂദന്മാരുടെ രാജാവ്
  rationale: പീഡാനുഭവവിവരണത്തിലെ പൊതുവായ രാജകീയ കുറ്റാരോപണത്തിന്റെ അർഥം നൽകുന്നു; Ἰουδαίων എന്നതിന്റെ പ്രദേശപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: δὲ καὶ
  choice: -ഉം
  rationale: മുൻവിവരണത്തോടുള്ള തുടർച്ചയും കൂട്ടിച്ചേർക്കലും ‘ഒരു എഴുത്തും’ എന്ന മലയാളപ്രയോഗത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: Πιλᾶτος
  choice: പീലാത്തോസ്
  rationale: മലയാളത്തിൽ പ്രചാരമുള്ള പേരുരൂപം.
- source_word: σταυροῦ
  choice: കുരിശ്
  rationale: സുവിശേഷങ്ങളിലെ ക്രൂശീകരണസന്ദർഭത്തിന് യോജിച്ച, സാധാരണ മലയാളത്തിലെ സ്ഥാപിതമായ പദം.
theological_decisions:
- issue: ലിഖിതത്തിലെ Ἰουδαίων എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: യെഹൂദന്മാർ
  alternative: യെഹൂദ്യർ
  rationale: ഇവിടെ യേശുവിനെക്കുറിച്ചുള്ള പരസ്യമായ രാജകീയ വിശേഷണവും കുറ്റാരോപണവുമാണ്; അതിനാൽ ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന ‘യെഹൂദന്മാർ’ സന്ദർഭത്തിന് ഏറ്റവും യോജിക്കുന്നു. പദത്തിന് ചില സന്ദർഭങ്ങളിൽ പ്രദേശവാസികളായ ‘യെഹൂദ്യർ’ എന്ന അർഥവും വരാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വാക്യഘടന. പരമ്പരാഗതമായി അതിഗാഢമായ പദങ്ങൾ ഒഴിവാക്കി, കുരിശിലെ ഔദ്യോഗിക ലിഖിതത്തിന്റെ ഗൗരവം നിലനിർത്തിയിരിക്കുന്നു.
