revisions:
- from: ഇവയ്ക്കുശേഷം, അരിമഥ്യയിൽനിന്നുള്ള യോസേഫ്—യേശുവിന്റെ ശിഷ്യനായിരുന്നെങ്കിലും യെഹൂദന്മാരെ ഭയപ്പെട്ടതിനാൽ അത് രഹസ്യമാക്കി വെച്ചിരുന്നവൻ—യേശുവിന്റെ ശരീരം എടുത്തുകൊണ്ടുപോകാൻ പീലാത്തൊസിനോട് അനുവാദം ചോദിച്ചു. പീലാത്തൊസ് അനുവാദം നൽകി. അതിനാൽ അവൻ വന്ന് യേശുവിന്റെ ശരീരം എടുത്തുകൊണ്ടുപോയി.[a]
  to: ഇവയ്ക്കുശേഷം, അരിമഥ്യയിൽനിന്നുള്ള യോസേഫ്—യേശുവിന്റെ ശിഷ്യനായിരുന്നെങ്കിലും യെഹൂദന്മാരെ[a] ഭയപ്പെട്ടതിനാൽ തന്റെ ശിഷ്യത്വം രഹസ്യമായി സൂക്ഷിച്ചിരുന്നവൻ—യേശുവിന്റെ ശരീരം എടുത്തുകൊണ്ടുപോകാൻ പീലാത്തൊസിനോട് അനുവാദം ചോദിച്ചു. പീലാത്തൊസ് അനുവാദം നൽകി. അങ്ങനെ അവൻ വന്ന് യേശുവിന്റെ ശരീരം എടുത്തുകൊണ്ടുപോയി.
  rationale: ഗ്രീക്ക് പാഠത്തിന്റെ അർഥമോ അതിലെ വ്യാഖ്യാനപരമായ തുറന്ന നിലയോ മാറ്റാതെ, ശിഷ്യത്വം മറച്ചുവെച്ചിരുന്നതിന്റെ സൂചിതവസ്തു വ്യക്തമാക്കി. കൂടാതെ അടിക്കുറിപ്പ് ആങ്കർ അതു വിശദീകരിക്കുന്ന ‘യെഹൂദന്മാർ’ എന്ന പദത്തിലേക്കു മാറ്റി. ‘അങ്ങനെ’ എന്നത് ഇവിടെ പീലാത്തൊസിന്റെ അനുമതിക്കുശേഷമുള്ള οὖν-ന്റെ അനുക്രമ/ഫലബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
