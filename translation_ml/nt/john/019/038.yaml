id: JHN.19.38
reference: John 19:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Μετὰ ⸀δὲ ταῦτα ἠρώτησεν τὸν Πιλᾶτον Ἰωσὴφ ⸀ἀπὸ Ἁριμαθαίας, ὢν μαθητὴς τοῦ Ἰησοῦ κεκρυμμένος δὲ διὰ τὸν φόβον τῶν Ἰουδαίων, ἵνα ἄρῃ τὸ σῶμα τοῦ Ἰησοῦ· καὶ ἐπέτρεψεν ὁ Πιλᾶτος. ἦλθεν οὖν καὶ ἦρεν τὸ σῶμα ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/038.yaml
  text: After these things[a], Joseph from Arimathea, being a disciple of Jesus but having kept it hidden because of fear of the Jews, asked Pilate that he might take away the body of Jesus. And Pilate gave permission. So he came and took away his body.
translation:
  language: ml
  text: ഇവയ്ക്കുശേഷം, അരിമഥ്യയിൽനിന്നുള്ള യോസേഫ്—യേശുവിന്റെ ശിഷ്യനായിരുന്നെങ്കിലും യെഹൂദന്മാരെ[a] ഭയപ്പെട്ടതിനാൽ തന്റെ ശിഷ്യത്വം രഹസ്യമായി സൂക്ഷിച്ചിരുന്നവൻ—യേശുവിന്റെ ശരീരം എടുത്തുകൊണ്ടുപോകാൻ പീലാത്തൊസിനോട് അനുവാദം ചോദിച്ചു. പീലാത്തൊസ് അനുവാദം നൽകി. അങ്ങനെ അവൻ വന്ന് യേശുവിന്റെ ശരീരം എടുത്തുകൊണ്ടുപോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ സന്ദർഭത്തിൽ “യെഹൂദന്മാർ” എന്നത് കൂടുതൽ പ്രത്യേകമായി യെഹൂദ്യയിലെ യെഹൂദ അധികാരികളെ സൂചിപ്പിക്കുന്നതായിരിക്കാം. യോഹന്നാൻ പലപ്പോഴും ഈ പദം യേശുവിനെ എതിർത്തവരെ സൂചിപ്പിക്കാനാണ് ഉപയോഗിക്കുന്നത്; എല്ലാ യെഹൂദജനങ്ങളെയും വേർതിരിവില്ലാതെ ഉദ്ദേശിക്കുന്നില്ല.
    reason: τῶν Ἰουδαίων എന്ന പദത്തിന്റെ സന്ദർഭപരമായ അർത്ഥപരിധി വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: ഇവയ്ക്കുശേഷം
  rationale: ταῦτα എന്ന ബഹുവചനസൂചനയും യോഹന്നാന്റെ സംഭവക്രമപരമായ ബന്ധവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Ἰωσὴφ ἀπὸ Ἁριμαθαίας
  choice: അരിമഥ്യയിൽനിന്നുള്ള യോസേഫ്
  rationale: ἀπό സൂചിപ്പിക്കുന്ന സ്ഥലമൂലത്തെ വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: ὢν μαθητὴς τοῦ Ἰησοῦ κεκρυμμένος δὲ
  choice: യേശുവിന്റെ ശിഷ്യനായിരുന്നെങ്കിലും ... അത് രഹസ്യമാക്കി വെച്ചിരുന്നവൻ
  rationale: κεκρυμμένος എന്ന പൂർണ്ണകാല കർമ്മണി പങ്കാളിത്തരൂപത്തിന്റെ നിലനിൽക്കുന്ന രഹസ്യാവസ്ഥ വ്യക്തമാക്കാൻ, സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്ന ‘ശിഷ്യത്വം’ എന്ന ആശയം ‘അത്’ വഴി സൂചിപ്പിക്കുന്നു.
- source_word: διὰ τὸν φόβον τῶν Ἰουδαίων
  choice: യെഹൂദന്മാരെ ഭയപ്പെട്ടതിനാൽ
  rationale: കാരണബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുകയും τῶν Ἰουδαίων എന്ന പദപ്രയോഗം മുഖ്യവാചകത്തിൽ വിശാലതയോടെ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἵνα ἄρῃ τὸ σῶμα τοῦ Ἰησοῦ
  choice: യേശുവിന്റെ ശരീരം എടുത്തുകൊണ്ടുപോകാൻ
  rationale: ἵναയുടെ ഉദ്ദേശ്യവും αἴρωയുടെ ഈ സന്ദർഭത്തിലെ നീക്കംചെയ്ത് കൊണ്ടുപോകുക എന്ന അർത്ഥവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐπέτρεψεν
  choice: അനുവാദം നൽകി
  rationale: അധികാരപൂർവം അനുമതി നൽകുക എന്ന ക്രിയയുടെ സന്ദർഭാർഥം കൃത്യമായി നൽകുന്നു.
- source_word: ἦλθεν οὖν καὶ ἦρεν τὸ σῶμα αὐτοῦ
  choice: അതിനാൽ അവൻ വന്ന് യേശുവിന്റെ ശരീരം എടുത്തുകൊണ്ടുപോയി
  rationale: οὖν എന്ന അനുമതിയിൽനിന്നുള്ള ഫലബന്ധവും αἴρωയുടെ ആവർത്തനവും നിലനിർത്തുന്നു; αὐτοῦയുടെ വ്യക്തമായ സൂചിതനായ യേശുവിനെ മലയാളത്തിൽ ആവർത്തിക്കുന്നത് ആശയക്കുഴപ്പം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: യോഹന്നാനിലെ τῶν Ἰουδαίων എന്ന പദപ്രയോഗത്തിന്റെ സൂചിതർ
  choice: മുഖ്യവാചകത്തിൽ ‘യെഹൂദന്മാർ’ എന്നു നിലനിർത്തി അടിക്കുറിപ്പിൽ സന്ദർഭസൂചന നൽകുക
  alternative: ‘യെഹൂദ അധികാരികൾ’ അല്ലെങ്കിൽ ‘യെഹൂദ നേതാക്കൾ’ എന്നു മുഖ്യവാചകത്തിൽ ചുരുക്കി വ്യാഖ്യാനിക്കുക
  rationale: ഗ്രീക്കിലെ വിശാലമായ പദപ്രയോഗം മുഖ്യവാചകത്തിൽ സംരക്ഷിക്കുമ്പോഴും, ഇവിടെ യേശുവിനെ എതിർത്ത യെഹൂദ്യ/യെഹൂദ അധികാരികളെയാണ് പ്രത്യേകിച്ച് ഉദ്ദേശിക്കുന്നതാകാമെന്ന സന്ദർഭസത്യം അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു; യെഹൂദജനത്തെ മുഴുവനായി കുറ്റപ്പെടുത്തുന്ന വായന ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. പങ്കാളിത്തവാക്യത്തിന്റെ സങ്കീർണ്ണത ഡാഷുകൾ ഉപയോഗിച്ച് വായനാസൗകര്യത്തോടെ നിലനിർത്തി. ‘പീലാത്തൊസ്’, ‘യെഹൂദന്മാർ’ തുടങ്ങിയ പരിചിതമായ ബൈബിൾ നാമരൂപങ്ങൾ ഉപയോഗിച്ചു.
