id: JHN.19.24
reference: John 19:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπαν οὖν πρὸς ἀλλήλους· Μὴ σχίσωμεν αὐτόν, ἀλλὰ λάχωμεν περὶ αὐτοῦ τίνος ἔσται· ἵνα ἡ γραφὴ πληρωθῇ ⸂ἡ λέγουσα⸃· Διεμερίσαντο τὰ ἱμάτιά μου ἑαυτοῖς καὶ ἐπὶ τὸν ἱματισμόν μου ἔβαλον κλῆρον. Οἱ μὲν οὖν στρατιῶται ταῦτα ἐποίησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/024.yaml
  text: So they said to one another[a], “Let us not tear it, but cast lots for it to decide whose it will be,” so that the Scripture might be fulfilled that says, “They divided my garments among themselves[b], and for my clothing they cast a lot.” So the soldiers did these things.
translation:
  language: ml
  text: 'അതിനാൽ അവർ പരസ്പരം പറഞ്ഞു: “നമുക്ക് ഇത് കീറേണ്ട; ഇത് ആർക്കുള്ളതാകുമെന്ന് നറുക്കിടാം.” “അവർ എന്റെ വസ്ത്രങ്ങൾ തമ്മിൽ പങ്കിട്ടു; എന്റെ ഉടുപ്പിന്മേൽ അവർ നറുക്കിട്ടു” എന്ന് പറയുന്ന തിരുവെഴുത്ത് നിറവേറേണ്ടതിന് ഇതു സംഭവിച്ചു.[a] അങ്ങനെ പടയാളികൾ ഇതു ചെയ്തു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: സങ്കീർത്തനം 22:18-ൽനിന്നുള്ള ഉദ്ധരണി.
    reason: cross_reference
lexical_decisions:
- source_word: σχίσωμεν
  choice: കീറാതിരിക്കാം
  rationale: തുണി കീറുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക ആധുനിക മലയാളപ്രയോഗം; ഒന്നാംപുരുഷ ബഹുവചന ആഹ്വാനരൂപവും നിലനിർത്തുന്നു.
- source_word: αὐτόν
  choice: ഇത്
  rationale: വ്യാകരണപരമായി പുല്ലിംഗമാണെങ്കിലും സന്ദർഭത്തിൽ മുമ്പ് പറഞ്ഞ അങ്കിയെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഇത്’ എന്നു വരുന്നു.
- source_word: λάχωμεν
  choice: നറുക്കിട്ട് തീരുമാനിക്കാം
  rationale: നറുക്കെടുപ്പിലൂടെ ഉടമസ്ഥനെ നിർണയിക്കുന്ന അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: περὶ αὐτοῦ τίνος ἔσται
  choice: ഇത് ആർക്കുള്ളതാകണമെന്ന്
  rationale: നറുക്കിന്റെ വിഷയം—വസ്ത്രം ആർക്കു ലഭിക്കുമെന്നത്—ഗ്രീക്കിനോട് വിശ്വസ്തമായി മലയാളത്തിൽ സ്വാഭാവികമാക്കുന്നു.
- source_word: ἵνα ἡ γραφὴ πληρωθῇ
  choice: തിരുവെഴുത്ത് നിറവേറേണ്ടതിനായിരുന്നു ഇത്
  rationale: യോഹന്നാന്റെ നിറവേറൽസൂത്രത്തിലെ ഉദ്ദേശ്യഭാവം നിലനിർത്തുന്നു; ദൈവിക ഉദ്ദേശ്യവും മനുഷ്യപ്രവൃത്തിയും തമ്മിലുള്ള ബന്ധം അധികമായി വിശദീകരിക്കുന്നില്ല.
- source_word: ἡ γραφή
  choice: തിരുവെഴുത്ത്
  rationale: വിശുദ്ധഗ്രന്ഥത്തിലെ നിർദിഷ്ട വചനത്തെ സൂചിപ്പിക്കുന്ന പ്രചാരമുള്ളതും മാന്യവുമായ മലയാളപദം.
- source_word: Διεμερίσαντο τὰ ἱμάτιά μου ἑαυτοῖς
  choice: അവർ എന്റെ വസ്ത്രങ്ങൾ തങ്ങൾക്കായി പങ്കിട്ടു
  rationale: വസ്ത്രങ്ങളുടെ വിഭജനവും ഗ്രീക്കിലെ reflexive dative-ന്റെ ‘തങ്ങൾക്കായി’ എന്ന ഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: ἱματισμόν
  choice: ഉടുപ്പ്
  rationale: മുൻപുള്ള ബഹുവചനമായ ‘വസ്ത്രങ്ങൾ’ എന്നതിൽനിന്ന് പദവ്യത്യാസവും ഏകവചനവും നിലനിർത്തുന്നു.
- source_word: ἔβαλον κλῆρον
  choice: നറുക്കിട്ടു
  rationale: ഏക നറുക്ക് ഇടുന്ന പ്രവൃത്തിയെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: στρατιῶται
  choice: പടയാളികൾ
  rationale: റോമൻ സൈനികരെ സൂചിപ്പിക്കുന്ന, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മാന്യമായ പദം.
theological_decisions:
- issue: ἵνα ἡ γραφὴ πληρωθῇ എന്നതിൽ പടയാളികളുടെ പ്രവൃത്തിയും തിരുവെഴുത്തിന്റെ നിറവേറലും തമ്മിലുള്ള ബന്ധം
  choice: ‘തിരുവെഴുത്ത് നിറവേറേണ്ടതിനായിരുന്നു ഇത്’ എന്ന് ഉദ്ദേശ്യഭാവത്തോടെ നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘അങ്ങനെ തിരുവെഴുത്ത് നിറവേറി’ എന്ന് ഫലഭാവത്തിൽ പരിഭാഷപ്പെടുത്തുക.
  rationale: ἵναയുടെ ഉദ്ദേശ്യസൂചനയും യോഹന്നാന്റെ നിറവേറൽഭാഷയും സംരക്ഷിക്കുന്നു; ദൈവനിശ്ചയവും മനുഷ്യ ഉത്തരവാദിത്വവും എങ്ങനെ ബന്ധപ്പെടുന്നു എന്നു പരിഭാഷയിൽ തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. നേരിട്ടുള്ള സംഭാഷണം ലളിതമാക്കിയപ്പോൾ തിരുവെഴുത്ത് ഉദ്ധരണിക്ക് അല്പം ഉയർന്ന ഭാവം നിലനിർത്തി. ‘വസ്ത്രങ്ങൾ/ഉടുപ്പ്’ എന്ന വ്യത്യാസം ἱμάτια/ἱματισμός എന്ന മൂലപദവ്യത്യാസം പ്രതിഫലിപ്പിക്കുന്നു.
