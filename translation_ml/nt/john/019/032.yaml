  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἦλθον οὖν οἱ στρατιῶται, καὶ τοῦ μὲν πρώτου κατέαξαν τὰ σκέλη καὶ τοῦ ἄλλου τοῦ συσταυρωθέντος αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/032.yaml
  text: So the soldiers came and broke the legs of the first man[b][a], and of the other who had been crucified with him.
translation:
  language: ml
  text: അങ്ങനെ പടയാളികൾ വന്ന് ആദ്യത്തെയാളുടെ കാലുകളും അവനോടൊപ്പം[a] ക്രൂശിക്കപ്പെട്ട മറ്റേയാളുടെ കാലുകളും ഒടിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘അവൻ’ എന്നത് സന്ദർഭപ്രകാരം യേശുവിനെ സൂചിപ്പിക്കുന്നു; വ്യാകരണപരമായി അടുത്തുള്ള ആദ്യത്തെയാളെ സൂചിപ്പിക്കുന്നതായും വായിക്കാനാകും.
    reason: referent_ambiguity
lexical_decisions:
- source_word: οὖν
  choice: അങ്ങനെ
  rationale: മുൻവാക്യത്തിലെ കല്പനയുടെ ഫലമായി സംഭവിക്കുന്ന കഥാതുടർച്ച സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: οἱ στρατιῶται
  choice: പടയാളികൾ
  rationale: ഈ സന്ദർഭത്തിലെ റോമൻ സൈനികരെ സൂചിപ്പിക്കുന്ന വ്യക്തവും സാധാരണവുമായ മലയാളപദം.
- source_word: τοῦ μὲν πρώτου
  choice: ആദ്യത്തെയാളുടെ
  rationale: യേശുവിനോടൊപ്പം ക്രൂശിക്കപ്പെട്ട രണ്ടുപേരിൽ ആദ്യം പരാമർശിക്കപ്പെടുന്ന ആളെ സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിൽ വ്യക്തി സൂചിതമായിരിക്കുന്നതുപോലെ മലയാളത്തിലും ‘ആൾ’ ഉൾപ്പെടുത്തി വ്യക്തത നൽകുന്നു.
- source_word: κατέαξαν
  choice: ഒടിച്ചു
  rationale: കാലുകൾ ബലമായി തകർക്കുന്ന പ്രവൃത്തിയെ ഈ സന്ദർഭത്തിൽ നേരായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: τὰ σκέλη
  choice: കാലുകൾ
  rationale: ശരീരഭാഗത്തെ സൂചിപ്പിക്കുന്ന ലളിതവും കൃത്യവുമായ വിവർത്തനം.
- source_word: τοῦ ἄλλου
  choice: മറ്റേയാളുടെ
  rationale: ക്രൂശിക്കപ്പെട്ട രണ്ടുപേരിൽ രണ്ടാമത്തെയാളെ ഗ്രീക്കിലെ സംക്ഷിപ്തത നിലനിർത്തി സൂചിപ്പിക്കുന്നു.
- source_word: συσταυρωθέντος αὐτῷ
  choice: അവനോടൊപ്പം ക്രൂശിക്കപ്പെട്ട
  rationale: കൂടെ ക്രൂശിക്കപ്പെട്ടതായി തിരിച്ചറിയിക്കുന്ന വിശേഷണപ്രയോഗവും മൂലത്തിലെ സർവനാമവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: αὐτῷ എന്ന സർവനാമത്തിന്റെ സൂചിതവ്യക്തി
  choice: ‘അവൻ’ എന്ന സർവനാമം നിലനിർത്തി, അടിക്കുറിപ്പിൽ സന്ദർഭപ്രകാരം യേശുവാണെന്ന് വ്യക്തമാക്കുന്നു
  alternative: സർവനാമം നേരിട്ട് ‘യേശുവിനോടൊപ്പം’ എന്നു പരിഭാഷപ്പെടുത്തുക; അല്ലെങ്കിൽ ആദ്യത്തെയാളെ സൂചിപ്പിക്കുന്നതായി വായിക്കുക
  rationale: യോഹന്നാന്റെ ക്രൂശീകരണവിവരണത്തിൽ കേന്ദ്രസൂചിതവ്യക്തി യേശുവായതിനാൽ ‘അവൻ’ ഏറ്റവും സ്വാഭാവികമായി യേശുവിനെ സൂചിപ്പിക്കുന്നു. എന്നാൽ മൂലപാഠത്തിലെ സർവനാമരൂപം ഇല്ലാതാക്കാതിരിക്കാൻ അത് പ്രധാനവാചകത്തിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക സാധാരണ മലയാളത്തിൽ ഗൗരവവും വായനാസൗകര്യവും നിലനിർത്തുന്നു. ‘ആദ്യത്തെയാൾ/മറ്റേയാൾ’ എന്ന സമാന്തരഘടന ഗ്രീക്കിലെ ആദ്യൻ–മറ്റവൻ എന്ന ബന്ധം വ്യക്തമാക്കുന്നു; മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി ‘കാലുകൾ’ രണ്ടിടത്തും ആവർത്തിച്ചു.
