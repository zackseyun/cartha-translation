id: JHN.6.15
reference: John 6:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἰησοῦς οὖν γνοὺς ὅτι μέλλουσιν ἔρχεσθαι καὶ ἁρπάζειν αὐτὸν ἵνα ⸀ποιήσωσιν βασιλέα ἀνεχώρησεν ⸀πάλιν εἰς τὸ ὄρος αὐτὸς μόνος.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/015.yaml
  text: So Jesus[a], knowing that they were about to come and seize him in order to make him king, withdrew again to the mountain by himself.
translation:
  language: ml
  text: അതിനാൽ, അവർ വന്ന് തന്നെ പിടിച്ചെടുത്ത് രാജാവാക്കാൻ പോകുകയാണെന്ന് അറിഞ്ഞ യേശു വീണ്ടും ഒറ്റയ്ക്ക് മലയിലേക്കു പിൻവാങ്ങി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: അതിനാൽ
  rationale: മുമ്പത്തെ സംഭവത്തിൽനിന്ന് ജനക്കൂട്ടത്തിന്റെ പ്രതികരണത്തിലേക്കും യേശുവിന്റെ തുടർനടപടിയിലേക്കും നയിക്കുന്ന ആഖ്യാനബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: γνοὺς
  choice: മനസ്സിലാക്കിയ
  rationale: യേശു അവരുടെ ഉദ്ദേശ്യം തിരിച്ചറിഞ്ഞതാണ് തുടർന്നുള്ള പ്രവൃത്തിയുടെ സാഹചര്യമെന്ന് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: μέλλουσιν ἔρχεσθαι
  choice: അവർ വന്ന് ... പോകുകയാണെന്ന്
  rationale: μέλλω സൂചിപ്പിക്കുന്ന ആസന്നമായ ഉദ്ദേശ്യവും നടപടിയും മലയാളത്തിലെ സ്വാഭാവിക വാക്യഘടനയിൽ അറിയിക്കുന്നു.
- source_word: ἁρπάζειν
  choice: പിടിച്ചുകൊണ്ടുപോയി
  rationale: പെട്ടെന്നോ ബലപ്രയോഗത്തോടെയോ കൈവശപ്പെടുത്തുക എന്ന ക്രിയയുടെ നിർബന്ധസ്വഭാവം സന്ദർഭത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; കൂടുതൽ വ്യക്തമായ ബലപ്രയോഗരൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἵνα ποιήσωσιν βασιλέα
  choice: രാജാവാക്കാൻ
  rationale: ἵναയോടുകൂടിയ ഉപവാക്യത്തിന്റെ ഉദ്ദേശ്യാർഥം ചുരുക്കമായും വ്യക്തമായും നൽകുന്നു.
- source_word: ἀνεχώρησεν
  choice: പിൻവാങ്ങി
  rationale: ആ സാഹചര്യത്തിൽനിന്ന് ഒഴിഞ്ഞുമാറിയുള്ള സ്ഥലമാറ്റവും മനഃപൂർവമായ അകന്നുനിൽപ്പും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു.
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: ആവർത്തനാർഥം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: εἰς τὸ ὄρος
  choice: മലയിലേക്ക്
  rationale: ഗ്രീക്കിലെ പർവത/മല സൂചനയെ അമിതമായി പ്രത്യേകീകരിക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: αὐτὸς μόνος
  choice: തനിച്ച്
  rationale: യേശു മറ്റാരുമില്ലാതെ ഒറ്റയ്ക്കായിരുന്നു എന്ന ഊന്നൽ സ്വാഭാവികവും ആവർത്തനമില്ലാത്തതുമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: യേശുവിനെ രാജാവാക്കാനുള്ള ജനക്കൂട്ടത്തിന്റെ നടപടിയുടെ സ്വഭാവം
  choice: അവർ യേശുവിനെ പിടിച്ചുകൊണ്ടുപോയി രാജാവാക്കാൻ ഉദ്ദേശിച്ചതായി പരിഭാഷപ്പെടുത്തി.
  alternative: അവർ വന്ന് യേശുവിനെ രാജാവാക്കാൻ ഉദ്ദേശിച്ചു.
  rationale: ἁρπάζειν എന്ന ക്രിയയിൽ നിർബന്ധമോ ബലപ്രയോഗമോ അടങ്ങിയതിനാൽ, ഇതിനെ കേവലം ക്ഷണമോ അനുകൂലമായ കിരീടധാരണമോ ആയി മൃദൂകരിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. നിർബന്ധിത രാഷ്ട്രീയ രാജത്വത്തിന്റെ ആശയം നിലനിർത്തിയിട്ടുണ്ടെങ്കിലും വ്യാഖ്യാനപരമായ അധികവിവരങ്ങൾ ചേർത്തിട്ടില്ല.
