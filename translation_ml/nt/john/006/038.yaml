id: JHN.6.38
reference: John 6:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι καταβέβηκα ⸀ἀπὸ τοῦ οὐρανοῦ οὐχ ἵνα ποιῶ τὸ θέλημα τὸ ἐμὸν ἀλλὰ τὸ θέλημα τοῦ πέμψαντός με·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/038.yaml
  text: For I have come down from heaven, not to do my own will, but the will of the one who sent me.
translation:
  language: ml
  text: എന്തെന്നാൽ, എന്റെ സ്വന്തം ഇഷ്ടം ചെയ്യാനല്ല, എന്നെ അയച്ചവന്റെ ഇഷ്ടം ചെയ്യാനാണ് ഞാൻ സ്വർഗത്തിൽനിന്ന് ഇറങ്ങിവന്നിരിക്കുന്നത്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിനുള്ള വിശദീകരണവും കാരണബന്ധവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: καταβέβηκα
  choice: ഞാൻ ... ഇറങ്ങിവന്നിരിക്കുന്നത്
  rationale: പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ പ്രസക്തി സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പൂർണകാലത്തിന്റെ ഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἀπὸ τοῦ οὐρανοῦ
  choice: സ്വർഗത്തിൽനിന്ന്
  rationale: സ്ഥലപരമായ ഉത്ഭവവും യോഹന്നാനിലെ ദൈവശാസ്ത്രപരമായ അനുരണനവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: οὐχ ἵνα ποιῶ
  choice: ചെയ്യാനല്ല
  rationale: നിഷേധിക്കപ്പെട്ട ഉദ്ദേശ്യം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τὸ θέλημα
  choice: ഇഷ്ടം
  rationale: വ്യക്തിയുടെ ഉദ്ദേശ്യത്തെയും തീരുമാനത്തെയും സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; രണ്ടു പ്രയോഗങ്ങളിലും ഒരേ പദം ഉപയോഗിച്ച് സമാന്തരത നിലനിർത്തുന്നു.
- source_word: τὸ ἐμὸν
  choice: എന്റെ സ്വന്തം
  rationale: ഗ്രീക്കിലെ ഊന്നിയ സ്വത്തുബന്ധം പ്രകടമാക്കി, അയച്ചവന്റെ ഇഷ്ടവുമായുള്ള വൈരുധ്യം തെളിയിക്കുന്നു.
- source_word: ἀλλὰ
  choice: '...അല്ല, ...ആണ്'
  rationale: മലയാളത്തിലെ സ്വാഭാവികമായ നിഷേധ-സ്ഥിരീകരണ ഘടനയിലൂടെ ശക്തമായ വൈരുധ്യം പുനരാവിഷ്കരിക്കുന്നു.
- source_word: τοῦ πέμψαντός με
  choice: എന്നെ അയച്ചവന്റെ
  rationale: കർത്താവിനെ വാക്യം വ്യക്തമാക്കുന്നതിലധികം നിർവചിക്കാതെ articular participle-ന്റെ വ്യക്തിപരമായ അർഥം കൃത്യമായി നൽകുന്നു.
theological_decisions:
- issue: യേശു സ്വർഗത്തിൽനിന്ന് ഇറങ്ങിവന്നതിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ അർഥം
  choice: “ഞാൻ സ്വർഗത്തിൽനിന്ന് ഇറങ്ങിവന്നിരിക്കുന്നു” എന്ന സ്വർഗീയ ഉത്ഭവവാദം നേരിട്ട് നിലനിർത്തി.
  alternative: ദൈവിക നിയോഗത്തെ മാത്രം സൂചിപ്പിക്കുന്ന രൂപകമായി മയപ്പെടുത്തുക.
  rationale: വാക്യം സ്വർഗീയ ഉത്ഭവത്തെ വ്യക്തമായി അവതരിപ്പിക്കുന്നു; അതിനെ ദൗത്യഭാഷയായി മാത്രം ചുരുക്കാതെ, അധിക സിദ്ധാന്തഭാഷ ചേർക്കാതെയും സംരക്ഷിക്കണം.
- issue: പുത്രന്റെ ഇഷ്ടവും അയച്ചവന്റെ ഇഷ്ടവും തമ്മിലുള്ള ബന്ധം
  choice: രണ്ടിടത്തും “ഇഷ്ടം” ഉപയോഗിച്ച് യഥാർഥമായ വൈരുധ്യവും സമാന്തരതയും നിലനിർത്തി.
  alternative: വൈരുധ്യത്തെ വിശദീകരിച്ചോ ദൈവശാസ്ത്രപരമായി സമന്വയിപ്പിച്ചോ വിവർത്തനം ചെയ്യുക.
  rationale: മിഷനും അനുസരണവും സംബന്ധിച്ച് വാക്യത്തിലുള്ള വ്യക്തിവ്യത്യാസം വിശദീകരിച്ച് ഇല്ലാതാക്കാതെ അതേപടി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. “തിരുവിഷ്ടം” പോലുള്ള സഭാപരമായി അടയാളപ്പെടുത്തിയ പദം ഒഴിവാക്കി സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ “ഇഷ്ടം” തിരഞ്ഞെടുത്തു; ഗ്രീക്കിലെ ഉദ്ദേശ്യഘടനയും ശക്തമായ വൈരുധ്യവും സംരക്ഷിച്ചു.
