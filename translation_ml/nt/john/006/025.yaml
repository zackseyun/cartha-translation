source:
  edition: SBLGNT
  text: Καὶ εὑρόντες αὐτὸν πέραν τῆς θαλάσσης εἶπον αὐτῷ· Ῥαββί, πότε ὧδε γέγονας;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/025.yaml
  text: And when they found him on the other side of the sea[a], they said to him, “Rabbi, when did you get here?”
translation:
  language: ml
  text: 'അവർ അവനെ കടലിന്റെ മറുകരയിൽ കണ്ടെത്തിയപ്പോൾ അവനോടു പറഞ്ഞു: “റബ്ബീ, അങ്ങ് എപ്പോഴാണ് ഇവിടെ എത്തിയത്[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അങ്ങ് എപ്പോഴാണ് ഇവിടെ വന്നിരിക്കുന്നത്?” ഗ്രീക്കിലെ perfect ക്രിയാരൂപം കൂടുതൽ ഔപചാരികമായി അങ്ങനെ പരിഭാഷപ്പെടുത്താം; എന്നാൽ സന്ദർഭത്തിലെ സ്വാഭാവിക അർഥം ഇവിടെ എത്തിയ സമയത്തെക്കുറിച്ചുള്ള ചോദ്യമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ εὑρόντες αὐτὸν
  choice: അവർ അവനെ … കണ്ടെത്തിയപ്പോൾ
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള aorist participle സ്വാഭാവികമായ മലയാളത്തിൽ കാലസൂചക ഉപവാക്യമായി നൽകുന്നു. Καὶ ഇവിടെ മുൻവിവരണവുമായി ബന്ധിപ്പിക്കുന്ന ലളിത സംയോജകമാണ്; മലയാളവാക്യത്തിന്റെ പ്രവാഹത്തിൽ അത് വേറിട്ട് പരിഭാഷപ്പെടുത്തേണ്ടതില്ല.
- source_word: πέραν τῆς θαλάσσης
  choice: കടലിന്റെ മറുകരയിൽ
  rationale: പέραν + genitive സൂചിപ്പിക്കുന്ന, കടലിന് അപ്പുറത്തുള്ള സ്ഥാനത്തെ സ്വാഭാവികവും വ്യക്തവുമായി അറിയിക്കുന്നു.
- source_word: εἶπον αὐτῷ
  choice: അവനോടു പറഞ്ഞു
  rationale: ചോദ്യം ഉദ്ധരിക്കപ്പെടുന്നുണ്ടെങ്കിലും λέγω എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘പറഞ്ഞു’ നിലനിർത്തുന്നു; ‘ചോദിച്ചു’ എന്നത് സന്ദർഭോചിതമെങ്കിലും അല്പം വ്യാഖ്യാനാത്മകമാണ്.
- source_word: Ῥαββί
  choice: റബ്ബീ
  rationale: യഹൂദ പശ്ചാത്തലവും പ്രത്യേക അഭിസംബോധനയും നിലനിർത്താൻ പദം ലിപ്യന്തരണം ചെയ്യുന്നു; ‘ഗുരുവേ’ എന്ന വിവർത്തനം അതിന്റെ സാംസ്കാരിക പ്രത്യേകത കുറയ്ക്കാം.
- source_word: πότε ὧδε
  choice: എപ്പോഴാണ് ഇവിടെ
  rationale: കാലവും സ്ഥലവും ചോദിക്കുന്ന പദങ്ങളുടെ നേരിട്ടുള്ള, സ്വാഭാവിക മലയാളരൂപം.
- source_word: γέγονας
  choice: എത്തിയത്
  rationale: γίνομαι എന്ന ക്രിയയുടെ perfect രൂപം ഈ സന്ദർഭത്തിൽ ഒരു സ്ഥലത്തെത്തിയതിനെ സൂചിപ്പിക്കുന്നു. ‘ഇവിടെ എത്തിയത്’ ആ സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: αὐτῷ / implied second-person address
  choice: അവനോടു / അങ്ങ്
  rationale: കഥനത്തിൽ ‘അവൻ’ ഉപയോഗിക്കുമ്പോഴും റബ്ബീ എന്ന ആദരാഭിസംബോധനയ്ക്കൊത്ത് നേരിട്ടുള്ള ചോദ്യത്തിൽ ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിക്കുന്നത് ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികമാണ്.
