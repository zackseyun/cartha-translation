translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. ‘റബ്ബീ’ യഹൂദ സാംസ്കാരിക പശ്ചാത്തലം നിലനിർത്തുന്നു; നേരിട്ടുള്ള അഭിസംബോധനയിൽ ‘അങ്ങ്’ ആദരഭാവം നൽകുന്നു. അടിക്കുറിപ്പ് സൂചകം അതു വിശദീകരിക്കുന്ന γέγονας-ന്റെ മലയാളപരിഭാഷയായ ‘എത്തിയത്’ എന്ന പദത്തോടു ചേർത്തിരിക്കുന്നു.
