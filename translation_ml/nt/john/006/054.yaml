  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ τρώγων μου τὴν σάρκα καὶ πίνων μου τὸ αἷμα ἔχει ζωὴν αἰώνιον, κἀγὼ ἀναστήσω αὐτὸν τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/054.yaml
  text: The one who eats my flesh and drinks my blood has eternal life[b][a], and I will raise him up on the last day.
translation:
  language: ml
  text: എന്റെ മാംസം തിന്നുകയും[a] എന്റെ രക്തം കുടിക്കുകയും ചെയ്യുന്നവന് നിത്യജീവൻ ഉണ്ട്; അവസാന നാളിൽ ഞാനും അവനെ ഉയിർപ്പിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ചവച്ചുതിന്നുകയും.’ τρώγω എന്ന ഗ്രീക്ക് ക്രിയ സാധാരണ ‘ഭക്ഷിക്കുക’ എന്നതിനെക്കാൾ കൂടുതൽ മൂർത്തമായ അർഥം വഹിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ τρώγων
  choice: തിന്നുകയും ... ചെയ്യുന്നവന്
  rationale: നിശ്ചയാർഥക പദത്തോടുകൂടിയ വർത്തമാനകാല കൃദന്തം പ്രവൃത്തിയാൽ സവിശേഷനായ ഒരാളെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘ചെയ്യുന്നവന്’ എന്ന ഏകവചനരൂപം ഈ വ്യക്തിപരവും തുടരുന്നതുമായ ഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: τρώγων
  choice: തിന്നുകയും
  rationale: τρώγω സാധാരണ ‘ഭക്ഷിക്കുക’ എന്നതിനെക്കാൾ മൂർത്തമായ തിന്നൽ/ചവച്ചുതിന്നൽ ഭാവം വഹിക്കാം. ‘തിന്നുക’ വ്യക്തവും സ്വാഭാവികവും മൂലപദത്തിന്റെ മൂർത്തത നിലനിർത്തുന്നതുമാണ്; കൂടുതൽ ദൃശ്യമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: μου τὴν σάρκα
  choice: എന്റെ മാംസം
  rationale: ഇവിടെ σάρξ മൂർത്തമായ ‘മാംസം’ എന്നാണ്; ‘ശരീരം’ എന്ന വ്യാഖ്യാനപരമായ പകരം ഉപയോഗിച്ചിട്ടില്ല.
- source_word: καὶ πίνων μου τὸ αἷμα
  choice: എന്റെ രക്തം കുടിക്കുകയും
  rationale: സംയോജിത വർത്തമാനകാല കൃദന്തത്തിന്റെ സമാന്തരഘടന നിലനിർത്തുകയും αἷμα എന്നത് മൃദൂകരിക്കാതെ ‘രക്തം’ എന്നു നൽകുകയും ചെയ്യുന്നു.
- source_word: ἔχει
  choice: ഉണ്ട്
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാല സൂചകക്രിയ നിത്യജീവൻ ഇപ്പോൾ തന്നെ ഉള്ളതായി പറയുന്നു; മലയാളത്തിൽ ‘ഉണ്ട്’ അതിനെ ലളിതമായി വ്യക്തമാക്കുന്നു.
- source_word: ζωὴν αἰώνιον
  choice: നിത്യജീവൻ
  rationale: യോഹന്നാന്റെ രചനകളിൽ സ്ഥിരമായി ഉപയോഗിക്കാവുന്ന, ദൈർഘ്യവും വരാനിരിക്കുന്ന യുഗത്തിന്റെ ജീവിതഗുണവും ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്.
- source_word: κἀγὼ
  choice: ഞാൻ
  rationale: καὶ ἐγώ എന്ന സംയുക്തരൂപത്തിന്റെ തുടർച്ച മുൻവാക്യവുമായി അർദ്ധവിരാമത്തിലൂടെ പ്രകടമാകുന്നു; ‘ഞാൻ’ എന്ന വ്യക്തമായ കർത്താവ് ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: ἀναστήσω αὐτόν
  choice: ഞാൻ അവനെ ഉയിർപ്പിക്കും
  rationale: പുനരുത്ഥാനസന്ദർഭത്തിൽ ἀνίστημι എന്നതിന്റെ സ്വാഭാവിക മലയാളരൂപം ‘ഉയിർപ്പിക്കുക’ ആണ്. αὐτόν എന്ന പുല്ലിംഗ ഏകവചന സർവനാമം ‘അവനെ’ എന്നു നിലനിർത്തുന്നു.
- source_word: τῇ ἐσχάτῃ ἡμέρᾳ
  choice: അവസാന നാളിൽ
  rationale: യോഹന്നാനിലെ അന്ത്യകാലസൂചകമായ പ്രയോഗത്തിന് സ്വാഭാവികവും ഔപചാരികവുമായ മലയാളസമാനത.
theological_decisions:
- issue: മാംസം തിന്നുകയും രക്തം കുടിക്കുകയും ചെയ്യുന്നതിനെ കൂദാശാപരമായോ രൂപകപരമായോ വ്യാഖ്യാനിക്കണമോ
  choice: മൂലപാഠത്തിലെ മൂർത്തമായ തിന്നൽ-കുടിക്കൽ ഭാഷ വ്യാഖ്യാനവികാസമില്ലാതെ നിലനിർത്തി.
  alternative: ഇത് കർത്തൃഭോജനത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്നതായോ വിശ്വാസത്തിന്റെ രൂപകമായോ മുഖ്യപാഠത്തിൽ വിശദീകരിക്കുക.
  rationale: ഗ്രീക്ക് പാഠം തന്നെ ‘മാംസം’, ‘രക്തം’, ‘തിന്നുന്നു’, ‘കുടിക്കുന്നു’ എന്നീ മൂർത്തപദങ്ങൾ ഉപയോഗിക്കുന്നു. പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ വ്യാഖ്യാനം ഇറക്കുമതി ചെയ്യാതിരിക്കാനും പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്താനും അവ അക്ഷരാർഥത്തിൽ നൽകിയിരിക്കുന്നു.
- issue: αὐτόν എന്ന സർവനാമത്തിന്റെ ലിംഗവും എണ്ണവും
  choice: അവനെ
  alternative: ആ വ്യക്തിയെ / അവരെ
  rationale: സർവനാമം പുല്ലിംഗ ഏകവചനമാണ്; ഏകവചന കൃദന്തരൂപം സൂചിപ്പിക്കുന്ന വ്യക്തിയിലേക്കാണ് അത് മടങ്ങുന്നത്. അതിനാൽ വ്യാകരണപരമായ രൂപം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള ശൈലി. ‘തിന്നുക’ എന്നത് ‘ഭക്ഷിക്കുക’ എന്നതിനെക്കാൾ മൂർത്തമായതിനാൽ മൂലത്തിലെ τρώγω-യുടെ ഭാവം മെച്ചമായി കാത്തുസൂക്ഷിക്കുന്നു. വാക്യഘടന ഏകവചനവും വർത്തമാനകാലത്തിൽ നിത്യജീവൻ ഉള്ളതെന്ന ആശയവും വ്യക്തമായി നിലനിർത്തുന്നു.
