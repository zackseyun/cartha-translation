id: JHN.6.66
reference: John 6:66
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐκ τούτου πολλοὶ ⸀ἐκ ⸂τῶν μαθητῶν αὐτοῦ ἀπῆλθον⸃ εἰς τὰ ὀπίσω καὶ οὐκέτι μετ’ αὐτοῦ περιεπάτουν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/066.yaml
  text: From this time many of his disciples went back and no longer walked with him[a].
translation:
  language: ml
  text: അന്നുമുതൽ അവന്റെ ശിഷ്യന്മാരിൽ പലരും പിന്മാറിപ്പോയി; അവർ പിന്നെ അവനോടൊപ്പം നടന്നില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഇക്കാരണത്താൽ അവന്റെ ശിഷ്യന്മാരിൽ പലരും പിന്മാറിപ്പോയി.” ഗ്രീക്ക് പ്രാരംഭപ്രയോഗം കാരണാർഥത്തിലും മനസ്സിലാക്കാം; എന്നാൽ സന്ദർഭത്തിൽ “അന്നുമുതൽ” എന്നത് വഴിത്തിരിവിന്റെ ആശയം കൂടുതൽ നന്നായി പ്രകടിപ്പിക്കുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐκ τούτου
  choice: അന്നുമുതൽ
  rationale: സന്ദർഭത്തിൽ ഇത് യേശുവിന്റെ കഠിനമായ വാക്കുകൾക്കുശേഷമുണ്ടായ നിർണായക വഴിത്തിരിവിനെ സൂചിപ്പിക്കുന്ന കാലിക പ്രയോഗമായി സ്വാഭാവികമായി വായിക്കാം; കാരണാർഥവും സാധ്യതയായി അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: πολλοὶ ἐκ τῶν μαθητῶν αὐτοῦ
  choice: അവന്റെ ശിഷ്യന്മാരിൽ പലരും
  rationale: ἐκ എന്ന ഭാഗികബന്ധം വലിയ ശിഷ്യസമൂഹത്തിൽനിന്നുള്ള പലരെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ഈ രൂപം കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: ἀπῆλθον εἰς τὰ ὀπίσω
  choice: പിന്മാറിപ്പോയി
  rationale: വെറുമൊരു സ്ഥലത്തുനിന്നുള്ള പുറപ്പെടലല്ല, മുമ്പുണ്ടായിരുന്ന സഹവാസത്തിൽനിന്നുള്ള പിൻവാങ്ങലാണ് സംയുക്തപ്രയോഗം സൂചിപ്പിക്കുന്നത്.
- source_word: οὐκέτι
  choice: പിന്നെ ... ഇല്ല
  rationale: ആ ഘട്ടംമുതൽ തുടർന്നുണ്ടായ നിർത്തലിനെ സാധാരണ മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: μετ’ αὐτοῦ περιεπάτουν
  choice: അവനോടൊപ്പം നടന്നില്ല
  rationale: നടക്കുക എന്ന മൂലരൂപകം നിലനിർത്തുന്നതോടൊപ്പം യേശുവുമായുള്ള തുടർന്നുള്ള സഹവാസവും അനുഗമനവും സൂചിപ്പിക്കുന്നു; ‘പിന്തുടർന്നില്ല’ എന്നു വ്യാഖ്യാനിച്ച് പരിമിതപ്പെടുത്തുന്നില്ല.
theological_decisions:
- issue: μαθηταί എന്നത് പന്ത്രണ്ടുപേരെയോ യഥാർഥ വിശ്വാസികളെയോ നിർബന്ധമായി സൂചിപ്പിക്കുന്നുവോ
  choice: ശിഷ്യന്മാർ
  alternative: അനുയായികൾ
  rationale: വാക്യം യേശുവിന്റെ വിശാലമായ ശിഷ്യവൃന്ദത്തിൽപ്പെട്ട പലർ പിന്മാറിയെന്നു മാത്രമാണ് പറയുന്നത്. അവരെ പന്ത്രണ്ടുപേരായി തിരിച്ചറിയുകയോ അവരുടെ വിശ്വാസത്തിന്റെ യാഥാർഥ്യത്തെ വിവർത്തനത്തിൽ വിധിക്കുകയോ ചെയ്യാതെ ആഖ്യാനത്തിലെ വിഭാഗം അതേപടി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യം. ‘പിന്മാറിപ്പോയി’ ഗ്രീക്കിലെ ἀπῆλθον εἰς τὰ ὀπίσω എന്ന സംയുക്ത ആശയം ചുരുക്കമായി നൽകുന്നു; ‘അവനോടൊപ്പം നടന്നു’ എന്ന രൂപകം സംരക്ഷിച്ചിരിക്കുന്നു.
