source:
  edition: SBLGNT
  text: ἀνῆλθεν δὲ εἰς τὸ ⸀ὄρος Ἰησοῦς, καὶ ἐκεῖ ἐκάθητο μετὰ τῶν μαθητῶν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/003.yaml
  text: Then Jesus went up on the mountain, and there he sat with his disciples.
translation:
  language: ml
  text: പിന്നെ യേശു മലയിലേക്കു കയറി; അവിടെ തന്റെ ശിഷ്യന്മാരോടൊപ്പം ഇരിക്കുകയായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνῆλθεν
  choice: കയറി
  rationale: ἀνέρχομαι എന്ന ക്രിയയുടെ ഭൂമിശാസ്ത്രപരമായ മുകളിലേക്കുള്ള ചലനം സ്വാഭാവികമായ മലയാളത്തിൽ ‘കയറി’ എന്നു നൽകുന്നു; ‘ആരോഹിച്ചു’ ഇവിടെ അനാവശ്യമായി ഉയർന്ന ശൈലിയാകും.
- source_word: δὲ
  choice: പിന്നെ
  rationale: ഇവിടെ ശക്തമായ വൈരുധ്യമല്ല, ആഖ്യാനത്തിന്റെ തുടർച്ചയാണ് δέ സൂചിപ്പിക്കുന്നത്; ‘പിന്നെ’ അതിനെ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: εἰς τὸ ὄρος
  choice: മലമുകളിലേക്കു
  rationale: ἀνῆλθεν എന്നതിനോടൊപ്പം ഈ പ്രയോഗം മലയുടെ മുകളിലേക്കോ മലഞ്ചരിവിലേക്കോ കയറുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘മലമുകളിലേക്കു’ ദിശയും സ്ഥലസന്ദർഭവും സ്വാഭാവികമായി നൽകുന്നു; നിർബന്ധമായും കൊടുമുടി എന്ന അർഥം ഉദ്ദേശിക്കുന്നില്ല.
- source_word: Ἰησοῦς
  choice: യേശു
  rationale: മലയാളത്തിലെ സ്ഥാപിതമായ വ്യക്തിനാമരൂപം ഉപയോഗിച്ചു.
- source_word: ἐκεῖ
  choice: അവിടെ
  rationale: സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന സാധാരണ ക്രിയാവിശേഷണത്തിന് നേരിട്ടും സ്വാഭാവികവുമായ മലയാള തുല്യം.
- source_word: ἐκάθητο
  choice: ഇരുന്നു
  rationale: κάθημαι എന്നതിന്റെ അപൂർണ്ണഭൂതകാലരൂപം ഇരിക്കുന്ന നിലയെയോ ഇരുന്ന പ്രവൃത്തിയെയോ സൂചിപ്പിക്കുന്നു; ഈ ആഖ്യാനത്തിൽ ‘ഇരുന്നു’ സ്വാഭാവികമായി രണ്ടും ഉൾക്കൊള്ളുന്നു.
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: തന്റെ ശിഷ്യന്മാരോടൊപ്പം
  rationale: μετά + genitive സഹവാസത്തെ സൂചിപ്പിക്കുന്നു. μαθητής എന്ന ഗുരു-അനുയായി ബന്ധം ‘ശിഷ്യൻ’ കൃത്യമായി നിലനിർത്തുന്നു; αὐτοῦ യേശുവിലേക്കുതന്നെ തിരിച്ചുചൂണ്ടുന്നതിനാൽ ‘തന്റെ’ സ്വാഭാവികമാണ്.
