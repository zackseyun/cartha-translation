reference: John 6:42
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἔλεγον· ⸀Οὐχ οὗτός ἐστιν Ἰησοῦς ὁ υἱὸς Ἰωσήφ, οὗ ἡμεῖς οἴδαμεν τὸν πατέρα καὶ τὴν μητέρα; πῶς ⸀νῦν ⸀λέγει ὅτι Ἐκ τοῦ οὐρανοῦ καταβέβηκα;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/042.yaml
  text: And they were saying, “Is this not Jesus, the son of Joseph, whose father and mother we know? How does he now say, ‘I have come down from heaven’?”
translation:
  language: ml
  text: 'അവർ പറഞ്ഞുകൊണ്ടിരുന്നു: “ഇവൻ യോസേഫിന്റെ മകനായ യേശുവല്ലേ? അവന്റെ അപ്പനെയും അമ്മയെയും നമുക്ക് അറിയാമല്ലോ. അപ്പോൾ, ‘ഞാൻ സ്വർഗത്തിൽനിന്ന് ഇറങ്ങിവന്നിരിക്കുന്നു’ എന്ന് ഇവൻ ഇപ്പോൾ എങ്ങനെ പറയുന്നു?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലത്തിന്റെ തുടർച്ചയായോ ആവർത്തിച്ചോ ഉള്ള സംസാരഭാവം നിലനിർത്തുന്നു.
- source_word: Οὐχ οὗτός ἐστιν
  choice: ഇവൻ ... അല്ലേ?
  rationale: സമ്മതം പ്രതീക്ഷിക്കുന്ന നിഷേധചോദ്യത്തിന്റെ ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പകരുന്നു.
- source_word: ὁ υἱὸς Ἰωσήφ
  choice: യോസേഫിന്റെ മകനായ
  rationale: യേശുവിന്റെ അറിയപ്പെടുന്ന മാനുഷിക കുടുംബപശ്ചാത്തലത്തിൽ ജനക്കൂട്ടം നൽകുന്ന ഊന്നൽ വ്യക്തമായി സൂക്ഷിക്കുന്നു.
- source_word: οὗ ἡμεῖς οἴδαμεν τὸν πατέρα καὶ τὴν μητέρα
  choice: ഇവന്റെ അപ്പനെയും അമ്മയെയും നമുക്ക് അറിയാമല്ലോ
  rationale: ബന്ധവാക്യത്തിന്റെ അർഥവും അവർ അവന്റെ മാതാപിതാക്കളെ അറിയുന്നു എന്ന അവകാശവാദവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ‘അറിയാമല്ലോ’ അവരുടെ വാദാത്മക ഊന്നൽ പ്രകടമാക്കുന്നു.
- source_word: πῶς νῦν λέγει
  choice: എന്ന് ഇവൻ ഇപ്പോൾ പറയുന്നത് എങ്ങനെ?
  rationale: πῶς എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘എങ്ങനെ’യും λέγει എന്ന വർത്തമാനകാലവും നിലനിർത്തുന്നു; ‘എങ്ങനെ പറയാൻ കഴിയും’ എന്ന അധിക സാധ്യതാഭാവം ചേർക്കുന്നില്ല.
- source_word: Ἐκ τοῦ οὐρανοῦ
  choice: സ്വർഗത്തിൽനിന്ന്
  rationale: ഉത്ഭവസ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന ἐκ + ഷഷ്ഠിയുടെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: καταβέβηκα
  choice: ഇറങ്ങിവന്നിരിക്കുന്നു
  rationale: പൂർത്തിയായ ഇറക്കം ഇപ്പോഴും പ്രസക്തമാണെന്ന പൂർണ്ണകാലഭാവം മലയാളത്തിലെ ‘-വന്നിരിക്കുന്നു’ രൂപം നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ സ്വർഗീയ ഉത്ഭവത്തെക്കുറിച്ചുള്ള അവകാശവാദത്തോടുള്ള ജനക്കൂട്ടത്തിന്റെ എതിർപ്പ്
  choice: ‘ഞാൻ സ്വർഗത്തിൽനിന്ന് ഇറങ്ങിവന്നിരിക്കുന്നു’ എന്ന നേരിട്ടുള്ള അവകാശവാദം അതേപടി നിലനിർത്തി.
  alternative: ‘ഞാൻ സ്വർഗത്തിൽനിന്ന് വന്നതാണ്’ എന്നോ രൂപകാത്മക വിശദീകരണമോ
  rationale: വാക്യം യേശുവിന്റെ സ്വർഗീയ ഉത്ഭവവാദം കേട്ട് ജനങ്ങൾക്കുണ്ടായ ഇടർച്ച അവതരിപ്പിക്കുന്നു. മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം മയപ്പെടുത്തുകയോ വിശദീകരിച്ച് തീർക്കുകയോ ചെയ്യാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ഉദ്ധരണിക്കുള്ളിലെ ജനക്കൂട്ടത്തിന്റെ സംസാരത്തിന് സ്വാഭാവികത നൽകാൻ ‘ഇവൻ’, ‘അപ്പൻ’, ‘അമ്മ’ എന്നിവ ഉപയോഗിച്ചു; ഭാഷ സംഭാഷണസഹജമെങ്കിലും അനൗപചാരികമോ അവഹേളനപരമോ ആക്കിയിട്ടില്ല.
