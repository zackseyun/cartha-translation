source:
  edition: SBLGNT
  text: ἔλαβεν ⸀οὖν τοὺς ἄρτους ὁ Ἰησοῦς καὶ εὐχαριστήσας ⸀διέδωκεν τοῖς ἀνακειμένοις, ὁμοίως καὶ ἐκ τῶν ὀψαρίων ὅσον ἤθελον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/011.yaml
  text: So Jesus took the loaves[a], and after giving thanks he distributed them to those who were reclining; likewise also from the fish[b], as much as they wanted.
translation:
  language: ml
  text: അപ്പോൾ യേശു അപ്പങ്ങൾ എടുത്ത്, നന്ദി അർപ്പിച്ചശേഷം ഭക്ഷണത്തിനായി ചാരിക്കിടന്നിരുന്നവർക്ക്[a] അവ പങ്കിട്ടുകൊടുത്തു. അതുപോലെ മീനുകളിൽനിന്നും[b] അവർ ആഗ്രഹിച്ചത്രയും അവർക്കു കൊടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ഭക്ഷണത്തിനിരുന്നവർക്ക്.’ ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘ചാരിക്കിടന്നിരുന്നവർക്ക്’ എന്നാണ്; ഭക്ഷണം കഴിക്കുമ്പോൾ ചാരിക്കിടക്കുന്നത് അന്നത്തെ പതിവായിരുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘ചെറുമീനുകളിൽനിന്നും.’ അപ്പത്തോടൊപ്പം കഴിച്ചിരുന്ന മീനിനെയോ, ഒരുപക്ഷേ ചെറുമീനിനെയോ, ഗ്രീക്ക് പദം സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: അപ്പോൾ
  rationale: കഥയുടെ തുടർച്ചയും സംഭവവികാസവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ഇവിടെ കർശനമായ നിഗമനാർഥം ചുമത്തുന്നില്ല.
- source_word: τοὺς ἄρτους
  choice: അപ്പങ്ങൾ
  rationale: ബഹുവചനം നിലനിർത്തുകയും ഈ സന്ദർഭത്തിലെ ഓരോ അപ്പത്തെയും സ്വാഭാവികമായി സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: εὐχαριστήσας
  choice: നന്ദി അർപ്പിച്ചശേഷം
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുണ്ടായ പ്രവൃത്തിയെ വ്യക്തമാക്കുന്നു; ഗ്രീക്കിൽ പറയാത്ത ദൈവം എന്ന കർമം ചേർക്കുന്നില്ല.
- source_word: διέδωκεν
  choice: പങ്കിട്ടുകൊടുത്തു
  rationale: കൂട്ടത്തിലുള്ളവർക്കു വിതരണം ചെയ്തതെന്ന ക്രിയയുടെ വിതരണാർഥം സാധാരണ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τοῖς ἀνακειμένοις
  choice: ഭക്ഷണത്തിനായി ചാരിയിരുന്നവർക്ക്
  rationale: ഭക്ഷണവേളയിൽ ചാരിക്കിടക്കുന്ന പതിവ് ശരീരനിലയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം നിലനിർത്തുന്നു; വെറും ഇരിപ്പ് എന്നാക്കി മയപ്പെടുത്തുന്നില്ല.
- source_word: ὁμοίως καὶ
  choice: അതുപോലെ
  rationale: അപ്പവും മീനും വിതരണം ചെയ്തതിലെ സമാന്തരത സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἐκ τῶν ὀψαρίων
  choice: മീനുകളിൽനിന്നും
  rationale: പദം ചെറുമീനുകളെയോ അപ്പത്തോടൊപ്പം കഴിക്കുന്ന മീനെയോ സൂചിപ്പിക്കാമെങ്കിലും മുഖ്യവാചകത്തിൽ അനാവശ്യമായ പ്രത്യേകീകരണം ഒഴിവാക്കുന്നു.
- source_word: ὅσον ἤθελον
  choice: അവർ ആഗ്രഹിച്ചത്രയും
  rationale: ആളുകളുടെ ആഗ്രഹത്തിനനുസരിച്ചുള്ള നിയന്ത്രണമില്ലാത്ത അളവ് വ്യക്തമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: εὐχαριστήσας എന്ന പദത്തിന്റെ സാധ്യതയുള്ള കർത്തൃഭോജനസംബന്ധമായ പ്രതിധ്വനി
  choice: നന്ദി അർപ്പിച്ചശേഷം
  alternative: അനുഗ്രഹിച്ചശേഷം; കർത്തൃഭോജനസൂചന മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കുക
  rationale: ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നന്ദി അർപ്പിക്കുക എന്നതാണ്. യോഹന്നാന്റെ വിവരണത്തിൽ വിപുലമായ കർത്തൃഭോജന പ്രതിധ്വനി കാണാമെങ്കിലും അത് വിവർത്തനത്തിൽ കൂട്ടിച്ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘ചാരിയിരുന്നവർ’ എന്നത് ചരിത്രപരമായ ഭക്ഷണരീതി കാത്തുസൂക്ഷിക്കുന്നു; അടിക്കുറിപ്പ് കൂടുതൽ പരിചിതമായ ‘ഇരുന്നവർ’ എന്ന പകരം നൽകുന്നു. ഇംഗ്ലീഷ് consultation layer-ലുള്ള [a] ചിഹ്നം ‘loaves’ എന്നതിനു പിന്നാലെയുണ്ടെങ്കിലും അതിന്റെ കുറിപ്പ് ἀνακειμένοις എന്ന പദത്തെക്കുറിച്ചായതിനാൽ മലയാളത്തിൽ ബന്ധപ്പെട്ട വാക്യഭാഗത്തിനു പിന്നാലെ വെച്ചു.
