id: JHN.6.51
reference: John 6:51
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐγώ εἰμι ὁ ἄρτος ὁ ζῶν ὁ ἐκ τοῦ οὐρανοῦ καταβάς· ἐάν τις φάγῃ ἐκ τούτου τοῦ ἄρτου ⸀ζήσει εἰς τὸν αἰῶνα, καὶ ὁ ἄρτος δὲ ὃν ἐγὼ δώσω ἡ σάρξ μού ⸀ἐστιν ὑπὲρ τῆς τοῦ κόσμου ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/051.yaml
  text: I am the living bread that came down from heaven[a]. If anyone eats of this bread, he will live forever[c][b]. And the bread that I will give for the life of the world is my flesh.
translation:
  language: ml
  text: സ്വർഗത്തിൽനിന്ന് ഇറങ്ങിവന്ന ജീവനുള്ള അപ്പം ഞാനാണ്. ആരെങ്കിലും ഈ അപ്പത്തിൽനിന്ന് തിന്നാൽ, അവൻ എന്നേക്കും ജീവിക്കും.[a] ലോകത്തിന്റെ ജീവനുവേണ്ടി ഞാൻ കൊടുക്കാനിരിക്കുന്ന അപ്പം എന്റെ മാംസമാണ്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘യുഗത്തിലേക്ക് ജീവിക്കും’; ഈ പ്രയോഗത്തിന്റെ അർഥം ‘എന്നേക്കും ജീവിക്കും’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ ‘മാംസം’ എന്നാണ്, ‘ശരീരം’ എന്നല്ല; പദപ്രയോഗം മനപ്പൂർവം മൂർത്തമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἄρτος ὁ ζῶν
  choice: ജീവനുള്ള അപ്പം
  rationale: ζῶν എന്ന വർത്തമാന കർത്തൃവാചക കൃദന്തത്തിന്റെ വിശേഷണബലം നേരിട്ട് നിലനിർത്തുന്നു; സമീപസന്ദർഭത്തിലെ ‘ജീവന്റെ അപ്പം’ എന്ന വ്യത്യസ്ത പ്രയോഗം ഇവിടെ ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: ὁ ἐκ τοῦ οὐρανοῦ καταβάς
  choice: സ്വർഗത്തിൽനിന്ന് ഇറങ്ങിവന്ന
  rationale: പൂർത്തിയായ ഇറങ്ങിവരവിനെ സൂചിപ്പിക്കുന്ന aorist participle സ്വാഭാവികമായ മലയാള കൃദന്തരൂപത്തിൽ നൽകുന്നു.
- source_word: ἐάν τις φάγῃ ἐκ τούτου τοῦ ἄρτου
  choice: ആരെങ്കിലും ഈ അപ്പത്തിൽനിന്ന് ഭക്ഷിച്ചാൽ
  rationale: ἐάν + subjunctive പൊതുവായ നിബന്ധനയായി വിവർത്തനം ചെയ്യുന്നു; ἐκ എന്നതിന്റെ ‘നിന്ന്’ എന്ന ഘടകവും നിലനിർത്തുന്നു.
- source_word: ζήσει εἰς τὸν αἰῶνα
  choice: അവൻ എന്നേക്കും ജീവിക്കും
  rationale: യോഹന്നാന്റെ പ്രയോഗത്തിൽ εἰς τὸν αἰῶνα ദീർഘകാലത്തേക്കല്ല, അവസാനമില്ലാത്ത നിലനിൽപ്പിനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘എന്നേക്കും’ അതിന്റെ സ്വാഭാവിക സമാനതയാണ്.
- source_word: ὁ ἄρτος δὲ ὃν ἐγὼ δώσω
  choice: ഞാൻ കൊടുക്കുന്ന അപ്പം
  rationale: ഭാവികാലത്തിലെ സ്വയംനൽകലിന്റെ ആശയം മലയാളത്തിലെ സന്ദർഭസഹജമായ ഭാവിയർഥമുള്ള വർത്തമാനരൂപം കൈമാറുന്നു; δέ സൂചിപ്പിക്കുന്ന ആശയവികാസം പുതിയ വാക്യക്രമത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: ἡ σάρξ μού ἐστιν
  choice: എന്റെ മാംസമാണ്
  rationale: σάρξ എന്നതിന്റെ മൂർത്തവും മനപ്പൂർവം ശക്തവുമായ പദപ്രയോഗം ‘ശരീരം’ എന്നു മയപ്പെടുത്താതെ ‘മാംസം’ എന്നു നിലനിർത്തുന്നു.
- source_word: ὑπὲρ τῆς τοῦ κόσμου ζωῆς
  choice: ലോകത്തിന്റെ ജീവനുവേണ്ടി
  rationale: ὑπέρ എന്നതിന്റെ ഗുണഭോക്തൃ/ലക്ഷ്യബലം സ്വാഭാവികമായി നൽകുകയും κόσμος എന്നതിന്റെ വിശാലത ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: κόσμος
  choice: ലോകം
  rationale: യോഹന്നാനിലെ പദപ്രതിധ്വനി നിലനിർത്തുന്നു; ‘മനുഷ്യവർഗം’ പോലുള്ള വ്യാഖ്യാനപരമായ ചുരുക്കം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ സ്വയംവിവരണത്തിലെ σάρξ എന്ന പദത്തിന്റെ അർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘മാംസം’
  alternative: ‘ശരീരം’
  rationale: ഇവിടെ പദം മൂർത്തമായ യേശുവിന്റെ സ്വയംനൽകലുമായി ബന്ധപ്പെട്ടിരിക്കുന്നു. ‘ശരീരം’ എന്ന് മാറ്റുന്നത് ഗ്രീക്കിന്റെ തീവ്രത കുറയ്ക്കുകയും വ്യാഖ്യാനം മുൻകൂട്ടി നിശ്ചയിക്കുകയും ചെയ്യും.
- issue: ‘ലോകം’ എന്നതിന്റെ വ്യാപ്തി
  choice: ‘ലോകം’ എന്നു തന്നെ നിലനിർത്തുക
  alternative: ‘മനുഷ്യവർഗം’ അല്ലെങ്കിൽ ഏതെങ്കിലും ചുരുക്കപ്പെട്ട വിഭാഗം
  rationale: κόσμος എന്ന വിശാല പദത്തെ ഒരു പ്രത്യേക ദൈവശാസ്ത്രസംവിധാനത്തിന്റെ അടിസ്ഥാനത്തിൽ ചുരുക്കാതെ വാക്യത്തിലെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തിയും സംഘർഷവും സംരക്ഷിക്കുന്നു.
- issue: ‘സ്വർഗത്തിൽനിന്ന് ഇറങ്ങിവന്ന’ എന്നതിന്റെ ക്രിസ്തുശാസ്ത്രബലം
  choice: യഥാർഥമായ ഇറങ്ങിവരവിനെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള വിവർത്തനം
  alternative: ദൈവിക നിയോഗത്തിന്റെ രൂപകം മാത്രമായി അവതരിപ്പിക്കൽ
  rationale: ഗ്രീക്ക് വാചകം ഉന്നയിക്കുന്ന അവകാശവാദം വ്യാഖ്യാനപരമായി ദുർബലപ്പെടുത്താതെ നേരിട്ട് കൈമാറുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘ജീവനുള്ള അപ്പം,’ ‘സ്വർഗത്തിൽനിന്ന് ഇറങ്ങിവന്ന,’ ‘മാംസം’ എന്നീ മൂലപാഠസവിശേഷതകൾ നിലനിർത്തി. പ്രതിനിധാന ഏകവചനമായ τις ... ζήσει എന്ന ഘടന ‘ആരെങ്കിലും ... അവൻ’ എന്നു സൂക്ഷിച്ചു.
