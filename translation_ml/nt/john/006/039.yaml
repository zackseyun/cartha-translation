id: JHN.6.39
reference: John 6:39
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῦτο δέ ἐστιν τὸ θέλημα τοῦ πέμψαντός ⸀με ἵνα πᾶν ὃ δέδωκέν μοι μὴ ἀπολέσω ἐξ αὐτοῦ ἀλλὰ ἀναστήσω ⸀αὐτὸ τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/039.yaml
  text: 'And this is the will of the one who sent me: that I should lose nothing of all that he has given me[a], but should raise it up on the last day.'
translation:
  language: ml
  text: 'എന്നെ അയച്ചവന്റെ ഇഷ്ടം ഇതാണ്: അവൻ എനിക്കു നൽകിയിട്ടുള്ള സകലത്തിൽനിന്ന് ഒന്നും ഞാൻ നഷ്ടപ്പെടുത്താതെ, അതിനെ അന്ത്യനാളിൽ ഉയിർപ്പിക്കണമെന്നതാണ്.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, വ്യക്തികളെ കൂടുതൽ നേരിട്ട് സൂചിപ്പിച്ച്: “അവൻ എനിക്കു നൽകിയിട്ടുള്ള ആരെയും ഞാൻ നഷ്ടപ്പെടുത്താതെ ... അവരെ ഉയിർപ്പിക്കണം.” ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “സകലവും ... അതിനെ” എന്ന നപുംസക ഏകവചന കൂട്ടപ്രയോഗമാണ്.'
    reason: alternative_reading
lexical_decisions:
- source_word: θέλημα
  choice: ഇഷ്ടം
  rationale: ദൈവത്തിന്റെ ഉദ്ദേശ്യത്തെയും ഹിതത്തെയും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്ന, ആധുനിക മലയാളത്തിൽ പരിചിതമായ പദം.
- source_word: τοῦ πέμψαντός με
  choice: എന്നെ അയച്ചവൻ
  rationale: നാമവാചകമായി ഉപയോഗിച്ച ഗ്രീക്ക് കൃദന്തത്തിന്റെ ബന്ധപരവും ക്രിയാത്മകവുമായ അർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: πᾶν ὃ δέδωκέν μοι
  choice: അവൻ എനിക്കു തന്നിട്ടുള്ള സകലവും
  rationale: നപുംസക ഏകവചനത്തിലുള്ള കൂട്ടവാചകത്തെ വ്യക്തികളായി മുൻകൂട്ടി വ്യാഖ്യാനിക്കാതെ സംരക്ഷിക്കുന്നു; perfect ക്രിയയുടെ നിലനിൽക്കുന്ന ഫലം ‘തന്നിട്ടുള്ള’ എന്നതിൽ പ്രതിഫലിക്കുന്നു.
- source_word: μὴ ἀπολέσω ἐξ αὐτοῦ
  choice: സകലത്തിൽനിന്നും ഒന്നും ഞാൻ നഷ്ടപ്പെടുത്താതെ
  rationale: ഈ സന്ദർഭത്തിൽ ἀπόλλυμι എന്നത് ‘നശിപ്പിക്കുക’ എന്നതിനെക്കാൾ ‘നഷ്ടപ്പെടുത്തുക’ എന്നാണ്; ἐξ αὐτοῦ എന്ന ഭാഗവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἀναστήσω αὐτὸ
  choice: അതിനെ ഉയിർപ്പിക്കണം
  rationale: അന്ത്യകാല ഉയിർത്തെഴുന്നേൽപ്പിനെ സൂചിപ്പിക്കുകയും αὐτό എന്ന നപുംസക ഏകവചന സർവനാമത്തോട് ഒത്തുനിൽക്കുകയും ചെയ്യുന്നു.
- source_word: τῇ ἐσχάτῃ ἡμέρᾳ
  choice: അന്ത്യനാളിൽ
  rationale: യോഹന്നാനിലെ അന്ത്യകാലസൂചനയെ ചുരുക്കമായും സ്വാഭാവികമായും പകരുന്നു.
theological_decisions:
- issue: കൂട്ടവാചകത്തെ വ്യക്തിപരമായി ‘എല്ലാവരെയും’ എന്നു പരിഭാഷപ്പെടുത്തണമോ, ഗ്രീക്കിലെ നപുംസക ഏകവചനരൂപം നിലനിർത്തണമോ എന്നത്.
  choice: സകലവും ... അതിനെ
  alternative: എനിക്ക് തന്നിട്ടുള്ള എല്ലാവരെയും ... അവരെ
  rationale: πᾶν, ὃ, αὐτό എന്നിവ നപുംസക ഏകവചനങ്ങളാണ്. അവയുടെ കൂട്ടവാചകസ്വഭാവം നിലനിർത്തുന്നത് മൂലപാഠത്തിലെ യഥാർഥ രൂപവും അർഥതുറപ്പില്ലായ്മയും സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ ആളുകളാണ് ഉദ്ദേശ്യമെന്ന സാധ്യത അടച്ചുപൂട്ടുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സകലത്തിൽനിന്നും ഒന്നും’ എന്ന ഘടന ഗ്രീക്കിലെ കൂട്ടവാചകവും ἐξ αὐτοῦ എന്ന ആശയവും നിലനിർത്തുന്നു; അടിക്കുറിപ്പുചിഹ്നം പ്രധാനവാചകത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
