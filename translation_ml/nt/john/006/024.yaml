  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അവർതന്നെ’ എന്ന രൂപം മൂലപാഠത്തിലെ ഊന്നൽ നിലനിർത്തുന്നു; സ്ഥലനാമത്തിന് മലയാളത്തിൽ പ്രചാരമുള്ള ‘കഫർന്നഹൂം’ ഉപയോഗിച്ചു.
