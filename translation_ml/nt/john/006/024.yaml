id: JHN.6.24
reference: John 6:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτε οὖν εἶδεν ὁ ὄχλος ὅτι Ἰησοῦς οὐκ ἔστιν ἐκεῖ οὐδὲ οἱ μαθηταὶ αὐτοῦ, ἐνέβησαν αὐτοὶ εἰς τὰ ⸀πλοιάρια καὶ ἦλθον εἰς Καφαρναοὺμ ζητοῦντες τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/024.yaml
  text: So when the crowd saw that Jesus was not there[a], nor his disciples, they themselves got into the boats and came to Capernaum, looking for Jesus.
translation:
  language: ml
  text: അങ്ങനെ, യേശുവോ അവന്റെ ശിഷ്യന്മാരോ അവിടെ ഇല്ലെന്നു ജനക്കൂട്ടം കണ്ടപ്പോൾ, അവർതന്നെ വള്ളങ്ങളിൽ[a] കയറി യേശുവിനെ അന്വേഷിച്ചുകൊണ്ട് കഫർന്നഹൂമിലേക്കു വന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ചെറിയ വള്ളങ്ങളിൽ’ അല്ലെങ്കിൽ ‘കൊച്ചുവള്ളങ്ങളിൽ’; ഗ്രീക്കിൽ ‘വള്ളങ്ങൾ’ എന്ന പദത്തിന്റെ ലഘുരൂപമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε οὖν
  choice: അങ്ങനെ ... കണ്ടപ്പോൾ
  rationale: ὅτε എന്ന കാലസൂചനയും οὖν എന്ന ആഖ്യാനത്തുടർച്ചയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഒരുമിച്ച് അറിയിക്കുന്നു.
- source_word: ὁ ὄχλος
  choice: ജനക്കൂട്ടം
  rationale: ഒരു സ്ഥലത്ത് കൂടിയിരുന്ന ആളുകളുടെ കൂട്ടത്തെ സൂചിപ്പിക്കുന്ന ὄχλος എന്ന പദത്തിന്റെ വ്യക്തവും സാധാരണവുമായ മലയാളരൂപം.
- source_word: εἶδεν
  choice: കണ്ടപ്പോൾ
  rationale: പാഠത്തിലെ നേരിട്ടുള്ള ദർശനാർഥം നിലനിർത്തുന്നു; ‘മനസ്സിലാക്കിയപ്പോൾ’ എന്നു വിവർത്തനം ചെയ്ത് ബൗദ്ധിക നിഗമനം അധികമായി ചേർക്കുന്നില്ല.
- source_word: οὐκ ἔστιν ἐκεῖ οὐδὲ οἱ μαθηταὶ αὐτοῦ
  choice: യേശുവോ അവന്റെ ശിഷ്യന്മാരോ അവിടെ ഇല്ലെന്ന്
  rationale: രണ്ടു കർത്താക്കളെയും നിഷേധാത്മക ഏകോപനത്തിൽ ചേർത്ത്, മലയാളത്തിൽ സ്വാഭാവികമായി ഗ്രീക്കിലെ അർഥം നിലനിർത്തുന്നു.
- source_word: ἐνέβησαν αὐτοὶ
  choice: അവർതന്നെ ... കയറി
  rationale: ἐμβαίνω എന്നതിന്റെ വള്ളത്തിൽ കയറുക എന്ന അർഥവും αὐτοί നൽകുന്ന ഊന്നലും സംരക്ഷിക്കുന്നു.
- source_word: τὰ πλοιάρια
  choice: വള്ളങ്ങളിൽ
  rationale: സന്ദർഭത്തിന് യോജിച്ച ലളിതമായ മുഖ്യപാഠരൂപം; ഗ്രീക്കിലെ ലഘുരൂപസാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: ἦλθον εἰς Καφαρναούμ
  choice: കഫർന്നഹൂമിലേക്കു വന്നു
  rationale: ἔρχομαι എന്ന ക്രിയയുടെ ‘വന്നു’ എന്ന അടിസ്ഥാനമൂല്യം ആഖ്യാനത്തിന്റെ ദൃഷ്ടികോണത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ζητοῦντες τὸν Ἰησοῦν
  choice: യേശുവിനെ അന്വേഷിച്ചുകൊണ്ട്
  rationale: യേശുവിനെ കണ്ടെത്താനുള്ള അവരുടെ പ്രവൃത്തിയെ വ്യക്തമാക്കുന്നു; അനാവശ്യമായ ആത്മീയ സാങ്കേതികാർഥം ചേർക്കുന്നില്ല.
