    issue: Added concessive purchase clause
    rationale: “ഇരുനൂറ് ദിനാറിനുള്ള അപ്പം വാങ്ങിയാലും” adds a verb for buying and the concessive sense “even if,” whereas Διακοσίων δηναρίων ἄρτοι is a nominal expression, “bread worth two hundred denarii.” This subtly changes the syntax and emphasis.
