  text: ἀπεκρίθη ⸀αὐτῷ Φίλιππος· Διακοσίων δηναρίων ἄρτοι οὐκ ἀρκοῦσιν αὐτοῖς ἵνα ⸀ἕκαστος βραχύ ⸀τι λάβῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/007.yaml
  text: Philip answered him, “Two hundred denarii worth of bread is not enough for them, so that each one may receive a little.”
translation:
  language: ml
  text: 'ഫിലിപ്പോസ് അവനോട് ഉത്തരം പറഞ്ഞു: “ഓരോരുത്തർക്കും അല്പമെങ്കിലും ലഭിക്കത്തക്കവണ്ണം ഇരുനൂറ് ദിനാറിന്റെ അപ്പം അവർക്കു മതിയാകുകയില്ല.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διακοσίων δηναρίων ἄρτοι
  choice: ഇരുനൂറ് ദിനാറിനുള്ള അപ്പം
  rationale: വിലയെ സൂചിപ്പിക്കുന്ന ജനിറ്റീവ് പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കി; പുരാതന നാണയത്തിന്റെ പേര് അളവ് മാറ്റാതെ നിലനിർത്തി.
- source_word: οὐκ ἀρκοῦσιν
  choice: മതിയാകുകയില്ല
  rationale: അപ്പത്തിന്റെ അളവ് എല്ലാവർക്കും പോരാ എന്ന മൂലവാക്യത്തിന്റെ അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: ἵνα ἕκαστος βραχύ τι λάβῃ
  choice: ഓരോരുത്തർക്കും അല്പമെങ്കിലും ലഭിക്കാൻ
  rationale: ἵναയുടെ ഫല/ഉദ്ദേശ്യ സൂക്ഷ്മത തുറന്നുവെച്ചുകൊണ്ട് സ്വാഭാവികമായ മലയാള ഘടന ഉപയോഗിച്ചു; βραχύ τι എന്നതിനെ ‘അല്പമെങ്കിലും’ എന്നു നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് സുഗമവുമായ മലയാളം. സംഭാഷണത്തിന്റെ കണക്കുകൂട്ടൽഭാവം നിലനിർത്തുന്നു; ‘ദിനാർ’ എന്ന ചരിത്രനാണയം ആധുനിക മൂല്യത്തിലേക്ക് പരിവർത്തനം ചെയ്തിട്ടില്ല.
