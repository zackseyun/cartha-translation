  source_fidelity: The draft accurately represents the sequential/inferential force of both occurrences of οὖν, the present-tense questions, and the distinction between πιστεύω + dative and the usual Johannine πιστεύω εἰς construction. The main rendering ‘നിന്നെ വിശ്വസിക്കുക’ properly avoids importing ‘believe in.’ A minor revision improves the coordination of ‘see and believe’ and makes the footnote anchor directly follow the expression it explains.
