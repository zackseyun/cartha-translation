id: JHN.6.30
reference: John 6:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπον οὖν αὐτῷ· Τί οὖν ποιεῖς σὺ σημεῖον, ἵνα ἴδωμεν καὶ πιστεύσωμέν σοι; τί ἐργάζῃ;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/030.yaml
  text: So they said to him[a], “Then what sign are you doing, so that we may see and believe you? What work are you doing?”
translation:
  language: ml
  text: 'അപ്പോൾ അവർ അവനോട് പറഞ്ഞു: “എങ്കിൽ, ഞങ്ങൾ കണ്ട് നിന്നെ വിശ്വസിക്കേണ്ടതിന്[a] നീ എന്ത് അടയാളം ചെയ്യുന്നു? നീ എന്ത് പ്രവൃത്തി ചെയ്യുന്നു?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നിന്നിൽ വിശ്വസിക്കേണ്ടതിന്” അല്ലെങ്കിൽ “നിന്നെ ആശ്രയിക്കേണ്ടതിന്.” ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “നിന്നെ വിശ്വസിക്കുക” എന്നാണ്; യോഹന്നാനിൽ കൂടുതലായി കാണുന്ന “ഒരാളിൽ വിശ്വസിക്കുക” എന്ന ഘടനയല്ല ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπον οὖν αὐτῷ
  choice: അപ്പോൾ അവർ അവനോട് പറഞ്ഞു
  rationale: οὖν സൂചിപ്പിക്കുന്ന മുൻസംഭാഷണത്തോടുള്ള തുടർച്ച സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘അപ്പോൾ’ നിലനിർത്തുന്നു.
- source_word: Τί οὖν
  choice: എങ്കിൽ ... എന്ത്
  rationale: ആവർത്തിക്കുന്ന οὖν ജനക്കൂട്ടത്തിന്റെ വെല്ലുവിളിപരമായ തുടർചോദ്യം പ്രകടമാക്കുന്നു; ‘എങ്കിൽ’ മലയാളത്തിൽ അതിന്റെ അനുമാനാത്മക ബലം നൽകുന്നു.
- source_word: ποιεῖς σὺ σημεῖον
  choice: നീ എന്ത് അടയാളമാണ് ചെയ്യുന്നത്
  rationale: വർത്തമാനകാലപ്രയോഗവും σὺ എന്ന ഊന്നലും നിലനിർത്തുന്നു; ചോദ്യം യേശു ഇപ്പോൾ എന്ത് തെളിവ് നൽകുന്നു എന്നതിലേക്കാണ് വിരൽചൂണ്ടുന്നത്.
- source_word: σημεῖον
  choice: അടയാളം
  rationale: യോഹന്നാനിലെ സവിശേഷവും ദൈവശാസ്ത്രപരമായി സമ്പന്നവുമായ പദം വ്യാഖ്യാനാത്മകമായ ‘അത്ഭുതം’ എന്നു ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: ἵνα ἴδωμεν καὶ πιστεύσωμέν σοι
  choice: ഞങ്ങൾ കണ്ടിട്ട് നിന്നെ വിശ്വസിക്കേണ്ടതിന്
  rationale: ἵναയുടെ ഉദ്ദേശ്യഭാവവും കാണുക–വിശ്വസിക്കുക എന്ന ക്രമവും നിലനിർത്തുന്നു. σοι ദത്തിവിഭക്തിയായതിനാൽ ‘നീ പറയുന്നത് വിശ്വസിക്കുക’ എന്ന സാധ്യത പ്രധാനപാഠത്തിലെ സ്വാഭാവികമായ ‘നിന്നെ വിശ്വസിക്കുക’ എന്നതിൽ സംരക്ഷിക്കുന്നു.
- source_word: τί ἐργάζῃ
  choice: നീ എന്ത് പ്രവൃത്തിയാണ് ചെയ്യുന്നത്
  rationale: ἐργάζομαιയുടെ ‘പ്രവർത്തിക്കുക/നിർവഹിക്കുക’ എന്ന ഭാവം ‘പ്രവൃത്തി’ വഴി പ്രകടമാക്കുകയും മുൻപത്തെ ποιεῖς-നോടുള്ള വാക്യസമാന്തര്യം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: πιστεύω എന്ന ക്രിയയോടൊപ്പം ദത്തിവിഭക്തിയായ σοι വരുന്നതിന്റെ അർഥബലം
  choice: നിന്നെ വിശ്വസിക്കുക
  alternative: നിന്നിൽ വിശ്വസിക്കുക; നിന്നിൽ ആശ്രയിക്കുക; നീ പറയുന്നത് വിശ്വസിക്കുക
  rationale: മൂലപാഠത്തിൽ യോഹന്നാനിൽ സാധാരണ കാണുന്ന εἰς + accusative (‘ഒരാളിൽ വിശ്വസിക്കുക’) അല്ല, ദത്തിവിഭക്തിയാണ്. അതിനാൽ വ്യത്യാസം മായ്ച്ചുകളയാതെ പ്രധാനപാഠത്തിൽ ‘നിന്നെ വിശ്വസിക്കുക’ എന്നു നൽകി, സാധ്യതയുള്ള അർഥങ്ങൾ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സംഭാഷണശൈലി. ‘അടയാളം’ എന്ന യോഹന്നാനീയ മുഖ്യപദവും ποιεῖς/ἐργάζῃ തമ്മിലുള്ള പ്രവൃത്തി-സമാന്തര്യവും സംരക്ഷിച്ചു. അടിക്കുറിപ്പിന്റെ സൂചകം ബന്ധപ്പെട്ട ‘വിശ്വസിക്കുക’ എന്ന ആശയത്തിനു പിന്നാലെ വരുന്നതിന് പകരം പ്രസാധനശൈലിയിൽ വാക്യാവസാനത്ത് നൽകിയിരിക്കുന്നു.
