  terminology: ‘അടയാളം’ is the appropriate consistent rendering for σημεῖον. ‘പ്രവൃത്തി’ preserves the more specific work/perform sense of ἐργάζῃ without unnecessarily making it miraculous. ‘നിന്നെ വിശ്വസിക്കുക’ faithfully represents the dative construction and should remain distinct from ‘നിന്നിൽ വിശ്വസിക്കുക.’
