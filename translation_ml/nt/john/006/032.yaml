  source_fidelity: പ്രധാനപാഠം ഗ്രീക്ക് വാക്യത്തിന്റെ കർത്തൃവിരുദ്ധത, മോശെയുമായി ബന്ധപ്പെട്ട മുൻകാല ദാനം, പിതാവിന്റെ വർത്തമാനകാല ദാനം, ‘യഥാർഥ’ അപ്പത്തിന്റെ വിശേഷണം എന്നിവ മിക്കവാറും വിശ്വസ്തമായി നൽകുന്നു. എന്നാൽ ἀλλάയുടെ വ്യക്തമായ വിരുദ്ധബന്ധം പ്രധാനപാഠത്തിൽ ‘എന്നാൽ’ ഉപയോഗിച്ച് പ്രകടമാക്കുന്നതാണ് ഉചിതം.
