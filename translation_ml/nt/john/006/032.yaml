  terminology: ‘സത്യമായി, സത്യമായി,’ ‘സ്വർഗത്തിൽനിന്നുള്ള അപ്പം,’ ‘എന്റെ പിതാവ്,’ ‘യഥാർഥമായ അപ്പം’ എന്നിവ യോജിച്ച പദപ്രയോഗങ്ങളാണ്. ‘യഥാർഥമായ’ എന്നത് ἀληθινός-ന്റെ ‘ശരിക്കുള്ള/യഥാർഥസ്വഭാവമുള്ള’ എന്ന വ്യാപ്തി തുറന്നുവയ്ക്കുന്നു.
  issues:
