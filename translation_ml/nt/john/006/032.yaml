id: JHN.6.32
reference: John 6:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν, οὐ Μωϋσῆς ⸀δέδωκεν ὑμῖν τὸν ἄρτον ἐκ τοῦ οὐρανοῦ, ἀλλ’ ὁ πατήρ μου δίδωσιν ὑμῖν τὸν ἄρτον ἐκ τοῦ οὐρανοῦ τὸν ἀληθινόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/032.yaml
  text: So Jesus said to them[a], “Truly, truly, I say to you, Moses has not given you the bread from heaven[b], but my Father gives you the true bread from heaven.”
translation:
  language: ml
  text: 'അതുകൊണ്ട് യേശു അവരോടു പറഞ്ഞു: “സത്യമായി, സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: സ്വർഗത്തിൽനിന്നുള്ള അപ്പം നിങ്ങൾക്കു തന്നത് മോശയല്ല[a]; എന്നാൽ എന്റെ പിതാവാണ് സ്വർഗത്തിൽനിന്നുള്ള യഥാർഥമായ അപ്പം[b] നിങ്ങൾക്കു തരുന്നത്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സ്വർഗത്തിൽനിന്നുള്ള അപ്പം നിങ്ങൾക്കു തന്നവൻ മോശെയല്ല.” ഗ്രീക്കിൽ നിഷേധം ‘മോശെ’ എന്ന പേരിനു മുമ്പിലാണ്; അതിനാൽ ദാതാവ് ആരെന്ന വ്യത്യാസത്തിന് പ്രത്യേക ഊന്നലുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: ‘യഥാർഥമായ അപ്പം’ എന്നതിന് ‘ശരിക്കുള്ള’ അല്ലെങ്കിൽ ‘യഥാർഥസ്വഭാവമുള്ള’ അപ്പം എന്നും അർഥമാകാം. മുമ്പത്തെ മന്നയുമായുള്ള താരതമ്യത്തിൽ, ഇത് സ്വർഗത്തിൽനിന്നുള്ള സമ്പൂർണവും യഥാർഥവുമായ അപ്പത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻ സംഭാഷണത്തിൽനിന്നുള്ള തുടർച്ചയും നിഗമനസ്വഭാവവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: Ἀμὴν ἀμὴν
  choice: സത്യമായി, സത്യമായി
  rationale: യോഹന്നാനിലെ ഗൗരവവും ഊന്നലുമുള്ള ഇരട്ട പ്രഖ്യാപനസൂത്രത്തിന്റെ ആവർത്തനം നിലനിർത്തുകയും അതിന്റെ അർഥം സാധാരണ വായനക്കാർക്ക് നേരിട്ട് മനസ്സിലാകുന്ന വിധത്തിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: ഗ്രീക്ക് പ്രയോഗത്തെ സുതാര്യമായും പ്രഖ്യാപനസൂത്രത്തിന് യോജിച്ച ഗൗരവത്തോടെയും അവതരിപ്പിക്കുന്നു.
- source_word: οὐ Μωϋσῆς δέδωκεν ὑμῖν
  choice: നിങ്ങൾക്കു തന്നത് മോശയല്ല
  rationale: നിഷേധം മോശെയെന്ന കർത്താവിൽ കേന്ദ്രീകരിക്കുന്ന ഗ്രീക്ക് വാക്യത്തിന്റെ ഊന്നൽ സ്വാഭാവിക മലയാള വിഭക്തവാക്യത്തിലൂടെ നിലനിർത്തുന്നു; δέδωκεν സൂചിപ്പിക്കുന്ന മുൻകാല ദാനത്തെ ‘തന്നത്’ വ്യക്തമാക്കുന്നു.
- source_word: τὸν ἄρτον ἐκ τοῦ οὐρανοῦ
  choice: സ്വർഗത്തിൽനിന്നുള്ള അപ്പം
  rationale: ἐκ എന്നതിന്റെ ഉറവിടസൂചനയും അപ്പത്തിന്റെ ദൃശ്യബിംബവും സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
- source_word: ἀλλ’ ὁ πατήρ μου δίδωσιν ὑμῖν
  choice: എന്റെ പിതാവാണ് ... നിങ്ങൾക്കു തരുന്നത്
  rationale: മോശെയോടുള്ള കർത്തൃവ്യത്യാസം ‘ആണ്’ കൊണ്ട് ഊന്നുകയും δίδωσιν എന്ന വർത്തമാനകാലത്തെ ‘തരുന്നത്’ കൊണ്ട് നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: τὸν ἀληθινόν
  choice: യഥാർഥമായ
  rationale: ἀληθινός എന്നത് വെറും അസത്യത്തിന്റെ വിപരീതമെന്നതിലുപരി യഥാർഥവും അന്തിമവുമായതിനെ സൂചിപ്പിക്കാവുന്നതിനാൽ ‘യഥാർഥമായ’ ആ യോഹന്നാനീയ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
theological_decisions:
- issue: മോശെയുമായി ബന്ധപ്പെട്ട മുൻകാല ദാനവും പിതാവിന്റെ വർത്തമാനകാല ദാനവും തമ്മിലുള്ള വ്യത്യാസം
  choice: ‘തന്നത് ... തരുന്നത്’ എന്നു പരിഭാഷപ്പെടുത്തി കാലപരമായ വ്യത്യാസം നിലനിർത്തി.
  alternative: ‘കൊടുത്തില്ല ... കൊടുക്കുന്നു’ എന്നു നേരിട്ടുള്ള കാലരൂപങ്ങളിൽ നൽകുക.
  rationale: വാക്യം ദാതാക്കളെ മാത്രമല്ല, മരുഭൂമിയിലെ മന്നയുമായി ബന്ധപ്പെട്ട മുൻകാല ദാനത്തെയും പിതാവിന്റെ ഇപ്പോഴത്തെ ദാനത്തെയും വ്യത്യസ്തമാക്കുന്നു; അധിക സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കാതെ ഗ്രീക്ക് ക്രിയാരൂപങ്ങളുടെ ഭേദം പ്രകടമാക്കുന്നു.
- issue: ‘യഥാർഥമായ അപ്പം’ എന്നതിന്റെ അർഥം
  choice: പ്രധാനപാഠത്തിൽ ‘യഥാർഥമായ അപ്പം’ നിലനിർത്തി.
  alternative: ‘യഥാർഥ അപ്പം’, ‘ശരിക്കുള്ള അപ്പം’, അല്ലെങ്കിൽ ‘അന്തിമമായ അപ്പം’ എന്നു നൽകുക.
  rationale: യോഹന്നാനിൽ ἀληθινός മുൻകാല അടയാളങ്ങൾ ചൂണ്ടിക്കാണിക്കുന്ന സമ്പൂർണ യാഥാർഥ്യത്തെ സൂചിപ്പിക്കാം. ‘യഥാർഥമായ’ എന്നത് ആ ദൈവശാസ്ത്രപരമായ സംഘർഷവും അർഥവ്യാപ്തിയും വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. യോഹന്നാനിലെ ഇരട്ട സത്യപ്രഖ്യാപനം ആവർത്തനത്തോടെ നിലനിർത്തുന്നു; കർത്തൃവ്യത്യാസവും ക്രിയകളുടെ കാലഭേദവും വായനാസൗകര്യം നഷ്ടപ്പെടുത്താതെ പ്രകടമാക്കുന്നു.
