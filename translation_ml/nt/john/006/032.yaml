- from: 'അതുകൊണ്ട് യേശു അവരോടു പറഞ്ഞു: “സത്യമായി, സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: സ്വർഗത്തിൽനിന്നുള്ള അപ്പം നിങ്ങൾക്കു തന്നത് മോശയല്ല[a]; എന്റെ പിതാവാണ് സ്വർഗത്തിൽനിന്നുള്ള യഥാർഥമായ അപ്പം[b] നിങ്ങൾക്കു തരുന്നത്.”'
  to: 'അതുകൊണ്ട് യേശു അവരോടു പറഞ്ഞു: “സത്യമായി, സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: സ്വർഗത്തിൽനിന്നുള്ള അപ്പം നിങ്ങൾക്കു തന്നത് മോശയല്ല[a]; എന്നാൽ എന്റെ പിതാവാണ് സ്വർഗത്തിൽനിന്നുള്ള യഥാർഥമായ അപ്പം[b] നിങ്ങൾക്കു തരുന്നത്.”'
  rationale: പ്രധാനപാഠത്തിൽ ἀλλάയുടെ വിരുദ്ധബന്ധം ‘എന്നാൽ’ ചേർത്ത് വ്യക്തമായി. ‘യഥാർഥമായ അപ്പം’ എന്ന മുഖ്യവായന മാറ്റിയിട്ടില്ല. അടിക്കുറിപ്പ് b-യിൽ അസ്വാഭാവികമായ സോപാധിക പ്രസ്താവന നീക്കി, ἀληθινός-ന്റെ ‘genuine/ultimate reality’ എന്ന വ്യാപ്തി വ്യാഖ്യാനാതിക്രമമില്ലാതെ സൂചിപ്പിച്ചു.
