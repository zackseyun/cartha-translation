  yaml_path: translation/nt/john/006/047.yaml
  text: Truly[a], truly, I say to you[b], the one who believes has eternal life.
translation:
  language: ml
  text: 'സത്യമായി, സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: വിശ്വസിക്കുന്നവന്[a] നിത്യജീവൻ[b] ഉണ്ട്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “വിശ്വസിക്കുന്ന ഏവനും.” ഗ്രീക്കിൽ പദശഃ “വിശ്വസിക്കുന്നവൻ” എന്ന അർഥമുള്ള ആർട്ടിക്കിളോടുകൂടിയ വർത്തമാനകാല കൃദന്തമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “എന്നേക്കുമുള്ള ജീവൻ”; കൂടുതൽ പദശഃ, “യുഗവുമായി ബന്ധപ്പെട്ട ജീവൻ / യുഗം നീളുന്ന ജീവൻ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: സത്യമായി, സത്യമായി
  rationale: യോഹന്നാനിൽ ഗൗരവവും ഊന്നലും നൽകിക്കൊണ്ട് ഒരു പ്രഖ്യാപനം ആരംഭിക്കുന്ന ആവർത്തിത പ്രയോഗമാണിത്. ആവർത്തനവും അർഥബലവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: വർത്തമാനകാല ക്രിയയും ബഹുവചന ദ്വിതീയപുരുഷ സർവനാമത്തിന്റെ ദാതൃപ്രയോഗവും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; മലയാളത്തിലെ ഗൗരവമുള്ള സ്വാഭാവിക പ്രയോഗവുമാണിത്.
- source_word: ὁ πιστεύων
  choice: വിശ്വസിക്കുന്നവന്
  rationale: ആർട്ടിക്കിളോടുകൂടിയ വർത്തമാനകാല കൃദന്തം വിശ്വസിക്കുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ വിഭക്തിരൂപം ἔχει എന്ന ക്രിയയോടൊപ്പം ‘ആ വ്യക്തിക്ക് ഉണ്ട്’ എന്ന ഘടന സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἔχει
  choice: ഉണ്ട്
  rationale: വർത്തമാനകാലത്തിലുള്ള അവകാശവാദം കൃത്യമായി നിലനിർത്തുന്നു; നിത്യജീവൻ ഇപ്പോൾ തന്നെയുണ്ടെന്ന വാക്യത്തിന്റെ ബലം ഭാവികാലമാക്കി മാറ്റുന്നില്ല.
- source_word: ζωὴν αἰώνιον
  choice: നിത്യജീവൻ
  rationale: യോഹന്നാന്റെ സന്ദർഭത്തിൽ കാലദൈർഘ്യവും വരാനിരിക്കുന്ന യുഗവുമായി ബന്ധപ്പെട്ട ഗുണപരമായ അർഥസാധ്യതയും ഉൾക്കൊള്ളുന്ന, മലയാളത്തിൽ സ്ഥാപിതവും സ്വാഭാവികവുമായ പരിഭാഷയാണിത്.
theological_decisions:
- issue: നിത്യജീവൻ ഇപ്പോഴുള്ള സമ്പത്തായി പറയുന്നത്
  choice: നിത്യജീവൻ ഉണ്ട്
  alternative: നിത്യജീവൻ ഉണ്ടാകും
  rationale: ഗ്രീക്കിലെ ἔχει വർത്തമാനകാലത്തിലാണ്. അതിനെ ഭാവികാലമാക്കുന്നത് മൂലപാഠത്തിലെ കാലസൂചനയും യോഹന്നാനിലെ ഇപ്പോൾ-ഭാവി സംഘർഷവും മായ്ച്ചുകളയും.
- issue: ὁ πιστεύων എന്ന പ്രയോഗത്തിന്റെ വ്യാപ്തി
  choice: വിശ്വസിക്കുന്നവന്
  alternative: വിശ്വസിക്കുന്ന ഏവനും
  rationale: ആർട്ടിക്കിളോടുകൂടിയ വർത്തമാനകാല കൃദന്തത്തെ വ്യക്തിയെ വിശേഷിപ്പിക്കുന്ന രീതിയിൽ നിലനിർത്തുന്നു; ‘ഏവനും’ എന്നത് സാധുവായ അർഥവ്യക്തീകരണമാണെങ്കിലും മൂലത്തിൽ ഇല്ലാത്ത വിതരണാത്മക ഊന്നൽ കൂടുതൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. യോഹന്നാനിലെ ആവർത്തിത ആമുഖത്തിന്റെ താളം നിലനിർത്താൻ “സത്യമായി” രണ്ടുതവണ ഉപയോഗിച്ചു. ബഹുവചനമായ ὑμῖν “നിങ്ങളോടു” എന്നു വ്യക്തമാക്കി. പ്രധാനവാക്യം സ്വാഭാവികമാക്കാൻ മലയാളത്തിലെ ദാതൃ-അസ്തിത്വ ഘടനയായ “വിശ്വസിക്കുന്നവന് … ഉണ്ട്” സ്വീകരിച്ചു.
