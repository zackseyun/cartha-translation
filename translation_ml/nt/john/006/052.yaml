id: JHN.6.52
reference: John 6:52
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐμάχοντο οὖν πρὸς ἀλλήλους οἱ Ἰουδαῖοι λέγοντες· Πῶς δύναται οὗτος ἡμῖν δοῦναι τὴν σάρκα ⸀αὐτοῦ φαγεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/052.yaml
  text: So the Jews were arguing among themselves[a], saying[b], “How can this man give us his flesh to eat?”
translation:
  language: ml
  text: 'അതിനാൽ യെഹൂദന്മാർ[a] തമ്മിൽ തർക്കിച്ചുകൊണ്ട് പറഞ്ഞു: “ഇയാൾക്ക് തന്റെ മാംസം[b] നമുക്കു തിന്നാൻ എങ്ങനെ നൽകാൻ കഴിയും?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “യെഹൂദ്യർ”; സന്ദർഭമനുസരിച്ച് “യെഹൂദനേതാക്കൾ” എന്നും മനസ്സിലാക്കാം. ഗ്രീക്കിൽ പൊതുവായി “യെഹൂദന്മാർ” എന്നാണ്.
    reason: alternative_reading
  - marker: b
    text: അഥവാ “ശരീരം.” ഗ്രീക്ക് പദം σάρξ (‘മാംസം’) എന്നാണ്; ഈ ഭാഗത്തിലെ മൂർത്തമായ പദപ്രയോഗവും സംഘർഷവും നിലനിർത്താൻ അതു മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐμάχοντο
  choice: തർക്കിച്ചുകൊണ്ട്
  rationale: അപൂർണഭൂതകാലരൂപം തുടരുന്ന വാക്കുതർക്കത്തെ സൂചിപ്പിക്കുന്നു. ശാരീരികമായ ഏറ്റുമുട്ടൽ എന്ന് അതിശയിപ്പിക്കാതെ ശക്തമായ അഭിപ്രായസംഘർഷം പ്രകടമാക്കുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവചനത്തിലെ പ്രസംഗത്തിൽനിന്നുണ്ടാകുന്ന കഥാഗതിയെയും പ്രതികരണത്തെയും ബന്ധിപ്പിക്കുന്നു.
- source_word: πρὸς ἀλλήλους
  choice: തമ്മിൽ
  rationale: സംഘത്തിനുള്ളിലെ പരസ്പര തർക്കം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: οἱ Ἰουδαῖοι
  choice: യെഹൂദർ
  rationale: ഗ്രീക്കിലെ പൊതുവായ പദം നേരിട്ട് നിലനിർത്തുന്നു; ഇവിടെ നേതാക്കളെന്നോ യെഹൂദ്യദേശക്കാരെന്നോ മുഖ്യപാഠത്തിൽ ചുരുക്കുന്നില്ല.
- source_word: λέγοντες
  choice: പറഞ്ഞു
  rationale: അവരുടെ തർക്കത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന കൃതന്തത്തെ സ്വാഭാവിക മലയാള വിവരണരീതിയിൽ നൽകുന്നു.
- source_word: Πῶς δύναται
  choice: എങ്ങനെ ... കഴിയും?
  rationale: സാധ്യതയെയോ കഴിവിനെയോ ചോദ്യം ചെയ്യുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: οὗτος
  choice: ഇയാൾ
  rationale: സമീപസൂചകത്തിന്റെ അകൽച്ചയോ നിരസനഭാവമോ മലയാളത്തിൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἡμῖν
  choice: നമുക്കു
  rationale: δοῦναι എന്ന ക്രിയയുടെ പരോക്ഷകർമം വ്യക്തമായി നൽകുന്നു.
- source_word: δοῦναι
  choice: തരാൻ
  rationale: δίδωμι എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: τὴν σάρκα αὐτοῦ
  choice: തന്റെ മാംസം
  rationale: σάρξ എന്നതിന്റെ മൂർത്തവും ഞെട്ടിപ്പിക്കുന്നതുമായ പദപ്രയോഗം വ്യാഖ്യാനിച്ച് മയപ്പെടുത്താതെ നിലനിർത്തുന്നു; αὐτοῦ വാക്യത്തിലെ കർത്താവിലേക്കു തിരിച്ചുപോകുന്നതിനാൽ മലയാളത്തിൽ ‘തന്റെ’ സ്വാഭാവികമാണ്.
- source_word: φαγεῖν
  choice: തിന്നാൻ
  rationale: ഭക്ഷിക്കുന്ന പ്രവൃത്തിയെ നേരിട്ടും മൂർത്തമായും സൂചിപ്പിക്കുന്നു; ‘കഴിക്കുക’ എന്നതിനെക്കാൾ ഈ സന്ദർഭത്തിലെ സംഘർഷം വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദിവ്യകാരുണ്യവുമായി ബന്ധപ്പെടുത്തി വ്യാഖ്യാനിക്കപ്പെടുന്ന സന്ദർഭത്തിലെ σάρξ എന്ന പദം
  choice: മാംസം
  alternative: ശരീരം
  rationale: ജനക്കൂട്ടം യേശുവിന്റെ വാക്കുകൾ മൂർത്തമായ ശാരീരിക അർഥത്തിൽ ഗ്രഹിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘മാംസം’ മൂലപദത്തിന്റെ ദൃഢതയും വാക്യത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു; പ്രത്യേക കൂദാശാവ്യാഖ്യാനം പരിഭാഷയിൽ ചേർക്കുന്നില്ല.
- issue: യോഹന്നാനിലെ οἱ Ἰουδαῖοι എന്ന പ്രയോഗത്തിന്റെ പരിധി
  choice: യെഹൂദർ
  alternative: യെഹൂദ്യർ; യെഹൂദനേതാക്കൾ
  rationale: ഗ്രീക്ക് പദം ഈ വാക്യത്തിൽ സൂചിപ്പിക്കുന്ന സംഘത്തെ പ്രത്യേകമായി പരിമിതപ്പെടുത്തുന്നില്ല. അതിനാൽ നേരിട്ടുള്ള രൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തി സന്ദർഭസാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ഇയാൾ’, ‘മാംസം’, ‘തിന്നാൻ’ എന്നീ രൂപങ്ങൾ മൂലപാഠത്തിലെ അകൽച്ചാഭാവവും മൂർത്തമായ ഞെട്ടലും മയപ്പെടുത്താതെ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നിലനിർത്തുന്നു.
