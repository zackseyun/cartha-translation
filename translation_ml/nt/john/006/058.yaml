id: JHN.6.58
reference: John 6:58
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ ἄρτος ὁ ⸀ἐξ οὐρανοῦ καταβάς, οὐ καθὼς ἔφαγον οἱ ⸀πατέρες καὶ ἀπέθανον· ὁ τρώγων τοῦτον τὸν ἄρτον ⸀ζήσει εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/058.yaml
  text: This is the bread that came down from heaven[a], not as the fathers ate and died[b]; the one who eats this bread will live forever.
translation:
  language: ml
  text: സ്വർഗത്തിൽനിന്ന് ഇറങ്ങിവന്ന അപ്പം ഇതാണ്. പിതാക്കന്മാർ[a] ഭക്ഷിക്കുകയും മരിക്കുകയും ചെയ്തതുപോലെയല്ല ഇത്; ഈ അപ്പം തിന്നുന്നവൻ എന്നേക്കും[b] ജീവിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘പൂർവികർ.’ ഇവിടെ മന്നാ ഭക്ഷിച്ച ഇസ്രായേലിന്റെ പൂർവപിതാക്കന്മാരെയാണ് സാധ്യതയോടെ ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘യുഗത്തിലേക്ക് ജീവിക്കും’; അവസാനമില്ലാതെ നിലനിൽക്കുന്ന ജീവനെ സൂചിപ്പിക്കുന്ന പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός ἐστιν ὁ ἄρτος
  choice: അപ്പം ഇതാണ്
  rationale: മുൻസന്ദർഭത്തിൽ ഇതിനകം തിരിച്ചറിയപ്പെട്ട അപ്പത്തെ സൂചിപ്പിക്കുന്ന നിർദേശക-സംയോജക ഘടന സ്വാഭാവികമായ മലയാള പദക്രമത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ὁ ἐξ οὐρανοῦ καταβάς
  choice: സ്വർഗത്തിൽനിന്ന് ഇറങ്ങിവന്ന
  rationale: ἐξ എന്നതിന്റെ ‘നിന്ന്’ എന്ന ഉറവിടസൂചനയും καταβάς എന്ന ഭൂതകാല പങ്കാളിക്രിയയുടെ പൂർത്തിയായ പ്രവൃത്തിയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: οὐ καθὼς ἔφαγον οἱ πατέρες καὶ ἀπέθανον
  choice: പിതാക്കന്മാർ ഭക്ഷിക്കുകയും മരിക്കുകയും ചെയ്തതുപോലെയല്ല ഇത്
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തവും അല്പം അപൂർണ്ണവുമായ താരതമ്യത്തിന്റെ അർഥം വികസിപ്പിച്ചു തീർപ്പാക്കാതെ, മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന താരതമ്യഘടനയായി നൽകുന്നു.
- source_word: οἱ πατέρες
  choice: പിതാക്കന്മാർ
  rationale: പുരുഷലിംഗ ബഹുവചനരൂപം നേരിട്ട് നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ മന്നാ ഭക്ഷിച്ച ഇസ്രായേലിന്റെ പൂർവപിതാക്കന്മാരെയാണ് സാധ്യതയോടെ സൂചിപ്പിക്കുന്നത്.
- source_word: ὁ τρώγων
  choice: തിന്നുന്നവൻ
  rationale: വർത്തമാനകാല പങ്കാളിക്രിയയുടെ പൊതുവായും തുടരുന്നതുമായ ഭാവം നിലനിർത്തുന്നു. ‘ചവച്ചുതിന്നുന്നവൻ’ എന്ന അതിഗ്രാഫിക് രൂപവും ‘പങ്കുകൊള്ളുന്നവൻ’ എന്ന വ്യാഖ്യാനാത്മക രൂപവും ഒഴിവാക്കി, ക്രിയയുടെ അടിസ്ഥാന ഭക്ഷണാർഥം സൂക്ഷിക്കുന്നു.
- source_word: τοῦτον τὸν ἄρτον
  choice: ഈ അപ്പം
  rationale: നിർദേശകപദവും സന്ദർഭത്തിൽ വ്യക്തമാക്കിയ അപ്പവും നേരിട്ട് അവതരിപ്പിക്കുന്നു.
- source_word: ζήσει εἰς τὸν αἰῶνα
  choice: എന്നേക്കും ജീവിക്കും
  rationale: ‘യുഗത്തിലേക്ക് ജീവിക്കും’ എന്ന അക്ഷരാർഥഘടന മലയാളത്തിൽ സ്വാഭാവികമല്ല; യോഹന്നാനിലെ ഈ പ്രയോഗത്തിന്റെ നിലനിൽക്കുന്ന, അവസാനമില്ലാത്ത ജീവൻ എന്ന അർഥം ‘എന്നേക്കും’ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: മരുഭൂമിയിലെ അപ്പവുമായി ബന്ധപ്പെട്ട ‘പിതാക്കന്മാർ’ എന്ന പരാമർശം
  choice: പിതാക്കന്മാർ
  alternative: പൂർവികർ
  rationale: ഗ്രീക്ക് പദത്തിന്റെ പുരുഷലിംഗരൂപവും ഇസ്രായേലിന്റെ പൂർവപിതാക്കന്മാരിലേക്കുള്ള സാധ്യതയുള്ള സൂചനയും നിലനിർത്തുന്നു; വിശാലമായ കൂട്ടായ അർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: ജീവന്റെ അപ്പം എന്ന പ്രസംഗത്തിൽ τρώγων എന്ന ക്രിയയുടെ ദൈവശാസ്ത്രപരമായ ഭാരം
  choice: തിന്നുന്നവൻ
  alternative: ഭക്ഷിക്കുന്നവൻ; പങ്കുകൊള്ളുന്നവൻ
  rationale: കർശനമായ കൂദാശാവ്യാഖ്യാനമോ പൂർണമായും രൂപകാലങ്കാരപരമായ വിശ്വാസവ്യാഖ്യാനമോ വിവർത്തനത്തിൽ മുൻകൂട്ടി നിശ്ചയിക്കാതെ, ഭക്ഷിക്കുന്ന പ്രവൃത്തിയുടെ നേരിട്ടുള്ള അർഥവും പ്രസംഗത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ഭക്ഷിക്കുകയും’ എന്നത് ആദ്യ ക്രിയയ്ക്ക് മാന്യമായ കഥനഭാവം നൽകുമ്പോൾ, τρώγων എന്ന കൂടുതൽ ദൃഢമായ ക്രിയയ്ക്ക് ‘തിന്നുന്നവൻ’ ഉപയോഗിച്ച് മൂലത്തിലെ ക്രിയാവ്യത്യാസം മിതമായി പ്രതിഫലിപ്പിക്കുന്നു. അടിക്കുറിപ്പുകളുടെ ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങളോടുതന്നെ ചേർത്തിരിക്കുന്നു.
