id: JHN.6.17
reference: John 6:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐμβάντες ⸀εἰς πλοῖον ἤρχοντο πέραν τῆς θαλάσσης εἰς Καφαρναούμ. καὶ σκοτία ἤδη ἐγεγόνει καὶ ⸀οὔπω ἐληλύθει πρὸς αὐτοὺς ὁ Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/017.yaml
  text: They got into a boat and were heading across the sea to Capernaum[a]. And it had already become dark[c][b], and Jesus had not yet come to them.
translation:
  language: ml
  text: അവർ ഒരു വള്ളത്തിൽ കയറി കടൽ കടന്ന് കഫർന്നഹൂമിലേക്കു പോകുകയായിരുന്നു.[a] അപ്പോഴേക്കും ഇരുട്ടായിക്കഴിഞ്ഞിരുന്നു,[b] യേശു ഇനിയും അവരുടെ അടുത്ത് എത്തിയിരുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കടലിന്റെ മറുകരയിലേക്ക്.’
    reason: πέραν τῆς θαλάσσης എന്ന പ്രയോഗം കടലിനു കുറുകെയുള്ള സഞ്ചാരത്തെയോ മറുകരയിലേക്കുള്ള ദിശയെയോ സൂചിപ്പിക്കാം.
  - marker: b
    text: അഥവാ, ‘ഇരുട്ട് വീണുകഴിഞ്ഞിരുന്നു.’
    reason: σκοτία ἤδη ἐγεγόνει എന്നതിന്റെ സ്വാഭാവികമായ മലയാള പരിഭാഷാവികൽപം.
lexical_decisions:
- source_word: ἐμβάντες εἰς πλοῖον
  choice: ഒരു വള്ളത്തിൽ കയറി
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന aorist participle സ്വാഭാവിക മലയാളത്തിൽ സംയോജകക്രിയയായി നൽകി. ഗലീലക്കടലിലെ സാഹചര്യത്തിന് യോജിച്ച വിധത്തിൽ πλοῖον എന്നത് ‘വള്ളം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: ἤρχοντο
  choice: പോകുകയായിരുന്നു
  rationale: Imperfect രൂപത്തിലെ തുടർന്നുകൊണ്ടിരുന്ന സഞ്ചാരം മലയാളത്തിലെ ‘-ുകയായിരുന്നു’ ഘടനയിലൂടെ നിലനിർത്തുന്നു.
- source_word: πέραν τῆς θαλάσσης εἰς Καφαρναούμ
  choice: കടലിന്റെ മറുകരയിലുള്ള കഫർന്നഹൂമിലേക്കു
  rationale: πέραν എന്നത് മറുകരയിലേക്കുള്ള സഞ്ചാരത്തെ സൂചിപ്പിക്കുന്നു; εἰς Καφαρναούμ ലക്ഷ്യസ്ഥലം വ്യക്തമാക്കുന്നു. θάλασσα എന്നതിന് യോഹന്നാന്റെ പ്രയോഗം പിന്തുടർന്ന് ‘കടൽ’ നിലനിർത്തി.
- source_word: σκοτία ἤδη ἐγεγόνει
  choice: അപ്പോഴേക്കും ഇരുട്ടായിക്കഴിഞ്ഞിരുന്നു
  rationale: Pluperfect സൂചിപ്പിക്കുന്ന, മുമ്പേ സംഭവിച്ച് നിലനിന്ന അവസ്ഥ ‘ആയിക്കഴിഞ്ഞിരുന്നു’ എന്ന പ്രയോഗത്തിലൂടെ സ്വാഭാവികമായി സംരക്ഷിച്ചു.
- source_word: οὔπω ἐληλύθει πρὸς αὐτοὺς
  choice: ഇനിയും അവരുടെ അടുത്ത് എത്തിയിരുന്നില്ല
  rationale: οὔπωയും pluperfect ക്രിയയും ചേർന്നുള്ള ‘ആ സമയത്തേക്കും എത്തിയിട്ടില്ല’ എന്ന അർഥം നേരിട്ട് നൽകുന്നു; ‘ചേർന്നിരുന്നില്ല’ പോലുള്ള വ്യാഖ്യാനപരമായ വിപുലീകരണം ഒഴിവാക്കി.
- source_word: ὁ Ἰησοῦς
  choice: യേശു
  rationale: മലയാളത്തിൽ സ്ഥിരപ്രയോഗമായ വ്യക്തിനാമരൂപം ഉപയോഗിച്ചു.
theological_decisions:
- issue: ആഖ്യാനത്തിലെ ക്രിയാഭാവവും സമയക്രമവും
  choice: വള്ളത്തിൽ കയറിയതിനു പിന്നാലെ അവർ കഫർന്നഹൂമിലേക്കു സഞ്ചരിച്ചുകൊണ്ടിരുന്നു; അപ്പോഴേക്കും ഇരുട്ടായിക്കഴിഞ്ഞിരുന്നു; യേശു ഇനിയും എത്തിയിരുന്നില്ല എന്ന ക്രമം നിലനിർത്തി.
  alternative: ἤρχοντο എന്നത് ലളിതഭൂതകാലമായ ‘പോയി’ എന്നും ἐγεγόνει എന്നത് ‘ഇരുട്ടായിരുന്നു’ എന്നും നൽകാം.
  rationale: ഗ്രീക്കിലെ imperfect, pluperfect രൂപങ്ങൾ സൃഷ്ടിക്കുന്ന തുടർച്ചയും മുൻസ്ഥിതിയും അടുത്ത സംഭവത്തിലേക്കുള്ള ആഖ്യാനപിരിമുറുക്കവും സംരക്ഷിച്ചു; വാചകത്തിന് പുറത്തുള്ള യാതൊരു ദൈവശാസ്ത്രനിഗമനവും ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പോകുകയായിരുന്നു’, ‘ആയിക്കഴിഞ്ഞിരുന്നു’, ‘എത്തിയിരുന്നില്ല’ എന്നീ രൂപങ്ങളിലൂടെ ഗ്രീക്കിലെ aspect-വും സമയബന്ധവും വായനാസൗകര്യം നഷ്ടപ്പെടാതെ സൂക്ഷിച്ചു. ഇംഗ്ലീഷ് consultation layer-ലുള്ള മുൻപരിഭാഷയെക്കുറിച്ചുള്ള footnote മലയാള പ്രസിദ്ധീകരണത്തിൽ ആവശ്യമില്ലാത്തതിനാൽ ഉൾപ്പെടുത്തിയിട്ടില്ല.
