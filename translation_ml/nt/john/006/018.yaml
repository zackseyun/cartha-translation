  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἥ τε θάλασσα ἀνέμου μεγάλου πνέοντος ⸀διεγείρετο.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/018.yaml
  text: And the sea was being stirred up because a strong wind was blowing[a].
translation:
  language: ml
  text: ശക്തമായ കാറ്റ് വീശിക്കൊണ്ടിരുന്നതിനാൽ കടൽ ഇളകിമറിയുകയായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കടൽ ക്ഷോഭിക്കുകയായിരുന്നു” അല്ലെങ്കിൽ “കടൽ പൊങ്ങുകയായിരുന്നു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥ τε θάλασσα
  choice: കടൽ
  rationale: θάλασσα ഇവിടെ ഗലീലക്കടലിനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും ഗ്രീക്ക് പാഠത്തിൽ പൊതുനാമമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; അതിനാൽ ഭൂമിശാസ്ത്രപരമായ പേരിന് പകരം ‘കടൽ’ നിലനിർത്തുന്നു. τε ലഘുവായ ബന്ധകമാണ്; മലയാളത്തിൽ വാക്യത്തിന്റെ സ്വാഭാവിക പ്രവാഹത്തിനായി അതിനെ പ്രത്യേകം പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല.
- source_word: ἀνέμου μεγάλου
  choice: ശക്തമായ കാറ്റ്
  rationale: ἄνεμος ‘കാറ്റ്’ എന്നും μέγας ഇവിടെ അതിന്റെ ശക്തിയെ സൂചിപ്പിക്കുന്നതുമാണ്. ആധുനിക മലയാളത്തിൽ ‘ശക്തമായ കാറ്റ്’ സ്വാഭാവികവും, ‘കൊടുങ്കാറ്റ്’ എന്നതുപോലെ മൂലപാഠത്തിലില്ലാത്ത പ്രത്യേക കാലാവസ്ഥാ അർഥം ചേർക്കാത്തതുമാണ്.
- source_word: πνέοντος
  choice: വീശിക്കൊണ്ടിരുന്നതിനാൽ
  rationale: വർത്തമാനകാല കർത്തരി പങ്കാളിത്തരൂപം കാറ്റിന്റെ തുടർച്ചയായ വീശലും കടൽ ഇളകിയതിന്റെ സാഹചര്യകാരണവും അറിയിക്കുന്നു. ‘-ക്കൊണ്ടിരുന്നതിനാൽ’ ഈ തുടരുന്ന പ്രവൃത്തിയും കാരണബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: διεγείρετο
  choice: ഇളകിമറിയുകയായിരുന്നു
  rationale: അപൂർണ്ണ ഭൂതകാല മധ്യ/കർമണി രൂപം കടൽ തുടർച്ചയായി പ്രക്ഷുബ്ധമാകുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ഇളകിമറിയുകയായിരുന്നു’ പുരോഗമിക്കുന്ന ചലനം സ്വാഭാവികമായി നൽകുന്നു; എന്നാൽ ‘ക്ഷോഭിക്കുകയായിരുന്നു’ എന്നും ‘പൊങ്ങുകയായിരുന്നു’ എന്നും വിവർത്തനം ചെയ്യാനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. ഗ്രീക്കിലെ അപൂർണ്ണകാലത്തിന്റെ തുടർച്ചാഭാവം ‘വീശിക്കൊണ്ടിരുന്നതിനാൽ’, ‘ഇളകിമറിയുകയായിരുന്നു’ എന്നീ രൂപങ്ങളിലൂടെ നിലനിർത്തി.
