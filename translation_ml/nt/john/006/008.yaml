  text: λέγει αὐτῷ εἷς ἐκ τῶν μαθητῶν αὐτοῦ, Ἀνδρέας ὁ ἀδελφὸς Σίμωνος Πέτρου·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/008.yaml
  text: One of his disciples, Andrew, Simon Peter’s brother, said to him,
translation:
  language: ml
  text: 'അവന്റെ ശിഷ്യന്മാരിൽ ഒരാളായ, ശിമോൻ പത്രോസിന്റെ സഹോദരനായ അന്ത്രെയാസ് അവനോടു പറഞ്ഞു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിൽ ആഖ്യാന വർത്തമാനകാലമായ ‘പറയുന്നു’ എന്നാണ്; എന്നാൽ സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലിയിൽ ഭൂതകാലരൂപമായ ‘പറഞ്ഞു’ സന്ദർഭത്തിന്റെ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: αὐτῷ
  choice: അവനോടു
  rationale: സംസാരത്തിന്റെ പരോക്ഷ കർമത്തെ സൂചിപ്പിക്കുന്ന ദത്തിവിഭക്തി സർവനാമം. സന്ദർഭത്തിൽ ഇത് യേശുവിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: εἷς ἐκ τῶν μαθητῶν αὐτοῦ
  choice: അവന്റെ ശിഷ്യന്മാരിൽ ഒരാൾ
  rationale: εἷς ἐκ എന്ന ഭാഗസൂചക ഘടനയുടെ കൃത്യവും സ്വാഭാവികവുമായ മലയാളാവിഷ്കാരം.
- source_word: μαθητῶν
  choice: ശിഷ്യന്മാർ
  rationale: സുവിശേഷസന്ദർഭത്തിൽ പഠിക്കുകയും ഗുരുവിനെ അനുഗമിക്കുകയും ചെയ്യുന്ന ബന്ധം സൂചിപ്പിക്കുന്ന പതിവും യോജിച്ചതുമായ മലയാളപദം.
- source_word: Ἀνδρέας
  choice: അന്ത്രയോസ്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ സുപരിചിതമായ ലിപ്യന്തരണം.
- source_word: ὁ ἀδελφὸς Σίμωνος Πέτρου
  choice: ശിമോൻ പത്രോസിന്റെ സഹോദരൻ
  rationale: അന്ത്രയോസിനെ ശിമോൻ പത്രോസിന്റെ സഹോദരനായി തിരിച്ചറിയിക്കുന്ന ഗ്രീക്ക് സംബന്ധിക ഘടന നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: Σίμωνος Πέτρου
  choice: ശിമോൻ പത്രോസ്
  rationale: രണ്ടു പേരുകളും ചേർന്ന് ഒരേ വ്യക്തിയുടെ പരിചിതമായ നാമനിർദേശമായി പ്രവർത്തിക്കുന്നതിനാൽ അവ ഒരുമിച്ച് നൽകിയിരിക്കുന്നു.
