    issue: Implicit rendering of δέ and orthographic/readability details
    rationale: The original draft can be understood without a connector, but ‘എന്നാൽ’ represents the mild contrast/development marked by δέ. Modern standard spelling and spacing favor ‘ഇത്’ and ‘അവൻ തന്നെ’.
