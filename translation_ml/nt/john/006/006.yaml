  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῦτο δὲ ἔλεγεν πειράζων αὐτόν, αὐτὸς γὰρ ᾔδει τί ἔμελλεν ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/006.yaml
  text: But he was saying this to test him[a], for he himself knew what he was about to do.
translation:
  language: ml
  text: എന്നാൽ, അവനെ പരീക്ഷിക്കാനാണ്[a] അവൻ ഇത് പറഞ്ഞത്; കാരണം, താൻ എന്തു ചെയ്യാനിരിക്കുകയായിരുന്നുവെന്ന് അവൻ തന്നെ അറിഞ്ഞിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവനെ പരിശോധിക്കാൻ.’ ഈ ക്രിയയ്ക്ക് ‘പ്രലോഭിപ്പിക്കുക’ എന്നും അർഥമാകാം; എന്നാൽ ഇവിടെ പരീക്ഷിക്കുകയോ പരിശോധിക്കുകയോ ചെയ്യുക എന്നതാണ് ആശയം.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: ഇതു
  rationale: യേശുവിന്റെ തൊട്ടുമുമ്പുള്ള ചോദ്യത്തെ സൂചിപ്പിക്കുന്ന ഏകവചന നപുംസകലിംഗ നിർദേശകസർവനാമം.
- source_word: δὲ
  choice: വാക്യഘടനയിലെ ഭാവവ്യത്യാസത്തിലൂടെ സൂചിപ്പിച്ചു
  rationale: δέ ഇവിടെ നേരിയ വൈരുധ്യത്തോടുകൂടിയ വിശദീകരണത്തിലേക്കുള്ള നീക്കമാണ്. മലയാളത്തിൽ നിർബന്ധമായി ‘എന്നാൽ’ ചേർക്കാതെ ഉദ്ദേശസൂചകമായ മുൻനിര വാക്യഘടന ഈ ബന്ധം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἔλεγεν
  choice: പറഞ്ഞത്
  rationale: ഗ്രീക്ക് അപൂർണ്ണഭൂതകാലത്തിന്റെ ആഖ്യാനപരമായ സ്വഭാവം മലയാളത്തിൽ സ്വാഭാവികമായ ഭൂതകാലരൂപത്തിൽ നൽകി; ‘പറഞ്ഞുകൊണ്ടിരുന്നു’ ഇവിടെ അനാവശ്യമായ ദൈർഘ്യം സൂചിപ്പിച്ചേക്കാം.
- source_word: πειράζων
  choice: പരീക്ഷിക്കാനാണ്
  rationale: സന്ദർഭത്തിൽ ഫിലിപ്പോസിനെ പാപത്തിലേക്കു പ്രലോഭിപ്പിക്കൽ അല്ല, അവന്റെ ഗ്രഹണവും പ്രതികരണവും പരിശോധിക്കലാണ്. ഉദ്ദേശം സൂചിപ്പിക്കുന്ന മലയാളരൂപം കൃദന്തരൂപത്തിന്റെ ക്രിയാവിശേഷണബലം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: αὐτόν
  choice: അവനെ
  rationale: πειράζων എന്നതിന്റെ കർമം; തൊട്ടുമുമ്പുള്ള സന്ദർഭത്തിലെ ഫിലിപ്പോസിനെ സൂചിപ്പിക്കുന്നു.
- source_word: αὐτὸς
  choice: അവൻതന്നെ
  rationale: പ്രകടമായ ഗ്രീക്ക് സർവനാമത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: γὰρ
  choice: കാരണം
  rationale: യേശു അങ്ങനെ പറഞ്ഞതിന്റെ വിശദീകരണം അവതരിപ്പിക്കുന്ന ബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ᾔδει
  choice: അറിഞ്ഞിരുന്നു
  rationale: οἶδα എന്ന ക്രിയയുടെ ഭൂതകാല സ്ഥിതിയെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τί
  choice: എന്തു
  rationale: യേശുവിന്റെ അറിവിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന ചോദനസർവനാമത്തിന്റെ നേരിട്ടുള്ള സ്വാഭാവിക പരിഭാഷ.
- source_word: ἔμελλεν ποιεῖν
  choice: ചെയ്യാൻ പോകുന്നുവെന്ന്
  rationale: μέλλω + അനന്തക്രിയയുടെ മുന്നോട്ടുനോക്കുന്ന, സമീപമോ ഉദ്ദേശിതമോ ആയ പ്രവർത്തനബലം സംരക്ഷിക്കുന്നു; ‘ചെയ്യാനിരുന്നതെന്ന്’ എന്നതിനെക്കാൾ ആധുനിക സാധാരണ മലയാളത്തിൽ വ്യക്തമാണ്.
theological_decisions:
- issue: ഫിലിപ്പോസിനോടുള്ള യേശുവിന്റെ പ്രവൃത്തിയിൽ πειράζων എന്നതിന്റെ അർഥം
  choice: ‘പരീക്ഷിക്കാൻ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘പ്രലോഭിപ്പിക്കാൻ’ അല്ലെങ്കിൽ ‘ശോധന ചെയ്യാൻ’
  rationale: ഉടൻതന്നെയുള്ള സന്ദർഭത്തിൽ യേശു ഫിലിപ്പോസിന്റെ ഗ്രഹണവും പ്രതികരണവും പരിശോധിക്കുകയാണ്; തിന്മയിലേക്കു വശീകരിക്കുന്നതായി വാചകം സൂചിപ്പിക്കുന്നില്ല. എങ്കിലും മൂലപദത്തിന്റെ വിശാലമായ അർഥപരിധി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- issue: യേശുവിന്റെ മുൻകൂട്ടിയുള്ള അറിവിന്മേലുള്ള ഊന്നൽ
  choice: ‘അവൻതന്നെ അറിഞ്ഞിരുന്നു’ എന്ന് നൽകി.
  alternative: ‘അവൻ അറിഞ്ഞിരുന്നു’
  rationale: αὐτός എന്ന പ്രകടമായ സർവനാമത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു; വാചകത്തിനപ്പുറമുള്ള സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവമുള്ള ആഖ്യാനശൈലി. ‘അവൻതന്നെ’ എന്ന രൂപം മൂലത്തിലെ ഊന്നൽ സംരക്ഷിക്കുന്നു; ‘പരീക്ഷിക്കാനാണ്’ എന്നത് ഉദ്ദേശബലം വ്യക്തമായി നൽകുന്നു.
