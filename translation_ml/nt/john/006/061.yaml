source:
  edition: SBLGNT
  text: εἰδὼς δὲ ὁ Ἰησοῦς ἐν ἑαυτῷ ὅτι γογγύζουσιν περὶ τούτου οἱ μαθηταὶ αὐτοῦ εἶπεν αὐτοῖς· Τοῦτο ὑμᾶς σκανδαλίζει;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/061.yaml
  text: But Jesus[a], knowing in himself that his disciples were grumbling about this, said to them, “Does this offend you?"
translation:
  language: ml
  text: 'തന്റെ ശിഷ്യന്മാർ ഇതിനെക്കുറിച്ച് പിറുപിറുക്കുന്നുവെന്ന് തന്റെ ഉള്ളിൽത്തന്നെ അറിഞ്ഞ യേശു അവരോടു പറഞ്ഞു: “ഇത് നിങ്ങളെ ഇടറിക്കുന്നുവോ?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇത് നിങ്ങളെ വ്രണപ്പെടുത്തുന്നുവോ?”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: അറിഞ്ഞിട്ട്
  rationale: സമകാലികമായ അറിവിനെ സൂചിപ്പിക്കുന്ന participial പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; അറിവ് പുറത്തുനിന്ന് ലഭിച്ചതാണെന്ന ധ്വനി ചേർക്കുന്നില്ല.
- source_word: ἐν ἑαυτῷ
  choice: ഉള്ളിൽ
  rationale: യേശു പുറമേയുള്ള അറിയിപ്പിലൂടെ അല്ല, തന്റെ ഉള്ളിൽത്തന്നെ അറിഞ്ഞു എന്ന ആശയം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നിലനിർത്തുന്നു.
- source_word: γογγύζουσιν
  choice: പിറുപിറുക്കുന്നുവെന്ന്
  rationale: അതൃപ്തിയോടെ താഴ്ന്ന സ്വരത്തിൽ പരാതിപ്പെടുക എന്ന ക്രിയയുടെ ഭാവം ആധുനിക മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: περὶ τούτου
  choice: ഇതിനെക്കുറിച്ച്
  rationale: മുൻപത്തെ പ്രസംഗത്തെ ചൂണ്ടുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: തന്റെ ശിഷ്യന്മാർ
  rationale: ഇവിടെ പന്ത്രണ്ടുപേരിൽ മാത്രം പരിമിതപ്പെടുത്താതെ യേശുവിന്റെ വിപുലമായ ശിഷ്യസമൂഹത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: Τοῦτο
  choice: ഇത്
  rationale: മൂലത്തിലെ സംക്ഷിപ്തമായ സൂചകസർവനാമം നിലനിർത്തുന്നു; ‘ഈ ഉപദേശം’ എന്ന വിശദീകരണം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: σκανδαλίζει
  choice: ഇടർച്ചയാകുന്നുവോ
  rationale: σκανδαλίζω എന്നതിലെ തടഞ്ഞുവീഴ്ത്തുക, വിശ്വാസത്തിൽനിന്ന് പിന്മാറാൻ കാരണമാകുക എന്നീ രൂപകാത്മകവും ദൈവശാസ്ത്രപരവുമായ സാധ്യതകൾ നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ വാക്കുകളോടുള്ള പ്രതികരണത്തിന്റെ പശ്ചാത്തലത്തിൽ σκανδαλίζει എന്നതിന്റെ അർഥം
  choice: ഇത് നിങ്ങൾക്ക് ഇടർച്ചയാകുന്നുവോ?
  alternative: ഇത് നിങ്ങളെ അസ്വസ്ഥരാക്കുന്നുവോ? / ഇത് നിങ്ങളെ വ്രണപ്പെടുത്തുന്നുവോ?
  rationale: ഗ്രീക്ക് പദത്തിന് അസ്വസ്ഥതയോ വ്രണപ്പെടലോ മാത്രമല്ല, വിശ്വാസത്തിൽ തട്ടി വീഴുകയോ പിന്മാറുകയോ ചെയ്യുന്ന ശക്തമായ ആശയവും ഉണ്ട്. ‘ഇടർച്ചയാകുക’ ആ ദൈവശാസ്ത്രപരമായ സംഘർഷം തീർപ്പാക്കാതെ സൂക്ഷിക്കുന്നു; സാധാരണഭാഷയിലെ അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘പിറുപിറുക്കുക’ പരാതിയുടെ മന്ദസ്വരഭാവവും ‘ഇടർച്ചയാകുക’ σκανδαλίζει എന്ന പദത്തിന്റെ രൂപകാത്മക ശക്തിയും നിലനിർത്തുന്നു.
