- from: 'എന്നാൽ തന്റെ ശിഷ്യന്മാർ ഇതിനെക്കുറിച്ച് പിറുപിറുക്കുന്നുവെന്ന് യേശു ഉള്ളിൽ അറിഞ്ഞിട്ട് അവരോട് ചോദിച്ചു: “ഇത് നിങ്ങൾക്ക് ഇടർച്ചയാകുന്നുവോ?[a]”'
  to: 'തന്റെ ശിഷ്യന്മാർ ഇതിനെക്കുറിച്ച് പിറുപിറുക്കുന്നുവെന്ന് തന്റെ ഉള്ളിൽത്തന്നെ അറിഞ്ഞ യേശു അവരോടു പറഞ്ഞു: “ഇത് നിങ്ങളെ ഇടറിക്കുന്നുവോ?[a]”'
  rationale: The revision retains the draft’s strengths while rendering εἶπεν as “പറഞ്ഞു,” expressing the participial construction without a sequential implication, and supplying a footnote that more closely represents the general “offend” sense of σκανδαλίζει. The main rendering preserves the Greek metaphor and its possible implications without doctrinal expansion.
