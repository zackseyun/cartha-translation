id: JHN.6.45
reference: John 6:45
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔστιν γεγραμμένον ἐν τοῖς προφήταις· Καὶ ἔσονται πάντες διδακτοὶ θεοῦ· ⸀πᾶς ὁ ⸀ἀκούσας παρὰ τοῦ πατρὸς καὶ μαθὼν ἔρχεται πρὸς ⸀ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/045.yaml
  text: It is written in the Prophets[a], ‘And they will all be taught by God.’ Everyone who has heard from the Father and has learned comes to me.
translation:
  language: ml
  text: 'പ്രവാചകഗ്രന്ഥങ്ങളിൽ ഇങ്ങനെ എഴുതിയിരിക്കുന്നു: “അവരെല്ലാവരും ദൈവത്താൽ പഠിപ്പിക്കപ്പെടും.”[a] പിതാവിൽനിന്ന് കേട്ടു പഠിച്ച ഏവനും എന്റെ അടുക്കൽ വരുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരെല്ലാവരും ദൈവത്തിൽനിന്ന് പഠനം ലഭിച്ചവരായിരിക്കും.”
    reason: διδακτοὶ θεοῦ എന്ന പ്രയോഗത്തിലെ ദൈവത്തെ പഠിപ്പിക്കുന്നവനായും പഠനത്തിന്റെ ഉറവിടമായും മനസ്സിലാക്കാവുന്ന സമീപപര്യായം.
lexical_decisions:
- source_word: ἔστιν γεγραμμένον
  choice: ഇങ്ങനെ എഴുതിയിരിക്കുന്നു
  rationale: നിലനിൽക്കുന്ന തിരുവെഴുത്തുസാക്ഷ്യത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പര്യായപൂർണരൂപം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἐν τοῖς προφήταις
  choice: പ്രവാചകന്മാരുടെ ഗ്രന്ഥങ്ങളിൽ
  rationale: വ്യക്തികളായ പ്രവാചകന്മാരെ മാത്രമല്ല, അംഗീകൃത പ്രവാചകഗ്രന്ഥസമുച്ചയത്തെയാണ് ഉദ്ധരണിസൂത്രം സൂചിപ്പിക്കുന്നത് എന്നു വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: ἔσονται πάντες διδακτοὶ θεοῦ
  choice: അവരെല്ലാവരും ദൈവത്താൽ പഠിപ്പിക്കപ്പെട്ടവരായിരിക്കും
  rationale: ഭാവികാലവും ദൈവം പഠിപ്പിക്കുന്നവൻ എന്ന അർഥവും നിലനിർത്തുന്നു; διδακτοὶ θεοῦ എന്ന ചുരുക്കപ്രയോഗത്തിലെ ‘ദൈവത്താൽ പഠിപ്പിക്കപ്പെട്ടവർ/ദൈവത്തിൽനിന്നു പഠിച്ചവർ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: πᾶς ὁ ἀκούσας ... καὶ μαθὼν
  choice: കേട്ടു പഠിച്ച ഏവനും
  rationale: രണ്ടു aorist participle-കളുടെയും പ്രധാനക്രിയയ്ക്കു മുൻപുള്ള ഏകോപിത പ്രവർത്തനം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: παρὰ τοῦ πατρὸς
  choice: പിതാവിൽനിന്നു
  rationale: παρά + genitive സൂചിപ്പിക്കുന്ന ഉറവിടബന്ധവും യോഹന്നാനിലെ വ്യക്തിപരമായ ‘പിതാവ്’ എന്ന അഭിസംബോധനയും സംരക്ഷിക്കുന്നു.
- source_word: ἔρχεται πρὸς ἐμέ
  choice: എന്റെ അടുക്കൽ വരുന്നു
  rationale: വർത്തമാനകാലവും യേശുവിലേക്കുള്ള വ്യക്തിപരമായ സമീപനവും സാധാരണ മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
theological_decisions:
- issue: ദൈവിക പഠിപ്പിക്കലും യേശുവിന്റെ അടുക്കൽ വരുന്നതും തമ്മിലുള്ള ബന്ധം
  choice: പിതാവിൽനിന്നു കേട്ടു പഠിച്ച ഏവനും യേശുവിന്റെ അടുക്കൽ വരുന്നു എന്ന വാക്യക്രമവും ബന്ധവും അതേപടി സൂക്ഷിച്ചു.
  alternative: ഇത് നിർണയവാദപരമായോ മനുഷ്യപ്രതികരണത്തിന് ഊന്നൽ നൽകുന്ന സഹകരണവാദപരമായോ വിശദീകരിക്കുക.
  rationale: ഗ്രീക്ക് വാക്യം ബന്ധം പ്രസ്താവിക്കുന്നുവെങ്കിലും അതിന്റെ തത്ത്വചിന്താപരമായ പ്രവർത്തനരീതി വിശദീകരിക്കുന്നില്ല; അതിനാൽ യഥാർത്ഥ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
- issue: ‘പിതാവ്’ എന്നതും യേശുവിന്റെ അധികാരവും
  choice: ‘പിതാവ്’ എന്നും ‘എന്റെ അടുക്കൽ’ എന്നും നേരിട്ടുള്ള ബന്ധത്തിൽ നിലനിർത്തി.
  alternative: ക്രിസ്തുശാസ്ത്രപരമായ അർഥം വിശദീകരണവാക്കുകൾ ചേർത്ത് വികസിപ്പിക്കുക.
  rationale: പിതാവിൽനിന്നുള്ള യഥാർത്ഥ പഠനം യേശുവിലേക്കു നയിക്കുന്നു എന്ന യോഹന്നാനീയ ഊന്നൽ സംരക്ഷിക്കുമ്പോഴും വാക്യം പറയുന്നതിലധികം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളം; സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന, എന്നാൽ തിരുവെഴുത്തുവായനയ്ക്ക് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ‘പ്രവാചകന്മാരുടെ ഗ്രന്ഥങ്ങൾ’ എന്നത് പ്രവാചകതിരുവെഴുത്തുകളുടെ സമുച്ചയം വ്യക്തമാക്കുന്നു.
