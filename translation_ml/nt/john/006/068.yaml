id: JHN.6.68
reference: John 6:68
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ἀπεκρίθη αὐτῷ Σίμων Πέτρος· Κύριε, πρὸς τίνα ἀπελευσόμεθα; ῥήματα ζωῆς αἰωνίου ἔχεις,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/068.yaml
  text: Simon Peter answered him[a], “Lord, to whom will we go? You have words of eternal life,”
translation:
  language: ml
  text: 'ശിമോൻ പത്രോസ് അവനോടു മറുപടി പറഞ്ഞു: “കർത്താവേ,[a] ഞങ്ങൾ ആരുടെ അടുക്കൽ പോകും? നിത്യജീവന്റെ വചനങ്ങൾ നിന്റെ പക്കലുണ്ട്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഗുരുവേ.” ഗ്രീക്കിലെ ഈ അഭിസംബോധന ആദരസൂചകമായും ഉപയോഗിക്കാം; എന്നാൽ ഇവിടെ യോഹന്നാൻ സുവിശേഷത്തിലെ പ്രയോഗത്തിന് “കർത്താവേ” യോജിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη αὐτῷ
  choice: അവനോടു മറുപടി പറഞ്ഞു
  rationale: സംഭാഷണത്തിൽ ഒരാളോടുള്ള പ്രതികരണം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; αὐτῷ യേശുവിനെ സൂചിപ്പിക്കുന്നതായി നിലനിർത്തുന്നു.
- source_word: Σίμων Πέτρος
  choice: ശിമോൻ പത്രോസ്
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ പേരുരൂപങ്ങൾ ഉപയോഗിക്കുന്നു.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: κύριος എന്ന അഭിസംബോധനയുടെ ആദരവും യോഹന്നാനിലെ ക്രിസ്തുശാസ്ത്രപരമായ മുഴക്കവും നിലനിർത്തുന്ന പതിവ് മലയാള പരിഭാഷ.
- source_word: πρὸς τίνα ἀπελευσόμεθα
  choice: ഞങ്ങൾ ആരുടെ അടുക്കൽ പോകും?
  rationale: πρός സഹിതമുള്ള വ്യക്തിപരമായ ദിശാബോധം ‘ആരുടെ അടുക്കൽ’ എന്നു വ്യക്തമായി സംരക്ഷിക്കുന്നു; ഭാവികാല ചോദ്യത്തിന്റെ ആലങ്കാരിക ശക്തിയും നിലനിർത്തുന്നു.
- source_word: ῥήματα
  choice: വചനങ്ങൾ
  rationale: ഇവിടെ യേശുവിന്റെ ജീവദായകമായ അരുളപ്പാടുകളെ സൂചിപ്പിക്കുന്ന ῥήματα എന്ന ബഹുവചനത്തിന് dignified, പരിചിതമായ മലയാള സമാനപദം; വെറും ഒറ്റപ്പെട്ട ‘വാക്കുകൾ’ എന്ന ഭാവം ഒഴിവാക്കുന്നു.
- source_word: ζωῆς αἰωνίου
  choice: നിത്യജീവന്റെ
  rationale: യോഹന്നാൻ സുവിശേഷത്തിലെ പ്രധാന പ്രയോഗമായ ‘നിത്യജീവൻ’ നിലനിർത്തുകയും ഗ്രീക്കിലെ ജനിറ്റീവ് ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ἔχεις
  choice: നിന്റെ പക്കലുണ്ട്
  rationale: യേശുവിനോടാണ് നേരിട്ടുള്ള അഭിസംബോധന എന്നത് വ്യക്തമാക്കി, ലളിതമായ ഉടമസ്ഥതയെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: യേശുവിനോടുള്ള Κύριε എന്ന അഭിസംബോധനയുടെ അർഥവ്യാപ്തി
  choice: കർത്താവേ
  alternative: ഗുരുവേ / യജമാനനേ
  rationale: ‘കർത്താവേ’ ആദരപൂർവമായ അഭിസംബോധനയും യോഹന്നാനിലെ ക്രിസ്തുശാസ്ത്രപരമായ മുഴക്കവും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു; സന്ദർഭം അനുവദിക്കുന്ന ‘ഗുരുവേ’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- issue: ῥήματα ζωῆς αἰωνίου എന്ന ജനിറ്റീവ് പ്രയോഗത്തിന്റെ ബന്ധം
  choice: നിത്യജീവന്റെ വചനങ്ങൾ
  alternative: നിത്യജീവൻ നൽകുന്ന വചനങ്ങൾ
  rationale: മൂലത്തിലെ ജനിറ്റീവ് ബന്ധത്തിന്റെ യഥാർഥ അർഥവ്യാപ്തി തുറന്നുവെക്കുന്നു; വചനങ്ങൾ ജീവൻ നൽകുന്നു എന്ന കാരണാർഥം വിവർത്തനത്തിൽ തന്നെ നിർബന്ധമായി ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ആരുടെ അടുക്കൽ’ മൂലത്തിലെ വ്യക്തിയിലേക്കുള്ള ദിശാബോധം സൂക്ഷിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട അഭിസംബോധനയ്ക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
