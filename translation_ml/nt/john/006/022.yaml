  text: Τῇ ἐπαύριον ὁ ὄχλος ὁ ἑστηκὼς πέραν τῆς θαλάσσης ⸀εἶδον ὅτι πλοιάριον ἄλλο οὐκ ἦν ἐκεῖ εἰ μὴ ⸀ἕν, καὶ ὅτι οὐ συνεισῆλθεν τοῖς μαθηταῖς αὐτοῦ ὁ Ἰησοῦς εἰς τὸ ⸀πλοῖον ἀλλὰ μόνοι οἱ μαθηταὶ αὐτοῦ ἀπῆλθον·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/022.yaml
  text: On the next day[a], the crowd that had been standing on the other side of the sea saw that no other small boat had been there except one, and that Jesus had not gone with his disciples into the boat[b], but that his disciples had gone away alone.
translation:
  language: ml
  text: പിറ്റേന്ന്, കടലിന്റെ മറുകരയിൽ നിന്നിരുന്ന ജനക്കൂട്ടം, അവിടെ ഒരു ചെറുവള്ളം[a] ഒഴികെ മറ്റൊന്നും ഉണ്ടായിരുന്നില്ലെന്നും യേശു തന്റെ ശിഷ്യന്മാരോടൊപ്പം വള്ളത്തിൽ[b] കയറിയിരുന്നില്ലെന്നും ശിഷ്യന്മാർ മാത്രം പോയിരുന്നു എന്നും കണ്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ചെറുവള്ളം’ എന്നതിന് ‘വള്ളം’ എന്നും പരിഭാഷപ്പെടുത്താം; ഇവിടെ ഗ്രീക്കിൽ ദിമിന്യൂട്ടീവ് രൂപമായ πλοιάριον ആണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ഈ വാക്യത്തിൽ ചില കൈയെഴുത്തുപ്രതികളിലും പതിപ്പുകളിലും ‘ചെറുവള്ളം’ (πλοιάριον), ‘വള്ളം’ (πλοῖον) എന്നീ വായനകൾ കാണുന്നു; ഓരോ ഉപവാക്യത്തിലും അച്ചടിച്ച ഗ്രീക്ക് പാഠത്തിലെ പദപ്രയോഗമാണ് പരിഭാഷയിൽ പിന്തുടർന്നിരിക്കുന്നത്.
    reason: textual_variant
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: പിറ്റേന്ന്
  rationale: അടുത്ത ദിവസത്തിലേക്കുള്ള സമയമാറ്റം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി അറിയിക്കുന്നു.
- source_word: ὁ ὄχλος ὁ ἑστηκὼς
  choice: നിന്നിരുന്ന ജനക്കൂട്ടം
  rationale: ἑστηκώς സൂചിപ്പിക്കുന്ന തുടർന്നുനിന്ന അവസ്ഥ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: πέραν τῆς θαλάσσης
  choice: കടലിന്റെ മറുകരയിൽ
  rationale: പέραν എന്നതിന്റെ സ്ഥലസൂചനയും യോഹന്നാനിലെ ഭൂമിശാസ്ത്രസന്ദർഭവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: εἶδον
  choice: കണ്ടു
  rationale: തുടർന്നുള്ള ὅτι ഉപവാക്യങ്ങളിൽ വിവരിക്കുന്ന കാര്യങ്ങൾ അവർ ഗ്രഹിച്ചതിനെ, മൂലപദത്തിന്റെ ദൃശ്യഗ്രഹണാർഥം നഷ്ടപ്പെടുത്താതെ, സൂചിപ്പിക്കുന്നു.
- source_word: πλοιάριον
  choice: ചെറുവള്ളം
  rationale: ദിമിന്യൂട്ടീവ് രൂപത്തിന്റെ ചെറിയ വള്ളം എന്ന സൂക്ഷ്മത നിലനിർത്തുന്നു.
- source_word: ἄλλο οὐκ ἦν ἐκεῖ εἰ μὴ ἕν
  choice: അവിടെ ഒരു ചെറുവള്ളം മാത്രമേ ഉണ്ടായിരുന്നുള്ളൂ
  rationale: ഒന്നൊഴികെ മറ്റൊന്നും ഉണ്ടായിരുന്നില്ല എന്ന ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: οὐ συνεισῆλθεν ... εἰς τὸ πλοῖον
  choice: ശിഷ്യന്മാരോടൊപ്പം വള്ളത്തിൽ കയറിയിരുന്നില്ല
  rationale: സഹപ്രവേശനവും വള്ളത്തിൽ കയറുന്നതെന്ന സന്ദർഭാർഥവും വ്യക്തമായി പകരുന്നു.
- source_word: μόνοι ... ἀπῆλθον
  choice: ശിഷ്യന്മാർ മാത്രം പോയിരുന്നു
  rationale: യേശു അവരോടൊപ്പം ഉണ്ടായിരുന്നില്ല എന്ന ഒഴിവാക്കൽഭാവവും മുൻപ് നടന്ന പുറപ്പെടലും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
