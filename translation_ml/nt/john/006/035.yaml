id: JHN.6.35
reference: John 6:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀Εἶπεν αὐτοῖς ὁ Ἰησοῦς· Ἐγώ εἰμι ὁ ἄρτος τῆς ζωῆς· ὁ ἐρχόμενος πρὸς ἐμὲ οὐ μὴ πεινάσῃ, καὶ ὁ πιστεύων εἰς ⸀ἐμὲ οὐ μὴ ⸀διψήσει πώποτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/035.yaml
  text: Jesus said to them, “I am the bread of life; the one who comes to me will never hunger, and the one who believes in me will never thirst again.”
translation:
  language: ml
  text: 'യേശു അവരോടു പറഞ്ഞു: “ഞാൻ ജീവന്റെ അപ്പം ആകുന്നു. എന്റെ അടുക്കൽ വരുന്നവന് ഒരിക്കലും വിശക്കുകയില്ല; എന്നിൽ വിശ്വസിക്കുന്നവന് ഒരുനാളും ദാഹിക്കുകയുമില്ല.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരിക്കലുംതന്നെ ദാഹിക്കുകയില്ല.” ഗ്രീക്കിൽ ‘എപ്പോഴെങ്കിലും’ എന്ന പദത്തോടൊപ്പം ഊന്നിയ നിഷേധപ്രയോഗമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν αὐτοῖς
  choice: അവരോടു പറഞ്ഞു
  rationale: ആഖ്യാനപരമായ aorist ക്രിയയും പരോക്ഷകർമമായ ദത്തിവും സ്വാഭാവികവും കൃത്യവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: Ἐγώ εἰμι
  choice: ഞാൻ ... ആകുന്നു
  rationale: ഊന്നലുള്ള സ്വയംതിരിച്ചറിയിക്കൽ നിലനിർത്തുന്നു; യോഹന്നാനിലെ പ്രയോഗത്തിന് അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: ὁ ἄρτος τῆς ζωῆς
  choice: ജീവന്റെ അപ്പം
  rationale: ഗ്രീക്കിലെ ഷഷ്ഠീവ്യവഹാരവും രൂപകവും നേരിട്ട് നിലനിർത്തുന്ന, മലയാള ബൈബിൾ ഭാഷയിൽ വ്യക്തമായ പ്രയോഗം.
- source_word: ὁ ἐρχόμενος πρὸς ἐμέ
  choice: എന്റെ അടുക്കൽ വരുന്നവൻ
  rationale: നാമവാചകമായി ഉപയോഗിച്ച വർത്തമാനകാല കൃദന്തത്തിന്റെ പൊതുവായതും തുടർച്ചയുള്ളതുമായ ഭാവം സ്വാഭാവികമായി പകരുന്നു.
- source_word: οὐ μὴ πεινάσῃ
  choice: ഒരിക്കലും വിശക്കുകയില്ല
  rationale: οὐ μή നൽകുന്ന ശക്തമായ നിഷേധം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὁ πιστεύων εἰς ἐμέ
  choice: എന്നിൽ വിശ്വസിക്കുന്നവൻ
  rationale: യോഹന്നാനിലെ πιστεύω εἰς എന്ന ബന്ധപരമായ പ്രയോഗത്തിന്റെ സ്ഥിരവും സുതാര്യവുമായ മലയാള സമാനരൂപം.
- source_word: οὐ μὴ διψήσει πώποτε
  choice: ഒരുനാളും ദാഹിക്കുകയുമില്ല
  rationale: οὐ μή എന്ന ഊന്നിയ നിഷേധത്തോടൊപ്പം πώποτε നൽകുന്ന ‘ഏതൊരു സമയത്തും’ എന്ന വ്യാപ്തിയും പകരുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘വീണ്ടും’ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: πιστεύων εἰς ἐμέ എന്നതിന്റെ അർത്ഥവ്യാപ്തി
  choice: എന്നിൽ വിശ്വസിക്കുന്നവൻ
  alternative: എന്നിൽ ആശ്രയിക്കുന്നവൻ
  rationale: ‘വിശ്വസിക്കുന്നു’ എന്നത് ഉറവിടത്തോട് സുതാര്യവും യോഹന്നാനിലെ വിശ്വാസഭാഷയോട് സ്ഥിരതയുള്ളതുമാണ്; ‘ആശ്രയിക്കുന്നു’ ബന്ധപരമായ ഒരു ഭാവം വ്യക്തമാക്കുമെങ്കിലും അർത്ഥം ചുരുക്കാൻ ഇടയുണ്ട്.
- issue: Ἐγώ εἰμι എന്ന സ്വയംതിരിച്ചറിയിക്കലിന്റെ ശക്തി
  choice: ഞാൻ ... ആകുന്നു
  alternative: ഞാൻ തന്നെയാണ്
  rationale: നേരിട്ടുള്ള സ്വയംതിരിച്ചറിയിക്കൽ സംരക്ഷിച്ച് അതിന്റെ യോഹന്നാനീയ പ്രതിധ്വനി വായനക്കാരന് തുറന്നുവിടുന്നു; ‘തന്നെയാണ്’ കൂടുതൽ പ്രകടമായ ഊന്നൽ നൽകുമെങ്കിലും മലയാളത്തിൽ ആവശ്യത്തിലധികം വ്യാഖ്യാനാത്മകമാകാം.
- issue: πώποτε-യുടെ കാലവ്യാപ്തി
  choice: ഒരുനാളും
  alternative: ഒരിക്കലും
  rationale: ‘ഏതൊരു സമയത്തും ഇല്ല’ എന്ന ശക്തമായ കാലവ്യാപ്തി നിലനിർത്തുന്നു; ‘വീണ്ടും’ എന്ന ആശയം മൂലപാഠത്തിൽ ഇല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ജീവന്റെ അപ്പം’ എന്ന സ്ഥാപിതവും ഉറവിടസുതാര്യവുമായ രൂപകം നിലനിർത്തി. ക്രിയാവസാനത്തിലെ ‘-ഉം’ രണ്ട് വാഗ്ദാനങ്ങളെയും സമാന്തരമായി ബന്ധിപ്പിക്കുന്നു; അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട അവസാന വാക്യത്തിനുശേഷം ചേർത്തിരിക്കുന്നു.
