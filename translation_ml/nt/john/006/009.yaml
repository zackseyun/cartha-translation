  register: ആധുനിക മാനക മലയാളത്തിലെ ലളിതവും മാന്യവുമായ സംസാരശൈലി. മൂലത്തിലെ നേരിട്ടുള്ള പ്രസ്താവനയും അപര്യാപ്തത വ്യക്തമാക്കുന്ന വാചാടോപചോദ്യവും നിലനിർത്തി.
