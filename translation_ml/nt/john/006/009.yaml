id: JHN.6.9
reference: John 6:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἔστιν ⸀παιδάριον ὧδε ⸀ὃς ἔχει πέντε ἄρτους κριθίνους καὶ δύο ὀψάρια· ἀλλὰ ταῦτα τί ἐστιν εἰς τοσούτους;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/009.yaml
  text: There is a boy here who has five barley loaves and two fish[a], but what are these for so many?
translation:
  language: ml
  text: “ഇവിടെ ഒരു ബാലനുണ്ട്. അവന്റെ പക്കൽ യവംകൊണ്ടുള്ള അഞ്ച് അപ്പവും രണ്ട് മീനും ഉണ്ട്. എന്നാൽ ഇത്രയും പേർക്കു ഇവ എന്തിനു മതിയാകും?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδάριον
  choice: ബാലൻ
  rationale: ഒരു ആൺകുട്ടിയെയോ ചെറുപ്പക്കാരനെയോ സൂചിപ്പിക്കുന്ന പദം; ‘ബാലൻ’ ആധുനിക മാനക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമാണ്.
- source_word: ὧδε
  choice: ഇവിടെ
  rationale: സ്ഥലത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്ന ലളിതവും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: ὃς ἔχει
  choice: അവന്റെ പക്കൽ ... ഉണ്ട്
  rationale: ബാലന്റെ കൈവശമുള്ളതിനെ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ഗ്രീക്കിലെ ബന്ധവാക്യത്തിന്റെ അർഥം നിലനിർത്തുന്നു.
- source_word: ἄρτους κριθίνους
  choice: യവംകൊണ്ടുള്ള അഞ്ച് അപ്പം
  rationale: ἄρτοι അപ്പങ്ങളെയും κριθίνους യവംകൊണ്ട് ഉണ്ടാക്കിയതെന്നതിനെയും സൂചിപ്പിക്കുന്നു. സംഖ്യയോടൊപ്പം ‘അപ്പം’ എന്ന രൂപം മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: ὀψάρια
  choice: മീൻ
  rationale: ഈ സന്ദർഭത്തിൽ അപ്പത്തോടൊപ്പം ഭക്ഷിക്കുന്ന മീനുകളെയാണ് പദം സൂചിപ്പിക്കുന്നത്; വലുപ്പം അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: ἀλλὰ
  choice: എന്നാൽ
  rationale: ലഭ്യമായ ആഹാരവും വലിയ ജനക്കൂട്ടവും തമ്മിലുള്ള വൈരുധ്യം സ്വാഭാവികമായി അടയാളപ്പെടുത്തുന്നു.
- source_word: ταῦτα τί ἐστιν εἰς τοσούτους
  choice: ഇത്രയും പേർക്കു ഇവ എന്തിനു മതിയാകും?
  rationale: വാക്കുകളുടെ ഉപരിതലരൂപത്തേക്കാൾ ഗ്രീക്ക് ചോദ്യത്തിന്റെ മൂല്യനിർണ്ണയാത്മക അർഥം—ഈ ആഹാരം ഇത്രയും ആളുകൾക്കു അപര്യാപ്തമാണെന്ന ആശയം—സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
