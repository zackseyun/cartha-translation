id: JHN.6.27
reference: John 6:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐργάζεσθε μὴ τὴν βρῶσιν τὴν ἀπολλυμένην ἀλλὰ τὴν βρῶσιν τὴν μένουσαν εἰς ζωὴν αἰώνιον, ἣν ὁ υἱὸς τοῦ ἀνθρώπου ὑμῖν δώσει, τοῦτον γὰρ ὁ πατὴρ ἐσφράγισεν ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/027.yaml
  text: Do not work for the food that perishes[a], but for the food that remains to eternal life, which the Son of Man will give to you[b]; for God the Father has set his seal on him.
translation:
  language: ml
  text: നശിച്ചുപോകുന്ന ആഹാരത്തിനുവേണ്ടിയല്ല, നിത്യജീവനിലേക്കു നിലനിൽക്കുന്ന ആഹാരത്തിനുവേണ്ടി അധ്വാനിക്കുവിൻ; അതു മനുഷ്യപുത്രൻ നിങ്ങൾക്കു തരും. എന്തെന്നാൽ, പിതാവായ ദൈവം അവന്റെമേൽ തന്റെ മുദ്ര പതിപ്പിച്ചിരിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘അവനെ മുദ്രയിട്ടിരിക്കുന്നു’; ഈ പ്രയോഗം അംഗീകാരമോ അധികാരപ്പെടുത്തലോ ആധികാരികത ഉറപ്പിക്കലോ സൂചിപ്പിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐργάζεσθε
  choice: അധ്വാനിക്കുവിൻ
  rationale: വർത്തമാനകാല ആജ്ഞയുടെ ബലം നിലനിർത്തുന്നു; പിന്നാലെയുള്ള ὑπέρ അർത്ഥസൂചന മലയാളത്തിൽ ‘ആഹാരത്തിനുവേണ്ടി’ എന്നതിലൂടെ സ്വാഭാവികമായി വ്യക്തമാകുന്നു.
- source_word: βρῶσιν
  choice: ആഹാരം
  rationale: സന്ദർഭത്തിൽ ഭക്ഷിക്കുന്ന പ്രവൃത്തിയെയല്ല, ഭക്ഷണത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ആഹാരം’ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമാണ്.
- source_word: ἀπολλυμένην
  choice: നശിച്ചുപോകുന്ന
  rationale: ക്ഷയിക്കുകയും ഇല്ലാതാകുകയും ചെയ്യുന്ന സ്വഭാവം സൂചിപ്പിക്കുന്ന വർത്തമാന കൃദന്തരൂപത്തിന്റെ വിശാല അർത്ഥം നിലനിർത്തുന്നു.
- source_word: μένουσαν εἰς ζωὴν αἰώνιον
  choice: നിത്യജീവനിലേക്കു നിലനിൽക്കുന്ന
  rationale: μένωയുടെ ‘നിലനിൽക്കുക’ എന്ന അർത്ഥവും εἰς സൂചിപ്പിക്കുന്ന ലക്ഷ്യദിശയും വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: സ്വയംവിശേഷണത്തിന്റെ സ്ഥാപിതമായ മലയാള രൂപവും അതിന്റെ ശാസ്ത്രീയ-ദൈവശാസ്ത്രപരമായ പ്രതിധ്വനിയും നിലനിർത്തുന്നു.
- source_word: ἐσφράγισεν
  choice: തന്റെ മുദ്ര പതിപ്പിച്ചിരിക്കുന്നു
  rationale: മുദ്രയുടെ മൂലരൂപകം സംരക്ഷിക്കുകയും അംഗീകാരം/അധികാരപ്പെടുത്തൽ എന്ന ആശയം പരോക്ഷമായി വഹിക്കുകയും ചെയ്യുന്നു.
- source_word: ὁ πατὴρ ... ὁ θεός
  choice: പിതാവായ ദൈവം
  rationale: പിതാവിനെ ദൈവം എന്നു തിരിച്ചറിയിക്കുന്ന ഗ്രീക്ക് സമാനാധികരണത്തെ സ്വാഭാവിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: ἐσφράγισεν എന്ന മുദ്രാരൂപകത്തിന്റെ അർത്ഥം
  choice: അവന്റെമേൽ തന്റെ മുദ്ര പതിപ്പിച്ചിരിക്കുന്നു
  alternative: അവനെ അധികാരപ്പെടുത്തിയിരിക്കുന്നു / അംഗീകരിച്ചിരിക്കുന്നു
  rationale: ദൈവിക അധികാരപ്പെടുത്തലോ ആധികാരികത ഉറപ്പിക്കലോ എന്ന ആശയം ഉള്ളതായിരിക്കുമ്പോഴും, ഗ്രീക്ക് പാഠത്തിലെ രൂപകം നേരിട്ട് നിലനിർത്തുന്നത് വ്യാഖ്യാനം മാത്രം പാഠമാക്കുന്നത് ഒഴിവാക്കുന്നു.
- issue: ὁ πατὴρ ... ὁ θεός എന്ന സമാനാധികരണം
  choice: പിതാവായ ദൈവം
  alternative: പിതാവ്, ദൈവം
  rationale: പിതാവിനെ ദൈവം എന്ന് പാഠം തിരിച്ചറിയിക്കുന്നതിനെ സ്വാഭാവികമായി അറിയിക്കുന്നു; അതിലധികമായ ഒരു മതവിഭാഗീയ വ്യാഖ്യാനവും ചേർക്കുന്നില്ല.
- issue: εἰς ζωὴν αἰώνιον എന്നതിലെ εἰς
  choice: നിത്യജീവനിലേക്കു
  alternative: നിത്യജീവനുവേണ്ടി
  rationale: ലക്ഷ്യം/ഫലം എന്ന ദിശാബോധം തുറന്നുവെക്കുകയും ‘ജീവൻ നൽകുന്ന’ എന്ന വ്യാഖ്യാനത്തിലേക്ക് പൂർണമായി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ഗൗരവമുള്ള തിരുവെഴുത്ത് ശൈലി. ‘അധ്വാനിക്കുവിൻ’ എന്ന ബഹുവചന ആജ്ഞാരൂപം ശ്രോതാക്കളുടെ ബഹുത്വം പ്രകടമാക്കുന്നു. ദീർഘവാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി, എന്നാൽ ഗ്രീക്ക് പാഠത്തിലെ കാരണംസൂചക ബന്ധം ‘എന്തെന്നാൽ’ വഴി നിലനിർത്തി.
