id: JHN.6.63
reference: John 6:63
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τὸ πνεῦμά ἐστιν τὸ ζῳοποιοῦν, ἡ σὰρξ οὐκ ὠφελεῖ οὐδέν· τὰ ῥήματα ἃ ἐγὼ ⸀λελάληκα ὑμῖν πνεῦμά ἐστιν καὶ ζωή ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/063.yaml
  text: It is the Spirit who gives life[a]; the flesh benefits nothing[c][b]. The words that I have spoken to you are spirit and are life.
translation:
  language: ml
  text: ജീവൻ നൽകുന്നത് ആത്മാവാണ്[a]; ജഡം ഒട്ടും പ്രയോജനപ്പെടുന്നില്ല[b]. ഞാൻ നിങ്ങളോടു പറഞ്ഞിട്ടുള്ള വാക്കുകൾ ആത്മാവും ജീവനും ആകുന്നു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘ആത്മാവു ജീവൻ നൽകുന്നു.’ ഗ്രീക്കിലെ πνεῦμα എന്ന പദത്തിന് ‘പരിശുദ്ധാത്മാവ്’ എന്നോ പൊതുവായി ‘ആത്മാവ്’ എന്നോ അർഥമാകാം; ഇവിടെ സന്ദർഭം പരിശുദ്ധാത്മാവിനെയാണ് കൂടുതൽ അനുകൂലിക്കുന്നത്.
    reason: alternative_reading
  - marker: b
    text: ‘ജഡം’ എന്നത് കേവലം മാനുഷികമായതിനെയെല്ലാം വിശാലമായി സൂചിപ്പിക്കാം; ഇവിടെ അതിനെ ‘പാപസ്വഭാവം’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് ഗ്രീക്കുപാഠം ആവശ്യപ്പെടുന്നതിനെക്കാൾ കൂടുതൽ വ്യാഖ്യാനാത്മകമായിരിക്കും.
    reason: lexical_alternative
  - marker: c
    text: അല്ലെങ്കിൽ ‘പരിശുദ്ധാത്മാവും ജീവനും ആകുന്നു’ എന്നും ‘ആത്മീയവും ജീവദായകവുമാണ്’ എന്നും ഗ്രഹിക്കാം. ഗ്രീക്കിലെ പ്രയോഗം ചുരുക്കമുള്ളതും ഗുണസൂചകവുമാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: πνεῦμα
  choice: ആത്മാവ്
  rationale: ആദ്യ വാക്യഭാഗത്തിലെ സാർഥകമായ നിർദേശകപ്രയോഗവും യോഹന്നാന്റെ സന്ദർഭവും പരിശുദ്ധാത്മാവിനെയാണ് കൂടുതൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്. എന്നാൽ ഗ്രീക്കുപദത്തിന് പൊതുവായി ‘ആത്മാവ്’ എന്നും അർഥമാകാം; മലയാളത്തിലെ രൂപം ആ ഭാഷാപരമായ സാധ്യത നിലനിർത്തുന്നു.
- source_word: ζῳοποιοῦν
  choice: ജീവൻ നൽകുന്നത്
  rationale: ‘ജീവിപ്പിക്കുക, ജീവൻ നൽകുക’ എന്ന വർത്തമാനകൃത്യത്തിന്റെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; ആത്മാവിന്റെ ജീവദായക പ്രവർത്തനവും നിലനിർത്തുന്നു.
- source_word: σὰρξ
  choice: ജഡം
  rationale: ‘പാപസ്വഭാവം’ എന്നതുപോലുള്ള കൂടുതൽ വ്യാഖ്യാനാത്മകമായ പദം ഒഴിവാക്കി, ആത്മാവിനോടുള്ള വിശാലവും ഉദ്ദേശപൂർവം നിർവചിക്കപ്പെടാത്തതുമായ വൈരുധ്യം നിലനിർത്തുന്നു. ‘മാംസം’ എന്നത് ഇവിടെ കേവലം ശരീരമാംസം എന്ന ധാരണ അതിയായി ഉണർത്താം.
- source_word: ὠφελεῖ οὐδέν
  choice: ഒട്ടും പ്രയോജനപ്പെടുന്നില്ല
  rationale: പ്രയോജനമൊന്നുമില്ലെന്ന ശക്തമായ നിഷേധം വ്യക്തവും ആധുനികവുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: ῥήματα
  choice: വാക്കുകൾ
  rationale: സംസാരിക്കപ്പെട്ട ഉച്ചാരണങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘വാക്കുകൾ’ നേരിട്ടും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ പരിഭാഷയാണ്.
- source_word: λελάληκα
  choice: പറഞ്ഞിട്ടുള്ള
  rationale: ഗ്രീക്കിലെ perfect രൂപത്തിന്റെ, മുമ്പ് പറഞ്ഞതും ഇപ്പോഴും പ്രസക്തമായി നിലനിൽക്കുന്നതുമായ ഭാവം മലയാളത്തിലെ ‘-ിട്ടുള്ള’ രൂപം സാധ്യമായത്ര നിലനിർത്തുന്നു.
- source_word: πνεῦμά ἐστιν
  choice: ആത്മാവും … ആകുന്നു
  rationale: നിർദേശകപദമില്ലാത്ത predicate-ന്റെ ഗുണസൂചകവും ചുരുക്കമുള്ളതുമായ പ്രയോഗം നിലനിർത്തുന്നു; ‘ആത്മീയമാണ്’ എന്ന വ്യാഖ്യാനത്തിലേക്കോ ‘പരിശുദ്ധാത്മാവുതന്നെയാണ്’ എന്ന നേരിട്ടുള്ള സമീകരണത്തിലേക്കോ വാചകത്തെ ചുരുക്കുന്നില്ല.
- source_word: ζωή
  choice: ജീവൻ
  rationale: യോഹന്നാന്റെ രചനകളിൽ ദൈവശാസ്ത്രപരമായ ആഴമുള്ള പതിവുപദത്തിന്റെ നേരിട്ടുള്ള മലയാളസമാനം.
theological_decisions:
- issue: ആദ്യ വാക്യഭാഗത്തിലെ πνεῦμα ആരെ/എന്തിനെ സൂചിപ്പിക്കുന്നു
  choice: സന്ദർഭത്തിൽ പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്ന ‘ആത്മാവ്’
  alternative: പൊതുവായ ആത്മീയ തത്ത്വം, അല്ലെങ്കിൽ മനുഷ്യാത്മാവ്
  rationale: യോഹന്നാന്റെ സുവിശേഷത്തിൽ ജീവൻ നൽകുന്ന പ്രവർത്തനം ആത്മാവുമായി ശക്തമായി ബന്ധപ്പെട്ടിരിക്കുന്നു; നിർദേശകപദമുള്ള ഗ്രീക്കുരൂപവും ഒരു നിർദിഷ്ട സൂചനയെ പിന്തുണയ്ക്കുന്നു. എങ്കിലും മലയാളവാചകവും അടിക്കുറിപ്പും പദത്തിന്റെ യഥാർഥ ഭാഷാപരമായ അവ്യക്തത നിലനിർത്തുന്നു.
- issue: ആത്മാവിനോടു വിരുദ്ധമായി σὰρξ എന്നതിന്റെ അർഥം
  choice: വിശാലമായ അർഥം നിലനിർത്താൻ ‘ജഡം’
  alternative: പാപസ്വഭാവം, കേവല മനുഷ്യശ്രമം, ഭൗതികശരീരം
  rationale: ഒരു പ്രത്യേക മനുഷ്യശാസ്ത്രപരമോ സഭാപാരമ്പര്യപരമോ ആയ വ്യാഖ്യാനം ചേർക്കാതെ യേശുവിന്റെ വാക്കുകളിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം അതേപടി സൂക്ഷിക്കുന്നു.
- issue: അവസാന വാക്യഭാഗത്തിലെ πνεῦμά ἐστιν എന്നതിന്റെ predicate force
  choice: ഗുണസൂചകമായ ‘ആത്മാവും ജീവനും ആകുന്നു’
  alternative: ‘പരിശുദ്ധാത്മാവും ജീവനുമാണ്’ എന്ന സമീകരണം; ‘ആത്മീയവും ജീവദായകവുമാണ്’ എന്ന വ്യാഖ്യാനം
  rationale: നിർദേശകപദമില്ലാത്ത predicate ഗുണസൂചകമായ അർഥത്തെ അനുകൂലിക്കുന്നു. ഗ്രീക്കിലെ മുറുക്കമുള്ള പ്രയോഗം നിലനിർത്തുകയും അതിന്റെ അർഥം അതിരുകടന്ന് വിശദീകരിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ജഡം’ എന്ന പദം സന്ദർഭത്തിലെ ദൈവശാസ്ത്രപരമായ വിശാലത സംരക്ഷിക്കാൻ ഉദ്ദേശപൂർവം നിലനിർത്തി; മറ്റു ഭാഗങ്ങളിൽ അനാവശ്യമായി പഴയ ബൈബിൾശൈലി സ്വീകരിച്ചിട്ടില്ല. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദപ്രയോഗത്തിനു പിന്നാലെ മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
