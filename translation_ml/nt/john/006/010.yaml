id: JHN.6.10
reference: John 6:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀εἶπεν ὁ Ἰησοῦς· Ποιήσατε τοὺς ἀνθρώπους ἀναπεσεῖν. ἦν δὲ χόρτος πολὺς ἐν τῷ τόπῳ. ἀνέπεσαν οὖν οἱ ἄνδρες τὸν ἀριθμὸν ⸀ὡς πεντακισχίλιοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/010.yaml
  text: Jesus said, “Have the people sit down.” Now there was plenty of grass in the place. So the men sat down, about five thousand in number.
translation:
  language: ml
  text: 'യേശു പറഞ്ഞു: “ആളുകളെ ഇരുത്തുക.”[a] ആ സ്ഥലത്ത് ധാരാളം പുല്ലുണ്ടായിരുന്നു. അങ്ങനെ പുരുഷന്മാർ ഇരുന്നു; അവരുടെ എണ്ണം ഏകദേശം അയ്യായിരമായിരുന്നു.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആളുകളെ ഭക്ഷണത്തിനായി ചാരിക്കിടക്കാൻ പറയുക.” ഗ്രീക്ക് ക്രിയ ഭക്ഷണം കഴിക്കാൻ ചാരിക്കിടക്കുന്നതിനെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ആദ്യം ഗ്രീക്ക് പാഠം പൊതുവായി ‘ആളുകൾ’ (ἀνθρώπους) എന്നു പറയുന്നു; എന്നാൽ എണ്ണത്തെക്കുറിച്ചു പറയുമ്പോൾ ‘പുരുഷന്മാർ’ (ἄνδρες) എന്ന പദമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ ഏകദേശം അയ്യായിരം എന്ന എണ്ണം പ്രത്യേകിച്ച് പുരുഷന്മാരുടേതാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ποιήσατε τοὺς ἀνθρώπους ἀναπεσεῖν
  choice: ആളുകളെ ഇരുത്തുക
  rationale: ποιέω + infinitive എന്ന ഘടന കാരണാർത്ഥക കല്പനയാണ്. മലയാളത്തിലെ ‘ഇരുത്തുക’ അത് സ്വാഭാവികമായും സംക്ഷിപ്തമായും പ്രകടിപ്പിക്കുന്നു. ἀνθρώπους ഇവിടെ മുഴുവൻ ജനക്കൂട്ടത്തെയും സൂചിപ്പിക്കുന്നതിനാൽ ‘ആളുകളെ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: ἀναπεσεῖν / ἀνέπεσαν
  choice: ഇരുത്തുക / ഇരുന്നു
  rationale: ἀναπίπτω ഭക്ഷണത്തിനായി ചാരിക്കിടക്കുന്നതിനെയും സൂചിപ്പിക്കാം; എന്നാൽ ഈ തുറസ്സായ സ്ഥലത്തെ സന്ദർഭത്തിൽ ‘ഇരിക്കുക’ എന്നത് സാധാരണ മലയാളത്തിൽ പ്രവർത്തിയെ വ്യക്തമായി അറിയിക്കുന്നു. സാധ്യതയുള്ള ‘ചാരിക്കിടക്കുക’ എന്ന അർത്ഥം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: χόρτος πολὺς
  choice: ധാരാളം പുല്ല്
  rationale: χόρτος ഇവിടെ ‘പുല്ല്’ എന്നും πολὺς സമൃദ്ധിയെയും സൂചിപ്പിക്കുന്നു. ‘ധാരാളം പുല്ല്’ സ്വാഭാവികവും അർത്ഥസമഗ്രവുമായ ആധുനിക മലയാളമാണ്.
- source_word: ἐν τῷ τόπῳ
  choice: ആ സ്ഥലത്ത്
  rationale: ഗ്രീക്കിലെ നിർദിഷ്ട സ്ഥലസൂചന മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: οἱ ἄνδρες
  choice: പുരുഷന്മാർ
  rationale: ἀνήρ ഇവിടെ പുരുഷന്മാരെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നു; നേരത്തെയുള്ള പൊതുവായ ἀνθρώπους എന്ന പദത്തിൽനിന്നുള്ള വ്യത്യാസം സംരക്ഷിക്കുന്നു.
- source_word: τὸν ἀριθμὸν ὡς πεντακισχίλιοι
  choice: അവരുടെ എണ്ണം ഏകദേശം അയ്യായിരമായിരുന്നു
  rationale: ὡς ഏകദേശസംഖ്യയെയും τὸν ἀριθμόν എണ്ണത്തെയും വ്യക്തമാക്കുന്നു. ഈ രൂപം രണ്ടും വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ജനക്കൂട്ടത്തെ പൊതുവായി സൂചിപ്പിക്കുന്ന പദവും എണ്ണപ്പെട്ട പുരുഷന്മാരെ സൂചിപ്പിക്കുന്ന പദവും തമ്മിലുള്ള വ്യത്യാസം
  choice: ἀνθρώπους എന്നത് ‘ആളുകൾ’ എന്നും ἄνδρες എന്നത് ‘പുരുഷന്മാർ’ എന്നും വേർതിരിച്ചു പരിഭാഷപ്പെടുത്തി.
  alternative: രണ്ടിടത്തും ‘ആളുകൾ’ എന്ന പൊതുപദം ഉപയോഗിക്കുക.
  rationale: ഗ്രീക്ക് പാഠത്തിലെ പദവ്യത്യാസം എണ്ണത്തിൽ പറഞ്ഞ ഏകദേശം അയ്യായിരം പേർ പ്രത്യേകിച്ച് പുരുഷന്മാരാണെന്ന് സൂചിപ്പിക്കുന്നു. അതിനെ പൊതുവാക്കാതെ സംരക്ഷിക്കുന്നത് മൂലപാഠത്തോട് കൂടുതൽ വിശ്വസ്തമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. വാക്യഘടന സ്വാഭാവികമാക്കിയെങ്കിലും ഗ്രീക്കിലെ പൊതുവായ ‘ആളുകൾ’ എന്നും പുരുഷലിംഗനിർദിഷ്ടമായ ‘പുരുഷന്മാർ’ എന്നും ഉള്ള വ്യത്യാസവും ഏകദേശസംഖ്യയും സംരക്ഷിച്ചു.
