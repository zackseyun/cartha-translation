translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ ഇരട്ട സ്ഥലനാമബന്ധം മലയാളത്തിൽ വ്യക്തമായി അവതരിപ്പിച്ചിരിക്കുന്നു; വാക്യത്തിലെ എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും പ്രധാന പാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
