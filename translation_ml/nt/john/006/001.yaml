id: JHN.6.1
reference: John 6:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἀπῆλθεν ὁ Ἰησοῦς πέραν τῆς θαλάσσης τῆς Γαλιλαίας τῆς Τιβεριάδος.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/001.yaml
  text: After these things[a], Jesus went away to the other side of the Sea of Galilee[b], which is the Sea of Tiberias.
translation:
  language: ml
  text: ഇവയ്ക്കു ശേഷം[a] യേശു ഗലീലക്കടലിന്റെ—അതായത്, തിബെര്യാസ് കടലിന്റെ—മറുകരയിലേക്കു പോയി.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: “ഈ കാര്യങ്ങൾക്കു ശേഷം.”'
    reason: lexical_alternative
  - marker: b
    text: “ഗലീലക്കടൽ” “തിബെര്യാസ് കടൽ” എന്നും അറിയപ്പെട്ടിരുന്നു. ഇവിടെ രണ്ടും ഒരേ ജലാശയത്തിന്റെ പേരുകളാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: ഇവയ്ക്കുശേഷം
  rationale: യോഹന്നാന്റെ ആഖ്യാനത്തിലെ പരിവർത്തനപ്രയോഗവും ഗ്രീക്കിലെ ബഹുവചനമായ ταῦτα എന്നതും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀπῆλθεν
  choice: പോയി
  rationale: ἀπέρχομαι എന്ന ക്രിയയുടെ സന്ദർഭോചിതമായ സഞ്ചാരാർഥം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു; ലക്ഷ്യസ്ഥാനം വ്യക്തമാക്കുന്ന തുടർപ്രയോഗം ദിശാബോധം പകരുന്നു.
- source_word: πέραν
  choice: മറുകരയിലേക്ക്
  rationale: ജലാശയം കടന്ന് എതിർവശത്തേക്കുള്ള നീക്കത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: τῆς θαλάσσης
  choice: കടൽ
  rationale: ഭൗമശാസ്ത്രപരമായി തടാകമാണെങ്കിലും മൂലപദമായ θάλασσαയും പാരമ്പര്യമായ സ്ഥലനാമവും മാനിച്ച് ‘കടൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: τῆς Γαλιλαίας
  choice: ഗലീലക്കടൽ
  rationale: പ്രദേശനാമത്തോടു ചേർന്ന ഈ ജലാശയത്തിന്റെ മലയാളത്തിലെ സ്വാഭാവികവും പരിചിതവുമായ നാമരൂപം ഉപയോഗിക്കുന്നു.
- source_word: τῆς Τιβεριάδος
  choice: അതുതന്നെയാണ് തിബെര്യാസ് കടൽ
  rationale: ഒരേ ജലാശയത്തിനുള്ള രണ്ടാമത്തെ തിരിച്ചറിയൽനാമമാണ് ഇതെന്ന് ഗ്രീക്കിലെ അനുക്രമ വിശേഷണബന്ധം സൂചിപ്പിക്കുന്നതനുസരിച്ച് വ്യക്തമാക്കുന്നു.
