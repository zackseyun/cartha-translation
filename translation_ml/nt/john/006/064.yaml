id: JHN.6.64
reference: John 6:64
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλὰ εἰσὶν ἐξ ὑμῶν τινες οἳ οὐ πιστεύουσιν. ᾔδει γὰρ ἐξ ἀρχῆς ὁ Ἰησοῦς τίνες εἰσὶν οἱ μὴ πιστεύοντες καὶ τίς ἐστιν ὁ παραδώσων αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/064.yaml
  text: But there are some among you who do not believe[a]. For Jesus knew from the beginning who those were who did not believe[b], and who it was who would betray him.
translation:
  language: ml
  text: എന്നാൽ നിങ്ങളിൽ വിശ്വസിക്കാത്ത ചിലരുണ്ട്. ആരൊക്കെയാണ് വിശ്വസിക്കാത്തവർ എന്നും, ആരാണ് അവനെ ഒറ്റിക്കൊടുക്കാനിരിക്കുന്നവൻ[a] എന്നും യേശു ആദിമുതൽ അറിഞ്ഞിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഒറ്റിക്കൊടുക്കാനിരിക്കുന്നവൻ” എന്നതിന് കൂടുതൽ പദാനുപദമായി “അവനെ ഏൽപ്പിച്ചുകൊടുക്കാനിരിക്കുന്നവൻ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തോടുള്ള വൈരുധ്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐξ ὑμῶν
  choice: നിങ്ങളിൽ
  rationale: അഭിസംബോധന ചെയ്യപ്പെടുന്ന കൂട്ടത്തിനുള്ളിലെ ചിലരെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: οἳ οὐ πιστεύουσιν / οἱ μὴ πιστεύοντες
  choice: വിശ്വസിക്കുന്നില്ല / വിശ്വസിക്കാത്തവർ
  rationale: ആദ്യപ്രയോഗത്തിലെ വർത്തമാനകാലത്തെയും രണ്ടാമത്തേതിലെ വിശ്വാസമില്ലായ്മയാൽ തിരിച്ചറിയപ്പെടുന്ന കൂട്ടത്തെയും വായനാസൗകര്യത്തോടെ നിലനിർത്തുന്നു.
- source_word: ᾔδει
  choice: അറിഞ്ഞിരുന്നു
  rationale: ഭൂതകാലത്തിൽ തുടർന്നിരുന്ന അറിവിന്റെ അവസ്ഥയെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐξ ἀρχῆς
  choice: ആദിമുതൽ
  rationale: ‘തുടക്കം’ എന്താണെന്ന് അധികമായി നിർവചിക്കാതെ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ കാലസൂചന നിലനിർത്തുന്നു.
- source_word: παραδώσων αὐτόν
  choice: തന്നെ ഒറ്റിക്കൊടുക്കാൻ പോകുന്നവൻ
  rationale: സന്ദർഭത്തിലെ വഞ്ചനയും ഭാവിസൂചനയും വ്യക്തമാക്കുന്നു; ‘തന്നെ’ യേശുവിലേക്കുള്ള പ്രതിഫലനസൂചന സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: πιστεύω എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: വിശ്വസിക്കുക
  alternative: ആശ്രയിക്കുക
  rationale: യോഹന്നാനിലെ ഈ പദത്തിന്റെ ബൗദ്ധികവും ബന്ധപരവുമായ വ്യാപ്തി ചുരുക്കാതെ നിലനിർത്തുന്ന സ്ഥാപിതവും സ്വാഭാവികവുമായ മലയാളപദം.
- issue: യൂദാസിന്റെ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന παραδίδωμι
  choice: ഒറ്റിക്കൊടുക്കുക
  alternative: ഏല്പിച്ചുകൊടുക്കുക
  rationale: അടിസ്ഥാനാർഥം ‘കൈമാറുക/ഏല്പിക്കുക’ ആണെങ്കിലും ഈ സന്ദർഭത്തിൽ വഞ്ചനാപരമായ കൈമാറ്റമാണ് ഉദ്ദേശിക്കുന്നത്; കൂടുതൽ പദാനുപദമായ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ഗദ്യശൈലി. ഗ്രീക്കിലെ ആവർത്തനം കഴിയുന്നത്ര നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ അസ്വാഭാവികത ഒഴിവാക്കി. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വാക്യാവസാനത്ത് ചേർത്തിരിക്കുന്നു.
