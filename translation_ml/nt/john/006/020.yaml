id: JHN.6.20
reference: John 6:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ λέγει αὐτοῖς· Ἐγώ εἰμι, μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/020.yaml
  text: But he said to them[a], “It is I; do not be afraid.”
translation:
  language: ml
  text: 'എന്നാൽ അവൻ അവരോടു പറഞ്ഞു: “ഞാൻ തന്നെയാണ്[a]; ഭയപ്പെടരുത്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, “ഞാൻ ആകുന്നു.” യോഹന്നാന്റെ സുവിശേഷത്തിൽ ഈ പ്രയോഗം ലളിതമായി സ്വയം തിരിച്ചറിയിക്കുന്ന പ്രയോഗമായിരിക്കാം; അതോടൊപ്പം വിശാലമായ ദൈവശാസ്ത്രപരമായ പ്രമേയങ്ങളുടെ പ്രതിധ്വനിയും ഇതിലുണ്ടാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ
  choice: എന്നാൽ അവൻ
  rationale: δέ ഇവിടെ സംഭവവികാസത്തിലെ നേരിയ വഴിത്തിരിവോ വൈരുധ്യമോ സൂചിപ്പിക്കുന്നു; ὁ സർവനാമപ്രയോഗമായി യേശുവിനെ സൂചിപ്പിക്കുന്നു. അതിനാൽ ‘എന്നാൽ അവൻ’ സ്വാഭാവികവും അർഥനിഷ്ഠവുമാണ്.
- source_word: λέγει
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിൽ ചരിത്രവർത്തമാനകാലമാണെങ്കിലും മലയാള കഥനശൈലിയിൽ ഭൂതകാലമായ ‘പറഞ്ഞു’ കൂടുതൽ സ്വാഭാവികമാണ്.
- source_word: αὐτοῖς
  choice: അവരോടു
  rationale: മൂലപാഠത്തിലെ ദത്തിവ് ബഹുവചന സർവനാമത്തെ നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു; ആരെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: Ἐγώ εἰμι
  choice: ഞാൻ തന്നെയാണ്
  rationale: ഉടൻസന്ദർഭത്തിൽ യേശു സ്വയം തിരിച്ചറിയിക്കുകയാണ്. ‘ഞാൻ തന്നെയാണ്’ മലയാളത്തിൽ സ്വാഭാവികമായ സ്വയംതിരിച്ചറിയിക്കൽ നൽകുകയും ‘ഞാൻ ആകുന്നു’ എന്ന കൂടുതൽ അക്ഷരാർഥപരവും ദൈവശാസ്ത്രപരമായി പ്രതിധ്വനിക്കാവുന്നതുമായ വായന അടിക്കുറിപ്പിൽ നിലനിർത്താൻ അനുവദിക്കുകയും ചെയ്യുന്നു.
- source_word: μὴ φοβεῖσθε
  choice: ഭയപ്പെടേണ്ടാ
  rationale: μή സഹിതമുള്ള വർത്തമാന ആജ്ഞാരൂപം ഒരു നിരോധനമാണ്. കൊടുങ്കാറ്റിനിടയിലെ ഭയത്തിന്റെ സന്ദർഭത്തിൽ ‘ഭയപ്പെടേണ്ടാ’ വ്യക്തവും സ്വാഭാവികവും ആശ്വാസകരവുമാണ്.
theological_decisions:
- issue: Ἐγώ εἰμι എന്നത് ലളിതമായ സ്വയംതിരിച്ചറിയിക്കലായോ ‘ഞാൻ ആകുന്നു’ എന്ന കൂടുതൽ അക്ഷരാർഥപരവും ദൈവശാസ്ത്രപ്രതിധ്വനിയുള്ളതുമായ പ്രയോഗമായോ നൽകണമോ
  choice: പ്രധാനപാഠത്തിൽ ‘ഞാൻ തന്നെയാണ്’
  alternative: ‘ഞാൻ ആകുന്നു’
  rationale: സന്ദർഭത്തിൽ യേശു ഭയന്ന ശിഷ്യന്മാർക്ക് താനാരാണെന്ന് അറിയിച്ച് ആശ്വസിപ്പിക്കുന്നു. എന്നാൽ യോഹന്നാനിൽ ἐγώ εἰμι എന്ന പ്രയോഗത്തിന് വിശാലമായ ദൈവശാസ്ത്രപ്രതിധ്വനി ഉണ്ടാകാം; അതിനാൽ അതിനെ പ്രധാനപാഠത്തിൽ നിർബന്ധിച്ച് ഉറപ്പിക്കാതെയും മറച്ചുവയ്ക്കാതെയും അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ‘ഭയപ്പെടേണ്ടാ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കുമ്പോഴും വാക്യത്തിന്റെ ഗൗരവവും ആശ്വാസസ്വരവും നിലനിർത്തുന്നു.
