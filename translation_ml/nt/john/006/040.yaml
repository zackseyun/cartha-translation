  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി ഉപയോഗിച്ചു. ‘പുത്രൻ,’ ‘പിതാവ്,’ ‘നിത്യജീവൻ,’ ‘ഉയിർപ്പിക്കുക’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തിയെങ്കിലും പഴഞ്ചൻ വാക്യഘടന ഒഴിവാക്കി. ഗ്രീക്കിലെ ദീർഘവാക്യത്തിന്റെ തർക്കബന്ധം അർധവിരാമത്തിലൂടെ വ്യക്തമായി സൂക്ഷിച്ചു.
