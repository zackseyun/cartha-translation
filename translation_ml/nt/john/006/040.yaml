    rationale: 'Although intended to reflect ἵνα + subjunctive, this Malayalam wording is semantically and idiomatically awkward: a person does not ordinarily ‘have to have’ eternal life. It may imply obligation. «നിത്യജീവൻ ലഭിക്കണം» better expresses the intended outcome within the stated divine will while retaining the non-indicative formulation.'
