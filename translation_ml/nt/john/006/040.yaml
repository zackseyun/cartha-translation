  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῦτο ⸀γάρ ἐστιν τὸ θέλημα τοῦ ⸂πατρός μου⸃ ἵνα πᾶς ὁ θεωρῶν τὸν υἱὸν καὶ πιστεύων εἰς αὐτὸν ἔχῃ ζωὴν αἰώνιον, καὶ ἀναστήσω αὐτὸν ⸀ἐγὼ τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/040.yaml
  text: 'For this is the will of my Father: that everyone who sees the Son and believes in him may have eternal life[b][a], and I myself will raise him up on the last day.'
translation:
  language: ml
  text: 'എന്തെന്നാൽ, എന്റെ പിതാവിന്റെ ഇഷ്ടം ഇതാണ്: പുത്രനെ കാണുകയും[a] അവനിൽ വിശ്വസിക്കുകയും ചെയ്യുന്ന ഏവനും നിത്യജീവൻ ലഭിക്കണം; അവസാന നാളിൽ ഞാൻതന്നെ[b] അവനെ ഉയിർപ്പിക്കും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പുത്രനെ ഉറ്റുനോക്കുകയും.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ക്രിയ വെറും ശാരീരികമായി കാണുന്നതിലുപരി ശ്രദ്ധയോടെ നോക്കുക എന്ന അർഥവും വഹിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ, ‘ഞാൻ അവനെ ഉയിർപ്പിക്കും.’ ഗ്രീക്കിൽ ‘ഞാൻ’ എന്ന സർവനാമം വ്യക്തമായി ചേർത്തിരിക്കുന്നതിനാൽ അതിന് ഊന്നലുണ്ട്: ‘ഞാൻതന്നെ അവനെ ഉയിർപ്പിക്കും.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο γάρ ἐστιν
  choice: എന്തെന്നാൽ, ... എന്നതാണ്
  rationale: γάρ മുൻവാക്യത്തോടുള്ള വിശദീകരണബന്ധം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യക്രമത്തിനായി τοῦτο ἐστιν എന്ന ഘടനയെ അവസാനത്തെ ‘എന്നതാണ്’ എന്നതിലൂടെ പ്രതിനിധീകരിച്ചു.
- source_word: τὸ θέλημα τοῦ πατρός μου
  choice: എന്റെ പിതാവിന്റെ ഇഷ്ടം
  rationale: θέλημα ഉദ്ദേശിക്കുന്നതോ ആഗ്രഹിക്കുന്നതോ ആയ കാര്യത്തെ സൂചിപ്പിക്കുന്നു. ‘ഇഷ്ടം’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും ദൈവിക ഉദ്ദേശത്തിന്റെ അർഥം നിലനിർത്തുന്നതുമാണ്.
- source_word: πᾶς ὁ θεωρῶν τὸν υἱὸν
  choice: പുത്രനെ കാണുന്ന ഏവനും
  rationale: ആർട്ടിക്കിളോടുകൂടിയ വർത്തമാനകാല കൃദന്തം പൊതുവായ, സ്വഭാവസൂചകമായ അർഥം നൽകുന്നു. θεωρέω ശ്രദ്ധയോടെയുള്ള കാണലിനെയും സൂചിപ്പിക്കാമെങ്കിലും മുഖ്യപാഠത്തിൽ ലളിതമായ ‘കാണുക’ ഉപയോഗിച്ച് ആ സൂക്ഷ്മത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: καὶ πιστεύων εἰς αὐτὸν
  choice: അവനിൽ വിശ്വസിക്കുകയും ചെയ്യുന്ന
  rationale: πιστεύω + εἰς വ്യക്തിയിലേക്കു തിരിഞ്ഞ വിശ്വാസത്തെയും ആശ്രയത്തെയും സൂചിപ്പിക്കുന്നു; ‘അവനിൽ വിശ്വസിക്കുക’ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἔχῃ ζωὴν αἰώνιον
  choice: നിത്യജീവൻ ഉണ്ടാകണം
  rationale: ἵνα-യോടുകൂടിയ subjunctive രൂപം പിതാവിന്റെ ഇഷ്ടത്തിന്റെ ഉള്ളടക്കവും ലക്ഷ്യവും പ്രകടിപ്പിക്കുന്നു. ‘ഉണ്ടാകണം’ അതിനെ സാധാരണ സൂചകവാക്യമായി ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: καὶ ἀναστήσω αὐτὸν ἐγώ
  choice: ഞാൻതന്നെ അവനെ ഉയിർപ്പിക്കും
  rationale: ἀναστήσω അന്ത്യകാലത്തെ ഉയിർപ്പിക്കലിനെ സൂചിപ്പിക്കുന്നു. വ്യക്തമായി ചേർത്തിരിക്കുന്ന ἐγώ നൽകുന്ന ഊന്നൽ ‘ഞാൻതന്നെ’ എന്നതിലൂടെ സംരക്ഷിച്ചു.
- source_word: τῇ ἐσχάτῃ ἡμέρᾳ
  choice: അവസാന നാളിൽ
  rationale: കാലസൂചകമായ dative പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം; യോഹന്നാനിലെ അന്ത്യകാലസൂചന നിലനിർത്തുന്നു.
theological_decisions:
- issue: πᾶς ὁ θεωρῶν ... καὶ πιστεύων എന്ന പ്രയോഗത്തിലെ വ്യാപ്തിയും വ്യവസ്ഥയും
  choice: പുത്രനെ കാണുകയും അവനിൽ വിശ്വസിക്കുകയും ചെയ്യുന്ന ഏവനും നിത്യജീവൻ ഉണ്ടാകണം
  alternative: പുത്രനെ നോക്കി അവനിൽ വിശ്വസിക്കുന്ന ഏവനും നിത്യജീവൻ ഉണ്ട്
  rationale: കാണുകയും വിശ്വസിക്കുകയും ചെയ്യുന്നവരെ പൊതുവായി വിശേഷിപ്പിക്കുന്ന ഗ്രീക്ക് കൃദന്തരൂപം നിലനിർത്തി. ἵνα + subjunctive ഘടനയെ ഒരു ലളിത സൂചകവാക്യമായി മാറ്റാതെ പിതാവിന്റെ ഇഷ്ടത്തിന്റെ ഉള്ളടക്കമായി അവതരിപ്പിച്ചു; തിരഞ്ഞെടുപ്പിനെയോ മനുഷ്യസ്വാതന്ത്ര്യത്തെയോ കുറിച്ചുള്ള ഒരു പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ നിഗമനം ചേർത്തിട്ടില്ല.
- issue: καὶ ἀναστήσω αὐτὸν ἐγώ എന്നതിലെ ἐγώ-യുടെ ഊന്നൽ
  choice: ഞാൻതന്നെ അവനെ ഉയിർപ്പിക്കും
  alternative: ഞാൻ അവനെ ഉയിർപ്പിക്കും
  rationale: ഗ്രീക്കിൽ ക്രിയാരൂപംകൊണ്ടുതന്നെ കർത്താവ് വ്യക്തമാകുമ്പോഴും ἐγώ പ്രത്യേകം ചേർത്തതിനാൽ യേശുവിന്റെ വ്യക്തിപരമായ പ്രവർത്തനത്തിന് ഊന്നലുണ്ട്; ‘ഞാൻതന്നെ’ അത് അധിക സിദ്ധാന്തം ചേർക്കാതെ പ്രകടിപ്പിക്കുന്നു.
