revisions:
- from: എന്നാൽ ഞാൻ നിങ്ങളോടു പറഞ്ഞതുപോലെ, നിങ്ങൾ എന്നെ കണ്ടിട്ടും വിശ്വസിക്കുന്നില്ല.[a]
  to: എന്നാൽ, നിങ്ങൾ എന്നെ കണ്ടിട്ടും വിശ്വസിക്കുന്നില്ല എന്ന് ഞാൻ നിങ്ങളോടു പറഞ്ഞു.[a]
  rationale: മുഖ്യപാഠത്തിലെ “പറഞ്ഞതുപോലെ” മാറ്റി, ὅτιയുടെ ഉള്ളടക്കവാക്യബന്ധം കൃത്യമായി കാണിക്കുന്ന “... എന്ന് ഞാൻ നിങ്ങളോടു പറഞ്ഞു” ഉപയോഗിച്ചു. “കണ്ടിട്ടും” എന്ന സ്വാഭാവികമായ വിട്ടുവീഴ്ചാഭാവമുള്ള പ്രയോഗവും “വിശ്വസിക്കുന്നില്ല” എന്ന യോജിച്ച പദവും നിലനിർത്തിയിരിക്കുന്നു. അടിക്കുറിപ്പ് കൂടുതൽ രൂപാനുസൃതമായ പദക്രമം നൽകുന്നു.
