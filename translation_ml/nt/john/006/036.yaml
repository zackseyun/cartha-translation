  yaml_path: translation/nt/john/006/036.yaml
  text: But I told you that you have even seen me[a], and yet you do not believe.
translation:
  language: ml
  text: എന്നാൽ, നിങ്ങൾ എന്നെ കണ്ടിട്ടും വിശ്വസിക്കുന്നില്ല എന്ന് ഞാൻ നിങ്ങളോടു പറഞ്ഞു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ രൂപാനുസൃതമായി: “എന്നാൽ ഞാൻ നിങ്ങളോടു പറഞ്ഞു: നിങ്ങൾ എന്നെ കണ്ടിരിക്കുന്നു, എന്നിട്ടും വിശ്വസിക്കുന്നില്ല.”'
    reason: ὅτι അവതരിപ്പിക്കുന്ന ഉള്ളടക്കവാക്യത്തെയും രണ്ട് καίകളുടെ ബന്ധത്തെയും കൂടുതൽ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്ന പരിഭാഷാവികല്പം.
lexical_decisions:
- source_word: ἀλλ’
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തോടുള്ള വ്യക്തമായ വൈരുധ്യം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി അടയാളപ്പെടുത്തുന്നു.
- source_word: εἶπον ὑμῖν ὅτι
  choice: ഞാൻ നിങ്ങളോടു പറഞ്ഞതുപോലെ
  rationale: ഗ്രീക്കിലെ ‘ഞാൻ നിങ്ങളോടു പറഞ്ഞു’ എന്ന മുൻപ്രസ്താവനയുടെ സൂചന മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; ὅτι ഇവിടെ ഉദ്ധരിക്കപ്പെടുന്ന ഉള്ളടക്കത്തിലേക്കു നയിക്കുന്നു.
- source_word: καὶ ἑωράκατέ με
  choice: നിങ്ങൾ എന്നെ കണ്ടിട്ടും
  rationale: പൂർണ്ണകാലക്രിയയായ ἑωράκατε സൂചിപ്പിക്കുന്ന, ഇപ്പോഴും പ്രസക്തമായ കണ്ട അനുഭവവും ആദ്യ καί നൽകുന്ന ഊന്നൽ/വിട്ടുവീഴ്ചാഭാവവും മലയാളത്തിലെ ‘കണ്ടിട്ടും’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: καὶ οὐ πιστεύετε
  choice: വിശ്വസിക്കുന്നില്ല
  rationale: രണ്ടാമത്തെ καί ബന്ധിപ്പിക്കുന്ന വൈരുധ്യഫലം മലയാളത്തിലെ ‘-ിട്ടും’ ഘടനയിൽ ഇതിനകം വ്യക്തമാകുന്നതിനാൽ മറ്റൊരു ബന്ധപദം ആവശ്യമില്ല; വർത്തമാനകാലം തുടരുന്ന അവിശ്വാസത്തെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ആദ്യ καίയുടെ പ്രഭാവം
  choice: ‘കണ്ടിട്ടും’ എന്ന വിട്ടുവീഴ്ചാഭാവമുള്ള രൂപം
  alternative: ‘നിങ്ങൾ എന്നെ കണ്ടിരിക്കുന്നു; എന്നിട്ടും വിശ്വസിക്കുന്നില്ല’ അല്ലെങ്കിൽ കൂടുതൽ രൂപാനുസൃതമായി ‘എന്നെ കണ്ടിരിക്കുകയും വിശ്വസിക്കാതിരിക്കുകയും ചെയ്യുന്നു’
  rationale: കാണുന്നത് വിശ്വാസത്തിലേക്കു നയിക്കേണ്ടതായിരുന്നിട്ടും അങ്ങനെ സംഭവിച്ചില്ലെന്ന വാക്യത്തിന്റെ വാഗ്‌വൈരുധ്യം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു; പ്രത്യേക സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: πιστεύετε എന്നതിന്റെ പരിഭാഷ
  choice: വിശ്വസിക്കുന്നില്ല
  alternative: ആശ്രയിക്കുന്നില്ല; വിശ്വാസം വെക്കുന്നില്ല
  rationale: യോഹന്നാന്റെ പ്രയോഗത്തിൽ πιστεύωയ്ക്ക് നേരിട്ടും സ്ഥാപിതവുമായ തുല്യപദം ‘വിശ്വസിക്കുക’ ആണ്; ബൗദ്ധിക സമ്മതമോ മറ്റൊരു പ്രത്യേക ദൈവശാസ്ത്ര അർത്ഥമോ അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- issue: എന്താണ് മുമ്പ് പറഞ്ഞതെന്നുള്ള സൂചന
  choice: ‘ഞാൻ നിങ്ങളോടു പറഞ്ഞതുപോലെ’
  alternative: '‘ഞാൻ നിങ്ങളോടു പറഞ്ഞു: നിങ്ങൾ എന്നെ കണ്ടിട്ടും വിശ്വസിക്കുന്നില്ല’'
  rationale: ഗ്രീക്കിലെ ὅτι ഉള്ളടക്കവാക്യം അവതരിപ്പിക്കാമെങ്കിലും, 6:36 മുൻവാക്കിലേക്കുള്ള സൂചനയുമാകാമെന്ന വ്യാഖ്യാനസാധ്യതയുണ്ട്. മുഖ്യപാഠം സ്വാഭാവികമാക്കി, കൂടുതൽ രൂപാനുസൃതമായ വായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘കണ്ടിട്ടും’ എന്ന പ്രയോഗം ഗ്രീക്കിലെ ഊന്നലോടുകൂടിയ വൈരുധ്യം സ്വാഭാവികമായി വഹിക്കുന്നു; അടിക്കുറിപ്പ് കൂടുതൽ രൂപാനുസൃതമായ ഘടന നൽകുന്നു.
