id: JHN.6.50
reference: John 6:50
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ ἄρτος ὁ ἐκ τοῦ οὐρανοῦ καταβαίνων ἵνα τις ἐξ αὐτοῦ φάγῃ καὶ μὴ ἀποθάνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/050.yaml
  text: This is the bread that comes down from heaven[b][a], so that anyone may eat from it and not die.
translation:
  language: ml
  text: സ്വർഗത്തിൽനിന്ന് ഇറങ്ങിവരുന്ന അപ്പം ഇതാണ്[a]—ആരെങ്കിലും ഇതിൽനിന്ന് തിന്ന് മരിക്കാതിരിക്കേണ്ടതിന്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു പരിഭാഷ: “സ്വർഗത്തിൽനിന്ന് ഇറങ്ങിക്കൊണ്ടിരിക്കുന്ന അപ്പം ഇതാണ്.”'
    reason: വർത്തമാനകാല പങ്കുപദമായ καταβαίνων-ന്റെ തുടരുന്ന ഭാവം കൂടുതൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്ന പരിഭാഷാമാർഗം.
  - marker: b
    text: “മരിക്കാതിരിക്കുക” എന്ന പ്രയോഗം ഇവിടെ വിശാലമായ അർഥത്തിൽ നിലനിർത്തിയിരിക്കുന്നു. സന്ദർഭത്തിൽ ഇത് അന്തിമമരണം, ആത്മീയമരണം, അല്ലെങ്കിൽ അന്ത്യകാല നാശം എന്നിവയിൽ ഏതിനെയാണ് സൂചിപ്പിക്കുന്നത് എന്നതിനെക്കുറിച്ച് വ്യത്യസ്ത വ്യാഖ്യാനങ്ങളുണ്ട്.
    reason: മൂലവാക്യം മരണത്തിന്റെ സ്വഭാവം പ്രത്യേകം നിർവചിക്കാത്തതിനാൽ വ്യാഖ്യാനസാധ്യത വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: οὗτός
  choice: ഇതാണ്
  rationale: അപ്പത്തെ ചൂണ്ടിക്കാട്ടി തിരിച്ചറിയിക്കുന്ന ഗ്രീക്ക് നിർദേശകസർവനാമത്തിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: ἄρτος
  choice: അപ്പം
  rationale: പദത്തിന്റെ സാധാരണ അർഥം നിലനിർത്തുന്നു; യോഹന്നാൻ 6-ലെ രൂപകാർഥം വ്യാഖ്യാനിച്ച് ചേർക്കുന്നില്ല.
- source_word: ὁ ἐκ τοῦ οὐρανοῦ καταβαίνων
  choice: സ്വർഗത്തിൽനിന്ന് ഇറങ്ങിവരുന്ന
  rationale: വർത്തമാനകാല പങ്കുപദത്തിന്റെ സജീവവും തുടരുന്നതുമായ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ ആപേക്ഷിക വിശേഷണരൂപമായി നൽകുന്നു.
- source_word: οὐρανός
  choice: സ്വർഗം
  rationale: സന്ദർഭത്തിൽ ഭൗതികമായ ആകാശമല്ല, ദൈവികമായ സ്വർഗീയ മണ്ഡലമാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἵνα
  choice: ചെയ്യേണ്ടതിന്
  rationale: ഉദ്ദേശ്യം അഥവാ ഫലം സൂചിപ്പിക്കുന്ന ἵνα-വാക്യത്തിന്റെ ബലം മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τις
  choice: ആരെങ്കിലും
  rationale: അനിശ്ചിതവും പൊതുവ്യാപകവുമായ സൂചനയെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐξ αὐτοῦ
  choice: അതിൽനിന്ന്
  rationale: ἐκ എന്ന മുൻപ്രത്യയത്തിന്റെ അടിസ്ഥാനബോധം നിലനിർത്തുകയും അപ്പം ഭക്ഷിക്കുന്നതിനെ മലയാളത്തിൽ വ്യക്തമായി പറയുകയും ചെയ്യുന്നു.
- source_word: φάγῃ
  choice: ഭക്ഷിക്കുകയും
  rationale: ἵνα-വാക്യത്തിനുള്ളിലെ aorist subjunctive-ന്റെ പൊതുവായ സാധ്യത/ഉദ്ദേശ്യഭാവം സംയുക്തക്രിയാരൂപത്തിൽ നൽകുന്നു.
- source_word: μὴ ἀποθάνῃ
  choice: മരിക്കാതിരിക്കുകയും
  rationale: ἀποθνῄσκω എന്ന ക്രിയയുടെ ലളിതമായ അർഥമായ ‘മരിക്കുക’ നിലനിർത്തുന്നു; ‘നശിക്കുക’ എന്ന വ്യാഖ്യാനാത്മകമായ ശക്തീകരണം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: ‘മരിക്കാതിരിക്കുക’ എന്നതിലെ മരണത്തിന്റെ സ്വഭാവം
  choice: ശാരീരികമോ ആത്മീയമോ അന്ത്യകാലികമോ എന്ന് നിർണയിക്കാതെ ‘മരിക്കാതിരിക്കുക’ എന്ന വിശാലമായ പ്രയോഗം നിലനിർത്തി.
  alternative: ‘ആത്മീയമായി മരിക്കാതിരിക്കുക’ അല്ലെങ്കിൽ ‘നിത്യമായി നശിക്കാതിരിക്കുക’ എന്ന് വ്യക്തമാക്കുക.
  rationale: ജീവന്റെ അപ്പത്തെക്കുറിച്ചുള്ള പ്രഭാഷണം സാധാരണ മരണത്തിനപ്പുറമുള്ള ജീവനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, ഈ വാക്യം മരണത്തിന്റെ സ്വഭാവം പ്രത്യേകം നിർവചിക്കുന്നില്ല. അതിനാൽ യോഹന്നാന്റെ ദൈവശാസ്ത്രപരമായ ആഴവും സംഘർഷവും തുറന്ന നിലയിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഗ്രീക്ക് വാക്യക്രമത്തോട് ആവശ്യമായത്ര അടുത്തുനിൽക്കുന്നതിനൊപ്പം ഉദ്ദേശ്യവാക്യം മലയാളത്തിൽ വായിക്കാൻ സ്വാഭാവികമാക്കാൻ ദീർഘരേഖ ഉപയോഗിച്ചു; മതവിഭാഗസവിശേഷമായ വ്യാഖ്യാനം ഒഴിവാക്കി.
