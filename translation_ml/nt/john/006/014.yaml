id: JHN.6.14
reference: John 6:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ οὖν ἄνθρωποι ἰδόντες ⸂ὃ ἐποίησεν σημεῖον⸃ ⸀ἔλεγον ὅτι Οὗτός ἐστιν ἀληθῶς ὁ προφήτης ὁ ἐρχόμενος εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/014.yaml
  text: So when the people saw the sign that he had done[a], they were saying[b], “This truly is the Prophet who is coming into the world.”
translation:
  language: ml
  text: 'അങ്ങനെ, അവൻ ചെയ്ത അടയാളം[a][c] കണ്ടപ്പോൾ ജനങ്ങൾ പറഞ്ഞുകൊണ്ടിരുന്നു: “ലോകത്തിലേക്കു വരുന്ന ആ പ്രവാചകൻ[b] യഥാർഥത്തിൽ ഇദ്ദേഹം തന്നെയാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘അവൻ ചെയ്ത അത്ഭുതം.’ യോഹന്നാൻ പതിവായി ‘അടയാളം’ (σημεῖον) എന്ന പദം ഉപയോഗിക്കുന്നത് യേശുവിന്റെ പ്രവൃത്തികളുടെ അത്ഭുതസ്വഭാവം മാത്രമല്ല, അവ വെളിപ്പെടുത്തുന്ന അർഥവും ഊന്നിപ്പറയാനാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘ആ പ്രവാചകൻ’ എന്നത് മോശെയെപ്പോലെ വരുമെന്ന് പ്രതീക്ഷിക്കപ്പെട്ട പ്രവാചകനെ സൂചിപ്പിക്കുന്നതായിരിക്കാം (ആവർത്തനം 18:15–18).
    reason: cross_reference
  - marker: c
    text: ‘അവൻ ചെയ്ത അടയാളം’ എന്നു വിവർത്തനം ചെയ്തിരിക്കുന്ന ഗ്രീക്ക് വാക്കുകൾ ഈ വിമർശനാത്മക ഗ്രീക്ക് പതിപ്പിൽ ബ്രാക്കറ്റിലാണ് നൽകിയിരിക്കുന്നത്; അതിനാൽ ഈ വാചകഭാഗത്തിന്റെ പാഠസ്ഥിതി അനിശ്ചിതമാണ്.
    reason: textual_uncertainty
lexical_decisions:
- source_word: οἱ οὖν ἄνθρωποι
  choice: അങ്ങനെ, … ജനങ്ങൾ
  rationale: ἄνθρωποι ഇവിടെ പുരുഷന്മാരെ മാത്രം സൂചിപ്പിക്കുന്നില്ല; സംഭവസ്ഥലത്തുണ്ടായിരുന്ന ജനക്കൂട്ടത്തെയാണ് സൂചിപ്പിക്കുന്നത്. οὖν സൂചിപ്പിക്കുന്ന ആഖ്യാനപരമായ നിഗമനവും തുടർച്ചയും ‘അങ്ങനെ’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἰδόντες
  choice: കണ്ടപ്പോൾ
  rationale: കാലത്തിൽ മുൻപുണ്ടായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന aorist participle മലയാളത്തിൽ ‘കണ്ടപ്പോൾ’ എന്നു സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ὃ ἐποίησεν σημεῖον
  choice: അവൻ ചെയ്ത അടയാളം
  rationale: യോഹന്നാനിൽ σημεῖον യേശുവിന്റെ പ്രവൃത്തിയുടെ അത്ഭുതസ്വഭാവത്തോടൊപ്പം അതിന്റെ വെളിപ്പെടുത്തൽപരമായ അർഥവും എടുത്തുകാട്ടുന്നതിനാൽ ‘അടയാളം’ നിലനിർത്തുന്നു.
- source_word: ἔλεγον
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: Imperfect ക്രിയയുടെ തുടർച്ചയുള്ളതോ ആവർത്തിതമോ ആയ ഭാവം ‘പറഞ്ഞുകൊണ്ടിരുന്നു’ സംരക്ഷിക്കുന്നു.
- source_word: ἀληθῶς
  choice: യഥാർഥത്തിൽ
  rationale: ഈ തിരിച്ചറിവിന്റെ ഉറപ്പും സത്യസ്വഭാവവും സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ഭാഷയിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: ὁ προφήτης
  choice: ആ പ്രവാചകൻ
  rationale: നിർദിഷ്ടമായി പ്രതീക്ഷിക്കപ്പെട്ടിരുന്ന വ്യക്തിയെയാണ് ഗ്രീക്കിലെ article സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ‘ആ’ എന്ന നിർദ്ദേശകം ഈ പദവിസ്വഭാവവും നിർദിഷ്ടതയും വ്യക്തമാക്കുന്നു.
- source_word: ὁ ἐρχόμενος εἰς τὸν κόσμον
  choice: ലോകത്തിലേക്കു വരാനിരിക്കുന്ന
  rationale: Articular present participle-ന്റെ വിവരണാത്മക സ്വഭാവം നിലനിർത്തുകയും സമയസൂചനയെ അനാവശ്യമായി കൂടുതൽ നിർണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘ആ പ്രവാചകൻ’ ആരെന്ന തിരിച്ചറിയൽ
  choice: പരിഭാഷയുടെ മുഖ്യപാഠത്തിൽ ‘ആ പ്രവാചകൻ’ എന്നു മാത്രം നൽകുന്നു.
  alternative: ‘മോശെയെപ്പോലെയുള്ള പ്രവാചകൻ’ അല്ലെങ്കിൽ ‘ഒരു പ്രവാചകൻ’
  rationale: ആവർത്തനം 18:15–18-ൽ പ്രതീക്ഷിക്കപ്പെട്ട മോശെയെപ്പോലെയുള്ള പ്രവാചകനെയാണ് ജനക്കൂട്ടം ഉദ്ദേശിച്ചിരിക്കാനിടയുള്ളത്. എന്നാൽ ഗ്രീക്ക് പാഠം പറയുന്നത് ὁ προφήτης എന്നു മാത്രമായതിനാൽ തിരിച്ചറിയൽ മുഖ്യപാഠത്തിൽ വിശദീകരിക്കാതെ അതിന്റെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും സൂചനയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ‘പറഞ്ഞുകൊണ്ടിരുന്നു’ എന്നത് ഗ്രീക്ക് imperfect-ന്റെ ഭാവം നിലനിർത്തുന്നു; ‘ആ പ്രവാചകൻ’ എന്നത് നിർദിഷ്ടമായ പ്രതീക്ഷയെ സൂചിപ്പിക്കുമ്പോഴും വ്യക്തിയെ മുഖ്യപാഠത്തിൽ വ്യാഖ്യാനിച്ച് തീർപ്പാക്കുന്നില്ല.
