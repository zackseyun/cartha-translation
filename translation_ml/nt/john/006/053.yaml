id: JHN.6.53
reference: John 6:53
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν, ἐὰν μὴ φάγητε τὴν σάρκα τοῦ υἱοῦ τοῦ ἀνθρώπου καὶ πίητε αὐτοῦ τὸ αἷμα, οὐκ ἔχετε ζωὴν ἐν ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/053.yaml
  text: So Jesus said to them[a], “Truly, truly, I say to you, unless you eat the flesh of the Son of Man and drink his blood[b], you do not have life in yourselves.”
translation:
  language: ml
  text: 'അതുകൊണ്ട് യേശു അവരോടു പറഞ്ഞു: “സത്യമായി, സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: നിങ്ങൾ മനുഷ്യപുത്രന്റെ മാംസം[a] ഭക്ഷിക്കുകയും അവന്റെ രക്തം കുടിക്കുകയും ചെയ്യുന്നില്ലെങ്കിൽ, നിങ്ങളിൽത്തന്നെ ജീവൻ[b] ഇല്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മാംസം’ എന്നതിന് പകരം ‘ശരീരം’ എന്നും പരിഭാഷപ്പെടുത്താം; എന്നാൽ ഗ്രീക്കിൽ σάρξ (‘മാംസം’) എന്നാണ്. അത് ഈ വാക്കുകളുടെ മൂർത്തമായ ശക്തി നിലനിർത്തുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഈ വാക്യത്തിൽ ‘നിത്യജീവൻ’ എന്നല്ല, ‘ജീവൻ’ എന്നു മാത്രമാണ്; എങ്കിലും യോഹന്നാന്റെ സുവിശേഷത്തിലെ വിശാലസന്ദർഭം ഈ ജീവനെ പലപ്പോഴും നിത്യജീവനുമായി ബന്ധിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യങ്ങളിലെ സംവാദത്തിൽനിന്നുള്ള അനന്തരഫലബന്ധം സൂചിപ്പിക്കുന്നു; ഔപചാരികത അതിരുകടക്കാതെ ഈ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: Ἀμὴν ἀμὴν
  choice: സത്യമായി, സത്യമായി
  rationale: യോഹന്നാനിലെ ഇരട്ടിച്ച ഗൗരവപ്രഖ്യാപനത്തിന്റെ ഊന്നൽ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐὰν μὴ
  choice: ചെയ്യുന്നില്ലെങ്കിൽ
  rationale: നിഷേധാത്മക നിബന്ധന മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ‘unless’ എന്ന അർഥം സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: φάγητε
  choice: ഭക്ഷിക്കുകയും
  rationale: ക്രിയയുടെ ലളിതവും മൂർത്തവുമായ അർഥം നിലനിർത്തുന്നു.
- source_word: σάρκα
  choice: മാംസം
  rationale: σάρξ എന്ന പദത്തിന്റെ മൂർത്തവും മനപ്പൂർവം ഞെട്ടിപ്പിക്കുന്നതുമായ ശക്തി നിലനിർത്തുന്നു; ‘ശരീരം’ എന്നു മൃദൂകരിക്കുന്നില്ല.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രന്റെ
  rationale: യേശുവിന്റെ സ്ഥാപിതമായ സ്വയംവിശേഷണം ഉറവിടത്തോടടുത്തും മലയാളത്തിൽ പരിചിതവുമായ രൂപത്തിൽ നൽകുന്നു.
- source_word: πίητε
  choice: കുടിക്കുകയും
  rationale: πίνω എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥവും ‘ഭക്ഷിക്കുക’ എന്നതിനോടുള്ള സമാന്തരതയും സംരക്ഷിക്കുന്നു.
- source_word: αἷμα
  choice: രക്തം
  rationale: ഉറവിടത്തിലെ ശക്തമായ ദൃശ്യഭാഷയും ദൈവശാസ്ത്രപരമായ ഭാരവും വ്യാഖ്യാനിച്ച് മയപ്പെടുത്താതെ നിലനിർത്തുന്നു.
- source_word: ζωὴν
  choice: ജീവൻ
  rationale: ഗ്രീക്കിൽ αἰώνιον എന്ന വിശേഷണം ഇല്ലാത്തതിനാൽ ‘നിത്യജീവൻ’ എന്ന് വികസിപ്പിക്കാതെ പദത്തിന്റെ നേരിട്ടുള്ള അർഥം നൽകുന്നു.
- source_word: ἐν ἑαυτοῖς
  choice: നിങ്ങളിൽത്തന്നെ
  rationale: പ്രതിഫലന സർവനാമത്തിന്റെ ഊന്നൽ നിലനിർത്തുകയും ജീവൻ അവരുടെ ഉള്ളിൽ ഉണ്ടായിരിക്കുന്നതിനെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: മാംസം ഭക്ഷിക്കുകയും രക്തം കുടിക്കുകയും ചെയ്യുന്നതിനെ കൂദാശാപരമായോ രൂപകപരമായോ മുൻകൂട്ടി വ്യാഖ്യാനിക്കണമോ
  choice: ‘മാംസം ഭക്ഷിക്കുകയും ... രക്തം കുടിക്കുകയും’ എന്ന മൂർത്തമായ ഭാഷ അതേപടി നിലനിർത്തി
  alternative: ‘പങ്കുചേരുക’, ‘സ്വീകരിക്കുക’, അല്ലെങ്കിൽ ‘ശരീരം ഭക്ഷിക്കുക’ എന്ന വ്യാഖ്യാനാത്മക പ്രയോഗം
  rationale: വാക്യത്തിന്റെ മനപ്പൂർവമായ മൂർത്തതയും ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും സംരക്ഷിക്കുന്നു; കൂദാശാപരമോ രൂപകപരമോ ആയ ഒരു പ്രത്യേക സഭാപാരമ്പര്യവായന വിവർത്തനത്തിൽ അടിച്ചേൽപ്പിക്കുന്നില്ല.
- issue: ζωὴν എന്നതിനെ യോഹന്നാന്റെ വിശാലസന്ദർഭമനുസരിച്ച് ‘നിത്യജീവൻ’ എന്ന് വികസിപ്പിക്കണമോ
  choice: പ്രധാന പാഠത്തിൽ ‘ജീവൻ’ എന്നു മാത്രം നൽകി
  alternative: ‘നിത്യജീവൻ’
  rationale: ഈ വാക്യത്തിൽ ‘നിത്യമായ’ എന്ന വിശേഷണം ഇല്ല; വിശാലസന്ദർഭത്തിലെ ആശയം പ്രധാന പാഠത്തിലേക്ക് ചേർക്കാതെ അടിക്കുറിപ്പിൽ മാത്രം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. വാക്യത്തിന്റെ ഗൗരവവും കടുപ്പമുള്ള ദൃശ്യഭാഷയും നിലനിർത്തി; സഭാപാരമ്പര്യവിശേഷമായ പദപ്രയോഗങ്ങളിലൂടെ അതിന്റെ അർഥം മുൻകൂട്ടി തീർപ്പാക്കിയിട്ടില്ല. അടിക്കുറിപ്പുകളുടെ ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന ‘മാംസം’, ‘ജീവൻ’ എന്നീ പദങ്ങളോടു ചേർത്തു.
