id: JHN.6.5
reference: John 6:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐπάρας οὖν ⸂τοὺς ὀφθαλμοὺς ὁ Ἰησοῦς⸃ καὶ θεασάμενος ὅτι πολὺς ὄχλος ἔρχεται πρὸς αὐτὸν λέγει ⸀πρὸς Φίλιππον· Πόθεν ⸀ἀγοράσωμεν ἄρτους ἵνα φάγωσιν οὗτοι;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/005.yaml
  text: So Jesus[a], lifting up his eyes and seeing that a large crowd was coming toward him, said to Philip[c][b], “Where are we to buy bread so that these may eat?”
translation:
  language: ml
  text: 'അപ്പോൾ യേശു കണ്ണുകൾ ഉയർത്തി, വലിയൊരു ജനക്കൂട്ടം തന്റെ അടുത്തേക്കു വരുന്നതു കണ്ട്, ഫിലിപ്പോസിനോടു പറഞ്ഞു: “ഇവർ ഭക്ഷിക്കാനായി നാം എവിടെനിന്ന് അപ്പം വാങ്ങാം?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാനുവാദം: “ഇവർ ഭക്ഷിക്കാനായി നാം എവിടെനിന്ന് അപ്പങ്ങൾ വാങ്ങാം?” ഗ്രീക്കിലെ പദം പൊതുവായ അപ്പത്തെയോ പ്രത്യേകം അപ്പങ്ങളെയോ സൂചിപ്പിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπάρας ... τοὺς ὀφθαλμοὺς
  choice: കണ്ണുകളുയർത്തി
  rationale: കണ്ണുകൾ ഉയർത്തുക എന്ന ഗ്രീക്ക് പ്രയോഗം മലയാളത്തിലും സ്വാഭാവികവും ദൃശ്യവുമായതിനാൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: οὖν
  choice: അപ്പോൾ
  rationale: ഇവിടെ കഥയുടെ തുടർച്ച സൂചിപ്പിക്കുന്ന ബന്ധകമായി പ്രവർത്തിക്കുന്നു; മലയാള വിവരണത്തിൽ ‘അപ്പോൾ’ സ്വാഭാവികമാണ്.
- source_word: θεασάμενος
  choice: കണ്ടിട്ട്
  rationale: ശ്രദ്ധയോടെയുള്ള കാഴ്ചയെ സൂചിപ്പിക്കുകയും തുടർന്നുള്ള പ്രധാനക്രിയയുമായുള്ള പങ്കാളിക്രിയാസംബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: πολὺς ὄχλος
  choice: വലിയൊരു ജനക്കൂട്ടം
  rationale: ജനങ്ങളുടെ എണ്ണപ്പെരുപ്പമാണ് സന്ദർഭത്തിലെ അർഥം; സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമാണ്.
- source_word: ἔρχεται πρὸς αὐτόν
  choice: തന്റെ അടുത്തേക്കു വരുന്നതു
  rationale: πρός എന്നതിന്റെ ദിശാസൂചന ‘അടുത്തേക്ക്’ വഴി നിലനിർത്തുന്നു; കഥാസന്ദർഭത്തിനു യോജിച്ച പുരോഗമനഭാവവും നൽകുന്നു.
- source_word: λέγει πρὸς Φίλιππον
  choice: ഫിലിപ്പോസിനോടു പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനത്തെ സ്വാഭാവിക മലയാള വിവരണത്തിനായി ഭൂതകാലത്തിൽ നൽകുന്നു; അഭിസംബോധിതനെയും വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: Πόθεν ἀγοράσωμεν
  choice: നാം എവിടെനിന്ന് ... വാങ്ങും?
  rationale: Πόθεν എന്നതിലെ ഉറവിടാർഥം ‘എവിടെനിന്ന്’ കൊണ്ട് സംരക്ഷിക്കുന്നു. ചർച്ചാത്മകമായ ഒന്നാംപുരുഷ ബഹുവചനത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘വാങ്ങും?’ എന്നു നൽകുന്നു.
- source_word: ἄρτους
  choice: അപ്പം
  rationale: ἄρτος ഭക്ഷണമെന്ന നിലയിലെ അപ്പത്തെയോ പ്രത്യേകം അപ്പങ്ങളെയോ സൂചിപ്പിക്കാം; ഈ സന്ദർഭത്തിൽ മലയാളത്തിലെ ഏകവചന ദ്രവ്യനാമമായ ‘അപ്പം’ സ്വാഭാവികമാണ്.
- source_word: ἵνα φάγωσιν οὗτοι
  choice: ഇവർക്കു ഭക്ഷിക്കാൻ
  rationale: ഉദ്ദേശ്യബന്ധവും സമീപത്തുള്ള ആളുകളെ ചൂണ്ടിക്കാണിക്കുന്ന οὗτοι എന്നതിന്റെ ശക്തിയും ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ചരിത്രവർത്തമാനവും പങ്കാളിക്രിയകളും വിവരണത്തിൽ അവതരിപ്പിക്കൽ
  choice: λέγει എന്ന ചരിത്രവർത്തമാനം ‘പറഞ്ഞു’ എന്ന ഭൂതകാലത്തിൽ നൽകി; മുൻപ്രവൃത്തികൾ ‘കണ്ണുകളുയർത്തി ... കണ്ടിട്ട്’ എന്ന ക്രമത്തിൽ നിലനിർത്തി.
  alternative: ‘പറയുന്നു’ എന്ന ചരിത്രവർത്തമാനം അതേപടി നിലനിർത്തുക.
  rationale: ഇത് ദൈവശാസ്ത്രപരമായ വ്യാഖ്യാനമല്ല, വിവരണശൈലിയിലെ തീരുമാനം മാത്രമാണ്. ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക കഥനരീതിയും ഗ്രീക്ക് ക്രിയാക്രമവും ഒരുപോലെ സംരക്ഷിക്കുന്നു.
- issue: ἀγοράσωμεν എന്ന ആലോചനാത്മക സബ്ജങ്ക്റ്റീവിന്റെ അവതരണം
  choice: ‘നാം ... വാങ്ങും?’
  alternative: ‘നാം ... വാങ്ങേണ്ടത്?’ അല്ലെങ്കിൽ ‘നാം ... വാങ്ങാം?’
  rationale: യേശുവിന്റെ ചോദ്യം പദ്ധതിയെയോ ലഭ്യതയെയോ കുറിച്ചുള്ളതെന്ന തുറന്ന സ്വഭാവം നിലനിർത്തുന്നു; നിർബന്ധമോ അനുമതിയോ അനാവശ്യമായി ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ കഥനശൈലി. ‘തന്റെ’ എന്ന പ്രത്യയം യേശുവിനെയാണ് സൂചിപ്പിക്കുന്നത്. മുഖ്യവാക്യത്തിലെ [a] അടിക്കുറിപ്പ് ഗ്രീക്കിലെ ‘എവിടെനിന്ന്,’ ബഹുവചനമായ ‘അപ്പങ്ങൾ,’ ഉദ്ദേശ്യഘടന എന്നിവ വ്യക്തമാക്കുന്നു.
