- from: 'അപ്പോൾ യേശു കണ്ണുകളുയർത്തി, വലിയൊരു ജനക്കൂട്ടം തന്റെ അടുത്തേക്കു വരുന്നതു കണ്ടിട്ട് ഫിലിപ്പോസിനോടു പറഞ്ഞു: “ഇവർക്കു ഭക്ഷിക്കാൻ നാം എവിടെനിന്ന് അപ്പം വാങ്ങും?[a]”'
  to: 'അപ്പോൾ യേശു കണ്ണുകൾ ഉയർത്തി, വലിയൊരു ജനക്കൂട്ടം തന്റെ അടുത്തേക്കു വരുന്നതു കണ്ട്, ഫിലിപ്പോസിനോടു പറഞ്ഞു: “ഇവർ ഭക്ഷിക്കാനായി നാം എവിടെനിന്ന് അപ്പം വാങ്ങാം?[a]”'
