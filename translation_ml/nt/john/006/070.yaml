id: JHN.6.70
reference: John 6:70
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Οὐκ ἐγὼ ὑμᾶς τοὺς δώδεκα ἐξελεξάμην; καὶ ἐξ ὑμῶν εἷς διάβολός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/070.yaml
  text: Jesus answered them[a], “Did I not choose you, the Twelve? Yet one of you is a devil.”
translation:
  language: ml
  text: 'യേശു അവരോടു മറുപടി പറഞ്ഞു: “നിങ്ങൾ പന്ത്രണ്ടുപേരെയും തിരഞ്ഞെടുത്തത് ഞാനല്ലേ? എന്നിട്ടും നിങ്ങളിൽ ഒരാൾ ഒരു പിശാചാണ്[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഒരു അപവാദിയാണ്.” ഗ്രീക്ക് പദത്തിന് വ്യാജമായി കുറ്റം ചുമത്തുന്നവൻ എന്നർഥം വരാം; പല സന്ദർഭങ്ങളിലും അത് പിശാചിനെ സൂചിപ്പിക്കുന്നു. ഇവിടെ പ്രയോഗം സാത്താനുമായുള്ള നേരിട്ടുള്ള തിരിച്ചറിയലിനെക്കാൾ ഗുണസ്വഭാവം വ്യക്തമാക്കുന്നതാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς
  choice: അവരോടു മറുപടി പറഞ്ഞു
  rationale: യോഹന്നാനിലെ സംഭാഷണസന്ദർഭത്തിൽ പ്രതികരണത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: Οὐκ ἐγὼ ὑμᾶς τοὺς δώδεκα ἐξελεξάμην;
  choice: നിങ്ങൾ പന്ത്രണ്ടുപേരെയും തിരഞ്ഞെടുത്തത് ഞാനല്ലേ?
  rationale: οὐκ ചേർന്ന ചോദ്യം അനുകൂലമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന വാചകശക്തി ‘ഞാനല്ലേ?’ എന്ന പ്രയോഗം നിലനിർത്തുന്നു; ‘പന്ത്രണ്ടുപേരെയും’ അംഗീകൃത സംഘത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: καὶ
  choice: എന്നിട്ടും
  rationale: ഔപചാരികമായി ‘കൂടാതെ/ഉം’ എന്നർഥമുണ്ടെങ്കിലും ഇവിടെ യേശു പന്ത്രണ്ടുപേരെ തിരഞ്ഞെടുത്തതും അവരിൽ ഒരാളുടെ വിരുദ്ധസ്വഭാവവും തമ്മിലുള്ള വൈരുധ്യം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: ἐξ ὑμῶν εἷς
  choice: നിങ്ങളിൽ ഒരാൾ
  rationale: ഭാഗികബന്ധം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ കൃത്യവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: διάβολός
  choice: ഒരു പിശാച്
  rationale: ആർട്ടിക്കിൾ ഇല്ലാത്ത വിധേയനാമത്തിന്റെ ഗുണവാചകശക്തിയും പ്രസ്താവനയുടെ തീക്ഷ്ണതയും നിലനിർത്തുന്നു; ‘സാത്താൻ തന്നെയാണ്’ എന്ന നേരിട്ടുള്ള തിരിച്ചറിയൽ അനാവശ്യമായി ചുമത്തുന്നില്ല.
theological_decisions:
- issue: διάβολός എന്നത് സാത്താനുമായുള്ള നേരിട്ടുള്ള തിരിച്ചറിയലാണോ, ഗുണവാചകമായ വിശേഷണമാണോ
  choice: ഒരു പിശാചാണ്
  alternative: അപവാദിയാണ് / പിശാചുതന്നെയാണ്
  rationale: ഗ്രീക്കിൽ പദത്തിന് ആർട്ടിക്കിൾ ഇല്ലാത്തതിനാൽ പ്രസ്താവന പ്രധാനമായും ഗുണവാചകമാണ്. ‘ഒരു പിശാച്’ എന്നത് വാക്കിന്റെ ശക്തി നിലനിർത്തുകയും ആ വ്യക്തിയെ സാത്താനുമായി പൂർണമായി സമീകരിക്കാതിരിക്കുകയും ചെയ്യുന്നു; ‘അപവാദി’ എന്നത് സാധ്യമായ നിഘണ്ടുവർത്ഥമാണെങ്കിലും സന്ദർഭത്തിലെ ദൈവശാസ്ത്രപരവും വാചാടോപപരവുമായ തീക്ഷ്ണത കുറയ്ക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സംഭാഷണശൈലി. ‘നിങ്ങൾ പന്ത്രണ്ടുപേരെയും’ എന്ന രൂപം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; ‘ഒരു പിശാച്’ മൂലവാക്യത്തിന്റെ ഞെട്ടിക്കുന്ന ശക്തിയും അർഥതുറപ്പും നിലനിർത്തുന്നു.
