  yaml_path: translation/nt/john/006/059.yaml
  text: He said these things while teaching in the synagogue in Capernaum.
translation:
  language: ml
  text: കഫർന്നഹൂമിലെ സിനഗോഗിൽ പഠിപ്പിച്ചുകൊണ്ടിരിക്കെ അവൻ ഈ കാര്യങ്ങൾ പറഞ്ഞു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: ഈ കാര്യങ്ങൾ
  rationale: നപുംസകലിംഗ ബഹുവചനമായ സൂചകസർവനാമം മുമ്പുള്ള പ്രഭാഷണത്തിലെ വാക്കുകളെയും ആശയങ്ങളെയും ഒന്നാകെ സൂചിപ്പിക്കുന്നു; ബഹുവചനഭാവം നിലനിർത്തുന്നു.
- source_word: εἶπεν
  choice: അവൻ ... പറഞ്ഞത്
  rationale: λέγω എന്ന ക്രിയയുടെ aorist രൂപത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘പറഞ്ഞു’ എന്നാണ്. ഗ്രീക്കിൽ കർത്താവ് പരോക്ഷമായതിനാൽ, സന്ദർഭത്തിൽ യേശുവിനെ സൂചിപ്പിക്കുന്ന ‘അവൻ’ ഉപയോഗിച്ചു.
- source_word: ἐν συναγωγῇ
  choice: സിനഗോഗിൽ
  rationale: യഹൂദരുടെ ആരാധനാ-പഠനസമ്മേളനസ്ഥലത്തെ സൂചിപ്പിക്കുന്ന συναγωγή എന്ന പദം പരിചിതമായ വായ്പാപദമായ ‘സിനഗോഗ്’ എന്നു നൽകി. ഗ്രീക്കിൽ നിർദേശക ഉപപദമില്ലാത്തതിനാൽ മലയാളത്തിൽ അനാവശ്യമായി നിശ്ചിതത്വം കൂട്ടിയിട്ടില്ല.
- source_word: διδάσκων
  choice: പഠിപ്പിക്കുമ്പോൾ
  rationale: വർത്തമാനകാല കൃദന്തരൂപം മുഖ്യക്രിയയോടൊപ്പം നടന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ കാലസമകാലിക ഘടന ഉപയോഗിച്ചു.
- source_word: ἐν Καφαρναούμ
  choice: കഫർന്നഹൂമിലെ
  rationale: സ്ഥലനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള രൂപത്തിൽ ലിപ്യന്തരിച്ചു; സിനഗോഗിന്റെ സ്ഥാനം സ്വാഭാവികമായി വിശേഷണഘടനയിൽ അറിയിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിലെ വിവരക്രമം മലയാളത്തിന്റെ സ്വാഭാവിക വാക്യഘടനയ്ക്കനുസരിച്ച് ക്രമപ്പെടുത്തി; അർഥപരമായ ചേർക്കലുകളില്ല.
