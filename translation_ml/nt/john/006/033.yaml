id: JHN.6.33
reference: John 6:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ γὰρ ἄρτος τοῦ θεοῦ ἐστιν ὁ καταβαίνων ἐκ τοῦ οὐρανοῦ καὶ ζωὴν διδοὺς τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/033.yaml
  text: For the bread of God is the one who comes down from heaven and gives life to the world[a].
translation:
  language: ml
  text: കാരണം, ദൈവത്തിന്റെ അപ്പം സ്വർഗത്തിൽനിന്ന് ഇറങ്ങിവരുകയും ലോകത്തിന് ജീവൻ നൽകുകയും ചെയ്യുന്നവനാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘സ്വർഗത്തിൽനിന്ന് ഇറങ്ങിവരുകയും ലോകത്തിന് ജീവൻ നൽകുകയും ചെയ്യുന്നതാണ്.’ ഗ്രീക്ക് വാക്യഘടനയെ അവ്യക്തിപരമായി ഗ്രഹിക്കാനാകുമെങ്കിലും, പുരുഷലിംഗത്തിലുള്ള കൃദന്തരൂപങ്ങൾ ഒരു വ്യക്തിയെ സൂചിപ്പിക്കുന്ന വായനയ്ക്ക് കൂടുതൽ പിന്തുണ നൽകുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄρτος
  choice: അപ്പം
  rationale: ആശയത്തെ പൊതുവായി ‘ഭക്ഷണം’ എന്നു മാറ്റാതെ, ഈ പ്രഭാഷണത്തിലെ മൂർത്തമായ അപ്പത്തിന്റെ രൂപകം നിലനിർത്തുന്നു.
- source_word: τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ
  rationale: ഉറവിടമോ ഉടമസ്ഥതയോ എന്ന ജനിറ്റീവിന്റെ സാധ്യതകൾ അനാവശ്യമായി തീർപ്പാക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ ഗ്രീക്ക് ഘടന സംരക്ഷിക്കുന്നു.
- source_word: ὁ καταβαίνων
  choice: ഇറങ്ങിവരുന്നവൻ
  rationale: പുരുഷലിംഗ ഏകവചന ആർട്ടിക്കുലാർ വർത്തമാന കൃദന്തത്തിന്റെ വ്യക്തിപരമായ സൂചനയും തുടർച്ചയായ പ്രവൃത്തിയുടെ ഭാവവും നിലനിർത്തുന്നു.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: സ്വർഗത്തിൽനിന്ന്
  rationale: ഉറവിടത്തെ സൂചിപ്പിക്കുന്ന ἐκ എന്നതിന്റെ സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: ζωὴν
  choice: ജീവൻ
  rationale: യോഹന്നാനിലെ കേന്ദ്രപദത്തിന്റെ ലളിതവും ഗൗരവമുള്ളതുമായ രൂപം നിലനിർത്തുന്നു.
- source_word: διδοὺς
  choice: ജീവൻ നൽകുന്ന
  rationale: ആദ്യ കൃദന്തത്തോടു ചേർന്ന സവിശേഷ പ്രവർത്തനമായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: τῷ κόσμῳ
  choice: ലോകത്തിന്
  rationale: ‘മനുഷ്യർ’ എന്നാക്കി വ്യാപ്തി ചുരുക്കാതെ യോഹന്നാനിലെ κόσμος എന്ന പദത്തിന്റെ വിശാലത സംരക്ഷിക്കുന്നു.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തെ വിശദീകരിച്ചു പിന്തുണയ്ക്കുന്ന ബന്ധം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി കാണിക്കുന്നു.
theological_decisions:
- issue: ‘ദൈവത്തിന്റെ അപ്പം ... ὁ καταβαίνων ... καὶ ζωὴν διδοὺς’ എന്നതിലെ വ്യക്തിപരമോ അവ്യക്തിപരമോ ആയ സൂചന
  choice: ‘സ്വർഗത്തിൽനിന്ന് ഇറങ്ങിവന്ന് ലോകത്തിന് ജീവൻ നൽകുന്നവൻ’ എന്ന വ്യക്തിപരമായ ഭാഷ ഉപയോഗിച്ചു.
  alternative: ‘സ്വർഗത്തിൽനിന്ന് ഇറങ്ങിവന്ന് ലോകത്തിന് ജീവൻ നൽകുന്നതാണ്’
  rationale: ഗ്രീക്കിലെ കൃദന്തങ്ങൾ പുരുഷലിംഗ ഏകവചനത്തിലാണ്; അതിനാൽ അവ സ്വാഭാവികമായി ഒരു വ്യക്തിയെ സൂചിപ്പിക്കുകയും യേശുവിന്റെ തുടർന്നുള്ള സ്വയംവെളിപ്പെടുത്തലിന് വഴിയൊരുക്കുകയും ചെയ്യുന്നു. അതേസമയം മറ്റൊരു വ്യാകരണഗ്രഹണം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: κόσμος എന്നതിന്റെ വ്യാപ്തി
  choice: ‘ലോകം’ നിലനിർത്തി.
  alternative: ‘മനുഷ്യവർഗം’ അല്ലെങ്കിൽ ‘എല്ലാ മനുഷ്യരും’
  rationale: ജീവൻ നൽകുന്ന ദൗത്യത്തിന്റെ വ്യാപ്തിയെക്കുറിച്ചുള്ള പിന്നീടുള്ള ദൈവശാസ്ത്രവാദങ്ങൾ ഇവിടെ തീർപ്പാക്കാതെ മൂലപദത്തിന്റെ വിശാലതയും സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അപ്പം’, ‘ജീവൻ’, ‘ലോകം’ എന്നീ യോഹന്നാനീയ കേന്ദ്രപദങ്ങൾ ലളിതമായി നിലനിർത്തി; വാക്യാവസാനത്തിലെ ‘ആണ്’ വ്യക്തിപരമായ തിരിച്ചറിവ് വ്യക്തമാക്കുന്നു.
