id: JHN.6.26
reference: John 6:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς καὶ εἶπεν· Ἀμὴν ἀμὴν λέγω ὑμῖν, ζητεῖτέ με οὐχ ὅτι εἴδετε σημεῖα ἀλλ’ ὅτι ἐφάγετε ἐκ τῶν ἄρτων καὶ ἐχορτάσθητε·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/026.yaml
  text: Jesus answered them[a], “Truly, truly, I say to you, you are seeking me not because you saw signs, but because you ate of the loaves and were filled.
translation:
  language: ml
  text: 'യേശു അവരോട് ഉത്തരം പറഞ്ഞു: “സത്യം സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: നിങ്ങൾ എന്നെ അന്വേഷിക്കുന്നത് അടയാളങ്ങൾ കണ്ടതുകൊണ്ടല്ല, അപ്പങ്ങളിൽനിന്ന് തിന്നു തൃപ്തരായതുകൊണ്ടാണ്.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അപ്പങ്ങളിൽനിന്ന് തിന്നു തൃപ്തരായി’ എന്നതിന് പകരം ‘അപ്പം തിന്നു വയറുനിറഞ്ഞു’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘അപ്പങ്ങളിൽനിന്ന്’ എന്നാണ്; അവസാന ക്രിയയ്ക്ക് ‘നിറഞ്ഞു’ അല്ലെങ്കിൽ ‘തൃപ്തരായി’ എന്നർഥമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς καὶ εἶπεν
  choice: യേശു അവരോട് ഉത്തരം പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ‘ഉത്തരം നൽകി, പറഞ്ഞു’ എന്ന ഇരട്ട സംഭാഷണാവതരണം മലയാളത്തിൽ സ്വാഭാവികമായി സംക്ഷിപ്തമാക്കുന്നു; മറുപടിയുടെയും തുടർന്നുള്ള നേരിട്ടുള്ള വാക്കുകളുടെയും അർഥം നിലനിർത്തുന്നു.
- source_word: Ἀμὴν ἀμὴν λέγω ὑμῖν
  choice: സത്യം സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: യോഹന്നാനിലെ സവിശേഷമായ ഇരട്ട ἀμήν-ന്റെ ഊന്നലും ഗൗരവവും സുതാര്യമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ζητεῖτέ με
  choice: നിങ്ങൾ എന്നെ അന്വേഷിക്കുന്നത്
  rationale: വർത്തമാനകാലത്തിലെ തുടരുന്ന പ്രവൃത്തിയെ സന്ദർഭോചിതമായി സൂചിപ്പിക്കുന്നു; ‘അന്വേഷിക്കുക’ എന്നത് യോഹന്നാനിലെ ആവർത്തിക്കുന്ന ആശയബന്ധവും നിലനിർത്തുന്നു.
- source_word: οὐχ ὅτι ... ἀλλ’ ὅτι
  choice: …കൊണ്ടല്ല, …കൊണ്ടാണ്
  rationale: അവരുടെ അന്വേഷണത്തിന്റെ വിരുദ്ധ കാരണങ്ങളെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: εἴδετε σημεῖα
  choice: അടയാളങ്ങൾ കണ്ടതുകൊണ്ട്
  rationale: εἴδετε-യെ അതിവ്യാഖ്യാനമില്ലാതെ ‘കണ്ടു’ എന്നും σημεῖα-യെ യോഹന്നാനിലെ വെളിപ്പെടുത്തൽസൂചനയുള്ള ‘അടയാളങ്ങൾ’ എന്നും നൽകുന്നു.
- source_word: ἐφάγετε ἐκ τῶν ἄρτων
  choice: അപ്പങ്ങളിൽനിന്ന് തിന്നു
  rationale: ἄρτων എന്ന ബഹുവചനവും ἐκ എന്ന ഭാഗികതാസൂചനയും കഴിയുന്നത്ര നിലനിർത്തുന്നു; ഇത് മുമ്പ് വർധിപ്പിക്കപ്പെട്ട അപ്പങ്ങളിലേക്കാണ് വിരൽചൂണ്ടുന്നത്.
- source_word: ἐχορτάσθητε
  choice: തൃപ്തരായതുകൊണ്ടാണ്
  rationale: ഭക്ഷിച്ച് നിറഞ്ഞു തൃപ്തിയായ അവസ്ഥയെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘വയറുനിറഞ്ഞു’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക പ്രയോഗം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: യോഹന്നാന്റെ സന്ദർഭത്തിൽ σημεῖα എന്ന പദത്തിന്റെ അർഥം
  choice: അടയാളങ്ങൾ
  alternative: അത്ഭുതങ്ങൾ; അത്ഭുത അടയാളങ്ങൾ
  rationale: യേശുവിന്റെ പ്രവൃത്തികൾ അവയ്ക്കപ്പുറമുള്ള യാഥാർഥ്യത്തിലേക്കു വിരൽചൂണ്ടുന്ന വെളിപ്പെടുത്തൽപ്രവൃത്തികളാണെന്ന യോഹന്നാന്റെ പദപ്രയോഗം ‘അടയാളങ്ങൾ’ സംരക്ഷിക്കുന്നു; വിശദീകരണവിശേഷണം മുഖ്യവാക്യത്തിൽ ചേർക്കുന്നില്ല.
- issue: οὐχ ὅτι ... ἀλλ’ ὅτι എന്ന വിരുദ്ധഘടനയുടെ വ്യാപ്തി
  choice: ജനത്തിന്റെ അന്വേഷണത്തിന് യേശു ചൂണ്ടിക്കാണിക്കുന്ന യഥാർഥ പ്രേരണയായി അവതരിപ്പിച്ചു
  alternative: അവർ അടയാളങ്ങൾ ഒട്ടും കണ്ടില്ലെന്ന നിഷേധമായി വായിക്കുക
  rationale: വാക്യഘടന കാഴ്ചയുടെ സംഭവത്തെക്കാൾ അന്വേഷണത്തിന്റെ കാരണത്തെ വിരുദ്ധമായി നിരത്തുന്നു; ‘കണ്ടതുകൊണ്ടല്ല … തൃപ്തരായതുകൊണ്ടാണ്’ എന്ന വിവർത്തനം ഈ സംഘർഷം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. യോഹന്നാന്റെ സവിശേഷ പദമായ ‘അടയാളങ്ങൾ’യും ഇരട്ട സത്യപ്രഖ്യാപനത്തിന്റെ ഊന്നലും നിലനിർത്തി; അസ്വാഭാവികമായ പദാനുപദരൂപം ആവശ്യമായിടത്ത് സ്വാഭാവിക വാക്യഘടനയാക്കി.
