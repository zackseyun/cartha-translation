source:
  edition: SBLGNT
  text: Ἐγόγγυζον οὖν οἱ Ἰουδαῖοι περὶ αὐτοῦ ὅτι εἶπεν· Ἐγώ εἰμι ὁ ἄρτος ὁ καταβὰς ἐκ τοῦ οὐρανοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/041.yaml
  text: So the Jews were grumbling about him because he said[a], “I am the bread that came down from heaven.”
translation:
  language: ml
  text: അവൻ, “ഞാനാണ് സ്വർഗത്തിൽനിന്ന് ഇറങ്ങിവന്ന അപ്പം,” എന്ന് പറഞ്ഞതുകൊണ്ട് യെഹൂദന്മാർ[a] അവനെക്കുറിച്ച് പിറുപിറുത്തുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “യെഹൂദ്യർ”; ചില സന്ദർഭങ്ങളിൽ “യെഹൂദനേതാക്കൾ.” യോഹന്നാൻ ഉപയോഗിക്കുന്ന “യെഹൂദന്മാർ” എന്ന പ്രയോഗം യെഹൂദജനതയെ മുഴുവനായി സൂചിപ്പിക്കണമെന്നില്ല; യേശുവിനെ എതിർത്ത ഒരു പ്രത്യേക സംഘത്തെ അത് സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγόγγυζον
  choice: പിറുപിറുത്തുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം കഴിഞ്ഞകാലത്തെ തുടർന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. γογγύζω എന്നതിലെ അടക്കിപ്പിടിച്ച പരാതിയുടെ ഭാവവും മരുഭൂമിയിലെ പിറുപിറുപ്പിന്റെ പ്രതിധ്വനിയും ഈ പ്രയോഗം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യവുമായി ഉള്ള നിഗമനാത്മകമായ കഥാതുടർച്ച വ്യക്തമാക്കുന്നു; ഇവിടെ വെറും കാലക്രമസൂചനയായ ‘അപ്പോൾ’ എന്നതിനെക്കാൾ കാരണബന്ധം പ്രസക്തമാണ്.
- source_word: οἱ Ἰουδαῖοι
  choice: യെഹൂദന്മാർ
  rationale: ഗ്രീക്കിലെ യോഹന്നാനീയ പ്രയോഗത്തെ നേരിട്ട് നിലനിർത്തുന്നു. ഈ വാക്യം നേതാക്കളെന്നോ യെഹൂദ്യദേശക്കാരെന്നോ പരാമർശത്തെ വ്യക്തമായി പരിമിതപ്പെടുത്തുന്നില്ല; എന്നാൽ എല്ലാവരായ യെഹൂദജനത്തെയും ഉദ്ദേശിക്കുന്നതായി തെറ്റിദ്ധരിക്കാതിരിക്കാൻ അടിക്കുറിപ്പ് ചേർക്കുന്നു.
- source_word: περὶ αὐτοῦ
  choice: അവനെക്കുറിച്ച്
  rationale: περί + ഷഷ്ഠി വിഭക്തിയുടെ സാധാരണ അർഥമായ ‘അവനെ സംബന്ധിച്ച്’ എന്നത് സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘അവനെതിരെ’ എന്നു വിവർത്തനം ചെയ്യുന്നത് മൂലപദത്തേക്കാൾ വൈരഭാവം കൂട്ടിച്ചേർക്കും.
- source_word: ὅτι
  choice: എന്ന് അവൻ പറഞ്ഞതിനാൽ
  rationale: ഇവിടെ ὅτι പിറുപിറുപ്പിന്റെ കാരണം അവതരിപ്പിക്കുന്നു. മലയാളത്തിലെ ഈ ഘടന ഉദ്ധരണിയെയും കാരണബന്ധത്തെയും ഒരുമിച്ച് വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: Ἐγώ εἰμι
  choice: ഞാനാകുന്നു
  rationale: ഊന്നലുള്ള ഒന്നാംപുരുഷ സ്വയംതിരിച്ചറിയൽ നിലനിർത്തുന്നു. പ്രസ്താവനയ്ക്ക് മൂലത്തിൽ ഇല്ലാത്ത വ്യാഖ്യാനവികാസം ചേർക്കുന്നില്ല.
- source_word: ὁ ἄρτος
  choice: അപ്പം
  rationale: ആ കാലഘട്ടത്തിലെ പൊതുവായ ആഹാരമായ bread-നെ സൂചിപ്പിക്കാൻ മലയാള ബൈബിൾ-സാഹിത്യത്തിൽ പരിചിതവും ഇന്നും മനസ്സിലാകുന്നതുമായ പദം. നിർദ്ദിഷ്ടത ‘ഞാനാകുന്നു’ എന്ന തിരിച്ചറിയൽഘടനയിൽ സ്വാഭാവികമായി വ്യക്തമാകുന്നു.
- source_word: ὁ καταβὰς ἐκ τοῦ οὐρανοῦ
  choice: സ്വർഗത്തിൽനിന്ന് ഇറങ്ങിവന്ന
  rationale: ആർട്ടിക്കിളോടുകൂടിയ അയോറിസ്റ്റ് കൃദന്തരൂപത്തെ അപ്പത്തെ വിശേഷിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപത്തിൽ നൽകുന്നു; ἐκ സൂചിപ്പിക്കുന്ന ഉറവിടവും പൂർത്തിയായ ഇറങ്ങിവരവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: യോഹന്നാനിൽ οἱ Ἰουδαῖοι എന്നതിന്റെ പരാമർശപരിധി
  choice: മുഖ്യപാഠത്തിൽ ‘യെഹൂദന്മാർ’ എന്ന് വിവർത്തനം ചെയ്തു
  alternative: ‘യെഹൂദ്യർ’ അല്ലെങ്കിൽ ചില സന്ദർഭങ്ങളിൽ ‘യെഹൂദനേതാക്കൾ’
  rationale: ഈ വാക്യം പരാമർശത്തെ നേതാക്കളിലേക്കോ ഭൂമിശാസ്ത്രപരമായ യെഹൂദ്യരിലേക്കോ വ്യക്തമായി ചുരുക്കുന്നില്ല. അതിനാൽ ഗ്രീക്ക് രൂപം നേരിട്ട് നിലനിർത്തുന്നു; അതേസമയം യോഹന്നാനിലെ സന്ദർഭത്തിൽ ഇത് യേശുവിനെ എതിർക്കുന്ന ഒരു പ്രത്യേക യെഹൂദസംഘത്തെ സൂചിപ്പിക്കാമെന്നും എല്ലാ യെഹൂദരെയും പൊതുവായി കുറ്റപ്പെടുത്തുന്നില്ലെന്നും അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള മലയാളം. ‘പിറുപിറുത്തുകൊണ്ടിരുന്നു’ എന്നത് അപൂർണ ഭൂതകാലത്തിന്റെ തുടർച്ചാഭാവം നിലനിർത്തുന്നു. ഉദ്ധരണി ആദ്യം വയ്ക്കുന്നത് മലയാളത്തിലെ കാരണവാക്യഘടനയെ സ്വാഭാവികമാക്കുന്നു. ‘യെഹൂദന്മാർ’ എന്ന നേരിട്ടുള്ള വിവർത്തനത്തോടൊപ്പം നിർബന്ധമായ വ്യാഖ്യാനസൂക്ഷ്മത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
