reference: John 6:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἤθελον οὖν λαβεῖν αὐτὸν εἰς τὸ πλοῖον, καὶ εὐθέως ⸂ἐγένετο τὸ πλοῖον⸃ ἐπὶ τῆς γῆς εἰς ἣν ὑπῆγον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/021.yaml
  text: So they were willing to take him into the boat[a], and immediately the boat was at the land to which they were going.
translation:
  language: ml
  text: അതിനാൽ, അവനെ വള്ളത്തിൽ കയറ്റാൻ അവർ തയ്യാറായിരുന്നു; ഉടനെ വള്ളം അവർ പോയിക്കൊണ്ടിരുന്ന കരയിലെത്തി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഉടനെ വള്ളം അവർ പോയിക്കൊണ്ടിരുന്ന ദേശത്തെത്തി.’
    reason: γῆ ഇവിടെ യാത്രയുടെ ലക്ഷ്യമായ കരയെയോ ദേശഭാഗത്തെയോ സൂചിപ്പിക്കാം. മുഖ്യവാചകത്തിലെ ‘കര’ സന്ദർഭോചിതമായ വിവർത്തനമാണ്; ‘ദേശം’ കൂടുതൽ വിശാലമായ പദപരമായ സാധ്യത നിലനിർത്തുന്നു.
lexical_decisions:
- source_word: ἤθελον
  choice: മനസ്സായി
  rationale: അപൂർണഭൂതകാലരൂപം ഇവിടെ വെറും ആഗ്രഹത്തേക്കാൾ സന്നദ്ധതയെയോ മനോഭാവത്തെയോ സൂചിപ്പിക്കുന്നു. ഭയം മാറിയതിനു ശേഷമുള്ള വിവരണഗതിയിൽ ‘മനസ്സായി’ സ്വാഭാവികമാണ്.
- source_word: οὖν
  choice: അതിനാൽ
  rationale: മുൻസന്ദർഭത്തിൽനിന്നുള്ള പരിണതഫലബന്ധം വ്യക്തമാക്കുന്നു; ആധുനിക മലയാളത്തിൽ മാന്യവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: λαβεῖν αὐτὸν εἰς τὸ πλοῖον
  choice: അവനെ വള്ളത്തിൽ കയറ്റാൻ
  rationale: യേശുവിനെ വള്ളത്തിനകത്തേക്ക് സ്വീകരിക്കുന്ന ഭൗതികപ്രവർത്തനം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: πλοῖον
  choice: വള്ളം
  rationale: ഗലീലക്കടലിലെ ഈ സാഹചര്യത്തിൽ ‘കപ്പൽ’ എന്നതിനെക്കാൾ യോജിച്ച സാധാരണ മലയാളപദം.
- source_word: εὐθέως
  choice: ഉടനെ
  rationale: സംഭവത്തിന്റെ പെട്ടെന്നുള്ള സ്വഭാവവും സാധ്യതയുള്ള അത്ഭുതസൂചനയും നിലനിർത്തുന്നു.
- source_word: ἐγένετο τὸ πλοῖον ἐπὶ τῆς γῆς
  choice: വള്ളം ... കരയിൽ എത്തി
  rationale: സ്ഥലസൂചകപ്രയോഗത്തോടുകൂടിയ γίνομαι ലക്ഷ്യസ്ഥാനത്ത് എത്തിച്ചേരുന്നതിനെ സൂചിപ്പിക്കാം. ‘കരയിൽ എത്തി’ മലയാളത്തിൽ സ്വാഭാവികമാണ്; വള്ളം കരയ്ക്കുമുകളിൽ കയറിയെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: γῆς
  choice: കര
  rationale: ഇവിടെ യാത്രയുടെ ലക്ഷ്യമായ കരയെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ഭൂമി’ എന്ന അക്ഷരാർഥത്തേക്കാൾ സന്ദർഭോചിതം.
- source_word: εἰς ἣν ὑπῆγον
  choice: അവർ പോയിക്കൊണ്ടിരുന്ന
  rationale: യാത്ര തുടർന്നുകൊണ്ടിരുന്നുവെന്ന അപൂർണഭൂതകാലഭാവം സംരക്ഷിക്കുകയും ലക്ഷ്യമായ കരയുമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: രണ്ടാം ഉപവാക്യത്തിലെ അത്ഭുതസൂചനയുള്ള പെട്ടെന്നുള്ള സംഭവത്തെ വിശദീകരിക്കുകയോ മയപ്പെടുത്തുകയോ ചെയ്യണമോ
  choice: ‘ഉടനെ’ എന്നത് നിലനിർത്തി വള്ളം കരയിൽ എത്തിയെന്ന് നേരിട്ട് വിവർത്തനം ചെയ്തു.
  alternative: ‘അധികം വൈകാതെ വള്ളം കരയിലെത്തി’ എന്നിങ്ങനെ പെട്ടെന്നുള്ള സ്വഭാവം മയപ്പെടുത്തുക.
  rationale: ഗ്രീക്ക് വാചകം സംഭവത്തെ ചുരുക്കത്തോടെയും വ്യക്തമായ തൽക്ഷണതയോടെയും അവതരിപ്പിക്കുന്നു. അതിനെ വിശദീകരിച്ചുതീർക്കാതെ വിവരണത്തിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, മാന്യമായ വിവരണശൈലി. ‘വള്ളം,’ ‘കര,’ ‘ഉടനെ’ എന്നീ സ്വാഭാവിക പദങ്ങൾ ഉപയോഗിച്ചു; മൂലത്തിലെ തൽക്ഷണതയും സാധ്യതയുള്ള അത്ഭുതഭാവവും മയപ്പെടുത്തിയിട്ടില്ല. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
