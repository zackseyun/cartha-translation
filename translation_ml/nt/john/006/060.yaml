id: JHN.6.60
reference: John 6:60
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Πολλοὶ οὖν ἀκούσαντες ἐκ τῶν μαθητῶν αὐτοῦ εἶπαν· Σκληρός ἐστιν ⸂ὁ λόγος οὗτος⸃· τίς δύναται αὐτοῦ ἀκούειν;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/060.yaml
  text: Therefore many of his disciples[a], when they heard it, said, “This word is hard[b]; who can listen to it?”
translation:
  language: ml
  text: 'അതുകൊണ്ട്, അവന്റെ ശിഷ്യന്മാരിൽ പലരും അതു കേട്ടപ്പോൾ പറഞ്ഞു: “ഈ വാക്ക് കഠിനമാണ്[a]; ആർക്കാണ് ഇത് കേൾക്കാൻ കഴിയുക[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഈ പ്രസ്താവന കഠിനമാണ്,” “ഈ സന്ദേശം കഠിനമാണ്,” അല്ലെങ്കിൽ “ഈ ഉപദേശം കഠിനമാണ്” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: “ഇത് ശ്രദ്ധിച്ചുകേൾക്കാൻ ആർക്കാണ് കഴിയുക?” അല്ലെങ്കിൽ സന്ദർഭാനുസരണം “ഇത് സ്വീകരിക്കാൻ ആർക്കാണ് കഴിയുക?” എന്നും അർഥമാകാം. ഗ്രീക്ക് ക്രിയയ്ക്ക് കേൾക്കുക, ശ്രദ്ധിച്ചുകേൾക്കുക, അനുസരിക്കുക/സ്വീകരിക്കുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλοὶ
  choice: പലരും
  rationale: ശിഷ്യന്മാരുടെ വലിയൊരു വിഭാഗത്തെ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുമ്പുള്ള പ്രസംഗത്തിൽനിന്ന് ഉണ്ടാകുന്ന പ്രതികരണത്തെയും ആശയബന്ധത്തെയും വ്യക്തമാക്കുന്നു.
- source_word: ἀκούσαντες
  choice: അതു കേട്ടപ്പോൾ
  rationale: കാലസൂചനയുള്ള ഭൂതകാല കൃതന്തത്തെ സ്വാഭാവികമായ മലയാള ഉപവാക്യമായി നൽകുന്നു; ‘അതു’ യേശുവിന്റെ മുമ്പത്തെ വാക്കുകളെ സൂചിപ്പിക്കുന്നു.
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ
  choice: അവന്റെ ശിഷ്യന്മാരിൽ
  rationale: സംസാരിച്ചവർ ശിഷ്യന്മാരുടെ വിശാലമായ കൂട്ടത്തിൽപ്പെട്ടവരാണെന്ന അർഥം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: Σκληρός
  choice: കടുപ്പമുള്ളതാണ്
  rationale: വാക്ക് ഗ്രഹിക്കാൻ പ്രയാസമുള്ളതോ കഠിനമായി തോന്നുന്നതോ സ്വീകരിക്കാൻ ബുദ്ധിമുട്ടുള്ളതോ എന്ന അർഥസാധ്യതകൾ ഒന്നിലേക്കു ചുരുക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: ὁ λόγος οὗτος
  choice: ഈ വാക്ക്
  rationale: λόγος ഇവിടെ ഇപ്പോൾ കേട്ട പ്രസ്താവനയെയോ ഉപദേശത്തെയോ സൂചിപ്പിക്കുന്നു; ‘വാക്ക്’ മൂലരൂപത്തോട് അടുത്തതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമാണ്.
- source_word: τίς δύναται
  choice: ആർക്ക് കഴിയും
  rationale: കഴിവിനെക്കുറിച്ചുള്ള ചോദ്യത്തിന്റെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: αὐτοῦ ἀκούειν
  choice: ഇതു കേൾക്കാൻ
  rationale: ἀκούω എന്ന ക്രിയയുടെ ‘കേൾക്കുക’, ‘ശ്രദ്ധിച്ചുകേൾക്കുക’, ‘അനുസരിച്ച് സ്വീകരിക്കുക’ എന്നീ അർഥസാധ്യതകൾ പൂർണമായി വ്യാഖ്യാനിച്ച് തീർക്കാതെ, മുമ്പുള്ള ‘കേട്ടപ്പോൾ’ എന്ന പ്രയോഗവുമായുള്ള പദബന്ധവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ പ്രസംഗത്തോടുള്ള ശിഷ്യന്മാരുടെ എതിർപ്പിന്റെ സ്വഭാവം
  choice: അവർക്ക് ആ വാക്ക് കടുപ്പമുള്ളതായി തോന്നിയെന്ന് പറയുന്നു; അത് ബൗദ്ധികമായി പ്രയാസമുള്ളതോ കഠിനമോ അസ്വീകാര്യമോ ആയിരുന്നുവെന്ന് പ്രത്യേകം നിശ്ചയിക്കുന്നില്ല.
  alternative: ആ വാക്ക് മനസ്സിലാക്കാൻ മാത്രം പ്രയാസമുള്ളതായിരുന്നു; അല്ലെങ്കിൽ അത് അസഹനീയവും അപമാനകരവുമായിരുന്നു എന്ന് വ്യക്തമായി വിവർത്തനം ചെയ്യുക.
  rationale: σκληρός എന്ന പദം കാഠിന്യം, പ്രയാസം, അസ്വീകാര്യത എന്നീ ഭാവങ്ങൾ വഹിക്കാം. ‘കടുപ്പമുള്ളത്’ ഈ ദൈവശാസ്ത്രപരവും മാനസികവുമായ സംഘർഷം പരിഹരിച്ചുകളയാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധം സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വചനം’ എന്ന സഭാപരമായ പദത്തിന് പകരം ഇവിടെ സന്ദർഭോചിതമായ ‘വാക്ക്’ ഉപയോഗിച്ചു; എന്നാൽ മൂലത്തിലെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
