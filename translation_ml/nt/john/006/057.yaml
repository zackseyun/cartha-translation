id: JHN.6.57
reference: John 6:57
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καθὼς ἀπέστειλέν με ὁ ζῶν πατὴρ κἀγὼ ζῶ διὰ τὸν πατέρα, καὶ ὁ τρώγων με κἀκεῖνος ⸀ζήσει δι’ ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/057.yaml
  text: Just as the living Father sent me[a], and I live because of the Father[b], so also the one who feeds on me will live because of me.
translation:
  language: ml
  text: ജീവിക്കുന്ന പിതാവ് എന്നെ അയച്ചതുപോലെ, ഞാൻ പിതാവിനിമിത്തം[a] ജീവിക്കുന്നു; അതുപോലെ, എന്നെ ഭക്ഷിക്കുന്നവനും എന്നിമിത്തം ജീവിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പിതാവിലൂടെ … എന്നിലൂടെ’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്കിലെ διά ഈ രണ്ടു പ്രയോഗങ്ങളിലും കാരണമോ അടിസ്ഥാനമോ സൂചിപ്പിക്കുന്നു; ചിലർ അതിനെ ഉപാധി അഥവാ മുഖാന്തരം എന്ന അർഥത്തിലും മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς
  choice: എന്നതുപോലെയും … എന്നതുപോലെയും
  rationale: തുടർന്നുള്ള രണ്ട് ബന്ധങ്ങളെയും താരതമ്യം ചെയ്യുന്ന ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ὁ ζῶν πατὴρ
  choice: ജീവിക്കുന്ന പിതാവ്
  rationale: ζῶν എന്ന വർത്തമാന കൃദന്തത്തിന്റെ നേരിട്ടുള്ള അർഥവും യോഹന്നാനിലെ ജീവൻ എന്ന പ്രമേയവും സംരക്ഷിക്കുന്നു; ‘ജീവൻ നൽകുന്ന’ എന്ന് വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: ἀπέστειλέν με
  choice: എന്നെ അയച്ചു
  rationale: അയയ്ക്കുക എന്ന ക്രിയയുടെ ലളിതമായ ഭൂതകാല അർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ζῶ
  choice: ജീവിക്കുന്നു
  rationale: വർത്തമാനകാലവും തുടർച്ചയായ ജീവബന്ധവും നിലനിർത്തുന്നു.
- source_word: διὰ τὸν πατέρα / δι’ ἐμέ
  choice: പിതാവിനാൽ / എന്നാൽ
  rationale: διά + accusative ഇവിടെ കാരണത്തെയോ അടിസ്ഥാനത്തെയോ സൂചിപ്പിക്കാം. ‘-ആൽ’ എന്ന രൂപം മലയാളത്തിൽ ‘കാരണം’ എന്നും ‘മുഖാന്തരം’ എന്നും ഗ്രഹിക്കാവുന്നതിനാൽ ഗ്രീക്കിലെ യഥാർഥ അവ്യക്തത സംരക്ഷിക്കുകയും രണ്ടു പ്രയോഗങ്ങളുടെ സമാന്തരത നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ὁ τρώγων με
  choice: എന്നെ ഭക്ഷിക്കുന്നവൻ
  rationale: τρώγω എന്നത് മൂർത്തവും ശക്തവുമായ ഭക്ഷിക്കൽക്രിയയാണ്. ‘ഭക്ഷിക്കുക’ അതിന്റെ നേരിട്ടുള്ള അർഥം മാന്യമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു; കൂദാശാപരമോ കേവലം രൂപകപരമോ ആയ ഒരു വ്യാഖ്യാനം നിർബന്ധിക്കുന്നില്ല.
- source_word: κἀκεῖνος
  choice: അവനും
  rationale: καὶ ἐκεῖνος എന്ന ഊന്നൽ മലയാളത്തിലെ ‘അവനും’ സ്വാഭാവികമായി പകർന്നു നൽകുന്നു.
- source_word: ζήσει
  choice: ജീവിക്കും
  rationale: ഭാവികാലം നേരിട്ട് നിലനിർത്തുകയും മുൻപുള്ള ‘ജീവിക്കുന്നു’ എന്ന ക്രിയയോടുള്ള ബന്ധം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: διὰ τὸν πατέρα എന്നതിലെ പുത്രന്റെ പിതാവുമായുള്ള ജീവബന്ധം
  choice: ‘പിതാവിനാൽ’ എന്ന് നൽകി കാരണപരവും ഉപാധിപരവുമായ സാധ്യതകൾ തുറന്നുവെച്ചു.
  alternative: ‘പിതാവ് നിമിത്തം’ അല്ലെങ്കിൽ ‘പിതാവിലൂടെ’
  rationale: വാക്യം പിതാവ്–പുത്രൻ ബന്ധത്തെയും പുത്രൻ–വിശ്വാസി ബന്ധത്തെയും സമാന്തരമായി അവതരിപ്പിക്കുന്നു. വിവർത്തനം പുത്രന്റെ സത്താപരമായ അധമത്വം പഠിപ്പിക്കാതെയും അതിനെതിരെ വിശദീകരണം ചേർക്കാതെയും മൂലപാഠത്തിന്റെ ബന്ധഭാഷ നിലനിർത്തുന്നു.
- issue: ὁ τρώγων με എന്നതിന്റെ കൂദാശാപരമോ വിപുലമായ രൂപകപരമോ ആയ ബലം
  choice: ‘എന്നെ ഭക്ഷിക്കുന്നവൻ’ എന്ന മൂർത്തമായ പ്രയോഗം നിലനിർത്തി.
  alternative: ‘എന്നിൽനിന്ന് ആഹാരം സ്വീകരിക്കുന്നവൻ’ അല്ലെങ്കിൽ ‘എന്നിൽ പങ്കുചേരുന്നവൻ’
  rationale: ഗ്രീക്കിലെ ഭക്ഷിക്കൽഭാഷ മൃദൂകരിക്കാതെ നിലനിർത്തുന്നു; അതേസമയം കൂദാശാപരമായ വായനയെയോ വിശ്വാസത്തിലൂടെയുള്ള ഐക്യത്തിന്റെ വായനയെയോ മാത്രം നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വാക്യഘടന. ‘ജീവിക്കുന്ന പിതാവ്’, ‘ഭക്ഷിക്കുന്നവൻ’ എന്നീ നേരിട്ടുള്ള പ്രയോഗങ്ങൾ മൂലപാഠത്തിന്റെ മൂർത്തതയും യോഹന്നാനിലെ ജീവൻ-പ്രമേയവും സംരക്ഷിക്കുന്നു. ഒരേ [a] അടയാളം ബന്ധപ്പെട്ട രണ്ടു സമാന്തര പ്രയോഗങ്ങൾക്കു പിന്നാലെയും ചേർത്തിരിക്കുന്നു.
