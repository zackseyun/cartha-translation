id: JHN.6.44
reference: John 6:44
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐδεὶς δύναται ἐλθεῖν πρός ⸀με ἐὰν μὴ ὁ πατὴρ ὁ πέμψας με ἑλκύσῃ αὐτόν, κἀγὼ ἀναστήσω αὐτὸν ἐν τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/044.yaml
  text: No one is able to come to me unless the Father who sent me draws him[b][a], and I will raise him up on the last day.
translation:
  language: ml
  text: എന്നെ അയച്ച പിതാവ് അവനെ[a] ആകർഷിച്ചാലല്ലാതെ[b] ആർക്കും എന്റെ അടുക്കൽ വരാൻ കഴിയില്ല; ഞാൻ അവനെ അന്ത്യനാളിൽ ഉയിർത്തെഴുന്നേൽപ്പിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ‘അവനെ’ എന്നാണ്; ഇവിടെ ആ പുല്ലിംഗ ഏകവചനരൂപം പൊതുപ്രാതിനിധ്യ അർഥത്തിലാണ് ഉപയോഗിച്ചിരിക്കുന്നത്. പ്രസ്താവന പുരുഷന്മാർക്കു മാത്രമല്ല, എല്ലാവർക്കും ബാധകമാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘വലിച്ചടുപ്പിച്ചാലല്ലാതെ’ അല്ലെങ്കിൽ ‘വലിച്ചുകൊണ്ടുവന്നാലല്ലാതെ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കുക്രിയയ്ക്ക് കൂടുതൽ ശക്തമായി വലിക്കുന്ന അർഥവും ഉണ്ടാകാം. പിതാവ് ഒരാളെ പുത്രന്റെ അടുക്കൽ കൊണ്ടുവരുന്നത് എങ്ങനെയെന്നതിന് ഒരു പ്രത്യേക ദൈവശാസ്ത്രവ്യാഖ്യാനം നിർബന്ധമാക്കാതിരിക്കാനാണ് മുഖ്യവാചകത്തിൽ ‘ആകർഷിച്ചാലല്ലാതെ’ എന്നു നൽകിയിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς δύναται
  choice: ആർക്കും ... കഴിയില്ല
  rationale: സാർവത്രികമായ നിഷേധവും കഴിവില്ലായ്മയുടെ വ്യക്തമായ ആശയവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐλθεῖν πρός με
  choice: എന്റെ അടുക്കൽ വരാൻ
  rationale: യേശുവിലേക്കുള്ള വരവ് എന്ന യോഹന്നാനീയ പ്രയോഗം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ὁ πατὴρ ὁ πέμψας με
  choice: എന്നെ അയച്ച പിതാവ്
  rationale: ഗ്രീക്കിലെ വിശേഷണസ്വഭാവമുള്ള കൃതന്തത്തെ സ്വാഭാവികമായ മലയാള ബന്ധവാക്യമായി നൽകുന്നു.
- source_word: ἑλκύσῃ
  choice: ആകർഷിച്ചാലല്ലാതെ
  rationale: ഒരാളെ അടുപ്പിക്കുന്ന ക്രിയയുടെ ദിശയും ശക്തിയും സൂചിപ്പിക്കുമ്പോഴും അത് എങ്ങനെ സംഭവിക്കുന്നു എന്ന ദൈവശാസ്ത്രപരമായ ചോദ്യം തീർപ്പാക്കാത്ത പരിചിതമായ മലയാളപ്രയോഗം. കൂടുതൽ ശക്തമായ പദസാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: αὐτόν
  choice: അവനെ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ഏകവചന സർവനാമത്തിന്റെ രൂപം നിലനിർത്തുന്നു; ഇവിടെ അതിന് പൊതുപ്രാതിനിധ്യ അർഥമുണ്ടെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: κἀγὼ ἀναστήσω αὐτόν
  choice: ഞാൻ അവനെ ... ഉയിർത്തെഴുന്നേൽപ്പിക്കും
  rationale: καί + ἐγώയിലെ വ്യക്തമായ കർത്താവിനെയും ഭാവികാലത്തുള്ള പുനരുത്ഥാനപ്രവൃത്തിയെയും സ്വാഭാവികവും കൃത്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐν τῇ ἐσχάτῃ ἡμέρᾳ
  choice: അന്ത്യനാളിൽ
  rationale: അവസാനകാലപരമായ സൂചന സംക്ഷിപ്തവും നിലവാരമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: രക്ഷയെ സംബന്ധിച്ച സന്ദർഭത്തിലെ ἑλκύσῃ എന്ന ക്രിയയുടെ ശക്തി
  choice: ആകർഷിച്ചാലല്ലാതെ
  alternative: വലിച്ചടുപ്പിച്ചാലല്ലാതെ / വലിച്ചുകൊണ്ടുവന്നാലല്ലാതെ
  rationale: ഗ്രീക്കുക്രിയയ്ക്ക് ശക്തമായി വലിക്കുക എന്ന അർഥം ചില സന്ദർഭങ്ങളിൽ ഉണ്ടാകാം. എന്നാൽ ഈ വാക്യത്തിൽ കൃപ പ്രവർത്തിക്കുന്ന രീതി സംബന്ധിച്ച ഒരു പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ നിഗമനം മുഖ്യവാചകത്തിൽ അടിച്ചേൽപ്പിക്കാതെ പദത്തിന്റെ അർഥവ്യാപ്തിയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും സംരക്ഷിക്കുന്നു.
- issue: αὐτόν എന്ന പുല്ലിംഗ ഏകവചന സർവനാമത്തിന്റെ പൊതുപ്രാതിനിധ്യ പ്രയോഗം
  choice: അവനെ
  alternative: ആ വ്യക്തിയെ
  rationale: മൂലഭാഷയിലെ പുല്ലിംഗ ഏകവചനരൂപം നിലനിർത്തുകയും പ്രസ്താവന പുരുഷന്മാർക്കു മാത്രമല്ല എല്ലാവർക്കും പൊതുവായി ബാധകമാണെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അന്ത്യനാൾ’, ‘ഉയിർത്തെഴുന്നേൽപ്പിക്കും’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും വാക്യത്തിന്റെ ഗൗരവവും പുനരുത്ഥാനസൂചനയും നിലനിർത്തുന്നതുമാണ്.
