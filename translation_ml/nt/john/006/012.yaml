id: JHN.6.12
reference: John 6:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὡς δὲ ἐνεπλήσθησαν λέγει τοῖς μαθηταῖς αὐτοῦ· Συναγάγετε τὰ περισσεύσαντα κλάσματα, ἵνα μή τι ἀπόληται.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/012.yaml
  text: And when they were filled[a], he says to his disciples, “Gather up the leftover pieces[d][c][b], so that nothing may be lost.”
translation:
  language: ml
  text: 'അവർ വയറുനിറഞ്ഞപ്പോൾ[a], അവൻ തന്റെ ശിഷ്യന്മാരോടു പറയുന്നു[b]: “ശേഷിച്ച കഷണങ്ങൾ[c] ഒന്നും നഷ്ടപ്പെടാതിരിക്കാൻ[d] ശേഖരിക്കുവിൻ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അവർ തൃപ്തരായപ്പോൾ” അല്ലെങ്കിൽ “അവർ മതിയാകുവോളം ഭക്ഷിച്ചപ്പോൾ.”
    reason: lexical_alternative
  - marker: b
    text: 'ഗ്രീക്കിൽ ചരിത്രവർത്തമാനകാലമാണ്: “പറയുന്നു.” ചില പരിഭാഷകൾ ആഖ്യാനശൈലിക്കനുസരിച്ച് “പറഞ്ഞു” എന്നു നൽകുന്നു.'
    reason: lexical_alternative
  - marker: c
    text: അഥവാ “ശകലങ്ങൾ” അല്ലെങ്കിൽ “ശേഷിച്ച അപ്പക്കഷണങ്ങൾ.”
    reason: lexical_alternative
  - marker: d
    text: അഥവാ “ഒന്നും പാഴാകാതിരിക്കാൻ.” ഗ്രീക്കിൽ കൂടുതൽ അക്ഷരാർഥത്തിൽ, “ഒന്നും നഷ്ടപ്പെടാതിരിക്കാൻ” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: അപ്പോൾ
  rationale: ὡς എന്നതിന്റെ കാലസൂചന തുടർന്നുള്ള ഉപവാക്യത്തിൽ സ്വാഭാവികമായി പ്രകടമാകുന്നു; δέ നൽകുന്ന മൃദുവായ ആഖ്യാനബന്ധം ‘അപ്പോൾ’ നിലനിർത്തുന്നു.
- source_word: ἐνεπλήσθησαν
  choice: അവർ വയറുനിറയെ ഭക്ഷിച്ചു
  rationale: ഭക്ഷണംകൊണ്ട് നിറയുക, തൃപ്തരാകുക എന്ന അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായും സന്ദർഭോചിതമായും നൽകുന്നു.
- source_word: λέγει
  choice: അവൻ ... പറയുന്നു
  rationale: യോഹന്നാന്റെ ആഖ്യാനത്തിലെ ചരിത്രവർത്തമാനകാലം പരിഭാഷയിലും നിലനിർത്തുന്നു.
- source_word: μαθηταῖς
  choice: ശിഷ്യന്മാർ
  rationale: സുവിശേഷസന്ദർഭത്തിൽ μαθηταί എന്നതിന് കൃത്യവും പതിവുമായ മലയാളപദം.
- source_word: Συναγάγετε
  choice: ശേഖരിക്കുവിൻ
  rationale: നേരിട്ടുള്ള ബഹുവചന കല്പനയെ ഗൗരവമുള്ളതും വ്യക്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: τὰ περισσεύσαντα κλάσματα
  choice: ശേഷിച്ച കഷണങ്ങൾ
  rationale: περισσεύσαντα സൂചിപ്പിക്കുന്ന ശേഷിപ്പും κλάσματα സൂചിപ്പിക്കുന്ന ഒടിഞ്ഞ ഭാഗങ്ങൾ/കഷണങ്ങൾ എന്ന അർഥവും അമിതവ്യാഖ്യാനമില്ലാതെ നൽകുന്നു.
- source_word: ἵνα μή τι ἀπόληται
  choice: ഒന്നും നഷ്ടപ്പെട്ടുപോകാതിരിക്കേണ്ടതിന്
  rationale: ഉദ്ദേശ്യവാക്യവും ἀπόληται എന്നതിന്റെ അടിസ്ഥാനമായ ‘നഷ്ടപ്പെടുക’ എന്ന അർഥവും സംരക്ഷിക്കുന്നു; ‘പാഴാകുക’ എന്ന പ്രായോഗിക അർഥത്തിലേക്ക് മാത്രം ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: അടയാളത്തിന്റെ സന്ദർഭത്തിൽ ἀπόληται എന്ന പദത്തിന് രക്ഷാശാസ്ത്രപരമായ അധികവ്യാഖ്യാനം നൽകാനുള്ള സാധ്യത
  choice: ‘നഷ്ടപ്പെട്ടുപോകാതിരിക്കേണ്ടതിന്’ എന്ന് പരിഭാഷപ്പെടുത്തി, ഉടനെയുള്ള ഭക്ഷണശേഷിപ്പുകളുടെ സന്ദർഭം നിലനിർത്തുകയും പദത്തിന്റെ വിപുലമായ യോഹന്നാനീയ പ്രതിധ്വനി അടച്ചുകളയാതിരിക്കുകയും ചെയ്തു.
  alternative: ‘ഒന്നും പാഴാകാതിരിക്കേണ്ടതിന്’ എന്ന ശുദ്ധ പ്രായോഗിക പരിഭാഷ.
  rationale: ഇവിടെ നേരിട്ടുള്ള സൂചന ശേഷിച്ച ഭക്ഷണകഷണങ്ങളിലേക്കാണ്. എന്നാൽ ‘നഷ്ടപ്പെടുക’ എന്ന അടിസ്ഥാനപദം നിലനിർത്തുന്നത് സാധ്യമായ സാഹിത്യ-ദൈവശാസ്ത്ര പ്രതിധ്വനി വായനക്കാരനുവേണ്ടി തുറന്നുവയ്ക്കുന്നു; അതിനെ മുഖ്യവാചകത്തിൽ നിർബന്ധിതമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ചരിത്രവർത്തമാനം ഉദ്ദേശപൂർവം നിലനിർത്തി. കല്പനയ്ക്ക് ‘ശേഖരിക്കുവിൻ’ എന്ന മാന്യമായ ബഹുവചനരൂപം ഉപയോഗിച്ചു; സങ്കീർണമായ തത്ത്വശാസ്ത്രപരമായ പദങ്ങൾ ഒഴിവാക്കി.
