id: JHN.6.34
reference: John 6:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπον οὖν πρὸς αὐτόν· Κύριε, πάντοτε δὸς ἡμῖν τὸν ἄρτον τοῦτον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/034.yaml
  text: So they said to him[a], “Lord, always give us this bread.”
translation:
  language: ml
  text: 'അതുകൊണ്ട് അവർ അവനോട് പറഞ്ഞു: “കർത്താവേ,[a] ഈ അപ്പം എപ്പോഴും ഞങ്ങൾക്കു തരണമേ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “അയ്യാ.” ഗ്രീക്കിലെ ഈ അഭിസംബോധന ആദരസൂചകമായ വിളിയായും ‘കർത്താവ്’ എന്ന അർഥത്തിലും ഉപയോഗിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπον
  choice: അവർ പറഞ്ഞു
  rationale: λέγω എന്ന ക്രിയയുടെ ബഹുവചന ഭൂതകാലരൂപം സംഭാഷണവിവരണത്തിൽ സ്വാഭാവികമായി ‘അവർ പറഞ്ഞു’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുമ്പത്തെ സംഭാഷണത്തിൽനിന്ന് ഈ അഭ്യർഥന ഉയരുന്ന അനുമാനബന്ധം οὖν സൂചിപ്പിക്കുന്നു; ‘അതുകൊണ്ട്’ ആ ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: πρὸς αὐτόν
  choice: അവനോട്
  rationale: സംസാരക്രിയയോടൊപ്പമുള്ള πρός + ദ്വിതീയാവിഭക്തി അഭിസംബോധന ചെയ്യപ്പെടുന്നയാളെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘അവനോട്’ സ്വാഭാവികമാണ്.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: κύριος എന്ന അഭിസംബോധനയ്ക്ക് ആദരസൂചകമായ വിളിയുടെയും കൂടുതൽ ആഴമുള്ള കർത്തൃത്വസൂചനയുടെയും സാധ്യതയുണ്ട്; ‘കർത്താവേ’ ഈ തുറന്ന അർഥപരിധി സംരക്ഷിക്കുന്നു.
- source_word: πάντοτε
  choice: എപ്പോഴും
  rationale: πάντοτε എന്നത് തുടർച്ചയായോ എല്ലാ സമയത്തുമുള്ളതായോ നൽകലിനെ അഭ്യർഥിക്കുന്നു; ‘എപ്പോഴും’ സാധാരണ മലയാളത്തിൽ നേരിട്ടുള്ള സമാനപദമാണ്.
- source_word: δὸς
  choice: തരണമേ
  rationale: δίδωμι എന്ന ക്രിയയുടെ ആജ്ഞാരൂപം ഇവിടെ അഭ്യർഥനയാണ്. ‘തരണമേ’ നേരിട്ടുള്ള അപേക്ഷയെ സ്വാഭാവികവും മാന്യവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἡμῖν
  choice: ഞങ്ങൾക്കു
  rationale: നൽകലിന്റെ പരോക്ഷ കർമമായ ബഹുവചന സർവനാമം മലയാളത്തിൽ ‘ഞങ്ങൾക്കു’ എന്നു വരുന്നു.
- source_word: τὸν ἄρτον τοῦτον
  choice: ഈ അപ്പം
  rationale: ἄρτος എന്നത് ‘അപ്പം’; τοῦτον മുമ്പ് ചർച്ച ചെയ്ത അപ്പത്തെ ചൂണ്ടിക്കാണിക്കുന്നു. ‘ഈ അപ്പം’ ആ സൂചന നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശുവിനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയിൽ κύριος എന്നതിന്റെ പരിഭാഷ
  choice: കർത്താവേ
  alternative: യജമാനനേ / പ്രഭോ
  rationale: സംസാരിക്കുന്നവർ യേശുവിന്റെ വ്യക്തിത്വം എത്രമാത്രം ഗ്രഹിച്ചിരുന്നുവെന്ന് വാക്യം തീർപ്പാക്കുന്നില്ല. ‘കർത്താവേ’ ആദരസൂചകമായ അഭിസംബോധനയും ക്രിസ്തുശാസ്ത്രപരമായ കൂടുതൽ ആഴമുള്ള സൂചനയും ഒരുപോലെ തുറന്നുവെക്കുന്നു; അടിക്കുറിപ്പ് വിനയപൂർവമായ അഭിസംബോധന എന്ന സാധ്യത വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ സംഭാഷണശൈലി. മൂലത്തിലെ അനുമാനബന്ധം ‘അതുകൊണ്ട്’ എന്നും ആവർത്തിച്ചുള്ള നൽകലിന്റെ ആശയം ‘എപ്പോഴും’ എന്നും നിലനിർത്തി. ‘കർത്താവേ’ എന്നതിലെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
