source:
  edition: SBLGNT
  text: Ὡς δὲ ὀψία ἐγένετο κατέβησαν οἱ μαθηταὶ αὐτοῦ ἐπὶ τὴν θάλασσαν,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/016.yaml
  text: When evening came[a], his disciples went down to the sea,
translation:
  language: ml
  text: സന്ധ്യയായപ്പോൾ അവന്റെ ശിഷ്യന്മാർ കടലിലേക്ക്[a] ഇറങ്ങിച്ചെന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തടാകത്തിലേക്ക്.’ ഈ ജലാശയം ഗലീലക്കടലാണ്; സാങ്കേതികമായി ഇതൊരു തടാകമാണെങ്കിലും ഗ്രീക്കുപാഠത്തിൽ ‘കടൽ’ (θάλασσα) എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: സന്ധ്യയായപ്പോൾ എന്ന കാലസൂചക ഉപവാക്യത്തിൽ സ്വാഭാവികമായി ഉൾപ്പെടുത്തി
  rationale: ὡς ഇവിടെ കാലബന്ധം സൂചിപ്പിക്കുന്നു; δέ കഥയിലെ മാറ്റം അടയാളപ്പെടുത്തുന്നു. മലയാളത്തിൽ വേറൊരു ‘എന്നാൽ’ ചേർക്കാതെ കാലസൂചക ഘടനതന്നെ ഈ മാറ്റം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: ὀψία ἐγένετο
  choice: സന്ധ്യയായപ്പോൾ
  rationale: സന്ധ്യ ആരംഭിച്ചതിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളരൂപം.
- source_word: κατέβησαν
  choice: ഇറങ്ങിച്ചെന്നു
  rationale: καταβαίνω സൂചിപ്പിക്കുന്ന താഴോട്ടുള്ള സഞ്ചാരം നിലനിർത്തുകയും കഥയുടെ ദൃഷ്ടികോണത്തിൽ ‘went down’ എന്ന അർത്ഥം സ്വാഭാവികമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: അവന്റെ ശിഷ്യന്മാർ
  rationale: ഗ്രീക്കിലെ നാമം-സർവനാമ ഉടമസ്ഥഘടനയുടെ സ്വാഭാവിക മലയാളപരിഭാഷ.
- source_word: ἐπὶ τὴν θάλασσαν
  choice: കടലിലേക്ക്
  rationale: ചലനക്രിയയോടുകൂടിയ ἐπί + accusative ലക്ഷ്യദിശ സൂചിപ്പിക്കുന്നു. ഗലീലക്കടൽ സാങ്കേതികമായി തടാകമാണെങ്കിലും θάλασσα എന്ന മൂലപദത്തിന്റെ ‘കടൽ’ എന്ന അർത്ഥം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഇറങ്ങിച്ചെന്നു’ ഭൂപ്രകൃതിയനുസരിച്ചുള്ള താഴോട്ടുള്ള സഞ്ചാരം വ്യക്തമായി നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് സൂചകം അതു വിശദീകരിക്കുന്ന ‘കടൽ’ എന്ന പദത്തോടു ചേർത്തിരിക്കുന്നു.
