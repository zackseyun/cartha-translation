id: JHN.6.29
reference: John 6:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀ὁ Ἰησοῦς καὶ εἶπεν αὐτοῖς· Τοῦτό ἐστιν τὸ ἔργον τοῦ θεοῦ ἵνα ⸀πιστεύητε εἰς ὃν ἀπέστειλεν ἐκεῖνος.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/029.yaml
  text: 'Jesus answered and said to them[b][a], “This is the work of God: that you believe in the one whom he has sent.”'
translation:
  language: ml
  text: 'യേശു അവരോടു മറുപടി പറഞ്ഞു: “ദൈവത്തിന്റെ പ്രവൃത്തി[a] ഇതാണ്: അവൻ അയച്ചവനിൽ നിങ്ങൾ വിശ്വസിക്കുക[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ദൈവം ആവശ്യപ്പെടുന്ന പ്രവൃത്തി” അല്ലെങ്കിൽ “ദൈവം ചെയ്യുന്ന പ്രവൃത്തി.” “ദൈവത്തിന്റെ പ്രവൃത്തി” എന്ന ഗ്രീക്ക് പ്രയോഗം ഒന്നിലധികം വിധത്തിൽ മനസ്സിലാക്കാം; മുഖ്യപാഠം ആ അവ്യക്തത നിലനിർത്തുന്നു.
    reason: alternative_reading
  - marker: b
    text: അഥവാ “അവൻ അയച്ചവനെ നിങ്ങൾ ആശ്രയിക്കുക.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ... καὶ εἶπεν
  choice: മറുപടിയായി പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ രണ്ടു ക്രിയകളുടെയും അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: Τοῦτό ἐστιν
  choice: ഇതാണ്
  rationale: ചൂണ്ടുപദത്തിനുള്ള ഊന്നൽ നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: τὸ ἔργον τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ പ്രവൃത്തി
  rationale: ഗ്രീക്ക് ഷഷ്ഠീവിഭക്തി പ്രയോഗത്തിലെ—ദൈവം ആവശ്യപ്പെടുന്ന പ്രവൃത്തിയോ ദൈവം ചെയ്യുന്ന പ്രവൃത്തിയോ—എന്ന അർഥസാധ്യതകൾ മുഖ്യപാഠത്തിൽ തീർപ്പാക്കാതെ നിലനിർത്തുന്നു.
- source_word: ἵνα πιστεύητε
  choice: നിങ്ങൾ വിശ്വസിക്കുക
  rationale: ഇവിടെ ἵνα വാക്യം ‘പ്രവൃത്തി’യുടെ ഉള്ളടക്കം വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ നിർദേശാത്മകമായ ക്രിയാരൂപം സ്വാഭാവികമാണ്.
- source_word: εἰς ὃν
  choice: അയച്ചവനിൽ
  rationale: യോഹന്നാനിലെ πιστεύω εἰς എന്ന പ്രയോഗത്തിന്റെ വ്യക്തിപരമായ ലക്ഷ്യം ‘-യിൽ വിശ്വസിക്കുക’ എന്ന രൂപത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: ἀπέστειλεν ἐκεῖνος
  choice: അവിടുന്ന് അയച്ച
  rationale: ἐκεῖνος ദൈവത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ആദരസൂചക സർവനാമം ഉപയോഗിക്കുന്നു; ഗ്രീക്ക് aorist മലയാളത്തിലെ സ്വാഭാവിക ഭൂതകാല വിശേഷണരൂപത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: τοῦ θεοῦ എന്ന ഷഷ്ഠീവിഭക്തിയുടെ അർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘ദൈവത്തിന്റെ പ്രവൃത്തി’ എന്ന അവ്യക്തത നിലനിർത്തി.
  alternative: ‘ദൈവം ആവശ്യപ്പെടുന്ന പ്രവൃത്തി’ അല്ലെങ്കിൽ ‘ദൈവം ചെയ്യുന്ന പ്രവൃത്തി’
  rationale: സന്ദർഭം ആദ്യ അർഥത്തെ പിന്തുണയ്ക്കാമെങ്കിലും ഗ്രീക്ക് ഘടന ഇരുവിധ വായനയ്ക്കും ഇട നൽകുന്നു; അതിനാൽ ഒരു ദൈവശാസ്ത്രപരമായ നിഗമനം വിവർത്തനത്തിലൂടെ നിർബന്ധിച്ചിട്ടില്ല.
- issue: πιστεύητε εἰς എന്ന പ്രയോഗം
  choice: ‘അയച്ചവനിൽ നിങ്ങൾ വിശ്വസിക്കുക’
  alternative: ‘അയച്ചവനിൽ നിങ്ങൾ ആശ്രയമർപ്പിക്കുക’
  rationale: ‘വിശ്വസിക്കുക’ πιστεύωയുടെ സ്ഥിരവും വ്യക്തവുമായ മലയാളസമാനമാണ്; വിശ്വാസപൂർവമായ ആശ്രയത്തിന്റെ ഭാവം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ സംഭാഷണശൈലി. ദൈവത്തെ സൂചിപ്പിക്കാൻ ‘അവിടുന്ന്’ ഉപയോഗിച്ചു. അടിക്കുറിപ്പുകളുടെ [a], [b] അടയാളങ്ങൾ അവ വിശദീകരിക്കുന്ന പദപ്രയോഗങ്ങൾക്ക് പിന്നാലെ മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
