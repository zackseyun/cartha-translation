id: JHN.6.55
reference: John 6:55
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἡ γὰρ σάρξ μου ⸀ἀληθής ἐστι βρῶσις, καὶ τὸ αἷμά μου ⸁ἀληθής ἐστι πόσις.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/055.yaml
  text: For my flesh is true food[a], and my blood is true drink.
translation:
  language: ml
  text: എന്തെന്നാൽ, എന്റെ മാംസം യഥാർഥ ഭക്ഷണമാണ്[a], എന്റെ രക്തം യഥാർഥ പാനീയമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സത്യമായ ഭക്ഷണം” എന്നും “സത്യമായ പാനീയം” എന്നും.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: വാക്യബന്ധത്തിലൂടെ സൂചിപ്പിച്ചു
  rationale: മുൻവാക്യത്തിന്റെ വിശദീകരണമെന്ന ബന്ധം മലയാളത്തിൽ തുടർച്ചയിലൂടെ സ്വാഭാവികമായി വ്യക്തമാകുന്നതിനാൽ പ്രത്യേക സംയോജകം ചേർത്തില്ല.
- source_word: σάρξ
  choice: മാംസം
  rationale: യേശുവിന്റെ മാംസവും രക്തവും എന്ന സമാന്തരപ്രയോഗം നിലനിർത്തുന്ന നേരിട്ടുള്ള പരിഭാഷ; വ്യാഖ്യാനാത്മകമായ ‘ശരീരം’ ഒഴിവാക്കുന്നു.
- source_word: ἀληθής
  choice: യഥാർഥ
  rationale: ‘സത്യമായ’ എന്നതിനെക്കാൾ ഭക്ഷണത്തിന്റെയും പാനീയത്തിന്റെയും വിശേഷണമായി സ്വാഭാവികമാണ്; ‘യഥാർഥ/സത്യമായ’ എന്ന ഗ്രീക്കിലെ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: βρῶσις
  choice: ഭക്ഷണം
  rationale: ഇവിടെ പ്രവൃത്തിയായ ‘ഭക്ഷിക്കൽ’ എന്നതിനെക്കാൾ ഭക്ഷിക്കപ്പെടുന്ന വസ്തു എന്ന അർഥമാണ് πόσις-നോടുള്ള സമാന്തരതയ്ക്ക് യോജിക്കുന്നത്.
- source_word: αἷμα
  choice: രക്തം
  rationale: മൂലപദവും മാംസം–രക്തം സമാന്തരതയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: πόσις
  choice: പാനീയം
  rationale: പ്രവൃത്തിയായ ‘കുടിക്കൽ’ എന്നതിനു പകരം കുടിക്കപ്പെടുന്നത് എന്ന അർഥം; ‘ഭക്ഷണം’ എന്നതിനോട് സ്വാഭാവികമായ സമാന്തരത പുലർത്തുന്നു.
theological_decisions:
- issue: ἀληθής എന്നത് യോഹന്നാന്റെ പ്രസംഗത്തിലും കുർബാനാസംബന്ധമായ വ്യാഖ്യാനങ്ങളിലും ‘യഥാർഥ’ എന്നോ ‘സത്യമായ’ എന്നോ പരിഭാഷപ്പെടുത്തുന്നത്
  choice: യഥാർഥ
  alternative: സത്യമായ
  rationale: പ്രധാന പാഠത്തിൽ സ്വാഭാവികമായ മലയാളം നൽകിക്കൊണ്ട്, ഏതെങ്കിലും പ്രത്യേക കുർബാനാസിദ്ധാന്തം തീർപ്പാക്കാതെ മറ്റൊരു നേരിട്ടുള്ള അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ സമാന്തരഘടന സംരക്ഷിക്കാൻ ‘മാംസം/രക്തം’, ‘ഭക്ഷണം/പാനീയം’ എന്നീ ജോടികൾ നിലനിർത്തി; മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി ആവർത്തിച്ച ἐστι ഒറ്റ ‘ആകുന്നു’ ആയി ചേർത്തു.
