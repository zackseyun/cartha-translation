- from: ഈസ്കര്യോത്തുകാരനായ ശിമോന്റെ മകൻ യൂദാസിനെക്കുറിച്ചാണ് അവൻ പറഞ്ഞത്. കാരണം, പന്ത്രണ്ടുപേരിൽ ഒരുവനായിരുന്ന അവനാണ് യേശുവിനെ ഒറ്റിക്കൊടുക്കാനിരുന്നത്[a].
