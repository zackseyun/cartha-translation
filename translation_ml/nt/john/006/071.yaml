source:
  edition: SBLGNT
  text: ἔλεγεν δὲ τὸν Ἰούδαν Σίμωνος ⸀Ἰσκαριώτου· οὗτος γὰρ ἔμελλεν ⸂παραδιδόναι αὐτόν⸃, ⸀εἷς ἐκ τῶν δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/071.yaml
  text: He was speaking about Judas[a], the son of Simon Iscariot, for this one was about to betray him, being one of the Twelve.
translation:
  language: ml
  text: അവൻ ഇസ്കര്യോത്ത് എന്ന ശിമോന്റെ മകനായ യൂദാസിനെക്കുറിച്ചാണ് പറഞ്ഞിരുന്നത്. കാരണം, പന്ത്രണ്ടുപേരിൽ ഒരുവനായിരുന്ന അവനാണ് യേശുവിനെ ഒറ്റിക്കൊടുക്കാനിരുന്നത്[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘അവനെ കൈമാറിക്കൊടുക്കാൻ.’'
    reason: παραδιδόναι αὐτόν എന്ന പ്രയോഗത്തിന്റെ കൂടുതൽ നേരിട്ടുള്ള പദാർഥം നൽകുന്നു.
lexical_decisions:
- source_word: ἔλεγεν δὲ τὸν Ἰούδαν
  choice: യൂദാസിനെക്കുറിച്ചാണ് അവൻ പറഞ്ഞത്
  rationale: അപൂർണ ഭൂതകാലമായ ἔλεγεν ഇവിടെ മുൻവാക്യത്തെ വിശദീകരിക്കുന്ന കഥനപ്രയോഗമാണ്. മലയാളത്തിൽ ‘പറഞ്ഞത് ... കുറിച്ചാണ്’ എന്ന ഘടന സ്വാഭാവികമായി ആ അർഥം നൽകുന്നു; δέ-യ്ക്ക് പ്രത്യേകമായ കാലസൂചകപദം ചേർത്തിട്ടില്ല.
- source_word: Σίμωνος Ἰσκαριώτου
  choice: ഈസ്കര്യോത്തുകാരനായ ശിമോന്റെ മകൻ
  rationale: രണ്ട് ജനിറ്റീവ് രൂപങ്ങളും യൂദാസിനെ പിതൃബന്ധത്തിലൂടെ തിരിച്ചറിയിക്കുന്നു. ബന്ധം മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘മകൻ’ ചേർത്തു; Ἰσκαριώτου എന്നത് ഗ്രീക്ക് വ്യാകരണപ്രകാരം ശിമോനോടു ചേർത്താണ് പരിഭാഷപ്പെടുത്തിയത്.
- source_word: οὗτος γὰρ
  choice: കാരണം ... അവനാണ്
  rationale: γάρ നൽകുന്ന വിശദീകരണബന്ധം ‘കാരണം’ കൊണ്ടും οὗτος എന്ന സൂചകസർവനാമത്തിന്റെ ഊന്നൽ ‘അവനാണ്’ കൊണ്ടും നിലനിർത്തുന്നു.
- source_word: ἔμελλεν
  choice: -ക്കാനിരുന്നത്
  rationale: സമീപഭാവിയിലോ മുന്നിൽ സംഭവിക്കാനിരിക്കുന്നതിലോ ഉള്ള ദൃഷ്ടി പ്രകടിപ്പിക്കുന്നു; ഉദ്ദേശമോ ദൈവനിർണ്ണയമോ അധികമായി ആരോപിക്കുന്നില്ല.
- source_word: παραδιδόναι αὐτόν
  choice: യേശുവിനെ ഒറ്റിക്കൊടുക്കാൻ
  rationale: യോഹന്നാന്റെ പീഡാനുഭവകഥാസന്ദർഭത്തിൽ παραδίδωμι യൂദാസിന്റെ വഞ്ചനാപരമായ കൈമാറ്റത്തെ സൂചിപ്പിക്കുന്നു. സർവനാമത്തിന്റെ വ്യക്തമായ സന്ദർഭസൂചിതനെ മലയാളത്തിൽ ‘യേശു’ എന്നു വ്യക്തമാക്കിയിരിക്കുന്നു.
- source_word: εἷς ἐκ τῶν δώδεκα
  choice: പന്ത്രണ്ടുപേരിൽ ഒരുവനായിരുന്ന
  rationale: യൂദാസ് പന്ത്രണ്ടുപേരുടെ സംഘത്തിൽപ്പെട്ടവനായിരുന്നു എന്ന ഞെട്ടിക്കുന്ന കഥനഊന്നൽ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: യൂദാസിനെ സംബന്ധിച്ച παραδιδόναι എന്ന ക്രിയയുടെ പരിഭാഷ
  choice: ഒറ്റിക്കൊടുക്കാൻ
  alternative: കൈമാറിക്കൊടുക്കാൻ
  rationale: ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘കൈമാറിക്കൊടുക്കുക’ എന്നാണെങ്കിലും, ഈ സന്ദർഭത്തിൽ യൂദാസിന്റെ പ്രവൃത്തി വഞ്ചനയായി കഥനത്തിൽ ചിത്രീകരിക്കപ്പെടുന്നു. മുഖ്യപാഠം സന്ദർഭാർഥം നൽകുകയും കൂടുതൽ അക്ഷരാർഥമുള്ള സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ കഥനശൈലി. ‘അവനാണ്’ എന്ന രൂപം οὗτος-ന്റെ ഊന്നൽ നിലനിർത്തുന്നു; സർവനാമക്കുഴപ്പം ഒഴിവാക്കാൻ αὐτόν-ന്റെ സന്ദർഭസൂചിതനെ ‘യേശു’ എന്നു വ്യക്തമാക്കി.
