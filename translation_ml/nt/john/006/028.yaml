source:
  edition: SBLGNT
  text: εἶπον οὖν πρὸς αὐτόν· Τί ποιῶμεν ἵνα ἐργαζώμεθα τὰ ἔργα τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/028.yaml
  text: Then they said to him[a], “What must we do so that we may work the works of God?”
translation:
  language: ml
  text: 'അപ്പോൾ അവർ അവനോടു പറഞ്ഞു: “ദൈവത്തിന്റെ പ്രവൃത്തികൾ ചെയ്യാൻ ഞങ്ങൾ എന്തു ചെയ്യണം?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ദൈവം ആവശ്യപ്പെടുന്ന പ്രവൃത്തികൾ ചെയ്യാൻ ഞങ്ങൾ എന്തു ചെയ്യണം?” ഗ്രീക്കിലെ “ദൈവത്തിന്റെ പ്രവൃത്തികൾ” എന്ന പ്രയോഗത്തിന് “ദൈവത്തിന്റേതായ പ്രവൃത്തികൾ” അല്ലെങ്കിൽ “ദൈവം ചെയ്യുന്ന പ്രവൃത്തികൾ” എന്നും അർഥമാകാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπον
  choice: ചോദിച്ചു
  rationale: λέγω എന്ന ക്രിയയുടെ സാധാരണ അർഥം ‘പറഞ്ഞു’ എന്നാണെങ്കിലും, നേരിട്ട് പിന്നാലെ വരുന്ന ചോദ്യം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കാൻ ‘ചോദിച്ചു’ എന്നു പരിഭാഷപ്പെടുത്തി; ഇതു വാക്യത്തിന്റെ സംസാരപ്രവൃത്തിയെ കൃത്യമായി വ്യക്തമാക്കുന്നു.
- source_word: οὖν
  choice: അപ്പോൾ
  rationale: οὖν ഇവിടെ മുൻസംഭവത്തോടുള്ള ആഖ്യാനപരമായ തുടർച്ചയും പ്രതികരണവും സൂചിപ്പിക്കുന്നു; ശക്തമായ നിഗമനം ധ്വനിപ്പിക്കാതെ ‘അപ്പോൾ’ അത് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: πρὸς αὐτόν
  choice: അവനോട്
  rationale: സംസാരക്രിയയോടുകൂടിയ πρός + accusative അഭിസംബോധന സൂചിപ്പിക്കുന്നു; അതിനുള്ള സ്വാഭാവിക മലയാളരൂപം ‘അവനോട്’ എന്നാണ്.
- source_word: Τί ποιῶμεν
  choice: ഞങ്ങൾ എന്തു ചെയ്യണം?
  rationale: deliberative subjunctive ആവശ്യമായ നടപടിയെക്കുറിച്ചുള്ള ചോദ്യം പ്രകടിപ്പിക്കുന്നു. ‘എന്തു ചെയ്യണം?’ അതിന്റെ പ്രായോഗിക നിർബന്ധഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἵνα
  choice: പ്രവർത്തിക്കേണ്ടതിന്
  rationale: ἵνα ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു. ‘-േണ്ടതിന്’ എന്ന ഘടന ലക്ഷ്യബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἐργαζώμεθα … ἔργα
  choice: പ്രവൃത്തികൾ പ്രവർത്തിക്കുക
  rationale: ഗ്രീക്കിലെ ἐργάζομαι/ἔργα എന്ന ശബ്ദാവർത്തനവും ആശയബന്ധവും നിലനിർത്താൻ മലയാളത്തിലും ‘പ്രവൃത്തികൾ പ്രവർത്തിക്കുക’ എന്ന ആവർത്തനം സൂക്ഷിച്ചു; അല്പം അസാധാരണമായിരുന്നാലും യോഹന്നാനിലെ തുടർവാക്യത്തിലെ വാക്കുകളി സംരക്ഷിക്കുന്നു.
- source_word: τὰ ἔργα τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ പ്രവൃത്തികൾ
  rationale: ജനിറ്റീവിന്റെ അർഥം ദൈവം ആവശ്യപ്പെടുന്ന പ്രവൃത്തികൾ, ദൈവത്തിന്റേതായ പ്രവൃത്തികൾ, അല്ലെങ്കിൽ ദൈവം ചെയ്യുന്ന പ്രവൃത്തികൾ എന്നിങ്ങനെ തുറന്നിരിക്കുന്നു. ‘ദൈവത്തിന്റെ പ്രവൃത്തികൾ’ ആ അവ്യക്തത പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: τὰ ἔργα τοῦ θεοῦ എന്നതിലെ ജനിറ്റീവിന്റെ അർഥം
  choice: പ്രധാനപാഠത്തിൽ ‘ദൈവത്തിന്റെ പ്രവൃത്തികൾ’ എന്ന് നൽകി അർഥവ്യാപ്തി തുറന്നുവെച്ചു.
  alternative: ‘ദൈവം ആവശ്യപ്പെടുന്ന പ്രവൃത്തികൾ’ / ‘ദൈവത്തിന്റേതായ പ്രവൃത്തികൾ’ / ‘ദൈവം ചെയ്യുന്ന പ്രവൃത്തികൾ’
  rationale: ഗ്രീക്ക് ജനിറ്റീവ് വ്യാകരണപരമായി ഒന്നിലധികം ബന്ധങ്ങൾ അനുവദിക്കുന്നു; പ്രത്യേകിച്ച് അടുത്ത വാക്യത്തിലെ മറുപടി ഈ അവ്യക്തതയെ ആശ്രയിക്കുന്നു. അതിനാൽ ഒരു പ്രത്യേക ദൈവശാസ്ത്രവായന പാഠത്തിൽ നിർബന്ധിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ഗ്രീക്കിലെ ക്രിയ–നാമ ആവർത്തനവും ദൈവശാസ്ത്രപരമായി പ്രസക്തമായ ജനിറ്റീവ് അവ്യക്തതയും ഉദ്ദേശപൂർവം സംരക്ഷിച്ചു; അതിനാൽ ‘പ്രവൃത്തികൾ പ്രവർത്തിക്കുക’ എന്ന അല്പം അടയാളപ്പെടുത്തിയ പ്രയോഗം നിലനിർത്തിയിരിക്കുന്നു.
