source:
  edition: SBLGNT
  text: πᾶν ὃ δίδωσίν μοι ὁ πατὴρ πρὸς ἐμὲ ἥξει, καὶ τὸν ἐρχόμενον πρός ⸀με οὐ μὴ ἐκβάλω ἔξω,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/037.yaml
  text: All that the Father gives me will come to me[b][a], and the one who comes to me I will certainly not cast out.
translation:
  language: ml
  text: പിതാവ് എനിക്കു തരുന്നതെല്ലാം എന്റെ അടുക്കൽ വരും.[a] എന്റെ അടുക്കൽ വരുന്നവനെ ഞാൻ ഒരിക്കലും പുറത്താക്കുകയില്ല.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘പിതാവ് എനിക്കു നൽകുന്നതൊക്കെയും എന്റെ അടുക്കൽ വരും.’ ഗ്രീക്കിൽ നപുംസക ഏകവചനത്തിലുള്ള ഒരു സമാഹാരപ്രയോഗമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: ‘ഞാൻ ഒരു കാരണവശാലും പുറത്താക്കുകയില്ല.’ ഗ്രീക്കിലുള്ള നിഷേധപ്രയോഗം വളരെ ഊന്നിയതാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν ὃ
  choice: തരുന്നതെല്ലാം
  rationale: നപുംസക ഏകവചനത്തിലുള്ള സമാഹാരപ്രയോഗത്തിന്റെ കൂട്ടായ അർഥം നിലനിർത്തുന്നു; അതിനെ വ്യക്തികളെ സൂചിപ്പിക്കുന്ന ‘എല്ലാവരും’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: δίδωσίν μοι
  choice: എനിക്കു തരുന്നു
  rationale: വർത്തമാനകാല ക്രിയയെ സ്വാഭാവികമായ ലളിതവർത്തമാനമായി നൽകുന്നു; പ്രവൃത്തി പൂർത്തിയായതാണെന്നോ തുടർച്ചയായിക്കൊണ്ടിരിക്കുകയാണെന്നോ അധികമായി നിർണയിക്കുന്നില്ല.
- source_word: ὁ πατήρ
  choice: പിതാവ്
  rationale: ഗ്രീക്കിലുള്ള നിർദിഷ്ട പിതൃസംബോധന നിലനിർത്തുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘എന്റെ’ എന്ന ഉടമസൂചകം ചേർക്കുന്നില്ല.
- source_word: πρὸς ἐμὲ ἥξει
  choice: എന്റെ അടുക്കൽ വരും
  rationale: യോഹന്നാന്റെ സന്ദർഭത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രയോഗം; ഭാവികാലത്തിന്റെ ഉറപ്പ് നിലനിർത്തുന്നു.
- source_word: τὸν ἐρχόμενον πρός με
  choice: എന്റെ അടുക്കൽ വരുന്നവനെ
  rationale: നിർദിഷ്ട ആർട്ടിക്കിളോടുകൂടിയ വർത്തമാന കൃദന്തത്തെ സ്വാഭാവികമായ പൊതുവ്യക്തിസൂചനയായി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: οὐ μὴ ἐκβάλω ἔξω
  choice: ഞാൻ ഒരിക്കലും പുറത്താക്കുകയില്ല
  rationale: οὐ μή എന്ന ഊന്നിയ നിഷേധം ‘ഒരിക്കലും ... ഇല്ല’ എന്ന സ്വാഭാവിക മലയാളത്തിലൂടെ അറിയിക്കുന്നു; ἐκβάλω ἔξωയിലെ പുറത്തേക്കുള്ള തള്ളിക്കളയൽ ‘പുറത്താക്കുക’ എന്നതിൽ സംക്ഷിപ്തമായി ഉൾക്കൊള്ളുന്നു.
theological_decisions:
- issue: ദൈവം നൽകുന്നതും മനുഷ്യൻ വരുന്നതും തമ്മിലുള്ള ബന്ധത്തിൽ πᾶν ὃ എന്ന സമാഹാര നപുംസകപ്രയോഗം
  choice: ‘പിതാവ് എനിക്കു തരുന്നതെല്ലാം’ എന്ന് സമാഹാരരൂപത്തിൽ നിലനിർത്തി.
  alternative: ‘പിതാവ് എനിക്കു തരുന്ന എല്ലാവരും’
  rationale: വ്യക്തികളെ ഉദ്ദേശിക്കുന്നതായി സന്ദർഭം സൂചിപ്പിച്ചാലും ഗ്രീക്ക് വ്യാകരണത്തിലുള്ള നപുംസക ഏകവചന സമാഹാരരൂപം നേരിട്ട് വ്യക്തിവൽക്കരിക്കാതെ സംരക്ഷിക്കുന്നു; കോർപ്പറേറ്റ്-വ്യക്തിഗത വായനകളിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഭാഷയിൽ തീർപ്പാക്കുന്നില്ല.
- issue: οὐ μὴ ἐκβάλω ἔξω എന്ന വാഗ്ദാനത്തിന്റെ ശക്തി
  choice: ‘ഞാൻ ഒരിക്കലും പുറത്താക്കുകയില്ല’ എന്ന ഊന്നിയ ഉറപ്പ്.
  alternative: ‘ഞാൻ തീർച്ചയായും പുറത്താക്കുകയില്ല’
  rationale: യേശു തന്റെ അടുക്കൽ വരുന്നവനെ നിരസിക്കുകയില്ലെന്ന ശക്തമായ നിഷേധം നിലനിർത്തുന്നു; സ്ഥിരതയെയോ വിശ്വാസത്യാഗത്തെയോ കുറിച്ചുള്ള പിന്നീടുള്ള സിദ്ധാന്തനിഗമനങ്ങൾ വാക്യത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അടുക്കൽ’ എന്നത് സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ബൈബിൾസന്ദർഭോചിതമായ പദമായി നിലനിർത്തി; ‘ബഹിഷ്കരിക്കുക’ പോലുള്ള ഔപചാരിക പദം ഒഴിവാക്കി. അടിക്കുറിപ്പുകളുടെ മാർക്കറുകൾ ബന്ധപ്പെട്ട രണ്ടു പ്രസ്താവനകൾക്കുശേഷം [a], [b] എന്ന ക്രമത്തിൽ ചേർത്തു.
