id: JHN.6.4
reference: John 6:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἦν δὲ ἐγγὺς τὸ πάσχα, ἡ ἑορτὴ τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/004.yaml
  text: The Passover[a], the feast of the Jews, was near.
translation:
  language: ml
  text: യെഹൂദന്മാരുടെ പെരുന്നാളായ പെസഹാ[a] അടുത്തിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യെഹൂദ്യരുടെ പെരുന്നാൾ.’ ഗ്രീക്ക് പദത്തിന് സന്ദർഭമനുസരിച്ച് പൊതുവേ യെഹൂദന്മാരെയോ പ്രത്യേകിച്ച് യെഹൂദ്യരെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയില്ല
  rationale: ഇത് നേരിയ ആഖ്യാനബന്ധകമാണ്. മലയാളത്തിൽ വാക്യക്രമവും സന്ദർഭവും ആ ബന്ധം സ്വാഭാവികമായി വഹിക്കുന്നതിനാൽ ‘എന്നാൽ’ പോലുള്ള വിരുദ്ധാർഥസൂചന ചേർത്തില്ല.
- source_word: ἐγγὺς
  choice: അടുത്തിരുന്നു
  rationale: ἦν എന്ന ക്രിയയോടൊപ്പം കാലപരമായ സമീപ്യത സൂചിപ്പിക്കുന്നു; ‘അടുത്തിരുന്നു’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: πάσχα
  choice: പെസഹാ
  rationale: യഹൂദരുടെ Passover പെരുന്നാളിന് മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും കൃത്യവുമായ പേരാണിത്.
- source_word: ἑορτὴ
  choice: പെരുന്നാൾ
  rationale: ആരാധനാപരമായ ഉത്സവാചരണത്തെ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി അറിയിക്കുന്ന പദം.
- source_word: τῶν Ἰουδαίων
  choice: യെഹൂദന്മാരുടെ
  rationale: ഈ സന്ദർഭത്തിൽ പെസഹാ യെഹൂദജനതയുടെ മതപരമായ പെരുന്നാളാണെന്ന വിശാല അർഥമാണ് ഏറ്റവും യോജിച്ചത്; ‘യെഹൂദ്യരുടെ’ എന്ന പ്രാദേശിക അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
theological_decisions:
- issue: യോഹന്നാനിലെ Ἰουδαίων എന്ന പദത്തിന്റെ അർഥം
  choice: യെഹൂദന്മാരുടെ
  alternative: യെഹൂദ്യരുടെ
  rationale: പദത്തിന് സന്ദർഭാനുസരണം യെഹൂദജനതയെയോ യെഹൂദ്യപ്രദേശക്കാരെയോ സൂചിപ്പിക്കാം. ഇവിടെ പെസഹാ ഒരു ജനതയുടെ മതപരമായ പെരുന്നാളായി പരാമർശിക്കപ്പെടുന്നതിനാൽ ‘യെഹൂദന്മാരുടെ’ എന്നത് മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; മൂലത്തിലെ യഥാർഥ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘പെസഹാ’ എന്ന പരിചിതമായ ബൈബിൾപദവും ‘പെരുന്നാൾ’ എന്ന പൊതുഗ്രാഹ്യമായ ആരാധനാപര പദവും ഉപയോഗിച്ചു; δὲ-യ്ക്ക് അനാവശ്യമായ വിരുദ്ധബന്ധകം ചേർത്തില്ല.
