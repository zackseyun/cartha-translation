  source_fidelity: The Malayalam accurately conveys ἦν δὲ ἐγγὺς τὸ πάσχα, ἡ ἑορτὴ τῶν Ἰουδαίων. ‘അടുത്തിരുന്നു’ properly expresses temporal nearness, and ‘യെഹൂദന്മാരുടെ പെരുന്നാളായ’ naturally renders the appositional identification of Passover as the Jews’ feast. The mild connective δέ need not be represented by a separate Malayalam word here.
