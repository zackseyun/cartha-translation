id: JHN.6.23
reference: John 6:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ἀλλὰ ἦλθεν ⸀πλοιάρια ἐκ Τιβεριάδος ἐγγὺς τοῦ τόπου ὅπου ἔφαγον τὸν ἄρτον εὐχαριστήσαντος τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/023.yaml
  text: But boats came from Tiberias near the place where they ate the bread after the Lord had given thanks[a].
translation:
  language: ml
  text: എന്നാൽ കർത്താവ് നന്ദി പറഞ്ഞശേഷം അവർ അപ്പം ഭക്ഷിച്ച സ്ഥലത്തിനടുത്ത് തിബെര്യാസ് പട്ടണത്തിൽനിന്ന് വള്ളങ്ങൾ വന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തോട് കൂടുതൽ ചേർന്ന്: “ചെറിയ വള്ളങ്ങൾ.” ഗ്രീക്കിലെ πλοιάρια ഒരു ചെറുത്വസൂചക രൂപമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: എന്നാൽ
  rationale: മുൻസാഹചര്യത്തോട് വൈരുധ്യം സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ സംയോജകപദം.
- source_word: ἦλθεν
  choice: വന്നിരുന്നു
  rationale: തുടർന്നുള്ള വിവരണത്തിന്റെ പശ്ചാത്തലമായി ഇതിനകം സംഭവിച്ച വരവ് മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിൽ ക്രിയ ഏകവചനമായിരുന്നാലും നപുംസക ബഹുവചനമായ πλοιάρια-യോടുള്ള സാധാരണ പൊരുത്തമാണിത്.
- source_word: πλοιάρια
  choice: വള്ളങ്ങൾ
  rationale: ജലഗതാഗതത്തിനുള്ള ചെറിയ യാനങ്ങളെ സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; diminutive ഭാവം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἐκ Τιβεριάδος
  choice: തിബെര്യാസ് പട്ടണത്തിൽനിന്ന്
  rationale: ഉത്ഭവസ്ഥലം വ്യക്തമായി അറിയിക്കുന്നു; പരിചയമില്ലാത്ത വായനക്കാർക്കായി അത് ഒരു പട്ടണമാണെന്നത് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἐγγὺς τοῦ τόπου
  choice: സ്ഥലത്തിനടുത്തേക്ക്
  rationale: വള്ളങ്ങളുടെ വരവിന്റെ ലക്ഷ്യപ്രദേശവും സ്ഥലസാമീപ്യവും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὅπου ἔφαγον τὸν ἄρτον
  choice: അവർ അപ്പം ഭക്ഷിച്ച
  rationale: മുമ്പ് പരാമർശിച്ച നിർദിഷ്ട അപ്പത്തെയും കഴിഞ്ഞ സംഭവത്തെയും ലളിതമായി നിലനിർത്തുന്നു.
- source_word: εὐχαριστήσαντος τοῦ κυρίου
  choice: കർത്താവ് നന്ദി പറഞ്ഞശേഷം
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് ഘടനയിലെ മുൻകാലിക ബന്ധം വ്യക്തമായി നൽകുകയും κύριος എന്ന ബഹുമാനപദം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: κύριος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: കർത്താവ്
  alternative: യജമാനൻ
  rationale: ഇവിടെ യേശുവിനെ സൂചിപ്പിക്കുന്ന ബഹുമാനപദവും ക്രിസ്തുശാസ്ത്രപരമായ അനുരണനവും ‘കർത്താവ്’ നിലനിർത്തുന്നു; ‘യജമാനൻ’ അർത്ഥപരിധി അനാവശ്യമായി ചുരുക്കും.
- issue: നന്ദിപറച്ചിലും അപ്പം ഭക്ഷിച്ചതും തമ്മിലുള്ള ബന്ധം
  choice: കർത്താവ് നന്ദി പറഞ്ഞശേഷം അവർ അപ്പം ഭക്ഷിച്ചു
  alternative: കർത്താവ് നന്ദി പറഞ്ഞതിനാൽ അവർ അപ്പം ഭക്ഷിച്ചു
  rationale: εὐχαριστήσαντος എന്ന പങ്കുപദം ഇവിടെ സ്വാഭാവികമായി മുൻകാലിക സാഹചര്യം സൂചിപ്പിക്കുന്നു; കാരണബന്ധം പാഠത്തിൽനിന്ന് നിർബന്ധമായി വരാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. പ്രധാന വാക്യത്തിലെ സ്വാഭാവികതയ്ക്കായി ‘വള്ളങ്ങൾ’ ഉപയോഗിച്ച് ഗ്രീക്ക് പദത്തിലെ ചെറുത്വഭാവം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
