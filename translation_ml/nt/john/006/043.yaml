  yaml_path: translation/nt/john/006/043.yaml
  text: Jesus answered and said to them[b][a], “Do not grumble among yourselves.”
translation:
  language: ml
  text: 'യേശു അവരോടു മറുപടിയായി പറഞ്ഞു: “നിങ്ങൾ തമ്മിൽ പിറുപിറുക്കരുത്.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “പരസ്പരം പിറുപിറുക്കരുത്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ... καὶ εἶπεν
  choice: മറുപടിയായി പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ഇരട്ട ആഖ്യാനപ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ‘മറുപടി പറഞ്ഞു’ എന്നതിനെക്കാൾ ‘മറുപടിയായി പറഞ്ഞു’ സുഗമമാണ്.
- source_word: Μὴ γογγύζετε
  choice: പിറുപിറുക്കരുത്
  rationale: μή സഹിതമുള്ള വർത്തമാനകാല ആജ്ഞാരൂപത്തെ പൊതുവായ വിലക്കായി പരിഭാഷപ്പെടുത്തുന്നു; പ്രവൃത്തി ഇതിനകം നടക്കുകയാണെന്ന് നിർബന്ധമായി തീരുമാനിക്കുന്ന ‘പിറുപിറുക്കുന്നത് നിർത്തുക’ ഒഴിവാക്കുന്നു. ‘പിറുപിറുക്കുക’ പരാതിയോടുകൂടിയ അടക്കമുള്ള മുറുമുറുപ്പിനെയും തിരുവെഴുത്തിലെ മരുഭൂമി-പ്രതിധ്വനിയെയും നന്നായി വഹിക്കുന്നു.
- source_word: μετ’ ἀλλήλων
  choice: നിങ്ങൾ തമ്മിൽ
  rationale: കൂട്ടത്തിനുള്ളിലെ പരസ്പര പ്രവർത്തനം സ്വാഭാവികവും വ്യക്തവുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: Ἰησοῦς
  choice: യേശു
  rationale: മലയാളത്തിലെ സ്ഥിരപ്രചാരത്തിലുള്ള നാമരൂപം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. മൂലത്തിലെ വിലക്കിന്റെ കാലഭാവസന്ദിഗ്ധത അമിതമായി നിർണയിച്ചിട്ടില്ല.
