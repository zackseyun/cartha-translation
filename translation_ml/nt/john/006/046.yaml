id: JHN.6.46
reference: John 6:46
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐχ ὅτι τὸν πατέρα ⸂ἑώρακέν τις⸃ εἰ μὴ ὁ ὢν παρὰ τοῦ θεοῦ, οὗτος ἑώρακεν τὸν πατέρα.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/046.yaml
  text: Not that anyone has seen the Father[a], except the one who is from God; he has seen the Father.
translation:
  language: ml
  text: ആരെങ്കിലും പിതാവിനെ കണ്ടിട്ടുണ്ട് എന്നല്ല; ദൈവത്തിൽനിന്നുള്ളവൻ ഒഴികെ ആരും പിതാവിനെ കണ്ടിട്ടില്ല. അവൻ പിതാവിനെ കണ്ടിട്ടുണ്ട്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐχ ὅτι
  choice: എന്നല്ല
  rationale: മുൻപ്രസ്താവനയെ നിഷേധിക്കാതെ അതിന്റെ അർഥം വ്യക്തമാക്കുന്ന തിരുത്തൽഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τὸν πατέρα
  choice: പിതാവിനെ
  rationale: യോഹന്നാനിലെ ദൈവത്തെ സൂചിപ്പിക്കുന്ന പിതൃനാമപ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἑώρακέν τις
  choice: ആരെങ്കിലും ... കണ്ടിട്ടുണ്ട്
  rationale: നിഷേധസന്ദർഭത്തിലെ τις എന്നതിനെ ‘ആരെങ്കിലും’ എന്നും, പൂർത്തിയായ ദർശനത്തിന്റെ ഇപ്പോഴത്തെ പ്രസക്തിയുള്ള perfect രൂപത്തെ ‘കണ്ടിട്ടുണ്ട്’ എന്നും നൽകുന്നു.
- source_word: εἰ μὴ
  choice: ഒഴികെ
  rationale: ഇവിടെ ഉപാധിയല്ല, വ്യക്തമായ അപവാദമാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ὁ ὢν
  choice: '... ഉള്ളവൻ'
  rationale: ഒരു വ്യക്തിയെ തുടരുന്ന ബന്ധമോ നിലയോ മുഖേന തിരിച്ചറിയിക്കുന്ന substantival present participle മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: παρὰ τοῦ θεοῦ
  choice: ദൈവത്തിൽനിന്നുള്ളവൻ
  rationale: παρά + genitive-ന്റെ ഉറവിടം/ഉത്ഭവം എന്ന പ്രധാന അർഥം നിലനിർത്തുന്നു; വ്യക്തിപരമായ സാമീപ്യസൂചന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: οὗτος
  choice: അവൻ
  rationale: മുൻപ് തിരിച്ചറിയിച്ച വ്യക്തിയിലേക്കുള്ള സൂചന മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἑώρακεν
  choice: കണ്ടിട്ടുണ്ട്
  rationale: ഗ്രീക്ക് perfect-ന്റെ പൂർത്തീകരണവും നിലനിൽക്കുന്ന പ്രസക്തിയും കഴിയുന്നത്ര വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: παρὰ τοῦ θεοῦ എന്നതിൽ പുത്രനും ദൈവവും തമ്മിലുള്ള ബന്ധം
  choice: ദൈവത്തിൽനിന്നുള്ളവൻ
  alternative: ദൈവത്തിന്റെ സന്നിധിയിൽനിന്നുള്ളവൻ; ദൈവത്തോടുകൂടെ ഉള്ളവൻ
  rationale: പ്രധാനപാഠത്തിൽ ദൈവിക ഉറവിടം/ബന്ധം വ്യക്തമാക്കുന്നു; എന്നാൽ പദപ്രയോഗം നിർബന്ധമാക്കാത്ത തത്ത്വശാസ്ത്രപരമായ വിശദീകരണം ചേർക്കുന്നില്ല. വ്യക്തിപരമായ സാമീപ്യത്തിന്റെ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘എന്നല്ല’ എന്ന ഘടന മുൻവാക്യത്തോടുള്ള വിശദീകരണബന്ധം നിലനിർത്തുന്നു; ആവർത്തിക്കുന്ന ‘പിതാവിനെ കണ്ടിട്ടുണ്ട്’ മൂലപാഠത്തിന്റെ ഊന്നൽ സംരക്ഷിക്കുന്നു.
