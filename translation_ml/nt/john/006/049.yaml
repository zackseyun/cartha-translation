  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ πατέρες ὑμῶν ἔφαγον ⸂ἐν τῇ ἐρήμῳ τὸ μάννα⸃ καὶ ἀπέθανον·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/049.yaml
  text: Your fathers ate the manna in the wilderness[a], and they died.
translation:
  language: ml
  text: നിങ്ങളുടെ പിതാക്കന്മാർ[a] മരുഭൂമിയിൽ മന്നാ തിന്നു; അവർ മരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങളുടെ പൂർവികർ.” ഗ്രീക്കിൽ അക്ഷരാർഥം “നിങ്ങളുടെ പിതാക്കന്മാർ” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πατέρες ὑμῶν
  choice: നിങ്ങളുടെ പിതാക്കന്മാർ
  rationale: πατέρες എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘പിതാക്കന്മാർ’ നിലനിർത്തുന്നു; ഇവിടെ അത് മരുഭൂമിയിലൂടെ സഞ്ചരിച്ച ഇസ്രായേലിന്റെ മുൻതലമുറയെ സൂചിപ്പിക്കുന്നു.
- source_word: ἔφαγον
  choice: തിന്നു
  rationale: ἐσθίω എന്ന ക്രിയയുടെ ലളിതമായ ഭൂതകാലപ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ ‘തിന്നു’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: ἐν τῇ ἐρήμῳ
  choice: മരുഭൂമിയിൽ
  rationale: പുറപ്പാടുകാലത്തെ ഇസ്രായേലിന്റെ മരുഭൂമിയാത്രയോടുള്ള തിരുവെഴുത്തുപരമായ ബന്ധം കാത്തുസൂക്ഷിക്കുന്ന സ്വാഭാവിക പ്രയോഗം.
- source_word: τὸ μάννα
  choice: മന്നാ
  rationale: അറിയപ്പെട്ട മരുഭൂമിഭക്ഷണത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരപ്രയോഗം; മലയാളത്തിൽ നിർദേശകഭാവം സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: καὶ ἀπέθανον
  choice: എന്നിട്ടും അവർ മരിച്ചു
  rationale: 'καί ഇവിടെ മുൻവാക്യത്തോടുള്ള പ്രസക്തമായ വൈരുധ്യം വഹിക്കുന്നു: മന്നാ തിന്നിട്ടും അവർ മരണത്തിൽനിന്ന് ഒഴിവായില്ല. ‘അവർ’ ചേർക്കുന്നത് മലയാളത്തിൽ വ്യക്തത നൽകുന്നു.'
theological_decisions:
- issue: ഇസ്രായേലിന്റെ മരുഭൂമിതലമുറയിലേക്കുള്ള പരാമർശം
  choice: നിങ്ങളുടെ പിതാക്കന്മാർ
  alternative: നിങ്ങളുടെ പൂർവികർ
  rationale: ‘പിതാക്കന്മാർ’ ഗ്രീക്കിലെ രൂപവും യേശുവിന്റെ അഭിസംബോധനയിലെ വംശപരവും പ്രതിനിധാനപരവുമായ ശക്തിയും നിലനിർത്തുന്നു; ‘പൂർവികർ’ അർഥസാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: മന്നാ തിന്നതും മരിച്ചതും തമ്മിലുള്ള ബന്ധം
  choice: എന്നിട്ടും അവർ മരിച്ചു
  alternative: അവർ മരിച്ചു
  rationale: സന്ദർഭത്തിൽ മന്നാ തിന്നതുകൊണ്ട് നിത്യജീവൻ ലഭിച്ചില്ലെന്ന വൈരുധ്യം ഉണ്ട്. ‘എന്നിട്ടും’ അത് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; പുതിയ സിദ്ധാന്തപരമായ വിശദീകരണം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മന്നാ’, ‘മരുഭൂമി’ എന്നീ പരിചിതമായ തിരുവെഴുത്തുപദങ്ങൾ നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നം വാക്യാവസാനത്തിൽ ചേർത്തിരിക്കുന്നു.
