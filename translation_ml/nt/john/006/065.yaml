id: JHN.6.65
reference: John 6:65
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἔλεγεν· Διὰ τοῦτο εἴρηκα ὑμῖν ὅτι οὐδεὶς δύναται ἐλθεῖν πρός με ἐὰν μὴ ᾖ δεδομένον αὐτῷ ἐκ τοῦ ⸀πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/065.yaml
  text: And he was saying[b][a], “For this reason I have told you that no one is able to come to me unless it has been given to him from the Father.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞുകൊണ്ടിരുന്നു: “ഇക്കാരണത്താലാണ് ഞാൻ നിങ്ങളോടു പറഞ്ഞത്: പിതാവിൽനിന്ന് അത് അവന്[b] നൽകപ്പെട്ടിട്ടില്ലെങ്കിൽ[a], ആർക്കും എന്റെ അടുക്കൽ വരാൻ കഴിയില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “പിതാവിൽനിന്ന് അത് അവന് അനുവദിക്കപ്പെട്ടിട്ടില്ലെങ്കിൽ.”
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ ഇവിടെ പുല്ലിംഗ ഏകവചനമായ “അവന്” എന്നാണ്; എന്നാൽ അത് പൊതുവായി ഏതൊരു വ്യക്തിയെയും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം സംഭാഷണസന്ദർഭത്തിലെ തുടർച്ചയായ പ്രസ്താവനയെ സൂചിപ്പിക്കുന്നതിനാൽ അതിന്റെ ദൈർഘ്യഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Διὰ τοῦτο
  choice: ഇക്കാരണത്താലാണ്
  rationale: മുൻപുള്ള ആശയത്തിലേക്കു തിരിഞ്ഞുനോക്കി ഇപ്പോഴത്തെ വിശദീകരണം അവതരിപ്പിക്കുന്ന ബന്ധം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: εἴρηκα
  choice: ഞാൻ നിങ്ങളോടു പറഞ്ഞത്
  rationale: മുമ്പ് പറഞ്ഞ വാക്കിന് ഇപ്പോഴും പ്രസക്തിയുണ്ടെന്ന പൂർണകാലത്തിന്റെ ആശയം മലയാളസന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: οὐδεὶς δύναται
  choice: ആർക്കും ... കഴിയില്ല
  rationale: അനുമതിയുടെ അഭാവമല്ല, കഴിവില്ലായ്മയാണ് ഗ്രീക്ക് പ്രയോഗം വ്യക്തമാക്കുന്നത്; മലയാളത്തിലെ ഈ ഘടന അത് നേരിട്ട് അറിയിക്കുന്നു.
- source_word: ἐλθεῖν πρός με
  choice: എന്റെ അടുക്കൽ വരാൻ
  rationale: യോഹന്നാന്റെ സന്ദർഭത്തിലെ ബന്ധപരവും വിശ്വാസസംബന്ധവുമായ അർഥസാധ്യത വികസിപ്പിക്കാതെ നിലനിർത്തുന്ന സ്വാഭാവിക പ്രയോഗം.
- source_word: ἐὰν μὴ ᾖ δεδομένον
  choice: അത് ... നൽകപ്പെട്ടിട്ടില്ലെങ്കിൽ
  rationale: δίδωμι എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥവും ഗ്രീക്കിലെ കർമണിപ്രയോഗവും സംരക്ഷിക്കുന്നു; 'അനുവദിക്കപ്പെട്ടിട്ടില്ലെങ്കിൽ' എന്ന അർഥവും സാധ്യമാണ്.
- source_word: αὐτῷ
  choice: അവന്
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ഏകവചനരൂപം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അത് പൊതുവായ മനുഷ്യസൂചനയായാണ് പ്രവർത്തിക്കുന്നത്.
- source_word: ἐκ τοῦ πατρός
  choice: പിതാവിൽനിന്ന്
  rationale: ἐκ സൂചിപ്പിക്കുന്ന ഉറവിടം/ഉത്ഭവം എന്ന അർഥം കർമകർത്താവിനെ മാത്രം മുൻനിർത്തുന്ന 'പിതാവിനാൽ' എന്നതിനെക്കാൾ നേരിട്ട് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ അടുക്കൽ വരുന്നതിലെ ദൈവിക പ്രാപ്തീകരണവും മനുഷ്യന്റെ കഴിവും
  choice: പിതാവിൽനിന്ന് നൽകപ്പെടാതെ ആർക്കും യേശുവിന്റെ അടുക്കൽ വരാൻ കഴിയില്ലെന്ന അനിവാര്യ വ്യവസ്ഥ നേരിട്ട് വിവർത്തനം ചെയ്തു.
  alternative: ഇത് ഫലപ്രദമായ ദൈവിക ദാനമാണെന്നോ എല്ലാവർക്കും മുൻകൂട്ടി ലഭിക്കുന്ന പ്രാപ്തീകരണമാണെന്നോ വിവർത്തനത്തിൽ വിശദീകരിക്കുക.
  rationale: ഗ്രീക്ക് വാക്യം ആവശ്യമായ ഒരു വ്യവസ്ഥ വ്യക്തമാക്കുന്നുവെങ്കിലും ആ ദാനത്തിന്റെ സ്വഭാവമോ വ്യാപ്തിയോ സംബന്ധിച്ച പിൽക്കാല ദൈവശാസ്ത്രവാദങ്ങൾ തീർപ്പാക്കുന്നില്ല.
- issue: αὐτῷ എന്ന പൊതുവായ പുല്ലിംഗ ഏകവചനം
  choice: പ്രധാനപാഠത്തിൽ ‘അവന്’ എന്നു നിലനിർത്തി, അതിന്റെ പൊതുവായ പ്രയോഗം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: ‘ആ വ്യക്തിക്ക്’ എന്ന ലിംഗനിരപേക്ഷ രൂപം ഉപയോഗിക്കുക.
  rationale: മൂലപാഠത്തിന്റെ വ്യാകരണരൂപം മറച്ചുവയ്ക്കാതെ, അതിന് പുരുഷന്മാരിൽ മാത്രം ഒതുങ്ങാത്ത പൊതുവായ പ്രാബല്യമുണ്ടെന്ന് വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘പറഞ്ഞുകൊണ്ടിരുന്നു’ എന്നത് ഗ്രീക്കിലെ അപൂർണ ഭൂതകാലത്തിന്റെ തുടർച്ചാഭാവം സൂക്ഷിക്കുന്നു; ‘പിതാവിൽനിന്ന്’ ഉറവിടസൂചനയും ‘നൽകപ്പെട്ടിട്ടില്ലെങ്കിൽ’ കർമണിഭാവവും നിലനിർത്തുന്നു.
