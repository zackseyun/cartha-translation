  text: Then what if you were to see the Son of Man ascending to where he was before?[a]
translation:
  language: ml
  text: അപ്പോൾ മനുഷ്യപുത്രൻ മുമ്പ് ഉണ്ടായിരുന്നിടത്തേക്ക് കയറിപ്പോകുന്നത് നിങ്ങൾ കണ്ടാലോ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു വിവർത്തനം: “അപ്പോൾ മനുഷ്യപുത്രൻ മുമ്പ് ഉണ്ടായിരുന്നിടത്തേക്ക് കയറിപ്പോകുന്നത് നിങ്ങൾ കാണുന്നുവെങ്കിൽ?” ഗ്രീക്കിൽ ഇത് ഒരു അലങ്കാരപരമായ വ്യവസ്ഥാപരമായ ചോദ്യമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: അങ്ങനെയെങ്കിൽ ... കണ്ടാലോ?
  rationale: οὖν എന്നതിന്റെ അനുമാനാത്മകമായ തുടർച്ചയും ἐὰν എന്നതിന്റെ വ്യവസ്ഥാഭാവവും ചേർത്ത്, ഗ്രീക്കിലെ അപൂർണമായി വിടുന്ന അലങ്കാരചോദ്യത്തിന്റെ സ്വഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: θεωρῆτε
  choice: നിങ്ങൾ കണ്ടാലോ
  rationale: θεωρέω ശ്രദ്ധയോടെ കാണുക എന്ന സൂക്ഷ്മത ഉൾക്കൊള്ളാമെങ്കിലും, ഇവിടെ വ്യവസ്ഥാപരവും ഭാവിസാധ്യത സൂചിപ്പിക്കുന്നതുമായ പ്രയോഗത്തിന് ‘കണ്ടാലോ’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: സുവിശേഷങ്ങളിൽ യേശു ഉപയോഗിക്കുന്ന സ്ഥിരമായ സ്വയംവിശേഷണവും ദാനീയേൽസംബന്ധിയായ പ്രതിധ്വനികളുള്ള പദവിയുമായതിനാൽ പരാവർത്തനം ചെയ്യാതെ അംഗീകൃത രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀναβαίνοντα
  choice: കയറിപ്പോകുന്നത്
  rationale: മുകളിലേക്കുള്ള സഞ്ചാരം നേരിട്ട് അറിയിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്; ‘ആരോഹണം ചെയ്യുന്നത്’ എന്നതിനെക്കാൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്, അതേസമയം സ്വർഗീയ ദിശാസൂചന വ്യാഖ്യാനമായി കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: ὅπου ἦν τὸ πρότερον
  choice: മുമ്പ് ഉണ്ടായിരുന്നിടത്തേക്ക്
  rationale: മുൻകാലത്തെ സ്ഥാനമോ അവസ്ഥയോ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് വാചകത്തിന്റെ അർഥം നിലനിർത്തുന്നു; ‘സ്വർഗത്തിലേക്ക്’ അല്ലെങ്കിൽ ‘പിതാവിന്റെ അടുക്കലേക്ക്’ എന്ന് വാചകത്തിൽ ഇല്ലാത്ത വിശദീകരണം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: യേശുവിന്റെ കയറിപ്പോകലിനെ മുൻഅസ്തിത്വത്തിന്റെയും സ്വർഗീയ ഉത്ഭവത്തിന്റെയും വ്യക്തമായ വ്യാഖ്യാനമായി പരിഭാഷയിൽ വികസിപ്പിക്കണമോ
  choice: ‘മുമ്പ് ഉണ്ടായിരുന്നിടത്തേക്ക്’ എന്ന് മാത്രം നിലനിർത്തുക
  alternative: ‘മുമ്പ് ഉണ്ടായിരുന്ന സ്വർഗത്തിലേക്ക്’ / ‘മുമ്പ് ഉണ്ടായിരുന്ന പിതാവിന്റെ അടുക്കലേക്ക്’
  rationale: വാചകം മുൻഅസ്തിത്വവും കയറിപ്പോകലും ശക്തമായി സൂചിപ്പിക്കുന്നുവെങ്കിലും, സ്ഥലം ‘സ്വർഗം’ എന്നോ ‘പിതാവിന്റെ അടുക്കൽ’ എന്നോ ഗ്രീക്ക് വ്യക്തമാക്കുന്നില്ല. അതിനാൽ ക്രിസ്തുശാസ്ത്രപരമായ ശക്തി നിലനിർത്തിക്കൊണ്ട് വിശദീകരണം ചേർക്കുന്നില്ല.
- issue: ഗ്രീക്കിലെ വ്യവസ്ഥാപരമായ അലങ്കാരചോദ്യത്തെ മലയാളത്തിൽ പൂർത്തിയായ ഫലവാക്യമായി വ്യക്തമാക്കണമോ
  choice: ‘കണ്ടാലോ?’ എന്ന തുറന്ന അലങ്കാരചോദ്യമായി നിലനിർത്തുക
  alternative: ‘അപ്പോൾ നിങ്ങൾ എന്തു പറയും?’ അല്ലെങ്കിൽ ‘അപ്പോൾ നിങ്ങൾ കൂടുതൽ ഇടറുകയില്ലേ?’ എന്നു ഫലം കൂട്ടിച്ചേർക്കുക
  rationale: ഗ്രീക്കിൽ വ്യവസ്ഥാവാക്യം മാത്രം ചോദ്യസ്വരത്തിൽ നിൽക്കുന്നു; ഫലം സന്ദർഭത്തിൽനിന്ന് ഗ്രഹിക്കേണ്ടതാണ്. അതിനാൽ വാചകം പറയാത്ത പ്രതികരണം ചേർക്കാതെ യഥാർഥമായ ആശയസന്ദിഗ്ധത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘മനുഷ്യപുത്രൻ’ എന്ന സ്ഥിരപദവി സംരക്ഷിച്ചു; ‘കയറിപ്പോകുന്നത്’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന രൂപമായി തിരഞ്ഞെടുത്തു. വാചകത്തിൽ വ്യക്തമല്ലാത്ത സ്വർഗം, പിതാവ്, അല്ലെങ്കിൽ ശ്രോതാക്കളുടെ പ്രതീക്ഷിത പ്രതികരണം എന്നിവ ചേർത്തിട്ടില്ല.
