  terminology: «മനുഷ്യപുത്രൻ» is the established and appropriate rendering of ὁ υἱὸς τοῦ ἀνθρώπου. «മുമ്പ് ഉണ്ടായിരുന്നിടത്തേക്ക്» preserves the source’s deliberate lack of an explicit naming of heaven or the Father.
