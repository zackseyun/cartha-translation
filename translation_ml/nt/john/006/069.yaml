    rationale: The Greek joins ‘have believed’ and ‘have come to know’ with καί. Malayalam ‘വിശ്വസിക്കുകയും … അറിയുകയും ചെയ്തിരിക്കുന്നു’ more naturally retains their coordination and resulting-state sense.
