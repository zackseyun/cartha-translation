  text: καὶ ἡμεῖς πεπιστεύκαμεν καὶ ἐγνώκαμεν ὅτι σὺ εἶ ὁ ⸀ἅγιος τοῦ ⸀θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/069.yaml
  text: And we have believed and have come to know that you are the Holy One of God[a][b].
translation:
  language: ml
  text: ഞങ്ങൾ വിശ്വസിക്കുകയും നീ ദൈവത്തിന്റെ പരിശുദ്ധൻ[a][b] ആണെന്ന് അറിയുകയും ചെയ്തിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ, “മിശിഹാ, ജീവനുള്ള ദൈവത്തിന്റെ പുത്രൻ” എന്നു വായിക്കുന്നു.
    reason: textual_variant
  - marker: b
    text: അഥവാ, “ദൈവത്തിൽനിന്നുള്ള പരിശുദ്ധൻ.” ഗ്രീക്ക് ഷഷ്ഠിവിഭക്തിക്ക് ബന്ധമോ ഉറവിടമോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς
  choice: ഞങ്ങളോ
  rationale: വ്യക്തമായി ചേർത്തിരിക്കുന്ന സർവനാമത്തിന്റെ ഊന്നൽ ‘ഞങ്ങളോ’ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: πεπιστεύκαμεν
  choice: വിശ്വസിച്ചിരിക്കുന്നു
  rationale: പൂർണകാലരൂപം മുൻപ് ഉണ്ടായ വിശ്വാസവും ഇപ്പോഴും നിലനിൽക്കുന്ന അതിന്റെ ഫലാവസ്ഥയും സൂചിപ്പിക്കുന്നു.
- source_word: ἐγνώκαμεν
  choice: അറിഞ്ഞുമിരിക്കുന്നു
  rationale: അറിവിലേക്കെത്തിയതും ആ അറിവ് ഇപ്പോൾ നിലനിൽക്കുന്നതുമായ പൂർണകാലഭാവം സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὅτι
  choice: എന്ന്
  rationale: വിശ്വാസത്തിന്റെയും അറിവിന്റെയും ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന ഘടകമായി മലയാളത്തിൽ ‘എന്ന്’ സ്വാഭാവികമാണ്.
- source_word: ὁ ἅγιος
  choice: പരിശുദ്ധൻ
  rationale: വിശേഷണം നാമവത്കരിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദപ്രയോഗത്തെ ക്രിസ്തുവിനുള്ള ഒരു പ്രത്യേക ശീർഷകമായി ‘പരിശുദ്ധൻ’ നേരിട്ട് നൽകുന്നു.
- source_word: τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ
  rationale: ബന്ധം, ഉടമസ്ഥത, അല്ലെങ്കിൽ ഉറവിടം സൂചിപ്പിക്കാവുന്ന ഗ്രീക്ക് ഷഷ്ഠിവിഭക്തിയുടെ വിശാലത മലയാള ഷഷ്ഠിവിഭക്തി പരമാവധി നിലനിർത്തുന്നു.
theological_decisions:
- issue: യോഹന്നാൻ 6:69-ലെ ക്രിസ്തുശാസ്ത്രപരമായ ശീർഷകം
  choice: ദൈവത്തിന്റെ പരിശുദ്ധൻ
  alternative: ദൈവത്തിൽനിന്നുള്ള പരിശുദ്ധൻ; മിശിഹാ, ജീവനുള്ള ദൈവത്തിന്റെ പുത്രൻ
  rationale: SBLGNT-യിലെ ὁ ἅγιος τοῦ θεοῦ നേരിട്ട് പരിഭാഷപ്പെടുത്തി; മത്തായി 16:16-നോടോ പിൽക്കാല കൈയെഴുത്തുപ്രതി വികസനങ്ങളോടോ സമന്വയിപ്പിച്ചില്ല. ‘ദൈവത്തിന്റെ’ എന്നത് ഷഷ്ഠിവിഭക്തിയിലെ ബന്ധത്തെ ഉറവിടമെന്ന ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഞങ്ങളോ’ മൂലത്തിലെ ഊന്നൽ നിലനിർത്തുന്നു; ഇരട്ട പൂർണകാലരൂപങ്ങളുടെ തുടർച്ചയായ ഫലാവസ്ഥ ‘വിശ്വസിച്ചിരിക്കുന്നു … അറിഞ്ഞുമിരിക്കുന്നു’ എന്ന സമാന്തരഘടനയിൽ സംരക്ഷിച്ചു.
