  source_fidelity: The draft correctly represents both Greek perfect verbs, the content clause, and the title ὁ ἅγιος τοῦ θεοῦ. However, the contrastive particle in ‘ഞങ്ങളോ’ overstates the emphasis of the explicit Greek pronoun ἡμεῖς, which is emphatic but not intrinsically contrastive.
