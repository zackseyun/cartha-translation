id: JHN.6.19
reference: John 6:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐληλακότες οὖν ὡς σταδίους εἴκοσι πέντε ἢ τριάκοντα θεωροῦσιν τὸν Ἰησοῦν περιπατοῦντα ἐπὶ τῆς θαλάσσης καὶ ἐγγὺς τοῦ πλοίου γινόμενον, καὶ ἐφοβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/019.yaml
  text: So when they had rowed about twenty-five or thirty stadia[a], they saw Jesus walking on the sea and coming near the boat[b], and they were afraid.
translation:
  language: ml
  text: അങ്ങനെ, അവർ ഏകദേശം ഇരുപത്തഞ്ചോ മുപ്പതോ സ്റ്റേഡിയം[a] തുഴഞ്ഞുകഴിഞ്ഞപ്പോൾ, യേശു കടലിന്മേൽ[b] നടക്കുന്നതും വള്ളത്തിനടുത്തേക്കു വരുന്നതും കണ്ടു; അവർ ഭയപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: സ്റ്റേഡിയം പുരാതനകാലത്തെ ഒരു ദൂരയളവായിരുന്നു. ഇരുപത്തഞ്ചോ മുപ്പതോ സ്റ്റേഡിയം ഏകദേശം അഞ്ചുമുതൽ ആറുവരെ കിലോമീറ്ററാണ്.
    reason: cultural_note
  - marker: b
    text: ‘കടലിന്മേൽ’ എന്നതിന് പകരം ‘വെള്ളത്തിന്മേൽ’ എന്നും പറയാം. ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘കടലിന്മേൽ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐληλακότες
  choice: തുഴഞ്ഞുകഴിഞ്ഞപ്പോൾ
  rationale: ἐλαύνω എന്ന പദം ഇവിടെ വള്ളം തുഴഞ്ഞു നീക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. പ്രധാന ക്രിയയ്ക്കു മുമ്പ് നടന്ന പ്രവൃത്തി എന്ന പൂർണ്ണകൃതന്തത്തിന്റെ ബന്ധവും ഈ രൂപം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: οὖν
  choice: അങ്ങനെ
  rationale: മുൻവിവരണത്തിൽനിന്നുള്ള കഥാപുരോഗതി സൂചിപ്പിക്കുന്ന ബന്ധകമായി ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: ὡς
  choice: ഏകദേശം
  rationale: ദൂരത്തിന്റെ അളവിനോടൊപ്പം വന്നതിനാൽ ഏകദേശമെന്ന അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: σταδίους εἴκοσι πέντε ἢ τριάκοντα
  choice: ഇരുപത്തഞ്ചോ മുപ്പതോ സ്റ്റേഡിയം
  rationale: പുരാതന അളവായ στάδιος മുഖ്യപാഠത്തിൽ നിലനിർത്തി; ആധുനിക തുല്യദൂരം അടിക്കുറിപ്പിൽ വിശദീകരിക്കുന്നു. ഗ്രീക്കിലെ εἴκοσι πέντε ἢ τριάκοντα എന്ന ഏകദേശ പരിധി മലയാളത്തിലെ ‘ഇരുപത്തഞ്ചോ മുപ്പതോ’ എന്ന പ്രയോഗം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: θεωροῦσιν
  choice: കണ്ടു
  rationale: ഈ ആഖ്യാനസന്ദർഭത്തിൽ ദൃശ്യഗ്രഹണം ലളിതവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു; അനാവശ്യമായ പുരാതനമോ ഔപചാരികമോ ആയ ഭാവം ഒഴിവാക്കുന്നു.
- source_word: περιπατοῦντα ἐπὶ τῆς θαλάσσης
  choice: കടലിന്മേൽ നടക്കുന്നതും
  rationale: θάλασσα എന്നത് ‘കടൽ’ എന്നാണ്; ἐπί ഇവിടെ അതിന്റെ മേൽ നടക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. സംഭവത്തിന്റെ അസാധാരണമായ നേരർഥം മയപ്പെടുത്താതെ നിലനിർത്തുന്നു.
- source_word: ἐγγὺς τοῦ πλοίου γινόμενον
  choice: വള്ളത്തിനടുത്തേക്കു വരുന്നതും
  rationale: γίνομαι + ἐγγύς സ്ഥിതിമാത്രമല്ല, സമീപത്താകുന്ന ചലനവും സൂചിപ്പിക്കുന്നു; ‘അടുത്തേക്കു വരുന്നത്’ അത് വ്യക്തമായി നൽകുന്നു.
- source_word: πλοίου
  choice: വള്ളം
  rationale: ഗലീലക്കടലിലെ ഈ സന്ദർഭത്തിൽ πλοῖον വലിയ കപ്പലിനെക്കാൾ ചെറുവള്ളത്തെയാണ് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്.
- source_word: ἐφοβήθησαν
  choice: അവർ ഭയപ്പെട്ടു
  rationale: അവർക്ക് ഉണ്ടായ ഭയപ്രതികരണം ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
theological_decisions:
- issue: അത്ഭുതവിവരണത്തിന്റെ നേരർഥം മയപ്പെടുത്താതെ പരിഭാഷപ്പെടുത്തൽ
  choice: കടലിന്മേൽ നടക്കുന്നത്
  alternative: കടൽത്തീരത്തുകൂടെ നടക്കുന്നത് / വെള്ളത്തിന്മേൽ നടക്കുന്നത്
  rationale: ശിഷ്യർ കരയിൽനിന്ന് അകലെയുള്ള വള്ളത്തിലായിരുന്ന ഉടൻസന്ദർഭത്തിൽ ‘കടൽത്തീരത്തുകൂടെ’ എന്ന അർഥം യോജിക്കുന്നില്ല. ഗ്രീക്കിൽ θάλασσα ‘കടൽ’ എന്നാണ്; അതിനാൽ ‘വെള്ളം’ എന്നു വ്യാഖ്യാനപരമായി മാറ്റാതെ പാഠത്തിന്റെ വാക്കും അത്ഭുതത്തിന്റെ നേരർഥവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ മാന്യമായ മലയാളം. ‘സ്റ്റേഡിയം’ എന്ന അപരിചിതമായ പുരാതന അളവ് ഉറവിടത്തോടുള്ള സുതാര്യതയ്ക്കായി നിലനിർത്തി അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
