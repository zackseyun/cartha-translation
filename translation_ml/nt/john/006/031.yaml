source:
  edition: SBLGNT
  text: οἱ πατέρες ἡμῶν τὸ μάννα ἔφαγον ἐν τῇ ἐρήμῳ, καθώς ἐστιν γεγραμμένον· Ἄρτον ἐκ τοῦ οὐρανοῦ ἔδωκεν αὐτοῖς φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/031.yaml
  text: 'Our fathers ate the manna in the wilderness[b][a], just as it is written: ‘He gave them bread from heaven to eat.’'
translation:
  language: ml
  text: '“ഞങ്ങളുടെ പിതാക്കന്മാർ മരുഭൂമിയിൽ മന്നാ കഴിച്ചു[a]; എഴുതിയിരിക്കുന്നതുപോലെ: ‘അവൻ അവർക്കു ഭക്ഷിക്കാനായി സ്വർഗത്തിൽനിന്ന് അപ്പം കൊടുത്തു.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഞങ്ങളുടെ പൂർവികർ.” ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “ഞങ്ങളുടെ പിതാക്കന്മാർ” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πατέρες ἡμῶν
  choice: ഞങ്ങളുടെ പിതാക്കന്മാർ
  rationale: ഗ്രീക്കിലെ ‘ഞങ്ങളുടെ പിതാക്കന്മാർ’ എന്ന പദപ്രയോഗവും ഇസ്രായേലിന്റെ മുൻതലമുറകളിലേക്കുള്ള സൂചനയും നേരിട്ട് നിലനിർത്തുന്നു. സ്വാഭാവികമായ മറ്റൊരു മലയാള പ്രയോഗം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: τὸ μάννα
  choice: മന്നാ
  rationale: പുറപ്പാട് പാരമ്പര്യത്തിലെ മരുഭൂമിഭക്ഷണത്തിന് മലയാള ബൈബിൾഭാഷയിൽ പരിചിതമായ ലിപ്യന്തരണം.
- source_word: ἔφαγον
  choice: ഭക്ഷിച്ചു
  rationale: ἐσθίω എന്ന ക്രിയയുടെ aorist രൂപത്തെ ലളിതമായ ഭൂതകാലത്തിൽ കൃത്യമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἐν τῇ ἐρήμῳ
  choice: മരുഭൂമിയിൽവെച്ച്
  rationale: പുറപ്പാട് സന്ദർഭത്തിൽ ἔρημος എന്നതിന്റെ സ്വാഭാവികവും പരമ്പരാഗതവുമായ മലയാള തുല്യം; സംഭവസ്ഥലം വ്യക്തമായി സൂചിപ്പിക്കാൻ ‘-യിൽവെച്ച്’ ഉപയോഗിച്ചു.
- source_word: καθώς ἐστιν γεγραμμένον
  choice: എന്ന് എഴുതിയിരിക്കുന്നതുപോലെതന്നെ
  rationale: തിരുവെഴുത്ത് ഉദ്ധരണി പരിചയപ്പെടുത്തുന്ന സൂത്രവാക്യവും γεγραμμένον എന്ന perfect passive രൂപത്തിന്റെ നിലനിൽക്കുന്ന എഴുത്തുസാക്ഷ്യബോധവും സംരക്ഷിക്കുന്നു.
- source_word: Ἄρτον
  choice: അപ്പം
  rationale: ἄρτος എന്നതിന്റെ സാധാരണ മലയാള തുല്യം; ഇവിടെ ഒരു പ്രത്യേക അപ്പത്തുണ്ടല്ല, ദൈവം നൽകിയ ഭക്ഷണമാണ് ഉദ്ദേശ്യം.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: സ്വർഗത്തിൽനിന്ന്
  rationale: ദൈവിക ഉറവിടത്തെ സൂചിപ്പിക്കുന്ന ബൈബിൾപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἔδωκεν αὐτοῖς φαγεῖν
  choice: അവർക്കു ഭക്ഷിക്കാൻ അവൻ ... കൊടുത്തു
  rationale: ദാതാവ് ഗ്രീക്കിൽ വ്യക്തമായി നാമകരണം ചെയ്യപ്പെട്ടിട്ടില്ലാത്തതിനാൽ ‘അവൻ’ എന്ന സർവനാമം മാത്രം നിലനിർത്തുന്നു; dative + infinitive ഘടനയും മലയാളത്തിൽ സാധ്യമായത്ര സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: മന്നായെക്കുറിച്ചുള്ള ഉദ്ധരണിയിൽ പിന്നീടുള്ള യോഹന്നാനീയ ക്രിസ്തുശാസ്ത്രം മുൻകൂട്ടി ചേർക്കാതിരിക്കുക
  choice: ജനക്കൂട്ടത്തിന്റെ വാക്കുകളെ സ്വർഗത്തിൽനിന്നുള്ള അപ്പം നൽകിയെന്ന ചരിത്രപരവും തിരുവെഴുത്തുപരവുമായ അവകാശവാദമായി മാത്രം പരിഭാഷപ്പെടുത്തി; ‘അപ്പം’ എന്നതിന് വ്യാഖ്യാനാത്മകമായ മഹാക്ഷരമോ വിപുലീകരണമോ നൽകിയില്ല.
  alternative: യേശുവാണ് യഥാർഥ അപ്പം എന്ന പിന്നീടുള്ള ആശയം മുൻകൂട്ടി വ്യക്തമാക്കുന്ന വ്യാഖ്യാനപരമായ പദപ്രയോഗം ഉപയോഗിക്കുക.
  rationale: ഈ ഘട്ടത്തിൽ സംസാരിക്കുന്നവർ മരുഭൂമിയിലെ മന്നായെക്കുറിച്ചുള്ള തിരുവെഴുത്ത് ഉദ്ധരിക്കുകയാണ്. തുടർന്നുള്ള സംഭാഷണത്തിൽ സുവിശേഷത്തിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ അർഥം സ്വയം വികസിക്കാൻ പരിഭാഷ ഇട നൽകണം.
- issue: ἔδωκεν എന്ന ക്രിയയുടെ കർത്താവിന്റെ പരാമർശം
  choice: ഗ്രീക്കിലെപ്പോലെ ‘അവൻ’ എന്നു മാത്രം നൽകി.
  alternative: ഉദ്ധരണിയുടെ സന്ദർഭമനുസരിച്ച് ‘ദൈവം’ എന്നു വ്യക്തമായി ചേർക്കുക.
  rationale: കർത്താവ് സന്ദർഭത്തിൽ ദൈവമാണെങ്കിലും മൂലപാഠം പേരുപയോഗിച്ച് വ്യക്തമാക്കുന്നില്ല. ആ രൂപപരമായ തുറന്ന നില പരിഭാഷയിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ തിരുവെഴുത്ത് ഉദ്ധരണിക്ക് യോജിച്ച ഗൗരവമുള്ള മലയാളം. ‘മന്നാ,’ ‘മരുഭൂമി,’ ‘സ്വർഗത്തിൽനിന്ന് അപ്പം’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തി. മലയാളത്തിൽ ‘മരുഭൂമി’യും ‘വിജനപ്രദേശം’ എന്ന ആശയവും സന്ദർഭത്തിൽ സ്വാഭാവികമായി ഒന്നിക്കുന്നതിനാൽ ഇംഗ്ലീഷിലെ wilderness/desert വ്യത്യാസത്തിന് പ്രത്യേക അടിക്കുറിപ്പ് ആവശ്യമായില്ല.
