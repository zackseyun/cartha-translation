id: JHN.6.67
reference: John 6:67
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν οὖν ὁ Ἰησοῦς τοῖς δώδεκα· Μὴ καὶ ὑμεῖς θέλετε ὑπάγειν;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/067.yaml
  text: So Jesus said to the Twelve[a], “You do not want to go away too, do you?”
translation:
  language: ml
  text: 'അപ്പോൾ യേശു പന്ത്രണ്ടുപേരോടു പറഞ്ഞു: “നിങ്ങളും വിട്ടുപോകാൻ ആഗ്രഹിക്കുന്നില്ലല്ലോ?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “നിങ്ങളും വിട്ടുപോകാൻ ആഗ്രഹിക്കുന്നുവോ?” ഗ്രീക്കിലെ ചോദ്യം സാധാരണയായി ‘ഇല്ല’ എന്ന മറുപടി പ്രതീക്ഷിക്കുന്ന μή എന്ന പദം ഉപയോഗിച്ചാണ് ആരംഭിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: അപ്പോൾ
  rationale: അനേകം ശിഷ്യന്മാർ വിട്ടുപോയതിനെത്തുടർന്നുള്ള ആഖ്യാനപരവും യുക്തിപരവുമായ തുടർച്ച സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: τοῖς δώδεκα
  choice: പന്ത്രണ്ടുപേരോടു
  rationale: യേശുവിന്റെ അടുത്ത ശിഷ്യസംഘത്തെ സൂചിപ്പിക്കുന്ന അംഗീകൃത നാമപ്രയോഗത്തിന്റെ സംക്ഷിപ്തതയും പ്രത്യേകതയും നിലനിർത്തുന്നു.
- source_word: Μὴ καὶ ὑμεῖς
  choice: നിങ്ങളും ... ആഗ്രഹിക്കുന്നില്ലല്ലോ?
  rationale: μή കൊണ്ടാരംഭിക്കുന്ന ചോദ്യം സാധാരണയായി ‘ഇല്ല’ എന്ന മറുപടി പ്രതീക്ഷിക്കുന്നതും καί, ഊന്നിയ ὑμεῖς എന്നിവ ‘നിങ്ങളും’ എന്ന ആശയം നൽകുന്നതും മലയാളത്തിലെ സ്വാഭാവിക നിഷേധചോദ്യത്തിലൂടെ അറിയിക്കുന്നു.
- source_word: θέλετε
  choice: ആഗ്രഹിക്കുന്നു
  rationale: ഈ സന്ദർഭത്തിലെ ഇച്ഛയെയോ മനസ്സിനെയോ സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: ὑπάγειν
  choice: വിട്ടുപോകാൻ
  rationale: മുൻസന്ദർഭത്തിൽ ശിഷ്യന്മാർ യേശുവിൽനിന്ന് പിൻവാങ്ങിപ്പോയതിനെ പ്രതിഫലിപ്പിക്കുന്നു; അതേസമയം ‘ഉപേക്ഷിക്കുക’ എന്നതുപോലുള്ള കൂടുതൽ വ്യാഖ്യാനാത്മക പദം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: μή കൊണ്ടാരംഭിക്കുന്ന യേശുവിന്റെ ചോദ്യത്തിന്റെ ഭാവം
  choice: ‘ഇല്ല’ എന്ന മറുപടി പ്രതീക്ഷിക്കുന്ന നിഷേധചോദ്യമായി പരിഭാഷപ്പെടുത്തി
  alternative: “നിങ്ങളും വിട്ടുപോകാൻ ആഗ്രഹിക്കുന്നുവോ?” എന്ന നിഷ്പക്ഷ ചോദ്യം
  rationale: ഗ്രീക്കിൽ μή സാധാരണയായി നിഷേധമറുപടി പ്രതീക്ഷിക്കുന്നതായി സൂചിപ്പിക്കുന്നു. ‘ആഗ്രഹിക്കുന്നില്ലല്ലോ?’ എന്ന രൂപം ആ സൂചന നിലനിർത്തുന്നു; എന്നാൽ മറുപടി നിർബന്ധിതമാണെന്നോ ചോദ്യം വെറും പ്രസ്താവനയാണെന്നോ വരുത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം മാന്യവുമായ മലയാളം. ‘പന്ത്രണ്ടുപേർ’ എന്നത് സംഘത്തിന്റെ പ്രത്യേക നാമസ്വഭാവം നിലനിർത്തുന്നു; ‘ഇല്ലല്ലോ?’ എന്ന രൂപം ഗ്രീക്ക് ചോദ്യത്തിന്റെ പ്രതീക്ഷാഭാവം സ്വാഭാവികമായി നൽകുന്നു.
