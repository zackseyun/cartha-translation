- from: അങ്ങനെ അവർ അവ ശേഖരിച്ച്, ഭക്ഷിച്ചവർ കഴിച്ചശേഷം മിച്ചംവന്ന[b] യവംകൊണ്ടുള്ള ആ അഞ്ച് അപ്പങ്ങളുടെ കഷണങ്ങൾ[a] കൊണ്ട് പന്ത്രണ്ട് കൊട്ടകൾ നിറച്ചു.
