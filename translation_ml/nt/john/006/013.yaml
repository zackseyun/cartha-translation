id: JHN.6.13
reference: John 6:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: συνήγαγον οὖν, καὶ ἐγέμισαν δώδεκα κοφίνους κλασμάτων ἐκ τῶν πέντε ἄρτων τῶν κριθίνων ἃ ⸀ἐπερίσσευσαν τοῖς βεβρωκόσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/013.yaml
  text: So they gathered them[b][a], and filled twelve baskets with pieces from the five barley loaves left over by those who had eaten.
translation:
  language: ml
  text: അങ്ങനെ അവർ അവ ശേഖരിച്ച്, ഭക്ഷിച്ചവർക്കു ശേഷിച്ച[b] യവംകൊണ്ടുള്ള അഞ്ച് അപ്പങ്ങളിൽനിന്നുള്ള കഷണങ്ങൾ[a] കൊണ്ട് പന്ത്രണ്ട് കൊട്ടകൾ നിറച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നുറുക്കുകൾ’ (κλασμάτων).
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥത്തോട് കൂടുതൽ അടുത്ത്: ‘ഭക്ഷിച്ചവർക്കു സമൃദ്ധമായി ശേഷിച്ചവ.’ ഇവിടെ ഉദ്ദേശിക്കുന്നത് ഭക്ഷണത്തിനുശേഷം ശേഷിച്ച ഭാഗങ്ങളാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήγαγον οὖν
  choice: അങ്ങനെ അവർ അവ ശേഖരിച്ച്
  rationale: οὖν മുൻവാക്യത്തിലെ യേശുവിന്റെ കല്പനയുടെ ഫലത്തെ സൂചിപ്പിക്കുന്നു; ‘അങ്ങനെ’ അതിന്റെ അനുമാനാത്മകമായ കഥാപ്രവാഹം സ്വാഭാവികമായി നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ വ്യക്തമായ ശേഷിപ്പുകളെ ‘അവ’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: ἐγέμισαν δώδεκα κοφίνους
  choice: പന്ത്രണ്ട് കൊട്ടകൾ നിറച്ചു
  rationale: ക്രിയയുടെയും സംഖ്യയുടെയും നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; κοφίνους എന്നതിന് അനാവശ്യമായി പ്രത്യേകത ചേർക്കാതെ സാധാരണവും വ്യക്തവുമായ ‘കൊട്ടകൾ’ ഉപയോഗിക്കുന്നു.
- source_word: κλασμάτων
  choice: കഷണങ്ങൾ
  rationale: അപ്പം മുറിച്ചോ പൊട്ടിച്ചോ ലഭിച്ച ശേഷിപ്പുകളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘കഷണങ്ങൾ’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്; ‘നുറുക്കുകൾ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἐκ τῶν πέντε ἄρτων τῶν κριθίνων
  choice: യവംകൊണ്ടുള്ള ആ അഞ്ച് അപ്പങ്ങളുടെ
  rationale: അഞ്ച് അപ്പങ്ങളും യവംകൊണ്ടുള്ളവയാണെന്ന വിവരം നിലനിർത്തുകയും, ശേഷിച്ച കഷണങ്ങൾ അവയിൽനിന്നുള്ളവയാണെന്ന ബന്ധം മലയാളത്തിലെ സ്വാഭാവികമായ സംബന്ധികപ്രയോഗത്തിലൂടെ അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: ἃ ἐπερίσσευσαν τοῖς βεβρωκόσιν
  choice: ഭക്ഷിച്ചവർ കഴിച്ചശേഷം മിച്ചംവന്ന
  rationale: ഭക്ഷണത്തിനു ശേഷം ശേഷിച്ച ഭാഗങ്ങളെന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. ഗ്രീക്കിലെ ‘ഭക്ഷിച്ചവർക്ക് സമൃദ്ധമായി ശേഷിച്ചു’ എന്നതോടടുത്ത ഘടനയിലെ സൂക്ഷ്മത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
