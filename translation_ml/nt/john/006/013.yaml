translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. വാക്യത്തിന്റെ കഥാപ്രവാഹവും മൂലഭാഷയിലെ ശേഷിപ്പിനെക്കുറിച്ചുള്ള സൂക്ഷ്മതയും നിലനിർത്തിയിരിക്കുന്നു.
