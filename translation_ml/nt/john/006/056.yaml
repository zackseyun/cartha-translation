  text: ὁ τρώγων μου τὴν σάρκα καὶ πίνων μου τὸ αἷμα ἐν ἐμοὶ μένει κἀγὼ ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/056.yaml
  text: The one who eats my flesh and drinks my blood remains in me[b][a], and I in him.
translation:
  language: ml
  text: എന്റെ മാംസം ഭക്ഷിക്കുകയും[a] എന്റെ രക്തം കുടിക്കുകയും ചെയ്യുന്നവൻ എന്നിൽ തുടരുന്നു[b]; ഞാനും അവനിൽ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തിന്നുകയും’ അഥവാ ‘ചവച്ചുതിന്നുകയും’ എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്ക് ക്രിയ സാധാരണ ‘ഭക്ഷിക്കുക’ എന്നതിനേക്കാൾ കൂടുതൽ ദൃശ്യവും ശക്തവുമാണ്.
    reason: lexical_alternative
  - marker: b
    text: 'പരമ്പരാഗത പരിഭാഷ: ‘എന്നിൽ വസിക്കുന്നു; ഞാനും അവനിൽ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ τρώγων
  choice: ഭക്ഷിക്കുകയും … ചെയ്യുന്നവൻ
  rationale: നിശ്ചയാർഥക ഉപപദത്തോടുകൂടിയ വർത്തമാനകാല കൃദന്തം ഈ പ്രവൃത്തിയാൽ വിശേഷിപ്പിക്കപ്പെടുന്ന ഒരാളെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘ചെയ്യുന്നവൻ’ എന്ന ഘടന ഏകവചനവും തുടരുന്ന പ്രവൃത്തിയുടെ ഭാവവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: τρώγων
  choice: ഭക്ഷിക്കുകയും
  rationale: τρώγω എന്നത് സാധാരണ ‘ഭക്ഷിക്കുക’ എന്നതിനേക്കാൾ ചിത്രാത്മകമായി ‘തിന്നുക/ചവച്ചുതിന്നുക’ എന്ന അർഥം നൽകാം. മുഖ്യപാഠത്തിൽ മാന്യവും സ്വാഭാവികവുമായ ‘ഭക്ഷിക്കുക’ ഉപയോഗിച്ച്, ക്രിയയുടെ കൂടുതൽ ശക്തമായ ഭാവം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: μου τὴν σάρκα
  choice: എന്റെ മാംസം
  rationale: σάρξ ഇവിടെ യേശുവിന്റെ മാംസത്തെക്കുറിച്ചുള്ള മൂർത്തമായ ഭാഷയാണ്; അതിനെ ‘മാംസം’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നത് അവതാര-യാഗസംബന്ധമായ ദൃശ്യഭാഷയും വ്യാഖ്യാനപരമായ തുറന്ന നിലയും സംരക്ഷിക്കുന്നു.
- source_word: καὶ πίνων μου τὸ αἷμα
  choice: എന്റെ രക്തം കുടിക്കുകയും
  rationale: സമാന്തരമായ വർത്തമാനകാല കൃദന്തത്തെ നേരിട്ട് പരിഭാഷപ്പെടുത്തി. ‘രക്തം’ എന്ന മൂർത്തമായ പദം മാറ്റാതെ നിലനിർത്തുന്നത് മൂലപാഠത്തിന്റെ ഞെട്ടിക്കുന്ന യാഗസംബന്ധമായ ദൃശ്യഭാഷ സംരക്ഷിക്കുന്നു.
- source_word: ἐν ἐμοὶ μένει
  choice: എന്നിൽ നിലനിൽക്കുന്നു
  rationale: μένω യോഹന്നാന്റെ രചനകളിലെ പ്രധാന ക്രിയയാണ്. ‘നിലനിൽക്കുന്നു’ എന്നത് ബന്ധത്തിന്റെ തുടർച്ചയും സ്ഥിരതയും ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; ‘വസിക്കുന്നു’ എന്ന പരമ്പരാഗത സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
- source_word: κἀγὼ ἐν αὐτῷ
  choice: ഞാനും അവനിൽ
  rationale: ഗ്രീക്കിൽ മുൻക്രിയ ആവർത്തിക്കാതെ വിട്ടിരിക്കുന്ന സമാന്തര വാക്യഘടന മലയാളത്തിലും സ്വാഭാവികമായി നിലനിർത്തി; ‘നിലനിൽക്കുന്നു’ എന്ന് വീണ്ടും ചേർത്ത് മൂലത്തേക്കാൾ വ്യക്തമാക്കുന്നത് ഒഴിവാക്കി.
- source_word: αὐτῷ
  choice: അവനിൽ
  rationale: പുരുഷലിംഗ ഏകവചന സർവനാമം മുമ്പുള്ള ഏകവചന കൃദന്തരൂപത്തെ സൂചിപ്പിക്കുന്നു; അതിനനുസരിച്ച് ‘അവനിൽ’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: മാംസം ഭക്ഷിക്കുകയും രക്തം കുടിക്കുകയും ചെയ്യുന്നതിന്റെ കുർബാനാപരമായതോ രൂപകാത്മകമായതോ ആയ വ്യാഖ്യാനം
  choice: ഗ്രീക്കിലെ മൂർത്തമായ ഭാഷ വ്യാഖ്യാനവികാസമില്ലാതെ നിലനിർത്തി.
  alternative: അതിനെ കുർബാനയെക്കുറിച്ചുള്ള വ്യക്തമായ പരാമർശമായോ ‘വിശ്വസിക്കുക’ എന്നതിന്റെ രൂപകമായോ വിശദീകരിക്കുക.
  rationale: ക്രൈസ്തവ പാരമ്പര്യങ്ങളിൽ ഈ വാക്യത്തിന്റെ വ്യാഖ്യാനം വിവാദവിധേയമാണ്. മൂലപാഠം ഇവിടെ ആ തർക്കം തീർപ്പാക്കാത്തതിനാൽ ‘എന്റെ മാംസം’, ‘എന്റെ രക്തം’ എന്നീ പദങ്ങൾ അതേപടി സൂക്ഷിച്ചു.
- issue: യോഹന്നാനിലെ പരസ്പര അന്തർവാസഭാഷ
  choice: μένω എന്നത് ‘നിലനിൽക്കുന്നു’ എന്നു പരിഭാഷപ്പെടുത്തി; അവസാന ഭാഗത്തിലെ ക്രിയാലോപം സംരക്ഷിച്ചു.
  alternative: ‘വസിക്കുന്നു’, ‘ഒന്നായിത്തീരുന്നു’, അല്ലെങ്കിൽ ‘ഞാനും അവനിൽ നിലനിൽക്കുന്നു’ എന്നു വ്യക്തമാക്കുക.
  rationale: ‘നിലനിൽക്കുന്നു’ ബന്ധപരമായ സ്ഥിരത പ്രകടിപ്പിക്കുമ്പോഴും അതിനെ ഒരു പ്രത്യേക മിസ്റ്റിക്കൽ അല്ലെങ്കിൽ സഭാപരമായ സിദ്ധാന്തസൂത്രത്തിലേക്ക് ചുരുക്കുന്നില്ല. ‘ഞാനും അവനിൽ’ എന്ന രൂപം ഗ്രീക്കിലെ ഉദ്ദേശ്യപൂർവമായ ക്രിയാലോപം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. മൂലപാഠത്തിന്റെ മൂർത്തമായ ഭാഷയും ഏകവചനരൂപവും അവസാനത്തെ ക്രിയാലോപവും സംരക്ഷിച്ചു; τρώγω എന്ന ക്രിയയുടെ കൂടുതൽ ശക്തമായ ഭാവം അടിക്കുറിപ്പിൽ നൽകി.
