id: JHN.6.48
reference: John 6:48
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐγώ εἰμι ὁ ἄρτος τῆς ζωῆς·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/048.yaml
  text: I am the bread of life.
translation:
  language: ml
  text: ഞാൻ ജീവന്റെ അപ്പം ആകുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγώ εἰμι
  choice: ഞാൻ ... ആകുന്നു
  rationale: വ്യക്തമായ ഒന്നാംപുരുഷ കർത്താവിനെയും വർത്തമാനകാല സ്വത്വപ്രസ്താവനയെയും സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു. ഇവിടെ ഇത് കേവലമായ ‘ഞാൻ ആകുന്നു’ എന്ന പ്രയോഗമല്ല; വിധേയപദമുള്ള പ്രസ്താവനയാണ്.
- source_word: ὁ ἄρτος
  choice: അപ്പം
  rationale: ἄρτος എന്ന പദത്തിന്റെ സാധാരണ അർഥം ‘അപ്പം’ എന്നാണ്. മലയാളത്തിൽ വിധേയപദത്തോടൊപ്പം ഗ്രീക്കിലെ നിർദേശക ഉപപദം വേറിട്ട് പകർത്താതെതന്നെ തിരിച്ചറിയൽഭാവം സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: τῆς ζωῆς
  choice: ജീവന്റെ
  rationale: ഗ്രീക്കിലെ ജനിറ്റീവ് ബന്ധം വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; ‘ജീവൻ നൽകുന്ന’ എന്നത് സാധ്യമായ ആശയം വ്യക്തമാക്കുമെങ്കിലും മൂലവാക്യത്തേക്കാൾ വ്യാഖ്യാനാത്മകമാണ്.
theological_decisions:
- issue: യോഹന്നാനിലെ ‘ഞാൻ ആകുന്നു’ പ്രസ്താവനയുടെ ക്രിസ്തുശാസ്ത്രപരമായ ഭാരം
  choice: “ഞാൻ ജീവന്റെ അപ്പം ആകുന്നു” എന്ന് നേരിട്ട് പരിഭാഷപ്പെടുത്തുക.
  alternative: “ഞാൻ തന്നെയാണ് ജീവന്റെ അപ്പം”
  rationale: ἐγώ മൂലം ഒരു ഊന്നൽ ഉണ്ടാകാമെങ്കിലും, ഇവിടെ ἐγώ εἰμι എന്നത് വിധേയപദമില്ലാത്ത കേവല ദൈവിക സ്വയംപ്രഖ്യാപനമല്ല. ‘തന്നെയാണ്’ ചേർക്കുന്നത് ഊന്നലും പ്രത്യേകതയും കൂടുതൽ വ്യക്തമാക്കും; എന്നാൽ അത് മൂലത്തിലെ യഥാർഥ അനിശ്ചിതത്വത്തെ ഒരു ദിശയിൽ തീർക്കാം. അതിനാൽ ശക്തമായ സ്വയംതിരിച്ചറിയൽ നിലനിർത്തിക്കൊണ്ട് അധിക വ്യാഖ്യാനം ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ആരാധനാപരമായ ഗൗരവം നിലനിർത്തുന്നതുമായ മലയാളം. സ്ഥാപിതമായ ബൈബിൾ പദപ്രയോഗമായ ‘ജീവന്റെ അപ്പം’ നിലനിർത്തിയിരിക്കുന്നു; പഴഞ്ചൻ വാക്യഘടന ഒഴിവാക്കിയെങ്കിലും ‘ആകുന്നു’ എന്നത് പ്രസ്താവനയുടെ ഗൗരവത്തിന് അനുയോജ്യമാണ്.
