id: JHN.12.43
reference: John 12:43
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἠγάπησαν γὰρ τὴν δόξαν τῶν ἀνθρώπων μᾶλλον ἤπερ τὴν δόξαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/043.yaml
  text: For they loved the glory of men rather than the glory of God[a].
translation:
  language: ml
  text: കാരണം, അവർ ദൈവത്തിന്റെ മഹത്ത്വത്തെക്കാൾ മനുഷ്യരുടെ മഹത്ത്വത്തെ സ്നേഹിച്ചു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മനുഷ്യരിൽനിന്നുള്ള പ്രശംസ / മനുഷ്യരുടെ അംഗീകാരം.”
    reason: δόξα ഇവിടെ മനുഷ്യരിൽനിന്നു ലഭിക്കുന്ന ബഹുമാനമോ അംഗീകാരമോ എന്ന അർത്ഥത്തിലും ഗ്രഹിക്കാം; മുഖ്യപാഠത്തിലെ ‘മഹത്ത്വം’ അതിന്റെ വിശാലമായ പദാർഥവും സമാന്തരതയും നിലനിർത്തുന്നു.
lexical_decisions:
- source_word: ἠγάπησαν
  choice: സ്നേഹിച്ചു
  rationale: ἀγαπάω എന്ന ക്രിയയുടെ ശക്തമായ ഇഷ്ടത്തെയും മനഃപൂർവമായ ആസക്തിയെയും നേരിട്ട് നിലനിർത്തുന്നു; താരതമ്യപ്രയോഗം മുൻഗണനയുടെ ആശയം വ്യക്തമാക്കുന്നു.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞതിന്റെ കാരണം അവതരിപ്പിക്കുന്ന γάρ എന്ന ബന്ധകത്തിന്റെ വ്യാഖ്യാനബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: δόξαν
  choice: മഹത്ത്വം
  rationale: δόξα എന്ന പദത്തിന്റെ ‘മഹത്ത്വം, ബഹുമാനം, പ്രശംസ’ തുടങ്ങിയ അർത്ഥവ്യാപ്തിയും യോഹന്നാനിലെ ദൈവശാസ്ത്രപരമായ പദബന്ധവും കഴിയുന്നത്ര സംരക്ഷിക്കുന്നു; രണ്ടു പ്രയോഗങ്ങളിലും ഒരേ പദം ആവർത്തിച്ച് ഗ്രീക്കിലെ സമാന്തരത നിലനിർത്തുന്നു.
- source_word: τῶν ἀνθρώπων
  choice: മനുഷ്യരുടെ
  rationale: ഇവിടെ ἄνθρωποι പുരുഷന്മാരെ മാത്രം അല്ല, മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു. ജനിതകവിഭക്തിയുടെ ഉടമസ്ഥത/ഉറവിടം എന്നീ ഇരട്ടസാധ്യതകൾ പൂർണമായി ചുരുക്കാതെ ഗ്രീക്ക് ഘടനയോട് ചേർന്നുനിൽക്കുന്നു.
- source_word: μᾶλλον ἤπερ
  choice: -ത്തെക്കാൾ
  rationale: രണ്ട് കാര്യങ്ങൾക്കിടയിലെ താരതമ്യവും മുൻഗണനയും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ
  rationale: മനുഷ്യരുടെ എന്ന പ്രയോഗത്തോടുള്ള സമാന്തരത സംരക്ഷിക്കുകയും ജനിതകവിഭക്തിയുടെ ഉടമസ്ഥത/ഉറവിടം എന്ന അർത്ഥവ്യാപ്തി തുറന്നുവയ്ക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: മനുഷ്യരുടെയും ദൈവത്തിന്റെയും δόξα തമ്മിലുള്ള വൈരുധ്യം
  choice: മഹത്ത്വം
  alternative: പ്രശംസ / ബഹുമാനം / അംഗീകാരം
  rationale: ‘മഹത്ത്വം’ δόξαയുടെ വിശാലമായ അർത്ഥവും യോഹന്നാനിലെ പദപരവും ദൈവശാസ്ത്രപരവുമായ തുടർച്ചയും നിലനിർത്തുന്നു. ‘അംഗീകാരം’ പോലുള്ള പദങ്ങൾ സന്ദർഭത്തിൽ സാധ്യമെങ്കിലും ഗ്രീക്കിന്റെ അർത്ഥം കൂടുതൽ ചുരുക്കുന്നു.
- issue: τῶν ἀνθρώπων എന്നതിന്റെ പൊതുമാനുഷിക സൂചന
  choice: മനുഷ്യരുടെ
  alternative: ആളുകളുടെ / മനുഷ്യരിൽനിന്നുള്ള
  rationale: ഗ്രീക്കിലെ ബഹുവചനം ഇവിടെ ലിംഗഭേദമില്ലാതെ മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു; ‘മനുഷ്യരുടെ’ എന്നത് അതിനെ കൃത്യവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഗ്രീക്കിലെ മനുഷ്യർ–ദൈവം സമാന്തരതയും ‘മഹത്ത്വം’ എന്ന പദത്തിന്റെ ആവർത്തനവും സംരക്ഷിച്ചിരിക്കുന്നു.
