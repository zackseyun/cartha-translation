id: JHN.12.8
reference: John 12:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοὺς πτωχοὺς γὰρ πάντοτε ἔχετε μεθ’ ἑαυτῶν, ἐμὲ δὲ οὐ πάντοτε ἔχετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/008.yaml
  text: For you always have the poor with you[a], but you do not always have me.
translation:
  language: ml
  text: ദരിദ്രർ എപ്പോഴും നിങ്ങളോടുകൂടെ ഉണ്ടല്ലോ[a]; എന്നാൽ ഞാൻ എപ്പോഴും നിങ്ങളോടുകൂടെ ഉണ്ടായിരിക്കുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദരിദ്രരായ ആളുകൾ.’ ഗ്രീക്കിൽ ‘ദരിദ്രർ’ എന്ന വിശേഷണം നാമമായി പ്രയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: πτωχούς
  choice: ദരിദ്രർ
  rationale: വിശേഷണം നാമമായി പ്രയോഗിച്ചിരിക്കുന്നതിനാൽ ദരിദ്രരായ ആളുകളെ ഒരു പൊതുവിഭാഗമായി സൂചിപ്പിക്കുന്നു. ‘ദരിദ്രർ’ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: γάρ
  choice: ഉണ്ടല്ലോ
  rationale: മുൻവാക്യത്തിന് വിശദീകരണകാരണം നൽകുന്ന γάρ-ന്റെ ബന്ധകശക്തി മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കാൻ ‘ഉണ്ടല്ലോ’ എന്ന ഊന്നൽപ്രയോഗം സ്വീകരിച്ചു.
- source_word: πάντοτε
  choice: എപ്പോഴും
  rationale: തുടർച്ചയായ സാന്നിധ്യത്തെയോ ലഭ്യതയെയോ സൂചിപ്പിക്കുന്നു; രണ്ടു പ്രയോഗങ്ങളിലും ഒരേ വിവർത്തനം നിലനിർത്തുന്നു.
- source_word: ἔχετε
  choice: ഉണ്ടല്ലോ / ഉണ്ടായിരിക്കുകയില്ല
  rationale: ഇവിടെ ഉടമസ്ഥതയല്ല, കൂടെയുള്ള സാന്നിധ്യമാണ് അർഥം. മലയാളത്തിൽ ആദ്യ ഉപവാക്യത്തിൽ ‘ഉണ്ട്’, രണ്ടാമത്തേതിൽ ഭാവിസാന്നിധ്യം നിഷേധിക്കുന്ന ‘ഉണ്ടായിരിക്കുകയില്ല’ സ്വാഭാവികമാണ്.
- source_word: μεθ’ ἑαυτῶν
  choice: നിങ്ങളോടുകൂടെ
  rationale: ‘നിങ്ങളുടെ സാന്നിധ്യത്തിൽ/കൂട്ടത്തിൽ’ എന്ന അർഥം നൽകുന്ന സ്വാഭാവികവും മാന്യവുമായ മലയാളരൂപം.
- source_word: ἐμέ
  choice: ഞാൻ
  rationale: ഗ്രീക്കിൽ കർമരൂപമാണെങ്കിലും മലയാളത്തിലെ ‘ഉണ്ടായിരിക്കുക’ എന്ന ഘടനയിൽ അർഥസമമായ കർത്തൃരൂപം ആവശ്യമാണ്.
- source_word: δέ
  choice: എന്നാൽ
  rationale: ദരിദ്രരുടെ സ്ഥിരസാന്നിധ്യവും യേശുവിന്റെ പരിമിതകാല സാന്നിധ്യവും തമ്മിലുള്ള വൈരുധ്യം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: οὐ πάντοτε
  choice: എപ്പോഴും ... ഉണ്ടായിരിക്കുകയില്ല
  rationale: നിഷേധം ‘എപ്പോഴും’ എന്നതോടു ബന്ധപ്പെടുത്തി, യേശുവിന്റെ സാന്നിധ്യം എല്ലാകാലത്തും ഇങ്ങനെ തുടരുകയില്ലെന്ന അർഥം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ദരിദ്രരോടുള്ള കരുതലിനെ ചെറുതാക്കുന്നതായി യേശുവിന്റെ വാക്കുകൾ ദുരുപയോഗം ചെയ്യപ്പെടാനുള്ള സാധ്യത
  choice: ദരിദ്രരുടെ തുടർച്ചയായ സാന്നിധ്യവും യേശുവിന്റെ പരിമിതകാല സാന്നിധ്യവും തമ്മിലുള്ള സമയപരമായ വൈരുധ്യമായി നേരിട്ട് വിവർത്തനം ചെയ്തു.
  alternative: ദരിദ്രർക്ക് പ്രാധാന്യം കുറവാണെന്ന് സൂചിപ്പിക്കുന്ന വ്യാഖ്യാനപരമായ പരാവർത്തനം; അല്ലെങ്കിൽ വൈരുധ്യം മങ്ങിക്കുന്ന മൃദൂകരണം.
  rationale: ഗ്രീക്ക് പാഠം സാന്നിധ്യത്തെയും സമയത്തെയും കുറിച്ചുള്ള വൈരുധ്യം മാത്രമാണ് പ്രസ്താവിക്കുന്നത്. ദരിദ്രരോടുള്ള കരുതലിനെ വിലകുറയ്ക്കുന്ന ആശയം ചേർക്കാതെയും സന്ദർഭത്തിന്റെ അടിയന്തരത മങ്ങിക്കാതെയും പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്ക് നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘നിങ്ങളോടുകൂടെ’ എന്ന രൂപം വാക്യത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു; γάρ-ന്റെ വിശദീകരണഭാവം അസ്വാഭാവികമായ ‘കാരണം’ കൊണ്ട് തുടങ്ങാതെ ‘ഉണ്ടല്ലോ’ വഴി പ്രകടമാക്കി.
