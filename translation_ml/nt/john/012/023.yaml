id: JHN.12.23
reference: John 12:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀ἀποκρίνεται αὐτοῖς λέγων· Ἐλήλυθεν ἡ ὥρα ἵνα δοξασθῇ ὁ υἱὸς τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/023.yaml
  text: But Jesus answered them[a], saying[b], “The hour has come for the Son of Man to be glorified.”
translation:
  language: ml
  text: 'എന്നാൽ യേശു അവരോടു മറുപടി പറഞ്ഞു: “മനുഷ്യപുത്രൻ[a] മഹത്വീകരിക്കപ്പെടേണ്ട വേള[b] വന്നിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “മാനവൻ.” “മനുഷ്യപുത്രൻ” എന്ന ഗ്രീക്ക് ശീർഷകം ദാനിയേൽ 7-നെ പ്രതിധ്വനിപ്പിക്കുന്നു; അതിന്റെ ദൈവശാസ്ത്രപരവും അന്തർപാഠപരവുമായ ബലം നിലനിർത്താൻ ഇവിടെ പരമ്പരാഗത ശീർഷകം ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: അഥവാ “സമയം.” ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “മണിക്കൂർ” എന്നാണ്; യേശുവിന്റെ കഷ്ടതയുടെയും മഹത്വീകരണത്തിന്റെയും നിർണയിക്കപ്പെട്ട വേളയെ സൂചിപ്പിക്കാൻ യോഹന്നാനിൽ ആവർത്തിക്കുന്ന പദമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκρίνεται αὐτοῖς λέγων
  choice: അവരോടു മറുപടി പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാല ആഖ്യാനരൂപവും തുടർന്ന് വരുന്ന കൃദന്തരൂപവും മലയാളത്തിലെ സ്വാഭാവിക കഥനശൈലിയിൽ ഭൂതകാല ക്രിയയായി ചേർത്തു; നേരിട്ടുള്ള വാക്കുകൾ ഉദ്ധരണിചിഹ്നവും ദ്വിബിന്ദുവുംകൊണ്ട് അവതരിപ്പിച്ചു.
- source_word: Ἐλήλυθεν
  choice: വന്നിരിക്കുന്നു
  rationale: ഗ്രീക്ക് പൂർണകാലം സൂചിപ്പിക്കുന്ന, വന്നുകഴിഞ്ഞതിന്റെ ഇപ്പോഴത്തെ ഫലം നിലനിൽക്കുന്നു എന്ന ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: ἡ ὥρα
  choice: നാഴിക
  rationale: യോഹന്നാനിൽ ആവർത്തിക്കുന്ന നിർണയിക്കപ്പെട്ട ‘മണിക്കൂർ/വേള’ എന്ന പ്രതീകാത്മക പ്രയോഗം പൊതുവായ ‘സമയം’ എന്നതിനെക്കാൾ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἵνα δοξασθῇ
  choice: മഹത്ത്വീകരിക്കപ്പെടാനുള്ള
  rationale: ἵναയുടെ ഉദ്ദേശ്യ/ഉള്ളടക്കബന്ധവും δοξάζωയുടെ ദൈവശാസ്ത്രപ്രാധാന്യമുള്ള കർമണിപ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: ദാനിയേൽ 7-നോടും യോഹന്നാനിലെ ക്രിസ്തുശാസ്ത്രപരമായ പ്രയോഗത്തോടുമുള്ള ബന്ധം നിലനിർത്തുന്ന സ്ഥാപിതമായ മലയാള ശീർഷകം.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου എന്ന ശീർഷകത്തിന്റെ പരിഭാഷ
  choice: മനുഷ്യപുത്രൻ
  alternative: മാനവൻ
  rationale: ഇത് മനുഷ്യനെക്കുറിച്ചുള്ള പൊതുവായ പരാമർശം മാത്രമല്ല; ദാനിയേൽ 7-ന്റെ പശ്ചാത്തലവും യേശുവിന്റെ സ്വയംവിശേഷണത്തിന്റെ ദൈവശാസ്ത്രബലവും ഉള്ളതിനാൽ പരമ്പരാഗത ശീർഷകം നിലനിർത്തി.
- issue: Ἐλήλυθεν ἡ ὥρα എന്ന പ്രയോഗത്തിന്റെ കാലഭാവവും യോഹന്നാനീയ പ്രാധാന്യവും
  choice: നാഴിക വന്നിരിക്കുന്നു
  alternative: സമയം വന്നിരിക്കുന്നു
  rationale: പൂർണകാലത്തിന്റെ ഇപ്പോഴത്തെ ഫലം ‘വന്നിരിക്കുന്നു’ സംരക്ഷിക്കുന്നു; ‘നാഴിക’ യേശുവിന്റെ കഷ്ടതയും മഹത്ത്വവും ചേരുന്ന നിർണായക വേളയെ സൂചിപ്പിക്കുന്ന ആവർത്തിത യോഹന്നാനീയ പ്രതീകം നിലനിർത്തുന്നു.
- issue: δοξασθῇ എന്ന കർമണിപ്രയോഗം
  choice: മഹത്ത്വീകരിക്കപ്പെടാനുള്ള
  alternative: മഹത്ത്വം പ്രാപിക്കാനുള്ള
  rationale: ആരാണ് മഹത്ത്വീകരിക്കുന്നത് എന്ന് വാക്യം വ്യക്തമാക്കാത്തതിനാൽ ഗ്രീക്കിലെ കർമണിരൂപവും അതിലെ ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും പരിഭാഷയിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമാർന്നതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘മഹത്ത്വീകരിക്കപ്പെടാനുള്ള’ എന്ന രൂപം അല്പം ഔപചാരികമാണെങ്കിലും മൂലത്തിലെ കർമണിപ്രയോഗവും ദൈവശാസ്ത്രസാന്ദ്രതയും കൃത്യമായി സംരക്ഷിക്കുന്നു.
