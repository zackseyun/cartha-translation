id: JHN.12.31
reference: John 12:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: νῦν κρίσις ἐστὶν τοῦ κόσμου τούτου, νῦν ὁ ἄρχων τοῦ κόσμου τούτου ἐκβληθήσεται ἔξω·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/031.yaml
  text: Now is the judgment of this world[b][a]; now the ruler of this world will be cast out.
translation:
  language: ml
  text: ഇപ്പോൾ ഈ ലോകത്തിന്റെ ന്യായവിധിയാണ്; ഇപ്പോൾ ഈ ലോകത്തിന്റെ ഭരണാധികാരി[a] പുറത്താക്കപ്പെടും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഈ ലോകത്തിന്റെ പ്രഭു.’
    reason: lexical_alternative
  - marker: b
    text: ‘ഈ ലോകത്തിന്റെ ഭരണാധികാരി’ എന്ന പ്രയോഗം സാധാരണയായി സാത്താനെ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കപ്പെടുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: νῦν
  choice: ഇപ്പോൾ
  rationale: രണ്ടിടത്തും ഒരേ പദം ഉപയോഗിച്ച് ഗ്രീക്കിലെ ഊന്നലും സമാന്തരഘടനയും നിലനിർത്തുന്നു.
- source_word: κρίσις
  choice: ന്യായവിധി
  rationale: യോഹന്നാനിലെ സന്ദർഭത്തിൽ വെറും വിലയിരുത്തലല്ല, ഈ ലോകത്തെ സംബന്ധിക്കുന്ന നിർണായക ദൈവിക വിധിയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: κόσμου τούτου
  choice: ഈ ലോകത്തിന്റെ
  rationale: τούτου എന്ന നിർദേശകപദവും യോഹന്നാനിലെ ‘ഈ ലോകം’ എന്ന ആശയപരമായ പ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: ἄρχων
  choice: ഭരണാധികാരി
  rationale: അധികാരം പ്രയോഗിക്കുന്ന ഒരാളെ സൂചിപ്പിക്കുന്ന വ്യക്തവും ആധുനികവുമായ മലയാളപദം; ‘പ്രഭു’ എന്നത് അനാവശ്യമായ മതപരമായ ധ്വനി സൃഷ്ടിച്ചേക്കാം.
- source_word: ἐκβληθήσεται ἔξω
  choice: പുറത്താക്കപ്പെടും
  rationale: ഭാവികാല കർമണിപ്രയോഗവും പുറത്തേക്കുള്ള ബലമായ നീക്കവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: κρίσις ἐστίν
  choice: ന്യായവിധി നടക്കുന്നു
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാല ഘടനയെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; ‘ന്യായവിധിയാണ്’ എന്ന അത്യന്തം പദാനുപദരൂപത്തേക്കാൾ സംഭവത്തിന്റെ ആരംഭിച്ചിരിക്കുന്ന സ്വഭാവം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ‘ഈ ലോകത്തിന്റെ ഭരണാധികാരി’ എന്നതിന്റെ വ്യക്തിത്വം
  choice: പ്രധാനവാക്യത്തിൽ ‘ഈ ലോകത്തിന്റെ ഭരണാധികാരി’ എന്നു മാത്രം നിലനിർത്തി.
  alternative: സാത്താൻ / പിശാച്; അല്ലെങ്കിൽ വ്യക്തിവൽക്കരിക്കപ്പെട്ട ലോകവ്യവസ്ഥ
  rationale: യോഹന്നാന്റെ സന്ദർഭത്തിൽ ഇത് സാധാരണയായി സാത്താനെ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കപ്പെടുന്നു; എന്നാൽ ഗ്രീക്ക് വാചകം പേര് പറയാതെ ഒരു പദവിയാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ വ്യക്തമായ തിരിച്ചറിയൽ അടിക്കുറിപ്പിൽ മാത്രം നൽകുന്നു.
- issue: വിധിയുടെ കൃത്യമായ ലക്ഷ്യം
  choice: ‘ഈ ലോകത്തിന്റെ ന്യായവിധി’ എന്ന ഉറവിടവാചകത്തിലെ ബന്ധം അതേപടി സംരക്ഷിച്ചു.
  alternative: ഈ ലോകത്തിന്മേലുള്ള ശിക്ഷാവിധി; ഈ ലോകം ന്യായം വിധിക്കുന്ന സമയം
  rationale: τοῦ κόσμου τούτου എന്ന ജനിറ്റീവിന് സന്ദർഭത്തിൽ വിധി ലോകത്തിന്മേൽ വരുന്നു എന്ന അർഥമാണ് ശക്തമെങ്കിലും, പരിഭാഷ അതിനെ ‘ശിക്ഷാവിധി’ എന്നു ചുരുക്കി വ്യാഖ്യാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ആവർത്തിക്കുന്ന ‘ഇപ്പോൾ’ നിലനിർത്തി; പദവിയുടെ അർഥം മുഖ്യവാചകത്തിൽ വ്യാഖ്യാനിച്ച് തീർപ്പാക്കിയിട്ടില്ല.
