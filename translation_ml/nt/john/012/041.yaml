reference: John 12:41
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ταῦτα εἶπεν Ἠσαΐας ⸀ὅτι εἶδεν τὴν δόξαν αὐτοῦ, καὶ ἐλάλησεν περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/041.yaml
  text: Isaiah said these things because he saw his glory and spoke about him[a].
translation:
  language: ml
  text: യെശയ്യാവ് ഇവ പറഞ്ഞത്, അവന്റെ മഹത്വം കാണുകയും അവനെക്കുറിച്ച് സംസാരിക്കുകയും ചെയ്തതുകൊണ്ടാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “യെശയ്യാവ് ഇവ പറഞ്ഞത്, ദൈവത്തിന്റെ മഹത്വം കാണുകയും അവനെക്കുറിച്ച് സംസാരിക്കുകയും ചെയ്തതുകൊണ്ടാണ്.” യോഹന്നാന്റെ ഈ സന്ദർഭത്തിൽ സർവനാമങ്ങൾ യേശുവിനെ സൂചിപ്പിക്കുന്നതായിരിക്കാനാണ് കൂടുതൽ സാധ്യത; എന്നാൽ യെശയ്യാവിലെ വിശാലമായ പശ്ചാത്തലം കർത്താവിന്റെ മഹത്വദർശനമാണ് (യെശയ്യാവ് 6:1).'
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα
  choice: ഇവ
  rationale: പിന്നിലേക്ക് സൂചിപ്പിക്കുന്ന നപുംസകലിംഗ ബഹുവചന സർവനാമത്തിന്റെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളരൂപം.
- source_word: εἶπεν
  choice: പറഞ്ഞു
  rationale: λέγω എന്ന ക്രിയയുടെ സാധാരണ അർഥം; തുടർന്നുള്ള ἐλάλησεν എന്നതിൽനിന്നുള്ള നേരിയ പദവ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: Ἠσαΐας
  choice: യെശയ്യാവ്
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ സുപരിചിതമായ പ്രവാചകനാമരൂപം.
- source_word: ὅτι
  choice: കാരണം
  rationale: യെശയ്യാവ് ഇവ പറഞ്ഞതിന്റെ കാരണമാണ് തുടർന്നുള്ള ഉപവാക്യം നൽകുന്നതെന്ന സന്ദർഭോചിതമായ വായന.
- source_word: εἶδεν
  choice: കണ്ടു
  rationale: ὁράω എന്ന ക്രിയയുടെ ലളിതവും നേരിട്ടുള്ളതുമായ ഭൂതകാല പരിഭാഷ.
- source_word: δόξαν
  choice: മഹത്വം
  rationale: യോഹന്നാനിലെ δόξα എന്ന പദത്തിന്റെ ദൈവശാസ്ത്രപരമായ ഭാരവും മലയാളത്തിലെ സ്വാഭാവിക ബൈബിൾപ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: αὐτοῦ
  choice: അവന്റെ
  rationale: δόξαν-നോടു ചേർന്നുള്ള ബന്ധസൂചക സർവനാമം മലയാളത്തിൽ സ്വാഭാവികമായി ഉടമസ്ഥരൂപത്തിൽ നൽകുന്നു; ആരെയാണ് സൂചിപ്പിക്കുന്നതെന്ന യഥാർഥ സർവനാമാത്മക അവ്യക്തത മുഖ്യവാക്യത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐλάλησεν
  choice: സംസാരിച്ചു
  rationale: λαλέω എന്ന ക്രിയയെ εἶπεν എന്നതിലെ ‘പറഞ്ഞു’ എന്നതിൽനിന്ന് നേരിയ വ്യത്യാസത്തോടെ അവതരിപ്പിക്കുന്നു.
- source_word: περὶ αὐτοῦ
  choice: അവനെക്കുറിച്ച്
  rationale: περί + genitive എന്നതിന്റെ സ്വാഭാവിക ആധുനിക മലയാള പരിഭാഷ; സർവനാമത്തിന്റെ അവ്യക്തത സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: αὐτοῦ / αὐτοῦ എന്നീ സർവനാമങ്ങൾ ആരെ സൂചിപ്പിക്കുന്നു
  choice: മുഖ്യവാക്യത്തിൽ ‘അവന്റെ / അവനെക്കുറിച്ച്’ എന്ന് സർവനാമരൂപം നിലനിർത്തി; യോഹന്നാന്റെ സമീപസന്ദർഭത്തിൽ ഇവ യേശുവിനെ സൂചിപ്പിക്കുന്നതായി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: ‘ദൈവത്തിന്റെ മഹത്വം’ എന്നു വ്യക്തമാക്കുക, അല്ലെങ്കിൽ മുഖ്യവാക്യത്തിൽ നേരിട്ട് ‘യേശുവിന്റെ മഹത്വം’ എന്നു നൽകുക.
  rationale: ഗ്രീക്ക് പാഠം സർവനാമങ്ങളാണ് ഉപയോഗിക്കുന്നത്. യോഹന്നാൻ 12-ന്റെ സമീപസന്ദർഭം യേശുവിലേക്കാണ് ശക്തമായി വിരൽചൂണ്ടുന്നത്; എന്നാൽ യെശയ്യാവ് 6-ലെ പശ്ചാത്തലം കർത്താവിന്റെ മഹത്വദർശനമാണ്. അതിനാൽ മുഖ്യവാക്യം യഥാർഥ ഭാഷാപരമായ അവ്യക്തത സംരക്ഷിക്കുകയും അടിക്കുറിപ്പ് വ്യാഖ്യാനസാധ്യതകൾ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ഇവ പറഞ്ഞു’ എന്നത് മൂലത്തിലെ ബഹുവചനം നിലനിർത്തുന്നു. മുഖ്യവാക്യത്തിലെ സർവനാമങ്ങൾ ഉദ്ദേശപൂർവം പരിഹരിക്കാതെ വെച്ചിരിക്കുന്നു; [a] അടിക്കുറിപ്പ് വായനാസാധ്യതയും യെശയ്യാവിന്റെ പശ്ചാത്തലവും നൽകുന്നു.
