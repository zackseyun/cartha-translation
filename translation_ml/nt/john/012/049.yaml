id: JHN.12.49
reference: John 12:49
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι ἐγὼ ἐξ ἐμαυτοῦ οὐκ ἐλάλησα, ἀλλ’ ὁ πέμψας με πατὴρ αὐτός μοι ἐντολὴν ⸀δέδωκεν τί εἴπω καὶ τί λαλήσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/049.yaml
  text: For I have not spoken from myself[b][a], but the Father who sent me has himself given me a command as to what I should say and what I should speak.
translation:
  language: ml
  text: കാരണം, ഞാൻ സ്വന്തമായി സംസാരിച്ചിട്ടില്ല[a]; എന്നെ അയച്ച പിതാവുതന്നെ ഞാൻ എന്തു പറയണമെന്നും എന്തു സംസാരിക്കണമെന്നും[b] എനിക്കു കല്പന നൽകിയിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘എന്റെ ഇഷ്ടപ്രകാരം’ അല്ലെങ്കിൽ ‘എന്റെ സ്വന്തം അധികാരത്തിൽനിന്ന്.’'
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ ഇവിടെ ‘പറയുക’, ‘സംസാരിക്കുക’ എന്നീ രണ്ടു വ്യത്യസ്ത ക്രിയകളാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; വിവർത്തനത്തിലും ആ വ്യത്യാസം നിലനിർത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: കാരണം
  rationale: മുൻവാക്യത്തോടുള്ള കാരണബന്ധം വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: ἐξ ἐμαυτοῦ
  choice: സ്വന്തമായി
  rationale: യേശു സ്വതന്ത്രമായ സ്വന്തം പ്രേരണയിലോ അധികാരത്തിലോ സംസാരിക്കുന്നില്ലെന്ന ആശയം സ്വാഭാവികമായി അറിയിക്കുന്നു; ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: οὐκ ἐλάλησα
  choice: സംസാരിച്ചിട്ടില്ല
  rationale: യേശുവിന്റെ ഇതുവരെയുള്ള ശുശ്രൂഷയിലെ സംസാരത്തെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിലെ പൂർത്തകാല നിഷേധരൂപം സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: ὁ πέμψας με πατὴρ
  choice: എന്നെ അയച്ച പിതാവ്
  rationale: കർത്തൃവാചക കൃതന്തത്തെ സ്വാഭാവികമായ ബന്ധവാക്യമായി നൽകുകയും πατήρ എന്ന ദൈവിക അഭിസംബോധനയെ ‘പിതാവ്’ എന്നു നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: αὐτός
  choice: പിതാവുതന്നെ
  rationale: ഗ്രീക്കിലെ ഊന്നൽ മലയാളത്തിലെ ‘തന്നെ’ മുഖേന വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: ἐντολήν
  choice: കല്പന
  rationale: ആധികാരികമായ നിർദേശത്തിന്റെ ശക്തി നിലനിർത്തുന്ന, സഭാഭേദപരമല്ലാത്ത സാധാരണ ബൈബിൾ-മലയാള പദം.
- source_word: δέδωκεν
  choice: നൽകിയിരിക്കുന്നു
  rationale: മുമ്പ് നൽകിയതും ഇപ്പോഴും പ്രാബല്യമുള്ളതുമായ കല്പന എന്ന ഗ്രീക്ക് പൂർണ്ണകാലത്തിന്റെ പ്രസക്തി പ്രകടമാക്കുന്നു.
- source_word: τί εἴπω καὶ τί λαλήσω
  choice: എന്തു പറയണമെന്നും എന്തു സംസാരിക്കണമെന്നും
  rationale: λέγω, λαλέω എന്നീ വ്യത്യസ്ത ക്രിയകളെ യഥാക്രമം ‘പറയുക’, ‘സംസാരിക്കുക’ എന്നു വേർതിരിച്ച് മൂലപാഠത്തിലെ ആവർത്തനവും സൂക്ഷ്മവ്യത്യാസവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: പുത്രന്റെ വാക്കും പിതാവിന്റെ കല്പനയും തമ്മിലുള്ള ബന്ധം
  choice: യേശു സ്വന്തമായി സംസാരിക്കുന്നില്ല; അയച്ച പിതാവിന്റെ കല്പനപ്രകാരമാണ് സംസാരിക്കുന്നത്
  alternative: യേശു പിതാവിനോട് യോജിച്ചുകൊണ്ടെങ്കിലും സ്വതന്ത്ര അധികാരത്തിൽ സംസാരിക്കുന്നു; അല്ലെങ്കിൽ വെറും മനുഷ്യപ്രവാചകനായി മാത്രം സംസാരിക്കുന്നു
  rationale: ‘സ്വന്തമായി അല്ല’, ‘പിതാവുതന്നെ ... കല്പന നൽകിയിരിക്കുന്നു’ എന്നീ മൂലപാഠഘടകങ്ങൾ ദൗത്യത്തിലും സംസാരത്തിലും ഉള്ള ബന്ധം വ്യക്തമാക്കുന്നു. എന്നാൽ സ്വഭാവപരമായ അധമത്വം പോലുള്ള നിഗമനം വിവർത്തനം കൂട്ടിച്ചേർക്കുന്നില്ല.
- issue: πατήρ എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: പിതാവ്
  alternative: പിതാവ് എന്ന ബന്ധസൂചന ഒഴിവാക്കി ‘ദൈവം’ എന്നു വ്യാഖ്യാനപരമായി നൽകുക
  rationale: യോഹന്നാന്റെ സന്ദർഭത്തിലെ പിതാവ്–പുത്രൻ ഭാഷ നേരിട്ട് സംരക്ഷിക്കേണ്ടതിനാൽ മൂലപദം അതേ ബന്ധനാമത്തിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ വാക്യഘടന. ‘കല്പന’, ‘പിതാവ്’ എന്നിവ സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന ബൈബിൾ-രജിസ്റ്റർ നിലനിർത്തുന്നു; അനാവശ്യമായ സഭാഭേദപരമായ സാങ്കേതികപദങ്ങൾ ഒഴിവാക്കിയിരിക്കുന്നു.
