source:
  edition: SBLGNT
  text: εἶπεν οὖν ὁ Ἰησοῦς· Ἄφες αὐτήν, ⸀ἵνα εἰς τὴν ἡμέραν τοῦ ἐνταφιασμοῦ μου ⸀τηρήσῃ αὐτό·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/007.yaml
  text: So Jesus said[a], “Leave her alone[b], so that she may keep it for the day of my burial.”
translation:
  language: ml
  text: 'അപ്പോൾ യേശു പറഞ്ഞു: “അവളെ വെറുതെ വിടുക; എന്റെ സംസ്കാരദിവസത്തിനായി അവൾ അത് സൂക്ഷിക്കട്ടെ.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അവളെ വെറുതെ വിടുക; എന്റെ സംസ്കാരദിവസത്തിനായി അവൾ അത് സൂക്ഷിച്ചിരിക്കുന്നു.” ഈ വാക്യം അവൾ ഇതിനകം ചെയ്തതിനെ വിവരിക്കുന്നതായി ചിലർ മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: അല്ലെങ്കിൽ, “അവളെ വെറുതെ വിടുക; എന്റെ സംസ്കാരദിവസംവരെ അവൾ അത് സൂക്ഷിക്കട്ടെ.” ഗ്രീക്ക് വാക്യഘടനയ്ക്ക് കൂടുതൽ വ്യക്തമായ ഈ കാലസൂചനയും നൽകാനാകും.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: അപ്പോൾ
  rationale: കഥയുടെ തുടർച്ചയും സന്ദർഭത്തിലെ പ്രതികരണബന്ധവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു; ‘അതുകൊണ്ട്’ എന്നത് ഇവിടെ ആവശ്യത്തിലധികം യുക്തിനിഗമനഭാവം നൽകാം.
- source_word: Ἄφες αὐτήν
  choice: അവളെ വെറുതെ വിടുക
  rationale: ഇവിടെ ἀφίημι എന്ന ക്രിയയുടെ ആജ്ഞാരൂപം അവളെ തടസ്സപ്പെടുത്താതിരിക്കുക എന്ന സന്ദർഭോചിതമായ അർഥത്തിലാണ്; ഈ പ്രയോഗം അതിന്റെ ശക്തി വ്യക്തമായി നൽകുന്നു.
- source_word: ἵνα
  choice: …സൂക്ഷിക്കട്ടെ
  rationale: മലയാളത്തിലെ ആശംസാ/അനുവാദാത്മക ക്രിയാരൂപത്തിലൂടെ ഉദ്ദേശ്യമോ ലക്ഷ്യമോ സൂചിപ്പിക്കുന്ന ἵνα-വാക്യത്തിന്റെ ബന്ധം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: εἰς τὴν ἡμέραν
  choice: ദിവസത്തേക്കായി
  rationale: ഭാവിയിൽ ഉദ്ദേശിച്ചിരിക്കുന്ന അവസരത്തെ ചൂണ്ടിക്കാണിക്കുന്നു; മുഖ്യപാഠത്തിൽ ‘വരെ’ എന്ന കർശനമായ കാലപരിധി നിർബന്ധമാക്കാതെ ഗ്രീക്കിലെ വിശാലത നിലനിർത്തുന്നു.
- source_word: ἐνταφιασμοῦ
  choice: സംസ്കാരം
  rationale: മൃതശരീരം സംസ്കരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന വ്യക്തവും മാന്യവും സാധാരണ വായനക്കാർക്ക് പരിചിതവുമായ മലയാളപദമാണ്.
- source_word: τηρήσῃ
  choice: സൂക്ഷിക്കട്ടെ
  rationale: τηρέω എന്നതിന്റെ കരുതിവെക്കുക/സൂക്ഷിക്കുക എന്ന അർഥം നൽകുകയും ἵνα-യോടു ചേർന്ന ഉദ്ദേശ്യഭാവം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: αὐτό
  choice: അത്
  rationale: മുൻസന്ദർഭത്തിലെ സുഗന്ധതൈലത്തെ സൂചിപ്പിക്കുന്ന നപുംസക സർവനാമം വിശദീകരണപദം ചേർക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ സംസ്കാരവുമായി ഈ പ്രവൃത്തിക്കുള്ള ബന്ധം
  choice: അവൾ അത് തന്റെ സംസ്കാരദിവസത്തേക്കായി സൂക്ഷിക്കട്ടെ എന്ന മുന്നോട്ടുനോക്കുന്ന ഉദ്ദേശ്യവാക്യമായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘എന്റെ സംസ്കാരദിവസത്തേക്കായി അവൾ അത് സൂക്ഷിച്ചിരിക്കുന്നു’ എന്നവിധം ഇതിനകം ചെയ്ത പ്രവൃത്തിയെ വിവരിക്കുന്ന വായന; അല്ലെങ്കിൽ ‘എന്റെ സംസ്കാരദിവസംവരെ അവൾ അത് സൂക്ഷിക്കട്ടെ’ എന്ന കാലപരിധി വ്യക്തമാക്കുന്ന വായന.
  rationale: ഗ്രീക്ക് വാക്യഘടന ദുഷ്കരവും ഒന്നിലധികം വ്യാഖ്യാനങ്ങൾക്ക് ഇടയുള്ളതുമാണ്. മുഖ്യപാഠം Ἄφες…ἵνα…τηρήσῃ എന്ന ഘടനയുടെ നേരിട്ടുള്ള ഉദ്ദേശ്യഭാവം പിന്തുടരുന്നു; യഥാർഥമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പുകളിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘സംസ്കാരം’ എന്നത് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ സന്ദർഭത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു. ദുഷ്കരമായ ഗ്രീക്ക് വാക്യഘടന മുഖ്യപാഠത്തിൽ അമിതമായി വിശദീകരിക്കാതെ, വ്യത്യസ്ത സാധ്യതകൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
