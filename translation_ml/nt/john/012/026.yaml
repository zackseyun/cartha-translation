  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐὰν ἐμοί ⸂τις διακονῇ⸃ ἐμοὶ ἀκολουθείτω, καὶ ὅπου εἰμὶ ἐγὼ ἐκεῖ καὶ ὁ διάκονος ὁ ἐμὸς ἔσται· ⸀ἐάν τις ἐμοὶ διακονῇ τιμήσει αὐτὸν ὁ πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/026.yaml
  text: If anyone serves me[a], let him follow me; and where I am, there my servant will be also. If anyone serves me, the Father will honor him.
translation:
  language: ml
  text: ആരെങ്കിലും എന്നെ സേവിക്കുന്നെങ്കിൽ[a], അവൻ എന്നെ അനുഗമിക്കട്ടെ. ഞാൻ എവിടെയാണോ, അവിടെ എന്റെ സേവകനും ഉണ്ടായിരിക്കും. ആരെങ്കിലും എന്നെ സേവിക്കുന്നെങ്കിൽ, പിതാവ് അവനെ ആദരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഗ്രീക്കിൽ പൊതുവ്യാപക അർഥമുള്ള പുല്ലിംഗ ഏകവചന ഘടനയാണ്: ‘ആരെങ്കിലും എന്നെ സേവിക്കുന്നെങ്കിൽ ... പിതാവ് അവനെ ആദരിക്കും.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: διακονῇ (διακονέω)
  choice: സേവിക്കുന്നെങ്കിൽ
  rationale: യേശുവിനോടുള്ള സേവനമാണ് സന്ദർഭത്തിലെ അർഥം. ‘ശുശ്രൂഷിക്കുന്നെങ്കിൽ’ എന്നത് സാധ്യമെങ്കിലും സഭാപദവിയുടെയോ ഔദ്യോഗിക ശുശ്രൂഷയുടെയോ ഇടുങ്ങിയ ധ്വനി നൽകാം; ‘സേവിക്കുക’ പൊതുവായ ബന്ധപരമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀκολουθείτω
  choice: അവൻ എന്നെ അനുഗമിക്കട്ടെ
  rationale: വർത്തമാനകാല ആജ്ഞയുടെ ശിഷ്യത്വപരമായ ആഹ്വാനവും ആജ്ഞാഭാവവും ‘അനുഗമിക്കട്ടെ’ നിലനിർത്തുന്നു; തുടർച്ചയെ അനാവശ്യമായി അതിവ്യക്തമാക്കുന്നില്ല.
- source_word: διάκονος
  choice: സേവകൻ
  rationale: ഇവിടെ പിൽക്കാല സഭാപദവിയായ ‘ഡീക്കൻ’ അല്ല, യേശുവിനെ സേവിക്കുന്ന ആളാണ് ഉദ്ദേശ്യം. ‘സേവകൻ’ ക്രിയയുമായുള്ള പദബന്ധവും പൊതുവായ അർഥവും നിലനിർത്തുന്നു.
- source_word: ὅπου εἰμὶ ἐγὼ
  choice: ഞാൻ എവിടെയാണോ
  rationale: പ്രകടമായ ἐγώ നൽകുന്ന ഊന്നൽ മലയാളത്തിലെ സ്വാഭാവിക വാക്യഘടനയിൽ മതിയായ വിധം പ്രകടമാകുന്നു; ‘ഞാൻ തന്നേ’ എന്ന് ചേർക്കുന്നത് ഇവിടെ അതിരുകടന്ന ഊന്നലാകും.
- source_word: ἐκεῖ καὶ
  choice: അവിടെ ... ഉം
  rationale: സ്ഥലസൂചനയായ ἐκεῖയും കൂട്ടിച്ചേർക്കൽ സൂചിപ്പിക്കുന്ന καίയും ‘അവിടെ ... സേവകനും’ എന്ന ഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: τιμήσει
  choice: ആദരിക്കും
  rationale: τιμάω ഇവിടെ ആദരം നൽകുക എന്ന അർഥത്തിലാണ്. ‘ആദരിക്കും’ ഭാവികാല വാഗ്ദാനം സംക്ഷിപ്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: ὁ πατήρ
  choice: പിതാവ്
  rationale: ഗ്രീക്കിൽ ‘എന്റെ പിതാവ്’ എന്ന ഉടമസ്ഥസൂചനയില്ല; അതിനാൽ അത് ചേർക്കാതെ യോഹന്നാനിലെ ദൈവസൂചന നിലനിർത്തുന്നു.
- source_word: τις
  choice: ആരെങ്കിലും / ആരെങ്കിലും
  rationale: അനിശ്ചിത സർവനാമത്തിന്റെ പൊതുവ്യാപക അർഥം സ്വാഭാവിക മലയാളത്തിൽ ലിംഗനിരപേക്ഷമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: αὐτόν
  choice: അവനെ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ഏകവചന സർവനാമത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുകയും മുൻപുള്ള പൊതുവ്യാപക τις-ലേക്കുള്ള പരാമർശം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: നിബന്ധനാവാക്യത്തിലെ പൊതുവ്യാപക പുല്ലിംഗ പരാമർശം
  choice: τις എന്നത് ‘ആരെങ്കിലും/ആരെങ്കിലും’ എന്നും തുടർന്നുള്ള പുല്ലിംഗ ഏകവചനരൂപങ്ങൾ ‘അവൻ/അവനെ’ എന്നും പരിഭാഷപ്പെടുത്തി.
  alternative: മുഴുവനായും ലിംഗനിരപേക്ഷമായി ‘ആ വ്യക്തി’ പോലുള്ള രൂപങ്ങൾ ഉപയോഗിക്കുക.
  rationale: ഉറവിടത്തിലെ അനിശ്ചിത സർവനാമത്തിന്റെ ഉൾക്കൊള്ളുന്ന വ്യാപ്തിയും അതോടൊപ്പം വരുന്ന പുല്ലിംഗ ഏകവചന അന്വയവും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു. ഈ വ്യാകരണരൂപം പുരുഷന്മാർക്കു മാത്രമായുള്ള പരിമിതിയായി വായിക്കരുതെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- issue: സേവനത്തിനു പിതാവ് നൽകുന്ന ആദരത്തിന്റെ സ്വഭാവം
  choice: ‘പിതാവ് അവനെ ആദരിക്കും’ എന്ന് വിശദീകരണം ചേർക്കാതെ പരിഭാഷപ്പെടുത്തി.
  alternative: അതിനെ സ്വർഗീയ പ്രതിഫലം അല്ലെങ്കിൽ അന്ത്യകാല മഹത്വീകരണം എന്നു മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കുക.
  rationale: വാക്യം ദൈവിക ആദരം വാഗ്ദാനം ചെയ്യുന്നു, എന്നാൽ അതിന്റെ കൃത്യരൂപം ഇവിടെ നിർവചിക്കുന്നില്ല. അതിനാൽ ഗ്രീക്കിലെ ദൈവശാസ്ത്രപരമായ വിശാലത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ശുശ്രൂഷകൻ/ഡീക്കൻ’ പോലുള്ള സഭാപദവിസൂചനകൾ ഒഴിവാക്കി, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ‘സേവിക്കുക/സേവകൻ’ പദജോടി ഉപയോഗിച്ചു. ഗ്രീക്കിലെ ആവർത്തനവും നിബന്ധനാ ഘടനയും നിലനിർത്തി.
