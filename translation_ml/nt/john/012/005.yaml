id: JHN.12.5
reference: John 12:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Διὰ τί τοῦτο τὸ μύρον οὐκ ἐπράθη τριακοσίων δηναρίων καὶ ἐδόθη πτωχοῖς;
base_translation:
  language: en
  yaml_path: translation/nt/john/012/005.yaml
  text: Why was this perfume not sold for three hundred denarii and given to the poor?[a]
translation:
  language: ml
  text: “ഈ സുഗന്ധതൈലം മുന്നൂറ് ദെനാരിക്ക് വിറ്റ് ആ പണം ദരിദ്രർക്കു കൊടുക്കാതിരുന്നത് എന്തുകൊണ്ട്?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഒരു ദെനാരി ഒരു തൊഴിലാളിയുടെ സാധാരണ ദിവസക്കൂലിയായിരുന്നു; ജോലി ചെയ്യാത്ത ദിവസങ്ങൾ കണക്കിലെടുക്കുമ്പോൾ മുന്നൂറ് ദെനാരി ഏകദേശം ഒരു വർഷത്തെ വരുമാനത്തിന് തുല്യമായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: Διὰ τί
  choice: എന്തുകൊണ്ട്?
  rationale: ചോദ്യത്തിന്റെ കാരണം അന്വേഷിക്കുന്ന സ്വാഭാവികവും സംക്ഷിപ്തവുമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: μύρον
  choice: സുഗന്ധതൈലം
  rationale: വിലയേറിയ സുഗന്ധമുള്ള അഭിഷേകദ്രവ്യത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘സുഗന്ധതൈലം’ സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളമാണ്.
- source_word: ἐπράθη
  choice: വിറ്റ്
  rationale: ഗ്രീക്കിലെ കർമ്മണിപ്രയോഗത്തിന്റെ അർഥം മലയാളത്തിലെ സ്വാഭാവികമായ സംയുക്തചോദ്യഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: τριακοσίων δηναρίων
  choice: മുന്നൂറ് ദിനാറിന്
  rationale: ജനിറ്റീവ് വിലയെ സൂചിപ്പിക്കുന്നു. ചരിത്രപരമായ നാണയനാമം നിലനിർത്തുകയും അതിന്റെ മൂല്യം അടിക്കുറിപ്പിൽ വിശദീകരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐδόθη
  choice: ആ പണം ... കൊടുക്കാതിരുന്നത്
  rationale: ഗ്രീക്കിൽ ‘കൊടുക്കുക’ എന്നതിന്റെ കർമ്മണിരൂപമാണെങ്കിലും, വിറ്റുകിട്ടുന്ന തുകയാണ് ദരിദ്രർക്കു കൊടുക്കുന്നത് എന്ന ആശയം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടമാക്കുന്നു.
- source_word: πτωχοῖς
  choice: ദരിദ്രർക്കു
  rationale: ദത്തിവ് ബഹുവചനത്തിൽ സാമൂഹികവിഭാഗമായി സൂചിപ്പിക്കുന്നവരെ നേരിട്ട് അവതരിപ്പിക്കുന്ന സാധാരണ മലയാളപ്രയോഗം.
