source:
  edition: SBLGNT
  text: Μὴ φοβοῦ, θυγάτηρ Σιών· ἰδοὺ ὁ βασιλεύς σου ἔρχεται, καθήμενος ἐπὶ πῶλον ὄνου.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/015.yaml
  text: Do not be afraid[a], daughter of Zion. Look, your King is coming[e][d][c][b], seated on a donkey’s colt.
translation:
  language: ml
  text: “സീയോൻപുത്രിയേ, ഭയപ്പെടേണ്ടാ; ഇതാ, നിന്റെ രാജാവ് കഴുതക്കുട്ടിയുടെമേൽ ഇരുന്ന് വരുന്നു.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സീയോൻപുത്രിയേ’ എന്നത് സീയോനെ, അതായത് യെരൂശലേമിനെ, മകളായി വ്യക്തിവൽക്കരിക്കുന്ന പ്രവാചകപ്രയോഗമാണ്.
    reason: cultural_note
  - marker: b
    text: ഈ വാക്കുകൾ സെഖര്യാവ് 9:9-നെ പ്രതിധ്വനിപ്പിക്കുകയും യേശുവിനെ സീയോന്റെ വാഗ്ദത്ത രാജാവായി അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
    reason: cross_reference
  - marker: c
    text: 'അക്ഷരാർഥത്തിൽ: ‘ഒരു കഴുതയുടെ കുട്ടിയുടെമേൽ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ φοβοῦ
  choice: ഭയപ്പെടേണ്ടാ
  rationale: μή സഹിതമുള്ള വർത്തമാനകാല ആജ്ഞാരൂപം ഭയപ്പെടരുതെന്ന വിലക്ക് പ്രകടിപ്പിക്കുന്നു. ‘ഭയപ്പെടേണ്ടാ’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആധുനിക മലയാളമാണ്.
- source_word: θυγάτηρ Σιών
  choice: സീയോൻപുത്രീ
  rationale: വിളിസംബോധനയിലുള്ള θυγάτηρ-ഉം Σιών എന്ന ബന്ധസൂചകപദവും സീയോൻ/യെരൂശലേമിനെ പുത്രിയായി വ്യക്തിവൽക്കരിക്കുന്ന പ്രവാചകപ്രയോഗമാണ്. സംയുക്തരൂപം മലയാളത്തിൽ ആ കാവ്യാത്മക അഭിസംബോധന നിലനിർത്തുന്നു.
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ദർശകാവ്യയത്തിന്റെ പ്രവർത്തനം സ്വാഭാവിക മലയാളത്തിൽ നേരിട്ട് പകർന്നു നൽകുന്നു.
- source_word: ὁ βασιλεύς σου
  choice: നിന്റെ രാജാവ്
  rationale: നിശ്ചിത നാമപദവും രണ്ടാംപുരുഷ ഏകവചന ഉടമസ്ഥസർവനാമവും നേരിട്ട് പകർന്നു. മലയാളലിപിയിൽ ഇംഗ്ലീഷിലേതുപോലുള്ള വലിയക്ഷര വ്യത്യാസമില്ല; മശീഹാപരമായ രാജപദവി സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: ἔρχεται
  choice: വരുന്നു
  rationale: വർത്തമാനകാല ക്രിയയുടെ സജീവവും തത്സമയവുമായ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: καθήμενος
  choice: ഇരുന്നുകൊണ്ട്
  rationale: അവൻ വരുന്ന രീതി സൂചിപ്പിക്കുന്ന വർത്തമാനകാല പങ്കാളിക്രിയയെ വ്യാഖ്യാനാത്മകമായ ‘സവാരി ചെയ്ത്’ എന്നു വികസിപ്പിക്കാതെ പകർന്നു.
- source_word: ἐπὶ πῶλον ὄνου
  choice: കഴുതക്കുട്ടിയുടെമേൽ
  rationale: πῶλος എന്ന കുട്ടിമൃഗത്തെയും ὄνος അതിനെ കഴുതയായി നിർണ്ണയിക്കുന്നതെയും സ്വാഭാവികമായ മലയാള സംയുക്തത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: സെഖര്യാവ് 9:9-ലെ മശീഹാപരമായ രാജകീയ പ്രതിധ്വനി
  choice: ‘സീയോൻപുത്രീ’, ‘നിന്റെ രാജാവ്’ എന്നീ പ്രവാചക-രാജകീയ പദങ്ങൾ മുഖ്യപാഠത്തിൽ അതേപടി നിലനിർത്തി; വിശദീകരണം അടിക്കുറിപ്പിലാക്കി.
  alternative: സീയോനെ യെരൂശലേം എന്നു മുഖ്യപാഠത്തിൽ വ്യാഖ്യാനിക്കുകയോ യേശുവാണ് വാഗ്ദത്ത മശീഹാരാജാവ് എന്നു അവിടെത്തന്നെ വികസിപ്പിക്കുകയോ ചെയ്യുക.
  rationale: ഗ്രീക്ക് പാഠത്തിന്റെ സൂചനാശക്തി സംരക്ഷിക്കുമ്പോൾ അതിലില്ലാത്ത വിശദീകരണം മുഖ്യവാക്യത്തിൽ ചേർക്കാതിരിക്കാൻ.
- issue: ‘രാജാവ്’ എന്ന പദത്തിന്റെ പദവിസ്വഭാവം
  choice: ‘നിന്റെ രാജാവ്’ എന്ന് ലളിതമായി വിവർത്തനം ചെയ്തു.
  alternative: ‘നിന്റെ രാജാധിരാജൻ’ പോലുള്ള വിപുലീകരിച്ച ബഹുമാനപദം ഉപയോഗിക്കുക.
  rationale: മലയാളത്തിൽ വലിയക്ഷര വ്യത്യാസമില്ല; സന്ദർഭത്തിലെ മശീഹാപരമായ അർഥം നിലനിൽക്കുന്നു. അധിക പദവി ചേർക്കുന്നത് മൂലപാഠത്തെ വികസിപ്പിക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. പ്രവാചകാഭിസംബോധനയുടെ കാവ്യഭാവം ‘സീയോൻപുത്രീ’ എന്ന രൂപത്തിൽ നിലനിർത്തി; പഴഞ്ചൻ ശൈലിയും സഭാവിഭാഗ-വിശിഷ്ട പദപ്രയോഗങ്ങളും ഒഴിവാക്കി.
