id: JHN.12.34
reference: John 12:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀οὖν αὐτῷ ὁ ὄχλος· Ἡμεῖς ἠκούσαμεν ἐκ τοῦ νόμου ὅτι ὁ χριστὸς μένει εἰς τὸν αἰῶνα, καὶ πῶς ⸂λέγεις σὺ⸃ ⸀ὅτι δεῖ ὑψωθῆναι τὸν υἱὸν τοῦ ἀνθρώπου; τίς ἐστιν οὗτος ὁ υἱὸς τοῦ ἀνθρώπου;
base_translation:
  language: en
  yaml_path: translation/nt/john/012/034.yaml
  text: So the crowd answered him[a], "We have heard from the Law that the Messiah remains forever[b], and how can you say that the Son of Man must be lifted up? Who is this Son of Man?"
translation:
  language: ml
  text: 'അപ്പോൾ ജനക്കൂട്ടം അവനോടു മറുപടി പറഞ്ഞു: “മശീഹ[a] എന്നേക്കും നിലനിൽക്കുന്നു എന്നു ന്യായപ്രമാണത്തിൽനിന്ന് ഞങ്ങൾ കേട്ടിട്ടുണ്ട്. അങ്ങനെയിരിക്കെ, മനുഷ്യപുത്രൻ ഉയർത്തപ്പെടണം[b] എന്നു നീ എങ്ങനെ പറയുന്നു? ഈ മനുഷ്യപുത്രൻ ആരാണ്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ “ക്രിസ്തു”; ഇവിടെ അത് ഒരു സ്ഥാനപ്പേരായതിനാൽ “മശീഹ” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “ഉന്നതനാക്കപ്പെടണം” എന്നും അർഥമാകാം. യോഹന്നാന്റെ സുവിശേഷത്തിൽ “ഉയർത്തപ്പെടുക” എന്നതിന് ശാരീരികമായി മുകളിലേക്ക് ഉയർത്തപ്പെടുക, മഹത്ത്വത്തിലേക്ക് ഉയർത്തപ്പെടുക എന്നീ രണ്ടു ഭാവങ്ങളും ഉണ്ടായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη οὖν αὐτῷ ὁ ὄχλος
  choice: അപ്പോൾ ജനക്കൂട്ടം അവനോടു മറുപടി പറഞ്ഞു
  rationale: οὖν എന്ന ആഖ്യാനബന്ധത്തെ സ്വാഭാവികമായി ‘അപ്പോൾ’ എന്നു സൂചിപ്പിക്കുന്നു; ὄχλος എന്നത് ‘ജനക്കൂട്ടം’ എന്നും αὐτῷ എന്നത് ‘അവനോടു’ എന്നും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: Ἡμεῖς ἠκούσαμεν ἐκ τοῦ νόμου
  choice: ന്യായപ്രമാണത്തിൽനിന്ന് ഞങ്ങൾ കേട്ടിട്ടുണ്ട്
  rationale: ലഭിച്ചുപോന്ന ഉപദേശം ഇപ്പോഴും പ്രസക്തമാണെന്ന ഭാവം ‘കേട്ടിട്ടുണ്ട്’ നൽകുന്നു. νόμος എന്ന യഹൂദ തിരുവെഴുത്തുപരമായ പ്രയോഗം ‘ന്യായപ്രമാണം’ എന്ന പരിചിത പദത്തിലൂടെ സംരക്ഷിക്കുന്നു.
- source_word: ὁ χριστός
  choice: മശീഹ
  rationale: ഇവിടെ χριστός വ്യക്തിനാമംപോലെയല്ല, പ്രതീക്ഷിക്കപ്പെട്ട അഭിഷിക്തന്റെ സ്ഥാനപ്പേരായാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; അതിനാൽ യഹൂദ മശീഹാപശ്ചാത്തലം വ്യക്തമാക്കുന്ന ‘മശീഹ’ സ്വീകരിച്ചു.
- source_word: μένει εἰς τὸν αἰῶνα
  choice: എന്നേക്കും നിലനിൽക്കുന്നു
  rationale: μένει എന്നതിന്റെ തുടർച്ചയെയും εἰς τὸν αἰῶνα എന്ന പ്രയോഗത്തിന്റെ സ്ഥിരകാല അർഥത്തെയും സ്വാഭാവിക മലയാളത്തിൽ പകർന്നു.
- source_word: πῶς λέγεις σὺ
  choice: നീ പറയുന്നതെങ്ങനെ?
  rationale: ഇത് വെറും വിവരചോദ്യമല്ല, ജനക്കൂട്ടത്തിന്റെ ആശ്ചര്യവും എതിർപ്പും കലർന്ന വെല്ലുവിളിയാണ്; ഊന്നിയ σὺ ‘നീ’ എന്നതിലൂടെ പ്രതിഫലിക്കുന്നു.
- source_word: δεῖ ὑψωθῆναι
  choice: ഉയർത്തപ്പെടണം
  rationale: δεῖ സൂചിപ്പിക്കുന്ന അനിവാര്യത ‘വേണം’ എന്നതിൽ നിലനിൽക്കുന്നു. ὑψωθῆναι എന്നതിലെ ശാരീരികമായി ഉയർത്തപ്പെടലും മഹത്ത്വത്തിലേക്ക് ഉയർത്തപ്പെടലും ഒരുമിച്ച് തുറന്നുവയ്ക്കുന്നു.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: യേശുവിന്റെ സ്ഥാനപരമായ സ്വയംവിശേഷണവും ദാനീയേൽപരമായ അനുരണനവും നിലനിർത്തുന്ന സ്ഥാപിത മലയാള പ്രയോഗമാണിത്.
theological_decisions:
- issue: χριστός എന്ന സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഈ വാക്യത്തിൽ നിർദ്ദിഷ്ടമായി പ്രതീക്ഷിക്കപ്പെട്ട അഭിഷിക്തനെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരാണ്; ‘മശീഹ’ യഹൂദ പ്രതീക്ഷയുടെ പശ്ചാത്തലം കൂടുതൽ നേരിട്ട് നിലനിർത്തുന്നു.
- issue: യോഹന്നാനിലെ ὑψωθῆναι എന്നതിന്റെ ഇരട്ട അർഥം
  choice: ഉയർത്തപ്പെടണം
  alternative: ഉന്നതനാക്കപ്പെടണം
  rationale: ക്രൂശിൽ ശാരീരികമായി ഉയർത്തപ്പെടുന്നതും മഹത്ത്വത്തിലേക്ക് ഉയർത്തപ്പെടുന്നതും തമ്മിലുള്ള യോഹന്നാനീയ പിരിമുറുക്കം ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കാതെ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള മലയാളം. ‘ന്യായപ്രമാണം’, ‘മശീഹ’, ‘മനുഷ്യപുത്രൻ’ എന്നീ സ്ഥാപിത മതപര പദങ്ങൾ പ്രസക്തമായ യഹൂദ-തിരുവെഴുത്തുപശ്ചാത്തലം സംരക്ഷിക്കാൻ ഉപയോഗിച്ചു.
