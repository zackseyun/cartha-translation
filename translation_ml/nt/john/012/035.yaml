revisions:
- from: 'അതുകൊണ്ട് യേശു അവരോടു പറഞ്ഞു: “വെളിച്ചം ഇനിയും കുറച്ചുകാലം നിങ്ങളുടെ ഇടയിൽ ഉണ്ടായിരിക്കും.[a] വെളിച്ചം നിങ്ങൾക്കുള്ളപ്പോൾ നടക്കുക; അങ്ങനെ ഇരുട്ട് നിങ്ങളെ പിടികൂടാതിരിക്കട്ടെ. ഇരുട്ടിൽ നടക്കുന്നവൻ താൻ എവിടേക്കു പോകുന്നു എന്ന് അറിയുന്നില്ല.”'
  to: 'അതുകൊണ്ട് യേശു അവരോടു പറഞ്ഞു: “വെളിച്ചം ഇനിയും അൽപ്പനേരം നിങ്ങളുടെ ഇടയിൽ ഉണ്ട്.[a] ഇരുട്ട് നിങ്ങളെ പിടികൂടാതിരിക്കേണ്ടതിന്, വെളിച്ചം നിങ്ങൾക്കുള്ളപ്പോൾ നടക്കുക. ഇരുട്ടിൽ നടക്കുന്നവൻ താൻ എവിടേക്കു പോകുന്നു എന്ന് അറിയുന്നില്ല.”'
  rationale: The revision corrects the tense of ἐστιν from future to present and makes the ἵνα μή clause explicitly purposive. It otherwise retains the draft’s faithful lexical choices, register, imagery, and footnote treatment of the ambiguity in ἐν ὑμῖν.
  reviewer_model: gpt-5.6-terra
