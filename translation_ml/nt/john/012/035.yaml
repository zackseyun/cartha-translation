id: JHN.12.35
reference: John 12:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς· Ἔτι μικρὸν χρόνον τὸ φῶς ⸂ἐν ὑμῖν⸃ ἐστιν. περιπατεῖτε ⸀ὡς τὸ φῶς ἔχετε, ἵνα μὴ σκοτία ὑμᾶς καταλάβῃ, καὶ ὁ περιπατῶν ἐν τῇ σκοτίᾳ οὐκ οἶδεν ποῦ ὑπάγει.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/035.yaml
  text: So Jesus said to them[a], “The light is still among you for a little while. Walk while you have the light, so that darkness may not overtake you. The one who walks in the darkness does not know where he is going.”
translation:
  language: ml
  text: 'അതുകൊണ്ട് യേശു അവരോടു പറഞ്ഞു: “വെളിച്ചം ഇനിയും അൽപ്പനേരം നിങ്ങളുടെ ഇടയിൽ ഉണ്ട്.[a] ഇരുട്ട് നിങ്ങളെ പിടികൂടാതിരിക്കേണ്ടതിന്, വെളിച്ചം നിങ്ങൾക്കുള്ളപ്പോൾ നടക്കുക. ഇരുട്ടിൽ നടക്കുന്നവൻ താൻ എവിടേക്കു പോകുന്നു എന്ന് അറിയുന്നില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നിങ്ങളിൽ” അല്ലെങ്കിൽ “നിങ്ങളോടൊപ്പം.” ഗ്രീക്ക് പ്രയോഗം ഒന്നിലധികം വിധത്തിൽ മനസ്സിലാക്കാം; എന്നാൽ യേശു അപ്പോൾ പരസ്യമായി അവരുടെ ഇടയിൽ ഉണ്ടായിരുന്ന സമീപസന്ദർഭത്തിന് “നിങ്ങളുടെ ഇടയിൽ” എന്നതാണ് ഏറ്റവും യോജിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യങ്ങളിലെ ജനക്കൂട്ടത്തിന്റെ ചോദ്യത്തോടുള്ള യേശുവിന്റെ മറുപടിയെ ബന്ധിപ്പിക്കുന്ന സ്വാഭാവികമായ സംവാദസൂചകമായി ഉപയോഗിച്ചു; കർശനമായ നിഗമനാർഥം നിർബന്ധിക്കുന്നില്ല.
- source_word: Ἔτι μικρὸν χρόνον
  choice: ഇനിയും കുറച്ചുകാലം
  rationale: ἔτι എന്നതിലെ ‘ഇനിയും’ എന്ന ഭാവവും μικρὸν χρόνον എന്ന ഹ്രസ്വകാലസൂചനയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τὸ φῶς
  choice: വെളിച്ചം
  rationale: യോഹന്നാനിലെ രൂപകപരവും ക്രിസ്തുസംബന്ധവുമായ അർഥസാന്ദ്രത വിശദീകരിച്ച് ചുരുക്കാതെ മൂലരൂപകം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἐν ὑμῖν
  choice: നിങ്ങളുടെ ഇടയിൽ
  rationale: യേശുവിന്റെ പൊതുസാന്നിധ്യം കുറച്ചുകാലംകൂടി അവരോടൊപ്പമുണ്ടെന്ന സമീപസന്ദർഭത്തിന് ഏറ്റവും യോജിക്കുന്നു; മറ്റു സാധ്യാർഥങ്ങൾ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: περιπατεῖτε
  choice: നടക്കുക
  rationale: ജീവിതനടപ്പിനെയും യഥാർഥ സഞ്ചാരത്തെയും ഒരുമിച്ച് സൂചിപ്പിക്കാൻ കഴിയുന്ന മൂലത്തിലെ ‘നടക്കുക’ എന്ന രൂപകം നിലനിർത്തുന്നു.
- source_word: ὡς
  choice: …ഉള്ളപ്പോൾ
  rationale: ἔχετε എന്ന ക്രിയയോടൊപ്പം കാലസൂചനയായി എടുത്ത് വചനത്തിലെ അടിയന്തരത സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἵνα μὴ
  choice: അങ്ങനെ … പിടികൂടാതിരിക്കട്ടെ
  rationale: നിഷേധാത്മക ഉദ്ദേശ്യത്തെയോ അഭിലഷിത ഫലത്തെയോ വ്യക്തമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: σκοτία
  choice: ഇരുട്ട്
  rationale: വെളിച്ചം–ഇരുട്ട് എന്ന യോഹന്നാനീയ വൈരുധ്യം ലളിതമായും നേരിട്ടും നിലനിർത്തുന്നു.
- source_word: καταλάβῃ
  choice: പിടികൂടുക
  rationale: ഇരുട്ട് ഒരാളെ പിന്തുടർന്ന് എത്തിപ്പിടിക്കുന്നതോ കീഴടക്കുന്നതോ ആയ ചലനാത്മക രൂപം സംരക്ഷിക്കുന്നു.
- source_word: ὁ περιπατῶν
  choice: നടക്കുന്നവൻ
  rationale: നാമവാചകമായി പ്രവർത്തിക്കുന്ന ഏകവചന വർത്തമാനകൃദ്‌രൂപത്തെ പൊതുവായ വ്യക്തിസൂചനയായി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: οὐκ οἶδεν ποῦ ὑπάγει
  choice: താൻ എവിടേക്കു പോകുന്നു എന്ന് അറിയുന്നില്ല
  rationale: ദിശയും തുടർന്നുകൊണ്ടിരിക്കുന്ന സഞ്ചാരവും സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് വാക്യം സ്വാഭാവികമായ മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: ‘വെളിച്ചം’ എന്നതിനോടു ബന്ധപ്പെട്ട ἐν ὑμῖν എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: നിങ്ങളുടെ ഇടയിൽ
  alternative: നിങ്ങളിൽ; നിങ്ങളോടൊപ്പം
  rationale: സമീപകഥാസന്ദർഭത്തിൽ ലോകത്തിന്റെ വെളിച്ചമായ യേശുവിന്റെ പരിമിതകാല പൊതുസാന്നിധ്യമാണ് പ്രധാനമായി സൂചിപ്പിക്കുന്നത്. എന്നാൽ ἐν എന്ന പദത്തിന് ആന്തരികമോ സഹവാസപരമോ ആയ അർഥവും സാധ്യമായതിനാൽ ആ അർഥങ്ങൾ അടിക്കുറിപ്പിൽ നിലനിർത്തി; ഉള്ളിൽ വസിക്കൽ സംബന്ധിച്ച പ്രത്യേക ദൈവശാസ്ത്രവ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ നിർബന്ധിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വെളിച്ചം,’ ‘ഇരുട്ട്,’ ‘നടക്കുക’ എന്നീ മൂലരൂപകങ്ങൾ വ്യാഖ്യാനിച്ച് പരത്താതെ നിലനിർത്തിയിരിക്കുന്നു. അടിക്കുറിപ്പുസൂചകം ബന്ധപ്പെട്ട അവ്യക്തപ്രയോഗത്തിന് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
