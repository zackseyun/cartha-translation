  source_fidelity: 'ആദ്യഭാഗം ഗ്രീക്കിനോട് വിശ്വസ്തമാണ്: βαΐα τῶν φοινίκων-ന്റെ അർഥം, അവനെ എതിരേൽക്കാൻ പുറത്തുപോകൽ, ἐκραύγαζον-ന്റെ ആവർത്തന/തുടർച്ചാഭാവം എന്നിവ നന്നായി പ്രതിഫലിക്കുന്നു. എന്നാൽ അവസാനത്തിലെ καὶ ὁ βασιλεὺς τοῦ Ἰσραήλ-നെ മുഖ്യവാക്യത്തിൽ വീണ്ടും ‘വാഴ്ത്തപ്പെട്ടവൻ’ ചേർത്ത് സ്വതന്ത്രമായി പുനർനിർമിക്കുന്നത് ഗ്രീക്കിലെ സംക്ഷിപ്തവും വാക്യബന്ധത്തിൽ ചില അനിശ്ചിതത്വമുള്ളതുമായ ഘടനയെ അനാവശ്യമായി തീർപ്പാക്കുന്നു.'
  naturalness: ‘ഈന്തപ്പനക്കൊമ്പുകൾ’, ‘അവനെ എതിരേൽക്കാൻ പുറപ്പെട്ടു’, ‘ആർപ്പുവിളിച്ചുകൊണ്ടിരുന്നു’ എന്നിവ ആധുനിക നിലവാരമുള്ള സ്വാഭാവിക മലയാളമാണ്. അവസാന രാജകീയ വിശേഷണം ഡാഷ് ഉപയോഗിച്ച് അനുബന്ധമായി നൽകുന്നത് കൂടുതൽ സുഗമവും വ്യക്തവുമാണ്.
