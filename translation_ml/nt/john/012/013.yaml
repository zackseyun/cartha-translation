id: JHN.12.13
reference: John 12:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔλαβον τὰ βαΐα τῶν φοινίκων καὶ ἐξῆλθον εἰς ὑπάντησιν αὐτῷ, καὶ ⸀ἐκραύγαζον· Ὡσαννά, εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου, ⸂καὶ ὁ⸃ βασιλεὺς τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/013.yaml
  text: They took the palm branches and went out to meet him[a], and they were crying out, “Hosanna! Blessed is the one who comes in the name of the Lord[c][b], even the King of Israel!”
translation:
  language: ml
  text: 'അവർ ഈന്തപ്പനക്കൊമ്പുകൾ എടുത്തുകൊണ്ട് അവനെ എതിരേൽക്കാൻ പുറപ്പെട്ടു. അവർ ഇങ്ങനെ ആർപ്പുവിളിച്ചുകൊണ്ടിരുന്നു: “ഹോശന്നാ![a] കർത്താവിന്റെ നാമത്തിൽ വരുന്നവൻ വാഴ്ത്തപ്പെട്ടവൻ![b]—ഇസ്രായേലിന്റെ രാജാവ്!”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഹോശന്നാ” എന്നത് എബ്രായമൂലമുള്ള ഒരു ഘോഷമാണ്. അതിന്റെ അടിസ്ഥാന അർഥം “ഇപ്പോൾ രക്ഷിക്കണമേ” അഥവാ “ദയവായി രക്ഷിക്കണമേ” എന്നാണ്; ഈ കാലമായപ്പോഴേക്കും അത് സ്തുതിഘോഷമായും ഉപയോഗിച്ചിരുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഈ വാക്കുകൾ സങ്കീർത്തനം 118:26-നെ പ്രതിധ്വനിപ്പിക്കുന്നു.
    reason: cross_reference
  - marker: c
    text: 'അഥവാ: “ഇസ്രായേലിന്റെ രാജാവും!” ഗ്രീക്കിലെ καί എന്നതിന് ഇവിടെ സാധാരണ “-ഉം” എന്നും വിശദീകരണാർഥത്തിൽ “അതായത്” എന്നും ഗ്രഹിക്കാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: βαΐα τῶν φοινίκων
  choice: ഈന്തപ്പനക്കൊമ്പുകൾ
  rationale: βάϊον എന്നത് കൊമ്പിനെയും φοῖνιξ ഈന്തപ്പനയെയും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ രണ്ടിന്റെയും അർഥം സ്വാഭാവികമായി ഒരുമിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
- source_word: ἐξῆλθον εἰς ὑπάντησιν αὐτῷ
  choice: അവനെ എതിരേൽക്കാൻ പുറപ്പെട്ടു
  rationale: ὑπάντησις ഒരാളെ കാണാനായി പുറത്തേക്കു ചെല്ലുന്നതിനെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിലെ സ്വീകരണഭാവം സ്വാഭാവികമായി അറിയിക്കുന്നതോടൊപ്പം അധിക വ്യാഖ്യാനം ചേർക്കാത്ത പരിഭാഷയാണിത്.
- source_word: ἐκραύγαζον
  choice: ആർപ്പുവിളിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം തുടർച്ചയായോ ആവർത്തിച്ചോ ഉണ്ടായ ഉച്ചത്തിലുള്ള വിളി സൂചിപ്പിക്കുന്നു.
- source_word: Ὡσαννά
  choice: ഹോശന്നാ
  rationale: എബ്രായമൂലമുള്ള ഈ ആരാധനാഘോഷം മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണത്തിൽ നിലനിർത്തുന്നു; അതിന്റെ അപേക്ഷാർത്ഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: εὐλογημένος ὁ ἐρχόμενος
  choice: വരുന്നവൻ വാഴ്ത്തപ്പെട്ടവൻ
  rationale: സങ്കീർത്തനം 118:26-ലെ അനുഗ്രഹപ്രഖ്യാപനത്തിന്റെ സ്വരവും substantival participle-ന്റെ അർഥവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐν ὀνόματι κυρίου
  choice: കർത്താവിന്റെ നാമത്തിൽ
  rationale: ഗ്രീക്കിലെ κυρίου എന്ന പദവും സങ്കീർത്തനപ്രതിധ്വനിയും സംരക്ഷിക്കുന്ന സ്ഥിരമായ ബൈബിൾപ്രയോഗം.
- source_word: καὶ ὁ βασιλεὺς τοῦ Ἰσραήλ
  choice: ഇസ്രായേലിന്റെ രാജാവും വാഴ്ത്തപ്പെട്ടവൻ
  rationale: καί എന്ന ബന്ധകത്തെ ‘-ഉം’ എന്നു തുറന്നുവെച്ച്, മുമ്പുള്ള εὐλογημένος എന്ന വിശേഷണം രണ്ടാമത്തെ രാജകീയ വിശേഷണത്തോടും ചേർന്നു വായിക്കാവുന്ന ഗ്രീക്ക് ഘടന മലയാളത്തിൽ ഗ്രാഹ്യമാക്കുന്നു.
theological_decisions:
- issue: സങ്കീർത്തന ഉദ്ധരണിയിലെ κύριος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: കർത്താവ്
  alternative: യഹോവ
  rationale: നിലവിലുള്ള ഗ്രീക്ക് പാഠം κυρίου എന്നാണ്; അതിനാൽ എബ്രായ സങ്കീർത്തനത്തിലെ ദൈവനാമം നേരിട്ട് പുനഃസ്ഥാപിക്കാതെ ഗ്രീക്ക് സാക്ഷ്യത്തെ മുൻനിർത്തി ‘കർത്താവ്’ എന്നു നൽകുന്നു.
- issue: καὶ ὁ βασιλεὺς τοῦ Ἰσραήλ എന്നതിന്റെ വാക്യബന്ധം
  choice: ഇസ്രായേലിന്റെ രാജാവും വാഴ്ത്തപ്പെട്ടവൻ
  alternative: അതായത്, ഇസ്രായേലിന്റെ രാജാവ്
  rationale: καί എന്നതിനെ സാധാരണ ബന്ധകമായി നിലനിർത്തുന്നത് ‘വരുന്നവൻ’ എന്നും ‘ഇസ്രായേലിന്റെ രാജാവ്’ എന്നും ഉള്ള ഘടകങ്ങളുടെ ബന്ധത്തെ വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ സംരക്ഷിക്കുന്നു; appositional വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ജനക്കൂട്ടത്തിന്റെ രാജകീയ-മശീഹീയ പ്രഖ്യാപനം
  choice: ഇസ്രായേലിന്റെ രാജാവ്
  alternative: ഇസ്രായേലിന്റെ രാജാവായ മശീഹാ
  rationale: പാഠത്തിലെ രാജകീയ വിശേഷണം അതേപടി നിലനിർത്തുന്നു; ‘മശീഹാ’ എന്ന വിശദീകരണം ഈ വാക്യത്തിൽ നേരിട്ട് ഇല്ലാത്തതിനാൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവും ആരാധനാസന്ദർഭത്തിന് യോജിച്ച ഗൗരവമുള്ളതുമായ മലയാളം. ‘ഹോശന്നാ’, ‘കർത്താവ്’, ‘വാഴ്ത്തപ്പെട്ടവൻ’ എന്നീ പരിചിത ബൈബിൾപദങ്ങൾ നിലനിർത്തിയിട്ടുണ്ട്; അപൂർണ ഭൂതകാലത്തിന്റെ തുടർച്ചാഭാവം ‘ആർപ്പുവിളിച്ചുകൊണ്ടിരുന്നു’ എന്നതിൽ പ്രകടമാക്കുന്നു.
