id: JHN.12.45
reference: John 12:45
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὁ θεωρῶν ἐμὲ θεωρεῖ τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/045.yaml
  text: And the one who sees me sees the one who sent me[a].
translation:
  language: ml
  text: എന്നെ കാണുന്നവൻ എന്നെ അയച്ചവനെയും കാണുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ശ്രദ്ധയോടെ കാണുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് ക്രിയയ്ക്ക് വെറും ശാരീരിക കാഴ്ചയ്ക്കപ്പുറം ശ്രദ്ധയോടെയുള്ള നിരീക്ഷണം അല്ലെങ്കിൽ ഗ്രഹണം എന്ന അർഥവും ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: എന്നാൽ പ്രത്യേകമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: ഈ വാക്യം മുൻവാക്യത്തിലെ ആശയത്തോടു ചേർന്നുനിൽക്കുന്നു. ഒറ്റവാക്യമായി വായിക്കുമ്പോൾ തുടക്കത്തിലെ ‘കൂടാതെ/ഉം’ സ്വാഭാവിക മലയാളത്തെ തടസ്സപ്പെടുത്തുന്നതിനാൽ ബന്ധകത്തിന്റെ പ്രവർത്തനം വാക്യബന്ധത്തിൽ പരോക്ഷമായി നിലനിർത്തി.
- source_word: ὁ θεωρῶν
  choice: കാണുന്നവൻ
  rationale: നാമവൽക്കരിച്ച വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ പൊതുവായ, പ്രതിനിധാനപരമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ സൂക്ഷിക്കുന്നു.
- source_word: ἐμὲ
  choice: എന്നെ
  rationale: ഒന്നാംപുരുഷ ഏകവചന കർമരൂപത്തിന്റെ നേരിട്ടുള്ള പരിഭാഷ.
- source_word: θεωρεῖ
  choice: കാണുന്നു
  rationale: ‘കാണുക, ശ്രദ്ധയോടെ നോക്കുക, ഗ്രഹിക്കുക’ എന്നീ അർഥസാധ്യതകളുള്ള θεωρέωയ്ക്ക് സ്വാഭാവികമായ ‘കാണുന്നു’ തിരഞ്ഞെടുത്തു; ആദ്യ ക്രിയയുമായുള്ള ആവർത്തനവും നിലനിർത്തി.
- source_word: τὸν πέμψαντά με
  choice: എന്നെ അയച്ചവനെ
  rationale: നാമവൽക്കരിച്ച ഭൂതകാല കൃദന്തരൂപത്തെ വ്യക്തവും സ്വാഭാവികവുമായി പരിഭാഷപ്പെടുത്തി; ഗ്രീക്കിൽ ഇല്ലാത്ത ‘പിതാവ്’ എന്ന പദവി ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: യേശുവിനെ കാണുന്നതും അവനെ അയച്ചവനെ കാണുന്നതും തമ്മിലുള്ള ബന്ധം
  choice: ‘എന്നെ കാണുന്നവൻ എന്നെ അയച്ചവനെ കാണുന്നു’ എന്ന നേരിട്ടുള്ള സമാന്തരപ്രസ്താവന നിലനിർത്തി.
  alternative: യേശുവിലൂടെ അയച്ചവനെക്കുറിച്ച് അറിയുന്നു എന്ന ദുർബലമായ വ്യാഖ്യാനം; അല്ലെങ്കിൽ ഇരുവരും ഒരേ വ്യക്തിയാണെന്ന് വ്യക്തമാക്കുന്ന ശക്തമായ പരാവർത്തനം.
  rationale: മൂലവാക്യം വെളിപ്പെടുത്തലിലെ ആഴമുള്ള ഐക്യം നേരിട്ട് പ്രസ്താവിക്കുന്നുവെങ്കിലും അതിന്റെ കൃത്യമായ തത്ത്വശാസ്ത്ര വിശദീകരണം നൽകുന്നില്ല. അതിനാൽ ആ ശക്തിയും ആശയസംഘർഷവും വിശദീകരിച്ചു തീർക്കാതെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ദർശിക്കുന്നവൻ’ പോലുള്ള സാഹിത്യപരമായ രൂപത്തിന് പകരം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ ‘കാണുന്നവൻ’ ഉപയോഗിച്ചു; പദാവർത്തനം മൂലത്തിലെ ആവർത്തനത്തെ പ്രതിഫലിപ്പിക്കുന്നു.
