reference: John 12:47
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐάν τίς μου ἀκούσῃ τῶν ῥημάτων καὶ μὴ ⸀φυλάξῃ, ἐγὼ οὐ κρίνω αὐτόν, οὐ γὰρ ἦλθον ἵνα κρίνω τὸν κόσμον ἀλλ’ ἵνα σώσω τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/047.yaml
  text: And if anyone hears my words and does not keep them[a], I do not judge him; for I did not come to judge the world[b], but to save the world.
translation:
  language: ml
  text: ആരെങ്കിലും എന്റെ വാക്കുകൾ കേൾക്കുകയും അവ പാലിക്കാതിരിക്കുകയും ചെയ്താൽ[a], ഞാൻ അയാളെ[b] വിധിക്കുന്നില്ല[c]; കാരണം, ലോകത്തെ വിധിക്കാനല്ല, ലോകത്തെ രക്ഷിക്കാനാണ് ഞാൻ വന്നത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അവ കാത്തുസൂക്ഷിക്കാതിരുന്നാൽ.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് ക്രിയയ്ക്ക് കാക്കുക, സൂക്ഷിക്കുക, അനുസരണയോടെ പാലിക്കുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ ഏകവചന പുല്ലിംഗ സർവനാമമാണ്; എന്നാൽ ഇവിടെ അത് യേശുവിന്റെ വാക്കുകൾ കേട്ടിട്ടും പാലിക്കാത്ത ഏതൊരാളെയും പൊതുവായി സൂചിപ്പിക്കുന്നു.
    reason: generic_pronoun
  - marker: c
    text: അഥവാ ‘ശിക്ഷയ്ക്കു വിധിക്കുന്നില്ല.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘വിധിക്കുക’ എന്നും സന്ദർഭാനുസരണം പ്രതികൂലവിധി അഥവാ ശിക്ഷാവിധി പ്രഖ്യാപിക്കുക എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τίς
  choice: ആരെങ്കിലും
  rationale: ഈ അനിശ്ചിത ഉപാധിപ്രയോഗം എല്ലാവർക്കും ബാധകമായ ഒരു പൊതുസാഹചര്യം അവതരിപ്പിക്കുന്നു; ‘ആരെങ്കിലും’ അതിന്റെ തുറന്ന, പൊതുവായ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀκούσῃ
  choice: കേട്ടിട്ടും
  rationale: ἀκούωയുടെ അടിസ്ഥാനാർഥമായ ‘കേൾക്കുക’ നിലനിർത്തുന്നു. തുടർന്ന് വരുന്ന നിഷേധത്തോടുള്ള ആശയവൈരുധ്യം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘-ട്ടിട്ടും’ ഉപയോഗിച്ചു; ശ്രദ്ധയോടെ അനുസരിക്കുക എന്ന അധികാർഥം ചേർത്തിട്ടില്ല.
- source_word: τῶν ῥημάτων μου
  choice: എന്റെ വാക്കുകൾ
  rationale: ῥήματα യേശു ഉച്ചരിച്ച വാക്കുകളെ സൂചിപ്പിക്കുന്നു; ‘എന്റെ വാക്കുകൾ’ വ്യക്തവും സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: φυλάξῃ
  choice: പാലിക്കാതിരുന്നാൽ
  rationale: φυλάσσωയ്ക്ക് കാക്കുക, സൂക്ഷിക്കുക, അനുസരണയോടെ പാലിക്കുക എന്നീ അർഥങ്ങളുണ്ട്. ഈ സന്ദർഭത്തിൽ ‘പാലിക്കുക’ വാക്കുകളോടുള്ള വിശ്വസ്തമായ അനുസരണം സ്വാഭാവികമായി അറിയിക്കുന്നു; എന്നാൽ അതിന്റെ വിശാലമായ അർഥപരിധി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: οὐ κρίνω αὐτόν
  choice: ഞാൻ അയാളെ വിധിക്കുന്നില്ല
  rationale: κρίνωയെ ‘വിധിക്കുക’ എന്നു വിവർത്തനം ചെയ്ത് തുടർന്നുള്ള ἵνα κρίνωയുമായുള്ള പദബന്ധം നിലനിർത്തുന്നു. ‘ശിക്ഷയ്ക്കു വിധിക്കുക’ എന്ന വ്യാഖ്യാനത്തിലേക്ക് മുഖ്യപാഠത്തെ ചുരുക്കുന്നില്ല. αὐτόν ഏകവചനമായതിനാൽ ‘അയാളെ’ ഉപയോഗിച്ചു.
- source_word: οὐ γὰρ ἦλθον
  choice: കാരണം … ഞാൻ വന്നത്
  rationale: ἦλθον യേശുവിന്റെ വരവും ദൗത്യവും സംഗ്രഹിക്കുന്ന ഭൂതകാലപ്രയോഗമാണ്; മലയാളത്തിലെ ‘ഞാൻ വന്നത്’ അതിനെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἵνα κρίνω τὸν κόσμον
  choice: ലോകത്തെ വിധിക്കാനല്ല
  rationale: ἵνα ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു. ‘വിധിക്കാനല്ല’ ആ ഉദ്ദേശ്യാർഥം സംക്ഷിപ്തമായും വ്യക്തമായും നൽകുന്നു; κόσμος എന്നതിന് യോഹന്നാനിലെ പതിവുപോലെ ‘ലോകം’ നിലനിർത്തുന്നു.
- source_word: ἀλλ’ ἵνα σώσω τὸν κόσμον
  choice: ലോകത്തെ രക്ഷിക്കാനാണ്
  rationale: ἀλλά മുമ്പുള്ള നിഷേധത്തോട് ശക്തമായ വൈരുധ്യം സൃഷ്ടിക്കുന്നു; മലയാളത്തിലെ ‘-അല്ല, ... -ആണ്’ ഘടന അത് വ്യക്തമായി നൽകുന്നു. σώσω എന്നതിന് കേന്ദ്രമായ രക്ഷാർഥം വഹിക്കുന്ന ‘രക്ഷിക്കുക’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: യേശു ‘ഞാൻ അയാളെ വിധിക്കുന്നില്ല’ എന്നു പറയുന്നതും യോഹന്നാനിലെ മറ്റു ന്യായവിധിപ്രസ്താവനകളും തമ്മിലുള്ള സംഘർഷം
  choice: κρίνωയെ രണ്ടിടത്തും ‘വിധിക്കുക’ എന്നു തന്നെ നൽകി; സമയപരമോ ദൗത്യപരമോ ആയ വിശദീകരണം മുഖ്യപാഠത്തിൽ ചേർത്തില്ല.
  alternative: ‘ഞാൻ അയാളെ ശിക്ഷയ്ക്കു വിധിക്കുന്നില്ല’ എന്നോ ‘ഞാൻ ഇപ്പോൾ അയാളെ വിധിക്കുന്നില്ല’ എന്നോ വ്യാഖ്യാനപരമായി വിവർത്തനം ചെയ്യുക.
  rationale: ഈ വാക്യം യേശുവിന്റെ വരവിന്റെ ലക്ഷ്യം വിധിയല്ല, രക്ഷയാണെന്ന് പറയുന്നു. ഒരേ ക്രിയയെ ഒരേവിധം വിവർത്തനം ചെയ്യുന്നത് സമീപസന്ദർഭത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
- issue: αὐτόν എന്ന ഏകവചന പുല്ലിംഗ സർവനാമത്തിന്റെ പൊതുവ്യാപ്തി
  choice: മുഖ്യപാഠത്തിൽ ‘അയാളെ’ എന്നു നൽകി, ഇത് ഏതൊരാളെയും ഉൾക്കൊള്ളുന്ന പൊതുപ്രയോഗമാണെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: ‘ആ വ്യക്തിയെ’ എന്ന ലിംഗനിരപേക്ഷമായ വ്യാഖ്യാനരൂപം ഉപയോഗിക്കുക.
  rationale: ഗ്രീക്കിലെ ഏകവചന സർവനാമത്തിന്റെ രൂപം പ്രതിഫലിപ്പിക്കുമ്പോഴും, അതിന്റെ പൊതുവ്യാപ്തി തെറ്റിദ്ധരിക്കപ്പെടാതിരിക്കാൻ അടിക്കുറിപ്പ് സഹായിക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കേട്ടിട്ടും’ എന്ന ബന്ധപ്രയോഗവും ‘വിധിക്കാനല്ല … രക്ഷിക്കാനാണ്’ എന്ന സമാന്തരഘടനയും വാക്യത്തിന്റെ തർക്കക്രമവും ഊന്നലും വ്യക്തമായി നിലനിർത്തുന്നു.
