  to: പെരുന്നാളിൽ ആരാധിക്കാനായി കയറിച്ചെന്നവരുടെ കൂട്ടത്തിൽ ചില ഗ്രീക്കുകാർ ഉണ്ടായിരുന്നു.[a]
