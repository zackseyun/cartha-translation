id: JHN.12.20
reference: John 12:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἦσαν δὲ ⸂Ἕλληνές τινες⸃ ἐκ τῶν ἀναβαινόντων ἵνα προσκυνήσωσιν ἐν τῇ ἑορτῇ·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/020.yaml
  text: There were some Greeks among those going up to worship at the feast[a].
translation:
  language: ml
  text: പെരുന്നാളിൽ ആരാധിക്കാനായി കയറിച്ചെന്നവരുടെ കൂട്ടത്തിൽ ചില ഗ്രീക്കുകാർ ഉണ്ടായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഗ്രീക്കുകാരിൽ ചിലർ’; ഇവർ പെരുന്നാളിൽ ആരാധിക്കാൻ വന്ന യെഹൂദരല്ലാത്തവരായിരിക്കാം.
    reason: വാക്കുകളുടെ മറ്റൊരു സ്വാഭാവിക ക്രമവും ഇവരുടെ തിരിച്ചറിയലിലുള്ള അനിശ്ചിതത്വവും സൂചിപ്പിക്കാൻ.
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: ഉണ്ടായിരുന്നു
  rationale: ἦσαν എന്നതിന്റെ അസ്തിത്വാർഥം സ്വാഭാവിക മലയാളത്തിൽ ‘ഉണ്ടായിരുന്നു’ എന്നു നൽകി. δέ ലഘുവായ ബന്ധകമായതിനാൽ സന്ദർഭത്തിൽ അനാവശ്യമായ ‘എന്നാൽ’ ചേർത്തില്ല; ‘-ഉം’ അതിന്റെ ബന്ധകഭാവം സൗമ്യമായി വഹിക്കുന്നു.
- source_word: Ἕλληνές τινες
  choice: ചില ഗ്രീക്കുകാർ
  rationale: Ἕλληνες എന്ന പദത്തിന്റെ നേരിട്ടുള്ള വംശീയ/സാംസ്കാരിക സൂചനയായ ‘ഗ്രീക്കുകാർ’ നിലനിർത്തി; ‘വിജാതീയർ’ എന്നു പൊതുവൽക്കരിച്ചില്ല. τινες എന്ന അനിശ്ചിതത്വം ‘ചില’ എന്നു നൽകി.
- source_word: ἐκ τῶν ἀναβαινόντων
  choice: കയറിച്ചെന്നവരുടെ കൂട്ടത്തിൽ
  rationale: ἐκ ഇവിടെ വലിയൊരു തീർഥാടകസംഘത്തിൽ ഉൾപ്പെട്ടവരെന്ന അർഥം നൽകുന്നു. ἀναβαίνω യെരൂശലേമിലേക്കുള്ള തീർഥയാത്രയുടെ പരമ്പരാഗത ‘കയറിച്ചെല്ലൽ’ സൂചിപ്പിക്കുന്നതിനാൽ അത് നിലനിർത്തി.
- source_word: ἵνα προσκυνήσωσιν
  choice: ആരാധിക്കാനായി
  rationale: ἵνα സഹിതമുള്ള ഉപവാക്യം ഉദ്ദേശ്യം പ്രകടിപ്പിക്കുന്നു. προσκυνέω ഇവിടെ മതപരമായ ആരാധനയെ സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവികമായി ‘ആരാധിക്കാനായി’ എന്നു നൽകി.
- source_word: ἐν τῇ ἑορτῇ
  choice: പെരുന്നാളിൽ
  rationale: യോഹന്നാന്റെ സന്ദർഭത്തിൽ ἑορτή യെഹൂദരുടെ മതോത്സവത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ‘പെരുന്നാൾ’ തിരഞ്ഞെടുത്തു.
theological_decisions:
- issue: Ἕλληνες എന്നവരുടെ തിരിച്ചറിയൽ
  choice: ഗ്രീക്കുകാർ
  alternative: വിജാതീയർ; ഗ്രീക്കുഭാഷ സംസാരിച്ച യെഹൂദർ; യെഹൂദമതാനുയായികൾ
  rationale: മൂലപാഠം ഇവരെ ‘ഗ്രീക്കുകാർ’ എന്നു മാത്രമാണ് വിളിക്കുന്നത്. അവർ കൃത്യമായി ഏതു മതസാമൂഹിക വിഭാഗത്തിൽപ്പെട്ടവരാണെന്ന് പരിഭാഷ തീരുമാനിക്കാതെ, പാഠത്തിലുള്ള അനിശ്ചിതത്വവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘കയറിച്ചെന്നവർ’ യെരൂശലേമിലേക്കുള്ള തീർഥയാത്രാഭാഷ നിലനിർത്തുന്നു; ‘ഗ്രീക്കുകാർ’ എന്നത് മൂലപാഠത്തിലെ തിരിച്ചറിയൽ പൊതുവൽക്കരിക്കാതെ സംരക്ഷിക്കുന്നു.
