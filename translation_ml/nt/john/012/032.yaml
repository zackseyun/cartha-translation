id: JHN.12.32
reference: John 12:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: κἀγὼ ⸀ἐὰν ὑψωθῶ ἐκ τῆς γῆς, πάντας ἑλκύσω πρὸς ἐμαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/032.yaml
  text: And I[a], when I am lifted up from the earth[c][b], will draw all people to myself.
translation:
  language: ml
  text: ഞാനും, ഭൂമിയിൽനിന്ന് ഉയർത്തപ്പെടുമ്പോൾ[a][b], എല്ലാവരെയും[c] എന്നിലേക്കു ആകർഷിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘ഭൂമിയിൽനിന്ന് ഉയർത്തപ്പെടുകയാണെങ്കിൽ.’ ഗ്രീക്കിൽ വ്യവസ്ഥാസൂചക രൂപമാണുള്ളത്; എന്നാൽ സന്ദർഭത്തിൽ അത് യേശുവിന്റെ ആസന്നമായ മരണത്തെ ഉറപ്പുള്ള സംഭവമായി സൂചിപ്പിക്കുന്നു.'
    reason: alternative_reading
  - marker: b
    text: ‘ഉയർത്തപ്പെടുക’ എന്നതിന് ‘മഹത്ത്വത്തിലേക്ക് ഉയർത്തപ്പെടുക’ എന്ന അർഥവും ഉണ്ടാകാം. ക്രൂശീകരണവും മഹത്ത്വീകരണവും ഒരുമിച്ചു സൂചിപ്പിക്കുന്ന യോഹന്നാന്റെ ദ്വയാർഥം ഇതിൽ നിലനിൽക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: 'അക്ഷരാർഥത്തിൽ: ‘എല്ലാവരെയും.’ ഇത് ആളുകളെയാണ് സൂചിപ്പിക്കുന്നത്; രക്ഷയുടെ വ്യാപ്തിയെക്കുറിച്ചുള്ള പിൽക്കാല ദൈവശാസ്ത്രവാദങ്ങൾക്ക് ഈ വാക്യം തന്നെ എങ്ങനെ ബാധകമാകുന്നു എന്ന് പരിഭാഷ വ്യക്തമാക്കുന്നില്ല.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: ഞാനോ
  rationale: καί + ἐγώ എന്ന സംയുക്തരൂപത്തിന്റെ ബന്ധിപ്പിക്കുന്നതും നേരിയ ഊന്നൽ നൽകുന്നതുമായ സ്വഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἐὰν
  choice: ഉയർത്തപ്പെടുമ്പോൾ
  rationale: ἐάν + subjunctive വ്യാകരണപരമായി വ്യവസ്ഥാസൂചകമാണെങ്കിലും, യോഹന്നാന്റെ ആഖ്യാനസന്ദർഭത്തിൽ യേശുവിന്റെ ആസന്നവും ഉറപ്പുള്ളതുമായ മരണത്തെയാണ് സൂചിപ്പിക്കുന്നത്. അതിനാൽ മുഖ്യപാഠത്തിൽ ‘-ുമ്പോൾ’ എന്നും വ്യവസ്ഥാസൂചന അടിക്കുറിപ്പിലും നിലനിർത്തുന്നു.
- source_word: ὑψωθῶ
  choice: ഉയർത്തപ്പെടുമ്പോൾ
  rationale: ക്രൂശിൽ ഭൗതികമായി ഉയർത്തപ്പെടുന്നതും മഹത്ത്വത്തിലേക്ക് ഉയർത്തപ്പെടുന്നതും ഉൾക്കൊള്ളുന്ന യോഹന്നാനീയ ദ്വയാർഥം ‘ഉയർത്തപ്പെടുക’ സംരക്ഷിക്കുന്നു.
- source_word: ἐκ τῆς γῆς
  choice: ഭൂമിയിൽനിന്ന്
  rationale: ക്രൂശീകരണത്തിൽ ഭൂമിയിൽനിന്ന് ഉയർത്തപ്പെടുന്നതെന്ന സന്ദർഭാർഥത്തിന് യോജിക്കുന്നു; ഇവിടെ γῆ ഒരു പ്രത്യേക ദേശത്തെയല്ല സൂചിപ്പിക്കുന്നത്.
- source_word: πάντας
  choice: എല്ലാവരെയും
  rationale: പുരുഷലിംഗ ബഹുവചന കർമരൂപം ഇവിടെ മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു. ‘എല്ലാവരെയും’ എന്നത് അതിന്റെ വിശാലത നിലനിർത്തുന്നു; എന്നാൽ തുടർന്നുണ്ടായ രക്ഷാശാസ്ത്രവാദങ്ങൾക്ക് പരിഭാഷയിൽ തന്നെ തീർപ്പ് കല്പിക്കുന്നില്ല.
- source_word: ἑλκύσω
  choice: ആകർഷിക്കും
  rationale: ἕλκω എന്ന പദത്തിലെ തന്നിലേക്കു വലിച്ചടുപ്പിക്കുന്ന ചലനത്തെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; ആ പ്രവർത്തനത്തിന്റെ രീതി അനാവശ്യമായി നിർവചിക്കുന്നില്ല.
- source_word: πρὸς ἐμαυτόν
  choice: എന്നിലേക്കു
  rationale: പ്രവർത്തനത്തിന്റെ ദിശയും ἐμαυτόν എന്ന ആത്മവാചക സർവനാമത്തിന്റെ യേശുകേന്ദ്രിത ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: രക്ഷാശാസ്ത്രവുമായി ബന്ധപ്പെട്ട πάντας എന്നതിന്റെ വ്യാപ്തി
  choice: എല്ലാവരെയും
  alternative: എല്ലാം; സകലവിധത്തിലുള്ള ആളുകളെയും; ഒരാളൊഴിയാതെ എല്ലാവരെയും
  rationale: ഗ്രീക്കിലെ പുരുഷലിംഗ ബഹുവചനം സ്വാഭാവികമായി ആളുകളെയാണ് സൂചിപ്പിക്കുന്നത്. യേശുവിന്റെ ആകർഷണപ്രവർത്തനത്തിന്റെ സാർവത്രിക വ്യാപ്തി വാക്യം പ്രസ്താവിക്കുന്നുവെങ്കിലും, അത് ഓരോ വ്യക്തിയെയും ഒഴിവില്ലാതെ സൂചിപ്പിക്കുന്നുവോ എല്ലാ വിഭാഗം ആളുകളെയോ എന്ന പിൽക്കാല തർക്കം ഇവിടെ പരിഹരിക്കുന്നില്ല.
- issue: ὑψωθῶ എന്നതിലെ യോഹന്നാനീയ ദ്വയാർഥം
  choice: ഉയർത്തപ്പെടുക
  alternative: മഹത്ത്വീകരിക്കപ്പെടുക
  rationale: ‘ഉയർത്തപ്പെടുക’ ക്രൂശീകരണത്തിലെ ഭൗതിക ഉയർത്തലിനെയും അതോടൊപ്പമുള്ള മഹത്ത്വീകരണത്തെയും ഒരുമിച്ചു തുറന്നുവയ്ക്കുന്നു; ‘മഹത്ത്വീകരിക്കപ്പെടുക’ മാത്രം ഉപയോഗിച്ചാൽ ക്രൂശിന്റെ ദൃശ്യാർഥം മങ്ങിപ്പോകും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ഉയർത്തപ്പെടുക’ എന്ന പദം മൂലത്തിലെ ഉദ്ദേശപൂർവമായ ദ്വയാർഥം സംരക്ഷിക്കുന്നു; ‘ആകർഷിക്കും’ സ്വാഭാവികതയും മൂലത്തിലെ തന്നിലേക്കുള്ള ചലനവും സമതുലിതമാക്കുന്നു.
