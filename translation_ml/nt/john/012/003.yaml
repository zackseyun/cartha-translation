id: JHN.12.3
reference: John 12:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἡ οὖν ⸀Μαριὰμ λαβοῦσα λίτραν μύρου νάρδου πιστικῆς πολυτίμου ἤλειψεν τοὺς πόδας τοῦ Ἰησοῦ καὶ ἐξέμαξεν ταῖς θριξὶν αὐτῆς τοὺς πόδας αὐτοῦ· ἡ δὲ οἰκία ἐπληρώθη ἐκ τῆς ὀσμῆς τοῦ μύρου.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/003.yaml
  text: Then Mary took a litra of costly pure nard perfume[a], anointed Jesus's feet, and wiped his feet with her hair[c][b]. And the house was filled with the fragrance of the perfume.
translation:
  language: ml
  text: അപ്പോൾ മറിയം ഒരു ലിത്രാ[a] വിലയേറിയ, ശുദ്ധമായ നാർദ്[b] സുഗന്ധതൈലം എടുത്ത് യേശുവിന്റെ പാദങ്ങളിൽ പുരട്ടി; തന്റെ തലമുടികൊണ്ട് അവന്റെ പാദങ്ങൾ തുടച്ചു. സുഗന്ധതൈലത്തിന്റെ സൗരഭ്യത്താൽ വീട് മുഴുവൻ നിറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ലിത്രാ ഒരു റോമൻ തൂക്കയളവായിരുന്നു; ഏകദേശം 327 ഗ്രാം, അഥവാ ഒരു കിലോഗ്രാമിന്റെ മൂന്നിലൊന്ന്.
    reason: cultural_note
  - marker: b
    text: ‘ശുദ്ധമായ’ എന്നു പരിഭാഷപ്പെടുത്തിയ πιστικῆς എന്ന ഗ്രീക്ക് പദത്തിന്റെ കൃത്യാർഥം വിവാദമാണ്; ‘യഥാർഥമായ’ എന്നും മനസ്സിലാക്കാം. ‘നാർദ്’ പരമ്പരാഗതമായി ‘സ്പൈക്ക്നാർഡ്’ എന്നും അറിയപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: അപ്പോൾ
  rationale: മുൻവിവരണത്തോടുള്ള കഥാതുടർച്ച സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ഇവിടെ ശക്തമായ നിഗമനാർഥം നിർബന്ധിക്കുന്നില്ല.
- source_word: λίτραν
  choice: ഒരു ലിത്രാ
  rationale: പുരാതന റോമൻ തൂക്കയളവിന്റെ പ്രത്യേകത നിലനിർത്താൻ ലിപ്യന്തരണം ചെയ്തു; അളവ് അടിക്കുറിപ്പിൽ വിശദീകരിക്കുന്നു.
- source_word: μύρου νάρδου
  choice: നാർദോസ് സുഗന്ധതൈലം
  rationale: μύρον സുഗന്ധമുള്ള അഭിഷേകതൈലത്തെയും νάρδος അതിന്റെ സുഗന്ധദ്രവ്യത്തെയും സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ സംയോജനം.
- source_word: πιστικῆς
  choice: ശുദ്ധമായ
  rationale: സന്ദർഭത്തിൽ ഉയർന്ന നിലവാരമുള്ള യഥാർഥ നാർദോസ് എന്ന സാധാരണ വ്യാഖ്യാനം നൽകുന്നു; പദത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: πολυτίμου
  choice: വിലയേറിയ
  rationale: വസ്തുവിന്റെ വലിയ സാമ്പത്തിക മൂല്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἤλειψεν
  choice: പൂശി
  rationale: തൈലം ശരീരത്തിൽ പുരട്ടിയ ഭൗതിക പ്രവൃത്തി നേരിട്ട് നൽകുന്നു; 'അഭിഷേകം ചെയ്തു' എന്ന പദം സൃഷ്ടിക്കാവുന്ന അനാവശ്യമായ ആചാരപരമോ രാജാഭിഷേകപരമോ ആയ മുൻവ്യാഖ്യാനം ഒഴിവാക്കുന്നു, എന്നാൽ സന്ദർഭത്തിലെ പ്രതീകസാധ്യത നിഷേധിക്കുന്നില്ല.
- source_word: ἐξέμαξεν ταῖς θριξὶν αὐτῆς
  choice: തന്റെ തലമുടികൊണ്ട് ... തുടച്ചു
  rationale: ക്രിയയും ഉപകരണാർഥമുള്ള ദത്തിവും വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἡ οἰκία ἐπληρώθη ἐκ τῆς ὀσμῆς τοῦ μύρου
  choice: സുഗന്ധതൈലത്തിന്റെ സൗരഭ്യംകൊണ്ട് വീടു നിറഞ്ഞു
  rationale: നിഷ്ക്രിയ ക്രിയയുടെ ഫലവും ഗന്ധം വീടാകെ വ്യാപിച്ചതും മലയാളത്തിൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἤλειψεν എന്ന പദത്തിന്റെ ദൈവശാസ്ത്രപരമായ അതിവായന
  choice: ഭൗതിക പ്രവൃത്തിയെ മുൻനിർത്തി ‘പൂശി’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘അഭിഷേകം ചെയ്തു’
  rationale: മൂലപദം സുഗന്ധതൈലം പുരട്ടുന്നതിനെ സൂചിപ്പിക്കുന്നു. കഥയിലെ പ്രതീകാത്മക പ്രസക്തി സാധ്യമാണെങ്കിലും, പരിഭാഷ തന്നെ കൂദാശാപരമോ രാജാഭിഷേകപരമോ ആയ അർഥം നിർബന്ധിക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥാശൈലി. പുരാതന അളവായ ‘ലിത്രാ’ നിലനിർത്തി അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു. അപരിചിതമായ ‘നാർദോസ്’ വസ്തുവിന്റെ സ്വഭാവം വ്യക്തമാക്കാൻ ‘സുഗന്ധതൈലം’ ചേർത്തു; πιστικῆς എന്ന പദത്തിന്റെ യഥാർഥ അനിശ്ചിതത്വം മറച്ചുവെക്കാതെ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
