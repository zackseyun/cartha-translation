id: JHN.12.27
reference: John 12:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Νῦν ἡ ψυχή μου τετάρακται, καὶ τί εἴπω; πάτερ, σῶσόν με ἐκ τῆς ὥρας ταύτης. ἀλλὰ διὰ τοῦτο ἦλθον εἰς τὴν ὥραν ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/027.yaml
  text: Now my soul is troubled[a], and what should I say? Father, save me from this hour. But for this reason I came to this hour.
translation:
  language: ml
  text: ഇപ്പോൾ എന്റെ ഉള്ളം കലങ്ങിയിരിക്കുന്നു. ഞാൻ എന്തു പറയണം?[a] പിതാവേ, ഈ സമയത്തിൽനിന്ന് എന്നെ രക്ഷിക്കണമേ. എന്നാൽ ഇതിനുവേണ്ടിത്തന്നെയാണ് ഞാൻ ഈ സമയത്തിലേക്കു വന്നത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “ഞാൻ എന്തു പറയണം? ‘പിതാവേ, ഈ സമയത്തിൽനിന്ന് എന്നെ രക്ഷിക്കണമേ’ എന്നു പറയണമോ?” ഗ്രീക്ക് വാചകം നേരിട്ടുള്ള അപേക്ഷയ്ക്കുപകരം ഒരു ആലങ്കാരിക ചോദ്യമായും വായിക്കാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: Νῦν
  choice: ഇപ്പോൾ
  rationale: യേശുവിന്റെ ഇപ്പോഴത്തെ കലക്കത്തിന്റെ അടിയന്തരത സൂചിപ്പിക്കുന്ന കാലവാചകത്തെ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἡ ψυχή μου
  choice: എന്റെ ഉള്ളം
  rationale: ഇവിടെ ψυχή യേശുവിന്റെ ആന്തരിക വ്യക്തിത്വത്തെയും അനുഭവത്തെയും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘എന്റെ ആത്മാവ്’ എന്നത് ശരീരം–ആത്മാവ് വിഭജനത്തിന്റെ അനാവശ്യ ധ്വനി ഉണ്ടാക്കാം; ‘എന്റെ ഉള്ളം’ ആന്തരിക വ്യാകുലത സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: τετάρακται
  choice: കലങ്ങിയിരിക്കുന്നു
  rationale: പൂർണ്ണകാല ക്രിയയുടെ ഫലമായി തുടരുന്ന ഇപ്പോഴത്തെ അവസ്ഥ വ്യക്തമാക്കുന്നു; മാനസികവും അസ്തിത്വപരവുമായ അസ്വസ്ഥത അതിശയോക്തിയില്ലാതെ പകരുന്നു.
- source_word: τί εἴπω
  choice: ഞാൻ എന്തു പറയണം?
  rationale: ആലോചനാത്മകമായ subjunctive-ന്റെ അനിശ്ചിതത്വം സാധാരണ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പകരുന്നു.
- source_word: πάτερ
  choice: പിതാവേ
  rationale: ദൈവത്തോടുള്ള നേരിട്ടുള്ള സംബോധനയുടെ ഗൗരവവും അടുപ്പവും നിലനിർത്തുന്നു.
- source_word: σῶσόν με ἐκ τῆς ὥρας ταύτης
  choice: ഈ നാഴികയിൽനിന്ന് എന്നെ രക്ഷിക്കണമേ
  rationale: ἐκ സൂചിപ്പിക്കുന്ന വിടുതലും അപേക്ഷയുടെ സ്വഭാവവും നേരിട്ട് പകരുന്നു. ‘നാഴിക’ യോഹന്നാനിലെ നിർണായകമായി നിശ്ചയിക്കപ്പെട്ട സമയമെന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: ὥρα
  choice: നാഴിക
  rationale: സാധാരണ അറുപത് മിനിറ്റിന്റെ ‘മണിക്കൂർ’ എന്നതിലുപരി, യേശുവിന്റെ കഷ്ടതയും മരണവും മഹത്ത്വീകരണവും ഉൾക്കൊള്ളുന്ന നിശ്ചിത നിർണായക സമയത്തെ സൂചിപ്പിക്കുന്ന യോഹന്നാനീയ പ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: ἀλλὰ διὰ τοῦτο
  choice: എന്നാൽ ഇതിനുവേണ്ടിത്തന്നെയാണ്
  rationale: ἀλλάയുടെ വൈരുധ്യവും διὰ τοῦτο എന്നതിലെ കാരണ/ഉദ്ദേശ്യബലവും മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; ‘തന്നെയാണ്’ ഉദ്ദേശ്യത്തിന്റെ ഊന്നൽ അറിയിക്കുന്നു.
- source_word: ἦλθον εἰς τὴν ὥραν ταύτην
  choice: ഞാൻ ഈ നാഴികയിലേക്കു വന്നത്
  rationale: εἰς എന്നതിലെ ‘ഇതിലേക്കെത്തുക’ എന്ന ചലനരൂപം നിലനിർത്തുന്നു; ‘ഈ നാഴികയ്ക്കായി’ എന്നു മാറ്റി ഉദ്ദേശ്യം മാത്രം നിർബന്ധിക്കുന്നില്ല.
theological_decisions:
- issue: ‘പിതാവേ, ഈ നാഴികയിൽനിന്ന് എന്നെ രക്ഷിക്കണമേ’ എന്നത് നേരിട്ടുള്ള അപേക്ഷയാണോ, ‘ഞാൻ എന്തു പറയണം?’ എന്നതിൽ ഉൾപ്പെട്ട നിരസിക്കപ്പെടുന്ന സാധ്യതയാണോ?
  choice: പ്രധാനപാഠത്തിൽ നേരിട്ടുള്ള അപേക്ഷയായി നൽകുന്നു.
  alternative: “‘പിതാവേ, ഈ നാഴികയിൽനിന്ന് എന്നെ രക്ഷിക്കണമേ’ എന്നു ഞാൻ പറയണമോ?” എന്ന ആലങ്കാരിക ചോദ്യമായി വായിക്കാം.
  rationale: ആദ്യകാല കൈയെഴുത്തുപ്രതികളിലെ വിരാമചിഹ്നങ്ങൾ മൂലപാഠത്തിന്റെ ഭാഗമല്ലാത്തതിനാൽ രണ്ടു വായനകളും വ്യാകരണപരമായി സാധ്യമാണ്. SBLGNTയുടെ വിരാമക്രമത്തെ പിന്തുടർന്ന് പ്രധാനപാഠം നേരിട്ടുള്ള അപേക്ഷയായി നൽകുന്നു; അടിക്കുറിപ്പ് മറ്റൊരു വായന സംരക്ഷിക്കുന്നു. ഇതിലൂടെ നാഴികയെ അഭിമുഖീകരിക്കുന്ന യേശുവിന്റെ യഥാർഥ കലക്കവും തന്റെ ദൗത്യം സ്വീകരിക്കുന്ന ഉറപ്പും തമ്മിലുള്ള സംഘർഷം ഇല്ലാതാക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. യോഹന്നാനിലെ θεολογικά ഭാരം വഹിക്കുന്ന ὥραയ്ക്ക് ‘നാഴിക’ ഉപയോഗിച്ചു. ψυχήയ്ക്ക് സന്ദർഭോചിതമായി ‘ഉള്ളം’ തിരഞ്ഞെടുത്തു. പ്രധാനപാഠത്തിലെ [a] അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വാചകത്തിനുശേഷം നൽകിയിരിക്കുന്നു.
