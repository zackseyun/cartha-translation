reference: John 12:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῦτο δὲ ἔλεγεν σημαίνων ποίῳ θανάτῳ ἤμελλεν ἀποθνῄσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/033.yaml
  text: He was saying this to signify what kind of death he was about to die[a].
translation:
  language: ml
  text: താൻ ഏതു വിധത്തിലുള്ള മരണമാണ് മരിക്കാനിരുന്നതെന്ന് സൂചിപ്പിച്ചുകൊണ്ടാണ് അവൻ ഇതു പറഞ്ഞത്[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഏതു വിധത്തിലുള്ള മരണത്താൽ.’ ഗ്രീക്ക് പ്രയോഗം മരണത്തിന്റെ രീതിക്ക് ഊന്നൽ നൽകാം.
    reason: ποίῳ θανάτῳ എന്ന ദാതിവിഭക്തി പ്രയോഗം മരണത്തിന്റെ വിധത്തോടൊപ്പം അതിലൂടെ മരിക്കുന്ന രീതിയെയും ഊന്നിക്കാട്ടാം.
lexical_decisions:
- source_word: τοῦτο
  choice: ഇതു
  rationale: മുമ്പുള്ള യേശുവിന്റെ പ്രസ്താവനയെ സൂചിപ്പിക്കുന്ന നപുംസക ഏകവചന സർവനാമത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇവിടെ δέ ശക്തമായ വൈരുധ്യമല്ല, നേരിയ ബന്ധമോ വിശദീകരണത്തിലേക്കുള്ള മാറ്റമോ മാത്രമാണ്; മലയാള വാക്യഘടന തന്നെ ആ ബന്ധം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: ἔλεγεν
  choice: പറഞ്ഞത്
  rationale: ഗ്രീക്കിലെ അപൂർണഭൂതകാലഭാവം സന്ദർഭത്തിലെ പ്രവൃത്തിയെ അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘പറഞ്ഞുകൊണ്ടിരുന്നത്’ ഇവിടെ അനാവശ്യമായി ഭാരമുള്ളതിനാൽ സ്വാഭാവികമായ വിശദീകരണഘടന ഉപയോഗിച്ചു.
- source_word: σημαίνων
  choice: സൂചിപ്പിച്ചുകൊണ്ട്
  rationale: നേരിട്ട് പ്രസ്താവിക്കാതെ ഒരു കാര്യം അടയാളത്തിലൂടെയോ സൂചനയിലൂടെയോ അറിയിക്കുക എന്ന യോഹന്നാനീയ അർഥനിറം നിലനിർത്തുന്നു.
- source_word: ποίῳ θανάτῳ
  choice: ഏതു വിധത്തിലുള്ള മരണമാണ്
  rationale: മരണത്തിന്റെ വെറും വസ്തുതയല്ല, അതിന്റെ വിധമോ രീതിയോ ആണ് പ്രയോഗം ചൂണ്ടിക്കാണിക്കുന്നത്.
- source_word: ἤμελλεν
  choice: മരിക്കാനിരുന്നത്
  rationale: സമീപമോ പ്രതീക്ഷിക്കപ്പെട്ടതോ ആയ ഭാവിയെ സ്വാഭാവികമായി അറിയിക്കുന്നു; ‘വിധിക്കപ്പെട്ടിരുന്നു’ എന്ന ശക്തമായ ദൈവശാസ്ത്രപരമായ ആശയം ചേർക്കുന്നില്ല.
- source_word: ἀποθνῄσκειν
  choice: മരിക്കുക
  rationale: μέλλω എന്ന ക്രിയയുടെ പൂരകമായ അനന്തക്രിയയുടെ നേരിട്ടുള്ള അർഥം.
theological_decisions:
- issue: ഈ വാക്യം ക്രൂശുമരണത്തെ സൂചിപ്പിക്കുന്നുവെന്ന് മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കണമോ
  choice: ‘ഏതു വിധത്തിലുള്ള മരണമാണ് മരിക്കാനിരുന്നത്’ എന്ന പരോക്ഷരൂപം നിലനിർത്തി
  alternative: ‘ക്രൂശിൽ എങ്ങനെയാണ് മരിക്കാനിരുന്നത്’ അഥവാ ‘എങ്ങനെ വധിക്കപ്പെടാനിരുന്നത്’
  rationale: സന്ദർഭം ക്രൂശുമരണത്തെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിലും ഈ വാക്യം അതിനെ പേരെടുത്ത് പറയുന്നില്ല; അതിനാൽ സ്രോതസ്സിലെ പരോക്ഷതയും വ്യാഖ്യാനാത്മക തുറന്ന നിലയും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ വിശദീകരണവാക്യഘടന. ‘മരണം മരിക്കുക’ എന്ന ആവർത്തനം മലയാളത്തിൽ അല്പം ഔപചാരികമാണെങ്കിലും സ്രോതസ്സിലെ ‘ഏതു വിധത്തിലുള്ള മരണം’ എന്ന ആശയം കൃത്യമായി നിലനിർത്തുന്നതിനായി സ്വീകരിച്ചു.
