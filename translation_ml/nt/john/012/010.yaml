translation:
  language: ml
  text: അപ്പോൾ മഹാപുരോഹിതന്മാർ ലാസറിനെയും കൊല്ലാൻ തീരുമാനിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ലാസറിനെയും കൊല്ലാൻ പദ്ധതിയിട്ടു.’
    reason: ἐβουλεύσαντο എന്ന പദത്തിന് സന്ദർഭത്തിൽ ‘തീരുമാനിച്ചു’ എന്നും ‘പദ്ധതിയിട്ടു’ എന്നും വിവർത്തനം സാധ്യമാണ്.
lexical_decisions:
- source_word: ἐβουλεύσαντο
  choice: തീരുമാനിച്ചു
  rationale: ആലോചനയ്ക്കുശേഷം ഒരു നിശ്ചിത നടപടിയിലേക്ക് എത്തിയെന്ന അർഥം സന്ദർഭത്തിൽ ഉണ്ട്. ആധുനിക മലയാളത്തിൽ ‘തീരുമാനിച്ചു’ സ്വാഭാവികവും വ്യക്തവുമാണ്; ‘പദ്ധതിയിട്ടു’ എന്നതും സാധ്യമാണ്, എന്നാൽ അത് പ്രക്രിയയ്ക്ക് അല്പം കൂടുതൽ ഊന്നൽ നൽകുന്നു.
- source_word: δὲ
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യത്തിലെ സംഭവവികാസവുമായി ഈ തീരുമാനം കാരണഫലബന്ധത്തിൽ മുന്നോട്ടുപോകുന്നതായി δέ ഇവിടെ സൂചിപ്പിക്കുന്നു. ‘അതുകൊണ്ട്’ മലയാളത്തിൽ ആ പ്രവാഹം സ്വാഭാവികമായി നൽകുന്നു; ശക്തമായ വൈരുദ്ധ്യം സൂചിപ്പിക്കുന്ന പദം ഒഴിവാക്കി.
- source_word: οἱ ἀρχιερεῖς
  choice: മഹാപുരോഹിതന്മാർ
  rationale: സുവിശേഷങ്ങളിലെ ബഹുവചനപ്രയോഗം മുഖ്യപുരോഹിത നേതൃത്വത്തെ സൂചിപ്പിക്കുന്നു. മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും കൃത്യവുമായ പദമാണ് ‘മഹാപുരോഹിതന്മാർ’.
- source_word: ἵνα
  choice: കൊല്ലാൻ
  rationale: തീരുമാനത്തിന്റെ ഉദ്ദേശ്യം/ഉള്ളടക്കം സൂചിപ്പിക്കുന്ന ἵναയും വിധിലിംഗക്രിയയും മലയാളത്തിലെ ഉദ്ദേശ്യാർഥക ‘-ആൻ’ രൂപത്തിലൂടെ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: καὶ
  choice: -യെയും
  rationale: ലാസറിനെ മറ്റൊരാളോടൊപ്പം—സന്ദർഭത്തിൽ യേശുവിനോടൊപ്പം—വധലക്ഷ്യത്തിൽ ഉൾപ്പെടുത്തുന്ന ചേർക്കൽഭാവം ‘ലാസറിനെയും’ എന്ന രൂപം വ്യക്തമായി നൽകുന്നു.
- source_word: τὸν Λάζαρον
  choice: ലാസറിനെ
  rationale: വ്യക്തിനാമം നിലവാരമുള്ള മലയാള ലിപ്യന്തരണത്തിൽ നൽകിയിരിക്കുന്നു; നേരിട്ടുള്ള കർമത്തെ മലയാള വിഭക്തി സൂചിപ്പിക്കുന്നു.
- source_word: ἀποκτείνωσιν
  choice: കൊല്ലാൻ
  rationale: ἀποκτείνω എന്നതിന്റെ നേരിട്ടുള്ള അർഥം ‘കൊല്ലുക’ എന്നാണ്. ‘വധശിക്ഷ നടപ്പാക്കുക’ എന്ന നിയമപരമായ സൂചനയോ ‘കൊലപ്പെടുത്തുക’ എന്ന അധിക ധാർമിക വിലയിരുത്തലോ ചേർക്കാതെ മൂലത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ലാസറിനെക്കുറിച്ചുള്ള മഹാപുരോഹിതന്മാരുടെ ഉദ്ദേശ്യത്തിന്റെ വിവരണം
  choice: ലാസറിനെയും കൊല്ലാനുള്ള ഉറച്ച തീരുമാനമായി നേരിട്ട് വിവർത്തനം ചെയ്തു; ഈ വാക്യത്തിൽ പറയാത്ത പ്രേരണയോ ഗൂഢാലോചനാഭാവമോ ചേർത്തില്ല.
  alternative: ‘വധിക്കാൻ ഗൂഢാലോചന നടത്തി’ അല്ലെങ്കിൽ ‘കൊല്ലാൻ പദ്ധതിയിട്ടു’ എന്നിങ്ങനെ കൂടുതൽ മുൻകൂട്ടിയൊരുക്കം സൂചിപ്പിക്കുക.
  rationale: വാക്യം ആലോചനാപൂർവമായ തീരുമാനം വ്യക്തമാക്കുന്നു; എന്നാൽ ഗൂഢാലോചനയ്ക്കുള്ള പ്രത്യേക സാങ്കേതിക പദം ഉപയോഗിക്കുന്നില്ല. അതിനാൽ ശത്രുതാപരമായ ഉദ്ദേശ്യത്തിന്റെ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് അധിക വ്യാഖ്യാനം ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘മഹാപുരോഹിതന്മാർ’ എന്ന പരിചിത ബൈബിൾ പദം നിലനിർത്തി; വാക്യഘടന സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാക്കി. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
