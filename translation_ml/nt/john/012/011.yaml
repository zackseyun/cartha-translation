    issue: The main text adds ‘അവരെ’ in ‘അവരെ വിട്ടുപോകുകയും.’
    rationale: ὑπῆγον is used here without an explicit object. Although the context may suggest withdrawal from the opponents’ sphere or stance, inserting ‘them’ into the translation resolves an ambiguity that the Greek leaves unstated.
  - severity: low
    issue: Footnote b describes an unexpressed object but is attached to a main-text rendering that includes that object.
    rationale: Once the unsupported object is removed, the note can accurately state that the verb itself does not specify from whom or what the people were departing.
