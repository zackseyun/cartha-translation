  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι πολλοὶ δι’ αὐτὸν ὑπῆγον τῶν Ἰουδαίων καὶ ἐπίστευον εἰς τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/011.yaml
  text: because many of the Jews were going away because of him and were believing in Jesus[a][b][c][d].
translation:
  language: ml
  text: കാരണം, യെഹൂദന്മാരിൽ[a] പലരും അവൻ നിമിത്തം പോയിക്കൊണ്ടിരിക്കുകയും[b] യേശുവിൽ വിശ്വസിച്ചുകൊണ്ടിരിക്കുകയും ചെയ്തിരുന്നു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യെഹൂദന്മാർ’ എന്നതിന് ‘യെഹൂദ്യർ’ എന്നും വിവർത്തനം ചെയ്യാം. യോഹന്നാന്റെ സുവിശേഷത്തിൽ ഈ പദം സന്ദർഭമനുസരിച്ച് യെഹൂദ്യരെയോ ചിലപ്പോൾ യെഹൂദ അധികാരികളെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
  - marker: b
    text: ‘പിരിഞ്ഞുപോകുകയായിരുന്നു’ അല്ലെങ്കിൽ ‘വിട്ടുപോകുകയായിരുന്നു’ എന്നും വിവർത്തനം ചെയ്യാം. മൂലഭാഷയിൽ അവർ ആരിൽനിന്നോ എന്തിൽനിന്നോ വിട്ടുപോയി എന്നത് വ്യക്തമാക്കിയിട്ടില്ല; സന്ദർഭം യേശുവിനെ എതിർത്തവരുടെ നിലപാടിൽനിന്നോ സ്വാധീനത്തിൽനിന്നോ അകലുന്നതിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: ‘യേശുവിൽ ആശ്രയം വെച്ചുകൊണ്ടിരുന്നു’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: കാരണം
  rationale: മുൻവാക്യത്തിൽ മഹാപുരോഹിതന്മാർ ലാസറിനെ കൊല്ലാൻ ആലോചിച്ചതിന്റെ കാരണം അവതരിപ്പിക്കുന്ന കാരണസൂചക സംയോജകം.
- source_word: πολλοὶ … τῶν Ἰουδαίων
  choice: യെഹൂദന്മാരിൽ പലരും
  rationale: മുഴുവൻ സമൂഹത്തെയല്ല, അതിലെ ഒരു വലിയ ഉപവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന ഭാഗിക ജനിറ്റീവ് ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: δι’ αὐτὸν
  choice: അവൻ നിമിത്തം
  rationale: διά + accusative ഇവിടെ കാരണത്തെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ ‘അവൻ’ ലാസറിനെ പരാമർശിക്കുന്നു.
- source_word: ὑπῆγον
  choice: അവരെ വിട്ടുപോകുകയും … ചെയ്തുകൊണ്ടിരുന്നു
  rationale: ഇംപെർഫെക്റ്റിന്റെ തുടർച്ചയായോ ആവർത്തിച്ചോ നടന്ന പ്രവർത്തനഭാവം സൂക്ഷിക്കുന്നു. മലയാളത്തിൽ ആവശ്യമായ കർമ്മസൂചനയായ ‘അവരെ’ സന്ദർഭത്തിലെ യേശുവിനെ എതിർത്ത അധികാരികളെ സൂചിപ്പിക്കുന്നതായി ചേർത്തിരിക്കുന്നു; ഇതിന്റെ വ്യാഖ്യാനസ്വഭാവം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐπίστευον εἰς τὸν Ἰησοῦν
  choice: യേശുവിൽ വിശ്വസിക്കുകയും ചെയ്തുകൊണ്ടിരുന്നു
  rationale: യേശുവിലേക്കു ദിശപ്പെടുത്തിയ വ്യക്തിപരമായ വിശ്വാസത്തെയും ഇംപെർഫെക്റ്റിന്റെ തുടരുന്ന പ്രതികരണത്തെയും സംരക്ഷിക്കുന്നു; ‘ശിഷ്യരായി’ അല്ലെങ്കിൽ ‘രക്ഷിക്കപ്പെട്ടു’ എന്ന അധിക നിഗമനം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: യോഹന്നാനിലെ Ἰουδαίων എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: പ്രധാനപാഠത്തിൽ ‘യെഹൂദന്മാർ’
  alternative: ‘യെഹൂദ്യർ’ അല്ലെങ്കിൽ സന്ദർഭാനുസൃതമായി ‘യെഹൂദനേതാക്കൾ’
  rationale: ഇവിടെ ‘പലരും’ എന്നത് വലിയൊരു സമൂഹത്തിലെ ചിലരെ സൂചിപ്പിക്കുന്നു; എല്ലാ യെഹൂദന്മാരെയും കുറ്റപ്പെടുത്തുന്ന പൊതുപ്രസ്താവനയല്ല. ഭൂമിശാസ്ത്രപരമായ ‘യെഹൂദ്യർ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: ὑπῆγον എന്നതിൽനിന്ന് ആരെ വിട്ടുപോയി എന്ന ചോദ്യം
  choice: സന്ദർഭത്തിലെ എതിർപ്പുകാരെ സൂചിപ്പിക്കാൻ ‘അവരെ വിട്ടുപോകുക’
  alternative: കർമ്മം വ്യക്തമാക്കാതെ ‘പോയിക്കൊണ്ടിരുന്നു’ അല്ലെങ്കിൽ ‘പിരിഞ്ഞുപോകുകയായിരുന്നു’
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർത്ഥം ‘പോകുക/വിട്ടുപോകുക’ എന്നതാണ്; സന്ദർഭം അധികാരികളുടെ നിലപാടിൽനിന്നോ സ്വാധീനത്തിൽനിന്നോ ആളുകൾ അകന്നുപോകുന്നതായി സൂചിപ്പിക്കുന്നു. എന്നാൽ ഗ്രീക്കിൽ കർമ്മം പ്രത്യക്ഷമായി ഇല്ലാത്തതിനാൽ ഈ വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- issue: πιστεύω εἰς എന്നതിന്റെ ദൈവശാസ്ത്രപരമായ ശക്തി
  choice: ‘യേശുവിൽ വിശ്വസിക്കുക’
  alternative: ‘യേശുവിൽ ആശ്രയം വെക്കുക’
  rationale: യേശുവിലേക്കു ദിശപ്പെടുത്തിയ വിശ്വാസം വാക്യം പ്രസ്താവിക്കുന്നു; അതിനെ ‘ശിഷ്യരായി’ അല്ലെങ്കിൽ ‘രക്ഷിക്കപ്പെട്ടു’ എന്നു വിപുലീകരിക്കാതെ പാഠത്തിന്റെ പരിധി കാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മുൻവാക്യവുമായി ബന്ധിപ്പിക്കുന്ന ‘കാരണം’ നിലനിർത്തിയിട്ടുണ്ട്. രണ്ടു ഇംപെർഫെക്റ്റ് ക്രിയകളുടെയും തുടരുന്ന പ്രവർത്തനഭാവം ‘ചെയ്തുകൊണ്ടിരുന്നു’ എന്ന ഘടനയിലൂടെ പ്രകടമാക്കുന്നു.
