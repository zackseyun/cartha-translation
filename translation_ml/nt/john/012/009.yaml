id: JHN.12.9
reference: John 12:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἔγνω ⸀οὖν ὄχλος πολὺς ἐκ τῶν Ἰουδαίων ὅτι ἐκεῖ ἐστιν, καὶ ἦλθον οὐ διὰ τὸν Ἰησοῦν μόνον, ἀλλ’ ἵνα καὶ τὸν Λάζαρον ἴδωσιν ὃν ἤγειρεν ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/009.yaml
  text: So a large crowd of the Jews learned that he was there[a], and they came not only because of Jesus, but also so that they might see Lazarus, whom he had raised from the dead.
translation:
  language: ml
  text: അതുകൊണ്ട്, യെഹൂദന്മാരിൽനിന്നുള്ള വലിയൊരു ജനക്കൂട്ടം യേശു അവിടെയുണ്ടെന്ന് അറിഞ്ഞു.[a] അവർ യേശുവിന്റെ കാരണത്താൽ മാത്രം വന്നതല്ല; അവൻ മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിച്ച ലാസറിനെയും കാണാനായി അവർ വന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യെഹൂദ്യയിൽ നിന്നുള്ളവർ.” ഗ്രീക്ക് പദം പൊതുവായി യെഹൂദജനത്തെ സൂചിപ്പിക്കാം; യോഹന്നാനിലെ ചില സന്ദർഭങ്ങളിൽ അത് പ്രത്യേകിച്ച് യെഹൂദ്യയിൽ നിന്നുള്ളവരെയും സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἔγνω
  choice: അറിഞ്ഞു
  rationale: സന്ദർഭത്തിൽ പുതിയ വിവരം അറിഞ്ഞതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻസന്ദർഭത്തിൽനിന്നുള്ള ആഖ്യാനപരമായ പരിണതിബന്ധം നിലനിർത്തുന്നു.
- source_word: ὄχλος πολὺς
  choice: വലിയൊരു ജനക്കൂട്ടം
  rationale: സാമൂഹിക ഏകവചനവും വലിപ്പത്തിനുള്ള ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐκ τῶν Ἰουδαίων
  choice: യെഹൂദന്മാരിൽ
  rationale: ἐκ എന്നതിന്റെ ‘ഇടയിൽനിന്ന്/അവരിൽ’ എന്ന വിഭാഗസൂചന സംക്ഷിപ്തമായി നൽകുന്നു; Ἰουδαῖοι എന്ന പദത്തിന്റെ സാന്ദർഭിക അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ὅτι ἐκεῖ ἐστιν
  choice: യേശു അവിടെയുണ്ടെന്ന്
  rationale: ഗ്രീക്കിൽ കർത്താവ് പരോക്ഷമായിരിക്കുമ്പോഴും മലയാളത്തിലെ വ്യക്തതയ്ക്കായി സന്ദർഭത്തിൽനിന്ന് ‘യേശു’ ചേർക്കുന്നു; വർത്തമാനരൂപത്തിന്റെ നില ‘ഉണ്ടെന്ന്’ എന്നതിൽ നിലനിർത്തുന്നു.
- source_word: ἦλθον
  choice: അവർ വന്നത്
  rationale: സംഭവസ്ഥലത്തിന്റെ ദൃഷ്ടികോണത്തിൽ നിന്നുള്ള ചലനം സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: οὐ διὰ τὸν Ἰησοῦν μόνον
  choice: യേശുവിനെക്കുറിച്ചുമാത്രമല്ല
  rationale: διά + accusative സൂചിപ്പിക്കുന്ന കാരണം/പ്രേരണ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀλλ’ ἵνα καὶ ... ἴδωσιν
  choice: ലാസറിനെയും കാണാനായിരുന്നു
  rationale: വിരുദ്ധസമുച്ചയവും ഉദ്ദേശ്യാർഥവും മലയാളത്തിലെ ‘-ഉം ... കാണാൻ’ ഘടനയിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: Λάζαρον
  choice: ലാസർ
  rationale: മലയാളത്തിൽ പ്രചാരത്തിലുള്ള പേരുരൂപം ഉപയോഗിക്കുന്നു.
- source_word: ὃν ἤγειρεν ἐκ νεκρῶν
  choice: അവൻ മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിച്ച
  rationale: ἐγείρω എന്നതിന്റെ ജീവിപ്പിക്കൽ/ഉയിർപ്പിക്കൽ അർഥവും ἐκ νεκρῶν എന്നതിന്റെ ബഹുവചനപരമായ ‘മരിച്ചവരിൽനിന്ന്’ രൂപവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: യോഹന്നാനിലെ Ἰουδαίων എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി
  choice: യെഹൂദന്മാരിൽ
  alternative: യെഹൂദ്യരിൽ
  rationale: ഇവിടെ ഉത്സവസന്ദർഭത്തിലെ ജനക്കൂട്ടത്തെ യെഹൂദജനതയിൽനിന്നുള്ളവരായി കാണുന്നത് യുക്തമാണ്; എന്നാൽ യോഹന്നാനിൽ പദത്തിന് ചിലപ്പോൾ ഭൂമിശാസ്ത്രപരമായ ‘യെഹൂദ്യർ’ എന്ന അർഥവും ഉണ്ടാകാം. ആ സാധ്യത അടിക്കുറിപ്പിൽ തുറന്നുവയ്ക്കുന്നു.
- issue: ലാസറിനെ ഉയിർപ്പിച്ചവന്റെ സൂചിത കർത്താവ്
  choice: അവൻ
  alternative: യേശു
  rationale: ഗ്രീക്കിലെ ἤγειρεν എന്ന ക്രിയയുടെ കർത്താവ് സർവ്വനാമമായി സൂചിതമാണ്; മുൻപുള്ള യേശുവിലേക്കുള്ള പരാമർശം നിലനിർത്തി മലയാളത്തിലും ‘അവൻ’ ഉപയോഗിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിച്ച’ എന്ന രൂപം ഉറവിടത്തിലെ ഭാഷയും ദൈവശാസ്ത്രപരമായ ഭാവവും സംരക്ഷിക്കുന്നു; അടിക്കുറിപ്പ് പ്രധാനവാചകത്തിലെ അർഥം അനാവശ്യമായി ഭാരപ്പെടുത്താതെ Ἰουδαῖοι എന്ന പദത്തിന്റെ യഥാർഥ ദ്വയാർഥസാധ്യത നിലനിർത്തുന്നു.
