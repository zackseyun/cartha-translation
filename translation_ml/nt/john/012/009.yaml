revisions:
- from: അതുകൊണ്ട്, യേശു അവിടെയുണ്ടെന്ന് യെഹൂദന്മാരിൽ വലിയൊരു ജനക്കൂട്ടം അറിഞ്ഞു.[a] അവർ വന്നത് യേശുവിനെക്കുറിച്ചുമാത്രമല്ല, അവൻ മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിച്ച ലാസറിനെയും കാണാനായിരുന്നു.
  to: അതുകൊണ്ട്, യെഹൂദന്മാരിൽനിന്നുള്ള വലിയൊരു ജനക്കൂട്ടം യേശു അവിടെയുണ്ടെന്ന് അറിഞ്ഞു.[a] അവർ യേശുവിന്റെ കാരണത്താൽ മാത്രം വന്നതല്ല; അവൻ മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിച്ച ലാസറിനെയും കാണാനായി അവർ വന്നു.
