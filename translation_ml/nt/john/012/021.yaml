source:
  edition: SBLGNT
  text: οὗτοι οὖν προσῆλθον Φιλίππῳ τῷ ἀπὸ Βηθσαϊδὰ τῆς Γαλιλαίας, καὶ ἠρώτων αὐτὸν λέγοντες· Κύριε, θέλομεν τὸν Ἰησοῦν ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/021.yaml
  text: So these came to Philip[a], who was from Bethsaida in Galilee, and were asking him, saying, “Lord, we want to see Jesus.”
translation:
  language: ml
  text: 'അങ്ങനെ, ഇവർ ഗലീലയിലെ ബേത്ത്സയിദയിൽനിന്നുള്ള ഫിലിപ്പോസിന്റെ അടുക്കൽ വന്ന് അവനോട് ഇങ്ങനെ അപേക്ഷിച്ചുകൊണ്ടിരുന്നു: “അയ്യാ,[a] ഞങ്ങൾക്ക് യേശുവിനെ കാണണം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കർത്താവേ” അല്ലെങ്കിൽ “യജമാനനേ.” ഗ്രീക്കിലെ κύριε എന്ന അഭിസംബോധന ഒരു വ്യക്തിയോടുള്ള ആദരപൂർവമായ വിളിയായ “അയ്യാ” എന്നും അർഥമാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτοι
  choice: ഇവർ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ ഗ്രീക്കുകാരെ ചൂണ്ടിക്കാണിക്കുന്ന ബഹുവചന സർവനാമത്തിന്റെ സൂചന നിലനിർത്തുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: വാക്യത്തെ മുൻസന്ദർഭവുമായി ബന്ധിപ്പിക്കുന്ന ആഖ്യാനപരമായ തുടർച്ചയും നിഗമനഭാവവും പ്രകടമാക്കുന്നു.
- source_word: προσῆλθον
  choice: അടുക്കൽ വന്ന്
  rationale: προσέρχομαι എന്ന ക്രിയയുടെ ‘സമീപിക്കുക/അടുക്കൽ വരുക’ എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: Φιλίππῳ
  choice: ഫിലിപ്പോസ്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം.
- source_word: τῷ ἀπὸ Βηθσαϊδὰ τῆς Γαλιλαίας
  choice: ഗലീലയിലെ ബേത്ത്സയിദയിൽനിന്നുള്ള
  rationale: ഫിലിപ്പോസിന്റെ സ്വദേശത്തെ തിരിച്ചറിയിക്കുന്ന ഗ്രീക്ക് വിശേഷണഘടന സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: ἠρώτων
  choice: അപേക്ഷിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലത്തിന്റെ തുടർച്ചാഭാവം നിലനിർത്തുകയും ഇവിടെ ἐρωτάω സൂചിപ്പിക്കുന്ന അഭ്യർഥനയുടെ സ്വഭാവം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: λέγοντες
  choice: ഇങ്ങനെ
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വാക്കുകൾ അവതരിപ്പിക്കാൻ സ്വാഭാവിക മലയാള ആഖ്യാനരീതി ഉപയോഗിക്കുന്നു; ‘പറഞ്ഞുകൊണ്ട്’ എന്ന ആവർത്തനഭാരം ഒഴിവാക്കുന്നു.
- source_word: Κύριε
  choice: യജമാനനേ
  rationale: κύριος എന്ന പദത്തിന്റെ അഭിസംബോധനരൂപത്തോടുള്ള പദസുതാര്യത നിലനിർത്തുന്നു; എന്നാൽ ഫിലിപ്പോസിനോടുള്ള ആദരസൂചക അഭിസംബോധന എന്ന സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: θέλομεν
  choice: ഞങ്ങൾക്ക് … കാണണം
  rationale: ആഗ്രഹം നേരിട്ടും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: τὸν Ἰησοῦν
  choice: യേശുവിനെ
  rationale: നേരിട്ടുള്ള കർമമായി വ്യക്തിനാമം സ്വാഭാവിക മലയാള വിഭക്തിയിൽ നൽകുന്നു.
- source_word: ἰδεῖν
  choice: കാണണം
  rationale: ὁράω എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘കാണുക’ നിലനിർത്തുന്നു; ‘കണ്ടുമുട്ടുക’ എന്ന സന്ദർഭസാധ്യത മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ഫിലിപ്പോസിനോടുള്ള Κύριε എന്ന അഭിസംബോധന
  choice: യജമാനനേ
  alternative: അങ്ങുന്നേ / സാർ
  rationale: κύριε എന്നതിന്റെ ‘കർത്താവേ/യജമാനനേ’ എന്ന പദാർഥബന്ധം നിലനിർത്തുന്നു. എന്നാൽ ഇവിടെ യേശുവിനെയല്ല, ഫിലിപ്പോസിനെയാണ് അഭിസംബോധന ചെയ്യുന്നത്; അതിനാൽ ഇത് ദൈവശാസ്ത്രപരമായ പ്രഖ്യാപനമല്ലാതെ ആദരസൂചകമായ ‘അങ്ങുന്നേ’ എന്ന അർഥത്തിലായിരിക്കാമെന്ന യഥാർഥ സന്ദർഭസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ imperfect ക്രിയയുടെ തുടർച്ചാഭാവം ‘അപേക്ഷിച്ചുകൊണ്ടിരുന്നു’ എന്നതിലൂടെ സൂക്ഷിച്ചു. κύριε എന്ന പദത്തിന്റെ സന്ദർഭപരമായ ആദരസൂചക അർഥവും പദാർഥപരമായ സുതാര്യതയും മുഖ്യപാഠവും അടിക്കുറിപ്പും ചേർത്ത് നിലനിർത്തി.
