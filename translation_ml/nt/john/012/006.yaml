  source_fidelity: മൂലഗ്രീക്കിലെ നിഷേധിക്കപ്പെട്ട പ്രേരണ (οὐχ ὅτι), യഥാർഥ കാരണം (ἀλλ’ ὅτι), κλέπτης എന്ന കുറ്റാരോപണം, γλωσσόκομον എന്ന പണസൂക്ഷിപ്പുപാത്രം, ἔχων എന്ന അനുബന്ധസാഹചര്യം, ἐβάσταζεν എന്ന അപൂർണഭൂതകാല-ആവർത്തനഭാവം എന്നിവ കൃത്യമായി പ്രതിഫലിക്കുന്നു. ‘എടുത്തുകൊണ്ടിരുന്നു’ സന്ദർഭം സൂചിപ്പിക്കുന്ന കൈക്കലാക്കൽ അറിയിക്കുമ്പോഴും ക്രിയയെ അനാവശ്യമായി ഏകാർഥമാക്കുന്നില്ല.
