id: JHN.12.6
reference: John 12:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν δὲ τοῦτο οὐχ ὅτι περὶ τῶν πτωχῶν ἔμελεν αὐτῷ, ἀλλ’ ὅτι κλέπτης ἦν καὶ τὸ γλωσσόκομον ⸀ἔχων τὰ βαλλόμενα ἐβάσταζεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/006.yaml
  text: He said this not because he cared about the poor[a], but because he was a thief, and having the money box[b], he used to take what was put into it.
translation:
  language: ml
  text: അവൻ ഇതു പറഞ്ഞത് ദരിദ്രരെക്കുറിച്ച് അവനു കരുതലുണ്ടായിരുന്നതുകൊണ്ടല്ല, മറിച്ച് അവൻ ഒരു കള്ളനായിരുന്നതുകൊണ്ടാണ്; പണപ്പെട്ടി[a] കൈവശം വെച്ചിരുന്ന അവൻ അതിൽ ഇടുന്നതു എടുത്തുകൊണ്ടിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പണസഞ്ചി’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കുപദം പണം സൂക്ഷിക്കുന്ന ഒരു പെട്ടിയെയോ സഞ്ചിയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘അതിൽ ഇടുന്നത് അവൻ എടുത്തുകൊണ്ടുപോയിരുന്നു’ അല്ലെങ്കിൽ ‘മോഷ്ടിച്ചുകൊണ്ടിരുന്നു’ എന്നും അർഥമാകാം. ഈ ക്രിയയ്ക്ക് സാധാരണയായി ‘വഹിക്കുക’ എന്ന അർഥമുണ്ടെങ്കിലും, ‘അവൻ ഒരു കള്ളനായിരുന്നു’ എന്ന സന്ദർഭം ഇവിടെ കൈക്കലാക്കലിനെ സൂചിപ്പിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν δὲ τοῦτο
  choice: അവൻ ഇതു പറഞ്ഞത്
  rationale: δέയുടെ നേരിയ ബന്ധകസ്വഭാവം മലയാളത്തിലെ വാക്യപ്രവാഹത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു; മൂലത്തിൽ ഇല്ലാത്ത കാലസൂചകപദം ചേർക്കുന്നില്ല.
- source_word: οὐχ ὅτι περὶ τῶν πτωχῶν ἔμελεν αὐτῷ
  choice: ദരിദ്രരെക്കുറിച്ച് അവനു കരുതലുണ്ടായിരുന്നതുകൊണ്ടല്ല
  rationale: οὐχ ὅτι നിഷേധിക്കപ്പെടുന്ന പ്രേരണയെ സൂചിപ്പിക്കുന്നു; μέλει എന്നതിലെ വ്യക്തിപരമായ കരുതൽ ദാതൃവിഭക്തിയോടുകൂടി വ്യക്തമായി പകർത്തുന്നു.
- source_word: ἀλλ’ ὅτι κλέπτης ἦν
  choice: മറിച്ച് അവൻ ഒരു കള്ളനായിരുന്നതുകൊണ്ടാണ്
  rationale: ἀλλ’ ὅτι യഥാർഥ കാരണം മുൻപത്തെ നിഷേധവുമായി പ്രതിവിരുദ്ധമായി അവതരിപ്പിക്കുന്നു; κλέπτης രഹസ്യമായി മോഷ്ടിക്കുന്ന കള്ളനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: τὸ γλωσσόκομον
  choice: പണപ്പെട്ടി
  rationale: പണം സൂക്ഷിക്കുന്ന പെട്ടിയെയോ സഞ്ചിയെയോ സൂചിപ്പിക്കാവുന്ന പദമാണിത്. മുഖ്യപാഠത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ ‘പണപ്പെട്ടി’ ഉപയോഗിക്കുകയും മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: ἔχων
  choice: കൈവശം വെച്ചിരുന്ന
  rationale: പണപ്പെട്ടി യൂദാസിന്റെ കൈവശത്തും നിയന്ത്രണത്തിലുമായിരുന്നു എന്ന അനുബന്ധസാഹചര്യം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; കാരണബന്ധം അനാവശ്യമായി ശക്തമാക്കുന്നില്ല.
- source_word: τὰ βαλλόμενα
  choice: അതിൽ ഇടുന്നത്
  rationale: നിക്ഷേപിക്കപ്പെട്ട പണമോ വസ്തുക്കളോ ഉദ്ദേശിക്കുന്ന നിഷ്ക്രിയ കൃദന്തരൂപം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; ലക്ഷ്യസ്ഥാനം സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാക്കി ചേർക്കുന്നു.
- source_word: ἐβάσταζεν
  choice: എടുത്തുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലത്തിന്റെ ആവർത്തിതമോ തുടർച്ചയായതോ ആയ ഭാവം നിലനിർത്തുന്നു. അടിസ്ഥാനമായ ‘വഹിക്കുക/എടുക്കുക’ എന്ന അർഥവും ‘കള്ളൻ’ എന്ന സന്ദർഭം സൂചിപ്പിക്കുന്ന കൈക്കലാക്കലും തമ്മിലുള്ള പിരിമുറുക്കം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യൂദാസിന്റെ മോഷണവുമായി ബന്ധപ്പെട്ട് ἐβάσταζεν എന്ന ക്രിയയുടെ അർഥം
  choice: തുടർച്ചയായ കൈക്കലാക്കൽ സൂചിപ്പിക്കുന്ന ‘എടുത്തുകൊണ്ടിരുന്നു’
  alternative: ‘വഹിച്ചുകൊണ്ടിരുന്നു’ അല്ലെങ്കിൽ കൂടുതൽ വ്യക്തമാക്കിയ ‘മോഷ്ടിച്ചുകൊണ്ടിരുന്നു’
  rationale: ‘അവൻ ഒരു കള്ളനായിരുന്നു’ എന്ന ഉടൻമുമ്പുള്ള പ്രസ്താവന സ്വാർത്ഥമായി എടുത്തുമാറ്റുന്നതിനെ ശക്തമായി സൂചിപ്പിക്കുന്നു. എങ്കിലും ക്രിയയെ നേരിട്ട് ‘മോഷ്ടിക്കുക’ എന്നു മാത്രം വിവർത്തനം ചെയ്യാതെ അതിന്റെ വിശാലമായ പദാർഥസാധ്യതയും സന്ദർഭത്തിലെ കുറ്റാരോപണവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ദീർഘമായ ഗ്രീക്ക് വാക്യത്തിന്റെ കാരണ-പ്രതികാരണഘടന അർദ്ധവിരാമത്തിലൂടെ വായനാസൗകര്യത്തോടെ നിലനിർത്തിയിരിക്കുന്നു. അടിക്കുറിപ്പുകളുടെ ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന ‘പണപ്പെട്ടി’, ‘എടുത്തുകൊണ്ടിരുന്നു’ എന്നീ പദങ്ങളോടു ചേർത്തിരിക്കുന്നു.
