  naturalness: ‘തന്റെ ജീവനെ സ്നേഹിക്കുന്നവൻ’ / ‘ഈ ലോകത്തിൽ തന്റെ ജീവനെ വെറുക്കുന്നവൻ’ എന്ന സമാന്തരരീതി ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്. ‘വെറുക്കുന്നവനോ’ വാക്യത്തിലെ ഉദ്ദേശ്യപൂർവമായ വൈരുധ്യവും രണ്ടു ഉപവാക്യങ്ങൾക്കിടയിലെ വൈപരീത്യവും നിലനിർത്തുന്നു.
