  to: തന്റെ ജീവനെ[a] സ്നേഹിക്കുന്നവൻ അതിനെ നഷ്ടപ്പെടുത്തുന്നു; ഈ ലോകത്തിൽ തന്റെ ജീവനെ വെറുക്കുന്നവനോ[b] അതിനെ നിത്യജീവനുവേണ്ടി കാത്തുസൂക്ഷിക്കും.
