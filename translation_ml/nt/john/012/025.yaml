id: JHN.12.25
reference: John 12:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ φιλῶν τὴν ψυχὴν αὐτοῦ ⸀ἀπολλύει αὐτήν, καὶ ὁ μισῶν τὴν ψυχὴν αὐτοῦ ἐν τῷ κόσμῳ τούτῳ εἰς ζωὴν αἰώνιον φυλάξει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/025.yaml
  text: The one who loves his life loses it[b][a], and the one who hates his life in this world will keep it for eternal life.
translation:
  language: ml
  text: തന്റെ ജീവനെ[a] സ്നേഹിക്കുന്നവൻ അതിനെ നഷ്ടപ്പെടുത്തുന്നു; ഈ ലോകത്തിൽ തന്റെ ജീവനെ വെറുക്കുന്നവനോ[b] അതിനെ നിത്യജീവനുവേണ്ടി കാത്തുസൂക്ഷിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ആത്മാവിനെ’ അല്ലെങ്കിൽ ‘സ്വയത്തെ’; ഗ്രീക്കിലെ ψυχή എന്ന പദത്തിന് സന്ദർഭമനുസരിച്ച് ‘ജീവൻ,’ ‘സ്വയം,’ ‘ആത്മാവ്’ എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: ‘തന്റെ ജീവനെ വെറുക്കുന്നു’ എന്നത് ഈ ലോകത്തിലെ സ്വന്തം ജീവനെ മുറുകെപ്പിടിക്കുന്ന മനോഭാവം ത്യജിക്കുന്നതിനെക്കുറിച്ചുള്ള ഉദ്ദേശപൂർവമായ വിരോധാഭാസമാണ്; ലൂക്കോസ് 14:26-ലെ സമാനമായ പ്രയോഗം കാണുക. ഇത് സ്വയം വെറുക്കാൻ ഉപദേശിക്കുന്നില്ല.
    reason: cross_reference
lexical_decisions:
- source_word: ὁ φιλῶν
  choice: സ്നേഹിക്കുന്നവൻ
  rationale: നാമവാചകമായി ഉപയോഗിച്ചിരിക്കുന്ന വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ പൊതുവായ ഏകവചന അർഥവും തുടർച്ചയായ മനോഭാവവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: തന്റെ ജീവനെ
  rationale: ഈ സന്ദർഭത്തിൽ ψυχή എന്നത് പ്രധാനമായും അഭൗതികമായ ‘ആത്മാവ്’ എന്നല്ല, ഒരാളുടെ ജീവൻ അഥവാ സ്വയം എന്ന അർഥത്തിലാണ്; നഷ്ടപ്പെടുത്തുകയും കാത്തുസൂക്ഷിക്കുകയും ചെയ്യുന്നതുമായ സമാന്തരപ്രയോഗത്തിന് ‘ജീവൻ’ യോജിക്കുന്നു.
- source_word: ἀπολλύει
  choice: നഷ്ടപ്പെടുത്തുന്നു
  rationale: ജീവനെ വസ്തുവാക്കി വരുന്ന ഈ പ്രയോഗത്തിൽ ‘നഷ്ടപ്പെടുത്തുന്നു’ സ്വാഭാവികവും φυλάξει എന്നതോടുള്ള വൈരുധ്യം നിലനിർത്തുന്നതുമാണ്.
- source_word: ὁ μισῶν
  choice: വെറുക്കുന്നവൻ
  rationale: μισέωയുടെ ശക്തമായ ഭാഷ മയപ്പെടുത്തി മാറ്റാതെ യേശുവിന്റെ ഉദ്ദേശപൂർവമായ വിരോധാഭാസം സംരക്ഷിക്കുന്നു.
- source_word: ἐν τῷ κόσμῳ τούτῳ
  choice: ഈ ലോകത്തിൽ
  rationale: ഇപ്പോഴത്തെ ലോകക്രമത്തോടുള്ള ജീവാസക്തിയെ നിത്യജീവനോട് വിപരീതമായി കാണിക്കുന്ന യോഹന്നാനീയ സന്ദർഭത്തിന് യോജിച്ച നേരിട്ടുള്ള വിവർത്തനം.
- source_word: φυλάξει
  choice: കാത്തുസൂക്ഷിക്കും
  rationale: ഭാവികാല അർഥം വ്യക്തമാക്കുകയും നഷ്ടപ്പെടുത്തുന്നതിന് എതിരായ സംരക്ഷണാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: εἰς ζωὴν αἰώνιον
  choice: നിത്യജീവനുവേണ്ടി
  rationale: εἰς സൂചിപ്പിക്കുന്ന ലക്ഷ്യത്തെയോ ഫലത്തെയോ വ്യക്തമാക്കുന്നു; ‘നിത്യജീവനിലേക്കായി’ എന്നതിനെക്കാൾ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്.
- source_word: αὐτοῦ
  choice: തന്റെ
  rationale: കർത്താവിലേക്കുതന്നെ മടങ്ങുന്ന ഉടമസ്ഥത മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുകയും ഗ്രീക്കിലെ ഏകവചന പൊതുപ്രയോഗം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘തന്റെ ജീവനെ വെറുക്കുന്നു’ എന്നതിന്റെ അർഥം
  choice: ‘വെറുക്കുന്നവൻ’ എന്ന ശക്തമായ വാക്ക് നിലനിർത്തി, ഈ ലോകത്തിലെ ജീവാസക്തിയും സ്വരക്ഷാപ്രവണതയും ത്യജിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന വിരോധാഭാസമായി അവതരിപ്പിച്ചു.
  alternative: ‘കുറച്ചുമാത്രം സ്നേഹിക്കുന്നവൻ’ അല്ലെങ്കിൽ ‘ജീവനെ വിലകുറച്ച് കാണുന്നവൻ’
  rationale: മൂലപാഠത്തിലെ μισέωയുടെ ശക്തി മയപ്പെടുത്താതെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തണം. ‘ഈ ലോകത്തിൽ’ എന്ന വിശേഷണം അതിന്റെ പരിധി വ്യക്തമാക്കുന്നു; സ്വയം വെറുക്കണമെന്ന ഉപദേശമല്ലെന്ന വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ψυχήയുടെ വിവർത്തനം
  choice: രണ്ടിടത്തും ‘ജീവൻ’
  alternative: ‘ആത്മാവ്’ അല്ലെങ്കിൽ ‘സ്വയം’
  rationale: നഷ്ടപ്പെടുകയും കാത്തുസൂക്ഷിക്കപ്പെടുകയും ചെയ്യുന്ന ഒരാളുടെ ജീവൻ/സ്വയം എന്നതാണ് സന്ദർഭാർഥം. ‘ആത്മാവ്’ എന്നു പ്രധാനപാഠത്തിൽ നൽകിയാൽ ഈ വാക്യം ആവശ്യപ്പെടാത്ത ശരീര-ആത്മ ദ്വൈതധാരണ ഇറക്കുമതി ചെയ്യാൻ ഇടയുണ്ട്; പദത്തിന്റെ വിശാല അർഥപരിധി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘വെറുക്കുന്നവൻ’ എന്ന മൂലപാഠത്തിന്റെ കടുപ്പം നിലനിർത്തി; വിശദീകരണം പ്രധാനപാഠത്തിൽ ചേർത്ത് വിരോധാഭാസം പരിഹരിക്കാതെ അടിക്കുറിപ്പിലാക്കി. രണ്ട് അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും അവ വിശദീകരിക്കുന്ന ഘടകത്തിനു പിന്നാലെ പ്രധാനപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
