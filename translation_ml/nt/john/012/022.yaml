source:
  edition: SBLGNT
  text: ἔρχεται ⸀ὁ Φίλιππος καὶ λέγει τῷ Ἀνδρέᾳ· ⸀ἔρχεται Ἀνδρέας καὶ Φίλιππος ⸀καὶ λέγουσιν τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/022.yaml
  text: Philip comes and tells Andrew[a]; Andrew and Philip come and tell Jesus.
translation:
  language: ml
  text: ഫിലിപ്പൊസ് വന്ന് അന്ത്രെയാസിനോടു പറയുന്നു[a]. അന്ത്രെയാസും ഫിലിപ്പൊസും വന്ന് യേശുവിനോടു പറയുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ഈ വാക്യത്തിലെ ക്രിയകൾ വർത്തമാനകാലത്തിലാണ് (‘വരുന്നു … പറയുന്നു … വരുന്നു … പറയുന്നു’). സംഭവത്തെ കൺമുന്നിൽ നടക്കുന്നതുപോലെ അവതരിപ്പിക്കുന്ന ഈ ആഖ്യാനരീതിയെ ‘ചരിത്രവർത്തമാനം’ എന്നു വിളിക്കുന്നു; പല പരിഭാഷകളും ഇവയെ ഭൂതകാലത്തിലാക്കാറുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: അടുക്കൽ വന്ന്
  rationale: ചലനം അടുത്ത വ്യക്തിയിലേക്കാണെന്ന് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ഗ്രീക്കിലെ വർത്തമാനകാല ആഖ്യാനശൈലി നിലനിർത്താൻ ‘വന്നു’ എന്ന ഭൂതകാലത്തിലേക്ക് മാറ്റിയില്ല.
- source_word: λέγει / λέγουσιν
  choice: അവനോടു പറയുന്നു
  rationale: ആരോടാണ് സംസാരിക്കുന്നതെന്ന് ദത്തിവിഭക്തിയുടെ അർഥം തെളിയിക്കുകയും, പറയുന്ന കാര്യത്തിന്റെ ഉള്ളടക്കം വാക്യത്തിൽ നൽകിയിട്ടില്ലാത്തതിനാൽ ‘അറിയിക്കുന്നു’ പോലുള്ള കൂടുതൽ വ്യാഖ്യാനാത്മക പദം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: Ἀνδρέᾳ / Ἀνδρέας
  choice: അന്ത്രയോസ്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: τῷ Ἰησοῦ
  choice: യേശുവിന്റെ അടുക്കൽ ... അവനോടു
  rationale: രണ്ടാമത്തെ ἔρχεται-യുടെ സമീപനചലനവും ദത്തിവിഭക്തിയിലുള്ള അഭിസംബോധനയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: καί
  choice: ഉം / വാക്യബന്ധം
  rationale: ‘അന്ത്രയോസും ഫിലിപ്പോസും’ എന്ന സംയുക്തകർത്താവിൽ καί-യെ ‘ഉം’ ആയി നൽകി; ലളിതമായ ഗ്രീക്ക് ആഖ്യാനക്രമം അധികമായ കാരണ-കാല വ്യാഖ്യാനം ചേർക്കാതെ നിലനിർത്തി.
- source_word: ὁ Φίλιππος
  choice: ഫിലിപ്പോസ്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമം ലിപ്യന്തരിച്ചു; വ്യക്തിനാമത്തിനു മുമ്പുള്ള ലേഖത്തിന് ഇവിടെ പ്രത്യേക അർഥഭാരം ഇല്ലാത്തതിനാൽ വേറിട്ട് പരിഭാഷപ്പെടുത്തിയില്ല.
