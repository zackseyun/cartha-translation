revisions:
- from: ഫിലിപ്പോസ് അന്ത്രയോസിന്റെ അടുക്കൽ വന്ന് അവനോടു പറയുന്നു[a]. അന്ത്രയോസും ഫിലിപ്പോസും യേശുവിന്റെ അടുക്കൽ വന്ന് അവനോടു പറയുന്നു.
  to: ഫിലിപ്പൊസ് വന്ന് അന്ത്രെയാസിനോടു പറയുന്നു[a]. അന്ത്രെയാസും ഫിലിപ്പൊസും വന്ന് യേശുവിനോടു പറയുന്നു.
  rationale: The revision retains the Greek historical presents and its simple coordinated sequence, while avoiding the added locative/directional phrase ‘അടുക്കൽ.’ It directly represents the recipients governed by λέγει/λέγουσιν and uses familiar standard Malayalam biblical name forms. The unspecified content of the communication remains unspecified, as in the source.
