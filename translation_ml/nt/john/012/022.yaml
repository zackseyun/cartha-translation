  register: ആധുനികവും മാന്യവും എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ ചരിത്രവർത്തമാനവും ലളിതമായ സമാന്തര ആഖ്യാനക്രമവും നിലനിർത്തി; ആവർത്തനം ഉറവിടവാചകത്തിന്റെ ശൈലിയുടെ ഭാഗമായതിനാൽ അനാവശ്യമായി ചുരുക്കിയില്ല.
