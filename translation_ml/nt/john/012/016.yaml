source:
  edition: SBLGNT
  text: ⸀ταῦτα οὐκ ἔγνωσαν ⸂αὐτοῦ οἱ μαθηταὶ⸃ τὸ πρῶτον, ἀλλ’ ὅτε ἐδοξάσθη Ἰησοῦς τότε ἐμνήσθησαν ὅτι ταῦτα ἦν ἐπ’ αὐτῷ γεγραμμένα καὶ ταῦτα ἐποίησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/016.yaml
  text: His disciples did not understand these things at first[a], but when Jesus was glorified[c][b], then they remembered that these things had been written about him and that they had done these things to him.
translation:
  language: ml
  text: ആദ്യം അവന്റെ ശിഷ്യന്മാർ ഈ കാര്യങ്ങൾ മനസ്സിലാക്കിയില്ല[a]. എന്നാൽ യേശു മഹത്വീകരിക്കപ്പെട്ടപ്പോൾ[b], ഈ കാര്യങ്ങൾ അവനെക്കുറിച്ച്[c] എഴുതപ്പെട്ടിരുന്നുവെന്നും ഈ കാര്യങ്ങൾ അവനോടു ചെയ്തുവെന്നും അവർ അപ്പോൾ ഓർത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘ആദ്യം ഈ കാര്യങ്ങൾ അറിഞ്ഞില്ല.’
    reason: lexical_alternative
  - marker: b
    text: യോഹന്നാന്റെ സുവിശേഷത്തിൽ ‘മഹത്വീകരിക്കപ്പെട്ടു’ എന്നത് സാധാരണയായി യേശുവിന്റെ മരണം, പുനരുത്ഥാനം, ഉയർത്തപ്പെടൽ എന്നിവയിലൂടെയുള്ള അവന്റെ മഹത്വീകരണത്തെ സൂചിപ്പിക്കുന്നു.
    reason: cross_reference
  - marker: c
    text: അല്ലെങ്കിൽ ‘അവനെ സംബന്ധിച്ച് എഴുതപ്പെട്ടിരുന്നു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνωσαν
  choice: മനസ്സിലാക്കിയില്ല
  rationale: സന്ദർഭത്തിൽ ശിഷ്യന്മാർക്ക് സംഭവങ്ങളുടെ അർഥവും പ്രാധാന്യവും ഗ്രഹിക്കാനായില്ല എന്നതാണ് ഉദ്ദേശ്യം; γινώσκω എന്ന പദത്തിന്റെ ‘അറിഞ്ഞില്ല’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: αὐτοῦ οἱ μαθηταί
  choice: അവന്റെ ശിഷ്യന്മാർ
  rationale: ജനിറ്റീവ് സർവനാമം സൂചിപ്പിക്കുന്ന ബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഇങ്ങനെ വ്യക്തമാകുന്നു.
- source_word: τὸ πρῶτον
  choice: ആദ്യം
  rationale: ‘ആദ്യഘട്ടത്തിൽ’ എന്ന കാലസൂചന സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἐδοξάσθη
  choice: മഹത്ത്വീകരിക്കപ്പെട്ടപ്പോൾ
  rationale: യോഹന്നാനിലെ δοξάζω എന്ന പദത്തിന്റെ ദൈവശാസ്ത്രപരമായ പാളികൾ നിലനിർത്തുന്നു; ‘ബഹുമാനിക്കപ്പെട്ടു’ എന്നതിനെക്കാൾ മൂലപദത്തിന്റെ ഭാരം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: ἐμνήσθησαν
  choice: അവർ ഓർത്തു
  rationale: ἐμνήσθησαν എന്ന രൂപത്തിന്റെ സന്ദർഭോചിതവും സ്വാഭാവികവുമായ മലയാള പരിഭാഷ.
- source_word: ἐπ’ αὐτῷ γεγραμμένα
  choice: ഇവ അവനെക്കുറിച്ച് എഴുതപ്പെട്ടിരുന്നു
  rationale: ἐπί + ഡേറ്റീവ് ഇവിടെ സ്ഥലസൂചനയല്ല, ‘അവനെക്കുറിച്ച്/അവനെ സംബന്ധിച്ച്’ എന്ന അർഥമാണ്; എഴുതൽ ഓർത്ത സംഭവത്തിനു മുമ്പുള്ളതായതിനാൽ ‘എഴുതപ്പെട്ടിരുന്നു’ ഉപയോഗിച്ചു.
- source_word: ταῦτα ἐποίησαν αὐτῷ
  choice: അവർ ഇവ അവനോടു ചെയ്തു
  rationale: പ്രവർത്തിച്ചവരെ മൂലവാക്യം വ്യക്തമായി തിരിച്ചറിയിക്കാത്തതിനാൽ ‘അവർ’ അതേപടി നിലനിർത്തുന്നു; αὐτῷ എന്ന ഡേറ്റീവിനെ വ്യാഖ്യാനിച്ച് ‘അവനുവേണ്ടി’ എന്നു ചുരുക്കാതെ ‘അവനോടു’ എന്നു നൽകുന്നു.
- source_word: ταῦτα
  choice: ഈ കാര്യങ്ങൾ / ഇവ
  rationale: ആവർത്തിക്കുന്ന നപുംസകലിംഗ ബഹുവചന സർവനാമം, മുമ്പ് വിവരിച്ച പ്രവർത്തനങ്ങളെയും തിരുവെഴുത്തിലെ വിശദാംശങ്ങളെയും കൂട്ടമായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി ആദ്യം ‘ഈ കാര്യങ്ങൾ’, തുടർന്ന് ‘ഇവ’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: യേശു ‘മഹത്ത്വീകരിക്കപ്പെട്ടു’ എന്ന യോഹന്നാനീയ പ്രയോഗത്തിന്റെ പരിധി
  choice: ‘മഹത്ത്വീകരിക്കപ്പെട്ടു’ എന്ന പദപ്രയോഗം വിശദീകരണപരമായി ചുരുക്കാതെ നിലനിർത്തി.
  alternative: ‘ഉയർത്തപ്പെട്ടു’ അല്ലെങ്കിൽ ‘ബഹുമാനിക്കപ്പെട്ടു’
  rationale: ഈ പ്രയോഗം യേശുവിന്റെ മരണം, പുനരുത്ഥാനം, ഉയർത്തപ്പെടൽ എന്നിവയുമായി പാളികളുള്ള ബന്ധം പുലർത്തുന്നു. പരിഭാഷ അതിനെ ഒരൊറ്റ സംഭവമായി നിർണയിക്കുന്നില്ല.
- issue: ταῦτα ἐποίησαν αὐτῷ എന്നതിലെ ‘അവർ’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: കർത്താവിനെ വ്യാഖ്യാനിച്ച് വ്യക്തമാക്കാതെ ‘അവർ’ എന്നു നിലനിർത്തി.
  alternative: ‘ജനങ്ങൾ ഇവ അവനോടു ചെയ്തുവെന്ന്’
  rationale: ഗ്രീക്ക് പാഠത്തിൽ കർത്താവ് പരോക്ഷമാണ്; സന്ദർഭത്തിൽ ജനങ്ങളെ സൂചിപ്പിക്കാമെങ്കിലും പരിഭാഷ ആ തിരിച്ചറിയൽ നിർബന്ധമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ഗദ്യശൈലി ഉപയോഗിച്ചു. ‘മഹത്ത്വീകരിക്കപ്പെട്ടു’ പോലുള്ള യോഹന്നാനീയ ദൈവശാസ്ത്രഭാരമുള്ള പദം നിലനിർത്തിയപ്പോൾ വാക്യക്രമം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ രീതിയിൽ ക്രമപ്പെടുത്തി. മൂലത്തിലെ ആവർത്തനവും ‘അവർ’ എന്ന കർത്താവിന്റെ അവ്യക്തതയും കഴിയുന്നത്ര സംരക്ഷിച്ചു.
