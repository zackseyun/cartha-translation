lexical_decisions:
- source_word: εὑρὼν
  choice: കണ്ടെത്തി
  rationale: ഈ ഭൂതകാല കൃദന്തരൂപം മുഖ്യക്രിയയ്ക്കു മുമ്പുള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ സ്വാഭാവികമായ ക്രിയാശൃംഖല പ്രവൃത്തികളുടെ ക്രമം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: അപ്പോൾ
  rationale: ഇവിടെ δέ വൈരുധ്യം ഊന്നാതെ വിവരണത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്ന മൃദുവായ ബന്ധകമാണ്; ‘അപ്പോൾ’ ആഖ്യാനത്തിന്റെ ഒഴുക്ക് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὀνάριον
  choice: ഒരു ഇളം കഴുത
  rationale: ὀνάριον കഴുതയെ സൂചിപ്പിക്കുന്ന ലഘുരൂപമാണ്; പലപ്പോഴും പ്രായം കുറഞ്ഞ കഴുതയെ സൂചിപ്പിക്കാം. ‘ഇളം കഴുത’ ആ അർത്ഥസാധ്യത നിലനിർത്തുന്നു; ‘കഴുതക്കുട്ടി’ എന്ന കൂടുതൽ നിർദിഷ്ടമായ പരിഭാഷ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἐκάθισεν ἐπ’ αὐτό
  choice: അതിന്മേൽ ഇരുന്നു
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിന്റെ നേരായ അർത്ഥം നിലനിർത്തുന്നു; ‘അതിനെ കയറി’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ രൂപം ഒഴിവാക്കുന്നു.
- source_word: καθώς ἐστιν γεγραμμένον
  choice: എഴുതിയിരിക്കുന്നതുപോലെ
  rationale: തിരുവെഴുത്ത് ഉദ്ധരണി പരിചയപ്പെടുത്തുന്ന പതിവു സൂത്രവാക്യത്തിന്റെ താരതമ്യബലവും എഴുതപ്പെട്ടത് ഇപ്പോഴും നിലനിൽക്കുന്നു എന്ന ഭാവവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: ὁ Ἰησοῦς
  choice: യേശു
  rationale: ഗ്രീക്ക് ആഖ്യാനശൈലിയിൽ വ്യക്തിനാമത്തോടുകൂടിയ നിർദേശകപദം മലയാളത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്തേണ്ടതില്ല.
theological_decisions:
- issue: യേശുവിന്റെ പ്രവൃത്തിയും തുടർന്നുള്ള തിരുവെഴുത്ത് ഉദ്ധരണിയും തമ്മിലുള്ള ബന്ധം
  choice: യേശുവിന്റെ പ്രവൃത്തി എഴുതിയിരിക്കുന്നതിനോട് പൊരുത്തപ്പെടുന്നതായി അവതരിപ്പിക്കുന്നു; പ്രവചനനിവൃത്തിയുടെ ഉദ്ദേശ്യം പ്രത്യേകം വിശദീകരിക്കുന്നില്ല.
  alternative: യേശു മനഃപൂർവം പ്രവചനം നിവർത്തിക്കാനായി ഇങ്ങനെ ചെയ്തുവെന്ന് കൂടുതൽ ചലനാത്മകമായി വ്യക്തമാക്കുക.
  rationale: വാക്യം ആദ്യം പ്രവൃത്തി വിവരിച്ചശേഷം തിരുവെഴുത്ത് ഉദ്ധരണി അവതരിപ്പിക്കുന്നു. പ്രവചനപരമായ പൊരുത്തം അതിലുണ്ട്; എന്നാൽ യേശുവിന്റെ ഉദ്ദേശ്യം ഈ വാക്യം നേരിട്ട് പ്രസ്താവിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ കൃദന്തരൂപം പദാനുപദമായി ഭാരപ്പെടുത്താതെ പ്രവൃത്തികളുടെ ക്രമം നിലനിർത്തി. തുടർന്നുള്ള ഉദ്ധരണിയിലേക്കുള്ള കൊളോൺ സംരക്ഷിച്ചു.
