  source_fidelity: ‘അപ്പോൾ’ δέയുടെ മൃദുവായ ആഖ്യാനബന്ധം യോജ്യമായി നൽകുന്നു. ‘കണ്ടെത്തി ... ഇരുന്നു’ εὑρών എന്ന മുൻകാല പങ്കുപ്രയോഗവും ἐκάθισεν എന്ന മുഖ്യക്രിയയും സ്വാഭാവിക മലയാള ക്രിയാശൃംഖലയിൽ സംരക്ഷിക്കുന്നു. ‘ഒരു ഇളം കഴുതയെ’ ὀνάριον എന്ന പദത്തിന്റെ ചെറുപ്പസൂചന അമിതമായി നിർണയിക്കാതെ പ്രതിഫലിപ്പിക്കുന്നു. ‘അതിന്മേൽ ഇരുന്നു’ ἐκάθισεν ἐπ’ αὐτό എന്നതിന്റെ നേരായ അർത്ഥമാണ്. ‘എഴുതിയിരിക്കുന്നതുപോലെ’ καθώς ἐστιν γεγραμμένον എന്ന തിരുവെഴുത്ത്-ഉദ്ധരണിസൂത്രവാക്യത്തോടു വിശ്വസ്തമാണ്.
  naturalness: വാക്യം ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും മാന്യവുമായ ആഖ്യാനശൈലിയിലാണ്. ‘ഇളം കഴുത’ സാധാരണ പ്രയോഗത്തിൽ ‘കഴുതക്കുട്ടി’യെക്കാൾ അല്പം കുറവായി കേൾക്കാമെങ്കിലും, ഇവിടെ അത് സ്വാഭാവികമായി മനസ്സിലാകുന്നതും മൂലപദത്തിന്റെ ‘often young’ എന്ന പരിമിത സൂചനയെ സൂക്ഷിക്കുന്നതുമാണ്. കൊളോൺ തുടർന്നുള്ള ഉദ്ധരണിക്ക് ഉചിതമാണ്.
  terminology: ‘യേശു,’ ‘കഴുത,’ ‘എഴുതിയിരിക്കുന്നതുപോലെ’ എന്നിവ സ്ഥാപിതവും നിഷ്പക്ഷവുമായ പ്രയോഗങ്ങളാണ്. അടിക്കുറിപ്പ് ‘കഴുതക്കുട്ടി’ എന്ന സ്വാഭാവിക പകരം നൽകുകയും ὀνάριον എല്ലാ സാഹചര്യങ്ങളിലും നിർബന്ധമായും കുഞ്ഞിനെ മാത്രം സൂചിപ്പിക്കുന്നില്ലെന്ന അർത്ഥപരിധി ശരിയായി വിശദീകരിക്കുകയും ചെയ്യുന്നു. അടിക്കുറിപ്പ് അടയാളം [a] യഥാസ്ഥാനത്താണ്.
