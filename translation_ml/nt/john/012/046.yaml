id: JHN.12.46
reference: John 12:46
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐγὼ φῶς εἰς τὸν κόσμον ἐλήλυθα, ἵνα πᾶς ὁ πιστεύων εἰς ἐμὲ ἐν τῇ σκοτίᾳ μὴ μείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/046.yaml
  text: I have come into the world as light[b][a], so that everyone who believes in me may not remain in the darkness.
translation:
  language: ml
  text: എന്നിൽ വിശ്വസിക്കുന്ന ഏവനും ഇരുട്ടിൽ തുടരാതിരിക്കേണ്ടതിന് ഞാൻ വെളിച്ചമായി ലോകത്തിലേക്കു വന്നിരിക്കുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φῶς
  choice: വെളിച്ചമായി
  rationale: ഗ്രീക്കിൽ നിർദേശകപദമില്ലാത്ത φῶς ഇവിടെ ഗുണാത്മകമായി യേശുവിന്റെ സ്വത്വവും ദൗത്യവും സൂചിപ്പിക്കുന്നു. ‘വെളിച്ചമായി’ എന്നത് യോഹന്നാനിലെ മുഖ്യരൂപകം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: εἰς τὸν κόσμον
  choice: ലോകത്തിലേക്കു
  rationale: εἰς ചലനവും ഒരു മണ്ഡലത്തിലേക്കുള്ള പ്രവേശനവും സൂചിപ്പിക്കുന്നതിനാൽ അവതാരപരവും ദൗത്യപരവുമായ അർഥം ഇതിൽ നിലനിൽക്കുന്നു.
- source_word: ἐλήλυθα
  choice: വന്നിരിക്കുന്നു
  rationale: പൂർണകാലരൂപം വന്നതിന്റെ ഇപ്പോഴും നിലനിൽക്കുന്ന ഫലം സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘വന്നിരിക്കുന്നു’ അതിനെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἵνα
  choice: -ാതിരിക്കേണ്ടതിന്
  rationale: ഉദ്ദേശ്യത്തെ സൂചിപ്പിക്കുന്ന ἵναയുടെ പ്രയോജനബലം മലയാളത്തിലെ ഈ ഘടനയിൽ വ്യക്തമായി നിലനിൽക്കുന്നു.
- source_word: πᾶς ὁ πιστεύων
  choice: വിശ്വസിക്കുന്ന ഏവനും
  rationale: ഈ substantival present participle വിശ്വസിക്കുന്ന എല്ലാവരെയും പൊതുവായി സൂചിപ്പിക്കുന്നു. ‘ഏവനും’ വ്യാപ്തി വ്യക്തമാക്കുകയും സ്വാഭാവികമായ ഗൗരവമുള്ള ശൈലി നൽകുകയും ചെയ്യുന്നു.
- source_word: πιστεύων εἰς ἐμέ
  choice: എന്നിൽ വിശ്വസിക്കുന്ന
  rationale: വ്യക്തിയിലേക്കു ദിശാബദ്ധമായ വിശ്വാസത്തെ സൂചിപ്പിക്കുന്ന യോഹന്നാനീയ പ്രയോഗത്തിന് ‘എന്നിൽ വിശ്വസിക്കുക’ എന്നത് സ്ഥിരവും സ്വാഭാവികവുമായ മലയാളമാണ്.
- source_word: ἐν τῇ σκοτίᾳ
  choice: ഇരുട്ടിൽ
  rationale: യോഹന്നാനിലെ നൈതിക-ആത്മീയ മണ്ഡലരൂപകം ‘ഇരുട്ട്’ നിലനിർത്തുന്നു. മലയാളത്തിൽ നിർദേശകപദമില്ലാത്തതിനാൽ ‘ഇരുട്ടിൽ’ തന്നെയാണ് സ്വാഭാവികം; ഗ്രീക്ക് ലേഖത്തിന്റെ ആശയം സന്ദർഭം നൽകുന്നു.
- source_word: μὴ μείνῃ
  choice: തുടരാതിരിക്കേണ്ടതിന്
  rationale: μένω ഒരു അവസ്ഥയിൽ നിലനിൽക്കുകയോ തുടരുകയോ ചെയ്യുന്നതാണ്. നിഷേധത്തോടുകൂടിയ ഉദ്ദേശ്യവാക്യത്തിന്റെ അർഥം ഈ രൂപം വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: യോഹന്നാനീയ വെളിച്ചരൂപകത്തിലെ ക്രിസ്തുവിന്റെ സ്വയംതിരിച്ചറിയൽ
  choice: ‘ഞാൻ വെളിച്ചമായി ലോകത്തിലേക്കു വന്നിരിക്കുന്നു’ എന്നു രൂപകം അതേപടി നിലനിർത്തി.
  alternative: ‘ലോകത്തിനു വെളിച്ചം നൽകാൻ ഞാൻ വന്നു’ എന്ന വ്യാഖ്യാനപരമായ വിവർത്തനം.
  rationale: മൂലവാക്യം യേശുവിനെ വെളിച്ചമായി അവതരിപ്പിക്കുന്നു; വെളിച്ചം നൽകുന്ന ഒരാളായി മാത്രം ചുരുക്കുന്നത് ക്രിസ്തുശാസ്ത്രപരമായ രൂപകത്തെ ദുർബലപ്പെടുത്തും.
- issue: πᾶς ὁ πιστεύων എന്നതിന്റെ വ്യാപ്തി
  choice: ‘എന്നിൽ വിശ്വസിക്കുന്ന ഏവനും’ എന്നു വിവർത്തനം ചെയ്തു.
  alternative: ‘എന്നിൽ വിശ്വസിക്കുന്നവൻ’ എന്നു ഏകവചന പൊതുപ്രയോഗം.
  rationale: ഗ്രീക്ക് വിശ്വസിക്കുന്നവരുടെ സർവസാധാരണ വിഭാഗത്തെ സൂചിപ്പിക്കുന്നു. തിരഞ്ഞെടുപ്പ്, സ്വതന്ത്ര ഇച്ഛ എന്നിവയെക്കുറിച്ചുള്ള പ്രത്യേക സഭാപാരമ്പര്യ നിലപാട് ചേർക്കാതെ അതിന്റെ തുറന്ന വ്യാപ്തി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യക്രമം ഉപയോഗിച്ചു. ‘വെളിച്ചം’, ‘ഇരുട്ട്’ എന്നീ ലളിതവും യോഹന്നാനീയ പ്രതീകഭാരം വഹിക്കുന്നതുമായ പദങ്ങൾ നിലനിർത്തി. പ്രസിദ്ധീകരണവാക്യത്തിൽ അടിക്കുറിപ്പുകൾ ആവശ്യമില്ല; φῶς എന്നതിലെ ഗ്രീക്ക് അനിർദേശിതത്വം മലയാളത്തിൽ പ്രത്യേക അനിർദേശകപദംകൊണ്ട് അടയാളപ്പെടുത്താനാവാത്തതിനാൽ ‘വെളിച്ചമായി’ അതിന്റെ ഗുണാത്മക അർഥം മതിയായ രീതിയിൽ നൽകുന്നു.
