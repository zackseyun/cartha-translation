id: JHN.12.4
reference: John 12:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγει ⸀δὲ ⸂Ἰούδας ὁ Ἰσκαριώτης εἷς τῶν μαθητῶν αὐτοῦ⸃, ὁ μέλλων αὐτὸν παραδιδόναι·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/004.yaml
  text: But Judas Iscariot[a], one of his disciples—the one who was about to betray him—said,
translation:
  language: ml
  text: 'എന്നാൽ, അവന്റെ ശിഷ്യന്മാരിൽ ഒരാളായ, അവനെ ഒറ്റിക്കൊടുക്കാനിരുന്ന യൂദാസ് ഈസ്കര്യോത്ത് പറഞ്ഞു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിൽ ചരിത്രവർത്തമാനകാലമായ ‘പറയുന്നു’ എന്നാണ്; എന്നാൽ തുടർച്ചയായ ആഖ്യാനത്തിൽ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിന് ഭൂതകാലമായ ‘പറഞ്ഞു’ യോജിക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മറിയത്തിന്റെ പ്രവൃത്തിയിൽനിന്ന് യൂദാസിന്റെ എതിർപ്പിലേക്കുള്ള മൃദുവായ വൈരുധ്യവും ആഖ്യാനത്തിലെ തിരിവും സൂചിപ്പിക്കുന്നു.
- source_word: Ἰούδας ὁ Ἰσκαριώτης
  choice: യൂദാസ് ഈസ്കര്യോത്ത്
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതവും ഗ്രീക്ക് നാമരൂപത്തോട് അടുത്തതുമായ ലിപ്യന്തരണം.
- source_word: εἷς τῶν μαθητῶν αὐτοῦ
  choice: അവന്റെ ശിഷ്യന്മാരിൽ ഒരുവൻ
  rationale: μαθητής സൂചിപ്പിക്കുന്ന ഗുരു-ശിഷ്യബന്ധം ‘ശിഷ്യൻ’ കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: ὁ μέλλων
  choice: അവനെ ... കൊടുക്കാനിരുന്നവൻ
  rationale: μέλλωയും അനന്തക്രിയയും ചേർന്ന രൂപത്തിലെ വരാനിരിക്കുന്ന പ്രവൃത്തിയുടെ പ്രതീക്ഷ നിലനിർത്തുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ അനുബന്ധപ്രയോഗമാണ്.
- source_word: παραδιδόναι
  choice: ഒറ്റിക്കൊടുക്കുക
  rationale: παραδίδωμι എന്നതിന് അക്ഷരാർഥത്തിൽ ‘ഏല്പിച്ചുകൊടുക്കുക’ എന്നാകാമെങ്കിലും, യൂദാസിന്റെ പ്രവൃത്തിയുടെ വഞ്ചനാത്മക സ്വഭാവം ഈ സന്ദർഭത്തിൽ ‘ഒറ്റിക്കൊടുക്കുക’ വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: യൂദാസ് യേശുവിനോടു ചെയ്യാനിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന παραδιδόναι എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ഒറ്റിക്കൊടുക്കുക
  alternative: ഏല്പിച്ചുകൊടുക്കുക
  rationale: ‘ഒറ്റിക്കൊടുക്കുക’ ഈ സന്ദർഭത്തിലെ വഞ്ചനയെ വ്യക്തമാക്കുന്നു; അതേസമയം ഗ്രീക്ക് ക്രിയയുടെ വിശാലവും അക്ഷരാർഥപരവുമായ ‘ഏല്പിച്ചുകൊടുക്കുക’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്ക് വാക്യത്തിലെ കർത്താവിനെ ആദ്യം കൊണ്ടുവന്ന് മലയാളത്തിൽ വായനാസൗകര്യം ഉറപ്പാക്കി; അടുത്ത വാക്യത്തിലേക്കു പ്രസംഗം തുടരുന്നതിനാൽ അവസാനം ദ്വിബിന്ദു ഉപയോഗിച്ചു.
