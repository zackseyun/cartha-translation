id: JHN.12.1
reference: John 12:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὁ οὖν Ἰησοῦς πρὸ ἓξ ἡμερῶν τοῦ πάσχα ἦλθεν εἰς Βηθανίαν, ὅπου ἦν ⸀Λάζαρος, ὃν ἤγειρεν ἐκ νεκρῶν ⸀Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/001.yaml
  text: So Jesus came to Bethany six days before the Passover[a], where Lazarus was, whom Jesus had raised from the dead.
translation:
  language: ml
  text: അങ്ങനെ, പെസഹയ്ക്ക് ആറു ദിവസം മുമ്പ് യേശു ബേഥാന്യയിൽ എത്തി. യേശു മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിച്ച ലാസർ അവിടെയുണ്ടായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, അക്ഷരാർഥത്തിൽ, “മരിച്ചവരുടെ ഇടയിൽനിന്ന്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: അങ്ങനെ
  rationale: മുൻസന്ദർഭത്തോടുള്ള ആഖ്യാനബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു; കൂടുതൽ ഔപചാരികമായ ‘അതുകൊണ്ട്’ ഇവിടെ അനാവശ്യമായ കാരണഫലം സൂചിപ്പിക്കാം.
- source_word: πρὸ ἓξ ἡμερῶν τοῦ πάσχα
  choice: പെസഹയ്ക്ക് ആറു ദിവസം മുമ്പ്
  rationale: ഗ്രീക്ക് കാലസൂചനയുടെ സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം; πάσχα യെ യഹൂദോത്സവത്തിന്റെ പതിവുപേരായ ‘പെസഹ’ എന്നു നൽകി.
- source_word: ἦλθεν εἰς Βηθανίαν
  choice: ബേഥാന്യയിൽ എത്തി
  rationale: ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള വരവ് മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു; ‘വന്നു’ എന്നതും സാധ്യമെങ്കിലും ദൃഷ്ടികോണം അനാവശ്യമായി നിർണ്ണയിച്ചേക്കാം.
- source_word: ὅπου ἦν Λάζαρος
  choice: ലാസർ അവിടെയുണ്ടായിരുന്നു
  rationale: ലാസർ അവിടെ താമസിച്ചിരുന്നോ തങ്ങിയിരുന്നോ എന്ന് മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ ലളിതമായ സ്ഥലസാന്നിധ്യം മാത്രം നിലനിർത്തുന്നു.
- source_word: ἤγειρεν
  choice: ഉയിർപ്പിച്ച
  rationale: മരണസന്ദർഭത്തിലെ ἐγείρω എന്ന പദത്തിന്റെ അർഥം സ്വാഭാവികമായി നൽകുകയും സംഭവം യേശുവിന്റെ ഈ വരവിനു മുമ്പുണ്ടായതാണെന്ന് ബന്ധവാക്യഘടന വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ἐκ νεκρῶν
  choice: മരിച്ചവരുടെ ഇടയിൽനിന്ന്
  rationale: ἐκ എന്നതിന്റെയും ബഹുവചനമായ νεκρῶν എന്നതിന്റെയും രൂപഭാവം സുതാര്യമായി നിലനിർത്തുന്നു; ‘മരണത്തിൽനിന്ന്’ എന്ന അമൂർത്തമായ വിവർത്തനം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: ലാസറിനെ ഉയിർപ്പിച്ചവനായി യേശുവിനെ വ്യക്തമായി ആവർത്തിക്കൽ
  choice: യേശു മരിച്ചവരുടെ ഇടയിൽനിന്ന് ഉയിർപ്പിച്ച ലാസർ
  alternative: അവൻ മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിച്ച ലാസർ
  rationale: ബന്ധവാക്യത്തിന്റെ അവസാനം ഗ്രീക്ക് പാഠം Ἰησοῦς എന്ന പേര് വീണ്ടും വ്യക്തമാക്കുന്നതിനാൽ ‘അവൻ’ എന്ന സർവനാമത്തിലേക്ക് ചുരുക്കാതെ യേശുവിന്റെ പേര് നിലനിർത്തുന്നു.
- issue: ἐκ νεκρῶν എന്ന ഉയിർത്തെഴുന്നേൽപ്പുഭാഷ
  choice: മരിച്ചവരുടെ ഇടയിൽനിന്ന്
  alternative: മരിച്ചവരിൽനിന്ന് / മരണത്തിൽനിന്ന്
  rationale: മൂലത്തിലെ ബഹുവചനവും ‘ഇടയിൽനിന്ന്’ എന്ന സാധ്യതയും നിലനിർത്തി, പ്രത്യേകമായ വ്യവസ്ഥാപിത ദൈവശാസ്ത്രവായന ചുമത്തുന്നത് ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ദീർഘമായ ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി രണ്ടുവാക്യങ്ങളാക്കി; ആശയബന്ധവും യേശു എന്ന പേരിന്റെ ആവർത്തനവും സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
