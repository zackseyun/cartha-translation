id: JHN.12.12
reference: John 12:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τῇ ἐπαύριον ⸀ὁ ὄχλος πολὺς ὁ ἐλθὼν εἰς τὴν ἑορτήν, ἀκούσαντες ὅτι ἔρχεται ⸁ὁ Ἰησοῦς εἰς Ἱεροσόλυμα,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/012.yaml
  text: The next day[a], the large crowd that had come to the feast, when they heard that Jesus was coming to Jerusalem[b],
translation:
  language: ml
  text: പിറ്റേന്ന്, പെരുന്നാളിന് വന്നിരുന്ന വലിയ ജനക്കൂട്ടം യേശു യെരൂശലേമിലേക്കു വരുന്നു[a] എന്നു കേട്ടപ്പോൾ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഗ്രീക്കിൽ ആഖ്യാനപരമായ വർത്തമാനകാലമാണ്: “യേശു യെരൂശലേമിലേക്കു വരുന്നു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: പിറ്റേന്ന്
  rationale: കാലക്രമം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി വ്യക്തമാക്കുന്ന ആധുനിക മലയാളപ്രയോഗം.
- source_word: ὁ ὄχλος πολὺς
  choice: വലിയ ജനക്കൂട്ടം
  rationale: ὄχλος എന്നതിന്റെ കൂട്ടജനത എന്ന അർഥവും πολὺς സൂചിപ്പിക്കുന്ന വലുപ്പവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ὁ ἐλθὼν εἰς τὴν ἑορτήν
  choice: പെരുന്നാളിന് വന്നിരുന്ന
  rationale: ആർട്ടിക്കുലാർ പാർട്ടിസിപ്പിൾ ജനക്കൂട്ടത്തെ വിശേഷിപ്പിക്കുന്നു; വന്നിരുന്ന എന്ന രൂപം പ്രധാന സംഭവത്തിനു മുമ്പുള്ള വരവ് സൂചിപ്പിക്കുന്നു. ἑορτήയ്ക്ക് യോഹന്നാനിലെ യെഹൂദ ഉത്സവസന്ദർഭത്തിൽ സ്വാഭാവികമായ പെരുന്നാൾ തിരഞ്ഞെടുത്തു.
- source_word: ἀκούσαντες
  choice: എന്നു കേട്ടപ്പോൾ
  rationale: ഏകവചനത്തിലുള്ള കൂട്ടനാമത്തിൽനിന്ന് അതിലെ ആളുകളെ സൂചിപ്പിക്കുന്ന ബഹുവചന പാർട്ടിസിപ്പിലേക്കുള്ള ഗ്രീക്ക് മാറ്റം മലയാളത്തിൽ സന്ദർഭസഹജമായി ഗ്രഹിക്കപ്പെടുന്നു; കാലബന്ധം കേട്ടപ്പോൾ വ്യക്തമാക്കുന്നു.
- source_word: ὅτι ἔρχεται
  choice: വരുന്നു എന്നു
  rationale: ἔρχεται എന്ന ചരിത്രവർത്തമാനത്തെ അതേ വർത്തമാനരൂപത്തിൽ നിലനിർത്തി ആഖ്യാനത്തിന്റെ സജീവത സംരക്ഷിക്കുന്നു.
- source_word: ὁ Ἰησοῦς
  choice: യേശു
  rationale: വ്യക്തിനാമത്തിന്റെ പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണം.
- source_word: εἰς Ἱεροσόλυμα
  choice: യെരൂശലേമിലേക്കു
  rationale: ചലനത്തിന്റെ ലക്ഷ്യം സൂചിപ്പിക്കുന്ന εἰς എന്നതിനെ സ്വാഭാവികമായ ലക്ഷ്യവിഭക്തിയോടെ പരിഭാഷപ്പെടുത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വാക്യം അടുത്ത വാക്യത്തിലേക്കു തുടരുന്നതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തി. ‘പെരുന്നാൾ’ എന്നത് ഇവിടെ ἑορτήയുടെ ഉത്സവസന്ദർഭം സ്വാഭാവികമായി നൽകുന്നു; ആവശ്യമില്ലാത്ത പര്യായക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
