- source_word: βροντὴν γεγονέναι
  choice: ഇടിമുഴക്കം ഉണ്ടായതാണ്
  rationale: ‘ഇടിമുഴക്കം സംഭവിച്ചിരിക്കുന്നു/ഉണ്ടായിരിക്കുന്നു’ എന്ന ഗ്രീക്ക് ഘടനയോട് അടുത്തുനിൽക്കുകയും മലയാളത്തിൽ വ്യക്തമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: ἄλλοι
  choice: മറ്റുള്ളവർ
  rationale: ജനക്കൂട്ടത്തിനുള്ളിലെ രണ്ടാമത്തെ വിഭാഗത്തെ ആദ്യ വിഭാഗത്തോട് വിപരീതമായി കാണിക്കുന്നു.
- source_word: Ἄγγελος
  choice: ഒരു ദൂതൻ
  rationale: സ്വർഗീയശബ്ദത്തെക്കുറിച്ചുള്ള ജനങ്ങളുടെ വ്യാഖ്യാനമാണ് സന്ദർഭം; ‘ദൂതൻ’ അതിമാനുഷിക സന്ദേശവാഹകനെ സൂചിപ്പിക്കാൻ മലയാളത്തിൽ യോജിച്ചതാണ്, എന്നാൽ പദത്തിന്റെ സന്ദേശവാഹകഭാവവും പൂർണമായി ഇല്ലാതാക്കുന്നില്ല.
- source_word: αὐτῷ
  choice: അവനോടു
  rationale: λαλέω-യോടൊപ്പമുള്ള ദാതൃവിഭക്തിയെ സ്വാഭാവികമായി നൽകുന്നു; സന്ദർഭത്തിൽ ‘അവൻ’ യേശുവാണ്.
- source_word: λελάληκεν
  choice: സംസാരിച്ചിരിക്കുന്നു
  rationale: പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ പ്രസക്തി സൂചിപ്പിക്കുന്ന പൂർണ്ണകാലത്തിന്റെ ബലം മലയാളത്തിൽ നിലനിർത്തുന്നു.
