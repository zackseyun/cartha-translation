source:
  edition: SBLGNT
  text: ὁ οὖν ὄχλος ὁ ἑστὼς καὶ ἀκούσας ἔλεγεν βροντὴν γεγονέναι· ἄλλοι ἔλεγον· Ἄγγελος αὐτῷ λελάληκεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/029.yaml
  text: So the crowd that was standing there and had heard it was saying that thunder had happened; others were saying[a], “An angel has spoken to him.”
translation:
  language: ml
  text: അതുകൊണ്ട്, അവിടെ നിന്നിരുന്ന ജനക്കൂട്ടം അതു കേട്ടശേഷം, “ഇടിമുഴക്കം ഉണ്ടായിട്ടുണ്ടെന്ന്”[a] പറഞ്ഞുകൊണ്ടിരുന്നു. മറ്റുള്ളവർ, “ഒരു ദൂതൻ അവനോടു സംസാരിച്ചിരിക്കുന്നു” എന്നു പറഞ്ഞുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, കൂടുതൽ ചൊല്ലുവഴക്കമായി: “ഇടിമുഴങ്ങിയെന്ന്.”'
    reason: βροντὴν γεγονέναι എന്ന പ്രയോഗത്തിന്റെ കൂടുതൽ സ്വാഭാവികമായ മലയാളരൂപം നൽകുന്നു.
lexical_decisions:
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യത്തിലെ സ്വർഗീയശബ്ദത്തോടുള്ള ജനക്കൂട്ടത്തിന്റെ പ്രതികരണത്തെ ബന്ധിപ്പിക്കുന്ന ആഖ്യാനബന്ധം നിലനിർത്തുന്നു.
- source_word: ὄχλος
  choice: ജനക്കൂട്ടം
  rationale: ഒത്തുകൂടിയ ജനസമൂഹം എന്ന യോഹന്നാനിലെ സാധാരണ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
