  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἵνα ὁ λόγος Ἠσαΐου τοῦ προφήτου πληρωθῇ ὃν εἶπεν· Κύριε, τίς ἐπίστευσεν τῇ ἀκοῇ ἡμῶν; καὶ ὁ βραχίων κυρίου τίνι ἀπεκαλύφθη;
base_translation:
  language: en
  yaml_path: translation/nt/john/012/038.yaml
  text: 'so that the word of Isaiah the prophet might be fulfilled[a], which he said: “Lord, who has believed our report? And to whom has the arm of the Lord been revealed?”'
translation:
  language: ml
  text: 'അങ്ങനെ, യെശയ്യാ പ്രവാചകൻ പറഞ്ഞ വചനം നിറവേറേണ്ടതിന്:


    “കർത്താവേ, ഞങ്ങളുടെ സന്ദേശം[a] വിശ്വസിച്ചത് ആർ?


    കർത്താവിന്റെ ഭുജം ആർക്ക് വെളിപ്പെട്ടു?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഞങ്ങൾ കേട്ടത്” എന്നോ “ഞങ്ങളുടെ വാർത്ത” എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: ἀκοή എന്ന പദത്തിന് കേൾവി, കേട്ട കാര്യം, അറിയിച്ച വാർത്ത/സന്ദേശം എന്നീ അർഥസാധ്യതകളുണ്ട്.
lexical_decisions:
- source_word: ἵνα
  choice: അങ്ങനെ ... നിറവേറേണ്ടതിന്
  rationale: മുൻവാക്യത്തിലെ അവിശ്വാസവുമായി ഈ വാക്യത്തെ ബന്ധിപ്പിക്കുന്ന ഗ്രീക്ക് ഉദ്ദേശ്യ/ഫല സൂചന നിലനിർത്തുന്നു; അതിനെ ഉദ്ദേശ്യമെന്നോ ഫലമെന്നോ മാത്രം തീർപ്പാക്കുന്നില്ല.
- source_word: ὁ λόγος Ἠσαΐου τοῦ προφήτου
  choice: യെശയ്യാ പ്രവാചകൻ പറഞ്ഞ വചനം
  rationale: ഉദ്ധരണി-നിവൃത്തി പ്രയോഗത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളം; λόγος എന്നതിന്റെ ‘വചനം’ എന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: πληρωθῇ
  choice: നിറവേറേണ്ടതിന്
  rationale: ἵνα-യോടുകൂടിയ aorist passive subjunctive-ന്റെ നിവൃത്തി ആശയവും passive അർഥവും മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: κύριος എന്ന പദത്തിന്റെ സംബോധനരൂപം; തിരുവെഴുത്തിലെ അഭിസംബോധനയ്ക്ക് യോജിക്കുന്നു.
- source_word: τίς ἐπίστευσεν τῇ ἀκοῇ ἡμῶν
  choice: ഞങ്ങൾ അറിയിച്ച സന്ദേശം വിശ്വസിച്ചത് ആർ?
  rationale: ἀκοή ഇവിടെ കേൾപ്പിക്കപ്പെട്ട വാർത്തയെയോ സന്ദേശത്തെയോ സൂചിപ്പിക്കാം. മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ ‘ഞങ്ങൾ അറിയിച്ച സന്ദേശം’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; യഥാർഥ പദാർഥസാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: ὁ βραχίων κυρίου
  choice: കർത്താവിന്റെ ഭുജം
  rationale: ദൈവിക ശക്തിയെയും പ്രവർത്തനത്തെയും സൂചിപ്പിക്കുന്ന തിരുവെഴുത്തിലെ രൂപകം വ്യാഖ്യാനിച്ച് മാറ്റാതെ അതേപടി നിലനിർത്തുന്നു.
- source_word: τίνι ἀπεκαλύφθη
  choice: ആർക്ക് വെളിപ്പെട്ടു?
  rationale: ഗ്രീക്കിലെ passive അർഥവും വാചാടോപചോദ്യത്തിന്റെ ശക്തിയും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: നിവൃത്തി ഭാഷയിലെ ദൈവിക ഉദ്ദേശ്യവും ഫലവും
  choice: ‘അങ്ങനെ ... നിറവേറേണ്ടതിന്’ എന്ന് പരിഭാഷപ്പെടുത്തി ഉദ്ദേശ്യം/ഫലം എന്ന ഇരട്ടസാധ്യത തുറന്നുവെച്ചു.
  alternative: ‘അങ്ങനെ ... നിറവേറി’ അല്ലെങ്കിൽ ‘... നിറവേറുക എന്ന ഉദ്ദേശ്യത്തോടെ’
  rationale: യോഹന്നാന്റെ ἵνα പ്രയോഗം ഉദ്ദേശ്യത്തിന്റെയും ഫലത്തിന്റെയും സൂചന വഹിക്കാം. ഏതെങ്കിലും ഒറ്റ വ്യാഖ്യാനം നിർബന്ധിക്കാതെ ഗ്രീക്ക് വാക്യത്തിന്റെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്ക് നിലനിർത്തുന്നു.
- issue: യെശയ്യാ ഉദ്ധരണിയിലെ ἀκοή എന്ന പദത്തിന്റെ അർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘ഞങ്ങൾ അറിയിച്ച സന്ദേശം’
  alternative: ‘ഞങ്ങൾ കേട്ടത്’ അല്ലെങ്കിൽ ‘ഞങ്ങളുടെ വാർത്ത’
  rationale: ഈ പദം കേൾവിയെയോ കേട്ട/അറിയിച്ച ഉള്ളടക്കത്തെയോ സൂചിപ്പിക്കാം. സന്ദേശത്തിന്റെ അർഥം സന്ദർഭത്തിന് ഏറ്റവും യോജിച്ചതായതിനാൽ മുഖ്യപാഠത്തിൽ ഉപയോഗിച്ചു; മറ്റുസാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വചനം,’ ‘കർത്താവ്,’ ‘ഭുജം’ എന്നീ പരിചിതമായ തിരുവെഴുത്തുപദങ്ങൾ നിലനിർത്തിയപ്പോൾ, ചോദ്യങ്ങളുടെ വാക്യഘടന സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാക്കി.
