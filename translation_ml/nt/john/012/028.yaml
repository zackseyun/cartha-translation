id: JHN.12.28
reference: John 12:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πάτερ, δόξασόν σου τὸ ὄνομα. ἦλθεν οὖν φωνὴ ἐκ τοῦ οὐρανοῦ· Καὶ ἐδόξασα καὶ πάλιν δοξάσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/028.yaml
  text: 'Father[a], glorify your name. Then a voice came from heaven: “I have glorified it, and I will glorify it again.”'
translation:
  language: ml
  text: '“പിതാവേ, അങ്ങയുടെ നാമത്തെ മഹത്വപ്പെടുത്തണമേ.” അപ്പോൾ സ്വർഗത്തിൽനിന്ന് ഒരു ശബ്ദം വന്നു: “ഞാൻ അതിനെ മഹത്വപ്പെടുത്തിയിരിക്കുന്നു; വീണ്ടും മഹത്വപ്പെടുത്തും.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: “ഞാൻ അതിനെ മഹത്വപ്പെടുത്തി; വീണ്ടും മഹത്വപ്പെടുത്തും.”'
    reason: ἐδόξασα എന്ന aorist ക്രിയയെ ലളിതമായ ഭൂതകാലത്തിൽ നൽകാവുന്ന പദാനുപദപരമായ മറ്റൊരു വിവർത്തനം.
lexical_decisions:
- source_word: πάτερ
  choice: പിതാവേ
  rationale: ദൈവത്തോടുള്ള നേരിട്ടുള്ള സംബോധനയാണ്. ഗ്രീക്കിൽ ‘എന്റെ’ എന്ന ഉടമസ്ഥസൂചകം ഇല്ലാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല.
- source_word: δόξασόν
  choice: മഹത്ത്വപ്പെടുത്തണമേ
  rationale: δοξάζω എന്ന ക്രിയയുടെ യോഹന്നാനീയ മഹത്ത്വഭാഷ നിലനിർത്തുന്നു. പ്രാർഥനാരൂപത്തിലുള്ള ആജ്ഞയെ സ്വാഭാവികവും ആദരപൂർവവുമായി മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: σου τὸ ὄνομα
  choice: അങ്ങയുടെ നാമത്തെ
  rationale: ദൈവത്തിന്റെ വെളിപ്പെട്ട സ്വഭാവവും കീർത്തിയും ഉൾക്കൊള്ളുന്ന ‘നാമം’ എന്ന ബൈബിൾസങ്കൽപ്പം പരാവർത്തനം ചെയ്യാതെ നിലനിർത്തുന്നു.
- source_word: ἦλθεν οὖν
  choice: അപ്പോൾ ... വന്നു
  rationale: οὖν ഇവിടെ വിവരണത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്നു; ‘അപ്പോൾ’ ആ പ്രവാഹം സ്വാഭാവികമായി നൽകുന്നു. ἦλθεν എന്നതിന്റെ ചലനരൂപം ‘വന്നു’ എന്നതിൽ നിലനിൽക്കുന്നു.
- source_word: φωνὴ
  choice: ഒരു ശബ്ദം
  rationale: തുടർന്നുള്ള നേരിട്ടുള്ള വാക്കുകൾ ഇത് അർഥമുള്ള ശബ്ദമാണെന്ന് വ്യക്തമാക്കുന്നു; ‘ശബ്ദം’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: സ്വർഗത്തിൽനിന്ന്
  rationale: ശബ്ദത്തിന്റെ ദൈവിക ഉത്ഭവം സൂചിപ്പിക്കുന്ന സന്ദർഭോചിതമായ വിവർത്തനം.
- source_word: Καὶ ἐδόξασα καὶ πάλιν δοξάσω
  choice: ഞാൻ അതിനെ മഹത്ത്വപ്പെടുത്തിയിരിക്കുന്നു; വീണ്ടും മഹത്ത്വപ്പെടുത്തുകയും ചെയ്യും
  rationale: ആദ്യത്തെ aorist ക്രിയയുടെ പൂർത്തിയായ പ്രവൃത്തിയും ഇപ്പോഴത്തെ പ്രസക്തിയും ‘മഹത്ത്വപ്പെടുത്തിയിരിക്കുന്നു’ വ്യക്തമാക്കുന്നു. ‘അതിനെ’ എന്നത് മുൻപുള്ള ‘നാമത്തെ’ സൂചിപ്പിക്കുന്നു. πάλιν ഭാവിക്രിയയോടു ചേർത്ത് ‘വീണ്ടും’ എന്നു നൽകി.
theological_decisions:
- issue: ദൈവിക മറുപടിയിലെ പ്രസ്താവിക്കാത്ത കർമത്തിന്റെ സൂചിതവിഷയം
  choice: ‘അതിനെ’ ചേർത്ത് ‘അങ്ങയുടെ നാമത്തെ’ സൂചിപ്പിച്ചു
  alternative: കർമം പറയാതെ ‘ഞാൻ മഹത്ത്വപ്പെടുത്തി; വീണ്ടും മഹത്ത്വപ്പെടുത്തും’ എന്നു നൽകുക
  rationale: ഗ്രീക്കിൽ കർമം സന്ദർഭത്തിൽനിന്ന് മനസ്സിലാകുന്നതിനാൽ പ്രസ്താവിച്ചിട്ടില്ല. മലയാളത്തിൽ ‘അതിനെ’ ചേർക്കുന്നത് പിതാവ് തന്റെ നാമത്തെക്കുറിച്ചാണ് പറയുന്നതെന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- issue: യോഹന്നാനിലെ ദൈവശാസ്ത്രപരമായി പ്രാധാന്യമുള്ള δοξάζω
  choice: മഹത്ത്വപ്പെടുത്തുക
  alternative: ബഹുമാനിക്കുക; മഹിമ വെളിപ്പെടുത്തുക
  rationale: പിതാവിനെയും പുത്രനെയും ബന്ധിപ്പിക്കുന്ന യോഹന്നാന്റെ മഹത്ത്വഭാഷയുമായുള്ള പദബന്ധം ഇത് കാത്തുസൂക്ഷിക്കുന്നു; ‘ബഹുമാനിക്കുക’ എന്നത് അർഥത്തെ ദുർബലമാക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ആദരപൂർവവും ഗൗരവമുള്ളതുമായ ശൈലി. ദൈവത്തെ അഭിസംബോധന ചെയ്യാൻ ‘അങ്ങയുടെ’ ഉപയോഗിച്ചു; ഗ്രീക്കിൽ ഇല്ലാത്ത ‘എന്റെ’ ചേർത്തിട്ടില്ല. അടിക്കുറിപ്പ് അതുമായി ബന്ധപ്പെട്ട ദൈവിക മറുപടിയുടെ അവസാനം തന്നെയാണ് അടയാളപ്പെടുത്തിയിരിക്കുന്നത്.
