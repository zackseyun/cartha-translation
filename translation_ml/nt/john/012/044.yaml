source:
  edition: SBLGNT
  text: Ἰησοῦς δὲ ἔκραξεν καὶ εἶπεν· Ὁ πιστεύων εἰς ἐμὲ οὐ πιστεύει εἰς ἐμὲ ἀλλὰ εἰς τὸν πέμψαντά με,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/044.yaml
  text: But Jesus cried out and said[a], “The one who believes in me does not believe in me[b], but in the one who sent me,”
translation:
  language: ml
  text: 'എന്നാൽ യേശു ഉച്ചത്തിൽ വിളിച്ചുപറഞ്ഞു: “എന്നിൽ വിശ്വസിക്കുന്നവൻ[a] എന്നിലല്ല[b], എന്നെ അയച്ചവനിലാണ് വിശ്വസിക്കുന്നത്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്നിൽ വിശ്വസിക്കുന്ന ഏവനും.”
    reason: lexical_alternative
  - marker: b
    text: യേശു വിശ്വാസത്തിന്റെ യഥാർഥ വിഷയമാണെന്നത് ഇത് നിഷേധിക്കുന്നില്ല; അവനിൽ വിശ്വസിക്കുന്നത് അവനെ അയച്ച പിതാവിൽ വിശ്വസിക്കുന്നതിൽനിന്ന് വേർപെടുത്താനാവില്ലെന്നാണ് ഇതിന്റെ ആശയം.
    reason: cross_reference
lexical_decisions:
- source_word: ἔκραξεν καὶ εἶπεν
  choice: ഉച്ചത്തിൽ വിളിച്ചുപറഞ്ഞു
  rationale: κράζω ഉച്ചത്തിലുള്ള പരസ്യപ്രഖ്യാപനത്തെ സൂചിപ്പിക്കുന്നു; തുടർന്ന് വരുന്ന εἶπεν-ഉം മലയാളത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്ന പ്രയോഗമാണ് ‘ഉച്ചത്തിൽ വിളിച്ചുപറഞ്ഞു’.
- source_word: Ὁ πιστεύων
  choice: വിശ്വസിക്കുന്നവൻ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ വർത്തമാനകാല കൃദന്തത്തിന്റെ പൊതുവായ വ്യക്തിസൂചന മലയാളത്തിൽ സ്വാഭാവികമായും സംക്ഷിപ്തമായും നിലനിർത്തുന്നു.
- source_word: πιστεύων / πιστεύει
  choice: വിശ്വസിക്കുന്നവൻ / വിശ്വസിക്കുന്നു
  rationale: πιστεύω εἰς എന്ന യോഹന്നാനീയ പ്രയോഗത്തിന് ‘...യിൽ വിശ്വസിക്കുക’ എന്നത് സ്ഥാപിതവും സ്വാഭാവികവുമായ തുല്യപ്രയോഗമാണ്; മൂലത്തിലെ ആവർത്തനവും ഇതിലൂടെ നിലനിൽക്കുന്നു.
- source_word: εἰς ἐμέ
  choice: എന്നിൽ
  rationale: πιστεύω-യോടൊപ്പമുള്ള εἰς വ്യക്തിയിലേക്കു തിരിയുന്ന വിശ്വാസത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘എന്നിൽ’ അതിന്റെ സ്വാഭാവിക രൂപമാണ്.
- source_word: ἀλλὰ εἰς τὸν πέμψαντά με
  choice: എന്നെ അയച്ചവനിലാണ്
  rationale: ἀλλά സൂചിപ്പിക്കുന്ന ഊന്നിയ വൈരുധ്യം ‘-ലാണ്’ എന്ന ഘടനയിലൂടെ വ്യക്തമാകുന്നു; ‘പിതാവ്’ എന്ന് വ്യാഖ്യാനിച്ച് ചേർക്കാതെ കൃദന്തരൂപത്തിലെ പരോക്ഷസൂചന നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭത്തിൽനിന്നുള്ള നേരിയ മാറ്റവും വൈരുധ്യവും മലയാളത്തിൽ സ്വാഭാവികമായി അടയാളപ്പെടുത്തുന്നു.
theological_decisions:
- issue: ‘എന്നിൽ വിശ്വസിക്കുന്നവൻ എന്നിലല്ല ... വിശ്വസിക്കുന്നത്’ എന്ന വാക്കുകൾ യേശു വിശ്വാസത്തിന്റെ യഥാർഥ വിഷയമല്ലെന്ന് തെറ്റിദ്ധരിക്കപ്പെടാം.
  choice: ‘മാത്രം’ പോലുള്ള വിശദീകരണപദം ചേർക്കാതെ മൂലപാഠത്തിലെ സംഘർഷമുള്ള പ്രസ്താവന നിലനിർത്തി; അതിന്റെ അർഥസൂചന അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
  alternative: ‘എന്നിൽ മാത്രം അല്ല’ എന്ന് പരിഭാഷപ്പെടുത്തുക, അല്ലെങ്കിൽ മുഖ്യപാഠത്തിൽ ‘പിതാവിൽ’ എന്ന് വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്കിൽ ‘മാത്രം’ ഇല്ല. അത് ചേർക്കുന്നത് വാക്യത്തിലെ യഥാർഥ വാചക-ദൈവശാസ്ത്ര സംഘർഷം മുൻകൂട്ടി പരിഹരിക്കും. യേശുവിലുള്ള വിശ്വാസവും അവനെ അയച്ചവനിലുള്ള വിശ്വാസവും വേർപെടുത്താനാവില്ലെന്ന ബന്ധമാണ് പ്രസ്താവന മുന്നോട്ടുവയ്ക്കുന്നത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. മൂലത്തിലെ ഗൗരവമുള്ള പരസ്യപ്രഖ്യാപനസ്വരം ‘ഉച്ചത്തിൽ വിളിച്ചുപറഞ്ഞു’ എന്നതിലൂടെ നിലനിർത്തി; ദൈവശാസ്ത്രപരമായ സംഘർഷം മുഖ്യപാഠത്തിൽ ലഘൂകരിച്ചിട്ടില്ല.
