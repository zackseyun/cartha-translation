  rationale: The revision corrects the purpose syntax, updates the imperative to natural modern standard Malayalam, and more cleanly reflects the Greek narrative sequence. It preserves the source’s masculine υἱοί in the main text, the alternative idiomatic inclusive rendering in the footnote, and the ambiguity-free contextual rendering of ἐκρύβη as ‘he hid himself/he hid.’
