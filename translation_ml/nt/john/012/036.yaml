- from: വെളിച്ചം നിങ്ങൾക്കുള്ളപ്പോൾ, വെളിച്ചത്തിൽ വിശ്വസിക്കുവിൻ; അങ്ങനെ നിങ്ങൾ വെളിച്ചത്തിന്റെ പുത്രന്മാരായിത്തീരട്ടെ.[a] യേശു ഇക്കാര്യങ്ങൾ പറഞ്ഞശേഷം അവിടംവിട്ട് അവരിൽനിന്നു മറഞ്ഞു.
