  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ὡς τὸ φῶς ἔχετε, πιστεύετε εἰς τὸ φῶς, ἵνα υἱοὶ φωτὸς γένησθε. Ταῦτα ⸀ἐλάλησεν Ἰησοῦς, καὶ ἀπελθὼν ἐκρύβη ἀπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/036.yaml
  text: While you have the light[a], believe in the light, so that you may become sons of light. Jesus spoke these things[b], and he departed and hid from them.
translation:
  language: ml
  text: വെളിച്ചം നിങ്ങൾക്കുള്ളപ്പോൾ, വെളിച്ചത്തിൽ വിശ്വസിക്കൂ; നിങ്ങൾ വെളിച്ചത്തിന്റെ പുത്രന്മാരായിത്തീരേണ്ടതിന്.[a] യേശു ഇവ പറഞ്ഞു; അവിടംവിട്ട് അവരിൽനിന്ന് മറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വെളിച്ചത്തിന്റെ മക്കളായിത്തീരേണ്ടതിന്.” “വെളിച്ചത്തിന്റെ പുത്രന്മാർ” എന്നത് വെളിച്ചത്തിന്റെ സ്വഭാവമുള്ളവരെ സൂചിപ്പിക്കുന്ന ഒരു പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς τὸ φῶς ἔχετε
  choice: വെളിച്ചം നിങ്ങൾക്കുള്ളപ്പോൾ
  rationale: ὡς എന്നതിന്റെ കാലസൂചക അർഥവും വെളിച്ചം ലഭ്യമായിരിക്കുന്ന സമയത്തെ അടിയന്തരതയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: πιστεύετε εἰς τὸ φῶς
  choice: വെളിച്ചത്തിൽ വിശ്വസിക്കുവിൻ
  rationale: യോഹന്നാനിലെ πιστεύω εἰς പ്രയോഗത്തിന്റെ നേരിട്ടുള്ള വിശ്വാസാഹ്വാനം വ്യാഖ്യാനപരമായ വിപുലീകരണമില്ലാതെ സംരക്ഷിക്കുന്നു.
- source_word: ἵνα ... γένησθε
  choice: അങ്ങനെ ... ആയിത്തീരട്ടെ
  rationale: ἵνα സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യ/ഫലബന്ധവും γίνομαιയിലെ ആയിത്തീരുക എന്ന ചലനാത്മക അർഥവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: υἱοὶ φωτός
  choice: വെളിച്ചത്തിന്റെ പുത്രന്മാർ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചനമായ υἱοί എന്ന രൂപവും, വെളിച്ചത്താൽ സ്വഭാവം നിർണയിക്കപ്പെടുന്നവർ എന്ന സെമിറ്റിക് പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: Ταῦτα ἐλάλησεν Ἰησοῦς
  choice: യേശു ഇക്കാര്യങ്ങൾ പറഞ്ഞശേഷം
  rationale: ταῦτα എന്ന ബഹുവചന സൂചനയും തുടർന്നുള്ള പ്രവൃത്തിയിലേക്കുള്ള സ്വാഭാവിക ആഖ്യാനബന്ധവും മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀπελθὼν ἐκρύβη ἀπ’ αὐτῶν
  choice: അവിടംവിട്ട് അവരിൽനിന്നു മറഞ്ഞു
  rationale: ആദ്യം സ്ഥലംവിട്ടതും തുടർന്ന് അവരിൽനിന്ന് മറഞ്ഞതുമായ ക്രമം സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു; ἐκρύβηയുടെ സന്ദർഭോചിതമായ മധ്യമാർഥവും പ്രതിഫലിക്കുന്നു.
theological_decisions:
- issue: υἱοὶ φωτός എന്ന ലിംഗസൂചക കുടുംബപ്രയോഗം
  choice: വെളിച്ചത്തിന്റെ പുത്രന്മാർ
  alternative: വെളിച്ചത്തിന്റെ മക്കൾ
  rationale: മൂലത്തിലെ ‘പുത്രന്മാർ’ എന്ന പുല്ലിംഗരൂപം പ്രധാനവാചകത്തിൽ സംരക്ഷിക്കുന്നു; അതേസമയം ഈ പ്രയോഗം വെളിച്ചത്താൽ സവിശേഷത പ്രാപിക്കുന്ന എല്ലാവരെയും സൂചിപ്പിക്കാമെന്ന ഉൾക്കൊള്ളുന്ന അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: πιστεύω εἰς എന്ന യോഹന്നാനീയ വിശ്വാസപ്രയോഗം
  choice: വെളിച്ചത്തിൽ വിശ്വസിക്കുവിൻ
  alternative: വെളിച്ചത്തിൽ ആശ്രയിക്കുവിൻ
  rationale: ‘വിശ്വസിക്കുക’ എന്നത് മൂലപ്രയോഗത്തിന്റെ മതശാസ്ത്രപരമായ വ്യാപ്തി നിലനിർത്തുന്നു; ‘ആശ്രയിക്കുക’ മാത്രം ഉപയോഗിക്കുന്നത് വിശ്വാസത്തിന്റെ അർഥത്തെ അനാവശ്യമായി ചുരുക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആജ്ഞാരൂപവും ആഖ്യാനശൈലിയും ഉപയോഗിച്ചു. യോഹന്നാനിലെ ആവർത്തിതമായ ‘വെളിച്ചം’ എന്ന ദൈവശാസ്ത്രപ്രതീകം പരാവർത്തനം ചെയ്യാതെ അതേപടി നിലനിർത്തി.
