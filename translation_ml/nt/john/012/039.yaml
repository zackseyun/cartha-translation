id: JHN.12.39
reference: John 12:39
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διὰ τοῦτο οὐκ ἠδύναντο πιστεύειν ὅτι πάλιν εἶπεν Ἠσαΐας·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/039.yaml
  text: 'For this reason they were not able to believe, because Isaiah said again:'
translation:
  language: ml
  text: 'ഇക്കാരണത്താൽ അവർക്കു വിശ്വസിക്കാൻ കഴിഞ്ഞില്ല; കാരണം യെശയ്യാവ് വീണ്ടും ഇങ്ങനെ പറഞ്ഞു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: ഇക്കാരണത്താൽ
  rationale: മുൻസന്ദർഭവുമായി വ്യക്തമായ കാരണബന്ധം നിലനിർത്തുന്നു; കേവലം നിഗമനം സൂചിപ്പിക്കുന്ന പ്രയോഗത്തെക്കാൾ ഗ്രീക്കിലെ διά + accusative എന്ന ഘടനയുടെ കാരണാർഥം വ്യക്തമാക്കുന്നു.
- source_word: οὐκ ἠδύναντο
  choice: അവർക്കു ... കഴിഞ്ഞില്ല
  rationale: δύναμαι എന്ന ക്രിയയുടെ അപൂർണഭൂതകാലരൂപം സൂചിപ്പിക്കുന്ന കഴിവില്ലായ്മ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; ‘വിശ്വസിച്ചില്ല’ എന്നു മൃദൂകരിക്കുന്നില്ല.
- source_word: πιστεύειν
  choice: വിശ്വസിക്കാൻ
  rationale: യോഹന്നാന്റെ രചനയിലെ πιστεύω എന്ന ക്രിയയുടെ പതിവായ അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: ὅτι
  choice: കാരണം
  rationale: തുടർന്നുവരുന്ന യെശയ്യാവിന്റെ വചനത്തെ അവരുടെ വിശ്വസിക്കാനാവായ്മയുടെ കാരണവുമായി ബന്ധിപ്പിക്കുന്ന causal force സംരക്ഷിക്കുന്നു.
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: മുൻ ഉദ്ധരണിക്കു പിന്നാലെ യെശയ്യാവിൽനിന്നുള്ള മറ്റൊരു ഉദ്ധരണം വരുന്നതായി നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: εἶπεν
  choice: ഇങ്ങനെ പറഞ്ഞു
  rationale: ഉദ്ധരണി പരിചയപ്പെടുത്തുന്ന മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗം; ‘ഇങ്ങനെ’ വരാനിരിക്കുന്ന വചനത്തിലേക്കുള്ള ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: Ἠσαΐας
  choice: യെശയ്യാവ്
  rationale: മലയാള ബൈബിൾ വായനക്കാർക്കു പരിചിതമായ, ആധുനികമായി അംഗീകരിക്കപ്പെട്ട പേരുരൂപം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: വിശ്വസിക്കാനുള്ള കഴിവില്ലായ്മയുടെ സ്വഭാവം
  choice: ‘അവർക്കു വിശ്വസിക്കാൻ കഴിഞ്ഞില്ല’ എന്ന് കഴിവില്ലായ്മ നേരിട്ട് നിലനിർത്തി.
  alternative: ‘അവർ വിശ്വസിച്ചില്ല’ അല്ലെങ്കിൽ ‘അവർ വിശ്വസിക്കാൻ തയ്യാറായില്ല’ എന്നു പറയുക.
  rationale: ഗ്രീക്ക് പാഠം കേവലമായ അവിശ്വാസമോ മനസ്സില്ലായ്മയോ അല്ല, കഴിവില്ലായ്മയാണ് പ്രസ്താവിക്കുന്നത്. എന്നാൽ അത് എങ്ങനെ പ്രവർത്തിക്കുന്നു എന്നതിനെ പ്രത്യേക ദൈവശാസ്ത്ര വ്യവസ്ഥയിലൂടെ വിശദീകരിക്കാതെ പാഠത്തിലെ സംഘർഷം അതേപടി സംരക്ഷിക്കുന്നു.
- issue: ὅτι എന്നതിന്റെ ബന്ധം
  choice: കാരണാർഥത്തിൽ ‘കാരണം’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: വെറും വിശദീകരണാത്മകമായി ‘എന്തെന്നാൽ’ എന്നോ ഉള്ളടക്കസൂചകമായി ‘എന്ന്’ എന്നോ നൽകുക.
  rationale: സന്ദർഭത്തിൽ തുടർന്നുള്ള യെശയ്യാ ഉദ്ധരണം വിശ്വസിക്കാനാവായ്മയുടെ കാരണം വിശദീകരിക്കുന്നതായി വായിക്കപ്പെടുന്നു; അതേസമയം കൂടുതൽ വ്യാഖ്യാനവിവരണം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവുമായ മലയാളം. മൂലത്തിലെ കാരണബന്ധവും കഴിവില്ലായ്മയും വ്യക്തമായി സൂക്ഷിച്ചിരിക്കുന്നു. തുടർന്നുള്ള ഉദ്ധരണിയെ പരിചയപ്പെടുത്താൻ അവസാനത്തിൽ ദ്വിബിന്ദു നിലനിർത്തി.
