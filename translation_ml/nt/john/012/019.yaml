id: JHN.12.19
reference: John 12:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ οὖν Φαρισαῖοι εἶπαν πρὸς ἑαυτούς· Θεωρεῖτε ὅτι οὐκ ὠφελεῖτε οὐδέν· ἴδε ὁ ⸀κόσμος ὀπίσω αὐτοῦ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/019.yaml
  text: So the Pharisees said to one another[a], “You see that you are accomplishing nothing. Look—the world has gone after him.”
translation:
  language: ml
  text: 'അതിനാൽ പരീശന്മാർ പരസ്പരം പറഞ്ഞു: “നിങ്ങളെക്കൊണ്ട് ഒന്നും സാധിക്കുന്നില്ലെന്ന് നിങ്ങൾ കാണുന്നല്ലോ. നോക്കൂ—ലോകം[a] അവന്റെ പിന്നാലെ പോയിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “എല്ലാവരും അവന്റെ പിന്നാലെ പോയിരിക്കുന്നു.” ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “ലോകം” എന്നാണ്; ഇവിടെ അത് വാചാടോപപരമായ അതിശയോക്തിയായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: അതിനാൽ
  rationale: മുൻവിവരണത്തിൽനിന്ന് ഉരുത്തിരിയുന്ന പ്രതികരണമാണിതെന്ന് സൂചിപ്പിക്കുന്ന അനുമാനാത്മക ബന്ധം നിലനിർത്തുന്നു.
- source_word: πρὸς ἑαυτούς
  choice: പരസ്പരം
  rationale: പരീശന്മാർ ഒരു കൂട്ടത്തിനുള്ളിൽ അന്യോന്യം സംസാരിക്കുന്ന പരസ്പരാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: Θεωρεῖτε
  choice: നിങ്ങൾ കാണുന്നല്ലോ
  rationale: ബഹുവചന വർത്തമാനകാല പ്രസ്താവനയുടെ നിരാശാഭരിതവും ബോധ്യപ്പെടുത്തുന്നതുമായ ഭാവം നിലനിർത്തുന്നു; അതിനെ കല്പനാരൂപമോ വ്യക്തമായ ചോദ്യമോ ആക്കുന്നില്ല.
- source_word: οὐκ ὠφελεῖτε οὐδέν
  choice: നിങ്ങളെക്കൊണ്ട് ഒന്നും സാധിക്കുന്നില്ല
  rationale: യേശുവിനെ തടയാനുള്ള അവരുടെ ശ്രമങ്ങൾ ഫലിക്കുന്നില്ലെന്ന പ്രായോഗിക അർഥം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἴδε
  choice: നോക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന പദത്തിന്റെ പെട്ടെന്നുള്ള വാചാടോപശക്തി ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: κόσμος
  choice: ലോകം
  rationale: വാചാടോപപരമായ അതിശയോക്തിയാണെങ്കിലും ഗ്രീക്കിലെ ദൃശ്യരൂപവും യോഹന്നാനിലെ പദപ്രതിധ്വനിയും പ്രധാനപാഠത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: ὀπίσω αὐτοῦ
  choice: അവന്റെ പിന്നാലെ
  rationale: ഒരാളെ അനുഗമിക്കുക എന്ന ആശയം ഗ്രീക്കിലെ സ്ഥലരൂപം നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀπῆλθεν
  choice: പോയിരിക്കുന്നു
  rationale: കഴിഞ്ഞ സംഭവത്തിന്റെ ഇപ്പോൾ വ്യക്തമായിരിക്കുന്ന ഫലത്തിൽ സംസാരിക്കുന്നവർ ഊന്നുന്നതിനെ മലയാളത്തിലെ പൂർത്തിയായ അവസ്ഥാസൂചനയിലൂടെ പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: പരീശന്മാരുടെ വാക്കിലെ κόσμος എന്നതിന്റെ വ്യാപ്തി
  choice: പ്രധാനപാഠത്തിൽ ‘ലോകം’ എന്ന പദം നിലനിർത്തി അതിനെ വാചാടോപപരമായ അതിശയോക്തിയായി മനസ്സിലാക്കാൻ ഇട നൽകുന്നു.
  alternative: ‘എല്ലാവരും അവന്റെ പിന്നാലെ പോയിരിക്കുന്നു’ അല്ലെങ്കിൽ ‘ജനക്കൂട്ടം മുഴുവൻ അവന്റെ പിന്നാലെ പോയിരിക്കുന്നു.’
  rationale: ഇത് നിരാശയിൽ പറഞ്ഞ അതിശയോക്തിയാണ്; സർവമാനവരും യേശുവിനെ അനുഗമിച്ചു എന്ന ദൈവശാസ്ത്രപ്രസ്താവനയാക്കാതെയും പദത്തിന്റെ യോഹന്നാനീയ വ്യാപ്തി ചുരുക്കാതെയും മൂലപദം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സംഭാഷണശൈലി ഉപയോഗിച്ചു. ‘കാണുന്നല്ലോ’ എന്ന രൂപം പ്രസ്താവനയുടെ നിരാശാഭരിതമായ പരസ്പരബോധ്യപ്പെടുത്തൽ നിലനിർത്തുന്നു; ‘നോക്കൂ—’ എന്ന ഇടവേള മൂലത്തിലെ പെട്ടെന്നുള്ള ഊന്നൽ പ്രകടിപ്പിക്കുന്നു.
