source:
  edition: SBLGNT
  text: ὁ ἀθετῶν ἐμὲ καὶ μὴ λαμβάνων τὰ ῥήματά μου ἔχει τὸν κρίνοντα αὐτόν· ὁ λόγος ὃν ἐλάλησα ἐκεῖνος κρινεῖ αὐτὸν ἐν τῇ ἐσχάτῃ ἡμέρᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/048.yaml
  text: 'The one who rejects me and does not receive my words has one who judges him: the word that I spoke will judge him on the last day[a][b].'
translation:
  language: ml
  text: 'എന്നെ നിരസിക്കുകയും എന്റെ വാക്കുകൾ കൈക്കൊള്ളാതിരിക്കുകയും[a] ചെയ്യുന്നവന് അവനെ വിധിക്കുന്ന ഒരുവൻ അവനുണ്ട്: ഞാൻ പറഞ്ഞ വചനം[b] തന്നെയാണ് അന്ത്യദിവസത്തിൽ അവനെ വിധിക്കുക.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എന്റെ വാക്കുകൾ സ്വീകരിക്കാതിരിക്കുകയും.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് കൈക്കൊള്ളുക, സ്വീകരിക്കുക, അംഗീകരിക്കുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഞാൻ പറഞ്ഞ സന്ദേശം.’ ഇവിടെ ഗ്രീക്ക് λόγος എന്ന പദത്തിന് ‘വചനം’ എന്നും ‘സന്ദേശം’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθετῶν
  choice: നിരസിക്കുകയും
  rationale: ഇവിടെ ക്രിയയ്ക്ക് യേശുവിനെ വ്യക്തിപരമായി തള്ളിക്കളയുക, അംഗീകരിക്കാതിരിക്കുക എന്ന ശക്തമായ അർഥമുണ്ട്. ‘നിരസിക്കുക’ ആ ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: μὴ λαμβάνων τὰ ῥήματά μου
  choice: എന്റെ വാക്കുകൾ കൈക്കൊള്ളാതിരിക്കുകയും
  rationale: λαμβάνω എന്നതിന് സ്വീകരിക്കുക, സ്വാഗതം ചെയ്യുക, അംഗീകരിക്കുക എന്നീ അർഥസാധ്യതകളുണ്ട്. ‘കൈക്കൊള്ളുക’ വെറും കേൾവിയെയല്ല, പറഞ്ഞതിനെ സ്വീകരിക്കുന്നതിനെയും സൂചിപ്പിക്കുന്നു; ῥήματα എന്ന ബഹുവചനം ‘വാക്കുകൾ’ എന്ന് നേരിട്ട് നൽകിയിരിക്കുന്നു.
- source_word: ἔχει τὸν κρίνοντα αὐτόν
  choice: അവനെ വിധിക്കുന്നവൻ ഉണ്ട്
  rationale: ‘വിധിക്കുന്നവൻ’ എന്ന കർത്തൃപ്രയോഗം ഗ്രീക്കിലെ substantival participle-ന്റെ വ്യക്തിവൽക്കരിച്ച ശക്തി നിലനിർത്തുന്നു. തുടർന്നുള്ള വാക്യം ആ വിധികർത്താവിനെ യേശു പറഞ്ഞ വചനമായി തിരിച്ചറിയുന്നു.
- source_word: ὁ λόγος ὃν ἐλάλησα
  choice: ഞാൻ പറഞ്ഞ വചനം
  rationale: λόγος എന്ന ഏകവചനത്തിന്റെ ഗൗരവവും സമഗ്രസന്ദേശത്തെ സൂചിപ്പിക്കാനുള്ള ശേഷിയും ‘വചനം’ നിലനിർത്തുന്നു. ἐλάλησα എന്ന aorist ‘പറഞ്ഞ’ എന്ന് ലളിതമായി പരിഭാഷപ്പെടുത്തി.
- source_word: ἐκεῖνος
  choice: തന്നെയാണ്
  rationale: 'പിന്നിലേക്കു ചൂണ്ടുന്ന ഊന്നൽ മലയാളത്തിൽ ‘തന്നെയാണ്’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു: യേശു പറഞ്ഞ ആ വചനം തന്നെയാണ് വിധിക്കുക.'
- source_word: κρινεῖ
  choice: വിധിക്കുക
  rationale: ക്രിയയെ ‘ശിക്ഷ വിധിക്കുക’ അല്ലെങ്കിൽ ‘കുറ്റം വിധിക്കുക’ എന്ന് ചുരുക്കാതെ, അതിന്റെ വിശാലമായ ന്യായവിധി അർഥം നിലനിർത്തുന്നു.
- source_word: ἐν τῇ ἐσχάτῃ ἡμέρᾳ
  choice: അന്ത്യദിവസത്തിൽ
  rationale: യോഹന്നാന്റെ അന്ത്യകാലസംബന്ധിയായ പ്രയോഗം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു; കൂടുതൽ വിശദമായ സിദ്ധാന്തക്രമം ഇതിലേക്കു ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ഈ വാക്യത്തിലെ വിധിക്കുന്ന കർത്താവ്/മാധ്യമം
  choice: യേശു പറഞ്ഞ വചനം അന്തിമന്യായവിധിയിൽ വിധിക്കുന്നതായി വാക്യം അവതരിപ്പിക്കുന്ന രൂപം അതേപടി നിലനിർത്തി.
  alternative: ഇവിടെ യേശു മാത്രമാണ് നേരിട്ടുള്ള വിധികർത്താവ് എന്നും ‘വചനം’ വിധിയുടെ മാനദണ്ഡം മാത്രമാണെന്നും വ്യക്തമായി വ്യാഖ്യാനിച്ച് പരിഭാഷപ്പെടുത്തുക.
  rationale: ആദ്യം ‘വിധിക്കുന്നവൻ ഉണ്ട്’ എന്നു പറഞ്ഞശേഷം, യേശു പറഞ്ഞ വചനം തന്നെയാണ് അന്ത്യദിവസത്തിൽ വിധിക്കുകയെന്ന് ഗ്രീക്ക് വാക്യം പറയുന്നു. മറ്റു ഭാഗങ്ങളിലെ യേശുവിന്റെ ന്യായവിധിപങ്കുമായി ഇതിനെ പരിഭാഷയിൽ കൃത്രിമമായി പൊരുത്തപ്പെടുത്താതെ, വചനത്തിന്റെ വ്യക്തിവൽക്കരണവും ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി ഉപയോഗിച്ചു. ῥήματα എന്ന ബഹുവചനത്തിന് ‘വാക്കുകൾ’ എന്നും λόγος എന്ന ഏകവചനത്തിന് ‘വചനം’ എന്നും നൽകി പദവ്യത്യാസം ദൃശ്യമാക്കി. ‘വിധിക്കുന്നവൻ’ എന്ന പ്രയോഗം വചനത്തിന്റെ വ്യക്തിവൽക്കരിച്ച പങ്ക് മായ്ച്ചുകളയുന്നില്ല.
