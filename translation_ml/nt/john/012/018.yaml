id: JHN.12.18
reference: John 12:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διὰ τοῦτο ⸀καὶ ὑπήντησεν αὐτῷ ὁ ὄχλος ὅτι ⸀ἤκουσαν τοῦτο αὐτὸν πεποιηκέναι τὸ σημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/018.yaml
  text: For this reason also the crowd went to meet him[b][a], because they heard that he had done this sign.
translation:
  language: ml
  text: ഇക്കാരണത്താൽ ജനക്കൂട്ടവും അവനെ എതിരേൽക്കാൻ ചെന്നു[a]; കാരണം, അവൻ ഈ അടയാളം[b] ചെയ്തതായി അവർ കേട്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ജനക്കൂട്ടം അവനെ എതിരേറ്റു’ എന്നും ‘ജനക്കൂട്ടം അവനെ എതിരേൽക്കാൻ പുറപ്പെട്ടു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഒരാളെ കാണാൻ അങ്ങോട്ടു പോകുക എന്ന ആശയം ഗ്രീക്ക് ക്രിയയിൽ ഉൾപ്പെടുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘അടയാളം’ എന്നത് യേശുവിന്റെ വ്യക്തിത്വത്തെയും ദൗത്യത്തെയും ചൂണ്ടിക്കാണിക്കുന്ന അത്ഭുതപ്രവൃത്തികൾക്കായി യോഹന്നാൻ സവിശേഷമായി ഉപയോഗിക്കുന്ന പദമാണ്; ‘അത്ഭുതം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: ഇക്കാരണത്താൽ
  rationale: മുൻസന്ദർഭവുമായി വ്യക്തമായ കാരണബന്ധം സൂചിപ്പിക്കുന്ന διά + accusative പ്രയോഗത്തിന്റെ ബലം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: καὶ
  choice: -വും
  rationale: καίയുടെ കൂട്ടിച്ചേർക്കൽഭാവം ‘ജനക്കൂട്ടവും’ എന്ന പ്രയോഗത്തിലൂടെ സംക്ഷിപ്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: ὑπήντησεν αὐτῷ
  choice: അവനെ എതിരേൽക്കാൻ ചെന്നു
  rationale: ὑπαντάω ഒരാളെ കാണുന്നതിനായി അങ്ങോട്ടു പോകുക എന്ന ദിശാഭാവം ഉൾക്കൊള്ളുന്നു; ‘ചെന്നു’ ആ സൂക്ഷ്മത വ്യക്തമാക്കുന്നു.
- source_word: ὁ ὄχλος
  choice: ജനക്കൂട്ടം
  rationale: ὄχλος എന്നതിന് സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ആധുനികവും സ്വാഭാവികവുമായ തത്തുല്യപദം.
- source_word: ὅτι
  choice: കാരണം
  rationale: ഇവിടെ ὅτι ജനക്കൂട്ടത്തിന്റെ പ്രവൃത്തിക്കുള്ള കാരണം അവതരിപ്പിക്കുന്നു.
- source_word: ἤκουσαν
  choice: അവർ കേട്ടിരുന്നു
  rationale: അടയാളം ചെയ്തതിനെക്കുറിച്ചുള്ള വിവരം കേട്ടത് ജനക്കൂട്ടം എതിരേൽക്കാൻ പോയതിനു മുമ്പാണെന്ന കാലബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: τοῦτο ... τὸ σημεῖον
  choice: ഈ അടയാളം
  rationale: τοῦτο മുൻസന്ദർഭത്തിലെ നിർദിഷ്ട സംഭവത്തെ ചൂണ്ടിക്കാണിക്കുന്നു; σημεῖον എന്ന യോഹന്നാനീയ പദത്തിന്റെ സൂചനാത്മക അർത്ഥം ‘അടയാളം’ സംരക്ഷിക്കുന്നു.
- source_word: πεποιηκέναι
  choice: ചെയ്തതായി
  rationale: ποιέωയുടെ പൂർത്തിയായ പ്രവൃത്തിയെ റിപ്പോർട്ട് ചെയ്ത ഉള്ളടക്കമായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; പ്രധാനക്രിയയിലെ ‘കേട്ടിരുന്നു’ ആവശ്യമായ കാലബന്ധം വഹിക്കുന്നു.
theological_decisions:
- issue: യോഹന്നാന്റെ σημεῖον എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: അടയാളം
  alternative: അത്ഭുതം
  rationale: യേശുവിന്റെ പ്രവൃത്തി വിസ്മയകരമാണെന്നതിലുപരി അവന്റെ വ്യക്തിത്വത്തെയും ദൗത്യത്തെയും ചൂണ്ടിക്കാണിക്കുന്നു എന്ന യോഹന്നാനീയ സൂക്ഷ്മത ‘അടയാളം’ നിലനിർത്തുന്നു; ‘അത്ഭുതം’ മാത്രം ഉപയോഗിക്കുന്നത് ആ സൂചനാത്മക ഭാവം മങ്ങിച്ചേക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘എതിരേൽക്കാൻ ചെന്നു’ ദിശാഭാവം വ്യക്തമാക്കുന്നു; അർദ്ധവിരാമവും ‘കാരണം’ എന്ന ബന്ധകവും വാക്യത്തിലെ കാരണബന്ധം വായിക്കാൻ എളുപ്പമാക്കുന്നു.
