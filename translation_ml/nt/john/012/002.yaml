translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘വിളമ്പിക്കൊണ്ടിരുന്നു’ എന്ന രൂപം ഗ്രീക്കിലെ അപൂർണഭൂതകാലത്തിന്റെ തുടർച്ചാഭാവം നിലനിർത്തുന്നു. ‘ചാരിയിരുന്നവർ’ എന്നത് പുരാതന ഭക്ഷണരീതിയുടെ സാംസ്കാരിക പ്രത്യേകത പാഠത്തിൽ തന്നെയുണ്ടാക്കുകയും അടിക്കുറിപ്പ് അതു വിശദീകരിക്കുകയും ചെയ്യുന്നു.
