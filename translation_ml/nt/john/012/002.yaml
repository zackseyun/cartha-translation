id: JHN.12.2
reference: John 12:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐποίησαν οὖν αὐτῷ δεῖπνον ἐκεῖ, καὶ ἡ Μάρθα διηκόνει, ὁ δὲ Λάζαρος εἷς ἦν ⸀ἐκ τῶν ἀνακειμένων σὺν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/002.yaml
  text: So they made a dinner for him there[a], and Martha was serving, but Lazarus was one of those reclining at the table with him.
translation:
  language: ml
  text: അങ്ങനെ അവർ അവിടെ യേശുവിനുവേണ്ടി ഒരു അത്താഴം ഒരുക്കി. മാർത്ത വിളമ്പിക്കൊണ്ടിരുന്നു; ലാസറാകട്ടെ, യേശുവിനോടൊപ്പം മേശയ്ക്കരികിൽ ചാരിക്കിടന്നവരിൽ ഒരാളായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “അവനോടൊപ്പം ചാരിക്കിടന്നവരിൽ ഒരാൾ.” ഔപചാരികമായ ഭക്ഷണവേളയിൽ മേശയ്ക്കരികിൽ ചാരിക്കിടന്ന് ഭക്ഷണം കഴിക്കുന്നത് അന്നത്തെ പതിവായിരുന്നു.
    reason: ഗ്രീക്കിലെ ἀνακειμένων എന്ന പദത്തിന്റെ അക്ഷരാർഥവും പുരാതന ഭക്ഷണരീതിയുടെ സാംസ്കാരിക പശ്ചാത്തലവും വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: ἐποίησαν
  choice: ഒരുക്കി
  rationale: ποιέω എന്ന ക്രിയ δεῖπνον എന്ന പദത്തോടൊപ്പം വരുമ്പോൾ ഭക്ഷണം തയ്യാറാക്കുക അഥവാ ഒരുക്കുക എന്ന അർഥം നൽകുന്നു. മലയാളത്തിൽ ‘അത്താഴം ഒരുക്കി’ എന്നത് സ്വാഭാവികമാണ്; ആതിഥേയർ ആരെന്നു പാഠം പറയാത്തതിനാൽ അതു കൂട്ടിച്ചേർത്തിട്ടില്ല.
- source_word: οὖν
  choice: അങ്ങനെ
  rationale: മുൻസന്ദർഭത്തിൽനിന്നുള്ള കഥയുടെ തുടർച്ചയെയും ഫലബന്ധത്തെയും ഒതുക്കത്തോടെ സൂചിപ്പിക്കുന്നു; ‘അതുകൊണ്ട്’ എന്നതിനെക്കാൾ ഇവിടെ സ്വാഭാവികമായ ആഖ്യാനബന്ധകമാണ്.
- source_word: αὐτῷ
  choice: യേശുവിനുവേണ്ടി
  rationale: ദാതൃവിഭക്തി ഇവിടെ ആർക്കുവേണ്ടിയാണ് അത്താഴം ഒരുക്കിയതെന്ന് സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ സർവനാമത്തിന്റെ വ്യക്തമായ സൂചിതൻ യേശുവായതിനാൽ മലയാളത്തിലെ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ പേര് ഉപയോഗിച്ചു.
- source_word: δεῖπνον
  choice: ഒരു അത്താഴം
  rationale: δεῖπνον സാധാരണയായി ദിവസത്തിലെ പ്രധാന ഭക്ഷണത്തെ, പലപ്പോഴും സായാഹ്നഭക്ഷണത്തെ, സൂചിപ്പിക്കുന്നു. ‘അത്താഴം’ അതിന്റെ സ്വാഭാവികമായ ആധുനിക മലയാള പരിഭാഷയാണ്; ‘വിരുന്ന്’ എന്നു പറയുന്നത് പദത്തിന്റെ ഭാവം അനാവശ്യമായി വിപുലീകരിക്കും.
- source_word: ἐκεῖ
  choice: അവിടെ
  rationale: സന്ദർഭത്തിൽ മുമ്പ് പറഞ്ഞ ബെഥാന്യയെ സൂചിപ്പിക്കുന്ന ലളിതമായ സ്ഥലക്രിയാവിശേഷണം.
- source_word: διηκόνει
  choice: വിളമ്പിക്കൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലരൂപം നടന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ഭക്ഷണസന്ദർഭത്തിൽ διακονέω അതിഥികളെ സേവിക്കുന്നതും ഭക്ഷണം വിളമ്പുന്നതുമാണ്; സഭാപരമായ ‘ശുശ്രൂഷിച്ചു’ എന്ന പ്രയോഗം ഇവിടെ അനാവശ്യമാണ്.
- source_word: δὲ
  choice: ലാസറാകട്ടെ
  rationale: δέ മാർത്തയുടെ സേവനവും ലാസറിന്റെ ഭക്ഷണസാന്നിധ്യവും തമ്മിലുള്ള മൃദുവായ വ്യത്യാസം അടയാളപ്പെടുത്തുന്നു. ‘-ആകട്ടെ’ മലയാളത്തിൽ ഈ ലഘുവായ പ്രതിയോഗം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: εἷς ἦν ἐκ
  choice: ഒരാളായിരുന്നു
  rationale: ലാസർ ആ കൂട്ടത്തിലെ ഒരു അംഗമായിരുന്നുവെന്ന് ഈ ഗ്രീക്ക് പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: ἀνακειμένων
  choice: ഭക്ഷണത്തിന് ചാരിയിരുന്നവരിൽ
  rationale: ഭക്ഷണസന്ദർഭത്തിൽ ἀνάκειμαι മേശയ്ക്കരികിൽ ചാരിക്കിടക്കുന്ന പതിവ് ശരീരനിലയെ സൂചിപ്പിക്കുന്നു. ‘ഭക്ഷണം കഴിച്ചിരുന്നവരിൽ’ എന്നു മാത്രം പറഞ്ഞാൽ ഈ സാംസ്കാരിക വിശദാംശം നഷ്ടപ്പെടും.
- source_word: σὺν αὐτῷ
  choice: യേശുവിനോടൊപ്പം
  rationale: കൂടെ ഉണ്ടായിരുന്നതിനെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിലെ വ്യക്തമായ സൂചിതൻ യേശുവായതിനാൽ മലയാളത്തിൽ വ്യക്തതയ്ക്കായി പേര് ആവർത്തിച്ചു.
