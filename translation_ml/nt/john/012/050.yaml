  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ οἶδα ὅτι ἡ ἐντολὴ αὐτοῦ ζωὴ αἰώνιός ἐστιν. ἃ οὖν ⸂ἐγὼ λαλῶ⸃, καθὼς εἴρηκέν μοι ὁ πατήρ, οὕτως λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/050.yaml
  text: And I know that his commandment is eternal life. So what I speak[a], I speak just as the Father has told me.
translation:
  language: ml
  text: അവന്റെ കൽപ്പന നിത്യജീവനാണ് എന്നു ഞാൻ അറിയുന്നു. അതുകൊണ്ട്, ഞാൻ സംസാരിക്കുന്നതെല്ലാം പിതാവ് എന്നോടു പറഞ്ഞതുപോലെതന്നെ സംസാരിക്കുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐντολή
  choice: കല്പന
  rationale: അധികാരപൂർവമായ ആജ്ഞ എന്ന അർഥം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; പരമ്പരാഗതമായ ‘കല്പന’ ഇവിടെ യോഹന്നാന്റെ പ്രയോഗത്തിനും യോജിക്കുന്നു.
- source_word: ζωὴ αἰώνιος
  choice: നിത്യജീവൻ
  rationale: യോഹന്നാന്റെ രചനകളിലെ സ്ഥിരമായ ദൈവശാസ്ത്രപ്രയോഗം; അവസാനമില്ലാത്ത ദൈർഘ്യവും വരാനിരിക്കുന്ന യുഗത്തിന്റെ ജീവനും സൂചിപ്പിക്കുന്നു.
- source_word: ἃ
  choice: സംസാരിക്കുന്നതെല്ലാം
  rationale: നപുംസകലിംഗ ബഹുവചന ബന്ധസർവനാമത്തിന്റെ ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുകയും യേശുവിന്റെ സംസാരത്തിന്റെ ഉള്ളടക്കം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: λαλῶ
  choice: സംസാരിക്കുന്നു
  rationale: രണ്ടു പ്രാവശ്യവും ഒരേ ക്രിയ ഉപയോഗിച്ച് ഗ്രീക്കിലെ ആവർത്തനം നിലനിർത്തുന്നു.
- source_word: καθὼς
  choice: പോലെതന്നെ
  rationale: പിതാവ് പറഞ്ഞതും യേശു സംസാരിക്കുന്നതും തമ്മിലുള്ള കൃത്യമായ അനുരൂപത സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: εἴρηκέν μοι
  choice: എന്നോടു പറഞ്ഞത്
  rationale: പൂർണകാല ക്രിയയുടെ ഇപ്പോഴും നിലനിൽക്കുന്ന പ്രസക്തി സന്ദർഭത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: ὁ πατήρ
  choice: പിതാവ്
  rationale: ഗ്രീക്കിലെ ബന്ധസൂചകമായ വിശേഷണം ചേർക്കാതെ ‘the Father’ എന്ന യോഹന്നാനീയ പദവി നിലനിർത്തുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യത്തിൽനിന്നുള്ള നിഗമനബന്ധം വ്യക്തവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: οἶδα
  choice: ഞാൻ അറിയുന്നു
  rationale: യേശുവിന്റെ ഉറച്ച അറിവിനെ നേരിട്ടും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘അവന്റെ കല്പന നിത്യജീവൻ ആകുന്നു’ എന്ന സമീകരണത്തിന്റെ അർഥം
  choice: ഗ്രീക്കിലെ നേരിട്ടുള്ള സമീകരണം വ്യാഖ്യാനപരമായി ചുരുക്കാതെ മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
  alternative: അവന്റെ കല്പന നിത്യജീവനിലേക്കു നയിക്കുന്നു; അല്ലെങ്കിൽ അവന്റെ കല്പന നിത്യജീവനെ സംബന്ധിച്ചതാണ്.
  rationale: ἐστιν എന്നത് നേരിട്ടുള്ള ‘ആകുന്നു’ എന്ന സമീകരണമാണ്. ഫലമോ വിഷയമോ എന്ന ഒറ്റ വ്യാഖ്യാനത്തിലേക്ക് വാക്യത്തെ പരിമിതപ്പെടുത്താതിരിക്കാൻ യഥാർത്ഥ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കല്പന,’ ‘നിത്യജീവൻ,’ ‘പിതാവ്’ എന്നീ സുപരിചിത ബൈബിൾ പദങ്ങൾ നിലനിർത്തി; λαλῶ എന്ന ക്രിയയുടെ ആവർത്തനവും ഗ്രീക്കിലെ സമീകരണത്തിന്റെ ഉദ്ദേശപൂർവമായ അസ്പഷ്ടതയും സംരക്ഷിച്ചു.
