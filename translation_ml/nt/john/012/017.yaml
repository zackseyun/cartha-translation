revisions:
- from: അതിനാൽ, യേശു ലാസറിനെ കല്ലറയിൽനിന്ന് വിളിച്ചിറക്കി മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിച്ചപ്പോൾ അവനോടുകൂടെ ഉണ്ടായിരുന്ന ജനക്കൂട്ടം അതിനു സാക്ഷ്യം പറഞ്ഞുകൊണ്ടിരുന്നു.[a]
  to: അതിനാൽ, യേശു ലാസറിനെ കല്ലറയിൽനിന്ന് പുറത്തേക്കു വിളിക്കുകയും മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിക്കുകയും ചെയ്തപ്പോൾ അവനോടുകൂടെ ഉണ്ടായിരുന്ന ജനക്കൂട്ടം സാക്ഷ്യം നൽകിക്കൊണ്ടിരുന്നു.[a]
