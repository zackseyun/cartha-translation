  text: ἐμαρτύρει οὖν ὁ ὄχλος ὁ ὢν μετ’ αὐτοῦ ὅτε τὸν Λάζαρον ἐφώνησεν ἐκ τοῦ μνημείου καὶ ἤγειρεν αὐτὸν ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/017.yaml
  text: So the crowd that had been with him when he called Lazarus out of the tomb and raised him from the dead was bearing witness[a].
translation:
  language: ml
  text: അതിനാൽ, യേശു ലാസറിനെ കല്ലറയിൽനിന്ന് പുറത്തേക്കു വിളിക്കുകയും മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിക്കുകയും ചെയ്തപ്പോൾ അവനോടുകൂടെ ഉണ്ടായിരുന്ന ജനക്കൂട്ടം സാക്ഷ്യം നൽകിക്കൊണ്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സാക്ഷ്യപ്പെടുത്തിക്കൊണ്ടിരുന്നു’; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് ക്രിയ സാക്ഷ്യം നൽകുന്നതിനെയോ സാക്ഷ്യപ്പെടുത്തുന്നതിനെയോ സൂചിപ്പിക്കാം. യോഹന്നാന്റെ സുവിശേഷത്തിൽ ആവർത്തിച്ചുവരുന്ന ഒരു പ്രധാന ആശയമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρει
  choice: സാക്ഷ്യം പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം തുടരുകയോ ആവർത്തിക്കുകയോ ചെയ്ത പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു. യോഹന്നാനിലെ സാക്ഷ്യവിഷയവും നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്.
- source_word: οὖν
  choice: അതിനാൽ
  rationale: മുൻസന്ദർഭത്തോടുള്ള ആഖ്യാനപരവും നിഗമനാത്മകവുമായ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: ὁ ὄχλος
  choice: ജനക്കൂട്ടം
  rationale: ὄχλος എന്ന പദത്തിന്റെ സാധാരണ അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ὁ ὢν μετ’ αὐτοῦ
  choice: അവനോടുകൂടെ ഉണ്ടായിരുന്ന
  rationale: പ്രസ്തുത സംഭവസമയത്ത് യേശുവിനോടൊപ്പം ഉണ്ടായിരുന്ന പ്രത്യേക ജനക്കൂട്ടത്തെ വിശേഷിപ്പിക്കുന്ന കൃതന്തഘടന സംരക്ഷിക്കുന്നു.
- source_word: ἐφώνησεν ἐκ τοῦ μνημείου
  choice: കല്ലറയിൽനിന്ന് വിളിച്ചിറക്കി
  rationale: φωνέω എന്നതിലെ ‘വിളിക്കുക’ എന്ന അർഥവും ἐκ സൂചിപ്പിക്കുന്ന പുറത്തേക്കുള്ള ചലനവും സ്വാഭാവിക മലയാളത്തിൽ ഒരുമിച്ച് നൽകുന്നു; ‘വിളിച്ചിറക്കി’ എന്നത് ഫലസൂചനയുള്ള സന്ദർഭാനുസൃത പ്രയോഗമാണ്.
- source_word: ἤγειρεν αὐτὸν ἐκ νεκρῶν
  choice: മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിച്ചു
  rationale: പുനരുത്ഥാനസന്ദർഭത്തിലെ ἐγείρω എന്ന ക്രിയയുടെ അർഥം വ്യക്തമായി നിലനിർത്തുകയും അത്ഭുതപ്രസ്താവനയെ മയപ്പെടുത്താതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ലാസറിനെക്കുറിച്ചുള്ള പുനരുത്ഥാനപ്രസ്താവന
  choice: മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിച്ചു
  alternative: മരിച്ചവരുടെ ഇടയിൽനിന്ന് എഴുന്നേൽപ്പിച്ചു
  rationale: ഗ്രീക്ക് മൂലപാഠം യേശു ലാസറിനെ മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിച്ചുവെന്ന് നേരിട്ട് പറയുന്നു. തിരഞ്ഞെടുത്ത രൂപം ഈ അവകാശവാദം അധിക വ്യാഖ്യാനം ചേർക്കാതെ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘യേശു’ എന്ന പേര് മലയാളവാക്യത്തിൽ സർവനാമസംബന്ധം ഉടൻ വ്യക്തമാക്കാൻ ചേർത്തിരിക്കുന്നു; ഗ്രീക്കിലെ αὐτοῦ മുൻസന്ദർഭത്തിൽ യേശുവിനെയാണ് സൂചിപ്പിക്കുന്നത്. പ്രധാന പാഠത്തിലെ [a] അടയാളം അനുബന്ധ അടിക്കുറിപ്പുമായി പൊരുത്തപ്പെടുന്നു.
