id: JHN.12.42
reference: John 12:42
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅμως μέντοι καὶ ἐκ τῶν ἀρχόντων πολλοὶ ἐπίστευσαν εἰς αὐτόν, ἀλλὰ διὰ τοὺς Φαρισαίους οὐχ ὡμολόγουν ἵνα μὴ ἀποσυνάγωγοι γένωνται,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/042.yaml
  text: Nevertheless, even among the rulers many believed in him, but because of the Pharisees they were not confessing it, so that they might not become excluded from the synagogue.
translation:
  language: ml
  text: എന്നിരുന്നാലും, ഭരണാധികാരികളിൽപ്പോലും പലരും അവനിൽ വിശ്വസിച്ചു. എന്നാൽ പരീശന്മാർ നിമിത്തം, സിനഗോഗിൽനിന്ന് പുറത്താക്കപ്പെടാതിരിക്കാൻ അവർ അവനെ ഏറ്റുപറഞ്ഞിരുന്നില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സിനഗോഗ് സമൂഹത്തിൽനിന്ന് ഒഴിവാക്കപ്പെടാതിരിക്കാൻ’ അല്ലെങ്കിൽ ‘സിനഗോഗിൽനിന്ന് ബഹിഷ്കരിക്കപ്പെടാതിരിക്കാൻ.’ ഗ്രീക്ക് പദം സിനഗോഗ് സമൂഹത്തിൽനിന്നുള്ള ഒഴിവാക്കലിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅμως μέντοι
  choice: എങ്കിലും
  rationale: ഇരട്ട കണങ്ങളുടെ ശക്തമായ വഴക്കമാറ്റഭാവം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: καὶ ἐκ τῶν ἀρχόντων πολλοὶ
  choice: അധികാരികളിൽപ്പോലും പലരും
  rationale: ἐκ കൂട്ടത്തിലെ അംഗത്വം സൂചിപ്പിക്കുന്നു; ἄρχοντες ഇവിടെ ഭരണ-മത നേതൃത്വത്തിലുള്ള അധികാരികളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: അവനിൽ വിശ്വസിച്ചു
  rationale: യേശുവിലേക്കു തിരിഞ്ഞ വ്യക്തിപരമായ വിശ്വാസം സൂചിപ്പിക്കുന്ന യോഹന്നാനീയ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: διὰ τοὺς Φαρισαίους
  choice: പരീശന്മാർ നിമിത്തം
  rationale: διά + accusative കാരണത്തെ സൂചിപ്പിക്കുന്നു; ഭയം സന്ദർഭത്തിൽ ഉൾക്കൊള്ളാമെങ്കിലും ഗ്രീക്കിൽ നേരിട്ട് പറഞ്ഞിട്ടില്ല.
- source_word: οὐχ ὡμολόγουν
  choice: അവർ അത് പരസ്യമായി സമ്മതിച്ചിരുന്നില്ല
  rationale: അപൂർണ്ണഭൂതകാലം തുടർച്ചയായോ പതിവായോ ഉള്ള പരസ്യസമ്മതക്കുറവ് സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിൽ കർമം വ്യക്തമല്ലാത്തതിനാൽ ‘അത്’ മുൻവാക്യത്തിലെ വിശ്വാസത്തെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ ഉൾപ്പെട്ട തുറന്ന അംഗീകാരഭാവം ‘പരസ്യമായി’ വ്യക്തമാക്കുന്നു.
- source_word: ἵνα μὴ
  choice: പുറത്താക്കപ്പെടാതിരിക്കേണ്ടതിന്
  rationale: ഒഴിവാക്കാൻ ഉദ്ദേശിച്ച ഫലം വ്യക്തമാക്കുന്ന ഉദ്ദേശ്യഭാവം നിലനിർത്തുന്നു.
- source_word: ἀποσυνάγωγοι γένωνται
  choice: സിനഗോഗുസമൂഹത്തിൽനിന്ന് പുറത്താക്കപ്പെടുക
  rationale: വെറും കെട്ടിടത്തിൽനിന്നുള്ള നീക്കം എന്നതിലുപരി സിനഗോഗ് സമൂഹത്തിൽനിന്നുള്ള മത-സാമൂഹിക ബഹിഷ്കരണം പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: യോഹന്നാനീയ ദൈവശാസ്ത്രത്തിന്റെ വെളിച്ചത്തിൽ അധികാരികളുടെ വിശ്വാസത്തിന്റെ സ്വഭാവം
  choice: ἐπίστευσαν എന്നത് നേരിട്ട് ‘വിശ്വസിച്ചു’ എന്നു പരിഭാഷപ്പെടുത്തി, അവരുടെ തുറന്ന സമ്മതക്കുറവും അതോടൊപ്പം നിലനിർത്തുന്നു.
  alternative: അതിനെ ‘വിശ്വാസം നടിച്ചു’ എന്നു ദുർബലപ്പെടുത്തുകയോ ‘രക്ഷിക്കപ്പെട്ടു’ എന്നു ശക്തിപ്പെടുത്തുകയോ ചെയ്യുക.
  rationale: വാക്യം അവരുടെ വിശ്വാസവും തുറന്ന സമ്മതക്കുറവും ഒരുമിച്ചു പ്രസ്താവിക്കുന്നു; അവരുടെ വിശ്വാസത്തിന്റെ അന്തിമ ദൈവശാസ്ത്രപരമായ നില പരിഭാഷ നിശ്ചയിക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സിനഗോഗുസമൂഹം’ എന്ന പ്രയോഗം മതസ്ഥാപനത്തെയും അതുമായി ബന്ധപ്പെട്ട സമൂഹത്തെയും ഉൾക്കൊള്ളുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വാചകത്തിനുശേഷം നൽകിയിരിക്കുന്നു.
