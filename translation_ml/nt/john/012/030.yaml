id: JHN.12.30
reference: John 12:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸂Ἰησοῦς καὶ εἶπεν⸃· Οὐ δι’ ἐμὲ ⸂ἡ φωνὴ αὕτη⸃ γέγονεν ἀλλὰ δι’ ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/030.yaml
  text: Jesus answered and said[a], “This voice has not come for my sake, but for yours.”
translation:
  language: ml
  text: 'യേശു മറുപടിയായി പറഞ്ഞു: “ഈ സ്വരം ഉണ്ടായത് എനിക്കുവേണ്ടിയല്ല, നിങ്ങൾക്കുവേണ്ടിയാണ്.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഈ സ്വരം ഉണ്ടായത് ഞാൻ നിമിത്തമല്ല, നിങ്ങൾ നിമിത്തമാണ്.” ഗ്രീക്കിലെ മുൻനിലപദം കാരണാർഥത്തിലും മനസ്സിലാക്കാം; എങ്കിലും ഇവിടെ “വേണ്ടി,” അഥവാ പ്രയോജനത്തിനായി, എന്ന അർഥത്തിനാണ് സന്ദർഭം കൂടുതൽ പിന്തുണ നൽകുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: മറുപടിയായി പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ പതിവ് സംഭാഷണസൂത്രത്തിലെ മറുപടിയുടെ ആശയവും പറയുന്ന പ്രവൃത്തിയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ‘മറുപടി പറഞ്ഞുകൊണ്ട് പറഞ്ഞു’ എന്ന അനാവശ്യ ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: ἡ φωνὴ αὕτη
  choice: ഈ സ്വരം
  rationale: മുൻസന്ദർഭത്തിൽ കേട്ട സ്വർഗീയ ഉച്ചാരണത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ശബ്ദം’ എന്നതിനെക്കാൾ ‘സ്വരം’ സംസാരിക്കുന്ന ശബ്ദം എന്ന അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: γέγονεν
  choice: ഉണ്ടായത്
  rationale: γίνομαι എന്ന ക്രിയയുടെ perfect രൂപം ഇവിടെ ആ സ്വരം സംഭവിച്ചതിനെയും അതിന്റെ നിലവിലുള്ള പ്രസക്തിയെയും സൂചിപ്പിക്കുന്നു. ‘ഉണ്ടായത്’ സംഭവാർഥം ലളിതമായി നിലനിർത്തുന്നു.
- source_word: δι’ ἐμὲ … δι’ ὑμᾶς
  choice: എനിക്കുവേണ്ടിയല്ല, നിങ്ങൾക്കുവേണ്ടിയാണ്
  rationale: διά + accusative എന്ന സമാന്തര പ്രയോഗത്തെ സന്ദർഭാനുസൃതമായി ഉദ്ദേശ്യം/പ്രയോജനം സൂചിപ്പിക്കുന്നതായി പരിഭാഷപ്പെടുത്തുകയും വ്യക്തമായ വിരോധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: Οὐ … ἀλλὰ
  choice: അല്ല … ആണ്
  rationale: ഗ്രീക്കിലെ നിഷേധ-വിരോധ ഘടന മലയാളത്തിൽ നേരിട്ടും സ്വാഭാവികമായും പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: സ്വർഗീയ സ്വരത്തിന്റെ ഉദ്ദേശ്യം
  choice: ആ സ്വരം യേശുവിന്റെ പ്രയോജനത്തിനല്ല, കേട്ടുനിന്നവരുടെ പ്രയോജനത്തിനാണ് ഉണ്ടായത്.
  alternative: ആ സ്വരം യേശു നിമിത്തമല്ല, കേട്ടുനിന്നവർ നിമിത്തമാണ് ഉണ്ടായത്.
  rationale: ഇരു ഘടകങ്ങളിലുമുള്ള διά + accusative സന്ദർഭത്തിൽ പ്രയോജനാർഥമായി വായിക്കുന്നത് സമാന്തരതയും യേശു വരുത്തുന്ന ഊന്നലും നന്നായി സംരക്ഷിക്കുന്നു. കാരണാർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു; അതുവഴി ഗ്രീക്കിലെ യഥാർഥ അർഥവ്യാപ്തി അനാവശ്യമായി അടച്ചുപൂട്ടുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ സംഭാഷണശൈലി ഉപയോഗിച്ചു. ‘മറുപടിയായി പറഞ്ഞു’ യോഹന്നാനിലെ ഗ്രീക്ക് വിവരണസൂത്രത്തെ മലയാളത്തിൽ അനാവശ്യ ആവർത്തനമില്ലാതെ അവതരിപ്പിക്കുന്നു. ‘സ്വരം’ മനുഷ്യവാക്കുകളായി കേട്ട ശബ്ദത്തെ സൂചിപ്പിക്കുന്നു; അടിക്കുറിപ്പ് διά എന്ന പദത്തിന്റെ കാരണാർഥസാധ്യതയും സംരക്ഷിക്കുന്നു.
