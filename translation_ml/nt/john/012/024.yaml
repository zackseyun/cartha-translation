source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ἐὰν μὴ ὁ κόκκος τοῦ σίτου πεσὼν εἰς τὴν γῆν ἀποθάνῃ, αὐτὸς μόνος μένει· ἐὰν δὲ ἀποθάνῃ, πολὺν καρπὸν φέρει.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/024.yaml
  text: Truly[a], truly, I say to you, unless the grain of wheat falls into the ground and dies, it remains by itself; but if it dies[b], it bears much fruit.
translation:
  language: ml
  text: 'സത്യമായി, സത്യമായി, ഞാൻ നിങ്ങളോടു പറയുന്നു: ഗോതമ്പുമണി മണ്ണിൽ വീണ് മരിക്കുന്നില്ലെങ്കിൽ, അത് തനിച്ചുതന്നെ നിലനിൽക്കുന്നു[a]; എന്നാൽ അത് മരിക്കുന്നുവെങ്കിൽ[b], ധാരാളം ഫലം കായ്ക്കുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അത് ഒറ്റയ്ക്കായി ശേഷിക്കുന്നു.”'
    reason: lexical_alternative
  - marker: b
    text: ഫലം പുറപ്പെടുവിക്കണമെങ്കിൽ ധാന്യമണി മണ്ണിൽ മരിക്കേണ്ടതുണ്ടെന്നതാണ് ഈ ചിത്രം. സന്ദർഭത്തിൽ, യേശു ഈ മാതൃകയെ തന്റെ മരണത്തോടും തന്നെ അനുഗമിക്കുന്നവരോടും ബന്ധപ്പെടുത്തുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: സത്യമായി, സത്യമായി
  rationale: യോഹന്നാനിലെ ഗൗരവപൂർവമായ ഉറപ്പിക്കൽസൂത്രത്തിന്റെ ആവർത്തനവും ഊന്നലും നിലനിർത്തുന്നു; അതേസമയം സാധാരണ ആധുനിക മലയാളത്തിൽ അർഥം വ്യക്തമാണ്.
- source_word: λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: നേരിട്ടുള്ള അഭിസംബോധനയും യോഹന്നാനിലെ പതിവുസൂത്രവും സ്വാഭാവികമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἐὰν μὴ
  choice: ചാകുന്നില്ലെങ്കിൽ
  rationale: ‘unless’ എന്ന നിഷേധാത്മക വ്യവസ്ഥ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὁ κόκκος τοῦ σίτου
  choice: ഗോതമ്പുമണി
  rationale: κόκκος എന്നത് ധാന്യമണി/വിത്ത് എന്ന ആശയം നൽകുന്നു; കാർഷികദൃശ്യത്തിന് ‘ഗോതമ്പുമണി’ ചുരുക്കവും സ്വാഭാവികവുമാണ്.
- source_word: πεσὼν εἰς τὴν γῆν
  choice: മണ്ണിൽ വീണ്
  rationale: പങ്കാളിക്രിയയുടെ ക്രമം നിലനിർത്തുന്നു; കാർഷികസന്ദർഭത്തിൽ γῆ എന്നതിന് ‘മണ്ണ്’ ഏറ്റവും സ്വാഭാവികമാണ്.
- source_word: ἀποθάνῃ
  choice: ചാകുന്നു
  rationale: ഒരു ധാന്യമണിയെക്കുറിച്ചുള്ള ദൃശ്യത്തിൽ ‘ചാകുക’ നേരിട്ടും സാധാരണവുമായ പ്രയോഗമാണ്; വ്യവസ്ഥാവാക്യത്തിലെ ഗ്രീക്ക് സബ്ജങ്ക്റ്റീവ് മലയാളത്തിൽ ലളിതമായ വ്യവസ്ഥാരൂപത്തിൽ നൽകുന്നു.
- source_word: αὐτὸς μόνος μένει
  choice: അത് തനിച്ചുതന്നെ നിലനിൽക്കുന്നു
  rationale: αὐτός നൽകുന്ന ഊന്നലും μόνος എന്ന ‘തനിച്ച്’ എന്ന അർഥവും μένει എന്ന ‘നിലനിൽക്കുക’ എന്ന ആശയവും സംരക്ഷിക്കുന്നു; വികാരപരമായ ഏകാന്തത എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: ἐὰν δὲ ἀποθάνῃ
  choice: എന്നാൽ അത് ചാകുന്നെങ്കിൽ
  rationale: δέ സൂചിപ്പിക്കുന്ന വൈരുധ്യം ‘എന്നാൽ’ വഴി വ്യക്തമാക്കുന്നു.
- source_word: πολὺν καρπὸν φέρει
  choice: ധാരാളം ഫലം കായ്ക്കുന്നു
  rationale: ‘ഫലം കായ്ക്കുക’ എന്ന സ്വാഭാവിക മലയാളപ്രയോഗം കാർഷികരൂപകവും യോഹന്നാനിലെ ഫലപ്രതീകവും നിലനിർത്തുന്നു; ‘വിളവ്’ എന്ന് വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കുന്നില്ല.
theological_decisions:
- issue: കാർഷികരൂപകത്തിലെ പരോക്ഷമായ ക്രിസ്തുസംബന്ധവും ശിഷ്യത്വസംബന്ധവും
  choice: പ്രധാനപാഠത്തിൽ കാർഷികരൂപകം അതേപടി നിലനിർത്തി, അതിന്റെ ദൈവശാസ്ത്രപരമായ പ്രയോഗം തുറന്നു ചേർക്കാതിരിക്കുക.
  alternative: ഇത് യേശുവിന്റെ മരണത്തെയും അതിലൂടെ അനേകർക്ക് ഉണ്ടാകുന്ന ഫലത്തെയും സൂചിപ്പിക്കുന്നുവെന്ന് പ്രധാനപാഠത്തിൽ വിശദമാക്കുക.
  rationale: സന്ദർഭം ഈ രൂപകത്തെ യേശുവിന്റെ മരണത്തോടും തുടർന്നുള്ള ശിഷ്യത്വവിളിയോടും ബന്ധിപ്പിക്കുന്നു. എന്നാൽ ഈ വാക്യം തന്നെ ആ വ്യാഖ്യാനം തുറന്നു പറയാതെ ചിത്രം മാത്രം അവതരിപ്പിക്കുന്നതിനാൽ, അതിലെ പരോക്ഷതയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം ഗൗരവമുള്ളതുമായ ശൈലി. ‘സത്യമായി, സത്യമായി’ എന്ന ആവർത്തനം യോഹന്നാനിലെ പ്രത്യേക ഊന്നൽ നിലനിർത്തുന്നു. ഇംഗ്ലീഷ് ഉപദേശപാഠത്തിൽ [a] അടയാളം ആദ്യവാക്യഭാഗത്ത് തെറ്റായി ചേർന്നതായി തോന്നുന്നതിനാൽ, അതിന്റെ യഥാർഥ പദപരമായ ബന്ധമായ ‘തനിച്ചുതന്നെ നിലനിൽക്കുന്നു’ എന്ന ഭാഗത്താണ് മലയാളത്തിൽ വെച്ചത്.
