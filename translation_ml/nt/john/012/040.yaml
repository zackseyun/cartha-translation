    rationale: ഉദ്ധരണിയുടെ സമഗ്രസന്ദർഭം സൗഖ്യമാക്കൽ ഒഴിവാകുന്നതാണ് സൂചിപ്പിക്കുന്നതെങ്കിലും, നിബന്ധനാഭാവം സ്വതന്ത്രമായി ഗ്രീക്ക് ക്രിയാരൂപത്തിൽ ഇല്ല. നിഷേധിത ഉദ്ദേശ്യഘടനയിൽ ‘സൗഖ്യമാക്കാതിരിക്കാനും’ എന്നു നൽകുന്നത് ആ ബന്ധം കൂടുതൽ വിശ്വസ്തമായി പ്രകടിപ്പിക്കുന്നു.
  - severity: low
