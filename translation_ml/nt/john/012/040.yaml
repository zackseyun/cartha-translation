  revision_rationale: മൂലത്തിലെ വ്യക്തമായ ദൈവിക കർത്തൃത്വവും καρδίαയുടെ ഏകവചനമായ സമൂഹസൂചനയും നിലനിർത്തിയിരിക്കുന്നു. ἵνα μή-യെ ആജ്ഞാർഥമോ സാധാരണ കാരണ-ഫലബന്ധമോ ആക്കാതെ, നിഷേധിത ഉദ്ദേശ്യ/ഫലഘടനയായി പരിഭാഷപ്പെടുത്തി. അവസാന ക്രിയയ്ക്ക് നിബന്ധനാരൂപം ഏർപ്പെടുത്താതെ, ഉദ്ധരണിസന്ദർഭത്തിൽ നിഷേധം അതിലേക്കും വ്യാപിക്കുന്നതിനെ മലയാളത്തിലെ സമാന്തര ‘-ാതിരിക്കാനും’ ഘടനയിലൂടെ അറിയിച്ചു.
