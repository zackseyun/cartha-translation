    text: 'ഈ വാക്യം യെശയ്യാവ് 6:10-നെ പ്രതിധ്വനിപ്പിക്കുന്നു. ‘ഞാൻ അവരെ സൗഖ്യമാക്കാതിരിക്കാനും’ എന്നത് ഉദ്ധരണിയിലെ നിഷേധിത ഉദ്ദേശ്യ/ഫലഘടനയെ വ്യക്തമാക്കുന്നു; ഗ്രീക്കിലെ ἰάσομαι അക്ഷരാർഥത്തിൽ ഭാവിരൂപമാണ്: ‘ഞാൻ അവരെ സൗഖ്യമാക്കും.’'
