    rationale: Τετύφλωκεν സമ്പൂർണകാലമായതിനാൽ ‘അന്ധമാക്കിയിരിക്കുന്നു’ യോജിക്കുന്നു; എന്നാൽ ἐπώρωσεν അഒറിസ്റ്റായതിനാൽ ‘കഠിനമാക്കി’ എന്ന ലളിതഭൂതരൂപം മൂലത്തിലെ രൂപവ്യത്യാസം നന്നായി പ്രതിഫലിപ്പിക്കുന്നു.
  revised_text: അവൻ അവരുടെ കണ്ണുകളെ അന്ധമാക്കിയിരിക്കുന്നു; അവരുടെ ഹൃദയത്തെ കഠിനമാക്കി. അവർ കണ്ണുകളാൽ കാണാതെയും ഹൃദയത്താൽ ഗ്രഹിക്കാതെയും തിരിയാതെയും[a] ഇരിക്കാനും, ഞാൻ അവരെ സൗഖ്യമാക്കാതിരിക്കാനും വേണ്ടിയാണ്[b].
