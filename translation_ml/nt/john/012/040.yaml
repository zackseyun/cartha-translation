id: JHN.12.40
reference: John 12:40
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τετύφλωκεν αὐτῶν τοὺς ὀφθαλμοὺς καὶ ⸀ἐπώρωσεν αὐτῶν τὴν καρδίαν, ἵνα μὴ ἴδωσιν τοῖς ὀφθαλμοῖς καὶ νοήσωσιν τῇ καρδίᾳ καὶ ⸀στραφῶσιν, καὶ ⸀ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/040.yaml
  text: He has blinded their eyes and hardened their heart[a], so that they may not see with their eyes and understand with their heart and turn[c][b], and I would heal them.
translation:
  language: ml
  text: അവൻ അവരുടെ കണ്ണുകളെ അന്ധമാക്കിയിരിക്കുന്നു; അവരുടെ ഹൃദയത്തെ കഠിനമാക്കി. അവർ കണ്ണുകളാൽ കാണാതെയും ഹൃദയത്താൽ ഗ്രഹിക്കാതെയും തിരിയാതെയും[a] ഇരിക്കാനും, ഞാൻ അവരെ സൗഖ്യമാക്കാതിരിക്കാനും വേണ്ടിയാണ്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മനംതിരിയാതെയും.’
    reason: lexical_alternative
  - marker: b
    text: 'ഈ വാക്യം യെശയ്യാവ് 6:10-നെ പ്രതിധ്വനിപ്പിക്കുന്നു. ‘ഞാൻ അവരെ സൗഖ്യമാക്കാതിരിക്കാനും’ എന്നത് ഉദ്ധരണിയിലെ നിഷേധിത ഉദ്ദേശ്യ/ഫലഘടനയെ വ്യക്തമാക്കുന്നു; ഗ്രീക്കിലെ ἰάσομαι അക്ഷരാർഥത്തിൽ ഭാവിരൂപമാണ്: ‘ഞാൻ അവരെ സൗഖ്യമാക്കും.’'
    reason: cross_reference_and_lexical_alternative
lexical_decisions:
- source_word: Τετύφλωκεν
  choice: അന്ധമാക്കിയിരിക്കുന്നു
  rationale: സമ്പൂർണകാലരൂപം പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴും നിലനിൽക്കുന്ന ഫലം സൂചിപ്പിക്കുന്നു; ‘അന്ധമാക്കിയിരിക്കുന്നു’ ആ ഭാവം നിലനിർത്തുന്നു.
- source_word: ἐπώρωσεν
  choice: കഠിനമാക്കുകയും ചെയ്തിരിക്കുന്നു
  rationale: πωρόω ഇവിടെ ഹൃദയത്തെ ഗ്രഹണശേഷിയില്ലാത്തതാക്കുന്ന കഠിനീകരണത്തെ സൂചിപ്പിക്കുന്നു. സ്വാഭാവികമായ മലയാളത്തോടൊപ്പം ദൈവിക പ്രവർത്തകത്വവും നിലനിർത്തുന്നു.
- source_word: καρδίαν / καρδίᾳ
  choice: ഹൃദയം / ഹൃദയംകൊണ്ട്
  rationale: കാർദിയയ്ക്ക് ഇവിടെ ബോധഗ്രഹണത്തിന്റെ അർഥവ്യാപ്തിയുണ്ടെങ്കിലും, ‘ഹൃദയം’ എന്ന ബൈബിൾപ്രതീകം നിലനിർത്തുന്നു; νοέωയ്ക്ക് നൽകിയ ‘ഗ്രഹിക്കുക’ ബൗദ്ധിക അംശം വ്യക്തമാക്കുന്നു.
- source_word: ἵνα μὴ
  choice: അതുകൊണ്ട് ... ചെയ്യാതിരിക്കട്ടെ
  rationale: ഉദ്ദേശ്യം/ഫലം സൂചിപ്പിക്കുന്ന നിർമ്മിതിയുടെ ശക്തി മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും വചനത്തിലെ ന്യായവിധിസംബന്ധമായ കടുപ്പം മയപ്പെടുത്താതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἴδωσιν τοῖς ὀφθαλμοῖς
  choice: കണ്ണുകൾകൊണ്ട് കാണുക
  rationale: മൂലത്തിലെ ദൃശ്യബിംബവും ‘ഹൃദയംകൊണ്ട് ഗ്രഹിക്കുക’ എന്ന സമാന്തരഘടനയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: νοήσωσιν
  choice: ഗ്രഹിക്കുക
  rationale: മാനസികമായി മനസ്സിലാക്കുക എന്ന അർഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: στραφῶσιν
  choice: തിരിയുക
  rationale: ക്രിയയുടെ വിശാലമായ പ്രവാചകപ്രയോഗം നിലനിർത്തുന്നു; ‘മനംതിരിയുക’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക രൂപം മുഖ്യവാചകത്തിൽ നിർബന്ധിക്കുന്നില്ല.
- source_word: ἰάσομαι
  choice: ഞാൻ അവരെ സൗഖ്യമാക്കുമായിരുന്നു
  rationale: ഗ്രീക്കിൽ ഭാവികാലരൂപമാണെങ്കിലും ἵνα μή എന്ന ഉദ്ദേശ്യ/ഫലഘടനയ്ക്കുള്ളിൽ സൗഖ്യമാക്കൽ സംഭവിക്കാതെ പോകുന്ന നിബന്ധനാത്മക ഫലം മലയാളത്തിൽ വ്യക്തമാക്കാൻ ഈ രൂപം ഉപയോഗിക്കുന്നു; രൂപപരമായ ബദൽ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: αὐτῶν τὴν καρδίαν
  choice: അവരുടെ ഹൃദയം
  rationale: ഗ്രീക്കിലെ ഏകവചനരൂപം സമൂഹത്തെ ഒന്നായി കാണുന്ന ഭാവത്തിൽ അതേപടി നിലനിർത്തുന്നു.
theological_decisions:
- issue: കണ്ണുകൾ അന്ധമാക്കുന്നതിലും ഹൃദയം കഠിനമാക്കുന്നതിലും ദൈവിക പ്രവർത്തകത്വം
  choice: ‘അവൻ ... അന്ധമാക്കിയിരിക്കുന്നു; ... കഠിനമാക്കുകയും ചെയ്തിരിക്കുന്നു’ എന്ന വ്യക്തമായ ഏകവചന കർത്താവ് നിലനിർത്തി.
  alternative: ദൈവിക പ്രവർത്തകത്വം മയപ്പെടുത്തുന്ന കർമണിപ്രയോഗം അല്ലെങ്കിൽ കർത്താവില്ലാത്ത പ്രയോഗം.
  rationale: ഗ്രീക്ക് ഉദ്ധരണിയിൽ ഏകവചന കർത്താവിനാണ് ഈ പ്രവൃത്തികൾ വ്യക്തമായി ചുമത്തിയിരിക്കുന്നത്. ദുഷ്കരമായ ന്യായവിധിസംബന്ധമായ ദൈവശാസ്ത്ര പിരിമുറുക്കം പരിഭാഷ മയപ്പെടുത്തുന്നില്ല.
- issue: στραφῶσιν എന്നതിലെ പരിവർത്തനഭാഷ
  choice: മുഖ്യവാചകത്തിൽ ‘തിരിയുക’.
  alternative: ‘മനംതിരിയുക’ അല്ലെങ്കിൽ ‘പരിവർത്തിതരാകുക’.
  rationale: സന്ദർഭത്തിൽ മടങ്ങിവരവ്/മാനസാന്തരം ഉൾപ്പെടാമെങ്കിലും ഗ്രീക്ക് ക്രിയ കൂടുതൽ വിശാലമാണ്. ‘തിരിയുക’ ആ അർഥവ്യാപ്തി നിലനിർത്തുന്നു; വ്യാഖ്യാനാത്മക ബദൽ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ἰάσομαι എന്ന ഭാവികാലരൂപവും ഉദ്ദേശ്യ/ഫലഘടനയും
  choice: മുഖ്യവാചകത്തിൽ നിബന്ധനാത്മകമായി ‘സൗഖ്യമാക്കുമായിരുന്നു’.
  alternative: രൂപപരമായി നേരിട്ടുള്ള ‘ഞാൻ അവരെ സൗഖ്യമാക്കും’.
  rationale: ഭാവികാലരൂപം അംഗീകരിച്ചുകൊണ്ട്, മുൻപുള്ള ἵνα μή ഘടനയിൽ ‘അവർ തിരിയുകയും ഞാൻ സൗഖ്യമാക്കുകയും ചെയ്യാതിരിക്കേണ്ടതിന്’ എന്ന അർഥബന്ധം തെറ്റിദ്ധരിക്കാതിരിക്കാൻ മലയാളത്തിലെ നിബന്ധനാത്മക രൂപം സ്വീകരിച്ചു; നേരിട്ടുള്ള രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘അന്ധമാക്കിയിരിക്കുന്നു’, ‘ഹൃദയം’, ‘സൗഖ്യമാക്കുക’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തിയപ്പോൾ വാക്യഘടന സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധം ക്രമപ്പെടുത്തി. മൂലത്തിലെ സമൂഹവാചക ഏകവചനമായ ‘അവരുടെ ഹൃദയം’ സംരക്ഷിച്ചു.
