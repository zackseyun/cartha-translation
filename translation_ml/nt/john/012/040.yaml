    rationale: ἵνα μή ഇവിടെ ‘അവർ ... ചെയ്യാതിരിക്കേണ്ടതിന്/ചെയ്യാതിരിക്കാനും’ എന്ന അർഥമാണ് നൽകുന്നത്; ‘അതുകൊണ്ട്’ കാരണഫലം സൂചിപ്പിക്കുന്നു, ‘-ട്ടെ’ അനുവദന/ആജ്ഞാസ്വരവും നൽകുന്നു.
