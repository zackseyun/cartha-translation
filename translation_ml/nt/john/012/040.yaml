  source_fidelity: തിരുത്തൽ ആവശ്യമാണ്. ‘അതുകൊണ്ട്’ മൂലത്തിലെ ἵνα μή-യുടെ ഉദ്ദേശ്യ/ഫലബന്ധത്തെ ‘therefore’ എന്ന കാരണ-ഫലബന്ധമാക്കി മാറ്റുന്നു; ‘ചെയ്യാതിരിക്കട്ടെ’ അനുചിതമായ ആജ്ഞാർഥവും സൃഷ്ടിക്കുന്നു. കൂടാതെ ἐπώρωσεν അഒറിസ്റ്റായതിനാൽ ‘കഠിനമാക്കി’ എന്ന രൂപം കൂടുതൽ നേരിട്ടാണ്. ἰάσομαι ഭാവിരൂപമാണ്; ഉദ്ധരണിയുടെ നിഷേധിത ഉദ്ദേശ്യഘടനയിൽ ‘സൗഖ്യമാക്കാതിരിക്കാനും’ എന്ന രൂപം സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു; ‘സൗഖ്യമാക്കുമായിരുന്നു’ മൂലത്തിൽ ഇല്ലാത്ത നിബന്ധനാരൂപം ചേർക്കുന്നു.
  naturalness: പരിഷ്കരിച്ച വാക്യം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികമാണ്. ‘അവർ ... ചെയ്യാതിരിക്കാനും ഞാൻ ... ചെയ്യാതിരിക്കാനും വേണ്ടിയാണ്’ എന്ന സമാന്തരഘടന മൂലത്തിലെ ഉദ്ദേശ്യവും നിഷേധത്തിന്റെ വ്യാപ്തിയും വ്യക്തമായി നിലനിർത്തുന്നു.
  terminology: ‘അന്ധമാക്കിയിരിക്കുന്നു,’ ‘ഹൃദയം,’ ‘ഗ്രഹിക്കുക,’ ‘തിരിയുക,’ ‘സൗഖ്യമാക്കുക’ എന്നിവ യോജിച്ച ബൈബിൾ-രജിസ്റ്ററിലുള്ള പ്രയോഗങ്ങളാണ്. ‘തിരിയുക’ στραφῶσιν-ന്റെ വ്യാഖ്യാനപരമായി തുറന്ന അർഥം നിലനിർത്തുന്നു; ‘മനംതിരിയുക’ അടിക്കുറിപ്പിൽ മാത്രമാക്കുന്നത് ഉചിതമാണ്.
