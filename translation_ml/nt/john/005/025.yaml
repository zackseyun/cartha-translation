id: JHN.5.25
reference: John 5:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι ἔρχεται ὥρα καὶ νῦν ἐστιν ὅτε οἱ νεκροὶ ⸀ἀκούσουσιν τῆς φωνῆς τοῦ υἱοῦ τοῦ θεοῦ καὶ οἱ ἀκούσαντες ⸀ζήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/025.yaml
  text: Truly[a], truly, I say to you that an hour is coming, and now is, when the dead will hear the voice of the Son of God[d][c][b], and those who hear will live.
translation:
  language: ml
  text: 'സത്യമായി[a], സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: ഒരു നാഴിക[b] വരുന്നു; അത് ഇപ്പോൾത്തന്നെയാണ്. അപ്പോൾ മരിച്ചവർ[c] ദൈവത്തിന്റെ പുത്രന്റെ ശബ്ദം കേൾക്കും; കേൾക്കുന്നവർ[d] ജീവിക്കും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ ഔപചാരികമായി: ‘ആമേൻ, ആമേൻ, ഞാൻ നിങ്ങളോടു പറയുന്നു.’'
    reason: lexical_alternative
  - marker: b
    text: ‘നാഴിക’ എന്നത് ഇവിടെ കൂടുതൽ വിശാലമായി ‘സമയം’ എന്നും മനസ്സിലാക്കാം; എന്നാൽ ഗ്രീക്കിൽ പ്രത്യേകമായി ‘നാഴിക’ എന്നാണ്.
    reason: lexical_alternative
  - marker: c
    text: ‘അത് ഇപ്പോൾത്തന്നെയാണ്’ എന്നതിനാൽ ‘മരിച്ചവർ’ എന്നതിന് ഇവിടെ വർത്തമാനകാല ആത്മീയ അർഥവും ഉണ്ടായിരിക്കാം; അതേസമയം ചുറ്റുമുള്ള സന്ദർഭത്തിൽ ഇത് ശാരീരിക പുനരുത്ഥാനത്തെയും മുൻകൂട്ടി സൂചിപ്പിക്കുന്നു.
    reason: cross_reference
  - marker: d
    text: 'അല്ലെങ്കിൽ: ‘കേട്ടവർ ജീവിക്കും.’ ഗ്രീക്കിലെ കൃതന്തരൂപം അക്ഷരാർഥത്തിൽ മുൻകൃതമായ കേൾവിയെ സൂചിപ്പിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: സത്യമായി, സത്യമായി
  rationale: യേശുവിന്റെ ഗൗരവപൂർണമായ ഉറപ്പുനൽകൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാകുന്ന വിധത്തിൽ നൽകുകയും ഗ്രീക്കിലെ ആവർത്തനം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: നേരിട്ടുള്ള അഭിസംബോധനയും യോഹന്നാന്റെ ഔപചാരികമായ വാക്യലയവും നിലനിർത്തുന്നു.
- source_word: ἔρχεται ὥρα
  choice: ഒരു നാഴിക വരുന്നു
  rationale: അനിർദ്ദിഷ്ടമായ ὥραയെ ‘ഒരു നാഴിക’ എന്നു നൽകുന്നു; യോഹന്നാനിൽ പ്രാധാന്യമുള്ള ‘നാഴിക’ എന്ന ആശയം പൊതുവായ ‘സമയം’ എന്നാക്കി ലഘൂകരിക്കുന്നില്ല.
- source_word: καὶ νῦν ἐστιν
  choice: അത് ഇപ്പോൾത്തന്നെയാണ്
  rationale: വരാനിരിക്കുന്നതും ഇതിനകം ഇപ്പോഴുള്ളതുമായ യാഥാർഥ്യങ്ങൾ തമ്മിലുള്ള ഉദ്ദേശ്യപൂർണമായ സംഘർഷം വ്യാഖ്യാനിച്ച് നീക്കാതെ, മലയാളത്തിൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: οἱ νεκροὶ
  choice: മരിച്ചവർ
  rationale: ശാരീരികമായും ആത്മീയമായും ഗ്രഹിക്കാവുന്ന സൂചനകളെ പരിമിതപ്പെടുത്താതെ മൂലപദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
- source_word: ἀκούσουσιν τῆς φωνῆς
  choice: ശബ്ദം കേൾക്കും
  rationale: വ്യക്തിപരമായ സംസാരത്തിന്റെ സന്ദർഭത്തിൽ φωνή എന്നത് ‘ശബ്ദം’ എന്നു സ്വാഭാവികമായി നൽകുന്നു; ἀκούωയുടെ അടിസ്ഥാന അർഥമായ ‘കേൾക്കുക’ നിലനിർത്തുന്നു.
- source_word: τοῦ υἱοῦ τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ പുത്രന്റെ
  rationale: മൂലഭാഷയിലെ പൂർണമായ ക്രിസ്തുശാസ്ത്രപരമായ സ്ഥാനനാമം വ്യക്തവും നേരിട്ടുമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: οἱ ἀκούσαντες
  choice: കേൾക്കുന്നവർ
  rationale: അയോറിസ്റ്റ് കൃതന്തത്തിന്റെ മുൻകൃത്യത മലയാളത്തിൽ ‘കേട്ടവർ’ എന്നു നൽകാനാകുമെങ്കിലും, ഭാവികാല ഫലവുമായി ബന്ധപ്പെട്ട പൊതുവായ വ്യവസ്ഥയായി ഇവിടെ ‘കേൾക്കുന്നവർ’ കൂടുതൽ സ്വാഭാവികമാണ്.
- source_word: ζήσουσιν
  choice: ജീവിക്കും
  rationale: ζάωയുടെ നേരിട്ടുള്ള അർഥം നൽകുന്നു; ‘ജീവനിലേക്കു വരും’ എന്നു പരിഭാഷപ്പെടുത്തി പുനരുത്ഥാനത്തെ മാത്രം മുൻനിർത്തുന്നില്ല.
theological_decisions:
- issue: ‘മരിച്ചവർ’ എന്നതിന്റെ സന്ദർഭപരമായ സൂചന
  choice: വ്യാഖ്യാനപരമായ വിശേഷണം ചേർക്കാതെ ‘മരിച്ചവർ’ എന്നു നിലനിർത്തി.
  alternative: ‘ആത്മീയമായി മരിച്ചവർ’ അല്ലെങ്കിൽ ‘ശാരീരികമായി മരിച്ചവർ’
  rationale: ‘അത് ഇപ്പോൾത്തന്നെയാണ്’ എന്നത് വർത്തമാനകാല ജീവദാനത്തെ സൂചിപ്പിക്കുമ്പോൾ, ചുറ്റുമുള്ള സന്ദർഭം ഭാവിയിലെ ശാരീരിക പുനരുത്ഥാനത്തെയും സൂചിപ്പിക്കുന്നു. പരിഭാഷ ഈ പിരിമുറുക്കം നിലനിർത്തുന്നു.
- issue: ‘ദൈവത്തിന്റെ പുത്രൻ’ എന്ന ക്രിസ്തുശാസ്ത്രപരമായ സ്ഥാനനാമം
  choice: ‘ദൈവത്തിന്റെ പുത്രൻ’ എന്ന പൂർണരൂപം നിലനിർത്തി.
  alternative: ‘ദൈവപുത്രൻ’
  rationale: ഗ്രീക്ക് പദക്രമത്തിന്റെ ബന്ധം വ്യക്തമായി പ്രതിഫലിപ്പിക്കുകയും അധിക വ്യാഖ്യാനപദങ്ങൾ ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: വർത്തമാനവും ഭാവിയും തമ്മിലുള്ള കാലപരമായ പിരിമുറുക്ക്
  choice: ‘ഒരു നാഴിക വരുന്നു; അത് ഇപ്പോൾത്തന്നെയാണ്’ എന്നു നൽകി.
  alternative: ‘ആ നാഴിക ഇപ്പോൾ വന്നിരിക്കുന്നു’
  rationale: വരുന്നു എന്ന ഭാവിമുഖവും ഇപ്പോൾ ആണ് എന്ന വർത്തമാനയാഥാർഥ്യവും ഒരുമിച്ചു നിലനിർത്തുന്നു; ‘വന്നിരിക്കുന്നു’ എന്നത് ഈ പിരിമുറുക്ക് ഭാഗികമായി പരിഹരിച്ചുകളയും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. യോഹന്നാന്റെ ആവർത്തനശൈലിയും വർത്തമാന-ഭാവി പിരിമുറുക്കവും കഴിയുന്നത്ര നിലനിർത്തിയിട്ടുണ്ട്; മതവിഭാഗപരമായ വ്യാഖ്യാനം ഒഴിവാക്കി.
