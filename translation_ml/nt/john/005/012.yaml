id: JHN.5.12
reference: John 5:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἠρώτησαν ⸀οὖν αὐτόν· Τίς ἐστιν ὁ ἄνθρωπος ὁ εἰπών σοι· ⸀Ἆρον καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/012.yaml
  text: So they asked him[a], “Who is the man who said to you, ‘Pick it up and walk’?”
translation:
  language: ml
  text: 'അപ്പോൾ അവർ അവനോട് ചോദിച്ചു: “നിന്നോട്, ‘എടുത്ത് നടക്കുക’ എന്നു പറഞ്ഞ ആ മനുഷ്യൻ ആരാണ്?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഗ്രീക്കിൽ അക്ഷരാർഥം: “എടുക്കുക, നടക്കുക.” എന്താണ് എടുക്കേണ്ടതെന്ന് ഇവിടെ പ്രത്യേകം പറഞ്ഞിട്ടില്ല; മുൻസന്ദർഭത്തിൽ അത് ആ മനുഷ്യൻ കിടന്നിരുന്ന കിടക്കപ്പായയെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρώτησαν
  choice: ചോദിച്ചു
  rationale: ἐρωτάω എന്ന ക്രിയയുടെ ഭൂതകാല ബഹുവചനരൂപം. സന്ദർഭത്തിൽ ശത്രുത അനാവശ്യമായി ശക്തിപ്പെടുത്താതെ സ്വാഭാവികമായി ചോദ്യം ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: οὖν
  choice: അതിനാൽ
  rationale: മുൻവാക്യത്തിൽ നിന്നുള്ള യുക്തിപരവും ആഖ്യാനപരവുമായ തുടർച്ച വ്യക്തമാക്കുന്നു.
- source_word: αὐτόν
  choice: അവനോട്
  rationale: സൗഖ്യം ലഭിച്ച മനുഷ്യനെയാണ് ഈ ഏകവചന സർവനാമം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ചോദിക്കുക എന്ന ക്രിയയോടൊപ്പം ദാതൃവിഭക്തി സ്വാഭാവികമാണ്.
- source_word: Τίς ἐστιν ὁ ἄνθρωπος
  choice: ആ മനുഷ്യൻ ആരാണ്?
  rationale: ഒരു നിർദിഷ്ട പുരുഷനെക്കുറിച്ചുള്ള നേരിട്ടുള്ള ചോദ്യം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: ὁ εἰπών σοι
  choice: നിന്നോട് ... എന്നു പറഞ്ഞ
  rationale: നിർദിഷ്ട മനുഷ്യനെ അവൻ മുമ്പ് പറഞ്ഞ വാക്കുകളാൽ തിരിച്ചറിയിക്കുന്ന വിശേഷണാത്മക കൃദന്തരൂപത്തിന്റെ പ്രവർത്തനം നിലനിർത്തുന്നു.
- source_word: Ἆρον
  choice: എടുത്തുകൊണ്ട്
  rationale: αἴρω എന്ന ക്രിയയുടെ ആജ്ഞാരൂപം ‘എടുക്കുക’ എന്ന അർത്ഥത്തിൽ പരിഭാഷപ്പെടുത്തി. ഗ്രീക്കിൽ കർമം പ്രകടമായി ഇല്ലാത്തതിനാൽ മലയാളത്തിലും അത് ചേർക്കാതെ സന്ദർഭത്തിൽ നിന്ന് മനസ്സിലാക്കാൻ വിട്ടിരിക്കുന്നു.
- source_word: καὶ περιπάτει
  choice: നടക്കുക
  rationale: περιπατέω എന്ന വർത്തമാനകാല ആജ്ഞയുടെ അടിസ്ഥാന അർത്ഥം നിലനിർത്തുന്നു; ക്രിയാഭാവത്തെ ‘തുടർന്നും നടക്കുക’ എന്നു വ്യാഖ്യാനിച്ച് അധികമാക്കുന്നില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. മൂലത്തിലെ നേരിട്ടുള്ള ചോദ്യഘടനയും പ്രകടമായി പറയാത്ത കർമവും നിലനിർത്തിയിരിക്കുന്നു.
