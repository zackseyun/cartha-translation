id: JHN.5.19
reference: John 5:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀπεκρίνατο οὖν ὁ Ἰησοῦς καὶ ⸀ἔλεγεν αὐτοῖς· Ἀμὴν ἀμὴν λέγω ὑμῖν, οὐ δύναται ὁ υἱὸς ποιεῖν ἀφ’ ἑαυτοῦ οὐδὲν ⸀ἐὰν μή τι βλέπῃ τὸν πατέρα ποιοῦντα· ἃ γὰρ ἂν ἐκεῖνος ποιῇ, ταῦτα καὶ ὁ υἱὸς ὁμοίως ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/019.yaml
  text: So Jesus answered and said to them[a], “Truly, truly, I say to you, the Son is not able to do anything from himself unless he sees the Father doing it; for whatever that one does[b], these things the Son also does likewise.”
translation:
  language: ml
  text: 'അതുകൊണ്ട് യേശു അവരോടു മറുപടിയായി പറഞ്ഞു: “സത്യമായി, സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: പിതാവ് ചെയ്യുന്നതു കാണുന്നതല്ലാതെ പുത്രന് സ്വന്തം നിലയിൽ ഒന്നും ചെയ്യാൻ കഴിയുകയില്ല[a]. പിതാവ് എന്തു ചെയ്യുന്നുവോ, അതുതന്നെ പുത്രനും അതുപോലെ ചെയ്യുന്നു[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ സംസാരഭാഷാപരമായി: “പിതാവ് ചെയ്യുന്നതു കാണുന്നതല്ലാതെ പുത്രന് തനിയെ ഒന്നും ചെയ്യാൻ കഴിയുകയില്ല.”'
    reason: lexical_alternative
  - marker: b
    text: പിതാവ് ചെയ്യുന്നതും പുത്രൻ ചെയ്യുന്നതും തമ്മിലുള്ള പൂർണമായ പ്രവർത്തനപൊരുത്തമാണ് ഇവിടെ ഊന്നിപ്പറയുന്നത്.
    reason: cross_reference
lexical_decisions:
- source_word: Ἀπεκρίνατο οὖν ὁ Ἰησοῦς καὶ ἔλεγεν αὐτοῖς
  choice: അതുകൊണ്ട് യേശു അവരോടു മറുപടിയായി പറഞ്ഞു
  rationale: οὖν-ന്റെ സന്ദർഭബന്ധം ‘അതുകൊണ്ട്’ നിലനിർത്തുന്നു. ἀπεκρίνατο καὶ ἔλεγεν എന്ന ഗ്രീക്ക് പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായ ഏക പ്രസ്താവനാക്രിയയായി നൽകി; അപൂർണ്ണകാലത്തെ കൃത്രിമമായി ദീർഘപ്രയോഗമാക്കിയില്ല.
- source_word: Ἀμὴν ἀμὴν λέγω ὑμῖν
  choice: സത്യമായി, സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: ഇരട്ട ആവർത്തനത്തിന്റെ ഗൗരവവും ഊന്നലും സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: οὐ δύναται ὁ υἱὸς ποιεῖν ἀφ’ ἑαυτοῦ οὐδέν
  choice: പുത്രന് സ്വന്തം നിലയിൽ ഒന്നും ചെയ്യാൻ കഴിയുകയില്ല
  rationale: δύναται-യിലെ കഴിവിനെ സംബന്ധിച്ച അർഥവും ἀφ’ ἑαυτοῦ-യിലെ സ്വതന്ത്ര ഉറവിടം/പ്രവർത്തനം എന്ന ആശയവും നിലനിർത്തുന്നു; വെറും അനുമതിയില്ലായ്മയെന്ന ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: ἐὰν μή τι βλέπῃ τὸν πατέρα ποιοῦντα
  choice: പിതാവ് ചെയ്യുന്നതായി കാണുന്നതല്ലാതെ
  rationale: ഗ്രീക്കിലെ വ്യവസ്ഥാപരമായ അപവാദം മലയാളത്തിലെ സ്വാഭാവിക ‘...അല്ലാതെ’ ഘടനയിൽ നൽകുന്നു. τι-യുടെ അനിശ്ചിതത്വം ‘ചെയ്യുന്നത്’ എന്ന പൊതുവായ രൂപത്തിൽ നിലനിൽക്കുന്നു.
- source_word: ἃ γὰρ ἂν ἐκεῖνος ποιῇ
  choice: ആ ഒരുവൻ ചെയ്യുന്നതെന്തും
  rationale: ἃ ... ἂν എന്ന പൊതുവ്യാപകമായ ‘എന്തും’ എന്ന അർഥവും ἐκεῖνος-ന്റെ സൂചനാത്മക ഊന്നലും സംരക്ഷിക്കുന്നു.
- source_word: ταῦτα καὶ ὁ υἱὸς ὁμοίως ποιεῖ
  choice: പുത്രനും അതുപോലെതന്നെ ചെയ്യുന്നു
  rationale: καί, ὁμοίως എന്നിവയിലെ സമാനപ്രവർത്തനത്തിന്റെ ശക്തമായ ഒത്തുപോക്ക് ‘-നും അതുപോലെതന്നെ’ എന്ന രൂപത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: പുത്രന്റെ പ്രവർത്തനപരമായ ആശ്രിതത്വം അദ്ദേഹത്തിന്റെ സത്താപരമായ അധമത്വമായി തെറ്റിദ്ധരിക്കപ്പെടാനുള്ള സാധ്യത
  choice: പുത്രന് സ്വന്തം നിലയിൽ ഒന്നും ചെയ്യാൻ കഴിയുകയില്ല
  alternative: പുത്രൻ തനിയെ ഒന്നും ചെയ്യുന്നില്ല
  rationale: മൂലപാഠത്തിലെ οὐ δύναται എന്ന ശക്തമായ ‘കഴിയുകയില്ല’ നിലനിർത്തുകയും, ἀφ’ ἑαυτοῦ-നെ ‘സ്വന്തം നിലയിൽ’ എന്നു നൽകി പിതാവിൽനിന്ന് വേർപെട്ട സ്വതന്ത്രപ്രവർത്തനമാണ് നിഷേധിക്കപ്പെടുന്നതെന്ന് വ്യക്തമാക്കുകയും ചെയ്യുന്നു. വാക്യത്തിന്റെ യഥാർഥ ദൈവശാസ്ത്രപരമായ സംഘർഷം മായ്ച്ചുകളയുന്നില്ല.
- issue: ὁ υἱός, τὸν πατέρα എന്നീ ബന്ധപദങ്ങളുടെ സ്ഥാനനാമസ്വഭാവം
  choice: പുത്രൻ / പിതാവ്
  alternative: മകൻ / അപ്പൻ
  rationale: യോഹന്നാന്റെ സന്ദർഭത്തിൽ ഇവ യേശുവിനെയും ദൈവത്തെയും സൂചിപ്പിക്കുന്ന പ്രത്യേക ബന്ധപദങ്ങളാണ്. ‘പുത്രൻ/പിതാവ്’ ആ ഗൗരവവും തിരിച്ചറിയലും നിലനിർത്തുന്നു; മലയാള ലിപിയിൽ വലിയക്ഷരവ്യത്യാസമില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. യോഹന്നാന്റെ ആവർത്തനവും പിതാവ്–പുത്രൻ ബന്ധത്തിന്റെ ഊന്നലും നിലനിർത്തി; ഗ്രീക്ക് വാക്യഘടനയുടെ അസ്വാഭാവിക കാഠിന്യം മലയാളത്തിലേക്ക് പകർത്തിയിട്ടില്ല.
