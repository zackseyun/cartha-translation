source:
  edition: SBLGNT
  text: ἐκεῖνος ἦν ὁ λύχνος ὁ καιόμενος καὶ φαίνων, ὑμεῖς δὲ ἠθελήσατε ἀγαλλιαθῆναι πρὸς ὥραν ἐν τῷ φωτὶ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/035.yaml
  text: He was the lamp that was burning and shining[a], and you were willing to rejoice for a time in his light.
translation:
  language: ml
  text: അവൻ കത്തിക്കൊണ്ടിരുന്നതും പ്രകാശിച്ചുകൊണ്ടിരുന്നതുമായ വിളക്കായിരുന്നു; എന്നാൽ നിങ്ങൾ അല്പകാലത്തേക്ക് അവന്റെ വെളിച്ചത്തിൽ ആനന്ദിക്കാൻ ആഗ്രഹിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കുറച്ചുകാലത്തേക്ക്.” ഈ പ്രയോഗം അക്ഷരാർഥത്തിൽ ഒരു മണിക്കൂർ എന്നല്ല, പരിമിതമായ ഒരു കാലയളവിനെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: λύχνος
  choice: വിളക്ക്
  rationale: ഇത് വെളിച്ചം എന്ന അമൂർത്ത ആശയത്തെയല്ല, കത്തിച്ചുവെക്കുന്ന വിളക്കിനെയാണ് സൂചിപ്പിക്കുന്നത്. യോഹന്നാൻ വെളിച്ചമല്ല, വെളിച്ചം നൽകുന്ന സാക്ഷിയാണെന്ന വ്യത്യാസവും ഇതിലൂടെ നിലനിൽക്കുന്നു.
- source_word: καιόμενος καὶ φαίνων
  choice: കത്തുകയും പ്രകാശിക്കുകയും ചെയ്ത
  rationale: രണ്ട് വർത്തമാന കൃദന്തരൂപങ്ങളും വിളക്കിന്റെ തുടർച്ചയായ പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായി ഈ കൂട്ടുപ്രയോഗം ആ അർഥം നൽകുന്നു.
- source_word: ἠθελήσατε
  choice: മനസ്സുവെച്ചു
  rationale: ക്രിയയിൽ അടങ്ങിയിരിക്കുന്ന ആഗ്രഹം, സന്നദ്ധത, മനഃപൂർവമായ പ്രതികരണം എന്നിവയെ അതിശയോക്തിയില്ലാതെ പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀγαλλιαθῆναι
  choice: ആനന്ദിക്കാൻ
  rationale: ശക്തമായ സന്തോഷത്തെ സൂചിപ്പിക്കുന്ന ക്രിയയ്ക്ക് സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാള പദം.
- source_word: πρὸς ὥραν
  choice: അല്പകാലത്തേക്ക്
  rationale: അക്ഷരാർഥത്തിലുള്ള ഒരു മണിക്കൂറല്ല, പരിമിതമായ ഒരു കാലയളവാണ് ഈ പ്രയോഗത്തിന്റെ സന്ദർഭോചിത അർഥം.
- source_word: ἐν τῷ φωτὶ αὐτοῦ
  choice: അവന്റെ വെളിച്ചത്തിൽ
  rationale: ἐν എന്ന സ്ഥലാത്മക രൂപകവും യോഹന്നാന്റെ പ്രകാശം/സാക്ഷ്യം മൂലം ലഭിച്ച ആനന്ദവും നിലനിർത്തുന്നു.
- source_word: ἐκεῖνος
  choice: അവൻ
  rationale: മുൻസന്ദർഭത്തിലെ യോഹന്നാനെ ഊന്നലോടെ സൂചിപ്പിക്കുന്ന സർവനാമം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: യോഹന്നാനും യേശുവും സംബന്ധിച്ച വെളിച്ചത്തിന്റെ രൂപകത്തിലുള്ള വ്യത്യാസം
  choice: യോഹന്നാനെ “വിളക്ക്” എന്നു വിവർത്തനം ചെയ്തു; “വെളിച്ചം” എന്നു ചെയ്തില്ല.
  alternative: അവൻ വെളിച്ചമായിരുന്നു
  rationale: ഗ്രീക്കിൽ യോഹന്നാനെക്കുറിച്ച് λύχνος എന്നും അവന്റെ പ്രകാശത്തെക്കുറിച്ച് φῶς എന്നും വ്യത്യസ്ത പദങ്ങളാണ് ഉപയോഗിച്ചിരിക്കുന്നത്. യോഹന്നാൻ വെളിച്ചത്തിനു സാക്ഷിയാകുന്ന അധീനമായ പ്രകാശവാഹകനാണെന്ന യോഹന്നാനീയ വ്യത്യാസം അധിക വ്യാഖ്യാനം ചേർക്കാതെ ഇതിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം മാന്യവുമായ ശൈലി. വിളക്ക്/വെളിച്ചം എന്ന രൂപകവ്യത്യാസവും പ്രതികരണത്തിന്റെ താൽക്കാലിക സ്വഭാവവും സംരക്ഷിച്ചു.
