- from: അവൻ കത്തുകയും പ്രകാശിക്കുകയും ചെയ്ത വിളക്കായിരുന്നു; എന്നാൽ നിങ്ങൾ അല്പകാലത്തേക്ക് അവന്റെ വെളിച്ചത്തിൽ ആനന്ദിക്കാൻ മനസ്സുവെച്ചു.[a]
  to: അവൻ കത്തിക്കൊണ്ടിരുന്നതും പ്രകാശിച്ചുകൊണ്ടിരുന്നതുമായ വിളക്കായിരുന്നു; എന്നാൽ നിങ്ങൾ അല്പകാലത്തേക്ക് അവന്റെ വെളിച്ചത്തിൽ ആനന്ദിക്കാൻ ആഗ്രഹിച്ചു.[a]
