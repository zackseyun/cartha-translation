id: JHN.5.9
reference: John 5:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εὐθέως ἐγένετο ὑγιὴς ὁ ἄνθρωπος καὶ ἦρε τὸν κράβαττον αὐτοῦ καὶ περιεπάτει. Ἦν δὲ σάββατον ἐν ἐκείνῃ τῇ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/009.yaml
  text: And immediately the man became well[a], and he picked up his mat and began to walk[c][b]. Now that day was a Sabbath.
translation:
  language: ml
  text: ഉടനെ ആ മനുഷ്യൻ സുഖം പ്രാപിച്ചു. അവൻ തന്റെ പായ[a] എടുത്ത് നടക്കാൻ തുടങ്ങി.[b] ആ ദിവസം ശബ്ബത്തായിരുന്നു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കിടപ്പുപായ.’ ഗ്രീക്ക് പദം വലിയ കട്ടിലിനെയല്ല, സാധാരണയായി ലളിതവും എടുത്തുകൊണ്ടുപോകാവുന്നതുമായ പായയെയോ മെത്തപ്പായയെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘നടന്നുകൊണ്ടിരുന്നു.’ ഗ്രീക്ക് അപൂർണ്ണഭൂതകാലരൂപം തുടർന്ന പ്രവൃത്തിയെ ഊന്നിക്കാട്ടാം; ഇവിടെ രോഗശാന്തിക്കുശേഷം അവൻ നടക്കാൻ തുടങ്ങിയതായും മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: c
    text: 'ഗ്രീക്കിൽ അക്ഷരാർഥം: ‘ആ ദിവസം ശബ്ബത്തായിരുന്നു.’ ‘ആ ദിവസം ശബ്ബത്തുദിവസമായിരുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം.'
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθέως
  choice: ഉടനെ
  rationale: രോഗശാന്തി തൽക്ഷണം സംഭവിച്ചതായി സ്വാഭാവികവും വ്യക്തവുമായി അറിയിക്കുന്നു.
- source_word: ἐγένετο ὑγιὴς
  choice: സുഖം പ്രാപിച്ചു
  rationale: ‘സുഖമുള്ളവനായി’ എന്ന അക്ഷരാർഥത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത കർമകർത്താവിനെ കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: ὁ ἄνθρωπος
  choice: ആ മനുഷ്യൻ
  rationale: സന്ദർഭത്തിലെ നിർദിഷ്ട പുരുഷനെ ലിംഗസൂചനയോടെ വ്യക്തമാക്കുന്നു.
- source_word: ἦρε
  choice: എടുത്ത്
  rationale: പായ ഉയർത്തി കൈവശമാക്കുകയോ കൊണ്ടുപോകുകയോ ചെയ്ത പ്രവൃത്തിയെ ലളിതമായി സൂചിപ്പിക്കുന്നു.
- source_word: κράβαττον
  choice: പായ
  rationale: വലിയ കട്ടിലിനേക്കാൾ, എടുത്തുകൊണ്ടുപോകാവുന്ന ലളിതമായ കിടപ്പുപായയെയോ മെത്തപ്പായയെയോ സൂചിപ്പിക്കുന്ന പദമാണിത്.
- source_word: περιεπάτει
  choice: നടക്കാൻ തുടങ്ങി
  rationale: അപൂർണ്ണഭൂതകാലരൂപം തുടർന്ന പ്രവൃത്തിയെയോ പ്രവൃത്തിയുടെ ആരംഭത്തെയോ സൂചിപ്പിക്കാം; രോഗശാന്തിയുടെ സന്ദർഭത്തിൽ നടക്കാനുള്ള ശേഷി ഉടൻ ഉപയോഗിക്കാൻ തുടങ്ങിയതിനെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: Ἦν δὲ
  choice: ആ ദിവസം ... ആയിരുന്നു
  rationale: δέ ഇവിടെ ശക്തമായ വൈരുധ്യത്തേക്കാൾ തുടർന്നുള്ള സംഭവങ്ങൾക്ക് പശ്ചാത്തലം ഒരുക്കുന്ന വിവരണക്കുറിപ്പാണ്; മലയാളത്തിൽ പ്രത്യേക ബന്ധകമില്ലാതെയുള്ള പുതിയ വാക്യം ഈ മാറ്റം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: σάββατον
  choice: ശബ്ബത്ത്
  rationale: യഹൂദരുടെ വിശുദ്ധ വിശ്രമദിവസത്തെ സൂചിപ്പിക്കുന്ന പരിചിതമായ മലയാളരൂപം; ഗ്രീക്കിലെ അനിശ്ചിതത്വം മലയാളത്തിൽ അനാവശ്യമായി ‘ഒരു’ ചേർക്കാതെ നിലനിർത്തുന്നു.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: ആ ദിവസം
  rationale: ഗ്രീക്ക് കാലസൂചക പ്രയോഗത്തിന്റെ കൃത്യവും സ്വാഭാവികവുമായ മലയാളരൂപം.
theological_decisions:
- issue: വിവരണസന്ദർഭത്തിൽ σάββατον എന്നതിന്റെ പരിഭാഷ
  choice: ആ ദിവസം ശബ്ബത്തായിരുന്നു
  alternative: ആ ദിവസം ഒരു ശബ്ബത്തുദിവസമായിരുന്നു / ആ ദിവസം ശബ്ബത്തുദിവസമായിരുന്നു
  rationale: ഗ്രീക്കിൽ പദത്തിന് നിർദേശക ഉപപദമില്ലെങ്കിലും മലയാളത്തിൽ ‘ഒരു’ ചേർത്താൽ പ്രത്യേകതരം ശബ്ബത്തുദിവസം എന്ന അനാവശ്യ ധ്വനി വരാം. തെരഞ്ഞെടുത്ത രൂപം ആ ദിവസത്തെ ശബ്ബത്തായി തിരിച്ചറിയിക്കുകയും തുടർന്നുള്ള തർക്കത്തിനുള്ള പശ്ചാത്തലം നിലനിർത്തുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പായ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായതിനാൽ സ്വീകരിച്ചു; ‘കട്ടിൽ’ എന്നത് വലിപ്പമുള്ള ഫർണിച്ചർ എന്ന തെറ്റായ ചിത്രം നൽകാം. ഗ്രീക്ക് ക്രിയാകാലത്തിന്റെ ഭാവവ്യത്യാസവും ശബ്ബത്ത് പ്രയോഗത്തിന്റെ രൂപഭേദവും അടിക്കുറിപ്പുകളിൽ തുറന്നുവെച്ചിരിക്കുന്നു.
