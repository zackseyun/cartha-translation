id: JHN.5.39
reference: John 5:39
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐραυνᾶτε τὰς γραφάς, ὅτι ὑμεῖς δοκεῖτε ἐν αὐταῖς ζωὴν αἰώνιον ἔχειν· καὶ ἐκεῖναί εἰσιν αἱ μαρτυροῦσαι περὶ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/039.yaml
  text: You search the Scriptures because you think that in them you have eternal life[a]; and these are the ones that testify about me.
translation:
  language: ml
  text: നിങ്ങൾ തിരുവെഴുത്തുകൾ പരിശോധിക്കുന്നു; കാരണം അവയിൽ നിങ്ങൾക്ക് നിത്യജീവൻ ഉണ്ടെന്ന് നിങ്ങൾ കരുതുന്നു.[a] എന്നെക്കുറിച്ച് സാക്ഷ്യം പറയുന്നത് അവ തന്നെയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, Ἐραυνᾶτε എന്നത് സൂചകാർഥത്തിനു പകരം ആജ്ഞാർഥമായി എടുത്താൽ: “തിരുവെഴുത്തുകൾ പരിശോധിക്കൂ; അവയിൽ നിങ്ങൾക്ക് നിത്യജീവൻ ഉണ്ടെന്ന് നിങ്ങൾ കരുതുന്നുവല്ലോ.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐραυνᾶτε
  choice: നിങ്ങൾ ... പരിശോധിക്കുന്നു
  rationale: രൂപം വർത്തമാനകാല സൂചകമായോ ആജ്ഞാർഥമായോ ഗ്രഹിക്കാം. തുടർന്നുള്ള ὅτι-വാക്യം അവരുടെ ഇപ്പോഴത്തെ പ്രവൃത്തിയുടെ കാരണം വിശദീകരിക്കുന്നതിനാൽ പ്രധാനപാഠത്തിൽ സൂചകാർഥം സ്വീകരിച്ചു; ആജ്ഞാർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: τὰς γραφάς
  choice: തിരുവെഴുത്തുകൾ
  rationale: യോഹന്നാന്റെ പ്രയോഗത്തിൽ ഇത് ഇസ്രായേലിന്റെ വിശുദ്ധലിഖിതങ്ങളെ സൂചിപ്പിക്കുന്നു; ആ അർഥം സ്വാഭാവികമായി നൽകുന്ന സ്ഥിരപ്രയോഗമാണ് ‘തിരുവെഴുത്തുകൾ’.
- source_word: ὅτι
  choice: കാരണം
  rationale: അവർ തിരുവെഴുത്തുകൾ പരിശോധിക്കുന്നതിന്റെ കാരണം തുടർന്നുള്ള വാക്യം നൽകുന്നതിനാൽ ഇവിടെ കാരണാർഥം യോജിക്കുന്നു.
- source_word: δοκεῖτε
  choice: നിങ്ങൾ കരുതുന്നു
  rationale: അവരുടെ ധാരണയെയോ അനുമാനത്തെയോ സൂചിപ്പിക്കുന്നു; വിമർശനസ്വരം അതിരുകടക്കാതെ നിലനിർത്തുന്നു.
- source_word: ἐν αὐταῖς
  choice: അവയിൽ
  rationale: ἐν എന്നതിന്റെ സ്ഥാനാർഥം നേരിട്ട് നിലനിർത്തുകയും മുൻപുള്ള ‘തിരുവെഴുത്തുകൾ’ എന്നതിലേക്കു വ്യക്തമായി തിരിച്ചുചൂണ്ടുകയും ചെയ്യുന്നു.
- source_word: ζωὴν αἰώνιον
  choice: നിത്യജീവൻ
  rationale: യോഹന്നാനിലെ ഈ പ്രധാന പദസമുച്ചയത്തിന് മലയാളത്തിൽ സ്വാഭാവികവും സ്ഥിരവുമായ തുല്യപ്രയോഗം.
- source_word: ἐκεῖναί
  choice: അവ തന്നെയാണ്
  rationale: സ്ത്രീലിംഗ ബഹുവചന സർവനാമം തിരുവെഴുത്തുകളിലേക്കു തിരിച്ചുചൂണ്ടുന്നു; ‘തന്നെയാണ്’ മൂലത്തിലെ ഊന്നൽ പ്രകടമാക്കുന്നു.
- source_word: αἱ μαρτυροῦσαι
  choice: സാക്ഷ്യം പറയുന്നത്
  rationale: μαρτυρέω എന്ന യോഹന്നാനിലെ പ്രധാന സാക്ഷ്യപദത്തിന്റെ നിയമപരവും സാക്ഷ്യപരവുമായ ഭാവം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: περὶ ἐμοῦ
  choice: എന്നെക്കുറിച്ച്
  rationale: περί + genitive എന്നതിന്റെ ‘എന്നെ സംബന്ധിച്ച്/എന്നെക്കുറിച്ച്’ എന്ന അർഥം സാധാരണ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: Ἐραυνᾶτε എന്ന ക്രിയാരൂപത്തിന്റെ ഭാവം
  choice: 'സൂചകാർഥം: ‘നിങ്ങൾ തിരുവെഴുത്തുകൾ പരിശോധിക്കുന്നു’'
  alternative: 'ആജ്ഞാർഥം: ‘തിരുവെഴുത്തുകൾ പരിശോധിക്കൂ’'
  rationale: ഗ്രീക്ക് രൂപം രണ്ടുവിധത്തിലും വായിക്കാവുന്നതാണ്. യേശു എതിരാളികളുടെ നിലവിലെ സമീപനം വിവരിക്കുകയും, തിരുവെഴുത്തുകൾ തന്നിലേക്കു സാക്ഷ്യം പറഞ്ഞിട്ടും അവർ തന്നിലേക്കു വരാത്തതിനെ തുടർന്നുള്ള വാക്യങ്ങളിൽ തുറന്നുകാട്ടുകയും ചെയ്യുന്നതിനാൽ സന്ദർഭം സൂചകാർഥത്തെ അനുകൂലിക്കുന്നു. യഥാർഥമായ വ്യാകരണ-വ്യാഖ്യാനസാധ്യത ഇല്ലാതാക്കാതിരിക്കാൻ മറ്റുവായന അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘തിരുവെഴുത്തുകൾ’, ‘നിത്യജീവൻ’, ‘സാക്ഷ്യം പറയുക’ എന്നീ പരിചിതമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തിയപ്പോൾ വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി ക്രമപ്പെടുത്തി.
