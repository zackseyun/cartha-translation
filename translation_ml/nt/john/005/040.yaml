id: JHN.5.40
reference: John 5:40
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ οὐ θέλετε ἐλθεῖν πρός με ἵνα ζωὴν ἔχητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/040.yaml
  text: Yet you are not willing to come to me so that you may have life[a][b].
translation:
  language: ml
  text: എന്നിട്ടും, ജീവൻ ലഭിക്കാനായി നിങ്ങൾ എന്റെ അടുക്കൽ വരാൻ ഇച്ഛിക്കുന്നില്ല[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ജീവൻ ലഭിക്കേണ്ടതിന് നിങ്ങൾ എന്റെ അടുക്കൽ വരാൻ ആഗ്രഹിക്കുന്നില്ല.” ഗ്രീക്കിലെ ബന്ധകം ലളിതമായി ‘എന്നാൽ’ എന്നും പരിഭാഷപ്പെടുത്താം; θέλετε എന്നതിന് ‘ആഗ്രഹിക്കുന്നു’ എന്നും പറയാം.
    reason: lexical_alternative
  - marker: b
    text: യോഹന്നാന്റെ സുവിശേഷത്തിൽ ‘ജീവൻ’ എന്ന പദം പലപ്പോഴും ദൈവത്തിൽനിന്നുള്ള ജീവനെ, അതായത് നിത്യജീവനെ, സൂചിപ്പിക്കുന്നു. എന്നാൽ ‘നിത്യമായ’ എന്ന പദം ഇവിടെ മൂലപാഠത്തിൽ ഇല്ല.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: എന്നിട്ടും
  rationale: καί സാധാരണയായി ഒരു ലളിതബന്ധകമാണെങ്കിലും, മുൻവാക്യത്തിലെ കുറ്റപ്പെടുത്തലിനോട് ഇവിടെ വ്യക്തമായ വിരോധഭാവമുണ്ട്. മലയാളത്തിൽ അത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ ‘എന്നിട്ടും’ ഉപയോഗിച്ചു.
- source_word: οὐ θέλετε
  choice: നിങ്ങൾക്കു മനസ്സില്ല
  rationale: θέλω എന്നത് ഇച്ഛയെയും മനസ്സിനെയും സൂചിപ്പിക്കുന്നു. ‘മനസ്സില്ല’ എന്ന പ്രയോഗം ഇച്ഛയുടെ അഭാവം സ്വാഭാവികമായി അറിയിക്കുന്നു; ‘നിങ്ങൾ നിരസിക്കുന്നു’ എന്ന കൂടുതൽ ശക്തമായ വ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
- source_word: ἐλθεῖν πρός με
  choice: എന്റെ അടുക്കൽ വരാൻ
  rationale: πρός με ചേർന്ന ἐλθεῖν എന്നതിന്റെ നേരിട്ടുള്ള അർഥം സംരക്ഷിക്കുന്നു. യോഹന്നാനിൽ ഇതിന് വിശ്വാസവുമായി ബന്ധമുള്ള ആഴമുണ്ടെങ്കിലും, ‘എന്നിൽ വിശ്വസിക്കാൻ’ എന്നു വ്യാഖ്യാനിച്ച് രൂപകം ഇല്ലാതാക്കിയിട്ടില്ല.
- source_word: ἵνα
  choice: ഉണ്ടാകേണ്ടതിന്
  rationale: ἵνα ഇവിടെ ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു. ‘-േണ്ടതിന്’ എന്ന രൂപം ആ ഉദ്ദേശ്യബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ζωὴν
  choice: ജീവൻ
  rationale: ζωή എന്നതിന്റെ നേരിട്ടുള്ള പരിഭാഷയാണ് ‘ജീവൻ’. യോഹന്നാനിൽ ഇതിന് ദൈവത്തിൽനിന്നുള്ള നിത്യജീവന്റെ സമ്പൂർണ ധ്വനിയുണ്ടാകാമെങ്കിലും, αἰώνιος ഇവിടെ ഇല്ലാത്തതിനാൽ ‘നിത്യജീവൻ’ എന്നു മുഖ്യവാചകത്തിൽ വികസിപ്പിച്ചിട്ടില്ല.
- source_word: ἔχητε
  choice: നിങ്ങൾക്കു ... ഉണ്ടാകുക
  rationale: ἔχω എന്ന ‘ഉണ്ടായിരിക്കുക/കൈവശമുണ്ടാകുക’ എന്ന ആശയം മലയാളത്തിലെ ‘നിങ്ങൾക്കു ... ഉണ്ടാകുക’ എന്ന ഘടനയിൽ നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: ζωὴν എന്നത് ‘ജീവൻ’ എന്നോ ‘നിത്യജീവൻ’ എന്നോ പരിഭാഷപ്പെടുത്തുക
  choice: ജീവൻ
  alternative: നിത്യജീവൻ
  rationale: യോഹന്നാന്റെ സുവിശേഷത്തിൽ ‘ജീവൻ’ രക്ഷാപരമായും നിത്യമായും ഉള്ള ദൈവജീവനെ ധ്വനിപ്പിക്കാറുണ്ട്. എന്നാൽ ഈ വാക്യത്തിൽ ‘നിത്യമായ’ എന്ന വിശേഷണം ഇല്ല; അതിനാൽ മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്തത് മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
- issue: ‘എന്റെ അടുക്കൽ വരുക’ എന്നത് മുഖ്യവാചകത്തിൽ വിശ്വാസമായി വ്യാഖ്യാനിക്കണമോ
  choice: എന്റെ അടുക്കൽ വരാൻ
  alternative: എന്നിൽ വിശ്വസിക്കാൻ / വിശ്വാസത്തോടെ എന്റെ അടുക്കൽ വരാൻ
  rationale: യോഹന്നാനിൽ യേശുവിന്റെ അടുക്കൽ വരുന്നതും വിശ്വസിക്കുന്നതും അടുത്ത ബന്ധമുള്ളവയാണ്. എങ്കിലും മൂലപാഠം ‘വരുക’ എന്ന ദൃശ്യരൂപം ഉപയോഗിക്കുന്നതിനാൽ അത് അതേപടി സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘എന്റെ അടുക്കൽ’ എന്ന പ്രയോഗം യോഹന്നാന്റെ ദൃശ്യരൂപം നിലനിർത്തുന്നു; ‘നിങ്ങൾക്കു മനസ്സില്ല’ സാധാരണ വായനക്കാർക്കു വ്യക്തമായിരിക്കെ ഇച്ഛാഭാവത്തെ കൃത്യമായി പ്രകടിപ്പിക്കുന്നു.
