  yaml_path: translation/nt/john/005/021.yaml
  text: For just as the Father raises the dead and gives life[b][a], so also the Son gives life to whom he wishes.
translation:
  language: ml
  text: എന്തെന്നാൽ, പിതാവ് മരിച്ചവരെ ഉയിർപ്പിച്ച് ജീവിപ്പിക്കുന്നതുപോലെതന്നെ, പുത്രനും താൻ ഇച്ഛിക്കുന്നവരെ ജീവിപ്പിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ജീവൻ നൽകുന്നു”; രണ്ടു പ്രയോഗങ്ങളിലും.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: പോലെതന്നെ
  rationale: ὥσπερ എന്ന താരതമ്യം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു. γάρ ഈ വാക്യത്തെ മുൻസന്ദർഭത്തിന്റെ വിശദീകരണമായി ബന്ധിപ്പിക്കുന്നതിനാൽ മലയാളത്തിലെ വാക്യപ്രവാഹത്തിൽ പ്രത്യേകം പദമായി ചേർക്കാതെ ഘടനയിലൂടെ സൂചിപ്പിച്ചു.
- source_word: ὁ πατὴρ
  choice: പിതാവ്
  rationale: യോഹന്നാന്റെ സന്ദർഭത്തിൽ ദൈവത്തെ സൂചിപ്പിക്കുന്ന പിതാവ് എന്ന ബന്ധനാമം മാന്യവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: ἐγείρει τοὺς νεκρούς
  choice: മരിച്ചവരെ ഉയിർപ്പിച്ച്
  rationale: പുനരുത്ഥാനസന്ദർഭത്തിലെ ἐγείρωയുടെ അർഥം വ്യക്തമാക്കുകയും മലയാളത്തിൽ സ്വാഭാവികമായ ക്രിയാസംബന്ധം നൽകുകയും ചെയ്യുന്നു.
- source_word: ζῳοποιεῖ
  choice: ജീവിപ്പിക്കുന്നു
  rationale: ജീവൻ നൽകുന്നു, ജീവനുള്ളവരാക്കുന്നു എന്നീ അർഥങ്ങൾ ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു; രണ്ടു പ്രയോഗങ്ങളിലും ഒരേ പദം ഉപയോഗിച്ച് സമാന്തരത നിലനിർത്തി.
- source_word: οὕτως καὶ
  choice: അതുപോലെതന്നെ ... -നും
  rationale: പിതാവിന്റെയും പുത്രന്റെയും ജീവിപ്പിക്കുന്ന പ്രവൃത്തികൾക്കിടയിലെ ശക്തമായ സമാന്തരത മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὁ υἱὸς
  choice: പുത്രൻ
  rationale: പിതാവ്–പുത്രൻ ബന്ധത്തിലെ ക്രിസ്തുവിനെ സൂചിപ്പിക്കുന്ന സ്ഥാനനാമം അതേ ഗൗരവത്തോടെ നിലനിർത്തുന്നു.
- source_word: οὓς θέλει
  choice: താൻ ഇച്ഛിക്കുന്നവരെ
  rationale: ബന്ധസർവനാമത്തിന്റെ ബഹുവചനവും θέλωയുടെ യഥാർഥ ഇച്ഛാശക്തിയും വ്യക്തമായി നൽകുന്നു; ‘താൻ’ കർത്താവായ പുത്രനിലേക്കുള്ള സൂചന അസന്ദിഗ്ധമാക്കുന്നു.
theological_decisions:
- issue: ജീവൻ നൽകുന്നതിലെ പിതാവ്–പുത്രൻ സമാന്തരത
  choice: പിതാവ് ജീവിപ്പിക്കുന്നതുപോലെതന്നെ പുത്രനും ജീവിപ്പിക്കുന്നു എന്ന നേരിട്ടുള്ള സമാന്തരത നിലനിർത്തി.
  alternative: ക്രിസ്തുതാത്വിക ശക്തി കുറയുന്നവിധം താരതമ്യം അയവോടെ വിവർത്തനം ചെയ്യുക.
  rationale: ഗ്രീക്ക് വാക്യം പിതാവിന്റെ പ്രവൃത്തിയെയും പുത്രന്റെ പ്രവൃത്തിയെയും οὕτως καὶ മുഖേന വ്യക്തമായി സമാന്തരമാക്കുന്നു; വിവർത്തനം ഇതിൽ അധികമായ ദൈവശാസ്ത്ര വിശദീകരണം ചേർക്കുകയോ ഈ അവകാശവാദം ദുർബലമാക്കുകയോ ചെയ്യുന്നില്ല.
- issue: θέλει എന്ന പദത്തിലെ ഇച്ഛാശക്തി
  choice: താൻ ഇച്ഛിക്കുന്നവരെ
  alternative: താൻ ആഗ്രഹിക്കുന്നവരെ / താൻ മനസ്സുവെക്കുന്നവരെ
  rationale: ‘ഇച്ഛിക്കുന്നു’ ആധികാരികമായ നിർണയശേഷിയെ ദുർബലമാക്കാതെ ആധുനിക മാനക മലയാളത്തിൽ ഗൗരവപൂർവം അവതരിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ജീവിപ്പിക്കുന്നു’ എന്ന ആവർത്തനം മൂലപാഠത്തിലെ ζῳοποιεῖ എന്ന ക്രിയയുടെ ആവർത്തനവും പിതാവ്–പുത്രൻ സമാന്തരതയും സംരക്ഷിക്കുന്നു.
