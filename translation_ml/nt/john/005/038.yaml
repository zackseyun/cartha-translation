review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies λόγος as God's word, preserves the continuing force of μένοντα, and renders the causal ὅτι clause faithfully. However, its first clause states only that the word is not remaining in the hearers, whereas the Greek explicitly says that they do not have the word remaining in them. A small reordering preserves both elements naturally in Malayalam.
  naturalness: ‘നിങ്ങളിൽ നിലനിൽക്കുന്ന അവിടുത്തെ വചനം നിങ്ങൾക്കില്ല’ is natural, clear modern standard Malayalam and avoids the awkwardly literal form ‘നിലനിൽക്കുന്നതായി നിങ്ങൾക്കില്ല.’ The respectful forms ‘അവിടുത്തെ/അവിടുന്ന്’ fit the stated register.
  terminology: ‘വചനം’ is an appropriate Johannine rendering for λόγος. ‘നിലനിൽക്കുന്ന’ appropriately conveys μένω without imposing a doctrinal interpretation. ‘വിശ്വസിക്കുന്നില്ല’ preserves the direct personal-object sense of πιστεύω with the dative in this context.
  issues:
  - severity: low
    issue: The first clause omits the explicit possession construction represented by ἔχετε.
    rationale: ‘അവിടുത്തെ വചനം നിങ്ങളിൽ നിലനിൽക്കുന്നില്ല’ communicates the broad sense, but it shifts the grammatical assertion from ‘you do not have his word remaining in you’ to ‘his word is not remaining in you.’ Reordering the clause retains the source construction and remains idiomatic.
  revised_text: നിങ്ങളിൽ നിലനിൽക്കുന്ന അവിടുത്തെ വചനം നിങ്ങൾക്കില്ല[a]; കാരണം, അവിടുന്ന് അയച്ചവനെ നിങ്ങൾ വിശ്വസിക്കുന്നില്ല.
