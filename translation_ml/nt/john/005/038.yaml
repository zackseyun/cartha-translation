  to: നിങ്ങളിൽ നിലനിൽക്കുന്ന അവിടുത്തെ വചനം നിങ്ങൾക്കില്ല[a]; കാരണം, അവിടുന്ന് അയച്ചവനെ നിങ്ങൾ വിശ്വസിക്കുന്നില്ല.
  rationale: The revision restores the explicit sense of ‘you do not have’ (οὐκ ἔχετε) while retaining ‘remaining in you’ (ἐν ὑμῖν μένοντα). The causal relation and the referents of the sender and the one sent are unchanged. The footnote is adjusted to match the revised modifying phrase; its reason identifies μένω as the relevant Greek term.
