id: JHN.5.38
reference: John 5:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ τὸν λόγον αὐτοῦ οὐκ ἔχετε ⸂ἐν ὑμῖν μένοντα⸃, ὅτι ὃν ἀπέστειλεν ἐκεῖνος τούτῳ ὑμεῖς οὐ πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/038.yaml
  text: And you do not have his word abiding in you[a], because you do not believe the one whom he sent.
translation:
  language: ml
  text: നിങ്ങളിൽ നിലനിൽക്കുന്ന അവിടുത്തെ വചനം നിങ്ങൾക്കില്ല[a]; കാരണം, അവിടുന്ന് അയച്ചവനെ നിങ്ങൾ വിശ്വസിക്കുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിങ്ങളിൽ വസിക്കുന്ന’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: μέσω എന്നല്ല, μένω എന്ന പദത്തിന് ‘നിലനിൽക്കുക’ എന്നതിനു പുറമെ ‘വസിക്കുക’ എന്ന അർഥച്ചായയും സാധ്യമാണ്.
lexical_decisions:
- source_word: λόγον
  choice: വചനം
  rationale: ഇവിടെ λόγος ദൈവത്തിന്റെ വെളിപ്പെടുത്തപ്പെട്ട വചനത്തെയോ സന്ദേശത്തെയോ സൂചിപ്പിക്കുന്നു. ‘വചനം’ യോഹന്നാന്റെ രചനയിലെ പദപ്രതിധ്വനി നിലനിർത്തുകയും മലയാള ബൈബിൾ ഭാഷയിൽ സ്വാഭാവികമായി കേൾക്കുകയും ചെയ്യുന്നു.
- source_word: ἔχετε ... ἐν ὑμῖν μένοντα
  choice: നിങ്ങളിൽ നിലനിൽക്കുന്നില്ല
  rationale: ഗ്രീക്കിലെ ‘നിങ്ങളിൽ നിലനിൽക്കുന്നതായി നിങ്ങൾക്കില്ല’ എന്ന ഘടന മലയാളത്തിൽ അക്ഷരാർഥമായി നൽകിയാൽ അസ്വാഭാവികമാകും. ‘നിലനിൽക്കുന്നില്ല’ എന്നത് μένω സൂചിപ്പിക്കുന്ന തുടർച്ചയായ സാന്നിധ്യം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὅτι
  choice: കാരണം
  rationale: ഇവിടെ ὅτι മുമ്പുള്ള പ്രസ്താവനയുടെ കാരണം അവതരിപ്പിക്കുന്നു.
- source_word: ὃν ἀπέστειλεν ἐκεῖνος
  choice: അവിടുന്ന് അയച്ചവനെ
  rationale: ബന്ധവാക്യത്തിന്റെ വ്യക്തിപരമായ അർഥം നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ അയച്ചവൻ പിതാവാണ്; എന്നാൽ പാഠത്തിൽ ഇല്ലാത്ത വിശദീകരണം ചേർക്കുന്നില്ല.
- source_word: τούτῳ ... πιστεύετε
  choice: അയച്ചവനെ നിങ്ങൾ വിശ്വസിക്കുന്നില്ല
  rationale: മുൻനിർത്തിയിരിക്കുന്ന τούτῳ അയക്കപ്പെട്ടവനായ യേശുവിനെ ഊന്നുന്നു. മലയാളത്തിൽ വ്യക്തിയെ ‘വിശ്വസിക്കുക’ എന്ന പ്രയോഗം നേരിട്ടും സ്വാഭാവികവുമാണ്.
theological_decisions:
- issue: ദൈവത്തിന്റെ വചനം ഉള്ളിൽ നിലനിൽക്കുന്നതും അയക്കപ്പെട്ടവനിലുള്ള അവിശ്വാസവും തമ്മിലുള്ള ബന്ധം
  choice: അയക്കപ്പെട്ടവനെ വിശ്വസിക്കാത്തതാണ് വചനം അവരിൽ നിലനിൽക്കുന്നില്ലെന്ന പ്രസ്താവനയുടെ കാരണമായി അവതരിപ്പിച്ചത്.
  alternative: ഇത് തിരുവെഴുത്ത് ഉള്ളിൽ സൂക്ഷിക്കുകയോ അനുസരിക്കുകയോ ചെയ്യാത്തതിനെ മാത്രം സൂചിപ്പിക്കുന്നതായി വായിക്കാം.
  rationale: പരിഭാഷ വാക്യത്തിലെ കാരണബന്ധം നിലനിർത്തുന്നു; പുനർജനനം, ഉള്ളിലുള്ള വാസം, സ്ഥിരത എന്നിവയെക്കുറിച്ചുള്ള പ്രത്യേക സഭാപരമായ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. പിതാവിനെ സൂചിപ്പിക്കാൻ ‘അവിടുന്ന്/അവിടുത്തെ’ ഉപയോഗിച്ചു. ഗ്രീക്കിലെ ഘടനയുടെ അർഥം കാത്തുകൊണ്ട് മലയാളത്തിലെ അസ്വാഭാവികമായ ‘നിലനിൽക്കുന്നതായി നിങ്ങൾക്കില്ല’ എന്ന രൂപം ഒഴിവാക്കി.
