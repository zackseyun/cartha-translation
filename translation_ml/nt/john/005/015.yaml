id: JHN.5.15
reference: John 5:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπῆλθεν ὁ ἄνθρωπος καὶ ⸀ἀνήγγειλεν τοῖς Ἰουδαίοις ὅτι Ἰησοῦς ἐστιν ὁ ποιήσας αὐτὸν ὑγιῆ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/015.yaml
  text: The man went away and reported to the Jews that Jesus was the one who had made him well[a].
translation:
  language: ml
  text: ആ മനുഷ്യൻ പോയി, തന്നെ സൗഖ്യമാക്കിയവൻ യേശുവാണെന്ന് യെഹൂദന്മാരോടു അറിയിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ഈ സന്ദർഭത്തിൽ യോഹന്നാൻ ‘യെഹൂദന്മാർ’ എന്ന പദം എങ്ങനെ ഉപയോഗിക്കുന്നു എന്നതനുസരിച്ച്, ‘യെഹൂദനേതാക്കളോടു’ അല്ലെങ്കിൽ ‘യെഹൂദ്യരോടു’.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: അവിടെനിന്ന് പോയി
  rationale: രംഗത്തുനിന്നുള്ള പുറപ്പെടലാണ് ക്രിയ സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അത് വ്യക്തമാക്കുന്നു.
- source_word: ὁ ἄνθρωπος
  choice: ആ മനുഷ്യൻ
  rationale: സന്ദർഭത്തിലെ സുഖംപ്രാപിച്ച പുരുഷനെ നിർദിഷ്ടമായി പരാമർശിക്കുന്നു.
- source_word: ἀνήγγειλεν
  choice: അറിയിച്ചു
  rationale: വിവരം അറിയിക്കുക, റിപ്പോർട്ട് ചെയ്യുക എന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; പരസ്യപ്രഖ്യാപനം എന്ന അധികധ്വനി ഒഴിവാക്കുന്നു.
- source_word: τοῖς Ἰουδαίοις
  choice: യെഹൂദന്മാരെ
  rationale: ഗ്രീക്കിലെ വിശാലമായ പദപ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; യോഹന്നാനിലെ സന്ദർഭപരമായ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ὅτι Ἰησοῦς ἐστιν
  choice: യേശുവാണെന്ന്
  rationale: വിവരിച്ച കാര്യത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന മലയാളത്തിലെ സ്വാഭാവിക പരോക്ഷവാക്യരൂപം; ഗ്രീക്കിലെ വർത്തമാനകാല തിരിച്ചറിയൽ നിലനിർത്തുന്നു.
- source_word: ὁ ποιήσας αὐτὸν ὑγιῆ
  choice: തന്നെ സുഖപ്പെടുത്തിയതു
  rationale: മുൻപ് നടന്ന പ്രവൃത്തിയെയും അതിന്റെ ഫലമായ സൗഖ്യത്തെയും ചുരുക്കവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു; ποιέωയും ὑγιήςയും ചേർന്ന അർഥം പകർത്തുന്നു.
theological_decisions:
- issue: യോഹന്നാന്റെ സുവിശേഷത്തിലെ ‘യെഹൂദന്മാർ’ എന്ന പദത്തിന്റെ സൂചിതവിഭാഗം
  choice: മുഖ്യപാഠത്തിൽ ‘യെഹൂദന്മാർ’ നിലനിർത്തി സന്ദർഭസാധ്യതകൾ അടിക്കുറിപ്പിൽ ചേർക്കുന്നു.
  alternative: ‘യെഹൂദനേതാക്കൾ’ അല്ലെങ്കിൽ ‘യെഹൂദ്യർ’
  rationale: Ἰουδαῖοι എന്ന പദം സന്ദർഭത്തിൽ അധികാരികളെ സൂചിപ്പിക്കാമെങ്കിലും അതിനെ മുഖ്യപാഠത്തിൽ നിർബന്ധമായി ചുരുക്കുന്നത് വ്യാഖ്യാനപരമായ തീരുമാനമായിരിക്കും. അതിനാൽ മൂലപദത്തിന്റെ വിശാലതയും സന്ദർഭത്തിലെ അവ്യക്തതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അറിയിച്ചു’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; മുഖ്യപാഠം മൂലത്തിലെ അവ്യക്തത ചുരുക്കാതെ സൂക്ഷിക്കുന്നു.
