id: JHN.5.7
reference: John 5:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτῷ ὁ ἀσθενῶν· Κύριε, ἄνθρωπον οὐκ ἔχω ἵνα ὅταν ταραχθῇ τὸ ὕδωρ βάλῃ με εἰς τὴν κολυμβήθραν· ἐν ᾧ δὲ ἔρχομαι ἐγὼ ἄλλος πρὸ ἐμοῦ καταβαίνει.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/007.yaml
  text: The sick man answered him, “Lord, I have no one to put me into the pool when the water is stirred up; but while I am coming, another goes down before me.”
translation:
  language: ml
  text: 'രോഗിയായ ആ മനുഷ്യൻ അവനോടു മറുപടി പറഞ്ഞു: “കർത്താവേ[a], വെള്ളം ഇളകുമ്പോൾ എന്നെ കുളത്തിലിറക്കാൻ എനിക്ക് ആരുമില്ല; ഞാൻ അങ്ങോട്ടു ചെല്ലുന്നതിനിടയിൽ മറ്റൊരാൾ എനിക്കുമുമ്പേ ഇറങ്ങുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെയുള്ള ഗ്രീക്കുപദം ആദരപൂർവം “യജമാനനേ” എന്ന അർഥത്തിലും ഉപയോഗിക്കാം.
    reason: κύριε എന്ന പദത്തിന്റെ യഥാർഥ അഭിസംബോധനാത്മക ambiguity സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: ὁ ἀσθενῶν
  choice: രോഗിയായ ആ മനുഷ്യൻ
  rationale: പദശഃ ‘രോഗിയായവൻ’; സന്ദർഭത്തിലെ വ്യക്തിയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: Κύριε
  choice: കർത്താവേ[a]
  rationale: κύριε എന്ന സംബോധനയ്ക്ക് ‘കർത്താവേ’ എന്നും ആദരസൂചകമായ ‘യജമാനനേ/അങ്ങുന്നേ’ എന്നും അർഥസാധ്യതയുണ്ട്. ഇംഗ്ലീഷ് POBയിലെ ‘Lord’ നിലനിർത്തിക്കൊണ്ട് മൂലത്തിലെ അഭിസംബോധനയുടെ വ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ταραχθῇ τὸ ὕδωρ
  choice: വെള്ളം ഇളകുമ്പോൾ
  rationale: നിഷ്ക്രിയക്രിയയുടെ അർഥം സംരക്ഷിക്കുന്നതും സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: βάλῃ με εἰς τὴν κολυμβήθραν
  choice: എന്നെ കുളത്തിലിറക്കാൻ
  rationale: βάλῃയുടെ പദശഃ അർഥം ‘ഇടുക/വയ്ക്കുക’ എന്നാണെങ്കിലും ഈ സന്ദർഭത്തിൽ കുളത്തിലേക്ക് സഹായിച്ച് ഇറക്കുക എന്ന ഉദ്ദേശ്യം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐν ᾧ δὲ ἔρχομαι ἐγώ
  choice: ഞാൻ അങ്ങോട്ടു ചെല്ലുന്നതിനിടയിൽ
  rationale: പ്രവർത്തനം പുരോഗമിക്കുന്ന സമയത്ത് മറ്റൊരാൾ മുമ്പേ ഇറങ്ങുന്നു എന്ന കാലബന്ധം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: κύριε എന്ന അഭിസംബോധന യേശുവിന്റെ ദൈവിക പദവിയെ സൂചിപ്പിക്കുന്നുവോ, സാധാരണ ആദരസൂചകമാണോ
  choice: മുഖ്യപാഠത്തിൽ ‘കർത്താവേ’
  alternative: ‘യജമാനനേ’ അല്ലെങ്കിൽ ‘അങ്ങുന്നേ’
  rationale: മൂലഗ്രീക്കിൽ ഇരു സാധ്യതകളും ഉണ്ടെങ്കിലും ഇംഗ്ലീഷ് POBയുടെ പരിശോധനാനന്തര തിരഞ്ഞെടുപ്പായ ‘Lord’ പിന്തുടരുന്നു; എന്നാൽ ഈ വാക്യത്തിൽ സംസാരിക്കുന്നയാളുടെ പൂർണമായ ക്രിസ്തുജ്ഞാനം മുൻകൂട്ടി നിശ്ചയിക്കാതിരിക്കാൻ മറ്റർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. രോഗിയുടെ നിസ്സഹായത സ്വാഭാവിക വാക്യഘടനയിൽ നിലനിർത്തിയിരിക്കുന്നു; വ്യാഖ്യാനപരമായ അധികവിവരങ്ങൾ മുഖ്യപാഠത്തിലേക്ക് ചേർത്തിട്ടില്ല.
