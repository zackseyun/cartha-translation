  terminology: ‘ദൂതൻ,’ ‘കുളം,’ ‘രോഗം,’ and ‘രോഗമുക്തൻ’ are suitable neutral modern-standard Malayalam terms. The textual-critical note is revised to avoid implying that scholars can identify a particular individual scribe.
  issues:
