id: JHN.5.4
reference: John 5:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: robinson-pierpont-2005-byzantine
  text: Ἄγγελος γὰρ κατὰ καιρὸν κατέβαινεν ἐν τῇ κολυμβήθρᾳ, καὶ ἐτάρασσεν τὸ ὕδωρ· ὁ οὖν πρῶτος ἐμβὰς μετὰ τὴν ταραχὴν τοῦ ὕδατος, ὑγιὴς ἐγίνετο, ᾧ δήποτε κατείχετο νοσήματι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/005/004.yaml
  text: For an angel would go down into the pool from time to time and stir up the water. Therefore, the first one to step in after the stirring of the water would become well from whatever disease afflicted him.
translation:
  language: ml
  text: എന്തെന്നാൽ[a], ഒരു ദൂതൻ ഇടയ്ക്കിടെ കുളത്തിലേക്ക് ഇറങ്ങി വെള്ളം കലക്കുമായിരുന്നു. വെള്ളം കലക്കപ്പെട്ടശേഷം അതിൽ ആദ്യം ഇറങ്ങുന്നയാൾ, ഏതു രോഗമാണ് അയാളെ ബാധിച്ചിരുന്നതെങ്കിലും, രോഗമുക്തനാകുമായിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ വാക്യവും 3-ാം വാക്യത്തിന്റെ അവസാനഭാഗവും ഏറ്റവും പഴക്കമുള്ള ഗ്രീക്ക് പപ്പിറസ് കൈയെഴുത്തുപ്രതികളിൽ—ഉദാഹരണത്തിന് മൂന്നാം നൂറ്റാണ്ടിലെ പപ്പിറസ് 66, പപ്പിറസ് 75 എന്നിവയിൽ—കാണുന്നില്ല; നാലാം നൂറ്റാണ്ടിലെ പ്രധാന കൈയെഴുത്തുപ്രതികളായ സീനായിറ്റിക്കസ്, വത്തിക്കാനസ് എന്നിവയിലും ഇവ ഇല്ല. എന്നാൽ ബൈസന്റൈൻ ഭൂരിപക്ഷ പാഠപാരമ്പര്യത്തിലും ആദ്യകാല ലത്തീൻ, സുറിയാനി പരിഭാഷകളിലും ഇവ കാണപ്പെടുന്നു. രോഗബാധിതർ കുളത്തിനരികിൽ കൂടിയിരുന്നതിന്റെ കാരണം വിശദീകരിക്കാൻ ആദ്യകാലത്ത് പകർപ്പെഴുത്തിലൂടെ ചേർക്കപ്പെട്ട ഭാഗമാണിതെന്ന് പല പണ്ഡിതരും കരുതുന്നു.
    reason: textual_critical
  - marker: b
    text: അഥവാ, ‘സുഖം പ്രാപിക്കുമായിരുന്നു’.
    reason: alternative_rendering
lexical_decisions:
- source_word: κατὰ καιρὸν
  choice: ഇടയ്ക്കിടെ
  rationale: ഈ പ്രയോഗം കൃത്യമായി നിശ്ചയിച്ച കാലത്തെയല്ല, ഇടവിട്ടുള്ള ആവർത്തനത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: κατέβαινεν
  choice: ഇറങ്ങി ... കലക്കുമായിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം പതിവായി ആവർത്തിച്ചിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ‘-മായിരുന്നു’ ഘടന ഉപയോഗിച്ചു.
- source_word: ἐτάρασσεν
  choice: വെള്ളം കലക്കുമായിരുന്നു
  rationale: ജലത്തെ ഇളക്കുകയോ കലക്കുകയോ ചെയ്യുക എന്ന സന്ദർഭോചിത അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὑγιὴς ἐγίνετο
  choice: സൗഖ്യം ലഭിക്കുമായിരുന്നു
  rationale: ആവർത്തിത ഭൂതകാലഭാവം നിലനിർത്തിക്കൊണ്ട് രോഗമുക്തി സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: κατείχετο νοσήματι
  choice: രോഗം ... ബാധിച്ചിരുന്നത്
  rationale: ‘പിടിച്ചുവെക്കുക’ എന്ന പദാനുപദ അർഥത്തിനു പകരം, രോഗം ഒരാളെ ബാധിച്ചിരിക്കുക എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സന്ദർഭോചിത അർഥം നൽകുന്നു.
theological_decisions:
- issue: ദൂതൻ വെള്ളം കലക്കിയെന്ന പ്രസ്താവനയുടെ പാഠപരമായ സ്ഥാനം
  choice: നൽകിയിരിക്കുന്ന ബൈസന്റൈൻ ഗ്രീക്ക് സ്രോതസ്സനുസരിച്ച് വാക്യം മുഖ്യപാഠത്തിൽ പരിഭാഷപ്പെടുത്തി; പാഠഭേദസാക്ഷ്യം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
  alternative: ആദ്യകാല പ്രധാന കൈയെഴുത്തുപ്രതികളുടെ സാക്ഷ്യം പിന്തുടർന്ന് വാക്യം മുഖ്യപാഠത്തിൽനിന്ന് ഒഴിവാക്കുക.
  rationale: നിർദ്ദിഷ്ട സ്രോതസ്സുപതിപ്പിൽ വാക്യം ഉൾപ്പെട്ടിരിക്കുന്നതിനാൽ അതിനെ പരിഭാഷപ്പെടുത്തണം; എന്നാൽ പ്രധാനപ്പെട്ട പാഠവിമർശന അനിശ്ചിതത്വം മറച്ചുവയ്ക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ഗ്രീക്കിലെ ആവർത്തിത അപൂർണ ഭൂതകാലഭാവം ‘ഇടയ്ക്കിടെ’, ‘കലക്കുമായിരുന്നു’, ‘ലഭിക്കുമായിരുന്നു’ എന്നിവയിലൂടെ നിലനിർത്തി. പാഠവിമർശനപരമായ അനിശ്ചിതത്വം മുഖ്യവാചകത്തിൽ തീർപ്പാക്കാതെ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
