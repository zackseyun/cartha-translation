id: JHN.5.11
reference: John 5:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂ὃς δὲ⸃ ἀπεκρίθη αὐτοῖς· Ὁ ποιήσας με ὑγιῆ ἐκεῖνός μοι εἶπεν Ἆρον τὸν κράβαττόν σου καὶ περιπάτει.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/011.yaml
  text: But he answered them[a], “The one who made me well—that one said to me[b], ‘Pick up your mat and walk.’”
translation:
  language: ml
  text: 'എന്നാൽ അവൻ അവരോടു മറുപടി പറഞ്ഞു: “എന്നെ സുഖപ്പെടുത്തിയവൻ തന്നെയാണ് എന്നോട്, ‘നിന്റെ പായ[a] എടുത്ത് നടക്കുക’ എന്നു പറഞ്ഞത്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കിടക്കപ്പായ”; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദം കിടക്കാൻ ഉപയോഗിക്കുന്ന ലളിതമായ പായയെയോ വിരിപ്പിനെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: മറുപടി പറഞ്ഞു
  rationale: യോഹന്നാനിലെ സംഭാഷണസന്ദർഭത്തിന് യോജിച്ച, സ്വാഭാവികമായ ആഖ്യാനപ്രയോഗം.
- source_word: Ὁ ποιήσας με ὑγιῆ
  choice: എന്നെ സുഖപ്പെടുത്തിയവൻ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ കൃദന്തരൂപത്തെ ‘...ചെയ്തവൻ’ എന്ന് സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും ശാരീരിക സൗഖ്യത്തിന്റെ സന്ദർഭം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐκεῖνός
  choice: തന്നെയാണ്
  rationale: ഗ്രീക്കിലെ ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; വെറും ‘അവൻ’ എന്നു പരിഭാഷപ്പെടുത്തി ഊന്നൽ നഷ്ടപ്പെടുത്തുന്നില്ല.
- source_word: Ἆρον
  choice: എടുത്ത്
  rationale: പായ കൈയിലെടുത്തുയർത്താനുള്ള വ്യക്തമായ കല്പനയെ സാധാരണ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: κράβαττόν
  choice: പായ
  rationale: വലിയ കട്ടിലല്ല, കിടക്കാൻ ഉപയോഗിച്ചിരുന്ന ലളിതമായ പായയെയോ വിരിപ്പിനെയോ സൂചിപ്പിക്കുന്ന സന്ദർഭോചിതവും എളുപ്പം മനസ്സിലാകുന്നതുമായ പദം.
- source_word: περιπάτει
  choice: നടക്കുക
  rationale: സൗഖ്യലഭനത്തിന്റെ അടയാളമായ നേരിട്ടുള്ള കല്പനയെ സ്വാഭാവികമായി പകരുന്നു; ഗ്രീക്ക് വർത്തമാനകാല കല്പനയുടെ തുടർച്ചാഭാവം ഇവിടെ പ്രത്യേകം വ്യക്തമാക്കേണ്ടതില്ല.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ ചോദ്യം/എതിർപ്പിനോടുള്ള മൃദുവായ വൈരുധ്യവും പ്രതികരണവും സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: സൗഖ്യവിവരണത്തിന്റെ സാധ്യതയുള്ള ദൈവശാസ്ത്രപരമായ വ്യാപ്തി
  choice: എന്നെ സുഖപ്പെടുത്തിയവൻ
  alternative: എന്നെ പൂർണനാക്കിയവൻ
  rationale: അടുത്ത സന്ദർഭം ശാരീരിക സൗഖ്യത്തെക്കുറിച്ചാണ്. ‘പൂർണനാക്കി’ എന്നത് ഗ്രീക്ക് ഇവിടെ നിർബന്ധിക്കാത്ത വിശാലമായ ആത്മീയ അർഥം ചേർക്കാൻ ഇടയുള്ളതിനാൽ ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ സംഭാഷണശൈലി. ἐκεῖνος എന്ന ഊന്നൽ ‘തന്നെയാണ്’ എന്ന രൂപത്തിൽ നിലനിർത്തി. ഇംഗ്ലീഷ് ഉപദേശപാഠത്തിലെ അടിക്കുറിപ്പ്-ചിഹ്നങ്ങളുടെ സ്ഥാനം ഉള്ളടക്കവുമായി പൊരുത്തപ്പെടാത്തതിനാൽ അവ യാന്ത്രികമായി പിന്തുടർന്നില്ല; ആവശ്യമായ ശബ്ദാർഥക്കുറിപ്പ് ബന്ധപ്പെട്ട പദത്തോടുതന്നെ ചേർത്തു.
