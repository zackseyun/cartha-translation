  rationale: ἵνα μή-യുടെ ഉദ്ദേശ്യപരമായ മുന്നറിയിപ്പ് മലയാളത്തിൽ കൃത്യമായി നൽകുന്നതിനായി അവസാനവാക്യം പുനഃക്രമീകരിച്ചു. ‘ഇതിലും’ എന്നതിനു പകരം ‘അതിലും’ ഉപയോഗിച്ച് മുമ്പത്തെ ദുരവസ്ഥയോടുള്ള സന്ദർഭസൂചിതമായ താരതമാനം നൽകി; എങ്കിലും കൂടുതൽ മോശമായ കാര്യത്തിന്റെ സ്വഭാവമോ മുൻരോഗവും പാപവും തമ്മിലെ കൃത്യബന്ധമോ നിർവചിച്ചിട്ടില്ല. പാദക്കുറിപ്പുകൾ ആ തുറന്ന നില വ്യക്തമായി നിലനിർത്തുന്നു.
