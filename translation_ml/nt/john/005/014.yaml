id: JHN.5.14
reference: John 5:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μετὰ ταῦτα εὑρίσκει αὐτὸν ὁ Ἰησοῦς ἐν τῷ ἱερῷ καὶ εἶπεν αὐτῷ· Ἴδε ὑγιὴς γέγονας· μηκέτι ἁμάρτανε, ἵνα μὴ χεῖρόν ⸂σοί τι⸃ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/014.yaml
  text: After these things Jesus found him in the temple and said to him[a], “See, you have become well. Sin no more[c][b], so that something worse may not happen to you.”
translation:
  language: ml
  text: 'ഇതിനുശേഷം യേശു അവനെ ദൈവാലയത്തിൽ വച്ച് കണ്ടെത്തി അവനോടു പറഞ്ഞു: “നോക്കൂ, നീ സൗഖ്യം പ്രാപിച്ചിരിക്കുന്നു.[a] നിനക്കു അതിലും മോശമായതൊന്ന് സംഭവിക്കാതിരിക്കാൻ ഇനി പാപം ചെയ്യരുത്.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ, “നീ സൗഖ്യമുള്ളവനായിത്തീർന്നിരിക്കുന്നു”; സംഭവിച്ച മാറ്റത്തിന്റെ ഫലമായി ഇപ്പോൾ തുടരുന്ന സൗഖ്യാവസ്ഥയ്ക്ക് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
  - marker: b
    text: മുൻപുണ്ടായിരുന്ന രോഗം ഒരു പ്രത്യേക പാപം മൂലമാണോ എന്നും, “മോശമായത്” ഇഹലോകത്തിലെ കഷ്ടതയെയോ അന്തിമവിധിയെയോ രണ്ടിനെയുമോ സൂചിപ്പിക്കുന്നുവോ എന്നും ഈ മുന്നറിയിപ്പ് വ്യക്തമാക്കുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: ഇതിനുശേഷം
  rationale: ബഹുവചനപ്രയോഗത്തെ മലയാളത്തിൽ കൃത്രിമമായി പകർത്താതെ, യോഹന്നാന്റെ ആഖ്യാനക്രമം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: εὑρίσκει
  choice: കണ്ടെത്തി
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനത്തെ മലയാള ആഖ്യാനത്തിന് സ്വാഭാവികമായ ഭൂതകാലത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἐν τῷ ἱερῷ
  choice: ദൈവാലയത്തിൽവെച്ചു
  rationale: ἱερόν ദൈവാലയസമുച്ചയത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അകത്തെ വിശുദ്ധമന്ദിരം മാത്രമെന്ന അർഥം വരുത്തുന്നില്ല.
- source_word: Ἴδε
  choice: നോക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ആജ്ഞയുടെ ശക്തി പഴഞ്ചൻ ഭാവമില്ലാതെ നൽകുന്നു.
- source_word: ὑγιὴς γέγονας
  choice: നീ സൗഖ്യം പ്രാപിച്ചിരിക്കുന്നു
  rationale: പൂർത്തിയായ മാറ്റവും അതിന്റെ ഇപ്പോഴത്തെ ഫലാവസ്ഥയും perfect ക്രിയയിൽ ഉള്ളതുപോലെ നിലനിർത്തുന്നു.
- source_word: μηκέτι ἁμάρτανε
  choice: ഇനി പാപം ചെയ്യരുത്
  rationale: ഈ സമയംമുതൽ പാപം ഉപേക്ഷിക്കണമെന്ന വിലക്കിനെ വ്യക്തമായി നൽകുന്നു; തുടർച്ചയായ പാപപ്രവൃത്തി ഉറപ്പിച്ച് വായിക്കുന്നില്ല.
- source_word: ἵνα μὴ χεῖρόν σοί τι γένηται
  choice: ഇതിലും മോശമായതൊന്നും നിനക്കു സംഭവിക്കാതിരിക്കട്ടെ
  rationale: ἵνα μήയുടെ പ്രതിരോധപരമായ ഉദ്ദേശ്യ/ഫലഭാവവും τιയുടെ അനിശ്ചിതത്വവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ മുന്നറിയിപ്പിൽ പാപവും കഷ്ടതയും തമ്മിലുള്ള ബന്ധം
  choice: ഭാവിയിലെ പാപത്തെക്കുറിച്ചുള്ള മുന്നറിയിപ്പും അതിനോടു ബന്ധപ്പെട്ട കൂടുതൽ മോശമായ ഫലസാധ്യതയും നേരിട്ട് അവതരിപ്പിക്കുന്നു; മുൻരോഗം ഒരു പ്രത്യേക പാപത്തിന്റെ നേരിട്ടുള്ള ശിക്ഷയായിരുന്നു എന്നു പറയുന്നില്ല.
  alternative: മുൻരോഗം പ്രത്യേക പാപത്തിനുള്ള ശിക്ഷയായിരുന്നു എന്നോ, ‘മോശമായത്’ ലൗകിക കഷ്ടതയോ അന്തിമവിധിയോ മാത്രമാണെന്നോ വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്ക് വാക്യം ഈ കാര്യങ്ങൾ നിർവചിക്കുന്നില്ല. അതിനാൽ അതിലെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില പരിഭാഷയിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ദേവാലയം’ എന്നതിനെക്കാൾ ബൈബിൾസന്ദർഭത്തിൽ വ്യക്തമായ ‘ദൈവാലയം’ ഉപയോഗിച്ചു. ‘ഇനി പാപം ചെയ്യരുത്’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ഗ്രീക്കിന്റെ ആജ്ഞാഭാവത്തോട് യോജിച്ചതുമാണ്.
