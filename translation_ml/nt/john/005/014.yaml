revisions:
- from: 'ഇതിനുശേഷം യേശു അവനെ ദൈവാലയത്തിൽവെച്ചു കണ്ടെത്തി അവനോടു പറഞ്ഞു: “നോക്കൂ, നീ സൗഖ്യം പ്രാപിച്ചിരിക്കുന്നു.[a] ഇനി പാപം ചെയ്യരുത്; ഇതിലും മോശമായതൊന്നും നിനക്കു സംഭവിക്കാതിരിക്കട്ടെ.”[b]'
