translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. പട്ടികയുടെ ഗതി നിലനിർത്താൻ ദീർഘവാക്യത്തിനുള്ളിൽ ഡാഷുകൾ ഉപയോഗിച്ചു; മൂലപാഠത്തിലെ ξηρός എന്ന പദത്തിന്റെ ദൃശ്യരൂപവും സാധ്യതയുള്ള പ്രവർത്തനപരമായ അർഥവും മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
