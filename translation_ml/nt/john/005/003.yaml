  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν ταύταις κατέκειτο ⸀πλῆθος τῶν ἀσθενούντων, τυφλῶν, χωλῶν, ⸀ξηρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/003.yaml
  text: In these lay a multitude of the sick[a], blind, lame, and paralyzed.
translation:
  language: ml
  text: അവയിൽ രോഗികളായ അനേകർ—അന്ധരും മുടന്തരും ശോഷിച്ചവരും[a]—കിടന്നിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കുപദത്തിന്റെ അക്ഷരാർഥം “ഉണങ്ങിയവർ” അല്ലെങ്കിൽ “ശോഷിച്ചവർ” എന്നാണ്. ഇവിടെ ശോഷിച്ചോ ചുരുങ്ങിപ്പോയോ ഉള്ള അവയവങ്ങളുള്ളവരെയാകാം ഉദ്ദേശിക്കുന്നത്; അതിനാൽ ഗുരുതരമായ ശാരീരിക വൈകല്യമുള്ളവരെന്ന അർഥവും സന്ദർഭത്തിൽ സാധ്യമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταύταις
  choice: അവയിൽ
  rationale: സ്ത്രീലിംഗ ബഹുവചന സർവനാമം മുൻവാക്യത്തിൽ പറഞ്ഞ ഘടനകളെ സൂചിപ്പിക്കുന്നു. മൂലത്തിൽ ഇല്ലാത്ത ‘മണ്ഡപങ്ങൾ’ ഇവിടെ ചേർക്കാതെ സന്ദർഭബന്ധം നിലനിർത്തുന്നു.
- source_word: κατέκειτο
  choice: കിടന്നിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം അവിടെ കിടന്നിരുന്ന തുടർച്ചയായ അവസ്ഥയെ സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: πλῆθος τῶν ἀσθενούντων
  choice: രോഗികളായ അനേകർ
  rationale: πλῆθος എന്നതിന്റെ വലിയ സംഖ്യ എന്ന ആശയവും ἀσθενέω എന്നതിന്റെ ശാരീരിക രോഗാവസ്ഥയും സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: τυφλῶν
  choice: അന്ധർ
  rationale: കാഴ്ചയില്ലാത്തവരെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള, മാന്യമായ ആധുനിക പ്രയോഗം.
- source_word: χωλῶν
  choice: മുടന്തർ
  rationale: നടക്കുന്നതിൽ ശാരീരിക വൈകല്യമുള്ളവരെ സൂചിപ്പിക്കുന്ന χωλός എന്ന പദത്തിന്റെ നേരിട്ടുള്ള സന്ദർഭോചിത പരിഭാഷ.
- source_word: ξηρῶν
  choice: കൈകാലുകൾ ശോഷിച്ചവർ
  rationale: ξηρός അക്ഷരാർഥത്തിൽ ‘ഉണങ്ങിയ/ശോഷിച്ച’ എന്നാണ്. ശരീരസംബന്ധമായ ഈ സന്ദർഭത്തിൽ ശോഷിച്ചോ ചുരുങ്ങിപ്പോയോ ഉള്ള അവയവങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘തളർവാതം ബാധിച്ചവർ’ എന്നു മാത്രം പറഞ്ഞ് അർഥം അതിയായി നിർണയിക്കുന്നത് ഒഴിവാക്കുന്നു.
