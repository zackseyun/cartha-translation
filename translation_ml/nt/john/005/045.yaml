source:
  edition: SBLGNT
  text: μὴ δοκεῖτε ὅτι ἐγὼ κατηγορήσω ὑμῶν πρὸς τὸν πατέρα· ἔστιν ὁ κατηγορῶν ὑμῶν Μωϋσῆς, εἰς ὃν ὑμεῖς ἠλπίκατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/045.yaml
  text: 'Do not think that I will accuse you before the Father[a]; there is one who accuses you: Moses[b], in whom you have put your hope.'
translation:
  language: ml
  text: “ഞാൻ പിതാവിന്റെ മുമ്പാകെ നിങ്ങളെ കുറ്റപ്പെടുത്തുമെന്ന് കരുതരുത്.[a] നിങ്ങളെ കുറ്റപ്പെടുത്തുന്ന ഒരാളുണ്ട്—നിങ്ങൾ പ്രത്യാശ വെച്ചിരിക്കുന്ന മോശെതന്നെ.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ പിതാവിന്റെ മുമ്പാകെ നിങ്ങൾക്കെതിരെ കുറ്റം ചുമത്തുമെന്ന് വിചാരിക്കരുത്.”
    reason: lexical_alternative
  - marker: b
    text: അതായത്, അവർ പ്രത്യാശയും ആശ്രയവും വെച്ചിരുന്ന മോശെ—പ്രത്യേകിച്ച് ന്യായപ്രമാണത്തിന്റെ മധ്യസ്ഥനും സാക്ഷിയും എന്ന നിലയിൽ—അവരെ കുറ്റപ്പെടുത്തുന്നവനായി നിൽക്കും.
    reason: cross_reference
lexical_decisions:
- source_word: μὴ δοκεῖτε
  choice: കരുതരുത്
  rationale: μή സഹിതമുള്ള വർത്തമാനകാല ആജ്ഞാരൂപം നേരിട്ടുള്ള വിലക്കാണ്; ‘കരുതരുത്’ ആ അർഥം സ്വാഭാവികവും വ്യക്തവുമായി നൽകുന്നു.
- source_word: κατηγορήσω
  choice: കുറ്റപ്പെടുത്തുമെന്ന്
  rationale: κατηγορέω എന്നത് കുറ്റം ചുമത്തുക/ആരോപിക്കുക എന്ന നിയമപരമായ അർഥം നൽകുന്നു; ‘ശിക്ഷ വിധിക്കുക’ എന്ന അതിലധികം ശക്തമായ അർഥം ചേർക്കുന്നില്ല.
- source_word: πρὸς τὸν πατέρα
  choice: പിതാവിന്റെ മുമ്പാകെ
  rationale: കുറ്റാരോപണത്തിന്റെ പശ്ചാത്തലത്തിൽ πρός പിതാവിന്റെ സന്നിധിയിൽ എന്ന ന്യായവ്യവഹാരസദൃശമായ ദിശ/സാന്നിധ്യം സൂചിപ്പിക്കുന്നു; യോഹന്നാനിലെ ‘പിതാവ്’ എന്ന വിശേഷണം നിലനിർത്തുന്നു.
- source_word: ἔστιν ὁ κατηγορῶν ὑμῶν
  choice: നിങ്ങളെ കുറ്റപ്പെടുത്തുന്ന ഒരാളുണ്ട്
  rationale: വർത്തമാന കൃദന്തരൂപത്തിന്റെ തുടരുന്ന ആരോപണബലം നിലനിർത്തിക്കൊണ്ട് മറ്റൊരു കുറ്റാരോപകനെ പരിചയപ്പെടുത്തുന്ന ഘടന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: Μωϋσῆς
  choice: മോശെ
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള മാനകരൂപം.
- source_word: εἰς ὃν
  choice: ആരിൽ
  rationale: ἐλπίζω + εἰς ഒരാളിൽ പ്രത്യാശ അർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘എഴുത്തുകളിൽ’ അല്ലെങ്കിൽ ‘ന്യായപ്രമാണത്തിൽ’ എന്ന് വ്യാഖ്യാനപരമായി വികസിപ്പിക്കാതെ വ്യക്തിയെ തന്നെയാണ് നിലനിർത്തുന്നത്.
- source_word: ἠλπίκατε
  choice: നിങ്ങൾ പ്രത്യാശ വെച്ചിരിക്കുന്ന
  rationale: സമ്പൂർണകാലം മുൻപ് സ്ഥാപിക്കപ്പെട്ടതും ഇപ്പോഴും നിലനിൽക്കുന്നതുമായ ആശ്രയത്തെ സൂചിപ്പിക്കുന്നു; ഈ മലയാളരൂപം ആ തുടരുന്ന ഫലം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ വാക്കുകളിലെ നിയമപരമായ കുറ്റാരോപണബലം
  choice: ‘കുറ്റപ്പെടുത്തുക’ എന്ന നിയമപരമായ ഭാഷ ഉപയോഗിച്ചു.
  alternative: ‘ശിക്ഷ വിധിക്കുക’
  rationale: κατηγορέω കുറ്റം ആരോപിക്കുന്നതിനെയാണ് സൂചിപ്പിക്കുന്നത്, അന്തിമമായി ശിക്ഷ വിധിക്കുന്നതിനെയല്ല; അതിനാൽ വാക്യം പറയുന്നതിലധികം ന്യായവിധിസംബന്ധമായ അവകാശവാദം ചേർക്കുന്നില്ല.
- issue: മോശെയിൽ വെച്ചിരിക്കുന്ന പ്രത്യാശയുടെ സൂചന
  choice: പ്രത്യാശ മോശെയിൽ തന്നെയാണെന്ന് മുഖ്യവാചകത്തിൽ നിലനിർത്തി.
  alternative: ‘മോശെയുടെ ന്യായപ്രമാണത്തിൽ’ അല്ലെങ്കിൽ ‘മോശെയുടെ എഴുത്തുകളിൽ’
  rationale: സന്ദർഭം മോശെയുടെ എഴുത്തുകളുമായി ബന്ധിപ്പിക്കുന്നുവെങ്കിലും ഗ്രീക്ക് വാചകം മോശെയെ നേരിട്ട് നാമകരണം ചെയ്യുന്നു; വ്യാഖ്യാനവികാസം മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. നിയമപരമായ പ്രതീതി ‘കുറ്റപ്പെടുത്തുക’ എന്ന പദത്തിലൂടെ നിലനിർത്തി; ‘മോശെതന്നെ’ എന്ന രൂപം ഗ്രീക്കിലെ തിരിച്ചറിയൽ-ഊന്നൽ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
