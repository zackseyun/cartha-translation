  to: എന്തെന്നാൽ, പിതാവിന് തന്നിൽത്തന്നെ ജീവൻ ഉള്ളതുപോലെ, അതുപോലെതന്നെ പുത്രനും തന്നിൽത്തന്നെ ജീവൻ ഉണ്ടായിരിക്കാൻ പിതാവ് നൽകി[b].[a]
