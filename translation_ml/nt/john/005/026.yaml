id: JHN.5.26
reference: John 5:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ὁ πατὴρ ἔχει ζωὴν ἐν ἑαυτῷ, οὕτως ⸂καὶ τῷ υἱῷ ἔδωκεν⸃ ζωὴν ἔχειν ἐν ἑαυτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/026.yaml
  text: For just as the Father has life in himself[b][a], so he also granted the Son to have life in himself.
translation:
  language: ml
  text: എന്തെന്നാൽ, പിതാവിന് തന്നിൽത്തന്നെ ജീവൻ ഉള്ളതുപോലെ, അതുപോലെതന്നെ പുത്രനും തന്നിൽത്തന്നെ ജീവൻ ഉണ്ടായിരിക്കാൻ പിതാവ് നൽകി[b].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തന്നിൽത്തന്നെ ജീവൻ’ എന്നത് സ്വന്തം അസ്തിത്വത്തിൽ അന്തർനിഹിതമായ ജീവൻ എന്നു മനസ്സിലാക്കാം. എന്നാൽ ‘സ്വയംനിലനിൽക്കുന്ന ജീവൻ’ എന്ന ദൈവശാസ്ത്രപരമായ ചുരുക്കപ്രയോഗത്തിനു പകരം ഗ്രീക്കിലെ വാക്കുകൾ തന്നെയാണ് പരിഭാഷയിൽ നിലനിർത്തിയിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘പുത്രന് തന്നിൽത്തന്നെ ജീവൻ ഉണ്ടായിരിക്കാൻ കൊടുത്തു.’ ഗ്രീക്ക് ക്രിയയുടെ സാധാരണ അർഥം ‘കൊടുത്തു’ എന്നാണ്; ‘നൽകി’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികമായ സമാനപ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: എന്തെന്നാൽ ... ഉള്ളതുപോലെ
  rationale: γάρ എന്ന വിശദീകരണബന്ധം ‘എന്തെന്നാൽ’ എന്നും ὥσπερ എന്ന താരതമ്യം ‘ഉള്ളതുപോലെ’ എന്നും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὁ πατὴρ
  choice: പിതാവ്
  rationale: യോഹന്നാന്റെ സന്ദർഭത്തിൽ ദൈവത്തെ സൂചിപ്പിക്കുന്ന നിശ്ചിത പിതൃപദവി.
- source_word: ἔχει ζωὴν ἐν ἑαυτῷ
  choice: തന്നിൽത്തന്നെ ജീവൻ ഉണ്ട്
  rationale: വർത്തമാനകാല പ്രസ്താവനയും ἐν ἑαυτῷ എന്ന പ്രയോഗവും സാങ്കേതിക ദൈവശാസ്ത്രപദമാക്കാതെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: οὕτως καὶ
  choice: പുത്രനും ... അതുപോലെ
  rationale: ὥσπερ...οὕτως എന്ന പരസ്പരബന്ധിത താരതമ്യം മലയാളവാക്യക്രമത്തിൽ വ്യക്തമാക്കുകയും καί-യുടെ ‘ഉം’ അർഥം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: τῷ υἱῷ
  choice: പുത്രനും
  rationale: ἔδωκεν എന്ന ക്രിയയുടെ പരോക്ഷ കർമമായ ദാതൃവിഭക്തി മലയാളത്തിലെ ‘-നും’ രൂപത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἔδωκεν
  choice: നൽകി
  rationale: സാധാരണമായ ‘കൊടുക്കുക/നൽകുക’ എന്ന അർഥം നേരിട്ട് സംരക്ഷിക്കുന്നു; ലഭിച്ച അധികാരമെന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ അധികമായി ചേർക്കുന്നില്ല.
- source_word: ζωὴν ἔχειν ἐν ἑαυτῷ
  choice: തന്നിൽത്തന്നെ ജീവൻ ഉണ്ടായിരിക്കുവാൻ
  rationale: അനന്തരൂപഘടനയും പിതാവിനെക്കുറിച്ചുള്ള ആദ്യപ്രയോഗത്തോടുള്ള സമാന്തരതയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἐν ἑαυτῷ എന്നത് സാങ്കേതികമായി ‘സ്വയംനിലനിൽക്കുന്ന ജീവൻ’ എന്നു വ്യാഖ്യാനിക്കണമോ
  choice: ‘തന്നിൽത്തന്നെ ജീവൻ’ എന്ന മൂലപ്രയോഗത്തോട് ചേർന്ന ഭാഷ നിലനിർത്തി.
  alternative: ‘സ്വയംനിലനിൽക്കുന്ന ജീവൻ’ അല്ലെങ്കിൽ ദൈവശാസ്ത്രത്തിലെ ‘aseity’ എന്ന ആശയം തുറന്നുപറയുക.
  rationale: വാക്യം ഉൾസ്ഥിതമായ ജീവനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും സാങ്കേതിക പദം ഉപയോഗിക്കുന്നത് ഗ്രീക്ക് വാചകത്തേക്കാൾ വ്യാഖ്യാനാത്മകമാണ്.
- issue: പിതാവ് പുത്രന് ‘നൽകി’ എന്ന പ്രസ്താവനയിലെ പിതൃപുത്രബന്ധം
  choice: ἔδωκεν എന്ന നൽകലിന്റെ ഭാഷ വിശദീകരിച്ച് മൃദൂകരിക്കാതെ സംരക്ഷിച്ചു.
  alternative: ‘അധികാരം നൽകി’ എന്നോ പുത്രന്റെ ദൈവത്വത്തെ വിശദീകരിക്കുന്ന വാക്കുകളോ മുഖ്യപാഠത്തിൽ ചേർക്കുക.
  rationale: മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം നിലനിർത്തുന്നു; പുത്രന്റെ സ്വഭാവത്തെക്കുറിച്ചുള്ള അധിക വിശദീകരണം ഈ വാക്യത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അവിടന്ന്’ എന്ന ആദരസൂചക സർവനാമം പിതാവിനെ സൂചിപ്പിക്കുന്നു. സമാന്തരത സംരക്ഷിക്കുമ്പോൾ മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിന് ചെറിയ ക്രമീകരണം വരുത്തിയിട്ടുണ്ട്.
