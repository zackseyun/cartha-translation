id: JHN.5.36
reference: John 5:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἔχω τὴν μαρτυρίαν ⸀μείζω τοῦ Ἰωάννου, τὰ γὰρ ἔργα ἃ ⸀δέδωκέν μοι ὁ πατὴρ ἵνα τελειώσω αὐτά, αὐτὰ τὰ ἔργα ⸀ἃ ποιῶ, μαρτυρεῖ περὶ ἐμοῦ ὅτι ὁ πατήρ με ἀπέσταλκεν,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/036.yaml
  text: But I have testimony greater than John's[a], for the works that the Father has given me to complete—these very works that I am doing—testify about me that the Father has sent me.
translation:
  language: ml
  text: എന്നാൽ, എനിക്ക് യോഹന്നാന്റേതിനെക്കാൾ വലിയ സാക്ഷ്യമുണ്ട്.[a] കാരണം, ഞാൻ അവ പൂർത്തിയാക്കേണ്ടതിന് പിതാവ് എനിക്കു തന്ന പ്രവൃത്തികൾ—ഞാൻ ചെയ്തുകൊണ്ടിരിക്കുന്ന ഈ പ്രവൃത്തികൾ തന്നെ—പിതാവ് എന്നെ അയച്ചിരിക്കുന്നു എന്ന് എന്നെക്കുറിച്ച് സാക്ഷ്യം വഹിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘യോഹന്നാന്റേതിനെക്കാൾ വലിയ സാക്ഷി.’
    reason: μαρτυρία എന്ന ഗ്രീക്കുപദത്തിന് സന്ദർഭാനുസൃതമായി ‘സാക്ഷ്യം’ എന്നും ‘സാക്ഷി’ എന്നും പരിഭാഷസാധ്യതയുണ്ട്; മുഖ്യപാഠത്തിൽ തെളിവുസംബന്ധമായ അർഥം വ്യക്തമാക്കാൻ ‘സാക്ഷ്യം’ ഉപയോഗിച്ചിരിക്കുന്നു.
lexical_decisions:
- source_word: μαρτυρίαν
  choice: സാക്ഷ്യം
  rationale: യോഹന്നാനിലെ നിയമപരവും തെളിവുസംബന്ധവുമായ അർഥഭാവം നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഉണ്ട്’ എന്നതിനോടു ചേരുകയും ചെയ്യുന്നു.
- source_word: μείζω τοῦ Ἰωάννου
  choice: യോഹന്നാന്റേതിനെക്കാൾ വലിയ
  rationale: താരതമ്യത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ഗ്രീക്കിലെ ലോപിതമായ ‘സാക്ഷ്യം’ മലയാളത്തിലും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἔργα
  choice: പ്രവൃത്തികൾ
  rationale: അടയാളങ്ങൾ മാത്രമായി അർഥം ചുരുക്കാതെ, യേശുവിന്റെ ദൈവനിയോഗപ്രകാരമുള്ള പ്രവർത്തനങ്ങളുടെ യോഹന്നാനീയ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: δέδωκέν μοι ὁ πατήρ
  choice: പിതാവ് എനിക്കു തന്ന
  rationale: പിതാവാണ് നൽകിയത് എന്ന ആശയവും അതിന്റെ നിലനിൽക്കുന്ന ഫലവും ലളിതമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἵνα τελειώσω αὐτά
  choice: പൂർത്തിയാക്കാൻ
  rationale: ἵναയുടെ ഉദ്ദേശ്യാർഥവും τελειόωയുടെ നിയോഗിക്കപ്പെട്ട പ്രവൃത്തികളെ ലക്ഷ്യത്തിലെത്തിക്കുന്ന അർഥവും സംക്ഷിപ്തമായി പകർത്തുന്നു.
- source_word: αὐτὰ τὰ ἔργα ἃ ποιῶ
  choice: ഞാൻ ചെയ്തുകൊണ്ടിരിക്കുന്ന ഈ പ്രവൃത്തികൾതന്നെ
  rationale: αὐτάയുടെ ഊന്നലും ποιῶയുടെ വർത്തമാനകാല തുടർച്ചയും സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: μαρτυρεῖ περὶ ἐμοῦ
  choice: എന്നെക്കുറിച്ചു സാക്ഷ്യം വഹിക്കുന്നു
  rationale: തെളിവുനൽകുന്ന സാക്ഷ്യത്തിന്റെ ഭാവം നിലനിർത്തുന്ന പ്രചാരത്തിലുള്ള മാന്യമായ മലയാളപ്രയോഗമാണ്.
- source_word: ἀπέσταλκεν
  choice: അയച്ചിരിക്കുന്നു
  rationale: പിതാവിന്റെ അയയ്ക്കൽ പൂർത്തിയായ സംഭവമായിരിക്കെ അതിന്റെ പ്രാബല്യം തുടരുന്നു എന്ന ഗ്രീക്ക് perfect കാലത്തിന്റെ ഭാവം പകർത്തുന്നു.
theological_decisions:
- issue: യേശുവിനെ സാധൂകരിക്കുന്ന സാക്ഷ്യത്തിന്റെ സ്വഭാവം
  choice: പിതാവ് ഏൽപ്പിച്ച പ്രവൃത്തികൾ യോഹന്നാന്റെ സാക്ഷ്യത്തെക്കാൾ വലിയ സാക്ഷ്യമായി യേശുവിനെക്കുറിച്ചു സാക്ഷ്യം വഹിക്കുന്നു.
  alternative: ‘പ്രവൃത്തികൾ’ എന്നത് അധികാരം തെളിയിക്കുന്ന അത്ഭുതങ്ങൾ മാത്രമാണ്.
  rationale: ἔργα എന്ന പദത്തെ അത്ഭുതങ്ങളിലേക്കു മാത്രം ചുരുക്കാതെ യേശുവിന്റെ ദൈവനിയോഗപ്രകാരമുള്ള മുഴുവൻ പ്രവർത്തനങ്ങളെയും ഉൾക്കൊള്ളാൻ വിവർത്തനം അനുവദിക്കുന്നു; അവ പിതാവ് യേശുവിനെ അയച്ചതിനു സാക്ഷ്യം വഹിക്കുന്നു എന്ന് വാക്യംതന്നെ വ്യക്തമാക്കുന്നു.
- issue: യേശുവുമായുള്ള ബന്ധത്തിൽ ὁ πατήρ എന്ന പ്രയോഗം
  choice: പിതാവ്
  alternative: ദൈവം; എന്റെ പിതാവ്
  rationale: ഗ്രീക്കിലുള്ള നിർദ്ദിഷ്ട സ്ഥാനനാമം അതേപടി നിലനിർത്തുന്നു; ഇല്ലാത്ത ഉടമസ്ഥസർവനാമം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘പ്രവൃത്തികൾതന്നെ’ എന്നത് മൂലത്തിലെ ഊന്നൽ സംരക്ഷിക്കുന്നു; ദീർഘവാക്യത്തിലെ ആശയബന്ധം വ്യക്തമാക്കാൻ ഡാഷുകൾ ഉപയോഗിച്ചിരിക്കുന്നു.
