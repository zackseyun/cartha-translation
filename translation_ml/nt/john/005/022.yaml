  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐδὲ γὰρ ὁ πατὴρ κρίνει οὐδένα, ἀλλὰ τὴν κρίσιν πᾶσαν δέδωκεν τῷ υἱῷ,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/022.yaml
  text: For the Father judges no one, but has given all judgment to the Son,
translation:
  language: ml
  text: എന്തെന്നാൽ, പിതാവ് ആരെയും വിധിക്കുന്നില്ല; മറിച്ച്, ന്യായവിധി മുഴുവനും പുത്രനു നൽകിയിരിക്കുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ γὰρ
  choice: എന്തെന്നാൽ
  rationale: γάρ മുൻവാക്യത്തെ വിശദീകരിക്കുന്ന ബന്ധം സൂചിപ്പിക്കുന്നു. οὐδέയിലെ നിഷേധാത്മക ആശയം തുടർന്നുള്ള ‘ആരെയും ... ഇല്ല’ എന്ന പ്രയോഗത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: ὁ πατὴρ
  choice: പിതാവ്
  rationale: യോഹന്നാന്റെ സന്ദർഭത്തിൽ ദൈവത്തെ പുത്രനോടുള്ള ബന്ധത്തിൽ സൂചിപ്പിക്കുന്ന വ്യക്തിപരമായ സ്ഥാനനാമമാണിത്.
- source_word: κρίνει οὐδένα
  choice: ആരെയും വിധിക്കുന്നില്ല
  rationale: വർത്തമാനകാല ക്രിയ പൊതുവായ യാഥാർഥ്യം പ്രസ്താവിക്കുന്നു. ‘വിധിക്കുന്നു’ എന്നത് അർഥത്തെ ‘ശിക്ഷ വിധിക്കുന്നു’ എന്നതിലേക്കു ചുരുക്കാതെ κρίσις എന്ന പദവുമായുള്ള ബന്ധവും നിലനിർത്തുന്നു.
- source_word: ἀλλὰ
  choice: മറിച്ച്
  rationale: പിതാവ് ആരെയും വിധിക്കുന്നില്ല എന്നതും ന്യായവിധി പുത്രനു നൽകിയിരിക്കുന്നു എന്നതും തമ്മിലുള്ള ശക്തമായ വൈരുധ്യം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: τὴν κρίσιν πᾶσαν
  choice: ന്യായവിധി മുഴുവനും
  rationale: വിധിക്കുന്ന പ്രവൃത്തിയെയും ചുമതലയെയും സൂചിപ്പിക്കുന്ന നാമരൂപം നിലനിർത്തുകയും πᾶσαν എന്നതിന്റെ സമഗ്രത വ്യക്തമാക്കുകയും ചെയ്യുന്നു; ‘വിധിക്കാനുള്ള അധികാരം’ എന്ന് വ്യാഖ്യാനിച്ചു വികസിപ്പിക്കുന്നില്ല.
- source_word: δέδωκεν
  choice: നൽകിയിരിക്കുന്നു
  rationale: പൂർത്തിയായ പ്രവൃത്തിയുടെ നിലനിൽക്കുന്ന ഫലം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പൂർണകാലത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: τῷ υἱῷ
  choice: പുത്രനു
  rationale: ഗ്രീക്കിലുള്ള ‘പുത്രൻ’ എന്ന ക്രിസ്തുശാസ്ത്രപരമായ സ്ഥാനനാമം കൈവശസർവനാമം ചേർക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: പിതാവിന്റെ വിധിയും പുത്രന്റെ വിധിയും തമ്മിലുള്ള ബന്ധം
  choice: പിതാവ് ആരെയും വിധിക്കുന്നില്ലെന്നും ന്യായവിധി മുഴുവനും പുത്രനു നൽകിയിരിക്കുന്നുവെന്നും വാക്യം നേരിട്ട് പറയുന്നു.
  alternative: ‘പുത്രനിൽനിന്ന് സ്വതന്ത്രമായി പിതാവ് ആരെയും വിധിക്കുന്നില്ല’ എന്നു വ്യക്തമാക്കുക, അല്ലെങ്കിൽ ഇത് അന്ത്യന്യായവിധിക്കു മാത്രമായി പരിമിതപ്പെടുത്തുക.
  rationale: ഗ്രീക്കിൽ ഇല്ലാത്ത സമന്വയവ്യാഖ്യാനമോ കാലപരിധിയോ ചേർക്കാതെ വാക്യത്തിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം നിലനിർത്തുന്നു.
- issue: ‘പുത്രൻ’ എന്ന ക്രിസ്തുശാസ്ത്രപരമായ സ്ഥാനനാമം
  choice: ‘പുത്രൻ’ എന്ന സ്ഥാനനാമം അതേപടി നിലനിർത്തുന്നു.
  alternative: ‘അവന്റെ പുത്രൻ’ എന്നു പരിഭാഷപ്പെടുത്തുക.
  rationale: മൂലപാഠത്തിൽ കൈവശസർവനാമമില്ല; യോഹന്നാന്റെ സന്ദർഭത്തിലെ പിതാവ്–പുത്രൻ ബന്ധവും സ്ഥാനനാമത്തിന്റെ പ്രാധാന്യവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. വാക്യത്തിലെ വിശദീകരണബന്ധവും ശക്തമായ വൈരുധ്യവും വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു.
