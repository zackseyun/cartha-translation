reference: John 5:47
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ δὲ τοῖς ἐκείνου γράμμασιν οὐ πιστεύετε, πῶς τοῖς ἐμοῖς ῥήμασιν πιστεύσετε;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/047.yaml
  text: But if you do not believe his writings[a], how will you believe my words?
translation:
  language: ml
  text: എന്നാൽ അവന്റെ എഴുത്തുകൾ[a] നിങ്ങൾ വിശ്വസിക്കുന്നില്ലെങ്കിൽ, എന്റെ വാക്കുകൾ എങ്ങനെ വിശ്വസിക്കും?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവന്റെ കത്തുകൾ.’ ഗ്രീക്ക് പദത്തിന് ‘കത്തുകൾ’ എന്നോ ‘എഴുത്തുകൾ’ എന്നോ അർഥമാകാം; ഇവിടെ മോശെ എഴുതിയവയെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: എന്നാൽ … ഇല്ലെങ്കിൽ
  rationale: δέയുടെ വൈരുധ്യസൂചനയും εἰയുടെ ഉപാധിസ്വഭാവവും സ്വാഭാവികമായ മലയാളവാക്യഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: τοῖς ἐκείνου γράμμασιν
  choice: അവന്റെ എഴുത്തുകൾ
  rationale: മുൻസന്ദർഭത്തിലെ മോശെയെയാണ് ἐκείνου സൂചിപ്പിക്കുന്നത്. γράμματα ഇവിടെ സ്വകാര്യകത്തുകളെയല്ല, മോശെ എഴുതിയവയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘എഴുത്തുകൾ’ എന്നു പരിഭാഷപ്പെടുത്തി; ‘തിരുവെഴുത്തുകൾ’ എന്നു നൽകി മൂലത്തിൽ ഇല്ലാത്ത പ്രത്യേകത ചേർത്തിട്ടില്ല.
- source_word: οὐ πιστεύετε
  choice: നിങ്ങൾ വിശ്വസിക്കുന്നില്ല
  rationale: ദത്തിവിനോടുകൂടിയ πιστεύω ഇവിടെ എഴുതിയ സാക്ഷ്യം സത്യമെന്നു അംഗീകരിക്കുന്ന അർഥത്തിലാണ്; വർത്തമാനകാലവും നിഷേധവും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: πῶς … πιστεύσετε
  choice: എങ്ങനെ വിശ്വസിക്കും?
  rationale: πῶς എന്ന ചോദ്യവും πιστεύσετε എന്ന ഭാവികാലവും നിലനിർത്തുന്നു; ‘എങ്ങനെ കഴിയും?’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക രൂപം ഒഴിവാക്കുന്നു.
- source_word: τοῖς ἐμοῖς ῥήμασιν
  choice: എന്റെ വാക്കുകൾ
  rationale: ῥήματα സംസാരിച്ച വാക്കുകളെയോ ഉച്ചാരണങ്ങളെയോ സൂചിപ്പിക്കുന്നു. ‘എന്റെ വാക്കുകൾ’ സ്വാഭാവികവും മോശെയുടെ എഴുത്തുകളുമായുള്ള വൈരുധ്യം വ്യക്തമാക്കുന്നതുമാണ്.
theological_decisions:
- issue: ἐκείνου (‘അവന്റെ’) എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: ഉടൻമുൻസന്ദർഭത്തെ അനുസരിച്ച് മോശെയെ സൂചിപ്പിക്കുന്ന ‘അവന്റെ’
  alternative: ‘മോശെയുടെ’ എന്ന് പേര് ആവർത്തിക്കുക; അല്ലെങ്കിൽ അനിശ്ചിതമായ മറ്റൊരു മുൻഗാമി
  rationale: യോഹന്നാൻ 5:45–46-ൽ മോശെയെ വ്യക്തമായി പരാമർശിക്കുകയും അവൻ യേശുവിനെക്കുറിച്ച് എഴുതിയെന്ന് പറയുകയും ചെയ്യുന്നു. എങ്കിലും ഗ്രീക്കിലെ സർവനാമരൂപം സംരക്ഷിക്കാൻ മുഖ്യപാഠത്തിൽ പേര് ആവർത്തിച്ചിട്ടില്ല.
- issue: πιστεύω എന്ന വിശ്വാസഭാഷയുടെ സ്വഭാവം
  choice: രണ്ടിടത്തും ‘വിശ്വസിക്കുക’
  alternative: ‘ആശ്രയിക്കുക’ അല്ലെങ്കിൽ ‘വിശ്വാസമർപ്പിക്കുക’
  rationale: ഇവിടെ മോശെയുടെ എഴുത്തുകളും യേശുവിന്റെ വാക്കുകളും സത്യമെന്നു സ്വീകരിക്കുന്നതാണ് ഊന്നൽ. ഒരേ ക്രിയ രണ്ടിടത്തും ആവർത്തിക്കുന്ന ഗ്രീക്ക് സമാന്തരതയും ഇതിലൂടെ നിലനിൽക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ എഴുത്തുകൾ/വാക്കുകൾ എന്ന വൈരുധ്യവും വർത്തമാനകാലം/ഭാവികാലം എന്ന വ്യത്യാസവും നിലനിർത്തിയിരിക്കുന്നു.
