id: JHN.5.42
reference: John 5:42
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλὰ ἔγνωκα ὑμᾶς ὅτι τὴν ἀγάπην τοῦ θεοῦ οὐκ ἔχετε ἐν ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/042.yaml
  text: 'But I know you: you do not have the love of God in yourselves.'
translation:
  language: ml
  text: 'എന്നാൽ, ഞാൻ നിങ്ങളെ അറിയുന്നു: നിങ്ങളിൽ ദൈവത്തിന്റെ സ്നേഹമില്ല.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങളിൽ ദൈവത്തോടുള്ള സ്നേഹമില്ല.” ഗ്രീക്കുപദസമുച്ചയം “ദൈവത്തിൽനിന്നുള്ള സ്നേഹം” അല്ലെങ്കിൽ “ദൈവത്തിന്റെ സ്വന്തം സ്നേഹം” എന്നും മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭത്തോടുള്ള ശക്തമായ വൈരുധ്യം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἔγνωκα
  choice: എനിക്ക് അറിയാം
  rationale: പൂർണകാലരൂപം മുൻപരിചയത്തിൽനിന്നുള്ള ഉറച്ച അറിവിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ വർത്തമാനപ്രയോഗം അതിന്റെ സ്ഥിതിവാചകബലം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὑμᾶς
  choice: നിങ്ങളെ
  rationale: ക്രിയയുടെ ബഹുവചന കർമം നേരിട്ട് പ്രതിനിധീകരിക്കുന്നു.
- source_word: ὅτι
  choice: ':'
  rationale: യേശു അവരെക്കുറിച്ച് അറിയുന്നതിന്റെ ഉള്ളടക്കം തുടർന്നുള്ള വാക്യമായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: τὴν ἀγάπην τοῦ θεοῦ
  choice: ദൈവത്തോടുള്ള സ്നേഹം
  rationale: യോഹന്നാൻ 5-ലെ സമീപസന്ദർഭത്തിൽ ദൈവത്തെ യഥാർഥമായി സ്നേഹിക്കാത്തതെന്ന അർഥമാണ് ഏറ്റവും സാദ്ധ്യം; മലയാളത്തിലെ ‘ദൈവത്തിന്റെ സ്നേഹം’ സാധാരണയായി ദൈവം മനുഷ്യരോടു കാണിക്കുന്ന സ്നേഹമായി മാത്രം കേൾക്കാൻ ഇടയുള്ളതിനാൽ പ്രധാനപാഠത്തിൽ ദിശ വ്യക്തമാക്കുന്നു, മറ്റു ജനിറ്റീവ് സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: οὐκ ἔχετε
  choice: ഇല്ല
  rationale: അവരിൽ സ്നേഹം നിലനിൽക്കുന്നില്ലെന്ന വർത്തമാനാവസ്ഥ മലയാളത്തിൽ സ്വാഭാവികമായി പറയുന്നു.
- source_word: ἐν ἑαυτοῖς
  choice: നിങ്ങളുടെ ഉള്ളിൽ
  rationale: ആന്തരികമായ കൈവശമോ സാന്നിധ്യമോ സൂചിപ്പിക്കുന്ന പ്രതിബിംബ ബഹുവചനത്തെ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: τὴν ἀγάπην τοῦ θεοῦ എന്ന ജനിറ്റീവ് പ്രയോഗത്തിന്റെ അർഥം
  choice: പ്രധാനപാഠത്തിൽ ‘ദൈവത്തോടുള്ള സ്നേഹം’
  alternative: ‘ദൈവത്തിൽനിന്നുള്ള സ്നേഹം’ അല്ലെങ്കിൽ ‘ദൈവത്തിന്റെ സ്നേഹം’
  rationale: ജനിറ്റീവ് വ്യാകരണപരമായി ഒന്നിലധികം ബന്ധങ്ങൾ അനുവദിക്കുന്നു. ഈ സന്ദർഭത്തിൽ ദൈവത്തോടു ദിശപ്പെടുത്തിയ സ്നേഹമാണ് കൂടുതൽ സാദ്ധ്യം; എന്നിരുന്നാലും ഉറവിടപാഠത്തിലെ വിശാലമായ സാധ്യത അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നിങ്ങളുടെ ഉള്ളിൽ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; കോളൺ ὅτι അവതരിപ്പിക്കുന്ന അറിവിന്റെ ഉള്ളടക്കം സ്വാഭാവികമായി വേർതിരിക്കുന്നു.
