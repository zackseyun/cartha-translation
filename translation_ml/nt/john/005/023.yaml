id: JHN.5.23
reference: John 5:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἵνα πάντες τιμῶσι τὸν υἱὸν καθὼς τιμῶσι τὸν πατέρα. ὁ μὴ τιμῶν τὸν υἱὸν οὐ τιμᾷ τὸν πατέρα τὸν πέμψαντα αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/023.yaml
  text: so that all may honor the Son just as they honor the Father. The one who does not honor the Son does not honor the Father who sent him.
translation:
  language: ml
  text: എല്ലാവരും പിതാവിനെ ബഹുമാനിക്കുന്നതുപോലെതന്നെ പുത്രനെയും ബഹുമാനിക്കേണ്ടതിന്. പുത്രനെ ബഹുമാനിക്കാത്തവൻ അവനെ അയച്ച പിതാവിനെ ബഹുമാനിക്കുന്നില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: ബഹുമാനിക്കേണ്ടതിനാണ്
  rationale: ഉദ്ദേശ്യത്തെ സൂചിപ്പിക്കുന്ന ἵναയുടെ പ്രാബല്യം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു. മുൻവാക്യവുമായി ബന്ധമുള്ളതിനാൽ ‘ഇത്’ ചേർത്തത് ആശയബന്ധം വ്യക്തമാക്കുന്നു; പുതിയ അർഥം ചേർക്കുന്നില്ല.
- source_word: πάντες
  choice: എല്ലാവരും
  rationale: സകല വ്യക്തികളെയും ഉൾക്കൊള്ളുന്ന നാമസദൃശ പ്രയോഗം മലയാളത്തിൽ വ്യക്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: τιμῶσι / τιμῶν / τιμᾷ
  choice: ബഹുമാനിക്കുക
  rationale: τιμάωയുടെ ‘ആദരിക്കുക, അർഹമായ ബഹുമാനം നൽകുക’ എന്ന അർഥം നേരിട്ട് നൽകുകയും വാക്യത്തിലെ ആവർത്തനസമാന്തര്യം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: τὸν υἱὸν
  choice: പുത്രനെ
  rationale: യോഹന്നാനിലെ സന്ദർഭത്തിൽ ഇത് ക്രിസ്തുവിനെ സൂചിപ്പിക്കുന്ന ബന്ധനാമവും പദവിയുമാണ്; മലയാള ബൈബിൾ ശൈലിയിൽ ‘പുത്രൻ’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: καθὼς
  choice: പോലെതന്നെ
  rationale: വെറും സാമ്യം മാത്രമല്ല, ശക്തമായ അനുരൂപതയാണ് καθώς സൂചിപ്പിക്കുന്നത്; ‘പോലെതന്നെ’ അത് ചുരുക്കമായും വ്യക്തമായും സംരക്ഷിക്കുന്നു.
- source_word: τὸν πατέρα
  choice: പിതാവിനെ
  rationale: സന്ദർഭത്തിൽ ദൈവത്തെ വ്യക്തിപരമായ ബന്ധനാമത്തിൽ സൂചിപ്പിക്കുന്നു; ‘പിതാവ്’ ആ അർഥം ഗൗരവത്തോടെ നൽകുന്നു.
- source_word: ὁ μὴ τιμῶν
  choice: ബഹുമാനിക്കാത്തവൻ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ വർത്തമാനകൃതന്തത്തിന്റെ പൊതുവായ, സിദ്ധാന്തവാക്യസ്വഭാവം മലയാളത്തിലെ സ്വാഭാവിക വ്യക്തിവാചക രൂപത്തിൽ നൽകുന്നു.
- source_word: τὸν πέμψαντα αὐτόν
  choice: അവനെ അയച്ച
  rationale: കൃതന്തപ്രയോഗം പിതാവിനെ വിശേഷിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള ഉപവാക്യമായി നൽകുന്നു; αὐτόν എന്നത് പുത്രനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അവനെ’ എന്നു നിലനിർത്തുന്നു.
- source_word: πέμψαντα
  choice: അയച്ച
  rationale: πέμπωയുടെ അടിസ്ഥാന അർഥം നേരിട്ട് നൽകുന്നു; ‘നിയോഗിച്ച’ എന്നത് മൂലത്തിൽ വ്യക്തമായി പറയാത്ത കമ്മീഷൻ ആശയം അധികമായി മുന്നോട്ടുകൊണ്ടുവരാം.
theological_decisions:
- issue: പുത്രനെയും പിതാവിനെയും ബഹുമാനിക്കുന്നതിലെ താരതമ്യത്തിന്റെ ശക്തി
  choice: καθὼς എന്നത് ‘പോലെതന്നെ’ എന്നു പരിഭാഷപ്പെടുത്തി, ഇരുവർക്കും നൽകേണ്ട ബഹുമാനത്തിലെ ശക്തമായ അനുരൂപത നിലനിർത്തി.
  alternative: ‘പോലെ’ എന്ന ലളിതരൂപം ഉപയോഗിക്കുക.
  rationale: ഗ്രീക്ക് പാഠത്തിലെ ശക്തമായ താരതമ്യം മയപ്പെടുത്താതെയും, പിന്നീടുള്ള ദൈവശാസ്ത്രപരമായ സാങ്കേതിക പദങ്ങൾ വാക്യത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതെയും മൂലത്തിന്റെ ഭാരം സംരക്ഷിക്കുന്നു.
- issue: ‘പുത്രൻ’, ‘പിതാവ്’ എന്നീ പദങ്ങളുടെ പദവിസ്വഭാവം
  choice: യേശുവിനെയും ദൈവപിതാവിനെയും സൂചിപ്പിക്കുന്ന സന്ദർഭോചിത പദവികളായി ‘പുത്രൻ’, ‘പിതാവ്’ ഉപയോഗിച്ചു.
  alternative: പൊതുവായ കുടുംബബന്ധപദങ്ങളെന്ന മട്ടിൽ ‘മകൻ’, ‘അച്ഛൻ’ ഉപയോഗിക്കുക.
  rationale: സന്ദർഭം ദൈവിക വ്യക്തിസംബന്ധത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘പുത്രൻ’, ‘പിതാവ്’ എന്ന രൂപങ്ങൾ ആ പദവിസ്വഭാവവും ഗൗരവവും നിലനിർത്തുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത അധിക സിദ്ധാന്തവിവരണം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ഗൗരവമുള്ള ശൈലി. ‘ബഹുമാനിക്കുക’ എന്ന ക്രിയയുടെ മൂന്നു ആവർത്തനങ്ങളും ഉദ്ദേശപൂർവം നിലനിർത്തി. ആദ്യവാക്യം മുൻസന്ദർഭവുമായി ബന്ധിപ്പിക്കാൻ ‘ഇത്’ ഉപയോഗിച്ചു.
