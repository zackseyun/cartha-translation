id: JHN.5.43
reference: John 5:43
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐγὼ ἐλήλυθα ἐν τῷ ὀνόματι τοῦ πατρός μου καὶ οὐ λαμβάνετέ με· ἐὰν ἄλλος ἔλθῃ ἐν τῷ ὀνόματι τῷ ἰδίῳ, ἐκεῖνον λήμψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/043.yaml
  text: I have come in my Father's name[a], and you do not receive me. If another comes in his own name[b], you will receive him.
translation:
  language: ml
  text: ഞാൻ എന്റെ പിതാവിന്റെ നാമത്തിൽ[a] വന്നിരിക്കുന്നു; എന്നിട്ടും നിങ്ങൾ എന്നെ സ്വീകരിക്കുന്നില്ല. മറ്റൊരാൾ സ്വന്തം നാമത്തിൽ[b] വന്നാൽ, നിങ്ങൾ അവനെ സ്വീകരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എന്റെ പിതാവിന്റെ അധികാരത്തോടെ.’ ‘നാമത്തിൽ’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന് പേര് എന്ന അർഥത്തോടൊപ്പം പ്രതിനിധിത്വത്തെയോ അധികാരത്തെയോ സൂചിപ്പിക്കാനും കഴിയും.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘സ്വന്തം അധികാരത്തിൽ.’ ‘സ്വന്തം നാമത്തിൽ’ എന്ന പ്രയോഗം, യേശു ‘എന്റെ പിതാവിന്റെ നാമത്തിൽ’ വന്നതുമായി ശക്തമായ വൈരുധ്യം സൃഷ്ടിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλήλυθα
  choice: വന്നിരിക്കുന്നു
  rationale: ἔρχομαι എന്ന ക്രിയയുടെ പൂർണകാലരൂപം, മുമ്പ് വന്നതിന്റെ ഫലം ഇപ്പോഴും നിലനിൽക്കുന്നതായി സൂചിപ്പിക്കുന്നു; ‘വന്നിരിക്കുന്നു’ ആ ഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἐν τῷ ὀνόματι τοῦ πατρός μου
  choice: എന്റെ പിതാവിന്റെ നാമത്തിൽ
  rationale: ഈ പ്രയോഗത്തിന് പ്രതിനിധിത്വത്തിന്റെയും അധികാരത്തിന്റെയും അർഥസൂചനകളുണ്ടെങ്കിലും, ‘നാമത്തിൽ’ എന്ന രൂപം മൂലപാഠത്തിന്റെ സമാന്തരഘടനയും വിശാലമായ അർഥപരിധിയും സംരക്ഷിക്കുന്നു.
- source_word: οὐ λαμβάνετέ με
  choice: നിങ്ങൾ എന്നെ സ്വീകരിക്കുന്നില്ല
  rationale: ഇവിടെ λαμβάνω ശാരീരികമായി എടുക്കുക എന്നതിലുപരി യേശുവിനെ അംഗീകരിക്കുകയോ സ്വീകരിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘സ്വീകരിക്കുക’ ഈ രണ്ടു ഭാവങ്ങളും ഉൾക്കൊള്ളുന്നു.
- source_word: ἄλλος
  choice: മറ്റൊരാൾ
  rationale: യേശുവിനോടുള്ള വൈരുധ്യം അധിക വ്യാഖ്യാനം ചേർക്കാതെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἐν τῷ ὀνόματι τῷ ἰδίῳ
  choice: സ്വന്തം നാമത്തിൽ
  rationale: ‘എന്റെ പിതാവിന്റെ നാമത്തിൽ’ എന്ന മുൻപ്രയോഗത്തോടുള്ള കൃത്യമായ വൈരുധ്യവും സമാന്തരതയും നിലനിർത്തുകയും സ്വയം അധികാരപ്പെടുത്തൽ എന്ന സൂചന തുറന്നുവെക്കുകയും ചെയ്യുന്നു.
- source_word: ἐκεῖνον λήμψεσθε
  choice: നിങ്ങൾ അവനെ സ്വീകരിക്കും
  rationale: ഭാവികാലരൂപം നേരിട്ട് നൽകുകയും ആദ്യവാക്യത്തിലെ ‘സ്വീകരിക്കുന്നില്ല’ എന്ന പ്രയോഗം ആവർത്തിച്ച് വാക്യത്തിന്റെ വാഗ്മിതാപരമായ വൈരുധ്യം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘എന്റെ പിതാവ്’ എന്നത് ദൈവപിതാവിനെ സൂചിപ്പിക്കുന്നുവെന്ന് മുഖ്യപാഠത്തിൽ കൂടുതൽ വ്യക്തമാക്കണമോ
  choice: ‘എന്റെ പിതാവ്’ എന്ന മൂലപാഠത്തോട് ചേർന്ന രൂപം നിലനിർത്തി.
  alternative: ‘ദൈവമായ എന്റെ പിതാവ്’ എന്ന് വ്യക്തമാക്കുക.
  rationale: യോഹന്നാന്റെ സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത് ദൈവമാണെന്ന് വ്യക്തമാണ്; എന്നാൽ ‘ദൈവമായ’ എന്ന് ചേർക്കുന്നത് ഗ്രീക്കിൽ ഇല്ലാത്ത വിശദീകരണം മുഖ്യപാഠത്തിൽ കൊണ്ടുവരും.
- issue: ‘നാമത്തിൽ’ എന്ന പ്രയോഗങ്ങളെ അധികാരത്തെ സൂചിപ്പിക്കുന്ന ഭാഷയായി മുഖ്യപാഠത്തിൽ വ്യാഖ്യാനിക്കണമോ
  choice: രണ്ടിടത്തും ‘നാമത്തിൽ’ എന്ന പ്രയോഗം നിലനിർത്തി.
  alternative: ‘എന്റെ പിതാവിന്റെ അധികാരത്തോടെ’ എന്നും ‘സ്വന്തം അധികാരത്തിൽ’ എന്നും പരിഭാഷപ്പെടുത്തുക.
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിൽ അധികാരത്തിന്റെയും പ്രതിനിധിത്വത്തിന്റെയും സൂചനയുണ്ടെങ്കിലും, അതിനെ മുഖ്യപാഠത്തിൽ അധികാരമെന്ന ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കുന്നത് അർഥപരിധിയും ഉദ്ദേശ്യപൂർവമായ സമാന്തരതയും കുറയ്ക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. ‘വന്നിരിക്കുന്നു’ എന്ന രൂപം ഗ്രീക്ക് പൂർണകാലത്തിന്റെ ഇപ്പോഴും നിലനിൽക്കുന്ന ഫലഭാവം നൽകുന്നു. καί ഇവിടെ പ്രതീക്ഷാവിരുദ്ധമായ ബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവിക മലയാളത്തിനായി ‘എന്നിട്ടും’ എന്നു നൽകി.
