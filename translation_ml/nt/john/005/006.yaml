  to: 'യേശു ഈ മനുഷ്യൻ കിടക്കുന്നതുകണ്ട്, അയാൾക്ക് ഈ അവസ്ഥ ഉണ്ടായിട്ട് ഇതിനകം വളരെക്കാലമായെന്ന് അറിഞ്ഞപ്പോൾ, അയാളോടു ചോദിച്ചു: “സുഖം പ്രാപിക്കാൻ നിനക്ക് ആഗ്രഹമുണ്ടോ?”'
  rationale: തിരുത്തൽ മലയാളവാക്യത്തിന്റെ വ്യാകരണവും ഒഴുക്കും മെച്ചപ്പെടുത്തുന്നു. ‘ഈ അവസ്ഥ ഉണ്ടായിട്ട്’ എന്നത് ഗ്രീക്കിലെ πολὺν ἤδη χρόνον ἔχει-യുടെ സന്ദർഭാനുസൃതമായ ദീർഘകാല അവസ്ഥയെ അറിയിക്കുന്നു; അത് കുളത്തിനരികിൽ ചെലവഴിച്ച സമയമായി പരിമിതപ്പെടുത്തുന്നില്ല. അറിവിന്റെ ഉറവിടം വ്യക്തമാക്കാതെയും ചോദ്യം നേരിട്ടായി നിലനിർത്തിയുമിരിക്കുന്നു.
