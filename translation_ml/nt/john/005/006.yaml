id: JHN.5.6
reference: John 5:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῦτον ἰδὼν ὁ Ἰησοῦς κατακείμενον, καὶ γνοὺς ὅτι πολὺν ἤδη χρόνον ἔχει, λέγει αὐτῷ· Θέλεις ὑγιὴς γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/006.yaml
  text: When Jesus saw this man lying there[a], and knew that he had already been there a long time, he said to him, “Do you want to become well?”
translation:
  language: ml
  text: 'യേശു ഈ മനുഷ്യൻ കിടക്കുന്നതുകണ്ട്, അയാൾക്ക് ഈ അവസ്ഥ ഉണ്ടായിട്ട് ഇതിനകം വളരെക്കാലമായെന്ന് അറിഞ്ഞപ്പോൾ, അയാളോടു ചോദിച്ചു: “സുഖം പ്രാപിക്കാൻ നിനക്ക് ആഗ്രഹമുണ്ടോ?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτον
  choice: ഈ മനുഷ്യൻ
  rationale: സന്ദർഭത്തിലെ രോഗിയായ പ്രത്യേക വ്യക്തിയെയാണ് സൂചകസർവനാമം ചൂണ്ടിക്കാണിക്കുന്നത്; മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാക്കാൻ ‘ഈ മനുഷ്യൻ’ എന്നു നൽകി.
- source_word: ἰδὼν
  choice: കാണുകയും
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള aorist participle സൂചിപ്പിക്കുന്ന മുൻകാല സാഹചര്യത്തെ ‘കാണുകയും ... അറിഞ്ഞപ്പോൾ’ എന്ന സ്വാഭാവിക മലയാളഘടനയിൽ അവതരിപ്പിച്ചു.
- source_word: κατακείμενον
  choice: കിടക്കുന്നതു
  rationale: ആ മനുഷ്യന്റെ കിടക്കുന്ന അവസ്ഥയാണ് പദം വിവരിക്കുന്നത്; സ്ഥലം വാക്യത്തിൽ വ്യക്തമല്ലാത്തതിനാൽ ‘അവിടെ’ എന്നു ചേർത്തില്ല.
- source_word: γνοὺς
  choice: അറിയുകയും
  rationale: യേശുവിന്റെ അറിവ് നേരിട്ട് അറിയിച്ചു; ആ അറിവ് എങ്ങനെ ലഭിച്ചുവെന്ന് മൂലപാഠം പറയാത്തതിനാൽ അതു വ്യക്തമാക്കിയില്ല.
- source_word: πολὺν ἤδη χρόνον ἔχει
  choice: അയാൾക്ക് ഈ അവസ്ഥയിൽ കഴിഞ്ഞിട്ട് ഇതിനകം വളരെക്കാലമായെന്ന്
  rationale: ഗ്രീക്കിൽ എന്തിനാണ് ‘വളരെക്കാലം’ ആയതെന്നത് പരോക്ഷമാണ്. അടുത്തുള്ള κατακείμενον-ഉം രോഗശാന്തിസന്ദർഭവും കണക്കിലെടുത്ത് ദീർഘകാലമായുള്ള അവസ്ഥ എന്ന അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കി; കുളത്തിനരികിൽ തന്നെയുണ്ടായിരുന്ന കാലമായി ചുരുക്കിയില്ല.
- source_word: λέγει αὐτῷ
  choice: അയാളോടു ചോദിച്ചു
  rationale: ചരിത്രവർത്തമാനമായ λέγει മലയാളകഥനത്തിൽ ഭൂതകാലമായി നൽകി; തുടർന്നുള്ള ചോദ്യം കണക്കിലെടുത്ത് ‘ചോദിച്ചു’ സ്വാഭാവികമാണ്.
- source_word: Θέλεις
  choice: നിനക്ക് ആഗ്രഹമുണ്ടോ
  rationale: θέλω ആഗ്രഹമോ മനസ്സോ സൂചിപ്പിക്കുന്നു; സാധാരണ ആധുനിക മലയാളത്തിൽ നേരിട്ടും മാന്യമായും ചോദ്യം അവതരിപ്പിക്കുന്നു.
- source_word: ὑγιὴς
  choice: സുഖം
  rationale: രോഗം അല്ലെങ്കിൽ ശാരീരിക ദൗർബല്യം മാറി ആരോഗ്യാവസ്ഥയിലെത്തുന്നതിനെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: γενέσθαι
  choice: പ്രാപിക്കാൻ
  rationale: γίνομαι സൂചിപ്പിക്കുന്ന പുതിയ അവസ്ഥയിലേക്കുള്ള പ്രവേശനം ‘സുഖം പ്രാപിക്കുക’ എന്ന മലയാളപ്രയോഗം നിലനിർത്തുന്നു.
theological_decisions:
- issue: γνοὺς എന്നതിൽ യേശുവിന്റെ അറിവിന്റെ സ്വഭാവം
  choice: അറിവ് ഉണ്ടായിരുന്നുവെന്നു മാത്രം പറഞ്ഞു; അതിന്റെ മാർഗം വ്യക്തമാക്കിയില്ല.
  alternative: യേശു അത്ഭുതകരമായി അറിഞ്ഞു; അല്ലെങ്കിൽ നിരീക്ഷണത്തിലൂടെയോ മറ്റുള്ളവരിൽനിന്നോ അറിഞ്ഞു.
  rationale: മൂലപാഠം യേശുവിന് വിവരം അറിയാമായിരുന്നുവെന്ന് പറയുന്നു, എന്നാൽ എങ്ങനെ അറിഞ്ഞുവെന്ന് പറയുന്നില്ല. അതിനാൽ വ്യാഖ്യാനപരമായ ഒരു മാർഗവും പരിഭാഷയിൽ നിർബന്ധിച്ചില്ല.
- issue: πολὺν ἤδη χρόνον ἔχει സൂചിപ്പിക്കുന്ന കാലദൈർഘ്യം
  choice: ആ മനുഷ്യന്റെ ദീർഘകാല അവസ്ഥയായി വിവർത്തനം ചെയ്തു.
  alternative: അയാൾ ആ സ്ഥലത്ത് വളരെക്കാലമായി കിടക്കുകയായിരുന്നു.
  rationale: ഗ്രീക്ക് പ്രയോഗം പൂരകം തുറന്നുവെക്കുന്നു. സന്ദർഭം ദീർഘകാല ശാരീരികാവസ്ഥയെ ശക്തമായി സൂചിപ്പിക്കുന്നു; ‘അവിടെ’ എന്നു നൽകുന്നത് കുളത്തിനരികിലെ താമസകാലമെന്ന അനാവശ്യമായ സ്ഥലപരമായ നിർണ്ണയം വരുത്താം.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. ‘അയാൾ’ എന്നത് ആവർത്തിക്കുന്ന സർവനാമങ്ങളുടെ സൂചന വ്യക്തമാക്കുന്നു; യേശുവിന്റെ നേരിട്ടുള്ള ചോദ്യത്തിൽ സ്വാഭാവികമായ ‘നിനക്ക്’ ഉപയോഗിച്ചു.
