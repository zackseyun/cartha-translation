id: JHN.5.32
reference: John 5:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἄλλος ἐστὶν ὁ μαρτυρῶν περὶ ἐμοῦ, καὶ οἶδα ὅτι ἀληθής ἐστιν ἡ μαρτυρία ἣν μαρτυρεῖ περὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/032.yaml
  text: There is another who testifies about me[a], and I know that the testimony which he testifies about me is true.
translation:
  language: ml
  text: എന്നെക്കുറിച്ച് സാക്ഷ്യം പറയുന്ന മറ്റൊരാളുണ്ട്[a]. എന്നെക്കുറിച്ച് ആ മറ്റൊരാൾ പറയുന്ന സാക്ഷ്യം സത്യമാണെന്ന് എനിക്കറിയാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എന്നെക്കുറിച്ച് സാക്ഷ്യം വഹിക്കുന്ന മറ്റൊരാളുണ്ട്.’
    reason: ‘സാക്ഷ്യം വഹിക്കുക’ എന്നത് μαρτυρέω എന്ന ക്രിയയുടെ കൂടുതൽ ഔപചാരികമായ പരിഭാഷാവികല്പമാണ്.
lexical_decisions:
- source_word: ἄλλος
  choice: മറ്റൊരാൾ
  rationale: ἄλλος മറ്റൊരു വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. സമീപസന്ദർഭത്തിലെ യേശുവിന്റെ സ്വന്തം സാക്ഷ്യത്തോടുള്ള വ്യത്യാസം നിലനിർത്തിക്കൊണ്ട്, ആ വ്യക്തി ആരാണെന്ന് വാക്യത്തിൽ വ്യക്തമാക്കാതിരിക്കാൻ ‘മറ്റൊരാൾ’ അനുയോജ്യമാണ്.
- source_word: ὁ μαρτυρῶν
  choice: സാക്ഷ്യം പറയുന്ന
  rationale: നിശ്ചയാർഥകമായ വർത്തമാനകാല കൃദന്തം ‘സാക്ഷ്യം പറയുന്നയാൾ’ എന്ന അർഥത്തിലാണ്. ‘സാക്ഷ്യം പറയുന്ന’ എന്നത് തുടരുന്ന പ്രവൃത്തിയുടെ ഭാവം നിലനിർത്തുന്ന സ്വാഭാവികമായ ആധുനിക മലയാളമാണ്.
- source_word: περὶ ἐμοῦ
  choice: എന്നെക്കുറിച്ച്
  rationale: ജനിറ്റീവോടുകൂടിയ περί ഇവിടെ പരാമർശവിഷയത്തെ സൂചിപ്പിക്കുന്നു; ‘എന്നെക്കുറിച്ച്’ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: οἶδα
  choice: എനിക്കറിയാം
  rationale: οἶδα അറിവിനെ നേരിട്ട് സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘എനിക്കറിയാം’ സ്വാഭാവികവും അർഥസൂക്ഷ്മതയുള്ളതുമാണ്.
- source_word: ἀληθής
  choice: സത്യമാണ്
  rationale: ἀληθής ഇവിടെ സാക്ഷ്യത്തിന്റെ സത്യസ്വഭാവത്തെ വിശേഷിപ്പിക്കുന്നു. ‘സത്യമാണ്’ എന്നത് ‘വിശ്വസനീയം’ അല്ലെങ്കിൽ ‘സാധുവാണ്’ എന്ന വ്യാഖ്യാനവികാസം ഒഴിവാക്കുന്നു.
- source_word: ἡ μαρτυρία
  choice: സാക്ഷ്യം
  rationale: μαρτυρία സാക്ഷിമൊഴിയെയോ നൽകപ്പെടുന്ന സാക്ഷ്യത്തെയോ സൂചിപ്പിക്കുന്നു. ‘സാക്ഷ്യം’ ഈ ഭാഗത്തിന്റെ ന്യായവ്യവഹാരസദൃശമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: ἣν μαρτυρεῖ
  choice: ആ മറ്റൊരാൾ പറയുന്ന സാക്ഷ്യം
  rationale: ഗ്രീക്കിലെ നാമ-ക്രിയ ആവർത്തനം യോഹന്നാന്റെ ശൈലിയുടെ ഭാഗമാണ്. ‘പറയുന്ന സാക്ഷ്യം’ ആ പദബന്ധം മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നിലനിർത്തുന്നു; ‘ആ മറ്റൊരാൾ’ എന്ന ആവർത്തനം സർവനാമത്തിന്റെ ആദരനില സംബന്ധിച്ച അനാവശ്യ സൂചനയും ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: ‘മറ്റൊരാൾ’ (ἄλλος) ആരെന്ന ചോദ്യം
  choice: പരാമർശിക്കപ്പെടുന്ന വ്യക്തിയെ തിരിച്ചറിയാതെ ‘മറ്റൊരാൾ’ എന്നു പൊതുവായി നിലനിർത്തി.
  alternative: യോഹന്നാൻ സ്നാപകൻ, പിതാവ്, അല്ലെങ്കിൽ നിയമപരമായ അർഥത്തിലെ മറ്റൊരു സാക്ഷി എന്നു വ്യക്തമാക്കുക.
  rationale: ഈ വാക്യംതന്നെ ആ വ്യക്തിയെ വ്യക്തമായി തിരിച്ചറിയുന്നില്ല. വിശാലസന്ദർഭം വ്യാഖ്യാനത്തിന് സഹായിച്ചാലും, പരിഭാഷ മൂലവാക്യത്തിന്റെ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘സാക്ഷ്യം പറയുക’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്; അടിക്കുറിപ്പിൽ കൂടുതൽ ഔപചാരികമായ ‘സാക്ഷ്യം വഹിക്കുക’ നൽകിയിരിക്കുന്നു. ‘അവൻ/അദ്ദേഹം’ എന്നതിനു പകരം ‘ആ മറ്റൊരാൾ’ ആവർത്തിച്ചതിലൂടെ മൂലത്തിലെ പരാമർശാനിശ്ചിതത്വവും ആദരനിലയിലെ നിഷ്പക്ഷതയും സംരക്ഷിച്ചു.
