lexical_decisions:
- source_word: μὴ θαυμάζετε
  choice: ആശ്ചര്യപ്പെടരുത്
  rationale: μή ചേർന്ന വർത്തമാനകാല ആജ്ഞാരൂപത്തിന്റെ നിരോധനഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; θαυμάζωയുടെ വിസ്മയഭാവവും നിലനിർത്തുന്നു.
- source_word: τοῦτο
  choice: ഇതിൽ
  rationale: മുൻവാക്യത്തിലെ പ്രസ്താവനയെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘ആശ്ചര്യപ്പെടുക’ എന്ന ക്രിയയോടൊപ്പം ‘ഇതിൽ’ സ്വാഭാവികമാണ്.
- source_word: ὅτι
  choice: എന്തെന്നാൽ
  rationale: തുടർന്നുവരുന്നത് നിരോധനത്തിന്റെ കാരണമാണെന്ന് വ്യക്തമാക്കുന്ന causal ബന്ധം നിലനിർത്തുന്നു.
- source_word: ἔρχεται ὥρα
  choice: ഒരു നാഴിക വരുന്നു
  rationale: അനിർദ്ദിഷ്ടമായ ὥραയെ ‘ഒരു’ എന്നു സൂചിപ്പിക്കുകയും യോഹന്നാനിലെ ‘നാഴിക’ എന്ന ആശയത്തിന്റെ സവിശേഷ ഭാരം ‘സമയം’ എന്നു പൊതുവാക്കാതെ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐν ᾗ
  choice: …കേൾക്കുന്ന
  rationale: ഗ്രീക്കിലെ ‘അതിൽ’ എന്ന ആപേക്ഷിക ഘടന മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണവാക്യമായി അവതരിപ്പിക്കുന്നു.
- source_word: πάντες οἱ ἐν τοῖς μνημείοις
  choice: കല്ലറകളിലുള്ള എല്ലാവരും
  rationale: πάντες οἱ എന്നത് ‘എല്ലാവരും’ എന്നും μνημεῖα ശവസംസ്കാരസ്ഥലങ്ങളെ സൂചിപ്പിക്കുന്ന ദൃശ്യബിംബത്തോടെ ‘കല്ലറകൾ’ എന്നും പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: ἀκούσουσιν
  choice: കേൾക്കുന്ന
  rationale: ഭാവികാലത്തിന്റെ അർഥം ‘വരുന്നു’ എന്ന പ്രധാനക്രിയയോടു ചേർന്ന ആപേക്ഷിക നിർമാണത്തിൽ മലയാളം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τῆς φωνῆς αὐτοῦ
  choice: അവന്റെ ശബ്ദം
  rationale: വ്യക്തിയുടെ φωνήയ്ക്ക് നേരിട്ടും സ്വാഭാവികവുമായ തുല്യപദം; അനാവശ്യമായ വിശദീകരണം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: കല്ലറകളിലുള്ളവർ അവന്റെ ശബ്ദം കേൾക്കുമെന്നതിൽ സൂചിതമായ പുനരുത്ഥാനഭാഷ
  choice: ‘കല്ലറകളിലുള്ള എല്ലാവരും’ എന്ന മൂർത്തമായ ശവസംസ്കാരബിംബം നിലനിർത്തി; പുനരുത്ഥാനത്തെക്കുറിച്ചുള്ള വിശദീകരണം വാക്യത്തിൽ ചേർത്തില്ല.
  alternative: ‘മരിച്ച എല്ലാവരും’ എന്ന് വ്യാഖ്യാനാത്മകമായി പറയുക.
  rationale: മൂലവാക്യം കല്ലറകളുടെ ബിംബത്തിലൂടെയാണ് ആശയം അവതരിപ്പിക്കുന്നത്. അതിനെ വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ വാചകത്തിലെ ദൈവശാസ്ത്രപരമായ സൂചനയും സംഘർഷവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘നാഴിക’ യോഹന്നാനിലെ ὥραയുടെ സവിശേഷ ഭാരം നിലനിർത്തുന്നതിനായി ഉപയോഗിച്ചു; വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി ക്രമപ്പെടുത്തി.
