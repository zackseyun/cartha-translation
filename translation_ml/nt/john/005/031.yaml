id: JHN.5.31
reference: John 5:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐὰν ἐγὼ μαρτυρῶ περὶ ἐμαυτοῦ, ἡ μαρτυρία μου οὐκ ἔστιν ἀληθής·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/031.yaml
  text: If I testify about myself[a], my testimony is not true.
translation:
  language: ml
  text: ഞാൻ എന്നെക്കുറിച്ചുതന്നെ സാക്ഷ്യം പറഞ്ഞാൽ, എന്റെ സാക്ഷ്യം സത്യമല്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘എന്റെ സാക്ഷ്യം സാധുവല്ല’; സാക്ഷിമൊഴിയുടെ നിയമപരമായ പശ്ചാത്തലമാണ് ഈ അർഥം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν
  choice: എങ്കിൽ / പറഞ്ഞാൽ
  rationale: നിബന്ധനാസൂചകമായ ἐὰν സ്വാഭാവിക മലയാളത്തിൽ ‘പറഞ്ഞാൽ’ എന്ന വ്യവസ്ഥാരൂപത്തിലൂടെ വ്യക്തമായി പ്രകടമാകുന്നു.
- source_word: ἐγὼ
  choice: ഞാൻ
  rationale: ഗ്രീക്കിൽ സർവനാമം പ്രത്യേകം നൽകിയിരിക്കുന്നതിനാൽ കർത്താവായ യേശുവിന്മേലുള്ള നേരിയ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: μαρτυρῶ
  choice: സാക്ഷ്യം പറഞ്ഞാൽ
  rationale: μαρτυρέω എന്നതിന്റെ സാക്ഷി/ന്യായപരമായ ഭാവം നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗമാണിത്.
- source_word: περὶ ἐμαυτοῦ
  choice: എന്നെക്കുറിച്ചുതന്നെ
  rationale: περί + genitive എന്നതിന്റെ ‘കുറിച്ച്’ എന്ന നേരിട്ടുള്ള അർഥം നൽകുന്നു; ἐμαυτοῦ എന്ന ആത്മവാചകതയും ἐγώ നൽകുന്ന ഊന്നലും ‘തന്നെ’ സൂചിപ്പിക്കുന്നു.
- source_word: ἡ μαρτυρία μου
  choice: എന്റെ സാക്ഷ്യം
  rationale: μαρτυρῶ എന്ന ക്രിയയുമായുള്ള പദബന്ധം നിലനിർത്തുകയും തെളിവ്/സാക്ഷ്യത്തിന്റെ സന്ദർഭം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: οὐκ ἔστιν ἀληθής
  choice: സത്യമല്ല
  rationale: ἀληθής എന്നതിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ‘സാധുവല്ല’ എന്നു മുഖ്യപാഠത്തിൽ നൽകി നിയമപരമായ വ്യാഖ്യാനത്തിലേക്ക് അർഥം ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: യേശു തന്റെ സാക്ഷ്യം ‘സത്യമല്ല’ എന്നു പറയുന്നതിന്റെ അർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘എന്റെ സാക്ഷ്യം സത്യമല്ല’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘എന്റെ സാക്ഷ്യം സാധുവല്ല’ അല്ലെങ്കിൽ ‘സ്വീകാര്യമല്ല’.
  rationale: ἀληθής എന്ന ഗ്രീക്ക് പദത്തിന്റെ നേരിട്ടുള്ള അർഥവും യോഹന്നാൻ 8:14-നോടുള്ള വ്യാഖ്യാനപരമായ പിരിമുറുക്കവും നിലനിർത്തുന്നു. സാക്ഷ്യത്തിന്റെ നിയമപരമായ സാധുത എന്ന സന്ദർഭാർഥം സാധ്യതയുള്ളതാണെങ്കിലും അത് അടിക്കുറിപ്പിൽ പകരവായനയായി നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ‘സാക്ഷ്യം’ എന്ന പദത്തിന്റെ ആവർത്തനം ഗ്രീക്കിലെ cognate ബന്ധവും വാക്യത്തിന്റെ ന്യായപരമായ ഭാവവും സംരക്ഷിക്കുന്നു.
