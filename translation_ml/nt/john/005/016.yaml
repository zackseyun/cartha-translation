id: JHN.5.16
reference: John 5:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ διὰ τοῦτο ἐδίωκον ⸂οἱ Ἰουδαῖοι τὸν Ἰησοῦν⸃ ὅτι ταῦτα ἐποίει ἐν σαββάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/016.yaml
  text: And because of this the Jews were persecuting Jesus[a], because he was doing these things on the Sabbath.
translation:
  language: ml
  text: ഇക്കാരണത്താൽ യെഹൂദന്മാർ യേശുവിനെ ഉപദ്രവിച്ചുകൊണ്ടിരുന്നു[a]; അവൻ ശബ്ബത്തിൽ ഈ കാര്യങ്ങൾ ചെയ്തുകൊണ്ടിരുന്നതാണ് അതിന് കാരണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യെഹൂദ്യക്കാർ’; സന്ദർഭത്തിൽ, ‘യെഹൂദ നേതാക്കൾ’ എന്നും മനസ്സിലാക്കാം. യോഹന്നാന്റെ സുവിശേഷത്തിൽ ഈ പദം പലപ്പോഴും എല്ലാ യെഹൂദന്മാരെയും വ്യത്യാസമില്ലാതെ സൂചിപ്പിക്കുന്നില്ല; യേശുവിനെ എതിർത്ത ഒരു പ്രത്യേക സംഘത്തെയാകാം അത് സൂചിപ്പിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: ഇക്കാരണത്താൽ
  rationale: മുമ്പ് വിവരിച്ച സംഭവത്തെ തുടർന്നുള്ള വിരോധത്തിന്റെ കാരണമായി ചൂണ്ടിക്കാണിക്കുന്ന പ്രയോഗം; അനുമാനാത്മകമായ ‘അതുകൊണ്ട്’ എന്നതിനെക്കാൾ കാരണബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἐδίωκον
  choice: ഉപദ്രവിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം തുടരുന്ന അല്ലെങ്കിൽ ആവർത്തിച്ച ശത്രുതാപരമായ നടപടിയെ സൂചിപ്പിക്കുന്നു. ‘ഉപദ്രവിക്കുക’ വെറും പിന്തുടരൽ മാത്രമല്ലാത്ത വിരോധം പ്രകടമാക്കുന്നു; എന്നാൽ 18-ാം വാക്യത്തിലെ കൊല്ലാനുള്ള ഉദ്ദേശം ഇവിടെ മുൻകൂട്ടി ചേർക്കുന്നില്ല.
- source_word: οἱ Ἰουδαῖοι
  choice: യെഹൂദർ
  rationale: ഗ്രീക്കിലെ ജനവിഭാഗ-മതസമൂഹ നാമത്തിന്റെ നേരിട്ടുള്ള പരിഭാഷ. ‘യെഹൂദനാട്ടുകാർ’ എന്നും സന്ദർഭപരമായി ‘യെഹൂദനേതാക്കൾ’ എന്നും മനസ്സിലാക്കാൻ സാധ്യതയുണ്ടെങ്കിലും, മുഖ്യപാഠത്തിൽ പരാമർശത്തെ അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: ταῦτα
  choice: ഈ കാര്യങ്ങൾ
  rationale: മുമ്പ് വിവരിച്ച പ്രവൃത്തികളിലേക്കു വിരൽചൂണ്ടുന്ന ബഹുവചന സർവനാമത്തിന്റെ ബഹുവചനസ്വഭാവം നിലനിർത്തുന്നു.
- source_word: ἐποίει
  choice: ചെയ്തുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലത്തിന്റെ തുടരുന്ന/ആവർത്തിക്കുന്ന ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἐν σαββάτῳ
  choice: ശബ്ബത്തിൽ
  rationale: ശബ്ബത്തുദിവസത്തിലെ സമയസൂചന മലയാളത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
theological_decisions:
- issue: യോഹന്നാനിലെ οἱ Ἰουδαῖοι എന്ന പ്രയോഗത്തിന്റെ പരാമർശപരിധി
  choice: യെഹൂദർ
  alternative: യെഹൂദനാട്ടുകാർ; സന്ദർഭപരമായി യെഹൂദനേതാക്കൾ
  rationale: മുഖ്യപാഠം ഗ്രീക്കിലെ നേരിട്ടുള്ള ജനവിഭാഗ-മതസമൂഹ നാമം നിലനിർത്തുന്നു. അതേസമയം, യോഹന്നാനിൽ ഈ പദം പലപ്പോഴും യേശുവിനെ എതിർത്ത ഒരു പ്രത്യേക സംഘത്തെ സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നതിനാൽ, എല്ലാ യെഹൂദരെയും വ്യത്യാസമില്ലാതെ കുറ്റപ്പെടുത്തുന്ന വായന ഒഴിവാക്കാൻ അടിക്കുറിപ്പ് നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്ക് അപൂർണ ഭൂതകാലത്തിന്റെ തുടരുന്ന ഭാവം ‘-കൊണ്ടിരുന്നു’ രൂപങ്ങളിലൂടെ സംരക്ഷിച്ചു. ‘യെഹൂദർ’ എന്ന നേരിട്ടുള്ള പരിഭാഷ മുഖ്യപാഠത്തിൽ നിലനിർത്തി, സന്ദർഭപരമായ പരാമർശപരിധി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
