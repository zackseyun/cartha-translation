source:
  edition: SBLGNT
  text: ὁ ⸀δὲ ἀπεκρίνατο αὐτοῖς· Ὁ πατήρ μου ἕως ἄρτι ἐργάζεται κἀγὼ ἐργάζομαι.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/017.yaml
  text: But he answered them[a], “My Father is working until now, and I also am working.”
translation:
  language: ml
  text: 'എന്നാൽ അവൻ അവരോടു മറുപടി പറഞ്ഞു: “എന്റെ പിതാവ് ഇതുവരെയും പ്രവർത്തിച്ചുകൊണ്ടിരിക്കുന്നു; ഞാനും പ്രവർത്തിച്ചുകൊണ്ടിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭത്തിലെ കുറ്റാരോപണത്തോടുള്ള മിതമായ വൈരുധ്യവും മറുപടിയിലേക്കുള്ള നീക്കവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἀπεκρίνατο αὐτοῖς
  choice: അവൻ അവരോടു മറുപടി പറഞ്ഞു
  rationale: മധ്യപ്രയോഗത്തിലുള്ള ക്രിയയും ദത്തിവിഭക്തിയിലുള്ള പരോക്ഷ കർമ്മവും ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: Ὁ πατήρ μου
  choice: എന്റെ പിതാവ്
  rationale: യേശു ദൈവത്തെ വ്യക്തിപരമായി പരാമർശിക്കുന്നതിന്റെ ഗൗരവവും ദൈവശാസ്ത്രപരമായ ശക്തിയും നിലനിർത്തുന്നു.
- source_word: ἕως ἄρτι
  choice: ഇന്നുവരെയും
  rationale: ഭൂതകാലംമുതൽ ഇപ്പോഴത്തെ നിമിഷംവരെ തുടരുന്ന പ്രവർത്തനത്തെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἐργάζεται
  choice: പ്രവർത്തിച്ചുകൊണ്ടിരിക്കുന്നു
  rationale: ഗ്രീക്ക് വർത്തമാനകാലത്തിന്റെ സന്ദർഭോചിതമായ തുടർച്ചാഭാവം മലയാളത്തിലെ പുരോഗമനരൂപത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: κἀγὼ
  choice: ഞാനും
  rationale: പിതാവിന്റെ പ്രവർത്തനത്തോടൊപ്പം യേശുവിന്റെ പ്രവർത്തനത്തെയും ചേർത്തുനിർത്തുന്ന ഊന്നൽ കൃത്യമായി സംരക്ഷിക്കുന്നു.
- source_word: ἐργάζομαι
  choice: പ്രവർത്തിച്ചുകൊണ്ടിരിക്കുന്നു
  rationale: പിതാവിന്റെയും യേശുവിന്റെയും പ്രവർത്തനങ്ങൾക്കിടയിലെ ഉദ്ദേശ്യപൂർവമായ സമാന്തരതയും തുടരുന്ന പ്രവർത്തനവും ഒരേ രൂപത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ശബ്ബത്തിൽ യേശുവിന്റെ പ്രവർത്തനവും പിതാവിന്റെ പ്രവർത്തനവും തമ്മിലുള്ള ബന്ധം
  choice: “എന്റെ പിതാവ് ഇന്നുവരെയും പ്രവർത്തിച്ചുകൊണ്ടിരിക്കുന്നു; ഞാനും പ്രവർത്തിച്ചുകൊണ്ടിരിക്കുന്നു” എന്ന് സമാന്തരത മയപ്പെടുത്താതെ നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: “എന്റെ പിതാവ് ഇന്നുവരെയും പ്രവർത്തിക്കുന്നു; ഞാനും പ്രവർത്തിക്കുന്നു.”
  rationale: ഗ്രീക്ക് പാഠം പിതാവിന്റെ തുടരുന്ന പ്രവർത്തനത്തെയും യേശുവിന്റെ പ്രവർത്തനത്തെയും ഉദ്ദേശ്യപൂർവം സമാന്തരമായി അവതരിപ്പിക്കുന്നു. ശബ്ബത്ത്, ദൈവിക അധികാരം, സമത്വം എന്നിവയെക്കുറിച്ചുള്ള വ്യാഖ്യാനം വാക്യത്തിലേക്ക് കൂട്ടിച്ചേർക്കാതെ അതിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്ക് വർത്തമാനകാലത്തിന്റെ തുടരുന്ന ഭാവം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കാനാകുന്നതിനാൽ ഇംഗ്ലീഷിലെ simple/progressive വ്യത്യാസത്തെക്കുറിച്ചുള്ള അടിക്കുറിപ്പ് ആവശ്യമില്ല. ‘പിതാവ്’ എന്ന ദൈവപരാമർശത്തിന്റെ ഗൗരവം നിലനിർത്തിയിരിക്കുന്നു.
