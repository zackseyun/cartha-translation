  naturalness: The sentence is clear, dignified, and natural in modern standard Malayalam. “പ്രവർത്തിച്ചുകൊണ്ടിരിക്കുന്നു” idiomatically conveys ongoing activity and maintains the Greek parallel.
  terminology: “പിതാവ്” suitably preserves the personal divine reference without adding interpretation. “പ്രവർത്തിച്ചുകൊണ്ടിരിക്കുന്നു” is appropriately neutral and retains the theological tension of the source.
