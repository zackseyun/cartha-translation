id: JHN.5.29
reference: John 5:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐκπορεύσονται οἱ τὰ ἀγαθὰ ποιήσαντες εἰς ἀνάστασιν ζωῆς, οἱ ⸀δὲ τὰ φαῦλα πράξαντες εἰς ἀνάστασιν κρίσεως.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/029.yaml
  text: and will come out—those who have done good to the resurrection of life[a], but those who have done evil to the resurrection of judgment.
translation:
  language: ml
  text: അവർ പുറത്തുവരും—നന്മ ചെയ്തവർ ജീവന്റെ പുനരുത്ഥാനത്തിലേക്കും, എന്നാൽ തിന്മ പ്രവർത്തിച്ചവർ ന്യായവിധിയുടെ പുനരുത്ഥാനത്തിലേക്കും[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ന്യായവിധിയുടെ പുനരുത്ഥാനം’ എന്നതിന് ‘ശിക്ഷാവിധിയുടെ പുനരുത്ഥാനം’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്കിൽ ‘ന്യായവിധി’ എന്നാണ്; അതിന് കൂടുതൽ വിശാലമായ അർഥമുണ്ട്. ‘ശിക്ഷാവിധി’ എന്നത് ചില വിവർത്തനങ്ങളിൽ കാണുന്ന വ്യാഖ്യാനപരമായ അർഥപരിമിതപ്പെടുത്തലാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκπορεύσονται
  choice: പുറത്തുവരും
  rationale: മരിച്ചവർ കല്ലറകളിൽനിന്ന് പുറത്തുവരുന്നതാണ് സന്ദർഭം; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ പ്രയോഗം.
- source_word: τὰ ἀγαθὰ ποιήσαντες
  choice: നന്മ ചെയ്തവർ
  rationale: വസ്തുനാമമായി പ്രവർത്തിക്കുന്ന ബഹുവചന വിശേഷണത്തെയും ക്രിയയെയും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രതിഫലിപ്പിക്കുന്നു; പ്രത്യേക പ്രവൃത്തികൾ കൂട്ടിച്ചേർത്ത് അർഥം പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: ἀνάστασιν ζωῆς
  choice: ജീവന്റെ പുനരുത്ഥാനം
  rationale: ഗ്രീക്കിലെ സമാസബന്ധവും അടുത്ത വാക്യഭാഗത്തോടുള്ള സമാന്തരഘടനയും നിലനിർത്തുന്നു.
- source_word: τὰ φαῦλα πράξαντες
  choice: തിന്മ പ്രവർത്തിച്ചവർ
  rationale: φαῦλα എന്നതിന്റെ നൈതികമായ ദോഷാർഥം ‘തിന്മ’ വ്യക്തമാക്കുന്നു. πράσσω എന്ന ക്രിയയെ ആദ്യഭാഗത്തിലെ ποιέωയിൽനിന്ന് നേരിയ തോതിൽ വേർതിരിക്കാൻ ‘പ്രവർത്തിച്ചവർ’ ഉപയോഗിച്ചിരിക്കുന്നു.
- source_word: ἀνάστασιν κρίσεως
  choice: ന്യായവിധിയുടെ പുനരുത്ഥാനം
  rationale: κρίσις എന്നതിന്റെ വിശാലമായ അടിസ്ഥാനാർഥമായ ‘ന്യായവിധി’ നിലനിർത്തുന്നു; അതിനെ ‘ശിക്ഷാവിധി’ എന്ന് വ്യാഖ്യാനപരമായി ചുരുക്കുന്നില്ല.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: രണ്ടു വിഭാഗങ്ങളും അവയുടെ ഫലങ്ങളും തമ്മിലുള്ള വൈരുധ്യം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: κρίσεως എന്നത് ‘ന്യായവിധി’ എന്നോ കൂടുതൽ പരിമിതമായി ‘ശിക്ഷാവിധി’ എന്നോ വിവർത്തനം ചെയ്യണമോ
  choice: ന്യായവിധി
  alternative: ശിക്ഷാവിധി
  rationale: κρίσις സ്വതവേ ‘ശിക്ഷാവിധി’ എന്ന പരിമിതാർഥം നിർബന്ധിക്കുന്നില്ല. ‘ന്യായവിധി’ എന്നു നൽകുന്നത് ഗ്രീക്കിലെ വിശാലതയും വാക്യത്തിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ സമാന്തരഘടന ഡാഷും രണ്ട് ‘പുനരുത്ഥാനം’ പ്രയോഗങ്ങളുംകൊണ്ട് നിലനിർത്തിയിരിക്കുന്നു.
