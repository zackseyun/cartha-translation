  text: ἔστιν δὲ ἐν τοῖς Ἱεροσολύμοις ἐπὶ τῇ προβατικῇ κολυμβήθρα ἡ ἐπιλεγομένη Ἑβραϊστὶ ⸀Βηθεσδά, πέντε στοὰς ἔχουσα·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/002.yaml
  text: There is in Jerusalem[a], by the Sheep Gate, a pool called Bethesda in Hebrew[c][b], having five porticoes.
translation:
  language: ml
  text: യെരൂശലേമിൽ ആട്ടുവാതിലിനരികെ[a] ഒരു കുളം ഉണ്ട്. എബ്രായഭാഷയിൽ[b] അതിനെ ബേഥെസ്ദാ[c] എന്നു വിളിക്കുന്നു. അതിന് അഞ്ച് തൂണുനടപ്പുരകളുണ്ട്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കുപദപ്രയോഗത്തിൽ ‘വാതിൽ’ എന്ന നാമം വ്യക്തമാക്കാതെ ‘ആടുകളുമായി ബന്ധപ്പെട്ട സ്ഥലത്തിനരികെ’ എന്നാണ്. ഇവിടെ ആട്ടുവാതിലിന്റെ പ്രദേശമാണ് ഉദ്ദേശിക്കുന്നതെന്നു സാദ്ധ്യതയുണ്ട്; നെഹെമ്യാവ് 3:1; 12:39 താരതമ്യം ചെയ്യുക.
    reason: cross_reference
  - marker: b
    text: ‘അരമായഭാഷയിൽ’ എന്നും മനസ്സിലാക്കാം. യോഹന്നാൻ ഉപയോഗിക്കുന്ന ‘എബ്രായഭാഷയിൽ’ എന്ന പ്രയോഗം കൃത്യമായി പ്രാചീന എബ്രായഭാഷയെ മാത്രമല്ല, യെഹൂദ്യയിലെ പ്രാദേശിക സെമിറ്റിക് ഭാഷയെയും സൂചിപ്പിക്കാറുണ്ട്.
    reason: lexical_alternative
  - marker: c
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘ബേഥ്സഥാ’ എന്നും ‘ബേഥ്സയിദാ’ എന്നും വായനകളുണ്ട്.
    reason: textual_variant
lexical_decisions:
- source_word: ἔστιν δὲ
  choice: ഉണ്ട്
  rationale: വർത്തമാനകാലമായ ἔστιν നിലനിർത്തുന്നു; δέയുടെ ലഘുവായ ബന്ധകസ്വഭാവം മലയാളവാക്യക്രമത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: ἐν τοῖς Ἱεροσολύμοις
  choice: യെരൂശലേമിൽ
  rationale: സ്ഥലനാമത്തെ സാധാരണ മലയാളപ്രയോഗത്തിൽ ഏകവചനമായി നൽകുന്നു.
- source_word: ἐπὶ τῇ προβατικῇ
  choice: ആട്ടുവാതിലിനരികെ
  rationale: പ്രയോഗം സംക്ഷിപ്തവും അർത്ഥത്തിൽ അപൂർണ്ണവുമാണ്; നെഹെമ്യാവിലെ യെരൂശലേം ഭൂപ്രകൃതിയുമായി താരതമ്യം ചെയ്യുമ്പോൾ സൂചിപ്പിക്കപ്പെടുന്ന 'വാതിൽ' ചേർക്കുന്നതാണ് ഏറ്റവും സാദ്ധ്യമായ വായന. വ്യാഖ്യാനപൂരണം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: κολυμβήθρα
  choice: ഒരു കുളം
  rationale: ജലം സംഭരിച്ചിരുന്ന കുളം എന്ന പൊതുവായ അർത്ഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἡ ἐπιλεγομένη
  choice: അതിനെ … എന്നു വിളിക്കുന്നു
  rationale: പേരിടൽ സൂചിപ്പിക്കുന്ന കൃദന്തരൂപത്തെ സ്വാഭാവിക മലയാളവാക്യമായി മാറ്റുന്നു.
- source_word: Ἑβραϊστὶ
  choice: എബ്രായഭാഷയിൽ
  rationale: മൂലപദത്തിന്റെ നേരിട്ടുള്ള അർത്ഥം പ്രധാനപാഠത്തിൽ നിലനിർത്തുന്നു; യോഹന്നാന്റെ പ്രയോഗം അരമായഭാഷയെയും സൂചിപ്പിക്കാം എന്ന ഭാഷാപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: Βηθεσδά
  choice: ബേഥെസ്ദാ
  rationale: നൽകിയ SBLGNT പാഠത്തിലെ നാമരൂപം ലിപ്യന്തരണം ചെയ്യുന്നു; മറ്റു കൈയെഴുത്തുപ്രതി വായനകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: πέντε στοὰς ἔχουσα
  choice: അതിന് അഞ്ച് മണ്ഡപങ്ങളുണ്ട്
  rationale: στοά മേൽക്കൂരയുള്ള തൂണുനിരയോടുകൂടിയ മണ്ഡപത്തെ സൂചിപ്പിക്കുന്നു. കൃദന്തരൂപത്തിന്റെ ബന്ധം നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മലയാളം ഉപയോഗിക്കുന്നു.
