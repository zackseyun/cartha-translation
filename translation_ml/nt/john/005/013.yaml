source:
  edition: SBLGNT
  text: ὁ δὲ ἰαθεὶς οὐκ ᾔδει τίς ἐστιν, ὁ γὰρ Ἰησοῦς ἐξένευσεν ὄχλου ὄντος ἐν τῷ τόπῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/013.yaml
  text: But the man who had been healed did not know who he was[a], for Jesus had withdrawn, since there was a crowd in the place.
translation:
  language: ml
  text: എന്നാൽ സൗഖ്യം പ്രാപിച്ചയാൾക്ക് യേശു ആരാണെന്ന് അറിയില്ലായിരുന്നു; ആ സ്ഥലത്ത് ജനക്കൂട്ടം ഉണ്ടായിരുന്നതിനാൽ യേശു ഒഴിഞ്ഞുമാറിയിരുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മാറിപ്പോയിരുന്നു’ എന്നും ‘ശ്രദ്ധയിൽപ്പെടാതെ പോയിരുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം. യേശു ശ്രദ്ധയിൽപ്പെടാതെ അവിടെനിന്ന് മാറിപ്പോയി എന്ന ആശയം ഗ്രീക്കിലെ ക്രിയയ്ക്കുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰαθεὶς
  choice: സൗഖ്യം പ്രാപിച്ചയാൾ
  rationale: നിശ്ചയാർഥക ലേഖനത്തോടുകൂടിയ കർമണി ഭൂതകാല കൃദന്തരൂപം വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. ‘സൗഖ്യം പ്രാപിച്ചയാൾ’ എന്നത് കർമണിഭാവവും മുഖ്യക്രിയയ്ക്കു മുമ്പുണ്ടായ സൗഖ്യപ്രാപ്തിയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: οὐκ ᾔδει
  choice: അറിയില്ലായിരുന്നു
  rationale: സന്ദർഭത്തിൽ οἶδα എന്ന ക്രിയയുടെ ലളിതവും സ്വാഭാവികവുമായ മലയാളരൂപം; അന്നത്തെ അറിവില്ലായ്മയെ ഭൂതകാലത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τίς ἐστιν
  choice: അദ്ദേഹം ആരാണെന്ന്
  rationale: യേശുവിനെ വ്യക്തിപരമായി സൂചിപ്പിക്കുന്ന പരോക്ഷചോദ്യത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം. ഗ്രീക്കിലെ വർത്തമാനകാലഭാവം മലയാളത്തിലെ ഈ ഘടനയിൽ സ്വാഭാവികമായി നിലനിൽക്കുന്നു.
- source_word: ἐξένευσεν
  choice: ആരുമറിയാതെ മാറിപ്പോയിരുന്നു
  rationale: ἐκνεύω ഇവിടെ ശ്രദ്ധയിൽപ്പെടാതെ ഒഴിഞ്ഞുമാറുന്നതിനെയോ പിന്മാറുന്നതിനെയോ സൂചിപ്പിക്കുന്നു. ‘ആരുമറിയാതെ’ എന്നത് ക്രിയയുടെ നിഗൂഢമായി നീങ്ങിപ്പോയെന്ന ഭാവം വ്യക്തമാക്കുന്നു; ‘മാറിപ്പോയിരുന്നു’ വിശദീകരണവാക്യത്തിലെ മുൻകാലപ്രവൃത്തിയെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ὄχλου ὄντος
  choice: ജനക്കൂട്ടമുണ്ടായിരുന്നതിനാൽ
  rationale: ഈ genitive absolute കാരണമോ അനുബന്ധസാഹചര്യമോ സൂചിപ്പിക്കാം. സന്ദർഭത്തിലെ വിശദീകരണശക്തി നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ കാരണഘടന ഉപയോഗിച്ചു.
- source_word: ἐν τῷ τόπῳ
  choice: ആ സ്ഥലത്ത്
  rationale: സ്ഥലസൂചന വ്യക്തമായി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം; വെറും ‘അവിടെ’ എന്നതിനെക്കാൾ മൂലപാഠത്തോട് അടുത്തതാണ്.
