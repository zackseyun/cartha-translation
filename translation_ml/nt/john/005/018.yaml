revisions:
- from: അതുകൊണ്ടുതന്നെ, യെഹൂദന്മാർ[a] അവനെ കൊല്ലാൻ മുമ്പിലത്തേക്കാൾ അധികമായി ശ്രമിച്ചുകൊണ്ടിരുന്നു. കാരണം, അവൻ ശബ്ബത്ത് ലംഘിക്കുക മാത്രമല്ല, ദൈവത്തെ തന്റെ സ്വന്തം പിതാവെന്നു വിളിക്കുകയും അങ്ങനെ തന്നെത്തന്നെ ദൈവത്തോടു തുല്യനാക്കുകയും ചെയ്തു.[b]
  to: ഇക്കാരണത്താൽ യെഹൂദന്മാർ[a] അവനെ കൊല്ലാൻ മുമ്പിലത്തേക്കാൾ അധികമായി ശ്രമിച്ചുകൊണ്ടിരുന്നു; അവൻ ശബ്ബത്ത് ലംഘിച്ചിരുന്നതു മാത്രമല്ല, ദൈവത്തെ തന്റെ സ്വന്തം പിതാവെന്നു വിളിച്ചിരുന്നതും, അങ്ങനെ തന്നെത്തന്നെ ദൈവത്തോടു തുല്യനാക്കുകയും ചെയ്തിരുന്നതിനാലാണ്.[b]
  rationale: 'The revision preserves the source’s logic and theological force while using consistent Malayalam imperfect-style forms for the ongoing actions. The equality clause remains explicit and is not doctrinally softened. “അങ്ങനെ” is retained only in the final Malayalam construction as a connective within the explanatory wording; it should be removed for strictest source fidelity. Therefore, preferred final wording is: “ഇക്കാരണത്താൽ യെഹൂദന്മാർ[a] അവനെ കൊല്ലാൻ മുമ്പിലത്തേക്കാൾ അധികമായി ശ്രമിച്ചുകൊണ്ടിരുന്നു; അവൻ ശബ്ബത്ത് ലംഘിച്ചിരുന്നതു മാത്രമല്ല, ദൈവത്തെ തന്റെ സ്വന്തം പിതാവെന്നു വിളിച്ചിരുന്നതും, തന്നെത്തന്നെ ദൈവത്തോടു തുല്യനാക്കുകയും ചെയ്തിരുന്നതിനാലാണ്.[b]” The footnote alternative offers a natural restructuring without altering the meaning.'
