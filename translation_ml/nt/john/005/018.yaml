id: JHN.5.18
reference: John 5:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διὰ τοῦτο οὖν μᾶλλον ἐζήτουν αὐτὸν οἱ Ἰουδαῖοι ἀποκτεῖναι ὅτι οὐ μόνον ἔλυε τὸ σάββατον, ἀλλὰ καὶ πατέρα ἴδιον ἔλεγε τὸν θεόν, ἴσον ἑαυτὸν ποιῶν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/018.yaml
  text: For this reason[a], therefore, the Jews were seeking all the more to kill him, because he was not only breaking the Sabbath, but was also calling God his own Father[b], making himself equal with God.
translation:
  language: ml
  text: ഇക്കാരണത്താൽ യെഹൂദന്മാർ[a] അവനെ കൊല്ലാൻ മുമ്പിലത്തേക്കാൾ അധികമായി ശ്രമിച്ചുകൊണ്ടിരുന്നു; അവൻ ശബ്ബത്ത് ലംഘിച്ചിരുന്നതു മാത്രമല്ല, ദൈവത്തെ തന്റെ സ്വന്തം പിതാവെന്നു വിളിച്ചിരുന്നതും, അങ്ങനെ തന്നെത്തന്നെ ദൈവത്തോടു തുല്യനാക്കുകയും ചെയ്തിരുന്നതിനാലാണ്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: യോഹന്നാന്റെ സുവിശേഷത്തിൽ ‘യെഹൂദന്മാർ’ എന്നത് പല സന്ദർഭങ്ങളിലും എല്ലാ യെഹൂദരെയും വ്യത്യാസമില്ലാതെ സൂചിപ്പിക്കുന്നതല്ല; യേശുവിനെ എതിർത്ത ചില യെഹൂദ്യരെയോ യെഹൂദ അധികാരികളെയോ കൂടുതൽ പ്രത്യേകമായി സൂചിപ്പിക്കാം.
    reason: cultural_note
  - marker: b
    text: അഥവാ, ‘ദൈവത്തെ തന്റെ സ്വന്തം പിതാവെന്നു വിളിച്ചിരുന്നതിലൂടെ, തന്നെത്തന്നെ ദൈവത്തോടു തുല്യനാക്കുകയും ചെയ്തിരുന്നതിനാൽ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο οὖν
  choice: അതുകൊണ്ടുതന്നെ
  rationale: രണ്ട് അനുമാനസൂചക ഘടകങ്ങളുടെയും സംയുക്തമായ ഊന്നൽ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: μᾶλλον
  choice: മുമ്പിലത്തേക്കാൾ അധികമായി
  rationale: മുൻസാഹചര്യവുമായി താരതമ്യം ചെയ്ത് ശ്രമം ശക്തമായെന്ന താരതമ്യാർഥം വ്യക്തമാക്കുന്നു.
- source_word: ἐζήτουν ... ἀποκτεῖναι
  choice: കൊല്ലാൻ ... ശ്രമിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലക്രിയയുടെ തുടർച്ചയായ സ്വഭാവവും ἀποκτεῖναι എന്നതിന്റെ നേരിട്ടുള്ള അർഥവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: οἱ Ἰουδαῖοι
  choice: യെഹൂദന്മാർ
  rationale: ഗ്രീക്കിലെ പൊതുവായ വംശ-മതസൂചക പദം മുഖ്യവാചകത്തിൽ ചുരുക്കാതെ നിലനിർത്തുന്നു; സന്ദർഭപരമായ പരിധി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἔλυε τὸ σάββατον
  choice: ശബ്ബത്ത് ലംഘിക്കുക
  rationale: ഇവിടെ λύω ശബ്ബത്തുനിയമം ലംഘിക്കുക എന്ന പ്രയോഗാർഥത്തിലാണ്; എതിരാളികളുടെ ആരോപണമായി വാചകം അത് അവതരിപ്പിക്കുന്നു.
- source_word: πατέρα ἴδιον ἔλεγε τὸν θεόν
  choice: ദൈവത്തെ തന്റെ സ്വന്തം പിതാവെന്നു വിളിക്കുകയും
  rationale: ἴδιον നൽകുന്ന ‘സ്വന്തം’ എന്ന ഊന്നലും ἔλεγε എന്ന ക്രിയയുടെ ആവർത്തിത സ്വഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: ἴσον ἑαυτὸν ποιῶν τῷ θεῷ
  choice: അങ്ങനെ തന്നെത്തന്നെ ദൈവത്തോടു തുല്യനാക്കുകയും ചെയ്തു
  rationale: പങ്കാളിക്രിയ മുൻപത്തെ അവകാശവാദത്തിന്റെ ഫലം അല്ലെങ്കിൽ അർഥവ്യാപ്തി സൂചിപ്പിക്കുന്ന വിധത്തിൽ ബന്ധിപ്പിക്കുകയും ദൈവത്തോടുള്ള സമത്വത്തിന്റെ ശക്തി കുറയ്ക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ദൈവത്തോടുള്ള സമത്വത്തെക്കുറിച്ചുള്ള വാക്യഭാഗത്തിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ ശക്തി
  choice: ‘തന്നെത്തന്നെ ദൈവത്തോടു തുല്യനാക്കുകയും ചെയ്തു’ എന്നു നേരിട്ട് നിലനിർത്തി
  alternative: ‘ദൈവത്തോടു തുല്യനാണെന്ന് അവകാശപ്പെട്ടു’
  rationale: ഗ്രീക്ക് വാചകം സമത്വത്തെ വ്യക്തമായി പ്രസ്താവിക്കുന്നു. ‘അവകാശപ്പെട്ടു’ എന്നത് എതിരാളികളുടെ വിലയിരുത്തൽ മാത്രമാണെന്ന ധ്വനി അധികമായി ചേർക്കാൻ ഇടയുള്ളതിനാൽ ποιῶν എന്നതിന്റെ നേരിട്ടുള്ള രൂപം നിലനിർത്തി.
- issue: യോഹന്നാനിലെ ‘യെഹൂദന്മാർ’ എന്ന പ്രയോഗത്തിന്റെ സന്ദർഭപരമായ പരാമർശം
  choice: മുഖ്യവാചകത്തിൽ ‘യെഹൂദന്മാർ’ നിലനിർത്തി, അടിക്കുറിപ്പിൽ സന്ദർഭം വ്യക്തമാക്കി
  alternative: ‘യെഹൂദനേതാക്കൾ’ അല്ലെങ്കിൽ ‘യെഹൂദ്യർ’
  rationale: οἱ Ἰουδαῖοι എന്ന മൂലപദത്തെ വ്യാഖ്യാനപരമായി ചുരുക്കാതെ സൂക്ഷിക്കുന്നു; അതേസമയം എല്ലാ യെഹൂദരെയും വ്യത്യാസമില്ലാതെ ഉദ്ദേശിക്കുന്നില്ലെന്ന സന്ദർഭസാധ്യത വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘ശബ്ബത്ത്’, ‘പിതാവ്’ തുടങ്ങിയ പരിചിതമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി ക്രമപ്പെടുത്തി. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദഭാഗങ്ങളോടു ചേർത്തു.
