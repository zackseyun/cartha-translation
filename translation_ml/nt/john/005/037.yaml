    rationale: ഇത് ഗ്രീക്ക് ἐκεῖνος-ന്റെ അക്ഷരാനുകരണശ്രമമായാലും മലയാളത്തിൽ അസ്വാഭാവികമാണ്. ‘അവിടുന്ന് തന്നേ’ എന്നത് അതേ ഊന്നൽ സ്വാഭാവികമായി നൽകുന്നു.
  - severity: low
