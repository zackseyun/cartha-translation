revisions:
- from: എന്നെ അയച്ച പിതാവ്—അവിടുന്നുതന്നെ എന്നെക്കുറിച്ച് സാക്ഷ്യം നൽകിയിരിക്കുന്നു.[a] നിങ്ങൾ ഒരിക്കലും അവിടുത്തെ ശബ്ദം കേട്ടിട്ടില്ല; അവിടുത്തെ രൂപം കണ്ടിട്ടുമില്ല.[b]
  to: എന്നെ അയച്ച പിതാവ്—അവിടുന്നുതന്നെ എന്നെക്കുറിച്ച് സാക്ഷ്യം നൽകിയിരിക്കുന്നു.[a] നിങ്ങൾ ഒരിക്കലും അവിടുത്തെ ശബ്ദം കേട്ടിട്ടില്ല, അവിടുത്തെ രൂപം കണ്ടിട്ടുമില്ല.[b]
