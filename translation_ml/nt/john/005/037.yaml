source:
  edition: SBLGNT
  text: καὶ ὁ πέμψας με πατὴρ ⸀ἐκεῖνος μεμαρτύρηκεν περὶ ἐμοῦ. οὔτε φωνὴν αὐτοῦ ⸂πώποτε ἀκηκόατε⸃ οὔτε εἶδος αὐτοῦ ἑωράκατε,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/037.yaml
  text: And the Father who sent me—that one has testified about me[a]. You have neither ever heard his voice nor seen his form[b],
translation:
  language: ml
  text: എന്നെ അയച്ച പിതാവ്—അവിടുന്നുതന്നെ എന്നെക്കുറിച്ച് സാക്ഷ്യം നൽകിയിരിക്കുന്നു.[a] നിങ്ങൾ ഒരിക്കലും അവിടുത്തെ ശബ്ദം കേട്ടിട്ടില്ല, അവിടുത്തെ രൂപം കണ്ടിട്ടുമില്ല.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘അവിടുന്ന് തന്നേ എന്നെക്കുറിച്ച് സാക്ഷ്യം നൽകിയിരിക്കുന്നു.’ ‘പിതാവ്’ എന്നതിനു പിന്നാലെയുള്ള ഗ്രീക്ക് നിർദേശക സർവനാമം ഊന്നൽ നൽകുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: ‘അവിടുത്തെ പ്രത്യക്ഷരൂപം.’ εἶδος എന്ന ഗ്രീക്ക് പദത്തിന് ദൃശ്യരൂപം അല്ലെങ്കിൽ പ്രത്യക്ഷഭാവം എന്നു സൂചിപ്പിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πέμψας με πατὴρ
  choice: എന്നെ അയച്ച പിതാവ്
  rationale: ആർട്ടിക്കിളോടുകൂടിയ ഭൂതകാല കൃദന്തത്തെ സ്വാഭാവികമായ വിശേഷണ ഉപവാക്യമായി വിവർത്തനം ചെയ്യുന്നു; പിതാവിനെ തിരിച്ചറിയിക്കുന്ന ഗ്രീക്ക് ഘടന നിലനിർത്തുന്നു.
- source_word: ἐκεῖνος
  choice: അവിടുന്നുതന്നെ
  rationale: പിതാവിനെ വീണ്ടും ചൂണ്ടിക്കാട്ടുന്ന ഊന്നൽ മാന്യവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു; വെറും ‘അവിടുന്ന്’ എന്നതിനെക്കാൾ ഗ്രീക്ക് നിർദേശക സർവനാമത്തിന്റെ ബലം നിലനിർത്തുന്നു.
- source_word: μεμαρτύρηκεν
  choice: സാക്ഷ്യം നൽകിയിരിക്കുന്നു
  rationale: പൂർത്തിയായെങ്കിലും ഇപ്പോഴും പ്രസക്തമായ സാക്ഷ്യത്തെ ഗ്രീക്ക് സമ്പൂർണ്ണകാലത്തിന് യോജിച്ച മലയാളരൂപത്തിൽ നൽകുന്നു.
- source_word: περὶ ἐμοῦ
  choice: എന്നെക്കുറിച്ച്
  rationale: περί + ഷഷ്ഠിയുടെ സ്വാഭാവികവും കൃത്യവുമായ മലയാള തത്തുല്യം.
- source_word: οὔτε ... οὔτε
  choice: കേട്ടിട്ടില്ല; ... കണ്ടിട്ടുമില്ല
  rationale: ബന്ധിത നിഷേധത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി സമാന്തര നിഷേധരൂപങ്ങളാൽ അവതരിപ്പിക്കുന്നു.
- source_word: φωνὴν αὐτοῦ
  choice: അവിടുത്തെ ശബ്ദം
  rationale: കേൾവിയുടെ സന്ദർഭത്തിൽ φωνή എന്നതിന്റെ നേരായ അർഥം ‘ശബ്ദം’ ആണ്; പിതാവിനെ സൂചിപ്പിക്കാൻ മാന്യരൂപം ഉപയോഗിക്കുന്നു.
- source_word: πώποτε
  choice: ഒരിക്കലും
  rationale: നിഷേധത്തോടൊപ്പം ‘ഏതെങ്കിലും സമയത്ത്’ എന്ന വ്യാപകബലം മലയാളത്തിലെ ‘ഒരിക്കലും ... ഇല്ല’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀκηκόατε
  choice: കേട്ടിട്ടില്ല
  rationale: ഇതുവരെ അത്തരമൊരു അനുഭവം ഉണ്ടായിട്ടില്ലെന്ന സമ്പൂർണ്ണകാലബലം നിഷേധരൂപത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: εἶδος αὐτοῦ
  choice: അവിടുത്തെ രൂപം
  rationale: εἶδος സൂചിപ്പിക്കുന്ന ദൃശ്യരൂപം/പ്രത്യക്ഷഭാവം എന്ന അർഥവ്യാപ്തി ‘രൂപം’ നിലനിർത്തുന്നു; ആശയത്തെ അനാവശ്യമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: ἑωράκατε
  choice: കണ്ടിട്ടുമില്ല
  rationale: മുമ്പ് കണ്ട അനുഭവം ഇന്നുവരെ ഇല്ലെന്ന സമ്പൂർണ്ണകാലബലം മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: പിതാവിനെ സൂചിപ്പിക്കുന്ന ἐκεῖνος എന്ന ഊന്നൽ
  choice: പ്രധാന പാഠത്തിൽ ‘അവിടുന്നുതന്നെ’ എന്നു നൽകി ഊന്നൽ നിലനിർത്തി.
  alternative: ‘അവിടുന്ന്’ അല്ലെങ്കിൽ കൂടുതൽ അക്ഷരാർഥത്തിൽ ‘ആ അവിടുന്ന്’.
  rationale: സാക്ഷ്യം നൽകിയിരിക്കുന്നത് പിതാവുതന്നെയാണെന്ന ഗ്രീക്ക് ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു; അധികമായ സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: εἶδος αὐτοῦ എന്നതിന്റെ വിവർത്തനം
  choice: ‘അവിടുത്തെ രൂപം’
  alternative: ‘അവിടുത്തെ പ്രത്യക്ഷരൂപം’ അല്ലെങ്കിൽ ‘അവിടുത്തെ ഭാവം’.
  rationale: ഇത് അക്ഷരാർഥത്തിലുള്ള ദൃശ്യരൂപമാണോ, പ്രത്യക്ഷതയാണോ, വെളിപ്പാടിലൂടെ ഗ്രഹിക്കപ്പെടുന്നതാണോ എന്ന പാഠത്തിലെ തുറന്ന നില ‘രൂപം’ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. പിതാവിനെ സൂചിപ്പിക്കാൻ ‘അവിടുന്ന്/അവിടുത്തെ’ ഉപയോഗിച്ചു. ആദ്യവാക്യത്തിലെ ദീർഘവിരാമം ἐκεῖνος എന്ന പദത്തിന്റെ പുനരാരംഭ-ഊന്നൽ പ്രകടമാക്കുന്നു; ഗ്രീക്ക് വാക്യാവസാനത്തിലെ തുടർച്ചാസ്വഭാവമുള്ള കോമ മലയാളത്തിൽ പൂർണ്ണവിരാമമായി സ്വാഭാവികമാക്കി.
