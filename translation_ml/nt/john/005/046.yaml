id: JHN.5.46
reference: John 5:46
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ γὰρ ἐπιστεύετε Μωϋσεῖ, ἐπιστεύετε ἂν ἐμοί, περὶ γὰρ ἐμοῦ ἐκεῖνος ἔγραψεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/046.yaml
  text: For if you believed Moses[a], you would believe me[b], for he wrote about me.
translation:
  language: ml
  text: എന്തെന്നാൽ, മോശയെ നിങ്ങൾ വിശ്വസിച്ചിരുന്നെങ്കിൽ[a], എന്നെയും വിശ്വസിക്കുമായിരുന്നു; കാരണം, അദ്ദേഹം എന്നെക്കുറിച്ചാണ് എഴുതിയത്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മോശയുടെ വാക്ക് നിങ്ങൾ വിശ്വസിച്ചിരുന്നെങ്കിൽ’ എന്നും അർഥമാക്കാം. രണ്ടു ഉപവാക്യങ്ങളിലും ഒരേ ഗ്രീക്ക് ക്രിയയാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘ആ വ്യക്തി എന്നെക്കുറിച്ച് എഴുതി.’ ‘ആ വ്യക്തി’ എന്നു പരിഭാഷപ്പെടുത്താവുന്ന ἐκεῖνος മോശയെ ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: എന്തെന്നാൽ ... വിശ്വസിച്ചിരുന്നെങ്കിൽ
  rationale: γάρ മുൻവാദവുമായി കാരണബന്ധം സ്ഥാപിക്കുന്നതിനാൽ ‘എന്തെന്നാൽ’ നിലനിർത്തുന്നു; εἰ യാഥാർഥ്യവിരുദ്ധമായ നിബന്ധന അവതരിപ്പിക്കുന്നു.
- source_word: ἐπιστεύετε Μωϋσεῖ
  choice: മോശയെ നിങ്ങൾ വിശ്വസിച്ചിരുന്നെങ്കിൽ
  rationale: πιστεύω എന്ന ക്രിയയോടുകൂടിയ ദത്തിവ് ഇവിടെ ഒരാളുടെ വാക്ക് വിശ്വസിക്കുക എന്ന അർഥം നൽകുന്നു. യാഥാർഥ്യവിരുദ്ധമായ നിബന്ധന മലയാളത്തിൽ ‘വിശ്വസിച്ചിരുന്നെങ്കിൽ’ എന്നു സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: ἐπιστεύετε ἂν ἐμοί
  choice: എന്നെയും വിശ്വസിക്കുമായിരുന്നു
  rationale: അപൂർണഭൂതകാല ക്രിയയും ἄν-ഉം ചേർന്ന് യാഥാർഥ്യവിരുദ്ധ നിബന്ധനയുടെ ഫലം സൂചിപ്പിക്കുന്നു. ἐμοί ദത്തിവായതിനാൽ ‘എന്നെ വിശ്വസിക്കുക’ എന്ന നേരിട്ടുള്ള അർഥമാണ് സ്വീകരിച്ചത്; ‘എന്നിൽ വിശ്വസിക്കുക’ എന്നു ചേർത്തിട്ടില്ല.
- source_word: περὶ γὰρ ἐμοῦ
  choice: കാരണം ... എന്നെക്കുറിച്ചാണ്
  rationale: περί + ജനിറ്റീവ് ‘എന്നെക്കുറിച്ച്’ എന്ന അർഥം നൽകുന്നു; വാക്യത്തിലെ മുൻനിലയും ഊന്നലും ‘എന്നെക്കുറിച്ചാണ്’ എന്നു പ്രതിഫലിപ്പിക്കുന്നു. രണ്ടാമത്തെ γάρ ‘കാരണം’ എന്നു നിലനിർത്തി.
- source_word: ἐκεῖνος
  choice: അദ്ദേഹം
  rationale: ഇത് മോശയെ തിരിച്ചുസൂചിപ്പിക്കുന്ന ഊന്നലുള്ള സർവനാമമാണ്. മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായ ‘അദ്ദേഹം’ ഉപയോഗിക്കുകയും പ്രകടമായ ‘ആ വ്യക്തി’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ അറിയിക്കുകയും ചെയ്തു.
- source_word: ἔγραψεν
  choice: എഴുതിയത്
  rationale: അയോറിസ്റ്റ് ക്രിയയുടെ ഭൂതകാലസൂചന മലയാളത്തിലെ സ്വാഭാവിക ഭൂതകാലരൂപത്തിൽ നൽകി.
theological_decisions:
- issue: യേശുവിനെക്കുറിച്ചുള്ള മോശയുടെ സാക്ഷ്യത്തിന്റെ സ്വഭാവം
  choice: അദ്ദേഹം എന്നെക്കുറിച്ചാണ് എഴുതിയത്
  alternative: എന്നെ സംബന്ധിച്ചാണ് ആ വ്യക്തി എഴുതിയത്
  rationale: മോശയുടെ എഴുത്തുകൾ യേശുവിനെക്കുറിച്ച് സാക്ഷ്യം വഹിക്കുന്നു എന്ന അവകാശവാദം മാത്രം പരിഭാഷ വ്യക്തമാക്കുന്നു; ഏതെങ്കിലും ഒറ്റ ഭാഗമോ പ്രത്യേക വ്യാഖ്യാനരീതിയോ വാക്യത്തിൽ കൂട്ടിച്ചേർക്കുന്നില്ല.
- issue: πιστεύω എന്ന ക്രിയയുടെ ബന്ധാർഥം
  choice: മോശയെ ... വിശ്വസിച്ചിരുന്നെങ്കിൽ, എന്നെയും വിശ്വസിക്കുമായിരുന്നു
  alternative: മോശയിൽ ... വിശ്വാസമുണ്ടായിരുന്നെങ്കിൽ, എന്നിലും വിശ്വാസമുണ്ടാകുമായിരുന്നു
  rationale: രണ്ടിടത്തും ഒരേ ഗ്രീക്ക് ക്രിയയും ദത്തിവും ഉള്ളതിനാൽ ഒരേ മലയാള ക്രിയാരൂപം നിലനിർത്തി. ‘എന്നിൽ വിശ്വസിക്കുക’ എന്നു പറഞ്ഞാൽ മൂലത്തിൽ ഇല്ലാത്ത εἰς എന്ന ആശയം അനാവശ്യമായി ഇറക്കുമതി ചെയ്യാൻ ഇടയുണ്ട്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. യാഥാർഥ്യവിരുദ്ധ നിബന്ധന ‘വിശ്വസിച്ചിരുന്നെങ്കിൽ ... വിശ്വസിക്കുമായിരുന്നു’ എന്ന ഘടനയിൽ വ്യക്തമാക്കിയിരിക്കുന്നു. ‘വിശ്വസിക്കുക’ എന്ന ഒരേ പദം രണ്ടു ഘടകങ്ങളിലും നിലനിർത്തി മൂലത്തിലെ ശബ്ദബന്ധം സംരക്ഷിച്ചു.
