id: JHN.5.1
reference: John 5:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ⸀ἦν ἑορτὴ τῶν Ἰουδαίων, καὶ ⸀ἀνέβη Ἰησοῦς εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/001.yaml
  text: After these things[a], there was a feast of the Jews[b], and Jesus went up to Jerusalem.
translation:
  language: ml
  text: ഇവയ്ക്കു ശേഷം യെഹൂദന്മാരുടെ ഒരു ഉത്സവം ഉണ്ടായിരുന്നു; യേശു യെരൂശലേമിലേക്കു കയറിപ്പോയി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: ഇവയ്ക്കുശേഷം
  rationale: ταῦτα എന്ന ബഹുവചന സൂചന നിലനിർത്തിക്കൊണ്ട് യോഹന്നാന്റെ ആഖ്യാനപരമായ സംക്രമണപ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἦν
  choice: ഉണ്ടായിരുന്നു
  rationale: ἑορτήയെ പുതുതായി പരിചയപ്പെടുത്തുന്ന εἰμίയുടെ അപൂർണഭൂതകാലരൂപത്തിന് സ്വാഭാവികമായ അസ്തിത്വപ്രയോഗം.
- source_word: ἑορτὴ
  choice: ഉത്സവം
  rationale: ഇവിടെ മതപരമായ ആഘോഷാവസരത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായതിനാൽ ‘ഉത്സവം’ തെരഞ്ഞെടുത്തു; ഭക്ഷണവിരുന്ന് എന്ന തെറ്റായ ധാരണ ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: τῶν Ἰουδαίων
  choice: യെഹൂദന്മാരുടെ
  rationale: ഷഷ്ഠീവിഭക്തി ഈ ഉത്സവം യെഹൂദജനത്തിന്റെ ആചരണവുമായി ബന്ധപ്പെട്ടതാണെന്ന് നേരിട്ട് വ്യക്തമാക്കുന്നു; ഈ സന്ദർഭത്തിൽ പ്രദേശവാസികളായ ‘യെഹൂദ്യർ’ എന്ന അർഥമല്ല പ്രധാനമായത്.
- source_word: ἀνέβη
  choice: കയറിപ്പോയി
  rationale: യെരൂശലേമിലേക്കുള്ള യാത്രയെക്കുറിച്ചുള്ള പരമ്പരാഗത ‘മുകളിലേക്കു പോകുക’ എന്ന ദിശാഭാവവും നഗരത്തിന്റെ ഉയരത്തിലേക്കുള്ള യാത്രാഭാവവും നിലനിർത്തുന്നു.
- source_word: Ἱεροσόλυμα
  choice: യെരൂശലേം
  rationale: സ്ഥലനാമത്തിന്റെ മലയാളത്തിലെ സ്ഥിരപ്രചാരമുള്ള ബൈബിൾരൂപം.
theological_decisions:
- issue: യോഹന്നാനിലെ Ἰουδαίων എന്ന പദത്തിന്റെ സൂചന
  choice: യെഹൂദന്മാരുടെ
  alternative: യെഹൂദ്യരുടെ
  rationale: യോഹന്നാനിൽ ഈ പദത്തിന് ചില സന്ദർഭങ്ങളിൽ ‘യെഹൂദ്യർ’ എന്ന പ്രദേശപരമായ അർഥം ഉണ്ടാകാമെങ്കിലും ഇവിടെ അത് ഒരു മതോത്സവത്തെ വിശേഷിപ്പിക്കുന്നതിനാൽ യെഹൂദജനത്തെയും അവരുടെ ആചരണത്തെയും സൂചിപ്പിക്കുന്ന വിവർത്തനമാണ് സന്ദർഭോചിതം.
- issue: പറയപ്പെടുന്ന ഉത്സവത്തിന്റെ തിരിച്ചറിയൽ
  choice: ഒരു ഉത്സവം എന്നു മാത്രം നൽകി; ഏത് ഉത്സവമെന്ന് നിർണയിച്ചില്ല
  alternative: പെസഹയോ മറ്റൊരു പ്രത്യേക യെഹൂദോത്സവമോ എന്നു വ്യക്തമാക്കുക
  rationale: ഗ്രീക്ക് പാഠം ഉത്സവത്തിന്റെ പേര് പറയുന്നില്ല. അതിനാൽ പ്രത്യേക ഉത്സവമായി തിരിച്ചറിയുന്നത് പാഠത്തിന് പുറത്തുള്ള അനുമാനം ചേർക്കുന്നതായിരിക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പെരുന്നാൾ’ എന്ന പരമ്പരാഗത പദത്തിനു പകരം സാധാരണ വായനക്കാർക്ക് മതപരമായ ആഘോഷം എന്ന് വ്യക്തമായി ഗ്രഹിക്കാവുന്ന ‘ഉത്സവം’ ഉപയോഗിച്ചു. വാക്യത്തിന്റെ രണ്ടു ഘടകങ്ങളും അർദ്ധവിരാമംകൊണ്ട് ബന്ധിപ്പിച്ച് καίയുടെ ആഖ്യാനതുടർച്ച നിലനിർത്തി.
