revisions:
- from: എന്നാൽ ഞാൻ മനുഷ്യനിൽനിന്നുള്ള സാക്ഷ്യം സ്വീകരിക്കുന്നില്ല; നിങ്ങൾ രക്ഷിക്കപ്പെടേണ്ടതിനാണ് ഞാൻ ഇവ പറയുന്നത്.
  to: എന്നാൽ, ഞാൻ മനുഷ്യനിൽനിന്ന് സാക്ഷ്യം സ്വീകരിക്കുന്നില്ല; മറിച്ച്, നിങ്ങൾ രക്ഷിക്കപ്പെടേണ്ടതിന് ഞാൻ ഇവ പറയുന്നു.
  rationale: The revision retains the Greek present tense, generic singular ‘human being,’ plural demonstrative, and passive salvific wording. It makes the δὲ ... ἀλλὰ contrast explicit in idiomatic Malayalam and streamlines the source expression without changing meaning.
