id: JHN.5.34
reference: John 5:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐγὼ δὲ οὐ παρὰ ἀνθρώπου τὴν μαρτυρίαν λαμβάνω, ἀλλὰ ταῦτα λέγω ἵνα ὑμεῖς σωθῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/034.yaml
  text: But I do not receive testimony from man; rather, I say these things so that you may be saved.
translation:
  language: ml
  text: എന്നാൽ, ഞാൻ മനുഷ്യനിൽനിന്ന് സാക്ഷ്യം സ്വീകരിക്കുന്നില്ല; മറിച്ച്, നിങ്ങൾ രക്ഷിക്കപ്പെടേണ്ടതിന് ഞാൻ ഇവ പറയുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρὰ ἀνθρώπου
  choice: മനുഷ്യനിൽനിന്നുള്ള
  rationale: παρά + genitive ഉറവിടത്തെ സൂചിപ്പിക്കുന്നു. ഏകവചനമായ ἀνθρώπου നിലനിർത്തിക്കൊണ്ട്, ഇവിടെ വ്യക്തമായ ഒരു പ്രത്യേക മനുഷ്യനെക്കാൾ മാനുഷിക ഉറവിടത്തിലുള്ള സാക്ഷ്യമാണ് ഉദ്ദേശ്യമെന്ന സന്ദർഭസൂചനയും മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: μαρτυρίαν
  choice: സാക്ഷ്യം
  rationale: ന്യായപരവും തെളിവുസംബന്ധവുമായ ഭാവം നിലനിർത്തുന്ന, സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമായ പദമാണ് ‘സാക്ഷ്യം’; ഇത് സാക്ഷിപറയുന്ന വ്യക്തിയെയല്ല, സാക്ഷ്യത്തിന്റെ ഉള്ളടക്കത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: λαμβάνω
  choice: സ്വീകരിക്കുന്നില്ല
  rationale: വർത്തമാനകാലത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുകയും ‘സാക്ഷ്യം’ എന്നതോടൊപ്പം സ്വാഭാവികമായി ചേരുകയും ചെയ്യുന്നു. സന്ദർഭത്തിൽ ആശ്രയിക്കുകയോ അംഗീകാരം തേടുകയോ ചെയ്യുന്നില്ലെന്ന നിഴലർത്ഥം ഉണ്ടായാലും, അത് വ്യാഖ്യാനമായി ചേർത്തിട്ടില്ല.
- source_word: ταῦτα
  choice: ഇവ
  rationale: നപുംസകലിംഗ ബഹുവചനമായ demonstrative-ന്റെ ബഹുവചനസ്വഭാവം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: λέγω
  choice: ഞാൻ ... പറയുന്നത്
  rationale: ഗ്രീക്ക് വർത്തമാനകാലത്തെ മലയാളത്തിലെ സ്വാഭാവികമായ വാക്യഘടനയിൽ പ്രതിഫലിപ്പിക്കുന്നു; ‘ഇവ’ എന്ന നേരിട്ടുള്ള കർമത്തോടു ചേർന്ന് വ്യക്തമാണ്.
- source_word: ἵνα ὑμεῖς σωθῆτε
  choice: നിങ്ങൾ രക്ഷിക്കപ്പെടേണ്ടതിനാണ്
  rationale: ἵναയുടെ ഉദ്ദേശ്യബോധവും σωθῆτεയുടെ passive രൂപവും നിലനിർത്തുന്നു. ‘രക്ഷിക്കപ്പെടുക’ എന്നത് രക്ഷയുടെ സ്വഭാവത്തെ ഏതെങ്കിലും പ്രത്യേക സിദ്ധാന്തരീതിയിൽ ചുരുക്കുന്നില്ല.
- source_word: δὲ ... ἀλλὰ
  choice: എന്നാൽ ... -േണ്ടതിനാണ്
  rationale: δὲ മുൻസന്ദർഭത്തോടുള്ള വിരോധം വ്യക്തമാക്കുന്നു. ἀλλά ഇവിടെ ആദ്യ നിഷേധത്തിന് എതിരായി യേശു ഇവ പറയുന്നതിന്റെ യഥാർഥ ഉദ്ദേശ്യം മുന്നോട്ടുവയ്ക്കുന്നു; മലയാളത്തിലെ കേന്ദ്രീകൃത ‘-േണ്ടതിനാണ്’ ഘടന ആ തിരിവ് സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ‘നിങ്ങൾ രക്ഷിക്കപ്പെടേണ്ടതിന്’ എന്നതിന്റെ സന്ദർഭാർഥം
  choice: രക്ഷയെ വിശാലമായ അർഥത്തിൽ നിലനിർത്തുന്ന ‘രക്ഷിക്കപ്പെടുക’ എന്ന പ്രയോഗം
  alternative: വിടുവിക്കപ്പെടുക; രക്ഷയിലേക്കു വരുക
  rationale: σωθῆτεയുടെ ദൈവശാസ്ത്രഭാരം നിലനിർത്തുന്നതിനൊപ്പം, അത് ശാരീരിക വിടുതലായി ചുരുക്കുകയോ രക്ഷയുടെ രീതി ഒരു പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ ചട്ടക്കൂടിൽ വിശദീകരിക്കുകയോ ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ വിരോധഘടന, ബഹുവചനമായ ταῦτα, σωθῆτεയുടെ passive സ്വഭാവം എന്നിവ കഴിയുന്നത്ര സ്വാഭാവികമായി നിലനിർത്തിയിരിക്കുന്നു.
