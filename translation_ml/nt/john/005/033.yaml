  text: You have sent to John[a], and he has testified to the truth.
translation:
  language: ml
  text: നിങ്ങൾ യോഹന്നാന്റെ അടുക്കൽ ആളുകളെ അയച്ചിട്ടുണ്ട്; അദ്ദേഹം സത്യത്തിന് സാക്ഷ്യം വഹിച്ചിരിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അദ്ദേഹം സത്യത്തെക്കുറിച്ച് സാക്ഷ്യം പറഞ്ഞിരിക്കുന്നു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: നിങ്ങൾ
  rationale: ക്രിയയിൽതന്നെ രണ്ടാംപുരുഷ ബഹുവചനം വ്യക്തമാണെങ്കിലും, ഗ്രീക്കിലെ പ്രത്യക്ഷ സർവനാമം നിലനിർത്താൻ ‘നിങ്ങൾ’ ഉപയോഗിച്ചു; ‘നിങ്ങൾതന്നെ’ എന്നു നൽകുന്നത് ഊന്നൽ അമിതമാക്കാം.
- source_word: ἀπεστάλκατε
  choice: ആളുകളെ അയച്ചിട്ടുണ്ട്
  rationale: ഇവിടെ സന്ദർഭം യോഹന്നാന്റെ അടുക്കൽ അയച്ച പ്രതിനിധികളെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ആവശ്യമായ കർമം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു. ഗ്രീക്ക് perfect രൂപത്തിന്റെ ഇപ്പോഴും പ്രസക്തമായ മുൻപ്രവൃത്തിഭാവം ‘അയച്ചിട്ടുണ്ട്’ നിലനിർത്തുന്നു.
- source_word: πρὸς Ἰωάννην
  choice: യോഹന്നാന്റെ അടുക്കൽ
  rationale: πρός + വ്യക്തിവാചക കർമം ഒരാളിലേക്കുള്ള ദിശ സൂചിപ്പിക്കുന്നു. ഗ്രീക്ക് ‘യോഹന്നാൻ’ എന്നു മാത്രം പറയുന്നതിനാൽ ‘സ്നാപകൻ’ എന്ന വിശദീകരണം ചേർത്തിട്ടില്ല.
- source_word: μεμαρτύρηκε
  choice: സാക്ഷ്യം നൽകിയിരിക്കുന്നു
  rationale: μαρτυρέωയുടെ സാക്ഷി/ന്യായവ്യവഹാര ഭാവവും perfect രൂപത്തിന്റെ നിലനിൽക്കുന്ന പ്രസക്തിയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: τῇ ἀληθείᾳ
  choice: സത്യത്തിനു
  rationale: μαρτυρέωയോടൊപ്പമുള്ള dative ഇവിടെ ‘സത്യത്തിനു സാക്ഷ്യം നൽകുക’ എന്ന സ്വാഭാവിക പ്രയോഗം നൽകുന്നു; നിർദിഷ്ട ആർട്ടിക്കിളിന്റെ യോഹന്നാനീയ ഭാരം ‘സത്യം’ എന്ന നാമത്തിൽ നിലനിൽക്കുന്നു.
theological_decisions:
- issue: യോഹന്നാന്റെ രചനകളിലെ ‘സത്യം’ എന്ന പ്രയോഗം
  choice: സത്യത്തിനു
  alternative: സത്യത്തെക്കുറിച്ച്
  rationale: ഗ്രീക്കിലെ ആർട്ടിക്കിളോടുകൂടിയ ἀλήθεια വെറും സത്യസന്ധതയേക്കാൾ നിർദിഷ്ടമായ ദൈവിക സത്യത്തെ സൂചിപ്പിക്കാമെങ്കിലും, അതിനെ കൂടുതൽ വിശദമായ ഒരു ഉപദേശപരമായ നിർവചനമായി വികസിപ്പിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മുൻസന്ദർഭത്തിൽ പ്രതിനിധികളെ അയച്ചതാണ് ഉദ്ദേശ്യമെന്നതിനാൽ ‘ആളുകളെ’ ചേർത്തത് മലയാളത്തിലെ അപൂർണത ഒഴിവാക്കുന്നു; ഇത് പുതിയ തിരിച്ചറിയൽ വിവരമൊന്നും ഇറക്കുമതി ചെയ്യുന്നില്ല.
