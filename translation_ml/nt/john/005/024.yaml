id: JHN.5.24
reference: John 5:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι ὁ τὸν λόγον μου ἀκούων καὶ πιστεύων τῷ πέμψαντί με ἔχει ζωὴν αἰώνιον, καὶ εἰς κρίσιν οὐκ ἔρχεται ἀλλὰ μεταβέβηκεν ἐκ τοῦ θανάτου εἰς τὴν ζωήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/024.yaml
  text: Truly[a], truly, I say to you, whoever hears my word and believes him who sent me has eternal life, and does not come into judgment[b], but has passed from death into life.
translation:
  language: ml
  text: 'സത്യമായി, സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: എന്റെ വചനം കേൾക്കുകയും എന്നെ അയച്ചവനെ വിശ്വസിക്കുകയും ചെയ്യുന്നവന് നിത്യജീവൻ ഉണ്ട്. അവൻ ന്യായവിധിയിലേക്കു വരുന്നില്ല[a]; മറിച്ച്, മരണത്തിൽനിന്ന് ജീവനിലേക്കു കടന്നിരിക്കുന്നു[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘ശിക്ഷാവിധിയിലേക്കു വരുന്നില്ല.’ ഗ്രീക്ക് κρίσις എന്ന പദത്തിന് പൊതുവായി ‘വിധി’ എന്നും, ഈ സന്ദർഭത്തിൽ പ്രതികൂലമായ വിധി എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: 'ഇവിടെയുള്ള ഗ്രീക്ക് പൂർണ്ണകാല ക്രിയ പൂർത്തിയായ ഒരു മാറ്റത്തെയും അതിന്റെ തുടരുന്ന ഫലത്തെയും സൂചിപ്പിക്കുന്നു: മരണത്തിൽനിന്ന് ജീവനിലേക്കു ‘കടന്നിരിക്കുന്നു’ അഥവാ ‘മറുകരയിലെത്തിയിരിക്കുന്നു.’'
    reason: verbal_aspect
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: സത്യം, സത്യമായി
  rationale: യേശുവിന്റെ ഇരട്ടിച്ചുള്ള ഗൗരവമേറിയ ഉറപ്പിക്കൽ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ രീതിയിൽ നിലനിർത്തുന്നു.
- source_word: λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: നേരിട്ടുള്ള പ്രസ്താവനാരൂപം ഗ്രീക്കിനോടു ചേർന്നുനിൽക്കുകയും മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: ὁ ... ἀκούων καὶ πιστεύων
  choice: കേൾക്കുകയും ... വിശ്വസിക്കുകയും ചെയ്യുന്നവന്
  rationale: വർത്തമാനകാല കൃദന്തരൂപങ്ങളുടെ പൊതുവായ, സ്വഭാവസൂചകമായ അർഥം ലിംഗനിരപേക്ഷമായ മലയാളപ്രയോഗത്തിൽ നൽകുന്നു.
- source_word: τὸν λόγον μου
  choice: എന്റെ വചനം
  rationale: λόγος ഇവിടെ യേശുവിന്റെ സന്ദേശത്തെ സൂചിപ്പിക്കുന്നു; ‘വചനം’ യോഹന്നാനിലെ പദപ്രതിധ്വനി നിലനിർത്തുകയും സന്ദർഭത്തിൽ വ്യക്തമായിരിക്കുകയും ചെയ്യുന്നു.
- source_word: πιστεύων τῷ πέμψαντί με
  choice: എന്നെ അയച്ചവനെ വിശ്വസിക്കുകയും
  rationale: ദത്തിവിനോടുകൂടിയ πιστεύω എന്ന ക്രിയയുടെ ‘ഒരാളെ വിശ്വസിക്കുക/ആശ്രയിക്കുക’ എന്ന നേരിട്ടുള്ള ബന്ധം സംരക്ഷിക്കുന്നു.
- source_word: ἔχει ζωὴν αἰώνιον
  choice: നിത്യജീവൻ ഉണ്ട്
  rationale: ἔχει എന്ന വർത്തമാനകാലം നിത്യജീവൻ ഇപ്പോൾത്തന്നെയുള്ള കൈവശമാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: εἰς κρίσιν οὐκ ἔρχεται
  choice: ന്യായവിധിയിലേക്കു വരുന്നില്ല
  rationale: κρίσις എന്ന പദത്തിന്റെ വിശാലമായ ‘വിധി’ അർഥം നിലനിർത്തുന്നു; ‘ശിക്ഷാവിധി’ എന്നു നൽകി പ്രതികൂലഫലം മുൻകൂട്ടി നിർണ്ണയിക്കുന്നില്ല. εἰς എന്നതിന്റെ ദിശാസൂചനയും സംരക്ഷിക്കുന്നു.
- source_word: μεταβέβηκεν
  choice: കടന്നിരിക്കുന്നു
  rationale: പൂർത്തിയായ മാറ്റവും അതിന്റെ തുടരുന്ന ഫലവും സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പൂർണ്ണകാലത്തിന്റെ ഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐκ τοῦ θανάτου εἰς τὴν ζωήν
  choice: മരണത്തിൽനിന്ന് ജീവനിലേക്കു
  rationale: മരണവും ജീവനും തമ്മിലുള്ള യോഹന്നാനീയ വൈരുധ്യവും ഉറവിടത്തിൽനിന്ന് ലക്ഷ്യത്തിലേക്കുള്ള ചലനവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: രക്ഷാസന്ദർഭത്തിൽ κρίσις എന്നതിന്റെ അർഥം
  choice: ന്യായവിധി
  alternative: ശിക്ഷാവിധി
  rationale: സന്ദർഭം പ്രതികൂലമായ അന്ത്യവിധിയിൽനിന്നുള്ള ഒഴിവാക്കൽ സൂചിപ്പിച്ചാലും, ഗ്രീക്ക് നാമം വ്യക്തമായി ‘ശിക്ഷാവിധി’ മാത്രമെന്നു പറയുന്നില്ല. വിശാലമായ പദം ഉപയോഗിക്കുന്നത് യഥാർഥ അർഥവ്യാപ്തിയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും സംരക്ഷിക്കുന്നു.
- issue: രക്ഷയുമായി ബന്ധപ്പെട്ട വർത്തമാനകാലത്തിന്റെയും പൂർണ്ണകാലത്തിന്റെയും ശക്തി
  choice: നിത്യജീവന്റെ ഇപ്പോഴത്തെ കൈവശവും മരണത്തിൽനിന്ന് ജീവനിലേക്കുള്ള പൂർത്തിയായ, തുടർഫലമുള്ള കടക്കലും
  alternative: ഭാവിയിൽ മാത്രമുള്ള ജീവൻ അല്ലെങ്കിൽ ഭാവിയിലെ വിധിവിമുക്തി മാത്രം
  rationale: ἔχει വർത്തമാനകാലത്തിലും μεταβέβηκεν പൂർണ്ണകാലത്തിലും ഉള്ളതിനാൽ, വാക്യം ഇപ്പോഴത്തെ യാഥാർഥ്യവും പൂർത്തിയായ മാറ്റത്തിന്റെ നിലനിൽക്കുന്ന ഫലവും പ്രസ്താവിക്കുന്നു; ഇതിനെ ഒരു പ്രത്യേക വിഭാഗീയ സമ്പ്രദായത്തിലേക്കു വികസിപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവവും യോഹന്നാനീയ ശൈലിയും നിലനിർത്തുന്ന മലയാളം. ‘ന്യായവിധി’ എന്നത് അർഥം അതിയായി ചുരുക്കാതെ സൂക്ഷിക്കുന്നു; ‘കടന്നിരിക്കുന്നു’ ഗ്രീക്ക് പൂർണ്ണകാലത്തിന്റെ തുടർഫലം സ്വാഭാവികമായി നൽകുന്നു.
