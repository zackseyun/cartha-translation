  text: καὶ ἐξουσίαν ἔδωκεν ⸀αὐτῷ κρίσιν ποιεῖν, ὅτι υἱὸς ἀνθρώπου ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/027.yaml
  text: And he gave him authority to execute judgment[a], because he is the Son of Man.
translation:
  language: ml
  text: ന്യായവിധി നടത്താനുള്ള അധികാരവും അവിടുന്ന് അവന് നൽകി; അവൻ മനുഷ്യപുത്രനായിരിക്കുന്നതിനാൽ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “അവൻ മനുഷ്യനായതിനാൽ,” അതായത്, അവൻ മനുഷ്യസ്വഭാവത്തിൽ പങ്കാളിയായതിനാൽ. യോഹന്നാനിൽ സാധ്യതയേറിയ ശീർഷകപ്രയോഗം പ്രധാനപാഠത്തിൽ നിലനിർത്തിയിരിക്കുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξουσίαν
  choice: അധികാരം
  rationale: പിതാവ് പുത്രനു നൽകുന്ന ന്യായവിധിസംബന്ധമായ അവകാശവും അധികാരപരിധിയും സൂചിപ്പിക്കുന്നതിനാൽ, വെറും ശക്തിയെന്നതിലുപരി ‘അധികാരം’ യോജിക്കുന്നു.
- source_word: ἔδωκεν
  choice: നൽകി
  rationale: δίδωμι എന്ന ക്രിയയുടെ ലളിതമായ ഭൂതകാലബലം സ്വാഭാവിക മലയാളത്തിൽ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: αὐτῷ
  choice: അവനു
  rationale: സന്ദർഭത്തിൽ പുത്രനെ സൂചിപ്പിക്കുന്ന ദത്തിവ് സർവനാമത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: κρίσιν ποιεῖν
  choice: വിധി നടപ്പാക്കാൻ
  rationale: അക്ഷരാർഥമായ ‘വിധി ചെയ്യുക’ എന്നതിനു പകരം, ന്യായാധിപത്യവിധി പ്രാവർത്തികമാക്കുക എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായും ഔപചാരികമായും നൽകുന്നു.
- source_word: ὅτι
  choice: കാരണം
  rationale: ഇവിടെ അധികാരം നൽകിയതിന്റെ കാരണം അവതരിപ്പിക്കുന്ന കാരണാർഥക പ്രയോഗമാണ്.
- source_word: υἱὸς ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: യോഹന്നാനിലെ സ്ഥാപിതമായ ക്രിസ്തുശീർഷകവും ദാനീയേൽ 7-ന്റെ പ്രതിധ്വനിയും നിലനിർത്തുന്നു; ഗ്രീക്കിൽ ആർട്ടിക്കിൾ ഇല്ലാത്തതിനാൽ സാധ്യതയുള്ള പൊതുവായ മാനുഷിക അർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἐστίν
  choice: ആണ്
  rationale: വർത്തമാനകാലത്തിലെ ലളിതമായ സംയോജകക്രിയയെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: υἱὸς ἀνθρώπου എന്നത് ക്രിസ്തുശീർഷകമായോ പൊതുവായ മാനുഷികപ്രയോഗമായോ വിവർത്തനം ചെയ്യണമോ
  choice: പ്രധാനപാഠത്തിൽ ‘മനുഷ്യപുത്രൻ’ എന്ന ശീർഷകം
  alternative: ‘ഒരു മനുഷ്യപുത്രൻ’, അഥവാ ‘മനുഷ്യസ്വഭാവമുള്ളവൻ’
  rationale: യോഹന്നാന്റെ സുവിശേഷത്തിലെ പ്രയോഗവും ന്യായവിധിയധികാരത്തിന്റെ ദാനീയേൽ 7 പശ്ചാത്തലവും ശീർഷകാർഥത്തെ ശക്തമായി പിന്തുണയ്ക്കുന്നു. എങ്കിലും ഗ്രീക്കിലെ അനാർത്രസ് രൂപം മാനുഷികസ്വഭാവത്തെ ഊന്നുന്ന വായനയ്ക്കും ഇടനൽകുന്നതിനാൽ ആ യഥാർഥ സന്ദിഗ്ധത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘വിധി നടപ്പാക്കുക’ എന്നത് ന്യായാധിപത്യസന്ദർഭം വ്യക്തമാക്കുന്നു. പിതാവിനായി ‘അവിടന്ന്’ എന്നും പുത്രനായി ‘അവൻ/അവനു’ എന്നും ഉപയോഗിച്ച് പരാമർശവ്യത്യാസം സ്വാഭാവികമായി വ്യക്തമാക്കിയിരിക്കുന്നു.
