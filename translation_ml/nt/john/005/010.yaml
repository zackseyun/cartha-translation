id: JHN.5.10
reference: John 5:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔλεγον οὖν οἱ Ἰουδαῖοι τῷ τεθεραπευμένῳ· Σάββατόν ἐστιν, ⸀καὶ οὐκ ἔξεστίν σοι ἆραι τὸν ⸀κράβαττον.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/010.yaml
  text: So the Jews were saying to the man who had been healed[a], “It is the Sabbath[c][b], and it is not lawful for you to carry your mat.”
translation:
  language: ml
  text: 'അപ്പോൾ യെഹൂദന്മാർ[a] സൗഖ്യം പ്രാപിച്ച മനുഷ്യനോട് പറഞ്ഞുകൊണ്ടിരുന്നു: “ശബ്ബത്താണ്; നിന്റെ കിടക്കപ്പായ[c] എടുത്തുകൊണ്ടുപോകുന്നത്[b] നിനക്കു നിയമാനുസൃതമല്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: സന്ദർഭത്തിൽ യോഹന്നാൻ ഈ പദം ഉപയോഗിക്കുന്ന രീതിയനുസരിച്ച്, “യെഹൂദനേതാക്കൾ” എന്നോ “യെഹൂദ്യക്കാർ” എന്നോ അർഥമാകാനും സാധ്യതയുണ്ട്.
    reason: alternative_reading
  - marker: b
    text: “എടുത്തുയർത്തുന്നത്” എന്നോ “എടുക്കുന്നത്” എന്നോ വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: c
    text: ഇവിടത്തെ പദം വലിയൊരു കട്ടിലിനെയല്ല, എടുത്തുകൊണ്ടുപോകാവുന്ന ഉറക്കപ്പായയെയോ ലളിതമായ കിടക്കയെയോ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: ἔλεγον
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം കഴിഞ്ഞകാലത്തിലെ തുടർച്ചയായതോ ആവർത്തിച്ചുള്ളതോ ആയ സംസാരത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: οὖν
  choice: അപ്പോൾ
  rationale: മുൻസംഭവത്തോട് ഈ പ്രതികരണത്തെ ബന്ധിപ്പിക്കുന്ന സ്വാഭാവികമായ ആഖ്യാനസംയോജകമാണ്; അനാവശ്യമായി കടുത്ത കാരണബന്ധം ചുമത്തുന്നില്ല.
- source_word: οἱ Ἰουδαῖοι
  choice: യെഹൂദന്മാർ
  rationale: ഗ്രീക്കിലെ പൊതുവായ പദപ്രയോഗം അതിന്റെ വീതി ചുരുക്കാതെ നിലനിർത്തുന്നു; യോഹന്നാനിലെ സന്ദർഭപരമായ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: τῷ τεθεραπευμένῳ
  choice: സുഖം പ്രാപിച്ചിരുന്ന മനുഷ്യനോട്
  rationale: പൂർണമായ രോഗസൗഖ്യവും അതിന്റെ നിലനിൽക്കുന്ന ഫലവും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; മുൻസന്ദർഭത്തിലെ പുരുഷനെ ‘മനുഷ്യൻ’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: Σάββατόν ἐστιν
  choice: ഇന്ന് ശബ്ബത്താണ്
  rationale: ദിവസത്തെക്കുറിച്ചുള്ള ഗ്രീക്ക് പ്രസ്താവനയെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: οὐκ ἔξεστίν σοι
  choice: നിനക്ക് നിയമം അനുവദിക്കുന്നില്ല
  rationale: ശബ്ബത്താചരണവുമായി ബന്ധപ്പെട്ട നിയമപരവും മതപരവുമായ അനുമതിയുടെ ആശയം ലളിതവും വ്യക്തവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἆραι
  choice: എടുത്തുകൊണ്ടുപോകാൻ
  rationale: വസ്തു എടുക്കുന്നതും കൊണ്ടുപോകുന്നതും ഉൾക്കൊള്ളുന്ന സന്ദർഭാർത്ഥം നൽകുന്നു; പദത്തിന്റെ മറ്റു സാദ്ധ്യമായ സൂക്ഷ്മതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: κράβαττον
  choice: കിടക്കപ്പായ
  rationale: വലിയ കട്ടിലല്ല, എടുത്തുകൊണ്ടുപോകാവുന്ന ഉറക്കപ്പായയാണെന്ന ആശയം വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: യോഹന്നാനിൽ οἱ Ἰουδαῖοι എന്നതിന്റെ സൂചിതവിഭാഗം
  choice: യെഹൂദന്മാർ
  alternative: യെഹൂദനേതാക്കൾ; യെഹൂദ്യക്കാർ
  rationale: ഈ വാക്യം തന്നെ സംസാരിച്ചവരെ നേതാക്കളെന്നോ ഭൂമിശാസ്ത്രപരമായി യെഹൂദ്യക്കാരെന്നോ വ്യക്തമാക്കുന്നില്ല. അതിനാൽ മൂലപദത്തിന്റെ വിശാലത മുഖ്യപാഠത്തിൽ നിലനിർത്തി സന്ദർഭപരമായ സാധ്യതകൾ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘കിടക്കപ്പായ’ സാധാരണ വായനക്കാർക്ക് വസ്തുവിന്റെ സ്വഭാവം വ്യക്തമാക്കുന്നു; ‘നിയമം അനുവദിക്കുന്നില്ല’ നിയമ-മതപരമായ ഭാവം അമിതമായ പുരാതനഭാഷയില്ലാതെ സംരക്ഷിക്കുന്നു.
