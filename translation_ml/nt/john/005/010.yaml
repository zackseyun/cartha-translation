    rationale: The perfect passive participle refers to the man who has been healed, with the result still in effect. “സൗഖ്യം പ്രാപിച്ച മനുഷ്യൻ” expresses this naturally without the potentially awkward progressive-past nuance of “പ്രാപിച്ചിരുന്ന.”
