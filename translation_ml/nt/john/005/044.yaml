id: JHN.5.44
reference: John 5:44
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πῶς δύνασθε ὑμεῖς πιστεῦσαι, δόξαν παρ’ ἀλλήλων λαμβάνοντες, καὶ τὴν δόξαν τὴν παρὰ τοῦ μόνου θεοῦ οὐ ζητεῖτε;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/044.yaml
  text: How are you able to believe[c][b][a], receiving glory from one another and not seeking the glory that is from the only God?
translation:
  language: ml
  text: പരസ്പരം മഹത്വം[a] സ്വീകരിക്കുകയും ഏകനായ ദൈവത്തിൽനിന്നുള്ള മഹത്വം അന്വേഷിക്കാതിരിക്കുകയും ചെയ്യുന്ന നിങ്ങൾക്ക് എങ്ങനെ വിശ്വസിക്കാൻ കഴിയും?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘മഹത്വം’ എന്ന രണ്ടു പ്രയോഗങ്ങൾക്കും ‘ബഹുമതി’ എന്നും പരിഭാഷപ്പെടുത്താം (ഗ്രീക്ക്: δόξα).'
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നിങ്ങൾക്ക് എങ്ങനെ വിശ്വസിക്കാനാകും?’
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς δύνασθε ... πιστεῦσαι
  choice: നിങ്ങൾക്ക് എങ്ങനെ വിശ്വസിക്കാൻ കഴിയും?
  rationale: സാധ്യതയെ ചോദ്യം ചെയ്യുന്ന ഗ്രീക്ക് വാചകത്തിന്റെ ആലങ്കാരിക ചോദ്യഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു. πιστεύω എന്നതിന്റെ വിശാലമായ യോഹന്നാനീയ അർഥപരിധി ചുരുക്കാതെ ‘വിശ്വസിക്കുക’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: δόξαν ... τὴν δόξαν
  choice: മഹത്ത്വം ... മഹത്ത്വം
  rationale: ഒരേ ഗ്രീക്ക് പദത്തിന്റെ ആവർത്തനവും മനുഷ്യരിൽനിന്നുള്ള മഹത്ത്വവും ദൈവത്തിൽനിന്നുള്ള മഹത്ത്വവും തമ്മിലുള്ള വൈരുധ്യവും സംരക്ഷിക്കുന്നു. സന്ദർഭത്തിൽ ‘ബഹുമതി’ എന്നതും സാധ്യമാണ്.
- source_word: παρ’ ἀλλήλων λαμβάνοντες
  choice: പരസ്പരം മഹത്ത്വം സ്വീകരിക്കുകയും
  rationale: പരസ്പരമായ മനുഷ്യസ്രോതസ്സും λαμβάνω എന്ന ക്രിയയുടെ നേരിട്ടുള്ള ‘സ്വീകരിക്കുക’ എന്ന അർഥവും നിലനിർത്തുന്നു.
- source_word: καὶ ... οὐ ζητεῖτε
  choice: അന്വേഷിക്കാതിരിക്കുകയും ചെയ്യുന്ന
  rationale: നിഷേധവും മുൻപുള്ള പങ്കാളിക്രിയയോടുള്ള അടുത്ത ബന്ധവും സംരക്ഷിച്ചുകൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ അനുബന്ധഘടന ഉപയോഗിക്കുന്നു.
- source_word: τὴν παρὰ τοῦ μόνου θεοῦ
  choice: ഒരേയൊരു ദൈവത്തിൽനിന്നുള്ള
  rationale: μόνος സൂചിപ്പിക്കുന്ന അനന്യതയും παρὰ സൂചിപ്പിക്കുന്ന സ്രോതസ്സും വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: πιστεῦσαι എന്നതിന്റെ യോഹന്നാനീയ പ്രയോഗം
  choice: വിശ്വസിക്കാൻ
  alternative: ആശ്രയിക്കാൻ
  rationale: ‘വിശ്വസിക്കുക’ എന്നത് വിശ്വാസം/ആശ്രയം എന്നീ സാധ്യതകളെ ഉൾക്കൊള്ളുന്ന സാധാരണവും വിശാലവുമായ പരിഭാഷയാണ്; ഒരു പ്രത്യേക സിദ്ധാന്താർഥം നിർബന്ധിക്കുന്നില്ല.
- issue: രണ്ട് δόξα പ്രയോഗങ്ങളുടെയും ഏകീകരണം
  choice: രണ്ടിടത്തും ‘മഹത്ത്വം’
  alternative: രണ്ടിടത്തും ‘ബഹുമതി’
  rationale: മനുഷ്യരിൽനിന്നുള്ളതും ദൈവത്തിൽനിന്നുള്ളതുമായ δόξα തമ്മിലുള്ള ഉദ്ദേശ്യപൂർവമായ സമാന്തരതയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
- issue: τοῦ μόνου θεοῦ എന്ന പ്രയോഗം
  choice: ഒരേയൊരു ദൈവം
  alternative: ഏകനായ ദൈവം
  rationale: ദൈവത്തിന്റെ അനന്യത നേരിട്ട് വ്യക്തമാക്കുന്നു; വാക്യം പറയുന്നതിലപ്പുറം ക്രിസ്തുശാസ്ത്രപരമോ സമുദായവിശേഷമോ ആയ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായും ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഗ്രീക്കിലെ ഒറ്റ ആലങ്കാരിക ചോദ്യത്തെ മലയാളത്തിൽ അനുബന്ധഘടനയായി അവതരിപ്പിച്ചു; ആവർത്തനവും വൈരുധ്യവും സംരക്ഷിച്ചു.
