  terminology: “പിതാവ്,” “പുത്രൻ,” and “പ്രവൃത്തികൾ” are suitable established terms. “സ്നേഹിക്കുന്നു” faithfully avoids imposing a distinction between φιλέω and ἀγαπάω. No names or theological terminology require change.
