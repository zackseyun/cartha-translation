id: JHN.5.20
reference: John 5:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ γὰρ πατὴρ φιλεῖ τὸν υἱὸν καὶ πάντα δείκνυσιν αὐτῷ ἃ αὐτὸς ποιεῖ, καὶ μείζονα τούτων δείξει αὐτῷ ἔργα, ἵνα ὑμεῖς θαυμάζητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/020.yaml
  text: For the Father loves the Son and shows him all that he himself is doing; and he will show him greater works than these[a], so that you may marvel.
translation:
  language: ml
  text: പിതാവ് പുത്രനെ സ്നേഹിക്കുകയും താൻ ചെയ്യുന്നതെല്ലാം അവനു കാണിച്ചുകൊടുക്കുകയും ചെയ്യുന്നു. ഇവയെക്കാൾ വലിയ പ്രവൃത്തികൾ അവനു കാണിച്ചുകൊടുക്കും; നിങ്ങൾ ആശ്ചര്യപ്പെടേണ്ടതിന്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φιλεῖ
  choice: സ്നേഹിക്കുന്നു
  rationale: ഫിലെയോയ്ക്ക് ഇവിടെ വ്യക്തിപരമായ സ്നേഹത്തിന്റെ ഭാവമുണ്ടെങ്കിലും യോഹന്നാന്റെ പ്രയോഗത്തിൽ അഗപാവോയുമായി അർത്ഥവ്യാപ്തി പങ്കിടാം. അതിനാൽ സ്നേഹത്തെ കുറച്ചുകാട്ടാതെ സ്വാഭാവികമായി ‘സ്നേഹിക്കുന്നു’ എന്നു നൽകി.
- source_word: δείκνυσιν / δείξει
  choice: കാണിച്ചുകൊടുക്കുന്നു / കാണിച്ചുകൊടുക്കും
  rationale: വർത്തമാന-ഭാവി ക്രിയകളിലെ പദബന്ധം നിലനിർത്തുകയും പിതാവ് പുത്രനു തന്റെ പ്രവൃത്തികൾ കാണിക്കുന്നു എന്ന നേരിട്ടുള്ള അർത്ഥം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: πάντα ἃ αὐτὸς ποιεῖ
  choice: താൻ ചെയ്യുന്നതെല്ലാം
  rationale: πάνταയുടെ സമഗ്രതയും αὐτός സൂചിപ്പിക്കുന്ന പിതാവിന്മേലുള്ള ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: μείζονα τούτων ... ἔργα
  choice: ഇവയെക്കാൾ വലിയ പ്രവൃത്തികൾ
  rationale: യോഹന്നാനിൽ ἔργα യേശുവിന്റെ പ്രവർത്തനങ്ങൾക്കും അടയാളങ്ങൾക്കും ഉള്ള പ്രാധാന്യം വഹിക്കുന്നതിനാൽ ‘പ്രവൃത്തികൾ’ എന്ന പദം തെരഞ്ഞെടുത്തു.
- source_word: ἵνα ὑμεῖς θαυμάζητε
  choice: അങ്ങനെ നിങ്ങൾ ആശ്ചര്യപ്പെടും
  rationale: ἵναയും ഉപവിധിക്രിയയും പ്രകടിപ്പിക്കുന്ന ഉദ്ദേശ്യം/ഫലം എന്ന അർത്ഥവ്യാപ്തി മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു; ബഹുവചന അഭിസംബോധനയും വ്യക്തമാണ്.
theological_decisions:
- issue: φιλέω സൂചിപ്പിക്കുന്ന പിതാവിന്റെ പുത്രനോടുള്ള സ്നേഹത്തിന്റെ സ്വഭാവം
  choice: ‘സ്നേഹിക്കുന്നു’ എന്ന് ലളിതമായി പരിഭാഷപ്പെടുത്തി; താഴ്ന്നതോ വെറും മാനുഷികമോ ആയ സ്നേഹം സൂചിപ്പിച്ചില്ല.
  alternative: ‘വാത്സല്യമുണ്ട്’ അല്ലെങ്കിൽ ‘പ്രിയംവെക്കുന്നു’
  rationale: യോഹന്നാനിൽ φιλέωയും ἀγαπάωയും അർത്ഥത്തിൽ തമ്മിൽ മുട്ടിച്ചേരാം. ഇവിടെ അനാവശ്യമായ ദൈവശാസ്ത്ര വ്യത്യാസം കൊണ്ടുവരാതിരിക്കാൻ പൊതുവായെങ്കിലും ശക്തമായ പദം ഉപയോഗിച്ചു.
- issue: ἵνα ὑμεῖς θαυμάζητε എന്നതിന്റെ ഉദ്ദേശ്യ/ഫല ഭാവം
  choice: ‘അങ്ങനെ നിങ്ങൾ ആശ്ചര്യപ്പെടും’ എന്ന പ്രധാനവായന നൽകി.
  alternative: ‘നിങ്ങൾ ആശ്ചര്യപ്പെടേണ്ടതിന്’
  rationale: സന്ദർഭത്തിൽ യേശുവിന്റെ ശ്രോതാക്കളുടെ ആശ്ചര്യം ഉദ്ദേശ്യമായും സംഭവിക്കുന്ന ഫലമായും ഗ്രഹിക്കാം. പ്രധാനവാചകം സ്വാഭാവിക മലയാളം നൽകുന്നു; കൂടുതൽ വ്യക്തമായ ഉദ്ദേശ്യവായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മാന്യവുമായ മലയാളം. ‘പിതാവ്’, ‘പുത്രൻ’, ‘പ്രവൃത്തികൾ’ എന്നീ യോഹന്നാനീയ പദബന്ധങ്ങൾ നിലനിർത്തി; കൃത്രിമമായി അതിപുരാതനമായ ഭാഷ ഒഴിവാക്കി.
