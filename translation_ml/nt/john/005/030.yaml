id: JHN.5.30
reference: John 5:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οὐ δύναμαι ἐγὼ ποιεῖν ἀπ’ ἐμαυτοῦ οὐδέν· καθὼς ἀκούω κρίνω, καὶ ἡ κρίσις ἡ ἐμὴ δικαία ἐστίν, ὅτι οὐ ζητῶ τὸ θέλημα τὸ ἐμὸν ἀλλὰ τὸ θέλημα τοῦ πέμψαντός ⸀με.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/030.yaml
  text: I am not able to do anything from myself. Just as I hear[a], I judge, and my judgment is just, because I do not seek my own will, but the will of the one who sent me.
translation:
  language: ml
  text: എനിക്ക് എന്നിൽനിന്നുതന്നെ ഒന്നും ചെയ്യാൻ കഴിയില്ല.[a] ഞാൻ കേൾക്കുന്നതുപോലെ വിധിക്കുന്നു; എന്റെ വിധി നീതിയുള്ളതാണ്. കാരണം, ഞാൻ അന്വേഷിക്കുന്നത് എന്റെ സ്വന്തം ഇഷ്ടമല്ല, എന്നെ അയച്ചവന്റെ ഇഷ്ടമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എനിക്ക് സ്വന്തമായി ഒന്നും ചെയ്യാൻ കഴിയില്ല.” ഗ്രീക്ക് പ്രയോഗം പ്രവർത്തനത്തിന്റെ ഉറവിടത്തെയും സ്വതന്ത്രമായി പ്രവർത്തിക്കാതിരിക്കുന്നതിനെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ δύναμαι ἐγὼ
  choice: എനിക്ക് ... കഴിയില്ല
  rationale: δύναμαι എന്ന ക്രിയയുടെ നിഷേധിക്കപ്പെട്ട കഴിവിനെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ഗ്രീക്കിലെ ഊന്നൽ സന്ദർഭവും വാക്യക്രമവും ചേർന്ന് അറിയിക്കുന്നു.
- source_word: ποιεῖν ἀπ’ ἐμαυτοῦ οὐδέν
  choice: എന്നിൽനിന്നുതന്നെ ഒന്നും ചെയ്യാൻ
  rationale: ἀπ’ ἐμαυτοῦ എന്നത് വെറും ഒറ്റയ്ക്കുള്ള പ്രവൃത്തിയേക്കാൾ ഉറവിടത്തെയും സ്വതന്ത്രമായ പ്രവർത്തനത്തെയും സൂചിപ്പിക്കുന്നു. ‘എന്നിൽനിന്നുതന്നെ’ ആ ഇരട്ടസൂചനയും നിലനിർത്തുന്നു.
- source_word: καθὼς ἀκούω
  choice: ഞാൻ കേൾക്കുന്നതുപോലെ
  rationale: καθὼς സൂചിപ്പിക്കുന്ന അനുരൂപതയും ἀκούω എന്ന വർത്തമാനകാലത്തിന്റെ പൊതുവായ/തുടർച്ചയായ സ്വഭാവവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: κρίνω
  choice: വിധിക്കുന്നു
  rationale: യോഹന്നാനിലെ ന്യായവിധിസംബന്ധമായ പ്രയോഗം നിലനിർത്തുകയും പിന്നാലെയുള്ള κρίσις എന്ന പദവുമായി അർത്ഥബന്ധം സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ἡ κρίσις ἡ ἐμὴ
  choice: എന്റെ വിധി
  rationale: ആവർത്തിച്ചുള്ള നിർദേശകപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായ ഉടമസ്ഥപ്രയോഗമായി നൽകുന്നു; ന്യായവിധിയുടെ ആശയം നിലനിർത്തുന്നു.
- source_word: δικαία
  choice: നീതിയുള്ളതാണ്
  rationale: κρίσις എന്ന ന്യായവിധിസന്ദർഭത്തിൽ നീതിപൂർവവും ശരിയായതുമായ വിധി എന്ന അർത്ഥം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ζητῶ
  choice: അന്വേഷിക്കുന്നത്
  rationale: ζητέω ഇവിടെ ലക്ഷ്യമാക്കുക, പിന്തുടരുക എന്ന ഇച്ഛാസംബന്ധമായ ആശയം വഹിക്കുന്നു; ‘അന്വേഷിക്കുക’ മൂലപദത്തിന്റെ രൂപവും ആശയവും അതിവ്യാഖ്യാനം കൂടാതെ നിലനിർത്തുന്നു.
- source_word: τὸ θέλημα τὸ ἐμὸν
  choice: എന്റെ സ്വന്തം ഇഷ്ടം
  rationale: ഗ്രീക്കിലെ ഊന്നിയ ഉടമസ്ഥതയെ ‘സ്വന്തം’ വ്യക്തമാക്കുന്നു. θέλημα എന്നത് ഇവിടെ ഇച്ഛ/അഭിലാഷം എന്ന അർത്ഥത്തിൽ സ്വാഭാവികമായി ‘ഇഷ്ടം’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: τοῦ πέμψαντός με
  choice: എന്നെ അയച്ചവൻ
  rationale: ഗ്രീക്കിലെ കർത്തൃവാചക കൃതന്തത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘പിതാവ്’ എന്ന വ്യക്തീകരണം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ἀπ’ ἐμαυτοῦ എന്നതിൽ പുത്രന്റെ പ്രവർത്തനവും അയച്ചവനുമായുള്ള ബന്ധവും
  choice: ‘എന്നിൽനിന്നുതന്നെ’ എന്ന് പരിഭാഷപ്പെടുത്തി; സ്വതന്ത്രമായ ഉറവിടത്തിൽനിന്നുള്ള പ്രവർത്തനമല്ലെന്ന ആശയം സംരക്ഷിച്ചു.
  alternative: ‘സ്വന്തമായി’ / ‘തനിയെ’
  rationale: വാക്യം കേൾക്കുന്നതും വിധിക്കുന്നതും അയച്ചവന്റെ ഇഷ്ടം അന്വേഷിക്കുന്നതുമായി ബന്ധിപ്പിക്കുന്നു. അതിനാൽ കേവലമായ കഴിവില്ലായ്മയെന്നോ ഒറ്റയ്ക്കു പ്രവർത്തിക്കാനാവാത്തതെന്നോ തീർപ്പാക്കാതെ മൂലത്തിലെ ബന്ധപരമായ ആശയവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
- issue: κρίσις δικαία എന്നതിന്റെ ന്യായവിധിസംബന്ധമായ അർത്ഥം
  choice: ‘വിധി നീതിയുള്ളതാണ്’
  alternative: ‘വിധി നീതിപൂർവമാണ്’ / ‘വിധി ശരിയാണ്’
  rationale: ന്യായവിധിയുടെ നീതിയും ശരിതനവും വ്യക്തമാക്കുന്നു; ‘ശരി’ എന്നതിനെക്കാൾ നൈതിക-ന്യായിക ഭാരം സംരക്ഷിക്കുന്നു.
- issue: θέλημα എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ‘ഇഷ്ടം’
  alternative: ‘ഹിതം’ / ‘ഇച്ഛ’
  rationale: ആധുനിക സാധാരണ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്; ‘എന്റെ സ്വന്തം’ എന്ന ഊന്നലോടും ‘എന്നെ അയച്ചവന്റെ’ എന്ന ബന്ധപ്രയോഗത്തോടും നന്നായി ചേരുന്നു. ‘ഹിതം’ കൂടുതൽ പരമ്പരാഗതവും ‘ഇച്ഛ’ അല്പം ഔപചാരികവുമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘വിധിക്കുന്നു/വിധി’ എന്ന ആവർത്തനം ഗ്രീക്കിലെ κρίνω/κρίσις പദബന്ധം നിലനിർത്തുന്നു. മുഖ്യവാചകത്തിലെ [a] അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട പ്രയോഗത്തിനു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
