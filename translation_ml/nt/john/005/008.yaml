id: JHN.5.8
reference: John 5:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· ⸀Ἔγειρε ἆρον τὸν κράβαττόν σου καὶ περιπάτει.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/008.yaml
  text: Jesus says to him[a], “Get up, pick up your mat, and walk.”
translation:
  language: ml
  text: 'യേശു അവനോടു പറയുന്നു: “എഴുന്നേൽക്കുക, നിന്റെ കിടക്കപ്പായ[a] എടുത്ത് നടക്കുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കിടക്ക” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദം സാധാരണയായി ലളിതമായ ഒരു ഉറക്കപ്പായയെയോ പായക്കിടക്കയെയോ സൂചിപ്പിക്കുന്നു; അത് നിർബന്ധമായും ഒരു മുഴുവൻ കട്ടിലല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: പറയുന്നു
  rationale: യോഹന്നാന്റെ ആഖ്യാനത്തിൽ പതിവായ ഗ്രീക്ക് വർത്തമാനകാലത്തെ സ്വാഭാവികമായ മലയാള വർത്തമാനകാലത്തിൽ നിലനിർത്തുന്നു.
- source_word: αὐτῷ
  choice: അവനോട്
  rationale: ദാതൃവിഭക്തിയിലെ പരോക്ഷ കർമത്തെ സന്ദർഭത്തിന് യോജിച്ച ലളിതമായ രൂപത്തിൽ നൽകുന്നു.
- source_word: Ἔγειρε
  choice: എഴുന്നേൽക്കുക
  rationale: കിടന്നിരുന്ന അവസ്ഥയിൽനിന്ന് ഉടൻ എഴുന്നേൽക്കാനുള്ള നേരിട്ടുള്ള കല്പനയെ വ്യക്തമാക്കുന്നു; ‘നിൽക്കുക’ എന്നതിനെക്കാൾ മൂലപദത്തിന്റെ വിശാലമായ അർഥം നിലനിർത്തുന്നു.
- source_word: ἆρον
  choice: എടുത്ത്
  rationale: ഉയർത്തിയെടുക്കുക/കൈയിലെടുക്കുക എന്ന ഭൗതിക പ്രവർത്തനം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: κράβαττόν
  choice: കിടക്കപ്പായ
  rationale: ഭാരമുള്ള കട്ടിലല്ല, എടുത്തുകൊണ്ടുപോകാവുന്ന ലളിതമായ ഉറക്കപ്പായയെയോ വിരിപ്പിനെയോ സൂചിപ്പിക്കുന്ന പദം; സന്ദർഭത്തിലെ കൊണ്ടുപോകാവുന്ന സ്വഭാവം വ്യക്തമാക്കുന്നു.
- source_word: περιπάτει
  choice: നടക്കുക
  rationale: ഇവിടെ ശാരീരികമായി നടക്കുക എന്ന നേരിട്ടുള്ള അർഥം നൽകുന്നു; ക്രിയാഭാവത്തെ അനാവശ്യമായി വിപുലീകരിക്കുന്നില്ല.
theological_decisions:
- issue: രോഗശാന്തിയുടെ സന്ദർഭത്തിലുള്ള യേശുവിന്റെ കല്പനയുടെ സ്വഭാവം
  choice: എഴുന്നേൽക്കുക, കിടക്കപ്പായ എടുക്കുക, നടക്കുക എന്നീ മൂന്ന് ശാരീരിക കല്പനകളും നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘എഴുന്നേറ്റ് സൗഖ്യം പ്രാപിക്കുക’ എന്നിങ്ങനെ രോഗശാന്തിയെ വാക്കുകളിൽ കൂട്ടിച്ചേർക്കുക.
  rationale: രോഗശാന്തി സന്ദർഭത്തിൽ വ്യക്തമായിരുന്നാലും ഈ വാക്യത്തിലെ ഗ്രീക്ക് പാഠം അതിനെ പ്രത്യേകം വാക്കുകളാക്കുന്നില്ല; അതിനാൽ വ്യാഖ്യാനം ചേർക്കാതെ പാഠത്തിന്റെ നേരിട്ടുള്ള കല്പനകൾ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. യോഹന്നാന്റെ ആഖ്യാന വർത്തമാനകാലം ‘പറയുന്നു’ എന്ന രൂപത്തിൽ നിലനിർത്തി; കല്പനകൾ ഔപചാരികമായെങ്കിലും സ്വാഭാവികമായ രൂപത്തിലാണ്.
