  text: δόξαν παρὰ ἀνθρώπων οὐ λαμβάνω,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/041.yaml
  text: I do not receive glory from men[b][a],
translation:
  language: ml
  text: ഞാൻ മനുഷ്യരിൽനിന്നുള്ള മഹത്ത്വം സ്വീകരിക്കുന്നില്ല.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മഹത്ത്വം’ എന്നതിന് ‘ബഹുമാനം’ എന്നോ ‘പ്രശംസ’ എന്നോ വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: 'ഗ്രീക്ക്: ‘മനുഷ്യരിൽനിന്ന്’; ഈ പദം മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δόξαν
  choice: മഹത്ത്വം
  rationale: യോഹന്നാന്റെ സുവിശേഷത്തിലുടനീളമുള്ള δόξα എന്ന പദത്തിന്റെ ആശയബന്ധം നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിൽ മറ്റുള്ളവർ നൽകുന്ന ബഹുമാനം, പ്രശംസ, അംഗീകാരം എന്നിവയും സൂചിപ്പിക്കാം.
- source_word: παρὰ ἀνθρώπων
  choice: മനുഷ്യരിൽനിന്നുള്ള
  rationale: παρά + ഷഷ്ഠീവിഭക്തി ഉറവിടത്തെ സൂചിപ്പിക്കുന്നു. ἀνθρώπων വ്യാകരണപരമായി പുല്ലിംഗ ബഹുവചനമാണെങ്കിലും ഇവിടെ പൊതുവായി മനുഷ്യരെ സൂചിപ്പിക്കുന്നതിനാൽ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും അർത്ഥകൃത്യവുമായ ‘മനുഷ്യരിൽനിന്നുള്ള’ എന്നു നൽകി.
- source_word: οὐ λαμβάνω
  choice: ഞാൻ ... സ്വീകരിക്കുന്നില്ല
  rationale: λαμβάνω എന്നതിന്റെ നേരിട്ടുള്ള അർത്ഥമായ ‘സ്വീകരിക്കുക’ നിലനിർത്തുകയും വർത്തമാനകാലത്തെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: മനുഷ്യരുടെ അംഗീകാരത്തെക്കുറിച്ചുള്ള യേശുവിന്റെ പ്രസ്താവനയുടെ സ്വഭാവം
  choice: പ്രധാനപാഠം ഗ്രീക്കിനോട് ചേർന്ന്, മനുഷ്യരിൽനിന്നുള്ള മഹത്ത്വം യേശു സ്വീകരിക്കുന്നില്ലെന്ന പ്രസ്താവനയായി നിലനിർത്തി.
  alternative: യേശു തന്റെ ദൗത്യത്തിനോ വ്യക്തിത്വത്തിനോ സാധുത നൽകാൻ മനുഷ്യരുടെ പ്രശംസയെ ആശ്രയിക്കുകയോ അന്വേഷിക്കുകയോ ചെയ്യുന്നില്ലെന്ന വ്യാഖ്യാനം പാഠത്തിൽ തുറന്നുപറയുക.
  rationale: സന്ദർഭം മനുഷ്യരുടെ അംഗീകാരത്തിൽ ആശ്രയിക്കാത്തതിനെ സൂചിപ്പിക്കുന്നുണ്ടെങ്കിലും, ഗ്രീക്കിൽ ‘അന്വേഷിക്കുക’ അല്ലെങ്കിൽ ‘ആശ്രയിക്കുക’ എന്ന പദങ്ങൾ ഇല്ല. അതിനാൽ വ്യാഖ്യാനവിപുലീകരണം ചേർക്കാതെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. മൂലത്തിലെ സംക്ഷിപ്തതയും യോഹന്നാനിലെ ‘മഹത്ത്വം’ എന്ന പ്രധാന പദബന്ധവും നിലനിർത്തി; എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
