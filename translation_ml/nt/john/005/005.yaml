  yaml_path: translation/nt/john/005/005.yaml
  text: There was a man there who had been in his sickness for thirty-eight years[a].
translation:
  language: ml
  text: അവിടെ, മുപ്പത്തെട്ട് വർഷമായി രോഗാവസ്ഥയിൽ കഴിഞ്ഞിരുന്ന ഒരു മനുഷ്യൻ ഉണ്ടായിരുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദൗർബല്യാവസ്ഥയിൽ’ അല്ലെങ്കിൽ ‘അസുഖത്തിൽ.’ ഗ്രീക്കിലെ ἀσθένεια എന്ന പദത്തിന് ശാരീരിക ദൗർബല്യമെന്നോ രോഗമെന്നോ വിശാലമായി അർത്ഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δέ
  choice: ഉണ്ടായിരുന്നു
  rationale: δέ ഇവിടെ ശക്തമായ വൈരുധ്യം സൂചിപ്പിക്കുന്നതല്ല; കഥ മുന്നോട്ടുകൊണ്ടുപോകുന്ന മൃദുവായ ബന്ധകമാണ്. മലയാളത്തിൽ പ്രത്യേക ബന്ധകപദം ചേർക്കാതെ സ്വാഭാവികമായ ആഖ്യാനക്രമത്തിലൂടെ ആ ഭാവം നിലനിർത്തുന്നു.
- source_word: τις ἄνθρωπος
  choice: ഒരു മനുഷ്യൻ
  rationale: അനിശ്ചിതനായ ഒരു പുരുഷനെ പരിചയപ്പെടുത്തുന്ന പ്രയോഗം; ‘ഒരു മനുഷ്യൻ’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മൂലപാഠത്തോട് അടുത്തതുമാണ്.
- source_word: ἐκεῖ
  choice: അവിടെ
  rationale: മുൻസന്ദർഭത്തിൽ വിവരിച്ച സ്ഥലത്താണ് ആ മനുഷ്യൻ ഉണ്ടായിരുന്നതെന്ന് നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: τριάκοντα ὀκτὼ ἔτη
  choice: മുപ്പത്തെട്ട് വർഷമായി
  rationale: കാലയളവിന്റെ തുടർച്ച മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്ന രൂപമാണ്.
- source_word: ἔχων
  choice: കഴിയുന്നുണ്ടായിരുന്നു
  rationale: കാലദൈർഘ്യവും അന്നുവരെ തുടരുന്ന അവസ്ഥയും പ്രകടിപ്പിക്കാൻ ഗ്രീക്ക് വർത്തമാന കൃദന്തരൂപത്തെ മലയാളത്തിലെ തുടർച്ചാസൂചകമായ ക്രിയാരൂപത്തിൽ നൽകുന്നു.
- source_word: ἐν τῇ ἀσθενείᾳ αὐτοῦ
  choice: തന്റെ രോഗാവസ്ഥയിൽ
  rationale: ἀσθένεια ശാരീരിക ദൗർബല്യമോ രോഗമോ പൊതുവായി സൂചിപ്പിക്കാം. കൃത്യമായ രോഗം നിർണ്ണയിക്കാതെ ഗ്രീക്ക് മുൻപ്രത്യയഘടനയും അർത്ഥവ്യാപ്തിയും സാധ്യമായത്ര നിലനിർത്തുന്നു.
