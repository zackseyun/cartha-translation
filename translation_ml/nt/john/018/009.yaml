reference: John 18:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἵνα πληρωθῇ ὁ λόγος ὃν εἶπεν ὅτι Οὓς δέδωκάς μοι οὐκ ἀπώλεσα ἐξ αὐτῶν οὐδένα.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/009.yaml
  text: 'so that the word that he had spoken might be fulfilled: “Of those whom you have given me[a], I lost not one.”'
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞ ഈ വചനം നിറവേറേണ്ടതിന്: “നീ എനിക്കു നൽകിയവരിൽ ഒരുവനെയും ഞാൻ നഷ്ടപ്പെടുത്തിയിട്ടില്ല.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരിൽ ആരെയും ഞാൻ നഷ്ടപ്പെടുത്തിയിട്ടില്ല” അല്ലെങ്കിൽ “അവരിൽ ഒരാളെപ്പോലും ഞാൻ നഷ്ടപ്പെടുത്തിയിട്ടില്ല.”
    reason: ἐξ αὐτῶν οὐδένα എന്ന ഭാഗികവും ഊന്നലുള്ളതുമായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള ബദലുകൾ.
lexical_decisions:
- source_word: ἵνα πληρωθῇ
  choice: അങ്ങനെ … നിറവേറി
  rationale: ἵνα ഉദ്ദേശ്യത്തെയോ ഫലത്തെയോ സൂചിപ്പിക്കാം. ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളത്തിൽ ഫലബന്ധം വ്യക്തമാക്കുന്നു; πληρωθῇ എന്ന ആഓറിസ്റ്റ് പാസീവ് സബ്ജങ്ക്റ്റീവിന്റെ നിറവേറൽഭാവവും നിലനിർത്തുന്നു.
- source_word: ὁ λόγος ὃν εἶπεν
  choice: അവൻ പറഞ്ഞ വചനം
  rationale: λόγος ഇവിടെ യേശുവിന്റെ ഒരു പ്രത്യേക പ്രസ്താവനയാണ്; യോഹന്നാൻ 1-ലെ വിശേഷണപദവിയായ ‘വചനം’ എന്ന അർഥം ഇവിടെ ചുമത്തുന്നില്ല. ‘പറഞ്ഞ വചനം’ മലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമാണ്.
- source_word: Οὓς δέδωκάς μοι
  choice: നീ എനിക്കു തന്നവരിൽ
  rationale: δέδωκάς എന്ന പർഫെക്റ്റിന്റെ നിലവിലുള്ള ഫലം ‘തന്നവർ’ എന്ന സ്വാഭാവിക പ്രയോഗത്തിൽ ഉൾക്കൊള്ളുന്നു. ‘-വരിൽ’ എന്ന രൂപം ἐξ αὐτῶν എന്ന ഭാഗികബന്ധവും മുൻകൂട്ടി പ്രകടമാക്കുന്നു.
- source_word: οὐκ ἀπώλεσα
  choice: ഞാൻ നഷ്ടപ്പെടുത്തിയില്ല
  rationale: അറസ്റ്റിന്റെ സന്ദർഭത്തിൽ ശിഷ്യരെ കാത്തുസൂക്ഷിച്ചതാണ് ഉദ്ദേശ്യം. ‘നഷ്ടപ്പെടുത്തിയില്ല’ എന്നത് സജീവമായി നശിപ്പിച്ചു എന്ന അർഥം ഒഴിവാക്കി, യോഹന്നാനിലെ ‘നഷ്ടപ്പെടുക’ എന്ന ആശയബന്ധം നിലനിർത്തുന്നു.
- source_word: ἐξ αὐτῶν οὐδένα
  choice: ഒരുവനെപ്പോലും
  rationale: οὐδένα എന്ന ശക്തമായ നിഷേധം ‘ഒരുവനെപ്പോലും’ എന്ന് സ്വാഭാവികവും ഊന്നലുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു; ‘അവരിൽ’ എന്ന ഭാഗികബന്ധം മുമ്പുള്ള ‘തന്നവരിൽ’ ഉൾക്കൊള്ളുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ വചനം ‘നിറവേറുന്നത്’
  choice: തിരുവെഴുത്തിനെക്കുറിച്ചുള്ള ഔപചാരിക പ്രവചനസൂത്രമായി പരിമിതപ്പെടുത്താതെ, യേശു മുമ്പ് പറഞ്ഞ വചനം സംഭവത്തിൽ നിറവേറിയതായി വിവർത്തനം ചെയ്തു.
  alternative: ‘സത്യമായി’ അല്ലെങ്കിൽ ‘സംഭവിച്ചു’
  rationale: യോഹന്നാൻ πληρόω എന്ന പദം യേശുവിന്റെ സ്വന്തം വചനത്തിന്റെ സാക്ഷാത്കാരത്തിനും ഉപയോഗിക്കുന്നു. ‘നിറവേറി’ അതിന്റെ ദൈവിക-ആഖ്യാനഭാരം നിലനിർത്തുന്നു.
- issue: ἀπώλεσα എന്നതിന്റെ അർഥം
  choice: ‘നഷ്ടപ്പെടുത്തിയില്ല’—യേശുവിന് ഏൽപ്പിക്കപ്പെട്ടവരെ അവൻ കാത്തുസൂക്ഷിച്ചു എന്ന സന്ദർഭാർഥം.
  alternative: ‘നശിപ്പിച്ചില്ല’ അല്ലെങ്കിൽ ‘നശിച്ചുപോകാൻ വിട്ടില്ല’
  rationale: തത്സമയ സന്ദർഭം ശിഷ്യരുടെ സംരക്ഷണമാണ്; അതേസമയം യോഹന്നാൻ 17:12-നോടുള്ള പദപരമായും ദൈവശാസ്ത്രപരമായും ഉള്ള ബന്ധം ‘നഷ്ടപ്പെടുത്തി’ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ഒരുവനെപ്പോലും’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ മൂലത്തിലെ ഊന്നൽ സംരക്ഷിക്കുന്നു; വാക്യക്രമം മലയാളത്തിലെ ഉദ്ധരണിരീതിക്കനുസരിച്ചാണ്.
