revisions:
- from: അങ്ങനെ, “നീ എനിക്കു തന്നവരിൽ ഒരുവനെപ്പോലും ഞാൻ നഷ്ടപ്പെടുത്തിയില്ല”[a] എന്ന് അവൻ പറഞ്ഞ വചനം നിറവേറി.
  to: 'അവൻ പറഞ്ഞ ഈ വചനം നിറവേറേണ്ടതിന്: “നീ എനിക്കു നൽകിയവരിൽ ഒരുവനെയും ഞാൻ നഷ്ടപ്പെടുത്തിയിട്ടില്ല.”[a]'
  rationale: The revised text preserves the Greek ἵνα clause with “നിറവേറേണ്ടതിന്,” retains the direct quotation introduced by ὅτι, and expresses the perfect δέδωκάς with “നൽകിയവരിൽ.” “ഒരുവനെയും” represents the emphatic οὐδένα while maintaining the partitive sense through “-വരിൽ.” The perfect Malayalam negative “നഷ്ടപ്പെടുത്തിയിട്ടില്ല” is natural in a recalled saying and fits the context of Jesus’ preservation of those given to him, without imposing a doctrinal interpretation.
