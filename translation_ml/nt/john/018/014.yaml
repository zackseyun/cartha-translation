source:
  edition: SBLGNT
  text: ἦν δὲ Καϊάφας ὁ συμβουλεύσας τοῖς Ἰουδαίοις ὅτι συμφέρει ἕνα ἄνθρωπον ⸀ἀποθανεῖν ὑπὲρ τοῦ λαοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/014.yaml
  text: Caiaphas was the one who had advised the Jews that it was better for one man to die for the people[a][b].
translation:
  language: ml
  text: കയ്യഫാവ് യഹൂദന്മാരോട്[a] ജനത്തിനുവേണ്ടി[b] ഒരാൾ മരിക്കുന്നതാണ് നല്ലതെന്ന് ഉപദേശിച്ചവനായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “യഹൂദ നേതാക്കളോട്” അല്ലെങ്കിൽ “യെഹൂദ്യരോട്”; ഇവിടെ യോഹന്നാൻ ഉപയോഗിക്കുന്ന “യഹൂദന്മാർ” എന്ന പദം സന്ദർഭത്തിൽ എങ്ങനെ മനസ്സിലാക്കുന്നു എന്നതനുസരിച്ച്.
    reason: alternative_reading
  - marker: b
    text: അഥവാ “ജനത്തെ പ്രതിനിധീകരിച്ച്”; സന്ദർഭത്തിൽ ഈ പ്രയോഗത്തിന് പ്രതിനിധാനപരമോ യാഗപരമോ ആയ അനുരണനങ്ങളും ഉണ്ടായേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ
  choice: ആയിരുന്നു
  rationale: δέ ഇവിടെ നേരിയ ആഖ്യാനബന്ധമാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ അനാവശ്യമായ വിരോധമോ കാലസൂചനയോ ചേർക്കാതെ വാക്യഘടനയിലൂടെ ബന്ധം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: Καϊάφας
  choice: കയ്യഫാവ്
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ രീതിയിൽ വ്യക്തിനാമം ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: ὁ συμβουλεύσας
  choice: ഉപദേശിച്ചവൻ
  rationale: നാമവാചകസ്വഭാവമുള്ള ഭൂതകാല കൃദന്തരൂപം കയ്യഫാവിനെ മുമ്പ് നൽകിയ ഉപദേശത്തിന്റെ അടിസ്ഥാനത്തിൽ തിരിച്ചറിയിക്കുന്നു.
- source_word: τοῖς Ἰουδαίοις
  choice: യഹൂദന്മാരോട്
  rationale: മൂലപാഠത്തിലെ വിശേഷണമില്ലാത്ത Ἰουδαῖοι എന്ന പ്രയോഗം പ്രധാനപാഠത്തിൽ അതേ വ്യാപ്തിയോടെ നിലനിർത്തുന്നു; സന്ദർഭപരമായ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ὅτι συμφέρει
  choice: ഉചിതമെന്ന്
  rationale: συμφέρει ഗുണകരം, പ്രയോജനകരം, ഉചിതം എന്നീ ആശയങ്ങൾ വഹിക്കുന്നു. ആലോചനാപരമായ ഈ സന്ദർഭത്തിൽ ‘ഉചിതം’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളമാണ്.
- source_word: ἕνα ἄνθρωπον
  choice: ഒരാൾ
  rationale: ഒരൊറ്റ മനുഷ്യനെ സൂചിപ്പിക്കുന്ന സംഖ്യാബോധം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അത് യേശുവിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἀποθανεῖν
  choice: മരിക്കുക
  rationale: ക്രിയയുടെ അനന്തക്രിയാരൂപം നേരിട്ട്, വികസിപ്പിക്കാതെ പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: ὑπὲρ τοῦ λαοῦ
  choice: ജനത്തിനുവേണ്ടി
  rationale: ὑπέρ എന്നതിന്റെ ഗുണഭോക്തൃപരവും പ്രതിനിധാനപരവുമായ സാധ്യതകൾ തുറന്നുവെക്കുന്ന സ്വാഭാവിക പരിഭാഷയാണ്.
- source_word: λαοῦ
  choice: ജനം
  rationale: λαός എന്നത് ഇവിടെ ‘ജനം’ എന്നാണ്; യോഹന്നാൻ 11:50-ലെ ἔθνος എന്ന ‘രാജ്യം/ജനത’ സൂചിപ്പിക്കുന്ന വേറൊരു പദവുമായി കലർത്തുന്നില്ല.
theological_decisions:
- issue: ὑπὲρ τοῦ λαοῦ എന്നതിലെ പ്രായശ്ചിത്തപരമോ പകരക്കാരനായുള്ള മരണമോ സൂചിപ്പിക്കുന്ന സാധ്യത
  choice: ജനത്തിനുവേണ്ടി
  alternative: ജനത്തെ പ്രതിനിധീകരിച്ച്; ജനത്തിന്റെ സ്ഥാനത്ത്
  rationale: ഈ സന്ദർഭത്തിൽ ὑπέρ ഗുണത്തിനായി, പ്രതിനിധിയായി, അല്ലെങ്കിൽ വിശാലമായ കഥാസന്ദർഭത്തിൽ പകരക്കാരനായുള്ള മരണത്തിന്റെ അനുരണനത്തോടെ മനസ്സിലാക്കാം. പ്രധാനപാഠം അതിനെ ഒരു പ്രത്യേക സിദ്ധാന്തരൂപത്തിൽ ചുരുക്കുന്നില്ല.
- issue: യോഹന്നാനിലെ τοῖς Ἰουδαίοις എന്നതിന്റെ സന്ദർഭപരമായ സൂചിതർ
  choice: യഹൂദന്മാർ
  alternative: യഹൂദ നേതാക്കൾ; യെഹൂദ്യർ
  rationale: ഗ്രീക്ക് പാഠം ഈ പദത്തെ പ്രത്യേകിച്ച് ചുരുക്കുന്നില്ല. യോഹന്നാനിലെ പ്രയോഗത്തിന്റെ സന്ദർഭപരമായ വിവാദം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലപാഠത്തിലെ പദക്രമം മലയാളവായനയ്ക്ക് യോജിച്ചവിധം ക്രമപ്പെടുത്തി; യോഹന്നാനിലെ ‘യഹൂദന്മാർ’ എന്ന പദത്തിന്റെ വ്യാപ്തിയും ὑπέρ എന്നതിന്റെ ദൈവശാസ്ത്രപരമായ തുറന്നത്വവും അടിക്കുറിപ്പുകളിലൂടെ സംരക്ഷിച്ചു.
