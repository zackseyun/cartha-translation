id: JHN.18.3
reference: John 18:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ οὖν Ἰούδας λαβὼν τὴν σπεῖραν καὶ ἐκ τῶν ἀρχιερέων καὶ ⸂ἐκ τῶν⸃ Φαρισαίων ὑπηρέτας ἔρχεται ἐκεῖ μετὰ φανῶν καὶ λαμπάδων καὶ ὅπλων.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/003.yaml
  text: So Judas[a], having taken the cohort and officers from the chief priests and from the Pharisees[b], comes there with lanterns and torches and weapons.
translation:
  language: ml
  text: അങ്ങനെ, യൂദാസ് സൈനികദളത്തെയും[a] മഹാപുരോഹിതന്മാരിൽനിന്നും പരീശന്മാരിൽനിന്നും വന്ന ഉദ്യോഗസ്ഥരെയും[b] കൂട്ടിക്കൊണ്ട്, കൈവിളക്കുകളും തീപ്പന്തങ്ങളും ആയുധങ്ങളുമായി അവിടെ എത്തുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സൈനികവിഭാഗം” അല്ലെങ്കിൽ “പടയാളികളുടെ സംഘം” എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്ക് പദം ഒരു സൈനികഘടകത്തെ സൂചിപ്പിക്കാമെങ്കിലും, ആ ഘടകം മുഴുവനും അവിടെ ഉണ്ടായിരുന്നുവെന്ന് നിർബന്ധമില്ല.
    reason: lexical_alternative
  - marker: b
    text: “കാവൽക്കാർ” അല്ലെങ്കിൽ “ദേവാലയകാവൽക്കാർ” എന്നും വിവർത്തനം ചെയ്യാം. ഈ പദം യഹൂദ അധികാരികളുടെ കീഴിൽ സേവിച്ചിരുന്ന ഔദ്യോഗിക പരിചാരകരെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: അങ്ങനെ
  rationale: മുൻസന്ദർഭത്തിൽനിന്നുള്ള ആഖ്യാനത്തുടർച്ചയും പരിണതിയും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: λαβὼν
  choice: കൂട്ടിക്കൊണ്ട്
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള പങ്കാളിത്തക്രിയയുടെ ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും യൂദാസ് സംഘത്തെ കൂടെ കൊണ്ടുവന്നുവെന്ന അർഥം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: σπεῖραν
  choice: സൈനികദളം
  rationale: ഒരു സൈനികഘടകത്തെയോ അതിൽനിന്നുള്ള വിഭാഗത്തെയോ സൂചിപ്പിക്കുന്ന പദമാണ്; മുഴുവൻ റോമൻ കോഹോർട്ടും അവിടെ ഉണ്ടായിരുന്നുവെന്ന് നിർബന്ധമായി സൂചിപ്പിക്കാത്ത വിശാലമായ മലയാളപ്രയോഗം തെരഞ്ഞെടുത്തു.
- source_word: ὑπηρέτας
  choice: ഉദ്യോഗസ്ഥർ
  rationale: യഹൂദ അധികാരികളുടെ ഔദ്യോഗിക സേവകരെയോ കാവൽക്കാരെയോ സൂചിപ്പിക്കാൻ കഴിയുന്ന പൊതുവായ പദം; അവരുടെ കൃത്യമായ സ്ഥാപനപദവി അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: ἀρχιερέων
  choice: മഹാപുരോഹിതന്മാർ
  rationale: പ്രധാന പുരോഹിതാധികാരികളെ സൂചിപ്പിക്കുന്ന പതിവും വ്യക്തവുമായ മലയാളപ്രയോഗം.
- source_word: Φαρισαίων
  choice: പരീശന്മാർ
  rationale: സംഘനാമത്തിന്റെ മലയാളത്തിൽ സ്ഥിരപ്പെട്ട രൂപം.
- source_word: ἔρχεται
  choice: എത്തുന്നു
  rationale: യോഹന്നാന്റെ സജീവമായ ചരിത്രവർത്തമാനകാലം നിലനിർത്തുകയും ലക്ഷ്യസ്ഥാനത്തെത്തുന്നതിന്റെ സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: ἐκεῖ
  choice: അവിടെ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ സ്ഥലത്തേക്കുള്ള ലളിതമായ സ്ഥലസൂചന.
- source_word: φανῶν
  choice: റാന്തലുകൾ
  rationale: കൊണ്ടുനടക്കാവുന്ന അടച്ച വിളക്കുകളെ സൂചിപ്പിക്കുകയും λαμπάδων എന്ന അടുത്ത പദത്തിൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: λαμπάδων
  choice: തീപ്പന്തങ്ങൾ
  rationale: തുറന്ന ജ്വാലയുള്ള പന്തങ്ങളെ സൂചിപ്പിച്ച് φανῶν എന്നതിൽനിന്നുള്ള പദവ്യത്യാസം വ്യക്തമാക്കുന്നു.
- source_word: ὅπλων
  choice: ആയുധങ്ങൾ
  rationale: സായുധബലത്തിന്റെ ഉപകരണങ്ങളെ സൂചിപ്പിക്കുന്ന വ്യക്തവും പൊതുവുമായ ആധുനിക മലയാളപദം.
theological_decisions:
- issue: യേശുവിനെ പിടികൂടാൻ വന്ന സംഘത്തിന്റെ ഘടനയും വലുപ്പവും
  choice: സൈനികദളവും മഹാപുരോഹിതന്മാരുടെയും പരീശന്മാരുടെയും ഉദ്യോഗസ്ഥരും ഉൾപ്പെട്ട മിശ്രസംഘമായി വിവർത്തനം ചെയ്തു; കൃത്യമായ അംഗസംഖ്യ നിർണയിച്ചില്ല.
  alternative: “ഒരു കോഹോർട്ടും ദേവാലയകാവൽക്കാരും” എന്നിങ്ങനെ കൂടുതൽ സ്ഥാപനപരമായി നിർദിഷ്ടമാക്കുക.
  rationale: ഗ്രീക്ക് വാക്യം σπεῖραയെയും യഹൂദ അധികാരികളിൽനിന്നുള്ള ὑπηρέταιയെയും വേർതിരിച്ചുകാണിക്കുന്നു. എന്നാൽ മുഴുവൻ കോഹോർട്ടും എത്തിയിരുന്നുവെന്നോ ഉദ്യോഗസ്ഥർക്ക് കൃത്യമായി ‘ദേവാലയപോലീസ്’ എന്ന പദവിയുണ്ടായിരുന്നുവെന്നോ വാക്യം നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ ചരിത്രവർത്തമാനകാലം “എത്തുന്നു” എന്നു നിലനിർത്തി. “റാന്തലുകൾ/തീപ്പന്തങ്ങൾ” എന്ന ജോടിയിലൂടെ രണ്ടു വ്യത്യസ്ത പ്രകാശോപകരണങ്ങളുടെ പദവ്യത്യാസം സൂക്ഷിച്ചു.
