  terminology: “ഉദ്യോഗസ്ഥർ” is a viable context-sensitive rendering of ὑπηρέται, while footnote a responsibly preserves the broader possibilities of attendants or servants without overidentifying them. “മഹാപുരോഹിതൻ” is standard and accurate for ἀρχιερεύς. The main text’s general “അടിച്ച്” does not force an unsupported specification of the precise type of hand-blow; footnote b appropriately explains the lexical range of ῥάπισμα.
