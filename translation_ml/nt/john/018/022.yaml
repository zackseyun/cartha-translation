id: JHN.18.22
reference: John 18:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ταῦτα δὲ αὐτοῦ εἰπόντος εἷς ⸂παρεστηκὼς τῶν ὑπηρετῶν⸃ ἔδωκεν ῥάπισμα τῷ Ἰησοῦ εἰπών· Οὕτως ἀποκρίνῃ τῷ ἀρχιερεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/022.yaml
  text: And when he had said these things[a], one of the officers standing by struck Jesus, saying[b], “Is this how you answer the high priest?”
translation:
  language: ml
  text: അവൻ ഈ കാര്യങ്ങൾ പറഞ്ഞപ്പോൾ, അവിടെ നിന്നിരുന്ന ഉദ്യോഗസ്ഥരിൽ ഒരാൾ[a] യേശുവിനെ അടിച്ച്[b], “മഹാപുരോഹിതനോട് ഇങ്ങനെയാണോ മറുപടി പറയുന്നത്?” എന്നു ചോദിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഉദ്യോഗസ്ഥർ” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന പദത്തിന് “പരിചാരകർ” എന്നോ “സേവകർ” എന്നോ അർഥമാകാം; ഈ സന്ദർഭത്തിൽ മഹാപുരോഹിതന്റെ സംവിധാനത്തിലെ ഔദ്യോഗിക സേവകരെയാണ് ഉദ്ദേശിക്കുന്നതെന്നു തോന്നുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്ക് പ്രയോഗം കൈകൊണ്ടുള്ള ഒരു പ്രഹരത്തെ സൂചിപ്പിക്കുന്നു; ഇത് ഒരു കരണത്തടിയോ അതുപോലുള്ള മറ്റൊരു അടിയോ ആയിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: ഈ കാര്യങ്ങൾ
  rationale: ബഹുവചനമായ ഗ്രീക്ക് പ്രയോഗം നിലനിർത്തുകയും യേശു തൊട്ടുമുമ്പ് പറഞ്ഞ വാക്കുകളെ സ്വാഭാവികമായി സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: αὐτοῦ εἰπόντος
  choice: അവൻ ... പറഞ്ഞപ്പോൾ
  rationale: മുൻപു നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന genitive absolute മലയാളത്തിൽ സ്വാഭാവികമായ കാലവാക്യമായി നൽകി.
- source_word: εἷς παρεστηκὼς τῶν ὑπηρετῶν
  choice: അവിടെ നിന്നിരുന്ന ഉദ്യോഗസ്ഥരിൽ ഒരാൾ
  rationale: παρεστηκώς സന്നിഹിതനായി നിന്നിരുന്നതിനെ സൂചിപ്പിക്കുന്നു; ὑπηρέτης ഈ വിചാരണാസന്ദർഭത്തിൽ ഔദ്യോഗികമായി സേവിച്ചിരുന്ന കീഴുദ്യോഗസ്ഥനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഉദ്യോഗസ്ഥർ’ എന്നു നൽകി, പദത്തിന്റെ വിശാല അർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: ἔδωκεν ῥάπισμα
  choice: യേശുവിനെ അടിച്ച്
  rationale: കൈകൊണ്ടുള്ള ഒരു പ്രഹരം അഥവാ അടി എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു; അത് കൃത്യമായി ഏതു തരത്തിലുള്ള അടിയായിരുന്നു എന്നു മുഖ്യപാഠത്തിൽ അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: Οὕτως ἀποκρίνῃ τῷ ἀρχιερεῖ
  choice: മഹാപുരോഹിതനോട് ഇങ്ങനെയാണോ മറുപടി പറയുന്നത്?
  rationale: οὕτως സൂചിപ്പിക്കുന്ന രീതിയെയും ശാസനയുടെ ചോദ്യഭാവത്തെയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ὑπηρετῶν എന്ന പദം സൂചിപ്പിക്കുന്നവരുടെ തിരിച്ചറിയൽ
  choice: മഹാപുരോഹിതന്റെ സംവിധാനത്തിൽ ഔദ്യോഗികമായി സേവിച്ചിരുന്ന ഉദ്യോഗസ്ഥർ
  alternative: പരിചാരകർ, സേവകർ, കാവൽക്കാർ
  rationale: യോഹന്നാനിലെ വിചാരണാസന്ദർഭം ഔദ്യോഗിക സേവകരെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, ഗ്രീക്ക് പദം തന്നെ അവരുടെ കൃത്യമായ പദവിയോ ക്ഷേത്രകാവൽസേനയുമായുള്ള ബന്ധമോ നിർണ്ണയിക്കുന്നില്ല. അതിനാൽ മുഖ്യപാഠത്തിൽ വിശാലമായ ഔദ്യോഗിക പദം ഉപയോഗിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘മഹാപുരോഹിതൻ’ എന്നത് പരിചിതമായ ബൈബിൾപദമായി നിലനിർത്തി. ചോദ്യം ശാസനയുടെ സ്വരം സൂക്ഷിക്കുന്ന വിധത്തിൽ സ്വാഭാവികമായി രൂപപ്പെടുത്തി.
