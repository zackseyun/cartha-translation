revisions:
- from: 'യേശു മറുപടി പറഞ്ഞു: “ഞാൻ തന്നെയാണെന്ന് നിങ്ങളോടു പറഞ്ഞല്ലോ.[a] അതുകൊണ്ട്, നിങ്ങൾ എന്നെയാണ് അന്വേഷിക്കുന്നതെങ്കിൽ, ഇവരെ പോകാൻ അനുവദിക്കുക.”'
  to: 'യേശു മറുപടി പറഞ്ഞു: “ഞാനാണെന്ന് നിങ്ങളോടു പറഞ്ഞല്ലോ.[a] അതുകൊണ്ട്, നിങ്ങൾ എന്നെയാണ് അന്വേഷിക്കുന്നതെങ്കിൽ, ഇവരെ പോകാൻ അനുവദിക്കുക.”'
  rationale: The revision removes the unsupported intensifier ‘തന്നെ’ while retaining the contextual identification sense of ἐγώ εἰμι. The revised footnote accurately identifies the grammatical ambiguity of the Greek and preserves the alternative bare rendering without imposing a theological interpretation.
