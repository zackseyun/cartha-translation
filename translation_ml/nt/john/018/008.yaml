id: JHN.18.8
reference: John 18:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Εἶπον ὑμῖν ὅτι ἐγώ εἰμι· εἰ οὖν ἐμὲ ζητεῖτε, ἄφετε τούτους ὑπάγειν·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/008.yaml
  text: Jesus answered[a], “I told you that I am he. So if you are seeking me, let these men go.”
translation:
  language: ml
  text: 'യേശു മറുപടി പറഞ്ഞു: “ഞാനാണെന്ന് നിങ്ങളോടു പറഞ്ഞല്ലോ.[a] അതുകൊണ്ട്, നിങ്ങൾ എന്നെയാണ് അന്വേഷിക്കുന്നതെങ്കിൽ, ഇവരെ പോകാൻ അനുവദിക്കുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ ആകുന്നു.” ഗ്രീക്കിൽ തിരിച്ചറിയിക്കുന്ന വിധേയപദം നൽകിയിട്ടില്ല; സന്ദർഭം വ്യക്തമാക്കാൻ മലയാളത്തിൽ ‘ഞാനാണ്’ എന്നു വിവർത്തനം ചെയ്തിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: മറുപടി പറഞ്ഞു
  rationale: സംഭാഷണസന്ദർഭത്തിൽ ἀποκρίνομαι എന്നതിന് സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: Εἶπον ὑμῖν
  choice: നിങ്ങളോടു പറഞ്ഞല്ലോ
  rationale: മുമ്പ് പറഞ്ഞ കാര്യം ഓർമിപ്പിക്കുന്ന ഭാവം ‘-ല്ലോ’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ὑμῖν എന്നതും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἐγώ εἰμι
  choice: ഞാൻ തന്നെയാണ്
  rationale: അറസ്റ്റുചെയ്യാൻ വന്നവർ അന്വേഷിക്കുന്ന വ്യക്തി താനാണെന്ന് യേശു തിരിച്ചറിയിക്കുന്നതാണ് ഉടനെയുള്ള സന്ദർഭം. അതേസമയം, ഗ്രീക്കിലെ വിധേയപദമില്ലാത്ത രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ζητεῖτε
  choice: അന്വേഷിക്കുന്നതെങ്കിൽ
  rationale: ഈ നേരിട്ടുള്ള ഏറ്റുമുട്ടലിൽ ആരെയാണ് തിരയുന്നത് എന്ന അർഥം നൽകുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: ἄφετε
  choice: അനുവദിക്കുക
  rationale: ഇവിടെ ἀφίημι എന്നത് പോകാൻ സമ്മതിക്കുക എന്ന അർഥത്തിലാണ്; ‘വിട്ടയയ്ക്കുക’ എന്നു പറഞ്ഞാൽ കസ്റ്റഡിയിലുള്ളവരെ മോചിപ്പിക്കുന്ന അർഥം അനാവശ്യമായി ശക്തമാകാം.
- source_word: τούτους
  choice: ഇവരെ
  rationale: യേശുവിനൊപ്പമുള്ളവരെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സർവനാമരൂപം മാത്രം സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: ὑπάγειν
  choice: പോകാൻ
  rationale: ἄφετε എന്ന ക്രിയയോടൊപ്പം അനുവദിക്കപ്പെടുന്ന പുറപ്പെടൽ ലളിതമായും കൃത്യമായും അറിയിക്കുന്നു.
theological_decisions:
- issue: യോഹന്നാന്റെ സന്ദർഭത്തിലെ ἐγώ εἰμι എന്ന പ്രയോഗം
  choice: ഞാൻ തന്നെയാണ്
  alternative: ഞാൻ ആകുന്നു
  rationale: ഉടനെയുള്ള സന്ദർഭത്തിൽ ഇത് യേശുവിന്റെ വ്യക്തിത്വം തിരിച്ചറിയിക്കുന്ന മറുപടിയാണ്; അതിനാൽ പ്രധാനപാഠത്തിൽ സ്വാഭാവികമായ മലയാളം ഉപയോഗിച്ചു. എന്നാൽ യോഹന്നാനിലെ നിരപേക്ഷമായ ἐγώ εἰμι പ്രയോഗത്തിനുണ്ടാകാവുന്ന ദൈവശാസ്ത്രപരമായ പ്രതിധ്വനി നഷ്ടപ്പെടാതിരിക്കാൻ പദാനുപദരൂപം അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സംഭാഷണശൈലി. ‘പറഞ്ഞല്ലോ’ മുൻവാക്യത്തെ ഓർമിപ്പിക്കുന്ന ഭാവം നൽകുന്നു; ‘അനുവദിക്കുക’ കല്പനയുടെ ഗൗരവം നിലനിർത്തുന്നു.
