  revised_text: 'അപ്പോൾ പീലാത്തോസ് അവനോട് ചോദിച്ചു: “അങ്ങനെയെങ്കിൽ നീ ഒരു രാജാവാണോ?” യേശു മറുപടി പറഞ്ഞു: “ഞാൻ ഒരു രാജാവാണെന്ന് നീ പറയുന്നു.[a] ഇതിനായിട്ടാണ് ഞാൻ ജനിച്ചിരിക്കുന്നത്; ഇതിനായിട്ടാണ് ഞാൻ ലോകത്തിലേക്കു വന്നിരിക്കുന്നത്: സത്യത്തിനു സാക്ഷ്യം വഹിക്കാൻ. സത്യത്തിൽനിന്നുള്ള എല്ലാവരും എന്റെ ശബ്ദം കേൾക്കുന്നു.”'
