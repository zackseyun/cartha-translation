revisions:
- from: 'അപ്പോൾ പീലാത്തോസ് അവനോട് ചോദിച്ചു: “അങ്ങനെയെങ്കിൽ നീ ഒരു രാജാവാണോ?” യേശു മറുപടി പറഞ്ഞു: “ഞാൻ ഒരു രാജാവാണെന്ന് നീ പറയുന്നു.[a] ഇതിനായിട്ടാണ് ഞാൻ ജനിച്ചിരിക്കുന്നത്; ഇതിനായിട്ടാണ് ഞാൻ ലോകത്തിലേക്കു വന്നിരിക്കുന്നതും—സത്യത്തിനു സാക്ഷ്യം വഹിക്കാൻ. സത്യത്തിൽനിന്നുള്ള ഏവനും എന്റെ ശബ്ദം കേൾക്കുന്നു.”'
  to: 'അപ്പോൾ പീലാത്തോസ് അവനോട് ചോദിച്ചു: “അങ്ങനെയെങ്കിൽ നീ ഒരു രാജാവാണോ?” യേശു മറുപടി പറഞ്ഞു: “ഞാൻ ഒരു രാജാവാണെന്ന് നീ പറയുന്നു.[a] ഇതിനായിട്ടാണ് ഞാൻ ജനിച്ചിരിക്കുന്നത്; ഇതിനായിട്ടാണ് ഞാൻ ലോകത്തിലേക്കു വന്നിരിക്കുന്നത്: സത്യത്തിനു സാക്ഷ്യം വഹിക്കാൻ. സത്യത്തിൽനിന്നുള്ള എല്ലാവരും എന്റെ ശബ്ദം കേൾക്കുന്നു.”'
  rationale: തിരുത്തൽ അർഥപരമായ മാറ്റമല്ല. യേശുവിന്റെ ജനനവും ലോകത്തിലേക്കുള്ള വരവും എന്ന രണ്ടു വേർതിരിച്ച പ്രസ്താവനകളും അവയുടെ പൊതുവായ ഉദ്ദേശ്യമായ സത്യത്തിനു സാക്ഷ്യം വഹിക്കലും മലയാളത്തിൽ കൂടുതൽ വ്യക്തമായി ഘടിപ്പിച്ചു. അവസാന വാക്യത്തിലെ ἐκ-ബന്ധം നിലനിർത്തിക്കൊണ്ട് പ്രയോഗം സ്വാഭാവികമാക്കി. അടിക്കുറിപ്പിന്റെ അടയാളവും ഉള്ളടക്കവും യോജിച്ച സ്ഥാനത്തും ആവശ്യമായ ദ്വയാർഥസംരക്ഷണത്തോടെയും നിലനിൽക്കുന്നു.
