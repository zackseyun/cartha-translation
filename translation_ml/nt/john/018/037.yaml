reference: John 18:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτῷ ὁ Πιλᾶτος· Οὐκοῦν βασιλεὺς εἶ σύ; ἀπεκρίθη ⸀ὁ Ἰησοῦς· Σὺ λέγεις ὅτι βασιλεύς ⸀εἰμι. ἐγὼ εἰς τοῦτο γεγέννημαι καὶ εἰς τοῦτο ἐλήλυθα εἰς τὸν κόσμον ἵνα μαρτυρήσω τῇ ἀληθείᾳ· πᾶς ὁ ὢν ἐκ τῆς ἀληθείας ἀκούει μου τῆς φωνῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/037.yaml
  text: 'Then Pilate said to him[a], “So then, are you a king?” Jesus answered, “You say that I am a king. For this I have been born, and for this I have come into the world: that I should bear witness to the truth. Everyone who is of the truth listens to my voice.”'
translation:
  language: ml
  text: 'അപ്പോൾ പീലാത്തോസ് അവനോട് ചോദിച്ചു: “അങ്ങനെയെങ്കിൽ നീ ഒരു രാജാവാണോ?” യേശു മറുപടി പറഞ്ഞു: “ഞാൻ ഒരു രാജാവാണെന്ന് നീ പറയുന്നു.[a] ഇതിനായിട്ടാണ് ഞാൻ ജനിച്ചിരിക്കുന്നത്; ഇതിനായിട്ടാണ് ഞാൻ ലോകത്തിലേക്കു വന്നിരിക്കുന്നത്: സത്യത്തിനു സാക്ഷ്യം വഹിക്കാൻ. സത്യത്തിൽനിന്നുള്ള എല്ലാവരും എന്റെ ശബ്ദം കേൾക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“നീ അങ്ങനെ പറയുന്നു: ഞാൻ ഒരു രാജാവാണ്” എന്നോ “ഞാൻ ഒരു രാജാവാണെന്ന് നീ പറഞ്ഞത് ശരിയാണ്” എന്നോ പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പ്രയോഗം സംക്ഷിപ്തമാണ്; യോഗ്യതപ്പെടുത്തിയ ഒരു സമ്മതമായി അതിനെ മനസ്സിലാക്കാം.'
    reason: യേശുവിന്റെ മറുപടിയിലെ യഥാർഥമായ അർഥസാധ്യതയും ഭാവവ്യത്യാസവും സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: Οὐκοῦν
  choice: അങ്ങനെയെങ്കിൽ
  rationale: മുൻസംഭാഷണത്തിൽനിന്ന് പീലാത്തോസ് എത്തിച്ചേരുന്ന നിഗമനത്തിന്റെ സൂചന സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: βασιλεὺς
  choice: ഒരു രാജാവ്
  rationale: റോമൻ വിചാരണയുടെ രാഷ്ട്രീയ പശ്ചാത്തലവും മശീഹാസംബന്ധമായ സൂചനകളും വിശദീകരിച്ചുതീർക്കാതെ നിലനിർത്തുന്ന സാധാരണ അർഥം.
- source_word: Σὺ λέγεις ὅτι βασιλεύς εἰμι
  choice: ഞാൻ ഒരു രാജാവാണെന്ന് നീ പറയുന്നു
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തവും അർഥസാധ്യതയുള്ളതുമായ മറുപടി ശക്തമായ സമ്മതമോ അകലംപാലിക്കുന്ന നിഷേധമോ ആയി തീർപ്പാക്കാതെ അടുത്തുനിൽക്കുന്നു.
- source_word: γεγέννημαι
  choice: ഞാൻ ജനിച്ചിരിക്കുന്നു
  rationale: പൂർണ്ണകാലത്തിന്റെ ഇപ്പോഴത്തെ പ്രസക്തി സൂചിപ്പിക്കുകയും ഈ സന്ദർഭം ആവശ്യപ്പെടാത്ത സിദ്ധാന്തപരമായ അർഥങ്ങൾ ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐλήλυθα εἰς τὸν κόσμον
  choice: ഞാൻ ലോകത്തിലേക്കു വന്നിരിക്കുന്നു
  rationale: പൂർണ്ണകാലത്തിന്റെ നിലനിൽക്കുന്ന പ്രസക്തിയും യോഹന്നാനിലെ ദൗത്യ-ഉത്ഭവ സൂചനകളും സംരക്ഷിക്കുന്നു.
- source_word: μαρτυρήσω τῇ ἀληθείᾳ
  choice: സത്യത്തിനു സാക്ഷ്യം വഹിക്കാൻ
  rationale: ἵνα ഘടനയിലെ ഉദ്ദേശ്യം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും യോഹന്നാനിലെ നിയമപരമായ സാക്ഷ്യഭാഷ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: πᾶς ὁ ὢν ἐκ τῆς ἀληθείας
  choice: സത്യത്തിൽനിന്നുള്ള ഏവനും
  rationale: ἐκ എന്നതിലെ ഉറവിടമോ ബന്ധമോ സൂചിപ്പിക്കുന്ന ഭാഷയെ ‘സത്യത്തിന്റേതായ’ എന്ന വ്യാഖ്യാനപരമായ പരിഹാരത്തിലേക്ക് മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: ἀκούει μου τῆς φωνῆς
  choice: എന്റെ ശബ്ദം കേൾക്കുന്നു
  rationale: ἀκούω എന്നതിന്റെ നേരിട്ടുള്ള അർഥവും ഇടയന്റെ ശബ്ദത്തെക്കുറിച്ചുള്ള യോഹന്നാനീയ പ്രതിധ്വനിയും നിലനിർത്തുന്നു; മലയാളത്തിൽ സന്ദർഭാനുസരണം അനുസരണയോടെയുള്ള കേൾവിയും ഇതിന് സൂചിപ്പിക്കാം.
theological_decisions:
- issue: പീലാത്തോസിനോടുള്ള യേശുവിന്റെ മറുപടിയുടെ ഭാവം (Σὺ λέγεις ὅτι βασιλεύς εἰμι)
  choice: “ഞാൻ ഒരു രാജാവാണെന്ന് നീ പറയുന്നു” എന്ന സുതാര്യവും യോഗ്യതപ്പെടുത്തിയ സമ്മതത്തിന് ഇടനൽകുന്നതുമായ രൂപം
  alternative: '“നീ പറഞ്ഞത് ശരിയാണ്: ഞാൻ രാജാവാണ്” എന്ന ശക്തമായ സമ്മതം; അല്ലെങ്കിൽ “അത് നിന്റെ വാക്കാണ്” എന്ന അകലംപാലിക്കുന്ന മറുപടി'
  rationale: ഗ്രീക്ക് വാചകം സമ്മതത്തിന്റെ അളവ് കൃത്യമായി നിർണയിക്കുന്നില്ല. അതിനാൽ പ്രധാനപാഠം ആ ദ്വയാർഥസാധ്യത സംരക്ഷിക്കുകയും മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ അറിയിക്കുകയും ചെയ്യുന്നു.
- issue: “ജനിച്ചിരിക്കുന്നു” എന്നും “ലോകത്തിലേക്കു വന്നിരിക്കുന്നു” എന്നും ഉള്ള ദൗത്യഭാഷ
  choice: രണ്ടു പ്രസ്താവനകളും വേർതിരിച്ചു നിലനിർത്തുന്നു
  alternative: ഇരുവരെയും ഒരൊറ്റ ദൗത്യപ്രസ്താവനയായി പരാവർത്തനം ചെയ്യുക
  rationale: യോഹന്നാൻ യേശുവിന്റെ ജനനത്തെയും ലോകത്തിലേക്കുള്ള വരവിനെയും വ്യത്യസ്തമായി പറയുന്നു. അവതാരസംബന്ധമായ സാധ്യത വിശദീകരിച്ചു ചേർക്കാതെ വാചകത്തിലെ വ്യത്യാസം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യം. വിചാരണാസന്ദർഭത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു; അതേസമയം അതിപുരാതനമായ പദപ്രയോഗങ്ങളും അനാവശ്യമായ സിദ്ധാന്തപരമായ വിശദീകരണങ്ങളും ഒഴിവാക്കുന്നു. പ്രധാനപാഠത്തിലെ [a] അടയാളം ബന്ധപ്പെട്ട ദ്വയാർഥവാക്യത്തിനു പിന്നാലെ തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
