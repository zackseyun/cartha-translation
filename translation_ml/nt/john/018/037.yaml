  revision_rationale: തിരുത്തൽ അർഥപരമായ മാറ്റമല്ല. യേശുവിന്റെ ജനനവും ലോകത്തിലേക്കുള്ള വരവും എന്ന രണ്ടു വേർതിരിച്ച പ്രസ്താവനകളും അവയുടെ പൊതുവായ ഉദ്ദേശ്യമായ സത്യത്തിനു സാക്ഷ്യം വഹിക്കലും മലയാളത്തിൽ കൂടുതൽ വ്യക്തമായി ഘടിപ്പിച്ചു. അവസാന വാക്യത്തിലെ ἐκ-ബന്ധം നിലനിർത്തിക്കൊണ്ട് പ്രയോഗം സ്വാഭാവികമാക്കി. അടിക്കുറിപ്പിന്റെ അടയാളവും ഉള്ളടക്കവും യോജിച്ച സ്ഥാനത്തും ആവശ്യമായ ദ്വയാർഥസംരക്ഷണത്തോടെയും നിലനിൽക്കുന്നു.
