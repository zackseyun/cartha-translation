  source_fidelity: പ്രധാന അർഥവും വാക്യക്രമവും ഗ്രീക്കിനോട് വിശ്വസ്തമാണ്. Οὐκοῦν-ന്റെ നിഗമനഭാവം, βασιλεύς-ന്റെ രാഷ്ട്രീയസൂചന, യേശുവിന്റെ മറുപടിയിലെ മനഃപൂർവം തീർപ്പാക്കാത്ത ഭാവം, ജനനം/ലോകത്തിലേക്കുള്ള വരവ് എന്ന ഇരട്ടപ്രസ്താവന, സത്യത്തോടുള്ള സാക്ഷ്യം, ‘സത്യത്തിൽനിന്ന്’ എന്ന ἐκ-ബന്ധം എന്നിവ സംരക്ഷിച്ചിട്ടുണ്ട്.
