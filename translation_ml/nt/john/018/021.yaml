source:
  edition: SBLGNT
  text: τί με ⸂ἐρωτᾷς; ἐρώτησον⸃ τοὺς ἀκηκοότας τί ἐλάλησα αὐτοῖς· ἴδε οὗτοι οἴδασιν ἃ εἶπον ἐγώ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/021.yaml
  text: Why do you question me? Question those who have heard what I said to them. Look[a], they know what I said.
translation:
  language: ml
  text: “നീ എന്നെ ചോദ്യംചെയ്യുന്നത് എന്തിന്?[a] ഞാൻ അവരോടു പറഞ്ഞതു കേട്ടവരോടു ചോദിക്കൂ. നോക്കൂ, ഞാൻ പറഞ്ഞത് ഇവർക്കറിയാം.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നീ എന്നോടു ചോദിക്കുന്നത് എന്തിന്?’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് ക്രിയയ്ക്ക് സാധാരണയായി ‘ചോദിക്കുക’ എന്നർഥവും വരാം; ഇവിടെ നടക്കുന്ന ഔദ്യോഗിക വിചാരണയുടെ പശ്ചാത്തലം കണക്കിലെടുത്താണ് ‘ചോദ്യംചെയ്യുക’ എന്നു നൽകിയിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί με ἐρωτᾷς
  choice: നീ എന്നെ ചോദ്യംചെയ്യുന്നത് എന്തിന്?
  rationale: τίയും വർത്തമാനകാലരൂപമായ ἐρωτᾷςഉം ചേർന്ന് നേരിട്ടുള്ള വെല്ലുവിളി പ്രകടമാക്കുന്നു. മഹാപുരോഹിതന്റെ മുമ്പിലുള്ള ഔദ്യോഗിക വിചാരണാസന്ദർഭത്തിൽ ‘ചോദ്യംചെയ്യുക’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: ἐρώτησον
  choice: ചോദിക്കൂ
  rationale: ഏകകാലികമായ നേരിട്ടുള്ള പ്രവർത്തനത്തിനുള്ള ആജ്ഞയെ ഈ രൂപം വ്യക്തമാക്കുന്നു. മലയാളത്തിൽ ‘കേട്ടവരോടു ചോദിക്കൂ’ എന്നത് സ്വാഭാവികമാണ്; ‘അവരെ ചോദ്യംചെയ്യൂ’ എന്നു പറഞ്ഞാൽ ഗ്രീക്കിലുള്ളതിനെക്കാൾ ശക്തമായ ഔദ്യോഗിക പരിശോധനാഭാവം വരാം.
- source_word: τοὺς ἀκηκοότας
  choice: കേട്ടവരോട്
  rationale: പൂർണ്ണകാല കൃദന്തരൂപം യേശുവിന്റെ വാക്കുകൾ കേട്ടിട്ടുള്ള ആളുകളെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ കർമം തുടർന്നുവരുന്നതിനാൽ മലയാളത്തിൽ സംക്ഷിപ്തമായ ഈ രൂപം വ്യക്തമാണ്.
- source_word: τί ἐλάλησα αὐτοῖς
  choice: ഞാൻ അവരോടു എന്തു പറഞ്ഞുവെന്ന്
  rationale: λαλέω ഇവിടെ സാധാരണയായി ‘പറയുക/സംസാരിക്കുക’ എന്നർഥം നൽകുന്നു. ‘എന്തു പറഞ്ഞുവെന്ന്’ ഉള്ളടക്കചോദ്യത്തെ സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി അറിയിക്കുന്നു.
- source_word: ἴδε
  choice: നോക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ἴδε എന്ന പ്രയോഗത്തിന് ആധുനിക മലയാളത്തിലെ നേരിട്ടും മാന്യവുമായ തുല്യപ്രയോഗമാണിത്.
- source_word: οὗτοι οἴδασιν
  choice: ഇവർക്കറിയാം
  rationale: οὗτοιയുടെ ചൂണ്ടിക്കാട്ടുന്ന ഊന്നൽ ‘ഇവർ’ നിലനിർത്തുന്നു; οἴδασιν ഇവിടെ ഉറപ്പുള്ള അറിവിനെ സൂചിപ്പിക്കുന്നു.
- source_word: ἃ εἶπον ἐγώ
  choice: ഞാൻ പറഞ്ഞത് എന്താണെന്ന്
  rationale: ἃ എന്നത് പറഞ്ഞ കാര്യങ്ങളുടെ ഉള്ളടക്കത്തെ സൂചിപ്പിക്കുന്നു. വ്യക്തമായി നൽകിയിരിക്കുന്ന ἐγώയുടെ ഊന്നൽ ‘ഞാൻ’ നിലനിർത്തുന്നു.
theological_decisions:
- issue: മഹാപുരോഹിതന്റെ മുമ്പിലുള്ള യേശുവിന്റെ മറുപടിയുടെ വിചാരണാസ്വരം
  choice: ആദ്യത്തെ ἐρωτάωയ്ക്ക് ‘ചോദ്യംചെയ്യുക’ എന്നും ആജ്ഞാരൂപത്തിന് സ്വാഭാവികമായ ‘ചോദിക്കൂ’ എന്നും നൽകുക.
  alternative: രണ്ടിടത്തും ‘ചോദിക്കുക’ ഉപയോഗിക്കുക, അല്ലെങ്കിൽ രണ്ടിടത്തും ‘ചോദ്യംചെയ്യുക’ ഉപയോഗിക്കുക.
  rationale: ആദ്യപ്രയോഗത്തിൽ ഔദ്യോഗിക വിചാരണാസന്ദർഭം വ്യക്തമാക്കേണ്ടതുണ്ട്. എന്നാൽ രണ്ടാമത്തെ പ്രയോഗത്തിൽ ‘കേട്ടവരോടു ചോദിക്കൂ’ എന്നതാണ് സ്വാഭാവിക മലയാളം; ‘ചോദ്യംചെയ്യൂ’ ഗ്രീക്കിനേക്കാൾ കടുത്ത നിയമനടപടിയുടെ ഭാവം സൃഷ്ടിച്ചേക്കാം. ഈ വ്യത്യാസം അർഥം മൃദൂകരിക്കുകയോ പ്രത്യേക സിദ്ധാന്തവായന ചേർക്കുകയോ ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ നേരിട്ടും ഗൗരവമുള്ളതുമായ സംഭാഷണശൈലി സ്വീകരിച്ചു. ‘ഇവർ’ എന്ന ചൂണ്ടിക്കാട്ടൽ നിലനിർത്തിയിട്ടുണ്ട്; പഴഞ്ചൻ പ്രയോഗങ്ങളും അനാവശ്യമായി കടുപ്പമുള്ള നിയമഭാഷയും ഒഴിവാക്കി.
