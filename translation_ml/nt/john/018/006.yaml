id: JHN.18.6
reference: John 18:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὡς οὖν εἶπεν ⸀αὐτοῖς· Ἐγώ εἰμι, ἀπῆλθον εἰς τὰ ὀπίσω καὶ ἔπεσαν χαμαί.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/006.yaml
  text: So when he said to them[a], “I am he,” they went backward and fell to the ground.
translation:
  language: ml
  text: അങ്ങനെ, “ഞാൻ തന്നെയാണ്”[a] എന്ന് അവൻ അവരോടു പറഞ്ഞപ്പോൾ, അവർ പിന്നോട്ടു പോയി നിലത്തു വീണു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, “ഞാൻ ആകുന്നു.” ഈ ഗ്രീക്ക് പ്രയോഗം യോഹന്നാനിലെ സവിശേഷമായ “ഞാൻ ആകുന്നു” വചനങ്ങളെയും പ്രതിധ്വനിപ്പിച്ചേക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς οὖν
  choice: അങ്ങനെ ... പറഞ്ഞപ്പോൾ
  rationale: ὡς എന്നതിന്റെ കാലസൂചനയും οὖν എന്നതിന്റെ വിവരണബന്ധവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഒരുമിച്ചു നൽകുന്നു.
- source_word: εἶπεν αὐτοῖς
  choice: അവൻ അവരോടു പറഞ്ഞപ്പോൾ
  rationale: λέγωയും ദാതിവ് αὐτοῖςഉം നേരിട്ടും സ്വാഭാവികമായും പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: Ἐγώ εἰμι
  choice: ഞാൻ തന്നെയാണ്
  rationale: അവർ അന്വേഷിക്കുന്ന വ്യക്തി താനാണെന്ന സന്ദർഭോചിതമായ സ്വയംതിരിച്ചറിയിക്കൽ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; അതേസമയം ‘ഞാൻ ആകുന്നു’ എന്ന അക്ഷരാർഥവും യോഹന്നാനിലെ സാധ്യതയുള്ള പ്രതിധ്വനിയും അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἀπῆλθον εἰς τὰ ὀπίσω
  choice: അവർ പിന്നോട്ടു നീങ്ങി
  rationale: പിന്നിലേക്കുള്ള യഥാർഥ ചലനം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം അനാവശ്യ വ്യാഖ്യാനം ചേർക്കാതെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἔπεσαν χαμαί
  choice: നിലത്തുവീണു
  rationale: χαμαί സൂചിപ്പിക്കുന്ന നിലത്തേക്കുള്ള വീഴ്ച സംക്ഷിപ്തവും വ്യക്തവുമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: യോഹന്നാനിലെ സാധ്യതയുള്ള ദൈവശാസ്ത്രപരമായ പ്രതിധ്വനിയോടുകൂടിയ Ἐγώ εἰμιയുടെ വിവർത്തനം
  choice: പ്രധാനപാഠത്തിൽ ‘ഞാൻ തന്നെയാണ്’; അടിക്കുറിപ്പിൽ ‘ഞാൻ ആകുന്നു’
  alternative: പ്രധാനപാഠത്തിൽ ‘ഞാൻ ആകുന്നു’
  rationale: ഉടൻ വരുന്ന സന്ദർഭത്തിൽ ഇത് നേരിട്ടുള്ള സ്വയംതിരിച്ചറിയിക്കലാണ്. എന്നാൽ ἐγώ εἰμι എന്ന അക്ഷരരൂപത്തിനും യോഹന്നാനിലെ പ്രത്യേക ‘ഞാൻ ആകുന്നു’ വചനങ്ങളുമായുള്ള സാധ്യതയുള്ള ബന്ധത്തിനും അടിക്കുറിപ്പിലൂടെ ഇടം നൽകുന്നത് അർഥതലങ്ങളിലെ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പിന്നോട്ടു നീങ്ങി’ എന്നത് മൂലത്തിലെ ദിശാസൂചന നിലനിർത്തുന്നു; ‘ഞാൻ തന്നെയാണ്’ സാധാരണ വായനക്കാരന് സന്ദർഭം വ്യക്തമാക്കുമ്പോൾ അടിക്കുറിപ്പ് അക്ഷരാർഥവും ദൈവശാസ്ത്രപരമായ സാധ്യതയും സംരക്ഷിക്കുന്നു.
