source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος εἱστήκει πρὸς τῇ θύρᾳ ἔξω. ἐξῆλθεν οὖν ὁ μαθητὴς ὁ ἄλλος ⸀ὁ γνωστὸς ⸂τοῦ ἀρχιερέως⸃ καὶ εἶπεν τῇ θυρωρῷ καὶ εἰσήγαγεν τὸν Πέτρον.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/016.yaml
  text: But Peter was standing outside at the door[a]. So the other disciple, who was known to the high priest[b], went out and spoke to the doorkeeper and brought Peter in.
translation:
  language: ml
  text: എന്നാൽ പത്രോസ് പുറത്തു, വാതിലിനരികെ നിൽക്കുകയായിരുന്നു. അപ്പോൾ മഹാപുരോഹിതന് പരിചിതനായിരുന്ന മറ്റേ ശിഷ്യൻ[a] പുറത്തുചെന്ന് വാതിൽകാവൽക്കാരിയോടു[b] സംസാരിച്ചു പത്രോസിനെ അകത്തേക്കു കൊണ്ടുവന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മഹാപുരോഹിതന്റെ പരിചയക്കാരനായിരുന്ന മറ്റേ ശിഷ്യൻ.’ അവരുടെ ബന്ധം എത്രത്തോളം അടുത്തതായിരുന്നുവെന്ന് ഗ്രീക്ക് പദം വ്യക്തമാക്കുന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘കവാടപാലകയോടു.’ പ്രവേശനസ്ഥാനത്ത് ചുമതലയേറ്റിരുന്ന സ്ത്രീയെയാണ് ഗ്രീക്ക് പദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἱστήκει
  choice: നിൽക്കുകയായിരുന്നു
  rationale: ക്രിയാരൂപം പത്രോസ് പുറത്തു തുടർന്നുനിന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ തുടരുന്ന നില സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: πρὸς τῇ θύρᾳ ἔξω
  choice: വാതിലിനരികെ പുറത്തു
  rationale: പ്രവേശനസ്ഥാനത്തോടുള്ള സമീപ്യവും പുറത്തായിരുന്നുവെന്ന വിവരവും ഒരുപോലെ നിലനിർത്തുന്നു.
- source_word: ὁ μαθητὴς ὁ ἄλλος
  choice: മറ്റേ ശിഷ്യൻ
  rationale: യോഹന്നാന്റെ സുവിശേഷത്തിലെ μαθητής എന്ന ബന്ധപരവും മതപരവുമായ പദത്തിന് പതിവും സ്വാഭാവികവുമായ തർജമ.
- source_word: ὁ γνωστὸς τοῦ ἀρχιερέως
  choice: മഹാപുരോഹിതന് പരിചിതനായിരുന്ന
  rationale: γνωστός സൂചിപ്പിക്കുന്ന ബന്ധത്തിന്റെ കൃത്യമായ അടുപ്പം നിർണയിക്കാതെ, ആ ശിഷ്യനെ മഹാപുരോഹിതൻ അറിഞ്ഞിരുന്നു എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀρχιερεύς
  choice: മഹാപുരോഹിതൻ
  rationale: യഹൂദ മഹാപുരോഹിതപദവിക്കുള്ള പ്രചാരത്തിലുള്ള കൃത്യമായ മലയാളപദം.
- source_word: θυρωρῷ
  choice: വാതിൽകാവൽക്കാരിയോട്
  rationale: പ്രവേശനകവാടത്തിൽ കാവൽനിന്ന വ്യക്തിയെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ഗ്രീക്കിലെ സ്ത്രീലിംഗ നിർദേശം മലയാളത്തിലും വ്യക്തമാക്കുന്നു.
- source_word: εἶπεν τῇ θυρωρῷ
  choice: വാതിൽകാവൽക്കാരിയോടു സംസാരിച്ചു
  rationale: നേരിട്ടുള്ള ഉദ്ധരണി ഇല്ലാത്തതിനാൽ ‘സംസാരിച്ചു’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികവും അർത്ഥസൂക്ഷ്മത നിലനിർത്തുന്നതുമാണ്.
- source_word: εἰσήγαγεν τὸν Πέτρον
  choice: പത്രോസിനെ അകത്തേക്കു കൊണ്ടുവന്നു
  rationale: εἰσάγω എന്ന ക്രിയയുടെ ‘അകത്തേക്കു കൊണ്ടുവരുക’ എന്ന അടിസ്ഥാനചലനം വ്യക്തമായി നൽകുന്നു.
