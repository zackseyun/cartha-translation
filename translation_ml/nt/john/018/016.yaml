translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ തുടർച്ചയായ നില, ബന്ധത്തിലെ അനിശ്ചിതത്വം, വാതിൽകാവൽക്കാരിയുടെ സ്ത്രീലിംഗം എന്നിവ നിലനിർത്തിയിരിക്കുന്നു.
