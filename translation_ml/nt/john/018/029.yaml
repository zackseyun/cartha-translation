id: JHN.18.29
reference: John 18:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐξῆλθεν οὖν ὁ Πιλᾶτος ⸀ἔξω πρὸς αὐτοὺς καὶ ⸀φησίν· Τίνα κατηγορίαν φέρετε ⸀κατὰ τοῦ ἀνθρώπου τούτου;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/029.yaml
  text: So Pilate went outside to them and said, “What accusation do you bring against this man?”
translation:
  language: ml
  text: 'അതിനാൽ പീലാത്തോസ് പുറത്തേക്ക് അവരുടെ അടുക്കൽ ചെന്ന് ചോദിച്ചു: “ഈ മനുഷ്യനെതിരെ നിങ്ങൾ എന്ത് കുറ്റാരോപണമാണ് ഉന്നയിക്കുന്നത്?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθεν ... ἔξω
  choice: പുറത്തേക്ക് ... ചെന്ന്
  rationale: ἐξέρχομαι എന്ന ക്രിയയും ἔξω എന്ന ക്രിയാവിശേഷണവും ചേർന്ന് അകത്തുനിന്ന് പുറത്തേക്കുള്ള നീക്കം ഊന്നിപ്പറയുന്നു. മലയാളത്തിൽ അനാവശ്യ ആവർത്തനം ഒഴിവാക്കിക്കൊണ്ട് ആ സ്ഥലസൂചന നിലനിർത്തുന്നു.
- source_word: οὖν
  choice: അതിനാൽ
  rationale: മുൻവാക്യത്തിലെ സാഹചര്യത്തിന്റെ ഫലമായി പീലാത്തോസ് പുറത്തേക്കു വരുന്നതിനെ സൂചിപ്പിക്കുന്ന ബന്ധകശക്തി നിലനിർത്തുന്നു.
- source_word: πρὸς αὐτούς
  choice: അവരുടെ അടുക്കൽ
  rationale: πρός + accusative ഇവിടെ ആളുകളുടെ അടുത്തേക്കുള്ള നീക്കത്തെയും അവരുമായി അഭിമുഖപ്പെടുന്നതിനെയും സൂചിപ്പിക്കുന്നു.
- source_word: φησίν
  choice: ചോദിച്ചു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനത്തെ സ്വാഭാവിക മലയാള ആഖ്യാനത്തിൽ ഭൂതകാലമായി നൽകി; തുടർന്ന് വരുന്നത് നേരിട്ടുള്ള ചോദ്യമായതിനാൽ ‘ചോദിച്ചു’ സന്ദർഭോചിതമാണ്.
- source_word: Τίνα κατηγορίαν
  choice: എന്ത് കുറ്റാരോപണം
  rationale: κατηγορίαയ്ക്ക് ഇവിടെ നിയമപരമായ ആരോപണം അഥവാ കുറ്റം ചുമത്തൽ എന്ന അർത്ഥമാണ്; ‘കുറ്റാരോപണം’ ആ ന്യായവ്യവഹാരസൂചന വ്യക്തമായി നൽകുന്നു.
- source_word: φέρετε
  choice: ഉന്നയിക്കുന്നു
  rationale: നിയമസന്ദർഭത്തിൽ φέρω ഒരു ആരോപണം കൊണ്ടുവരുക അഥവാ സമർപ്പിക്കുക എന്നതാണ്. മലയാളത്തിൽ ‘കുറ്റാരോപണം ഉന്നയിക്കുക’ സ്വാഭാവികവും കൃത്യവുമായ പ്രയോഗമാണ്.
- source_word: κατὰ
  choice: എതിരെ
  rationale: ജനിറ്റീവിനോടൊപ്പമുള്ള κατά ഇവിടെ ന്യായവ്യവഹാരപരമായി ‘against’ എന്ന അർത്ഥം നൽകുന്നു.
- source_word: τοῦ ἀνθρώπου τούτου
  choice: ഈ മനുഷ്യനെ
  rationale: ἄνθρωπος ഇവിടെ ഒരു നിർദിഷ്ട പുരുഷവ്യക്തിയെ സൂചിപ്പിക്കുന്നു; ‘ഈ മനുഷ്യൻ’ അതിനെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
