  register: ആധുനിക നിലവാരമലയാളത്തിലുള്ള സ്വാഭാവികവും മാന്യവുമായ ന്യായവ്യവഹാരഭാഷ. ഗ്രീക്കിലെ ചരിത്രവർത്തമാനം മലയാള ആഖ്യാനശൈലിക്കനുസരിച്ച് ഭൂതകാലത്തിൽ നൽകിയിരിക്കുന്നു.
