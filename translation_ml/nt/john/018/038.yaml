source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Πιλᾶτος· Τί ἐστιν ἀλήθεια; Καὶ τοῦτο εἰπὼν πάλιν ἐξῆλθεν πρὸς τοὺς Ἰουδαίους, καὶ λέγει αὐτοῖς· Ἐγὼ οὐδεμίαν ⸂εὑρίσκω ἐν αὐτῷ αἰτίαν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/038.yaml
  text: Pilate said to him[a], “What is truth?” After saying this, he went out again to the Jews and said to them, “I find no case against him.”
translation:
  language: ml
  text: 'പീലാത്തോസ് അവനോടു ചോദിച്ചു, “സത്യം എന്താണ്?” ഇതു പറഞ്ഞശേഷം അവൻ വീണ്ടും പുറത്തേക്കു യെഹൂദരുടെ[a] അടുക്കലേക്കു പോയി അവരോടു പറഞ്ഞു: “അവനെതിരെ ഒരു കുറ്റാരോപണത്തിനും അടിസ്ഥാനമൊന്നും ഞാൻ കാണുന്നില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യെഹൂദ നേതാക്കളുടെ അടുക്കൽ.” യോഹന്നാന്റെ സുവിശേഷത്തിൽ “യെഹൂദർ” എന്ന പദം ചില സന്ദർഭങ്ങളിൽ യെഹൂദ നേതാക്കളെയോ, തൊട്ടടുത്ത സന്ദർഭത്തിൽ യേശുവിനെ എതിർത്തിരുന്ന പ്രതിനിധി സംഘത്തെയോ കൂടുതൽ പ്രത്യേകമായി സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Πιλᾶτος
  choice: പീലാത്തോസ് അവനോട് … എന്നു ചോദിച്ചു
  rationale: λέγει എന്നത് ആഖ്യാനത്തിലെ ചരിത്രവർത്തമാനമാണ്; മലയാളത്തിലെ സ്വാഭാവിക ഭൂതകാല ആഖ്യാനമായി നൽകി. ചോദ്യം ഉദ്ധരിക്കുന്നതിനാൽ ‘പറഞ്ഞു’ എന്നതിനെക്കാൾ ‘ചോദിച്ചു’ സ്വാഭാവികമാണ്.
- source_word: Τί ἐστιν ἀλήθεια;
  choice: സത്യം എന്താണ്?
  rationale: ἀλήθεια നിർദേശകപദമില്ലാതെ പൊതുവായ അർഥത്തിൽ വരുന്നതിനാൽ, അതിനെ അധികമായി നിർവചിക്കാതെ ‘സത്യം’ എന്നു നേരിട്ട് നൽകി.
- source_word: Καὶ τοῦτο εἰπὼν
  choice: ഇതു പറഞ്ഞശേഷം
  rationale: εἰπών എന്ന aorist participle പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ കാലക്രമബന്ധം നിലനിർത്തുന്നു.
- source_word: πάλιν ἐξῆλθεν πρὸς τοὺς Ἰουδαίους
  choice: വീണ്ടും യെഹൂദരുടെ അടുക്കൽ പുറത്തേക്കു ചെന്നിട്ട്
  rationale: πάλιν എന്ന ആവർത്തനവും ἐξῆλθεν എന്ന അകത്തുനിന്നു പുറത്തേക്കുള്ള ചലനവും വ്യക്തമായി നിലനിർത്തുന്നു. Ἰουδαίους എന്ന പദത്തിന്റെ നേരിട്ടുള്ള രൂപം മുഖ്യവാചകത്തിൽ സൂക്ഷിച്ചു.
- source_word: καὶ λέγει αὐτοῖς
  choice: അവരോട് പറഞ്ഞു
  rationale: ചരിത്രവർത്തമാനമായ λέγει മലയാള ആഖ്യാനത്തിന് യോജിച്ച ഭൂതകാലത്തിൽ നൽകി.
- source_word: Ἐγὼ οὐδεμίαν εὑρίσκω ἐν αὐτῷ αἰτίαν
  choice: അവന്റെമേൽ കുറ്റം ചുമത്താൻ ഒരു കാരണവും ഞാൻ കാണുന്നില്ല
  rationale: ന്യായവ്യവഹാരസന്ദർഭത്തിലെ αἰτία കുറ്റാരോപണത്തിനുള്ള കാരണം അഥവാ അടിസ്ഥാനം സൂചിപ്പിക്കുന്നു. വെറും ധാർമിക ‘കുറവ്’ എന്നതിലേക്കു ചുരുക്കാതെ നിയമപരമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
theological_decisions:
- issue: യോഹന്നാന്റെ പീഡാനുഭവവിവരണത്തിലെ Ἰουδαίοις എന്ന പദത്തിന്റെ പരിധി
  choice: മുഖ്യവാചകത്തിൽ ‘യെഹൂദർ’ നിലനിർത്തി; സന്ദർഭപരമായി ‘യെഹൂദനേതാക്കൾ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
  alternative: യെഹൂദനേതാക്കൾ; യെഹൂദ്യർ
  rationale: ഗ്രീക്കിലെ വംശീയ-ഭൗമിക പദം മുഖ്യവാചകത്തിൽ സുതാര്യമായി നിലനിർത്തുന്നു. എന്നാൽ ഈ സന്ദർഭത്തിൽ അത് മുഴുവൻ യെഹൂദജനത്തെയും അല്ല, യേശുവിനെതിരെ അവിടെ നിന്നിരുന്ന അധികാരികളെയോ പ്രതിനിധിസംഘത്തെയോ സൂചിപ്പിക്കാവുന്നതിനാൽ വ്യാഖ്യാനപരമായ പരിധി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. നിയമപരമായ പശ്ചാത്തലം വ്യക്തമാക്കുമ്പോഴും ഗ്രീക്കിലെ സംക്ഷിപ്തതയും ‘സത്യം’ എന്ന ചോദ്യത്തിന്റെ തുറന്ന സ്വഭാവവും നിലനിർത്തി.
