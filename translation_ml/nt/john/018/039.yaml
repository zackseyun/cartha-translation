reference: John 18:39
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔστιν δὲ συνήθεια ὑμῖν ἵνα ἕνα ⸂ἀπολύσω ὑμῖν⸃ ἐν τῷ πάσχα· βούλεσθε οὖν ⸄ἀπολύσω ὑμῖν⸅ τὸν βασιλέα τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/039.yaml
  text: But you have a custom that I release one man for you at the Passover[a]. So do you want me to release to you the King of the Jews?
translation:
  language: ml
  text: എന്നാൽ, പെസഹായിൽ നിങ്ങൾക്കായി ഒരാളെ വിട്ടയയ്ക്കുക എന്നൊരു പതിവ് നിങ്ങൾക്കുണ്ട്. അപ്പോൾ, യെഹൂദന്മാരുടെ രാജാവിനെ[a] ഞാൻ നിങ്ങൾക്കു വിട്ടയയ്ക്കണമെന്നാണോ നിങ്ങളുടെ ആഗ്രഹം?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യെഹൂദ്യരുടെ രാജാവ്.” ഗ്രീക്ക് പദത്തിന് സന്ദർഭമനുസരിച്ച് യെഹൂദന്മാരെയോ യെഹൂദ്യരെയോ സൂചിപ്പിക്കാം; ഇവിടെ അത് പീഡാനുഭവവിവരണത്തിൽ ഉപയോഗിക്കുന്ന സ്ഥിരമായ പദവിയായി കാണപ്പെടുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: συνήθεια
  choice: പതിവ്
  rationale: സ്ഥിരമായി അനുഷ്ഠിക്കപ്പെടുന്ന സാമൂഹിക ആചാരത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; വ്യക്തിപരമായ ശീലമെന്ന ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: ἵνα ἕνα ἀπολύσω ὑμῖν
  choice: ഞാൻ നിങ്ങൾക്കുവേണ്ടി ഒരാളെ വിട്ടയയ്ക്കുന്ന
  rationale: ἕνα എന്നതിലെ വ്യക്തിസൂചന മലയാളത്തിൽ ‘ഒരാളെ’ എന്നു വ്യക്തമാക്കുകയും, തടവുകാരനെ മോചിപ്പിക്കുന്ന നിയമപരമായ സന്ദർഭത്തിൽ ἀπολύσω എന്നതിന് ‘വിട്ടയയ്ക്കുന്ന’ ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀπολύω
  choice: വിട്ടയയ്ക്കുക
  rationale: ഭരണാധികാരി തടവുകാരനെ മോചിപ്പിക്കുന്ന സന്ദർഭത്തിന് കൃത്യവും സ്വാഭാവികവുമായ പദം; വാക്യത്തിലെ രണ്ടിടത്തും ഒരേ പദം നിലനിർത്തുന്നു.
- source_word: ἐν τῷ πάσχα
  choice: പെസഹായിൽ
  rationale: ഉത്സവസമയത്തെ സൂചിപ്പിക്കുന്ന ἐν എന്നതിന്റെ കാലസംബന്ധമായ അർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: βούλεσθε οὖν
  choice: അതുകൊണ്ട് ... നിങ്ങളുടെ ആഗ്രഹം?
  rationale: οὖν എന്ന നിഗമനസൂചന ‘അതുകൊണ്ട്’ കൊണ്ടും βούλεσθε എന്ന മനസ്സോ ഇച്ഛയോ സൂചിപ്പിക്കുന്ന ക്രിയ ചോദ്യംരൂപത്തിലുള്ള ‘നിങ്ങളുടെ ആഗ്രഹം’ കൊണ്ടും പകർത്തുന്നു.
- source_word: τὸν βασιλέα τῶν Ἰουδαίων
  choice: യെഹൂദന്മാരുടെ രാജാവ്
  rationale: പീഡാനുഭവവിവരണത്തിൽ യേശുവിനോടു ബന്ധപ്പെടുത്തി ഉപയോഗിക്കുന്ന സ്ഥിരമായ രാജകീയ കുറ്റാരോപണപ്പദവി നിലനിർത്തുന്നു; Ἰουδαίων എന്നതിന്റെ പ്രാദേശികമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: τὸν βασιλέα τῶν Ἰουδαίων എന്ന പദവിയിലെ Ἰουδαίων-ന്റെ അർഥം
  choice: യെഹൂദന്മാരുടെ രാജാവ്
  alternative: യെഹൂദ്യരുടെ രാജാവ്
  rationale: യോഹന്നാന്റെ പീഡാനുഭവവിവരണത്തിൽ ഇത് യേശുവിനെക്കുറിച്ചുള്ള അംഗീകൃത രാജകീയ/മശീഹാപരമായ കുറ്റാരോപണപ്പദവിയായി പ്രവർത്തിക്കുന്നു. ‘യെഹൂദന്മാർ’ എന്നത് ആ സ്ഥിരപദവിയുടെ ചരിത്രപരവും വിവരണാത്മകവുമായ സ്വഭാവം നിലനിർത്തുന്നു; ഗ്രീക്ക് പദത്തിന്റെ പ്രാദേശിക അർഥസാധ്യത സുതാര്യതയ്ക്കായി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഗ്രീക്കിലെ വാക്യബന്ധവും നിയമപരമായ ‘വിട്ടയയ്ക്കുക’ എന്ന ആശയവും സംരക്ഷിച്ചിട്ടുണ്ട്. അടിക്കുറിപ്പ് സൂചകം ബന്ധപ്പെട്ട വിവാദപദവിക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
