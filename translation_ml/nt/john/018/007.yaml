source:
  edition: SBLGNT
  text: πάλιν οὖν ⸂ἐπηρώτησεν αὐτούς⸃· Τίνα ζητεῖτε; οἱ δὲ εἶπαν· Ἰησοῦν τὸν Ναζωραῖον.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/007.yaml
  text: So he asked them again[a], “Whom are you seeking?” And they said, “Jesus the Nazarene.”
translation:
  language: ml
  text: 'അതിനാൽ അവൻ വീണ്ടും അവരോടു ചോദിച്ചു: “നിങ്ങൾ ആരെയാണ് അന്വേഷിക്കുന്നത്?” അവർ പറഞ്ഞു: “നസറായനായ യേശുവിനെ.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നസറെത്തിൽനിന്നുള്ള യേശുവിനെ”; ഗ്രീക്കിൽ “നസറായനായ യേശുവിനെ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: ചോദ്യം ആവർത്തിച്ചതിനെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: οὖν
  choice: അതിനാൽ
  rationale: മുൻവാക്യത്തിലെ സംഭവത്തിൽനിന്ന് ഈ ആവർത്തിച്ച ചോദ്യത്തിലേക്കുള്ള യുക്തിപരമായ ആഖ്യാനബന്ധം നിലനിർത്തുന്നു.
- source_word: ἐπηρώτησεν αὐτούς
  choice: അവരോടു ചോദിച്ചു
  rationale: നേരിട്ടുള്ള ചോദ്യം ഉന്നയിക്കുന്ന ക്രിയയുടെ അർഥവും ബഹുവചന സർവനാമത്തിന്റെ സൂചനയും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: Τίνα ζητεῖτε
  choice: നിങ്ങൾ ആരെയാണ് അന്വേഷിക്കുന്നത്?
  rationale: Τίνα എന്ന കർമരൂപവും ഇപ്പോൾ തുടരുന്ന തിരച്ചിലിനെ സൂചിപ്പിക്കുന്ന ζητεῖτε എന്ന വർത്തമാനകാലവും വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: οἱ δὲ εἶπαν
  choice: അവർ പറഞ്ഞു
  rationale: δέ ഇവിടെ ശക്തമായ വിരോധത്തേക്കാൾ സംഭാഷണത്തിന്റെ തുടർച്ചയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ അധിക സംയോജകം കൂടാതെയുള്ള രൂപം സ്വാഭാവികമാണ്.
- source_word: Ἰησοῦν τὸν Ναζωραῖον
  choice: നസറായനായ യേശുവിനെ
  rationale: Ἰησοῦν എന്ന കർമരൂപവും Ναζωραῖος എന്ന തിരിച്ചറിയൽവിശേഷണവും മലയാളത്തിൽ സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: Ναζωραῖος എന്ന യേശുവിന്റെ വിശേഷണം
  choice: നസറായനായ
  alternative: നസറെത്തിൽനിന്നുള്ള
  rationale: ഇത് പ്രധാനമായും സ്ഥലബന്ധം സൂചിപ്പിക്കുന്ന ചരിത്രപരമായ തിരിച്ചറിയൽവിശേഷണമാണ്; “നസറായനായ” എന്നത് ഗ്രീക്ക് വിശേഷണരൂപം നിലനിർത്തുന്നു, അതേസമയം കൂടുതൽ വിശദീകരണപരമായ സ്ഥലബന്ധരൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. സംഭാഷണത്തിന്റെ ലാളിത്യവും യോഹന്നാന്റെ ആഖ്യാനബന്ധവും നിലനിർത്തിയിരിക്കുന്നു.
