id: JHN.18.20
reference: John 18:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀αὐτῷ Ἰησοῦς· Ἐγὼ παρρησίᾳ ⸀λελάληκα τῷ κόσμῳ· ἐγὼ πάντοτε ἐδίδαξα ἐν συναγωγῇ καὶ ἐν τῷ ἱερῷ, ὅπου ⸀πάντες οἱ Ἰουδαῖοι συνέρχονται, καὶ ἐν κρυπτῷ ἐλάλησα οὐδέν·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/020.yaml
  text: Jesus answered him[a], “I have spoken openly to the world. I always taught in the synagogue and in the temple, where all the Jews gather[b], and I said nothing in secret.”
translation:
  language: ml
  text: 'യേശു അവനോടു മറുപടി പറഞ്ഞു: “ഞാൻ ലോകത്തോടു പരസ്യമായി സംസാരിച്ചിട്ടുണ്ട്. യെഹൂദന്മാരെല്ലാം[b] കൂടിവരുന്ന സിനഗോഗിലും ദേവാലയത്തിലും[a] ഞാൻ എപ്പോഴും പഠിപ്പിച്ചു. രഹസ്യമായി ഞാൻ ഒന്നും പറഞ്ഞിട്ടില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദേവാലയപ്രാകാരങ്ങളിൽ’ അല്ലെങ്കിൽ ‘ദേവാലയപരിസരത്ത്’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ ἱερόν അകത്തെ വിശുദ്ധമന്ദിരത്തെ മാത്രം അല്ല, ദേവാലയസമുച്ചയത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘യെഹൂദജനത മുഴുവനും’ എന്നും, യോഹന്നാനിലെ ചില സന്ദർഭങ്ങളിൽ ‘യെഹൂദ്യരെല്ലാം’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ Ἰουδαῖοι എന്ന പദത്തിന്റെ അർത്ഥം സന്ദർഭാധീനമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησίᾳ
  choice: പരസ്യമായി
  rationale: ഇവിടെ ἐν κρυπτῷ (‘രഹസ്യമായി’) എന്നതിനോടുള്ള നേർവിപരീതമാണ് ഉദ്ദേശ്യം; അതിനാൽ ധൈര്യത്തെക്കാൾ മറച്ചുവയ്ക്കാത്ത പൊതുസംസാരത്തെ ‘പരസ്യമായി’ കൃത്യമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: λελάληκα
  choice: സംസാരിച്ചിട്ടുണ്ട്
  rationale: പൂർണ്ണകാലക്രിയയായതിനാൽ യേശുവിന്റെ മുൻകാല പൊതുസംസാരത്തിന് ഇപ്പോഴും പ്രസക്തിയുണ്ടെന്ന ഭാവം നിലനിർത്തുന്നു.
- source_word: τῷ κόσμῳ
  choice: ലോകത്തോടു
  rationale: യോഹന്നാനിലെ κόσμος എന്ന പദത്തിന്റെ വിശാലമായ പ്രയോഗം സംരക്ഷിക്കുന്നു; ‘പൊതുജനങ്ങളോടു’ എന്നു ചുരുക്കി അർത്ഥം പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: ἐν συναγωγῇ
  choice: സിനഗോഗിൽ
  rationale: ഏകവചനരൂപം നിലനിർത്തിക്കൊണ്ട് യെഹൂദരുടെ പൊതുപഠനസ്ഥലത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണ്.
- source_word: ἐν τῷ ἱερῷ
  choice: ദേവാലയത്തിൽ
  rationale: ἱερόν അകത്തെ വിശുദ്ധമന്ദിരം മാത്രമല്ല, ദേവാലയസമുച്ചയത്തെയും സൂചിപ്പിക്കുന്നു; പ്രധാനവാചകത്തിൽ പരിചിതമായ സംക്ഷിപ്തപദം ഉപയോഗിച്ച് വിശാലമായ അർത്ഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: πάντες οἱ Ἰουδαῖοι
  choice: യെഹൂദന്മാരെല്ലാം
  rationale: ഈ സന്ദർഭത്തിൽ സിനഗോഗിലും ദേവാലയത്തിലും കൂടിവരുന്ന വിശാലമായ യെഹൂദജനസമൂഹമാണ് സൂചന; പദത്തിന്റെ സന്ദർഭാധീനത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: συνέρχονται
  choice: കൂടിവരുന്ന
  rationale: സമൂഹമായി ഒരുമിച്ചുകൂടുന്നതിനെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐν κρυπτῷ
  choice: രഹസ്യമായി
  rationale: παρρησίᾳ എന്നതുമായുള്ള പരസ്യം–രഹസ്യം വൈരുധ്യം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἐλάλησα οὐδέν
  choice: ഞാൻ ഒന്നും പറഞ്ഞിട്ടില്ല
  rationale: ശക്തമായ നിഷേധം സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀπεκρίθη αὐτῷ
  choice: യേശു അവനോടു മറുപടി പറഞ്ഞു
  rationale: ഗ്രീക്ക് ആഖ്യാനപ്രയോഗത്തിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ മലയാളരൂപമാണ്.
theological_decisions:
- issue: യോഹന്നാനിലെ Ἰουδαῖοι എന്ന പദത്തിന്റെ സൂചിതവിഭാഗം
  choice: പ്രധാനവാചകത്തിൽ ‘യെഹൂദന്മാർ’ എന്നു നൽകി, ഇവിടെ പൊതുവായി കൂടിവരുന്ന യെഹൂദജനത്തെ സൂചിപ്പിക്കുന്നതായി വായിച്ചു.
  alternative: ‘യെഹൂദജനത’ അല്ലെങ്കിൽ ചില സന്ദർഭങ്ങളിൽ ‘യെഹൂദ്യർ’
  rationale: യോഹന്നാനിൽ ഈ പദം സന്ദർഭമനുസരിച്ച് യെഹൂദജനത്തെയോ യെഹൂദ്യരെയോ ചിലപ്പോൾ അധികാരികളെയോ സൂചിപ്പിക്കാം. ഇവിടെ സിനഗോഗിലും ദേവാലയത്തിലും കൂടിവരുന്നതാണ് വിഷയം; അതിനാൽ അധികാരികളിലേക്കു മാത്രം അർത്ഥം ചുരുക്കുന്നില്ല. എന്നിരുന്നാലും പദത്തിന്റെ യഥാർഥ സന്ദർഭാധീനത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘സിനഗോഗ്’, ‘ദേവാലയം’ എന്നീ പൊതുവായി മനസ്സിലാകുന്ന പദങ്ങൾ ഉപയോഗിച്ചു. ഗ്രീക്ക് മൂലത്തിലെ പരസ്യം–രഹസ്യം വൈരുധ്യവും പൂർണ്ണകാലത്തിന്റെ ഇപ്പോഴത്തെ പ്രസക്തിയും നിലനിർത്തി. നൽകിയ ഇംഗ്ലീഷ് പാഠത്തിൽ [a] അടയാളം തെറ്റായ സ്ഥാനത്തായിരുന്നതിനാൽ, അതിന്റെ അടിക്കുറിപ്പ് ἱερόν സംബന്ധിച്ചതനുസരിച്ച് മലയാള പ്രധാനവാചകത്തിൽ ‘ദേവാലയത്തിലും’ എന്നതിനുശേഷം ചേർത്തു.
