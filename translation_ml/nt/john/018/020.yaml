  terminology: ‘സിനഗോഗ്,’ ‘ദേവാലയം,’ ‘യെഹൂദന്മാർ’ എന്നിവ സന്ദർഭത്തിനും രജിസ്റ്ററിനും യോജിക്കുന്നു. ἱερόν എന്ന പദത്തിന്റെ ദേവാലയസമുച്ചയാർഥവും Ἰουδαῖοι എന്ന പദത്തിന്റെ സന്ദർഭാധീനതയും അടിക്കുറിപ്പുകളിൽ ഉചിതമായി രേഖപ്പെടുത്തിയിരിക്കുന്നു. [a] ദേവാലയത്തിനും [b] യെഹൂദന്മാർക്കും ശരിയായിടത്ത് ചേർത്തിട്ടുണ്ട്.
