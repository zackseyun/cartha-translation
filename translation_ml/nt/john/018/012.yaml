source:
  edition: SBLGNT
  text: Ἡ οὖν σπεῖρα καὶ ὁ χιλίαρχος καὶ οἱ ὑπηρέται τῶν Ἰουδαίων συνέλαβον τὸν Ἰησοῦν καὶ ἔδησαν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/john/018/012.yaml
  text: So the cohort[a], the commander, and the officers of the Jews seized Jesus and bound him.
translation:
  language: ml
  text: അങ്ങനെ സൈനികദളവും സേനാധിപനും യെഹൂദന്മാരുടെ[a] ഉദ്യോഗസ്ഥരും യേശുവിനെ പിടികൂടി അവനെ ബന്ധിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘യെഹൂദനേതാക്കളുടെ’; സന്ദർഭമനുസരിച്ച് ‘യെഹൂദ്യരുടെ’ എന്നും വരാം. യോഹന്നാൻ പലപ്പോഴും ‘യെഹൂദന്മാർ’ എന്ന പദം മുഴുവൻ യെഹൂദജനത്തെയും സൂചിപ്പിക്കുന്നതിനെക്കാൾ പരിമിതമായ അർഥത്തിൽ ഉപയോഗിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: അങ്ങനെ
  rationale: മുൻവിവരണത്തിൽനിന്നുള്ള കഥാതുടർച്ചയും അതിന്റെ ഫലവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: σπεῖρα
  choice: സൈനികദളം
  rationale: ഒരു സൈനികഘടകത്തെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ സവിശേഷത നിലനിർത്തുന്നു; മൂലപാഠത്തിൽ നേരിട്ട് ഇല്ലാത്ത ‘റോമൻ’ എന്ന വിശേഷണം ചേർക്കുന്നില്ല.
- source_word: χιλίαρχος
  choice: സേനാധിപൻ
  rationale: ആ സൈനികദളത്തിന്റെ മേലധികാരിയെ ആധുനിക വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധത്തിൽ അവതരിപ്പിക്കുന്നു; സാങ്കേതികമായ പദവിപ്പേര് അനാവശ്യമായി ലിപ്യന്തരണം ചെയ്യുന്നില്ല.
- source_word: ὑπηρέται
  choice: ഉദ്യോഗസ്ഥർ
  rationale: ഇവിടെ വീട്ടുജോലിക്കാരെയല്ല, ഔദ്യോഗികമായി അറസ്റ്റ് നടത്താനെത്തിയ സേവകരെയോ കാവൽക്കാരെയോ ആണ് സൂചിപ്പിക്കുന്നത്; അവരുടെ സ്ഥാപനപരമായ പങ്ക് വ്യക്തമാക്കുന്നു, എന്നാൽ ‘ദേവാലയകാവൽക്കാർ’ എന്ന് മൂലപാഠത്തിലധികം നിർവചിക്കുന്നില്ല.
- source_word: τῶν Ἰουδαίων
  choice: യെഹൂദന്മാരുടെ
  rationale: ഗ്രീക്കിലെ ബന്ധസൂചകപ്രയോഗം സുതാര്യമായി നിലനിർത്തുന്നു. യോഹന്നാനിൽ ഇതിന് ചില സന്ദർഭങ്ങളിൽ കൂടുതൽ പരിമിതമായ അർഥമുണ്ടാകാമെന്ന കാര്യം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: συνέλαβον
  choice: പിടിച്ചു
  rationale: ബലമായി കൈവശപ്പെടുത്തുകയോ കസ്റ്റഡിയിൽ എടുക്കുകയോ ചെയ്യുന്ന പ്രവൃത്തി സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; നിയമനടപടി എന്ന ആശയം അനാവശ്യമായി മുൻനിരയിൽ കൊണ്ടുവരുന്നില്ല.
- source_word: ἔδησαν
  choice: ബന്ധിച്ചു
  rationale: കെട്ടിയിടുക എന്ന പ്രവൃത്തിയെ കൃത്യവും മാന്യവുമായ ആഖ്യാനഭാഷയിൽ നൽകുന്നു.
theological_decisions:
- issue: യോഹന്നാനിലെ τῶν Ἰουδαίων എന്ന പ്രയോഗത്തിന്റെ സൂചിതവിഭാഗം
  choice: പ്രധാനപാഠത്തിൽ ‘യെഹൂദന്മാരുടെ’ എന്ന് സുതാര്യമായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘യെഹൂദനേതാക്കളുടെ’ അല്ലെങ്കിൽ സന്ദർഭമനുസരിച്ച് ‘യെഹൂദ്യരുടെ’
  rationale: ഈ വാക്യം തന്നെ നേതാക്കളെന്ന് പ്രത്യേകം പറയാത്തതിനാൽ പ്രധാനപാഠം അർഥം ചുരുക്കുന്നില്ല. അതേസമയം, ഈ പ്രയോഗം മുഴുവൻ യെഹൂദജനത്തെയും എല്ലായിടത്തും സൂചിപ്പിക്കുന്നതായി തെറ്റിദ്ധരിക്കാതിരിക്കാൻ സാധ്യതയുള്ള പരിമിതാർഥങ്ങൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അതിന്റെ’ എന്ന പദം സേനാധിപന്റെ ബന്ധം സൈനികദളത്തോടാണെന്ന് വ്യക്തമാക്കുന്നു; ‘ചേർന്ന്’ സംയുക്തകർത്താക്കളുടെ പ്രവർത്തനം മലയാളത്തിൽ സുഗമമാക്കുന്നു.
