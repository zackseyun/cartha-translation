  to: അങ്ങനെ സൈനികദളവും സേനാധിപനും യെഹൂദന്മാരുടെ[a] ഉദ്യോഗസ്ഥരും യേശുവിനെ പിടികൂടി അവനെ ബന്ധിച്ചു.
