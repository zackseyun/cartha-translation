translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, മാന്യമായ മലയാളം. ഗ്രീക്കിലെ സംക്ഷിപ്ത ആഖ്യാനശൈലിയും കർമ്മത്തിന്റെ അന്തർലീനതയും നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി ‘അത്’ ചേർത്തു; യഥാർഥമായ വ്യാകരണപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
