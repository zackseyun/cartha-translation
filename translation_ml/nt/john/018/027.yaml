  text: Then Peter denied it again[a], and immediately a rooster crowed.
translation:
  language: ml
  text: അപ്പോൾ പത്രോസ് വീണ്ടും നിഷേധിച്ചു. ഉടനെ ഒരു പൂവൻകോഴി കൂവി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: ആവർത്തനത്തെ സൂചിപ്പിക്കുന്ന ക്രിയാവിശേഷണം; പത്രോസിന്റെ ആവർത്തിച്ചുള്ള നിഷേധങ്ങളുടെ സന്ദർഭത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
- source_word: οὖν
  choice: അപ്പോൾ
  rationale: മുൻചോദ്യത്തോട് ഈ നിഷേധത്തെ ബന്ധിപ്പിക്കുന്ന ആഖ്യാനപരമായ തുടർച്ച മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; ശക്തമായ നിഗമനാർഥം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: ἠρνήσατο
  choice: അത് നിഷേധിച്ചു
  rationale: ഗ്രീക്കിൽ കർമ്മം തുറന്നുപറയുന്നില്ലെങ്കിലും തൊട്ടുമുമ്പുള്ള ചോദ്യത്തിൽനിന്ന് അത് സന്ദർഭം നൽകുന്നു. മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി ‘അത്’ ചേർത്തിരിക്കുന്നു; ഈ അന്തർലീനത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: Πέτρος
  choice: പത്രോസ്
  rationale: മലയാള ബൈബിൾ ഭാഷയിൽ സ്ഥിരപ്രചാരമുള്ള വ്യക്തിനാമരൂപം.
- source_word: καὶ
  choice: വാക്യവിഭജനം
  rationale: സംഭവങ്ങളുടെ അതിവേഗ തുടർച്ച മലയാളത്തിൽ രണ്ട് ചെറുവാക്യങ്ങളായി സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; εὐθέως ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: εὐθέως
  choice: ഉടനെ
  rationale: നിഷേധത്തിനു പിന്നാലെ കോഴി കൂവിയതിന്റെ തൽക്ഷണത വ്യക്തവും സാധാരണവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀλέκτωρ
  choice: ഒരു കോഴി
  rationale: ആൺകോഴിയെ സന്ദർഭംകൊണ്ട് വ്യക്തമായി തിരിച്ചറിയാവുന്ന സാധാരണ മലയാളപ്രയോഗം; ഗ്രീക്കിൽ നിർദേശാർഥക ലേഖനം ഇല്ലാത്തതിനാൽ ‘ഒരു’ സ്വാഭാവികമാണ്.
- source_word: ἐφώνησεν
  choice: കൂവി
  rationale: പദത്തിന് പൊതുവായി ‘ശബ്ദമുണ്ടാക്കി/വിളിച്ചു’ എന്ന അർഥമുണ്ടെങ്കിലും കോഴി കർത്താവായിരിക്കുമ്പോൾ മലയാളത്തിലെ സന്ദർഭോചിതമായ ക്രിയ ‘കൂവി’ ആണ്.
