source:
  edition: SBLGNT
  text: λέγει εἷς ἐκ τῶν δούλων τοῦ ἀρχιερέως, συγγενὴς ὢν οὗ ἀπέκοψεν Πέτρος τὸ ὠτίον· Οὐκ ἐγώ σε εἶδον ἐν τῷ κήπῳ μετ’ αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/026.yaml
  text: One of the high priest’s servants[a], being a relative of the man whose ear Peter had cut off, said, “Didn’t I see you in the garden with him?”
translation:
  language: ml
  text: 'മഹാപുരോഹിതന്റെ അടിമകളിൽ ഒരാൾ—പത്രോസ് ചെവി വെട്ടിക്കളഞ്ഞ മനുഷ്യന്റെ ബന്ധു—പറഞ്ഞു: “ഞാൻ നിന്നെ അവനോടൊപ്പം തോട്ടത്തിൽ കണ്ടില്ലേ?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δούλων
  choice: അടിമകളിൽ
  rationale: ഗൃഹപരിസരത്തിലെ ബന്ധിതമായ സാമൂഹികപദവി സൂചിപ്പിക്കുന്ന δοῦλος എന്ന പദത്തിന്റെ അർഥം മൃദൂകരിക്കാതെ നൽകുന്നു; ἐκ τῶν എന്ന ഘടന ‘അടിമകളിൽ ഒരാൾ’ എന്നു സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
- source_word: ἀρχιερέως
  choice: മഹാപുരോഹിതന്റെ
  rationale: യോഹന്നാനിലെ പീഡാനുഭവവിവരണത്തിൽ മുഖ്യ പുരോഹിതപദവിയെ സൂചിപ്പിക്കുന്ന പതിവും കൃത്യവുമായ മലയാളപ്രയോഗം.
- source_word: συγγενὴς ὢν
  choice: ബന്ധു
  rationale: സംസാരിച്ചയാൾ പരിക്കേറ്റ മനുഷ്യന്റെ ബന്ധുവാണെന്ന് പങ്കാളിത്തപ്രയോഗം വ്യക്തമാക്കുന്നു; ഡാഷുകൾക്കിടയിലെ സമാനാധികരണവാക്യം മലയാളത്തിൽ ആ ബന്ധം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: οὗ ... τὸ ὠτίον
  choice: മനുഷ്യന്റെ ... ചെവി
  rationale: ഗ്രീക്ക് ബന്ധസർവനാമത്തിന്റെ മനുഷ്യസൂചകം മലയാളത്തിൽ വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: ἀπέκοψεν
  choice: വെട്ടിക്കളഞ്ഞ
  rationale: ചെവി ശരീരത്തിൽനിന്ന് വേർപ്പെടുത്തിയ മുൻസംഭവത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക പ്രയോഗം.
- source_word: Οὐκ ἐγώ σε εἶδον
  choice: ഞാൻ നിന്നെ ... കണ്ടില്ലേ?
  rationale: സ്ഥിരീകരണം പ്രതീക്ഷിക്കുന്ന οὐκ ചോദ്യത്തിന്റെ ഭാവവും ἐγώ എന്ന കർത്താവിന്റെ ഊന്നലും മലയാളത്തിലെ സ്വാഭാവിക ചോദ്യഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: ἐν τῷ κήπῳ
  choice: തോട്ടത്തിൽ
  rationale: κήπος എന്ന പദത്തിന്റെ സാധാരണവും സന്ദർഭോചിതവുമായ മലയാളരൂപം.
- source_word: μετ’ αὐτοῦ
  choice: അവനോടൊപ്പം
  rationale: സന്ദർഭത്തിൽ യേശുവിനെ സൂചിപ്പിക്കുന്ന സർവനാമം വ്യാഖ്യാനാത്മകമായി പേര് ചേർക്കാതെ അതേപടി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഗൃഹപരിസരത്തിൽ δοῦλος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: അടിമ
  alternative: ദാസൻ / വേലക്കാരൻ
  rationale: ഇവിടെ സാധാരണ പരിചാരകനെയല്ല, മഹാപുരോഹിതന്റെ വീട്ടിലെ ബന്ധിതപദവിയിലുള്ള ആളെയാണ് പദം സൂചിപ്പിക്കുന്നത്. അതിനാൽ സാമൂഹിക യാഥാർഥ്യം മൃദൂകരിക്കാതെ ‘അടിമ’ എന്നു നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ബന്ധുവായിരുന്നതിനാൽ’ എന്ന കാരണാർഥസൂചന ഒഴിവാക്കി, ഗ്രീക്കിലെ പങ്കാളിത്തപ്രയോഗം നൽകുന്ന തിരിച്ചറിയൽവിവരം ഡാഷുകൾക്കിടയിൽ ചേർത്തു. മൂലത്തിൽ ഇല്ലാത്തതിനാൽ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
