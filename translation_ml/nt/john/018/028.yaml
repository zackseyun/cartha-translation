id: JHN.18.28
reference: John 18:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἄγουσιν οὖν τὸν Ἰησοῦν ἀπὸ τοῦ Καϊάφα εἰς τὸ πραιτώριον· ἦν δὲ πρωΐ· καὶ αὐτοὶ οὐκ εἰσῆλθον εἰς τὸ πραιτώριον, ἵνα μὴ μιανθῶσιν ⸀ἀλλὰ φάγωσιν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/028.yaml
  text: So they led Jesus from Caiaphas into the governor’s headquarters[a]. Now it was early morning. They themselves did not enter the headquarters, so that they would not be defiled[c][b], but could eat the Passover.
translation:
  language: ml
  text: അതിനാൽ അവർ യേശുവിനെ കയ്യഫാവിന്റെ അടുക്കൽനിന്ന് ഗവർണറുടെ ആസ്ഥാനത്തേക്ക്[a] കൊണ്ടുപോയി. അപ്പോൾ അതിരാവിലെയായിരുന്നു. ആചാരപരമായി അശുദ്ധരാകാതെ[b] പെസഹ ഭക്ഷിക്കാൻ[c] കഴിയേണ്ടതിന് അവർതന്നെ ആസ്ഥാനത്തിനകത്ത് പ്രവേശിച്ചില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘പ്രെത്തോറിയം’; റോമൻ ഗവർണറുടെ ഔദ്യോഗിക വസതിയും ന്യായവിചാരണാ ആസ്ഥാനവും.
    reason: lexical_alternative
  - marker: b
    text: ‘അശുദ്ധരാകുക’ എന്നത് ആചാരപരമായി അശുദ്ധരാകുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: c
    text: ‘പെസഹ ഭക്ഷിക്കുക’ എന്നത് പെസഹാഭക്ഷണത്തെ പ്രത്യേകമായി സൂചിപ്പിക്കാം; അല്ലെങ്കിൽ പെസഹപ്പെരുന്നാളിനിടയിലെ ഭക്ഷണങ്ങളെയോ ആചരണങ്ങളെയോ കൂടുതൽ വിശാലമായി സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄγουσιν
  choice: കൊണ്ടുപോയി
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനത്തെ മലയാള ആഖ്യാനത്തിൽ സ്വാഭാവികമായ ഭൂതകാലമായി നൽകി; കാവലിലുള്ള യേശുവിനെ നയിച്ചുകൊണ്ടുപോകുന്ന ആശയം സന്ദർഭത്തിൽ വ്യക്തമാകുന്നു.
- source_word: οὖν
  choice: അതിനാൽ
  rationale: മുൻവിവരണത്തോടുള്ള അനുമാനാത്മകവും ആഖ്യാനപരവുമായ ബന്ധം നിലനിർത്തുന്നു.
- source_word: πραιτώριον
  choice: ഗവർണറുടെ ആസ്ഥാനം
  rationale: റോമൻ ഗവർണറുടെ ഔദ്യോഗിക വസതിയും ന്യായവിചാരണാകേന്ദ്രവും സൂചിപ്പിക്കുന്ന പദം സാധാരണ വായനക്കാർക്ക് അർഥവത്തായി പരിഭാഷപ്പെടുത്തി; പര്യായം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: πρωΐ
  choice: അതിരാവിലെ
  rationale: ദിവസത്തിന്റെ ആദ്യഭാഗം സ്വാഭാവികമായ മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു; കൃത്യമായി പുലരിയെന്ന് അതിനിർണയിക്കുന്നില്ല.
- source_word: αὐτοὶ
  choice: അവർതന്നെ
  rationale: 'മൂലത്തിലെ ഊന്നൽ സംരക്ഷിക്കുന്നു: യേശുവിനെ ഏൽപ്പിച്ചവർ സ്വന്തം നിലയിൽ അകത്തു കടന്നില്ല.'
- source_word: εἰσῆλθον
  choice: പ്രവേശിച്ചില്ല
  rationale: ഔദ്യോഗിക ആസ്ഥാനത്തിനകത്തേക്ക് കടക്കാതിരുന്നതിനെ വ്യക്തവും മാന്യവുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: μιανθῶσιν
  choice: ആചാരപരമായി അശുദ്ധരാകാതെ
  rationale: ഇവിടെ ഉദ്ദേശിക്കുന്നത് ശാരീരിക അഴുക്കല്ല, മതാചാരപരമായ അശുദ്ധിയാണെന്ന് മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: φάγωσιν τὸ πάσχα
  choice: പെസഹ ഭക്ഷിക്കാൻ
  rationale: പെസഹാഭക്ഷണം മാത്രമോ പെരുന്നാളുമായി ബന്ധപ്പെട്ട വിശാലമായ ഭക്ഷണാചരണമോ എന്ന ചർച്ച തീർപ്പാക്കാതെ മൂലത്തിലെ സംക്ഷിപ്തതയും അനിശ്ചിതത്വവും നിലനിർത്തുന്നു.
- source_word: Καϊάφα
  choice: കയ്യഫാവ്
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം സ്വീകരിച്ചു.
- source_word: Ἰησοῦν
  choice: യേശു
  rationale: മലയാളത്തിൽ സ്ഥിരപ്പെട്ട വ്യക്തിനാമരൂപം സ്വീകരിച്ചു.
theological_decisions:
- issue: യോഹന്നാനിലെ കാലക്രമവുമായി ബന്ധപ്പെട്ട് ‘പെസഹ ഭക്ഷിക്കുക’ എന്നതിന്റെ കൃത്യമായ വിവക്ഷ
  choice: ‘പെസഹ ഭക്ഷിക്കാൻ’ എന്ന തുറന്ന പ്രയോഗം നിലനിർത്തി.
  alternative: ‘പെസഹാഭക്ഷണം കഴിക്കാൻ’ അല്ലെങ്കിൽ ‘പെരുന്നാൾഭക്ഷണങ്ങൾ കഴിക്കാൻ’ എന്ന് പ്രത്യേകമായി നിർവചിക്കുക.
  rationale: φάγωσιν τὸ πάσχα എന്നത് പെസഹാഭക്ഷണത്തെ ഇടുങ്ങിയ അർഥത്തിലോ പെസഹക്കാലത്തെ ഭക്ഷണങ്ങളെയും ആചരണങ്ങളെയും വിശാലമായ അർഥത്തിലോ സൂചിപ്പിക്കാം. മുഖ്യവാചകം ഈ വ്യാഖ്യാനവിവാദവും കാലക്രമസംബന്ധമായ ദൈവശാസ്ത്ര പിരിമുറുക്കവും പരിഹരിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സ്വാഭാവികവും മാന്യവുമായ മലയാളം. ഔദ്യോഗിക സ്ഥലനാമം അർഥപരമായി പരിഭാഷപ്പെടുത്തി, സാങ്കേതിക പര്യായം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു. ‘അവർതന്നെ’ എന്ന രൂപം മൂലത്തിലെ ഊന്നൽ നിലനിർത്തുന്നു; ‘പെസഹ ഭക്ഷിക്കാൻ’ എന്ന പ്രയോഗം വ്യാഖ്യാനപരമായ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു.
