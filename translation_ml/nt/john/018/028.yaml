  source_fidelity: മൂലത്തിലെ ആഖ്യാനബന്ധം (οὖν), കയ്യഫാവിൽനിന്നുള്ള മാറ്റം, പ്രെത്തോറിയത്തിലേക്കുള്ള യാത്ര, അതിരാവിലെ എന്ന സമയസൂചന, αὐτοὶയുടെ ഊന്നൽ, അശുദ്ധി ഒഴിവാക്കി പെസഹ ഭക്ഷിക്കാനുള്ള ഉദ്ദേശ്യം എന്നിവ വിശ്വസ്തമായി പ്രതിഫലിക്കുന്നു. ‘പെസഹ ഭക്ഷിക്കാൻ’ എന്ന പ്രയോഗം φάγωσιν τὸ πάσχαയുടെ വിവാദമായ വ്യാപ്തി അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
  naturalness: വാചകം ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്. ‘ഗവർണറുടെ ആസ്ഥാനം,’ ‘അതിരാവിലെയായിരുന്നു,’ ‘അവർതന്നെ ... പ്രവേശിച്ചില്ല’ എന്നിവ സന്ദർഭത്തിനും മാന്യമായ ബൈബിൾരജിസ്റ്ററിനും യോജിക്കുന്നു.
  terminology: ‘യേശു,’ ‘കയ്യഫാവ്,’ ‘പെസഹ,’ ‘ആചാരപരമായി അശുദ്ധരാകുക’ എന്നിവ സ്ഥിരപ്പെട്ടതും അർഥസുതാര്യവുമായ പ്രയോഗങ്ങളാണ്. πραιτώριον-ന് അർഥപരിഭാഷ നൽകി സാങ്കേതിക പര്യായം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചിരിക്കുന്നത് ഉചിതമാണ്.
