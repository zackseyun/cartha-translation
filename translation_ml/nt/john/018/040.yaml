  naturalness: The Malayalam is generally modern and clear. However, ‘ബറബ്ബാസിനെ മതി’ can mean ‘Barabbas is enough’ and weakens the Greek's direct contrast of rejection and preference. ‘ബറബ്ബാസിനെ വേണം’ is the idiomatic, unambiguous counterpart to ‘ഇവനെ വേണ്ട.’
