  text: ἐκραύγασαν οὖν ⸀πάλιν λέγοντες· Μὴ τοῦτον ἀλλὰ τὸν Βαραββᾶν. ἦν δὲ ὁ Βαραββᾶς λῃστής.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/040.yaml
  text: So they shouted again[a], saying, “Not this man, but Barabbas!” Now Barabbas was a robber.
translation:
  language: ml
  text: 'അപ്പോൾ അവർ വീണ്ടും ഉറക്കെ വിളിച്ചുപറഞ്ഞു: “ഇവനെ വേണ്ട, ബറബ്ബാസിനെ വേണം!” ബറബ്ബാസ് ഒരു കവർച്ചക്കാരനായിരുന്നു.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കൊള്ളക്കാരൻ”; ഗ്രീക്ക് പദം ചില സാഹചര്യങ്ങളിൽ അക്രമാസക്തനായ കലാപകാരിയെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκραύγασαν
  choice: ഉറക്കെ വിളിച്ചുപറഞ്ഞു
  rationale: ക്രൗഗാസോ എന്ന ക്രിയ ഉച്ചത്തിലുള്ള വിളിയെ സൂചിപ്പിക്കുന്നു. ‘ഉറക്കെ വിളിച്ചുപറഞ്ഞു’ എന്നത് അതിന്റെ ശക്തിയും പിന്നാലെയുള്ള λέγοντες എന്ന ആശയവും സ്വാഭാവിക മലയാളത്തിൽ ചേർത്ത് പ്രകടിപ്പിക്കുന്നു.
- source_word: οὖν
  choice: അപ്പോൾ
  rationale: മുൻ സംഭാഷണത്തിന്റെ തുടർച്ചയും അതിൽനിന്നുണ്ടായ പ്രതികരണവും സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു; ഇവിടെ കർശനമായ നിഗമനസൂചകമായ ‘അതുകൊണ്ട്’ എന്നതിനെക്കാൾ അനുയോജ്യം.
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: പ്രവൃത്തിയുടെ ആവർത്തനം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: λέγοντες
  choice: വിളിച്ചുപറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ‘പറഞ്ഞുകൊണ്ട്’ എന്ന പങ്കാളിക്രിയയുടെ ഉള്ളടക്കം ἐκραύγασαν എന്ന ക്രിയയോടൊപ്പം സ്വാഭാവിക മലയാളത്തിൽ സംയോജിപ്പിച്ചു; ‘വിളിച്ചുപറഞ്ഞു’ ഉച്ചത്തിലുള്ള വിളിയും പറഞ്ഞ വാക്കുകളും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു.
- source_word: Μὴ τοῦτον ἀλλὰ τὸν Βαραββᾶν
  choice: ഇവനെ വേണ്ട, ബറബ്ബാസിനെ മതി
  rationale: τοῦτον എന്ന നിർദ്ദേശകത്തിന്റെ വ്യക്തത ‘ഇവനെ’ നിലനിർത്തുന്നു. ഗ്രീക്കിലെ സംക്ഷിപ്തമായ വിരുദ്ധഘടന മലയാളത്തിൽ സ്വാഭാവികമായി ‘വേണ്ട ... മതി’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: Βαραββᾶν / Βαραββᾶς
  choice: ബറബ്ബാസ്
  rationale: ഗ്രീക്ക് ഉച്ചാരണത്തോടടുത്തും മലയാള ബൈബിൾ വായനക്കാർക്ക് തിരിച്ചറിയാവുന്നതുമായ ലിപ്യന്തരണം.
- source_word: ἦν δὲ
  choice: '... ആയിരുന്നു'
  rationale: δέ ഇവിടെ ബറബ്ബാസിനെക്കുറിച്ചുള്ള പശ്ചാത്തല വിശദീകരണം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ പ്രത്യേക ബന്ധകപദം ചേർക്കാതെ വാക്യക്രമംകൊണ്ട് ഈ വിശദീകരണസ്വഭാവം സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: λῃστής
  choice: കവർച്ചക്കാരൻ
  rationale: പദത്തിന്റെ മുഖ്യ അർത്ഥമായ കവർച്ചക്കാരൻ/കൊള്ളക്കാരൻ എന്ന ആശയം സാധാരണ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; സായുധ കൊള്ളക്കാരൻ അഥവാ കലാപകാരി എന്ന സാഹചര്യസാധ്യമായ അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: ബറബ്ബാസിനെ വിശേഷിപ്പിക്കുന്ന λῃστής എന്ന പദത്തിന്റെ അർത്ഥവ്യാപ്തി
  choice: കവർച്ചക്കാരൻ
  alternative: കൊള്ളക്കാരൻ; സായുധ കൊള്ളക്കാരൻ; ചില സാഹചര്യങ്ങളിൽ അക്രമാസക്തനായ കലാപകാരി
  rationale: ഈ വാക്യം മാത്രം ബറബ്ബാസിനെ രാഷ്ട്രീയ കലാപകാരിയെന്ന് നിർബന്ധമായി നിർവചിക്കുന്നില്ല. അതിനാൽ മുഖ്യപാഠത്തിൽ പദത്തിന്റെ അടിസ്ഥാന അർത്ഥം നൽകി, ഒന്നാം നൂറ്റാണ്ടിലെ ചില സാഹചര്യങ്ങളിൽ ഉണ്ടായേക്കാവുന്ന വിശാലമായ അർത്ഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ഉച്ചത്തിലുള്ള കൂട്ടവിളിയുടെ ശക്തി നിലനിർത്തിക്കൊണ്ട് ഗ്രീക്ക് വാക്യഘടന മലയാളത്തിൽ കൃത്രിമമാകാതിരിക്കാൻ ക്രിയയും പങ്കാളിക്രിയയും സംയോജിപ്പിച്ചു.
