  naturalness: വാചകം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും വായനാസുഖമുള്ളതുമാണ്. ‘വാൾ ഉറയിൽ ഇടുക’ വ്യക്തവും മാന്യമായ ബൈബിൾ രജിസ്റ്ററിനൊത്തതുമാണ്; ‘പാനപാത്രം’ രൂപകത്തിന്റെ പരമ്പരാഗതവും ഗ്രഹിക്കാവുന്നതുമായ രൂപം നിലനിർത്തുന്നു.
  terminology: ‘പിതാവ്’ എന്നത് മൂലത്തിലെ ὁ πατήρ-നു യോജിച്ചതാണ്; ‘എന്റെ’ ചേർക്കുന്നില്ല. ‘പാനപാത്രം’ മൂലരൂപകത്തെ വ്യാഖ്യാനമായി ചുരുക്കുന്നില്ല. അടിക്കുറിപ്പ് [b] കഷ്ടതയോ ദൈവം നിശ്ചയിച്ച വിധിയോ എന്ന വിശാലത നിലനിർത്തി, ഇടുങ്ങിയ സിദ്ധാന്തനിർവചനം ഒഴിവാക്കുന്നു. [a], [b] ചിഹ്നങ്ങൾ അവ പരാമർശിക്കുന്ന പദങ്ങളോട് ശരിയായി ചേർത്തിരിക്കുന്നു.
