id: JHN.18.11
reference: John 18:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν οὖν ὁ Ἰησοῦς τῷ Πέτρῳ· Βάλε τὴν ⸀μάχαιραν εἰς τὴν θήκην· τὸ ποτήριον ὃ δέδωκέν μοι ὁ πατὴρ οὐ μὴ πίω αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/011.yaml
  text: So Jesus said to Peter[a], “Put the sword into its sheath[b]. Shall I not drink the cup that the Father has given me?”
translation:
  language: ml
  text: 'അപ്പോൾ യേശു പത്രോസിനോടു പറഞ്ഞു: “വാൾ ഉറയിൽ ഇടുക.[a] പിതാവ് എനിക്കു നൽകിയ പാനപാത്രം[b] ഞാൻ കുടിക്കാതിരിക്കുമോ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഉറ’ എന്നത് വാൾ സൂക്ഷിക്കുന്ന ആവരണമാണ്.
    reason: lexical_alternative
  - marker: b
    text: '‘പാനപാത്രം’ എന്നത് ദൈവം നിശ്ചയിച്ച കഷ്ടതയെയോ വിധിയെയോ സൂചിപ്പിക്കുന്ന ബൈബിൾ രൂപകമാണ്. ഗെത്സെമനെയിലെ പ്രാർഥനയുമായി താരതമ്യം ചെയ്യുക: മത്തായി 26:39; മർക്കോസ് 14:36; ലൂക്കോസ് 22:42.'
    reason: cross_reference
lexical_decisions:
- source_word: οὖν
  choice: അപ്പോൾ
  rationale: കഥയുടെ തുടർച്ചയും സംഭവങ്ങളുടെ ബന്ധവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു; ഇവിടെ കർശനമായ നിഗമനാർഥമുള്ള ‘അതുകൊണ്ട്’ ആവശ്യമില്ല.
- source_word: Βάλε
  choice: ഇടുക
  rationale: βάλλω എന്ന ക്രിയയുടെ ഈ സന്ദർഭത്തിലെ പ്രയോഗം വാൾ അതിന്റെ ഉറയിലേക്കു തിരിച്ചുവെക്കാനുള്ള നേരിട്ടുള്ള കല്പനയാണ്.
- source_word: μάχαιραν
  choice: വാൾ
  rationale: ആയുധത്തിന്റെ കൃത്യമായ വലിപ്പം ഗ്രീക്ക് പദം ഇവിടെ നിർണയിക്കുന്നില്ല; പൊതുവായി മനസ്സിലാകുന്നതും സന്ദർഭത്തിന് യോജിച്ചതുമായ പദമാണ് ‘വാൾ’.
- source_word: θήκην
  choice: ഉറ
  rationale: വാൾ സൂക്ഷിക്കുന്ന ആവരണത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളപദം.
- source_word: ποτήριον
  choice: പാനപാത്രം
  rationale: ദൈവം നിശ്ചയിച്ച അനുഭവത്തെയോ കഷ്ടതയെയോ സൂചിപ്പിക്കുന്ന ബൈബിൾ രൂപകം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: δέδωκέν
  choice: നൽകിയ
  rationale: പിതാവ് നൽകിയതും ഇപ്പോൾ യേശുവിന്റെ മുമ്പിലുള്ളതുമായ ദൗത്യത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὁ πατήρ
  choice: പിതാവ്
  rationale: ഗ്രീക്കിൽ ഉടമസ്ഥസർവനാമമില്ലാത്തതിനാൽ ‘എന്റെ പിതാവ്’ എന്നു കൂട്ടിച്ചേർക്കാതെ യോഹന്നാന്റെ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: οὐ μὴ πίω αὐτό;
  choice: ഞാൻ കുടിക്കാതിരിക്കുമോ?
  rationale: 'ഉറച്ച അനുകൂല ഉത്തരം പ്രതീക്ഷിക്കുന്ന ഗ്രീക്ക് അലങ്കാരചോദ്യത്തിന്റെ ശക്തി നിലനിർത്തുന്നു: യേശു ആ പാനപാത്രം കുടിക്കും.'
theological_decisions:
- issue: ‘പാനപാത്രം’ എന്ന രൂപകത്തിന്റെ അർഥം
  choice: പ്രധാനവാചകത്തിൽ ‘പാനപാത്രം’ എന്ന രൂപകം അതേപടി നിലനിർത്തി; അടിക്കുറിപ്പിൽ ദൈവം നിശ്ചയിച്ച കഷ്ടതയെയോ വിധിയെയോ സൂചിപ്പിക്കുന്നതായി വിശദീകരിച്ചു.
  alternative: ‘കഷ്ടത’, ‘മരണം’, ‘ക്രൂശുമരണം’, അല്ലെങ്കിൽ ‘ദൈവക്രോധം’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തുക.
  rationale: സന്ദർഭം യേശുവിനായി നിശ്ചയിക്കപ്പെട്ട കഷ്ടതയെ സൂചിപ്പിക്കുന്നുവെങ്കിലും വാക്യം തന്നെ രൂപകത്തെ അതിലധികം ഇടുങ്ങിയ ഒരു സിദ്ധാന്തപരമായ നിർവചനത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- issue: പിതാവിനോടുള്ള യേശുവിന്റെ അനുസരണം
  choice: ‘പിതാവ് എനിക്കു നൽകിയ’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തി, യേശുവിന്റെ മനസ്സോടെയുള്ള അനുസരണം അലങ്കാരചോദ്യത്തിലൂടെ പ്രകടമാകാൻ അനുവദിച്ചു.
  alternative: ‘എന്റെ പിതാവ് എനിക്കായി നിശ്ചയിച്ച’ എന്ന വിശദീകരണപരമായ ഭാഷ ചേർക്കുക.
  rationale: മൂലവാചകത്തിൽ ഇല്ലാത്ത ഉടമസ്ഥസർവനാമമോ വ്യാഖ്യാനമോ ചേർക്കാതെ പിതാവും പുത്രനും തമ്മിലുള്ള ബന്ധവും യേശുവിന്റെ സന്നദ്ധമായ അനുസരണവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘പാനപാത്രം’ എന്ന ബൈബിൾ രൂപകം നിലനിർത്തി. ലഭിച്ച ഇംഗ്ലീഷ് പാഠത്തിൽ അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ഉള്ളടക്കവുമായി പൊരുത്തപ്പെടാത്തതിനാൽ, ഉറയുമായി ബന്ധപ്പെട്ട [a] ‘ഉറ’ എന്ന പദത്തിനു ശേഷവും പാനപാത്രവുമായി ബന്ധപ്പെട്ട [b] ‘പാനപാത്രം’ എന്ന പദത്തിനു ശേഷവും ക്രമപ്പെടുത്തി.
