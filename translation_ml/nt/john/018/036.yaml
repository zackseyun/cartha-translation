id: JHN.18.36
reference: John 18:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Ἡ βασιλεία ἡ ἐμὴ οὐκ ἔστιν ἐκ τοῦ κόσμου τούτου· εἰ ἐκ τοῦ κόσμου τούτου ἦν ἡ βασιλεία ἡ ἐμή, οἱ ὑπηρέται ⸂οἱ ἐμοὶ ἠγωνίζοντο ἄν⸃, ἵνα μὴ παραδοθῶ τοῖς Ἰουδαίοις· νῦν δὲ ἡ βασιλεία ἡ ἐμὴ οὐκ ἔστιν ἐντεῦθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/036.yaml
  text: Jesus answered[a], “My kingdom is not from this world. If my kingdom were from this world, my servants would be fighting so that I might not be handed over to the Jews. But as it is, my kingdom is not from here.”
translation:
  language: ml
  text: 'യേശു ഉത്തരം പറഞ്ഞു: “എന്റെ രാജ്യം ഈ ലോകത്തിൽനിന്നുള്ളതല്ല. എന്റെ രാജ്യം ഈ ലോകത്തിൽനിന്നുള്ളതായിരുന്നെങ്കിൽ, എന്നെ യെഹൂദന്മാർക്ക്[a] ഏൽപ്പിക്കാതിരിക്കാൻ എന്റെ സേവകർ പോരാടിക്കൊണ്ടിരിക്കുമായിരുന്നു. എന്നാൽ വാസ്തവത്തിൽ, എന്റെ രാജ്യം ഇവിടെനിന്നുള്ളതല്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “യെഹൂദ്യർക്ക്”; ഇവിടെ കൂടുതൽ പ്രത്യേകമായി യെഹൂദ അധികാരികളെ ഉദ്ദേശിച്ചിരിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: βασιλεία
  choice: രാജ്യം
  rationale: രാജകീയ ഭരണത്തെയും അതിന്റെ മേഖലയെയും ഉൾക്കൊള്ളാൻ കഴിയുന്ന, മലയാളത്തിൽ സ്വാഭാവികവും സ്ഥാപിതവുമായ പദമാണിത്; വാക്യത്തിലെ ആവർത്തനത്തിനും യോജിക്കുന്നു.
- source_word: ἐκ τοῦ κόσμου τούτου
  choice: ഈ ലോകത്തിൽനിന്നുള്ളത്
  rationale: ἐκ സൂചിപ്പിക്കുന്ന ഉറവിടം അഥവാ ഉത്ഭവം നിലനിർത്തുന്നു; രാജ്യം ലോകത്തിൽ സന്നിഹിതമല്ലെന്നല്ല, അതിന്റെ ഉറവിടം ഈ ലോകക്രമമല്ലെന്ന ആശയം അനാവശ്യമായി വ്യാഖ്യാനിക്കാതെ നൽകുന്നു.
- source_word: κόσμος
  choice: ലോകം
  rationale: യോഹന്നാനിലെ പദത്തിന് ദൈവത്തോട് വിരോധമുള്ള നിലവിലെ മനുഷ്യലോകക്രമത്തിന്റെ ധ്വനി ഉണ്ടാകാമെങ്കിലും, നേരിട്ടും വ്യക്തവുമായ മലയാളപരിഭാഷ ‘ലോകം’ തന്നെയാണ്.
- source_word: ὑπηρέται
  choice: സേവകർ
  rationale: അധികാരത്തിൻകീഴിൽ സേവിക്കുന്നവരെ സൂചിപ്പിക്കുന്നു; രാജ്യം എന്ന സന്ദർഭത്തിൽ ഇത് സ്വാഭാവികമാണ്, ഔദ്യോഗിക സേനയെയോ പോലീസിനെയോ അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: ἠγωνίζοντο ἄν
  choice: പോരാടിക്കൊണ്ടിരിക്കുമായിരുന്നു
  rationale: യാഥാർഥ്യവിരുദ്ധമായ സങ്കൽപ്പസ്ഥിതിയിലെ തുടർന്നുകൊണ്ടിരിക്കുന്ന പ്രവർത്തനത്തെ imperfect സഹിതമുള്ള ἄν സൂചിപ്പിക്കുന്നതിനാൽ അതിന്റെ ദൈർഘ്യഭാവം മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἵνα μὴ παραδοθῶ
  choice: എന്നെ … ഏൽപ്പിക്കാതിരിക്കാൻ
  rationale: ഉദ്ദേശ്യത്തെ വ്യക്തമാക്കുകയും παραδίδωμι എന്ന പദത്തിന്റെ കൈമാറൽ/അധികാരികൾക്ക് ഏൽപ്പിക്കൽ എന്ന ന്യായവ്യവഹാരധ്വനി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: τοῖς Ἰουδαίοις
  choice: യെഹൂദന്മാർക്ക്
  rationale: ഗ്രീക്ക് പദത്തിന്റെ വിശാലമായ ലെക്സിക്കൽ അർഥം പ്രധാനവാചകത്തിൽ നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിൽ യെഹൂദ്യരെയോ പ്രത്യേകിച്ച് യെഹൂദ അധികാരികളെയോ ഉദ്ദേശിക്കാം എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: νῦν δὲ
  choice: എന്നാൽ വാസ്തവത്തിൽ
  rationale: മുൻപുള്ള യാഥാർഥ്യവിരുദ്ധ സങ്കൽപ്പത്തോട് നിലവിലെ യഥാർഥ സ്ഥിതിയെ വിരുദ്ധമായി നിർത്തുന്ന പ്രയോഗമാണിത്; വെറും കാലസൂചനയായി തെറ്റിദ്ധരിക്കപ്പെടാതിരിക്കാൻ ഈ രൂപം തെരഞ്ഞെടുത്തു.
- source_word: ἐντεῦθεν
  choice: ഇവിടെനിന്നുള്ളത്
  rationale: ‘ഇവിടെനിന്ന്’ എന്ന സ്ഥല/ഉറവിടസൂചകത നിലനിർത്തുകയും മുൻപുള്ള ‘ഈ ലോകത്തിൽനിന്ന്’ എന്ന പ്രയോഗത്തെ അതേപടി ആവർത്തിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ രാജ്യവും ലോകവും തമ്മിലുള്ള ബന്ധം
  choice: ‘ഈ ലോകത്തിൽനിന്നുള്ളതല്ല’ എന്ന ഉറവിടഭാഷ നിലനിർത്തി.
  alternative: ‘ഈ ലോകത്തിന്റേതല്ല’ / ‘ഈ ലോകത്തിന്റെ ഭാഗമല്ല’
  rationale: വാക്യം യേശുവിന്റെ രാജ്യം ലോകത്തിൽ പ്രവർത്തിക്കുന്നില്ലെന്ന് നിഷേധിക്കുന്നതിനെക്കാൾ അതിന്റെ ഉത്ഭവവും സ്വഭാവവും ഈ ലോകക്രമത്തിൽനിന്നല്ലെന്ന് പറയുന്നു; അതിനാൽ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിച്ചുപറയാതെ സംരക്ഷിക്കുന്നു.
- issue: യോഹന്നാനിലെ Ἰουδαῖοι എന്ന പദത്തിന്റെ സൂചിതർ
  choice: പ്രധാനവാചകത്തിൽ ‘യെഹൂദന്മാർ’ എന്നും സന്ദർഭപരമായ പരിമിത അർഥം അടിക്കുറിപ്പിലും നൽകി.
  alternative: ‘യെഹൂദ്യർ’ / ‘യെഹൂദ അധികാരികൾ’
  rationale: പദത്തിന് പൊതുവായി ‘യെഹൂദന്മാർ’ എന്ന അർഥമുണ്ടെങ്കിലും ഈ സന്ദർഭത്തിൽ യെഹൂദ്യരെയോ അധികാരികളെയോ കൂടുതൽ പ്രത്യേകമായി സൂചിപ്പിക്കാം. പ്രധാനവാചകം ഗ്രീക്കിനോട് ചേർന്നുനിൽക്കുകയും അടിക്കുറിപ്പ് സന്ദർഭസാധ്യത സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായും അതേസമയം ഗൗരവമുള്ളതുമായ ശൈലി. ഉറവിടം/ഉത്ഭവം സൂചിപ്പിക്കുന്ന ആവർത്തനം സംരക്ഷിച്ചു; അതിരുകടന്ന സഭാപരമായോ പുരാതനമായോ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
