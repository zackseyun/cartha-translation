id: JHN.18.34
reference: John 18:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ἀπεκρίθη Ἰησοῦς· ⸂Ἀπὸ σεαυτοῦ⸃ σὺ τοῦτο λέγεις ἢ ἄλλοι ⸂εἶπόν σοι⸃ περὶ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/034.yaml
  text: Jesus answered[a], “Are you saying this on your own, or did others tell you about me?”
translation:
  language: ml
  text: 'യേശു മറുപടി പറഞ്ഞു: “നീ ഇത് സ്വന്തമായി പറയുന്നതാണോ, അതോ മറ്റുള്ളവർ എന്നെക്കുറിച്ച് നിന്നോടു പറഞ്ഞതാണോ?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: മറുപടി പറഞ്ഞു
  rationale: ചോദ്യത്തോടുള്ള പ്രതികരണം സൂചിപ്പിക്കുന്ന സാധാരണ ആഖ്യാനപ്രയോഗം; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: Ἀπὸ σεαυτοῦ
  choice: നീ സ്വയം
  rationale: ἀπόയും ആത്മവാചക സർവനാമവും ചേർന്ന് പ്രസ്താവനയുടെ ഉറവിടം പീലാത്തോസ് തന്നെയാണോ എന്നു ചോദിക്കുന്നു. ‘നീ സ്വയം’ ഈ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: σὺ
  choice: നീ
  rationale: ഗ്രീക്കിലെ പ്രത്യക്ഷ സർവനാമത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: τοῦτο
  choice: ഇതു
  rationale: പീലാത്തോസിന്റെ തൊട്ടുമുമ്പത്തെ ചോദ്യത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: λέγεις
  choice: പറയുന്നതാണോ
  rationale: നിലവിലെ സംഭാഷണത്തിൽ ഉന്നയിച്ച പ്രസ്താവനയെക്കുറിച്ചുള്ള ചോദ്യം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἢ
  choice: അതോ
  rationale: രണ്ട് സാധ്യതകൾ തമ്മിലുള്ള ബദൽ വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാള സംയോജകം.
- source_word: ἄλλοι
  choice: മറ്റുള്ളവർ
  rationale: പീലാത്തോസല്ലാത്ത അനിശ്ചിത വ്യക്തികളെ സംക്ഷിപ്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: εἶπόν σοι
  choice: നിന്നോടു പറഞ്ഞതാണോ
  rationale: λέγωയുടെ ദത്തിവോടുകൂടിയ പ്രയോഗം ഇവിടെ ഒരാളോടു വിവരം പറയുക എന്ന അർഥത്തിലാണ്; സന്ദർഭത്തിൽ ഭൂതകാലസൂചന നിലനിർത്തുന്നു.
- source_word: περὶ ἐμοῦ
  choice: എന്നെക്കുറിച്ച്
  rationale: περί + genitive എന്നതിന്റെ സാധാരണ അർഥമായ ‘എന്നെ സംബന്ധിച്ച്/എന്നെക്കുറിച്ച്’ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ ചോദ്യത്തിന്റെ ഉദ്ദേശ്യം
  choice: പീലാത്തോസിന്റെ വാക്ക് അവനിൽനിന്നുതന്നെ ഉണ്ടായതാണോ, മറ്റുള്ളവരിൽനിന്നു ലഭിച്ചതാണോ എന്ന ഉറവിടചോദ്യം മാത്രമായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘നിന്റെ സ്വന്തം മുൻകൈയിലാണോ നീ ഇതു ചോദിക്കുന്നത്?’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക രൂപം.
  rationale: ഗ്രീക്ക് വാചകം പീലാത്തോസിന്റെ വിശാലമായ ഉദ്ദേശ്യങ്ങളേക്കാൾ അവന്റെ പ്രസ്താവനയുടെ ഉറവിടത്തെയാണ് നേരിട്ട് ചോദിക്കുന്നത്; അതിനാൽ വ്യാഖ്യാനാതീതമായ ദൈവശാസ്ത്രപരമായ നിഗമനങ്ങൾ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ സംഭാഷണശൈലി. ‘നീ സ്വയം’ എന്ന പ്രയോഗം ഊന്നലും ഉറവിടസൂചനയും ഒരുമിച്ച് നിലനിർത്തുന്നതിനാൽ പ്രത്യേക അടിക്കുറിപ്പ് ആവശ്യമില്ല.
