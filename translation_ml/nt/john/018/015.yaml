  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘അതുകൊണ്ട്’ എന്നത് പരിചയം ഉണ്ടായിരുന്നതും പ്രവേശിക്കാൻ കഴിഞ്ഞതും തമ്മിലുള്ള സന്ദർഭബന്ധം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ശക്തമായ കാരണവാദമാക്കാൻ ഉദ്ദേശിച്ചിട്ടില്ല.
