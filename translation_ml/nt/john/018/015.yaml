  text: Simon Peter was following Jesus[a], and so was another disciple. That disciple was known to the high priest, and he went in with Jesus into the courtyard of the high priest,
translation:
  language: ml
  text: ശിമോൻ പത്രോസും മറ്റൊരു ശിഷ്യനും യേശുവിനെ അനുഗമിച്ചുകൊണ്ടിരുന്നു[a]. ആ ശിഷ്യൻ മഹാപുരോഹിതനു പരിചിതനായിരുന്നു; അവൻ യേശുവിനോടൊപ്പം മഹാപുരോഹിതന്റെ അങ്കണത്തിലേക്കു പ്രവേശിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: ‘ശിമോൻ പത്രോസ് യേശുവിനെ അനുഗമിച്ചുകൊണ്ടിരുന്നു, മറ്റൊരു ശിഷ്യനും.’ രണ്ടാമത്തെ ശിഷ്യനും അതേ പ്രവൃത്തി ചെയ്തുവെന്നത് ഗ്രീക്കിൽ പരോക്ഷമായി മനസ്സിലാക്കേണ്ടതാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἠκολούθει
  choice: അനുഗമിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലരൂപം കഥയിലെ തുടർന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നതിനാൽ ഈ പ്രയോഗം അതിന്റെ ദൈർഘ്യഭാവം നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: ഇവിടെ ഇത് ശക്തമായ വിരോധമല്ല, മൃദുവായ ആഖ്യാനബന്ധമാണ്; മലയാളത്തിലെ വാക്യക്രമവും വിരാമചിഹ്നവും ആ ബന്ധം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: καὶ ἄλλος μαθητής
  choice: മറ്റൊരു ശിഷ്യനും യേശുവിനെ അനുഗമിച്ചിരുന്നു
  rationale: രണ്ടാമത്തെ ശിഷ്യനും അതേ പ്രവൃത്തിയിൽ പങ്കാളിയാണെന്ന ഗ്രീക്കിൽ പരോക്ഷമായിരിക്കുന്ന ആശയം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി പറയുന്നു.
- source_word: μαθητής
  choice: ശിഷ്യൻ
  rationale: യോഹന്നാന്റെ സുവിശേഷത്തിൽ യേശുവിന്റെ പഠിതാവും അനുയായിയുമായ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സ്ഥിരവും പ്രസക്തവുമായ മലയാളപദം.
- source_word: ἐκεῖνος
  choice: ആ
  rationale: മുമ്പു പറഞ്ഞ മറ്റൊരു ശിഷ്യനെ തിരിച്ചുസൂചിപ്പിക്കുന്ന നിർദേശകശക്തി സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: γνωστὸς
  choice: പരിചയമുള്ളവൻ
  rationale: മഹാപുരോഹിതന് ആ ശിഷ്യനെ അറിയാമായിരുന്നു എന്ന അർഥം നൽകുന്നു; ‘അടുത്ത സുഹൃത്ത്’ എന്നതുപോലെ ബന്ധത്തിന്റെ ആഴം അതിരുകടന്ന് സൂചിപ്പിക്കുന്നില്ല.
- source_word: ἀρχιερεῖ / ἀρχιερέως
  choice: മഹാപുരോഹിതൻ / മഹാപുരോഹിതന്റെ
  rationale: ഈ സന്ദർഭത്തിലെ ഏകവചന ἀρχιερεύς എന്ന പദത്തിന്റെ പതിവും വ്യക്തവുമായ മലയാളരൂപം.
- source_word: συνεισῆλθεν
  choice: യേശുവിനോടൊപ്പം ... പ്രവേശിച്ചു
  rationale: σύν എന്ന ഘടകത്തിലെ ഒരുമിച്ചുള്ള പ്രവേശനത്തിന്റെ ആശയം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: αὐλήν
  choice: അങ്കണം
  rationale: മഹാപുരോഹിതന്റെ വസതിയോടു ചേർന്ന ചുറ്റുമതിലുള്ള തുറന്ന മുറ്റത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സംക്ഷിപ്തവുമായ പദം.
