id: JHN.18.13
reference: John 18:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸀ἤγαγον πρὸς Ἅνναν πρῶτον· ἦν γὰρ πενθερὸς τοῦ Καϊάφα, ὃς ἦν ἀρχιερεὺς τοῦ ἐνιαυτοῦ ἐκείνου·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/013.yaml
  text: And they led him first to Annas, for he was the father-in-law of Caiaphas, who was high priest that year.
translation:
  language: ml
  text: അവർ യേശുവിനെ ആദ്യം ഹന്നാസിന്റെ അടുക്കലേക്ക് കൊണ്ടുപോയി. ഹന്നാസ് ആ വർഷം മഹാപുരോഹിതനായിരുന്ന കയ്യഫാവിന്റെ അമ്മായിയപ്പനായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤγαγον
  choice: കൊണ്ടുപോയി
  rationale: ἄγω ഇവിടെ കാവലിൽ ഒരിടത്തേക്കു മാറ്റുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘കൊണ്ടുപോയി’ എന്നത് സ്വാഭാവികമായി ഈ അർഥം നൽകുന്നു; സന്ദർഭത്തിൽനിന്നു വ്യക്തമാകുന്ന കർമം ‘യേശുവിനെ’ എന്നു ചേർത്തു.
- source_word: πρὸς Ἅνναν
  choice: ഹന്നാസിന്റെ അടുക്കലേക്കു
  rationale: പ്രത്യയത്തോടുകൂടിയ πρός ഒരാളുടെ അടുത്തേക്കുള്ള ചലനമാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ‘അടുക്കലേക്കു’ അത് വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: πρῶτον
  choice: ആദ്യം
  rationale: സംഭവക്രമത്തിലെ ആദ്യ ലക്ഷ്യസ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന ക്രിയാവിശേഷണപ്രയോഗം.
- source_word: πενθερὸς
  choice: അമ്മായിയപ്പൻ
  rationale: πενθερός ഭാര്യയുടെ പിതാവിനെ കൃത്യമായി സൂചിപ്പിക്കുന്നു; ആ ബന്ധത്തിന് സ്വാഭാവികമായ ആധുനിക മലയാളപദം ‘അമ്മായിയപ്പൻ’ ആണ്.
- source_word: ἀρχιερεὺς
  choice: മഹാപുരോഹിതൻ
  rationale: യഹൂദ മഹാപുരോഹിതപദവിക്കുള്ള സ്ഥാപിതവും വ്യക്തവുമായ മലയാളസമാനപദം.
- source_word: τοῦ ἐνιαυτοῦ ἐκείνου
  choice: ആ വർഷത്തെ
  rationale: കാലസൂചനയെ മലയാളത്തിൽ സ്വാഭാവികമായി മഹാപുരോഹിതപദവിയോടു ബന്ധിപ്പിക്കുന്നു.
- source_word: Ἅνναν
  choice: ഹന്നാസ്
  rationale: വ്യക്തിനാമം മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: Καϊάφα
  choice: കയ്യഫാവ്
  rationale: വ്യക്തിനാമം മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
theological_decisions:
- issue: ‘ആ വർഷത്തെ മഹാപുരോഹിതൻ’ എന്ന ബന്ധവാക്യത്തിന്റെ സൂചിതവ്യക്തി
  choice: ബന്ധവാക്യം കയ്യഫാവിനെയാണ് വിശേഷിപ്പിക്കുന്നത്.
  alternative: മലയാള വാക്യഘടന വ്യക്തമല്ലെങ്കിൽ അത് ഹന്നാസിനെ സൂചിപ്പിക്കുന്നതായി തെറ്റിദ്ധരിക്കാം.
  rationale: ഗ്രീക്കിലെ ὃς ഏറ്റവും സ്വാഭാവികമായി തൊട്ടുമുമ്പുള്ള Καϊάφα-യെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ആ വർഷത്തെ മഹാപുരോഹിതനായിരുന്ന കയ്യഫാവിന്റെ അമ്മായിയപ്പൻ’ എന്ന ഘടന ഈ ബന്ധം അവ്യക്തമാകാതെ കാത്തുസൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘അവർ’ എന്ന ബഹുവചന കർത്താവും ‘യേശുവിനെ’ എന്ന സന്ദർഭസിദ്ധമായ കർമവും വ്യക്തതയ്ക്കായി നൽകിയിരിക്കുന്നു. ദീർഘമായ ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് മലയാളവാക്യങ്ങളാക്കി.
