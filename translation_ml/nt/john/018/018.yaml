source:
  edition: SBLGNT
  text: εἱστήκεισαν δὲ οἱ δοῦλοι καὶ οἱ ὑπηρέται ἀνθρακιὰν πεποιηκότες, ὅτι ψῦχος ἦν, καὶ ἐθερμαίνοντο· ἦν δὲ ⸂καὶ ὁ Πέτρος μετ’ αὐτῶν⸃ ἑστὼς καὶ θερμαινόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/018.yaml
  text: The servants and the officers were standing there[a], having made a charcoal fire because it was cold, and they were warming themselves[b]. Peter also was standing with them and warming himself.
translation:
  language: ml
  text: അടിമകളും[a] കാവൽക്കാരും[b] അവിടെ നിന്നിരുന്നു; തണുപ്പായിരുന്നതിനാൽ അവർ കരിക്കനൽ തീ ഉണ്ടാക്കി ചൂട് കായുകയായിരുന്നു. പത്രോസും അവരോടൊപ്പം നിന്നുകൊണ്ട് ചൂട് കായുകയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദാസന്മാർ’. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദം മറ്റൊരാളുടെ ഉടമസ്ഥതയിലോ ബന്ധിത സേവനത്തിലോ ഉണ്ടായിരുന്നവരെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഔദ്യോഗിക പരിചാരകർ’. മഹാപുരോഹിതന്റെ സ്ഥാപനവുമായി ബന്ധപ്പെട്ട് ഔദ്യോഗിക ചുമതലകൾ നിർവഹിച്ചിരുന്നവരെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്; ‘കാവൽക്കാർ’ എന്നത് സന്ദർഭാനുസൃതമായ വിവർത്തനമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: അടിമകൾ
  rationale: ഗൃഹത്തിലെ ബന്ധിതമായ സാമൂഹികനില വ്യക്തമാക്കാൻ ‘ദാസന്മാർ’ എന്നതിനെക്കാൾ ‘അടിമകൾ’ മൂലപദത്തിന്റെ സാധാരണ അർഥം കൂടുതൽ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ὑπηρέται
  choice: കാവൽക്കാർ
  rationale: യോഹന്നാനിലെ ഈ പദം അധികാരികളുടെ കീഴിൽ പ്രവർത്തിക്കുന്ന ഔദ്യോഗിക പരിചാരകരെയും പിടികൂടൽ പോലുള്ള ചുമതലകൾ നിർവഹിക്കുന്നവരെയും സൂചിപ്പിക്കാറുണ്ട്. സന്ദർഭത്തിൽ ‘കാവൽക്കാർ’ സ്വാഭാവികമാണ്; പദത്തിന്റെ വിശാലത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἀνθρακιὰν
  choice: കരിത്തീ
  rationale: തീയുടെ ഇന്ധനം കരിയാണെന്ന വ്യക്തമായ വിവരണം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു; ഈ വിശദാംശം യോഹന്നാന്റെ വിവരണത്തിൽ പ്രസക്തമാണ്.
- source_word: πεποιηκότες
  choice: ഉണ്ടാക്കി
  rationale: മുമ്പ് പൂർത്തിയായ പ്രവൃത്തിയും അതിന്റെ ഇപ്പോഴത്തെ ഫലമായ തീയും മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ὅτι ψῦχος ἦν
  choice: തണുപ്പായിരുന്നതിനാൽ
  rationale: തീ ഉണ്ടാക്കുന്നതിനും തീ കായുന്നതിനുമുള്ള കാരണം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἐθερμαίνοντο
  choice: തീ കായുകയായിരുന്നു
  rationale: നടന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയെ സ്വാഭാവികമായ മലയാളപ്രയോഗത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἦν δὲ καὶ ὁ Πέτρος μετ’ αὐτῶν
  choice: പത്രോസും അവരോടൊപ്പം
  rationale: καί നൽകുന്ന ഉൾപ്പെടുത്തൽ ഊന്നൽ ‘-ഉം’ മുഖേനയും μετ’ αὐτῶν എന്ന ബന്ധം ‘അവരോടൊപ്പം’ എന്നതിലൂടെയും നിലനിർത്തുന്നു.
- source_word: ἑστὼς
  choice: നിന്നു
  rationale: പത്രോസിന്റെ നില്പ് ലളിതവും നേരിട്ടുമായി അറിയിക്കുന്നു; തുടർന്ന് വരുന്ന തുടർച്ചയായ പ്രവൃത്തിയോടു ചേർന്ന് മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: θερμαινόμενος
  choice: തീ കായുകയായിരുന്നു
  rationale: പത്രോസ് തുടർച്ചയായി തീ കായുന്ന പ്രവൃത്തി മുൻവാക്യത്തോട് സമാന്തരമായി നിലനിർത്തുന്നു.
- source_word: δέ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: ഇവിടെ δέ നേരിയ വിവരണബന്ധം മാത്രമാണ് നൽകുന്നത്. മലയാളത്തിൽ വാക്യക്രമം തന്നെ ആ ബന്ധം സ്വാഭാവികമായി വഹിക്കുന്നതിനാൽ ‘എന്നാൽ’ പോലുള്ള ശക്തമായ വൈരുധ്യം ചേർത്തിട്ടില്ല.
