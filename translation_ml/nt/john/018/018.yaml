  terminology: ‘അടിമകൾ’ appropriately renders δοῦλοι in keeping with the stated lexical policy. ‘കാവൽക്കാർ’ is contextually viable for ὑπηρέται, provided the footnote retains the broader sense of official attendants. ‘കരിക്കനൽ തീ’ is a clear, natural expression for a charcoal fire.
