translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, മാന്യമായ വിവരണശൈലി സ്വീകരിച്ചു. ‘തീ കായുക’ എന്ന സ്വാഭാവിക മലയാളപ്രയോഗം ആവർത്തിച്ച് ഗ്രീക്കിലെ സമാന്തരത നിലനിർത്തി. മൂലത്തിൽ ഇല്ലാത്ത ‘ഇപ്പോൾ’ എന്ന കാലസൂചകമോ ശക്തമായ വൈരുധ്യബന്ധകമോ ചേർത്തിട്ടില്ല.
